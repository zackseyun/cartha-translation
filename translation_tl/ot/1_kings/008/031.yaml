base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: tl
  text: Kung ang isang tao ay magkasala laban sa kaniyang kapwa, at isang panunumpa[a] ang ipataw sa kaniya upang siya'y pasumpain, at ang panunumpa ay iharap sa iyong altar sa bahay na ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumpa”; ang salitang Hebreo ay maaaring tumukoy sa mismong panunumpa o sa sumpang ipapataw kapag nilabag ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: magkasala
  rationale: Pinananatili nito ang moral at panrelihiyong bigat ng חטא, habang natural sa makabagong Tagalog.
- source_word: אִישׁ
  choice: isang tao
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, karaniwan itong ginagamit bilang pangkalahatang pagtukoy sa sinumang tao; natural at tumpak sa Tagalog ang 'isang tao'.
- source_word: לְרֵעֵהוּ
  choice: laban sa kaniyang kapwa
  rationale: Ang רֵעַ ay kapwa, kasama, o kapitbahay; malinaw na naipapahayag ng 'kapwa' ang ugnayang pantao rito.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: at atangan siya ng isang sumpang panunumpa
  rationale: Pinananatili ng 'atangan siya' ang pasibong diwa ng idyomang Hebreo, at inilalahad ng 'sumpang panunumpa' ang magkaugnay na kahulugan ng אָלָה bilang panunumpa at sumpang kaakibat nito.
- source_word: לְהַאֲלֹתוֹ
  choice: upang pasumpain siya
  rationale: Sinasalamin ng causative na anyo ang pagpapasumpa sa taong nasasakdal, nang hindi inuulit nang mabigat ang buong parirala.
- source_word: וּבָא אָלָה
  choice: at ang sumpang panunumpa ay dumating
  rationale: Pinananatiling simuno ang אָלָה, gaya ng pinakanatural na pagbasa sa sintaks na Hebreo, pati ang larawan ng pagdating nito sa harap ng Diyos.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: sa harap ng iyong altar
  rationale: Tuwirang katumbas at likas na pahayag sa Tagalog para sa pook at hudisyal na tagpo.
- source_word: בַּבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Pinananatili ang literal at teolohikal na taginting ng בַּיִת bilang 'bahay,' kahit templo ang tinutukoy sa konteksto.
theological_decisions:
- issue: Kahulugan ng אָלָה sa kontekstong hudisyal sa templo
  choice: sumpang panunumpa
  alternative: panunumpa; sumpa
  rationale: Maaaring tukuyin ng אָלָה ang mismong panunumpa o ang sumpang ipinapataw kapag nilabag o pinasinungalingan iyon. Iniiwasan ng pinagsamang parirala na alisin ang alinman sa dalawang tunay na diwa ng salita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'kaniyang' at ang bahagyang pormal na 'atangan' upang mapanatili ang solemne at hudisyal na tono. Walang talababa sapagkat ang 'sumpang panunumpa' ay naghahayag na sa pangunahing teksto ng leksikal na tensiyon sa אָלָה.
