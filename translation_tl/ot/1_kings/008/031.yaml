  terminology: Pinananatili ang “magkasala,” “kapwa,” “panunumpa,” “altar,” at “bahay.” Ang “panunumpa” ang pangunahing salin para sa אָלָה sa kontekstong ito; ang posibilidad na “sumpa” ay dapat ilagay sa talababa, hindi pagsamahin bilang isang bagong tambalang parirala.
