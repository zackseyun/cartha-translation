source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: tl
  text: Noong araw na iyon, itinalaga ng hari bilang banal ang gitnang bahagi[a] ng patyo na nasa harap ng bahay ni Yahweh. Doon niya inihandog ang handog na sinusunog, ang handog na butil, at ang matatabang bahagi ng mga handog para sa kapayapaan[b], sapagkat napakaliit ng tansong altar na nasa harap ni Yahweh upang paglagyan ang handog na sinusunog, ang handog na butil, at ang matatabang bahagi ng mga handog para sa kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang gitna ng patyo.”
    reason: lexical_alternative
  - marker: b
    text: O, “ang taba ng mga handog para sa kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: itinalaga ... bilang banal
  rationale: Ipinahahayag nito ang pagbubukod sa lugar para sa sagradong gamit, habang nananatiling malinaw at likas sa makabagong Tagalog.
- source_word: תּוֹךְ הֶחָצֵר
  choice: ang gitnang bahagi ng patyo
  rationale: Ang תּוֹךְ ay tumutukoy sa gitna o kaloob-loobang bahagi; ang pariralang ito ay malinaw na panlarawang lokasyon.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: sa harap ng bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang 'bahay' para sa templo at ang panlunan na kahulugan ng לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng titulo.
- source_word: עָשָׂה שָׁם
  choice: Doon niya inihandog
  rationale: Sa konteksto ng paghahain, ang pangkalahatang pandiwang עשה ay likas na nangangahulugang isagawa o ihandog ang mga hain.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Malinaw na ipinapakita ang karaniwang uri ng haing עֹלָה nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: הַמִּנְחָה
  choice: ang handog na butil
  rationale: Sa kontekstong pansamba, tumutukoy ito sa handog na mula sa butil; mas tiyak ito kaysa sa payak na 'handog.'
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: ang mga taba ng mga handog para sa kapayapaan
  rationale: Pinananatili ang kongkretong maramihang 'mga taba' at ang tradisyonal ngunit malinaw na diwa ng שְׁלָמִים bilang mga handog para sa kapayapaan.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: ang tansong altar
  rationale: Ang 'tanso' ang natural at karaniwang salin sa Tagalog para sa metal ng kagamitang pansamba rito.
- source_word: קָטֹן מֵהָכִיל
  choice: napakaliit ... upang magkasya roon
  rationale: Ipinahahayag ng konstruksyon ang kakulangan ng kapasidad; natural sa Tagalog ang 'napakaliit upang magkasya roon.'
theological_decisions:
- issue: Paglalarawan sa pagkilos na קִדַּשׁ
  choice: itinalaga ... bilang banal
  alternative: pinabanal
  rationale: Iniiwasan nitong ipakahulugan kung likas na kabanalan o ritwal na pagbubukod ang diin; malinaw nitong ipinapakita ang pagtatalaga sa sagradong gamit.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ng 'Yahweh' ang pagkakaiba nito sa isang titulo.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa mabuting pagsasamahan
  rationale: Pinananatili ang malawak na diwa ng ugat na may kaugnayan sa kapayapaan at kabuuan, nang hindi nililimitahan ito sa iisang teolohikal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'patyo,' 'altar,' at mga buong pariralang panritwal upang maging pamilyar ngunit hindi labis na teknikal. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
