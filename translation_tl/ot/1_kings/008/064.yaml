revisions:
- from: Nang araw na iyon, itinalaga ng hari bilang banal ang gitnang bahagi ng patyo sa harap ng bahay ni Yahweh[a]. Doon niya inihandog ang handog na sinusunog, ang handog na butil, at ang mga taba ng mga handog para sa kapayapaan[b], sapagkat napakaliit ng tansong altar sa harap ni Yahweh upang magkasya roon ang handog na sinusunog, ang handog na butil, at ang mga taba ng mga handog para sa kapayapaan.
  to: Noong araw na iyon, itinalaga ng hari bilang banal ang gitnang bahagi[a] ng patyo na nasa harap ng bahay ni Yahweh. Doon niya inihandog ang handog na sinusunog, ang handog na butil, at ang matatabang bahagi ng mga handog para sa kapayapaan[b], sapagkat napakaliit ng tansong altar na nasa harap ni Yahweh upang paglagyan ang handog na sinusunog, ang handog na butil, at ang matatabang bahagi ng mga handog para sa kapayapaan.
