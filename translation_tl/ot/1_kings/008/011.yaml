base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: tl
  text: At hindi makatayong maglingkod ang mga pari dahil sa ulap,[a] sapagkat pinuno ng kaluwalhatian ni Yahweh ang bahay ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi makapanatiling nakatayo upang maglingkod.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: makatayo
  rationale: Kasama ng negasyong לֹא, ipinahahayag nito ang kawalan ng kakayahan; natural sa Tagalog ang hulma na “hindi makatayong.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang tawag sa mga paring naglilingkod sa templo sa kontekstong ito.
- source_word: לַעֲמֹד
  choice: tumayo
  rationale: Pinananatili ang literal na diwang “tumayo,” habang kinikilala sa talababa na maaari rin itong magpahiwatig ng pananatiling nakatayo sa puwesto.
- source_word: לְשָׁרֵת
  choice: maglingkod
  rationale: Natural at malinaw na Tagalog para sa pormal na paglilingkod ng mga pari sa templo.
- source_word: מִפְּנֵי הֶעָנָן
  choice: dahil sa ulap
  rationale: Idyomatikong ipinahahayag ng parirala ang sanhi ng hindi nila kakayahang maglingkod.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa naunang pahayag sa isang marangal ngunit kasalukuyang rehistro.
- source_word: מָלֵא
  choice: pinuno
  rationale: Inilalarawan ng pandiwa ang ganap na pagpuno sa bahay; ang aktibong ayos ay natural sa Tagalog at malinaw na ang kaluwalhatian ang gumaganap.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Pinananatili ang larawang teolohikal ng כָּבוֹד bilang kaluwalhatian, nang hindi ito ipinapakahulugan lamang bilang “presensya.”
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ang literal na “bahay” ng Hebreo at ipinapaliwanag sa talababa na templo ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh sa halip na palitan ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  alternative: ang presensya ni Yahweh
  rationale: Ang “kaluwalhatian” ay mas tuwirang tumutugma sa כָּבוֹד at pinananatili ang makapangyarihang larawan nang hindi nilulutas ang ugnayan nito sa banal na presensya.
- issue: Pagbibigay ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan na nasa tekstong Hebreo at iniiwasang palitan ito ng titulong wala sa mismong parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang likas na ayos na “hindi makatayong maglingkod,” habang pinanatili sa talababa ang posibleng diwa ng pananatiling nakatayo. Ang literal na “bahay ni Yahweh” ay pinanatili dahil mahalaga ang imahen nito sa Hebreo.
