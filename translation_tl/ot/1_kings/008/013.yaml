  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: tl
  text: Tunay ngang ipinagtayo kita ng isang maringal na bahay[a], isang matatag na lugar[b] na tatahanan mo magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang mataas at marangal na tahanan.” Ang Hebreong זְבֻל ay tumutukoy sa isang dakila o mataas na tahanan.
    reason: lexical_alternative
  - marker: b
    text: O “isang permanenteng lugar” o “isang itinakdang lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Tunay ngang ipinagtayo
  rationale: Ang infinitive absolute bago ang pandiwang may takdang anyo ay nagbibigay-diin sa kilos. Likas na ipinahahayag sa Tagalog ng “tunay nga” ang diin nang hindi inuulit nang alanganin ang pandiwa.
- source_word: בֵּית
  choice: bahay
  rationale: Pinananatili ang literal na “bahay” sa halip na gawing “templo,” sapagkat mahalaga sa talata ang larawan ng bahay na tirahan ng Diyos.
- source_word: זְבֻל
  choice: maringal
  rationale: Tumutukoy ang salita sa isang mataas, marangal, o dakilang tahanan. Ang “maringal” ay natural at marangal pakinggan sa makabagong Tagalog at angkop na naglalarawan sa “bahay.”
- source_word: לָךְ
  choice: kita
  rationale: Ipinahihiwatig ng pariralang “ipinagtayo kita” na ang bahay ay itinayo para sa Diyos, habang pinananatili ang tuwirang pakikipag-usap sa kaniya.
- source_word: מָכוֹן
  choice: isang matatag na lugar
  rationale: Ang salita ay tumutukoy sa isang itinakda, matibay, o matatag na dako. Ipinahahayag ng “matatag na lugar” ang pagiging permanente nito nang hindi inuulit ang ideya ng tirahan.
- source_word: לְשִׁבְתְּךָ
  choice: na tatahanan mo
  rationale: Maaaring mangahulugan ang ישׁב na umupo o manahan. Sa konteksto ng bahay, malinaw at natural ang “tatahanan mo,” habang hindi ganap na isinasara ang kaugnay na pahiwatig ng pagluklok.
- source_word: עוֹלָמִים
  choice: magpakailanman
  rationale: Natural na ipinahahayag nito sa Tagalog ang pinatinding diwa ng walang hanggang tagal.
theological_decisions:
- issue: Kung dapat bang bawasan o ipaliwanag ang pahayag na ang templo ay tirahan ng Diyos
  choice: Pinanatili ang tuwirang wikang nagsasabing tatahan ang Diyos doon magpakailanman
  alternative: Gawing “lugar na tatahanan ng iyong pangalan” o “lugar kung saan ka sasambahin”
  rationale: Tahasang binabanggit ng Hebreo ang isang bahay at isang lugar na tatahanan ng Diyos. Hindi dapat ipasok sa mismong talata ang mga paliwanag mula sa mas malawak na konteksto.
- issue: Kung ang לְשִׁבְתְּךָ ay dapat unawain bilang paninirahan o pagluklok
  choice: na tatahanan mo
  alternative: na pagluluklukan mo
  rationale: Ang ugat ay maaaring tumukoy sa pag-upo o paninirahan, at maaaring magpahiwatig ng pagluklok sa konteksto ng templo. Gayunman, ang “tatahanan” ang pinakadirektang katugma ng larawan ng bahay at pinananatili ang pangunahing kahulugan nang hindi ipinipilit ang mas tiyak na interpretasyon.
translation_notes:
  register: Makabago at dignified na Filipino Tagalog. Ginamit ang “ipinagtayo kita” bilang natural na paraan ng pagsasabing itinayo ang bahay para sa tuwirang kinakausap na Diyos. Iniwasan ang “templo” upang mapanatili ang larawan ng “bahay,” at iniwasan din ang masyadong teknikal o makalumang pananalita.
