  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: tl
  text: Ngunit bigyang-pansin mo ang panalangin ng iyong lingkod at ang kanyang pagsusumamo, Yahweh na aking Diyos, upang dinggin mo ang daing at ang panalanging iniaalay ng iyong lingkod sa iyong harapan ngayon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Ngunit pakinggan mo
  rationale: Literal itong may larawang ‘bumaling,’ ngunit sa konteksto ng panalangin ay humihiling na bigyang-pansin at dinggin ng Diyos ang panalangin. Mas natural sa modernong Tagalog ang ‘pakinggan mo,’ habang ipinahihiwatig ng ‘Ngunit’ ang banayad na pagsalungat sa naunang pagkilala sa kadakilaan ng Diyos.
- source_word: תְּפִלַּת
  choice: ang panalangin
  rationale: Direkta at karaniwang katumbas ng salitang tumutukoy sa panalangin ni Solomon.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Sa pakikipag-usap sa Diyos, ipinapahayag nito ang mapagpakumbabang paglilingkod; pinanatili rin ang parehong salin sa dalawang paglitaw.
- source_word: תְּחִנָּתוֹ
  choice: ang kanyang pagsusumamo
  rationale: Tumutukoy sa taimtim na paghingi ng awa o lingap. Ang ‘pagsusumamo’ ay marangal at malinaw sa kontekstong panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָי
  choice: aking Diyos
  rationale: Direktang salin ng pangngalang may panandang unang panauhang paari.
- source_word: לִשְׁמֹעַ
  choice: at dinggin mo
  rationale: Ang infinitive ay nagpapahayag ng layunin ng kahilingang pakinggan ng Diyos ang panalangin. Ang ‘dinggin’ ay natural na tumutukoy sa pakikinig na may pagtugon sa isang pakiusap.
- source_word: הָרִנָּה
  choice: ang daing
  rationale: Maaaring tumukoy sa isang malakas o umaalingawngaw na sigaw. Sa parallel na konteksto ng panalangin, ang ‘daing’ ay naghahatid ng taimtim na pagdaing sa Diyos nang hindi ito ginagawang awit.
- source_word: הַתְּפִלָּה
  choice: ang panalangin
  rationale: Pinanatili ang pag-uulit ng Hebreo upang maipakita ang paralelismo ng talata.
- source_word: מִתְפַּלֵּל
  choice: idinadalangin
  rationale: Ipinakikita ng anyong pandiwari ang kasalukuyan o nagpapatuloy na kilos; natural itong naipapahayag sa Tagalog sa ‘idinadalangin.’
- source_word: לְפָנֶיךָ
  choice: sa harapan mo
  rationale: Malapit sa konkretong pahayag ng Hebreo at natural sa konteksto ng paglapit sa presensya ng Diyos.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na modernong Tagalog para sa temporal na sanggunian ng ‘sa araw na ito.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pagsusumamo’ at ‘dinggin’ bilang pormal ngunit pamilyar na bokabularyo sa panalangin. Walang talababa dahil hindi kailangang ilantad sa tekstong ito ang mga alternatibong leksikal upang mapanatili ang tunay na diwa o kalabuan.
