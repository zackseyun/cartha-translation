  to: Ngunit bigyang-pansin mo ang panalangin ng iyong lingkod at ang kanyang pagsusumamo, Yahweh na aking Diyos, upang dinggin mo ang daing at ang panalanging iniaalay ng iyong lingkod sa iyong harapan ngayon.
  rationale: Pinalitan ang unang pandiwa ng “bigyang-pansin mo” upang maipakita ang pagbaling o pagbibigay-pansin na hinihiling ng וּפָנִיתָ nang natural sa Tagalog. Ginawang “upang dinggin mo” ang kasunod upang maipakita ang layuning ipinahihiwatig ng לִשְׁמֹעַ. Ginamit ang “panalanging iniaalay” bilang likas na Tagalog na katumbas sa kontekstong panalangin para sa nagpapatuloy na מִתְפַּלֵּל, habang pinanatili ang panalangin, daing, at temporal na “ngayon.”
