  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sinaunang pangalang “Etanim” at ang pagkakasunod ng mga pariralang pangpanahon nang hindi dinaragdagan ang pagkakakilanlan ng kapistahan.
