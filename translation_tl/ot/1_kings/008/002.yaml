base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/002.yaml
  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: tl
  text: At nagtipon sa harap ni Haring Solomon ang lahat ng kalalakihan ng Israel sa kapistahan, sa buwan ng Etanim, na siyang ikapitong buwan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: At nagtipon
  rationale: Tuwirang ipinapahayag ang pagtitipon ng kapulungan at pinananatili ang dugtong na salaysay ng waw.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: sa harap ni Haring Solomon
  rationale: Sa konteksto ng opisyal na pagtitipon sa hari, natural na Filipino ang “sa harap ni” at tumutugma sa diwa ng pagharap o pagtipon sa kaniya.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ang lahat ng kalalakihan ng Israel
  rationale: Pinananatili ang tahasang panlalaking anyo ng אִישׁ sa halip na palawakin ito sa lahat ng mamamayan.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: sa buwan ng Etanim
  rationale: Isinalin ang יֶרַח bilang “buwan” at tinumbasan sa baybay-Filipino ang sinaunang pangalan ng buwan.
- source_word: בֶּחָג
  choice: sa kapistahan
  rationale: Ang tiyak na anyo sa konteksto ay tumutukoy sa kilalang kapistahan; hindi tinukoy kung alin dahil hindi ito tahasang pinangalanan sa talata.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: na siyang ikapitong buwan
  rationale: Natural at tapat na paglalahad ng paliwanag na ang Etanim ang ikapitong buwan.
