base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: tl
  text: na tumupad sa iyong lingkod na si David, na aking ama, sa iyong sinabi sa kanya[a]. Nagsalita ka sa pamamagitan ng iyong bibig, at isinakatuparan mo ito sa pamamagitan ng iyong kamay[b], gaya ng nangyayari ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “sa iyong lingkod” bilang “para sa iyong lingkod.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nagsalita ka sa pamamagitan ng iyong bibig, at sa pamamagitan ng iyong kamay ay isinakatuparan mo ito”—isang matingkad na paraan ng pagsasabing isinakatuparan ng Diyos ang sinabi niya.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: tumupad
  rationale: Sa kontekstong ito, ang שׁמר ay tumutukoy sa pagtupad ng Diyos sa sinabi niya kay David. Natural sa Filipino ang “tumupad sa ... sinabi,” habang ang ikalawang pandiwa ay pinananatiling kaugnay ngunit mas tahasang nagsasaad ng pagsasakatuparan.
- source_word: לְעַבְדְּךָ
  choice: sa iyong lingkod
  rationale: Maaaring ipakahulugan ang ל bilang “sa” o “para sa.” Ang “sa iyong lingkod” ay natural sa pariralang “tumupad sa ... sinabi” at pinananatili ang katawagang “lingkod.”
- source_word: דָּוִד אָבִי
  choice: si David na aking ama
  rationale: Malinaw at natural sa modernong Filipino, at pinananatili ang pagkakasunod na David muna bago ang kaugnayang “aking ama.”
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: sa sinabi mo sa kanya
  rationale: Pinananatili ang payak na diwa ng pagsasalita sa halip na tahasang gawing “pangako,” upang hindi dagdagan ang teksto at upang maihanda ang pag-uulit tungkol sa bibig at kamay.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Sinabi mo iyon sa pamamagitan ng iyong bibig
  rationale: Pinananatili ang kongkretong larawan ng bibig at ang retorikal na pagtutulad nito sa kamay, ngunit gumagamit ng natural na ayos sa Filipino.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: at tinupad mo iyon sa pamamagitan ng iyong kamay
  rationale: Ang “tinupad” ay angkop sa מִלֵּאתָ bilang pagsasakatuparan ng naunang sinabi. Pinananatili ng “sa pamamagitan ng iyong kamay” ang antropomorpikong larawan ng pagkilos ng Diyos.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nakikita sa araw na ito
  rationale: Ipinahahayag ng idyoma ang kasalukuyan at hayag na katuparan. Ang saling ito ay malinaw sa modernong Filipino nang hindi nawawala ang pagtukoy sa “araw na ito.”
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa “bibig” at “kamay” ng Diyos
  choice: Panatilihin sa pangunahing teksto ang kongkretong mga larawan ng bibig at kamay.
  alternative: Isalin lamang bilang “nangako ka at isinakatuparan mo.”
  rationale: Sadyang pinagtatapat ng Hebreo ang salita ng Diyos at ang pagkilos niya. Ang pagpapanatili sa larawan ay gumagalang sa retorika ng teksto at hindi nagpapataw ng paliwanag na wala sa mismong talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong panalangin at ang konkretong paralelismo ng “bibig” at “kamay,” habang inayos ang mga parirala upang maging natural sa Tagalog.
