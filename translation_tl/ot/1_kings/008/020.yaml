id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: tl
  text: Tinupad ni Yahweh ang salitang sinabi niya[a]. Humalili ako sa aking amang si David at naupo sa trono ng Israel, gaya ng sinabi ni Yahweh. At itinayo ko ang bahay[b] para sa pangalan ni Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinagtibay ang kanyang salita” o “isinakatuparan ang kanyang sinabi.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” ay tumutukoy dito sa templo.
    reason: clarification
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Tinupad
  rationale: Sa Hiphil at kapag ang layon ay “salita,” ipinahihiwatig ng קום ang pagsasakatuparan o pagpapatibay sa sinabi. Ang “tinupad” ang pinakanatural sa konteksto ng pangakong natupad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: ang salitang sinabi niya
  rationale: Pinananatili ang pag-uulit ng ugat na דבר at hindi tahasang pinapalitan ng “pangako,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: Humalili ako sa aking amang si David
  rationale: Ang תַּחַת ay nagsasaad ng paghalili sa kinalalagyan ng iba. Likas sa modernong Tagalog ang “humalili” at malinaw nitong ipinapahayag ang dinastikong paghalili.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: at naupo sa trono ng Israel
  rationale: Ang pag-upo sa trono ay tumutukoy sa pagluklok at paghahari; pinananatili ng salin ang konkretong larawan ng Hebreo.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Pinananatili ang pag-uulit ng wikang “sinabi” sa talata nang hindi dinaragdagan ng tahasang “ipinangako.”
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: itinayo ko ang bahay
  rationale: Ang הַבַּיִת ay literal na “ang bahay.” Pinananatili ito sa pangunahing teksto, habang nililinaw sa talababa na ang tinutukoy ay ang templo.
- source_word: לְשֵׁם יְהוָה
  choice: para sa pangalan ni Yahweh
  rationale: Pinananatili ang mahalagang biblikal na pahayag na “para sa pangalan,” sa halip na paliitin ang kahulugan nito tungo lamang sa “bilang parangal.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at karaniwang salin ng titulong tipanan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kung isasalin ang הַבַּיִת bilang “bahay” o “templo”
  choice: bahay
  alternative: templo
  rationale: Bagaman templo ang tinutukoy, pinananatili ng “bahay” ang mismong salita at teolohikal na larawan ng Hebreo. Nililinaw ng talababa ang tinutukoy upang maiwasan ang kalituhan.
- issue: Kung gagawing tahasan ang “salita” bilang “pangako”
  choice: salitang sinabi niya
  alternative: pangakong binitiwan niya
  rationale: Ipinahihiwatig ng konteksto ang pangako, ngunit pinananatili ng salin ang mas malawak na salitang דָּבָר at ang pag-uulit ng pandiwang “sinabi.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang natural na “humalili” para sa paghalili ni Solomon, habang pinanatili ang mga susing larawang Hebreo na “salita,” “trono,” “bahay,” at “para sa pangalan.”
