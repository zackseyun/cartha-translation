  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: tl
  text: Kapag humayo ang iyong bayan upang makipagdigma laban sa kanilang kaaway sa landas na iuutos mong tahakin nila, at manalangin sila kay Yahweh nang nakaharap sa lungsod na iyong pinili[a] at sa bahay na itinayo ko para sa iyong pangalan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa direksiyon ng lungsod.” Ang Hebreo ay literal na nagsasabing “sa daan/direksiyon ng lungsod,” na nagpapahayag ng oryentasyon habang nananalangin.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang templo; “bahay” ang literal na salita sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito ng isang maaaring maganap na kalagayan sa sunod-sunod na mga kahilingan ni Solomon. Likas sa Filipino ang “kapag” at hindi nito ginagawang sanhi ang sugnay.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: humayo ang iyong bayan upang makipagdigma
  rationale: Ang יֵצֵא ay literal na paglabas o paghayo, at ang pariralang militar ay tumutukoy sa pagpunta upang lumaban. Pinananatili ng “humayo” ang marangal na tono nang hindi nagiging lipas.
- source_word: עַל אֹיְבוֹ
  choice: laban sa kanilang kaaway
  rationale: Bagaman isahan ang hulaping Hebreo, kolektibo ang “bayan”; natural sa Filipino ang pangmaramihang “kanilang” habang pinananatiling isahan ang “kaaway.”
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: sa daang pagsusuguan mo sa kanila
  rationale: Pinananatili nito ang kongkretong larawan ng דֶּרֶךְ bilang daan at ang Diyos bilang nagsusugo, sa halip na gawing malabong “saanman sila pumunta.”
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: at manalangin sila kay Yahweh
  rationale: Karaniwang pandiwa para sa pananalangin ang התפלל, at tahasang isinasalin ang banal na pangalang יהוה bilang Yahweh.
- source_word: דֶּרֶךְ הָעִיר
  choice: nang nakaharap sa lungsod
  rationale: Dito ang דֶּרֶךְ ay nagpapahayag ng direksiyon o oryentasyon sa pananalangin, hindi ng paglalakbay patungo sa lungsod.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: sa lungsod na iyong pinili
  rationale: Tapat ito sa payak na pahayag ng Hebreo at hindi nagdaragdag ng paliwanag mula sa mas malawak na konteksto.
- source_word: וְהַבַּיִת
  choice: at sa bahay
  rationale: Literal na “bahay” ang בַּיִת. Bagaman templo ang tinutukoy, mahalagang mapanatili ang biblikal na pananalitang “bahay para sa iyong pangalan.”
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: na itinayo ko para sa iyong pangalan
  rationale: Pinananatili ang makahulugang pariralang “para sa iyong pangalan,” na tumutukoy sa banal na pangalan, karangalan, at presensiya nang hindi nilulutas ang buong teolohikal na saklaw nito sa salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ng Diyos ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Tawag sa הַבַּיִת
  choice: bahay
  alternative: templo
  rationale: Templo ang tinutukoy, ngunit “bahay” ang mismong salita ng Hebreo at bahagi ito ng mahalagang pariralang “bahay ... para sa iyong pangalan.” Nililinaw sa talababa ang tinutukoy nang hindi pinapalitan ang salita sa pangunahing teksto.
- issue: Direksiyon ng pananalangin
  choice: nang nakaharap sa lungsod ... at sa bahay
  alternative: patungo sa lungsod ... at sa templo
  rationale: Ang pariralang Hebreo ay nagsasaad ng oryentasyon. Ang “nakaharap” ay malinaw sa modernong Filipino ngunit hindi nagsasabing ang nagsisipanalangin ay pisikal na naglalakbay patungo roon.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “humayo” at “pagsusuguan” upang mapanatili ang pormal na tono ng panalangin, ngunit iniwasan ang malalalim at lipas na anyo. Pinanatili ang nakabiting kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
