  naturalness: Marangal at likas ang pangkalahatang rehistro. Gayunman, mas malinaw at idiomatiko ang “mga salitang ito na taimtim kong isinamo” kaysa “mga salita kong ito na ipinamanhik ko,” at ang pag-uulit ng “usapin” ay hindi kailangan kung “katarungan” ang gagamitin.
  terminology: Ang “Yahweh,” “Diyos,” “lingkod,” at “bayang Israel” ay angkop at pare-pareho. “Katarungan” ang mas tumpak na pangunahing katumbas ng משפט sa talatang ito; maaaring ipaliwanag sa talababa ang diwang legal na pagtaguyod ng karapatan o usapin.
