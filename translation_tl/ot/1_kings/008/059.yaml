base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: tl
  text: Nawa’y manatiling malapit kay Yahweh na ating Diyos, araw at gabi, ang mga salitang ito na taimtim kong isinamo sa harap ni Yahweh, upang igawad niya ang katarungan sa kanyang lingkod at sa kanyang bayang Israel, ayon sa kailangan sa bawat araw.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itaguyod ang usapin” o “panindigan ang karapatan.” Ang Hebreong idyoma ay tumutukoy sa paggawa ng katarungan o pagtataguyod sa legal na karapatan ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang bagay ng isang araw sa araw nito,” ibig sabihin, ang nararapat o kailangan sa bawat araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: At manatili nawa
  rationale: Ang anyong jussive ay nagpapahayag ng hangarin o panalangin. Ipinahihiwatig ng “manatili nawa” na ang mga salita ay patuloy na mapalapit sa Diyos.
- source_word: דְבָרַי אֵלֶּה
  choice: ang mga salita kong ito
  rationale: Natural na modernong Tagalog na pinananatili ang diin sa sariling mga salita ni Solomon.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי
  choice: na ipinamanhik ko
  rationale: Ang hitpael ng חנן ay tumutukoy sa taimtim na pagsusumamo; mas angkop ang “ipinamanhik” kaysa sa pangkalahatang “ipinanalangin.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang inilalarawan ang panalanging inihain sa presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: manatili ... sa piling ni Yahweh na ating Diyos
  rationale: Ang קְרֹבִים ay “malapit.” Ang “sa piling” ay likas sa Tagalog at inilalarawan ang mga salita bilang patuloy na nasa harap ng Diyos upang bigyang-pansin.
- source_word: יוֹמָם וָלָיְלָה
  choice: araw at gabi
  rationale: Pinananatili ang Hebreong idyoma para sa patuloy na panahon.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: upang itaguyod niya ang kapakanan
  rationale: Sa konteksto, ang idyoma ay tumutukoy sa pagtatanggol o pagpapanatili ng makatarungang usapin ng isang tao; malinaw at natural ang “itaguyod ang kapakanan,” habang ipinaliliwanag sa talababa ang legal na diwa.
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Sa pananalitang maharlika at panalangin ni Solomon, “lingkod” ang kontekstuwal na angkop na katumbas.
- source_word: וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: at ng kanyang bayang Israel
  rationale: Saklaw ng naunang “kapakanan” ang kapuwa lingkod at bayan, kaya naiwasan ang mabigat na pag-uulit nang hindi nawawala ang paralelismo.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ayon sa kailangan sa bawat araw
  rationale: Ipinapahayag nito ang bagay o pangangailangang nararapat tugunan sa kani-kaniyang araw.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; ang “Yahweh” ay transliterasyong hindi pinapalitan ang pangalan ng isang titulo.
- issue: Saklaw ng לַעֲשׂוֹת מִשְׁפַּט
  choice: itaguyod ang kapakanan
  alternative: igawad ang katarungan; panindigan ang usapin
  rationale: Pinananatili ang legal at mapagkalingang diwa nang hindi nililimitahan kung ang diin ay paghahatol, pagtatanggol, o pagtugon sa nararapat.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipinamanhik” upang mapanatili ang taimtim na tono ng panalangin, at “sa piling” bilang natural na katumbas ng pagiging malapit sa Diyos. Lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
