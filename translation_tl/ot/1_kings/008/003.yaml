lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Ang wayyiqtol ng בוא ay nagsasaad ng kasunod na pangyayari sa salaysay. Likas at malinaw sa Filipino ang “dumating”; hindi ipinapalagay ang isang tiyak na lugar na papasukin.
- source_word: כֹּל
  choice: lahat ng
  rationale: Tuwirang tinutukoy ang kabuuan ng sumusunod na pangkat.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: matatandang pinuno ng Israel
  rationale: Sa kontekstong ito, ang זקנים ay kinikilalang mga pinuno ng bayan, hindi lamang mga lalaking may edad. Pinananatili ng “matatandang pinuno” ang literal na diwa at ang tungkuling panlipunan.
- source_word: וַיִּשְׂאוּ
  choice: binuhat
  rationale: Ang נשׂא ay maaaring mangahulugang buhatin o pasanin. Ang “binuhat” ay natural at angkop sa pagdadala sa kaban, habang hindi labis na tinutukoy ang eksaktong paraan ng pagpasan.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Tuwirang salin ng tiyak na pangmaramihang pangngalan; malinaw sa Filipino ang pagiging tiyak nito sa konteksto kahit walang hiwalay na pantukoy na katumbas ng “the.”
- source_word: אֶת הָאָרוֹן
  choice: ang kaban
  rationale: Ang talata ay nagsasaad lamang ng tiyak na “kaban.” Hindi idinagdag sa pangunahing teksto ang “ng tipan,” bagaman malinaw iyon sa konteksto.
