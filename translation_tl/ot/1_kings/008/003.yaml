translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang maipakita na ang “mga matanda” ay mga kinikilalang lider ng Israel, at pinanatiling maikli ang sunod-sunod na kilos ng salaysay.
