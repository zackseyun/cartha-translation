  naturalness: Natural at marangal sa makabagong Filipino ang “Dumating ang lahat ng nakatatanda ng Israel, at dinala ng mga pari ang kaban.” Maikli rin nito pinananatili ang daloy ng salaysay.
  terminology: Ang “mga nakatatanda” ay angkop na katumbas ng institusyonal na “elders” nang hindi nagdaragdag ng tiyak na katungkulan. Ang “mga pari” at “kaban” ay wasto. Nananatili sa talababa ang “kaban ng tipan” bilang kontekstuwal na paglilinaw, hindi dagdag sa pangunahing teksto.
