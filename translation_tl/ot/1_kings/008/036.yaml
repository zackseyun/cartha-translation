base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: tl
  text: Kung magkagayon, dinggin mo mula sa langit[a] at patawarin ang kasalanan ng iyong mga lingkod at ng iyong bayang Israel, kapag itinuturo mo sa kanila ang mabuting daan na dapat nilang lakaran.[b] At magpaulan ka sa iyong lupain, na ibinigay mo sa iyong bayan bilang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinggin mo sa langit.” Literal na walang pang-ukol ang pariralang Hebreo, kaya maaaring unawain itong “mula sa langit” o “sa langit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sapagkat itinuturo mo sa kanila ang mabuting daan na dapat nilang lakaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: dinggin mo mula sa langit
  rationale: Literal na walang pang-ukol ang Hebreo, ngunit sa konteksto ng panalangin kailangang magdagdag ng natural na pang-ukol sa Tagalog. Ang “mula sa langit” ay malinaw at karaniwang pahayag, habang itinatala sa talababa ang “sa langit.”
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: at patawarin ang kasalanan
  rationale: Ang חַטָּאת dito ay tumutukoy sa pagkakasalang hinihinging patawarin, hindi sa handog para sa kasalanan.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: iyong mga lingkod, ng iyong bayang Israel
  rationale: Ang “mga lingkod” ay angkop sa mga nasasakupan ng Diyos sa konteksto ng panalangin. Ang ikalawang parirala ay nagpapakilala sa kanila bilang Israel; inuulit ang “ng iyong” upang maging malinaw at natural sa Tagalog.
- source_word: כִּי תוֹרֵם
  choice: kapag itinuturo mo sa kanila
  rationale: Maaaring mangahulugan ang כִּי ng “kapag” o “sapagkat.” Pinili ang “kapag” dahil akma ito sa takbo ng pakiusap, ngunit pinananatili sa talababa ang alternatibong ugnayang sanhi.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: ang mabuting daan na dapat nilang lakaran
  rationale: Pinananatili ng “mabuting daan” at “lakaran” ang metapora ng Hebreo para sa wastong pamumuhay.
- source_word: וְנָתַתָּה מָטָר
  choice: At magpaulan ka
  rationale: Mas natural sa modernong Tagalog ang “magpaulan” kaysa sa literal na “magbigay ng ulan,” at pinananatili nito ang anyo ng pakiusap.
- source_word: עַל אַרְצְךָ
  choice: sa iyong lupain
  rationale: Pinananatili ang hulaping ikalawang panauhan sa Hebreo at sa gayon ang pahayag na ang lupain ay pag-aari pa rin ng Diyos.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: na ibinigay mo sa iyong bayan bilang mana
  rationale: Ang “mana” ay malinaw at maikli, at pinananatili ang tipanang diwa ng lupaing ipinagkaloob sa Israel.
theological_decisions:
- issue: Pagmamay-ari ng Diyos at pagkakaloob ng lupain sa Israel
  choice: sa iyong lupain, na ibinigay mo sa iyong bayan bilang mana
  alternative: sa lupaing ibinigay mo sa iyong bayan bilang kanilang mana
  rationale: Tahasan sa Hebreo na “iyong lupain” ito, ngunit ibinigay sa bayan bilang mana. Pinananatili ng salin ang dalawang pahayag at ang tensiyon sa pagitan ng pagmamay-ari ng Diyos at pagkakaloob niya nito sa Israel.
- issue: Ugnayan ng pagtuturo ng Diyos sa pagpapatawad at pagpapanumbalik
  choice: kapag itinuturo mo sa kanila
  alternative: sapagkat itinuturo mo sa kanila
  rationale: Hindi tiyak kung temporal o sanhi ang כִּי. Hindi ginagawang paliwanag sa doktrina ang parirala; ang lehitimong alternatibo ay inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dinggin,” “mabuting daan,” “lakaran,” at “mana” upang mapanatili ang himig at mga metapora ng teksto nang hindi nagiging lipas o labis na teknikal.
