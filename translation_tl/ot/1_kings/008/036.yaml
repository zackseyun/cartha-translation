  source_fidelity: Ang pangunahing daloy ng panalangin, ang pagpapatawad, pagtuturo sa mabuting daan, at paghingi ng ulan sa lupain ng Diyos ay wastong naihahatid. Gayunman, ang וְעַמְּךָ יִשְׂרָאֵל ay may pangatnig na “at” kasunod ng “iyong mga lingkod”; hindi ito dapat gawing payak na apposition lamang.
  naturalness: Marangal at natural ang kabuuang Tagalog. Mas malinaw at mas tumpak ang magkatuwang na pariralang “ng iyong mga lingkod at ng iyong bayang Israel” kaysa sa kasalukuyang magkakasunod na genitive na pinaghihiwalay lamang ng kuwit.
  terminology: Ang “dinggin,” “kasalanan,” “mga lingkod,” “mabuting daan,” “magpaulan,” “lupain,” at “mana” ay angkop sa modernong Filipino Tagalog at sa rehistrong pampanalangin. Napananatili rin ng “iyong lupain” ang pagmamay-ari ng Diyos.
