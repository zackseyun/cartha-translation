translation:
  language: tl
  text: Pakinggan mo sa langit[a] ang kanilang panalangin at pagsusumamo, at ipatupad mo ang katarungan para sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ang kalangitan” o “ang mga langit.”
    reason: lexical_alternative
  - marker: b
    text: O “itaguyod mo ang kanilang usapin” o “panindigan mo ang kanilang karapatan.” Literal sa Hebreo, “gawin mo ang kanilang hatol/katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: pakinggan mo
  rationale: Ang Qal perfect na 2ms ay nasa konteksto ng panalangin at gumaganap bilang pakiusap sa Diyos. Likas sa Tagalog ang pautos-pakiusap na “pakinggan mo.”
- source_word: הַשָּׁמַיִם
  choice: sa langit
  rationale: Literal itong “ang kalangitan,” ngunit sa pormula ng panalanging ito, natural sa Tagalog ang lokatibong “sa langit.” Hindi ginawang “mula sa langit” sapagkat walang מִן sa Hebreo.
- source_word: תְּפִלָּתָם
  choice: ang kanilang panalangin
  rationale: Ang תְּפִלָּה ay pangkalahatang salita para sa panalangin; ang isahan na may pangmaramihang hulapi ay natural na naihahayag bilang kolektibong “kanilang panalangin.”
- source_word: תְּחִנָּתָם
  choice: pagsusumamo
  rationale: Ang תְּחִנָּה ay taimtim na paghingi ng awa o pabor. Pinananatili ng “pagsusumamo” ang masidhing diwa nito at ang pagkakaiba sa pangkalahatang “panalangin.”
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: at ipagtanggol mo ang kanilang usapin
  rationale: Literal na “gawin mo ang kanilang hatol/katarungan.” Ang idyoma ay tumutukoy sa pagkilos upang bigyan sila ng katarungan o itaguyod ang kanilang kaso. Ang “ipagtanggol mo ang kanilang usapin” ay natural at nananatiling hudisyal nang hindi ipinipilit ang isang makitid na pagbasa.
theological_decisions:
- issue: Hudisyal na idyoma sa pakiusap sa Diyos
  choice: ipagtanggol mo ang kanilang usapin
  alternative: igawad mo sa kanila ang katarungan; panindigan mo ang kanilang karapatan
  rationale: Maaaring mangahulugan ang עשה משפט ng paglalapat ng katarungan para sa isang tao o pagtataguyod sa kaniyang kaso. Pinananatili ng salin ang legal at relasyonal na diwa habang iniiwasang ipasok ang isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pagsusumamo” upang mapanatili ang pagkakaiba ng dalawang katawagang Hebreo para sa panalangin, at “usapin” upang maipakita ang hudisyal na larawan ng pangwakas na sugnay.
