  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Solomon, “Sinabi ni Yahweh na mananahan siya sa pusikit na dilim.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa madilim na ulap.” Ang salitang Hebreo na עֲרָפֶל ay maaaring tumukoy sa pusikit na dilim o sa madilim na ulap, lalo na sa mga paglalarawan ng hayag na presensya ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos ay
  rationale: Likas na panandang temporal sa makabagong Tagalog na nagpapanatili sa pagkakasunod-sunod ng salaysay.
- source_word: אָמַר
  choice: sinabi / Sinabi
  rationale: Karaniwang katumbas ng pandiwang Hebreo sa pagpapakilala ng tuwiran at iniulat na pananalita.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לִשְׁכֹּן
  choice: mananahan siya
  rationale: Sa kasunod ng אָמַר, ipinahahayag ng pawatas na may ל ang nilalaman ng sinabi; natural sa Tagalog ang panghinaharap na 'mananahan siya.'
- source_word: בָּעֲרָפֶל
  choice: sa pusikit na dilim
  rationale: Ipinapahayag ang matindi at makapal na kadiliman habang pinananatili ang bigat ng larawang kaugnay ng hayag na presensya ng Diyos.
theological_decisions:
- issue: Ang paninirahan ni Yahweh sa עֲרָפֶל
  choice: mananahan siya sa pusikit na dilim
  alternative: mananahan siya sa madilim na ulap
  rationale: Pinananatili ng 'pusikit na dilim' ang kabalintunaan ng presensya ng Diyos sa pagkakubli, nang hindi ito nililimitahan sa isang karaniwang pangyayari sa atmospera.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'pusikit na dilim' upang maging natural sa karaniwang mambabasa at mapanatili ang teopanikong larawan; inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang tinutukoy nito.
