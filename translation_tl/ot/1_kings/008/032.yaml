base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: tl
  text: 'Dinggin mo sa langit[a] at kumilos ka, at hatulan mo ang iyong mga lingkod: hatulang nagkasala ang masama sa pamamagitan ng pagpapataw sa sarili niyang ulo ng kanyang ginawa[b], at ipawalang-sala ang matuwid[c] sa pamamagitan ng pagbibigay sa kanya ng nararapat ayon sa kanyang katuwiran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinggin mo mula sa langit.” Literal sa Hebreo, “dinggin mo ang langit/mga langit,” isang pormula ng panalangin na maaaring tumukoy sa pakikinig ng Diyos sa langit o mula sa langit.
    reason: lexical_alternative
  - marker: b
    text: Ang “ipataw sa sarili niyang ulo ang kanyang ginawa” ay isang idyomang Hebreo na nangangahulugang gantihan ang isang tao ayon sa kanyang asal.
    reason: cultural_note
  - marker: c
    text: O “ideklarang matuwid ang matuwid” o “bigyang-katarungan ang matuwid.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: dinggin mo sa langit
  rationale: Pinananatili nito ang lokatibong anyo ng Hebreo at likas itong pakinggan bilang panalangin sa Diyos; ang posibilidad na 'mula sa langit' ay inilagay sa talababa.
- source_word: וְעָשִׂיתָ
  choice: at kumilos ka
  rationale: Sa kontekstong ito, ang malawak na pandiwang עשה ay tumutukoy sa pagtugon ng Diyos sa pamamagitan ng pagkilos, hindi lamang sa pangkalahatang 'paggawa.'
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Hatulan mo ang iyong mga lingkod
  rationale: Pinananatili ang tagpong panghukuman nang hindi paunang itinatakda ang magiging pasya.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: hatulang nagkasala ang masama
  rationale: 'Ipinahahayag nito ang legal na diwa ng Hiphil: ideklarang maysala o hatulan ang masama.'
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: ibalik sa sarili niyang ulo ang kanyang ginawa
  rationale: Pinananatili ang larawan ng pagganti na bumabalik sa ulo ng gumawa, habang ipinapaliwanag ang דֶּרֶךְ bilang asal o ginawa sa kontekstong ito.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: ipawalang-sala ang matuwid
  rationale: Malinaw na naihahatid ang legal at panghukuman na kahulugan, kasalungat ng paghatol na nagkasala sa masama.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: ibigay sa kanya ang nararapat ayon sa kanyang katuwiran
  rationale: Ang 'nararapat' ay likas sa Filipino at ipinahihiwatig ng konteksto ng patas na pagganti, samantalang pinananatili ng 'ayon sa kanyang katuwiran' ang batayan sa tekstong Hebreo.
theological_decisions:
- issue: Panghukuman o mapagbagong diwa ng mga pandiwa
  choice: 'Isinalin ang magkatambal na pandiwa bilang mga pasyang legal: ''hatulang nagkasala'' at ''ipawalang-sala.'''
  alternative: Parusahan ang masama at bigyang-katarungan ang matuwid.
  rationale: Ang konteksto ay paghatol sa isang usaping may panunumpa. Karaniwang legal na mga termino ang mga causative na anyo ng רשע at צדק; hindi tahasang tinutukoy rito ang panloob na pagbabagong moral.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na wikang panghukuman. Pinanatili ang larawang Hebreo na bumabalik sa sariling ulo ang ginawa, ngunit ginawang madaling maunawaan sa pamamagitan ng talababa.
