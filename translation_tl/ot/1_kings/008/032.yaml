    rationale: Ang וְאַתָּה ay literal na “at ikaw”; sa konteksto ng panalangin maaari itong isalin nang walang tahasang panghalip bilang “Dinggin mo...” Hindi ito nangangahulugang “kung magkagayon.”
  - severity: low
