id: 1KI.8.19
reference: 1 Kings 8:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: tl
  text: Ngunit hindi ikaw ang magtatayo ng bahay; kundi ang anak mong magmumula sa sarili mong katawan[a]—siya ang magtatayo ng bahay para sa aking pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na lalabas mula sa iyong mga balakang,” isang idyoma para sa sarili mong pisikal na supling.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinahihiwatig dito ng רַק ang paglilimita o pagbubukod sa naunang pagsang-ayon sa hangarin ni David. Likas sa makabagong Tagalog ang “Ngunit” at malinaw nitong naihahatid ang salungat na puwersa.
- source_word: לֹא תִבְנֶה
  choice: hindi ikaw ang magtatayo
  rationale: Pinananatili nito ang maaaring sabay na diwa ng banal na pasiya at pahayag tungkol sa hinaharap. Ang tahasang “ikaw” ay naghahanda rin sa diin sa anak bilang siyang magtatayo.
- source_word: הַבָּיִת
  choice: ang bahay
  rationale: “Bahay” ang tuwirang katumbas ng Hebrew at pinananatili nito ang mahalagang biblikal na paglalarawan, bagaman templo ang tinutukoy sa konteksto.
- source_word: כִּי אִם
  choice: kundi
  rationale: 'Pagkatapos ng negatibong sugnay, natural na ipinapahayag ng “kundi” ang pagtutuwid at pagsalungat: hindi si David, kundi ang kanyang anak.'
- source_word: בִּנְךָ
  choice: ang anak mo
  rationale: Tumutukoy ang isahang anyo na may hulapi sa isang tiyak na anak ni David; sa konteksto, si Solomon.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: magmumula sa sarili mong katawan
  rationale: Malinaw nitong ipinapahayag sa kasalukuyang Tagalog ang tunay na pisikal na salinlahi, habang inilalagay sa talababa ang literal na idyomang “mula sa iyong mga balakang.”
- source_word: הוּא
  choice: siya
  rationale: 'Ang hiwalay na panghalip ay mariin: ang anak na ito, hindi si David, ang magtatayo. Pinananatili ng “siya” at ng gitling ang diin.'
- source_word: יִבְנֶה הַבַּיִת
  choice: siya ang magtatayo ng bahay
  rationale: Inuulit nito ang “magtatayo ng bahay” gaya ng Hebrew at malinaw na itinatampok ang anak bilang tagaganap.
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Pinananatili nito ang tipanang idyoma na ang bahay ay itinatayo para sa pangalan ng Panginoon, nang hindi ito pinalalawak nang interpretatibo.
theological_decisions:
- issue: Kung isasalin ang בַּיִת bilang “bahay” o ipaliliwanag bilang “templo”
  choice: bahay
  alternative: templo
  rationale: “Bahay” ang ginamit ng pinagmulang teksto. Bagaman templo ang tinutukoy, mahalaga ang mismong biblikal at teolohikal na idyoma ng bahay na itinatayo para sa pangalan ng Diyos.
- issue: Kung ang לֹא תִבְנֶה ay utos, pagbabawal, o pahayag ng banal na pasiya tungkol sa hinaharap
  choice: hindi ikaw ang magtatayo
  alternative: huwag mong itayo / hindi mo dapat itayo
  rationale: Hindi tahasang nilulutas ng salin ang tensiyon sa pagitan ng pagbabawal at tiyak na banal na pasiya; nananatiling natural itong pahayag tungkol sa hindi magiging papel ni David.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bahay” sa halip na “templo” upang mapanatili ang bokabularyo at teolohikal na idyoma ng Hebrew. Ang “sarili mong katawan” ay likas na pagpapahayag ng pisikal na salinlahi; nasa talababa ang literal na larawan. Ang gitling bago ang “siya” ay nagpapanatili sa diin ng hiwalay na panghalip na הוּא.
