base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: tl
  text: Kaya’t maging tapat nang buong-buo kay Yahweh na ating Diyos ang inyong puso, upang lumakad kayo ayon sa kanyang mga tuntunin at sundin ang kanyang mga utos, tulad ng ginagawa ninyo ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “gaya ng sa araw na ito.” Ang idyomang Hebreo ay tumutukoy sa kasalukuyang araw bilang halimbawa o patotoo ng gayong katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Kaya’t maging
  rationale: Sa konteksto, ang anyo ay isang panghihikayat o panawagan, hindi simpleng pahayag tungkol sa hinaharap. Likas itong naipapahayag sa Filipino sa pamamagitan ng “maging.”
- source_word: לְבַבְכֶם
  choice: ang inyong puso
  rationale: Ang “puso” ay nagpapanatili sa kolektibong metapora ng Hebreo para sa kalooban, pag-iisip, at katapatan ng panloob na pagkatao.
- source_word: שָׁלֵם
  choice: buo
  rationale: Ipinahihiwatig nito ang ganap at hindi nahahating katapatan sa tipan, nang hindi ipinapalagay ang kawalang-kasalanan o moral na kasakdalan.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: kay Yahweh na ating Diyos
  rationale: Ang “kay” ay natural na Filipino para sa ugnayang nakatuon sa isang persona, habang pinananatili ang personal at tipanang diwa ng Hebreong עִם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לָלֶכֶת
  choice: upang lumakad
  rationale: Pinananatili ng “lumakad” ang biblikal na metapora ng pamumuhay at pagkilos ayon sa kalooban ng Diyos.
- source_word: בְּחֻקָּיו
  choice: sa kanyang mga tuntunin
  rationale: Ang “mga tuntunin” ay malinaw at marangal na katumbas ng mga itinakdang batas o kautusan.
- source_word: וְלִשְׁמֹר
  choice: at sundin
  rationale: Sa kontekstong legal at tipanan, likas na ipinapahayag ng “sundin” ang pag-iingat at pagtupad sa iniutos.
- source_word: מִצְוֺתָיו
  choice: ang kanyang mga utos
  rationale: Ang “mga utos” ay tuwiran at madaling maunawaang katumbas ng mga kautusan ng Diyos.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng sa araw na ito
  rationale: Pinananatili nito ang maikli at bahagyang bukas na idyoma ng Hebreo, na tumutukoy sa kasalukuyang araw bilang halimbawa o saksi ng kanilang debosyon.
theological_decisions:
- issue: Paglalarawan sa pusong שָׁלֵם
  choice: maging buo ang inyong puso
  alternative: maging hindi nahahati ang inyong puso; maging lubos na tapat ang inyong puso
  rationale: Pinananatili ng “buo” ang saklaw sa pagitan ng kabuuan at di-nahahating katapatan, nang hindi tahasang ipinapasok ang ideya ng walang-kasalanang kasakdalan.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng personal na pangalang tipanan; kaya pinanatili ito bilang “Yahweh.”
- issue: Diwa ng כַּיּוֹם הַזֶּה
  choice: gaya ng sa araw na ito
  alternative: gaya ng ginagawa ninyo ngayon
  rationale: Hindi lubusang tinutukoy ng Hebreo kung ang araw na iyon ay halimbawa, saksi, o paglalarawan ng kasalukuyang katapatan. Pinananatili ng pangunahing salin ang pagiging bukas na ito, at nililinaw sa talababa ang posibleng diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na larawan ng “puso” at “paglakad,” gayundin ang tunay na kalabuan ng “buo” at ng pangwakas na idyoma. Ginamit ang “Yahweh” bilang personal na banal na pangalan.
