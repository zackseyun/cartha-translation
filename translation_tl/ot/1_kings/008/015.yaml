  terminology: Ang “Purihin si Yahweh,” “ang Diyos ng Israel,” at ang pangalang “Yahweh” ay angkop sa modernong Filipino Tagalog at pinananatili ang pormal na papuring Hebreo nang hindi nagpapahiwatig na pinagpapala ng tao ang Diyos.
