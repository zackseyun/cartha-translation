base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: tl
  text: At sinabi niya, “Purihin si Yahweh, ang Diyos ng Israel, na nagsalita kay David na aking ama sa pamamagitan ng kanyang bibig at tinupad niya ito sa pamamagitan ng kanyang kamay, na nagsabi:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Ang pormulang Hebreo ay pagpapahayag ng papuri o pagbabasbas sa Diyos. Mas natural sa makabagong Tagalog ang “Purihin si Yahweh” kaysa sa literal ngunit di-likas na “Pagpalain si Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang katumbas ng construct chain at malinaw na kinikilala ang Diyos kaugnay ng Israel.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: na nagsalita sa sarili niyang bibig
  rationale: Pinananatili ang tahasang idyoma ng bibig at ang pagkakatulad nito sa “sarili niyang kamay” sa kasunod na sugnay.
- source_word: אֵת דָּוִד אָבִי
  choice: kay David na aking ama
  rationale: Sa gamit na ito ng דִּבֶּר, ang אֵת ay nagpapakilala sa taong kinausap. Ang “aking ama” ay dignidad at malinaw sa Tagalog.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: at tumupad sa pamamagitan ng sarili niyang kamay
  rationale: Ipinapakita ang pagtutugma ng sinabi ng Diyos sa kanyang bibig at isinagawa ng kanyang kamay. Hindi tahasang dinagdagan ng panghalip na layon ang Hebreo.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang karaniwang pormulang pambungad sa tuwirang pananalitang nagpapatuloy sa susunod na talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili itong “Yahweh” upang hindi mapalitan ng isang titulo.
- issue: Kahulugan ng pormulang בָּרוּךְ kapag Diyos ang tinutukoy
  choice: Purihin
  alternative: Pagpalain
  rationale: Hindi ipinahihiwatig ng pormula na nagbibigay ang tao ng pagpapala sa Diyos; nagpapahayag ito ng papuri. Ang “Purihin” ang natural at teolohikong hindi mapanlinlang na Tagalog.
translation_notes:
  register: Makabago, dignidad, at madaling maunawaang Filipino. Pinanatili ang paralelismong “sarili niyang bibig / sarili niyang kamay,” bagaman bahagyang pormal ito, dahil mahalaga ito sa retorika ng Hebreo. Ang pangungusap ay sadyang bukas sa hulihan sapagkat ipinakikilala ng “na sinasabi” ang sipi sa susunod na talata.
