revisions:
- from: At sinabi niya, “Purihin si Yahweh, ang Diyos ng Israel, na nagsalita sa sarili niyang bibig kay David na aking ama at tumupad sa pamamagitan ng sarili niyang kamay, na sinasabi,”
  to: At sinabi niya, “Purihin si Yahweh, ang Diyos ng Israel, na nagsalita kay David na aking ama sa pamamagitan ng kanyang bibig at tinupad niya ito sa pamamagitan ng kanyang kamay, na nagsabi:”
  rationale: Inalis ang hindi kinakailangang reflexive na “sarili” upang huwag magdagdag ng diin na wala sa pinagmulan. Ginawang mas likas ang ayos ng mga pariralang “sa pamamagitan ng kanyang bibig/kamay,” at isinalin ang quotative formula bilang “na nagsabi:” para malinaw na ipinapakilala nito ang sipi sa susunod na talata. Ang “ito” ay tumutukoy sa ipinangako o sinalita at ginagawang malinaw sa Tagalog ang layon ng “tinupad,” alinsunod sa ipinahiwatig na layon sa Hebreo at sa English audit trail.
