  verdict: revise
  source_fidelity: Ang “ipinatawag” ay angkop para sa Hiphil ng קהל, at naipapanatili ang mga pangkat ng mga pinuno. Gayunman, ang “iahon” ay karaniwang nagpapahiwatig ng pagsagip o paghila palabas sa Filipino at hindi natural para sa seremonyal na paglilipat ng kaban patungong Jerusalem. Ang “dalhin paakyat” ay mas tumpak na naglilipat ng לְהַעֲלוֹת.
  naturalness: Marangal at malinaw ang pangungusap. Mas natural at hindi mapanlinlang ang “dalhin paakyat” kaysa “iahon.” Ang “mga nakatatanda ng Israel” ay isang malinaw na katawagang institusyonal para sa זִקְנֵי יִשְׂרָאֵל; hindi ito basta tumutukoy sa edad.
  terminology: Napananatili nang wasto ang “Yahweh,” “kaban ng tipan,” “mga lipi,” “mga angkan,” at “mga anak ni Israel.” Ang talababa ay angkop at wastong nakakabit sa pambansa-pampamilyang idiom.
  issues:
  - severity: medium
    issue: “iahon” para sa לְהַעֲלוֹת
    rationale: Ang pandiwang ito sa modernong Filipino ay madalas gamitin sa pagsagip o paghango mula sa panganib o sa tubig. Hindi nito natural na inilalarawan ang planadong pagdadala ng kaban paitaas sa Jerusalem. “Dalhin paakyat” ay pinananatili ang direksiyon at layon ng Hebreo.
  - severity: low
    issue: “matatandang pinuno” para sa זִקְנֵי יִשְׂרָאֵל
    rationale: Nauunawaan ito, ngunit maaaring basahin muna bilang paglalarawan ng edad. “Mga nakatatanda ng Israel” ay mas tuwirang katawagang pang-institusyon at nananatiling madaling maunawaan sa modernong Filipino.
  revised_text: Pagkatapos, ipinatawag ni Haring Solomon sa Jerusalem ang mga nakatatanda ng Israel, ang lahat ng pinuno ng mga lipi, at ang mga pinuno ng mga angkan ng mga anak ni Israel[a], upang dalhin paakyat ang kaban ng tipan ni Yahweh mula sa Lungsod ni David, na siyang Zion.
  revised_footnotes:
