reference: 1 Kings 8:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Haring Solomon sa Jerusalem ang mga nakatatanda ng Israel, ang lahat ng pinuno ng mga lipi, at ang mga pinuno ng mga angkan ng mga anak ni Israel[a], upang dalhin paakyat ang kaban ng tipan ni Yahweh mula sa Lungsod ni David, na siyang Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Israel” ay isang pampamilya at pambansang katawagan para sa sambayanan ng Israel.
    reason: lexical_clarification
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa susunod na pangyayari sa salaysay.
- source_word: יַקְהֵל
  choice: ipinatawag
  rationale: Ang Hiphil ng קהל ay nangangahulugang magpulong o magtipon ng mga tao. Sa konteksto ng hari, natural sa Filipino ang “ipinatawag,” na nagpapahiwatig ng pormal na pagtitipon.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: matatandang pinuno ng Israel
  rationale: Ang זְקֵנִים ay hindi lamang tumutukoy sa matatanda sa edad kundi sa kinikilalang mga pinunong panlipunan at pampolitika; nililinaw ito ng “matatandang pinuno.”
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: lahat ng pinuno ng mga lipi
  rationale: Sa kontekstong ito, ang מַטּוֹת ay mga lipi ng Israel, hindi literal na mga tungkod.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Tumutukoy ang parirala sa mga kinikilalang pinuno ng mga sambahayan o pangkat na nakabatay sa angkan. Ang “mga angkan” ay maikli at natural sa modernong Filipino.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Pinananatili ang pampamilya at pambansang anyo ng Hebreo nang hindi ito pinapantay lamang sa pangkalahatang “mga mamamayan.”
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה ... יְרוּשָׁלִָם
  choice: ipinatawag ni Haring Solomon sa Jerusalem
  rationale: Isinaayos ang pangungusap ayon sa likas na sintaks ng Filipino. Naipapahayag ng “ipinatawag” ang paglapit ng mga pinuno kay Haring Solomon, habang pinananatili ang titulo at lugar.
- source_word: לְהַעֲלוֹת
  choice: upang iahon
  rationale: Pinananatili ng “iahon” ang direksiyon ng pagdadala paitaas patungong Jerusalem.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Tuwirang inilalarawan ang sagradong kaban bilang kaugnay ng tipan ni Yahweh.
- source_word: מֵעִיר דָּוִד
  choice: mula sa Lungsod ni David
  rationale: Tuwirang salin ng heograpikong pangalan; ginamit ang malaking titik bilang tiyak na katawagan sa lugar.
- source_word: הִיא צִיּוֹן
  choice: na siyang Zion
  rationale: Malinaw at natural na ipinakikilala ang Zion bilang kaparehong lugar ng Lungsod ni David.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pampamilya at pambansang katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili ang tunay na pampamilyang larawan ng Hebreo, habang ipinapaliwanag sa talababa na pambansa rin ang saklaw nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling basahin. Ginamit ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy ng “elders,” at inayos ang paulit-ulit na estrukturang Hebreo sa natural na pangungusap sa Filipino nang hindi inaalis ang titulo ni Solomon, Jerusalem, o ang layunin ng pagtitipon.
