- from: Pagkatapos, ipinatawag ni Haring Solomon sa Jerusalem ang matatandang pinuno ng Israel, ang lahat ng pinuno ng mga lipi, at ang mga pinuno ng mga angkan ng mga anak ni Israel[a], upang iahon ang kaban ng tipan ni Yahweh mula sa Lungsod ni David, na siyang Zion.
  to: Pagkatapos, ipinatawag ni Haring Solomon sa Jerusalem ang mga nakatatanda ng Israel, ang lahat ng pinuno ng mga lipi, at ang mga pinuno ng mga angkan ng mga anak ni Israel[a], upang dalhin paakyat ang kaban ng tipan ni Yahweh mula sa Lungsod ni David, na siyang Zion.
