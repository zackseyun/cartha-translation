id: 1KI.8.22
reference: 1 Kings 8:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: tl
  text: Pagkatapos, tumayo si Solomon sa harap ng altar ni Yahweh, sa harap ng buong kapulungan ng Israel, at iniunat niya ang kanyang mga kamay patungo sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “mga langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Ang pandiwa ay nagsasaad ng kasunod na payak na kilos sa salaysay; natural at tuwiran ang “tumayo” sa modernong Tagalog.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: sa harap ng altar ni Yahweh
  rationale: Pinananatili ng “sa harap ng” ang lokasyong ipinahihiwatig ng לִפְנֵי, at natural sa Tagalog ang “altar ni Yahweh” para sa ugnayang construct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: sa harap ng buong kapulungan ng Israel
  rationale: Ipinahahayag ng נֶגֶד ang pampublikong puwesto ni Solomon sa harapan ng nagkakatipong sambayanan; malinaw at marangal ang “buong kapulungan ng Israel.”
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: iniunat niya ang kanyang mga kamay
  rationale: Sa konteksto ng panalangin, tumutukoy ang parirala sa pag-uunat o pagbubuka ng mga kamay. Mas natural sa Tagalog ang “iniunat ang kanyang mga kamay” kaysa literal na “ibinuka ang kanyang mga palad.”
- source_word: הַשָּׁמָיִם
  choice: langit
  rationale: Bagaman anyong maramihan ang salitang Hebreo, karaniwang kolektibo o singular ang diwa nito; “langit” ang natural na Tagalog sa direksiyon ng panalangin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng הַשָּׁמָיִם sa kilos ng panalangin
  choice: langit
  alternative: mga langit
  rationale: Hindi nilulutas ng salin ang anumang mas malawak na kosmolohikal na tanong; ginagamit lamang nito ang likas na ekspresyong Tagalog para sa direksiyon kung saan iniunat ni Solomon ang kanyang mga kamay, habang itinatala sa talababa ang literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kapulungan” para sa pormal na pagtitipon ng Israel at “altar” bilang karaniwan at malinaw na terminong biblikal. Ang pag-uulit ng “sa harap” ay pinanatili upang maipakita ang dalawang magkaibang ugnayang panlunan sa Hebreo.
