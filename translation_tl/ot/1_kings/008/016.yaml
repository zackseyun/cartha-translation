source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: tl
  text: Mula nang ilabas ko sa Ehipto ang aking bayang Israel, hindi ako pumili ng anumang lungsod mula sa lahat ng lipi ng Israel upang magtayo roon ng isang bahay kung saan naroon ang aking pangalan[b], ngunit pinili ko si David[a] upang mamuno sa aking bayang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at pinili ko si David.” Maaari ring basahin bilang payak na “at” ang pang-ugnay sa Hebreo, ngunit mas pinapaboran ng konteksto ang kontras: walang lungsod na pinili, samantalang si David ay pinili.'
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay kung saan naroon ang aking pangalan” ay idyomang Hebreo para sa santuwaryong kaugnay ng pangalan at presensiya ng PANGINOON—samakatuwid, ang templo.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: ilabas ko
  rationale: Tuwirang ipinapahayag ang causative na diwa ng Hiphil ng יצא at natural sa Filipino para sa paglabas mula sa Ehipto.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: aking bayang Israel
  rationale: Pinananatili ang appositional na pagkakakilanlan ng Israel bilang bayan ng nagsasalita.
- source_word: בָחַרְתִּי
  choice: pumili ako / pinili ko
  rationale: Ang 'pumili' ang karaniwan at tuwirang katumbas ng בחר, kabilang ang konteksto ng pagpili ng Diyos.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: anumang lungsod mula sa lahat ng lipi ng Israel
  rationale: Ipinahahayag ang saklaw ng Hebreong pagtanggi habang nananatiling malapit sa siksik na pariralang pinagmulan.
- source_word: לִבְנוֹת בַּיִת
  choice: upang pagtayuan ng isang bahay
  rationale: Pinananatili ang literal na 'bahay' sa halip na ipalit agad ang interpretatibong 'templo'; ang 'pagtayuan' ay natural para sa pagpili ng lungsod bilang lugar.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: kung saan naroon ang aking pangalan
  rationale: Pinananatili ang payak na pandiwang 'maging/naroon' at hindi dinaragdagan ng interpretatibong 'manahan'.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: sa halip, pinili ko si David
  rationale: Ginagawang malinaw sa natural na Filipino ang kontras sa pagitan ng hindi pagpili ng lungsod at pagpili kay David.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: upang mamuno sa aking bayang Israel
  rationale: Ang literal na 'maging ibabaw ng' ay hindi natural sa Filipino; malinaw na ipinahahayag ng 'mamuno sa' ang awtoridad na tinutukoy ng parirala.
theological_decisions:
- issue: Teolohiya ng templo sa 'bahay ... para sa aking pangalan'
  choice: Panatilihin ang 'bahay' at ang pahayag na naroon ang pangalan ng Diyos.
  alternative: Isalin bilang 'templo kung saan mananahan ang aking pangalan.'
  rationale: Pinananatili nito ang natatanging idyomang Hebreo at iniiwasang gawing 'manahan' ang payak na היה, habang nililinaw sa talababa na templo ang tinutukoy.
- issue: Ugnayan ng hindi pagpili ng lungsod at pagpili kay David
  choice: Gamitin ang 'sa halip' bilang adversative na pagbasa ng waw.
  alternative: Gamitin ang simpleng 'at.'
  rationale: 'Malakas ang kontras sa konteksto: walang lungsod na pinili, samantalang si David ay pinili. Gayunman, itinatala sa talababa ang posibleng coordinative na pagbasa.'
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang 'lungsod,' 'lipi,' at 'mamuno' bilang karaniwang pormal na bokabularyo. Inilagay ang [a] sa sugnay na tinutukoy nito at ang [b] pagkatapos ng idyoma tungkol sa pangalan.
