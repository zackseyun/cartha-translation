base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: tl
  text: nawa'y maging bukás ang iyong mga mata sa pagsusumamo[a] ng iyong lingkod at sa pagsusumamo ng iyong bayang Israel, upang pakinggan sila[b] tuwing tumatawag sila sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daing.” Ang salitang Hebreo ay tumutukoy sa taimtim na paghingi ng pabor o awa.
    reason: lexical_alternative
  - marker: b
    text: O “dinggin sila.” Ang pandiwang Hebreo ay maaaring mangahulugang “marinig,” “pakinggan,” o “dinggin,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: nawa'y maging
  rationale: Ipinagpapatuloy ng infinitibong may ל ang pakiusap ni Solomon; natural na ipinahahayag sa Tagalog ang petitionaryong diwa sa pamamagitan ng “nawa'y maging.”
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: maging bukás ang iyong mga mata
  rationale: Pinananatili ang tahasang antropomorpikong larawan ng Hebreo para sa mapagbigay at handang pakikinig ng Diyos.
- source_word: תְּחִנַּת
  choice: pagsusumamo
  rationale: Tumutukoy ang תְּחִנָּה sa taimtim na paghingi ng awa o pabor; dignificado ngunit karaniwan at malinaw ang “pagsusumamo” sa modernong Filipino.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ito ang angkop na katawagan ni Solomon sa sarili sa harap ng Diyos; hindi pangunahing itinatampok dito ang kahulugang alipin.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: iyong bayang Israel
  rationale: Likas na ipinahahayag ng “bayang Israel” ang Israel bilang bayang pag-aari ng Diyos.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: upang pakinggan sila
  rationale: Ipinahahayag ng “pakinggan” ang masusing pakikinig nang hindi tiyakang dinaragdagan ang ideya ng pagsunod o pagtugon.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: tuwing tumatawag sila sa iyo
  rationale: Ang בְּכֹל kasama ng anyong pandiwa ay may temporal na diwang “sa bawat pagkakataong”; natural itong isalin na “tuwing.”
theological_decisions:
- issue: Antropomorpikong pananalitang “maging bukás ang iyong mga mata” tungkol sa Diyos
  choice: Panatilihin ang metapora sa pangunahing teksto
  alternative: “nawa'y bigyang-pansin mo”
  rationale: Tahasang ginagamit ng Hebreo ang larawan ng mga matang bukás bilang tanda ng mapagbigay na pansin ng Diyos. Ang pagpapanatili nito ay gumagalang sa anyo at teolohikal na himig ng teksto nang hindi kinakailangang magpahiwatig ng literal na katawang pisikal.
- issue: Saklaw ng שׁמע sa konteksto ng panalangin
  choice: “pakinggan sila”
  alternative: “dinggin sila”
  rationale: Maaaring mangahulugan ang pandiwa ng marinig, makinig, o dinggin/tugunan. Hindi tahasang nilulutas ng “pakinggan” kung kasama na rito ang pagtugon, kaya napapanatili ang leksikal na lawak.
translation_notes:
  register: Modernong Filipino na may dignidad na angkop sa panalangin. Ginamit ang “lingkod,” “pagsusumamo,” at “nawa” bilang malinaw at pormal ngunit mauunawaang mga salita. Ang diin sa “bukás” ay inilagay upang malinaw na mabasa ito bilang pang-uri, hindi bilang pandiwang “bukas.”
