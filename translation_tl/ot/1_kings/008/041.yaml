  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: tl
  text: At gayundin, tungkol sa dayuhan[a] na hindi kabilang sa iyong bayang Israel ngunit dumarating mula sa malayong lupain alang-alang sa iyong pangalan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banyaga” o “hindi Israelita.” Ang Hebreo ay tumutukoy sa isang hindi Israelita, hindi lamang sa isang manlalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At gayundin
  rationale: Pinananatili ang pang-ugnay at pandagdag na diin, at iniuugnay ang kasong ito sa naunang mga kahilingan sa panalangin.
- source_word: אֶל הַנָּכְרִי
  choice: tungkol sa dayuhan[a]
  rationale: Sa konteksto, ipinakikilala ng אֶל ang kasong tinatalakay; ang נָכְרִי ay isang hindi Israelita, hindi lamang isang manlalakbay.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: na hindi kabilang sa iyong bayang Israel
  rationale: Malinaw at natural na ipinapahayag ang pagiging nasa labas niya ng bayang tipan, habang pinananatili ang Israel bilang bayan ng Diyos.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: ngunit nagmula sa malayong lupain
  rationale: 'Ipinakikita ng “ngunit” ang banayad na kaibahan: hindi siya kabilang sa Israel, gayunma''y nanggaling siya mula sa malayo. Ang anyong nagdaan ay natural sa Filipino sa paglalarawan ng pagdating niya.'
- source_word: לְמַעַן שְׁמֶךָ
  choice: alang-alang sa iyong pangalan
  rationale: Pinananatili ang motibo at ang biblikal na bigat ng “pangalan” bilang ipinahayag na pagkakakilanlan at reputasyon ng Diyos.
theological_decisions:
- issue: Paglalarawan sa pagkakaiba ng bayang Israel at ng hindi Israelitang lumalapit
  choice: dayuhan na hindi kabilang sa iyong bayang Israel
  alternative: ibang-tao na hindi mula sa iyong bayang Israel
  rationale: Pinananatili nito ang tunay na etniko at tipanang pagkakaiba nang hindi ito ginagawang isa lamang panlipunang kategorya o nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayang Israel” upang maging natural ang pariralang tumutukoy sa Israel bilang bayan ng Diyos. Pinanatili ang gitling sa dulo dahil nagpapatuloy ang pangungusap sa kasunod na talata.
