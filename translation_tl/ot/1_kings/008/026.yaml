  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: tl
  text: At ngayon, Diyos ng Israel, nawa’y mapagtibay[a] ang mga salitang[b] sinabi mo sa lingkod mong si David, na aking ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapatunayan,” “magkatotoo,” o “matupad.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mga salita mo”; maaari rin itong unawain nang kolektibo bilang “salita mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at panandang temporal, na nagpapakitang nagpapatuloy ang panalangin ni Solomon.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Tuwirang isinasalin ang pariralang pantawag sa paraang natural at marangal sa makabagong Tagalog.
- source_word: יֵאָמֶן נָא
  choice: nawa’y mapagtibay
  rationale: Ipinahahayag ng “nawa” ang magalang na pagsusumamo ng נָא, samantalang pinananatili ng “mapagtibay” ang pasibong anyo at diwa ng pagiging matatag o mapatunayang totoo ng sinabi.
- source_word: דבריך
  choice: ang mga salita mong
  rationale: Sinusunod ang morpolohikal na maramihan ng tekstong Hebreo; natural din itong nag-uugnay sa kasunod na “sinabi.”
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: sinabi
  rationale: Tuwirang tinutumbasan ang karaniwang pandiwang “magsalita” nang hindi agad ipinakahulugang “ipinangako.” Ang gumaganap na “mo” ay malinaw na sa “mga salita mong.”
- source_word: לְעַבְדְּךָ
  choice: sa lingkod mong
  rationale: Ang “lingkod” ang angkop sa marangal at kaugnayang gamit ng עבד para kay David bilang lingkod ng Diyos.
- source_word: דָּוִד אָבִי
  choice: si David na aking ama
  rationale: Pinananatili ang pagkakasunod ng pangalang David at ng kasunod na paglalarawang “aking ama,” habang natural sa Tagalog.
theological_decisions:
- issue: Kalikasan ng kahilingan tungkol sa naunang sinabi ng Diyos kay David
  choice: Isinalin bilang panalanging mapagtibay ang mga sinabi ng Diyos
  alternative: Isalin nang higit na dinamiko bilang panalanging matupad o magkatotoo ang pangako ng Diyos
  rationale: Pinananatili ng “mapagtibay” ang diwa ng ugat na אמן—pagiging matatag o mapatunayang totoo—at hindi nito labis na nililinaw ang paraan ng katuparan. Iniiwan din nitong buo ang implikasyon ng pangako ayon sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na wikang panalangin. Ginamit ang “nawa’y” sa halip na mas kolokyal na “pakiusap” upang natural na maipahayag ang pagsusumamo, at iniwasan ang arkaikong bokabularyo.
