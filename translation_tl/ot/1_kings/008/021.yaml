  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: tl
  text: At naglaan ako roon ng lugar para sa Kaban, na kinaroroonan ng tipan ni Yahweh na ginawa niya[a] sa ating mga ama[b] nang ilabas niya sila mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pinutol niya ang tipan,” isang idyoma na nangangahulugang gumawa o magtatag ng tipan.
    reason: lexical_alternative
  - marker: b
    text: 'O, “ating mga ninuno.” Hebreo: “ating mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: naglaan ako roon ng lugar
  rationale: Ang literal na diwang “naglagay/nagtakda roon ng lugar” ay likas na naipahahayag sa Tagalog bilang “naglaan ... ng lugar,” habang pinananatili ang natapos na pagkilos at ang diin sa lokasyon.
- source_word: לָאָרוֹן
  choice: para sa Kaban
  rationale: Sa kontekstong ito, ang אָרוֹן ay ang sagradong Kaban; sapat at malinaw ang “Kaban” nang hindi paunang idinaragdag ang “ng Tipan,” sapagkat tinutukoy ito ng kasunod na sugnay.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: na kinaroroonan ng tipan ni Yahweh
  rationale: Pinananatili nito ang lokatibong ugnayan ng sugnay sa Kaban at ang payak na pahayag ng Hebreo na naroon ang tipan, nang hindi ipinapalit ang mas tiyak na “mga tapyas ng tipan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: כָּרַת
  choice: ginawa
  rationale: Ang literal na pandiwa ay “pumutol,” ngunit ang “gumawa ng tipan” ang likas na katumbas ng idyomang Hebreo sa Tagalog; itinala ang literal na anyo sa talababa.
- source_word: עִם אֲבֹתֵינוּ
  choice: sa ating mga ninuno
  rationale: Sa konteksto, tumutukoy ang “mga ama” sa naunang salinlahi ng Israel. Ang “mga ninuno” ay malinaw at likas sa modernong Tagalog, habang ibinibigay sa talababa ang literal na anyong panlalaki.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: nang ilabas niya sila mula sa lupain ng Ehipto
  rationale: Ang “nang” ay naghahayag ng temporal na gamit ng infinitive construct, at ang “ilabas ... mula” ay tumpak na nagpapakita ng paggalaw palabas ng Ehipto.
theological_decisions:
- issue: Paglalarawan sa nilalaman ng Kaban bilang בְּרִית (“tipan”)
  choice: tipan
  alternative: mga tapyas o kasulatan ng tipan
  rationale: Ang Hebreo mismo ay nagsasabing naroon ang “tipan ni Yahweh.” Hindi nililinaw ng salin ang metonimiya sa pangunahing teksto upang mapanatili ang pahayag at posibleng saklaw ng orihinal.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Saklaw ng אֲבֹתֵינוּ
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Ang “mga ninuno” ang likas na pagtukoy sa naunang salinlahi sa modernong Tagalog. Hindi ikinukubli ang literal na panlalaking anyo, sapagkat nakatala ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaban” bilang kinikilalang katawagan sa sagradong ark at “Ehipto” bilang karaniwang anyong Filipino. Iniwasan ang sobrang literal ngunit di-likas na “naglagay ng lugar,” gayundin ang pagpapaliwanag sa “tipan” bilang mga tapyas sa mismong teksto.
