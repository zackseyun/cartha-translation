base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: tl
  text: At patawarin mo ang iyong bayan na nagkasala sa iyo, pati ang lahat ng kanilang pagsuway[a] na ginawa nila laban sa iyo; at ipagkaloob mong kahabagan sila ng mga bumihag sa kanila, upang kaawaan sila ng mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paghihimagsik,” na nagdidiin sa paglabag sa katapatan sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at kaaawaan sila ng mga ito.” Ang huling sugnay ay maaaring unawain bilang bunga, hindi lamang bilang layunin.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: At patawarin mo
  rationale: Bagaman anyong ganap ang pandiwa sa Hebreo, nasa konteksto ito ng panalangin at gumaganap bilang pakiusap. Likas sa modernong Tagalog ang pautos na may magalang at panalanging diwa na “patawarin mo.”
- source_word: לְעַמְּךָ
  choice: ang iyong bayan
  rationale: Tumutukoy ito sa bayang pag-aari ng Diyos. Hindi kailangang tumbasan ang pang-ukol na ל dahil tuwirang layon ng “patawarin” ang natural sa Tagalog.
- source_word: חָטְאוּ לָךְ
  choice: nagkasala sa iyo
  rationale: Ipinakikita ng ל ang Diyos bilang pinatutungkulan o nasaktan ng kasalanan. Ang “nagkasala sa iyo” ang malinaw at likas na katumbas sa Tagalog.
- source_word: וּלְכָל פִּשְׁעֵיהֶם
  choice: pati ang lahat ng kanilang pagsuway
  rationale: Ang פשע ay maaaring tumukoy sa pagsuway o paghihimagsik. Pinananatili ng “pagsuway” ang bigat na moral at pangtipan nang hindi labis na nililimitahan ito sa pampolitikang paghihimagsik.
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: na ginawa nila laban sa iyo
  rationale: Iniiwasan nito ang mabigat na pag-uulit na “pagsuway na isinuway,” ngunit pinananatiling hayag na laban sa Diyos ang kanilang mga kasalanan.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: at loobin mong kahabagan sila
  rationale: Ang idyomang נתן + ל + רחמים ay humihiling na ilagay sila ng Diyos sa kalagayang tatanggap sila ng habag. Ang “loobin mong kahabagan sila” ay natural na pananalitang panalangin at pinananatili ang Diyos bilang pinagmumulan ng pagbabagong ito sa pakikitungo sa kanila.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: ng mga bumihag sa kanila
  rationale: Ang participle na שֹׁבֵי ay tumutukoy sa mga bumihag. Ginawang tahasan sa Tagalog kung kanino magmumula ang habag upang maging malinaw ang idyomang Hebreo.
- source_word: וְרִחֲמוּם
  choice: upang kaawaan sila ng mga iyon
  rationale: Maaaring ipahayag ng pangwakas na sugnay ang layunin o ang bunga. Ang “upang” ay maayos sa daloy ng panalangin, habang inilalahad sa talababa ang posibleng pagbasa bilang bunga. Ang “mga iyon” ay malinaw na tumutukoy sa mga bumihag at umiiwas sa malabong sunod-sunod na panghalip.
theological_decisions:
- issue: Ugnayan ng pagpapatawad ng Diyos at pagkahabag ng mga bumihag
  choice: Inihaharap ng talata ang panalanging patawarin ng Diyos ang Israel at loobin niyang tratuhin sila nang may habag ng mga bumihag sa kanila.
  alternative: 'Maaaring basahin ang huling sugnay bilang tuwirang bunga: “at kaaawaan sila ng mga iyon.”'
  rationale: Iniuugnay ng pagkakasunod ng mga sugnay sa Hebreo ang pagpapatawad ng Diyos, ang pagkakaloob ng habag sa harap ng mga bumihag, at ang mahabaging pakikitungo ng mga ito. Hindi nilulutas nang tahimik ang sintaktikong pag-igting sa pagitan ng layunin at bunga; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan,” “pagsuway,” “bumihag,” at “kahabagan/kaawaan” bilang pamilyar na bokabularyong angkop sa panalangin. Inilagay ang mga pananda ng talababa sa mismong bahaging tinutukoy ng bawat paliwanag.
