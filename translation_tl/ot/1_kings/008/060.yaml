  source_fidelity: Ang “lahat ng mga bayan sa buong mundo” ay hindi kasingtiyak ng Hebreong כָּל־עַמֵּי הָאָרֶץ, na tumutukoy sa mga mamamayan o mga bayan bilang mga pangkat ng tao, hindi sa mga bayang-lungsod. Pinananatili ng rebisyon ang saklaw na “all the peoples of the earth.” Wasto ang “PANGINOON, siya ang Diyos; wala nang iba” para sa יהוה הוא האלהים אין עוד, kabilang ang mariing panghalip na “siya.”
