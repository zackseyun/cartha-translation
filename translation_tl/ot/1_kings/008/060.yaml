  text: upang malaman ng lahat ng mga mamamayan sa daigdig na ang PANGINOON, siya ang Diyos; wala nang iba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַמֵּי הָאָרֶץ (kol ‘amme ha’arets)
  choice: lahat ng mga bayan sa buong mundo
  rationale: Ang parirala ay tumutukoy sa lahat ng mga bansa o pangkat ng tao sa daigdig; natural sa makabagong Tagalog ang “sa buong mundo” kaysa sa literal na “ng lupa.”
- source_word: יְהוָה (YHWH)
  choice: PANGINOON
  rationale: Ginamit ang nakaugaliang salin sa Tagalog para sa banal na pangalan, na minarkahan sa malalaking titik upang maiba sa karaniwang titulong “Panginoon.”
- source_word: הוּא הָאֱלֹהִים (hu ha’elohim)
  choice: siya ang Diyos
  rationale: Pinananatili ng “siya” ang tahasang panghalip at diin ng Hebreo, sa halip na paikliin lamang bilang “ang PANGINOON ang Diyos.”
- source_word: אֵין עוֹד (’en ‘od)
  choice: wala nang iba
  rationale: Maikli at tuwirang katumbas na nagpapanatili sa absolutong pahayag ng Hebreo nang hindi nagdaragdag ng salitang hindi tahasang nasa teksto.
theological_decisions:
- issue: Pagkakakilanlan at pagiging natatangi ng Diyos
  choice: ang PANGINOON—siya ang Diyos; wala nang iba
  alternative: ang PANGINOON lamang ang Diyos
  rationale: Pinanatili ang dalawang magkahiwalay na pahayag ng Hebreo at ang emphatic na “siya,” sa halip na pagsamahin ang mga ito sa isang interpretibong pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang gitling-pahaba upang maipakita ang diin ng panghalip sa Hebreo.
