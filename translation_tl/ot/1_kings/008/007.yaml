  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: tl
  text: Sapagkat nakaunat ang mga pakpak ng mga kerubin sa ibabaw ng kinalalagyan ng Kaban[a], at tinakpan ng mga kerubin mula sa itaas ang Kaban at ang mga pingga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa kinalalagyan ng Kaban.” Maaaring unawain nang mas literal bilang paturol ang pang-ukol sa Hebreo, ngunit ipinahihiwatig ng konteksto na nakaunat ang mga pakpak sa ibabaw ng kinalalagyan ng Kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng naunang pahayag; malinaw at marangal ang “Sapagkat” sa modernong Tagalog.
- source_word: הַכְּרוּבִים
  choice: ang mga kerubin
  rationale: Ginagamit ang kinikilalang katawagang biblikal na “kerubin,” na malinaw na maramihan dahil sa “mga.”
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: iniunat ... ang kanilang mga pakpak
  rationale: Ang participle ay naglalarawan sa nakabukang kalagayan o postura ng mga pakpak; natural sa Tagalog ang “iniunat” sa kontekstong ito.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: sa ibabaw ng kinalalagyan ng Kaban
  rationale: Bagaman karaniwang direksiyon ang אֶל, ipinakikita ng kasunod na sugnay na nakalapat sa itaas ng kinalalagyan ng Kaban ang mga pakpak; pinananatili sa talababa ang literal na alternatibo.
- source_word: וַיָּסֹכּוּ
  choice: nililiman nila
  rationale: Ipinahahayag ng סכך ang pagtatakip o pagbibigay-lilim mula sa itaas. Ang “nililiman” ay akma sa pisikal na larawan nang hindi nagpapahiwatig na lubusang itinago ang Kaban.
- source_word: בַּדָּיו
  choice: ang mga pingga nito
  rationale: Tumutukoy ito sa mahahabang pinggang ginagamit sa pagbuhat sa Kaban; karaniwan at tiyak ang “mga pingga” sa Tagalog.
- source_word: מִלְמָעְלָה
  choice: mula sa itaas
  rationale: Tuwirang pinananatili ang lokasyon at direksiyon ng pagtakip.
