  naturalness: Mas natural at malinaw sa modernong Tagalog ang paglalagay ng pandiwa sa natapos na aspekto at ang paggamit ng “nakaunat ang mga pakpak ng mga kerubin,” kaysa sa pinaghalong “iniunat” at “nililiman nila.”
  terminology: Ang “kerubin,” “Kaban,” at “mga pingga” ay katanggap-tanggap na mga katawagang biblikal. Ang “tinakpan” ay hindi nagpapataw ng teolohikal na kahulugan at sapat na isinasalin ang pisikal na pagtatakip/pagkanlong na ipinahihiwatig ng סכך.
