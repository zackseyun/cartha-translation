  to: Sapagkat nakaunat ang mga pakpak ng mga kerubin sa ibabaw ng kinalalagyan ng Kaban[a], at tinakpan ng mga kerubin mula sa itaas ang Kaban at ang mga pingga nito.
  rationale: Pinalitan ang di-ganap na “nililiman nila” ng “tinakpan ng mga kerubin” upang maipakita ang salaysay na anyo ng וַיָּסֹכּוּ at maging mas natural sa Tagalog. Inayos din ang unang sugnay bilang paglalarawan ng nakabukang postura ng mga pakpak, habang pinanatili ang maingat na talababa para sa pinagtatalunang direksiyonal na pang-ukol.
