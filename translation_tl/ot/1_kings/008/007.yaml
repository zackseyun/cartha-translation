translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “Kaban” bilang kinikilalang katawagang biblikal sa ark at “kerubin” bilang transliterasyong teknikal.
