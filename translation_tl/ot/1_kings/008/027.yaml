  to: Ngunit talaga nga bang mananahan ang Diyos sa lupa? Narito, kahit ang langit at ang pinakamataas na langit[a] ay hindi ka kayang saklawin[b]; lalo nang hindi ang bahay na ito na itinayo ko![c]
