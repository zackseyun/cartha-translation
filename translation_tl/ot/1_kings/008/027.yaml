base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: tl
  text: Ngunit talaga nga bang mananahan ang Diyos sa lupa? Narito, kahit ang langit at ang pinakamataas na langit[a] ay hindi ka kayang saklawin[b]; lalo nang hindi ang bahay na ito na itinayo ko![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang langit at ang langit ng mga langit,” isang paraan ng pagsasabing “ang pinakamataas na langit.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi ka kayang maglaman.”
    reason: lexical_alternative
  - marker: c
    text: Ang “bahay na ito” ay ang templong itinayo ni Solomon.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: Ngunit talaga nga bang
  rationale: Sa konteksto, ipinakikilala nito ang isang retorikal na tanong na may pagtataka at diin. Ang “Ngunit” ay likas na nag-uugnay sa naunang pananalita, at ang “talaga nga bang” ay nagpapahayag ng taimtim na pagkamangha.
- source_word: יֵשֵׁב
  choice: mananahan
  rationale: Ang pandiwa ay maaaring tumukoy sa pag-upo o paninirahan; dito, ang “mananahan” ang angkop sa usapin ng presensiya ng Diyos kaugnay ng templo.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Tuwirang ipinapakita nito ang paghahambing ng lupa at langit.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pormal at mariing pantawag-pansin ng Hebreo nang hindi nagiging lipas o masyadong kolokyal.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ang langit at ang pinakamataas na langit
  rationale: Inihahatid nito sa natural na Tagalog ang Hebreong pariralang superlatibo habang pinananatili ang dalawang magkakaugnay na sugnay.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: hindi ka kayang maglaman
  rationale: Ipinahahayag ng pandiwa ang kawalan ng sapat na kapasidad upang saklawin o paglagyan ang Diyos; pinananatili ng “maglaman” ang larawang pang-espasyo.
- source_word: אַף כִּי
  choice: lalo nang hindi
  rationale: 'Malinaw at likas nitong ipinahahayag ang a fortiori na pangangatwiran: kung hindi Siya kayang lamnin ng langit, lalong hindi ng templong itinayo ni Solomon.'
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי
  choice: ang bahay na ito na itinayo ko
  rationale: Pinananatili ang literal at makabuluhang tawag na “bahay,” na sa konteksto ay tumutukoy sa templo, at ang natapos na pagtatayo nito.
theological_decisions:
- issue: Ang pagiging higit ng Diyos sa lahat ng nilikha at ang presensiya niya sa templo
  choice: Isinalin bilang retorikal na tanong, kasunod ng pahayag na hindi kayang lamnin ng kahit pinakamataas na langit ang Diyos.
  alternative: Isalin bilang tahasang pagtanggi na nananahan ang Diyos sa lupa, o ipahiwatig na literal Siyang nalalaman ng templo.
  rationale: 'Pinananatili nito ang tensiyon ng Hebreo: namamangha si Solomon sa pananatili ng Diyos sa lupa, ngunit hindi niya itinatanggi ang tunay na presensiya ng Diyos sa templo; kasabay nito, malinaw niyang sinasabing walang nilikhang dako ang makapaglilimita sa Diyos.'
translation_notes:
  register: Makabago ngunit marangal na Tagalog na angkop sa panalangin. Ginamit ang “mananahan” at “Narito” upang mapanatili ang taimtim na himig, samantalang ang “lalo nang hindi” ay malinaw na naghahatid ng lohika ng orihinal.
