  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: tl
  text: Sapagkat sila ang iyong bayan at ang iyong mana[a], na inilabas mo mula sa Ehipto, mula sa gitna ng pugon ng bakal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong pag-aari” o “iyong pamanang bahagi.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pugon ng bakal” ay metapora para sa Ehipto bilang lugar ng matinding pang-aapi at paghihirap; ihambing ang Deuteronomio 4:20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng pakiusap ni Solomon sa panalangin; natural sa Filipino ang “Sapagkat” bilang panandang nagpapaliwanag.
- source_word: עַמְּךָ
  choice: iyong bayan
  rationale: Ang “bayan” ay natural at marangal na tawag sa Israel bilang sambayanang kaugnay ng Diyos sa tipan.
- source_word: וְנַחֲלָתְךָ
  choice: at ang iyong mana
  rationale: Pinananatili ng “mana” ang diwa ng minana o itinakdang pag-aari na taglay ng נַחֲלָה, pati ang bigat nitong pangtipan.
- source_word: הֵם
  choice: sila ang
  rationale: Malinaw na isinasalin ang tahasang panghalip at ang predikatibong pagkakabuo ng Hebreo.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ang “na” ang natural na pang-ugnay sa Filipino para sa sugnay na tumutukoy sa mga taong inilabas.
- source_word: הוֹצֵאתָ
  choice: inilabas mo
  rationale: Tumpak na ipinahahayag ang causative na diwa ng Hiphil ng יצא at ang pamilyar na pananalita tungkol sa Exodo.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Natural na katambal ng “inilabas mo” at tumpak na nagpapahayag ng pinagmulan.
- source_word: מִתּוֹךְ
  choice: mula sa gitna ng
  rationale: Pinananatili ang matingkad na larawang inilabas sila mula sa loob o kalagitnaan ng isang matinding kalagayan.
- source_word: כּוּר הַבַּרְזֶל
  choice: pugon na bakal
  rationale: Pinananatili ang maikli at matinding metapora ng Hebreo sa halip na ipaliwanag ito sa pangunahing teksto.
theological_decisions:
- issue: Ang Israel bilang נַחֲלָה ng Diyos
  choice: iyong mana
  alternative: iyong pag-aari; iyong pamanang bahagi
  rationale: Ang “mana” ay nagpapanatili sa larawang pangtipan ng itinakdang bahagi o pag-aari ng Diyos nang hindi nilulutas o pinapaliit ang saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “mula” at ang metaporang “pugon na bakal,” habang ginamit ang “bayan” at “mana” upang maihatid ang pangtipang himig nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
