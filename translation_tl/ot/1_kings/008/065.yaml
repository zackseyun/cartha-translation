  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: tl
  text: Nang panahong iyon, ipinagdiwang ni Solomon ang kapistahan, kasama ang buong Israel—isang malaking kapulungan mula sa Lebo-Hamat[a] hanggang sa Batis ng Ehipto[b]—sa harap ni Yahweh na ating Diyos, pitong araw at pitong araw, labing-apat na araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa pasukan ng Hamat.” Maaaring basahin ang Hebreo bilang paglalarawan sa isang hangganan o bilang pangalang-pook na Lebo-Hamat.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Wadi ng Ehipto.” Ang salitang Hebreo ay madalas tumukoy sa isang pana-panahong daluyan ng tubig, hindi sa isang malaking ilog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ipinagdiwang
  rationale: Bagaman karaniwang nangangahulugang “gumawa” ang pandiwa, kapag kasama ang חָג ay tumutukoy ito sa pagdaraos o pagdiriwang ng isang kapistahan.
- source_word: הֶחָג
  choice: ang kapistahan
  rationale: Ang חָג ay isang panrelihiyong kapistahan, lalo na ang kapistahang dinarayo; natural at marangal sa modernong Tagalog ang “kapistahan.”
- source_word: קָהָל גָּדוֹל
  choice: isang malaking kapulungan
  rationale: Pinananatili ng “kapulungan” ang pormal at sama-samang diwa ng קָהָל nang hindi ito nililimitahan sa makabagong gamit na pansimbahan.
- source_word: מִלְּבוֹא חֲמָת
  choice: mula sa Lebo-Hamat
  rationale: Madalas itong gamiting nakapirming heograpikong palatandaan at maaaring unawain bilang pangalan ng lugar. Nasa talababa ang posibleng deskriptibong pagbasa.
- source_word: נַחַל מִצְרַיִם
  choice: Batis ng Ehipto
  rationale: Ang נַחַל ay karaniwang batis, bangin na dinadaluyan ng tubig, o pana-panahong daluyan, hindi malaking ilog. Iniiwasan ng “Batis” ang pag-aakalang ito ang Nilo.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: sa harap ni Yahweh na ating Diyos
  rationale: Tuwirang pinananatili ng “sa harap” ang lokasyonal at relasyonal na diwa ng לִפְנֵי, at natural sa Tagalog ang “ni Yahweh” para sa personal na pangalan.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: pitong araw at pitong araw
  rationale: Sinasadyang pinananatili ang kapansin-pansing pag-uulit sa Hebreo sa halip na tahimik itong gawing “dalawang linggo” o “isa pang pitong araw.”
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: labing-apat na araw
  rationale: Ito ang kasunod na buod ng kabuuang tagal at pinananatili bilang appositional na pahayag.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng dalawang tigpitong araw
  choice: pitong araw at pitong araw, labing-apat na araw
  alternative: pitong araw at isa pang pitong araw, sa kabuuan ay labing-apat na araw
  rationale: Ipinahihiwatig ng buod na labing-apat na araw na magkasunod ang dalawang yugto, ngunit hindi tinutukoy sa talatang ito kung ano ang saklaw ng bawat yugto. Pinananatili ng salin ang porma at teolohikal-historikal na kalabuan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipinagdiwang” at “kapulungan” para sa natural na daloy habang pinanatili ang Hebreong pag-uulit na “pitong araw at pitong araw.” Inilagay ang mga talababa sa mismong mga heograpikong katawagang tinatalakay nila.
