  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: tl
  text: At ang hari at ang buong Israel na kasama niya ay naghahandog ng mga hain sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “naghahain ng hain,” isang pariralang gumagamit ng magkaugnay na pandiwa at pangngalan upang idiin ang paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: At ang hari
  rationale: Ipinagpapatuloy ng waw ang salaysay, at tiyak ang pangngalan, na tumutukoy sa haring nabanggit na.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ang buong Israel
  rationale: Pinananatili ang kolektibong katawagan sa bansa sa halip na ipakahulugang tahasan bilang bawat Israelita.
- source_word: עִמּוֹ
  choice: na kasama niya
  rationale: Natural na inuugnay nito ang buong Israel sa hari habang pinananatili ang payak na diwa ng pariralang Hebreo.
- source_word: זֹבְחִים זֶבַח
  choice: ay naghahandog ng mga hain
  rationale: Ipinahahayag ng pangkasalukuyang participle ang nagpapatuloy o kasabay na kilos. Isinasalin nang idiomatiko sa Tagalog ang magkaugnay na pandiwa at pangngalan sa Hebreo, na kung literal ay ‘naghahain ng hain.’
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Karaniwan at malinaw na katumbas ito ng pananalitang panlunan at panritwal na ‘before/in the presence of.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan at hindi ito pinapalitan ng titulo.
- issue: Bilang ng זֶבַח sa magkaugnay na konstruksiyon
  choice: mga hain
  alternative: isang hain
  rationale: Bagaman isahan ang pangngalang Hebreo, kasama ito sa idyomatikong pariralang זֹבְחִים זֶבַח. Ang maramihang ‘mga hain’ ay likas sa Tagalog sa konteksto ng sama-samang paghahandog at hindi nangangahulugang iisang handog lamang.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang kolektibong ‘buong Israel’ at ang nagpapatuloy na aspekto ng participle sa pamamagitan ng ‘naghahandog.’
