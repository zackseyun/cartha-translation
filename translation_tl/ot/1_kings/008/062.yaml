  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili ang hari, ang buong Israel na kasama niya, ang aspektong nagpapatuloy/kasabay ng participle, ang paghahandog ng mga hain, at ang pagtukoy na ginawa ito sa harap ni Yahweh. Ang maramihang “mga hain” ay likas na idyomatikong Filipino para sa cognate construction na זֹבְחִים זֶבַח at hindi nagpapasok ng diwang salungat sa teksto.'
