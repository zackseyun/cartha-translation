reference: 1 Kings 8:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵֽׁבֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּ לַ/אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: tl
  text: kung magkagayon, dinggin mo sa langit[a] at patawarin ang kasalanan ng iyong bayang Israel; ibalik mo sila sa lupaing[b] ibinigay mo sa kanilang mga ama.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinggin mo mula sa langit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “panumbalikin mo sila sa lupain.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “kanilang mga ama”; tumutukoy sa mga ninunong pinagbigyan ng Diyos ng lupain.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה תִּשְׁמַע הַשָּׁמַיִם
  choice: kung magkagayon, dinggin mo sa langit
  rationale: Ang prepositionless na הַשָּׁמַיִם ay tumutukoy sa langit bilang tahanan ng Diyos. Pinananatili ng “sa langit” ang anyo at tunay na kalabuan ng Hebreo; ipinahihiwatig naman ng “kung magkagayon” ang daloy ng panalangin sa konteksto.
- source_word: וְסָלַחְתָּ
  choice: at patawarin
  rationale: Ang סלח ay tumutukoy sa pagpapatawad ng Diyos. Ang “at” ay nagpapanatili sa magkakasunod at magkakaugnay na mga pakiusap sa Hebreo.
- source_word: לְחַטַּאת
  choice: ang kasalanan
  rationale: Ang חטאת dito ay kasalanan o pagkakasala, hindi handog para sa kasalanan. Ang isahan ay maaaring tumukoy nang pangkalahatan sa pagkakasala ng bayan.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: iyong bayang Israel
  rationale: Likas sa modernong Filipino ang “bayang Israel” at malinaw nitong ipinakikilalang ang Israel ang bayan ng Diyos.
- source_word: וַהֲשֵׁבֹתָם
  choice: ibalik mo sila
  rationale: 'Ang Hiphil ng שוב ay causative: pangyarihing makabalik. Malinaw na ipinahahayag ng “ibalik mo sila” ang kongkretong pagbabalik sa lupain.'
- source_word: אֶל הָאֲדָמָה
  choice: sa lupain
  rationale: Bagaman maaaring mangahulugang lupa o lupang sinasaka ang אֲדָמָה, ang konteksto ng kaloob sa mga ama ay tumutukoy sa teritoryong ipinangako.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: ibinigay mo sa kanilang mga ama
  rationale: Pinananatili ng “mga ama” ang panlalaking anyo at tipanang diwa ng Hebreo, habang nililinaw sa talababa na tumutukoy ito sa mga ninunong tumanggap ng pangako.
theological_decisions:
- issue: Pagpapakahulugan sa לַאֲבוֹתָם sa konteksto ng pangako ng lupain
  choice: kanilang mga ama
  alternative: kanilang mga ninuno
  rationale: Ang “mga ama” ay mas malapit sa panlalaking anyo ng Hebreo at sa katawagan para sa mga naunang tumanggap ng pangako. Nililinaw ng talababa ang kahulugan nang hindi ginagawang tahasang mas malawak ang pangunahing teksto.
- issue: Uri ng pagpapanumbalik sa וַהֲשֵׁבֹתָם
  choice: ibalik mo sila sa lupain
  alternative: panumbalikin mo sila sa lupain
  rationale: Kongkretong pagbabalik sa lugar ang sinasabi ng talata, hindi lamang pangkalahatang espirituwal o panlipunang pagpapanumbalik.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Ginamit ang “dinggin” sa halip na karaniwang “pakinggan” dahil pakiusap ito na tugunin ng Diyos, at “lupain” upang idiin ang teritoryong ipinangako. Inilagay ang lahat ng pananda ng talababa sa mismong bahaging tinutukoy ng mga ito.
