base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: tl
  text: Nawa’y nakabukas ang iyong mga mata, nakatuon sa bahay na ito gabi at araw—sa lugar na sinabi mong, “Naroon ang aking pangalan,”[a]—upang pakinggan ang panalanging idinadalangin ng iyong lingkod habang nakaharap siya sa lugar na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Naroon ang aking pangalan” ay pananalitang kaugnay ng templo para sa piniling kaugnayan ng Diyos sa lugar na ito. Ipinahihiwatig nito ang kanyang presensiyang kaugnay ng tipan, ngunit hindi lamang iyon ang saklaw ng parirala.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: Nawa'y nakabukas ang iyong mga mata
  rationale: Pinananatili nito ang literal na antropomorpikong larawan ng mga matang bukas bilang pagpapahayag ng mapagmatyag at maingat na pagdinig ng Diyos. Ang “Nawa'y” ay natural na nagpapakita ng pakiusap sa konteksto.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Ang אֶל ay nagsasaad ng direksiyon ng tingin. Sa Filipino, natural na naipahihiwatig ng “sa” ang pagkakatutok ng mga mata sa bahay; pinananatili ng “bahay” ang katawagang ginagamit para sa templo.
- source_word: לַיְלָה וָיוֹם
  choice: gabi at araw
  rationale: Pinananatili ang ayos at idyomang Hebreo para sa patuloy na pagbabantay, habang malinaw at natural pa rin sa Filipino.
- source_word: אֶל הַמָּקוֹם
  choice: sa lugar
  rationale: Pinananatili ang paulit-ulit na motibo ng itinalagang lugar. Sa konteksto, ipinahihiwatig ng “sa” ang pagkakatutok o pagharap doon.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Naroon ang aking pangalan
  rationale: Tuwirang pinananatili ang teolohikal na idyoma ng Hebreo tungkol sa pangalan ng Diyos, sa halip na palitan ito ng isang pagpapakahulugang gaya ng “presensiya” o “maninirahan.”
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: upang pakinggan ang panalangin
  rationale: Ipinakikita ng “upang” ang layunin ng infinitive, at ang “pakinggan” ay nagpapahiwatig ng masusing pakikinig nang hindi dinaragdagan ang kahulugan.
- source_word: אֲשֶׁר יִתְפַּלֵּל עַבְדְּךָ
  choice: na idinadalangin ng iyong lingkod
  rationale: Ang “idinadalangin” ay natural na Filipino para sa panalanging inihaharap sa Diyos at maaaring tumukoy sa kasalukuyan o paulit-ulit na gawain. Ang “lingkod” ay angkop sa mapagpakumbabang pananalita ni Solomon sa Diyos.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: na nakaharap sa lugar na ito
  rationale: Ginagawang malinaw at natural sa Filipino ang direksiyon ng panalangin patungo sa templo, nang hindi ipinahihiwatig na ang panalangin ay iniaalay sa lugar mismo.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa mga mata ng Diyos
  choice: Panatilihin ang larawang “nakabukas ang iyong mga mata.”
  alternative: “ituon mo ang iyong pansin” o “bantayan mo ang bahay na ito”
  rationale: Ang literal na larawan ay nagpapanatili sa makata at teolohikal na lakas ng Hebreo at hindi ito pinapantay lamang sa abstraktong “pansin.”
- issue: Kahulugan ng “Naroon ang aking pangalan”
  choice: Panatilihin sa pangunahing teksto ang “Naroon ang aking pangalan.”
  alternative: “Naroon ang aking presensiya” o “Maninirahan ako roon”
  rationale: Mahalaga ang mismong idyoma ng “pangalan” sa teolohiya ng templo. Ipinahihiwatig nito ang piniling pakikipag-ugnayan at presensiya ng Diyos, ngunit hindi dapat ikulong ang parirala sa iisang paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino, na may panalanging himig. Ginamit ang “Nawa'y” bilang pormal ngunit karaniwang anyo ng pakiusap. Inilagay ang talababa pagkatapos mismo ng pariralang nililinaw nito.
