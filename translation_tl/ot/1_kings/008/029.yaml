  to: Nawa’y nakabukas ang iyong mga mata, nakatuon sa bahay na ito gabi at araw—sa lugar na sinabi mong, “Naroon ang aking pangalan,”[a]—upang pakinggan ang panalanging idinadalangin ng iyong lingkod habang nakaharap siya sa lugar na ito.
