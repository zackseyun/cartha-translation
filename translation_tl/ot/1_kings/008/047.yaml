  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: tl
  text: at kung matauhan sila sa lupain kung saan sila dinalang bihag, at manumbalik sila at magsumamo sa iyo sa lupain ng mga bumihag sa kanila, na nagsasabi, “Nagkasala kami, gumawa kami ng kabuktutan, at nagpakasama kami,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: matauhan sila
  rationale: Ang literal na larawan ay ‘ibalik nila sa kanilang puso,’ isang idyomang tumutukoy sa muling pagkakaroon ng wastong pagkaunawa o pagkamalay. Likas at malinaw sa makabagong Tagalog ang ‘matauhan.’
- source_word: וְשָׁבוּ
  choice: manumbalik sila
  rationale: Maaaring tumukoy ang pandiwa sa pagbabalik at, sa kontekstong moral, sa pagsisisi. Pinananatili ng ‘manumbalik’ ang larawan ng pagbabalik at ang moral na pahiwatig nang hindi nililimitahan sa ‘magsisi.’
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: magsumamo sa iyo
  rationale: Ipinahahayag ng anyong Hebreo ang taimtim na paghingi ng awa o pabor; ang ‘magsumamo’ ay natural, marangal, at angkop sa panalangin.
- source_word: הֶעֱוִינוּ
  choice: gumawa kami ng kabuktutan
  rationale: Ang ugat ay may diwa ng pagiging baluktot o paggawa ng kamalian. Pinananatili ng ‘kabuktutan’ ang natatanging larawan nito at inihihiwalay ito sa pangkalahatang ‘nagkasala.’
- source_word: רָשָׁעְנוּ
  choice: kumilos kami nang napakasama
  rationale: Tumutukoy ito sa pagkilos nang masama o may kasamaan. Ang parirala ay malinaw sa ordinaryong mambabasa at pinananatili ang ikatlong bahagi ng tatluhang pagpapahayag ng kasalanan.
theological_decisions:
- issue: Ang וְשָׁבוּ ay maaaring unawain bilang pisikal na ‘bumalik’ o moral na ‘magsisi/manumbalik.’
  choice: manumbalik sila
  alternative: magsisi sila
  rationale: Ang ‘manumbalik’ ay nagpapanatili sa pangunahing kahulugan ng pagbabalik habang pinahihintulutan ang malinaw na moral na diwa ng konteksto; hindi nito tahasang nilulutas ang saklaw ng pandiwa sa isang teolohikal na termino lamang.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang malinaw na ‘bilang mga bihag’ upang maging natural ang pasibong Hebreo, at pinanatili ang tatlong magkakaibang pagpapahayag ng pag-amin sa kasalanan.
