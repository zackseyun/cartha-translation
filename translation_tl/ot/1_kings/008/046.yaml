base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: tl
  text: Kapag nagkasala sila laban sa iyo—sapagkat walang taong hindi nagkakasala—at magalit ka sa kanila at ibigay mo sila sa isang kaaway, at dalhin sila ng mga bumihag sa kanila bilang mga bihag sa lupain ng kaaway, malayo man o malapit,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Kapag nagkasala sila sa iyo
  rationale: Ang pambungad na כִּי ay naglalahad ng isang posibleng kalagayan sa panalangin; natural sa Tagalog ang “kapag,” habang ang לָךְ ay nagpapahayag na ang kasalanan ay laban sa Diyos.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: sapagkat walang taong hindi nagkakasala
  rationale: Pinananatili ng “sapagkat” ang paliwanag na gamit ng כִּי, at ang “tao” ay likas at pangkalahatang katumbas ng אָדָם sa modernong Tagalog.
- source_word: וְאָנַפְתָּ בָם
  choice: at magalit ka sa kanila
  rationale: Tuwirang ipinapahayag ng pandiwa ang galit ng Diyos nang hindi dinaragdagan ang tindi nito.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: at ibigay mo sila sa kamay ng isang kaaway
  rationale: Ang idyomatikong “sa kamay ng” ay malinaw na naghahayag ng pagpapasailalim sa kapangyarihan ng kaaway; ang “isang” ay tumutugma sa walang artikulong singular na אוֹיֵב.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: at dalhin silang bihag ng mga bumihag sa kanila
  rationale: Pinananatili nito kapwa ang diwa ng pagdadala sa pagkabihag at ang tahasang pagbanggit sa kanilang mga bumihag.
- source_word: אֶל אֶרֶץ הָאוֹיֵב
  choice: patungo sa lupain ng kaaway
  rationale: Tuwirang katumbas ito ng parirala at pinananatili ang tiyak na kaaway sa ikalawang pagbanggit.
- source_word: רְחוֹקָה אוֹ קְרוֹבָה
  choice: malayo man o malapit
  rationale: Likas na pariralang Tagalog ito para sa alternatibong “malayo o malapit,” at tumutukoy sa lupain.
theological_decisions:
- issue: Pangkalahatang gamit ng אָדָם
  choice: tao
  alternative: sinuman
  rationale: Ang singular na אָדָם ay pangkalahatang tumutukoy sa sangkatauhan. Ang “tao” ay tumpak, inklusibo, at hindi nangangailangan ng paliwanag na talababa sa Tagalog.
- issue: Katiyakan o kondisyon sa pambungad na כִּי
  choice: Kapag
  alternative: Kung
  rationale: Ang “kapag” ay umaayon sa daloy ng mga kalagayang inilalahad sa panalangin at sa kasunod na pahayag na walang taong hindi nagkakasala, ngunit hindi nito binabago ang anyong pangyayari ng sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mahabang pangungusap at pangwakas na kuwit dahil nagpapatuloy ang kondisyon sa susunod na talata. Walang talababa sapagkat walang mahalagang ambiguwidad na hindi kayang katawanin nang natural sa pangunahing teksto.
