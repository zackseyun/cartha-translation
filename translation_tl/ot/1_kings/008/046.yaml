revisions:
- from: Kapag nagkasala sila sa iyo—sapagkat walang taong hindi nagkakasala—at magalit ka sa kanila at ibigay mo sila sa kamay ng isang kaaway, at dalhin silang bihag ng mga bumihag sa kanila patungo sa lupain ng kaaway, malayo man o malapit,
  to: Kapag nagkasala sila laban sa iyo—sapagkat walang taong hindi nagkakasala—at magalit ka sa kanila at ibigay mo sila sa isang kaaway, at dalhin sila ng mga bumihag sa kanila bilang mga bihag sa lupain ng kaaway, malayo man o malapit,
  rationale: Inayos ang pagsasalin ng “laban sa iyo” upang katawanin ang relasyong ipinahihiwatig ng Hebreong pandiwa, inalis ang hindi kinakailangang dagdag na idyomang “sa kamay ng,” at pinasimple ang sugnay tungkol sa pagkabihag upang maging malinaw at natural sa Tagalog. Napanatili ang saklaw ng kondisyon, ang pangkalahatang pahayag tungkol sa kasalanan, ang singular na “isang kaaway,” at ang bukas na sintaksis sa dulo ng talata.
