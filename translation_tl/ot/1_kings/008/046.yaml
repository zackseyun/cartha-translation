    rationale: Ang וּנְתַתָּם לִפְנֵי אוֹיֵב ay nagsasabing ibibigay sila sa harap/kapangyarihan ng isang kaaway; sapat at mas malapit ang “ibigay mo sila sa isang kaaway.”
  - severity: medium
