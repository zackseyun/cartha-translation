  source_fidelity: 'Kailangang gawing tahasan ang relasyong ipinahihiwatig ng חטא + לָךְ: ang kasalanan ay laban sa Diyos, hindi lamang ginagawa “sa” kanya. Ang idyomang “sa kamay ng” ay wala sa Hebreo at maaaring alisin nang walang pagkawala ng diwa. Ang sugnay tungkol sa mga bumihag ay dapat malinaw na ang mga bumihag ang nagdala sa kanila bilang mga bihag.'
  naturalness: Ang “dalhin silang bihag ng mga bumihag sa kanila” ay mabigat at maaaring pansamantalang magpalabo sa sintaktikong ugnayan. Mas natural ang aktibong ayos na “dalhin sila ... bilang mga bihag.” Pinananatili ng rebisyon ang marangal at modernong rehistro at ang pangwakas na kuwit, sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
  terminology: Ang “tao” ay angkop para sa pangkalahatang אָדָם. Ang “kaaway” at “lupain ng kaaway” ay tumpak at natural. Walang talababa ang kinakailangan; walang footnote anchor sa tekstong Hebreo na kailangang katawanin.
  issues:
