  source_fidelity: Tumpak na naipapahayag ng salin ang haba ng mga pingga, ang pagkakitang mga dulo nito mula sa Banal na Lugar sa harap ng pinakaloob na santuwaryo, ang hindi pagkakita mula sa labas, at ang pahayag na nanatili ang mga pingga roon hanggang sa panahon ng manunulat. Ang mga tinutukoy ng “mga iyon” sa ikalawang sugnay ay natural na ang mga dulo, samantalang ang huling tahasang “mga pingga” ay wastong paglilinaw sa pangwakas na panghalip ng Hebreo.
