  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: tl
  text: Napakahaba ng mga pingga kaya nakikita mula sa Banal na Lugar ang mga dulo ng mga ito sa harap ng pinakaloob na santuwaryo[a], ngunit hindi nakikita ang mga iyon mula sa labas. Nananatili roon ang mga pingga hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kabanal-banalang Lugar.” Ang salitang Hebreo ay tumutukoy sa pinakaloob na santuwaryo ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: Napakahaba
  rationale: 'Ipinapahayag ng pandiwa ang resultang kalagayan ng mga pingga: sapat ang haba ng mga ito upang makita ang mga dulo. Natural ito sa modernong Tagalog at malinaw ang ugnayang sanhi sa kasunod na sugnay.'
- source_word: הַבַּדִּים
  choice: mga pingga
  rationale: Tumutukoy ito sa mahahabang baras na ginagamit sa pagbuhat sa kaban. Ang “mga pingga” ay karaniwang salitang Filipino na angkop sa gamit na ito.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: nakikita ... ang mga dulo ng mga ito
  rationale: Bagaman literal na “mga ulo” ang רָאשֵׁי, “mga dulo” ang natural na katumbas para sa mga pingga. Pinananatili ng “nakikita” ang pasibong kahulugan ng Niphal nang hindi tinutukoy kung sino ang tumitingin.
- source_word: מִן הַקֹּדֶשׁ
  choice: mula sa Banal na Lugar
  rationale: Sa arkitektura ng templo, tumutukoy ito sa panlabas na silid na naiiba sa pinakaloob na santuwaryo. Ang kapitalisadong “Banal na Lugar” ay malinaw na katawagang panglunan.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: sa harap ng pinakaloob na santuwaryo
  rationale: Ang דְּבִיר ay ang pinakaloob na silid ng templo, at ang עַל־פְּנֵי ay natural na naisasalin bilang “sa harap ng.”
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: ngunit hindi nakikita ang mga iyon mula sa labas
  rationale: 'Malinaw na pinananatili nito ang kaibahan: nakikita ang mga dulo mula sa Banal na Lugar, ngunit hindi mula sa labas.'
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: Nananatili roon ang mga pingga hanggang sa araw na ito
  rationale: Ipinahihiwatig ng Hebreong idyoma ang nagpapatuloy na kalagayan mula sa pananaw ng tagapagsalaysay. Nilinaw ang tinutukoy sa pamamagitan ng pag-uulit sa “mga pingga.”
theological_decisions:
- issue: Pagkakakilanlan ng דְּבִיר
  choice: pinakaloob na santuwaryo
  alternative: Kabanal-banalang Lugar
  rationale: Mas tuwirang inilalarawan ng pangunahing teksto ang lokasyon nang hindi ipinapalagay na ang teknikal na katawagang “Kabanal-banalang Lugar” lamang ang kahulugan; inilalahad sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pingga,” “Banal na Lugar,” at “pinakaloob na santuwaryo” upang maging malinaw ang kagamitan at ayos ng templo nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
