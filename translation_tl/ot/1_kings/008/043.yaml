source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: tl
  text: Dinggin mo nawa mula sa langit, mula sa iyong tahanan, at gawin mo ang lahat ng hinihiling[a] sa iyo ng dayuhan, upang makilala ng lahat ng bayan sa lupa ang iyong pangalan, matakot sila sa iyo gaya ng iyong bayang Israel, at malaman nilang ang iyong pangalan ay itinawag[b] sa bahay na ito na aking itinayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “anumang itinatawag niya sa iyo” o “idinaraing niya sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang iyong pangalan ay itinawag sa bahay na ito,” isang idyomang nagpapahiwatig na ang bahay ay sa iyo o nagtataglay ng iyong pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: Dinggin mo nawa
  rationale: Ang imperfect na pandiwa ay nasa konteksto ng panalangin at kahilingan; ipinahahayag ng “nawa” ang pakiusap nang natural sa Tagalog.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: sa langit, ang lugar na iyong tinitirhan
  rationale: Pinananatili ang langit bilang lugar ng paninirahan ng Diyos at ang appositional na ayos ng Hebreo nang hindi ginagawang labis na teknikal.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: at gawin mo ang lahat ng
  rationale: Ang malawak na pandiwang “gawin” ay nagpapanatili sa bukas na saklaw ng tugon ng Diyos sa kahilingan.
- source_word: יִקְרָא אֵלֶיךָ
  choice: hinihiling sa iyo
  rationale: Sa konteksto ng panalangin, ang pagtawag sa Diyos ay may kasamang kahilingan. Natural ito sa Tagalog, habang itinatala sa talababa ang mas literal na mga alternatibo.
- source_word: הַנָּכְרִי
  choice: dayuhan
  rationale: Tumutukoy ito sa taong mula sa ibang bayan, hindi lamang sa isang hindi kakilala.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: lahat ng bayan sa lupa
  rationale: Ipinapakita ng “mga bayan” ang mga pangkat ng tao, at ng “sa lupa” ang pandaigdig na saklaw.
- source_word: לְיִרְאָה אֹתְךָ
  choice: matakot sa iyo
  rationale: Pinananatili ng “matakot” ang saklaw ng ירא—takot, pagpipitagan, at paghanga—sa halip na paliitin ito sa paggalang lamang.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: ang iyong pangalan ay itinawag sa bahay na ito
  rationale: Pinananatili ang kapansin-pansing idyomang Hebreo; ipinapaliwanag sa talababa ang diwa nitong pag-aari at pagkakaugnay sa Diyos.
theological_decisions:
- issue: Ang takot sa Diyos bilang tugon ng mga bayan
  choice: matakot sa iyo
  alternative: magpitagan sa iyo
  rationale: Hindi nilulutas o pinapalambot ang teolohikal na tensiyon ng ירא, na maaaring magsama ng banal na takot, paghanga, at pagpipitagan.
- issue: Ang pangalan ng Diyos na itinawag sa templo
  choice: ang iyong pangalan ay itinawag sa bahay na ito
  alternative: ang bahay na ito ay nagtataglay ng iyong pangalan
  rationale: Mas malapit ang napiling anyo sa idyomang Hebreo, samantalang nililinaw ng talababa na ipinahihiwatig nito ang pag-aari o natatanging pagkakaugnay ng bahay sa Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” para sa himig ng pakiusap, “dayuhan” para sa malinaw na pambansang pagkakaiba, at “matakot” upang mapanatili ang biblikal na teolohikal na lalim. Inilagay ang mga pananda ng talababa sa mismong pariralang kanilang ipinapaliwanag.
