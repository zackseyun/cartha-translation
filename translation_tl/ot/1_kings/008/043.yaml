    issue: Hindi wastong pagkakaangkla ng talababa a
    rationale: Ang talababa a ay tumatalakay sa יִקְרָא אֵלֶיךָ ('tumatawag/dumaraing sa iyo'), ngunit ang pananda ay nakakabit sa 'dayuhan,' na katumbas ng הַנָּכְרִי. Dapat itong ikabit sa 'hinihiling.'
  - severity: low
    issue: Malabo at di-idiomatiko ang apposition na 'sa langit, ang lugar na iyong tinitirhan'
    rationale: Ang מְכוֹן שִׁבְתֶּךָ ay 'iyong tahanan/lugar ng iyong paninirahan' na appositional sa langit. Ang 'mula sa langit, mula sa iyong tahanan' ay malinaw at natural sa Tagalog, habang ipinapahayag ang direksiyon ng pagdinig na ipinahihiwatig ng konteksto.
  - severity: low
    issue: Masyadong malawak ang saklaw ng pananda b
    rationale: Ang talababa b ay partikular na nagpapaliwanag sa idyomang 'ang iyong pangalan ay itinawag,' kaya dapat itong ilagay agad pagkatapos ng pariralang iyon.
