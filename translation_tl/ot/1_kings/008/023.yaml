id: 1KI.8.23
reference: 1 Kings 8:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: tl
  text: At sinabi niya, “Yahweh, Diyos ng Israel, walang Diyos na gaya mo sa langit sa itaas o sa lupa sa ibaba. Tinutupad mo ang tipan at ipinakikita ang tapat na pag-ibig[a] sa iyong mga lingkod na namumuhay sa iyong harapan nang buong puso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na ḥesed ay maaari ring tumukoy sa matibay na pag-ibig, katapatan sa tipan, o tapat na kagandahang-loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang pagkakasunod-sunod ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang ugnayang pandiskurso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Likas at tuwirang anyo ng katawagang construct sa Filipino.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: walang Diyos na gaya mo
  rationale: Malinaw na ipinahahayag ang kawalang-katulad ni Yahweh; ang אֱלֹהִים ay inuunawang singular sa konteksto, bagaman posible rin ang pagbasa na tumutukoy sa mga diyos.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: sa langit sa itaas o sa lupa sa ibaba
  rationale: Natural na Filipino na nagpapanatili sa saklaw na kosmiko ng magkatambal na parirala; ang “o” ay angkop kasunod ng negatibong “walang.”
- source_word: שֹׁמֵר הַבְּרִית
  choice: Tinutupad mo ang tipan
  rationale: Ang participle ay ginawang tuwirang paglalarawan sa patuloy na katangian at pagkilos ni Yahweh; ang “tinutupad” ay likas na kolokasyon para sa tipan sa Filipino.
- source_word: וְהַחֶסֶד
  choice: at ipinakikita ang tapat na pag-ibig
  rationale: Ipinapahayag ang חֶסֶד bilang pag-ibig na may katapatan at matibay na pananagutan sa tipan, nang hindi ito nililimitahan sa awa lamang.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Ang “mga lingkod” ay angkop sa ugnayang tipan at hindi nagpapasok ng di-kailangang diin sa pagkakaalipin.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: na namumuhay sa iyong harapan
  rationale: Inililipat sa natural na Filipino ang Hebreong metapora ng paglakad bilang paraan ng pamumuhay, habang pinananatili ang diwa ng pamumuhay sa presensiya ng Diyos.
- source_word: בְּכָל לִבָּם
  choice: nang buong puso
  rationale: Karaniwang Filipino para sa lubos at hindi hati-hating panloob na katapatan.
theological_decisions:
- issue: Paglalarawan sa kawalang-katulad ni Yahweh sa אֵין כָּמוֹךָ אֱלֹהִים
  choice: walang Diyos na gaya mo
  alternative: walang gaya mo sa mga diyos
  rationale: Ang napiling salin ay umaayon sa tuwirang pahayag ng kawalang-katulad sa konteksto, ngunit hindi ginagamit ang talata upang magpasya nang higit sa sinasabi nito tungkol sa kahulugan ng אֱלֹהִים.
- issue: Saklaw ng חֶסֶד sa konteksto ng tipan
  choice: tapat na pag-ibig
  alternative: matibay na pag-ibig; katapatan; kagandahang-loob
  rationale: Pinananatili nito kapwa ang dimensiyon ng pag-ibig at ang matatag na katapatang kaugnay ng tipan, sa halip na paliitin ang salita sa damdamin o awa lamang.
- issue: Relasyon ng הַבְּרִית at הַחֶסֶד
  choice: Tinutupad mo ang tipan at ipinakikita ang tapat na pag-ibig
  alternative: iniingatan mo ang tipan at ang tapat na pag-ibig
  rationale: Ginagawang natural sa Filipino ang iisang participle na namamahala sa dalawang layon, habang pinananatiling magkaugnay ngunit hindi lubusang pinagsasanib ang tipan at tapat na pag-ibig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at ang wikang may kaugnayan sa tipan, ngunit iniwasan ang sobrang literal na ayos na magiging malamya sa karaniwang mambabasa.
