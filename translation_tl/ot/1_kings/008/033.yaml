  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: tl
  text: Kapag ang iyong bayang Israel ay matalo sa harap ng isang kaaway dahil nagkasala sila sa iyo, at manumbalik sila sa iyo, kilalanin nila ang iyong pangalan[a], manalangin sila, at magsumamo sila sa iyo sa bahay na ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “purihin ang iyong pangalan” o “pasalamatan ang iyong pangalan.” Ang pandiwang Hebreo ay maaaring tumukoy sa hayagang pagkilala, pagpuri, o pasasalamat depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: matalo
  rationale: Sa kontekstong militar, ang Niphal ng נָגַף ay tumutukoy sa pagkatalo sa harap ng kaaway. Ang “matalo” ay natural sa modernong Tagalog at malinaw na nagpapanatili sa diwang pasibo ng pangyayari.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ang iyong bayang Israel
  rationale: Pinananatili nito ang pag-aari sa tipan at ang pagkakakilanlan ng bayan bilang Israel.
- source_word: לִפְנֵי אוֹיֵב
  choice: sa harap ng isang kaaway
  rationale: Malapit ito sa literal na “sa harap ng” at ang “isang kaaway” ay umaayon sa pangngalang walang pantukoy sa Hebreo.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: dahil nagkasala sila sa iyo
  rationale: Ipinahahayag nito ang malamang na panlahilang gamit ng אֲשֶׁר sa konteksto nang hindi dinaragdagan ang teolohikal na nilalaman.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: at manumbalik sila sa iyo
  rationale: Ang “manumbalik” ay natural at marangal na katumbas ng pagbaling o pagbabalik sa Diyos, nang hindi tahasang idinaragdag ang mas malawak na terminong “magsisi.”
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: ipahayag ang iyong pangalan
  rationale: Sa konteksto ng kasalanan at pagbabalik, ang Hiphil ng ידה ay nagpapahiwatig ng hayagang pagkilala sa pangalan ng Diyos. Pinananatili sa talababa ang tunay na posibilidad na purihin o pasalamatan ang kanyang pangalan.
- source_word: וְהִתְפַּלְלוּ
  choice: manalangin
  rationale: Karaniwan at tuwirang katumbas ng Hitpael ng פלל.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: magsumamo sa iyo
  rationale: Ipinapahayag ng “magsumamo” ang taimtim na paghingi ng awa o lingap, samantalang ang “sa iyo” ay tuwirang tumutugma sa אֵלֶיךָ nang magdagdag ng di-tiyak na layon.
- source_word: בַּבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Pinananatili ang payak na kahulugan ng בַּיִת at ang malinaw na lokatibong pang-ukol na “sa,” sa halip na gawing “patungo sa” o agad na ipakahulugang “templo.”
theological_decisions:
- issue: Wika ng pagbabalik matapos magkasala
  choice: manumbalik sila sa iyo
  alternative: magsisi sila at bumalik sa iyo
  rationale: Ang שׁוּב ay nangangahulugang bumaling o bumalik. Ipinahihiwatig ng konteksto ang pagsisisi, ngunit hindi ito pinalawak sa dalawang kilos na hindi tahasang nasa pandiwa.
- issue: Kahulugan ng וְהוֹדוּ אֶת שְׁמֶךָ sa kontekstong nagsisisi
  choice: ipahayag ang iyong pangalan
  alternative: purihin ang iyong pangalan; pasalamatan ang iyong pangalan
  rationale: May saklaw ang ידה na hayagang pagkilala, pagpuri, o pasasalamat. Ang “ipahayag” ay angkop sa daloy mula kasalanan tungo sa pagbabalik, habang inilalahad sa talababa ang mga lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “bayang Israel,” “manumbalik,” at “magsumamo” upang mapanatili ang tono ng panalangin nang hindi maging lipas o labis na teknikal. Ang pangungusap ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang kondisyon sa kasunod na talata.
