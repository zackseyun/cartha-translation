revisions:
- from: 'At ngayon, Yahweh, Diyos ng Israel, tuparin mo para sa iyong lingkod na si David na aking ama ang sinabi mo sa kanya: “Hindi ka mawawalan sa harapan ko ng isang lalaking uupo sa trono ng Israel,[a] kung iingatan lamang ng iyong mga anak ang kanilang landas sa pamamagitan ng paglakad sa harapan ko, gaya ng paglakad mo sa harapan ko.”'
  to: 'At ngayon, Yahweh, Diyos ng Israel, tuparin mo para sa iyong lingkod na si David na aking ama ang sinabi mo sa kanya: “Hindi ka mawawalan ng lalaking uupo sa trono ng Israel sa harapan ko,[a] kung iingatan lamang ng iyong mga anak ang kanilang landas, sa pamamagitan ng paglakad sa harapan ko, gaya ng paglakad mo sa harapan ko.”'
  rationale: Inayos ang pagkakasunod-sunod ng mga parirala sa idyomang dynastiko upang maging natural sa Filipino nang hindi nawawala ang ‘sa harapan ko,’ at nagdagdag ng kuwit upang luminaw ang ugnayan ng pag-iingat sa landas at paglakad sa harapan ng Diyos. Pinanatili ng talababa ang literal na larawan ng Hebreong ‘mapuputol.’
