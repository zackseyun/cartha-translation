  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: tl
  text: 'At ngayon, Yahweh, Diyos ng Israel, tuparin mo para sa iyong lingkod na si David na aking ama ang sinabi mo sa kanya: “Hindi ka mawawalan ng lalaking uupo sa trono ng Israel sa harapan ko,[a] kung iingatan lamang ng iyong mga anak ang kanilang landas, sa pamamagitan ng paglakad sa harapan ko, gaya ng paglakad mo sa harapan ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “Hindi mapuputol para sa iyo mula sa harapan ko ang isang lalaking nakaupo sa trono ng Israel.” Isa itong Hebreong idyoma tungkol sa hindi pagkaputol ng hanay ng mga hahalili sa trono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: שְׁמֹר
  choice: tuparin mo
  rationale: Kapag isang pahayag na may laman ng pangako ang layon, ang שׁמר ay likas na tumutukoy sa pagtupad o pag-iingat sa ipinangako; “tuparin mo” ang malinaw at natural sa makabagong Tagalog.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: para sa iyong lingkod na si David na aking ama
  rationale: Pinananatili ang mapagpakumbabang tawag na “lingkod,” ang pangalan ni David, at ang kaugnayan niya kay Solomon.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: ang sinabi mo sa kanya
  rationale: Hindi tahasang dinagdagan ng salitang “pangako” ang Hebreo, bagaman malinaw sa konteksto na pangako ang sinasabi.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: Hindi ka mawawalan sa harapan ko ng isang lalaki
  rationale: Isinalin ang Hebreong idyoma ayon sa natural nitong kahulugan na hindi mawawalan ng kahalili si David, habang pinananatili ang “sa harapan ko.” Nasa talababa ang mas literal na larawan ng “maputol.”
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: uupo sa trono ng Israel
  rationale: Ipinahahayag nang natural sa Tagalog ang tungkulin ng magiging kahalili sa maharlikang trono.
- source_word: רַק אִם
  choice: kung ... lamang
  rationale: Malinaw na pinananatili ang mariing kondisyon ng pangako.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: iingatan ng iyong mga anak ang kanilang landas
  rationale: Pinananatili ang talinghaga ng landas bilang asal o paraan ng pamumuhay at ang pandiwang nangangahulugang maingat na pagbabantay.
- source_word: לָלֶכֶת לְפָנַי כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: sa pamamagitan ng paglakad sa harapan ko, gaya ng paglakad mo sa harapan ko
  rationale: Pinananatili ang talinghaga ng paglakad sa harapan ng Diyos at ang ugnayang pamaraan ng infinitibo.
theological_decisions:
- issue: Ang kondisyon ng pangako tungkol sa pagpapatuloy ng angkan ni David
  choice: Inilalahad ang pagpapatuloy ng paghahari bilang pangakong may tahasang kondisyon sa asal ng mga anak ni David.
  alternative: Unawain ang pangako bilang lubos na walang kondisyon at ang kondisyon bilang tungkol lamang sa pagtatamasa ng mga pakinabang nito.
  rationale: Tahasang ginagamit ng Hebreo ang רַק אִם (“kung ... lamang”), kaya hindi nilulutas ng salin ang tensiyong teolohikal sa pamamagitan ng ibang mga teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga biblikal na talinghagang “landas” at “paglakad sa harapan” dahil malinaw ang mga ito sa konteksto, ngunit isinalin nang idyomatiko ang pormulang dynastiko upang maiwasan ang maling pagkaunawang pisikal na pagputol.
