revisions:
- from: Naghandog si Solomon kay Yahweh ng mga handog para sa kapayapaan[a]—dalawampu’t dalawang libong baka at isang daan at dalawampung libong tupa at kambing. Sa gayon, itinalaga ng hari at ng lahat ng mga Israelita[b] ang bahay ni Yahweh.
  to: 'Nag-alay si Solomon kay Yahweh ng mga haing pangkapayapaan[a]: dalawampu’t dalawang libong baka at isang daan at dalawampung libong hayop mula sa kawan. Sa gayon, itinalaga ng hari at ng lahat ng mga Israelita[b] ang bahay ni Yahweh.'
  rationale: Pinalitan ang “tupa at kambing” ng “mga hayop mula sa kawan” upang huwag magdagdag ng detalyeng hindi tahasang ibinibigay ng Hebreo. Ginawang “mga haing pangkapayapaan” ang teknikal na katawagan upang maging mas natural sa Tagalog at upang maipahayag ang sakripisyong katangian ng זבח. Inayos ang talababa b upang maisama ang “lahat” mula sa כָל.
