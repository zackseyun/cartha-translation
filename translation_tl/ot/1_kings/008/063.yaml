source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: tl
  text: 'Nag-alay si Solomon kay Yahweh ng mga haing pangkapayapaan[a]: dalawampu’t dalawang libong baka at isang daan at dalawampung libong hayop mula sa kawan. Sa gayon, itinalaga ng hari at ng lahat ng mga Israelita[b] ang bahay ni Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa pakikipag-isa” o “mga handog para sa mabuting kalagayan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng mga anak na lalaki ng Israel,” isang nakaugaliang katawagan para sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Naghandog
  rationale: Sa konteksto ng paghahain, malinaw na ipinahihiwatig ng “naghandog” ang ritwal na pag-aalay nang hindi nagiging mabigat o di-likas sa modernong Tagalog.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Ipinapahayag nito ang tradisyonal na diwa ng שְׁלָמִים habang pinananatili sa talababa ang iba pang posibleng aspekto nito, gaya ng pakikipag-isa at mabuting kalagayan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יְהוָה sa pamamagitan ng transliterasyong “Yahweh.”
- source_word: בָּקָר
  choice: baka
  rationale: Ang בָּקָר ay pangkalahatang katawagan sa mga hayop na bovine; natural at sapat ang “baka” sa Tagalog para sa malaking bilang na binanggit.
- source_word: צֹאן
  choice: tupa at kambing
  rationale: Ang צֹאן ay maaaring tumukoy sa maliliit na alagang hayop ng kawan, kapuwa tupa at kambing; iniiwasan ng saling ito ang di-makatwirang paglilimita sa tupa lamang.
- source_word: וַיַּחְנְכוּ
  choice: itinalaga
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pormal na pagtatalaga ng gusali para sa banal na gamit.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang tahasang metaporang Hebreo na “bahay,” sa halip na ipalit agad ang mas interpretibong “templo.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural na makabagong Tagalog para sa nakaugaliang pambansa at pangtipang katawagang Hebreo; inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang katangian nito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikipag-isa; mga handog para sa mabuting kalagayan
  rationale: May ilang magkakaugnay na diwa ang teknikal na terminong ito. Gumagamit ang pangunahing teksto ng malinaw at nakaugaliang salin, habang pinananatili sa talababa ang tunay na leksikal na lawak.
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ng Israel; mga anak ng Israel
  rationale: Sa talatang ito, ang parirala ay nakaugaliang katawagan sa sambayanang Israel at hindi pagtiyak na mga lalaking anak lamang ang tinutukoy. Pinananatili sa talababa ang literal na anyong Hebreo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Pinanatili ang “bahay ni Yahweh” upang maging malinaw ang anyo ng Hebreo, ngunit ginawang idiomatiko ang pambansang katawagang “mga Israelita.” Ginamit ang buong anyong pasalita ng mga bilang para sa angkop na rehistro ng tekstong biblikal.
