  text: כִּ֤י יִשְׁמְעוּ/ן֙ אֶת שִׁמְ/ךָ֣ הַ/גָּד֔וֹל וְ/אֶת יָֽדְ/ךָ֙ הַֽ/חֲזָקָ֔ה וּֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥א וְ/הִתְפַּלֵּ֖ל אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: tl
  text: sapagkat maririnig nila ang tungkol sa iyong dakilang pangalan[a], sa iyong makapangyarihang kamay, at sa iyong nakaunat na bisig; at darating siya at mananalangin na nakaharap sa bahay na ito—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pangmaramihan muna ang simuno (“maririnig nila”) ngunit nagiging isahan pagkatapos (“darating siya at mananalangin”). Malamang na lumilipat ang tinutukoy mula sa mga dayuhan sa pangkalahatan tungo sa isang kinatawang dayuhan.
    reason: Pagpapaliwanag sa paglipat ng bilang ng simuno sa Hebreo.
lexical_decisions:
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan na kaugnay ng panalangin para sa dayuhan sa naunang talata.
- source_word: יִשְׁמְעוּן
  choice: maririnig nila
  rationale: Pinananatili ang pangmaramihang anyo at ang hinaharap o pangkalahatang diwa ng pandiwa.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: ang tungkol sa iyong dakilang pangalan
  rationale: Likas sa Filipino ang 'marinig ang tungkol sa'; pinananatili ng 'pangalan' ang diwa ng ipinahayag na katanyagan at reputasyon ng Diyos.
- source_word: יָדְךָ הַחֲזָקָה
  choice: iyong makapangyarihang kamay
  rationale: Pinananatili ang kongkretong larawan ng kamay bilang pagpapahayag ng kapangyarihan ng Diyos.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: iyong nakaunat na bisig
  rationale: Tumpak at dignidad na salin ng karaniwang biblikal na larawan ng aktibong kapangyarihan ng Diyos.
- source_word: וּבָא
  choice: at darating siya
  rationale: Pinananatili ang biglang paglipat ng Hebreo mula sa maramihang 'nila' tungo sa isahang kinatawang dayuhan.
- source_word: וְהִתְפַּלֵּל
  choice: at mananalangin
  rationale: Kaugnay ito ng naunang pandiwang isahan at tumutukoy sa gagawin ng dayuhang darating.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: nang nakaharap sa templong ito
  rationale: Ipinahahayag ang direksiyon ng panalangin, hindi ang pagpasok sa gusali; 'templo' ang likas na kontekstuwal na katawagan sa bahay na ito.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa kapangyarihan ng Diyos
  choice: Panatilihin nang tahasan ang 'kamay' at 'bisig'
  alternative: Isalin bilang 'kapangyarihan' o 'lakas'
  rationale: Mahalaga sa panitikan at teolohiya ng teksto ang kongkretong larawang Hebreo; hindi ito dapat gawing abstrakto.
- issue: Paglipat mula sa maramihan tungo sa isahang simuno
  choice: Panatilihin ang 'maririnig nila ... darating siya'
  alternative: 'Pakapantayin bilang maramihan: ''maririnig nila ... darating sila at mananalangin'''
  rationale: Hayagang pinananatili nito ang tensiyon sa orihinal, na maaaring lumilipat mula sa mga dayuhan bilang pangkat tungo sa isang kinatawang dayuhan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'templo' para sa kontekstuwal na kahulugan ng הַבַּיִת, at 'nang nakaharap sa' upang likas na ipahayag sa Filipino ang direksiyon ng pananalangin. Pinanatili ang gitling sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
