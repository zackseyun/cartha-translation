review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: isang panalanging pakiusap na marinig, magpatawad, kumilos, at magbigay sa bawat tao ayon sa kanyang mga lakad; pinananatili rin ang natatanging kaalaman ng Diyos sa puso ng lahat. Gayunman, ang “yamang” ay ginagawang tahasang sanhi ang relatibong sugnay na “na ang puso niya ay nalalaman mo,” samantalang mas mabuting panatilihin ang tuwirang pag-uugnay nito sa “bawat tao.”'
  naturalness: May di-likas na konstruksiyong “Ibigay mo sa bawat tao ang ayon sa lahat ng kanyang mga lakad.” Kailangan ng hayag na layon, gaya ng “ang nararapat.” Mas malinaw at mas maayos ding ipagpatuloy sa iisang hanay ang magkakasunod na pakiusap sa halip na putulin sa tuldok pagkatapos ng “kumilos.”
  terminology: Ang “langit,” “puso,” at “mga anak ng tao” ay angkop. Ang “mga lakad” ay katanggap-tanggap na biblikal na metapora para sa asal o pamumuhay. Ang talababa ay wastong nakatali sa “mga anak ng tao” at sapat na ipinapaliwanag ang idyoma.
  issues:
  - severity: medium
    issue: Di-singaw at di-ganap na pariralang “Ibigay mo sa bawat tao ang ayon sa lahat ng kanyang mga lakad.”
    rationale: Ang “ang ayon” ay hindi wastong layon ng “ibigay.” Ang Hebreong “magbigay sa bawat tao ayon sa lahat ng kanyang mga lakad” ay nangangailangan sa Tagalog ng layong tulad ng “ang nararapat,” nang hindi nagdaragdag ng bagong kahulugan.
  - severity: low
    issue: Ang “yamang nalalaman mo ang kanyang puso” ay mas sanhi kaysa relatibong paglalarawan.
    rationale: Ang אֲשֶׁר ay mas malapit na inilalarawan ang bawat tao (“na ang puso niya ay nalalaman mo”). Ang binagong anyo ay pinananatili ang ugnayang ito nang hindi labis na pinipilit ang sintaks.
  - severity: low
    issue: Naputol ang magkakasunod na kahilingan sa pamamagitan ng tuldok.
    rationale: Ang Hebreong waw-chain ay magkakaugnay na mga pakiusap; ang kuwit at “at” ay mas angkop na katumbas sa Tagalog.
  revised_text: kung gayon, dinggin mo sa langit, sa lugar ng iyong tahanan, at magpatawad ka, kumilos ka, at ibigay mo sa bawat tao ang nararapat ayon sa lahat ng kanyang mga lakad, na ang puso niya ay nalalaman mo—sapagkat ikaw lamang ang nakaaalam sa puso ng lahat ng mga anak ng tao[a]—
