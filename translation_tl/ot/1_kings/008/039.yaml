  to: kung gayon, dinggin mo sa langit, sa lugar ng iyong tahanan, at magpatawad ka, kumilos ka, at ibigay mo sa bawat tao ang nararapat ayon sa lahat ng kanyang mga lakad, na ang puso niya ay nalalaman mo—sapagkat ikaw lamang ang nakaaalam sa puso ng lahat ng mga anak ng tao[a]—
