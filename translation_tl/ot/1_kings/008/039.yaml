  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: tl
  text: kung gayon, dinggin mo sa langit, sa lugar ng iyong tahanan, at magpatawad ka, kumilos ka, at ibigay mo sa bawat tao ang nararapat ayon sa lahat ng kanyang mga lakad, na ang puso niya ay nalalaman mo—sapagkat ikaw lamang ang nakaaalam sa puso ng lahat ng mga anak ng tao[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng mga anak ng tao,” isang idyomang nangangahulugang lahat ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: dinggin mo
  rationale: Sa konteksto ng panalangin ni Solomon, ang anyong di-ganap ay isang pakiusap. Likas na ipinahahayag ito sa Tagalog sa anyong pakiusap na “dinggin mo.”
- source_word: הַשָּׁמַיִם
  choice: sa langit
  rationale: 'Ang pariralang kasunod na “lugar ng iyong tahanan” ay nagpapakitang lokatibo ang gamit: doon hinihiling na dinggin ng Diyos ang panalangin.'
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: na siyang lugar ng iyong tahanan
  rationale: Pinananatili nito ang diwa ng isang tiyak na lugar ng paninirahan habang natural ang daloy sa makabagong Tagalog.
- source_word: וְסָלַחְתָּ
  choice: at magpatawad ka
  rationale: Ipinagpapatuloy ng pandiwa ang magkakasunod na kahilingan kay Yahweh.
- source_word: וְעָשִׂיתָ
  choice: at kumilos
  rationale: Malawak ang kahulugan ng pandiwang עשה. Ang “kumilos” ay tumutukoy sa tugon ng Diyos nang hindi tinutukoy nang labis kung anong pagkilos iyon.
- source_word: וְנָתַתָּ לָאִישׁ
  choice: Ibigay mo sa bawat tao
  rationale: Ang isahang אִישׁ ay distributibo rito; ipinahahayag ng “bawat tao” ang indibiduwal na paglalapat.
- source_word: כְּכָל דְּרָכָיו
  choice: ang ayon sa lahat ng kanyang mga lakad
  rationale: Pinananatili ng “mga lakad” ang Hebreong metapora para sa asal at paraan ng pamumuhay.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: yamang nalalaman mo ang kanyang puso
  rationale: Malinaw at natural na inuugnay nito ang kaalaman ng Diyos sa taong tatanggap ayon sa kanyang mga lakad, nang hindi binabago ang diwa ng sugnay.
- source_word: לְבָב / לְבָבוֹ
  choice: puso
  rationale: Ang “puso” ang karaniwang katumbas na nagpapanatili sa biblikal na larawan ng kalooban, pag-iisip, at panloob na pagkatao.
- source_word: לְבַדְּךָ
  choice: ikaw lamang
  rationale: Malinaw nitong ipinahahayag na ang Diyos lamang ang may ganitong ganap na kaalaman.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: lahat ng mga anak ng tao
  rationale: Pinananatili nito ang anyo at tekstura ng Hebreong idyoma, habang nililinaw sa talababa na saklaw nito ang lahat ng tao.
theological_decisions:
- issue: Saklaw ng pariralang כָּל בְּנֵי הָאָדָם
  choice: lahat ng mga anak ng tao
  alternative: lahat ng sangkatauhan
  rationale: Pinananatili sa pangunahing teksto ang Hebreong larawang “mga anak ng tao,” ngunit hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy; nililinaw ng talababa ang pangkalahatang saklaw.
- issue: Kaalaman ng Diyos sa puso
  choice: ikaw lamang ang nakaaalam sa puso
  alternative: ikaw lamang ang lubos na nakakakilala sa kalooban
  rationale: Ang “puso” ay nagpapanatili sa antropolohikal at teolohikal na larawan ng Hebreo at sa tahasang pag-aangkin na natatangi sa Diyos ang kaalamang ito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “dinggin” para sa panalanging pakiusap, “mga lakad” upang mapanatili ang Hebreong metapora para sa asal, at “puso” para sa panloob na pagkatao. Inilipat ang talababa sa mismong pariralang nililinaw nito.
