  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: tl
  text: 'At tumayo siya at binasbasan ang buong kapulungan ng Israel[a] sa malakas na tinig[b], na sinasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong sambayanan ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa dakilang tinig,” ibig sabihin, “sa malakas na tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: At tumayo siya
  rationale: Isinasaad ng waw-consecutive ang kasunod na kilos sa salaysay. Ang “tumayo” ang tuwirang kahulugan ng עמד at natural sa konteksto ng pampublikong pagtitipon.
- source_word: וַיְבָרֶךְ
  choice: binasbasan
  rationale: Ang ברך dito ay tumutukoy sa pagbigkas ng basbas sa nagkakatipong bayan. Ang “binasbasan” ay maikli, marangal, at hindi nagsasaad kung paano nagkakabisa ang basbas.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: ang buong kapulungan ng Israel
  rationale: Ang קהל ay ang bayang natipon bilang isang pampublikong kapulungan. Likas sa Filipino ang “buong kapulungan” bilang katumbas ng כָּל קְהַל.
- source_word: קוֹל גָּדוֹל
  choice: sa malakas na tinig
  rationale: Literal itong “dakilang tinig,” ngunit bilang idyoma ay tumutukoy sa lakas ng tinig. Ang “sa malakas na tinig” ay malinaw at natural.
- source_word: לֵאמֹר
  choice: 'na sinasabi:'
  rationale: Ipinakikilala ng infinitive ang nilalaman ng pananalitang sumusunod. Pinananatili ng “na sinasabi:” ang pormal na ugnayan sa susunod na sipi.
theological_decisions:
- issue: Ang uri ng pagbabasbas ni Solomon sa Israel
  choice: Pinanatili ang “binasbasan” bilang pagbigkas ng basbas sa nagkakatipong bayan.
  alternative: Ipaliwanag itong tahasang pagkakaloob ni Solomon ng biyaya sa pamamagitan ng sarili niyang kapangyarihan.
  rationale: Maaaring tumukoy ang ברך sa pormal at pampublikong pagbigkas ng basbas. Hindi nililinaw ng talata ang mekanismo nito, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” upang ipahayag ang pampublikong pagtitipon ng bayan, at “tinig” upang mapanatili ang pormal na himig ng salaysay.
