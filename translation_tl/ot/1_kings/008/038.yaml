  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: tl
  text: anumang panalangin o anumang pagsusumamo na ihaharap ng sinumang tao o ng buong bayan mong Israel[a]—kapag alam ng bawat isa ang pighati ng sarili niyang puso[b] at iuunat niya ang kanyang mga kamay patungo sa bahay na ito[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “para sa sinumang tao o para sa buong bayan mong Israel.” Maaaring tumukoy ang pang-ukol sa nananalangin o sa ipinapanalangin.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang salot ng kanyang puso.”
    reason: lexical_alternative
  - marker: c
    text: Ang “bahay na ito” ay ang templo.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: anumang panalangin, anumang pagsusumamo
  rationale: Inuulit ang “anumang” upang mapanatili ang malawak at mariing saklaw ng dalawang כָּל. Ang “pagsusumamo” ay likas at marangal na katumbas ng taimtim na paghingi ng awa o tulong.
- source_word: אֲשֶׁר תִהְיֶה
  choice: na iharap
  rationale: Sa konteksto ng panalangin, likas sa Tagalog ang “iharap” bilang magaan na pagkumpleto sa diwa ng panalanging ginagawa o iniaalay.
- source_word: לְכָל הָאָדָם לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: ng sinumang tao o ng buong bayan mong Israel
  rationale: Binabasa ang לְ bilang tumutukoy sa gumagawa ng panalangin, ayon sa kasunod na isahang gumagawa. Ang “tao” ay natural na panlahatang katumbas ng אָדָם sa modernong Tagalog; ang posibleng pagbasa na “para sa” ay pinananatili sa talababa.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: kapag alam ng bawat isa
  rationale: Ipinahahayag ng “bawat isa” ang distributibong puwersa ng אִישׁ sa loob ng mas malawak na pangkat, habang hindi labis na itinatakda ang ugnayang lohikal ng sugnay.
- source_word: נֶגַע לְבָבוֹ
  choice: ang pighati ng sarili niyang puso
  rationale: Ipinahahayag ng “pighati” ang pansariling paghihirap o dagok na batid ng nananalangin. Nasa talababa ang mas literal at mas matinding larawang “salot ng kanyang puso.”
- source_word: וּפָרַשׂ כַּפָּיו
  choice: at iniunat niya ang kanyang mga kamay
  rationale: Likas sa Tagalog ang “iniunat ang mga kamay” para sa kilos ng pananalangin, bagaman literal na “mga palad” ang כַּפָּיו.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: patungo sa bahay na ito
  rationale: Ang “patungo” ay malinaw na nagpapahayag ng direksiyon. Pinananatili ng “bahay” ang tahasang salita ng Hebreo at ang kaugnay nitong diwang teolohikal, sa halip na palitan agad ng “templo.”
theological_decisions:
- issue: Pagpapakahulugan sa לְ sa pariralang tumutukoy sa tao at sa bayang Israel
  choice: ng sinumang tao o ng buong bayan mong Israel
  alternative: para sa sinumang tao o para sa buong bayan mong Israel
  rationale: Mas maayos na umaayon ang pagbasa na gumagawa ng panalangin ang tao o bayan sa kasunod na isahang gumagawa na nakaaalam at nag-uunat ng mga kamay. Gayunman, tunay na maaari ring ipakahulugan ang pang-ukol bilang “para sa,” kaya hindi ito ikinubli at inilagay sa talababa.
- issue: Pagpapakahulugan sa הָאָדָם bilang panlahatang isahan
  choice: sinumang tao
  alternative: sinumang lalaki
  rationale: Sa kontekstong ito, ginagamit ang אָדָם para sa isang kinatawang tao, hindi upang tukuyin lamang ang kasariang lalaki. Ang “sinumang tao” ay tumpak at natural sa Tagalog habang pinananatili ang isahang diwa.
- issue: Pagpapanatili sa הַבַּיִת bilang “bahay”
  choice: bahay na ito
  alternative: templong ito
  rationale: Bagaman templo ang tinutukoy, tahasang “bahay” ang nasa Hebreo. Pinananatili ito sa pangunahing teksto upang hindi mawala ang katawagan at teolohikal na alingawngaw ng bahay ng PANGINOON; nililinaw ang reperente sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paralelismong “anumang … anumang,” ang indibidwal-kolektibong saklaw, at ang katawagang “bahay.” Ang bantas na gitling sa dulo ay nagpapakitang nagpapatuloy ang pangungusap sa susunod na talata.
