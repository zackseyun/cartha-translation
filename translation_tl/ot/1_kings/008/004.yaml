base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: tl
  text: Dinala nila paakyat[a] ang kaban ni Yahweh, ang Tolda ng Pagtitipon, at ang lahat ng banal na kagamitang nasa tolda. Ang mga pari at mga Levita[b] ang nagdala ng mga iyon paakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Binuhat nila paakyat.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagdadala o pagbubuhat paakyat sa isang prusisyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga pari at ang mga Levita.” Nauunawaan ito ng ilan nang mas tiyak bilang “mga paring Levita,” ngunit kapwa tahasang pinangalanan sa tekstong Hebreo ang mga pari at ang mga Levita.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Dinala nila paakyat
  rationale: Ang Hiphil ng עלה ay nangangahulugang “magdala paakyat.” Pinananatili ng salin ang direksiyonal at prusisyunal na diwa nang hindi ipinapalagay kung paano eksaktong binuhat o dinala ang mga bagay.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Ang אֲרוֹן ay ang sagradong kaban, at ang genitibong parirala ay likas na naipapahayag sa Filipino bilang “kaban ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֹהֶל מוֹעֵד
  choice: ang Tolda ng Pagtitipon
  rationale: Malapit ito sa literal na kahulugan ng parirala at malinaw na tumutukoy sa santuwaryong tolda kung saan nagaganap ang pakikipagtagpo.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: ang lahat ng banal na kagamitan
  rationale: Malawak ang saklaw ng כְּלִים at maaaring tumukoy sa iba’t ibang kasangkapan o kagamitan; hindi ito nililimitahan sa mga sisidlan lamang.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: na nasa tolda
  rationale: Likas na inuugnay ng sugnay ang mga banal na kagamitan sa toldang kababanggit lamang, nang hindi inuulit ang buong pangalan nito.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: nag­dala ng mga iyon paakyat
  rationale: Pinananatili ang pag-uulit ng pandiwang Hebreo at ang diwang paakyat.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ang mga pari at mga Levita
  rationale: Tahasan at magkahiwalay na binabanggit sa Hebreo ang dalawang pangkat, kaya hindi sila pinagsasama sa mas interpretatibong “mga paring Levita.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang pangalan sa salin.
- issue: Ugnayan ng mga pari at mga Levita sa pagdadala
  choice: Tahasan at magkahiwalay na banggitin ang dalawang pangkat
  alternative: mga paring Levita
  rationale: Ang Hebreo ay may “ang mga pari at ang mga Levita.” Pinananatili ang anyong ito upang hindi patahimikin ang posibleng tensiyon sa iba pang mga teksto tungkol sa kani-kanilang tungkulin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tolda ng Pagtitipon” bilang madaling maunawaang katawagang malapit sa Hebreo; pinanatili rin ang pag-uulit at direksiyonal na diwa ng “paakyat.”
