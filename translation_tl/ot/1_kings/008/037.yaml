source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: tl
  text: Kung magkaroon ng taggutom sa lupain, kung magkaroon ng salot, pagkalanta ng pananim, amag, balang, o mapanirang insekto[a]; kung kubkubin sila ng kanilang kaaway sa lupain ng kanilang mga lunsod[b]; anumang salot, anumang karamdaman—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang salitang Hebreo sa isang uri o yugto ng balang na lumalamon ng pananim; hindi tiyak ang eksaktong insekto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa lupain ng kanyang mga pintuang-bayan.” Ang “mga pintuang-bayan” ay tumutukoy sa mga lunsod o bayan.
    reason: metonymy
lexical_decisions:
- source_word: רָעָב
  choice: taggutom
  rationale: Sa talaan ng mga pambansang sakuna, tumutukoy ito sa malawakang kakulangan ng pagkain, hindi lamang sa karaniwang gutom.
- source_word: דֶּבֶר
  choice: salot
  rationale: Likas at dignified na katawagan ito para sa nakahahawang sakit na lumalaganap; inihihiwalay ito sa mas pangkalahatang נֶגַע sa hulihan ng talata.
- source_word: שִׁדָּפוֹן
  choice: pagkalanta ng pananim
  rationale: Tumutukoy ito sa pagkasira o pagkatuyo ng pananim, marahil dahil sa nakapapasong hangin; nilinaw ang kontekstong pansakahan.
- source_word: יֵרָקוֹן
  choice: amag
  rationale: Sa kontekstong pansakahan, tumutukoy ito sa sakit o paninilaw ng halaman; ang “amag” ay maikli at madaling maunawaan, bagaman hindi tiyak ang eksaktong uri ng pinsala.
- source_word: אַרְבֶּה
  choice: balang
  rationale: Karaniwang tawag sa insektong dumaragsa at sumisira sa pananim; kolektibo ang gamit ng anyong isahan sa Hebreo.
- source_word: חָסִיל
  choice: mapanirang insekto
  rationale: Hindi tiyak ang eksaktong uri; maaaring isang uri o yugto ng balang. Iniwasan ng salin ang sobrang tiyak na pagkilalang “uod” habang pinananatili ang tungkulin nitong lumamon ng pananim.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: kung kubkubin sila ng kanilang kaaway
  rationale: Ang Hiphil ng צור ay nagpapahiwatig ng pagsikil o pagkulong sa pamamagitan ng pagkubkob. Ginawang maramihan ang tinutukoy upang maging likas sa Tagalog ang pagtukoy sa bayan ng Israel.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: sa alinman sa mga lungsod ng lupain
  rationale: 'Ang literal na “sa lupain ng kanyang mga pintuang-bayan” ay metonimiya: ang mga pintuang-bayan ay kumakatawan sa mga lungsod. Isinalin ang kahulugan sa pangunahing teksto at itinabi sa talababa ang literal na larawan.'
- source_word: כָּל נֶגַע
  choice: anumang sakuna
  rationale: Malawak ang saklaw ng נֶגַע—hagupit, salot, o kapahamakan. Pinili ang “sakuna” upang hindi ito maipagkamali sa דֶּבֶר na naunang isinaling “salot.”
- source_word: כָּל מַחֲלָה
  choice: anumang karamdaman
  rationale: Pangkalahatang katawagan ito para sa sakit at pinananatili ang pagkakaiba nito sa naunang mga uri ng kapahamakan.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino na angkop sa panalangin ni Solomon. Gumamit ng malinaw na bokabularyong pansakahan at likas na ayos ng isang talaan ng mga sakuna. Itinama ang puwesto ng mga marker upang ang talababa tungkol sa חָסִיל ay sumunod sa “mapanirang insekto,” at ang talababa tungkol sa “mga pintuang-bayan” ay sumunod sa “mga lungsod ng lupain.”
