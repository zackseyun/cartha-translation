  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: tl
  text: Nawa’y makasama natin si Yahweh, ang ating Diyos, kung paanong nakasama niya ang ating mga ama[a]. Huwag niya nawa tayong iwan ni pabayaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ninuno.” Ang Hebreo ay literal na “mga ama,” na tumutukoy sa mga ninunong ama ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Nawa’y sumaatin
  rationale: Ang Qal jussive ay nagpapahayag ng panalangin o hangarin. Likas sa makabagong Tagalog ang “Nawa’y sumaatin” at malinaw nitong ipinahahayag ang hinihiling na presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Ang anyong may hulaping unang panauhang maramihan ay tuwirang nangangahulugang “ating Diyos.”
- source_word: עִמָּנוּ
  choice: sumaatin
  rationale: Ipinahihiwatig ng עִם ang pakikisama o presensiya; ang “sumaatin” ay maikli, natural, at angkop sa panalangin.
- source_word: כַּאֲשֶׁר הָיָה עִם אֲבֹתֵינוּ
  choice: gaya ng pagsama niya sa ating mga ama
  rationale: Pinananatili ng “gaya” ang paghahambing, samantalang malinaw na ipinapakita ng “pagsama niya” ang nakaraang presensiya ng Diyos. Pinananatili ng “mga ama” ang tahasang panlalaking אֲבוֹת, na tumutukoy rito sa mga ninuno ng Israel.
- source_word: אַל יַעַזְבֵנוּ
  choice: Huwag niya nawa tayong iwan
  rationale: Ang negatibong jussive ay isang pagsusumamo. Karaniwan at malinaw sa Tagalog ang “huwag niya nawa,” at ang “iwan” ay tumpak sa pangunahing diwa ng עזב.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: ni pabayaan
  rationale: Ang נטש ay malapit sa עזב ngunit may diwa ng pagpapabaya o tuluyang pagtalikod. Ang “ni pabayaan” ay nagpapanatili sa magkaugnay ngunit hindi ganap na magkaparehong mga pandiwa at natural sa negatibong pariralang Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Paglalahad sa אֲבֹתֵינוּ
  choice: ating mga ama
  alternative: ating mga ninuno
  rationale: Tahasan ang panlalaking anyo ng salitang Hebreo at tumutukoy sa mga ninunong ama ng Israel. Pinananatili sa pangunahing teksto ang “mga ama,” habang inilalagay sa talababa ang mas malinaw na kontekstuwal na alternatibong “mga ninuno.”
- issue: Ugnayan ng dalawang negatibong pandiwa
  choice: iwan ni pabayaan
  alternative: iwan o itakwil
  rationale: Pinananatili ang parallelismo at bahagyang pagkakaiba ng עזב at נטש nang hindi ginagawang magkapareho ang dalawang pandiwa. Hindi rin ipinapasok ang mas matinding ideya ng tahasang pagtakwil kung hindi kinakailangan.
translation_notes:
  register: Makabago ngunit marangal na wikang panalangin. Ginamit ang “nawa” upang ihayag ang jussive, at pinanatili ang pangalang Yahweh. Ang “sumaatin” ay bahagyang mataas ang antas ngunit pamilyar at natural sa tekstong panrelihiyon.
