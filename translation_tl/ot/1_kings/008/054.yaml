base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: tl
  text: Nang matapos ni Solomon na manalangin kay Yahweh nang buong panalangin at pagsusumamong ito[a], tumindig siya mula sa harap ng altar ni Yahweh, mula sa pagkakaluhod sa kanyang mga tuhod, habang nakalahad patungo sa langit ang kanyang mga palad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagsusumamo” ay tumutukoy sa taimtim na pakiusap para sa awa o pabor.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mga kamay.” Mas tiyak na tumutukoy ang salitang Hebreo sa mga palad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת שְׁלֹמֹה
  choice: Nang matapos ... ni Solomon
  rationale: Ang konstruksiyong temporal ay likas na ipinahahayag sa modernong Tagalog sa pamamagitan ng “Nang matapos,” nang hindi kinakailangang panatilihin ang literal ngunit mabigat na “At nangyari.”
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה
  choice: ipanalangin ... kay Yahweh
  rationale: Ipinahahayag ng “ipanalangin kay Yahweh” ang pagharap ng panalangin sa Diyos at maayos nitong naiuugnay ang kasunod na tuwirang layon sa Tagalog.
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: ang buong panalangin at pagsusumamong ito
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang katawagan: pangkalahatang “panalangin” at taimtim na “pagsusumamo” para sa awa o pabor.'
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה מִכְּרֹעַ עַל בִּרְכָּיו
  choice: tumindig siya mula sa pagkakaluhod sa harap ng altar ni Yahweh
  rationale: Likas itong paglalarawan sa pagbabago ng tindig ni Solomon habang pinananatili ang lokasyon sa harap ng altar at ang hayag na pagluhod sa Hebreo.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: habang nakalahad paitaas sa langit ang kanyang mga palad
  rationale: Ang כַּף ay mas tiyak na “palad” kaysa pangkalahatang “kamay”; ipinahahayag ng “paitaas sa langit” ang direksiyon ng kilos sa likas na Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo, kaya pinananatili ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tumindig” upang malinaw ang pagbangon mula sa pagkakaluhod, at iniwasan ang labis na literal na pag-uulit na “nakaluhod sa kanyang mga tuhod,” bagaman nananatili ang mismong postura.
