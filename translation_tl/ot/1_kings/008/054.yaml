revisions:
- from: Nang matapos ipanalangin ni Solomon kay Yahweh ang buong panalangin at pagsusumamong ito[a], tumindig siya mula sa pagkakaluhod sa harap ng altar ni Yahweh, habang nakalahad paitaas sa langit ang kanyang mga palad.[b]
  to: Nang matapos ni Solomon na manalangin kay Yahweh nang buong panalangin at pagsusumamong ito[a], tumindig siya mula sa harap ng altar ni Yahweh, mula sa pagkakaluhod sa kanyang mga tuhod, habang nakalahad patungo sa langit ang kanyang mga palad[b].
  rationale: Pinalitan ang pandiwang maaaring magpahiwatig ng panalanging para sa isang bagay ng tuwirang “manalangin,” ibinalik ang tahasang pagtukoy sa mga tuhod, at inilagay ang talababa b sa mismong salitang “mga palad.” Hindi binago ang kahulugan o ang antas ng paggalang ng teksto.
