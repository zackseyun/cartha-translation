  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: tl
  text: At dinggin mo ang pagsusumamo ng iyong lingkod at ng iyong bayang Israel kapag nananalangin sila tungo sa lugar na ito.[a] At ikaw, dinggin mo sa iyong tahanan sa langit;[b] dinggin mo at magpatawad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lugar na ito.” Maaaring isalin nang mas literal sa ganitong paraan ang pariralang Hebreo, ngunit ipinahihiwatig ng “tungo sa lugar na ito” na ang panalangin ay nakatuon sa templo.
    reason: lexical_alternative
  - marker: b
    text: O “sa langit, ang lugar na iyong tahanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: pagsusumamo
  rationale: Ipinahihiwatig ng תְּחִנָּה ang taimtim na paghingi ng awa o pabor. Likas at marangal sa modernong Filipino ang “pagsusumamo,” at napapanatili nito ang matinding diwa ng pakiusap.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Bagaman maaaring tumukoy ang עֶבֶד sa isang alipin, dito ay mapagpakumbabang pagtukoy ni Solomon sa sarili sa harap ng Diyos; ang “lingkod” ang angkop sa konteksto at rehistro.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: iyong bayang Israel
  rationale: Malinaw nitong ipinakikilala ang Israel bilang bayang kabilang sa Diyos. Mas natural sa Filipino ang “bayang Israel” kaysa sa literal na “mga tao mong Israel.”
- source_word: יִתְפַּלְלוּ
  choice: nananalangin sila
  rationale: Ang hitpael ng פלל ang karaniwang pandiwa para sa pananalangin. Tuwiran at natural ang “nananalangin sila.”
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: tungo sa lugar na ito
  rationale: 'Pinananatili ng “tungo sa” ang direksiyonal na gamit ng אֶל: ang panalangin ay iniuukol na nakatuon sa templo, hindi lamang nagaganap doon.'
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: ang lugar na iyong tahanan
  rationale: Napapanatili nito ang ugnayang konstruktibo ng Hebreo at ang marangal na himig, habang malinaw pa rin sa karaniwang mambabasa.
- source_word: אֶל הַשָּׁמַיִם
  choice: sa langit
  rationale: Bagaman karaniwang “tungo sa” ang אֶל, sa pariralang ito ang langit ang tinutukoy na kinaroroonan ng Diyos habang dinidinig niya ang panalangin. Ang “sa langit” ang natural na locative na katumbas sa Filipino.
- source_word: וְשָׁמַעְתָּ
  choice: dinggin mo sila
  rationale: Sa konteksto ng panalangin, ang שׁמע ay hindi lamang pagkarinig kundi pakikinig na may pagtugon. Ang “dinggin” ay angkop sa panalanging Filipino; idinagdag ang “sila” bilang likas na ipinahihiwatig na layon.
- source_word: וְסָלָחְתָּ
  choice: patawarin
  rationale: Ang סלח ang karaniwang pandiwa para sa pagpapatawad ng Diyos. Ang “patawarin” ang pinakamalinaw at tuwirang katumbas.
theological_decisions:
- issue: Ang templo bilang direksiyon ng panalangin at ang langit bilang tahanan ng Diyos
  choice: Pinanatili kapwa ang panalanging nakatuon “tungo sa lugar na ito” at ang Diyos na dumirinig “sa langit, ang lugar na iyong tahanan.”
  alternative: Isaling “kapag nananalangin sila sa templong ito,” o “dinggin mo mula sa langit.”
  rationale: Sadyang magkatabi sa talata ang makalupang templo bilang sentro o direksiyon ng panalangin at ang langit bilang tunay na tahanan ng Diyos. Hindi nilulutas o pinapahina ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Ginamit ang “pakinggan” sa unang sugnay at “dinggin” sa kasunod upang maging natural habang pinananatili ang pag-uulit ng pandiwang Hebreo. Pinanatili rin ang tahasang “ikaw” sa וְאַתָּה upang maipakita ang diin ng pinagmulan.
