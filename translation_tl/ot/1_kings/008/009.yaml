  naturalness: Marangal at modernong Filipino ang daloy. Ang “Walang nasa loob ng Kaban maliban sa” ay mas eksakto at likas sa konteksto kaysa “Walang laman ang Kaban maliban sa.” Ang “mga tapyas na bato” at “nakipagtipan” ay kapwa angkop sa rehistrong biblikal at nauunawaan sa modernong Filipino.
