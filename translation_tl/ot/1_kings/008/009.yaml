base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: tl
  text: Walang nasa loob ng Kaban maliban sa dalawang tapyas na bato[a] na inilagay roon ni Moises sa Horeb, kung saan nakipagtipan si Yahweh[b] sa mga Israelita[c] nang lumabas sila mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalawang tabletang bato.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng apat na katinig na YHWH sa Hebreo.
    reason: divine_name
  - marker: c
    text: Sa literal, “mga anak na lalaki ni Israel”; maaari ring “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Walang laman ang Kaban maliban sa
  rationale: 'Likas na Filipino para sa Hebreong pahayag ng pag-iral na may pagtanggi at pagbubukod: walang nasa loob nito maliban sa mga binanggit.'
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: dalawang tapyas na bato
  rationale: Ang “tapyas” ay malinaw at likas na tawag sa patag na pirasong batong sinulatan; pinananatili rin nito ang materyal na tahasang binanggit sa Hebreo.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: na inilagay roon ni Moises
  rationale: Tuwirang isinasalin ang kahulugang ilagay o ihabilin sa isang lugar, at malinaw ang sanggunian ng “roon” sa Kaban.
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Karaniwang preposisyon sa Filipino para sa isang pook; pinananatili ang pangalang Horeb.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: kung saan nakipagtipan si Yahweh sa
  rationale: Ang literal na “pumutol” ay isang Hebreong idyoma para sa paggawa ng tipan. Ang “nakipagtipan” ang malinaw at likas na katumbas sa Filipino; ang “kung saan” ay nag-uugnay sa pangyayari sa Horeb.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Sa kontekstong ito, ang idyomatikong pariralang Hebreo ay tumutukoy sa sambayanan ng Israel. Ang “mga Israelita” ay tumpak, natural, at hindi nagpapahiwatig na mga lalaking anak lamang ang tinutukoy.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: nang lumabas sila mula sa lupain ng Ehipto
  rationale: Pinananatili ang temporal na ugnayan at ang malinaw na pagtukoy sa paglabas mula sa Ehipto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang pinagmulan ay tahasang gumagamit ng Tetragrammaton. Ang transliterasyong “Yahweh” ay nagpapanatili rito bilang personal na pangalan nang hindi ito ginagawang titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel; mga anak ni Israel
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” gumaganap ang parirala bilang kolektibong katawagan sa bayan ng Israel. Ang “mga Israelita” ay nagpapanatili sa kolektibong diwa nang hindi di-kinakailangang nililimitahan ang saklaw ayon sa kasarian.
- issue: Ipinahiwatig na tipan sa אֲשֶׁר כָּרַת יְהוָה עִם
  choice: nakipagtipan si Yahweh sa
  alternative: pinutol ni Yahweh sa piling ng
  rationale: Hindi inuulit sa Hebreo ang pangngalang “tipan,” ngunit ipinahihiwatig ito ng nakapirming idyomang כרת ... עם sa konteksto. Kailangang gawing hayag sa Filipino upang maipahayag ang parehong kahulugan.
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Ginamit ang “Kaban” bilang nakaugaliang katawagan sa kaban ng tipan, “tapyas na bato” para sa malinaw na larawan ng mga covenant tablet, at “nakipagtipan” bilang likas na salin ng Hebreong idyoma. Ang lahat ng talababa ay minarkahan sa pangunahing teksto.
