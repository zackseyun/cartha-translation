  source_fidelity: 'Tapat ang salin sa pangunahing mga sangkap ng Hebreo: ang pagbubukod ng Israel para sa Diyos bilang mana, ang pagkakaiba nila mula sa lahat ng bayan, ang pagsasalita sa pamamagitan ni Moises na lingkod, ang paglabas ng mga ninuno mula sa Egipto, at ang bokatibong titulong אֲדֹנָי יְהוִה. Ang “mga ninuno” ay isang katanggap-tanggap na pagpapalawak ng אֲבֹתֵינוּ sa kontekstong Exodo nang hindi binabago ang tinutukoy.'
