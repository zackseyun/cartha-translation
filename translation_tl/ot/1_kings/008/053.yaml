  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: tl
  text: Sapagkat ibinukod mo sila para sa iyong sarili bilang mana mula sa lahat ng mga bayan sa lupa, gaya ng sinabi mo sa pamamagitan ni Moises na iyong lingkod nang ilabas mo mula sa Egipto ang aming mga ninuno, O Panginoong Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Panginoong Yahweh.” Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng apat na letrang YHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: ibinukod mo sila
  rationale: Ang Hiphil ng בדל ay nangangahulugang ihiwalay o ibukod. Likas sa modernong Tagalog ang “ibinukod” at pinananatili nito ang diwa ng natatanging pagtatalaga.
- source_word: לְךָ לְנַחֲלָה
  choice: para sa iyong sarili bilang mana
  rationale: Ipinahahayag ng parirala na ang Israel ay ibinukod upang maging natatanging pag-aari ng Diyos. Pinananatili ng “mana” ang tipan at pag-aaring diwa ng נַחֲלָה.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: mula sa lahat ng mga bayan sa lupa
  rationale: Ang “mga bayan” ay tumutukoy sa mga pangkat ng tao o mga bansa, at ang “sa lupa” ay nagpapakita ng malawak na saklaw ng paghahambing.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Literal na “sa kamay ni Moises,” ngunit idiomatikong tumutukoy sa pagkilos o pagsasalita sa pamamagitan ng isang kinatawan. Ito ang malinaw at natural na katumbas sa Tagalog.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Sa marangal na kontekstong ito, ang “lingkod” ang angkop na katumbas ng עבד, sa halip na “alipin.”
- source_word: בְּהוֹצִיאֲךָ
  choice: nang ilabas mo
  rationale: Ang infinitive construct na may בְּ ay nagpapahayag ng panahong kasabay ng pagkilos; natural itong isinasalin na “nang ilabas mo.”
- source_word: אֶת אֲבֹתֵינוּ
  choice: ang aming mga ninuno
  rationale: Ang אָבוֹת ay maaaring tumukoy sa mga ama o sa naunang salinlahi. Sa konteksto ng Exodo, malinaw at inklusibong naipahahayag ng “mga ninuno” ang tinutukoy na mga salinlahi nang hindi nagdaragdag ng kahulugan.
- source_word: אֲדֹנָי יְהוִה
  choice: O Panginoong Yahweh
  rationale: Pinananatili ang titulong אֲדֹנָי bilang “Panginoon” at ang pangalang tipan na יהוה bilang “Yahweh,” habang ang “O” ay natural na pananda ng tuwirang pagtawag sa dulo ng panalangin.
theological_decisions:
- issue: Paglalarawan sa Israel bilang נַחֲלָה ng Diyos
  choice: bilang mana
  alternative: bilang pag-aari
  rationale: Ang “mana” ay mas tuwirang nagpapanatili sa biblikal at tipang talinghaga ng נַחֲלָה, kahit maaari rin itong mangahulugang inilaang pag-aari.
- issue: Pagbibigay ng אֲדֹנָי יְהוִה
  choice: O Panginoong Yahweh
  alternative: O Panginoong Diyos
  rationale: Pinananatili ng “Yahweh” ang mismong pangalang tipan sa tekstong Hebreo, samantalang malinaw na naihihiwalay rito ang titulong “Panginoon.”
translation_notes:
  register: Makabagong Filipino na marangal at angkop sa panalangin. Ginamit ang natural na “sa pamamagitan ni Moises” sa halip na literal na “sa kamay ni Moises.” Ang bokatibong “O Panginoong Yahweh” ay nagpapanatili sa taimtim na tono ng pagtatapos.
