base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: tl
  text: Ngunit sinabi ni Yahweh sa ama kong si David, “Dahil nasa puso mong magtayo ng isang bahay para sa aking pangalan, mabuti ang ginawa mo, sapagkat nasa puso mo ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “magtayo ng isang templo para sa aking pangalan.” Literal sa Hebreo: “magtayo ng isang bahay para sa aking pangalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; natural itong panimula sa tuwirang pagsasalita sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל דָּוִד אָבִי
  choice: sa ama kong si David
  rationale: Malinaw at natural na ipinapakita ang kaugnayan ni Solomon kay David; ang si ay angkop sa personal na pangalan.
- source_word: יַעַן אֲשֶׁר
  choice: dahil
  rationale: Malinaw at kasalukuyang Tagalog para sa pariralang nagpapakilala ng dahilan.
- source_word: הָיָה עִם לְבָבְךָ
  choice: nasa puso mo
  rationale: Pinananatili ang metapora ng Hebreo para sa hangarin o layunin at likas pa rin sa Tagalog.
- source_word: לִבְנוֹת בַּיִת
  choice: magtayo ng isang bahay
  rationale: Ang בַּיִת ay literal na 'bahay.' Bagaman templo ang tinutukoy sa konteksto, pinananatili ng salin ang sadyang idyoma ng pinagmulang teksto.
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Pinananatili ang teolohikal na idyoma ng santuwaryong nauugnay sa pangalan ng Diyos nang hindi ito binibigyang-kahulugang lampas sa teksto.
- source_word: הֱטִיבֹתָ
  choice: mabuti ang ginawa mo
  rationale: Natural na Tagalog na nagpapahayag ng pagsang-ayon sa hangarin ni David.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: na ito ay nasa puso mo
  rationale: Inilalahad ang nilalaman o batayan ng pagsang-ayon at pinananatili ang pag-uulit ng metapora sa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo.
- issue: Kung isasalin ang בַּיִת bilang 'bahay' o bilang 'templo'
  choice: bahay
  alternative: templo
  rationale: Literal na 'bahay' ang Hebreo. Malinaw sa konteksto na templo ang tinutukoy, kaya pinananatili sa pangunahing teksto ang orihinal na idyoma at inilalagay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong metaporang “nasa puso” at ang idyomang “bahay para sa aking pangalan.”
