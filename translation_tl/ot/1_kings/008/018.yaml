  to: Ngunit sinabi ni Yahweh sa ama kong si David, “Dahil nasa puso mong magtayo ng isang bahay para sa aking pangalan, mabuti ang ginawa mo, sapagkat nasa puso mo ito.[a]”
  rationale: Pinalitan ang di-likas na “na ito ay nasa puso mo” ng “sapagkat nasa puso mo ito.” Pinananatili nito ang pag-uulit ng Hebreong metapora para sa hangarin at ang nagpapaliwanag na puwersa ng huling כִּי, ngunit mas natural ang sintaks sa modernong Filipino Tagalog.
