id: 1KI.8.40
reference: 1 Kings 8:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: tl
  text: upang matakot sila sa iyo sa lahat ng araw na nabubuhay sila[a] sa lupaing[b] ibinigay mo sa aming mga ninuno[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang sila ay nabubuhay” o “habambuhay.”
    reason: lexical_alternative
  - marker: b
    text: O “sa lupa.” Sa literal, “sa ibabaw ng mukha ng lupa.” Dito, ang tinutukoy ay ang lupaing ibinigay ng Diyos sa mga ninuno ng Israel.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa aming mga ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at likas na nagpapahayag ng layunin o inaasahang bunga sa panalangin ni Solomon.
- source_word: יִרָאוּךָ
  choice: matakot sila sa iyo
  rationale: Pinananatili nito ang bigat ng ירא bilang takot at pagpipitagan sa Diyos, sa halip na paliitin ito sa paggalang lamang.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: sa lahat ng araw na nabubuhay sila
  rationale: Malapit sa anyo ng Hebreo at ipinahahayag ang buong tagal ng kanilang buhay; inilalagay sa talababa ang mas likas na alternatibong idyoma.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto, ang אֲדָמָה ay ang lupaing ibinigay sa mga ninuno ng Israel. Hindi na pinanatili ang literal na 'sa ibabaw ng mukha' dahil hindi ito likas sa makabagong Tagalog.
- source_word: אֲשֶׁר נָתַתָּה
  choice: ibinigay mo
  rationale: Tuwirang ipinapahayag ang natapos na pagkakaloob ng Diyos.
- source_word: לַאֲבֹתֵינוּ
  choice: sa aming mga ninuno
  rationale: Likas at saklaw sa Tagalog ang 'mga ninuno' para sa Hebreong 'aming mga ama,' habang ang mas literal na anyo ay itinatala sa talababa.
theological_decisions:
- issue: Kahulugan ng ירא kapag ang Diyos ang kinatatakutan
  choice: matakot sila sa iyo
  alternative: igalang ka nila; magkaroon sila ng pagpipitagan sa iyo
  rationale: Pinananatili ng 'matakot' ang biblikal na kategorya ng takot sa Diyos, na maaaring magsama ng pangamba at pagpipitagan, nang hindi tahimik na nilalambot ang kahulugan.
- issue: Saklaw ng הָאֲדָמָה
  choice: lupain
  alternative: lupa; daigdig
  rationale: Ang kasunod na pariralang 'ibinigay mo sa aming mga ninuno' ay tumutukoy sa minanang lupain ng Israel, bagaman posible sa salita mismo ang mas malawak na 'lupa.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang teolohikal na bigat ng 'matakot' at ang temporal na kabuuan ng 'lahat ng araw,' habang ginawang likas ang Hebreong idyoma tungkol sa ibabaw o mukha ng lupain.
