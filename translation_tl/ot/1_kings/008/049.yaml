translation:
  language: tl
  text: kung magkagayon, dinggin mo sa langit, sa dako ng iyong tahanan[a], ang kanilang panalangin at pagsusumamo, at igawad mo ang katarungan sa kanilang usapin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dako” sa Hebreo ay may diwa ng isang nakatatag o tiyak na lugar ng tahanan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “ipagtanggol mo ang kanilang usapin” o “bigyan mo sila ng katarungan.” Literal sa Hebreo: “gawin mo ang kanilang hatol/katarungan,” isang idyomang tumutukoy sa makatarungang pagkilos para sa kanilang kaso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: kung magkagayon, dinggin mo
  rationale: Ang Qal perfect na 2ms sa sunod-sunod na pakiusap ay gumaganap bilang kahilingang nakatuon sa Diyos. Ipinahihiwatig ng “kung magkagayon” ang bunga ng mga naunang kondisyong binanggit sa panalangin.
- source_word: הַשָּׁמַיִם
  choice: sa langit
  rationale: Bagaman literal na maramihan ang anyo (“mga langit”), tumutukoy rito ang salita sa makalangit na dako. Hindi tahasang nakasaad ang preposisyong “mula sa,” kaya pinanatili ang lokatibong “sa langit.”
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: sa dako ng iyong tahanan
  rationale: Ang מָכוֹן ay isang nakatatag o tiyak na dako. Natural sa modernong Filipino ang “dako ng iyong tahanan,” samantalang inilalahad sa talababa ang diing nakapaloob sa salitang Hebreo.
- source_word: תְּפִלָּתָם
  choice: ang kanilang panalangin
  rationale: Karaniwang katumbas ng תְּפִלָּה at tumutukoy sa panalangin sa pangkalahatan.
- source_word: תְּחִנָּתָם
  choice: pagsusumamo
  rationale: Ipinakikita ng תְּחִנָּה ang marubdob na paghingi ng awa o lingap. Pinananatili ng “pagsusumamo” ang kaibahan nito sa pangkalahatang “panalangin.”
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: at igawad mo ang katarungan sa kanilang usapin
  rationale: Ang literal na “gawin ang kanilang hatol/katarungan” ay isang idyomang panghukuman para sa pagkilos alang-alang sa kanilang kaso. Natural sa Filipino ang napiling salin at pinananatili nito ang legal na diwa.
theological_decisions:
- issue: Paglalarawan sa langit bilang tahanan ng Diyos
  choice: Panatilihin ang “sa langit, sa dako ng iyong tahanan” bilang wika ng panalangin sa teksto.
  alternative: “mula sa langit na iyong tahanan”
  rationale: Pinananatili ng salin ang biblikal na larawan nang hindi ipinapalagay na nililimitahan ng teksto ang presensiya ng Diyos sa isang pisikal na lokasyon.
- issue: Forensikong diwa ng מִשְׁפָּטָם
  choice: “igawad mo ang katarungan sa kanilang usapin”
  alternative: “ipagtanggol mo ang kanilang usapin” o “pawalang-sala mo sila”
  rationale: Hindi awtomatikong sinasabi ng idyoma na inosente sila o na sila ay pawawalang-sala; hinihiling nitong kumilos ang Diyos nang makatarungan sa kanilang kaso. Kaya hindi nilutas ng salin ang maaaring tensiyon nang lampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dinggin” at “pagsusumamo” dahil malinaw pa rin ang mga ito sa karaniwang mambabasa at angkop sa taimtim na panalangin. Iniiwasan ang labis na literal ngunit alanganing “gawin mo ang kanilang hatol.”
