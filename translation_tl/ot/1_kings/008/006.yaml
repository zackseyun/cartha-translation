id: 1KI.8.6
reference: 1 Kings 8:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: tl
  text: Pagkatapos, dinala ng mga pari ang kaban ng tipan ni Yahweh sa lugar nito, sa kaloob-loobang santuwaryo ng templo, sa Kabanal-banalang Lugar,[a] sa ilalim ng mga pakpak ng mga kerubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Banal ng mga Banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Pagkatapos, dinala
  rationale: Ipinahihiwatig ng wayyiqtol ang kasunod na pangyayari sa salaysay; natural itong ipinapahayag sa modernong Tagalog sa pamamagitan ng “Pagkatapos.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang katumbas ng tiyak na pangmaramihang pangngalan para sa mga paring naglilingkod sa templo.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: 'Malinaw at natural na pinananatili ang ugnayan ng construct chain: ang kaban na kaugnay ng tipan ni Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מְקוֹמוֹ
  choice: sa lugar nito
  rationale: Ang hulaping panghalip ay tumutukoy sa kaban; hindi idinagdag ang interpretibong “wastong.”
- source_word: דְּבִיר
  choice: kaloob-loobang santuwaryo
  rationale: Sa konteksto ng templo, tumutukoy ito sa pinakaloob na silid; malinaw ang “kaloob-loobang santuwaryo” sa karaniwang mambabasa.
- source_word: הַבַּיִת
  choice: ng templo
  rationale: Bagaman literal na “ng bahay,” malinaw na templo ang tinutukoy rito; iniiwasan ng saling ito ang posibleng kalituhan sa Tagalog.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Kabanal-banalang Lugar
  rationale: Inihahatid ang Hebreong superlatibong parirala sa natural at marangal na Tagalog.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang katumbas ng panandang panlunan.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: mga pakpak ng mga kerubin
  rationale: Pinananatili ang tiyak na imahen ng mga may-pakpak na kerubin sa santuwaryo at ang pangmaramihang anyo ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Paglalarawan sa pinakaloob na bahagi ng templo
  choice: Kabanal-banalang Lugar
  alternative: Banal ng mga Banal; Pinakabanal na Lugar
  rationale: Ipinapahayag nito ang superlatibong diwa ng קֹדֶשׁ הַקֳּדָשִׁים nang malinaw at hindi nagdaragdag ng sektaryong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “templo” para sa literal na “bahay” dahil iyon ang malinaw na referent sa konteksto. Ang tala ay inilagay lamang sa tunay na leksikal na alternatibo; ang marker na [a] ay nasa pangunahing teksto.
