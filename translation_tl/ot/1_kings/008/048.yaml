id: 1KI.8.48
reference: 1 Kings 8:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: tl
  text: at manumbalik sila sa iyo nang buong puso at buong kaluluwa sa lupain ng kanilang mga kaaway na bumihag sa kanila, at manalangin sila sa iyo nang nakaharap sa kanilang lupain na ibinigay mo sa kanilang mga ninuno, sa lungsod na pinili mo, at sa bahay na itinayo ko para sa iyong pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay ang templong itinayo at itinalaga para sa pangalan ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: at manumbalik sila sa iyo
  rationale: Pinananatili ng “manumbalik” ang pangunahing diwa ng pagbabalik sa Diyos at ang maaaring pahiwatig ng pagsisisi, nang hindi tahasang ipinapakahulugan ang pandiwa bilang “magsisi.”
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: nang buong puso at buong kaluluwa
  rationale: Pinananatili ang dalawang larawang Hebreo at ang diwa ng lubos na katapatan sa natural na anyong Tagalog.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: sa lupain ng kanilang mga kaaway na bumihag sa kanila
  rationale: Ang “lupain” ay nagpapanatili sa ugnayan nito sa susunod na “kanilang lupain,” at malinaw na ipinahahayag ng “bumihag” ang sapilitang pagkabihag.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: at manalangin sila sa iyo
  rationale: Direkta at likas na salin ng pananalangin na nakatuon sa Diyos.
- source_word: דֶּרֶךְ אַרְצָם
  choice: nang nakaharap sa kanilang lupain
  rationale: Ipinahahayag nito ang pisikal na direksiyon ng panalangin nang mas natural sa Tagalog kaysa sa literal na “patungo sa kanilang lupain.”
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: na ibinigay mo sa kanilang mga ninuno
  rationale: Ang “mga ninuno” ay natural at tumpak na tumutukoy sa naunang mga salinlahing tumanggap ng lupain.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: sa lungsod na pinili mo
  rationale: Pinananatili ang payak na pahayag tungkol sa pagpili ng Diyos.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: at sa bahay na itinayo ko para sa iyong pangalan
  rationale: Pinananatili ang “bahay” para sa בַּיִת at ang unang panauhang “itinayo ko,” na angkop sa pagsasalita ni Solomon at sa konsonantal na tekstong Masoretiko.
theological_decisions:
- issue: Ang saklaw ng pagsisisi sa pandiwang שׁוּב
  choice: manumbalik sila sa iyo
  alternative: magsisi sila sa harap mo
  rationale: Ang pandiwa ay maaaring magpahiwatig ng pagsisisi sa kontekstong tipan, ngunit ang pangunahing larawan ay personal at direksiyonal na pagbabalik sa Diyos; hindi dapat gawing tahasan ang isang pahiwatig lamang.
- issue: Ang nagsasalita sa pariralang אֲשֶׁר בנית
  choice: itinayo ko
  alternative: itinayo para sa iyong pangalan
  rationale: Sa konteksto ng panalangin ni Solomon, natural na unang panauhang isahan ang anyo; pinananatili nito ang mahalagang detalye ng sitwasyon ng pagsasalita.
- issue: Ang “pangalan” ng Diyos kaugnay ng bahay
  choice: para sa iyong pangalan
  alternative: na itinalaga sa iyo
  rationale: Pinananatili ang teolohikal na idyomang Hebreo at hindi ito pinapantay sa isang paliwanag lamang tungkol sa pagtatalaga.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “manumbalik” upang mapanatili ang pormal ngunit likas na himig at ang parehong diwa ng pagbabalik at posibleng pagsisisi. Inayos ang magkakasunod na parirala gamit ang “sa” upang malinaw na ang panalangin ay nakaharap sa lupain, sa lungsod, at sa bahay.
