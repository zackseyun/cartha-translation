  source_fidelity: 'Nananatiling tapat ang pangunahing diwa sa Hebreo: ang kawalan ng ulan ay bunga ng pagkakasala, ang panalangin ay nakatuon sa direksiyon ng lugar na ito, at ang pagtalikod sa kasalanan ay iniuugnay sa pagdidisiplina/pagpapakumbaba. Ang alternatibong pagbasa na “sinasagot mo sila” ay nararapat manatili sa talababa dahil pinagtatalunan ang pandiwang תַעֲנֵם.'
  naturalness: 'May maliit ngunit mahalagang problema sa paralelismong pandiwa: “manalangin sila ... purihin ... talikuran” ay hindi pantay ang pagpapahayag ng simuno. Mas malinaw at likas ang “purihin nila” at “talikuran nila.” Ang “sa direksiyon ng lugar na ito” ay mas tuwirang nagsasaad ng kahulugan ng אֶל kaysa “nang nakaharap sa.”'
  terminology: Ang “langit,” “kasalanan,” “pangalan,” at “pagpapakumbaba” ay angkop sa marangal ngunit modernong Filipino. Ang “purihin ang iyong pangalan” ay isang katanggap-tanggap na pagsasalin ng הוֹדוּ אֶת־שְׁמֶךָ; pinananatili ng talababa ang mga saklaw na diwa nito.
