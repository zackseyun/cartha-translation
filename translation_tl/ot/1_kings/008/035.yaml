  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: tl
  text: Kapag napinid ang langit at walang ulan dahil nagkasala sila laban sa iyo, at manalangin sila sa direksiyon ng lugar na ito, purihin nila ang iyong pangalan[a], at talikuran nila ang kanilang kasalanan dahil pinagpapakumbaba mo sila[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpasalamat sa iyong pangalan” o “hayagang kilalanin ang iyong pangalan.” Saklaw ng pandiwang Hebreo ang pasasalamat, pagpupuri, at hayagang pagkilala o pagpapahayag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinahihirapan mo sila.” Posible ring basahin ang pandiwa bilang “sinasagot mo sila”; ngunit ang konteksto ng tagtuyot bilang pagdidisiplina ay pumapabor sa “pinagpapakumbaba mo sila.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Kapag napinid ang langit
  rationale: 'Ang בְּ na sinusundan ng pawatas na Niphal ay temporal: “kapag.” Ipinahihiwatig ng “napinid ang langit” na ipinagkait ang ulan at pinananatili ang matalinghagang larawan ng Hebreo.'
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: at walang ulan
  rationale: Payak at likas na Filipino para sa resultang kalagayan ng napinid na langit.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: dahil nagkasala sila laban sa iyo
  rationale: Causal ang כִּי, at sa kontekstong ito ay ipinapahayag ng לָךְ na ang kasalanan ay laban sa Diyos.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: at manalangin sila nang nakaharap sa lugar na ito
  rationale: Directional ang אֶל dito. Nililinaw ng “nang nakaharap” na sa direksiyon ng templo sila nananalangin, hindi na ang lugar mismo ang dinadalanginan.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: purihin ang iyong pangalan
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpasalamat, magpuri, o hayagang kumilala. Likas sa Filipino ang “purihin ang iyong pangalan” at pinananatili nito ang pangalan bilang tuwirang layon.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: at talikuran ang kanilang kasalanan
  rationale: Ang שׁוב na may מִן ay pagtalikod o paglayo mula sa kasalanan. Mas tuwirang inilalarawan ito ng “talikuran” kaysa sa mas teolohikal na terminong “magsisi.”
- source_word: כִּי תַעֲנֵם
  choice: dahil pinagpapakumbaba mo sila
  rationale: Ang konteksto ng tagtuyot bilang pagdidisiplina at ang sinaunang pag-unawa sa talata ay pumapabor sa pagpapakumbaba o pagpapahirap. Gayunman, maaaring unawain ang anyong Masoretiko bilang “sinasagot mo sila,” kaya inilalahad ang alternatibo sa talababa.
theological_decisions:
- issue: Direksiyon ng panalangin kaugnay ng templo
  choice: manalangin sila nang nakaharap sa lugar na ito
  alternative: manalangin sila sa lugar na ito
  rationale: Ang templo ang direksiyong hinaharap at lugar na kaugnay ng pangalan ng Diyos; hindi ito ang pinatutungkulan ng panalangin.
- issue: Kahulugan ng תַעֲנֵם
  choice: pinagpapakumbaba mo sila
  alternative: sinasagot mo sila
  rationale: Ang daloy ng talata ay mula sa tagtuyot na bunga ng kasalanan tungo sa pagtalikod sa kasalanan dahil sa disiplina ng Diyos. Gayunman, tunay na posible ayon sa pagkakapunto ng tekstong Masoretiko ang “sinasagot mo sila,” kaya hindi ito ikinubli.
- issue: Kahulugan ng הוֹדוּ sa konteksto ng pagsisisi
  choice: purihin ang iyong pangalan
  alternative: kilalanin/ipahayag ang iyong pangalan; magpasalamat sa iyong pangalan
  rationale: Saklaw ng pandiwa ang pagpupuri, pasasalamat, at hayagang pagkilala. Pinili ang pinakanatural na pariralang Filipino nang hindi itinatanggi ang iba pang posibleng diwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “napinid” upang mapanatili ang biblikal na larawan nang hindi maging mahirap unawain; ginamit ang “nang nakaharap” para sa malinaw at likas na pagpapahayag ng direksiyon. Pinanatili ang pangungusap na bukas sa kasunod na talata sa pamamagitan ng pangwakas na kuwit.
