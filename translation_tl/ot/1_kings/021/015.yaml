translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at malamig na tono ng sinabi ni Jezebel, pati ang pag-uulit na ‘hindi na buhay ... patay na siya.’ Inilagay ang talababa sa mismong pariralang may leksikal na alternatibo.
