  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: tl
  text: Nang mabalitaan ni Jezebel na binato si Nabot at namatay, sinabi niya kay Ahab, “Bumangon ka at angkinin mo ang ubasan ni Nabot na Jezreelita, na tinanggihan niyang ibigay sa iyo kapalit ng pilak[a], sapagkat hindi na buhay si Nabot; patay na siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “na tinanggihan niyang ipagbili sa iyo kapalit ng salapi.” Literal sa Hebreo: “na tinanggihan niyang ibigay sa iyo kapalit ng pilak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang mabalitaan
  rationale: Likas na ipinahahayag sa modernong Tagalog ang temporal na pormula ng salaysay nang hindi mekanikal na isinasalin ang idyomang ‘at nangyari.’
- source_word: סֻקַּל
  choice: binato
  rationale: Pinananatili ang tiyak na paraan ng pagpatay at ang balintiyak na anyo ng Hebreo; nililinaw ng kasunod na ‘at namatay’ ang kinahinatnan.
- source_word: וַיָּמֹת
  choice: at namatay
  rationale: Pinananatili ang magkahiwalay na pagbanggit ng pagbato at pagkamatay sa tekstong Hebreo.
- source_word: קוּם
  choice: Bumangon ka
  rationale: Tuwiran at kasalukuyang katumbas ng pautos na anyo, na pinananatili ang agarang tono ni Jezebel.
- source_word: רֵשׁ
  choice: angkinin mo
  rationale: Sa kontekstong ito, tumutukoy ito sa pagkuha ng pag-aari o pamamahala sa ubasan. Ang ‘angkinin’ ay natural sa Tagalog at hindi ipinapalagay na legal na pagmamana lamang.
- source_word: כֶּרֶם
  choice: ubasan
  rationale: Karaniwang at malinaw na katumbas sa Tagalog ng lupang tinatamnan ng ubas.
- source_word: הַיִּזְרְעֵאלִי
  choice: na Jezreelita
  rationale: Pinananatili ang katawagang gentiliko na tumutukoy sa kaugnayan ni Nabot sa Jezreel.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: tinanggihan niyang ibigay sa iyo kapalit ng pilak
  rationale: Malapit sa literal na Hebreong ‘tumangging ibigay sa iyo para sa pilak,’ habang malinaw pa rin ang diwa ng transaksiyon. Inilalagay sa talababa ang mas interpretibong ‘ipagbili ... kapalit ng salapi.’
- source_word: בְכֶסֶף
  choice: kapalit ng pilak
  rationale: Pinananatili ang kongkretong salitang ‘pilak’ ng Hebreo, na maaari ring tumukoy sa salapi.
- source_word: אֵין נָבוֹת חַי
  choice: hindi na buhay si Nabot
  rationale: Pinananatili ang unang bahagi ng mariing dobleng pahayag, sa halip na pagsamahin ito sa kasunod na ‘patay na siya.’
- source_word: כִּי מֵת
  choice: patay na siya
  rationale: Inihahatid ang tahasan at matalim na pangwakas na pahayag ni Jezebel; ang ugnayang nagbibigay-dahilan ay ipinahahayag na ng ‘sapagkat’ bago ang dalawang magkaugnay na sugnay.
