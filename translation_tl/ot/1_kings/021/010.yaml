  to: At paupuin ninyo sa tapat niya ang dalawang tiwaling lalaki. Magpatotoo sila laban sa kanya sa pagsasabing, ‘Isinumpa[a] mo ang Diyos at ang hari.’ Pagkatapos, ilabas ninyo siya at batuhin hanggang sa mamatay siya.
