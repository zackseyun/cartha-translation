source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: tl
  text: At paupuin ninyo sa tapat niya ang dalawang tiwaling lalaki. Magpatotoo sila laban sa kanya sa pagsasabing, ‘Isinumpa[a] mo ang Diyos at ang hari.’ Pagkatapos, ilabas ninyo siya at batuhin hanggang sa mamatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Pinagpala mo ang Diyos at ang hari.” Ginamit dito ang “pinagpala” bilang eupemismo upang iwasang tuwirang sabihin ang “isinumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: paupuin ninyo
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil: ipaupo o paupuin ang mga lalaki sa itinakdang lugar.'
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: dalawang masamang lalaki
  rationale: Ang idyoma ay tumutukoy sa mga lalaking tiwali at walang prinsipyo. Likas sa modernong Tagalog ang “masamang lalaki” at hindi nito ginagawang pangalang pantangi ang Belial.
- source_word: נֶגְדּוֹ
  choice: sa tapat niya
  rationale: Ipinahihiwatig nito na nakaupo sila nang kaharap niya sa pormal at pampublikong tagpo.
- source_word: וִיעִדֻהוּ
  choice: Magpatotoo sila laban sa kanya
  rationale: Malinaw nitong ipinapahayag ang legal na diwa ng pagbibigay ng salungat na patotoo.
- source_word: בֵּרַכְתָּ
  choice: Isinumpa
  rationale: Bagaman karaniwang nangangahulugang “pinagpala,” eupemismo rito ang pandiwa para sa “isinumpa,” ayon sa konteksto ng gawa-gawang paratang na may parusang kamatayan.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: ang Diyos at ang hari
  rationale: Pinananatili ang magkatambal na paratang laban sa Diyos at sa hari.
- source_word: וְהוֹצִיאֻהוּ
  choice: ilabas ninyo siya
  rationale: Direkta at natural na katumbas ng pagdadala sa kanya palabas, malamang mula sa lungsod, upang patayin.
- source_word: וְסִקְלֻהוּ
  choice: batuhin
  rationale: Ito ang karaniwang salin para sa pagpatay sa pamamagitan ng pagbato.
- source_word: וְיָמֹת
  choice: hanggang sa mamatay siya
  rationale: Natural nitong ipinapakita sa Tagalog ang nilalayong resulta ng pagbato, nang hindi pinapahina ang tahasang utos.
theological_decisions:
- issue: Eupemistikong gamit ng בּרך kapag Diyos ang layon
  choice: Isinalin bilang “isinumpa” sa pangunahing teksto
  alternative: Literal na “pinagpala,” na ipaliliwanag lamang sa tala
  rationale: Ang konteksto ay isang gawa-gawang paratang na karapat-dapat sa kamatayan. Ang “pinagpala” sa pangunahing teksto ay magbibigay ng kabaligtarang kahulugan sa ordinaryong mambabasa, kaya inilagay ang literal na anyo sa talababa.
- issue: Kahulugan ng בְּנֵי בְלִיַּעַל
  choice: dalawang masamang lalaki
  alternative: mga anak ni Belial; mga lalaking walang kabuluhan
  rationale: Idyoma ito para sa mga tiwali o masasamang tao, hindi kinakailangang pagtukoy sa isang pangalang pantangi. Iniiwasan ng salin ang pagpasok ng mas huling demonolohikal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang maramihang anyong “ninyo” para sa mga utos at pinanatili ang legal na tono ng huwad na patotoo.
