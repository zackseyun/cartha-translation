  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: tl
  text: Nagpahayag sila ng isang pag-aayuno at pinaupo si Nabot sa unahan ng mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng mga tao” o “sa pinakapangunahing puwesto sa gitna ng mga tao.” Literal sa Hebreo, “sa ulo ng mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: Nagpahayag sila
  rationale: Kapag צום ang layon, tumutukoy ang קרא sa hayagang pagdedeklara ng isang pag-aayuno. Natural at angkop sa pampublikong kilos ang “nagpahayag.”
- source_word: צום
  choice: isang pag-aayuno
  rationale: Tumutukoy ang pangngalan sa isang pormal at pampublikong panahon ng pag-aayuno; pinananatili ng “isang pag-aayuno” ang tiyak na institusyonal na diwa.
- source_word: וְהֹשִׁיבוּ
  choice: at pinaupo
  rationale: Ang Hiphil ng ישב ay nangangahulugang magpaupo o magtalaga ng upuan o puwesto sa isang tao.
- source_word: אֶת נָבוֹת
  choice: si Nabot
  rationale: Minamarkahan ng אֶת si Nabot bilang tiyak na tuwirang layon; ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: בְּרֹאשׁ
  choice: sa unahan ng
  rationale: Literal itong “sa ulo/tuktok ng,” ngunit sa pagtitipong pampubliko ay tumutukoy sa isang lantad at pangunahing puwesto. Natural sa Tagalog ang “sa unahan,” habang inilalahad sa talababa ang literal at iba pang posibleng diwa.
- source_word: הָעָם
  choice: mga tao
  rationale: Karaniwang nangangahulugang “mga tao” ang עם; dito ay tumutukoy ito sa nagtipong mamamayan, bagaman maaaring unawain bilang kapulungan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pag-aayuno” para sa pormal na fast at “sa unahan” upang maging natural habang pinananatili sa talababa ang larawan at ambiguwidad ng Hebreong בְּרֹאשׁ.
