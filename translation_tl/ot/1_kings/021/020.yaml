source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: tl
  text: Sinabi ni Ahab kay Elias, “Nahanap mo ba ako, kaaway ko?” Sumagot siya, “Nahanap kita, sapagkat ipinagbili mo ang iyong sarili upang gawin ang masama sa paningin ni Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH. Tradisyonal na isinasalin na “ang PANGINOON”; kabilang sa ibang anyo ang “Yahweh” at “Jehovah.”'
    reason: Ipinapaliwanag ang paglitaw at mga pangunahing paraan ng pagsasalin sa banal na pangalan.
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: Nahanap mo ba ako
  rationale: Pinananatili ang tuwirang tanong at mapanghamong tono ni Ahab, gamit ang natural na katumbas ng מצא sa modernong Tagalog.
- source_word: אֹיְבִי
  choice: kaaway ko
  rationale: Tuwirang inililipat ang pangngalang may unang panauhang hulapi; natural din itong gumaganap bilang pagtawag sa kausap nang hindi nangangailangan ng makalumang “O.”
- source_word: מָצָאתִי
  choice: Nahanap kita
  rationale: Inuulit ang parehong pandiwang ginamit sa tanong ni Ahab upang mapanatili ang sinadyang alingawngaw ng מצא sa sagutan.
- source_word: יַעַן
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi na angkop sa makahulang pahayag ni Elias.
- source_word: הִתְמַכֶּרְךָ
  choice: ipinagbili mo ang iyong sarili
  rationale: Pinananatili ang reflexive na metapora ng hitpael ng מכר—ang kusang pagbebenta o pagpapaalipin ng sarili—sa halip na pahinain ito bilang simpleng “ibinigay mo ang sarili mo.”
- source_word: לַעֲשׂוֹת הָרַע
  choice: upang gawin ang masama
  rationale: Natural na Tagalog para sa paggawa ng moral na kasamaan at sapat na malapit sa anyo ng Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong larawan ng pagsusuri “sa mga mata” ng Diyos sa natural na idyomang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan; inilalahad sa talababa ang tradisyonal at isa pang kilalang anyo nang hindi itinatago ang usaping tekstuwal at tradisyonal.
- issue: Lakas ng metaporang הִתְמַכֶּרְךָ
  choice: ipinagbili mo ang iyong sarili
  alternative: ibinigay mo ang iyong sarili
  rationale: Pinananatili ng napiling salin ang matinding larawan ng kusang pagpapaalipin sa paggawa ng masama, nang hindi dinaragdagan kung kanino o saan eksaktong “ipinagbili” ang sarili.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matalim na sagutan at ang pag-uulit ng “nahanap,” gayundin ang malakas na metapora ng kusang pagbebenta ng sarili. Inilagay ang talababa sa “Yahweh,” ang salitang aktuwal na nangangailangan ng paliwanag.
