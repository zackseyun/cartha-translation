base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: tl
  text: “Bumangon ka at bumaba upang salubungin si Ahab, ang hari ng Israel, na nasa Samaria. Tingnan mo, nasa ubasan ni Nabot si Ahab; bumaba siya roon upang angkinin iyon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ariin iyon.” Ang pandiwang Hebreo ay maaaring tumukoy sa pag-angkin, pag-aari, o pagmamana, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: Tumindig ka
  rationale: Tuwirang pautos na nagpapanatili sa mabilis at marangal na himig ng utos ng Diyos; mas angkop dito kaysa sa mas kaswal na “Bumangon ka.”
- source_word: רֵד
  choice: bumaba
  rationale: Pinananatili ang direksiyonal na kahulugan ng pandiwang ירד sa natural na Tagalog.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag ang pagpunta upang makatagpo ang isang taong paparating o naroroon, nang hindi paunang binibigyang-kahulugan ang pagtatagpo bilang pakikipagsagupaan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng titulong maharlika.
- source_word: אֲשֶׁר בְּ/שֹׁמְר֑וֹן
  choice: na nasa Samaria
  rationale: Nilalagyan ng likas na pandiwang Tagalog ang sugnay na walang hayag na pandiwa sa Hebreo, habang pinananatili ang lokasyong binanggit sa teksto.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na nagpapanatili sa dagliang diin ng הִנֵּה nang hindi gumagamit ng makalumang pananalita.
- source_word: בְּ/כֶ֣רֶם נָב֔וֹת
  choice: sa ubasan ni Nabot
  rationale: Natural at tuwirang pagpapahayag ng lokasyon at pagmamay-ari sa Tagalog.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: na pinuntahan niya
  rationale: Natural na Tagalog para sa kamag-anak na sugnay; ipinahihiwatig ng “pinuntahan” ang sadyang pagpunta roon, bagaman hindi inuulit ang direksiyonal na “bumaba” na magiging mabigat sa pangungusap.
- source_word: לְ/רִשְׁתּֽ/וֹ
  choice: upang angkinin iyon
  rationale: Ipinapakita ang pagkuha nito bilang sariling pag-aari. Hindi kasing-tindi ng “kamkamin,” na maaaring magdagdag ng dahas na hindi tahasang nasa pandiwa, at nilalagyan ng talababa upang mapanatili ang saklaw ng ירשׁ.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na pautos at ang biglaang panawag-pansin ng Hebreo. Hindi ginamit ang “harapin” o “komprontahin” sapagkat magdaragdag iyon ng interpretasyon sa layunin ng pagtatagpo.
