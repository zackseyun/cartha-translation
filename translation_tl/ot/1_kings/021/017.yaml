  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: tl
  text: Pagkatapos, dumating kay Elias na Tisbita ang salita ni Yahweh na nagsasabi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At nangyari, dumating kay Elias na Tisbita ang salita ni Yahweh na nagsasabi:”
    reason: Ipinakikita ang mas pormal na pagsasalin ng וַיְהִי at ang posibleng pagpapanatili sa Hebreong pormula ng pagsasalaysay.
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkatapos, dumating
  rationale: Ipinahahayag ng waw-consecutive na may היה ang kasunod na pangyayari sa daloy ng salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, dumating” at hindi nito ginagamit ang mas makaluma at mabigat na “At nangyari.”
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Karaniwang pormula ito sa pagpapahayag ng propeta. Pinananatili ng “salita” ang tuwirang anyo at teolohikal na bigat ng Hebreo, samantalang higit na interpretatibo ang “mensahe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang likas na panandang Tagalog para sa paghahayag o pananalitang itinutuon sa isang taong may pangalan.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang kinagawiang anyo ng pangalang biblikal sa Tagalog.
- source_word: הַתִּשְׁבִּי
  choice: na Tisbita
  rationale: Pinananatili ng “Tisbita” ang maikling katawagang Hebreo sa pinagmulan o pagkakakilanlan ni Elias nang hindi ito pinalalawak nang higit sa teksto.
- source_word: לֵאמֹר
  choice: na nagsasabi
  rationale: Tuwirang ipinakikita nito na ang kasunod na talata ang nilalaman ng banal na salita. Ang tutuldok ay naghahanda sa mambabasa para sa tuwirang pahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang pormulang “salita ni Yahweh” at ang “na nagsasabi” upang maging malinaw ang ugnayan sa tuwirang pahayag sa susunod na talata, kahit bahagyang pormal ang hulma nito.
