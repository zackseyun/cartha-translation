base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: tl
  text: Kaya isinagawa ng mga lalaki ng kanyang lungsod—ang matatandang pinuno at mga maharlika[a] na naninirahan sa kanyang lungsod—ang ipinadala ni Jezebel sa kanila, ayon sa nakasulat sa mga liham na ipinadala niya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taong mataas ang katayuan” o “mga matataas na opisyal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ginawa
  rationale: Karaniwang salaysay na gamit ng עשה ito at ipinapahayag ang pagsunod ng mga pinuno sa ipinadala ni Jezebel.
- source_word: אַנְשֵׁי עִירוֹ
  choice: mga lalaki sa kanyang lungsod
  rationale: Ang אַנְשֵׁי ay literal na tumutukoy sa mga lalaki, at nililinaw ng kasunod na parirala na sila ang mga lalaking pinuno ng lungsod.
- source_word: הַזְּקֵנִים
  choice: matatandang pinuno
  rationale: Sa kontekstong pansibiko, tumutukoy ito sa kinikilalang mga pinuno ng pamayanan, hindi lamang sa matatandang lalaki.
- source_word: הַחֹרִים
  choice: mga maharlika
  rationale: Tumutukoy ang חֹרִים dito sa mga taong mataas ang katayuan sa lipunan o pamahalaan; pinananatili ng “mga maharlika” ang diwang ito, habang inilalahad sa talababa ang mas malawak na saklaw.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: na naninirahan doon
  rationale: Ang ישב ay nangangahulugang manirahan sa kontekstong ito. Ginamit ang “doon” upang maiwasan ang mabigat na pag-uulit ng “sa kanyang lungsod” nang hindi nawawala ang tinutukoy.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: ang ipinagawa sa kanila ni Jezebel
  rationale: Walang tahasang layon ang “ipinadala” sa Hebreo, ngunit ipinakikita ng konteksto at ng kasunod na pagbanggit sa mga liham na mga tagubilin ang ipinadala. Ang “ipinagawa” ay likas sa Tagalog at hindi na nagdaragdag ng tiyak na detalye sa nilalaman.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: ayon sa nakasulat sa mga liham
  rationale: Ang סְפָרִים ay tumutukoy rito sa ipinadalang sulat, kaya mas tiyak ang “mga liham” kaysa “mga kasulatan” o “mga dokumento.”
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: na ipinadala niya sa kanila
  rationale: Tuwirang pinananatili nito ang ugnayan ng sugnay sa mga liham at ang kilos ng pagpapadala.
