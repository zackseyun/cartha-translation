  register: Makabago at marangal na Filipino ang ginamit. Nilinaw ng “matatandang pinuno” ang tungkuling pansibiko ng mga elder, samantalang pinanatili ang “mga maharlika” at nilagyan ng talababa upang maipakita ang saklaw ng salitang Hebreo.
