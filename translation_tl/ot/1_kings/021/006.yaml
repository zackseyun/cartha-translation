base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: tl
  text: Sumagot siya sa kaniya, “Kinausap ko si Nabot na taga-Jezreel at sinabi ko sa kaniya, ‘Ibigay mo sa akin ang ubasan mo kapalit ng salapi; o kung gusto mo, bibigyan kita ng ibang ubasan bilang kapalit nito.’ Ngunit sinabi niya, ‘Hindi ko ibibigay sa iyo ang ubasan ko.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלֶיהָ
  choice: Sumagot siya sa kaniya
  rationale: Sa konteksto, tugon ito ni Ahab sa tanong ni Jezebel (tal. 5). Ang Hebreong dabar ay literal na “nagsalita,” ngunit natural na ipinahihiwatig dito ang pagsagot.
- source_word: כִּי
  choice: (hindi isinalin bilang “sapagkat”)
  rationale: Ipinakikilala nito rito ang nilalaman ng sagot o paliwanag ni Ahab; sa natural na Tagalog, sapat na ang tuwirang sipi pagkatapos ng “Sumagot siya.” Ang literal na “sapagkat” ay magiging alanganin at maaaring magmukhang sanhi ng pagsasalita.
- source_word: בְּכֶסֶף
  choice: kapalit ng salapi
  rationale: Ang kesef ay “pilak/salapi”; sa konteksto ng transaksiyon, malinaw na tumutukoy ito sa salaping kabayaran, hindi lamang sa metal na pilak.
- source_word: אִם חָפֵץ אַתָּה
  choice: kung gusto mo
  rationale: Natural at tuwirang katumbas ng idiomang nangangahulugang “kung iyon ang nais/minamabuti mo.”
- source_word: כֶרֶם תַּחְתָּיו
  choice: ibang ubasan bilang kapalit nito
  rationale: Nililinaw ng “ibang” ang likas na diwa ng pamalit nang hindi nagdaragdag ng bagong proposisyon.
theological_decisions:
- issue: Dahilan ni Nabot sa pagtanggi
  choice: Pinanatili lamang ang maikling pagtanggi ayon sa iniulat ni Ahab
  alternative: Idagdag ang pahayag tungkol sa pagbabawal ni Yahweh at minanang lupain mula sa talata 3
  rationale: Sa talatang ito, pinaikli ni Ahab ang sinabi ni Nabot. Hindi dapat ipasok sa kaniyang sipi ang teolohikal na dahilan na hindi niya isinama rito.
- issue: Ambiguity ng כִּי pagkatapos ng pandiwa ng pagsasalita
  choice: Itinuring na panandang nagpapakilala sa nilalaman/paliwanag ng sagot
  alternative: Isaling literal na “sapagkat”
  rationale: Ang gamit at konteksto ay mas natural na tumutukoy sa nilalaman ng sagot, ngunit hindi binabago ang mismong iniulat na usapan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ubasan” at “salapi” bilang karaniwang biblikal ngunit madaling maunawaang mga salita; iniwasan ang sobrang literal at alanganing sintaks ng Hebreo.
