  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: tl
  text: 'At dumating kay Elias na Tisbita ang salita ni Yahweh[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; kinaugaliang isalin na “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang tradisyonal na alternatibong salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיְהִי
  choice: At dumating
  rationale: Sa pormulang propetiko na וַיְהִי דְבַר־יְהוָה אֶל, likas sa Filipino ang “dumating ... ang salita,” habang pinananatili ang ugnayan nito sa naunang salaysay.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang pangunahing leksikal na diwa ng דָּבָר at ang paulit-ulit na pormula ng paghahayag sa mga salaysay tungkol sa mga propeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang likas na panandang Filipino para sa patutunguhan o tumatanggap kapag pangalan ng tao ang kasunod.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng propetang Elijah.
- source_word: הַתִּשְׁבִּי
  choice: na Tisbita
  rationale: Ang “Tisbita” ay maikli at nakaugaliang katawagan sa taong mula sa Tisbe; malinaw na iniuugnay ito kay Elias sa pamamagitan ng “na.”
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang tutuldok ay likas na paraan sa modernong Filipino upang ipakilala ang mismong sasabihin sa susunod na talata, at ginagampanan nito rito ang tungkulin ng לֵאמֹר nang hindi gumagamit ng alanganing “na sinasabi.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaibang iyon sa isang titulo at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang propetiko na “dumating ... ang salita,” ngunit ginamit ang tutuldok bilang likas na pananda sa susunod na tuwirang pahayag.
