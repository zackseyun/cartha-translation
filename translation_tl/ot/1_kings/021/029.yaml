source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: tl
  text: “Nakita mo ba na nagpakumbaba si Ahab sa harap ko? Dahil nagpakumbaba siya sa harap ko, hindi ko dadalhin ang kapahamakan[a] sa panahon niya. Sa panahon ng anak niya, dadalhin ko ang kapahamakan sa sambahayan ni Ahab.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sakuna.” Sa Hebreo, “ang masama/kapahamakan”; sa kontekstong ito ng hatol, tumutukoy ito sa maparusang kapahamakan, hindi sa moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” ay maaari ring tumukoy sa angkan o dinastiya ni Ahab.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Nakita mo ba
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay isang tuwirang tanong kay Elias. Likas sa modernong Tagalog ang “Nakita mo ba” at ipinahihiwatig nitong napansin na ang naganap na pagpapakumbaba.
- source_word: נִכְנַע
  choice: nagpakumbaba
  rationale: Ang Niphal ng כנע ay tumutukoy rito sa pagpapakumbaba o pagpapasakop bilang tugon sa hatol ng Diyos. Hindi ito pinalawak tungo sa “nagsisi,” sapagkat hindi iyon ang tahasang salitang ginamit.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: sa harap ko
  rationale: Ito ang natural at marangal na katumbas ng idyomang Hebreo na tumutukoy sa kilos o kalagayan sa presensya ng Diyos.
- source_word: יַעַן כִּי
  choice: Dahil
  rationale: Malinaw nitong ipinakikita na ang pagpapakumbaba ni Ahab ang dahilan ng pagpapaliban sa hatol.
- source_word: לֹא אָבִיא
  choice: hindi ko dadalhin
  rationale: Pinananatili nito ang aktibong Hiphil na kahulugang “magdala” o “magsapit” nang hindi nagdaragdag ng paliwanag.
- source_word: הָרָעָה
  choice: ang kapahamakan
  rationale: Sa konteksto ng hatol, ang רָעָה ay tumutukoy sa maparusang sakuna, hindi sa moral na kasamaan. Ang “kapahamakan” ay malinaw at angkop sa dignidad ng pahayag.
- source_word: בְּיָמָיו
  choice: sa panahon niya
  rationale: Natural na Tagalog ito para sa Hebreong temporal na idyoma at tumutukoy sa panahon ng buhay o paghahari ni Ahab.
- source_word: בִּימֵי בְנוֹ
  choice: sa panahon ng anak niya
  rationale: Pinananatili nito ang tahasang paghahambing sa “panahon niya” at hindi tinutukoy ang pangalan ng anak na hindi naman binanggit sa talata.
- source_word: עַל בֵּיתוֹ
  choice: sa kanyang sambahayan
  rationale: Ang בַּיִת sa kontekstong maharlika ay maaaring sumaklaw sa sambahayan o dinastiya. Ang “sambahayan” ay natural sa Tagalog, habang inilalagay sa talababa ang posibleng dinastikong diwa.
theological_decisions:
- issue: Uri ng tugon ni Ahab
  choice: “nagpakumbaba” nang hindi tahasang tinatawag itong pagsisisi
  alternative: “nagsisi” o “nagpasakop”
  rationale: Sinasabi ng teksto na nagpakumbaba si Ahab sa harap ng Diyos at dahil dito ay ipinagpaliban ang hatol. Hindi ginamit ang karaniwang bokabularyo para sa pagsisisi, kaya hindi ipinapasok ang mas ganap na teolohikong konklusyon.
- issue: Kahulugan ng רָעָה na dadalhin ng Diyos
  choice: “kapahamakan”
  alternative: “kasamaan” o “sakuna”
  rationale: Ang konteksto ay maparusang hatol laban sa sambahayan ni Ahab, hindi moral na kasamaan. Iniiwasan ng salin na ipahiwatig na gumagawa ang Diyos ng moral na kasamaan.
- issue: Saklaw ng “bahay” ni Ahab
  choice: “sambahayan” sa pangunahing teksto, na may talababa tungkol sa dinastiya
  alternative: “bahay” o “angkan/dinastiya”
  rationale: 'May tunay na lawak ang kahulugan ng בֵּיתוֹ: maaari itong tumukoy sa kanyang sambahayan at, sa kontekstong maharlika, sa kanyang dinastiya. Hindi dapat tahasang limitahan ang kahulugan sa isa lamang.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “siya/kanyang” sa halip na ulitin ang pangalang Ahab, ngunit malinaw ang tinutukoy. Ang mga panandang talababa [a] at [b] ay inilagay sa mismong mga salitang ipinapaliwanag ng mga ito.
