  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: tl
  text: Tunay ngang, walang sinumang tulad ni Ahab, na ipinagbili ang kanyang sarili upang gumawa ng masama sa paningin ni Yahweh at na inudyukan ng kanyang asawang si Jezebel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Tunay ngang
  rationale: Dito, ang partikula ay nagbibigay-diin sa pahayag. Likas sa modernong Tagalog ang “Tunay ngang” at hindi nito nililimitahan ang diwa sa payak na “lamang.”
- source_word: לֹא הָיָה כְאַחְאָב
  choice: walang sinumang tulad ni Ahab
  rationale: Ipinahahayag ng idyoma na walang maihahambing kay Ahab sa inilalarawang kasamaan.
- source_word: הִתְמַכֵּר
  choice: ipinagbili niya ang kanyang sarili
  rationale: 'Pinananatili nito ang matingkad na metapora ng Hebreo: kusang isinuko ni Ahab ang sarili sa paggawa ng masama, na para bang ipinagbili niya ang sarili.'
- source_word: לַעֲשׂוֹת הָרַע
  choice: upang gumawa ng masama
  rationale: Natural at malinaw itong katumbas sa Tagalog ng pagsasagawa ng bagay na masama.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora ng moral na pagtatasa mula sa pananaw ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: הֵסַתָּה
  choice: inudyukan
  rationale: Ipinahahayag nito ang paghimok o pagtulak kay Ahab tungo sa masamang gawain, nang hindi nagdaragdag ng mas tiyak na paraang hindi sinabi sa teksto.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: at inudyukan siya ng asawa niyang si Jezebel
  rationale: Malinaw na pinananatili si Ahab bilang tumanggap ng pag-uudyok. Ginamit ang koordinasyong “at” upang hindi gawing tahasang sanhi ang אֲשֶׁר, na maaaring gumana rito bilang kaugnay na sugnay.
theological_decisions:
- issue: Paglalarawan sa pananagutan ni Ahab at sa pag-uudyok ni Jezebel
  choice: 'Parehong pinanatili: ipinagbili ni Ahab ang kanyang sarili, at inudyukan siya ni Jezebel.'
  alternative: Dahil inudyukan siya ni Jezebel, ipinagbili ni Ahab ang kanyang sarili.
  rationale: Idiniriin ng Hebreo ang sariling kusang pagkakasangkot ni Ahab habang binabanggit din ang impluwensiya ni Jezebel. Hindi dapat gawing dahilan ang huli sa paraang maaaring magpahina sa pananagutan ni Ahab.
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap upang maging natural at malinaw, habang pinananatili ang diin, metapora, at teolohikal na tensiyon ng Hebreo.
