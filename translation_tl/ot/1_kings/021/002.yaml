base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: tl
  text: Sinabi ni Ahab kay Nabot, “Ibigay mo sa akin ang ubasan mo upang maging taniman ko ng gulay, sapagkat malapit ito sa bahay ko. Bilang kapalit nito, bibigyan kita ng ubasang mas mainam kaysa rito. O kung mabuti sa paningin mo[a], ibibigay ko sa iyo ang halaga nito sa pilak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kung mabuti sa iyong mga mata,” isang idyomang nangangahulugang “kung mukhang mabuti ito sa iyo,” “kung katanggap-tanggap ito sa iyo,” o “kung sang-ayon ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת לֵאמֹר
  choice: Sinabi ni Ahab kay Nabot
  rationale: Likas na salaysay sa modernong Tagalog ang “sinabi ... kay” at tumpak nitong inilalahad ang Hebreong pormula ng pagsasalita nang hindi ginagaya ang paulit-ulit na “nagsalita ... na sinasabi.”
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: Ibigay mo sa akin ang ubasan mo
  rationale: Pinananatili ang tuwirang pautos na pakiusap ni Ahab at ang karaniwang kahulugan ng כֶּרֶם bilang ubasan.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: upang maging taniman ko ng gulay
  rationale: Ipinahahayag ng “upang maging” ang layunin/resultang ipinahihiwatig ng anyong pandiwa; malinaw at kasalukuyang pananalita ang “taniman ng gulay” para sa גַן יָרָק.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: sapagkat malapit ito sa bahay ko
  rationale: Tuwirang pinananatili ang dahilan at ugnayang panlugar sa Hebreo.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: Bilang kapalit nito, bibigyan kita
  rationale: Malinaw na inilalahad ng “bilang kapalit” ang diwa ng pagpapalit na taglay ng תַּחְתָּיו.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: ubasang mas mainam kaysa rito
  rationale: Pinananatili ang paghahambing nang hindi tinutukoy kung anong partikular na katangian ang mas mainam.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: kung mabuti sa paningin mo
  rationale: Pinananatili sa teksto ang malinaw ngunit matalinghagang Hebreong idyoma; nililinaw sa talababa ang pragmatikong kahulugan nito.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: ibibigay ko sa iyo ang halaga nito sa pilak
  rationale: Inilalahad ang alternatibong bayad at pinananatili ang tahasang pagbanggit sa pilak bilang salaping kabayaran.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang Hebreong idyoma sa pangunahing teksto upang hindi mawala ang anyo at bahagyang kulay nito, habang ipinaliwanag ang kahulugan sa talababa. Ginamit ang “Nabot,” ang karaniwang anyong Filipino ng pangalang Naboth.
