base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: tl
  text: 'Pagkatapos, nagpadala sila ng mensahe kay Jezebel: “Binato si Nabot, at namatay siya.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Pagkatapos, nagpadala sila ng mensahe
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” at nililinaw ng “ng mensahe” na isang balita ang ipinadala.
- source_word: אֶל אִיזֶבֶל
  choice: kay Jezebel
  rationale: Ang “kay” ang karaniwang panandang direksiyon para sa pangalan ng tao; pinanatili ang nakaugaliang anyo ng pangalan.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa natural na salaysay sa Tagalog, sapat na ang tutuldok upang ipakilala ang mismong mensahe; hindi kailangang isalin nang tahasan bilang “na sinasabi.”
- source_word: סֻקַּל
  choice: Binato
  rationale: Ang Pual ay balintiyak at tumutukoy sa pagpatay sa pamamagitan ng pagbato. Sa Tagalog, ang anyong “Binato si Nabot” ay natural at pinananatiling hiwalay sa kasunod na pahayag ng kaniyang pagkamatay.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Ginamit ang nakaugaliang transliterasyong Filipino ng pangalan.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: 'Tuwirang pinananatili ang sunod na pangyayari sa Hebreo: siya ay binato at namatay. Mas malapit ito sa anyo ng pinagmulan kaysa gawing paglalarawan ng kalagayan na “patay na siya.”'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Iniwasan ang mabigat at di-likas na pormulang “na nagsasabi.”
