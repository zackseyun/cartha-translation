base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: tl
  text: 'Sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh: “Pumaslang ka ba at inangkin mo pa?”’[a] Sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh: “Sa lugar kung saan dinilaan ng mga aso ang dugo ni Nabot, didilaan din ng mga aso ang sarili mong dugo.”’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pumatay ka ba at inangkin mo pa?” Ang pandiwang Hebreo ay maaari ring mangahulugang “pumatay,” ngunit sa kontekstong ito ay tumutukoy sa di-makatarungang pagpatay.'
    reason: lexical_alternative
  - marker: b
    text: Mariin sa Hebreo ang huling mga salita; binibigyang-diin ng mga ito na si Ahab mismo ang daranas ng gayunding kahihiyan.
    reason: emphasis
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: At sabihin mo sa kanya
  rationale: Natural na utos sa makabagong Tagalog habang pinananatili ang dalawang ulit na pormula ng pagsasalita sa Hebreo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormula ng mensaherong propeta at ang personal na pangalang Yahweh.
- source_word: הֲרָצַחְתָּ
  choice: Pumatay ka ba
  rationale: Ang רצח ay maaaring tumukoy sa pagpatay, at sa kontekstong ito ay may bigat ng salarin o di-makatarungang pagpatay; iniiwasan ng salin ang mas teknikal na 'pumaslang' habang nililinaw ito sa talababa.
- source_word: וְגַם יָרָשְׁתָּ
  choice: at inangkin mo pa
  rationale: Sa konteksto, kinuha ni Ahab bilang pag-aari ang ubasan matapos mapatay si Nabot. Ang 'pa' ay natural na naghahatid ng force ng וְגַם.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Sa lugar kung saan
  rationale: Tuwirang locative-relative na parirala at likas sa Tagalog.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: dinilaan ... didilaan
  rationale: Inuulit ang iisang ugat ng pandiwa gaya sa Hebreo at pinananatili ang tahasang larawan ng hatol.
- source_word: הַכְּלָבִים
  choice: ang mga aso
  rationale: Literal na salin ng sentral na larawan sa pahayag ng hatol.
- source_word: דַּם נָבוֹת
  choice: ang dugo ni Nabot
  rationale: Natural na Tagalog para sa Hebreong construct chain; isinalin ang personal na pangalan bilang Nabot.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: ang sarili mong dugo
  rationale: Ang 'sarili mong' ay idiomatikong naghahatid ng mariing personal na diin ng גַּם אָתָּה nang hindi nagiging pilit ang pangungusap.
theological_decisions:
- issue: Bigat na moral ng הֲרָצַחְתָּ
  choice: Pumatay ka ba
  alternative: Pumaslang ka ba
  rationale: May diwang kriminal at di-makatarungang pagpatay ang רצח sa konteksto. Pinili ang mas karaniwang 'pumatay' sa teksto para sa malinaw na modernong Tagalog, at pinanatili sa talababa ang mas matinding alternatibo.
- issue: Mariing personal na aplikasyon ng גַּם אָתָּה
  choice: ang sarili mong dugo
  alternative: ang dugo mo—ikaw rin
  rationale: Pinananatili ng 'sarili mong' ang diin na ang hatol ay darating kay Ahab mismo, ngunit mas natural ito sa Tagalog kaysa sa literal at putol na hulíng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng pormulang propetiko, ang pangalang Yahweh, at ang matinding larawan ng mga aso at dugo; iniwasan ang sobrang literal na hulíng parirala na magiging di-likas sa Tagalog.
