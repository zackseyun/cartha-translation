  to: 'Sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh: “Pumaslang ka ba at inangkin mo pa?”’[a] Sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh: “Sa lugar kung saan dinilaan ng mga aso ang dugo ni Nabot, didilaan din ng mga aso ang sarili mong dugo.”’[b]'
