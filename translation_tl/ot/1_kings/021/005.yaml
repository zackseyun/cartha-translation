  source_fidelity: Ang “lumapit sa kanya” ay katanggap-tanggap, ngunit mas tiyak na naihahayag ng “pinuntahan siya” ang וַתָּבֹא אֵלָיו, na nagsasaad na si Jezebel ay pumunta kay Ahab. Ang “kaya ayaw mong kumain” ay nagdaragdag ng ugnayang sanhi-bunga at ng kusang pagtanggi (“ayaw”) na wala sa Hebreo. Ang magkatuwang na “at hindi ka kumakain” ay mas malapit sa pinagmulan. Pinanatili ang “tinapay,” na nasa teksto kahit idiomatiko ang kahulugan nito na pagkain.
  naturalness: Natural at modernong Filipino ang “Bakit ang sama ng loob mo at hindi ka kumakain ng tinapay?” Ang “ang sama ng loob mo” ay angkop para sa mapanglaw at nagtatampong disposisyon sa konteksto. Mas maayos ito kaysa “napakasama ng loob mo kaya ayaw mong kumain,” na maaaring magpahiwatig na ang masamang loob ang sanhi ng ayaw niyang kumain.
  terminology: Ang pangalang Jezebel at ang paglalarawang “asawa niyang” ay wasto. Ang “sama ng loob” ay isang likas na katumbas ng רוּחַ ... סָרָה sa talatang ito; ang mas literal na “espiritu” ay wastong inilalagay sa talababa bilang alternatibong pangsalita.
