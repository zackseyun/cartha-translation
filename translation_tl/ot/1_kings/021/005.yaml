  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: tl
  text: Pagkatapos, pinuntahan siya ng asawa niyang si Jezebel at sinabi sa kanya[a], “Bakit ang sama ng loob mo at hindi ka kumakain ng tinapay?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal: “Ano ito? Masama ang iyong espiritu, at hindi ka kumakain ng tinapay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Pagkatapos, lumapit
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa Filipino ang “Pagkatapos,” at ang “lumapit sa kanya” ay angkop sa pagdating ng isang tao sa kinaroroonan ng iba.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: ang asawa niyang si Jezebel
  rationale: Pinananatili ang kaugnayan ni Jezebel kay Ahab at ginagamit ang likas na ayos ng parirala sa Filipino.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: sinabi sa kanya
  rationale: Sa pagpapakilala ng tuwirang pananalita, mas natural sa Filipino ang “sinabi sa kanya” kaysa sa literal na “nagsalita sa kanya.”
- source_word: מַה זֶּה
  choice: Bakit
  rationale: Ang literal na “Ano ito” ay isang Hebreong idyoma rito na nagtatanong tungkol sa dahilan ng kalagayan ni Ahab; malinaw at natural itong naihahayag ng “Bakit.”
- source_word: רוּחֲךָ סָרָה
  choice: napakasama ng loob mo
  rationale: Ang רוּחַ ay tumutukoy rito sa panloob na disposisyon, at ang סָרָה ay nagpapahiwatig ng masama, mabigat, o mapanglaw na lagay. Ang “masama ang loob” ay isang likas na idyomang Filipino para sa gayong kalooban; ipinahihiwatig ng “napaka-” ang diin ng tanong.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: kaya ayaw mong kumain
  rationale: Literal itong “at hindi ka kumakain ng tinapay.” Sa konteksto, ang “kumain ng tinapay” ay tumutukoy sa pagkain o pagkuha ng pagkain sa pangkalahatan. Ang “ayaw mong kumain” ay natural na Filipino at akma sa sinasadyang pagtanggi ni Ahab na kumain sa naunang talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang karaniwang idyomang “masama ang loob” sa halip na ang mas literal ngunit di-likas na “masama ang iyong espiritu,” habang inilagay sa talababa ang anyong mas malapit sa Hebreo. Isinalin ang “kumain ng tinapay” bilang “kumain” dahil idyoma ito para sa pagkain sa pangkalahatan.
