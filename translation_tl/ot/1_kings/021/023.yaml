id: 1KI.21.23
reference: 1 Kings 21:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: tl
  text: 'At tungkol din kay Jezebel, sinabi ni Yahweh: “Kakainin ng mga aso si Jezebel sa nasasakupan ng Jezreel[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tabi ng tanggulan ng Jezreel.” Mahirap tiyakin ang kahulugan ng salitang Hebreo rito; maaaring mas tiyak itong tumukoy sa napapaderang panlabas na bahagi ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם לְאִיזֶבֶל
  choice: At tungkol din kay Jezebel
  rationale: Pinananatili ng “at…din” ang pandagdag na ugnayan sa naunang hatol. Sa konteksto, ang לְ kasama ng דִּבֶּר ay tumutukoy sa paksa ng pahayag, hindi nangangahulugang si Jezebel ang tuwirang kinausap.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: sinabi ni Yahweh
  rationale: Likas sa modernong Tagalog ang ganitong pagpapakilala sa sipi; hindi na kailangang isalin nang hiwalay ang לֵאמֹר bilang “na sinasabi,” na magiging paulit-ulit at di-likas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַכְּלָבִים יֹאכְלוּ אֶת אִיזֶבֶל
  choice: Kakainin ng mga aso si Jezebel
  rationale: Tuwirang ipinapahayag ang hinaharap na hatol at pinananatili ang payak na kahulugan ng יֹאכְלוּ na “kakainin,” nang hindi ito pinatitindi bilang “lalapain.”
- source_word: בְּחֵל יִזְרְעֶאל
  choice: sa nasasakupan ng Jezreel
  rationale: Mahirap tiyakin ang tiyak na kahulugan ng חֵל dito. Ipinahahayag ng “nasasakupan” ang lokatibong diwa nang hindi labis na nagpapasiya na isang partikular na bahagi ng tanggulan ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pangalan ang nasa Hebreo; pinananatili itong pangalan at hindi pinapalitan ng titulong maaaring magkubli sa pagkakaibang iyon.
- issue: Kung si Jezebel ba ang kausap o paksa ng pahayag
  choice: tungkol din kay Jezebel
  alternative: kay Jezebel; laban kay Jezebel
  rationale: Sa daloy ng salaysay, iniulat ni Elias ang pahayag ng Diyos tungkol sa magiging hatol kay Jezebel; hindi ipinahihiwatig ng teksto na siya mismo ang tuwirang pinagsabihan.
- issue: Tiyak na lokasyon na ipinahihiwatig ng חֵל
  choice: sa nasasakupan ng Jezreel
  alternative: sa tabi ng tanggulan ng Jezreel
  rationale: Pinananatili sa pangunahing teksto ang malinaw na lokatibong diwa, habang inilalagay sa talababa ang mas tiyak ngunit di-ganap na tiyak na kahulugang pang-arkitektura.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinabi ni Yahweh” sa halip na ang literal ngunit di-likas na “nagsalita…na sinasabi.” Ang “kakainin” ay sadyang payak upang huwag dagdagan ang tindi ng pandiwang Hebreo.
