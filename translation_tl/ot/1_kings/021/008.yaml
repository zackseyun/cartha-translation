revisions:
- from: Kaya sumulat siya ng mga liham sa pangalan ni Ahab at tinatakan ang mga iyon ng selyo nito. Pagkatapos, ipinadala niya ang mga liham sa matatandang pinuno at sa mga taong mararangal na nasa lungsod nito[a] at naninirahang kasama ni Nabot.
  to: Kaya sumulat siya ng mga liham sa pangalan ni Ahab, tinatakan ang mga ito ng kaniyang selyo, at ipinadala ang mga liham sa mga nakatatandang pinuno at sa mga maharlika na nasa kaniyang lungsod[a] at naninirahang kasama ni Nabot.
  rationale: Pinalitan ang di-likas na “nito” ng “kaniyang,” na maaari pa ring tumukoy sa alinman sa dalawang lalaking antecedent at samakatuwid ay hindi nilulutas ang kalabuan ng Hebreo. Ginawang “mga maharlika” ang katawagan para sa mataas-na-katayuang pangkat at inayos ang talababa upang wastong ilarawan ang pinag-uugatang kalabuan.
