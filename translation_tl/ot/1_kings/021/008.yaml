  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: tl
  text: Kaya sumulat siya ng mga liham sa pangalan ni Ahab, tinatakan ang mga ito ng kaniyang selyo, at ipinadala ang mga liham sa mga nakatatandang pinuno at sa mga maharlika na nasa kaniyang lungsod[a] at naninirahang kasama ni Nabot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na nasa lungsod ni Ahab.” Ang hulaping panlalaking isahan sa Hebreo ay maaaring tumukoy kay Nabot o kay Ahab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Kaya sumulat siya
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Kaya,” at ang “siya” ay tumutukoy kay Jezebel ayon sa konteksto.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: mga liham / ang mga liham
  rationale: Sa kontekstong ito ng opisyal na sulat sa mga lokal na pinuno, “mga liham” ang pinakamalinaw at pinakanatural na kahulugan ng סֵפֶר.
- source_word: בְּשֵׁם אַחְאָב
  choice: sa pangalan ni Ahab
  rationale: Pinananatili nito ang idyomang nagpapahiwatig na kumikilos sa ilalim ng pangalan o awtoridad ni Ahab.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: tinatakan ang mga iyon ng selyo nito
  rationale: Malinaw na inilalarawan ang paggamit sa opisyal na selyo ni Ahab; ang “nito” ay likas na tumutukoy kay Ahab sa pangungusap.
- source_word: הַזְּקֵנִים
  choice: matatandang pinuno
  rationale: Ipinahihiwatig ng זְקֵנִים ang mga nakatatandang namumuno sa pamayanan, hindi lamang mga taong may edad.
- source_word: הַחֹרִים
  choice: mga taong mararangal
  rationale: Tumutukoy ang חֹרִים sa mga taong mataas ang katayuan o prominenteng kasapi ng lipunan; dignified at madaling maunawaan ang salin.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: na nasa lungsod nito
  rationale: Pinananatili ng “nito” ang panlalaking isahang hulapi nang hindi tahasang nilulutas sa pangunahing teksto kung si Nabot o si Ahab ang tinutukoy.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: naninirahang kasama ni Nabot
  rationale: Pinananatili nito ang lokal at kaugnayang diwa ng ישב na may אֶת, pati ang aspektong patuloy ng participle.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa בְּעִירוֹ
  choice: Pinanatiling di-tiyak sa tekstong “lungsod nito,” na sa daloy ay maaaring unawaing kay Nabot.
  alternative: Maaaring tumukoy ang “lungsod nito” kay Ahab.
  rationale: Hindi ganap na tiyak ang antecedent ng hulapi. Ang kasunod na “naninirahang kasama ni Nabot” ay pumapabor kay Nabot, ngunit posible rin si Ahab dahil sa naunang pagbanggit sa kaniyang pangalan at selyo; kaya hindi dapat tahimik na alisin ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “matatandang pinuno” upang luminaw ang tungkuling sibiko, at “mga taong mararangal” para sa mga taong mataas ang katayuan. Inilagay ang marker [a] kaagad pagkatapos ng pariralang may tunay na kalabuan.
