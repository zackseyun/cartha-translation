  naturalness: Natural at marangal ang daloy sa modernong Filipino Tagalog. Ang “tela ng sako” ay mas malinaw na tawag sa sinaunang magaspang na telang panluksa kaysa “damit na sako,” habang nananatiling madaling maunawaan sa pangungusap.
  terminology: Ang “nag-ayuno,” “pinunit ... ang mga damit,” at “mga salitang ito” ay angkop. Sa talababa, ang “mapagpakumbabang” ay nagtatakda ng motibong panloob na hindi tahasang isinasaad ng Hebreo; dapat panatilihin ang lawak ng kahulugang mabagal, mahinahon, o tila malungkot/panlulumo.
