base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: tl
  text: At nang marinig ni Ahab ang mga salitang ito, pinunit niya ang kanyang mga damit, naglagay siya ng tela ng sako sa mismong katawan niya, nag-ayuno, nahiga nang suot ang tela ng sako, at naglakad nang marahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naglakad nang tahimik,” “naglakad nang mabagal,” o “naglakad na tila nanlulumo.” Ipinahihiwatig ng Hebreo ang mahinahon o mabagal na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: At nang marinig
  rationale: Ipinapahayag nang natural sa modernong Tagalog ang pormulang pasalaysay at ang temporal na diwa ng Hebreo, nang hindi gumagamit ng mabigat na ‘At nangyari na nang marinig.’
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Tumutukoy ito sa binigkas na hatol ni Elias; pinananatili ng ‘mga salita’ ang pandiwang diwa ng דְּבָרִים.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Natural at malinaw na paglalarawan ng karaniwang kilos ng pagdadalamhati.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: isinuot ang damit na sako sa kanyang katawan
  rationale: Ang ‘damit na sako’ ay malinaw sa karaniwang mambabasa bilang magaspang na kasuotang panluksa, at ang ‘sa kanyang katawan’ ay nagpapanatili sa konkretong larawan ng Hebreong בָּשָׂר nang hindi nagdaragdag na hubad siya.
- source_word: וַיָּצֹם
  choice: nag-ayuno
  rationale: Tuwirang katumbas ng pandiwang Hebreo para sa hindi pagkain bilang gawaing panluksa o pagpapakumbaba.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: nahiga nang suot ang damit na sako
  rationale: Pinananatili ang kilos ng paghiga at ang paulit-ulit na pagbanggit sa damit na sako, ngunit hindi ipinapalagay na natulog siya.
- source_word: וַיְהַלֵּךְ אַט
  choice: naglakad nang marahan
  rationale: Ipinahihiwatig ng אַט ang banayad, mabagal, o mahinahong pagkilos. Ang ‘nang marahan’ ay nagpapanatili sa lawak ng kahulugan nang hindi tahasang nagpapasya kung ito ay kalungkutan, katahimikan, o pagpapakumbaba.
theological_decisions:
- issue: Ang likas at katapatan ng tugon ni Ahab
  choice: Ilarawan lamang ang nakikitang mga kilos ng pagdadalamhati at pagpapakumbaba, nang hindi tahasang humahatol sa katapatan ng kanyang pagsisisi.
  alternative: Sabihing tunay na nagsisi si Ahab, o sabihing panlabas lamang ang kanyang pagdadalamhati.
  rationale: Mga kilos lamang ang iniulat ng talatang Hebreo—pagpunit ng damit, pagsusuot ng damit na sako, pag-aayuno, paghiga, at marahang paglakad. Hindi nito tahasang nilulutas ang tanong tungkol sa kanyang panloob na katapatan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘damit na sako’ upang maging malinaw ang sinaunang kasuotang panluksa; iniwasan ang mas teknikal o di-pamilyar na katawagang maaaring makalito. Ang magkakasunod na pandiwa ay nagpapanatili sa mariing ritmo ng salaysay na Hebreo.
