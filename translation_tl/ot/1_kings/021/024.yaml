  to: Ang sinumang kabilang sa sambahayan ni Ahab na mamatay sa lungsod ay kakainin ng mga aso, at ang sinumang kabilang sa kanya na mamatay sa bukid ay kakainin ng mga ibon sa himpapawid.[a]
  rationale: Idinagdag ang “kabilang sa kanya” sa ikalawang sugnay upang maipakita sa natural na Tagalog ang saklaw na ipinagpapatuloy ng elliptical na Hebreong konstruksiyon, nang hindi binabago ang kahulugan o ang marahas na imahen ng talata. Pinanatili ang umiiral na talababa at ang ankla nito.
