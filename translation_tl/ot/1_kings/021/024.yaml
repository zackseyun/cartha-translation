base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: tl
  text: Ang sinumang kabilang sa sambahayan ni Ahab na mamatay sa lungsod ay kakainin ng mga aso, at ang sinumang kabilang sa kanya na mamatay sa bukid ay kakainin ng mga ibon sa himpapawid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ibon sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת ... לְאַחְאָב
  choice: ang sinumang kabilang sa sambahayan ni Ahab na mamatay
  rationale: Ang may-artikulong participle ng מות ay ginagamit sa pangkalahatang diwa, at ang לְאַחְאָב ay nagpapahiwatig ng kaugnayan o pag-aari. Nililinaw ng “kabilang sa sambahayan ni Ahab” na ang tinutukoy ay sinuman sa kanyang angkan o sambahayan, hindi lamang isang tiyak na bangkay.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwirang lokatibong salin na natural sa modernong Filipino at nagpapanatili sa kaibahan ng lungsod at bukid.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: kakainin ng mga aso
  rationale: Pinananatili ang payak na kahulugan ng אכל na “kumain.” Ang balintiyak na ayos ay natural sa Filipino at malinaw na ang namatay ang kakainin.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: at ang sinumang mamatay sa bukid
  rationale: Inuulit ang pangkalahatang konstruksiyon ng unang sugnay at pinananatili ang paralelismo at ang literal na larawang “bukid.”
- source_word: עוֹף הַשָּׁמָיִם
  choice: mga ibon sa himpapawid
  rationale: Natural at marangal na salin ng karaniwang Hebreong parirala para sa mga ibong lumilipad sa kalangitan; pinananatili rin nito ang larawan ng שָׁמַיִם.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “sambahayan” upang likas na ipahayag ang kaugnayan kay Ahab nang hindi nililimitahan ang parirala sa mga taong pisikal na nakatira sa kanyang bahay. Inilagay ang tanging talababa sa pariralang “mga ibon sa himpapawid,” na siyang kaukulang leksikal na alternatibo.
