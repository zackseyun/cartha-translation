  naturalness: Ang “magsaya ang loob mo” ay mas likas sa makabagong Filipino kaysa “magalak ang puso mo,” habang katumbas nito ang Hebreong idyoma tungkol sa panloob na kalagayan. Ang natitirang pananalita ay malinaw, marangal, at angkop sa naratibong rehistro.
  terminology: Ang “Jezebel,” “Nabot,” “Jezreel,” “ubasan,” at “taga-Jezreel” ay angkop at pare-pareho. Pinananatili ng talababa ang mahalagang kalabuan kung ang unang sugnay ay patanong o mapanuyang pahayag.
