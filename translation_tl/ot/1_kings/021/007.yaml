base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ng asawa niyang si Jezebel, “Ikaw ba ngayon ang namumuno bilang hari sa Israel?[a] Bumangon ka, kumain ka,[b] at magsaya ang loob mo. Ako ang magbibigay sa iyo ng ubasan ni Nabot na taga-Jezreel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ikaw ngayon ang namumuno bilang hari sa Israel.” Ang Hebreo ay maaaring unawain bilang pahayag o panunuya sa halip na tanong.'
    reason: alternative_reading
  - marker: b
    text: 'Literal: “kumain ka ng tinapay,” isang idyomang Hebreo na nangangahulugang kumain o magsalo sa isang kainan.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Pagkatapos, sinabi sa kanya
  rationale: Ang waw-consecutive ay nagsusulong sa pagkakasunod-sunod ng salaysay; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Pagkatapos.”
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: ng asawa niyang si Jezebel
  rationale: Natural sa Tagalog ang ayos na ito at malinaw nitong pinananatili kapwa ang pangalan ng nagsasalita at ang kaugnayan niya kay Ahab.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: Ikaw ba ngayon ang naghahari sa Israel?
  rationale: Ang idyomang literal na “gumagawa ng paghahari” ay tumutukoy sa paggamit ng kapangyarihan bilang hari. Ang tanong na retorikal ang pinakanatural sa konteksto, habang inilalahad sa talababa ang maaari ring pagbasa rito bilang pahayag o panunuya.
- source_word: קוּם
  choice: Bumangon ka
  rationale: Tuwirang makabagong Tagalog para sa pautos na anyo ng pandiwang “bumangon.”
- source_word: אֱכָל לֶחֶם
  choice: kumain ka
  rationale: Ang literal na “kumain ng tinapay” ay idyomang Hebreo para sa pagkain ng isang kainan. Ang “kumain ka” ang natural na katumbas sa Tagalog, at pinananatili sa talababa ang literal na larawan.
- source_word: וְיִטַב לִבֶּךָ
  choice: at magalak ang puso mo
  rationale: Pinananatili ang “puso” bilang luklukan ng kalooban o damdamin at ipinahahayag nang natural ang diwang gumaan o sumaya ang loob.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Ako ang magbibigay sa iyo
  rationale: Ang tahasang panghalip na אֲנִי ay may diin; naipakikita ito sa natural na Tagalog sa hulma na “Ako ang magbibigay.”
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: ang ubasan ni Nabot na taga-Jezreel
  rationale: Natural na Tagalog para sa construct chain at sa katawagang gentiliko; mas madaling maunawaan ng karaniwang mambabasa ang “taga-Jezreel” kaysa isang transliterasyong gaya ng “Jezreelita.”
theological_decisions:
- issue: Lakas at anyo ng pambungad na sinabi ni Jezebel
  choice: 'Isinalin bilang tanong na retorikal: “Ikaw ba ngayon ang naghahari sa Israel?”'
  alternative: 'Maaaring basahin bilang mariing pahayag o panunuya: “Ikaw ngayon ang naghahari sa Israel.”'
  rationale: Walang tahasang pantandang patanong sa Hebreo. Gayunman, ipinahihiwatig ng konteksto na sinasaway ni Jezebel ang pagiging walang-kibo ni Ahab. Pinananatili ng talababa ang tunay na sintaktikong kalabuan sa halip na tuluyang lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang sobrang teknikal na pananalita, ngunit pinanatili ang larawang “puso” at ang diin ng “Ako” sa pangako ni Jezebel.
