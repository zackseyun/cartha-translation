  naturalness: Natural at marangal ang kabuuang rehistro, ngunit mas maayos ang ayos na “magpapasapit ako ng kapahamakan sa iyo.” Ang “wawakasan ko ang iyong lahi” at “sa sambahayan ni Ahab” ay mas malinaw at natural na Tagalog sa kontekstong ito.
  terminology: Napananatili ang “Narito,” “kapahamakan,” at “Israel” nang angkop. Ang “bawat lalaki” na may talababa para sa magaspang na Hebreong idyoma ay mahusay. Maaaring panatilihin ang “alipin man o malaya” sa pangunahing teksto, basta malinaw na isinasaad ng talababa na hindi tiyak ang eksaktong leksikal na kahulugan ng pares na Hebreo.
