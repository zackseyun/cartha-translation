source:
  edition: WLC
  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: tl
  text: “Narito, magpapasapit ako ng kapahamakan sa iyo. Wawakasan ko ang iyong lahi, at lilipulin ko sa sambahayan ni Ahab ang bawat lalaki[a] sa Israel, maging alipin man o malaya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang sinumang umiihi sa pader,” isang magaspang na idyoma para sa bawat lalaki.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong kahulugan ng pares na Hebreo; literal itong maaaring isaling “ang pinipigilan at ang pinababayaan.” Isa itong pormula na nagpapahiwatig na walang sinuman ang makaliligtas.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili ang mariing pormula ng propetikong pagpapahayag at ang agarang dating nito sa natural ngunit marangal na Tagalog.
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: magpapasapit ako sa iyo ng kapahamakan
  rationale: Sa konteksto ng hatol, ang רָעָה ay kapahamakang dumarating bilang parusa, hindi moral na kasamaan. Ang “magpapasapit” ay natural na nagpapahayag ng aktibong pagdadala nito.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: Lilipulin ko ang mga susunod sa iyo
  rationale: Ipinahihiwatig ng idyoma ang pag-aalis sa mga naiwan o sumunod kay Ahab. Pinananatili ng “mga susunod sa iyo” ang di-tahasang saklaw ng Hebreo nang hindi ito basta nililimitahan sa “mga inapo.”
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: papatayin ko ... ang kabilang kay Ahab
  rationale: Ang הִכְרַתִּי sa pormula ng hatol ay nangangahulugang lubusang pagpatay o paglipol. Ang “kabilang kay Ahab” ay nagpapahayag ng ugnayang tinutukoy ng לְאַחְאָב.
- source_word: מַשְׁתִּין בְּקִיר
  choice: bawat lalaki
  rationale: Ito ay magaspang na idyomang Hebreo para sa mga lalaki. Malinaw ang idyomatikong salin sa pangunahing teksto, habang nasa talababa ang literal na larawan.
- source_word: וְעָצוּר וְעָזוּב
  choice: maging alipin man o malaya
  rationale: Karaniwang nauunawaan ang pares bilang pormulang sumasaklaw sa lahat ng lalaki nang walang pagtatangi. Dahil hindi tiyak ang eksaktong diwa ng mga salita, binanggit sa talababa ang mas literal na anyo at ang kawalang-katiyakan.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwirang lokatibong salin na natural sa Tagalog.
theological_decisions:
- issue: Ang רָעָה bilang hatol na mula sa Diyos
  choice: kapahamakan
  alternative: kasamaan
  rationale: Ipinapakita ng konteksto na ang tinutukoy ay parusang kalamidad o kapinsalaan. Iniiwasan ng “kapahamakan” ang maling pahiwatig na moral na kasamaan ang ginagawa ng Diyos, habang pinananatili ang bigat ng hatol.
- issue: Saklaw ng וּבִעַרְתִּי אַחֲרֶיךָ
  choice: ang mga susunod sa iyo
  alternative: ang iyong mga inapo
  rationale: Hindi tahasang pinangalanan ng Hebreo ang “mga inapo.” Pinananatili ng napiling salin ang posibleng dinastiko o pansambahayan na diwa nang hindi ito labis na tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Narito” upang mapanatili ang solemneng propetikong pahayag. Ang tahasang karahasan ng hatol ay hindi pinalambot, ngunit iniwasan ang di-kailangang arkaismo. Inilagay ang mga marker [a] at [b] sa mismong mga pariralang nililinaw ng mga talababa.
