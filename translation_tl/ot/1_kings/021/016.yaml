base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: tl
  text: Nang marinig ni Ahab na patay na si Nabot[a], tumayo si Ahab upang bumaba sa ubasan ni Nabot na taga-Jezreel at angkinin iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namatay na.” Maaaring ipahayag ng Hebreo ang kalagayang bunga ng pagkamatay (“patay na”) o ang natapos nang pangyayari (“namatay na”).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ariin iyon” o “manahin iyon.” Depende sa konteksto, ang pandiwang Hebreo ay maaaring tumukoy sa pag-angkin, pag-aari, o pagmamana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig
  rationale: Ang וַיְהִי ay nagsisilbing transisyong pasalaysay, at ang כִּשְׁמֹעַ ay nagpapakilala ng sugnay na panahunan. Likas sa makabagong Tagalog ang “Nang marinig” nang hindi gumagamit ng makalumang panimulang pormula.
- source_word: מֵת
  choice: patay na
  rationale: Maaaring tumukoy ang anyo sa kalagayang bunga ng pagkamatay o sa naganap nang pagkamatay. Ang “patay na” ay tuwirang naghahayag ng kalagayang nabalitaan ni Ahab, habang itinatala sa talababa ang posibleng saling nakatuon sa pangyayari.
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Ang קום ay literal na pagbangon o pagtayo at sa salaysay ay naghuhudyat ng pagkilos. Pinananatili ng “tumayo” ang larawan nang hindi dinaragdagan ng kahulugang “agad na naglakbay.”
- source_word: לָרֶדֶת
  choice: upang bumaba
  rationale: Pinananatili ng “bumaba” ang direksiyonal na diwa ng ירד, at ipinahihiwatig ng “upang” ang infinitibong layunin na kasunod ng pagtayo ni Ahab.
- source_word: כֶּרֶם
  choice: ubasan
  rationale: Ang “ubasan” ang karaniwan at tiyak na katumbas ng כֶּרֶם sa Tagalog.
- source_word: הַיִּזְרְעֵאלִי
  choice: na taga-Jezreel
  rationale: Ang gentilic na anyo ay likas na isinasalin sa Tagalog bilang “taga-Jezreel,” na maaaring tumukoy sa pinagmulan o tirahan ni Nabot.
- source_word: לְרִשְׁתּוֹ
  choice: at angkinin iyon
  rationale: 'Malawak ang saklaw ng ירשׁ: maaaring mangahulugang ariin, angkinin, manahin, o sakupin. Ang “angkinin” ay angkop sa pagkilos ni Ahab na kukunin ang ubasan bilang pag-aari, ngunit hindi inilalagay sa mismong pandiwa ang mas matinding diwang “agawin,” na nagmumula sa mas malawak na konteksto.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal ang himig. Pinanatili ang pag-uulit ng pangalang “Ahab” mula sa Hebreo upang sundan ang diin at galaw ng salaysay. Iniwasan ang makalumang “at nangyari” at ang mas interpretibong “agawin.”
