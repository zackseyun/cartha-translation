  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: tl
  text: Pagkatapos, pumasok ang dalawang masasamang lalaki[a] at umupo sa tapat ni Nabot. Ang masasamang lalaking iyon ay nagpatotoo laban kay Nabot sa harap ng mga tao, na sinasabi, “Sinumpa ni Nabot ang Diyos at ang hari.”[b] Kaya inilabas nila siya sa labas ng lungsod, binato nila siya ng mga bato, at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak ni Belial” o “mga lalaki ni Belial,” isang idyoma para sa masasama o walang-kabuluhang mga tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “pinagpala,” ngunit ginamit dito bilang magalang na eupemismo para sa “sinumpa” sa isang paratang ng kalapastanganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: masasamang lalaki
  rationale: Idyoma ito para sa mga taong hamak sa asal o makasalanan, hindi literal na mga anak ni Belial. Ang “masasamang lalaki” ay malinaw at natural sa modernong Tagalog.
- source_word: נֶגְדּוֹ
  choice: sa tapat ni Nabot
  rationale: Ipinapahiwatig ng parirala na naupo sila nang nakaharap o katapat ni Nabot.
- source_word: וַיְעִדֻהוּ
  choice: nagpatotoo sila laban kay Nabot
  rationale: Ang Hiphil ng עוּד ay tumutukoy rito sa pormal na testimonya laban sa isang tao sa isang usaping hudisyal.
- source_word: נֶגֶד הָעָם
  choice: sa harap ng mga tao
  rationale: Pinananatili nito ang pampublikong tagpuan ng paratang nang malinaw at maikli.
- source_word: בֵּרַךְ
  choice: sumpain
  rationale: Bagaman literal na “pinagpala,” ginagamit dito ang pandiwa bilang magalang na eupemismo para sa “sumpain” sa paratang ng kalapastanganan.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Sa kontekstong Israelita, ang tinutukoy ay ang Diyos ng Israel, kaya ang isahan at tiyak na anyo ang angkop.
- source_word: וָמֶלֶךְ
  choice: at ang hari
  rationale: 'Tuwirang pinag-uugnay ang dalawang umano''y sinumpa: ang Diyos at ang hari.'
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: inilabas nila siya sa lungsod
  rationale: Natural itong paglalarawan sa pagdadala kay Nabot sa labas ng lungsod upang patayin.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים וַיָּמֹת
  choice: binato siya hanggang sa mamatay
  rationale: Natural sa Tagalog ang “binato,” at malinaw na ipinahahayag ng “hanggang sa mamatay” ang naging bunga ng pagbato, nang hindi inuulit ang salitang “bato.”
theological_decisions:
- issue: Ang eupemistikong pandiwang בֵּרַךְ sa paratang ng kalapastanganan
  choice: Isalin ayon sa kahulugan bilang “sumpain” sa pangunahing teksto
  alternative: Isalin nang literal bilang “pinagpala” at ipaliwanag na eupemismo iyon
  rationale: Ang aktuwal na paratang ay sinumpa ni Nabot ang Diyos at ang hari. Pinakamalinaw sa mambabasa ang kahulugan sa pangunahing teksto, habang inilalahad sa talababa ang literal na anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “lungsod” para sa dignidad ng salaysay at “nagpatotoo laban” upang mapanatili ang hudisyal na diwa. Inilagay ang [b] pagkatapos ng buong sipi upang malinaw na tumutukoy ito sa eupemistikong pandiwa sa paratang.
