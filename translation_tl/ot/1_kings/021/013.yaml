  to: Pagkatapos, pumasok ang dalawang masasamang lalaki[a] at umupo sa tapat ni Nabot. Ang masasamang lalaking iyon ay nagpatotoo laban kay Nabot sa harap ng mga tao, na sinasabi, “Sinumpa ni Nabot ang Diyos at ang hari.”[b] Kaya inilabas nila siya sa labas ng lungsod, binato nila siya ng mga bato, at namatay siya.
