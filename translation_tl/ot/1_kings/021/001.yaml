base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, si Nabot na taga-Jezreel ay may ubasan sa Jezreel, sa tabi ng palasyo ni Ahab na hari ng Samaria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “May ubasan si Nabot na taga-Jezreel sa Jezreel, sa tabi ng palasyo ni Ahab na hari ng Samaria.” Sa Hebreo, literal na “may ubasan kay Nabot”; ito ay isang anyong nagpapahayag ng pagmamay-ari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[hindi hiwalay na isinalin]'
  rationale: Nagsisilbi itong panandang pasalaysay na nagbubukas ng bagong yugto. Likas na naipahihiwatig sa Filipino ang tungkuling ito sa temporal na pariralang sumusunod, kaya hindi na dinagdagan ng “at nangyari” o “ngayon.”
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Pinananatili ang temporal na transisyon at ang pangmaramihang anyo, habang ang “mga pangyayari” ay mas natural kaysa literal na “mga bagay” sa ganitong salaysay.
- source_word: כֶּרֶם
  choice: ubasan
  rationale: Ito ang karaniwan at tuwirang kahulugan ng salitang Hebreo.
- source_word: הָיָה לְנָבוֹת
  choice: si Nabot ... ay may
  rationale: Ang eksistensiyal na konstruksiyong Hebreo ay nagpapahayag ng pagmamay-ari; natural itong isalin sa Filipino bilang “ay may.”
- source_word: נָבוֹת
  choice: Nabot
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: הַיִּזְרְעֵאלִי
  choice: na taga-Jezreel
  rationale: Natural na Filipino para sa gentiliko na tumutukoy sa pinagmulan o kaugnayan ni Nabot sa Jezreel.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: sa Jezreel
  rationale: Tinutukoy ng sugnay ang kinaroroonan ng ubasan; maikli at malinaw itong naipapahayag sa Filipino.
- source_word: אֵצֶל
  choice: sa tabi ng
  rationale: Nagpapahayag ng malapit at katabing lokasyon, mas tiyak kaysa “malapit sa.”
- source_word: הֵיכַל
  choice: palasyo
  rationale: Sa kontekstong maharlika, tumutukoy ito sa tirahan o palasyo ng hari, hindi sa templo.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: hari ng Samaria
  rationale: Tuwirang inilalarawan ang sakop o luklukang maharlika ni Ahab nang hindi nagdaragdag ng kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taga-Jezreel” sa halip na isang di-likas na gentiliko, at iniwasan ang makalumang panimulang “at nangyari.” Ang marker na [a] ay inilagay pagkatapos ng buong pangungusap upang malinaw na saklawin ng tala ang alternatibong ayos ng konstruksiyong Hebreo.
