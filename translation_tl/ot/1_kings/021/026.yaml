  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: tl
  text: Napakasuklam-suklam ng ginawa niya nang sumunod siya sa mga diyus-diyosan[a], tulad ng lahat ng ginawa ng mga Amoreo, na pinalayas ni Yahweh mula sa harap ng mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para rito ay isang matinding mapanlibak na tawag sa mga diyus-diyosan; maaari ring isaling “mga kasuklam-suklam na diyus-diyosan,” at mas literal na “mga idolong dumi.”
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita” sa halip na “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: Lubha siyang gumawa ng kasuklam-suklam
  rationale: Pinananatili ang pandiwang diwa at matinding negatibong paghatol ng Hebreo; ang “lubha” ay natural na katumbas ng מְאֹד.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: sa pagsunod sa
  rationale: Natural sa makabagong Tagalog at naipahahayag ang pagtalima o katapatan na ipinahihiwatig ng literal na paglakad sa likuran ng isang bagay.
- source_word: הַגִּלֻּלִים
  choice: mga diyus-diyosan
  rationale: Malinaw at karaniwang tawag sa mga idolo sa Tagalog; inilalagay sa talababa ang matinding mapanlibak na kulay ng salitang Hebreo.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: gaya ng lahat ng ginawa
  rationale: Malapit sa paghahambing ng Hebreo habang nananatiling natural sa Tagalog.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang gamit nito at likas na isinasalin bilang maramihan sa Tagalog.
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Ipinahahayag ang sapilitang pagpapaalis o pagtataboy sa dating mga naninirahan; malinaw at madaling maunawaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵי
  choice: mula sa harapan ng
  rationale: Pinananatili ang larawan ng Hebreo tungkol sa pagpapaalis sa harap o landas ng Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal na pinananatili ang Hebreong ekspresyon; inilalahad sa talababa ang mas idyomatikong “mga Israelita.”
theological_decisions:
- issue: Paglalarawan sa asal ni Ahab sa וַיַּתְעֵב
  choice: Lubha siyang gumawa ng kasuklam-suklam
  alternative: Lubha siyang naging kasuklam-suklam
  rationale: Mas pinipili ang aktibong paglalarawan sa asal kaysa sa statibong pagbabagong-kalagayan, ngunit hindi tinutukoy nang higit sa pinagmulan kung alin sa kanyang mga gawa ang saklaw.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang pangalan at hindi pinapalitan ng titulo.
- issue: Kolektibong panlalaking ekspresyong בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pormal na ekspresyon ng pinagmulan nang hindi ipinapalagay na mga lalaking indibidwal lamang ang tinutukoy; ibinibigay sa talababa ang natural na kolektibong katumbas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “diyus-diyosan” bilang karaniwang salitang biblikal na nauunawaan ng ordinaryong mambabasa, habang pinanatili sa talababa ang matinding pejoratibong bisa ng Hebreo. Ang ayos na “mula sa harapan” ay bahagyang pormal upang mapanatili ang larawan ng orihinal.
