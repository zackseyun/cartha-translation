base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: tl
  text: 'Isinulat niya sa mga liham[a] ang ganito: “Ipahayag ninyo ang isang pag-aayuno, at paupuin ninyo si Nabot sa unahan ng bayan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga kasulatan.” Sa kontekstong ito, tumutukoy ang salitang Hebreo sa mga nakasulat na liham o dokumento. Ang “sa unahan ng bayan” ay literal na “sa ulo ng bayan” at maaari ring mangahulugang “sa harap ng bayan” o sa isang litaw na puwesto sa gitna ng bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Isinulat niya
  rationale: Ang wayyiqtol na ikatlong panauhang pambabae ay nagsasalaysay ng kasunod na ginawa ni Jezebel. Likas sa Tagalog ang pandiwang may panghalip na “niya,” bagaman hindi nito tahasang minamarkahan ang kasarian na malinaw naman sa konteksto.
- source_word: בַּסְּפָרִים
  choice: sa mga liham
  rationale: Sa konteksto, ang סְפָרִים ay mga sulat na ipinadala sa mga pinuno ng lunsod, hindi mga aklat. Ang “sa mga liham” ay natural na katumbas ng pagsulat ng nilalaman sa mga ito.
- source_word: לֵאמֹר
  choice: 'ang ganito:'
  rationale: Ito ang karaniwang panandang Hebreo na nagpapakilala sa tuwirang sipi. Mas natural sa modernong Tagalog ang “ang ganito” kaysa sa literal na “na sinasabi.”
- source_word: קִרְאוּ צוֹם
  choice: Ipahayag ninyo ang isang pag-aayuno
  rationale: Ang maramihang pautos na קִרְאוּ ay may diwang pampubliko at opisyal na pagpapahayag. Ang צוֹם ay tumutukoy sa sama-samang pag-aayuno.
- source_word: וְהוֹשִׁיבוּ אֶת נָבוֹת
  choice: at paupuin ninyo si Nabot
  rationale: 'Ang Hiphil na pautos ng ישב ay causative: ipaupo o italaga sa isang upuan. Pinananatili ng “paupuin” ang aspektong ito.'
- source_word: בְּרֹאשׁ הָעָם
  choice: sa unahan ng bayan
  rationale: Literal itong “sa ulo/unahan ng bayan.” Ang “sa unahan ng bayan” ay nagpapanatili sa larawan at sa posibleng kahulugang lantad o prominenteng puwesto nang hindi tiyak na ipinapalagay na siya ang pinuno.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang maramihang “ninyo” upang ipakita ang maramihang anyo ng mga pautos. Isinalin ang idyomang בְּרֹאשׁ הָעָם bilang “sa unahan ng bayan,” na natural ngunit hindi inaalis ang pagiging prominenteng puwesto ni Nabot sa kapulungan.
