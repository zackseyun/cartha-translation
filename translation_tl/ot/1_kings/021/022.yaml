source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: tl
  text: At gagawin kong gaya ng sambahayan ni Jeroboam na anak ni Nebat, at gaya ng sambahayan ni Baasa na anak ni Ahias, ang sambahayan mo[a], dahil pinukaw mo ang galit ko at inakay mo ang Israel na magkasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinastiya.” Dito, ang “sambahayan” ay tumutukoy sa maharlikang linya ni Ahab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: At gagawin ko
  rationale: Bagaman literal na “ibibigay ko” ang pandiwa, sa pormulang ito ng paghatol ay ipinapahayag nito ang magiging kalagayan ng sambahayan ni Ahab; natural sa Tagalog ang “gagawin ko.”
- source_word: בֵּיתְךָ
  choice: ang sambahayan mo
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay, sambahayan, o dinastiya. Pinananatili ng “sambahayan” ang larawan ng Hebreo habang naipahihiwatig ang angkan ng hari.
- source_word: כְּבֵית ... וּכְבֵית
  choice: gaya ng sambahayan ... at ng sambahayan
  rationale: Malinaw at natural na ipinahahayag ng “gaya ng” ang paghahambing na minamarkahan ng כְּ.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Tuwirang isinasalin ang karaniwang Hebreong pormula ng pangalan at ama.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa na anak ni Ahias
  rationale: Ginagamit ang nakaugaliang anyong Filipino ng mga pangalan at tuwirang isinasalin ang patronimiko.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: dahil pinukaw mo ang galit ko
  rationale: Ipinahahayag nito ang sanhi ng paghatol at ang diwa ng כעס, na tumutukoy sa pagpukaw ng galit, sa natural na modernong Tagalog.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: at inakay mo ang Israel na magkasala
  rationale: Ang Hiphil ng חטא ay causative. Ang “inakay ... na magkasala” ay malinaw at natural nang hindi ipinahihiwatig na walang pananagutan ang Israel.
theological_decisions:
- issue: Di-hayag na banal na layon ng “pinukaw mo”
  choice: Isinalin bilang “pinukaw mo ang galit ko”
  alternative: “dahil sa pagpukaw mo ng galit” na hindi tahasang binabanggit kung kaninong galit
  rationale: Ang nagsasalita ay ang PANGINOON, kaya malinaw sa konteksto na ang kaniyang galit ang pinukaw. Ginagawang tahasan ito para sa likas na Tagalog nang walang idinaragdag na bagong teolohikal na pahayag.
- issue: Kahulugan ng בֵּית sa pahayag ng paghatol sa isang hari
  choice: Pinanatili ang larawang “sambahayan” sa pangunahing teksto
  alternative: “dinastiya” o “angkan”
  rationale: Tumutukoy ito sa maharlikang linya ni Ahab, ngunit mahalagang mapanatili ang metapora ng “bahay/sambahayan” sa Hebreo; nililinaw sa talababa ang partikular na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “sambahayan” upang mapanatili ang Hebreong larawan, at inayos ang pangungusap sa likas na ayos ng Tagalog.
