  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: tl
  text: Ngunit sinabi ni Nabot kay Ahab, “Huwag nawang ipahintulot ni Yahweh[a] na ibigay ko sa iyo ang mana ng aking mga ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas malapit sa anyo ng Hebreo: “Malayong mangyari sa akin, alang-alang kay Yahweh, na ibigay ko sa iyo ang mana ng aking mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “ngunit” ay likas na nagpapakita ng pagsalungat ni Nabot sa alok ni Ahab sa naunang talata.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אֶל־אַחְאָב
  choice: kay Ahab
  rationale: Likas na Tagalog para sa pagpapakilala sa taong kinakausap.
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Huwag nawang ipahintulot ni Yahweh
  rationale: Isinasalin nang idyomatiko ang mariing pagtanggi na may kaugnayan sa banal na pangalan. Iniiwasan nitong gawing payak na personal na pag-ayaw lamang ang pahayag.
- source_word: מִתִּתִּי
  choice: na ibigay ko
  rationale: Ang infinitive construct na may preposisyon ay tumutukoy sa gawaing mariing itinatakwil ni Nabot.
- source_word: נַחֲלַת אֲבֹתַי
  choice: ang pamanang mula sa aking mga ninuno
  rationale: Pinananatili ng “pamana” ang legal at pampamilyang diwa ng minanang pag-aari; malinaw at natural sa modernong Tagalog ang “mga ninuno” para sa linyang pinagmulan.
- source_word: לָךְ
  choice: sa iyo
  rationale: Karaniwang Tagalog na di-tuwirang layon pagkatapos ng “ibigay.”
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapakahulugan sa חָלִילָה לִּי מֵיְהוָה
  choice: Huwag nawang ipahintulot ni Yahweh
  alternative: Malayong mangyari sa akin dahil kay Yahweh
  rationale: Ang pangunahing salin ay natural na Tagalog para sa mariing, panrelihiyong pagtanggi. Inilalagay sa talababa ang mas malapit ngunit hindi gaanong likas na anyo upang mapanatili ang posibleng ugnayan ng מִן bilang batayan o kaugnayan, sa halip na lubusang ikubli ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pamana” sa halip na teknikal na “minanang ari-arian,” at ang idyomatikong panalangin ng mariing pagtanggi sa pangunahing teksto; inilaan sa talababa ang mas pormal at mas literal na pagkakabuo.
