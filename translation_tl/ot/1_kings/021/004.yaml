base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: tl
  text: 'Kaya umuwi si Ahab na masama ang loob at galit dahil sa sinabi sa kanya ni Nabot na taga-Jezreel: “Hindi ko ibibigay sa iyo ang pamanang lupa ng aking mga ama.”[a] Humiga siya sa kanyang higaan, ibinaling ang kanyang mukha sa kabilang panig, at ayaw kumain ng tinapay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pamanang lupa ng aking mga ama” ay maaari ring isaling “pamanang lupa ng aking mga ninuno.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hindi siya kumain ng tinapay”; ang “tinapay” ay maaari ring tumukoy sa pagkain sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: masama ang loob at galit
  rationale: Likas at malinaw sa makabagong Tagalog ang tambalang ito para sa mapagkimkim at galit na kalagayan ni Ahab; pinananatili nito ang dalawang magkakaugnay ngunit hindi ganap na magkaparehong paglalarawan.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: dahil sa sinabi sa kanya
  rationale: Sa konteksto, ang דָּבָר ay tumutukoy sa sinabi ni Nabot. Mas natural ito kaysa sa literal na “dahil sa salitang sinalita sa kanya,” habang pinananatili ang sanhi ng reaksiyon ni Ahab.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabot na taga-Jezreel
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Nabot at natural na isinalin ang gentiliko bilang “taga-Jezreel.”
- source_word: נַחֲלַת אֲבוֹתָי
  choice: pamanang lupa ng aking mga ama
  rationale: Ang נַחֲלָה rito ay minanang lupain ng pamilya, hindi lamang pangkalahatang mana. Nililinaw ng “pamanang lupa” ang konteksto, at pinananatili ng “aking mga ama” ang tahasang panlalaking anyo ng Hebreo.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: Humiga siya sa kanyang higaan
  rationale: Tuwirang inilalarawan nito ang pasimulang kilos ng paghiga at ang lugar nito.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: tumalikod
  rationale: Natural na Tagalog ito para sa kilos ng pagharap sa kabilang panig o paglayo ng mukha, at naihahatid ang mapagtampong pag-iwas nang hindi labis na nagpapaliwanag.
- source_word: וְלֹא אָכַל לָחֶם
  choice: ayaw kumain
  rationale: Ang לֶחֶם ay literal na “tinapay” ngunit maaari ring tumukoy sa pagkain sa pangkalahatan. Ipinahihiwatig ng konteksto ang kusang pagtanggi, kaya ang “ayaw kumain” ay natural at tumpak.
theological_decisions:
- issue: Panlalaking pananalita tungkol sa mga ninuno sa sipi ni Nabot
  choice: aking mga ama
  alternative: aking mga ninuno
  rationale: Tahasan ang panlalaking maramihan na אֲבוֹתָי. Sa konteksto ng minanang lupa ng angkan, pinananatili ng “mga ama” ang patrimonyal na diin ng pinagmulan sa halip na gawing neutral.
translation_notes:
  register: Makabago, natural, at marangal na Filipino; iniwasan ang lipas o sobrang literal na mga parirala. Ang “masama ang loob at galit” ay madaling maunawaan ngunit nananatiling angkop sa salaysay. Ang mga talababa ay inilagay pagkatapos ng mismong pariralang nililinaw.
