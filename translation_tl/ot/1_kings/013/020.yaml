  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: tl
  text: Habang nakaupo sila sa hapag, dumating ang salita ni Yahweh sa propetang nagpabalik sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: dumating
  rationale: Sa ikalawang paglitaw nito, ipinakikilala ng hulmaing pasalaysay ang pangyayaring dumating ang salita ni Yahweh; likas ito sa modernong Tagalog at hindi nangangailangan ng makalumang panimulang parirala.
- source_word: הֵם יֹשְׁבִים
  choice: habang nakaupo sila
  rationale: Ang panghalip at participle ay nagpapahayag ng nagpapatuloy na kalagayan, kaya ang “habang nakaupo sila” ay nagpapanatili sa duratibong diwa.
- source_word: אֶל הַשֻּׁלְחָן
  choice: kumakain sa hapag
  rationale: Sa konteksto ng pag-upo at pakikisalo, ang parirala ay tumutukoy sa pagiging nasa hapag para sa pagkain. Idinagdag ang “kumakain” upang natural at malinaw sa Tagalog ang idyoma.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili nito ang karaniwang pormulang propetiko at ang tuwirang ugnayang construct ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang tipanang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֶל הַנָּבִיא
  choice: sa propeta
  rationale: Ang אֶל kasunod ng pormulang “salita ni Yahweh” ay tumutukoy sa tumanggap ng kapahayagan.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: na nagpabalik sa kanya
  rationale: 'Ang Hiphil ng שוב na may hulaping panghalip ay causative: ang propeta ang naging dahilan ng pagbabalik ng lalaki ng Diyos.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Pagkakakilanlan ng propetang tumanggap ng salita
  choice: ang propetang nagpabalik sa kanya
  alternative: ang lalaki ng Diyos na naibalik
  rationale: Sa gramatika, ang relative clause na אֲשֶׁר הֱשִׁיבוֹ ay pinakamalapit at tumutukoy sa הַנָּבִיא; kaya ang tumanggap ng salita ay ang matandang propetang nagpabalik sa lalaki ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “hapag” bilang likas na salitang biblikal ngunit buhay pa rin sa kasalukuyang wika; iniwasan ang makalumang “at nangyari.”
