- from: At nangyari, matapos niyang kumain ng tinapay at uminom, ipinasá niya ang asno para sa propetang pinabalik niya.[a]
  to: At nangyari, pagkatapos kumain ng tinapay at uminom ang propeta, kinabitan ng propeta ng saddle ang asno para sa propetang pinabalik niya.[a]
  rationale: Pinalitan ang malabong "ipinasá" ng malinaw na "kinabitan ... ng saddle." Inayos din ang mga pangngalan upang hindi pag-isahin sa Filipino ang dalawang propeta na pinaghihiwalay ng konteksto at ng pantulong na sugnay sa Hebreo. Hindi tinukoy ang ininom, at pinanatili ang causative na kahulugan ng "pinabalik."
