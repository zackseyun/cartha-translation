translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na daloy. Ginamit ang 'ipinasá' bilang tiyak na pandiwa para sa paglalagay ng saddle; inilagay ang talababa sa mismong pariralang may leksikal na alternatibo.
