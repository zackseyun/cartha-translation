base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: tl
  text: At nangyari, pagkatapos kumain ng tinapay at uminom ang propeta, kinabitan ng propeta ng saddle ang asno para sa propetang pinabalik niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na sanhi niyang bumalik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang Hebreong panandang pasalaysay na nag-uugnay sa susunod na pangyayari, sa natural at di-arkaismong Filipino.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: matapos niyang kumain ng tinapay
  rationale: Malinaw na ipinahahayag ang temporal na pagkakasunod at pinananatili ang tahasang לֶחֶם, bagaman maaari rin itong tumukoy sa pagkain bilang isang kainan.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: at uminom
  rationale: Pinananatili ang parallel na kilos nang hindi nagdaragdag ng inuming hindi tinukoy sa Hebreo.
- source_word: וַיַּחֲבָשׁ
  choice: ipinasá niya
  rationale: Sa kontekstong ito, ang חבש ay paglalagay at paghihigpit ng pasa o saddle sa hayop; ang 'ipinasá' ay maikli at tiyak.
- source_word: לוֹ
  choice: para sa
  rationale: Ipinahihiwatig ng ל na inihanda ang asno upang gamitin ng propeta.
- source_word: הַחֲמוֹר
  choice: ang asno
  rationale: Karaniwan, dignificado, at tumpak na modernong Filipino para sa חמור.
- source_word: לַנָּבִיא
  choice: sa propeta
  rationale: Sinusunod ang tahasang pangngalang נביא at hindi ito pinapalitan ng 'tao ng Diyos.'
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: propetang pinabalik niya
  rationale: 'Ipinapakita ng Hiphil ng שוב ang sanhi: siya ang nagpabalik o nag-udyok na bumalik sa propeta. Pinananatili ng salin ang posibleng sanhi nang hindi labis na nililinaw ang paraan.'
