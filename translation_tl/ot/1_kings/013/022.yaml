revisions:
- from: Ngunit bumalik ka at kumain ng tinapay at uminom ng tubig sa lugar na tungkol dito ay sinabi niya sa iyo, ‘Huwag kang kumain ng tinapay at huwag kang uminom ng tubig.’ Kaya ang bangkay mo ay hindi makakarating sa libingan ng iyong mga ninuno.[a]
  to: Ngunit bumalik ka at kumain ng tinapay at uminom ng tubig sa lugar na sinabi niyang huwag kang kumain ng tinapay o uminom ng tubig. Hindi makararating ang bangkay mo sa libingan ng iyong mga ninuno.[a]
  rationale: Pinalitan ang di-likas na pang-ugnay na “tungkol dito ay sinabi niya sa iyo” ng karaniwang Tagalog na “sinabi niyang,” habang pinanatili ang pag-uulit ng tinapay at tubig sa loob ng iniulat na pagbabawal. Ginamit ang “o” sa negatibong utos, isang likas na Tagalog na paraan upang ipahayag ang dalawang ipinagbabawal na kilos. Inalis ang “Kaya” upang hindi magdagdag ng hayag na pang-ugnay na wala sa Hebreo. Napanatili ang literal na larawan ng bangkay na hindi makararating sa libingan sa footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:01:59Z'
