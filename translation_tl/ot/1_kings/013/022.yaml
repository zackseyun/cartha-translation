base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: tl
  text: Ngunit bumalik ka at kumain ng tinapay at uminom ng tubig sa lugar na sinabi niyang huwag kang kumain ng tinapay o uminom ng tubig. Hindi makararating ang bangkay mo sa libingan ng iyong mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi darating ang bangkay mo sa libingan ng iyong mga ninuno”; maaari ring isalin, “hindi maililibing ang bangkay mo sa libingan ng iyong mga ninuno.”
    reason: Nililinaw ang literal na larawan ng Hebreong pandiwang “darating” at ang natural na ipinahihiwatig nitong hindi maililibing doon ang bangkay.
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: bumalik ka
  rationale: Tuwirang ipinahahayag ang pagbabalik ng lalaking kinakausap at ang pagsuway na binibigyang-diin sa pagsaway.
- source_word: וַתֹּאכַל לֶחֶם
  choice: kumain ng tinapay
  rationale: Pinananatili ang kongkretong salitang 'tinapay' at ang pag-uulit nito sa naunang pagbabawal.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: uminom ng tubig
  rationale: Likas at tuwirang salin na nagpapanatili sa eksaktong bagay na ipinagbawal.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: sa lugar na tungkol dito ay sinabi niya sa iyo
  rationale: Iniuugnay ang sinalitang pagbabawal sa mismong lugar, gaya ng Hebreong pariralang maaaring tumukoy sa lugar na tungkol dito ibinigay ang utos.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘Huwag kang kumain ng tinapay at huwag kang uminom ng tubig’
  rationale: Pinananatili ang dalawang tahasang pagbabawal at ang retorikal na pag-uulit ng mga pangngalan.
- source_word: נִבְלָתְךָ
  choice: ang bangkay mo
  rationale: '''Bangkay'' ang malinaw at karaniwang makabagong salitang Tagalog para sa patay na katawan, at napapanatili nito ang bagsik ng hatol.'
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: ang bangkay mo ay hindi makakarating sa libingan ng iyong mga ninuno
  rationale: Pinananatili ang Hebreong larawan ng bangkay na hindi 'makakarating' sa libingan, sa halip na tahasang idagdag kung sino ang magdadala rito.
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Sa kontekstong panglibing, natural na ipinahahayag nito ang mga naunang salinlahi ng pamilya nang hindi nililimitahan ang kahulugan sa agarang mga ama.
theological_decisions:
- issue: Kalikasan ng pahayag ng hatol
  choice: Kongkretong kapahayagan na ang bangkay ng propeta ay hindi makakarating sa libingan ng kanyang mga ninuno
  alternative: Mas malawak at matalinghagang pahayag lamang tungkol sa kahihiyan pagkamatay
  rationale: Nakatuon ang Hebreo sa bangkay at sa libingan ng mga ninuno. Pinananatili ng salin ang kongkretong larawan ng pagkakait ng libing sa libingan ng pamilya nang hindi nagdaragdag ng implikasyong teolohikal.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at tuwiran. Pinanatili ang matinding tono ng pagsaway, ang pag-uulit sa pagbabawal, at ang kongkretong larawan ng hatol.
