base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: tl
  text: Sinabi ng kanilang ama sa kanila, “Saang daan siya pumunta?” Sapagkat nakita ng kanyang mga anak ang daang dinaanan ng tao ng Diyos na dumating mula sa Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Sinabi
  rationale: Bagaman literal na ‘nagsalita,’ ang ‘sinabi’ ang natural na gamit sa makabagong Tagalog kapag nagpapakilala ng tuwirang tanong.
- source_word: אֲבִיהֶם
  choice: kanilang ama
  rationale: Ang hulapi ay ikatlong panauhang maramihan at tumutukoy sa mga anak.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Saang daan
  rationale: Ang tanong ay tungkol sa rutang tinahak; natural at tiyak sa Tagalog ang ‘Saang daan siya pumunta?’
- source_word: הָלָךְ / הַדֶּרֶךְ אֲשֶׁר הָלַךְ
  choice: pumunta / dinaanan
  rationale: Pinananatili ang diwa ng pagpunta at rutang tinahak, habang iniiwasan ang alanganing literal na pag-uulit sa Tagalog.
- source_word: וַיִּרְאוּ
  choice: nakita
  rationale: Ang aspektong naganap na ng ‘nakita’ ay sapat upang ipakitang nauna ang pagkakita ng mga anak sa tanong ng ama.
- source_word: בָנָיו
  choice: kanyang mga anak
  rationale: Ang pang-isahang hulaping paari ay tumutukoy sa ama.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Sa natural na gamit-Bibliya sa Tagalog, malinaw na titulo ang ‘lingkod ng Diyos’; ipinahihiwatig nito ang taong itinalaga ng Diyos nang hindi nililimitahan ang katawagan sa ‘propeta.’
- source_word: מִיהוּדָה
  choice: mula sa Juda
  rationale: Natural na pagpapahayag ng pinagmulan sa makabagong Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Ang literal na ‘tao ng Diyos’ ay maaaring maging malabo o di-natural sa ordinaryong Tagalog. Ang ‘lingkod ng Diyos’ ay naghahatid ng kinikilalang kaugnayan at tungkulin ng tauhan nang hindi tahasang pinapalitan ito ng mas makitid na ‘propeta.’
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang ‘Juda’ bilang karaniwang anyong Tagalog ng Judah. Walang kinakailangang talababa sa talatang ito.
