base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: tl
  text: May isang matandang propeta na naninirahan sa Bethel. Dumating ang anak niyang lalaki at isinalaysay sa kaniya ang buong ginawa ng tao ng Diyos nang araw na iyon sa Bethel, pati ang mga salitang sinabi niya sa hari. Isinalaysay nila[a] ang mga iyon sa kanilang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, singular muna ang “anak niyang lalaki” ngunit plural ang pandiwa at mga panghalip dito: “isinalaysay nila ang mga iyon sa kanilang ama.” Maaaring higit sa isa ang anak, o maaaring ito ay isang di-pagkakatugma sa teksto o salaysay. Pinananatili ng salin ang paglipat mula singular tungo sa plural.'
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: isang matandang propeta
  rationale: Ang אֶחָד ay maaaring tumukoy sa isang di-tiyak na indibidwal. Likas sa Tagalog ang “isang matandang propeta,” at hindi kailangang dagdagan ng “may isang partikular.”
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: naninirahan sa Bethel
  rationale: Bagaman maaaring literal na “nakaupo,” ang יֹשֵׁב sa kontekstong ito ay tumutukoy sa paninirahan.
- source_word: וַיָּבֹא בְנוֹ
  choice: dumating ang anak niyang lalaki
  rationale: Singular ang בְנוֹ sa puntong ito. Pinananatili sa salin ang singular at hindi ito pinapantay nang palihim sa plural sa hulihan ng talata.
- source_word: וַיְסַפֶּר לוֹ
  choice: isinalaysay sa kaniya
  rationale: Ang piel ng ספר ay nangangahulugang magsalaysay o mag-ulat; ang “isinalaysay” ay natural at angkop sa dignidad ng salaysay.
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: ang buong ginawa
  rationale: Singular at kolektibo ang מַעֲשֶׂה. Ang “buong ginawa” ay mas natural sa Tagalog kaysa “buong gawa” habang pinananatili ang pagtukoy sa kabuuan ng mahalagang ginawa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay maaaring maging malabo o di-likas sa karaniwang modernong Tagalog. Ang “lingkod ng Diyos” ay malinaw na naghahatid ng kinikilalang titulong propetiko nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: הַיּוֹם
  choice: nang araw na iyon
  rationale: Sa nakaraang salaysay, ito ang natural na katumbas ng “ngayong araw/today.”
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: pati ang mga salitang sinabi nito sa hari
  rationale: Pinananatili ang tahasang “mga salita” upang maiba ang propetikong pahayag sa ginawa.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: isinalaysay ng mga anak sa kanilang ama ang mga iyon
  rationale: Plural ang pandiwa, object suffix, at “kanilang ama” sa hulihan. Ginawang tahasan ang “mga anak” sa Tagalog upang maging malinaw ang plural na paksa, habang itinatala sa talababa ang paglipat mula singular.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Gumamit ng maiikling pangungusap upang malinaw na maipakita ang di-pangkaraniwang paglipat ng Hebreo mula singular tungo sa plural. Walang idinagdag na panimulang “Ngayon,” sapagkat walang tahasang katumbas nito sa Hebreo.
