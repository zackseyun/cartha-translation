revisions:
- from: May isang matandang propeta na naninirahan sa Bethel. Dumating ang anak niyang lalaki at isinalaysay sa kaniya ang buong ginawa ng lingkod ng Diyos nang araw na iyon sa Bethel, pati ang mga salitang sinabi nito sa hari. Isinalaysay ng mga anak[a] sa kanilang ama ang mga iyon.
  to: May isang matandang propeta na naninirahan sa Bethel. Dumating ang anak niyang lalaki at isinalaysay sa kaniya ang buong ginawa ng tao ng Diyos nang araw na iyon sa Bethel, pati ang mga salitang sinabi niya sa hari. Isinalaysay nila[a] ang mga iyon sa kanilang ama.
  rationale: Pinalitan ang hindi katumbas na “lingkod ng Diyos” ng “tao ng Diyos,” ang pamantayang salin ng tiyak na titulong Hebreo. Inayos rin ang huling sugnay upang malinaw na mapanatili ang plural na Hebreo nang hindi nagdaragdag ng tahasang pangngalang wala sa sugnay. Inilipat ang talababa sa “nila,” ang mismong punto ng singular/plural na tensiyon.
