revisions:
- from: Pumunta siya at nakita niyang nakahandusay sa daan ang bangkay nito[a], at nakatayo sa tabi ng bangkay ang asno at ang leon. Hindi kinain ng leon ang bangkay, ni nilapa ang asno.[b]
  to: Pumunta siya at natagpuan ang bangkay ng taong iyon[a] na itinapon sa daan, at nakatayo sa tabi ng bangkay ang asno at ang leon. Hindi kinain ng leon ang bangkay, ni niluray ang asno.[b]
  rationale: Binago ang paglalarawan ng bangkay mula “nakahandusay” tungo sa “itinapon” upang maisalin ang passive at marahas na puwersa ng Hebreo. Binago rin ang pandiwa para sa asno sa “niluray” upang mas malapit na maipahayag ang kontekstuwal na kahulugan ng “binali” kaysa sa “nilapa.” Pinanatili ang pagkakasunod-sunod ng salaysay, ang biswal na detalye ng asno at leon na nakatayo sa tabi ng bangkay, at ang mga angkla ng talababa.
