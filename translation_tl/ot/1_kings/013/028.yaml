base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: tl
  text: Pumunta siya at natagpuan ang bangkay ng taong iyon[a] na itinapon sa daan, at nakatayo sa tabi ng bangkay ang asno at ang leon. Hindi kinain ng leon ang bangkay, ni niluray ang asno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patay na katawan.” Ang salitang Hebreo na נְבֵלָה ay tahas at mariing nagpapakita ng katotohanan ng kamatayan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “hindi binali ang asno”; sa kontekstong ito, ang diwa ay hindi ito niluray, dinurog, o pinunit-punit ng leon.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: bangkay
  rationale: Ang נְבֵלָה ay tumutukoy sa patay na katawan o bangkay. Likas at tahas sa modernong Tagalog ang “bangkay” para sa taong namatay at napapanatili nito ang matinding diin ng Hebreo sa kamatayan.
- source_word: מֻשְׁלֶכֶת
  choice: nakahandusay
  rationale: Ang passive participle mula sa שלך ay nagpapahiwatig na ang bangkay ay itinapon o nakahandusay. Sa kontekstong biswal, natural ang “nakahandusay” at mas malakas kaysa simpleng “nakahiga,” bagaman hindi nito tahasang tinutukoy kung sino ang nagtapon.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Ang דֶּרֶךְ ay tumutukoy rito sa mismong daanan; karaniwan at malinaw sa Tagalog ang “sa daan.”
- source_word: עֹמְדִים אֵצֶל
  choice: nakatayo sa tabi
  rationale: Inilalarawan ng participle at preposition na nanatili ang asno at leon malapit sa bangkay. Tumpak at natural ang “nakatayo sa tabi.”
- source_word: לֹא אָכַל
  choice: Hindi kinain
  rationale: Karaniwang pandiwa para sa “kumain” ang אָכַל. Pinananatili ng “Hindi kinain” ang payak na lakas nito nang hindi dinaragdagan ng ideyang “nilamon.”
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: ni nilapa ang asno
  rationale: Literal na “binasag ang asno,” ngunit sa konteksto ng leon ay angkop ang diwang sinaktan, dinurog, o niluray. Ang “nilapa” ay likas na Tagalog para sa marahas na pag-atake ng mabangis na hayop, habang ipinapaliwanag sa talababa ang literal na larawan.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Pumunta siya at nakita niya
  rationale: Pinananatili nito ang tuwirang sunod-sunod na kilos ng mga wayyiqtol at natural ang daloy sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bangkay” upang mapanatili ang tahas na tono ng Hebreo, at “nakahandusay” upang maipakita ang marahas na kalagayan nang hindi maging makaluma. Inilagay ang [b] pagkatapos ng sugnay tungkol sa asno dahil iyon ang salitang ipinaliliwanag ng talababa.
