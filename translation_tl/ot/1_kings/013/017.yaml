base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: tl
  text: 'Sapagkat may salitang dumating sa akin sa pamamagitan ng salita ni Yahweh: ‘Huwag kang kumain ng tinapay o uminom ng tubig doon. Huwag kang bumalik sa daang nilakaran mo.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: sinabi sa akin sa pamamagitan ng salita ni Yahweh
  rationale: Ipinananatili ang pag-uulit ng salitang dabar (‘sinabi/salita’) at ang diwa na ang utos ay dumating sa pamamagitan ng pahayag ni Yahweh, habang natural pa rin sa modernong Tagalog.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Huwag kang kumain ng tinapay
  rationale: Tuwirang katumbas ng pagbabawal; pinananatili ang konkretong ‘tinapay’ sa halip na palawakin ito bilang lahat ng pagkain.
- source_word: וְלֹא תִשְׁתֶּה שָׁם מָיִם
  choice: o uminom ng tubig doon
  rationale: Ang ‘o’ ay natural na nag-uugnay sa dalawang ipinagbabawal sa Tagalog, at pinananatili ang lokatibong ‘doon.’
- source_word: לֹא תָשׁוּב לָלֶכֶת בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: Huwag kang bumalik sa daang dinaanan mo
  rationale: Natural na Tagalog para sa Hebreong konstruksyong literal na ‘huwag kang bumalik upang lumakad sa daan na nilakaran mo’; malinaw na ipinagbabawal ang pagbabalik sa parehong ruta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan sa tetragrammaton bilang Yahweh, sa halip na gawing titulong ‘PANGINOON.’
theological_decisions:
- issue: Paraan ng pagdating ng utos
  choice: sa pamamagitan ng salita ni Yahweh
  alternative: ayon sa salita ni Yahweh
  rationale: Mas malapit ang ‘sa pamamagitan ng’ sa instrumental na בִּדְבַר at hindi nito pinapawi ang bahagyang kakaibang pag-uulit ng ‘salita’ sa Hebreo.
- issue: Saklaw ng pagbabawal sa tinapay
  choice: tinapay
  alternative: pagkain
  rationale: Hindi pinalalawak ang לֶחֶם sa pangkalahatang pagkain, upang mapanatili ang mismong anyo ng utos sa tekstong pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Gumamit ng tuwirang utos na ‘Huwag kang…’ at pinanatili ang personal na pangalang Yahweh. Walang footnote dahil walang tekstuwal o leksikal na suliraning nangangailangan nito sa talata.
