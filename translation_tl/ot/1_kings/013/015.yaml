  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya sa kanya, “Sumama ka sa akin sa bahay ko at kumain ka ng tinapay.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pumunta ka kasama ko sa bahay at kumain ka ng tinapay.” Mas literal na “pumunta” ang pandiwang Hebreo, at ang “tinapay” ay maaari ring tumukoy sa pagkain o isang pagkain.'
    reason: Pinananatili ang mas literal na pandiwa at ipinapaliwanag ang mas malawak na gamit ng “tinapay,” nang hindi inaalis ang katumbas ng salitang Hebreo sa alternatibong salin.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi niya
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural na ipinapahayag ito ng “Pagkatapos” sa makabagong Tagalog.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Karaniwang katumbas ng pang-ukol na may panlaping ikatlong panauhang panlalaki; hindi na kailangang tukuyin muli ang tinutukoy ng panghalip.
- source_word: לֵךְ אִתִּי
  choice: Sumama ka sa akin
  rationale: Literal na “humayo ka kasama ko,” ngunit sa isang paanyaya, natural at tumpak sa Tagalog ang “sumama ka sa akin.”
- source_word: הַבָּיְתָה
  choice: sa bahay
  rationale: Ang hulaping paturol ng direksiyon ay nagpapahiwatig ng pagpunta sa bahay. Hindi idinagdag ang “ko” sapagkat hindi iyon tahasang nasa pangngalan, bagaman ipinahihiwatig ng konteksto.
- source_word: וֶאֱכֹל
  choice: at kumain
  rationale: Tuwirang pinananatili ang kasunod na pautos o paanyaya.
- source_word: לָחֶם
  choice: tinapay
  rationale: Ito ang pangunahing kahulugan ng salitang Hebreo. Maaari rin itong tumukoy nang mas malawak sa pagkain o isang kainan, kaya binanggit ang posibilidad na iyon sa talababa.
