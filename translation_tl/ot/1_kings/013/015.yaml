    issue: Malabo ang “Sumama ka sa akin sa bahay.”
    rationale: Maaari itong mangahulugang pagsama sa nagsasalita habang nasa bahay, sa halip na pagpunta sa kanyang tahanan. Ang Hebreong הַבָּיְתָה ay may malinaw na direksiyonal na diwa.
  - severity: medium
    issue: Inaalis ng alternatibong salin sa talababa ang “tinapay.”
    rationale: Ang alternatibo ay dapat manatiling kumpleto sa mahahalagang leksikal na nilalaman ng Hebreo; ang לָחֶם ay hindi dapat mawala.
  - severity: low
    issue: Hindi likas ang “isang kainan” bilang kahulugan ng לָחֶם sa kontekstong ito.
    rationale: Ang “isang pagkain” ang karaniwang modernong Tagalog para sa “a meal.”
