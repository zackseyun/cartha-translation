translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang teknikal ngunit hindi gaanong pamilyar na “siyahan,” habang pinanatili ang magkatugmang kilos sa utos at pagtupad.
