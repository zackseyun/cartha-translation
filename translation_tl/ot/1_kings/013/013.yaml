  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: tl
  text: At sinabi niya sa kanyang mga anak na lalaki, “Siyahan ninyo ang asno para sa akin.” Kaya siyinahan nila ang asno para sa kanya, at sumakay siya rito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng Hebrew wayyiqtol nang hindi dinaragdagan ng mas tiyak na ugnayang pamanahon.
- source_word: בָּנָיו
  choice: sa kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang anyong Hebreo; nililinaw ito sa Tagalog dahil maaaring tumukoy sa anak na lalaki o babae ang payak na “mga anak.”
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Ihanda ninyo ang asno para masakyan ko
  rationale: Sa kontekstong ito, ang חבש ay paghahanda o paglalagay ng siya sa hayop upang masakyan. Mas natural at madaling maunawaan sa modernong Tagalog ang “ihanda ... para masakyan” kaysa sa di-pamilyar na “siyahan.”
- source_word: הַחֲמוֹר
  choice: ang asno
  rationale: Ang “asno” ang malinaw, dignificado, at karaniwang salin ng חמור sa biblikal na Tagalog.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Kaya inihanda nila ang asno para sa kanya
  rationale: Inuulit ang pandiwang ginamit sa utos at ipinahahayag ng “kaya” ang natural na tugon sa naunang sinabi, nang hindi binabago ang pangyayari.
- source_word: וַיִּרְכַּב עָלָיו
  choice: at sinakyan niya iyon
  rationale: Likas na Tagalog para sa pagsakay sa hayop; ang “iyon” ay angkop na panghalip para sa asno sa kontekstong ito.
