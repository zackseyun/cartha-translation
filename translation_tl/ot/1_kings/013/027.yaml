  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa kanyang mga anak na lalaki, “Lagyan ninyo ng síya ang asno para sa akin.” Kaya nilagyan nila iyon ng síya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kaya siniyahan nila ang asno.”
    reason: Ipinapakita ang mas maikli at tahasang alternatibong pagsasalin ng pandiwang חבשׁ; walang tahasang layon sa huling sugnay sa Hebreo.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi niya
  rationale: Ang waw-consecutive ay nagpapasulong sa salaysay, kaya natural ang “Pagkatapos.” Bagaman mas literal na “nagsalita,” ang “sinabi” ang likas na panimula sa tuwirang pananalita sa modernong Tagalog.
- source_word: אֶל־בָּנָיו
  choice: sa kanyang mga anak na lalaki
  rationale: Ang בָּנִים ay panlalaking maramihan at sa kontekstong ito ay tumutukoy sa mga anak na lalaki; nililinaw ito nang hindi umaasa sa mas malawak na kahulugan ng “mga anak.”
- source_word: לֵאמֹר
  choice: —
  rationale: Hindi ito isinalin bilang hiwalay na “na sinasabi” dahil likas nang ipinakikilala ng “sinabi niya” ang tuwirang pananalita sa Tagalog.
- source_word: חִבְשׁוּ לִי
  choice: Lagyan ninyo ng síya ... para sa akin
  rationale: Ang חבשׁ kapag asno ang layon ay nangangahulugang lagyan ito ng síya. Pinananatili ng “para sa akin” ang diwa ng לִי, na ang paghahanda ay para sa paggamit niya.
- source_word: אֶת הַחֲמוֹר
  choice: ang asno
  rationale: Ang “asno” ang karaniwan at malinaw na salin ng חֲמוֹר sa dignified na modernong Tagalog.
- source_word: וַיַּחֲבֹשׁוּ
  choice: Kaya nilagyan nila iyon ng síya
  rationale: Pinananatili ang pag-uulit ng kilos na חבשׁ at ang maramihang simuno. Ang “iyon” ay natural na tumutukoy pabalik sa asno, bagaman walang tahasang layon sa Hebreo.
