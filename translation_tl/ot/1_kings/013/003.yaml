base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: tl
  text: 'Noong araw na iyon, nagbigay siya ng isang tanda[a] at sinabi, “Ito ang tanda na sinabi ni Yahweh: Narito, mabibiyak ang altar, at matatapon ang abo[b] na nasa ibabaw nito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kababalaghan” o “palatandaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy nang mas tiyak sa mamantikang abo o mga labi ng mga handog.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: nagbigay siya
  rationale: Pinananatili ang karaniwang diwa ng נתן at ang idyomang pagbigay ng isang tanda bilang pagpapatunay sa pahayag.
- source_word: מוֹפֵת
  choice: tanda
  rationale: Sa konteksto, ito ay tanda na magpapatunay sa propetikong salita; hindi nito labis na idinidiin ang himalang katangian ng pangyayari.
- source_word: דִּבֶּר יְהוָה
  choice: sinabi ni Yahweh
  rationale: Likas na salin sa Filipino ng natapos nang pagsasalita na ang tanda ay malapit nang magpatunay.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang mariin at propetikong pagtawag-pansin ng Hebreo.
- source_word: נִקְרָע
  choice: mabibiyak
  rationale: Ang pasibong anyo at propetikong konteksto ay hinihingi ang panghinaharap; ang “mabibiyak” ay natural at malinaw para sa paghahati o pagkapunit ng altar.
- source_word: וְנִשְׁפַּךְ
  choice: matatapon
  rationale: Natural na inilalarawan ang abong mahuhulog at kakalat mula sa nabiyak na altar, habang pinananatili ang pasibong panghinaharap.
- source_word: הַדֶּשֶׁן
  choice: abo
  rationale: Ito ang pinakamalinaw na karaniwang salin, samantalang inilalagay sa talababa ang mas tiyak na kahulugang panghandog.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa ibabaw nito
  rationale: Malinaw na tumutukoy sa abong nakapatong sa altar.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang pinananatili ang personal na banal na pangalan sa teksto sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” na karaniwan at madaling maunawaang terminong panrelihiyon. Pinanatili ang “Narito” upang ihatid ang mariing propetikong himig nang hindi nagiging lipas ang kabuuang pangungusap.
