  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: tl
  text: Ngunit sinabi ng tao ng Diyos sa hari, “Kung ibibigay mo man sa akin ang kalahati ng iyong bahay[a], hindi ako sasama sa iyo, ni kakain ng tinapay o iinom ng tubig sa lugar na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kalahati ng iyong bahay.” Ang “bahay” ay maaaring tumukoy rin sa sambahayan o ari-arian; maaaring ipinahihiwatig ng parirala ang isang napakalaking gantimpala o ari-arian, ngunit pinananatili sa salin ang literal na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Bagaman literal na ‘tao ng Diyos,’ ang ‘lingkod ng Diyos’ ay likas at marangal sa modernong Filipino at malinaw na tumutukoy sa isang sugo ng Diyos nang hindi tahasang pinapalitan ng mas interpretibong ‘propeta.’
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Kahit ibigay mo sa akin ang kalahati ng iyong sambahayan
  rationale: Ang אִם sa ganitong mariing pagtanggi ay natural na naipapahayag sa Filipino bilang ‘kahit.’ Pinananatili ng ‘kalahati’ ang pagmamalabis ng Hebreo.
- source_word: בֵיתֶךָ
  choice: iyong sambahayan
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay, sambahayan, o ari-arian. Sa alok ng hari, mas malawak kaysa gusali lamang ang pahiwatig; pinananatili ng ‘sambahayan’ ang leksikal na larawan at kalabuan, na ipinaliliwanag sa talababa.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: hindi ako sasama sa iyo
  rationale: Ang literal na ‘hindi ako paroroon kasama mo’ ay hindi gaanong likas. Ang ‘sasama sa iyo’ ang natural na katumbas sa konteksto ng paanyaya.
- source_word: לֹא אֹכַל לֶחֶם
  choice: ni kakain ng tinapay
  rationale: Pinananatili ang literal na ‘tinapay,’ na maaari ring kumatawan sa pagkain o isang kainan.
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: o iinom ng tubig
  rationale: Tuwirang salin na maayos na ikinakabit sa naunang negatibong sugnay.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Malapit at natural na salin na nagpapanatili sa demonstratibong diin ng Hebreo.
