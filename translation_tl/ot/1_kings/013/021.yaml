  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: tl
  text: 'At sumigaw siya sa tao ng Diyos na dumating mula sa Juda, “Ganito ang sabi ni Yahweh: Dahil naghimagsik ka laban sa salita[a] ni Yahweh at hindi mo sinunod ang utos na iniutos sa iyo ni Yahweh na iyong Diyos,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bibig ni Yahweh,” isang idyoma para sa sinabi ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל
  choice: malakas niyang sinabi sa
  rationale: Ang קרא אל ay pagtawag o pagsasalita sa isang tao. Sa konteksto ng mariing pahayag ng propeta, ipinahihiwatig ng “malakas” ang lakas ng pagpapahayag nang hindi ginagawang di-likas sa Tagalog ang pananalita.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili ang karaniwang titulong Hebreo sa halip na ipakahulugang “propeta,” na mas interpretatibo.
- source_word: מִיהוּדָה
  choice: mula sa Juda
  rationale: Likas at tuwirang pagpapahayag ng pinanggalingang lugar.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Natural na modernong Tagalog para sa pormulang ginagamit sa paghahatid ng mensahe ng Diyos, habang pinananatili ang pangalang Yahweh.
- source_word: יַעַן כִּי
  choice: Dahil
  rationale: Tuwirang ipinakikilala ang dahilan ng hatol na nagpapatuloy sa kasunod na talata.
- source_word: מָרִיתָ
  choice: naghimagsik ka
  rationale: Mas matindi ang מרה kaysa simpleng hindi pagsunod; ipinahahayag nito ang pagsalungat o pagrerebelde sa sinabi ng Diyos.
- source_word: פִּי יְהוָה
  choice: salita ni Yahweh
  rationale: Literal na “bibig ni Yahweh,” ngunit isang idyoma para sa sinabi o ipinahayag ni Yahweh. Ang “salita” ang malinaw at natural na katumbas sa Tagalog.
- source_word: וְלֹא שָׁמַרְתָּ
  choice: at hindi mo sinunod
  rationale: Kapag utos ang layon, ang שׁמר ay nangangahulugang tuparin o sundin; mas natural dito ang “sinunod” kaysa literal na “iningatan.”
- source_word: הַמִּצְוָה
  choice: ang utos
  rationale: Pinananatili ang isahang bilang at gumagamit ng karaniwang salitang madaling maunawaan.
- source_word: אֲשֶׁר צִוְּךָ
  choice: na iniutos sa iyo
  rationale: Tuwirang inililipat ang pandiwang צוה at ang taong pinag-utusan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Natural na Tagalog para sa pormulang tipan at pinananatili ang personal na pangalang Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyong nagpapanatili rito sa halip na palitan ng isang titulo.
- issue: Lakas ng מָרִיתָ
  choice: naghimagsik ka
  alternative: sumuway ka; hindi ka sumunod
  rationale: Pinananatili ng “naghimagsik” ang bigat ng sadyang pagsalungat sa pahayag ng Diyos nang hindi nagdaragdag ng paliwanag na doktrinal.
- issue: Idyomang פִּי יְהוָה
  choice: salita ni Yahweh
  alternative: bibig ni Yahweh; utos ni Yahweh
  rationale: Ang literal na “bibig” ay maaaring maging malabo sa Tagalog, samantalang ang “utos” ay maaaring labis na paliitin ang saklaw. Pinananatili ng “salita” ang sanggunian sa mismong ipinahayag ni Yahweh.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang titulong “tao ng Diyos” at ang pangalang “Yahweh.” Hindi tinapos ang pangungusap sapagkat nagpapatuloy sa kasunod na talata ang pahayag ng hatol.
