  source_fidelity: 'Ang “malakas niyang sinabi” ay nauunawaan, ngunit masyadong pinahihina at ipinapakahulugan nito ang וַיִּקְרָא, na sa kontekstong ito ay mas tumpak na “sumigaw” o “malakas na tumawag.” Tapat ang natitirang pagsasalin sa Hebreo: napananatili ang “tao ng Diyos,” ang Juda, ang bigat ng “naghimagsik,” ang idyomang “salita ni Yahweh,” at ang isahang “utos.”'
  naturalness: 'Natural at marangal ang karamihan ng Filipino. Gayunman, hindi kailangan ang panloob na pambukas na panipi pagkatapos ng “Ganito ang sinabi ni Yahweh:” sapagkat iisang tuwirang pahayag lamang ito. Mas likas ang “Ganito ang sabi ni Yahweh: Dahil …” sa loob ng iisang panipi.'
  terminology: Ang “Yahweh,” “tao ng Diyos,” “salita,” at “utos” ay pare-pareho, malinaw, at angkop sa modernong Filipino Tagalog. Ang talababa ay wastong nagpapaliwanag ng literal na “bibig ni Yahweh” nang hindi ipinipilit ang isang mas makitid na kahulugan.
