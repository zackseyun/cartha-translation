  to: 'At sumigaw siya sa tao ng Diyos na dumating mula sa Juda, “Ganito ang sabi ni Yahweh: Dahil naghimagsik ka laban sa salita[a] ni Yahweh at hindi mo sinunod ang utos na iniutos sa iyo ni Yahweh na iyong Diyos,”'
