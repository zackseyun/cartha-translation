language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: tl
  text: At nabiyak ang altar, at tumapon mula sa altar ang mga abo, alinsunod sa tandang[a] ibinigay ng tao ng Diyos sa pamamagitan ng salita ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “tanda” ay maaari ring mangahulugang “kababalaghan” o “palatandaang naghuhudyat ng isang pangyayari.” Maaari ring isalin ang parirala na “bilang tanda.”
    reason: Pinananatili ang saklaw ng kahulugan ng מוֹפֵת at ang posibleng pagbasa sa כַּמּוֹפֵת.
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ang “altar” ang karaniwan, malinaw, at likas na salin sa makabagong Tagalog para sa kultikong מִזְבֵּחַ.
- source_word: נִקְרָע
  choice: nabiyak
  rationale: Ipinahihiwatig ng קרע ang pagkapunit o pagkahati. Sa isang altar, mas natural ang “nabiyak” at malinaw nitong inilalarawan ang pisikal na pagkakahati.
- source_word: וַיִּשָּׁפֵךְ
  choice: tumapon
  rationale: Ang שׁפך ay nangangahulugang ibuhos o matapon. Dahil kusang lumabas ang mga abo nang mabiyak ang altar, natural sa Tagalog ang “tumapon.”
- source_word: הַדֶּשֶׁן
  choice: ang mga abo
  rationale: Sa konteksto ng altar, tumutukoy ang דֶּשֶׁן sa abo o malangis na latak ng handog. Ang “mga abo” ang pinakamalinaw na di-teknikal na salin.
- source_word: מִן הַמִּזְבֵּחַ
  choice: mula sa altar
  rationale: Tuwirang ipinapahayag nito ang pinagmulan o lugar na pinanggalingan ng mga abo.
- source_word: כַּמּוֹפֵת
  choice: ayon sa tanda
  rationale: Maaaring mangahulugan ang מוֹפֵת ng tanda, kababalaghan, o pangitain/portento, at ang כְּ ay nagpapahiwatig ng pagtutugma sa naunang ipinahayag. Pinananatili ng “ayon sa tanda” ang ugnayang iyon nang hindi labis na nililinaw.
- source_word: אֲשֶׁר נָתַן
  choice: na ibinigay
  rationale: Pinananatili nito ang karaniwang kahulugan ng נתן at likas itong katambal ng “tanda” sa Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay naiintindihan ngunit hindi gaanong likas bilang titulong biblikal sa modernong Tagalog. Ipinahahayag ng “lingkod ng Diyos” ang kinikilalang banal na pagtatalaga nang hindi tahasang pinapalitan ito ng “propeta.”
- source_word: בִּדְבַר יְהוָה
  choice: sa pamamagitan ng salita ni Yahweh
  rationale: Pinananatili ang pormulang “salita ni Yahweh” at ang instrumental na puwersa ng בְּ, nang hindi ito pinakikitid sa “utos” lamang.
theological_decisions:
- issue: Paglalathala sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito ginagawang titulo.
- issue: Pagkakakilanlan ng אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos / propeta ng Diyos
  rationale: Iniiwasan ang pagkitid sa tungkuling “propeta,” na hindi tahasang nasa parirala, habang gumagamit ng natural at marangal na titulong Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Ginamit ang “nabiyak” at “tumapon” para sa natural na paglalarawan ng pangyayari, habang pinanatili ang pormulang “salita ni Yahweh.”
