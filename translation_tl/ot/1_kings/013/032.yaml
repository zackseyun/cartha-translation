  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: tl
  text: Sapagkat tiyak na matutupad ang salitang ipinahayag niya sa salita ni Yahweh laban sa altar na nasa Bethel, at laban sa lahat ng mga dambana sa matataas na lugar na nasa mga lungsod ng Samaria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng mga bahay ng matataas na lugar.” Ang tinutukoy ay mga gusali o dambanang panrelihiyon sa mga naturang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang kahilingan tungkol sa paglilibing; likas sa Tagalog ang “Sapagkat” sa ganitong paliwanag.
- source_word: הָיֹה יִהְיֶה
  choice: tiyak na matutupad
  rationale: Ang infinitive absolute kasama ng imperfect ng היה ay nagbibigay-diin sa katiyakan; malinaw at natural itong naihahayag ng “tiyak na matutupad.”
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Sa kontekstong propetiko, tumutukoy ito sa ipinahayag na mensahe o pahayag, hindi lamang sa isang pangyayari o bagay.
- source_word: אֲשֶׁר קָרָא
  choice: na ipinahayag niya
  rationale: Tinutukoy ng קרא ang hayagang pagbigkas ng propeta. Ang “ipinahayag” ay marangal at natural, bagaman hindi nito lubos na binibigyang-diin ang lakas ng pagsigaw.
- source_word: בִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Ipinahihiwatig ng parirala na ang pahayag ng propeta ay nakabatay sa kapahayagan o utos ni Yahweh; iniiwasan ng “ayon sa” ang alanganing literal na “sa pamamagitan ng salita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: עַל
  choice: laban sa
  rationale: Sa konteksto ng propetikong paghatol, ang altar at mga dambana ang pinatutungkulan ng mariing pagtuligsa.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Tuwirang tumutukoy sa altar ni Jeroboam sa Bethel.
- source_word: בְּבֵית אֵל
  choice: na nasa Bethel
  rationale: Natural na Tagalog para sa lokasyon ng altar; pinananatili ang pangalang Bethel.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: lahat ng mga dambana sa matataas na lugar
  rationale: Ang literal na “mga bahay ng matataas na lugar” ay hindi natural at maaaring malabo sa Tagalog. Ipinahahayag ng “mga dambana” ang mga gusali o santuwaryong panrelihiyon habang pinananatili ang hiwalay na konsepto ng “matataas na lugar.”
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: na nasa mga lungsod ng Samaria
  rationale: Tuwirang isinasalin ang construct chain at hindi pinapawi ang historikal na tensiyon sa pagbanggit sa Samaria.
theological_decisions:
- issue: Paglalarawan sa katiyakan ng propesiya sa הָיֹה יִהְיֶה
  choice: tiyak na matutupad
  alternative: talagang mangyayari
  rationale: Pinananatili nito ang mariing katiyakan ng Hebreong konstruksyon nang hindi nagdaragdag ng paliwanag na teolohikal.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay gumagamit ng personal na banal na pangalan; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng בָּתֵּי הַבָּמוֹת
  choice: mga dambana sa matataas na lugar
  alternative: mga bahay ng matataas na lugar
  rationale: Ang “mga dambana” ay isang kontekstuwal ngunit hindi sektaryong paglalarawan sa mga gusaling panrelihiyon. Itinatala sa talababa ang literal na anyo upang mapanatili ang leksikal na tensiyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “matutupad” para sa propetikong salita, “ipinahayag” para sa pampublikong pagbigkas, at “mga dambana sa matataas na lugar” upang maging malinaw ang kultikong kahulugan nang hindi binubura ang literal na anyo, na inilagay sa talababa.
