base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: tl
  text: At narito, may mga lalaking nagdaraan at nakita nila ang bangkay na itinapon sa daan at ang leon na nakatayo sa tabi ng bangkay. Dumating sila at ibinalita nila ito sa lungsod kung saan nakatira ang matandang propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsalita sila tungkol dito sa lungsod.” Ang pandiwang Hebreo ay payak na “nagsalita,” ngunit sa konteksto ay tumutukoy ito sa pagbabalita ng pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panandang pansalaysay na tumatawag ng pansin at nagpapatingkad sa biglang paglitaw ng tagpo.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: may mga lalaking nagdaraan
  rationale: Ang אֲנָשִׁים ay panlalaking maramihan, at ipinahihiwatig ng participle na עֹבְרִים ang nagpapatuloy na kilos.
- source_word: וַיִּרְאוּ
  choice: Nakita nila
  rationale: Payak at natural na salin ng pandiwang nagsasaad ng sumunod na pangyayari sa salaysay.
- source_word: הַנְּבֵלָה
  choice: ang bangkay
  rationale: Tumutukoy ito rito sa bangkay ng isang tao; malinaw at karaniwan ang salitang Filipino.
- source_word: מֻשְׁלֶכֶת
  choice: na itinapon
  rationale: Pinananatili ang diwang pasibo ng ugat na שלך at ang mas malakas na kahulugan kaysa sa simpleng 'nakahandusay.'
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Ang kongkretong lokasyon sa daan ang hinihingi ng tagpo.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: ang leon na nakatayo sa tabi ng bangkay
  rationale: Likas at malinaw na inilalarawan ang posisyon ng leon ayon sa עֹמֵד at אֵצֶל.
- source_word: וַיָּבֹאוּ
  choice: Pumunta sila
  rationale: Sa Filipino, mas natural ang 'pumunta' para sa pagdating nila sa lungsod, bagaman literal na maaaring 'dumating.'
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: ibinalita roon ang nakita nila
  rationale: Sa konteksto, ang simpleng 'nagsalita' ay paghahatid ng balita tungkol sa nasaksihan nila; ginawang tahasan ang ipinahihiwatig na paksa para sa likas na Filipino.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: sa lungsod na tinitirhan ng matandang propeta
  rationale: Ang יֹשֵׁב בָּהּ ay tumutukoy sa paninirahan; pinananatili rin ang paglalarawang 'matandang propeta.'
