base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: tl
  text: Kaya sinundan niya ang tao ng Diyos at natagpuan niya itong nakaupo sa ilalim ng punong terebinto.[a] Tinanong niya ito, “Ikaw ba ang tao ng Diyos na nagmula sa Juda?” Sumagot ang tao ng Diyos, “Ako nga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “punong ensina.” Ang Hebreong אֵלָה ay mas tiyak na tumutukoy sa punong terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: sinundan niya
  rationale: Likas na ipinapahayag sa Tagalog ang paghabol o pagsunod sa isang tao sa salaysay, nang hindi dinaragdagan ang diwa ng marahas na pagtugis.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Sa modernong Tagalog, ang literal na “tao ng Diyos” ay maaaring mangahulugang isang maka-Diyos na tao sa pangkalahatan. Ang “lingkod ng Diyos” ay mas malinaw bilang kinikilalang katawagan sa tauhan, ngunit hindi ito pinakikitid sa tiyak na katungkulang “propeta.”
- source_word: וַיִּמְצָאֵהוּ יֹשֵׁב
  choice: natagpuan niya itong nakaupo
  rationale: Tuwirang pinananatili ang kilos ng pagkakatagpo at ang postura ng lalaki nang matagpuan siya.
- source_word: תַּחַת הָאֵלָה
  choice: sa ilalim ng punong terebinto
  rationale: Ang אֵלָה ay higit na tiyak na tumutukoy sa terebinto; idinagdag ang “punong” upang maging malinaw at natural sa karaniwang mambabasang Tagalog.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: na nagmula sa Juda
  rationale: Natural na ipinahahayag ang pinanggalingang lugar nang hindi binabago ang pagkakakilanlang tanong.
- source_word: אָנִי
  choice: Ako nga
  rationale: Natural na maikling tugon sa Tagalog sa tanong na humihingi ng pagkilala; ipinahihiwatig nito ang eliptikong “Ako [iyon].”
theological_decisions:
- issue: Katawagan sa אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos; propeta ng Diyos
  rationale: Iniiwasan ng “lingkod ng Diyos” ang posibleng maling pagkaunawa sa literal na “tao ng Diyos” bilang pangkalahatang paglalarawan lamang, habang hindi rin idinaragdag ang mas makitid na katungkulang “propeta.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa payak na salaysay. Ginamit ang “ito” sa kasunod na mga pangungusap upang maiwasan ang kalituhan sa dalawang lalaking tinutukoy.
