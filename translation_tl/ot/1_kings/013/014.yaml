  naturalness: Malinaw at likas ang salaysay sa modernong Filipino Tagalog. Ang paggamit ng “ang tao ng Diyos” ay nananatiling natural bilang isang nakapirming katawagang biblikal; ang tahasang pagtukoy sa sumagot ay nagpapalinaw rin sa dalawang lalaking nasa tagpo.
  terminology: Pinalitan ang “lingkod ng Diyos” ng “tao ng Diyos” upang mapanatili ang pamantayan at direktang katawagan ng Hebreo nang hindi ito ipinapakahulugang “propeta” o ibang tiyak na tungkulin. Napanatili ang “Juda” at “punong terebinto.”
