  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: tl
  text: 'At sumigaw siya laban sa altar sa pamamagitan ng salita ni Yahweh[a] at sinabi, “Altar, altar! Ganito ang sinabi ni Yahweh: ‘Narito, isang anak na lalaki ang isisilang sa angkan ni David, at Josias ang kanyang pangalan. Kakatayin niya sa ibabaw mo ang mga pari ng matataas na lugar ng pagsamba na nagsusunog ng insenso sa ibabaw mo[b], at susunugin sa ibabaw mo ang mga buto ng tao.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa salita ni Yahweh” o “sa utos ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo para sa “kakatayin” ay may diwang pansakripisyo; maaari ring isalin na “ihahain niyang handog.” Ang “nagsusunog ng insenso” ay maaari ring tumukoy nang mas malawak sa pagpapausok ng handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: sumigaw siya laban sa altar
  rationale: Pinananatili ng “sumigaw” ang lakas ng makahulang pagpapahayag, at ng “laban sa” ang salungat na diwa ng עַל sa kontekstong ito.
- source_word: בִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Likas ito sa modernong Tagalog at nagpapahayag na ang propesiya ay binigkas sa bisa at kapahintulutan ng salita ni Yahweh; maaari ring unawain bilang “sa pamamagitan ng salita ni Yahweh.”
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Altar, altar!
  rationale: Napananatili ang pag-uulit, tuwirang pagtawag, at maringal na diin ng pahayag.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Malinaw at likas na katumbas ng pormulang ginagamit ng isang sugo ng Diyos.
- source_word: הִנֵּה
  choice: Masdan mo
  rationale: Itinatampok nito ang taimtim at nakapupukaw-pansing pagpapahayag ng propesiya.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: isang anak na lalaki ang isisilang sa sambahayan ni David
  rationale: Ang participle ay may hinaharap na saysay sa makahulang pahayag; ang “sambahayan” ay tumutukoy sa dinastiya o angkan ni David.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: Josias ang kanyang pangalan
  rationale: Likas na Tagalog na nagpapanatili sa tiyak na pagpapangalan. Ginamit ang nakaugaliang anyong Tagalog na “Josias.”
- source_word: וְזָבַח עָלֶיךָ
  choice: Ihahain niya sa ibabaw mo
  rationale: Pinananatili ng “ihahain” ang sakripisyal na himig at ang sinasadyang kabalintunaan ng paglapastangan sa altar; posible rin ang mas tuwirang “kakatayin.”
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: mga pari ng matataas na sambahan
  rationale: Ipinahihiwatig nito ang mga lokal na kultikong pook na tinatawag na “high places,” hindi lamang mga lugar na mataas ang lokasyon.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: na nagsusunog ng handog sa ibabaw mo
  rationale: Masaklaw nitong pinananatili ang Hiphil ng קטר, na maaaring tumukoy sa pagpapailanlang ng usok mula sa insenso o ibang handog, nang hindi nililimitahan sa insenso lamang.
- source_word: וְעַצְמוֹת אָדָם
  choice: mga buto ng tao
  rationale: Ang אָדָם ay pangkalahatan dito at tumutukoy sa tao, hindi sa isang tiyak na lalaki.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng kultikong pandiwang זבח
  choice: ihahain
  alternative: kakatayin
  rationale: Ang “ihahain” ay nagpapanatili sa sakripisyal na himig at sa matinding kabalintunaang ang mga pari mismo ang gagawing handog sa altar, habang kinikilala sa talababa ang posibleng diin sa pagkatay.
- issue: Kahulugan ng קטר sa pariralang הַמַּקְטִרִים עָלֶיךָ
  choice: nagsusunog ng handog
  alternative: nagsusunog ng insenso
  rationale: Maaaring tumukoy ang pandiwa sa pagpapausok ng insenso o ng ibang handog. Ang masaklaw na salin ay nag-iingat sa tunay na leksikal na lawak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang makapangyarihang pag-uulit na “Altar, altar,” ang personipikasyon ng altar, at ang sakripisyal na kabalintunaan. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
