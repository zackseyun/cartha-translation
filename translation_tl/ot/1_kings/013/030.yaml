translation:
  language: tl
  text: 'Inilagay niya ang bangkay ng taong iyon sa sarili niyang libingan, at ipinagdalamhati nila ito: “Ay[a], kapatid ko!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaawa-awa!” Isang bulalas ng dalamhati ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatid ko” ay malamang na pormula ng panaghoy na nagpapahayag ng pagkakaugnay o pakikiisa, hindi kinakailangang tunay na magkapatid sila.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: Inilagay
  rationale: Ang Hiphil ng נוח ay nangangahulugang maglagay o maglapag. Natural ang “inilagay” sa konteksto ng paglilibing.
- source_word: נִבְלָתוֹ
  choice: ang bangkay nito
  rationale: Tumutukoy ang נְבֵלָה sa patay na katawan. Pinananatili ng “bangkay” ang tahasang diwa ng salita; nililinaw ng “nito” na katawan ito ng taong namatay, hindi ng gumagawa ng paglilibing.
- source_word: בְּקִבְרוֹ
  choice: sa sarili niyang libingan
  rationale: Maaaring mangahulugan ang קֶבֶר na libingan o puntod. Ipinahihiwatig ng hulaping paari sa konteksto na sariling libingan ng matandang propeta ang pinaghimlayan.
- source_word: וַיִּסְפְּדוּ
  choice: ipinagdalamhati nila
  rationale: Ang ספד ay pagluluksa o pagbigkas ng panaghoy para sa namatay. Ang “ipinagdalamhati” ay malinaw, marangal, at angkop sa ritwal o hayagang pagluluksa.
- source_word: עָלָיו
  choice: ito
  rationale: Kasama ng ספד, ipinahihiwatig ng עַל ang taong pinagluluksa. Natural sa Filipino ang “ipinagdalamhati nila ito.”
- source_word: הוֹי
  choice: Ay
  rationale: Ang הוֹי ay bulalas ng dalamhati. Naghahatid ang “Ay” ng pagdadalamhati nang hindi ipinapasok ang diwa ng paghatol na maaaring idulot ng ibang salin.
- source_word: אָחִי
  choice: kapatid ko
  rationale: Literal na “kapatid ko” ang אָחִי at maaari rin itong maging pormula ng pakikiisa at pagmamahal sa panaghoy.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bangkay” upang mapanatili ang tahasang diwa ng Hebreo, at “libingan” bilang natural na katawagan sa pinaglibingan. Hinati sa dalawang pangungusap ang kilos at ang siniping panaghoy para sa malinaw at natural na daloy.
