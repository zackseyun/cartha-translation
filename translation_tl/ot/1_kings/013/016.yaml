base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: tl
  text: Sinabi niya[a], “Hindi ako maaaring bumalik na kasama mo o sumama sa iyo. Hindi rin ako kakain ng tinapay o iinom ng tubig kasama mo sa lugar na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pambabae ang anyong “kasama mo” sa unang dalawang parirala, ngunit panlalaki ang anyo nito sa parirala tungkol sa pagkain at pag-inom. Hindi ipinakikita ng mga panghalip na “mo” at “iyo” sa Tagalog ang ganitong pagkakaiba ng kasarian.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang panandang pasalaysay na nagpapakilala ng tuwirang pananalita; natural sa modernong Tagalog nang hindi dinaragdagan ang ugnayang ipinahihiwatig ng וַ־.
- source_word: לֹא אוּכַל
  choice: Hindi ako maaaring
  rationale: Ipinahahayag ng anyong ito ng יכל na may pagtanggi ang kawalan ng kakayahan o pahintulot ayon sa itinakdang utos; pinananatili ng salin ang hindi tiyak na bahaging iyon.
- source_word: לָשׁוּב אִתָּךְ
  choice: bumalik na kasama mo
  rationale: Ang שׁוב ay ‘bumalik,’ at ang אִתָּךְ ay ‘kasama mo.’ Pinananatili rito ang ideya ng pagbabalik na kasama ang kausap.
- source_word: וְלָבוֹא אִתָּךְ
  choice: o sumama sa iyo
  rationale: Maaaring mangahulugan ang בוא ng ‘pumaroon,’ ‘pumarito,’ o ‘pumasok’ ayon sa pananaw. Sa paanyayang samahan ang kausap, likas sa Tagalog ang ‘sumama sa iyo’ at hindi nito ipinapalagay na tahasang binibigyang-diin ang pagpasok.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: Hindi rin ako kakain ng tinapay
  rationale: Pinanatili ang literal na ‘tinapay’ sa halip na gawing pangkalahatang ‘pagkain,’ sapagkat inuulit nito ang pormulasyon sa nakapaligid na salaysay.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: o iinom ng tubig
  rationale: Ang ‘o’ ay natural na nag-uugnay sa dalawang ipinagbabawal na gawain sa Tagalog, habang literal na pinananatili ang ‘tubig.’
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Tuwirang katumbas na lokatibong parirala na mas malapit sa anyo ng Hebreo kaysa sa payak na ‘rito.’
theological_decisions:
- issue: Saklaw ng pahayag na לֹא אוּכַל
  choice: Hindi ako maaaring
  alternative: Ayaw kong / Hindi ako puwede
  rationale: Hindi ginawang simpleng pagtanggi ng kalooban ang pahayag. Ang ‘maaaring’ ay nagpapanatili sa diwa ng kawalan ng kakayahan o pahintulot nang hindi tinutukoy kung alin ang tanging ibig sabihin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang mahabang pahayag upang maging likas basahin, ngunit pinanatili ang pagkakasunod at lohika ng Hebreo. Ang ‘kasama mo’ at ‘sumama sa iyo’ ay sadyang pinag-iba upang maiwasan ang alanganing pag-uulit habang pinananatili ang dalawang kilos na ‘bumalik’ at ‘pumaroon/sumama.’
