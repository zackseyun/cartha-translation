base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: tl
  text: At ang bagay na ito[a] ay naging kasalanan sa sambahayan ni Yarobam, upang pawiin at lipulin ang sambahayang iyon mula sa ibabaw ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangyayaring ito” o “usaping ito.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa isang bagay, pangyayari, o gawain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa ibabaw ng lupa,” isang idyomang tumutukoy sa lubos na pag-aalis mula sa lupain o daigdig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay naging
  rationale: Ipinahahayag ng anyo ng pandiwa ang naging resulta ng naunang pangyayari; mas angkop ang “naging” kaysa sa payak na “ay.”
- source_word: בַּדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר at maaari itong tumukoy sa buong pangyayari o gawain na naisalaysay, hindi lamang sa isang salitang binigkas.
- source_word: לְחַטַּאת
  choice: kasalanan
  rationale: Pinananatili nito ang tuwirang moral at teolohikal na bigat ng חַטָּאת nang hindi dinaragdagan ng paliwanag sa pangunahing teksto.
- source_word: בֵּית יָרָבְעָם
  choice: sambahayan ni Jeroboam
  rationale: Ang “sambahayan” ay likas na katumbas ng Hebreong idyoma at maaaring tumukoy kapwa sa pamilya at sa dinastiya.
- source_word: וּלְהַכְחִיד
  choice: mapawi
  rationale: Ipinahihiwatig ng causative na anyo ng כחד ang lubos na pagkawala; natural sa Filipino ang pasibong “mapawi” sa pangungusap na ito.
- source_word: וּלְהַשְׁמִיד
  choice: malipol
  rationale: Pinananatili ng “malipol” ang matinding diwa ng lubos na pagwasak at inilalayo ito sa naunang pandiwang “mapawi.”
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: mula sa ibabaw ng lupa
  rationale: Pinananatili nito ang maringal na larawang Hebreo habang malinaw pa rin sa makabagong mambabasang Filipino.
theological_decisions:
- issue: Ang tinutukoy na lilipulin ng mga huling pandiwa
  choice: Ang sambahayan ni Jeroboam ang ipinahiwatig na layon.
  alternative: Maaaring unawain na ang “bagay” o makasalanang gawain ang tinutukoy.
  rationale: Ang “sambahayan ni Jeroboam” ang pinakamalapit at pinakanaaangkop na ipinahiwatig na layon ayon sa balangkas ng pangungusap at sa konteksto ng hatol sa dinastiya. Inulit ang “sambahayan” upang alisin ang di-likas na kalabuan ng panghalip sa Filipino.
- issue: Ugnayan ng לְ sa pagkapawi at pagkalipol
  choice: 'Isinalin bilang kinalabasan: “hanggang sa.”'
  alternative: 'Maaaring isalin bilang layunin: “upang.”'
  rationale: Sa konteksto, inilalarawan ng mga infinitive ang sukdulang bunga ng kasalanan para sa sambahayan, ngunit hindi ipinapasok sa salin kung sino ang tahasang gumagawa ng paglipol.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sambahayan” upang mapanatili ang Hebreong larawang maaaring tumukoy sa pamilya o dinastiya. Pinanatili ang idyomang “mula sa ibabaw ng lupa,” na ipinaliliwanag sa talababa.
