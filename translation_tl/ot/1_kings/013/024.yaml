base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: tl
  text: Umalis siya, at isang leon ang nakatagpo sa kanya sa daan at pumatay sa kanya. Ang kanyang bangkay[a] ay naihagis sa daan; nakatayo ang asno sa tabi nito, at nakatayo ang leon sa tabi ng bangkay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang patay na katawan ay nakahandusay sa daan.” Binibigyang-diin ng passive participle sa Hebreo na ang katawan ay naihagis o naibagsak doon, hindi lamang basta nakahiga sa daan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Umalis siya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang “umalis siya” ay likas sa Filipino at akma sa pagpapatuloy ng paglalakbay sa konteksto.
- source_word: וַיִּמְצָאֵהוּ
  choice: nakatagpo sa kanya
  rationale: Karaniwang nangangahulugang “natagpuan” ang מצא, ngunit ang “nakatagpo sa kanya” ay mas likas para sa biglaang pagsalubong ng isang leon nang hindi dinaragdagan ang diwa.
- source_word: אַרְיֵה
  choice: isang leon
  rationale: Unang banggit ito sa leon at walang tiyak na pantukoy sa Hebreo, kaya ang “isang leon” ang natural na di-tiyak na anyo.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Tuwirang katumbas sa konteksto ng paglalakbay at pinananatili ang pag-uulit ng salita sa talata.
- source_word: וַיְמִיתֵהוּ
  choice: pumatay sa kanya
  rationale: Ang hiphil ng מות ay nagsasaad ng pagsanhi ng kamatayan; malinaw at karaniwan ang “pumatay sa kanya.”
- source_word: נִבְלָתוֹ
  choice: ang kanyang bangkay
  rationale: Ang נבלה ay bangkay o patay na katawan. Dignified at malinaw sa modernong Filipino ang “bangkay.”
- source_word: מֻשְׁלֶכֶת
  choice: nakatapon
  rationale: Ipinahihiwatig ng passive participle ang kalagayang bunga ng pagkakatapon o pagkakahagis. Pinananatili ng “nakatapon” ang resultang kalagayan, bagaman ipinaliliwanag sa talababa ang mas literal na puwersa.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: nakatayo sa tabi nito ang asno
  rationale: Ang participle na עֹמֵד ay naglalarawan ng nagpapatuloy na ayos ng tagpo; tumutukoy ang hulaping pambabae sa bangkay.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: nakatayo rin sa tabi ng bangkay ang leon
  rationale: Muling inilalarawan ng participle ang nakapirming tagpo. Inuulit ang “bangkay” gaya ng tahasang pag-uulit ng pangngalan sa Hebreo; ipinakikita ng “rin” ang magkatulad na pagkakatayo ng dalawang hayop.
