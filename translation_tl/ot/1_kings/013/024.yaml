translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang ayos na panaguri bago paksa sa paglalarawan ng bangkay at dalawang hayop upang maging natural ang daloy at mapanatili ang dramatikong larawan ng Hebreo.
