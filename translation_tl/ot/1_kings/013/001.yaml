id: 1KI.13.1
reference: 1 Kings 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: tl
  text: At narito, isang tao ng Diyos ang dumating mula sa Juda patungong Bethel ayon sa salita ni Yahweh[a], habang nakatayo si Jeroboam sa tabi ng altar[b] upang magsunog ng insenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa salita ni Yahweh” o “sa utos ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at nakatayo si Jeroboam sa altar.” Ang pang-ugnay sa Hebreo ay maaaring mangahulugang payak na “at,” at ang pariralang tumutukoy sa altar ay maaari ring isaling “sa altar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panandang pasalaysay at ang puwersang tumatawag ng pansin ng הִנֵּה, sa isang marangal ngunit nauunawaang anyo sa modernong Tagalog.
- source_word: אִישׁ אֱלֹהִים
  choice: isang tao ng Diyos
  rationale: Pinananatili ang mismong katawagang Hebreo sa halip na ipakahulugang agad na “propeta,” sapagkat mahalaga sa salaysay ang titulong “tao ng Diyos.”
- source_word: בָּא מִיהוּדָה
  choice: dumating mula sa Juda
  rationale: Likas na salin ng kilos at pinanggalingang heograpiko.
- source_word: בִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Ipinahahayag na ang pagdating niya ay alinsunod sa salita o atas ni Yahweh, nang hindi lubusang nililimitahan ang דָּבָר sa kahulugang “utos” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: אֶל בֵּית אֵל
  choice: patungong Bethel
  rationale: Ang “patungong” ay likas na nagpapahayag ng destinasyon; “Bethel” ang karaniwang anyo ng pangalan ng lugar.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: habang nakatayo si Jeroboam
  rationale: Inilalarawan ng participle ang nagpapatuloy at kasabay na kalagayan; ang “habang” ay natural na nag-uugnay nito sa pagdating ng tao ng Diyos.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa tabi ng altar
  rationale: Sa kontekstong ritwal at kasama ng pandiwang “nakatayo,” tumutukoy ito sa puwesto sa tabi o harap ng altar, hindi kinakailangang sa ibabaw nito.
- source_word: לְהַקְטִיר
  choice: upang magsunog ng insenso
  rationale: Sa kontekstong pangkulto, ang pandiwa ay tumutukoy sa pagsusunog upang magpausok; ang insenso ang malamang at tradisyonal na kahulugan dito.
theological_decisions:
- issue: Paglalarawan sa אִישׁ אֱלֹהִים
  choice: tao ng Diyos
  alternative: propeta
  rationale: Hindi tahasang gumagamit ang talata ng salitang Hebreo para sa “propeta.” Pinananatili ng salin ang natatanging titulo nang hindi ipinapasok ang interpretasyon sa pangunahing teksto.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang nasa Hebreo ang personal na pangalang YHWH; ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Ugnayan ng וְיָרָבְעָם sa naunang sugnay
  choice: habang nakatayo si Jeroboam
  alternative: at nakatayo si Jeroboam
  rationale: Ang “habang” ay kumakatawan sa malamang na kasabay na pangyayari, ngunit hindi ito ipinapalagay na tanging posibleng ugnayan; inilalagay sa talababa ang payak na “at.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang bahagyang mataas na estilong “At narito” at ang katawagang “tao ng Diyos” dahil kapwa mahalaga ang kanilang anyong pampanitikan at tekstuwal. Ginamit ang “altar” at “insenso,” na karaniwan at madaling maunawaan sa kasalukuyang gamit.
