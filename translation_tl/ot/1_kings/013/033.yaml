source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: tl
  text: Pagkatapos ng pangyayaring ito, hindi tumalikod si Jeroboam sa masama niyang landas. Muli siyang nagtalaga mula sa buong bayan ng mga pari para sa mga sambahan sa matataas na lugar. Ang sinumang magnais ay itinatalaga niya[a] at nagiging isa sa mga pari ng mga sambahan sa matataas na lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinupuno niya ang kamay nito,” isang Hebreong idyoma para sa pagtatalaga o paglalagay sa isang tao sa tungkuling makapari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: Pagkatapos ng pangyayaring ito
  rationale: Sa buod na ito ng salaysay, ang דָּבָר ay tumutukoy sa naganap na pangyayari; natural at malinaw ang “pangyayari” sa makabagong Tagalog.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: hindi tumalikod ... sa masama niyang landas
  rationale: Pinananatili ng “tumalikod” at “landas” ang konkretong metapora ng Hebreong שׁוּב at דֶּרֶךְ, nang hindi ito tahasang ginagawang teolohikal na terminong “magsisi.”
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: Sa halip, muli siyang nagtalaga
  rationale: Ang ikalawang שׁוּב ay nagpapahiwatig ng pagpapatuloy o pag-uulit ng ginawa. Ang “muli” ang natural na katumbas; ang “Sa halip” ay malinaw na naghahayag ng pagsalungat sa hindi niya pagtalikod.
- source_word: מִקְצוֹת הָעָם
  choice: mula sa buong bayan
  rationale: Mahirap at idyomatiko ang parirala. Sa konteksto, ipinahihiwatig nitong kumuha siya ng mga pari mula sa karaniwang mamamayan nang walang wastong pagtatangi, hindi lamang mula sa isang awtorisadong pangkat.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: mga pari para sa matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lokal na sambahang nasa mataas na lugar. Nililinaw ng “para sa” ang tungkulin ng mga pari at iniiwasang ipahiwatig na matataas ang mga pari mismo.
- source_word: הֶחָפֵץ
  choice: Ang sinumang magnais
  rationale: 'Ang may artikulong isahang participle ay pangkalahatan: sinumang nagnanais. Pinananatili nito ang diwa ng walang pagtatanging pagtanggap.'
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: itinatalaga niya
  rationale: Ang literal na “pinupuno niya ang kamay nito” ay isang Hebreong idyoma para sa paglalagay o pagtatalaga sa tungkuling makapari. Ang “itinatalaga” ay malinaw at hindi nakatali sa makabagong denominasyonal na gamit ng “ordinahan.”
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: nagiging isa sa mga pari ng matataas na sambahan
  rationale: Bagaman isahan ang pandiwa at maramihan ang panaguri sa Hebreo, ang diwa ay pagpasok ng tao sa pangkat ng mga paring iyon; natural itong ipinapahayag sa Tagalog bilang “isa sa mga pari.”
theological_decisions:
- issue: Kung isasalin ang שׁוּב bilang tahasang “magsisi”
  choice: hindi tumalikod sa masama niyang landas
  alternative: hindi nagsisi sa masama niyang landas
  rationale: May moral at panrelihiyong bigat ang konteksto, ngunit ang salitang Hebreo ay konkretong “bumalik/tumalikod.” Pinananatili ng salin ang metapora at hindi dinaragdagan ang teksto ng mas tiyak na terminong teolohikal.
- issue: Kung paano isasalin ang idyomang makapari na יְמַלֵּא אֶת יָדוֹ
  choice: itinatalaga niya
  alternative: pinupuno niya ang kamay nito; kinokonsagra niya; inoordinahan niya
  rationale: Tumutukoy ang idyoma sa paglalagay sa tungkuling makapari. Malinaw at malawak ang “itinatalaga,” samantalang inilalagay sa talababa ang literal na anyo upang mapanatili ang transparency.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Ginamit ang “matataas na sambahan” upang ipakita na ang בָּמוֹת ay mga pook-sambahan sa matataas na lugar, at hindi katangian ng mga pari. Pinanatili ang metapora ng masamang “landas” at iniwasan ang mga salitang maaaring magdala ng makitid na denominasyonal na kahulugan.
