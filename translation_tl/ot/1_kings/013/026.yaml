revisions:
- from: Nang mabalitaan iyon ng propetang nagpabalik sa kanya mula sa kanyang paglalakbay, sinabi niya, “Siya ang lingkod ng Diyos na sumuway sa utos ni Yahweh.[a] Kaya ibinigay siya ni Yahweh sa leon, at niluray at pinatay siya nito, ayon sa salitang sinabi ni Yahweh sa kanya.”
  to: Nang marinig ito ng propetang nagpabalik sa kanya mula sa daan, sinabi niya, “Siya ang tao ng Diyos na sumuway sa utos ni Yahweh.[a] Kaya ibinigay siya ni Yahweh sa leon, at niluray siya nito at pinatay, ayon sa salitang sinabi ni Yahweh sa kanya.”
  rationale: Pinalitan ang “lingkod ng Diyos” ng “tao ng Diyos” upang maipakita ang mismong katawagang Hebreo at ang pagkakapare-pareho nito sa salaysay. Bahagyang inayos din ang unang parirala sa “Nang marinig ito” at ang hulihan sa “niluray siya nito at pinatay” para sa mas malinaw at likas na daloy, nang walang pagbabago sa kahulugan.
