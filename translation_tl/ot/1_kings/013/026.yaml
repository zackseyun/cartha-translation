source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: tl
  text: Nang marinig ito ng propetang nagpabalik sa kanya mula sa daan, sinabi niya, “Siya ang tao ng Diyos na sumuway sa utos ni Yahweh.[a] Kaya ibinigay siya ni Yahweh sa leon, at niluray siya nito at pinatay, ayon sa salitang sinabi ni Yahweh sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “naghimagsik laban sa bibig ni Yahweh.” Maaari ring isalin na “naghimagsik laban sa salita ni Yahweh.”
    reason: Pinananatili ang kongkretong idyomang Hebreo at ang mas matinding leksikal na diwa ng מָרָה bilang mga lehitimong alternatibo.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: nagpabalik sa kanya mula sa kanyang paglalakbay
  rationale: Pinananatili ng “nagpabalik” ang causative na diwa ng Hiphil ng שׁוב. Sa konteksto, mas natural sa modernong Tagalog ang “mula sa kanyang paglalakbay” kaysa sa literal na “mula sa daan,” habang malinaw pa ring tumutukoy sa pagpapabalik sa kanya mula sa itinakdang ruta.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang parirala ay isang kinikilalang katawagan sa taong inatasan ng Diyos, lalo na sa isang propeta. Ang “lingkod ng Diyos” ay natural at malinaw sa Tagalog, at hindi nagmumungkahi na ang tinutukoy ay banal o diyos sa kalikasan.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: sumuway sa utos ni Yahweh
  rationale: Ang מָרָה ay nagpapahayag ng pagsuway o paghihimagsik, at ang literal na “bibig ni Yahweh” ay idyoma para sa kanyang binigkas na utos. Ang “sumuway sa utos” ay natural at tumpak sa konteksto; inilalahad sa talababa ang literal na larawan at mas matinding alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “Panginoon.”
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: ibinigay siya ... sa leon
  rationale: Malapit ito sa literal na נתן + ל at malinaw na naghahayag na ipinailalim siya sa kapangyarihan ng leon.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: niluray ... siya
  rationale: Bagaman pangunahing nangangahulugang “binali” ang שׁבר, sa leon bilang simuno ay tumutukoy ito sa marahas na paglapastangan o pagdurog sa katawan. Ang “niluray” ay malinaw at natural sa Tagalog para sa pagsalakay ng mabangis na hayop.
- source_word: וַיְמִתֵהוּ
  choice: pinatay siya
  rationale: Tuwirang ipinapahayag nito ang causative na kahulugan ng Hiphil ng מות, “pinapangyaring mamatay.”
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: ayon sa salitang sinabi ni Yahweh sa kanya
  rationale: Pinananatili nito ang pag-uugnay ng pangyayari sa naunang sinalitang pahayag ni Yahweh at ang bahagyang pag-uulit ng דבר sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa pagsuway ng lingkod ng Diyos
  choice: sumuway sa utos ni Yahweh
  alternative: naghimagsik laban sa salita ni Yahweh; sinuway ang bibig ni Yahweh
  rationale: Hindi nilulutas ng salin ang tensiyon sa pagitan ng banal na utos at ng panlilinlang ng matandang propeta. Inilalarawan lamang nito ang kilos ayon sa pahayag ng tauhan at sa idyomang Hebreo.
- issue: Pagbibigay ni Yahweh sa lingkod ng Diyos sa leon
  choice: Kaya ibinigay siya ni Yahweh sa leon
  alternative: at ibinigay siya ni Yahweh sa leon
  rationale: Ang pagkakasunod ng pahayag ay nagpapahiwatig ng bunga o hatol, kaya natural ang “Kaya.” Hindi nito pinapahina ang tahasang pag-uugnay ng teksto kay Yahweh bilang kumilos.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mabalitaan iyon” para sa likas na salaysay, “nagpabalik” upang mapanatili ang causative na kilos, at “niluray” upang maipahayag nang malinaw ang marahas na kilos ng leon nang hindi nananatili sa di-natural na literal na “binali.”
