  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: tl
  text: Kaya bumalik siya kasama ng matandang propeta, at kumain siya ng tinapay sa bahay ng matandang propeta at uminom ng tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kumain ng tinapay.” Maaari itong maging idyoma para sa pagkain ng isang buong pagkain; pinanatili rito ang mas literal na pananalita dahil mahalaga sa nakapaligid na salaysay ang “tinapay” at “tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik siya
  rationale: Ang wayyiqtol ng שׁוב ay nagsasaad ng sunod na natapos na kilos sa salaysay. Natural sa modernong Tagalog ang “bumalik siya” at malinaw na ipinahihiwatig ang pagbabalik ng taong mula sa Juda.
- source_word: אִתּוֹ
  choice: kasama nito
  rationale: Tuwirang ipinapahayag ang pagsama sa lalaking tinukoy sa konteksto. Ginamit ang “nito” upang hindi mapagkamalang iisang tao ang tinutukoy ng dalawang panghalip.
- source_word: וַיֹּאכַל לֶחֶם
  choice: kumain siya ng tinapay
  rationale: Bagaman maaaring idyomatikong tumukoy sa pagkain ng isang kainan, pinananatili ang konkretong “tinapay” dahil mahalaga ang pag-uulit nito sa pagbabawal at sa kabuuang salaysay.
- source_word: בְּבֵיתוֹ
  choice: sa bahay nito
  rationale: Natural na salin ng lokasyon. Ang hulaping panlalaki ay tumutukoy sa lalaking sinamahan niya—ang matandang propeta sa konteksto—at nililinaw ito ng “nito.”
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: uminom ng tubig
  rationale: Direktang salin na pinananatili ang “tubig,” sapagkat inuulit nito ang partikular na ipinagbawal sa nakapaligid na salaysay.
