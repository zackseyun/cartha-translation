translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa tao ng Diyos, “Sumama ka sa akin sa bahay ko at kumain[a], at bibigyan kita ng regalo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpalakas ng sarili”; ang pandiwang Hebreo ay maaaring tumukoy sa pagpapalakas o pagpapanatili ng sarili, karaniwan sa pamamagitan ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” para sa pagkakasunod-sunod ng mga pangyayari.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang katumbas ng tiyak na pangngalan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay hindi likas at maaaring malabo sa karaniwang Tagalog. Ang “lingkod ng Diyos” ay malinaw na tawag sa taong inatasan ng Diyos nang hindi ito tahasang pinapakahulugang “propeta.”
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  choice: Sumama ka sa akin sa bahay
  rationale: Ipinahahayag nito nang natural ang paanyayang pumunta kasama ng hari patungo sa bahay; hindi ipinapalagay ng Hebreo na ang tinutukoy ay tahanan din ng kausap.
- source_word: וּסְעָדָה
  choice: at kumain
  rationale: Ang pandiwa ay tumutukoy sa pagpapalakas o pagpapanatili sa sarili, karaniwan sa pamamagitan ng pagkain. Sa konteksto ng paanyaya sa bahay, “kumain” ang pinakanatural at tuwirang pagpapahayag.
- source_word: וְאֶתְּנָה לְךָ
  choice: at bibigyan kita
  rationale: Natural na Tagalog para sa alok na ipinahahayag ng unang panauhang anyo ng pandiwa.
- source_word: מַתָּת
  choice: regalo
  rationale: Neutral at karaniwang salin ng isang kaloob o handog; iniiwasan nito ang ideya ng kabayarang maaaring ipahiwatig ng “gantimpala.”
