  source_fidelity: 'Tumpak ang pangunahing pagkakasunod-sunod at mga kilos sa Hebreo: ang propeta ang bumuhat sa bangkay, naglagay nito sa asno, nagbalik kasama nito, at dumating sa lungsod ng matandang propeta upang magluksa at maglibing. Gayunman, ang layon ng “dinala pabalik” ay dapat tahasang ipakita sa Tagalog upang maipreserba ang pronominal na layon ng וַיְשִׁיבֵהוּ at maiwasang magmukhang ang propeta lamang ang bumalik.'
