base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: tl
  text: Binuhat ng propeta ang bangkay ng lalaki ng Diyos, isinakay niya ito sa asno, at dinala niya itong pabalik. Dumating siya sa lungsod ng matandang propeta upang ipagluksa[a] at ilibing ang lalaki ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tangisan.” Ang pandiwang Hebreo ay maaaring tumukoy sa hayag na panaghoy para sa namatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: Binuhat
  rationale: Ipinahahayag ang konkretong kilos ng pag-angat at pagdadala sa bangkay; natural din ito sa makabagong Tagalog.
- source_word: הַנָּבִיא
  choice: ang propeta
  rationale: Tumutukoy sa propetang binanggit sa konteksto, ang matandang propeta; pinananatili ang tiyak na pantukoy.
- source_word: נִבְלַת
  choice: ang bangkay
  rationale: Tiyak at karaniwang salitang Tagalog para sa patay na katawan, nang hindi pinapalambot ang kahulugan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lalaki ng Diyos
  rationale: Pinananatili ang kinikilalang biblikal na titulo at ang tahasang panlalaking anyo ng Hebreo.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: isinakay iyon sa asno
  rationale: Sa konteksto, inilagay ang bangkay sa asno upang dalhin; mas natural sa Tagalog ang “isinakay” kaysa sa literal na “inilagay sa ibabaw.”
- source_word: הַחֲמוֹר
  choice: asno
  rationale: Karaniwan at dignidad na katumbas sa biblikal na Tagalog.
- source_word: וַיְשִׁיבֵהוּ
  choice: dinala pabalik
  rationale: Ang Hiphil ng שוב ay nagpapahiwatig ng pagpapabalik o pagdadala pabalik; hindi tinutukoy sa Tagalog ang kasarian ng layon.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Dumating siya sa lungsod ng matandang propeta
  rationale: Tuwirang inilalarawan ang pagdating sa lungsod na kinaroroonan o tinitirhan ng matandang propeta.
- source_word: הַזָּקֵן
  choice: matanda
  rationale: Paglalarawan ito ng edad sa konteksto, hindi ng isang opisyal na tungkulin bilang elder.
- source_word: לִסְפֹּד
  choice: upang ipagluksa
  rationale: Ipinahahayag ang pagluluksa para sa namatay at pinananatili ang layuning ipinakikita ng לְ.
- source_word: וּלְקָבְרוֹ
  choice: at ilibing ang lalaki ng Diyos
  rationale: Ang pandiwa ay tuwirang nangangahulugang ilibing; inuulit ang tinutukoy upang maiwasan ang malabong panghalip sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang titulong “lalaki ng Diyos,” samantalang ginamit ang natural na “isinakay” para sa paglalagay ng bangkay sa asno. Inulit sa hulihan ang “lalaki ng Diyos” upang maging malinaw kung sino ang ililibing.
