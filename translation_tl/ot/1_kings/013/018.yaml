  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: tl
  text: Sinabi niya sa kanya, “Propeta rin akong tulad mo. Kinausap ako ng isang anghel[a] sa pamamagitan ng salita ni Yahweh. Sinabi nito, ‘Isama mo siya pabalik sa bahay mo upang makakain siya ng tinapay at makainom ng tubig.’” Ngunit nagsinungaling siya sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “sugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: propeta
  rationale: Karaniwang salin para sa taong nagsasalita bilang kinatawan ng Diyos; malinaw at likas sa modernong Filipino.
- source_word: מַלְאָךְ
  choice: anghel[a]
  rationale: Sa konteksto, ipinakikilala ang nagsalita bilang isang makalangit na tagapagdala ng salita ni Yahweh. Gayunman, mas malawak ang salitang Hebreo at maaari ring mangahulugang ‘sugo,’ kaya pinanatili ang alternatibo sa talababa.
- source_word: דִּבֶּר אֵלַי
  choice: kinausap ako
  rationale: Likas na Filipino para sa tuwirang pakikipag-usap sa nagsasalaysay, nang hindi dinaragdagan ang nilalaman.
- source_word: בִּדְבַר יְהוָה
  choice: sa pamamagitan ng salita ni Yahweh
  rationale: Pinananatili ang instrumental na diwa ng pang-ukol at ang ugnayan ng mensahe sa salita ni Yahweh.
- source_word: הֲשִׁבֵהוּ אִתְּךָ אֶל־בֵּיתֶךָ
  choice: Isama mo siya pabalik sa bahay mo
  rationale: Natural na utos sa Filipino na nagpapahayag ng causative na pagbabalik at ng pagsama sa kanya hanggang sa bahay.
- source_word: וְיֹאכַל לֶחֶם וְיֵשְׁתְּ מָיִם
  choice: upang makakain siya ng tinapay at makainom ng tubig
  rationale: Ipinapakita ang layunin ng pagpapabalik at pinananatili ang konkretong ‘tinapay’ at ‘tubig’ ng Hebreo.
- source_word: כִּחֵשׁ לוֹ
  choice: Ngunit nagsinungaling siya rito
  rationale: Direktang inilalantad ang panlilinlang gaya ng Hebreo; ipinakikita ng ‘Ngunit’ ang pagsalungat ng salaysay sa naunang pahayag.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit ng talata ang Tetragrammaton mismo; pinananatili ng ‘Yahweh’ ang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng מַלְאָךְ
  choice: anghel
  alternative: sugo
  rationale: Ang konteksto ng pahayag na nagmula sa salita ni Yahweh ay natural na tumutukoy sa isang makalangit na sugo, ngunit hindi lubos na nilulutas ng salitang Hebreo ang pagkakaiba; kaya nasa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “rito” upang malinaw na tumukoy sa kausap nang hindi paulit-ulit ang panghalip na maaaring maging malabo. Hinati sa dalawang pangungusap ang sinabi ng matandang propeta para maging natural ang daloy sa Filipino habang pinananatili ang saklaw ng sipi.
