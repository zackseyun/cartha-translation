base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: tl
  text: Nang marinig ng hari ang salita ng tao ng Diyos, na sumigaw laban sa altar sa Bethel, iniunat ni Jeroboam ang kanyang kamay mula sa altar at sinabi, “Dakpin ninyo siya!” Ngunit natuyo[a] ang kamay niyang iniunat laban sa kanya, at hindi na niya ito maibalik sa kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanguluntoy.” Sa Hebreo, “natuyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר אִישׁ הָאֱלֹהִים
  choice: ang sinabi ng lingkod ng Diyos
  rationale: Ang דְּבַר ay tumutukoy rito sa binigkas na pahayag. Ang “lingkod ng Diyos” ay natural at marangal sa modernong Tagalog bilang pantukoy sa אִישׁ הָאֱלֹהִים, bagaman mas literal itong “lalaki ng Diyos.”
- source_word: קָרָא עַל
  choice: sinabi ... tungkol sa
  rationale: Sa konteksto, ang pahayag ay isang mariing propetikong pagtuligsa laban sa altar. Pinananatili ng “tungkol sa” ang ugnayan sa altar nang hindi nagiging alanganin ang pangungusap sa Tagalog.
- source_word: בְּבֵית אֵל
  choice: sa Bethel
  rationale: Karaniwang transliterasyon ang “Bethel,” at natural ang pang-ukol na “sa” para sa lokasyon ng altar.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: iniunat ... ang kanyang kamay mula sa altar
  rationale: Ang שׁלח יד ay kilos ng pag-unat ng kamay, dito bilang mapanlabang utos. Ang “mula sa altar” ay nagpapanatili sa מֵעַל הַמִּזְבֵּחַ.
- source_word: תִּפְשֻׂהוּ
  choice: Dakpin ninyo siya!
  rationale: Ang pandiwa ay maramihang pautos sa mga tauhan ng hari. Ang “dakpin” ay tuwiran at malakas, nang hindi kinakailangang ipasok ang modernong legal na diwa ng pag-aresto.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: ang kamay ... ay natuyo
  rationale: Literal na larawan ng יבש ang pagkatuyo. Ang talababa ay nagbibigay ng natural na alternatibong “nanguluntoy” para sa biglang pagkawala ng lakas o galaw.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: na iniunat niya laban dito
  rationale: Inuulit ng sugnay ang mapanlabang kilos. Ang “laban dito” ay tumutukoy sa lingkod ng Diyos at nagpapakita ng adversatibong gamit ng עַל.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: maibalik sa kanyang sarili
  rationale: Pinananatili nito ang causative na diwa ng שוב at malinaw na ipinahihiwatig na hindi na niya maigalaw pabalik ang kamay.
theological_decisions:
- issue: Ang likas na nangyari sa kamay ni Jeroboam
  choice: Ilarawan nang tuwiran na natuyo at hindi na niya maibalik ang kamay, nang walang medikal na paliwanag.
  alternative: Isaling “nanguluntoy” o tukuyin bilang pagkaparalisa.
  rationale: Inilalahad ng salaysay ang biglaan at mahimalang kapansanan bilang tugon sa mapanlabang utos ni Jeroboam. Hindi tinutukoy ng Hebreo ang isang partikular na medikal na kondisyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lingkod ng Diyos” bilang natural na titulo, at pinanatili ang tuwiran at dramatikong daloy ng salaysay.
