  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: tl
  text: Kaya naglakbay siya sa ibang daan at hindi bumalik sa daang pinagdaanan niya papunta sa Bethel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya dumaan siya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at likas sa Filipino ang “Kaya” bilang bunga ng naunang utos; ang “dumaan” ay angkop sa konteksto ng pagpili ng ruta.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: sa ibang daan
  rationale: Ang דֶּרֶךְ ay maaaring mangahulugang daan o ruta; malinaw at natural ang “sa ibang daan” at pinananatili nito ang paghahambing sa dati niyang dinaanan.
- source_word: וְלֹא שָׁב
  choice: at hindi bumalik
  rationale: Sa konteksto ng paglalakbay, ang שׁוּב ay nangangahulugang bumalik o magbalik.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: sa daang dinaanan niya
  rationale: Tinutukoy ng sugnay ang nauna niyang ruta. Natural na naipahahayag sa Filipino ng “dinaanan niya” ang pagdaan niya roon noong papunta siya.
- source_word: אֶל בֵּית אֵל
  choice: papunta sa Bethel
  rationale: Ang בֵּית אֵל ay pangalang-pook na isinasalin sa transliterasyong “Bethel”; ipinakikita ng “papunta sa” na ito ang destinasyon ng nauna niyang pagdating.
