  to: Matapos niyang mailibing ang taong iyon, sinabi niya sa kanyang mga anak na lalaki, “Kapag namatay ako, ilibing ninyo ako sa libingan kung saan nakalibing ang tao ng Diyos. Ilagay ninyo ang aking mga buto sa tabi ng kanyang mga buto.”
  rationale: Inayos ang mga pagtukoy sa namatay na tao at ibinalik ang tuwirang titulong “tao ng Diyos.” Ginawang tahasan ang pagiging nakalibing ng tao ng Diyos sa libingan, habang pinanatili ang modernong Tagalog, ang utos sa mga anak na lalaki, at ang kongkretong “mga buto.”
