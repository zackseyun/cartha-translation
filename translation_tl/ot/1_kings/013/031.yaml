base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: tl
  text: Matapos niyang mailibing ang taong iyon, sinabi niya sa kanyang mga anak na lalaki, “Kapag namatay ako, ilibing ninyo ako sa libingan kung saan nakalibing ang tao ng Diyos. Ilagay ninyo ang aking mga buto sa tabi ng kanyang mga buto.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: Matapos niyang ilibing ito
  rationale: Isinasalin ang pambungad at temporal na parirala bilang isang likas na sugnay sa modernong Tagalog. Hindi na tahasang isinalin ang וַיְהִי dahil magiging mabigat at di-likas ang “At nangyari” sa kontekstong ito, samantalang nananatili ang pagkakasunod ng salaysay.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: בְּמוֹתִי
  choice: Kapag namatay ako
  rationale: Likas na modernong Tagalog para sa temporal na infinitive na tumutukoy sa inaasahang kamatayan.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: ilibing ninyo ako
  rationale: Inihahayag ang puwersa ng tagubilin sa tuwirang pananalita sa pamamagitan ng magalang ngunit malinaw na pautos.
- source_word: בַּקֶּבֶר
  choice: sa libingan
  rationale: Ang “libingan” ay likas at marangal na katawagan sa isang tiyak na lugar na mapaglilibingan ng higit sa isang labi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: taong mula sa Diyos
  rationale: Pinananatili ang titulong Hebreo nang hindi ito pinakikitid sa “propeta.” Ang “mula sa Diyos” ay mas likas sa Tagalog bilang titulo kaysa sa literal ngunit maaaring malabong “tao ng Diyos.”
- source_word: קָבוּר בּוֹ
  choice: kinalalagyan
  rationale: Sa konteksto ng libingan, malinaw na ipinahihiwatig nito na doon nakalibing ang tao, habang iniiwasan ang alanganing pag-uulit ng “inilibing/nakalibing.”
- source_word: אֵצֶל
  choice: sa tabi ng
  rationale: Tuwirang pinananatili ang kahulugang malapit na pagkakatabi.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: kanyang mga buto ... aking mga buto
  rationale: Pinananatili ang kongkretong “mga buto,” mahalaga sa larawang panglibing at sa sumunod na salaysay.
- source_word: הַנִּיחוּ
  choice: Ilagay ninyo
  rationale: Likas at malinaw na pautos sa Tagalog para sa paglalagay ng mga buto sa tabi ng iba.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tuwirang tagubilin at kongkretong larawang panglibing, ngunit iniwasan ang lipas o labis na literal na ayos ng pangungusap.
