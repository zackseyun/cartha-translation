base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: tl
  text: 'Sapagkat ito ang iniutos sa akin ni Yahweh sa pamamagitan ng kanyang salita: ‘Huwag kang kumain ng tinapay ni uminom ng tubig, at huwag kang bumalik sa daang dinaanan mo.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: Sapagkat ganito
  rationale: Ipinapahayag nito ang dahilan at paraan ng utos nang natural sa modernong Tagalog.
- source_word: בִּדְבַר יְהוָה
  choice: sa pamamagitan ng salita ni Yahweh
  rationale: Pinananatili ang instrumental na diwa ng בְּ at isinasalin ang personal na pangalang יהוה bilang Yahweh.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Huwag kang kakain ng tinapay
  rationale: Tuwirang ipinapahayag ang pagbabawal; pinananatili ang konkretong salitang ‘tinapay.’
- source_word: וְלֹא תִשְׁתֶּה מָיִם
  choice: o iinom ng tubig
  rationale: Likas sa Tagalog ang ‘o’ sa magkakaugnay na negatibong pagbabawal, habang saklaw pa rin ng ‘huwag’ ang ikalawang pandiwa.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: at huwag kang babalik sa daang dinaanan mo
  rationale: Ang הָלַךְ ay literal na ‘lumakad/pumunta’; ang ‘dinaanan mo’ ay natural at hindi nagpapalagay na ang tinutukoy ay pagdating sa halip na rutang nilakbay.
theological_decisions:
- issue: Paglalahad sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang tekstong Hebreo ay may personal na pangalang יהוה; ang transliterasyong ‘Yahweh’ ay malinaw at hindi ito ipinagpapalit sa titulong ‘Panginoon.’
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang pormal na pananalitang ‘salita ni Yahweh’ at ang tuwirang tatlong bahagi ng pagbabawal, ngunit inayos ang mga pang-ugnay para maging likas sa Tagalog.
