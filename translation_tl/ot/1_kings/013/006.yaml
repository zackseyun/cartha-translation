base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: tl
  text: Sumagot ang hari sa tao ng Diyos, “Magsumamo ka, pakiusap, kay Yahweh na iyong Diyos[a], at ipanalangin mo ako upang maibalik sa akin ang aking kamay.” Kaya nagsumamo ang tao ng Diyos kay Yahweh, at naibalik sa hari ang kanyang kamay at naging gaya ng dati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hingin mo ang lingap ni Yahweh.” Ang idyomang Hebreo ay literal na “magsumamo sa mukha ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ...
  rationale: Ang tambalang pormula ay natural na naipapahayag sa modernong Tagalog sa pamamagitan ng “sumagot,” yamang kasunod agad ang mismong sinabi ng hari.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili ang tiyak na titulong Hebreo sa halip na ipakahulugan agad bilang “propeta.”
- source_word: חַל נָא אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: hingin mo ang lingap ni Yahweh / hiningi ... ang lingap ni Yahweh
  rationale: Ipinahahayag nito ang diwang idyomatiko ng paghiling o pagsusumamo para sa lingap, nang hindi ipinapasok ang mas matinding ideya ng pagpapalubag ng galit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang “iyong”; hindi ito ginagawang “ating Diyos,” kaya nananatili ang distansiyang ipinahihiwatig ng pananalita ng hari.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: ipanalangin mo ako
  rationale: Natural at malinaw itong modernong Tagalog para sa panalanging ginagawa alang-alang sa ibang tao.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: maibalik sa akin ang aking kamay / naibalik sa hari ang kanyang kamay
  rationale: Pinananatili ang larawan ng kamay na “bumabalik” sa may-ari habang ipinahahayag sa natural na Tagalog ang paggaling o panunumbalik nito.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: naging gaya ng dati
  rationale: Malinaw at natural na ipinapahayag ang pagbabalik ng kamay sa dating kalagayan.
theological_decisions:
- issue: Ang pagtukoy ng hari kay Yahweh bilang “iyong Diyos”
  choice: iyong Diyos
  alternative: ating Diyos
  rationale: Eksaktong pinananatili ang pananalita ng hari at ang posibleng teolohikal na distansiyang taglay nito, sa halip na ipalagay ang pakikiisa niyang hindi sinabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “tao ng Diyos” bilang titulong mula sa teksto at ang pangalang “Yahweh.” Inilagay ang talababa sa idyomang tinutukoy nito.
