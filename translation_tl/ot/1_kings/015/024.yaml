  text: וַ/יִּשְׁכַּ֤ב אָסָא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: tl
  text: At natulog si Asa kasama ng kanyang mga ninuno[a], at inilibing siyang kasama nila sa Lunsod ni David na kanyang ama[b]. Ang anak niyang si Josafat ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kasama ng kanyang mga ama.” Karaniwang pormula ito sa mga ulat tungkol sa pagkamatay at paglilibing ng mga hari, at maaari ring isaling “kasama ng kanyang mga ninuno.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang ama” ay tumutukoy kay David bilang maharlikang ninuno ni Asa, hindi bilang kanyang mismong ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: natulog
  rationale: Pinananatili ang karaniwang pormulang Hebreo para sa pagkamatay ng hari, sa halip na gawing tuwirang “namatay” at mawala ang talinghagang pampanitikan.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ay likas at malinaw sa modernong Tagalog at naipahahayag ang dinastiko at panlahing diwa ng אבות, bagaman literal itong “mga ama.”
- source_word: וַיִּקָּבֵר
  choice: inilibing siyang kasama nila
  rationale: Likas na anyong balintiyak sa Tagalog ang “inilibing,” at ang “kasama nila” ay malinaw na tumutukoy sa mga ninunong kababanggit lamang.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: sa Lunsod ni David na kanyang ama
  rationale: Malapit itong sumusunod sa sintaks ng Hebreo at pinananatili ang mahalagang katawagang “ama” para kay David; ipinapaliwanag ng talababa na ninunong maharlika ang tinutukoy.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Ang “naghari” ang maikli at nakaugaliang katumbas sa pormula ng paghalili sa trono.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Tumpak nitong ipinahahayag ang paghalili sa katungkulan, hindi lamang ang pagkakasunod sa panahon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang talinghagang “natulog” at ang katawagang “ama” upang mapanatili ang pormulang Hebreo at ang ugnayang dinastiko; nilinaw sa mga talababa ang posibleng kalituhan.
