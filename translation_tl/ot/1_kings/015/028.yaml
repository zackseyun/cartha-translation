  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: tl
  text: Pinatay[a] siya ni Baasa sa ikatlong taon ng paghahari ni Asa, na hari ng Juda, at naghari siya bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinapatay siya ni Baasa.” Causative ang anyo ng pandiwang Hebreo; mas literal, “pinapangyari niyang mamatay siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: Pinatay siya
  rationale: Ang Hiphil ng מות ay causative, ‘pinapangyaring mamatay.’ Sa modernong Filipino, likas at tumpak ang ‘pinatay’; ang mas literal na ‘ipinapatay’ ay maaaring magpahiwatig na iba ang aktuwal na pumatay, na hindi tahasang sinasabi ng Hebreo.
- source_word: בַעְשָׁא
  choice: Baasa
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalang Baasha.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: nang ikatlong taon ng paghahari
  rationale: Ang temporal na parirala ay tumutukoy sa ikatlong taon sa talaan ng paghahari ni Asa; idinagdag ang ‘ng paghahari’ upang maging malinaw at natural sa Filipino.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: ni Asa na hari ng Juda
  rationale: Sa pormula ng mga taon ng hari, ang לְ ay tumutukoy sa paghahari ni Asa; tuwirang pinananatili ang titulong ‘hari ng Juda.’
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Ang Qal na מלך ay nangangahulugang ‘naghari’ o ‘naging hari.’ Ang ‘naghari’ ay natural at napapanatili ang aspektong maharlikang pamamahala.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinapahayag ng תחתיו ang paghalili o pagkuha sa puwesto ng naunang hari; malinaw at likas sa Filipino ang ‘bilang kahalili niya.’
