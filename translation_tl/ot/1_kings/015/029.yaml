  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: tl
  text: Nang maging hari siya, pinatay niya ang buong sambahayan ni Jeroboam. Wala siyang itinirang sinumang may buhay sa angkan ni Jeroboam hanggang sa malipol niya ito[a], ayon sa salita ni Yahweh na sinabi niya sa pamamagitan ng lingkod niyang si Ahias na taga-Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hanggang sa malipol niya siya.” Panlalaking isahan ang panghalip sa Hebreo, ngunit maaaring tumukoy ito sa sambahayan ni Jeroboam bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Nang maging hari siya
  rationale: Ang pormulang pasalaysay na וַיְהִי at ang temporal na כְּ ay likas na ipinahahayag sa Tagalog bilang sugnay na panahunan. Ang “maging hari” ay angkop sa konteksto ng pagluklok.
- source_word: הִכָּה
  choice: pinatay niya
  rationale: Bagaman ang ugat ay maaaring mangahulugang “sinaktan” o “pinabagsak,” malinaw sa konteksto ng paglipol sa dinastiya na kamatayan ang kinalabasan; natural at tiyak dito ang “pinatay.”
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: ang buong sambahayan ni Jeroboam
  rationale: Ang בֵּית sa kontekstong maharlika ay tumutukoy sa sambahayan, angkan, o dinastiya. Pinananatili ng “sambahayan” ang pampamilya at pampolitikang lawak nang hindi nililimitahan sa gusali.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה לְיָרָבְעָם
  choice: Wala siyang itinirang sinumang may buhay sa angkan ni Jeroboam
  rationale: Literal na kaugnay ng “hininga” ang נְשָׁמָה, ngunit ang idyoma ay nangangahulugang walang iniwang buháy. Nililinaw ng “sa angkan” ang relasyong ipinahahayag ng לְיָרָבְעָם.
- source_word: עַד הִשְׁמִידוֹ
  choice: hanggang sa malipol niya ito
  rationale: Masculine singular ang hulapi sa Hebreo, ngunit maaari itong tumukoy nang kolektibo sa sambahayan o dinastiya ni Jeroboam. Ang “ito” ay nagpapanatili sa kolektibong reperensiya nang hindi ginagawang tuwirang si Jeroboam mismo ang pinatay sa pangyayaring ito.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ang karaniwang pormula ng katuparan at isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh.”
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: na sinabi niya sa pamamagitan ng lingkod niya
  rationale: Ang literal na “sa kamay ng” ay pormula ng pamamagitan. Ang “sa pamamagitan ng” ang natural na katumbas sa modernong Tagalog.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: si Ahias na taga-Silo
  rationale: Ginamit ang nakaugaliang anyong Tagalog na “Ahias” at ang malinaw na gentiliko na “taga-Silo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Tinutukoy ng hulapi sa עַד הִשְׁמִידוֹ
  choice: “ito,” tumutukoy sa sambahayan o angkan ni Jeroboam bilang isang kabuuan
  alternative: “siya,” na pormal na sumusunod sa panlalaking isahang hulapi
  rationale: Panlalaking isahan ang anyo sa Hebreo, ngunit ang pinakamalapit na paksa ay ang kolektibong “sambahayan ni Jeroboam.” Inilalagay sa talababa ang pormal na alternatibo upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sambahayan” para sa dinastikong בֵּית, “may buhay” para sa idyomang may larawan ng hininga, at “sa pamamagitan ng” sa halip na literal na “sa kamay ng.”
