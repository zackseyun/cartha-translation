  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: tl
  text: Noong ikadalawampung taon ng paghahari ni Jeroboam, na hari ng Israel, nagsimulang maghari si Asa bilang hari ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: Nang ikadalawampung taon
  rationale: Ang parirala ay karaniwang pormula ng kronolohiya. Likas sa modernong Tagalog ang ordinal na “ikadalawampung” sa pagtukoy sa taon ng paghahari; hindi na kailangang isalin nang hiwalay ang panimulang וּ sa ganitong salaysay.
- source_word: לְ/יָרָבְעָם
  choice: ng paghahari ni Jeroboam
  rationale: Itinatakda ng לְ ang paghahari ni Jeroboam bilang batayan ng pagbilang ng taon. Idinagdag ang “paghahari” upang maging malinaw at natural ang kronolohikal na diwa sa Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Tuwirang pinananatili ang maharlikang titulo at ang kahariang tinutukoy.
- source_word: מָלַךְ
  choice: nagsimulang maghari
  rationale: Sa pormula ng mga tala tungkol sa mga hari, ipinahihiwatig ng pandiwa ang pagluklok o pagsisimula ng paghahari, hindi lamang ang kalagayang pagiging hari.
- source_word: אָסָא
  choice: Asa
  rationale: Karaniwang anyo ng pangalang Hebreo sa Filipino.
- source_word: מֶלֶךְ יְהוּדָה
  choice: bilang hari ng Juda
  rationale: Inilalarawan nito ang katungkulan at kahariang pinamunuan ni Asa. Natural ang “bilang hari ng Juda” kasunod ng “nagsimulang maghari.”
