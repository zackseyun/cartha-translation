  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: tl
  text: Nang mabalitaan ito ni Baasa, tumigil siya sa pagtatayo ng Rama at nanatili sa Tirza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nanirahan siya sa Tirza.”
    reason: Ipinapakita ang leksikal na posibilidad ng וַיֵּשֶׁב, na maaari ring mangahulugang manirahan.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang mabalitaan ito
  rationale: Ang pormulang וַיְהִי na sinusundan ng infinitive construct ay nagpapakilala ng sugnay na panahunan. Likas sa modernong Tagalog ang “Nang mabalitaan ito”; ang “ito” ay ipinahiwatig ng naunang konteksto.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo na Baasha.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: tumigil siya sa pagpapatibay
  rationale: Ang חדל na may מִן at infinitive ay nangangahulugang tumigil sa isang gawain. Sa konteksto, ang pagtatayo sa Rama ay gawaing militar upang patibayin ang lugar, kaya malinaw at natural ang “pagpapatibay.”
- source_word: אֶת הָרָמָה
  choice: sa Rama
  rationale: Ang הָרָמָה ay pangalan ng lugar. Ginamit ang “sa” dahil ang natural na Tagalog na pariralang “pagpapatibay sa Rama” ang naghahayag ng gawaing ginawa roon.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Maaaring mangahulugan ang ישׁב na manirahan, manatili, o maupo. Ang “nanatili” ay angkop sa daloy ng salaysay at hindi nagpapahiwatig nang tiyak ng permanenteng paninirahan.
- source_word: בְּתִרְצָה
  choice: sa Tirza
  rationale: Isinalin ang pang-ukol na בְּ bilang “sa” at ginamit ang karaniwang anyong Tagalog ng pangalan ng lugar.
