id: 1KI.15.25
reference: 1 Kings 15:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: tl
  text: Naging hari sa Israel si Nadab na anak ni Jeroboam noong ikalawang taon ng paghahari ni Asa na hari ng Juda. Naghari si Nadab sa Israel nang dalawang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: si Nadab
  rationale: Ang waw ay nag-uugnay sa kasunod na salaysay tungkol sa mga hari. Hindi kailangang tumbasan ng tahasang “at” o “ngayon” sa Filipino; natural na naihahatid ng pagkakasunod ng mga pangungusap ang pagpapatuloy.
- source_word: בֶּן יָרָבְעָם
  choice: na anak ni Jeroboam
  rationale: Likas na paraang Filipino ng pagpapakilala sa ama ni Nadab.
- source_word: מָלַךְ
  choice: Naging hari
  rationale: Ang unang gamit ng pandiwa ay tumutukoy sa pagluklok ni Nadab, hindi lamang sa tagal ng kanyang paghahari.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, “naging hari sa Israel” at “naghari sa Israel” ang natural na katumbas ng Hebreong idyoma ng pamamahala ‘sa ibabaw ng’ Israel.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: noong ikalawang taon
  rationale: Bagaman kardinal ang anyong Hebreo, ordinal na “ikalawang taon” ang natural na pormula sa Filipino para sa petsang batay sa taon ng paghahari.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: ng paghahari ni Asa na hari ng Juda
  rationale: Nililinaw ng “ng paghahari” ang ipinahihiwatig na batayan ng pagtatakda ng petsa, habang pinananatili ang pagkakakilanlan kay Asa bilang hari ng Juda.
- source_word: וַ/יִּמְלֹךְ
  choice: Naghari si Nadab
  rationale: Dahil sinusundan ito ng tagal, ipinapahayag ng pandiwa ang panahon ng kanyang paghahari. Inulit ang pangalan para sa malinaw at natural na Filipino.
- source_word: שְׁנָתָיִם
  choice: nang dalawang taon
  rationale: Tuwirang ipinahahayag ang tagal ng paghahari; “nang” ang angkop na pananda ng haba ng panahon.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang dalawang bahagi ng Hebreong pormulang panghari: ang petsa ng pagluklok at ang tagal ng paghahari.'
