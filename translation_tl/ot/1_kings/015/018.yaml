  naturalness: Natural at angkop sa modernong Filipino ang “kabang-yaman,” “ipinagkatiwala,” at “kalakip ang ganitong mensahe.” Mas malinaw at natural ang pangmaramihang “ang mga ito” para sa pilak at ginto.
  terminology: Tama ang “Yahweh,” “Aram,” “Damasco,” at “palasyo ng hari,” na may talababa para sa literal na “bahay ng hari.” Dapat panatilihin ang tahasang pormulang genealogikal na “anak ni.”
