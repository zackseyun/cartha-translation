  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: tl
  text: 'Pagkatapos, kinuha ni Asa ang lahat ng pilak at ginto na natira sa mga kabang-yaman ng bahay ni Yahweh at sa mga kabang-yaman ng palasyo ng hari[a], at ipinagkatiwala niya ang mga ito sa kanyang mga lingkod. Pagkatapos, ipinadala ni Haring Asa ang mga ito kay Ben-hadad, anak ni Tabrimon, anak ni Hezion, hari ng Aram[b], na naninirahan sa Damasco, kalakip ang ganitong mensahe:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “bahay ng hari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Aram”; tradisyonal na tinatawag na “Syria.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kaya kinuha ni Asa
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “Kaya” bilang bunga ng naunang pangyayari, habang pinananatili ng “kinuha” ang payak na diwa ng לקח.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: ang lahat ng pilak at ginto na natira
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang diwa ng participle na הַנּוֹתָרִים bilang mga yamang natitira pa.
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: sa mga kabang-yaman ng bahay ni Yahweh
  rationale: Ang אֹצְרוֹת ay mga imbakan ng kayamanan; ang “kabang-yaman” ay malinaw at angkop sa pilak at ginto. Ang בֵּית יְהוָה ay isinaling malapit sa anyo ng Hebreo bilang “bahay ni Yahweh,” na tumutukoy sa templo.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: at sa mga kabang-yaman ng palasyo ng hari
  rationale: Bagaman literal na “bahay ng hari,” ang tinutukoy sa konteksto ay ang palasyo; ang ganitong salin ay natural at malinaw sa modernong Tagalog.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: at ipinagkatiwala ang mga iyon sa kanyang mga lingkod
  rationale: Ang literal na “ibinigay sa kamay” ay idyoma para sa paglalagay sa pangangalaga o pamamahala ng iba. Inihahayag ng “ipinagkatiwala” ang kahulugan nito sa natural na Tagalog.
- source_word: וַיִּשְׁלָחֵם
  choice: Pagkatapos, ipinadala iyon ni Haring Asa
  rationale: Ang hulaping layon ay tumutukoy sa pilak at ginto bilang kabuuang padala. Nililinaw ng “Pagkatapos” ang kasunod na hakbang sa salaysay.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Ben-hadad na anak ni Tabrimon at apo ni Hezion
  rationale: Ang ikalawang sunod na בֶּן ay natural na ipinahahayag sa Tagalog bilang “apo,” habang pinananatili ang buong pagkakakilanlang genealogikal.
- source_word: מֶלֶךְ אֲרָם
  choice: ang hari ng Aram
  rationale: Pinananatili ang makasaysayang pangalang Hebreo na Aram sa halip na palitan ng mas huling katawagang Syria.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: na naninirahan sa Damasco
  rationale: Ang participle ng ישב ay nagsasaad ng paninirahan. Natural sa Tagalog ang “naninirahan,” at “Damasco” ang karaniwang anyong Filipino ng pangalan.
- source_word: לֵאמֹר
  choice: 'kalakip ang ganitong mensahe:'
  rationale: Ipinakikilala nito ang tuwirang pananalita sa susunod na talata. Mas natural sa Tagalog ang pariralang ito kaysa sa literal na “na sinasabi,” habang pinananatili ang tungkulin ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nakasulat sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay mas tuwirang transliterasyon ng personal na pangalan at hindi ito pinapalitan ng titulo.
- issue: Paglilipat sa אֲרָם
  choice: Aram
  alternative: Syria
  rationale: Pinananatili ng “Aram” ang katawagang pangkasaysayan at pangheograpiya ng tekstong Hebreo; ang “Syria” ay mas huling tradisyonal na katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kabang-yaman,” “palasyo,” at “ipinagkatiwala” para sa natural na daloy, habang pinanatili ang mga pangalang Yahweh at Aram at ang pagkakakilanlang genealogikal.
