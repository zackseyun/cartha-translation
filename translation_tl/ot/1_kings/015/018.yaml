    rationale: Literal at pormal na genealogikal na tinatawag ng Hebreo si Ben-hadad na “anak ni Hezion.” Maaaring angkop ang “apo” bilang hinuha sa karaniwang gamit, ngunit binabawasan nito ang eksaktong pormulasyon ng pinagmulan.
  - severity: low
