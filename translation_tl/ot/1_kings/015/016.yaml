  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: tl
  text: At nagkaroon ng digmaan sa pagitan ni Asa at ni Baasa, na hari ng Israel, sa lahat ng kanilang mga araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa lahat ng kanilang mga araw.” Isa itong idyoma para sa buong panahon nila; sa kontekstong ito, maaari itong tumukoy sa buong panahon ng kanilang paghahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: At nagkaroon ng digmaan
  rationale: 'Ang pangungusap ay isang eksistensiyal na pahayag: may digmaang namagitan sa dalawang hari. Likas at tuwiran sa Filipino ang “nagkaroon ng digmaan,” nang hindi ipinipilit sa pandiwa ang diwa ng “nagpatuloy.”'
- source_word: בֵּין ... וּ/בֵין
  choice: sa pagitan ni ... at ni
  rationale: Pinananatili nito ang magkatumbas na ayos ng Hebreo at malinaw na ipinapahayag ang alitan ng dalawang pinuno.
- source_word: אָסָא
  choice: Asa
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Transliterasyong Filipino na malinaw na kumakatawan sa pangalang Hebreo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Natural na pang-uring parirala sa Filipino na tumutukoy kay Baasa at sa kaniyang katungkulan.
- source_word: כָּל יְמֵי/הֶם
  choice: sa buong panahon ng kanilang paghahari
  rationale: Literal itong “lahat ng kanilang mga araw,” ngunit sa konteksto ng salaysay tungkol sa dalawang hari, tumutukoy ito sa panahon ng kanilang paghahari. Inilalagay sa talababa ang literal at mas malawak na posibleng pagbasa upang hindi maitago ang saklaw ng idyoma.
theological_decisions:
- issue: Saklaw ng כָּל יְמֵיהֶם
  choice: panahon ng kanilang paghahari
  alternative: lahat ng kanilang mga araw / buong buhay nila
  rationale: Dahil mga hari ang pinag-uusapan at may kahalintulad na pormula sa salaysay, pinakamalinaw sa konteksto ang paghahari. Gayunman, maaaring mas malawak ang literal na idyoma, kaya tahasang pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “digmaan” bilang tuwiran at karaniwang katumbas ng מִלְחָמָה; iniwasan ang mas mabigat o di-likas na pagbubuo.
