base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: tl
  text: Naghari siya sa Jerusalem nang apatnapu’t isang taon, at ang pangalan ng kanyang ina ay Maaca, na anak na babae[b] ni Abisalom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Abishalom; sa maraming salin sa Ingles ay “Absalom.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anak na babae”; sa mga kontekstong talaangkanan, maaari ring gamitin ang katawagang ito para sa isang babaeng inapo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: apatnapu’t isang taon
  rationale: Ang literal na anyo ay “apatnapu at isang taon,” ngunit ang “apatnapu’t isang taon” ang natural at wastong pagpapahayag ng bilang sa modernong Tagalog.
- source_word: מָלַךְ
  choice: naghari
  rationale: Sa konteksto, tumutukoy ang pandiwa sa tagal ng pamamahala bilang hari, hindi sa sandali ng pagluklok.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol na בְּ ay nagpapahiwatig ng lugar; natural sa Tagalog ang “sa Jerusalem.”
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Malinaw at natural itong katumbas sa modernong Tagalog ng Hebreong pariralang “at ang pangalan ng kanyang ina.”
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Isinalin sa baybay-Tagalog ang personal na pangalang Hebreo sa halip na bigyan ng kahulugang salin.
- source_word: בַּת
  choice: anak na babae
  rationale: Ito ang tuwirang leksikal na kahulugan. Hindi ipinalit sa pangunahing teksto ang mas interpretatibong “apong babae” o “babaeng inapo”; inilagay sa talababa ang mas malawak na posibleng gamit nito sa talaangkanan.
- source_word: אֲבִישָׁלוֹם
  choice: Abisalom
  rationale: Sinusundan nito ang anyong Hebreo na Abishalom sa baybay na angkop sa Tagalog; binanggit sa talababa ang kilalang alternatibong anyong Absalom.
theological_decisions:
- issue: Kaugnayang pampamilya ni Maaca kay Abisalom
  choice: Pinanatili sa pangunahing teksto ang literal na “anak na babae ni Abisalom.”
  alternative: “apong babae ni Abisalom” o “babaeng inapo ni Abisalom”
  rationale: Tahasang gumagamit ang Hebreo ng בַּת, “anak na babae.” Bagaman maaari itong gamitin nang mas malawak sa ilang kontekstong talaangkanan, hindi dapat lutasin ng salin ang usaping pangkasaysayan sa pamamagitan ng pagpapalit sa literal na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naghari” bilang karaniwang salitang biblikal na madaling maunawaan, at pinanatili ang literal na katawagang pampamilya habang inilalahad sa talababa ang tunay na kalabuan nito.
