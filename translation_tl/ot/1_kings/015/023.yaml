base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Asa, ang lahat ng kanyang kapangyarihan, ang lahat ng kanyang ginawa, at ang mga lunsod na itinayo niya—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda?[a] Ngunit nang matanda na siya, nagkasakit siya sa mga paa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aklat ng mga Talaan ng mga Hari ng Juda.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy ng Hebreo ang eksaktong uri ng sakit; sinasabi lamang nitong mga paa niya ang apektado.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Ang iba pa sa lahat ng mga ginawa ni Asa
  rationale: Ang יֶתֶר ay ‘iba pa’ o ‘nalalabi,’ at sa pormulang panghari ang דִּבְרֵי ay tumutukoy sa mga gawa at pangyayari tungkol sa paghahari, hindi lamang sa mga salita.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: ang lahat ng kanyang kapangyarihan
  rationale: Pinananatili ng ‘kapangyarihan’ ang abstraktong diwa ng גְּבוּרָה at inihihiwalay ito sa kasunod na pangkalahatang pahayag tungkol sa lahat ng ginawa niya.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng kanyang ginawa
  rationale: Tuwirang salin na nagpapanatili sa malawak na saklaw ng parirala.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: at ang mga lunsod na itinayo niya
  rationale: Ang עָרִים ay mga lunsod, at ang בָּנָה ay literal na ‘nagtayo’; hindi idinagdag ang ideya ng pagpapatibay na hindi tahasang sinasabi rito.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong at ang pasibong anyo ng Hebreo.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Juda
  rationale: Natural na pamagat sa Filipino para sa pinagkunang opisyal na talaan o annals ng mga hari ng Juda.
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: Ngunit nang matanda na siya
  rationale: Ang רַק ay nagpapasok ng salungat o naglilimiting dagdag na detalye; natural na ipinahahayag ng ‘Ngunit’ ang tungkuling ito, habang ang temporal na parirala ay malinaw na naisalin bilang ‘nang matanda na siya.’
- source_word: חָלָה אֶת רַגְלָיו
  choice: nagkasakit ang kanyang mga paa
  rationale: Tinutukoy ng Hebreo ang bahaging apektado ngunit hindi pinapangalanan ang eksaktong karamdaman; ang salin ay natural at hindi nagdaragdag ng diagnosis.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lunsod’ at ‘kasaysayan’ para sa pormal na estilong historiograpiko, ngunit pinasimple ang pariralang temporal bilang ‘nang matanda na siya’ upang maging natural sa karaniwang mambabasa.
