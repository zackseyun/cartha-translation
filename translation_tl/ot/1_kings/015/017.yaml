  source_fidelity: Tapat ang salin sa Hebreo. Ang “sumalakay sa Juda” ay angkop na pagpapahayag ng kilos-militar ng וַיַּעַל ... עַל, at ang “itinayo ang Rama” ay pinananatiling malapit sa payak na בנה nang hindi ipinapasok sa pangunahing teksto ang interpretasyong “pinatibay.” Naipapahayag din ng “upang walang makalabas o makapasok kay Asa” ang layuning pumigil sa paggalaw o paglapit na nasa לְבִלְתִּי תֵּת יֹצֵא וָבָא לְאָסָא.
