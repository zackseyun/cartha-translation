id: 1KI.15.17
reference: 1 Kings 15:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַל בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: tl
  text: At si Baasa na hari ng Israel ay sumalakay sa Juda at itinayo[a] ang Rama upang walang makalabas o makapasok[b] kay Asa na hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatibay ang Rama.” “Itinayo” lamang ang literal na pandiwang Hebreo, ngunit ipinahihiwatig ng konteksto na ginawa itong isang estratehikong kuta.
    reason: lexical_alternative
  - marker: b
    text: Ang “makalabas o makapasok” ay isang pahayag na Hebreo para sa malayang paggalaw o pagdaan. Layunin ni Baasa na hadlangan ang paglalakbay at paglapit kay Asa na hari ng Juda.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  choice: sumalakay sa Juda
  rationale: Sa kontekstong militar, ang עלה na may עַל ay tumutukoy sa paglusob o pagsalakay laban sa isang lupain. Likas sa modernong Filipino ang “sumalakay sa” at malinaw ang diwang mapanlaban.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Isinalin ang personal na pangalan ayon sa karaniwang anyong ginagamit sa mga Bibliyang Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang katumbas ng construct chain na nagsasaad ng katungkulan at kaharian ni Baasa.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: itinayo ang Rama
  rationale: Ang בנה ay pangunahing nangangahulugang “magtayo” o “magtayo muli.” Pinanatili sa teksto ang payak na pandiwa sa halip na tahasang sabihing “pinatibay,” bagaman iyon ang ipinahihiwatig ng estratehikong konteksto.
- source_word: הָרָמָה
  choice: Rama
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalan ng lugar na Ramah.
- source_word: לְבִלְתִּי תֵּת
  choice: upang walang
  rationale: Ipinahahayag ng parirala ang layuning hadlangan ang isang kilos. Ang “upang walang” ay maikli, natural, at tapat sa pahayag ng layunin.
- source_word: יֹצֵא וָבָא
  choice: makalabas o makapasok
  rationale: Pinananatili nito ang pares na Hebreo para sa paglabas at pagpasok, habang malinaw sa Filipino na ipinagbabawal ang paggalaw o pagdaan.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: kay Asa na hari ng Juda
  rationale: Pinanatili ang kaugnayang ipinahahayag ng לְ nang hindi dinaragdagan sa pangunahing teksto ng “mula at patungo,” na hindi tahasang nakasulat.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos ng pangungusap. Ginamit ang “sumalakay” upang natural na maipahayag ang militar na diwa ng וַיַּעַל ... עַל. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng mga pariralang nililinaw nito.
