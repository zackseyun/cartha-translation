base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Nadab at ang lahat ng ginawa niya, hindi ba nakasulat ang mga ito sa Aklat ng mga Talaan ng mga Hari ng Israel?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Aklat ng mga Salaysay ng mga Hari ng Israel.” Ang Hebreong pananalita ay tumutukoy sa isang maharlikang talaan, hindi kinakailangang sa biblikal na aklat na Mga Cronica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: Ang iba pang mga ginawa ni Nadab
  rationale: Sa pormulang pangkasaysayan ng Mga Hari, ang דִּבְרֵי ay tumutukoy sa mga pangyayari o gawa na iniulat tungkol sa hari, hindi lamang sa kanyang mga salita. Natural sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng kanyang ginawa
  rationale: Tuwiran at likas na salin ng sugnay na kamag-anak, habang pinananatili ang pormulang pag-uulit ng Hebreo.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot at ang tahasang ideya ng pagkakasulat.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng aklat/scroll,” ang “nakasulat sa Aklat” ang natural na paraan ng pagtukoy sa isang nakasulat na sanggunian sa Tagalog.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Taunang Talaan
  rationale: Sa kontekstong ito, ang parirala ay tumutukoy sa mga opisyal na annal o tala ng paghahari. Iniiwasan ng “Taunang Talaan” ang maling pagkakakilanlan dito sa kanonikong aklat na Mga Cronica.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Dito, ang לְ ay nagpapahayag ng kaugnayan ng tala sa mga hari ng Israel; natural itong isalin bilang “ng mga Hari ng Israel.”
theological_decisions:
- issue: Pagkakakilanlan ng tinukoy na aklat
  choice: Isinalin bilang isang maharlikang talaan at nilinaw sa talababa na hindi ito kinakailangang ang biblikal na Mga Cronica.
  alternative: Aklat ng mga Cronica ng mga Hari ng Israel
  rationale: Ang konteksto at pormula ng Hebreo ay tumutukoy sa isang pinagkunang rekord tungkol sa mga hari ng Israel. Hindi dapat ipalagay na ito ang kanonikong Mga Cronica.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang retorikal na tanong at ang pormulang estilo ng buod ng paghahari, ngunit ginawang natural ang ayos ng pangungusap. Inilagay ang talababa sa dulo ng pamagat na siyang aktuwal na nililinaw nito.
