base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: tl
  text: “May kasunduan sa pagitan natin, at may kasunduan din sa pagitan ng aking ama at ng iyong ama. Tingnan mo, nagpadala ako sa iyo ng suhol na pilak at ginto. Humayo ka, sirain mo ang kasunduan mo kay Baasa, na hari ng Israel, upang umatras siya mula sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: kasunduan
  rationale: Likas at malinaw na salin ng tipan o pormal na kasunduan sa pagitan ng mga hari; iniiwasan ang labis na panrelihiyong pakahulugan dito.
- source_word: שֹׁחַד
  choice: suhol
  rationale: Karaniwang tumutukoy ang salita sa bayad na naglalayong impluwensiyahan ang pasiya; akma ito dahil ipinadadala ang pilak at ginto upang sirain ng hari ang dati niyang kasunduan.
- source_word: הָפֵרָה
  choice: sirain mo
  rationale: Ipinahahayag ang tahasang utos na pawalang-bisa o labagin ang umiiral na kasunduan.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: upang lumayo siya sa akin
  rationale: Pinananatili ang larawang paglayo o pag-alis mula sa nagsasalita nang hindi dinaragdagan ang di-tiyak na paraan ng pag-urong ni Baasa.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “May kasunduan tayo” bilang natural na katumbas ng Hebreong nominal clause, at ang “gaya ng” upang malinaw na maipakita na ang kasalukuyang ugnayan ay inihahambing sa kasunduan ng kanilang mga ama.
