  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: tl
  text: Pinaalis niya mula sa lupain ang mga lalaking patutot sa kulto,[a] at inalis niya ang lahat ng kasuklam-suklam na mga diyus-diyosan[b] na ginawa ng kaniyang mga ninuno.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang panlalaking katawagan para sa mga lalaking nakaugnay sa ipinagbabawal na gawaing seksuwal sa kulto. Maaari ring isalin na “mga lalaking nakatalaga sa kulto.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay isang mapanghamak na tawag sa mga diyus-diyosan at maaari pang magpahiwatig ng “mga diyus-diyosang parang dumi.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “kaniyang mga ama”; isang idyoma para sa kaniyang mga ninuno o mga naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: Pinaalis niya
  rationale: Ang Hiphil ng עבר sa kontekstong ito ay nangangahulugang alisin o palayasin mula sa isang lugar. Ang “pinaalis” ay likas sa Filipino at hindi labis na nagtatakda kung paano sila inalis.
- source_word: הַקְּדֵשִׁים
  choice: ang mga lalaking naglilingkod bilang mga patutot sa pagsamba
  rationale: Tumutukoy ang panlalaking pangmaramihang anyo sa mga lalaking kaugnay ng ipinagbabawal na seksuwal na gawain sa konteksto ng pagsamba. Iniiwasan ng saling ito ang mapanlinlang na tradisyonal na katawagan at hindi ito binabasa bilang simpleng “mga banal.”
- source_word: מִן הָאָרֶץ
  choice: sa lupain
  rationale: Sa konstruksyong “pinaalis ... sa lupain,” natural na ipinahahayag ng “sa” ang pag-alis mula sa nasasakupan, malamang na lupain ng Juda.
- source_word: וַיָּסַר
  choice: inalis niya
  rationale: Ang Hiphil ng סור ay nangangahulugang alisin o ilayo. Malinaw at natural ang “inalis” sa Filipino.
- source_word: כָּל הַגִּלֻּלִים
  choice: ang lahat ng kasuklam-suklam na mga diyus-diyosan
  rationale: Ang גִּלּוּלִים ay mapanghamak na tawag sa mga diyus-diyosan. Pinananatili ng “kasuklam-suklam” ang malakas na negatibong himig nang hindi gumagamit ng di-likas na literal na ekspresyong “dumi-diyus-diyosan.”
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: na ginawa ng kaniyang mga ninuno
  rationale: Ang “mga ama” sa Hebreo ay isang idyoma para sa mga naunang salinlahi o ninuno. Mas natural at malinaw sa modernong Filipino ang “mga ninuno,” habang hindi ipinapalagay na si Asa mismo ang gumawa ng mga iyon.
theological_decisions:
- issue: Pagpapakahulugan sa אֲבֹתָיו
  choice: kaniyang mga ninuno
  alternative: kaniyang mga ama
  rationale: Bagaman literal na “mga ama,” idyomatiko itong tumutukoy sa mga naunang salinlahi. Ang “mga ninuno” ang natural na Filipino at hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Pagkakakilanlan ng הַקְּדֵשִׁים
  choice: mga lalaking naglilingkod bilang mga patutot sa pagsamba
  alternative: mga lalaking nakatalaga sa kulto
  rationale: Ipinakikita ng konteksto at gamit ng salita na mga lalaki silang kaugnay ng ipinagbabawal na gawaing seksuwal sa pagsamba. Gayunman, inilalahad sa talababa na maaaring mas pangkalahatan ang katawagan upang mapanatili ang leksikal na pag-iingat.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagsamba” sa halip na teknikal na “kulto” sa pangunahing teksto; pinanatili ang teknikal na alternatibo sa talababa. Ang “kaniyang” ay pormal at angkop sa estilong biblikal.
