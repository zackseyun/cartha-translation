  source_fidelity: Tumpak ang dalawang kilos ni Asa at ang mga layon ng mga ito. Gayunman, ang “mula sa lupain” ang tuwirang katumbas ng מִן־הָאָרֶץ at mas malinaw na nagsasaad ng pagpapaalis palabas ng lupain kaysa “sa lupain.” Ang mapanghamak na himig ng גִּלּוּלִים ay angkop na naipahayag sa “kasuklam-suklam na mga diyus-diyosan.”
  naturalness: Marangal at likas ang daloy sa modernong Filipino. Mas malinaw at mas tuwiran ang “mga lalaking patutot sa kulto” kaysa sa “mga lalaking naglilingkod bilang mga patutot sa pagsamba,” na maaaring magmukhang inilalarawan ang paraan ng kanilang pagsamba sa halip na ang kanilang tungkuling kaugnay ng kulto.
  terminology: Ang “diyus-diyosan,” “lupain,” at “mga ninuno” ay angkop. Pinananatili ng “mga lalaking patutot sa kulto” ang panlalaking anyo at ang ugnayang pangkulto ng קְדֵשִׁים, nang hindi ginagamit ang di-tumpak na tradisyonal na katawagan.
