id: 1KI.15.4
reference: 1 Kings 15:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: tl
  text: Gayunman, alang-alang kay David, binigyan siya ni Yahweh na kanyang Diyos ng isang ilawan[a] sa Jerusalem, upang ibangon ang kanyang anak na hahalili sa kanya at patatagin ang Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “liwanag.” Ang pagbibigay ng “ilawan” sa Jerusalem ay talinghaga para sa pagpapanatili roon ng maharlikang angkan ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Gayunman
  rationale: Sa konteksto, ipinakikita ng sugnay kung bakit hindi lubusang pinutol si Abiam sa kabila ng kanyang kasalanan; kaya ang panandang pasalungat na “Gayunman” angkop sa daloy ng diskurso.
- source_word: לְמַעַן דָּוִד
  choice: alang-alang kay David
  rationale: Likas na idyomang Tagalog ito para sa pagkilos dahil sa pagsasaalang-alang sa isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili ang panghalip ng Hebreo at hindi labis na tinutukoy sa pangunahing teksto kung sino ang tinutukoy nito.
- source_word: נִיר
  choice: ilawan
  rationale: Pinananatili ang kongkretong talinghaga ng Hebreo para sa pagpapatuloy ng maharlikang angkan ni David.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Likas na lokatibong salin sa Tagalog.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: upang ibangon ang kanyang anak na hahalili sa kanya
  rationale: Ipinahahayag ang layunin at ginagawang malinaw ang dinastikong paghalili nang hindi inaalis ang diwa ng “ibangon.”
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: at patatagin ang Jerusalem
  rationale: Ang causative na anyo ay tumutukoy sa pagpapanatiling matatag sa Jerusalem bilang sentro ng paghahari; natural at malinaw ang “patatagin” sa Tagalog.
theological_decisions:
- issue: Talinghagang נִיר kaugnay ng tipan kay David
  choice: Panatilihin ang “ilawan” sa pangunahing teksto
  alternative: angkan; dinastiya; liwanag
  rationale: Hindi pinaplat ang talinghaga ng Hebreo at napapanatili ang ugnayan nito sa ibang mga talata tungkol sa nagpapatuloy na angkan ni David.
- issue: Tinutukoy ng “kanyang Diyos”
  choice: Panatilihin ang panghalip nang hindi tahasang pinapangalanan ang tinutukoy
  alternative: Tukuying tahasan si Abiam o si David
  rationale: Bagaman malamang na ang hari sa konteksto ang tinutukoy, pinananatili ng salin ang anyo at posibleng tensiyon ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayunman” para sa ugnayang pasalungat sa konteksto, “alang-alang kay David” bilang likas na idyoma, at mga pariralang may “upang” upang mapanatili ang layuning ipinahahayag ng mga pawatas sa Hebreo.
