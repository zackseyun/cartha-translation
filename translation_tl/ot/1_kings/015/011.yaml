id: 1KI.15.11
reference: 1 Kings 15:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: tl
  text: Ginawa ni Asa ang matuwid sa paningin ni Yahweh, gaya ng ginawa ng kanyang amang si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ninunong si David.” Ang “ama” rito ay tumutukoy sa isang ninuno sa maharlikang angkan, hindi sa agarang ama ni Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Karaniwang nangangahulugang “gumawa” o “gawin” ang עשה. Sa pormulang sumusuri sa isang hari, natural sa Tagalog ang “ginawa … ang matuwid.”
- source_word: אָסָא
  choice: Asa
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalang pantangi.
- source_word: הַיָּשָׁר
  choice: ang matuwid
  rationale: Ang יָשָׁר ay nangangahulugang “tuwid,” “matuwid,” o “tama.” Pinananatili ng “ang matuwid” ang moral na pagtatasa at ang marangal na himig ng talata.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong tayutay na tumutukoy sa pagtatasa mula sa pananaw ng isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: כְּדָוִד
  choice: gaya ng ginawa … ni David
  rationale: Ang כְּ ay naghahayag ng paghahambing. Inulit ang “ginawa” upang maging malinaw at natural sa Tagalog ang ipinahihiwatig na paghahambing.
- source_word: אָבִיו
  choice: kanyang amang si David
  rationale: Ang אָב ay maaaring tumukoy sa ama o sa isang ninuno. Pinanatili sa pangunahing teksto ang literal at dinastikong katawagang “ama,” habang nililinaw sa talababa ang kahulugang ninuno.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong pangalan sa halip na palitan ng isang titulo.
- issue: Kahulugan ng “ama” sa kaugnayan ni David kay Asa
  choice: Pinanatili ang “ama” bilang wikang dinastiko o pangkanununuan
  alternative: ninuno
  rationale: Ginagamit ng Hebreo ang אָבִיו. Hindi agarang ama ni Asa si David, ngunit maaaring tawaging “ama” ang isang ninuno sa maharlikang angkan; nililinaw ito sa talababa nang hindi inaalis ang anyo ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong tayutay na “sa paningin” at ang dinastikong katawagang “ama,” na nilinaw sa talababa.
