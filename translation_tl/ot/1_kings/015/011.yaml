  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang ginawa ni Asa, ang moral na pagtatasa (“ang matuwid”), ang idiomang “sa paningin ni,” ang pangalang Yahweh, at ang paghahambing kay David na tinatawag na kanyang “ama.” Ang idinagdag na “ginawa” sa ikalawang bahagi ay lehitimong pagpapalinaw ng ipinahihiwatig na pandiwa sa paghahambing.'
