  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: tl
  text: Ngunit hindi inalis ang mga sambahan sa matataas na lugar. Gayunman, buong-pusong tapat si Asa kay Yahweh sa buong buhay niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Buong-buo ang katapatan ni Asa kay Yahweh sa buong buhay niya.” Sa literal: “Ang puso ni Asa ay buo kasama ni Yahweh sa lahat ng kanyang mga araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: ang matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lokal na lugar o dambana ng pagsamba, madalas nasa mataas na pook. Mas malinaw sa karaniwang mambabasa ang “matataas na sambahan” kaysa sa literal ngunit maaaring malabong “matataas na lugar.”
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Kapag ang mga sambahan ang simuno, ang סוּר ay tumutukoy sa hindi pag-aalis o pagpawi sa mga ito bilang bahagi ng reporma.
- source_word: רַק
  choice: Gayunman
  rationale: 'Dito, ang רַק ay nagpapakilala ng pasalungat na pahayag: sa kabila ng hindi pag-aalis sa mga sambahan, pinagtitibay ang katapatan ni Asa.'
- source_word: לְבַב אָסָא הָיָה שָׁלֵם
  choice: buong-pusong nanatiling tapat si Asa
  rationale: Ang לֵבָב ay tumutukoy sa kalooban at panloob na pagkatao, at ang שָׁלֵם sa kontekstong ito ay ganap o hindi nahahating katapatan, hindi kawalang-kasalanan. Ang pandiwang “nanatiling” ay likas na nagpapahayag ng patuloy na kalagayang ipinahihiwatig ng הָיָה kasama ng temporal na parirala.
- source_word: עִם יְהוָה
  choice: kay Yahweh
  rationale: Literal na “kasama ni Yahweh,” ngunit dahil sa idyomang Filipino na “tapat kay,” natural na ginamit ang “kay Yahweh” habang pinananatili ang personal na pangalan.
- source_word: כָּל יָמָיו
  choice: sa buong buhay niya
  rationale: Natural na Filipino para sa literal na “lahat ng kanyang mga araw,” na pinananatili ang saklaw ng buong buhay.
theological_decisions:
- issue: Ang kahulugan ng “buo” o “ganap” na puso ni Asa kahit hindi naalis ang matataas na sambahan
  choice: Ang talata ay nagpapatunay sa pangkalahatan at hindi nahahating katapatan ni Asa kay Yahweh, hindi sa lubos na kawalang-kasalanan o perpektong reporma.
  alternative: Maaaring isalin nang mas literal bilang “ang puso ni Asa ay buo kay Yahweh,” ngunit maaaring mapagkamalan itong pahayag ng moral na kasakdalan.
  rationale: Sadyang magkatabi sa Hebreo ang hindi pag-aalis sa mga sambahan at ang שָׁלֵם na puso. Pinananatili ng “buong-pusong nanatiling tapat” ang tensiyong ito nang hindi ipinapakahulugan ang שָׁלֵם bilang kawalang-kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matataas na sambahan” upang ipaliwanag ang kultikong kahulugan ng בָּמוֹת, at pinanatili ang pangalang “Yahweh.”
