base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: tl
  text: Sa ikalabing-walong taon ni Haring Jeroboam na anak ni Nebat, naging hari ng Juda si Abiam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Abiam”; ang hari ring ito ay tinatawag na “Abias” sa ibang mga talata.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: Sa ... taon
  rationale: Karaniwang pormula ito ng pagtatakda ng panahon sa salaysay. Hindi na hiwalay na isinalin ang וּ dahil magiging mabigat at hindi likas ang “At sa” sa makabagong Filipino.
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: ikalabing-walo
  rationale: Ginamit ang panunurong bilang sapagkat tumutukoy ito sa taon ng paghahari ng isang hari.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: ni Haring Jeroboam na anak ni Nebat
  rationale: Likas sa Filipino ang “ni Haring” sa ganitong pormulang pangkronolohiya, at malinaw na pinananatili ng “na anak ni Nebat” ang patronimiko.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormula ng pagluklok, ipinahihiwatig ng pandiwa ang pagsisimula ng pagiging hari, hindi lamang ang pangkalahatang paghahari.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Sinusunod ng pangunahing teksto ang tiyak na anyong אֲבִיָּם sa Masoretic Text; ipinaliliwanag sa talababa ang ibang anyo ng pangalan sa ibang talata.
- source_word: עַל יְהוּדָה
  choice: ng Juda
  rationale: Kasama ng “naging hari,” malinaw at likas na ipinahahayag ng “hari ng Juda” ang pamamahala niya sa Juda.
