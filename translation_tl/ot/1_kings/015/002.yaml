  text: שָׁלֹ֣שׁ שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: tl
  text: Tatlong taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Maaca, na anak na babae ni Abisalom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang konteksto ng talaangkanan, ang Hebreong “anak na babae” ay maaari ring tumukoy nang mas malawak sa isang babaeng inapo. Ang pangalang Hebreo rito ay Abisalom, na tinatawag ding Absalom sa ibang anyo ng pangalan.
    reason: Pinagsamang paglilinaw sa posibleng mas malawak na ugnayang genealogical at sa alternatibong anyo ng pangalan.
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: Tatlong taon
  rationale: Tuwirang ipinapahayag ng bilang at pangngalang maramihan ang tagal ng paghahari; natural ito sa makabagong Tagalog.
- source_word: מָלַךְ
  choice: naghari
  rationale: Ang Qal ng מלך dito ay tumutukoy sa pamamahala bilang hari, hindi lamang sa pagluklok.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol na ב ay nagsasaad ng lugar; karaniwang anyo sa Tagalog ang “sa Jerusalem.”
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormulang panghari ngunit hinahati sa hiwalay na pangungusap upang maging malinaw at natural sa Tagalog.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Ginamit ang malinaw na transliterasyong Filipino ng pangalang Hebreo.
- source_word: בַּת
  choice: anak na babae / anak
  rationale: Ang payak na kahulugan ay “anak na babae”; sa mismong pangungusap, sapat at natural ang “anak” dahil babae na si Maaca, habang ipinapaliwanag sa talababa ang posibleng mas malawak na gamit sa talaangkanan.
- source_word: אֲבִישָׁלוֹם
  choice: Abisalom
  rationale: Iniaangkop sa baybay at tunog ng Filipino ang anyong Hebreo na Abishalom, sa halip na awtomatikong gamitin ang kaugnay na anyong Absalom.
theological_decisions:
- issue: Saklaw ng ugnayang ipinahahayag ng בַּת אֲבִישָׁלוֹם
  choice: Pinanatili sa pangunahing teksto ang tuwirang ugnayang “anak ni Abisalom.”
  alternative: Maaaring tumukoy sa isang babaeng inapo ni Abisalom, gaya ng apo.
  rationale: “Anak na babae” ang literal na kahulugan ng בַּת, ngunit maaari itong gamitin nang mas malawak sa ilang kontekstong pang-talaangkanan. Hindi nilulutas ng salin ang historikal na tanong; inilalagay sa talababa ang tunay na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naghari” bilang likas na katumbas ng pormulang panghari at hinati sa dalawang pangungusap para sa maayos na daloy.
