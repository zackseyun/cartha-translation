translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong talinghaga sa pormula ng kamatayan, ngunit ginawang natural ang parirala. Hindi nilagyan ng talababa ang “Abiam” sapagkat walang alternatibong pangalan sa mismong Hebreong talatang ito; ang impormasyong “Abias” sa kaugnay na mga talata ay hindi kailangan upang maunawaan ang kasalukuyang teksto.
