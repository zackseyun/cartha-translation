base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: tl
  text: At nahimlay si Abiyam kasama ng kanyang mga ninuno[a], at inilibing nila siya sa Lunsod ni David. Pagkatapos, naging hari ang anak niyang si Asa bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nahimlay kasama ng kanyang mga ninuno” ay isang nakaugaliang Hebreong pahayag para sa pagkamatay.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Bahagi ito ng karaniwang Hebreong pormula para sa kamatayan. Pinananatili ng “nahimlay” ang talinghaga nang hindi gumagamit ng pariralang maaaring magkaroon ng ibang kahulugan sa modernong Tagalog.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Ito ang anyo ng pangalan sa Hebreong teksto ng talatang ito; iniangkop ang transliterasyon sa karaniwang baybay at bigkas sa Filipino.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Sa pormula ng kamatayan, tumutukoy ang אבות sa mga naunang salinlahi. Mas malinaw at natural sa kasalukuyang Filipino ang “mga ninuno” kaysa literal na “mga ama,” habang pinananatili ang pampamilya at dinastikong diwa.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: at inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan sa Hebreo nang hindi tinutukoy kung sino ang mga naglibing.
- source_word: בְּעִיר דָּוִד
  choice: sa Lungsod ni David
  rationale: Ito ang malinaw at nakaugaliang anyo ng pangalan ng lugar sa Filipino.
- source_word: וַיִּמְלֹךְ
  choice: naging hari
  rationale: Sa pormula ng paghalili sa trono, ipinahihiwatig ng pandiwa ang pagsisimula ng paghahari, hindi lamang ang pagpapatuloy nito.
- source_word: אָסָא בְנוֹ
  choice: ang anak niyang si Asa
  rationale: Natural sa modernong Filipino at malinaw na si Asa ang anak ni Abiam.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahahayag nito ang paghalili sa tungkulin ng hari; mas natural ito sa Filipino kaysa sa literal na “sa kanyang lugar.”
