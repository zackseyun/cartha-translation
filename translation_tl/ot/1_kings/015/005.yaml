  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: tl
  text: sapagkat ginawa ni David ang matuwid sa paningin ni Yahweh at hindi siya lumihis sa alinman sa iniutos sa kanya ni Yahweh sa buong buhay niya, maliban sa usapin ni Uria na Heteo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliban sa kaso ni Uria na Heteo.”
    reason: Ipinapakita ang alternatibong natural na salin ng בִּדְבַר bilang “sa kaso,” sa halip na “sa usapin.”
lexical_decisions:
- source_word: אֲשֶׁר
  choice: sapagkat
  rationale: Sa konteksto, ipinakikilala ng pang-ugnay ang dahilan ng naunang pahayag sa talata 4; malinaw itong naihahayag ng “sapagkat.”
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: ginawa ... ang matuwid
  rationale: Likas at marangal na salin ito ng idyomang tumutukoy sa paggawa ng tama o matuwid.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang Hebreong metapora ng pagsusuri ayon sa paningin ng Diyos at natural ito sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos ayon sa default ng proyekto.
- source_word: וְלֹא סָר
  choice: at hindi siya lumihis
  rationale: Ipinahihiwatig ng pandiwang סור ang paglihis mula sa landas ng pagsunod; malinaw at natural ang “lumihis.”
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: sa alinman sa iniutos sa kanya ni Yahweh
  rationale: Ipinapanatili ng “alinman” ang saklaw ng כֹּל sa negatibong pangungusap. Inulit ang “Yahweh” upang maiwasan ang malabong reperensiya ng mga panghalip sa Tagalog.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: sa buong buhay niya
  rationale: Natural na modernong Tagalog ito para sa Hebreong pariralang literal na “lahat ng mga araw ng kanyang buhay.”
- source_word: רַק
  choice: maliban
  rationale: Dito, ipinakikilala ng רַק ang nag-iisang hayag na eksepsiyon sa naunang papuri.
- source_word: בִּדְבַר אוּרִיָּה
  choice: sa bagay na may kinalaman kay Uria
  rationale: Ang דָּבָר sa konstruksiyong ito ay maaaring mangahulugang bagay, usapin, o kaso. Natural sa Tagalog ang napiling parirala at hindi nito dinaragdagan ang detalye ng teksto.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria na Heteo
  rationale: Karaniwang anyong Tagalog ng pangalan at tuwirang salin ng katawagang etniko.
theological_decisions:
- issue: Malawak na papuri sa pagsunod ni David sa kabila ng iba pa niyang kilalang kasalanan
  choice: Panatilihin ang malawak na papuri ng teksto at ang iisang tahasang binanggit na eksepsiyon.
  alternative: Ipaliwanag na karaniwang tapat lamang si David, o magdagdag ng paliwanag tungkol sa pagsisisi o katapatan sa tipan.
  rationale: Ang mismong talata ang naglalahad ng papuri at ng eksepsiyon nang hindi ipinapaliwanag ang tensiyon. Hindi dapat lutasin iyon ng salin sa pamamagitan ng idinagdag na teolohiya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang Hebreong idyomang “sa paningin” at ginawang tahasan ang pangalang Yahweh sa ikalawang sugnay upang maiwasan ang kalituhan ng panghalip.
