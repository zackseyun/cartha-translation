id: 1KI.15.27
reference: 1 Kings 15:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: tl
  text: Pagkatapos, nakipagsabwatan laban sa kanya si Baasa na anak ni Ahias, mula sa angkan ni Isacar. Pinatay siya ni Baasa sa Gibeton, na sakop ng mga Filisteo,[a] habang kinukubkob ni Nadab at ng buong Israel ang Gibeton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na pag-aari ng mga Filisteo.”
    reason: Pinananatili ang posibilidad na ang parirala ay tumutukoy sa pag-aari, bagaman sa kontekstong militar maaari rin itong tumukoy sa aktuwal na pagkontrol.
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: nakipagsabwatan laban sa kanya
  rationale: Ang קשר עַל ay tumutukoy sa pagbuo o pakikilahok sa isang sabwatan laban sa isang tao, lalo na sa kontekstong pampolitika.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa na anak ni Ahias
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal at ang natural na pariralang nagpapahayag ng kaugnayang ama-anak.
- source_word: לְבֵית יִשָּׂשכָר
  choice: mula sa angkan ni Isacar
  rationale: Dito, ang בֵּית ay tumutukoy sa pinagmulang angkan o lipi, hindi lamang sa isang literal na sambahayan.
- source_word: וַיַּכֵּהוּ
  choice: Pinatay siya
  rationale: Bagaman literal na nangangahulugang 'sinaktan o pinabagsak siya,' malinaw sa salaysay na nakamamatay ang ginawa; 'pinatay' ang pinakanatural at tiyak sa modernong Filipino.
- source_word: בְּגִבְּתוֹן
  choice: sa Gibeton
  rationale: Ang 'sa' ang natural na panandang Filipino para sa lugar na pinangyarihan ng pagpatay.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: na sakop ng mga Filisteo
  rationale: Maaaring magpahiwatig ang lamed ng pag-aari o pagkontrol; sa kontekstong militar, malinaw at natural ang 'sakop ng mga Filisteo' nang hindi iginiit ang legal na pagmamay-ari.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: habang kinukubkob ni Nadab at ng buong Israel
  rationale: Ang waw ay nagpapakilala rito ng kalagayang kasabay ng pangunahing pangyayari; natural itong ipinahahayag sa Filipino sa pamamagitan ng 'habang.'
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: kinukubkob ... ang Gibeton
  rationale: Ang צור עַל ay karaniwang terminong militar para sa pagkubkob sa isang lungsod; pinananatili ng aspektong imperpektibo ang nagpapatuloy na pagkilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'angkan' para sa pagkakaugnay sa lipi at 'kinukubkob' bilang madaling maunawaang terminong militar. Inilipat ang panandang talababa upang agad sumunod sa pariralang tinutukoy nito.
