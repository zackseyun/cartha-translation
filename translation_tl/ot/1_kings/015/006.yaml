base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: tl
  text: At nagkaroon ng digmaan sa pagitan nina Rehoboam at Jeroboam sa lahat ng araw ng kanyang buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa lahat ng araw ng buhay ni Rehoboam.” Dahil sa nakapaligid na konteksto at mga usaping tekstuwal, inuunawa naman ng ilang tagapagpaliwanag na ang panghalip ay tumutukoy kay Abias (Abijam).
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: At nagkaroon ng digmaan
  rationale: Pinananatili ng “At” ang ugnayang pasalaysay, at ang “digmaan” ang natural at tuwirang katumbas ng מִלְחָמָה.
- source_word: הָיְתָה
  choice: nagkaroon
  rationale: Sa eksistensiyal na gamit ng היה, likas sa Tagalog ang “nagkaroon”; hindi nito idinaragdag ang kahulugang “nagpatuloy,” bagaman maaaring ipinahihiwatig ng konteksto ang tuloy-tuloy na alitan.
- source_word: בֵין ... וּ/בֵין
  choice: sa pagitan nina ... at ...
  rationale: Ang magkatambal na pang-ukol ay tumutukoy sa dalawang panig ng tunggalian; “sa pagitan nina” ang natural na anyo para sa dalawang pangalan ng tao.
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Isinulat ang pangalan ayon sa karaniwang anyong ginagamit sa makabagong saling Filipino.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Isinulat ang pangalan ayon sa karaniwang anyong ginagamit sa makabagong saling Filipino.
- source_word: כָּל יְמֵי
  choice: sa lahat ng araw ng
  rationale: Pinananatili nito ang anyo ng idyomang Hebreo habang malinaw pa ring tumutukoy sa buong haba ng buhay.
- source_word: חַיָּיו
  choice: kanyang buhay
  rationale: Ang panlalaking panghalip na hulapi ay tuwirang isinalin bilang “kanyang,” nang hindi tinutukoy sa pangunahing teksto kung sino ang tinutukoy nito.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa “lahat ng araw ng kanyang buhay”
  choice: Pinanatili ang “kanyang buhay” nang hindi tahasang pinapangalanan ang tinutukoy.
  alternative: “sa lahat ng araw ng buhay ni Rehoboam”; inuunawa naman ng ilang tagapagpaliwanag na si Abias (Abijam) ang tinutukoy.
  rationale: Panlalaking isahan ang hulaping Hebreo, ngunit hindi tahasang tinutukoy ng sugnay ang antecedent nito. Pinananatili ng salin ang tunay na kalabuan at inilalagay sa talababa ang mga pangunahing pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyoma na “lahat ng araw ng kanyang buhay” upang hindi mawala ang kalabuan ng panghalip.
