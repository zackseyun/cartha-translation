id: 1KI.15.26
reference: 1 Kings 15:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh. Namuhay siya ayon sa landas ng kanyang ama at ayon sa kasalanan nito, na naging dahilan upang magkasala ang Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Pinananatili ang nakaugaliang pormula sa Mga Hari at natural itong nauunawaan sa makabagong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora ng pagtataya at ang personal na pangalang יהוה.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: Namuhay siya ayon sa landas ng kanyang ama
  rationale: Ang הלך בדרך ay metapora para sa asal o paraan ng pamumuhay; ipinahahayag ito nang malinaw habang pinananatili ang larawan ng landas.
- source_word: וּבְחַטָּאתוֹ
  choice: at ayon sa kasalanan nito
  rationale: Ang hulaping panlalaki ay tumutukoy sa ama; ginamit ang “nito” upang maiwasan ang kalituhan sa kasalanan ng kasalukuyang hari.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: na naging dahilan upang magkasala ang Israel
  rationale: Malinaw na ipinahahayag ang sanhiang anyo ng חטא nang hindi dinaragdagan ang teolohikal na nilalaman.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ng titulo.
- issue: Pananagutan sa kasalanan ng Israel
  choice: naging dahilan upang magkasala ang Israel
  alternative: inakay ang Israel sa kasalanan
  rationale: Pinananatili ang tahasang sanhiang diwa ng Hiphil הֶחֱטִיא; hindi ito pinalalambot bilang impluwensiya lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap para sa likas na daloy, ngunit pinanatili ang pagkakaugnay ng pagsusuring moral, halimbawa ng ama, at bunga nito sa Israel.
