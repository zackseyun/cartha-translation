base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: tl
  text: Nakinig[a] si Ben-hadad kay Haring Asa at ipinadala niya ang mga kumander ng kanyang mga hukbo laban sa mga lungsod ng Israel. Sinalakay niya ang Ijon, Dan, Abel-bet-maaca, ang buong Kinerot,[b] at ang buong lupain ng Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Dininig ni Ben-hadad si Haring Asa.” Ang idyomang Hebreo ay maaaring mangahulugang nakinig siya nang may pagsang-ayon at kumilos ayon sa kahilingan.
    reason: lexical_alternative
  - marker: b
    text: Ang Kinerot ay pangalan ng isang pook dito, malamang isang distrito o rehiyon, at hindi ang pangkaraniwang salitang nangangahulugang “mga alpa.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: Pinakinggan
  rationale: Ang idyomang Hebreo ay nangangahulugang nakinig o tumugon nang pabor sa isang kahilingan. Pinananatili ng “Pinakinggan” ang karaniwang larawan ng pakikinig, samantalang nililinaw ng sumunod na kilos na tumugon si Ben-hadad.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: mga kumander ng kanyang mga hukbo
  rationale: Sa kontekstong militar, ang שָׂרֵי ay mga pinuno o kumander at ang חֲיָלִים ay mga hukbo o puwersang militar. Likas at malinaw sa modernong Filipino ang pariralang ito.
- source_word: אֲשֶׁר לוֹ
  choice: kanyang
  rationale: Ipinahahayag ng parirala ang pag-aari o pagpapasakop sa pamumuno ni Ben-hadad. Sapat at natural itong naipapakita ng pang-angkop na “kanyang.”
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: laban sa mga lungsod ng Israel
  rationale: Kasama ng pandiwang “ipinadala” at sa kontekstong militar, ipinakikita ng עַל na ang mga lungsod ang puntirya ng paglusob.
- source_word: וַיַּךְ
  choice: Sinalakay niya
  rationale: Malawak ang saklaw ng נכה—humampas, sumalakay, o tumalo. Ipinahahayag ng “sinalakay” ang malinaw na kilos-militar nang hindi ipinagpapalagay na ganap na natalo o nilipol ang mga lugar.
- source_word: כָּל כִּנְרוֹת
  choice: ang buong Kinerot
  rationale: Pangalan ng isang pook o rehiyon ang Kinerot dito. Ang “buong” ay kumakatawan sa כָּל at nagpapahiwatig ng kabuuang sakop nang hindi ginagawang pangkaraniwang pangngalan ang pangalan.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: pati ang buong lupain ng Neftali
  rationale: Sa hulihan ng talaan, maaaring palawakin ng עַל ang saklaw mula sa mga binanggit na pook tungo sa mas malawak na lupain. Natural na naipahahayag sa Filipino ng “pati” ang ugnayang ito.
