  to: Nakinig[a] si Ben-hadad kay Haring Asa at ipinadala niya ang mga kumander ng kanyang mga hukbo laban sa mga lungsod ng Israel. Sinalakay niya ang Ijon, Dan, Abel-bet-maaca, ang buong Kinerot,[b] at ang buong lupain ng Neftali.
