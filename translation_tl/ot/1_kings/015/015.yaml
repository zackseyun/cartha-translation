  source_fidelity: 'Tumpak ang pangunahing salin sa Hebreo: si Asa ay nagdala sa bahay ni Yahweh ng mga bagay na itinalaga bilang banal ng kanyang ama at ng sarili niyang mga banal na bagay. Ang “pilak, ginto, at mga sisidlan” ay maayos na nagpapanatili sa nakalistang mga bagay at sa kaugnayan nito sa naunang parirala.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “bahay ni Yahweh” ay literal ngunit madaling maunawaan sa relihiyosong rehistro; ang em dash ay katanggap-tanggap na panandang paglilinaw o paglalapat ng talaan.
