base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: tl
  text: At dinala niya sa bahay ni Yahweh ang mga banal na bagay ng kanyang ama at ang sarili niyang mga banal na bagay[a]—pilak, ginto, at mga sisidlan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga bagay na inialay ng kanyang ama at ang mga bagay na siya mismo ang nag-alay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: At dinala niya
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “ipasok.” Dahil tahasang binanggit ang patutunguhan, natural at sapat ang “dinala niya.”
- source_word: קָדְשֵׁי אָבִיו
  choice: ang mga banal na bagay ng kanyang ama
  rationale: Tumutukoy ang pangmaramihang anyong construct sa mga bagay na ibinukod o inialay bilang banal. Pinananatili ng salin ang kultikong diwa at ang posibilidad na maunawaan ito bilang mga bagay na inialay ng ama.
- source_word: וְקָדְשׁוֹ
  choice: at ang sarili niyang mga banal na bagay
  rationale: Kolektibo ang gamit ng pangngalang may panlaping panghalip. Pinananatili nito ang pagkakatulad sa naunang parirala at ang leksikal na ambiguwidad kung pag-aari ba niya o siya mismo ang nagtalaga ng mga ito.
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang karaniwang Hebreong tawag sa santuwaryo, sa halip na gawing mas tiyak na “templo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan ng Diyos.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: pilak, ginto, at mga sisidlan
  rationale: Malamang na inililista ng mga pangngalan ang nilalaman o uri ng mga banal na bagay. Malawak ang “mga sisidlan” at angkop sa konteksto ng santuwaryo.
theological_decisions:
- issue: Paglalarawan sa mga bagay bilang קֹדֶשׁ
  choice: mga banal na bagay
  alternative: mga bagay na inialay
  rationale: Pinananatili ng pangunahing teksto ang sagradong katangian ng mga bagay nang hindi tahasang nagpapasya kung sino ang nag-alay sa mga ito; ibinibigay sa talababa ang mas dinamikong pagbasa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang יְהוָה; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang Hebreong idyoma, at em dash upang malinaw na ipakilalang ang pilak, ginto, at mga sisidlan ay paglilinaw sa mga banal na bagay.
