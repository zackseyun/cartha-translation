base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Abiam[a], at ang lahat ng ginawa niya, hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda[b]? At nagkaroon ng digmaan sa pagitan ni Abiam at ni Jeroboam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag na Abias si Abiam sa ilang kaugnay o katumbas na talata; Abiam ang mababasa sa tekstong Hebreo rito.
    reason: alternative_reading
  - marker: b
    text: O, “Aklat ng mga Talaan ng mga Hari ng Juda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ang iba pang mga ginawa
  rationale: Sa pormulang pangwakas tungkol sa mga hari, tumutukoy ito sa natitirang mga gawa o pangyayari sa paghahari, hindi lamang sa mga salita.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Tuwirang tinutumbasan ang anyo ng pangalang nasa tekstong Hebreo rito at hindi ito itinutugma sa alternatibong anyong Abias.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng ginawa niya
  rationale: Pinananatili ang malawak at payak na diwa ng pandiwang עָשָׂה.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang anyo at diin ng retorikal na tanong sa Hebreo.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Aklat ng mga Kasaysayan
  rationale: Ipinahihiwatig ang isang nakasulat na opisyal na salaysay o talaan; natural itong pamagat sa makabagong Tagalog.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: ng mga Hari ng Juda
  rationale: Likas na ipinapahayag sa Tagalog ang ugnayan ng talaan sa mga hari sa pamamagitan ng pariralang may “ng.”
- source_word: וּמִלְחָמָה הָיְתָה
  choice: At nagkaroon ng digmaan
  rationale: Tuwirang inilalarawan ang pag-iral ng digmaan nang hindi nagdaragdag ng tahasang ideya ng pagpapatuloy.
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: sa pagitan ni Abiam at ni Jeroboam
  rationale: Natural na Tagalog para sa magkatunggaling dalawang panig na tinutukoy ng pares na בֵּין...וּבֵין.
