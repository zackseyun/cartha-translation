- from: Inalis din ni Asa si Maaca na kanyang ina sa pagiging inang reyna[a], sapagkat gumawa ito ng isang kasuklam-suklam na rebulto[b] para kay Ashera[c]. Pinutol ni Asa ang rebulto nito at sinunog sa Lambak ng Kidron.
  to: Inalis din ni Asa si Maaca, na kanyang ina, sa tungkulin bilang reynang ina[a], sapagkat gumawa siya ng isang kasuklam-suklam na bagay[b] para sa Ashera[c]. Pinutol ni Asa ang bagay niya at sinunog iyon sa Lambak ng Kidron.
  rationale: Pinalitan ang “rebulto” ng “kasuklam-suklam na bagay” upang mapanatili ang kawalang-katiyakan sa anyo ng מִפְלֶצֶת. Pinalitan ang “para kay” ng “para sa” upang huwag magpasya kung diyosa o sagisag ang Ashera. Inayos din ang mga pantukoy at katawagang pangmaharlika para sa mas natural na modernong Tagalog.
