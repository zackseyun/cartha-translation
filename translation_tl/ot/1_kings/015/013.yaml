  naturalness: Hindi natural at maaaring maging walang-galang ang “gumawa ito” para kay Maaca; “gumawa siya” ang karaniwang pagtukoy sa tao. Mas malinaw din ang “reynang ina” bilang katawagan sa queen mother at ang tahasang panghalip sa huling pangungusap.
  terminology: Panatilihin ang “Ashera” bilang transliterasyon. Gamitin ang “kasuklam-suklam na bagay” upang hindi magpahiwatig ng tiyak na anyo, at “para sa Ashera” upang mapanatili ang kalabuan ng referent.
