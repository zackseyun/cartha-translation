source:
  edition: WLC
  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: tl
  text: Inalis din ni Asa si Maaca, na kanyang ina, sa tungkulin bilang reynang ina[a], sapagkat gumawa siya ng isang kasuklam-suklam na bagay[b] para sa Ashera[c]. Pinutol ni Asa ang bagay niya at sinunog iyon sa Lambak ng Kidron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang ina.” Sa gamit na maharlika, maaari rin itong tumukoy sa lola o ibang babaeng ninuno.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang kakila-kilabot na bagay.” Hindi tiyak ang eksaktong anyo ng bagay na ito na ginagamit sa pagsamba.
    reason: lexical_alternative
  - marker: c
    text: Ang “Ashera” ay maaaring tumukoy sa diyosang Ashera o sa isang sagisag ng kanyang kulto, na madalas tawaging “poste ni Ashera.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Inalis din ni Asa
  rationale: Ipinahihiwatig ng וְגַם ang karagdagang reporma. Tahasang binanggit si Asa upang maging malinaw at natural sa Tagalog ang simula ng talata.
- source_word: מַעֲכָה אִמּוֹ
  choice: si Maaca na kanyang ina
  rationale: Pinananatili ang literal na 'kanyang ina' sa Hebreo, sa halip na itugma agad sa 'lola'; ipinaliliwanag sa talababa ang mas malawak na gamit nito sa kontekstong maharlika.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: sa pagiging inang reyna
  rationale: Ang hiphil ng סור ay pag-aalis sa tungkulin, at ang גְּבִירָה ay tumutukoy sa mataas na katayuan ng ina ng hari. Ang 'inang reyna' ay maikli at nauunawaang katawagan sa opisyal na papel.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: sapagkat gumawa ito
  rationale: Sa konteksto, ipinakikita ng parirala ang dahilan ng pagtanggal kay Maaca. Ginamit ang 'ito' upang maiwasan ang malabong pagtukoy ng magkasunod na 'niya/kanyang'.
- source_word: מִפְלֶצֶת
  choice: isang kasuklam-suklam na rebulto
  rationale: Taglay ng salita ang matinding negatibong pagtataya sa isang bagay na pangkulto. Ang 'rebulto' ay natural ngunit hindi lubusang nagtatakda sa eksaktong anyo; nililinaw sa talababa ang kawalang-katiyakan.
- source_word: לָאֲשֵׁרָה
  choice: para kay Ashera
  rationale: Pinananatili ang pangalang Ashera nang hindi nagpapasiya kung ang tinutukoy ay ang diyosa o ang sagisag nitong pangkulto.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: Pinutol ni Asa ang rebulto nito
  rationale: Pinananatili ng 'pinutol' ang kongkretong kahulugan ng כרת at ang posibilidad na yari sa kahoy o tulad ng poste ang bagay.
- source_word: וַיִּשְׂרֹף
  choice: sinunog
  rationale: Tuwirang salin ng pandiwang nangangahulugang sunugin.
- source_word: בְּנַחַל קִדְרוֹן
  choice: sa Lambak ng Kidron
  rationale: Ang נחל ay maaaring tumukoy sa wadi, bangin, o batis. Ang 'Lambak ng Kidron' ay natural at tumutugma sa kilalang lokasyon sa Jerusalem.
theological_decisions:
- issue: Ang tinutukoy ng אֲשֵׁרָה
  choice: Ashera, nang hindi tinutukoy kung diyosa o sagisag pangkulto
  alternative: ang diyosang Ashera; isang poste o sagisag ni Ashera
  rationale: Hindi tiyak sa Hebreo kung ang termino ay tumutukoy sa diyosa o sa kanyang sagisag. Yamang hiwalay nang binanggit ang ginawang bagay, ang transliterasyong 'Ashera' ang pinakamahusay na nagpapanatili sa tunay na kalabuan.
- issue: Relasyon ni Maaca kay Asa
  choice: kanyang ina
  alternative: kanyang lola o babaeng ninuno
  rationale: Ang mismong Hebreo ay 'kanyang ina,' bagaman maaari itong gamitin nang mas malawak sa wikang maharlika. Pinanatili sa teksto ang anyong Hebreo at inilagay sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'inang reyna' para sa tungkuling maharlika, at pinanatili ang 'Ashera' upang huwag lutasin ang kalabuan ng tekstong Hebreo. Inayos ang mga panandang talababa ayon sa pagkakasunod ng paglitaw sa pangunahing teksto.
