  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: tl
  text: Nang ikatlong taon ng paghahari ni Asa na hari ng Juda, naging hari sa buong Israel si Baasa na anak ni Ahias. Naghari siya sa Tirza nang dalawampu't apat na taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: Nang ikatlong taon ng paghahari
  rationale: Ang pariralang may בְּ ay nagtatakda ng panahon. Nilinaw ng “ng paghahari” ang karaniwang pormula ng pagtatala ng taon ng isang hari sa natural na Tagalog.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: ni Asa na hari ng Juda
  rationale: Ang לְ ay tumutukoy sa taon ng paghahari ni Asa; natural sa Tagalog ang “ni Asa na hari ng Juda.”
- source_word: מָלַךְ
  choice: naging hari
  rationale: Dito, ipinahihiwatig ng pandiwa ang pagluklok o pagsisimula ng paghahari, samantalang ang haba ng paghahari ay binabanggit sa kasunod na pangungusap.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: si Baasa na anak ni Ahias
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalang Baasha at Ahijah at pinanatili ang patronimikong “anak ni.”
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Kasama ng מָלַךְ, ang עַל ay nagsasaad ng saklaw ng pamamahala; malinaw at natural ang “sa buong Israel.”
- source_word: בְּתִרְצָה
  choice: sa Tirza
  rationale: Ang prefixed בְּ ay nagsasaad ng lugar kung saan nakaupo at naghahari ang hari.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: nang dalawampu't apat na taon
  rationale: Ipinapahayag ng bilang ang tagal ng paghahari; ang “nang” ay likas na pananda ng tagal sa pangungusap na ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maiwasan ang kalabuan kung ang dalawampu't apat na taon ay tumutukoy sa paghahari ni Baasa, habang pinananatili ang nilalaman at ayos ng Hebreong pormula.
