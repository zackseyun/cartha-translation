translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinalibre” sa karaniwang diwang hindi isinama sa obligasyon, at pinanatili ang mga pangalang-pook bilang Rama, Geba, Benjamin, at Mizpa.
