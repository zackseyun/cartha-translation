  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Haring Asa ang buong Juda[a]—walang sinumang pinalibre[b]—at dinala nila ang mga bato ng Rama at ang mga kahoy nito, na ginamit ni Baasa sa pagtatayo.[c] Gamit ang mga iyon, itinayo ni Haring Asa ang Geba sa Benjamin at ang Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinahayag ni Haring Asa sa buong Juda.” Literal na nangangahulugan ang pandiwang Hebreo na “ipinarinig.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “walang malaya,” ibig sabihin, walang sinumang pinahintulutang hindi makibahagi sa paggawa.
    reason: lexical_alternative
  - marker: c
    text: Ang sugnay na “na ginamit ni Baasa sa pagtatayo” ay tumutukoy sa mga bato at kahoy bilang mga materyales na ginamit niya sa pagpapatibay ng Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: ipinatawag
  rationale: Ang Hiphil ng שׁמע ay tumutukoy rito sa pagpaparating ng isang utos o panawagan sa buong Juda. Likas sa modernong Tagalog ang “ipinatawag” at ipinahihiwatig nito ang sapilitang pagpapakilos sa konteksto.
- source_word: אֵין נָקִי
  choice: walang sinumang pinalibre
  rationale: Sa kontekstong ito, ang נָקִי ay nangangahulugang malaya o hindi saklaw ng tungkulin, hindi “walang-sala” sa moral na diwa. Malinaw na ipinapahayag ng “pinalibre” na walang iniurong sa sapilitang paggawa.
- source_word: וַיִּשְׂאוּ
  choice: kinuha nila
  rationale: Ang נשא ay literal na pagbuhat o pagdadala, ngunit dito ay kasama ang diwa ng pag-aalis ng mga materyales sa Rama upang muling gamitin. Ang “kinuha” ay natural at sapat na malawak sa Tagalog.
- source_word: אַבְנֵי הָרָמָה
  choice: mga bato ng Rama
  rationale: Pinananatili nito ang payak na ugnayang construct ng Hebreo at malinaw na iniuugnay ang mga bato sa lugar na Rama.
- source_word: עֵצֶיהָ
  choice: mga kahoy nito
  rationale: Ang pangmaramihang עֵצִים ay tumutukoy rito sa kahoy na materyales sa pagtatayo. Ang “mga kahoy nito” ay natural at hindi nagpapalagay na tiyak na mga biga lamang ang tinutukoy.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: na ginamit ni Baasa sa pagtatayo
  rationale: Sa konteksto, ang sugnay ay tumutukoy sa mga bato at kahoy bilang materyales na ginamit ni Baasa. Iniiwasan ng saling ito ang di-likas at nakalilitong pahayag na para bang “itinayo” niya ang mga kahoy.
- source_word: וַיִּבֶן בָּם
  choice: ginamit iyon ... sa pagtatayo
  rationale: Ang בָּם ay bumabalik sa mga bato at kahoy bilang mga materyales. Natural sa Tagalog ang tahasang pagsasabing ginamit ang mga iyon sa pagtatayo.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Geba sa Benjamin
  rationale: Tinutukoy nito ang Geba na nasa nasasakupan o lupain ng Benjamin. Mas natural sa modernong Tagalog ang “sa Benjamin” kaysa “ng Benjamin.”
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Inalis ang artikulo gaya ng karaniwang ginagawa sa mga pangalang-pook sa Tagalog; “Mizpa” ang malinaw na transliterasyon ng pangalan.
