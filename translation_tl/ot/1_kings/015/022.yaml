  to: Pagkatapos, ipinatawag ni Haring Asa ang buong Juda[a]—walang sinumang pinalibre[b]—at dinala nila ang mga bato ng Rama at ang mga kahoy nito, na ginamit ni Baasa sa pagtatayo.[c] Gamit ang mga iyon, itinayo ni Haring Asa ang Geba sa Benjamin at ang Mizpa.
