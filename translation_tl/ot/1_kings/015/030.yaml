id: 1KI.15.30
reference: 1 Kings 15:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: tl
  text: dahil sa mga kasalanan ni Jeroboam na ginawa niya at sa pag-akay niya sa Israel upang magkasala, at dahil sa pagpukaw niya ng galit[a] kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa kanyang galit.” Ang salitang Hebreo ay maaaring mangahulugang galit o pagpukaw ng galit; dito, ang “pagpukaw ng galit” ay kaayon ng kasunod na pandiwang tumutukoy sa pagpagalit kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל חַטֹּאות
  choice: dahil sa mga kasalanan
  rationale: Ginamit ang “dahil sa” upang malinaw na ipahayag ang sanhi, at pinanatili ang pangmaramihang “mga kasalanan.”
- source_word: אֲשֶׁר חָטָא
  choice: na ginawa niya
  rationale: Sa Filipino, ang “mga kasalanan ... na ginawa niya” ay likas pakinggan at naiiwasan ang mabigat na pag-uulit ng salitang “nagkasala.”
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: at sa pagkakasalang idinulot niya sa Israel
  rationale: 'Ipinapahayag nito ang causative na anyo ng pandiwa: si Jeroboam ang naging sanhi ng pagkakasala ng Israel, nang hindi tinutukoy nang higit sa teksto kung paano niya iyon ginawa.'
- source_word: בְּכַעְסוֹ
  choice: dahil sa pagpukaw niya ng galit
  rationale: Ang כַּעַס ay maaaring tumukoy sa galit o sa pagpukaw ng galit. Sa kontekstong sinusundan ito ng הִכְעִיס, higit na angkop ang “pagpukaw ... ng galit,” habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: הִכְעִיס
  choice: pagpukaw ... ng galit kay
  rationale: Pinananatili nito ang diwang causative ng pandiwa—ang pag-udyok o pagpukaw sa galit ng Diyos—sa natural na Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at karaniwang salin ng pariralang construct, at pinananatili ang pagkakakilanlan ng Diyos kaugnay ng Israel.
theological_decisions:
- issue: Paglalahad sa pananagutan ni Jeroboam at ng Israel
  choice: “sa pagkakasalang idinulot niya sa Israel”
  alternative: “na ipinagkasala niya sa Israel”
  rationale: Pinananatili ang tahasang causative na pananagutan ni Jeroboam nang hindi ipinahihiwatig na walang sariling pananagutan ang Israel.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong pariralang nagsisimula sa “dahil sa” sapagkat ang talata ay nagbibigay ng dahilan para sa hatol na binanggit sa naunang konteksto. Ang gitling na paliwanag ay iniwasan upang manatiling tuwiran ang daloy.
