  naturalness: Ang “Namuhay siya ayon sa” at “Hindi buong-buo ang puso niya” ay pangkalahatang natural. Mas malinaw at mas natural ang “mga kasalanang nauna nang ginawa ng kanyang ama,” habang ang talababa ay nagpapanatili sa posibleng kahulugang “sa harap niya.”
  terminology: Wastong pinananatili ang “Yahweh” para sa יְהוָה at ang “puso” para sa לֵבָב. Ang “lubos na tapat ang kanyang puso” ay angkop na modernong Filipino para sa pusong buo o hindi nahahating tapat, nang hindi ipinahihiwatig ang ganap na kawalan ng kasalanan.
