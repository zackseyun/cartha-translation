  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: tl
  text: Namuhay siya ayon sa lahat ng kasalanang nauna nang ginawa ng kanyang ama[a]. Hindi lubos na tapat ang kanyang puso kay Yahweh na kanyang Diyos[b][c], gaya ng puso ng kanyang amang si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “sa harap niya” ay maaari ring mangahulugang “bago niya” o “sa kanyang presensiya.” Maaaring ipinahihiwatig nito na ang mga kasalanan ng kanyang ama ay nauna sa kanya at nagsilbing halimbawang sinundan niya.
    reason: lexical_alternative
  - marker: b
    text: O “Hindi buong-buo ang kanyang puso kay Yahweh na kanyang Diyos.”
    reason: alternative_reading
  - marker: c
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: Namuhay siya ayon sa lahat ng kasalanan
  rationale: Ang הלך na may בְּ at moral na layon ay tumutukoy sa asal o paraan ng pamumuhay. Mas natural sa makabagong Tagalog ang “namuhay ayon sa” kaysa literal na “lumakad sa,” habang pinananatili ang diwang etikal.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Tuwirang tumutukoy sa ama at naunang hari ni Abiam.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: na ginawa ng kanyang ama bago siya
  rationale: Nililinaw ng ayos ng pangungusap na ang ama ang gumawa ng mga kasalanan. Pinananatili ng “bago siya” ang posibleng temporal na kahulugan, samantalang ipinaliliwanag sa talababa ang ambiguwidad ng לְפָנָיו.
- source_word: לְבָבוֹ
  choice: ang puso niya
  rationale: Ang “puso” ay likas na katumbas sa Tagalog at maaaring tumukoy sa kalooban, pagpapasiya, at katapatan ng buong pagkatao.
- source_word: שָׁלֵם עִם
  choice: buong-buo ... kay
  rationale: Sa kontekstong tipanan, ang שָׁלֵם ay nagsasaad ng buo at di-hating katapatan, hindi kawalan ng anumang kasalanan. Ang “buong-buo ang puso ... kay” ay natural at pinananatili ang talinghaga ng pusong buo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: gaya ng puso ng kanyang amang si David
  rationale: Pinananatili ang tahasang paghahambing ng mga puso at ang diin sa panloob na katapatan.
theological_decisions:
- issue: Kahulugan ng pusong hindi שָׁלֵם kay Yahweh
  choice: Hindi buong-buo ang puso niya kay Yahweh
  alternative: Hindi lubos na tapat ang puso niya kay Yahweh
  rationale: Ipinahihiwatig nito ang hindi buo o nahahating katapatan sa Diyos, hindi ang pag-aangking kinakailangang ganap na walang kasalanan ang taong may pusong שָׁלֵם.
- issue: Paglalarawan kay David bilang pamantayan
  choice: Pinanatili ang paghahambing sa puso ni David nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag na tapat si David sa kabila ng kanyang mga kasalanan.
  rationale: Hindi dapat lutasin sa salin ang tensiyong teolohikal na nasa teksto; ang talata mismo ay nakatuon sa kabuuan ng katapatan ng puso.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa Hebreong teksto; ibinibigay sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “namuhay ayon sa” upang natural na maipahayag ang Hebreong idyoma ng paglakad bilang asal. Pinanatili ang “puso” at ang pag-uulit nito upang maingatan ang paghahambing sa orihinal. Ang lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
