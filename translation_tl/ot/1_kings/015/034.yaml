base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh at lumakad sa landas ni Jeroboam at sa kasalanan niya na naging sanhi upang magkasala ang Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Pinananatili ang karaniwang pormulang Hebreo ng moral na pagtatasa, habang likas pa rin sa modernong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang metapora ng Hebreong idyoma para sa pagsusuri ng Diyos at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: lumakad sa landas ni Jeroboam
  rationale: Pinananatili ang metapora ng paglakad bilang paraan ng pamumuhay at pagsunod sa huwaran ng iba.
- source_word: וּבְחַטָּאתוֹ
  choice: at sa kasalanan nito
  rationale: Ang panghalip na “nito” ay tumutukoy kay Jeroboam at pinananatili ang isahang “kasalanan” ng tekstong Hebreo.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na siyang ginamit nito upang udyukan ang Israel na magkasala
  rationale: 'Ipinahahayag ang causative na diwa ng Hiphil ng חטא: si Jeroboam ang naging sanhi ng pagkakasala ng Israel. Nililinaw ng “nito” ang paksa nang hindi inaalis ang ugnayan sa kasalanang binanggit.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili rito ang personal na pangalang Yahweh.
- issue: Pananagutan sa pagkakasala ng Israel
  choice: udyukan ang Israel na magkasala
  alternative: naging dahilan upang magkasala ang Israel
  rationale: Pinananatili ang causative na pahayag ng Hebreo nang hindi ipinahihiwatig na nawalan ng sariling pananagutan ang Israel.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga metaporang “sa paningin” at “lumakad sa landas” dahil malinaw ang mga ito sa konteksto at mahalaga sa pormulang teolohikal ng Mga Hari.
