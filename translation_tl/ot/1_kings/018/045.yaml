translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinanatili ang mabilis na takbo ng salaysay at ang konkretong paglalarawan sa unos, habang ipinaliwanag sa talababa ang idyomang Hebreo at ang literal na anyo ng “malakas na ulan.”
