base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: tl
  text: Hindi nagtagal[a], nagdilim ang langit dahil sa mga ulap at hangin, at bumuhos ang malakas na ulan.[b] Sumakay si Ahab sa kanyang karwahe at pumunta sa Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idyoma sa Hebreo: “hanggang ganito at hanggang ganito,” na nangangahulugang “samantala” o “sa loob ng maikling panahon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “nagkaroon ng malaking ulan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: Hindi nagtagal
  rationale: Ang idyomang Hebreo ay tumutukoy sa maikling paglipas ng panahon. Likas at malinaw sa modernong Tagalog ang “Hindi nagtagal,” nang hindi literal na isinasalin ang “hanggang ganito at hanggang ganito.”
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ
  choice: nagdilim ang langit
  rationale: Sa konteksto ng panahon, ang הַשָּׁמַיִם ay ang nakikitang langit, at ang pandiwa ay nagsasaad ng pagdidilim o pagkulimlim. Tuwiran at natural ang “nagdilim ang langit.”
- source_word: עָבִים וְרוּחַ
  choice: dahil sa mga ulap at hangin
  rationale: Ipinakikita ng parirala ang mga kasabay o sanhi ng pagdidilim. Pinananatili ng salin ang parehong “mga ulap” at “hangin” nang hindi dinaragdagan ang “makapal,” na hindi tahasang nakasaad.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: bumuhos ang malakas na ulan
  rationale: Bagaman literal na “nagkaroon ng malaking ulan,” natural na ipinapahayag sa Tagalog ang matinding pag-ulan bilang “bumuhos ang malakas na ulan.”
- source_word: וַיִּרְכַּב
  choice: Sumakay si Ahab sa kanyang karwahe
  rationale: Ang pandiwa ay nangangahulugang sumakay o lumulan. Ipinahahayag ang ipinahihiwatig na karwahe mula sa agarang konteksto upang maging malinaw at natural sa Tagalog.
- source_word: יִזְרְעֶאלָה
  choice: pumunta sa Jezreel
  rationale: Ang hulaping paturol sa Hebreo ay nagpapahiwatig ng paggalaw patungo sa Jezreel; karaniwang ipinahahayag ito sa Tagalog sa pamamagitan ng “sa.”
