  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: tl
  text: 'At makalipas ang mahabang panahon, dumating ang salita ni Yahweh kay Elias sa ikatlong taon, na nagsasabi: “Humayo ka at magpakita kay Ahab, at magbibigay ako ng ulan sa lupain.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “magbibigay ako ng ulan sa ibabaw ng lupain.” Maaari ring isalin: “magpapaulan ako sa lupain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: At nang makalipas ang mahabang panahon
  rationale: Ipinahahayag ng parirala ang paglipas ng isang mahabang yugto. Natural ito sa modernong Tagalog at pinananatili ang daloy ng salaysay.
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: dumating ang salita ni Yahweh kay
  rationale: Pinananatili nito ang karaniwang pormulang propetiko at malinaw na ipinahihiwatig na tumanggap ang propeta ng kapahayagan mula sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Filipino, na malinaw at pamilyar sa karaniwang mambabasa.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: nang ikatlong taon
  rationale: Tuwirang temporal na pananalita na natural sa Filipino at hindi nagpapasya kung saan eksaktong dapat bilangin ang tatlong taon.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Isang tuwirang pautos. Ang “humayo” ay marangal ngunit nauunawaan pa rin sa kasalukuyang gamit.
- source_word: הֵרָאֵה אֶל אַחְאָב
  choice: magpakita kay Ahab
  rationale: Ipinapahayag ng Niphal na anyo ng ראה ang diwang “hayaan mong makita ka,” na natural na isinasalin bilang “magpakita.”
- source_word: וְאֶתְּנָה מָטָר
  choice: at magbibigay ako ng ulan
  rationale: Pinananatili ng “magbibigay” ang karaniwang kahulugan ng נתן at ang paglalarawan sa ulan bilang kaloob ng Diyos.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sa lupain
  rationale: Ang literal na idyomang “sa ibabaw ng mukha ng lupa” ay natural na nangangahulugang “sa lupain” sa konteksto ng tagtuyot.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ng titulo.
- issue: Ugnayan ng Diyos at ng ulan
  choice: magbibigay ako ng ulan
  alternative: magpapaulan ako
  rationale: Mas malapit ang “magbibigay” sa נתן at pinananatili ang pahiwatig na ang ulan ay kaloob ng Diyos, nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniiwasan ang sobrang arkaikong ayos, ngunit pinananatili ang pormulang propetiko at ang personal na pangalang Yahweh. Inilipat ang talababa sa sugnay tungkol sa ulan, sapagkat iyon ang aktuwal na tinatalakay nito.
