base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa kanyang lingkod[a], “Umakyat ka, pakisuyo, at tumingin patungo sa dagat.” Kaya umakyat ito at tumingin, at sinabi, “Wala.” Sinabi naman ni Elias, “Bumalik ka nang pitong ulit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang binata” o “kanyang tagapaglingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: kanyang lingkod
  rationale: Maaaring tumukoy ang נַעַר sa isang kabataan, lingkod, o tagapaglingkod. Sa konteksto, ang taong ito ay sumusunod sa utos ni Elias, kaya natural at angkop ang “lingkod,” habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: עֲלֵה נָא
  choice: Pumanhik ka, pakisuyo
  rationale: Ang עֲלֵה ay pautos na “umakyat/pumanhik,” at ang נָא ay nagpapalumanay sa pakiusap o utos. Pinananatili ng salin ang pag-akyat at ang magalang na himig.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: tumingin ka sa gawing dagat
  rationale: Ang הביט ay “tumingin,” at ang דֶּרֶךְ יָם ay tumutukoy sa direksiyon ng dagat. Ang “sa gawing dagat” ay natural na Tagalog at malapit sa anyo ng Hebreo.
- source_word: אֵין מְאוּמָה
  choice: Wala akong nakikita
  rationale: Literal na ipinahahayag ng parirala na “walang anuman.” Dahil ang iniulat ng lingkod ay resulta ng pagtingin, malinaw at natural sa Tagalog ang “Wala akong nakikita,” nang hindi dinaragdagan kung ano ang inaasahan niyang makita.
- source_word: שֻׁב
  choice: Bumalik ka
  rationale: Karaniwang nangangahulugan ang שׁוּב na “bumalik.” Sa konteksto, inuutusan siyang ulitin ang pagpunta at pagtingin.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwirang ipinapahayag ang bilang ng pag-uulit. Ang “pitong ulit” ay likas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumanhik” upang mapanatili ang tahasang pag-akyat sa Hebreo, at “pakisuyo” upang ihatid ang nagpapalumanay na נָא. Hindi pinalawak sa pangunahing teksto ang “pitong ulit” bilang pitong kabuuang pagpunta o pitong karagdagang pagpunta, yamang maikli at bahagyang hindi tiyak ang utos sa Hebreo.
