revisions:
- from: Pagkatapos, sinabi niya sa kanyang lingkod[a], “Pumanhik ka, pakisuyo, at tumingin ka sa gawing dagat.” Kaya pumanhik ito at tumingin, at sinabi, “Wala akong nakikita.” Sinabi niya, “Bumalik ka nang pitong ulit.”
  to: Pagkatapos, sinabi niya sa kanyang lingkod[a], “Umakyat ka, pakisuyo, at tumingin patungo sa dagat.” Kaya umakyat ito at tumingin, at sinabi, “Wala.” Sinabi naman ni Elias, “Bumalik ka nang pitong ulit.”
  rationale: Pinalitan ang “pumanhik” ng mas natural na “umakyat,” ginawang mas malinaw ang direksiyon ng pagtingin, at tinukoy si Elias sa huling pangungusap upang maiwasan ang kalabuan ng panghalip. Ang “Wala” ay mas malapit sa walang-tahasang-panauhang אֵין מְאוּמָה at nananatiling natural bilang tugon ng lingkod. Inayos din ang talababa upang mailahad ang mga alternatibong kahulugan ng נַעַר nang hindi ipinipilit ang isa lamang.
