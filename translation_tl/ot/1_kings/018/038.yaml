  source_fidelity: Tumpak ang pangunahing daloy at karamihan ng mga katumbas. Gayunman, ang לִחֵכָה ay tahasang ‘dinilaan’/‘dininilaan’ at tumutukoy sa pag-ubos ng tubig; ang ‘tinuyong lubos’ ay mas interpretatibo at pinahihina ang matingkad na larawan ng Hebreo.
  naturalness: Marangal at malinaw ang Tagalog. Mas maayos ang pagtatahi ng huling pandiwa nang walang tuldok-kuwit at sa paggamit ng ‘nito’ upang malinaw na ang apoy ang tumupok.
  terminology: Ang ‘Yahweh,’ ‘handog na sinusunog,’ ‘mga kahoy,’ ‘mga bato,’ ‘alabok,’ at ‘kanal’ ay angkop sa modernong Filipino Tagalog at tapat sa teksto. Ang ‘apoy ni Yahweh’ ay lehitimong pagpapanatili ng ugnayang ipinahahayag ng Hebreo; ang alternatibong ‘apoy mula kay Yahweh’ ay dapat manatili bilang talababa.
  issues:
