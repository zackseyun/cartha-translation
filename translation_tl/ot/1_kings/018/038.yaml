- from: At bumagsak ang apoy ni Yahweh at tinupok ang handog na sinusunog, ang mga kahoy, ang mga bato, at ang alabok; at tinuyong lubos ang tubig na nasa kanal.[a]
  to: At bumagsak ang apoy ni Yahweh at tinupok nito ang handog na sinusunog, ang mga kahoy, ang mga bato, at ang alabok, at dinilaan ang tubig na nasa kanal.[a]
  rationale: Ibinabalik ng ‘dinilaan’ ang tiyak at matingkad na pandiwang Hebreo habang nananatiling mauunawaan sa modernong Filipino. Inilipat ang talababa sa alternatibong pag-unawa sa אֵשׁ יְהוָה, sapagkat literal na nasa pangunahing teksto ang larawan ng pagdila sa tubig.
