base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: tl
  text: At bumagsak ang apoy ni Yahweh at tinupok nito ang handog na sinusunog, ang mga kahoy, ang mga bato, at ang alabok, at dinilaan ang tubig na nasa kanal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “apoy ni Yahweh” bilang “apoy mula kay Yahweh,” na nagdiriin na kay Yahweh nagmula ang apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: ang apoy ni Yahweh
  rationale: Pinananatili ang tuwirang ugnayan ng apoy kay Yahweh at ang pangalang tipan na nasa Hebreo; maaari rin itong maunawaan bilang apoy na nagmula kay Yahweh.
- source_word: וַתִּפֹּל
  choice: bumagsak
  rationale: Tuwirang inilalarawan ng נפל ang apoy na bumabagsak mula sa itaas at pinananatili nito ang masidhing larawan ng Hebreo.
- source_word: וַתֹּאכַל
  choice: tinupok
  rationale: Bagaman literal na 'kinain,' ang 'tinupok' ang natural na salitang Filipino para sa ganap na paglamon ng apoy.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Tumutukoy ang עֹלָה sa handog na ganap na sinusunog; malinaw at madaling maunawaan ang pariralang Filipino.
- source_word: הָעֵצִים
  choice: ang mga kahoy
  rationale: Tumutukoy sa mga kahoy na inayos sa altar; pinananatili ang anyong maramihan ng Hebreo.
- source_word: הָאֲבָנִים
  choice: ang mga bato
  rationale: Tuwirang salin na nagtatampok sa pambihirang tindi ng apoy.
- source_word: הֶעָפָר
  choice: ang alabok
  rationale: Ang עָפָר ay alabok o pinong lupa; 'alabok' ang mas matingkad at tuwirang katumbas dito.
- source_word: לִחֵכָה
  choice: tinuyong lubos
  rationale: Literal itong 'dinilaan,' ngunit sa tubig ay ipinahihiwatig na walang natira; natural sa Filipino ang napiling salin habang inilalagay sa talababa ang mas literal na larawan.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: ang tubig na nasa kanal
  rationale: Ang תְּעָלָה ay hukay o daluyan sa paligid ng altar; ang 'kanal' ay maikli, kongkreto, at karaniwan sa modernong Filipino.
- source_word: וַ
  choice: At
  rationale: Pinananatili ang estilong nagsasalaysay at ang pagkakaugnay nito sa naunang pangyayari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo na YHWH ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng אֵשׁ יְהוָה
  choice: ang apoy ni Yahweh
  alternative: apoy mula kay Yahweh
  rationale: Ang pagkakatabi ng mga pangngalan ay maaaring magpahayag ng pag-aari o banal na pinagmulan. Pinananatili sa pangunahing teksto ang mas pormal na ugnayan, habang itinatala sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'tinupok' bilang likas na idyoma para sa apoy, at iniwasan ang labis na teknikal na wikang panrelihiyon. Nasa pangunahing teksto ang lahat ng marker ng talababa.
