  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: tl
  text: Kaya sumigaw sila nang malakas at nilaslas ang kanilang sarili[a] gamit ang mga espada at sibat, ayon sa kanilang kaugalian,[b] hanggang sa bumuhos ang dugo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hiniwa ang kanilang sarili.” Tumutukoy ang Hebreo sa ritwal na pagsusugat sa sariling katawan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kanilang nakagawian” o “gaya ng dati nilang ginagawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: sumigaw sila
  rationale: Sa konteksto ng desperadong pagtawag kay Baal, ang pandiwa ay tumutukoy sa malakas na pagsigaw, hindi sa karaniwang pagtawag lamang.
- source_word: בְּקוֹל גָּדוֹל
  choice: nang malakas
  rationale: Likas at malinaw na Filipino ito para sa Hebreong idyomang literal na 'sa malakas na tinig.'
- source_word: וַיִּתְגֹּדְדוּ
  choice: nilaslas ang kanilang sarili
  rationale: Ipinahihiwatig ng reflexive na anyo ang ritwal na pagsusugat sa sariling katawan. Mas tiyak ang 'nilaslas' kaysa sa pangkalahatang 'sinugatan.'
- source_word: כְּמִשְׁפָּטָם
  choice: ayon sa kanilang kaugalian
  rationale: Dito, ang מִשְׁפָּט ay tumutukoy sa nakagawiang ritwal o kinaugalian nilang paraan, hindi sa isang pasiya ng hukuman.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: gamit ang mga espada at sibat
  rationale: Ang pang-ukol ay nagpapakita ng kasangkapan; malinaw at natural sa modernong Filipino ang 'gamit ang.'
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: hanggang sa umagos ang dugo sa kanilang katawan
  rationale: Pinananatili ng 'umagos' ang larawan ng pagbuhos ng dugo, samantalang nililinaw ng 'sa kanilang katawan' ang diwa ng Hebreong עֲלֵיהֶם nang hindi pinatitindi nang labis ang paglalarawan.
