base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: tl
  text: At sa ikapitong pagkakataon ay sinabi niya, “Tingnan mo! May isang maliit na ulap na kasinlaki ng palad ng isang tao[a] na umaangat mula sa dagat.” Pagkatapos ay sinabi ni Elias, “Umakyat ka at sabihin mo kay Ahab, ‘Ihanda mo ang iyong karwahe[b] at bumaba ka, upang hindi ka mapigil ng ulan[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na tulad ng palad ng isang tao.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ihanda ang karwahe” ay tumutukoy sa pagkakabit ng mga kabayo o iba pang hayop dito upang makapaglakbay.
    reason: cultural_note
  - marker: c
    text: O “baka hadlangan ka ng ulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: At nangyari, sa ikapitong pagkakataon
  rationale: Pinananatili ang Hebreong daloy ng salaysay at nililinaw na ito ang ikapitong ulit ng pagtingin ng lingkod, hindi ikapitong araw.
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Hindi pinapangalanan ang lingkod sa unang pahayag sapagkat panghalip lamang ang nasa Hebreo at malinaw ang tinutukoy mula sa konteksto.
- source_word: הִנֵּה
  choice: Tingnan mo!
  rationale: Likas na modernong panawag-pansin na nagpapanatili sa biglaan at agarang tono ng deiktikong kataga.
- source_word: עָב קְטַנָּה
  choice: isang maliit na ulap
  rationale: Tuwirang salin ng pariralang nominal at natural sa Tagalog.
- source_word: כְּכַף אִישׁ
  choice: kasinlaki ng palad ng isang tao
  rationale: Ipinahahayag ang diwang paghahambing sa sukat; ang כַּף ay tumutukoy sa palad, habang ang אִישׁ dito ay likas na maisasaling pangkalahatang ‘tao.’
- source_word: עֹלָה מִיָּם
  choice: umaahon mula sa dagat
  rationale: Ang pandiwaring pambabae ay naglalarawan ng kasalukuyang paglitaw o pag-angat ng ulap mula sa direksiyon ng dagat.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang direksiyonal na kahulugan ng pautos, malamang na tumutukoy sa pag-akyat ng lingkod upang ihatid ang mensahe.
- source_word: אֱמֹר אֶל אַחְאָב
  choice: sabihin mo kay Ahab
  rationale: Natural at tapat na paglilipat ng pautos at di-tuwirang layon.
- source_word: אֱסֹר
  choice: Ihanda mo ang iyong karwahe
  rationale: Ang literal na ‘itali’ ay isang idyoma para sa pagkakabit o paghahanda ng mga hayop at karwahe para sa paglalakbay; ang salin ay malinaw sa karaniwang mambabasa.
- source_word: וָרֵד
  choice: at bumaba ka
  rationale: Pinananatili ang topograpikal na direksiyon ng pautos mula sa mataas na lugar ng Carmel.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: baka maabutan at mapigil ka ng ulan
  rationale: Ang עָצַר ay maaaring mangahulugang pumigil o humadlang; ipinahahayag ng ‘baka’ ang babala na kailangang umalis bago hadlangan ng ulan ang paglalakbay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong pasalaysay. Ginamit ang ‘karwahe’ bilang madaling makilalang katawagan sa sasakyang pandigma o panlalakbay, at pinanatili ang mga direksiyonal na pautos na ‘umakyat’ at ‘bumaba.’ Lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
