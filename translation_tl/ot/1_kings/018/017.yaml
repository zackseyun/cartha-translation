  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: tl
  text: Nang makita ni Ahab si Elias, sinabi niya rito, “Ikaw nga ba iyan, ang nagdadala ng kapahamakan sa Israel?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Nang makita
  rationale: Ang וַיְהִי ay bahagi ng daloy ng salaysay, at ang infinitive construct na may כִּ ay nagsasaad ng panahong pangyayari. Likas sa modernong Tagalog ang “Nang makita” at hindi na kailangang isalin nang hiwalay ang pormulang וַיְהִי.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: וַיֹּאמֶר ... אֵלָיו
  choice: sinabi niya rito
  rationale: Tuwirang inililipat ang pandiwa ng pagsasalita at ang tinutukoy na kausap; ang “rito” ay natural at malinaw sa Tagalog.
- source_word: הַאַתָּה זֶה
  choice: Ikaw nga ba iyan
  rationale: Pinananatili ng “nga ba” at “iyan” ang mariin at mapanumbat na tanong ng Hebreo.
- source_word: עֹכֵר
  choice: ang nagdadala ng kapahamakan
  rationale: Ang participle mula sa עכר ay tumutukoy sa taong nagdudulot ng gulo, sakuna, o kapahamakan. Mas natural sa kasalukuyang Tagalog ang pariralang ito kaysa sa artipisyal na katawagang “tagagulo,” at napananatili nito ang bigat ng paratang.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginamit ang karaniwang Filipino na anyo ng pangalan ng bayan.
theological_decisions:
- issue: Lakas at tono ng paratang ni Ahab
  choice: “ang nagdadala ng kapahamakan sa Israel” bilang tuwirang paratang
  alternative: “ang nanggugulo sa Israel” o “ang nagdadala ng kaguluhan sa Israel”
  rationale: Ipinapakita ng talata na isinisisi ni Ahab kay Elias ang dinaranas ng Israel. Pinananatili ng salin ang mabigat na paratang ngunit hindi nito ipinahihiwatig na tama ang paghatol ni Ahab.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang ayos na “Nang makita… sinabi…” ay likas sa salaysay, samantalang ang “Ikaw nga ba iyan” ay nagpapanatili sa mapanumbat at confrontational na tono.
