base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: tl
  text: 'Buhay si Yahweh, ang iyong Diyos: walang bansa o kaharian na hindi pinadalhan ng aking panginoon ng mga sugo upang hanapin ka. Nang sabihin nilang, “Wala siya rito,” ipinasumpa niya ang kaharian at ang bansa na hindi ka nila mahanap.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Saksi ang buhay ni Yahweh na iyong Diyos
  rationale: Isang likas at marangal na pormula ng panunumpa sa Filipino na nagpapanatili sa pag-apela sa buhay ni Yahweh, sa halip na gawing karaniwang pahayag lamang na buhay ang Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos at hindi ito pinapalitan ng isang titulo.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: walang bansa o kaharian na hindi
  rationale: Sa konteksto ng panunumpa, ang אִם ay may mariing, eliptikong diwa; ipinahahayag ni Obadias na umabot sa lahat ng dako ang paghahanap, hindi na may alinlangan siya tungkol dito.
- source_word: גּוֹי וּמַמְלָכָה
  choice: bansa o kaharian
  rationale: Pinananatili ang magkaugnay na heopolitikal na mga termino at ang natural na ugnayang hinihingi ng negatibong pahayag sa Filipino.
- source_word: שָׁלַח אֲדֹנִי שָׁם לְבַקֶּשְׁךָ
  choice: pinadalhan ng aking panginoon upang hanapin ka
  rationale: Inilalahad nang natural sa Filipino ang pagpapadala sa bawat lugar nang hindi nagdaragdag ng tahasang mga tauhan na wala sa Hebreo. Ang 'aking panginoon' ay magalang na pagtukoy ni Obadias kay Haring Ahab.
- source_word: וְאָמְרוּ אָיִן
  choice: Kapag sinabi nilang, “Wala siya rito,”
  rationale: Ang אָיִן ay nagpapahiwatig na wala roon ang hinahanap na si Elias. Ginagawang malinaw ng 'siya' at 'rito' ang nakapaloob na diwa nang hindi binabago ang tinutukoy.
- source_word: וְהִשְׁבִּיעַ
  choice: pinasusumpa niya
  rationale: Ang Hiphil ng שבע ay nangangahulugang magpasumpa o maglagay sa ilalim ng panunumpa. Ang aspektong paulit-ulit ay angkop sa bawat bansang pinaghahanap.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: na hindi ka nila natagpuan
  rationale: Pagkatapos ng pandiwa ng panunumpa, ipinakikilala ng כִּי ang nilalaman ng sumpa. Ang pangnagdaan ay natural sa ulat tungkol sa natapos na paghahanap at hindi nagpapalabis tungo sa kawalan ng kakayahan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo o ibang tradisyonal na anyo.
- issue: Lakas ng pormula ng panunumpa חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh
  alternative: Buhay si Yahweh; Habang buhay si Yahweh
  rationale: Pinananatili ang solemne at teolohikal na bigat ng pag-apela sa buhay ng Diyos, habang gumagamit ng malinaw na pormula ng panunumpa sa Filipino.
- issue: Nilalaman ng ipinasumpa sa mga kaharian at bansa
  choice: na hindi ka nila natagpuan
  alternative: na hindi ka nila kayang matagpuan
  rationale: Hindi tiyak na kawalan ng kakayahan ang pangunahing diin ng לֹא יִמְצָאֶךָ; maaaring tumukoy ito sa resulta ng paghahanap. Pinananatili ng napiling salin ang mas payak at hindi gaanong interpretatibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'Saksi ang buhay ni Yahweh' bilang solemne at natural na pormula ng panunumpa; iniwasan ang labis na literal na 'Buhay si Yahweh' na maaaring mapagkamalang karaniwang pahayag. Ang 'pinasusumpa' ay nagpapahiwatig ng paulit-ulit na ginawa ni Ahab sa bawat bansang sumagot na wala roon si Elias.
