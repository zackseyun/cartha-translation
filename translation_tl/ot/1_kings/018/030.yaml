base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Elias sa lahat ng tao, “Lumapit kayo sa akin.” At lumapit sa kanya ang lahat ng tao, at inayos niya[a] ang altar ni Yahweh na giniba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinagaling”; maaari ring isaling “ibinalik sa ayos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ
  choice: Lumapit kayo sa akin
  rationale: Ipinahahayag ng pautos na anyo ng נגשׁ ang pisikal na paglapit kay Elias; likas sa makabagong Tagalog ang “lumapit” at pinananatili nito ang direksiyon ng kilos.
- source_word: וַיִּגְּשׁוּ
  choice: lumapit sa kanya
  rationale: Inulit ang pandiwang “lumapit” upang maipakita, gaya sa Hebreo, na tinupad ng mga tao ang utos ni Elias.
- source_word: כָל הָעָם
  choice: lahat ng tao
  rationale: Malinaw at natural itong salin ng kolektibong parirala, at tumutukoy sa buong pangkat na naroon.
- source_word: וַיְרַפֵּא
  choice: inayos niyang muli
  rationale: Literal na “pinagaling” ang רפא, ngunit kapag altar ang layon, nangangahulugan itong ibinalik sa maayos na kalagayan. Ang “inayos niyang muli” ay malinaw at kongkreto sa Tagalog.
- source_word: מִזְבַּח יְהוָה
  choice: ang altar ni Yahweh
  rationale: Natural sa Tagalog ang kayariang “altar ni Yahweh” para sa ugnayang construct at malinaw na ipinakikitang ang altar ay nakatalaga kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הֶהָרוּס
  choice: na giniba
  rationale: Ang pasibong participle ng הרס ay tumutukoy sa altar na winasak o ibinagsak; maikli, malinaw, at natural ang “na giniba.”
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; ipinahahayag ng “Pagkatapos” ang sunod na pangyayari sa natural na Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “lumapit” mula sa Hebreo at ginamit ang kilalang anyong “Elias” para sa pangalang אֵלִיָּהוּ.
