  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: tl
  text: Sinabi niya, “Ano ang kasalanang nagawa ko, at ibinibigay mo ang iyong lingkod sa kamay ni Ahab upang patayin niya ako?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang panandang pasalaysay para sa tugon ni Obadias; natural sa modernong Tagalog nang hindi dinaragdagan ang pagkakasunod-sunod.
- source_word: מֶה חָטָאתִי
  choice: Ano ba ang kasalanan ko
  rationale: Pinananatili ang moral at panrelihiyong puwersa ng חטא, habang ang “ba” ay likas na naghahayag ng pagtataka at pagtutol sa tanong.
- source_word: כִּי
  choice: at
  rationale: Sa retorikal na tanong, natural na inuugnay ng “at” ang sinasabing kasalanan sa kinatatakutang kahihinatnan; hindi nito ipinipilit na sanhi lamang ang relasyon.
- source_word: אַתָּה נֹתֵן
  choice: ibinibigay mo
  rationale: Inihahatid ang tahasan at nalalapit na kilos, at nananatiling lantad ang binibigyang-diin na ikalawang panauhan sa hulaping “mo.”
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ang magalang na pagtukoy sa sarili sa harap ng nakatataas ang nangingibabaw, hindi ang legal na katayuan ng isang alipin.
- source_word: בְּיַד אַחְאָב
  choice: sa kamay ni Ahab
  rationale: Pinananatili ang Hebreong talinghaga ng kamay bilang kapangyarihan o kontrol, na malinaw rin sa Tagalog.
- source_word: לַהֲמִיתֵנִי
  choice: upang ipapatay ako
  rationale: 'Ipinapakita ang causative na diwa ng Hiphil: ihahatid siya kay Ahab na siyang magpapapatay sa kaniya.'
