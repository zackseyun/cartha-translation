- from: At ang kamay ni Yahweh ay suma kay Elias[a]. Isinuksok niya sa sinturon ang laylayan ng kanyang damit[b] at tumakbo sa unahan ni Ahab hanggang sa pasukan ng Jezreel.
  to: At ang kamay ni Yahweh ay nasa kay Elias[a]. Itinaas at isinuksok niya sa sinturon ang kanyang kasuotan[b], at tumakbo siya sa unahan ni Ahab hanggang sa pasukan ng Jezreel.
