base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: tl
  text: At ang kamay ni Yahweh ay nasa kay Elias[a]. Itinaas at isinuksok niya sa sinturon ang kanyang kasuotan[b], at tumakbo siya sa unahan ni Ahab hanggang sa pasukan ng Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas tradisyonal na salin, “ang kamay ni Yahweh ay suma kay Elias.” Ipinahihiwatig ng pananalitang ito ang makapangyarihang pagkilos ng Diyos kay Elias, ngunit hindi tinutukoy kung paano ito naganap.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “binigkisan niya ang kanyang mga balakang”; ibig sabihin, itinaas at isinuksok niya ang kanyang mahabang kasuotan upang makatakbo.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: ang kamay ni Yahweh ay suma kay
  rationale: Pinananatili ang larawang Hebreo ng kamay bilang tanda ng pagkilos at pagbibigay-lakas ng Diyos. Ang “suma kay” ay marangal at likas sa biblikal na Filipino, bagaman ang pandiwang Hebreo ay literal na “nasa kay.”
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: isinuksok niya sa sinturon ang laylayan ng kanyang damit
  rationale: 'Ipinahahayag sa malinaw na modernong Filipino ang kilos na tinutukoy ng idyoma: pagtataas at pagsisiguro ng mahabang kasuotan upang malayang makatakbo.'
- source_word: וַיָּרָץ לִפְנֵי
  choice: tumakbo sa unahan ni
  rationale: Pinananatili ang malinaw na kahulugang panlunan nang hindi ipinapalagay na isa itong seremonyal na paglilingkod.
- source_word: עַד בֹּאֲכָה
  choice: hanggang sa pasukan ng
  rationale: Likas na ipinapahayag ang hangganan ng pagtakbo bilang paglapit o pasukan sa lugar.
- source_word: יִזְרְעֶאלָה
  choice: Jezreel
  rationale: Ginagamit ang karaniwang anyo ng pangalan ng lugar.
theological_decisions:
- issue: Uri ng pagbibigay-lakas kay Elias
  choice: Pinanatili ang idyomang “ang kamay ni Yahweh ay suma kay Elias” nang hindi tinutukoy ang eksaktong paraan ng pagkilos ng Diyos.
  alternative: Isalin bilang “binigyan ni Yahweh si Elias ng pambihirang lakas” o bilang “dumating kay Elias ang inspirasyong propetiko.”
  rationale: Malinaw sa Hebreo ang pagkilos ng Diyos, ngunit hindi nito tahasang sinasabi kung ito ay mahimalang lakas, propetikong pag-udyok, o kapwa. Hindi nilulutas ng salin ang sadyang hindi tinukoy ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Pinanatili ang Hebreong larawan ng “kamay ni Yahweh,” samantalang ipinaliwanag sa pangunahing teksto ang sinaunang kilos ng paghahanda ng kasuotan para sa pagtakbo.
