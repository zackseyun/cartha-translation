source:
  edition: WLC
  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: tl
  text: Hindi ba naibalita sa aking panginoon ang ginawa ko nang pinapatay ni Jezebel ang mga propeta ni Yahweh—kung paano ko itinago ang isang daang lalaki mula sa mga propeta ni Yahweh, tig-lilimampung lalaki sa isang yungib[a], at pinaglaanan ko sila ng tinapay at tubig?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “limampu-limampu, lalaki, sa yungib.” Ipinahahayag ng pag-uulit ng “limampu” ang paghahati sa mga pangkat na tig-lilimampu. Maaari rin itong isalin na “tig-lilimampung lalaki sa mga yungib.”
    reason: Pinananatili ang distributibong diwa ng inuulit na bilang at ang bahagyang kalabuan ng isahang “yungib” sa Hebreo.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: Hindi ba naibalita sa aking panginoon
  rationale: Pinananatili ang retorikal na tanong na umaasang oo ang sagot, ang balintiyak na diwa ng הֻגַּד, at ang magalang na pagtukoy kay Elias nang hindi ito ginagawang banal na titulo.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי
  choice: ang ginawa ko
  rationale: Natural at tuwirang katumbas ng sugnay na tumutukoy sa ginawa ni Obadias.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: nang pinapatay ni Jezebel
  rationale: Ipinahahayag ng infinitive construct ang kalagayang temporal; ang aspektong nagpapatuloy ay angkop sa pag-uusig na nagaganap habang kumikilos si Obadias.
- source_word: נְבִיאֵי יְהוָה
  choice: mga propeta ni Yahweh
  rationale: Tuwirang isinasalin ang construct phrase at pinananatili ang personal na pangalang Yahweh para sa tetragrammaton.
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: isang daan sa mga propeta ni Yahweh
  rationale: 'Ipinakikita ang partitive na gamit ng מִן: isang daan mula sa hanay ng mga propeta. Ang kasunod na distributibong parirala ang likas na nagpapahayag na mga lalaki ang binibilang.'
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: tig-lilimampung lalaki sa bawat yungib
  rationale: Ang pag-uulit ng bilang ay distributibo. Ang 'tig-lilimampu' ay natural na Filipino, habang ang 'sa bawat yungib' ay malinaw na naghahati sa isang daan sa mga pangkat na tig-lilimampu.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: tinustusan ko sila ng tinapay at tubig
  rationale: Ang כלכל ay nangangahulugang magpanatili o maglaan ng ikabubuhay; pinananatili rin ang kongkretong 'tinapay at tubig'.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang tipan ang יְהוָה sa teksto. Ang 'Yahweh' ay tuwirang transliterasyon at hindi ito ipinagkakamali sa karaniwang titulong 'panginoon' na ginagamit din sa talata para kay Elias.
- issue: Kahulugan ng לַאדֹנִי
  choice: sa aking panginoon
  alternative: sa aking amo
  rationale: Magalang na tawag ito ni Obadias kay Elias, hindi pagtukoy sa Diyos. Pinananatili ng maliit na titik at ng konteksto ang pagkakaibang iyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “naibalita,” “pinapatay,” “yungib,” at “tinustusan” bilang natural na mga salitang angkop sa salaysay. Ang panandang [a] ay inilagay kaagad pagkatapos ng pariralang nililinaw nito.
