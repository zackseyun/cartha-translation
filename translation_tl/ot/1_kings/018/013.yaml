revisions:
- from: Hindi ba naibalita sa aking panginoon ang ginawa ko nang pinapatay ni Jezebel ang mga propeta ni Yahweh? Itinago ko ang isang daan sa mga propeta ni Yahweh—tig-lilimampung lalaki sa bawat yungib[a]—at tinustusan ko sila ng tinapay at tubig.
  to: Hindi ba naibalita sa aking panginoon ang ginawa ko nang pinapatay ni Jezebel ang mga propeta ni Yahweh—kung paano ko itinago ang isang daang lalaki mula sa mga propeta ni Yahweh, tig-lilimampung lalaki sa isang yungib[a], at pinaglaanan ko sila ng tinapay at tubig?
  rationale: Iniuugnay ng binagong pangungusap ang pagkukubli at paglalaan sa nilalaman ng naibalita kay Elias, ibinabalik ang hayag na “lalaki,” at pinananatili ang distributibong pagbibilang nang hindi labis na tinutukoy ang bilang o gamit ng mga yungib.
