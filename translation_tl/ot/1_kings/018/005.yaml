  to: Sinabi ni Ahab kay Obadias, “Libutin mo ang lupain at puntahan ang lahat ng bukal at batis[a]. Baka makahanap tayo ng damo at mapanatiling buhay ang mga kabayo at mola, upang hindi natin kailangang bawasan ang mga alagang hayop.[b]”
