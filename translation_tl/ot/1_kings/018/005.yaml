translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Obadias,” ang karaniwang anyong Filipino ng pangalan. Iniwasan ang teknikal na “wadi” sa pangunahing teksto ngunit pinanatili sa talababa ang lawak ng kahulugan. Ang ikalawang talababa ay inilagay pagkatapos ng buong pahayag na nililinaw nito.
