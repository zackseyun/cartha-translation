base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: tl
  text: Sinabi ni Ahab kay Obadias, “Libutin mo ang lupain at puntahan ang lahat ng bukal at batis[a]. Baka makahanap tayo ng damo at mapanatiling buhay ang mga kabayo at mola, upang hindi natin kailangang bawasan ang mga alagang hayop.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga agusan.” Ang salitang Hebreo ay maaaring tumukoy sa batis, lambak na daluyan, o pana-panahong daluyan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Literal na “at hindi tayo magpuputol mula sa mga hayop.” Malamang na ang ibig sabihin ay huwag mabawasan ang mga alagang hayop dahil sa kakulangan ng pakain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: Libutin mo ang lupain
  rationale: Sa konteksto ng paghahanap, ang ב kasunod ng pandiwa ng pagpunta ay tumutukoy sa pagkilos sa buong lugar. Natural sa Tagalog ang “libutin” at malinaw na ipinahihiwatig ang sistematikong paghahanap.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: mga bukal
  rationale: Sapat nang malinaw sa Tagalog ang “bukal” bilang likas na pinagmumulan ng tubig; hindi na kailangan ang mas mabigat na “mga bukal ng tubig.”
- source_word: הַנְּחָלִים
  choice: mga batis
  rationale: Maaaring tumukoy ang נחל sa batis, agusan, o pana-panahong daluyan ng tubig. “Batis” ang pinakanatural para sa karaniwang mambabasa, habang inilalahad sa talababa ang mas malawak na heograpikong diwa.
- source_word: אוּלַי נִמְצָא
  choice: Baka makakita tayo
  rationale: Pinananatili ng “baka” ang kawalang-katiyakan at ng “tayo” ang unang panauhang maramihan at magkatuwang na layunin.
- source_word: חָצִיר
  choice: damo
  rationale: Tumutukoy ito sa halamang maaaring ipakain sa mga hayop. Ang “damo” ay natural at hindi nagdaragdag ng ideya ng pinatuyong pakain.
- source_word: וּנְחַיֶּה
  choice: mapanatili nating buhay
  rationale: Ipinahahayag nito ang causative na diwa ng pagpapanatiling buhay, hindi lamang ang pagpapahintulot na mabuhay.
- source_word: סוּס וָפֶרֶד
  choice: mga kabayo at mola
  rationale: Bagaman kolektibong isahan ang Hebreo, mas natural sa Tagalog ang maramihan kapag tumutukoy sa mga uri ng hayop sa kawan ng hari.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: nang hindi natin kailangang bawasan ang ating mga alagang hayop
  rationale: Ang כרת ay literal na “putulin” o “alisin,” at ang מן ay maaaring partitive. Sa konteksto ng taggutom, ang “bawasan” ay natural na naghahatid ng diwang kailangang alisin o ipapatay ang ilan sa mga alagang hayop, nang hindi sobrang nilulutas ang eksaktong paraan.
