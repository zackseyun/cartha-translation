  to: Sumagot siya, “Hindi ako ang nagdala ng kapahamakan sa Israel, kundi ikaw at ang sambahayan ng iyong ama ang nagdala ng kapahamakan sa Israel, sapagkat tinalikuran ninyo ang mga utos ni Yahweh at sumunod kayo sa mga Baal[a].”
