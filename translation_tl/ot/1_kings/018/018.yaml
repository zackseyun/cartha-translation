source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: tl
  text: Sumagot siya, “Hindi ako ang nagdala ng kapahamakan sa Israel, kundi ikaw at ang sambahayan ng iyong ama ang nagdala ng kapahamakan sa Israel, sapagkat tinalikuran ninyo ang mga utos ni Yahweh at sumunod kayo sa mga Baal[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maramihan ang Hebreo: “mga Baal,” na tumutukoy sa sari-saring lokal na anyo o pagpapakita ng pagsamba kay Baal.'
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: nagdala ng kapahamakan
  rationale: Ipinahahayag ng pandiwa ang pagdadala ng malubhang kaguluhan o kapahamakan sa bayan at pinananatili ang tuwirang pagtanggi ni Elias sa paratang sa naunang talata.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo sa modernong Filipino para sa pangalan ng bayan at bansang tipan.
- source_word: כִּי אִם
  choice: Ikaw ... ang gumawa nito
  rationale: Malinaw na inililipat ng pariralang panalungat ang pananagutan mula kay Elias kay Ahab at sa sambahayan ng ama nito.
- source_word: וּבֵית אָבִיךָ
  choice: at ang sambahayan ng iyong ama
  rationale: Pinananatili ang Hebreong idyoma at ang diwa ng pananagutan ng pamilya o dinastiya, hindi lamang ng malapit na pamilya.
- source_word: בַּעֲזָבְכֶם
  choice: sapagkat tinalikuran ninyo
  rationale: Ang ikalawang panauhang maramihan sa Hebreo ay tumutukoy kay Ahab kasama ng sambahayan ng kanyang ama; malinaw rin ang sanhi ng paratang.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Natural at may sapat na bigat na salin ng mga kautusang mula kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa titik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: sumunod kayo sa
  rationale: Natural na Filipino para sa idyomang nangangahulugang pagsunod nang may katapatan o pagsamba.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang tahasang maramihang anyo ng Hebreo, na maaaring tumukoy sa sari-saring lokal na anyo o pagpapakita ng kulto ni Baal.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Maramihang anyo ng הַבְּעָלִים
  choice: mga Baal
  alternative: Baal; mga diyus-diyosang Baal
  rationale: Tahasan ang plural sa tekstong Hebreo. Hindi ito dapat gawing isahan o dagdagan ng paliwanag sa mismong talata.
- issue: Bilang ng ikalawang panauhan sa sanhi ng paratang
  choice: ninyo / kayo
  alternative: mo / ka
  rationale: Maramihan ang hulapi sa בַּעֲזָבְכֶם, kaya kasama sa pananagutan si Ahab at ang sambahayan ng kanyang ama, bagaman isahan ang sumunod na anyong pandiwa sa Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan ng iyong ama” upang mapanatili ang dinastiko at pampamilyang diwa ng Hebreo. Inayos sa natural na Filipino ang putol na sugnay na “kundi ikaw at ang sambahayan...” sa pamamagitan ng “ang gumawa nito,” na nililinaw sa talababa nang hindi binabago ang diwa.
