  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: tl
  text: 'Kaya kinuha nila ang torong ibinigay sa kanila at inihanda iyon. Mula umaga hanggang tanghali ay tumawag sila sa pangalan ni Baal: “O Baal, sagutin mo kami!” Ngunit walang tinig at walang sumasagot. At paika-ika silang lumigid[a] sa altar na ginawa niya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palukso-lukso silang lumigid” o “sumayaw sila sa palibot.” Malamang na tumutukoy ang pandiwang Hebreo sa ritwal na pagkilos na parang pag-ika o pagluksong-lukso, at maaaring sinasadyang umalingawngaw sa paggamit ni Elias ng kaparehong salitang-ugat sa talata 21.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “na ginawa niya”; hindi tahasang tinutukoy kung sino ang “niya.”
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת־הַפָּר אֲשֶׁר נָתַן לָהֶם
  choice: kinuha nila ang torong ibinigay sa kanila
  rationale: Tuwirang isinasalin ang salaysay at pinananatili ang naunang pagbibigay ng toro sa kanila nang hindi tinutukoy kung sino ang nagbigay.
- source_word: וַיַּעֲשׂוּ
  choice: inihanda iyon
  rationale: Sa konteksto ng paghahandog, eliptikal ang pandiwa at tumutukoy sa paghahanda sa toro; ang “inihandog” ay magpapahiwatig ng higit sa tahasang sinasabi ng teksto.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: tumawag sila sa pangalan ni Baal
  rationale: Pinananatili ang Hebreong idyoma ng pagtawag sa pangalan ng isang diyos at ang kultikong diin nito.
- source_word: מֵהַבֹּקֶר וְעַד־הַצָּהֳרַיִם
  choice: mula umaga hanggang tanghali
  rationale: Natural at malinaw na katumbas sa makabagong Tagalog.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: O Baal, sagutin mo kami!
  rationale: Ang “O” ay nagpapahayag ng tahasang pagtawag, at ang “sagutin” ay angkop sa konteksto ng panalangin o panawagan.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: walang tinig at walang sumasagot
  rationale: 'Pinananatili ang madiing dalawang sugnay: walang narinig na tinig at walang tumugon.'
- source_word: וַיְפַסְּחוּ
  choice: paika-ika silang lumigid
  rationale: Ipinapakita ang malamang na pilay, lukso-lukso, o ritwal na pagkilos at pinananatili ang ugnayang leksikal sa kaparehong ugat sa talata 21.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Kasama ng “lumigid,” natural na ipinahihiwatig ang pagkilos sa palibot ng altar nang hindi sinasabing umakyat sila sa ibabaw nito.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Pinananatili ang pandiwang isahan at ang di-tiyak na tinutukoy ng panghalip sa Hebreo, sa halip na gawing balintiyak at alisin ang anyong iyon.
theological_decisions:
- issue: Idyoma ng pagtawag kay Baal
  choice: tumawag sila sa pangalan ni Baal
  alternative: nakiusap sila kay Baal / tinawagan nila si Baal
  rationale: Pinananatili ang biblikal na pormula ng pagtawag sa pangalan nang hindi ipinahihiwatig na lehitimo o mabisa ang kanilang pagsamba.
- issue: Kahulugan ng וַיְפַסְּחוּ
  choice: paika-ika silang lumigid
  alternative: sumayaw sila / palukso-lukso silang lumigid
  rationale: Hindi pinapantay sa pangkalahatang sayaw ang posibleng ritwal na pag-ika o pagluksong may ironikong kaugnayan sa talata 21.
- issue: Di-tiyak na simuno ng אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  alternative: na ginawa / na itinayo
  rationale: Iniiwan ang di-tiyak na pagkakakilanlan ng panlalaking simuno sa halip na tukuyin kung sino ang gumawa ng altar.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “altar,” na karaniwan at madaling maunawaan, habang pinanatili ang Hebreong pag-uulit sa “walang tinig at walang sumasagot” at ang di-tiyak na panghalip sa hulihan.
