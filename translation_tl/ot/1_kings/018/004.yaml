  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: tl
  text: Nang nililipol ni Jezebel ang mga propeta ni Yahweh[a], kumuha si Obadias ng isang daang propeta at itinago sila nang tiglilimampu sa mga kuweba[b], at naglaan siya para sa kanila ng tinapay at tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinapatay”; mas literal, “pinuputol” ang mga propeta ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “limampung lalaki sa kuweba.” Malamang na ang ibig sabihin ng Hebreo ay itinago niya sila sa mga pangkat na tiglilimampu, marahil sa magkahiwalay na mga kuweba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: Nang nililipol
  rationale: Ang konstruksyong וַיְהִי + בְּ + infinitive construct ay nagtatakda ng panahong pinangyarihan. Ang Hiphil ng כרת ay literal na “putulin” ngunit dito ay nangangahulugang lipulin o patayin; pinananatili ng “nililipol” ang diwa nang natural sa Filipino.
- source_word: אִיזֶבֶל
  choice: Jezebel
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Filipino.
- source_word: נְבִיאֵי יְהוָה
  choice: mga propeta ni Yahweh
  rationale: Likas na salin ng construct chain sa Filipino, at tuwirang pinangalanan ang Diyos sa anyong Yahweh.
- source_word: וַיִּקַּח עֹבַדְיָהוּ
  choice: kumuha si Obadias
  rationale: Tuwirang isinasalin ang לקח bilang “kumuha” nang hindi dinaragdagan ang teksto ng tiyak na paraan ng pag-aaruga o pagliligtas.
- source_word: מֵאָה נְבִאִים
  choice: isang daang propeta
  rationale: Tuwiran at natural na pagsasalin ng bilang at pangngalan.
- source_word: וַיַּחְבִּיאֵם
  choice: itinago sila
  rationale: Ang Hiphil ng חבא ay nangangahulugang itago o ikubli; “itinago” ang pinakakaraniwang malinaw na katumbas.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: nang tiglilimampu sa bawat kuweba
  rationale: Ipinahahayag nito ang malamang na distributibong diwa—dalawang pangkat na tiglilimampu sa magkahiwalay na kuweba—habang itinatala sa talababa ang literal na anyong isahan ng Hebreo.
- source_word: וְכִלְכְּלָם
  choice: Tinustusan niya sila
  rationale: Ang Pilpel na כלכל ay tumutukoy sa patuloy na paglalaan o pagsustento; ang “tinustusan” ay sumasaklaw kapwa sa tinapay at tubig.
- source_word: לֶחֶם וָמָיִם
  choice: tinapay at tubig
  rationale: Pinanatili ang tiyak at konkretong mga salitang ginamit sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Lakas ng pandiwang כרת tungkol sa mga propeta
  choice: nililipol
  alternative: pinapatay
  rationale: Ang “nililipol” ay malinaw na naghahatid ng pagwasak o pagpatay sa pangkat, ngunit hindi nagdaragdag ng isang tiyak na paraan ng pagpatay na hindi sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kuweba” bilang pangkaraniwan at madaling maunawaang salita; iniwasan ang sobrang arkaikong ayos at ang mga dagdag na interpretasyong wala sa Hebreo.
