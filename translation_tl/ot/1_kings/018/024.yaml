base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: tl
  text: “Tumawag kayo sa pangalan ng inyong diyos[a], at tatawag naman ako sa pangalan ni Yahweh. Ang diyos na sasagot sa pamamagitan ng apoy—siya ang Diyos.” Sumagot ang buong bayan, “Mabuti ang panukalang iyan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inyong mga diyos.” Ang אֱלֹהֵיכֶם ay maaaring unawaing tunay na maramihan, bagaman sa kontekstong ito ay maaari rin itong tumukoy sa isang diyos na kinakatawan sa paligsahan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, maaari ring “Mabuti ang salita” o “Mabuti ang bagay na ito.” Ang Hebreong דָּבָר ay maaaring mangahulugang “salita,” “bagay,” o “panukala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: Tumawag kayo sa pangalan
  rationale: Ang קרא בְּשֵׁם ay tumutukoy sa pagtawag o pagdalangin sa isang diyos sa pangalan nito. Likas sa modernong Tagalog ang “tumawag sa pangalan” at pinananatili nito ang pormang Hebreo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong diyos
  rationale: Bagaman maaaring unawaing maramihan ang anyo, ang konteksto ng paligsahan laban kay Baal at ang isahang balangkas ng kasunod na pahayag ay pumapabor sa “inyong diyos.” Nananatili sa talababa ang tunay na alternatibong maramihan.
- source_word: וַאֲנִי אֶקְרָא
  choice: at tatawag naman ako
  rationale: Ipinahihiwatig ng “naman” ang paghahambing at pagsalungat sa dalawang panig nang hindi ginagawang tahasang “ngunit” ang payak na pang-ugnay na Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: Ang Diyos na sasagot sa pamamagitan ng apoy
  rationale: Malinaw na inilalarawan ng “sa pamamagitan ng apoy” ang gamit o paraan ng pagsagot na ipinahihiwatig ng בָאֵשׁ, at iniiwasan ang posibleng maling pagkaunawa sa “sasagot sa apoy.”
- source_word: הוּא הָאֱלֹהִים
  choice: siya ang Diyos
  rationale: Pinananatili ang mariing panghalip na הוּא at ang sukdulang pagkilala kung sino ang tunay na Diyos.
- source_word: וַיַּעַן כָּל הָעָם וַיֹּאמְרוּ
  choice: Sumagot ang buong bayan
  rationale: Ang dalawang Hebreong pandiwa ng pagpapakilala sa tuwirang pananalita ay likas na naipahahayag sa Tagalog sa pamamagitan ng “sumagot,” nang hindi inuulit ang “at sinabi.”
- source_word: טוֹב הַדָּבָר
  choice: Mabuti ang panukalang iyan
  rationale: Sa konteksto, tinatanggap ng bayan ang iminungkahing pagsubok. Ang “panukala” ang pinakanatural na salin sa Tagalog, habang inilalahad sa talababa ang mas literal na saklaw ng דָּבָר.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulo.
- issue: Isahan o maramihan sa אֱלֹהֵיכֶם
  choice: inyong diyos
  alternative: inyong mga diyos
  rationale: Maaaring maramihan ang anyo, ngunit karaniwang nagagamit ang אֱלֹהִים bilang isahan para sa isang diyos. Sa kontekstong ito, si Baal ang diyos na kinakatawan ng kabilang panig; gayunman, hindi inaalis ang maramihang pagbasa at inilalagay ito sa talababa.
- issue: Pagkilala sa Diyos na sumasagot sa apoy
  choice: Ang Diyos na sasagot sa pamamagitan ng apoy—siya ang Diyos
  alternative: ang diyos na sasagot sa pamamagitan ng apoy—siya ang Diyos
  rationale: Ang tiyak na anyong הָאֱלֹהִים at ang sukdulang pahayag ay naghaharap ng pagsubok upang makilala ang tunay na Diyos. Pinananatili ng pangungusap ang lohika ng pagkilala nang hindi ipinapasok ang isang denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong הָעָם at ang natural na “panukalang iyan” para sa pagsang-ayon ng mga tao. Ang mga tandang panipi at em dash ay nagpapalinaw sa dalawang pahayag at sa mariing konklusyon.
