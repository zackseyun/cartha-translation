  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: tl
  text: Sinabi ni Elias kay Ahab, “Umakyat ka, kumain at uminom, sapagkat may dagundong ng ulan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sapagkat may tunog ng saganang ulan.” Maikli at matingkad ang pariralang Hebreo na קוֹל הֲמוֹן הַגָּשֶׁם; maaaring tumukoy ang הֲמוֹן sa dagundong o sa kasaganaan ng ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang payak na “Sinabi” nang hindi kailangang ulitin ang pangatnig.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לְאַחְאָב
  choice: kay Ahab
  rationale: Minamarkahan ng לְ ang taong kinakausap; “kay Ahab” ang natural na katumbas sa Filipino.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili nito ang tiyak na diwang pataas ng pandiwang עלה, sa halip na gawing pangkalahatang “Tumayo ka” o “Humayo ka.”
- source_word: אֱכֹל וּשְׁתֵה
  choice: kumain at uminom
  rationale: Tuwirang salin ng dalawang pautos, nang walang idinagdag na paliwanag tungkol sa ipinahihiwatig ng pagkain at pag-inom.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos at ang pormal ngunit natural na “sapagkat” ay angkop sa marangal na salaysay.
- source_word: קוֹל
  choice: naririnig na
  rationale: Ang קוֹל ay “tunog/tinig/ingay.” Sa Filipino, ang “naririnig na” ay likas na paraan upang ipakilala ang tunog, at ipinahihiwatig ng “na” na paparating o nagsisimula na ang ipinahayag na ulan.
- source_word: הֲמוֹן
  choice: dagundong
  rationale: Ang הֲמוֹן ay maaaring tumukoy sa ugong, dagundong, kaguluhan, karamihan, o kasaganaan. Pinananatili ng “dagundong” ang matingkad na pandinigang larawan ng parirala.
- source_word: הַגָּשֶׁם
  choice: ulan
  rationale: Tuwirang katumbas ng גֶּשֶׁם; hindi na pinalawak sa “bagyo” upang maiwasang magdagdag ng hindi tahasang sinabi.
