  naturalness: Natural at marangal sa makabagong Filipino ang “Umakyat ka, kumain at uminom” at “sapagkat may dagundong ng ulan.” Mas tuwiran at mas maigsi ang binagong sugnay kaysa “naririnig na ang ...”.
