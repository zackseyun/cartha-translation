language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲלֶ֥ה אַחְאָ֖ב לֶ/אֱכֹ֣ל וְ/לִ/שְׁתּ֑וֹת וְ/אֵ֨לִיָּ֜הוּ עָלָ֨ה אֶל רֹ֤אשׁ הַ/כַּרְמֶל֙ וַ/יִּגְהַ֣ר אַ֔רְצָ/ה וַ/יָּ֥שֶׂם פָּנָ֖י/ו בֵּ֥ין ברכ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: tl
  text: Kaya umakyat si Ahab upang kumain at uminom. Ngunit umakyat naman si Elias sa tuktok ng Carmel[a]. Yumuko siya hanggang sa lupa at inilagay ang kanyang mukha sa pagitan ng kanyang mga tuhod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa taluktok ng Carmel” o “sa tuktok ng Bundok Carmel.”
    reason: lexical_alternative
  - marker: b
    text: Inilalarawan ng Hebreo ang pisikal na postura ni Elias. Ipinahihiwatig ng mas malawak na konteksto na nananalangin siya, ngunit hindi iyon tahasang sinasabi sa talatang ito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: umakyat
  rationale: Karaniwang pandiwang pasalaysay mula sa עלה; pinananatili nito ang direksiyong paitaas at natural sa modernong Tagalog.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: upang kumain at uminom
  rationale: Ang mga pawatas ay nagpapahayag ng layunin. Natural sa Tagalog ang iisang “upang” para sa dalawang magkaugnay na kilos.
- source_word: וְאֵלִיָּהוּ
  choice: Ngunit … naman si Elias
  rationale: Literal na “at” ang pang-ugnay, ngunit malinaw ang paghahambing ng kilos nina Ahab at Elias. Ang “ngunit … naman” ay natural na nagpapakita ng kaibhan nang hindi binabago ang salaysay.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: umakyat … sa tuktok ng Carmel
  rationale: Ang רֹאשׁ ay literal na “ulo” ngunit tumutukoy rito sa tuktok. Hindi idinagdag ang “Bundok” sa pangunahing teksto sapagkat wala itong tahasang katumbas sa parirala.
- source_word: וַיִּגְהַר אַרְצָה
  choice: Yumuko siya hanggang sa lupa
  rationale: Ang bihirang pandiwang גהר ay naglalarawan ng pagyukod o pagbaluktot nang mababa. Inilalarawan lamang ng salin ang pisikal na ayos at hindi tahasang tinatawag itong pananalangin.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין ברכיו
  choice: inilagay ang kanyang mukha sa pagitan ng kanyang mga tuhod
  rationale: Tuwiran at kongkretong paglalarawan ito ng postura ni Elias, na malapit sa Hebreo at malinaw sa modernong Tagalog.
theological_decisions:
- issue: Kung dapat bang tukuyin sa pangunahing teksto na nananalangin si Elias
  choice: Panatilihin lamang ang pisikal na paglalarawan ng kanyang postura.
  alternative: “Yumuko siya upang manalangin” o “nanalangin siyang nakayuko.”
  rationale: Maaaring ipinahihiwatig ng mas malawak na konteksto ang pananalangin, ngunit hindi ito tahasang sinasabi ng talata. Pinananatili ng salin ang pagkakaibang iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal at madaling makilalang pangalang “Elias.” Iniwasan ang tahasang interpretasyong “nanalangin” sa pangunahing teksto upang manatili sa sinasabi mismo ng Hebreo.
