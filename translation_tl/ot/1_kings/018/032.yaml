base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: tl
  text: Gamit ang mga bato, nagtayo siya ng altar sa pangalan ni Yahweh. At gumawa siya ng kanal sa palibot ng altar, na may sukat na pagkakasya ng dalawang seah ng binhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “gaya ng sukat ng dalawang seah ng binhi,” isang eliptikong parirala na tumutukoy sa laki o kapasidad ng kanal. Ang seah ay isang sinaunang takal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Gamit ang mga bato, nagtayo siya ng altar
  rationale: Natural itong Filipino para sa literal na diwang “itinayo niya ang mga bato bilang altar,” nang hindi idinaragdag ang “muling itinayo,” na nagmumula sa naunang talata.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Pinananatili ang karaniwang kahulugan ng בְּשֵׁם at ang personal na pangalang יְהוָה, sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: Gumawa rin siya ng kanal
  rationale: Ang תְּעָלָה ay kanal o hukay na daluyan; malinaw at natural ang “kanal” sa tagpong nakapalibot ito sa altar.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: na ang sukat ay parang lalagyan ng dalawang seah ng binhi
  rationale: Sinasalamin nito ang mahirap at eliptikong Hebreong paghahambing nang hindi tiyakang ipinapasiya kung lawak o kapasidad ang tinutukoy. Pinananatili rin ang sinaunang yunit na seah.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: sa palibot ng altar
  rationale: Tuwirang ipinahahayag ang nakapaligid na posisyon ng kanal.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanal” sa halip na mas kolokyal na “bambang,” at pinanatili ang sinaunang yunit at ang likas na kalabuan ng pariralang Hebreo.
