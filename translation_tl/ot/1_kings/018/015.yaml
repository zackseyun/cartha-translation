source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: tl
  text: 'At sinabi ni Elias, “Buhay si Yahweh ng mga hukbo, na sa harapan niya ako nakatayo: tiyak na magpapakita ako sa kanya[a] ngayong araw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “haharap ako sa kanya” o “hahayaan kong makita niya ako.” Ang pandiwang Hebreo ay maaaring mangahulugang makita, magpakita, o iharap ang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili nito ang karaniwang pormula ng panunumpa sa Hebreo at ang taimtim nitong puwersa sa maikli at likas na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili nito ang malawak na larawan ng banal na titulong Hebreo nang hindi nililimitahan ang tinutukoy sa mga hukbo ng tao lamang.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: na sa harapan niya ako nakatayo
  rationale: Pinananatili ang larawan ng pagtayo sa presensiya ng isang nakatataas, na maaari ring magpahiwatig ng paglilingkod, nang hindi iyon tahasang ipinapaliwanag sa pangunahing teksto.
- source_word: כִּי הַיּוֹם
  choice: ngayong araw
  rationale: Malinaw na inihahayag ang panahong binibigyang-diin; ipinahihiwatig ng pormula ng panunumpa at ng “tiyak” ang lakas ng katiyakan.
- source_word: אֵרָאֶה אֵלָיו
  choice: tiyak na magpapakita ako sa kanya
  rationale: Ang Niphal ng ראה ay maaaring mangahulugang makita, magpakita, o humarap. Likas sa Tagalog ang “magpapakita ako sa kanya” at pinananatili nito ang kaugnay na kalabuan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang taimtim na pormula ng panunumpa at ang larawan ng pagtayo sa harapan ni Yahweh, habang inilagay sa talababa ang mga tunay na posibleng kahulugan ng pangwakas na pandiwa.
