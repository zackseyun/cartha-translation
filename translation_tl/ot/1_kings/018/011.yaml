  text: And now you are saying, ‘Go, say to your lord, “Look, Elijah is here.”’
translation:
  language: tl
  text: At ngayon, sinasabi mo, ‘Humayo ka at sabihin mo sa panginoon mo, “Narito si Elias.”’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pag-uugnay at agarang diin ng Hebreong parirala.
- source_word: לֵךְ אֱמֹר
  choice: Humayo ka at sabihin mo
  rationale: Likas ngunit marangal na Filipino para sa magkasunod na pautos na ‘humayo’ at ‘sabihin.’
- source_word: לַאדֹנֶיךָ
  choice: sa panginoon mo
  rationale: Ang ’adon ay tumutukoy rito sa taong amo o pinuno ni Obadias, hindi sa banal na pangalang YHWH; kaya maliit ang titik sa ‘panginoon.’
- source_word: הִנֵּה
  choice: Narito
  rationale: Maikli at dignified na pantawag-pansin na angkop sa pagpapahayag na naroroon si Elias.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Tagalog.
theological_decisions:
- issue: Kahulugan ng אֲדֹנֶיךָ
  choice: panginoon mo
  alternative: amo mo
  rationale: Pinananatili ang karaniwang kahulugan at ugnayang pampamahalaan sa konteksto nang hindi ito ipinagkakamali sa pangalan ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang nakapaloob na tuwirang pananalita at ang bahagyang pormal na ‘Humayo’ upang tumugma sa biblikal na tagpo.
