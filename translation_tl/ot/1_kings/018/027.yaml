base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: tl
  text: Nang magtanghali, nilibak sila ni Elias at sinabi, “Sumigaw kayo nang malakas, sapagkat diyos siya! Marahil ay may iniisip siya, o lumihis siya[a], o naglalakbay siya. Marahil ay natutulog siya at magigising.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “nagbabawas siya.” Malamang na eupemismo ang Hebreong pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: Nang magtanghali
  rationale: Likas na salaysay sa makabagong Tagalog para sa paglipat ng tagpo pagsapit ng katanghalian, nang hindi gumagamit ng makalumang pormula.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: nilibak sila
  rationale: Ipinahahayag ng pandiwa ang mapanuyang pangungutya; ang “nilibak” ay maikli, marangal, at malinaw.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Sumigaw kayo nang malakas
  rationale: Pinananatili ang pautos at ang konkretong diwa ng Hebreong pariralang “sa malakas na tinig.”
- source_word: כִּי אֱלֹהִים הוּא
  choice: sapagkat isa siyang diyos
  rationale: Nililinaw na si Baal, isang diyos ng mga pagano, ang mapanuyang tinutukoy at hindi ang Diyos ng Israel.
- source_word: שִׂיחַ
  choice: malalim ang iniisip niya
  rationale: Natural na Tagalog para sa maaaring diwa ng pagiging abala sa pag-iisip, habang pinananatili ang mapanuyang tono.
- source_word: שִׂיג לוֹ
  choice: umalis muna siya
  rationale: Pinananatili ang di-tuwirang o eupemistikong anyo ng bihirang Hebreong pahayag; inilalagay sa talababa ang malamang na mas tiyak na kahulugan.
- source_word: דֶּרֶךְ לוֹ
  choice: naglalakbay siya
  rationale: Natural at tuwirang Tagalog para sa idyomang nagsasaad na siya ay nasa paglalakbay.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: Marahil ay natutulog siya at magigising
  rationale: Pinananatili ang mapanuyang mungkahi at ang intransitibong diwa na siya mismo ay magigising.
theological_decisions:
- issue: Paglalarawan kay Baal sa אֱלֹהִים
  choice: isa siyang diyos
  alternative: siya ang Diyos
  rationale: Ang pahayag ay mapanuyang pananalita ni Elias tungkol kay Baal, hindi pagkilala kay Baal bilang Diyos ng Israel. Iniiwasan ng “isang diyos” ang maling pagkakakilanlan.
- issue: Pagbibigay-kahulugan sa eupemistikong שִׂיג לוֹ
  choice: umalis muna siya
  alternative: nagbabawas siya
  rationale: Hindi tiyak at di-tuwiran ang bihirang Hebreong pahayag. Pinananatili sa pangunahing teksto ang eupemismo at inilalahad sa talababa ang malamang na kahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Pinananatili ang matalim na pangungutya ni Elias, ngunit hindi ginagawang tahasang magaspang ang eupemismong nasa Hebreo.
