  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Ako nga.[a] Humayo ka at sabihin mo sa iyong panginoon, ‘Narito si Elias.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ako iyon.” Sa Hebreo, isang mariing panghalip na “ako” lamang ang ginamit bilang pagpapakilala sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Sinabi niya sa kanya
  rationale: Natural na Filipino para sa kasunod na kilos sa salaysay at sa di-tuwirang layon ng pagsasalita.
- source_word: אָנִי
  choice: Ako nga
  rationale: Pinananatili ang mariing panghalip at ang diwa ng pagpapakilala sa sarili nang hindi nagdaragdag ng tahasang panaguri na wala sa Hebreo.
- source_word: לֵךְ אֱמֹר
  choice: Humayo ka at sabihin mo
  rationale: Inilalarawan ang dalawang pautos; ang “humayo” ay marangal at malinaw, at ang “sabihin” ay angkop sa kasunod na tuwirang sipi.
- source_word: לַאדֹנֶיךָ
  choice: sa iyong panginoon
  rationale: Tumutukoy ito sa taong nakatataas kay Obadias, si Ahab. Ang maliit na titik ay tumutulong na maiba ito sa banal na titulong “Panginoon.”
- source_word: הִנֵּה
  choice: Narito
  rationale: Natural na deiktikong pahayag sa Filipino na tumatawag-pansin sa presensiya ni Elias.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginagamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
theological_decisions:
- issue: Pagtukoy ng אָדוֹן sa isang taong nakatataas
  choice: panginoon
  alternative: amo
  rationale: Ang “panginoon” na may maliit na titik ay nagpapanatili sa saklaw ng titulong Hebreo at malinaw na tumutukoy kay Ahab bilang taong nakatataas, hindi sa Diyos.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Pinanatili ang kaiklian at diin ng Hebreo; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
