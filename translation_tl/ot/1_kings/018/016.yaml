  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: tl
  text: Kaya pumunta si Obadias upang salubungin si Ahab at ipinaalam niya ito sa kanya[a]. Pagkatapos, pumunta si Ahab upang salubungin si Elias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniulat niya ito sa kanya.” Ang pandiwang Hebreo ay maaaring mangahulugang “sinabi,” “ipinaalam,” o “iniulat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Ang wayyiqtol ng הלך ay nagsusulong sa salaysay at payak na nagsasaad ng pagpunta; natural at malinaw ang “pumunta” sa makabagong Filipino.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag ng לִקְרַאת ang paglapit sa isang tao upang makatagpo siya; ang “upang salubungin” ay malinaw sa parehong paglitaw at nagpapahiwatig ng sinadyang pagharap.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino.
- source_word: וַיַּגֶּד לוֹ
  choice: ibinalita sa kanya ang sinabi
  rationale: Ang Hiphil ng נגד ay maaaring mangahulugang magsabi, magbalita, o mag-ulat. Ipinahihiwatig lamang sa Hebreo ang nilalaman; ang “ang sinabi” ay tumutukoy sa naunang mensahe nang hindi ito inuulit.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: Pagkatapos, pumunta si Ahab
  rationale: Ang ikalawang wayyiqtol ay nagpapatuloy sa sunod-sunod na pangyayari; natural sa Filipino ang “Pagkatapos” bilang panandang pasalaysay.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
