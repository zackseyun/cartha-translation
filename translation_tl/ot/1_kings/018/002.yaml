translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang salaysay na ugnayan sa naunang talata at ang circumstantial na katangian ng huling sugnay. Ang lahat ng marker ng talababa ay inilagay sa pangunahing teksto.
