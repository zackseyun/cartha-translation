  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: tl
  text: Kaya nagpunta si Elias upang humarap kay Ahab.[a] Samantala, matindi ang taggutom sa Samaria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpakita ng sarili kay Ahab” o “iharap ang sarili kay Ahab.”
    reason: lexical_alternative
  - marker: b
    text: O “napakalubha ng taggutom sa Samaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya umalis
  rationale: Isinusulong ng waw-consecutive ang salaysay at iniuugnay ang pagsunod ni Elias sa utos sa naunang talata. Likas sa Filipino ang “Kaya” para sa resultang ugnayan, at ang “umalis” ay angkop sa pagpunta niya upang humarap kay Ahab.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang karaniwang anyo ng pangalan sa tradisyong biblikal na Filipino.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: upang humarap kay Ahab
  rationale: Ang Niphal infinitive ng ראה ay nangangahulugang magpakita, magpakita ng sarili, o humarap. Ang “humarap kay Ahab” ay natural at marangal sa modernong Filipino habang pinananatili ang diwang personal na pagpapakita sa hari.
- source_word: וְהָרָעָב
  choice: Samantala, ... ang taggutom
  rationale: Ang waw ay nagpapakilala rito ng pangyayaring nasa likuran o kasabay ng pangunahing kilos, hindi lamang ng susunod na aksiyon. Malinaw itong ipinahihiwatig ng “Samantala.”
- source_word: חָזָק
  choice: matindi
  rationale: Bagaman literal na “malakas,” ang חָזָק kapag tumutukoy sa taggutom ay nagsasaad ng tindi o kalubhaan. Ang “matindi” ay natural sa kasalukuyang Filipino.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang בְּ ay panandang panlunan. Hindi nililinaw ng salin kung lungsod o mas malawak na lupain ang tinutukoy, kaya pinananatili ang likas na ambiguwidad sa “sa Samaria.”
