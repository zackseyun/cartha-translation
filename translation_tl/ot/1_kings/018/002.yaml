    issue: Ang “umalis” ay hindi kasingtuwid ng “nagpunta” para sa וַיֵּלֶךְ.
    rationale: Maaaring ipahiwatig ng “umalis” ang pag-alis mula sa isang lugar nang hindi tahasang itinatampok ang pagpunta kay Ahab. Ang “nagpunta” ay pinananatili ang direksiyon at kilos ng Hebreo.
  - severity: low
    issue: Maaaring linawin ang refleksibong diwa sa unang talababa.
    rationale: Ang “magpakita kay Ahab” ay maiintindihan, ngunit ang “magpakita ng sarili kay Ahab” ay mas tahasang sumasalamin sa Niphal na “magpakita/humayo upang makita.”
