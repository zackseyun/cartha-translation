base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: tl
  text: Sagutin mo ako, Yahweh, sagutin mo ako, upang malaman ng bayang ito na ikaw, Yahweh, ang Diyos, at ikaw ang nagpabalik ng kanilang puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “kanilang puso” ay isahan at kolektibong tumutukoy sa buong bayan. Ang pandiwa ay causative: “ikaw ang nagpabalik ng kanilang puso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Sagutin mo ako
  rationale: Sa konteksto ng panalangin, humihiling si Elias ng hayag na tugon ng Diyos sa pamamagitan ng pagkilos. Pinanatili ang pag-uulit para sa diin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְיֵדְעוּ
  choice: upang malaman
  rationale: Ang pang-ugnay at anyong pandiwa ay nagpapahayag dito ng layunin o inaasahang bunga ng kahilingan ni Elias.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עַם ay kolektibong tumutukoy sa mga taong naroon; ang “bayang ito” ay natural at marangal sa modernong Tagalog.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: na ikaw, Yahweh, ang Diyos
  rationale: Ipinahahayag ng sugnay na si Yahweh ang Diyos, salungat kay Baal. Likas sa Tagalog ang “ang Diyos” at naaangkop ito sa tiyak na anyo ng Hebreo.
- source_word: וְאַתָּה הֲסִבֹּתָ אֶת לִבָּם אֲחֹרַנִּית
  choice: at ikaw ang nagpabalik-loob sa kanila
  rationale: Ang Hiphil ng סבב ay nagpapanatili sa Diyos bilang tahasang tagapagpangyari ng pagbabalik. Ang idyomang “nagpabalik-loob” ay malinaw na naghahatid ng pagbaling ng puso pabalik sa Diyos, bagaman inilalagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagkilos ng Diyos sa pagbabalik ng bayan
  choice: ikaw ang nagpabalik-loob sa kanila
  alternative: ikaw ang nagbalik ng kanilang puso pabalik
  rationale: Pinananatili ng salin ang matibay na pagkilos ng Diyos na nasa pandiwang causative at perfect, nang hindi ito pinahihina bilang pahintulot lamang. Hindi rin nito pinalalawak ang pahayag tungo sa isang sistemang doktrinal na lampas sa talata.
- issue: Kolektibong “puso” at direksiyon ng pagbaling
  choice: nagpabalik-loob sa kanila
  alternative: nagbalik ng kanilang puso pabalik
  rationale: Ang pangunahing salin ay natural sa Tagalog at ipinahihiwatig ng konteksto ang pagbabalik kay Yahweh. Gayunman, ang literal na Hebreo ay gumagamit ng isahang kolektibong “kanilang puso” at ng pang-abay na “pabalik,” kaya pinanatili ang anyong iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalanging pampubliko. Inilagay ang “Yahweh” sa natural na posisyong pantawag, pinanatili ang mariing pag-uulit, at ginamit ang karaniwang idyomang “magpabalik-loob” habang inilalahad sa talababa ang mas literal na kolektibong larawan ng Hebreo.
