source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: tl
  text: Ngayon, magsugo ka at tipunin mo sa akin ang buong Israel sa Bundok Carmel[a], kasama ang apat na raan at limampung propeta ni Baal at ang apat na raang propeta ni Ashera[b], na kumakain sa hapag ni Jezebel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa Bundok Carmel.” Ang pang-ukol sa Hebreo ay nagpapahiwatig ng pagkilos patungo sa lugar na pagtitipunan.
    reason: lexical_alternative
  - marker: b
    text: Ang “Ashera” ay maaaring tumukoy sa diyosang si Ashera o, sa ilang konteksto, sa isang sagradong bagay na kaugnay niya. Dito, ang pagkakapantay nito kay Baal ay pumapabor sa pagtukoy sa diyosa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “na nakikisalo sa hapag ni Jezebel”; ipinahihiwatig nitong sila ay pinakakain at itinataguyod ng reyna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang pandiskurso na nagpapakilala sa agarang utos ni Elias; natural sa Filipino ang “Kaya ngayon” sa ganitong daloy.
- source_word: שְׁלַח קְבֹץ
  choice: magsugo ka at tipunin mo
  rationale: 'Pinananatili ang dalawang pautos: ang pagpapadala ng mga utos o sugo at ang pagtitipon bilang layunin nito.'
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang ipinahahayag ang direksiyon patungo kay Elias nang hindi ito binibigyang-kahulugang “sa harap ko.”
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong pambansang katawagan at ang retorikal na lawak ng panawagan.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: sa Bundok Carmel
  rationale: Ang אֶל ay nagpapahiwatig ng patutunguhan; sa Filipino, likas na naipapahayag ng “sa” ang pook na patutunguhan o pagtitipunan, habang nililinaw ito sa talababa.
- source_word: נְבִיאֵי הַבַּעַל
  choice: mga propeta ni Baal
  rationale: Malinaw at likas na construct rendering para sa mga propetang kaugnay o naglilingkod kay Baal.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: apat na raan at limampu
  rationale: Isinusulat sa salita ang bilang upang umangkop sa marangal na estilong pampanitikan.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: mga propeta ni Ashera
  rationale: Ang pagkakapantay nito sa “mga propeta ni Baal” ay pumapabor sa pangalan ng diyosa; hindi ipinapasok sa pangunahing teksto ang mas tiyak ngunit pinagtatalunang “poste ni Ashera.”
- source_word: אַרְבַּע מֵאוֹת
  choice: apat na raan
  rationale: Isinusulat sa salita ang bilang para sa pagkakapare-pareho at estilong pampanitikan.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: na kumakain sa hapag ni Jezebel
  rationale: Pinananatili ang konkretong larawan ng pagkain sa hapag, habang ipinapaliwanag sa talababa ang pahiwatig ng pagtataguyod ng reyna.
theological_decisions:
- issue: Kahulugan ng אֲשֵׁרָה sa talatang ito
  choice: 'Isinalin ang Ashera bilang pangalan ng diyosa: “mga propeta ni Ashera.”'
  alternative: Maaaring tumukoy ito sa isang sagradong bagay o posteng kaugnay ng pagsamba kay Ashera.
  rationale: Ang pagkakapantay sa “mga propeta ni Baal” ay higit na pumapabor sa banal na persona rito, ngunit pinananatili sa talababa ang tunay na saklaw ng katawagan sa ibang konteksto.
- issue: Saklaw ng “buong Israel”
  choice: Pinanatili ang kolektibong pambansang pahayag na “ang buong Israel.”
  alternative: “Lahat ng Israelita,” na maaaring magmukhang mahigpit na tumutukoy sa bawat indibidwal.
  rationale: Ang Hebreo ay karaniwang kolektibong katawagan sa bansa; hindi dapat paliitin o gawing labis na distributibo ang retorikal na saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hapag” bilang likas na biblikal at dignified na salita, at pinanatili ang mga pangalang Baal, Ashera, Carmel, at Jezebel sa karaniwang anyong Filipino.
