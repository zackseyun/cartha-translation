base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Elias sa kanila, “Dakpin ninyo ang mga propeta ni Baal; huwag hayaang makatakas ang kahit isa sa kanila.” At dinakip nila ang mga iyon. Dinala sila ni Elias pababa sa Ilog[a] Kishon, at doon niya sila kinatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa isang ilog, batis, o daluyan ng tubig na maaaring pana-panahong matuyo.
    reason: lexical_alternative
  - marker: b
    text: O “doon niya sila pinatay.” Ang pandiwang Hebreo ay nagpapahiwatig ng marahas na pagpatay o pagkakatay.
    reason: lexical_precision
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: Dakpin ninyo
  rationale: Ang maramihang pautos ng תפשׂ ay humihiling ng sapilitang paghuli; natural at tuwiran ang “dakpin” sa modernong Tagalog.
- source_word: נְבִיאֵי הַבַּעַל
  choice: ang mga propeta ni Baal
  rationale: Direktang inililipat ang construct chain at pinananatili ang pangalan ng diyos na Baal.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: huwag hayaang makatakas ang kahit isa sa kanila
  rationale: 'Ang אִישׁ ay distributibo rito: walang kahit isang kabilang sa pangkat ang dapat makatakas. Mas natural ito sa Tagalog kaysa literal na “huwag makatakas ang isang lalaki,” nang hindi binabago ang saklaw.'
- source_word: וַיִּתְפְּשׂוּם
  choice: dinakip nila ang mga iyon
  rationale: Pinananatili ang ugnayang leksikal sa naunang pautos na “dakpin,” at nililinaw ng “mga iyon” na ang tinutukoy ay ang mga propeta.
- source_word: וַיּוֹרִדֵם
  choice: Dinala sila ni Elias pababa
  rationale: Ang Hiphil ng ירד ay causative, “pinababa/dinala pababa”; natural ang hulma sa Tagalog at pinananatili ang topograpikong galaw.
- source_word: נַחַל קִישׁוֹן
  choice: Ilog Kishon
  rationale: Ang נַחַל ay maaaring ilog, batis, o daluyan ng tubig. “Ilog Kishon” ang pinakanauunawaang katawagang heograpiko sa ordinaryong Tagalog, habang inilalagay sa talababa ang mas malawak na saklaw.
- source_word: וַיִּשְׁחָטֵם
  choice: pinatay sa pamamagitan ng paghiwa sa leeg
  rationale: Ang שׁחט ay mas tiyak kaysa pangkalahatang “pumatay” at tumutukoy sa pagkatay sa pamamagitan ng paghiwa sa lalamunan/leeg. Iniiwasan ng parirala ang malabong “kinatay,” na sa Tagalog ay karaniwang ginagamit sa hayop, habang pinananatili ang marahas na paraan.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang katumbas na panlunan.
theological_decisions:
- issue: Marahas na pagpatay sa mga propeta ni Baal
  choice: Tuwirang isinalaysay ang pagdakip at pagpatay sa pamamagitan ng paghiwa sa leeg, nang walang pagpapalambot o dagdag na moral na paliwanag.
  alternative: Gamitin lamang ang mas malambot na “ipinapatay” o magdagdag na ito ay hayagang iniutos ng Diyos.
  rationale: Malinaw na isinasalaysay ng Hebreo ang pagdakip at שׁחט. Hindi sinasabi ng talata mismo ang isang hiwalay na pahayag ng banal na pahintulot, kaya hindi iyon idinaragdag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Elias,” ang nakaugaliang anyong Tagalog ng pangalan, at malinaw na mga pandiwang pasalaysay. Hindi pinalambot ang karahasan at hindi rin dinagdagan ng teolohikal na paghatol na wala sa talata.
