  text: Then he arranged the wood, cut the bull into pieces, and placed it on the wood.
translation:
  language: tl
  text: Pagkatapos, inayos niya ang mga kahoy, hiniwa nang pira-piraso ang toro, at ipinatong iyon sa mga kahoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: inayos
  rationale: Ang ערך ay tumutukoy sa maayos na paglalatag o pagsasaayos; natural sa modernong Filipino ang “inayos” sa paghahanda ng handog.
- source_word: הָעֵצִים
  choice: mga kahoy
  rationale: Ang pangmaramihang anyo sa Hebreo ay tumutukoy sa mga piraso ng kahoy na panggatong; malinaw at likas dito ang “mga kahoy.”
- source_word: וַיְנַתַּח
  choice: hiniwa nang pira-piraso
  rationale: Ang נתּח ay paghiwa o paghati ng hayop sa mga bahagi para sa handog; malinaw sa karaniwang mambabasa ang pariralang ito.
- source_word: הַפָּר
  choice: ang toro
  rationale: Karaniwang tumutukoy ang פַּר sa toro sa konteksto ng paghahandog; hindi ipinipilit ng talata ang dagdag na “batang.”
- source_word: וַיָּשֶׂם
  choice: ipinatong
  rationale: Sa kasamang pariralang עַל הָעֵצִים, ipinahihiwatig ng שׂים ang paglalagay sa ibabaw; mas tiyak at natural ang “ipinatong.”
- source_word: עַל הָעֵצִים
  choice: sa mga kahoy
  rationale: Ipinapahayag ng עַל ang posisyong nasa ibabaw; kasama ng pandiwang “ipinatong,” sapat at natural ang “sa mga kahoy.”
