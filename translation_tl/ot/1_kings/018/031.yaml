  naturalness: Natural ang karamihan ng Tagalog, kabilang ang “Kumuha si Elias” at “ayon sa bilang.” Mas malinaw at mas marangal ang direktang pagpapakilala ng nilalaman ng “salita ni Yahweh” kaysa sa “na nagsasabi.”
  terminology: Ang “Elias,” “mga lipi,” “Jacob,” “Yahweh,” at “Israel” ay angkop sa modernong Filipino Tagalog at sa tradisyunal na gamit-Biblia. Ang talababa sa “mga anak ni Jacob” ay wastong nagpapaliwanag ng literal na panlalaking anyo nang hindi isinasara ang mas malawak na gamit nito sa konteksto.
