  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: tl
  text: 'Kumuha si Elias ng labindalawang bato, ayon sa bilang ng mga lipi ng mga anak ni Jacob[a], na siyang tumanggap ng salita ni Yahweh: “Israel ang magiging pangalan mo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “mga anak na lalaki ni Jacob”; maaari rin itong tumukoy sa mga anak o mga inapo ni Jacob bilang isang pangkat.
    reason: lexical_alternative
  - marker: b
    text: 'Tinutukoy nito ang pagpapalit ng Diyos sa pangalan ni Jacob: “Israel ang magiging pangalan mo” (Genesis 32:28; 35:10).'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha
  rationale: Likas na salin ng karaniwang pandiwang pasalaysay na לקח sa kontekstong ito.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Karaniwang anyo ng pangalan sa tradisyong biblikal na Tagalog at malinaw pa rin sa makabagong mambabasa.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: labindalawang bato
  rationale: Tuwiran at natural na katumbas ng bilang at pangngalan sa Hebreo.
- source_word: כְּמִסְפַּר
  choice: ayon sa bilang ng
  rationale: Pinananatili ang ideya ng pagtutugma sa bilang nang hindi nagiging matigas ang Tagalog.
- source_word: שִׁבְטֵי בְנֵי יַעֲקֹב
  choice: mga lipi ng mga anak ni Jacob
  rationale: Ang “mga lipi” ang karaniwang pambansa at angkang kahulugan ng שׁבט; ang “mga anak” ay malapit sa literal na בְנֵי.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: na tumanggap ng salita ni Yahweh
  rationale: Tinutukoy ng sugnay si Jacob. Ang “tumanggap ng salita” ay natural na Tagalog na nagpapanatili sa “salita” bilang pangngalan, bagaman ang Hebreo ay literal na nagsasabing dumating sa kaniya ang salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inilalahad ang pangalang tipan na nasa tekstong Hebreo.
- source_word: לֵאמֹר
  choice: na nagsasabi
  rationale: Ipinakikilala nito ang tuwirang sinabi at pinananatili ang ugnayan nito sa “salita ni Yahweh.”
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel ang magiging pangalan mo
  rationale: Pinananatili sa unahan ang “Israel,” gaya ng diin at ayos ng Hebreo, sa natural na modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa Hebreo; pinananatili itong tahasan sa halip na palitan ng titulo.
- issue: Tinutukoy ng kaugnay na sugnay na אֲשֶׁר
  choice: Jacob
  alternative: mga anak o mga lipi ni Jacob
  rationale: Ang isahang panghalip sa אֵלָיו at ang pahayag tungkol sa pagpapalit ng pangalan ay pinakanatural na tumutukoy kay Jacob, alinsunod sa salaysay ng Genesis.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang iisang pangungusap at ang diin sa pangalang “Israel,” habang ginawang likas sa Tagalog ang Hebreong pormulang “dumating sa kaniya ang salita ni Yahweh.”
