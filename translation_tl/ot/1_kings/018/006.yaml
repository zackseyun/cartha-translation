base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: tl
  text: Kaya hinati nila sa kanilang dalawa ang lupain upang daanan ito. Nagpunta si Ahab nang mag-isa sa isang daan, at si Obadias naman ay nang mag-isa sa ibang daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na inuulit sa Hebreo ang “isang daan” para sa dalawang lalaki: “Nagpunta si Ahab nang mag-isa sa isang daan, at nagpunta si Obadias nang mag-isa sa isang daan.” Ginamit sa teksto ang “ibang daan” sa ikalawang sugnay upang maging malinaw sa natural na Filipino na magkaiba ang kanilang mga ruta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: hinati nila sa kanilang dalawa
  rationale: Ang Piel na וַיְחַלְּקוּ ay aktibong paghahati, at sa konteksto ang לָהֶם ay nagpapahiwatig ng paghahati sa pagitan nilang dalawa.
- source_word: אֶת הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ang אֶרֶץ sa rehiyong kanilang lilibutin, kaya mas tiyak dito ang “lupain” kaysa “daigdig” o “bansa.”
- source_word: לַעֲבָר בָּהּ
  choice: na kanilang lalakbayin
  rationale: Ipinahahayag ng infinitive ng עבר kasama ng בָּהּ ang pagdaan o paglalakbay sa lupain; natural sa Filipino ang sugnay na ito at hindi nito dinaragdagan ang layunin.
- source_word: הָלַךְ
  choice: pumunta
  rationale: Sa paglalarawan ng magkahiwalay na ruta, ang “pumunta” ay natural at hindi nagpapahiwatig na tiyak na naglakad lamang sila.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: sa isang daan / sa ibang daan
  rationale: Literal na inuulit ng Hebreo ang “isang daan” para sa dalawang lalaki. Ginawang “ibang daan” ang ikalawang banggit upang maging malinaw at natural sa Filipino ang magkaibang ruta, habang inilalahad sa talababa ang anyong Hebreo.
- source_word: לְבַדּוֹ
  choice: mag-isa
  rationale: Tumpak at natural na ipinahahayag ng “mag-isa” na magkahiwalay silang pumunta.
- source_word: אַחְאָב / עֹבַדְיָהוּ
  choice: Ahab / Obadias
  rationale: Ginamit ang nakagawiang anyo ng mga pangalang biblikal sa Filipino.
