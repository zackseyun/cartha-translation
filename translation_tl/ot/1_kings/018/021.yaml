base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: tl
  text: Pagkatapos, lumapit si Elias sa buong bayan at sinabi, “Hanggang kailan kayo patuloy na paika-ika sa dalawang sangang nagkakahiwalay?[a] Kung si Yahweh ang Diyos, sumunod kayo sa kanya; ngunit kung si Baal, sumunod kayo sa kanya.” Ngunit hindi sumagot sa kanya ang bayan ni isang salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Hanggang kailan kayo mag-uurong-sulong sa pagitan ng dalawang paninindigan?” Mas literal, inilalarawan ng Hebreo ang pag-iika-ika o pagkapilay “sa dalawang sanga, hati, o tinidor”—isang mahirap na metapora ng hati o pabago-bagong katapatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Tuwirang ipinahahayag ang paglapit ni Elias sa nagkakatipong bayan at pinananatili ang pisikal at mapanghamong kilos sa tagpo.
- source_word: כָּל הָעָם
  choice: buong bayan
  rationale: Likas sa Tagalog ang kolektibong “buong bayan” at saklaw nito ang lahat ng taong kinakausap ni Elias.
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Karaniwang anyong Tagalog para sa hamong temporal ng Hebreo.
- source_word: פֹּסְחִים
  choice: patuloy na iika-ika
  rationale: Pinananatili ang kongkretong larawan ng paglakad nang pilay o hindi matatag sa halip na agad itong gawing abstraktong “mag-alinlangan.” Ipinahihiwatig ng participle ang nagpapatuloy na kilos.
- source_word: עַל שְׁתֵּי הַסְּעִפִּים
  choice: sa pagitan ng dalawang sanga
  rationale: Pinananatili ang di-pangkaraniwan ngunit matingkad na larawang Hebreo ng dalawang sanga o sangang nagkakahiwalay; hindi tahasang nilulutas bilang “dalawang paninindigan.”
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Kung si Yahweh ang Diyos
  rationale: Natural na predikasyon sa Tagalog at tuwirang pinananatili ang banal na pangalang יהוה.
- source_word: לְכוּ אַחֲרָיו
  choice: sumunod kayo sa kanya
  rationale: Malinaw at natural na katumbas ng idyomang “humayo sa likuran niya,” na tumutukoy sa katapatan at pagsunod.
- source_word: הַבַּעַל
  choice: si Baal
  rationale: Itinuturing ang Baal bilang pangalan ng diyos na kaagaw sa talata; ang pantukoy na “si” ang likas na gamit sa Tagalog para sa personal na pangalan.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: Ngunit wala ni isang salitang isinagot sa kanya ang bayan
  rationale: Pinananatili ang diin ng Hebreong “hindi sumagot ng isang salita” habang malinaw at natural sa Tagalog; ipinakikita ng “Ngunit” ang pagsalungat sa inaasahang tugon.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatiling “Yahweh” sa halip na palitan ng titulo.
- issue: Metapora ng hati o salawahang katapatan
  choice: panatilihin ang larawan ng pag-iika-ika sa pagitan ng dalawang sanga
  alternative: mag-alinlangan sa pagitan ng dalawang paninindigan
  rationale: Hindi tiyak kung paano eksaktong inuunawa ang kakaibang larawang Hebreo. Pinananatili ng salin ang kongkretong metapora at inilalagay sa talababa ang interpretatibong kahulugan nang hindi ito ipinipilit sa pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng payak na pangungusap at karaniwang bokabularyo. Sadyang pinanatili ang kakaibang kongkretong metapora ng Hebreo sa pangunahing teksto, habang ipinaliliwanag sa talababa ang malamang na diwa nito.
