revisions:
- from: Pagkatapos, lumapit si Elias sa buong bayan at sinabi, “Hanggang kailan kayo patuloy na iika-ika sa pagitan ng dalawang sanga?[a] Kung si Yahweh ang Diyos, sumunod kayo sa kanya; ngunit kung si Baal, sumunod kayo sa kanya.” Ngunit wala ni isang salitang isinagot sa kanya ang bayan.
  to: Pagkatapos, lumapit si Elias sa buong bayan at sinabi, “Hanggang kailan kayo patuloy na paika-ika sa dalawang sangang nagkakahiwalay?[a] Kung si Yahweh ang Diyos, sumunod kayo sa kanya; ngunit kung si Baal, sumunod kayo sa kanya.” Ngunit hindi sumagot sa kanya ang bayan ni isang salita.
  rationale: Inayos ang pangunahing metapora upang huwag gawing mas tiyak kaysa sa Hebreo ang kahulugan ng סְעִפִּים, habang pinananatili ang kongkretong imahen at ang kalabuan nito. Pinakinis din ang dalawang parirala para sa mas natural na modernong Filipino nang walang pagbabago sa kahulugan.
