base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Punuin ninyo ng tubig ang apat na banga[a] at ibuhos ninyo iyon sa ibabaw ng handog na sinusunog at ng kahoy.” Pagkatapos ay sinabi niya, “Gawin ninyo iyon sa ikalawang pagkakataon,” at ginawa nila iyon sa ikalawang pagkakataon. Pagkatapos ay sinabi niya, “Gawin ninyo iyon sa ikatlong pagkakataon,” at ginawa nila iyon sa ikatlong pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apat na pitsel”; ang salitang Hebreo ay tumutukoy sa isang sisidlan para sa pagdadala ng likido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos ay sinabi niya” at malinaw ang pagkakasunod-sunod.
- source_word: מִלְאוּ
  choice: Punuin ninyo
  rationale: Maramihang pautos ang anyo; malinaw at natural ang “Punuin ninyo.”
- source_word: אַרְבָּעָה כַדִּים
  choice: apat na banga
  rationale: Ang כַּד ay sisidlang ginagamit sa pagdadala ng likido. Karaniwan at hindi labis na tiyak ang “banga” sa Filipino.
- source_word: מַיִם
  choice: tubig
  rationale: Tuwirang katumbas ng karaniwang pangngalan.
- source_word: וְיִצְקוּ
  choice: at ibuhos ninyo iyon
  rationale: Ipinagpapatuloy nito ang utos sa maramihang kausap. Ang “iyon” ay tumutukoy sa tubig bilang kabuuan.
- source_word: עַל הָעֹלָה
  choice: sa handog na sinusunog
  rationale: Karaniwan at malinaw na katawagan sa sakripisyong עֹלָה, habang pinananatili ang pisikal na diwa ng pagbubuhos sa ibabaw nito.
- source_word: וְעַל הָעֵצִים
  choice: at sa mga kahoy
  rationale: Tumutukoy sa mga kahoy na inayos para sa paghahandog; natural sa Filipino ang maramihang “mga kahoy.”
- source_word: שְׁנוּ
  choice: Ulitin ninyo
  rationale: Ang pandiwa ay nag-uutos na gawin muli ang naunang kilos. Maikli at natural ito; ipinakikita ng kasunod na ikatlong utos ang bilang ng mga pag-uulit.
- source_word: וַיִּשְׁנוּ
  choice: at inulit nila iyon
  rationale: Iniulat ang pagsunod sa utos na ulitin ang pagbubuhos nang pangalawang pagkakataon.
- source_word: שַׁלֵּשׁוּ
  choice: Gawin ninyo iyon sa ikatlong pagkakataon
  rationale: Ang Piel imperative ng שלשׁ sa konteksto ay nangangahulugang gawin ang kilos sa ikatlong pagkakataon.
- source_word: וַיְשַׁלֵּשׁוּ
  choice: at ginawa nga nila iyon sa ikatlong pagkakataon
  rationale: Iniulat ang pagtupad sa ikatlong utos; ang “nga” ay natural na nagbibigay-diin sa aktuwal na pagsunod nang hindi nagdaragdag ng bagong ideya.
theological_decisions:
- issue: Paglilipat ng terminong pangsakripisyo na עֹלָה
  choice: handog na sinusunog
  alternative: handog na lubusang sinusunog
  rationale: Ang עֹלָה ay pamantayang handog na sinusunog. Pinananatili ng napiling parirala ang kinikilalang kahulugan nang hindi idinaragdag sa pangunahing teksto ang paliwanag na ang buong handog ay sinusunog.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magalang/maramihang anyong pautos na “ninyo,” malinaw na mga pandiwang kilos, at pamilyar na terminong pangsakripisyo. Inilagay ang talababa pagkatapos ng “banga,” ang salitang saklaw ng leksikal na alternatibo.
