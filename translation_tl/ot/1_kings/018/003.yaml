- from: At tinawag ni Ahab si Obadias, na siyang namamahala sa sambahayan ng hari.[a] Si Obadias ay may matinding takot kay Yahweh.
  to: Tinawag ni Ahab si Obadias, na namamahala sa sambahayan.[a] Si Obadias ay lubos na may takot kay Yahweh.
