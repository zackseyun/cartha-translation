  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: tl
  text: Tinawag ni Ahab si Obadias, na namamahala sa sambahayan.[a] Si Obadias ay lubos na may takot kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “na nasa ibabaw ng sambahayan,” isang katawagan para sa punong opisyal na namamahala sa sambahayan ng hari. Maaari rin itong isalin na “namamahala sa palasyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: tinawag ... si
  rationale: Likas na katumbas sa Tagalog ng pagtawag sa isang tao; hindi ipinapasok ang mas malakas na diwang maaaring taglayin ng “ipinatawag.”
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan sa Bibliya.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: na siyang namamahala sa sambahayan ng hari
  rationale: Ipinahahayag nito ang tungkulin ng punong opisyal na nangangasiwa sa maharlikang sambahayan, habang hindi nililimitahan ang בַּיִת sa gusali lamang.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: ay may matinding takot kay Yahweh
  rationale: Pinananatili ang tuwirang diwa ng ירא bilang pagkatakot na may kasamang pagpipitagan, sa halip na paliitin ito sa “gumagalang” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: מְאֹד
  choice: matinding
  rationale: Natural na Filipino na nagpapahayag ng mataas na antas ng pagkatakot at pagpipitagan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Kahulugan ng ירא kaugnay ng Diyos
  choice: may matinding takot kay Yahweh
  alternative: lubos na gumagalang kay Yahweh
  rationale: Pinananatili ang teolohikal na tensiyon ng “takot” na maaaring magsangkot ng pagpipitagan, nang hindi tahimik na pinapalitan ito ng “paggalang” lamang.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ang “sambahayan ng hari” ay mas malinaw kaysa literal na “bahay,” at ang hiwalay na ikalawang pangungusap ay nagpapanatili sa impormasyong paningit tungkol kay Obadias.
