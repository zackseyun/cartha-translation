base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Elias sa bayan, “Ako na lamang ang natitirang propeta ni Yahweh[a], ngunit ang mga propeta ni Baal ay apat na raan at limampung lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako lamang ang nananatiling propeta ni Yahweh.” Binabanggit sa ibang bahagi ng salaysay ang iba pang mga propetang itinago ni Obadias (1 Hari 18:4, 13).
    reason: Pinananatili ang alternatibong pagpapahayag at neutral na itinatala ang kaugnay na tensiyon sa salaysay nang hindi nililimitahan ang kahulugan ng sinabi ni Elias.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa makabagong Tagalog ang “Pagkatapos ay sinabi.”
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa tradisyong Tagalog.
- source_word: אֶל הָעָם
  choice: sa bayan
  rationale: Tumutukoy ang עָם sa nagkakatipong sambayanang Israel; malinaw at marangal sa Tagalog ang “sa bayan.”
- source_word: אֲנִי ... נוֹתַרְתִּי ... לְבַדִּי
  choice: Ako na lamang ang natitirang
  rationale: Pinagsasama ng likas na ekspresyong Tagalog na “Ako na lamang” ang mariing tahasang panghalip na אֲנִי at ang paghihiwalay na ipinahahayag ng לְבַדִּי, nang hindi gumagamit ng artipisyal na pag-uulit ng “ako.”
- source_word: נָבִיא לַיהוָה
  choice: propeta ni Yahweh
  rationale: Ipinahihiwatig ng parirala ang propetang nauukol kay Yahweh at nagsasalita para sa kaniya; natural at tuwiran ang “propeta ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalang Yahweh ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: ngunit ... ang mga propeta ni Baal
  rationale: Bagaman karaniwang pang-ugnay ang וּ, malinaw na pagsalungat ang gamit nito rito sa nag-iisang katayuan ni Elias at sa maraming propeta ni Baal.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: apat na raan at limampung lalaki
  rationale: Pinananatili ang buong bilang at ang tahasang אִישׁ, na tumutukoy sa mga lalaking binibilang.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaibang ito sa isang titulo.
- issue: Pahayag ni Elias na siya lamang ang natitirang propeta
  choice: Ako na lamang ang natitirang propeta ni Yahweh
  alternative: Ako lamang ang nananatiling propeta ni Yahweh
  rationale: Iniulat ang mariing pahayag ni Elias ayon sa konteksto ng paghaharap at hindi ito tahimik na pinagtutugma sa pagbanggit sa ibang mga propetang itinago ni Obadias sa 1 Hari 18:4, 13.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na diin na “Ako na lamang” sa halip na ang di-natural na “Ako, ako lamang,” habang pinananatili ang mariing diwa ng Hebreo. Ang “bayan” ay tumutukoy sa nagkakatipong sambayanan, at ang bilang ay isinulat nang buo para sa estilong pampanitikan.
