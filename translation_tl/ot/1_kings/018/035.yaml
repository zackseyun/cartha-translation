  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: tl
  text: At umagos ang tubig sa buong palibot ng altar, at pinuno rin niya ng tubig ang kanal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, aktibo ang pandiwa: “at pinuno rin niya ng tubig ang kanal.” Hindi pinapangalanan sa talatang ito ang tinutukoy ng “niya.”'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: umagos
  rationale: Ang pandiwa ay literal na “pumunta,” ngunit kapag tubig ang simuno, likas sa modernong Tagalog ang “umagos” upang ilarawan ang paggalaw nito nang hindi dinaragdagan ang diwa.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Karaniwang katumbas sa Tagalog ng pangngalang Hebreo para sa tubig, na nasa anyong maramihan ngunit tumutukoy sa tubig bilang kabuuan.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: sa buong palibot ng altar
  rationale: Ipinahahayag ng “buong palibot” ang pagkalat o pag-ikot ng tubig sa paligid ng altar.
- source_word: וְגַם
  choice: at ... rin
  rationale: Likas na Tagalog na pagpapahayag ng pandagdag na diin ng pariralang Hebreo.
- source_word: אֶת־הַתְּעָלָה
  choice: ang kanal
  rationale: Sa kontekstong ito, tumutukoy ang salita sa kanal o hukay na ginawa sa palibot ng altar; maikli at malinaw ang “kanal” sa modernong Tagalog.
- source_word: מִלֵּא מָיִם
  choice: napuno ... ng tubig
  rationale: Inilalahad nito nang natural sa Tagalog ang kinalabasan, habang hindi tiyak na tinutukoy ang gumaganap na hindi tahasang pinangalanan sa Hebreo.
theological_decisions:
- issue: Ang di-tahasang simuno ng מִלֵּא (“pinuno”)
  choice: napuno rin ng tubig ang kanal
  alternative: pinuno rin niya ng tubig ang kanal
  rationale: Nasa aktibong panlalaking isahan ang pandiwang Hebreo ngunit hindi tahasang pinangalanan ang simuno. Iniiwasan ng pangunahing salin na tukuyin kung sino ang “niya,” habang itinatala sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “umagos” sa halip na literal ngunit di-likas na “pumunta” para sa pagkilos ng tubig; pinanatili sa talababa ang gramatikal na kalabuan tungkol sa gumaganap sa ikalawang sugnay.
