  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: tl
  text: Nang makalipas ang tanghali, patuloy silang nagpropesiya[a] hanggang sa paghahandog ng handog na pagkaing butil[b]. Ngunit walang tinig, walang sumasagot, at walang pumapansin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “patuloy silang nagwala.” Karaniwang pandiwa para sa pagpopropesiya ang ginamit sa Hebreo, ngunit dito ay inilalarawan nito ang masidhing pagkilos ng mga propeta ni Baal.
    reason: lexical_alternative
  - marker: b
    text: Ang “paghahandog ng handog na pagkaing butil” ay maaari ring unawain bilang oras ng regular na handog sa dapithapon.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa daloy ng salaysay, ipinakikilala ng anyong ito ang sumunod na pangyayari. Likas sa modernong Tagalog ang pagsanib nito sa temporal na sugnay sa halip na literal na “At nangyari.”
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: makalipas ang tanghali
  rationale: Ipinahihiwatig ng כ kasama ng infinitive construct ang panahong lumampas na ang katanghalian; malinaw at natural ito sa Tagalog.
- source_word: וַיִּתְנַבְּאוּ
  choice: patuloy silang nagpropesiya
  rationale: Karaniwang pandiwa para sa pagpopropesiya ang ginamit sa Hebreo, ngunit dito ay tumutukoy sa masidhing pagkilos ng mga propeta ni Baal. Pinananatili ng salin ang ugnayang leksikal at ipinapakita ng “patuloy” ang nagpapatuloy na kilos.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: hanggang sa paghahandog ng handog na pagkaing butil
  rationale: Malapit ito sa literal na “hanggang sa pag-akyat/paghahandog ng minchah.” Ang מִנְחָה ay karaniwang handog na pagkaing butil, samantalang ang posibleng pagtukoy sa oras ng regular na handog ay inilagay sa talababa.
- source_word: וְאֵין קוֹל
  choice: walang tinig
  rationale: Maaaring mangahulugan ang קוֹל ng tinig o tunog. Sa konteksto ng hinihintay na tugon mula kay Baal, ang “tinig” ang higit na angkop habang pinananatili ang konkretong larawan.
- source_word: וְאֵין עֹנֶה
  choice: walang sumasagot
  rationale: Likas na ipinahahayag sa Tagalog ang participial na diwa bilang kawalan ng sinumang tumutugon.
- source_word: וְאֵין קָשֶׁב
  choice: walang pumapansin
  rationale: Ang קָשֶׁב ay tumutukoy sa pakikinig o pagbibigay-pansin. Pinananatili ng parirala ang sukdulang pahayag na walang palatandaang may nakikinig man lamang.
theological_decisions:
- issue: Paglalarawan sa masidhing gawain ng mga propeta ni Baal
  choice: patuloy silang nagpropesiya
  alternative: patuloy silang nagwala
  rationale: Ang Hebreo ay gumagamit ng karaniwang pandiwa para sa pagpopropesiya kahit ang konteksto ay paganong ekstasis. Pinananatili ng pangunahing salin ang sadyang leksikal na ugnayan at hinahayaang ang salaysay ang maghatid ng kabalintunaan; inilalagay sa talababa ang mas interpretibong kahulugan.
- issue: Pagkilala sa oras ng מִנְחָה
  choice: paghahandog ng handog na pagkaing butil
  alternative: oras ng regular na handog sa dapithapon
  rationale: Hindi tahasang binabanggit ng Hebreo ang dapithapon. Pinananatili sa teksto ang uri ng handog at ibinibigay sa talababa ang posibleng gamit nito bilang pananda ng oras.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Iniwasan ang makalumang “at nangyari” at ang labis na interpretibong pangunahing salin. Ang mga panandang [a] at [b] ay inilagay agad sa mga pariralang tinatalakay ng kani-kanilang talababa.
