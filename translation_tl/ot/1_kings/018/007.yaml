  naturalness: Natural ang “nagpatirapa” at ang magalang na tanong. Mas malinaw sa modernong Filipino na tahasang banggitin si Obadias at si Elias sa sugnay ng pagkilala upang maiwasan ang posibleng kalabuan ng mga panghalip.
