base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: tl
  text: Habang nasa daan si Obadias, narito, si Elias ay paparating upang salubungin siya. Nang makilala ni Obadias si Elias, nagpatirapa siya at nagsabi, “Kayo po ba iyan, panginoon kong Elias?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: nakita niyang
  rationale: Ipinahahayag ang biglaang paglitaw o pagkapansin sa paraang natural sa makabagong Tagalog; hindi mekanikal na isinalin bilang “narito.”
- source_word: לִקְרָאתוֹ
  choice: upang salubungin siya
  rationale: Pinananatili ang direksiyon ng paglapit ni Elias kay Obadias at ang layuning makatagpo siya.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: nagpatirapa siya
  rationale: Likas at marangal na Tagalog para sa literal na pagbagsak na nakaharap sa lupa bilang pagpapakumbaba o paggalang.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Tawag-galang ito ni Obadias kay Elias, hindi ang banal na pangalang YHWH; kaya maliit ang titik at may “ko.”
theological_decisions:
- issue: Ang kahulugan ng pagpapatirapa ni Obadias
  choice: Hindi tinukoy kung pagsamba o paggalang lamang
  alternative: Ilarawan ito bilang tahasang pagsamba
  rationale: Ang tekstong Hebreo ay naglalahad ng kilos ngunit hindi nito hayagang binibigyang-kahulugan ang teolohikal na diwa nito.
- issue: Pagkilala kay Elias bilang “panginoon”
  choice: Ginamit bilang pantawag-galang sa isang tao
  alternative: Gamitin ang “Panginoon” na maaaring mapagkamalang titulo para sa Diyos
  rationale: Ang אֲדֹנִי na may unang panauhang hulapi ay “panginoon ko” at sa konteksto ay tuwirang tumutukoy kay Elias.
translation_notes:
  register: Makabago, malinaw, at magalang na Filipino. Ginamit ang “Kayo po ba iyan” upang natural na maipakita ang paggalang na kaayon ng “panginoon kong Elias,” habang pinananatili ang tanong ng pagkilala sa Hebreo.
