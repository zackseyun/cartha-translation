translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili sa pangunahing teksto ang literal na pampamilyang katawagang “mga anak ni Israel,” at inilagay sa talababa ang mas natural na alternatibong “mga Israelita.”
