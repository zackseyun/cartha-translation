  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: tl
  text: Kaya nagpadala si Ahab ng mensahe sa lahat ng mga anak ni Israel[a] at tinipon ang mga propeta sa Bundok Carmelo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng mga Israelita.” Literal sa Hebreo, “sa lahat ng mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala ... ng mensahe
  rationale: Ang שׁלח ay literal na “nagpadala.” Sa kasunod na pariralang tumutukoy sa mga pinadalhan, likas sa Tagalog na linawin ang ipinadala bilang mensahe; iniiwasan nito ang maling pagpapakahulugang ang mga Israelita mismo ang ipinadala.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang Hebreong pananalitang “mga anak ni Israel,” habang ang “sa” ay natural na nagpapahayag ng mga pinadalhan ng mensahe.
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Karaniwan at tuwirang katumbas ito ng קבץ, na nangangahulugang tipunin o pagtipunin.
- source_word: הַנְּבִיאִים
  choice: ang mga propeta
  rationale: Ito ang pamantayan at malinaw na salin ng נביאים.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: sa Bundok Carmel
  rationale: Likas na anyo ito sa modernong Tagalog para sa heograpikong pangalang “Mount Carmel.”
