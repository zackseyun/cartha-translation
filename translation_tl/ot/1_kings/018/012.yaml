  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: tl
  text: Kapag umalis na ako sa iyo, maaaring dalhin ka ng Espiritu ni Yahweh[a] sa isang lugar na hindi ko alam. Kapag pumunta ako kay Ahab upang magsabi at hindi ka niya matagpuan, papatayin niya ako. Ngunit ako, ang lingkod mo, ay may takot kay Yahweh mula pa sa aking kabataan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangin ni Yahweh ang magdala sa iyo.” Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “espiritu,” “hangin,” o “hininga,” bagaman “Espiritu” ang higit na angkop sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: At mangyayari, pagkaalis ko sa iyo
  rationale: Pinananatili ang panghinaharap at kondisyunal na daloy ng Hebreo habang ginagamit ang likas na modernong Tagalog.
- source_word: רוּחַ יְהוָה
  choice: Espiritu ni Yahweh
  rationale: Sa konteksto ng makahulang paglilipat kay Elias sa pamamagitan ng kapangyarihan ng Diyos, “Espiritu” ang pinakamalamang na kahulugan; pinananatili sa talababa ang tunay na leksikal na posibilidad na “hangin.”
- source_word: יִשָּׂאֲךָ
  choice: maaaring dalhin ka
  rationale: Ang pandiwa ay nangangahulugang buhatin o dalhin. Ipinahahayag ng “maaaring” ang pinangangambahang posibilidad sa konteksto, hindi isang tiyak na hula.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: sa lugar na hindi ko alam
  rationale: Likas sa Tagalog at tapat sa di-tiyak at di-alam na patutunguhan.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Pagkatapos, pagpunta ko upang sabihin ito kay Ahab
  rationale: 'Malinaw na inilalahad ang sunod na kilos: pupunta si Obadias kay Ahab upang mag-ulat.'
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: at hindi ka niya matagpuan, papatayin niya ako
  rationale: Direkta at natural na ipinapahayag ang kondisyunal na bunga na kinatatakutan ng nagsasalita.
- source_word: וְעַבְדְּךָ
  choice: ang lingkod mo
  rationale: Magalang na pagtukoy ni Obadias sa sarili sa harap ni Elias, hindi pangunahing pagtukoy sa legal na pagkaalipin.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: may takot kay Yahweh mula pa sa aking kabataan
  rationale: Ang “may takot” ay sumasaklaw sa mapitagang pagkatakot at katapatan sa Diyos; ang “mula pa” ay nagpapahiwatig ng patuloy na kalagayan mula kabataan hanggang kasalukuyan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
theological_decisions:
- issue: Kahulugan ng רוּחַ יְהוָה
  choice: Espiritu ni Yahweh
  alternative: hangin ni Yahweh
  rationale: Mas angkop sa konteksto ang personal na banal na ahensiyang nagdadala sa propeta, ngunit hindi inaalis ang leksikal na posibilidad na “hangin,” kaya inilagay ito sa talababa.
- issue: Pagpapahayag ng pagkatakot kay Yahweh
  choice: may takot kay Yahweh
  alternative: natatakot kay Yahweh / gumagalang kay Yahweh
  rationale: Pinananatili nito ang teolohikal na lawak ng ירא—kapuwa pagkatakot at mapitagang debosyon—nang hindi ito nililimitahan sa simpleng sindak o paggalang lamang.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkaalis ko” at “pagpunta ko” para sa likas na daloy ng kondisyunal na salaysay. Ang “kabataan” ay mas malawak at mas tapat kaysa “pagkabata” o “pagkabinata.”
