revisions:
- from: At mangyayari, pagkaalis ko sa iyo, maaaring dalhin ka ng Espiritu ni Yahweh[a] sa lugar na hindi ko alam. Pagkatapos, pagpunta ko upang sabihin ito kay Ahab at hindi ka niya matagpuan, papatayin niya ako. Ngunit ang lingkod mo ay may takot kay Yahweh mula pa sa aking kabataan.
  to: Kapag umalis na ako sa iyo, maaaring dalhin ka ng Espiritu ni Yahweh[a] sa isang lugar na hindi ko alam. Kapag pumunta ako kay Ahab upang magsabi at hindi ka niya matagpuan, papatayin niya ako. Ngunit ako, ang lingkod mo, ay may takot kay Yahweh mula pa sa aking kabataan.
