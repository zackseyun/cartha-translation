  text: וְ/עַתָּה֙ אַתָּ֣ה אֹמֵ֔ר לֵ֛ךְ אֱמֹ֥ר לַֽ/אדֹנֶ֖י/ךָ הִנֵּ֣ה אֵלִיָּ֑הוּ וַ/הֲרָגָֽ/נִי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: tl
  text: At ngayo'y sinasabi mo, ‘Pumunta ka at sabihin mo sa panginoon mo, “Narito si Elias,” at papatayin niya ako.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayo'y
  rationale: Pinananatili ang pag-uugnay at diin ng Hebreong parirala sa natural at marangal na Tagalog.
- source_word: לֵךְ אֱמֹר
  choice: Pumunta ka at sabihin mo
  rationale: Tuwirang inilalarawan ang dalawang pautos nang hindi ginagawang mas teknikal o mas pormal kaysa sa pinagmulan.
- source_word: לַאדֹנֶיךָ
  choice: sa panginoon mo
  rationale: Tumutukoy kay Ahab bilang taong may kapangyarihan sa kausap; maliit ang titik upang hindi mapagkamalang banal na pangalan.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Narito si Elias
  rationale: Ang “narito” ay likas na panawag-pansin sa Tagalog at ipinahahayag ang presensiya ni Elias.
- source_word: וַהֲרָגָנִי
  choice: at papatayin niya ako
  rationale: Pinananatili ang panghalip na nasa ikatlong panauhan at ang tiyak na pangamba ng nagsasalita nang hindi tahasang pinapangalanan ang simuno.
theological_decisions:
- issue: Ang tinutukoy ng אֲדֹנֶיךָ
  choice: panginoon mo
  alternative: amo mo
  rationale: Ang salita ay tumutukoy sa taong pinuno na si Ahab, hindi sa Diyos; pinananatili ng “panginoon” ang dignidad at semantikong lawak ng Hebreo.
- issue: Ang simuno ng “papatayin”
  choice: niya
  alternative: ni Ahab
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang simuno; pinananatili ang anyong panghalip at ang kaunting pormal na kalabuan ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “ngayo'y” para sa maayos na daloy at “panginoon” sa maliit na titik para sa taong pinuno.
