  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: tl
  text: Nang makita ito[a] ng lahat ng tao, nagpatirapa sila at sinabi, “Si Yahweh—siya ang Diyos! Si Yahweh—siya ang Diyos!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Walang tahasang layon ang pandiwang Hebreo na ‘makita’; ang ‘ito’ ay tumutukoy sa apoy at sa pangyayaring kasasabi lamang.
    reason: implicit_object
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita ito
  rationale: Ang pandiwa ay nangangahulugang ‘makita.’ Idinagdag ang ‘ito’ bilang likas na ipinahihiwatig na layon sa Filipino, na tumutukoy sa apoy at pangyayaring kasasabi lamang.
- source_word: כָּל הָעָם
  choice: lahat ng tao
  rationale: Likas at malinaw itong katumbas ng kolektibong parirala sa konteksto; iniiwasan din nito ang posibleng kahulugan ng ‘bayan’ bilang lugar.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: nagpatirapa sila
  rationale: Ipinahahayag nito ang kusang pagbagsak nang nakadapa bilang kilos ng pagpipitagan, nang hindi nagiging mabigat o di-likas ang Filipino.
- source_word: וַיֹּאמְרוּ
  choice: at sinabi
  rationale: Karaniwang pandiwa ito para sa pagsasalita; hindi dinaragdagan ng teksto ang lakas ng tinig o emosyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הוּא
  choice: siya
  rationale: Tahasan at mariin ang panghalip sa Hebreo. Pinananatili ng ‘siya’ ang diin nito sa natural na Filipino.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Ang may-tiyak na anyo ay kumikilala kay Yahweh bilang tunay na Diyos, taliwas kay Baal. Likas sa Filipino ang ‘ang Diyos’ sa ganitong pahayag.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Si Yahweh—siya ang Diyos!
  rationale: Pinananatili ang tahasang panghalip, ang pagkilala kay Yahweh bilang Diyos, ang pag-uulit, at ang mariing bisa ng sukdulang pagpapahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili rito bilang personal na pangalan sa halip na gawing titulo.
- issue: Pagpapahayag ng הָאֱלֹהִים na may pantukoy
  choice: ang Diyos
  alternative: Diyos; ang tanging Diyos
  rationale: Ipinakikilala ng pantukoy si Yahweh bilang tunay na Diyos sa tahasang paghahambing kay Baal. Hindi idinagdag ang ‘tanging,’ sapagkat bagaman tugma ito sa diwa, hindi ito tahasang salita ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling-pahaba upang marinig ang mariing panghalip na הוּא, at inulit nang buo ang pahayag gaya ng Hebreo.
