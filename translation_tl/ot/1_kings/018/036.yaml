  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: tl
  text: Nang oras ng paghahandog ng handog na butil, lumapit ang propetang si Elias at sinabi, “Yahweh, Diyos nina Abraham, Isaac, at Israel[a], malaman nawa ngayon na ikaw ang Diyos sa Israel, na ako ay lingkod mo, at ayon sa iyong salita[b] ay ginawa ko ang lahat ng bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Israel.” Maaaring asahan ng ilan ang “Jacob” dahil sa mas pamilyar na pormula tungkol sa mga patriyarka, ngunit “Israel” ang tiyak na mababasa rito.'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa pamamagitan ng iyong salita” o “sa utos mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: Nang oras na ng paghahandog ng handog na butil
  rationale: Ang infinitive ng עלה ay tumutukoy sa pag-aalay o pagpapaitaas ng handog, at ang מִנְחָה ay higit na tiyak na handog na butil. Pinananatili ng salin ang tiyak na uri ng handog nang hindi ipinapalagay sa pangunahing teksto na ito ang panggabing handog.
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Tuwirang ipinahahayag ng נגשׁ ang paglapit ni Elias at ang taimtim na kilos sa kontekstong pangpagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Diyos nina Abraham, Isaac, at Israel
  rationale: Israel ang hayagang mababasa sa tekstong Hebreo, hindi Jacob; kaya hindi ito itinugma sa mas pamilyar na pormula.
- source_word: הַיּוֹם יִוָּדַע
  choice: malaman nawa ngayon
  rationale: Ipinahahayag nito ang pakiusap o hangarin ng jussive sa isang likas at marangal na anyong Filipino.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ang Diyos sa Israel
  rationale: Pinananatili ang payak na diwa ng pang-ukol na ב, nang hindi nagpapasok ng mas tiyak na interpretasyong gaya ng 'naghahari sa Israel.'
- source_word: עַבְדֶּךָ
  choice: lingkod mo
  rationale: Ang 'lingkod' ang likas na katawagan sa isang propetang inatasang maglingkod sa Diyos.
- source_word: וּבִדְבָרֶךָ
  choice: ayon sa iyong salita
  rationale: Likas ito sa Filipino at ipinahahayag ang salita ng Diyos bilang batayan at utos ng ginawa ni Elias; inilalahad sa talababa ang posibleng instrumental na diwa.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ginawa ko ang lahat ng bagay na ito
  rationale: Sa konteksto, ang דְּבָרִים ay mga bagay o ginawa, hindi lamang mga binigkas na salita.
theological_decisions:
- issue: Paglalahad sa pangalang tipan na יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Israel sa pormula ng mga patriyarka
  choice: Diyos nina Abraham, Isaac, at Israel
  alternative: Diyos nina Abraham, Isaac, at Jacob
  rationale: Israel ang aktuwal na nasa tekstong Hebreo. Ang pagpapanatili rito ay umiiwas sa paghaharmonisa sa ibang pamilyar na pormula.
- issue: Ugnayan ng salita ng Diyos sa ginawa ni Elias
  choice: ayon sa iyong salita
  alternative: sa pamamagitan ng iyong salita; sa utos mo
  rationale: Maaaring ipahiwatig ng ב ang pamantayan o kasangkapan. Pinili ang likas na saling nagpapanatili sa salita ng Diyos bilang batayan ng pagkilos, habang inilalagay sa talababa ang iba pang posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nina” sa magkakasunod na personal na pangalan at ang “malaman nawa” upang mapanatili ang taimtim na himig ng panalangin. Inilipat ang marker [a] sa “Israel,” kung saan tumutugma ang paliwanag ng talababa.
