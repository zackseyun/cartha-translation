source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: tl
  text: Magbigay sila sa atin ng dalawang toro. Pumili sila ng isang toro para sa sarili nila, hiwa-hiwain nila ito, at ilagay sa ibabaw ng panggatong, ngunit huwag silang maglagay ng apoy.[a] At ako naman ang maghahanda ng isa pang toro, ilalagay ko ito sa ibabaw ng panggatong, at hindi ako maglalagay ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “huwag silang maglagay ng apoy.” Ipinahihiwatig ng paghahanda ng handog na ang apoy ay ilalagay sa ilalim ng handog, sa panggatong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: Bigyan nila tayo
  rationale: Ang anyong pandiwa ay nagpapahayag ng mungkahi o hamon. Ang “Bigyan nila tayo” ay tuwiran at likas sa modernong Tagalog.
- source_word: שְׁנַיִם פָּרִים
  choice: dalawang toro
  rationale: Ang פַּר ay karaniwang tumutukoy sa torong mula sa bakahan, lalo na sa kontekstong paghahandog. Hindi idinagdag ang ideyang “bata” na hindi tahasang nasa talata.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: Pumili sila ng isang toro para sa kanila
  rationale: 'Pinananatili ng “para sa kanila” ang diwa ng לָהֶם: pipili ang kabilang panig ng torong gagamitin nila.'
- source_word: וִינַתְּחֻהוּ
  choice: hiwa-hiwain iyon
  rationale: Sa paghahanda ng handog, ang נתּח ay paghahati sa hayop sa mga piraso. Ang “hiwa-hiwain” ay malinaw at natural nang hindi tinutukoy ang eksaktong bilang o laki ng mga piraso.
- source_word: וְיָשִׂימוּ עַל הָעֵצִים
  choice: ilagay sa ibabaw ng mga kahoy
  rationale: Ang עַל ay “sa ibabaw ng/on,” at ang maramihang הָעֵצִים ay likas na maisasalin bilang “mga kahoy,” na tumutukoy sa panggatong na inayos para sa handog.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: huwag silang maglagay ng apoy
  rationale: Isinasalin nang tahasan ang Hebreong “huwag maglagay ng apoy” at hindi idinaragdag sa pangunahing teksto ang “sa ilalim nito,” na pahiwatig lamang ng konteksto.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: Ihahanda ko naman ang isa pang toro
  rationale: Sa konteksto ng handog, ang עשה ay tumutukoy sa paghahanda. Dahil napili na ang isa sa dalawang toro, ang הַפָּר הָאֶחָד ay natural na “ang isa pang toro.” Ang “naman” ay malinaw na nagmamarka sa salungat na gawain ni Elias nang hindi nagdaragdag ng bagong ideya.
- source_word: וְנָתַתִּי עַל הָעֵצִים
  choice: ilalagay iyon sa ibabaw ng mga kahoy
  rationale: Ang נתן dito ay “ilagay,” kapantay ng naunang שׂים. Isinama ang “iyon” upang maging malinaw at natural sa Tagalog ang layon.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: hindi ako maglalagay ng apoy
  rationale: Pinananatili ang eksaktong paralelismo ng hamon at ang tahasang pahayag ng Hebreo nang hindi isinasama sa teksto ang lokasyong ipinahihiwatig lamang.
theological_decisions:
- issue: Wika ng paghahanda ng handog nang hindi nagdaragdag ng teolohikal na kategorya
  choice: 'Gumamit ng karaniwang kongkretong pananalita: “hiwa-hiwain,” “ilagay sa ibabaw ng mga kahoy,” at “maglagay ng apoy.”'
  alternative: Gumamit ng mas teknikal na mga salitang gaya ng “ialay” o “isaayos” sa buong talata.
  rationale: Inilalarawan ng talata ang praktikal na paghahanda para sa pagsubok sa Bundok Carmel, hindi isang paliwanag tungkol sa teolohiya ng paghahandog. Kaya pinananatili ang mga aktuwal na kilos na sinasabi ng Hebreo.
- issue: Lokasyon ng apoy
  choice: Panatilihin sa pangunahing teksto ang literal na “maglagay ng apoy,” at ipaliwanag sa talababa ang kontekstuwal na “sa ilalim nito.”
  alternative: Isama sa pangunahing teksto ang “maglagay ng apoy sa ilalim nito.”
  rationale: Walang katumbas na parirala para sa “sa ilalim nito” sa Hebreo. Bagaman makatwiran iyon ayon sa ayos ng handog, mas mabuting panatilihin ang pagkakaiba ng tahasang sinabi at ipinahihiwatig ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “toro” sa halip na mas malabo o makalumang katawagan. Pinanatili ang konkretong wika at paralelismo ng dalawang panig. Ang marker na [a] ay inilagay pagkatapos ng unang pagbanggit sa hindi paglalagay ng apoy at sumasaklaw rin sa kaparehong huling sugnay.
