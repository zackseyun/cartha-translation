base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Elias sa mga propeta ni Baal, “Pumili kayo ng isang toro para sa inyo at ihanda muna ninyo iyon, sapagkat marami kayo. Pagkatapos ay tumawag kayo sa pangalan ng inyong diyos[a], ngunit huwag kayong maglagay ng apoy[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pananalitang “tumawag sa pangalan ng inyong diyos” ay nangangahulugang manawagan o dumulog sa diyos na iyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “huwag kayong maglagay ng apoy sa ilalim nito.” Hindi tahasang binabanggit sa Hebreo ang “sa ilalim nito,” bagaman ipinahihiwatig iyon ng konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” at napananatili nito ang pagkakasunod-sunod.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: sa mga propeta ni Baal
  rationale: Tuwirang ipinahahayag ng construct chain ang kaugnayan ng mga propeta kay Baal.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: Pumili kayo para sa inyong sarili ng isang toro
  rationale: Tumutukoy ito sa isa sa dalawang torong nabanggit sa konteksto; pinananatili ng “para sa inyong sarili” ang לָכֶם.
- source_word: וַעֲשׂוּ
  choice: ihanda ... ninyo iyon
  rationale: Sa konteksto ng paghahandog, ang עשה ay tumutukoy sa paghahanda sa hayop, hindi lamang sa pangkalahatang “gawin” at hindi rin tahasang “ihandog.”
- source_word: רִאשֹׁנָה
  choice: muna
  rationale: Natural na Tagalog ang “muna” para sa utos na sila ang unang kikilos.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: sapagkat marami kayo
  rationale: Tuwiran at natural nitong ipinahahayag ang dahilan kung bakit sila ang mauuna.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: tumawag kayo sa pangalan ng inyong diyos
  rationale: Pinananatili ang Hebreong idyomang “tumawag sa pangalan,” na nangangahulugang dumulog o manawagan sa diyos.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: ngunit huwag kayong maglagay ng apoy
  rationale: Pinananatili ang mismong saklaw ng Hebreo, na hindi tahasang nagsasaad ng “sa ilalim nito”; ipinapaliwanag sa talababa ang pahiwatig ng konteksto.
theological_decisions:
- issue: אֱלֹהֵיכֶם na tumutukoy kay Baal
  choice: inyong diyos
  alternative: inyong mga diyos
  rationale: Bagaman maaaring anyong maramihan ang אֱלֹהִים, iisa ang tiyak na tinutukoy rito—si Baal—kaya ang isahan ang hinihingi ng agarang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Elias” bilang nakaugaliang anyong Tagalog ng pangalan, habang pinanatili ang “Baal.” Iniwasan ang pagdaragdag ng “sa ilalim nito” sa pangunahing teksto upang mapanatili ang pormal na hindi pagkakabanggit nito sa Hebreo, ngunit nilinaw ang kontekstuwal na posibilidad sa talababa.
