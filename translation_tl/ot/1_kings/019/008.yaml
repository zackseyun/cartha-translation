  terminology: Ang “Horeb” at “ang bundok ng Diyos” ay angkop at pinananatili. Ang “lakas ng pagkaing iyon” ay tuwirang sumasalamin sa idiomang Hebreo nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
