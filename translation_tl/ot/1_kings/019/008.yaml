base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: tl
  text: Kaya bumangon siya, kumain at uminom, at naglakbay siya sa lakas ng pagkaing iyon[a] nang apatnapung araw at apatnapung gabi hanggang sa Horeb, ang bundok ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bisa ng pagkaing iyon.” Tinutukoy ng pananalitang Hebreo ang lakas o sustansiyang natanggap niya mula sa kanyang kinain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Kaya bumangon siya
  rationale: Ang Qal wayyiqtol ng קום ay karaniwang pandiwa sa sunod-sunod na salaysay. Likas sa modernong Tagalog ang “bumangon,” at ipinahihiwatig ng “Kaya” ang pagpapatuloy mula sa naunang pangyayari.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: at kumain at uminom
  rationale: Tuwirang isinasalin ang dalawang payak na pandiwa sa salaysay at pinananatili ang pagkakasunod ng Hebreo.
- source_word: וַיֵּלֶךְ
  choice: naglakad siya
  rationale: Ang הלך ay pangunahing nangangahulugang pumunta o lumakad. Sa konteksto ng mahabang paglalakbay, malinaw at natural ang “naglakad” nang hindi nagdaragdag ng paraan ng paglalakbay na wala sa teksto.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: Sa lakas na ibinigay ng pagkaing iyon
  rationale: Ipinapahayag nito sa natural na Tagalog ang lakas o sustansiyang tinanggap mula sa kinain. Ang talababa ay nagpapanatili sa mas pormal at mas malapit-sa-anyong alternatibo.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: nang apatnapung araw at apatnapung gabi
  rationale: Karaniwang pahayag ng tagal sa Tagalog; ang “nang” ay malinaw na nag-uugnay sa tagal ng paglakad.
- source_word: עַד
  choice: hanggang sa
  rationale: Minamarkahan ng עַד ang hantungan o dulo ng paglalakbay; natural sa Tagalog ang “hanggang sa” bago ang pangalan ng lugar.
- source_word: הַר הָאֱלֹהִים
  choice: ang bundok ng Diyos
  rationale: Pinananatili ang pormal na construct phrase at ang maringal na katawagan sa lugar nang hindi ito ginagawang mas tiyak kaysa sa Hebreo.
- source_word: חֹרֵב
  choice: Horeb
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang pantangi.
theological_decisions:
- issue: Kahulugan ng הָאֱלֹהִים sa pariralang הַר הָאֱלֹהִים
  choice: Diyos
  alternative: banal o makadiyos
  rationale: Sa kinikilalang katawagang ito para sa Horeb, personal na tumutukoy ang אֱלֹהִים sa Diyos ng Israel. Hindi kailangan ng dagdag na paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang karaniwang bokabularyo at natural na ayos ng pangungusap, habang pinananatili ang pormal na katawagang “ang bundok ng Diyos.”
