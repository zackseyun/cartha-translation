base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: tl
  text: Kaya iniwan niya ang mga baka at tumakbo siya kasunod ni Elias. Sinabi niya[a], “Pakiusap, hayaan mo muna akong halikan ang aking ama at ina, at pagkatapos ay susunod ako sa iyo.” Sinabi ni Elias sa kanya, “Bumalik ka[b], sapagkat ano ba ang ginawa ko sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pangkalahatang diwa, “Pakiusap, hayaan mo muna akong magpaalam sa aking ama at ina.” Literal na “halikan” ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang diwa ng tugon ni Elias. Maaari rin itong mangahulugang, “Bumalik ka, sapagkat ano ang ginawa ko para sa iyo?” o maaaring isang pinaikling paraan ng pagpapaubaya kay Eliseo ng pasiya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: iniwan niya
  rationale: Karaniwang nangangahulugang ‘iwan’ ang עזב. Likas ito sa salaysay at hindi nito ipinapalagay na tiyak nang permanente ang pagtalikod niya sa mga baka.
- source_word: הַבָּקָר
  choice: ang mga baka
  rationale: Maaaring tumukoy ang בקר sa mga baka sa pangkalahatan; sa konteksto ng pag-aararo, tumutukoy ito sa mga hayop na ginagamit niya sa gawain. Ang ‘mga baka’ ang pinakanatural na pangkalahatang tawag sa modernong Tagalog.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: tumakbo siya kasunod ni Elias
  rationale: Tuwirang inilalarawan ng parirala ang mabilis na paghabol. Ang ‘kasunod ni’ ay natural at iniiwasan ang posibleng di-kanais-nais na himig ng ‘hinabol.’
- source_word: אֶשְּׁקָה נָּא
  choice: Pakiusap, hayaan mo muna akong halikan
  rationale: Literal na ‘halikan’ ang נשק, kaya pinanatili ang konkretong kilos. Ipinahahayag ng ‘pakiusap’ at ‘muna’ ang magalang na pakiusap at pansamantalang pagkaantala na ipinahihiwatig ng נָא sa konteksto.
- source_word: לְאָבִי וּלְאִמִּי
  choice: ang aking ama at ina
  rationale: Magkahiwalay na binabanggit ng Hebreo ang ama at ina; pinanatili ito sa halip na paikliin bilang ‘mga magulang.’
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: at pagkatapos ay susunod ako sa iyo
  rationale: Ang הלך אחרי ay literal na paglakad kasunod ng isang tao at maaari ring magpahiwatig ng pagsunod bilang lingkod o alagad. Natural sa Tagalog ang ‘susunod ako sa iyo’ at pinananatili nito ang parehong posibilidad.
- source_word: לֵךְ שׁוּב
  choice: Bumalik ka
  rationale: Magkasunod na pautos ang literal na ‘humayo, bumalik.’ Sa modernong Tagalog, natural na pinagsasama ang mga ito bilang ‘Bumalik ka,’ habang ang talab ng maikli at tahasang tugon ay nananatili.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: sapagkat ano ba ang ginawa ko sa iyo?
  rationale: Pinananatili nito ang literal at sadyang malabong tanong. Ang ‘ba’ ay nagbibigay ng natural na himig sa Tagalog nang hindi pinipili kung ito ay pahintulot, pagsaway, o paalala.
theological_decisions:
- issue: Kahulugan ng tugon ni Elias na כִּי מֶה עָשִׂיתִי לָךְ
  choice: Pinanatili ang literal na tanong na ‘sapagkat ano ba ang ginawa ko sa iyo?’
  alternative: Maaaring unawain bilang ‘sapagkat ano ang ginawa ko para sa iyo?’ o bilang pinaikling pananalitang ipinauubaya kay Eliseo ang pasiya.
  rationale: Tunay na malabo ang Hebreo at maaaring ituring na pahintulot, pagsaway, o paalala sa pagtawag kay Eliseo. Hindi nilulutas ng pangunahing teksto ang tensiyong ito; inilalahad ng talababa ang mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang tradisyonal at karaniwang Tagalog na mga pangalang Elias at Eliseo. Pinanatili ang literal na ‘halikan’ at ang kalabuan ng pangwakas na tanong, habang inilagay sa mga talababa ang mas malayang kahulugan at mga alternatibong pagbasa.
