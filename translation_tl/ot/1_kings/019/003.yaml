  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: tl
  text: Nakita niya ito, at bumangon siya at umalis alang-alang sa kanyang buhay. Dumating siya sa Beer-seba, na kabilang sa Juda, at iniwan niya roon ang kanyang lingkod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita niya iyon
  rationale: Pinananatili ang pagbasa ng WLC na ‘nakita niya,’ habang ang ‘iyon’ ay likas na Tagalog na pantukoy sa naunang balita o kalagayan nang hindi ito labis na ipinapaliwanag.
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: umalis upang iligtas ang kanyang buhay
  rationale: Ang idyomang Hebreo ay nagsasaad ng pag-alis alang-alang sa sariling buhay; malinaw at natural itong ipinahahayag sa modernong Tagalog.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: na sakop ng Juda
  rationale: Ipinahahayag ang heograpiko at pampolitikang kaugnayan ng Beer-seba sa Juda nang hindi pinipilit ang literal ngunit alanganing ‘na sa Juda.’
- source_word: נַעֲרוֹ
  choice: kanyang lingkod
  rationale: Sa konteksto, ang נַעַר ay tumutukoy sa personal na alalay o lingkod, hindi kinakailangang sa edad nito.
theological_decisions:
- issue: Dahilan ng pag-alis ni Elias
  choice: upang iligtas ang kanyang buhay
  alternative: ayon sa kanyang kalooban / para sa kanyang sarili
  rationale: Pinipili ang karaniwang idyomatikong kahulugan ng אֶל־נַפְשׁוֹ sa konteksto ng banta, nang hindi nagdaragdag ng hatol sa pananampalataya o motibo ni Elias.
translation_notes:
  register: Makabagong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang sunod-sunod na kilos ng salaysay ngunit inayos ang pangungusap upang maging natural; ginamit ang karaniwang anyong ‘Beer-seba.’
