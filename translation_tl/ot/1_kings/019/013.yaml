id: 1KI.19.13
reference: 1 Kings 19:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: tl
  text: Nang marinig iyon ni Elias,[a] ibinalot niya ang kaniyang mukha sa balabal. Pagkatapos, lumabas siya at tumayo sa bukana ng yungib. At narito, may tinig na nagsabi sa kaniya, “Ano ang ginagawa mo rito, Elias?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang binabanggit sa Hebreo kung ano ang narinig ni Elias. Batay sa konteksto, tumutukoy ito sa naunang pangyayari, na maaaring unawain bilang tunog o tinig.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin, “Ano ang sadya mo rito?” Itinatanong ng idyomang Hebreo kung ano ang gawain o layunin ni Elias sa lugar na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Nang marinig iyon
  rationale: Ang כ na sinusundan ng infinitive construct ay bumubuo ng sugnay na panahunan. Walang tahasang layon ang ‘marinig’ sa Hebreo, kaya ‘iyon’ ang pinakamaliit na likas na dagdag sa Filipino nang hindi tinutukoy kung tunog o tinig ang tinutukoy.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: ibinalot niya ang kaniyang mukha sa balabal
  rationale: Ipinahahayag nito ang malapit na pagtatakip o pagbabalot sa mukha gamit ang panlabas na kasuotan. Ang ‘balabal’ ay malinaw at likas sa makabagong Filipino.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: lumabas siya at tumayo
  rationale: 'Payak na kilos sa salaysay: lumabas si Elias mula sa loob ng yungib at pumuwesto sa pasukan nito.'
- source_word: פֶּתַח הַמְּעָרָה
  choice: bukana ng yungib
  rationale: Ang פֶּתַח ay bukasan o pasukan. Likas sa Filipino ang ‘bukana ng yungib’ at malinaw ang lokasyon.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masiglang pagpapakilala ng הִנֵּה nang hindi idinaragdag ang di-tahasang diwa ng biglaan.
- source_word: אֵלָיו קוֹל וַיֹּאמֶר
  choice: may tinig na nagsabi sa kaniya
  rationale: Ang literal na sugnay ay walang pandiwa (‘sa kaniya, isang tinig’). Ang saling ito ay natural sa Filipino at ipinahahayag na isang tinig ang tuwirang kumausap sa kaniya.
- source_word: מַה לְּךָ פֹה
  choice: Ano ang ginagawa mo rito
  rationale: Idyomatikong itinatanong nito ang gawain o layunin ni Elias sa lugar na iyon. Mas malawak ito kaysa ‘Bakit ka narito?’ na nakatuon lamang sa dahilan.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino, na malinaw at madaling makilala ng karaniwang mambabasa.
theological_decisions:
- issue: Ang di-tahasang layon ng ‘marinig’
  choice: marinig iyon
  alternative: marinig ang tunog / marinig ang tinig
  rationale: Hindi pinangalanan ng Hebreo ang layon. Ang ‘iyon’ ay tumutukoy sa naunang pangyayari ngunit hindi nagpapasiya kung ang eksaktong tinutukoy ay ‘tunog’ o ‘tinig,’ kaya napapanatili ang ambiguwidad ng saligan.
- issue: Ang puwersa ng tanong na מַה לְּךָ פֹה
  choice: Ano ang ginagawa mo rito?
  alternative: Bakit ka narito? / Ano ang sadya mo rito?
  rationale: Ang napiling salita ay likas na Filipino at maaaring tumukoy kapwa sa ginagawa, sadya, o dahilan ni Elias, sa halip na paliitin agad ang tanong sa motibo lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kaniya’ at ‘rito’ para sa pormal ngunit madaling maunawaang himig; pinanatili ang ‘At narito’ upang maipakita ang masiglang diskursong epekto ng Hebreo.
