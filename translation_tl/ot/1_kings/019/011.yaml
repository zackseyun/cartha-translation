base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: tl
  text: At sinabi niya, “Lumabas ka at tumayo sa bundok sa harap ni Yahweh.” At narito, dumaraan si Yahweh, at isang matindi at malakas na hangin ang binibiyak ang mga bundok at dinudurog ang mga bato sa harap ni Yahweh. Ngunit wala si Yahweh sa hangin.[a] Pagkatapos ng hangin ay nagkaroon ng lindol, ngunit wala si Yahweh sa lindol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “wala si Yahweh sa hangin.” Maaaring tumukoy ito sa hindi niya pagpapahayag ng sarili sa hangin, ngunit pinananatili rito ang mas literal at sadyang di-tiyak na pananalita.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “wala si Yahweh sa lindol.” Hindi itinatanggi ng pahayag ang kapangyarihan ni Yahweh sa pangyayari; pinananatili lamang nito ang paraan ng paglalahad ng salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng titulong “Panginoon,” upang mapanatili ang personal na pangalang nasa tekstong Hebreo.
- source_word: צֵא
  choice: Lumabas ka
  rationale: Tuwirang ipinahahayag ng pautos na anyo ng יצא ang paglabas ni Elias mula sa kaniyang kinaroroonan.
- source_word: וְעָמַדְתָּ
  choice: at tumayo
  rationale: Pinananatili ang payak at posisyonal na kahulugan ng עמד nang walang idinagdag na diin.
- source_word: בָהָר
  choice: sa bundok
  rationale: Natural sa Filipino ang “sa bundok” para sa lokasyong tinutukoy ng parirala.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang literal na larawang panlunan at ang diwa ng pagiging nasa presensiya ni Yahweh.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Nagbibigay ito ng dramatikong pansin at agarang dating na taglay ng Hebreong pantukoy sa salaysay.
- source_word: עֹבֵר
  choice: dumaraan
  rationale: Ang aspektong nagpapatuloy ng participle ay malinaw na naipahahayag ng kasalukuyang anyong “dumaraan.”
- source_word: רוּחַ
  choice: hangin
  rationale: Ang puwersang nagbibiyak ng mga bundok at dumudurog ng mga bato ay malinaw na tumutukoy rito sa penomenong meteorolohikal, hindi sa “espiritu.”
- source_word: גְּדוֹלָה וְחָזָק
  choice: malaki at malakas
  rationale: Hiwalay na pinananatili ang dalawang pang-uri at ang kanilang pinagsamang pagpapatingkad.
- source_word: מְפָרֵק הָרִים
  choice: nagbibiyak ng mga bundok
  rationale: Ipinahahayag ang marahas at nagpapatuloy na kilos ng participle sa isang malinaw at masiglang anyong Filipino.
- source_word: וּמְשַׁבֵּר סְלָעִים
  choice: at dumudurog ng mga bato
  rationale: Pinananatili ang parallel na kilos at ang matinding puwersa ng pandiwa sa paraang madaling maunawaan.
- source_word: רַעַשׁ
  choice: lindol
  rationale: Sa kontekstong ito, ang pagyanig na kasunod ng hangin ay natural at tumpak na ipinahahayag bilang lindol.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Ang mismong banal na pangalan ang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng “wala si Yahweh sa hangin/lindol”
  choice: Panatilihin ang panlunan at sadyang di-tiyak na pananalitang “wala si Yahweh sa”
  alternative: Hindi inihayag ni Yahweh ang sarili sa; hindi kumilos si Yahweh sa
  rationale: Hindi ipinaliliwanag ng Hebreo kung ang tinutukoy ay pagpapahayag, presensiya, o pagkilos. Pinananatili ng salin ang teolohikal na tensiyon at hindi itinatanggi ang kapangyarihan ni Yahweh sa mga pangyayari.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dramatikong “At narito,” ang pag-uulit sa pangalang Yahweh, at ang maigting na mga larawang pandiwa nang hindi nagpapasok ng paliwanag sa pangunahing teksto.
