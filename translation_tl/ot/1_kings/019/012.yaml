base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: tl
  text: At pagkatapos ng lindol, may apoy; wala si Yahweh sa apoy. At pagkatapos ng apoy, isang tunog ng pinong katahimikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang mahinang tinig,” “isang banayad na bulong,” o “isang marahang bulong.” Sa literal, mababasa sa Hebreo ang pambihira at maselang pananalitang “tunog/tinig ng manipis [o pinong] katahimikan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר
  choice: At pagkatapos ng
  rationale: Pinananatili ang sunod-sunod at magkakaugnay na daloy ng salaysay sa Hebreo.
- source_word: הָרַעַשׁ
  choice: lindol
  rationale: Karaniwang tumutukoy ang רַעַשׁ sa lindol o marahas na pagyanig; malinaw at likas dito ang “lindol.”
- source_word: אֵשׁ
  choice: may apoy
  rationale: Ipinakikilala ang kasunod na pangyayari sa natural na paraang Tagalog nang hindi dinaragdagan ang kahulugan nito.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: wala si Yahweh sa apoy
  rationale: Pinananatili ang lokatibong diwa ng ב at ang payak na pahayag tungkol sa presensiya ni Yahweh, nang hindi ipinapaliwanag ang paraan nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: קוֹל
  choice: tunog
  rationale: Maaaring mangahulugang “tunog” o “tinig” ang קוֹל. Pinananatili ng “tunog” ang kalabuan at hindi agad ipinapalagay na may binigkas na salita.
- source_word: דְּמָמָה
  choice: katahimikan
  rationale: Ipinahahayag nito ang katahimikan o kawalan ng ingay at pinananatili ang sadyang kabalintunaan ng “tunog ng katahimikan.”
- source_word: דַקָּה
  choice: banayad
  rationale: Bagaman literal na maaaring “manipis,” “pino,” o “mahina,” ang “banayad” ay likas sa modernong Tagalog at naghahatid ng pinong, bahagyang katangian ng tunog nang hindi ganap na ginagawa itong “bulong.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa pinagmulang teksto; pinananatili ito sa halip na palitan ng titulong maaaring magkubli sa pagkakakilanlan nito bilang pangalan.
- issue: Paglalahad sa קוֹל דְּמָמָה דַקָּה
  choice: isang tunog ng banayad na katahimikan
  alternative: isang banayad na bulong
  rationale: Pinananatili ng pangunahing salin ang pambihira at mahirap na ugnayan ng “tunog” at “katahimikan,” sa halip na tiyakang gawing tinig o bulong ang hindi tahasang nililinaw ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Sadyang pinanatili ang kabalintunaan sa huling parirala, habang inilagay sa talababa ang mas pamilyar at mas interpretibong mga salin.
