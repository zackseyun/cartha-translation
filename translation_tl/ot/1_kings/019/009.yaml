  source_fidelity: 'Tapat ang salin sa pagkakasunod at diwa ng Hebreo: dumating si Elias sa yungib, nagpalipas ng gabi roon, at ang salita ni Yahweh ay dumating sa kanya at nagsalita. Ang “Ano ang ginagawa mo rito?” ay isang natural na pagsasalin ng idyomang מַה־לְּךָ פֹה nang hindi ito ginagawang tanong lamang tungkol sa motibo.'
