id: 1KI.19.9
reference: 1 Kings 19:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: tl
  text: Dumating siya roon sa yungib at nagpalipas ng gabi roon. At narito, dumating sa kanya ang salita ni Yahweh at sinabi sa kanya, “Ano ang ginagawa mo rito, Elias?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bakit ka narito, Elias?” Sa literal na Hebreo, “Ano [ang mayroon] sa iyo rito, Elias?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating siya
  rationale: Ang בוא ay karaniwang pandiwa ng paggalaw. Likas sa Tagalog ang “dumating” at hindi nito ipinapalagay na pumasok na siya sa loob, yamang אֶל ay tumutukoy lamang sa paglapit o pagdating sa yungib.
- source_word: הַמְּעָרָה
  choice: ang yungib
  rationale: Karaniwang katumbas ng מְעָרָה ang “yungib”; malinaw, marangal, at natural ito sa makabagong Tagalog.
- source_word: וַיָּלֶן
  choice: nagpalipas ng gabi
  rationale: Ipinahahayag ng לון/לין ang panunuluyan o pagpapalipas ng gabi. Mas natural at tiyak sa panahon ang pariralang ito kaysa sa “nanuluyan.”
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Ang הִנֵּה ay pantawag-pansin na nagbibigay ng biglang diin at kasiglahan sa salaysay. Pinananatili ng “narito” ang tungkuling ito nang hindi nagdaragdag ng paliwanag.
- source_word: דְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili nito ang kinikilalang pormulang propetiko at ang bigat ng literal na דָּבָר bilang “salita,” sa halip na paliitin ito bilang mensahe lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: 'Tuwirang ipinahahayag ng אֶל na may hulaping panghalip ang direksiyon: ang salita ay dumating “sa kanya.”'
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi sa kanya
  rationale: Pinananatili ang pagkakasunod at pag-uulit ng Hebreo; ang gramatikal na paksa ay ang naunang “salita ni Yahweh.”
- source_word: מַה לְּךָ פֹה
  choice: Ano ang ginagawa mo rito
  rationale: Ang literal na idyoma ay “Ano [ang mayroon] sa iyo rito?” Sa konteksto, ang natural na tanong sa Tagalog ay “Ano ang ginagawa mo rito?” Hindi nito nililimitahan ang tanong sa dahilan lamang, gaya ng maaaring gawin ng “Bakit ka narito?”
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Filipino, na madaling makilala ng karaniwang mambabasa.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nag-aangkat ng karagdagang interpretasyong teolohikal.
- issue: Pagpapahayag sa pormulang דְבַר יְהוָה
  choice: ang salita ni Yahweh
  alternative: isang mensahe mula kay Yahweh
  rationale: Pinananatili ng napiling anyo ang tradisyonal na pormulang propetiko at ang posibleng personipikadong kilos ng “salita,” na siyang sinasabing dumating at nagsalita sa talata.
- issue: Layon ng tanong na מַה לְּךָ פֹה
  choice: Ano ang ginagawa mo rito?
  alternative: Bakit ka narito?
  rationale: Maaaring tumutukoy ang tanong sa kalagayan, gawain, o dahilan ng presensiya ni Elias. Hindi tahasang nilulutas ng salin ang tanong bilang pagsisiyasat lamang sa motibo; inilalagay sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago at madaling maunawaang Filipino Tagalog na may marangal na himig. Pinanatili ang bahagyang biblikal na pantawag-pansing “At narito” upang maipakita ang puwersa ng הִנֵּה. Ginamit ang “Elias,” ang nakasanayang anyong Filipino ng pangalan.
