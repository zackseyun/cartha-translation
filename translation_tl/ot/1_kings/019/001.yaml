  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: tl
  text: Isinalaysay ni Ahab kay Jezebel ang lahat ng ginawa ni Elias, at kung paanong pinatay niya sa pamamagitan ng tabak ang lahat ng propeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Isinalaysay
  rationale: Ipinahahayag ang masinsinang pagsasabi o pag-uulat ni Ahab kay Jezebel sa natural na modernong Tagalog.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: הָרַג
  choice: pinatay
  rationale: Tuwirang katumbas ng pandiwang Hebreo na nangangahulugang pumatay.
- source_word: בֶּחָרֶב
  choice: sa pamamagitan ng tabak
  rationale: Pinananatili ang tahasang pahayag tungkol sa paraang ginamit sa pagpatay.
theological_decisions:
- issue: Tinukoy na gumagawa ng pagpatay sa ikalawang sugnay
  choice: Pinanatiling si Elias ang likas na tinutukoy ng “niya.”
  alternative: Gawing tahasang “pinatay ni Elias.”
  rationale: Malinaw sa balangkas ng Hebreo na si Elias ang paksa ng עָשָׂה at הָרַג, ngunit ang panghalip sa Tagalog ay nagpapanatili sa daloy ng orihinal nang hindi nagdaragdag ng hindi kailangan.
- issue: Pagkakakilanlan ng “lahat ng propeta”
  choice: Hindi dinagdagan ng “ni Baal.”
  alternative: “lahat ng propeta ni Baal”
  rationale: Bagaman ipinahihiwatig ng naunang konteksto, walang gayong panuring sa mismong talata; pinanatili ang saklaw at anyo ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ang “kung paanong” ay natural na naghuhudyat sa ikalawang iniulat na pangyayari at iniiwasan ang alanganing literal na pag-uulit ng “lahat ng.”
