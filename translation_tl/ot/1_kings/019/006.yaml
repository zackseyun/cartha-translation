translation_notes:
  register: Makabagong Filipino Tagalog na simple, marangal, at pasalaysay. Ginamit ang “naroon” sa halip na mas arkaikong “narito” o “masdan,” at “tinapay” upang hindi mapagkamalang matamis na keyk ang עֻגָה.
