base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: tl
  text: Tumingin siya, at naroon sa may ulunan niya ang isang tinapay na inihurno sa maiinit na bato[a] at isang banga ng tubig. Kumain siya at uminom, at muli siyang nahiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tinapay sa mga baga.” Maaaring tumukoy ang Hebreong רְצָפִים sa maiinit na batong ginagamit sa pagluluto, ngunit maaari rin itong isalin nang mas pangkalahatan bilang “mga baga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Tumingin siya
  rationale: Ang נבט ay karaniwang nangangahulugang tumingin o pagmasdan; hindi dinaragdagan ng direksiyong wala sa Hebreo.
- source_word: וְהִנֵּה
  choice: at naroon
  rationale: Itinatampok ng הִנֵּה ang biglang napansing bagay. Ang “at naroon” ay likas sa makabagong Tagalog at nananatiling masigla sa salaysay.
- source_word: מְרַאֲשֹׁתָיו
  choice: sa ulunan niya
  rationale: Tumutukoy ito sa lugar sa tabi o dako ng ulo ng isang nakahiga; ang “sa ulunan niya” ay maikli at angkop sa tagpo.
- source_word: עֻגַת
  choice: isang tinapay
  rationale: Ang עֻגָה ay bilog na tinapay o bread-cake. Pinipili ang “tinapay” upang maiwasan ang makabagong pahiwatig ng matamis na keyk.
- source_word: רְצָפִים
  choice: niluto sa maiinit na bato
  rationale: Malamang na tumutukoy sa mga batong pinainit para sa pagluluto, bagaman maaari rin itong unawain bilang mga baga; pinananatili sa talababa ang leksikal na alternatibo.
- source_word: וְצַפַּחַת מָיִם
  choice: at isang sisidlan ng tubig
  rationale: Ang צַפַּחַת ay lalagyan gaya ng banga, pitsel, o prasko. Ang “sisidlan” ay malinaw at hindi labis na tumitiyak sa hugis nito.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Kumain siya at uminom
  rationale: Tuwirang pinananatili ang payak at magkasunod na kilos sa salaysay.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: at muli siyang nahiga
  rationale: Ang שׁוּב kasunod ng שׁכב ay nagsasaad ng muling paghiga; natural itong ipinahahayag sa Tagalog nang hindi literal na idinaragdag ang “bumalik.”
