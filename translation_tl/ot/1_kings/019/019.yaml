revisions:
- from: Kaya umalis siya roon at natagpuan niya si Eliseo na anak ni Safat. Nag-aararo si Eliseo, at nasa unahan niya ang labindalawang pares na magkatuwang sa pamatok[a]; kasama siya sa ikalabindalawang pares. Dumaan sa tabi niya si Elias at inihagis sa kanya ang kanyang balabal.[b]
  to: Kaya umalis siya roon at natagpuan niya si Eliseo na anak ni Safat. Nag-aararo si Eliseo, at nasa unahan niya ang labindalawang pares na magkakapamatok[a]; kasama siya ng ikalabindalawang pares. Dumaan sa tabi niya si Elias at inihagis ang kanyang balabal sa ibabaw niya.[b]
