base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: tl
  text: Kaya umalis siya roon at natagpuan niya si Eliseo na anak ni Safat. Nag-aararo si Eliseo, at nasa unahan niya ang labindalawang pares na magkakapamatok[a]; kasama siya ng ikalabindalawang pares. Dumaan sa tabi niya si Elias at inihagis ang kanyang balabal sa ibabaw niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “labindalawang pares ng mga baka”; tumutukoy ang Hebreo sa labindalawang magkapares na pangkat na ginagamit sa pag-aararo.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa isang natatanging panlabas na kasuotan; maaari rin itong tawaging “balabal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Kaya umalis siya roon
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay, at likas sa modernong Tagalog ang “Kaya”; pinananatili ng “roon” ang מִשָּׁם.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: at natagpuan niya si Eliseo na anak ni Safat
  rationale: Tuwirang kahulugan ng מָצָא ang “natagpuan.” Ginamit ang nakaugaliang anyong Filipino ng mga pangalang Eliseo at Safat.
- source_word: וְהוּא חֹרֵשׁ
  choice: Nag-aararo si Eliseo
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na kilos. Inulit ang pangalan upang maging malinaw at natural sa Tagalog ang pagbabago ng tinutukoy na “siya.”
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: labindalawang pares na magkatuwang sa pamatok
  rationale: Maaaring tumukoy ang צֶמֶד sa isang pares ng mga hayop na magkasamang nakakabit sa pamatok. Hindi idinagdag sa pangunahing teksto ang “mga baka,” na ipinahihiwatig lamang ng konteksto.
- source_word: לְפָנָיו
  choice: nasa unahan niya
  rationale: Malinaw at likas na ipinapahayag nito ang puwestong nasa harap ni Eliseo.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: kasama siya sa ikalabindalawang pares
  rationale: Pinananatili ang eliptikong pagtukoy sa ikalabindalawang pangkat, habang nililinaw sa Tagalog na si Eliseo ay kasama nito.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Dumaan sa tabi niya si Elias
  rationale: Ipinapahayag ng עָבַר אֶל ang pagdaan o paglapit ni Elias kay Eliseo. Ang “sa tabi niya” ay natural at hindi labis na binibigyang-kahulugan ang kilos.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: at inihagis sa kanya ang kanyang balabal
  rationale: Ang אַדֶּרֶת dito ay panlabas na kasuotan ni Elias. Karaniwan at malinaw ang “balabal,” at pinananatili ng “inihagis sa kanya” ang mismong simbolikong kilos nang hindi ito ginagawang tahasang paghirang.
theological_decisions:
- issue: Simbolikong kahulugan ng balabal ni Elias
  choice: 'Isinalaysay lamang ang kilos: “inihagis sa kanya ang kanyang balabal.”'
  alternative: Isalin bilang tahasang paghirang kay Eliseo bilang kahalili o tawagin itong “balabal ng propeta.”
  rationale: Hindi tahasang ipinaliliwanag ng Hebreo sa talatang ito ang simbolikong kilos. Hinahayaan ng salin na ang nakapaligid na konteksto ang magpahiwatig ng kaugnayan nito sa tungkulin at paghalili bilang propeta.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang nakaugaliang pangalang Elias, Eliseo, at Safat. Iniwasan ang teknikal o makalumang pananalita at hindi ipinasok sa pangunahing teksto ang paliwanag sa simbolikong kilos.
