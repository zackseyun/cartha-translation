  naturalness: Malinaw, makabago, at angkop ang marangal na register. Natural ang “Bumangon ka at kumain” at ang paggamit ng “Elias” upang malinaw ang tinutukoy ng panghalip.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה at “anghel” para sa מַלְאַךְ. Ngunit ang talababa para sa leksikal na alternatibo ng “anghel” ay dapat ikabit sa “anghel,” hindi sa “Yahweh.”
