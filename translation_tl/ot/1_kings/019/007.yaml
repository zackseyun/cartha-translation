base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: tl
  text: Pagkatapos, bumalik sa ikalawang pagkakataon ang anghel[a] ni Yahweh. Hinipo niya si Elias at sinabi, “Bumangon ka at kumain, sapagkat masyadong mabigat para sa iyo ang paglalakbay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Sa daloy ng salaysay, ang שוב ay tumutukoy sa pagbabalik ng anghel matapos ang unang pagdalaw.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng “mensahero” o “anghel.” Sa tagpong ito ng sugo mula sa Diyos, natural at nakagawian sa Filipino ang “anghel,” habang pinananatili ang “mensahero” bilang leksikal na alternatibo sa talababa.
- source_word: שֵׁנִית
  choice: sa ikalawang pagkakataon
  rationale: Tahasang ipinahahayag ng salita na ito ang ikalawang pag-ulit, hindi lamang ang pangkalahatang diwa ng “muli.”
- source_word: וַיִּגַּע בּוֹ
  choice: Hinipo niya si Elias
  rationale: Ang נגע na may hulaping panghalip ay nangangahulugang “hinipo siya.” Ginamit ang pangalang Elias upang maging malinaw at natural sa Filipino kung sino ang hinipo.
- source_word: קוּם אֱכֹל
  choice: Bumangon ka at kumain
  rationale: Pinananatili ang tuwirang lakas ng dalawang pautos sa natural na makabagong Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang “sapagkat” ay malinaw at angkop sa marangal na salaysay.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: napakahirap para sa iyo ang paglalakbay
  rationale: Ang Hebreo ay nagsasabing ang paglalakbay ay “malaki/mabigat” o lampas sa kakayahan niya. Iniiwasan ng salin na limitahan ang diwa sa haba lamang, habang likas itong nauunawaan sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Paglilipat sa מַלְאַךְ bilang makalangit na sugo
  choice: anghel
  alternative: mensahero
  rationale: Parehong saklaw ng salitang Hebreo ang “anghel” at “mensahero.” Ang konteksto ay natural na nagpapahiwatig ng makalangit na sugo, ngunit hindi itinatago ang mas malawak na leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tiyak na “ikalawang pagkakataon” at iniwasang gawing “napakahaba” ang paglalakbay, sapagkat mas malawak ang diwa ng pariralang Hebreo kaysa haba lamang.
