  to: Pagkatapos, bumalik sa ikalawang pagkakataon ang anghel[a] ni Yahweh. Hinipo niya si Elias at sinabi, “Bumangon ka at kumain, sapagkat masyadong mabigat para sa iyo ang paglalakbay.”
  rationale: Inilipat ang pananda ng talababa upang tumukoy ito sa “anghel,” ang salitang may leksikal na alternatibong “mensahero.” Pinalitan din ang “napakahirap” ng “masyadong mabigat” upang mas maipakita ang diwang ang paglalakbay ay lampas sa lakas o kakayahan ni Elias, nang hindi nililimitahan ang kahulugan sa haba o hirap lamang.
