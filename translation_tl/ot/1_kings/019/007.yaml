    rationale: Ipinahihiwatig ng Hebreo na ang paglalakbay ay labis o higit sa kakayanan ni Elias, hindi lamang na mahirap. Ang “masyadong mabigat para sa iyo” ay mas malapit habang natural pa rin sa Filipino.
