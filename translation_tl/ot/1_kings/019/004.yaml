  to: Ngunit siya mismo ay naglakbay nang isang araw papasok sa ilang. Dumating siya at naupo sa ilalim ng isang palumpong ng retama[a]. Hiniling niyang mamatay at sinabi, “Sapat na! Ngayon, Yahweh, kunin mo ang buhay ko, sapagkat hindi ako mas mabuti kaysa sa aking mga ninuno.”
