base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: tl
  text: Ngunit siya mismo ay naglakbay nang isang araw papasok sa ilang. Dumating siya at naupo sa ilalim ng isang palumpong ng retama[a]. Hiniling niyang mamatay at sinabi, “Sapat na! Ngayon, Yahweh, kunin mo ang buhay ko, sapagkat hindi ako mas mabuti kaysa sa aking mga ninuno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang retama ay isang palumpong sa disyerto na maaari ring ilarawang maliit na puno.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: naglakad nang isang araw papasok sa ilang
  rationale: Ipinahahayag ng דֶּרֶךְ יוֹם ang isang araw na paglalakbay, habang ipinakikita ng pandiwang galaw at בַּמִּדְבָּר ang pagpasok niya sa ilang.
- source_word: רֹתֶם אַחַת
  choice: isang punong retama
  rationale: Ang רֹתֶם ay isang palumpong sa disyerto na karaniwang tinatawag na retama; pinananatili ng “isang” ang anyong isahan nang natural sa Tagalog.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: Hiniling niyang mamatay na siya
  rationale: Idyoma itong tumutukoy sa paghiling ng kamatayan para sa sarili, hindi sa hiwalay na pagkamatay ng “kaluluwa.”
- source_word: רַב עַתָּה
  choice: Sapat na! Ngayon
  rationale: Ang רַב ay padamdam na nangangahulugang “sapat na,” at hiwalay na pinananatili ang pagkaapurahan ng עַתָּה, “ngayon.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: קַח נַפְשִׁי
  choice: kunin mo na ang buhay ko
  rationale: Sa konteksto ng paghiling ni Elias na mamatay, ang נֶפֶשׁ ay likas na tumutukoy sa kanyang buhay; ang “na” ay naghahatid ng pagkaapurahan nang hindi nagdaragdag ng bagong diwa.
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: sapagkat hindi ako nakahihigit sa aking mga ninuno
  rationale: Ang טוֹב na may pahambing na מִן ay nangangahulugang “mas mabuti/nakahihigit kaysa,” at ang אֲבֹתָי ay natural na “mga ninuno” sa kontekstong ito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang kinakausap ni Elias ang Diyos ng Israel sa personal nitong pangalang tipan; pinananatili ng “Yahweh” ang pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kahulugan ng נֶפֶשׁ sa kahilingang mamatay
  choice: buhay
  alternative: kaluluwa
  rationale: Dahil humihiling si Elias na mamatay, “buhay” ang kahulugang hinihingi ng konteksto at hindi ito nagpapasok ng isang tiyak na doktrina tungkol sa pagkakabukod ng katawan at kaluluwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang bigat at pagkaapurahan ng panalangin ni Elias, ang tahasang banal na pangalang “Yahweh,” at ang pahambing na diwa ng huling sugnay.
