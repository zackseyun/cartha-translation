  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: tl
  text: At sinabi niya, “Labis ang sigasig ko para kay Yahweh,[a] ang Diyos ng mga hukbo, sapagkat tinalikuran ng mga anak ng Israel[b] ang iyong tipan, giniba nila ang iyong mga altar, at pinatay nila sa tabak ang iyong mga propeta. Ako na lamang ang natitira, at hinahangad nilang kunin ang buhay ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Labis akong nanibugho alang-alang kay Yahweh.” Gumagamit ang Hebreo ng magkaugnay na anyo ng iisang pandiwa upang pasidhiin ang pahayag.
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.” Literal na “mga anak ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Labis akong naging masigasig
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapasidhi sa diwa. Likas sa modernong Tagalog ang “labis na masigasig” at naihahatid nito ang maalab na katapatan nang hindi nagmumungkahi ng karaniwang romantikong kahulugan ng “paninibugho.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Itinuturo ng ל ang pinag-uukulan ng sigasig ni Elias; pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: ang Diyos ng mga hukbo
  rationale: Pinananatili nito ang malawak na saklaw ng צְבָאוֹת nang hindi nililimitahan ang tinutukoy sa makalupa o makalangit na mga hukbo lamang.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: tinalikuran ... ang iyong tipan
  rationale: Ang “tinalikuran” ay natural at mabigat na katumbas ng pagtalikod o pag-abandona sa tipan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Pinananatili ang literal at pangtipang katawagan sa bayan, na malinaw pa rin sa Tagalog.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: giniba nila ang iyong mga altar
  rationale: Tumpak at natural na inilalarawan ng “giniba” ang pisikal na pagpapabagsak o pagwasak sa mga altar.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: pinatay nila sa tabak ang iyong mga propeta
  rationale: Pinananatili ang tahasang instrumento ng pagpatay at ang marahas na kongkretong larawan ng Hebreo.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Ako na lamang ang natitira
  rationale: Likas na Tagalog ito at naipapahayag ang diin sa lubos na pag-iisa ni Elias.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: hinahangad nilang kunin ang buhay ko
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa buhay. Pinananatili ng salin ang pandiwang “kunin” at ang layuning patayin siya nang hindi ginagamit ang nakalilitong literal na “kaluluwa.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton; ang transliterasyong “Yahweh” ay nagpapanatili rito bilang personal at pangtipang pangalan ng Diyos.
- issue: Kahulugan ng קַנֹּא קִנֵּאתִי
  choice: Labis akong naging masigasig
  alternative: Labis akong nanibugho
  rationale: Maaaring saklawin ng ugat ang paninibugho o masidhing sigasig. Sa pahayag ni Elias, malinaw na tumutukoy ito sa maalab na katapatan para kay Yahweh, ngunit itinatala sa talababa ang mas literal na alternatibo upang hindi maitago ang leksikal na saklaw.
- issue: Katawagan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang pormal at pangtipang anyo ng Hebreo; ibinibigay sa talababa ang mas idyomatikong katawagan.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Pinanatili ang “Yahweh,” “tipan,” “altar,” at “mga hukbo” bilang malinaw at pamilyar na bokabularyong biblikal. Inilagay ang mga pananda ng talababa sa mismong pariralang tinatalakay ng bawat tala.
