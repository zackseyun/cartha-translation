  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: tl
  text: 'At mangyayari: ang sinumang makatakas mula sa tabak ni Hazael ay papatayin ni Jehu; at ang sinumang makatakas mula sa tabak ni Jehu ay papatayin ni Eliseo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tuwirang sinasabi ng Hebreo na “papatayin ni Eliseo.” Maaaring tumukoy ito sa personal niyang pagkilos o sa paghatol na ipinatupad sa pamamagitan ng kaniyang ministeryo bilang propeta.
    reason: Pinananatili ang tuwirang diwa ng pandiwa habang ipinababatid ang posibleng di-tuwirang pagganap ni Eliseo sa mas malawak na konteksto.
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari
  rationale: Likas na Filipino para sa pormulang Hebreo na nagpapakilala ng isang tiyak na mangyayari sa hinaharap.
- source_word: הַנִּמְלָט
  choice: ang sinumang makatakas
  rationale: Ang participle na may pantukoy ay ginagamit bilang pangngalan at may pangkalahatang diwa; malinaw itong naihahayag ng “ang sinumang makatakas.”
- source_word: מֵחֶרֶב
  choice: sa tabak ni
  rationale: Pinananatili ang kongkretong larawang “tabak,” na maaari ring kumatawan sa nakamamatay na karahasan o paghatol.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyo sa Filipino.
- source_word: יָמִית
  choice: papatayin
  rationale: Ang Hiphil ng מות ay causative at nangangahulugang magpangyaring mamatay o pumatay. “Papatayin” ang pinakanatural at tuwirang katumbas sa modernong Filipino nang hindi ipinapalagay kung personal o sa pamamagitan ng ibang paraan ang pagkilos.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: וְהַנִּמְלָט
  choice: at ang sinumang makatakas
  rationale: Pinananatili ang parehong pangkalahatang diwa at paralelismo ng naunang parirala.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Elisha sa mga saling Filipino.
theological_decisions:
- issue: Ang pagiging tagapagpatupad ni Eliseo sa salitang יָמִית
  choice: Panatilihin sa pangunahing teksto ang tuwirang pahayag na papatayin ni Eliseo ang mga makatakas kay Jehu.
  alternative: Unawain na ang paghatol ay mangyayari sa pamamagitan ng propetikong salita o ministeryo ni Eliseo, sa halip na personal niyang pagpatay.
  rationale: Tuwirang magkapantay sa sintaks ng Hebreo sina Hazael, Jehu, at Eliseo bilang mga tagapagpatupad ng kamatayan. Hindi dapat palambutin ng salin ang tensiyong ito, ngunit maaaring banggitin sa talababa ang posibleng di-tuwirang paraan ng pagkilos ni Eliseo.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang paralelismo at ang larawan ng “tabak,” habang iniwasan ang masyadong makaluma o mabigat na pananalita.
