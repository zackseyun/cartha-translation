  - severity: low
    issue: Medyo hindi likas ang 'At mangyayari na' bilang pambungad.
    rationale: Ang 'At mangyayari:' ay natural na modernong Filipino at nananatiling pormulang pagpapakilala ng idineklarang mangyayari.
  revised_text: 'At mangyayari: ang sinumang makatakas mula sa tabak ni Hazael ay papatayin ni Jehu; at ang sinumang makatakas mula sa tabak ni Jehu ay papatayin ni Eliseo.[a]'
