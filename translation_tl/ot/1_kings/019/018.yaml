base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: tl
  text: Ngunit nag-iwan ako para sa aking sarili ng pitong libo sa Israel[a]—lahat ng tuhod na hindi lumuhod kay Baal at bawat bibig na hindi humalik sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinanatili ko para sa aking sarili ang pitong libo sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang paghalik sa isang diyus-diyosan ay tanda ng pagpupugay o pagsamba rito.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Ngunit mag-iiwan ako para sa aking sarili
  rationale: Ang Hiphil perfect na 1cs ng שׁאר ay nangangahulugang magpanatili o mag-iwan. Sa konteksto ng kasunod na gagawin ng Diyos, likas sa Tagalog ang panghinaharap na “mag-iiwan ako”; pinananatili ng “para sa aking sarili” ang personal na layon, at ng “ngunit” ang pagsalungat sa reklamo ni Elias.
- source_word: בְיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwirang lokatibong parirala.
- source_word: שִׁבְעַת אֲלָפִים
  choice: pitong libo
  rationale: Likas na anyo ng bilang sa Tagalog.
- source_word: כָּל הַבִּרְכַּיִם
  choice: lahat ng tuhod
  rationale: Pinananatili ang kongkretong larawan ng mga tuhod at ang kolektibong saklaw ng parirala.
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: na hindi lumuhod kay Baal
  rationale: Ang כּרע ay pagyukod o pagluhod bilang pagpapasakop o pagsamba. Natural sa Tagalog ang “lumuhod kay Baal” at malinaw ang layon ng pagpupugay.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Bagaman may pantukoy sa Hebreo, kinikilalang pantanging pangalan sa Tagalog ang Baal kaya hindi na nilalagyan ng katumbas ng “ang.”
- source_word: וְכָל הַפֶּה
  choice: at bawat bibig
  rationale: Ipinahahayag ng “bawat” ang distributibong diwa ng isahang kolektibo habang pinananatili ang parallel na larawan ng bahagi ng katawan.
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: na hindi humalik sa kanya
  rationale: Tuwirang isinasalin ang נשׁק bilang “humalik.” Ang “sa kanya” ay sumusunod sa panghalip ng Hebreo, na malinaw na tumutukoy kay Baal; ipinapaliwanag sa talababa ang kultikong kabuluhan.
theological_decisions:
- issue: Paglalahad sa pahayag tungkol sa mga nanatiling tapat nang hindi nag-aangkat ng teknikal na terminolohiyang teolohikal
  choice: mag-iiwan ako para sa aking sarili ng pitong libo sa Israel
  alternative: nagpanatili ako para sa aking sarili ng pitong libo sa Israel
  rationale: Ipinahihiwatig ng talata ang pagkilos ng Diyos upang manatili ang mga hindi sumamba kay Baal, ngunit hindi gumagamit ng teknikal na katawagang wala sa Hebreo. Pinananatili rin ng panghinaharap ang posibleng temporal na pagbasa ng perfect sa kontekstong ito, samantalang inilalagay sa talababa ang alternatibong resultative/past na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkatugmang larawang “lahat ng tuhod” at “bawat bibig.” Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto at nakaugnay sa kani-kanilang talababa.
