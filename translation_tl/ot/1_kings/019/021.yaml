base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: tl
  text: Pagkatapos, bumalik siya mula sa pagsunod kay Elias, kinuha ang pares ng mga baka[a], at kinatay ang mga iyon bilang handog. Ginamit niya ang mga kagamitan ng mga baka[b] sa pagpapakulo ng karne at ibinigay niya ito sa mga tao; kumain sila. Pagkatapos, tumindig siya, sumunod kay Elias, at naglingkod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang magkatuwang sa pamatok na mga baka.”
    reason: lexical_alternative
  - marker: b
    text: O “ang pamatok” o “ang mga kasangkapan ng mga baka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: Pagkatapos, tumalikod siya mula sa pagsunod kay Elias
  rationale: Ang idyoma ay literal na ‘bumalik mula sa likuran niya.’ Nililinaw ng pangalang Elias ang reperente ng panghalip sa natural na Tagalog at pinananatili ang kilos ng pansamantalang pagtalikod matapos habulin ni Eliseo si Elias.
- source_word: צֶמֶד הַבָּקָר
  choice: ang magkatuwang na baka
  rationale: Ang צֶמֶד ay maaaring tumukoy sa isang pares, lalo na sa mga bakang magkatuwang sa pamatok. Ang ‘magkatuwang na baka’ ay malinaw at likas sa Tagalog; pinananatili sa talababa ang mas literal na alternatibo.
- source_word: וַיִּזְבָּחֵהוּ
  choice: at inihandog ang mga iyon
  rationale: Karaniwang may sakripisyal na diwa ang זבח. Ipinahihiwatig ng ‘inihandog’ ang diwang iyon nang hindi nagdaragdag kung kanino o sa anong pormal na ritwal ginawa ang handog. Ang maramihang panghalip ay umaayon sa pares ng baka, bagaman kolektibong isahan ang hulapi sa Hebreo.
- source_word: וּבִכְלִי הַבָּקָר
  choice: Ginamit niyang panggatong ang mga kagamitan ng mga baka
  rationale: Malawak ang kahulugan ng כְּלִי—kasangkapan, kagamitan, o sisidlan. Ipinahihiwatig ng konteksto na ginamit ang kagamitang kahoy sa pagluluto; tahasang ‘panggatong’ ang natural na paraan upang maipakita ang relasyon ng kasangkapan sa pagluluto, habang inilalahad sa talababa ang leksikal na saklaw.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: upang lutuin ang karne
  rationale: Ang בשל ay maaaring mangahulugang magluto o magpakulo. Ang ‘lutuin’ ay natural sa modernong Tagalog at hindi nagpapasya nang higit sa katiyakan ng pandiwang Hebreo; ang בשר ay natural na ‘karne’ sa kontekstong pagkain.
- source_word: לָעָם
  choice: sa mga tao
  rationale: Direkta at neutral na salin ng עם, na tumutukoy sa mga taong naroon o sa lokal na pamayanan.
- source_word: וַיָּקָם
  choice: Pagkatapos, tumindig siya
  rationale: Pinananatili ng ‘tumindig’ ang hiwalay na kilos at bahagyang marangal na rehistro ng Hebreong salaysay, nang hindi isinasama rito ang kasunod na paglakad.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: sumunod kay Elias
  rationale: Natural na katumbas sa Tagalog ng literal na ‘lumakad sa likuran ni Elias,’ at pinananatili ang motibo ng pagsunod mula sa naunang parirala.
- source_word: וַיְשָׁרְתֵהוּ
  choice: at naglingkod sa kanya
  rationale: Direktang salin ng שרת na pinananatiling malawak ang uri ng paglilingkod, bagaman maaari itong tumukoy sa tungkulin ng isang tagapaglingkod o katulong.
theological_decisions:
- issue: Kung dapat ipahayag ang sakripisyal na diwa ng זבח
  choice: Isinalin bilang ‘inihandog ang mga iyon’
  alternative: ‘kinatay ang mga iyon’ nang walang tahasang sakripisyal na diwa
  rationale: Karaniwang may kaugnayan sa paghahandog ang pandiwang Hebreo, at kaayon nito ang salu-salong sumunod. Hindi tinutukoy ng salin kung kanino inihandog o kung anong ritwal ang isinagawa, kaya hindi ito lumalampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang ‘Elias’ at ‘Eliseo’ bilang karaniwang tradisyonal na anyong Tagalog ng mga pangalan. Iniwasan ang sobrang teknikal o denominasyonal na pananalita; ang mga tunay na alternatibong leksikal ay pinanatili sa mga talababa.
