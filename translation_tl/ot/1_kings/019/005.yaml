  source_fidelity: Tumpak na naipapahayag ang magkakasunod na kilos na “nahiga” at “natulog,” ang lokasyong nasa ilalim ng retama, ang biglaang/presentasyonal na pagpapakilala ng anghel, ang paghipo, at ang dalawang maigsi at tuwirang utos. Ang “Walang anu-ano” ay isang likas na katumbas sa salaysay para sa sorpresa o biglaang pagpasok na ipinahihiwatig ng וְהִנֵּה, bagaman hindi nito literal na isinasalin ang “narito.”
