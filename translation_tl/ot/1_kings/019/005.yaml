base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: tl
  text: Pagkatapos, nahiga siya at natulog sa ilalim ng isang punong retama. Walang anu-ano, hinipo siya ng isang anghel[a] at sinabi sa kanya, “Bumangon ka at kumain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sugo.” Ang Hebreong מַלְאָךְ ay maaaring tumukoy sa isang taong sugo o sa isang anghel; sa kontekstong ito, mas malamang ang “anghel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: Pagkatapos, nahiga siya at natulog
  rationale: Pinananatili ang sunod-sunod na kilos ng dalawang Qal wayyiqtol. Natural sa makabagong Tagalog ang “Pagkatapos” bilang panandang pasalaysay, at hindi dinaragdagan ng “nakatulog” ang payak na diwa ng ישׁן.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: sa ilalim ng isang punong retama
  rationale: Ang תַּחַת ay tuwirang “sa ilalim ng.” Ang רֹתֶם ay isang halamang disyerto na karaniwang tinatawag na retama o broom; ginamit ang “punong retama” upang maging malinaw at dignified, habang ang אֶחָד ay likas na naipapahayag bilang “isang.”
- source_word: וְהִנֵּה זֶה
  choice: Walang anu-ano
  rationale: Ang parirala ay presentasyonal at nagpapakilala ng biglaan o kapansin-pansing pangyayari. Ang “Walang anu-ano” ay likas na salaysay sa Tagalog at pinananatili ang sorpresa nang hindi gumagamit ng ark­aikong “narito.”
- source_word: מַלְאָךְ
  choice: anghel
  rationale: Maaaring mangahulugang “sugo” o “anghel” ang salita. Sa konteksto ng di-pangkaraniwang pagdalaw at paglalaan, mas malamang ang “anghel”; inilalahad sa talababa ang leksikal na alternatibo.
- source_word: נֹגֵעַ בּוֹ
  choice: hinipo siya
  rationale: Ang participle ng נגע ay tumutukoy sa pisikal na pagdaiti. Sa salaysay na Tagalog, natural itong gawing ganap na kilos na “hinipo siya,” sa halip na mas mabigat na “humihipo sa kanya.”
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi sa kanya
  rationale: Pinananatili ang karaniwang pormulang pasalaysay at ang tahasang di-tuwirang layon na לוֹ.
- source_word: קוּם אֱכֹל
  choice: Bumangon ka at kumain
  rationale: Parehong payak na pautos ang mga pandiwa. Ang “Bumangon ka” ay natural at kasalukuyang Filipino, at ang “kumain” ay nagpapanatili sa kaiklian ng Hebreo.
theological_decisions:
- issue: Kung ang מַלְאָךְ ay isasaling “anghel” o “sugo”
  choice: anghel
  alternative: sugo
  rationale: Bagaman tunay na leksikal na posibilidad ang “sugo,” ipinahihiwatig ng agarang konteksto ang isang makalangit na nilalang. Hindi lubusang isinasara ang ambiguity sapagkat nakatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang ark­aikong “bumangon at kumain ka” na maaaring maging malabo ang saklaw ng “ka,” at pinili ang “punong retama” bilang maikli ngunit makikilalang katawagan sa halamang disyerto.
