base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: tl
  text: Sinabi ni Yahweh sa kanya, “Humayo ka, bumalik ka sa iyong daan, patungo sa ilang ng Damasco.[a] Pagdating mo roon, pahiran mo ng langis si Hazael bilang hari ng Aram.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ilang ng Damasco.” Ang anyong Hebreo ng “ilang” ay may hulaping nagsasaad ng direksiyon.
    reason: lexical_alternative
  - marker: b
    text: Ang Aram ang pangalang Hebreo na madalas ding isinasaling “Syria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Tagalog ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לֵךְ שׁוּב
  choice: Humayo ka, bumalik ka
  rationale: Pinananatili ang dalawang magkasunod na pautos—“humayo” at “bumalik”—nang hindi pinagsasanib sa iisang pandiwa.
- source_word: לְדַרְכְּךָ
  choice: sa dinaanan mo
  rationale: Likas sa Filipino at ipinahihiwatig na babalikan ni Elias ang rutang dinaanan niya.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: patungo sa ilang ng Damasco
  rationale: Ipinapahayag ng hulaping paturol sa direksiyon sa salitang Hebreo ang pagkilos tungo sa ilang na kaugnay ng Damasco.
- source_word: וּבָאתָ
  choice: Pagdating mo roon
  rationale: 'Likas na ipinahahayag sa Filipino ang pagkakasunod-sunod ng mga kilos: pagkarating, saka isasagawa ang pagpapahid.'
- source_word: וּמָשַׁחְתָּ
  choice: pahiran mo
  rationale: Ang anyo ay nagpapatuloy sa serye ng mga utos; ang tuwirang pautos ay malinaw at natural sa Filipino.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: bilang hari sa Aram
  rationale: Natural na salin ng pormula ng pagtatalaga at pinananatili ang Hebreong pangalang Aram sa halip na ang mas huling katawagang Syria.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa halip na palitan ng titulo.
- issue: Kabuluhan ng pagpapahid kay Hazael
  choice: pahiran mo si Hazael bilang hari
  alternative: italaga mo si Hazael na maging hari
  rationale: Pinananatili ang kongkretong pandiwang “pahiran” sa Hebreo nang hindi ipinapaliwanag o nilulutas ang anumang teolohikal na tensiyon tungkol sa paraan ng katuparan nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang dalawang pautos sa simula at ang kongkretong larawan ng pagpapahid. Inilagay ang mga panandang talababa sa mga salitang talagang tinatalakay ng bawat talababa.
