- from: Sinabi sa kanya ni Yahweh, “Humayo ka, bumalik ka sa dinaanan mo patungo sa ilang ng Damasco.[a] Pagdating mo roon, pahiran mo si Hazael bilang hari sa Aram.[b]”
  to: Sinabi ni Yahweh sa kanya, “Humayo ka, bumalik ka sa iyong daan, patungo sa ilang ng Damasco.[a] Pagdating mo roon, pahiran mo ng langis si Hazael bilang hari ng Aram.[b]”
  rationale: Inayos ang pagtukoy sa ruta upang hindi magdagdag ng di-tahasang detalye, ginawang mas malinaw ang pormula ng paghahari, at inilipat ang pananda ng talababa b sa salitang tinatalakay nito. Ang “ng langis” ay likas na pagpapahayag sa Filipino ng ritwal na “pahiran” at hindi binabago ang kahulugan ng Hebreong pandiwa.
