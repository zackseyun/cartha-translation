source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: tl
  text: At pahiran mo ng langis si Jehu na anak ni Nimsi upang maging hari ng Israel, at pahiran mo rin ng langis si Eliseo na anak ni Safat, na mula sa Abel-mehola, upang maging propetang hahalili sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang propetang kapalit mo.” Maaaring ipahayag ng Hebreo ang paghalili o ang pagpalit sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: pahiran mo
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki sa kontekstong ito ay utos. Ang “pahiran mo” ay likas at malinaw na anyong pautos sa modernong Tagalog at pinananatili ang ritwal ng pagtatalaga.
- source_word: לְמֶלֶךְ
  choice: upang maging hari
  rationale: Ang לְ ay tumutukoy sa pagtatalaga sa tungkulin. Mas natural sa Tagalog ang “upang maging hari” kaysa sa literal na “bilang hari” kasunod ng pandiwang “pahiran.”
- source_word: עַל יִשְׂרָאֵל
  choice: ng Israel
  rationale: Ipinahihiwatig ng עַל ang pamamahala sa Israel. Ang “hari ng Israel” ang natural at karaniwang paraan sa Tagalog upang tukuyin ang paghahari sa bayan.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa Filipino sa halip na tuwirang transliterasyong Ingles.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: na mula sa Abel-mehola
  rationale: Ang מִן ay nagpapahayag ng pinagmulan o bayang pinanggalingan. Malinaw itong naipapahayag ng “mula sa.”
- source_word: לְנָבִיא
  choice: upang maging propeta
  rationale: Ang לְ ay nagmamarka ng pagtatalaga sa tungkuling propeta; natural itong ipinahayag sa Tagalog bilang “upang maging propeta.”
- source_word: תַּחְתֶּיךָ
  choice: hahalili sa iyo
  rationale: Maaaring tumukoy ang תַּחַת sa paghalili o pagpalit. Ang “hahalili sa iyo” ay natural sa Tagalog at angkop sa konteksto ng pagpapatuloy sa tungkuling propeta, habang inilalahad sa talababa ang posibleng diin sa pagiging kapalit.
- source_word: וְאֵת ... וְאֶת
  choice: At ... at ... rin
  rationale: Hindi tuwirang isinasalin ang pantukoy sa tuwirang layon na אֵת. Ang mga pangatnig ay pinanatili, at ang “rin” ay likas na nagpapakita ng magkatambal na utos.
- source_word: בֶן
  choice: anak ni
  rationale: Ang patronimikong pagkakakilanlan ay natural na isinasalin sa Tagalog bilang “anak ni.”
theological_decisions:
- issue: Ang kaugnayan ni Elias kay Eliseo sa תַּחְתֶּיךָ
  choice: Itinalaga si Eliseo na humalili kay Elias bilang propeta.
  alternative: Maaaring idiin ang pagiging “kapalit mo” sa halip na ang kronolohikal na paghalili.
  rationale: Ang “hahalili sa iyo” ay nagpapanatili sa ideya ng pagpapatuloy sa tungkulin nang hindi ipinahihiwatig na agad o sapilitang inalis si Elias. Gayunman, dahil maaari ring magpahiwatig ng pagpapalit ang Hebreo, pinanatili ang alternatibong diwa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga nakagawiang anyong Filipino ng mga pangalang Jehu, Nimsi, Eliseo, at Safat; pinanatili ang pangalang-lugar na Abel-mehola. Iniwasan ang sobrang literal ngunit di-likas na “sa ilalim mo” para sa תַּחְתֶּיךָ.
