  naturalness: Marangal at likas ang pangungusap sa modernong Filipino. Ang pagdaragdag ng 'ng langis' ay karaniwang natural na paraan upang malinaw na ipahayag ang pandiwang ritwal na 'pahiran' sa kontekstong biblikal.
  terminology: Ang mga pangalang Jehu, Nimsi, Eliseo, Safat, at Abel-mehola ay magkakatugma at katanggap-tanggap na mga anyong Filipino. Ang 'propeta' at 'hahalili sa iyo' ay angkop; pinananatili ng talababa ang posibilidad ng mas matinding diwa ng pagpapalit.
