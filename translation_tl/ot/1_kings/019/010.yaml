  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: tl
  text: At sinabi niya, “Lubos akong naging masigasig para kay Yahweh, ang Diyos ng mga hukbo, sapagkat tinalikuran ng mga Israelita[a] ang iyong tipan, giniba nila ang iyong mga altar, at pinatay nila sa tabak ang iyong mga propeta. Ako na lamang ang natira, at hinahanap nila ako upang patayin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Lubos akong nag-alab sa malasakit
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapatingkad sa tindi ng damdamin at pagkilos. Ipinahahayag ng parirala ang masidhing katapatan ni Elias para kay Yahweh nang hindi ipinahihiwatig ang inggit na maaaring idulot ng literal na “nagselos.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” ayon sa mismong Hebreong teksto.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: ang Diyos ng mga hukbo
  rationale: Pinananatili ang konkretong kahulugan ng צְבָאוֹת bilang mga hukbo o kalipunan; hindi ito pinapalitan ng ibang titulong gaya ng “Makapangyarihan sa lahat.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng masidhing malasakit ni Elias; ang “sapagkat” ay malinaw at angkop sa marangal na salaysay.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: tinalikuran ... ang iyong tipan
  rationale: Ang “tinalikuran” ay natural sa Filipino at nagpapanatili sa bigat ng pag-abandona sa tipan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Ang literal na “mga anak na lalaki ni Israel” ay isang kolektibong katawagan sa bayang Israel; “mga Israelita” ang likas at saklaw na salin sa modernong Filipino.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: giniba nila ang iyong mga altar
  rationale: Tumpak na ipinahahayag ng “giniba” ang pagwasak o pagpapabagsak ng mga altar.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: pinatay nila sa tabak ang iyong mga propeta
  rationale: Pinananatili ang tahasang karahasan at ang tabak bilang ginamit na kasangkapan.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Ako na lamang ang natira
  rationale: Natural na naipapahayag sa Filipino ang diin sa pag-iisa ni Elias.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: pinaghahanap nila ako upang patayin
  rationale: Sa konteksto, ang paghahanap sa נֶפֶשׁ upang kunin ito ay pagtatangkang pumatay. Ang salin ay malinaw at idiomatiko habang pinananatili ang buong layunin ng parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton bilang personal na pangalang tipan; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng masidhing קנא para kay Yahweh
  choice: nag-alab sa malasakit
  alternative: nagselos; naging lubhang masigasig
  rationale: Saklaw ng ugat ang selos o sigasig na kaugnay ng eksklusibong katapatan. Iniiwasan ng napiling parirala ang karaniwang diwang inggit ng “selos” ngunit pinananatili ang masidhing covenantal na malasakit.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “altar,” “tipan,” at “propeta” bilang karaniwan at matatag na bokabularyong biblikal. Ang tindi ng Hebreong konstruksyon ay ipinahayag sa “Lubos” at “nag-alab sa malasakit.”
