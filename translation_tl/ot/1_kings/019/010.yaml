revisions:
- from: At sinabi niya, “Lubos akong nag-alab sa malasakit para kay Yahweh, ang Diyos ng mga hukbo, sapagkat tinalikuran ng mga Israelita[a] ang iyong tipan, giniba nila ang iyong mga altar, at pinatay nila sa tabak ang iyong mga propeta. Ako na lamang ang natira, at pinaghahanap nila ako upang patayin.”
  to: At sinabi niya, “Lubos akong naging masigasig para kay Yahweh, ang Diyos ng mga hukbo, sapagkat tinalikuran ng mga Israelita[a] ang iyong tipan, giniba nila ang iyong mga altar, at pinatay nila sa tabak ang iyong mga propeta. Ako na lamang ang natira, at hinahanap nila ako upang patayin.”
  rationale: Pinalitan ang idyomang hindi gaanong likas na “nag-alab sa malasakit” ng “naging masigasig,” na mas malapit sa kahulugan at tindi ng Hebreong intensive construction nang hindi ipinapasok ang diwang inggit. Pinalitan din ang causative na “pinaghahanap” ng tuwirang “hinahanap,” habang pinananatili ang layuning patayin si Elias.
