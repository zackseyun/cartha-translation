  text: וַ/תִּשְׁלַ֤ח אִיזֶ֨בֶל֙ מַלְאָ֔ךְ אֶל אֵלִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה יַעֲשׂ֤וּ/ן אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִפ֔וּ/ן כִּֽי כָ/עֵ֤ת מָחָר֙ אָשִׂ֣ים אֶֽת נַפְשְׁ/ךָ֔ כְּ/נֶ֖פֶשׁ אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: tl
  text: Pagkatapos, nagpadala si Jezebel ng isang mensahero kay Elias upang sabihin, “Gawin nawa sa akin ng mga diyos[a] ang gayon, at higit pa, kung hindi ko gagawin ang buhay mo na tulad ng buhay ng isa sa kanila pagsapit ng ganitong oras bukas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Diyos.” Maaaring mangahulugang singular na “Diyos” o plural na “mga diyos” ang salitang Hebreo na אֱלֹהִים. Dito, mas angkop ang plural dahil plural ang mga pandiwang kaugnay nito at si Jezebel ang nagsasalita.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod ng pangyayari.
- source_word: מַלְאָךְ
  choice: mensahero
  rationale: Tao at sugo ng korte ang tinutukoy sa kontekstong ito, hindi isang makalangit na anghel.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Natural na panimula ito sa tuwirang pananalita sa Tagalog.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Gawin nawa sa akin ng mga diyos ang gayon at higit pa
  rationale: Isa itong nakaugaliang pormula ng panunumpa na humihiling ng kaparusahan kapag hindi natupad ang banta. Ang “sa akin” ay ipinahihiwatig ng idyoma, at nililinaw nito sa Tagalog kung sino ang tatanggap ng sumpa.
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Bagaman maaaring singular o plural ang anyo, plural ang kaugnay na mga pandiwa at ang nagsasalita ay si Jezebel; kaya mas malamang dito ang plural na kahulugan.
- source_word: כִּי
  choice: kung
  rationale: Sa pormula ng panunumpa, ipinapasok nito ang kondisyong kaugnay ng ipinatawag na sumpa.
- source_word: כָעֵת מָחָר
  choice: pagsapit ng ganitong oras bukas
  rationale: Ipinapahayag nito ang takdang oras sa susunod na araw at natural itong maunawaan bilang deadline ng banta.
- source_word: אָשִׂים אֶת נַפְשְׁךָ
  choice: hindi ko gawing ... ang buhay mo
  rationale: Pinananatili ang larawan ng Hebreo na gagawin ang buhay o sinapit ni Elias na katulad ng sa mga pinatay, sa halip na tahasang paikliin ito bilang “hindi kita papatayin.”
- source_word: נַפְשְׁךָ
  choice: ang buhay mo
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay ng tao, hindi partikular sa di-materyal na kaluluwa.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: tulad ng buhay ng isa sa kanila
  rationale: Pinananatili ang pag-uulit ng “buhay” at ang paghahambing sa sinapit ng isa sa mga pinatay.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa panunumpa ni Jezebel
  choice: 'plural: “mga diyos”'
  alternative: 'singular: “Diyos”'
  rationale: Sinusuportahan ng mga pandiwang plural at ng konteksto ni Jezebel ang plural, ngunit tunay na maaaring gamiting singular ang אֱלֹהִים; kaya inilalahad sa talababa ang alternatibo sa halip na itago ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Elias,” ang karaniwang anyong Tagalog ng pangalan. Pinanatili ang pormula ng panunumpa at ang pag-uulit ng “buhay” upang hindi mapawi ang anyo at tensiyon ng Hebreo.
