  to: Sinabi niya kay Jehoshafat, “Sasama ka ba sa akin sa labanan sa Ramot-gilead?” Sinabi ni Jehoshafat sa hari ng Israel, “Ako’y gaya mo; ang aking bayan ay gaya ng iyong bayan, at ang aking mga kabayo ay gaya ng iyong mga kabayo.”
