base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: tl
  text: Sinabi niya kay Jehoshafat, “Sasama ka ba sa akin sa labanan sa Ramot-gilead?” Sinabi ni Jehoshafat sa hari ng Israel, “Ako’y gaya mo; ang aking bayan ay gaya ng iyong bayan, at ang aking mga kabayo ay gaya ng iyong mga kabayo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Sasama ka ba sa akin
  rationale: Ang tuwirang tanong na may pandiwang הלך at אִתִּי ay likas na ipinapahayag sa Filipino bilang “Sasama ka ba sa akin,” nang hindi binabago ang diwa ng pagpunta kasama ng nagsasalita.
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Ipinahahayag nito ang layunin ng pagpunta—ang pagsabak sa digmaan—sa natural at dignified na modernong Tagalog.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Transliterasyon ng pangalang pook ayon sa tunog ng Hebreo; pinananatili ng gitling ang tambalang pangalan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng construct chain, na tiyak ang tinutukoy dahil sa konteksto.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Kung ano ako, gayon ka rin
  rationale: Pinananatili ang maikli at walang-pandiwang pahayag ng pagkakaisa at buong pakikiisa, sa paraang natural sa Tagalog.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: ang aking bayan ay gaya ng iyong bayan
  rationale: Isinasalin ang paghahambing nang malinaw habang pinananatili ang paralelismo ng Hebreo.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: ang aking mga kabayo ay gaya ng iyong mga kabayo
  rationale: Pinananatili ang konkretong salitang “mga kabayo” sa halip na ipakahulugang hukbong-kabalyerya o yamang militar.
theological_decisions:
- issue: Lakas ng pahayag ni Jehoshafat bilang pakikiisa
  choice: Pinanatili bilang pahayag ng pagkakatulad at pakikiisa
  alternative: Palawakin bilang tahasang pangako ng alyansang militar
  rationale: Ipinahihiwatig ng konteksto ang alyansa, ngunit ang Hebreo mismo ay isang maikli at walang-pandiwang pahayag; hindi dapat dagdagan ng tahasang pangakong wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “makipagdigma” para sa natural na daloy at pinanatili ang maikli, paralelong tugon ni Jehoshafat. Walang footnote dahil malinaw na naipapahayag sa pangunahing teksto ang tersong Hebreong konstruksyon.
