revisions:
- from: Ang hari ng Israel at si Jehoshafat na hari ng Juda ay nakaupo, bawat isa sa kani-kaniyang trono, at nakadamit, sa giikan sa pasukan ng pintuang-bayan ng Samaria. Samantala, ang lahat ng propeta ay naghahayag bilang mga propeta sa harap nila.
  to: Ang hari ng Israel at si Jehoshafat, na hari ng Juda, ay nakaupo, bawat isa sa kani-kaniyang trono, nakasuot ng mga damit, sa giikan sa pasukan ng pintuang-bayan ng Samaria, at ang lahat ng propeta ay nagpapahayag ng propesiya sa harap nila.
  rationale: Inayos ang idiomatikong Tagalog at ibinalik ang payak na pag-uugnay ng Hebreo. Pinanatili ang “mga damit” nang walang idinagdag na paglalarawang “maharlika,” at ginawang tuwirang gawaing propetiko ang pandiwa para sa מִתְנַבְּאִים.
