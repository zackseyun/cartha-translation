base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: tl
  text: Ang hari ng Israel at si Jehoshafat, na hari ng Juda, ay nakaupo, bawat isa sa kani-kaniyang trono, nakasuot ng mga damit, sa giikan sa pasukan ng pintuang-bayan ng Samaria, at ang lahat ng propeta ay nagpapahayag ng propesiya sa harap nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Ang hari ng Israel
  rationale: Ang וּ ay nag-uugnay sa naunang salaysay, ngunit hindi kailangan ng hiwalay na panandang diskurso sa natural na Tagalog sa simula ng talata.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: at si Jehoshafat na hari ng Juda
  rationale: Pinananatili ang pangalan at ang pamagat na nakalapat dito; natural sa Tagalog ang pang-ugnay na “na.”
- source_word: יֹשְׁבִים
  choice: ay nakaupo
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na kalagayan o posisyon sa tagpo.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: bawat isa sa kani-kaniyang trono
  rationale: Distributibo ang אִישׁ dito, at malinaw sa kontekstong maharlika na “trono” ang כִּסֵּא.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: at nakadamit
  rationale: Literal na tumutukoy sa pagiging nakasuot ng mga damit; hindi idinagdag ang “maharlika” sapagkat hindi iyon tahasang nasa Hebreo.
- source_word: בְּגֹרֶן
  choice: sa giikan
  rationale: Ang גֹּרֶן ay lugar na pinaggigiikan; “giikan” ang maikli at likas na katumbas sa Tagalog.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: sa pasukan ng pintuang-bayan ng Samaria
  rationale: Pinananatili ang ugnayan ng pasukan, pintuang-bayan, at Samaria, habang nililinaw na tarangkahang panlungsod ang tinutukoy.
- source_word: וְכָל הַנְּבִיאִים
  choice: Samantala, ang lahat ng propeta
  rationale: Pinananatili ang “lahat”; ipinahihiwatig ng “Samantala” ang kasabay na kilos sa tagpo nang natural sa Tagalog.
- source_word: מִתְנַבְּאִים
  choice: ay naghahayag bilang mga propeta
  rationale: Pinananatili ang nagpapatuloy na gawaing propetiko nang hindi ipinapalagay na totoo o mula sa Diyos ang nilalaman ng kanilang pahayag.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Direkta at natural na katumbas na nagsasaad na nagaganap ang gawain sa presensiya ng dalawang hari.
theological_decisions:
- issue: Katayuan ng mga pahayag ng mga propeta
  choice: naghahayag bilang mga propeta
  alternative: nanghuhula
  rationale: Tinatawag silang mga propeta ng teksto at inilalarawan ang kanilang gawain, ngunit hindi pa rito pinagtitibay ang katotohanan o banal na pinagmulan ng kanilang sinasabi. Iniiwasan din ng “nanghuhula” ang modernong diwang maaaring magpahiwatig lamang ng panghuhula sa hinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pintuang-bayan” para sa tarangkahang panlungsod at “giikan” para sa tradisyonal na lugar ng paggiik. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay upang maging madaling basahin nang hindi binabago ang ugnayan ng mga kilos.
