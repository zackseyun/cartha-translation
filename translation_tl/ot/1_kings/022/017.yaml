- from: At sinabi niya, “Nakita ko ang buong Israel na nakakalat sa mga bundok, gaya ng mga tupang walang pastol. At sinabi ni Yahweh, ‘Ang mga ito ay walang panginoon[a]. Bumalik nawa ang bawat lalaki sa kanyang bahay nang payapa[b].’”
  to: At sinabi niya, “Nakita ko ang buong Israel na nakakalat sa mga bundok, gaya ng mga tupang walang pastol. At sinabi ni Yahweh, ‘Ang mga ito ay walang panginoon[a]. Bumalik ang bawat lalaki sa kanyang bahay nang mapayapa[b].’”
