source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: tl
  text: At sinabi niya, “Nakita ko ang buong Israel na nakakalat sa mga bundok, gaya ng mga tupang walang pastol. At sinabi ni Yahweh, ‘Ang mga ito ay walang panginoon[a]. Bumalik ang bawat lalaki sa kanyang bahay nang mapayapa[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang mga panginoon”; maramihan ang anyo ng salitang Hebreo, ngunit sa konteksto ay tumutukoy ito sa kawalan ng namumuno sa Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “bumalik ang bawat isa sa kanyang bahay nang mapayapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: nakakalat
  rationale: Ipinahihiwatig ng pandiwaring Hebreo ang pagiging hiwa-hiwalay o nakakalat. Likas sa modernong Tagalog ang “nakakalat” at pinananatili nito ang larawan ng hukbong nawalan ng namumuno.
- source_word: אֶל הֶהָרִים
  choice: sa mga bundok
  rationale: Bagaman madalas na nangangahulugang patungo ang אֶל, lokatibo ang diwa nito rito kasunod ng paglalarawan sa pagkakalat.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: gaya ng mga tupang walang pastol
  rationale: Tuwirang pinananatili ang malinaw at pamilyar na paghahambing sa isang kawan na walang pastol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֲדֹנִים
  choice: panginoon
  rationale: Ang salita ay nasa anyong maramihan ngunit tumutukoy sa kapangyarihang namumuno; sa konteksto, ang pinakapayak na reperensiya ay ang haring mamumuno sa Israel. Ang “panginoon” ay mas malapit sa leksikal na diwa kaysa sa mas mapagpaliwanag na “pinuno.”
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Bumalik nawa ang bawat lalaki sa kanyang bahay
  rationale: Ipinakikita ng “nawa” ang jussive o pahintulot/utos sa pahayag, samantalang pinananatili ng “bawat lalaki” ang panlalaking distributibong אִישׁ.
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Natural itong Tagalog para sa pagbalik “sa kapayapaan” at pinananatili ang diwa ng ligtas at walang laban na pag-uwi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Bilang at diwa ng אֲדֹנִים
  choice: walang panginoon
  alternative: walang mga panginoon / walang pinuno
  rationale: Maramihan ang anyong Hebreo, ngunit maaaring kolektibo ang diwa at sa konteksto ay tumutukoy sa pagkawala ng namumunong hari. Pinananatili sa talababa ang tunay na posibilidad ng literal na maramihan.
- issue: Panlalaking distributibong אִישׁ
  choice: bawat lalaki
  alternative: bawat isa
  rationale: Tahasang panlalaki ang pangngalang Hebreo sa konteksto ng hukbo, kaya hindi ito ginawang neutral sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang imaheng pastoral, ang personal na pangalang Yahweh, at ang tensiyon sa maramihang anyo ng אֲדֹנִים sa pamamagitan ng talababa.
