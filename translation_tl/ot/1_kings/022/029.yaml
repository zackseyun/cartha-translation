translation_notes:
  register: Modernong, payak, at marangal na Filipino. Pinanatili ang pagtukoy sa pinuno ng Israel sa pamamagitan ng titulo, samantalang pinangalanan si Jehosafat gaya ng nasa Hebreo. Walang talababa dahil walang kailangang variant o mahalagang kalabuan na dapat ipaliwanag sa talatang ito.
