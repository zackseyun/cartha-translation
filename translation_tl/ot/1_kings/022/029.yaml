base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/029.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: tl
  text: Kaya umakyat sa Ramot-Gilead ang hari ng Israel at si Jehosafat na hari ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: pumunta
  rationale: Karaniwang nangangahulugang ‘umakyat’ o ‘pumunta pataas’ ang עלה. Sa makabagong Tagalog, ang literal na ‘umakyat’ patungo sa isang lungsod ay maaaring magpahiwatig ng pisikal na pag-akyat na hindi siyang pangunahing diin dito; pinananatili ng ‘pumunta’ ang kilos patungo sa destinasyon nang hindi dinaragdagan ang teksto ng tiyak na ideyang militar.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Ginagamit ng Hebreo ang titulo sa halip na ang personal na pangalang Ahab; pinananatili ito upang masunod ang paraan ng pagkukuwento ng teksto.
- source_word: וִיהוֹשָׁפָט
  choice: at si Jehosafat
  rationale: Isinasalin ang pang-ugnay at ginagamit ang karaniwang anyong Filipino ng personal na pangalan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: na hari ng Juda
  rationale: Ang titulo ay appositive kay Jehosafat. Likas sa Tagalog ang ‘si Jehosafat na hari ng Juda,’ at malinaw nitong ipinakikilalang siya ang hari ng Juda.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Ginagamit ang nakaugaliang anyong biblikal sa Filipino; ipinakikita ng gitling na iisang tambalang pangalan ng lugar ito.
