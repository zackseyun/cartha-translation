  text: יְהוֹשָׁפָ֡ט עשר אֳנִיּ֨וֹת תַּרְשִׁ֜ישׁ לָ/לֶ֧כֶת אוֹפִ֛ירָ/ה לַ/זָּהָ֖ב וְ/לֹ֣א הָלָ֑ךְ כִּֽי נשברה אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: tl
  text: Nagpagawa si Jehoshafat ng mga barkong Tarsis[a] upang maglayag patungong Ofir para kumuha ng ginto. Ngunit hindi nakapaglayag ang mga iyon, sapagkat nawasak ang mga barko sa Ezion-geber.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga barko ng Tarsis.” Maaaring tumukoy ang katawagang ito sa isang uri ng malalaking barkong pandagat, hindi kinakailangang sa mga barkong literal na mula sa Tarsis.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang “nawasak”; maaaring ituring na isang kabuuan ang pangkat ng mga barko o ang plota.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: nagpagawa
  rationale: Sa konteksto, ang anyong ito sa tekstong katinig ay nauunawaang pandiwang ‘gumawa/maghanda.’ Ang ‘nagpagawa’ ay likas sa Filipino para sa isang haring nagpagawa ng mga sasakyang-dagat, nang hindi ipinahihiwatig na siya mismo ang nagtayo ng mga iyon.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: mga barkong Tarsis
  rationale: Pinananatili nito ang ugnayang konstruktibo ng Hebreo at ang tradisyonal na katawagan, habang inilalagay sa talababa ang tunay na posibilidad na tumutukoy ito sa isang uri ng malalaking sasakyang pandagat.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: upang maglayag patungong Ofir
  rationale: Ipinahahayag ng pawatas at ng panandang patutunguhan ang layunin at destinasyon. Mas natural sa kontekstong pandagat ang ‘maglayag’ kaysa sa pangkalahatang ‘pumunta.’
- source_word: לַזָּהָב
  choice: para kumuha ng ginto
  rationale: Ang ל ay nagpapahiwatig dito ng layunin ng paglalakbay—ang pagkuha ng ginto. Ginagawang malinaw ng salin ang ipinahihiwatig na layunin.
- source_word: וְלֹא הָלָךְ
  choice: ngunit hindi nakapaglayag ang mga iyon
  rationale: Bagaman isahan ang pandiwa sa Hebreo, ang tinutukoy sa konteksto ay ang pangkat ng mga barko. Ang ‘hindi nakapaglayag’ ay natural at nagpapakitang hindi natuloy ang nilalayong paglalakbay.
- source_word: נשברה
  choice: nawasak
  rationale: Ang Niphal ng שבר ay nangangahulugang nabasag o nasira. Sa konteksto ng mga barko, malinaw at idiomatiko ang ‘nawasak.’
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: sa Ezion-geber
  rationale: Ang ב ay tumutukoy sa lokasyon ng pagkawasak; natural sa Filipino ang ‘sa’ para sa isang daungan o pook.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘barko’ at ‘maglayag’ bilang karaniwang katawagang pandagat. Pinanatili ang mga pangalang Tarsis, Ofir, at Ezion-geber sa transliterasyon, at hindi inalis ang kolektibong-isahang anyo ng Hebreo kundi ipinaliwanag ito sa talababa.
