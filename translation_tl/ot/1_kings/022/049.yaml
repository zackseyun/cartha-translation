  source_fidelity: Tapat ang salin sa ipinapalagay na pandiwang “gumawa/naghanda” sa konteksto ng tekstong katinig at sa paralelong salaysay. Napananatili ang layunin ng paglalayag patungong Ofir para sa ginto, ang kolektibong tinutukoy ng isahang pandiwang “hindi nagpunta,” at ang pagkasira ng mga barko sa Ezion-geber.
