  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: tl
  text: At sinabi ni Micaias, “Makikita mo sa araw na iyon, kapag pumasok ka sa pinakaloob na silid[a] upang magtago.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang silid sa loob,” o “mula silid sa silid.” Literal na inuulit sa Hebreo ang salitang “silid” at maaaring ipinahihiwatig ang pag-urong nang higit na paloob upang magtago.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang pag-usad ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi labis na binibigyang-kahulugan ang pagkakasunod-sunod.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong mga saling Filipino at sa tradisyong biblikal sa Tagalog.
- source_word: הִנְּךָ רֹאֶה
  choice: Makikita mo
  rationale: Ang הִנְּךָ kasama ng participle at ng pariralang tumutukoy sa hinaharap ay may prediktibong diwa. Likas sa Filipino ang payak na panghinaharap; hindi na kailangang isalin nang hiwalay ang pantawag-pansin.
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw na iyon
  rationale: Likas at tuwirang katumbas ng pormulang temporal sa Hebreo.
- source_word: אֲשֶׁר תָּבֹא
  choice: kapag pumasok ka
  rationale: Ipinahahayag ng אֲשֶׁר dito ang kalagayang temporal, at ang בוא ay angkop na isaling 'pumasok' dahil silid ang patutunguhan.
- source_word: חֶדֶר בְּחֶדֶר
  choice: sa pinakaloob na silid
  rationale: Ang literal na pag-uulit ng 'silid' ay nagpapahiwatig ng pag-urong nang higit na paloob. Ang 'pinakaloob na silid' ay natural sa Filipino, habang ang ibang posibleng pagbasa ay pinananatili sa talababa.
- source_word: לְהֵחָבֵה
  choice: upang magtago
  rationale: Malinaw na infinitive of purpose; natural at maikli sa Filipino ang 'upang magtago.'
