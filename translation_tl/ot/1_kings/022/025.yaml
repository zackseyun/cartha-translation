translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang lipas na pantawag na gaya ng “Narito,” sapagkat naipahahayag na ng panghinaharap na “Makikita mo” ang prediktibong diin. Inilagay ang marker [a] kaagad pagkatapos ng pangalang Micaias upang tumugma sa ibinigay na konsultasyong teksto, bagaman ang talababa ay tumatalakay sa pariralang “pinakaloob na silid.”
