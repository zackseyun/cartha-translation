base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: tl
  text: Kaya dumating siya sa hari, at sinabi sa kanya ng hari, “Micaias, pupunta ba tayo sa Ramot-Gilead upang makipagdigma, o hindi tayo tutuloy?” Sinabi niya sa kanya, “Umakyat ka at magtagumpay. Ibibigay iyon ni Yahweh sa kamay ng hari.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na may kabalintunaan o panunuya ang sagot ni Micaias ayon sa konteksto, ngunit hindi ito tahasang minamarkahan sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Kaya lumapit siya
  rationale: Ipinagpapatuloy ng wayyiqtol ang sunod-sunod na pangyayari. Ang “lumapit” ay likas sa Tagalog para sa pagharap niya sa hari sa tagpong ito.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog na tradisyong biblikal habang nananatiling madaling makilala.
- source_word: הֲנֵלֵךְ
  choice: pupunta ba tayo
  rationale: Ang unang panauhang maramihang imperfect na patanong ay humihingi ng pasiya o payo; malinaw at natural itong naipapahayag ng “pupunta ba tayo.”
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Malapit na transliterasyon ito ng Hebreong pangalan ng lugar at ang gitling ay nagpapakitang iisang tambalang pangalan ito.
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Ipinahahayag ng parirala ang layunin ng pagpunta. Ang pandiwang Tagalog ay natural at malinaw sa kontekstong militar.
- source_word: אִם נֶחְדָּל
  choice: o hindi na tayo tutuloy
  rationale: Ang חדל ay tumutukoy sa pagpigil o hindi pagpapatuloy. Inihahatid ng salin ang praktikal na alternatibo sa kampanya nang natural sa modernong Tagalog.
- source_word: עֲלֵה
  choice: Umakyat kayo
  rationale: Pinananatili ang karaniwang Hebreong larawan ng pag-akyat sa isang lugar o kampanyang militar. Ang “kayo” ay magalang na pagtukoy sa hari, bagaman isahan ang Hebreong utos.
- source_word: וְהַצְלַח
  choice: at magtagumpay
  rationale: Sa kontekstong ito, ang Hiphil ng צלח ay nagsasaad ng pagtatagumpay sa binabalak na pagsalakay.
- source_word: וְנָתַן יְהוָה
  choice: Ibibigay iyon ni Yahweh
  rationale: Ang perfect na kasunod ng mga utos ay maaaring magpahayag ng tiyak na magiging resulta. Ang “iyon” ay tumutukoy sa di-binanggit ngunit nauunawaang layon, ang Ramot-gilead.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: sa kamay ng hari
  rationale: Pinananatili ang Hebreong idyoma ng paglalagay sa kamay, na nagpapahiwatig ng pagbibigay sa kapangyarihan o pamamahala ng hari.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tono ng unang sagot ni Micaias
  choice: Tuwirang isalin ang mga salita at ipaliwanag sa talababa ang malamang na kabalintunaan
  alternative: Lagyan sa pangunahing teksto ng tahasang panunuya o sarkastikong pananalita
  rationale: Hindi tahasang minamarkahan ng bokabularyo o balarila ng Hebreo ang panunuya, bagaman malakas itong ipinahihiwatig ng mas malawak na konteksto. Pinananatili ng salin ang naratibo at teolohikal na tensiyon.
- issue: Bilang ng panghalip sa utos sa hari
  choice: kayo
  alternative: ikaw
  rationale: Isahan ang Hebreong utos, ngunit karaniwang ginagamit sa modernong Filipino ang “kayo” bilang magalang na pagtukoy sa isang hari. Hindi nito ipinahihiwatig na marami ang tuwirang kinakausap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ilang larawang Hebreo—“umakyat” at “sa kamay ng hari”—sapagkat malinaw pa rin ang mga ito sa konteksto. Ginamit ang magalang na “kayo” sa pakikipag-usap sa hari.
