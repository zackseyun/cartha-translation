revisions:
- from: Kaya lumapit siya sa hari, at sinabi sa kanya ng hari, “Micaias, pupunta ba tayo sa Ramot-gilead upang makipagdigma, o hindi na tayo tutuloy?” Sumagot siya, “Umakyat kayo at magtagumpay! Ibibigay iyon ni Yahweh sa kamay ng hari.”[a]
  to: Kaya dumating siya sa hari, at sinabi sa kanya ng hari, “Micaias, pupunta ba tayo sa Ramot-Gilead upang makipagdigma, o hindi tayo tutuloy?” Sinabi niya sa kanya, “Umakyat ka at magtagumpay. Ibibigay iyon ni Yahweh sa kamay ng hari.”[a]
  rationale: Inayos ang isahan ng utos upang tumugma sa Hebreo, pinasimple ang pandiwang nagsasaad ng pagdating, at ginawang walang tahasang emosyonal na marka ang tugon upang mapanatili ang di-tiyak ngunit malamang na ironikong tono. Pinanatili ang talababa at ang angkla nito pagkatapos ng buong tugon, kung saan ito pinakamalinaw na tumutukoy.
