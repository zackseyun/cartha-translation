  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: tl
  text: Pagkatapos, tinawag ng hari ng Israel ang isang opisyal[a] at sinabi, “Sunduin mo agad si Micaias na anak ni Imla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na saris ay maaaring mangahulugang “eunuko” o, sa mas pangkalahatang diwa, “opisyal ng palasyo.” Malamang na ang mas malawak na kahulugan ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Sa kontekstong pasalaysay, ang קרא ay tumutukoy sa pagtawag sa isang taong naroroon upang utusan; natural at tuwiran ang “tinawag” sa Filipino.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng pariralang konstruktong tumutukoy sa nagsasalita.
- source_word: אֶל סָרִיס אֶחָד
  choice: ang isang opisyal
  rationale: Maaaring literal na “eunuko” ang סָרִיס, ngunit maaari rin itong tumukoy sa isang opisyal ng palasyo. Ang tungkuling administratibo ang pinakamalinaw sa kontekstong ito, habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: מַהֲרָה
  choice: Sunduin mo agad
  rationale: Ipinahahayag ng מַהֲרָה ang agarang pagkilos. Elliptical ang Hebreo at walang tahasang pandiwa para sa pagkuha kay Micaias; natural na ipinahahayag sa Filipino ang ipinag-uutos na kilos bilang “sunduin mo,” kasama ang “agad” para sa pagmamadali.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Filipino, sa halip na isang di-pamilyar na tuwirang transliterasyon.
- source_word: בֶן יִמְלָה
  choice: anak ni Imla
  rationale: Natural at tapat na salin sa Filipino ng patronimikong parirala.
