base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Ahab, ang lahat ng ginawa niya, ang bahay na may garing na itinayo niya[a], at ang lahat ng lunsod na itinayo niya—hindi ba nakasulat ang mga ito sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “bahay ng garing.” Malamang na tumutukoy ito sa isang maharlikang gusaling pinalamutian o nilagyan ng garing, hindi sa isang gusaling buong yari sa garing.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat ng mga Kasaysayan ng mga Hari ng Israel” ay isang maharlikang talaang binabanggit bilang sanggunian sa Mga Hari; hindi ito kinakailangang tumukoy sa biblikal na aklat ng Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Ang iba pang mga ginawa ni Ahab
  rationale: Sa pormulang pangkasaysayan ng Mga Hari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o pangyayari tungkol sa paghahari, hindi lamang sa mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng ginawa niya
  rationale: Pinananatili nito ang malawak at payak na diwa ng עָשָׂה at ang pag-uulit sa Hebreo.
- source_word: וּבֵית הַשֵּׁן
  choice: ang bahay na pinalamutian ng garing
  rationale: Literal itong “bahay ng garing,” ngunit malamang na tumutukoy sa isang maharlikang gusaling nilagyan o pinalamutian ng garing, hindi sa gusaling buong yari sa garing. Nililinaw ng talababa ang literal na anyo at nananatiling bukas ang antas ng pagkakagamit ng garing.
- source_word: אֲשֶׁר בָּנָה
  choice: na itinayo niya
  rationale: Karaniwang salin ng בָּנָה sa konteksto ng gusali; malinaw at natural sa Tagalog.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: at ang lahat ng lunsod na itinayo niya
  rationale: Ang עָרִים ay karaniwang “mga lunsod.” Hindi ito pinakitid sa “mga bayang nakukutaan,” na hindi tahasang sinasabi ng teksto.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga ito
  rationale: Inililipat nito ang retorikal na tanong na umaasang sang-ayon ang sagot, habang pinananatili ang literal na diwa ng “nakasulat.”
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: sa Aklat ng mga Kasaysayan
  rationale: Ang “sa Aklat” ay natural na katumbas ng idyomang tumutukoy sa nakasulat na talaan. Ang “mga Kasaysayan” ay mauunawaang pamagat ng maharlikang rekord, at ipinapaliwanag sa talababa na hindi ito kinakailangang tumukoy sa kanonikal na Mga Cronica.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Dito ang לְ ay nagpapakita ng kaugnayan sa mga hari ng Israel; natural sa Tagalog ang pariralang “ng mga Hari ng Israel.”
