translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na ayos ng Hebreo at ang pangwakas na retorikal na tanong, ngunit gumamit ng likas na sintaks sa Tagalog. Ginamit ang “lunsod” sa halip na mas teknikal o makitid na katawagan.
