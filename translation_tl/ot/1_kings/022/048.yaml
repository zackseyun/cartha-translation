  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: tl
  text: At walang hari sa Edom; isang itinalagang opisyal ang hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: At walang hari noon
  rationale: Pinananatili ng “At” ang pang-ugnay na ו, at natural na ipinapahayag ng “walang hari noon” ang kawalan sa konteksto ng salaysay.
- source_word: בֶּ/אֱדוֹם
  choice: sa Edom
  rationale: Tuwirang lokatibong salin ito ng pang-ukol ב na kasama ng pangalang Edom.
- source_word: נִצָּב
  choice: kinatawan
  rationale: Ang participle mula sa נצב ay tumutukoy sa isang taong inilagay o itinalaga sa katungkulan. Sa kontekstong pampolitika, ipinahihiwatig nito ang isang opisyal na kumakatawan sa nakatataas na kapangyarihan, hindi isang nagsasariling namamanang hari.
- source_word: מֶלֶךְ
  choice: ang nagsilbing hari
  rationale: Predikatibo ang huling מֶלֶךְ. Natural na ipinakikita ng “nagsilbing hari” na ginampanan ng itinalagang opisyal ang tungkulin ng hari nang hindi ipinapalagay na siya ay isang nagsasariling dinastikong hari.
