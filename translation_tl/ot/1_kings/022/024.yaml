  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: tl
  text: Pagkatapos, lumapit si Zedekias na anak ni Quenaana, sinaktan si Micaias sa pisngi, at sinabi, “Saang daan dumaan mula sa akin ang Espiritu ni Yahweh upang magsalita sa iyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Likas at tuwirang ipinahahayag ang pisikal na paglapit sa isang tagpong may paghaharap.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekias na anak ni Quenaana
  rationale: Ginamit ang mga anyong pangalang madaling bigkasin sa Filipino at pinanatili ang Hebreong patronimiko.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: sinaktan si Micaias sa pisngi
  rationale: Ang נכה ay malawak na pandiwang nangangahulugang humampas o manakit; hindi tinukoy ng salin kung sampal ang paraan, samantalang malinaw na pinanatili ang pisngi bilang bahagi ng katawan.
- source_word: אֵי זֶה
  choice: Saang daan
  rationale: Ipinahahayag nito ang tanong tungkol sa dinaanan at pinananatili ang mapanuyang puwersa ng hamon ni Zedekias.
- source_word: עָבַר
  choice: dumaan
  rationale: Tumpak na inilalarawan ang pagdaan o paglipat na ipinapalagay sa mapanuyang tanong.
- source_word: רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  rationale: Sa konteksto ng propetikong pagtatalo, tumutukoy ito sa banal na Espiritung nagbibigay ng pahayag; ang malaking titik ay nagpapakita ng personal at banal na pagtukoy nang walang dagdag na doktrina.
- source_word: מֵאִתִּי
  choice: mula sa akin
  rationale: Tuwirang pinananatili ang ideya ng pinagmulan o pag-alis mula kay Zedekias.
- source_word: לְדַבֵּר אֹתָךְ
  choice: upang magsalita sa iyo
  rationale: Natural na Filipino para sa layunin ng pagdaan ng Espiritu at sa direksiyon ng pagsasalita kay Micaias.
theological_decisions:
- issue: Pagbibigay-kahulugan at kapitalisasyon ng רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  alternative: ang espiritu ni Yahweh
  rationale: Ang propetikong konteksto ay pabor sa pagtukoy sa banal na Espiritu, ngunit hindi dinaragdagan ng salin ang mapanuyang pahayag ni Zedekias o pinagtitibay ang kaniyang pag-aangkin.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at mapanuyang tanong. Walang talababa sapagkat sapat na naipahahayag ng “Saang daan” ang tunay na saklaw ng אֵי זֶה nang hindi kailangang magbigay ng halos magkaparehong alternatibo.
