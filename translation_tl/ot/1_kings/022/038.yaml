  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: tl
  text: Hinugasan nila ang karwahe sa tipunan ng tubig sa Samaria. Dinilaan ng mga aso ang dugo niya, at naghugas doon ang mga babaeng bayaran[a], ayon sa salitang sinabi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naligo roon” o “naghugas ng kanilang sarili.” Hindi tahasang sinasabi sa Hebreo kung ano ang hinugasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  choice: Hinugasan nila
  rationale: Bagaman ikatlong panauhang panlalaking isahan ang anyong Hebreo, hindi tinukoy ang gumagawa. Ang di-tiyak na maramihang “nila” ay natural sa Tagalog at hindi nagpapakilala ng isang tiyak na tao.
- source_word: הָרֶכֶב
  choice: ang karwahe
  rationale: Tumutukoy ito sa isahan at tiyak na karwaheng pandigma ni Ahab na nadungisan ng dugo.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: sa tipunan ng tubig sa Samaria
  rationale: Ang בְּרֵכָה ay isang pool o imbakan ng tubig. Ang “tipunan ng tubig” ay malinaw at likas sa modernong Tagalog, at ang “sa” ay angkop sa lokasyon ng paghuhugas.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים
  choice: Dinilaan ng mga aso
  rationale: Tumpak at matingkad na inilalarawan ng “dinilaan” ang kilos ng mga aso; natural din dito ang pokus sa dugong dinilaan.
- source_word: דָּמוֹ
  choice: ang dugo niya
  rationale: Pinananatili ang hulaping panghalip na tumutukoy kay Ahab.
- source_word: וְהַזֹּנוֹת
  choice: ang mga babaeng bayaran
  rationale: Ang זוֹנָה ay babaeng nagbebenta ng serbisyong seksuwal. Ang “babaeng bayaran” ay kasalukuyan, dignified, at madaling maunawaan nang hindi gumagamit ng arkaikong katawagan.
- source_word: רָחָצוּ
  choice: naghugas doon
  rationale: Maaaring mangahulugang naghugas o naligo ang pandiwa, at walang tahasang layon sa Hebreo. Pinananatili ng salin ang pagkabitin ng pahayag sa halip na tukuyin kung ano ang hinugasan.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: ayon sa salitang sinabi ni Yahweh
  rationale: Pinananatili ang pormulang nagpapahayag ng katuparan ng naunang salita at tahasang isinasalin ang banal na pangalang יְהוָה bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng וְהַזֹּנוֹת רָחָצוּ
  choice: naghugas doon ang mga babaeng bayaran
  alternative: naligo roon ang mga babaeng bayaran / naghugas ng kanilang sarili ang mga babaeng bayaran
  rationale: Malinaw na ang mga babaeng bayaran ang simuno, ngunit walang tahasang layon ang pandiwa. Hindi nilulutas ng pangunahing teksto ang tunay na kalabuan; inilalahad sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Iniwasan ang arkaikong bokabularyo at pinanatili ang maikli at bahagyang matalinghagang anyo ng Hebreo, lalo na sa sugnay tungkol sa mga babaeng bayaran.
