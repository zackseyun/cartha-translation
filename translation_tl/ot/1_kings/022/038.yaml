  source_fidelity: 'Tumpak na naisasalin ang lahat ng pangunahing sangkap ng Hebreo: ang di-tinukoy na tagapaghugas, ang tiyak na karwahe, ang tipunan ng tubig ng Samaria, ang pagdila ng mga aso sa dugo ni Ahab, at ang hiwalay ngunit sadyang maigsi at malabong sugnay tungkol sa mga babaeng bayaran. Ang “naghugas doon” ay hindi nagdaragdag ng tahasang layon sa רָחָצוּ.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “tipunan ng tubig” ay bahagyang pormal ngunit malinaw na katumbas ng pool/imbakan ng tubig at angkop sa salaysay. Ang ayos na “Dinilaan ng mga aso ang dugo niya” ay likas.
  terminology: Ang “Yahweh” ay wastong katumbas ng יהוה ayon sa itinakdang gamit. Ang “mga babaeng bayaran” ay modernong, hindi-arkaiko, at sapat na tumpak na katumbas ng הַזֹּנוֹת. Pinananatili ng talababa ang leksikal na posibilidad ng “naligo” o reflexive na pagbasa nang hindi ito ipinipilit sa pangunahing teksto.
