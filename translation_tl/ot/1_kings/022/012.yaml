  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: tl
  text: 'At lahat ng propeta ay nagpapahayag din ng propesiya nang ganito: “Umakyat ka sa Ramot-gilead at magtagumpay[a], at ibibigay ni Yahweh ang Ramot-gilead sa kamay ng hari.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at maging matagumpay.”
    reason: Pinahihintulutan ng צלח ang magkalapit na pagpapahayag na “magtagumpay” o “maging matagumpay”; hindi binabago ng alternatibo ang ipinangakong matagumpay na kinalabasan.
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: At ... ng lahat ng propeta
  rationale: Pinananatili ang pang-ugnay, ang kabuuang saklaw ng כָּל, at ang tiyak na kolektibong paksa, habang gumagamit ng likas na ayos ng pangungusap sa Tagalog.
- source_word: נִבְּאִים כֵּן
  choice: ganito rin ang ipinopropesiya
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na gawain, at ang כֵּן ay tumutukoy sa paraan o nilalaman ng magkakatulad nilang pahayag. Ang “ganito” ay natural na naghahanda sa susunod na tuwirang sipi.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Sa natural na Tagalog, sapat na ang tutuldok upang ipakilala ang tuwirang sinabi; maiiwasan nito ang mabigat at paulit-ulit na “na sinasabi.”
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang literal na diwa ng pandiwang עלה at ang isahang anyo ng pautos, nang hindi tahasang idinaragdag ang ideya ng pagsalakay na ipinahihiwatig lamang ng konteksto.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Transliterasyon ng tambalang pangalan ng lugar na madaling makilala at hindi binabago ang anyo nito tungo sa isang paliwanag.
- source_word: וְ/הַצְלַח
  choice: at magtagumpay
  rationale: Sa kontekstong militar, ipinahahayag ng Hiphil imperative ng צלח ang matagumpay na kinalabasan. Maikli at natural ang “magtagumpay,” habang ang posibleng alternatibong anyo ay inilagay sa talababa.
- source_word: וְ/נָתַן
  choice: at ibibigay iyon
  rationale: Direktang pinananatili ang waw bilang “at.” Ang hinaharap na “ibibigay” ay angkop sa pangakong kasunod ng pautos; ang “iyon” ay likas na idinagdag sa Tagalog bilang pantukoy sa Ramot-gilead o sa tagumpay na nasa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: sa kamay ng hari
  rationale: Pinananatili ang malinaw na Hebreong idyoma ng paglalagay sa kapangyarihan o kontrol ng isang tao, pati ang titulong “hari” sa halip na palitan ito ng panghalip.
theological_decisions:
- issue: Paglalarawan sa pahayag ng mga propetang nasa eksena
  choice: ipinopropesiya
  alternative: sinasabi
  rationale: Pinananatili ang tahasang terminong נבא ng teksto nang hindi paunang hinahatulan sa mismong salin kung tunay o huwad ang kanilang pahayag; ang mas malawak na salaysay ang nagbibigay ng teolohikal na pagsusuri.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong maaaring magkubli sa pagkakaibang leksikal.
- issue: Ugnayan ng וְנָתַן sa naunang mga pautos
  choice: at ibibigay
  alternative: sapagkat ibibigay
  rationale: Pinananatili ng “at” ang payak na koordinasyon ng waw at hindi ipinipilit ang isang sanhiang pagbasa, bagaman maaaring maunawaan sa konteksto na ang pangako ang batayan ng utos.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ipinopropesiya” upang mapanatili ang teknikal na diwa ng נבא, “Umakyat ka” upang mapanatili ang isahang pautos, at “sa kamay ng hari” upang mapanatili ang kongkretong idyomang Hebreo.
