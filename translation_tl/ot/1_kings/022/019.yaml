  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: tl
  text: 'Pagkatapos ay sinabi niya, “Kaya pakinggan mo ang salita ni Yahweh: Nakita ko si Yahweh na nakaupo sa kanyang trono, at ang buong hukbo ng langit[a] ay nakatayo sa tabi niya[b], sa kanyang kanan at sa kanyang kaliwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lahat ng makalangit na hukbo” o “ang buong hukbo sa langit.”
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na Hebreo, “nakatayo sa ibabaw niya.” Sa kontekstong ito, malamang na ang ibig sabihin ay nakatayong naglilingkod sa tabi niya, gaya ng nililinaw ng “sa kanyang kanan at sa kanyang kaliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga o lohikal na paglipat mula sa naunang usapan, sa natural ngunit mariing paraan sa modernong Tagalog.
- source_word: שְׁמַע
  choice: pakinggan mo
  rationale: Isahang pautos ito na tuwirang nakatuon sa kausap; mas likas sa Tagalog ang “pakinggan mo” kaysa sa literal na “dinggin.”
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili nito ang kinikilalang pormulang propetiko at ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Payak na nag-uulat ito ng pangitain ni Micaias at natural na katumbas ng Hebreong perfect sa kontekstong pasalaysay.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: nakaupo sa kanyang trono
  rationale: Malinaw at tuwirang inilalarawan ang patuloy na pustura ni Yahweh bilang hari nang hindi dinaragdagan ang kahulugan ng pandiwa.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: ang buong hukbo ng langit
  rationale: Pinananatili ang malawak at kolektibong larawang maaaring tumukoy sa makalangit na korte o hukbo, nang hindi ito nililimitahan sa “mga anghel.”
- source_word: עֹמֵד עָלָיו
  choice: nakatayo sa tabi niya
  rationale: Sa tagpo ng silid-trono, ang parirala ay natural na tumutukoy sa pagtayo bilang mga lingkod sa kanyang tabi; sinusuportahan ito ng kasunod na “sa kanyang kanan at sa kanyang kaliwa.”
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: sa kanyang kanan at sa kanyang kaliwa
  rationale: Tuwirang pinananatili ang simetrikong ayos at malinaw itong mababasa sa modernong Tagalog.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה sa pangitain ng makalangit na trono
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang tuwirang nasa Hebreo; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng צְבָא הַשָּׁמַיִם
  choice: buong hukbo ng langit
  alternative: lahat ng anghel sa langit
  rationale: Hindi tahasang tinatawag ng talata na “mga anghel” ang pangkat. Pinananatili ng salin ang malawak na larawan ng makalangit na hukbo o korte at hindi nilulutas ang ontolohikal na saklaw nito.
- issue: Kahulugan ng עָלָיו sa tagpo ng trono
  choice: sa tabi niya
  alternative: sa ibabaw niya
  rationale: Ang kanan at kaliwa sa kasunod na parirala ay nagpapahiwatig ng mga nakatayong lingkod sa magkabilang tabi. Gayunman, itinatala sa talababa ang mas literal na posibilidad upang hindi maitago ang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “pakinggan mo” sa halip na mas makalumang “dinggin,” habang pinanatili ang solemne at propetikong himig. Ang “hukbo ng langit” ay sadyang hindi pinalitan ng “mga anghel” upang mapanatili ang lawak at tensiyon ng orihinal.
