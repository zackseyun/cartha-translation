  source_fidelity: 'Tumpak ang salin sa Hebreo: naipapahayag ang lohikal na “Kaya,” ang pautos na isahan na “pakinggan mo,” ang pangitain ni Micaias, ang trono, at ang makalangit na hukbo sa magkabilang panig ni Yahweh. Hindi nito pinapangalanang mga anghel ang “hukbo ng langit,” kaya napapanatili ang saklaw ng orihinal. Ang “sa tabi niya” ay angkop sa kontekstong inililinaw ng “sa kanyang kanan at sa kanyang kaliwa,” habang tapat na itinatala ng talababa ang mas literal na anyo ng Hebreo.'
