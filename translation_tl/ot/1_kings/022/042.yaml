base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: tl
  text: Tatlumpu't limang taong gulang si Jehosafat nang magsimula siyang maghari, at dalawampu't limang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Azuba, anak ni Silhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Isinalin sa karaniwang anyo ng pangalang biblikal sa modernong Tagalog sa halip na isalin ang kahulugan ng pangalan.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: Tatlumpu't limang taong gulang
  rationale: Ang literal na idyomang Hebreo na 'anak ng tatlumpu't limang taon' ay likas na ipinahayag bilang edad sa Tagalog.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng parirala ang panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: dalawampu't limang taon
  rationale: Tuwirang katumbas ng bilang at tagal ng paghahari.
- source_word: מָלַךְ
  choice: naghari siya
  rationale: Ang pandiwang מלך sa pormulang panghari ay natural at tumpak na katumbas ng 'maghari'.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin, gamit ang karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormulang pangkasaysayan sa malinaw at likas na modernong Tagalog.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Transliterasyon ng personal na pangalan ayon sa karaniwang bigkas at baybay sa Filipino.
- source_word: בַּת שִׁלְחִי
  choice: anak ni Silhi
  rationale: Sa konteksto ay malinaw na ina ni Jehosafat si Azuba kaya likas sa Tagalog ang 'anak ni'; ang Silhi ay transliterasyon ng personal na pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas basahin. Ginamit ang pormulang 'nang magsimula siyang maghari' upang tumpak na maipahayag ang regnal notice nang hindi nagiging salitang-salita ang Hebreong idyoma.
