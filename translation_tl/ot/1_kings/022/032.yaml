  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: tl
  text: At nang makita ng mga kumandante ng mga karwahe si Jehoshafat, sinabi nila, “Tiyak na siya ang hari ng Israel!” Kaya bumaling sila sa kanya[a] upang makipaglaban, ngunit humiyaw si Jehoshafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bumaling sila laban sa kanya” o “sumugod sila sa kanya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagliko patungo sa isang tao upang makipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: At nang makita
  rationale: Pinagsasama nito ang panandang pasalaysay at ang temporal na infinitibo sa isang natural na pambungad sa Tagalog, nang hindi gumagamit ng mabigat na “At nangyari.”
- source_word: שָׂרֵי הָרֶכֶב
  choice: mga kumandante ng mga karwahe
  rationale: Ang שָׂרֵי ay tumutukoy sa mga pinunong militar, at ang הָרֶכֶב ay sa mga karwahe o hukbong gumagamit ng mga ito.
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ipinahahayag dito ng אַךְ ang kanilang matibay ngunit maling pagkakakilanlan kay Jehoshafat, hindi isang pagtatakda na gaya ng “lamang.”
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: siya ang hari ng Israel
  rationale: Pinananatili ang panlalaking panghalip ng Hebreo at natural na tinutukoy si Jehoshafat, na napagkamalan nilang hari ng Israel.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: bumaling sila sa kanya
  rationale: Ipinapakita ng “bumaling” ang pagbabago ng direksiyon patungo kay Jehoshafat; nililinaw ng kasunod na “upang makipaglaban” ang masamang layunin nang hindi labis na pinapakahulugan ang pandiwa.
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Malapit ito sa malawak na kahulugan ng Niphal infinitive ng לחם—ang pumasok o makibahagi sa labanan—samantalang ang “salakayin” ay mas tiyak.
- source_word: וַיִּזְעַק
  choice: humiyaw
  rationale: Ipinahihiwatig ng זעק ang isang malakas at apurahang sigaw, kadalasan dahil sa panganib, nang hindi tinutukoy ang nilalaman nito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kumandante” bilang karaniwang katawagang militar at iniwasan ang mga arkaikong pormula. Ang padamdam sa sinabi ng mga kumandante ay nagpapakita ng kanilang tiyak na pagkilala, hindi ng karagdagang nilalaman.
