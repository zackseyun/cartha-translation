base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: tl
  text: Sinabi ng hari ng Israel sa kanyang mga lingkod, “Alam ba ninyo na atin ang Ramot-gilead? Gayunman, wala tayong ginagawa upang kunin ito mula sa kamay ng hari ng Aram.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Maaaring tumukoy ang עבד sa mga lingkod o opisyal ng hari. Pinananatili ng “mga lingkod” ang malawak na kahulugan at ang karaniwang pananalita tungkol sa maharlikang sambahayan nang hindi labis na tinutukoy ang kanilang katungkulan.
- source_word: הַיְדַעְתֶּם
  choice: Alam ba ninyo
  rationale: Likas itong retorikal na tanong sa Tagalog at hindi nagdaragdag ng tahasang pagtanggi na wala sa Hebreo.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: na atin ang Ramot-gilead
  rationale: Ipinapahayag ng לָנוּ ang pag-aari o pag-angkin. Ang “atin” ay maikli, natural, at hindi nagpapasya kung legal, tipan, o politikal ang batayan ng pag-angkin.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Transliterasyon ito ng tambalang pangalan ng lugar mula sa Hebreo, na may gitling upang maging malinaw ang anyo nito.
- source_word: מַחְשִׁים
  choice: wala tayong ginagawa
  rationale: Bagaman kaugnay ng pagiging tahimik ang literal na larawan, sa konteksto ay ipinahihiwatig nito ang sadyang hindi pagkilos. Natural na ipinahahayag ng salin ang mapanuring diin ng hari.
- source_word: מִקַּחַת אֹתָהּ
  choice: upang bawiin iyon
  rationale: Ang lugar ay inaangkin na “atin,” kaya natural sa Tagalog ang “bawiin.” Gayunman, hindi nito dinaragdagan ang paraan ng pagkuha o ang antas ng puwersang gagamitin.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang Hebreong idyoma para sa pag-aari o kapangyarihan; malinaw pa rin ito sa dignipikadong biblikal na Tagalog.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang Hebreong pangalan sa halip na palitan ng mas huling heograpikong katawagang “Siria.”
theological_decisions:
- issue: Likas ng pag-angkin sa Ramot-gilead
  choice: “atin ang Ramot-gilead”
  alternative: “pag-aari natin ang Ramot-gilead”
  rationale: Pinananatili ng “atin” ang pag-angkin ng hari nang hindi ipinapaliwanag o pinatutunayang legal o teolohikal ang batayan nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ninyo” sa pakikipag-usap ng hari sa maramihang tagapakinig. Ang “mula sa kamay ng” ay sadyang nagpapanatili ng biblikal na idyoma, samantalang ang “wala tayong ginagawa” ay naghahatid ng kontekstuwal na diwa ng מַחְשִׁים.
