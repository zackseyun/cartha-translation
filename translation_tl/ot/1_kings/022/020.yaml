- from: At sinabi ni Yahweh[a], “Sino ang hihikayat kay Ahab upang umahon siya at mabuwal sa Ramot-gilead?” Iba-iba ang sinabi ng bawat isa.
  to: At sinabi ni Yahweh[a], “Sino ang hihikayat kay Ahab upang siya ay umahon at mabuwal sa Ramot-gilead?” At ang isa ay nagsabi ng ganito, at ang isa naman ay nagsabi ng ganoon.
  rationale: Inayos ang ayos ng layuning sugnay para sa natural na Filipino, ibinalik ang magkatapat na pahayag ng dalawang nagsasalita sa huling sugnay nang hindi nagdadagdag na lahat ay nagsalita, at itinama ang lexical na alternatibo sa talababa mula sa ahenteng “mandaraya” tungo sa pandiwang “linlangin.”
