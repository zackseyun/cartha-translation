base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: tl
  text: At sinabi ni Yahweh[a], “Sino ang hihikayat kay Ahab upang siya ay umahon at mabuwal sa Ramot-gilead?” At ang isa ay nagsabi ng ganito, at ang isa naman ay nagsabi ng ganoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mang-akit”; maaari ring mangahulugang “linlangin,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: יְפַתֶּה
  choice: hihikayat
  rationale: Maaaring mangahulugan ang piel ng פתה na manghikayat, mang-akit, o mandaya. Pinananatili ng “hihikayat” ang ideya ng pag-udyok kay Ahab nang hindi tiyak na ipinapakahulugang payak na panghihimok o tahasang panlilinlang.
- source_word: וְיַעַל
  choice: upang umahon siya
  rationale: Likas na ipinahahayag sa Filipino ang layunin o inaasahang bunga ng paghikayat, habang pinananatili ang pag-ahon patungo sa lugar ng labanan.
- source_word: וְיִפֹּל
  choice: at mabuwal
  rationale: Pinananatili ang literal na larawang “mahulog/mabuwal,” na sa kontekstong militar ay nagpapahiwatig ng pagkatalo at kamatayan nang hindi iyon tahasang dinaragdagan.
- source_word: בְּרָמֹת גִּלְעָד
  choice: sa Ramot-gilead
  rationale: Isinalin ang pang-ukol nang natural sa Filipino at tinumbasan ang pangalan ng lugar sa anyong madaling bigkasin sa Tagalog.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: Iba-iba ang sinabi ng bawat isa
  rationale: Natural na ipinahahayag ang idyomang Hebreo na ang mga kasapi ng kapulungan ay nagbigay ng magkakaibang mungkahi, nang walang idinaragdag na nilalaman.
theological_decisions:
- issue: Ang pagkakasangkot ng Diyos sa pagbagsak ni Ahab
  choice: Pinanatili ang tuwirang tanong ni Yahweh kung sino ang hihikayat kay Ahab.
  alternative: Palambutin ang ahensiya ng Diyos sa pamamagitan ng “sino ang makaiimpluwensiya kay Ahab.”
  rationale: Tuwirang inilalarawan ng Hebreo si Yahweh bilang nagbubukas ng tanong sa makalangit na kapulungan. Hindi nilulutas o pinahihina ng salin ang tensiyong teolohikal tungkol sa soberanya at paghatol ng Diyos.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang Yahweh, ang larawang “mabuwal,” at ang tunay na lawak ng kahulugan ng pandiwang יְפַתֶּה sa pamamagitan ng talababa.
