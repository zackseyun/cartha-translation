    rationale: Ang זֶה ... וְזֶה ay inilalarawan bilang magkakaibang nagsasalita o mungkahi. Ang “bawat isa” ay nagmumungkahing lahat ng naroon ay nagsalita at binubura ang anyong magkatapat.
  - severity: low
    issue: Hindi natural ang ayos na “upang umahon siya.”
    rationale: 'Mas karaniwan at malinaw sa modernong Filipino ang panghalip bago ang pandiwa sa ganitong layuning sugnay: “upang siya ay umahon.”'
  - severity: medium
    issue: Mali ang anyong gramatikal na “mandaraya” sa talababa.
    rationale: Ang “mandaraya” ay pangngalan o paglalarawan ng ahente; ang kinakailangang lexical na alternatibo para sa pandiwa ay “linlangin.”
