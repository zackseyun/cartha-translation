  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: tl
  text: At si Jehoshafat na anak ni Asa ay naging hari ng Juda noong ikaapat na taon ni Ahab, na hari ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: At si Jehoshafat
  rationale: Pinananatili ng “At” ang ugnayang pasalaysay sa naunang konteksto; ang pangalang Jehoshafat ay tinumbasan ayon sa karaniwang anyong ginagamit sa Tagalog.
- source_word: בֶּן אָסָא
  choice: na anak ni Asa
  rationale: Natural sa modernong Tagalog ang pariralang ito bilang pagkakakilanlan sa angkan ni Jehoshafat.
- source_word: מָלַךְ
  choice: ay naging hari
  rationale: Ipinahahayag nito ang ingresibong diwa ng pandiwa—ang pagsisimula niya bilang hari—sa halip na ang kabuuang tagal ng paghahari.
- source_word: עַל יְהוּדָה
  choice: sa Juda
  rationale: Sa Tagalog, likas na ipinahahayag ng “naging hari sa Juda” ang pamamahala sa kaharian; mas natural ito kaysa sa literal na “sa ibabaw ng Juda.”
- source_word: בִּ/שְׁנַת אַרְבַּע
  choice: nang ikaapat na taon
  rationale: Ito ang malinaw at karaniwang Tagalog para sa pormula ng pagtatakda ng panahon batay sa taon ng paghahari.
- source_word: לְ/אַחְאָב
  choice: ni Ahab
  rationale: Sa pormulang ito, tinutukoy ng לְ ang ikaapat na taon ng paghahari ni Ahab; sapat at natural ang “ni Ahab” sa konteksto.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Ang pariralang ito ay appositional na titulong nagpapakilala kay Ahab at malinaw na naihahatid sa natural na Tagalog.
