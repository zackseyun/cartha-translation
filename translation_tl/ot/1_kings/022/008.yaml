  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: tl
  text: Sinabi ng hari ng Israel kay Jehosafat, “May isa pang lalaki na sa pamamagitan niya ay maaari tayong sumangguni kay Yahweh[a]. Ngunit kinamumuhian ko siya, sapagkat hindi siya nagpapahayag bilang propeta ng mabuti tungkol sa akin, kundi masama[b] lamang—si Micaya na anak ni Imla.” Sinabi ni Jehosafat, “Huwag po sanang sabihin ng hari iyan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “May isa pang lalaki upang sumangguni kay Yahweh sa pamamagitan niya.”
    reason: Pinananatili ng alternatibo ang mas tuwirang ayos ng pariralang Hebreo at ang papel ng lalaki bilang tagapamagitan sa pagsangguni.
  - marker: b
    text: O, “kapahamakan.”
    reason: Ang רָע ay maaaring mangahulugang masama sa pangkalahatan o kapahamakang darating, at hindi lubusang nilulutas ng konteksto ang saklaw nito.
lexical_decisions:
- source_word: עוֹד אִישׁ אֶחָד
  choice: May isa pang lalaki
  rationale: Ipinapahayag ng עוֹד ang diwang “mayroon pang,” at ng אִישׁ אֶחָד ang isang karagdagang lalaki; natural at malinaw ito sa modernong Tagalog.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: na sa pamamagitan niya ay maaari tayong sumangguni kay Yahweh
  rationale: Ang דָּרַשׁ sa kontekstong propetiko ay pagsangguni o pagtatanong kay Yahweh, samantalang ang מֵאֹתוֹ ay nagpapakitang ang lalaki ang tagapamagitan. Pinananatili ng salin ang dalawang diwa nang hindi ipinapalagay kung sino mismo ang gagawa ng pagsangguni.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan sa anyong karaniwang ginagamit sa modernong Filipino sa halip na palitan ito ng isang titulo.
- source_word: שְׂנֵאתִיו
  choice: kinamumuhian ko siya
  rationale: Tapat nitong ipinahahayag ang matindi at matatag na saloobin ng hari; mas eksakto ito kaysa sa mas mahinang “ayoko sa kanya.”
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: kapag nagpapahayag siya bilang propeta tungkol sa akin, hindi mabuti kundi masama lamang
  rationale: Iniiwasan ang posibleng makabagong kahulugan ng “nanghuhula” bilang panghuhula ng kapalaran, habang pinananatili ang propetikong kilos, ang paksa ng pahayag, at ang eksklusibong diin ng כִּי אִם.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Micaya na anak ni Imla
  rationale: Ginagamit ang mga anyong angkop sa bigkas at baybay ng Filipino habang malinaw na pinananatili ang patronimiko.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Huwag po sanang sabihin ng hari iyan
  rationale: Ang “huwag…sana” ay naghahatid ng magalang na pagbabawal o pakiusap ng jussive, at ang “po” ay likas na nagpapakita ng paggalang sa hari.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang pangalan at hindi ginagawang titulo.
- issue: Saklaw ng רָע sa reklamo ng hari
  choice: masama
  alternative: kapahamakan
  rationale: Maaaring tumukoy ang רָע sa masama sa pangkalahatan o sa kapahamakang ipinahahayag ng propeta. Pinananatili sa pangunahing teksto ang mas malawak na salita at inilalagay sa talababa ang mas tiyak na posibleng kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagpapahayag bilang propeta” upang maiwasan ang karaniwang di-biblikal na dating ng “nanghuhula.” Ang “po sana” ay nagpapanatili sa magalang at makaharing tono ng tugon ni Jehosafat.
