  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: tl
  text: Noong ikatlong taon, bumaba si Jehosafat, na hari ng Juda, patungo sa hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pumunta sa hari ng Israel.” Literal na nangangahulugang “bumaba” ang pandiwang Hebreo at maaaring tumukoy sa pagkakaiba ng taas ng mga lugar, bukod sa karaniwang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ang anyong pasalaysay ng היה kasama ng kasunod na pariralang pamanahon ay likas na ipinapahayag sa modernong Tagalog sa pamamagitan ng “Nang,” sa halip na literal ngunit mabigat na “At nangyari.”
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: ikatlong taon
  rationale: Tuwirang pinananatili nito ang ordinal at ang tiyak na pagtukoy sa taon; kasama ng “Nang,” nabubuo ang natural na pariralang “Nang ikatlong taon.”
- source_word: וַיֵּרֶד
  choice: bumaba ... at pumunta
  rationale: Pinananatili ng “bumaba” ang literal at posibleng topograpikong diwa ng ירד, habang nililinaw ng “at pumunta” sa natural na Tagalog ang pagkilos patungo sa hari ng Israel.
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang inilalarawan ng pariralang construct ang katungkulan ni Jehosafat; natural sa Tagalog ang appositive na “si Jehosafat na hari ng Juda.”
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: sa hari ng Israel
  rationale: Ang אֶל ay nagpapahayag ng kilos patungo sa isang tao; simple at malinaw itong naihahatid ng “sa hari ng Israel” kasunod ng “pumunta.”
