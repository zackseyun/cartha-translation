base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: tl
  text: Sinabi ni Micaias, “Buhay si Yahweh![a] Anumang sabihin ni Yahweh sa akin, iyon ang sasabihin ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Karaniwang pormula ito ng taimtim na panunumpa sa Hebreo: “Buhay si Yahweh.”'
    reason: Ipinaliliwanag ang gamit ng literal na pahayag bilang panunumpa nang hindi ito pinapalitan ng mas malayang pagpapakahulugan sa pangunahing teksto.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salin ng karaniwang anyong pasalaysay na wayyiqtol; sapat na ang ayos ng pangungusap sa Filipino upang ipakita ang pagpapatuloy ng salaysay.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino habang malinaw pa ring tumutukoy sa Hebreong Mikhayahu.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh!
  rationale: Pinananatili nito ang maikli at taimtim na pormula ng panunumpa sa Hebreo. Ang tandang padamdam ay tumutulong upang maging natural sa Filipino nang dagdagan ang diwa ng orihinal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang tetragrammaton bilang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כִּי אֵת אֲשֶׁר
  choice: Ang anumang
  rationale: 'Sa kontekstong ito, ipinakikilala ng parirala ang nilalaman ng taimtim na pangako: anumang sabihin ni Yahweh.'
- source_word: יֹאמַר יְהוָה אֵלַי
  choice: sabihin ni Yahweh sa akin
  rationale: Natural na Filipino para sa pahayag na nakatuon sa propeta; hindi kinakailangang tahasang markahan ang aspektong panghinaharap dahil naipahihiwatig na ito ng sugnay.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: iyon ang sasabihin ko
  rationale: Ang “iyon” ay nagpapanatili sa resumptive pronoun na tumutukoy sa anumang sasabihin ni Yahweh, at ang “sasabihin ko” ay natural na pahayag ng panghinaharap na pagsasalita.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon at iniiwasang palitan ito ng isang titulo.
- issue: Lakas ng pormula ng panunumpa na חַי יְהוָה
  choice: Buhay si Yahweh!
  alternative: Saksi ang buhay ni Yahweh
  rationale: Mas malapit ang piniling salin sa anyo ng Hebreo at hindi nagdaragdag ng salitang “saksi,” bagaman malinaw sa talababa na isa itong panunumpa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at mariing himig ng sagot ni Micaias, gayundin ang pag-uulit sa pangungusap sa pamamagitan ng “iyon,” na tumutugma sa diin ng Hebreo.
