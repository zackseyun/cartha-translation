  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: tl
  text: 'Pagsapit ng paglubog ng araw,[a] isang sigaw ang kumalat sa kampo: “Bawat lalaki, sa kanyang lungsod! Bawat lalaki, sa kanyang lupain!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Habang lumulubog ang araw.”
    reason: translation_alternative
  - marker: b
    text: Sa literal, “Bawat lalaki sa kanyang lungsod, at bawat lalaki sa kanyang lupain.” Isa itong nakaugaliang pahayag para pauwiin ang mga kawal matapos ang labanan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר הָרִנָּה בַּמַּחֲנֶה
  choice: isang sigaw ang kumalat sa buong kampo
  rationale: Sa kontekstong ito, ang עבר kasama ng pariralang ‘sa kampo’ ay nagsasaad ng paglaganap ng sigaw o pahayag sa buong kampo. Ang ‘kumalat’ ay likas sa modernong Tagalog, samantalang pinananatili ng ‘sigaw’ ang malakas at pampublikong katangian ng רִנָּה nang hindi ito ginagawang masayang pagsigaw.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: Pagsapit ng paglubog ng araw
  rationale: Karaniwang idyoma ito para sa paglubog ng araw. Ang salin ay malinaw at marangal, at hindi labis na literal.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ipinakikita ng tutuldok sa likas na Tagalog na ang kasunod ay nilalaman ng sigaw, kaya hindi na kailangan ang mabigat na literal na ‘na nagsasabi.’
- source_word: אִישׁ ... וְאִישׁ
  choice: Bawat lalaki ... at bawat lalaki
  rationale: Pinananatili ang distributibong pag-uulit at ang kontekstong militar, kung saan mga lalaking mandirigma ang pinauuwi.
- source_word: אֶל עִירוֹ
  choice: sa sarili niyang lungsod
  rationale: Ang עִיר ay ‘lungsod’ o ‘bayan.’ Ang ‘sarili niyang’ ay malinaw na naghahayag ng hulaping panghalip ng Hebreo.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: at bawat lalaki sa sarili niyang lupain
  rationale: Pinananatili ng ‘lupain’ ang lawak ng kahulugan ng אֶרֶץ bilang sariling teritoryo o bayang pinagmulan at ang paralelismo ng pormulang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘kumalat sa buong kampo’ bilang likas na paglalarawan sa pag-abot ng malakas na pahayag sa lahat, habang pinanatili ang inuulit na ‘bawat lalaki’ at ang maikli, apurahang anyo ng utos.
