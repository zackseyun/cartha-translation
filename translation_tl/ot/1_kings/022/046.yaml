  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jehoshafat, ang kanyang kagitingang ipinamalas[a], at kung paano siya nakipagdigma—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ang kanyang makapangyarihang mga gawa.” Pinagsasama ng Hebreo ang “kanyang kagitingan” at “na ginawa niya,” isang idyomang tumutukoy sa kagitingan o lakas na ipinakita sa gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang nagbubuod sa paghahari, ang יֶתֶר ay tumutukoy sa natitirang bahagi ng salaysay, at ang דִּבְרֵי ay idiomatikong tumutukoy sa mga ginawa o gawain, hindi lamang sa mga salita.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan mula sa Hebreo.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: ang kanyang kagitingang ipinamalas
  rationale: Ang גְּבוּרָה ay maaaring mangahulugang lakas, kagitingan, o makapangyarihang mga gawa. Kasama ng literal na 'na ginawa niya,' tumutukoy ito sa kagitingang napatunayan sa gawa; natural itong ipinahayag sa Filipino bilang 'kagitingang ipinamalas.'
- source_word: וַאֲשֶׁר נִלְחָם
  choice: at kung paano siya nakipagdigma
  rationale: Pinananatili nito ang diwa ng relative clause at ang kahulugan ng נלחם na lumaban o makipagdigma, nang hindi nagdaragdag ng tahasang pangngalang 'mga digmaan.'
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong ng karaniwang pormula sa pagtukoy sa isang nakasulat na sanggunian.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Juda
  rationale: Ang parirala ay pamagat ng maharlikang talaan o annals. Ang 'Aklat ng mga Kasaysayan ng mga Hari ng Juda' ay malinaw at likas na salin sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang retorikal na tanong at ang bahagyang pagtitipon-tipon ng mga parirala sa Hebreo, ngunit inayos ang mga ito upang maging natural basahin sa Tagalog.
