  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: tl
  text: 'Pagkatapos, gumawa si Zedekias na anak ni Kenaana ng mga sungay na bakal para sa sarili niya at sinabi, “Ganito ang sinabi ni Yahweh: ‘Sa pamamagitan ng mga ito, susuwagin mo ang Aram hanggang sa malipol mo sila.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: mga sungay na bakal
  rationale: Tuwirang pinananatili ang konkretong larawang makahula ng mga sungay na yari sa bakal.
- source_word: תְּנַגַּח
  choice: susuwagin mo
  rationale: Ang pandiwa ay tumutukoy sa pag-ulos o pagsuwag na gaya ng ginagawa ng hayop gamit ang sungay; natural at tiyak ang “susuwagin” sa Filipino.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang heograpiko at pampolitika sa Hebreo sa halip na palitan ng mas huling katawagang Siria.
- source_word: עַד כַּלֹּתָם
  choice: hanggang sa malipol mo sila
  rationale: Ipinahahayag ang diwang lubusang pagwawakas o paglipol sa kanila, habang pinananatili ang ikalawang panauhang tagaganap na ipinahihiwatig ng konstruksiyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos upang katawanin nang malinaw ang tetragrammaton sa tekstong Hebreo.
theological_decisions:
- issue: Ang pormulang pahayag na כֹּה אָמַר יְהוָה
  choice: “Ganito ang sinabi ni Yahweh”
  alternative: “Ganito ang sabi ng PANGINOON”
  rationale: Pinananatili itong pahayag ni Zedekias na nag-aangking nagsasalita para kay Yahweh; hindi ipinahihiwatig ng salin na pinagtitibay ng tagapagsalaysay ang katotohanan ng kaniyang hula.
- issue: Tagaganap sa עַד כַּלֹּתָם
  choice: “hanggang sa malipol mo sila”
  alternative: “hanggang sa malipol sila”
  rationale: 'Ang hulaping ikalawang panauhan sa infinitive construct ay sumusuporta sa aktibong diwa: ang kausap ang tatapos o lilipol sa kanila.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “para sa sarili niya” upang likas na katawanin ang לֹו, at pinanatili ang matingkad na simbolikong kilos at marahas na puwersa ng orihinal.
