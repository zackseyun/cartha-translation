base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: tl
  text: Ang sugong pumunta upang tawagin si Micaias ay nagsabi sa kanya, “Tingnan mo, ang mga salita ng mga propeta ay nagkakaisa[a] at kanais-nais sa hari. Pakiusap, iayon mo ang iyong sasabihin sa sinabi ng isa sa kanila, at magsalita ka nang kanais-nais sa hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa iisang bibig,” isang idyomang nangangahulugang “nagkakaisa” o “iisa ang tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ang sugo
  rationale: Sa konteksto, isang taong inutusan upang tawagin si Micaias ang tinutukoy, hindi isang makalangit na anghel. Likas at marangal sa Tagalog ang “sugo.”
- source_word: לִקְרֹא
  choice: upang tawagin
  rationale: Ipinahihiwatig ng konteksto ang pagpapatawag sa propeta. Sapat na naipapahayag ito ng natural na “tawagin” nang hindi dinaragdagan ang pormalidad ng Hebreo.
- source_word: הִנֵּה נָא
  choice: Tingnan mo
  rationale: Inaakit nito ang pansin ni Micaias habang ipinakikilala ang pakiusap. Natural itong pananalita sa modernong Tagalog.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: ang tinig ng mga propeta
  rationale: Sa pagsasanib sa kasunod na idyomang פֶּה אֶחָד, ipinahahayag nitong nagkakaisa ang sinasabi ng mga propeta. Nananatili ang larawang tumutukoy sa pagsasalita.
- source_word: פֶּה אֶחָד
  choice: iisa ang tinig
  rationale: Literal itong “isang bibig,” ngunit ang “iisa ang tinig” ang malinaw at likas na katumbas na idyoma sa Tagalog. Inilalagay sa talababa ang literal na larawan.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: mabuti para sa hari
  rationale: Pinananatili nito ang payak na salitang “mabuti” at ang ugnayan nito sa hari, nang hindi ipinapalagay kung ang mensahe ay tunay na mabuti o basta kanais-nais sa kanya.
- source_word: יְהִי נָא דבריך
  choice: Nakikiusap ako, iayon mo ang iyong sasabihin
  rationale: Ginagawang natural sa Tagalog ang magalang na pakiusap at ang diwang hinihinging umayon ang mensahe ni Micaias.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: sa sinabi ng isa sa kanila
  rationale: Malapit itong sumusunod sa isahang anyo ng Hebreo at malinaw na tumutukoy sa mensahe ng alinman sa mga propeta.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: at magsabi ka rin ng mabuti
  rationale: Pinananatili ang pag-uulit ng “mabuti” at ang hinihinging positibong pahayag, nang hindi labis na nililinaw ang bahagyang maluwag na gamit ng טוֹב.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal at kilalang anyong “Micaias.” Pinanatili ang mapilit ngunit magalang na tono ng sugo at ang pag-igting sa pagitan ng nagkakaisang mensahe ng mga propeta at ng hinihinging pagsang-ayon ni Micaias.
