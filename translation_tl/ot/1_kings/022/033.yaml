  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: tl
  text: At nang makita ng mga pinuno ng mga karwahe na hindi siya ang hari ng Israel, tumalikod sila at tumigil sa paghabol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mula sa pagsunod sa kanya”; isang idyomang Hebreo na nangangahulugang tumigil sila sa pagsunod o paghabol sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Sa salaysay na Hebreo, ipinagpapatuloy ng וַיְהִי ang takbo ng pangyayari at sinusundan dito ng sugnay na temporal. Likas sa modernong Tagalog na pagsamahin ito bilang “At nang” sa halip na gumamit ng mabigat na “At nangyari na.”
- source_word: כִּרְאוֹת
  choice: makita
  rationale: Ang infinitive construct na may כְּ ay nagpapahayag ng panahong kalagayan; malinaw at natural itong naihahatid ng “nang makita.”
- source_word: שָׂרֵי הָרֶכֶב
  choice: mga pinuno ng mga karwahe
  rationale: Ang שָׂרֵי ay mga pinunong militar, at ang הָרֶכֶב ay tumutukoy sa mga karwahe o hukbong gumagamit ng mga ito. Malapit sa anyo ng Hebreo at madaling maunawaan ang “mga pinuno ng mga karwahe.”
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: na hindi siya ang hari ng Israel
  rationale: Ang panlalaking panghalip na הוּא ay tumutukoy sa taong hinahabol nila. Pinananatili ng salin ang tuwiran at mariing pagkakakilanlang ipinahahayag ng sugnay.
- source_word: וַיָּשׁוּבוּ
  choice: tumigil sila
  rationale: Karaniwang nangangahulugang “bumalik” o “tumalikod” ang שׁוּב, ngunit kasama ng מֵאַחֲרָיו ipinahihiwatig dito na itinigil nila ang ginagawa nilang paghabol.
- source_word: מֵאַחֲרָיו
  choice: sa paghabol sa kanya
  rationale: Literal itong “mula sa likuran niya” o “mula sa pagsunod sa kanya.” Sa kontekstong militar, ang malinaw na diwa ay pagtigil sa paghabol sa kanya; inilalahad sa talababa ang literal na larawan.
