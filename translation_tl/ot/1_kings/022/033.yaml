  naturalness: Likas at malinaw ang pangungusap sa modernong Filipino Tagalog. Ang “tumalikod sila at tumigil sa paghabol” ay nananatiling natural habang mas naihahayag ang kilos na nasa Hebreo.
  terminology: Ang “mga pinuno ng mga karwahe” ay katanggap-tanggap at angkop sa kontekstong militar. Ang “hari ng Israel” ay tumpak. Walang usaping teolohikal na nangangailangan ng pagbabago.
