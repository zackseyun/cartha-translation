base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari ng Israel, “Kunin mo si Micaias at ibalik mo siya kay Amon, na pinuno ng lungsod, at kay Joas, na anak ng hari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” bilang pahiwatig ng pagkakasunod-sunod.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng pariralang Hebreo; pinananatili ang titulo sa halip na ipalit ang pangalang Ahab.
- source_word: קַח
  choice: Kunin ninyo
  rationale: Ang pautos na anyo ng לקח ay karaniwang nangangahulugang “kunin.” Ginamit ang maramihang magalang/di-tiyak na tagaganap sa Tagalog dahil hindi tinutukoy sa Hebreo ang bilang ng inuutusan, at mas natural ito sa utos sa mga opisyal.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong biblikal na Tagalog.
- source_word: וַהֲשִׁיבֵהוּ
  choice: ibalik siya
  rationale: 'Ang Hiphil ng שוב ay causative: “papagbalikin” o “ibalik.” Malinaw at natural ang “ibalik siya” at ipinahihiwatig na dati na siyang nasa pangangalaga ng mga opisyal.'
- source_word: אָמֹן
  choice: Amon
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
- source_word: שַׂר הָעִיר
  choice: pinuno ng lungsod
  rationale: Malawak ang saklaw ng שַׂר—maaaring opisyal, pinuno, tagapamahala, o kumandante. Pinananatili ng “pinuno” ang di-tiyak na katangiang sibiko o militar ng titulo nang hindi ito labis na nililinaw.
- source_word: וְאֶל יוֹאָשׁ
  choice: at kay Joas
  rationale: Pinananatili ang ikalawang pang-ukol upang malinaw na parehong kina Amon at Joas dadalhin si Micaias.
- source_word: בֶּן הַמֶּלֶךְ
  choice: na anak ng hari
  rationale: Natural na salin ng construct phrase at hindi nagdaragdag ng titulong “prinsipe,” na wala sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “pinuno ng lungsod” upang mapanatili ang leksikal na lawak ng שַׂר nang hindi nangangailangan ng talababa. Ang mga pangalang Micaias at Joas ay nasa nakaugaliang anyong biblikal sa Tagalog.
