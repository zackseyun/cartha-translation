base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa kanya, “Ilang ulit ba kitang kailangang panumpain[a] na wala kang sasabihin sa akin kundi ang katotohanan sa pangalan ni Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ilang ulit ba kitang kailangang ipasailalim sa panunumpa…?” Ang pandiwang Hebreo ay nangangahulugang pagpanumpain ang isang tao o ilagay siya sa ilalim ng panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan; pinananatili ang titulong ginamit sa Hebreo.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Ilang ulit ba
  rationale: Likas na ekspresyon sa Filipino para sa retorikal na tanong na nagpapahayag ng pagkainis dahil sa pag-uulit.
- source_word: מַשְׁבִּעֶךָ
  choice: dapat panumpain
  rationale: Ang Hiphil ng שׁבע ay nangangahulugang pagpanumpain o ilagay sa ilalim ng panunumpa. Pinananatili ng “panumpain” ang pormal na puwersa ng panunumpa, habang ipinahihiwatig ng “dapat” ang pagkayamot ng hari.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: na wala kang sasabihin sa akin kundi ang katotohanan
  rationale: Pinananatili nito ang negatibo at restriktibong kayarian ng Hebreo (“hindi… maliban sa”), ngunit natural itong mababasa sa Filipino.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Ipinapahayag nito ang pagsasalita sa ilalim ng awtoridad o pagtawag sa banal na pangalan, at inililipat nang tahasan ang tetragrammaton bilang “Yahweh.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na banal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng panunumpa at utos na magsabi ng katotohanan
  choice: na wala kang sasabihin sa akin kundi ang katotohanan
  alternative: na sabihin mo sa akin ang katotohanan lamang
  rationale: Pinananatili ng pinili ang restriktibong anyo at diin ng לֹא… רַק nang hindi nilulutas nang higit sa teksto ang ugnayan ng pagpapanumpa at pagsasalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panumpain” upang mapanatili ang legal at panrelihiyong bigat ng Hebreo; ipinaliwanag sa talababa ang mas tahasang alternatibo.
