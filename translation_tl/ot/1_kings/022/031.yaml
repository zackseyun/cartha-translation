  to: 'At nag-utos ang hari ng Aram sa tatlumpu''t dalawang pinuno ng mga karwaheng pandigma na nasa ilalim ng kaniyang pamumuno: “Huwag kayong makipaglaban sa sinuman, mababa man o mataas ang katayuan,[a] kundi sa hari lamang ng Israel.”'
