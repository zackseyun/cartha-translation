base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: tl
  text: 'At nag-utos ang hari ng Aram sa tatlumpu''t dalawang pinuno ng mga karwaheng pandigma na nasa ilalim ng kaniyang pamumuno: “Huwag kayong makipaglaban sa sinuman, mababa man o mataas ang katayuan,[a] kundi sa hari lamang ng Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa maliit o sa malaki.” Idyoma ito para sa mga taong mababa man o mataas ang ranggo o katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: At ang hari ng Aram
  rationale: Pinananatili ang pang-ugnay na ו bilang “At” at ang orihinal na pangalang-lugar na “Aram,” sa halip na ang tradisyonal na “Siria.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Tuwirang ipinahahayag ang pagbibigay ng utos; hindi kailangan sa Tagalog ang tahasang past perfect upang maipakita ang saligang pangyayari.
- source_word: שָׂרֵי הָרֶכֶב
  choice: mga pinuno ng mga karwaheng pandigma
  rationale: Ang שָׂרֵי ay mga pinuno o kumander, at ang הָרֶכֶב dito ay tumutukoy sa puwersang gumagamit ng mga karwaheng pandigma.
- source_word: אֲשֶׁר לוֹ
  choice: na nasa ilalim niya
  rationale: Likas sa modernong Tagalog at ipinahahayag ang kaugnayan ng mga pinuno sa kapangyarihan ng hari nang hindi nagpapahiwatig na pag-aari niya sila bilang mga bagay.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: tatlumpu't dalawa
  rationale: Tuwirang salin ng bilang.
- source_word: לֵאמֹר
  choice: tutuldok bago ang tuwirang sinabi
  rationale: Sa natural na Tagalog, sapat ang bantas upang ipakilala ang nilalaman ng utos; magiging mabigat ang literal na “na sinasabi.”
- source_word: לֹא תִּלָּחֲמוּ
  choice: Huwag kayong makipaglaban
  rationale: Natural na anyong pautos na patanggi para sa maramihang kausap.
- source_word: אֶת קָטֹן וְאֶת גָּדוֹל
  choice: kaninuman, mababa man o mataas ang katayuan
  rationale: Nililinaw ang Hebreong idyoma na tumutukoy sa mga taong anuman ang ranggo o kalagayan, hindi sa pisikal na laki o edad.
- source_word: כִּי אִם
  choice: kundi
  rationale: Ipinahahayag ang mariing pagbubukod sa utos.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: sa hari lamang ng Israel
  rationale: Ang “lamang” ay natural na naghahatid ng eksklusibong diin ng לְבַדּוֹ; ang “sa” ay tumutukoy sa tanging puntirya ng pakikipaglaban.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “karwaheng pandigma” upang maiwasan ang malabong “karwahe” lamang, at isinalin ang idyomang “maliit o malaki” ayon sa kahulugan nito habang pinananatili ang literal na anyo sa talababa.
