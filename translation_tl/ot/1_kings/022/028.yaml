revisions:
- from: At sinabi ni Mikaya, “Kung talagang makababalik kang ligtas, hindi nagsalita si Yahweh sa pamamagitan ko.[a]” At sinabi niya, “Makinig kayo, kayong lahat na mga bayan![b]”
  to: At sinabi ni Mikaya, “Kung talagang babalik kang ligtas, hindi nagsalita si Yahweh sa pamamagitan ko.” At sinabi niya, “Makinig kayo, lahat kayong mga bayan!”
  rationale: Inalis ang maling alternatibong “sa akin” at pinalitan ng isang paliwanag na tumpak na naglalahad ng instrumental na diwa ng Hebreo. Pinakinis din ang dalawang parirala upang maging mas likas sa modernong Filipino nang hindi binabago ang diin, saklaw, o tinig ng pinagmulan.
