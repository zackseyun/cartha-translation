base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: tl
  text: At sinabi ni Mikaya, “Kung talagang babalik kang ligtas, hindi nagsalita si Yahweh sa pamamagitan ko.” At sinabi niya, “Makinig kayo, lahat kayong mga bayan!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Malapit na transliterasyon sa anyong Hebreo at madaling bigkasin sa modernong Filipino.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Kung talagang makababalik ka
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa kondisyon; natural itong naipapahayag ng “talagang” sa Filipino.
- source_word: בְּשָׁלוֹם
  choice: ligtas
  rationale: Sa kontekstong ito, tumutukoy ang shalom sa pagbabalik nang hindi napinsala. Mas malinaw sa karaniwang mambabasa ang “ligtas” kaysa sa literal na idyomang “nang may kapayapaan.”
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: hindi nagsalita si Yahweh sa pamamagitan ko
  rationale: Ipinahahayag ng בִּי na ang propeta ang kasangkapan o tagapamagitan ng pagsasalita ni Yahweh; pinananatili sa talababa ang mas literal na posibilidad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH bilang “Yahweh.”
- source_word: שִׁמְעוּ
  choice: Makinig kayo
  rationale: Natural at mariing pautos sa modernong Filipino, na angkop sa hayagang panawagan ng propeta.
- source_word: עַמִּים כֻּלָּם
  choice: kayong lahat na mga bayan
  rationale: Pinananatili ng “mga bayan” ang pangmaramihang anyo ng עַמִּים at ang malawak na saklaw ng panawagan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Nasa tekstong Hebreo ang Tetragrammaton, kaya pinananatili ang personal na pangalang “Yahweh” sa halip na palitan ito ng titulo.
- issue: Tagapagsalita sa huling sugnay na וַיֹּאמֶר
  choice: Si Mikaya pa rin ang tagapagsalita
  alternative: Ituring itong editoryal na panawagan o tinig ng ibang tagapagsalita
  rationale: Pinakanatural sa daloy ng salaysay na si Mikaya ang nagpapatuloy sa pagsasalita; walang malinaw na bagong paksa sa Hebreo.
- issue: Diwa ng בִּי sa pahayag ng propeta
  choice: sa pamamagitan ko
  alternative: sa akin
  rationale: Malinaw na ipinapakita ng pangunahing salin ang instrumental na diwa, ngunit hindi ikinukubli ang mas literal na anyo at posibleng saklaw nito, na inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “talagang” upang natural na maipakita ang diin ng Hebreo, at “ligtas” upang maihatid ang kahulugan ng shalom sa kontekstong militar. Pinanatili ang pag-uulit na “At sinabi niya” dahil naroon ito sa tekstong Hebreo.
