  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Hebreo: isang di-pinangalanang mamamana ang nagpapakawala ng palaso, tinamaan ang hari ng Israel sa isang puwang ng baluti, at ipinag-utos ng hari na ilabas siya dahil nasugatan siya. Ang "sa labanan" para sa מִן־הַמַּחֲנֶה ay katanggap-tanggap sa kontekstong pandigma, bagaman mas malapit ang "mula sa hukbo/hanay ng hukbo."'
