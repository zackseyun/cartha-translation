  terminology: Ang "karwahe," "tagapagmaneho," "baluti," at "panangga sa dibdib" ay angkop. Makatuwiran ang maingat na paggamit ng "mga dugtungan ng baluti," dahil hindi tiyak ang teknikal na kahulugan ng דְּבָקִים; dapat manatili ang paliwanag sa talababa.
