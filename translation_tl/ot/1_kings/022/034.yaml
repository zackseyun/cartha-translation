translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karwahe” at “baluti” bilang karaniwang katawagang biblikal na madaling maunawaan; binigyang-linaw ang mga idyomang Hebreo nang hindi inaalis ang leksikal na kawalang-katiyakan sa bahagi ng baluti.
