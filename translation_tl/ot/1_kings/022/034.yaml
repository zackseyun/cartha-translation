revisions:
- from: Ngunit isang lalaki ang basta na lamang pumana, at tinamaan niya ang hari ng Israel sa pagitan ng mga dugtungan ng baluti at ng panangga sa dibdib.[a] Kaya sinabi ng hari sa tagapagmaneho ng kanyang karwahe, “Iliko mo ang karwahe at ilabas mo ako sa labanan, sapagkat nasugatan ako.”
  to: Ngunit isang lalaki ang nagpakawala ng palaso nang walang tiyak na pinupuntirya, at tinamaan niya ang hari ng Israel sa pagitan ng mga dugtungan ng baluti at ng panangga sa dibdib.[a] Kaya sinabi ng hari sa tagapagmaneho ng kanyang karwahe, “Iliko mo ang karwahe at ilabas mo ako sa labanan, sapagkat nasugatan ako.”
  rationale: Pinalitan ang “basta na lamang pumana” ng pananalitang malinaw na nagsasaad na walang tiyak na pinupuntirya ang mamamana, ang pinakamalamang na kahulugan ng לְתֻמּוֹ sa kontekstong ito. Pinanatili ang natitirang salin at talababa, sapagkat maayos nitong inihahatid ang di-tiyak na terminolohiyang pangbaluti at ang kontekstong militar.
