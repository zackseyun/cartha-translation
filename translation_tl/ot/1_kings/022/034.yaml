base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: tl
  text: Ngunit isang lalaki ang nagpakawala ng palaso nang walang tiyak na pinupuntirya, at tinamaan niya ang hari ng Israel sa pagitan ng mga dugtungan ng baluti at ng panangga sa dibdib.[a] Kaya sinabi ng hari sa tagapagmaneho ng kanyang karwahe, “Iliko mo ang karwahe at ilabas mo ako sa labanan, sapagkat nasugatan ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong kahulugan ng dalawang teknikal na terminong Hebreo para sa mga bahaging ito ng baluti; malamang na tumutukoy ang mga ito sa isang puwang sa pagitan ng magkakabit na bahagi ng baluti.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Ngunit isang lalaki
  rationale: Karaniwang tumutukoy ang אִישׁ sa isang lalaki; ang “ngunit” ay nagpapakita ng biglang pagliko ng salaysay kaugnay ng pagtatago ng hari sa naunang konteksto.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: pumana
  rationale: Ang Hebreong idyoma ay literal na paghatak sa busog. Sa natural na Filipino, malinaw na naihahayag ng “pumana” ang buong kilos ng paggamit at pagpapakawala ng palaso.
- source_word: לְתֻמּוֹ
  choice: basta na lamang
  rationale: Sa konteksto ng labanan, ipinahihiwatig nito na walang partikular na pinuntirya ang mamamana. Pinananatili ng parirala ang ideya ng hindi sinasadyang pagpili sa hari nang hindi ito ginagawang usaping moral na kawalang-sala.
- source_word: וַיַּכֶּה
  choice: tinamaan niya
  rationale: Tuwirang inilalarawan ng נכה ang pagtama o paghampas. Hindi pa inilalagay rito ang “sinugatan,” yamang saka iyon malinaw na sinasabi sa hulihan ng talata.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: sa pagitan ng mga dugtungan ng baluti at ng panangga sa dibdib
  rationale: Hindi tiyak ang mga teknikal na terminong Hebreo, ngunit malinaw na tumutukoy ang parirala sa puwang sa pagitan ng magkakaugnay na bahagi ng baluti at ng panangga sa katawan. Ang salin ay konkreto ngunit hindi labis na tiyak.
- source_word: לְרַכָּבוֹ
  choice: sa tagapagmaneho ng kanyang karwahe
  rationale: Tumutukoy ito sa taong kumokontrol sa karwahe. Mas madaling maunawaan sa modernong Filipino ang buong parirala kaysa sa isang bihirang teknikal na titulo.
- source_word: הֲפֹךְ יָדְךָ
  choice: Iliko mo ang karwahe
  rationale: Literal itong “ibaling mo ang iyong kamay,” isang idyoma para sa pagmaneobra ng karwahe. Isinalin ang nilalayong kilos upang maging natural at malinaw sa Filipino.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: ilabas mo ako sa labanan
  rationale: Maaaring mangahulugan ang מַחֲנֶה ng kampo, hukbo, o hanay militar. Dahil kasalukuyang nagaganap ang labanan, “sa labanan” ang natural na kontekstuwal na katumbas.
- source_word: כִּי הָחֳלֵיתִי
  choice: sapagkat nasugatan ako
  rationale: Bagaman maaari ring mangahulugan ang pandiwa na magkasakit o manghina, malinaw sa agarang konteksto ng tama ng palaso na sugat ang tinutukoy. Hindi idinagdag ang “malubha” sapagkat wala itong tahasang katumbas sa teksto.
