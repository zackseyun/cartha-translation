  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: tl
  text: Pagkatapos, humakbang paharap ang espiritu[a] at tumayo sa harap ni Yahweh. Sinabi nito, “Aakitin ko siya.”[b] At sinabi ni Yahweh sa kanya, “Sa anong paraan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang espiritu.” Sa Hebreo, “ang espiritu” ang anyo ng parirala, na malamang ay tumutukoy sa isang partikular na espiritung nilalang sa makalangit na konseho, hindi kinakailangang sa Espiritu Santo.
    reason: alternative_reading
  - marker: b
    text: O “Hihikayatin ko siya” o “Lilinlangin ko siya.” Maaaring tumukoy ang pandiwa sa pang-aakit o panghihikayat; nililinaw sa kasunod na talata ang eksaktong paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: humakbang paharap
  rationale: Bagaman pangunahing nangangahulugang ‘lumabas’ ang pandiwa, sa tagpong parang pagpupulong ng makalangit na konseho, inilalarawan nito ang pagharap ng espiritu mula sa hanay ng hukbo sa langit. Likas sa Filipino ang ‘humakbang paharap’ at pinananatili nito ang kilos ng tekstong Hebreo.
- source_word: הָרוּחַ
  choice: ang espiritu
  rationale: May tiyak na pantukoy ang Hebreo at tumutukoy sa isang partikular na espiritung nilalang sa tagpo. Ginamit ang maliit na titik upang hindi ipahiwatig nang walang sapat na batayan na ito ang Espiritu Santo.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: tumayo sa harap ni
  rationale: Tuwirang pinananatili nito ang pormal na larawan ng pagtayo sa presensiya ng isang nakatataas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֲפַתֶּנּוּ
  choice: Aakitin ko siya
  rationale: Maaaring mangahulugan ang פתה sa piel na akitin, hikayatin, o linlangin. Pinananatili ng ‘aakitin’ ang ideya ng pag-udyok nang hindi pa inuunahan ang tiyak na paraang ilalahad sa kasunod na talata.
- source_word: בַּמָּה
  choice: Sa anong paraan?
  rationale: Itinatanong ng parirala ang paraan o kasangkapang gagamitin. Natural at sapat na pormal sa Filipino ang ‘Sa anong paraan?’
theological_decisions:
- issue: Pagkakakilanlan ng הָרוּחַ sa makalangit na konseho
  choice: isang partikular na espiritung nilalang, isinaling ‘ang espiritu,’ hindi tahasang ang Espiritu Santo
  alternative: ‘ang Espiritu’ bilang Espiritu Santo, o ‘isang espiritu’ bilang di-tiyak
  rationale: Inilalarawan ng salaysay ang isang miyembro ng makalangit na hukbo na humaharap upang magmungkahi ng paraan ng paghatol kay Ahab. Hindi hinihingi ng Hebreo ang pagkilalang ito bilang Espiritu Santo, ngunit may pantukoy ito; kaya pinananatili sa pangunahing teksto ang ‘ang espiritu’ at inilalagay sa talababa ang posibleng di-tiyak na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na tagpo ng makalangit na konseho, ngunit iniwasan ang sobrang teknikal o makalumang pananalita. Ang maliit na titik sa ‘espiritu’ ay sadyang ginagamit upang hindi tahimik na ipantay ang tauhan sa Espiritu Santo.
