base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: tl
  text: Sinabi ng hari ng Israel kay Jehoshafat, “Magbabalatkayo ako[a] at sasabak sa labanan, pero ikaw, isuot mo ang iyong mga kasuotan.” Kaya nagbalatkayo ang hari ng Israel at sumabak sa labanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang Hebreo bilang utos: “Magbalatkayo ka at sumabak sa labanan.” Gayunman, matibay na sinusuportahan ng kasunod na pangungusap—“nagbalatkayo ang hari ng Israel”—ang diwang “Magbabalatkayo ako at sasabak sa labanan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Magbabalatkayo ako
  rationale: Bagaman maaaring basahin ang anyo bilang utos na “Magbalatkayo ka,” ipinakikita ng kasunod na salaysay na ang hari ng Israel mismo ang nagbalatkayo. Ang unang panauhan ang pinakamalinaw na pagpapahayag ng daloy ng usapan, habang itinatala sa talababa ang tunay na ambiguwidad ng Hebreo.
- source_word: וָבֹא
  choice: at sasabak
  rationale: Ipinagpapatuloy nito ang balak ng hari na pumasok sa labanan. Ang “sasabak” ay natural na modernong Tagalog para sa aktuwal na pagpasok sa pakikipaglaban.
- source_word: בַמִּלְחָמָה
  choice: sa labanan
  rationale: Kasama ng pandiwang בוא, tumutukoy ito sa pagpasok sa lugar at kilos ng pakikipaglaban; natural sa Tagalog ang “sumabak sa labanan.”
- source_word: וְאַתָּה
  choice: pero ikaw
  rationale: 'Mariing ipinakikita ng tahasang panghalip ang pagkakaiba: magbabalatkayo ang hari ng Israel, samantalang mananatiling lantad si Jehoshafat sa kasuotang panghari.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: isuot mo ang iyong mga kasuotang panghari
  rationale: Karaniwang nangangahulugang “mga kasuotan” ang בְּגָדִים, ngunit sa kontekstong ito ang kaibhan sa pagbabalatkayo ay nakasalalay sa nakikilalang kasuotang maharlika. Nililinaw ng “panghari” ang kontekstuwal na diwa nang hindi tumutukoy sa isang partikular na uri ng damit.
- source_word: וַיִּתְחַפֵּשׂ
  choice: nagbalatkayo
  rationale: Tuwirang inilalarawan ng reflexive na pandiwa ang ginawang pagtatago ng pagkakakilanlan ng hari.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: sumabak sa labanan
  rationale: Inuulit nito sa salaysay ang naunang balak. Ang parehong pariralang Tagalog ay nagpapanatili sa sinadyang pag-uulit.
theological_decisions:
- issue: Kung sino ang inutusang o nagbalak na magbalatkayo
  choice: Ang hari ng Israel ang nagsabing magbabalatkayo siya
  alternative: 'Inutusan ng hari si Jehoshafat: “Magbalatkayo ka at sumabak sa labanan”'
  rationale: Pinapanigan ng kasunod na sugnay—na ang hari ng Israel ang nagbalatkayo—ang pagbasa na ipinahahayag ng hari ang sarili niyang balak. Gayunman, hindi inaalis ang morpolohikal na posibilidad ng utos; malinaw itong inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “magbalatkayo” para sa pagtatago ng pagkakakilanlan, “sumabak sa labanan” para sa natural na paglalarawan ng pagpasok sa pakikipagdigma, at “mga kasuotang panghari” upang maging malinaw ang kontrast sa pagbabalatkayo.
