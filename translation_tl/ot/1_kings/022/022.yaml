base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: tl
  text: At sinabi niya, “Lalabas ako at magiging isang espiritu ng kasinungalingan[a] sa bibig ng lahat ng propeta niya.” At sinabi niya, “Mahihikayat mo siya[b], at magtatagumpay ka rin. Lumabas ka at gawin mo iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang mapanlinlang na espiritu.”
    reason: lexical_alternative
  - marker: b
    text: O, “Malilinlang mo siya” o “Mapapaniwala mo siya.” Maaaring tumukoy ang pandiwang Hebreo sa panghihikayat, panunukso, o panlilinlang, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Lalabas ako
  rationale: Ang Qal imperfect na unang panauhan ay nagpapahayag ng nilalayong kilos sa hinaharap at pinananatili ang diwa ng paglabas.
- source_word: וְהָיִיתִי
  choice: at magiging
  rationale: Ipinahahayag ng היה na gagampanan o aakuin ng espiritu ang isang papel; likas sa Filipino ang “magiging” sa kontekstong ito.
- source_word: רוּחַ שֶׁקֶר
  choice: isang espiritung nagsisinungaling
  rationale: Likas at malinaw itong paglalarawan sa espiritung nagsasalita ng kasinungalingan, habang ang mas literal na “espiritu ng kasinungalingan” ay inilagay sa talababa.
- source_word: בְּפִי
  choice: sa bibig ng
  rationale: Pinananatili ang Hebreong larawang tumutukoy sa pananalitang lumalabas sa pamamagitan ng mga propeta.
- source_word: כָּל נְבִיאָיו
  choice: lahat ng propeta niya
  rationale: Tuwirang ipinahahayag ang kabuuan at ang kaugnayan ng mga propeta sa lalaking tinutukoy sa tagpo.
- source_word: תְּפַתֶּה
  choice: Mahihikayat mo siya
  rationale: Maaaring mangahulugan ang Piel ng פתה na manghikayat, mandaya, o manlinlang. Ang “mahihikayat” ay nagpapanatili sa ideya ng pag-udyok nang hindi labis na nililimitahan ang paraan.
- source_word: וְגַם תּוּכָל
  choice: at magtatagumpay ka rin
  rationale: Saklaw ng יכל ang kakayahan at matagumpay na pagsasakatuparan; sa atas na ito, malinaw at natural ang “magtatagumpay ka rin.”
- source_word: צֵא
  choice: Lumabas ka
  rationale: Pinananatili ang pag-uulit ng ugat יצא mula sa naunang “Lalabas ako.”
- source_word: וַעֲשֵׂה כֵן
  choice: at gawin mo iyon
  rationale: Natural na Filipino para sa utos na kumilos ayon sa paraang kapapahayag lamang.
theological_decisions:
- issue: Ang pahintulot o pag-aatas ng Diyos sa isang tagpong may panlilinlang
  choice: 'Tuwirang isinalin ang usapan: nagmungkahi ang espiritu na maging espiritung nagsisinungaling, at sinabihang makapanghihikayat ito at magtatagumpay.'
  alternative: Palambutin ang sinabi bilang basta pagpapahintulot lamang at hindi isang tuwirang pag-uutos.
  rationale: Tuwiran ang mga pandiwang Hebreo. Pinananatili ng salin ang tensiyon tungkol sa banal na kapangyarihan at sa pagkilos ng espiritu sa halip na lutasin ito sa pamamagitan ng paliwanag na wala sa talata.
- issue: Saklaw ng kahulugan ng פתה
  choice: Mahihikayat mo siya
  alternative: Malilinlang mo siya; mapapaniwala mo siya
  rationale: Maaaring sumaklaw ang pandiwa sa panghihikayat, panunukso, o panlilinlang. Pinili ang isang salitang hindi lubhang nagsasara sa leksikal na saklaw, at itinala ang ibang posibilidad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong idyomang “sa bibig ng” at ang paulit-ulit na “At sinabi niya” upang huwag tukuyin nang higit sa teksto ang mga nagsasalita.
