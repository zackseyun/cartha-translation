  text: And Jehoshaphat made peace with the king of Israel[a].
translation:
  language: tl
  text: At nakipagpayapaan si Jehoshafat sa hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At mapayapa ang ugnayan ni Jehoshafat sa hari ng Israel.” Maaaring unawain ang pandiwang Hebreo bilang pakikipagkasundo upang magkaroon ng kapayapaan o bilang kalagayan ng mapayapang ugnayan; pinili sa pangunahing teksto ang unang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵם
  choice: nakipagpayapaan
  rationale: Ang Hiphil ng שׁלם na may waw-consecutive ay maaaring tumukoy sa pagtatatag ng mapayapang ugnayan. Likas sa makabagong Tagalog ang “nakipagpayapaan” at pinananatili nito ang eventive na diwa ng pandiwa.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Isinalin ang personal na pangalan sa karaniwang anyong transliterado sa Filipino.
- source_word: עִם
  choice: sa
  rationale: Sa pariralang “nakipagpayapaan sa,” natural na ipinahahayag ng “sa” ang kabilang panig ng pakikipagpayapaan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng construct chain, na may tiyak na pagtukoy sa naghaharing hari ng Israel.
