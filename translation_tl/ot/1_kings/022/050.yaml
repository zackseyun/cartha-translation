  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Ahazias na anak ni Ahab kay Jehoshafat, “Sumama ang mga lingkod ko sa mga lingkod mo sakay ng mga barko.” Ngunit hindi pumayag si Jehoshafat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit hindi ninais ni Jehoshafat.” Mas literal na tumutukoy ang Hebreo sa hindi niya pagiging handa o pagkukusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Nagsisilbi itong panandang temporal at nagsusulong sa daloy ng salaysay.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazias na anak ni Ahab
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalan at malinaw na ipinahayag ang ugnayang ama-anak.
- source_word: יֵלְכוּ
  choice: Sumama
  rationale: Ang anyong pandiwa ay nagpapahayag ng mungkahi o pakiusap. Sa konteksto, natural na ipinahihiwatig ng “Sumama” ang paglahok ng mga lingkod ni Ahazias sa paglalayag kasama ng mga lingkod ni Jehoshafat.
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: mga lingkod ko ... mga lingkod mo
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod, alipin, o tauhan ng hari. Pinananatili ng “lingkod” ang malawak na kahulugan at ang paralelismo nang hindi ipinapalagay na mga alipin sila.
- source_word: בָּאֳנִיּוֹת
  choice: sakay ng mga barko
  rationale: Ang אֳנִיּוֹת ay “mga barko,” at ang “sakay ng” ang natural na modernong Filipino para sa paglalakbay gamit ang mga ito.
- source_word: וְלֹא אָבָה
  choice: Ngunit hindi pumayag
  rationale: Ang אָבָה ay tumutukoy sa pagiging handa o pagpayag. Natural sa Filipino ang “hindi pumayag” at hindi nito kailangang ipahiwatig ang mas mariing pagtanggi.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Pinanatili ang “mga lingkod” upang huwag paliitin ang saklaw ng salitang Hebreo sa “mga tauhan” lamang o gawing tiyak na “mga alipin.”
