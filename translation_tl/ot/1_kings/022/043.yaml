  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: tl
  text: Lumakad siya sa buong landas ng kanyang amang si Asa[a]; hindi siya lumihis mula rito, habang ginagawa niya ang matuwid sa paningin ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tinahak niya ang buong landas ng kanyang amang si Asa” o “Sinunod niya ang buong paraan ng pamumuhay ng kanyang amang si Asa.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa paningin ni Yahweh” ay idyomang Hebreo na nangangahulugang “ayon sa pagsusuri ni Yahweh” o “sa harap ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lumakad siya
  rationale: Pinananatili ng “lumakad” ang talinghaga ng pamumuhay at asal na ipinahihiwatig ng Hebrew na הלך sa pormulang sumusuri sa isang hari.
- source_word: בְּכָל דֶּרֶךְ
  choice: sa buong landas
  rationale: Isahan ang דֶּרֶךְ, kaya ang “buong landas” ay tumpak na tumutukoy sa kabuuang huwaran ng pamumuhay, hindi sa maraming magkakahiwalay na landas.
- source_word: אָסָא אָבִיו
  choice: ng kanyang amang si Asa
  rationale: Natural na ayos ito sa modernong Tagalog at malinaw na pinananatili ang kaugnayang mag-ama.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: hindi siya lumihis mula rito
  rationale: Pinananatili ng “lumihis” ang talinghaga ng landas; ang panghalip na isahan ay tumutukoy pabalik sa “landas.”
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: kundi ginawa niya ang matuwid
  rationale: Ang “ginawa ang matuwid” ay malinaw at natural na salin ng karaniwang idyomang Hebrew na עשה הישר. Ipinakikita ng “kundi” ang positibong kilos na kaagapay ng hindi niya paglihis, nang hindi dinaragdagan ang nilalaman.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang larawan ng idyomang Hebrew tungkol sa pagsusuri ng Diyos, habang natural pa rin sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pormula ng pagsusuri sa asal ng hari
  choice: Inilalarawan ang hari bilang tumahak sa huwaran ng kanyang amang si Asa at gumawa ng matuwid sa paningin ni Yahweh.
  alternative: Gawing pangkalahatang papuri lamang ito sa kanyang tapat na paghahari.
  rationale: Pinananatili ng salin ang tiyak na moral at maka-tipang pagsusuri ng tekstong Hebreo nang hindi nagpapasok ng mga pahayag na wala sa talata.
- issue: Ugnayan ng לַעֲשׂוֹת sa naunang sugnay
  choice: 'Isinalin bilang positibong kilos na kaugnay ng hindi paglihis: “kundi ginawa niya.”'
  alternative: “upang gawin niya ang matuwid,” na maaaring magbigay-diin sa layunin o resulta.
  rationale: Maaaring magpahiwatig ang infinitive ng layunin o bunga, ngunit sa kontekstong ito ay natural na ipinapaliwanag nito kung ano ang naging anyo ng hindi paglihis. Hindi pinalalawak ng salin ang teolohikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang talinghaga ng paglakad at landas, ang isahang reperensiya ng Hebrew, at ang personal na pangalang Yahweh.
