  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: tl
  text: Naglingkod siya kay Baal at yumukod sa kanya[a]. Pinukaw niya sa galit si Yahweh, ang Diyos ng Israel, gaya ng lahat ng ginawa ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kanya”; literal na tumutukoy ang pandiwang Hebreo sa pagyukod o pagpapatirapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: Naglingkod
  rationale: Pinananatili nito ang pangunahing diwa ng עבד na ‘maglingkod,’ na sa kontekstong ito ay tumutukoy sa paglilingkod sa isang diyos; ang kasunod na pandiwa ang naglalarawan ng tiyak na kilos ng pagsamba.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Likas sa modernong Tagalog ang paggamit sa pangalan nang walang katumbas na tiyak na pantukoy ng Hebreo.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: yumukod dito
  rationale: Pinananatili ang kongkretong kilos ng pagyukod o pagpapatirapa bilang pagsamba. Ang ‘dito’ ay tumutukoy kay Baal at umiiwas sa di-likas na paglalapat ng kasariang pambalarila sa isang diyos-diyosan.
- source_word: וַיַּכְעֵס
  choice: Ginalit niya
  rationale: Ang Hiphil ng כעס ay nagsasaad ng pagdudulot ng galit; malinaw at natural sa Tagalog ang ‘ginalit niya.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa pamamagitan ng transliterasyon ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang inililipat ang construct phrase at malinaw na kinikilala si Yahweh bilang Diyos ng Israel.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: gaya ng ginawa ng kanyang ama
  rationale: Natural na Tagalog na pinananatili ang paghahambing sa lahat ng ginawa ng kanyang ama nang hindi nagiging mabigat o mekanikal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan ng Diyos ng Israel, na sadyang inihahambing sa pangalang Baal sa talata.
- issue: Ugnayan ng ‘paglilingkod’ at ‘pagyukod’ kay Baal
  choice: 'Dalawang magkaugnay ngunit magkahiwalay na kilos: ‘Naglingkod’ at ‘yumukod’'
  alternative: Pagsamahin bilang ‘sumamba’
  rationale: Pinananatili ang dalawang magkaibang pandiwang Hebreo at hindi pinapawi ang kongkretong kilos ng pagyukod.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘dito’ para sa reperensiya kay Baal, ayon sa karaniwang paggamit sa Tagalog para sa mga bagay o diyos-diyosan; hindi nito binabago ang personal na referent ng Hebreo.
