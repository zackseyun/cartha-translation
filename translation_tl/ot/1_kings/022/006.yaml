  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: tl
  text: Pagkatapos, tinipon ng hari ng Israel ang mga propeta—mga apatnaraang lalaki—at sinabi sa kanila, “Dapat ba akong makipagdigma laban sa Ramot-gilead, o huwag na?” Sumagot sila, “Sumalakay ka, at ibibigay iyon ng Panginoon[a] sa kamay ng hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “aking panginoon.” Maaaring basahin ang Hebreong אֲדֹנָי bilang “aking panginoon” sa ilang konteksto, bagaman mas malamang na banal na titulong “ang Panginoon” ang kahulugan dito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Likas na salin ng Qal wayyiqtol ng קבץ, na tumutukoy sa pagsasama-sama ng mga tao.
- source_word: הַנְּבִיאִים
  choice: mga propeta
  rationale: Karaniwang makabagong Tagalog para sa mga kinikilalang tagapagsalita ng mensaheng mula sa Diyos.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: mga apatnaraang lalaki
  rationale: Ipinahihiwatig ng prefiks na כ ang pagtatantiya; ang “mga” ay natural na pananda nito sa Tagalog.
- source_word: הַאֵלֵךְ
  choice: Dapat ba akong
  rationale: Inilalahad ng anyong patanong at unang panauhang imperfect ang isang deliberatibong tanong.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: makipagdigma laban sa Ramot-gilead
  rationale: Malinaw at natural na inilalarawan ang pagkilos-militar laban sa Ramot-gilead nang hindi dinaragdagan ang diwa.
- source_word: אִם אֶחְדָּל
  choice: o huwag na
  rationale: Natural na Tagalog para sa pagpipigil o hindi pagpapatuloy sa binabalak na pagsalakay.
- source_word: עֲלֵה
  choice: Sumalakay kayo
  rationale: Sa kontekstong militar, ang utos na “umakyat” ay idyomatikong tumutukoy sa paglusob; iniiwasan ng salin ang di-likas at maaaring malabong literal na “umakyat.”
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Malamang na banal na titulo ang אֲדֹנָי sa kontekstong ito, ngunit hindi ito ang pangalang YHWH; pinananatili sa talababa ang posibleng pagbasa na “aking panginoon.”
- source_word: בְּיַד הַמֶּלֶךְ
  choice: sa kamay ng hari
  rationale: Pinananatili ang Hebreong idyoma ng pagbibigay sa kapangyarihan o kontrol ng isang tao, na nauunawaan din sa Tagalog.
theological_decisions:
- issue: Pagbasa sa אֲדֹנָי sa tugon ng mga propeta
  choice: ang Panginoon
  alternative: aking panginoon
  rationale: Sa orakular na pahayag, higit na malamang na banal na titulo ito. Gayunman, maaari rin itong basahing pantawag sa hari, kaya hindi inaalis ang tunay na kalabuan at inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ramot-gilead” bilang natural na transliterasyon. Isinaad ang tinatayang bilang sa pamamagitan ng “mga,” at pinanatili ang idyomang “sa kamay ng hari.”
