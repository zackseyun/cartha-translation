revisions:
- from: At nahimlay si Jehoshafat kasama ng kanyang mga ninuno[a], at inilibing siyang kasama ng kanyang mga ninuno sa Lungsod ni David, na kanyang ama[b]. Ang anak niyang si Jehoram ang naging hari bilang kahalili niya.
  to: At nahimlay[a] si Jehoshafat kasama ng kanyang mga ninuno, at inilibing siya kasama ng kanyang mga ninuno sa Lungsod ni David, na kanyang ninuno[b]. Si Jehoram na kanyang anak ay naging hari bilang kahalili niya.
