  - severity: low
    issue: Hindi eksaktong nakahanay ang talababa [a] sa salitang ipinaliliwanag nito.
    rationale: Ang talababa ay tumutukoy sa “nahimlay” bilang katumbas ng Hebreong “humiga/natulog,” kaya dapat itong ilagay kaagad pagkatapos ng “nahimlay,” hindi pagkatapos ng “mga ninuno.”
