base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: tl
  text: At nahimlay[a] si Jehoshafat kasama ng kanyang mga ninuno, at inilibing siya kasama ng kanyang mga ninuno sa Lungsod ni David, na kanyang ninuno[b]. Si Jehoram na kanyang anak ay naging hari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “humiga kasama ng kanyang mga ama,” isang karaniwang Hebreong pananalita para sa pagkamatay.
    reason: lexical_alternative
  - marker: b
    text: Ang “ninuno” ay literal na “ama” sa Hebreo. Maaari itong tumukoy sa isang ninuno, hindi lamang sa tuwirang ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Sa pormulang ginagamit sa pagkamatay ng mga hari, tumutukoy ang pandiwa sa pagkamatay. Pinananatili ng “nahimlay” ang banayad at pormulang larawan ng Hebreo nang mas natural sa Filipino kaysa sa literal na “humiga.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Bagaman literal na “kasama ng kanyang mga ama,” ang “mga ninuno” ang natural at malinaw na katumbas sa makabagong Filipino para sa dinastikong pormulang ito.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Tumpak nitong ipinapahayag ang balintiyak na diwa ng anyong Niphal nang hindi nagdaragdag ng uri ng libingan.
- source_word: בְּעִיר דָּוִד
  choice: sa Lungsod ni David
  rationale: Ito ang natural na anyo ng pangalang-pook sa Filipino at tumpak na kumakatawan sa pariralang konstrukto ng Hebreo.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Pinananatili ang mismong genealogical na pananalita ng Hebreo; nililinaw sa talababa na maaari itong tumukoy sa isang ninuno at hindi lamang sa tuwirang ama.
- source_word: וַיִּמְלֹךְ
  choice: naging hari
  rationale: Ipinahihiwatig ng pandiwa rito ang paghalili o pagluklok sa pagkahari, hindi lamang ang tagal ng paghahari.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Natural nitong ipinapahayag sa Filipino ang paghalili sa katungkulan na nasa Hebreong parirala.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang pananalita tungkol sa kamatayan sa pamamagitan ng “nahimlay,” habang ginamit ang “mga ninuno” upang maging natural ang dinastikong pahayag. Ang mas malawak na genealogical na gamit ng “ama” ay sadyang pinanatili at ipinaliwanag sa talababa.
