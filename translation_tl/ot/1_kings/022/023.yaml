revisions:
- from: 'At ngayon, narito: naglagay si Yahweh ng espiritung sinungaling[a] sa bibig ng lahat ng mga propeta mong ito, at nagsalita si Yahweh ng kapahamakan laban sa iyo.[b]'
  to: 'At ngayon, narito: naglagay si Yahweh ng espiritung sinungaling[a] sa bibig ng lahat ng mga propeta mong ito, at nagpahayag si Yahweh ng kapahamakan laban sa iyo.[b]'
  rationale: Pinalitan lamang ang “nagsalita ... ng kapahamakan” ng “nagpahayag ... ng kapahamakan” upang maging likas ang Filipino. Pinanatili ang lahat ng iba pang pagpili, kabilang ang tuwirang banal na pagkilos, ang ambiguity at bigat ng “espiritung sinungaling,” at ang mga talababa sa wastong tinutukoy na parirala.
