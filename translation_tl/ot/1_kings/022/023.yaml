base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: tl
  text: 'At ngayon, narito: naglagay si Yahweh ng espiritung sinungaling[a] sa bibig ng lahat ng mga propeta mong ito, at nagpahayag si Yahweh ng kapahamakan laban sa iyo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu ng kasinungalingan.”
    reason: lexical_alternative
  - marker: b
    text: O “sakuna laban sa iyo.” Ang salitang Hebreo ay maaaring tumukoy sa kapahamakan o sakunang dumarating bilang hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang agarang paglipat ng diskurso.
- source_word: הִנֵּה
  choice: narito
  rationale: Nagbibigay ng mariin at marangal na panawag-pansin na angkop sa pahayag ng propeta.
- source_word: נָתַן
  choice: naglagay
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagkilos ni Yahweh at likas na kaugnay ng pariralang “sa bibig”; hindi ito pinalalambot bilang pagpapahintulot lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalan ayon sa patakaran ng proyekto.
- source_word: רוּחַ שֶׁקֶר
  choice: espiritung sinungaling
  rationale: Likas at maikli sa Filipino, at pinananatili ang diwa ng isang espiritung kumikilos sa pamamagitan ng panlilinlang.
- source_word: בְּפִי
  choice: sa bibig ng
  rationale: Pinananatili ang kongkretong Hebreong idyoma para sa pananalitang inilalagay sa bibig ng mga propeta.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: lahat ng mga propeta mong ito
  rationale: Pinananatili ang kabuuan, ang ikalawang-panauhang pagmamay-ari, at ang mariing demonstratibong “ito.”
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: nagsalita ... ng kapahamakan laban sa iyo
  rationale: Malapit sa anyo ng Hebreo at malinaw na tumutukoy sa ipinahayag na hatol o sakuna, hindi sa moral na kasamaan.
theological_decisions:
- issue: Ang kahulugan ng רָעָה kaugnay ng pagkilos ni Yahweh
  choice: kapahamakan
  alternative: kasamaan; sakuna
  rationale: Sa konteksto ng hatol, tumutukoy ito sa masamang sasapitin o kapahamakang ipinahayag laban kay Ahab, hindi sa moral na kasamaan na ginagawa ng Diyos.
- issue: Ang pagkilos ni Yahweh kaugnay ng espiritung sinungaling
  choice: naglagay si Yahweh
  alternative: pinahintulutan ni Yahweh
  rationale: Tuwirang nagsasaad ng pagkilos ang נָתַן. Pinananatili ng salin ang teolohikal na tensiyon sa halip na ipaliwanag ito bilang pahintulot lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “narito” bilang solemne at mariing panawag-pansin; pinanatili ang kongkretong idyomang “sa bibig” at ang tuwirang pahayag ng banal na pagkilos. Inilagay ang mga talababa sa mismong mga salitang tinutukoy ng mga ito.
