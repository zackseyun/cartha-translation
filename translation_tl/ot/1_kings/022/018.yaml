  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: tl
  text: Sinabi ng hari ng Israel kay Jehosafat, “Hindi ba sinabi ko sa iyo na hindi siya magpapahayag ng mabuting propesiya tungkol sa akin, kundi masama[a] lamang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapahamakan.” Literal na mababasa sa Hebreo ang matinding pagsalungat na “mabuti … masama”; sa kontekstong ito, ang “masama” ay maaari ring tumukoy sa di-kanais-nais o mapaminsalang propesiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang payak na “Sinabi” nang hindi na kailangang idagdag ang “At” o “Pagkatapos.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang isinasalin ang construct chain at pinananatili ang titulong nasa Hebreo sa halip na ipalit ang pangalang Ahab.
- source_word: אֶל יְהוֹשָׁפָט
  choice: kay Jehoshafat
  rationale: Ipinahihiwatig ng אֶל ang taong kinakausap. Pangalan lamang ang nasa Hebreo, kaya walang idinagdag na titulong “Haring.”
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Hindi ba sinabi ko sa iyo
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap at ang bahagyang nanunumbat na tono ng hari.
- source_word: לֹא יִתְנַבֵּא
  choice: hindi siya magpopropesiya
  rationale: Ang imperfect ay tumutukoy sa inaasahan o nakagawiang mensahe ni Micaías mula sa pananaw ng naunang sinabi ng hari. Ang anyong “magpopropesiya” ay natural sa Tagalog at hindi pinipilit ang aspektong higit sa ipinahihiwatig ng konteksto.
- source_word: עָלַי
  choice: tungkol sa akin
  rationale: Sa konteksto ng pagsasalita o propesiya, ang עַל ay nangangahulugang “tungkol sa” o “hinggil sa.” Ang “tungkol sa akin” ay malinaw at natural.
- source_word: טוֹב
  choice: mabuti
  rationale: Ginagamit ang pang-uri bilang substantibo, gaya sa Hebreo, at pinananatili ang tuwirang pagsalungat ng “mabuti” at “masama.”
- source_word: כִּי אִם
  choice: kundi ... lamang
  rationale: 'Pagkatapos ng pagtanggi, ipinahahayag ng parirala ang eksklusibong pagsalungat: hindi mabuti, kundi masama lamang.'
- source_word: רָע
  choice: masama
  rationale: Pinananatili ng “masama” ang lantad na magkasalungat na pares na טוֹב at רָע. Sa kontekstong ito maaari rin itong tumukoy sa kapahamakan o di-kanais-nais na pangyayari, kaya inilalahad iyon sa talababa.
theological_decisions:
- issue: Kahulugan ng רָע sa reklamo tungkol sa propesiya
  choice: masama
  alternative: kapahamakan
  rationale: Hindi tahasang nilulutas ng salin kung moral na kasamaan o masamang kahihinatnan ang tinutukoy. Pinananatili sa pangunahing teksto ang leksikal na salungatan ng “mabuti” at “masama,” habang binabanggit sa talababa ang angkop na kontekstuwal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang titulong “hari ng Israel,” ang pangalang Jehoshafat, at ang retorikal na diin ng reklamo. Inilagay ang marker [a] pagkatapos ng “masama,” ang salitang aktuwal na nililinaw ng talababa.
