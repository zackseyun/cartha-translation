id: 1KI.22.52
reference: 1 Kings 22:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: tl
  text: Si Ahazias na anak ni Ahab ay naging hari ng Israel sa Samaria nang ikalabimpitong taon ng paghahari ni Jehosafat na hari ng Juda. Naghari siya sa Israel nang dalawang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormulang ito, ipinahihiwatig ng qatal ang pagluklok ni Ahazias; natural na ipinapahayag sa Tagalog ng “naging hari.”
- source_word: עַל יִשְׂרָאֵל
  choice: ng Israel / sa Israel
  rationale: Kasama ng מלך, ang עַל ay tumutukoy sa bayang pinaghaharian. Ang “hari ng Israel” at “naghari ... sa Israel” ang natural na katumbas sa modernong Tagalog.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang beth ay nagsasaad ng lugar, at ang “sa Samaria” ay malinaw na tumutukoy sa luklukan ng paghahari.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה
  choice: nang ikalabimpitong taon ng paghahari
  rationale: Pinananatili nito ang pormula ng pagtutuos ayon sa taon ng isang hari, habang nililinaw sa Tagalog na taon ng paghahari ang tinutukoy.
- source_word: לִיהוֹשָׁפָט
  choice: ni Jehosafat
  rationale: Sa pormula ng mga taon ng paghahari, ang ל ay nagtatakda kung kaninong paghahari ibinabatay ang bilang; natural itong “ni Jehosafat” sa Tagalog.
- source_word: וַיִּמְלֹךְ
  choice: Naghari siya
  rationale: Pagkatapos ng pahayag tungkol sa pagluklok, inilalahad ng anyong ito ang tagal ng pamumuno. Iniiwasan din nito ang di-kinakailangang pag-uulit ng “naging hari.”
- source_word: שְׁנָתָיִם
  choice: nang dalawang taon
  rationale: Ang anyong dual ay tahasang nangangahulugang dalawang taon; ang “nang” ay natural na pananda ng tagal sa Tagalog.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Si Ahazias na anak ni Ahab
  rationale: Isinasalin nang tuwiran ang ugnayang ama-anak at ginagamit ang “Si” para sa natural na pangungusap sa Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang pinananatili ang titulong naglalarawan kay Jehosafat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nang ikalabimpitong taon ng paghahari” upang maging natural at hindi mapagkamalang edad ni Jehosafat, nang hindi dinaragdagan ang teolohikal na kahulugan.
