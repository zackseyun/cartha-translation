  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: tl
  text: Sinabi pa ni Jehoshafat sa hari ng Israel, “Mangyaring hanapin mo ngayon ang salita ni Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumangguni kay Yahweh para sa isang salita” o “humingi ng salita mula kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi pa
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Sinabi pa” at ipinahihiwatig nitong may idinagdag na pahayag si Jehoshafat.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Isinalin sa karaniwang anyong transliterado sa Tagalog ang pangalang pantangi.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: sa hari ng Israel
  rationale: Tuwirang pinananatili ang titulong maharlika at ang kaugnayan nito sa Israel.
- source_word: דְּרָשׁ נָא
  choice: Mangyaring sumangguni ka
  rationale: Sa kontekstong ito, ang דְּרָשׁ ay paghahanap o pagsangguni para sa patnubay na mula sa Diyos; ipinahahayag ng נָא ang magalang na pakiusap.
- source_word: כַיּוֹם
  choice: ngayon
  rationale: Ipinahihiwatig ng parirala ang agarang pagsangguni sa kasalukuyang pagkakataon; natural at sapat ang “ngayon” sa Tagalog.
- source_word: אֶת דְּבַר יְהוָה
  choice: kay Yahweh upang malaman ang kanyang salita
  rationale: 'Ginawang malinaw sa natural na Tagalog ang Hebreong idyoma: ang pagsangguni ay kay Yahweh at ang hinahanap ay ang kanyang salita. Hindi ito pinaluwag tungo sa “kalooban” o “payo.”'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan at iniiwasang palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng דְּרָשׁ at דְּבַר יְהוָה
  choice: sumangguni kay Yahweh upang malaman ang kanyang salita
  alternative: hanapin ang salita ni Yahweh; humingi ng salita mula kay Yahweh
  rationale: Malinaw at likas sa Tagalog ang piniling anyo, ngunit hindi nito binabago ang “salita” tungo sa mas interpretatibong “kalooban” o “payo.” Inilalahad sa talababa ang tunay na saklaw ng Hebreong idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “mangyaring” upang ihatid ang pakiusap ng נָא nang hindi makaluma; pinanatili ang “salita” bilang mahalagang termino ng teksto.
