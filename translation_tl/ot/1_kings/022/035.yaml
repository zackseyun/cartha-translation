revisions:
- from: Lalong tumindi ang labanan nang araw na iyon[a]. Nanatiling nakatayo ang hari sa karwahe, nakaharap sa Aram[b], at namatay siya nang kinagabihan. Ang dugo mula sa kanyang sugat ay umagos sa ilalim ng karwahe[c].
  to: Lalong tumindi ang labanan noong araw na iyon[a]. Nanatiling nakatayo ang hari sa karwahe, nakaharap sa Aram[b], at namatay siya nang kinagabihan. Ang dugo mula sa sugat ay umagos sa ibabang bahagi ng karwahe[c].
  rationale: Pinalitan ang “nang araw na iyon” ng mas natural na “noong araw na iyon.” Higit na mahalaga, pinalitan ang “sa ilalim ng karwahe,” na maaaring magpahiwatig na nasa labas ang dugo, ng “sa ibabang bahagi ng karwahe,” upang maipahayag ang panloob/mababang lugar na tinutukoy ng metaporikal na Hebreong parirala. Inalis ang “kanyang” bago ang “sugat” dahil wala itong hayag na panghalip sa Hebreo at hindi ito kailangan sa Filipino.
