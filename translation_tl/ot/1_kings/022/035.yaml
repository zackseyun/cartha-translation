base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: tl
  text: Lalong tumindi ang labanan noong araw na iyon[a]. Nanatiling nakatayo ang hari sa karwahe, nakaharap sa Aram[b], at namatay siya nang kinagabihan. Ang dugo mula sa sugat ay umagos sa ibabang bahagi ng karwahe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumakas ang labanan”; sa literal, “umakyat ang labanan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinanatiling nakatayo ang hari sa karwahe.” Maaaring ipahiwatig ng anyong Hebreo na may nagpapanatili sa kanya sa gayong posisyon.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa kandungan ng karwahe,” isang larawang tumutukoy sa panloob o mababang bahagi nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: Lalong tumindi ang labanan
  rationale: Ang literal na 'umakyat ang labanan' ay idyomatikong tumutukoy sa pag-igting ng labanan; malinaw at natural itong naipapahayag ng 'lalong tumindi.'
- source_word: מָעֳמָד
  choice: Nanatiling nakatayo
  rationale: Ipinahihiwatig ng anyo na ang hari ay pinanatili o nanatili sa nakatayong posisyon. Pinananatili ng salin ang posibleng pasibong diwa nang hindi tahasang sinasabing inalalayan o itinukod siya.
- source_word: נֹכַח אֲרָם
  choice: nakaharap sa Aram
  rationale: Tuwirang inilalarawan ang posisyon ng hari laban o katapat ng Aram, habang pinananatili ang sinaunang pangalang pantangi.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: at namatay siya nang kinagabihan
  rationale: Natural na temporal na pahayag sa modernong Tagalog para sa pagkamatay sa gabi ng araw ding iyon.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: Ang dugo mula sa kanyang sugat ay umagos
  rationale: Ang יצק ay may diwang pagbuhos o pag-agos; ang 'umagos' ang natural na paglalarawan sa dugong nanggagaling sa sugat.
- source_word: חֵיק הָרָכֶב
  choice: sa ilalim ng karwahe
  rationale: Ang literal na 'kandungan/dibdib ng karwahe' ay metaporikal na tumutukoy sa panloob at mababang bahagi kung saan naiipon ang dugo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Hinati sa tatlong pangungusap ang mahabang Hebreong koordinasyon upang maging natural sa Tagalog, nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari. Inilagay ang bawat talababa kasunod ng mismong pariralang nililinaw nito.
