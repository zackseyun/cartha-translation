base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/037.yaml
  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: tl
  text: Kaya namatay ang hari at dinala siya sa Samaria[a]. Inilibing nila ang hari sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at namatay ang hari, at dumating siya sa Samaria.” Ang diwa ay dinala sa Samaria ang katawan ng hari pagkamatay niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: namatay
  rationale: Ang Qal wayyiqtol ng מות ay nagsasaad ng pangyayari ng pagkamatay sa sunod-sunod na salaysay; natural itong isalin na “namatay.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalan ito para sa haring kilala na sa konteksto; pinananatili ang katawagang Hebreo sa halip na idagdag ang pangalang Ahab.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: dinala siya sa Samaria
  rationale: Bagaman literal na aktibong isahan ang pandiwa (“at dumating siya sa Samaria”), kasunod ito ng pagkamatay ng hari. Ipinahihiwatig ng konteksto na ang katawan niya ang dinala roon; ito ang natural na pagpapahayag sa Tagalog.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Ito ang karaniwang anyo sa Tagalog ng pangalan ng lugar.
- source_word: וַיִּקְבְּרוּ
  choice: inilibing nila
  rationale: Ikatlong panauhang maramihan ang pandiwa at hindi tinutukoy ang mga gumawa; pinananatili ng “inilibing nila” ang di-tiyak na simuno.
- source_word: אֶת הַמֶּלֶךְ
  choice: ang hari
  rationale: Inuulit ng Hebreo ang pangngalan sa halip na gumamit ng panghalip; pinananatili ang pag-uulit para sa linaw at diin.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang בְּ ay tumutukoy dito sa lugar ng paglilibing; natural sa Tagalog ang “sa Samaria.”
