base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: tl
  text: Ngunit hindi inalis ang mga mataas na dako[a]; patuloy pa ring naghahandog at nagsusunog ng insenso ang mga tao sa mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pook-sambahan sa matataas na lugar.” Ang terminong Hebreo ay tumutukoy sa mga lokal na pook-kulto, na karaniwang tinatawag na “mga mataas na dako.”
    reason: lexical_alternative
  - marker: b
    text: Hindi sinasabi ng talata kung ang mga gawaing ito ay para sa PANGINOON sa mga di-awtorisadong pook o bahagi ng mas malawak na pagsamba sa mga diyus-diyosan.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Likas na panandang pasalungat ito sa naunang positibong pagtatasa sa hari.
- source_word: הַבָּמוֹת
  choice: ang matataas na sambahan
  rationale: Tumutukoy ang בָּמוֹת sa mga lokal na pook ng pagsamba, na kadalasa’y nasa mataas na lugar. Mas malinaw sa karaniwang mambabasang Filipino ang “matataas na sambahan” kaysa literal na “matataas na lugar,” habang pinananatili ang kaugnayan sa kataasan.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Dahil ang mga sambahan ang simuno, ang parirala ay nangangahulugang nanatili ang mga ito at hindi ipinatanggal.
- source_word: עוֹד
  choice: patuloy pa rin
  rationale: Ipinahihiwatig ang nagpapatuloy at nakaugaliang gawain sa kabila ng reporma.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tuwirang kolektibong pagtukoy sa mamamayan.
- source_word: מְזַבְּחִים
  choice: naghahandog
  rationale: Ipinapahayag ng participle ang nagpapatuloy o nakaugaliang paghahandog; natural itong naihahatid ng “patuloy pa ring naghahandog.”
- source_word: וּמְקַטְּרִים
  choice: at nagsusunog ng insenso
  rationale: Sa kontekstong panrelihiyon, karaniwang tumutukoy ang קטר sa pagsusunog ng insenso o handog upang pausukin; “nagsusunog ng insenso” ang pinakanatural na katumbas dito.
- source_word: בַּבָּמוֹת
  choice: sa mga iyon
  rationale: Ang panghalip ay malinaw na bumabalik sa “matataas na sambahan” at umiiwas sa mabigat na pag-uulit nang hindi nawawala ang lokasyon.
theological_decisions:
- issue: Kalikasan at pinag-uukulan ng pagsamba sa matataas na sambahan
  choice: Inilarawan lamang na naghahandog at nagsusunog ng insenso roon ang mga tao, nang hindi tinutukoy kung kanino inihahandog.
  alternative: Sabihing ito ay di-awtorisadong pagsamba sa PANGINOON, o tahasang pagsamba sa mga diyus-diyosan.
  rationale: Hindi tinutukoy ng Hebreo ang pinag-uukulan ng mga handog. Pinupuna nito ang pananatili ng mga pook na iyon ngunit hindi nito nilulutas kung ang gawain ay di-awtorisadong pagsamba sa PANGINOON o mas malawak na idolatriya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matataas na sambahan” upang maipakita na mga pook-kulto ang tinutukoy, hindi lamang matataas na lokasyon. Pinanatili ng “patuloy pa ring” ang nagpapatuloy at nakaugaliang diwa ng mga participle.
