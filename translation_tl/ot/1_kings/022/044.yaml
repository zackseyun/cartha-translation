    rationale: Kung ang pangunahing salin ay “mga mataas na dako,” dapat ipaliwanag sa Filipino ang teknikal na kahulugan at magbigay ng Filipino na alternatibo, sa halip na iwan ang Ingles na katawagan bilang tradisyonal na label.
