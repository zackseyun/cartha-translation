  source_fidelity: Wastong naihahatid ng draft ang pasalungat na אַךְ, ang hindi pag-aalis sa mga בָּמוֹת, at ang patuloy na gawaing isinasaad ng mga participle. Gayunman, ang “matataas na sambahan” ay masyadong nagpapahiwatig ng isang gusali o institusyong sambahan; ang בָּמוֹת ay mga lokal na pook-kulto at hindi kinakailangang mga gusali. Ang “mataas na dako” ay mas tumpak at nakaugat na katawagan, habang ipinapaliwanag ng talababa ang kahulugan nito.
  naturalness: Natural at marangal sa makabagong Filipino ang “Ngunit hindi inalis ang mga mataas na dako; patuloy pa ring naghahandog at nagsusunog ng insenso ang mga tao sa mga iyon.” Pinananatili nito ang pag-uulit ng lokasyong mahalaga sa Hebreo nang walang mabigat na konstruksyon.
  terminology: Pinalitan ang “matataas na sambahan” ng “mga mataas na dako” upang iwasan ang anachronistic o sobrang tiyak na impresyon ng “sambahan.” Pinanatili ang “naghahandog,” “nagsusunog ng insenso,” at ang di-pagtukoy sa pinag-uukulan ng pagsamba.
  issues:
