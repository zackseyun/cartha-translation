    issue: Ang “matataas na sambahan” ay masyadong tiyak na salin ng בָּמוֹת.
    rationale: Maaaring magpahiwatig ang “sambahan” ng gusali o isang itinatag na lugar ng pagsamba. Ang Hebreo ay tumutukoy sa mga lokal na elevated cult sites; hindi nito hinihingi na mga gusali ang mga ito. Ang “mga mataas na dako” ay mas tapat sa termino at maaaring linawin sa talababa.
  - severity: low
