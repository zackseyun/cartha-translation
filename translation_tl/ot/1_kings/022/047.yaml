  text: וְ/יֶ֨תֶר֙ הַ/קָּדֵ֔שׁ אֲשֶׁ֣ר נִשְׁאַ֔ר בִּ/ימֵ֖י אָסָ֣א אָבִ֑י/ו בִּעֵ֖ר מִן הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: tl
  text: At inalis niya mula sa lupain ang nalalabi sa mga lalaking prostitutong pangkulto[a] mula pa noong panahon ng kanyang amang si Asa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay nasa panlalaking anyong isahan ngunit maaaring tumukoy sa isang pangkat; tumutukoy ito sa mga lalaking kaugnay ng kultikong gawaing seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: At ... ang iba pang
  rationale: Ipinahihiwatig ng יֶתֶר ang nalalabi sa isang pangkat. Natural sa modernong Filipino ang “iba pang ... na natira” at malinaw na tumutukoy sa mga hindi pa naalis.
- source_word: הַקָּדֵשׁ
  choice: mga lalaking prostitutong pangkulto
  rationale: Sa kontekstong ito, ang panlalaking katawagang קָדֵשׁ ay tumutukoy sa mga lalaking kaugnay ng ipinagbabawal na seksuwal na gawain sa kulto. Pinananatili ng salin ang panlalaking anyo at ang kultikong konteksto, at iniiwasan ang tradisyonal ngunit di-tumpak na katawagang “sodomita.”
- source_word: אֲשֶׁר נִשְׁאַר
  choice: na natira
  rationale: 'Maikli at likas itong pagpapahayag ng resultang diwa ng נִשְׁאַר: sila ang nanatili o nalabi mula sa naunang panahon.'
- source_word: בִּימֵי אָסָא אָבִיו
  choice: mula pa noong panahon ng kanyang amang si Asa
  rationale: Bagaman literal na “sa mga araw ni Asa na kanyang ama,” ipinakikita ng sugnay na ang mga taong ito ay nalabi mula sa panahong iyon. Ang “mula pa noong panahon” ay natural at malinaw sa Filipino nang hindi dinaragdagan ang pangyayari.
- source_word: בִּעֵר
  choice: inalis niya
  rationale: Sa pariralang בִּעֵר מִן־הָאָרֶץ, ang pandiwa ay nangangahulugang pawiin o alisin. Hindi ipinapalagay ng salin na sinunog o pinatay sila, sapagkat hindi tinutukoy ng teksto ang paraan.
- source_word: מִן הָאָרֶץ
  choice: sa lupain
  rationale: Kasunod ng pandiwang “inalis,” ang “sa lupain” ang likas na katumbas sa Filipino ng pag-aalis mula sa nasasakupang lupain, na sa konteksto ay Juda at hindi ang buong daigdig.
theological_decisions:
- issue: Pagpapakahulugan sa קָדֵשׁ sa sensitibong kontekstong panrelihiyon at seksuwal
  choice: mga lalaking prostitutong pangkulto
  alternative: mga prostitutong pangkulto; mga lingkod ng kulto
  rationale: Ang panlalaking anyo at konteksto ay sumusuporta sa pagtukoy sa mga lalaking sangkot sa ipinagbabawal na kultikong gawaing seksuwal. Tahasang isinasalin ito upang hindi mawala ang kasarian at kultikong dimensiyon, ngunit hindi ginagamit ang “sodomita,” na nag-aangkat ng mas huling tradisyonal at doktrinal na mga pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “prostitutong pangkulto” bilang madaling maunawaang katawagan; nilinaw ang panlalaking anyo ng Hebreo sa pangunahing teksto at ipinaliwanag sa talababa.
