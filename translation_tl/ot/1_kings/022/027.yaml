base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: tl
  text: 'at sabihin mo, ‘Ganito ang sabi ng hari: Ikulong ninyo ang taong ito, at pakainin siya ng tinapay ng paghihirap at painumin ng tubig ng paghihirap[a] hanggang sa makabalik akong ligtas.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay ng kagipitan” at “tubig ng kagipitan”; malamang na tumutukoy ang pananalitang ito sa kakaunti o napakahirap na rasyon sa bilangguan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ganito ang sabi ng hari
  rationale: Pinananatili ang pormal na pormula ng pagpapahayag, ngunit likas at malinaw sa modernong Filipino.
- source_word: שִׂימוּ אֶת זֶה בֵּית הַכֶּלֶא
  choice: Ikulong ninyo ang taong ito
  rationale: Likas na katumbas sa Filipino ng paglalagay sa taong tinutukoy sa bilangguan; ipinahihiwatig ng konteksto na si Micaias ang tinutukoy.
- source_word: וְהַאֲכִילֻהוּ
  choice: at pakainin siya ... at painumin
  rationale: Ang 'pakainin' ay tuwirang katumbas ng causative imperative; idinagdag ang likas na pandiwang 'painumin' upang maipahayag sa Filipino ang magkatambal na tinapay at tubig.
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: tinapay ng paghihirap at ... tubig ng paghihirap
  rationale: Pinananatili ang paulit-ulit at matinding anyo ng Hebreo sa halip na ipakahulugan agad bilang kakaunti o maralitang rasyon.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: hanggang sa makabalik akong ligtas
  rationale: Sa kontekstong pag-uwi mula sa digmaan, natural na ipinahahayag ng 'makabalik akong ligtas' ang pagdating nang walang kapahamakan, habang pinananatili ang kumpiyansa at kabalintunaan ng sinabi ng hari.
theological_decisions:
- issue: Saklaw ng בְשָׁלוֹם sa pahayag ni Ahab
  choice: makabalik akong ligtas
  alternative: makabalik ako nang payapa
  rationale: Maaaring tumukoy ang שָׁלוֹם sa ligtas at walang pinsalang pagbabalik. Ang napiling salin ay natural sa Filipino at hindi ito pinalalawak upang tiyaking nangangahulugang tagumpay sa digmaan.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Ginamit ang “Ganito ang sabi ng hari” upang mapanatili ang anyo ng maharlikang utos; iniwasan ang sobrang literal na “bahay ng bilangguan” dahil hindi ito likas sa Filipino.
