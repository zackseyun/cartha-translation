  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: tl
  text: Ngunit sinabi ni Jehoshafat[a], “Wala na bang propeta ni Yahweh rito na maaari nating sangguniin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ngunit sinabi ni Jehoshafat, ‘Wala na bang ibang propeta ni Yahweh rito na maaari nating sangguniin?’”'
    reason: Maaaring ipahiwatig ng עוֹד ang “iba pa” o “isa pang” propeta, hindi lamang ang nananatili o naririyan pa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay natural na nagpapakita ng pagsalungat ni Jehoshafat sa naunang pagsangguni sa ibang mga propeta.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Makabagong transliterasyon sa Filipino na malapit sa anyong Hebreo ng pangalan.
- source_word: הֲאֵין
  choice: Wala na bang
  rationale: Pinananatili ang negatibong tanong na naghahanap ng pagpapatibay, habang natural ang ayos sa Filipino.
- source_word: פֹּה
  choice: rito
  rationale: Payak at natural na katumbas ng pang-abay na tumutukoy sa lugar.
- source_word: נָבִיא
  choice: propeta
  rationale: Karaniwang katawagan sa Filipino para sa taong nagsasalita bilang kinatawan ng Diyos.
- source_word: לַיהוָה
  choice: ni Yahweh
  rationale: Ipinahahayag ang kaugnayan ng propeta kay Yahweh—isang propetang kabilang o nagsasalita para sa kanya—at pinananatili ang personal na banal na pangalan.
- source_word: עוֹד
  choice: na ... pa
  rationale: Sa pariralang “Wala na bang,” ipinahihiwatig na may hinahanap pang natitirang propeta. Ang posibleng diwang “ibang propeta” ay pinananatili sa talababa.
- source_word: וְנִדְרְשָׁה
  choice: na maaari nating sangguniin
  rationale: Natural na ipinahahayag sa Filipino ang layunin o pagnanais ng unang panauhang maramihang cohortative.
- source_word: מֵאֹתוֹ
  choice: sangguniin
  rationale: Ang “sangguniin” ay likas na pandiwang Filipino para sa paghingi ng pahayag o patnubay mula sa isang propeta, nang hindi labis na nililinaw kung ang sagot ay mula sa propeta o sa Diyos sa pamamagitan niya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na tipanang pangalan sa halip na palitan ng isang titulo.
- issue: Kung ang pagsangguni ay sa propeta o sa Diyos sa pamamagitan ng propeta
  choice: maaari nating sangguniin
  alternative: maaari tayong sumangguni sa Diyos sa pamamagitan niya
  rationale: Hindi tahasang binabanggit ang Diyos bilang layon ng pandiwa sa Hebreo. Pinananatili ng pangunahing teksto ang maigsi at bahagyang bukas na pagkakahayag ng pinagmulan, nang hindi itinatanggi ang tungkulin ng propeta bilang tagapamagitan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rito” at “sangguniin” upang maging natural sa karaniwang mambabasa habang pinananatili ang pormal na himig at ang negatibong anyo ng tanong sa Hebreo.
