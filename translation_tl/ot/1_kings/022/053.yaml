id: 1KI.22.53
reference: 1 Kings 22:53
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh at namuhay ayon sa landas ng kanyang ama, sa landas ng kanyang ina, at sa landas ni Jeroboam na anak ni Nebat, na naging dahilan upang magkasala ang Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas at malinaw na salin ng idyomang Hebreo na עשה + הרע, habang pinananatili ang tahasang moral na paghatol.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang larawang Hebreo ng pagsusuri 'sa mga mata/paningin' at ginagamit ang personal na pangalang Yahweh para sa Tetragrammaton.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: namuhay ayon sa landas
  rationale: Ang parirala ay tumutukoy sa asal o paraan ng pamumuhay, hindi lamang sa literal na paglakad. Pinananatili ng 'landas' ang metapora sa natural na Tagalog.
- source_word: אָבִיו ... אִמּוֹ
  choice: kanyang ama ... kanyang ina
  rationale: Tahasang pinananatili ang kapwa magulang at ang pag-uulit na nagbibigay-diin sa pinagmanahang huwaran.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwan at natural na anyo ng patronimiko sa modernong Tagalog.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: naging dahilan upang magkasala ang Israel
  rationale: Ipinahahayag ang causative na puwersa ng Hiphil nang hindi ipinahihiwatig na inalis ang pananagutan ng Israel.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ang tekstong Hebreo ay may Tetragrammaton; pinananatili ang banal na pangalan bilang Yahweh sa halip na palitan ito ng titulo.
- issue: Causative na pananagutan sa kasalanan ng Israel
  choice: naging dahilan upang magkasala ang Israel
  alternative: inakay ang Israel sa pagkakasala
  rationale: Mas tuwirang pinananatili nito ang causative na anyo ng הֶחֱטִיא at iniiwasang gawing mas malambot o mas interpretatibo ang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'namuhay ayon sa landas' upang maging natural ang idyomang moral na paglakad, habang pinananatili ang tatlong ulit na 'landas' bilang retorikal na diin ng Hebreo.
