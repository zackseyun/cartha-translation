lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: nanatili sila
  rationale: Bagaman ang pangunahing kahulugan ng ישׁב ay “umupo” o “manirahan,” sa salaysay na may takdang haba ng panahon ay ipinahihiwatig nito ang pagpapatuloy ng isang kalagayan.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: sa loob ng tatlong taon
  rationale: Likas na pagpapahayag sa Filipino ng accusative of duration sa Hebreo.
- source_word: אֵין מִלְחָמָה
  choice: walang digmaan
  rationale: Tuwirang pinananatili ang pahayag na walang naganap na digmaan, at natural itong kaugnay ng “nanatili.”
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ng ... at ...
  rationale: Karaniwang anyo sa Filipino para sa inuulit na Hebreong panandang ugnayan.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo sa halip na palitan ng mas huling heograpikong katawagang “Siria.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang transliterasyon sa modernong Filipino.
