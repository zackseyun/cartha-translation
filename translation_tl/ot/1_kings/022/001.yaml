  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: tl
  text: Sa loob ng tatlong taon, nanatiling walang digmaan sa pagitan ng Aram at Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tatlong taon na walang digmaan sa pagitan ng Aram at Israel.”
