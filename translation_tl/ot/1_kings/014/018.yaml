id: 1KI.14.18
reference: 1 Kings 14:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: tl
  text: Inilibing nila siya, at ipinagluksa siya ng buong Israel, ayon sa salita ni Yahweh na sinabi niya sa pamamagitan ng lingkod niyang si Ahias na propeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Inilibing nila siya
  rationale: Tuwirang isinasalin ang Qal wayyiqtol at layon nito bilang sunod na pangyayari sa salaysay; hindi na kailangan ang paulit-ulit na pang-ugnay sa natural na Filipino.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: ipinagluksa siya
  rationale: Ang ספד ay tumutukoy sa pampublikong pagluluksa sa namatay; natural at marangal sa Filipino ang “ipinagluksa siya” nang hindi ipinapalagay na tiyak na may pagtangis o paghiyaw.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong pagtukoy sa buong bayan sa karaniwang anyong Filipino.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ang pormal na pananalita tungkol sa katuparan ng ipinahayag na salita at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi niya
  rationale: Ang sugnay na panuring ay tumutukoy sa naunang “salita”; sapat sa Filipino ang aspektong ganap upang ipakitang nauna ang pagsasalita sa pangyayari.
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Ipinahahayag nang natural sa modernong Filipino ang Hebreong idyoma ng tagapamagitan o ahensiya nang hindi literal na ginagamit ang “sa kamay ng.”
- source_word: עַבְדּוֹ
  choice: lingkod niyang
  rationale: Sa pormulang pang-propeta, ang “lingkod” ang angkop na salin para sa inatasang paglilingkod at hindi kinakailangang magpahiwatig ng pagkaalipin.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: si Ahias na propeta
  rationale: Ginagamit ang nakaugaliang anyong Tagalog na Ahias at pinananatili ang tiyak na tungkulin niyang propeta.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Pormula ng propetikong pamamagitan na בְּיַד עַבְדּוֹ
  choice: sa pamamagitan ng lingkod niyang
  alternative: sa kamay ng lingkod niyang
  rationale: Pinananatili ang ideya na ang salita ni Yahweh ay ipinahayag sa pamamagitan ni Ahias, ngunit inilalahad ang idyoma sa malinaw at kasalukuyang Filipino nang walang dagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormal na pormulang “ayon sa salita ni Yahweh,” habang ginawang natural ang Hebreong idyomang בְּיַד bilang “sa pamamagitan ng.”
