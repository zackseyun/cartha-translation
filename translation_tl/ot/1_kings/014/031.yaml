  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang panghari at ang matalinghagang pahayag tungkol sa kamatayan, ngunit iniwasan ang sobrang literal na “natulog,” na maaaring mapagkamalang karaniwang pagtulog.
