base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: tl
  text: At namahinga si Rehoboam kasama ng kanyang mga ninuno at inilibing kasama nila sa Lunsod ni David. Ang pangalan ng kanyang ina ay Naama na Ammonita.[a] Ang anak niyang si Abijam[b] ang nagharing kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pambabae ang anyo ng salitang tumutukoy sa taga-Ammon; malinaw na kinikilala si Naama bilang isang babaeng Ammonita.
    reason: lexical_alternative
  - marker: b
    text: Tinatawag na Abijah ang haring ito sa ilang ibang talata; “Abijam” ang anyo ng pangalan sa talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: namahinga ... kasama ng kanyang mga ninuno
  rationale: Ang pandiwang שׁכב kasama ng pariralang “kasama ng kanyang mga ninuno” ay pormulang tumutukoy sa pagkamatay. Pinananatili ng “namahinga” ang matalinghagang anyo nang hindi nagmumukhang ordinaryong pagtulog sa Filipino.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: inilibing kasama nila
  rationale: Tuwirang isinasalin ang pasibong pandiwang קבר. Ginamit ang “nila” upang maiwasan ang mabigat na pag-uulit, habang malinaw na tumutukoy pa rin ito sa kanyang mga ninuno.
- source_word: בְּעִיר דָּוִד
  choice: sa Lunsod ni David
  rationale: Natural at kinikilalang anyo sa Filipino para sa pangalan ng lugar na “City of David.”
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormulang nagbibigay ng pagkakakilanlan sa ina ng hari.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: Naama na Ammonita
  rationale: Ang hulaping pambabae sa “Ammonita” ay natural na nagpapahayag sa Filipino na siya ay babaeng mula sa Ammon, alinsunod sa pambabaeng gentilic ng Hebreo.
- source_word: וַיִּמְלֹךְ
  choice: ang nagharing
  rationale: Ipinahahayag ang paghalili sa trono sa natural na salaysay sa Filipino.
- source_word: אֲבִיָּם
  choice: Abijam
  rationale: Sinusunod ang partikular na anyo ng pangalan sa tekstong Hebreo ng talatang ito, sa halip na ipalit ang anyong Abijah na matatagpuan sa ibang mga talata.
- source_word: תַּחְתָּיו
  choice: kapalit niya
  rationale: Natural na katumbas sa Filipino ng idyomang tumutukoy sa paghalili sa puwesto o trono.
