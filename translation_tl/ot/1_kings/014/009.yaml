base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: tl
  text: Ngunit mas masama ang ginawa mo kaysa sa lahat ng nauna sa iyo. Humayo ka at gumawa para sa iyong sarili ng ibang mga diyos at mga imaheng hinulma[a] upang galitin ako, at itinapon mo ako sa likod mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga imaheng binuhos sa hulma”; tumutukoy ang Hebreo sa mga imaheng ginawa sa pamamagitan ng paghuhulma, malamang na mga bagay na metal na ginagamit sa pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת
  choice: gumawa ka ng higit na masama
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapahayag ang paghahambing na kasunod sa מִכֹּל.
- source_word: מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: kaysa sa lahat ng nauna sa iyo
  rationale: Ipinahahayag nito ang temporal na diwa ng לְפָנֶיךָ at iniiwasang ipakahulugan iyon bilang pisikal na lokasyon.
- source_word: וַתֵּלֶךְ
  choice: Humayo ka
  rationale: Pinananatili ang hiwalay at mariing sunod na kilos ng Hebreo sa isang marangal ngunit nauunawaang anyo.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: gumawa para sa iyong sarili
  rationale: Pinananatili ang reflexive o benefactive na diwa ng לְּךָ.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang katumbas ito ng karaniwang pananalitang tipan para sa mga diyos na sinasamba bukod kay YHWH, nang hindi idinaragdag ang diwang 'dayuhan.'
- source_word: וּמַסֵּכוֹת
  choice: mga imaheng hinulma
  rationale: Ipinakikita ng 'hinulma' na ang tinutukoy ay mga imaheng ginawa sa pamamagitan ng paghuhulma o pagbubuhos ng materyal, karaniwang metal, nang hindi agad pinapantay ang dalawang magkaugnay na katawagang 'mga diyos' at 'mga imahen.'
- source_word: לְהַכְעִיסֵנִי
  choice: upang galitin ako
  rationale: 'Natural at tuwirang ipinapahayag sa Tagalog ang causative na diwa: ang mga ginawa niya ay pumukaw sa galit ng Diyos.'
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: itinapon mo ako sa likuran mo
  rationale: Pinananatili ang matindi at pisikal na talinghaga ng paghamak at pagtakwil sa Diyos, sa halip na palabuin ito bilang simpleng pagwawalang-bahala.
theological_decisions:
- issue: Paglalarawan sa idolatriya nang hindi pinahihina ang paglabag sa tipan
  choice: ibang mga diyos at mga imaheng hinulma
  alternative: mga diyos ng ibang bayan at mga diyus-diyosan
  rationale: Pinananatiling magkahiwalay ang teolohikal na kategoryang 'ibang mga diyos' at ang kongkretong mga bagay na sinasamba, habang hindi nagdaragdag ng diwang 'dayuhan' na wala sa parirala.
- issue: Pagpapanatili sa lakas ng talinghaga ng pagtakwil
  choice: itinapon mo ako sa likuran mo
  alternative: winalang-bahala mo ako
  rationale: Ang Hebreo ay gumagamit ng marahas at tahasang talinghaga. Ang literal na larawan ay mahalaga sa bigat ng paratang at hindi dapat gawing abstrakto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang 'Humayo' upang mapanatili ang mariing sunod na kilos sa Hebreo, samantalang ang iba pang pananalita ay nananatiling pangkaraniwan at madaling maunawaan. Ang panghalip na isahan na 'ikaw' ay pinanatili sapagkat si Jeroboam ang tuwirang kinakausap.
