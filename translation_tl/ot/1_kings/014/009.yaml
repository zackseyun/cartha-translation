  to: Ngunit mas masama ang ginawa mo kaysa sa lahat ng nauna sa iyo. Humayo ka at gumawa para sa iyong sarili ng ibang mga diyos at mga imaheng hinulma[a] upang galitin ako, at itinapon mo ako sa likod mo.
