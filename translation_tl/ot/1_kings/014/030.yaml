  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: tl
  text: At nagkaroon ng digmaan sa pagitan nina Rehoboam at Jeroboam sa buong panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa lahat ng araw.” Ipinahihiwatig ng idyomang Hebreo na nagpatuloy ang alitan sa buong panahon ng kanilang buhay o paghahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: At nagkaroon ng digmaan
  rationale: Ang מִלְחָמָה ay “digmaan,” at ang הָיְתָה ay payak na pandiwang eksistensiyal. Likas sa modernong Filipino ang “nagkaroon ng digmaan,” nang hindi idinaragdag sa pandiwa ang ideya ng pagpapatuloy na nasa hulíng parirala.
- source_word: בֵין ... וּ/בֵין
  choice: sa pagitan nina ... at ...
  rationale: Tinutukoy ng magkatambal na pang-ukol ang dalawang taong magkatunggali. Ang “sa pagitan nina ... at ...” ang natural na katumbas sa Tagalog.
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Ginamit ang nakasanayang baybay ng pangalang ito sa modernong saling Filipino.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Ginamit ang nakasanayang baybay ng pangalang ito sa modernong saling Filipino.
- source_word: כָּל הַיָּמִים
  choice: habang sila'y nabubuhay
  rationale: Literal itong “lahat ng mga araw.” Sa konteksto ng dalawang hari, ipinahihiwatig ng idyoma na nanatili ang alitan sa buong panahon ng kanilang buhay o paghahari. Pinananatili sa talababa ang mas pormal na anyo at ang saklaw na maaaring tumukoy sa buhay o paghahari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinili ang “digmaan” kaysa “pakikidigma” dahil inilalarawan ng talata ang umiiral na alitan, hindi ang paraan ng pakikipaglaban. Ang hulíng parirala ay isinaling idyomatiko, habang inilalahad sa talababa ang literal na anyo at ang tunay na saklaw nito.
