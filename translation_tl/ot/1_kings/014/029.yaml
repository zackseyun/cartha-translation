  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Rehoboam at ang lahat ng ginawa niya, hindi ba nakasulat ang mga iyon sa Aklat ng mga Salaysay ng mga Hari ng Juda[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taunang tala ng mga hari ng Juda.” Ang pariralang Hebreo na isinaling “mga Salaysay” ay tumutukoy sa isang maharlikang talaan ng mga pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang pangkasaysayan, ang יֶתֶר ay tumutukoy sa nalalabing bahagi at ang דִּבְרֵי ay sa mga gawain o pangyayari tungkol sa paghahari, hindi lamang sa mga salitang sinabi. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Ginamit ang karaniwang anyo ng pangalan sa mga saling Tagalog ng Bibliya.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng ginawa niya
  rationale: Tuwirang pinananatili ang malawak at walang moral na pagtatayang diwa ng pandiwang עשה.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa, pati ang pasibong diwa ng “nakasulat.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring pisikal na balumbon ang tinutukoy, ang “sa Aklat” ang likas na pormula sa Tagalog para sa pagsangguni sa isang nakasulat na tala.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Salaysay
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa opisyal na kronika o taunang tala ng mga pangyayari; ang “mga Salaysay” ay malinaw at marangal, habang inilalahad sa talababa ang alternatibong “mga taunang tala.”
- source_word: לְמַלְכֵי יְהוּדָה
  choice: ng mga Hari ng Juda
  rationale: 'Ang לְ ay inuunawa bilang ugnayang nagpapakilala sa pamagat ng talaan: ang kronika na nauukol sa mga hari ng Juda.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang pormulang retorikal ng tekstong Hebreo at ang bahagyang pag-uulit ng “mga ginawa,” sapagkat bahagi ito ng estilong pangkasaysayan ng talata. Inilagay ang panandang talababa sa pariralang talagang ipinapaliwanag nito.
