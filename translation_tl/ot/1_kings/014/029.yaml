  source_fidelity: 'Tumpak na naipapahayag ang pormulang Hebreo: ang nalalabing tala ng mga ginawa ni Rehoboam, ang kabuuan ng kanyang ginawa, at ang retorikal na tanong kung ang mga ito ay nakasulat sa opisyal na talaan ng mga hari ng Juda. Napanatili ang pasibong diwa ng כְּתוּבִים at ang saklaw na walang dagdag na pagsusuri ng עָשָׂה.'
