  terminology: Ang “Aklat ng mga Salaysay ng mga Hari ng Juda” ay angkop na salin ng pamagat na pang-arkibo at hindi nito ipinagpapalagay na ito ang kanonikal na aklat ng Mga Cronica. Ang talababa ay wastong nagbibigay ng “mga taunang tala” bilang alternatibong pagpapahayag. Ang mga pangalang Rehoboam at Juda ay pare-pareho at katanggap-tanggap sa target na rehistro.
