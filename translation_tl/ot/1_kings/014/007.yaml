  to: 'Humayo ka at sabihin mo kay Jeroboam: ‘Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Dahil itinaas kita mula sa mga tao at ginawa kitang pinuno ng bayan kong Israel,’'
  rationale: Pinalitan ang “sinabi” ng “sabi” upang umayon sa karaniwang puwersa ng pormulang Hebreo at inayos ang bantas at mga panipi. Pinalitan din ang “mula sa gitna ng bayan” ng mas natural na “mula sa mga tao,” nang hindi binabago ang diwa ng pagpili mula sa hanay ng sambayanan. Pinanatili ang hulíng kuwit dahil ang talata ay simula ng isang pahayag na nagpapatuloy sa kasunod na talata.
