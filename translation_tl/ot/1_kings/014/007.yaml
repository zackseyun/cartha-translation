  source_fidelity: 'Tumpak ang pangunahing kahulugan: utos na maghatid ng mensahe kay Jeroboam, pormulang pangpropeta, at ang pag-angat at paghirang sa kanya bilang pinuno ng Israel. Gayunman, ang Hebreong כֹּה אָמַר ay isang kasalukuyang pormula (“Ganito ang sabi”), hindi pangkaraniwang nakaraang panahong “Ganito ang sinabi.”'
  naturalness: Marangal at karaniwang nauunawaan ang “Humayo ka.” Mas likas at mas malinaw ang wastong bantas na ipakilala ang tuwirang pahayag pagkatapos ng “kay Jeroboam,” sa halip na maglagay ng magkapatong na panipi.
  terminology: Wasto ang “Yahweh,” “Diyos ng Israel,” at “pinuno.” Ang “mga tao” ay mas natural na katumbas ng הָעָם sa pariralang “mula sa mga tao,” habang pinananatili ang “bayan kong Israel” para sa עַמִּי יִשְׂרָאֵל.
