  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: tl
  text: 'Humayo ka at sabihin mo kay Jeroboam: ‘Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Dahil itinaas kita mula sa mga tao at ginawa kitang pinuno ng bayan kong Israel,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Humayo ka at sabihin mo
  rationale: Dalawang pambabaeng isahan na pautos ang ginamit. Ang “humayo” ay marangal at likas sa atas na ihatid ang isang mensahe, habang malinaw ang “sabihin mo.”
- source_word: לְיָרָבְעָם
  choice: kay Jeroboam
  rationale: Ang לְ ay tumutukoy sa taong paghahatiran ng mensahe; “kay” ang likas na katumbas sa Tagalog.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili nito ang kinikilalang pormula ng mensaherong propetiko habang natural sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang tetragramaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang ipinahahayag ng pariralang construct ang pagkakakilanlan ni Yahweh bilang Diyos ng Israel.
- source_word: יַעַן אֲשֶׁר
  choice: Dahil
  rationale: Malinaw nitong pinananatili ang sanhi o batayang ipinakikilala ng parirala para sa kasunod na pahayag ng paghatol.
- source_word: הֲרִימֹתִיךָ
  choice: itinaas kita
  rationale: Pinananatili ang metapora ng רום at malinaw ding ipinahihiwatig ang pag-angat ni Jeroboam sa katayuan.
- source_word: מִתּוֹךְ הָעָם
  choice: mula sa gitna ng bayan
  rationale: Malapit ito sa anyo ng Hebreo at likas na nagpapahayag na pinili siya mula mismo sa sambayanan.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: at ginawa kitang pinuno
  rationale: Ang literal na “ibinigay kita bilang pinuno” ay di-likas sa Tagalog; ipinahahayag ng “ginawa kitang pinuno” ang paghirang sa tungkulin nang hindi binabago ang ahensiya ng Diyos.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: ng bayan kong Israel
  rationale: Sa Tagalog, ang “pinuno ng” ang natural na paraan upang ipahayag ang pamamahala sa isang bayan; pinananatili rin ang pag-aangking “bayan ko.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng נָגִיד sa kontekstong pampamahalaan
  choice: pinuno
  alternative: tagapamahala; prinsipe
  rationale: Ang salita ay tumutukoy sa taong inilagay sa awtoridad. Malinaw at dignified ang “pinuno” sa modernong Tagalog, samantalang maaaring magpasok ng di-kinakailangang dinastikong pahiwatig ang “prinsipe.”
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig ng pahayag-propetiko. Ginamit ang “humayo” upang maging angkop sa banal na atas ngunit iniwasan ang labis na makaluma o teknikal na pananalita. Walang talababa sapagkat hindi kailangan para mapanatili ang mahalagang ambiguwidad ng talata.
