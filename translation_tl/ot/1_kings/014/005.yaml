  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Ahias, “Narito, paparating ang asawa ni Jeroboam upang magtanong sa iyo tungkol sa anak niya, sapagkat may sakit ang anak niya. Ganito at ganoon[a] ang sabihin mo sa kanya. Pagdating niya, nakabalatkayo siya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ganito at ganoon”—isang pormulang tumutukoy sa isang tiyak na mensaheng hindi pa tahasang inilalahad.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “nagkukunwari siyang ibang tao.” Ang pandiwang Hebreo ay nagpapahiwatig ng pagpapanggap upang hindi makilala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: At sinabi ni Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang banal na יְהוָה at ang karaniwang daloy ng salaysay na may וַ.
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at marangal na panawag-pansin sa modernong Tagalog, nang hindi gumagamit ng masyadong kolokyal na “Tingnan mo.”
- source_word: אֵשֶׁת יָרָבְעָם בָּאָה
  choice: papunta rito ang asawa ni Jeroboam
  rationale: Ipinahahayag ang nalalapit at kasalukuyang pagdating na ipinahihiwatig ng בָּאָה; nililinaw ng “rito” na kay Ahias siya pupunta.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: upang magtanong sa iyo tungkol sa anak niya
  rationale: Natural na Tagalog para sa paghingi ng salita o kasagutan mula sa propeta, nang hindi labis na tinutukoy kung simpleng impormasyon o orakulo ang hinihingi.
- source_word: כִּי חֹלֶה הוּא
  choice: sapagkat may sakit ito
  rationale: Pinananatili ang ugnayang sanhi; ang “ito” ay malinaw na tumutukoy sa anak at natural sa Tagalog.
- source_word: כָּזֹה וְכָזֶה
  choice: Ganito at ganoon
  rationale: Pinananatili ang Hebreong pormulang tumutukoy sa isang tiyak ngunit hindi pa inilalahad na mensahe.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: ang sasabihin mo sa kanya
  rationale: Natural na Tagalog na naghahatid ng iniutos o itinakdang pagsasalita ni Ahias sa babae.
- source_word: וִיהִי כְבֹאָהּ
  choice: Pagdating niya
  rationale: Maikli at likas na salin ng pormulang temporal sa salaysay.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: nakabalatkayo siya
  rationale: Ipinahahayag ang reflexive na pagtatangkang huwag makilala at ang kalagayan niya sa oras ng pagdating.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kalikasan ng paglapit ng asawa ni Jeroboam sa propeta
  choice: magtanong sa iyo tungkol sa anak niya
  alternative: humingi sa iyo ng salita tungkol sa anak niya
  rationale: Hindi nililimitahan ang דָּבָר sa isang pormal na orakulo, ngunit pinananatili ng konteksto na isang propeta ang kinokonsulta.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Narito” bilang natural na panawag-pansin, “sapagkat” para sa pormal ngunit kasalukuyang daloy, at “nakabalatkayo” bilang maikli at malinaw na paglalarawan sa pagtatago ng pagkakakilanlan.
