- from: At sinabi ni Yahweh kay Ahias, “Narito, papunta rito ang asawa ni Jeroboam upang magtanong sa iyo tungkol sa anak niya, sapagkat may sakit ito. Ganito at ganoon[a] ang sasabihin mo sa kanya. Pagdating niya, nakabalatkayo siya[b].”
  to: At sinabi ni Yahweh kay Ahias, “Narito, paparating ang asawa ni Jeroboam upang magtanong sa iyo tungkol sa anak niya, sapagkat may sakit ang anak niya. Ganito at ganoon[a] ang sabihin mo sa kanya. Pagdating niya, nakabalatkayo siya[b].”
