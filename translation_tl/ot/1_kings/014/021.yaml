  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: tl
  text: Si Rehoboam, anak ni Solomon, ay naghari sa Juda.[a] Apatnapu't isang taong gulang si Rehoboam nang maging hari siya, at naghari siya nang labimpitong taon sa Jerusalem, ang lungsod na pinili ni Yahweh mula sa lahat ng lipi ng Israel upang ilagay roon ang kanyang pangalan.[b] Ang pangalan ng kanyang ina ay si Naama na Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naghari bilang hari ng Juda.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “upang ilagay roon ang kanyang pangalan.” Isa itong pananalitang nauugnay sa tipan tungkol sa lugar na natatanging iniugnay sa presensya at pagsamba kay Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag nito ang pamamahala bilang hari at likas ang anyo sa makabagong Tagalog.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Pinananatili ang karaniwang lokatibong diwa ng ב; maaari rin itong unawain bilang pamamahala 'sa ibabaw ng Juda' o 'sa Juda.'
- source_word: בְּמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinahihiwatig ng pariralang may infinitive construct ang panahon ng pagluklok, kaya malinaw itong ibinukod sa tagal ng paghahari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang pangalan ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: upang ilagay roon ang kanyang pangalan
  rationale: Malapit ito sa literal na pananalita ng Hebreo at pinananatili ang tipanang idyoma nang hindi ito pinalalawak sa paliwanag sa pangunahing teksto.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Ipinakikita ng מִן ang pagpili mula sa kabuuan ng mga lipi; natural ang pariralang ito sa Tagalog.
- source_word: הָעַמֹּנִית
  choice: isang babaeng Ammonita
  rationale: Malinaw na ipinahahayag ang pambabaeng katawagang etniko nang hindi gumagamit ng lipas na anyo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Kahulugan ng 'ilagay roon ang kanyang pangalan'
  choice: Pinanatili ang mismong idyoma sa pangunahing teksto
  alternative: upang doon manahan ang kanyang presensya
  rationale: May tipanang kahulugan ang pahayag ngunit hindi tahasang sinasabi ng talata ang pinalawak na paraprasis; ang paliwanag ay inilagay sa talababa.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang karaniwang biblikal na mga pangalang Juda, Jerusalem, Israel, Rehoboam, Solomon, at Naama; pinanatili ang Yahweh bilang banal na pangalan. Ang 'Apatnapu't isang' at 'labimpitong' ay natural na baybay sa tuloy-tuloy na prosa.
