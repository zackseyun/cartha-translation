base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: tl
  text: At ipauubaya niya ang Israel[a] dahil sa mga kasalanan ni Jeroboam na ginawa niya at naging dahilan upang magkasala ang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibibigay niya ang Israel.” Sa kontekstong ito ng paghatol, ang pandiwang Hebreo ay maaaring mangahulugang ipasailalim o ipaubaya ang isang bayan sa kapahamakan o sa mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: At ipauubaya niya
  rationale: Ang נתן ay literal na “magbigay,” ngunit sa konteksto ng hatol ay tumutukoy sa pagpapasailalim o pagpapaubaya sa kapahamakan o sa mga kaaway. Likas sa modernong Tagalog ang “ipauubaya” at hindi nito tinutukoy kung sino o ano ang gagamitin sa paghatol.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Ang pangalan ng bansa ay tumutukoy rito sa bayang Israel bilang isang kabuuan.
- source_word: בִּגְלַל
  choice: dahil sa
  rationale: Malinaw na ipinahahayag ng parirala ang sanhi o dahilan.
- source_word: חַטֹּאות יָרָבְעָם
  choice: mga kasalanan ni Jeroboam
  rationale: Pinananatili ang pangmaramihang anyo ng חַטֹּאות at ang tuwirang pag-uugnay ng mga kasalanan kay Jeroboam.
- source_word: אֲשֶׁר חָטָא
  choice: mga kasalanang ginawa niya
  rationale: Sa Tagalog, likas na sabihing “gumawa ng kasalanan” sa halip na tularan nang mekanikal ang Hebreong “mga kasalanang ikinasala niya.”
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: at ipinagawa niya sa Israel
  rationale: Ang Hiphil ng חטא ay causative, “magpangyaring magkasala.” Dahil ang nauunang tinutukoy ay “mga kasalanan,” malinaw at maikli sa Tagalog ang “ipinagawa niya sa Israel,” na pinananatili kapuwa ang personal na sala ni Jeroboam at ang pananagutan niya sa pagkakasala ng bayan.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa paghatol
  choice: ipauubaya niya ang Israel
  alternative: ibibigay niya ang Israel; isusuko niya ang Israel
  rationale: Ipinahahayag ng talata ang paghatol ng Diyos ngunit hindi nito pinapangalanan sa sugnay na ito ang kasangkapan ng kapahamakan. Hindi dinaragdagan ng “ipauubaya” ang tekstong Hebreo ng isang tiyak na kaaway o pangyayari.
- issue: Ang sariling kasalanan ni Jeroboam at ang pagpapakasala niya sa Israel
  choice: mga kasalanang ginawa niya at ipinagawa niya sa Israel
  alternative: mga kasalanang ginawa niya at naging dahilan upang magkasala ang Israel
  rationale: 'Pinananatili ng salin ang dalawang aspekto ng Hebreo: si Jeroboam mismo ang nagkasala, at siya rin ang nagpangyaring magkasala ang Israel. Ang “ipinagawa” ay nagpapanatili sa tuwirang causative na diwa nang hindi nagpapaliwanag nang lampas sa teksto.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang em dash upang luminaw na ang dalawang kasunod na sugnay ay kapuwa tumutukoy sa “mga kasalanan ni Jeroboam.”
