  text: בָּ/עֵ֣ת הַ/הִ֔יא חָלָ֖ה אֲבִיָּ֥ה בֶן יָרָבְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/001.yaml
  text: At that time Abijah son of Jeroboam became sick.
translation:
  language: tl
  text: Nang panahong iyon, nagkasakit si Abias na anak ni Jeroboam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa modernong Tagalog na tapat sa diwang ‘sa panahong iyon’ at maayos ang daloy sa pagsasalaysay.
- source_word: חָלָה
  choice: nagkasakit
  rationale: Ipinahahayag ng pandiwa ang pagpasok sa kalagayan ng pagkakasakit; mas malinaw ang pagsisimula ng karamdaman kaysa sa statibong ‘may sakit.’
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal na Abijah, na angkop sa isang saling para sa karaniwang mambabasang Filipino.
- source_word: בֶן יָרָבְעָם
  choice: anak ni Jeroboam
  rationale: Natural at tuwirang katumbas sa Tagalog ng ugnayang ipinahahayag ng Hebrew construct chain; hindi kailangang tukuyin ang kasarian dahil malinaw ito sa pangalan at konteksto.
theological_decisions: []
