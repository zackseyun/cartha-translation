  to: Magluluksa para sa kanya ang buong Israel at ililibing siya[a], sapagkat siya lamang sa sambahayan ni Jeroboam ang makararating sa libingan. Sapagkat sa kanya, sa sambahayan ni Jeroboam, may natagpuang isang mabuting bagay[b] na nakatuon kay Yahweh[c], ang Diyos ng Israel.
