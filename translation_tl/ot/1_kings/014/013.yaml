  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: tl
  text: Magluluksa para sa kanya ang buong Israel at ililibing siya[a], sapagkat siya lamang sa sambahayan ni Jeroboam ang makararating sa libingan. Sapagkat sa kanya, sa sambahayan ni Jeroboam, may natagpuang isang mabuting bagay[b] na nakatuon kay Yahweh[c], ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “siya lamang ang darating kay Jeroboam, sa libingan”—ibig sabihin, siya lamang sa sambahayan ni Jeroboam ang tatanggap ng paglilibing.
    reason: lexical_alternative
  - marker: b
    text: O “may natagpuang mabuti.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “tungo kay Yahweh.” Maaaring tumukoy ito sa isang disposisyon o katangiang nakatuon kay Yahweh, o sa isang bagay na mabuti sa kaugnayan sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: Magluluksa para sa kanya
  rationale: Ang ספד ay tumutukoy sa pagluluksa para sa namatay. Natural at marangal sa modernong Tagalog ang “magluluksa para sa kanya.”
- source_word: וְקָבְרוּ אֹתוֹ
  choice: at ililibing siya
  rationale: Tuwirang ipinapahayag ng parirala ang paglilibing sa kanya; nananatiling paksa ang “buong Israel.”
- source_word: כִּי זֶה לְבַדּוֹ
  choice: sapagkat siya lamang
  rationale: Pinananatili nito ang diin sa pagiging tanging eksepsiyon niya sa sambahayan ni Jeroboam.
- source_word: יָבֹא לְיָרָבְעָם אֶל־קָבֶר
  choice: sa sambahayan ni Jeroboam ang maililibing
  rationale: Literal na mahirap ang “darating kay Jeroboam sa libingan.” Sa konteksto, tumutukoy ito sa kanya bilang tanging kabilang kay Jeroboam na makararating sa libingan, ibig sabihin, tatanggap ng paglilibing.
- source_word: יַעַן
  choice: Ito ay dahil
  rationale: Malinaw na ipinakikita ang sanhi ng naunang pahayag sa natural na Tagalog.
- source_word: נִמְצָא בוֹ
  choice: sa kanya lamang may natagpuang
  rationale: Pinananatili ang pasibong ideya ng pagkakatuklas ng isang mabuting katangian sa kanya.
- source_word: דָּבָר טוֹב
  choice: mabuti
  rationale: Sinasalamin nito ang malawak at di-tiyak na kahulugan ng parirala nang hindi tinutukoy kung gawa, ugali, o disposisyon iyon.
- source_word: אֶל יְהוָה
  choice: na nakatuon kay Yahweh
  rationale: Pinananatili ang direksiyon o kaugnayang ipinahihiwatig ng אֶל, nang hindi tiyak na nilulutas kung ito ay disposisyon tungo kay Yahweh o isang bagay na kalugod-lugod sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּבֵית יָרָבְעָם
  choice: sa buong sambahayan ni Jeroboam
  rationale: Ang “sambahayan” ay natural sa Tagalog at malinaw na sumasaklaw sa pamilya o dinastiya ni Jeroboam.
theological_decisions:
- issue: Paglalarawan sa דָּבָר טוֹב אֶל־יְהוָה
  choice: may natagpuang mabuti na nakatuon kay Yahweh
  alternative: may natagpuang isang mabuting bagay tungkol kay Yahweh / kalugod-lugod kay Yahweh
  rationale: Hindi nilulutas ng Hebreo kung ang mabuti ay isang disposisyong nakatuon kay Yahweh o isang katangiang mabuti sa kaugnayan sa kanya. Pinananatili ng salin at talababa ang tensiyong ito.
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” nang walang pagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sambahayan” para sa dinastikong בית at “maililibing” upang natural na maipahayag ang idyomatikong diwa ng pagdating sa libingan. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
