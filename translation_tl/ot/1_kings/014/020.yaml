  text: וְ/הַ/יָּמִים֙ אֲשֶׁ֣ר מָלַ֣ךְ יָרָבְעָ֔ם עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָ֑ה וַ/יִּשְׁכַּב֙ עִם אֲבֹתָ֔י/ו וַ/יִּמְלֹ֛ךְ נָדָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: tl
  text: Dalawampu't dalawang taon ang paghahari ni Jeroboam. Pagkatapos, nahimlay siya kasama ng kanyang mga ninuno[a], at ang anak niyang si Nadab ang naging hari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas literal at tradisyonal na salin, “natulog siyang kasama ng kanyang mga ninuno.” Ang Hebreong idyomang ito ay tumutukoy sa kamatayan sa pormula ng paghalili ng mga hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Dalawampu't dalawang taon ang paghahari
  rationale: Likas na modernong Tagalog para sa Hebreong pormula ng pagbubuod sa tagal ng paghahari; hindi kailangang ilantad ang panimulang pang-ugnay na וְ.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: dalawampu't dalawang taon
  rationale: Karaniwan at malinaw na anyo ng bilang sa modernong Tagalog.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: nahimlay siya kasama ng kanyang mga ninuno
  rationale: Pinananatili ang metapora at kolektibong ugnayan ng Hebreong idyoma, habang iniiwasan ang posibleng kalituhan ng literal na 'natulog kasama ng.'
- source_word: וַיִּמְלֹךְ
  choice: ang naging hari
  rationale: Ipinahihiwatig ng anyong ito ang pagluklok o pagsisimula ng paghahari sa pormula ng paghalili.
- source_word: נָדָב בְּנוֹ
  choice: ang anak niyang si Nadab
  rationale: Natural na ayos sa Tagalog at malinaw na pinananatili ang ugnayang ama-anak.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Malinaw at idiomatikong ipinapahayag ang paghalili sa trono na tinutukoy ng salita sa kontekstong maharlika.
theological_decisions:
- issue: Idyoma ng kamatayan sa pormula ng paghahari
  choice: nahimlay siya kasama ng kanyang mga ninuno
  alternative: namatay siya; natulog siya kasama ng kanyang mga ninuno
  rationale: Ang parirala ay kumbensiyonal na idyoma ng salaysay para sa kamatayan, hindi isang tahasang doktrina tungkol sa kabilang-buhay. Pinananatili ng 'nahimlay' ang larawan nang hindi ito pinapantay lamang sa 'namatay' o binibigyan ng malabong seksuwal na kahulugan sa modernong gamit.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'paghahari,' 'nahimlay,' at 'kahalili' bilang pormal ngunit karaniwang bokabularyo; pinanatili sa talababa ang mas literal na idyoma.
