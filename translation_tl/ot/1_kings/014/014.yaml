  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: tl
  text: Magtatalaga si Yahweh ng isang hari para sa kanyang sarili na mamumuno sa Israel. Lilipulin niya ang angkan ni Jeroboam sa araw na ito[a]. Ngunit ano? Maging ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Biglaan at mahirap unawain ang pangwakas na Hebreo; literal itong malapit sa “ngunit ano? maging ngayon.” May ilang umaunawa rito bilang bulalas na nagdiriin sa agarang paghatol, gaya ng “ngunit ano? ngayon din!” o “ngunit ano pa? ngayon na.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: magbabangon
  rationale: Pinananatili nito ang larawan ng Hiphil ng קום—ang pagpapalitaw o pagtatalaga ng Diyos sa isang pinuno—nang hindi nililimitahan ang paraan ng kanyang pagluklok.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: לּוֹ
  choice: para sa kanyang sarili
  rationale: Ang hulaping panghalip ay pinakanatural na tumutukoy pabalik kay Yahweh bilang simuno.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: isang hari na mamumuno sa Israel
  rationale: Ipinahahayag nang likas sa Tagalog ang diwa ng paghahari “sa ibabaw” ng Israel na taglay ng עַל.
- source_word: אֲשֶׁר יַכְרִית
  choice: lilipulin niya
  rationale: Sa kontekstong ito, ang Hiphil ng כרת ay tumutukoy sa ganap na pag-aalis o paglipol. Ginawang hiwalay na pangungusap ang sugnay upang maging malinaw at natural sa Tagalog nang hindi binabago ang tinutukoy na hari.
- source_word: בֵּית יָרָבְעָם
  choice: sambahayan ni Jeroboam
  rationale: Ang “sambahayan” ay nagpapanatili sa dinastikong saklaw ng בֵּית nang hindi ito tahasang pinapakahulugan lamang bilang “dinastiya.”
- source_word: זֶה הַיּוֹם
  choice: sa araw na ito
  rationale: Malapit ito sa literal na anyo ng Hebreo at pinananatili ang diin sa panahon.
- source_word: וּמֶה גַּם עָתָּה
  choice: Ngunit ano? Ngayon na rin.
  rationale: Pinananatili ang biglaan, putol-putol, at mahirap na anyo ng Hebreo sa halip na punan ang ipinahihiwatig nito sa isang tiyak na pagpapakahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng mahirap na pangwakas na pariralang וּמֶה גַּם עָתָּה
  choice: 'Pinanatili ang biglaan at eliptikong pananalita: “Ngunit ano? Ngayon na rin.”'
  alternative: “Ano pa? Nagsisimula na ito ngayon”; “Narito, ngayon na ang paghatol.”
  rationale: Hindi tiyak ang sintaks at eksaktong ipinahihiwatig ng pangwakas na parirala. Ang hindi pagpapakinis dito ay nagpapanatili sa tunay na kalabuan at tindi ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “magbabangon” upang mapanatili ang larawang Hebreo, “sambahayan” para sa angkan o dinastiya, at sadyang hindi pinakinis ang mahiwagang pangwakas na parirala.
