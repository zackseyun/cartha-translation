  terminology: Ang “Haring Rehoboam,” “mga kalasag na tanso,” at “ipinagkatiwala” ay angkop. Makatuwirang panatilihin ang “mga mananakbo” sa teksto at ibigay ang “mga bantay” bilang mapagpaliwanag na posibilidad sa talababa. Ang “bahay ng hari” at paliwanag na “palasyo” ay tapat at natural.
