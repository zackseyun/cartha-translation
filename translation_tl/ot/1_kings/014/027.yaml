translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili sa pangunahing teksto ang literal na “mga mananakbo” at “bahay ng hari” upang hindi maitago ang anyo at maaaring saklaw ng Hebreo; ipinaliwanag ang mga ito sa mga talababa.
