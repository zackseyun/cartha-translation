base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: tl
  text: At gumawa si Haring Rehoboam ng mga kalasag na tanso bilang kapalit ng mga iyon, at ipinagkatiwala niya ang mga iyon sa mga pinuno ng mga mananakbong nagbabantay sa pasukan ng bahay ng hari.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas mapagpaliwanag na salin, “mga pinuno ng bantay.” Literal sa Hebreo ang “mga pinuno ng mga mananakbo,” na malamang ay isang pangkat ng maharlikang mga bantay o mensahero.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ng hari” ay tumutukoy sa palasyo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: gumawa
  rationale: Karaniwang kahulugan ng עשה sa kontekstong ito ang paggawa o paglikha ng mga bagay; natural at tuwiran ang “gumawa” sa modernong Tagalog.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Haring Rehoboam
  rationale: Natural sa Tagalog na ilagay ang titulong “Hari” bago ang pangalan.
- source_word: תַּחְתָּם
  choice: bilang kapalit ng mga iyon
  rationale: Tumutukoy ang hulapi sa mga gintong kalasag sa naunang talata at malinaw na nagpapahayag ng pagpapalit.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: mga kalasag na tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa tanso o bronse; pinananatili ng “tanso” ang karaniwang malawak na katawagang Filipino sa sinaunang metal nang hindi nagbibigay ng labis na katiyakan sa eksaktong haluang metal.
- source_word: וְהִפְקִיד עַל יַד
  choice: ipinagkatiwala niya ... sa
  rationale: Ang hiphil ng פקד kasama ng עַל יַד ay nagsasaad ng paglalagay ng mga bagay sa pangangalaga o pananagutan ng iba; natural itong ipinahahayag sa Tagalog bilang “ipinagkatiwala ... sa.”
- source_word: שָׂרֵי הָרָצִים
  choice: mga pinuno ng mga mananakbo
  rationale: Pinananatili nito ang literal at posibleng sadyang teknikal na katawagang Hebreo, sa halip na agad itong ipakahulugang “mga pinuno ng bantay.”
- source_word: הַשֹּׁמְרִים
  choice: na nagbabantay
  rationale: Ipinahahayag ng participle ang nagpapatuloy o nakatalagang tungkulin ng pangkat.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: pasukan ng bahay ng hari
  rationale: Tapat ito sa literal na parirala habang nananatiling malinaw; nililinaw sa talababa na palasyo ang tinutukoy.
