base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: tl
  text: Ginawa ng Juda ang masama sa paningin ni Yahweh. Sa pamamagitan ng mga kasalanang ginawa nila, pinukaw nila ang kanyang paninibugho nang higit kaysa sa lahat ng ginawa ng kanilang mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagselos nila siya” o “pinukaw nila siyang magselos.” Ang Hebreo ay gumagamit ng wikang tumutukoy sa paninibugho ni Yahweh dahil sa kataksilan ng Juda sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Pangalan ito ng kaharian at bayang Juda. Bagaman isahan ang anyo sa Hebreo, kolektibo ang kahulugan nito rito, gaya ng ipinakikita ng kasunod na pandiwang maramihan.
- source_word: הָרַע
  choice: ang masama
  rationale: Likas at malinaw na salin ito ng idyomang עשה + הרע sa makabagong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang Hebreong metapora ng pagsusuri ayon sa paningin ng Diyos at malinaw ito sa karaniwang mambabasa.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: Pinukaw nila ang kanyang paninibugho
  rationale: Ipinahahayag nito ang tugon ni Yahweh sa kataksilan sa tipan, nang hindi ipinakahulugang makasalanang inggit.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: higit pa kaysa sa lahat ng ginawa ng kanilang mga ninuno
  rationale: Malinaw na inilalarawan ang paghahambing; ang אבותם ay tumutukoy rito sa mga ninuno, hindi lamang sa mga ama.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: sa pamamagitan ng mga kasalanang ginawa nila
  rationale: Pinananatili ang instrumental na gamit ng בְּ habang natural na isinasalin ang magkaugnay na pangngalan at pandiwa sa Hebreo.
theological_decisions:
- issue: Paninibugho ng Diyos
  choice: Pinukaw nila ang kanyang paninibugho
  alternative: Ginawa nila siyang mapanibughuin / Ginalaw nila ang kanyang paninibugho
  rationale: Pinananatili ng salin ang wika ng tipanang paninibugho bilang tugon ni Yahweh sa kataksilan ng Juda, sa halip na palitan ito ng simpleng galit o sigasig.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Juda” bilang kolektibong pangalan at ang panghalip na maramihang “nila” ayon sa Hebreo. Pinanatili ang pangalang “Yahweh” at ang teolohikal na tensiyon ng banal na paninibugho.
