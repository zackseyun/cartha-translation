  to: Ginawa ng Juda ang masama sa paningin ni Yahweh. Sa pamamagitan ng mga kasalanang ginawa nila, pinukaw nila ang kanyang paninibugho nang higit kaysa sa lahat ng ginawa ng kanilang mga ninuno.[a]
