    issue: Hindi gaanong malinaw ang saklaw ng paghahambing sa kasalukuyang ayos ng pangungusap.
    rationale: Sa Hebreo, ang “higit pa kaysa sa lahat ng ginawa ng kanilang mga ninuno” ay kaugnay ng pagpukaw nila sa paninibugho ni Yahweh, habang ang mga kasalanan ang paraan nito. Ang paglipat ng pariralang instrumental bago ang pangunahing pandiwa at ng comparative phrase kaagad pagkatapos nito ay nagpapalinaw ng ugnayan.
