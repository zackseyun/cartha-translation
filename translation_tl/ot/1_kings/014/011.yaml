id: 1KI.14.11
reference: 1 Kings 14:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: tl
  text: Ang sinumang kabilang sa sambahayan ni Jeroboam na mamatay sa lungsod[a] ay kakainin ng mga aso; at ang sinumang mamatay sa parang ay kakainin ng mga ibon sa langit[b], sapagkat nagsalita si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang patay na kay Jeroboam”; ibig sabihin, sinumang kabilang sa sambahayan o angkan ni Jeroboam na mamatay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga ibon sa himpapawid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Ang sinumang kabilang sa sambahayan ni Jeroboam na mamatay
  rationale: Ang literal na anyong “ang patay na kay Jeroboam” ay idyomatikong tumutukoy sa sinumang kabilang sa sambahayan o angkan ni Jeroboam. Nililinaw ng salin ang ugnayan nang hindi ipinapalagay na si Jeroboam mismo ang tinutukoy.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwirang lokatibong salin; pinananatili ang tiyak ngunit pangkalahatang pagtukoy ng Hebreo.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: ay kakainin ng mga aso
  rationale: Pinananatili ang karaniwang kahulugan ng אָכַל na “kumain.” Ginamit ang likas na balintiyak sa Filipino upang malinaw na ang namatay ang kakainin.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: at ang sinumang mamatay sa parang
  rationale: Kaagapay ito ng unang sugnay. Ang “parang” ay natural na Filipino para sa bukas na lupain na salungat sa lungsod.
- source_word: עוֹף הַשָּׁמָיִם
  choice: mga ibon sa langit
  rationale: Ang עוֹף ay kolektibong tumutukoy sa mga ibon o lumilipad na nilalang, at ang שָׁמַיִם ay literal na “langit.”
- source_word: כִּי יְהוָה דִּבֵּר
  choice: sapagkat nagsalita si Yahweh
  rationale: Ang כִּי ay nagbibigay ng batayan at katiyakan ng hatol. Ang perpektong pandiwa ay angkop na isinaling “nagsalita,” na nagpapahayag ng tiyak nang kapahayagan.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” upang malinaw na ipahayag ang idyomatikong ugnayan kay Jeroboam, “lungsod” bilang pormal ngunit pangkaraniwang katumbas ng עִיר, at “parang” para sa bukas na lupaing salungat sa lungsod.
