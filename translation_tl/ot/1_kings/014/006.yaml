base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: tl
  text: Nang marinig ni Ahias ang yabag niya habang papasok siya sa pintuan, sinabi niya, “Pumasok ka, asawa ni Jeroboam. Bakit ka nagkukunwaring ibang tao?[a] Isinugo ako sa iyo na may mabigat na mensahe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bakit ka nagpapanggap na hindi ikaw?”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Isinugo ako sa iyo na mabigat.” Walang binanggit na pangngalan sa Hebreo; ipinahihiwatig nito ang isang mabigat o malubhang mensahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: ang yabag niya
  rationale: Likas at malinaw sa modernong Tagalog ang “yabag” para sa tunog ng mga paa habang naglalakad, at pinananatili nito ang pandinig na larawan ng Hebreo.
- source_word: בָּאָה בַפֶּתַח
  choice: habang papasok siya sa pintuan
  rationale: Ipinapahayag nito ang kasabay na kilos at ang פֶּתַח bilang pasukan o bukana, hindi lamang ang pisikal na pinto.
- source_word: בֹּאִי
  choice: Pumasok ka
  rationale: Direkta at natural na pautos sa Tagalog, na angkop sa babaeng kinakausap.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: asawa ni Jeroboam
  rationale: Natural na tuwirang tawag sa Tagalog at tumpak na inilalahad ang ugnayang construct sa Hebreo.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Bakit ka nagkukunwaring ibang tao?
  rationale: Ipinakikita ng hitpael ng נכר ang pagpapanggap na may ibang pagkakakilanlan o pagpapakilalang hindi siya ang tunay na sarili; pinananatili ng salin ang saklaw na ito nang hindi labis na nililimitahan sa panlabas na pagbabalatkayo.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: Isinugo ako sa iyo
  rationale: Tumpak na inililipat ang pasibong diwa at ang kasalukuyang bisa ng pagkasugo, nang hindi tahasang pinapangalanan ang nagsugo sapagkat hindi ito binanggit sa sugnay.
- source_word: קָשָׁה
  choice: na may mabigat na mensahe
  rationale: Elliptical ang Hebreo at walang tahasang pangngalan. Ang “mabigat” ay natural sa Tagalog para sa masakit o malubhang balita, at ang “mensahe” ang pinakamaingat na pandagdag ayon sa konteksto.
theological_decisions:
- issue: Hindi binanggit na pangngalan pagkatapos ng קָשָׁה
  choice: 'Idinagdag ang “mensahe”: “na may mabigat na mensahe”'
  alternative: “na may masamang balita” o “para sa isang mabigat na gawain”
  rationale: Hindi tinutukoy ng Hebreo ang pangngalan. Sa kontekstong propetiko, malamang na isang malubhang pahayag ang dala ni Ahias, ngunit pinananatili ng “mensahe” ang sapat na lawak at hindi ito ginagawang mas tiyak kaysa sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “yabag” at “mabigat na mensahe” bilang karaniwang mga parirala, habang inilagay sa talababa ang tunay na leksikal at sintaktikong kalabuan.
