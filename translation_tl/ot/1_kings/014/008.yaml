reference: 1 Kings 14:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: tl
  text: At pinunit ko ang kaharian mula sa sambahayan ni David[a] at ibinigay ko iyon sa iyo. Ngunit hindi ka naging tulad ng lingkod kong si David, na tumupad sa aking mga utos at sumunod sa akin nang buong puso[b], upang gawin lamang ang matuwid sa aking paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan ni David” ay tumutukoy sa maharlikang angkan o dinastiya ni David.
    reason: cultural_note
  - marker: b
    text: O “lumakad kasunod ko nang buong puso.” Literal na “lumakad kasunod ko” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: inagaw ko
  rationale: Ang קרע ay literal na “punitin,” ngunit sa kontekstong ang kaharian ay sapilitang inalis mula sa isang dinastiya, likas sa Filipino ang “inagaw,” na nagpapanatili sa diin ng marahas at tiyak na pag-aalis.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Karaniwang tumutukoy ang מַמְלָכָה sa kaharian bilang sakop o paghahari; malinaw at natural ang “kaharian.”
- source_word: מִבֵּית דָּוִד
  choice: mula sa sambahayan ni David
  rationale: Pinananatili ng “sambahayan ni David” ang Hebreong idyomang בֵּית דָּוִד at ang kahulugang dinastiko nito nang hindi agad pinapalitan ng mas interpretibong “dinastiya.”
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: at ibinigay ko iyon sa iyo
  rationale: Isinasalaysay ng anyong pandiwa ang nakaraang pagkilos; ang “iyon” ay malinaw na tumutukoy sa kaharian.
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: Ngunit hindi ka naging tulad ng lingkod kong si David
  rationale: Likas sa Filipino ang “hindi ka naging tulad,” at ang “lingkod” ay angkop sa marangal at tipanang gamit ng עֶבֶד para kay David.
- source_word: שָׁמַר מִצְוֺתַי
  choice: tumupad sa aking mga utos
  rationale: Sa kaugnayan sa mga utos, ang שׁמר ay nangangahulugang sundin o tuparin; ang “tumupad” ay malinaw na nagpapahayag ng masunuring pagsasagawa.
- source_word: הָלַךְ אַחֲרַי
  choice: sumunod sa akin
  rationale: Literal itong “lumakad kasunod ko,” ngunit ang “sumunod sa akin” ang natural na katumbas sa modernong Filipino at pinananatili ang diwa ng tapat na pagsunod.
- source_word: בְּכָל לְבָבוֹ
  choice: nang buong puso
  rationale: Natural na katumbas ito ng Hebreong idyoma para sa buo at hindi nahahating katapatan ng kalooban.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר
  choice: upang gawin lamang ang matuwid
  rationale: Pinananatili ng “upang gawin” ang infinitibong konstruksyon at ng “lamang” ang paghihigpit na ipinahahayag ng רַק.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: ang matuwid sa aking paningin
  rationale: Ang “sa aking paningin” ay natural na Filipino para sa idyomang Hebreo at pinananatili ang Diyos bilang siyang humahatol kung ano ang matuwid.
theological_decisions:
- issue: Paglalarawan kay David bilang huwaran sa kabila ng mga kasalanang binabanggit sa ibang talata
  choice: Pinanatili ang tahasang positibong pagtataya ng talata nang walang idinagdag na paglilimita.
  alternative: Magdagdag ng panuring gaya ng “sa pangkalahatan” o “karaniwan.”
  rationale: Inihaharap mismo ng talata si David bilang kaibahan ni Jeroboam. Ang pagdaragdag ng panuring ay magpapaliit sa pahayag at tahimik na lulutas sa tensiyong pinananatili ng Kasulatan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sambahayan” upang mapanatili ang dinastikong idyoma, samantalang ginawang “sumunod sa akin” ang literal na metapora ng paglakad para sa likas na daloy. Ang mga marker [a] at [b] ay nasa mismong teksto at tumutugma sa mga talababa.
