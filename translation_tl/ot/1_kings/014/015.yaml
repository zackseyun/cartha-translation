  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: tl
  text: At hahampasin ni Yahweh ang Israel, gaya ng tambong umuuga sa tubig. Bubunutin niya ang Israel mula sa mabuting lupaing ito na ibinigay niya sa kanilang mga ninuno, at ikakalat niya sila sa kabila ng Ilog[a], sapagkat gumawa sila ng kanilang mga Asherim[b], kaya ginalit nila si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabila ng Eufrates.” Sa kontekstong ito, ang “Ilog” ay tumutukoy sa Ilog Eufrates.
    reason: cross_reference
  - marker: b
    text: 'Hebreo: “kanilang mga Asherim”; mga bagay na ginagamit sa pagsamba at kaugnay ng diyosang si Ashera, na karaniwang ipinapalagay na mga kahoy na poste o imahen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: At hahampasin
  rationale: Ang anyong pandiwa sa kontekstong propetiko ay tumutukoy sa darating na paghatol. Ang “hahampasin” ay malinaw at pinananatili ang lakas ng larawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: gaya ng tambo na inuugoy sa tubig
  rationale: Pinananatili nito ang larawan ng isang tambong hindi matatag at iginagalaw ng tubig; ang pasibong “inuugoy” ay natural sa Filipino at hindi labis na tinutukoy ang sanhi ng galaw.
- source_word: וְנָתַשׁ
  choice: Bubunutin niya
  rationale: Ipinapahayag ng pandiwa ang pagbunot o pag-aalis na parang halaman na binubunot mula sa lupa, kaya napapanatili ang metapora.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: mabuting lupaing ito
  rationale: Ang “lupain” ay angkop sa konteksto ng lupaing ipinagkaloob sa Israel, at pinananatili ng “mabuti” ang tahasang paglalarawan sa Hebreo.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: na ibinigay niya sa kanilang mga ninuno
  rationale: Ang “mga ninuno” ay likas sa modernong Filipino at malinaw na naghahatid ng kolektibong kahulugan ng אבותיהם sa konteksto.
- source_word: וְזֵרָם
  choice: at ikakalat niya sila
  rationale: Ang “ikakalat” ay malinaw na naghahatid ng pagkalat o pagpapangalat sa konteksto ng pagpapatapon, nang hindi ipinapasok ang mas tiyak na larawang pagliglig.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: sa kabila ng Ilog
  rationale: Pinananatili ang literal at makasaysayang tawag na “ang Ilog”; ipinapaliwanag sa talababa na ang tinutukoy ay ang Eufrates.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: gumawa sila ng kanilang mga Asherim
  rationale: Ang transliterasyong “Asherim” ay nagpapanatili sa sadyang lawak ng terminong Hebreo para sa mga bagay na pangkultong kaugnay ni Ashera, sa halip na tiyaking mga poste ang mga ito.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: kaya ginalit nila si Yahweh
  rationale: Likas sa Filipino ang tahasang “ginalit” at malinaw nitong ipinapahayag ang kahulugan ng pandiwang ‘mag-udyok sa galit.’
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” at hindi pinapalitan ng titulo.
- issue: Tinutukoy ng הַנָּהָר (“ang Ilog”)
  choice: Panatilihin ang “Ilog” sa pangunahing teksto at tukuyin ang Eufrates sa talababa
  alternative: Eufrates sa pangunahing teksto
  rationale: “Ang Ilog” mismo ang pahayag ng Hebreo; nagbibigay ang talababa ng kailangang heograpikong paglilinaw nang hindi binabago ang anyo ng pangunahing teksto.
- issue: Kahulugan ng אֲשֵׁרֵיהֶם
  choice: mga Asherim, na may paliwanag sa talababa
  alternative: mga poste ni Ashera; mga imahen ni Ashera
  rationale: Hindi lubusang tiyak ang pisikal na anyo ng mga bagay na ito. Ang transliterasyon ay umiiwas sa labis na pagtukoy, habang ipinapaliwanag ng talababa ang kaugnayan nila sa diyosang si Ashera.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” para sa natural na kolektibong pagtukoy. Pinanatili ang “Yahweh,” “Ilog,” at “Asherim” upang igalang ang mahahalagang anyo at tunay na di-tiyak na bahagi ng tekstong Hebreo; ipinaliwanag ang huling dalawa sa mga talababa.
