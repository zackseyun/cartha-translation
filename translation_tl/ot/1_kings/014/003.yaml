  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: tl
  text: Magdala ka ng sampung tinapay, ilang keyk, at isang garapon ng pulot, at pumunta ka sa kanya. Sasabihin niya sa iyo kung ano ang mangyayari sa bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: sampung tinapay
  rationale: Tuwirang inililipat ang bilang at karaniwang kahulugan ng לֶחֶם; natural ito sa modernong Tagalog.
- source_word: נִקֻּדִים
  choice: ilang munting tinapay
  rationale: Ang eksaktong anyo ng pagkaing tinutukoy ay hindi tiyak; malamang na maliliit na tinapay o cake. Pinili ang malinaw ngunit hindi sobrang espesipikong paglalarawan.
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: isang sisidlan ng pulot
  rationale: Ang בַּקְבֻּק ay lalagyan o bote; ang 'sisidlan' ay hindi nagpapalagay ng materyal o tiyak na hugis, at ang דְּבַשׁ ay natural na 'pulot'.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: kung ano ang mangyayari sa bata
  rationale: Pinananatili ang bukas na kahulugan ng magiging kalagayan o sasapitin ng bata nang hindi inuunahan ang magiging sagot.
theological_decisions:
- issue: Ang ipinahihiwatig ng pahayag ng propeta tungkol sa bata
  choice: kung ano ang mangyayari sa bata
  alternative: kung ano ang sasapitin ng bata
  rationale: Ang piniling salin ay nagpapanatili sa neutralidad at tensiyon ng Hebreo, sa halip na ipahiwatig agad na masama ang kahihinatnan.
translation_notes:
  register: Makabagong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang 'magdala ka' bilang likas na katumbas ng idyomang Hebreo na literal na 'kumuha ka sa iyong kamay.'
