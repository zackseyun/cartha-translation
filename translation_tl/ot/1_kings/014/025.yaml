base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: tl
  text: Sa ikalimang taon ng paghahari ni Haring Rehoboam, sumulong[a] laban sa Jerusalem si Shishak, na hari ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umahon laban sa Jerusalem.” Ginagamit sa Hebreo ang “umahon” para sa pagsulong ng hukbo, lalo na patungo sa isang mahalagang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ang anyong pasalaysay ay likas na naipapahayag sa Filipino sa pamamagitan ng sugnay na panahunan; hindi kailangan ang makalumang “at nangyari.”
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: Nang ikalimang taon ng paghahari ni Haring Rehoboam
  rationale: Nililinaw ng “ng paghahari” na ang tinutukoy ay ang ikalimang taon ng pamumuno ni Rehoboam, gaya ng kahulugan ng pormulang Hebreo sa pagtatala ng mga taon ng hari.
- source_word: עָלָה ... עַל
  choice: sumulong laban sa
  rationale: Sa kontekstong militar, ipinahihiwatig ng parirala ang pagsulong laban sa isang lungsod. Pinananatili ng “sumulong laban sa” ang kilos at masamang layon nang hindi tiyak na sinasabing nagsimula na ang mismong paglusob.
- source_word: שושק
  choice: Shishak
  rationale: Tuwirang transliterasyon ito ng anyong Hebreo at hindi ipinapalit ang makasaysayang pangalang Ehipsiyo na Shoshenq.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: na hari ng Ehipto
  rationale: Likas na hulaping paglalarawan sa Filipino na nagpapakilala sa katungkulan at kaharian ni Shishak.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa modernong Filipino.
