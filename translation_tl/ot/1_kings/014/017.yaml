translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at pasalaysay. Pinanatili ang magkakasunod na kilos ng Hebreo, ngunit inayos nang likas sa Tagalog. Walang footnote dahil ang temporal na pagbasa ng הִיא בָּאָה בְסַף הַבַּיִת ay maipahahayag nang tuwiran bilang “Pagdating niya sa pintuan ng bahay”; ang alternatibong Ingles ay hindi nagdudulot ng makabuluhang pagkakaiba sa Tagalog.
