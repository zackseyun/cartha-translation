base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: tl
  text: Kaya tumindig ang asawa ni Jeroboam, umalis, at dumating sa Tirza. Pagdating niya sa bungad ng bahay, namatay ang batang lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay kasunod na kilos sa salaysay. Pinananatili ng “tumindig” ang estilong pasalaysay nang hindi ipinapakahulugang pag-alis lamang.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: ang asawa ni Jeroboam
  rationale: Likas na modernong Tagalog para sa construct chain na tumutukoy sa ugnayang mag-asawa.
- source_word: וַתֵּלֶךְ
  choice: umalis
  rationale: Sa daloy ng konteksto, ang הלך ay kilos ng pag-alis at pagpunta; mas natural dito ang “umalis” matapos ang “tumindig.”
- source_word: וַתָּבֹא תִרְצָתָה
  choice: dumating sa Tirza
  rationale: Ang בוא at directional he ay nagpapahayag ng pagdating sa patutunguhan. Malinaw at natural ang “dumating sa Tirza” nang hindi ipinapalagay ang partikular na tarangkahan o gusali.
- source_word: הִיא בָּאָה
  choice: Pagdating niya
  rationale: Ang independent pronoun at participle ay nagbibigay ng temporal o circumstantial na diwa. Ang “Pagdating niya” ay natural na nagpapakilala sa sandali ng kasunod na pangyayari.
- source_word: בְסַף הַבַּיִת
  choice: sa pintuan ng bahay
  rationale: Ang סַף ay tiyak na threshold o pasukan. Sa ordinaryong modernong Tagalog, “pintuan” ang pinakanatural na tumutukoy sa bahaging iyon nang hindi nagdaragdag ng teolohikal na kahulugan.
- source_word: וְהַנַּעַר
  choice: ang bata
  rationale: Ang נַעַר ay maaaring bata, batang lalaki, o kabataan. Dito ay anak ni Jeroboam; pinananatili ng “bata” ang lawak ng katawagan at natural ito sa Tagalog.
- source_word: מֵת
  choice: namatay
  rationale: Bagaman qatal ang anyo, eventive ang gamit nito sa salaysay at tumutukoy sa pagkamatay sa sandaling iyon.
