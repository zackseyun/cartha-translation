  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: tl
  text: At tuwing pumapasok ang hari sa bahay ni Yahweh, binubuhat ng mga bantay[b] ang mga iyon[a] at pagkatapos ay ibinabalik nila ang mga iyon sa silid ng mga bantay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ang mga tansong kalasag na ipinagawa ni Rehoboam bilang kapalit ng mga gintong kalasag na kinuha ni Shishak (tingnan ang 1 Hari 14:27).
    reason: cross_reference
  - marker: b
    text: Sa Hebreo, “mga mananakbo.” Sa ganitong maharlikang konteksto, tumutukoy ito sa mga bantay o personal na tagapagbantay ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At
  rationale: Ang panandang pasalaysay ay likas na naipagpapatuloy sa Tagalog sa pamamagitan ng “At,” nang hindi pilit na isinasalin ang idyomang “at nangyari.”
- source_word: מִדֵּי בֹא
  choice: tuwing pumapasok
  rationale: Ipinahihiwatig ng מִדֵּי kasama ng pawatas ang paulit-ulit o nakaugaliang pangyayari; malinaw itong naihahayag ng “tuwing.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tahasang tumutukoy sa haring si Rehoboam ayon sa konteksto.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong ekspresyong “bahay” para sa santuwaryo o templo at ang personal na pangalang Yahweh.
- source_word: יִשָּׂאוּם
  choice: dinadala ... ang mga iyon
  rationale: Ang di-ganap na pandiwa sa paulit-ulit na balangkas ay nagsasaad ng nakaugaliang kilos. Ang maramihang layon ay tumutukoy sa mga kalasag na binanggit sa naunang talata.
- source_word: הָרָצִים
  choice: mga bantay
  rationale: Bagaman literal na “mga mananakbo,” ginagamit ang salita sa maharlikang konteksto para sa mga bantay o tagapagbantay ng hari; mas malinaw sa makabagong Tagalog ang “mga bantay.”
- source_word: וֶהֱשִׁיבוּם
  choice: at pagkatapos ay ibinabalik
  rationale: Ang Hiphil ng שׁוב ay nangangahulugang ipabalik o dalhin pabalik; ipinapakita ng “pagkatapos” ang pagkakasunod ng nakaugaliang mga kilos.
- source_word: אֶל תָּא הָרָצִים
  choice: sa silid ng mga bantay
  rationale: Ang תָּא ay isang silid o kamara; pinananatili ng salin ang ugnayang paari nang natural sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “bahay ni Yahweh” upang katawanin ang Hebreong parirala, habang ginamit ang “mga bantay” sa pangunahing teksto para maipahayag ang tungkulin ng mga tinatawag na “mga mananakbo.”
