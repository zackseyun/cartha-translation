  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: tl
  text: Kinuha niya ang mga kayamanan ng bahay ni Yahweh at ang mga kayamanan ng bahay ng hari—kinuha niya ang lahat. Kinuha rin niya ang lahat ng kalasag na yari sa ginto na ginawa ni Solomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: kinuha niya
  rationale: Pinananatili ang payak at paulit-ulit na diwa ng pandiwang לקח nang hindi nagdaragdag ng mas matinding kahulugang gaya ng “sinamsam.”
- source_word: אֹצְרוֹת
  choice: mga kayamanan
  rationale: Sa konteksto, ang kinukuha ay ang mahahalagang laman, hindi ang mismong mga imbakan o silid-yaman.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Malapit ito sa literal na Hebreong “bahay ni YHWH” at nauunawaan sa konteksto bilang templo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Pinananatili ang Hebreong larawan at kayarian; tumutukoy ito sa tirahan o palasyo ng hari.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: kinuha niya ang lahat
  rationale: Inilalahad ang mariing pagbubuod ng lubusang pagkuha sa mga kayamanan.
- source_word: מָגִנֵּי הַזָּהָב
  choice: mga kalasag na ginto
  rationale: Natural sa modernong Tagalog at malinaw na ang mga kalasag ay yari sa ginto.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: na ipinagawa ni Solomon
  rationale: Ang causative na “ipinagawa” ay natural sa Tagalog para sa mga kagamitang ipinalikha ng hari, habang hindi iginigiit na siya mismo ang pisikal na gumawa.
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: Kinuha niya ... Kinuha rin niya
  rationale: Pinananatili ang pag-uulit at ang pandagdag na daloy ng salaysay sa natural na Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa teksto sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang Hebreong “bahay” sa halip na gawing “templo” at “palasyo,” sapagkat malinaw ang konteksto at napapanatili nito ang larawan ng orihinal.
