- from: Kinuha niya ang mga kayamanan sa bahay ni Yahweh at ang mga kayamanan sa bahay ng hari—kinuha niya ang lahat. Kinuha rin niya ang lahat ng kalasag na ginto na ipinagawa ni Solomon.
  to: Kinuha niya ang mga kayamanan ng bahay ni Yahweh at ang mga kayamanan ng bahay ng hari—kinuha niya ang lahat. Kinuha rin niya ang lahat ng kalasag na yari sa ginto na ginawa ni Solomon.
  rationale: Pinalitan ang causative na “ipinagawa” ng “ginawa” upang tumpak na maipahayag ang Hebreong pandiwa. Ginawang “mga kayamanan ng bahay” ang dating “mga kayamanan sa bahay” upang mas malinaw na maipakita na ang kayamanang kabilang sa dalawang bahay ang kinuha. Ang “yari sa ginto” ay mas likas at mas tiyak na Tagalog para sa mga kalasag na ginto.
