  register: Gumamit ng modernong, marangal, at madaling maunawaang Filipino. Pinili ang “umuwi” para sa natural na daloy, habang pinanatili sa pangunahing teksto ang konkretong Hebreong larawan na “mga paa mo” at ipinaliwanag ito sa talababa.
