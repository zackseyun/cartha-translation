  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: tl
  text: Ngunit ikaw, bumangon ka at umuwi sa iyong bahay. Sa pagpasok mo sa lungsod[a], mamamatay ang bata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “sa pagpasok ng mga paa mo sa lungsod.” Ginagamit dito ang “mga paa mo” bilang idyoma para sa sandali ng iyong pagdating.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: Ngunit ikaw
  rationale: Ang pangatnig at tahasang panghalip na pambabae ay nagbibigay-diin at nagpapakita ng paglipat pabalik sa babae; natural itong naipapahayag ng “Ngunit ikaw.”
- source_word: ק֖וּמִי
  choice: bumangon ka
  rationale: Ang pautos na anyo ng קום ay nangangahulugang bumangon o tumayo; ang “bumangon ka” ay malinaw, kasalukuyan, at angkop sa marangal na salaysay.
- source_word: לְכִ֣י לְ/בֵיתֵ֑/ךְ
  choice: umuwi sa iyong bahay
  rationale: Bagaman literal na “pumunta ka sa iyong bahay,” natural na ipinahihiwatig sa Filipino ng “umuwi” ang pagpunta sa sariling bahay nang hindi binabago ang direksiyon ng utos.
- source_word: בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ
  choice: Pagpasok ng mga paa mo
  rationale: Ang בְּ kasama ng infinitive construct ay temporal (“pagpasok”), at pinananatili ang tahasang larawan ng Hebreong “mga paa mo,” kahit idiomatiko itong tumutukoy sa mismong pagdating ng babae.
- source_word: הָ/עִ֖ירָ/ה
  choice: sa lungsod
  rationale: Ipinahihiwatig ng directional ending ang pagpasok patungo sa lungsod; sapat na naihahatid ito ng “sa lungsod” kasunod ng “pagpasok.”
- source_word: וּ/מֵ֥ת
  choice: mamamatay
  rationale: Sa kontekstong propetiko, ang perfect na may pangatnig ay nagsasaad ng tiyak na pangyayaring darating; malinaw itong ipinapahayag ng panghinaharap na “mamamatay.”
- source_word: הַ/יָּֽלֶד
  choice: ang bata
  rationale: Maaaring tumukoy ang יֶלֶד sa bata o batang lalaki; hindi binibigyang-diin dito ang kasarian, kaya ang “bata” ang pinakaangkop at hindi labis na tiyak.
