  source_fidelity: Tumpak ang pangunahing diwa, ngunit ang “Hindi na nakakakita” ay maaaring magpahiwatig na dati siyang nakakakita at ngayo’y tuluyang wala nang paningin, samantalang ang Hebreo ay nagsasaad ng kasalukuyang kawalan ng kakayahang makakita dahil sa katandaan. Mas maingat ang “Hindi makakita.”
  naturalness: Ang “Tumindig siya” ay nauunawaan ngunit hindi ang pinakanatural na modernong Filipino para sa karaniwang kilos na pagsisimula ng paglalakbay. Mas natural ang “Bumangon siya.” Ang “Ganoon ang ginawa” ay mas payak at likas kaysa “Gayon nga ang ginawa.”
  terminology: Nananatiling angkop ang mga pangalang Jeroboam, Shilo, at Ahias. Ang “malabo ang kanyang mga mata” ay isang natural na pagsasalin ng kahulugang idyomatiko ng Hebreong paglalarawan, habang pinananatili ng talababa ang literal na larawan.
