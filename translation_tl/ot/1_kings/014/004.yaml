base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: tl
  text: Ganoon ang ginawa ng asawa ni Jeroboam. Bumangon siya at pumunta sa Shilo, at nakarating sa bahay ni Ahias. Hindi makakita si Ahias sapagkat malabo ang kanyang mga mata[a] dahil sa katandaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nakatayo ang kanyang mga mata,” isang idyoma para sa paghina o pagkawala ng paningin dahil sa katandaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: Gayon nga ang ginawa
  rationale: Likas na salaysay sa Filipino na nagpapakitang sinunod ng babae ang naunang tagubilin.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: asawa ni Jeroboam
  rationale: Tuwiran at natural na anyo ng pariralang konstrakto sa modernong Filipino.
- source_word: וַתָּקָם
  choice: Tumindig siya
  rationale: Pinananatili ang hiwalay na kilos sa sunod-sunod na salaysay at ang bahagyang marangal na himig ng Hebreo.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: pumunta sa Shilo
  rationale: Payak at tumpak na paglalarawan ng pagkilos patungo sa isang destinasyon.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: nakarating sa bahay ni Ahias
  rationale: Ipinahihiwatig ng parirala ang pagdating sa bahay, nang hindi ipinipilit na pumasok siya sa loob.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: Hindi na nakakakita
  rationale: Natural na Filipino para sa kawalan na ng kakayahang makakita sa konteksto ng katandaan.
- source_word: קָמוּ עֵינָיו
  choice: lumabo na ang kanyang mga mata
  rationale: Ipinahahayag ang kahulugan ng idyomang Hebreo—ang paghina o pagkawala ng paningin—sa paraang malinaw sa karaniwang mambabasa; inilalahad sa talababa ang literal na larawan.
- source_word: מִשֵּׂיבוֹ
  choice: dahil sa katandaan
  rationale: Malinaw na itinuturing ang katandaan bilang sanhi ng paghina ng paningin.
