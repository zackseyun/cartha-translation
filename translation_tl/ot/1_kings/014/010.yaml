id: 1KI.14.10
reference: 1 Kings 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: tl
  text: Kaya nga, narito, magpapasapit ako ng kapahamakan sa sambahayan ni Jeroboam. Lilipulin ko mula sa sambahayan ni Jeroboam ang bawat lalaki[a]—alipin man o malaya—sa Israel.[b] Lubusan kong aalisin ang sambahayan ni Jeroboam, gaya ng lubusang pag-aalis ng dumi hanggang sa maubos ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “umiihi sa pader,” isang magaspang na idyoma para sa lalaki.
    reason: lexical_alternative
  - marker: b
    text: O “nakakulong at pinabayaan.” Hindi tiyak ang eksaktong kahulugan ng pares na Hebreo; malamang na isa itong merismo na tumutukoy sa lahat nang walang pagbubukod.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: kapahamakan
  rationale: Sa pahayag ng hatol, tumutukoy ito sa matinding kalamidad na pasasapitin, hindi sa moral na kasamaan.
- source_word: הִנְנִי
  choice: makinig kayo
  rationale: Ginagawang natural sa Filipino ang pormulang pantawag-pansin na nagpapakilala sa tiyak at nalalapit na kilos ng nagsasalita.
- source_word: וְהִכְרַתִּי
  choice: Lilipulin ko
  rationale: Ipinahahayag nito ang ganap na pagkitil sa mga lalaki ng dinastiya; mas natural at mariin ito sa Filipino kaysa sa literal na 'puputulin ko.'
- source_word: מַשְׁתִּין בְּקִיר
  choice: bawat lalaki
  rationale: Magaspang na idyomang Hebreo ito para sa mga lalaki; malinaw sa pangunahing teksto ang tinutukoy, habang nasa talababa ang literal na larawan.
- source_word: עָצוּר וְעָזוּב
  choice: alipin man o malaya
  rationale: Pinananatili ang pares bilang merismo na nagpapahiwatig na walang lalaking makaliligtas, bagaman hindi ganap na tiyak ang eksaktong kahulugan ng mga salitang Hebreo.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: Aalisin ko ang sambahayan ni Jeroboam
  rationale: Sa konteksto ng kasunod na paghahambing sa dumi, ipinahihiwatig ng pandiwa ang lubusang paglilinis o pag-aalis; natural itong inilalahad sa Filipino nang hindi ginagamit ang alanganing literal na 'susunugin ang dumi.'
- source_word: הַגָּלָל
  choice: dumi
  rationale: Pinananatili ang mapanghamak at tahasang larawan ng dumi, sa halip na palambutin bilang 'kalat.'
- source_word: עַד תֻּמּוֹ
  choice: hanggang sa maubos ito
  rationale: Malinaw na ipinahahayag ang ganap na pagkawala na tinutukoy ng parirala.
theological_decisions:
- issue: Tindi ng hatol ng Diyos laban sa sambahayan ni Jeroboam
  choice: Gumamit ng tuwiran at mariing pananalitang 'magpapasapit ako ng kapahamakan,' 'lilipulin,' at 'hanggang sa maubos.'
  alternative: Palambutin bilang 'magdadala ako ng problema' o 'aalisin ko ang ilan.'
  rationale: Ang Hebreo ay isang matindi at ganap na pahayag ng hatol; hindi dapat bawasan ng salin ang bigat o lawak nito.
- issue: Saklaw ng עָצוּר וְעָזוּב
  choice: Isinalin bilang 'alipin man o malaya' at nilinaw sa talababa ang kawalang-katiyakan ng idyoma.
  alternative: Isalin nang literal bilang 'nakakulong at pinabayaan' o gawing tahasang 'lahat nang walang pagbubukod.'
  rationale: Pinananatili ng pares ang anyong merismo at ang tunay na leksikal na kalabuan nang hindi ipinipilit ang isang tiyak na interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sambahayan” para sa dinastiya o angkan ni Jeroboam, at pinanatili ang matinding, mapanghamak na larawan ng dumi. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinaliliwanag ng mga ito.
