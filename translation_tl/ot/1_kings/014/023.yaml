reference: 1 Kings 14:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: tl
  text: Nagtayo rin sila para sa kanilang sarili ng mga sambahan sa matataas na lugar, mga sagradong haliging bato, at mga poste ni Ashera[a] sa bawat mataas na burol at sa ilalim ng bawat luntiang puno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Asherim” o “mga sagradong poste.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa pagsambang kaugnay ni Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: Nagtayo
  rationale: Karaniwang nangangahulugang “magtayo” o “bumuo” ang בנה. Ang “nagtayo” ay angkop sa magkakasamang mga pook at kagamitang panrelihiyon.
- source_word: גַם הֵמָּה
  choice: rin sila
  rationale: Pinananatili nito ang dagdag at mariing diwa ng parirala, na nag-uugnay sa kanilang ginawa sa naunang binanggit na kasalanan.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: 'Ipinahahayag nito ang reflexive na diwa: itinayo nila ang mga ito para sa sarili nilang paggamit.'
- source_word: בָּמוֹת
  choice: mga sambahan sa matataas na lugar
  rationale: Ang בָּמוֹת ay tumutukoy sa mga lokal na pook ng pagsamba, hindi lamang sa matataas na lupain. Malinaw at likas sa modernong Filipino ang saling ito.
- source_word: מַצֵּבוֹת
  choice: mga sagradong haliging bato
  rationale: Tumutukoy ang salita sa mga itinayong bato o haligi na ginagamit sa gawaing panrelihiyon; nililinaw ng “sagradong” at “bato” ang bagay at gamit nito.
- source_word: אֲשֵׁרִים
  choice: mga poste ni Ashera
  rationale: Malamang na tumutukoy ang anyong maramihan sa mga bagay na panrelihiyong kaugnay ni Ashera. Pinananatili ng salin ang pangalan at ipinakikitang mga pisikal na bagay ang tinutukoy, habang inilalahad sa talababa ang leksikal na kalabuan.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: sa bawat mataas na burol
  rationale: Tuwiran at natural nitong pinananatili ang topograpikal at retorikal na lakas ng parirala.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: at sa ilalim ng bawat luntiang puno
  rationale: Ipinahahayag ng “luntian” ang kasariwaan at mayamang dahon na saklaw ng רַעֲנָן, at pinananatili ang nakaugaliang paglalarawan sa mga lugar ng pagsamba sa diyus-diyosan.
theological_decisions:
- issue: Kung ang אֲשֵׁרִים ay tumutukoy kay Ashera mismo o sa mga bagay na panrelihiyong kaugnay niya
  choice: mga poste ni Ashera
  alternative: mga Asherim; mga sagradong poste; mga larawan ni Ashera
  rationale: Dahil nakahanay ito sa mga pook-sambahan at sagradong haliging bato, mas malamang na mga pisikal na bagay na panrelihiyon ang tinutukoy. Gayunman, hindi lubos na tiyak ang eksaktong anyo ng mga ito, kaya pinananatili sa talababa ang mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga sambahan sa matataas na lugar” upang maipaliwanag ang teknikal na kahulugan ng בָּמוֹת nang hindi umaasa sa di-likas na literal na parirala; pinanatili naman ang pangalang Ashera at ang tunay na kalabuan ng אֲשֵׁרִים sa pamamagitan ng talababa.
