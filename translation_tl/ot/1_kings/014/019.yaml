translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang em dash upang malinaw na ihiwalay ang dalawang paglalarawan sa mga ginawa ni Jeroboam. Pinanatiling simple ang pormulang pangkasaysayan at iniwasan ang katawagang maaaring magkamaling magpahiwatig na ang tinutukoy ay ang biblikal na Mga Cronica.
