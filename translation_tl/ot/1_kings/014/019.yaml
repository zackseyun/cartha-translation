  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa[a] ni Jeroboam—kung paano siya nakipagdigma at kung paano siya naghari—narito, nakasulat ang mga ito[b] sa Aklat ng mga Salaysay ng mga Hari ng Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang iba pang mga bagay tungkol kay Jeroboam.” Sa pormulang ito ng pagbubuod sa paghahari, saklaw ng “mga ginawa” ang kanyang naitalang mga gawain at pamamahala.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “narito, nakasulat ang mga iyon,” isang pananalitang nagtutuon ng pansin sa nasusulat na tala.'
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy ito sa isang opisyal na talaan o salaysay ng kaharian, hindi sa biblikal na aklat ng Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang nagbubuod sa paghahari, ang דִּבְרֵי ay tumutukoy hindi lamang sa mga salita kundi sa mga gawain o pangyayari tungkol sa hari. Likas sa modernong Tagalog ang “iba pang mga ginawa,” samantalang ang paunang וְ ay hindi kailangang isalin nang hiwalay sa talatang ito.
- source_word: אֲשֶׁר נִלְחַם
  choice: kung paano siya nakipagdigma
  rationale: Ang נלחם ay nangangahulugang makipaglaban o makipagdigma. Ipinakikilala ng אֲשֶׁר ang isang bahagi ng mga gawa ni Jeroboam; pinananatili ng “kung paano” ang paraan ng paglalahad nang walang idinaragdag na tiyak na digmaan.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: at kung paano siya naghari
  rationale: Ang מלך sa Qal ay “maghari” o “maging hari.” Ang pagkakapantay nito sa naunang sugnay ay natural na naihahayag sa “at kung paano siya naghari.”
- source_word: הִנָּם כְּתוּבִים
  choice: ay nakasulat
  rationale: Ang pangunahing diwa ay na ang mga nabanggit na gawa ay nasa nasusulat na tala. Hindi ginamit sa pangunahing teksto ang literal na “narito” sapagkat hindi ito likas sa modernong Tagalog sa ganitong pormula; ipinaliliwanag sa talababa ang presentatibong diin ng הִנָּם.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng balumbon,” ang karaniwang kahulugan sa kontekstong pansanggunian ay “nakasulat sa aklat.”
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Aklat ng mga Salaysay ng mga Hari ng Israel
  rationale: Ang parirala ay pamagat ng isang annalistikong talaan tungkol sa mga hari ng Israel. Ang “mga Salaysay” ay malinaw at marangal na Tagalog at hindi ito tahasang ipinapantay sa biblikal na aklat ng Mga Cronica.
