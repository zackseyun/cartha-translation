  to: Sinabi ni Jeroboam sa kanyang asawa, “Pakiusap, tumayo ka at magbalatkayo upang hindi nila malaman[a] na ikaw ang asawa ni Jeroboam, at pumunta ka sa Silo. Naroon si Ahias na propeta; siya ang nagsalita tungkol sa akin[b], na magiging hari ako sa bayang ito.”
