source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: tl
  text: Sinabi ni Jeroboam sa kanyang asawa, “Pakiusap, tumayo ka at magbalatkayo upang hindi nila malaman[a] na ikaw ang asawa ni Jeroboam, at pumunta ka sa Silo. Naroon si Ahias na propeta; siya ang nagsalita tungkol sa akin[b], na magiging hari ako sa bayang ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “at hindi nila malalaman.” Hindi tinutukoy sa Hebreo kung sino ang “nila.”
    reason: lexical_alternative
  - marker: b
    text: O, “tungkol sa pagiging hari ko sa bayang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na katumbas ng wayyiqtol ng אמר; natural at tuwiran sa modernong Filipino.
- source_word: לְאִשְׁתּוֹ
  choice: sa kanyang asawa
  rationale: Malinaw na tumutukoy sa asawa ni Jeroboam at pinananatili ang ugnayang ipinahahayag ng hulaping paari.
- source_word: קוּמִי נָא
  choice: Tumayo ka ... pakiusap
  rationale: Pinananatili ng pautos na “Tumayo ka” ang קוּמִי, samantalang ipinahahayag ng “pakiusap” ang pakiusap o pagpapalumanay ng נָא nang hindi makaluma.
- source_word: וְהִשְׁתַּנִּית
  choice: at magbalatkayo
  rationale: Ang hitpael ng שנה sa kontekstong ito ay pagbabago ng anyo upang hindi makilala; “magbalatkayo” ang maikli at natural na katumbas.
- source_word: וְלֹא יֵדְעוּ
  choice: upang hindi nila malaman
  rationale: Ipinakikita ang layunin ng pagbabalatkayo ngunit pinananatiling di-tiyak ang maramihang simuno ng Hebreo sa “nila.”
- source_word: כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  choice: na ikaw ang asawa ni Jeroboam
  rationale: Malapit sa anyong Hebreo at malinaw sa Filipino, kasama ang diin sa pagkakakilanlan ng babae.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: Pagkatapos, pumunta ka sa Shilo
  rationale: Ang sunod na perfect ay may puwersang pautos sa konteksto; nililinaw ng “Pagkatapos” ang pagkakasunod-sunod nang hindi binabago ang diwa.
- source_word: הִנֵּה שָׁם
  choice: Tingnan mo, naroon
  rationale: Pinananatili ng “Tingnan mo” ang pantawag-pansing puwersa ng הִנֵּה sa natural at kasalukuyang Filipino.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: si Ahias na propeta
  rationale: Ginagamit ang nakaugaliang anyong Filipino ng pangalan at natural na paglalagay ng titulong “propeta.”
- source_word: הוּא דִבֶּר
  choice: siya ang nagsalita
  rationale: Ang hulma na “siya ang” ay nagpapanatili sa diin ng malayang panghalip na הוּא.
- source_word: עָלַי
  choice: tungkol sa akin
  rationale: Sa pagsama sa דבר, ang עַל ay likas na nangangahulugang “tungkol sa” o “hinggil sa.”
- source_word: לְמֶלֶךְ
  choice: na magiging hari ako
  rationale: Ipinahahayag nito ang hinaharap na katayuang ipinropesiya tungkol kay Jeroboam, habang inilalagay sa talababa ang mas maikling alternatibong sintaktiko.
theological_decisions:
- issue: Ugnayan ng עָלַי at לְמֶלֶךְ
  choice: “tungkol sa akin, na magiging hari ako”
  alternative: “tungkol sa pagiging hari ko sa bayang ito”
  rationale: Hindi ganap na tinutukoy ng maikling pariralang Hebreo kung ang לְמֶלֶךְ ay dapat ilahad bilang sugnay ng nilalaman o bilang katayuan/pagiging hari. Pinili sa teksto ang malinaw na pagbasa ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Iniwasan ang makalumang “bumangon ka” at “narito” bilang katumbas ng הִנֵּה; ginamit ang “Tingnan mo, naroon” upang maging malinaw ang lokasyong tinutukoy. Ang “magbalatkayo” ay karaniwan at eksakto sa kontekstong ito.
