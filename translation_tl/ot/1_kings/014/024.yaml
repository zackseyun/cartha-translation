  verdict: revise
  source_fidelity: Tumpak sa pangkalahatan ang pagsasalin ng וְגַם, קָדֵשׁ, ang eksistensiyal na הָיָה בָאָרֶץ, at ang pagpapaalis ni Yahweh sa mga bansa. Gayunman, ang 'Ginawa nila ang lahat ng ... gawain' ay bahagyang nagpapalit sa paghahambing na כְּכֹל ('ayon sa/tulad ng lahat ng') tungo sa tuwirang bagay ng pandiwa. Ang rebisyon ay ibinabalik ang paghahambing nang natural sa Tagalog.
  naturalness: Makabago at malinaw ang karamihan ng teksto. Mas likas ang 'Isinagawa rin nila ang lahat ng kasuklam-suklam na gawi...' kaysa 'Ginawa nila ang lahat ng kasuklam-suklam na gawain,' at naipapahayag nito ang diwa ng pagtulad nang hindi nagiging mabigat.
  terminology: Ang 'mga lalaking prostitutong panritwal' ay katanggap-tanggap na pagsasalin ng kolektibong קָדֵשׁ at iniiwasan ang maling tradisyonal na katawagan. Ang talababa ay dapat mag-ingat na huwag ipakita bilang lubos na tiyak ang pinagtatalunang saklaw ng terminong Hebreo; sapat na sabihing kaugnay ito ng ipinagbabawal na seksuwal na gawi sa kulto.
  issues:
  - severity: medium
    issue: Ang כְּכֹל ay hindi hayag na naipapahayag bilang paghahambing.
    rationale: Ang 'Ginawa nila ang lahat ng kasuklam-suklam na gawain' ay maaaring basahing ginawa nila ang bawat gawain mismo, samantalang ang Hebreo ay nagsasaad na kumilos sila ayon sa lahat ng gayong kasuklam-suklam na gawi.
  - severity: low
    issue: Masyadong tiyak ang pahayag ng talababa tungkol sa kahulugan ng קָדֵשׁ.
    rationale: Ang ugnayan ng termino sa seksuwal na gawi sa kulto ay malakas na leksikal na pagbasa, ngunit ang eksaktong institusyonal na tungkulin ay pinagtatalunan; ang talababa ay dapat magpanatili ng angkop na pag-iingat.
