  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: tl
  text: Mayroon ding mga lalaking prostitutong panritwal[a] sa lupain. Isinagawa rin nila ang lahat ng kasuklam-suklam na gawi ng mga bansang pinalayas ni Yahweh sa harap ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga lalaking prostitutong pangkulto” o “mga prostitutong pandambana.” Ang Hebreong קָדֵשׁ ay tumutukoy sa isang taong kaugnay ng ipinagbabawal na seksuwal na gawi sa konteksto ng kulto o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Mayroon ding
  rationale: Likas na ipinahahayag sa Tagalog ang pandagdag na diwa at ang kasunod na pangungusap na nagsasaad ng pag-iral.
- source_word: קָדֵשׁ
  choice: mga lalaking prostitutong panritwal
  rationale: Ang pangngalan ay panlalaki at tumutukoy sa mga taong kaugnay ng ipinagbabawal na seksuwal na gawain sa konteksto ng pagsamba. Ginawang maramihan sa Tagalog upang natural na maipahayag ang kolektibong gamit ng isahan.
- source_word: הָיָה בָאָרֶץ
  choice: sa lupain
  rationale: Kasama ng “Mayroon,” malinaw nitong ipinahahayag ang eksistensiyal at lokatibong diwa ng Hebreo.
- source_word: עָשׂוּ
  choice: Ginawa nila
  rationale: Pinananatili ang malawak at payak na kahulugan ng pandiwa, pati ang maramihang paksa na hindi tahasang tinutukoy sa talata.
- source_word: כְּכֹל
  choice: ang lahat
  rationale: Sa natural na balangkas ng Tagalog, ipinahahayag nito ang ganap na pagtulad sa mga gawaing binanggit.
- source_word: הַתּוֹעֲבֹת
  choice: kasuklam-suklam na gawain
  rationale: Inihahatid nito ang matinding moral at panrelihiyong paghatol ng salitang Hebreo nang malinaw sa makabagong Tagalog.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy sa mga di-Israelitang bayan sa konteksto ng Canaan, nang hindi nag-aangkat ng mas huling teknikal na diwa ng “mga Hentil.”
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Ang Hiphil ay nagsasaad na inalis at pinaalis ang dating mga naninirahan sa lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalan ng Diyos ayon sa patakaran ng proyekto.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Pinananatili ang larawang spatial ng Hebreong pormula tungkol sa pagpapaalis sa mga bansa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyong pampamilya at panlalaki ng Hebreo, na ginagamit din bilang katawagan sa bayan.
theological_decisions:
- issue: Kahulugan ng קָדֵשׁ sa konteksto ng ipinagbabawal na pagsamba at seksuwal na gawain
  choice: mga lalaking prostitutong panritwal
  alternative: mga lalaking prostitutong pangkulto; mga prostitutong pandambana
  rationale: Ipinakikita ng anyong panlalaki at ng konteksto na mga lalaking kaugnay ng seksuwal na gawaing panritwal ang tinutukoy. Iniiwasan ang tradisyonal ngunit mapanlinlang na katawagang nag-uugnay nito agad sa isang partikular na seksuwal na pagkakakilanlan.
- issue: Pagpapanatili sa di-tahasang tinutukoy ng maramihang עָשׂוּ
  choice: Ginawa nila
  alternative: Ginawa ng mga taga-Juda
  rationale: Hindi tahasang pinapangalanan ng talata ang paksa ng pandiwa. Pinananatili ng “nila” ang ugnayan sa konteksto nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- issue: Pagpapahayag ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang pormal na larawang pampamilya ng pinagmulan habang nananatiling madaling maunawaan.
- issue: Pagpapahayag ng pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit ang transliterasyon ng tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “panritwal” upang maipakita ang kaugnayan sa pagsambang pagano nang hindi gumamit ng sobrang teknikal o denominasyonal na katawagan. Pinanatili ang bahagyang kalabuan ng “nila” sa Hebreong maramihang pandiwa.
