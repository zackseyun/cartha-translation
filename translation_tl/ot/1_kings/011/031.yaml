  source_fidelity: 'Tumpak sa kabuuan ang salin: napapanatili ang pautos, ang sampung pirasong napunit, ang pangalan na Yahweh, ang matingkad na ‘pinupunit ko,’ ang idyomang ‘mula sa kamay ni Solomon,’ at ang sampung lipi. Gayunman, ang ‘ganito ang sinabi’ ay nakaraang panahon at hindi gaanong naaayon sa propetikong pormulang כִּי כֹה אָמַר, na sa kontekstong ito ay pagpapakilala sa kasunod na tuwirang pahayag.'
  naturalness: Marangal at madaling maunawaan ang Tagalog. Mas natural at tumpak ang ‘ganito ang sinasabi ni Yahweh’ kaysa ‘ganito ang sinabi ni Yahweh.’ Ang paglipat ng ‘para sa sarili mo’ matapos ang layon ay bahagyang mas maayos ang daloy ng pangungusap.
  terminology: Ang ‘Yahweh,’ ‘Diyos ng Israel,’ ‘kaharian,’ at ‘lipi’ ay angkop at magkakatugma. Ang talababa ay dapat gumamit ng mas malinaw na ‘mga pirasong napunit’ upang ipahayag na ang mga ito ay bunga ng pagpunit.
