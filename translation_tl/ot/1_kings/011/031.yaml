  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: tl
  text: 'At sinabi niya kay Jeroboam, “Kumuha ka ng sampung piraso[a] para sa sarili mo, sapagkat ganito ang sinasabi ni Yahweh, ang Diyos ng Israel: ‘Tingnan mo, pinupunit ko ang kaharian mula sa kamay ni Solomon, at ibibigay ko sa iyo ang sampung lipi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sampung pirasong napunit.” Ang pangngalang Hebreo ay tumutukoy sa mga pirasong nalikha sa pagpunit, kaayon ng simbolikong pagpunit ni Ahias sa kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: Kumuha ka para sa sarili mo
  rationale: Pinananatili ng “kumuha” ang pautos na קַח, at ipinahahayag ng “para sa sarili mo” ang personal o reflexive na diin ng לְךָ sa natural na Tagalog.
- source_word: קְרָעִים
  choice: mga piraso
  rationale: Tumutukoy ito sa mga pirasong nalikha sa pagpunit ng kasuotan. Pinakanatural sa konteksto ang “mga piraso,” habang ipinaliliwanag sa talababa ang ugnayan nito sa pagpunit.
- source_word: כִּי כֹה אָמַר
  choice: sapagkat ganito ang sinabi
  rationale: Malapit ito sa pormulang propetiko na “sapagkat ganito ang sinabi,” ngunit nananatiling malinaw at marangal sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Likas na salin ito ng pariralang konstrukto at malinaw na kinikilala si Yahweh bilang Diyos ng Israel.
- source_word: הִנְנִי
  choice: Tingnan mo,
  rationale: Ginagampanan nito ang pansin-pukaw at agarang diin ng הִנְנִי nang hindi gumagamit ng makalumang pananalita.
- source_word: קֹרֵעַ
  choice: pinupunit ko
  rationale: Ang pandiwaring Hebreo ay naghahayag ng matingkad o nalalapit na pagkilos; pinananatili ng aspektong nagaganap sa Tagalog ang dramatikong puwersa nito.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Direkta at karaniwang katumbas ito ng pangngalang tumutukoy sa kaharian o nasasakupan.
- source_word: מִיַּד שְׁלֹמֹה
  choice: mula sa kamay ni Solomon
  rationale: Pinananatili ang larawang Hebreo ng pag-aalis mula sa kamay, samakatuwid ay mula sa kapangyarihan o pag-aari ni Solomon.
- source_word: וְנָתַתִּי לְךָ
  choice: at ibibigay ko sa iyo
  rationale: Natural na ipinahahayag nito sa Tagalog ang pangakong pagkilos at ang di-tuwirang layon.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: ang sampung lipi
  rationale: Ang “lipi” ang malinaw na katumbas para sa mga yunit ng Israel, at pinananatili ng “ang” ang pagiging tiyak ng pariralang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin pinipili ang anyong “Jehova.”
- issue: Aspekto ng pagkilos sa קֹרֵעַ
  choice: pinupunit ko
  alternative: pupunitin ko / pupunitin ko na
  rationale: Pinananatili ng kasalukuyang progresibong anyo ang matingkad na participial na paglalarawan. Hindi nito nilulutas nang labis kung ang diin ay kasalukuyan o nalalapit na pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang makalumang “narito” o sobrang pormal na pormula, ngunit pinanatili ang larawang “mula sa kamay ni Solomon” at ang matingkad na “pinupunit ko.”
