    issue: ‘ganito ang sinabi ni Yahweh’
    rationale: Ang nakaraang-panahong ‘sinabi’ ay maaaring magmukhang pagtukoy sa isang naunang pahayag. Ang Hebreong propetikong pormula ay nagpapakilala sa pahayag na kasunod; ‘ganito ang sinasabi ni Yahweh’ ang mas tapat at natural na modernong Tagalog.
  - severity: low
    issue: ‘sampung pirasong pinunit’ sa talababa
    rationale: Hindi ganap na malinaw ang anyong ito sa Tagalog at maaari itong basahing may di-binanggit na tagaganap. Ang ‘sampung pirasong napunit’ ay malinaw na tumutukoy sa mga pirasong nagmula sa pagpunit.
