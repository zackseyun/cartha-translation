id: 1KI.11.32
reference: 1 Kings 11:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: tl
  text: Ngunit isang lipi ang mananatili sa kanya[a] alang-alang sa lingkod kong si David at alang-alang sa Jerusalem, ang lungsod na pinili ko mula sa lahat ng lipi ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “isang lipi.” Madalas itong unawain na kasama ang Benjamin sa Juda, lalo na dahil sa kinaroroonan ng Jerusalem, ngunit “isang lipi” mismo ang mababasa sa teksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Ngunit isang lipi
  rationale: Ang שֵׁבֶט ay tumutukoy dito sa lipi ng Israel, hindi sa tungkod o setro. Isinalin ang pang-ugnay bilang “Ngunit” upang ipakita ang pagsalungat sa naunang paghahati ng kaharian.
- source_word: יִהְיֶה לּוֹ
  choice: ang mananatili sa kanya
  rationale: Literal itong “magiging kanya,” ngunit sa konteksto ng pag-agaw sa kaharian, likas na ipinahahayag ng “mananatili sa kanya” ang patuloy na pag-aari nang hindi labis na nagpapaliwanag.
- source_word: לְמַעַן
  choice: alang-alang sa
  rationale: Pinananatili nito ang diwa ng layunin o pagkilos dahil sa pagsasaalang-alang kina David at Jerusalem.
- source_word: עַבְדִּי דָוִד
  choice: lingkod kong si David
  rationale: Natural at marangal na Tagalog para sa tipanang katawagang “aking lingkod na si David.”
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Jerusalem, ang lungsod
  rationale: Pinananatili ng appositive na parirala ang pagkakakilanlan sa Jerusalem bilang lungsod na pinili ng Diyos.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: na pinili ko
  rationale: Tuwirang inilalarawan ang natapos na pagpili ng Diyos; ang Hebreong panghalip na “sa loob nito/sa kanya” ay natural na hindi na inuulit sa Tagalog.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Ang מִן kasunod ng “pumili” ay nagpapahiwatig ng pagpili mula sa isang kabuuang pangkat.
theological_decisions:
- issue: Tensiyon sa bilang sa pagitan ng “isang lipi” rito at ng mga talatang nagpapahiwatig na magkasamang nasa ilalim ni Rehoboam ang Juda at Benjamin
  choice: Panatilihin sa salin ang tahasang Hebreong “isang lipi.”
  alternative: Ipaliwanag sa pangunahing teksto na kabilang ang Benjamin sa Juda, o palitan ito ng “isang kaharian” o “dalawang lipi.”
  rationale: Malinaw na “isang lipi” ang mababasa sa Hebreo. Hindi dapat alisin sa salin ang tunay na tensiyon sa pamamagitan ng pagsasaayos; ang karaniwang paliwanag ay inilalagay sa talababa.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “lipi” para sa yunit pantribo at “alang-alang sa” upang mapanatili ang motibong tipanan nang hindi nagdaragdag ng denominasyonal na paliwanag.
