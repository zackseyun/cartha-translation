  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: tl
  text: Mayroon siyang pitong daang asawa—mga prinsesa[a]—at tatlong daang kalunya. Inilihis ng kanyang mga asawa ang kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga babaeng may mataas na katayuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Mayroon siyang
  rationale: Ang idyomang היה + ל ay nagpapahayag ng pagmamay-ari; natural itong isinasalin sa modernong Tagalog bilang “Mayroon siyang.”
- source_word: נָשִׁים
  choice: mga asawa
  rationale: Sa konteksto ng mga pag-aasawang maharlika ni Solomon, tumutukoy ito sa mga asawa, hindi lamang sa mga babae.
- source_word: שָׂרוֹת
  choice: mga prinsesa
  rationale: Tumutukoy ang salita sa mga babaeng may mataas na katayuan o uring maharlika. Ang “mga prinsesa” ay maikli, natural, at angkop sa konteksto ng mga pag-aasawang pampolitika, habang inilalagay sa talababa ang mas malawak na posibleng kahulugan.
- source_word: שְׁבַע מֵאוֹת
  choice: pitong daan
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
- source_word: וּפִלַגְשִׁים
  choice: at tatlong daang kalunya
  rationale: Ang “kalunya” ang nakaugaliang katawagan sa kinikilalang kaparehang seksuwal o pangmag-asawa na mas mababa ang katayuan kaysa pangunahing asawa; pinananatili nito ang pagkakaiba sa נָשִׁים.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: tatlong daan
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
- source_word: וַיַּטּוּ
  choice: Inilihis
  rationale: Ipinahihiwatig ng causative na anyo ng נטה na ang mga asawa ang naging sanhi ng paglihis ng puso ni Solomon. Hindi nito labis na nililinaw kung paano nangyari ang paglihis.
- source_word: נָשָׁיו
  choice: ng kanyang mga asawa
  rationale: Tiyak na muling tinutukoy ng sugnay ang mga asawa niya, gaya ng diin ng salaysay.
- source_word: אֶת לִבּוֹ
  choice: ang kanyang puso
  rationale: Pinananatili ng “puso” ang masaklaw na Hebreong diwa ng kalooban, pag-iisip, at katapatan, sa halip na paliitin ito sa damdamin lamang.
theological_decisions:
- issue: Kahulugan ng “kanyang puso” sa konteksto
  choice: Pinanatili ang literal at masaklaw na “kanyang puso,” na maaaring tumukoy sa panloob na kalooban, pasiya, at katapatan ni Solomon.
  alternative: Tahasang isalin bilang “kanyang katapatan sa Diyos” o bilang isang pagbabago lamang ng damdamin.
  rationale: Hindi nilulutas ng salin ang buong pahiwatig sa mismong talata. Pinananatili nito ang teolohikal na bigat at lawak ng Hebreong “puso,” habang hinahayaan ang kasunod na konteksto na tukuyin ang pagtalikod ni Solomon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kalunya” bilang maikli at nakaugaliang terminong biblikal, at ang “inilihis ang kanyang puso” upang mapanatili ang metaporang Hebreo at ang sanhiang diwa ng pandiwa.
