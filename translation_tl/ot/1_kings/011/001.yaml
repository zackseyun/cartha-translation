  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: tl
  text: 'Inibig ni Haring Solomon ang maraming babaeng dayuhan[a], kabilang ang anak na babae ni Paraon: mga babaeng Moabita, Ammonita, Edomita, Sidonia, at Hetea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maraming dayuhang asawa.” “Maraming babaeng dayuhan” ang literal na sinasabi ng Hebreo; ipinahihiwatig ng konteksto na kinuha sila ni Solomon bilang mga asawa o konsorte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: Haring Solomon
  rationale: Likas na ayos sa modernong Tagalog para sa titulong maharlika at pangalang pantangi. Hindi na ginawang hiwalay na “At” ang וְ sapagkat tagapagpatuloy ito ng salaysay at hindi kailangan sa natural na daloy ng talata.
- source_word: אָהַב
  choice: inibig
  rationale: Tuwirang pinananatili ang kahulugang “umibig/minahal,” sa halip na pahinain bilang paghanga o pagnanasa lamang. Ang “inibig” ay marangal at natural sa salaysay na biblikal.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: maraming babaeng dayuhan
  rationale: Pinananatili ang tahasang “mga babae,” hindi agad nililimitahan sa “mga asawa,” at isinasalin ang נָכְרִיּוֹת bilang mga taong mula sa ibang bayan o bansa.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: kabilang ang anak na babae ng Paraon
  rationale: 'Ipinakikita ang panagdag at inklusibong ugnayan: kabilang ang anak ng Paraon sa mga babaeng inibig ni Solomon.'
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: mga babaeng Moabita, Ammonita, Edomita, Sidonio, at Heteo
  rationale: Ginamit ang karaniwang anyong Filipino ng mga katawagang etniko. Inulit ang “mga babaeng” upang maging malinaw na ang mga pang-uri sa listahan ay tumutukoy sa mga babae.
theological_decisions:
- issue: Kung isasalin ang נָשִׁים bilang “mga babae” o “mga asawa”
  choice: mga babae
  alternative: mga asawa
  rationale: “Mga babae” ang tuwirang leksikal na kahulugan. Bagaman ipinahihiwatig ng konteksto na sila ay mga asawa o konsorte ni Solomon, hindi dapat paliitin ng pangunahing teksto ang saklaw nang higit sa mismong Hebreo.
- issue: Kung kabilang ang anak na babae ng Paraon sa mga babaeng dayuhan o hiwalay na kategorya
  choice: kabilang sa kanila
  alternative: nakahiwalay bilang ibang kategorya
  rationale: 'Pinakanatural na panagdag ang sintaks: inibig ni Solomon ang maraming babaeng dayuhan, kasama ang anak ng Paraon. Pinananatili ng “kabilang” ang ugnayang ito nang hindi nagdaragdag ng paliwanag na wala sa teksto.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “inibig” para sa dignidad ng salaysay at ang “Paraon” bilang nakaugaliang katawagan. Ang em dash ay nagpapakilala sa listahan ng mga bansang pinagmulan nang hindi ginagawang hiwalay na pangungusap.
