  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: tl
  text: Ang iba pang mga gawa ni Solomon[a], at ang lahat ng kanyang ginawa, at ang kanyang karunungan—hindi ba nakasulat ang mga iyon sa Aklat ng mga Gawa ni Solomon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aklat ng mga Tala ni Solomon.” Sa Hebreo, literal itong “mga salita/usapin ni Solomon,” isang idyoma para sa tala ng kanyang mga gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Ang iba pang mga ginawa ni Solomon
  rationale: Sa pormulang pangkasaysayan tungkol sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga pangyayari o gawa, hindi lamang sa mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa” para sa nalalabing tala.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng kanyang ginawa
  rationale: Tuwirang pinananatili ang malawak na diwa ng עשה nang hindi ipinapalagay na lahat ay tagumpay o natatanging nagawa.
- source_word: וְחָכְמָתוֹ
  choice: at ang kanyang karunungan
  rationale: Tuwirang salin ng pangngalan na may hulaping panghalip at pinananatili itong hiwalay na paksa ng tala.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot; ang “mga iyon” ay natural na tumutukoy sa naunang maramihang paksa.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring literal na “sa ibabaw ng balumbon,” ang “nakasulat sa Aklat” ang likas na idyomatikong anyo sa Tagalog para sa sangguniang kasulatan.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: Aklat ng mga Gawa ni Solomon
  rationale: Ipinapakita ang pamagat bilang tala ng mga gawa o pangyayari sa paghahari ni Solomon at iniiwasan ang posibleng pagkalito sa biblikal na aklat na Mga Cronica.
