  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: tl
  text: 'Ngunit bibigyan ko ang anak niya ng isang lipi, upang ang lingkod kong si David ay laging magkaroon ng ilawan[a] sa harapan ko sa Jerusalem, ang lungsod na pinili ko para sa aking sarili upang ilagay roon ang aking pangalan.


    [a] Maaari ring “liwanag.” Ang Hebreong “ilawan” ay isang talinghaga para sa pagpapatuloy ng angkan ni David o sa nananatiling presensiya ng kanyang paghahari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “liwanag.” Ang Hebreong “ilawan” ay isang talinghaga para sa pagpapatuloy ng angkan ni David o sa nananatiling presensiya ng kanyang paghahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: Ngunit ... ang anak niya
  rationale: Ang וְ ay may diwang pasalungat sa paghahati ng kaharian sa naunang konteksto; natural itong ipinahahayag ng “Ngunit.”
- source_word: שֵׁבֶט אֶחָד
  choice: isang lipi
  rationale: Sa konteksto ng nahating kaharian, ang שֵׁבֶט ay tumutukoy sa isang pangkat na panlipunan at pampolitika, hindi sa setro o tungkod ng hari.
- source_word: לְמַעַן הֱיוֹת
  choice: upang ... magkaroon
  rationale: Pinananatili ng “upang” ang malinaw na diwa ng layunin ng konstruksiyong Hebreo at likas ito sa modernong Tagalog.
- source_word: נִיר
  choice: ilawan
  rationale: Pinananatili ng “ilawan” ang kongkretong talinghagang dinastiko sa Hebreo; hindi ito agad pinapaliwanag bilang angkan o paghahari sa pangunahing teksto.
- source_word: לְדָוִיד עַבְדִּי
  choice: ang lingkod kong si David
  rationale: Likas at marangal na ayos sa Tagalog na nagpapanatili sa kaugnayang ipinahahayag ng “aking lingkod.”
- source_word: כָּל הַיָּמִים
  choice: laging
  rationale: Natural at maikli itong katumbas ng idyomang nangangahulugang patuloy o sa lahat ng panahon.
- source_word: לְפָנַי
  choice: sa harapan ko
  rationale: Tuwirang pinananatili ang Hebreong idyoma at ang diwa ng pananatili sa paningin o presensiya ng Diyos.
- source_word: בָּחַרְתִּי לִי
  choice: pinili ko para sa aking sarili
  rationale: Pinananatili ang kahalagahan ng datibong לִי, sa halip na paikliin lamang bilang “pinili ko.”
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: upang ilagay roon ang aking pangalan
  rationale: Pinananatili ang mahalagang pormulang teolohikal tungkol sa pangalan ng Diyos nang hindi ito ginagawang paliwanag tungkol sa presensiya o pagsamba.
theological_decisions:
- issue: Talinghagang dinastiko sa נִיר
  choice: “ilawan” bilang talinghaga ng nagpapatuloy na angkan o paghahari ni David
  alternative: “liwanag” bilang mas pangkalahatang talinghaga
  rationale: Ang konteksto ay ang pagpapanatili ng isang Davidikong linya sa Jerusalem. Ang “ilawan” ay nagpapanatili sa mismong larawan at sa teolohikal na tensiyon nito; ang maikling paliwanag ay inilagay sa talababa.
- issue: Teolohiya ng templo sa “ilagay roon ang aking pangalan”
  choice: panatilihin ang idyoma tungkol sa pangalan
  alternative: “itatag doon ang aking presensiya” o “upang sambahin ako roon”
  rationale: Ang Hebreo ay gumagamit ng mahalagang pormula tungkol sa pangalan ng Diyos. Hindi ito dapat tahimik na ipakahulugan bilang presensiya, pananahan, o pagsamba lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lingkod kong si David,” “sa harapan ko,” at “ilagay roon ang aking pangalan” upang mapanatili ang biblikal na pormalidad at mahahalagang idyomang Hebreo nang hindi nagiging lipas o sobrang teknikal. Inilagay ang [a] pagkatapos ng “ilawan,” ang salitang aktuwal na tinutukoy ng talababa.
