  source_fidelity: Tapat ang salin sa Hebreo. Ang “Ngunit,” “isang lipi,” “upang,” “ang lingkod kong si David,” “laging,” “sa harapan ko,” “pinili ko para sa aking sarili,” at “ilagay roon ang aking pangalan” ay maayos na tumutugon sa mga pangunahing bahagi ng talata. Napananatili rin ang talinghaga ng נִיר bilang “ilawan” at ang layuning ipinahahayag ng לְמַעַן.
