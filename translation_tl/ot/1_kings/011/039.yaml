  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: tl
  text: Pahihirapan ko ang mga inapo ni David dahil dito, ngunit hindi magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na: “hindi sa lahat ng araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: Pahihirapan ko
  rationale: Ang Piel ng ענה ay nagpapahayag dito ng pagdudulot ng hirap o kapighatian. Likas sa modernong Tagalog ang “pahihirapan” at hindi nito nililimitahan ang kahulugan sa panloob na pagpapakumbaba o panlipunang pang-aapi.
- source_word: זֶרַע דָּוִד
  choice: ang mga inapo ni David
  rationale: Kolektibong pangngalan ang זֶרַע. Ang “mga inapo” ang malinaw at likas na katumbas sa Tagalog, habang naipahahayag ang angkan ni David bilang isang kabuuan.
- source_word: לְמַעַן זֹאת
  choice: dahil dito
  rationale: Tumutukoy ang parirala sa dahilan ng kaparusahan na binanggit sa naunang konteksto. Maikli, malinaw, at malapit sa Hebreo ang “dahil dito.”
- source_word: אַךְ
  choice: ngunit
  rationale: Naglilimita ito sa naunang pahayag ng paghuhukom. Ang “ngunit” ay angkop sa marangal na rehistro at malinaw na naghahayag ng pagsalungat.
- source_word: לֹא כָל הַיָּמִים
  choice: hindi magpakailanman
  rationale: Literal na “hindi sa lahat ng mga araw,” ngunit idyomatikong nililimitahan nito ang tagal ng paghihirap. Natural at tumpak sa Tagalog ang “hindi magpakailanman”; inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Tagal ng paghuhukom sa angkan ni David
  choice: Tunay ang paghihirap ngunit hindi ito magpapatuloy magpakailanman.
  alternative: Literal na “hindi sa lahat ng mga araw.”
  rationale: Malinaw na nililimitahan ng Hebreo ang tagal ng kaparusahan. Pinananatili ng salin ang tensiyon sa pagitan ng tunay na paghuhukom at ng katotohanang hindi ito walang hanggan, nang hindi nagdaragdag ng paliwanag na lampas sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga inapo” para sa kolektibong זֶרַע at ang idyomatikong “hindi magpakailanman” sa pangunahing teksto; pinanatili sa talababa ang literal na larawang Hebreo.
