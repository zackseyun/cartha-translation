revisions:
- from: At mangyayari na kung pakikinggan mo ang lahat ng iuutos ko sa iyo, lalakad ka sa aking mga daan, at gagawin mo ang tama sa aking paningin sa pamamagitan ng pagtupad sa aking mga tuntunin at mga utos, gaya ng ginawa ng lingkod kong si David, sasaiyo ako at magtatayo ako para sa iyo ng isang matatag na sambahayan[a], gaya ng itinayo ko para kay David, at ibibigay ko sa iyo ang Israel.
  to: Kung pakikinggan mo ang lahat ng iuutos ko sa iyo, lalakad ka sa aking mga daan, at gagawin mo ang tama sa aking paningin sa pamamagitan ng pagtupad sa aking mga tuntunin at mga utos, gaya ng ginawa ng lingkod kong si David, ay makakasama mo ako. Magtatatag ako para sa iyo ng isang matatag na sambahayan[a], gaya ng itinatag ko para kay David, at ibibigay ko sa iyo ang Israel.
  rationale: Inayos ang pangungusap upang maging likas at malinaw sa modernong Filipino, lalo na ang kondisyunal na balangkas at ang “I will be with you.” Pinalitan ang “magtatayo” ng “magtatatag” upang maipahayag ang dinastikong talinghaga ng “house” nang hindi nagmumungkahing gusali ang tinutukoy. Walang binagong teolohikal o pangkasaysayang kahulugan.
