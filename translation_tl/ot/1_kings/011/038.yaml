reference: 1 Kings 11:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: tl
  text: Kung pakikinggan mo ang lahat ng iuutos ko sa iyo, lalakad ka sa aking mga daan, at gagawin mo ang tama sa aking paningin sa pamamagitan ng pagtupad sa aking mga tuntunin at mga utos, gaya ng ginawa ng lingkod kong si David, ay makakasama mo ako. Magtatatag ako para sa iyo ng isang matatag na sambahayan[a], gaya ng itinatag ko para kay David, at ibibigay ko sa iyo ang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang namamalaging sambahayan,” “isang matibay na sambahayan,” o “isang tapat na sambahayan”; ibig sabihin, isang matatag at nagpapatuloy na dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: pakikinggan mo
  rationale: Pinananatili nito ang pandiwang pandinig na שׁמע, habang ipinahihiwatig ng kasunod na mga sugnay ang pagsunod nang hindi agad isinasalin bilang “susundin.”
- source_word: אֲצַוֶּךָ
  choice: iuutos ko sa iyo
  rationale: Ang anyong di-ganap sa kondisyunal na pahayag ay likas na naipapahayag sa Filipino bilang utos na nakatuon sa hinaharap.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: lalakad ka sa aking mga daan
  rationale: Pinananatili ang talinghagang tipan ng paglakad sa mga daan ng Diyos at ang kaugnayan nito sa iba pang mga tekstong biblikal.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: ang tama sa aking paningin
  rationale: Likas sa modernong Filipino at pinananatili ang pananaw ng Diyos bilang pamantayan ng moral na paghatol.
- source_word: לִשְׁמֹר
  choice: sa pamamagitan ng pagtupad
  rationale: Ipinakikita ang gamit ng pawatas bilang paraan kung paano gagawin ang tama; ang “pagtupad” ay angkop sa mga tuntunin at utos.
- source_word: חֻקּוֹתַי
  choice: aking mga tuntunin
  rationale: Malinaw at dignified na salin ng mga itinakdang alituntunin sa kontekstong legal at pangtipan.
- source_word: מִצְוֺתַי
  choice: aking mga utos
  rationale: Karaniwan at malinaw na katumbas ng mga kautusang ibinigay ng Diyos.
- source_word: עַבְדִּי
  choice: lingkod kong
  rationale: Sa kontekstong maharlika at pangtipan, ito ay marangal na katawagan kay David bilang naglilingkod sa Diyos, hindi pangunahing pagtukoy sa kalagayang alipin.
- source_word: בַיִת נֶאֱמָן
  choice: isang matatag na sambahayan
  rationale: Ang “sambahayan” ay nagpapanatili sa talinghaga ng bahay ngunit mas malinaw na maaaring tumukoy sa angkan; ang “matatag” ay nagpapahayag ng katatagan, katiyakan, at pananatili ng נֶאֱמָן.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: ibibigay ko sa iyo ang Israel
  rationale: Tuwirang pinananatili ang Israel bilang bagay na ipinagkakaloob ng Diyos kay Jeroboam.
theological_decisions:
- issue: Kahulugan ng “sambahayan” sa pangako
  choice: Maharlikang angkan o dinastiya ang pangunahing tinutukoy, habang pinananatili sa teksto ang talinghaga ng sambahayan.
  alternative: Literal na bahay o palasyo.
  rationale: Ang konteksto ng paghahari at ang paghahambing sa itinayo ng Diyos para kay David ay tumutukoy sa isang nagpapatuloy na maharlikang linya, hindi lamang sa isang gusali.
- issue: Lakas ng kondisyunal na pangako
  choice: Tunay na kondisyunal ang pangako at nakaugnay sa pakikinig at pagsunod ni Jeroboam.
  alternative: Isang walang-kondisyong pagkakaloob.
  rationale: Malinaw na ipinakikilala ng אִם (“kung”) at ng magkakasunod na sugnay tungkol sa pagsunod ang kondisyon; hindi ito pinalalambot o hinaharmonisa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang mga biblikal na talinghagang “lalakad sa aking mga daan” at “sambahayan,” ngunit nilinaw sa talababa ang dinastikong diwa ng huli.
