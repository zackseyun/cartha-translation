revisions:
- from: At nagbangon ang Diyos ng isang kalaban[a] laban sa kanya—si Rezon na anak ni Eliada, na tumakas mula sa kanyang panginoong si Hadadezer, na hari ng Zoba.
  to: At ibinangon ng Diyos laban sa kanya ang isang kalaban[a], si Rezon na anak ni Eliada, na tumakas mula kay Hadadezer, hari ng Zoba, na kanyang panginoon.
  rationale: Pinalitan ang hindi natural na aktibong ayos ng isang idiomatikong Tagalog na causative/passive construction, habang pinanatili ang tahasang pagkilos ng Diyos at ang pagiging kalaban ni Rezon kay Solomon. Inayos ang pagkakasunod ng mga parirala para luminaw na si Hadadezer ang panginoon ni Rezon. Walang binagong kahulugan o idinagdag na interpretasyong teolohikal.
