  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: tl
  text: At ibinangon ng Diyos laban sa kanya ang isang kalaban[a], si Rezon na anak ni Eliada, na tumakas mula kay Hadadezer, hari ng Zoba, na kanyang panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: satan; karaniwang pangngalan dito na nangangahulugang “kalaban” o “katunggali,” hindi ang pangalang pantanging Satanas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: nagbangon
  rationale: Ang hiphil ng קום ay nagpapahayag na pinapangyari o inililitaw ng Diyos ang isang tao bilang kalaban; natural sa Tagalog ang “nagbangon” at pinananatili nito ang aktibong papel ng Diyos.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Sa kontekstong ito, ang tinutukoy ay ang Diyos ng Israel.
- source_word: לוֹ
  choice: laban sa kanya
  rationale: Bagaman literal na maaaring “para sa kanya,” malinaw sa konstruksyon at sa שָׂטָן na ang ugnayan ay pagsalungat kay Solomon. Mas natural at malinaw sa Tagalog ang “laban sa kanya.”
- source_word: שָׂטָן
  choice: isang kalaban
  rationale: Karaniwang pangngalan ito rito na tumutukoy sa isang taong pampolitikang kalaban, hindi sa pangalang pantanging Satanas.
- source_word: רְזוֹן בֶּן אֶלְיָדָע
  choice: si Rezon na anak ni Eliada
  rationale: Likas na Tagalog na pagpapahayag ng pangalang pantangi at ugnayang ama-anak.
- source_word: אֲשֶׁר בָּרַח
  choice: na tumakas
  rationale: Ipinapahayag ang naunang pagtakas ni Rezon; sapat ang karaniwang aspektong perpektibo sa Tagalog nang hindi nangangailangan ng tahasang past perfect.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: mula ... kay Hadadezer
  rationale: Ang מֵאֵת ay nagsasaad ng paglayo o paghihiwalay mula sa isang tao.
- source_word: מֶלֶךְ צוֹבָה
  choice: hari ng Zoba
  rationale: Tuwirang salin ng construct chain; isina-Tagalog ang baybay ng Zobah bilang Zoba.
- source_word: אֲדֹנָיו
  choice: kanyang panginoon
  rationale: Tumutukoy ito sa taong pinaglilingkuran o nakatataas kay Rezon. Pinananatili ng “panginoon” ang saklaw ng terminong Hebreo, at nililinaw ng pangalan na hindi ito titulong banal.
theological_decisions:
- issue: Kahulugan ng שָׂטָן sa konteksto
  choice: karaniwang pangngalang “kalaban”
  alternative: pangalang pantanging “Satanas”
  rationale: Isang taong kalaban ang inilalarawan ng talata, si Rezon na anak ni Eliada. Ang “Satanas” ay magpapasok ng kahulugang demonolohikal na hindi sinasabi ng konteksto.
- issue: Papel ng Diyos sa paglitaw ng kalaban
  choice: “nagbangon ang Diyos”
  alternative: “hinirang ng Diyos” o “nagkaroon siya ng kalaban”
  rationale: Pinananatili nito ang tahasang pagiging sanhi o pagkilos ng Diyos sa hiphil na וַיָּקֶם, nang hindi ipinapaliwanag kung paano Niya ito isinagawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang em dash upang malinaw na ipakilala si Rezon bilang ang kalabang binanggit; iniwasan ang makalumang ayos at ang hindi kailangang terminolohiyang teolohikal.
