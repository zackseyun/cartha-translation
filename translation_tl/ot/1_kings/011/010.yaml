base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: tl
  text: at inutusan niya siya tungkol sa bagay na ito—na huwag sumunod sa ibang mga diyos[a]—ngunit hindi niya tinupad ang iniutos ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sumunod sa ibang mga diyos” ay karaniwang idyoma ng tipan para sa pagtalikod kay Yahweh at pagsamba sa ibang mga diyos.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: at inutusan niya
  rationale: Ang waw at perfect ay nagpapatuloy sa paglalahad ng naunang ginawa ni Yahweh; sapat at natural sa Tagalog ang payak na aspektong perpektibo.
- source_word: אֵלָיו
  choice: siya
  rationale: Sa konstruksyong “inutusan niya siya,” natural na ipinahahayag sa Tagalog ang taong tumanggap ng utos.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: tungkol sa bagay na ito
  rationale: Ang דָּבָר dito ay tumutukoy sa usaping binanggit sa konteksto, kaya mas angkop ang “bagay” kaysa limitahan ito sa isang binigkas na salita.
- source_word: לְבִלְתִּי לֶכֶת
  choice: na huwag sumunod
  rationale: Ipinahahayag ng konstruksyon ang ipinagbabawal na kilos. Sa idyomang kasunod, mas malinaw at natural ang “huwag sumunod” kaysa literal na “huwag pumunta.”
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: sa ibang mga diyos
  rationale: Kasama ng “sumunod,” pinananatili nito ang tipanang idyoma ng pagtalikod upang kilalanin o sambahin ang ibang mga diyos.
- source_word: וְלֹא שָׁמַר
  choice: ngunit hindi niya tinupad
  rationale: May malinaw na pagsalungat sa naunang utos. Sa konteksto ng utos, likas sa modernong Tagalog ang “tinupad” para sa שׁמר, na may diwang pagsunod o pag-iingat.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: ang iniutos ni Yahweh
  rationale: Maikli at natural itong katumbas ng nilalaman ng iniutos ni Yahweh, nang hindi nagdaragdag ng paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pagpunta kasunod ng ibang mga diyos
  choice: sumunod sa ibang mga diyos
  alternative: pumunta sa likuran ng ibang mga diyos
  rationale: Pinananatili ng “sumunod” ang tipanang diwa ng Hebreong idyoma habang malinaw sa karaniwang mambabasang Tagalog; ipinaliliwanag ng talababa ang implikasyon nitong pagtalikod at pagsamba.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga gitling upang ihayag nang malinaw na ang ipinagbabawal na pagsunod sa ibang mga diyos ang nilalaman ng “bagay na ito,” habang pinananatili ang daloy ng talata.
