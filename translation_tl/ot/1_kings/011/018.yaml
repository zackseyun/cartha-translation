  to: Umalis sila sa Midian at nagtungo sa Paran. Mula sa Paran ay nagsama sila ng mga lalaki, at nagtungo sila sa Ehipto, kay Faraon na hari ng Ehipto. Binigyan niya si Hadad ng isang bahay, nag-utos na bigyan siya ng pagkain,[a] at binigyan siya ng lupain.
