base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: tl
  text: Umalis sila sa Midian at nagtungo sa Paran. Mula sa Paran ay nagsama sila ng mga lalaki, at nagtungo sila sa Ehipto, kay Faraon na hari ng Ehipto. Binigyan niya si Hadad ng isang bahay, nag-utos na bigyan siya ng pagkain,[a] at binigyan siya ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay literal na, “at tinapay ay sinabi niya sa kanya.” Ang diwa ay nag-utos o nagtalaga si Faraon ng panustos para sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: Umalis sila sa Midian
  rationale: Sa salaysay ng paglalakbay, ang קום ay idyomatikong tumutukoy sa pagbangon upang humayo o pag-alis. Mas natural sa makabagong Tagalog ang “umalis” kaysa literal na “tumayo.”
- source_word: פָּארָן
  choice: Paran
  rationale: Isinalin sa karaniwang transliterasyon ang pangalang heograpiko.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Nagsama sila ng mga lalaki mula sa Paran
  rationale: Ang אֲנָשִׁים ay tahasang “mga lalaki,” at ipinahihiwatig ng parirala na nagdagdag sila ng mga kasamang mula sa Paran.
- source_word: מִצְרַיִם
  choice: Ehipto
  rationale: Ginamit ang nakaugaliang pangalang Tagalog para sa Egypt.
- source_word: אֶל־פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: kay Faraon na hari ng Ehipto
  rationale: Likas na Tagalog na paglalahad ito ng appositional na pariralang Hebreo.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Binigyan sila ni Faraon ng isang bahay
  rationale: Nilinaw ang paksa bilang si Faraon mula sa naunang sugnay. Ang לוֹ ay pang-isahang panlalaki at tumutukoy kay Hadad sa konteksto; sa Tagalog, ang “sila” ay magalang o di-tiyak sa bilang, kaya pinili rito bilang reperensiyang personal, bagaman maaari ring gamitin ang “siya.”
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: ipinag-utos na paglaanan sila ng pagkain
  rationale: Ang tekstong Hebreo ay literal na hindi karaniwan, “at tinapay ay sinabi niya sa kanya.” Ipinakikita ng konteksto na nag-utos o nagtalaga si Faraon ng panustos; ang “pagkain” ay naghahatid sa malawak na kahulugan ng לֶחֶם bilang ikabubuhay.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: at binigyan sila ng lupain
  rationale: Ang אֶרֶץ dito ay pinakamalamang na lupa o ari-ariang ipinagkaloob, hindi isang buong bansa.
