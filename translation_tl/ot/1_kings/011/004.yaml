base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: tl
  text: Nang tumanda na si Solomon, ibinaling ng kanyang mga asawa ang kanyang puso sa ibang mga diyos, at ang kanyang puso ay hindi lubos na tapat[a] kay Yahweh na kanyang Diyos, gaya ng puso ni David na kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang kanyang puso ay hindi buo kay Yahweh na kanyang Diyos.” Ang “buo” ay larawan ng ganap at di-nahahating katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: nang tumanda si Solomon
  rationale: Likas na modernong Tagalog para sa pariralang tumutukoy sa panahon ng katandaan ni Solomon.
- source_word: נָשָׁיו
  choice: kanyang mga asawa
  rationale: Tuwirang pinananatili ang maramihang anyo at ang kaugnayan kay Solomon.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: ibinaling ... ang puso niya
  rationale: Pinananatili ang sanhiang diwa ng Hiphil at ang larawan ng pusong inililihis o ibinabaling, nang hindi dinaragdagan ng mas matinding ideyang ‘iniligaw.’
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: sa ibang mga diyos
  rationale: Sa Tagalog, ang ‘ibinaling ... sa’ ay natural na nagpapahayag ng pagtalima o pagtuon sa ibang mga diyos, habang pinananatili ang karaniwang katawagan sa Hebreo.
- source_word: לְבָבוֹ
  choice: ang puso niya
  rationale: Pinananatili ang biblikal na larawan ng puso bilang sentro ng kalooban, pag-iisip, at katapatan.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: hindi lubos na nakatalaga kay Yahweh na kanyang Diyos
  rationale: Natural na ipinahahayag sa Tagalog ang diwa ng buo at hindi nahahating katapatan, habang inilalagay sa talababa ang mas literal na larawan ng ‘buong puso.’
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: tulad ng puso ng kanyang amang si David
  rationale: Pinananatili ang tahasang paghahambing ng puso ni Solomon sa puso ni David, sa halip na gawing pangkalahatang paghahambing lamang ng dalawang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng שָׁלֵם tungkol sa puso ni Solomon
  choice: hindi lubos na nakatalaga
  alternative: hindi buo ang kanyang puso
  rationale: Ang pangunahing teksto ay gumagamit ng malinaw at natural na Tagalog para sa ganap at di-nahahating katapatan. Pinananatili ng talababa ang literal na metapora at hindi ipinapalagay na nangangahulugan ito ng kawalang-kasalanan.
- issue: Pagtukoy sa אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  alternative: mga diyos ng ibang mga bansa
  rationale: Ang Hebreo ay karaniwang nangangahulugang ‘ibang mga diyos’; ang pagdaragdag ng etniko o pambansang ideya ay hindi kailangan at maaaring magpalabo sa tuwirang usapin ng idolatriya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang biblikal na larawan ng ‘puso’ at ang pangalang Yahweh; iniwasan ang sobrang literal ngunit di-likas na ayos ng pangungusap.
