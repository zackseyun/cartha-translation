base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: tl
  text: Lubhang kinalugdan ng Paraon si Hadad, at ibinigay ng Paraon kay Hadad bilang asawa ang kapatid ng sariling asawa ng Paraon[a]—ang kapatid ni Tahpenes, na siyang pangunahing babaeng maharlika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kapatid ng kaniyang asawa.” Bagaman hindi gaanong malamang, maaari itong unawain na tumutukoy sa asawa ni Hadad sa halip na sa asawa ng Paraon.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “ang dakilang ginang.” Isa itong titulo para sa isang mataas na babaeng maharlika, marahil ang inang reyna o ang pangunahing babae sa sambahayan ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: Lubhang kinalugdan ... si
  rationale: Natural na salin sa modernong Tagalog ng idyomang Hebreo na literal na ‘nakasumpong ng malaking lingap sa mga mata ni.’ Pinananatili ng ‘lubhang’ ang diin ng מְאֹד.
- source_word: פַרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Tagalog ng titulong maharlika ng Ehipto.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: ibinigay niya kay Hadad bilang asawa
  rationale: Malinaw na ipinahihiwatig ng konstruksiyon ang pagbibigay sa babae upang mapangasawa ni Hadad; inuulit ang pangalang Hadad upang luminaw ang mga panghalip.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: ang kapatid ng sarili niyang asawa
  rationale: Tinutukoy ng hulaping ‘kaniyang’ ang asawa ng Paraon ayon sa pinakamalamang na daloy ng konteksto. Ang ‘sarili niyang’ ay nagpapalinaw nang hindi lubusang ikinukubli ang alternatibong referent, na inilalagay sa talababa.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: ang kapatid ni Tahpenes
  rationale: Pinananatili ang aposisyon sa Hebreo, na kinikilala ang babaeng ibinigay kay Hadad sa pamamagitan ng kaugnayan niya kay Tahpenes.
- source_word: תַּחְפְּנֵיס
  choice: Tahpenes
  rationale: Tuwirang transliterasyon ng pangalang pantangi sa Hebreo.
- source_word: הַגְּבִירָה
  choice: ang pangunahing babaeng maharlika
  rationale: Sinasalamin nito ang literal at malawak na diwa ng titulong ‘dakila/pangunahing babae’ nang hindi tiyak na ipinapalagay ang posisyong ‘inang reyna,’ na hindi tiyak sa kontekstong Ehipsiyo.
theological_decisions:
- issue: Tinutukoy ng panghalip sa אֲחוֹת אִשְׁתּוֹ (‘kapatid ng kaniyang asawa’)
  choice: 'Ang panghalip ay tumutukoy sa Paraon: ibinigay niya kay Hadad ang kapatid ng sarili niyang asawa.'
  alternative: 'Maaaring tumukoy ang panghalip kay Hadad: ibinigay ng Paraon kay Hadad ang kapatid ng asawa ni Hadad.'
  rationale: Mas pinapaboran ng pinakamalapit na simuno at ng kasunod na aposisyong ‘kapatid ni Tahpenes’ ang Paraon bilang tinutukoy, ngunit tunay na posible sa balarila ang ibang pagbasa kaya itinatala ito sa talababa.
- issue: Kahulugan ng הַגְּבִירָה
  choice: pangunahing babaeng maharlika
  alternative: inang reyna; reyna; dakilang ginang
  rationale: Ang salita ay titulo ng isang mataas na babaeng maharlika. Karaniwan itong tumutukoy sa inang reyna sa mga kontekstong Israelita, ngunit hindi tiyak ang katumbas nitong tungkulin sa korte ng Ehipto; kaya pinananatili ng salin ang mas malawak na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na likas at marangal ang daloy. Ginamit ang ‘kinalugdan’ para sa idyomang tungkol sa pagkamit ng lingap, at iniwasan ang sobrang teknikal o makalumang pananalita. Nilinaw ang mga panghalip sa pamamagitan ng pag-uulit sa pangalang Hadad. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
