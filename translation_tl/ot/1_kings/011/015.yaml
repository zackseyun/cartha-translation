base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: tl
  text: Nangyari nga[a] na, noong nasa Edom si David[b], nang umakyat si Joab, ang pinuno ng hukbo, upang ilibing ang mga napatay, pinatay niya ang bawat lalaki sa Edom—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “At nangyari.” Karaniwang pormula ito sa Hebreo na ginagamit upang maglahad ng paliwanag o pangyayaring nasa likuran ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, ang Hebreo ay “noong si David ay [kasama ng] Edom.” Sa konteksto, tumutukoy ito sa presensiya o kampanya ni David sa Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nangyari nga
  rationale: Karaniwang pormula ito sa salaysay na nagbubukas ng paliwanag o pangyayaring nasa likuran ng kasalukuyang konteksto. Likas sa modernong Tagalog ang “Nangyari nga,” habang ipinapakita sa talababa ang mas literal na anyo.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: noong nasa Edom si David
  rationale: Ang ב na may infinitive construct ng היה ay bumubuo ng temporal na sugnay. Hindi karaniwang pagsama lamang ang ipinahihiwatig ng אֶת אֱדוֹם dito; sa kontekstong militar, tumutukoy ito sa presensiya o kampanya ni David sa Edom. Pinananatili sa talababa ang pagiging di-pangkaraniwan ng Hebreong parirala.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: umakyat si Joab
  rationale: Ang temporal na infinitive construct ay tumutukoy sa pag-akyat ni Joab. Sapat na malinaw sa daloy ng Tagalog ang payak na aspektong naganap.
- source_word: שַׂר הַצָּבָא
  choice: ang pinuno ng hukbo
  rationale: Malinaw at makabagong katumbas ito ng opisyal na titulong militar, nang walang makalumang pananalita.
- source_word: לְקַבֵּר
  choice: upang ilibing
  rationale: Ipinahahayag ng infinitive na may ל ang layunin ng pag-akyat ni Joab.
- source_word: הַחֲלָלִים
  choice: ang mga napatay
  rationale: Tumutukoy ang salita sa mga namatay dahil pinaslang, lalo na sa labanan; mas tiyak ito kaysa sa pangkalahatang “mga patay.”
- source_word: וַיַּךְ
  choice: pinatay niya
  rationale: Sa kontekstong militar at sa layong “bawat lalaki,” nakamamatay ang diwa ng נכה. Ang “pinatay” ay tuwiran at likas sa Tagalog, hindi pinahihina ang karahasan ng ulat.
- source_word: כָּל זָכָר
  choice: bawat lalaki
  rationale: Tiyak na tumutukoy ang זָכָר sa kasariang lalaki. Ang “bawat lalaki” ay natural sa Tagalog at pinananatili ang ganap na saklaw ng pahayag.
- source_word: בֶּאֱדוֹם
  choice: sa Edom
  rationale: Pinananatili ang payak na lokatibong kahulugan ng ב nang hindi dinaragdagan ang saklaw bilang “sa buong Edom.”
theological_decisions:
- issue: Tuwirang paglalahad ng matinding karahasang militar
  choice: Panatilihin ang pahayag na pinatay ang bawat lalaki sa Edom
  alternative: Palambutin bilang “tinalo ang mga Edomita” o palawakin bilang tahasang paliwanag ng lubusang paglipol
  rationale: Iniuulat ng talata ang matinding karahasan. Kailangang panatilihin ang bigat at saklaw ng Hebreo nang walang pagpapalambot, ngunit hindi rin dapat dagdagan ang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hukbo” bilang pamilyar na katawagang militar at ang tuwirang “pinatay” upang hindi pagaanin ang karahasan. Inilagay ang mga panandang talababa sa mismong pariralang ipinaliliwanag ng bawat tala.
