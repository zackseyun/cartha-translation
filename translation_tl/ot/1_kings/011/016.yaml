  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: tl
  text: Sapagkat anim na buwan na nanatili roon si Joab at ang buong Israel[a], hanggang sa pinuksa niya ang bawat lalaki sa Edom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buong Israel” ay malamang na tumutukoy sa hukbong Israelita na kasama ni Joab, hindi sa bawat mamamayan ng bansa.
    reason: cultural_note
  - marker: b
    text: O “lipulin” o “alisin.” Ang pandiwang Hebreo ay literal na “putulin,” isang idyoma para sa lubusang pag-aalis sa isang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng naunang pahayag; pinananatili ng “Sapagkat” ang ugnayang iyon.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: nang anim na buwan
  rationale: Likas na paraan sa modernong Tagalog upang ipahayag ang tagal.
- source_word: יָשַׁב שָׁם
  choice: nanatili roon
  rationale: Sa kontekstong militar, ang יָשַׁב ay tumutukoy sa patuloy na pananatili, hindi sa permanenteng paninirahan.
- source_word: יוֹאָב
  choice: Joab
  rationale: Karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ang buong Israel
  rationale: Pinananatili ang kolektibong katawagan ng Hebreo; sa konteksto, malamang na tumutukoy ito sa hukbong Israelita na kasama ni Joab.
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw na minamarkahan ang hangganan o kinalabasan ng panahon ng pananatili.
- source_word: הִכְרִית
  choice: malipol niya
  rationale: Ang hiphil ng כרת ay nangangahulugang alisin, puksain, o lipulin. Ang “malipol” ay natural sa Tagalog at naipapahayag ang ganap na pag-aalis nang hindi gumagamit ng di-likas na literal na “putulin.”
- source_word: כָּל זָכָר
  choice: ang bawat lalaki
  rationale: Tumpak na sinasalamin ang distributibong כָּל at ang kasariang tinutukoy ng זָכָר, nang hindi nililimitahan sa mandirigma o nasa hustong gulang.
- source_word: בֶּאֱדוֹם
  choice: sa Edom
  rationale: 'Locative ang gamit ng pang-ukol בְּ: naganap ang pagkilos sa loob ng Edom.'
