id: 1KI.11.9
reference: 1 Kings 11:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: tl
  text: Nagalit si Yahweh kay Solomon dahil lumayo ang puso niya kay Yahweh, ang Diyos ng Israel, na dalawang beses nang nagpakita sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: Nagalit
  rationale: Likas at tuwirang ipinapahayag sa Tagalog ang paglitaw o pagpapahayag ng galit, nang hindi pinatitindi bilang matinding poot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasaad sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בִּשְׁלֹמֹה
  choice: kay Solomon
  rationale: Ang pang-ukol na kasama ng pandiwa ng pagkagalit ay likas na isinasalin sa Tagalog bilang “kay.”
- source_word: כִּי
  choice: dahil
  rationale: Malinaw nitong ipinakikilala ang dahilan ng galit ni Yahweh.
- source_word: נָטָה לְבָבוֹ
  choice: lumayo ang puso niya
  rationale: Pinananatili ang larawan ng puso at likas na ipinahahayag ang pagtalikod ng katapatan o pakikipag-ugnayan.
- source_word: מֵעִם
  choice: kay
  rationale: Kasunod ng “lumayo,” ang “kay” ang natural na panandang Tagalog para sa pinagmulan ng relational na paglayo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at karaniwang salin ng pariralang konstruktong Hebreo.
- source_word: הַנִּרְאָה אֵלָיו
  choice: na ... nang nagpakita sa kanya
  rationale: Ginagawang likas na sugnay na panuring sa Tagalog ang Hebreong participle at ipinahihiwatig ng “nang” na nauna na ang mga pagpapakitang ito.
- source_word: פַּעֲמָיִם
  choice: dalawang beses
  rationale: Karaniwan at malinaw na katumbas sa modernong Tagalog ng anyong dual na nangangahulugang “twice.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang teksto ay gumagamit mismo ng Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Paglalarawan sa galit ng Diyos
  choice: Nagalit
  alternative: Lubhang nagalit
  rationale: Tapat nitong pinananatili ang tahasang pahayag ng teksto tungkol sa galit ng Diyos, nang hindi ito pinahihina o pinatitindi nang lampas sa Hebreo.
- issue: Larawan ng pusong lumalayo
  choice: lumayo ang puso niya
  alternative: tumalikod siya
  rationale: Pinananatili ang mahalagang salitang “puso” at ang relational na larawan ng paglayo, sa halip na gawing mas tahasang interpretasyon ang pagtalikod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at iniwasan ang labis na pormal o makalumang mga salita. Ang “sa kanya” ay likas na tumutukoy kay Solomon ayon sa daloy ng talata.
