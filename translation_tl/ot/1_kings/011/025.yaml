  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: tl
  text: Naging kalaban siya ng Israel sa buong panahon ni Solomon, bukod pa sa pinsalang dulot ni Hadad.[a] Kinasuklaman niya ang Israel at naghari siya sa Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kasama ng kapahamakang ginawa ni Hadad.” Eliptikal at mahirap tiyakin ang pariralang Hebreo; maaaring ibig nitong sabihin na ang kalabang ito ay bumangon bilang dagdag sa pinsalang idinulot ni Hadad.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: kalaban
  rationale: Sa kontekstong ito, tumutukoy ito sa isang taong pampolitikang kaaway ng Israel, hindi kay Satanas bilang pangalang pantangi.
- source_word: לְיִשְׂרָאֵל
  choice: ng Israel
  rationale: Sa pariralang “kalaban ng Israel,” likas na ipinahihiwatig sa Filipino na ang Israel ang panig na kinakalaban.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: sa buong panahon ni Solomon
  rationale: Natural itong ekspresyon sa modernong Filipino para sa tuloy-tuloy na panahong saklaw ng mga araw o paghahari ni Solomon.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: bukod pa sa pinsalang dulot ni Hadad
  rationale: Pahapyaw at eliptikal ang Hebreo. Ipinapakita ng “bukod pa” ang malamang na dagdag na suliraning hatid ng kalabang ito, samantalang ang “pinsala” ay tumutukoy sa kapahamakang idinulot at hindi lamang sa moral na kasamaan.
- source_word: רָעָה
  choice: pinsala
  rationale: Sa konteksto, tumutukoy ito sa kapahamakang idinulot sa Israel; malinaw at natural ang “pinsala” nang hindi ito ginagawang abstraktong moral na kasamaan.
- source_word: וַיָּקָץ
  choice: Kinasuklaman niya
  rationale: Pinananatili nito ang matinding pagkamuhi o pag-ayaw na ipinahihiwatig ng pandiwang Hebreo.
- source_word: בְּיִשְׂרָאֵל
  choice: ang Israel
  rationale: Ang preposisyon ay nagmamarka sa Israel bilang layon ng pagkasuklam; mas natural sa Filipino ang tuwirang layon.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: naghari siya sa Aram
  rationale: Pinananatili ang pangalang “Aram” at malinaw na ipinapahayag ang pamumuno niya bilang hari roon.
theological_decisions:
- issue: Kung ang שָׂטָן ay dapat isaling pangalang pantangi na “Satanas”
  choice: kalaban na tao
  alternative: Satanas
  rationale: Mga pampolitikang kalaban ni Solomon ang paksa ng salaysay. Karaniwang pangngalan ang gamit dito, kaya ang “Satanas” ay magpapasok ng kahulugang demonolohikal na wala sa talata.
- issue: Kung ang רָעָה ay moral na kasamaan o kapahamakang idinulot
  choice: pinsala
  alternative: kasamaan
  rationale: Ang konteksto ay tungkol sa kaguluhan at kapahamakang idinulot ng mga kaaway sa Israel, hindi sa isang abstraktong paghatol sa moralidad ni Hadad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalaban” sa halip na “Satanas,” “pinsala” para sa kontekstuwal na diwa ng רָעָה, at “Kinasuklaman” upang mapanatili ang tindi ng pandiwang Hebreo. Inilagay ang talababa sa dulo ng buong eliptikal na sugnay upang malinaw ang saklaw nito.
