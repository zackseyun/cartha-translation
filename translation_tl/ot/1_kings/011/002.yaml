base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: tl
  text: mula sa mga bansang binanggit ni Yahweh nang sabihin niya sa mga anak ni Israel[a], “Huwag kayong pumasok sa gitna nila, at huwag silang pumasok sa gitna ninyo. Tiyak na ibabaling nila ang inyong puso sa kanilang mga diyos.” Sa mga ito ay mahigpit na kumapit si Solomon sa pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasan ayon sa konteksto: “Huwag kayong mag-asawa sa kanila, at huwag din silang mag-asawa sa inyo.” Mas literal sa Hebreo: “Huwag kayong pumasok sa gitna nila, at huwag silang pumasok sa gitna ninyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: mula sa mga bansa
  rationale: Karaniwang tumutukoy ang גּוֹיִם sa mga bansa o mga bayan; ang “mga bansa” ay angkop dito para sa mga dayuhang pangkat na pinagmulan ng mga asawa ni Solomon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at likas ding katawagan sa makabagong Tagalog para sa bayang nagmula kay Israel.
- source_word: לֹא תָבֹאוּ בָהֶם וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: Huwag kayong pumasok sa gitna nila, at huwag silang pumasok sa gitna ninyo
  rationale: Pinananatili ang pangkalahatan at magkatimbang na pananalita ng Hebreo. Ipinapaliwanag sa talababa ang mas tiyak na diwang tumutukoy sa pag-aasawa ayon sa konteksto.
- source_word: אָכֵן
  choice: Tiyak na
  rationale: Ipinahahayag nito ang mariing katiyakan ng babala.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: ibabaling nila ang inyong puso
  rationale: Pinananatili ang talinghaga ng pagbaling sa puso at ang kolektibong isahang “puso” sa Hebreo.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: sa kanilang mga diyos
  rationale: Sa Tagalog, likas na ipinahihiwatig ng “ibabaling ... sa” ang pagtalima o pagsunod sa ibang mga diyos nang hindi dinaragdagan ang teksto.
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה
  choice: Sa mga ito ay mahigpit na kumapit si Solomon
  rationale: Ang “mahigpit na kumapit” ay nagpapahayag ng matinding pagkakaugnay na taglay ng דָּבַק, habang hindi tahasang pinapalitan ng “mga babae” ang di-tiyak na panghalip sa Hebreo.
- source_word: לְאַהֲבָה
  choice: dahil sa pag-ibig
  rationale: Natural nitong ipinahahayag sa Tagalog na pag-ibig ang dahilan o lakas ng pagkakapit ni Solomon, nang hindi ito binabago tungo sa pagnanasa lamang.
theological_decisions:
- issue: Kung tahasang gagawing pagbabawal sa pag-aasawa ang pananalita sa pangunahing teksto
  choice: Panatilihin ang mas pangkalahatang “pumasok sa gitna nila / pumasok sa gitna ninyo.”
  alternative: “Huwag kayong mag-asawa sa kanila, at huwag din silang mag-asawa sa inyo.”
  rationale: Malinaw sa konteksto na pag-aasawa ang tinutukoy, ngunit mas pangkalahatan ang mismong pananalita ng Hebreo. Pinananatili ng pangunahing teksto ang tunay na saklaw nito, at inilalahad sa talababa ang kontekstuwal na kahulugan.
- issue: Kung tutukuyin bilang “mga babaing ito” ang panghalip sa huling sugnay
  choice: “sa mga ito”
  alternative: “sa mga babaing ito”
  rationale: Ang panghalip na Hebreo ay gramatikal na panlalaking maramihan at maaaring bumalik sa mga bansang nabanggit, bagaman sa konteksto ay ang mga babaing mula sa mga bansang iyon ang tinutukoy. Hindi tahasang nilulutas ng salin ang pag-igting na ito.
translation_notes:
  register: Makabago at marangal na Filipino, na may bahagyang pormal na ayos upang mapanatili ang dugtungang kayarian ng talata at ang simetriya ng pahayag sa Hebreo. Iniwasan ang labis na pagpapaliwanag sa pangunahing teksto; ang kontekstuwal na diwa ng pag-aasawa ay inilagay sa talababa.
