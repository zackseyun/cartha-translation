  terminology: Ang “Yahweh,” “mga anak ni Israel,” “mga diyos,” at “mahigpit na kumapit” ay angkop at marangal. Pinananatili ang “sa mga ito” upang huwag lutasin nang lampas sa teksto ang tinutukoy ng panghalip. Ang talababa ay nananatiling kapaki-pakinabang at wastong nakaangkla sa a.
