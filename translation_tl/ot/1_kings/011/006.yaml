id: 1KI.11.6
reference: 1 Kings 11:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: tl
  text: Kaya ginawa ni Solomon ang masama sa paningin ni Yahweh, at hindi niya lubos na sinunod si Yahweh gaya ng ginawa ng ama niyang si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi siya lubos na sumunod kay Yahweh” o “hindi siya buong-pusong tapat kay Yahweh.” Ipinahihiwatig ng idyomang Hebreo ang hindi ganap na katapatan o pagsunod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... הָרַע
  choice: ginawa ... ang masama
  rationale: Likas sa makabagong Tagalog ang pariralang “ginawa ang masama” at tapat ito sa Hebreong konstruksiyong tumutukoy sa masamang asal ni Solomon.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang Hebreong metapora ng pagsusuri ayon sa pagtingin ni Yahweh, habang malinaw at natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang titulong “Panginoon.”
- source_word: מִלֵּא אַחֲרֵי
  choice: lubos na sinunod
  rationale: Ipinahahayag nito ang ganap na pagsunod at katapatan na hinihingi ng idyoma, nang hindi nililimitahan ang kahulugan sa panloob na debosyon lamang.
- source_word: כְּדָוִד אָבִיו
  choice: gaya ng ginawa ng kanyang amang si David
  rationale: Ginagawang tahasan sa natural na Tagalog ang ipinahihiwatig na kilos sa paghahambing kay David.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Antas ng pagkukulang ni Solomon sa מִלֵּא אַחֲרֵי יְהוָה
  choice: hindi niya lubos na sinunod si Yahweh
  alternative: hindi siya buong-pusong tapat kay Yahweh; hindi siya lubos na sumunod kay Yahweh
  rationale: Pinananatili ng salin ang diwa ng hindi ganap na pagsunod o katapatan, nang hindi ipinapahayag mula sa sugnay na ito lamang ang lubusang pagtalikod.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang Hebreong metapora na “sa paningin” at iniwasan ang labis na pagpapakahulugan sa antas ng pagkukulang ni Solomon.
