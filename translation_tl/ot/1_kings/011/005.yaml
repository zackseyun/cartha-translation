  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: tl
  text: Sumunod si Solomon kay Astoret[a], ang diyosa ng mga Sidonio, at kay Milcom[b], ang kasuklam-suklam na diyos ng mga Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Astarte,” isang mas kilalang anyo ng pangalan ng diyosang ito.
    reason: lexical_alternative
  - marker: b
    text: Iniuugnay ng ilan si Milcom kay Molec, ngunit “Milcom” ang mababasa sa tekstong Hebreo rito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: Sumunod ... kay
  rationale: Ang idyomang Hebreo na הלך אחרי ay nagpapahiwatig ng pagsunod sa katapatan o pagsamba, hindi lamang literal na paglakad. Likas sa Tagalog ang “sumunod kay” at hindi nito tahasang pinapalitan ang idyoma ng “sumamba.”
- source_word: עַשְׁתֹּרֶת
  choice: Astoret
  rationale: Tinatagalog ang anyong Hebreo ng pangalang Ashtoreth bilang “Astoret”; inilalahad sa talababa ang mas kilalang anyong Astarte.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: ang diyosa ng mga Sidonio
  rationale: Bagaman anyong konstruktong maramihan ang אֱלֹהֵי, tumutukoy ito rito sa pinangalanang nag-iisang babaeng diyos na si Astoret. Nililinaw ng “diyosa” ang reperente nang hindi binabago ang diwa.
- source_word: מִלְכֹּם
  choice: Milcom
  rationale: Milcom ang pangalan sa tekstong Hebreo ng talatang ito; hindi ito pinapalitan ng Molec.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: ang kasuklam-suklam na diyus-diyosan ng mga Ammonita
  rationale: Ang שִׁקֻּץ ay isang mariing mapanuring katawagan sa bagay na karima-rimarim sa ritwal o moralidad, at sa kontekstong ito ay tumutukoy sa isang diyus-diyosan. Mas malinaw at natural sa modernong Tagalog ang pariralang ito kaysa sa substantibong “ang kasuklam-suklam.”
theological_decisions:
- issue: Kung tahasang sasabihing sumamba si Solomon sa halip na panatilihin ang idyomang Hebreo
  choice: Sumunod si Solomon kay
  alternative: Sumamba si Solomon kay
  rationale: Malinaw sa konteksto na idolatriya ang tinutukoy, ngunit “nagpunta/sumunod sa likuran” ang mismong idyoma. Pinananatili ng “sumunod kay” ang saklaw at tensiyon ng pananalita nang hindi nagdaragdag ng tahasang pandiwang “sumamba.”
- issue: Kasarian ng katawagang אֱלֹהֵי para kay Astoret
  choice: diyosa
  alternative: diyos
  rationale: Ang anyo ng salitang Hebreo ay maaaring literal na katawaning “diyos/mga diyos,” ngunit ang apposisyon ay tumutukoy sa babaeng diyos na si Astoret. Ang “diyosa” ang malinaw at likas na pagtukoy sa reperente sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang karaniwang mga anyong Tagalog na “Sidonio” at “Ammonita,” at pinanatiling maikli ang pangungusap. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
