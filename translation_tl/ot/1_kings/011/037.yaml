base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: tl
  text: At kukunin kita, at maghahari ka sa lahat ng ninanais ng iyong kalooban[a], at magiging hari ka ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “lahat ng ninanais mo”; sa literal, “lahat ng ninanais ng iyong kaluluwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקַּח
  choice: kukunin kita
  rationale: Pinananatili nito ang karaniwang kongkretong diwa ng לָקַח na “kunin,” nang hindi agad ipinapakahulugang “piliin” sa konteksto ng banal na pagtatalaga.
- source_word: וּמָלַכְתָּ
  choice: maghahari ka
  rationale: Ipinapahayag ng מָלַךְ ang aktuwal na paghahari, hindi lamang ang pagluklok o pagiging hari.
- source_word: בְּכֹל אֲשֶׁר
  choice: sa lahat ng
  rationale: Sa kaugnayan nito sa pandiwang “maghari,” ipinahihiwatig ng בְּ ang saklaw ng paghahari; natural itong naipapahayag sa Tagalog bilang “sa lahat ng.”
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: ninanais ng iyong kalooban
  rationale: Ang נֶפֶשׁ sa idyomang ito ay tumutukoy sa mismong sarili o panloob na pagnanasa. Ang “kalooban” ay natural at marangal sa modernong Tagalog, samantalang ipinapaliwanag sa talababa ang literal na imaheng “kaluluwa.”
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: ikaw ay magiging hari
  rationale: Ang הָיָה kasama ng pangngalan ay nagsasaad dito ng magiging katayuan o tungkulin.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Tagalog, ang “magiging hari sa Israel” ay natural na nagpapahayag ng pamamahala sa bayan; ang “hari ibabaw ng Israel” ay hindi likas na gamit.
theological_decisions:
- issue: Antropolohikal na pahayag na נֶפֶשׁ
  choice: Isinalin sa pangunahing teksto bilang “kalooban,” na may literal na anyong “kaluluwa” sa talababa.
  alternative: “ninanais ng iyong kaluluwa” o payak na “ninanais mo”
  rationale: Hindi teknikal na aral tungkol sa kaluluwa ang tinutukoy ng talata. Pinananatili ng talababa ang leksikal na larawan ng Hebreo, habang iniiwasan ng pangunahing teksto ang di-natural o posibleng mapanlinlang na pahayag sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “maghahari” at “magiging hari” upang mapanatili ang pagkakaiba ng aktuwal na pamamahala at ng katayuang hari. Ang “kukunin kita” ay sadyang nagpapanatili sa kongkretong lakas at bahagyang kalabuan ng pandiwang Hebreo.
