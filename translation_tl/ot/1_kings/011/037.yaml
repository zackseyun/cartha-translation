  source_fidelity: 'Tumpak na naipapahayag ng draft ang sunod-sunod na pangako: kukunin, maghahari ayon sa buong saklaw ng ninanais ng kaniyang kalooban, at magiging hari. Gayunman, ang pangwakas na “hari sa Israel” ay maaaring mangahulugang hari na nasa Israel, samantalang ang עַל יִשְׂרָאֵל ay tumutukoy sa paghahari sa/sa ibabaw ng Israel. Ang “hari ng Israel” ay ang likas at tiyak na Tagalog na katumbas ng katayuang ito.'
