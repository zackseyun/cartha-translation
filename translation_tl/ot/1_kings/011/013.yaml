source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: tl
  text: Gayunman,[a] hindi ko kukunin ang buong kaharian. Isang lipi ang ibibigay ko sa anak mo, alang-alang kay David na lingkod ko at alang-alang sa Jerusalem na pinili ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ngunit hindi ko kukunin ang buong kaharian.”
    reason: Maaaring unawain ang רַק bilang “ngunit” o “tanging,” na naghahayag ng limitasyon sa naunang hatol, sa halip na bilang pang-ugnay na “gayunman.”
lexical_decisions:
- source_word: רַק
  choice: Gayunman
  rationale: Ipinakikilala nito ang hangganan o pagbubukod sa naunang hatol. Likas sa modernong Filipino ang “Gayunman” at naipapahayag nito ang salungat na puwersa ng salita.
- source_word: כָּל הַמַּמְלָכָה
  choice: ang buong kaharian
  rationale: Pinananatili ng “buong” ang kabuuang saklaw ng כָּל at malinaw na tumutukoy sa buong nasasakupan ng hari.
- source_word: אֶקְרָע
  choice: aagawin sa iyo
  rationale: Literal na nangangahulugang “pupunitin” ang pandiwa, ngunit sa kontekstong pampolitika ay tumutukoy ito sa marahas na pag-aalis ng kaharian. Ang “aagawin sa iyo” ay natural sa Filipino at pinananatili ang puwersa ng larawan nang hindi nagiging malabo.
- source_word: שֵׁבֶט אֶחָד
  choice: isang lipi
  rationale: Sa kontekstong ito, ang שֵׁבֶט ay isang lipi ng Israel, hindi literal na pamalo o setro.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: ibibigay ko sa anak mo
  rationale: Tuwirang pinananatili ang payak na pananalita ng pagbibigay sa hinaharap.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: alang-alang kay David na lingkod ko
  rationale: Ipinapahayag ng “alang-alang” ang pagsasaalang-alang kay David nang hindi nagpapasok ng higit na paliwanag na wala sa talata.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: at alang-alang sa Jerusalem
  rationale: Inuulit ang “alang-alang” upang mapanatili ang magkatimbang at magkatulad na dalawang dahilan sa Hebreo.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: na pinili ko
  rationale: Malinaw at natural itong tumutukoy sa naunang pagpili ng Diyos sa Jerusalem, na nananatiling mahalaga sa kasalukuyang pahayag.
theological_decisions:
- issue: Dahilan ng pagpapanatili ng isang lipi
  choice: Magkatimbang na pinananatili ang pagsasaalang-alang ng Diyos kay David at sa Jerusalem na pinili niya.
  alternative: Iugnay lamang ang pagpapanatili sa tipan kay David, o unahin ang Jerusalem at ang templo bilang pangunahing dahilan.
  rationale: Dalawang magkatulad na pariralang לְמַעַן ang ibinibigay ng Hebreo. Hindi pinag-iisa o pinipili ng salin ang isa laban sa isa, at hindi rin nito dinaragdagan ang talata ng isang tiyak na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “lipi” para sa yunit ng Israel at inulit ang “alang-alang” upang mapanatili ang parallelism ng Hebreo.
