  naturalness: Natural at marangal ang Filipino ng talata. Ang “isang lipi,” “alang-alang,” at ang inuulit na paralelismo ay angkop sa modernong Filipino Tagalog at sa rehistro ng salaysay-biblikal.
  terminology: Ang “kaharian,” “lipi,” “lingkod,” at “Jerusalem” ay wasto at magkakatugma. Pinananatili ng “alang-alang” ang dalawang magkapantay na dahilan, at hindi nagdaragdag ng doktrinal na paliwanag.
