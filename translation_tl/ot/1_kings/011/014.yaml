base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: tl
  text: Pagkatapos, ibinangon ni Yahweh ang isang kalaban[a] laban kay Solomon—si Hadad na Edomita. Siya ay mula sa maharlikang angkan sa Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: satan; dito, ang ibig sabihin ay “kalaban” o “katunggali,” hindi ang pangalang pantangi na Satanas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: nagbangon
  rationale: Ang hiphil ng קום ay nagpapahayag na pinapangyari ni Yahweh na lumitaw o tumindig ang isang kalaban. Pinananatili ng “nagbangon” ang tuwirang pagkilos ng Diyos nang hindi ito ginagawang pormal na paghirang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin sa transliterasyong “Yahweh” ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: שָׂטָן
  choice: isang kalaban
  rationale: Karaniwang pangngalan ito rito na tumutukoy sa isang taong sumasalungat, hindi sa pangalang pantanging Satanas.
- source_word: לִשְׁלֹמֹה
  choice: ni Solomon
  rationale: Kasama ng שָׂטָן, itinatakda ng ל ang taong kinakalaban. Likas sa Tagalog ang pariralang “kalaban ni Solomon.”
- source_word: הֲדַד הָאֲדֹמִי
  choice: si Hadad na Edomita
  rationale: Pinananatili ang karaniwang anyo ng pangalang Hadad at likas na isinasalin ang katawagang etniko bilang “Edomita.”
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: mula sa angkan ng hari
  rationale: Ang literal na “mula sa binhi ng hari” ay idyoma ng maharlikang pinagmulan. Ang “mula sa angkan ng hari” ay malinaw at pinananatili ang diwang genealogical.
- source_word: הוּא בֶּאֱדוֹם
  choice: sa Edom
  rationale: Iniuugnay ng hulíng parirala ang maharlikang angkan kay Edom. Pinananatili ito sa “angkan ng hari sa Edom” nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Kahulugan ng שָׂטָן sa talatang ito
  choice: karaniwang pangngalang “kalaban”
  alternative: pangalang pantanging “Satanas”
  rationale: Kinilala mismo ng konteksto si Hadad bilang taong ibinangon laban kay Solomon. Isang taong pampolitikang kalaban ang tinutukoy, hindi ang diyablo.
- issue: Pagkilos ni Yahweh sa paglitaw ng kalaban
  choice: “nagbangon”
  alternative: “humirang”
  rationale: Pinananatili ang tahasang pagkilos ni Yahweh sa tekstong Hebreo ngunit hindi ipinapalagay na isang pormal na paghirang ang tinutukoy.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang payak na “kalaban” at ang likas na pariralang “angkan ng hari,” habang pinanatili ang personal na pangalang Yahweh at ang tiyak na ugnayan kay Edom.
