  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: tl
  text: At gayon din ang ginawa niya para sa lahat ng kanyang mga asawang banyaga[a], na nagsusunog ng insenso at naghahandog ng mga hain sa kanilang mga diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At sa gayunding paraan ay ginawa niya para sa lahat ng kanyang mga asawang banyaga.” Hindi tahasang sinasabi sa Hebreo kung ano ang ginawa niya; tumutukoy ito sa ginawa niya sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: At gayon din
  rationale: Ipinagpapatuloy nito ang salaysay at itinuturo ang katulad na ginawa ni Solomon ayon sa naunang talata.
- source_word: עָשָׂה
  choice: ang ginawa niya
  rationale: Malawak ang kahulugan ng pandiwa na ‘gumawa’; pinananatiling di-tiyak ang layon dahil ipinahihiwatig lamang ito mula sa naunang talata.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: para sa lahat ng kanyang mga asawang banyaga
  rationale: Ang לְ ay nagpapahiwatig na ginawa niya ito para sa kanila; ang נָשִׁים ay tumutukoy sa mga asawa, at ang הַנָּכְרִיּוֹת ay sa kanilang pagiging mula sa ibang mga bayan.
- source_word: מַקְטִירוֹת
  choice: nagsusunog ng insenso
  rationale: Sa kontekstong panrelihiyon, karaniwang tumutukoy ang pandiwa sa pagpapausok o pagsusunog ng insenso; ang anyong pandiwaring pambabae at maramihan ay tuwirang umaayon sa mga asawang banyaga.
- source_word: וּמְזַבְּחוֹת
  choice: at naghahandog ng mga hayop
  rationale: Ang זבח ay tumutukoy sa paghahandog sa pamamagitan ng pagkatay; nililinaw ng ‘mga hayop’ ang uri ng handog at iniiwasang ipagkamali ito sa handog na insenso.
- source_word: לֵאלֹהֵיהֶן
  choice: sa kanilang mga diyos
  rationale: Ang anyong maramihan na may hulaping pambabae at maramihan ay tumutukoy sa mga diyos ng mga asawang banyaga; maliit na titik ang ginamit sapagkat hindi ito ang Diyos ng Israel.
theological_decisions:
- issue: Ang tinutukoy ng מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: Ang mga asawang banyaga ang nagsusunog ng insenso at naghahandog.
  alternative: Maaaring unawain nang mas maluwag na inilalarawan ng mga pandiwari ang pagsambang kaugnay ng mga dambanang ginawa ni Solomon para sa kanila.
  rationale: Ang dalawang pandiwaring pambabae at maramihan ay tuwirang umaayon sa ‘mga asawang banyaga,’ kaya sila ang likas na simuno ng mga gawaing ito.
- issue: Ang hindi tahasang layon ng ‘ginawa niya’
  choice: Hindi tinukoy sa pangunahing teksto kung ano mismo ang ginawa ni Solomon.
  alternative: Nagtayo siya ng mga sambahan sa matataas na lugar para sa lahat ng kanyang mga asawang banyaga.
  rationale: Hindi inuulit ng Hebreo ang kilos mula sa naunang talata. Ang pagpapanatili sa elipsis ay umiiwas sa pagdaragdag ng mga salitang wala sa talatang ito, habang ang talababa ay nagbibigay ng alternatibong likas na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang elipsis ng Hebreo at ang patuloy o nakagawiang diwa ng mga pandiwari sa pamamagitan ng mga pandiwang nasa aspektong imperpektibo.
