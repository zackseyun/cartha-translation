translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'ipapatay' upang mapanatili ang causative force ng Hebreo, at 'kumilos' upang maipahayag ang narrative function ng וַיָּקָם nang hindi maging di-likas ang literal na 'tumayo.'
