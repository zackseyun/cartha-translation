base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: tl
  text: Kaya sinikap ni Solomon na patayin si Jeroboam[a]. Ngunit tumindig si Jeroboam at tumakas patungong Ehipto, kay Sisak, na hari ng Ehipto, at nanatili[b] siya sa Ehipto hanggang sa mamatay si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hinangad ni Solomon na patayin si Jeroboam.”
    reason: lexical_alternative
  - marker: b
    text: O, “at siya ay nasa Ehipto hanggang sa mamatay si Solomon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: hinangad
  rationale: Ipinahahayag ng בקש ang paghahangad o pagtatangkang gawin ang isang bagay, nang hindi ipinapalagay na nagtagumpay ito.
- source_word: לְהָמִית
  choice: na ipapatay
  rationale: 'Ang Hiphil infinitive ng מות ay may diwang sanhi: balak ni Solomon na ipapatay si Jeroboam. Likas ito sa modernong Tagalog at pinananatili ang bigat ng banta.'
- source_word: וַיָּקָם
  choice: kumilos
  rationale: Sa salaysay, ang קום ay maaaring magpakilala ng tiyak at agarang pagkilos, hindi lamang literal na pagtayo.
- source_word: וַיִּבְרַח
  choice: tumakas
  rationale: Tumpak na ipinahahayag ng 'tumakas' ang paglayo mula sa panganib.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: patungong Ehipto, kay Sisak na hari ng Ehipto
  rationale: Pinananatili ang pag-uulit ng Ehipto at ang pagtiyak na tumungo si Jeroboam kay Sisak.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: nanatili siya roon
  rationale: Bagaman literal na 'siya ay nasa Ehipto,' ipinahihiwatig ng kasunod na pariralang χρονolohikal ang patuloy na paninirahan; natural sa Tagalog ang 'nanatili siya roon.'
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: hanggang sa mamatay si Solomon
  rationale: Natural at malinaw na Tagalog para sa nominal na pariralang Hebreo na 'hanggang sa kamatayan ni Solomon.'
