revisions:
- from: Kaya hinangad ni Solomon na ipapatay si Jeroboam[a]. Ngunit kumilos si Jeroboam at tumakas patungong Ehipto, kay Sisak na hari ng Ehipto, at nanatili siya roon hanggang sa mamatay si Solomon.[b]
  to: Kaya sinikap ni Solomon na patayin si Jeroboam[a]. Ngunit tumindig si Jeroboam at tumakas patungong Ehipto, kay Sisak, na hari ng Ehipto, at nanatili[b] siya sa Ehipto hanggang sa mamatay si Solomon.
  rationale: Pinalitan ang mga salitang maaaring magdagdag o magpalabo ng kahulugan, habang pinananatili ang pagkakasunod ng Hebreong salaysay, ang pag-ulit ng Ehipto, at ang diwa ng pananatili ni Jeroboam doon hanggang sa pagkamatay ni Solomon. Inayos din ang pagkakaangkla ng talababa b.
