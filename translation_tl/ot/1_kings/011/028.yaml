- from: Si Jeroboam ay isang lalaking may pambihirang kakayahan[a]. Nang makita ni Solomon na masipag ang binata, itinalaga niya ito na mamahala sa lahat ng mga trabahador mula sa sambahayan ni Jose.[b]
  to: Si Jeroboam ay isang lalaking may pambihirang kakayahan[a]. Nang makita ni Solomon na masipag ang binata, itinalaga niya siyang mamahala sa lahat ng mabibigat na gawain ng sambahayan ni Jose.[b]
  rationale: Pinalitan ang saling tumutukoy lamang sa mga trabahador upang maipakita ang saklaw ng ‘lahat ng pasaning paglilingkod-paggawa’ sa Hebreo. Inayos din ang panghalip para sa natural na Tagalog. Pinanatili ang mga marker [a] at [b], at inayon ang talababa [b] sa binagong pangunahing teksto.
