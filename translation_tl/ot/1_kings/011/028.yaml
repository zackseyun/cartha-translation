translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ito” bilang panghalip kay Jeroboam upang maiwasan ang kalituhan sa sunod-sunod na “niya.” Ang lahat ng marker [a] at [b] ay nasa pangunahing teksto at tumutugma sa mga talababa.
