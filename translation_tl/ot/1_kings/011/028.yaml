base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: tl
  text: Si Jeroboam ay isang lalaking may pambihirang kakayahan[a]. Nang makita ni Solomon na masipag ang binata, itinalaga niya siyang mamahala sa lahat ng mabibigat na gawain ng sambahayan ni Jose.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang lalaking malakas” o “isang magiting na lalaki.” Ang pananalitang Hebreo ay maaaring tumukoy sa lakas, kagitingan, o natatanging kakayahan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ni Jose” ay tumutukoy sa mga liping nagmula kay Jose, lalo na sa Efraim at Manases. Ang “mabibigat na gawain” ay maaaring tumukoy sa pasaning paglilingkod-paggawa, kabilang ang sapilitang paggawa para sa hari.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Si Jeroboam ay isang lalaki
  rationale: Likas na pagpapakilala sa modernong Tagalog; hindi na isinama ang isang artipisyal na panandang panahunan para sa simpleng pang-ugnay na וְ.
- source_word: גִּבּוֹר חָיִל
  choice: may pambihirang kakayahan
  rationale: Sa kontekstong administratibo, inilalarawan ng parirala ang kapansin-pansing lakas, husay, o kakayahan ni Jeroboam, hindi kinakailangang kagitingan sa digmaan; pinananatili sa talababa ang lawak ng idyoma.
- source_word: וַיַּרְא שְׁלֹמֹה
  choice: Nang makita ni Solomon
  rationale: Pinananatili ang pangunahing diwa ng ראה na 'makita,' habang natural na iniuugnay sa sumunod na pagkatalaga.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Ang נַעַר ay maaaring kabataan, binata, o lingkod; ang 'binata' ay angkop sa isang nasa hustong gulang na binigyan ng pananagutang administratibo.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: na masipag ang binata
  rationale: Ang literal na ideyang 'gumagawa siya ng gawain' ay may kontekstuwal na diwang masipag o mahusay magtrabaho, na siyang dahilan ng pagkatalaga.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: itinalaga niya ito na mamahala
  rationale: Ipinahahayag ang Hiphil ng פקד bilang pag-aatas o paglalagay sa isang posisyon ng pangangasiwa.
- source_word: לְכָל סֵבֶל
  choice: sa lahat ng mga trabahador
  rationale: Ang סֵבֶל ay tumutukoy sa mabigat o sapilitang gawaing ipinapataw ng pamahalaan; dito, ang konkretong pangkat na pinangangasiwaan ang natural na pokus sa Tagalog, habang nililinaw ng talababa ang posibleng diwang sapilitang paggawa.
- source_word: בֵּית יוֹסֵף
  choice: mula sa sambahayan ni Jose
  rationale: Pinananatili ang pantribong katawagang Hebreo at nililinaw sa talababa na tumutukoy ito lalo na sa mga lipi nina Efraim at Manases.
