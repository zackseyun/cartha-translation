  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: tl
  text: 'At ito ang dahilan kung bakit naghimagsik siya laban sa hari: itinayo ni Solomon ang Milo at isinara ang puwang sa Lungsod ni David, na ama ni Solomon.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “itinaas niya ang kanyang kamay laban sa hari.” Ang idyomang Hebreo ay maaaring mangahulugang naghimagsik siya laban sa hari.'
    reason: alternative_reading
  - marker: b
    text: Ang “Milo” ay malamang na pangalan ng isang tanggulan o estrukturang binuong tambak na may mga terasa sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: ang dahilan
  rationale: Bagaman literal na “ang bagay/usapin,” ipinakikilala ng parirala ang paliwanag sa paghihimagsik ni Jeroboam; natural at tumpak sa Filipino ang “ang dahilan.”
- source_word: הֵרִים יָד
  choice: naghimagsik
  rationale: Ang literal na idyomang “itinaas ang kamay” ay tumutukoy rito sa pag-aalsa laban sa hari. Mas malinaw sa karaniwang mambabasa ang kahulugan sa pangunahing teksto, habang pinananatili sa talababa ang literal na larawan.
- source_word: בַּמֶּלֶךְ
  choice: laban sa hari
  rationale: Minamarkahan ng pang-ukol ang pinatutungkulan ng mapanlabang pagkilos; pinananatili ang “hari” sapagkat sa kasunod na sugnay pa tuwirang pinangalanan si Solomon.
- source_word: הַמִּלּוֹא
  choice: ang Milo
  rationale: Ito ay tiyak ngunit hindi lubos na matukoy na katawagang topograpiko o pang-arkitektura sa Jerusalem, kaya isinalin sa pamamagitan ng transliterasyon at ipinaliwanag sa talababa.
- source_word: סָגַר
  choice: isinara
  rationale: Tuwirang ipinahahayag ang diwang “isara,” at ang layong “siwang sa pader” ang nagpapalinaw sa gawaing pagkukumpuni o pagpapatibay.
- source_word: פֶּרֶץ
  choice: ang siwang sa pader
  rationale: Sa konteksto ng tanggulan, tumutukoy ito sa puwang o sira sa pader. Idinagdag ang “sa pader” para sa likas at malinaw na Filipino nang hindi pinapalitan ang larawan ng Hebreo.
- source_word: עִיר דָּוִד
  choice: Lungsod ni David
  rationale: Karaniwang pantanging tawag ito sa tanggulan sa Jerusalem na kaugnay ni David.
- source_word: אָבִיו
  choice: na kanyang ama
  rationale: Si David ang ama ni Solomon; pinananatili ang payak na ugnayang tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Kahulugan ng idyomang הֵרִים יָד
  choice: “naghimagsik” sa pangunahing teksto
  alternative: “itinaas niya ang kanyang kamay laban”
  rationale: Ang idyoma ay nagsasaad ng mapanlabang pag-aalsa, hindi lamang pisikal na kilos. Inilalagay sa talababa ang literal na anyo upang mapanatili ang imahen at mapakitang interpretibong salin ang “naghimagsik.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naghimagsik” upang natural na maipahayag ang diwa ng idyomang Hebreo, at pinanatili ang literal na larawan sa talababa. Ang “Milo” ay transliterado dahil hindi tiyak ang eksaktong uri ng estruktura.
