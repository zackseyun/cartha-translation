id: 1KI.11.7
reference: 1 Kings 11:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: tl
  text: Nang panahong iyon, nagtayo si Solomon ng isang mataas na lugar para kay Kemos, ang kasuklam-suklam na diyos ng Moab, sa bundok na nasa tapat ng Jerusalem, at para kay Molek[a], ang kasuklam-suklam na diyos ng mga Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Milcom.” Tradisyonal na binabasa rito ang anyong Hebreo bilang “Molek,” ngunit iniuugnay ito ng ilan sa diyos ng mga Ammonita na si Milcom.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa modernong Tagalog at malinaw na nag-uugnay sa kasunod na pangyayari sa salaysay.
- source_word: יִבְנֶה
  choice: nagtayo
  rationale: Bagaman imperfect ang anyong Hebreo, kasama ng אָז ay tumutukoy ito sa nakaraang pangyayari sa daloy ng salaysay.
- source_word: בָּמָה
  choice: sambahan sa mataas na lugar
  rationale: Ipinahihiwatig ang teknikal na kahulugan ng isang kultikong pook, kadalasang nasa mataas na lugar; mas malinaw ito sa karaniwang mambabasa kaysa sa literal na 'mataas na lugar' lamang.
- source_word: לִכְמוֹשׁ
  choice: para kay Kemos
  rationale: Ang לְ ay nagpapahayag ng pag-aalay o pagtatalaga ng sambahan sa diyos na pinangalanan; isinalin sa karaniwang baybay-Tagalog ang pangalang Chemosh.
- source_word: שִׁקֻּץ מוֹאָב
  choice: ang kasuklam-suklam na diyos ng Moab
  rationale: Malakas at mapanuring katawagan ang שִׁקֻּץ sa diyos o bagay na sinasamba. Nililinaw ng 'diyos' ang tinutukoy sa konteksto nang pinananatili ang negatibong pagtataya ng tagapagsalaysay.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: sa bundok na nasa tapat ng Jerusalem
  rationale: Tuwirang pinananatili ang הַר bilang 'bundok' at ang relasyong pansaklaw ng עַל־פְּנֵי bilang 'nasa tapat,' nang hindi nagdaragdag ng tiyak na heograpikong pagkakakilanlan.
- source_word: וּלְמֹלֶךְ
  choice: at para kay Molek[a]
  rationale: Sinusunod ng pangunahing teksto ang anyo at tradisyonal na pagbasa ng MT; inilalahad sa talababa ang posibleng kaugnayan sa Milcom.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: ang kasuklam-suklam na diyos ng mga Ammonita
  rationale: Pinananatili ang paralelismo sa unang parirala, habang natural na isinasalin ang בְּנֵי עַמּוֹן bilang 'mga Ammonita.'
theological_decisions:
- issue: Mapanuring katawagan sa mga banyagang diyos
  choice: Isalin ang שִׁקֻּץ sa dalawang pagkakataon bilang 'kasuklam-suklam na diyos.'
  alternative: '''kasuklam-suklam na bagay'' o ''karumal-dumal na diyos'''
  rationale: Ang negatibong pagtataya ay nasa tekstong Hebreo mismo. Ang pagbanggit sa 'diyos' ay nililinaw ang reperente sa konteksto at hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Pagkakakilanlan ng מֹלֶךְ
  choice: Molek sa pangunahing teksto
  alternative: Milcom
  rationale: Sinusuportahan ng bokalisasyon ng MT ang Molek, ngunit iniuugnay ito ng ilan sa diyos ng mga Ammonita na si Milcom. Pinananatili sa talababa ang tunay na usaping tekstuwal at pangkasaysayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'sambahan sa mataas na lugar' upang maipahayag ang teknikal na kultikong diwa ng בָּמָה nang hindi maging malabo; pinanatili ang matinding negatibong lakas ng שִׁקֻּץ.
