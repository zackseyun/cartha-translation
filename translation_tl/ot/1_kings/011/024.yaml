base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: tl
  text: Nagtipon siya ng mga lalaki sa paligid niya at naging pinuno ng isang pangkat nang patayin sila ni David. Pumunta sila sa Damasco[a], nanirahan doon, at naghari sa Damasco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maramihan ang mga pandiwa sa Hebreo sa huling bahagi ng talata: “pumunta sila … nanirahan … naghari.” Ginagawa itong isahan (“siya”) sa ilang salin dahil nakasentro kay Rezon ang konteksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Nagtipon siya ng mga lalaki sa paligid niya
  rationale: Ipinahahayag ng קבץ na may עַל at hulaping panghalip ang pagtitipon ng mga tagasunod sa paligid ng isang tao. Natural sa modernong Tagalog ang “sa paligid niya” at pinananatili nito ang direksiyonal na diwa.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Panlalaking maramihan ang anyong Hebreo at tumutukoy sa mga lalaking kabilang sa isang pangkat na militar, kaya mas tiyak ang “mga lalaki” kaysa “mga tao.”
- source_word: שַׂר גְּדוּד
  choice: pinuno ng isang pangkat
  rationale: Ang שַׂר ay pinuno o kumandante, at ang גְּדוּד ay pangkat o pulutong, madalas na hindi regular na yunit. Pinili ang neutral na “pangkat” upang hindi idagdag na tiyak na mga mananalakay sila.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: nang patayin ni David ang mga kasama niya
  rationale: Ang ב na kasama ng infinitive construct ay temporal, “nang/noong.” Malabo ang eksaktong tinutukoy ng maramihang אֹתָם; ipinapakita ng “mga kasama niya” ang malamang na ugnayan sa pangkat nang hindi ipinapalagay na ang mga bagong natipon mismo ang lahat ng pinatay.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Pumunta sila sa Damasco
  rationale: Pinananatili ang tahasang maramihang pandiwa at ang kilos patungo sa Damasco.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: nanirahan doon
  rationale: Ang ישב sa ganitong konteksto ay nangangahulugang manirahan o mamalagi. Natural at hindi labis na interpretibo ang “nanirahan doon.”
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: at naghari sa Damasco
  rationale: Karaniwang nangangahulugan ang Qal ng מלך na maghari. Pinananatili ng panghalip na “sila” mula sa naunang sugnay ang maramihang paksa ng Hebreo, kahit nakasentro kay Rezon ang mas malawak na konteksto.
theological_decisions:
- issue: Maramihang mga pandiwa sa mga huling sugnay kahit si Rezon ang sentro ng mas malawak na salaysay
  choice: 'Panatilihin ang maramihan: “Pumunta sila… nanirahan… naghari”'
  alternative: 'Gawing isahan: “Pumunta siya… nanirahan… naghari”'
  rationale: Maramihan ang mga pandiwang Hebreo sa buong huling bahagi ng talata. Ang pagpapanatili nito ay tapat sa tekstong pinagmulan at hindi tahimik na nilulutas ang tensiyong pangsalaysay.
- issue: Tinutukoy ng אֹתָם sa “nang patayin ni David sila”
  choice: “ang mga kasama niya”
  alternative: “sila” o “ang mga iyon”
  rationale: Hindi ganap na tiyak ang antecedent sa talatang ito. Ang “mga kasama niya” ay malinaw sa Tagalog ngunit hindi ipinapantay ang pinatay sa lahat ng lalaking katatapos lamang niyang tipunin.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Damasco,” ang karaniwang anyong Filipino ng Damascus. Iniwasan ang mas teknikal na “kumandante” at ang interpretibong “pangkat ng mga mananalakay”; pinili ang payak na “pinuno ng isang pangkat.”
