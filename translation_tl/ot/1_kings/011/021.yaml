  text: וַ/הֲדַ֞ד שָׁמַ֣ע בְּ/מִצְרַ֗יִם כִּֽי שָׁכַ֤ב דָּוִד֙ עִם אֲבֹתָ֔י/ו וְ/כִי מֵ֖ת יוֹאָ֣ב שַֽׂר הַ/צָּבָ֑א וַ/יֹּ֤אמֶר הֲדַד֙ אֶל פַּרְעֹ֔ה שַׁלְּחֵ֖/נִי וְ/אֵלֵ֥ךְ אֶל אַרְצִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: tl
  text: Nang mabalitaan ni Hadad sa Ehipto na nahimlay na si David kasama ng kanyang mga ninuno[a] at patay na si Joab, ang kumander ng hukbo, sinabi ni Hadad sa Paraon, “Payagan mo akong umalis upang makapunta ako sa sarili kong lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “humiga kasama ng kanyang mga ninuno,” isang karaniwang pahayag na nangangahulugang namatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: mabalitaan
  rationale: Bagaman pangunahing nangangahulugang “marinig,” tumutukoy rito ang pandiwa sa pagtanggap ng balita; natural itong ipinahahayag sa Filipino bilang “mabalitaan.”
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: nahimlay na ... kasama ng kanyang mga ninuno
  rationale: Pinananatili ng “nahimlay” ang larawang nasa karaniwang Hebreong pahayag tungkol sa kamatayan, ngunit mas marangal at natural ito sa modernong Filipino kaysa sa literal na “humiga.”
- source_word: מֵת
  choice: patay na
  rationale: Ipinahahayag nito ang resultang kalagayan na nasa Hebreo, sa halip na gawing tahasang pangyayari lamang na “namatay na.”
- source_word: שַׂר הַצָּבָא
  choice: ang kumander ng hukbo
  rationale: Malinaw at kasalukuyang katawagan ito para sa pinunong militar na tinutukoy ng שַׂר.
- source_word: שַׁלְּחֵנִי
  choice: Payagan mo akong umalis
  rationale: Sa konteksto ng pakikipag-usap sa Paraon, hinihiling ni Hadad na siya ay palayain o pahintulutang umalis. Iniiwasan nito ang di-naaangkop na pahiwatig ng “paalisin mo ako” na para bang itinataboy siya.
- source_word: וְאֵלֵךְ
  choice: upang makapunta ako
  rationale: Ipinakikita ng “upang” ang layunin o ninanais na bunga ng naunang pakiusap.
- source_word: אַרְצִי
  choice: sarili kong lupain
  rationale: Pinananatili ng “lupain” ang payak na diwa ng אֶרֶץ, at malinaw na naipahahayag ng “sarili kong” ang hulaping paari.
theological_decisions:
- issue: Ang Hebreong idyoma para sa kamatayan ni David
  choice: Pinanatili sa pangunahing teksto ang larawan ng paghimlay kasama ng mga ninuno.
  alternative: Isalin lamang bilang “namatay na si David.”
  rationale: Ang pagpapanatili sa larawan ay nagbibigay-daan sa mambabasa na makita ang tradisyonal na pormula ng salaysay nang hindi itinatanggi na kamatayan ang kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon,” “kumander,” at “hukbo” bilang mga karaniwang katawagang madaling maunawaan. Hindi isinama ang panimulang “Ngayon” sapagkat walang katumbas na tahasang salitang temporal sa Hebreo.
