  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: tl
  text: Nang panahong iyon, nang lumabas si Jeroboam mula sa Jerusalem, nasumpungan siya sa daan ni Ahias na taga-Silo, ang propeta. Siya ay nakabalot sa isang bagong balabal[a], at silang dalawa lamang ang naroon sa parang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi sa Hebreo kung si Ahias o si Jeroboam ang nakabalot sa bagong balabal.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas na panimulang temporal sa modernong Tagalog; ipinahihiwatig nito ang pormulang pasalaysay nang hindi nagiging alanganing literal.
- source_word: יָצָא מִירוּשָׁלָם
  choice: pagkalabas ni Jeroboam mula sa Jerusalem
  rationale: Pinananatili ang direksiyonal na diwa ng יָצָא at ang ugnayang temporal ng sugnay.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: natagpuan siya
  rationale: Tuwirang sinasalamin ang karaniwang kahulugan ng מצא; hindi ito pinapahina tungo sa mas malayang 'nakasalubong.'
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: ng propetang si Ahias na taga-Silo
  rationale: Natural na Tagalog ang ayos, habang pinananatili ang pagkakakilanlan niya bilang propeta at bilang mula sa Silo.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Payak at tiyak na katumbas ng lokatibong parirala.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: Nakabalot ang isa sa kanila
  rationale: Hindi tiyak sa Hebreo kung si Ahias o si Jeroboam ang tinutukoy ng panghalip; iniiwasan ng salin na tahimik na lutasin ang kalabuan.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: sa isang bagong balabal
  rationale: Ang 'balabal' ay natural na tawag sa panlabas na kasuotan at angkop sa simbolikong pagpunit sa kasunod na talata.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: silang dalawa lamang ang naroon
  rationale: Malinaw na ipinahahayag na walang ibang taong kasama nila.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang 'parang' ay likas na modernong Tagalog para sa bukás na lupain o field, nang hindi dinaragdagan ang teksto ng tahasang 'malawak' o 'liblib.'
theological_decisions:
- issue: Pagkakakilanlan ng nakabalot sa bagong balabal
  choice: 'Pinanatiling di-tiyak sa pangunahing teksto: ''ang isa sa kanila'''
  alternative: Tukuying si Ahias ang nakabalot
  rationale: Ang panlalaking isahang panghalip na וְהוּא ay maaaring tumukoy sa alinman sa dalawang lalaking nabanggit; bagaman malamang si Ahias ayon sa daloy at kasunod na kilos, hindi iyon tahasang nilulutas ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tradisyonal at laganap na anyong pangalang 'Ahias' at ang karaniwang anyong 'Silo.' Pinanatili ang tunay na kalabuan ng panghalip sa Hebreo sa halip na ipalagay na si Ahias ang tinutukoy.
