  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: tl
  text: Pagkatapos, hinawakan ni Ahias ang bagong balabal na suot niya[a] at pinunit iyon sa labindalawang piraso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa kaniya.” Literal na “na nasa kaniya” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: hinawakan
  rationale: Tumutukoy ito sa pisikal na paghawak sa isang bagay. Natural ang “hinawakan” sa modernong Filipino at hindi nito pinalalabis ang puwersa ng kilos.
- source_word: שַׂלְמָה
  choice: balabal
  rationale: Tumutukoy ang salita sa panlabas na kasuotan. Malinaw at marangal ang “balabal,” at angkop ito sa kasuotang pinunit sa salaysay.
- source_word: הַחֲדָשָׁה
  choice: bagong
  rationale: Tuwirang nangangahulugang “bago” ang pang-uri, at pinananatili ang detalyeng ito dahil mahalaga ito sa salaysay.
- source_word: אֲשֶׁר עָלָיו
  choice: na suot niya
  rationale: Literal na sinasabi ng Hebreo na ang balabal ay “nasa kaniya.” Ang “na suot niya” ang pinakanatural na pagpapahayag sa Filipino, bagaman bahagya itong nagpapaliwanag sa literal na parirala.
- source_word: וַיִּקְרָעֶהָ
  choice: pinunit iyon
  rationale: Tuwirang ipinapahayag nito ang pagpunit, at malinaw na tumutukoy ang “iyon” sa balabal.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: sa labindalawang piraso
  rationale: Natural nitong ipinahahayag sa Filipino ang bunga ng pagpunit habang pinananatili ang bilang at ang simbolikong puwersa ng kilos.
theological_decisions:
- issue: Kung sino ang may suot ng bagong balabal
  choice: na suot niya
  alternative: na nasa kaniya
  rationale: Maaaring tumukoy kay Ahias o kay Jeroboam ang panghalip na Hebreo ayon sa balarila at konteksto. Hindi nilulutas ng pangunahing teksto ang reperente; ipinapaliwanag ng talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “balabal” para sa panlabas na kasuotan at pinanatili sa talababa ang literal na anyo at kalabuan ng panghalip sa Hebreo.
