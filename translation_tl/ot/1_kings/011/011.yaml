base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: tl
  text: Kaya sinabi ni Yahweh kay Solomon, “Dahil ganito ang naging kalagayan mo,[a] at hindi mo tinupad ang aking tipan at ang aking mga tuntunin na iniutos ko sa iyo, tiyak na pupunitin ko ang kaharian mula sa iyo at ibibigay ko ito sa iyong lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Dahil ito ay naging kasama mo.” Idyomatiko at maikli ang Hebreo; maaari itong tumukoy sa naging kalagayan o nakagawiang asal ni Solomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: יַעַן אֲשֶׁר הָיְתָה זֹּאת עִמָּךְ
  choice: Dahil ganito ang iyong ginawa
  rationale: Ang parirala ay literal na malapit sa ‘dahil ito ay naging kasama mo,’ ngunit idyomatiko at eliptikal. Sa konteksto, tumutukoy ito sa naging asal ni Solomon; pinananatili ng talababa ang mas literal at state-oriented na posibilidad.
- source_word: שָׁמַרְתָּ
  choice: tinupad
  rationale: Sa kaugnayan ng tipan at mga tuntunin, natural na ipinahahayag ng ‘tinupad’ ang maingat na pagsunod, hindi lamang pag-iingat sa pisikal na diwa.
- source_word: בְּרִיתִי
  choice: aking tipan
  rationale: Ang ‘tipan’ ang malinaw at nakaugaliang salin ng terminong may legal at relasyunal na bigat.
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang ‘mga tuntunin’ ay likas sa modernong Tagalog at pinananatili ang legal na diwa ng salita.
- source_word: קָרֹעַ אֶקְרַע
  choice: tiyak na aagawin ko
  rationale: Ang infinitive absolute na sinusundan ng finite verb ay nagbibigay-diin sa katiyakan ng kilos. Ang ‘aagawin’ ay natural na larawan ng sapilitang pag-alis ng kaharian sa pamamahala ni Solomon.
- source_word: הַמַּמְלָכָה מֵעָלֶיךָ
  choice: aagawin ko sa iyo ang kaharian
  rationale: Ipinahahayag nito ang pag-alis ng kaharian mula sa kapangyarihan o pag-aari ni Solomon.
- source_word: לְעַבְדֶּךָ
  choice: sa iyong lingkod
  rationale: Sa kontekstong maharlika, tumutukoy ito sa isang nasasakupang opisyal; hindi kailangang ipasok ang mas makitid na kahulugang ‘alipin.’
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Direktang taglay ng tekstong Hebreo ang Tetragrammaton; pinananatili ang personal na pangalan sa transliterasyong ‘Yahweh.’
- issue: Kahulugan ng הָיְתָה זֹּאת עִמָּךְ
  choice: Dahil ganito ang iyong ginawa
  alternative: Dahil ito ay naging kasama mo / Dahil ganito ang iyong kalagayan
  rationale: Ang konteksto ay ang naging pagtataksil ni Solomon, ngunit malabo at idyomatiko ang Hebreo. Gumamit ang pangunahing teksto ng natural na Tagalog habang inilalahad sa talababa ang literal at posibleng state-oriented na pagbasa.
- issue: Larawan ng pagpunit sa kaharian
  choice: aagawin ko sa iyo ang kaharian
  alternative: pupunitin ko ang kaharian mula sa iyo
  rationale: Ang literal na larawang ‘pupunitin’ ay alanganin sa natural na Tagalog kapag ang layon ay kaharian. Ang ‘aagawin’ ay nagpapanatili sa marahas at tiyak na pag-alis nang hindi nagpapasya nang higit sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘tipan,’ ‘mga tuntunin,’ at ‘lingkod’ bilang malinaw na terminong biblikal; iniwasan ang sobrang literal na pariralang hindi likas sa Tagalog.
