  text: וַ/תֵּ֨לֶד ל֜/וֹ אֲח֣וֹת תַּחְפְּנֵ֗יס אֵ֚ת גְּנֻבַ֣ת בְּנ֔/וֹ וַ/תִּגְמְלֵ֣/הוּ תַחְפְּנֵ֔ס בְּ/ת֖וֹךְ בֵּ֣ית פַּרְעֹ֑ה וַ/יְהִ֤י גְנֻבַת֙ בֵּ֣ית פַּרְעֹ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: tl
  text: At nagsilang para kay Hadad ang kapatid ni Tahpenes ng isang anak na lalaki, si Genubat[a]. Inawat ni Tahpenes si Genubat sa pagsuso sa loob ng sambahayan ng Paraon[b], at si Genubat ay nasa sambahayan ng Paraon kasama ng mga anak na lalaki ng Paraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nagsilang para sa kanya ang kapatid ni Tahpenes ng isang anak na lalaki, si Genubat.” Sa Hebreo, ang “kanya” ay tumutukoy kay Hadad mula sa naunang konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “inawat sa pagsuso” ay nangangahulugang dinala ang bata sa yugtong hindi na siya sumususo.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ אֲחוֹת תַּחְפְּנֵיס
  choice: ipinanganak ng kapatid na babae ni Tahpenes ang anak niyang
  rationale: Ipinahahayag nang natural sa Tagalog na ang kapatid ni Tahpenes ang nagsilang ng anak ni Hadad, habang pinananatili ang diwa ng datibong לוֹ at ng tahasang בְּנוֹ.
- source_word: גְּנֻבַת
  choice: Genubat
  rationale: Transliterasyon ng pangalang Hebreo na angkop sa ponolohiya at baybay ng Tagalog.
- source_word: וַתִּגְמְלֵהוּ
  choice: inawat ... sa pagsuso
  rationale: 'Tuwirang ipinahahayag ang karaniwang kahulugan ng גמל sa konteksto ng isang sanggol: ang pagtigil sa pagpapasuso.'
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: sa loob ng sambahayan ng Paraon
  rationale: Ang בֵּית פַּרְעֹה ay maaaring tumukoy kapuwa sa tirahan at sa maharlikang sambahayan; mas malinaw rito ang sosyal na konteksto kaysa sa literal na 'bahay.'
- source_word: וַיְהִי גְנֻבַת בֵּית פַּרְעֹה
  choice: lumaki siya roon
  rationale: Sa konteksto ng pagkawat sa bata at pananatili niya sa korte, natural na Tagalog ang 'lumaki siya roon,' bagaman ang literal na anyo ay 'si Genubat ay nasa sambahayan ng Paraon.'
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: kasama ng mga anak na lalaki ng Paraon
  rationale: Pinananatili ang panlalaking anyo ng בְּנֵי at ang diwa na kabilang siya sa pangkat ng mga prinsipe sa sambahayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “sambahayan” para saklawin ang palasyo at ang maharlikang sambahayan; iniwasan ang masyadong literal ngunit di-likas na pag-uulit sa Tagalog.
