  to: At nagsilang para kay Hadad ang kapatid ni Tahpenes ng isang anak na lalaki, si Genubat[a]. Inawat ni Tahpenes si Genubat sa pagsuso sa loob ng sambahayan ng Paraon[b], at si Genubat ay nasa sambahayan ng Paraon kasama ng mga anak na lalaki ng Paraon.
