  naturalness: Natural at marangal ang “inawat ... sa pagsuso” at “sambahayan ng Paraon.” Mas malinaw at likas ang pagtukoy kay Hadad sa unang pangungusap kaysa sa posibleng malabong “anak niyang.”
  terminology: Ang “Genubat,” “Tahpenes,” “Paraon,” at “sambahayan” ay angkop. Napananatili ng “mga anak na lalaki ng Paraon” ang panlalaking anyo ng בני.
