translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “musmos pa noon” upang likas na ipahayag ang diin sa murang edad, at “patungong Ehipto” upang maiwasan ang di-likas na literal na kayarian.
