base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: tl
  text: Tumakas si Hadad patungong Ehipto[a], kasama niya ang ilang lalaking Edomita na mula sa mga lingkod ng kanyang ama; at napakabata pa si Hadad noon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “upang makarating sa Ehipto.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, “isang batang lalaki” o “isang munting bata.” Idinidiin ng Hebreong parirala na napakabata pa ni Hadad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: Tumakas
  rationale: Ang Qal ng ברח ay nangangahulugang tumakas o lumayo upang maligtas; natural at tuwiran ang “tumakas” sa konteksto.
- source_word: אֲדַד
  choice: Hadad
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: si Hadad ... kasama ang ilang lalaking Edomita
  rationale: Ipinapakita ng Hebreo na si Hadad at ang mga Edomiteng lalaki ang tumakas. Ginagawang natural ng “kasama” ang appositional na kayarian nang hindi binabago ang mga kalahok.
- source_word: מֵעַבְדֵי אָבִיו
  choice: mula sa mga lingkod ng kanyang ama
  rationale: Pinananatili ng “mula sa” ang partitive na puwersa ng מִן, at ang “mga lingkod” ang payak na katumbas ng עֲבָדִים sa kontekstong ito.
- source_word: אִתּוֹ
  choice: kasama
  rationale: Likas na Filipino para sa ideyang ang mga lalaki ay sumama kay Hadad.
- source_word: לָבוֹא מִצְרָיִם
  choice: patungong Ehipto
  rationale: Literal na may pandiwang “pumaroon/dumating,” ngunit pagkatapos ng “tumakas” ay malinaw at natural sa Filipino ang pagpapahayag ng patutunguhan sa “patungong Ehipto.”
- source_word: נַעַר קָטָן
  choice: musmos pa noon
  rationale: Ang tambalang parirala ay nagdiriin na napakabata pa ni Hadad. Ang “musmos pa” ay natural na Filipino at hindi nagpapahiwatig lamang ng maliit na pangangatawan.
