  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: tl
  text: Ngunit kukunin ko ang kaharian mula sa kamay ng kanyang anak[a] at ibibigay ko ito sa iyo—ang sampung lipi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kamay ng kanyang anak,” isang idyoma na nangangahulugang aalisin ang kaharian sa kapangyarihan o pamamahala ng kanyang anak.
    reason: cultural_note
  - marker: b
    text: Sa literal, “at ibibigay ko ito sa iyo, ang sampung lipi.” Nililinaw ng huling parirala na ang kahariang ibibigay ay binubuo ng sampung lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Ngunit kukunin ko
  rationale: Ang Qal perfect na may pang-ugnay ay tumutukoy rito sa tiyak na gagawin sa hinaharap. Ginamit ang “Ngunit” upang ipakita ang pagsalungat sa naunang pahayag sa konteksto.
- source_word: הַמְּלוּכָה
  choice: ang kaharian
  rationale: Tumutukoy ito sa sakop ng paghahari na aalisin sa angkan ni Solomon; natural at malinaw sa modernong Filipino ang “kaharian.”
- source_word: מִיַּד בְּנוֹ
  choice: mula sa kamay ng kanyang anak
  rationale: Pinanatili ang larawang Hebreo ng kamay bilang sagisag ng kapangyarihan o pamamahala. Ipinaliliwanag sa talababa ang idyoma upang hindi mapagkamalang literal lamang.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: at ibibigay ko ito sa iyo
  rationale: Ang pambabaeng hulapi ay tumutukoy pabalik sa “kaharian.” Tahasang inulit ang “ko” para sa malinaw at natural na Filipino.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: —ang sampung lipi
  rationale: Ang parirala ay nasa aposisyon at nililinaw kung ano ang ibibigay. Ginamit ang gatlang upang maging natural sa Filipino at maiwasang ipahiwatig na isang hiwalay na bagay ang sampung lipi.
