base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: tl
  text: Ngunit[a] hindi ko ito gagawin sa panahon mo, alang-alang kay David na iyong ama; pupunitin ko ito mula sa kamay ng iyong anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ng “ito” ay ang pagpunit sa kahariang ipinahayag sa naunang talata.
    reason: cross_reference
  - marker: b
    text: Sa Hebreo, “mula sa kamay ng iyong anak.” Ang “kamay” ay idyomang tumutukoy rito sa kanyang kapangyarihan o paghawak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapahayag ito rito ng pasalungat at naglilimita sa naunang hatol; natural at malinaw ang “Ngunit” sa makabagong Tagalog.
- source_word: בְּיָמֶיךָ
  choice: sa panahon mo
  rationale: Tumutukoy ang literal na “sa iyong mga araw” sa panahon ng buhay at paghahari ni Solomon; pinananatili ng “sa panahon mo” ang kahulugan sa mas natural na Tagalog.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: hindi ko ito gagawin
  rationale: Ang pambabaeng hulaping panghalip ay tumutukoy pabalik sa naipahayag nang gagawin sa kaharian; hindi tahasang dinaragdagan ang bagay na ipinahihiwatig lamang sa konteksto.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: alang-alang kay David na iyong ama
  rationale: Ipinahahayag ng לְמַעַן ang pagsasaalang-alang o motibo; ang “alang-alang kay” ay likas na Tagalog at hindi ito pinapaliit tungo sa payak na sanhi lamang.
- source_word: מִיַּד
  choice: sa kamay ng
  rationale: Pinananatili ang matingkad na idyomang Hebreo na tumutukoy sa kapangyarihan o pag-aari ng isang tao.
- source_word: בִּנְךָ
  choice: iyong anak
  rationale: Tuwirang katumbas ng katawagang pampamilya sa Hebreo.
- source_word: אֶקְרָעֶנָּה
  choice: ko ito aagawin
  rationale: Ang קָרַע ay literal na “punitin”; sa konteksto ng pag-aalis ng kaharian, natural na ipinahahayag ng “aagawin” ang marahas na paghihiwalay at pagkuha, habang ipinaliliwanag sa talababa ang mas literal na larawan.
theological_decisions:
- issue: Ang ipinagpalibang hatol kay Solomon
  choice: Hindi isasagawa ang naipahayag na pag-aalis ng kaharian sa panahon ni Solomon, kundi kukunin ito mula sa kapangyarihan ng kanyang anak.
  alternative: 'Maaaring gawing tahasan ang ipinahihiwatig na bagay: “hindi ko aagawin ang kaharian sa panahon mo ... sa kamay ng iyong anak ko ito aagawin.”'
  rationale: Hindi inuulit ng Hebreo ang “kaharian” kundi umaasa sa naunang konteksto. Pinananatili ng salin ang ugnayang iyon at ang motibong alang-alang kay David nang hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iyong” sa halip na mas kolokyal na “mong” upang mapanatili ang dignidad ng salaysay; iniwasan ang sobrang literal na “sa iyong mga araw” at “pupunitin” sa pangunahing teksto dahil hindi likas ang mga ito sa ganitong gamit sa kasalukuyang Tagalog.
