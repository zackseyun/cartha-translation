  naturalness: Malinaw at modernong Tagalog ang diyalogo. Mas natural at mas malapit sa ugnayang ipinahihiwatig ng Hebreo ang “sa piling ko,” at ang “pakiusap, payagan mo akong umalis” ay isang magalang na paraan upang maipahayag ang mariing pakiusap.
  terminology: Ang “Paraon” at “lupain” ay angkop. Walang isyung teolohikal o pangalang pantangi sa talata.
