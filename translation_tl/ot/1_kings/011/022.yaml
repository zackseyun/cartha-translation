revisions:
- from: Sinabi sa kanya ng Paraon, “Ngunit ano ba ang kulang sa iyo habang kasama kita, at nais mong pumunta sa sarili mong lupain?” Sumagot siya, “Wala, ngunit hayaan mo akong umalis.”[a]
  to: Sinabi sa kanya ng Paraon, “Ngunit ano ba ang kulang sa iyo sa piling ko, at naghahangad kang pumunta sa lupain mo?” Sumagot siya, “Wala, ngunit pakiusap, payagan mo akong umalis.”[a]
  rationale: Pinalitan ang panahong “habang kasama kita” ng relasyonal na “sa piling ko,” pinanatili ang hindi-interpretibong “pumunta,” at inayos ang talababa upang wastong maipaliwanag ang mariing Hebreong infinitive-absolute construction. Ang “pakiusap, payagan mo akong umalis” ay natural na Tagalog at nagpapahayag ng kahilingan na siya ay palayain upang umalis.
