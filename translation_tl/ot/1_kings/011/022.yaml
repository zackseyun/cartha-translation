translation_notes:
  register: Modernong Filipino Tagalog na magalang, malinaw, at may dignidad. Iniwasan ang labis na literal na “narito” para sa הִנֵּה at ang interpretibong “bumalik,” habang pinanatili sa talababa ang natatanging mariing konstruksiyon ng Hebreo.
