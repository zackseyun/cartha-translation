base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: tl
  text: Sinabi sa kanya ng Paraon, “Ngunit ano ba ang kulang sa iyo sa piling ko, at naghahangad kang pumunta sa lupain mo?” Sumagot siya, “Wala, ngunit pakiusap, payagan mo akong umalis.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na “tiyak na paaalisin mo ako.” Mariing pagkakabuo ito: isang infinitive absolute ang sinusundan ng anyong pandiwa upang idiin ang pakiusap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ngunit
  rationale: Sa tanong ng Paraon, ipinakikita ng כִּי ang bahagyang pagsalungat sa kahilingan ni Hadad na umalis; natural itong naipahahayag ng “ngunit.”
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: ano ba ang kulang sa iyo habang kasama kita
  rationale: Pinananatili nito ang diwa ng חָסֵר na pagkukulang o pangangailangan at ang ugnayang ipinahahayag ng עִמִּי, sa natural na modernong Tagalog.
- source_word: וְהִנְּךָ
  choice: at nais mong
  rationale: Ang הִנֵּה ay tumatawag ng pansin sa kasalukuyang kalagayan. Hindi ito isinalin nang mekanikal bilang “narito,” sapagkat sa tanong na ito ay mas natural na dalhin ang tungkulin nito sa pagkakabuo ng buong sugnay.
- source_word: מְבַקֵּשׁ
  choice: nais
  rationale: Dito ang בקש ay tumutukoy sa pagnanais o paghahangad na umalis; malinaw at natural ang “nais” sa Filipino.
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: pumunta sa sarili mong lupain
  rationale: Ang הלך ay “pumunta,” hindi tahasang “bumalik.” Ipinakikita ng “sarili mong” ang hulaping paari sa אַרְצֶךָ nang hindi nagdaragdag ng ideyang wala sa pandiwa.
- source_word: לֹא
  choice: Wala
  rationale: Elliptical ang לֹא bilang sagot sa tanong kung ano ang kulang sa kanya; natural na ipinahahayag ito sa Tagalog bilang “Wala.”
- source_word: כִּי
  choice: ngunit
  rationale: Sa sagot ni Hadad, inililipat ng כִּי ang diin mula sa “Wala” tungo sa tunay niyang pakiusap; ang “ngunit” angkop sa pagsalungat na ito.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: hayaan mo akong umalis
  rationale: Ang ugat na שלח ay may diwang paalisin o payagang umalis. Natural na pakiusap sa Tagalog ang “hayaan mo akong umalis,” samantalang ipinapaliwanag sa talababa ang mariing anyo ng Hebreo.
