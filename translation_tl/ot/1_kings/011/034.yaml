  to: Ngunit hindi ko kukunin sa kamay niya ang buong kaharian, sapagkat gagawin ko siyang pinuno sa buong buhay niya, alang-alang kay David na lingkod ko, na aking pinili, na tumupad sa aking mga utos at mga tuntunin.
  rationale: Pinalitan ang hindi suportadong panandang pagsalungat ng panandang sanhi at isinalin nang mas malapit ang pandiwang “gagawin ko siyang.” Pinanatili ang saklaw, rehistro, mga pangalan, at pagkakaiba ng “utos” at “tuntunin.”
