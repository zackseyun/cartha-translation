reference: 1 Kings 11:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: tl
  text: Si Jeroboam na anak ni Nebat, isang Efraimita[a] mula sa Zereda—ang pangalan ng kanyang ina ay Zerua, isang biyuda—ay lingkod ni Solomon, at nagtaas siya ng kamay laban sa hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Efratita”; ngunit dito, malamang na ang ibig sabihin ay “Efraimita.”
    reason: lexical_alternative
  - marker: b
    text: O “naghimagsik siya laban sa hari.” Sa Hebreo, “nagtaas siya ng kamay laban sa hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: isang Efraimita
  rationale: Sa konteksto ng Mga Hari, pinakamalamang na tumutukoy ito sa pagkabilang sa lipi ni Efraim. Pinananatili sa talababa ang posibleng pagbasa na “Efratita.”
- source_word: הַצְּרֵדָה
  choice: Zereda
  rationale: Isinalin bilang pangalang pantangi ayon sa karaniwang anyong Tagalog ng transliterasyon.
- source_word: צְרוּעָה
  choice: Zerua
  rationale: Pinanatili bilang transliteradong personal na pangalan.
- source_word: אִשָּׁה אַלְמָנָה
  choice: isang biyuda
  rationale: Ang likas na Tagalog na “isang biyuda” ay sapat na naghahayag na siya ay isang babaeng balo; ang literal na pag-uulit ng “babae” ay magiging mabigat at hindi natural.
- source_word: עֶבֶד
  choice: lingkod
  rationale: Malawak ang saklaw ng salita at maaaring mangahulugang alipin o lingkod. Sa kontekstong maharlikang-administratibo, “lingkod” ang natural na salin nang hindi higit na tinutukoy ang legal na katayuan kaysa sa sinasabi ng talata.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: nagtaas siya ng kamay laban sa hari
  rationale: Pinananatili ang Hebreong metapora ng mapanghimagsik o palaban na pagkilos, sa halip na tahasang gawing “naghimagsik.”
- source_word: וְ
  choice: Si
  rationale: Hindi ginawang hiwalay na “at” o “ngayon” ang pambungad na waw sapagkat mas natural sa Tagalog na simulan ang bagong paksa sa “Si,” habang naihahatid ng daloy ng salaysay ang ugnayan nito sa naunang konteksto.
theological_decisions:
- issue: Lakas ng idyomang “nagtaas ng kamay laban sa hari”
  choice: Pinanatili ang metapora sa pangunahing teksto.
  alternative: “Naghimagsik siya laban sa hari.”
  rationale: Maaaring magpahiwatig ng paghihimagsik ang idyoma, ngunit ang tahasang “naghimagsik” ay nagpapaliwanag nang higit sa literal na anyo. Inilagay ang interpretibong alternatibo sa talababa upang mapanatili ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “biyuda” sa halip na literal na “babaeng biyuda” dahil likas na kasama na sa salita ang kasarian. Inilagay ang mga talababa sa mismong bahaging nililinaw ng mga ito.
