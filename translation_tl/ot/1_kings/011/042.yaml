translation:
  language: tl
  text: At ang panahon ng paghahari ni Solomon sa Jerusalem bilang hari ng buong Israel ay apatnapung taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים
  choice: At ang panahon
  rationale: Pinananatili ng “At” ang ugnayang pasalaysay ng וְ, habang ang idyomang הַיָּמִים ay likas na isinasalin bilang “ang panahon” kapag tumutukoy sa tagal ng paghahari.
- source_word: אֲשֶׁר מָלַךְ שְׁלֹמֹה
  choice: ng paghahari ni Solomon
  rationale: Natural sa makabagong Tagalog ang pariralang pangngalan na ito at tumpak nitong ipinahahayag ang panahong naghari si Solomon.
- source_word: בִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Ang בְּ ay lokatibo rito; “sa Jerusalem” ang karaniwang katumbas sa Tagalog.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Sa konteksto ng paghahari, ipinahahayag ng “sa buong Israel” ang saklaw ng kapangyarihan ni Solomon at pinananatili ang kolektibong pambansang pagtukoy.
- source_word: אַרְבָּעִים שָׁנָה
  choice: apatnapung taon
  rationale: Tuwirang salin ng bilang at yunit ng panahon.
