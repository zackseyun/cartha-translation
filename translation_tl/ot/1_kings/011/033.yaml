id: 1KI.11.33
reference: 1 Kings 11:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: tl
  text: sapagkat tinalikuran nila ako at yumukod sila kay Astoret[a], ang diyos ng mga Sidonio, kay Kemos, ang diyos ng Moab, at kay Milcom[b], ang diyos ng mga Ammonita, at hindi sila lumakad sa aking mga daan upang gawin ang matuwid sa aking paningin at sundin ang aking mga tuntunin at mga hatol, gaya ni David, na kanyang ninuno.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang diyosa ng mga Sidonio.” Literal na “ang diyos ng mga Sidonio” ang pariralang Hebreo, bagaman diyosa si Astoret.
    reason: lexical_alternative
  - marker: b
    text: Milcom ang mababasa sa tekstong Hebreo rito; iniuugnay ito ng ilan kay Molec.
    reason: alternative_reading
  - marker: c
    text: Ang “kanyang ninuno” ay tumutukoy kay David bilang ninuno sa dinastiya, hindi bilang agarang biyolohikal na ama.
    reason: cultural_note
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: sapagkat
  rationale: Likas at marangal na panandang sanhi sa Filipino; ipinakikita nitong ang sumusunod ang dahilan ng paghahati sa kaharian.
- source_word: עֲזָבוּנִי
  choice: tinalikuran nila ako
  rationale: Ipinahahayag ang mabigat na diwa ng pagtatakwil o pagtalikod sa tipan, hindi lamang pisikal na pag-alis.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: yumukod sila
  rationale: Pinananatili ang konkretong kilos ng pagpapatirapa o pagyukod bilang pagsamba.
- source_word: לְעַשְׁתֹּרֶת
  choice: kay Astoret
  rationale: Transliterasyon sa anyong madaling basahin at bigkasin sa Filipino.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: ang diyos ng mga Sidonio
  rationale: Sinusunod ang literal na anyo ng Hebreo na gumagamit ng karaniwang katawagang 'diyos,' habang inilalagay sa talababa ang usapin tungkol sa babaeng diyosang si Astoret.
- source_word: לִכְמוֹשׁ
  choice: kay Kemos
  rationale: Malinaw na transliterasyon ng pangalang Hebreo sa ortograpiyang Filipino.
- source_word: וּלְמִלְכֹּם
  choice: at kay Milcom
  rationale: Pinananatili ang pagbasa ng tekstong Masoretiko; ang posibleng kaugnayan kay Molec ay inilagay sa talababa.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: Hindi sila lumakad sa aking mga daan
  rationale: Pinananatili ang mahalagang metaporang Hebreo ng pamumuhay ayon sa kalooban ng Diyos, na nauunawaan pa rin sa Filipino.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: upang gawin ang matuwid sa aking paningin at sundin ang aking mga tuntunin at mga hatol
  rationale: Ang 'upang gawin' ay tumutugma sa pawatas, samantalang ang idinagdag na 'sundin' ay natural na Filipino para sa mga tuntunin at hatol at hindi nagbabago sa saklaw ng iisang pandiwang Hebreo.
- source_word: כְדָוִד אָבִיו
  choice: gaya ng ginawa ni David na kanyang ninuno
  rationale: Nililinaw sa natural na Filipino na si David ay dinastikong ninuno ng tinutukoy, hindi agarang biyolohikal na ama.
theological_decisions:
- issue: Kasarian ng katawagang אֱלֹהֵי kaugnay ni Astoret
  choice: ang diyos ng mga Sidonio
  alternative: ang diyosa ng mga Sidonio
  rationale: Pinananatili sa pangunahing teksto ang literal na anyo ng Hebreo at ipinababatid sa talababa ang historikal na kasarian ng diyos na ito, sa halip na tahimik na iwasto ang anyo ng pinagmulan.
- issue: Pagkakakilanlan ng מִלְכֹּם
  choice: Milcom
  alternative: Molec
  rationale: Milcom ang pagbasa ng tekstong Hebreo sa talatang ito; hindi dapat ipalit sa pangunahing teksto ang tradisyonal na pag-uugnay nito kay Molec.
- issue: Kahulugan ng אָבִיו para kay David
  choice: kanyang ninuno
  alternative: kanyang ama
  rationale: Sa kontekstong dinastiko, tumutukoy ang 'ama' sa ninuno; ang 'ninuno' ay pumipigil sa maling pagkaunawang si David ang agarang biyolohikal na ama ng tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na metaporang “lumakad sa aking mga daan,” ngunit ginamit ang likas na pandiwang “sundin” para sa mga tuntunin at hatol. Ang mga pangalang Astoret, Kemos, at Milcom ay isina-Filipino ang baybay nang hindi binabago ang pagkakakilanlan.
