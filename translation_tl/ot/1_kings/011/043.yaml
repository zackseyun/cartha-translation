base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Solomon kasama ng kanyang mga ninuno[a], at inilibing siya sa Lungsod ni David, na kanyang ama. Ang anak niyang si Rehoboam ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nahiga o natulog kasama ng kanyang mga ninuno,” isang nakaugaliang pahayag para sa pagkamatay at pagsama sa mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: nahimlay ... kasama ng kanyang mga ninuno
  rationale: Ang parirala ay nakaugaliang pormula para sa pagkamatay at pagsama sa mga ninuno. Pinananatili ng “nahimlay” ang banayad at matalinghagang diwa ng Hebreo nang hindi nagiging kasing-tahas ng “namatay” o kasing-literal at di-likas ng “natulog.”
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Likas na salin sa Filipino ng pasibong anyo at malinaw na ipinapahayag ang paglilibing kay Solomon.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: sa Lungsod ng kanyang amang si David
  rationale: Malinaw na tinutukoy ang pook bilang Lungsod ni David at pinananatili ang pagkakakilanlan kay David bilang ama ni Solomon at ang dinastikong diin ng teksto.
- source_word: וַיִּמְלֹךְ רְחַבְעָם בְּנוֹ תַּחְתָּיו
  choice: Ang anak niyang si Rehoboam ang naghari bilang kahalili niya
  rationale: Ang “naghari” ay angkop sa pormula ng paghahalili sa trono, at ang “bilang kahalili niya” ay malinaw na nagpapahayag ng diwa ng תַּחְתָּיו, ‘sa kanyang lugar.’
