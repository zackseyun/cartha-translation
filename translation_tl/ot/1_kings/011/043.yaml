translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang panghari at ang matalinghagang pahayag tungkol sa kamatayan, habang inayos ang ayos ng mga salita upang maging natural at malinaw sa Tagalog.
