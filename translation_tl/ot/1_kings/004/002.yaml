  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: tl
  text: 'At ito ang mga pinuno[a] niya: si Azarias na anak ni Sadoc, ang pari[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga prinsipe” o “mga opisyal.” Ang salitang Hebreo ay maaaring tumukoy sa matataas na pinuno o tagapangasiwa.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “si Azarias na anak ni Sadoc, ang pari.” Nauunawaan ng ilan na si Sadoc ang tinutukoy na pari; para naman sa iba, titulo ito ni Azarias. Hindi tahasang sinasabi ng teksto na “punong pari.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang ugnayan sa naunang salaysay, samantalang likas na ipinakikilala ng “ito ang” ang kasunod na talaan.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Sa kontekstong ito, tumutukoy ang שׂרים sa matataas na pinuno o opisyal ng pamahalaan. Ang “mga pinuno” ay malinaw at marangal, ngunit inilalahad sa talababa ang iba pang posibleng kahulugan.
- source_word: אֲשֶׁר לוֹ
  choice: na naglingkod sa kanya
  rationale: Ipinahihiwatig ng pariralang Hebreo ang kaugnayan ng mga pinunong ito kay Solomon at sa kanyang pamamahala. Mas natural sa modernong Tagalog ang “na naglingkod sa kanya” kaysa sa literal na “na kanya,” bagaman bahagya nitong nililinaw ang ugnayang ipinapahiwatig.
- source_word: עֲזַרְיָהוּ
  choice: Azarias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: בֶן צָדוֹק
  choice: anak ni Sadoc
  rationale: Tuwirang salin ng karaniwang konstruksiyong nagsasaad ng pagkakilala sa ama; ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Literal itong “ang pari.” Hindi ito pinalawak bilang “punong pari,” sapagkat walang katumbas na salitang “puno” sa tekstong Hebreo.
theological_decisions:
- issue: Kung kanino tumutukoy ang “ang pari” at kung ito ba ay titulong “punong pari”
  choice: Panatilihin ang “si Azarias na anak ni Sadoc, ang pari,” at ilahad ang kalabuan sa talababa.
  alternative: “Si Azarias na anak ng paring si Sadoc” o “si Azarias na anak ni Sadoc, ang punong pari”
  rationale: Maaaring iugnay ng balarila ang “ang pari” kay Azarias o kay Sadoc. Hindi rin tahasang sinasabi ng Hebreo na “punong pari,” kaya hindi dapat lutasin sa pangunahing teksto ang tunay na kalabuan o dagdagan ang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “naglingkod sa kanya” upang maging malinaw sa karaniwang mambabasa ang administratibong kaugnayan, at pinanatili sa talababa ang mga leksikal at sintaktikong kalabuan. Ang mga pangalang Azarias at Sadoc ay nasa nakaugaliang anyong Tagalog.
