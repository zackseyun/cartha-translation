- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang konstruksiyon para sa tuwirang ugnayang ama at anak; mas natural sa Filipino kaysa sa literal na “anak na lalaki ni.”
- source_word: עִדֹּא
  choice: Ido
  rationale: Pangalang pantangi; tinumbasan ayon sa payak na transliterasyong Filipino.
- source_word: מַחֲנָיְמָה
  choice: sa Mahanaim
