  text: 'At ito ang kanilang mga pangalan: Ben-Hur[a], sa kaburulan ng Efraim;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anak ni Hur,” kung patronimiko ito sa halip na pangalang pantangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito
  rationale: Pinananatili ng “At” ang payak na pang-ugnay, at natural na ipinakikilala ng “ito” ang kasunod na talaan.
- source_word: שְׁמוֹתָם
  choice: ang kanilang mga pangalan
  rationale: Walang tahasang pandiwa sa Hebreo. Natural sa Tagalog ang sugnay na “At ito ang kanilang mga pangalan” at hindi na kailangang magdagdag ng panandang pangnagdaan.
- source_word: בֶּן חוּר
  choice: Ben-Hur
  rationale: Itinuturing itong pangalang pantangi sa talaan ng mga opisyal, ngunit pinananatili sa talababa ang tunay na posibilidad na patronimiko ito.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Sa ganitong panrehiyong gamit, ang הַר ay tumutukoy sa maburol o mataas na lupain, hindi kinakailangang sa iisang bundok.
