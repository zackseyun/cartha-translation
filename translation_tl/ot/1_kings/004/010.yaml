  text: Ben-hesed[a], in Arubboth; Socoh and all the land of Hepher belonged to him.
translation:
  language: tl
  text: Si Ben-hesed[a] sa Arubot; sakop niya ang Socoh at ang buong lupain ng Hefer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na paraan, “ang anak ni Hesed sa Arubot; sakop niya ang Socoh at ang buong lupain ng Hefer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Ben-hesed
  rationale: Sa talaan ng mga opisyal, ang parirala ay ginagamit bilang pantanging pangalan. Pinananatili ng transliterasyon ang posibleng onomastikong gamit nito, habang inilalahad sa talababa ang mas pormal na pagbasa.
- source_word: בָּאֲרֻבּוֹת
  choice: sa Arubot
  rationale: Lokativo ang unlaping בְּ, kaya 'sa'; tinransliterasyon ang pangalan ng lugar sa paraang natural sa Filipino.
- source_word: לֹו
  choice: sakop niya
  rationale: Sa konteksto ng paghahating administratibo, ipinahihiwatig nito na ang mga binanggit na lugar ang teritoryong nakatalaga sa opisyal.
- source_word: שֹׂכֹה
  choice: Socoh
  rationale: Tinatanggap bilang pangalan ng lugar at pinananatili sa anyong transliterado.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: at ang buong lupain ng Hefer
  rationale: Ang אֶרֶץ ay tumutukoy rito sa lupain o teritoryo, at pinananatili ng 'buong' ang saklaw ng כָּל.
