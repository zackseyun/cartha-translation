translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Idinagdag ang “ang namamahala” upang maging ganap at natural ang eliptikong talaan ng mga opisyal sa konteksto. Pinanatili ang mga pangalang pantangi bilang transliterasyon at iniwasang gawing tiyak ang heograpiya kung hindi tiyak ang Hebreo.
