base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: tl
  text: Si Baana na anak ni Ahilud ang namamahala sa Taanac at Megido, at sa buong Bet-sean na nasa tabi ng Zaretan, sa ibaba ng Jezreel—mula sa Bet-sean hanggang Abel-mehola, hanggang sa ibayo ng Jokmeam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “hanggang sa rehiyong nasa ibayo ng Jokmeam.” Maikli at medyo mahirap unawain ang Hebreong pahayag tungkol sa hangganan, kaya posible rin ang mas malinaw na heograpikong salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Si Baana na anak ni Ahilud
  rationale: Isinatinig ang mga pangalang pantangi at ginamit ang likas na pariralang Filipino para sa kaugnayang ama-anak.
- source_word: תַּעְנַ֖ךְ וּמְגִדּוֹ
  choice: Taanac at Megido
  rationale: Isinatinig ang mga pangalan ng lugar sa paraang malinaw at madaling bigkasin sa Filipino.
- source_word: וְכָל בֵּית שְׁאָן
  choice: sa buong Bet-sean
  rationale: Ipinahihiwatig ng כָל kasama ng pangalan ng lugar ang buong lokalidad o nasasakupang rehiyon, kaya pinanatili ang saklaw sa “buong.”
- source_word: אֲשֶׁר אֵצֶל צָרְתַנָה
  choice: na nasa tabi ng Zaretan
  rationale: Ang אֵצֶל ay nagsasaad ng pagiging katabi o malapit; pinili ang “nasa tabi” nang hindi tiyakang itinatakda ang layo.
- source_word: מִתַּחַת לְיִזְרְעֶאל
  choice: sa ibaba ng Jezreel
  rationale: Pinananatili nito ang topograpikong diwa ng mas mababang kinalalagyan at hindi ito binibigyang-kahulugang “timog ng.”
- source_word: מִבֵּית שְׁאָן עַד אָבֵל מְחוֹלָה
  choice: mula sa Bet-sean hanggang Abel-mehola
  rationale: Likas na pormang Filipino ito para ipahayag ang hangganan o lawak ng distrito.
- source_word: עַד מֵעֵבֶר לְיָקְמֳעָם
  choice: at hanggang sa kabilang ibayo ng Jokmeam
  rationale: Pinananatili ang diwa ng מֵעֵבֶר bilang nasa kabilang panig o ibayo, habang kinikilalang maikli at mahirap ang Hebreong pahayag ng hangganan.
