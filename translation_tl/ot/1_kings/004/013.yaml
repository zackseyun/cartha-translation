base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: tl
  text: 'Si Ben-geber, sa Ramot-gilead; sakop niya ang mga nayon ni Jair[a] na nasa Gilead, at sakop din niya ang rehiyon ng Argob[b] na nasa Bashan: animnapung malalaking lunsod na may mga pader at mga halang na tanso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamayanang tolda ni Jair”; maaari ring tumbasan ayon sa tunog na “Havvoth-jair.”
    reason: lexical_alternative
  - marker: b
    text: O “distrito ng Argob,” o “teritoryo ng Argob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: Ben-geber
  rationale: Pinanatili bilang pangalang pantangi, gaya ng gamit nito para sa opisyal sa talaan; ang pagbasa na “anak ni Geber” ay posible ngunit hindi gaanong malamang sa kontekstong ito.
- source_word: בְּרָמֹת גִּלְעָד
  choice: sa Ramot-gilead
  rationale: Lokasyonal ang בְּ; ginamit ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: לֹו
  choice: sakop niya
  rationale: Sa konteksto ng administratibong talaan, ipinahihiwatig ng parirala ang nasasakupan o nakatalagang hurisdiksiyon, hindi lamang personal na pag-aari.
- source_word: חַוֹּת יָאִיר
  choice: mga nayon ni Jair
  rationale: Malinaw at natural itong katumbas para sa mga pamayanan ni Jair, habang inilalahad sa talababa ang mas literal at transliteradong mga alternatibo.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: na nasa Gilead
  rationale: Tuwirang inilalarawan ng sugnay ang kinaroroonan ng mga nayon.
- source_word: חֶבֶל אַרְגֹּב
  choice: nasasakupan ng Argob
  rationale: Ang חֶבֶל ay maaaring tumukoy sa rehiyon, distrito, o teritoryong may hangganan; ang “nasasakupan” ay angkop sa administratibong konteksto.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: na nasa Bashan
  rationale: Natural at tuwirang lokasyonal na paglalarawan.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: animnapung malalaking lunsod
  rationale: Ipinahahayag ng גְּדֹלוֹת ang laki o kahalagahan; “malalaking” ang kongkretong modernong salin.
- source_word: חוֹמָה
  choice: may mga pader
  rationale: Kolektibong inilalarawan ang mga tanggulang nakapaligid sa animnapung lunsod, kaya natural ang maramihang anyo sa Filipino.
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: at mga halang na tanso
  rationale: Ang בְּרִיחַ ay halang o trangka na pansara, hindi mismong pintuang-bayan; pinananatili ng salin ang konkretong larawan ng depensa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sakop niya” upang maging natural sa administratibong konteksto habang pinananatili ang pag-uulit ng לֹו. Ang mga pangalang heograpiko ay isina-Filipino ang baybay nang hindi isinasalin.
