  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: tl
  text: Si Benaias na anak ni Joiada ang namamahala sa hukbo, at sina Zadok at Abiatar ay mga pari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga punong ministro” o “mga pangunahing opisyal,” kung ang salitang Hebreo para sa “mga pari” ay ginagamit dito sa mas malawak na diwang administratibo sa palasyo.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: ang namamahala sa hukbo
  rationale: Ang עַל kasunod ng saklaw ng tungkulin ay nagpapahayag ng pamamahala o pangangasiwa. Likas ito sa modernong Tagalog at hindi nagdaragdag ng tiyak na titulong militar na wala sa Hebreo.
- source_word: הַצָּבָא
  choice: hukbo
  rationale: Tumutukoy dito ang צָבָא sa organisadong puwersang militar; malinaw at karaniwang katumbas ang “hukbo.”
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Ang pangunahin at karaniwang kahulugan ng salita ay “mga pari.” Kilala rin sina Zadok at Abiatar bilang mga paring tauhan, kaya ito ang pinakamalapit sa ebidensiya ng teksto.
- source_word: בְנָיָהוּ
  choice: Benaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong Bibliyang Tagalog.
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong Bibliyang Tagalog.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Malinaw na transliterasyon ng pangalang Hebreo na pamilyar sa mga mambabasang Tagalog.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong Bibliyang Tagalog.
theological_decisions:
- issue: Kung ang כֹּהֲנִים ay dapat unawain sa di-kultikong kahulugang mga punong ministro o pangunahing opisyal dahil nasa talaan ito ng mga opisyal ng hari.
  choice: mga pari
  alternative: mga punong ministro; mga pangunahing opisyal
  rationale: “Mga pari” ang karaniwang kahulugan ng terminong Hebreo, at sa ibang mga teksto ay malinaw na mga pari sina Zadok at Abiatar. Hindi sapat ang kontekstong administratibo upang talikuran ang pangunahing kahulugan, ngunit pinananatili sa talababa ang mas malawak na posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “namamahala sa hukbo” sa halip na isang mas tiyak na titulong gaya ng “kumandante” upang mapanatili ang lawak ng Hebreong parirala. Inilagay ang talababa pagkatapos ng “mga pari,” ang salitang tinutukoy nito.
