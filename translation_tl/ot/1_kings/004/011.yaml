  text: Ben-abinadab, over all the height of Dor; Taphath the daughter of Solomon was his wife.
translation:
  language: tl
  text: Si Ben-Abinadab ang namamahala sa buong Nafat-Dor. Asawa niya si Tafat na anak ni Solomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: Ben-Abinadab
  rationale: Pinanatili bilang pangalang pantangi; bagaman literal na maaaring mangahulugang “anak ni Abinadab,” gumaganap ito rito bilang pantukoy sa opisyal, gaya ng ibang pangalang may Ben- sa talaan.
- source_word: כָּל נָפַת דֹּאר
  choice: sa buong Nafat-Dor
  rationale: Ang נָפָה ay bihira at maaaring tumukoy sa isang distrito o heograpikong pook. Pinanatili ang tambalang pangalan upang hindi piliting lutasin bilang karaniwang salitang “taas” o “rehiyon.”
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: Asawa niya
  rationale: Likas at tumpak na Filipino para sa Hebreong pormulang nagsasabing ang babae ay naging asawa niya.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “namamahala” upang ipakita ang tungkulin ng opisyal na ipinagpapatuloy mula sa naunang konteksto, at pinanatili ang Nafat-Dor bilang pangalang heograpiko dahil hindi tiyak ang eksaktong kahulugan ng נָפָה rito.
