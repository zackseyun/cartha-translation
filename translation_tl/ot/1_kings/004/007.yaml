translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “katiwala” para sa malawak na tungkuling administratibo at “sambahayan” para sa sambahayang maharlika. Hinati sa tatlong pangungusap upang maging malinaw ang takdang salit-salitang pagtustos nang hindi binabago ang diwa ng Hebreo.
