base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: tl
  text: May labindalawang tagapangasiwa si Solomon na may pananagutan sa buong Israel[a]. Tumutustos sila sa hari at sa kaniyang sambahayan. Bawat isa ay may pananagutang tumustos sa loob ng isang buwan bawat taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga opisyal,” “mga gobernador,” o “mga katiwala.” Malawak ang kahulugan ng salitang Hebreo at tumutukoy sa mga hinirang na tagapangasiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: May ... si Solomon
  rationale: Ang לְ ay nagpapahayag dito ng pagmamay-ari; likas sa modernong Tagalog ang hulma na “May ... si Solomon.”
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Tuwirang salin ng bilang.
- source_word: נִצָּבִים
  choice: mga katiwala
  rationale: Tumutukoy ang salita sa mga taong hinirang o inilagay sa tungkuling administratibo. Ang “katiwala” ay malinaw at hindi labis na nagpapahiwatig ng partikular na ranggong pampamahalaan.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: nakatalaga sa buong Israel
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng עַל ang saklaw ng kanilang pagkatalaga o pananagutan. Iniiwasan ng saling ito ang di-likas na “sa ibabaw ng buong Israel.”
- source_word: וְכִלְכְּלוּ
  choice: naglalaan ng kailangan
  rationale: Ang כלכל ay tumutukoy sa pagtustos o paglalaan ng ikabubuhay at iba pang pangangailangan; malinaw sa karaniwang mambabasa ang pariralang ito.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: ng hari at ng sambahayan nito
  rationale: Ang בַּיִת dito ay ang sambahayan o buong maharlikang establisimyento, hindi lamang ang gusali. Ang “nito” ay natural na tumutukoy sa hari sa pormal na salaysay.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: para sa isang buwan sa bawat taon
  rationale: Ipinapahayag nito ang taunang isang-buwang takdang paglilingkod ng bawat opisyal.
- source_word: יִהְיֶה עַל אֶחָד
  choice: Bawat isa ay may pananagutan
  rationale: Ang literal na ideyang “mapapasakaniya ang tungkulin” ay inihayag sa natural na Tagalog at pinanatili ang pamamahaging diwa.
- source_word: לְכַלְכֵּל
  choice: maglaan
  rationale: Pinananatili ang kaugnayan sa naunang anyo ng כלכל habang iniiwasan ang mabigat na pag-uulit ng buong parirala.
