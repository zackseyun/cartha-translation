  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: tl
  text: Si Ben-Deker[a], sa Makaz, sa Shaalbim, sa Bet-Semes, at sa Elon-Bet-Hanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang anak ni Deker”; pinanatili rito ang Hebreong anyo bilang personal na katawagang “Ben-Deker.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Ben-Deker
  rationale: Sa talaan ng mga opisyal, ang anyong Hebreo na בֶּן + pangalang pantangi ay maaaring gumana bilang personal na katawagan. Pinanatili ang anyong pangalan sa transliterasyon.
- source_word: בְּ/מָקַץ
  choice: sa Makaz
  rationale: Ang pang-ukol na בְ ay tuwirang locative rito; ang “sa” ay hindi nagdaragdag ng kahulugang administratibong “namamahala sa.”
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: sa Shaalbim
  rationale: Isinalin ang pang-ukol bilang “sa” at tinranslitera ang pangalan ng lugar.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: sa Bet-Semes
  rationale: Bagaman hindi inuulit ang pang-ukol sa Hebreo, nagpapatuloy ang locative na ayos ng talaan. Ang pangalan ng lugar ay tinranslitera, hindi isinalin.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: sa Elon-Bet-Hanan
  rationale: Itinuring itong tambalang pangalan ng lugar. Ang “sa” ay ipinagpatuloy mula sa naunang locative na serye upang maging natural sa Tagalog.
