lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Pangalan ng tao; isinalin sa anyong madaling basahin sa modernong Filipino habang pinananatili ang tunog ng Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na paraang Filipino upang ipahayag ang patronimikong Hebreong nangangahulugang “anak ni.”
- source_word: פָּרוּחַ
  choice: Parua
  rationale: Pangalan ng tao; tinumbasan ayon sa tunog ng Hebreo, at hindi isinama ang huling katinig na halos hindi binibigkas sa Filipino.
- source_word: בְּ/יִשָׂשכָר
  choice: sa Isacar
  rationale: Pinananatili ng “sa” ang lawak ng kahulugan ng pang-ukol na בְ (“sa/loob ng”) at natural na ipinahihiwatig sa talaang ito ang nasasakupang distrito nang hindi tahasang idinaragdag ang “namamahala.”
