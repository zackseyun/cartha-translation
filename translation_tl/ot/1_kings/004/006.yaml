translation:
  language: tl
  text: At si Ahisar ang namamahala sa sambahayan ng hari[a], at si Adoniram na anak ni Abda ang namamahala sa sapilitang paggawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namamahala sa palasyo” o “namamahala sa bahay.” Literal na “sa bahay” ang Hebreo; sa kontekstong ito, tumutukoy ito sa tungkulin ng pangangasiwa sa maharlikang sambahayan o palasyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “namamahala sa pataw na paglilingkod-paggawa.” Ang salitang Hebreo ay tumutukoy sa sapilitang paggawa para sa pamahalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: Si Ahisar
  rationale: Pangngalang pantangi na isinalin sa baybay na natural sa Filipino; ang pang-ugnay na waw ay ipinahayag sa daloy ng buong pangungusap.
- source_word: עַל הַבָּיִת
  choice: ang namamahala sa sambahayan ng hari
  rationale: Sa talaan ng mga opisyal, ang עַל ay nagpapahiwatig ng pamamahala o pangangasiwa. Literal na 'sa ibabaw ng bahay' ang parirala, ngunit dito ay titulo ito para sa pangangasiwa sa sambahayan o palasyo ng hari.
- source_word: וַאֲדֹנִירָם
  choice: at si Adoniram
  rationale: Pinanatili ang pangngalang pantangi sa anyong madaling basahin sa Filipino, at isinalin ang prefiks na pang-ugnay bilang 'at'.
- source_word: בֶּן עַבְדָּא
  choice: na anak ni Abda
  rationale: Likas na pormang Filipino para sa patronimikong pagkakakilanlan ng opisyal.
- source_word: עַל הַמַּס
  choice: ang namamahala sa sapilitang paggawa
  rationale: Sa kontekstong administratibo ng kaharian, ang מַס ay tumutukoy sa sapilitang paglilingkod-paggawa o labor levy, hindi lamang sa buwis. Malinaw at karaniwan sa modernong Filipino ang 'sapilitang paggawa'.
