  text: King Solomon was king over all Israel.
translation:
  language: tl
  text: Si Haring Solomon ay hari ng buong Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ang anyong ito ng היה na may waw ay nagsisilbing panimulang transisyon at nagdadala ng predikasyong ‘naging/ay.’ Sa likas na modernong Tagalog, hindi kailangang dagdagan ng tahasang ‘at nangyari’ o ‘ngayon’; ang ‘ay’ ang malinaw na nag-uugnay sa paksa at panaguri.
- source_word: הַמֶּלֶךְ
  choice: Haring
  rationale: 'Ang tiyak na pangngalan bago ang pangalang pantangi ay pamagat na kaagapay ng pangalan: ‘Haring Solomon.’ Ito ang natural na anyo sa Tagalog.'
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Filipino Bible usage.
- source_word: מֶלֶךְ
  choice: hari
  rationale: Ang ikalawang paglitaw ng מלך ay pangngalang panaguri. Pinananatili ng ‘hari’ ang pag-uulit ng salitang-ugat sa Hebreo, sa halip na gawing pandiwang ‘naghari.’
- source_word: עַל
  choice: sa
  rationale: Sa konteksto ng paghahari, ipinahihiwatig nito ang saklaw ng kapangyarihan. Mas natural sa Tagalog ang ‘hari sa buong Israel’ kaysa ‘hari ibabaw ng Israel.’
- source_word: כָּל
  choice: buong
  rationale: Natural na katumbas sa Tagalog ng kabuuang saklaw ng Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng bansa sa Filipino.
theological_decisions:
- issue: Pag-uulit ng מלך bilang pamagat at panaguri
  choice: 'Panatilihin ang dalawang paglitaw: ‘Haring Solomon ay hari.’'
  alternative: ‘Naghari si Solomon sa buong Israel.’
  rationale: Sinasalamin ng napiling salin ang sadyang pag-uulit sa Hebreo at ang diin sa kinikilalang katayuan ni Solomon bilang hari ng buong Israel, nang walang idinadagdag na interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang bahagyang retorikal na pag-uulit ng orihinal kahit mas karaniwang sabihin sa pang-araw-araw na wika ang ‘Naghari si Solomon.’
