  text: וַ/עֲזַרְיָ֥הוּ בֶן נָתָ֖ן עַל הַ/נִּצָּבִ֑ים וְ/זָב֧וּד בֶּן נָתָ֛ן כֹּהֵ֖ן רֵעֶ֥ה הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: tl
  text: Si Azaryahu na anak ni Natan ang namamahala sa mga gobernador; at si Zabud na anak ni Natan ay pari[a] at kaibigan ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “punong ministro” o “tagapayo ng hari” sa kontekstong ito ng palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Azaryahu
  rationale: Isinatinig ang pangalang Hebreo at pinanatili ang hulaping -yahu ng anyong nasa WLC.
- source_word: בֶן נָתָן
  choice: anak ni Natan
  rationale: Likas na salin sa Filipino ng ugnayang ipinapahayag ng Hebreong ben; isinatining din ang Natan ayon sa Hebreo.
- source_word: עַל הַנִּצָּבִים
  choice: ang namamahala sa mga gobernador
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng עַל ang pangangasiwa, at ang נִצָּבִים ay mga hinirang na opisyal na nangangasiwa sa mga nasasakupan.
- source_word: זָבוּד
  choice: Zabud
  rationale: Tuwirang pagsasatinig ng personal na pangalan.
- source_word: כֹּהֵן
  choice: pari
  rationale: Ito ang karaniwan at tuwirang kahulugan ng salitang Hebreo; inilagay sa talababa ang posibleng kahulugang opisyal ng palasyo.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: kaibigan ng hari
  rationale: Pinananatili ang payak na larawan ng Hebreo habang natural sa Filipino; maaari rin itong magpahiwatig ng isang malapit na pinagkakatiwalaan ng hari.
theological_decisions:
- issue: Kahulugan ng כֹּהֵן sa talaan ng mga opisyal ng hari
  choice: pari
  alternative: punong ministro o tagapayo ng hari
  rationale: Ang pangunahing leksikal na kahulugan ay “pari.” Gayunman, dahil nasa konteksto ito ng maharlikang pamamahala, maaaring tumukoy ang salita sa isang mataas na opisyal; pinanatili ang tunay na posibilidad na ito sa talababa sa halip na ipasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namamahala sa” sa halip na mas literal ngunit di-likas na “nasa ibabaw ng.” Inilipat ang tandang [a] sa “pari,” sapagkat ang talababa ay tumutukoy sa כֹּהֵן, hindi sa “mga gobernador.” Ginamit ang tuldok-kuwit upang luminaw ang dalawang magkaugnay na tala ng mga opisyal.
