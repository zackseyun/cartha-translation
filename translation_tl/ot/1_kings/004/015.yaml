base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: tl
  text: Si Ahimaas[a], sa Neftali; siya rin ay kumuha kay Basemat, ang anak na babae ni Solomon, bilang asawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na namamahala sa Neftali” o “para sa Neftali.” Maaaring tukuyin ng pang-ukol na Hebreo ang teritoryong iniatas kay Ahimaas sa talaang ito ng mga opisyal ng distrito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kumuha kay Basemat, ang anak na babae ni Solomon, bilang asawa,” isang karaniwang idyoma na nangangahulugang pinakasalan niya si Basemat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Ahimaas
  rationale: Pangngalang pantangi; tinumbasan sa anyong transliterasyong natural sa modernong Filipino, kung saan karaniwang ginagawang -as ang hulaping Hebreong -ats/-az.
- source_word: בְּנַפְתָּלִי
  choice: sa Neftali
  rationale: Ang בְ sa pangalan ng lipi o lupain ay tumutukoy sa distrito o teritoryong saklaw ng opisyal. Pinananatili ng “sa Neftali” ang di-tiyak na ugnayang lokatibo nang hindi labis na binibigyang-kahulugan.
- source_word: גַּם הוּא
  choice: siya rin
  rationale: Natural na Filipino na nagpapanatili sa dagdag na diin na kabilang din si Ahimaas sa binabanggit na kalagayan.
- source_word: לָקַח
  choice: kumuha
  rationale: Pinananatili ang literal na pandiwa ng Hebreo; kasama ng “bilang asawa,” malinaw itong karaniwang idyoma para sa pag-aasawa.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Transliterasyon ng pangngalang pantangi sa anyong nababagay sa bigkas at baybay ng Filipino.
- source_word: בַּת שְׁלֹמֹה
  choice: anak ni Solomon
  rationale: Tuwirang ipinapahayag ang ugnayang pampamilya. Hindi tinutukoy ng anyong Hebreo ang kasarian sa salitang Filipino na “anak,” ngunit malinaw ito sa konteksto ng pagkuha sa kaniya bilang asawa.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Natural na katumbas sa Filipino ng Hebreong idyoma para sa pag-aasawa at wastong katuwang ng pandiwang “kumuha.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan at ang literal na idyomang “kumuha ... bilang asawa,” habang ipinaliliwanag sa talababa ang kahulugan nito. Ginamit ang “sa Neftali” upang mapanatili ang posibleng lokatibo o administratibong diwa ng בְ.
