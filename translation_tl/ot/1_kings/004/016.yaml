  text: Baana son of Hushai[a], in Asher and Bealoth.
translation:
  language: tl
  text: Si Baana na anak ni Hushai, sa Asher at Bealot[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “at Alot.” Hindi tiyak sa tradisyon ng pagsasalin ang huling pangalan ng lugar at ang heograpikong pagkakakilanlan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: Baana
  rationale: Pangalang pantangi; tinumbasan sa paraang transliterasyon at pinanatili ang karaniwang anyong biblikal.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na katumbas sa modernong Filipino ng ugnayang filyal na ipinahahayag ng konstruktong Hebreo.
- source_word: חוּשָׁי
  choice: Hushai
  rationale: Pangalang pantangi; ginamit ang kinikilalang transliterasyong biblikal.
- source_word: בְּ/אָשֵׁר
  choice: sa Asher
  rationale: Pinananatili ng “sa” ang karaniwang diwa ng pang-ukol na בְּ at ipinahihiwatig sa konteksto ang teritoryong saklaw ng opisyal nang hindi tahasang idinaragdag ang interpretasyong “namamahala sa.”
- source_word: וּ/בְעָלֽוֹת
  choice: at Bealot
  rationale: Itinuring ang anyo bilang pangalang-lugar at pinanatili ang maikling estilo ng talaan; hindi inulit ang “sa” sapagkat walang ikalawang pang-ukol sa Hebreo. Ang alternatibong pagbasa na “Alot” ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino, na angkop sa estilong talaan ng mga opisyal. Ginamit ang “anak ni” at “sa” para sa malinaw na ordinaryong pagbasa habang pinananatili ang maigsi at bahagyang ambiguwong anyo ng Hebreo.
