  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “Sina … ang” upang malinaw na maipakita ang talaan ng mga opisyal. Pinanatiling magkaiba ang dalawang tungkulin sa korte sa pamamagitan ng “mga kalihim” at “tagapagtala.”
