  text: אֱלִיחֹ֧רֶף וַ/אֲחִיָּ֛ה בְּנֵ֥י שִׁישָׁ֖א סֹפְרִ֑ים יְהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד הַ/מַּזְכִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: tl
  text: Sina Elihoref at Ahias, na mga anak ni Sisa[a], ang mga kalihim[b]; si Jehosafat na anak ni Ahilud ang tagapagtala[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Sisa.” Sa kaugnay na tala sa 2 Samuel 8:17, makikita ang isang kaugnay na anyo ng pangalan na madalas isaling “Savsa.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga eskriba”; ang salitang Hebreo ay tumutukoy rito sa mga opisyal ng hari na nangangasiwa sa pagsusulat at mga dokumento.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tagapag-ingat ng mga tala” o “tagapagpaalaala”; tumutukoy ito sa opisyal ng korte na nag-iingat ng mga rekord at naghaharap ng mga usapin sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Elihoref
  rationale: Pangngalang pantangi; isinalin sa baybay na angkop at madaling bigkasin sa Filipino habang malapit sa anyong Hebreo.
- source_word: וַאֲחִיָּה
  choice: at Ahias
  rationale: Pangngalang pantangi na may pangatnig; ginamit ang karaniwang anyong Filipino na “Ahias.”
- source_word: בְּנֵי שִׁישָׁא
  choice: mga anak ni Sisa
  rationale: Tuwirang ipinahahayag ang ugnayang pampamilya sa pariralang Hebreo. Sinunod sa pangunahing teksto ang pangalang nasa talatang ito; inilagay sa talababa ang kaugnay na anyo sa 2 Samuel 8:17.
- source_word: סֹפְרִים
  choice: mga kalihim
  rationale: Sa talaan ng mga opisyal ng hari, tumutukoy ito sa mga tagapangasiwa ng pagsusulat at mga dokumento. Mas natural sa modernong Filipino ang “mga kalihim” kaysa “mga eskriba,” at naihihiwalay nito ang tungkulin sa הַמַּזְכִּיר.
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Pangngalang pantangi; ginamit ang malinaw na transliterasyong angkop sa Filipino.
- source_word: בֶּן אֲחִילוּד
  choice: anak ni Ahilud
  rationale: Natural at tapat na Filipino para sa karaniwang pagtukoy sa ama ng isang tao.
- source_word: הַמַּזְכִּיר
  choice: ang tagapagtala
  rationale: Tumutukoy sa opisyal ng korte na nag-iingat ng mga tala at naghaharap o nagpapaalaala ng mga usapin sa hari. Ang “tagapagtala” ay malinaw sa kasalukuyang Filipino at naiiba sa “mga kalihim.”
