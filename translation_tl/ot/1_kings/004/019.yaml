id: 1KI.4.19
reference: 1 Kings 4:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: tl
  text: Si Geber na anak ni Uri, sa lupain ng Gilead—ang lupain ni Sihon na hari ng mga Amoreo at ni Og na hari ng Bashan—at siya lamang ang gobernador na nasa lupaing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “na namamahala sa lupaing iyon.” Literal sa Hebreo: “na nasa lupain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: Geber
  rationale: Pangalan ng tao; tinumbasan sa karaniwang transliterasyon sa halip na isalin ang posibleng kahulugan nito.
- source_word: בֶּן אֻרִי
  choice: anak ni Uri
  rationale: Likas at malinaw na salin sa Filipino ng patronimikong pariralang Hebreo.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Pinanatili ang אֶרֶץ bilang “lupain” upang maipakita ang pag-uulit at appositional na kayarian ng Hebreo.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: ang lupain ni Sihon na hari ng mga Amoreo at ni Og na hari ng Bashan
  rationale: Ipinakikilala pa ng parirala ang Gilead ayon sa dating mga teritoryo nina Sihon at Og; pinanatili ang “lupain” at ang magkatimbang na mga titulo.
- source_word: נְצִיב
  choice: gobernador
  rationale: Sa kontekstong administratibo ng kabanata, tumutukoy ito sa hinirang na opisyal na nangangasiwa sa isang rehiyon; malinaw at pangkaraniwan ang “gobernador” sa modernong Filipino.
- source_word: אֶחָד
  choice: lamang
  rationale: 'Ipinahahayag ang diin ng numeral na אֶחָד: si Geber ang nag-iisang gobernador sa lupaing tinutukoy.'
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: na nasa lupaing iyon
  rationale: Malapit ito sa literal na “na nasa lupain” at hindi nito tahimik na pinapalitan ang pang-ukol na בְּ ng mas tiyak na administratibong kahulugang “namamahala sa.”
theological_decisions:
- issue: Kahulugan ng pangwakas na אֲשֶׁר בָּאָרֶץ
  choice: na nasa lupaing iyon
  alternative: na namamahala sa lupaing iyon
  rationale: Literal na “nasa lupain” ang Hebreo, ngunit maaari itong unawain sa administratibong diwa. Pinanatili sa teksto ang mas tuwirang pagbasa at inilagay sa talababa ang alternatibo upang hindi lutasin nang sapilitan ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang mga gitling upang malinaw na maihiwalay ang appositional na paglalarawan sa Gilead, at pinanatili ang mga pangalang pantangi sa kinikilalang anyong transliterado.
