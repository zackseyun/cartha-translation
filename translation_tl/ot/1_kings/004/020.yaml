base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/020.yaml
  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: tl
  text: Ang Juda at Israel ay napakarami, gaya ng buhangin sa tabi ng dagat[a]. Sila ay kumakain, umiinom, at nagagalak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng buhangin sa dalampasigan,” isang karaniwang pahayag sa Hebreo para sa napakalaking bilang ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Ang Juda at Israel
  rationale: Pinanatili ang dalawang pangalang pantangi bilang magkatambal na simuno.
- source_word: רַבִּים
  choice: ay napakarami
  rationale: Ang pang-uri ay panaguri at nagpapahayag ng napakalaking bilang; natural sa modernong Tagalog ang tahasang pang-angkop na 'ay'.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: gaya ng buhangin sa tabi ng dagat
  rationale: Inihahatid nito nang natural ang paghahambing sa di-mabilang na buhangin. Ang לָרֹב ay nasasalamin na sa 'napakarami' at sa buong tayutay, kaya hindi dinagdagan ng mabigat at paulit-ulit na parirala.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: Sila'y kumakain, umiinom
  rationale: Ang mga participle ay naglalarawan ng nagpapatuloy o karaniwang kalagayan; pinanatili ito sa aspektong imperpektibo ng Tagalog.
- source_word: וּשְׂמֵחִים
  choice: at nagagalak
  rationale: Ipinapahayag ang kalagayan ng kagalakan at kasaganaan, habang pinananatili ang parallel na daloy ng tatlong kilos/kalagayan.
