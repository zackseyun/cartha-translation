  text: And the word of Yahweh came to him[a], saying,
translation:
  language: tl
  text: 'At dumating sa kanya ang salita ni Yahweh[a], na nagsabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, YHWH. Tradisyonal itong isinasalin na “PANGINOON.”
    reason: Nililinaw ang anyo ng banal na pangalan sa pinagmulang teksto at ang tradisyonal na alternatibong salin.
lexical_decisions:
- source_word: וַיְהִי
  choice: At dumating
  rationale: Ipinapakita ng waw-consecutive ang kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “At dumating” at iniiwasan nito ang mas mekanikal na “At nangyari.”
- source_word: דְבַר
  choice: ang salita
  rationale: Bahagi ito ng nakaugaliang pormulang propetiko na “ang salita ni Yahweh.” Pinananatili ng “salita” ang pormula at diwang paghahayag nang hindi ito agad binibigyang-kahulugang “mensahe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na banal na pangalang YHWH sa halip na palitan iyon ng titulong “PANGINOON.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ang pang-ukol na אֶל na may hulaping panghalip ay nagpapahiwatig ng direksiyon patungo sa isang tao; “sa kanya” ang natural na katumbas sa Tagalog.
- source_word: לֵאמֹר
  choice: na nagsasabi
  rationale: Ang infinitive construct ay karaniwang pambungad sa tuwirang pananalita. Pinananatili ng “na nagsasabi” ang tahasang pormula ng Hebreo, samantalang ang tutuldok ay naghahanda sa susunod na pahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na simple at marangal. Pinanatili ang nakaugaliang pormulang propetiko at ang daloy ng salaysay. Inilagay ang panandang talababa pagkatapos ng “Yahweh,” ang salitang tunay na tinutukoy ng paliwanag.
