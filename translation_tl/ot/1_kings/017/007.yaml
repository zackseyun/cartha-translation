  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “batis” sa pangunahing teksto dahil mas pamilyar ito kaysa “wadi,” habang pinananatili sa talababa ang heograpikong diwa ng pana-panahong daluyan ng tubig.
