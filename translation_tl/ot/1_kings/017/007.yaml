  yaml_path: translation/ot/1_kings/017/007.yaml
  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: tl
  text: Pagkalipas ng ilang araw, natuyo ang batis[a] dahil walang ulan sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pana-panahong sapa.” Ang salitang Hebreo ay maaaring tumukoy sa daluyan ng tubig na umaagos lamang sa ilang panahon at maaaring matuyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkalipas...
  rationale: Ang pormulang pasalaysay ay natural na isinama sa panandang panahon sa halip na isaling kahoy na “At nangyari.”
- source_word: מִקֵּץ יָמִים
  choice: pagkalipas ng ilang araw
  rationale: Pinananatili nito ang di-tiyak na tagal at ang tahasang sangkap na “mga araw” ng idyomang Hebreo.
- source_word: וַיִּיבַשׁ
  choice: natuyo
  rationale: Ito ang natural na Filipino para sa isang daluyan ng tubig na nawalan ng tubig.
- source_word: הַנָּחַל
  choice: ang batis
  rationale: Karaniwan at madaling maunawaang salita ito para sa daluyan ng tubig; ipinapaliwanag sa talababa na maaaring pana-panahon lamang ang agos nito.
- source_word: כִּי
  choice: dahil
  rationale: Malinaw nitong ipinahahayag ang sanhi ng pagkatuyo.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: walang ulan
  rationale: Tuwiran at natural na pagpapahayag ng kawalan ng pag-ulan.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy ito sa lupaing o rehiyong apektado ng tagtuyot, hindi sa buong daigdig.
