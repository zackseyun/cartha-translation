    issue: Hindi likas ang “ginawa ang ayon sa sinabi ni Elias.”
    rationale: Ang “ayon sa” ay hindi karaniwang ginagamit bilang layon ng “ginawa” sa ganitong ayos. Ang “ginawa ang sinabi ni Elias” ay natural at tapat sa כִּדְבַר אֵלִיָּהוּ.
  - severity: low
