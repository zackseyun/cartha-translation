  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: tl
  text: Kaya pumunta siya at ginawa ang sinabi ni Elias. At kumain siya—si Elias, siya, at ang kanyang sambahayan—sa loob ng maraming araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At kumain siya—siya (lalaki), siya (babae), at ang kanyang sambahayan—mga araw.” Sa Hebreo, pambabaeng isahan ang pandiwa, na sinusundan ng tahasang talaan ng lahat ng kumain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Kaya umalis siya
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural na ipinahihiwatig ng “Kaya” na tugon ito sa naunang tagubilin.
- source_word: וַתַּעֲשֶׂה
  choice: at ginawa
  rationale: Ang עשה ay tumutukoy sa pagsasagawa ng tagubilin, hindi lamang sa paggawa ng isang bagay.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: ang ayon sa sinabi ni Elias
  rationale: Ang דָּבָר dito ay ang binigkas na tagubilin ni Elias; malinaw at likas ito sa modernong Filipino.
- source_word: וַתֹּאכַל
  choice: At kumain siya
  rationale: Pinananatili ang pandiwang nasa ikatlong panauhang pambabaeng isahan, bago ilahad ang iba pang kasamang kumain.
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: si Elias, siya, at ang kanyang sambahayan
  rationale: Nililinaw ang tinutukoy ng panlalaking panghalip habang pinananatili ang Hebreong ayos na “siya [lalaki], siya [babae], at ang sambahayan niya.”
- source_word: בֵּיתָהּ
  choice: ang kanyang sambahayan
  rationale: Sa konteksto ng pagkain, tumutukoy ang בַּיִת sa mga taong kabilang sa kanyang tahanan, hindi lamang sa gusali.
- source_word: יָמִים
  choice: sa loob ng maraming araw
  rationale: Ang pangmaramihang “mga araw” na gamit pang-abay ay nagpapahiwatig ng matagal na yugto; natural itong ipinahahayag bilang “maraming araw.”
