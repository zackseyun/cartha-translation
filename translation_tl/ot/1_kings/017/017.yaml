base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: tl
  text: Pagkaraan ng mga pangyayaring ito, nagkasakit ang anak ng babaeng may-ari ng bahay, at lumubha nang husto ang kanyang sakit, hanggang sa wala nang natitirang hininga sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa wala nang natitirang buhay sa kanya.” Literal sa Hebreo, “hanggang sa wala nang natitirang hininga sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkaraan ng mga pangyayaring ito
  rationale: Natural itong panandang temporal sa makabagong Tagalog at pinananatili ang pangmaramihang anyo ng הַדְּבָרִים nang hindi ginagaya nang matigas ang Hebreong pambungad na וַיְהִי.
- source_word: חָלָה
  choice: nagkasakit
  rationale: Ipinahahayag nito ang pagpasok sa kalagayan ng pagkakasakit, hindi lamang ang pagiging maysakit.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: ang anak ng babaeng may-ari ng bahay
  rationale: Malinaw at natural na ipinapahayag ang literal na diwang ang babae ang may-ari o namamahala sa bahay, nang walang makalumang katawagang panlipunan.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: at lumubha nang husto ang kanyang sakit
  rationale: Ipinakikita ng “lumubha” ang paglala ng kalagayan sa daloy ng salaysay, samantalang ang “nang husto” ay nagpapahayag ng tindi ng חָזָק מְאֹד.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: hanggang sa wala nang hiningang natira sa kanya
  rationale: Pinananatili ang pangunahing kahulugan ng נְשָׁמָה bilang “hininga” at ang Hebreong paraan ng pagpapahayag, sa halip na tahasang palitan ito ng “namatay.”
theological_decisions:
- issue: Kung tahasang isasalin bilang kamatayan ang huling sugnay o pananatilihin ang Hebreong idyoma
  choice: Pinanatili ang “wala nang hiningang natira sa kanya.”
  alternative: “hanggang sa namatay siya” o “hanggang sa wala nang buhay sa kanya”
  rationale: Ang Hebreo ay nagsasabing walang נְשָׁמָה na natira sa kanya. Ipinahihiwatig nito ang pagkawala ng buhay, ngunit ang pagpapanatili sa mismong larawan ng “hininga” ay umiiwas sa paglutas nang higit sa tahasang anyo ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga pangyayari” sa halip na ang mas literal ngunit matigas na “mga bagay,” at pinanatili ang larawang “hininga” upang maingatan ang pahiwatig at tensiyon ng Hebreo.
