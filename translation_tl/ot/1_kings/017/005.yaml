  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: tl
  text: Kaya humayo siya at ginawa niya ang ayon sa salita ni Yahweh. Pumunta siya at nanatili sa tabi ng Wadi ng Kerit[a], na nasa tapat ng Jordan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘batis ng Kerit’ o ‘daluyan ng Kerit.’ Ang salitang Hebreo ay maaaring tumukoy sa isang wadi, bangin, o daluyang may tubig lamang sa ilang panahon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, ‘na nasa harap ng Jordan’ o ‘na nasa tapat ng Jordan.’ Hindi tahasang binabanggit ng Hebreo ang isang direksiyon gaya ng ‘silangan.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: humayo siya / pumunta siya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Pinanatili ang dalawang pagbanggit sa pagpunta, ngunit gumamit ng magkaibang likas na pandiwa sa Filipino upang maiwasan ang alanganing pag-uulit.
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: ginawa ang ayon sa salita ni Yahweh
  rationale: Pinananatili nito ang diwa ng pagsunod sa ipinahayag na utos, pati ang pormal na ugnayan ng כִּדְבַר, ‘ayon sa salita ng.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Sa konteksto, ang ישב ay tumutukoy sa paninirahan o pananatili sa isang lugar. Ang ‘nanatili’ ay natural at hindi nagpapahiwatig ng permanenteng paninirahan.
- source_word: בְּנַחַל
  choice: sa tabi ng Wadi
  rationale: Maaaring tumukoy ang נחל sa wadi, bangin, o daluyang may tubig lamang sa ilang panahon. Pinananatili ng ‘Wadi’ ang heograpikong katangian, at likas sa Filipino ang ‘sa tabi ng’ para sa kinaroroonan.
- source_word: כְּרִית
  choice: Kerit
  rationale: Isinatinig ang pangalang Hebreo sa paraang madaling basahin sa Filipino.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: na nasa tapat ng Jordan
  rationale: Ang ‘nasa tapat ng’ ay malapit sa heograpikong idyomang עַל־פְּנֵי nang hindi ipinapasok ang mas tiyak ngunit hindi tahasang direksiyong ‘silangan ng.’
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Karaniwang anyo sa Filipino ng pangalan ng ilog; hindi kailangang idagdag ang ‘Ilog’ sa mismong teksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulong ‘PANGINOON.’
- issue: Heograpikong kahulugan ng עַל פְּנֵי הַיַּרְדֵּן
  choice: nasa tapat ng Jordan
  alternative: nasa harap ng Jordan; nasa kabila ng Jordan; nasa silangan ng Jordan
  rationale: May kaluwagan ang idyomang Hebreo. Ang ‘nasa tapat ng’ ay nagpapanatili sa tunay na kalabuan at umiiwas sa pagtiyak ng direksiyong hindi tahasang binanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng kilos sa Hebreo sa pamamagitan ng ‘humayo’ at ‘pumunta,’ ginamit ang ‘Wadi’ bilang tiyak na katawagang heograpiko na ipinaliwanag sa talababa, at iniwasang gawing ‘silangan ng Jordan’ ang maluwag na idyomang Hebreo.
