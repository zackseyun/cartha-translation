  text: וְ/הָ/עֹרְבִ֗ים מְבִיאִ֨ים ל֜/וֹ לֶ֤חֶם וּ/בָשָׂר֙ בַּ/בֹּ֔קֶר וְ/לֶ֥חֶם וּ/בָשָׂ֖ר בָּ/עָ֑רֶב וּ/מִן הַ/נַּ֖חַל יִשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: tl
  text: At dinadalhan siya ng mga uwak ng tinapay at karne tuwing umaga, at ng tinapay at karne tuwing gabi; at umiinom siya mula sa batis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapa” o “daluyan ng tubig.” Ang salitang Hebreo na נַחַל ay maaaring tumukoy sa isang daluyan ng tubig na pana-panahon lamang may agos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: at … ang mga uwak
  rationale: Ang עֹרְבִים ay karaniwang tumutukoy sa mga uwak; pinananatili ng “at” ang pang-ugnay sa naunang salaysay.
- source_word: מְבִיאִים לוֹ
  choice: dinadalhan siya
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na kilos; natural itong naihahayag sa Tagalog sa “dinadalhan siya,” kasama ng “tuwing umaga” at “tuwing gabi.”
- source_word: לֶחֶם וּבָשָׂר
  choice: tinapay at karne
  rationale: Pinananatili ang kongkretong kahulugan ng לֶחֶם bilang “tinapay” at ang kontekstuwal na kahulugan ng בָשָׂר bilang pagkaing “karne.”
- source_word: בַּבֹּקֶר … בָּעָרֶב
  choice: tuwing umaga … tuwing gabi
  rationale: Ipinahihiwatig ng “tuwing” ang regular at paulit-ulit na paglalaan sa dalawang oras ng araw.
- source_word: וּמִן הַנַּחַל
  choice: at … mula sa batis
  rationale: Ang נַחַל ay daluyan ng tubig na maaaring pana-panahon lamang magkaroon ng agos. Ang “batis” ay likas at madaling maunawaang salin, habang nililinaw sa talababa ang saklaw ng salita.
- source_word: יִשְׁתֶּה
  choice: umiinom siya
  rationale: Ang imperfect sa kontekstong ito ay nagpapahayag ng nakagawiang o paulit-ulit na kilos, na natural na naihahatid ng kasalukuyang anyong “umiinom siya” sa salaysay.
theological_decisions:
- issue: Kung ang עֹרְבִים ay literal na mga uwak o mga taong tagapagdala
  choice: literal na mga uwak
  alternative: mga Arabo, mangangalakal, o ibang mga taong tagapagdala
  rationale: Ang payak at karaniwang leksikal na kahulugan ng עֹרְבִים ay “mga uwak,” at walang hinihingi ang agarang konteksto na palitan ito ng mga taong tagapagdala. Hindi iniiwasan ng salin ang mahimalang katangian ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “tinapay at karne” upang maingatan ang ritmo at diin ng Hebreo. Ginamit ang “uwak” bilang karaniwang katawagan sa corvid/raven sa Filipino, at “batis” bilang madaling maunawaang pangunahing salin ng נַחַל.
