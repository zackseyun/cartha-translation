id: 1KI.17.1
reference: 1 Kings 17:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: tl
  text: 'Sinabi ni Elias na Tisbita[a], na mula sa mga naninirahan sa Gilead, kay Ahab, “Buhay si Yahweh, ang Diyos ng Israel, na nasa harapan niya ako''y nakatayo: hindi magkakaroon ng ni hamog ni ulan sa mga taóng ito[b], maliban kapag sinabi ko.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang lalaking mula sa Tisbe.” Ang Hebreo ay katawagang tumutukoy sa pinagmulan ni Elias.'
    reason: lexical_alternative
  - marker: b
    text: Ang literal na anyo ng panunumpang Hebreo ay “kung magkakaroon ng hamog o ulan,” na ang ibig sabihin ay mariing “hindi magkakaroon.”
    reason: cultural_note
  - marker: c
    text: 'Maaari ring: “maliban sa aking salita” o “maliban ayon sa aking salita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: na Tisbita
  rationale: Ang anyong gentiliko ay tumutukoy kay Elias ayon sa kaniyang pinagmulan. Pinananatili ng “Tisbita” ang maikli at pangalang katawagan ng Hebreo.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: na mula sa mga naninirahan sa Gilead
  rationale: Maaaring tumukoy ang תּוֹשָׁב sa mga residente o nanirahan doon, hindi lamang sa mga katutubo. Likas sa Tagalog ang “mga naninirahan” at hindi nito pinapaliit ang saklaw sa mga ipinanganak sa Gilead.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili nito ang malinaw at marangal na anyo ng panunumpang Hebreo; nauunawaan sa kasunod na pahayag ang lakas ng panunumpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at likas na salin ng pariralang konstrakto, habang pinananatili ang mahalagang pagkakakilanlan sa tipan.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: na sa harapan niya ako nakatayo
  rationale: Pinananatili ang kongkretong idyoma ng pagtayo sa presensiya ng Diyos at ang pahiwatig ng paglilingkod, nang hindi ito nililimitahan sa paliwanag na “pinaglilingkuran ko.”
- source_word: אִם יִהְיֶה
  choice: hindi magkakaroon
  rationale: Sa pormula ng panunumpa, ang literal na “kung magkakaroon” ay naghahayag ng mariing pagtanggi. Kailangang ilantad ang negatibong diwa upang maging malinaw sa Tagalog.
- source_word: טַל וּמָטָר
  choice: hamog ni ulan
  rationale: Sa ilalim ng tahasang pagtanggi, natural sa Tagalog ang “hindi ... ni ...,” habang kapwa pinananatili ang hamog at ulan.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: sa mga taong ito
  rationale: Likas na panahong parirala sa Tagalog at pinananatili ang di-tiyak na haba ng panahong tinutukoy.
- source_word: כִּי אִם
  choice: maliban
  rationale: Malinaw nitong minamarkahan ang tanging eksepsiyon sa naunang negatibong pahayag.
- source_word: לְפִי דְבָרִי
  choice: ayon sa aking salita
  rationale: Malapit ito sa literal na diwang “ayon sa bibig ng aking salita” at pinananatili ang pagiging kondisyon ng propetikong salita nang hindi ipinahihiwatig ang hiwalay o sariling kapangyarihan ni Elias.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa pangalang pangtipan sa halip na palitan ito ng titulo.
- issue: Lakas ng propetikong salita sa לְפִי דְבָרִי
  choice: maliban ayon sa aking salita
  alternative: maliban sa aking salita; maliban kapag sinabi ko
  rationale: Pinananatili ng salin ang salita ni Elias bilang inihayag na kondisyon para sa hamog o ulan, ngunit hindi dinaragdagan ang teksto ng paliwanag kung ang kapangyarihan ay likas sa propeta o ipinagkaloob ng Diyos.
- issue: Idyoma ng pagtayo sa harapan ng Diyos
  choice: na sa harapan niya ako nakatayo
  alternative: na aking pinaglilingkuran
  rationale: Maaaring magpahiwatig ang Hebreo ng paglilingkod at pagharap sa presensiya ng Diyos. Ang mas kongkretong salin ay nagpapanatili sa dalawang dimensiyon at hindi pumipili lamang ng isa.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang kongkretong idyoma ng pagtayo sa harapan ng Diyos, at ang tunay na saklaw ng “mga naninirahan.” Inayos ang mga marker ayon sa kanilang posisyon sa teksto: [a] sa “Tisbita,” [b] sa idyoma ng panunumpa, at [c] sa “ayon sa aking salita.”'
