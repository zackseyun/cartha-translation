revisions:
- from: 'At sinabi ni Elias na Tisbita[a], na mula sa mga naninirahan sa Gilead, kay Ahab, “Buhay si Yahweh, ang Diyos ng Israel, na sa harapan niya ako nakatayo: hindi magkakaroon ng hamog ni ulan sa mga taong ito[b], maliban ayon sa aking salita.[c]”'
  to: 'Sinabi ni Elias na Tisbita[a], na mula sa mga naninirahan sa Gilead, kay Ahab, “Buhay si Yahweh, ang Diyos ng Israel, na nasa harapan niya ako''y nakatayo: hindi magkakaroon ng ni hamog ni ulan sa mga taóng ito[b], maliban kapag sinabi ko.[c]”'
  rationale: Inayos ang pagkakasunod ng mga parirala upang maging natural ang pangungusap sa modernong Tagalog. Pinalitan ang di-idiomatikong “maliban ayon sa aking salita” ng “maliban kapag sinabi ko,” na tapat na nagpapahayag ng eksepsiyong nakasalalay sa propetikong salita ni Elias; iniwan sa talababa ang mas malapit na mga anyong leksikal. Nilinaw rin ang tambalang pagtanggi sa “ni hamog ni ulan.”
