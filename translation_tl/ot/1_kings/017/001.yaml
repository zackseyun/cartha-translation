    issue: Hindi natural ang ayos ng sugnay na pambungad.
    rationale: Ang “At sinabi ni Elias na Tisbita[a], na mula sa mga naninirahan sa Gilead, kay Ahab” ay mabigat at napuputol ang pangunahing pandiwa mula sa layon nito. Mas natural ang “Sinabi ni Elias na Tisbita ... kay Ahab.”
  - severity: medium
    issue: Hindi idiomatiko ang “maliban ayon sa aking salita.”
    rationale: Hindi normal sa modernong Tagalog ang paggamit ng “maliban” na tuwirang sinusundan ng “ayon sa.” Ang “maliban kapag sinabi ko” ay natural na naghahayag ng eksepsiyong “sa/ayon sa aking salita,” samantalang ang talababa ay nagpapanatili ng mas malapit na mga alternatibo.
  - severity: low
    issue: Maaaring luminaw ang negatibong tambalan sa “hamog ni ulan.”
    rationale: Ang “ni hamog ni ulan” ang mas malinaw na Tagalog na katumbas ng “neither dew nor rain” sa ilalim ng pagtanggi.
