base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: tl
  text: At dininig ni Yahweh ang tinig ni Elias, at bumalik ang buhay ng bata sa loob niya,[a] at nabuhay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumalik ang kaluluwa ng bata sa loob niya.” Maaaring mangahulugan ang Hebreong nefesh ng “buhay,” “kaluluwa,” o “sarili,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: dininig
  rationale: Sa konteksto ng panalangin, ipinahihiwatig ng שׁמע na hindi lamang narinig ni Yahweh si Elias kundi pinakinggan at sinagot niya ito. Likas sa Filipino ang “dininig” para sa kanais-nais na pagtugon sa isang dalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בְּקוֹל
  choice: ang tinig
  rationale: Pinananatili nito ang kongkretong Hebreong pahayag na “sa tinig,” ngunit iniangkop sa likas na pariralang Filipino na “dinigin ang tinig.”
- source_word: וַתָּשָׁב
  choice: bumalik
  rationale: Tuwirang ipinapahayag ng שׁוב ang pagbabalik o pagpapanumbalik.
- source_word: נֶפֶשׁ
  choice: ang buhay nito
  rationale: Sa konteksto ng muling pagkabuhay ng patay na bata, ang נֶפֶשׁ ay likas na tumutukoy sa buhay nito. Iniwasan nitong ipasok sa pangunahing teksto ang mas tiyak na antropolohikong kahulugang maaaring ipahiwatig ng “kaluluwa.”
- source_word: הַיֶּלֶד
  choice: ng bata
  rationale: Ang יֶלֶד ay bata o batang lalaki; sapat at natural dito ang “bata,” ayon sa agarang salaysay.
- source_word: עַל קִרְבּוֹ
  choice: sa kalooban ng bata
  rationale: Ang קֶרֶב ay tumutukoy sa loob o panloob na bahagi. Pinananatili ng “sa kalooban” ang panloob na lokasyon nang hindi nagiging labis na literal o alanganin sa Filipino.
- source_word: וַיֶּחִי
  choice: at nabuhay siya
  rationale: Tuwiran nitong inihahayag ang bunga ng pagbabalik ng buhay at natural itong pakinggan sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa נֶפֶשׁ sa konteksto ng muling pagkabuhay
  choice: ang buhay nito
  alternative: ang kaluluwa nito
  rationale: Inilalarawan ng talata ang pagpapanumbalik ng buhay ng bata. Pinananatili ng “buhay” ang agarang diwa ng salaysay nang hindi nagpapasya para sa isang partikular na pananaw tungkol sa ugnayan ng katawan at kaluluwa. Nasa talababa ang tradisyonal at leksikal na posibleng saling “kaluluwa.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dininig” bilang natural na pananalita para sa pagtugon sa panalangin, at pinanatili ang pangalang Yahweh. Ang “kalooban” ay ginagamit sa diwang panloob na bahagi o loob ng bata, hindi bilang pasiya o kagustuhan.
