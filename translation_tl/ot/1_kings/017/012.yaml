revisions:
- from: At sinabi niya, “Buhay si Yahweh na iyong Diyos, wala akong tinapay[a]—isang dakot na harina lamang sa banga at kaunting langis sa maliit na pitsel. Tingnan mo, namumulot ako ngayon ng dalawang patpat. Pagkatapos ay papasok ako at ihahanda iyon para sa akin at sa anak ko, upang makain namin iyon at pagkatapos ay mamatay kami.”
  to: At sinabi niya, “Buhay si Yahweh, ang iyong Diyos, wala akong tinapay[a], kundi isang dakot na harina lamang sa banga at kaunting langis sa maliit na pitsel. Tingnan mo, namumulot ako ngayon ng dalawang patpat. Papasok ako at ihahanda ko ito para sa akin at sa anak kong lalaki, upang makain namin ito at mamatay kami.”
  rationale: Pinalitan ang di-tiyak-sa-kasariang “anak ko” ng “anak kong lalaki” upang maisalin ang tahasang panlalaking בְּנִי. Bahagyang inayos ang bantas at ayos ng panunumpa para sa mas natural na Filipino nang hindi binabago ang kahulugan. Pinanatili ang talababa para sa pinagtatalunang/mas tiyak na leksikal na saklaw ng מָעוֹג.
