  source_fidelity: Kailangang isaayos ang pagsasalin ng בְּנִי (“aking anak na lalaki”). Tahasang panlalaki ang pangngalan sa Hebreo, kaya hindi dapat gawing di-tiyak-sa-kasarian ang “anak.” Ang natitirang nilalaman—panunumpa, kakarampot na harina at langis, dalawang patpat, at ang huling pagkain bago mamatay—ay tapat sa pinagmulan.
  naturalness: Malinaw at makabago ang draft. Ang “Buhay si Yahweh na iyong Diyos” ay nauunawaan, ngunit mas likas at mas malinaw bilang pormula ng panunumpa ang “Buhay si Yahweh, ang iyong Diyos.”
  terminology: Wasto ang “Yahweh,” “isang dakot na harina,” “banga,” “maliit na pitsel,” at “dalawang patpat.” Ang talababa ay angkop na nagbibigay ng mas tiyak na kahulugan ng מָעוֹג.
