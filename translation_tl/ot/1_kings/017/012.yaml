    issue: “anak ko” para sa בְּנִי
    rationale: Ang בֵּן na may hulaping unang panauhang isahan ay “aking anak na lalaki/aking anak,” ngunit ang anyong Hebreo ay tiyak na panlalaki. Upang mapanatili ang impormasyong nasa pinagmulan, gamitin ang “anak kong lalaki.”
  - severity: low
    issue: Pagkakabuo ng panunumpa
    rationale: Ang “Buhay si Yahweh, ang iyong Diyos” ay mas malinaw na naghihiwalay sa pormula ng panunumpa at sa aposisyong “ang iyong Diyos,” habang pinananatili ang kahulugan ng חַי־יְהוָה אֱלֹהֶיךָ.
