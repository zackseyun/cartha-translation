  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: tl
  text: At sinabi niya, “Buhay si Yahweh, ang iyong Diyos, wala akong tinapay[a], kundi isang dakot na harina lamang sa banga at kaunting langis sa maliit na pitsel. Tingnan mo, namumulot ako ngayon ng dalawang patpat. Papasok ako at ihahanda ko ito para sa akin at sa anak kong lalaki, upang makain namin ito at mamatay kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “munting tinapay” o “tinapay na niluto.” Ang salitang Hebreo na מָעוֹג ay tumutukoy sa isang maliit na tinapay na karaniwang hugis-bilog.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Buhay si Yahweh na iyong Diyos
  rationale: Pinananatili nito ang pormula ng taimtim na panunumpa sa Hebreo at ang tuwirang pagtukoy sa Diyos ni Elias.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: wala akong tinapay
  rationale: Sa konteksto ng panunumpa, ang אִם ay matinding pagtanggi. Ang payak na “tinapay” ay natural sa Filipino, habang inilalahad sa talababa ang higit na tiyak na uri ng pagkaing tinutukoy ng מָעוֹג.
- source_word: מְלֹא כַף קֶמַח
  choice: isang dakot na harina
  rationale: Natural na katumbas ito ng literal na daming kasya sa palad at malinaw na ipinakikita ang napakaliit na natitirang pagkain.
- source_word: כַּד
  choice: banga
  rationale: Karaniwang sisidlang pambahay na angkop sa pag-iimbak ng harina.
- source_word: צַפַּחַת
  choice: maliit na pitsel
  rationale: Ipinahihiwatig nito ang isang maliit na sisidlan para sa langis at naihihiwalay ito sa banga ng harina.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: Tingnan mo, namumulot ako ngayon
  rationale: Ipinapakita ng הִנְנִי ang agarang sitwasyon, at ng participle ang kilos na kasalukuyang ginagawa.
- source_word: שְׁנַיִם עֵצִים
  choice: dalawang patpat
  rationale: Pinananatili ang tiyak na bilang at ang larawan ng napakakaunting panggatong, sa halip na magpahiwatig ng malalaking troso.
- source_word: וַעֲשִׂיתִיהוּ לִי וְלִבְנִי
  choice: ihahanda iyon para sa akin at sa anak ko
  rationale: Tapat sa dalawang tatanggap na binanggit sa Hebreo nang hindi ipinapalagay ang kasarian ng anak sa salin.
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: upang makain namin iyon at pagkatapos ay mamatay kami
  rationale: Pinananatili ang marahas at malungkot na pagkakasunod ng huling pagkain at inaasahang kamatayan.
theological_decisions:
- issue: Paglilipat sa pangalang יהוה sa panunumpa ng balong taga-Sidon
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalang יהוה ang tahasang nasa pinagmulan. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Kung sino ang kinikilalang Diyos sa pariralang אֱלֹהֶיךָ
  choice: iyong Diyos
  alternative: ating Diyos
  rationale: Ikalawang panauhang isahan ang hulapi sa Hebreo; kinikilala ng babae si Yahweh bilang Diyos ni Elias nang hindi sinasabi ng talata na kinikilala na rin niya siya bilang sarili niyang Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak” sa halip na “anak na lalaki” sapagkat bagaman panlalaki ang anyong Hebreo, natural at sapat ang di-tiyak-sa-kasariang katawagan sa Filipino. Pinanatili ang bigat ng panunumpa at ang matinding kakapusan nang walang dagdag na paliwanag sa pangunahing teksto.
