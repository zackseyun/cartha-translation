  to: Sinabi niya sa babae, “Ibigay mo sa akin ang anak mong lalaki.” Pagkatapos, kinuha niya ang batang lalaki mula sa kandungan ng babae[a], dinala siya paakyat sa silid sa itaas[b] na tinutuluyan niya, at inihiga sa sarili niyang higaan.
