base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: tl
  text: Sinabi niya sa babae, “Ibigay mo sa akin ang anak mong lalaki.” Pagkatapos, kinuha niya ang batang lalaki mula sa kandungan ng babae[a], dinala siya paakyat sa silid sa itaas[b] na tinutuluyan niya, at inihiga sa sarili niyang higaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kaniyang dibdib.” Ang salitang Hebreo ay tumutukoy sa bahagi ng dibdib o kandungan at nagpapahiwatig na malapit na karga ng ina.
    reason: lexical_alternative
  - marker: b
    text: O “silid sa ikalawang palapag” o “silid sa bubong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Ibigay mo sa akin
  rationale: Likas at tuwirang katumbas ito ng pautos na נתן na may לִי, at pinananatili ang agarang pakiusap nang hindi dinaragdagan ng tigas.
- source_word: בְּנֵךְ
  choice: ang anak mo
  rationale: Sa Filipino, ang “anak” ang natural na tawag ng isang ina sa kaniyang anak; malinaw na lalaki ang tinutukoy sa konteksto at sa mga kasunod na panghalip.
- source_word: מֵחֵיקָהּ
  choice: mula sa kandungan nito
  rationale: Ang חֵיק ay tumutukoy sa dibdib o kandungan, ang lugar ng malapit na pagkakarga. Natural sa modernong Filipino ang “kandungan” at hindi nito labis na binibigyang-kahulugan bilang mga bisig lamang.
- source_word: וַיַּעֲלֵהוּ
  choice: dinala paakyat
  rationale: Ipinapahayag nito kapwa ang pagdadala sa bata at ang pataas na direksiyong nasa pandiwang עלה.
- source_word: הָעֲלִיָּה
  choice: silid sa itaas
  rationale: Ang עֲלִיָּה ay isang silid sa mataas na bahagi ng bahay o sa bubong; malinaw at marangal na katumbas ang “silid sa itaas.”
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: na tinutuluyan niya
  rationale: Sa konteksto, ang ישב ay nangangahulugang naninirahan o pansamantalang tumutuloy, hindi literal na nakaupo.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: inihiga
  rationale: 'Tumpak at maikli itong katumbas ng causative na anyo ng שׁכב: pinahiga o inilagay na nakahiga.'
- source_word: עַל מִטָּתוֹ
  choice: sa sarili niyang higaan
  rationale: Ang hulaping panghalip ay tumutukoy kay Elias, ang gumagawa ng magkakasunod na kilos. Nililinaw ng “sarili niyang” na higaan ni Elias ito, hindi ng bata.
