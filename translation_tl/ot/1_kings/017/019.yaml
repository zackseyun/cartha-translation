    rationale: Sa modernong Filipino, ang “nito” ay karaniwang hindi ginagamit para sa taong babae sa ganitong konteksto at maaari pang malito ang sanggunian. “Kandungan ng babae” ang malinaw na katumbas ng מֵחֵיקָהּ.
  - severity: low
