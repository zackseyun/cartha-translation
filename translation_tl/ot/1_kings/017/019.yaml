translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sa babae” upang maging malinaw ang babaeng kausap nang hindi ipinapasok ang pangalan niya. Ang “nito” ay umiiwas sa sunod-sunod na “niya” at malinaw na tumutukoy sa ina. Pinanatili sa talababa ang saklaw ng kahulugan ng חֵיק at עֲלִיָּה.
