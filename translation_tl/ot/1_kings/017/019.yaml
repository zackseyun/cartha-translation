  source_fidelity: Kailangang tahasang isalin ang בְּנֵךְ bilang “anak mong lalaki,” sapagkat tiyak na “son” ang Hebreo, hindi lamang pangkalahatang “anak.” Ang mga kilos at ang silid sa itaas ay wastong naipapahayag sa draft.
  naturalness: Natural ang pangkalahatang daloy, ngunit ang “kandungan nito” ay hindi angkop sa taong tinutukoy at maaaring lumabo ang sanggunian. Mas malinaw at mas natural ang “kandungan ng babae.” Ang binagong talababa ay iiwas din sa hindi natural na “pagkakayakap niya sa kaniyang dibdib.”
  terminology: Ang “silid sa itaas,” “tinutuluyan,” at “higaan” ay angkop na modernong Filipino. Ginamit ang “batang lalaki” sa sumunod na pagtukoy upang mapanatili ang kasarian na ipinahihiwatig ng בֵּן.
  issues:
  - severity: medium
    issue: Hindi tahasang naipapahayag ng “ang anak mo” na lalaki ang anak.
    rationale: Ang בְּנֵךְ ay “iyong anak na lalaki/son.” Bagaman maaaring mahinuha sa konteksto, dapat mapanatili ang tiyak na kasarian ng pinagmulang teksto.
