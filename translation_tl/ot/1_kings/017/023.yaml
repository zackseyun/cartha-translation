base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: tl
  text: Pagkatapos, kinuha ni Elias ang bata at ibinaba niya ito mula sa silid sa itaas patungo sa loob ng bahay. Ibinigay niya ito sa kanyang ina. Sinabi ni Elias, “Tingnan mo, buhay ang anak mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang pandiwang pasalaysay ang לקח; ang “kinuha” ay tuwiran at natural sa Filipino nang hindi dinaragdagan ang paraan ng pagkilos.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Maaaring tumukoy ang יֶלֶד sa bata o batang lalaki. Natural ang “bata” sa konteksto at hindi nagpapalagay ng tiyak na edad.
- source_word: וַיֹּרִדֵהוּ
  choice: ibinaba siya
  rationale: Ang causative na anyo ng ירד ay nangangahulugang pinababa o dinala pababa; malinaw na ipinapahayag ng “ibinaba siya” ang galaw mula sa silid sa itaas nang hindi tinutukoy kung binuhat siya.
- source_word: הָעֲלִיָּה
  choice: silid sa itaas
  rationale: Ang עֲלִיָּה ay silid sa mataas na bahagi ng bahay o sa bubungan; malinaw at kasalukuyang Filipino ang “silid sa itaas.”
- source_word: הַבַּיְתָה
  choice: papasok sa bahay
  rationale: Ipinahihiwatig ng directional -ה ang pagkilos tungo sa loob ng bahay. Pinananatili ng “papasok sa bahay” ang direksiyong ito.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: ibinigay siya sa kanyang ina
  rationale: Tuwirang katumbas ito ng נתן na may di-tuwirang layon; iniiwasan ang mas interpretibong “ibinalik.”
- source_word: רְאִי
  choice: Tingnan mo
  rationale: Pautos na pambabaeng isahan ito na nakatuon sa ina. Natural at tuwiran sa modernong Filipino ang “Tingnan mo.”
- source_word: חַי בְּנֵךְ
  choice: buhay ang iyong anak
  rationale: Ang pang-uri na חַי bilang panaguri ay nagsasaad ng kalagayang buhay. Ang ayos na ito ay maikli, mariin, at tapat sa Hebreo.
theological_decisions:
- issue: Antas ng paglilinaw sa himala ng muling pagkabuhay
  choice: buhay ang iyong anak
  alternative: muling nabuhay ang iyong anak
  rationale: Tuwirang ipinahahayag ng Hebreo na buhay ang anak, ngunit hindi nito idinaragdag ang “muli” o tahasang sinasabing “ibinalik sa buhay.” Malinaw ang himala sa konteksto, kaya hindi na ito pinalawak sa salin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Elias,” ang nakaugaliang anyong Filipino ng pangalan. Pinanatili ang sunod-sunod na kilos at ang maigsi, dramatikong pahayag sa hulihan.
