  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, dumating sa kanya ang salita ni Yahweh:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkatapos, dumating
  rationale: Ipinakikita ng waw-consecutive ang kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” habang ang “dumating” ay kaakibat ng buong pariralang tumutukoy sa pagdating ng salita.
- source_word: דְבַר
  choice: ang salita
  rationale: Sa pariralang propetiko na דְבַר יְהוָה, ang “salita” ang tuwiran at nakaugaliang katumbas na nagpapanatili sa bigat ng banal na pahayag nang hindi ito pinakahulugang basta “mensahe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang ipinahahayag ng אֶל na may hulaping panlalaking isahan ang patungong diwa na “sa kanya”; malinaw sa konteksto na si Elias ang tinutukoy.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitive na לֵאמֹר ay pormulang nagpapakilala sa tuwirang pagsasalitang susunod. Sa natural na Tagalog, sapat at malinaw ang tutuldok upang ihudyat ang mismong pahayag sa susunod na talata, sa halip na ang mabigat na “na nagsasabi.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang karaniwang pormulang “dumating sa kanya ang salita ni Yahweh,” at tutuldok upang likas na ipakilala ang tuwirang pahayag na nagsisimula sa susunod na talata.
