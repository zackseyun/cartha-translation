base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: tl
  text: Pagkatapos, iniunat niya ang kanyang sarili sa ibabaw ng bata nang tatlong ulit, at dumaing siya kay Yahweh. Sinabi niya, “Yahweh, Diyos ko, pakiusap, manumbalik nawa sa kanya ang buhay ng batang ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, “manumbalik nawa sa kanya ang kaluluwa ng batang ito.” Literal na Hebreo: “bumalik nawa ang נֶפֶשׁ ng batang ito sa kanyang kaloob-looban.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד עַל הַיֶּלֶד
  choice: dumapa nang nakadipa sa ibabaw ng bata
  rationale: Ang bihirang pandiwang reflexive ay naglalarawan sa pisikal na pag-unat ni Elias sa ibabaw ng bata. Ang parirala ay natural sa Filipino at pinananatili ang posisyon at kilos nang hindi ginagamit ang malabong literal na “sinukat ang sarili.”
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: tatlong ulit
  rationale: Karaniwan at malinaw na katumbas sa modernong Filipino.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: dumaing kay Yahweh
  rationale: Sa konteksto ng panalangin, ipinahihiwatig ng קרא אל ang marubdob at apurahang pagtawag. Ipinapahayag ng “dumaing” ang tindi nito nang hindi labis na nagpapakahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, Diyos ko
  rationale: Pinananatili ang tuwirang pagtawag sa Diyos at ang unang-panauhang pag-aari.
- source_word: תָּשָׁב נָא
  choice: pakiusap, manumbalik nawa
  rationale: Pinagsasama nito ang magalang ngunit apurahang pakiusap ng jussive at ng particle na נָא, sa dignified at likas na Filipino.
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa konteksto ng muling pagkabuhay, tumutukoy ito sa buhay na nananahan at muling bumabalik sa bata, nang hindi ipinipilit ang isang tiyak na antropolohikal na doktrina. Itinatala sa talababa ang posibleng “kaluluwa.”
- source_word: הַיֶּלֶד הַזֶּה
  choice: batang ito
  rationale: Natural at tiyak na salin ng parirala; malinaw na lalaki ang bata mula sa konteksto, ngunit hindi kailangang ulitin ang kasarian sa Filipino.
- source_word: עַל קִרְבּוֹ
  choice: sa batang ito
  rationale: Ipinahahayag sa natural na Filipino ang pagbabalik ng buhay sa mismong bata. Ang mas literal na “sa kanyang kaloob-looban” ay inilalahad sa talababa upang mapanatili ang larawan ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa נֶפֶשׁ sa konteksto ng muling pagkabuhay
  choice: buhay
  alternative: kaluluwa
  rationale: Ang “buhay” ang pinakamalinaw na salin sa daloy ng salaysay at hindi nito awtomatikong nilulutas ang tanong tungkol sa likas ng tao. Dahil leksikal at tradisyonal na posible ang “kaluluwa,” pinananatili ito sa talababa kasama ng mas literal na pariralang Hebreo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Yahweh” para sa banal na pangalan. Ang “dumapa nang nakadipa” ay konkretong naglalarawan sa bihirang kilos, at ang “manumbalik nawa” ay nagpapanatili ng taimtim na himig ng panalangin.
