  to: Pagkatapos, iniunat niya ang kanyang sarili sa ibabaw ng bata nang tatlong ulit, at dumaing siya kay Yahweh. Sinabi niya, “Yahweh, Diyos ko, pakiusap, manumbalik nawa sa kanya ang buhay ng batang ito.[a]”
