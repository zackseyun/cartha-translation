  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: tl
  text: 'At ganito ang mangyayari: iinom ka mula sa batis[a], at inutusan ko ang mga uwak[c] na maglaan para sa iyo[b] roon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapa” o “agos.” Ang salitang Hebreo ay maaari ring tumukoy sa isang daluyang pana-panahon lamang may tubig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “panatilihin kang buhay” o “pakainin ka.”
    reason: lexical_alternative
  - marker: c
    text: May ilang nagmungkahing hindi mga ibon ang tinutukoy rito, ngunit ang karaniwang kahulugan ng salitang Hebreo ay mga uwak, at sinusuportahan ito ng kasunod na salaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Iinom ka
  rationale: Ang pormula ay nagpapakilala sa susunod na mangyayari. Sa makabagong Tagalog, likas na naipahihiwatig ng panghinaharap na pandiwa ang diwang “at mangyayari na” nang hindi nagiging mabigat ang pangungusap.
- source_word: מֵהַנַּחַל
  choice: mula sa batis
  rationale: Ang נחל ay maaaring tumukoy sa batis, sapa, o agusang pana-panahong natutuyo. Ang “batis” ay malinaw at likas sa karaniwang mambabasang Tagalog, habang pinananatili sa talababa ang saklaw ng salitang Hebreo.
- source_word: תִּשְׁתֶּה
  choice: Iinom ka
  rationale: Ang imperfect na ikalawang panauhang panlalaki ay tumutukoy sa gagawin ni Elias sa hinaharap. Ang “iinom ka” ang tuwiran at natural na katumbas.
- source_word: הָעֹרְבִים
  choice: mga uwak
  rationale: Karaniwang tumutukoy ang pangngalang Hebreo sa mga ibong raven o kauri nitong corvid. “Mga uwak” ang natural at kinikilalang katumbas sa Tagalog.
- source_word: צִוִּיתִי
  choice: inutusan ko
  rationale: Ipinahihiwatig ng perfect na naibigay na ng Diyos ang utos bago pa man makarating si Elias. Ang “inutusan ko” ay malinaw na nagsasaad ng natapos na pagkilos.
- source_word: לְכַלְכֶּלְךָ
  choice: na tustusan ka
  rationale: Ang pandiwa ay nangangahulugang magpanatili, maglaan, o tumustos. Hindi nililimitahan ng “tustusan ka” ang diwa sa pagpapakain lamang at akma ito sa paglalaang inilalarawan ng kasunod na salaysay.
- source_word: שָׁם
  choice: roon
  rationale: Tumutukoy ito sa lugar na nabanggit na, kaya “roon” ang wastong likas na pang-abay sa Tagalog.
theological_decisions:
- issue: Kung ano ang tinutukoy ng הָעֹרְבִים
  choice: Mga literal na ibong uwak ang inutusan ng Diyos na tumustos kay Elias.
  alternative: Iminungkahi ng ilan na pangalan ito ng lugar o tumutukoy sa isang pangkat ng mga tao.
  rationale: Ang karaniwang kahulugan ng salitang Hebreo ay mga ibon, at sinusuportahan ito ng kasunod na salaysay na nagdala sila ng tinapay at karne. Walang sapat na batayan sa teksto upang palitan ang payak na kahulugang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “roon” dahil tumutukoy ito sa batis na itinuro na sa naunang talata. Inilagay ang mga marka ng talababa kaagad pagkatapos ng salitang o pariralang tinutukoy ng bawat isa.
