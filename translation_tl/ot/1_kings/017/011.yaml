  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: tl
  text: Habang papunta siya upang kunin iyon, tinawag[a] siya ni Elias at sinabi, “Pakidala nga sa akin ang isang piraso ng tinapay[b] sa iyong kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinawag niya siya habang papalayo ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapirasong tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Habang papunta ang babae para kunin iyon
  rationale: 'Ipinahahayag nito ang nagpapatuloy na kilos: papunta na ang babae upang kunin ang tubig na hiniling sa naunang talata nang muli siyang tawagin ni Elias. Ang “iyon” ay likas na tumutukoy sa tubig ayon sa konteksto.'
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: tinawag siya ni Elias
  rationale: Ang קרא na may אֶל ay karaniwang nangangahulugang tumawag sa isang tao. Tahasang pinangalanan si Elias upang maging malinaw at natural ang pangungusap sa Tagalog.
- source_word: לִקְחִי נָא לִי
  choice: Pakidala nga sa akin
  rationale: Sa konteksto, hinihiling ni Elias na kumuha ang babae at magdala sa kaniya. Ang “paki-” at “nga” ay magkasamang naghahatid sa magalang at pinalambot na pakiusap ng נָא nang hindi nagiging makaluma.
- source_word: פַּת לֶחֶם
  choice: isang piraso ng tinapay
  rationale: Ang parirala ay tumutukoy sa isang piraso o kapirasong tinapay. Malinaw at pangkaraniwan sa modernong Filipino ang “isang piraso ng tinapay.”
- source_word: בְּיָדֵךְ
  choice: sa iyong kamay
  rationale: Pinananatili ang kongkretong larawan ng Hebreo na literal na “sa iyong kamay,” bagaman maaari rin itong idiomatikong magpahiwatig na dala o nasa pag-iingat niya ang tinapay.
