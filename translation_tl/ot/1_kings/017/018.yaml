    issue: Hindi natutukoy ang kasarian sa “anak ko.”
    rationale: Ang Hebreong בְּנִי ay nangangahulugang “aking anak na lalaki.” Dahil tinutukoy ang kasarian ng pangngalan sa pinagmulan, dapat itong ipakita sa salin.
