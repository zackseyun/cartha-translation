base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: tl
  text: Sinabi niya kay Elias, “Ano ang kinalaman ko sa iyo, tao ng Diyos? Naparito ka ba sa akin upang ipaalala ang aking kasamaan[a] at upang maging sanhi ng pagkamatay ng aking anak na lalaki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking kasalanan” o “aking pagkakasala.” Ang salitang Hebreo ay maaaring tumukoy sa masamang gawa, sa pananagutan dahil dito, o sa pasanin at bunga ng pagkakasala.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Ano ang kinalaman ko sa iyo
  rationale: Likas na idyomang Filipino na nagpapanatili sa diwa ng paglayo, pagtutol, at sumbat ng pananalitang Hebreo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili ang kinikilalang titulong Hebreo para sa propeta o sugo ng Diyos nang hindi ito ginagawang interpretibong paglalarawan.
- source_word: בָּאתָ אֵלַי
  choice: Naparito ka ba sa akin
  rationale: Ang anyong patanong ay naghahatid ng retorikal at mapanumbat na puwersa ng sinabi ng babae.
- source_word: לְהַזְכִּיר
  choice: upang ipaalala
  rationale: 'Ipinahahayag ng pandiwang Filipino ang causative na diwa ng Hiphil: maging dahilan upang muling maalaala o mapansin ang isang bagay.'
- source_word: עֲוֺנִי
  choice: aking kasamaan
  rationale: Pinananatili ang mabigat na moral na diwa ng עָוֹן habang hindi lubusang nililimitahan ito sa mismong gawa, pagkakasala, o pananagutan; inilalahad sa talababa ang saklaw ng kahulugan.
- source_word: וּלְהָמִית
  choice: at maging sanhi ng pagkamatay
  rationale: Natural na Filipino na malinaw na nagpapakita sa causative na anyo ng מות nang hindi agad pinapakahulugang tuwirang pagpatay.
- source_word: בְּנִי
  choice: anak ko
  rationale: Tumpak at natural na tumutukoy sa sariling anak na lalaki ng nagsasalita; malinaw na ang tinutukoy sa konteksto ay ang kaniyang anak na lalaki.
theological_decisions:
- issue: Kahulugan ng עֲוֺנִי sa paratang ng balo
  choice: aking kasamaan
  alternative: aking kasalanan; aking pagkakasala o pananagutan
  rationale: Maaaring tumukoy ang salitang Hebreo sa masamang gawa, sa pagkakasala, o sa pananagutan at bunga nito. Pinananatili ng salin at talababa ang tensiyong ito sa halip na magtakda ng iisang makitid na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Elias,” ang karaniwang anyong Filipino ng pangalang Elijah. Napanatili ang mapanumbat na retorika ng balo at ang causative na diwa ng dalawang pandiwa nang hindi nilulutas ang likas na kalabuan ng עָוֹן.
