  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: tl
  text: “Umalis ka rito at lumiko patungong silangan. Magtago ka sa tabi ng Wadi Kerit[a], na nasa tapat ng Ilog Jordan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “wadi” ay isang bangin, lambak, o likas na daluyan ng tubig na maaaring pana-panahon lamang ang agos. Maaari ring baybayin ang pangalan na “Kerith.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nasa harap ng Jordan.” Maaari rin itong unawaing “nasa silangan ng Jordan,” ayon sa heograpikong konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Umalis ka rito
  rationale: Tuwirang utos na lisanin ang kasalukuyang lugar; natural at malinaw sa modernong Filipino.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: at pumunta sa silangan
  rationale: Ipinahahayag ang pagharap o pagbabago ng direksiyon patungong silangan nang hindi pilit na ginagaya ang idyomatikong reflexive na לְךָ.
- source_word: וְנִסְתַּרְתָּ
  choice: Magtago ka
  rationale: 'Natural na katumbas ng Niphal na may reflexive na diwa: ilagay ang sarili sa pagtatago.'
- source_word: בְּנַחַל
  choice: sa tabi ng Wadi
  rationale: Maaaring tumukoy ang נחל sa bangin o daluyang maaaring pana-panahong may tubig; pinananatili ng “wadi” ang heograpikong diwa nang hindi ipinapalagay na palaging umaagos ang tubig.
- source_word: כְּרִית
  choice: Kerit
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang tunog at baybay na madaling basahin sa Filipino.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: na nasa tapat ng Jordan
  rationale: Pinananatili ang likas na kalabuan ng עַל־פְּנֵי, na maaaring mangahulugang nasa harap o katapat, sa halip na tiyaking nasa silangan kahit hindi iyon tahasang sinasabi ng parirala.
