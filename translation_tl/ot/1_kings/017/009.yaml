  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: tl
  text: “Tumindig ka at pumunta sa Sarepta, na kabilang sa Sidon,[a] at manatili ka roon. Tingnan mo,[b] inutusan ko roon ang isang biyuda na tustusan ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nasa Sidon” o “na malapit sa Sidon.” Sa Hebreo, tuwirang iniuugnay ang Sarepta sa Sidon, marahil bilang kaugnayang panrehiyon o pampolitika.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Narito.” Ang Hebreo ay “inutusan ko,” na maaari ring unawaing itinalaga o inihanda ng Diyos ang biyuda upang tustusan ka, kahit hindi pa ipinakikitang alam niya ang naturang utos.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Tumindig ka
  rationale: Ang pautos ng קום ay humihiling na bumangon o tumindig bago humayo. Likas at marangal sa modernong Filipino ang “Tumindig ka,” at napananatili nito ang puwersa ng utos.
- source_word: לֵ֤ךְ
  choice: pumunta
  rationale: Sa utos na nagsasaad ng paglalakbay patungo sa isang tiyak na lugar, malinaw at likas ang “pumunta.”
- source_word: צָרְפַתָ/ה֙
  choice: Sarepta
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lugar.
- source_word: אֲשֶׁ֣ר לְ/צִיד֔וֹן
  choice: na sakop ng Sidon
  rationale: Ipinahihiwatig ng לְ ang kaugnayang panrehiyon o pampolitika ng Sarepta sa Sidon. Ang “sakop ng” ay malinaw ngunit hindi labis na tiyak tungkol sa eksaktong uri ng ugnayan.
- source_word: וְ/יָשַׁבְתָּ֖ שָׁ֑ם
  choice: at manatili ka roon
  rationale: Ang anyong pandiwa, kasunod ng mga pautos, ay gumaganap bilang pagpapatuloy ng utos. Sinasaklaw ng “manatili” ang paninirahan doon nang hindi gumagamit ng makalumang pananalita.
- source_word: הִנֵּ֨ה
  choice: Tandaan mo
  rationale: Ang הִנֵּה ay pantawag-pansin. Sa kontekstong ito, likas sa Filipino ang “Tandaan mo” bilang paghahanda sa mahalagang pahayag na kasunod.
- source_word: צִוִּ֥יתִי
  choice: inutusan ko
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng צוה na “mag-utos,” sa halip na lutasin ang tensiyon sa salaysay sa pamamagitan ng “itinalaga” o “inihanda.”
- source_word: אִשָּׁ֥ה אַלְמָנָ֖ה
  choice: isang biyuda
  rationale: Ang literal na “isang babae, isang biyuda” ay likas at ganap na naihahayag sa Filipino bilang “isang biyuda.”
- source_word: לְ/כַלְכְּלֶֽ/ךָ
  choice: na tustusan ka
  rationale: Ang כלכל ay tumutukoy sa pagsustento o paglalaan ng kailangan. Ang “tustusan ka” ay maikli, natural, at mas malawak kaysa sa pagpapakain lamang.
theological_decisions:
- issue: Ang kahulugan ng pahayag ng Diyos na “inutusan” niya ang biyuda
  choice: Pinanatili ang tuwirang “inutusan ko.”
  alternative: “Itinalaga ko” o “inihanda ko” ang isang biyuda roon.
  rationale: Karaniwang nangangahulugang “mag-utos” ang צוה. Bagaman hindi pa ipinakikitang batid ng biyuda ang utos, dapat panatilihin ng salin ang tensiyong iyon sa halip na ipaliwanag ito sa mismong teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Iniwasan ang makalumang “magbangon ka” at ang sobrang kolokyal na pananalita. Pinanatili ang teolohikal na tensiyon ng “inutusan ko.”
