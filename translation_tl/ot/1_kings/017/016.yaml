base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: tl
  text: Hindi naubusan ng harina ang banga, at hindi naubusan ng langis ang sisidlan, ayon sa salitang sinabi ni Yahweh sa pamamagitan ni Elias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “sa kamay ni Elias,” isang idyomang nangangahulugang “sa pamamagitan ni Elias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: ang banga ... ng harina
  rationale: Ang כַּד ay isang sisidlang pambahay; natural sa Filipino ang “banga” para sa sisidlan ng harina. Isinaayos ang parirala bilang “Hindi naubusan ng harina ang banga” upang malinaw at likas ang pangungusap.
- source_word: לֹא כָלָתָה
  choice: hindi naubusan
  rationale: Sa kontekstong ito, ang כלה ay nangangahulugang hindi naubos o hindi natapos ang laman. Ang “hindi naubusan” ay likas na nagpapahayag ng patuloy na suplay.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: ang sisidlan ... ng langis
  rationale: Ang צַפַּחַת ay isang maliit na sisidlan, lalo na para sa langis. Pinili ang pangkalahatan ngunit malinaw na “sisidlan” upang hindi magdagdag ng tiyak na hugis na hindi sinasabi ng Hebreo.
- source_word: לֹא חָסֵר
  choice: hindi naubusan
  rationale: Ang חסר ay tumutukoy sa hindi pagkukulang o pagkaubos. Ang parehong parirala sa Filipino ay nagpapanatili sa paralelismo ng dalawang suplay.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salitang ... ni Yahweh
  rationale: Pinananatili nito ang ugnayan ng naganap sa naunang pahayag ni Yahweh at isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi
  rationale: Tuwirang ipinapahayag nito na ang salita ay naunang sinabi; sapat na ang aspektong Filipino upang maipakita ang pagkakasunod ng pangyayari.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: sa pamamagitan ni Elias
  rationale: Ang literal na “sa kamay ni Elias” ay isang Hebreong idyoma para sa ahensiya. Ang “sa pamamagitan ni Elias” ang natural at tumpak na katumbas sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Pormula ng ahensiya sa paghahatid ng pahayag ng propeta
  choice: sa pamamagitan ni Elias
  alternative: sa kamay ni Elias
  rationale: Malinaw na si Yahweh ang pinagmulan ng salita at si Elias ang taong ginamit sa paghahatid nito. Isinasalin ang kahulugan ng idyoma nang hindi nagdaragdag ng interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Elias,” ang nakasanayang anyo ng pangalang Elijah sa Filipino, at pinanatili ang paralelismo ng harina at langis nang hindi tinutukoy na langis ng olibo, sapagkat hindi iyon espesipikong sinasabi ng Hebreo.
