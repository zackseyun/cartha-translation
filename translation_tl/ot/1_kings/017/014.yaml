  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: tl
  text: 'Sapagkat ganito ang sabi ni Yahweh[a], ang Diyos ng Israel: “Hindi mauubos ang harina sa tapayan, at hindi mauubusan ng langis ang pitsel, hanggang sa araw na magbigay si Yahweh ng ulan sa ibabaw ng lupa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng apat na katinig na YHWH sa Hebreo.
    reason: translation_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang katumbas ng pariralang Hebreo at malinaw na pagkilala sa Diyos na tinutukoy sa pahayag ni Elias.
- source_word: כַּד הַקֶּמַח
  choice: ang harina sa tapayan
  rationale: Ang כַּד ay sisidlang pambahay. Inilipat sa likas na ayos ng Tagalog ang laman bilang simuno upang maging malinaw na harina, hindi ang sisidlan, ang hindi mauubos.
- source_word: לֹא תִכְלָה
  choice: hindi mauubos
  rationale: Ipinahahayag ng כלה ang pagdating sa katapusan o pagkaubos ng isang panustos; natural at eksakto ang “hindi mauubos” sa konteksto.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: pitsel ... ng langis
  rationale: Ang צַפַּחַת ay isang sisidlan, malamang na mas maliit kaysa כַּד. Pinananatili ng “pitsel” ang pagkakaiba ng dalawang sisidlan nang hindi dinaragdagan ang espesipikasyon ng teksto.
- source_word: לֹא תֶחְסָר
  choice: hindi mauubusan
  rationale: Ang חסר ay tumutukoy sa pagkulang o pagkaunti. Sa Tagalog, likas na inilalarawan ng “hindi mauubusan ng langis ang pitsel” ang hindi pagkukulang ng laman nito.
- source_word: עַד יוֹם
  choice: hanggang sa araw na
  rationale: Pinanatili ang tahasang temporal na parirala ng Hebreo.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: magbigay si Yahweh ng ulan
  rationale: Tuwirang isinasalin ang נתן bilang “magbigay,” sa halip na gawing mas interpretatibong “magpadala.”
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ang larawang Hebreo na “sa ibabaw/mukha ng lupa” sa isang nauunawaang anyong Tagalog.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin ipinipilit ang ibang tradisyonal na anyo ng pagbigkas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ganito ang sabi” bilang likas na pormula ng pahayag. Pinili ang “tapayan” at “pitsel” upang maipakita ang dalawang magkaibang sisidlan, habang ang ayos ng pangungusap ay bahagyang inayos para malinaw sa karaniwang mambabasa kung ano ang hindi mauubos.
