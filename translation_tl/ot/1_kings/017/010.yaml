base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: tl
  text: Kaya tumindig siya at pumunta sa Sarepta. Nang makarating siya sa pasukan ng lunsod[a], naroon ang isang biyuda na namumulot ng mga patpat. Tinawag niya ang babae at sinabi, “Pakikuha mo para sa akin ang kaunting tubig sa isang sisidlan, upang makainom ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tarangkahan ng lunsod.” Ang Hebreo ay nagsasabing “pasukan” o “bukana” (פֶּתַח), na mas malawak ang kahulugan kaysa sa mas tiyak na salitang “tarangkahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig siya
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng pagtindig upang kumilos. Pinananatili ng “tumindig” ang kilos at marangal na himig ng salaysay.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang pandiwa ang הלך para sa pagpunta o paglakad; natural sa Filipino ang “pumunta” sa pagkakasunod na ito.
- source_word: צָרְפַתָה
  choice: sa Sarepta
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa lugar. Ginamit ang nakaugaliang anyong Filipino na “Sarepta.”
- source_word: וַיָּבֹא אֶל פֶּתַח הָעִיר
  choice: Nang makarating siya sa pasukan ng lunsod
  rationale: Ang פֶּתַח ay malawak na tumutukoy sa bukana o pasukan, hindi tiyak na tarangkahan. Likas sa Filipino ang sugnay na “Nang makarating siya.”
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Itinatampok ng הִנֵּה ang biglang napansing tagpo. Sa modernong salaysay, naihahatid ng “naroon” ang pansin nang hindi gumagamit ng lipas na ekspresyon.
- source_word: אִשָּׁה אַלְמָנָה
  choice: isang biyuda
  rationale: Ang literal na “isang babae, isang biyuda” ay likas at sapat na naipapahayag sa Filipino bilang “isang biyuda.”
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: namumulot ng mga patpat
  rationale: Ang קשׁשׁ ay tumutukoy sa pangangalap ng maliliit na piraso ng kahoy o katulad na bagay; iniiwasan ng “mga patpat” ang pahiwatig ng malalaking troso.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Tinawag niya ito
  rationale: Ang קרא na may אֶל ay pagtawag sa isang tao. Ang “ito” ay natural na panghalip sa salaysay para sa taong kalapit o bagong binanggit.
- source_word: קְחִי נָא
  choice: Pakikuha mo ako
  rationale: Literal na “kunin” ang לקח, at ang נָא ay nagpapalambing o nagpapagalang sa pakiusap. Natural sa Filipino ang “pakikuha mo ako” para sa bagay na nais dalhin sa nagsasalita.
- source_word: מְעַט מַיִם
  choice: kaunting tubig
  rationale: Tuwirang ipinapahayag ng “kaunti” ang maliit na dami na tinutukoy ng מְעַט.
- source_word: בַּכְּלִי
  choice: sa isang sisidlan
  rationale: Pangkalahatang katawagan ang כְּלִי para sa lalagyan o sisidlan; hindi ito nilimitahan sa banga o anumang tiyak na uri.
- source_word: וְאֶשְׁתֶּה
  choice: upang makainom ako
  rationale: Ang cohortative ay nagpapahayag ng layunin o ninanais na bunga; malinaw itong naihahatid ng “upang makainom ako.”
