translation_notes:
  register: Modernong Filipino na may marangal na himig ng salaysay. Pinili ang “lunsod” at “sisidlan” bilang malinaw ngunit hindi kolokyal; iniwasan ang sobrang espesipikong “tarangkahan” at “banga” upang mapanatili ang lawak ng Hebreo.
