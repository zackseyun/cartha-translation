base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng babae kay Elias, “Ngayon ay alam ko na na ikaw ay isang tao ng Diyos, at ang salita ni Yahweh na nasa iyong bibig ay katotohanan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang salita ni Yahweh na nasa iyong bibig ay totoo” o “ay maaasahan.” Maaaring idiin ng pangngalang Hebreo ang katotohanan, pagiging totoo, o pagiging mapagkakatiwalaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Bagaman siya ang balo na naunang binanggit, “ang babae” ang tuwirang kahulugan dito at hindi inuulit ang paglalarawang wala sa mismong talata.
- source_word: אֶל אֵלִיָּהוּ
  choice: kay Elias
  rationale: Karaniwang anyong Tagalog para sa taong pinagsabihan; ginamit ang nakaugaliang Tagalog na anyo ng pangalan.
- source_word: עַתָּה זֶה יָדַעְתִּי
  choice: Ngayon ay alam ko na
  rationale: Ipinahahayag ng parirala ang kasalukuyan at matibay na pagkakilala bunga ng katatapos na pangyayari; ang hulaping “na” ay likas na naghahatid ng pagbabagong ito sa Tagalog.
- source_word: אִישׁ אֱלֹהִים
  choice: isang tao ng Diyos
  rationale: Pinananatili ang kinikilalang katawagang Hebreo para sa isang taong kabilang sa Diyos at nagsasalita para sa kanya, nang hindi ito agad pinapakahulugang “propeta” o “lingkod.”
- source_word: וּדְבַר יְהוָה
  choice: at ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang propetikong pormula at masaklaw na kahulugan ng דָּבָר; isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: בְּפִיךָ
  choice: na nasa iyong bibig
  rationale: Pinananatili ang malinaw na larawang Hebreo tungkol sa salitang ipinahahayag sa pamamagitan ng bibig ng propeta.
- source_word: אֱמֶת
  choice: ay katotohanan
  rationale: Pinananatili ang anyong pangngalan at ang mariing pagpapatunay ng babae, habang kinikilala sa talababa na maaari rin itong tumukoy sa pagiging totoo o maaasahan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang pangalan ng tipan na יהוה; pinananatili ito bilang pangalang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng אִישׁ אֱלֹהִים
  choice: tao ng Diyos
  alternative: propeta; lingkod ng Diyos
  rationale: Pinananatili ang katawagan ng pinagmulang teksto nang hindi nililimitahan ang kahulugan nito sa isang tungkulin o interpretasyong teolohikal.
- issue: Predikasyon ng אֱמֶת
  choice: ang salita ... ay katotohanan
  alternative: ang salita ... ay totoo; ang salita ... ay maaasahan
  rationale: Ang Hebreo ay gumagamit ng pangngalang maaaring magdiin sa katotohanan, pagiging totoo, o pagiging mapagkakatiwalaan. Pinananatili sa teksto ang anyong pangngalan at inilalahad ang ibang saklaw sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mga larawang “tao ng Diyos” at “nasa iyong bibig” dahil nauunawaan ang mga ito sa konteksto at mahalaga sa himig ng tekstong Hebreo. Ang “Ngayon ay alam ko na” ay likas na Tagalog para sa mariing pagkilalang ipinahahayag ng עַתָּה זֶה יָדַעְתִּי.
