  to: Sinabi ni Elias sa kanya, “Huwag kang matakot. Sige, gawin mo ang sinabi mo. Ngunit mula roon, igawa mo muna ako ng isang maliit na tinapay[a] at dalhin mo ito sa akin. Pagkatapos ay gumawa ka naman ng tinapay para sa iyo at sa iyong anak.”
