base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: tl
  text: Sinabi ni Elias sa kanya, “Huwag kang matakot. Sige, gawin mo ang sinabi mo. Ngunit mula roon, igawa mo muna ako ng isang maliit na tinapay[a] at dalhin mo ito sa akin. Pagkatapos ay gumawa ka naman ng tinapay para sa iyo at sa iyong anak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang maliit na cake.” Ang Hebreong עֻגָה ay maaaring tumukoy sa isang maliit na niluto o inihurnong tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Huwag kang matakot
  rationale: Likas at malinaw na modernong Tagalog para sa pagbabawal na matakot.
- source_word: בֹּאִי
  choice: Humayo ka
  rationale: Bagaman literal na “halika,” gumaganap dito ang pandiwa bilang pag-uudyok na magpatuloy sa gagawin; ang “humayo ka” ay akma sa kontekstong paghahanda ng pagkain.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: gawin mo ang sinabi mo
  rationale: Natural na Tagalog na nagpapanatili sa diwang kumilos ayon sa naunang sinabi ng babae.
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapakilala ito ng mahalagang kondisyon o pagbubukod sa naunang utos.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Pinananatili ang literal na pang-abay na tumutukoy sa kakaunting sangkap na nabanggit sa konteksto.
- source_word: עֻגָה קְטַנָּה
  choice: isang maliit na tinapay
  rationale: Ang עֻגָה ay isang maliit na nilutong tinapay o cake; mas malinaw sa ordinaryong Tagalog ang “tinapay” sa kontekstong harina at langis, nang hindi tinutukoy nang labis ang hugis.
- source_word: בָרִאשֹׁנָה
  choice: muna
  rationale: Likas na ipinahahayag ng “muna” ang tahasang temporal na prayoridad sa Tagalog.
- source_word: וְהוֹצֵאתְ לִי
  choice: at dalhin mo iyon sa akin
  rationale: Malinaw at natural na pagsasalin ng Hiphil ng יצא, na may diwang ilabas at dalhin kay Elias.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: gumawa ka naman para sa iyo at sa iyong anak
  rationale: Ang layon ay ipinahihiwatig mula sa naunang sugnay; hindi na kailangang ulitin ang “tinapay” upang maging natural.
- source_word: בָּאַחֲרֹנָה
  choice: Pagkatapos
  rationale: Tumpak na ipinakikita ang kasunod na pagkakasunod-sunod ng paghahanda.
theological_decisions:
- issue: Maaaring pag-unawang etikal o teolohikal sa kahilingan ni Elias na siya ang pakainin muna
  choice: Tahasang pinanatili ang temporal na prayoridad sa “igawa mo muna ako” at “Pagkatapos”
  alternative: Palambutin o ipaliwanag sa mismong teksto ang kahilingan ni Elias
  rationale: Malinaw sa Hebreo na unang ihahanda ang bahagi ni Elias at saka ang para sa babae at sa anak niya. Pinananatili ng salin ang tensiyong ito nang walang idinagdag na paghatol o paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Elias,” ang nakaugaliang anyong Tagalog ng pangalan. Ang “humayo” ay bahagyang pormal ngunit malinaw at angkop sa salaysay sa Kasulatan. Ang footnote marker [a] ay inilagay mismo sa pangunahing teksto.
