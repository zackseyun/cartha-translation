  terminology: Ang “Elias,” “Huwag kang matakot,” at “maliit na tinapay” ay angkop sa modernong Filipino Tagalog at sa rehistro ng salaysay. Ang alternatibong “bibingka” sa footnote ay masyadong tiyak at may natatanging kulturang Filipino na konotasyon; pinalitan ito ng mas neutral na “maliit na cake.”
