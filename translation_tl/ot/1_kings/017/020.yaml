base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: tl
  text: Pagkatapos, dumaing siya kay Yahweh at sinabi, “O Yahweh na aking Diyos, nagdulot ka rin ba ng kapahamakan[a] sa balong aking tinutuluyan[b], na naging sanhi ng pagkamatay ng kanyang anak?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “gumawa ka rin ba ng masama sa balo”; ang pandiwang Hebreo ay maaaring tumukoy sa paggawa ng masama, pagdudulot ng pinsala o kapahamakan, o masamang pakikitungo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa balong kasama kong naninirahan bilang dayuhan”; ipinahihiwatig ng Hebreo ang pansamantalang paninirahan bilang panauhin o taong umaasa sa kumukupkop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: dumaing siya kay Yahweh
  rationale: Sa konteksto ng apurahang panalangin, ang קרא אל ay higit sa karaniwang pagtawag; ipinahihiwatig nito ang marubdob na pagdaing o pagsamo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: יְהוָה אֱלֹהָי
  choice: O Yahweh na aking Diyos
  rationale: Likas at marangal na tuwirang pagtawag sa Filipino, habang pinananatili ang panghalip na paari sa אֱלֹהָי.
- source_word: הֲגַם
  choice: rin ba
  rationale: 'Pinagsasama nito ang patanong at pandagdag na diwa: nagugulat si Elias na ang sakunang ito ay nadagdag pa sa dating paghihirap.'
- source_word: הֲרֵעוֹתָ
  choice: nagdulot ka ... ng kapahamakan
  rationale: Ang hiphil ng רעע ay maaaring tumukoy sa pagdudulot ng pinsala o sakuna, hindi kinakailangang sa paggawa ng moral na kasamaan.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: tinuluyan ko
  rationale: Ipinahihiwatig ng hitpael ng גור ang paninirahan bilang pansamantalang panauhin o taong umaasa sa pagpapatuloy ng iba; natural itong ipinahahayag ng “tinuluyan ko.”
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: sa pagdudulot ng kamatayan sa anak niya
  rationale: Pinananatili nito ang sanhi o resultang ipinahahayag ng infinitive na לְהָמִית at ang tahasang pag-uugnay ng panalangin sa pagkamatay ng anak, nang hindi ipinapalagay ang paraang hindi sinabi ng teksto.
theological_decisions:
- issue: Kung ang panalangin ni Elias ay tahasang nagpaparatang sa Diyos ng moral na kasamaan o nagluluksa sa kapahamakang idinulot ng Diyos
  choice: “nagdulot ka rin ba ng kapahamakan ... sa pagdudulot ng kamatayan”
  alternative: “gumawa ka rin ba ng masama sa balo ... sa pagpatay sa anak niya”
  rationale: Saklaw ng הֲרֵעוֹתָ ang pinsala, kapahamakan, o masamang pakikitungo. Pinananatili ng salin ang matapang na pag-uugnay ni Elias sa Diyos at sa pagkamatay ng bata, ngunit hindi nito nililimitahan ang salita sa paratang ng moral na kasamaan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dumaing” upang maipakita ang tindi ng panalangin, at pinanatili ang pangalan na “Yahweh.” Ang bahagyang pag-uulit ng “nagdulot/pagdudulot” ay sinadya upang mapanatili ang sanhi at resulta sa Hebreo nang hindi gawing labis na tahasan o moralistiko ang pahayag.
