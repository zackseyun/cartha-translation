  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: marubdob na panawagan ni Elias kay Yahweh, ang pandagdag na tanong na “rin ba,” ang kapahamakang nauukol sa balo, at ang pagkamatay ng anak. Gayunman, ang “sa pagdudulot ng kamatayan sa anak niya” ay hindi likas at malabo sa Filipino; dapat itong gawing mas tuwirang pahayag ng sanhi nang hindi ipinipilit ang moral na kahulugan ng רעע.'
  naturalness: Ang “dumaing siya kay Yahweh” at “O Yahweh na aking Diyos” ay natural at angkop sa marangal na rehistro. Mas malinaw ang “balong aking tinutuluyan” kaysa “balong tinutuluyan ko,” at mas natural ang “na naging sanhi ng pagkamatay ng kanyang anak” kaysa sa paulit-ulit na “nagdulot/pagdudulot.”
  terminology: Ang “Yahweh,” “Diyos,” “kapahamakan,” at “balo” ay angkop. Pinananatili ng “kapahamakan” ang saklaw ng הֲרֵעוֹתָ bilang pinsala o sakuna at hindi ito ginagawang tuwirang paratang ng moral na kasamaan. Ang talababa b ay kailangang tumukoy sa tao, hindi sa lugar, upang tumugma sa pinagmulan at sa angkla nito.
