    rationale: Ang Hebreong לְהָמִית ay nagsasaad ng pagdudulot ng pagkamatay/pagpatay. Ang binagong parirala ay mas malinaw na nagsasaad ng ugnayang sanhi nang hindi gumagamit ng di-natural na kolokasyon.
