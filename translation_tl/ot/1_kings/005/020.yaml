base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: tl
  text: Kaya ngayon, iutos mong magputol sila para sa akin ng mga sedro mula sa Lebanon. Makikisama ang mga lingkod ko sa mga lingkod mo, at ibibigay ko sa iyo ang sahod ng mga lingkod mo ayon sa anumang sabihin mo. Sapagkat alam mong walang ni isang lalaking marunong magputol ng mga puno[a] sa amin, gaya ng mga Sidonio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magputol ng troso.” Ang Hebreo ay literal na “magputol ng mga puno,” ngunit pag-aani ng troso ang tinutukoy sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang pandiskurso na nag-uugnay sa naunang paliwanag at nagpapakilala sa kasalukuyang kahilingan.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: iutos mong magputol sila para sa akin
  rationale: Pinananatili ang tuwirang pautos at ang jussive na kahulugang ang mga tauhan ng kausap ang magsasagawa ng pagputol.
- source_word: אֲרָזִים מִן־הַלְּבָנוֹן
  choice: mga sedro mula sa Lebanon
  rationale: Ang “sedro” ang karaniwang katawagan sa punong-kahoy at troso na hinihingi; malinaw na Lebanon ang pinagmumulan.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: Sasama ang mga lingkod ko sa mga lingkod mo
  rationale: Natural sa Filipino at ipinahahayag ang isinaayos na pagtutulungan; pinananatili ang pag-uulit ng עבד bilang “lingkod.”
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: ibibigay ko sa iyo ang sahod ng mga lingkod mo
  rationale: Tahasang ipinakikita ng שׂכר na kabayaran sa paggawa, hindi isang pangkalahatang regalo, ang tinutukoy.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: ayon sa anumang sabihin mo
  rationale: Natural na katumbas na pinananatili ang lawak ng mga kondisyong itatakda ng kausap.
- source_word: אֵין בָּנוּ אִישׁ
  choice: wala sa amin ni isang lalaki
  rationale: Pinananatili ang tahasang אִישׁ at ang diwa na walang lalaki sa kanilang hanay na may gayong kasanayan.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: marunong magputol ng mga puno
  rationale: Ipinahahayag ng יֹדֵעַ ang kasanayan, at ang “magputol ng mga puno” ay malapit sa literal na parirala habang ang konteksto ay pagtotroso.
- source_word: כַּצִּדֹנִים
  choice: gaya ng mga Sidonio
  rationale: Pinananatili ang tuwirang paghahambing sa kinikilalang kasanayan ng mga taga-Sidon.
