translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na himig ng pormal na kahilingan sa pagitan ng mga hari. Ginamit ang “lingkod” para mapanatili ang katawagang panlipunan ng teksto nang hindi awtomatikong ipinapalagay ang pagkaalipin.
