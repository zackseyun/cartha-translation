base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: tl
  text: Ang mga opisyal na ito ay nagtustos para kay Haring Solomon at sa lahat ng lumalapit sa hapag ni Haring Solomon[a], bawat isa sa kaniyang buwan[b]; wala silang kinulang sa anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga opisyal” ay maaari ding isaling “mga pinuno” o “mga tagapangasiwa.” Tumutukoy ang Hebreo sa mga itinalagang tagapangasiwa ng mga distrito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bawat isa sa kaniyang buwan”; ipinahihiwatig nito ang salit-salitang buwanang pananagutan sa pagtustos.
    reason: idiom_clarification
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: naglaan ng pagkain para
  rationale: Ang piel ng כלכל sa kontekstong ito ay tumutukoy sa pagtustos ng mga pangangailangan ng sambahayan ng hari. Nililinaw ng “pagkain” ang kaugnayan nito sa hapag, nang hindi inilalarawan ang paraang ginamit sa pagtustos.
- source_word: הַנִּצָּבִים
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga itinalagang tagapangasiwa ng mga distrito. Natural at madaling maunawaan ang “mga pinuno,” habang ipinapaliwanag sa talababa ang mas tiyak na tungkulin.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: at sa lahat ng lumalapit sa hapag ni Haring Solomon
  rationale: Pinananatili nito ang larawang Hebreo ng paglapit sa hapag at ang posibleng diwa ng pagkakaroon ng daan sa hapag ng hari.
- source_word: אִישׁ חָדְשׁוֹ
  choice: Bawat isa ay gumawa nito sa buwan na nakatalaga sa kanya
  rationale: Ipinahahayag nito sa natural na Tagalog ang buwanang salitan ng pananagutan, habang pinananatili ang distributibong diwa ng אִישׁ.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: tiniyak nilang walang anumang nagkulang
  rationale: Ipinakikita nito na walang kinakailangang panustos ang naiwang kulang; ang pangmaramihang pandiwa ay iniuugnay sa mga pinuno.
