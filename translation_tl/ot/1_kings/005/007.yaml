translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang larawang “lumalapit sa hapag,” ngunit nilinaw ang idyoma ng buwanang salitan sa pangunahing teksto. Ang lahat ng talababa ay may katugmang pananda sa teksto.
