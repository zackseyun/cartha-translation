  naturalness: Natural ang pangkalahatang daloy, ngunit mas tuwiran at mas malapit sa Hebreo ang “nagtustos” at “wala silang kinulang sa anuman.” Iniiwasan din nito ang bahagyang mabigat na “Bawat isa ay gumawa nito.”
  terminology: Ang “mga pinuno” ay posible, ngunit ang “mga opisyal” ang mas tiyak at hindi gaanong malabo sa makabagong Filipino para sa mga itinalagang administrador. Napananatili ang “hapag ni Haring Solomon” at ang pangalang “Haring Solomon.”
