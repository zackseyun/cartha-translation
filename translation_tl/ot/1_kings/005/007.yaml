revisions:
- from: Ang mga pinunong ito ang naglaan ng pagkain para kay Haring Solomon at sa lahat ng lumalapit sa hapag ni Haring Solomon[a]. Bawat isa ay gumawa nito sa buwan na nakatalaga sa kanya[b], at tiniyak nilang walang anumang nagkulang.
  to: Ang mga opisyal na ito ay nagtustos para kay Haring Solomon at sa lahat ng lumalapit sa hapag ni Haring Solomon[a], bawat isa sa kaniyang buwan[b]; wala silang kinulang sa anuman.
  rationale: Pinalitan ang mas makitid na “naglaan ng pagkain” ng “nagtustos” upang saklawin ang Hebreong diwa ng paglalaan ng mga panustos. Ginawang “mga opisyal” ang katawagan para sa mga itinalagang administrador, at pinalitan ang dagdag na diwang “tiniyak nilang” ng tuwirang “wala silang kinulang sa anuman.” Pinanatili ang larawan ng paglapit sa hapag at ang idyoma ng buwanang pag-ikot, na nililinaw sa talababa.
