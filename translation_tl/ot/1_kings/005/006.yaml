  text: וַ/יְהִ֣י לִ/שְׁלֹמֹ֗ה אַרְבָּעִ֥ים אֶ֛לֶף אֻרְוֺ֥ת סוּסִ֖ים לְ/מֶרְכָּב֑/וֹ וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/006.yaml
  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: tl
  text: May apatnapung libong kulungan ng kabayo si Solomon para sa kanyang mga karwahe,[a] at labindalawang libong mangangabayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga puwesto ng kabayo”; mas tiyak na tumutukoy ang Hebreo sa mga kulungan o kainan ng mga kabayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: May ... si Solomon
  rationale: Ang Hebreong pariralang ויהי ל na may taglay ay nagpapahayag ng pag-aari o pagkakaroon. Likas itong ipinahahayag sa modernong Tagalog sa hulma na “May ... si Solomon.”
- source_word: אַרְבָּעִים אֶלֶף
  choice: apatnapung libo
  rationale: Tuwirang salin ng bilang, na nilagyan ng pang-angkop bago ang kasunod na pangngalan.
- source_word: אֻרְוֺת
  choice: kulungan
  rationale: Tumutukoy ang salita sa mga puwesto o kainan na pinaglalagyan ng mga kabayo, hindi kinakailangang sa buong gusali. Ang “kulungan” ay malinaw at likas sa karaniwang Tagalog; inilalahad sa talababa ang mas tiyak na diwa.
- source_word: סוּסִים
  choice: kabayo
  rationale: Karaniwang salin ng pangngalan; likas sa Tagalog ang anyong hindi minarkahan para sa maramihan pagkatapos ng bilang.
- source_word: לְמֶרְכָּבוֹ
  choice: para sa kanyang mga karwahe
  rationale: Ang pang-isahang anyo na may hulaping paari ay ginagamit dito nang kolektibo para sa mga karwahe ni Solomon. Nililinaw ng “mga karwahe” ang kolektibong diwa at pinananatili ang kontekstong militar.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: at labindalawang libo
  rationale: Tuwirang salin ng pariralang bilang.
- source_word: פָּרָשִׁים
  choice: mangangabayo
  rationale: Karaniwang tumutukoy ang salita sa mga taong nakasakay sa kabayo. Mas tuwiran ang “mangangabayo” kaysa “kawal na nakakabayo,” at hindi nito ipinapalagay na mga tagapagmaneho sila ng karwahe.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “karwahe” sa diwang sinaunang sasakyang pandigma at ang “mangangabayo” para sa nakasakay na tauhang militar. Pinanatili ang bilang na apatnapung libo ayon sa WLC, nang hindi itinatama batay sa kaibang tekstuwal na tradisyon.
