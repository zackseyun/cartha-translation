base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: tl
  text: Nagbigay si Solomon kay Hiram ng dalawampung libong kor ng trigo bilang pagkain para sa kanyang sambahayan[a], at dalawampung kor ng langis na ginawa sa pagdurog[b]. Ganito ang karaniwan niyang ibinibigay kay Hiram taon-taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang panustos para sa kanyang sambahayan.” Malamang na tumutukoy ang Hebreo sa pagkaing inilaan para sa maharlikang sambahayan ni Hiram.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa de-kalidad na langis na ginagawa sa pamamagitan ng pagdurog o pagdikdik, sa halip na sa huling proseso ng pagpiga. Sa kontekstong ito, malamang na langis ng olibo ang tinutukoy, bagaman hindi tahasang binanggit ang olibo sa Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: nagbigay / ibinibigay
  rationale: Ang qatal ay isinaling payak na naganap, samantalang ang imperfect na may כֹּה at שָׁנָה בְשָׁנָה ay isinaling pangkaraniwang paulit-ulit na gawain sa nakaraan; sa Filipino, malinaw ito sa konteksto kahit walang tahasang panandang “noon.”
- source_word: כֹּר
  choice: kor
  rationale: Pinanatili ang tiyak na sinaunang yunit sa transliterasyong madaling bigkasin sa Filipino, sa halip na gawing malabong “takal.”
- source_word: חִטִּים
  choice: trigo
  rationale: Tiyak na trigo ang tinutukoy, hindi lamang butil sa pangkalahatan.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: bilang pagkain para sa sambahayan nito
  rationale: Ang מַכֹּלֶת ay pagkain o panustos, at ang בֵּיתוֹ rito ay likas na tumutukoy sa sambahayan o korte ni Hiram. Ginamit ang “nito” upang malinaw na si Hiram, hindi si Solomon, ang tinutukoy.
- source_word: שֶׁמֶן כָּתִית
  choice: langis na mula sa dinurog na mga olibo
  rationale: Ipinahahayag nang natural ang paraang tinutukoy ng כָּתִית. Bagaman hindi tahasang binanggit ang olibo sa parirala, ito ang likas na tinutukoy na langis sa kontekstong Hebreo; nilagyan ng tala ang paraang paggawa.
- source_word: כֹּה
  choice: Ganito
  rationale: Ipinakikilala nito ang paraan o huwaran ng taunang kasunduan.
- source_word: שָׁנָה בְשָׁנָה
  choice: taon-taon
  rationale: Natural at malinaw na katumbas ng regular na taunang pag-uulit.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sinaunang yunit na “kor” at ipinaliwanag sa daloy ang teknikal na pariralang tumutukoy sa langis. Ang “sambahayan” ay mas angkop kaysa literal na “bahay” dahil kabilang dito ang maharlikang korte at mga tauhan ni Hiram.
