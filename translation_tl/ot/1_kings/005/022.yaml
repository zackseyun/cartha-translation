base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: tl
  text: Pagkatapos, nagpadala ng mensahe si Hiram kay Solomon. Sinabi niya, “Narinig ko ang mensaheng ipinadala mo sa akin.[a] Gagawin ko ang lahat ng nais mo tungkol sa kahoy na sedro at kahoy na sipres.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Narinig ko ang hiniling mo sa akin.” Mas literal sa Hebreo ang “ang ipinadala mo sa akin,” na maaaring tumukoy sa mensahe ni Solomon bilang isang kahilingan.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: בְּרוֹשִׁים (beroshim). Hindi tiyak ang eksaktong uri ng puno; isinasalin din itong “dyuniper” o “abeto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל־שְׁלֹמֹה
  choice: Pagkatapos, nagpadala ng mensahe si Hiram kay Solomon
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay. Nilinaw ng “mensahe” ang likas na ipinahihiwatig ng pagpapadala sa kontekstong ito nang hindi ito ginagawang tahasang kahilingan.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Natural na paraang Filipino upang ipakilala ang tuwirang pahayag, sa halip na ang mas literal ngunit matigas na “na sinasabi.”
- source_word: שָׁמַעְתִּי אֵת אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: Narinig ko ang mensaheng ipinadala mo sa akin
  rationale: Pinananatili ang pandiwang “narinig” at ang larawan ng isang bagay na ipinadala, habang ginagawang malinaw at natural sa Filipino na mensahe ang tinutukoy.
- source_word: אֲנִי אֶעֱשֶׂה אֶת כָּל חֶפְצְךָ
  choice: Gagawin ko ang lahat ng nais mo
  rationale: Pinananatili ang malawak na kahulugan ng עשה at חפץ nang hindi pa ito nililimitahan sa “ibibigay” o sa ibang mas tiyak na gawain.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: tungkol sa kahoy na sedro
  rationale: Ang ב ay tumutukoy sa larangan o bagay na saklaw ng pangako; ang “kahoy” ay angkop sa konteksto ng materyales sa pagtatayo.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: at kahoy na sipres
  rationale: Karaniwang makabagong katumbas ang “sipres,” ngunit hindi tiyak ang eksaktong uri ng punong tinutukoy ng salitang Hebreo, kaya itinala ang ibang posibilidad sa talababa.
