translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpadala ng mensahe” at hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang tuwirang pahayag at ang hindi tiyak na uri ng beroshim sa talababa.
