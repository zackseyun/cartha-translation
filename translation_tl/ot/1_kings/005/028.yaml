translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “salit-salitan” para sa sistema ng rotasyon, “kani-kanilang tahanan” upang natural na maipakita ang kolektibong diwa ng isahang hulapi, at “sapilitang paggawa” upang huwag palambutin ang mapilit na kahulugan ng מַס.
