base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: tl
  text: Ipinadala niya sila sa Lebanon, sampung libo bawat buwan, sa mga salitan[a]. Isang buwan silang mananatili sa Lebanon at dalawang buwan sa kani-kanilang tahanan[b]. Si Adoniram ang namamahala sa sapilitang paggawa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng pagpapalitan” o “sa nagpapalitang mga pangkat.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kanyang bahay”; ang diwa ay umuuwi ang bawat manggagawa nang dalawang buwan sa pagitan ng tig-isang buwang paglilingkod sa Lebanon.
    reason: lexical_alternative
  - marker: c
    text: O “sapilitang paglilingkod” o “atas na sapilitang paggawa”; ang salitang Hebreo ay tumutukoy sa sapilitang paggawa o paglilingkod na ipinapataw ng pamahalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Ipinadala niya sila
  rationale: Tuwirang ipinahahayag ang kilos ng pagpapadala at pinananatili ang panghalip na tumutukoy kay Solomon ayon sa konteksto.
- source_word: לְבָנוֹנָה
  choice: sa Lebanon
  rationale: Ang directional ending ay nagpapahiwatig ng patungong Lebanon; natural sa Filipino ang “sa Lebanon” kasunod ng “ipinadala.”
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: sampung libo bawat buwan
  rationale: Distributibo ang parirala sa konteksto ng buwanang pagpapalit ng mga manggagawa.
- source_word: חֲלִיפוֹת
  choice: na salit-salitan
  rationale: Ipinahahayag ang sunod-sunod o nagpapalitang pangkat nang malinaw at natural sa modernong Filipino.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: Isang buwan silang mananatili sa Lebanon
  rationale: Nililinaw ng “isang” ang haba ng takdang paglilingkod, kaagapay ng kasunod na “dalawang buwan.”
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: dalawang buwan sa kani-kanilang tahanan
  rationale: Literal na “sa kanyang bahay,” ngunit kolektibo ang isahang hulapi; ang Filipino na “kani-kanilang tahanan” ay malinaw na tumutukoy sa tahanan ng bawat manggagawa.
- source_word: וַאֲדֹנִירָם עַל הַמַּס
  choice: Si Adoniram ang namamahala sa sapilitang paggawa
  rationale: Ang עַל ay nagpapahiwatig ng pamamahala, at ang מַס ay tumutukoy sa sapilitang serbisyong paggawa na ipinapataw ng estado.
