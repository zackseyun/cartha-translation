revisions:
- from: Alam mo na ang aking amang si David ay hindi nakapagtayo ng isang bahay para sa pangalan ni Yahweh na kanyang Diyos dahil sa mga digmaang nakapalibot sa kanya, hanggang sa ilagay ni Yahweh ang mga iyon sa ilalim ng mga talampakan ng kanyang mga paa.[a]
  to: Alam mo na ang aking amang si David ay hindi nakapagtayo ng isang bahay para sa pangalan ni Yahweh na kanyang Diyos dahil sa pakikidigmang nakapaligid sa kanya, hanggang sa ilagay sila ni Yahweh sa ilalim ng mga talampakan ng kanyang mga paa.[a]
  rationale: Inayos ang bilang ng “pakikidigma” upang tumugma sa isahang kolektibong pangngalang Hebreo, at pinalitan ang “mga iyon” ng “sila” upang panatilihin ang maramihang panghalip nang hindi labis na nilulutas ang tinutukoy nito. Inalis din ang idinagdag na “ganap” sa talababa.
