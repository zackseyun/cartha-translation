  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: tl
  text: Alam mo na ang aking amang si David ay hindi nakapagtayo ng isang bahay para sa pangalan ni Yahweh na kanyang Diyos dahil sa pakikidigmang nakapaligid sa kanya, hanggang sa ilagay sila ni Yahweh sa ilalim ng mga talampakan ng kanyang mga paa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ilalim ng kanyang mga paa.” Mas buo sa Hebreo ang “sa ilalim ng mga talampakan ng kanyang mga paa,” isang larawan ng pagpapasailalim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Alam mo
  rationale: Ang tahasang panghalip at perfect na anyo ng ידע ay likas na nagpapahayag dito ng kasalukuyang kaalaman ng kausap; malinaw at natural ang “Alam mo” sa modernong Tagalog.
- source_word: בַּיִת
  choice: isang bahay
  rationale: Pinananatili nito ang karaniwang kahulugan ng anarthrous na pangngalan at ang Hebreong idyomang pagtatayo ng bahay para sa pangalan ng Diyos, nang hindi agad pinapalitan ng mas interpretatibong “templo.”
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: para sa pangalan ni Yahweh na kanyang Diyos
  rationale: Pinananatili ang tipanang idyomang “para sa pangalan” sa halip na gawing “para sa karangalan,” at malinaw na iniuugnay kay David ang “kanyang Diyos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos sa teksto.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: dahil sa mga digmaang nakapalibot sa kanya
  rationale: Ang “mga digmaan” ay likas na Tagalog para sa patuloy at sari-saring armadong tunggaliang nakapalibot kay David; pinananatili rin ang larawan ng pagkapalibot.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: hanggang sa ilagay ni Yahweh ang mga iyon
  rationale: Ang נתן kasama ng pariralang “sa ilalim ng mga paa” ay nagsasaad ng pagpapasailalim. Ang “mga iyon” ay hindi tahasang nagpapangalan sa tinutukoy ng panlalaking maramihang panghalip, kaya hindi nito labis na nilulutas ang bahagyang kalabuan ng Hebreo.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: sa ilalim ng mga talampakan ng kanyang mga paa
  rationale: Tumpak na pinananatili ang buong larawang Hebreo ng lubos na pagpapasailalim, sapagkat ang כפות ay tumutukoy sa mga talampakan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Larawan ng pagpapasailalim sa mga kaaway o salungatan
  choice: ilagay … sa ilalim ng mga talampakan ng kanyang mga paa
  alternative: pasukuin sa kanya
  rationale: Pinananatili ng salin ang konkretong larawan at teolohikal na pahayag na si Yahweh ang nagbigay ng tagumpay, nang hindi ito pinapantay lamang sa abstraktong “pagpapasuko.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang Hebreong idyomang “para sa pangalan” at ang konkretong larawan ng mga talampakan. Ginamit ang “mga digmaan” upang maipahayag ang patuloy na pakikidigma at upang maging natural ang maramihang pagtukoy sa kasunod na sugnay.
