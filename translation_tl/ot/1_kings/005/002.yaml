  text: Solomon’s provision for one day was thirty cors of fine flour and sixty cors of meal[b][a],
translation:
  language: tl
  text: Ang panustos na pagkain ni Solomon para sa isang araw ay tatlumpung kor ng pinong harina at animnapung kor ng harina.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang kor ay isang malaking sinaunang panukat para sa tuyong sangkap. Ang Hebreo ay tahasang nagsasabing “tatlumpung kor” at “animnapung kor.”
    reason: cultural_note
  - marker: b
    text: Literal na “tinapay”; dito, mas malawak ang kahulugan nito at tumutukoy sa panustos na pagkain ni Solomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinapahayag ng anyong pasalaysay ng היה ang kalagayan sa daloy ng salaysay. Natural sa Tagalog ang panaguring may “ay”; hindi kailangan ang tahasang “at nangyari” o “ngayon.”
- source_word: לֶחֶם שְׁלֹמֹה
  choice: ang panustos na pagkain ni Solomon
  rationale: 'Bagaman literal na “tinapay ni Solomon,” mas malawak ang gamit ng לֶחֶם dito: ang araw-araw na pagkaing inilaan sa sambahayan ng hari.'
- source_word: לְיוֹם אֶחָד
  choice: sa bawat araw
  rationale: Tumutukoy ang parirala sa dami ng panustos para sa isang araw; malinaw at likas sa konteksto ng talaang administratibo ang “sa bawat araw.”
- source_word: שְׁלֹשִׁים כֹּר
  choice: tatlumpung kor
  rationale: Pinanatili ang sinaunang yunit na כֹּר bilang “kor” sa halip na gawing di-tiyak na modernong katumbas.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ang סֹלֶת ay harina na pino ang pagkakagiling o mataas ang uri.
- source_word: וְשִׁשִּׁים כֹּר
  choice: at animnapung kor
  rationale: Pinanatili ang parehong yunit at ang tahasang bilang ng tekstong Hebreo.
- source_word: קָמַח
  choice: karaniwang harina
  rationale: Ang קָמַח ay pangkalahatang salita para sa harina. Ang “karaniwang harina” ay nagpapanatili ng pagkakaiba nito sa naunang pinong harina nang hindi ito ginagawang ibang produktong hindi tiyak sa Hebreo.
