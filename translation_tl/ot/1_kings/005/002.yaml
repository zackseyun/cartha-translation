translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “panustos na pagkain” upang maipahayag ang administratibong diwa ng לֶחֶם, at pinanatili ang “kor” bilang sinaunang yunit. Inayos ang mga marker ayon sa pagkakasunod ng mga paliwanag.
