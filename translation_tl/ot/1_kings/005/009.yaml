base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: tl
  text: At binigyan ng Diyos si Solomon ng karunungan at napakalaking pang-unawa, at lawak ng isip[a] na gaya ng buhangin sa dalampasigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lawak ng puso.” Sa Hebreo, ang “puso” ay maaari ring tumukoy sa isip o pang-unawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: At binigyan
  rationale: Tuwirang inilalarawan ng pandiwa ang pagbibigay ng Diyos; pinananatili ng “At” ang daloy ng salaysay.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo, isahan ang gamit ng pandiwa at tumutukoy ito sa Diyos ng Israel.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas sa konteksto ni Solomon, kabilang ang praktikal at maharlikang karunungan.
- source_word: לִשְׁלֹמֹה
  choice: si Solomon
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Filipino at ang panandang angkop sa layon na tao.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: at napakalawak na pang-unawa
  rationale: Ipinahahayag ng “napakalawak” ang matinding antas o dami ng pang-unawa nang natural sa Filipino.
- source_word: וְרֹחַב לֵב
  choice: at lawak ng isip
  rationale: Literal itong “lawak ng puso,” ngunit ang לֵב sa Hebreo ay maaari ring tumukoy sa isip at kakayahang umunawa. Pinananatili ng salin ang larawan ng lawak habang iniiwasan ang eksklusibong emosyonal na pakahulugan sa modernong Filipino.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: na gaya ng buhangin sa dalampasigan
  rationale: Natural na Filipino para sa paghahambing sa buhangin na nasa pampang ng dagat.
theological_decisions:
- issue: Antropolohikal na idyoma sa וְרֹחַב לֵב
  choice: lawak ng isip
  alternative: lawak ng puso
  rationale: Sa Hebreo, ang “puso” ay maaaring maging sentro ng pag-iisip at pag-unawa, hindi lamang ng damdamin. Ang “isip” ang mas malinaw na pangunahing salin sa modernong Filipino, habang inilalahad sa talababa ang literal na anyo upang mapanatili ang tunay na idyoma.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang metapora ng “lawak” at ang paghahambing sa buhangin sa dalampasigan.
