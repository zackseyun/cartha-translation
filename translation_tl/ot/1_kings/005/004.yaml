  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: tl
  text: Sapagkat namamahala siya sa buong lupain sa kabila ng Ilog[a], mula Tifsa[b] hanggang Gaza, at namamahala siya sa lahat ng hari sa kabila ng Ilog; at may kapayapaan siya mula sa lahat ng panig sa paligid niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: Ang Tifsa ay isinusulat ding Tiphsah sa ilang transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֶה
  choice: namamahala
  rationale: Ang participle ng רדה ay nagpapahiwatig ng nagpapatuloy na paghahari o pamamahala. Likas sa modernong Tagalog ang “namamahala” at hindi nito pinalalabis ang diwa bilang pananakop o pang-aapi.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: sa buong lupain sa kabila ng Ilog
  rationale: Ang עֵבֶר הַנָּהָר ay heograpikong katawagan sa rehiyon sa ibayo ng Eufrates. Idinagdag ang “lupain” upang maging malinaw at natural sa Tagalog, habang pinananatili sa pangunahing teksto ang literal na “Ilog.”
- source_word: הַנָּהָר
  choice: ang Ilog
  rationale: Tiyak ang karaniwang pangngalan sa Hebreo at ginagamit bilang kinikilalang katawagan para sa Eufrates. Pinanatili ang anyo ng pinagmulan at nilinaw ang tinutukoy sa talababa.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: mula Tifsa hanggang Gaza
  rationale: Tuwirang ipinahahayag nito ang lawak ng teritoryo. Ang “Tifsa” ay isang madaling basahing transliterasyon sa Filipino ng תפסח.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: at sa lahat ng hari sa kabila ng Ilog
  rationale: Ipinahihiwatig ng parirala ang kapangyarihan ni Solomon sa mga haring nasa rehiyong iyon. Pinananatili ng “sa lahat ng hari” ang ugnayang pampolitika nang hindi nagdaragdag ng mas tiyak na katawagang wala sa teksto.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: at may kapayapaan siya
  rationale: Ang שָׁלוֹם dito ay tumutukoy sa kalagayan ng kapayapaan at katiwasayan, lalo na sa ugnayang pampolitika. Ang “may kapayapaan siya” ay natural ngunit hindi nililimitahan ang saklaw ng salita.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: sa lahat ng panig sa paligid niya
  rationale: Inilalarawan ng idyomang Hebreo ang kapayapaan mula sa bawat nakapaligid na dako. Ang salin ay malinaw sa Tagalog at hindi ipinapalagay na ang tinutukoy ay partikular na mga kapitbahay o mga hangganan.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Filipino. Pinanatili ang “Ilog” bilang katawagang heograpiko ng tekstong Hebreo, na may paglilinaw sa talababa. Ang “namamahala” at “may kapayapaan” ay nag-iingat sa nagpapatuloy na aspekto at sa pampolitikang diwa nang hindi nagiging labis na teknikal.
