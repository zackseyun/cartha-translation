  to: Sapagkat namamahala siya sa buong lupain sa kabila ng Ilog[a], mula Tifsa[b] hanggang Gaza, at namamahala siya sa lahat ng hari sa kabila ng Ilog; at may kapayapaan siya mula sa lahat ng panig sa paligid niya.
