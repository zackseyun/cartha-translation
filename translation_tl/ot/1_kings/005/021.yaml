base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: tl
  text: Nang marinig ni Hiram ang mga sinabi ni Solomon, labis siyang nagalak at sinabi niya, “Purihin si Yahweh sa araw na ito, na nagbigay kay David ng isang matalinong anak bilang pinuno ng malaking bayang ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: mga sinabi ni Solomon
  rationale: Natural na Filipino para sa literal na ‘mga salita ni Solomon’ sa konteksto ng mensaheng narinig ni Hiram.
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin ... si Yahweh
  rationale: Ipinahahayag ang Hebreong pormula ng pagpupuri sa natural at dignified na Filipino; pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Tuwirang pinananatili ang temporal na diin ng ‘sa araw na ito/today’ nang natural sa Filipino.
- source_word: בֵּן חָכָם
  choice: isang marunong na anak
  rationale: Direktang katumbas ng Hebreo at hindi nililimitahan ang karunungan sa isang partikular na uri.
- source_word: עַל הָעָם
  choice: upang mamuno sa ... bayan
  rationale: Sa konteksto ng isang anak na ibinigay bilang hari ‘over’ the people, malinaw at natural na ipinahahayag ng ‘upang mamuno sa’ ang relasyong pampamahalaan.
- source_word: הָעָם הָרָב הַזֶּה
  choice: dakilang bayang ito
  rationale: Ang רַב ay maaaring tumukoy sa dami o kadakilaan; ‘dakila’ preserves the source's broad evaluative force and matches the royal context.
theological_decisions:
- issue: Paglalahad ng banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang transliterasyon upang malinaw na katawanin ang personal na pangalang nasa Hebreo, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Kahulugan ng עַל sa ugnayan ng anak at bayan
  choice: upang mamuno sa
  alternative: sa ibabaw ng
  rationale: Ang konteksto ay paghahari ni Solomon; ang natural na Filipino ay nangangailangan ng pandiwang nagpapahayag ng pamamahala, samantalang hindi nito dinaragdagan ang teolohikal na nilalaman.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa pampublikong pagbasa. Iniwasan ang makalumang ayos at pinanatili ang taimtim na tono ng pagpapala at pagpupuri.
