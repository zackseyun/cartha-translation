  terminology: Wastong pinananatili ang “Yahweh,” “bahay,” “pangalan,” at “trono.” Ang “kahalili” ay angkop sa konteksto ng maharlikang paghalili at hindi nagdaragdag ng doktrinal na paliwanag.
