  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang kasalukuyang layunin ni Solomon, ang literal na “bahay,” ang pormulang “para sa pangalan ni Yahweh,” at ang pangakong ang anak ni David ang ilalagay na kahalili sa trono at siyang magtatayo ng bahay. Ang “At ngayo’y” ay likas na katumbas sa kontekstong ito ng pantawag-pansing וְהִנְנִי, nang hindi nawawala ang puwersa ng pahayag.'
