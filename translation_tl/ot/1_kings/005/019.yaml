id: 1KI.5.19
reference: 1 Kings 5:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: tl
  text: 'At ngayo''y balak kong magtayo ng isang bahay[a] para sa pangalan ni Yahweh na aking Diyos,[b] gaya ng sinabi ni Yahweh kay David na aking ama: “Ang iyong anak, na ilalagay ko bilang kahalili mo sa iyong trono,[c] siya ang magtatayo ng bahay para sa aking pangalan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magtayo ng isang templo.” Literal sa Hebreo, “magtayo ng isang bahay.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang “para sa pangalan ni Yahweh na aking Diyos” ay pormulang ginagamit tungkol sa templo: ang bahay ay itinalaga sa pangalan at presensiya ni Yahweh.'
    reason: cultural_note
  - marker: c
    text: O “na itatalaga ko pagkatapos mo.” Literal sa Hebreo, “na ibibigay ko sa iyong lugar, sa iyong trono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: At ngayo'y balak kong
  rationale: Ang וְהִנְנִי ay pantawag-pansin na nagpapakilala sa kasalukuyang pasiya ni Solomon, at ang אֹמֵר kasama ng infinitive ay nagpapahayag dito ng layunin. Likas sa modernong Tagalog ang “At ngayo'y balak kong” at hindi ito nagmumukhang literal na “ako'y nagsasabi.”
- source_word: לִבְנוֹת בַּיִת
  choice: magtayo ng isang bahay
  rationale: Pinananatili ng “bahay” ang literal at teolohikal na matalinghagang gamit ng בַּיִת; nililinaw sa talababa na templo ang tinutukoy.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: para sa pangalan ni Yahweh na aking Diyos
  rationale: Pinananatili ang pormulang Hebreo na “para sa pangalan,” na tumutukoy sa bahay na itatalaga sa banal na pangalan at presensiya ni Yahweh, sa halip na paliitin ito sa simpleng pagpaparangal.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Natural na Tagalog ito para sa paghahambing na nag-uugnay sa balak ni Solomon sa naunang pangako ni Yahweh.
- source_word: אֶל דָּוִד אָבִי
  choice: kay David na aking ama
  rationale: Malapit sa ayos ng Hebreo ngunit malinaw at marangal sa Tagalog.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  choice: na ilalagay ko bilang kahalili mo sa iyong trono
  rationale: Ipinapahayag ang ideya ng paglalagay sa puwesto ng naunang hari sa konteksto ng paghalili, habang pinananatili ang tahasang banggit sa trono.
- source_word: הוּא יִבְנֶה
  choice: siya ang magtatayo
  rationale: Ang hulma na “siya ang” ay natural na paraan sa Tagalog upang mapanatili ang diin ng hiwalay na panghalip na הוּא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang titulong “PANGINOON.”
theological_decisions:
- issue: Paglalarawan sa templo bilang “bahay” para sa pangalan ni Yahweh
  choice: bahay para sa pangalan ni Yahweh
  alternative: templo para kay Yahweh
  rationale: 'Pinananatili nito ang mismong pormula at teolohikal na tensiyon ng Hebreo: ang gusali ay “bahay,” ngunit partikular na para sa pangalan ni Yahweh; hindi nito basta ipinapantay ang Diyos sa isang gusaling tirahan.'
- issue: Paglilipat ng paghahari sa anak ni David
  choice: ilalagay ko bilang kahalili mo sa iyong trono
  alternative: itatalaga ko pagkatapos mo
  rationale: Nililinaw ang konteksto ng maharlikang paghalili nang hindi inaalis ang larawan ng paglalagay sa puwesto ni David at sa kaniyang trono.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nakasulat sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ngayo'y” bilang bahagyang pormal na pang-ugnay, “magtayo” para sa konstruksiyon, at “kahalili” para sa malinaw na konteksto ng paghalili sa trono. Ang lahat ng panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
