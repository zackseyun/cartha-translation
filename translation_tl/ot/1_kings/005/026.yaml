reference: 1 Kings 5:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: tl
  text: At binigyan ni Yahweh si Solomon ng karunungan, gaya ng sinabi[a] niya sa kanya. Nagkaroon ng kapayapaan sa pagitan nina Hiram at Solomon, at silang dalawa ay gumawa ng tipan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “gaya ng ipinangako niya sa kanya.” Ang pandiwang Hebreo ay literal na “nagsalita” o “nagsabi,” ngunit maaaring tumukoy rito sa naunang pangako ni Yahweh kay Solomon.
    reason: alternative_reading
  - marker: b
    text: Literal na “pumutol ng tipan,” isang idyomang Hebreo na nangangahulugang gumawa o magtatag ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נָתַן חָכְמָה
  choice: binigyan ... ng karunungan
  rationale: Likas at tuwirang salin sa modernong Filipino ng ‘nagbigay ng karunungan,’ na tumutukoy sa karunungang ipinagkaloob kay Solomon.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: gaya ng sinabi niya sa kanya
  rationale: Pinananatili ang karaniwang kahulugan ng דִּבֶּר na ‘nagsalita/nagsabi’ nang hindi tahasang nilulutas kung ang naunang salita ay isang pangako.
- source_word: וַיְהִי שָׁלוֹם
  choice: nagkaroon ng kapayapaan
  rationale: Natural na Filipino para sa pagkakaroon ng mapayapang ugnayan; hindi ito pinalalawak tungo sa mas interpretibong ‘pagkakaibigan.’
- source_word: בֵּין חִירָם וּבֵין שְׁלֹמֹה
  choice: sa pagitan nina Hiram at Solomon
  rationale: Karaniwang anyong Filipino para sa ugnayan sa pagitan ng dalawang taong pinangalanan.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: gumawa ng tipan
  rationale: Natural na salin ng idyomang literal na ‘pumutol ng tipan’; pinananatili ng ‘tipan’ ang mahalagang terminong בְרִית sa halip na limitahan ito sa ‘kasunduang pampolitika.’
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Malinaw na ipinahahayag ang magkapantay na pakikibahagi ng dalawang panig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ang ‘Yahweh’ ay tuwirang transliterasyon na nagpapanatili sa personal na pangalan sa pinagmulang teksto nang hindi ito pinapalitan ng titulo.
- issue: Kung gagawing tahasang ‘ipinangako’ ang דִּבֶּר
  choice: sinabi
  alternative: ipinangako
  rationale: Maaaring pangako ang tinutukoy na naunang salita sa konteksto, ngunit ang pandiwang Hebreo ay karaniwang nangangahulugang ‘nagsalita/nagsabi.’ Pinananatili ng pangunahing teksto ang saklaw at bahagyang di-tiyak na puwersa nito.
- issue: Kung isasalin ang בְרִית bilang ‘tipan’ o ‘kasunduang pampolitika’
  choice: tipan
  alternative: kasunduang pampolitika
  rationale: Bagaman pampolitika ang konteksto, ginamit ng Hebreo ang karaniwang salitang pangtipan. Ang ‘tipan’ ay mas tapat sa leksikal at teolohikal na ugnayan ng termino sa iba pang mga konteksto.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang payak na ayos ng pangungusap at karaniwang bokabularyo, habang pinanatili ang pangalang Yahweh at ang mahalagang terminong ‘tipan.’ Inayos ang mga panandang talababa upang tumapat ang bawat isa sa kaugnay nitong salita o parirala.
