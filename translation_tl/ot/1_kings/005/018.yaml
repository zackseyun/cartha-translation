base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: tl
  text: Ngunit ngayon, binigyan ako ni Yahweh na aking Diyos ng kapahingahan sa lahat ng panig; walang kalaban[a] at walang masamang pangyayari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaaway.” Ang salitang Hebreo rito ay karaniwang pangngalan at hindi kinakailangang tumukoy sa pantanging pangalang Satanas.
    reason: lexical_alternative
  - marker: b
    text: O “kasawian,” “kapahamakan,” o “sakuna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahihiwatig ng parirala ang paglipat at pagsalungat sa naunang kalagayan; natural na ipinapahayag ito sa Tagalog ng “Ngunit ngayon.”
- source_word: הֵנִיחַ
  choice: binigyan ... ng kapahingahan
  rationale: 'Ang Hiphil ng נוח ay causative: pinahintulutan o pinagkalooban ng pamamahinga. Ang “binigyan ako ... ng kapahingahan” ay natural at pinananatili ang causative na diwa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: Tapat na isinasalin ang konstruksiyong paari at ang personal na pagkilala ni Solomon sa Diyos.
- source_word: לִי
  choice: ako
  rationale: Tinutukoy ng pang-ukol ang tumatanggap ng kapahingahan; sa natural na Tagalog, isinama ito sa hulma na “binigyan ako ... ng kapahingahan.”
- source_word: מִסָּבִיב
  choice: sa buong paligid
  rationale: Ipinahihiwatig nito ang kawalan ng banta mula sa lahat ng nakapaligid na panig.
- source_word: אֵין שָׂטָן
  choice: walang kalaban
  rationale: Dito, ang שָׂטָן ay karaniwang pangngalan para sa isang sumasalungat o kalaban, hindi tiyak na pantanging pangalang Satanas.
- source_word: וְאֵין
  choice: at walang
  rationale: Pinananatili ang ikalawang sugnay na negatibo at ang payak na koordinasyon ng Hebreo.
- source_word: פֶּגַע רָע
  choice: masamang pangyayari
  rationale: Pinananatili ang malawak na diwa ng isang nakapipinsala o masamang kaganapan nang hindi nililimitahan iyon sa sakuna, digmaan, o moral na kasamaan lamang.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
- issue: Kung ang שָׂטָן ay pantanging pangalang Satanas
  choice: karaniwang pangngalang “kalaban”
  alternative: Satanas; sumasalungat
  rationale: Ang konteksto ay ang kapayapaan ng kaharian at kawalan ng panlabas na pagsalungat. Hindi hinihingi ng anyo o konteksto na kilalanin ito bilang pangalan ng isang espirituwal na nilalang.
- issue: Saklaw ng פֶּגַע רָע
  choice: masamang pangyayari
  alternative: kasawian; kapahamakan; sakuna
  rationale: Ang mas malawak na salin ay nagpapanatili sa posibleng saklaw ng parirala at hindi nagpapasya kung anong partikular na uri ng kapinsalaan ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapahingahan” upang mapanatili ang mahalagang diwa ng pahinga at katiwasayan, samantalang ang “sa buong paligid” ay madaling maunawaan at malapit sa larawang spatial ng Hebreo. Ang mga talababa ay minarkahan sa mismong teksto sa pagkakasunod na [a], [b].
