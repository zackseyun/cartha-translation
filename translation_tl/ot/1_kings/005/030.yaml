base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: tl
  text: Bukod pa sa mga punong opisyal ni Solomon na namamahala sa gawain—tatlong libo at tatlong daan[a]—na namumuno sa mga taong gumagawa ng gawain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang bilang sa Hebreo ay “tatlong libo at tatlong daan.” Sa 2 Cronica 2:18, ang kaugnay na bilang ay 3,600.
    reason: textual_parallel
  - marker: b
    text: Ang “namumuno sa” ay salin ng pandiwang maaaring mangahulugang mamahala o maghari. Dito, tumutukoy ito sa pangangasiwa sa mga manggagawa. Ang mga terminong Hebreo para sa “mga punong opisyal” ay maaari ring isaling “mga pangunahing tagapangasiwa” o “mga pinuno ng mga opisyal”; pinagsasama ng mga ito ang ranggo at pangangasiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: bukod sa
  rationale: Likas na panandang Tagalog para sa karagdagan sa naunang bilang.
- source_word: שָּׂרֵי הַנִּצָּבִים לִשְׁלֹמֹה
  choice: mga pinuno ng mga katiwala ni Solomon
  rationale: 'Pinananatili ang dalawang antas ng pariralang Hebreo: ang שׂרי ay mga pinuno, at ang nominalisadong הַנִּצָּבִים ay mga itinalagang opisyal o katiwala.'
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: na namamahala sa gawain
  rationale: Ipinahahayag nang natural ang pagiging may pananagutan at awtoridad sa proyekto.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: tatlong libo at tatlong daan
  rationale: Tuwirang pagsasalin ng bilang sa likas na anyong Tagalog.
- source_word: הָרֹדִים
  choice: may kapangyarihan sa
  rationale: Pinananatili ang mas malakas na diwa ng רדה—paggamit ng awtoridad—nang hindi ipinahihiwatig ang isang tiyak na uri ng pagmamalupit.
- source_word: בָּעָם
  choice: mga tao
  rationale: Pinananatili ang literal na 'mga tao'; nililinaw ng kasunod na sugnay na sila ang lakas-paggawa.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: gumagawa ng gawain
  rationale: Malapit sa anyo at diwa ng Hebreo at malinaw sa karaniwang mambabasa.
