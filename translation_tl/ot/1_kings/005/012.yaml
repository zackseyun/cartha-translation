  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: tl
  text: Nagsalita siya ng tatlong libong kawikaan[a], at ang mga awit niya ay isang libo at lima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tatlong libong kasabihan” o “tatlong libong talinghaga”; mas malawak kaysa sa “kawikaan” ang saklaw ng Hebreong מָשָׁל (mashal).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Binigkas niya
  rationale: Ang piel ng דבר ay nangangahulugang magsalita o magpahayag. Ang “binigkas” ay natural sa konteksto at hindi ipinapalagay na ang mga ito ay isinulat o tahasang kinatha.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tatlong libo
  rationale: Tuwirang salin ng bilang sa natural na ayos ng Filipino.
- source_word: מָשָׁל
  choice: kawikaan
  rationale: Bagaman isahan ang anyong Hebreo, ginagamit ito bilang pangngalang binibilang pagkatapos ng bilang. Ang “kawikaan” ang pinakaangkop sa tradisyon ng karunungan ni Solomon, habang kinikilala sa talababa ang mas malawak na saklaw ng salita.
- source_word: וַיְהִי
  choice: ay
  rationale: Sa pahayag na ito ng kabuuang bilang, copular ang gamit ng היה; natural itong ipinahahayag sa Filipino sa pamamagitan ng “ay.”
- source_word: שִׁירוֹ
  choice: ang mga awit niya
  rationale: Bagaman isahan ang anyo na may hulaping panghalip, kolektibo ang diwa nito dahil sinusundan ng bilang; kailangan ang “mga awit” sa Filipino.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: isang libo at lima
  rationale: Literal na “lima at isang libo” ang ayos sa Hebreo, ngunit binaligtad sa karaniwang ayos ng bilang sa Filipino habang pinananatili ang eksaktong kabuuang 1,005.
