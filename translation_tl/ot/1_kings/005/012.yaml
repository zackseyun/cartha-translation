translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “binigkas” sa halip na “kinatha” upang huwag magdagdag ng ideya ng pagsulat o paglikha na hindi tahasang ipinahahayag ng pandiwang Hebreo.
