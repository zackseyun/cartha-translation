base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: tl
  text: At ang karunungan ni Solomon ay higit kaysa sa karunungan ng lahat ng mga taga-silangan[a] at sa lahat ng karunungan ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak ng silangan,” isang idyomatikong tawag sa mga taong mula sa silangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: ay higit kaysa
  rationale: Ang רָבָה na sinusundan ng pahambing na מִן ay nagsasaad dito ng kahigitan, hindi lamang ng pagdami; natural itong ipinahahayag sa Tagalog bilang “higit kaysa.”
- source_word: חָכְמַת
  choice: karunungan
  rationale: Tumutukoy ang חָכְמָה sa malawak na karunungan, kaalaman, at kahusayang pangkaisipan; “karunungan” ang karaniwan at angkop na katumbas.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Karaniwang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili ang saklaw ng salitang Hebreo sa dalawang paglitaw nito.
- source_word: בְּנֵי קֶדֶם
  choice: mga taga-silangan
  rationale: Literal na “mga anak ng silangan,” ngunit isa itong idyomatikong tawag sa mga taong mula sa silangan. Ang “mga taga-silangan” ay natural, malinaw, at nagpapanatili sa panrehiyong diwa.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: at sa lahat ng karunungan ng Ehipto
  rationale: Nakaugnay ito sa unang pariralang pahambing at umaasa sa parehong diwang “higit kaysa”; hindi kailangang ulitin ang pandiwa sa Tagalog.
- source_word: מִצְרָיִם
  choice: Ehipto
  rationale: Karaniwang salin sa Tagalog ng pangalan ng lugar.
