  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: tl
  text: At dinadala nila ang sebada at dayami para sa mga kabayo at sa mga hayop na pansakay[a] sa lugar na kinaroroonan ng bawat isa[b], ayon sa nakatalagang tungkulin niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “mga piling kabayong pansakay,” “mga mula,” o “mga kabayong pangkarwahe”; hindi tiyak ang eksaktong uri ng hayop na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bawat lalaki”; ginagamit dito ang pananalita nang pamahagi para sa bawat taong may kaukulang pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: ang sebada
  rationale: Ang שְׂעֹרִים ay sebada na inilaan bilang pakain; karaniwan at malinaw sa makabagong Filipino ang “sebada.”
- source_word: וְהַתֶּבֶן
  choice: dayami
  rationale: Ang תֶּבֶן ay tumutukoy sa dayami o tuyong tangkay na ginagamit na pakain, hindi lamang sa pinong ipa.
- source_word: לַסּוּסִים
  choice: para sa mga kabayo
  rationale: Tuwirang ipinahahayag nito ang mga hayop na paglalaanan ng pagkain.
- source_word: וְלָרָכֶשׁ
  choice: at sa mga hayop na pansakay[a]
  rationale: Hindi tiyak ang eksaktong uri ng רֶכֶשׁ. Ang “mga hayop na pansakay” ay nagpapanatili sa masaklaw na diwa nang hindi ipinapalagay na tiyak na mula, kabayong pangkarwahe, o natatanging uri ng kabayo.
- source_word: יָבִיאוּ
  choice: dinadala nila
  rationale: Ang imperpektibong pandiwa ay angkop unawain bilang paulit-ulit o nakagawiang paghahatid sa kontekstong administratibo. Pinananatili ng aktibong anyo ang gramatika ng Hebreo kahit hindi tahasang pinapangalanan ang mga tagapagdala.
- source_word: אֶל־הַמָּקוֹם
  choice: sa lugar
  rationale: Natural at tuwirang katumbas ng pariralang panlunan.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: na kinaroroonan ng bawat isa[b]
  rationale: Ginagamit nang pamahagi ang isahang אִישׁ. Ang “bawat isa” ay natural sa Filipino at hindi nagdaragdag ng tungkuling hindi tahasang nasa sugnay.
- source_word: כְּמִשְׁפָּטוֹ
  choice: ayon sa nakatalagang tungkulin niya
  rationale: Sa kontekstong ito, ang מִשְׁפָּט ay tumutukoy sa itinakdang pananagutan o kaayusan, hindi sa isang hatol na legal.
