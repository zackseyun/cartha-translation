translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangkasalukuyang “dinadala” upang ipakita ang nakagawiang paghahatid, at iniwasang gawing mas tiyak kaysa sa Hebreo ang uri ng hayop na tinutukoy ng רֶכֶשׁ.
