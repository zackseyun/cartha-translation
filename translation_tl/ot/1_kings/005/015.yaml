  to: Pagkatapos, ipinadala ni Hiram, na hari ng Tiro, ang kanyang mga lingkod kay Solomon, sapagkat nabalitaan niyang pinahiran si Solomon bilang hari na kahalili ng kanyang ama; sapagkat lagi nang minahal ni Hiram si David.[a]
