  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צ֤וֹר אֶת עֲבָדָי/ו֙ אֶל שְׁלֹמֹ֔ה כִּ֣י שָׁמַ֔ע כִּ֥י אֹת֛/וֹ מָשְׁח֥וּ לְ/מֶ֖לֶךְ תַּ֣חַת אָבִ֑י/הוּ כִּ֣י אֹהֵ֗ב הָיָ֥ה חִירָ֛ם לְ/דָוִ֖ד כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: tl
  text: Pagkatapos, ipinadala ni Hiram, na hari ng Tiro, ang kanyang mga lingkod kay Solomon, sapagkat nabalitaan niyang pinahiran si Solomon bilang hari na kahalili ng kanyang ama; sapagkat lagi nang minahal ni Hiram si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sapagkat naging kaibigan ni Hiram si David sa lahat ng mga araw.” Literal sa Hebreo: “sapagkat si Hiram ay umiibig kay David sa lahat ng mga araw,” na nagpapahayag ng isang namamalaging mabuting ugnayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ipinadala
  rationale: Karaniwang pandiwang pasalaysay; ang aspektong naganap ay likas sa kontekstong Tagalog.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Hiram na hari ng Tiro
  rationale: Pinananatili ang pangalang Hiram at likas na ipinapahayag sa Tagalog ang kanyang katungkulan at kaharian.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Malawak na katumbas na maaaring tumukoy sa mga lingkod o tauhan ng hari nang hindi ipinapalagay na mga alipin sila.
- source_word: אֶל שְׁלֹמֹה
  choice: kay Solomon
  rationale: Tuwirang ipinapahayag ang direksiyon o taong pinuntahan nang walang idinagdag na layunin.
- source_word: כִּי שָׁמַע
  choice: sapagkat nabalitaan niya
  rationale: Ipinakikita ang dahilan ng pagpapadala at nauna ang pagkarinig sa pagkilos; natural sa Tagalog ang “nabalitaan.”
- source_word: מָשְׁחוּ לְמֶלֶךְ
  choice: pinahiran nila itong hari
  rationale: Pinananatili ang literal at mahalagang larawan ng pagpapahid kaugnay ng pagluklok bilang hari; ang “itong” ay tumutukoy kay Solomon.
- source_word: תַּחַת אָבִיהוּ
  choice: bilang kahalili ng kanyang ama
  rationale: Malinaw na ipinahahayag ang paghahalili sa trono, hindi lamang ang kronolohikal na pagsunod.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: Sa buong panahong iyon, minamahal ni Hiram si David
  rationale: Ang progresibong “minamahal” ay nagpapahiwatig ng nagpapatuloy na mabuting saloobin o ugnayan, at ang pariralang temporal ay kumakatawan sa כָּל הַיָּמִים nang hindi tiyakang nililimitahan sa buong buhay ni David.
theological_decisions:
- issue: Ang uri ng pag-ibig ni Hiram kay David
  choice: minamahal ni Hiram si David
  alternative: kaibigan ni Hiram si David
  rationale: Pinananatili ang mismong wika ng pag-ibig sa Hebreo at hindi ito tahimik na nililimita sa pagkakaibigang personal o alyansang pampolitika.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lingkod,” “pinahiran,” at “kahalili” upang mapanatili ang kontekstong maharlika at ang mahahalagang detalye ng Hebreo. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay.
