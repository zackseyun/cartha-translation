base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: tl
  text: Sampung bakang pinataba, dalawampung bakang nanginginain sa pastulan, at isang daang tupa,[a] bukod pa sa mga usa, gasela, mga usa na tinatawag na yahmur,[b] at mga ibong pinataba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay kolektibong tumutukoy sa maliliit na alagang hayop at maaari ring sumaklaw sa mga kambing.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong uri ng usa na tinutukoy ng salitang Hebreo; maaaring roebuck o fallow deer.
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ang salitang Hebreo sa mga pinatabang gansa, ngunit hindi tiyak ang espesye.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: pinatabang baka
  rationale: Ang בָקָר ay kolektibong katawagan sa mga baka, at ang בְּרִיאִים ay tumutukoy sa matataba o pinakain nang mabuti. Ipinahihiwatig ng “pinatabang baka” na sadyang inihanda ang mga ito bilang pagkain.
- source_word: בָּקָר רְעִי
  choice: bakang pinapastol
  rationale: Ang רְעִי ay kaugnay ng pagpapastol o panginginain. Likas sa Tagalog ang “bakang pinapastol” at malinaw itong naiiba sa mga bakang sadyang pinataba.
- source_word: צֹאן
  choice: tupa at kambing
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop at maaaring sumaklaw sa parehong tupa at kambing. Mas tumpak sa lawak ng salitang Hebreo ang tahasang pagbanggit sa dalawa.
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Ipinakikilala nito ang mga dagdag na pagkain na hindi kasama sa naunang bilang; natural at malinaw sa modernong Tagalog ang “bukod pa sa.”
- source_word: אַיָּל
  choice: usa
  rationale: Tumutukoy ito sa isang usa, kung minsan ay partikular na lalaking usa. Sapat at madaling maunawaan ang pangkalahatang katawagang “usa” sa talaang ito.
- source_word: צְבִי
  choice: gasela
  rationale: Karaniwang tumutukoy ang צְבִי sa gazelle; ang “gasela” ang tuwirang modernong katawagan sa Tagalog.
- source_word: יַחְמוּר
  choice: yahmur
  rationale: Hindi tiyak ang eksaktong uri ng hayop. Ang transliterasyong “yahmur” ay umiiwas sa hindi matiyak na pagkilalang zoolohikal, habang ipinapaliwanag sa talababa ang mga posibleng kahulugan.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: mga pinatabang ibon
  rationale: Hindi tiyak ang espesyeng tinutukoy ng בַרְבֻּרִים, samantalang ang אֲבוּסִים ay nangangahulugang pinataba o pinakain sa kulungan. Pinananatili ng “mga pinatabang ibon” ang katiyakan ng teksto nang hindi nagpapakipot sa isang di-tiyak na uri.
