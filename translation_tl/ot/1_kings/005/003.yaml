translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sandaang” bilang natural na anyo ng bilang, at pinanatili ang anyong listahan ng Hebreo. Ang mga di-tiyak na katawagang zoolohikal ay hindi pinilit na gawing mas tiyak kaysa sa ebidensiyang leksikal.
