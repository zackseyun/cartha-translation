base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: tl
  text: Nag-utos ang hari, at ipinakuha nila[a] ang malalaki at mamahaling bato, mga batong tinabas[b], upang ilatag ang pundasyon ng bahay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaaring magpahiwatig ng pagpapakuha, pag-aalis, o pagpapalipat ng mga bato; sa kontekstong ito, maaaring kabilang dito ang pagkuha sa tibagan at paghakot sa mga ito.
    reason: lexical_ambiguity
  - marker: b
    text: Maaari ring “mga batong tinapyas” o “mga batong hinugisan.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang templo; “bahay” ang mababasa sa Hebreo.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Nag-utos ang hari
  rationale: Tuwirang isinasalin ang magkakasunod na kilos sa salaysay. Likas sa modernong Tagalog ang ayos na pandiwa muna, at malinaw sa konteksto na si Solomon ang hari.
- source_word: וַיַּסִּעוּ
  choice: kumuha sila
  rationale: Ang causative na anyo ng נסע ay maaaring tumukoy sa pag-aalis o pagpapalipat ng mga bato. Pinananatili ng “kumuha” ang lawak ng pandiwa nang hindi tiyak na ipinapalagay kung ang diin ay nasa pagtibag o paghakot; nililinaw sa talababa ang posibleng diwa.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: malalaking bato
  rationale: Natural at tuwirang katumbas sa modernong Tagalog.
- source_word: אֲבָנִים יְקָרוֹת
  choice: mamahaling bato
  rationale: Sa konteksto ng pagtatayo, ang יקר ay tumutukoy sa halaga o kalidad ng materyales, hindi sa mga hiyas.
- source_word: לְיַסֵּד
  choice: upang ilatag ang pundasyon
  rationale: Karaniwang parirala sa Tagalog para sa pagtatatag ng pundasyon ng isang gusali.
- source_word: הַבָּיִת
  choice: bahay
  rationale: Pinananatili ang literal na katawagan ng Hebreo; ipinapaliwanag sa talababa na ang tinutukoy sa konteksto ay ang templo.
- source_word: אַבְנֵי גָזִית
  choice: mga batong tinabas
  rationale: Ipinahahayag ang mga batong hinugisan sa pamamagitan ng pagputol o pagtapyas. Inilalagay bilang paglilinaw sa naunang mga bato, gaya ng appositional na gamit sa Hebreo.
theological_decisions:
- issue: Pagkilala sa הַבַּיִת bilang templo
  choice: bahay sa pangunahing teksto, na may paliwanag sa talababa
  alternative: templo sa pangunahing teksto
  rationale: Ang “bahay” ang mismong salita sa Hebreo, samantalang malinaw sa konteksto na templo ni Solomon ang tinutukoy. Pinananatili ng salin ang diksyon ng pinagmulan nang hindi inililihim ang kontekstuwal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong pangkonstruksiyon at pinanatili ang “bahay” bilang pormal na katawagan sa templo. Ang gitling na mahaba ay nagpapakitang ang “mga batong tinabas” ay karagdagang paglalarawan sa mga batong naunang binanggit.
