lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagpasabi
  rationale: Ang wayyiqtol ng שׁלח ay nagsasaad ng kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” para sa pagkakasunod-sunod, at ang “nagpasabi” ay angkop kapag ang ipinadalang mensahe ang kasunod na binabanggit.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Tagalog na Bibliya.
- source_word: אֶל
  choice: kay
  rationale: Tinutukoy ng pang-ukol ang taong tatanggap ng ipinadalang mensahe; “kay” ang likas na katumbas sa Tagalog bago ang pangalan ng tao.
- source_word: חִירָם
  choice: Hiram
  rationale: Sinusunod ang anyong Hebreo sa talatang ito at ang nakasanayang transliterasyon ng pangalan.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitive construct ay nagpapakilala sa mensaheng kasunod. Sa natural na Tagalog, sapat at malinaw ang tutuldok pagkatapos ng “nagpasabi,” sa halip na idagdag ang mas mabigat na “na sinasabi.”
