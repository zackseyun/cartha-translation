base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: tl
  text: Mas marunong siya kaysa sa bawat tao—kaysa kay Etan na Ezrahita[a] at kina Heman, Kalkol, at Darda, na mga anak ni Mahol—at ang kanyang pangalan ay nakilala sa lahat ng bansang nakapaligid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ezrahita” ay maaaring katawagang pangangkan o pangkat; iniuugnay ito ng ilan sa “Zerahita.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at ang pangalan niya ay nasa lahat ng bansang nakapaligid”; ibig sabihin, kilala siya roon o laganap ang kanyang katanyagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: Mas marunong siya
  rationale: Ipinahahayag ng pandiwang חכם kasama ng paghahambing na מִן ang pagiging nakahihigit sa karunungan. Likas sa modernong Tagalog ang “mas marunong siya” at hindi nito ipinapalagay na noon lamang siya naging marunong.
- source_word: מִכָּל הָאָדָם
  choice: kaysa sa bawat tao
  rationale: Maaaring tumukoy ang אָדָם sa tao o sa sangkatauhan. Pinananatili ng “bawat tao” ang isahang paghahambing habang nananatiling bukas sa mas malawak na saklaw ng salita.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: kaysa kay Etan na Ezrahita
  rationale: Itinuturing ang הָאֶזְרָחִי bilang di-tiyak na katawagang pangangkan o pangkat at tinutumbasan sa pamamagitan ng transliterasyong “Ezrahita,” nang hindi ipinipilit ang posibleng kaugnayan sa Zerahita.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: at kina Heman, Calcol, at Darda
  rationale: Mga pangalang pantangi ang mga ito. Ginamit ang mga anyong madaling basahin sa Filipino; inilalarawan ng “kina” ang magkakasamang paghahambing sa mga taong pinangalanan.
- source_word: בְּנֵי מָחוֹל
  choice: na mga anak ni Mahol
  rationale: Pinakapayak na pagbasa sa pariralang konstrakto ang literal na ugnayang pampamilya. Hindi isinalin bilang isang samahan o bilang “mga anak ng sayaw,” sapagkat hindi iyon hinihingi ng konteksto.
- source_word: וַיְהִי שְׁמוֹ
  choice: nakilala ang pangalan niya
  rationale: Literal itong “at ang pangalan niya ay nasa,” ngunit ang idyoma ay tumutukoy sa pagkakilala o reputasyon. Pinananatili ng saling ito ang “pangalan” habang ginagawa itong malinaw at natural sa Tagalog.
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: sa lahat ng bansang nakapaligid
  rationale: Ang גּוֹיִם ay mga bansang nakapaligid, hindi ang teolohikal na katawagang “mga Hentil.” Likas at malinaw ang “mga bansang nakapaligid.”
theological_decisions:
- issue: Saklaw ng אָדָם sa paghahambing
  choice: bawat tao
  alternative: buong sangkatauhan
  rationale: Maaaring kolektibo ang אָדָם, ngunit ang kasunod na listahan ng mga lalaking pantas ay nagpapahintulot sa distributibong “bawat tao.” Hindi nililimitahan ng Tagalog na “tao” ang kasarian, kaya naipahahayag nito ang anyo nang hindi nagpapasok ng di-kailangang paglilinaw.
- issue: Kahulugan ng שֵׁם sa pangwakas na sugnay
  choice: nakilala ang pangalan niya
  alternative: sumikat siya
  rationale: Ipinahihiwatig ng “pangalan” ang katanyagan o reputasyon. Pinananatili ang konkretong larawan ng Hebreo sa halip na lubusang palitan ito ng interpretasyong “sumikat.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mas marunong” bilang natural na paghahambing, mga marker na “kay/kina” para sa mga pangalan, at isang bahagyang idiomatikong pangwakas na sugnay. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
