  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: tl
  text: May pitumpung libong tagapasan si Solomon at walumpung libong tagatibag ng bato sa kabundukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: May ... si Solomon
  rationale: Ang konstruksyong היה + ל ay nagsasaad ng pag-iral o pag-aari; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “May ... si Solomon.”
- source_word: שִׁבְעִים אֶלֶף
  choice: pitumpung libo
  rationale: Tuwirang salin ng bilang, na may wastong pang-angkop sa Tagalog.
- source_word: נֹשֵׂא סַבָּל
  choice: tagapasan
  rationale: Tumutukoy sa mga manggagawang nagdadala ng mabibigat na pasan; maikli, natural, at tiyak ang “tagapasan.”
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: at walumpung libo
  rationale: Tuwirang salin ng bilang at pang-ugnay.
- source_word: חֹצֵב
  choice: tagatibag ng bato
  rationale: Ang חצב ay nangangahulugang tumibag o kumuha sa pamamagitan ng pagputol, karaniwan ay bato sa kontekstong panggusali. Ginagawang hayag ng “ng bato” ang ipinahihiwatig na layon.
- source_word: בָּהָר
  choice: sa kabundukan
  rationale: Bagaman pang-isahan sa anyo, maaaring kolektibo o topograpiko ang הַר. Ang “sa kabundukan” ay natural at pinananatili ang pagtukoy sa mabundok na lugar ng pagtitibag.
