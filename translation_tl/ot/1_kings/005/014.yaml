  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: tl
  text: At may mga taong dumating mula sa lahat ng mga bayan[a], mula sa lahat ng mga hari sa daigdig[b] na nakabalita tungkol sa karunungan ni Solomon, upang pakinggan ang kanyang karunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lahat ng mga bansa.” Ang salitang Hebreo ay maramihan at maaaring tumukoy sa mga bayan o mga bansa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa lahat ng mga hari sa daigdig.” Siksik ang pagkakabuo ng parirala; maaaring ipahiwatig nito na ang mga dumalaw ay nagmula sa panig ng mga haring nakabalita tungkol sa karunungan ni Solomon, o na ipinadala sila ng mga hari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: At dumating
  rationale: Ang wayyiqtol ng בוא ay nagpapatuloy sa salaysay at likas na isinasalin bilang payak na nagdaang kilos.
- source_word: מִכָּל הָעַמִּים
  choice: mula sa lahat ng mga bayan
  rationale: Pinananatili ng “mga bayan” ang maramihang anyo ng עַמִּים at tumutukoy sa magkakaibang pangkat ng mga tao; maaari rin itong maunawaan bilang “mga bansa.”
- source_word: לִשְׁמֹעַ
  choice: upang pakinggan
  rationale: Ang pawatas ay nagsasaad ng layunin. Mas natural sa Filipino ang “pakinggan” kapag sinasadyang makinig sa pagpapahayag ng karunungan.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: ang karunungan ni Solomon
  rationale: Natural at malinaw na katumbas ng Hebrew construct chain.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: Isinugo sila ng lahat ng mga hari sa daigdig
  rationale: Ang pinaikling pariralang Hebreo ay maaaring magpahiwatig na ang mga dumalaw ay nagmula sa, o isinugo ng, mga hari. Ginagawang malinaw sa pangunahing teksto ang malamang na ugnayan habang itinatala sa talababa ang literal na anyo.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: na nakabalita tungkol sa kanyang karunungan
  rationale: Sa konteksto, tumutukoy ito sa pagkarinig ng ulat o reputasyon, hindi lamang sa tuwirang pakikinig; natural dito ang “nakabalita tungkol sa.”
