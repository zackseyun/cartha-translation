revisions:
- from: At dumating ang mga tao mula sa lahat ng mga bayan[a] upang pakinggan ang karunungan ni Solomon. Isinugo sila ng lahat ng mga hari sa daigdig na nakabalita tungkol sa kanyang karunungan.[b]
  to: At may mga taong dumating mula sa lahat ng mga bayan[a], mula sa lahat ng mga hari sa daigdig[b] na nakabalita tungkol sa karunungan ni Solomon, upang pakinggan ang kanyang karunungan.
  rationale: Pinalitan ang “Isinugo sila” ng “mula sa lahat ng mga hari” upang huwag magdagdag ng isang hindi tahasang kilos sa Hebreo. Iningatan din ang ugnayan ng sugnay na “na nakabalita” sa mga hari at ang layuning pumunta upang marinig ang karunungan ni Solomon.
