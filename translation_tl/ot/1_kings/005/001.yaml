  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: tl
  text: At si Solomon ay naghahari noon sa lahat ng mga kaharian, mula sa Ilog[a] hanggang sa lupain ng mga Filisteo at hanggang sa hangganan ng Ehipto. Nagdadala sila ng tributo[b] sa kanya at naglilingkod kay Solomon sa buong panahon ng kanyang buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang Ilog Eufrates.
    reason: cross_reference
  - marker: b
    text: O “kaloob.” Ang Hebreong minḥah ay maaaring mangahulugang kaloob, handog, o tributo; sa kontekstong pampolitika rito, mas angkop ang “tributo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: naghahari
  rationale: Ang participle na kasama ng הָיָה ay nagpapahayag ng patuloy na paghahari sa nakaraang panahon. Likas sa modernong Tagalog ang “ay naghahari” at pinananatili nito ang duratibong diwa.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: sa lahat ng kaharian
  rationale: Ang בְּ kasunod ng משל ay tumutukoy sa nasasakupang pinaghaharian. Ang maramihang “mga kaharian” ay tumutukoy sa iba’t ibang estadong nasa ilalim ng kapangyarihan ni Solomon.
- source_word: מִן הַנָּהָר
  choice: mula sa Ilog
  rationale: Pinananatili ang katawagang heograpikal na “ang Ilog” ng Hebreo; tinutukoy ito bilang Eufrates sa talababa.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: lupain ng mga Filisteo
  rationale: Tuwirang inilalarawan nito ang construct phrase at mas malinaw sa karaniwang mambabasa kaysa sa pangalang “Filistia.”
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: at hanggang sa hangganan ng Ehipto
  rationale: Malinaw nitong ipinahahayag ang lawak ng teritoryo hanggang sa hangganan ng Ehipto.
- source_word: מַגִּשִׁים מִנְחָה
  choice: nagdadala sila sa kanya ng tributo
  rationale: Maaaring mangahulugan ang מִנְחָה ng handog, regalo, o tributo. Sa konteksto ng mga kahariang nasasakupan, “tributo” ang pinakanababagay; idinagdag ang “sa kanya” bilang likas na paglilinaw sa Tagalog.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: nag­lilingkod kay Solomon
  rationale: Pinananatili ng “naglilingkod” ang ugnayan ng nasasakupan sa nakatataas nang hindi ipinapalagay na sapilitang paggawa ang tinutukoy.
- source_word: כָּל יְמֵי חַיָּיו
  choice: sa buong buhay niya
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng Hebreong idyomang “lahat ng araw ng kanyang buhay.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “naghahari,” “lupain,” at “hangganan” bilang karaniwang bokabularyo, habang pinanatili ang “tributo” dahil malinaw ang kontekstong pampolitika. Ang mga pananda ng talababa ay inilagay kaagad pagkatapos ng kaugnay na salita.
