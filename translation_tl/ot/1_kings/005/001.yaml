- from: At si Solomon ay naghahari sa lahat ng kaharian mula sa Ilog[a] hanggang sa lupain ng mga Filisteo at hanggang sa hangganan ng Ehipto. Nagdadala sila sa kanya ng tributo[b] at naglilingkod kay Solomon sa buong buhay niya.
  to: At si Solomon ay naghahari noon sa lahat ng mga kaharian, mula sa Ilog[a] hanggang sa lupain ng mga Filisteo at hanggang sa hangganan ng Ehipto. Nagdadala sila ng tributo[b] sa kanya at naglilingkod kay Solomon sa buong panahon ng kanyang buhay.
