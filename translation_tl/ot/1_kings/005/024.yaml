translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy na binibigyan” upang ipakita ang nagpapatuloy o nakaugaliang kilos, at pinanatili ang bahagyang kalabuan ng panghalip sa hulihan sa halip na tahasang idagdag ang pangalan ni Solomon.
