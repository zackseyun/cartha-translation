- from: At patuloy na binibigyan ni Hiram si Solomon ng kahoy na sedro at kahoy na sipres[a], ayon sa lahat ng ninanais niya.
  to: At patuloy na binibigyan ni Hiram si Solomon ng kahoy na sedro at kahoy na sipres[a], ayon sa lahat ng nais ni Solomon.
  rationale: Nilinaw ang tinutukoy ng panghalip sa huling parirala upang matapat na maihatid na si Solomon ang may mga nais na tinutugunan, at upang maiwasan ang kalabuan sa modernong Tagalog. Pinanatili ang duratibong diwa, mga pangalan, mga terminong pangkahoy, at talababa.
