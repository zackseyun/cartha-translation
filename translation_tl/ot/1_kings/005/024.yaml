  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: tl
  text: At patuloy na binibigyan ni Hiram si Solomon ng kahoy na sedro at kahoy na sipres[a], ayon sa lahat ng nais ni Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahoy na enebro,” o ayon sa tradisyon, “kahoy na abeto.” Hindi tiyak ang eksaktong uri ng punong tinutukoy ng salitang Hebreo na beroshim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At patuloy na
  rationale: Ipinapakita ng וַיְהִי kasama ng kasunod na participle ang pag-usad ng salaysay at isang nagpapatuloy o nakaugaliang kilos sa nakaraan; likas itong naipahahayag sa Tagalog sa pamamagitan ng “At patuloy na.”
- source_word: חִירוֹם
  choice: Hiram
  rationale: Isinalin sa karaniwang anyong ginagamit sa modernong Bibliyang Tagalog ang pangalang pantangi.
- source_word: נֹתֵן
  choice: binibigyan
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagbibigay; pinananatili ng aspektong imperpektibo ng “binibigyan” ang duratibong diwa.
- source_word: לִשְׁלֹמֹה
  choice: si Solomon
  rationale: Ang לְ ay tumutukoy sa tumatanggap. Sa pandiwang Tagalog na “binibigyan,” likas na minamarkahan ang tumatanggap bilang “si Solomon.”
- source_word: עֲצֵי אֲרָזִים
  choice: kahoy na sedro
  rationale: Sa konteksto ng panustos sa pagtatayo, ang parirala ay tumutukoy sa materyales na kahoy mula sa sedro, hindi lamang sa mga buhay na puno.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: at kahoy na sipres
  rationale: Ang “sipres” ay isang karaniwang makabagong katumbas para sa בְּרוֹשִׁים, isang koniperong ginagamit sa pagtatayo; inilalahad sa talababa ang kawalang-katiyakan tungkol sa eksaktong uri.
- source_word: כָּל חֶפְצוֹ
  choice: ayon sa lahat ng ninanais niya
  rationale: Malapit nitong pinananatili ang kabuuang saklaw ng כָּל at ang diwa ng חֵפֶץ bilang nais o hangarin, habang nananatiling malinaw sa modernong Tagalog. Sa konteksto, malamang na si Solomon ang tinutukoy ng “niya,” ngunit hindi nililinaw ng anyong Hebreo ang pangngalan.
