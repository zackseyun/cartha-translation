  terminology: Ang “mga lingkod,” “mga balsa ng troso,” “ipababatid mo sa akin,” at “sambahayan” ay angkop. Ang mga talababa ay wasto ang mga pananda at sapat na nagpapaliwanag sa alternatibong leksikal at metonimiya.
