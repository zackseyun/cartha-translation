base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: tl
  text: Ibababa ng aking mga lingkod ang mga iyon mula sa Lebanon patungo sa dagat. Pagsasama-samahin ko ang mga iyon bilang mga balsa ng troso[a] sa dagat at dadalhin hanggang sa lugar na ipababatid mo sa akin. Doon ay paghihiwalayin ko ang mga iyon, at ikaw naman ang magdadala ng mga iyon. At gawin mo ang nais ko sa pamamagitan ng paglalaan ng pagkain para sa aking sambahayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga balsa”; tumutukoy ito sa mga trosong pinagsama upang palutangin at ihatid sa dagat.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pagbibigay ng tinapay sa aking bahay.” Dito, ang “tinapay” ay malamang na tumutukoy sa pagkain o mga panustos para sa sambahayan ni Hiram.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: aking mga lingkod
  rationale: Sa konteksto ng utos ng hari at paggawa, tumutukoy ito sa mga tauhan o manggagawang naglilingkod kay Hiram; hindi binibigyang-diin ng talata ang legal na kalagayan ng pagkaalipin.
- source_word: יֹרִדוּ
  choice: ibababa
  rationale: 'Ang Hiphil ng ירד ay causative: ang mga lingkod ang magpapababa o magdadala pababa sa kahoy mula sa Lebanon.'
- source_word: יָמָּה
  choice: patungo sa dagat
  rationale: Maaaring mangahulugang 'pakanluran' o 'patungo sa dagat,' ngunit malinaw sa konteksto ng paglalayag na dagat ang hantungan.
- source_word: דֹּבְרוֹת
  choice: mga balsa ng troso
  rationale: Tumutukoy ang bihirang salitang ito sa mga trosong pinagsama upang palutangin at ihatid sa dagat; malinaw at likas sa Filipino ang 'mga balsa ng troso.'
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: hanggang sa lugar na ipababatid mo sa akin
  rationale: Ang literal na ideya ng 'magpadala sa akin' ay malamang na pagpapadala ng tagubilin o mensahe tungkol sa itinakdang lugar. Pinananatili ng 'ipababatid' ang paraan ng komunikasyon nang hindi sobrang nagpapaliwanag.
- source_word: וְנִפַּצְתִּים
  choice: paghihiwalayin ko ang mga iyon
  rationale: Karaniwang saklaw ng נָפַץ ang pagbasag o pagpapangalat. Dito, sa konteksto ng mga balsa ng troso, tumutukoy ito sa pagkakalas o paghihiwalay sa mga trosong pinagsama.
- source_word: תִשָּׂא
  choice: magdadala ng mga iyon
  rationale: Malawak ang kahulugan ng נשא—buhatin, dalhin, o kunin. Matapos paghiwa-hiwalayin ang mga balsa, ang natural na diwa rito ay dadalhin ni Solomon ang mga troso mula roon.
- source_word: חֶפְצִי
  choice: ang nais ko
  rationale: Pinananatili nito ang personal na kahulugan ng kagustuhan o kahilingan ni Hiram.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: paglalaan ng pagkain para sa aking sambahayan
  rationale: Literal na 'pagbibigay ng tinapay sa aking bahay,' ngunit ang 'tinapay' ay metonimiya para sa pagkain o panustos at ang 'bahay' ay sambahayan ng hari.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lingkod,” “sambahayan,” at “balsa ng troso” bilang likas na mga salitang angkop sa kontekstong maharlika at pangkalakalan. Pinanatili ang pag-uulit ng mga tahasang panghalip kung nakatutulong itong katawanin ang diin ng Hebreo.
