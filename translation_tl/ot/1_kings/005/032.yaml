  to: Kaya tinabas at inihanda ng mga tagapagtayo ni Solomon, ng mga tagapagtayo ni Hiram, at ng mga taga-Gebal[a] ang kahoy at mga bato upang itayo ang bahay.[b]
  rationale: Pinalitan ang ‘mga kahoy’ ng ‘kahoy’ upang maging mas natural na tawag sa kahoy na materyales sa pagtatayo, at ginawang ‘upang’ ang pang-ugnay para sa mas maayos na marangal na rehistro. Hindi binago ang saklaw o kahulugan ng Hebreong teksto. Bahagyang inayos din ang panimulang pormula ng talababa a para sa karaniwang Filipino na gamit sa mga alternatibong salin.
