  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: tl
  text: Kaya tinabas at inihanda ng mga tagapagtayo ni Solomon, ng mga tagapagtayo ni Hiram, at ng mga taga-Gebal[a] ang kahoy at mga bato upang itayo ang bahay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga Gebalita” o “mga Giblita,” samakatuwid, mga manggagawang mula sa Gebal (Byblos).
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang bahay ng PANGINOON—ang templo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: tinabas
  rationale: Ang pandiwang פסל ay tumutukoy sa pagtabas o paghubog ng materyales para sa pagtatayo. Ang “tinabas” ay natural sa makabagong Filipino at maaaring gamitin kapwa sa kahoy at bato.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: mga tagapagtayo ni Solomon
  rationale: Bagaman literal na “mga tagapagtayo ng kay Solomon,” malinaw na tumutukoy ito sa mga manggagawang nagtatayo para kay Solomon. Ang salin ay natural at pinananatili ang kahulugang panghanapbuhay.
- source_word: וּבֹנֵי חִירוֹם
  choice: mga tagapagtayo ni Hiram
  rationale: Pinananatili nito ang paralelismo sa “mga tagapagtayo ni Solomon” at malinaw na tumutukoy sa mga manggagawa ni Hiram.
- source_word: וְהַגִּבְלִים
  choice: mga taga-Gebal
  rationale: Ito ay katawagang tumutukoy sa mga taong mula sa Gebal, na kilala rin bilang Byblos. Ang “mga taga-Gebal” ay malinaw at natural sa Filipino.
- source_word: וַיָּכִינוּ
  choice: inihanda
  rationale: Ang Hiphil ng כון ay karaniwang nangangahulugang ihanda o gawing handa, na angkop sa konteksto ng pagtatayo.
- source_word: הָעֵצִים
  choice: mga kahoy
  rationale: Sa konteksto, tumutukoy ito sa kahoy na materyales sa pagtatayo. Mas karaniwan at madaling maunawaan ang “mga kahoy” kaysa sa mas teknikal na katawagan.
- source_word: וְהָאֲבָנִים
  choice: mga bato
  rationale: Tuwirang pinananatili nito ang payak na salita ng Hebreo nang hindi ipinapalagay na mga bloke o batong masonerya ang espesipikong anyo.
- source_word: לִבְנוֹת הַבָּיִת
  choice: para itayo ang bahay
  rationale: Pinananatili ng “bahay” ang mismong larawan at katawagan ng Hebreo, samantalang nililinaw sa talababa na ang tinutukoy sa konteksto ay ang templo ng PANGINOON.
theological_decisions:
- issue: Ang tinutukoy ng הַבָּיִת
  choice: bahay sa pangunahing teksto, na may paliwanag sa talababa
  alternative: templo
  rationale: Ang Hebreo ay literal na “ang bahay,” ngunit sa konteksto ito ang bahay ng PANGINOON, ang templo. Pinananatili ng pangunahing teksto ang katawagan ng pinagmulan nang hindi ikinukubli ang kahulugan nito sa mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tagapagtayo” para sa occupational participles at “mga taga-Gebal” para maiwasan ang malabong etnonimo sa pangunahing teksto. Inilagay ang mga pananda ng talababa sa mismong mga salitang ipinapaliwanag.
