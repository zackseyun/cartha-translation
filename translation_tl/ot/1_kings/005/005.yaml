base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: tl
  text: At namuhay nang panatag ang Juda at Israel; bawat isa[a] ay nasa ilalim ng kanyang baging ng ubas at ilalim ng kanyang puno ng igos[b], mula Dan hanggang Beer-seba, sa buong panahon ni Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat lalaki”; ang panlalaking isahang anyo ay ginagamit dito nang distributibo.
    reason: lexical_alternative
  - marker: b
    text: Ang pananatili sa ilalim ng baging ng ubas at puno ng igos ay kinagawiang larawan ng kapayapaan, katiwasayan, at kasaganaan sa lupain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: namuhay
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa matatag at patuloy na paninirahan, hindi lamang sa literal na pag-upo. Likas sa modernong Tagalog ang “namuhay” kasama ng “nang panatag.”
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: ang Juda at Israel
  rationale: Pinananatili ang dalawang pangalang pampolitika at pangkasunduang tahasang binanggit sa Hebreo, sa halip na gawing pangkalahatang “ang bayan.”
- source_word: לָבֶטַח
  choice: nang panatag
  rationale: Ipinahihiwatig nito ang ligtas, walang pangamba, at matatag na kalagayan. Ang “nang panatag” ay natural at marangal sa Tagalog.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ang panlalaking isahang anyo sa Hebreo ay ginagamit nang distributibo. Ang “bawat isa” ang likas na katumbas sa Tagalog at naipapakita ang indibiduwal na saklaw nang hindi nagpapasok ng di-likas na kasariang gramatikal; ipinaliliwanag sa talababa ang literal na anyo.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: sa ilalim ng sarili niyang punong ubas at puno ng igos
  rationale: Pinananatili ang kongkretong larawan ng ubas at igos, pati ang distributibong pagmamay-ari na ipinahihiwatig ng mga hulaping panghalip sa Hebreo.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: mula Dan hanggang Beer-seba
  rationale: Pinananatili ang heograpikong pahayag na sumasaklaw sa buong lupain, pati ang mga pangalan ng lugar.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: sa buong panahon ni Solomon
  rationale: Natural itong pagpapahayag sa Tagalog ng tagal ng kalagayang iyon sa mga araw o paghahari ni Solomon.
theological_decisions:
- issue: Ang distributibong panlalaking אִישׁ
  choice: bawat isa
  alternative: bawat lalaki
  rationale: Walang kasariang gramatikal ang karaniwang distributibong “bawat isa” sa Tagalog. Naipapahayag nito ang saklaw sa bawat miyembro ng bayan habang hindi ikinukubli ang anyong Hebreo, na tahasang inilalahad sa talababa.
- issue: Ang larawang “sa ilalim ng kanyang punong ubas at puno ng igos”
  choice: Panatilihin ang literal na larawan sa pangunahing teksto
  alternative: mamuhay sa kapayapaan at kasaganaan
  rationale: Ang larawan ay may pampanitikan at teolohikal na bigat bilang sagisag ng kapayapaan, katiwasayan, at kasaganaan. Ang pagpapaliwanag nito sa talababa ay umiiwas sa labis na pagpapakahulugan sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang mga pangalang Juda, Israel, Dan, Beer-seba, at Solomon, at hindi pinalitan ng paliwanag ang pangunahing metapora.
