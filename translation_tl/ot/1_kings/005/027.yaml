  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: tl
  text: Nagpatawag si Haring Solomon ng mga manggagawa mula sa buong Israel para sa sapilitang paggawa[a], at tatlumpung libong lalaki ang bilang nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang salitang Hebreo ay tumutukoy sa sapilitang serbisyo sa paggawa, hindi pangunahing sa buwis na salapi. Maaari ring isalin: “nagpataw ng isang sapilitang pangkat ng mga manggagawa mula sa buong Israel.”'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: nagpataw
  rationale: Ang hiphil ng עלה kasama ng מַס ay tumutukoy sa pagpapataw o pagtatalaga ng isang sapilitang ambag na paggawa. Likas sa modernong Filipino ang “nagpataw” at pinananatili nito ang pagkilos ng hari bilang awtoridad.
- source_word: מַס
  choice: sapilitang paglilingkod / sapilitang paggawa
  rationale: Sa konteksto ng mga proyektong pagtatayo ni Solomon, ang מַס ay sapilitang serbisyo sa paggawa, hindi pangunahing buwis na salapi. Ginamit ang “sapilitang paglilingkod” sa unang sugnay para sa ipinataw na obligasyon at “sapilitang paggawa” sa ikalawa para sa pangkat ng mga manggagawa.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: mula sa buong Israel
  rationale: Malinaw nitong ipinapakita na ang mga manggagawa ay kinuha mula sa kabuuan ng Israel, habang pinananatili ang saklaw ng כָּל.
- source_word: וַיְהִי הַמַּס
  choice: ang kabilang sa sapilitang paggawa
  rationale: Isinalin nang idiomatiko ang literal na “at ang sapilitang paggawa ay” upang malinaw na ipakilala ang bilang ng mga lalaking sakop ng sapilitang paglilingkod.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: tatlumpung libong lalaki
  rationale: Ang אִישׁ sa kontekstong ito ay tumutukoy sa mga lalaking manggagawa; kaya pinanatili ang tiyak na panlalaking sanggunian sa halip na gawing pangkalahatang “tao.”
