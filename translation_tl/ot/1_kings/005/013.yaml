  text: וַ/יְדַבֵּר֮ עַל הָֽ/עֵצִים֒ מִן הָ/אֶ֨רֶז֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וְ/עַד֙ הָ/אֵז֔וֹב אֲשֶׁ֥ר יֹצֵ֖א בַּ/קִּ֑יר וַ/יְדַבֵּר֙ עַל הַ/בְּהֵמָ֣ה וְ/עַל הָ/ע֔וֹף וְ/עַל הָ/רֶ֖מֶשׂ וְ/עַל הַ/דָּגִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: tl
  text: Nagsalita siya tungkol sa mga puno, mula sa sedro na nasa Lebanon hanggang sa isopo[a] na tumutubo sa pader. Nagsalita rin siya tungkol sa mga hayop, mga ibon, mga gumagapang na nilalang, at mga isda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring isang maliit na halamang mabango; hindi tiyak kung anong uri ng halaman ang Hebreong אֵזוֹב, bagaman “isopo” ang tradisyonal na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: nagsalita tungkol sa
  rationale: Karaniwang ipinahihiwatig ng דִּבֵּר na may עַל ang pagsasalita hinggil sa isang paksa. Likas ito sa makabagong Filipino at hindi nito pinalalabis ang diwa bilang pormal na pagtuturo o siyentipikong paglalarawan.
- source_word: הָעֵצִים
  choice: mga puno
  rationale: Sa konteksto, tumutukoy ang maramihan ng עֵץ sa mga puno o halamang makahoy. Pinananatili ng “mga puno” ang pangunahing kategoryang binubuksan ng sedro.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: sedro na nasa Lebanon
  rationale: Ang אֶרֶז ay sedro, na bantog na kaugnay ng Lebanon. Natural sa Filipino ang “nasa Lebanon” para sa lokasyong tinutukoy ng parirala.
- source_word: מִן ... וְעַד
  choice: mula ... hanggang
  rationale: Ito ang natural na katumbas sa Filipino ng Hebreong saklaw na mula sa isang dulo hanggang sa isa pa.
- source_word: הָאֵזוֹב
  choice: isopo
  rationale: Ang “isopo” ang tradisyonal at nakikilalang salin, ngunit hindi tiyak ang eksaktong halamang tinutukoy; kaya inilalahad ang kawalang-katiyakan sa talababa.
- source_word: יֹצֵא בַּקִּיר
  choice: tumutubo sa pader
  rationale: Literal na “lumalabas sa pader” ang pandiwa, ngunit sa kontekstong botanikal ay malinaw at natural ang “tumutubo sa pader,” nang hindi binabago ang larawan.
- source_word: הַבְּהֵמָה
  choice: mga hayop
  rationale: Sa talaang kasama ang mga ibon, gumagapang na nilalang, at isda, malawak na kategorya ng mga hayop ang malamang na diwa, hindi lamang mga alagang hayop.
- source_word: הָעוֹף
  choice: mga ibon
  rationale: Bagaman maaaring masaklaw ng עוֹף ang mga nilalang na lumilipad, “mga ibon” ang pinakanatural na kahulugan sa ganitong pag-uuri.
- source_word: הָרֶמֶשׂ
  choice: mga gumagapang na nilalang
  rationale: Mas malawak ang רֶמֶשׂ kaysa sa makabagong kategoryang “reptilya.” Pinananatili ng saling ito ang malawak na Hebreong kategorya ng mga nilalang na gumagapang o umuusad sa lupa.
- source_word: הַדָּגִים
  choice: mga isda
  rationale: Ito ang karaniwang Filipino para sa pangkalahatang kategoryang ipinahihiwatig ng maramihang דָּגִים.
