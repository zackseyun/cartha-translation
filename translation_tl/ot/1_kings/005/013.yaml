translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “nagsalita tungkol sa” sa halip na mas teknikal na “tinalakay” upang hindi magdagdag ng diwang wala sa Hebreo. Nasa mismong teksto ang panandang talababa [a].
