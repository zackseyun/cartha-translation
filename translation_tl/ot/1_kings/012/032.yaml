  to: 'Nagtakda si Jeroboam ng isang kapistahan sa ikawalong buwan[a], sa ikalabinlimang araw ng buwan, gaya ng kapistahang nasa Juda. Umakyat siya sa altar[b]. Ganito ang ginawa niya sa Bethel: naghandog siya sa mga guyang ginawa niya, at nagtalaga siya sa Bethel ng mga pari ng matataas na lugar na ginawa niya.'
