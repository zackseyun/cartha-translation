language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: tl
  text: 'Nagtakda si Jeroboam ng isang kapistahan sa ikawalong buwan[a], sa ikalabinlimang araw ng buwan, gaya ng kapistahang nasa Juda. Umakyat siya sa altar[b]. Ganito ang ginawa niya sa Bethel: naghandog siya sa mga guyang ginawa niya, at nagtalaga siya sa Bethel ng mga pari ng matataas na lugar na ginawa niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang tinutukoy na kapistahan sa Juda ay ang Kapistahan ng mga Kubol, na ipinagdiriwang sa ikalabinlimang araw ng ikapitong buwan. Itinakda ni Jeroboam ang katapat nitong kapistahan makalipas ang isang buwan.
    reason: cross_reference
  - marker: b
    text: O “umakyat siya patungo sa altar.” Ang Hebreong parirala ay maaari ring isaling mas literal na “umakyat siya sa ibabaw ng altar,” ngunit sa konteksto ay maaaring tumukoy ito sa paglapit o pag-akyat sa altar upang mangasiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: nagtakda ... ng isang kapistahan
  rationale: Ang עשה na may חָג ay idyomatikong tumutukoy sa pagdaraos o pagtatatag ng kapistahan. Ang “nagtakda” ay natural sa Tagalog at angkop sa kontekstong si Jeroboam ang nagtalaga ng petsa at pagdiriwang.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: sa ikawalong buwan
  rationale: Tuwirang salin ng pariralang pangkalendaryo.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: sa ikalabinlimang araw ng buwan
  rationale: Natural na modernong Tagalog para sa pormula ng petsa sa Hebreo.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: gaya ng kapistahang ipinagdiriwang sa Juda
  rationale: Pinananatili ang tahasang paghahambing ngunit hindi pinapangalanan ang kapistahan, sapagkat hindi ito pinangalanan sa talata.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: umakyat siya patungo sa altar
  rationale: Ang parirala ay maaaring mangahulugang pag-akyat o paglapit sa altar upang mangasiwa. Ang “patungo sa” ay natural at hindi nagpapahiwatig nang tiyak na tumuntong siya sa ibabaw nito.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: Gayon din ang ginawa niya sa Bethel
  rationale: Malinaw na ipinahahayag ang pagtutugma ng ginawa niya sa Bethel sa naunang kilos.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: naghandog siya sa mga guya
  rationale: Ipinakikita ang layunin o kasunod na gawa at pinananatili na sa mga guya nakatuon ang paghahandog.
- source_word: הָעֲגָלִים
  choice: mga guya
  rationale: Literal at sapat ang “mga guya”; hindi idinaragdag sa pangunahing teksto ang salitang “diyus-diyosan,” bagaman malinaw iyon sa mas malawak na konteksto.
- source_word: וְהֶעֱמִיד
  choice: inilagay niya
  rationale: Malapit ito sa pangunahing diwa ng causative verb na ‘itayo/ilagay’ at natural sa Tagalog. Hindi nito labis na tinutukoy kung ito ay pormal na paghirang o simpleng pagtatalaga sa lugar.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: mga pari ng matataas na lugar
  rationale: Pinananatili ang karaniwang katawagang biblikal para sa mga lokal na lugar ng pagsamba, nang hindi nagdaragdag ng hayagang paghatol sa mismong parirala.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Pinananatili ang paulit-ulit na kaugnay na sugnay na nag-uugnay sa mga guya at sa matataas na lugar kay Jeroboam.
theological_decisions:
- issue: Pagkakakilanlan ng “kapistahang ipinagdiriwang sa Juda”
  choice: Panatilihing pangkalahatan sa pangunahing teksto at ipaliwanag lamang sa talababa ang malamang na pagtukoy sa Kapistahan ng mga Kubol.
  alternative: Tahasang pangalanan sa pangunahing teksto bilang Kapistahan ng mga Kubol o Tabernakulo.
  rationale: Malakas ang pahiwatig mula sa petsa at konteksto, ngunit hindi pinangalanan ng Hebreong talata ang kapistahan.
- issue: Pagsusuring teolohikal sa gawa ni Jeroboam
  choice: Ilarawan ang mga kilos nang walang idinagdag na mapanuring katawagan.
  alternative: Tawaging “mga diyus-diyosan” ang mga guya o “mga di-lehitimong pari” ang mga pari.
  rationale: Kinokondena ng mas malawak na salaysay ang kulto ni Jeroboam, ngunit inilalahad ng talatang ito ang mga kilos sa paraang deskriptibo.
- issue: Kahulugan ng pag-akyat sa altar
  choice: “Umakyat ... patungo sa altar,” na hindi nagpapasya kung siya ay umakyat sa ibabaw mismo nito.
  alternative: “Umakyat siya sa ibabaw ng altar” o “lumapit siya sa altar.”
  rationale: Maaaring tumukoy ang Hebreong עָלָה עַל sa pag-akyat patungo sa altar upang mangasiwa, ngunit posible rin ang mas literal na pag-unawa; iniingatan ng salin at talababa ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Juda,” “Bethel,” “altar,” at “kapistahan” bilang pamilyar na katawagang biblikal. Iniwasan ang sobrang arkaikong ayos at ang pagdaragdag ng tahasang paghatol na wala sa mismong talata.
