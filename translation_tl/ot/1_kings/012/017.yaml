  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: tl
  text: Ngunit naghari si Rehoboam sa mga Israelitang naninirahan sa mga lungsod ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ang literal na “mga anak na lalaki ng Israel” ay isang idyomatikong tawag sa sambayanan; natural at tumpak sa makabagong Filipino ang “mga Israelita.”
- source_word: הַ/יֹּשְׁבִים
  choice: naninirahan
  rationale: Ang participle ng ישב ay tumutukoy sa patuloy na paninirahan; malinaw at dignidad ang “naninirahan.”
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: sa mga lunsod ng Juda
  rationale: Pinananatili nito ang payak na lokatibong kahulugan at hindi labis na tinutukoy ang eksaktong politikal na hangganan.
- source_word: וַ/יִּמְלֹךְ
  choice: naghari
  rationale: Sa salaysay, ang מלך ay nangangahulugang gumampan bilang hari o mamahala bilang hari; maikli at natural ang “naghari.”
- source_word: עֲלֵי/הֶם
  choice: sa
  rationale: Sa Filipino, ang “naghari sa mga Israelita” ay natural na naghahayag ng pamamahala sa kanila nang hindi na inuulit ang hiwalay na panghalip.
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: וּ
  choice: Ngunit
  rationale: 'Bagaman karaniwang pang-ugnay ang waw, ipinakikita rito ng konteksto ang kaibahan: naghimagsik ang mga lipi sa hilaga, ngunit nanatili sa paghahari ni Rehoboam ang mga Israelitang nasa mga lunsod ng Juda.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod” bilang natural na katumbas ng עִיר sa kontekstong teritoryal, at pinanatili ang “mga Israelita” upang ipakita na ang tinutukoy ay mga kabilang sa Israel na naninirahan sa Juda.
