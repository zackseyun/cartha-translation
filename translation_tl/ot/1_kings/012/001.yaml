source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ רְחַבְעָ֖ם שְׁכֶ֑ם כִּ֥י שְׁכֶ֛ם בָּ֥א כָל יִשְׂרָאֵ֖ל לְ/הַמְלִ֥יךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/001.yaml
  text: Then Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: tl
  text: Pumunta si Rehoboam sa Shekem, sapagkat nagpunta roon ang buong Israel upang gawin siyang hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pumunta
  rationale: Natural na salin ng pandiwang nagsasaad ng pagpunta sa isang lugar; hindi kailangang panatilihin ang Hebreong panandang pasalaysay bilang hiwalay na “at.”
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Transliterasyong angkop sa tunog ng pangalang Hebreo sa modernong Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Pinananatili ang tahasang ugnayang sanhi: pumunta si Rehoboam dahil naroon ang buong Israel para sa pagkilala sa kaniya bilang hari.'
- source_word: כָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Tuwirang pinananatili ang kolektibong pananalita ng pinagmulan nang hindi nililimitahan kung mga pinuno lamang o lahat ng tao ang tinutukoy.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: upang gawin siyang hari
  rationale: 'Ipinahahayag ang causative na kahulugan ng pandiwang Hebreo: pagtatalaga o pagkilala sa kaniya bilang hari.'
theological_decisions:
- issue: Papel ng Israel sa paghahari ni Rehoboam
  choice: “upang gawin siyang hari”
  alternative: “upang koronahan siyang hari” o “upang kilalanin siyang hari”
  rationale: Ang causative na pandiwang Hebreo ay literal na tumutukoy sa paggawa o pagtatalaga sa kaniya bilang hari. Hindi idinaragdag ang koronasyon, na hindi tahasang binanggit, at hindi rin pinapahina ang aktibong papel ng kapulungan sa pamamagitan lamang ng “kilalanin.”
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sapagkat” upang panatilihin ang sanhi, at iniwasan ang di-kinakailangang pag-uulit ng “sa Shekem” sa ikalawang sugnay sa pamamagitan ng natural na “roon,” nang hindi binabago ang kahulugan.
