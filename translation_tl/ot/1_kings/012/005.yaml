  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Umalis muna kayo, at bumalik kayo sa akin pagkalipas ng tatlo pang araw.” Kaya umalis ang mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Sinabi niya sa kanila
  rationale: Likas at tuwirang salaysay sa modernong Tagalog; ipinananatili ang nagsasalita at ang mga kinausap nang hindi kailangang isalin nang hiwalay ang panimulang waw.
- source_word: לְכוּ
  choice: Umalis muna kayo
  rationale: Ang maramihang pautos ng הלך ay tumutukoy rito sa pansamantalang pag-alis sa harap ng hari. Nililinaw ng “muna” ang pansamantalang pagpapaalis nang hindi ginagawang permanente ang utos.
- source_word: עֹד שְׁלֹשָׁה יָמִים
  choice: nang tatlong araw
  rationale: Sa konteksto, ang עֹד kasama ng yugto ng panahon ay nagsasaad na maghintay o manatiling wala sa loob ng tatlong araw. Natural sa Tagalog ang “muna ... nang tatlong araw”; hindi na kailangan ang literal ngunit alanganing “tatlo pang araw.”
- source_word: וְשׁוּבוּ אֵלָי
  choice: pagkatapos ay bumalik kayo sa akin
  rationale: Pinananatili ang maramihang pautos, direksiyon pabalik sa nagsasalita, at ang pagkakasunod ng dalawang utos.
- source_word: וַיֵּלְכוּ הָעָם
  choice: Kaya umalis ang mga tao
  rationale: Ipinahahayag ang pagsunod ng bayan sa utos. Ang kolektibong הָעָם ay natural na “mga tao” sa Tagalog, at inuulit ng “umalis” ang kilos na iniutos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kayo” para sa maramihang pautos at iniwasan ang sobrang literal na ayos na magiging hindi natural sa Tagalog.
