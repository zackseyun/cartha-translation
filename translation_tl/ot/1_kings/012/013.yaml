translation:
  language: tl
  text: At mabagsik na sinagot ng hari ang bayan, at tinalikuran niya ang payo ng matatandang tagapayo na nagpayo sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: sinagot
  rationale: Ang qal ng ענה ay nangangahulugang sumagot o tumugon. Ang “sinagot” ay natural sa Filipino at nagpapanatili ng kaugnayan sa naunang kahilingan ng bayan.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tumutukoy ang tiyak na pangngalan sa hari na kilala na sa konteksto.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עָם ay tumutukoy sa nagkakatipong sambayanan ng Israel. Mas angkop dito ang “bayan” kaysa “mga tao” sapagkat kolektibong pangkat ang tinutukoy.
- source_word: קָשָׁה
  choice: marahas
  rationale: Inilalarawan nito ang mabigat at mabagsik na paraan ng pagsagot ng hari. Ginamit na pang-abay ang “marahas na” sa natural na ayos ng Filipino.
- source_word: וַיַּעֲזֹב
  choice: tinalikuran
  rationale: Ang עזב ay maaaring mangahulugang iwan, talikuran, o pabayaan. Ipinahihiwatig ng “tinalikuran” ang tiyak na hindi pagsunod sa payo.
- source_word: עֲצַת
  choice: payo
  rationale: Ang עֵצָה ay payo o kapasyahang inirerekomenda. Ang “payo” ay malinaw, natural, at angkop sa konteksto ng pagpapayo sa hari.
- source_word: הַזְּקֵנִים
  choice: matatandang tagapayo
  rationale: Hindi lamang edad ang mahalaga rito; ang mga זְקֵנִים ay mga nakatatandang lalaking gumaganap bilang kinikilalang tagapayo. Nililinaw ng “tagapayo” ang kanilang papel.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: na nagpayo sa kanya
  rationale: Tinutukoy ng sugnay ang matatanda bilang mga taong nagpayo sa hari. Sa Filipino, sapat na ang aspektong perpektibo ng “nagpayo” upang ipakitang nauna ang pagpapayo sa pagtalikod niya rito.
