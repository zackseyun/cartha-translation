    rationale: Ang salita ay tumutukoy sa mabagsik o matinding paraan ng pagsagot, samantalang ang “marahas” sa modernong Filipino ay madaling maunawaang pisikal na marahas.
  revised_text: At mabagsik na sinagot ng hari ang bayan, at tinalikuran niya ang payo ng matatandang tagapayo na nagpayo sa kanya.
