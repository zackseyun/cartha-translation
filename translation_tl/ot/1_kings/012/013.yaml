translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “bayan” para sa kolektibong Israel at “matatandang tagapayo” upang maipakita kapwa ang katandaan at opisyal na papel ng mga זְקֵנִים. Walang kinakailangang talababa.
