base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: tl
  text: Sinabi niya[a] sa kanya, “Kung ngayong araw ay magiging lingkod ka ng bayang ito at paglilingkuran mo sila, sasagutin mo sila, at magsasalita ka sa kanila ng mabubuting salita[b], sila naman ay magiging mga lingkod mo habang panahon[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ibinigay na tekstong Hebreo ay “sinabi niya”; ayon sa konteksto at sa ibang anyo ng tekstong Hebreo, maaari ring “sinabi nila.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “magiliw na salita” o “magagandang salita.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa lahat ng araw”; maaari ring “palagi.”
    reason: idiom
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: Sinabi niya sa kanya
  rationale: Likas na salin sa makabagong Tagalog ng pormulang Hebreo para sa pagpapakilala ng tuwirang pahayag. Sinusunod ng panghalip na isahan ang ibinigay na tekstong WLC, habang itinatala sa talababa ang usaping tekstuwal at pangkonteksto.
- source_word: עֶבֶד
  choice: lingkod
  rationale: Sa kontekstong pampolitika, inilalarawan nito ang hari na naglilingkod sa bayan. Mas angkop ang “lingkod” kaysa “alipin,” ngunit pinananatili nito ang ugnayan sa kaparehong pangngalan sa hulihan ng talata.
- source_word: וַעֲבַדְתָּם
  choice: paglilingkuran mo sila
  rationale: 'Pinananatili ang salitang-ugat at diwa ng עֶבֶד sa naunang parirala: magiging lingkod ang hari at aktuwal na maglilingkod sa bayan.'
- source_word: וַעֲנִיתָם
  choice: sasagutin sila
  rationale: Ang ענה rito ay tumutukoy sa pagsagot sa kahilingan ng bayan, hindi sa pagpapahirap.
- source_word: דְּבָרִים טוֹבִים
  choice: mabubuting salita
  rationale: Malapit sa Hebreo at malinaw sa Tagalog; hindi nito nililimitahan ang kahulugan sa kabaitan lamang, bagaman posible rin ang “magagandang” o “magiliw na salita.”
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: sila naman ay magiging mga lingkod mo
  rationale: 'Pinananatili ang tahasang pangngalang “mga lingkod” at ang tumbasang kabalintunaan: kung paglilingkuran sila ng hari ngayon, paglilingkuran naman nila siya.'
- source_word: כָּל הַיָּמִים
  choice: habang panahon
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na “lahat ng mga araw,” na nagpapahiwatig ng patuloy o palagiang paglilingkod.
theological_decisions:
- issue: Ang paglilingkod bilang talinghagang pampolitika tungkol sa paghahari
  choice: Panatilihin ang tuwirang wika ng pagiging lingkod at paglilingkod.
  alternative: Gumamit ng mas teknikal na wikang pampolitika gaya ng “maging tagapaglingkod ng bayan” o “pagbigyan ang bayan.”
  rationale: Ang payo ay tungkol sa asal ng hari sa isang agarang krisis. Pinananatili ng salin ang tumbasan at ironiya ng wikang paglilingkod nang hindi dinaragdagan ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bayang ito” para sa kolektibong עָם at pinanatili ang pag-uulit ng “lingkod/paglilingkuran” upang marinig ang mahalagang tumbasan sa Hebreo.
