  yaml_path: translation/ot/1_kings/012/019.yaml
  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: tl
  text: Kaya mula noon hanggang sa araw na ito, naghihimagsik ang Israel laban sa sambahayan ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Kaya naghimagsik ang Israel laban sa sambahayan ni David hanggang sa araw na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: naghihimagsik
  rationale: Sa kontekstong pampolitika, ang פשע ay tumutukoy sa paghihimagsik o pag-aalsa laban sa naghaharing dinastiya. Kasama ng pariralang “hanggang sa araw na ito,” ipinahihiwatig ng anyong Filipino ang kalagayang nagsimula noon at nagpapatuloy.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalang pantangi. Sa konteksto, kolektibo itong tumutukoy sa mga lipi sa hilaga na humiwalay sa dinastiya ni David.
- source_word: בְּבֵית דָּוִד
  choice: laban sa sambahayan ni David
  rationale: Sa konstruksyong ito, ang בְּ ay tumutukoy sa kinakalaban, at ang “sambahayan ni David” ay nagpapanatili sa dinastikong kahulugan ng בֵּית דָּוִד.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mula noon hanggang sa araw na ito
  rationale: Ang “hanggang sa araw na ito” ay karaniwang idyomang Hebreo para sa pagpapatuloy hanggang sa panahon ng manunulat. Ang “mula noon” ay likas na nilinaw sa Filipino upang maipakita ang simula sa isinalaysay na pangyayari nang hindi binabago ang diwa.
