id: 1KI.12.15
reference: 1 Kings 12:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: tl
  text: Kaya hindi pinakinggan ng hari ang bayan, sapagkat ang takbo ng mga pangyayari ay mula kay Yahweh[a], upang isakatuparan ang kanyang salita na sinabi ni Yahweh sa pamamagitan ni Ahias[b] na taga-Silo kay Jeroboam na anak ni Nebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat ang sanhi ay mula kay Yahweh.” Ang Hebreong סִבָּה ay maaaring mangahulugang “sanhi,” “dahilan,” o pag-ikot ng mga pangyayari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kamay ni Ahias na taga-Silo,” isang idyomang nangangahulugang “sa pamamagitan ni Ahias na taga-Silo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: pinakinggan
  rationale: Sa kontekstong may kahilingan ng bayan, nangangahulugan itong dinggin o sundin ang kanilang pakiusap, hindi lamang marinig ang kanilang tinig.
- source_word: הָעָם
  choice: ang bayan
  rationale: Karaniwang salin ito para sa עָם at tumutukoy rito sa sambayanan ng Israel na humarap sa hari.
- source_word: סִבָּה
  choice: ganitong takbo ng mga pangyayari
  rationale: Maaaring tumukoy ang salita sa sanhi, dahilan, o pag-ikot ng mga pangyayari. Ang pariralang ito ay likas sa modernong Tagalog at pinananatili ang diwa ng isang pangyayaring umunlad ayon sa pagkalinga ng Diyos nang hindi nililinaw nang lampas sa Hebreo ang mekanismo ng sanhi.
- source_word: מֵעִם יְהוָה
  choice: mula kay Yahweh
  rationale: Tuwirang ipinapahayag ng parirala ang pinagmulan; pinananatili ang tipanang pangalan na Yahweh.
- source_word: לְמַעַן הָקִים
  choice: upang isakatuparan
  rationale: Ipinahihiwatig ng לְמַעַן ang layunin, at ang הֵקִים kasama ng 'salita' ay tumutukoy sa pagpapatibay o pagsasakatuparan ng naunang pahayag.
- source_word: דְּבָרוֹ
  choice: ang kanyang salita
  rationale: Pinananatili ng 'salita' ang malawak na saklaw at biblikal na idyoma ng Hebreo; ang 'pangako' ay magiging mas makitid.
- source_word: בְּיַד
  choice: sa pamamagitan ni
  rationale: Ito ang likas na Tagalog para sa Hebreong idyoma ng ahensiya, na literal na 'sa kamay ni.'
- source_word: הַשִּׁילֹנִי
  choice: na taga-Silo
  rationale: Likas na isinasalin sa Tagalog ang gentiliko bilang pagtukoy sa pinanggalingang lugar ni Ahias.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang Tagalog na anyo ng pangalan at patronimiko.
theological_decisions:
- issue: Banal na pagkilos at pananagutan ng tao
  choice: Iniuugnay ang takbo ng mga pangyayari kay Yahweh at sa layuning isakatuparan ang nauna niyang salita, habang nananatiling sariling pagkilos ng hari ang hindi pakikinig.
  alternative: Sabihing pinahintulutan lamang ni Yahweh ang pangyayari, o tahasang sabihing direktang pinilit ni Yahweh ang hari na tumanggi.
  rationale: Malinaw sa Hebreo na mula kay Yahweh ang pangyayari at may layunin itong pagtibayin ang kanyang salita, ngunit hindi nito ipinaliliwanag ang eksaktong mekanismo ng ugnayan ng banal na kapamahalaan at pasiya ng hari.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal at tipanang pangalan.
- issue: Layunin ng pangyayari sa לְמַעַן הָקִים
  choice: upang isakatuparan ang kanyang salita
  alternative: upang mapatunayang totoo ang kanyang salita; upang matupad ang kanyang salita
  rationale: Pinananatili ng aktibong 'isakatuparan' ang causative na anyo ng pandiwa at ang layuning kaugnay ng katuparan ng propetikong salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong Israel, “ganitong takbo ng mga pangyayari” upang mapanatili ang lawak ng סִבָּה, at “sa pamamagitan ni” bilang likas na katumbas ng Hebreong idyoma. Inilagay ang bawat talababa sa mismong pariralang ipinaliliwanag nito.
