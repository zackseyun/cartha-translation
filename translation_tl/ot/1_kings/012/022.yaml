  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: tl
  text: 'At dumating ang salita ng Diyos kay Semaya, ang tao ng Diyos,[a] na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “dumating ang salita ng Diyos kay Semaya.” Bagaman sa mga kahalintulad na pormula ay madalas na “salita ng PANGINOON,” ang tekstong ito ay gumagamit ng “Diyos” (אֱלֹהִים), hindi ng banal na pangalan na YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: dumating
  rationale: Sa pormulang ויהי דבר... אל, likas sa Filipino ang “dumating ... ang salita” at napapanatili nito ang pangyayaring may banal na pahayag na ipinadala.
- source_word: דְּבַר
  choice: salita
  rationale: Sa pormulang ito ng paghahayag, tumutukoy ang דְּבַר sa pahayag ng Diyos. Pinananatili ng “salita” ang biblikal na idyoma at diwang teolohikal; maaari rin sana ang “mensahe,” ngunit mas nagpapaliwanag iyon.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Ang אֱלֹהִים dito ay tumutukoy sa tunay na Diyos at hindi sa banal na pangalang YHWH.
- source_word: אֶל
  choice: kay
  rationale: Tinutukoy ng pang-ukol ang tumanggap ng banal na salita; “kay” ang natural na gamit bago ang pangalan ng tao.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Ginamit ang anyong pangalang nakasanayan sa tradisyong biblikal na Filipino, habang malinaw na kinakatawan ang pangalang Hebreo na שְׁמַעְיָה.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Ang parirala ay isang kinikilalang katawagan sa propetikong tauhan. Sa modernong Filipino, mas natural at mas malinaw ang “lingkod ng Diyos” kaysa sa literal ngunit maaaring malabong “tao ng Diyos.”
- source_word: לֵאמֹר
  choice: na nagsasabi
  rationale: Ipinakikilala nito ang tuwirang pahayag na susunod sa kasunod na talata at pinananatili ang ugnayang pangdiskurso ng Hebreo.
theological_decisions:
- issue: Pagkasalin sa אֱלֹהִים sa pormula ng paghahayag
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang nasa tekstong Hebreo, hindi YHWH. Kaya hindi ito iniharmonisa sa mas karaniwang pormulang “salita ng PANGINOON.”
- issue: Pagkasalin sa titulong אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  alternative: ang tao ng Diyos
  rationale: Pinananatili ang propetikong tungkulin ng titulo sa natural na Filipino nang hindi nagdaragdag ng tiyak na katawagang “propeta,” na wala sa mismong parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit ng “Diyos” dahil naroon ito sa dalawang magkahiwalay na parirala sa Hebreo. Ang ayos na “dumating kay Semaias ... ang salita” ay nagpapanatili sa diin at daloy ng pormulang Hebreo nang hindi nagiging lubhang literal.
