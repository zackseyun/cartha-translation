base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: tl
  text: Pagkatapos, sumangguni si Haring Rehoboam sa matatandang tagapayo na naglingkod sa harapan ni Solomon[a], na kanyang ama, noong buhay pa si Solomon. Sinabi niya, “Ano ang maipapayo ninyo sa akin na isagot sa bayang ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na nakatayo sa harapan ni Solomon.” Ang pananalitang ito ay maaaring mangahulugang naglilingkod o dumadalo sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: sumangguni
  rationale: Ang Niphal ng יעץ ay tumutukoy rito sa paghingi ng payo sa iba; natural at malinaw sa modernong Filipino ang “sumangguni.”
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: si Haring Rehoboam
  rationale: Karaniwang ayos sa Filipino ang titulo bago ang pangalang pantangi.
- source_word: הַזְּקֵנִים
  choice: matatandang tagapayo
  rationale: Sa konteksto ng maharlikang hukuman, ang זקנים ay mga nakatatandang estadista o tagapayo, hindi lamang matatandang lalaki. Nililinaw ng “tagapayo” ang kanilang gampanin.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: na naglingkod sa harapan ni Solomon
  rationale: Pinananatili ng “sa harapan” ang Hebreong larawan, samantalang ipinahahayag ng “naglingkod” ang kahulugang panghukuman ng idyoma.
- source_word: אָבִיו
  choice: kanyang amang si Solomon
  rationale: Malinaw na kinikilala si Solomon bilang ama ni Rehoboam at natural ang ayos na ito sa Filipino.
- source_word: בִּהְיֹתוֹ חַי
  choice: noong nabubuhay pa ito
  rationale: Ipinakikita ng “pa” ang paghahambing sa kasalukuyang kalagayan sa salaysay, nang patay na si Solomon.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Ano ang maipapayo ninyo sa akin
  rationale: Bagaman “paano” ang literal na halaga ng אֵיךְ, mas likas sa Filipino ang “Ano ang maipapayo” sa paghingi ng nilalaman ng payo; ang “sa akin” ay ipinahihiwatig ng tagpo.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: na isagot
  rationale: Ang parirala ay literal na tumutukoy sa pagbabalik ng isang salita, ngunit idyomatikong nangangahulugang magbigay ng tugon. Sapat at natural ang “isagot.”
- source_word: הָעָם הַזֶּה
  choice: bayang ito
  rationale: Ang עם ay kolektibong “bayan” o “sambayanan.” Pinananatili ng “bayang ito” ang isahang kolektibo at demonstratibo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “matatandang tagapayo” upang maipakita ang opisyal na gampanin ng mga elder sa korte, at isang talababa upang mapanatili ang literal na larawan ng Hebreong idyoma.
