  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: tl
  text: At sinabi ni Jeroboam sa sarili niya[a], “Ngayon, babalik ang kaharian sa sambahayan ni David.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa kanyang kalooban.” Literal sa Hebreo: “sa kanyang puso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa Filipino ang “At sinabi” at pinananatili nito ang daloy ng Hebreo nang hindi dinaragdagan ang ugnayang pamanahon.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa mga saling Bibliya sa Filipino.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Literal itong “sa kanyang puso” at tumutukoy sa panloob na pag-iisip. Pinananatili ang larawang Hebreo; nililinaw sa talababa ang likas na katumbas na “sa sarili.”
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tuwirang ipinapahayag ang agarang pangamba ni Jeroboam at natural sa makabagong Filipino.
- source_word: תָּשׁוּב
  choice: babalik
  rationale: Ang pandiwang שוב ay nangangahulugang bumalik o manumbalik. Ang “babalik” ay angkop sa hinaharap na pagbabalik ng kaharian sa dating dinastiya.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Tumutukoy sa sakop ng paghahari o politikal na kaharian; “kaharian” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: לְבֵית דָּוִד
  choice: sa sambahayan ni David
  rationale: Pinananatili ng “sambahayan ni David” ang metaporang “bahay” bilang angkan o dinastiya, nang hindi ito tahasang pinapakahulugang “dinastiya” sa pangunahing teksto.
theological_decisions:
- issue: Ang idyoma ng panloob na pagsasalita na בְּלִבּוֹ
  choice: sa kanyang puso
  alternative: sa kanyang sarili
  rationale: Pinananatili ang larawang antropolohikal at pampanitikan ng Hebreo habang ipinapaliwanag sa talababa ang idiomatikong kahulugan. Walang idinaragdag na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga biblikal na larawang “sa kanyang puso” at “sambahayan ni David,” habang ang talababa ay nagbibigay ng mas idiomatikong pagbasa.
