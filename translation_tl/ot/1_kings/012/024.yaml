id: 1KI.12.24
reference: 1 Kings 12:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh: “Huwag kayong umahon ni makipaglaban sa inyong mga kapatid, ang mga anak ni Israel.[a] Bumalik ang bawat isa sa kanyang bahay, sapagkat sa akin nagmula ang bagay na ito.[b]” Kaya pinakinggan nila ang salita ni Yahweh at bumalik sila upang umuwi, ayon sa salita ni Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “makipaglaban sa inyong mga kapatid, ang mga anak ni Israel.” Binibigyang-diin ng “mga kapatid” na ito ay digmaan laban sa kapwa nila kabilang sa Israel.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “sapagkat sa akin nagmula ang pangyayaring ito” o “ang usaping ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sabi ni Yahweh
  rationale: Pinananatili ang pormulang ginagamit ng mensahero ng Diyos at isinasalin nang tuwiran ang pangalang יְהוָה bilang “Yahweh.”
- source_word: לֹא תַעֲלוּ
  choice: Huwag kayong umahon
  rationale: Ang עלה ay karaniwang “umahon” o “pumaitaas”; maaari itong tumukoy sa pagmamartsa ng hukbo, ngunit hindi iyon tahasang idinagdag sa pangunahing teksto.
- source_word: וְלֹא תִלָּחֲמוּן עִם
  choice: o makipaglaban sa
  rationale: Ang Niphal ng לחם ay “makipaglaban.” Sa ganitong konstruksyon, ang עִם ay tumutukoy sa kalabang nilalabanan, kaya likas sa Tagalog ang “makipaglaban sa.”
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: inyong mga kapatid, ang mga anak ni Israel
  rationale: Pinananatili ang mahalagang wikang pampamilya na nagpapakitang ang digmaan ay laban sa sarili nilang mga kapatid sa Israel, pati ang appositional na “mga anak ni Israel.”
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Bumalik ang bawat isa sa kanyang bahay
  rationale: Ang אִישׁ ay distributibo rito, “bawat isa,” at ang בֵּיתוֹ ay tuwirang “kanyang bahay.”
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: sapagkat sa akin nagmula ang bagay na ito
  rationale: Ipinahahayag nito na ang pangyayari o usaping ito ay nagmula kay Yahweh, nang hindi higit na tinutukoy ang eksaktong paraan ng banal na sanhi.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: Kaya pinakinggan nila ang salita ni Yahweh
  rationale: Ang שׁמע ay maaaring mangahulugang makarinig, makinig, o sumunod. Pinananatili ng “pinakinggan” ang pandinig na diwa habang ipinakikita ng kasunod na kilos ang pagsunod.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת
  choice: at tumalikod sila upang umuwi
  rationale: Inihahayag sa natural na Tagalog ang pinagsamang ideya ng pagbabalik at pag-alis sa halip na ipilit ang alanganing literal na “bumalik upang lumakad.”
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ang pormal na pahayag na ang kanilang ginawa ay nakaayon sa iniutos ni Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan ng Diyos ang יְהוָה sa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi ito pinapalitan ng titulo.
- issue: Diwang pampamilya ng אֲחֵיכֶם
  choice: inyong mga kapatid
  alternative: inyong mga kapwa Israelita
  rationale: Mahalaga sa pagbabawal ang tahasang pagkilala na ang mga haharapin nila sa digmaan ay kanilang sariling mga kapatid; hindi ito pinapahina tungo sa mas pangkalahatang “kapwa.”
- issue: Saklaw ng banal na sanhi sa מֵאִתִּי נִהְיָה
  choice: sa akin nagmula ang bagay na ito
  alternative: ako ang gumawa ng bagay na ito
  rationale: Ipinananatili ang pahayag na mula kay Yahweh ang pangyayari nang hindi dinaragdagan ang teksto ng mas tiyak na paliwanag tungkol sa direktang pagkilos, pagpapahintulot, o pamamaraan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang pormulang propetiko, ang pangalang Yahweh, at ang wikang pampamilya. Ginawang natural ang huling kilos bilang “tumalikod sila upang umuwi” habang pinananatili ang diwa ng Hebreong pagbabalik at paglakad.
