revisions:
- from: 'Ganito ang sabi ni Yahweh: “Huwag kayong umahon o makipaglaban sa inyong mga kapatid, ang mga anak ni Israel.[a] Bumalik ang bawat isa sa kanyang bahay, sapagkat sa akin nagmula ang bagay na ito.[b]” Kaya pinakinggan nila ang salita ni Yahweh at tumalikod sila upang umuwi, ayon sa salita ni Yahweh.'
  to: 'Ganito ang sabi ni Yahweh: “Huwag kayong umahon ni makipaglaban sa inyong mga kapatid, ang mga anak ni Israel.[a] Bumalik ang bawat isa sa kanyang bahay, sapagkat sa akin nagmula ang bagay na ito.[b]” Kaya pinakinggan nila ang salita ni Yahweh at bumalik sila upang umuwi, ayon sa salita ni Yahweh.'
  rationale: Pinalitan ang “o” ng “ni” upang maging likas at malinaw ang magkakaugnay na negatibong utos. Pinalitan ang “tumalikod sila” ng “bumalik sila” upang tumugma sa pangunahing diwa ng Hebreong pandiwa at maiwasan ang diwang pag-abandona. Walang binago sa saklaw ng pahayag tungkol sa banal na pinagmulan ng pangyayari o sa mga footnote anchor.
