translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na paralelismo. Pinanatili ang metaporang “pamatok” at ang matinding larawang “mga alakdan.” Inilipat ang pananda ng talababa sa “mga alakdan,” na siyang salitang tinatalakay nito.
