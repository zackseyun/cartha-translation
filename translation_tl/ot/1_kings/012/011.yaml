base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: tl
  text: At ngayon, pinabigat ng aking ama ang inyong pamatok, ngunit dadagdagan ko pa ang inyong pamatok. Dinisiplina kayo ng aking ama gamit ang mga latigo, ngunit didisiplinahin ko kayo gamit ang mga alakdan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring tumukoy sa mga latigong tinatawag na “alakdan,” samakatuwid, mga latigo o panghagupit na ginawa upang magdulot ng mas matinding sakit; literal na “gamit ang mga alakdan” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: pinabigat
  rationale: Ang Hiphil ng עמס ay nagpapahiwatig ng pagpapataw ng mabigat na pasan. Kasama ng “pamatok,” malinaw at natural ang “pinabigat” habang pinananatili ang metapora.
- source_word: עֹל / עֻלְּכֶם
  choice: pamatok
  rationale: Pinananatili ng “pamatok” ang konkretong larawan ng mapaniil na pamamahala o sapilitang paggawa, sa halip na gawing payak na “pasan.” Inulit ito ayon sa retorika ng Hebreo.
- source_word: כָּבֵד
  choice: mabigat (sa pandiwang “pinabigat”)
  rationale: Literal na nangangahulugang “mabigat.” Isinama ang diwa sa likas na pandiwang Filipino na “pinabigat.”
- source_word: אוֹסִיף עַל
  choice: dadagdagan ko pa
  rationale: Malapit itong sumusunod sa kahulugang “magdagdag sa” o “dagdagan,” at hindi tahasang pinapalitan ng interpretatibong “lalo kong pabibigatin.”
- source_word: יִסַּר / אֲיַסֵּר
  choice: dinisiplina / didisiplinahin
  rationale: Maaaring mangahulugan ang יסר ng pagdidisiplina o pagpaparusa, kabilang ang pisikal na paraan. Pinananatili ng “disiplina” ang lawak ng salita at ang magkatulad na anyo ng dalawang sugnay.
- source_word: בַּשּׁוֹטִים
  choice: gamit ang mga latigo
  rationale: Ang שׁוֹט ay latigo o panghagupit; tuwiran at karaniwan sa modernong Filipino ang “mga latigo.”
- source_word: בָּעַקְרַבִּים
  choice: gamit ang mga alakdan
  rationale: Literal na “mga alakdan” ang Hebreo. Maaaring ito ay talinghaga o tawag sa mas malulupit na latigo, kaya pinanatili ang literal na larawan sa teksto at inilagay ang posibleng kahulugan sa talababa.
