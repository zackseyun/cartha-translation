base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: tl
  text: Nagsalita siya sa kanila ayon sa payo ng mga kabataang lalaki, na sinasabi, “Pinabigat ng aking ama ang inyong pamatok, at dadagdagan ko pa ang inyong pamatok. Dinisiplina kayo ng aking ama sa pamamagitan ng mga latigo, ngunit didisiplinahin ko kayo sa pamamagitan ng mga alakdan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring “mga latigong-alakdan,” samakatuwid, mga latigong may matutulis na dulo o tinik. Literal na “mga alakdan” ang nasa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kinausap niya
  rationale: Ang piel ng דבר ay karaniwang nangangahulugang ‘magsalita.’ Ang ‘kinausap niya sila’ ay natural sa Filipino at hindi labis na nagpapakahulugan dito bilang pormal na pagsagot.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: ayon sa payo ng mga kabataang lalaki
  rationale: Ang עֵצָה ay ‘payo,’ at ang mga tinutukoy na יְלָדִים sa konteksto ay ang nakababatang mga tagapayo, hindi maliliit na bata.
- source_word: הִכְבִּיד
  choice: Pinabigat
  rationale: Tuwirang pinananatili nito ang diwa ng hiphil na ‘ginawang mabigat’ at ang kaugnay na metapora ng pamatok.
- source_word: עֻלְּכֶם
  choice: inyong pamatok
  rationale: Ang עֹל ay literal na ‘pamatok’ at metapora ng sapilitang paggawa o mabigat na pamamahala; mahalagang panatilihin ang kongkretong larawan.
- source_word: אֹסִיף עַל
  choice: dadagdagan ko pa
  rationale: Sinasalamin nito ang literal na idyomang ‘magdaragdag sa’; ang ‘pa’ ay natural na nagpapahayag ng higit pang pagpapabigat.
- source_word: יִסַּר / אֲיַסֵּר
  choice: Dinisiplina / didisiplinahin
  rationale: Ang יסר ay maaaring tumukoy sa pagdidisiplina o pagpaparusa sa pamamagitan ng pagtutuwid. Pinananatili ng ‘disiplina’ ang lawak ng pandiwa sa marahas na kontekstong ito.
- source_word: בַּשּׁוֹטִים
  choice: sa pamamagitan ng mga latigo
  rationale: Ang שׁוֹט ay latigo o panghagupit; malinaw at karaniwan sa modernong Filipino ang ‘latigo.’
- source_word: בָּעַקְרַבִּים
  choice: sa pamamagitan ng mga alakdan
  rationale: Literal na ‘mga alakdan’ ang Hebreo. Posibleng tumukoy ito sa mga latigong may matutulis na bahagi, ngunit hindi dapat tahimik na alisin ang kongkretong larawan at tunay na kalabuan.
theological_decisions:
- issue: Larawan ng kaparusahan sa salitang ‘mga alakdan’
  choice: Panatilihin sa pangunahing teksto ang literal na ‘mga alakdan’
  alternative: Isalin bilang ‘mga latigong-alakdan’ o ‘mga latigong may matutulis na tinik’
  rationale: Kongkretong pangngalang עקרבים ang ginamit ng Hebreo. Pinananatili ng literal na salin ang kalabuan ng pinagmulan, habang ipinapaliwanag sa talababa ang posibleng teknikal o matalinghagang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metaporang ‘pamatok’ at ang literal na larawang ‘mga alakdan.’ Ginamit ang ‘mga kabataang lalaki’ upang malinaw na tukuyin ang nakababatang mga tagapayo. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinatalabaan.
