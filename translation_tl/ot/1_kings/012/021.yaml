  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw na si Rehoboam ang dumating sa Jerusalem at nagtipon; naisasama ang buong sambahayan ng Juda, ang lipi ni Benjamin, ang bilang na 180,000, ang layuning makidigma laban sa sambahayan ng Israel, at ang pagpapanumbalik ng kaharian kay Rehoboam na anak ni Solomon. Ang “piling mandirigma” ay angkop na pagsasalin ng בָּחוּר עֹשֵׂה מִלְחָמָה sa kontekstong militar.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang paggamit ng “sambahayan” para sa magkatapat na ‘house of Judah/Israel’ ay nauunawaan at napapanatili ang kolektibong pampolitikang idyoma. Ang estruktura ng pangungusap at paggamit ng em dash sa bilang ay maayos.
