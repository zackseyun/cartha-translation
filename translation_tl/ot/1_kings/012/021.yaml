  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: tl
  text: Nang dumating si Rehoboam sa Jerusalem, tinipon niya ang buong sambahayan ng Juda at ang lipi ni Benjamin—180,000 piling mandirigma[a]—upang makipaglaban sa sambahayan ng Israel at ibalik ang kaharian kay Rehoboam na anak ni Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “180,000 piling lalaking handang makidigma.”
    reason: Ipinakikita ang mas tahasang pagbasa sa בָּחוּר עֹשֵׂה מִלְחָמָה, na maaaring ilarawan bilang mga piniling lalaking nakahanda o angkop sa pakikidigma.
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: dumating
  rationale: Ang בוא na may Jerusalem bilang patutunguhan ay likas na isinasalin na “dumating.” Bagaman maramihan ang anyong katinig sa tekstong ibinigay, si Rehoboam ang nag-iisang simuno, gaya rin ng kasunod na pandiwang isahan.
- source_word: וַיַּקְהֵל
  choice: tinipon niya
  rationale: 'Ang Hiphil ng קהל ay may diwang sanhi: tipunin o pagpulungin ang mga tao. Nilinaw ng “niya” na si Rehoboam ang gumawa nito.'
- source_word: כָּל בֵּית יְהוּדָה
  choice: ang buong sambahayan ng Juda
  rationale: Pinananatili ang pampolitika at kolektibong idyomang “sambahayan,” at itinutugma ito sa “sambahayan ng Israel” sa hulihan ng talata.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: ang lipi ni Benjamin
  rationale: Tahasang isinasalin ang שֵׁבֶט bilang “lipi,” ang karaniwang katawagan sa mga tribo ng Israel sa Filipino.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: 180,000
  rationale: Malinaw at likas na makabagong pagsulat ng bilang sa Filipino.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: piling mandirigma
  rationale: Sa kontekstong militar, ang בָּחוּר ay tumutukoy sa mga pinili o mahuhusay na lalaki, at ang עֹשֵׂה מִלְחָמָה ay sa mga nakikidigma. Ang “piling mandirigma” ay maikli, natural, at tapat sa pinagsamang diwa.
- source_word: לְהִלָּחֵם עִם
  choice: upang makipaglaban sa
  rationale: Ipinahahayag ng parirala ang layunin ng pagtitipon at ang pakikipaglaban laban sa kabilang panig; malinaw ito sa konteksto kahit “sa” ang likas na gamit sa Filipino.
- source_word: בֵּית יִשְׂרָאֵל
  choice: sambahayan ng Israel
  rationale: Pinananatili ang kolektibo at pampolitikang idyoma at ang pagkakahanay nito sa “sambahayan ng Juda.”
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: ibalik ang kaharian
  rationale: Ang Hiphil ng שׁוב ay “ibalik,” samantalang ang מַמְלָכָה rito ay tumutukoy sa kaharian o paghaharing nais mabawi.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: kay Rehoboam na anak ni Solomon
  rationale: Ang לְ ay nagmamarka sa tatanggap ng ibabalik na kaharian; natural itong ipinapahayag ng “kay” sa Filipino.
theological_decisions:
- issue: Saklaw ng מַמְלָכָה
  choice: kaharian
  alternative: paghahari
  rationale: Tumutukoy ang konteksto sa pambansang kahariang nais ibalik sa pamamahala ni Rehoboam. Pinananatili ng “kaharian” ang kongkretong pampolitikang diwa, bagaman maaari ring saklawin ng salita ang karapatan o kapangyarihang maghari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang mapanatili ang magkatapat na kolektibong katawagang “sambahayan ng Juda” at “sambahayan ng Israel,” at iniwasan ang labis na teknikal o makalumang pananalita.
