  - severity: low
    issue: Em dash bago ng “sa buwang kinatha...”
    rationale: Nagiging bahagyang putol at hindi kinakailangang parentetikal ang temporal na parirala. Ang kuwit ay mas malinaw na nagsasama sa dalawang magkaugnay na pagtukoy sa buwan.
