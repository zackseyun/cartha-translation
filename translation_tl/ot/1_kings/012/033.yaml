  source_fidelity: Tumpak na naihahatid ng draft ang altar sa Bethel, ang ikalabinlimang araw ng ikawalong buwan, ang buwang sariling kinatha ni Jeroboam, ang kapistahan, at ang muling pag-akyat sa altar upang magsunog ng insenso. Gayunman, ang pambansang idyomang בְנֵי יִשְׂרָאֵל ay hindi likas na naipahahayag ng “mga anak ni Israel” sa modernong Filipino at maaaring magmukhang tumutukoy lamang sa mga anak o sa mga lalaki.
  naturalness: Mas natural ang “mga Israelita” para sa pambansang katawagan. Inayos din ang bantas upang ang “sa buwang...” ay malinaw na karagdagang paglalarawan ng petsa, hindi isang putol na kasunod ng em dash.
  terminology: Ang “altar,” “Bethel,” “kapistahan,” at “insenso” ay angkop sa modernong Filipino at sa rehistrong biblikal. Pinananatili ang “mula sa sarili niyang puso,” na malapit sa Hebreong idyoma at sa mapanuring himig ng salaysay.
