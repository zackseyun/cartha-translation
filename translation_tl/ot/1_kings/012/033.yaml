  text: וַ/יַּ֜עַל עַֽל הַ/מִּזְבֵּ֣חַ אֲשֶׁר עָשָׂ֣ה בְּ/בֵֽית אֵ֗ל בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י בַּ/חֹ֖דֶשׁ אֲשֶׁר בָּדָ֣א מ/ל/בד וַ/יַּ֤עַשׂ חָג֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּ֥עַל עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: tl
  text: Umakyat siya sa altar na ginawa niya sa Bethel noong ikalabinlimang araw ng ikawalong buwan, sa buwang kinatha niya mula sa sarili niyang puso[a]. Nagdaos siya ng kapistahan para sa mga Israelita[b], at umakyat siya sa altar upang magsunog ng insenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa buwang siya mismo ang nagtakda” o “sa buwang pinili niya ayon sa sarili niyang pasiya.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang pambansang katawagan para sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat siya
  rationale: Ang עלה ay karaniwang nangangahulugang “umakyat.” Pinananatili rin ang pag-uulit nito sa simula at dulo ng talata.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Karaniwan at malinaw na katawagan sa modernong Filipino para sa מזבח.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: na ginawa niya sa Bethel
  rationale: Tuwirang inilalarawan ang altar at pinananatili ang lokasyon.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: noong ikalabinlimang araw ng ikawalong buwan
  rationale: Natural na paraan sa Filipino ng pagpapahayag ng petsa habang pinananatili ang lahat ng detalye ng Hebreo.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: sa buwang kinatha niya mula sa sarili niyang puso
  rationale: Ipinahahayag ng בדא ang paglikha o pagkatha ng isang kaayusan, at pinananatili ng “mula sa sarili niyang puso” ang Hebreong idyoma at ang banayad na negatibong pagtataya ng tagapagsalaysay.
- source_word: וַיַּעַשׂ חָג
  choice: nagdaos siya ng kapistahan
  rationale: Natural sa Filipino ang “magdaos ng kapistahan” para sa עשה + חג, nang hindi nagdaragdag ng paliwanag kung gaano ito kapormal na itinatag.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili ang pormal na anyo ng karaniwang pambansang katawagan sa Hebreo.
- source_word: לְהַקְטִיר
  choice: upang magsunog ng insenso
  rationale: Sa kontekstong pangkulto, ang הקטיר ay tumutukoy sa pagsusunog upang pumailanlang ang usok, at madalas ay sa pagsusunog ng insenso.
theological_decisions:
- issue: Ang pagtatayang nakapaloob sa pariralang tumutukoy sa sariling paglikha ni Jeroboam ng buwan ng kapistahan
  choice: mula sa sarili niyang puso
  alternative: ayon sa sarili niyang pasiya / siya mismo ang nagtakda
  rationale: Pinananatili nito ang Hebreong larawan ng puso bilang bukal ng pasiya at ang pahiwatig na ang kapistahan ay hindi iniutos ng Diyos, nang hindi nagdaragdag ng tahasang komentaryo.
- issue: Ang pambansang katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Ang pormal na salin ay nagpapanatili sa anyo ng Hebreo; nililinaw ng talababa na kolektibong tawag ito sa bayan at hindi lamang pagtukoy sa mga lalaking mamamayan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “altar” at “insenso” bilang karaniwang bokabularyong biblikal, pinanatili ang pag-uulit ng “umakyat,” at iniwasang gawing tahasan ang hatol na ipinahihiwatig lamang ng salaysay.
