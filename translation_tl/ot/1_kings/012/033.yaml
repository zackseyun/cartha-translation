  to: Umakyat siya sa altar na ginawa niya sa Bethel noong ikalabinlimang araw ng ikawalong buwan, sa buwang kinatha niya mula sa sarili niyang puso[a]. Nagdaos siya ng kapistahan para sa mga Israelita[b], at umakyat siya sa altar upang magsunog ng insenso.
