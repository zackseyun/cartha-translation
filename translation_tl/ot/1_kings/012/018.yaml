  verdict: revise
  source_fidelity: 'Ang pagsasalin ay tapat sa Hebreo sa mga pangunahing detalye: si Adoram ang ipinadala, siya ang namamahala sa sapilitang paggawa, siya ay binato ng Israel at namatay, at si Rehoboam ay agarang sumakay sa karwahe upang tumakas sa Jerusalem. Gayunman, ang “Pinagbabato” ay aspektong di-ganap at karaniwang naglalarawan ng nagpapatuloy o paulit-ulit na kilos; ang Hebreong wayyiqtol ay nagsasalaysay ng naganap na kilos. Mas tumpak ang ganap na “Binato.”'
  naturalness: Malinaw at angkop sa makabagong marangal na Filipino ang karamihan ng teksto. Ang “Binato siya ng buong Israel ng mga bato” ay mas natural sa salaysay na nakaraan kaysa “Pinagbabato siya ...,” habang pinananatili ang tahasang pagbanggit sa mga bato.
  terminology: Ang “sapilitang paggawa” ay wastong di-teknikal na katumbas ng corvée/mas. Wasto ang “Adoram,” at kapaki-pakinabang ang talababa tungkol sa anyong “Adoniram.” Ang “nagmadali” ay isang likas na kontekstuwal na pagsasalin ng הִתְאַמֵּץ; maayos na ipinapaliwanag ng talababa ang mas literal na diwa.
