base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: tl
  text: Pagkatapos, isinugo ni Haring Rehoboam si Adoram[a], na namamahala sa sapilitang paggawa. Binato siya ng buong Israel ng mga bato, at namatay siya. Nagmadali[b] si Haring Rehoboam na sumakay sa karwahe upang tumakas patungong Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adoram sa Hebreo; sa ilang kaugnay na talata, Adoniram ang anyo ng pangalan.
    reason: alternative_reading
  - marker: b
    text: Ang pandiwang Hebreo ay mas literal na nangangahulugang “nagpakalakas” o “nagpumilit,” at sa kontekstong ito ay tumutukoy sa apurahang pagsisikap niyang makatakas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Karaniwang salitang pasalaysay para sa pagpapadala ni Rehoboam kay Adoram upang gumanap ng isang atas.
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Ito ang anyo ng pangalan sa tekstong Hebreo ng talatang ito; ang kaugnay na anyong Adoniram ay inilagay sa talababa.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: na namamahala sa sapilitang paggawa
  rationale: Tinutukoy nito ang opisyal na nangangasiwa sa sapilitang paglilingkod o corvée, hindi lamang sa buwis na salapi.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: pinagbabato siya ... ng mga bato
  rationale: Natural sa Filipino at pinananatili ang tahasang pagbanggit ng Hebreo sa mga bato.
- source_word: כָל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Pinananatili ang kolektibong katawagang pampolitika at pangtipan sa salaysay.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwirang ipinapahayag ang kasunod na pangyayari at kinalabasan ng pagbato.
- source_word: הִתְאַמֵּץ
  choice: nagmadali
  rationale: Sa konteksto ng agarang pagtakas, ipinahihiwatig ng pandiwa ang matinding pagpupunyagi at mabilis na pagkilos; inilalahad sa talababa ang mas literal na diwa.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: na sumakay sa karwahe
  rationale: Likas na Filipino para sa pag-akyat o pagsakay sa karwahe.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: upang tumakas patungong Jerusalem
  rationale: Pinananatili ng “tumakas” ang diwa ng apurahang pag-iwas sa panganib.
