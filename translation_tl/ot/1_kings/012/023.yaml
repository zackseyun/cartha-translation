  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: tl
  text: 'Sabihin mo kay Rehoboam, na anak ni Solomon at hari ng Juda, at sa buong sambahayan ng Juda, sa Benjamin, at sa nalalabi sa bayan:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Sabihin mo
  rationale: Ang pautos na anyo ng אמר ay nag-aatas na ihatid ang mensahe; natural at tuwiran sa modernong Tagalog ang “Sabihin mo.”
- source_word: בֶּן שְׁלֹמֹה
  choice: anak ni Solomon
  rationale: Tuwirang ipinapahayag ang kaugnayang pampamilya sa likas na ayos ng Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwiran at natural na salin ng titulong maharlika at ng nasasakupan nito.
- source_word: כָּל בֵּית יְהוּדָה
  choice: buong sambahayan ng Juda
  rationale: Pinananatili ang kolektibo at pampolitikang idyoma ng Hebreong “bahay ng Juda” sa isang dignidad ngunit nauunawaang anyong Tagalog.
- source_word: וּבִנְיָמִין
  choice: at sa Benjamin
  rationale: Ang pangalan ng lipi ay nakatayong mag-isa sa Hebreo; pinananatili ito nang hindi idinaragdag ang salitang “sambahayan,” na wala sa tekstong pinagmulan.
- source_word: וְיֶתֶר הָעָם
  choice: at sa nalalabi sa bayan
  rationale: Pinananatili ng “nalalabi” ang kahulugan ng יֶתֶר, at ng “bayan” ang kolektibong הָעָם nang hindi ito tahasang ginagawang “hukbo.”
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang tutuldok ay natural na panandang Tagalog na nagpapakilala sa mismong mensaheng susunod sa kasunod na talata.
theological_decisions:
- issue: Kung ang הָעָם ay partikular na tumutukoy sa hukbong nagkatipon
  choice: bayan
  alternative: hukbo
  rationale: Bagaman ang konteksto ay militar, “bayan/mga tao” ang tahasang salita sa Hebreo; hindi dapat paliitin ang saklaw nang walang leksikal na batayan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa pagbasa ng Kasulatan. Ginamit ang “sambahayan” upang mapanatili ang Hebreong kolektibong idyoma, at tutuldok upang likas na iugnay ang utos sa mensaheng kasunod.
