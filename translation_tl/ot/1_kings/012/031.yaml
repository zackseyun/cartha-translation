  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: tl
  text: Gumawa siya ng mga dambana sa matataas na lugar[a] at nagtalaga siya ng mga pari mula sa buong bayan, na hindi mula sa angkan ni Levi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bahay ng matataas na lugar,” isang idyoma para sa dambana o santuwaryong kaugnay ng mga matataas na lugar.
    reason: lexical_alternative
  - marker: b
    text: O “na hindi mga Levita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya / nagtalaga
  rationale: 'Malawak ang saklaw ng עשה, ngunit hinihingi ng natural na Tagalog ang magkaibang pandiwa ayon sa layon: “gumawa” para sa mga dambana at “nagtalaga” para sa mga pari.'
- source_word: בֵּית בָּמוֹת
  choice: mga dambana sa matataas na lugar
  rationale: Ang literal na “bahay ng matataas na lugar” ay isang idyoma para sa santuwaryo o dambanang kaugnay ng mga lugar ng pagsamba na tinatawag na matataas na lugar. Ang “mga dambana” ay malinaw at natural sa modernong Tagalog; ipinapaliwanag sa talababa ang anyong isahan ng Hebreo.
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang katumbas sa konteksto ng gawaing panrelihiyon.
- source_word: מִקְצוֹת הָעָם
  choice: mula sa iba't ibang bahagi ng bayan
  rationale: Pinananatili nito ang larawan ng pagpili mula sa mga dulo o saklaw ng sambayanan nang hindi ipinapalagay na literal na heograpikong mga dulo lamang o na bawat uri ng tao ay tiyak na kinatawan.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: na hindi kabilang sa mga anak ni Levi
  rationale: Pinananatili ang pantribo at pampamilyang pananalita ng Hebreo habang malinaw na ipinahihiwatig na hindi sila mga Levita.
theological_decisions:
- issue: Paglalarawan sa mga institusyong panrelihiyon na itinatag ni Jeroboam
  choice: mga dambana sa matataas na lugar
  alternative: isang bahay ng matataas na lugar
  rationale: Ipinahahayag ang kultikong kahulugan ng idyoma nang hindi nagdaragdag ng tahasang hatol na teolohikal na wala sa mismong talata.
- issue: Katayuang hindi Levitiko ng mga itinalagang pari
  choice: na hindi kabilang sa mga anak ni Levi
  alternative: na hindi mga Levita
  rationale: Pinananatili ang tahasang pananalita tungkol sa angkan ni Levi at ang makasaysayang pagkakaibang binibigyang-diin ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa הָעָם bilang sambayanan, at iniwasan ang sobrang literal ngunit di-likas na “mga dulo ng bayan.”
