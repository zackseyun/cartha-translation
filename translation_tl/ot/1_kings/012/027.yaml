id: 1KI.12.27
reference: 1 Kings 12:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: tl
  text: Kung aahon ang bayang ito upang maghandog ng mga hain sa bahay ni Yahweh sa Jerusalem[a], babalik ang puso ng bayang ito sa kanilang panginoon[b], kay Rehoboam na hari ng Juda; papatayin nila ako at babalik sila kay Rehoboam na hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapag aahon ang bayang ito…” Sa ilang konteksto, ang salitang Hebreo ay maaaring mangahulugang “kapag,” ngunit dito ay mas malamang na kondisyon itong kinatatakutan ni Jeroboam. Ang “bahay ni Yahweh” ay ang templo sa Jerusalem.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: O “sa kanilang amo.” Ang salitang Hebreo ay maaaring tumukoy sa isang panginoon o amo; nililinaw ng kasunod na parirala na si Rehoboam ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyunal na diwa ng kinatatakutan ni Jeroboam; maaari rin itong magkaroon ng pansamantalang diwang “kapag” sa ibang konteksto.
- source_word: יַעֲלֶה
  choice: aahon
  rationale: Pinananatili ang karaniwang idyoma ng pag-ahon patungong Jerusalem, kasama ang heograpiko at panrelihiyong pahiwatig nito.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: upang maghandog ng mga handog
  rationale: Likas sa modernong Filipino at malinaw na tumutukoy sa paghahandog ng mga hain; ang pag-uulit ng “handog” ay katanggap-tanggap at madaling maunawaan.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang metaporang Hebreo na “bahay,” na sa konteksto ay ang templo sa Jerusalem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang YHWH ayon sa patakaran ng proyekto.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: babalik ang puso ng bayang ito
  rationale: Pinananatili ang larawang “puso” bilang sentro ng katapatan at ang pag-uulit ng pandiwang bumalik sa hulihan ng talata.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: sa kanilang panginoon
  rationale: Bagaman may anyong morpolohikal na maaaring magmukhang maramihan, ang kasunod na paliwanag ay malinaw na tumutukoy sa iisang panginoon, si Rehoboam.
- source_word: רְחַבְעָם מֶלֶךְ יְהוּדָה
  choice: kay Rehoboam na hari ng Juda
  rationale: Natural na apposisyon sa Filipino at malinaw na pinananatili ang pangalan at maharlikang titulo.
- source_word: וַהֲרָגֻנִי
  choice: Papatayin nila ako
  rationale: Direkta, malinaw, at modernong katumbas ng pandiwang Hebreo para sa pagpatay.
- source_word: וְשָׁבוּ
  choice: at babalik sila
  rationale: Pinananatili ang leksikal na pag-uulit ng שׁוּב at ang kinatatakutang pagbabalik ng kanilang katapatan kay Rehoboam.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang “Yahweh” ang napiling tuwirang transliterasyon ng proyekto nang hindi pinapalitan ng titulong “Panginoon.”
- issue: Kahulugan ng pagbabalik ng puso
  choice: Panatilihin ang konkretong larawang “babalik ang puso”
  alternative: “manunumbalik ang katapatan”
  rationale: Ang literal na larawan ay nauunawaan sa Filipino at pinananatili ang posibleng saklaw na panloob, panrelihiyon, at pampolitikang katapatan nang hindi ito nililimitahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “aahon,” “bahay ni Yahweh,” at “babalik ang puso” upang maingatan ang mahahalagang larawan at pag-uulit sa Hebreo, habang ginawang natural ang ayos ng pangungusap sa Tagalog.
