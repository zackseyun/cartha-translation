base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: tl
  text: Kaya sumangguni ang hari at gumawa siya ng dalawang gintong guya. Sinabi niya sa kanila, “Masyadong mahirap para sa inyo ang umahon sa Jerusalem.[a] Narito ang mga diyos mo, Israel,[b] na nag-ahon sa iyo mula sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Sapat na ang pag-ahon ninyo sa Jerusalem,” o “Matagal na kayong umaahon sa Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Diyos mo, Israel.” Kung minsan, ang anyong Hebreo ay tumutukoy sa iisang Diyos; gayunman, pinapaboran dito ng dalawang guya at ng pandiwang maramihan ang “mga diyos.” Umaalingawngaw ang pananalita sa Exodo 32:4.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: sumangguni
  rationale: Ipinahihiwatig ng Niphal ng יעץ na humingi o nagsagawa ang hari ng pagsangguni bago kumilos. Likas at malinaw sa makabagong Tagalog ang “sumangguni.”
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: dalawang guyang ginto
  rationale: Malapit ito sa konstruksiyong Hebreo na “dalawang guya ng ginto,” ngunit mas natural sa Tagalog; pinananatili rin nito ang malinaw na alusyon sa Exodo 32.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: Napakahirap para sa inyo ang umahon pa sa Jerusalem
  rationale: Ipinapahayag nito ang posibilidad na ang pag-ahon ay labis o pabigat para sa bayan. Ang “pa” ay likas na naghahatid ng panawagan ng hari na huwag nang ipagpatuloy ang pagpunta roon, habang inilalagay sa talababa ang alternatibong diwa na “sapat na” o “matagal na.”
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ng “Narito” ang deiktiko at mariing pagpapakilala ng הִנֵּה, sa isang marangal ngunit madaling maunawaang anyo.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: iyong mga diyos, Israel
  rationale: Bagaman maaaring tumukoy sa iisang Diyos ang anyong אֱלֹהִים, pinapaboran dito ng dalawang guya at ng kasunod na pandiwang maramihan ang “mga diyos.” Direktang pantawag ang “Israel.”
- source_word: הֶעֱלוּךָ
  choice: na nag-ahon sa iyo
  rationale: 'Ang pandiwa ay maramihan at causative: sila umano ang nag-ahon o naglabas sa Israel. Pinananatili ng “nag-ahon” ang larawang kaugnay ng pag-ahon at ang alingawngaw ng pormulang tungkol sa Exodo.'
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Malapit ito sa Hebreo at pinananatili ang pamilyar na pormula ng pagliligtas mula sa lupain ng Ehipto.
theological_decisions:
- issue: Kung isahan o maramihan ang אֱלֹהֶיךָ sa pahayag ng hari
  choice: 'maramihan: “iyong mga diyos, Israel”'
  alternative: 'isahan: “iyong Diyos, Israel”'
  rationale: Maaaring gamiting pantukoy sa iisang Diyos ang anyong אֱלֹהִים, ngunit binanggit dito ang dalawang guya at maramihan din ang pandiwang הֶעֱלוּ. Kaya mas pinapaboran ng gramatika at agarang konteksto ang maramihan, habang pinananatili sa talababa ang tunay na posibilidad ng isahang pagbasa at ang alusyon sa Exodo 32:4.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang tuwirang pagsasalaysay at ang retorikal na bigat ng pahayag ng hari. Inilagay ang mga marker sa mismong pariralang may leksikal o gramatikal na alternatibo.
