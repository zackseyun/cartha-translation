revisions:
- from: Kaya sumangguni ang hari at gumawa ng dalawang guyang ginto. Sinabi niya sa kanila, “Napakahirap para sa inyo ang umahon pa sa Jerusalem.[a] Narito ang iyong mga diyos, Israel,[b] na nag-ahon sa iyo mula sa lupain ng Ehipto.”
  to: Kaya sumangguni ang hari at gumawa siya ng dalawang gintong guya. Sinabi niya sa kanila, “Masyadong mahirap para sa inyo ang umahon sa Jerusalem.[a] Narito ang mga diyos mo, Israel,[b] na nag-ahon sa iyo mula sa lupain ng Ehipto.”
  rationale: Inayos ang ayos ng mga panghalip at parirala para sa natural na modernong Filipino, habang pinananatili ang sintaktikong ugnayan, ang plural na “mga diyos,” ang ambiguidad ng רַב לָכֶם מֵעֲלוֹת sa talababa, at ang alingawngaw ng pandiwang “umahon/nag-ahon.”
