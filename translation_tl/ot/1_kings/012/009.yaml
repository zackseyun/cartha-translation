  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ano ang ipinapayo ninyo upang makasagot tayo sa bayang ito na nagsabi sa akin, ‘Pagaanin mo ang pamatok[a] na ipinataw sa amin ng iyong ama’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pamatok” ay larawan ng mabigat na paggawa at mga obligasyong ipinataw ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Ano ang maipapayo ninyo
  rationale: Likas na modernong Tagalog para sa tuwirang paghingi ng kasalukuyang payo, habang pinananatili ang diwa ng participial na anyo.
- source_word: וְנָשִׁיב דָּבָר
  choice: upang maisagot natin
  rationale: Ipinahahayag ang layuning nakapaloob sa idyomang Hebreo na literal na ‘magbalik ng salita,’ ibig sabihin ay magbigay ng sagot.
- source_word: הָעָם הַזֶּה
  choice: bayang ito
  rationale: Pinananatili ang kolektibong pangngalang עָם at ang bahagyang naglalayong tono ng demonstratibo.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: na nagsabi sa akin
  rationale: Natural at malinaw na Tagalog na naghahatid sa nilalaman ng sinabi nang hindi ginagawang artipisyal ang literal na ‘nagsalita ... na sinasabi.’
- source_word: הָקֵל
  choice: Pagaanin mo
  rationale: Tuwirang pautos na humihiling na bawasan ang bigat ng ipinataw na pasanin.
- source_word: מִן הָעֹל
  choice: ang pamatok
  rationale: Pinananatili ang kongkretong larawan at metapora ng עֹל sa halip na palitan lamang ng ‘pasanin.’
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: na ipinataw sa amin ng iyong ama
  rationale: Natural na Tagalog para sa נתן על at malinaw na pinananatili ang larawan ng isang pamatok na ipinataw.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayang ito” bilang kolektibong tawag sa mga tao at “pamatok” upang mapanatili ang metapora ng tekstong Hebreo.
