  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: tl
  text: Nang makita ng buong Israel na hindi sila pinakinggan ng hari, sumagot ang bayan sa hari, “Ano ang bahagi namin kay David? Wala kaming mana sa anak ni Jesse. Sa inyong mga tolda, Israel![a] Ngayon, asikasuhin mo ang sarili mong sambahayan, David!”[b] Kaya nagtungo ang Israel sa kani-kanilang tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Umuwi na kayo, Israel!” Literal na “Sa inyong mga tolda,” isang idyoma ng paghihiwa-hiwalay at pagtalikod sa katapatan sa hari.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” ay maaari ring tumukoy sa angkan o dinastiya ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: Nang makita ng buong Israel
  rationale: Pinananatili ang kolektibong katawagang ‘buong Israel’ at ang karaniwang kahulugan ng ראה, na sa konteksto ay may diwang napagtanto nila ang pagtanggi ng hari.
- source_word: לֹא שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: hindi sila pinakinggan ng hari
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o dinggin ang pakiusap, hindi lamang makarinig ng tunog.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: sumagot ang bayan sa hari
  rationale: Natural na Tagalog para sa Hebreong idyoma na literal na ‘nagbalik ng salita.’
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Ano ang bahagi namin kay David?
  rationale: Ang ‘bahagi’ ay nagpapanatili sa larawan ng paglalaan at sa pampolitikang pagtatakwil sa paghahari ni David.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Wala kaming mana sa anak ni Jesse
  rationale: Ang ‘mana’ ay tumpak sa נַחֲלָה at pinananatili ang kaugnayan nito sa naunang ‘bahagi.’ Ang ‘anak ni Jesse’ ay nagpapanatili sa mapanlibak na pagtukoy kay David ayon sa kanyang ama sa halip na sa titulong hari.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: Sa inyong mga tolda, Israel!
  rationale: Pinananatili ang literal at makasaysayang idyoma ng panawagang magkanya-kanya at kumalas sa katapatan sa hari; nililinaw sa talababa ang kahulugang ‘umuwi.’
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Ngayon, asikasuhin mo ang sarili mong sambahayan, David!
  rationale: Ipinahahayag ng ‘asikasuhin’ ang kontekstuwal na diwa ng ראה na ‘tingnan o pangalagaan.’ Ang ‘sambahayan’ ay nakapagpapanatili ng saklaw ng בַּיִת mula pamilya hanggang angkan, nang hindi lubusang nilulutas ang pahiwatig na dinastiya.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: Kaya umuwi ang Israel sa kani-kanilang tolda
  rationale: Ang ‘umuwi’ ay natural na naglalahad ng kilos ng pag-alis, samantalang ang ‘sa kani-kanilang tolda’ ay nagpapanatili sa inuulit na salitang Hebreo at sa kolektibong Israel na binubuo ng maraming tao.
theological_decisions:
- issue: Pampolitikang sigaw laban sa sambahayan ni David
  choice: Isinalin bilang tuwirang pagtatakwil sa pamumuno ng sambahayan ni David nang hindi ito tahasang hinatulang laban sa tipan o Mesiyas.
  alternative: Palalimin ito bilang tahasang anti-mesiyanikong pahayag, o pahinain bilang karaniwang alitang pampamilya.
  rationale: Inilalarawan ng talata ang makasaysayang paghihimagsik laban kay Rehoboam at sa monarkiyang Davidiko. Dapat mapanatili ang bigat ng pagtatakwil at ang teolohikal na tensiyon nang walang idinadagdag na paghatol na hindi tahasang sinasabi ng teksto.
- issue: Kahulugan ng בֵיתְךָ
  choice: sambahayan, na may talababa tungkol sa posibleng kahulugang dinastiya
  alternative: dinastiya lamang, o literal na bahay lamang
  rationale: Maaaring tumukoy ang בַּיִת sa bahay, sambahayan, angkan, o dinastiya. Ang ‘sambahayan’ at talababa ay nagpapanatili sa sadyang magkakapatong na mga kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Israel’ bilang kolektibong katawagan, ‘tolda’ upang mapanatili ang makasaysayang idyoma, at ‘sambahayan’ upang huwag alisin ang ambiguwidad sa pagitan ng pamilya, angkan, at dinastiya. Ang bawat talababa ay may katugmang pananda sa pangunahing teksto.
