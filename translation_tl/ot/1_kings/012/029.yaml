  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: tl
  text: Inilagay niya ang isa[a] sa Bethel, at ang isa naman ay inilagay niya sa Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibig sabihin, isa sa dalawang guya na binanggit sa naunang talata. Maaari ring isalin: “Inilagay niya ang isang guya sa Bethel, at ang isa naman ay inilagay niya sa Dan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Inilagay niya
  rationale: Ang pandiwang שׂים ay nangangahulugang maglagay o magtakda. Ang “inilagay niya” ay tuwiran, natural, at angkop sa salaysay.
- source_word: אֶת הָאֶחָד
  choice: ang isa
  rationale: Sa tambalang paghahambing, tumutukoy ito sa isa sa dalawang bagay na nabanggit sa naunang talata, nang hindi inuulit ang pangngalan.
- source_word: בְּבֵית אֵל
  choice: sa Bethel
  rationale: Pangalan ng lugar ang בֵּית אֵל; natural na ipinahahayag ng “sa” ang lokatibong בְּ sa Filipino.
- source_word: וְאֶת הָאֶחָד
  choice: at ang isa naman
  rationale: Bagaman kapareho ng literal na anyo ng unang parirala, malinaw at natural sa Filipino ang “isa naman” para sa ikalawa sa isang pares.
- source_word: נָתַן
  choice: inilagay niya
  rationale: Malawak ang kahulugan ng נתן, ngunit sa lokatibong kontekstong ito ay “inilagay” ang angkop. Pinananatili rin nito ang malinaw na paralelismo ng dalawang sugnay.
- source_word: בְּדָן
  choice: sa Dan
  rationale: Pangalan ng lugar ang Dan, at natural na katumbas ng lokatibong בְּ ang “sa.”
theological_decisions:
- issue: Tinutukoy ng “ang isa” at “ang isa naman”
  choice: Hindi inuulit sa pangunahing teksto ang “guya”; pinananatili ang pahiwatig na tumutukoy pabalik sa dalawang guya sa naunang talata.
  alternative: Inilagay niya ang isang guya sa Bethel, at ang isa naman ay inilagay niya sa Dan.
  rationale: Malinaw sa konteksto ang tinutukoy, ngunit hindi inuulit ng Hebreo ang pangngalan. Pinananatili ng salin ang elipsis at nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang isa … ang isa naman” bilang natural na pares, habang pinananatili ang hindi pagbanggit sa pangngalang “guya” sa tekstong Hebreo.
