base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: tl
  text: Ginawang mahirap ng iyong ama ang aming pamatok[a]. Kaya ngayon, pagaanin mo ang mahirap na paglilingkod na ipinataw ng iyong ama at ang mabigat niyang pamatok na inilagay niya sa amin[b], at maglilingkod kami sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ginawang mabigat ang aming pamatok.” Ang “pamatok” ay larawan ng mabibigat at mapaniil na pananagutan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mahirap na paglilingkod” ay maaari ring isaling “mahirap na paggawa” o “malupit na paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: Pinabigat ... ang aming pamatok
  rationale: Ang Hiphil ng קשׁה ay causative, ‘ginawang mabigat/mahirap.’ Pinananatili ng ‘pamatok’ ang kongkretong larawan ng mapaniil na mga pananagutan, habang natural sa Tagalog ang ‘pinabigat.’
- source_word: עֻלֵּנוּ
  choice: aming pamatok
  rationale: Pinananatili ang metapora ng pamatok sa halip na gawing pangkalahatang ‘pasanin,’ at tumutugma ito sa ikalawang pagbanggit sa pamatok.
- source_word: הָקֵל
  choice: pagaanin mo
  rationale: Tuwirang pautos na kabaligtaran ng ‘mabigat’; malinaw at likas sa modernong Tagalog.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: ang mabigat na paglilingkod na ipinataw ng iyong ama
  rationale: Ang עֲבֹדָה ay maaaring tumukoy sa paggawa o paglilingkod na hinihingi ng pamahalaan. Ipinahihiwatig ng ‘ipinataw’ ang konteksto ng sapilitang pananagutan nang hindi nililimitahan ito sa isang tiyak na uri ng paggawa.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: at ang mabigat niyang pamatok
  rationale: Pinananatili ang pagmamay-ari at ang tahasang pang-uri na ‘mabigat,’ pati ang paralelismo sa naunang paglilingkod.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: na inilagay niya sa amin
  rationale: Malapit sa idyomang Hebreo na ‘ibinigay/inilagay sa ibabaw namin’ at angkop sa larawan ng pamatok.
- source_word: וְנַעַבְדֶךָּ
  choice: at maglilingkod kami sa iyo
  rationale: Ipinapahayag ang pangako o bunga ng pagtugon ng hari sa kanilang kahilingan, nang hindi dinaragdagan ang teksto ng tahasang kondisyunal.
- source_word: עַתָּה
  choice: Kaya ngayon
  rationale: Likas na inililipat ang pahayag mula sa reklamo tungo sa kahilingan at kinakatawan ang puwersang pandiskurso ng Hebreo.
