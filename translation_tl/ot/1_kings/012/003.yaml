base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: tl
  text: Kaya nagsugo sila at ipinatawag nila siya[a]. Dumating si Jeroboam at ang buong kapulungan ng Israel, at nagsalita sila kay Rehoboam:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinasundo siya.” Ipinahihiwatig ng pariralang Hebreo na nagsugo sila ng tao upang tawagin si Jeroboam na pumunta.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “na sinasabi,” isang karaniwang panandang nagpapakilala sa tuwirang pananalita na sumusunod.
    reason: discourse_structure
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: nagsugo sila at ipinatawag siya
  rationale: Pinananatili ang dalawang magkasunod na kilos sa Hebreo. Likas sa modernong Tagalog ang “ipinatawag” para sa קרא + ל sa kontekstong ito, samantalang hindi tinutukoy kung sino ang isinugo, gaya rin sa pinagmulan.
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Bagaman karaniwang “pumarito” o “dumating” ang בוא, mas natural dito ang “dumating” dahil walang tahasang tinutukoy na pananaw o lokasyon sa talata.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga Bibliyang Tagalog.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: kasama ang buong kapulungan ng Israel
  rationale: Ang קהל ay tumutukoy sa nagkakatipong sambayanan o kinatawang pangkat. Ang “kapulungan” ay marangal at angkop sa pampublikong-pampolitikang konteksto, at iniiwasan ang maaaring mas makitid na eklesiastikong dating ng “kongregasyon.”
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם
  choice: nagsalita sila kay Rehoboam
  rationale: Tuwirang ipinapakita ang maramihang simuno ng pandiwa at pinananatili ang paghahanda para sa pahayag sa susunod na talata.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa natural na Tagalog, sapat at malinaw ang tutuldok upang ipakilala ang tuwirang pananalita sa kasunod na talata; ang literal na “na sinasabi” ay mabigat at di-likas dito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay, ngunit pinanatili ang ayos ng mga pangyayari. Ang pangalang Rehoboam ay nasa nakaugaliang anyong Tagalog-Biblikal.
