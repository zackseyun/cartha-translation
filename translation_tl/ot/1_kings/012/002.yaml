base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: tl
  text: Nang mabalitaan iyon ni Jeroboam na anak ni Nebat—habang nasa Ehipto pa siya[a], na pinuntahan niya nang tumakas siya mula kay Haring Solomon—nanatili si Jeroboam sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nang marinig ni Jeroboam” lamang; ipinahihiwatig ng konteksto kung ano ang narinig niya, malamang ang balitang kababanggit sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang mabalitaan
  rationale: Ang וַיְהִי ay nag-uugnay sa daloy ng salaysay at hindi kailangang tumbasan ng hiwalay na salitang temporal; ang כִּשְׁמֹעַ ay likas na naipapahayag sa Tagalog bilang temporal na sugnay na “Nang mabalitaan.”
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: ni Jeroboam na anak ni Nebat
  rationale: Pinananatili ang mga pangalan at malinaw na ipinahahayag ang ugnayang ama-anak sa karaniwang modernong Tagalog.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: habang nasa Ehipto pa siya
  rationale: Ipinakikita ng pangyayaring sugnay na nasa Ehipto pa si Jeroboam nang makarinig siya.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: kung saan siya tumakas mula kay Haring Solomon
  rationale: Natural nitong ipinahahayag na Ehipto ang lugar na tinakasan niya at na lumayo siya sa harapan o kapangyarihan ni Solomon.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: nanatili si Jeroboam sa Ehipto
  rationale: Ang ישב ay maaaring mangahulugang manirahan o manatili; sa konteksto, ang “nanatili” ay maikli at malinaw na nagsasaad ng patuloy niyang paninirahan doon.
- source_word: שְׁמֹעַ
  choice: mabalitaan iyon
  rationale: Walang tahasang layon ang pandiwa sa Hebreo. Ang “iyon” ay tumutukoy nang hindi labis na nagtatakda sa balitang ipinahihiwatig ng konteksto.
