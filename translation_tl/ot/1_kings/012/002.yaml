translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mabalitaan” para sa natural na diwa ng pagkarinig ng balita, at pinanatili sa talababa ang hindi tahasang layon ng pandiwang Hebreo.
