base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: tl
  text: 'Kaya noong ikatlong araw, pumunta sina Jeroboam at ang buong bayan kay Rehoboam, gaya ng sinabi ng hari: “Bumalik kayo sa akin[a] sa ikatlong araw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Muli kayong pumunta sa akin sa ikatlong araw.”
    reason: Pinananatili ang maaaring kahulugan ng שׁוב sa kontekstong ang mga tao ay muling haharap sa hari, nang hindi inaalis ang pangunahing diwa nitong ‘bumalik.’
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: pumunta
  rationale: Ang בוא ay maaaring mangahulugang ‘pumunta’ o ‘dumating’ ayon sa pananaw. Ang ‘pumunta ... kay Rehoboam’ ay natural sa makabagong Tagalog at malinaw na nagpapahayag ng pagkilos patungo sa hari.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Karaniwang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: וְכָל הָעָם
  choice: at ang buong bayan
  rationale: Ang עָם ay tumutukoy sa kabuuan ng mga taong nakikipag-usap sa hari; ang ‘buong bayan’ ay natural at marangal sa kontekstong pampolitika.
- source_word: אֶל־רְחַבְעָם
  choice: kay Rehoboam
  rationale: Ang אֶל ay nagpapahayag ng direksiyon patungo sa isang tao; ‘kay Rehoboam’ ang tuwirang katumbas sa Tagalog.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: noong ikatlong araw / sa ikatlong araw
  rationale: Pinananatili nito ang karaniwang Hebreong pahayag sa panahon. Ginamit ang ‘noong’ sa salaysay at ‘sa’ sa tuwirang utos upang maging likas sa Tagalog.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Malinaw nitong ipinakikita na ang ginawa ng bayan ay alinsunod sa naunang sinabi ng hari.
- source_word: דִּבֶּר הַמֶּלֶךְ לֵאמֹר
  choice: sinabi ng hari
  rationale: Likas na isinasama sa Tagalog ang quotative na לֵאמֹר sa pandiwang nagpapakilala sa tuwirang sinabi.
- source_word: שׁוּבוּ אֵלַי
  choice: Bumalik kayo sa akin
  rationale: Tuwirang pinananatili ng ‘bumalik’ ang pangunahing diwa ng שׁוב na pagbabalik sa taong nagsasalita.
