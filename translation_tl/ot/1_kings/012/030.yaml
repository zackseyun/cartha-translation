base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: tl
  text: At naging kasalanan ang bagay na ito, at nagpunta ang mga tao sa harap ng ang isa[a] hanggang sa Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa harap ng ang isa.” Malamang na ang “ang isa” ay tumutukoy sa isa sa dalawang guyang itinayo ni Jeroboam, lalo na sa guyang nasa Dan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: naging
  rationale: 'Sa pagkakaugnay nito sa לְחַטָּאת, ipinahahayag ng pandiwa ang kinalabasan: ang bagay na iyon ay naging kasalanan, hindi lamang basta umiral.'
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malawak ang kahulugan ng דָּבָר at dito ay tumutukoy sa kaayusang panrelihiyon na itinatag ni Jeroboam; pinananatili rin ng salin ang puwersa ng pantukoy na 'ito.'
- source_word: לְחַטָּאת
  choice: kasalanan
  rationale: Sa konteksto ng ipinagbabawal na pagsamba, 'kasalanan' ang malinaw na diwa; hindi ito tumutukoy sa handog para sa kasalanan.
- source_word: וַיֵּלְכוּ הָעָם
  choice: pumunta ang mga tao
  rationale: Karaniwang pandiwa ng pagkilos sa salaysay ang הָלַךְ. Hindi idinagdag ang 'upang sumamba' sapagkat hindi iyon tahasang sinasabi sa parirala.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang literal na diwang 'sa harap ng' nang hindi agad ipinapasok sa pangunahing teksto ang pagpapakahulugang pagsamba.
- source_word: הָאֶחָד
  choice: isa
  rationale: Literal na 'ang isa' ang Hebreo at hindi inuulit ang pangngalang tinutukoy. Pinananatili sa teksto ang maikli at medyo malabong pahayag, habang nililinaw sa talababa ang malamang na tinutukoy.
- source_word: עַד דָּן
  choice: hanggang sa Dan
  rationale: Ipinahahayag ng עַד ang hangganan o dulo ng pagpunta, at likas sa Tagalog ang 'hanggang sa Dan.'
theological_decisions:
- issue: Likas ng kasalanan sa kaayusang panrelihiyon ni Jeroboam
  choice: Sinasabi ng talata na ang kaayusang ito ay naging kasalanan.
  alternative: Naging sanhi o pagkakataon ito upang magkasala.
  rationale: Pinananatili ang pangngalang חַטָּאת bilang 'kasalanan' at hindi pinalalawak ang pagkondena sa isang mas tiyak na kategoryang doktrinal na hindi tahasang binabanggit sa talata.
- issue: Tinutukoy ng 'isa'
  choice: Pinanatili sa pangunahing teksto ang malabong 'isa,' na malamang ay tumutukoy sa isa sa dalawang guyang itinayo ni Jeroboam, lalo na sa nasa Dan.
  alternative: Gawing tahasan sa pangunahing teksto ang 'isang guya' o 'isa sa mga iyon.'
  rationale: Maikli at sintaktikong mahirap ang Hebreo. Mas tapat na panatilihin ang ellipsis sa pangunahing teksto at ilagay sa talababa ang malamang na tinutukoy kaysa gawing tiyak ang hindi tahasang sinabi.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Ginamit ang 'mga tao' sa halip na mas mataas o mas makalumang 'bayan,' at pinanatili ang sadyang pagkaasiwa at kalabuan ng huling parirala sa Hebreo.
