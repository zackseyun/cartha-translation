base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: tl
  text: 'Sinabi sa kanya ng mga kabataang lalaking lumaking kasama niya, “Ganito ang sabihin mo sa mga taong ito na nagsabi sa iyo, ‘Pinabigat ng iyong ama ang aming pamatok, ngunit pagaanin mo ito para sa amin.’ Ganito ang sabihin mo sa kanila: ‘Mas makapal ang aking hinliliit kaysa sa baywang ng aking ama.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: mga kabataang lalaki
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking kaedad at kasamang lumaki ni Rehoboam, hindi sa maliliit na bata.
- source_word: עֻלֵּנוּ
  choice: aming pamatok
  rationale: Pinananatili ang kongkretong metapora ng Hebreo para sa mabigat na pasanin o pamamahala.
- source_word: קָטָנִּי
  choice: aking hinliliit
  rationale: Ang anyo ay literal na ‘aking maliit,’ ngunit sa idyomatikong paghahambing ng bahagi ng katawan ay tumutukoy sa maliit na daliri; ‘hinliliit’ ang natural na katumbas sa Filipino.
- source_word: מָתְנֵי אָבִי
  choice: baywang ng aking ama
  rationale: Direktang ipinapahayag ang paghahambing sa laki at lakas habang pinananatili ang matapang na retorika ng orihinal.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang pag-uulit ng “Ganito ang sabihin mo” at ang metapora ng pamatok upang maihatid ang mariin at mapagmataas na tono ng payo.
