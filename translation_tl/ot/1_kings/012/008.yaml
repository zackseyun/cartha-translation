  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: tl
  text: Ngunit tinalikuran niya ang payo ng mga nakatatanda na ibinigay nila sa kanya, at sumangguni siya sa mga kabataang lalaking lumaking kasama niya, na nakatayo sa harapan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na nakatayo sa harapan niya”; maaari itong tumukoy sa pagdalo o paglilingkod sa korte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: tinalikuran
  rationale: Ipinahihiwatig ng עזב ang sinasadyang pag-iwan o pagtanggi; ang “tinalikuran” ay natural at malinaw na nagpapakita na isinantabi niya ang payo.
- source_word: עֲצַת הַזְּקֵנִים אֲשֶׁר יְעָצֻהוּ
  choice: ang payo ng matatandang tagapayo sa kanya
  rationale: Ang עֵצָה ay payo sa kontekstong ito. Ang “matatandang tagapayo” ay nagpapahayag kapwa ng kanilang katandaan at ng papel nila sa hari, habang ang “sa kanya” ay natural na kumakatawan sa kaugnayang ipinahahayag ng יְעָצֻהוּ.
- source_word: וַיִּוָּעַץ
  choice: sumangguni siya
  rationale: Ang Niphal ng יעץ dito ay nangangahulugang kumonsulta o humingi ng payo; ang “sumangguni” ay dignificado at likas sa makabagong Filipino.
- source_word: הַיְלָדִים
  choice: mga kabataang lalaki
  rationale: Sa konteksto, hindi maliliit na bata kundi mga nakababatang kapanahon ng hari ang tinutukoy; pinananatili ng parirala ang paghahambing sa matatanda.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: lumaking kasama niya
  rationale: Tuwirang ipinahahayag nito ang magkasamang paglaki o pagpapalaki nang hindi nagdaragdag ng detalye.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: naglilingkod sa kanyang harapan
  rationale: Ang idyomang “tumayo sa harapan” ay maaaring tumukoy sa paglilingkod o pagdalo sa korte. Pinananatili rito ang larawang “sa kanyang harapan” habang nililinaw ang tungkuling ipinahihiwatig.
