translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang tagapayo” upang maiwasang ipakahulugan na edad lamang ang mahalaga, at ang talababa ay nagpapanatili sa literal na anyo at posibleng saklaw ng idyomang pangkorte.
