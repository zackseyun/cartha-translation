  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: tl
  text: Nang mabalitaan ng buong Israel na nakabalik na si Jeroboam, nagsugo sila at ipinatawag siya sa kapulungan. Ginawa nila siyang hari sa buong Israel. Walang sumunod sa sambahayan ni David[a] maliban sa lipi ni Juda lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Walang nanatili sa panig ng sambahayan ni David.” Literal na sinasabi ng idyomang Hebreo na walang “nasa likod” ng sambahayan ni David; ipinahihiwatig nito ang pagsunod, pagkampi, o katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang mabalitaan
  rationale: Likas na panimulang temporal sa modernong Tagalog; pinananatili ang diwang ‘nang marinig’ nang hindi mekanikal na isinasalin ang pormulang pasalaysay.
- source_word: כָּל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Pinananatili ang kolektibong katawagan sa bayan sa halip na gawing tahasang ‘lahat ng Israelita.’
- source_word: כִּי שָׁב יָרָבְעָם
  choice: na nakabalik na si Jeroboam
  rationale: Ang שׁוּב ay tumutukoy sa pagbabalik; ipinahihiwatig ng ‘nakabalik na’ na nauna ito sa sumunod na mga kilos.
- source_word: וַיִּשְׁלְחוּ
  choice: nagsugo sila
  rationale: Hindi tinutukoy ng Hebreo kung sino o ano ang isinugo, kaya hindi dinagdagan ng ‘mga sugo’ o ‘mensahe.’
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: at ipinatawag siya sa kapulungan
  rationale: Ang ‘ipinatawag’ ay malinaw na naghahatid ng diwa ng pagpapapunta; ang ‘kapulungan’ ay angkop sa pampolitikang pagtitipon at hindi labis na panrelihiyon.
- source_word: וַיַּמְלִיכוּ אֹתוֹ עַל כָּל יִשְׂרָאֵל
  choice: Ginawa nila siyang hari sa buong Israel
  rationale: Tuwirang inilalarawan ang causative na diwa ng מלך nang hindi nagdaragdag ng koronasyon o seremonyang hindi binanggit.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: Walang sumunod sa sambahayan ni David
  rationale: Pinananatili ang idyomang ‘nasa likod/sumunod sa’ na nagpapahayag ng pagkampi o katapatan, habang inilalahad sa talababa ang mas interpretibong alternatibo.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: maliban sa lipi ni Juda lamang
  rationale: Kapuwa naipapahayag ng ‘maliban’ at ‘lamang’ ang mariing pagtatangi sa Hebreo.
theological_decisions:
- issue: Pormula ng pampolitikang katapatan matapos mahati ang kaharian
  choice: Walang sumunod sa sambahayan ni David
  alternative: Walang nanatili sa panig ng sambahayan ni David
  rationale: Pinananatili ng pangunahing salin ang larawan ng Hebreong אַחֲרֵי at ang bahagyang kalabuan nito, samantalang nililinaw sa talababa ang posibleng diwa ng pampolitikang pagkampi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘kapulungan,’ ‘sambahayan,’ at ‘lipi’ bilang malinaw at angkop na mga salitang pangkasaysayan; iniwasan ang labis na panrelihiyong himig at ang pagdaragdag ng seremonyang wala sa teksto.
