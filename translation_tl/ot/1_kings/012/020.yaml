  source_fidelity: 'Tumpak na naihahatid ng salin ang pagkakasunod ng mga pangyayari at ang saklaw ng Hebreo: nalaman ng buong Israel ang pagbabalik ni Jeroboam, nagsugo sila, ipinatawag siya sa kapulungan, at ginawa siyang hari sa buong Israel. Ang “Walang sumunod sa sambahayan ni David” ay isang likas at sapat na pagpapahayag ng idyomang אַחֲרֵי para sa pampolitikang katapatan.'
