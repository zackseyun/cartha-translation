base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: tl
  text: Pagkatapos, itinayo ni Jeroboam ang Shekem sa kaburulan ng Efraim at nanirahan siya roon. Mula roon ay umalis siya at itinayo ang Penuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Penuel ay tinatawag ding Peniel sa ilang kaugnay na talata sa Biblia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: itinayo
  rationale: Karaniwang nangangahulugang “magtayo” ang בנה. Sa konteksto ng isang lungsod, maaari itong tumukoy sa muling pagtatayo o pagpapatibay, ngunit hindi iyon tahasang sinasabi ng Hebreo kaya pinanatili ang payak na “itinayo.”
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Pangalan ng lugar; isinalin sa baybay na likas basahin sa modernong Filipino habang pinananatili ang tunog ng Hebreo.
- source_word: בְּהַר אֶפְרַיִם
  choice: sa kaburulan ng Efraim
  rationale: Ang הַר dito ay maaaring tumukoy sa bulubundukin o mataas na rehiyon, hindi lamang sa isang bundok. Ang “kaburulan ng Efraim” ay natural at heograpikong angkop.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: at nanirahan siya roon
  rationale: Ang ישב ay maaaring mangahulugang manirahan o tumira. Ang hulaping pambabae ay tumutukoy sa lungsod, na natural na ipinahayag sa Filipino bilang “roon.”
- source_word: וַיֵּצֵא מִשָּׁם
  choice: Mula roon ay umalis siya
  rationale: Ipinapahayag ng יצא ang paglabas o pag-alis mula sa isang lugar. Natural sa Filipino ang “umalis,” habang malinaw na pinananatili ng “mula roon” ang pinagmulan ng kilos.
- source_word: פְּנוּאֵל
  choice: Penuel
  rationale: Pangalan ng lugar; pinanatili ang anyong katumbas ng baybay-katinig sa talatang ito. Itinala sa talababa ang kaugnay na anyong “Peniel.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na kahulugan ng pandiwang “itinayo” nang hindi ipinapalagay kung ito ay muling pagtatayo o pagpapatibay. Inilagay ang talababa pagkatapos ng “Penuel,” ang salitang tinutukoy nito.
