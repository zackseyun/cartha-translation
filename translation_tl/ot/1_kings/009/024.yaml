  to: Ngunit umakyat ang anak na babae ng Faraon mula sa Lungsod ni David patungo sa bahay na itinayo ni Solomon para sa kanya. Pagkatapos, itinayo ni Solomon ang Milo.[a]
  rationale: Pinalitan ang “ipinatayo” ng “itinayo” upang mapanatili ang payak na aspekto ng pandiwang Hebreo at maiwasan ang di-tahasang causative na kahulugan. Pinanatili ang malinaw na pagtukoy kay Solomon, na siyang ipinahihiwatig ng konteksto, at ang talababa para sa pinagtatalunang terminong Milo.
