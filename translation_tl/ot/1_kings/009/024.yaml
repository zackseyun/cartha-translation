  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: tl
  text: Ngunit umakyat ang anak na babae ng Faraon mula sa Lungsod ni David patungo sa bahay na itinayo ni Solomon para sa kanya. Pagkatapos, itinayo ni Solomon ang Milo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “ang mga terasa” o “ang tambak.” Malamang na ang salitang Hebreo na Milo ay tumutukoy sa isang tanggulan o sa isang istrukturang terasa o tambak na sumusuporta sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahihiwatig dito ng kataga ang paglipat o bahagyang pagsalungat sa naunang salaysay; natural at marangal ang “Ngunit” sa Filipino.
- source_word: בַּת פַּרְעֹה
  choice: ang anak na babae ng Faraon
  rationale: Tuwirang inilalarawan ng construct chain ang babae ayon sa kaugnayan niya sa Faraon.
- source_word: עָלְתָה
  choice: umakyat
  rationale: Pinananatili ang karaniwang kahulugan ng עלה at ang posibleng topograpikong pag-akyat.
- source_word: מֵעִיר דָּוִד
  choice: mula sa Lungsod ni David
  rationale: Pinananatili ang pantanging pangalan ng lugar at natural na isinasalin ang pang-ukol bilang “mula sa.”
- source_word: אֶל בֵּיתָהּ
  choice: patungo sa bahay
  rationale: Ang בַּיִת ay maaaring bahay o palasyo, ngunit “bahay” ang hindi gaanong interpretatibo at malinaw pa rin sa kontekstong maharlika.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: na ipinatayo ni Solomon para sa kanya
  rationale: Nililinaw ng konteksto na si Solomon ang di-binanggit na simuno. Ang “ipinatayo” ay natural sa Filipino para sa isang haring nagpagawa ng gusali, nang hindi ipinapalagay na siya mismo ang gumawa nito.
- source_word: אָז
  choice: Pagkatapos
  rationale: Ipinakikita ang pagkakasunod-sunod ng mga pangyayari sa natural na salaysay sa Filipino.
- source_word: בָּנָה
  choice: itinayo ni Solomon
  rationale: Pinananatili ang payak na pahayag ng natapos na pagkilos at nililinaw ang di-binanggit na simuno mula sa konteksto.
- source_word: הַמִּלּוֹא
  choice: ang Milo
  rationale: Teknikal at topograpikong katawagan ito na hindi tiyak ang eksaktong anyo; mas ligtas ang transliterasyon kaysa pumili ng isang pinagtatalunang rekonstruksiyon.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “Faraon” at “Lungsod ni David” bilang pamilyar na katawagang biblikal. Inulit ang pangalang “Solomon” upang maiwasan ang malabong reperensiya ng panghalip sa Filipino; ang pagkakakilanlan ng simuno ay mula sa konteksto.
