base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: tl
  text: Ang lahat ng taong nalabi mula sa mga Amoreo, mga Heteo, mga Perezeo, mga Hiveo, at mga Jebuseo, na hindi mula sa mga anak ni Israel[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “na hindi mula sa mga Israelita.” Sa Hebreo: “na hindi mula sa mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: Ang lahat ng tao
  rationale: Ipinapahayag ng כָּל ang kabuuan ng kolektibong tinutukoy ng הָעָם; natural sa modernong Tagalog ang “ang lahat ng tao.”
- source_word: הַנּוֹתָר
  choice: na nalabi
  rationale: Ang Niphal participle ng יתר ay tumutukoy sa mga naiwan o natira; pinili ang “nalabi” bilang maikli, dignificado, at angkop sa konteksto.
- source_word: מִן
  choice: mula sa
  rationale: Ipinakikita rito ng מִן ang pangkat o pinagmulang kinabibilangan ng mga nalabi.
- source_word: הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: mga Amoreo, mga Heteo, mga Perezeo, mga Hiveo, at mga Jebuseo
  rationale: Ginamit ang mga kinagawiang anyong Tagalog ng mga pangalang-bayan; ang mga pangngalang isahan sa Hebreo ay kolektibo rito kaya nilagyan ng “mga.”
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: na hindi kabilang sa mga anak ni Israel
  rationale: Natural na ipinahahayag ng “kabilang sa” ang ugnayang tinutukoy ng מִן, samantalang pinananatili ng “mga anak ni Israel” ang tahasang anyo ng בְּנֵי יִשְׂרָאֵל. Hindi na hiwalay na isinalin ang emphatic pronoun na הֵמָּה sapagkat malinaw na ang paksa sa Tagalog.
theological_decisions:
- issue: Ang pananalitang pangtipan na בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal at tradisyonal na ugnayang “mga anak ni Israel,” ngunit kinikilala sa talababa ang mas idyomatikong “mga Israelita.” Hindi nito nililimitahan ang tinutukoy sa mga lalaking anak lamang; pangalan ito ng sambayanan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang em dash dahil nagpapatuloy ang pangungusap sa susunod na talata. Inulit ang “mga” sa bawat pangalang-bayan upang malinaw at natural ang talaan.
