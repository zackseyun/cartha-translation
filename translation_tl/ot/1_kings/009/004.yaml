base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: tl
  text: At tungkol sa iyo[a], kung mamumuhay ka sa harapan ko gaya ni David na iyong ama, na may pusong tapat at namumuhay nang matuwid, sa pagsunod sa lahat ng iniutos ko sa iyo, at kung susundin mo ang aking mga tuntunin at mga hatol[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “At ikaw naman.”
    reason: discourse_alternative
  - marker: b
    text: Maaari ring isalin na “aking mga tuntunin at mga ordinansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: At tungkol sa iyo
  rationale: Ipinakikita ang paglipat sa tuwirang pakikipag-usap at ang banayad na pagdidiin sa kausap.
- source_word: תֵּלֵךְ לְפָנַי
  choice: mamumuhay ka sa harapan ko
  rationale: Ang literal na paglakad ay isang idyoma para sa asal o paraan ng pamumuhay; pinananatili ng salin ang diwa ng pamumuhay sa harapan ng Diyos.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: gaya ng pamumuhay ni David na iyong ama
  rationale: Pinananatili ang paghahambing kay David, habang natural na ipinahahayag sa modernong Tagalog ang idyomatikong gamit ng 'lumakad.'
- source_word: בְּתָם לֵבָב
  choice: nang may pusong buo
  rationale: Ang תָּם ay tumutukoy sa kabuuan, katapatan, o integridad, hindi kinakailangang ganap na kawalang-kasalanan.
- source_word: וּבְיֹשֶׁר
  choice: at matuwid
  rationale: Ipinahahayag ang moral na katuwiran at pinananatili ang pagkakaiba nito sa kabuuan ng puso.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: ginagawa ang lahat ng iniutos ko sa iyo
  rationale: Natural sa Tagalog at pinananatili ang komprehensibong puwersa ng כְּכֹל.
- source_word: חֻקַּי
  choice: aking mga tuntunin
  rationale: Malinaw at angkop na terminong legal at tipanan para sa mga itinakdang kautusan.
- source_word: וּמִשְׁפָּטַי
  choice: at mga hatol
  rationale: Pinananatili ang legal at hudisyal na kulay ng מִשְׁפָּט at ang pagkakaiba nito sa חֹק.
- source_word: תִּשְׁמֹר
  choice: tutuparin mo
  rationale: Sa konteksto ng tipan, nangangahulugan itong masusing sundin o isagawa, hindi lamang bantayan.
theological_decisions:
- issue: Paglalarawan kay David bilang halimbawa
  choice: pusong buo at matuwid
  alternative: pusong walang kapintasan
  rationale: Itinatanghal si David bilang halimbawa ng buo at tapat na debosyon sa tipan, ngunit hindi ipinahihiwatig na lubos siyang walang kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mamumuhay” para luminaw ang Hebreong idyoma ng paglakad bilang paraan ng pamumuhay; pinanatili ang pormal na legal na kulay ng “mga tuntunin” at “mga hatol.”
