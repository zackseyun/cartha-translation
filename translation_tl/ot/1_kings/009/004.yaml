revisions:
- from: At tungkol sa iyo[a], kung mamumuhay ka sa harapan ko gaya ng pamumuhay ni David na iyong ama, nang may pusong buo at matuwid, ginagawa ang lahat ng iniutos ko sa iyo, at kung tutuparin mo ang aking mga tuntunin at mga hatol[b],
  to: At tungkol sa iyo[a], kung mamumuhay ka sa harapan ko gaya ni David na iyong ama, na may pusong tapat at namumuhay nang matuwid, sa pagsunod sa lahat ng iniutos ko sa iyo, at kung susundin mo ang aking mga tuntunin at mga hatol[b],
