  source_fidelity: 'Ang pangunahing salin ay tapat sa diwa ng Hebreo: naipahahayag ang mariing pagtalikod mula sa pagsunod sa Diyos, ang hindi pagtupad sa mga utos at tuntunin, at ang magkaibang kilos ng paglilingkod at pagyukod sa ibang mga diyos. Gayunman, ang talababa ay hindi tumpak na nagbibigay ng alternatibong pagbasa: ang tuwirang alternatibo ay “ikaw at ang iyong mga anak na lalaki,” hindi “kayong lahat at ang inyong mga anak na lalaki.”'
  naturalness: Makabago at marangal ang rehistro. Ang “mga anak mong lalaki” ay mas likas kaysa “ang iyong mga anak na lalaki,” at ang pag-aalis ng “hahayo upang” ay mas tuwiran at hindi nagdaragdag ng ideya ng paglalakbay na maaaring hindi kailangan sa Filipino.
  terminology: Ang “utos” at “tuntunin” ay maayos na magkahiwalay na katumbas ng mga terminong tipanan. Ang “maglingkod” at “yuyukod” ay wastong pinananatiling magkaiba.
