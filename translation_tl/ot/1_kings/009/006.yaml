  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: tl
  text: Ngunit kung ikaw o ang mga anak mong lalaki ay talagang tatalikod sa pagsunod sa akin[a], at hindi tutupad sa aking mga utos at mga tuntuning inilagay ko sa harap ninyo, at maglilingkod sa ibang mga diyos at yuyukod sa kanila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ikaw at ang mga anak mong lalaki.” Maaaring unawain ang Hebreo bilang sabay na pagtukoy kay Solomon at sa kaniyang mga inapo; inilalabas ng pangunahing salin ang kondisyong maaaring tumukoy kay Solomon o sa kaniyang linyang maharlika.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: kung
  rationale: Tuwirang ipinakikita ang kondisyong nagbubukas sa babala; ang “Ngunit” ay naghahatid ng pagsalungat sa naunang pangako ayon sa daloy ng konteksto.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: talagang tatalikod
  rationale: Ang infinitive absolute na kasunod ng pandiwang may kaparehong ugat ay nagbibigay-diin. Sa pariralang “sa pagsunod sa akin,” ang tinutukoy ay pagtalikod sa Diyos, hindi pagsisisi o pagbabalik-loob.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: ikaw o ang iyong mga anak na lalaki
  rationale: Sa konteksto, ang babala ay para kay Solomon at sa kaniyang linyang maharlika. Pinananatili ng “mga anak na lalaki” ang tiyak na dynastikong diwa ng בנים, habang inilalabas ng “o” ang kondisyong maaaring matupad kay Solomon o sa kaniyang mga kahalili; ang mas literal na anyo ay inilagay sa talababa.
- source_word: מֵאַחֲרַי
  choice: sa pagsunod sa akin
  rationale: Likas na salin ng Hebreong idyoma na tumutukoy sa patuloy na katapatan at pagsunod sa PANGINOON.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: at hindi tutupad
  rationale: Sa kaugnayan ng mga utos, ang שׁמר ay nangangahulugang ingatan sa diwang sundin o tuparin; “tutupad” ang malinaw at likas na Filipino.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: aking mga utos at mga tuntunin
  rationale: Pinananatiling magkahiwalay ang dalawang legal at tipanang katawagan. Ang “utos” ay para sa מִצְוָה at ang “tuntunin” ay dignified at madaling maunawaang katumbas ng חֹק.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: inilagay ko sa harap ninyo
  rationale: Ipinananatili ang konkretong Hebreong idyoma ng paglalagay o paghaharap ng mga obligasyon sa kanila.
- source_word: וַהֲלַכְתֶּם
  choice: at hahayo upang
  rationale: Ipinahahayag ang pagkilos patungo sa kasunod na gawa ng apostasya nang natural sa Filipino, hindi bilang literal na simpleng paglalakad.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: maglingkod sa ibang mga diyos
  rationale: Pinananatili ang pangunahing diwa ng עבד na “maglingkod” at hindi ito isinasanib sa kasunod na kilos ng pagyukod.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: at yuyukod sa kanila
  rationale: Pinananatili ang konkretong larawan ng pagpapatirapa o pagyukod bilang pagpapasakop at pagsamba.
theological_decisions:
- issue: Saklaw ng babala sa dinastiya
  choice: Ang babala ay tumutukoy kay Solomon o sa kaniyang mga anak na lalaking hahalili sa kaniya.
  alternative: Basahing “kayo at ang inyong mga anak na lalaki,” na mas tuwirang sumusunod sa anyong maramihan ng Hebreo.
  rationale: Ang kausap sa konteksto ay si Solomon, at ang usapin ay ang bahay ni David at ang mga kahaliling hari. Pinananatili ang tunay na posibilidad ng alternatibong pagbasa sa talababa sa halip na itago ito.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa publikong pagbasa. Ginamit ang “talagang tatalikod” upang maipahayag ang diin ng Hebreo, at pinanatiling magkaiba ang “maglingkod” at “yumukod.”
