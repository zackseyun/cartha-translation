  text: וְ/אֶֽת בַּעֲלָ֛ת וְ/אֶת תמר בַּ/מִּדְבָּ֖ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/018.yaml
  text: and Baalath[a], and Tamar in the wilderness, in the land.
translation:
  language: tl
  text: ang Baalat at ang Tamar[a] sa ilang, sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Tamar”; “Tadmor” ang mababasa sa katumbas na talata sa 2 Cronica 8:4.'
    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת
  choice: at ang
  rationale: Ang וְ ay pang-ugnay na “at,” samantalang ang אֵת ay pananda ng tiyak na tuwirang layon. Sa Tagalog, likas na naipakikita ang layon sa pariralang may “ang,” bilang pagpapatuloy ng talaan ng mga lungsod na itinayo ni Solomon.
- source_word: בַּעֲלָת
  choice: Baalat
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa paraang transliterasyon na angkop sa modernong Tagalog.
- source_word: תמר
  choice: Tamar
  rationale: Ang tekstong Hebreo ng WLC ay may תמר, kaya “Tamar” ang nasa pangunahing teksto. Ang “Tadmor” sa 2 Cronica 8:4 ay pinanatili sa talababa bilang tekstuwal na pagkakaiba.
- source_word: בַּ/מִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o disyertong lupain. Ang “sa ilang” ay maikli, natural, at marangal na karaniwang salin sa Tagalog.
- source_word: בָּ/אָֽרֶץ
  choice: sa lupain
  rationale: Ang אֶרֶץ ay may malawak na heograpikong diwa na “lupain.” Hindi tinukoy nang higit pa ang saklaw upang mapanatili ang pagiging pangkalahatan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Gumamit ng maikli, dignificado, at likas na modernong Tagalog. Pinanatili ang anyong pira-piraso ng talata bilang pagpapatuloy ng listahan mula sa naunang talata, pati ang heograpikong pariralang “sa ilang, sa lupain” nang hindi nililinaw nang lampas sa sinasabi ng Hebreo.
