base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: tl
  text: Naglaan si Hiram, na hari ng Tiro, para kay Solomon ng kahoy na sedro, kahoy na sipres[a], at ginto, ayon sa lahat ng ninanais ni Solomon. Pagkatapos, binigyan ni Haring Solomon si Hiram ng dalawampung lungsod sa lupain ng Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “enebro,” “abeto,” o ibang punong konipero; hindi tiyak kung anong uri ng puno ang tinutukoy ng salitang Hebreo na berosh.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: naglaan ... para kay
  rationale: Bagaman karaniwang nangangahulugang “magbuhat” o “magdala” ang pandiwa, sa konstruksyong ito kasama ang mga materyales ay tumutukoy ito sa paglalaan o pagtustos ni Hiram kay Solomon.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: ng kahoy na sedro
  rationale: Sa tambalang ito, ang עֵץ ay tumutukoy sa kahoy bilang materyales sa pagtatayo, hindi sa mga buhay na puno.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: kahoy na sipres
  rationale: Hindi tiyak ang eksaktong uri ng punong tinutukoy ng בְּרוֹשׁ. Karaniwang salin ang “sipres,” at inilalahad sa talababa ang kawalang-katiyakan.
- source_word: וּבַזָּהָב
  choice: at ginto
  rationale: Tuwirang katumbas ng malinaw na katawagan sa materyal.
- source_word: לְכָל חֶפְצוֹ
  choice: ayon sa lahat ng ninanais niya
  rationale: Pinananatili nito ang lawak ng חֵפֶץ—ang lahat ng nais ni Solomon—nang hindi nililimitahan sa tahasang binanggit na mga materyales.
- source_word: אָז
  choice: pagkatapos
  rationale: Likas na panandang temporal sa Filipino para sa kasunod na kilos sa salaysay.
- source_word: יִתֵּן
  choice: binigyan
  rationale: Bagaman nasa anyong imperfect ang Hebreo, ang אָז at konteksto ng salaysay ay nagpapahiwatig ng naganap na kilos.
- source_word: עֶשְׂרִים עִיר
  choice: dalawampung lungsod
  rationale: Ang עִיר ay maaaring lungsod o bayan; “lungsod” ang kinagawiang katumbas at angkop sa kontekstong pampolitika.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: sa lupain ng Galilea
  rationale: Malapit na salin ng parirala at pinananatili ang heograpikong pangalan.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Hiram ... Solomon ... Tiro ... Galilea
  rationale: Ginamit ang mga pangalang kinagawian at madaling makilala sa modernong saling Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “naglaan ... para kay” upang maging natural ang diwa ng Hebreong konstruksyon, habang pinanatili ang pagkakasunod ng dalawang kilos at ang kawalang-katiyakan tungkol sa uri ng berosh sa talababa.
