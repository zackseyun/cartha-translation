- from: Naglaan si Hiram na hari ng Tiro para kay Solomon ng kahoy na sedro, kahoy na sipres[a], at ginto, ayon sa lahat ng ninanais niya. Pagkatapos, binigyan ni Haring Solomon si Hiram ng dalawampung lungsod sa lupain ng Galilea.
  to: Naglaan si Hiram, na hari ng Tiro, para kay Solomon ng kahoy na sedro, kahoy na sipres[a], at ginto, ayon sa lahat ng ninanais ni Solomon. Pagkatapos, binigyan ni Haring Solomon si Hiram ng dalawampung lungsod sa lupain ng Galilea.
  rationale: Ginawang tahasan ang “ni Solomon” upang alisin ang ambiguwidad ng panghalip at tumugma sa hulaping panghalip sa Hebreo. Inayos din ang teknikal na katawagan sa talababa tungo sa mas likas na Filipino. Walang ibang pagbabagong pangkahulugan ang ginawa.
