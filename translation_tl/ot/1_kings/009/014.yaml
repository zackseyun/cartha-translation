    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: At nagpadala
  rationale: Ang waw-consecutive imperfect ay nagpapatuloy sa salaysay at likas na isinasalin sa payak na aspektong naganap; ang “nagpadala” ang natural na katumbas ng שלח sa kontekstong ito.
- source_word: חִירָם
  choice: Hiram
  rationale: Pinananatili ang karaniwang anyo ng pangalang Hebreo na ginagamit sa modernong saling Tagalog.
- source_word: לַמֶּלֶךְ
  choice: sa hari
  rationale: Tuwirang pinananatili nito ang tiyak ngunit hindi pinangalanang “hari” sa Hebreo; si Solomon ang tinutukoy ayon sa konteksto.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: isandaan at dalawampu
  rationale: Ito ang malinaw at natural na anyo ng bilang sa modernong Tagalog.
- source_word: כִּכַּר
  choice: talento
  rationale: Ang כִּכָּר ay isang sinaunang malaking yunit ng timbang na nakaugaliang tawaging “talento” sa mga saling biblikal; ipinaliliwanag ito sa talababa.
- source_word: זָהָב
  choice: ginto
  rationale: Ang זָהָב ay tuwirang tumutukoy sa ginto.
