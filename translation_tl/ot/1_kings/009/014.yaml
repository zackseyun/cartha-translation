  text: At nagpadala si Hiram sa hari ng isandaan at dalawampung talentong ginto[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talento ay isang malaking yunit ng timbang noong sinaunang panahon; ang parirala ay tumutukoy sa isandaan at dalawampung talentong timbang ng ginto.
    reason: cultural_note
