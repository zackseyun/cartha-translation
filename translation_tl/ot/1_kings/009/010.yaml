id: 1KI.9.10
reference: 1 Kings 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ עֶשְׂרִ֣ים שָׁנָ֔ה אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה אֶת שְׁנֵ֣י הַ/בָּתִּ֑ים אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֥ית הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: tl
  text: Nang matapos ang dalawampung taon[a], kung kailan itinayo ni Solomon ang dalawang bahay[b]—ang bahay ni Yahweh at ang bahay ng hari—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagkaraan ng dalawampung taon.” Ipinahihiwatig ng idyomang Hebreo ang pagkakumpleto ng dalawampung-taóng yugto.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang dalawang bahay,” samakatuwid, ang bahay ni Yahweh at ang bahay ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: Nang matapos ang dalawampung taon
  rationale: Likas na panimulang temporal sa Tagalog para sa Hebreong pormulang pasalaysay; ipinahihiwatig ng מִקְצֵה ang pagdating sa katapusan o pagkakumpleto ng yugto.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: na ginugol ni Solomon sa pagtatayo
  rationale: Iniuugnay ang gawain ni Solomon sa dalawampung-taóng yugto nang hindi ipinipilit na ang simpleng Hebreong pandiwa ay may tahasang aspektong katumbas ng past perfect.
- source_word: שְׁנֵי הַבָּתִּים
  choice: dalawang bahay
  rationale: Pinananatili ang literal na leksikal na ugnayan ng בַּיִת sa dalawang kasunod na pariralang 'bahay,' sa halip na gawing mas interpretatibong 'mga gusali.'
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang Hebreong 'bahay' at ang personal na banal na pangalang Yahweh, sa halip na palitan ito ng titulong 'Panginoon' o ng mas interpretatibong 'templo.'
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Malapit sa literal na Hebreo at pinananatili ang paralelismo sa 'bahay ni Yahweh'; ang 'palasyo' ay tama sa konteksto ngunit higit na pagpapakahulugan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton; ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
- issue: Kung tatawaging templo ang בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang 'bahay' ang leksikal na anyo ng Hebreo at nagpapanatili ng pagkakatulad sa bahay ng hari; ang 'templo' ay wastong reperensiya ngunit mas interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang nakabiting em dash dahil nagpapatuloy ang pangungusap sa susunod na talata; iniwasan ang arkaikong “at nangyari” upang maging likas ang salaysay sa Tagalog.
