  to: kung magkagayon, aalisin ko ang Israel mula sa lupaing ibinigay ko sa kanila. At ang bahay[a] na itinalaga kong banal para sa aking pangalan[b] ay itataboy ko mula sa aking harapan[c]. Ang Israel ay magiging kasabihan at tampulan ng panunuya sa gitna ng lahat ng mga bayan.[d]
