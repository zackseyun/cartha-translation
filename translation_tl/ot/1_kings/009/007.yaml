id: 1KI.9.7
reference: 1 Kings 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: tl
  text: kung magkagayon, aalisin ko ang Israel mula sa lupaing ibinigay ko sa kanila. At ang bahay[a] na itinalaga kong banal para sa aking pangalan[b] ay itataboy ko mula sa aking harapan[c]. Ang Israel ay magiging kasabihan at tampulan ng panunuya sa gitna ng lahat ng mga bayan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “templo.” Sa Hebreo: “bahay.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “para sa aking pangalan” ay idyomang Hebreo para sa itinalaga upang taglayin at parangalan ang pangalan ng Diyos.
    reason: cultural_note
  - marker: c
    text: O “palalayasin ko mula sa aking presensya.”
    reason: lexical_alternative
  - marker: d
    text: O “isang kasabihan at katawagang mapanlibak sa lahat ng mga bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: lilipulin ko
  rationale: Ang Hiphil ng כרת ay nangangahulugang alisin o lipulin. Sa Filipino, ipinahahayag ng “lilipulin” ang matinding hatol nang sapilitang ipakahulugang ganap na pagkalipol ng lahi; nililinaw ng kasunod na parirala na aalisin sila mula sa lupain.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה אֲשֶׁר נָתַתִּי לָהֶם
  choice: mula sa lupaing ibinigay ko sa kanila
  rationale: Tumutukoy ang אֲדָמָה rito sa lupaing ipinagkaloob sa Israel. Ang likas na Filipino ay hindi nangangailangan ng literal na “mula sa ibabaw ng mukha ng lupa.”
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Pinananatili ang literal na “bahay” at ang mahalagang motibo sa Mga Hari, habang inilalagay sa talababa ang malinaw na tinutukoy nitong templo.
- source_word: הִקְדַּשְׁתִּי
  choice: itinalaga kong banal
  rationale: Ipinahahayag nito ang Hiphil na diwang ‘itakda bilang banal’ sa malinaw at kasalukuyang Filipino.
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Pinananatili ang mahalagang idyomang Hebreo tungkol sa gusaling itinalaga upang taglayin at parangalan ang pangalan ng Diyos.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: itatakwil ko mula sa aking harapan
  rationale: Sa konteksto, ang שׁלח ay nagpapahiwatig ng pagtataboy o pagtanggi. Ang “mula sa aking harapan” ay nagpapanatili sa antropomorpikong larawan ng Hebreo.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: kasabihan at tampulan ng panunuya
  rationale: Pinananatili ng “kasabihan” ang diwa ng מָשָׁל, samantalang natural na ipinahahayag ng “tampulan ng panunuya” ang mapanlibak na diwa ng שְׁנִינָה.
- source_word: בְּכָל הָעַמִּים
  choice: sa gitna ng lahat ng mga bayan
  rationale: Ang “mga bayan” ay angkop sa pangmaramihang עַמִּים at umiiwas sa makabagong pampolitikang kahulugan ng “mga bansa.”
theological_decisions:
- issue: Paglalahad ng hatol ng tipan nang hindi ipinipilit ang ganap na pagkalipol
  choice: lilipulin ko ang Israel mula sa lupain
  alternative: aalisin ko ang Israel mula sa lupain
  rationale: Malakas ang pandiwang כרת, ngunit ang saklaw ng hatol ay tinutukoy ng pariralang “mula sa lupain.” Kaya hindi dapat gawing tahasang pahayag ng ganap na pagkalipol ang talata.
- issue: Kung “bahay” o “templo” ang gagamitin sa הַבַּיִת
  choice: bahay
  alternative: templo
  rationale: Ang pinagmulang teksto ay nagsasabing “bahay.” Pinananatili nito ang teolohikal at pampanitikang motibo ng bahay para sa pangalan ng Diyos; nililinaw sa talababa na templo ang tinutukoy.
- issue: Pagpapanatili sa idyomang “para sa aking pangalan”
  choice: para sa aking pangalan
  alternative: upang taglayin at parangalan ang aking pangalan
  rationale: Mahalaga ang eksaktong idyoma sa teolohiya ng Mga Hari. Ang paliwanag ay inilalagay sa talababa sa halip na ipalit sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga pangunahing larawang Hebreo—“bahay,” “aking pangalan,” at “aking harapan”—habang ginawang natural ang sintaks. Ginamit ang “kung magkagayon” upang iugnay ang hatol sa kondisyon ng naunang talata.
