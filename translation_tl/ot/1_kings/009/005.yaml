base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: tl
  text: kung magkagayon, itatatag ko magpakailanman ang trono ng iyong kaharian sa Israel, gaya ng sinabi ko tungkol kay David na iyong ama, nang sabihin ko, ‘Hindi ka mawawalan ng isang lalaking mula sa iyo na nasa trono ng Israel.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: kung magkagayon, itatatag ko
  rationale: Ang waw na kasunod ng kondisyon sa naunang talata ay nagpapahayag ng bunga; natural itong ihayag sa Tagalog bilang “kung magkagayon.” Ang pandiwa ay nangangahulugang pagtatatag o pagpapatibay.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: ang trono ng iyong kaharian
  rationale: Pinananatili ang maharlikang metapora at ang ugnayang gramatikal ng “trono” at “kaharian.”
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwang marangal na katumbas ng panahong walang takdang wakas sa kontekstong ito.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Hindi mawawalan ng lalaking mula sa iyo
  rationale: Ang literal na “hindi puputulin para sa iyo ang isang lalaki” ay isang idyoma tungkol sa hindi pagkaputol ng lalaking inapo o kahalili. Ang salin ay natural sa Tagalog habang pinananatili ang dinastikong diwa.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: sa trono ng Israel
  rationale: Sa idyomang ito, ang מֵעַל ay tumutukoy sa pagkawala mula sa posisyon sa trono; ang “sa trono” ang natural na Tagalog para sa paghahari.
theological_decisions:
- issue: Ang pangakong dinastiko at ang salitang לְעוֹלָם
  choice: Pinanatili ang “magpakailanman” nang walang paliwanag na pangdoktrina.
  alternative: Ipaliwanag ito bilang walang patid na literal na paghahari o bilang pangakong natutupad lamang sa isang partikular na teolohikong paraan.
  rationale: Hindi dapat lutasin sa mismong salin ang tensiyon sa pagitan ng kondisyong nasa konteksto at ng pangakong “magpakailanman.”
- issue: Pagkakakilanlan ng אִישׁ
  choice: “lalaking mula sa iyo”
  alternative: “anak” o “tagapagmana”
  rationale: Ang teksto ay nagsasabing “lalaki” at ipinahihiwatig ang dinastikong linya; hindi ito dapat paliitin sa agarang anak lamang o dagdagan ng teknikal na katawagang wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “iyong” at “magpakailanman” upang mapanatili ang angkop na biblikal na antas nang hindi nagiging lipas o labis na pormal.
