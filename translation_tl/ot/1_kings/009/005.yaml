  - severity: low
    issue: Hindi tahasang naihahayag ang introduksiyong “saying.”
    rationale: Ang tutuldok ay maaaring sapat, ngunit ang “nang sabihin ko” ay mas ganap na tumutugma sa לֵאמֹר at nananatiling natural.
