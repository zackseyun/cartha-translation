  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: tl
  text: At ang bahay na ito ay magiging isang guho[a]. Ang bawat taong daraan sa tabi nito ay masisindak at sisipol[b], at sasabihin nila, “Bakit ginawa ni Yahweh ang ganito sa lupaing ito at sa bahay na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang bahay na ito ay magiging mataas/dakila.” Sa kontekstong ito, inuunawa ng marami na ang diwa ay magiging guho o bagay na ikagigimbal; ihambing ang 2 Cronica 7:21.'
    reason: textual_variant
  - marker: b
    text: O “sisisitsit.” Ang pandiwang Hebreo ay tumutukoy sa paggawa ng matinis na tunog dahil sa pagkagulat o paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: At ang bahay na ito
  rationale: Pinananatili ng “bahay” ang literal na salita at ang pampanitikang ugnayan sa bahay na itinayo para kay Yahweh; malinaw sa konteksto na templo ang tinutukoy.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: ay magiging isang guho
  rationale: Bagaman “mataas/dakila” ang anyo ng tekstong Masoretiko, higit na angkop sa konteksto ng hatol at sa paralel sa 2 Cronica 7:21 ang diwang pagkawasak; inilalahad sa talababa ang tunay na tensiyong tekstuwal.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Ang bawat daraan dito
  rationale: Natural na Filipino para sa idyomang tumutukoy sa lahat ng nagdaraan sa tabi ng lugar.
- source_word: יִשֹּׁם
  choice: masisindak
  rationale: Ipinahahayag nito ang matinding pagkagulat at pagkilabot sa nasaksihang pagkawasak.
- source_word: וְשָׁרָק
  choice: at sisipol
  rationale: Tuwirang inilalarawan ang matinis na tunog bilang reaksiyon ng pagkagulat o paghamak; ang alternatibong “sitsit” ay nasa talababa.
- source_word: וְאָמְרוּ
  choice: at sasabihin nila
  rationale: Likas na salin ng pandiwang maramihan na may di-tiyak na simuno.
- source_word: עַל מֶה
  choice: Bakit
  rationale: Pinakanatural na paraan sa Filipino upang itanong ang dahilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: כָּכָה
  choice: ang ganito
  rationale: Natural na tumutukoy sa paraan at tindi ng hatol na nakikita ng mga nagdaraan.
- source_word: לָאָרֶץ הַזֹּאת
  choice: sa lupaing ito
  rationale: Ang “lupain” ay tumutukoy sa teritoryo ng Israel/Juda, hindi sa buong daigdig.
- source_word: וְלַבַּיִת הַזֶּה
  choice: at sa bahay na ito
  rationale: Pinananatili ang pag-uulit ng salitang “bahay” sa Hebreo at ang retorikal na balangkas ng talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng עֶלְיוֹן sa konteksto ng hatol
  choice: magiging isang guho
  alternative: magiging mataas/dakila
  rationale: Hindi maayos ang literal na “mataas” sa agarang konteksto ng sumpa at pagkawasak. Sinusuportahan ng paralel sa 2 Cronica 7:21 ang diwa ng pagkaguho, ngunit pinananatili sa talababa ang tekstuwal na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bahay” upang mapanatili ang salita at pag-uulit sa Hebreo, habang ang konteksto ang nagpapakilalang templo ang tinutukoy.
