  rationale: Inayos ang aspekto ng pandiwa sa nakaraang panahon, nilinaw ang kahulugan ng handog na sinusunog, at ginawang mas maigsi at mas karaniwan ang katawagan para sa mga handog na שְׁלָמִים. Pinanatili ang kalabuan ng וְהַקְטֵיר sa talababa at ang literal na “bahay” sa pangunahing teksto.
