source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: tl
  text: Tatlong beses bawat taon, naghandog si Solomon ng mga handog na lubusang sinusunog at mga handog para sa kapayapaan sa altar na itinayo niya para kay Yahweh. Nagsunog din siya roon ng insenso sa harap ni Yahweh.[a] Sa gayon ay natapos niya ang bahay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpausok siya roon ng mga handog.” Mas malawak ang maaaring kahulugan ng pandiwang Hebreo kaysa sa pagsusunog lamang ng insenso.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang bahay,” na tumutukoy rito sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: naghahandog
  rationale: Sa konteksto ng paghahain, ang Hiphil ng עלה ay tumutukoy sa paghahandog ng hain. Likas ito sa modernong Tagalog at hindi labis na literal.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Tumutukoy ito sa mga haing lubusang sinusunog sa altar. Malinaw sa karaniwang mambabasa ang paglalarawang ito.
- source_word: שְׁלָמִים
  choice: mga handog para sa mabuting ugnayan
  rationale: Saklaw ng termino ang kapayapaan, kapakanan, at pakikipag-ugnayan sa Diyos sa pamamagitan ng pinagsasaluhang hain. Iniiwasan ng salin ang makitid na pagkaunawa na ang tinutukoy lamang ay pagtatapos ng alitan.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Tatlong beses bawat taon
  rationale: Natural at tuwirang katumbas ng Hebreong pariralang temporal.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: sa altar na itinayo niya para kay Yahweh
  rationale: Pinananatili ang malinaw na ugnayan ng altar, pagtatayo nito, at pag-aalay nito kay Yahweh.
- source_word: וְהַקְטֵיר אִתּוֹ
  choice: Nagsusunog din siya roon ng insenso
  rationale: Madalas tumukoy ang קטר sa pagpapausok ng insenso, at ang אִתּוֹ ay malamang na kaugnay ng altar o lugar. Ginawang natural na Tagalog ang mahirap na sintaks, habang inilalahad sa talababa ang mas malawak na posibleng kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Sa gayon ay natapos niya ang bahay
  rationale: Ang Piel ng שלם ay maaaring mangahulugang tapusin o gawing ganap. Pinanatili ang literal na 'bahay,' na sa konteksto ay ang templo.
theological_decisions:
- issue: Kung personal bang isinagawa ni Solomon ang mga ritwal o ipinagawa niya ang mga ito
  choice: Iniuugnay ng salin kay Solomon ang paghahandog at pagsusunog, gaya ng nasa Hebreo, nang hindi tahasang sinasabing siya mismo ang nagsagawa ng bawat gawaing pangritwal.
  alternative: Sabihing ipinagawa ni Solomon sa mga pari ang mga paghahandog at pagpapausok.
  rationale: Maaaring gamitin sa buod tungkol sa hari ang mga pandiwa para sa kaniyang pagtataguyod o awtorisadong pagpapagawa, ngunit hindi ito nililinaw ng talata. Kaya hindi idinaragdag sa salin ang mga pari o ang paraan ng aktuwal na pagsasagawa.
- issue: Kahulugan ng pagpapausok sa וְהַקְטֵיר
  choice: Insenso ang inilagay sa pangunahing teksto, na may talababa tungkol sa mas malawak na sakripisyal na kahulugan.
  alternative: Isalin lamang bilang pagpapausok ng mga handog.
  rationale: Likas sa konteksto ng templo ang 'insenso,' ngunit maaaring mas malawak ang pandiwa at tumukoy sa pagpapausok ng hain. Pinananatili ng talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan. Iniwasan ang masyadong teknikal na bokabularyong pangritwal, at pinanatili sa talababa ang mahahalagang kalabuan ng Hebreo.
