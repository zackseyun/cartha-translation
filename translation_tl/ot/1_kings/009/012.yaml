base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: tl
  text: Kaya umalis si Hiram mula sa Tiro upang tingnan ang mga lunsod na ibinigay sa kanya ni Solomon, ngunit hindi niya nagustuhan ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ngunit hindi naging tama o kalugod-lugod ang mga iyon sa kanyang paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Likas sa makabagong Tagalog ang “umalis” para sa paglabas o pag-alis mula sa isang lugar at hindi nito dinaragdagan ang motibo ni Hiram.
- source_word: מִצֹּר
  choice: mula sa Tiro
  rationale: Tuwirang ipinahihiwatig ng מִן ang pinanggalingan; natural at malinaw ang “mula sa Tiro.”
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Pinananatili nito ang payak na diwa ng ראה habang ang “tingnan” ay natural sa konteksto ng pagpunta upang makita at suriin ang mga lunsod.
- source_word: הֶעָרִים
  choice: ang mga lunsod
  rationale: Ang עִיר ay maaaring lunsod o bayan; ang “mga lunsod” ay angkop sa heograpiko at administratibong konteksto.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: na ibinigay sa kanya ni Solomon
  rationale: Malinaw na tinutukoy ng sugnay ang mga lunsod, at likas sa Tagalog ang ayos na ito nang hindi kailangang tahasang markahan ang pluperfect.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: ngunit hindi niya nagustuhan ang mga iyon
  rationale: Natural nitong ipinahahayag sa Tagalog ang idyomang nangangahulugang hindi naging kalugod-lugod o katanggap-tanggap sa kanyang pagtingin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod” sa halip na “siyudad” para sa dignidad ng biblikal na salaysay, at inilahad nang natural ang Hebreong idyoma habang pinananatili sa talababa ang literal na larawan.
