language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: tl
  text: pati ang lahat ng mga lunsod na imbakan[a] na pag-aari ni Solomon, ang mga lunsod para sa mga karwahe, ang mga lunsod ng mga mangangabayo[b], at ang lahat ng ninais ni Solomon na itayo[c] sa Jerusalem, sa Lebanon, at sa buong lupaing nasa ilalim ng kanyang pamamahala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lunsod na imbakan” o “mga lunsod para sa mga panustos.” Tumutukoy ang Hebreo sa mga lunsod na inilaan para sa pag-iimbak o paglalaan ng mga panustos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga lunsod ng hukbong mangangabayo.” Higit na tiyak na tumutukoy ang salitang Hebreo sa mga mangangabayo kaysa sa mga kabayo lamang.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang nais ni Solomon na kanyang ninais na itayo,” isang paraang Hebreo ng pagbibigay-diin sa lahat ng bagay na lubos niyang ninais na itayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: mga lunsod-imbakan
  rationale: Tumutukoy ito sa mga lunsod na inilaan para sa pag-iimbak ng mga panustos. Malinaw at likas sa makabagong Tagalog ang “mga lunsod-imbakan.”
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: na pag-aari ni Solomon
  rationale: Pinananatili nito ang diwang pagmamay-ari o pagkakatalaga kay Solomon sa likas na Tagalog.
- source_word: עָרֵי הָרֶכֶב
  choice: mga lunsod para sa mga karwahe
  rationale: Ipinapakita nitong ang mga lunsod ay nakatalaga sa mga karwahe at kaugnay na kagamitang militar, nang hindi ipinahihiwatig na karaniwang lunsod lamang ang mga ito.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: mga lunsod ng mga mangangabayo
  rationale: Ang פָּרָשִׁים ay higit na tumutukoy sa mga mangangabayo kaysa sa mga kabayo lamang. Pinananatili ng salin ang pagkakaibang ito.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: anumang ninais ni Solomon
  rationale: Ang Hebreo ay gumagamit ng magkaugnay na pangngalan at pandiwa upang magbigay-diin. Ipinahahayag ng “anumang ninais” ang lawak ng parirala nang hindi lumilikha ng alanganing pag-uulit sa Tagalog.
- source_word: לִבְנוֹת
  choice: na itayo
  rationale: Karaniwan at angkop na salin ng pandiwa sa konteksto ng mga proyektong panggusali ng hari.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: sa Jerusalem, sa Lebanon
  rationale: Tuwirang saling panlunan; ang Lebanon ay ipinakikitang lugar ng gawaing pagtatayo, hindi lamang pinagmulan ng kahoy.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: sa buong lupaing sakop ng kanyang paghahari
  rationale: Likas na ipinapahayag sa Tagalog ang pinagsamang diwa ng teritoryo at kapangyarihang pampamahalaan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lunsod” para sa dignidad ng tekstong biblikal, ngunit pinanatiling payak ang ayos ng pangungusap. Inilagay ang bawat talababa kaagad pagkatapos ng pariralang tinutukoy nito.
