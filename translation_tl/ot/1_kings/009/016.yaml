base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: tl
  text: Umakyat ang Faraon, hari ng Ehipto, at sinakop ang Gezer at sinunog ito sa apoy. Pinatay niya ang mga Cananeong naninirahan sa lungsod at ibinigay ang Gezer sa kanyang anak, na asawa ni Solomon, bilang kaloob sa pag-aasawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang pabaon sa pag-aasawa” o “bilang dote.” Ang salitang Hebreo ay tumutukoy sa isang kaloob na kaugnay ng pag-aasawa; hindi ganap na tiyak ang katumbas nitong kaugaliang panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: umahon
  rationale: Pinananatili ang karaniwang idyomang Hebreo para sa pagpunta o pagsalakay patungo sa isang lugar; ang konteksto ang nagpapakitang militar ang kilos.
- source_word: וַיִּלְכֹּד
  choice: sinakop
  rationale: Likas at malinaw na salitang Filipino para sa pagbihag o pagkuha sa isang lungsod sa konteksto ng digmaan.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: Sinunog niya ito sa apoy
  rationale: Pinananatili ang tahasang pagbanggit sa apoy sa Hebreo, kahit may bahagyang pag-uulit sa Filipino.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: mga Cananeong naninirahan sa lungsod
  rationale: Bagaman anyong isahan ang katawagang etniko sa Hebreo, kolektibo ang gamit nito rito; natural sa Filipino ang maramihan.
- source_word: הָרָג
  choice: pinatay
  rationale: Tuwiran at walang dagdag na estilistikong kulay ang salin.
- source_word: וַיִּתְּנָהּ
  choice: ibinigay ang Gezer
  rationale: Inuulit ang pangalan ng lungsod upang maging malinaw ang tinutukoy ng hulaping pambabae sa Hebreo.
- source_word: שִׁלֻּחִים
  choice: bilang handog sa kasal
  rationale: Ipinahahayag ang kaloob na kaugnay ng pag-aasawa nang hindi nililimitahan ang diwa sa teknikal at maaaring makitid na kahulugan ng “dote.”
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: sa kanyang anak na asawa ni Solomon
  rationale: Pinananatili ang appositional na pagkakakilanlan ng anak bilang asawa ni Solomon sa natural na ayos ng Filipino.
