source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: tl
  text: At sasabihin nila, “Dahil iniwan nila si Yahweh, ang kanilang Diyos, na naglabas sa kanilang mga ama[a] mula sa lupain ng Ehipto, at kumapit sila sa ibang mga diyos, yumukod sa mga iyon, at nagsilbi sa mga iyon, kaya ipinasapit sa kanila ni Yahweh ang lahat ng kapahamakang ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga ninuno.” Sa literal, “mga ama nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: At sasabihin nila
  rationale: Pinananatili ang pang-ugnay at ang inaasahang tugon ng mga taong makakakita sa pagkawasak na binanggit sa naunang talata.
- source_word: עַל אֲשֶׁר
  choice: Dahil
  rationale: Likas na Filipino para sa pariralang nagpapakilala ng sanhi o dahilan.
- source_word: עָזְבוּ
  choice: iniwan
  rationale: Malinaw at kasalukuyang salitang nagpapahayag ng pagtatakwil o pagtalikod, nang hindi gumagamit ng makalumang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: Isahan ang tinutukoy sapagkat si Yahweh ang reperente, bagaman anyong maramihan ang pangngalang Hebreo.
- source_word: הוֹצִיא אֶת אֲבֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: naglabas sa kanilang mga ninuno mula sa lupain ng Ehipto
  rationale: Pinananatili ang pormula tungkol sa Exodo. Mas natural at tumpak sa saklaw ng konteksto ang “mga ninuno” kaysa sa literal ngunit maaaring mapagkamalang agarang mga magulang na “mga ama.”
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: kumapit sila sa ibang mga diyos
  rationale: Ipinahahayag ng “kumapit” ang mahigpit at sinadyang pag-uugnay ng sarili sa ibang mga diyos.
- source_word: וישתחו לָהֶם
  choice: yumukod sa mga iyon
  rationale: Pinananatili ang tiyak na kilos ng pagpapatirapa o pagyukod sa halip na gawing pangkalahatang “sumamba.”
- source_word: וַיַּעַבְדֻם
  choice: naglingkod sa mga iyon
  rationale: Pinananatili ang pagkakaiba nito sa naunang pagyukod at ang diwa ng paglilingkod na panrelihiyon.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Natural at malinaw na pananda ng bunga sa modernong Filipino.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: ipinasapit ... ang lahat ng kapahamakang ito
  rationale: Sa konteksto, ang רָעָה ay kapahamakan o kalamidad bilang hatol, hindi kasamaan sa moral na diwa. Ang “ipinasapit” ay natural na naghahayag ng aktibong pagdadala nito sa kanila.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagkilos ni Yahweh sa paghatol
  choice: ipinasapit sa kanila ni Yahweh
  alternative: hinayaan ni Yahweh na sumapit sa kanila
  rationale: Aktibong pandiwang causative ang הֵבִיא. Hindi ito dapat pahinain bilang pahintulot lamang; tuwirang iniuugnay ng talata kay Yahweh ang pagdating ng kapahamakan bilang bunga ng kanilang pagtalikod.
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga iyon” para sa mga diyos upang maiwasan ang paglalapat ng panghalip na karaniwang ginagamit sa tao, habang nananatiling malinaw ang magkakasunod na kilos: pagkapit, pagyukod, at paglilingkod.'
