revisions:
- from: At sasabihin nila, “Dahil iniwan nila si Yahweh na kanilang Diyos, na naglabas sa kanilang mga ninuno[a] mula sa lupain ng Ehipto, at kumapit sila sa ibang mga diyos, yumukod sa mga iyon, at naglingkod sa mga iyon, kaya ipinasapit sa kanila ni Yahweh ang lahat ng kapahamakang ito.”
  to: At sasabihin nila, “Dahil iniwan nila si Yahweh, ang kanilang Diyos, na naglabas sa kanilang mga ama[a] mula sa lupain ng Ehipto, at kumapit sila sa ibang mga diyos, yumukod sa mga iyon, at nagsilbi sa mga iyon, kaya ipinasapit sa kanila ni Yahweh ang lahat ng kapahamakang ito.”
