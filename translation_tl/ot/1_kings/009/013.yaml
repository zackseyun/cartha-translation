  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang mapunang tanong, ang tahasang “kapatid ko,” ang pagbibigay ng pangalan sa mga lungsod bilang “lupain ng Cabul,” at ang pormulang “hanggang sa araw na ito.” Ang “Kaya” ay katanggap-tanggap na pagsasalin ng sunod na kilos sa salaysay at hindi nagdaragdag ng mahalagang kahulugan.'
