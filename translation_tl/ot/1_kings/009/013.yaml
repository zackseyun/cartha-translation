base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: tl
  text: Sinabi niya, “Ano ba itong mga lunsod na ibinigay mo sa akin, kapatid ko?” Kaya tinawag niya ang mga iyon na lupain ng Cabul[a] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na pangalan ng lugar ang Cabul, ngunit maaaring may mapanlait ding paglalaro sa salitang Hebreo, na marahil ay nagpapahiwatig ng “walang silbi” o “parang nakagapos o limitado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Ano ba itong mga lunsod
  rationale: Ang מָה ay nagpapahayag dito ng mapunang tanong tungkol sa uri o kalidad ng mga lunsod. Likas sa modernong Filipino ang “Ano ba itong...” at naipadarama nito ang pagkadismaya nang hindi dinaragdagan ang diwa.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: na ibinigay mo sa akin
  rationale: Tapat at natural itong katumbas ng natapos nang pagbibigay na may tuwirang kaugnayan sa kasalukuyang reklamo.
- source_word: אָחִי
  choice: kapatid ko
  rationale: Pinananatili nito ang tahasang panghalip na paari at ang wikang pampamilya na ginagamit sa diplomatikong pakikipag-usap ng mga hari.
- source_word: וַיִּקְרָא לָהֶם
  choice: Kaya tinawag niya ang mga iyon
  rationale: Ang קרא na may ל ay maaaring mangahulugang tumawag o magbigay ng pangalan. Ang “tinawag” ay simple at hindi labis na nagpapaliwanag.
- source_word: אֶרֶץ כָּבוּל
  choice: lupain ng Cabul
  rationale: Ang אֶרֶץ ay isinaling “lupain,” at ang כָּבוּל ay pinanatiling pangalang pantangi. Ang posibleng mapanlait na paglalaro sa salita ay inilagay sa talababa sa halip na ipasok sa pangunahing teksto.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Pinananatili nito ang pananaw ng tagapagsalaysay at ang karaniwang Hebreong pormulang temporal.
