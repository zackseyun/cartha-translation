  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: tl
  text: At sinabi ni Yahweh sa kanya, “Narinig ko ang iyong panalangin at ang iyong pagsamo[a] na iniharap mo sa aking harapan. Ibinukod ko bilang banal ang bahay na ito[b] na itinayo mo, upang ilagay ko roon ang aking pangalan magpakailanman. Ang aking mga mata at ang aking puso[c] ay mananatili roon sa lahat ng panahon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagsamo” ay mapagpakumbaba at taimtim na paghingi ng pabor o awa.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay na ito” ay ang templong itinayo ni Solomon.
    reason: cultural_note
  - marker: c
    text: Ang “aking mga mata at ang aking puso” ay makataong paglalarawan sa patuloy na pagbabantay at malasakit ni Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: שָׁמַעְתִּי
  choice: Narinig ko
  rationale: Likas na salin ng Hebreong ganap na kilos sa tugon ng Diyos; ipinahihiwatig ng konteksto na pinakinggan at tinugon niya ang panalangin.
- source_word: תְּפִלָּתְךָ וְאֶת־תְּחִנָּתְךָ
  choice: ang iyong panalangin at ang iyong pagsamo
  rationale: Ibinubukod ng “pagsamo” ang mapagpakumbabang paghingi ng pabor mula sa mas pangkalahatang “panalangin,” kaya napapanatili ang pares na nasa Hebreo.
- source_word: אֲשֶׁר הִתְחַנַּנְתָּה לְפָנַי
  choice: na isinamo mo sa harap ko
  rationale: Pinananatili ang pagkakaugnay ng pangngalan at pandiwang Hebreo at ang idyomang tumutukoy sa paglapit sa presensiya ng Diyos.
- source_word: הִקְדַּשְׁתִּי
  choice: Itinalaga kong banal
  rationale: Ipinahahayag ang pagbubukod ng bahay bilang banal para sa Diyos nang hindi nililimitahan ang kahulugan sa karaniwang pagtatalaga lamang.
- source_word: הַבַּיִת הַזֶּה
  choice: ang bahay na ito
  rationale: Pinananatili ang literal na “bahay” ng Hebreo at ang teolohikal na larawan nito, habang nililinaw sa talababa na templo ni Solomon ang tinutukoy.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: upang ilagay doon ang aking pangalan
  rationale: Pinananatili ang tipanang idyoma tungkol sa pangalan ng Diyos nang hindi ito pinalalawak bilang tahasang pahayag tungkol sa pisikal na paninirahan niya.
- source_word: עַד־עוֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na salin ng pahayag tungkol sa namamalaging layunin at presensiya ng pangalan ng Diyos.
- source_word: עֵינַי וְלִבִּי
  choice: ang aking mga mata at ang aking puso
  rationale: Pinananatili ang sadyang makatao at kongkretong larawan ng Hebreo tungkol sa patuloy na pagbabantay at malasakit ng Diyos.
- source_word: כָּל־הַיָּמִים
  choice: sa lahat ng araw
  rationale: Pinananatili ang kongkretong idyomang Hebreo sa halip na gawing abstraktong “palagi.”
theological_decisions:
- issue: Makataong paglalarawan sa Diyos sa “aking mga mata at aking puso”
  choice: Panatilihin nang literal ang larawan at ipaliwanag ito sa talababa.
  alternative: Isalin bilang “ang aking pagbabantay at malasakit.”
  rationale: Sadyang gumagamit ang Hebreo ng makataong larawan upang ipahayag ang patuloy na pagtingin at malasakit ni Yahweh. Hindi dapat alisin ng salin ang teolohikal at pampanitikang tensiyon nito.
- issue: Kahulugan ng paglalagay ng pangalan ng Diyos sa bahay magpakailanman
  choice: Panatilihin ang idyomang “ilagay doon ang aking pangalan.”
  alternative: Palawakin bilang “manirahan doon magpakailanman” o “sambahin doon magpakailanman.”
  rationale: Ang teksto ay tahasang nagsasalita tungkol sa pangalan ng Diyos. Ang pagpapalit nito ng pahayag tungkol sa paninirahan o pagsamba ay magpapasok ng interpretasyong hindi tuwirang sinabi rito.
- issue: Pagpapabanal sa bahay
  choice: Isalin bilang “Itinalaga kong banal.”
  alternative: “Pinabanal ko” o “Itinalaga ko.”
  rationale: Pinagsasama ng napiling salin ang konsepto ng pagiging banal at ang pagbubukod para sa banal na gamit, nang hindi ipinahihiwatig na likas na banal ang gusali bukod sa kilos ng Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang mga kongkretong idyomang Hebreo—“bahay,” “ilagay ang aking pangalan,” “mga mata at puso,” at “lahat ng araw”—habang nililinaw lamang sa mga talababa ang maaaring hindi agad maunawaan ng karaniwang mambabasa.
