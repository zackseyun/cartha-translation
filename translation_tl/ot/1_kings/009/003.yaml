revisions:
- from: At sinabi ni Yahweh sa kanya, “Narinig ko ang iyong panalangin at ang iyong pagsamo[a] na isinamo mo sa harap ko. Itinalaga kong banal ang bahay na ito[b] na itinayo mo, upang ilagay doon ang aking pangalan magpakailanman. At doroon ang aking mga mata at ang aking puso[c] sa lahat ng araw.”
  to: At sinabi ni Yahweh sa kanya, “Narinig ko ang iyong panalangin at ang iyong pagsamo[a] na iniharap mo sa aking harapan. Ibinukod ko bilang banal ang bahay na ito[b] na itinayo mo, upang ilagay ko roon ang aking pangalan magpakailanman. Ang aking mga mata at ang aking puso[c] ay mananatili roon sa lahat ng panahon.”
  rationale: Inayos ang kalinawan ng tagaganap sa "upang ilagay ko roon," pinalitan ang maling "doroon," at ginawang mas likas ang pangwakas na idyoma. Pinanatili ang literal na "bahay," "pangalan," "mga mata," at "puso," pati ang pag-iingat sa pares na "panalangin" at "pagsamo."
