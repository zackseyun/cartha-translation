lexical_decisions:
- source_word: וַיִּבֶן
  choice: itinayo
  rationale: Ang qal wayyiqtol ng בנה ay karaniwang nangangahulugang “itinayo.” Bagaman sa konteksto ng mga proyekto ng hari maaari itong tumukoy sa muling pagtatayo o pagpapatibay, pinananatili rito ang payak na kahulugang leksikal.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa modernong saling Tagalog.
- source_word: גָּזֶר
  choice: Gezer
  rationale: Transliterasyon ng pangalang pook na גָּזֶר.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: Mababang Beth-horon
  rationale: Tinutukoy ng תַּחְתּוֹן ang mas mababa sa dalawang lugar na tinatawag na Beth-horon. Likas sa Tagalog ang “Mababang Beth-horon” at napapanatili nito ang heograpikong pagkakaiba.
- source_word: אֶת / וְאֶת
  choice: hindi isinalin nang bukod
  rationale: Mga pananda ito ng tuwirang layon; ipinakikita ang tungkulin ng mga ito sa balangkas ng pangungusap sa Tagalog.
