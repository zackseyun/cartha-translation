id: 1KI.9.21
reference: 1 Kings 9:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: tl
  text: ang kanilang mga anak na naiwan sa lupain pagkaraan nila, na hindi nagawang italaga ng mga anak ni Israel sa paglipol[a]—ipinasailalim sila ni Solomon sa sapilitang paggawa hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lipulin nang lubusan” o “ilagay sa ilalim ng pagbabawal.” Ang pandiwang Hebreo ay tumutukoy sa paglalagay ng mga tao o bagay sa ilalim ng חֵרֶם (herem), isang pagtatalaga sa paghatol na hindi na mababawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: kanilang mga anak
  rationale: Maaaring tumukoy ang maramihang anyo ng בֵּן sa mga anak o mga inapo. Pinananatili ng “mga anak” ang ugnayan sa naunang salinlahi nang hindi nililimitahan ang kahulugan sa mga lalaki lamang.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: naiwan pagkamatay nila
  rationale: Ipinahihiwatig ng parirala ang sumunod na salinlahing nanatili sa lupain matapos mawala ang naunang salinlahi. Nililinaw ng “pagkamatay nila” ang temporal na diwa ng אַחֲרֵיהֶם sa natural na Tagalog.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang “lupain” ang karaniwang salin sa kontekstong pangkasaysayan at tumutukoy sa lupain ng Israel/Canaan.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: hindi nagawang italaga ... sa paglipol
  rationale: Pinagsasama ng החרים ang diwa ng paglipol at ng di-mababawing pagtatalaga sa hatol. Pinananatili ng parirala ang dalawang aspektong ito sa halip na gawing simpleng pagpatay lamang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal ngunit malinaw na pagtutumbas sa Hebreong katawagan; ang tinutukoy ay ang sambayanang Israel.
- source_word: וַיַּעֲלֵם ... לְמַס עֹבֵד
  choice: ipinasailalim sila ... sa sapilitang paggawa
  rationale: Ipinakikita ng causative na pandiwa at ng pariralang לְמַס עֹבֵד na inilagay sila sa isang ipinataw na sistemang paggawa. Natural at malinaw sa modernong Tagalog ang “ipinasailalim ... sa sapilitang paggawa.”
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang pinananatili ang karaniwang Hebreong pormulang temporal.
theological_decisions:
- issue: Pagpapahayag sa החרים sa konteksto ng pananakop at paghatol
  choice: italaga sa paglipol
  alternative: lipulin nang lubusan; ilagay sa ilalim ng pagbabawal
  rationale: Pinananatili ng napiling salin ang tensiyon sa pagitan ng ganap na paglipol at di-mababawing pagtatalaga sa banal na paghatol. Hindi nito binabawasan ang salita tungo sa karaniwang pagkawasak lamang at hindi rin ito itinatago sa isang teknikal na katawagan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang anyong “mga anak ni Israel” dahil malapit ito sa Hebreo at pamilyar sa wikang biblikal; ginamit ang “sapilitang paggawa” sa halip na teknikal na “corvée” o mas tiyak na “aliping paggawa.”
