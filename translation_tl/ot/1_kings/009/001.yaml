  naturalness: Kailangan ng munting rebisyon para sa mas malinaw at likas na sintaks sa makabagong Filipino. Ang nominal na “ang pagtatayo” at “ang pagsasagawa” ay nag-aalis ng alanganing saklaw ng “na itayo” habang pinananatili ang nakabiting pangungusap na nagpapatuloy sa susunod na talata.
