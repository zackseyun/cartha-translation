  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: tl
  text: At nang matapos ni Solomon ang pagtatayo ng bahay ni Yahweh, ng bahay ng hari, at ang pagsasagawa ng lahat ng nais niyang gawin,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Ang וַיְהִי ay panandang pasalaysay na nag-uugnay at nagpapakilala sa bagong pangyayari. Kasama ng kasunod na temporal na parirala, natural itong naihahayag sa Filipino bilang “At nang” nang hindi gumagamit ng makalumang “at nangyari.”
- source_word: כְּכַלּוֹת
  choice: matapos
  rationale: 'Ang כְּ na kasama ng infinitive construct ng כלה ay nagpapahayag ng panahong kalagayan: nang matapos ang isang gawain.'
- source_word: לִבְנוֹת
  choice: na itayo
  rationale: Tumutukoy ang בנה sa pagtatayo. Ang “matapos ... na itayo” ay malinaw at likas sa Filipino sa kontekstong ito.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang literal na larawan at ang pagkakapantay ng parirala sa “bahay ng hari”; ang “templo” ay tama sa konteksto ngunit mas interpretatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: ang bahay ng hari
  rationale: Pinananatili nito ang literal na anyo at ang estilistikong pagkakapantay sa “bahay ni Yahweh,” bagaman maaaring tukuyin sa konteksto bilang palasyo.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה
  choice: ang lahat ng nais ni Solomon
  rationale: Maaaring tumukoy ang חֵשֶׁק sa pagnanais o sa bagay na ninanais. Ang pariralang Filipino ay likas habang pinananatiling bukas kung pangkalahatang hangarin o mga proyektong ninasa ang tinutukoy.
- source_word: חָפֵץ
  choice: nais
  rationale: Ipinahahayag ng pandiwa ang pagnanais o pagkakaroon ng kasiyahan sa isang bagay. Ang “nais” ang pinakanatural dito at kasabay na sumasalamin sa semantikong pag-uulit ng חֵשֶׁק.
- source_word: לַעֲשׂוֹת
  choice: gawin
  rationale: Malawak ang kahulugan ng עשה, “gawin” o “likhain.” Hindi labis na tinutukoy ng “gawin” kung pagtatayo lamang o iba pang proyekto ang saklaw.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, hindi ang titulong אֲדֹנָי. Pinananatili ng “Yahweh” ang pagkakaibang ito nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “bahay” sa dalawang magkatambal na parirala at ang nakabiting kuwit dahil nagpapatuloy ang pangungusap sa susunod na talata.
