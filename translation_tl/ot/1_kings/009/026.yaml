base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: tl
  text: Gumawa rin si Haring Solomon ng isang plota ng mga barko sa Ezion-geber, na katabi ng Elot, sa baybayin ng Dagat na Pula[a], sa lupain ng Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Dagat ng mga Tambo”; ayon sa tradisyon, “Dagat na Pula.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: rin … isang plota ng mga barko
  rationale: Ang אֳנִי ay tumutukoy sa barko o sa isang pangkat ng mga barko. Sa kontekstong pandagat, malinaw at natural sa modernong Tagalog ang “isang plota ng mga barko”; ang וָ־ ay kinakatawan ng “rin” bilang pag-uugnay sa naunang salaysay.
- source_word: עָשָׂה
  choice: nagpagawa
  rationale: Bagaman karaniwang nangangahulugang “gumawa” ang pandiwa, ang causative na diwa ng Tagalog na “nagpagawa” ay angkop sa isang hari na nagpapatayo o nagpapagawa ng plota, nang hindi ipinahihiwatig na siya mismo ang pisikal na gumawa nito.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: sa Ezion-geber
  rationale: Pangalan ito ng lugar at tinumbasan ang בְּ ng natural na lokatibong “sa.”
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: na katabi ng Elot
  rationale: Ipinapahayag ng parirala ang malapit na lokasyong kaugnayan sa Elot. Mas malapit sa Hebreong ugnayan ang “katabi” kaysa sa mas maluwag na “malapit.”
- source_word: עַל שְׂפַת יַם סוּף
  choice: sa baybayin ng Dagat na Pula[a]
  rationale: Ang שְׂפַת ay literal na “labi/gilid” at tumutukoy rito sa baybayin. Ginamit sa teksto ang nakaugaliang pangalang “Dagat na Pula,” habang pinanatili sa talababa ang mas literal na alternatibo para sa יַם סוּף.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: sa lupain ng Edom
  rationale: Pinananatili ng “sa lupain ng Edom” ang buong heograpikong pahayag ng Hebreo, sa halip na paikliin lamang bilang “sa Edom.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “plota ng mga barko” upang maipaliwanag ang kolektibong terminong pandagat, at inilagay ang talababa pagkatapos ng “Dagat na Pula,” ang mismong salitang tinutukoy nito.
