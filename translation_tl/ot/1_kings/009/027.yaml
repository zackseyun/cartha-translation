  verdict: revise
  source_fidelity: Ang “isinama” ay hindi tuwirang katumbas ng וַיִּשְׁלַח (“nagpadala”); mas malinaw na dapat ipahayag na si Hiram ang nagpadala ng kanyang mga tauhan. Ang mga tauhang ito ang inilalarawang mga taong-dagat/mga mandaragat na may kaalaman sa dagat.
  naturalness: Natural ang “mga mandaragat na nakaaalam sa dagat,” at pinananatili nito ang magkahiwalay ngunit magkaugnay na paglalarawan sa Hebreo. Mas malinaw din ang ayos na inilalapit ang paglalarawan sa mga tauhan ni Hiram.
  terminology: Ang “mga tauhan” ay katanggap-tanggap para sa עֲבָדָיו at עַבְדֵי שְׁלֹמֹה sa kontekstong panglayag. Ang “mga mandaragat” ay likas na katumbas ng אַנְשֵׁי אֳנִיּוֹת; ang “nakaaalam sa dagat” ay nagpapanatili sa kasunod na יֹדְעֵי הַיָּם.
  issues:
