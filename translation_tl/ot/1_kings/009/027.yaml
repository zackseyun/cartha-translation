translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “isinama ... sa barko” upang likas na maipahayag ang pagpapadala ni Hiram ng kanyang mga tauhan kasama ng mga tauhan ni Solomon. Pinanatili bilang dalawang magkaugnay na paglalarawan ang kasanayan sa paglalayag at kaalaman sa dagat.
