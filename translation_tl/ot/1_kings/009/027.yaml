  text: And Hiram sent his servants on the ship with Solomon’s servants—men of ships, men who knew the sea.
translation:
  language: tl
  text: At nagpadala si Hiram sa barko ng kanyang mga tauhan—mga mandaragat na nakaaalam sa dagat—kasama ng mga tauhan ni Solomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו / עַבְדֵי שְׁלֹמֹה
  choice: kanyang mga tauhan / mga tauhan ni Solomon
  rationale: Bagaman literal na “mga lingkod,” ang “mga tauhan” ay mas natural sa konteksto ng isang ipinadalang pangkat na mandaragat at hindi nito labis na tinutukoy ang kanilang legal o panlipunang katayuan.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: mga bihasa sa paglalayag
  rationale: Ang idyomang literal na “mga lalaki ng mga barko” ay tumutukoy sa mga taong sanay o bihasa sa gawaing pandagat; iniiwasan ang salitang “mandaragat” upang mapanatili rin ang kasunod na hiwalay na paglalarawang “nakaaalam sa dagat.”
- source_word: יֹדְעֵי הַיָּם
  choice: nakaaalam sa dagat
  rationale: Pinananatili ang kongkretong Hebreong paglalarawan at ang diin sa praktikal na kaalaman sa dagat, sa halip na lubusang ipaloob ito sa “mga bihasa sa paglalayag.”
- source_word: בָּאֳנִי
  choice: sa barko
  rationale: Ang pang-ukol בְּּ dito ay natural na tumutukoy sa pagsama o pagpapadala sa loob/sakay ng barko; “sa barko” ang pinakamaikli at likas na Filipino.
