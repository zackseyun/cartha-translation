    issue: “isinama” para sa וַיִּשְׁלַח
    rationale: Ang pandiwang Hebreo ay “nagpadala,” hindi lamang “isinama.” Maaaring ipahiwatig ng “isinama” na ang pangunahing kilos ay pagsama, samantalang ang teksto ay tahasang nagsasabing nagpadala si Hiram ng kanyang mga tauhan.
  - severity: low
    issue: Hindi malinaw kung sino ang inilalarawan ng pangwakas na parirala
    rationale: Sa draft, ang “mga bihasa ... at nakaaalam ...” ay maaaring basahing paglalarawan ng pinagsamang tauhan. Sa Hebreo, ang mga tauhan ni Hiram ang tinutukoy; nililinaw ito ng binagong ayos.
  revised_text: At nagpadala si Hiram sa barko ng kanyang mga tauhan—mga mandaragat na nakaaalam sa dagat—kasama ng mga tauhan ni Solomon.
