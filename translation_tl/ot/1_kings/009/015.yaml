base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: tl
  text: Ito ang ulat tungkol sa sapilitang paggawa[a] na ipinataw ni Haring Solomon upang itayo ang bahay ni Yahweh, ang sarili niyang bahay, ang Millo[b], ang pader ng Jerusalem, Hazor, Megiddo, at Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “takdang sapilitang paglilingkod sa pamahalaan.” Hindi ito buwis na salapi kundi paggawa na sapilitang hinihingi ng estado.
    reason: lexical_alternative
  - marker: b
    text: Ang “Millo” ay malamang na isang kilalang bahagi ng kuta o isang tambak o terasa ng lupa sa Jerusalem. Maaaring kaugnay ang pangalang Hebreo sa kahulugang “punô” o “tambak,” ngunit hindi tiyak ang eksaktong anyo nito.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: ulat tungkol sa
  rationale: Sa pariralang וְזֶה דְבַר הַמַּס, ipinakikilala ng דְבַר ang paliwanag o tala hinggil sa sapilitang paggawa. Ang “ulat tungkol sa” ay likas sa makabagong Tagalog at hindi nagdaragdag ng temporal na “ngayon.”
- source_word: הַמַּס
  choice: sapilitang paggawa
  rationale: Sa konteksto ng mga proyekto ng hari, tumutukoy ang מַס sa sapilitang paglilingkod sa estado, hindi sa buwis na salapi. Ito ang pinakamalinaw na di-teknikal na katumbas.
- source_word: הֶעֱלָה
  choice: ipinataw
  rationale: Ang Hiphil ng עלה ay nangangahulugang magpataw o magtalaga ng isang levy. Ang “ipinataw” ay angkop sa sapilitang paggawa at pinananatili ang administratibong diwa.
- source_word: לִבְנוֹת
  choice: upang itayo
  rationale: Ipinapahayag ng infinitive ang layunin ng pagpapataw sa paggawa.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang literal na “bahay” at ang personal na pangalang banal na יהוה, nang hindi agad pinapalitan ng interpretatibong “templo.”
- source_word: בֵּיתוֹ
  choice: sarili niyang bahay
  rationale: Nililinaw nito ang paghahambing sa bahay ni Yahweh habang pinananatili ang payak na katawagang “bahay.”
- source_word: הַמִּלּוֹא
  choice: ang Millo
  rationale: Isang tiyak ngunit hindi ganap na matukoy na estruktura o bahagi ng kuta sa Jerusalem ang termino. Ang transliterasyon ay umiiwas sa labis na katiyakan.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: ang pader ng Jerusalem
  rationale: Tuwirang salin ito ng pariralang Hebreo at natural sa Tagalog.
- source_word: חָצֹר / מְגִדּוֹ / גָּזֶר
  choice: Hazor / Megiddo / Gezer
  rationale: Mga karaniwang transliterasyon ng mga pangalan ng lugar.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng “bahay ni Yahweh”
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang “bahay” ay mas malapit sa בֵּית at pinananatili ang matalinghagang at tipanang diwa; bagaman templo ang tinutukoy sa konteksto, hindi kailangang isara ng salin ang saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapilitang paggawa” sa halip na teknikal na “corvée,” at pinanatili ang “Millo” dahil hindi tiyak ang eksaktong uri ng estruktura. Inilagay ang bawat talababa sa salitang aktuwal nitong ipinapaliwanag.
