  terminology: Ang “sapilitang paggawa,” “ipinataw,” “bahay ni Yahweh,” at “Millo” ay angkop. Ang talababa para sa Millo ay dapat bahagyang linawin upang hindi ipahiwatig na tiyak na isang “pilapil” ang tinutukoy; hindi tiyak ang eksaktong anyo ng Millo.
