translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang construct na “mga pinuno ng mga itinalagang opisyal” upang hindi mawala ang dalawang antas ng katawagang administratibo sa Hebreo. Hinati sa dalawang pangungusap upang maging malinaw ang bilang at ang tungkulin ng mga opisyal.
