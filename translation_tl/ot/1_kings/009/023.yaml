base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: tl
  text: Ito ang mga pinuno ng mga itinalagang opisyal[a] na namamahala sa gawain para kay Solomon—limang daan at limampu silang namumuno[b] sa mga taong gumagawa ng gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga katiwala” o “mga opisyal na inilagay sa tungkulin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nangangasiwa”; ang pandiwa ay maaaring mangahulugang mamuno, mamahala, o gumamit ng awtoridad sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ipinahahayag nito ang mga nakatataas na lider sa isang kontekstong administratibo nang hindi nagbibigay ng di-kinakailangang kahulugang militar.
- source_word: הַנִּצָּבִים
  choice: mga itinalagang opisyal
  rationale: Ang substantibong anyo mula sa נצב ay tumutukoy sa mga taong inilagay o itinalaga sa isang tungkulin; malinaw at likas ito sa modernong Filipino.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: na namamahala sa gawain
  rationale: Likas na ipinapahayag sa Filipino ang ideya ng pagiging 'nasa ibabaw' o may pananagutan sa gawain.
- source_word: לִשְׁלֹמֹה
  choice: para kay Solomon
  rationale: Pinananatili nito ang ugnayan ng paglilingkod na ipinahahayag ng ל nang hindi tinutukoy nang higit sa pinagmulan kung pag-aari o direktang utos ang diin.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: '550'
  rationale: Karaniwan at madaling maunawaang pagsulat ng bilang sa modernong Filipino.
- source_word: הָרֹדִים
  choice: namumuno
  rationale: Pinananatili nito ang pangunahing diwa ng רדה na paggamit ng pamamahala o awtoridad; hindi ito pinalalambot tungo lamang sa teknikal na pagsubaybay.
- source_word: בָּעָם
  choice: sa mga tao
  rationale: Tuwirang katumbas ito ng עָם; nililinaw ng kasunod na parirala kung aling mga tao ang tinutukoy.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: na gumagawa ng gawain
  rationale: Malinaw at malapit ito sa participial na parirala ng Hebreo.
