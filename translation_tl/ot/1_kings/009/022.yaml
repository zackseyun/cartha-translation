source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: tl
  text: Ngunit walang isa man sa mga anak ng Israel ang ginawang alipin ni Solomon, sapagkat sila ang mga lalaking mandirigma, mga lingkod niya, mga pinuno niya, mga opisyal niya[a], mga pinuno ng kanyang mga karwahe, at mga mangangabayo niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ayudanteng militar niya.” Malamang na tumutukoy ang salitang Hebreo sa isang natatanging pangkat ng matataas na ayudanteng militar o mga opisyal na kaugnay ng mga karwaheng pandigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Ngunit wala ni isa sa mga anak ng Israel
  rationale: Pinananatili ang Hebreong katawagang “mga anak ng Israel,” habang likas na ipinahahayag sa Tagalog ang diwang partitive ng מִן at ang paghahambing sa naunang talata.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: ang ginawang alipin ni Solomon
  rationale: Sa konteksto ng sapilitang paggawa sa mga naunang talata, ang עָבֶד ay tumutukoy sa kalagayang alipin, hindi lamang sa karaniwang paglilingkod. Ang isahang anyo nito ay kolektibo, kaya ang “wala ni isa” ay malinaw at natural.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking pandigma
  rationale: Pinananatili ang tahasang panlalaking diwa ng אַנְשֵׁי at ang tungkuling militar ng parirala.
- source_word: וַעֲבָדָיו
  choice: mga lingkod niya
  rationale: Sa hanay ng mga tungkulin sa hari, ang עֲבָדָיו ay tumutukoy sa mga naglilingkod kay Solomon. Ang “lingkod” ay nagpapanatili sa malawak na kahulugan nang hindi ipinagpapalagay na alipin ang lahat ng tinutukoy rito.
- source_word: וְשָׂרָיו
  choice: mga pinuno niya
  rationale: Ang שַׂר ay maaaring pinuno, opisyal, o kumander. Ang “pinuno” ay angkop sa militar at maharlikang konteksto at hindi labis na tiyak.
- source_word: וְשָׁלִשָׁיו
  choice: mga opisyal niya
  rationale: Hindi tiyak ang eksaktong makasaysayang tungkulin ng שָׁלִישׁ. Ang “opisyal” ay malinaw at hindi labis na interpretatibo; inilalahad sa talababa ang mas tiyak na posibilidad.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: mga pinuno ng kanyang mga karwahe
  rationale: Tuwirang inilalarawan ang mga namumuno sa puwersang gumagamit ng mga karwaheng pandigma.
- source_word: וּפָרָשָׁיו
  choice: mga mangangabayo niya
  rationale: Tuwirang katumbas ito ng mga kawal na nakasakay sa kabayo at umiiwas sa mas makabagong tunog ng “kabalyerya.”
theological_decisions:
- issue: Kalagayang panlipunan na ipinahihiwatig ng עָבֶד
  choice: alipin sa unang gamit; lingkod sa וַעֲבָדָיו
  alternative: manggagawang sapilitan sa unang gamit; mga alipin niya sa ikalawang gamit
  rationale: Magkapareho ang salitang-ugat ngunit magkaiba ang agarang gamit. Ang una ay nasa konteksto ng sapilitang paggawa at katayuang alipin; ang ikalawa ay kabilang sa talaan ng mga taong naglilingkod sa hari. Hindi dapat piliting magkapareho ang salin kung magkaiba ang konteksto.
- issue: Panlalaking katawagan sa אַנְשֵׁי הַמִּלְחָמָה
  choice: mga lalaking pandigma
  alternative: mga mandirigma
  rationale: Pinananatili ang panlalaking anyo ng Hebreo dahil tumutukoy ang talata sa sinaunang mga tungkuling militar at maharlika na ginagampanan ng mga lalaki.
- issue: Eksaktong ranggo ng שָׁלִישׁ
  choice: mga opisyal niya, na may talababa
  alternative: mga ayudanteng militar niya
  rationale: Hindi ganap na tiyak kung ito ay mataas na ayudanteng militar, opisyal ng karwahe, o ibang natatanging ranggo. Ang pangkalahatang salin na may talababa ang pinakamahusay na nagpapanatili sa kawalang-katiyakan.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng karaniwang salitang “karwahe,” “mangangabayo,” at “opisyal.” Iniwasan ang sobrang teknikal o makalumang mga katawagan. Inilagay ang pananda [a] kaagad pagkatapos ng salitang tinatalakay nito.
