  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: tl
  text: Nagpunta[a] sila sa Ofir at kumuha sila mula roon ng apat na raan at dalawampung talento ng ginto, at dinala nila ito kay Haring Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dumating.” Maaaring isalin sa alinman sa dalawang paraan ang pandiwang Hebreo, ngunit mas natural sa pananaw ng salaysay ang “nagpunta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Nagpunta sila
  rationale: Ang בוא ay karaniwang may diwang “dumating,” ngunit sa sunod-sunod na salaysay at sa direksiyonal na אוֹפִירָה, natural sa Filipino ang “nagpunta.” Pinananatili sa talababa ang tunay na alternatibong “dumating.”
- source_word: אוֹפִירָה
  choice: sa Ofir
  rationale: Ang hulaping direksiyonal na -ה ay nagsasaad ng pagkilos patungo sa Ofir; natural itong ipinahahayag ng “sa” kasunod ng “nagpunta.” Ginamit ang karaniwang anyong Filipino na “Ofir.”
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: kumuha roon
  rationale: Tuwirang isinasalin ang לקח bilang “kumuha,” habang ang מִשָּׁם ay ipinahahayag ng natural na “roon” sa Filipino; malinaw sa pandiwa at konteksto na mula sa lugar na iyon ang kinuha.
- source_word: זָהָב
  choice: ginto
  rationale: Ito ang tuwiran at karaniwang katumbas sa Filipino.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: apat na raan at dalawampung talento
  rationale: Pinananatili ang eksaktong bilang at ang sinaunang yunit ng timbang. Ang “talento” ang nakasanayang salin ng כִּכָּר sa kontekstong biblikal.
- source_word: וַיָּבִאוּ
  choice: dinala nila ito
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin.” Idinagdag ang likas na panghalip na “ito” upang malinaw na ginto ang dinala, nang hindi nagdaragdag ng bagong impormasyon.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: kay Haring Solomon
  rationale: Ito ang natural at marangal na ayos sa modernong Filipino para sa titulong maharlika at pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural sa karaniwang mambabasa. Pinanatili ang sinaunang yunit na “talento” at ang ambiguwidad ng unang pandiwa sa pamamagitan ng talababa.
