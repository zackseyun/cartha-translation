base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: tl
  text: Nabalitaan ng reyna ng Sheba ang katanyagan ni Solomon kaugnay ng pangalan ni Yahweh[a], at dumating siya upang subukin siya sa pamamagitan ng mga palaisipan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang ulat tungkol kay Solomon na may kaugnayan sa pangalan ni Yahweh.” Siksik at maaaring unawain sa iba’t ibang paraan ang pariralang Hebreo; maaaring ipinahihiwatig na ang katanyagan ni Solomon ay nakaugnay sa pangalan o reputasyon ni Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “mahihirap na tanong.” Mas literal na tumutukoy ang Hebreo sa mga bugtong, palaisipan, o enigmatikong pananalita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַֽלְכַּת שְׁבָא
  choice: ang reyna ng Sheba
  rationale: Ang konstruktong Hebreo ay tuwirang nangangahulugang “reyna ng Sheba.” Hindi na isinalin nang hiwalay ang panimulang waw dahil natural na makapagsimula rito ang bagong tagpo sa Tagalog nang walang dagdag na pang-ugnay.
- source_word: שֹׁמַעַת אֶת שֵׁמַע שְׁלֹמֹה
  choice: nabalitaan ... ang katanyagan ni Solomon
  rationale: Maaaring tumukoy ang שֵׁמַע sa balita, ulat, o katanyagan. Pinagsasama ng “nabalitaan ... ang katanyagan” ang kilos ng pagkarinig at ang malawak na reputasyong umabot sa malayong reyna.
- source_word: לְ/שֵׁם יְהוָה
  choice: kaugnay ng pangalan ni Yahweh
  rationale: Masalimuot at siksik ang pariralang Hebreo. Pinananatili ng “kaugnay” ang ugnayan ng katanyagan ni Solomon at ng pangalan o reputasyon ni Yahweh nang hindi nagpapasiya kung ito ay sanhi, layunin, o paksa.
- source_word: וַ/תָּבֹא
  choice: at pumunta siya
  rationale: Isinusulong ng wayyiqtol ang salaysay. Ang “at pumunta siya” ay natural at hindi nagdaragdag ng tiyak na ugnayang sanhi na wala sa anyong Hebreo.
- source_word: לְ/נַסֹּת/וֹ
  choice: upang subukin ito
  rationale: Karaniwang nangangahulugan ang נסה na subukin o siyasatin. Ang “subukin” ay angkop sa layunin ng reyna na alamin ang kakayahan ni Solomon.
- source_word: בְּ/חִידוֹת
  choice: sa pamamagitan ng mga palaisipan
  rationale: Ang חִידוֹת ay mga bugtong, palaisipan, o enigmatikong tanong. Ang “mga palaisipan” ay malinaw sa modernong Tagalog at hindi nililimitahan ang salita sa isang partikular na uri ng bugtong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalang “Yahweh,” hindi pinalitan ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng transliterasyong “Yahweh” ang pagkakaiba nito sa isang titulo.
- issue: Ugnayan ng katanyagan ni Solomon at ng pangalan ni Yahweh
  choice: kaugnay ng pangalan ni Yahweh
  alternative: dahil sa pangalan ni Yahweh / tungkol sa pangalan ni Yahweh
  rationale: Hindi lubos na tiyak ang gamit ng לְ sa maikling parirala. Pinananatili ng “kaugnay” ang tunay na sintaktiko at teolohikal na kalabuan sa halip na tukuyin nang walang katiyakan na sanhi o paksa ang pangalan ni Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nabalitaan” at “mga palaisipan” bilang mga karaniwang salitang madaling maunawaan, habang pinanatili ang siksik at hindi tiyak na ugnayan sa pariralang “kaugnay ng pangalan ni Yahweh.”
