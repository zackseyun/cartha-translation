translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang “siklo” bilang makasaysayang yunit ng timbang; ginamit ang “malalaking kalasag” upang maipakita ang leksikal na pagkakaiba sa kasunod na talata. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
