base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: tl
  text: Gumawa si Haring Solomon ng dalawang daang malalaking kalasag na yari sa pinukpok na ginto[b]; anim na raang siklo ng ginto[a] ang ginamit sa bawat kalasag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “anim na raang ginto ang umakyat sa isang kalasag.” Ipinahihiwatig, ngunit hindi tahasang binabanggit sa Hebreo, ang “siklo” bilang yunit ng timbang.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo rito para sa “kalasag” ay tumutukoy sa isang malaking kalasag, na malamang ay iba sa mas maliliit na kalasag na binanggit sa kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa
  rationale: Karaniwang kahulugan ng עשה sa kontekstong ito ang paggawa ng mga bagay; natural at tuwiran ang “gumawa” sa modernong Tagalog.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: si Haring Solomon
  rationale: Likas sa Tagalog ang pagsasama ng titulo at pangalan sa anyong “Haring Solomon.”
- source_word: מָאתַיִם
  choice: dalawang daan
  rationale: Tuwirang salin ng bilang.
- source_word: צִנָּה
  choice: malalaking kalasag
  rationale: Ang צִנָּה ay tumutukoy sa malaking uri ng kalasag at malamang na ipinag-iiba sa mas maliit na uri na binanggit sa kasunod na talata.
- source_word: זָהָב שָׁחוּט
  choice: pinukpok na ginto
  rationale: Inilalarawan ng שָׁחוּט ang gintong pinanday o pinanipis sa pamamagitan ng pagpukpok; malinaw at likas sa Tagalog ang “pinukpok na ginto.”
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: animnaraang siklo ng ginto
  rationale: Walang tahasang yunit sa Hebreo, ngunit ipinahihiwatig ng konstruksyon ang yunit ng timbang na siklo; inilagay ito sa teksto para sa kalinawan at ipinaliwanag sa talababa.
- source_word: יַעֲלֶה עַל
  choice: ang ginamit sa
  rationale: Literal na “umakyat/napunta sa ibabaw,” ngunit sa konteksto ay tumutukoy sa dami ng gintong inilapat sa paggawa ng bawat kalasag; natural sa Tagalog ang “ginamit sa.”
- source_word: הַצִּנָּה הָאֶחָת
  choice: bawat kalasag
  rationale: 'Bagaman literal na “ang isang kalasag,” distributibo ang diwa nito: ang naturang dami ay para sa bawat isa sa dalawang daang kalasag.'
