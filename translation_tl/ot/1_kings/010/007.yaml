translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “At talaga nga” sa halip na mas arkaikong “narito” upang maihatid ang diin at pagkagulat ng הִנֵּה. Inilagay ang talababa sa dulo ng sugnay na may “kasaganaan,” na siyang salitang nililinaw nito.
