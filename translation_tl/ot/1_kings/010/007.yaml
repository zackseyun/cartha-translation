base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: tl
  text: Ngunit hindi ako naniwala sa mga balita hanggang sa dumating ako at nakita ito ng sarili kong mga mata. Tunay nga, hindi man lang sinabi sa akin ang kalahati. Higit na malaki ang iyong karunungan at kasaganaan kaysa sa balitang narinig ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Higit na malaki ang iyong karunungan at kayamanan kaysa sa balitang narinig ko.” Ang Hebreong טוֹב ay maaaring tumukoy sa pangkalahatang kasaganaan o mabuting kalagayan; sa kontekstong ito, maaaring kabilang dito ang kayamanan bilang bahagi ng maunlad na kalagayan ni Solomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: hindi ako naniwala
  rationale: Ang Hiphil ng אמן ay nangangahulugang itinuring na totoo o kapani-paniwala; natural at tuwiran ang “naniwala” sa konteksto.
- source_word: לַדְּבָרִים
  choice: sa mga balita
  rationale: Bagaman literal na “mga salita/bagay,” tumutukoy ito rito sa mga ulat tungkol kay Solomon; malinaw at natural sa Tagalog ang “mga balita.”
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: nakita ito ng sarili kong mga mata
  rationale: Pinananatili nito ang idyomatikong diin sa personal at tuwirang pagkakita.
- source_word: וְהִנֵּה
  choice: At talaga nga
  rationale: Ipinahahayag nito ang pagkagulat at matinding pagpapatunay ng הִנֵּה sa natural na modernong Tagalog.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: ni kalahati ay hindi naibalita sa akin
  rationale: Pinananatili ang mariing understatement ng Hebreo at maayos itong basahin sa marangal na Tagalog.
- source_word: הוֹסַפְתָּ
  choice: Nahigitan mo
  rationale: Sa paghahambing na may אֶל, ang יסף ay nagpapahiwatig ng paglampas o paghigit, hindi lamang pagdaragdag.
- source_word: חָכְמָה וָטוֹב
  choice: sa karunungan at kasaganaan
  rationale: Malinaw ang חָכְמָה bilang karunungan; ang טוֹב sa kontekstong ito ay tumutukoy sa mabuting kalagayan o kasaganaan, na maaaring sumaklaw sa kayamanan.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: ang balitang narinig ko
  rationale: Ang שְׁמוּעָה ay ulat o balitang narinig; neutral at angkop sa konteksto ang “balita.”
