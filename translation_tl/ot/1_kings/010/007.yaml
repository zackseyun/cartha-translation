revisions:
- from: Ngunit hindi ako naniwala sa mga balita hanggang sa dumating ako at nakita ito ng sarili kong mga mata. At talaga nga, ni kalahati ay hindi naibalita sa akin. Nahigitan mo sa karunungan at kasaganaan ang balitang narinig ko.[a]
  to: Ngunit hindi ako naniwala sa mga balita hanggang sa dumating ako at nakita ito ng sarili kong mga mata. Tunay nga, hindi man lang sinabi sa akin ang kalahati. Higit na malaki ang iyong karunungan at kasaganaan kaysa sa balitang narinig ko.[a]
  rationale: Inayos ang paghahambing sa huling pangungusap upang malinaw na ang karunungan at kasaganaan ni Solomon ang higit kaysa sa ulat. Pinalitan din ang hindi gaanong likas na passive na “naibalita” ng “sinabi,” habang pinananatili ang idiomatikong understatement na hindi man lang kalahati ang naipahayag sa reyna.
