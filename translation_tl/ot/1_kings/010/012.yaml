  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: tl
  text: Ginawang mga tukod[b] ng hari ang kahoy na almug[a] para sa bahay ni Yahweh at sa bahay ng hari. Ginawa rin niya itong mga lira at alpa para sa mga mang-aawit. Hindi pa kailanman dumating ang gayong kahoy na almug, ni wala pang nakitang tulad nito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahoy na algum.” Lumilitaw ang kaugnay na katawagan na may ibang baybay sa kaparehong salaysay at tradisyon ng teksto.
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang salitang Hebreo na isinaling “mga tukod.” Maaari rin itong tumukoy sa mga bahaging pang-arkitektura gaya ng mga hagdan o rehas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: kahoy na almug
  rationale: Hindi tiyak ang makabagong botanikal na pagkakakilanlan ng mamahaling inangkat na kahoy, kaya pinanatili ang transliterasyong “almug” ng anyong nasa tekstong Hebreo sa halip na manghula ng uri ng puno.
- source_word: מִסְעָד
  choice: mga tukod
  rationale: Bihira at hindi tiyak ang pangngalan. Ang “mga tukod” ay maingat na katawagang pang-arkitektura na hindi labis na nagpapasiya kung ang tinutukoy ay mga hagdan, rehas, o ibang estruktura.
- source_word: לְבֵית יְהוָה
  choice: para sa bahay ni Yahweh
  rationale: Pinananatili ang literal na idyomang “bahay” at ang pagkakapantay nito sa kasunod na “bahay ng hari,” habang malinaw pa rin ang gamit sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin ang banal na pangalang nasa tekstong Hebreo sa karaniwang transliterasyong “Yahweh.”
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: at sa bahay ng hari
  rationale: Pinananatili ang parallel na pananalita ng Hebreo sa “bahay ni Yahweh”; ang “palasyo” ay posible ngunit mas interpretatibo.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: mga lira at alpa
  rationale: Gumagamit ng dalawang magkaibang katawagan upang mapanatili ang pagkakaiba ng dalawang instrumentong de-kuwerdas, kahit hindi ganap na tiyak ang eksaktong anyo ng mga ito.
- source_word: לַשָּׁרִים
  choice: para sa mga mang-aawit
  rationale: Tuwirang ipinahahayag ng anyo mula sa pandiwang שׁיר ang mga taong umaawit, hindi lamang mga musikero sa pangkalahatan.
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: Hindi pa kailanman dumarating ang gayong kahoy na almug
  rationale: Likas na Filipino itong pagpapahayag sa diwa ng Hebreo na walang gayong kahoy na dumating noon; hindi idinagdag kung sino ang nagdala o saan eksaktong dinala.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: at wala pang nakikitang tulad nito hanggang sa araw na ito
  rationale: Pinananatili ang nagpapatuloy na pananaw ng tagapagsalaysay at ginagawang malinaw sa Filipino ang ipinahihiwatig na paghahambing.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang katangiang ito sa halip na palitan ng titulo.
- issue: Pagpapakahulugan sa בֵית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang “bahay” ang tuwirang kahulugan at pinananatili nito ang sadyang parallel sa “bahay ng hari”; hindi kailangan ng talata na lutasin ang idyoma sa mas tiyak na “templo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang parallel na “bahay ni Yahweh” at “bahay ng hari,” gayundin ang di-katiyakan ng uri ng kahoy at ng bahaging pang-arkitektura sa pamamagitan ng mga talababa.
