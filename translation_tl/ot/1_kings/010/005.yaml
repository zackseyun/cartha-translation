  verdict: revise
  source_fidelity: 'Ang salin ay tapat sa talaan ng mga bagay na namangha ang reyna: pagkain sa hapag, kaayusan ng pagkakaupo ng mga lingkod, mga tagapaglingkod at kanilang tungkulin, kasuotan, mga tagapaghain ng inumin, at handog na sinusunog. Pinananatili rin nito ang Masoretikong pangunahing pagbasa ng עֹלָתוֹ at ang idyomatikong pagkamangha sa huling sugnay. Ang talababa ay wastong naghaharap ng tunay na alternatibong pagbasa na may kaugnayan sa pag-akyat.'
  naturalness: May dalawang bahaging maaaring gawing higit na natural nang hindi lumalayo sa Hebreo. Ang “pagkakatayo ng kanyang mga tagapaglingkod” ay mas madaling maunawaang pisikal na pagtayo kaysa sa kanilang nakatalagang paglilingkod o katayuan. Ang “handog na sinusunog na inihandog niya” ay paulit-ulit sa Tagalog; mas natural ang “handog na sinusunog na iniaalay niya.”
  terminology: Ang “Yahweh,” “bahay,” “mga lingkod,” “mga kasuotan,” at “mga tagapaghain ng inumin” ay angkop sa modernong Filipino Tagalog at sa marangal na rehistro. Ang “handog na sinusunog” ay malinaw at tapat na katumbas ng עֹלָה.
  issues:
  - severity: medium
    issue: Ang “pagkakatayo ng kanyang mga tagapaglingkod” ay maaaring mangahulugang nakatayo lamang sila.
    rationale: Ang מַעֲמַד ay maaaring tumukoy sa kanilang katayuan, puwesto, o paglilingkod sa korte. Sa kontekstong ito, ang “paglilingkod” ay mas natural at hindi nagdadagdag ng kahulugang pisikal na pagtayo.
  - severity: low
    issue: Paulit-ulit ang “handog na sinusunog na inihandog niya.”
    rationale: Bagaman nasasalamin nito ang anyo ng Hebreo, hindi kailangan ang pag-uulit sa Tagalog. Ang “na iniaalay niya” ay nananatiling tapat sa pandiwang יַעֲלֶה at mas matatas pakinggan.
