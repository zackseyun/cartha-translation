  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: tl
  text: ang mga pagkaing nasa kanyang hapag, ang kaayusan ng pagkakaupo ng kanyang mga lingkod, ang paglilingkod ng kanyang mga tagapaglingkod, ang kanilang mga kasuotan, ang kanyang mga tagapaghain ng inumin, at ang kanyang handog na sinusunog na iniaalay niya sa bahay ni Yahweh[a]—nawalan siya ng hininga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang pag-akyat patungo sa bahay ni Yahweh,” na maaaring tumukoy sa hagdanan o sa prusisyong dinaanan niya paakyat.
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: ang mga pagkaing nasa kanyang hapag
  rationale: Tuwirang inilalarawan ang pagkaing inihahain sa maharlikang hapag, sa natural at marangal na modernong Tagalog.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: ang kaayusan ng pagkakaupo ng kanyang mga lingkod
  rationale: Maaaring tumukoy ang מוֹשָׁב sa pag-upo, upuan, o pagkakaayos. Sa talaan ng korte, malinaw na ipinahihiwatig ng parirala ang maayos na pagkakalugar ng mga lingkod.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: ang pagkakatayo ng kanyang mga tagapaglingkod
  rationale: Pinananatili ang konkretong larawan ng מַעֲמָד bilang pagtayo o nakatalagang puwesto at ikinakaiba ang mga opisyal na tagapaglingkod sa naunang mas malawak na pangkat ng mga lingkod.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: ang kanilang mga kasuotan
  rationale: Ang 'mga kasuotan' ay malinaw, marangal, at angkop sa pormal na ayos ng korte.
- source_word: מַשְׁקָיו
  choice: ang kanyang mga tagapaghain ng inumin
  rationale: Sa kontekstong maharlika, malamang na tumutukoy ito sa mga tauhang naghahain ng inumin, hindi lamang sa mga inumin mismo.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: ang kanyang handog na sinusunog na inihandog niya sa bahay ni Yahweh
  rationale: Sinusunod ng pangunahing teksto ang Masoretikong pagbasa na עֹלָה, 'handog na sinusunog,' habang inilalagay sa talababa ang tunay na alternatibong pagbasa na 'pag-akyat.'
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng 'bahay' ang Hebreong idyoma at ng 'Yahweh' ang personal na pangalang banal na nasa teksto.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: nawalan siya ng hininga
  rationale: Natural na idyomang Tagalog ito na nananatiling malapit sa konkretong larawan ng רוּחַ bilang hininga at naghahayag ng matinding pagkamangha nang hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa pinagmulan; ang 'Yahweh' ay tuwirang transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng עֹלָתוֹ sa hulihan ng talaan
  choice: ang kanyang handog na sinusunog
  alternative: ang kanyang pag-akyat; ang hagdanan o prusisyong dinaanan niya paakyat
  rationale: Sinusuportahan ng Masoretikong patinig ang 'handog na sinusunog,' ngunit pinahihintulutan ng mga katinig at ng sinaunang tradisyon ng teksto ang pagbasa na may kaugnayan sa pag-akyat. Pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'hapag,' 'mga lingkod,' at 'mga kasuotan' upang mapanatili ang pormal na kapaligiran ng korte nang hindi nagiging lipas o teknikal. Ang talababa [a] ay inilagay kaagad pagkatapos ng buong pariralang pinagtatalunan.
