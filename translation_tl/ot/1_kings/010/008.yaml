translation:
  language: tl
  text: Mapalad ang mga lalaking tauhan mo! Mapalad ang mga lingkod mong ito, na laging nakatayo sa iyong harapan at nakikinig sa iyong karunungan!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ipinahahayag nito ang kahanga-hanga at kanais-nais na kalagayan ng mga tinutukoy; natural at marangal sa Filipino ang “Mapalad” at angkop sa estilong pahayag ng pagpapala.
- source_word: אֲנָשֶׁיךָ
  choice: iyong mga tauhan
  rationale: Sa konteksto ng maharlikang hukuman, tumutukoy ito sa mga lalaking kabilang sa sambahayan o pangkat ng hari. Ang “mga tauhan” ay natural sa Filipino at hindi pinapalawak tungo sa lahat ng nasasakupan.
- source_word: עֲבָדֶיךָ
  choice: mga lingkod mo
  rationale: Maaaring mangahulugang alipin o lingkod ang עֶבֶד, ngunit sa konteksto ng korte ay ang paglilingkod sa hari ang diin; ang “lingkod” ang pinakaangkop at marangal na katumbas.
- source_word: אֵלֶּה
  choice: mga ... ito
  rationale: Pinananatili ang malapitang demonstratibong diwa ng Hebreong “ito,” na tumutukoy sa mga lingkod na naroroon.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: na nakatayo sa iyong harapan
  rationale: Pinananatili ang kongkretong larawan ng pagtayo sa harap ng hari, na sa konteksto ay nagpapahiwatig din ng palagiang pagdalo at paglilingkod.
- source_word: תָּמִיד
  choice: laging
  rationale: Natural itong nagpapahayag ng tuloy-tuloy o regular na pagdalo nang hindi nagiging mabigat ang pangungusap.
- source_word: הַשֹּׁמְעִים
  choice: at nakikinig
  rationale: 'Sa kontekstong ito, higit sa basta pagkarinig ang ipinahihiwatig: nasa harap sila ng hari upang pakinggan ang kaniyang karunungan. Ang “nakikinig” ay natural na salin ng aktibong pakikinig nang hindi nagdaragdag ng bagong nilalaman.'
- source_word: חָכְמָתֶךָ
  choice: iyong karunungan
  rationale: Tuwirang pinananatili ang bagay na naririnig ng mga lingkod, nang hindi dinaragdagan ng “mga salita” o “payo” na hindi hayag sa Hebreo.
