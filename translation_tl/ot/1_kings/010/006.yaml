  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הָיָ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: tl
  text: Sinabi niya sa hari, “Totoo ang balitang narinig ko sa sarili kong lupain tungkol sa mga sinabi mo[a] at sa iyong karunungan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gawain mo” o “mga bagay tungkol sa iyo.” Ang Hebreong parirala ay maaaring tumukoy nang mas malawak sa mga bagay na may kinalaman sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang payak na “Sinabi niya” nang hindi kailangang gawing lantad ang pang-ugnay.
- source_word: אֶל־הַמֶּלֶךְ
  choice: sa hari
  rationale: Tuwirang salin ng pariralang may pang-ukol at tiyak na pangngalan.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Totoo ang balita
  rationale: Predikatibo ang אֱמֶת, at sa konteksto ang דָּבָר ay tumutukoy sa ulat na narinig ng reyna; malinaw at likas sa Tagalog ang “Totoo ang balita.”
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: na narinig ko
  rationale: Likas na Tagalog para sa karaniwang sugnay na panuri.
- source_word: בְּאַרְצִי
  choice: sa sarili kong lupain
  rationale: Pinananatili ng “lupain” ang tuwirang diwa ng אֶרֶץ, at likas na ipinahahayag ng “sarili kong” ang hulaping unang panauhan.
- source_word: עַל־דְּבָרֶיךָ
  choice: tungkol sa mga sinabi mo
  rationale: Pinananatili nito ang pangunahing diwa ng דְּבָרִים bilang “mga salita/sinabi,” habang ang talababa ay kumikilala sa mas malawak na kahulugang “mga gawain” o “mga bagay tungkol sa iyo.”
- source_word: וְעַל־חָכְמָתֶךָ
  choice: at sa iyong karunungan
  rationale: Tuwiran at malinaw na salin na pinananatili ang pagkakaugnay nito sa naunang parirala.
