  source_fidelity: Tumpak na naihahatid ng salin ang predikatibong pahayag na ang balitang narinig ng reyna sa kanyang lupain tungkol sa mga sinabi ng hari at sa kanyang karunungan ay totoo. Ang hindi pagsasalin nang lantad sa waw-consecutive bilang “Pagkatapos” o “At” ay katanggap-tanggap na natural na daloy sa Tagalog at hindi nagbabago sa kahulugan.
