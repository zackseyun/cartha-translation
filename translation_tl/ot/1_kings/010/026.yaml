  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: tl
  text: Nagtipon si Solomon ng mga karwahe at mga mangangabayo[a]. Mayroon siyang 1,400 karwahe at 12,000 mangangabayo. Inilagay niya ang mga ito sa mga lungsod para sa mga karwahe at sa piling ng hari sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kawal na nakasakay sa kabayo”; ang Hebreo ay literal na tumutukoy sa mga nakasakay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Nagtipon
  rationale: Ipinahihiwatig ng אסף ang pag-iipon o pagtitipon ng mga kagamitang at tauhang militar; natural at hindi labis na tiyak ang “nagtipon.”
- source_word: רֶכֶב
  choice: mga karwahe
  rationale: Bagaman kolektibo ang anyong isahan sa Hebreo, malinaw na mga karwaheng militar ang tinutukoy, lalo na dahil binibilang ang mga ito sa kasunod na sugnay.
- source_word: פָרָשִׁים
  choice: mga mangangabayo
  rationale: Ang salita ay tumutukoy sa mga nakasakay o rider, hindi lamang sa mga kabayo; pinananatili ng “mangangabayo” ang kongkretong kahulugan nang hindi ipinapalagay ang mas teknikal na organisasyong kabalyerya.
- source_word: וַיְהִי לוֹ
  choice: Mayroon siyang
  rationale: Karaniwang idyoma ito ng pag-aari, kaya malinaw at natural sa Filipino ang “mayroon siyang.”
- source_word: וַיַּנְחֵם
  choice: Inilagay niya
  rationale: Ang Hiphil ng נוח ay maaaring mangahulugang ilagay o italaga sa isang lugar. Pinananatili ng “inilagay” ang lawak ng kahulugan at hindi labis na binibigyang-diin ang pormal na pagdedestino.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: sa mga lungsod para sa mga karwahe
  rationale: Ipinapakita nito na ang mga lungsod ay itinalaga o iniugnay sa puwersang pangkarwahe; mas malinaw sa karaniwang mambabasa kaysa sa literal ngunit di-likas na “mga lungsod ng karwahe.”
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: at sa piling ng hari sa Jerusalem
  rationale: Tuwirang pinananatili ang Hebreong pagtukoy sa mga puwersang naroon kasama ng hari, nang hindi tahasang pinapalitan ang “hari” ng “Solomon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “karwahe” at “mangangabayo” bilang madaling maunawaang mga terminong militar, at hinati sa tatlong pangungusap ang mahabang Hebreong pangungusap para sa likas na daloy.
