translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumating kay Solomon” upang hindi dagdagan ang teksto ng di-tiyak na tagapagdala o uri ng kita; pinanatili rin ang sinaunang yunit na “talento” at ipinaliwanag ito sa talababa.
