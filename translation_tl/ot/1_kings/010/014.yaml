base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: tl
  text: Ang bigat ng gintong dumating kay Solomon sa loob ng isang taon ay animnaraan at animnapu't anim na talentong ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talento ay isang malaking yunit ng timbang noong sinaunang panahon. Iniulat ng talata ang taunang dami ayon sa sinaunang panukat sa halip na tumbasan ito ng makabagong yunit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinakikilala ng anyong pandiwa ang kasunod na salaysay; hindi na kailangan ang artipisyal na panimulang “At nangyari” sa natural na makabagong Tagalog.
- source_word: מִשְׁקַל
  choice: bigat
  rationale: Tuwirang tumutukoy ang pangngalan sa timbang o sukat ayon sa bigat.
- source_word: הַזָּהָב ... זָהָב
  choice: ng gintong ... na talentong ginto
  rationale: Pinananatili ang unang pagtukoy sa kalakal at ang ikalawang paglilinaw na ginto ang sinusukat sa mga talento.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: na dumating kay Solomon
  rationale: Pinananatili ang payak na diwa ng בוא na may ל, nang hindi ipinapalagay kung sino ang nagdala o kung ano ang tiyak na pinagmulan nito.
- source_word: בְּשָׁנָה אֶחָת
  choice: sa loob ng isang taon
  rationale: Malinaw na ipinahahayag ang kabuuang dami sa takbo ng isang taon at nananatiling malapit sa Hebreo.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: animnaraan at animnapu't anim
  rationale: Likas at tuwirang anyo ng bilang sa makabagong Tagalog.
- source_word: כִּכַּר
  choice: talento
  rationale: Ang talento ay sinaunang malaking yunit ng timbang; pinananatili ang tradisyonal na katawagan sa halip na magbigay ng di-tiyak na modernong katumbas.
