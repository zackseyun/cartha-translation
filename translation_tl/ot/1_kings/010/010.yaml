  terminology: Ang “talento,” “mga batong mahalaga,” “reyna ng Sheba,” at “Haring Solomon” ay angkop. Pinanatili ang “talento” bilang sinaunang yunit ng timbang at ang kolektibong kahulugan ng mga terminong Hebreo para sa mabangong sangkap at mahalagang bato.
