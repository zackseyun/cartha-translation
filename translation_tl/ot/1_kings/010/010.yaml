base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: tl
  text: At ibinigay niya sa hari ang isang daan at dalawampung talento ng ginto,[a] napakaraming mabangong sangkap, at mga batong mahalaga. Hindi na muling dumating kailanman ang ganoong karaming mabangong sangkap na ibinigay ng reyna ng Sheba kay Haring Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “talento” ay sinaunang yunit ng timbang; nag-iiba ang eksaktong katumbas nito.
    reason: ancient_measure
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: At ibinigay niya
  rationale: Ang wayyiqtol ng נתן ay nagpapatuloy sa salaysay; natural sa Tagalog ang “At ibinigay niya” nang hindi labis na binibigyang-diin ang pagkakasunod sa oras.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 120 talento ng ginto
  rationale: Ang כִּכָּר ay sinaunang yunit ng timbang. Pinanatili ang nakaugaliang “talento” sa halip na magbigay ng di-tiyak na modernong katumbas.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: napakaraming sangkap na mabango
  rationale: Ang בְשָׂמִים ay tumutukoy sa mga aromatikong rekado, espesya, o balsamong kalakal; ipinahahayag ng “napakarami” ang mariing dami ng הַרְבֵּה מְאֹד.
- source_word: וְאֶבֶן יְקָרָה
  choice: at mga batong mahalaga
  rationale: Bagaman isahan ang אֶבֶן, maaari itong gamitin nang kolektibo sa Hebreo; ang maramihang anyo ay natural sa Tagalog sa talaan ng mga kaloob.
- source_word: לֹא בָא ... עוֹד
  choice: Kailanma’y hindi na muling dumating
  rationale: Ang בוא ay “dumating” o “dinala,” at kasama ng negasyon at עוֹד ay nagpapahayag na hindi na ito naulit.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: ang gayong karaming sangkap na mabango
  rationale: Isahan ang בֹּשֶׂם sa Hebreo ngunit malamang na kolektibo ang gamit; isinama ang diwa ng לָרֹב bilang pambihirang dami.
- source_word: מַלְכַּת שְׁבָא
  choice: reyna ng Sheba
  rationale: Tuwirang katawagan sa babaeng pinuno ng Sheba; pinanatili ang nakaugaliang anyo ng pangalang pantangi.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: kay Haring Solomon
  rationale: Natural sa modernong Tagalog ang pamagat bago ang pangalan.
