  to: At ibinigay niya sa hari ang isang daan at dalawampung talento ng ginto,[a] napakaraming mabangong sangkap, at mga batong mahalaga. Hindi na muling dumating kailanman ang ganoong karaming mabangong sangkap na ibinigay ng reyna ng Sheba kay Haring Solomon.
  rationale: Inayos ang ayos ng mga salita para maging likas at malinaw ang Filipino, lalo na sa pangwakas na paghahambing, nang hindi binabago ang kolektibong diwa ng Hebreong termino para sa mabangong sangkap o ang diin na hindi na ito naulit kailanman.
