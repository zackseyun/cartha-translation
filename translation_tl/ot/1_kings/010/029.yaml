translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga terminong pangkalakalan na “inaangkat” at “iniluluwas” upang ihatid ang diwa ng mga pandiwang kilos sa konteksto, habang inilagay sa mga talababa ang literal na anyo at ang tunay na kalabuan ng panghalip. Pinanatili ang “Aram” bilang pangalang pantangi.
