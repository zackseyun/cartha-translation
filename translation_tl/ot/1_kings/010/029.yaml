base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: tl
  text: Ang isang karwahe ay inaangkat[a] mula sa Ehipto sa halagang animnaraang siklong pilak[b], at ang isang kabayo naman sa halagang sandaan at limampu. Gayundin, iniluluwas nila ang mga ito sa lahat ng hari ng mga Heteo at sa mga hari ng Aram sa pamamagitan nila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, ang mga pandiwa ay “umahon” at “lumabas mula sa Ehipto.” Sa kontekstong ito ng kalakalan, tumutukoy ang mga ito sa pag-aangkat.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “animnaraang pilak.” Ang “siklo” ang ipinahihiwatig na yunit ng timbang at halaga.'
    reason: implicit_unit
  - marker: c
    text: 'Literal: “sa kanilang kamay,” isang idyoma na nangangahulugang sa pamamagitan nila o ng kanilang mga kinatawan. Hindi tahasang tinutukoy sa talatang ito kung sino ang tinutukoy ng “nila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: ay inaangkat
  rationale: Ang dalawang pandiwa ay literal na tumutukoy sa pag-akyat at paglabas mula sa Ehipto, ngunit sa konteksto ng kalakalan ay likas na ipinahahayag sa Filipino bilang pag-aangkat. Pinananatili sa talababa ang literal na kilos.
- source_word: מֶרְכָּבָה
  choice: isang karwahe
  rationale: Isahan ang anyo at tumutukoy sa presyo ng bawat yunit; ang “karwahe” ay natural at sapat na tiyak sa kontekstong panghari at pangkalakalan.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: sa halagang animnaraang siklong pilak
  rationale: Literal na “sa animnaraang pilak.” Idinagdag ang “siklo” bilang ipinahihiwatig na yunit ng timbang at halaga, habang pinanatili ang tahasang pagbanggit sa pilak.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: at ang isang kabayo naman sa halagang sandaan at limampu
  rationale: Hindi nilimitahan sa “kabayong pandigma” sapagkat “kabayo” lamang ang nasa Hebreo. Natural sa Filipino ang ayos na sandaan at limampu.
- source_word: וְכֵן
  choice: Gayundin
  rationale: Ipinakikita nito ang pagpapatuloy mula sa pag-aangkat at pagpepresyo tungo sa kaparehong gawaing pangkalakalan para sa ibang mga hari.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: sa lahat ng hari ng mga Heteo
  rationale: Pinananatili ang katawagang etniko-politikal at ang lahat ng tumatanggap na hari.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: at sa mga hari ng Aram
  rationale: Ginamit ang pangalang Hebreo na Aram sa halip na ang tradisyonal ngunit mas mapagpaliwanag na “Siria.”
- source_word: בְּיָדָם
  choice: sa pamamagitan nila
  rationale: Ang literal na “sa kanilang kamay” ay isang idyoma ng ahensiya. Ang “sa pamamagitan nila” ay malinaw sa modernong Filipino ngunit hindi tinutukoy nang higit sa Hebreo kung sino mismo ang tinutukoy ng panghalip.
- source_word: יֹצִאוּ
  choice: iniluluwas nila ang mga ito
  rationale: Ang causative na anyo ng יצא ay “ipinalalabas.” Sa konteksto ng kalakalan, “iniluluwas” ang natural na katumbas at ipinahahayag ang nakagawiang muling pagbebenta sa ibang mga kaharian.
