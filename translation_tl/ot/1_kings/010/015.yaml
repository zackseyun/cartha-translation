base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: tl
  text: Bukod pa sa mga nalikom mula sa mga naglalakbay na mangangalakal[a], mula sa kalakalan ng mga mangangalakal, mula sa lahat ng hari ng Arabia[b], at mula sa mga gobernador ng lupain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga taong naglalakbay.” Mahirap unawain ang pariralang Hebreo at maaaring tumukoy nang mas pangkalahatan sa mga naglalakbay na mangangalakal.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa lahat ng hari ng mga pinaghalong pangkat.” Maaaring taglayin ng salitang Hebreo ang kahulugang iyon sa ilang konteksto, bagaman mas angkop dito ang “Arabia.”
    reason: alternative_reading
  - marker: c
    text: O “mga panlalawigang gobernador” o “mga satrapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Ipinahihiwatig nito na ang mga sumusunod ay dagdag na pinagmulan bukod sa halagang binanggit sa naunang talata.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: sa galing sa mga naglalakbay na mangangalakal
  rationale: Mahirap ang pariralang Hebreo. Sa kontekstong pangkalakalan, malamang na tumutukoy ito sa mga taong naglalakbay upang mangalakal. Ang “galing sa” ay likas na nagpapakita na pinag-uusapan ang pinagmulan ng kita nang hindi tahasang nagdaragdag ng salitang “buwis.”
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: sa kalakalan ng mga mangangalakal
  rationale: Ang מִסְחַר ay kalakalan o komersiyal na gawain, at ang רֹכְלִים ay mga taong nangangalakal. Malinaw at natural sa modernong Filipino ang pariralang ito.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: sa lahat ng hari ng Arabia
  rationale: Sa heopolitikal na talaang ito, malamang na tumutukoy ang עֶרֶב sa Arabia o sa mga Arabianong bayan. Pinananatili sa talababa ang ibang posibleng pakahulugan.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: sa mga gobernador ng lupain
  rationale: Ang פַחוֹת ay mga panrehiyon o panlalawigang opisyal na nasa ilalim ng mas mataas na kapangyarihan. Ang “mga gobernador” ay malinaw at hindi labis na tiyak sa isang partikular na panahong historikal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal ang rehistro. Pinanatili ang ayos ng mga dagdag na pinagmulan ng kita at iniwasang idagdag sa pangunahing teksto ang “buwis,” sapagkat hindi ito tahasang nasa Hebreo. Ang mga tunay na leksikal na kalabuan ay inilagay sa mga talababa.
