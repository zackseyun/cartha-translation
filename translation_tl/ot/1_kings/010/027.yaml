base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: tl
  text: Ginawa ng hari na maging kasingkaraniwan ng mga bato ang pilak sa Jerusalem, at ginawa niyang kasingdami ng mga punong sikomoro[a] na nasa Shephelah[b] ang mga sedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sikomoro” rito ay punong sikomoro-igos.
    reason: lexical_alternative
  - marker: b
    text: O “mababang lupain.” Ang Shephelah ay ang rehiyong maburol na paanan ng kabundukan sa Judea, sa pagitan ng bulubunduking lupain at ng kapatagang baybayin.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: Ginawa ... na kasindami / ginawa niyang kasindami
  rationale: Bagaman karaniwang nangangahulugang “nagbigay” o “naglagay” ang נתן, ipinahihiwatig ng dalawang paghahambing dito na pinasagana ng hari ang pilak at mga sedro. Likas sa Tagalog ang “ginawa ... na kasindami” at pinananatili nito ang causative na diwa.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalang “ang hari” ang nasa Hebreo. Si Solomon ang tinutukoy sa konteksto, ngunit hindi siya tahasang pinangalanan sa talata.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Ang כֶּסֶף ay pilak bilang mahalagang metal o kalakal; malinaw at natural dito ang “ang pilak.”
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin ng pangalan ng lugar.
- source_word: כָּאֲבָנִים
  choice: kasindami ng mga bato
  rationale: Ang prefiks na כ־ ay naghahayag ng paghahambing. Sa konteksto ng לָרֹב at ng paralel na sugnay, dami o kasaganaan ang puntong inihahambing, kaya malinaw sa Tagalog ang “kasindami ng mga bato.”
- source_word: הָאֲרָזִים
  choice: ang mga sedro
  rationale: Pinananatili ng “mga sedro” ang maramihang pangngalan sa Hebreo nang hindi ipinapalagay kung mga puno o trosong sedro ang tiyak na tinutukoy.
- source_word: כַּשִּׁקְמִים
  choice: kasindami ng mga punong sikomoro
  rationale: Ang שִׁקְמִים ay mga punong sycamore fig. Ginamit ang “sikomoro” bilang pangalan ng puno, na may talababa upang linawin ang uri.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: sa Shephelah
  rationale: Ang שְׁפֵלָה ay maaaring karaniwang mangahulugang mababang lupain ngunit dito ay tumutukoy sa heograpikong rehiyon ng Judea. Pinanatili ang pangalang “Shephelah” at ipinaliwanag sa talababa.
- source_word: לָרֹב
  choice: kasindami
  rationale: Ipinahihiwatig ng parirala ang napakaraming bilang o kasaganaan. Isinama ang diwa nito sa natural na paghahambing na “kasindami.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “hari” sa halip na idagdag ang pangalang Solomon, at ang “Shephelah” bilang tiyak na katawagang heograpiko. Inayos ang ikalawang sugnay sa natural na ayos ng Tagalog habang pinananatili ang paralel na paghahambing ng dami.
