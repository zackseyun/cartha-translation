  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: tl
  text: Dumating siya sa Jerusalem na may napakalaking pangkat na kasama niya,[a] at may mga kamelyong may dalang mababangong sangkap, napakaraming ginto, at mahahalagang bato. Lumapit siya kay Solomon at nakipag-usap sa kanya tungkol sa lahat ng nasa puso niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na may napakalaking pangkat ng mga kasama” o, mas literal, “na may napakalaking yaman/lakas.” Ang salitang Hebreo na חַיִל ay maaaring tumukoy sa yaman, lakas, hukbo, o malaking pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: na may napakalaking pangkat ng mga kasama
  rationale: 'Malawak ang kahulugan ng חַיִל: lakas, kayamanan, hukbo, o malaking pangkat. Sa konteksto ng paglalakbay ng isang reyna, natural na tumutukoy ito sa kahanga-hangang pangkat na sumama sa kanya, habang pinananatili sa talababa ang tunay na lawak ng salitang Hebreo.'
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: mga kamelyong may dalang mga sangkap na mabango
  rationale: Tuwirang inilalarawan ng participle ang mga kamelyong nagdadala ng בְּשָׂמִים. Ang 'mga sangkap na mabango' ay mas malinaw sa karaniwang modernong Tagalog kaysa 'mga espesya,' at hindi nililimitahan ang katawagan sa pampalasa lamang.
- source_word: וְזָהָב רַב מְאֹד
  choice: napakaraming ginto
  rationale: Likas at mariing ipinahahayag nito ang napakalaking dami na tinutukoy ng רַב מְאֹד.
- source_word: וְאֶבֶן יְקָרָה
  choice: mahahalagang bato
  rationale: Bagaman nasa anyong isahan ang אֶבֶן, maaari itong gamitin bilang kolektibo sa Hebreo; natural sa Tagalog ang maramihan sa listahang ito.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Lumapit siya kay Solomon
  rationale: Ang ikalawang וַתָּבֹא ay bagong yugto matapos ang pagdating sa Jerusalem. Iniiwasan ng 'lumapit' ang alanganing pag-uulit ng 'dumating' habang pinananatili ang kilos patungo kay Solomon.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: at sinabi sa kanya
  rationale: Ang דּבר na may אֶל ay maaaring 'nagsalita sa/kay.' Dahil kasunod ang nilalaman ng sinabi, natural sa Tagalog ang 'sinabi sa kanya' nang hindi ipinapalagay na ganap na magkatumbas ang palitan.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: ang lahat ng nasa puso niya
  rationale: Pinananatili nito ang konkretong idyoma ng Hebreo at ang posibleng saklaw nito sa mga iniisip, tanong, at alalahanin, sa halip na paliitin ito sa 'nasa isip.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang idyomang 'nasa puso niya' at ipinaliwanag sa talababa ang sadyang malawak na kahulugan ng חַיִל.
