  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: tl
  text: Purihin nawa si Yahweh, ang iyong Diyos, na nalugod sa iyo upang iluklok ka sa trono ng Israel. Dahil sa pag-ibig ni Yahweh sa Israel magpakailanman,[a] ginawa ka niyang hari upang pairalin ang katarungan at katuwiran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Dahil mahal ni Yahweh ang Israel magpakailanman.” Sa Hebreo, literal itong “dahil sa pag-ibig ni Yahweh sa Israel magpakailanman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי יְהוָה אֱלֹהֶיךָ בָּרוּךְ
  choice: Purihin si Yahweh na iyong Diyos
  rationale: Ang jussive na יְהִי kasama ng בָּרוּךְ ay pormula ng pagpupuri o pagpapala. Mas natural at marangal sa modernong Tagalog ang “Purihin si…” kaysa sa literal ngunit di-gaanong likas na “Pagpalain nawa si…,” lalo na kapag Diyos ang tinutukoy.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: na nalugod sa iyo
  rationale: Ipinapahayag ng חפץ ב ang kasiyahan at pabor sa isang tao. Pinananatili ng “nalugod sa iyo” ang mainit na pagkiling nang hindi nagdaragdag ng kahulugang wala sa teksto.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: at iniluklok ka sa trono ng Israel
  rationale: Sa kontekstong maharlika, ang נתן על כסא ay tumutukoy sa paglalagay o pagtatalaga sa trono. Ang “iniluklok” ay natural na Filipino at malinaw na naghahatid ng larawang panghari.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: Dahil sa walang-hanggang pag-ibig ni Yahweh sa Israel
  rationale: Ang בְּ ay nauunawaang sanhi, at ang אַהֲבַת ay pangngalan na “pag-ibig.” Pinananatili ng salin ang nominal na anyo at ang saklaw ng לְעֹלָם, nang hindi ipinipilit kung ang diin ay sa tagal ng pag-ibig o sa namamalaging katapatan nito.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: ginawa ka niyang hari
  rationale: Ang שׂים + ל ay nagpapahayag ng pagtatalaga. Ang “ginawa ka niyang hari” ay tuwiran, natural, at hindi burukratiko.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: upang pairalin ang katarungan at katuwiran
  rationale: Sa konteksto ng pamamahala, ang עשה kasama ng מִשְׁפָּט at צְדָקָה ay higit sa simpleng “gawin”; tumutukoy ito sa pagsasakatuparan ng makatarungan at matuwid na pamamahala. Ang “pairalin” ay malinaw at idiomatiko habang pinananatili ang dalawang magkaugnay ngunit magkaibang konsepto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya ginamit ang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng בְּאַהֲבַת יְהוָה at לְעֹלָם
  choice: Dahil sa walang-hanggang pag-ibig ni Yahweh sa Israel
  alternative: Dahil mahal ni Yahweh ang Israel magpakailanman
  rationale: Maaaring gawing pandiwa ang parirala sa natural na salin, ngunit pangngalang “pag-ibig” ang anyong Hebreo. Pinili ang nominal na salin upang mapanatili ang porma at ang posibleng diin sa namamalaging pag-ibig bilang dahilan ng pagkakahirang kay Solomon.
- issue: Ugnayan ng מִשְׁפָּט at צְדָקָה
  choice: katarungan at katuwiran
  alternative: makatarungang paghatol at paggawa ng tama
  rationale: Pinananatili ang tradisyonal ngunit malinaw na dalawang terminong etikal. Hindi pinagsama ang mga ito sa iisang konsepto, sapagkat may magkakaugnay ngunit hindi ganap na magkaparehong saklaw ang mga salitang Hebreo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “iniluklok” para sa malinaw na larawang maharlika at “pairalin” para sa tungkulin ng hari. Iniwasan ang sobrang literal na mga anyong hindi likas sa Tagalog, habang pinanatili ang banal na pangalang Yahweh at ang pagkakaiba ng katarungan at katuwiran.
