  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: tl
  text: Nang makita ng reyna ng Sheba ang buong karunungan ni Solomon at ang bahay na itinayo niya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang palasyong itinayo niya.” Sa kontekstong ito, ang salitang Hebreo para sa “bahay” ay maaaring tumukoy sa tirahang maharlika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nang makita
  rationale: Isinasagawa ng waw-consecutive ang pagsulong ng salaysay, ngunit dito ay nagsisimula rin ito ng sugnay na nagpapatuloy sa kasunod na talata; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Nang makita.”
- source_word: מַלְכַּת שְׁבָא
  choice: ang reyna ng Sheba
  rationale: Ang pariralang konstrakto ay tumutukoy sa babaeng pinuno ng Sheba; malinaw at natural sa modernong Tagalog ang “reyna ng Sheba.”
- source_word: אֵת
  choice: '[pananda ng tiyak na layon, hindi isinalin]'
  rationale: Panandang pambalarila ito para sa tiyak na tuwirang layon at walang hiwalay na katumbas na salita sa Tagalog.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: ang buong karunungan ni Solomon
  rationale: Ipinahahayag ng כָּל kasama ng konstraktong pangngalan ang kabuuan ng karunungan ni Solomon; natural sa Tagalog ang “buong karunungan ni Solomon.”
- source_word: וְהַבַּיִת
  choice: at ang bahay
  rationale: Literal na “bahay” ang בַּיִת. Sa kontekstong maharlika, maaaring tumukoy ito sa palasyo o tirahang maharlika, kaya pinanatili sa teksto ang mas lantad na kahulugan at inilagay sa talababa ang kontekstuwal na alternatibo.
- source_word: אֲשֶׁר בָּנָה
  choice: na ipinatayo niya
  rationale: Binabago ng sugnay na pasaklaw ang “bahay.” Ang causative na “ipinatayo” ay natural sa konteksto ng isang hari at hindi kinakailangang magpahiwatig na siya mismo ang gumawa ng pisikal na pagtatayo.
