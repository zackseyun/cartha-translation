base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: tl
  text: Ang pag-aangkat ng mga kabayong para kay Solomon ay mula sa Ehipto at Kue[a][b]. Kinukuha ng mga mangangalakal ng hari ang mga ito mula sa Kue kapalit ng halaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang salitang Hebreo na isinaling “Kue.” Maaaring pangalan ito ng isang lugar—malamang na Kue sa Cilicia—o karaniwang pangngalang nangangahulugang tulad ng “kawan” o “kalipunan.”
    reason: cultural_note
  - marker: b
    text: 'O, ayon sa ibang pagbasa sa mahirap na Hebreo: “at mula sa isang kawan; kinukuha ng mga mangangalakal ng hari ang isang kawan kapalit ng halaga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: inaangkat
  rationale: Sa konteksto ng kalakalan ng mga kabayo patungo kay Solomon, malinaw at natural na ipinahahayag ng pandiwang Filipino ang pag-aangkat, habang kinikilala na ang pangngalang Hebreo ay maaari ring tumukoy sa pinagmulan o paglabas.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: ang mga kabayong para kay Solomon
  rationale: Pinananatili ng “para kay Solomon” ang diwa ng Hebreong לִ at hindi labis na nililinaw kung pag-aari na niya ang mga ito o inilaan para sa kaniya.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Karaniwang modernong Tagalog na anyo ng pangalan ng lugar at ng pang-ukol na pinagmulan.
- source_word: וּמִקְוֵה
  choice: at sa Kue
  rationale: Itinuturing ang mahirap na salitang מקוה bilang pangalan ng lugar, malamang na Kue sa Cilicia, sapagkat ang heograpikong kahulugan ay nababagay bilang isa pang pinagmulan kasabay ng Ehipto. Inilalahad sa talababa ang alternatibong pagbasa.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: mga mangangalakal ng hari
  rationale: Natural at dignified na salin para sa mga komersiyal na ahente na naglilingkod sa hari.
- source_word: יִקְחוּ
  choice: kinukuha
  rationale: Sinasalamin ang literal na “kumuha” nang hindi idinaragdag na tahasang “binibili,” bagaman ipinahihiwatig ng pariralang may halaga ang transaksiyon.
- source_word: מִקְוֵה
  choice: mula sa Kue
  rationale: Pinananatiling pare-pareho ang heograpikong pagbasa sa ikalawang paglitaw ng salita, habang itinatala ang tunay na kawalang-katiyakan sa talababa.
- source_word: בִּמְחִיר
  choice: sa takdang halaga
  rationale: Ipinahahayag ang komersiyal na halaga. Ang “takdang” ay natural sa Filipino para sa halagang pinagkasunduan o itinakda, nang hindi nagbibigay ng tiyak na bilang.
