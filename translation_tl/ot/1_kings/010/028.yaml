translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “para kay Solomon” upang manatiling malapit sa Hebreong konstruksiyon at maiwasang gawing tiyak ang pagmamay-ari. Pinanatili sa teksto ang Kue bilang malamang na pangalan ng lugar, ngunit malinaw na iningatan sa mga talababa ang leksikal na kawalang-katiyakan.
