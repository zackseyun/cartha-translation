translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “trono” at “garing” bilang karaniwang tiyak na mga katawagan; iniwasan ang sobrang teknikal na wika. Inilagay ang tandang [a] sa pangunahing teksto ayon sa talababa.
