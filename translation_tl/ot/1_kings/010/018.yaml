translation:
  language: tl
  text: Pagkatapos, gumawa ang hari ng isang malaking trono na yari sa garing at pinatungan niya ito ng dalisay na ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinadalisay na ginto” o “pinong ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Pagkatapos, gumawa
  rationale: Ang wayyiqtol ay nagpapatuloy sa pagkakasunod-sunod ng salaysay; natural na ipinahahayag ito ng “Pagkatapos” sa modernong Tagalog.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalan ito na tumutukoy kay Solomon sa konteksto.
- source_word: כִּסֵּא
  choice: trono
  rationale: Sa kontekstong maharlika, mas tiyak ang “trono” kaysa pangkalahatang “upuan.”
- source_word: שֵׁן
  choice: yari sa garing
  rationale: Bagaman literal na “ngipin,” tumutukoy dito ang salita sa garing bilang materyales ng trono; nilinaw ng “yari sa” ang ugnayan.
- source_word: גָּדוֹל
  choice: maringal
  rationale: Sa paglalarawan ng tronong maharlika, ipinahahayag ng “maringal” ang kadakilaan at karangyaan; hindi nito nililimitahan ang diwa sa pisikal na laki lamang.
- source_word: וַיְצַפֵּהוּ
  choice: binalutan niya ito
  rationale: Ang pandiwang צפה ay nangangahulugang balutan o sapinan ng isang materyales; malinaw at natural ang parirala sa Tagalog.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katumbas ng materyales na binanggit.
- source_word: מוּפָז
  choice: dalisay
  rationale: Tumutukoy sa mataas na kalidad na ginto, maaaring pinadalisay o pino; natural at dignified ang “dalisay na ginto” habang pinananatili sa talababa ang leksikal na pagkakaiba.
