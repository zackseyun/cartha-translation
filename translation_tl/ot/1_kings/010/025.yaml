translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “ay nagdadala” upang maipakita ang nakaugalian at paulit-ulit na pagkilos, at iniwasan ang labis na teknikal o makalumang bokabularyo. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
