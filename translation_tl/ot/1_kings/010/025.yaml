base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: tl
  text: 'At ang bawat isa ay nagdadala ng kanyang kaloob[a]: mga kagamitang pilak, mga kagamitang ginto, mga kasuotan[b], mga sandata[c], mga mababangong sangkap, mga kabayo, at mga mula—taon-taon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang regalo” o “kanyang tributo.” Ang salitang Hebreo ay maaaring mangahulugang regalo, alay, o kaloob na inihaharap sa isang hari; ang “tributo” ay posible sa kontekstong maharlika.
    reason: lexical_alternative
  - marker: b
    text: O “mga balabal” o “mahahabang damit.”
    reason: lexical_alternative
  - marker: c
    text: O “mga baluti”; maaaring tumukoy ang salitang Hebreo sa kagamitang pandigma sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: ay nagdadala
  rationale: Ang participle kasama ng הֵמָּה ay nagpapahiwatig ng nakaugalian at paulit-ulit na pagkilos. Ang aspektong di-ganap ng Tagalog na “nagdadala” ay natural na naghahatid ng ganitong diwa.
- source_word: אִישׁ מִנְחָתוֹ
  choice: bawat isa sa kanila ... ng kanyang handog
  rationale: Distributibo ang אִישׁ, at ang מִנְחָה rito ay regalong inihaharap sa hari. Pinananatili ng “handog” ang saklaw na regalo, alay, o tributo nang hindi ipinapalagay na sapilitang buwis iyon.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: mga kagamitang pilak at ginto
  rationale: Malawak ang כְּלִי at maaaring tumukoy sa kagamitan, sisidlan, o iba pang bagay. Ang “mga kagamitang pilak at ginto” ay natural at hindi nililimitahan ang eksaktong uri ng mga bagay.
- source_word: שְׂלָמוֹת
  choice: mga kasuotan
  rationale: Tumutukoy ang salita sa mga damit, malamang ay panlabas na kasuotan. Ang “mga kasuotan” ay malinaw at dignified, habang inilalagay sa talababa ang mas tiyak na posibilidad.
- source_word: נֵשֶׁק
  choice: mga sandata
  rationale: Tumutukoy ito sa kagamitang pandigma. Ang “mga sandata” ang pinakamalinaw na karaniwang salin, bagaman maaari ring saklawin ng salita ang baluti.
- source_word: בְשָׂמִים
  choice: mga sangkap na mabango
  rationale: Malawak ang termino para sa mababangong sangkap na ginagamit sa kalakalan o handog. Mas likas sa kontekstong biblikal ang pariralang ito kaysa sa “mga pampalasa,” na maaaring magmukhang para lamang sa pagkain.
- source_word: סוּסִים וּפְרָדִים
  choice: mga kabayo, at mga mula
  rationale: Tuwirang katumbas ang “mga kabayo” at “mga mula” ng dalawang pangngalan.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: taon-taon
  rationale: Idyoma ito para sa regular na taunang pag-uulit. Ang “taon-taon” ay natural na modernong Tagalog at pinananatili ang paulit-ulit na diwa.
