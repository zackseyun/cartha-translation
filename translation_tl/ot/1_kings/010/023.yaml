  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: tl
  text: Kaya nahigitan ni Haring Solomon ang lahat ng hari sa daigdig sa kayamanan at karunungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na salin: “At si Haring Solomon ay naging higit sa lahat ng hari sa daigdig sa kayamanan at karunungan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: Kaya nahigitan
  rationale: Sa paghahambing na may מִן, ipinahihiwatig ng גדל na naging higit o nakahigit si Solomon sa iba. Likas at malinaw sa modernong Filipino ang “nahigitan”; ipinapakita naman ng “Kaya” ang buod o resultang daloy ng waw sa konteksto.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: ni Haring Solomon
  rationale: Natural sa Filipino ang pamagat na “Haring” bago ang pangalang pantangi, at pinananatili nito ang titulo at pangalan sa Hebreo.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: ang lahat ng hari sa daigdig
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupain o daigdig. Sa malawak na paghahambing sa mga hari, ang “daigdig” ang pinakanatural na katumbas nang hindi ginagamit ang mas absolutong “mundo.”
- source_word: לְעֹשֶׁר
  choice: sa kayamanan
  rationale: Ang עֹשֶׁר ay materyal na yaman o kayamanan. Karaniwan, malinaw, at marangal ang “kayamanan” sa Filipino.
- source_word: וּלְחָכְמָה
  choice: at karunungan
  rationale: Tuwirang katumbas ng חָכְמָה ang “karunungan.” Hindi na kailangang ulitin ang “sa” sa dalawang magkaugnay na pangngalan.
- source_word: וַ
  choice: Kaya
  rationale: Dito, ang waw ay nagpapatuloy at nagbubuod ng naunang salaysay. Ipinakikita ng “Kaya” ang resultang diwa; posible rin ang mas pormal na “At.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “nahigitan” para sa idiomatikong paghahambing, habang inilagay sa talababa ang mas pormal na anyo upang mapanatili ang aspektong maaaring ipahiwatig ng pandiwang Hebreo.
