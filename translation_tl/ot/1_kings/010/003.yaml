  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: tl
  text: At sinagot ni Solomon ang lahat ng tanong niya[a]; walang anumang nalingid sa hari na hindi niya sinabi sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “At sinabi ni Solomon sa kanya ang lahat ng kanyang mga salita/usapin.” Maaaring isalin nang mas literal ang Hebreo, ngunit sa konteksto ay tumutukoy ito sa mga tugon ni Solomon sa mga tanong ng reyna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: sinagot
  rationale: Karaniwang nangangahulugang “sinabi” o “ipinaalam” ang נגד, ngunit dito ay tumutukoy ito sa pagtugon ni Solomon sa mahihirap na tanong ng reyna (tingnan ang tal. 1). Kaya mas likas at tumpak sa konteksto ang “sinagot.”
- source_word: דְּבָרֶיהָ
  choice: ang lahat ng tanong niya
  rationale: Malawak ang saklaw ng דָּבָר—“salita,” “bagay,” o “usapin.” Sa konteksto ng pagsubok ng reyna kay Solomon sa pamamagitan ng mahihirap na tanong, ang “mga tanong niya” ang malinaw na diwa, habang itinatala sa talababa ang mas pormal na posibilidad.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  choice: walang anumang nalingid
  rationale: Pinananatili ng “nalingid” ang larawan ng isang bagay na nakatago o hindi naabot ng kaalaman, sa natural at marangal na Tagalog.
- source_word: מִן־הַמֶּלֶךְ
  choice: sa hari
  rationale: Sa Tagalog, likas na sabihin na ang isang bagay ay “nalingid sa” isang tao. Pinananatili rin ng “hari” ang tahasang katawagan sa Hebreo.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: na hindi niya ipinaliwanag sa kanya
  rationale: Sa ikalawang paggamit ng נגד, ang “ipinaliwanag” ay malinaw na naghahayag na ibinahagi ni Solomon sa reyna ang anumang usaping nauunawaan niya, at iniiwasan ang alanganing pag-uulit ng “sinagot.”
