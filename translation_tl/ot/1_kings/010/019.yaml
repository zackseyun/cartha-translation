  text: שֵׁ֧שׁ מַעֲל֣וֹת לַ/כִּסֵּ֗ה וְ/רֹאשׁ עָגֹ֤ל לַ/כִּסֵּה֙ מֵ/אַֽחֲרָ֔י/ו וְ/יָדֹ֛ת מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה אֶל מְק֣וֹם הַ/שָּׁ֑בֶת וּ/שְׁנַ֣יִם אֲרָי֔וֹת עֹמְדִ֖ים אֵ֥צֶל הַ/יָּדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: tl
  text: Ang trono ay may anim na baytang, at may pabilog na tuktok[a] sa likuran nito. May mga patungan ng braso sa magkabilang tabi ng upuan[b], at may dalawang leon na nakatayo sa tabi ng mga patungan ng braso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bilog na ulo.” Maaaring tumukoy ito sa pabilog na itaas na bahagi ng trono.
    reason: lexical_alternative
  - marker: b
    text: Literal na “dako ng pag-upo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: mga baytang
  rationale: Sa paglalarawan ng kayarian ng trono, tumutukoy ito sa mga baytang na paakyat dito. Karaniwan at malinaw ang “mga baytang” sa makabagong Filipino.
- source_word: לַכִּסֵּה
  choice: ang trono ay may
  rationale: 'Ang pang-ukol na ל ay likas na ipinahayag bilang pagmamay-ari sa kontekstong ito: ang mga baytang ay bahagi ng kayarian ng trono.'
- source_word: רֹאשׁ עָגֹל
  choice: pabilog na tuktok
  rationale: Literal itong “bilog na ulo/tuktok.” Pinananatili ng “pabilog na tuktok” ang arkitektural na diwa nang hindi ito nililimitahan sa mas tiyak na “sandalan ng ulo.”
- source_word: מֵאַחֲרָיו
  choice: sa likuran nito
  rationale: Malinaw nitong inilalagay ang pabilog na tuktok sa hulihang bahagi ng trono.
- source_word: יָדֹת
  choice: mga patungan ng braso
  rationale: Bagaman kaugnay ng salitang “kamay,” tumutukoy ito rito sa mga bisig o armrest ng trono. Ang salin ay malinaw sa karaniwang mambabasa.
- source_word: מִזֶּה וּמִזֶּה
  choice: sa magkabilang tabi
  rationale: Natural na Filipino ito para sa simetrikong ayos na “sa panig na ito at sa kabila.”
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: sa magkabilang tabi ng upuan
  rationale: Literal na “sa dakong inuupuan.” Sa konteksto, inilalarawan nito ang kinalalagyan ng mga patungan ng braso kaugnay ng upuan.
- source_word: אֲרָיוֹת
  choice: mga leon
  rationale: Tuwirang katumbas ng pangmaramihang pangngalan, na tumutukoy sa mga anyo o pigura ng leon sa trono.
- source_word: עֹמְדִים
  choice: nakatayo
  rationale: Pinananatili nito ang nakikitang ayos ng mga leon na inilalarawan ng participle.
- source_word: אֵצֶל הַיָּדוֹת
  choice: sa tabi ng mga patungan ng braso
  rationale: Tumpak nitong ipinapahayag na ang dalawang leon ay katabi ng mga bisig ng trono at pinananatili ang pare-parehong katawagan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “trono,” “baytang,” at “patungan ng braso” bilang madaling maunawaang katawagang arkitektural. Hindi sinunod ang footnote marker placement ng English consultation layer para sa [a], sapagkat ang nilalaman nito ay nauukol sa רֹאשׁ עָגֹל, hindi sa מַעֲלוֹת; sa halip, inilagay ang marker sa “pabilog na tuktok” at nilinaw ang tunay na leksikal na posibilidad mula sa Hebreo.
