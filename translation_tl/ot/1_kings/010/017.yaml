base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: tl
  text: Gumawa rin siya ng tatlong daang kalasag na yari sa pinukpok na ginto[a]. Tatlong mina ng ginto ang inilapat sa bawat kalasag.[b] Inilagay ng hari ang mga iyon sa Bahay ng Kagubatan ng Lebanon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinanday na ginto” o “gintong pinukpok nang manipis.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “tatlong mina ng ginto ang umakyat sa isang kalasag,” ibig sabihin, ganoong timbang ng ginto ang inilapat sa bawat kalasag. Ang mina ay isang sinaunang yunit ng timbang.
    reason: lexical_alternative
  - marker: c
    text: Ang Bahay ng Kagubatan ng Lebanon ay pangalan ng isang gusaling maharlika, marahil ay ginamit ding taguan ng mga sandata, sa kompleks ng palasyo ni Solomon; tingnan ang 1 Hari 7:2.
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: mga kalasag
  rationale: Ang מָגֵן ay malaking pananggalang, naiiba sa mas maliliit na pananggalang sa naunang talata. Ang “kalasag” ang likas at karaniwang salitang Filipino.
- source_word: זָהָב שָׁחוּט
  choice: pinukpok na ginto
  rationale: Ipinahihiwatig ng שָׁחוּט ang gintong pinukpok o pinanday nang manipis upang mailapat sa kalasag. Pinananatili ng “pinukpok” ang paraan ng paggawa nang hindi ipinapalagay na purong ginto ang buong kalasag.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: tatlong mina
  rationale: Ang מָנֶה ay isang sinaunang yunit ng timbang. Ginamit ang transliterasyong “mina” upang mapanatili ang tiyak na yunit nang hindi nagbibigay ng di-tiyak na modernong katumbas.
- source_word: יַעֲלֶה עַל
  choice: inilapat sa
  rationale: Literal itong tumutukoy sa gintong “umakyat sa” kalasag, isang idyomang nagsasaad ng daming inilagay o inilapat dito. Likas sa Filipino ang “inilapat sa” at pinananatili nitong bukas kung paano eksaktong ikinabit ang ginto.
- source_word: הַמָּגֵן הָאֶחָת
  choice: bawat kalasag
  rationale: Bagaman literal na “ang isang kalasag,” distributibo ang gamit nito rito; malinaw at natural ang “bawat kalasag.”
- source_word: וַיִּתְּנֵם
  choice: inilagay ... ang mga iyon
  rationale: Sa konteksto ng lokasyon, ang נתן ay nangangahulugang inilagay o itinago roon. Ang “inilagay” ay tuwiran at dignified na Filipino.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Bahay ng Kagubatan ng Lebanon
  rationale: Pangalan ito ng isang natatanging gusali sa kompleks ng palasyo. Pinananatili ng “Bahay” ang Hebrew בֵּית at ang buong anyo ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at madaling maunawaan. Isinalin ang וּשְׁלֹשׁ bilang “Gumawa rin siya ng” ayon sa elipsis mula sa pandiwa ng naunang talata, sa halip na panatilihin ang di-likas na panimulang “at tatlong daan.” Pinanatili ang sinaunang yunit na “mina” at ang pormal na pangalan ng gusali.
