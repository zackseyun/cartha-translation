  source_fidelity: Tumpak ang salin sa Hebreo. Wasto ang ipinahiram na pandiwang “Gumawa rin siya” mula sa naunang talata upang maipahayag ang eliptikong pagbubukas ng Hebreo. Naipapakita rin nito ang 300 kalasag, gintong pinukpok, tatlong mina para sa bawat kalasag, at paglalagay ng mga ito sa pinangalanang gusali.
