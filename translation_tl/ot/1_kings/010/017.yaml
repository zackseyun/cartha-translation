  terminology: Ang “kalasag,” “pinukpok na ginto,” at “mina” ay angkop. Maingat na pinananatili ang “Bahay ng Kagubatan ng Lebanon” bilang pangalan ng gusali. Ang mga talababa ay tumutugma sa mga lexical at historikal na paglilinaw ng audit trail.
