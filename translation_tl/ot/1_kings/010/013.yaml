  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַד֙ אֲשֶׁ֣ר נָֽתַן לָ֔/הּ כְּ/יַ֖ד הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/תֵּ֛פֶן וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: tl
  text: At ibinigay ni Haring Solomon sa reyna ng Sheba ang lahat ng ninanais niya, anuman ang hiningi niya, bukod pa sa ibinigay sa kanya ni Haring Solomon ayon sa lawak ng kanyang kakayahan.[a] Pagkatapos, umalis ang reyna at umuwi sa sarili niyang lupain, kasama ang kanyang mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa kamay ni Haring Solomon”—isang idyomang tumutukoy sa lawak ng kanyang kakayahan, kayamanan, o pagiging mapagbigay.
    reason: Ipinaliliwanag ang literal na anyo at ang posibleng saklaw ng idyomang Hebreo.
lexical_decisions:
- source_word: נָתַן
  choice: ibinigay
  rationale: Karaniwang pandiwa para sa pagbibigay; ang “ibinigay” ay tuwiran at natural sa dalawang paglitaw nito sa talata.
- source_word: מַלְכַּת שְׁבָא
  choice: reyna ng Sheba
  rationale: Pinananatili ang titulong maharlika at ang pangalang-pook bilang Sheba, na karaniwang anyo sa Filipino.
- source_word: כָּל חֶפְצָהּ
  choice: ang lahat ng ninanais niya
  rationale: Saklaw ng חֵפֶץ ang pagnanais at ang bagay na ninanais; malinaw at marangal ang pariralang Filipino.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: anuman ang hiningi niya
  rationale: Sa konteksto, ang שׁאל ay paghingi o paghiling; ipinahahayag ng “anuman” ang malawak na saklaw ng sugnay.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Dito ay nagpapahiwatig ito ng karagdagan, kaya mas malinaw ang “bukod pa sa” kaysa sa maaaring magpahiwatig ng pagbubukod lamang.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: ayon sa lawak ng kanyang kakayahan
  rationale: Ang literal na “ayon sa kamay” ay idyoma para sa kakayahan, kayamanan, o mapagbigay na kapangyarihan ng hari. Pinananatili ng salin ang lawak ng idyoma nang hindi ito nililimitahan sa isang kahulugan lamang.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: umalis ang reyna at umuwi sa sarili niyang lupain
  rationale: Ang magkasunod na pandiwa ay literal na “bumaling at humayo”; sa Filipino, natural na ipinahahayag ng “umalis … at umuwi” ang pag-alis at pagpunta sa sariling bayan.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: kasama ang kanyang mga lingkod
  rationale: Ang עֲבָדִים ay maaaring tumukoy sa mga lingkod o tauhan. Ang “mga lingkod” ang pinakatuwirang katumbas at hindi nagpapalagay ng higit sa sinasabi ng konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: ayon sa lawak ng kanyang kakayahan
  alternative: ayon sa kamay ni Haring Solomon; ayon sa kayamanan o pagiging mapagbigay ni Haring Solomon
  rationale: Hindi natural sa Filipino ang literal na “ayon sa kamay” at maaaring hindi maunawaan. Saklaw ng idyoma ang kakayahan, yaman, at pagiging mapagbigay ng hari; hindi ito dapat paliitin nang walang katiyakan sa iisang konsepto.
- issue: Kahulugan ng עֲבָדֶיהָ sa salaysay tungkol sa maharlikang sambahayan
  choice: mga lingkod
  alternative: mga tauhan; mga tagapaglingkod
  rationale: Malawak ang saklaw ng salita at hindi tinutukoy ng talata ang eksaktong katayuang panlipunan ng mga kasama ng reyna. Ang “mga lingkod” ay tuwiran at hindi nagdaragdag ng hindi tiyak na detalye.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “reyna,” “ninanais,” at “mga lingkod” bilang pormal ngunit pangkaraniwang bokabularyo. Inayos nang natural sa Filipino ang pangwakas na Hebreong pariralang “siya at ang kanyang mga lingkod” bilang “kasama ang kanyang mga lingkod.”
