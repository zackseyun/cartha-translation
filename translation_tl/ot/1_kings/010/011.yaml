id: 1KI.10.11
reference: 1 Kings 10:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַם֙ אֳנִ֣י חִירָ֔ם אֲשֶׁר נָשָׂ֥א זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֨יא מֵ/אֹפִ֜יר עֲצֵ֧י אַלְמֻגִּ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֥בֶן יְקָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: tl
  text: Gayundin, ang plota ni Hiram[a], na nagdala ng ginto mula sa Ofir, ay nagdala mula sa Ofir ng napakaraming kahoy na almug[b] at mahahalagang bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “barko ni Hiram.” Isahan ang pangngalang Hebreo, ngunit maaari itong gamitin nang kolektibo para sa mga sasakyang-dagat ni Hiram.
    reason: lexical_alternative
  - marker: b
    text: Maaari ding tawaging “kahoy na algum.” Hindi tiyak ang eksaktong uri nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Gayundin
  rationale: Likas na ipinahahayag ang pandagdag na kaugnayan sa naunang salaysay.
- source_word: אֳנִי חִירָם
  choice: ang plota ni Hiram
  rationale: Bagaman isahan ang anyo ng pangngalang Hebreo, maaari itong tumukoy nang kolektibo sa mga sasakyang-dagat ni Hiram; malinaw at natural sa Filipino ang “plota.”
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: na nagdala ng ginto
  rationale: Tuwirang ipinahahayag ang pagdadala ng kargamento nang hindi dinaragdagan ang kahulugan ng pandiwang Hebreo.
- source_word: מֵאוֹפִיר
  choice: mula sa Ofir
  rationale: Pinananatili ang pang-ukol at ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: הֵבִיא
  choice: nagdala
  rationale: Karaniwan at tuwirang katumbas ng Hiphil ng בוא sa konteksto ng pag-angkat ng kargamento.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: kahoy na almug
  rationale: Pinananatili ang katawagang batay sa Hebreo sapagkat hindi tiyak ang eksaktong uri ng punongkahoy; iniiwasan ang masyadong tiyak na “sandalwood.”
- source_word: הַרְבֵּה מְאֹד
  choice: napakaraming
  rationale: Natural na ipinahahayag sa Filipino ang matinding diin ng pariralang Hebreo sa labis na dami.
- source_word: וְאֶבֶן יְקָרָה
  choice: at mahahalagang bato
  rationale: Bagaman isahan ang anyong Hebreo, malamang na kolektibo ito sa talaan ng mga kargamento, kaya natural ang maramihan sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “mula sa Ofir” mula sa Hebreo, at nilagyan ng talababa ang dalawang tunay na leksikal na di-katiyakan.
