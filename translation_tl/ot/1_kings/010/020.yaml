translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “baitang” para sa hagdanang paakyat sa trono at “magkabilang panig” bilang likas na paglalarawan sa simetrikong ayos. Ang dalawang pangungusap ay nagpapanatili sa malinaw na paglipat mula sa paglalarawan tungo sa paghahambing.
