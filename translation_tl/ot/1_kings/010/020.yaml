  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: tl
  text: At may labindalawang leon na nakatayo roon sa anim na baitang, sa magkabilang panig[a]. Walang katulad nito ang nagawa sa alinmang kaharian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa panig na ito at sa panig na iyon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Hindi ginawa nang gayon para sa lahat ng kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  choice: At may labindalawang leon
  rationale: Ginamit ang likas na pangungusap na eksistensiyal sa Filipino upang ipakilala ang labindalawang pigura ng leon habang pinananatili ang pang-ugnay na וּ.
- source_word: עֹמְדִים שָׁם
  choice: na nakatayo roon
  rationale: Ang participle ay naglalarawan sa ayos o kalagayan ng mga leon; malinaw at natural itong naipahahayag ng “nakatayo roon.”
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: sa anim na baitang
  rationale: Ang מַעֲלוֹת sa konteksto ay mga baitang paakyat sa trono. Sapat ang “sa” upang ipahiwatig na nasa o kahilera ng mga baitang ang mga leon nang hindi labis na tinutukoy ang eksaktong pagkakalagay.
- source_word: מִזֶּה וּמִזֶּה
  choice: sa magkabilang panig
  rationale: Likas na idyomang Filipino ito para sa simetrikong lokasyong ipinahahayag ng literal na “sa panig na ito at sa panig na iyon.”
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Walang ginawang tulad nito
  rationale: Natural na katumbas ito ng pasibong pahayag na walang katulad na bagay na ginawa, at pinananatili ang paghahambing na כֵן.
- source_word: לְכָל מַמְלָכוֹת
  choice: para sa alinmang kaharian
  rationale: Sa negatibong pangungusap, ang כָל ay may diwang “alinman.” Pinananatili ng “para sa” ang direksiyon o kapakinabangang maaaring ipahiwatig ng לְ, sa halip na tahasang gawing lokatibo.
