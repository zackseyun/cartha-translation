base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: tl
  text: Sapagkat ang hari ay may mga barkong Tarsis[a] sa dagat, kasama ng mga barko ni Hiram. Minsan sa bawat tatlong taon, dumarating ang mga barkong Tarsis na may dalang ginto, pilak, garing, mga unggoy, at mga paboreal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga barkong Tarsis” ay maaaring tumukoy sa malalaking barkong pangkalakalan na ginagamit sa malalayong paglalayag, at hindi kinakailangang sa mga barkong patungong Tarsis lamang.
    reason: Pinananatili ang tunay na kalabuan ng pariralang Hebreo tungkol sa uri o destinasyon ng mga barko.
  - marker: b
    text: Hindi tiyak ang eksaktong uri ng hayop na tinutukoy ng salitang Hebreo; ayon sa tradisyon, mga paboreal.
    reason: Hindi ganap na matiyak ang pagkakakilanlan ng תֻכִּיִּים mula sa ebidensiyang leksikal.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: mga barkong Tarsis
  rationale: Pinananatili ang anyong idinurugtong sa Tarsis nang hindi tiyak na ipinapakahulugang patungong Tarsis; maaari itong tumukoy sa isang uri o pangkat ng malalayong barkong pangkalakalan.
- source_word: שֶׁנְהַבִּים
  choice: garing
  rationale: Karaniwang kahulugan sa konteksto ng mahalagang kalakal; natural ang pangngalang di-mabilang na “garing” sa Filipino.
- source_word: קֹפִים
  choice: mga unggoy
  rationale: Malawak at nauunawaang katumbas ng salitang tumutukoy sa mga primate na inangkat bilang kakaibang kalakal.
- source_word: תֻכִּיִּים
  choice: mga paboreal
  rationale: Tradisyonal at malamang na kahulugan sa kontekstong ito, ngunit minamarkahan sa talababa dahil hindi ganap na tiyak ang pagkakakilanlan ng hayop.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Minsan sa bawat tatlong taon
  rationale: Malapit sa literal na dalas ng Hebreo at hindi ipinapalagay kung gaano katagal ang mismong paglalayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naglalayag sa dagat” upang maging natural ang ugnayan ng mga barko sa dagat, at pinanatili ang kolektibong diwa ng salitang isahan sa Hebreo sa pamamagitan ng pangmaramihang “mga barko.”
