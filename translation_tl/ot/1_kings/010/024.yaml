id: 1KI.10.24
reference: 1 Kings 10:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: tl
  text: At hinangad ng buong daigdig na makaharap si Solomon[a] upang marinig ang karunungang inilagay ng Diyos sa kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hanapin ang mukha ni Solomon,” isang idyoma para sa paghahangad na makaharap siya o makausap siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: At ... ng buong daigdig
  rationale: Ang parirala ay isang malawak at kolektibong pahayag tungkol sa mga tao sa kilalang daigdig, hindi lamang sa isang lokal na lupain. Pinananatili ng “buong daigdig” ang retorikal na lawak ng Hebreo.
- source_word: מְבַקְשִׁים
  choice: hinangad
  rationale: Ang participle ay nagpapahayag ng patuloy o nakaugaliang pagkilos sa buod na salaysay; natural itong ipinahahayag sa Filipino sa aspektong naganap.
- source_word: אֶת־פְּנֵי שְׁלֹמֹה
  choice: na makaharap si Solomon
  rationale: Literal itong “hanapin ang mukha ni Solomon,” isang idyoma para sa paghahangad na mapalapit sa kanya o magkaroon ng pagkakataong humarap sa kanya. Ang “makaharap” ay natural at hindi labis na nagpapaliwanag.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: upang marinig ang karunungan
  rationale: Pinananatili ang layuning ipinahahayag ng infinitive at ang tuwirang diwa ng pandiwang “marinig,” habang natural pa rin sa Filipino.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  choice: inilagay ng Diyos sa kanyang puso
  rationale: Bagaman literal na “ibinigay,” ang נָתַן kasama ng בְּלִבּוֹ ay natural na “inilagay ... sa kanyang puso.” Pinananatili ng “puso” ang Hebreong larawan ng kaloob-looban, kabilang ang isip at pagpapasiya.
theological_decisions:
- issue: Pagpapahayag sa אֱלֹהִים
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang nasa tekstong Hebreo, hindi ang pangalang YHWH; kaya “Diyos” ang wastong salin.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “daigdig” para sa malawak na saklaw ng הָאָרֶץ at ang “makaharap” para natural na maipahayag ang Hebreong idyoma, habang inilagay sa talababa ang literal na larawan.
