base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: tl
  text: Ang lahat ng sisidlang inuman ni Haring Solomon ay yari sa ginto, at ang lahat ng sisidlan ng Bahay ng Kagubatan ng Lebanon ay yari sa dalisay na ginto.[a] Noong panahon ni Solomon, hindi itinuring na may anumang halaga ang pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinong ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: mga sisidlang inuman
  rationale: Pinananatili nito ang malawak na kahulugan ng כְּלֵי bilang mga sisidlan o kagamitan at ang pagtukoy ng מַשְׁקֵה sa pag-inom, nang hindi ito nililimitahan sa mga kopa lamang.
- source_word: זָהָב
  choice: ginto / yari sa ginto
  rationale: Ang זָהָב ay tuwirang tumutukoy sa materyal na ginto. Idinagdag ang “yari sa” upang maging likas at malinaw sa Filipino na ang mga sisidlan ay gawa sa ginto.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Bahay ng Kagubatan ng Lebanon
  rationale: Pinananatili ang anyong pangalan ng isang tiyak na gusaling maharlika at ang literal na mga sangkap na “bahay,” “kagubatan,” at “Lebanon,” sa halip na ipakahulugan agad bilang palasyo.
- source_word: זָהָב סָגוּר
  choice: dalisay na ginto
  rationale: Sa pariralang ito, ang סָגוּר ay tumutukoy sa mataas na uri o pinong ginto. Ang “dalisay na ginto” ay malinaw at likas, samantalang ang “purong ginto” ay maaari ring maunawaan ngunit mas kolokyal ang tunog.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: hindi itinuring na may anumang halaga
  rationale: Ipinahahayag ng Niphal ng חשׁב ang pagtataya o pagtingin sa halaga. Nililinaw ng likas na idyomang Filipino na ang pilak ay hindi literal na wala, kundi itinuring na walang kabuluhang halaga dahil sa kasaganaan nito.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: noong panahon ni Solomon
  rationale: Ito ang natural at marangal na katumbas sa modernong Filipino ng Hebreong temporal na pariralang “sa mga araw ni Solomon.”
