translation_notes:
  register: Gumamit ng modernong, dignidadong Filipino na madaling maunawaan. Pinanatili ang “Bahay ng Kagubatan ng Lebanon” bilang pangalan ng gusali, at iniwasan ang mas makitid na “mga kopa” para sa sari-saring sisidlang gamit sa pag-inom.
