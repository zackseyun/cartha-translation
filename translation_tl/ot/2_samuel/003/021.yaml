  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: tl
  text: Sinabi ni Abner kay David, “Tatayo ako at aalis, at titipunin ko ang buong Israel sa aking panginoong hari, upang makipagtipan sila sa iyo[a]. Maghahari ka sa lahat ng ninanais ng iyong kaluluwa[b].” Pagkatapos, pinahintulutan ni David si Abner na umalis, at umalis siyang payapa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol sila ng tipan sa iyo,” isang karaniwang idyoma para sa pagtatatag ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “sa lahat ng iyong ninanais.” Sa Hebreo, “sa lahat ng ninanais ng iyong kaluluwa.”
    reason: lexical_alternative
  - marker: c
    text: Ang “umalis siyang payapa” ay isang Hebreong idyoma na nagpapahiwatig na ligtas siyang nakaalis at maayos ang kanilang paghihiwalay.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Tatayo ako at aalis
  rationale: Ang mga anyong cohortative ay nagpapahayag ng matibay na pasiya ni Abner. Pinananatili ng salin ang magkasunod na kilos nang hindi ginagawang utos o pakiusap.
- source_word: וְאֶקְבְּצָה
  choice: at titipunin ko
  rationale: Tuwirang ipinapahayag ng קבץ ang pag-iipon o pagbubuklod sa buong Israel para sa pampolitikang pagkilala kay David.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: sa aking panginoong hari
  rationale: Pinananatili nito ang direksiyon ng אֶל at ang magalang na katawagan ni Abner kay David, nang hindi nagdaragdag ng diwa ng pagkaalipin.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Likas na kolektibong tawag ito sa kabuuan ng mga lipi at mamamayan ng Israel.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: upang makipagtipan sila sa iyo
  rationale: Ang כרת ברית ay nakaugaliang Hebreong parirala para sa pagtatatag ng tipan. Ang “makipagtipan” ay malinaw at likas sa Tagalog, samantalang nasa talababa ang literal na larawang “pumutol ng tipan.”
- source_word: וּמָלַכְתָּ
  choice: Maghahari ka
  rationale: Tumpak at maikli nitong ipinapahayag ang aktuwal na paghahari, hindi lamang ang pagkakaroon ng titulong hari.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: sa lahat ng ninanais ng iyong kaluluwa
  rationale: Pinananatili ang tahasang נפשׁ bilang “kaluluwa” at ang diwa nito bilang panloob na sarili na nagnanais, sa halip na palitan ito ng “puso” o alisin ang antropolohikal na larawan.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: pinayaon ni David si Abner
  rationale: Sa konteksto, ang pandiwa ay nangangahulugang pinahintulutan at pinauwi si Abner. Ang “pinayaon” ay marangal at hindi nagpapahiwatig na marahas siyang pinaalis.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: at umalis siyang payapa
  rationale: Pinananatili nito ang Hebreong idyoma ng pag-alis nang ligtas at nasa mapayapang ugnayan.
theological_decisions:
- issue: Wika ng pakikipagtipan
  choice: makipagtipan sila sa iyo
  alternative: pumutol sila ng tipan sa iyo; pumasok sila sa isang tipan sa iyo
  rationale: Pampolitikang tipan ang tuwirang konteksto. Gumagamit ang pangunahing teksto ng malinaw na Tagalog habang itinatala sa talababa ang literal na Hebreong idyoma nang hindi dinaragdagan ng natatanging sistemang teolohikal.
- issue: Pagpapakahulugan sa נפשׁ sa parirala tungkol sa pagnanais
  choice: ninanais ng iyong kaluluwa
  alternative: iyong ninanais; ninanais ng iyong puso
  rationale: Tahasan sa Hebreo ang נפשׁ. Ang “kaluluwa” ay nagpapanatili ng leksikal at antropolohikal na larawan, samantalang kinikilala ng talababa na ang buong parirala ay maaari ring likas na ipahayag bilang “lahat ng iyong ninanais.”
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pormal na “panginoong hari,” “makipagtipan,” at “kaluluwa” dahil mahalaga ang kanilang anyo sa Hebreo, habang iniwasan ang labis na arkaikong ayos at mga katawagang may denominasyonal na kulay.
