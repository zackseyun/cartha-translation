    rationale: Ang “si Rizpa, anak ni Aya” ay likas na appositibong anyo at ganap na katumbas ng patronimiko.
  revised_text: May babaeng kinakasama si Saul, si Rizpa, anak ni Aya. Sinabi ni Isboset kay Abner, “Bakit ka pumasok sa babaeng kinakasama ng ama ko?”
