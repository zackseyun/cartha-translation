  naturalness: Natural ang kabuuang daloy, ngunit mas likas sa direktang pananalita ang “ama ko” kaysa “aking ama.” Mas maayos din ang appositibong “si Rizpa, anak ni Aya” kaysa sa magkasunod na sugnay na may “na.”
  terminology: Ang “kinakasamang babae” ay maingat at di-mapanghusga, ngunit maaaring lumabo ang natatanging sinaunang katayuan ng פִּילֶגֶשׁ. Ang “babaeng kinakasama” ay bahagyang mas malinaw bilang pangngalan, at ang talababa ay maaaring tukuyin na ito ay isang concubine/sekundaryang asawa sa sinaunang kaayusan. Gayunman, hindi dapat magpataw ng modernong legal na katumbas.
