- from: May kinakasamang babae si Saul na nagngangalang Rizpa, na anak ni Aya. Sinabi ni Isboset kay Abner, “Bakit mo sinipingan[a] ang kinakasamang babae ng aking ama?”
  to: May babaeng kinakasama si Saul, si Rizpa, anak ni Aya. Sinabi ni Isboset kay Abner, “Bakit ka pumasok sa babaeng kinakasama ng ama ko?”
  rationale: Inayos ang pagsasalin upang mapanatili sa pangunahing teksto ang seksuwal na eupemismo ng Hebreo, gaya rin ng ginagawa ng English POB audit trail. Pinakinis ang Tagalog na sintaks at ginawang pare-pareho ang antas ng pananalita. Ang “babaeng kinakasama” ay pinanatili bilang maingat na modernong paglalarawan ng concubine nang hindi gumagamit ng mapanlibak o anakronistikong katawagan.
