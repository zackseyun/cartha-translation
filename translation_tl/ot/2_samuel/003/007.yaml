base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: tl
  text: May babaeng kinakasama si Saul, si Rizpa, anak ni Aya. Sinabi ni Isboset kay Abner, “Bakit ka pumasok sa babaeng kinakasama ng ama ko?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: May … si Saul
  rationale: Ang לְ ay nagpapahayag dito ng pag-aari o kaugnayan. Likas sa modernong Tagalog ang hulmahang “May … si Saul,” at hindi na kailangang dagdagan ng tahasang panandang temporal.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: kinakasamang babae
  rationale: Ipinahahayag nito sa madaling maunawaang Tagalog ang isang babaeng kinakasama bilang asawa ngunit hindi kapantay ng pangunahing asawa ang katayuan. Iniwasan ang “kalunya” at “kerida,” na sa kasalukuyang gamit ay karaniwang nagpapahiwatig agad ng pangangalunya o may mapanlibak na himig.
- source_word: וּשְׁמָהּ
  choice: na nagngangalang
  rationale: Natural at maikli itong paraan ng pagkilala sa pangalan ng babae habang pinananatili ang tungkulin ng pariralang Hebreo.
- source_word: רִצְפָּה
  choice: Rizpa
  rationale: Isinalin sa baybay na angkop sa bigkas at nakagawiang anyo ng pangalan sa Tagalog.
- source_word: בַת אַיָּה
  choice: anak ni Aya
  rationale: Direktang salin ng patronimikong parirala; hindi kailangang tukuyin muli ang kasarian dahil malinaw na babae si Rizpa sa naunang parirala.
- source_word: וַיֹּאמֶר
  choice: Sinabi ni Isboset
  rationale: Bagaman panghalip lamang ang ipinahihiwatig na simuno sa Hebreo, malinaw sa naunang konteksto na si Isboset ang nagsasalita. Ang pagbanggit sa pangalan ay umiiwas sa kalituhan sa Tagalog nang walang idinaragdag na bagong tauhan.
- source_word: אֶל אַבְנֵר
  choice: kay Abner
  rationale: Karaniwang katumbas sa Tagalog ng אֶל kapag tumutukoy sa taong kinakausap.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Pinakanatural at tuwirang anyo ng tanong sa modernong Tagalog.
- source_word: בָּאתָה אֶל
  choice: mo sinipingan
  rationale: Ang literal na “pumasok sa” ay karaniwang eupemismo sa Hebreo para sa pakikipagtalik. Ang “sinipingan” ay dignidadong Tagalog na malinaw ang seksuwal na diwa ngunit hindi magaspang; inilalahad sa talababa ang literal na tayutay ng pinagmulan.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: kinakasamang babae ng aking ama
  rationale: Pinananatili ang kaugnayang ipinahahayag ng pariralang pag-aari at inuulit ang parehong katawagan para sa פִּילֶגֶשׁ.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kinakasamang babae” bilang madaling maunawaang paglalarawan sa sinaunang kategoryang panlipunan ng פִּילֶגֶשׁ, at “sinipingan” upang maging malinaw sa mambabasa ang seksuwal na paratang habang pinananatili sa talababa ang eupemismong Hebreo.
