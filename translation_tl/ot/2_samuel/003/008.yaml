  source_fidelity: Kailangang baguhin ang pangunahing teksto upang hindi ipakahulugan nang mas tiyak ang mahirap na idyomang Hebreo. Ang “na kakampi ng Juda” ay pinipili ang isang posibleng pagbasa ng אֲשֶׁר לִיהוּדָה, samantalang ang pinagmulan at audit trail ay sadyang nagpapanatili ng kalabuan. Ang “pinapanagot mo ako sa kasalanang may kinalaman sa babaeng ito” ay mas tumpak sa פקד על ... עון kaysa sa “pinararatangan mo akong nagkasala tungkol sa babaeng ito.”
  naturalness: Maayos at marangal ang kabuuang Filipino. Ang “Hanggang sa araw na ito” ay natural sa retrospektibong pagtatanggol ni Abner. Ang binagong “para sa Juda” ay sadyang di-ganap na karaniwan dahil pinananatili nito ang mahirap na metapora; nililinaw ito ng talababa.
  terminology: Ang “sambahayan” ay angkop para sa בית sa dinastiko/pampamilyang diwa. Mas angkop ang “matapat na kabutihang-loob” para sa חסד sa kontekstong ito kaysa “tapat na pagmamahal,” dahil ipinahihiwatig nito ang kapwa katapatan at mabuting pakikitungo nang hindi nagiging sentimental. Pinananatili ang “kamay ni David” bilang biblikal na idyoma.
