revisions:
- from: Labis na nagalit si Abner dahil sa mga sinabi ni Is-boset, at sinabi niya, “Ulo ba ako ng aso na kakampi ng Juda?[a] Hanggang sa araw na ito ay nagpakita ako ng tapat na pagmamahal sa sambahayan ng iyong amang si Saul, sa kanyang mga kapatid, at sa kanyang mga kaibigan. Hindi kita ibinigay sa kamay ni David, ngunit ngayo'y pinararatangan mo akong nagkasala tungkol sa babaeng ito.”
  to: Labis na nagalit si Abner dahil sa mga sinabi ni Is-boset, at sinabi niya, “Ako ba'y ulo ng asong para sa Juda?[a] Hanggang sa araw na ito ay nagpakita ako ng matapat na kabutihang-loob sa sambahayan ng iyong amang si Saul, sa kanyang mga kapatid, at sa kanyang mga kaibigan, at hindi kita ibinigay sa kamay ni David; ngunit ngayon ay pinapanagot mo ako sa kasalanang may kinalaman sa babaeng ito.”
  rationale: 'Inayos ang dalawang lugar kung saan ang salin ay nagdagdag ng interpretasyong hindi tiyak sa Hebreo: ang kaugnayan ng “ulo ng aso” sa Juda at ang uri ng pagsingil kay Abner. Pinalitan din ang mas sentimental na katumbas ng חסד ng pananalitang mas angkop sa kontekstong pampolitika at pampamilya. Napanatili ang retrospektibong puwersa ng unang “hanggang sa araw na ito,” ang kaibahan nito sa huling “ngayon,” at ang idyomang “sa kamay ni David.”'
