  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: tl
  text: Labis na nagalit si Abner dahil sa mga sinabi ni Is-boset, at sinabi niya, “Ako ba'y ulo ng asong para sa Juda?[a] Hanggang sa araw na ito ay nagpakita ako ng matapat na kabutihang-loob sa sambahayan ng iyong amang si Saul, sa kanyang mga kapatid, at sa kanyang mga kaibigan, at hindi kita ibinigay sa kamay ni David; ngunit ngayon ay pinapanagot mo ako sa kasalanang may kinalaman sa babaeng ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ulo ng asong para sa Juda.” Isa itong mahirap unawaing mapanlait na pananalita. Maaaring tumukoy ito sa isang hamak na taong kaugnay o kumakampi sa Juda, ngunit pinananatili rito ang metapora at ang kalabuan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Labis na nagalit si Abner
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na tumutukoy sa matinding pagningas ng galit; pinananatili ng “labis” ang diin ng מְאֹד.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: dahil sa mga sinabi ni Is-boset
  rationale: Ipinahahayag nang natural ang sanhi ng galit habang pinananatili ang diwa ng “mga salita ni Is-boset.”
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Ulo ba ako ng aso na kakampi ng Juda?
  rationale: Pinananatili ang mahirap at mapanlait na metaporang “ulo ng aso,” habang ang “kakampi ng Juda” ay naghahayag sa natural na Filipino ng posibleng diwa ng pagpanig nang hindi inaalis ang likas na kalabuan.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: Hanggang sa araw na ito ay nagpakita ako ng tapat na pagmamahal
  rationale: Sa pagtatanggol ni Abner, ang unang הַיּוֹם ay sumasaklaw sa kanyang naging asal hanggang sa kasalukuyan at kaiba sa ikalawang “ngayon.” Ang “tapat na pagmamahal” ay nagpapahiwatig ng matatag na katapatan at kabutihang-loob ng חֶסֶד nang hindi gumagamit ng teknikal na terminong maaaring maging mabigat sa karaniwang mambabasa.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: sa sambahayan ng iyong amang si Saul
  rationale: Ang “sambahayan” ay nagpapanatili sa dinastiko at pampamilyang saklaw ng בֵּית; inayos ang pangungusap ayon sa natural na Filipino.
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: sa kanyang mga kapatid, at sa kanyang mga kaibigan
  rationale: Direktang pinananatili ang mga katawagang Hebreo, bagaman maaaring saklawin ng “mga kapatid” ang malalapit na kamag-anak.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: Hindi kita ibinigay sa kamay ni David
  rationale: Pinananatili ang karaniwang idyomang biblikal na “sa kamay,” na tumutukoy sa pagpapasailalim sa kapangyarihan ng iba.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: ngayo'y pinararatangan mo akong nagkasala tungkol sa babaeng ito
  rationale: Malinaw na inilalahad ang legal at moral na diwa ng pagsingil o pagpaparatang dahil sa kasalanang may kinalaman sa babae, nang hindi idinaragdag ang pangalan niya.
