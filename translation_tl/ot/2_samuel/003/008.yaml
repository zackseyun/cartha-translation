translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na talas ng pagsagot ni Abner, ang biblikal na idyomang “sa kamay,” at ang mahirap na metaporang “ulo ng aso,” na ipinaliwanag sa talababa.
