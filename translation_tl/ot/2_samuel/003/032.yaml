  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: tl
  text: Inilibing nila si Abner sa Hebron. Itinaas ng hari ang kanyang tinig at umiyak sa libingan ni Abner[a], at umiyak ang buong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “tungo sa libingan ni Abner.”'
    reason: Ang Hebreong pang-ukol na אֶל ay karaniwang direksiyonal. Sa konteksto, natural ang “sa libingan,” ngunit pinananatili ng talababa ang posibleng literal na pagbasa.
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Inilibing nila
  rationale: Ang Qal wayyiqtol na pangmaramihan ng קבר ay tuwirang nagsasaad ng kasunod na pangyayari sa salaysay. Natural sa modernong Tagalog ang pandiwang “inilibing” nang hindi na tahasang isinasalin ang panimulang וַ bilang “at.”
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Ang בְּ ay panandang panlunan dito; ang “sa Hebron” ang natural na katumbas sa Tagalog.
- source_word: וַיִּשָּׂא הַמֶּלֶךְ אֶת־קוֹלוֹ
  choice: Itinaas ng hari ang kanyang tinig
  rationale: Pinananatili nito ang Hebreong idyoma at ang marangal na himig ng tagpong pagluluksa, nang hindi ito nililimitahan sa isang tiyak na anyo gaya ng paghagulgol.
- source_word: וַיֵּבְךְּ
  choice: umiyak
  rationale: Ang בכה ay nangangahulugang umiyak o tumangis. Ang “umiyak” ay malinaw, natural, at angkop sa konteksto ng libing.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: sa libingan ni Abner[a]
  rationale: Bagaman karaniwang nagpapahiwatig ang אֶל ng patutunguhan o pagharap tungo sa isang bagay, sa kontekstong ito natural na ipinahahayag ng “sa” ang pag-iyak sa kinaroroonan ng libingan. Inilalagay sa talababa ang mas literal na posibilidad upang mapanatili ang ambiguwidad.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: at umiyak din ang buong bayan
  rationale: Inuulit ang “umiyak” upang mapanatili ang pag-uulit ng בכה. Ang “buong bayan” ay tumutukoy sa lahat ng taong naroon bilang sambayanan, at ipinakikita ng “din” ang pakikiisa nila sa pag-iyak ng hari.
