  text: לְ/הַֽעֲבִ֥יר הַ/מַּמְלָכָ֖ה מִ/בֵּ֣ית שָׁא֑וּל וּ/לְ/הָקִ֞ים אֶת כִּסֵּ֣א דָוִ֗ד עַל יִשְׂרָאֵל֙ וְ/עַל יְהוּדָ֔ה מִ/דָּ֖ן וְ/עַד בְּאֵ֥ר שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: tl
  text: upang ilipat ang kaharian mula sa sambahayan ni Saul at itatag ang trono ni David sa Israel at sa Juda—mula sa Dan hanggang sa Beer-seba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mula sa Dan hanggang sa Beer-seba” ay isang heograpikong sawikain na tumutukoy sa buong lupain, mula hilaga hanggang timog.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: upang ilipat
  rationale: Ang Hiphil ng עבר ay tumutukoy sa pagpapasa ng kaharian mula sa isang naghaharing sambahayan tungo sa iba; malinaw at likas sa Filipino ang “ilipat.”
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Saklaw ng salita ang kaharian o paghaharing maharlika; pinananatili ng “kaharian” ang lawak at konkretong himig ng Hebreo.
- source_word: מִבֵּית שָׁאוּל
  choice: mula sa sambahayan ni Saul
  rationale: Ang בֵּית ay idyomang dinastiko rito. Ang “sambahayan” ay nagpapanatili sa larawan ng isang angkan o naghaharing pamilya nang hindi ito ginagawang abstraktong “dinastiya.”
- source_word: וּלְהָקִים
  choice: at itatag
  rationale: Sa kontekstong pampolitika, ang Hiphil ng קום ay nangangahulugang magtatag o maglagay nang matibay.
- source_word: אֶת כִּסֵּא דָוִד
  choice: ang trono ni David
  rationale: Pinananatili ang konkretong larawan ng trono bilang sagisag ng maharlikang kapangyarihan.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: sa Israel at sa Juda
  rationale: Sa Filipino, likas gamitin ang “sa” upang ipahayag ang saklaw ng paghahari; ang pag-uulit nito ay tumutugma sa dalawang magkahiwalay na nasasakupan.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: mula sa Dan hanggang sa Beer-seba
  rationale: Tuwirang inililipat ang pormulang heograpiko mula sa pinakahilaga hanggang sa pinakatimog ng lupain.
theological_decisions:
- issue: Dinastikong wika ng “sambahayan ni Saul” at maharlikang larawan ng “trono ni David”
  choice: Panatilihin ang mga konkretong salitang “sambahayan” at “trono.”
  alternative: “mula sa dinastiya ni Saul at itatag ang paghahari ni David”
  rationale: Ang Hebreo ay gumagamit ng mga larawang dinastiko at maharlika. Ang pagpapanatili sa mga ito ay tapat sa teksto at hindi nagdaragdag ng mga doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” sa dinastikong diwa at pinanatili ang tradisyonal na larawang “trono.” Ang gatlang ay nilinaw na ang pariralang heograpiko ay nagsasaad ng kabuuang saklaw ng Israel at Juda.
