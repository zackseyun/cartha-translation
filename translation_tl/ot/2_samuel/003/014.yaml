  naturalness: Ang binagong pangungusap ay natural at may marangal na modernong rehistro sa Filipino. Ang “na may ganitong mensahe” ay malinaw at hindi nagdaragdag ng kahulugang wala sa teksto.
  terminology: Pinanatili ang tradisyonal na mga pangalang “Isboset” at “Mical.” Ang “ipinagkasundo ko upang maging asawa ko” ay nagpapanatili sa legal/betrothal na diwa ng אֵרַשְׂתִּי nang hindi binubura ang naunang “asawa kong.” Ginamit ang tahasang ngunit hindi sobrang teknikal na “mga balat sa dulo ng ari” para sa foreskins.
