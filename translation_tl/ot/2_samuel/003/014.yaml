base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: tl
  text: 'Pagkatapos, nagsugo si David ng mga mensahero kay Isboset, na anak ni Saul, na may ganitong mensahe: “Ibigay mo sa akin ang asawa kong si Mical, na ipinagkasundo ko upang maging asawa ko[a] kapalit ng isang daang balat sa dulo ng ari ng mga Filisteo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas idyomatiko: “na nakuha kong maging asawa kapalit ng isang daang balat sa dulo ng ari ng mga Filisteo.” Mas literal sa Hebreo: “na ipinagkasundo ko para sa aking sarili.”'
    reason: lexical_alternative
  - marker: b
    text: Tingnan ang 1 Samuel 18:25–27 para sa salaysay kung paano nakuha ni David si Mical nang iharap niya ang mga balat sa dulo ng ari ng mga Filisteo bilang halagang hiningi ni Saul para sa pag-aasawa.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo si David
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod nang hindi nagpapahiwatig ng higit na sanhi.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong pantao, karaniwang tumutukoy ito sa mga taong ipinadala upang maghatid ng mensahe.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: kay Isboset na anak ni Saul
  rationale: Pinananatili ang pangalan at ang tuwirang pagkakakilanlan sa kaniya bilang anak ni Saul.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Natural na panimula sa tuwirang pananalita sa Tagalog; malinaw na si David ang nagsabi sa pamamagitan ng mga mensahero.
- source_word: תְּנָה
  choice: Ibigay mo sa akin
  rationale: Tuwiran at natural na katumbas ng pautos na anyo ng נתן.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: ang asawa kong si Mical
  rationale: Natural na ipinapahayag sa Tagalog ang appositional na pagkakakilanlan ni Mical bilang asawa ni David.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: na ipinagkasundo kong mapangasawa
  rationale: Ipinapakita ng ארשׂ ang pormal na kasunduan o pagtatalaga para sa pag-aasawa. Pinananatili ng parirala ang ugnayang ito nang mas natural kaysa sa literal na “ipinagkasundo ko sa aking sarili.”
- source_word: בְּמֵאָה
  choice: kapalit ng sandaan
  rationale: Ipinahihiwatig ng pang-ukol ang halagang o bride-price na batayan ng pagkuha ni David kay Mical.
- source_word: עָרְלוֹת פְּלִשְׁתִּים
  choice: balat ng maselang bahagi ng mga Filisteo
  rationale: Tumpak ngunit mas madaling maunawaan ng karaniwang modernong mambabasa kaysa sa teknikal na “mga prepusyo”; tumutukoy ito sa balat na tinatanggal sa pagtutuli.
theological_decisions:
- issue: Katayuan ni Mical bilang asawa at ang wika ng pakikipagkasundo sa pag-aasawa
  choice: Isinalin ang אִשְׁתִּי bilang “asawa kong” at ang אֵרַשְׂתִּי bilang “ipinagkasundo kong mapangasawa.”
  alternative: Gawing pangkalahatan ang ikalawang parirala bilang “pinakasalan ko,” o literal na “ipinagkasundo ko sa aking sarili.”
  rationale: 'Pinananatili nito ang tensiyon sa Hebreo: tinatawag ni David si Mical na kaniyang asawa, ngunit ibinabatay niya ang karapatan niya sa naunang kasunduan at bride-price, sa halip na pag-isahin nang tahimik ang dalawang paglalarawan.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Isboset” at “Mical” bilang mga anyong pangalang karaniwan sa tradisyong Tagalog. Iniwasan ang masyadong teknikal na “prepusyo,” ngunit pinanatili ang kongkretong at marahas na detalye ng Hebreo sa malinaw na pariralang “balat ng maselang bahagi.”
