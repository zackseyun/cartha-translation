base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: tl
  text: Alam mo na si Abner na anak ni Ner ay naparito upang linlangin ka[a], upang alamin ang iyong paglabas at pagpasok[b], at upang alamin ang lahat ng ginagawa mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “akitin ka” o “hikayatin ka.” Ang pandiwang Hebreo ay maaaring mangahulugang mang-akit, manghikayat, o manlinlang; sa mapanlaban na konteksto rito, mas angkop ang “linlangin ka.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang iyong paglabas at pagpasok,” isang idyoma para sa kabuuan ng mga pagkilos o gawain ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Alam mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay maaaring magpahayag ng kasalukuyang kalagayan ng kaalaman. Dito, ipinipilit ni Joab na dapat alam o nakikilala ni David ang layunin ni Abner.
- source_word: אַבְנֵר בֶּן נֵר
  choice: si Abner na anak ni Ner
  rationale: Natural sa modernong Filipino ang paglalagay ng pantukoy na “si” sa pangalang pantangi at ang pariralang “na anak ni” para sa ugnayang pampamilya.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala nito ang nilalaman ng sinasabing alam ni David: na naparito si Abner na may masamang layunin. Posible rin ang panandang sanhi, ngunit mas maayos sa daloy ng paratang ang “na.”'
- source_word: לְפַתֹּתְךָ
  choice: upang linlangin ka
  rationale: Maaaring tumukoy ang פתה sa pang-aakit, panghihikayat, o panlilinlang. Sa mapanlaban na kontekstong pampolitika at militar, ang “linlangin” ang pinakamalinaw na naghahatid ng ipinaparatang na mapanirang pakay, habang inilalagay sa talababa ang tunay na lawak ng kahulugan.
- source_word: בָּא
  choice: naparito siya
  rationale: Ang “naparito” ay natural na nagsasaad ng pagdating ni Abner sa kinaroroonan ni David at ang anyong naganap ng pandiwa.
- source_word: לָדַעַת
  choice: upang alamin
  rationale: Ang pawatas ay nagpapahayag ng layuning mangalap ng impormasyon. Ang “alamin” ay mas natural kaysa “malaman” para sa sinasadyang pagsisiyasat.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: ang iyong paglabas at pagpasok
  rationale: Pinananatili ang magkatambal na Hebreong idyoma at ang merismong sumasaklaw sa kabuuan ng mga pagkilos o gawain ni David.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: ang lahat ng ginagawa mo
  rationale: Ang participle na עֹשֶׂה ay angkop isalin bilang patuloy o kasalukuyang gawain; malinaw itong naihahatid ng “ginagawa mo.”
