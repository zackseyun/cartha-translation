revisions:
- from: Pagkatapos, sinabi ni David kay Joab at sa buong bayang kasama niya, “Punitin ninyo ang inyong mga damit, magsuot kayo ng telang-sako, at magluksa sa harap ni Abner.” At naglalakad si Haring David sa likuran ng higaang pambuhat[a].
  to: Pagkatapos, sinabi ni David kay Joab at sa lahat ng taong kasama niya, “Punitin ninyo ang inyong mga damit, magsuot kayo ng telang-sako, at magluksa sa harap ni Abner.” At si Haring David ay naglalakad sa likuran ng higaang panglibing[a].
  rationale: Pinalitan ang di-likas na “higaang pambuhat” ng “higaang panglibing,” at inayos ang talababa upang malinaw at wastong Filipino ang pagpapaliwanag sa gamit ng Hebreong salita. Pinalitan din ang “buong bayang” ng “lahat ng taong” upang mas tumpak na katawanin ang tinutukoy na pangkat. Napanatili ang literal na “sa harap ni Abner” at ang aspektong nagpapatuloy ng “ay naglalakad.”
