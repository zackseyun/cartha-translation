base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Joab at sa lahat ng taong kasama niya, “Punitin ninyo ang inyong mga damit, magsuot kayo ng telang-sako, at magluksa sa harap ni Abner.” At si Haring David ay naglalakad sa likuran ng higaang panglibing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “higaang pinagbuhatan ng bangkay” o “patungan ng bangkay.” Karaniwang nangangahulugang “higaan” ang salitang Hebreo, ngunit dito ay tumutukoy ito sa higaang pinagpatungan ng bangkay ni Abner habang dinadala.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: Punitin ninyo ang inyong mga damit
  rationale: Tuwirang ipinapahayag ang maramihang utos at ang nakaugaliang pagpunit ng damit bilang tanda ng matinding pagdadalamhati.
- source_word: חִגְרוּ שַׂקִּים
  choice: magsuot kayo ng telang-sako
  rationale: Ang pandiwa ay literal na tumutukoy sa pagbibigkis o pagsusuot ng telang-sako. Ang saling ito ay natural sa makabagong Tagalog at malinaw na inilalarawan ang kaugalian sa pagluluksa.
- source_word: וְסִפְדוּ
  choice: at magluksa
  rationale: Tumutukoy ang ספד sa hayag o pormal na pagdadalamhati para sa namatay; malinaw at marangal ang “magluksa” sa Tagalog.
- source_word: לִפְנֵי אַבְנֵר
  choice: sa harap ni Abner
  rationale: Pinananatili ang literal na ugnayang pangpuwesto. Sa konteksto ng prusisyon, si Abner ay tumutukoy sa kanyang bangkay na dinadala.
- source_word: הֹלֵךְ
  choice: naglalakad
  rationale: Ipinakikita ng participle ang nagpapatuloy na kilos habang nagaganap ang prusisyon.
- source_word: אַחֲרֵי
  choice: sa likuran ng
  rationale: Ang kahulugan dito ay pangpuwesto sa loob ng prusisyon, hindi lamang pagkakasunod sa panahon.
- source_word: הַמִּטָּה
  choice: higaang pambuhat
  rationale: Karaniwang nangangahulugang “higaan” ang salita, ngunit dito ay ang plataporma o higaang pinagbuhatan sa bangkay ni Abner. Iniiwasan ng saling ito ang maling pahiwatig ng isang kabaong.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: At naglalakad si Haring David
  rationale: Natural sa Tagalog ang paglalagay ng titulong “Hari” bago ang pangalan habang pinananatili ang pagbibigay-diin sa kanyang maharlikang katungkulan.
