base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: tl
  text: Noong araw na iyon, nalaman ng buong bayan at ng buong Israel na ang pagpatay kay Abner na anak ni Ner ay hindi nagmula sa hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “hindi ito kagagawan ng hari” o “hindi ito iniutos ng hari.” Sa Hebreo, tumutukoy ang pananalita sa pinagmulan ng pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: nalaman
  rationale: Ipinahihiwatig ng Qal wayyiqtol ng ידע ang pagkabatid o pagkilala sa isang katotohanan; natural sa salaysay ang “nalaman.”
- source_word: כָל הָעָם
  choice: buong bayan
  rationale: Ang עָם dito ay tumutukoy sa mamamayan sa pangkalahatan; malinaw at likas sa Filipino ang kolektibong “buong bayan.”
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ng buong Israel
  rationale: Pinananatili ang kolektibong pambansang katawagan sa Hebreo at ang pagkakaiba nito sa naunang “buong bayan.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na katumbas sa Filipino ng temporal na parirala at pinananatili ang diin sa araw na iyon.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalaman ng bayan.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: hindi nagmula sa hari
  rationale: Pinananatili nito ang diwa ng pinagmulan o pinanggalingan na ipinapahayag ng מִן, sa halip na tahasang sabihing walang sala ang hari o wala siyang iniutos.
- source_word: לְהָמִית
  choice: ang pagpatay
  rationale: Ang Hiphil infinitive ng מות ay nangangahulugang maging sanhi ng kamatayan. Sa kayariang Filipino, ang nominal na “pagpatay” ay malinaw at natural, nang hindi nagpapahiwatig ng pormal na pagbitay.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: kay Abner na anak ni Ner
  rationale: Karaniwang Filipino ang “anak ni Ner” para sa patronimikong katawagan, at pinananatili ang mga pangalang pantangi.
theological_decisions:
- issue: Lawak ng pahiwatig tungkol sa pananagutan ni David sa pagkamatay ni Abner
  choice: Sinasabi lamang na hindi sa hari nagmula ang pagpatay.
  alternative: Walang sala ang hari sa pagkamatay ni Abner; o hindi iniutos ng hari ang pagpatay.
  rationale: Nakatuon ang Hebreo sa pinagmulan ng ginawa, hindi sa tahasang legal o moral na pagpapawalang-sala ni David at hindi rin nito tuwirang binabanggit ang isang utos. Pinananatili ng salin ang mas makitid na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” at “buong Israel” upang mapanatili ang magkatabing kolektibong katawagan ng Hebreo. Ang “hindi nagmula sa hari” ay bahagyang pormal ngunit nauunawaan at sadyang nagpapanatili sa tunay na kalabuan ng orihinal.
