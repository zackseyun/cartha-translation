base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: tl
  text: At nanaghoy ang hari para kay Abner at sinabi, “Dapat bang mamatay si Abner gaya ng pagkamatay ng isang hangal?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: nanaghoy
  rationale: Ang קונן ay tumutukoy sa pagbigkas o pag-awit ng panaghoy para sa namatay. Ang “nanaghoy” ay natural, marangal, at mas tiyak kaysa sa pangkalahatang “nagluksa.”
- source_word: אֶל אַבְנֵר
  choice: para kay Abner
  rationale: Sa konteksto ng panaghoy, minamarkahan ng אֶל ang taong pinatutungkulan o ipinagdadalamhati. Natural sa Filipino ang “panaghoy para kay Abner.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang katumbas ng tiyak na pangngalan at pinananatili ang katawagan ng salaysay sa halip na palitan ito ng pangalang David.
- source_word: וַיֹּאמַר
  choice: sinabi
  rationale: Karaniwang pandiwa ito para sa pagsasalita. Bagaman patula ang kasunod, hindi kailangang gawing “inawit” ang hindi tahasang sinasabi ng Hebreo.
- source_word: הַכְּמוֹת ... יָמוּת
  choice: Dapat bang mamatay ... gaya ng pagkamatay
  rationale: Pinananatili ng retorikal na tanong ang himig ng pagtutol at pagdadalamhati, habang ang “gaya ng pagkamatay” ay malapit sa paghahambing ng Hebreo.
- source_word: נָבָל
  choice: isang hangal
  rationale: Direktang katumbas ang “hangal” at maaari ring magpahiwatig ng kahiya-hiya at masamang asal, nang hindi nililimitahan ang salita sa mas tiyak na “masamang tao” o “walanghiya.”
- source_word: אַבְנֵר
  choice: Abner
  rationale: Karaniwang transliterasyon ng personal na pangalan sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nanaghoy” upang maipakita ang pormal na panaghoy sa patay, at pinanatili ang retorikal na tanong at ang bahagyang tensiyon ng paghahambing sa kamatayan ng isang hangal.
