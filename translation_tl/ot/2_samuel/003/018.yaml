  to: Kaya ngayon, gawin ninyo ito, sapagkat sinabi ni Yahweh tungkol kay David, “Sa pamamagitan ng aking lingkod na si David, ililigtas ko ang aking bayang Israel mula sa kamay ng mga Filisteo at mula sa kamay ng lahat ng kanilang mga kaaway.”[a]
