id: 2SA.3.18
reference: 2 Samuel 3:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: tl
  text: Kaya ngayon, gawin ninyo ito, sapagkat sinabi ni Yahweh tungkol kay David, “Sa pamamagitan ng aking lingkod na si David, ililigtas ko ang aking bayang Israel mula sa kamay ng mga Filisteo at mula sa kamay ng lahat ng kanilang mga kaaway.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ililigtas ng aking lingkod na si David ang aking bayang Israel mula sa kamay ng mga Filisteo at mula sa kamay ng lahat ng kanilang mga kaaway.” Maaaring unawain ang anyong Hebreo na si David ang simuno sa halip na si Yahweh na kumikilos sa pamamagitan ni David.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Hudyat ito ng agarang paglipat mula sa naunang usapan tungo sa pagkilos; likas sa Tagalog ang “Kaya ngayon” at naipahihiwatig nito ang kaugnayan sa naunang sinabi.
- source_word: עֲשׂוּ
  choice: gawin ninyo ito
  rationale: Ang pandiwa ay pautos na maramihan; malinaw na ipinakikita ng “ninyo” na higit sa isang lalaki ang kinakausap, at ang “ito” ay tumutukoy sa planong dapat isagawa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng utos at pinananatili ang marangal ngunit madaling maunawaang himig.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: sinabi ... tungkol kay David
  rationale: Sa konteksto, inuulat ni Abner sa mga matatanda ng Israel ang banal na pahayag hinggil kay David. Bagaman karaniwang nangangahulugang “kay” ang אֶל, posible rito ang relasyong “tungkol kay,” na mas maayos ding umaayon sa sumusunod na pahayag tungkol sa tungkulin ni David.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: Sa pamamagitan ng aking lingkod na si David
  rationale: Ang idyomang בְּיַד ay tumutukoy sa ahensiya o kasangkapan. Mas natural sa modernong Tagalog ang “sa pamamagitan ng” kaysa literal na “sa kamay ni” sa bahaging ito.
- source_word: הוֹשִׁיעַ
  choice: ililigtas ko
  rationale: Binabasa ang walang-yod na anyo bilang unang panauhang pangako ni Yahweh, na kumikilos sa pamamagitan ni David. Gayunman, pinananatili sa talababa ang tunay na posibilidad na si David ang simuno.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: aking bayang Israel
  rationale: Pinananatili ang pag-aangkin sa tipan at ang pangalan ng bayan sa natural na ayos ng Tagalog.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: mula sa kamay ng mga Filisteo at mula sa kamay ng lahat ng kanilang kaaway
  rationale: Pinananatili ang inuulit na idyomang “mula sa kamay,” na tumutukoy sa kapangyarihan o pagkontrol ng kaaway, pati ang diin ng כָּל na “lahat.”
theological_decisions:
- issue: Simuno ng הוֹשִׁיעַ sa siniping pahayag
  choice: 'Si Yahweh ang ipinahiwatig na simuno: “ililigtas ko ... sa pamamagitan ng aking lingkod na si David.”'
  alternative: 'Si David ang simuno: “ililigtas ng aking lingkod na si David ang aking bayang Israel.”'
  rationale: Maaaring unawain ang anyong Hebreo bilang unang panauhan na si Yahweh ang nagsasalita at si David ang kasangkapan, o bilang ikatlong panauhan na si David ang simuno. Pinili sa pangunahing teksto ang unang pagbasa dahil maayos itong tumutugma sa בְּיַד (“sa pamamagitan ng”) at sa pananalita ni Yahweh, ngunit hindi nilulutas nang palihim ang gramatikal at teolohikal na tensiyon; inilalahad ang alternatibo sa talababa.
- issue: Kahulugan ng אֶל דָּוִד
  choice: “tungkol kay David”
  alternative: “kay David”
  rationale: Karaniwang nangangahulugang “kay David” ang parirala, ngunit sa kontekstong iniulat ni Abner sa mga matatanda ang sinabi ni Yahweh hinggil sa paghahari at pagliligtas sa pamamagitan ni David, ang “tungkol kay David” ay isang makatuwirang kontekstuwal na salin. Hindi nito ipinapalagay na naroon si David bilang tuwirang kausap sa mismong tagpo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang “sapagkat” para sa dignidad ng salaysay ngunit iniwasan ang labis na makaluma o teknikal na pananalita. Isinalin nang natural ang idyoma ng ahensiya bilang “sa pamamagitan ng,” samantalang pinanatili ang “mula sa kamay” dahil malinaw at may mahalagang pag-uulit sa Hebreo.
