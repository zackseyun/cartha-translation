translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “buong bayan” para sa kolektibong הָעָם at iniwasan ang sobrang literal na unang idyoma, ngunit pinanatili sa ikalawang pangungusap ang “mabuti sa paningin” upang maipakita ang pag-uulit sa Hebreo.
