base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: tl
  text: Pagkatapos, nagsugo si Abner ng mga mensahero kay David bilang mga kinatawan niya[a], at nagsabi sila, “Kanino ang lupain?” At nagsabi sila, “Makipagtipan ka sa akin, at narito, ang kamay ko ay nasa panig mo[b], upang ibaling sa iyo ang buong Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maikli at mahirap ang pariralang Hebreo. Maaari rin itong literal na unawain na “sa lugar niya”; ipinahihiwatig dito na kumilos ang mga mensahero bilang mga kinatawan ni Abner.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “ang kamay ko ay kasama mo.” Ang “kamay” ay larawan ng kapangyarihan at suportang ilalaan ni Abner sa panig ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: sa kanyang ngalan
  rationale: Sa kontekstong ito, ipinahihiwatig ng parirala na kumikilos ang mga mensahero bilang mga kinatawan ni Abner. Mas natural ito sa modernong Tagalog kaysa sa literal na “sa ilalim niya” o “sa lugar niya,” habang kinikilala sa talababa ang pagiging maikli at mahirap ng Hebreo.
- source_word: לְמִי אָרֶץ
  choice: Kanino ang lupain?
  rationale: Pinananatili nito ang maikli at retorikal na tanong tungkol sa pag-aari o karapatang mamuno, nang hindi tahasang nagpapasiya kung inaangkin ni Abner ang lupain o tinutukoy ang lehitimong hari.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Makipagtipan ka sa akin
  rationale: Ang כרת ברית ay karaniwang idyoma para sa paggawa ng tipan. Ang “makipagtipan” ay malinaw at natural sa Tagalog at ipinapakita ang pakikipagkasundo sa pagitan ng dalawang panig.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: Narito, ang kamay ko ay kakampi mo
  rationale: Pinananatili ang metapora ng “kamay” bilang kapangyarihan at suporta, sa halip na patagin lamang bilang “kakampi mo ako.”
- source_word: לְהָסֵב אֵלֶיךָ
  choice: upang ibaling sa iyo
  rationale: Ipinahihiwatig ng pandiwa ang pagpapalit ng katapatan o pagkiling sa pulitika. Ang “ibaling sa iyo” ay nagpapanatili sa larawang direksiyonal ng Hebreo.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Tumutukoy ito sa Israel bilang kabuuang sambayanan o mga lipi, hindi lamang sa ilang indibidwal.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa pampulitikang kontekstong ito, mga taong sugo ang tinutukoy, hindi mga anghel.
theological_decisions:
- issue: Kahulugan ng retorikal na tanong na לְמִי אָרֶץ
  choice: 'Pinanatili bilang tuwirang tanong: “Kanino ang lupain?”'
  alternative: Maaaring palawakin bilang “Sino ang dapat mamuno sa lupain?” o unawain bilang pahiwatig na nasa kapangyarihan ni Abner ang lupain.
  rationale: Maikli at eliptikal ang Hebreo. Ang tuwirang tanong ay nagpapanatili sa tensiyong pampulitika at sa kalabuan tungkol sa eksaktong ipinahihiwatig ni Abner.
- issue: Metapora ng kamay sa וְהִנֵּה יָדִי עִמָּךְ
  choice: Pinanatili ang “kamay” bilang larawan ng suporta at kapangyarihan.
  alternative: Isalin lamang bilang “kakampi mo ako” o “susuportahan kita.”
  rationale: Mahalaga sa pahayag ni Abner ang diin sa kapangyarihang magagawa niyang gamitin para kay David; hindi ito simpleng pagpapahayag lamang ng personal na pakikiisa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikling retorikal na tanong at ang metapora ng kamay, samantalang ginawang natural ang karaniwang idyoma para sa paggawa ng tipan.
