base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: tl
  text: Nagsalita rin si Abner sa mga taga-Benjamin, at pumunta rin siya sa Hebron upang sabihin kay David ang lahat ng itinuturing na mabuti ng Israel at ng buong sambahayan ni Benjamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng kalugod-lugod sa Israel at sa buong sambahayan ni Benjamin.”
    reason: Pinananatili ang posibleng diwa ng Hebreong idyoma na tumutukoy sa itinuturing na mabuti, kalugod-lugod, o katanggap-tanggap.
lexical_decisions:
- source_word: בְּאָזְנֵי בִנְיָמִין
  choice: sa mga taga-Benjamin
  rationale: Ang literal na idyomang “sa mga tainga ng Benjamin” ay tumutukoy sa pakikipag-usap sa mga kabilang sa tribo. Natural sa modernong Tagalog ang “sa mga taga-Benjamin.”
- source_word: בְּאָזְנֵי דָוִד
  choice: sabihin kay David
  rationale: Ipinapahayag nito nang natural ang Hebreong idyoma ng pagsasalita sa pandinig ng isang tao, nang hindi nagdaragdag ng ideya ng pribado o pormal na pakikipag-usap.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Karaniwang panandang pook sa Tagalog ang “sa” at ang Hebron ang lugar na pinuntahan ni Abner upang kausapin si David.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: ang lahat ng minabuti ng
  rationale: Ang “mabuti sa mga mata ng” ay idyomang nangangahulugang itinuring na mabuti, kalugod-lugod, o katanggap-tanggap. Pinananatili ng “minabuti” ang pagpapahalagang ipinahihiwatig nang natural sa Tagalog.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginagamit ang pambansang pangalan bilang kolektibong katawagan sa bayan, gaya sa Hebreo.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: buong sambahayan ni Benjamin
  rationale: Pinananatili ng “sambahayan” ang kinship-political na larawan ng בֵּית, sa halip na tahasang paliitin ito sa “tribo” lamang.
- source_word: גַּם ... גַּם
  choice: rin ... rin
  rationale: Pinananatili ang magkatugmang pagdaragdag at diin ng dalawang paglitaw ng גַּם.
