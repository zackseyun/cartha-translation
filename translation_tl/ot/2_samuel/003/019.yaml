  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga taga-Benjamin” para sa kolektibong tribal na pangalan sa unang sugnay, ngunit pinanatili ang “buong sambahayan ni Benjamin” sa ikalawa upang maipakita ang tekstura ng Hebreong pariralang pangkamag-anakan at pampolitika.
