translation_notes:
  register: Makabago at dignified na salaysay sa Filipino. Ginamit ang “magawang sumagot” upang ipakita ang kawalan ng kakayahan dahil sa takot, at ang “rito” upang maging malinaw na si Abner ang kinatatakutan.
