base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: tl
  text: Umalis si Joab mula sa piling ni David at nagsugo ng mga mensahero upang habulin si Abner. Dinala nila siyang pabalik mula sa balon ng Sirah.[a] Ngunit hindi ito alam ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mula sa Bor-Sirah,” kung ituturing ang Hebreong teksto bilang pangalan ng lugar sa halip na “balon ng Sirah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... מֵעִם דָּוִד
  choice: Pagkaalis ni Joab sa kinaroroonan ni David
  rationale: Ipinahahayag ng מֵעִם ang paglayo mula sa piling o kinaroroonan ng isang tao. Natural sa modernong Tagalog ang pariralang ito at napapanatili ang konkretong pag-alis.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong isinugo ang tinutukoy sa kontekstong ito, hindi mga anghel.
- source_word: אַחֲרֵי אַבְנֵר
  choice: upang habulin si Abner
  rationale: Sa konteksto, ang אַחֲרֵי ay nagpapahiwatig ng pagsunod o pagtugis kay Abner; malinaw at natural ang 'habulin' sa Tagalog.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: Pinabalik nila siya
  rationale: 'Ang Hiphil ng שׁוב ay may diwang sanhi: pinangyari nilang bumalik si Abner. Napapanatili ng ''pinabalik'' ang causative na anyo nang hindi ipinapalagay kung sapilitan ang pagbabalik.'
- source_word: מִבּוֹר הַסִּרָה
  choice: mula sa balon ng Sira
  rationale: Maaaring tumukoy ang בּוֹר sa balon, imbakan ng tubig, o hukay. Ang 'balon ng Sira' ay malinaw at tradisyonal na pagbasa, habang inilalahad sa talababa ang posibleng pangalang-pook.
- source_word: וְדָוִד לֹא יָדָע
  choice: Ngunit hindi ito alam ni David
  rationale: Natural na ipinakikita ng 'ngunit' ang pagsalungat sa naunang lihim na pagkilos ni Joab, at ang 'ito' ay tumutukoy sa buong pangyayari nang walang idinadagdag na detalye.
