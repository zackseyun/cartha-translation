translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang 'kinaroroonan ni David' upang natural na maipahayag ang pag-alis mula sa piling niya, at pinanatili ang tunay na kawalang-katiyakan sa pangalang Bor-Sira sa talababa.
