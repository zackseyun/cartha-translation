revisions:
- from: Pagkaalis ni Joab sa kinaroroonan ni David, nagsugo siya ng mga mensahero upang habulin si Abner. Pinabalik nila siya mula sa balon ng Sira.[a] Ngunit hindi ito alam ni David.
  to: Umalis si Joab mula sa piling ni David at nagsugo ng mga mensahero upang habulin si Abner. Dinala nila siyang pabalik mula sa balon ng Sirah.[a] Ngunit hindi ito alam ni David.
  rationale: Pinalitan ang transliterasyon ng pangalang lugar ng “Sirah” para sa mas malapit na pagkakatugma sa Hebreo. Pinagaan din ang unang sugnay para sa natural na modernong Tagalog at ginawang “Dinala nila siyang pabalik” ang causative na pagbabalik, nang hindi nagpapahiwatig ng pamimilit o nagdaragdag ng detalye.
