  source_fidelity: 'Tumpak sa pangkalahatan ang salin: malinaw na mga taong mensahero ang tinutukoy, naipahahayag ang pagpapasunod/paghabol kay Abner, ang pagbabalik niya, at ang kawalang-kaalaman ni David. Gayunman, mas ligtas na panatilihin ang anyong pangalan na “Sirah,” na mas malapit sa Hebreong הַסִּרָה at sa audit trail, kaysa “Sira.”'
  naturalness: Natural ang daloy, ngunit ang “Pagkaalis ni Joab sa kinaroroonan ni David” ay medyo nominal at mahaba para sa sunod-sunod na salaysay. Ang “Umalis si Joab mula sa piling ni David” ay mas tuwiran at natural. Ang “dinala nila siyang pabalik” ay malinaw na idiomatikong Tagalog para sa causative na pagbabalik.
  terminology: Ang “mga mensahero,” “balon,” at “David/Joab/Abner” ay angkop. Isinaayos ang “Sira” bilang “Sirah” upang mapanatili ang pagkakakilanlan ng pangalang lugar at maiwasan ang hindi kinakailangang pag-aangkop ng pangalan.
