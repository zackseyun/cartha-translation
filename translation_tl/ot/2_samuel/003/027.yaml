  text: וַ/יָּ֤שָׁב אַבְנֵר֙ חֶבְר֔וֹן וַ/יַּטֵּ֤/הוּ יוֹאָב֙ אֶל תּ֣וֹךְ הַ/שַּׁ֔עַר לְ/דַבֵּ֥ר אִתּ֖/וֹ בַּ/שֶּׁ֑לִי וַ/יַּכֵּ֤/הוּ שָׁם֙ הַ/חֹ֔מֶשׁ וַ/יָּ֕מָת בְּ/דַ֖ם עֲשָׂה אֵ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: tl
  text: Nang bumalik si Abner sa Hebron, inilihis siya ni Joab patungo sa loob ng tarangkahan upang kausapin nang sarilinan.[a] Doon ay hinampas niya si Abner sa tiyan,[b] at namatay ito dahil sa dugo ni Asahel, na kapatid ni Joab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “upang kausapin nang tahimik” o “nang payapa.” Hindi tiyak ang kahulugan ng salitang Hebreo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “sa ikalimang tadyang,” isang tradisyonal na salin ng ekspresyong tumutukoy sa bahagi ng tiyan o puson.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: makabalik
  rationale: Ang שׁוב ay nangangahulugang bumalik; ipinahihiwatig ng konteksto na bumalik si Abner sa Hebron matapos siyang paalisin.
- source_word: וַיַּטֵּהוּ
  choice: inilihis siya
  rationale: 'Pinananatili nito ang direksiyonal na diwa ng hiphil ng נטה: inilayo ni Joab si Abner sa dinaraanan nito at dinala sa ibang puwesto.'
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: papasok sa tarangkahan
  rationale: Ang תּוֹךְ ay tumutukoy sa loob o gitna, at ang שַׁעַר ay maaaring tumukoy sa buong estruktura o daanan ng tarangkahan. Natural sa Tagalog ang 'papasok sa tarangkahan' at pinananatili nito ang kilos patungo sa loob.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: upang kausapin nang sarilinan
  rationale: Mahirap tiyakin ang eksaktong diwa ng בַּשֶּׁלִי; maaari itong magpahiwatig ng katahimikan, kapanatagan, o pagiging pribado. Ang 'nang sarilinan' ay angkop sa tagpo ngunit may talababa upang mapanatili ang kawalang-katiyakan.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: Doon ay sinaksak niya si Abner sa tiyan
  rationale: Karaniwang tumutukoy ang נכה sa paghampas o pananakit, ngunit sa tagpong ito ang nakamamatay na sugat sa tiyan ay natural na isinasalin bilang 'sinaksak.' Ang חֹמֶשׁ ay tumutukoy sa bahagi ng tiyan o puson; inilalagay sa talababa ang tradisyonal na 'ikalimang tadyang.'
- source_word: וַיָּמָת
  choice: at namatay ito
  rationale: Tuwirang pinananatili ang sunod na pangyayari sa Hebreo nang hindi dinaragdagan ang ugnayang sanhi.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: dahil sa dugo ni Asahel na kapatid niya
  rationale: Ang בְּ ay nagpapahayag dito ng dahilan o motibo. Pinananatili ng 'dahil sa dugo' ang maikli at may legal-na-paghihiganting himig ng Hebreo nang hindi tahasang idinaragdag ang salitang 'paghihiganti.'
theological_decisions:
- issue: Ang moral o legal na paglalarawan sa pagpatay ni Joab
  choice: Hindi tahasang tinawag na paghihiganti o makatarungang pagganti; isinaling 'dahil sa dugo ni Asahel.'
  alternative: bilang paghihiganti sa pagkamatay ni Asahel
  rationale: Binabanggit ng Hebreo ang dugo bilang dahilan ngunit hindi tahasang nagbibigay rito ng moral na pagsang-ayon o gumagamit ng karaniwang salita para sa paghihiganti. Pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'tarangkahan' para sa estruktura o daanan ng pintuang-bayan at 'tiyan' sa halip na mas teknikal na 'abdomen.' Ang panghalip sa 'kapatid niya' ay nagpapanatili sa anyong Hebreo, bagaman malinaw sa konteksto na si Asahel ay kapatid ni Joab.
