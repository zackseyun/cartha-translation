  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יוֹאָב֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָה הִנֵּה בָ֤א אַבְנֵר֙ אֵלֶ֔י/ךָ לָ/מָּה זֶּ֥ה שִׁלַּחְתּ֖/וֹ וַ/יֵּ֥לֶךְ הָלֽוֹךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: tl
  text: Pagkatapos, pumunta si Joab sa hari at sinabi, “Ano ang ginawa mo? Tingnan mo, pumunta sa iyo si Abner. Bakit mo naman siya pinaalis? Tuluyan na siyang umalis[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at umalis siya, na umaalis”—isang madiing anyo na nangangahulugang tiyak o ganap na siyang umalis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, pumunta
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa modernong Filipino ang “Pagkatapos” bilang panandang pagkakasunod-sunod.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Direkta at natural na katumbas ng pariralang patungo sa hari.
- source_word: מֶה עָשִׂיתָה
  choice: Ano ang ginawa mo?
  rationale: Pinananatili ang tahasang tanong at ang mapanumbat na tono ni Joab.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na nagpapanatili sa madiing puwersa ng הִנֵּה nang hindi gumagamit ng makalumang pananalita.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: pumunta sa iyo si Abner
  rationale: Malinaw na inilalahad ang paglapit ni Abner kay David; pinanatili ang karaniwang kahulugan ng בוא sa kontekstong ito.
- source_word: לָמָּה זֶּה
  choice: Bakit mo naman
  rationale: Ipinahahayag ng “naman” ang madiin at mapanumbat na puwersa ng kombinasyon, sa natural na Filipino, nang hindi pilit na isinasalin ang demonstratibo.
- source_word: שִׁלַּחְתּוֹ
  choice: siya pinaalis
  rationale: Ang Piel ng שלח ay tumutukoy rito sa pagpapayaon o pagpapaalis; malinaw na nananatili kay David ang pananagutan sa kilos.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: Tuluyan na siyang umalis
  rationale: Ipinahahayag ng “tuluyan” ang diin ng pandiwang may kasamang infinitive absolute at ang ganap na pag-alis ni Abner.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang bigla at mapanumbat na pananalita ni Joab, habang iniwasan ang salitang-salitang anyong magiging pilit sa Tagalog.
