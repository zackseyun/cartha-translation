base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa kanyang mga lingkod, “Hindi ba ninyo alam na isang pinuno[a] at dakilang tao ang namatay sa Israel sa araw na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang prinsipe” o “isang kumandante.” Ang Hebreong שַׂר ay maaaring tumukoy sa isang prinsipe, kumandante, pinuno, o mataas na opisyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan; malinaw sa konteksto na si David ang tinutukoy.
- source_word: עֲבָדָיו
  choice: sa kanyang mga lingkod
  rationale: Pinananatili ng “mga lingkod” ang karaniwang diwa ng עֶבֶד sa konteksto ng maharlikang sambahayan, nang hindi ipinapalagay na pawang mga opisyal sila.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Hindi ba ninyo alam
  rationale: Isang retorikal na tanong ito na umaasang sasang-ayon ang mga kausap; malapit at natural ang salin.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng dapat nilang malaman.
- source_word: שַׂר
  choice: pinuno
  rationale: Maaaring tumukoy ang שַׂר sa pinuno, prinsipe, kumandante, o mataas na opisyal. Ang “pinuno” ay natural at sapat na malawak para sa katayuang militar at pampolitika ni Abner.
- source_word: וְגָדוֹל
  choice: at dakilang tao
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at binibigyang-diin ang mataas na katayuan at kahalagahan ng taong tinutukoy.
- source_word: נָפַל
  choice: namatay
  rationale: Literal na “bumagsak,” ngunit sa mataas na pananalitang Hebreo ay isang idyoma ito para sa pagkamatay; malinaw at natural sa Filipino ang “namatay.”
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Malapit sa literal na anyo at angkop sa marangal na tono ng pahayag.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ipinahahayag ang pambansang saklaw kung saan naganap at nadama ang pagkamatay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “pinuno” kaysa “prinsipe” dahil mas natural ito sa konteksto ni Abner at napapanatili ang lawak ng Hebreong termino. Isinama ang marker na [a] kaagad pagkatapos ng salitang tinutukoy.
