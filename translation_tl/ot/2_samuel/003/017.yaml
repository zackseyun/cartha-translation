  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: tl
  text: Nauna nang nakipag-usap si Abner sa mga nakatatanda ng Israel. Sinabi niya, “Noon pa man ay hinahangad na ninyong maging hari ninyo si David.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Nakipag-usap si Abner sa
  rationale: Ang idyomang Hebreo ay literal na tumutukoy sa pagkakaroon ng salita o usapan ni Abner sa mga pinuno; ang “nakipag-usap” ay likas na Tagalog at pinananatili ang diwa ng pakikipagsangguni.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: matatandang pinuno ng Israel
  rationale: Ang זְקֵנִים ay hindi lamang tumutukoy sa matatanda sa edad kundi sa kinikilalang mga pinuno ng pamayanan; nililinaw ito nang hindi gumagamit ng di-likas na “mga elder.”
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: Matagal na
  rationale: Idyoma itong nangangahulugang dati pa o sa loob ng ilang panahon, hindi kinakailangang literal na kahapon at noong isang araw.
- source_word: הֱיִיתֶם מְבַקְשִׁים
  choice: ninyong hinahangad
  rationale: Ang anyo ay nagpapahiwatig ng nagpapatuloy o dating umiiral na pagnanais/paghahanap; ang “matagal na ninyong hinahangad” ay natural na nagpapahayag nito.
- source_word: אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: na maging hari ninyo si David
  rationale: Natural na Tagalog para sa hangaring iluklok si David bilang hari na mamamahala sa kanila.
