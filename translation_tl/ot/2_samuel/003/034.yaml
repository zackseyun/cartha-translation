base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: tl
  text: 'Hindi nakagapos ang iyong mga kamay,

    at hindi inilagay sa mga tanikalang tanso ang iyong mga paa.

    Gaya ng isang bumabagsak sa harap ng masasamang tao[a],

    gayon ka bumagsak.”

    At lalo pang tumangis para sa kanya ang buong bayan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng kalikuan” o “mga anak ng kawalang-katarungan,” isang Hebreong idyoma para sa masasamang tao o mga gumagawa ng masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Hindi nakagapos ang iyong mga kamay
  rationale: Ang pasibong anyo ng אָסַר ay tumutukoy sa pagiging nakatali o nakagapos. Ang “nakagapos” ay natural sa Filipino at angkop sa paghahambing kay Abner sa isang bihag o hinatulang tao.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: at hindi inilagay sa mga tanikalang tanso ang iyong mga paa
  rationale: Ang נְחֻשְׁתַּיִם ay mga panaling metal na yari sa tanso o bronse. Pinananatili ng “mga tanikalang tanso” ang materyal at ang diwa ng panali sa mga paa, samantalang natural na ipinahahayag ng “inilagay sa” ang idyomatikong gamit ng הֻגָּשׁוּ.
- source_word: כִּנְפוֹל
  choice: Gaya ng isang bumabagsak
  rationale: Ang כ na ikinabit sa infinitive ay naghahayag ng paghahambing. Idinagdag ang “isang” upang maging natural sa Filipino nang hindi tinutukoy ang isang partikular na tao.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: sa harap ng masasamang tao
  rationale: Ang literal na “mga anak ng kalikuan/kawalang-katarungan” ay isang Hebreong idyoma para sa mga taong masama o gumagawa ng mali. Ang “masasamang tao” ay malinaw at likas sa modernong Filipino; iniingatan sa talababa ang literal na anyo.
- source_word: נָפָלְתָּ
  choice: gayon ka bumagsak
  rationale: Ang pandiwa ay nagsasaad ng natapos na kalunus-lunos na pangyayari. Ang payak na naganap na “bumagsak” ay angkop sa panaghoy sa Filipino, at ang “gayon” ay nag-uugnay nito sa naunang paghahambing.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: At lalo pang tumangis para sa kanya ang buong bayan
  rationale: Ang יָסַף na sinusundan ng infinitive ay maaaring mangahulugang nagpatuloy o lalo pang gumawa ng isang bagay. Dahil tumangis na ang bayan bago ang awit ni David, ipinahahayag ng “lalo pang tumangis” ang pag-igting ng kanilang pagdadalamhati.
