  terminology: Wasto ang “Diyos,” “nanumpa,” “tinapay,” at “titikim.” Ang pormula ng sumpa ay nananatiling di-tiyak, gaya ng Hebreo, at hindi nagdaragdag ng espesipikong parusa.
