base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: tl
  text: Lumapit ang buong bayan upang pakainin si David ng tinapay[a] habang araw pa. Ngunit nanumpa si David, “Gawin nawa ito sa akin ng Diyos, at higit pa rito[b], kung titikim ako ng tinapay o ng anuman bago lumubog ang araw.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinapay”; maaari rin itong tumukoy sa pagkain sa pangkalahatan, ngunit pinanatili rito ang konkretong salita.
    reason: lexical_alternative
  - marker: b
    text: Ito ay nakaugaliang pormula ng sumpang ipinapataw sa sarili. Hindi tahasang sinabi sa Hebreo kung anong parusa ang hinihiling ng nanunumpa na ipataw sa kaniya.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: upang himukin ... na kumain
  rationale: Ang Hiphil ng ברה sa kontekstong ito ay tumutukoy sa pagpapakain o paghikayat na kumain, lalo na kaugnay ng pagluluksa. Likas sa modernong Tagalog ang “himukin ... na kumain.”
- source_word: לֶחֶם
  choice: tinapay
  rationale: Bagaman maaari itong tumukoy sa pagkain sa pangkalahatan, pinanatili ang konkretong “tinapay,” gaya ng Hebreo.
- source_word: בְּעוֹד הַיּוֹם
  choice: habang maliwanag pa
  rationale: Ipinahihiwatig ng parirala na hindi pa tapos ang araw; natural itong kaagapay ng kasunod na pagtukoy sa paglubog ng araw.
- source_word: וַיִּשָּׁבַע
  choice: nanumpa
  rationale: Tuwirang salin ng pandiwa para sa taimtim na panunumpa.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Gawin nawa ito sa akin ng Diyos, at higit pa rito
  rationale: Pinananatili nito ang nakaugaliang pormula ng sumpang ipinapataw sa sarili nang hindi tinutukoy ang parusang hindi rin tahasang binanggit sa Hebreo.
- source_word: כִּי אִם
  choice: kung
  rationale: Sa pormula ng panunumpa, ipinakikilala nito ang kondisyong magpapairal sa sumpa; “kung” ang natural na katumbas sa Tagalog.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: bago lumubog ang araw
  rationale: Ito ang malinaw at likas na Tagalog para sa idyomatikong kahulugang “bago sumapit ang paglubog ng araw.”
- source_word: אֶטְעַם
  choice: titikim ako
  rationale: Pinananatili ang literal na “tikim,” na nagbibigay-diin na hindi kakain si David kahit kaunti.
- source_word: אוֹ כָל מְאוּמָה
  choice: o ng anuman
  rationale: Pinalalawak nito ang panata mula sa tinapay tungo sa kahit anong pagkain o bagay na maaaring tikman.
theological_decisions:
- issue: Pormula ng sumpang ipinapataw sa sarili
  choice: Gawin nawa ito sa akin ng Diyos, at higit pa rito
  alternative: Parusahan nawa ako ng Diyos nang matindi
  rationale: Hindi tinukoy ng Hebreo ang mismong parusa, kaya pinanatili ng salin ang sadyang di-tiyak na pormula sa halip na ipaliwanag ito nang higit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “tinapay” at “titikim” upang maingatan ang konkretong larawan at diin ng Hebreo, habang ginawang natural ang temporal na pariralang “habang maliwanag pa.”
