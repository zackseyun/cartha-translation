base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: tl
  text: Ipinanganak kay David sa Hebron ang mga anak na lalaki, at ang panganay niya ay si Amnon, na anak niya kay Ahinoam na taga-Jezreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang babaeng Jezreelita” o “ang babaeng mula sa Jezreel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/ילדו
  choice: Ipinanganak
  rationale: 'Pinananatili nito ang pasibo o di-tiyak na pokus ng pandiwang Hebreo: ang mahalaga ay ang pagsilang ng mga anak kay David, hindi ang pagtukoy sa mga ina bilang simuno.'
- source_word: לְ/דָוִד
  choice: kay David
  rationale: Likas na ipinapahayag ng “kay” ang kaugnayan ng mga anak kay David sa pormulang pangangkanakan.
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy ng Hebreo, hindi mga anak sa pangkalahatan.
- source_word: בְּ/חֶבְרוֹן
  choice: sa Hebron
  rationale: Tuwirang panandang panlunan ang preposisyong Hebreo.
- source_word: וַ/יְהִי
  choice: at ... ay
  rationale: Payak at natural na pag-uugnay ito sa Filipino habang ipinakikilala ang pagkakakilanlan ng panganay.
- source_word: בְכוֹר/וֹ
  choice: ang panganay niya
  rationale: Pinananatili ng “panganay” ang pagkakasunod sa kapanganakan at ang posibleng pampamilya o legal na kabuluhan ng termino.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: לַ/אֲחִינֹעַם
  choice: na anak niya kay Ahinoam
  rationale: Sa talaan ng mga kapanganakan, ipinahihiwatig ng parirala na si Ahinoam ang ina ni Amnon. Ang bahagyang pagpapalinaw na “anak niya” ay kailangan para maging likas at malinaw sa Filipino.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: na taga-Jezreel
  rationale: Ipinapahayag nito nang natural sa modernong Filipino ang pambabaeng katawagang tumutukoy sa pinagmulan ni Ahinoam.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak na lalaki” para sa tiyak na kasarian ng בָּנִים at “taga-Jezreel” bilang pinakanatural na katumbas ng pambabaeng katawagang heograpiko. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
