  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: tl
  text: at ang ikaanim ay si Itream, na ipinanganak kay Egla, asawa ni David.[a] Ang mga ito ay ipinanganak kay David sa Hebron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “asawa ni David.” Tinutukoy rito si Egla bilang isa sa mga asawa ni David, hindi bilang nag-iisa niyang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: at ang ikaanim
  rationale: Ipinagpapatuloy ng pangatnig at pamilang panunuran ang talaan ng mga anak ni David sa naunang mga talata. Hindi na kailangang idagdag ang “anak” dahil malinaw ito sa konteksto.
- source_word: יִתְרְעָם
  choice: Itream
  rationale: Isinulat ang pangalang Hebreo sa anyong likas at madaling bigkasin sa Filipino.
- source_word: לְעֶגְלָה
  choice: kay Egla
  rationale: Sa pormulang ito ng talaan ng kapanganakan, tinutukoy ng לְ ang ina. Ang “kay Egla” ay maikli at likas sa Filipino sa kontekstong “ang ikaanim ... kay Egla.”
- source_word: אֵשֶׁת דָּוִד
  choice: asawa ni David
  rationale: Tuwirang isinasalin ang pariralang konstrukto bilang “asawa ni David,” nang hindi ipinahihiwatig na siya lamang ang asawa ni David.
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Binubuod ng panghalip na pamatlig ang naunang talaan; malinaw sa konteksto na mga anak ang tinutukoy.
- source_word: יֻלְּדוּ
  choice: ay ipinanganak
  rationale: Ang balintiyak na anyo ng ילד sa pormulang genealogical ay likas na isinasaling “ipinanganak.”
- source_word: לְדָוִד
  choice: kay David
  rationale: 'Sa mga talaan ng angkan, ipinakikita ng ילד na may kasamang לְ ang kaugnayan sa magulang: “ipinanganak kay David.”'
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Isinasalin ng “sa” ang panandang panlunan at tinutukoy ang lugar ng mga kapanganakan.
