base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: tl
  text: Nang dumating si Joab at ang buong hukbong kasama niya, ibinalita nila kay Joab, “Dumating si Abner na anak ni Ner sa hari, at pinayagan siyang umalis ng hari; umalis siya nang payapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצָּבָא
  choice: hukbo
  rationale: Ang pangngalan ay tumutukoy sa pangkat ng mga mandirigmang kasama ni Joab; natural at tumpak sa kontekstong militar ang “hukbo.”
- source_word: וַיַּגִּדוּ לְיוֹאָב לֵאמֹר
  choice: ibinalita kay Joab
  rationale: Ang Hebreong pormula ay likas na maisasalin sa modernong Tagalog bilang pag-uulat; hindi kailangang literal na ulitin ang “na sinasabi.”
- source_word: אֶל הַמֶּלֶךְ
  choice: kay Haring David
  rationale: Ang “hari” sa agarang konteksto ay si David. Ginagawang malinaw ang reperente nang hindi binabago ang kahulugan.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: pinayaon siya ng hari
  rationale: Ipinahihiwatig ng pandiwa na pinahintulutan o pinaalis siya; ang tahasang “ng hari” ay nililinaw ang paksa ng pandiwa mula sa konteksto.
- source_word: בְּשָׁלוֹם
  choice: payapa
  rationale: Pinananatili nito ang diwa ng ligtas at mapayapang pag-alis nang hindi pinipiling eksklusibo ang alinman sa “nang walang pinsala” o “bilang kaibigan.”
theological_decisions:
- issue: Kahulugan ng pag-alis ni Abner בְּשָׁלוֹם
  choice: umalis siyang payapa
  alternative: umalis siyang ligtas / walang pinsala
  rationale: Malawak ang saklaw ng שָׁלוֹם at maaaring tumukoy sa mapayapa o ligtas na kalagayan. Pinananatili ng “payapa” ang saklaw at ang tensiyon sa kasunod na kilos ni Joab.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Iniwasan ang lipas na “sinabi sa pagsasabi” at pinanatili ang tuwiran, pasalaysay na daloy.
