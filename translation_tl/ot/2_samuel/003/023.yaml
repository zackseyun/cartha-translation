  terminology: Ang “hukbo,” “hari,” at “payapa” ay angkop. Pinananatili ng “nang payapa” ang malawak na diwa ng בְּשָׁלוֹם nang hindi ito nililimitahan sa kaligtasan o pakikipagkaibigan.
