  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: tl
  text: Dumating si Abner kay David sa Hebron, kasama ang dalawampung lalaki. Naghanda si David ng isang handaan[a] para kay Abner at sa mga lalaking kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagdaos ng isang piging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang בוא ay maaaring mangahulugang ‘pumarito,’ ‘pumunta,’ o ‘dumating’ ayon sa pananaw. Dahil nakatuon ang salaysay sa pagdating ni Abner kay David, natural at tumpak ang ‘Dumating.’
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: kay David sa Hebron
  rationale: Bagaman walang tahasang pang-ukol bago ang חֶבְרוֹן, ipinakikita ng konteksto na ang Hebron ang kinaroroonan ni David. Malinaw at likas sa Tagalog ang ‘kay David sa Hebron.’
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: kasama ang dalawampung lalaki
  rationale: Ang parirala sa Hebreo ay walang pandiwa at nagsasaad na dalawampung lalaking kasama ang dumating na si Abner. Pinananatili ng ‘lalaki’ ang tiyak na kahulugan ng אֲנָשִׁים sa kontekstong ito.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: Naghanda ... ng isang handaan
  rationale: Ang literal na idyomang ‘gumawa ng handaan’ ay hindi likas sa modernong Tagalog. Ang ‘naghanda ng isang handaan’ ay natural na nagpapahayag ng paglalaan o pagdaraos ni David ng salu-salo.
- source_word: מִשְׁתֶּה
  choice: handaan
  rationale: Ang מִשְׁתֶּה ay handaan o piging, na maaaring may kasamang pag-inom. Sapat ang malawak at karaniwang salitang ‘handaan’ nang hindi labis na tinutukoy ang pag-inom.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: para kay Abner at sa mga lalaking kasama niya
  rationale: Malinaw na pinananatili nito ang dalawang pinaglaanan ng handaan—si Abner at ang mga lalaking kasama niya—nang hindi ipinapalagay na sila ay pag-aari o permanenteng tauhan niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang ‘dumating’ at ‘naghanda ng isang handaan’ upang maipahayag nang idiomatiko ang Hebreong salaysay habang pinananatili ang detalye at ayos ng pangyayari.
