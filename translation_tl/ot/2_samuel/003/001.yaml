base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: tl
  text: Nagtagal[a] ang digmaan sa pagitan ng sambahayan[b] ni Saul at ng sambahayan ni David. Patuloy na lumalakas si David, samantalang patuloy na humihina ang sambahayan ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mahaba,” na tumutukoy sa tagal ng digmaan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” ay maaaring tumukoy sa pamilya o angkan, pati sa naghaharing angkan o dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: Nagtagal ang digmaan
  rationale: Ang אֲרֻכָּה ay literal na “mahaba,” ngunit tumutukoy rito sa tagal ng digmaan. Likas at malinaw sa modernong Tagalog ang “nagtagal ang digmaan.” Hindi na dinagdagan ng panimulang “Ngayon” dahil walang tahasang salitang temporal na ganito sa Hebreo.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: sa pagitan ng sambahayan ni Saul at ng sambahayan ni David
  rationale: Pinananatili ng “sambahayan” ang kolektibong diwa ng בֵּית bilang pamilya o angkan at maaari ring tumukoy sa naghaharing sambahayan; hindi ito kinikitid sa “dinastiya” lamang.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: Patuloy na lumalakas si David
  rationale: Ang hulma na may הֹלֵךְ at kasunod na panaguri ay nagpapahayag ng nagpapatuloy na pagbabago. Tumpak at natural itong ipinahahayag ng “patuloy na lumalakas.”
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: patuloy na humihina ang sambahayan ni Saul
  rationale: Ipinakikita ng parirala ang tuloy-tuloy na paghina ng sambahayan ni Saul, bilang tuwirang kaibahan sa paglakas ni David.
- source_word: דַלִּים
  choice: humihina
  rationale: Sa kontekstong militar at pampolitika, ang salita ay tumutukoy sa pagkawala ng lakas o kapangyarihan, hindi sa kahirapang pangkabuhayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagtagal” at ang magkatugmang “patuloy na lumalakas/humihina” upang likas na maipahayag ang duratibo at progresibong diwa ng Hebreo, habang pinananatili ng “sambahayan” ang pampamilya at pampolitikang lawak ng בֵּית.
