base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: tl
  text: Nawa’y bumagsak ito sa ulo ni Joab at sa buong sambahayan ng kanyang ama. Huwag sanang mawalan kailanman ang sambahayan ni Joab ng taong may agas sa katawan, may ketong[a], humahawak ng suliran[b], namamatay sa tabak, o kapos sa pagkain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may malubhang sakit sa balat na nagpaparumi.” Mas malawak ang maaaring saklaw ng salitang Hebreo kaysa sa sakit na Hansen na karaniwang tinatawag ngayong ketong.
    reason: lexical_alternative
  - marker: b
    text: O “sumasandal sa tungkod.” Karaniwang nangangahulugang “suliran” ang salitang Hebreo, ngunit iba ang pagkaunawa ng ilan sa pariralang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: Mapasaulo ... ang pananagutan dito
  rationale: Ang idyomang Hebreo ay nagsasaad na ang pananagutan o kaparusahan ay bumagsak sa isang tao. Ginawang hayag ang ipinahihiwatig na pananagutan mula sa naunang talata upang maging malinaw at natural sa Tagalog nang hindi ginagawang simpleng hula ang sumpa.
- source_word: כָּל בֵּית אָבִיו
  choice: buong sambahayan ng kanyang ama
  rationale: Pinananatili ang diwa ng angkan o pamilyang nagmula sa ama, habang gumagamit ng likas at marangal na pananalita sa Tagalog.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: Huwag sanang mawalan kailanman ang sambahayan ni Joab
  rationale: Ipinahahayag ng negatibong anyo ang sumpang hindi kailanman mawawala sa angkan ni Joab ang mga ganitong kapinsalaan. Mas natural ito kaysa sa literal na 'huwag maputol mula sa sambahayan.'
- source_word: זָב
  choice: lalaking may agas
  rationale: Ang זָב ay tumutukoy sa taong may patuloy na pag-agas mula sa katawan; ang 'may agas' ay maikli at angkop sa bokabularyong biblikal sa Tagalog.
- source_word: מְצֹרָע
  choice: may ketong
  rationale: Ang 'ketong' ang maikli at kinikilalang tradisyonal na katumbas, samantalang nililinaw sa talababa na mas malawak ang maaaring saklaw ng salitang Hebreo kaysa sa modernong sakit na Hansen.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: humahawak ng suliran
  rationale: Ang karaniwang kahulugan ng פֶּלֶךְ ay suliran o kasangkapang ginagamit sa pag-ikid ng sinulid. Pinananatili ang konkretong larawan at inilalagay sa talababa ang kilalang alternatibong pagbasa na 'tungkod.'
- source_word: נֹפֵל בַּחֶרֶב
  choice: namamatay sa tabak
  rationale: Natural na Tagalog para sa idyomang literal na 'bumabagsak sa tabak,' na tumutukoy sa pagkamatay sa karahasan o digmaan.
- source_word: חֲסַר לָחֶם
  choice: kapos sa pagkain
  rationale: Ang tinapay ay kumakatawan sa pangunahing ikabubuhay. Ang 'kapos sa pagkain' ay malinaw sa modernong Tagalog habang pinananatili ang diwa ng pagkagutom at karalitaan.
theological_decisions:
- issue: Kalikasan ng pahayag ni David
  choice: Isang sumpa o paghiling ng hatol laban kay Joab at sa kanyang sambahayan
  alternative: Isang tuwirang hula tungkol sa mangyayari
  rationale: Ang mga anyong pandiwa at ang 'huwag sana' ay nagpapahayag ng paghiling na dumating ang hatol, hindi lamang ng neutral na prediksiyon.
- issue: Ang ipinahihiwatig na paksa ng unang sugnay
  choice: Ang pananagutan sa pagdanak ng dugo na binanggit sa naunang talata
  alternative: Isang di-tiyak na sumpa o ang dugong dumanak mismo
  rationale: Ang maramihang pandiwa ay malamang na bumabalik sa 'mga dugo' o bloodguilt ng naunang talata. Ang saling 'pananagutan dito' ay nagpapalinaw sa ugnayan ngunit hindi tinutukoy nang higit sa konteksto ang eksaktong mekanismo ng hatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'sambahayan' upang maipahayag ang pinalawak na pamilya o angkan, at pinanatili ang anyong sumpa sa pamamagitan ng 'Mapasaulo' at 'Huwag sanang.'
