  naturalness: Hindi likas ang “Mapasaulo ni Joab”; mas malinaw at marangal sa modernong Tagalog ang “Nawa’y bumagsak ito sa ulo ni Joab.” Ang paggamit ng “taong” sa talaan ay mas natural at hindi nagdaragdag ng kasarian.
  terminology: Napananatili ang “ketong,” na may sapat na talababa tungkol sa mas malawak na saklaw ng מְצֹרָע. Ang “suliran” ay ang pangunahing kahulugan ng פֶּלֶךְ, at wasto ang talababa para sa alternatibong “tungkod.”
