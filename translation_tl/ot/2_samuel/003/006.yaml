    issue: Ang “lalo namang” ay dagdag na diin.
    rationale: Walang salitang Hebreo sa talata na nagsasaad ng “lalo” o ng kontrastibong “naman,” kaya hindi ito dapat idagdag sa pangunahing salin.
  - severity: medium
    issue: Ang “pinalalakas ni Abner ang kanyang posisyon” ay labis na pagpapakahulugan sa pangunahing teksto.
    rationale: Maaaring ipahiwatig ng hitpael ang pagpapalakas ng sarili o ang paglakas, ngunit hindi tahasang binabanggit ang “posisyon.” Mas mabuting iwanang bukás ang ambigwidad at ilagay ang reflexive na pagbasa sa talababa.
