translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang mapanatili ang pampamilya at pampolitikang lawak ng Hebreong “bahay,” at “posisyon” upang natural na maipahayag ang malamang na diwa ng reflexive na pandiwa nang hindi itinatago ang alternatibong pagbasa.
