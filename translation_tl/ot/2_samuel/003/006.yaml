  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: tl
  text: Habang nagpapatuloy ang digmaan sa pagitan ng sambahayan ni Saul at ng sambahayan ni David, patuloy na lumalakas si Abner[a] sa sambahayan ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patuloy na pinalalakas ni Abner ang kanyang sarili sa sambahayan ni Saul.” Ang pandiwang Hebreo ay maaaring mangahulugang “lumalakas” o “nagpapalakas sa sarili”; ang huling pagbasa ay maaaring tumukoy sa pagpapatibay niya ng sarili niyang katayuan sa sambahayan ni Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: Habang nagpapatuloy ang digmaan
  rationale: Ipinahahayag ng ב na may infinitive construct ng היה ang isang nagpapatuloy na kalagayang kasabay ng pangunahing pangyayari. Hindi na ginamitan ng hiwalay na panimulang panandang gaya ng “At nangyari” dahil mas natural sa makabagong Tagalog na dalhin ng “Habang” ang ugnayang temporal at pasalaysay.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: sa pagitan ng sambahayan ni Saul at ng sambahayan ni David
  rationale: Pinananatili ng “sambahayan” ang lawak ng בֵּית, na maaaring tumukoy sa pamilya, mga tagasunod, at naghaharing angkan; ang “dinastiya” ay magiging mas makitid at higit na interpretatibo.
- source_word: וְאַבְנֵר הָיָה מִתְחַזֵּק
  choice: lalo namang pinalalakas ni Abner ang kanyang posisyon
  rationale: Ang hitpael participle ng חזק ay maaaring mangahulugang lumalakas o nagpapalakas sa sarili. Sa konteksto, malinaw at natural na ipinahihiwatig ng saling ito ang patuloy na pagpapatatag ni Abner ng sariling kapangyarihan, habang kinikilala sa talababa ang mas literal na alternatibo.
- source_word: בְּבֵית שָׁאוּל
  choice: sa sambahayan ni Saul
  rationale: Ang ב ay nagpapakita ng saklaw kung saan lumalakas o nagpapatatag ng kapangyarihan si Abner. Pinananatili ng “sambahayan” ang pampamilya at pampolitikang mga pahiwatig ng Hebreo.
