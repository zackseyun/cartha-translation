- from: Habang nagpapatuloy ang digmaan sa pagitan ng sambahayan ni Saul at ng sambahayan ni David, lalo namang pinalalakas ni Abner ang kanyang posisyon sa sambahayan ni Saul.[a]
  to: Habang nagpapatuloy ang digmaan sa pagitan ng sambahayan ni Saul at ng sambahayan ni David, patuloy na lumalakas si Abner[a] sa sambahayan ni Saul.
  rationale: Inalis ang hindi nasa pinagmulan na “lalo namang” at pinalitan ang interpretatibong “kanyang posisyon” ng mas bukás na “lumalakas.” Inilipat ang footnote marker sa “Abner,” kung saan nakaugnay ang pandiwang Hebreo, at pinanatili sa talababa ang posibleng reflexive na kahulugan.
