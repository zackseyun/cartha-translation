  verdict: revise
  source_fidelity: Ang “Habang nagpapatuloy ang digmaan” at ang dalawang “sambahayan” ay tapat sa duratibong sugnay at sa malawak na kahulugan ng בֵּית. Gayunman, ang “lalo namang” ay nagdaragdag ng diin o paghahambing na wala sa Hebreo, at ang “pinalalakas ... ang kanyang posisyon” ay mas tiyak na interpretasyon kaysa sa pinahihintulutan ng pandiwang מִתְחַזֵּק.
  naturalness: Natural at marangal sa makabagong Filipino ang “patuloy na lumalakas si Abner sa sambahayan ni Saul.” Mas maingat ito kaysa sa idyomang “pinalalakas ... ang kanyang posisyon,” habang malinaw pa rin sa konteksto.
  terminology: Ang “sambahayan” ay angkop para sa בֵּית sapagkat naiiwan nitong bukás ang pampamilya at pampolitikang saklaw. Pinanatili ang mga pangalang Saul, David, at Abner. Ang talababa ay inilagay sa pandiwang tinatalakay nito.
  issues:
