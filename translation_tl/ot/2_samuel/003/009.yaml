base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: tl
  text: Gawin nawa ng Diyos kay Abner ang ganito, at lalo pa, kung hindi ko gagawin para kay David ang gaya ng isinumpa ni Yahweh sa kanya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Gawin nawa ito ng Diyos kay Abner, at higit pa
  rationale: Karaniwang pormula ito ng Hebreong panunumpa na humihiling ng hatol ng Diyos sa nagsasalita kapag hindi niya tinupad ang sinabi. Pinananatili ang ikatlong-panauhang pagtukoy ni Abner sa sarili.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לְדָוִד
  choice: ang mismong isinumpa ni Yahweh sa kanya
  rationale: Ipinahahayag ng כַּאֲשֶׁר ang eksaktong pagtutugma ng gagawin ni Abner sa isinumpa ni Yahweh kay David. Ang panghalip na “sa kanya” ay tumutukoy kay David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: na gayon nga ang gagawin ko para sa kanya
  rationale: Ang כֵּן ay tumutukoy pabalik sa ipinangako ni Yahweh, at ang imperfect na אֶעֱשֶׂה ay may promissoryo at panghinaharap na diwa sa konteksto ng panunumpa.
theological_decisions:
- issue: Paglalarawan sa panunumpa ni Abner
  choice: Isinalin bilang sumpang babagsak sa sarili kung hindi niya gagawin para kay David ang isinumpa ni Yahweh
  alternative: 'Basahin ang כִּי bilang paniniyak o dahilan: “sapagkat kung ano ang isinumpa ni Yahweh kay David, gayon nga ang gagawin ko para sa kanya”'
  rationale: Walang tahasang salitang Hebreo para sa “hindi,” ngunit hinihingi ito ng karaniwang lohika ng pormula ng panunumpa at ng konteksto. Itinatala sa talababa ang mas pormal na pagbasa upang hindi maitago ang sintaktikong tensiyon.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit sa talata ang banal na pangalan; pinananatili ito bilang “Yahweh.”
translation_notes:
  register: Makabago at marangal na Filipino. Ang “Gawin nawa” ay nagpapanatili sa bigat ng panunumpa nang hindi nagiging labis na arkaiko. Ang gitling sa dulo ay nagpapatuloy sa nilalaman ng panunumpa sa susunod na talata.
