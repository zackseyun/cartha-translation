base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: tl
  text: Kaya pinatay nina Joab at ng kapatid niyang si Abisai si Abner, sapagkat pinatay ni Abner ang kapatid nilang si Asahel sa Gibeon, sa labanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At pinatay nina Joab at ng kapatid niyang si Abisai si Abner.” Maaari ring isalin ang pang-ugnay sa Hebreo bilang payak na “at”; ipinakikita ng “kaya” ang paliwanag na kaugnayan nito sa nakapaligid na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: pinatay
  rationale: Tuwirang katumbas ng karaniwang pandiwang הרג; hindi ginamit ang “pinaslang” o “minatay” upang hindi magdagdag ng legal o moral na hatol na hindi tahasang ipinahahayag ng salita.
- source_word: לְאַבְנֵר
  choice: si Abner
  rationale: Ang לְ pagkatapos ng הרג ay nagmamarka rito ng layon; likas sa Tagalog ang personal direct object na may “si.”
- source_word: עַל אֲשֶׁר
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi na nagpapahayag ng dahilan ng pagpatay kay Abner.
- source_word: הֵמִית
  choice: pinatay nito
  rationale: Ang Hiphil ng מות ay nangangahulugang naging sanhi ng kamatayan. Nililinaw ng “nito” na si Abner ang tinutukoy, habang ang naunang pangyayari ay sapat nang ipinahihiwatig ng sugnay na sanhi.
- source_word: אָחִיו / אֲחִיהֶם
  choice: kapatid niyang / kapatid nilang
  rationale: 'Pinananatili ang dalawang mahalagang ugnayang pampamilya: kapatid ni Joab si Abisai, at kapatid nilang dalawa si Asahel.'
- source_word: בְּגִבְעוֹן
  choice: sa Gibeon
  rationale: Likas na Tagalog para sa lugar kung saan naganap ang labanan.
- source_word: בַּמִּלְחָמָה
  choice: sa labanan
  rationale: Pinananatili ang tiyak na labanan na kilala na mula sa salaysay, sa halip na gawing pangkalahatang “sa digmaan.”
- source_word: וְ / וַ
  choice: Kaya
  rationale: Ipinahahayag ang paliwanag o pagbubuod na ugnayan sa naunang konteksto; maaari rin itong isalin nang payak na “At.”
