  naturalness: 'May maliit ngunit mahalagang suliraning panggramatika sa tambalang tagaganap: hindi wasto rito ang “ni Joab at ng kapatid niyang si Abisai.” Gamitin ang maramihang pantukoy na “nina.” Mas malinaw ding ulitin ang pangalang Abner sa sugnay na sanhi kaysa gamitin ang “nito,” na maaaring maging bahagyang malabo sa modernong Filipino.'
  terminology: Ang “pinatay,” “sapagkat,” “kapatid,” “sa Gibeon,” at “sa labanan” ay angkop, natural, at hindi nagdaragdag ng paghatol na wala sa Hebreo. Wasto ang mga pangalang Joab, Abisai, Abner, Asahel, at Gibeon.
