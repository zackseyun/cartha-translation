translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang salitang may mas tiyak na legal o moral na pagpapakahulugan kaysa sa Hebreo, at pinanatili ang dahilan, mga ugnayang magkakapatid, lugar, at tiyak na labanan.
