base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: tl
  text: At narito, dumating mula sa isang pagsalakay[a] ang mga tauhan ni David at si Joab, at marami silang dalang samsam. Ngunit wala si Abner na kasama ni David sa Hebron, sapagkat pinayagan siyang umalis ni David, at umalis siya nang payapa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa pangkat ng mga mananalakay.” Ang salitang Hebreo ay maaaring tumukoy sa isang pangkat o hukbo; pinili rito ang “pagsalakay” dahil binanggit sa kasunod na sugnay ang samsam.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “umalis sa kapayapaan”—isang idyomang nangangahulugang ligtas siyang umalis at maayos ang kanilang paghihiwalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masigla at panturong tungkulin ng הִנֵּה sa salaysay, sa isang dignificado ngunit nauunawaang anyong Tagalog.
- source_word: עַבְדֵי דָוִד
  choice: mga tauhan ni David
  rationale: Sa kontekstong militar at maharlikang paglilingkod, tumutukoy ang עֶבֶד sa mga naglilingkod o kasamahan ni David; mas natural dito ang 'mga tauhan' kaysa 'mga alipin'.
- source_word: בָּא מֵהַגְּדוּד
  choice: dumating mula sa isang pagsalakay
  rationale: Maaaring tumukoy ang גְּדוּד sa isang pangkat o hukbong mananalakay, ngunit ipinahihiwatig ng kasunod na samsam na isang pagsalakay ang tinutukoy.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: at marami silang dalang samsam
  rationale: Ang 'samsam' ang karaniwang salitang militar para sa mga ari-ariang nakuha, at malinaw na ipinapahayag ng parirala na dinala nila iyon sa kanilang pagbabalik.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: Ngunit wala na si Abner sa Hebron kasama ni David
  rationale: Ang 'ngunit' ay natural na naghahayag ng kaibahan sa pagdating ni Joab; ipinapakita ng 'wala na' na nakaalis na si Abner bago sila dumating.
- source_word: כִּי שִׁלְּחוֹ
  choice: sapagkat pinaalis na siya ni David
  rationale: Ang paksa ng pandiwa ay si David ayon sa konteksto. Ginawang tahasan ang pangalan upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog, nang hindi dinaragdagan ang diwa.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: at umalis siya nang payapa
  rationale: Pinananatili ang Hebreong idyomang 'lumakad/umalis sa kapayapaan,' na nagpapahiwatig ng ligtas at maayos na pag-alis.
