translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pormal na salitang “tipan” at ang tunay na kalabuan ng idyomang “makita ang mukha ko,” na ipinaliliwanag sa talababa.
