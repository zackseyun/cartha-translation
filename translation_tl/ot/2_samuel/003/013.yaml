base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: tl
  text: 'Sinabi niya, “Mabuti. Makikipagtipan ako sa iyo. Isa lamang ang hinihingi ko sa iyo: Hindi mo makikita ang mukha ko[a] malibang dalhin mo muna si Mical na anak ni Saul kapag pumarito ka upang makita ang mukha ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ka makakaharap sa akin malibang dalhin mo muna si Mical na anak ni Saul kapag pumarito ka upang humarap sa akin.” Literal sa Hebreo, “makita ang mukha ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mabuti
  rationale: Maikli itong pagsang-ayon sa panukala ni Abner at pinananatili ang kaiklian ng Hebreo.
- source_word: אֶכְרֹת ... בְּרִית
  choice: Makikipagtipan ako
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na “puputol ng tipan,” at pinananatili ang pormal na diwa ng tipan.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Isa lamang ang hinihingi ko sa iyo
  rationale: Malinaw at natural na ipinahahayag ang nag-iisang kundisyon, nang hindi pinatitindi bilang isang utos o sapilitang kahilingan.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: Hindi mo makikita ang mukha ko
  rationale: Pinananatili ang literal at inuulit na idyomang “makita ang mukha ko,” na maaaring tumukoy sa pagharap o pagharap sa isang hari.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: malibang dalhin mo muna
  rationale: Ipinakikita ang kundisyong ekseptibo at ang kinakailangang maunang pagdala kay Mical.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: si Mical na anak ni Saul
  rationale: Karaniwan at malinaw na anyong Tagalog ng pagkakakilanlan sa Hebreo.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: kapag pumarito ka upang makita ang mukha ko
  rationale: Pinananatili ang pag-uulit ng pariralang Hebreo para sa diin at pagkakaugnay, habang natural sa Tagalog.
