base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: tl
  text: Ako'y mahina pa rin ngayon[a], kahit pinahiran akong hari. Ang mga lalaking ito, ang mga anak ni Zeruya, ay masyadong mabagsik para sa akin.[b] Gantihan nawa ni Yahweh ang gumagawa ng masama ayon sa kanyang kasamaan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “malambot pa” o “marupok pa.” Ang salitang Hebreo ay maaaring mangahulugang “malambot” o “marupok,” o, gaya rito, “mahina.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “ay mas makapangyarihan kaysa sa akin” o “ay napakahirap kong supilin.”'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring: “Gagantihan ni Yahweh ang gumagawa ng masama ayon sa kanyang kasamaan.” Ang pandiwang Hebreo ay maaari ring unawain bilang payak na pahayag tungkol sa hinaharap.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: mahina
  rationale: Bagaman literal na maaari itong mangahulugang “malambot” o “musmos,” sa konteksto ay inilalarawan ni David ang kanyang kahinaan o kawalan ng kakayahang supilin ang mga anak ni Zeruya.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: kahit pinahiran na akong hari
  rationale: Ipinahihiwatig ng magkatabing sugnay ang pagsalungat ng kasalukuyang kahinaan ni David at ng katayuan niya bilang pinahirang hari; natural na naihahayag ito sa Tagalog sa pamamagitan ng “kahit.”
- source_word: בְּנֵי צְרוּיָה
  choice: ang mga anak ni Zeruya
  rationale: Pinananatili nito ang pamilyang katawagan para kay Joab at sa kanyang mga kapatid at ang retorikal na diin ng Hebreo.
- source_word: קָשִׁים מִמֶּנִּי
  choice: masyadong mabagsik para sa akin
  rationale: Ang קָשִׁים ay maaaring tumukoy sa pagiging matigas, mabagsik, o makapangyarihang mahirap supilin. Ipinahahayag ng salin kapwa ang kalupitan nila at ang kawalan ni David ng kakayahang pigilan sila.
- source_word: יְשַׁלֵּם
  choice: Gantihan nawa
  rationale: Ang imperfect ay inuunawa rito bilang paghiling na pairalin ng Diyos ang katarungan, habang itinatala sa talababa ang posibleng payak na pahayag tungkol sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: ang gumagawa ng masama
  rationale: Natural at tuwirang inililipat nito ang participial phrase na tumutukoy sa taong gumagawa ng kasamaan.
- source_word: כְּרָעָתוֹ
  choice: ayon sa kanyang kasamaan
  rationale: Pinananatili nito ang diwa ng pagganting katumbas ng kasamaan ng gumagawa nito nang hindi nililimitahan ang salita sa isang partikular na gawa lamang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tuwirang nasa Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Puwersa ng pangwakas na pandiwang יְשַׁלֵּם
  choice: 'Paghiling: “Gantihan nawa”'
  alternative: 'Pahayag sa hinaharap: “Gagantihan”'
  rationale: Sa konteksto, ipinauubaya ni David sa Diyos ang pagganti. Gayunman, maaari ring basahin ang anyong Hebreo bilang payak na pahayag sa hinaharap, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinahiran” bilang pamilyar na biblikal na termino, habang iniwasan ang sobrang literal na “malambot” sa pangunahing teksto dahil maaari itong makalito sa konteksto.
