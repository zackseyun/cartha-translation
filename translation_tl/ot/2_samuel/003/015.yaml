base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: tl
  text: At nagsugo si Isboset at kinuha niya si Mical mula sa kanyang asawa, mula kay Paltiel na anak ni Lais.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “mula sa lalaki, mula kay Paltiel na anak ni Lais.” Ang “lalaki” ay tumutukoy rito sa asawa ni Mical.'
    reason: lexical_alternative
  - marker: b
    text: Sa mga kaugnay na talata, ang pangalang ito ay maaari ring lumitaw bilang “Palti”; dito sa Hebreo ay “Paltiel.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Ang pandiwa ay literal na nagsasaad na nagpadala o nagsugo si Isboset. Hindi tinutukoy sa Hebreo kung sino ang isinugo, kaya hindi iyon dinagdagan sa salin.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isboset
  rationale: Ginamit ang natural na anyong Tagalog ng pangalang Hebreo, na karaniwang walang gitling sa makabagong baybay ng mga pangalang biblikal.
- source_word: וַיִּקָּחֶהָ
  choice: kinuha siya
  rationale: Malapit ito sa payak na kahulugan ng לקח at pinananatili ang di-tiyak na puwersa ng kilos; ang mas matinding 'inagaw' ay lampas sa tahasang sinasabi ng pandiwa.
- source_word: מֵעִם אִישׁ מֵעִם
  choice: mula sa piling ng asawa niyang
  rationale: Ang מֵעִם ay paghihiwalay mula sa piling o pangangalaga ng isang tao. Ang dobleng parirala sa Hebreo ay likas na pinagsama sa Filipino upang maiwasan ang mabigat na pag-uulit, habang nililinaw ng konteksto na ang אִישׁ ay asawa niya.
- source_word: פַּלְטִיאֵל
  choice: Paltiel
  rationale: Tuwirang transliterasyon ito ng anyong pangalang nasa Masoretic Text ng talatang ito.
- source_word: בֶּן לוש
  choice: anak ni Lais
  rationale: Ang בֶּן ay natural na isinasaling 'anak ni' sa Filipino. Ang לוש ay ibinigay bilang 'Lais,' isang angkop na transliterasyong Filipino ng pangalang karaniwang tinatawag na Laish sa Ingles.
theological_decisions:
- issue: Pagkakakilanlan ng אִישׁ bilang asawa ni Mical
  choice: asawa niyang si Paltiel
  alternative: lalaking si Paltiel
  rationale: Bagaman literal na 'lalaki' ang אִישׁ, ipinakikita ng agarang konteksto at ng 1 Samuel 25:44 na si Paltiel ang asawa ni Mical. Ginagawang malinaw ng salin ang relasyong tinutukoy nang hindi humahatol sa pagiging lehitimo nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “mula sa piling” upang natural na maipahayag ang Hebreong מֵעִם, at inilagay ang talababa matapos ang buong pahayag upang ipaliwanag ang mas literal na anyo nang hindi pinabibigat ang pangunahing teksto.
