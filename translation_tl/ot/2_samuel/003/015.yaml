revisions:
- from: Kaya nagsugo si Isboset at kinuha siya mula sa piling ng asawa niyang si Paltiel na anak ni Lais.[a]
  to: At nagsugo si Isboset at kinuha niya si Mical mula sa kanyang asawa, mula kay Paltiel na anak ni Lais.[a][b]
  rationale: Pinalitan ang “Kaya” ng “At” upang masundan ang payak na daloy ng Hebreo. Ginawang tahasan ang pangalang Mical upang alisin ang likas na kalabuan ng panghalip na “siya” sa Filipino, nang walang pagbabago sa tinutukoy ng Hebreo. Inayos ang parirala upang mapanatili ang inuulit na “mula” at nilinaw sa talababa na si Paltiel ang asawang tinutukoy. Idinagdag ang note sa Paltiel/Palti alinsunod sa English POB audit trail.
