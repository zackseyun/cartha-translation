  source_fidelity: Tapat ang salin sa Hebreo. Ang “asawa niya” ay wastong pagtiyak sa אִישָׁהּ sa kontekstong ito; ang nagpapatuloy na paglalakad at pag-iyak, pagsunod sa likuran, at ang hantungan sa Bahurim ay lahat naipahayag. Napanatili rin ang dalawang pautos sa לֵךְ שׁוּב at ang kasunod na pagbabalik ng lalaki.
