  text: וַ/יֵּ֨לֶךְ אִתָּ֜/הּ אִישָׁ֗/הּ הָל֧וֹךְ וּ/בָכֹ֛ה אַחֲרֶ֖י/הָ עַד בַּֽחֻרִ֑ים וַ/יֹּ֨אמֶר אֵלָ֥י/ו אַבְנֵ֛ר לֵ֥ךְ שׁ֖וּב וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: tl
  text: Sumama sa kanya ang asawa niya[a], na naglalakad at umiiyak sa likuran niya hanggang sa Bahurim. Pagkatapos, sinabi sa kanya ni Abner, “Humayo ka, bumalik ka.”[b] Kaya bumalik siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na sumusunod sa kanya,” sa halip na “sa likuran niya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Humayo ka, bumalik ka”—dalawang pautos na nagbibigay-diin; maaari ring isalin na “Bumalik ka na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ang asawa niya
  rationale: Sa konteksto, ang אִישׁ na may hulaping 3fs ay tumutukoy sa asawa ng babae; natural at tiyak sa Filipino ang “asawa niya.”
- source_word: הָלוֹךְ וּבָכֹה
  choice: na naglalakad at umiiyak
  rationale: Inilalarawan ng anyo sa Hebreo ang nagpapatuloy na magkasabay na pagkilos; pinananatili ito ng likas na pariralang Filipino.
- source_word: אַחֲרֶיהָ
  choice: sa likuran niya
  rationale: Ipinahihiwatig nito ang pagsunod sa likod ng babae; mas tiyak dito ang “sa likuran niya” kaysa sa maaaring malabong “kasunod niya.”
- source_word: עַד בַּחֻרִים
  choice: hanggang sa Bahurim
  rationale: Ang עַד kasama ng pangalan ng lugar ay nagtatakda ng hangganan ng paglalakbay; natural itong ipinapahayag ng “hanggang sa.”
- source_word: בַּחֻרִים
  choice: Bahurim
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: לֵךְ שׁוּב
  choice: Humayo ka, bumalik ka
  rationale: Pinananatili ang dalawang magkahiwalay na pautos sa Hebreo at ang madiing dating nito, sa halip na pagsamahin bilang iisang utos lamang.
- source_word: וַיָּשֹׁב
  choice: Kaya bumalik siya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at malinaw na ipinakikita ng “kaya” ang pagtugon niya sa utos ni Abner.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humayo” sa tuwirang utos upang mapanatili ang dalawang pandiwa at ang diin ng Hebreo, bagaman bahagya itong mas pormal kaysa sa karaniwang pananalita.
