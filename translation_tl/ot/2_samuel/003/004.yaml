  text: the fourth[a], Adonijah son of Haggith; and the fifth, Shephatiah son of Abital.
translation:
  language: tl
  text: ang ikaapat[a] ay si Adonias na anak ni Haguit; at ang ikalima ay si Sefatias na anak ni Abital.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, nagsisimula ito sa “at ang ikaapat,” bilang pagpapatuloy ng talaan mula sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְבִיעִי
  choice: ang ikaapat
  rationale: Pang-uring pamilang na may panlaping pang-ugnay. Hindi na isinama sa pangunahing teksto ang pambungad na “at” upang maging natural sa Filipino, ngunit pinanatili ang pagkakasunod-sunod; ipinaliwanag sa talababa ang literal na anyo.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalang biblikal.
- source_word: בֶן
  choice: anak ni
  rationale: Ang construct form ay tumutukoy sa tuwirang ugnayang ama-anak; “anak ni” ang natural at maikling anyo sa Filipino.
- source_word: חַגִּית
  choice: Haguit
  rationale: Ginamit ang anyong angkop sa ortograpiyang Filipino para sa pangalang pantangi.
- source_word: וְהַחֲמִישִׁי
  choice: at ang ikalima
  rationale: Pinanatili ang pang-ugnay upang malinaw na idugtong ang ikalawang pangalan sa talaan sa loob ng talata.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֲבִיטָל
  choice: Abital
  rationale: Tuwirang transliterasyon na natural basahin sa Filipino.
