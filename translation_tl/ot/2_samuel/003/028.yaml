    issue: Ang “sa pagdanak ng dugo ni Abner” ay hindi lubos na malinaw bilang katumbas ng idiomang מִדְּמֵי.
    rationale: Ang Hebreo ay tumutukoy sa pagiging malaya sa pananagutan para sa dugo ni Abner. Ang rebisyon ay pinananatili ang konkretong “dugo” at nililinaw sa talababa ang legal-moral na implikasyon nito.
