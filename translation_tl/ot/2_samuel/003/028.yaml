  to: Pagkatapos nito[a], nang mabalitaan iyon ni David, sinabi niya, “Ako at ang aking kaharian ay magpakailanman walang sala sa harap ni Yahweh ukol sa dugo ni Abner na anak ni Ner.”[b]
  rationale: Inayos ang huling parirala upang mas tumpak na maipahayag ang pagtanggi ni David sa pananagutan para sa dugo ni Abner, nang hindi dinaragdagan ang kahulugan ng pinagmulan. Idinagdag ang talababa para sa Hebreong idyoma at nilagyan ng angkop na anchor.
