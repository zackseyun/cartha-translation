base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: tl
  text: Pagkatapos nito[a], nang mabalitaan iyon ni David, sinabi niya, “Ako at ang aking kaharian ay magpakailanman walang sala sa harap ni Yahweh ukol sa dugo ni Abner na anak ni Ner.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pagkaraan nito” o “Nang maglaon.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa mga dugo ni Abner,” isang idyoma na tumutukoy sa pananagutan para sa pagkabuhos ng dugo ni Abner.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na salaysay na katumbas ng temporal na pariralang nangangahulugang ‘pagkatapos nito’ o ‘kalaunan.’
- source_word: וַיִּשְׁמַע
  choice: nang mabalitaan iyon ni David
  rationale: Ang pandiwa ay ‘nakarinig’; ang ‘mabalitaan iyon’ ay natural sa Filipino para sa pagkakatanggap ng ulat tungkol sa pangyayaring kababanggit lamang.
- source_word: נָקִי
  choice: walang sala
  rationale: Ipinapahayag nito ang kawalan ng pananagutan o pagkakasala sa legal at moral na diwa.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: Ako at ang aking kaharian
  rationale: Pinananatili ang tuwirang pag-uugnay ni David sa kaniyang sarili at sa kahariang nasa ilalim niya.
- source_word: מֵעִם יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinahihiwatig ng idyoma ang katayuan kay Yahweh bilang saksi at hukom.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na katumbas ng pangmatagalang pahayag na ‘forever.’
- source_word: מִדְּמֵי
  choice: sa pagdanak ng dugo ni
  rationale: Ang literal na ‘mula sa mga dugo’ ay Hebreong idyoma para sa marahas na pagpatay at pananagutan dito; natural na naipahahayag sa Filipino bilang ‘pagdanak ng dugo.’
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner na anak ni Ner
  rationale: Karaniwang Filipino na anyo ng patronimikong Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pahayag na walang sala
  choice: Ako at ang aking kaharian
  alternative: Ako at ang aking sambahayan ng hari
  rationale: Pinananatiling bukas ang saklaw ng מַמְלַכְתִּי bilang kaharian o pamamahala ni David at hindi ito nililimitahan sa kaniyang dinastiya lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘walang sala’ at ‘pagdanak ng dugo’ upang natural na maipahayag ang legal-moral na idyoma ng Hebreo nang hindi ikinukubli ang usapin ng pananagutan.
