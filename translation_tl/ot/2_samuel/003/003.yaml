  text: his second, Kileab, by Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah daughter of Talmai king of Geshur.
translation:
  language: tl
  text: ang ikalawa ay si Kileab, mula kay Abigail, na asawa ni Nabal na taga-Carmel; at ang ikatlo ay si Absalom, anak ni Maaca, na anak na babae ni Talmai, hari ng Geshur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁנֵהוּ
  choice: ang ikalawa ay
  rationale: Ipinahihiwatig ng anyong Hebreo ang ikalawang anak sa sunod-sunod na talaan; natural itong ipinahayag sa Tagalog nang hindi dinaragdagan ang pangalan ni David.
- source_word: כִלְאָב
  choice: Kileab
  rationale: Direktang transliterasyon ng pangalang Hebreo, kasunod ng anyo sa source at audited consultation layer.
- source_word: לַאֲבִיגַל
  choice: kay Abigail
  rationale: Sa konteksto ng talaangkanan, ipinakikita ng ל ang ina ng anak; ang “kay” ay maikli at likas sa Tagalog.
- source_word: הַכַּרְמְלִי
  choice: na taga-Carmel
  rationale: Ang gentilic na anyo ay tumutukoy sa kaugnayan ni Nabal sa Carmel, kaya mas malinaw sa karaniwang Tagalog ang “taga-Carmel.”
- source_word: בֶּן מַעֲכָה
  choice: anak ni Maaca
  rationale: Isinalin ang karaniwang pariralang pangkamag-anakan nang tuwiran at natural.
- source_word: בַּת תַּלְמַי
  choice: na anak na babae ni Talmai
  rationale: Pinanatili ang tiyak na kasariang ipinahahayag ng בַּת upang luminaw na si Maaca ang anak na babae ni Talmai.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: hari ng Geshur
  rationale: Tuwirang katumbas na nagpapanatili sa titulo at lugar.
