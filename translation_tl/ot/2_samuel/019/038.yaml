translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na “po” at maramihang panghalip na “ninyo/inyong” bilang angkop na pakikipag-usap sa hari, habang pinanatili ang pormal na pagtukoy sa sarili bilang “inyong lingkod.”
