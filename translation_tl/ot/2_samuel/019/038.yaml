  naturalness: Marangal at madaling maunawaan ang rehistro. Mas natural at walang kalabuan ang “hayaan ninyo siyang tumawid” kaysa “patawirin ninyo siya.”
  terminology: Ang “inyong lingkod,” “aking panginoon, ang hari,” at “mabuti sa inyong paningin” ay angkop na mga katumbas na may magalang na rehistro. Nananatiling angkop ang Kimham bilang transliterasyon.
