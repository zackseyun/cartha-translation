base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: tl
  text: Pahintulutan po ninyong makabalik ang inyong lingkod upang mamatay ako sa sarili kong lungsod, malapit sa libingan ng aking ama at ina.[a] Ngunit narito ang inyong lingkod na si Kimham; hayaan ninyo siyang tumawid kasama ng aking panginoon, ang hari, at gawin ninyo para sa kanya ang mabuti sa inyong paningin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kasama ng libingan ng aking ama at ina.” Malamang na ang diwa ay “malapit sa libingan,” na tumutukoy sa pagkakalibing sa libingan ng pamilya.
    reason: lexical_alternative
  - marker: b
    text: O “ang sa tingin ninyo ay mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Pahintulutan po ninyong makabalik
  rationale: Ang qal ng שׁוּב ay tumutukoy sa pagbabalik, at ang נָא ay nagbibigay ng magalang na himig ng pakiusap. Likas sa makabagong Tagalog ang pariralang ito sa pakikipag-usap sa hari.
- source_word: עַבְדְּךָ
  choice: ang inyong lingkod
  rationale: Magalang na pagtukoy ito ni Barzilai sa sarili sa harap ng hari; higit na angkop dito ang “lingkod” kaysa “alipin,” sapagkat paggalang sa korte ang pangunahing diin.
- source_word: וְאָמֻת
  choice: upang mamatay ako
  rationale: Ang waw kasama ng imperfect ay natural na nagpapahayag dito ng layunin ng pagbabalik.
- source_word: בְּעִירִי
  choice: sa sarili kong lungsod
  rationale: Ipinahahayag ng hulaping unang panauhan ang pag-aari; inililitaw ng “sarili kong” ang personal na kaugnayan nang hindi dinaragdagan ang diwa.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: malapit sa libingan ng aking ama at ina
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, sa konteksto ng kamatayan at libingan ay natural itong tumutukoy sa pagiging malapit sa libingan ng pamilya.
- source_word: וְהִנֵּה
  choice: Ngunit narito
  rationale: Pinananatili ng “narito” ang presentative force ng הִנֵּה, samantalang ipinakikita ng “ngunit” ang kaibahan ng sariling pagbabalik ni Barzilai at ng pagsama ni Kimham.
- source_word: כִמְהָם
  choice: Kimham
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: יַעֲבֹר עִם
  choice: Patawirin ninyo siya kasama
  rationale: Ang imperfect ay may jussive na puwersa sa pakiusap. Pinananatili ng “patawirin” ang motibo ng pagtawid sa Jordan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: aking panginoon, ang hari
  rationale: Pinananatili nito ang magalang na katawagan sa hari sa isang likas ngunit marangal na anyong Tagalog.
- source_word: וַעֲשֵׂה לוֹ
  choice: at gawin ninyo para sa kanya
  rationale: Ang עשה na may ל ay maaaring mangahulugang gumawa para sa isang tao; malinaw itong naihahayag ng pariralang Tagalog.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: ang mabuti sa inyong paningin
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo habang nananatiling malinaw sa mga modernong mambabasa.
