  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: tl
  text: At sinabi ng hari kay Simei, “Hindi ka mamamatay[a].” At sumumpa sa kanya ang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasang, “Hindi ka ipapapatay.” Literal na sinasabi ng Hebreo, “Hindi ka mamamatay,” na maaaring tumukoy rito sa pangako ng hari na hindi siya bibitayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang wayyiqtol ng אמר ay nagsasaad ng kasunod na kilos sa salaysay; natural sa Filipino ang “At sinabi” habang pinananatili ang pagkakasunod ng Hebreo.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalan ito na tumutukoy sa haring kilala na sa konteksto.
- source_word: אֶל שִׁמְעִי
  choice: kay Simei
  rationale: Ang אֶל ay tumutukoy sa kinausap, at “kay” ang likas na panandang Filipino para sa pangalang pantangi. Ginamit ang karaniwang anyong Filipino na “Simei” para sa pangalan.
- source_word: לֹא תָמוּת
  choice: Hindi ka mamamatay
  rationale: Pinananatili nito ang literal na anyo at taimtim na lakas ng ipinangako o iniutos ng hari, nang hindi tahasang ipinapasok sa pangunahing teksto ang paliwanag na hindi siya ipapapatay.
- source_word: וַיִּשָּׁבַע
  choice: At sumumpa
  rationale: Ang Niphal ng שבע ay nangangahulugang manumpa o gumawa ng panunumpa; maikli at natural sa Filipino ang “sumumpa.”
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang hulaping panghalip ay bumabalik kay Simei at pinananatili ang ugnayang “to him” nang hindi inuulit ang pangalan.
theological_decisions:
- issue: Saklaw ng pangakong לֹא תָמוּת
  choice: Hindi ka mamamatay
  alternative: Hindi ka ipapapatay
  rationale: Ang Hebreo ay literal na nagsasabing hindi mamamatay si Simei, ngunit sa konteksto maaari itong gumana bilang maharlikang kapatawaran mula sa pagbitay. Pinananatili ng pangunahing salin ang tunay na lawak ng pahayag, at inilalagay sa talababa ang mas interpretibong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na ayos ng salaysay at ang pormal na bigat ng pangako at panunumpa ng hari.
