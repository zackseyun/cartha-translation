  terminology: Ang “Diyos,” “buto ko at laman ko,” “pinuno ng hukbo,” at “kapalit ni Joab” ay angkop at tapat sa teksto. Ang “sa aking paglilingkod” ay natural na paraan upang ihayag ang לְפָנַי bilang paglilingkod sa ilalim ng awtoridad ng hari, nang hindi ipinapakahulugan na si Amasa ay nasa pisikal na harapan ni David.
