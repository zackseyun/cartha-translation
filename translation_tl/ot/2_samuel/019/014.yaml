  source_fidelity: 'Tumpak ang pangunahing diwa: utos na kausapin si Amasa, retorikal na pahayag ng pagkakamag-anak, pormula ng panunumpa, at pagtatalaga sa kaniya bilang kapalit ni Joab. Gayunman, ang pangungusap na “maglilingkod sa akin bilang pinuno” ay bahagyang inililipat ang diin mula sa pagiging/tatalaga bilang pinuno tungo sa simpleng gawa ng paglilingkod. Mas malinaw na ipahayag ang katungkulan bilang “magiging pinuno ng hukbo sa aking paglilingkod.”'
