base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: tl
  text: At sabihin ninyo kay Amasa, “Hindi ba’t ikaw ay buto ko at laman ko? Gawin nawa sa akin ng Diyos ang gayon, at higit pa, kung hindi ka magiging pinuno ng hukbo sa aking paglilingkod habang panahon[a], kapalit ni Joab.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “lahat ng mga araw,” isang idyoma para sa patuloy na panunungkulan o paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: At sabihin ninyo kay Amasa
  rationale: Pinananatili ang pangmaramihang utos sa mga kinakausap ni David, sa natural na ayos ng makabagong Tagalog.
- source_word: הֲלוֹא
  choice: Hindi ba’t
  rationale: Pinananatili ang anyong retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: ikaw ay buto ko at laman ko
  rationale: Pinananatili ang matingkad na idyoma ng pagkakamag-anak sa halip na paliitin ito sa ‘kamag-anak’ o ‘kadugo.’
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Gawin nawa sa akin ng Diyos ang gayon, at higit pa
  rationale: Pinananatili ang taimtim ngunit sadyang di-tiyak na sumpang kasama sa pormula ng panunumpa; hindi tinutukoy kung anong parusa ang ipinahihiwatig.
- source_word: אִם לֹא
  choice: kung hindi
  rationale: Pinananatili ang balangkas ng Hebreong panunumpa, bagaman ang diwa nito sa konteksto ay matibay na katiyakan.
- source_word: שַׂר צָבָא
  choice: pinuno ng hukbo
  rationale: Malinaw at marangal na katawagan sa pinakamataas na pinunong militar.
- source_word: תִּהְיֶה לְפָנַי
  choice: maglilingkod sa akin bilang
  rationale: Ipinahahayag sa natural na Tagalog ang diwa ng לְפָנַי bilang paglilingkod sa harap o sa ilalim ng awtoridad ng hari, nang hindi gumagamit ng malabong literalismong ‘sa harap ko.’
- source_word: כָּל הַיָּמִים
  choice: sa lahat ng araw
  rationale: Malapit sa literal na Hebreo at pinananatili ang maaaring tumukoy sa patuloy na panunungkulan; nililinaw sa talababa ang idiomatikong diwa.
- source_word: תַּחַת יוֹאָב
  choice: kapalit ni Joab
  rationale: Ang תַּחַת dito ay nagsasaad ng pagpapalit sa katungkulan, hindi ng pagpapasakop kay Joab.
theological_decisions:
- issue: Bilang ng אֱלֹהִים sa pormula ng panunumpa
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang kahulugan nito rito at tumutukoy sa Diyos ng Israel ayon sa karaniwang gamit ng Hebreo.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Pinanatili ang matalinghagang wika ng pagkakamag-anak at ang di-tiyak na pormula ng sumpa, habang ginawang natural ang diwa ng paglilingkod ‘sa harap’ ng hari.
