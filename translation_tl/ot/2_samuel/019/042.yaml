  to: At narito, lumapit sa hari ang lahat ng kalalakihan ng Israel at sinabi nila sa hari, “Bakit ka inagaw[a] ng aming mga kapatid, ang mga lalaki ng Juda,[b] at itinawid nila sa Jordan ang hari at ang sambahayan niya, pati ang lahat ng tauhan ni David na kasama ng hari?”
