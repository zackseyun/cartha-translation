translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “hari,” ang pampamilyang “mga kapatid,” at ang panlalaking kolektibong katawagan ng Hebreo. Ginawang natural ang metaporang גנב sa pangunahing teksto ngunit pinanatili ang literal at alternatibong pagbasa sa talababa.
