base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: tl
  text: At narito, lumapit sa hari ang lahat ng kalalakihan ng Israel at sinabi nila sa hari, “Bakit ka inagaw[a] ng aming mga kapatid, ang mga lalaki ng Juda,[b] at itinawid nila sa Jordan ang hari at ang sambahayan niya, pati ang lahat ng tauhan ni David na kasama ng hari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na “ninakaw ka.” Ginagamit ng Hebreo ang karaniwang pandiwa para sa pagnanakaw bilang metaporang paratang na kumilos ang Juda nang hindi isinasaalang-alang ang ibang mga Israelita. Maaari ring isalin: “Bakit ka palihim na kinuha ng aming mga kapatid?”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang “kalalakihan ng Israel” at “mga lalaki ng Juda” ay panlalaking kolektibong katawagan para sa mga grupong kinakatawan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing gamit ng הִנֵּה at ang kasiglahan ng salaysay sa natural ngunit marangal na Tagalog.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ang lahat ng mga lalaki ng Israel
  rationale: Kolektibo ang isahang אִישׁ; pinananatili ng salin ang panlalaking kinatawang pananalita at ang pagtutulad nito sa mga lalaki ng Juda.
- source_word: בָּאִים אֶל הַמֶּלֶךְ
  choice: lumapit sa hari
  rationale: Ang participle na בָּאִים ay tumutukoy sa pagdating nila sa hari; mas natural sa konteksto ang “lumapit” kaysa literal na “dumating” habang hindi binabago ang kilos.
- source_word: גְּנָבוּךָ
  choice: kami inunahan
  rationale: Literal na “ninakaw ka,” ngunit metaporikal itong paratang na palihim o bukod sa ibang Israelita kumilos ang Juda. Inihahayag ng “kami inunahan” ang kontekstuwal na diwa nang hindi ipinahihiwatig ang literal na pagkidnap; ang metapora ay itinatala sa talababa.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: aming mga kapatid, ang mga lalaki ng Juda
  rationale: Pinananatili ang wikang pampamilya ng pagtatalo sa loob ng Israel at ang kolektibong gamit ng אִישׁ.
- source_word: וַיַּעֲבִרוּ
  choice: itinawid nila
  rationale: Tuwirang ipinapahayag ang causative/Hiphil na diwang “pinatawid” o “dinala sa kabila.”
- source_word: בֵּיתוֹ
  choice: ang sambahayan niya
  rationale: Tumutukoy sa pamilya at mga kasapi ng sambahayan ng hari, hindi sa gusali.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Karaniwang anyo ng pangalang heograpiko; malinaw sa pandiwang “itinawid” na tumutukoy ito sa Ilog Jordan.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: kasama ang lahat ng tauhan ni David
  rationale: Ang אַנְשֵׁי דָוִד ay mga tauhan o tagasunod ni David. Ang “kasama” ay likas na naghahatid sa pangwakas na עִמּוֹ nang hindi lumilikha ng mabigat na pag-uulit.
