  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap para sa natural na daloy. Hindi nagdagdag ng panimulang pang-abay na walang tahasang katumbas sa Hebreo; pinanatili sa talababa ang lawak ng kahulugan ng אִישׁ גָּדוֹל.
