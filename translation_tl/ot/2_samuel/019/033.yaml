base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: tl
  text: Napakatanda na si Barzilai, walumpung taong gulang. Tinustusan niya ang hari habang nananatili ang hari sa Mahanaim, sapagkat isa siyang lubhang mayamang tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang lubhang dakilang tao” o “isang maimpluwensiyang tao.” Malawak ang kahulugan ng pananalitang Hebreo at maaaring tumukoy sa kayamanan, katayuan, o impluwensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: Napakatanda na
  rationale: Predikatibo ang זָקֵן at pinatitingkad ng מְאֹד. Ang “napakatanda na” ay natural sa modernong Tagalog at malinaw ang diin.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: walumpung taong gulang na siya
  rationale: Isinalin ang literal na idyomang “anak ng walumpung taon” sa karaniwang paraan ng pagsasabi ng edad sa Tagalog.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: Siya ang tumustos sa hari
  rationale: Sa konteksto, ang כלכל ay materyal na paglalaan at pagsuporta sa mga pangangailangan; tuwiran at natural itong ipinahahayag ng “tumustos.”
- source_word: בְּשִׁיבָתוֹ
  choice: habang nananatili ito
  rationale: Ang ישב dito ay tumutukoy sa pananatili o pagtira. Ginamit ang “ito” upang malinaw na ang hari ang tinutukoy ng hulapi.
- source_word: בְמַחֲנַיִם
  choice: sa Mahanaim
  rationale: Isinatinig ang pangalang-lugar sa anyong pamilyar at malapit sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag kung bakit nakatustos si Barzilai sa hari.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: isa siyang lubhang mayamang tao
  rationale: Sa agarang konteksto ng pagtustos sa hari, malamang na tumutukoy ang malawak na pariralang “napakadakilang tao” sa malaking kayamanan o kakayahang pinansiyal. Itinatala sa talababa ang tunay na mas malawak na saklaw nito.
