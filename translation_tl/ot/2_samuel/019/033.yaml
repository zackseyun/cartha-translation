revisions:
- from: Napakatanda na ni Barzilai—walumpung taong gulang na siya. Siya ang tumustos sa hari habang nananatili ito sa Mahanaim, sapagkat isa siyang lubhang mayamang tao.[a]
  to: Napakatanda na si Barzilai, walumpung taong gulang. Tinustusan niya ang hari habang nananatili ang hari sa Mahanaim, sapagkat isa siyang lubhang mayamang tao.[a]
  rationale: Inayos ang pagtukoy sa hari upang maging magalang at natural sa modernong Filipino Tagalog, at pinasimple ang pandiwang pangsalaysay nang hindi binabago ang aspekto o kahulugan. Pinanatili ang kontekstuwal na “lubhang mayamang tao” at ang talababa upang hindi ikulong ang malawak na kahulugan ng Hebreong parirala sa kayamanan lamang.
