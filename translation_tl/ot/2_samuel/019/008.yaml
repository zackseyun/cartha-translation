revisions:
- from: 'Ngayon, bumangon ka, lumabas, at kausapin mo ang puso ng iyong mga lingkod.[a] Sapagkat sumusumpa ako sa pangalan ni Yahweh: kung hindi ka lalabas, wala ni isang lalaking mananatili sa iyo ngayong gabi. At magiging mas masama ito para sa iyo kaysa sa lahat ng kapahamakang dumating sa iyo mula sa iyong kabataan hanggang ngayon.'
  to: 'Ngayon, bumangon ka, lumabas, at kausapin mo nang magiliw ang iyong mga lingkod.[a] Sapagkat sumusumpa ako kay Yahweh: kung hindi ka lalabas, wala ni isang lalaking mananatiling kasama mo ngayong gabi. At magiging mas masama ito para sa iyo kaysa sa lahat ng kapahamakang dumating sa iyo mula sa iyong kabataan hanggang ngayon.'
