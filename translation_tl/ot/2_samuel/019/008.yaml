base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: tl
  text: 'Ngayon, bumangon ka, lumabas, at kausapin mo nang magiliw ang iyong mga lingkod.[a] Sapagkat sumusumpa ako kay Yahweh: kung hindi ka lalabas, wala ni isang lalaking mananatiling kasama mo ngayong gabi. At magiging mas masama ito para sa iyo kaysa sa lahat ng kapahamakang dumating sa iyo mula sa iyong kabataan hanggang ngayon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kausapin ang puso ng iyong mga lingkod,” isang idyomang nangangahulugang kausapin sila nang magiliw, nakapagpapalakas-loob, o mapanghikayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה קוּם צֵא
  choice: Ngayon, bumangon ka, lumabas
  rationale: 'Pinananatili ang agarang paglipat ng usapan at ang dalawang magkahiwalay na utos: bumangon at lumabas.'
- source_word: וְדַבֵּר עַל־לֵב
  choice: kausapin mo ang puso ng
  rationale: Pinananatili sa teksto ang malinaw na larawang Hebreo sa halip na pumili lamang ng isa sa mga posibleng diwa nito—magiliw, nakapagpapalakas-loob, o mapanghikayat na pananalita. Ipinaliliwanag ito sa talababa.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa kontekstong maharlika at militar, tumutukoy ito sa mga tauhan o nasasakupan ng hari; ang “mga lingkod” ay nagpapanatili sa relasyong ipinahihiwatig ng salita nang hindi labis na binibigyang-diin ang pagkaalipin.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: Sapagkat sumusumpa ako sa pangalan ni Yahweh
  rationale: Ipinahahayag nito ang kasalukuyang lakas ng panunumpa. Ang “sa pangalan ni” ay likas na paraan sa Filipino upang ipahayag ang panunumpa na ang saksi o panagot ay si Yahweh.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: kung hindi ka lalabas
  rationale: Isinasalin bilang tuwirang kondisyon, gaya ng hinihingi ng babalang nakapaloob sa panunumpa.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: wala ni isang lalaking mananatili sa iyo ngayong gabi
  rationale: Ang “wala ni isang lalaki” ay nagpapanatili sa idiomatikong diin ng אִישׁ at sa ganap na pagtalikod na ibinabala; ang לין ay mananatili o magpapalipas ng gabi.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל הָרָעָה
  choice: magiging mas masama ito para sa iyo kaysa sa lahat ng kapahamakan
  rationale: Ang paghahambing ay tahasang ipinapahayag ng kasunod na min-clause. Ang “kapahamakan” ay tumutukoy sa dinanas na kasawian, hindi sa moral na kasamaan.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: mula sa iyong kabataan hanggang ngayon
  rationale: Pinananatili ang buong saklaw ng panahon mula sa kabataan ni David hanggang sa kasalukuyang krisis.
theological_decisions:
- issue: Paglalarawan sa bigat ng paparating na bunga
  choice: mas masama ito para sa iyo kaysa sa lahat ng kapahamakan
  alternative: magiging higit itong kapahamakan sa iyo kaysa sa lahat ng kapahamakang dinanas mo
  rationale: Hindi ginagawang moral na “kasamaan” ang רָעָה; sa konteksto, babala ito tungkol sa matinding kasawian o kapahamakan.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na tuwiran ngunit marangal. Pinanatili ang dalawang utos at ang madiing babala. Ang Hebreong idyoma tungkol sa puso ay sadyang pinanatili sa pangunahing teksto at nilinaw sa talababa upang hindi pumili nang tahimik sa magkakaugnay na diwang magiliw, nakapagpapatatag, at mapanghikayat.
