review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the urgent sequence of imperatives, the oath by Yahweh, the conditional warning of total abandonment that night, and the comparison with David's accumulated adversity. However, “sa pangalan ni Yahweh” adds a lexical element (“name”) not present in the Hebrew; “kay Yahweh” directly renders the oath formula. The literal Hebrew idiom “speak to the heart” is not natural Tagalog as rendered and is better communicated in the text, with its literal form documented in the footnote.
  naturalness: Modern Filipino is generally clear and appropriately dignified. “Kausapin mo ang puso ng iyong mga lingkod” is structurally comprehensible but not an established natural Tagalog expression. “Kausapin mo nang magiliw ang iyong mga lingkod” communicates the idiom naturally. “Kasama mo” is also more natural than “sa iyo” for remaining with someone.
  terminology: “Yahweh” consistently represents יהוה. “Mga lingkod” suitably fits the royal-political context, and “kapahamakan” correctly conveys adversity rather than moral evil.
  issues:
  - severity: medium
    issue: The oath is rendered “sumusumpa ako sa pangalan ni Yahweh.”
    rationale: The Hebrew says literally “I swear by Yahweh,” not explicitly “in the name of Yahweh.” “Sumusumpa ako kay Yahweh” is direct and idiomatic without adding “pangalan.”
  - severity: medium
    issue: The main text translates the Hebrew idiom as “kausapin mo ang puso ng iyong mga lingkod.”
    rationale: This is overly literal and unnatural in modern Filipino. The idiom denotes speaking kindly, encouragingly, or persuasively; “kausapin mo nang magiliw” is a safe contextual rendering, while a footnote can preserve the literal Hebrew wording.
  revised_text: 'Ngayon, bumangon ka, lumabas, at kausapin mo nang magiliw ang iyong mga lingkod.[a] Sapagkat sumusumpa ako kay Yahweh: kung hindi ka lalabas, wala ni isang lalaking mananatiling kasama mo ngayong gabi. At magiging mas masama ito para sa iyo kaysa sa lahat ng kapahamakang dumating sa iyo mula sa iyong kabataan hanggang ngayon.'
