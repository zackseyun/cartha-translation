  text: וַ/יֻּגַּ֖ד לְ/יוֹאָ֑ב הִנֵּ֨ה הַ/מֶּ֧לֶךְ בֹּכֶ֛ה וַ/יִּתְאַבֵּ֖ל עַל אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: tl
  text: At ibinalita kay Joab, “Tingnan mo, umiiyak ang hari at nagluluksa dahil kay Absalom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: ibinalita
  rationale: Ang Hophal na anyo ay nagsasaad na ipinaalam ang balita kay Joab nang hindi tinutukoy kung sino ang naghatid nito. Likas sa Filipino ang “ibinalita” at napananatili nito ang di-tiyak na tagapagbalita.
- source_word: לְיוֹאָב
  choice: kay Joab
  rationale: Karaniwang anyo sa Filipino para sa pang-ukol na tumutukoy sa taong pinagsabihan.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ito na nagbibigay ng kasiglahan at kagyat na diin sa nilalaman ng balita; mas moderno at natural kaysa “Narito.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak na titulo sa Hebreo sa halip na palitan ito ng pangalang David.
- source_word: בֹּכֶה
  choice: umiiyak
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na kilos; natural na naipahahayag ito ng aspektong imperpektibo sa Filipino.
- source_word: וַיִּתְאַבֵּל
  choice: nag­luluksa
  rationale: Ang Hitpael ng אבל ay tumutukoy sa hayag at nagpapatuloy na pagdadalamhati, lalo na kaugnay ng kamatayan.
- source_word: עַל אַבְשָׁלֹם
  choice: dahil kay Absalom
  rationale: Sa kontekstong ito, ang עַל ay tumutukoy sa taong siyang dahilan o paksa ng pagluluksa. Natural sa Filipino ang “dahil kay Absalom,” bagaman maaari ring sabihing “para kay Absalom.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Tingnan mo” upang mapanatili ang biglang pantawag-pansin ng הִנֵּה, at ang mga aspektong “umiiyak” at “nagluluksa” upang ihayag ang nagpapatuloy na kalagayan ng hari.
