base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: tl
  text: sa pagmamahal mo sa mga napopoot sa iyo at sa pagkapoot mo sa mga umiibig sa iyo. Sapagkat nilinaw mo ngayon na walang halaga sa iyo ang mga pinuno at mga lingkod.[a] Sapagkat alam ko ngayon na kung buhay si Absalom at patay lahat kami ngayon,[b] iyon ang magiging tama sa iyong paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ipinahayag mo ngayon na wala kang mga pinuno at mga lingkod.” Ibig sabihin ng idyomang Hebreo na hindi sila mahalaga sa paningin ni David.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “kung buhay lamang si Absalom at patay lahat kami ngayon.” Isang matalim na paratang na salungat sa aktuwal na nangyari ang mga salita ni Joab, hindi literal na pag-uulat ng sinabi ni David.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: sa pag-ibig mo sa mga napopoot sa iyo
  rationale: Pinananatili ng pariralang may pangngalang-diwa ang anyong infinitive at ang kaugnayan nito sa naunang pangungusap, habang malinaw na si David ang gumagawa ng kilos.
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: at sa pagkapoot mo sa mga umiibig sa iyo
  rationale: Tumutugma ito sa unang parirala at pinananatili ang matinding pag-iiba ng ‘napopoot’ at ‘umiibig.’
- source_word: הִגַּדְתָּ
  choice: nilinaw mo
  rationale: Sa konteksto, ipinakita o ipinahayag ni David sa pamamagitan ng kanyang kilos ang ipinaparatang ni Joab; mas natural dito ang ‘nilinaw’ kaysa literal na ‘sinabi.’
- source_word: שָׂרִים וַעֲבָדִים
  choice: mga pinuno at mga lingkod
  rationale: Ang שָׂרִים ay tumutukoy sa mga namumuno, lalo na sa kontekstong militar at maharlika, samantalang ang עֲבָדִים ay mga taong naglilingkod sa hari. Hindi nililimitahan ng salin ang una sa iisang uri ng opisyal.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: walang halaga sa iyo ang mga pinuno at mga lingkod
  rationale: Ipinahahayag ng idyoma ang kawalan nila ng halaga sa pagtataya ni David, hindi ang literal na kawalan ng mga pinuno at lingkod.
- source_word: יָדַעְתִּי הַיּוֹם
  choice: Nalaman ko ngayon
  rationale: Ipinapakita nito ang kongklusyong nabuo ni Joab dahil sa mga pangyayari nang araw na iyon.
- source_word: לא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: kung buhay si Absalom at kaming lahat ay patay ngayon
  rationale: 'Ang konteksto ay nangangailangan ng isang matalim na pahayag na salungat sa nangyari: pinararatangan ni Joab si David na mas gugustuhin niya ang ganitong kalagayan.'
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: magiging matuwid iyon sa iyong paningin
  rationale: Pinananatili nito ang Hebreong idyoma at ang moral na diin ng יָשָׁר, sa halip na pahinain ito bilang simpleng ‘ikagagalak mo.’
theological_decisions:
- issue: Ang pahayag tungkol sa kagustuhan ni David na mabuhay si Absalom kapalit ng pagkamatay ng kanyang mga tauhan
  choice: Isinalin bilang isang kundisyong salungat sa aktuwal na nangyari at bilang paratang ni Joab
  alternative: Basahin bilang literal na sinabi o tuwirang inamin ni David
  rationale: Walang iniulat na gayong mismong sinabi si David; ito ay retorikal at matinding hinuha ni Joab mula sa pagdadalamhati ng hari. Hindi pinagtitibay ng salin na obhetibong tama ang paratang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘napopoot’ at ‘umiibig’ upang mapanatili ang pandiwang lakas at malinaw na pagtutunggali ng Hebreo. Ang ‘sa pag-ibig mo … at sa pagkapoot mo’ ay sadyang nagpapanatili sa ugnayan ng talata sa naunang sugnay.
