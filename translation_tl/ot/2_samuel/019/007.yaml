- from: sa pag-ibig mo sa mga napopoot sa iyo at sa pagkapoot mo sa mga umiibig sa iyo. Sapagkat nilinaw mo ngayon na walang halaga sa iyo ang mga pinuno at mga lingkod.[a] Nalaman ko ngayon na kung buhay si Absalom at kaming lahat ay patay ngayon,[b] magiging matuwid iyon sa iyong paningin.
  to: sa pagmamahal mo sa mga napopoot sa iyo at sa pagkapoot mo sa mga umiibig sa iyo. Sapagkat nilinaw mo ngayon na walang halaga sa iyo ang mga pinuno at mga lingkod.[a] Sapagkat alam ko ngayon na kung buhay si Absalom at patay lahat kami ngayon,[b] iyon ang magiging tama sa iyong paningin.
