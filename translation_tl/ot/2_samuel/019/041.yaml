base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: tl
  text: Pagkatapos, tumawid ang hari patungong Gilgal, at tumawid kasama niya si Kimham. Ang hari ay inihatid sa pagtawid ng buong bayan ng Juda at gayundin ng kalahati ng bayan ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinatawid ang hari” o “dinala ang hari sa kabilang pampang.” Sa kontekstong ito, ang pandiwang Hebreo ay maaaring magkaroon ng diwang sanhi kapag may tuwirang layon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Ang עבר sa konteksto ay tumutukoy sa pagtawid, malamang sa Jordan; tuwiran at natural ang “tumawid” sa Filipino.
- source_word: הַגִּלְגָּלָה
  choice: patungong Gilgal
  rationale: Ipinahihiwatig ng directional he ang pagkilos tungo sa Gilgal; pinananatili ng “patungong” ang direksiyonal na diwa.
- source_word: וְכִמְהָן
  choice: at ... si Kimham
  rationale: Isinalin sa transliterasyon ang pangalang pantangi, na iniangkop sa baybay na ginagamit sa consultation layer.
- source_word: עָבַר עִמּוֹ
  choice: tumawid na kasama niya
  rationale: Inuulit ang pandiwang עבר at pinananatili ang ugnayan nito sa naunang pagtawid ng hari.
- source_word: וְכָל עַם יְהוּדָה
  choice: ng buong bayan ng Juda
  rationale: Ang עַם יְהוּדָה ay tumutukoy sa mamamayan o pangkat mula sa Juda; natural at malinaw sa modernong Filipino ang “buong bayan ng Juda.”
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: Inihatid ... ang hari sa pagtawid
  rationale: Kapag may tuwirang layon, maaaring maging causative o transfer ang עבר. Ipinapahayag ng “inihatid ... sa pagtawid” ang aktibong pag-alalay o pagsama nang hindi ginagawang mekanikal ang “pinatawid.”
- source_word: וְגַם
  choice: gayundin
  rationale: Malinaw nitong idinaragdag ang isa pang pangkat sa mga naghatid sa hari.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: kalahati ng bayan ng Israel
  rationale: Pinananatili ang dami at ang pampolitikang pagkakaiba ng Juda at Israel nang hindi pinalalawak ang kahulugan.
