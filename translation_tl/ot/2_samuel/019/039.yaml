translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang konkretong larawan ng “sa iyong paningin” at, sa abot ng natural na pagpapahayag, ang eliptikong diwa ng pangakong tatanggapin ng hari ang anumang pananagutang piliin ni Barzillai.
