  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari, “Sasama sa akin si Kimham sa pagtawid, at gagawin ko para sa kanya ang anumang mabuti sa iyong paningin. At anumang piliin mong ipagawa sa akin[a], gagawin ko para sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “anumang hilingin mo sa akin, gagawin ko para sa iyo.” Medyo eliptiko ang pananalita sa Hebreo; literal, “anumang piliin mo sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Pagkatapos, sinabi ng hari
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Tumawid si Kimham kasama ko
  rationale: Ang imperfect ay may jussive na diwa, kaya ipinahahayag nito ang pasiya o paanyaya ng hari. Pinananatili ng “tumawid” ang mahalagang pandiwang ginamit sa konteksto ng pagtawid sa Jordan.
- source_word: כִּמְהָם
  choice: Kimham
  rationale: Isinalin-titik ang pangalang pantangi ayon sa karaniwang anyo nito.
- source_word: וַאֲנִי אֶעֱשֶׂה לוֹ
  choice: at gagawin ko para sa kanya
  rationale: Malawak ang kahulugan ng עשה; nananatiling malapit sa Hebreo ang parirala nang hindi tinutukoy nang higit sa teksto ang uri ng kabutihang gagawin.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: ang mabuti sa iyong paningin
  rationale: Pinananatili nito ang Hebreong larawang tumutukoy sa kung ano ang itinuturing na mabuti o kalugud-lugod ng kausap.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: At anumang ipapasan mo sa akin
  rationale: Ang Hebreong parirala ay eliptiko, literal na may diwang “anumang piliin mo sa ibabaw/ukol sa akin.” Ipinahihiwatig ng “ipapasan” ang pananagutang kusang tatanggapin ng hari habang pinananatili ang larawan ng pang-ukol na עַל.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: gagawin ko para sa iyo
  rationale: Tapat nitong pinananatili ang personal na pangako ng hari kay Barzillai at natural ang anyo sa Filipino.
