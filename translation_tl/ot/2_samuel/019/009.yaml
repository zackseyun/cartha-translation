base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: tl
  text: Pagkatapos, tumayo ang hari at umupo sa pintuang-bayan.[a] Ipinaalam sa lahat ng tao, “Tingnan ninyo, nakaupo ang hari sa pintuang-bayan.” At humarap sa hari ang lahat ng tao. Ngunit tumakas na ang Israel,[b] bawat lalaki patungo sa kani-kaniyang tolda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pintuang-bayan ay hindi lamang pasukan; karaniwan din itong lugar ng pampublikong pagtitipon at pamamahala.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “At tumakas ang Israel.” Maaaring payak na “at” ang pangatnig na Hebreo; ipinakikita ng “ngunit” sa pangunahing teksto ang pagsalungat sa konteksto.'
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “bawat lalaki sa kaniyang mga tolda,” isang idyoma para sa paghiwa-hiwalay o pag-uwi ng bawat isa sa sariling tirahan o nasasakupang lipi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: Pagkatapos, tumayo ang hari
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng kasunod na kilos sa salaysay. Ang “tumayo” ay likas sa modernong Tagalog at hindi nagpapahiwatig nang higit sa pinagmulan.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: umupo sa may pintuang-bayan
  rationale: Ang ישׁב ay “umupo,” at ang שַׁעַר dito ay pintuang-bayan bilang pampublikong lugar. Ang “sa may” ay natural sa Tagalog para sa lokasyong ito nang hindi nililimitahan kung nasa loob o mismong tabi siya ng pasukan.
- source_word: הִגִּידוּ לֵאמֹר
  choice: Ipinaalam
  rationale: Ang Hiphil ng נגד ay nangangahulugang magbalita o magpabatid. Walang tiyak na tinutukoy na gumagawa sa maramihang pandiwa, kaya likas na impersonal ang “ipinaalam”; hindi na kailangang tularan ang Hebreong pormulang “na sinasabi.”
- source_word: הִנֵּה
  choice: Narito
  rationale: Ang הִנֵּה ay pantawag-pansin na nagtuturo sa kasalukuyang kalagayan. Ang “Narito” ay dignified ngunit karaniwang Filipino at angkop sa nakikitang presensiya ng hari.
- source_word: יוֹשֵׁב
  choice: nakaupo
  rationale: Ang participle ay naglalarawan sa kasalukuyan at nagpapatuloy na kalagayan ng hari. Malinaw itong naihahayag ng “nakaupo.”
- source_word: וַיָּבֹא כָל־הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: Kaya humarap sa hari ang lahat ng tao
  rationale: Ang בוא + לפני ay literal na paglapit sa harapan ng hari. Ang “humarap sa hari” ay natural at pinananatili ang pampublikong pagharap, samantalang ang “kaya” ay naglalahad ng tugon ng mga tao sa balita.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Ngunit tumakas na ang Israel
  rationale: Ang qatal נָס ay maaaring magsaad ng naunang o nakasaad-na kalagayan kaugnay ng agarang tagpo, kaya “tumakas na.” Isinasalamin ng “ngunit” ang kontekstuwal na pagsalungat, habang itinatala sa talababa na maaari ring payak na “at” ang pangatnig.
- source_word: אִישׁ לְאֹהָלָיו
  choice: bawat lalaki patungo sa kani-kaniyang tolda
  rationale: Pinananatili ng “bawat lalaki” ang tahasang panlalaking distributibong אִישׁ, at ng “kani-kaniyang tolda” ang Hebreong larawan at diwang nagkawatak-watak sila patungo sa sariling tirahan.
theological_decisions:
- issue: Panlalaking distributibong אִישׁ
  choice: bawat lalaki
  alternative: bawat isa / ang lahat
  rationale: Tahasang panlalaki ang anyong Hebreo at bahagi ito ng idyomang distributibo. Pinananatili ang anyo nang hindi ipinapalagay na may dagdag na doktrinal na kahulugan.
- issue: Ugnayan ng huling sugnay sa naunang tagpo
  choice: Ngunit tumakas na ang Israel
  alternative: At tumakas ang Israel
  rationale: Maaaring unawain ang waw bilang simpleng “at” o bilang kontekstuwal na pagsalungat. Ang pangunahing salin ay nagpapakita ng contrast at ng background sense ng qatal, ngunit hindi itinatago sa talababa ang mas payak na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pintuang-bayan” upang makilala ang civic city gate sa karaniwang pinto, at “Israel” bilang kolektibong katawagan gaya ng nasa Hebreo. Inayos ang mga talababa upang ang bawat marker ay tumugma sa mismong pariralang ipinapaliwanag.
