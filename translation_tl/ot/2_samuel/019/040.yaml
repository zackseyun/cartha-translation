base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: tl
  text: Tumawid sa Jordan ang buong bayan, at tumawid din ang hari. Pagkatapos, hinalikan ng hari si Barzilai at pinagpala siya. At bumalik siya sa sarili niyang lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “siya” ay malamang na tumutukoy kay Barzilai. Maaari ring isalin: “At bumalik si Barzilai sa sarili niyang lugar.”'
    reason: Nililinaw ang pinakamalamang na tinutukoy ng panghalip nang hindi inaalis sa pangunahing teksto ang bahagyang kalabuan ng Hebreo.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Ang pandiwang עבר ay tumutukoy rito sa pagtawid sa Ilog Jordan; ang “tumawid” ang likas at tiyak na katumbas sa modernong Tagalog.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Malawak ang saklaw ng עָם at hindi kailangang tumukoy lamang sa mga kawal. Ang “buong bayan” ay natural na tumutukoy sa lahat ng taong kasama sa tagpo.
- source_word: אֶת הַיַּרְדֵּן
  choice: sa Jordan
  rationale: Ang pangalan ay tumutukoy sa Ilog Jordan. Sa pariralang “tumawid sa Jordan,” malinaw na ilog ang tinutukoy kaya hindi kailangang idagdag ang salitang “Ilog.”
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: at tumawid din ang hari
  rationale: Pinananatili ang pag-uulit ng עבר at ginagamit ang “din” upang maging natural sa Tagalog at ipakitang kasama ring tumawid ang hari.
- source_word: וַיִּשַּׁק
  choice: hinalikan
  rationale: Ang נשק sa anyong ito ay nangangahulugang humalik; ang payak na pandiwa ay angkop sa kilos ng pagmamahal at pamamaalam.
- source_word: לְבַרְזִלַּי
  choice: si Barzilai
  rationale: Isinalin sa karaniwang baybay-Tagalog ang personal na pangalang Barzillai bilang “Barzilai.”
- source_word: וַיְבָרֲכֵהוּ
  choice: pinagpala siya
  rationale: Tahasang ginagamit ng Hebreo ang pandiwang ברך, “pagpalain.” Pinananatili nito ang diwa ng pagbabasbas sa halip na gawing pangkalahatang pamamaalam lamang.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: At bumalik siya sa sarili niyang lugar
  rationale: Pinananatili ng “siya” ang hindi tahasang pinangalanang simuno sa Hebreo, habang ang “sarili niyang lugar” ay tapat sa מְקוֹמוֹ at hindi labis na ipinapakahulugang “bahay.”
