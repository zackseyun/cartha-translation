  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: tl
  text: Sinabi ni Mefiboset sa hari, “Pati ang lahat ay kunin na niya, yamang nakabalik nang ligtas[a] sa kanyang tahanan ang panginoon kong hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sa kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na katumbas ng wayyiqtol ng אמר; natural sa makabagong Filipino.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Pinanatili ang titulong nasa Hebreo nang hindi idinaragdag ang pangalang David.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: Kunin na rin niya ang lahat
  rationale: Ipinahahayag ng imperfect ang kusang pagpapaubaya, at binibigyang-diin ng גַּם na maaari niyang kunin maging ang kabuuan.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: yamang
  rationale: Sa konteksto, ipinakikilala nito ang dahilan ng pagpapaubaya; ang “yamang” ay natural at marangal na Filipino.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Pinananatili ang magalang na pananalita sa hari nang hindi nagdaragdag ng paliwanag.
- source_word: בְּשָׁלוֹם
  choice: nang ligtas
  rationale: Sa konteksto ng pagbabalik, tumutukoy ito sa ligtas at maayos na pagdating; mas malinaw ito kaysa sa literal na “may kapayapaan.”
- source_word: אֶל בֵּיתוֹ
  choice: sa sarili niyang tahanan
  rationale: Ipinakikita ang possessive na diin at ang pagbabalik ng hari sa kanyang tahanan.
