translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “amin/ninyo/kami” sa tuwirang pananalita dahil ang isahang tagapagsalita ay hayagang kumakatawan sa pangkat; hindi nito binabago ang kolektibong diwa ng Hebreo. Iniwasan ang sobrang literal na “lalaki ng Israel/Juda,” na hindi natural sa kasalukuyang Tagalog.
