revisions:
- from: Sumagot ang kinatawan ng Israel sa kinatawan ng Juda, “Sampung bahagi ang sa amin sa hari,[a] at mas malaki rin kaysa sa inyo ang bahagi namin kay David.[b] Bakit ninyo kami hinamak? Hindi ba kami ang unang nagsalita tungkol sa pagpapabalik sa aming hari?”[c] Ngunit mas mabagsik ang pananalita ng mga taga-Juda kaysa sa pananalita ng mga taga-Israel.[d]
  to: Sumagot ang isang Israelita sa isang taga-Juda, “May sampung bahagi ako sa hari,[a] at kay David ay mas malaki ang bahagi ko kaysa sa iyo.[b] Bakit mo ako hinamak? Hindi ba ako ang unang nagsalita tungkol sa pagpapabalik ng aking hari?”[c] Ngunit mas mabagsik ang pananalita ng mga taga-Juda kaysa sa pananalita ng mga taga-Israel.[d]
  rationale: Ibinalik ang isahang anyo ng diyalogo upang sundin ang Hebreo at mapanatili ang mariing “aking hari,” samantalang pinanatili ang maramihang kolektibong diwa sa pangwakas na buod. Inalis ang “kinatawan,” dahil posible ngunit hindi tahasang sinasabi ng teksto. Pinakinis ang unang pahayag at iniayon ang lahat ng talababa sa binagong isahang retorikal na tinig.
