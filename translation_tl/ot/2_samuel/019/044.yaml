base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: tl
  text: Sumagot ang isang Israelita sa isang taga-Juda, “May sampung bahagi ako sa hari,[a] at kay David ay mas malaki ang bahagi ko kaysa sa iyo.[b] Bakit mo ako hinamak? Hindi ba ako ang unang nagsalita tungkol sa pagpapabalik ng aking hari?”[c] Ngunit mas mabagsik ang pananalita ng mga taga-Juda kaysa sa pananalita ng mga taga-Israel.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “Sampung kamay ang sa akin sa hari.” Dito, ang “mga kamay” ay nangangahulugang mga bahagi o karapatan, malamang na tumutukoy sa paghahabol ng sampung lipi ng Israel kung ihahambing sa Juda.
    reason: cultural_note
  - marker: b
    text: O “mas malaki rin kaysa sa iyo ang karapatan ko kay David.” Maikli at elliptical ang Hebreo, ngunit nagpapahayag ito ng paghahambing sa bahagi o paghahabol kay David.
    reason: lexical_alternative
  - marker: c
    text: O “Hindi ba ang panukala ko ang unang magbalik sa aking hari?” Maaaring mangahulugan ang salitang Hebreo ng salita, usapin, o panukala.
    reason: alternative_reading
  - marker: d
    text: O “mas matindi” o “mas mabagsik ang mga salita.” Inilalarawan ng Hebreo ang higit na tindi o lupit ng pananalita ng Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: kinatawan ng Israel / kinatawan ng Juda; mga taga-Juda / mga taga-Israel
  rationale: Isahan ang anyong Hebreo ngunit kumakatawan ito sa bawat pangkat sa palitan ng salita. Ang “kinatawan” ay natural sa Tagalog at ipinahihiwatig ang tungkuling tagapagsalita; sa pangwakas na buod, ginamit ang kolektibong “mga taga-” ayon sa malinaw na maramihang diwa.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: Sampung bahagi ang sa amin sa hari
  rationale: Ang יָדוֹת ay literal na “mga kamay” ngunit nangangahulugang mga bahagi o karapatan sa idyomang ito. Pinanatili ng “sampung bahagi” ang bilang at malinaw na ipinapahayag ang paghahabol ng Israel.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: mas malaki rin kaysa sa inyo ang bahagi namin kay David
  rationale: Elliptical ang paghahambing sa Hebreo. Nililinaw ng salin na ang tinutukoy ay mas malaking bahagi o paghahabol kay David, hindi pangkalahatang pagiging higit na mahalaga.
- source_word: הֱקִלֹּתַנִי
  choice: hinamak ninyo kami
  rationale: Ang Hiphil ng קלל ay tumutukoy sa pagtrato sa iba bilang walang gaanong halaga. Ang “hinamak” ay natural at matindi ngunit hindi lumalampas tungo sa ideya ng pagkapoot.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: Hindi ba kami ang unang nagsalita tungkol sa pagpapabalik sa aming hari?
  rationale: Mahirap at bahagyang elliptical ang parirala. Maaaring tumukoy ang דָבָר sa salita, usapin, o panukala; pinananatili ng salin ang pangunahing ideya ng pagiging unang nagbanggit o nagpanukala sa pagbabalik ng hari.
- source_word: מַלְכִּי
  choice: aming hari
  rationale: Pinanatili ang panghalip na paari sapagkat mahalaga ito sa pahayag ng katapatan at karapatan. Ginawang maramihan ang tinig sa Tagalog upang tumugma sa kinatawang nagsasalita para sa buong Israel.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: mas mabagsik ang pananalita ng mga taga-Juda kaysa sa pananalita ng mga taga-Israel
  rationale: Ipinahihiwatig ng קשׁה ang tindi, lupit, o kabagsikan ng pagsasalita. Ang “pananalita” ay mas natural kaysa literal na “salita” bilang kolektibong paglalarawan sa sagutan.
