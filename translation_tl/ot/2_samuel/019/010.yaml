translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “lahi” hindi, kundi “lipi,” bilang karaniwang katawagan sa mga tribo ng Israel; pinanatili ang larawang “kamay” dahil malinaw ito sa konteksto at mahalaga sa parallelismo ng Hebreo.
