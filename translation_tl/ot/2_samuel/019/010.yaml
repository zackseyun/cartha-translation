language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: tl
  text: At nagtatalo-talo[a] ang buong bayan sa lahat ng lipi ng Israel. Sinasabi nila, “Iniligtas tayo ng hari mula sa kamay[b] ng ating mga kaaway, at sinagip niya tayo mula sa kamay ng mga Filisteo. Ngunit ngayo’y tumakas siya mula sa lupain dahil kay Absalom[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagdedebate” o “may pagtatalo.” Ipinahihiwatig ng Hebreo ang malawakang pagtatalo o debate sa mga lipi, hindi lamang karaniwang usapan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa kamay.” Isang idyomang Hebreo ito na nangangahulugang mula sa kapangyarihan o pagkontrol ng iba. Inuulit din ang idyoma sa pariralang “mula sa kamay ng mga Filisteo.”
    reason: idiom_explanation
  - marker: c
    text: Ang “dahil kay Absalom” ay maaari ring isalin na “mula sa harap ni Absalom” o “dahil sa presensiya ni Absalom”; inilalarawan nito ang pagtakas palayo sa kanya o dahil sa banta niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: nagtatalo-talo
  rationale: Ipinahihiwatig ng Niphal participle ang malawakang pagtatalo o masiglang pag-uusap ng bayan, hindi lamang karaniwang pag-uusap. Likas sa modernong Tagalog ang reduplikasyong “nagtatalo-talo” para sa alitang kinasasangkutan ng maraming tao.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: sa lahat ng lipi ng Israel
  rationale: Malinaw nitong ipinapakita na laganap ang pagtatalo sa buong Israel, sa bawat lipi nito.
- source_word: הִצִּילָנוּ
  choice: iniligtas tayo
  rationale: Ang “iniligtas” ay natural at angkop sa kontekstong militar at pampolitika ng paglaya mula sa panganib o kapangyarihan ng kaaway.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: mula sa kamay ng ating mga kaaway
  rationale: Pinananatili ang Hebreong larawang “kamay,” na nauunawaan din sa Tagalog bilang kapangyarihan o pagkontrol.
- source_word: מִלְּטָנוּ
  choice: sinagip niya tayo
  rationale: Ipinakikita ng “sinagip” ang magkasingkahulugan ngunit bahagyang magkaibang pandiwa sa magkatabing mga sugnay.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: mula sa kamay ng mga Filisteo
  rationale: Pinananatili ang parallelismo ng Hebreo at ang idyoma ng paglaya mula sa kapangyarihan ng iba.
- source_word: וְעַתָּה
  choice: Ngunit ngayo’y
  rationale: Ginagawang malinaw sa natural na Tagalog ang paghahambing ng dating pagliligtas ng hari at ng kasalukuyan niyang pagtakas.
- source_word: בָּרַח מִן הָאָרֶץ
  choice: tumakas siya mula sa lupain
  rationale: Tuwirang inilalarawan ang pag-alis ni David sa nasasakupang lupain; hindi nito pinaliliit ang אֶרֶץ sa isang lungsod o rehiyon na hindi tinukoy.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: dahil kay Absalom
  rationale: Pagkatapos ng pandiwa ng pagtakas, ipinahihiwatig ng parirala ang paglayo bunga ng presensiya o banta ni Absalom. Natural itong naipapahayag sa Tagalog bilang “dahil kay Absalom,” habang itinatala sa talababa ang mas literal na anyo.
