translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na wikang panghukuman sa “panginoon kong hari” at “iyong lingkod,” habang ginawang natural ang pagkakasunod-sunod ng layunin sa tuwirang pananalita.
