base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: tl
  text: At siniraan niya ang iyong lingkod sa panginoon kong hari[a]. Sinabi kasi ng iyong lingkod, ‘Lalagyan ko ng siyá ang asno para sa akin upang masakyan ko ito at makasama ko ang hari,’ sapagkat pilay ang iyong lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilinlang niya ako” o “pinagtaksilan niya ako.” Ang pandiwang Hebreo ay maaaring tumukoy sa panlilinlang o pagtataksil; “siniraan” ang ginamit dito dahil ang konteksto ay tungkol sa maling ulat na ibinigay sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: siniraan niya ang iyong lingkod
  rationale: Sa konteksto, inaakusahan ni Mefiboset ang kaniyang lingkod na nagbigay ng maling salaysay tungkol sa kaniya sa hari. Ang “siniraan” ay likas sa Tagalog at mas tiyak kaysa sa pangkalahatang “nilinlang,” habang ang talababa ay nagpapanatili sa mas malawak na saklaw ng pandiwa.
- source_word: עַבְדִּי
  choice: aking lingkod
  rationale: Tumutukoy ito sa personal na tagapaglingkod ni Mefiboset; ang “lingkod” ay angkop sa kontekstong maharlika at hindi labis na nagtatakda ng legal na katayuan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Pinananatili nito ang magalang at pormal na pananalita sa hari sa paraang maikli at likas sa marangal na Tagalog.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Ipapasiyahan ko ang asno
  rationale: Ang חבש ay paghahanda o paglalagay ng siyá sa hayop na sasakyan. Ipinakikita ng anyong unang panauhan ang pasiya o layunin; ang causative na “ipapasiyahan” ay angkop dahil ang konteksto ay nagpapahiwatig na uutusan niya ang lingkod na ihanda ito, lalo na't pilay siya.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: para masakyan ko ito
  rationale: Malinaw at likas na ipinahahayag ang layunin ng paghahanda sa asno.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: at makasama ako sa hari
  rationale: Ang הלך na may אֶת dito ay nagsasaad ng pagsama. Ang “makasama sa hari” ay natural na Filipino at hindi ito ginagawang simpleng pagpunta lamang sa hari.
- source_word: פִסֵּחַ
  choice: pilay
  rationale: Tuwirang katumbas ito ng pisikal na kalagayang tinutukoy at karaniwang nauunawaan sa modernong Filipino.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Pinananatili nito ang mapagpakumbabang pormula ng pagtukoy sa sarili sa harap ng hari.
