translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa הָעָם upang mapanatili ang pangkalahatang saklaw nito, at “pagluluksa/pagdadalamhati” upang maipakita ang pampubliko at mabigat na kalungkutan. Lahat ng panandang talababa ay nasa pangunahing teksto.
