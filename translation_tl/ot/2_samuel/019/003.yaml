base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: tl
  text: Kaya ang tagumpay ng araw na iyon ay napalitan ng pagluluksa para sa buong bayan[a], sapagkat ng araw na iyon ay narinig ng bayan na sinasabi[b], “Nagdadalamhati ang hari dahil sa kanyang anak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagliligtas ng araw na iyon ay naging pagluluksa para sa buong bayan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “narinig ng bayan, na sinasabi,” isang idyoma para sa pagkarinig ng isang ulat o ng sinasabi ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: ang tagumpay
  rationale: Sa konteksto ng katatapos na labanan, tumutukoy ito sa matagumpay na kinalabasan o pagliligtas sa digmaan. Ang “tagumpay” ang pinakanatural sa modernong Tagalog; ang “kaligtasan” ay maaaring magtunog labis na teolohikal dito.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: ay napalitan ng pagluluksa
  rationale: Ipinahahayag ng Hebreo na ang tagumpay ay naging pagluluksa. Ang “napalitan ng pagluluksa” ay natural at malinaw na naghahatid ng biglang pagbaligtad ng kalagayan.
- source_word: אֵבֶל
  choice: pagluluksa
  rationale: Tumutukoy ito sa hayag o sama-samang pagdadalamhati, kaya mas angkop ang “pagluluksa” kaysa sa panloob lamang na “lungkot.”
- source_word: הָעָם
  choice: ang bayan
  rationale: Pangkalahatang katawagan ang Hebreo sa mga taong nakapanig kay David, kabilang ang mga kawal. Pinananatili ng “bayan” ang lawak ng salita sa halip na paliitin ito sa “hukbo.”
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: sapagkat ... narinig ng bayan ang balitang
  rationale: Ang konstruksiyon ay idyoma para sa pagkarinig ng isang ulat. Natural sa Tagalog ang “narinig ... ang balitang” at maayos nitong ipinapasok ang tuwirang sipi.
- source_word: נֶעֱצַב
  choice: nagdadalamhati
  rationale: Ipinahahayag ng Niphal ang pagiging nasaktan o lubhang nalungkot. Ang “nagdadalamhati” ay natural at may angkop na bigat sa dalamhati ng hari.
- source_word: עַל בְּנוֹ
  choice: dahil sa kanyang anak
  rationale: Tinutukoy ng עַל ang dahilan o paksa ng pagdadalamhati. Ang “dahil sa kanyang anak” ay malinaw at likas sa Tagalog nang hindi tinutukoy kung dahil ito sa pagkamatay o sa iba pang aspekto ng nangyari.
