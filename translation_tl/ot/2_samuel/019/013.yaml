  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: tl
  text: Kayo'y mga kapatid ko[a]; kayo'y sarili kong buto at laman[b]. Kaya bakit kayo ang huling kikilos upang maibalik ang hari?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa diwa, “mga kamag-anak ko”; literal na “mga kapatid ko.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “buto ko at laman ko,” isang idyoma para sa malapit na ugnayang kadugo.
