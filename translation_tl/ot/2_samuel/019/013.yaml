    text: Tinutukoy ni David ang kanyang sarili sa ikatlong panauhan bilang “ang hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: mga kapatid ko
  rationale: Tuwirang pinananatili ang literal na larawan ng Hebreo habang ipinahihiwatig ng konteksto na ang tinutukoy ay mga kalahi o malalapit na kamag-anak ni David.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: sarili kong buto at laman
  rationale: Pinananatili ang kongkretong idyomang Hebreo para sa malapit na ugnayang kadugo; natural din itong maunawaan sa Filipino sa tulong ng talababa.
- source_word: וְלָמָה
  choice: Kaya bakit
  rationale: Ipinakikita ng “Kaya” na ang tanong ay ibinabatay sa naunang pahayag tungkol sa kanilang pagkakamag-anak.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: kayo ang mahuhuling
  rationale: Inihahatid nito ang retorikal at mapanghikayat na diwa ng imperfect at ang paghahambing na sila ang mahuhuli sa pagkilos.
- source_word: לְהָשִׁיב
  choice: magpabalik
  rationale: Ang Hiphil ng שוב ay sanhi o pagpapangyari ng pagbabalik; ang “magpabalik” ay tuwiran at hindi labis na nagpapakahulugan bilang institusyonal na pagpapanumbalik.
- source_word: אֶת־הַמֶּלֶךְ
  choice: sa hari
  rationale: Pinananatili ang ikatlong panauhang pagtukoy ni David sa sarili bilang hari, gaya ng nasa Hebreo.
