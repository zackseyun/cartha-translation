  terminology: Wasto ang “pinahiran ... ng langis” para sa מָשַׁח at hindi nito hinuhusgahan si Absalom. Wasto rin ang “hari” para sa הַמֶּלֶךְ at “pagpapabalik” para sa Hiphil ng שׁוּב.
