  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: tl
  text: At si Absalom, na pinahiran natin ng langis upang maghari sa atin, ay namatay sa labanan. Kaya ngayon, bakit kayo nananahimik tungkol sa pagpapabalik sa hari?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bakit patuloy kayong nananahimik tungkol sa pagbabalik ng hari?”
    reason: Ipinapakita ang mas tuwirang alternatibong pag-uugnay ng kanilang katahimikan sa usapin ng pagbabalik ng hari, nang hindi ipinahihiwatig na ang pagbabalik ang layunin ng kanilang pananahimik.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: At si Absalom
  rationale: Ipinagpapatuloy ng waw ang naunang pananalita; ang “At” ay likas na pang-ugnay at hindi nagdaragdag ng di-tiyak na pagsalungat.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: pinahiran natin ng langis upang maghari sa atin
  rationale: Pinananatili ng “pinahiran ng langis” ang tiyak na gawaing maharlika na ipinahihiwatig ng מָשַׁח, samantalang ipinapakita ng “upang maghari sa atin” ang kahulugan ng עָלֵינוּ sa konteksto nang hindi kinukubli ang pampolitika at panrelihiyong bigat ng pagpapahid.
- source_word: מֵת בַּמִּלְחָמָה
  choice: namatay sa labanan
  rationale: Tuwirang inilalahad ang natapos na pangyayari; natural sa salaysay na Tagalog ang “namatay,” at ang “sa labanan” ay angkop sa idyomatikong gamit ng parirala.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag nito kapwa ang pagpapatuloy at ang praktikal na bunga ng naunang pahayag.
- source_word: מַחֲרִשִׁים
  choice: nananahimik
  rationale: Pinananatili nito ang pangunahing diwa ng pagiging tahimik o hindi pagkibo, sa halip na ipakahulugan lamang bilang pag-aatubili.
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: tungkol sa pagpapabalik sa hari
  rationale: Ang Hiphil ng שׁוּב ay “magpabalik” o “dalhin pabalik.” Ang “tungkol sa” ay natural na kaugnay ng “nananahimik” at nagpapahiwatig ng usaping hindi nila binibigkas o isinusulong.
theological_decisions:
- issue: Pandiwa ng maharlikang paghirang na מָשַׁח para kay Absalom
  choice: pinahiran natin ng langis upang maghari sa atin
  alternative: ginawa nating hari sa atin
  rationale: Bagaman si Absalom ay mang-aagaw ng trono sa daloy ng salaysay, ginamit mismo ng tekstong Hebreo ang karaniwang pandiwa para sa pagpapahid. Pinananatili ang larawang ito upang hindi idagdag ng salin ang isang paghatol na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na larawang “pinahiran ng langis,” ngunit nilinaw ang maharlikang layunin nito sa likas na pariralang “upang maghari sa atin.”
