  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: tl
  text: Sinabi ni Barzilai sa hari, “Ilang araw pa ang nalalabi sa buhay ko upang sumama ako sa hari paakyat sa Jerusalem?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na anyo ito ng אמר; natural sa modernong Filipino ang “sinabi.”
- source_word: בַּרְזִלַּי
  choice: Barzilai
  rationale: Isinalin sa karaniwang anyong transliterado ang pangalang pantangi.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Karaniwang pangngalan na may pantukoy ang nasa Hebreo; hindi idinagdag ang pangalang David.
- source_word: כַּמָּה
  choice: Ilang ... ba
  rationale: Pinananatili ang tanong na nagsasaad ng dami at ang retorikal na himig nito.
- source_word: יְמֵי שְׁנֵי חַיַּי
  choice: ang natitira sa mga taon ng buhay ko
  rationale: Pinananatili ang pagbanggit sa mga araw, mga taon, at buhay, habang ipinahahayag nang malinaw sa Filipino ang kontekstuwal na diwang nalalabing panahon.
- source_word: כִּי
  choice: para
  rationale: Sa retorikal na tanong, natural na ipinahahayag ng “para” ang ugnayang layunin o bunga.
- source_word: אֶעֱלֶה
  choice: sumama ako ... paakyat
  rationale: Ang עלה ay tumutukoy sa pag-akyat patungong Jerusalem; inilalantad ng “paakyat” ang heograpiko at nakaugaliang pananaw ng teksto.
- source_word: אֶת הַמֶּלֶךְ
  choice: sumama ako sa hari
  rationale: Sa kontekstong ito, ang אֶת ay nagpapahiwatig ng pagsama sa hari, hindi ng tuwirang layon.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ginamit ang karaniwang Filipino na anyo ng pangalan ng lungsod.
