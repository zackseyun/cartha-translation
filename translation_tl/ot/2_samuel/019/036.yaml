base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: tl
  text: Walumpung taong gulang na ako ngayon. Kaya ko pa bang makilala ang mabuti sa masama?[a] Nalalasahan pa ba ng iyong lingkod ang aking kinakain at iniinom? Naririnig ko pa ba ang tinig ng mga mang-aawit na lalaki at babae? Kaya bakit pa magiging pabigat ang iyong lingkod sa aking panginoong hari?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Kaya ko pa bang malaman ang pagkakaiba ng mabuti at masama?” Ang pananalitang Hebreo ay maaaring tumukoy sa moral o praktikal na pagkilala; sa konteksto, inilalarawan nito ang paghina ng kakayahang humatol dahil sa katandaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Walumpung taong gulang na ako ngayon
  rationale: Ang literal na ‘anak ng walumpung taon’ ay idyomang Hebreo para sa edad. Ang napiling salin ay likas sa modernong Tagalog at pinananatili ang הַיּוֹם bilang ‘ngayon.’
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Kaya ko pa bang makilala ang mabuti sa masama?
  rationale: Ang ידע בין ay tumutukoy sa kakayahang kumilala o mag辨 ng pagkakaiba. Ang tanong ay retorikal at, sa konteksto ng katandaan, maaaring tumukoy sa pangkalahatang paghatol o praktikal na pagkilala, hindi lamang sa moralidad.
- source_word: יִטְעַם עַבְדְּךָ
  choice: Nalalasahan pa ba ng iyong lingkod
  rationale: Ang טעם ay tumutukoy sa paglalasa o pagdama ng lasa. Ang ‘iyong lingkod’ ay pinanatili bilang magalang na pagtukoy ng nagsasalita sa sarili sa harap ng hari.
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: ang aking kinakain at iniinom
  rationale: Ginamit ang ‘aking’ upang maging malinaw at natural sa Tagalog ang paglipat mula sa magalang na ikatlong panauhang ‘iyong lingkod’ tungo sa mga pandiwang unang panauhan sa Hebreo.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: Naririnig ko pa ba ang tinig ng mga mang-aawit na lalaki at babae?
  rationale: Pinananatili ng ‘tinig’ ang קוֹל, at tahasang inilalahad ng ‘lalaki at babae’ ang magkaibang anyong panlalaki at pambabae sa Hebreo.
- source_word: לְמַשָּׂא
  choice: magiging pabigat
  rationale: 'Matalinghaga rito ang מַשָּׂא: hindi literal na pasan kundi isang taong magiging dagdag na alalahanin o pasanin ng hari.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: aking panginoong hari
  rationale: Pinananatili ang magalang na katawagan sa taong hari; hindi ito banal na titulo.
theological_decisions:
- issue: Saklaw ng ‘mabuti at masama’ (טוֹב לְרָע)
  choice: Pinanatili sa pangunahing teksto ang tradisyonal at malapit-sa-Hebreong ‘mabuti sa masama,’ habang ipinaliwanag sa talababa ang mas malawak na diwang praktikal na pagkilala.
  alternative: Isalin lamang bilang ‘kung ano ang kanais-nais at hindi kanais-nais’ o ‘kung ano ang mabuti o hindi.’
  rationale: Maaaring moral o praktikal ang parirala. Hindi dapat burahin ang moral na posibilidad, ngunit ipinahihiwatig ng konteksto ng humihinang pandama at katandaan ang mas malawak na kakayahang humatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magalang na pananalitang panghukuman na ‘iyong lingkod’ at ‘aking panginoong hari,’ habang iniwasan ang sobrang literal na Hebreong mga idyoma.
