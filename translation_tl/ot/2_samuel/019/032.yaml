base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: tl
  text: At si Barzilai na taga-Gilead ay bumaba mula sa Rogelim[a] at tumawid sa Jordan kasama ng hari upang samahan siyang tumawid sa Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “bumaba mula sa Rogelim at tumawid sa Jordan kasama ng hari upang ihatid siya sa Jordan.” Nagbibigay-daan ang Hebreo sa bahagyang magkaibang paglalarawan ng pagsama ni Barzilai sa hari sa Jordan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalan ng tao.
- source_word: הַגִּלְעָדִי
  choice: na taga-Gilead
  rationale: Natural at malinaw na paraan sa modernong Tagalog upang tukuyin ang pinanggalingang rehiyon ni Barzilai.
- source_word: יָרַד מֵרֹגְלִים
  choice: bumaba mula sa Rogelim
  rationale: Pinanatili ang payak na nakaraang kilos ng Hebreo at ang diwa ng pagbaba mula sa Rogelim patungo sa Jordan.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: tumawid sa Jordan kasama ng hari
  rationale: Sa konteksto, ang kilos ay pagtawid ni Barzilai kasabay ng hari; iniiwasan nito ang di-natural na literal na pagtrato sa אֶת bilang tuwirang layon.
- source_word: לְשַׁלְּחוֹ
  choice: upang ihatid siya
  rationale: Ang שלח sa kontekstong ito ay tumutukoy sa paghatid o pagsama sa isang aalis, hindi lamang sa literal na pagpapayaon.
- source_word: אֶת בַירדן
  choice: sa kabilang pampang
  rationale: Ang Masoreticong teksto sa hulihan ay may tekstuwal o sintaktikong kahirapan; ayon sa konteksto ng pagtawid sa Jordan, natural na ipinahahayag ang layong ihatid ang hari sa kabilang pampang, habang itinatala sa talababa ang alternatibong pag-unawa.
