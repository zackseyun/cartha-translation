base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: tl
  text: At tinakpan ng hari ang kaniyang mukha[a] at sumigaw nang malakas ang hari, “Anak kong Absalom! Absalom, anak ko, anak ko!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binalot ang kaniyang mukha” o “tinabingan ang kaniyang mukha.” Ipinahihiwatig ng pandiwang Hebreo ang pagtatakip ng mukha dahil sa dalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: tinakpan
  rationale: Ipinahihiwatig ng pandiwa ang pagtatakip o pagbabalot, at ang tahasang layon nito rito ay ang mukha ng hari. Likas sa makabagong Tagalog ang “tinakpan” at hindi nito labis na tinutukoy kung paano ginawa ang pagtatakip.
- source_word: פָּנָיו
  choice: ang kaniyang mukha
  rationale: Sa kilos ng pagluluksa at sa tahasang layon, ang kongkretong kahulugang “mukha” ang malinaw na tinutukoy, hindi ang pinalawak na kahulugang “presensiya.”
- source_word: וַיִּזְעַק
  choice: sumigaw
  rationale: Tumutukoy ang pandiwa sa malakas na pag-iyak o pagsigaw. Ang “sumigaw” ay nagpapanatili ng lakas ng tinig nang hindi idinaragdag ang mas tiyak na interpretasyong “humagulgol.”
- source_word: קוֹל גָּדוֹל
  choice: nang malakas
  rationale: Ang literal na idyomang “sa isang dakilang tinig” ay likas na ipinapahayag sa Tagalog bilang “nang malakas,” habang nananatili ang diin sa lakas ng sigaw.
- source_word: בְּנִי
  choice: anak ko / anak kong
  rationale: Ang pangngalan ay panlalaking isahan na may hulaping unang panauhan at tumutukoy kay Absalom bilang anak na lalaki ni David. Sa Tagalog, sapat at likas ang “anak ko”; malinaw na ang kasarian mula sa pangalan at konteksto.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: “Anak kong Absalom! Absalom, anak ko, anak ko!”
  rationale: Pinanatili ang lahat ng pag-uulit upang maipahayag ang matinding dalamhati ng hari sa halip na pakinisin o paikliin ang panaghoy.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pag-uulit at emosyonal na bigat ng panaghoy. Ang “kaniyang” ay ginamit sa salaysay para sa malinaw at pormal na reperensiya, samantalang ang “anak ko” ay likas at tuwiran sa mismong sigaw.
