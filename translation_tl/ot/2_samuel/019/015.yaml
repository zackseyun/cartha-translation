  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: tl
  text: At pinagkaisa niya ang kalooban ng lahat ng taga-Juda, na para bang iisang tao; at nagpasabi sila sa hari, “Bumalik kayo, kasama ang lahat ng inyong mga lingkod.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: hinikayat niya ang puso
  rationale: Ang idiomang Hebreo ay literal na ‘ikiling ang puso’ at dito ay tumutukoy sa pagkuha o paghikayat ng katapatan at pagsang-ayon; pinananatili ng ‘puso’ ang larawang Hebreo habang natural sa Filipino ang pandiwang ‘hinikayat.’
- source_word: כְּאִישׁ אֶחָד
  choice: na magkaisa
  rationale: Literal na ‘gaya ng isang tao’; ipinahahayag nito ang nagkakaisang pasya ng Juda. Ang ‘magkaisa’ ay malinaw at natural na katumbas sa konteksto.
- source_word: שׁוּב אַתָּה וְכָל־עֲבָדֶיךָ
  choice: Bumalik kayo, kayo at ang lahat ng inyong mga lingkod
  rationale: Ang utos ay nasa isahan dahil hari ang kinakausap, ngunit ‘kayo/inyong’ ang magalang at karaniwang anyo sa Filipino; ang pag-uulit ng ‘kayo’ ay nagpapanatili sa diin ng Hebreo.
theological_decisions:
- issue: Hindi tahasang pinangalanan sa talata ang gumagawa ng paghikayat.
  choice: Pinanatili ang ‘niya’ nang hindi tinutukoy ang pangalan.
  alternative: Tukuyin bilang David batay sa naunang konteksto.
  rationale: Ang Hebreong teksto ng mismong talata ay gumagamit lamang ng panlalaking panghalip; ang hindi pagdaragdag ng pangalan ay nagpapanatili sa anyo at kaunting kontekstuwal na kalabuan ng pinagmulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magalang na ‘kayo’ para sa hari at iniwasan ang sobrang literal ngunit di-natural na ‘bilang isang tao.’
