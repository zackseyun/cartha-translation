base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: tl
  text: At sinabi niya sa hari, “Huwag sanang ibilang sa akin, aking panginoon, ang pagkakasala[a], at huwag ninyong alalahanin ang maling ginawa ng inyong lingkod noong araw na umalis ang aking panginoon, ang hari, mula sa Jerusalem, upang hindi ito isapuso ng hari[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “huwag ibilang sa akin ang kasamaan.” Ang pananalita ay may anyong tulad ng pagtutuos ng sala.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “ilagay sa kanyang puso,” isang idyoma para sa pagsasapuso o seryosong pagsasaalang-alang sa isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: ibilang sa akin ... ang kasalanan
  rationale: Pinananatili nito ang Hebreong larawan ng pagbibilang o pagtutuos ng kasalanan laban sa nagsasalita, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: תִּזְכֹּר
  choice: alalahanin
  rationale: Tuwirang katumbas ito ng pandiwa at hindi nito hayagang dinaragdagan ang pahiwatig na ang pag-alala ay maaaring humantong sa pagpaparusa.
- source_word: הֶעֱוָה
  choice: ginawang mali
  rationale: Likas at malinaw itong pagpapahayag ng maling ginawa, nang hindi gumagamit ng labis na teknikal o makalumang pananalita.
- source_word: עַבְדְּךָ
  choice: inyong lingkod
  rationale: Ang magalang na pagtukoy sa sarili sa harap ng hari ang nangingibabaw sa konteksto; mas angkop dito ang “lingkod” kaysa “alipin.”
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: umalis sa Jerusalem
  rationale: Natural na Tagalog ito para sa paglabas o paglisan mula sa lungsod sa konteksto ng pagtakas ni David.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: dibdibin
  rationale: Karaniwang idyomang Tagalog ito para sa pagsasapuso o paghawak nang mabigat sa isang bagay, at angkop sa pakiusap na huwag itong ipagdamdam o gamitin laban sa lingkod.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Pinananatili ang magalang at mapagpakumbabang tawag sa hari; hindi ito tumutukoy sa banal na pangalan.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang pag-uulit ng titulong nasa Hebreo sa halip na palitan ito ng pangalang David.
