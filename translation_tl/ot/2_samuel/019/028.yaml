translation:
  language: tl
  text: Siniraan niya ang iyong lingkod sa panginoon kong hari. Ngunit ang panginoon kong hari ay tulad ng anghel ng Diyos; kaya gawin mo kung ano ang mabuti sa iyong paningin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: Siniraan niya
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pagsasabi ng nakapipinsalang maling ulat laban sa nagsasalita; natural at tumpak sa modernong Filipino ang “siniraan.”
- source_word: בְּעַבְדְּךָ
  choice: ang iyong lingkod
  rationale: Pinananatili ang magalang na pagtukoy ng nagsasalita sa sarili sa ikatlong panauhan.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: tulad ng anghel ng Diyos
  rationale: Tuwirang pinananatili ang paghahambing sa mensahero/anghel ng Diyos nang hindi ipinapaliwanag ang saklaw nito.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: kaya gawin mo ang mabuti sa iyong paningin
  rationale: Pinananatili ang Hebreong idyoma at ang bunga o paghinuha na ipinahihiwatig ng pang-ugnay.
theological_decisions:
- issue: Paglalarawan sa hari bilang tulad ng anghel ng Diyos
  choice: Pinanatili nang literal ang paghahambing.
  alternative: Ipaliwanag bilang “marunong kumilala ng tama at mali.”
  rationale: Hindi tahasang nililinaw ng talata kung aling katangian ng anghel ng Diyos ang tinutukoy, kaya hindi dapat paliitin ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “panginoon kong hari” upang mapanatili ang pormal na paggalang sa hari, at “sa iyong paningin” upang mapanatili ang mahalagang idyomang Hebreo.
