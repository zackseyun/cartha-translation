base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: tl
  text: Nagpadala si Haring David kina Zadok at Abiatar, na mga pari, at sinabi, “Sabihin ninyo sa matatandang pinuno ng Juda, ‘Bakit kayo ang mahuhuli sa pagpapabalik sa hari sa kanyang tahanan, gayong nakarating na sa hari, sa kanyang tahanan, ang mensahe ng buong Israel?[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gayong nakarating na sa hari sa kanyang tahanan ang panukala [o ulat] ng buong Israel.” Malawak ang kahulugan ng salitang Hebreo na isinaling “mensahe”; maaari itong tumukoy sa ulat, panukala, o panawagan ng mga lipi na ibalik si David.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: nagsugo ... kina
  rationale: Ipinahihiwatig ng pandiwa at ng אֶל na nagpadala si David ng mensahe kina Zadok at Abiatar, hindi na ipinatawag niya sila.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Natural na pamagat at pangalan sa makabagong Filipino, habang pinananatili ang pagkakakilanlan niya bilang hari.
- source_word: הַכֹּהֲנִים
  choice: na mga pari
  rationale: Tuwirang kinikilala ang katungkulan nina Zadok at Abiatar.
- source_word: דַּבְּרוּ אֶל
  choice: Sabihin ninyo sa
  rationale: Natural na Filipino para sa utos na magsalita sa mga matatandang pinuno; pinananatili ang diwang ipinapasabi ang mensahe.
- source_word: זִקְנֵי יְהוּדָה
  choice: matatandang pinuno ng Juda
  rationale: Nililinaw na ang זקנים ay mga kinikilalang pinuno ng bayan, hindi lamang mga taong may edad.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: Bakit kayo ang mahuhuling
  rationale: Ipinapahayag ang retorikal at mapanghamong puwersa ng imperfect nang hindi ito ginagawang payak na pahayag tungkol sa kasalukuyan.
- source_word: לְהָשִׁיב
  choice: magpabalik
  rationale: 'Pinananatili ang causative na diwa ng hiphil: kikilos sila upang maibalik ang hari.'
- source_word: אֶת הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: sa hari sa kanyang tahanan
  rationale: Ang ‘tahanan’ ay natural ngunit sapat na malawak upang tumukoy sa tirahan o sambahayan ng hari, nang hindi tahasang ginagawang ‘palasyo.’
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: ang mensahe ng buong Israel
  rationale: Ang דָּבָר ay malawak ang kahulugan. Ang ‘mensahe’ ay natural sa konteksto ngunit hindi tiyak kung ito ay ulat, panukala, o panawagan; kaya binabanggit ang saklaw sa talababa.
- source_word: בָּא אֶל הַמֶּלֶךְ
  choice: nakarating na sa hari
  rationale: Ipinakikita ng aspektong ganap na dumating na sa hari ang ipinadalang salita o usapin.
- source_word: אֶל בֵּיתוֹ
  choice: sa kanyang tahanan
  rationale: Pinananatili ang inuulit na parirala sa Hebreo at ang posibilidad na tinutukoy ang kinaroroonan ng hari.
