revisions:
- from: At nagsugo si Haring David kina Zadok at Abiatar na mga pari. Sinabi niya, “Sabihin ninyo sa matatandang pinuno ng Juda, ‘Bakit kayo ang mahuhuling magpabalik sa hari sa kanyang tahanan, gayong nakarating na sa hari, sa kanyang tahanan, ang mensahe ng buong Israel?[a]’”
  to: Nagpadala si Haring David kina Zadok at Abiatar, na mga pari, at sinabi, “Sabihin ninyo sa matatandang pinuno ng Juda, ‘Bakit kayo ang mahuhuli sa pagpapabalik sa hari sa kanyang tahanan, gayong nakarating na sa hari, sa kanyang tahanan, ang mensahe ng buong Israel?[a]’”
  rationale: Pinalitan ang di-natural at posibleng malabong “magpabalik sa hari” ng “pagpapabalik sa hari,” na malinaw na naghahayag ng causative na diwa ng Hebreo. Inayos din ang unang pangungusap upang masundan ang estrukturang “nagpadala ... na sinasabi,” nang hindi dinaragdagan ang kahulugan. Pinanatili ang talababa at ang kalabuan ng “mensahe/word” ng buong Israel.
