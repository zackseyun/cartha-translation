translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maging malinaw ang pampolitikang papel ng mga elder. Bahagyang pinanatili ang pag-uulit ng “sa kanyang tahanan” mula sa Hebreo, at inilagay ang tunay na leksikal na kalabuan ng דָּבָר sa talababa.
