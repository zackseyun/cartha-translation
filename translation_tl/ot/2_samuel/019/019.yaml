  naturalness: Malinaw at marangal ang rehistro. Mas natural ang pagpapahayag ng idyomang “gawin ang mabuti sa kanyang mga mata” bilang “gawin ang nakalulugod sa hari”; ang literal na “sa kanyang paningin” ay hindi karaniwang Tagalog na katumbas ng idyomang ito.
  terminology: Ang “bangkang pantawid,” “sambahayan ng hari,” “Jordan,” at “nagpatirapa” ay angkop. Pinananatili ng talababa ang alternatibong katawagan at ang paliwanag sa sambahayan.
