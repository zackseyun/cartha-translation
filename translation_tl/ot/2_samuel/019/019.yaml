  to: Tumawid ang bangkang pantawid[a] upang itawid ang sambahayan ng hari[b] at gawin ang nakalulugod sa hari.[c] Nagpatirapa sa harap ng hari si Simei na anak ni Gera habang tumatawid ang hari sa Jordan.[d]
  rationale: Nilinaw sa pangunahing teksto na ang hari ang tumatawid upang maiwasan ang hindi sinasadyang pagbasa na si Simei ang tumatawid. Ginawang idiomatiko ang Hebreong “gawin ang mabuti sa kanyang mga mata,” habang pinananatili sa talababa ang literal na anyo at paliwanag nito. Hindi binago ang kahulugan ng talata o ang mga pangunahing terminong leksikal.
