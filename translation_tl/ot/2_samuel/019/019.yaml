  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: tl
  text: Tumawid ang bangkang pantawid[a] upang itawid ang sambahayan ng hari[b] at gawin ang nakalulugod sa hari.[c] Nagpatirapa sa harap ng hari si Simei na anak ni Gera habang tumatawid ang hari sa Jordan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lantsa” o “bangka para sa pagtawid.” Ang salitang Hebreo ay tumutukoy sa sasakyang ginagamit sa pagtawid sa ilog.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ng hari” ay tumutukoy sa mga tao ng maharlikang sambahayan o pangkat ng hari, hindi sa gusaling tirahan niya.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “gawin ang mabuti sa kanyang mga mata,” isang idyomang nangangahulugang gawin ang nakalulugod sa kanya.
    reason: lexical_alternative
  - marker: d
    text: Sa Hebreo, “habang tumatawid siya.” Ang hari ang malamang na tinutukoy batay sa tagpo, bagaman panghalip lamang ang nasa teksto.
    reason: ambiguity_note
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: bangkang pantawid
  rationale: Tumutukoy ang pangngalan sa sasakyang ginagamit sa pagtawid sa ilog. Likas at malinaw sa makabagong Tagalog ang “bangkang pantawid” nang hindi labis na tinutukoy ang anyo nito.
- source_word: וְעָבְרָה
  choice: Tumawid
  rationale: Ang Qal perfect na pambabae ay umaayon sa הָעֲבָרָה at nagsasaad ng kilos ng bangkang pantawid. Ang payak na nagdaang-panahon ay natural sa daloy ng salaysay.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: upang itawid ang sambahayan ng hari
  rationale: Naipapahayag ng “itawid” ang causative na diwa ng Hiphil, at ang “sambahayan” ay tumutukoy sa mga taong kabilang sa bahay ng hari, hindi sa gusali.
- source_word: בֵּית הַמֶּלֶךְ
  choice: sambahayan ng hari
  rationale: Sa konteksto ng pagtawid sa Jordan, kolektibong tumutukoy ito sa mga tao ng maharlikang sambahayan o pangkat ng hari.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: at gawin ang mabuti sa kanyang paningin
  rationale: Pinananatili nito ang larawang Hebreo at ang evaluative na diwa ng idyoma, habang ipinapaliwanag sa talababa na ang ibig sabihin ay gawin ang nakalulugod sa hari.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: nagpatirapa sa harap ng hari
  rationale: Sa kontekstong ito, ang pagkahulog sa harap ng hari ay kilos ng pagpapakumbaba at pagsusumamo; malinaw at natural itong ipinahahayag ng “nagpatirapa.”
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: habang tumatawid siya sa Jordan
  rationale: Ang infinitive construct na may hulaping panghalip ay temporal. Pinananatili ng “siya” ang di-gaanong tahasang tinutukoy ng panghalip sa Hebreo, bagaman malamang na ang hari ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng panghalip sa בְּעָבְרוֹ
  choice: Pinanatili ang panghalip na “siya” sa pangunahing teksto at ipinaliwanag ang malamang na tinutukoy sa talababa.
  alternative: “habang tumatawid ang hari sa Jordan”
  rationale: Malamang na ang hari ang antecedent ayon sa tagpo, ngunit panghalip lamang ang nasa Hebreo. Iniiwasan ng salin ang tahasang paglutas sa bahagyang sintaktikong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bangkang pantawid” sa halip na mas teknikal o rehiyonal na katawagan, at “sambahayan” upang maiwasang mapagkamalang gusali ang bahay ng hari. Pinanatili sa pangunahing teksto ang idyomang “sa kanyang paningin” at ang kalabuan ng panghalip, na kapwa nilinaw sa mga talababa.
