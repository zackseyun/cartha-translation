    issue: Hindi likas bilang Tagalog na idyoma ang “gawin ang mabuti sa kanyang paningin.”
    rationale: Literal itong nakatutugon sa Hebreo ngunit hindi nito natural na naihahatid ang kahulugang “gawin ang nakalulugod sa kanya.” Maaaring ilagay ang literal na pahayag sa talababa.
