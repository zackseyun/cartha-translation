translation_notes:
  register: Makabago at dignidad na Filipino, na may magalang na pananalita sa korte. Ginamit ang “hapag” upang mapanatili ang marangal ngunit madaling maunawaang larawan ng mesa ng hari, at “dumaing” upang ihatid ang petisyon o reklamo nang hindi nagiging labis na teknikal.
