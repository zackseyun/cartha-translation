  to: Sapagkat ang buong sambahayan ng aking ama ay pawang mga taong dapat hatulan ng kamatayan sa harap ng panginoon kong hari[a]. Gayunman, isinama mo ang iyong lingkod sa mga kumakain sa iyong hapag. Kaya ano pa bang karapatan ang mayroon ako[b] upang dumaing pa sa hari?
  rationale: Pinalitan ang pangunahing salin ng אַנְשֵׁי מָוֶת upang malinaw na maihatid ang legal na pananagutang ipinahihiwatig ng Hebreong idyoma, nang hindi sinasabing patay na ang mga tao. Inayos ang talababa a para sa likas na modernong Filipino. Pinanatili ang iba pang pananalita sapagkat tapat ang mga ito sa pinagmulan at natural sa marangal na rehistro.
