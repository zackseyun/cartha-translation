base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: tl
  text: Sapagkat ang buong sambahayan ng aking ama ay pawang mga taong dapat hatulan ng kamatayan sa harap ng panginoon kong hari[a]. Gayunman, isinama mo ang iyong lingkod sa mga kumakain sa iyong hapag. Kaya ano pa bang karapatan ang mayroon ako[b] upang dumaing pa sa hari?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taong mananagot sa kamatayan,” ibig sabihin, mga taong maaaring hatulan ng kamatayan o karapat-dapat ipapatay.
    reason: lexical_alternative
  - marker: b
    text: Ang “karapatan” ay salin ng Hebreong tsedaqah dito sa diwa ng isang makatarungang paghahabol o bagay na maaaring igiit, hindi pangunahing tumutukoy sa personal na moral na katuwiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: Sapagkat ... ay pawang
  rationale: Ipinahahayag ng konstruksiyon ang mariing paglilimita; likas sa Tagalog ang “pawang” upang sabihing ang buong sambahayan ay walang iba kundi mga taong nasa ilalim ng hatol na kamatayan.
- source_word: כָּל בֵּית אָבִי
  choice: ang buong sambahayan ng aking ama
  rationale: Ang “sambahayan” ay natural na katumbas ng Hebreong idyoma para sa angkan o pinalawak na pamilya, habang pinananatili ang larawan ng isang bahay.
- source_word: אַנְשֵׁי מָוֶת
  choice: mga taong karapat-dapat mamatay
  rationale: Hindi nito sinasabing patay na sila, kundi na maaari silang hatulan o ipapatay; malinaw na naihahatid ng salin ang legal na diwa.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: sa harap ng panginoon kong hari
  rationale: Ipinakikita nito ang kanilang katayuan ayon sa paghatol ng hari at pinananatili ang magalang na pananalita sa korte.
- source_word: וַתָּשֶׁת
  choice: Gayunman, isinama mo
  rationale: Ang pandiwa ay literal na “inilagay,” ngunit sa konteksto ay tumutukoy sa pagbibigay sa lingkod ng puwang kasama ng mga kumakain sa hapag; ipinahahayag ng “Gayunman” ang malinaw na pagsalungat sa naunang sugnay.
- source_word: עַבְדְּךָ
  choice: ang iyong lingkod
  rationale: Ito ay magalang at mapagpakumbabang tawag sa sarili sa harap ng hari, hindi kinakailangang pagtukoy sa isang alipin.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: sa mga kumakain sa iyong hapag
  rationale: Pinananatili nito ang larawan ng pakikisalo sa mesa ng hari at ang pahiwatig ng natatanging pagtanggap at pagkalinga.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Kaya ano pa bang karapatan ang mayroon ako
  rationale: Sa kontekstong ito, ang צְדָקָה ay isang makatarungang paghahabol o karapatan, hindi pangunahing tumutukoy sa personal na moral na katuwiran.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: upang dumaing pa sa hari
  rationale: Ang זעק ay pagdaing o malakas na paghingi ng katarungan; ang “dumaing” ay natural sa modernong Tagalog at angkop sa isang pakiusap sa hari.
