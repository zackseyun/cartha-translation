base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: tl
  text: At bumaba si Mefiboset na anak ni Saul upang salubungin ang hari. Hindi niya inalagaan ang kanyang mga paa[a], ni inayos ang kanyang bigote[b], ni nilabhan ang kanyang mga damit, mula nang umalis ang hari hanggang sa araw na dumating siya nang ligtas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hindi niya ginawa ang kanyang mga paa.” Malamang na tumutukoy ito sa hindi niya pag-aasikaso o pag-aayos sa mga ito, ngunit hindi tiyak ang eksaktong gawain.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa buhok o bahagi sa ibabaw ng labi; maaari ring isalin na “ni inalagaan ang kanyang bigote.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “dumating sa kapayapaan”; maaari ring isalin na “dumating nang payapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: bumaba
  rationale: Tuwirang ipinahahayag ang galaw na pababa; hindi tiyak sa Hebreo kung 'pumarito' o 'pumaroon,' kaya iniwasang dagdagan ang pandiwang Filipino ng deiktikong pananaw.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: upang salubungin ang hari
  rationale: Ang pariralang Hebreo ay tumutukoy sa paglapit upang makipagtagpo; natural sa Filipino ang 'salubungin' sa ganitong konteksto.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: Hindi niya inalagaan ang kanyang mga paa
  rationale: Literal itong 'hindi niya ginawa ang kanyang mga paa,' isang di-tiyak na pahayag tungkol sa pagpapabaya sa karaniwang pag-aayos o pangangalaga sa mga paa. Pinanatiling malawak ang salin upang hindi tukuyin ang isang gawaing hindi malinaw sa teksto.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: ni inayos ang kanyang bigote
  rationale: Ang שָׂפָם ay tumutukoy sa buhok o bahagi sa ibabaw ng labi. Mas maingat ang 'inayos' kaysa 'ginupitan' sapagkat hindi tiyak ang eksaktong gawaing tinutukoy ng עשה.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: ni nilabhan ang kanyang mga damit
  rationale: Ang כבס ay karaniwang tumutukoy sa paglalaba o paghuhugas ng kasuotan; malinaw at likas sa modernong Filipino ang 'nilabhan.'
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: mula nang umalis ang hari
  rationale: Natural at register-neutral itong paglalahad ng panahong nagsimula sa pag-alis ng hari.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: hanggang sa araw na bumalik itong ligtas
  rationale: Sa konteksto, ang בוא ay pagdating o pagbabalik ng hari at ang בְשָׁלוֹם ay maaaring mangahulugang nasa kapayapaan o ligtas. Ang 'bumalik itong ligtas' ay natural ngunit itinatala sa talababa ang tunay na saklaw ng parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pangalang “Mefiboset,” na karaniwang anyong Filipino. Iniwasan ang sobrang literal na “ginawa ang kanyang mga paa” at ang mas tiyak na “ginupitan ang bigote” dahil hindi malinaw sa Hebreo ang eksaktong uri ng pag-aayos. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
