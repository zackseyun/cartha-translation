base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: tl
  text: 'Sinabi sa kanya ng hari, “Bakit ka pa nagsasalita tungkol sa mga usapin mo? Nagpasya na ako[a]: ikaw at si Ziba ang maghahati sa lupain[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Sinabi ko.”'
    reason: lexical_alternative
  - marker: b
    text: O “bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: Sinabi sa kanya ng hari
  rationale: Likas na salaysay sa Filipino; ipinapahayag ng waw-consecutive ang kasunod na pangyayari nang hindi kailangang lagyan ng mekanikal na “At.”
- source_word: לָמָּה תְּדַבֵּר עוֹד
  choice: Bakit kailangan mo pang magsalita
  rationale: Ang עוֹד ay tumutukoy sa karagdagan o pagpapatuloy ng pagsasalita. Nahuhuli ng “pa” ang diwa, at ipinadarama ng “kailangan” ang pagkainip ng tanong nang hindi ginagawang tahasang pagbabawal.
- source_word: דְּבָרֶיךָ
  choice: tungkol sa kalagayan mo
  rationale: Maaaring mangahulugang mga salita, usapin, o bagay ang דְּבָרֶיךָ. Sa konteksto ng salungatan tungkol sa ari-arian, natural na tumutukoy ito sa usaping inilalahad niya; pinananatili ng “kalagayan” ang sapat na lawak at hindi ito sobrang ginagawang legal na “kaso.”
- source_word: אָמַרְתִּי
  choice: Nagpasya na ako
  rationale: Literal itong “sinabi ko,” ngunit dito ang pagsasalita ng hari ay isang pasya o hatol. Ipinapakita ng salin ang puwersang performatibo; inilalagay sa talababa ang mas literal na anyo.
- source_word: אַתָּה וְצִיבָא תַּחְלְקוּ
  choice: hahatiin ninyo ni Ziba
  rationale: Natural na konstruksyon sa Filipino para sa “ikaw at si Ziba.” Ang aspektong magaganap ng “hahatiin” ay angkop sa awtoritatibong utos o pasya ng hari.
- source_word: הַשָּׂדֶה
  choice: ang lupain
  rationale: Literal na “bukid” o “parang,” ngunit sa konteksto ay tumutukoy sa pag-aaring lupa o estate. Ang “lupain” ay natural at sapat ang lawak; pinananatili sa talababa ang literal na alternatibo.
