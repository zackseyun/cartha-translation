translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang labis na legal na bokabularyo, habang pinanatili ang pagkainip at awtoridad ng hari. Inayos ang mga marker ayon sa pagkakasunod ng kaugnay na salita sa teksto.
