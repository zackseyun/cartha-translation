  naturalness: Mas likas at tuwiran sa makabagong Filipino ang "Bakit ka pa nagsasalita tungkol sa mga usapin mo?" Ang "Ikaw at si Ziba ang maghahati" ay malinaw na iniiwasan ang posibleng alanganing pagbasa ng "hahatiin ninyo ni Ziba."
  terminology: Ginamit ang "mga usapin mo" para sa malawak na diwa ng דְּבָרֶיךָ sa konteksto ng pagtatalo sa ari-arian. Pinanatili ang "lupain" para sa הַשָּׂדֶה, habang ibinibigay ang "bukid" bilang literal na alternatibo. "Ziba" ay nananatiling pare-pareho sa audit trail.
