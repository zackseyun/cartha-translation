base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: tl
  text: Kasama niya ang isang libong lalaki mula sa lipi ni Benjamin, at si Ziba, na lingkod ng sambahayan ni Saul, kasama ang labinlima niyang anak na lalaki at dalawampu niyang lingkod. Tumawid sila sa Jordan sa harap ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nangunguna sa hari.” Ang pariralang Hebreo ay maaaring mangahulugang nasa presensiya ng hari o nauuna sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: isang libong lalaki
  rationale: Tuwirang pinananatili ang karaniwang Hebreong bilang at ang panlalaking diwa, na malamang ay tumutukoy sa mga lalaking tagasuporta o tauhan.
- source_word: מִבִּנְיָמִן
  choice: mula sa Benjamin
  rationale: Maikli at likas na pagtukoy sa pinagmulan o kaanibang pantribo; ang Benjamin dito ay pangalan ng lipi.
- source_word: צִיבָא
  choice: Ziba
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: lingkod ng sambahayan ni Saul
  rationale: Maaaring mangahulugan ang נַעַר na binata, tagapaglingkod, o lingkod. Sa papel ni Ziba sa sambahayan ni Saul, ang 'lingkod' ang pinakanababagay; ipinahahayag ng 'sambahayan' ang institusyonal at dinastikong diwa ng בֵּית.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: kasama ang labinlima niyang anak na lalaki
  rationale: Nililinaw na bahagi sila ng pangkat ni Ziba, habang tahasang pinananatili ang panlalaking kahulugan ng בָּנִים.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: at dalawampung lingkod
  rationale: Maaaring 'lingkod' o 'alipin' ang עֶבֶד. Hindi binibigyang-diin dito ang legal na kalagayan kundi ang mga tauhan ng sambahayan, kaya ang 'lingkod' ang angkop sa konteksto.
- source_word: וְצָלְחוּ
  choice: Tumawid sila
  rationale: Sa kaugnayan nito sa Jordan, malinaw na tumutukoy ang pandiwa sa pagtawid; natural ito sa modernong Filipino.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Ang pangalang pantangi ay sapat nang tumukoy sa ilog sa konteksto; hindi kailangang idagdag ang 'Ilog.'
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Pinananatili ng parirala ang maaaring kahulugang nasa presensiya ng hari o nauuna sa kaniya, nang hindi tahasang nilulutas ang tunay na kalabuan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'sambahayan' upang mapanatili ang mas malawak na diwa ng angkan at institusyon ni Saul, at 'sa harap ng hari' upang mapanatili ang kalabuan ng Hebreo.
