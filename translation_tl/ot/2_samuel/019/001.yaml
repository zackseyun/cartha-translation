revisions:
- from: Labis na nayanig ang hari. Umakyat siya sa silid sa ibabaw ng pintuang-bayan[a] at umiyak. Habang papunta roon, sinabi niya, “Anak kong Absalom! Anak ko, anak kong Absalom! Kung ako na lamang sana ang namatay kapalit mo[b], Absalom, anak ko, anak ko!”
  to: Labis na nayanig ang hari. Umakyat siya sa silid sa ibabaw ng pintuang-bayan[a] at umiyak. Habang siya’y naglalakad, sinabi niya, “Anak kong Absalom! Anak ko, anak kong Absalom! Kung ako na lamang sana ang namatay kapalit mo[b], Absalom, anak ko, anak ko!”
  rationale: Pinalitan ang pariralang nagdaragdag ng patutunguhan ng isang natural na Filipino na katumbas ng pangyayaring ipinahahayag ng Hebreo. Inayos din ang literal na pagpapaliwanag sa talababa b. Walang binago sa kahulugan, sa pag-uulit ng panaghoy, o sa antas ng wika.
