base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: tl
  text: Labis na nayanig ang hari. Umakyat siya sa silid sa ibabaw ng pintuang-bayan[a] at umiyak. Habang siya’y naglalakad, sinabi niya, “Anak kong Absalom! Anak ko, anak kong Absalom! Kung ako na lamang sana ang namatay kapalit mo[b], Absalom, anak ko, anak ko!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “silid sa itaas ng pintuang-bayan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Idyomang Hebreo: “Sino ang magbibigay na mamatay ako kapalit mo?” Isa itong paraan ng pagpapahayag ng matinding paghahangad: “Kung ako na lamang sana…”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: Labis na nayanig
  rationale: Saklaw ng רגז ang panginginig, pagkabalisa, at matinding emosyonal na pagkagulo. Ipinahahayag ng “labis na nayanig” ang matinding epekto kay David ng pagkamatay ni Absalom nang hindi nililimitahan ang pandiwa sa pisikal na panginginig.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: silid sa ibabaw ng pintuang-bayan
  rationale: Ang עֲלִיָּה ay silid sa itaas, at ang הַשַּׁעַר ay ang pintuang bahagi ng lungsod. Nililinaw ng salin ang ayos ng gusali sa natural na Tagalog.
- source_word: וַיֵּבְךְּ
  choice: umiyak
  rationale: Tuwirang ipinahahayag ng בכה ang pag-iyak; ang karaniwang salitang “umiyak” ay natural, malinaw, at angkop sa taimtim na tagpo.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: Habang papunta roon, sinabi niya
  rationale: Pinananatili nito ang kasabay na pagkilos na ipinahahayag ng בְּלֶכְתּוֹ nang hindi inuulit nang alanganin sa Tagalog ang naunang “umakyat.”
- source_word: בְּנִי
  choice: anak ko / anak kong
  rationale: Pinananatili ang bawat pag-uulit ng mapagmahal na tawag, pati ang likas na pagbabagong anyo ng Tagalog bago ang pangalang Absalom.
- source_word: מִי יִתֵּן
  choice: Kung ako na lamang sana
  rationale: Ang literal na “Sino ang magbibigay?” ay isang Hebreong idyoma ng matinding paghahangad. Natural na ipinahahayag sa Tagalog ng “na lamang sana” ang di-matutupad na nais sa panaghoy.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: ang namatay kapalit mo
  rationale: Malinaw nitong pinananatili ang hangarin ni David na siya sana ang namatay sa lugar ni Absalom.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog ng Biblia.
