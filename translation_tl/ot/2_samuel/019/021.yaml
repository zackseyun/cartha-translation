source:
  edition: WLC
  text: כִּ֚י יָדַ֣ע עַבְדְּ/ךָ֔ כִּ֖י אֲנִ֣י חָטָ֑אתִי וְ/הִנֵּֽה בָ֣אתִי הַ/יּ֗וֹם רִאשׁוֹן֙ לְ/כָל בֵּ֣ית יוֹסֵ֔ף לָ/רֶ֕דֶת לִ/קְרַ֖את אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: tl
  text: Sapagkat alam ng lingkod mo na nagkasala ako. At narito, dumating ako ngayon bilang una sa buong sambahayan ni Jose[a][b], upang bumaba at salubungin ang panginoon kong hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan ni Jose” ay tumutukoy sa mga liping nagmula kay Jose, lalo na sa mga pangkat sa hilaga na kaugnay ng Efraim at Manases.
    reason: cultural_note
  - marker: b
    text: Maaari ring unawain ang Hebreo na siya ang unang tao mula sa buong sambahayan ni Jose na bumaba upang salubungin ang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַע עַבְדְּךָ
  choice: Sapagkat alam ng lingkod mo
  rationale: Ipinapahayag ng כִּי ang batayan ng pakiusap, at ang ganap na anyo ng יָדַע ay tumutukoy rito sa kasalukuyang pagkilala o pagkaalam. Ang “lingkod mo” ay angkop sa magalang na pananalita sa hari.
- source_word: כִּי אֲנִי חָטָאתִי
  choice: na nagkasala ako
  rationale: Pinananatili ng “nagkasala” ang moral at panrelihiyong bigat ng חטא nang hindi ito pinahihina tungo sa pangkalahatang “nagkamali.”
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Likas at marangal na panawag-pansin sa modernong Tagalog na pinananatili ang deiktikong lakas ng Hebreo.
- source_word: בָאתִי הַיּוֹם רִאשׁוֹן
  choice: dumating ako ngayon bilang una
  rationale: Ang “dumating ako” ay natural sa Tagalog para sa kilos na humantong sa kasalukuyang pagharap niya sa hari; ipinakikita ng “bilang una” ang predikatibong gamit ng רִאשׁוֹן.
- source_word: לְכָל בֵּית יוֹסֵף
  choice: sa buong sambahayan ni Jose
  rationale: Pinananatili ang kolektibong katawagang “sambahayan ni Jose.” Ang ugnayang ipinahihiwatig ng לְ ay tunay na maaaring unawain bilang pagiging una sa grupo o pagmula sa buong grupong iyon, kaya inilalahad ang alternatibo sa talababa.
- source_word: לָרֶדֶת לִקְרַאת
  choice: upang bumaba at salubungin
  rationale: Pinananatili ng “bumaba” ang topograpikong direksiyon, samantalang ang “salubungin” ay likas na Tagalog para sa kusang paglapit upang makipagtagpo.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Pinananatili ang magalang na maharlikang pagtawag at ang personal na ugnayang ipinahihiwatig ng hulaping unang panauhan.
theological_decisions:
- issue: Ang kahulugan ng “sambahayan ni Jose”
  choice: Pinanatili bilang kolektibong katawagang pantribo at ipinaliwanag sa talababa
  alternative: Palitan ng “mga lipi nina Efraim at Manases” o “hilagang mga lipi”
  rationale: Hindi dapat palitan sa pangunahing teksto ang mismong larawang ginamit ng Hebreo; ang paliwanag ay inilagay sa talababa upang maiwasan ang sobrang pagpapakahulugan.
- issue: Ang ugnayan ng רִאשׁוֹן sa לְכָל בֵּית יוֹסֵף
  choice: “bilang una sa buong sambahayan ni Jose”
  alternative: “bilang unang nagmula sa buong sambahayan ni Jose”
  rationale: Mas tuwirang ipinapakita ng pangunahing salin na siya ang una sa grupong iyon, ngunit pinananatili sa talababa ang posibleng pagbasa na nagbibigay-diin sa kanyang pagmula sa buong pangkat.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “narito” sa halip na arkaikong panawag-pansin, at “lingkod mo” bilang magalang na sariling pagtukoy sa harap ng hari. Magkasunod na inilagay ang [a][b] sa “sambahayan ni Jose” dahil kapwa rito nauukol ang paliwanag na pangkultura at ang alternatibong pagbasa.
