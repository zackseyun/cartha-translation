    issue: Ang “Nagmamadali si Simei” ay hindi ganap na naipapakita ang natapos na kilos na nagsusulong sa salaysay.
    rationale: Ang וַיְמַהֵר ay isang salaysay na anyong pandiwa na tumutukoy sa pagkilos ni Simei noon. Ang “Nagmamadaling bumaba” ay nagbibigay ng likas na Filipino na pagsasalin ng kaniyang pagmamadali at pagbaba.
  revised_text: Nagmamadaling bumaba si Simei na anak ni Gera, isang Benjaminita mula sa Bahurim, kasama ng mga lalaki ng Juda[a] upang salubungin si Haring David.
