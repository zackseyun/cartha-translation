base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: tl
  text: Nagmamadaling bumaba si Simei na anak ni Gera, isang Benjaminita mula sa Bahurim, kasama ng mga lalaki ng Juda[a] upang salubungin si Haring David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “kasama ng lalaki ng Juda”; nauunawaan dito ang pananalita bilang kolektibo: “kasama ng mga lalaki ng Juda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Nagmamadali
  rationale: Ipinapahayag ng pandiwa ang pagmamadali o agarang pagkilos; natural ito sa makabagong Filipino at pinananatili ang kilos ng salaysay.
- source_word: שִׁמְעִי בֶן־גֵּרָא
  choice: si Simei na anak ni Gera
  rationale: Isinalin ang patronimiko nang tuwiran at ginamit ang karaniwang anyong Filipino para sa mga pangalang biblikal.
- source_word: בֶּן־הַיְמִינִי
  choice: isang Benjaminita
  rationale: Sa konteksto, tumutukoy ito sa pagkakabilang ni Simei sa lipi ni Benjamin, hindi sa isa pang agarang patronimiko.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: mula sa Bahurim
  rationale: Tinutukoy ng parirala ang pinagmulan ni Simei; maikli at likas ang ganitong appositional na anyo sa Filipino.
- source_word: וַיֵּרֶד
  choice: bumaba siya
  rationale: Pinananatili ang kongkretong topograpikong kilos ng pandiwang Hebreo.
- source_word: עִם אִישׁ יְהוּדָה
  choice: kasama ng mga lalaki ng Juda[a]
  rationale: Bagaman nasa anyong isahan ang אִישׁ, maaari itong gamitin bilang kolektibong katawagan; ipinahihiwatig ng konteksto ang isang pangkat.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Malinaw na ipinapahayag nito ang paglapit para makipagtagpo at mas natural sa kontekstong ito kaysa sa payak na “upang makipagkita.”
- source_word: הַמֶּלֶךְ דָּוִד
  choice: si Haring David
  rationale: Natural sa Filipino ang paglalagay ng titulong “Hari” bago ang pangalan, habang pinananatili ang tiyak na pantukoy sa pamamagitan ng “si.”
