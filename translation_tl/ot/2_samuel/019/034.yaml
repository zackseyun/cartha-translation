base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: tl
  text: Sinabi ng hari kay Barzilai, “Tumawid kang kasama ko, at tutustusan kita[a] habang kasama kita sa Jerusalem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aalalayan kita” o “paglalaanan kita ng iyong mga kailangan.” Ang pandiwang Hebreo ay tumutukoy sa paglalaan para sa mga pangangailangan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salaysay sa modernong Tagalog para sa wayyiqtol ng אמר; ipinahihiwatig na ng pagkakasunod ng mga pangyayari ang ugnayang naratibo.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalang tumutukoy sa hari sa konteksto.
- source_word: אֶל בַּרְזִלָּי
  choice: kay Barzilai
  rationale: Karaniwang anyong Tagalog para sa taong pinatutungkulan ng pananalita; pinanatili ang pangalan sa transliterasyon.
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: Tumawid kang kasama ko
  rationale: Pinananatili ang kongkretong diwa ng pagtawid at ang pagsama sa hari. Ang tahasang panghalip na אַתָּה ay naipahihiwatig ng anyong pautos at ng hulaping panghalip sa Tagalog nang hindi nagiging pilit ang pangungusap.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: at paglalaanan ko ang iyong mga pangangailangan
  rationale: Ipinahahayag ang diwa ng כלכל bilang patuloy na paglalaan o pagtustos sa mga kailangan, nang hindi ito nililimitahan sa salapi lamang.
- source_word: עִמָּדִי
  choice: habang kapiling kita
  rationale: Natural na Tagalog para sa pananatili ni Barzilai kasama ng hari; hindi ito pinalawak tungo sa mas tiyak na interpretasyong gaya ng pagiging nasa pangangalaga ng hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang salin ng pang-ukol ב sa lokatibong gamit kasama ng pangalan ng lugar.
