translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Iniwasan ang masyadong pinansiyal na dating ng “tutustusan” sa pangunahing teksto, ngunit isinama ito bilang leksikal na alternatibo. Inilagay ang panandang [a] sa pariralang talagang tinutukoy ng talababa.
