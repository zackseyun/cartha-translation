base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: tl
  text: Pagkatapos, bumalik ang hari at nakarating hanggang sa Jordan. Pumunta naman ang Juda[a] sa Gilgal upang salubungin ang hari at itawid siya sa Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Juda” ay kolektibong tumutukoy rito sa mga tao o lipi ng Juda; maaari ring isalin na “ang mga taga-Juda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang Qal wayyiqtol ng שוב ay nagsasaad ng pagbabalik ng hari matapos ang kaniyang pagtakas; natural at tuwiran ang “bumalik” sa Filipino.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: nakarating hanggang sa Jordan
  rationale: Pinananatili ng “hanggang sa” ang diwa ng עַד na umabot ang hari sa hangganan o pook ng Jordan, nang hindi ipinahihiwatig na tumawid na siya.
- source_word: וִיהוּדָה
  choice: ang Juda
  rationale: Pinananatili ang pangalang pantangi na kolektibong tumutukoy sa lipi o mga tao ng Juda, gaya ng maikling anyo sa Hebreo.
- source_word: בָּא
  choice: pumunta
  rationale: Sa konteksto, ipinakikita nito ang pagpunta ng Juda sa Gilgal. Ang “pumunta naman” ay natural na Filipino at hindi labis na nagpapasya kung ito ay simpleng kasunod na pangyayari o pangyayaring nauna bilang background.
- source_word: הַגִּלְגָּלָה
  choice: sa Gilgal
  rationale: Ang directional he ay nagpapahayag ng kilos patungo sa Gilgal; natural itong isinasalin na “sa Gilgal.”
- source_word: לָלֶכֶת לִקְרַאת
  choice: upang salubungin
  rationale: Ang dalawang infinitive ay nagpapahayag ng layuning humayo upang makipagtagpo. Sa Filipino, likas at sapat ang “upang salubungin,” bagaman hindi hiwalay na tinutumbasan ang pandiwang “humayo.”
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: at itawid siya sa Jordan
  rationale: 'Ang Hiphil ng עבר ay causative: tulungang o pangyarihing makatawid ang hari. Malinaw ang “itawid” at hindi ito nagdaragdag ng tiyak na paraang gaya ng paggamit ng bangka.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Jordan” at “Gilgal” bilang karaniwang anyo ng mga pangalang pantangi. Iningatan ang kolektibong “Juda” sa pangunahing teksto at ipinaliwanag ito sa talababa.
