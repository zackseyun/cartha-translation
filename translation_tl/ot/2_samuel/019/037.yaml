  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: tl
  text: Sapagkat sasama lamang ang iyong lingkod sa hari sa pagtawid sa Jordan nang maikling distansiya. Bakit ako gagantimpalaan ng hari ng gantimpalang ito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, magkaugnay ang pandiwa at pangngalang ginamit: “gagantimpalaan ... ng gantimpala.” Maaari ring isalin: “susuklian ... ng kabayarang ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: Sapagkat ... lamang ... nang kaunting layo
  rationale: Pinananatili ng “Sapagkat” ang pangangatwirang ipinakikilala ng כִּי, at ipinahahayag ng “lamang” at “nang kaunting layo” ang limitadong pagsama na tinutukoy ng מְעַט.
- source_word: יַעֲבֹר עַבְדְּךָ
  choice: sasamahan ... ng iyong lingkod ... sa pagtawid
  rationale: Ang di-ganap na pandiwa ay tumutukoy rito sa balak o handang gawin, samantalang ang “iyong lingkod” ay likas na magalang na pagtukoy sa sarili sa pakikipag-usap sa hari.
- source_word: אֶת הַיַּרְדֵּן אֶת הַמֶּלֶךְ
  choice: ang hari sa pagtawid sa Jordan
  rationale: Ang ikalawang אֶת ay nagpapahayag ng pagsama sa hari. Ang ayos na ito ay natural sa Filipino at malinaw na ang lingkod ay tatawid kasama ng hari.
- source_word: וְלָמָּה יִגְמְלֵנִי
  choice: Bakit ako gagantimpalaan ng hari
  rationale: Inihahatid ng tanong ang magalang na pagtanggi sa gantimpala. Ang “gagantimpalaan” ay angkop sa saklaw ng גמל sa kontekstong ito.
- source_word: הַגְּמוּלָה הַזֹּאת
  choice: ng ganitong gantimpala
  rationale: Ang “ganitong gantimpala” ay malinaw at likas na tumutukoy sa malaking pabor na iniaalok ng hari, nang hindi dinaragdagan ang kahulugan ng Hebreo.
