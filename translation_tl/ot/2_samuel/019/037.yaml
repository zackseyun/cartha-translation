translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Pinanatili ang ikatlong-panauhang pagtukoy sa “hari” at ang mapagpakumbabang “iyong lingkod,” na angkop sa usapang maharlika. Sadyang pinanatili sa pangunahing teksto ang pag-uulit na “gagantimpalaan ... gantimpala” upang maipakita ang magkaugnay na salitang Hebreo.
