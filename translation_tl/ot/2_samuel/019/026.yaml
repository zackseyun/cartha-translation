translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang ‘sumama’ upang likas na maipahayag ang diwa ng Hebreo nang hindi ipinapasok ang perspektibang ‘pumarito’ o ‘pumaroon.’
