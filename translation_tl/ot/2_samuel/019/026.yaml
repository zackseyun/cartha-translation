base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: tl
  text: Nang dumating siya sa Jerusalem upang salubungin ang hari, sinabi sa kanya ng hari, “Bakit hindi ka sumama sa akin, Mefiboset?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nang
  rationale: Likas na panandang temporal sa modernong Tagalog para sa pormulang nagsisimula ng bagong tagpo; hindi na kailangang isalin nang literal ang וַיְהִי.
- source_word: בָא יְרוּשָׁלַם
  choice: dumating siya sa Jerusalem
  rationale: Ang בוא ay karaniwang nangangahulugang ‘dumating’ o ‘pumaroon/pumarito.’ Nililinaw ng panghalip na ‘siya’ ang ipinahihiwatig na paksa, at pinananatili ang Jerusalem bilang nakaugaliang anyo ng pangalan.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: upang salubungin ang hari
  rationale: Ipinapahayag ng לִקְרַאת ang pagharap o pagsalubong sa isang dumarating; mas tiyak at natural dito ang ‘salubungin’ kaysa sa pangkalahatang ‘makipagkita.’
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: sinabi sa kanya ng hari
  rationale: Pinananatili ang hayag na paksa na ‘ang hari’ at ang tagatanggap na ‘sa kanya’ sa natural na ayos ng Tagalog.
- source_word: לָמָּה לֹא הָלַכְתָּ עִמִּי
  choice: Bakit hindi ka sumama sa akin
  rationale: Bagaman literal na ‘lumakad/pumaroon kasama ko’ ang הָלַכְתָּ עִמִּי, ang ‘sumama sa akin’ ang natural na Tagalog at hindi kailangang pumili sa perspektibang ‘pumarito’ o ‘pumaroon.’
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Malinaw na transliterasyong Tagalog ng pangalang Hebreo, na gumagamit ng karaniwang baybay at bigkas sa Filipino.
