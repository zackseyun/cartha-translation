    rationale: Maaari itong tumukoy sa sinumang kaparehang kasama sa tahanan at hindi nito malinaw na naipapakita ang kababaihang kabilang sa hiwalay na kategorya mula sa mga asawa sa sinaunang kontekstong pangmaharlika. Ang mga alternatibong nasa talababa na 'kerida' at 'kalunya' ay may kolokyal at madalas mapanghusgang dating.
  - severity: low
