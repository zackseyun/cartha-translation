  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: tl
  text: Pagkatapos, pumasok si Joab sa bahay[a] at lumapit sa hari. Sinabi niya, “Sa araw na ito, pinahiya mo ang lahat ng lingkod mo na nagligtas ngayon sa buhay mo, sa buhay ng iyong mga anak na lalaki at babae, sa buhay ng iyong mga asawa, at sa buhay ng iyong mga kinakasamang babae.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay malamang na tumutukoy sa tirahan ng hari o sa palasyo.
    reason: cultural_note
  - marker: b
    text: Ang “mga kinakasamang babae” ay tumutukoy sa mga babaeng kabilang sa sambahayan ng hari sa kinikilalang ugnayan ngunit may ibang, mas mababang katayuan kaysa sa mga asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: sa loob ng bahay
  rationale: Pinananatili ang literal na ‘bahay’; sa konteksto, malamang na tumutukoy ito sa tirahan ng hari o palasyo, gaya ng ipinaliliwanag sa talababa.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: inilagay mo sa kahihiyan
  rationale: Natural na Filipino para sa causative na pandiwa at sa idyomang Hebreo na literal na ‘ipinahiya ang mukha’; pinananatili ang pampublikong dimensiyon ng kahihiyan nang hindi pilit ang pananalita.
- source_word: עֲבָדֶיךָ
  choice: mga lingkod mo
  rationale: Saklaw nito ang mga tauhan o nasasakupan ng hari nang hindi nililimitahan sa mga opisyal o kawal lamang.
- source_word: הַמְמַלְּטִים
  choice: mga nagligtas
  rationale: Ipinahahayag ng participle ang aktuwal na pagsagip mula sa panganib at kamatayan.
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  choice: buhay mo / buhay ng
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay pisikal na buhay na nailigtas, hindi isang hiwalay na ‘kaluluwa.’
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: iyong mga anak na lalaki at babae
  rationale: Malinaw na pinananatili ang dalawang pangkat na tahasang binanggit sa Hebreo.
- source_word: נָשֶׁיךָ
  choice: iyong mga asawa
  rationale: Karaniwan at tuwirang salin ng termino sa konteksto ng sambahayan ng hari.
- source_word: פִּלַגְשֶׁיךָ
  choice: iyong mga kinakasama
  rationale: Natural at madaling maunawaang modernong Filipino para sa mga babaeng nasa kinikilalang ugnayan kay David ngunit may mas mababang katayuan kaysa sa mga asawa; nililinaw ang historikal na kahulugan sa talababa.
theological_decisions:
- issue: Paglalarawan sa mga asawa at פילגש nang walang idinagdag na moral na hatol
  choice: mga asawa, at mga kinakasama
  alternative: mga asawa at mga asawang may mababang katayuan
  rationale: Pinananatili ang magkaibang kategoryang panlipunan sa tekstong Hebreo, ngunit hindi hinahatulan, pinapaganda, o ginagawang doktrinal ang mga ito.
- issue: Kahulugan ng נֶפֶשׁ
  choice: buhay
  alternative: kaluluwa
  rationale: Ang usapan ay pagliligtas sa kamatayan; kaya pisikal na buhay ang malinaw na kahulugan dito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginawang natural ang Hebreong idyoma tungkol sa ‘mukha’ sa pamamagitan ng ‘inilagay sa kahihiyan,’ habang ang literal na ‘bahay’ ay pinanatili at ipinaliwanag sa talababa. Ang listahan ng mga buhay na nailigtas ay bahagyang pinasimple sa Filipino nang hindi nawawala ang saklaw o diin.
