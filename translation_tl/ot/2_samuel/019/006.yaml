  to: Pagkatapos, pumasok si Joab sa bahay[a] at lumapit sa hari. Sinabi niya, “Sa araw na ito, pinahiya mo ang lahat ng lingkod mo na nagligtas ngayon sa buhay mo, sa buhay ng iyong mga anak na lalaki at babae, sa buhay ng iyong mga asawa, at sa buhay ng iyong mga kinakasamang babae.[b]”
