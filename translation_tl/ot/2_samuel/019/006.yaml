  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: pinahiya ni David ang kanyang mga lingkod na nagligtas sa kanya at sa kanyang sambahayan. Gayunman, mas malinaw na ipakita ang pagpasok ni Joab sa bahay at ang paulit-ulit na diin ng Hebreo sa mga buhay na nailigtas. Ang ''mga kinakasama'' lamang ay masyadong malawak at maaaring hindi maipakita ang natatanging kategoryang פילגשים.'
  naturalness: Natural ang pangkalahatang rehistro, ngunit mas matatas ang 'pumasok si Joab sa bahay at lumapit sa hari' kaysa 'pinuntahan ... sa loob ng bahay.' Ang 'pinahiya mo' ay tuwiran at likas na salin ng idyomang Hebreo nang hindi kailangang isalin ang 'mga mukha.'
  terminology: Ang 'buhay' para sa נפש ay tama sa kontekstong ito. Ang 'mga lingkod' ay angkop. Pinalitan ang 'mga kinakasama' ng 'mga kinakasamang babae' upang maipahiwatig na sila ay kababaihang kaiba sa mga asawa sa sinaunang sambahayan, nang hindi gumagamit ng mapanghusga o kolokyal na mga katawagan gaya ng 'kerida' o 'kalunya.'
  issues:
