- from: Sumagot ang lahat ng lalaki ng Juda sa mga lalaki ng Israel[a], “Dahil malapit naming kamag-anak ang hari.[b] Kaya bakit kayo nagalit tungkol sa bagay na ito? Kumain ba kami kahit kaunti sa pagkain ng hari? O may ibinigay ba sa amin?”[c]
  to: Sumagot ang lahat ng lalaki ng Juda sa mga lalaki ng Israel[a], “Dahil malapit naming kamag-anak ang hari.[b] Kaya bakit kayo nagagalit dahil sa bagay na ito? May kinain ba kami kahit kaunti mula sa hari? O may ibinigay ba sa amin?”[c]
