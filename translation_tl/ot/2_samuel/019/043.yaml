base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: tl
  text: Sumagot ang lahat ng lalaki ng Juda sa mga lalaki ng Israel[a], “Dahil malapit naming kamag-anak ang hari.[b] Kaya bakit kayo nagagalit dahil sa bagay na ito? May kinain ba kami kahit kaunti mula sa hari? O may ibinigay ba sa amin?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa lalaki ng Israel,” na ginagamit dito bilang kolektibong katawagan sa mga lalaki ng Israel.
    reason: collective_singular
  - marker: b
    text: Sa Hebreo, “malapit sa akin ang hari”; malamang na tumutukoy ito sa pagkakalapit bilang magkamag-anak o magkaangkan.
    reason: lexical_alternative
  - marker: c
    text: 'Mahirap ang Hebreo sa huling sugnay. Maaari ring isalin: “O may anumang dinala ba para sa amin?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן כָּל אִישׁ יְהוּדָה עַל אִישׁ יִשְׂרָאֵל
  choice: Sumagot ang lahat ng lalaki ng Juda sa mga lalaki ng Israel
  rationale: Likas sa modernong Tagalog ang maramihang anyo para sa dalawang pangkat na nagtatalo. Ang Hebreo ay gumagamit ng kolektibong isahan sa ‘lalaki ng Israel,’ kaya itinabi ang impormasyong iyon sa talababa.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: Dahil malapit naming kamag-anak ang hari
  rationale: Sa konteksto, ang קָרוֹב ay tumutukoy sa pagkakalapit sa angkan o tribo, hindi lamang sa distansiya. Ginamit ang ‘naming’ bilang likas na kolektibong pananalita ng Juda, habang ang literal na isahang ‘sa akin’ ay ipinaliwanag sa talababa.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Kaya bakit kayo nagalit tungkol sa bagay na ito?
  rationale: Ang חָרָה ay idyomang nangangahulugang magalit. Ang ‘bagay na ito’ ay malinaw at likas na salin ng הַדָּבָר הַזֶּה sa konteksto ng pagtatalo.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Kumain ba kami kahit kaunti sa pagkain ng hari?
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa tanong; ipinahihiwatig ito ng ‘kahit kaunti.’ Pinananatili ng ‘pagkain ng hari’ ang konkretong larawan ng pagkain nang hindi tiyak na nilulutas kung ang diwa ay pagtanggap ng panustos sa gastos ng hari.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: O may ibinigay ba sa amin?
  rationale: Mahirap at di-tiyak ang Hebreong parirala mula sa נשׂא. Ang ‘may ibinigay’ ay natural sa Tagalog at akma sa pagkakapantay nito sa naunang pagtanggi sa pagtanggap ng pakinabang, habang inilalahad sa talababa ang mas literal na posibilidad.
