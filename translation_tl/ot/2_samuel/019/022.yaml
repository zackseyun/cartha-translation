base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: tl
  text: Ngunit sumagot si Abisai na anak ni Zeruias, “Hindi ba dapat patayin si Simei dahil dito[a], sapagkat isinumpa niya ang pinahiran ni Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa ginawa niyang ito” o “bilang ganti rito.” Itinatanong ng idyomang Hebreo kung ang ginawa ni Simei ay dapat humantong sa pagpatay sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: sumagot
  rationale: Karaniwang ipinakikilala ng ענה ang isang tugon. Sa natural na Tagalog, sapat na ang “sumagot” at hindi na kailangang ulitin ang literal na “sumagot at nagsabi.”
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: si Abisai na anak ni Zeruias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng mga pangalang biblikal at pinanatili ang pagkakakilanlang “anak ni Zeruias.”
- source_word: הֲתַחַת זֹאת
  choice: dahil dito
  rationale: Ipinahahayag ng parirala ang batayan o dahilan ng mungkahing parusa. Natural ang “dahil dito” sa Tagalog, habang pinananatili sa talababa ang iba pang posibleng diin ng idyoma.
- source_word: לֹא יוּמַת
  choice: Hindi ba dapat patayin
  rationale: Ang Hophal ng מות ay tumutukoy sa pagpapapatay o paglalapat ng parusang kamatayan, hindi lamang sa karaniwang pagkamatay. Napananatili rin ng tanong na “Hindi ba” ang retorikal na puwersa ng Hebreo.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan ng panukala ni Abisai. Ang “sapagkat” ay malinaw, marangal, at angkop sa daloy ng pangungusap.
- source_word: קִלֵּל
  choice: isinumpa
  rationale: Tumutukoy ang pandiwa sa mabigat na pagsumpa o paglapastangan ni Simei kay David; pinananatili ng “isinumpa” ang lakas ng salita at ang ugnayan sa naunang salaysay.
- source_word: מְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Tinutukoy ng parirala ang hari bilang taong pinahiran ni Yahweh. Ang “pinahiran ni Yahweh” ay natural sa Tagalog at hindi nito ginagawang pantanging titulo ang salita nang higit sa hinihingi ng konteksto.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מְשִׁיחַ sa konteksto
  choice: ang pinahiran ni Yahweh
  alternative: ang mesiyas ni Yahweh; ang hinirang ni Yahweh
  rationale: Sa konteksto, tumutukoy ang מְשִׁיחַ sa hari na rituwal na pinahiran ni Yahweh. Iniiwasan ng salin ang awtomatikong paglalagay ng mas huling teknikal na kahulugan ng “Mesiyas,” gayundin ang pagdaragdag ng “hinirang,” na hindi tahasang nasa parirala.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinagaan ang literal na dobleng pormulang “sumagot at nagsabi” tungo sa natural na “sumagot,” habang pinanatili ang retorikal na tanong, ang hudisyal na diwa ng parusang kamatayan, at ang teolohikal na pariralang “pinahiran ni Yahweh.”
