  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: tl
  text: Kaya, noong araw na iyon, palihim na pumasok sa lungsod ang mga tao, gaya ng palihim na pagpasok ng mga taong nahihiya habang tumatakas sa labanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: palihim na pumasok / palihim na umuuwi
  rationale: Ang hitpael ng גנב ay naglalarawan ng pagkilos nang patago o palihim. Inangkop ang ikalawang pandiwa bilang “umuuwi” upang maging likas sa Filipino ang paghahambing sa mga tumakas sa labanan, habang pinananatili ang diwa ng palihim na pagpasok.
- source_word: הַנִּכְלָמִים
  choice: napahiya
  rationale: Tuwirang inilalarawan ang mga taong dumanas ng hiya o kahihiyan.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: dahil napahiya silang tumakas sa labanan
  rationale: Ipinahahayag sa natural na Filipino ang hiya na kaugnay ng kanilang pagtakas sa labanan; hindi dinaragdagan kung kanino sila tumakas o kung bakit natalo.
