base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: tl
  text: Sinabi ni David, “Ano ba ang kinalaman ko sa inyo, mga anak ni Zeruias? Bakit kayo magiging kalaban ko ngayon? May sinuman bang papatayin sa Israel sa araw na ito? Hindi ko ba alam na ngayon ay ako ang hari ng Israel?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Ano ba ang kinalaman ko sa inyo
  rationale: Likas na salin sa Filipino ng idyomang Hebreo na nagpapahayag ng paglayo sa panukala o matinding pagsaway; pinananatili ng “ba” ang mariing himig ng tanong.
- source_word: בְּנֵי צְרוּיָה
  choice: mga anak ni Zeruias
  rationale: Pinananatili ang kongkretong katawagang pampamilya na tuwirang tumutukoy sa mga anak na lalaki ni Zeruias, habang natural sa Filipino ang anyong “mga anak ni.”
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: at kayo’y magiging mga kalaban ko ngayon
  rationale: Ang שָׂטָן ay karaniwang pangngalan dito na nangangahulugang kalaban o sumasalungat. Ang “magiging” ay kumakatawan sa di-ganap na pandiwa at sa papel na ginagampanan nila sa pagkakataong iyon; ginawang maramihan ang “mga kalaban” upang umayon sa maramihang kausap.
- source_word: יוּמַת אִישׁ
  choice: May sinuman bang papatayin
  rationale: Ipinahihiwatig ng pandiwang Hebreo ang sadyang pagpatay o paglalapat ng parusang kamatayan. Ang “sinuman” ay natural na kumakatawan sa panlahatang gamit ng isahang אִישׁ sa kontekstong ito.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Hindi ko ba alam
  rationale: Pinananatili ang anyong retorikal na tanong ng Hebreo, na umaasang sasang-ayon ang kausap.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: hari sa Israel
  rationale: Natural na Filipino para sa paghahari ni David sa bayang Israel; ipinapahayag nito ang kasalukuyan niyang kapangyarihang maharlika nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Kahulugan ng שָׂטָן
  choice: karaniwang pangngalang “kalaban”
  alternative: pangngalang pantanging “Satanas”
  rationale: Sa salaysay na ito, inilalarawan ng salita ang pagsalungat ng mga anak ni Zeruias kay David. Ang “Satanas” bilang pangngalang pantangi ay magpapasok ng demonolohikal na kahulugang hindi hinihingi ng agarang konteksto.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang magkakasunod na retorikal na tanong, ang tuwirang pagsaway ni David, at ang pag-uulit ng “ngayon/sa araw na ito” na mahalaga sa diin ng Hebreo.
