base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: tl
  text: Ngunit hindi pinatay ng hari si Mefiboset, anak ni Jonatan na anak ni Saul, dahil sa sumpaan sa pangalan ni Yahweh[a] na nasa pagitan nila—ni David at ni Jonatan na anak ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “dahil sa panunumpa ni Yahweh.” Malamang na tumutukoy ito sa panunumpaang ginawa nina David at Jonatan sa pangalan ni Yahweh o sa harap niya, hindi kinakailangang sa isang panunumpang si Yahweh mismo ang bumigkas.
    reason: Pinananatili ang posibleng saklaw ng Hebreong שְׁבֻעַת יְהוָה nang hindi ipinapalagay na si Yahweh mismo ang bumigkas ng panunumpa.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: hindi ipinapatay
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa hindi pagpatay o hindi pagbibigay upang patayin. Ang pariralang ito ay likas sa modernong Tagalog at malinaw na naghahayag ng kongkretong kahulugan.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak na titulong ginamit sa Hebreo; ipinakikilala ng konteksto ang hari bilang si David.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalan.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: anak ni Jonatan at apo ni Saul
  rationale: Malinaw at likas sa Tagalog ang pagpapahayag ng eksaktong ugnayang pampamilya; iniiwasan din nito ang posibleng maling pagkaunawa na si Jonatan ang tinutukoy na anak ni Saul bilang hiwalay na paglalarawan kay Mefiboset.
- source_word: עַל
  choice: dahil sa
  rationale: Ipinakikilala rito ng pang-ukol ang dahilan ng ginawa ng hari.
- source_word: שְׁבֻעַת יְהוָה
  choice: sumpaan sa pangalan ni Yahweh
  rationale: Sa konteksto, ito ay malamang na sumpaang ginawa sa pangalan o sa harap ni Yahweh. Inilalantad ng salin ang likas na diwa sa Tagalog, habang itinatala sa talababa ang mas literal at posibleng alternatibong pagbasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֲשֶׁר בֵּינֹתָם ... בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: na ginawa nina David at Jonatan
  rationale: Natural nitong ipinahahayag sa Tagalog na ang sumpaan ay umiiral sa pagitan ng dalawang panig; inuulit ang buong pagkakakilanlan ni Jonatan ayon sa Hebreo.
theological_decisions:
- issue: Kahulugan ng שְׁבֻעַת יְהוָה (“sumpa ni Yahweh”)
  choice: sumpaang ginawa sa pangalan ni Yahweh o sa ilalim ng kanyang pagsaksi
  alternative: isang sumpang ibinigay mismo ni Yahweh
  rationale: Sa ganitong kontekstong tipanan, karaniwang tumutukoy ang parirala sa sumpaang binitiwan ng mga tao na tumatawag kay Yahweh bilang saksi. Gayunman, hindi lubusang ipinagkakait ang gramatikal na alternatibo at inilalahad ito sa talababa.
- issue: Tinutukoy ng “ang hari”
  choice: David
  alternative: panatilihin lamang ang titulo nang hindi tinutukoy ang pangalan
  rationale: Malinaw sa konteksto na si David ang hari, ngunit pinananatili sa teksto ang titulong nasa Hebreo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hindi ipinapatay” para sa kongkretong diwa ng pagligtas sa kamatayan, at “apo ni Saul” para sa malinaw at natural na talaangkanan.
