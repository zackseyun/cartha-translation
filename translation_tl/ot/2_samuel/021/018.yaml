source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: tl
  text: Pagkatapos nito, muling nagkaroon ng digmaan laban sa mga Filisteo sa Gob. Nang magkagayon, pinabagsak ni Sibecai na Husatita si Saf[a], na kabilang sa mga inapo ni Rafa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Saf.” Sa katumbas na salaysay sa 1 Cronica 20:4, “Sipai” ang pangalan.
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “na kabilang sa mga inapo ng higante.” Maaaring tumukoy ang Hebreo sa isang taong nagngangalang Rafa o sa angkan ng mga higante o Refaita.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Tagalog at pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: muling nagkaroon ng digmaan
  rationale: Malinaw na ipinahahayag ang pag-uulit na nasa עוֹד habang nananatiling natural ang pangungusap sa Tagalog.
- source_word: בְּגֹב עִם פְּלִשְׁתִּים
  choice: laban sa mga Filisteo sa Gob
  rationale: Sa konteksto ng digmaan, natural sa Tagalog ang 'laban sa' para sa עִם at 'sa Gob' para sa lugar ng labanan.
- source_word: אָז
  choice: Nang magkagayon
  rationale: Minamarkahan nito ang kasunod na pangyayari nang hindi nagdaragdag ng impormasyong wala sa Hebreo.
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Pinananatili ang puwersang militar ng נכה at likas na nagpapahiwatig ng nakamamatay na pagkatalo sa konteksto, nang hindi tahasang dinaragdagan ang pandiwa bilang 'pinatay.'
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibecai na Husatita
  rationale: Isinalin sa anyong madaling basahin sa Filipino ang pangalan at katawagang etniko o pangkanan.
- source_word: סַף
  choice: Saf
  rationale: Tuwirang transliterasyon sa ortograpiyang Filipino ng pagbasa sa Masoretic Text; inilagay sa talababa ang anyo sa parallel na teksto.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: na kabilang sa mga inapo ni Rafa
  rationale: Ang 'mga inapo' ay nagpapahayag ng kasapian sa angkan nang hindi nililimitahan ang יְלִידֵי sa mga tuwirang anak. Pinananatili sa pangunahing teksto ang posibilidad na pangalang pantangi ang Rafa.
theological_decisions:
- issue: Kung ang הָרָפָה ay pangalang pantangi na 'Rafa' o katawagang 'higante' o 'Refaita'
  choice: Rafa bilang pangalan o pinagmulan ng angkan
  alternative: ang higante; ang Refaita
  rationale: Sa pariralang pangangkan, natural ang pagtukoy sa isang pinagmulan ng lahi. Gayunman, tunay na may kalabuan ang anyong Hebreo, kaya hindi isinasara ng salin ang ibang pagbasa at tahasan itong inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga katawagang biblikal—Filisteo, Husatita, Saf, at Rafa—at iniwasan ang lipas na pananalitang gaya ng “sinaktan” o “nilupig” kung hindi nito sapat na naipapakita ang kontekstong militar. Ang dalawang talababa ay inilagay sa mismong mga salitang kaugnay ng mga ito, sa halip na sundin ang nagkapalit na marker sa ibinigay na English consultation layer.
