  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: tl
  text: Ipinatawag ng hari ang mga Gibeonita at nagsalita sa kanila. Ang mga Gibeonita ay hindi kabilang sa mga anak ni Israel[a], kundi sa nalabi ng mga Amoreo[b]; nanumpa sa kanila ang mga anak ni Israel. Ngunit pinagsikapan ni Saul na patayin sila dahil sa kanyang sigasig para sa Israel at Juda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita.” Sa Hebreo, “mula sa mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa mga natira sa mga Amoreo.”
    reason: lexical_alternative
  - marker: c
    text: O, “dahil sa kanyang paninibugho para sa Israel at Juda.” Ang Hebreong salita ay maaaring mangahulugang “sigasig” o “paninibugho,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: ipinatawag ng hari ang mga Gibeonita
  rationale: Ang קרא sa kontekstong ito ay pagtawag o pagpapaharap sa isang tao. Mas natural sa Filipino ang “ipinatawag” kaysa sa payak na “tinawag” para sa utos ng hari na humarap sila.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: kinausap sila
  rationale: Saklaw nito ang literal na “sinabi sa kanila” at natural itong kasunod ng “ipinatawag,” nang walang idinaragdag na nilalaman.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: hindi kabilang sa mga anak ni Israel
  rationale: Pinananatili ang pamilyang idyomang בני ישראל at ang pag-uulit nito sa talata, ngunit nililinaw sa likas na Filipino na pambansang pagkakabilang ang tinutukoy.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: mula sa nalabi sa mga Amoreo
  rationale: Ang יֶתֶר ay yaong natira o nalabi. Ang “nalabi” ay maikli, malinaw, at hindi nagpapalagay nang higit sa teksto.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: nanumpa sa kanila
  rationale: Tumpak at natural na salin ng panunumpang ginawa ng Israel sa mga Gibeonita; nauunawaan sa paliwanag na pangyayari na nauna ito sa ginawa ni Saul.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: pinagsikapan ni Saul na lipulin sila
  rationale: Ang בקשׁ ay nagpapahayag ng paghahangad o pagsisikap, at ang נכה sa kontekstong ito ay marahas na pagpatay. Ipinahihiwatig ng maramihang “sila” at ng konteksto ang pagtatangkang puksain ang pangkat.
- source_word: בְּקַנֹּאתוֹ
  choice: dahil sa kanyang maalab na pagmamalasakit
  rationale: Inihahatid nito ang masidhing partidistang sigasig ng קנא nang hindi ito awtomatikong ginagawang inggit; pinananatili sa talababa ang posibleng saling “paninibugho.”
theological_decisions:
- issue: Pagkakakilanlan ng בני ישראל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pambansang katawagan ang parirala, ngunit ang pagpapanatili sa “mga anak ni Israel” ay sumasalamin sa Hebreong anyo at sa pag-uulit nito sa talata nang hindi naglalagay ng doktrinal na paliwanag.
- issue: Lakas at moral na kulay ng קנא
  choice: maalab na pagmamalasakit
  alternative: paninibugho
  rationale: Maaaring tumukoy ang salita sa sigasig o paninibugho. Ang konteksto ay masidhing pagkiling para sa Israel at Juda, kaya “maalab na pagmamalasakit” ang nasa teksto, habang tahasang pinananatili sa talababa ang negatibong alternatibo.
- issue: Saklaw ng לְהַכֹּתָם
  choice: lipulin sila
  alternative: patayin sila / pabagsakin sila
  rationale: Sa konteksto ng pagkilos laban sa isang pangkat, ang pandiwa ay maaaring magpahiwatig ng pagpatay o pagpuksa. Ang talababa ay nagpapanatili ng mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng panaklong upang ipakita na ang gitnang bahagi ay paliwanag na background. Pinanatili ang “mga anak ni Israel” para sa lexical na ugnayan sa Hebreo, samantalang ginamit ang karaniwang pangalang “mga Gibeonita” at “mga Amoreo.”
