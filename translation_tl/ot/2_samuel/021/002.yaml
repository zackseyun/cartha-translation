  - severity: medium
    issue: Ang “lipulin sila” ay mas tiyak at mas malakas kaysa לְהַכֹּתָם.
    rationale: Maaaring tumukoy ang pandiwa sa pananakit, pagpapabagsak, o pagpatay; hindi nito tahasang sinasabing ganap na lipulin ang buong pangkat.
