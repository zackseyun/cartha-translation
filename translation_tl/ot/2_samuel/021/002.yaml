  to: Ipinatawag ng hari ang mga Gibeonita at nagsalita sa kanila. Ang mga Gibeonita ay hindi kabilang sa mga anak ni Israel[a], kundi sa nalabi ng mga Amoreo[b]; nanumpa sa kanila ang mga anak ni Israel. Ngunit pinagsikapan ni Saul na patayin sila dahil sa kanyang sigasig para sa Israel at Juda[c].
