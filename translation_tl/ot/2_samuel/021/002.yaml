  verdict: revise
  source_fidelity: Kailangan ng ilang pagwawasto. Ang “maalab na pagmamalasakit” ay mas malambot at mas malawak kaysa קִנְאָה, na dito ay “sigasig” (na maaari ring “paninibugho”). Ang “lipulin” ay maaaring magpahiwatig ng lubos na pagpuksa, samantalang ang לְהַכּוֹתָם ay mas ligtas na isalin bilang “patayin sila” o “pabagsakin sila.” Ang “Kaya” ay hindi kinakailangan, sapagkat simpleng sunod-sunod na pagsasalaysay ang waw sa simula.
  naturalness: Natural at marangal sa modernong Filipino ang binagong teksto. Ang paghahati sa mga pangungusap ay malinaw na naghihiwalay sa paliwanag tungkol sa mga Gibeonita at sa ginawa ni Saul nang hindi nangangailangan ng panaklong.
  terminology: Pinanatili ang “mga Gibeonita,” “mga Amoreo,” at “Juda.” Ginamit ang “mga anak ni Israel” sa unang dalawang paglitaw upang ipakita ang Hebreong pambansang katawagan; ang huling “Israel at Juda” ay natural na naghahatid ng pares na pampolitika/pambansa sa Hebreo.
