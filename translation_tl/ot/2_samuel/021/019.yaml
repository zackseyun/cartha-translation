base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: tl
  text: Muling nagkaroon ng digmaan sa Gob laban sa mga Filisteo, at pinabagsak ni Elhanan na anak ni Jaare-oregim[a], na taga-Betlehem, si Goliat na taga-Gat[b]. Ang katawan ng sibat niya ay parang biga ng manghahabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang pangalang “Jaare-oregim” sa Hebreo. Ipinapalagay ng ilan na ang oregim (“mga manghahabi”) ay aksidenteng naulit mula sa dulo ng talata.
    reason: textual_variant
  - marker: b
    text: 'Iba ang mababasa sa 1 Cronica 20:5: pinatay ni Elhanan si Lahmi, na kapatid ni Goliat. Itinuturing ng marami na mahirap o nasira sa pagkopya ang teksto rito sa Samuel, kaya iniaayon nila ito sa Cronica.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: sa Gob
  rationale: Ang בְּ na kasama ng pangalan ng lugar ay likas na isinasaling “sa” sa Filipino kapag tinutukoy ang lugar ng labanan; pinanatili ang Gob bilang pangalang pantangi.
- source_word: וַיַּךְ
  choice: pinabagsak
  rationale: Ang נכה ay maaaring mangahulugang humampas, manakit, o pumatay ayon sa konteksto. Ang “pinabagsak” ay nagpapanatili sa puwersang pandigma ng salita nang hindi higit na nililinaw kaysa sa Hebreo.
- source_word: יַעְרֵי אֹרְגִים
  choice: Jaare-oregim
  rationale: Pinanatili ang mahirap na anyo ng Masoretikong teksto at hindi ito tahimik na itinuwid ayon sa paralelong talata.
- source_word: בֵּית הַלַּחְמִי
  choice: na taga-Betlehem
  rationale: Natural at malinaw sa makabagong Filipino ang panuring na ito para sa isang taong nagmula sa Betlehem.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: si Goliat na taga-Gat
  rationale: Tuwirang tinutukoy ng ibinigay na tekstong Hebreo si Goliat na Geteo; ang “taga-Gat” ang natural na katumbas nito sa Filipino.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: Ang tangkay ng sibat niya
  rationale: Bagaman literal na “kahoy” ang עֵץ, ang tinutukoy rito ay ang mahabang kahoy na katawan o tangkay ng sibat.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: parang tahilan ng habihan
  rationale: Ang מְנוֹר ay malaking pahalang na kahoy ng habihan. Pinananatili ng “tahilan ng habihan” ang kongkretong paghahambing ng Hebreo.
theological_decisions:
- issue: Tila salungat ang talata sa ulat na si David ang pumatay kay Goliat sa 1 Samuel 17 at sa paralelong 1 Cronica 20:5.
  choice: Pinanatili sa pangunahing teksto ang Masoretikong pagbasa na pinabagsak ni Elhanan si Goliat na taga-Gat.
  alternative: Isalin na pinabagsak ni Elhanan si Lahmi, na kapatid ni Goliat na taga-Gat.
  rationale: Maliwanag na “Goliat na taga-Gat” ang tuwirang layon sa ibinigay na tekstong Hebreo. Hindi dapat tahimik na ihanay ang mahirap na pagbasa sa paralelong salaysay; sa halip, inilalahad ang pagkakaiba sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “taga-Betlehem” at “taga-Gat” sa halip na teknikal na mga katawagang gentiliko. Pinanatili ang mahirap na tekstuwal na pagbasa sa pangunahing teksto, habang ipinaliwanag sa mga talababa ang mga pangunahing variant.
