  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: tl
  text: Hinamon niya ang Israel, at pinabagsak siya ni Jonatan, anak ni Simei[a], na kapatid ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at sa katumbas na salaysay sa 1 Cronica 20:7, “Simea” o “Simeah” ang mababasa sa halip na “Simei.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: Hinamon
  rationale: Sa konteksto ng labanan, ang pandiwa ay tumutukoy sa mapang-insultong paghamon o paglapastangan sa kalaban. Likas sa modernong Filipino ang “hinamon” at malinaw nitong naihahatid ang hayagang paghamon sa Israel.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang Israel bilang kolektibong pangalan ng bayan, ayon sa tuwirang layon sa Hebreo.
- source_word: וַיַּכֵּהוּ
  choice: pinabagsak siya
  rationale: Ang נכה ay literal na pananakit o paghampas; sa labanang ito, ipinahihiwatig nitong napatay ang lalaki. Ang “pinabagsak” ay nagpapanatili sa larawan ng nakamamatay na pagtalo nang hindi ginagawang mas tahasan kaysa sa Hebreo.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: בֶּן שמעי
  choice: anak ni Simei
  rationale: Sinusunod ang anyo ng pangalan sa ibinigay na tekstong Masoretiko; inilalahad sa talababa ang ibang pagbasa.
- source_word: אֲחִי דָוִד
  choice: na kapatid ni David
  rationale: Tuwirang isinasalin ang pariralang “kapatid ni David” at, ayon sa ayos ng pangungusap, iniuugnay ito kay Simei.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ngunit” upang natural na maipakita ang pagbaligtad mula sa paghamon tungo sa pagkatalo; ang ugnayang pampamilya ay ipinahayag nang hindi nagdaragdag ng impormasyong wala sa Hebreo.
