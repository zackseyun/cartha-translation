base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: tl
  text: Pagkatapos, pumunta si David at kinuha mula sa mga taga-Jabes-gilead ang mga buto ni Saul at ang mga buto ng anak niyang si Jonatan, na ninakaw nila mula sa liwasan ng Bet-san, kung saan ibinitin ng mga Filisteo ang mga iyon noong araw na pinabagsak nila si Saul sa Gilboa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ibinitin” ay maaari ring unawaing “itinanghal” o, sa mas tiyak na pagbasa, “ibinaon sa tulos”; ang pandiwang Hebreo ay pinakatuwirang nangangahulugang “ibitin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  choice: mga buto
  rationale: Tuwirang kahulugan ng pangngalan ang “mga buto”; pinananatili nito ang kongkretong larawan ng tekstong Hebreo kaysa sa mas malawak na “mga labi.”
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: mga taga-Jabes-gilead
  rationale: Sa pagkakaugnay na ito, tumutukoy ang בַּעֲלֵי sa mga taong naninirahan o kabilang sa lugar; natural sa modernong Tagalog ang “mga taga-.”
- source_word: גָּנְבוּ
  choice: palihim nilang kinuha
  rationale: Pangunahing nangangahulugang “nagnakaw” ang pandiwa, ngunit inilalarawan dito ang lihim na pagbawi ng mga bangkay sa 1 Samuel 31:11–13. Ang “palihim na kinuha” ay natural at pinananatili ang diwa nang hindi nagpapahiwatig ng karaniwang pagnanakaw para sa pansariling pakinabang.
- source_word: מֵרְחֹב
  choice: mula sa liwasan
  rationale: Ang רְחֹב ay bukás at pampublikong lugar sa bayan; malinaw at likas sa Tagalog ang “liwasan.”
- source_word: תלוּם שׁם
  choice: kung saan ibinitin ang mga iyon
  rationale: Ang תלה ay pinakatuwirang “ibitin.” Hindi ipinapasok sa pangunahing teksto ang mas tiyak ngunit di-tiyak na pagbasa na “ibinaon sa tulos” o ang mas maluwag na “itinanghal.”
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: pinabagsak nila si Saul
  rationale: Ipinahahayag ng נכה rito ang nakamamatay na pagkatalo ni Saul. Pinananatili ng “pinabagsak” ang lakas ng pandiwa nang hindi nilulutas ang pagkakaiba sa pagitan ng pagkatalo sa labanan at aktuwal na paraan ng pagkamatay niya.
- source_word: בַּגִּלְבֹּעַ
  choice: sa Gilboa
  rationale: Walang salitang “bundok” sa Hebreo; ang payak na “sa Gilboa” ay tapat at malinaw.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: Kaya umalis si David at kinuha
  rationale: Isinusulong ng magkakasunod na wayyiqtol ang salaysay. Ipinahihiwatig ng “Kaya” ang kaugnayan sa naunang pasiya ni David, habang natural na isinasalin ng “umalis ... at kinuha” ang dalawang kilos.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: ng anak niyang si Jonatan
  rationale: Natural sa Tagalog ang ayos na ito at malinaw na si Jonatan ay anak ni Saul.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na estilong pasalaysay. Ginamit ang mga anyong pangalang “Jabes-gilead,” “Bet-san,” “Jonatan,” “Filisteo,” at “Gilboa.” Inilagay ang tanging talababa pagkatapos ng pangungusap na may “ibinitin” upang hindi maputol ang daloy; tumutukoy ito sa leksikal na kalabuan ng pandiwa.
