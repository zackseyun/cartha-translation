  terminology: Ang mga pangalang David, Saul, Jonatan, Jabes-gilead, Bet-san, mga Filisteo, at Gilboa ay magkakatugma at angkop. Ang “mga buto” ay wastong kongkretong salin ng עַצְמוֹת.
