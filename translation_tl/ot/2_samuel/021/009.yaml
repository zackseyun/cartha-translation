  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: tl
  text: Ibinigay niya sila sa kapangyarihan ng mga Gibeonita, at ibinitin[a] nila ang mga ito sa bundok sa harap ni Yahweh. Sama-samang nabuwal ang pito. Pinatay sila noong mga unang araw ng anihan, sa pasimula ng pag-aani ng sebada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinuhog” o “inilantad sa madla.” Maaaring tumukoy ang pandiwang Hebreo sa pagbibitin o pampublikong paglalantad ng mga katawan, hindi lamang sa pagbitin sa makitid na kahulugan nito ngayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: Ibinigay niya sila sa kapangyarihan ng
  rationale: Ang נתן na sinusundan ng בְּיַד ay idyomang tumutukoy sa pagsasailalim sa kapangyarihan o kontrol ng iba. Pinananatili ng saling ito ang diwang juridikal nang mas likas sa modernong Tagalog kaysa sa literal na “sa kamay ng.”
- source_word: הַגִּבְעֹנִים
  choice: mga Gibeonita
  rationale: Karaniwang anyong Tagalog para sa pangalan ng pangkat ng mga tao.
- source_word: וַיֹּקִיעֻם
  choice: ibinitin nila ang mga ito
  rationale: Maaaring tumukoy ang יקע sa pagbitin, pagtuhog, o pampublikong paglalantad ng katawan. Ginamit ang “ibinitin” bilang malinaw na pangunahing salin, habang inilagay sa talababa ang kawalang-katiyakan tungkol sa eksaktong paraan.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Tumutugma sa tiyak na pang-isahang anyo ng הַר at natural sa Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang larawan ng pagkilos sa presensiya ni Yahweh at ang maaaring kahulugang tipan o paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang YHWH ayon sa tuntunin ng proyekto.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: Sama-samang nabuwal ang pito
  rationale: Pinananatili ang Hebreong larawan ng pagbuwal sa kamatayan at ang sabay-sabay na sinapit ng pitong lalaki, nang hindi ginagawang tahasang sanhi-bunga ang simpleng pagkakasunod ng mga sugnay.
- source_word: הֻמְתוּ
  choice: Pinatay sila
  rationale: Likas at malinaw na Tagalog para sa causative passive ng מות, na nagsasaad na sila ay pinaslang o inilagay sa kamatayan.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: noong mga unang araw ng anihan
  rationale: Natural na panandang-panahon na nagpapanatili sa plural at sa diwa ng maagang bahagi ng panahon ng pag-aani.
- source_word: תְּחִלַּת קְצִיר שְׂעֹרִים
  choice: sa pasimula ng pag-aani ng sebada
  rationale: Tumpak na nililinaw kung anong anihan ang tinutukoy; ang “sebada” ay karaniwang makabagong katawagan sa barley.
theological_decisions:
- issue: Eksaktong paraan ng pagpatay o paglalantad na ipinahihiwatig ng יקע
  choice: “ibinitin” sa pangunahing teksto, na may talababa tungkol sa “itinuhog” o “inilantad sa madla”
  alternative: “itinuhog” o “inilantad sa madla” sa pangunahing teksto
  rationale: Hindi tiyak sa pandiwang Hebreo kung pagbitin sa makitid na modernong kahulugan ang paraan. Nagbibigay ang pangunahing salin ng madaling maunawaang larawan ngunit tahasang pinananatili ng talababa ang tunay na leksikal na kalabuan.
- issue: Kahulugan ng לִפְנֵי יְהוָה sa konteksto ng pagbitay
  choice: “sa harap ni Yahweh”
  alternative: “sa presensiya ni Yahweh”
  rationale: Pinananatili ng literal ngunit likas na parirala ang bigat na panrelihiyon at pangtipan nang hindi nagpapasya kung ito ay pagsang-ayon, paghahandog, o basta pagkilos na itinuturing na naganap sa harap ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa kapangyarihan ng” upang natural na maipahayag ang Hebreong idyoma, at “nabuwal” upang mapanatili ang larawan ng orihinal. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng salitang may leksikal na kalabuan.
