base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: tl
  text: Iniakyat niya mula roon ang mga buto ni Saul at ang mga buto ng anak niyang si Jonatan, at tinipon nila ang mga buto ng mga isinabit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga itinusok sa tulos” o “mga inilantad.” Tumutukoy ang Hebreo sa mga lalaking pinatay na hayagang inilantad ang kanilang mga katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Iniakyat niya
  rationale: Ang causative na diwa ng עלה ay ‘ipinaakyat’ o ‘iniakyat.’ Sa konteksto, inilalarawan nito ang pagkuha sa mga buto mula sa kinaroroonan ng mga ito.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwirang katumbas ng deictic expression at natural sa modernong Tagalog.
- source_word: עַצְמוֹת
  choice: mga buto
  rationale: Pinananatili ang kongkretong kahulugan ng Hebreo sa halip na ang mas malawak na ‘mga labi.’
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: ang mga buto ng anak niyang si Jonatan
  rationale: Malinaw at natural sa Tagalog na si Jonatan ang anak ni Saul, habang pinananatili ang ugnayang ipinahahayag ng Hebreo.
- source_word: וַיַּאַסְפוּ
  choice: tinipon nila
  rationale: Pinananatili ang ikatlong panauhang maramihan ng pandiwang Hebreo at ang diwa ng pangangalap ng mga buto para sa paglilibing.
- source_word: הַמּוּקָעִים
  choice: mga ibinitin
  rationale: Ang יקע ay tumutukoy sa mga pinatay at hayagang itinanghal o inilantad ang katawan, malamang sa pamamagitan ng pagkakabit o pagbibitin sa poste. Hindi tinutukoy nang tiyak ng salita ang eksaktong paraan, kaya inilalagay sa talababa ang saklaw ng kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga buto” para sa tekstuwal na katumpakan at “mga ibinitin” bilang madaling maunawaang pangunahing salin, habang pinananatili sa talababa ang kalabuan tungkol sa eksaktong paraan ng pampublikong pagtatanghal sa mga bangkay.
