revisions:
- from: Nagkaroon ng taggutom noong panahon ni David sa loob ng tatlong taon, sunod-sunod na taon. Kaya dumulog si David kay Yahweh[a], at sinabi ni Yahweh, “Dahil ito kay Saul at sa kanyang sambahayang may sala sa pagdanak ng dugo[b], sapagkat pinatay niya ang mga Gibeonita.”
  to: Nagkaroon ng taggutom noong panahon ni David sa loob ng tatlong taon, taon-taon. At dumulog si David kay Yahweh[a], at sinabi ni Yahweh, “Ito ay dahil kay Saul at sa kanyang sambahayang may sala sa pagdanak ng dugo[b], sapagkat pinatay niya ang mga Gibeonita.”
  rationale: Pinalitan ang “Kaya” ng “At” upang huwag magdagdag ng relasyong lohikal na hindi hayag sa pinagmulan. Ginawang “taon-taon” ang pag-uulit upang maging likas sa Filipino at mapanatili ang diin ng “year after year.” Inayos ang panimula ng tugon ni Yahweh sa “Ito ay dahil” para sa malinaw at buong pangungusap.
