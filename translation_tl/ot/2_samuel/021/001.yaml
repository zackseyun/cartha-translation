base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: tl
  text: Nagkaroon ng taggutom noong panahon ni David sa loob ng tatlong taon, taon-taon. At dumulog si David kay Yahweh[a], at sinabi ni Yahweh, “Ito ay dahil kay Saul at sa kanyang sambahayang may sala sa pagdanak ng dugo[b], sapagkat pinatay niya ang mga Gibeonita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hinanap ni David ang mukha ni Yahweh”; maaari ring isalin na “sumangguni si David kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sambahayan ng mga dugo,” isang idyoma para sa sambahayang may pananagutan sa pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: taggutom
  rationale: Sa salaysay, tumutukoy ito sa malubhang kakulangan ng pagkain na tumagal nang ilang taon, hindi lamang sa karaniwang pagkagutom.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: sa loob ng tatlong taon, sunod-sunod na taon
  rationale: Pinananatili ang pag-uulit sa Hebreo upang idiin na tuluy-tuloy ang taggutom sa tatlong magkakasunod na taon.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: dumulog ... kay Yahweh
  rationale: Likas sa modernong Filipino at ipinahihiwatig ang taimtim na paghahanap ng patnubay o sagot mula sa Diyos; inilalahad sa talababa ang literal na idyomang 'hinanap ang mukha.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: Dahil ito kay Saul at sa kanyang sambahayang may sala sa pagdanak ng dugo
  rationale: Sa konteksto, ipinaliliwanag ng pahayag ang sanhi ng taggutom. Ang 'sambahayan' ay ang pamilya o dinastiya ni Saul, at ang idyomang 'bahay ng mga dugo' ay nagpapahayag ng pananagutan sa pagdanak ng dugo.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: sapagkat pinatay niya ang mga Gibeonita
  rationale: Ang pandiwang isahan ay tumutukoy kay Saul bilang pangunahing gumawa o nagpangyari ng pagpatay; ang payak na 'pinatay niya' ay malinaw at hindi labis na nagpapaliwanag.
- source_word: הַגִּבְעֹנִים
  choice: mga Gibeonita
  rationale: Karaniwang anyong Filipino para sa pangalan ng pangkat na Gibeonites.
theological_decisions:
- issue: Paglalarawan sa paghahanap ni David sa Diyos
  choice: dumulog si David kay Yahweh
  alternative: hinanap ni David ang mukha ni Yahweh
  rationale: Ipinahahayag ng pangunahing teksto ang gamit ng idyoma sa natural na Filipino, habang pinananatili sa talababa ang literal at personal na larawan ng Hebreo nang hindi nililimitahan ito sa isang tiyak na paraan ng pagsangguni.
- issue: Sanhi ng taggutom at pananagutan ng sambahayan ni Saul
  choice: Dahil ito kay Saul at sa kanyang sambahayang may sala sa pagdanak ng dugo
  alternative: Tungkol ito kay Saul at sa sambahayan ng mga dugo
  rationale: Ipinakikita ng konteksto na sagot ito tungkol sa sanhi ng taggutom. Pinananatili ang pananagutang kapuwa inuugnay kay Saul at sa kanyang sambahayan, nang hindi nagpapasya kung paano eksaktong ibinahagi ng bawat kasapi ang sala.
- issue: Pagbanggit sa pagpatay sa mga Gibeonita
  choice: pinatay niya ang mga Gibeonita
  alternative: ipinapatay niya ang mga Gibeonita
  rationale: Ang Hebreo ay maaaring maglahad kay Saul bilang nagpangyari sa kanilang kamatayan. Ang 'pinatay niya' ay nagpapanatili sa kanya bilang pangunahing responsable ngunit hindi nagdaragdag ng di-tiyak na detalye tungkol sa mga tuwirang tagapagpatupad.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “taggutom,” “dumulog,” at “sambahayan” bilang malinaw na mga salitang angkop sa salaysay. Iniwasan ang labis na literal na “bahay ng mga dugo” sa pangunahing teksto, ngunit pinanatili ito sa talababa. Ang pangalang “Yahweh” ay tuwirang ginamit.
