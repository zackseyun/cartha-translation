base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: tl
  text: Sinabi ni David sa mga Gibeonita, “Ano ang gagawin ko para sa inyo, at ano ang ipangtutubos-sala ko, upang pagpalain ninyo ang mana[b] ni Yahweh[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at pagpalain ninyo ang mana ni Yahweh.” Sa mas literal na pagbasa, magkakaugnay lamang ang mga sugnay; ipinahahayag ng pangunahing teksto ang malamang na diwa ng layunin o bunga ayon sa konteksto.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mana ni Yahweh” ay tumutukoy sa Israel, ang bayang nauukol kay Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salin ng pandiwang nagsasalaysay na אמר; ipinakikilala nito ang sinabi ni David nang hindi dinaragdagan ang uri ng kilos-pananalita.
- source_word: הַגִּבְעֹנִים
  choice: mga Gibeonita
  rationale: Likas na anyong Filipino para sa pangmaramihang katawagan sa mga taga-Gibeon.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: Ano ang gagawin ko para sa inyo
  rationale: Ipinananatili ang bukás at mapagpasiyang tanong na ipinahihiwatig ng imperfect.
- source_word: וּבַמָּה אֲכַפֵּר
  choice: at sa pamamagitan ng ano ako makapagtutubos-sala
  rationale: Pinananatili ng “sa pamamagitan ng ano” ang instrumental na diwa ng בַּמָּה, habang inilalahad ng “makapagtutubos-sala” ang mabigat na panrelihiyon at reparatibong diwa ng Piel na כפר.
- source_word: וּבָרְכוּ
  choice: upang pagpalain ninyo
  rationale: Likas na ipinahahayag sa Filipino ang malamang na layunin o bunga ng hinihinging pagtubos-sala; ang mas literal na koordinasyon ay inilalagay sa talababa.
- source_word: נַחֲלַת יְהוָה
  choice: ang mana ni Yahweh
  rationale: Pinananatili ang talinghaga ng נחלה at ang ugnayang genitibo ng Hebreo, na tumutukoy sa Israel bilang bayang nauukol kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa transliterasyon sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Kahulugan ng כפר sa konteksto ng pananagutan sa dugo at paglabag sa tipan
  choice: makapagtutubos-sala
  alternative: makapagbibigay-salauli / makapagbabayad-pinsala
  rationale: Ang “pagtutubos-sala” ay nagpapanatili sa panrelihiyon, pangtipan, at reparatibong bigat ng כפר; hindi nito ibinababa ang usapin sa simpleng paghingi ng tawad o bayad-pinsala.
- issue: Ugnayan ng huling sugnay na וּבָרְכוּ אֶת נַחֲלַת יְהוָה
  choice: 'layunin o bunga: “upang pagpalain ninyo ang mana ni Yahweh”'
  alternative: 'payak na koordinasyon: “at pagpalain ninyo ang mana ni Yahweh”'
  rationale: Sa konteksto, itinatanong ni David kung anong gagawin ang hahantong sa pagpapala ng mga Gibeonita sa Israel. Gayunman, tunay na posible sa anyong Hebreo ang payak na koordinasyon, kaya hindi ito itinatago at inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang teknikal ngunit pamilyar na salitang “pagtutubos-sala” dahil mahalaga ang bigat ng כפר sa konteksto; iniwasan ang sobrang kolokyal o denominasyonal na pananalita.
