  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: tl
  text: Ipinaalam kay David ang ginawa ni Rizpa, na anak ni Aia at konkubina ni Saul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Ipinaalam
  rationale: Ang pasibong hofal ng נגד ay nagsasaad na ang balita ay ipinaabot kay David; natural sa makabagong Filipino ang “ipinaalam” at napapanatili nito ang pasibong diwa.
- source_word: לְדָוִד
  choice: kay David
  rationale: Tuwirang ipinapahayag ng ל ang di-tuwirang layon o tumanggap ng ulat.
- source_word: אֵת אֲשֶׁר עָשְׂתָה
  choice: ang ginawa
  rationale: Ang אֵת אֲשֶׁר ay nagpapakilala sa nilalaman ng iniulat, at ang perpektong עָשְׂתָה ay tumutukoy sa nagawa na bago ito ipinaalam.
- source_word: רִצְפָּה בַת אַיָּה
  choice: Rizpa na anak ni Aia
  rationale: Isinasalin ang patronimikong pagkakakilanlan sa malinaw at likas na anyong Filipino, habang tinutumbasan sa baybay-Filipino ang mga pangalang Hebreo.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: ang kinakasama ni Saul
  rationale: Ang פִּלֶגֶשׁ ay babaeng kinakasama na may kinikilalang ugnayan ngunit hindi kapantay ng pangunahing asawa; malinaw at hindi lubhang teknikal sa modernong Filipino ang “kinakasama.”
theological_decisions:
- issue: Katayuan ni Rizpa bilang פִּלֶגֶשׁ
  choice: kinakasama
  alternative: kalunya
  rationale: Hindi pinapahiwatig ng konteksto na lihim o pangangalunya ang relasyon, kaya iniiwasan ang “kalunya.” Ang “kinakasama” ay mas neutral, bagaman hindi nito ganap na naipapakita ang partikular na institusyong panlipunan sa sinaunang Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pasibong ayos ng unang pandiwa at ang magkakasunod na pagkakakilanlan kay Rizpa.
