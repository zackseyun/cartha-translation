base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: tl
  text: Ang apat na ito ay ipinanganak sa angkan ni Rafa sa Gat[a], at nabuwal sila sa kamay ni David at sa kamay ng kanyang mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kay Rafa,” “mula sa higante,” o “mula sa mga Refaim.” Malamang na tinutukoy ng Hebreo ang kanilang pinagmulan sa angkan ng mga higanteng nauugnay sa Gat.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: ang apat na ito
  rationale: Tuwirang isinasalin ang bilang at pantukoy; hindi idinaragdag ang “lalaki” sapagkat wala iyon sa Hebreo.
- source_word: יֻלְּדוּ
  choice: ipinanganak sa lahi ni
  rationale: Ang pasibong anyo ng ילד ay tumutukoy rito sa kapanganakan o angkan. Idinugtong sa kasunod na parirala, ang “ipinanganak sa lahi ni” ay likas sa Filipino at malinaw na nagpapahayag ng pinagmulan.
- source_word: לְהָרָפָה
  choice: sa lahi ni Rafa
  rationale: Pinananatili ang Rafa bilang pangalang kaugnay ng ninuno o angkan, habang ang “sa lahi ni” ay naghahatid ng diwa ng ugnayang genealogical nang hindi ito tahasang ginagawang karaniwang pangngalang “higante.”
- source_word: בְּגַת
  choice: sa Gat
  rationale: Karaniwang lokatibong salin ng parirala sa natural na Filipino.
- source_word: וַיִּפְּלוּ
  choice: napatay sila
  rationale: Bagaman literal na “nabuwal,” sa konteksto ng labanan ay malinaw na tumutukoy ito sa pagkamatay. Ang “napatay” ay natural at hindi malabo sa modernong Filipino.
- source_word: בְיַד
  choice: sa kamay ni / sa kamay ng
  rationale: Pinananatili ang Hebreong idyoma ng kamay bilang ahensiya, na nauunawaan din sa Filipino.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Tuwirang salin na angkop sa kontekstong maharlika at militar; maaaring tumukoy sa mga tauhang naglilingkod kay David.
theological_decisions:
- issue: Pagkakakilanlan ng הָרָפָה
  choice: Rafa bilang ninuno o katawagan sa angkan, na ipinahayag na “sa lahi ni Rafa”
  alternative: “sa higante,” “kay Rafa,” o “sa mga Refaim”
  rationale: Iniuugnay ng buod ang apat sa tradisyon ng mga higante sa Gat, ngunit hindi ganap na tiyak kung ang anyo ay pangalan, titulo, o katawagan sa pangkat. Pinananatili sa pangunahing teksto ang pangalang Rafa at inilalagay sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyomang “sa kamay” at ang pangalang Rafa, habang ginawang natural ang pahayag tungkol sa angkan.
