  source_fidelity: 'Ang pangunahing diwa ay wastong naihatid: tinatanggihan ng mga Gibeonita ang kabayarang pilak o ginto at kinikilala nilang hindi sila ang may kapangyarihang pumatay ng isang lalaki sa Israel. Gayunman, ang “Hindi kami humihingi ... mula kay Saul” ay bahagyang nagpapalabnaw sa legal na diwa ng paghahabol laban kay Saul at sa kanyang sambahayan. Ang elliptical na Hebreo sa ikalawang sugnay ay mas mabuting panatilihing di-ganap na ipinaliliwanag sa pangunahing teksto.'
  naturalness: Natural at marangal ang binagong Filipino. Ang “wala kaming habol” ay karaniwang gamit para sa isang paghahabol o paghahain ng demanda; ang “hindi para sa amin ang pumatay” ay malinaw ngunit hindi labis na nagpapakahulugan sa elliptical na Hebreo.
  terminology: Pinanatili ang “mga Gibeonita,” “Saul,” at “sambahayan.” Ginamit ang “sinumang lalaki” para sa אִישׁ, alinsunod sa generic ngunit panlalaking anyo ng Hebreo at sa audit trail na “any man.”
