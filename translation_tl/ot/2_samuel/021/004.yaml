base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: tl
  text: Sinabi sa kanya ng mga Gibeonita[a], “Wala kaming habol na pilak o ginto kay Saul o sa sambahayan niya, at hindi para sa amin ang pumatay ng sinumang lalaki sa Israel[b].” Pagkatapos, sinabi niya, “Ano ang sinasabi ninyong dapat kong gawin para sa inyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Walang usapin ng pilak o ginto sa pagitan namin at ni Saul at ng sambahayan niya.” Idyomatiko ang Hebreong pahayag at malamang na tumutukoy sa kabayarang salapi.
    reason: lexical_alternative
  - marker: b
    text: O, “Wala kaming karapatang pumatay ng sinumang lalaki sa Israel.” Elliptical ang Hebreo; maaaring ipahiwatig nito ang kawalan ng karapatan o kapangyarihang gawin ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: Hindi kami humihingi ng pilak o ginto mula kay Saul o sa sambahayan niya
  rationale: Idyomatiko ang Hebreo at sa konteksto ay tumutukoy sa pagtanggi sa kabayarang salapi, hindi sa simpleng kawalan ng pag-aari. Ginamit ang pangmaramihang “kami” sapagkat kolektibong sumasagot ang mga Gibeonita.
- source_word: עִם
  choice: mula kay ... o sa
  rationale: Sa kontekstong ito, minamarkahan ng עִם ang mga taong pagkukunan sana ng kabayaran. Mas natural sa Filipino ang “mula kay Saul o sa sambahayan niya” kaysa sa literal na “kasama ni.”
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: at wala kaming karapatang pumatay ng sinuman sa Israel
  rationale: Elliptical ang sugnay at malamang na tumutukoy sa kawalan ng awtoridad o karapatang magpataw ng kamatayan, hindi sa kawalan ng taong maaaring patayin.
- source_word: אִישׁ
  choice: sinuman
  rationale: Generic ang singular na אִישׁ dito. Ang “sinuman” ay natural at malinaw sa modernong Filipino habang saklaw ang sinumang indibidwal sa Israel.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: Ano ang nais ninyong gawin ko para sa inyo?
  rationale: Siksik ang Hebreong pahayag. Ipinahahayag ng natural na tanong sa Filipino na hinihingi ni David na sabihin nila ang gusto nilang ipagawa niya.
theological_decisions:
- issue: Ang di-tiyak na diwa ng kawalan ng taong papatayin
  choice: wala kaming karapatang pumatay
  alternative: wala kaming taong papatayin
  rationale: Sa konteksto ng pakikipag-usap nila sa hari, mas malamang na ang usapin ay ang kanilang awtoridad o prerogatiba. Gayunman, inilalahad sa talababa ang mas literal na posibilidad upang hindi maitago ang pagkaelliptical ng Hebreo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “sambahayan” para sa בֵּיתוֹ dahil saklaw nito ang angkan o sambahayan ni Saul, hindi lamang ang pisikal na bahay. Pinanatili ang malinaw na legal na diwa ng sagot ng mga Gibeonita at minarkahan sa pangunahing teksto ang lahat ng talababa.
