  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: tl
  text: Inilibing nila ang mga buto nina Saul at Jonatan na anak niya sa lupain ng Benjamin, sa Zela, sa libingan ni Kis na ama ni Saul. Ginawa nila ang lahat ng iniutos ng hari. Pagkatapos nito, dininig ng Diyos ang pagsusumamo para sa lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nagpaunlak ang Diyos sa pagsusumamo para sa lupain,” o “sinagot ng Diyos ang panalangin para sa lupain.” Ipinahihiwatig ng pandiwang Hebreo ang kanais-nais na pagtugon sa isang pagsusumamo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Inilibing nila
  rationale: Likas na salaysay sa nakaraang panahon para sa pandiwang קבר; hindi kailangang isalin nang hiwalay ang panimulang waw upang maipakita ang pagkakasunod-sunod.
- source_word: עַצְמוֹת שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: ang mga buto nina Saul at Jonatan na anak niya
  rationale: Pinananatili ang kongkretong “mga buto” at ang kaugnayan ni Jonatan kay Saul. Ang “niya” ay natural ngunit nananatiling malapit sa anyo ng Hebreo.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: sa lupain ng Benjamin
  rationale: Pinananatili ang tahasang “lupain” at ang pantribo o panteritoryong diwa ng Benjamin.
- source_word: בְּצֵלָע
  choice: sa Zela
  rationale: Transliterasyon ng pangalang-pook sa paraang madaling basahin sa Filipino.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: sa libingan ni Kis na ama ni Saul
  rationale: Ang קֶבֶר ay natural na “libingan.” Nililinaw na si Kis ang ama ni Saul, ayon sa konteksto at pagkakakilanlan ng tauhan, upang maiwasang mapagkamalan siyang ama ni Jonatan.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Ginawa nila ang lahat ng iniutos ng hari
  rationale: Malinaw at natural na Filipino na tapat sa kabuuan ng sugnay.
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: dininig ng Diyos ang pagsusumamo
  rationale: Ang Niphal ng עתר ay nagpapahiwatig ng kanais-nais na pagtugon sa pagsusumamo. Ang “dininig” ay karaniwang wikang panalangin sa Filipino at nagpapahiwatig ng positibong tugon nang hindi dinaragdagan ng ideyang “pinagaling.”
- source_word: לָאָרֶץ
  choice: para sa lupain
  rationale: 'Ipinapakita ang kapakinabangan o paksa ng pagsusumamo: ang lupain ang pinatutungkulan ng tugon.'
- source_word: אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Natural na panandang temporal na nagpapanatili sa pagkakasunod ng mga pangyayari.
theological_decisions:
- issue: Kahulugan ng וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: dininig ng Diyos ang pagsusumamo para sa lupain
  alternative: tumugon ang Diyos para sa lupain; pumayag ang Diyos na pamanhikan para sa lupain
  rationale: Hindi tahasang nakasulat ang pangngalang “pagsusumamo,” ngunit taglay ito ng kahulugan ng pandiwang עתר sa Niphal. Ginagawang malinaw ng salin ang ipinahihiwatig na pakiusap, ngunit hindi nito tinutukoy kung sino ang nanalangin o pinalalawak ang tugon bilang “pagpapagaling sa lupain.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “libingan” sa halip na mas teknikal na katawagan, at “dininig” bilang likas na pananalitang Filipino para sa kanais-nais na pagsagot sa pagsusumamo. Inilagay ang talababa sa sugnay na tinutukoy nito, hindi pagkatapos ng “Benjamin.”
