  source_fidelity: 'Tapat ang pangunahing salin sa Hebreo: pinananatili nito ang “mga buto,” ang lugar ng paglilibing, ang utos ng hari, at ang kanais-nais na pagtugon ng Diyos na ipinahihiwatig ng Niphal ng עתר. Ang “dininig ng Diyos ang pagsusumamo para sa lupain” ay isang angkop na modernong Filipino na pagsasalin ng huling sugnay.'
  naturalness: Natural at marangal ang daloy ng salin. Malinaw rin ang “ni Kis na ama ni Saul,” na wasto ayon sa sanggunian at nakaiiwas sa kalabuan. Gayunman, hindi natural at hindi tumpak sa talababa ang “nagpaamo ang Diyos”; ang “magpaamo” ay hindi angkop na katumbas ng pandiwang Hebreo sa kontekstong ito.
  terminology: Ang “libingan,” “pagsusumamo,” at “lupain” ay angkop sa rehistro at sa tekstong pinagmulan. Ang mga pangalan ay maayos na naisalin bilang Saul, Jonatan, Zela, at Kis.
