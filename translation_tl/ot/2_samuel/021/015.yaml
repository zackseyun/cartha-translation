base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: tl
  text: Muli na namang nagkaroon ng digmaan sa pagitan ng mga Filisteo at Israel. Bumaba si David kasama ng kanyang mga lingkod[a], at nakipaglaban sila sa mga Filisteo. At nanghina si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tauhan.” Ang Hebreo ay “mga lingkod,” isang karaniwang tawag sa mga naglilingkod sa hari, kabilang ang kanyang mga mandirigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Muling nagkaroon ng digmaan
  rationale: Likas na salin ng panimulang pangyayaring ipinahahayag ng וַתְּהִי, habang malinaw na ipinapakita ng עוֹד ang pag-ulit ng digmaan.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: ang mga Filisteo at ang Israel
  rationale: Sa konteksto, ipinahahayag ng konstruksiyon ang dalawang panig na magkalaban; kasama ng “digmaan,” natural sa Filipino ang “ang mga Filisteo at ang Israel.”
- source_word: וַיֵּרֶד
  choice: Bumaba
  rationale: Pinananatili ang karaniwang kahulugan ng ירד at ang posibleng heograpikong direksiyon patungo sa labanan.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: kasama ang kanyang mga lingkod
  rationale: Ang עֲבָדָיו ay literal na “kanyang mga lingkod,” at ang “kasama” ay natural na naghahatid sa עִמּוֹ nang hindi inuulit nang alanganin ang “kasama niya.”
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: nakipaglaban sila sa mga Filisteo
  rationale: Karaniwan at malinaw na Filipino para sa pakikipaglaban laban sa isang pangkat.
- source_word: וַיָּעַף דָּוִד
  choice: nanghina si David
  rationale: Ipinahahayag ng עוף dito ang pagiging lupaypay, mahina, o pagod. Ang “nanghina” ay maikli, natural, at hindi labis na tumutukoy kung simpleng pagod o higit na pagkahapo.
