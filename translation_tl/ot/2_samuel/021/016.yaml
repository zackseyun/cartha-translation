  to: At si Isbi-benob[a], na kabilang sa mga inapo ni Rafa[b], na ang sibat ay tumitimbang ng tatlong daang siklong bronse, at nakabigkis ng bagong tabak[c], ay sinabi niyang pababagsakin niya si David.
