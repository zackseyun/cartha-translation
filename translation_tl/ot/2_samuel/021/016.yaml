  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: tl
  text: At si Isbi-benob[a], na kabilang sa mga inapo ni Rafa[b], na ang sibat ay tumitimbang ng tatlong daang siklong bronse, at nakabigkis ng bagong tabak[c], ay sinabi niyang pababagsakin niya si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang anyo ng pangalang Hebreo. Sinusunod dito ang tradisyonal na pagbasa na “Isbi-benob”; maaari rin itong basahing “Jesbi-benob” o hatiin sa ibang paraan ang mga katinig.
    reason: textual_variant
  - marker: b
    text: Maaari ring “kabilang sa mga ipinanganak kay Rafa.” Malamang na tumutukoy ang parirala sa angkan ng mga higanteng kaugnay ng mga Refaim.
    reason: lexical_alternative
  - marker: c
    text: “Bago” lamang ang tahasang sinasabi sa Hebreo; hindi binanggit ang pangngalan. Ayon sa tradisyon, “tabak” ang ipinapalagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: Isbi-benob
  rationale: Mahirap at hindi tiyak ang anyong Hebreo, ngunit ang tradisyonal na pagbasa rito bilang pangalan ng mandirigma ang pinakaangkop sa daloy at sa mga pangalan sa konteksto.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: na kabilang sa mga inapo ni Rafa
  rationale: Ipinahahayag ng יְלִידֵי ang angkan o pinagmulang lahi. Pinananatili ang Rafa bilang pangalang pantangi sa halip na agad itong isaling “higante.”
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: na ang sibat ay tumitimbang
  rationale: Sa konteksto ng labanan, ang קֵין ay tradisyonal na nauunawaang sibat o tangkay ng sibat; natural sa Filipino ang pagsasaayos bilang sugnay na nagsasaad ng timbang.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: tatlong daang siklong tanso
  rationale: Pinananatili ang sinaunang yunit na siklo para sa malinaw na ugnayan sa teksto. Ang נְחֹשֶׁת ay tanso o bronse; “tanso” ang karaniwang salitang Filipino para sa metal na tinutukoy sa ganitong konteksto.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: at may nakabigkis na bagong tabak
  rationale: “Bago” lamang ang tahasang nasa Hebreo at may ipinapalagay na pambabaeng pangngalan; ayon sa tradisyon at konteksto, malamang na tabak ang tinutukoy, ngunit minamarkahan ang kawalang-katiyakan.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: ay nagsabing pababagsakin niya si David
  rationale: Pinananatili ng “nagsabing” ang pandiwang אָמַר, habang ang “pababagsakin” ay likas na ekspresyon ng layunin sa konteksto ng labanan at hindi labis na nililinaw bilang pagpatay.
