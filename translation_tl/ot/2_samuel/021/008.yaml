revisions:
- from: Kaya kinuha ng hari ang dalawang anak na lalaki ni Rizpa na anak ni Aya—sina Armoni at Mefiboset—na ipinanganak niya kay Saul, at ang limang anak na lalaki ni Mical[a] na anak ni Saul, na ipinanganak niya kay Adriel na anak ni Barzilai na taga-Mehola.
  to: At kinuha ng hari ang dalawang anak na lalaki ni Rizpa, anak ni Aya, na ipinanganak ni Rizpa kay Saul—sina Armoni at Mefiboset—at ang limang anak na lalaki ni Mical[a], anak ni Saul, na ipinanganak ni Mical kay Adriel na anak ni Barzilai na taga-Mehola.
  rationale: Inayos ang pang-ugnay na pambungad upang mapanatili ang payak na sunod-sunod na galaw ng Hebreo. Inulit ang mga pangalang Rizpa at Mical sa mga sugnay tungkol sa pagsilang upang maging malinaw ang paksa ng pandiwang “ipinanganak,” habang pinanatili ang ayos at saklaw ng impormasyon sa WLC. Pinino rin ang talababa upang malinaw nitong ilarawan ang alternatibong tekstuwal/tradisyunal na pagbasa nang hindi inaamyendahan ang pangunahing teksto.
