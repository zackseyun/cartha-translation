  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: tl
  text: At kinuha ng hari ang dalawang anak na lalaki ni Rizpa, anak ni Aya, na ipinanganak ni Rizpa kay Saul—sina Armoni at Mefiboset—at ang limang anak na lalaki ni Mical[a], anak ni Saul, na ipinanganak ni Mical kay Adriel na anak ni Barzilai na taga-Mehola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at ayon sa ilang sinaunang tagapagsalin ay “Merab” ang mababasa sa halip na “Mical.” Ihambing ang 1 Samuel 18:19, kung saan si Merab na anak ni Saul ang napangasawa ni Adriel.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kaya kinuha
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Filipino ang “Kaya kinuha” at naipapakita nito ang pagkakasunod at kaugnayan sa naunang pangyayari.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Pinanatili ang titulong tiyak na ginamit sa Hebreo sa halip na palitan ng pangalang David.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: ang dalawang anak na lalaki ni Rizpa na anak ni Aya
  rationale: Tuwirang isinasalin ang construct chain at nililinaw ang kasarian ng בְּנֵי sa natural na Filipino.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: na ipinanganak niya kay Saul
  rationale: Ipinahihiwatig ng לְ ang ama; ang pahayag ay natural sa Filipino at hindi nagpapasok ng karagdagang interpretasyon.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: sina Armoni at Mefiboset
  rationale: Ginamit ang pantukoy na “sina” para sa mga personal na pangalan at ang karaniwang anyong Filipino ng mga pangalan.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: ang limang anak na lalaki ni Mical na anak ni Saul
  rationale: Pinanatili sa pangunahing teksto ang pagbasa ng WLC na מִיכַל, “Mical,” habang inilalagay sa talababa ang mahalagang baryante.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: na ipinanganak niya kay Adriel
  rationale: Kapareho ito ng naunang Hebreong konstruksiyon at pare-pareho rin ang salin.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: na anak ni Barzilai na taga-Mehola
  rationale: 'Ang patronymic ay isinaling “anak ni,” at ang gentilic ay natural na ipinahayag bilang pinagmulan: “taga-Mehola.”'
theological_decisions:
- issue: Tensiyong tekstuwal at pangkasaysayan tungkol kay Mical bilang ina ng mga anak ni Adriel
  choice: Panatilihin ang “Mical” sa pangunahing teksto at ilagay ang “Merab” sa talababa.
  alternative: Basahin sa pangunahing teksto ang “Merab na anak ni Saul.”
  rationale: מִיכַל (“Mical”) ang nasa ibinigay na tekstong Hebreo, kaya hindi ito tahimik na iniwasto upang iayon sa 1 Samuel 18:19. Gayunman, mahalagang ipaalam ang baryanteng “Merab” dahil si Merab ang sinasabing napangasawa ni Adriel sa talatang iyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “anak na lalaki” upang malinaw na katawanin ang Hebreong בְּנֵי, at “taga-Mehola” bilang likas na salin ng katawagang heograpiko. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng “Mical.”
