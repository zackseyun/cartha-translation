base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: tl
  text: Sinabi nila sa hari, “Ang taong umubos sa amin at nagbalak laban sa amin[a], upang mapuksa kami at mawalan ng lugar saanman sa nasasakupan ng Israel[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagpakana laban sa amin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbuo ng balak o pakana.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa pagtayo o pagtatatag ng aming sarili sa buong nasasakupan ng Israel”; ibig sabihin, upang hindi na kami manatiling may lugar saanman sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: umubos sa amin
  rationale: Ang pandiwang כלה ay may diwang pag-ubos o pagwawakas. Pinananatili ng “umubos sa amin” ang matinding larawan ng Hebreo nang hindi ipinahihiwatig na walang sinumang nakaligtas.
- source_word: דִּמָּה לָנוּ
  choice: nagbalak laban sa amin
  rationale: Sa kontekstong ito, ang דמה ay tumutukoy sa pagbuo ng balak, at ang לָנוּ ay may masamang diwang nakatuon laban sa kanila.
- source_word: נִשְׁמַדְנוּ
  choice: upang mapuksa kami
  rationale: Ang Niphal ng שׁמד ay nagpapahayag ng pagkapuksa o pagkalipol. Ang “upang” ay likas na nag-uugnay rito bilang layunin o ibinungang kalagayan ng masamang balak.
- source_word: מֵהִתְיַצֵּב
  choice: mawalan ng lugar
  rationale: Bagaman literal itong may diwang pagtayo o pagtatatag ng sarili, sa konteksto ay tumutukoy ito sa pagkawala ng kakayahang manatiling may kinikilalang presensiya sa lupain.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: saanman sa nasasakupan ng Israel
  rationale: Ang גְּבוּל dito ay tumutukoy sa buong teritoryo o nasasakupan, hindi lamang sa guhit ng hangganan. Ipinahahayag ng “saanman” ang saklaw ng בְּכָל.
- source_word: הָאִישׁ
  choice: Ang taong
  rationale: Tiyak ang pangngalan at tumutukoy kay Saul na siyang paksa ng kanilang paratang. Natural sa direktang pananalita ang “Ang taong.”
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Ang “umubos,” “mapuksa,” at “nasasakupan” ay nagpapanatili sa tindi at saklaw ng Hebreo, samantalang ang “mawalan ng lugar” ay likas na nagpapahayag ng idyomatikong diwa ng patuloy na presensiya sa lupain. Pinanatili ang bitin na wakas sa pamamagitan ng em dash dahil nagpapatuloy ang pangungusap sa susunod na talata.
