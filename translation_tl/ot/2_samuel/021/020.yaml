base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: tl
  text: Muling nagkaroon ng digmaan sa Gat. Doon ay may isang lalaking may pambihirang laki[a]. Tig-aanim ang mga daliri niya sa bawat kamay at bawat paa[b]—dalawampu't apat lahat. Siya rin ay nagmula sa lahi ni Rafa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “isang lalaking may sukat.” Maaari rin itong unawaing “isang napakalaking lalaki” o “isang lalaking may pambihirang tangkad.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga daliri ng kanyang mga kamay at ang mga daliri ng kanyang mga paa”—anim sa bawat kamay at paa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “ipinanganak kay Rafa” o “kabilang sa mga inapo ni Rafa.” Posibleng may kaugnayan ang Rafa sa mga Refaim, isang pangkat na iniuugnay sa mga taong pambihira ang laki.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: digmaan
  rationale: Karaniwang katumbas ito ng malawak na tunggalian o pakikidigma; ang “digmaan” ay angkop sa paulit-ulit na labanan sa konteksto.
- source_word: בְּגַת
  choice: sa Gat
  rationale: Maaaring mangahulugang “sa loob ng” o “sa lugar ng”; likas sa Filipino ang “sa Gat” bilang pook ng digmaan.
- source_word: אִישׁ מדין
  choice: isang lalaking may pambihirang laki
  rationale: Mahirap at posibleng tekstuwal na di-tiyak ang parirala, ngunit karaniwang inuunawa itong tumutukoy sa pambihirang sukat o pangangatawan. Pinananatili ng salin ang diwa nang hindi ito tahasang ginagawang “higante.”
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: mga daliri niya sa bawat kamay at bawat paa
  rationale: Iisang karaniwang salita ang “daliri” sa Filipino para sa mga digit ng kamay at paa; nililinaw ng “kamay” at “paa” ang tinutukoy.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: tig-aanim ... sa bawat kamay at bawat paa
  rationale: Ipinahahayag nito nang likas at malinaw sa Filipino ang anim na daliri sa bawat isa sa dalawang kamay at dalawang paa, na tumutugma sa kabuuang dalawampu't apat.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: dalawampu't apat lahat
  rationale: Natural na pagbubuod ito sa Filipino ng kabuuang bilang na tahasang ibinigay sa Hebreo.
- source_word: יֻלַּד לְהָרָפָה
  choice: nagmula sa lahi ni Rafa
  rationale: Ang pasibong anyo ng ילד na may ל ay maaaring magpahiwatig ng kapanganakan o pagkamula sa isang angkan. Ang “nagmula sa lahi” ay natural sa Filipino at hindi ipinapalagay na tuwirang anak lamang siya ni Rafa.
theological_decisions:
- issue: Pagkakakilanlan ng הָרָפָה
  choice: Rafa bilang pangalan o katawagang pangkanunu-nunuan
  alternative: ang higante; ang mga Refaim
  rationale: Mas ligtas panatilihin ang “Rafa” bilang pantanging katawagan sa pangunahing teksto. Iniiwasan nitong ipasok agad ang interpretasyong “higante,” habang ipinakikita ng talababa ang posibleng kaugnayan sa mga Refaim.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gat” at “Rafa” bilang natural na baybay sa Filipino. Iniwasan ang masyadong teknikal o denominasyonal na pananalita, at inilagay sa mga talababa ang tunay na leksikal at pangangkanang kalabuan.
