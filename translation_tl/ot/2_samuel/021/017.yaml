  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעֲזָר ל/וֹ֙ אֲבִישַׁ֣י בֶּן צְרוּיָ֔ה וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ אָ֣ז נִשְׁבְּעוּ֩ אַנְשֵׁי דָוִ֨ד ל֜/וֹ לֵ/אמֹ֗ר לֹא תֵצֵ֨א ע֤וֹד אִתָּ֨/נוּ֙ לַ/מִּלְחָמָ֔ה וְ/לֹ֥א תְכַבֶּ֖ה אֶת נֵ֥ר יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: tl
  text: Ngunit tinulungan siya ni Abisai na anak ni Zeruia; sinaktan niya ang Filisteo at pinatay niya ito. Pagkatapos, sumumpa sa kanya ang mga tauhan ni David, “Hindi ka na dapat sumama sa amin sa digmaan, upang hindi mo mapatay ang ilawan ng Israel.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “liwanag ng Israel.” Sa Hebreo, “ilawan” ang literal na salita—isang talinghaga para sa mahalagang papel ni David sa buhay at katatagan ng bansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: tinulungan siya
  rationale: Tuwirang ipinapahayag ng עזר ang pagtulong o pag-alalay. Likas ito sa Filipino at hindi nagdaragdag ng di-tiyak na ideya na lubusan siyang nailigtas.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abisai na anak ni Zeruia
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal, at malinaw na isinalin ang ugnayang ipinahihiwatig ng בֶּן.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: sinaktan nito ang Filisteo
  rationale: Ang נכה ay nangangahulugang humampas o manakit. Hindi ginamit ang 'pinabagsak' upang hindi maunang ipahiwatig ang kamatayang tahasang sinasabi ng kasunod na pandiwa.
- source_word: וַיְמִיתֵהוּ
  choice: at pinatay
  rationale: 'Malinaw na causative ang anyo ng מות: pinangyari niyang mamatay ang Filisteo. Maikli at natural sa Filipino ang ''pinatay.'''
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: Pagkatapos, sumumpa sa kanya ang mga tauhan ni David
  rationale: Pinananatili nito ang David bilang pinatutungkulan ng sumpa at ang mga tauhan bilang mismong nanumpa, sa halip na ipahiwatig na pinanumpa nila si David.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Hindi ka na muling sasama sa amin sa pakikipagdigma
  rationale: Ipinahahayag ng pahayag sa konteksto ng sumpa ang mariing pagbabawal. Ang 'sasama sa amin sa pakikipagdigma' ay natural na Filipino para sa paglabas na kasama nila tungo sa labanan.
- source_word: וְלֹא תְכַבֶּה
  choice: upang hindi mo mapatay
  rationale: Bagaman may pang-ugnay na literal na 'at hindi,' ipinahihiwatig ng sugnay ang masamang kahihinatnang nais nilang iwasan. Ang 'mapatay' ay karaniwang gamit sa Filipino para sa apoy o ilawang nawawalan ng ningas.
- source_word: נֵר יִשְׂרָאֵל
  choice: ang ilawan ng Israel
  rationale: Ang נֵר ay kongkretong ilawan, hindi lamang abstraktong liwanag. Pinananatili ng salin ang talinghaga tungkol sa mahalagang papel ni David sa buhay at katatagan ng Israel.
theological_decisions:
- issue: Ang metaporikal na pagtukoy kay David bilang ilawan ng Israel
  choice: Panatilihin sa pangunahing teksto ang 'ilawan ng Israel.'
  alternative: ang liwanag ng Israel
  rationale: Kongkretong talinghaga ang ginamit ng Hebreo. Ang 'ilawan' ay nagpapanatili sa pampanitikan at maharlikang pahiwatig nang hindi ito pinapalitan ng isang mas interpretatibong pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong talinghagang 'ilawan' at iniwasan ang labis na pagpapakahulugan. Inilagay ang talababa pagkatapos ng pariralang aktuwal nitong ipinaliliwanag.
