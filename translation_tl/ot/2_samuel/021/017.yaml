  terminology: Ang ‘Abisai,’ ‘Zeruia,’ ‘Filisteo,’ at ‘ilawan ng Israel’ ay angkop. Pinananatili ng ‘ilawan’ ang kongkretong metapora ng נֵר nang hindi ito pinapalitan ng interpretatibong pagpapaliwanag sa pangunahing teksto.
