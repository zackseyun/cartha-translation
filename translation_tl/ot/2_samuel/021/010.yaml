base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: tl
  text: Pagkatapos, kumuha si Rizpa na anak ni Aia ng telang-sako at inilatag niya iyon para sa sarili niya sa ibabaw ng bato, mula sa simula ng pag-aani hanggang sa bumuhos sa kanila ang tubig mula sa langit.[a] Hindi niya hinayaang dumapo sa kanila ang mga ibon sa himpapawid sa araw, ni lapitan sila ng mababangis na hayop sa parang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “hanggang sa umulan sa kanila mula sa langit.” Mas literal sa Hebreo: “hanggang sa bumuhos sa kanila ang tubig mula sa langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: telang-sako
  rationale: Tumutukoy ang שַׂק sa magaspang na telang ginagamit sa pagluluksa; mas malinaw sa modernong Tagalog ang “telang-sako” kaysa sa literal na “sako.”
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: inilatag iyon para sa sarili niya sa ibabaw ng bato
  rationale: Ipinahihiwatig ng נטה na iniunat o inilatag ang tela, at pinananatili ng “para sa sarili niya” ang diwang pakinabang ng לָהּ. Sa konteksto, ang אֶל ay likas na tumutukoy sa kinalalagyan sa ibabaw ng bato.
- source_word: מִתְּחִלַּת קָצִיר
  choice: mula sa simula ng pag-aani
  rationale: Hindi tinutukoy sa talata kung anong pananim ang inaani, kaya hindi idinagdag ang “sebada.”
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: hanggang sa bumuhos sa kanila ang tubig mula sa langit
  rationale: Pinananatili ng “bumuhos” at “tubig mula sa langit” ang kongkretong larawan ng Hebreo, habang nananatiling natural sa Tagalog. Malamang na ulan ang tinutukoy, ngunit inilagay iyon bilang alternatibo sa talababa.
- source_word: עוֹף הַשָּׁמַיִם
  choice: mga ibon sa himpapawid
  rationale: Natural at marangal na katumbas ito ng karaniwang idyomang Hebreo para sa mga ibon.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: dumapo sa kanila
  rationale: Sa pagtukoy sa mga ibon, ang נוח ay nangangahulugang paglapag o pagdapo; malinaw sa Tagalog ang “dumapo.”
- source_word: חַיַּת הַשָּׂדֶה
  choice: mababangis na hayop sa parang
  rationale: Ipinahahayag nito ang mga mailap o ligaw na hayop sa lupain, habang pinananatili ang larawang “sa parang.”
- source_word: יוֹמָם ... לָיְלָה
  choice: sa araw ... sa gabi
  rationale: Ito ang natural na Tagalog na nagpapanatili sa magkatapat na panahon sa Hebreo.
- source_word: וְלֹא נָתְנָה
  choice: Hindi niya hinayaang
  rationale: Ang נתן na sinusundan ng pawatas ay idyomatikong nangangahulugang pagpapahintulot; “hindi niya hinayaang” ang malinaw at natural na salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig-pagsasalaysay. Idinagdag ang “Nanatili siya roon” upang maging malinaw at natural ang tagal ng pagbabantay na ipinahihiwatig ng pangungusap, nang hindi binabago ang panahon o lugar. Sa ikalawang sugnay, ginamit ang “lapitan” para sa mga hayop sapagkat hindi natural na gamitin sa kanila ang “dumapo”; inuulit nito sa paraang angkop sa Tagalog ang iisang pandiwang pinamamahalaan ng Hebreong balangkas.
