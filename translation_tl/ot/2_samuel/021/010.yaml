  naturalness: Natural at marangal ang Tagalog sa pangkalahatan. Mas maayos na idugtong ang pariralang pangpanahon sa kilos ng paglalatag kaysa magdagdag ng isang paliwanag na pangungusap.
  terminology: Ang “telang-sako,” “himpapawid,” at “mga mababangis na hayop sa parang” ay angkop sa modernong Filipino Tagalog at sa tono ng salaysay. Napananatili ng talababa ang pagkakaiba ng literal na larawan ng pagbuhos ng tubig at ng interpretasyong ulan.
