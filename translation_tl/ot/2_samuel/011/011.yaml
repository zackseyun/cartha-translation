  source_fidelity: Tumpak na naihahatid ng draft ang pangunahing nilalaman at ang retorikal na pagtanggi ni Urias. Gayunman, ang “Saksi ang buhay mo” ay bahagyang lumilihis mula sa direktang pormula ng panunumpa na “As you live,” at ang “lantad na parang” ay hindi likas na paglalarawan ng עַל־פְּנֵי הַשָּׂדֶה.
  naturalness: Pormal at malinaw sa kabuuan ang Tagalog. Mas natural ang “sa bukás na parang” kaysa “sa lantad na parang,” at mas maayos ang “Kung paanong buhay ka...” bilang pormula ng taimtim na panunumpa.
  terminology: Ang “Kaban,” “panginoon,” “pansamantalang silungan,” at “sumiping” ay angkop sa konteksto at rehistro. Pinananatili ng “kaluluwa” ang leksikal na anyo ng נפשׁ nang hindi ipinapataw ang isang doktrinal na kahulugan.
