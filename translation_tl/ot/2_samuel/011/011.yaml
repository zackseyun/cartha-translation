revisions:
- from: Sinabi ni Urias kay David, “Ang Kaban, ang Israel, at ang Juda ay nananatili sa mga pansamantalang silungan[a], at ang panginoon kong si Joab at ang mga lingkod ng aking panginoon ay nagkakampo sa lantad na parang. Ako ba nama’y uuwi sa bahay ko upang kumain, uminom, at sumiping sa asawa ko?[b] Saksi ang buhay mo at ang buhay ng iyong kaluluwa[c], hindi ko gagawin ang bagay na ito.”
  to: Sinabi ni Urias kay David, “Ang Kaban, ang Israel, at ang Juda ay nananatili sa mga pansamantalang silungan[a], at ang panginoon kong si Joab at ang mga lingkod ng aking panginoon ay nagkakampo sa bukás na parang. Ako ba nama’y uuwi sa bahay ko upang kumain, uminom, at sumiping sa asawa ko?[b] Kung paanong buhay ka at buhay ang iyong kaluluwa[c], hinding-hindi ko gagawin ang bagay na ito.”
  rationale: Pinalitan ang hindi gaanong natural na “lantad na parang” ng “bukás na parang.” Inayos din ang pormula ng panunumpa upang mas direktang maipakita ang Hebreong pagbanggit sa buhay ng kausap at sa kanyang kaluluwa, habang ginawang malinaw sa Tagalog ang eliptikong mariing pagtanggi sa pamamagitan ng “hinding-hindi.” Napanatili ang lahat ng footnote anchor at ang kahulugan ng talata.
