  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: tl
  text: Sinabi ni Urias kay David, “Ang Kaban, ang Israel, at ang Juda ay nananatili sa mga pansamantalang silungan[a], at ang panginoon kong si Joab at ang mga lingkod ng aking panginoon ay nagkakampo sa bukás na parang. Ako ba nama’y uuwi sa bahay ko upang kumain, uminom, at sumiping sa asawa ko?[b] Kung paanong buhay ka at buhay ang iyong kaluluwa[c], hinding-hindi ko gagawin ang bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kubol”; tumutukoy ang salitang Hebreo sa mga pansamantalang silungan, gaya ng mga kubol, na ginagamit sa larangan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Uuwi ba ako sa bahay ko…?” Isa itong retorikal na tanong na nagpapahayag ng pagtanggi ni Urias.
    reason: alternative_reading
  - marker: c
    text: 'Literal na pormula ng panunumpa sa Hebreo: “Buhay ka, at buhay ang iyong kaluluwa, kung gagawin ko ang bagay na ito.” Ang “kung” pagkatapos ng panunumpa ay nagpapahayag ng mariing pagtanggi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: ang Kaban
  rationale: Payak na “ang kaban” ang nasa Hebreo, kaya hindi dinagdagan ng “ng Diyos” o “ng tipan.” Ginamit ang malaking titik upang malinaw na tumukoy sa kilalang banal na Kaban sa salaysay.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: nananatili sa mga pansamantalang silungan
  rationale: Ang סֻכּוֹת ay mga kubol o pansamantalang silungan. Likas sa modernong Tagalog ang parirala at pinananatili nito ang pansamantalang kalagayan sa panahon ng digmaan.
- source_word: אֲדֹנִי
  choice: panginoon ko / aking panginoon
  rationale: Magalang na pantawag ito sa isang taong nakatataas, hindi ang banal na pangalan. Ang “panginoon” ay nagpapanatili sa pormal at panlipunang himig ng teksto.
- source_word: עַל פְּנֵי הַשָּׂדֶה חֹנִים
  choice: nagkakampo sa lantad na parang
  rationale: Ipinahihiwatig ng idyoma ang pagkakampo sa bukas at walang kanlungang lupain. Inihahatid ng “lantad na parang” ang pagkakalantad na taglay ng Hebreo.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: Ako ba nama’y uuwi sa bahay ko
  rationale: Bagaman anyong di-ganap ang pandiwa, retorikal at tumatanggi ang puwersa nito sa konteksto. Ipinahahayag ng “Ako ba nama’y” ang mariing pagtutol nang hindi ginagawang payak na pahayag sa hinaharap.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: upang kumain, uminom, at sumiping sa asawa ko
  rationale: Ang “sumiping” ay malinaw ngunit marangal na katumbas ng Hebreong eupemismo para sa pakikipagtalik sa asawa.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: Saksi ang buhay mo at ang buhay ng iyong kaluluwa
  rationale: Pinananatili nito ang dalawahang solemnidad ng pormulang panunumpa at ang tahasang pagbanggit sa נֶפֶשׁ bilang “kaluluwa,” habang nauunawaan pa rin sa Tagalog bilang taimtim na panunumpa.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: hindi ko gagawin ang bagay na ito
  rationale: Pagkatapos ng pormulang panunumpa, ang אִם ay eliptikong nagpapahayag ng mariing pagtanggi. Kailangang ilantad ang negatibo sa Tagalog upang hindi magmukhang bitin o kondisyonal ang pangungusap.
theological_decisions:
- issue: Pagpapangalan sa Kaban
  choice: ang Kaban
  alternative: ang Kaban ng Diyos / ang Kaban ng Tipan
  rationale: Hindi pinalawak ang titulo sapagkat הָאָרוֹן lamang ang nasa talata. Sa gayon ay hindi nagdaragdag ng teolohikal na katawagang wala sa mismong pangungusap.
- issue: Pagpapanatili sa “kaluluwa” sa pormulang panunumpa
  choice: ang buhay ng iyong kaluluwa
  alternative: ang mismong buhay mo
  rationale: Pinananatili ang pagkakaiba at pag-uulit sa Hebreo sa halip na ipantay agad ang נֶפֶשׁ sa “sarili” o “buhay,” kaya hindi tahimik na nilulutas ang antropolohikal na saklaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “nama’y,” “sumiping,” at “Saksi ang buhay mo” upang mapanatili ang marangal at taimtim na himig; iniwasan ang sobrang arkaiko at ang mga pagpapalawak na wala sa Hebreo. Ang mga marker ay inilagay sa mismong pariralang tinutukoy ng bawat talababa.
