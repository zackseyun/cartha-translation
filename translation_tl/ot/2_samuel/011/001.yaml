reference: 2 Samuel 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: tl
  text: Sa pag-ikot ng taon[a], sa panahong lumalabas ang mga sugo[b], isinugo ni David si Joab, kasama ang kanyang mga lingkod at ang buong Israel. Winasak nila ang mga Ammonita at kinubkob ang Rabba, ngunit nanatili si David sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagbalik/pag-ikot ng taon”; malamang na tumutukoy ito sa tagsibol, ang karaniwang panahon ng mga kampanyang militar.
    reason: cultural_note
  - marker: b
    text: O, “sa panahong lumalabas ang mga hari upang makipagdigma.” Ang ibinigay na tekstong Hebreo ay mababasang “mga sugo,” ngunit ang kontekstong militar at ang kaagapay na pahayag sa 1 Cronica 20:1 ay sumusuporta sa pagbasa na “mga hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: sa pag-ikot ng taon
  rationale: Pinananatili nito ang Hebreong idyoma ng pagbalik o pag-ikot ng taon nang hindi tuwirang pinapalitan ng mas interpretibong “sa tagsibol.” Nililinaw sa talababa ang malamang na pana-panahong tinutukoy.
- source_word: לְעֵת צֵאת הַמַּלְאֿכִים
  choice: sa panahong lumalabas ang mga hari upang makipagdigma
  rationale: Ang kontekstong militar at ang kaagapay na pahayag sa 1 Cronica 20:1 ay sumusuporta sa “mga hari,” at ipinahihiwatig ng “lumalabas” ang pagpunta sa digmaan. Gayunman, ang WLC/Masoretikong anyo ay “mga sugo,” kaya hayagang pinananatili sa talababa ang mahalagang alternatibong pagbasa.
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Karaniwan at malinaw na salin ng שלח sa salaysay; ang “isinugo” ay angkop sa pagpapadala ng mga tauhan sa isang kampanya.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Pinananatili ang malawak na kahulugan ng mga taong nasa paglilingkod ng hari nang hindi sila nililimitahan sa mga opisyal o kawal lamang.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Tuwirang pinananatili ang kolektibong pananalita ng Hebreo, na sa konteksto ay tumutukoy sa pambansang hukbong kasama sa kampanya.
- source_word: וַיַּשְׁחִתוּ
  choice: winasak
  rationale: Ipinahahayag ang mapaminsalang pagkilos ng Hiphil ng שׁחת, ngunit hindi kinakailangang magpahiwatig ng ganap na paglipol, yamang nagpapatuloy ang salaysay sa pagkubkob.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ito ang natural at karaniwang modernong Tagalog para sa etnikong tawag na literal na “mga anak ni Ammon.”
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: kinubkob ang Rabba
  rationale: Maikli at eksaktong ipinapahayag ang pagkubkob sa isang lungsod.
- source_word: יוֹשֵׁב
  choice: nanatili
  rationale: Bagaman literal na “nakaupo/nananahan,” sa pagsalungat sa paglabas ng hukbo ay natural nitong ipinahahayag na naiwan o nanatili si David sa Jerusalem.
theological_decisions:
- issue: Pagbasa sa לְעֵת צֵאת הַמַּלְאֿכִים
  choice: sa panahong lumalabas ang mga hari upang makipagdigma
  alternative: sa panahong lumalabas ang mga sugo
  rationale: Ang WLC/Masoretikong teksto sa ibinigay na anyo ay bumabasa ng “mga sugo,” ngunit ang malinaw na kontekstong militar at ang parallel sa 1 Cronica 20:1 ay malakas na sumusuporta sa tradisyonal na pagbasa na “mga hari.” Pinili ang kontekstuwal na pagbasa sa pangunahing teksto ngunit hindi itinago ang tunay na tekstuwal na tensiyon; inilagay ang Masoretikong pagbasa sa talababa.
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pag-ikot ng taon” upang mapanatili ang Hebreong idyoma, at “Rabba” bilang karaniwang anyong Tagalog ng pangalan ng lungsod. Ang pangungusap ay nagpapanatili sa mahalagang pagsalungat: lumabas ang hukbo, ngunit nanatili si David sa Jerusalem.'
