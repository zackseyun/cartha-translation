base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: tl
  text: 'Kaya nagpadala ng mensahe si David kay Joab: “Ipadala mo sa akin si Urias na Heteo.” At ipinadala ni Joab si Urias kay David.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: nagpadala ng mensahe si David kay Joab
  rationale: Ang שׁלח ay literal na ‘magpadala.’ Dahil walang tahasang layon sa unang sugnay at agad itong sinusundan ng utos, likas sa Tagalog ang ‘nagpadala ng mensahe’ at hindi nito ipinapalagay kung mensahero o ibang paraan ang ginamit.
- source_word: שְׁלַח אֵלַי
  choice: Ipadala mo sa akin
  rationale: Pinananatili nito ang tuwirang pautos ng pandiwa at ang payak na kahulugan ng אֵלַי na ‘sa akin,’ nang hindi idinaragdag ang di-tahasang diwang ‘pabalik.’
- source_word: אוּרִיָּה הַחִתִּי
  choice: Urias na Heteo
  rationale: Ginamit ang nakaugaliang anyong Tagalog na ‘Urias’ at ang tradisyonal ngunit malinaw na katawagang etniko na ‘Heteo’ para sa Hittite.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: At ipinadala ni Joab si Urias kay David
  rationale: Pinananatili ang pag-uulit ng שׁלח at ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng waw-consecutive.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ang ‘Kaya’ ay nag-uugnay sa naunang pangyayari, samantalang ang ‘At’ sa ikalawang pangungusap ay nagpapanatili ng payak na daloy ng Hebreong salaysay.
