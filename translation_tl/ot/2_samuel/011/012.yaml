base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Uria, “Manatili ka rito ngayon din, at bukas ay ipapadala kita.” Kaya nanatili si Uria sa Jerusalem noong araw na iyon at kinabukasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at nang sumunod na araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng mga pangyayari.
- source_word: שֵׁב בָּזֶה
  choice: Manatili ka ... dito
  rationale: Sa kontekstong ito, ang ישׁב ay tumutukoy sa pansamantalang pananatili sa kasalukuyang lugar, hindi lamang sa literal na pag-upo.
- source_word: גַּם הַיּוֹם
  choice: rin ... ngayon
  rationale: Pinananatili ng “rin” ang pandagdag na diwa ng גַּם at natural ang ayos sa makabagong Tagalog.
- source_word: וּמָחָר
  choice: at bukas
  rationale: Tuwirang pinananatili ang ikalawang pagtukoy sa panahon at ang pang-ugnay.
- source_word: אֲשַׁלְּחֶךָּ
  choice: paaalisin kita
  rationale: Ang piel ng שׁלח ay maaaring mangahulugang paalisin o payaunin; ang “paaalisin kita” ay malinaw at natural sa konteksto ng pagpapadala kay Uria mula sa Jerusalem nang hindi tinutukoy ang destinasyong hindi tahasang sinabi rito.
- source_word: וַיֵּשֶׁב
  choice: Kaya nanatili
  rationale: Ipinakikita ng “Kaya” ang bunga ng utos ni David, at inuulit ng “nanatili” ang angkop na kahulugan ng ישׁב.
- source_word: בִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang anyo sa Tagalog para sa pang-ukol at pangalan ng lugar.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na panandang pamanahon sa Tagalog na tapat sa Hebreong parirala.
- source_word: וּמִמָּחֳרָת
  choice: at kinabukasan
  rationale: Malinaw at makabagong katumbas ng pagtukoy sa sumunod na araw.
