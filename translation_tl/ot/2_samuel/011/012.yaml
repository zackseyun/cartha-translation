  register: Makabago, malinaw, at marangal na Tagalog; pinanatili ang maikling daloy ng salaysay at iniwasang idagdag na pinauwi o ibinalik si Uria sa isang tiyak na lugar, sapagkat hindi iyon tahasang nakasaad sa talata.
