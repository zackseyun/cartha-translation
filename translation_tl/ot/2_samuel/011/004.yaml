base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: tl
  text: Nagpadala si David ng mga mensahero at kinuha siya. Pumunta siya kay David, at sumiping si David sa kanya. Siya noon ay nagdadalisay mula sa kanyang ritwal na karumihan.[a] Pagkatapos, bumalik siya sa kanyang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nakadalisay na siya mula sa kanyang ritwal na karumihan.” Maaaring unawain ang Hebreo bilang pangkaligirang pahayag tungkol sa ritwal na paglilinis matapos ang pagreregla.'
    reason: Pinananatili ang posibleng pagbasa sa participial na sugnay bilang naganap nang paglilinis, habang ipinapaliwanag ang ritwal na konteksto nang hindi nagdaragdag ng paghatol sa tauhan.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Karaniwang salaysay na katumbas ng שלח; malinaw at natural para sa pagpapadala ng mga mensahero.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Pinananatili ang konkretong kahulugan nang hindi ipinapalagay ang tiyak nilang katungkulan.
- source_word: וַיִּקָּחֶהָ
  choice: kinuha siya
  rationale: Malapit sa tahasang kahulugan ng לקח at pinananatili ang maigsi at mabigat na paglalarawan ng pagkilos ni David; hindi ito pinalalambot bilang simpleng pag-anyaya.
- source_word: וַתָּבֹוא אֵלָיו
  choice: dumating siya sa kinaroroonan ni David
  rationale: Likas sa modernong Tagalog at malinaw ang tinutukoy ng panghalip, habang pinananatili ang payak na kilos ng paglapit sa kanya.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: sinipingan siya ni David
  rationale: Dignidad at pampanitikang antas ang katumbas ng Hebreong idyoma para sa pakikipagtalik, at malinaw na si David ang simuno.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: noon ay nililinis niya ang kanyang sarili mula sa kanyang ritwal na karumihan
  rationale: Ang hitpael ng קדשׁ dito ay tumutukoy sa ritwal na paglilinis, hindi sa moral na pagpapakabanal. Ipinakikita ng “noon” at aspektong nagpapatuloy ang katangiang pangkaligiran ng sugnay.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: pagkatapos ay bumalik siya sa kanyang bahay
  rationale: Natural na pagpapatuloy ng salaysay at malapit sa literal na “bumalik sa kanyang bahay.”
theological_decisions:
- issue: Gampanin at panahon ng sugnay tungkol sa ritwal na paglilinis
  choice: 'Isinalin bilang pangkaligirang pahayag na nagpapatuloy: “Noon ay nililinis niya ang kanyang sarili mula sa kanyang ritwal na karumihan.”'
  alternative: “Nakapaglinis na siya ng kanyang sarili mula sa kanyang ritwal na karumihan.”
  rationale: Ang Hebreong participle ay maaaring maglarawan ng kasalukuyan o pangkaligirang kalagayan, ngunit maaari ring unawain sa konteksto bilang paglilinis na natapos na. Pinananatili ng pangunahing salin ang anyong participial at ng talababa ang tunay na alternatibo, nang hindi humahatol tungkol sa pananagutan o kawalang-sala ni Batseba.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “sinipingan” upang mapanatili ang pampanitikang idyoma ng Hebreo, at ang “ritwal na karumihan” upang maiwasang mapagkamalang moral na karumihan ang tinutukoy.
