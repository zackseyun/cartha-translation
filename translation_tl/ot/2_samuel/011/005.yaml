  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: tl
  text: Nagdalang-tao ang babae[a]. Nagpasabi siya kay David[b], “Buntis ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Naglihi ang babae.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “nagpadala siya at nagsabi kay David”; ipinahihiwatig ng diwa na nagpadala siya ng balita kay David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: nagdalang-tao
  rationale: Ang pandiwang mula sa הרה ay tumutukoy sa paglilihi o pagiging buntis. Likas at marangal sa modernong Filipino ang “nagdalang-tao,” at naipapakita nito ang pagsisimula ng kalagayan nang hindi nagpapahiwatig ng hindi tahasang binanggit na gumagawa.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה ayon sa konteksto. Dito, “ang babae” ang tuwirang katumbas at hindi nito idinaragdag sa sugnay ang relasyong mag-asawa na hindi tahasang inuuna ng Hebreo.
- source_word: וַתִּשְׁלַח וַתַּגֵּד
  choice: nagpasabi
  rationale: Magkasunod na sinasabi ng Hebreo na siya ay “nagpadala” at “nagsabi.” Likas na ipinahahayag sa Filipino ng “nagpasabi” ang pagpapadala ng balita sa pamamagitan ng iba, nang hindi na kailangang magdagdag sa pangunahing teksto ng tahasang “mensahero” o “mensahe.”
- source_word: לְדָוִד
  choice: kay David
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalang David, kasama ang panandang “kay” para sa taong pinadalhan ng balita.
- source_word: הָרָה אָנֹכִי
  choice: Buntis ako
  rationale: Ang pang-uri na הָרָה kasama ng panghalip na אָנֹכִי ay nagsasaad ng kasalukuyang kalagayan. “Buntis ako” ang pinakanatural at tuwirang pahayag sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, natural, at marangal. Pinanatili ang “ang babae” sa halip na “ang asawa,” at ginamit ang maikling pahayag na “Buntis ako” upang tularan ang diin at pagiging tuwiran ng Hebreo.
