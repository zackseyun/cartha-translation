base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: tl
  text: Pagsapit ng gabi[a], bumangon si David mula sa kanyang higaan at naglakad-lakad sa bubong ng bahay ng hari.[b] Mula sa bubong, nakita niya ang isang babaeng naliligo.[c] Napakaganda ng anyo ng babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At nangyari, sa oras ng gabi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “bahay ng hari”; maaari ring isaling “palasyo.”'
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, ang “mula sa bubong” ay kasunod ng “naliligo”; karaniwang inuunawa itong lokasyon ni David, ngunit maaari rin itong iugnay sa lokasyon ng babae.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Pagsapit ng gabi
  rationale: Likas na panandang temporal at pasalaysay sa modernong Tagalog; pinananatili nito ang paglipat ng tagpo nang hindi ginagaya ang alanganing literal na Hebreong pormula.
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Tuwirang katumbas ng pagkilos mula sa pagkakahiga at natural sa konteksto.
- source_word: מֵעַל מִשְׁכָּבוֹ
  choice: mula sa kanyang higaan
  rationale: Ang מִשְׁכָּב ay maaaring tumukoy sa higaan o lugar na hinihigaan; ang “higaan” ay natural at hindi labis na tiyak.
- source_word: וַיִּתְהַלֵּךְ
  choice: naglakad-lakad
  rationale: Naipahahayag ng inuulit na anyo ang duratibo o paikot-ikot na pagkilos na maaaring ipahiwatig ng hitpael, nang hindi ipinapalagay na basta namamasyal lamang siya.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: sa bubong ng bahay ng hari
  rationale: Malapit sa literal na Hebreo at malinaw sa Tagalog; inilalagay sa talababa ang mas kontekstuwal na “palasyo.”
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: nakita niya ang isang babaeng naliligo
  rationale: Ang “naliligo” ay natural na nagsasaad ng nagpapatuloy na kilos ng participle רֹחֶצֶת.
- source_word: מֵעַל הַגָּג
  choice: Mula sa bubong
  rationale: Pinakamalamang na inilalarawan nito ang kinalalagyan ni David nang makita niya ang babae; pinananatili sa talababa ang posibleng kaugnayan nito sa lugar ng pagligo.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: Napakaganda ng anyo
  rationale: Pinananatili ang tahasang diin sa nakikitang anyo sa halip na paikliin lamang bilang “napakaganda.”
theological_decisions:
- issue: Kung kaninong lokasyon ang inilalarawan ng מֵעַל הַגָּג
  choice: 'Ang parirala ay inilapat sa kinalalagyan ni David: “Mula sa bubong, nakita niya...”'
  alternative: Maaaring iugnay ang parirala sa babaeng naliligo, anupat siya ang nasa bubong.
  rationale: Mas natural sa daloy at konteksto na ito ang pinagmulan ng pagtanaw ni David, ngunit dahil kasunod sa “naliligo” ang parirala sa Hebreo, hindi lubusang inaalis ang alternatibong pagbasa.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “naglakad-lakad” upang maipakita ang patuloy o paulit-ulit na kilos, “higaan” sa halip na mas kolokyal na “kama,” at “bahay ng hari” upang manatiling malapit sa Hebreo habang inilalagay sa talababa ang “palasyo.”
