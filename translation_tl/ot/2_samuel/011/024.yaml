base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: tl
  text: Pinana ng mga mamamana ang mga lingkod mo mula sa ibabaw ng pader, at namatay ang ilan sa mga lingkod ng hari[a]; namatay din ang lingkod mong si Uria na Heteo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at namatay mula sa mga lingkod ng hari”; ang pang-ukol ay maaaring unawain sa diwang “ilan sa.”
    reason: lexical_alternative
  - marker: b
    text: O “ay patay na,” ayon sa anyong nagsasaad ng kalagayan sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ / הַמּוֹרִים
  choice: Pinana ng mga mamamana
  rationale: Ipinahahayag nito sa natural na Filipino ang kilos ng mga tagapana, habang pinananatili ang tahasang pagtukoy sa mga mamamana.
- source_word: אֶל עֲבָדֶיךָ
  choice: ang mga lingkod mo
  rationale: Ang אֶל kasunod ng pandiwa ng pagpana ay nagsasaad ng pinatutungkulan ng pag-atake. Pinananatili ng “mga lingkod mo” ang magalang na wikang ginagamit sa harapan ng hari.
- source_word: מֵעַל הַחוֹמָה
  choice: mula sa ibabaw ng pader
  rationale: Malinaw nitong ipinapakita na mula sa mataas na puwesto sa pader nanggaling ang pagpana.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: at namatay ang ilan sa mga lingkod ng hari
  rationale: 'Inuunawa ang מִן bilang partitive: hindi lahat kundi ilan sa mga lingkod ng hari ang namatay.'
- source_word: וְגַם
  choice: din
  rationale: Natural na ipinahahayag ng “din” ang pandagdag at mariing ulat tungkol sa pagkamatay ni Uria.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: ang lingkod mong si Uria na Heteo
  rationale: Pinananatili ang magalang na pagtukoy na “lingkod mo” at ginagamit ang karaniwang anyong Filipino ng pangalan at katawagang etniko.
- source_word: מֵת
  choice: namatay
  rationale: Bagaman maaari itong tumukoy sa kalagayang “patay na,” ang “namatay” ay mas likas sa daloy ng salaysay at kaayon ng naunang ulat ng pagkamatay.
theological_decisions: []
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang wikang panghukuman na “lingkod” sa halip na gawing simpleng “tauhan,” at iniwasan ang “binaril,” na maaaring magpahiwatig ng baril sa modernong gamit.
