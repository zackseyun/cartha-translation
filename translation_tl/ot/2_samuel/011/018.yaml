  - severity: low
    issue: Bahagyang di-idiomatiko ang “lahat ng balita.”
    rationale: Bagaman posible, mas karaniwang sabihin ang “lahat ng detalye” kapag ang tinutukoy ay ang buong ulat ng isang pangyayari.
