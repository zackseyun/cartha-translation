  source_fidelity: 'Tumpak na kinikilala ng draft ang dalawang pandiwang Hebreo: nagpadala si Joab at ipinabatid/iniulat ang ulat kay David. Gayunman, ang kasalukuyang magkasunod na “nagpadala ng mensahe si Joab at iniulat kay David” ay maaaring magpahiwatig na si Joab mismo ang nag-ulat kay David matapos niyang magpadala ng mensahe. Ang pangungusap ay maaaring gawing mas malinaw na ang ipinadalang mensahe ang naghatid ng ulat, nang hindi nagdaragdag ng di-tiyak na bagay gaya ng “sugo.”'
  naturalness: Mas natural at malinaw sa modernong Filipino ang “nagpadala ... kay David upang iulat ...” kaysa sa dalawang magkasunod na pandiwa na parehong si Joab ang hayag na paksa. Ang “lahat ng balita tungkol sa labanan” ay nauunawaan, ngunit “lahat ng detalye ng labanan” ay mas idiomatiko para sa kabuuan ng ulat at mas malapit sa דִּבְרֵי sa kontekstong ito.
  terminology: Ang mga pangalang Joab at David ay tama. Ang “labanan” ay angkop para sa הַמִּלְחָמָה sa agarang konteksto. Pinananatili ng talababa ang literal na “mga salita” at ang alternatibong “mga pangyayari,” kaya maayos na naipaaalam ang saklaw ng Hebreo.
