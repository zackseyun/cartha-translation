  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: tl
  text: Pagkatapos, nagpadala si Joab ng mensahe kay David upang iulat ang lahat ng detalye ng labanan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng mga pangyayari sa labanan.” Literal sa Hebreo, “lahat ng mga salita ng labanan,” isang idyoma para sa mga detalye o ulat tungkol sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala ng mensahe
  rationale: Ang שׁלח ay literal na “nagpadala.” Kasama ng kasunod na pandiwang “iniulat,” likas sa Filipino ang “nagpadala ng mensahe” upang ipahiwatig na isang ulat ang ipinadala, hindi lamang isang tao o bagay.
- source_word: יוֹאָב
  choice: Joab
  rationale: Karaniwang anyo ng pangalan sa Filipino.
- source_word: וַיַּגֵּד
  choice: iniulat
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi, magpahayag, o mag-ulat. Ang “iniulat” ay angkop sa konteksto ng balitang militar.
- source_word: לְדָוִד
  choice: kay David
  rationale: Ang pang-ukol na לְ ay likas na isinalin na “kay” bago ang pangalan ng taong pinagsabihan.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: ang lahat ng balita tungkol sa labanan
  rationale: Literal na “lahat ng mga salita/usapin ng labanan,” ngunit sa kontekstong pasalaysay ay tumutukoy ito sa buong ulat o mga detalye ng naganap. Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: הַמִּלְחָמָה
  choice: labanan
  rationale: Bagaman maaari ring mangahulugang “digmaan,” isang tiyak na sagupaang militar ang tinutukoy sa agarang konteksto, kaya mas eksakto ang “labanan.”
