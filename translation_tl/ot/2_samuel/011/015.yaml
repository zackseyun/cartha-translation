base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: tl
  text: Isinulat niya sa liham, “Ilagay ninyo si Uria sa unahan ng pinakamatinding labanan. Pagkatapos, umurong kayo mula sa likuran niya upang siya ay matamaan at mamatay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Isinulat niya
  rationale: Ang wayyiqtol ay nagsasaad ng kasunod na pangyayari sa salaysay; natural sa modernong Tagalog ang payak na aspektong kontemplatibo rito nang hindi isinasalin ang panimulang pang-ugnay.
- source_word: בַּסֵּפֶר
  choice: sa liham
  rationale: Bagaman maaaring tumukoy ang סֵפֶר sa aklat o dokumento, malinaw sa konteksto na ito ang sulat na ipinadala kay Joab.
- source_word: לֵאמֹר
  choice: direktang panipi
  rationale: Ang quotative infinitive ay natural na naipahahayag sa Tagalog sa pamamagitan ng bantas at tuwirang sipi; hindi kailangan ang mabigat na “na sinasabi.”
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: Ilagay ninyo si Uria
  rationale: Ang maramihang pautos ay pinanatili sa “ninyo,” at ang personal na pangalan ay ginawang Uria ayon sa karaniwang anyong Tagalog.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: sa unahan, kung saan pinakamainit ang labanan
  rationale: Ipinapahayag nito ang lantad na puwesto sa harap at ang tindi ng sagupaan sa natural na wikang militar; ang “pinakamainit ang labanan” ay idyomatikong katumbas ng matinding labanan.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: Pagkatapos, umurong kayo mula sa likuran niya
  rationale: Pinananatili ng “umurong” ang taktikal na pag-atras at ng “mula sa likuran niya” ang sadyang pag-iwan sa kaniya na walang suporta.
- source_word: וְנִכָּה וָמֵת
  choice: upang siya ay matamaan at mamatay
  rationale: Pinananatiling magkahiwalay ang pagkakatama at pagkamatay, gaya ng dalawang pandiwa sa Hebreo, at malinaw ang layuning nakamamatay nang hindi pinagsasanib ang mga ito.
