translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Pinanatili ang malamig at tahasang utos ng liham, pati ang maramihang pautos. Walang footnote dahil ang idyomatikong “kung saan pinakamainit ang labanan” ay sapat na kumakatawan sa parirala at hindi nag-iiwan ng mahalagang teolohikal o tekstuwal na kalabuan.
