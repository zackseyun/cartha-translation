  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: tl
  text: Habang minamatyagan ni Joab ang lungsod, inilagay niya si Urias sa lugar na alam niyang naroon ang malalakas na mandirigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magigiting na mandirigma” o “mahuhusay na mandirigma.” Ang pariralang Hebreo na אַנְשֵׁי חַיִל ay tumutukoy rito sa mga mandirigmang may kakayahan at mahirap labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר
  choice: habang minamatyagan
  rationale: Ang בְּ na may infinitive construct ay bumubuo ng temporal na sugnay. Sa konteksto ng pagkubkob, ang שׁמר ay tumutukoy sa pagmamanman o maingat na pagmamasid sa lungsod.
- source_word: אֶל הָעִיר
  choice: ang lungsod
  rationale: Ang lungsod ang pinagtutuunan ng pagmamanman. Likas sa Filipino na tuwirang gawin itong layon ng pandiwa nang hindi isinasalin nang hiwalay ang אֶל.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: inilagay niya si Urias
  rationale: Literal na nangangahulugang ‘ibinigay/ilagay’ ang נתן. Dito ay sinadya ni Joab ang taktikal na paglalagay kay Urias; malinaw at natural ang ‘inilagay’ nang hindi nagdaragdag ng di-tahasang ranggo o atas.
- source_word: הַמָּקוֹם
  choice: lugar
  rationale: Tuwirang katumbas ito ng מָקוֹם at ang konteksto ang nagpapakitang isang taktikal na puwesto ang tinutukoy.
- source_word: יָדַע
  choice: alam niya
  rationale: Pinananatili nito ang karaniwang diwa ng ידע na ‘malaman’ at hindi ipinapaliwanag kung paano nalaman ni Joab.
- source_word: אַנְשֵׁי חַיִל
  choice: magigiting na mandirigma
  rationale: Sa kontekstong militar, tumutukoy ang parirala sa malalakas, may kakayahan, o mabibigat na kalabang mandirigma. Ipinahahayag ng ‘magigiting na mandirigma’ ang martial na diwa nang hindi ipinapalagay na sila ang natatanging pangkat ng mga tauhan ni David.
- source_word: שָׁם
  choice: naroon
  rationale: Tahasang pinananatili ng ‘naroon’ ang lokatibong kahulugan ng שָׁם at natural itong nakakabit sa sugnay na ‘alam niyang naroon.’
- source_word: וַיְהִי
  choice: Kaya habang
  rationale: Ipinahahayag ng ‘Kaya’ ang pagpapatuloy ng salaysay, samantalang ang ‘habang’ ay natural na naghahatid sa temporal na sugnay na sumusunod.
