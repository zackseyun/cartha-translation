base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: tl
  text: Lumabas ang mga lalaki ng lungsod at nakipaglaban laban kay Joab. Ilan sa mga tauhan ni David[a] ang nabuwal, at namatay din si Urias na Heteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa mga tao, mula sa mga lingkod ni David,” isang paraan ng pagsasabing ilan sa mga tauhan ni David ang nabuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas
  rationale: Ang יָצָא ay nangangahulugang lumabas. Hindi kailangang tukuyin sa Tagalog kung ‘pumarito’ o ‘pumaroon,’ kaya napapanatili ang pananaw na hindi tiyak sa Hebreo.
- source_word: אַנְשֵׁי הָעִיר
  choice: ang mga lalaki ng lungsod
  rationale: Tuwirang inilalarawan ng parirala ang mga lalaking tagapagtanggol o mandirigma mula sa lungsod.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: nakipaglaban kay Joab
  rationale: Likas na pariralang Tagalog para sa pakikipagsagupaan; malinaw sa konteksto na kalaban nila si Joab at ang kaniyang hukbo.
- source_word: וַיִּפֹּל
  choice: Nabuwal
  rationale: Pinananatili ang idyomang pangdigma ng Hebreo para sa mga nasawi sa labanan, sa halip na tahasang gawing ‘napatay.’
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: ang ilan sa mga tauhan ni David
  rationale: 'Ang dalawang pariralang may מִן ay partitive: may ilan mula sa mga taong naglilingkod kay David ang nabuwal. Ang ‘mga tauhan’ ay natural sa kontekstong militar at saklaw ang diwa ng mga lingkod o tauhan ng hari.'
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: at namatay din si Urias na Heteo
  rationale: Ipinahahayag ng גַּם na kabilang din si Urias sa mga namatay. Ginamit ang nakagawiang anyong Tagalog na ‘Urias’ at ‘Heteo.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang ‘nabuwal’ para sa pagkamatay sa labanan, habang ginawang natural ang partitive na pahayag ng Hebreo.
