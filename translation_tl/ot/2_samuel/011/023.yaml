  source_fidelity: Tumpak sa kabuuan ang mensahero, ang lakas/pangingibabaw ng mga kalaban, ang paglabas nila upang makipaglaban sa bukás na lugar, at ang paghabol o pagtulak sa kanila hanggang sa pasukan ng tarangkahan. Ang panghuling pandiwang militar ay isang idyoma; ang “itinaboy” ay isang makatwirang kontekstuwal na salin at ipinaliliwanag ng talababa.
  naturalness: Kailangan ang “kaysa sa amin” upang malinaw at pamantayan ang paghahambing sa modernong Filipino. Mas natural din ang “upang labanan kami” kaysa “laban sa amin” kasunod ng “lumabas sila.”
  terminology: Ang “mensahero” ay tama para sa taong tagapaghatid ng ulat. Pinanatili ang “mga lalaki,” na malapit sa payak na Hebreong termino, at ang “pintuang-bayan” para sa tarangkahan ng lungsod.
