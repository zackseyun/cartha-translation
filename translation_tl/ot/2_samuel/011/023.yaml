base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: tl
  text: Sinabi ng mensahero kay David, “Mas malakas kaysa sa amin ang mga lalaki[a], at lumabas sila upang labanan kami sa parang. Ngunit itinaboy namin sila hanggang sa pasukan ng pintuang-bayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nanaig sa amin ang mga lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mensahero
  rationale: Sa kontekstong militar, tumutukoy ito sa isang taong naghatid ng ulat, hindi sa isang anghel.
- source_word: כִּי
  choice: ipinahihiwatig sa tuwirang sipi
  rationale: Ipinakikilala nito ang nilalaman ng ulat; hindi na kailangan ng hiwalay na katumbas sa natural na Tagalog.
- source_word: גָבְרוּ עָלֵינוּ
  choice: Mas malakas sa amin
  rationale: Pinananatili nito ang paghahambing na ipinahihiwatig ng גבר na may עַל, habang natural ang anyo sa Tagalog.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Malapit ito sa payak na salitang Hebreo. Malinaw sa konteksto na ang tinutukoy ay mga lalaking mandirigma ng kaaway.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: lumabas sila laban sa amin sa parang
  rationale: Ipinahahayag ng “laban sa amin” ang mapanlabang kilos sa kontekstong militar, at ang “parang” ay natural na tawag sa lantad na lugar sa labas ng lungsod.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: naitaboy namin sila pabalik
  rationale: Ang literal na “nasa ibabaw/laban sa kanila kami” ay isang idyomang militar para sa paglusob o pagtulak sa kaaway; nililinaw ng kasunod na hangganang “hanggang sa” na naitaboy sila pabalik.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: hanggang sa pasukan ng pintuang-bayan
  rationale: Pinananatili nito ang pagkakaiba ng “pasukan” at “pintuang-bayan” at malinaw na itinatakda ang dulo ng pagtugis.
