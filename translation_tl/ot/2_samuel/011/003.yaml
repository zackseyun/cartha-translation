base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: tl
  text: Kaya nagsugo si David upang magtanong tungkol sa babaeng iyon. May nagsabi, “Hindi ba siya si Batseba, na anak ni Eliam at asawa ni Urias na Heteo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד וַיִּדְרֹשׁ
  choice: nagsugo si David upang magtanong
  rationale: Pinananatili ang dalawang kilos—ang pagsusugo at ang pagtatanong—habang likas sa modernong Filipino ang pagkakaugnay ng mga ito.
- source_word: לָאִשָּׁה
  choice: tungkol sa babae
  rationale: Tuwirang ipinapahayag ang paksa ng pagtatanong nang hindi nagdaragdag ng motibo.
- source_word: וַיֹּאמֶר
  choice: May nagsabi
  rationale: Ang pandiwa ay panlalaking isahan ngunit walang tahasang simuno; iniiwasang ipalagay na si David ang nagsalita.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Karaniwang anyo ng pangalang Bathsheba sa saling Filipino.
- source_word: הַחִתִּי
  choice: na Heteo
  rationale: Ginagamit ang nakaugaliang katawagang Filipino para sa Hittite bilang pagkakakilanlang etniko ni Urias.
theological_decisions:
- issue: Pagkakakilanlan ng nagsalita sa sagot
  choice: 'Hindi tinukoy: “May nagsabi”'
  alternative: “Sinabi niya” o “sinabi nila”
  rationale: Hindi malinaw sa tekstong Hebreo kung sino ang nagsalita; pinananatili ng salin ang kawalang-tiyak at hindi iniuugnay ang pananalita kay David.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Hindi ba siya” bilang natural na tanong na umaasang kikilalanin ang babae, at pinanatili ang magkakasunod na pagkakakilanlan sa kaniya bilang anak ni Eliam at asawa ni Urias.
