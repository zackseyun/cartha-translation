base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: tl
  text: May mga nag-ulat kay David, “Hindi bumaba si Urias sa bahay niya.”[a] Kaya sinabi ni David kay Urias, “Hindi ba’t galing ka sa paglalakbay? Bakit hindi ka bumaba sa bahay mo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bumaba sa bahay” ay literal na pananalita sa Hebreo para sa pag-uwi, marahil mula sa mas mataas na lugar o sa bakuran ng palasyo patungo sa sariling tirahan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: May nagbalita kay David
  rationale: Ang Hiphil ng נגד ay ‘magbalita’ o ‘magsabi.’ Natural sa Tagalog ang di-tiyak na ‘may nagbalita’ dahil walang tahasang simuno sa Hebreo; hindi kailangang panatilihin nang literal ang לֵאמֹר bago ang tuwirang sipi.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Hindi bumaba si Urias sa bahay niya
  rationale: Pinananatili ang literal na ‘bumaba’ at ang kongkretong ‘bahay’ upang mapanatili ang pag-uulit at tensiyon ng salaysay, sa halip na gawing simpleng ‘umuwi.’
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi
  rationale: Ipinahihiwatig ng ‘kaya’ ang pagsulong at kaugnayang bunga sa salaysay, habang natural sa modernong Tagalog ang ‘sinabi.’
- source_word: הֲלוֹא מִדֶּרֶךְ אַתָּה בָא
  choice: Hindi ba’t kagagaling mo lang sa paglalakbay?
  rationale: Ang הֲלוֹא ay retorikal na tanong na umaasang sasang-ayon ang kausap. Ang מִדֶּרֶךְ ay idiomatikong tumutukoy sa paglalakbay; ang ‘kagagaling’ ay malinaw na nagpapahayag ng pagdating mula rito. Ang ‘lang’ ay likas na diin sa Tagalog para sa kagyat na konteksto, nang hindi ginagawang ‘bumalik’ ang simpleng בוא.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: Bakit hindi ka bumaba sa bahay mo?
  rationale: Pinananatili ang parehong pandiwa at larawan ng naunang pangungusap, gayundin ang tuwirang tanong ng dahilan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang Hebreong pag-uulit ng ‘bumaba sa bahay’ dahil mahalaga ito sa daloy at tensiyon ng salaysay; ipinaliwanag ang idyoma sa talababa. Ginamit ang karaniwang anyong Tagalog na ‘Urias.’
