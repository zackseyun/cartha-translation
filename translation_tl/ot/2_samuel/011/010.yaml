- from: May nagbalita kay David, “Hindi bumaba si Urias sa bahay niya.” Kaya sinabi ni David kay Urias, “Hindi ba’t kagagaling mo lang sa paglalakbay? Bakit hindi ka bumaba sa bahay mo?”[a]
  to: May mga nag-ulat kay David, “Hindi bumaba si Urias sa bahay niya.”[a] Kaya sinabi ni David kay Urias, “Hindi ba’t galing ka sa paglalakbay? Bakit hindi ka bumaba sa bahay mo?”[a]
