translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kalagayan” at “takbo ng digmaan” upang maging natural sa karaniwang mambabasa, habang inilalahad sa talababa ang mas pormal na pag-uulit sa Hebreo.
