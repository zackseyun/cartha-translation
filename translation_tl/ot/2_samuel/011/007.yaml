base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: tl
  text: Nang dumating si Uria sa kaniya, nagtanong si David tungkol sa kalagayan ni Joab, sa kalagayan ng mga kawal, at sa takbo ng digmaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “tungkol sa kapakanan ni Joab, sa kapakanan ng mga kawal, at sa kapakanan ng digmaan.” Tatlong beses inuulit sa Hebreo ang salitang tumutukoy sa kapakanan o kalagayan.'
    reason: Pinananatili sa talababa ang paralelismo at pag-uulit ng לִשְׁלוֹם, na mas natural ipahayag nang bahagyang naiiba sa pangunahing tekstong Filipino.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang בוא ay maaaring mangahulugang “pumarito,” “pumasok,” o “dumating.” Sa tagpong ito, natural na ipinahihiwatig ng “dumating” ang paglapit ni Uria kay David.
- source_word: אֵלָיו
  choice: sa kaniya
  rationale: Tuwirang ipinahihiwatig ng אֶל na may hulaping panghalip ang paglapit kay David; pinananatili ng “sa kaniya” ang payak na ugnayang ito.
- source_word: וַיִּשְׁאַל דָּוִד
  choice: tinanong siya ni David
  rationale: Ang שׁאל ay nagpapakilala sa pagtatanong ni David. Idinagdag ang di-tahasang layon na “siya” ayon sa natural na balarila ng Filipino, na malinaw na tumutukoy kay Uria.
- source_word: לִשְׁלוֹם
  choice: tungkol sa kalagayan / sa takbo
  rationale: Sa konstruksyong ito, ang שָׁלוֹם ay tumutukoy sa kapakanan o kalagayan. “Kalagayan” ang natural para kina Joab at sa mga kawal, samantalang “takbo” ang idiomatikong katumbas kapag digmaan ang tinutukoy. Ipinaliliwanag sa talababa ang tatlong magkakatulad na parirala sa Hebreo.
- source_word: יוֹאָב
  choice: Joab
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong Bibliyang Filipino.
- source_word: הָעָם
  choice: mga kawal
  rationale: Bagaman karaniwang nangangahulugang “bayan” o “mga tao” ang עָם, ang kontekstong militar ay tumutukoy sa hukbong kasama ni Joab. Malinaw at natural dito ang “mga kawal.”
- source_word: הַמִּלְחָמָה
  choice: digmaan
  rationale: Ang מִלְחָמָה ay maaaring tumukoy sa labanan o digmaan. Ang “digmaan” ay angkop sa mas malawak na kampanyang militar sa konteksto.
