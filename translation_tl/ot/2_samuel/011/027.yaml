base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: tl
  text: Nang matapos ang pagluluksa, nagpadala si David at ipinasundo ang babae sa kanyang bahay. Naging asawa ni David ang babae at nagsilang siya ng isang anak na lalaki para kay David. Ngunit masama sa paningin ni Yahweh ang ginawa ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi kalugod-lugod sa paningin ni Yahweh.” Mas literal sa Hebreo ang “masama sa paningin ni Yahweh,” na nagpapahayag ng moral na hatol niya sa ginawa ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵבֶל
  choice: ang pagluluksa
  rationale: Tumutukoy ito sa panahon at gawaing panlipunan ng pagluluksa pagkamatay ni Uria, hindi lamang sa panloob na dalamhati.
- source_word: וַיַּעֲבֹר
  choice: nang matapos
  rationale: Bagaman literal na ‘lumipas,’ ang ‘nang matapos’ ang likas na Tagalog para sa pagtatapos ng panahon ng pagluluksa at malinaw na nag-uugnay sa sumunod na pangyayari.
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: nagpadala si David para kunin siya at dalhin sa kanyang bahay
  rationale: Pinananatili ang dalawang kilos—ang pagpapadala ni David at ang pagkuha o pagpasok sa babae sa kanyang sambahayan—nang hindi ginagamit ang artipisyal na literal na ‘tipunin.’
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: naging asawa niya siya
  rationale: 'Ipinahihiwatig ng Hebreong konstruksiyon ang pagbabago ng katayuan: naging asawa ni David ang babae.'
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: nagsilang siya ng isang anak na lalaki para kay David
  rationale: Malinaw na ipinapahayag ang pagsilang at ang di-tuwirang layon na tumutukoy kay David.
- source_word: וַיֵּרַע
  choice: masama
  rationale: Pinananatili ang tahasang moral na hatol ng Hebreo at hindi ito pinahihina bilang pansariling pagkayamot lamang.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: ang ginawa ni David
  rationale: Likas at tuwirang Tagalog ito para sa ‘ang bagay na ginawa ni David,’ nang hindi nawawala ang pagtukoy sa buong ginawa niya.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong talinghaga para sa pagsusuri at hatol ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Lakas ng moral na hatol sa ginawa ni David
  choice: masama sa paningin ni Yahweh
  alternative: hindi kalugod-lugod kay Yahweh
  rationale: Ang וַיֵּרַע ay may malinaw na moral na bigat sa kontekstong ito. Iniiwasan ng saling ‘masama’ ang pagpapalabnaw sa hatol ng tagapagsalaysay.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang banal na pangalan bilang pangalan, hindi bilang pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at ang karaniwang ‘pagluluksa,’ habang pinanatili ang Hebreong talinghagang ‘sa paningin ni Yahweh’ at ang buong lakas ng moral na paghatol.
