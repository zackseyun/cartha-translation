revisions:
- from: Nang matapos ang pagluluksa, nagpadala si David para kunin siya at dalhin sa kanyang bahay. Naging asawa niya siya at nagsilang siya ng isang anak na lalaki para kay David. Ngunit masama sa paningin ni Yahweh ang ginawa ni David.[a]
  to: Nang matapos ang pagluluksa, nagpadala si David at ipinasundo ang babae sa kanyang bahay. Naging asawa ni David ang babae at nagsilang siya ng isang anak na lalaki para kay David. Ngunit masama sa paningin ni Yahweh ang ginawa ni David.[a]
  rationale: Inayos ang mga panghalip upang maging malinaw kung sino ang naging asawa at sino ang nagsilang, at pinalitan ang “para kunin siya at dalhin” ng mas likas na “ipinasundo ... sa kanyang bahay.” Hindi binago ang kahulugan, pagkakasunod-sunod, o antas ng moral na paghatol sa pinagmulan.
