  source_fidelity: 'Tumpak na naipapahayag ng draft ang pagkakasunod-sunod ng Hebreo: matapos ang panahon ng pagluluksa, nagpadala si David upang dalhin ang babae sa kanyang sambahayan; naging asawa niya ito, nagsilang ng anak na lalaki, at hinatulan ni Yahweh na masama ang ginawa ni David. Pinananatili rin nito ang lakas ng moral na paghatol sa וַיֵּרַע at ang talinghagang בְּעֵינֵי יְהוָה.'
  naturalness: May ilang pag-uulit at kalabuan ng panghalip sa “Naging asawa niya siya” at sa sunod-sunod na “siya.” Ang rebisyon ay gumamit ng mas likas na ayos sa modernong Filipino at nilinaw ang mga reperente nang hindi nagdaragdag ng kahulugan.
  terminology: Ang “pagluluksa,” “Yahweh,” at “masama sa paningin ni Yahweh” ay angkop, marangal, at tapat sa mahahalagang terminong Hebreo. Ang “anak na lalaki” ay wastong katumbas ng בֵּן.
