  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: tl
  text: 'Sinabi ni David sa mensahero, “Ganito ang sabihin mo kay Joab: ‘Huwag mong masamain ang bagay na ito[a], sapagkat nilalamon ng tabak ang isa at ang iba[b]. Paigtingin mo ang pagsalakay mo laban sa lungsod at gibain ito.’ At palakasin mo ang loob niya[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Huwag maging masama sa iyong paningin ang bagay na ito.” Maaari ring isalin, “Huwag mong ikabahala ang bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: “sapagkat ganito at ganoon lumalamon ang tabak”; ibig sabihin, pumapatay ang tabak ng isa at ng iba.'
    reason: lexical_alternative
  - marker: c
    text: O, “At patatagin mo siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mensahero
  rationale: Sa kontekstong ito, isang taong tagapagdala ng balita ang tinutukoy, hindi isang anghel.
- source_word: כֹּה תֹאמַר
  choice: Ganito ang sabihin mo
  rationale: Natural itong pormula sa modernong Tagalog para sa mensaheng ipasasabi, habang pinananatili ang tuwirang utos.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: Huwag mong masamain
  rationale: Ipinahahayag nito nang natural ang Hebreong idyoma na literal na nagsasabing huwag maging masama ang bagay sa paningin ni Joab.
- source_word: הַדָּבָר הַזֶּה
  choice: ang nangyaring ito
  rationale: Ang דָּבָר ay tumutukoy rito sa iniulat na pangyayari; hindi nito labis na tinutukoy o ipinapaliwanag ang pagkamatay ni Uria.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: sapagkat kung sino-sino ang nilalamon ng tabak
  rationale: Inihahatid ng “kung sino-sino” ang di-tiyak at walang pinipiling bunga ng digmaan, habang pinananatili ng “nilalamon ng tabak” ang matingkad na metapora ng Hebreo.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: Paigtingin mo ang pakikipaglaban mo sa lungsod
  rationale: Natural na ipinapahayag nito ang utos na palakasin o paigtingin ang pagsalakay laban sa lungsod.
- source_word: וְהָרְסָהּ
  choice: at gibain ito
  rationale: Ang pandiwa ay nangangahulugang gibain o wasakin; ang “gibain” ay angkop sa isang lungsod na kinukubkob.
- source_word: וְחַזְּקֵהוּ
  choice: At palakasin mo ang loob niya
  rationale: Ang panlalaking isahang hulapi ay malamang na tumutukoy kay Joab. Sa konteksto, ang pagpapalakas sa kaniya ay paghikayat o pagpapatatag ng loob niya.
theological_decisions:
- issue: Kung ang huling utos ay bahagi ng mensaheng sasabihin kay Joab o hiwalay na tagubilin sa mensahero
  choice: 'Itinuring itong hiwalay na tagubilin ni David sa mensahero: “At palakasin mo ang loob niya.”'
  alternative: Isama ito sa siniping mensahe kay Joab.
  rationale: Ang hulaping panlalaking isahan sa וְחַזְּקֵהוּ ay tumutukoy nang natural kay Joab bilang taong palalakasin, kaya ang mensahero ang inuutusang palakasin ang loob niya. Pinananatili nito ang pagkakaiba ng utos na ipasasabi at ng pangwakas na tagubilin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “masamain” upang mapanatili ang moral na kulay ng Hebreong idyoma, ang “nilalamon ng tabak” upang mapanatili ang metapora, at ang “paigtingin” para sa natural na wikang militar nang hindi nagiging teknikal.
