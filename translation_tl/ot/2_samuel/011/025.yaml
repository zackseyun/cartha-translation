revisions:
- from: 'Sinabi ni David sa mensahero, “Ganito ang sabihin mo kay Joab: ‘Huwag mong masamain ang nangyaring ito[a], sapagkat kung sino-sino ang nilalamon ng tabak[b]. Paigtingin mo ang pakikipaglaban mo sa lungsod at gibain ito.’ At palakasin mo ang loob niya[c].”'
  to: 'Sinabi ni David sa mensahero, “Ganito ang sabihin mo kay Joab: ‘Huwag mong masamain ang bagay na ito[a], sapagkat nilalamon ng tabak ang isa at ang iba[b]. Paigtingin mo ang pagsalakay mo laban sa lungsod at gibain ito.’ At palakasin mo ang loob niya[c].”'
  rationale: Inayos ang panipi upang malinaw na ang pangwakas na utos ay direktang tagubilin ni David sa mensahero. Pinahusay din ang ilang parirala para sa kalinawan at likas na modernong Tagalog, nang pinananatili ang metapora, lawak ng kahulugan, at di-tiyak na katangian ng Hebreong idyoma.
