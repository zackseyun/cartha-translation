  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: tl
  text: Nang mabalitaan ng asawa ni Uria na patay na ang asawa niyang si Uria[a], ipinagluksa niya ang kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namatay na ang asawa niyang si Uria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: mabalitaan
  rationale: Karaniwang nangangahulugang “marinig” ang שׁמע, ngunit sa salaysay na tumutukoy sa pagkatanggap ng balita, mas natural sa modernong Tagalog ang “mabalitaan” nang hindi dinaragdagan ang diwa.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: asawa ni Uria
  rationale: Natural at malinaw na anyong Tagalog ng pariralang construct na tumutukoy sa asawa ni Uria.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng balitang natanggap niya.
- source_word: מֵת
  choice: patay na
  rationale: Inilalarawan ng anyo ang kalagayan ni Uria bilang patay; ang “patay na” ay natural sa Tagalog. Posible rin ang pangyayaring pagbasa na “namatay na.”
- source_word: אוּרִיָּה אִישָׁהּ
  choice: ang asawa niyang si Uria
  rationale: Pinananatili ang pangalan at ang tahasang pagkakakilanlan kay Uria bilang kanyang asawa, sa natural na ayos ng Tagalog.
- source_word: וַתִּסְפֹּד
  choice: ipinagluksa niya
  rationale: Ang ספד ay tumutukoy sa pagdadalamhati o pagluluksa para sa namatay; tumpak at marangal ang “ipinagluksa.”
- source_word: עַל
  choice: '[nakapaloob sa] ipinagluksa ... ang'
  rationale: Sa Tagalog, likas na naipapahayag ang ugnayan ng עַל sa transitive na anyong “ipinagluksa ... ang,” kaya hindi kailangan ng hiwalay na pang-ukol.
- source_word: בַּעְלָהּ
  choice: kanyang asawa
  rationale: Sa kontekstong pangmag-asawa, malinaw na “asawa” ang kahulugan ng בַּעַל; hindi kailangan ang mga kahulugang “panginoon” o “may-ari.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng pagkakakilanlan kay Uria bilang asawa, gaya ng Hebreo, at ang alternatibo sa pagitan ng kalagayang “patay na” at pangyayaring “namatay na” ay inilagay sa talababa.
