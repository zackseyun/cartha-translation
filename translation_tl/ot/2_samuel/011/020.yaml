translation_notes:
  register: Makabago at dignified na Filipino, na gumagamit ng malinaw na bokabularyong pangsalaysay. Pinanatili ang mapanumbat na tono ng inaasahang tanong ng hari at ang saklaw ng pandiwang militar nang hindi tiyak na pinangalanan ang projectile.
