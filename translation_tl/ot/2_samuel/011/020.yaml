base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: tl
  text: At kung mag-alab ang galit ng hari at sabihin niya sa iyo, “Bakit kayo lumapit nang ganoon kalapit sa lungsod upang makipaglaban? Hindi ba ninyo alam kung ano ang ihahagis nila mula sa ibabaw ng pader?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung ano ang ipapana nila mula sa pader.” Ang pandiwang Hebreo ay maaari ring tumukoy nang mas malawak sa paghagis o pagpapakawala ng mga bagay na ipinupukol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: At kung
  rationale: Ipinagpapatuloy ng וְ ang salaysay, habang malinaw na ipinakikilala ng אִם ang isang maaaring mangyaring kalagayan.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: mag-alab ang galit ng hari
  rationale: Ang חֵמָה ay matinding galit na inilalarawang parang init; natural sa Filipino ang “mag-alab ang galit” at pinananatili nito ang masiglang larawan ng Hebreo.
- source_word: וְאָמַר לְךָ
  choice: at sabihin niya sa iyo
  rationale: Sa kondisyunal na pahayag, natural ang anyong panghinaharap na “sabihin niya” para sa inaasahang tugon ng hari.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: kayo lumapit nang ganoon sa lungsod
  rationale: 'Ang נגשׁ ay “lumapit.” Idinagdag ang “nang ganoon” upang maipahiwatig ang mapanumbat na diwa: ang problema ay ang mapanganib na paglapit nila sa lungsod.'
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Tuwirang ipinahahayag ng infinitibo ang layunin ng paglapit; karaniwan at angkop sa kontekstong militar ang “makipaglaban.”
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Hindi ba ninyo alam
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: kung ano ang ihahagis nila
  rationale: Maaaring tumukoy ang Hiphil ng ירה sa pagpapakawala, paghagis, o pagpana ng mga bagay. Mas malawak at angkop dito ang “ihahagis,” lalo na dahil hindi tinutukoy ng talata ang uri ng sandata.
- source_word: מֵעַל הַחוֹמָה
  choice: mula sa ibabaw ng pader
  rationale: 'Pinananatili ng “sa ibabaw” ang spatial na diwa ng מֵעַל: ang mga projectile ay nagmumula sa itaas ng pader.'
