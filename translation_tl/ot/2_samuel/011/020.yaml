  to: At kung mag-alab ang galit ng hari at sabihin niya sa iyo, “Bakit kayo lumapit nang ganoon kalapit sa lungsod upang makipaglaban? Hindi ba ninyo alam kung ano ang ihahagis nila mula sa ibabaw ng pader?[a]”
