  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: tl
  text: Ngunit natulog si Urias sa pasukan ng bahay ng hari, kasama ng lahat ng lingkod ng kanyang panginoon, at hindi siya bumaba sa kanyang bahay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: natulog
  rationale: Ang pandiwang שׁכב ay maaaring mangahulugang humiga o matulog. Sa kontekstong ito, ipinahihiwatig na doon nagpalipas ng gabi si Urias, kaya natural at sapat ang “natulog.”
- source_word: פֶּתַח
  choice: sa pasukan
  rationale: Tumutukoy ang פֶּתַח sa bukasan, pintuan, o pasukan. Inilalarawan ng “sa pasukan” ang lokasyon nang hindi ipinapalagay na mismong dahon ng pinto ang tinutukoy.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Ito ang tuwirang katumbas ng pariralang Hebreo. Bagaman palasyo ang tinutukoy sa konteksto, pinananatili ng “bahay ng hari” ang konkretong pananalita ng pinagmulan at malinaw pa rin sa Tagalog.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: kasama ng lahat ng lingkod ng kanyang panginoon
  rationale: Ipinapahayag dito ang pakikisama o pagkalugar ni Urias sa piling ng mga lingkod. Ang “lingkod” ay angkop sa konteksto ng korte, at pinananatili ng “panginoon” ang ranggo at ugnayang panlipunan kay David.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: at hindi siya bumaba sa sarili niyang bahay
  rationale: Pinananatili ng “bumaba” ang pandiwang ירד at ang posibleng topograpikal na detalye ng salaysay. Nililinaw ng “sarili niyang bahay” ang panghalip nang hindi ginagawang mas malayang “umuwi.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “bahay ng hari” at “bumaba” sapagkat madaling maunawaan ang mga ito at mahalaga ang mga konkretong salita ng tekstong Hebreo. Hindi na kailangan ang mga talababa dahil walang alternatibong pagbasa rito na kailangang ilantad para sa talatang ito.
