  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang utos na “bumaba,” ang kongkretong “hugasan ... mga paa,” ang paglabas ni Urias mula sa bahay ng hari, at ang regalong ipinadala kasunod niya. Ang “ipinadala” ay isang natural na Tagalog na pagsasalin sa salaysay para sa regalong lumabas kasunod ni Urias at hindi nagdaragdag ng makabuluhang bagong kahulugan.'
