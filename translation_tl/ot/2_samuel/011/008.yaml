base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: tl
  text: Sinabi ni David kay Urias, “Bumaba ka sa bahay mo at hugasan mo ang iyong mga paa.”[a] Kaya lumabas si Urias mula sa bahay ng hari, at isang regalo mula sa hari ang ipinadala kasunod niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hugasan mo ang iyong mga paa” ay literal na pahayag na maaari ring magpahiwatig ng pagpapaginhawa o pananatili sa bahay matapos ang paglalakbay.
    reason: cultural_note
  - marker: b
    text: O “isang bahagi mula sa hari.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay na dinala o ipinadala, kabilang ang bahagi o regalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: Bumaba ka
  rationale: Pinananatili nito ang tuwirang diwang ‘bumaba’ ng pandiwang ירד at ang direksiyong mula sa tirahan ng hari patungo sa bahay ni Urias.
- source_word: לְבֵיתְךָ
  choice: sa bahay mo
  rationale: Tuwirang katumbas ito ng ‘sa iyong bahay’ at natural sa makabagong Tagalog.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: at hugasan mo ang iyong mga paa
  rationale: Pinananatili ang kongkretong pahayag sa Hebreo sa halip na palitan ito ng pagpapakahulugang gaya ng ‘magpahinga’ o ‘magpresko.’
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: mula sa bahay ng hari
  rationale: Malapit ito sa literal na ‘bahay ng hari’; hindi ito agad ginawang ‘palasyo,’ bagaman iyon ang malamang na tinutukoy sa konteksto.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: isang regalo mula sa hari
  rationale: Ang מַשְׂאֵת ay maaaring tumukoy sa bagay o bahaging ipinadala o dinala. Ang ‘regalo’ ang pinakanatural sa salaysay, habang inilalagay sa talababa ang lehitimong alternatibong ‘bahagi.’
- source_word: אַחֲרָיו
  choice: kasunod niya
  rationale: Natural nitong ipinahahayag na ang regalo ay ipinadala na sumusunod kay Urias.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang ‘bahay ng hari’ at ‘hugasan ang mga paa’ upang huwag mawala ang kongkretong anyo at pahiwatig ng Hebreo. Inilagay ang bawat talababa sa mismong pariralang tinatalakay nito.
