  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: tl
  text: Noong umaga, sumulat si David ng isang liham para kay Joab at ipinadala niya iyon sa pamamagitan ni Urias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas na salaysay sa modernong Tagalog para sa paglipat sa sumunod na pangyayari sa umaga; hindi na kailangang gawing tahasang “at nangyari” ang pormulang Hebreo.
- source_word: וַיִּכְתֹּב
  choice: sumulat
  rationale: Karaniwan at tuwirang katumbas ng pandiwa sa konteksto ng paggawa ng liham.
- source_word: סֵפֶר
  choice: isang liham
  rationale: Bagaman maaari itong tumukoy sa isang kasulatan o dokumento, malinaw sa konteksto na isang liham para kay Joab ang isinulat at ipinadala.
- source_word: אֶל יוֹאָב
  choice: para kay Joab
  rationale: Natural na Tagalog para tukuyin ang pinag-ukulan o tatanggap ng liham.
- source_word: וַיִּשְׁלַח
  choice: ipinadala niya iyon
  rationale: Ang panghalip na “iyon” ay likas na tumutukoy pabalik sa liham at nagbibigay ng malinaw na daloy sa Tagalog.
- source_word: בְּיַד אוּרִיָּה
  choice: sa pamamagitan ni Urias
  rationale: Ipinahahayag ang idyomang literal na “sa kamay ni Urias” bilang ahensiya o tagapagdala, habang pinananatili ang mahalagang diwa na si Urias mismo ang naghatid ng liham.
- source_word: אוּרִיָּה
  choice: Urias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
