translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Isinalin ang idyomang Hebreo ayon sa kahulugan nito sa Tagalog sa halip na panatilihin ang di-likas na literal na “sa kamay ni Urias.”
