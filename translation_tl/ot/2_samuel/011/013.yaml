translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Gumamit ng “kanyang” bilang karaniwang anyo sa modernong Filipino. Nilinaw ang simuno sa “Nilasing siya ni David” upang maiwasan ang kalituhan, ngunit pinanatili sa mga talababa ang mahahalagang literal at leksikal na alternatibo.
