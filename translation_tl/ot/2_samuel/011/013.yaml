base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: tl
  text: Ipinatawag siya ni David[a], at kumain at uminom siya sa harap niya[b]. Nilasing siya ni David. Pagsapit ng gabi, lumabas siya upang mahiga sa kanyang higaan kasama ng mga lingkod ng kanyang panginoon[c], ngunit hindi siya bumaba patungo sa kanyang bahay.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tinawag siya ni David” o “Inanyayahan siya ni David.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa harap niya,” ibig sabihin, sa presensya ni David.
    reason: lexical_alternative
  - marker: c
    text: O “kasama ng mga lingkod ng kanyang amo.” Si David ang tinutukoy na panginoon dito.
    reason: lexical_alternative
  - marker: d
    text: Literal na “hindi siya bumaba sa kanyang bahay.” Pinanatili ang “bumaba” sa halip na gawing “umuwi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: Ipinatawag siya ni David
  rationale: Ang קרא na may ל at tumutukoy sa isang tao ay maaaring mangahulugang tawagin o ipatawag. Ang “ipinatawag” ay natural sa salaysay at pinananatili ang pagkukusa at awtoridad ni David, nang hindi ipinapalagay na isa lamang itong magiliw na paanyaya.
- source_word: לְפָנָיו
  choice: sa harap nito
  rationale: Literal itong tumutukoy sa harap o presensya ni David. Ang “sa harap nito” ay maikli at pinananatili ang ugnayang ipinahihiwatig ng Hebreo; nililinaw ng talababa na si David ang tinutukoy.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: Nilasing siya ni David
  rationale: 'Ang anyong Hiphil ng שׁכר ay sanhi: si David ang naging dahilan upang malasing si Uria. Ang tahasang pagbanggit kay David ay nag-aalis ng kalituhan sa mga panghalip at pinananatili ang pananagutan niya sa kilos.'
- source_word: בָּעֶרֶב
  choice: Pagsapit ng gabi
  rationale: Natural na panandang panahunan ito sa modernong Tagalog at malinaw na inililipat ang salaysay sa sumunod na tagpo.
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: upang mahiga sa kanyang higaan
  rationale: Pinananatili ng “mahiga” ang kilos nang hindi ito pinalalawak tungo sa tiyak na pagtulog. Ang מִשְׁכָּב ay maaaring higaan o dakong tulugan; ang “higaan” ang pinakanatural dito.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: kasama ng mga lingkod ng kanyang panginoon
  rationale: Pinananatili ang ikatlong-panauhang anyo at ang titulong “panginoon.” Sa konteksto, ang panginoon ni Uria ay si David, ngunit hindi ito isiningit sa pangunahing teksto.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: ngunit hindi siya bumaba patungo sa kanyang bahay
  rationale: Pinananatili ang tahasang pandiwang ירד, “bumaba,” dahil inuulit ito sa nakapaligid na salaysay. Ang “ngunit” ay natural na nagpapahayag ng pagsalungat sa inaasahang pag-uwi, bagaman karaniwang pang-ugnay lamang ang nasa Hebreo.
