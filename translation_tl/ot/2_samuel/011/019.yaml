    issue: Hindi naisara ang panipi ng tuwirang sipi sa teksto.
    rationale: Ang talata ay nagtatapos sa bukas na panipi, kaya may depektong bantas/istruktura kahit ang Hebreong pangungusap ay sadyang nagpapatuloy sa susunod na talata.
  - severity: low
    issue: Ang talababa ay nagsasabing 'lahat ng pangyayari,' na mas makitid kaysa 'mga salita/usapin' sa Hebreo.
    rationale: Ang דִּבְרֵי ay maaaring tumukoy sa mga bagay o usaping iuulat; hindi nito nililimitahan ang nilalaman sa mga pangyayari lamang.
  revised_text: 'At inutusan niya ang mensahero: “Kapag natapos mo nang sabihin sa hari ang buong ulat tungkol sa labanan[a],”'
