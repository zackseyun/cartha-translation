  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: tl
  text: 'At inutusan niya ang mensahero: “Kapag natapos mo nang sabihin sa hari ang buong ulat tungkol sa labanan[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng usapin tungkol sa labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: At inutusan niya
  rationale: Ang צוה ay nagpapahayag ng makapangyarihang pag-uutos o pagbibigay ng tagubilin; natural at tapat dito ang “inutusan.”
- source_word: הַמַּלְאָךְ
  choice: ang mensahero
  rationale: Sa konteksto ng ulat-militar, tao ang tinutukoy ng מַלְאָךְ, hindi anghel; malinaw at karaniwan ang “mensahero.”
- source_word: לֵאמֹר
  choice: ipinahihiwatig sa pamamagitan ng tuwirang sipi
  rationale: Karaniwang pananda ito ng tuwirang pananalita sa Hebreo. Hindi na kailangang isalin nang hiwalay na “na sinasabi” sa natural na Filipino dahil sapat na ang kasunod na sipi.
- source_word: כְּכַלּוֹתְךָ
  choice: Kapag natapos mo nang
  rationale: Pinananatili nito ang temporal na ugnayan nang hindi ipinapalagay na agad-agad ang kasunod na pangyayari.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: ang buong ulat tungkol sa labanan
  rationale: Literal itong “lahat ng mga salita/usapin ng labanan,” ngunit sa konteksto ay tumutukoy sa kabuuang ulat hinggil sa labanan. Natural sa Filipino ang “buong ulat” at pinananatili ang saklaw ng כָּל.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: sabihin sa hari
  rationale: Ang infinitibong “magsalita” kasama ng “sa hari” ay tumutukoy rito sa paghahatid ng ulat; idiomatiko ang “sabihin sa hari.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inalis ang tahasang katumbas ng לֵאמֹר upang maiwasan ang di-natural na “na sinasabi,” habang nananatili ang tungkulin nito sa pagbubukas ng tuwirang pananalita.
