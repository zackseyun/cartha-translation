  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: tl
  text: Kaya umalis ang mensahero, at pagdating niya ay sinabi niya kay David ang lahat ng ipinasabi sa kanya ni Joab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang lahat ng ipinadala sa kanya ni Joab.” Ibig sabihin, iniulat ng mensahero ang lahat ng ipinadala ni Joab upang ipabatid.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ang mensahero
  rationale: Sa kontekstong ito, tumutukoy ang מַלְאָךְ sa isang taong nagdadala ng ulat-militar, hindi sa isang makalangit na anghel.
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Isinusulong ng pandiwa ang salaysay sa pag-alis ng mensahero; mas natural sa Filipino ang “umalis” kaysa literal na “pumunta” bago ang pagdating niya.
- source_word: וַיָּבֹא
  choice: pagdating niya
  rationale: Ang בוא ay nangangahulugang “dumating/pumarito.” Ginawang sugnay na “pagdating niya” upang maging likas ang daloy sa modernong Filipino habang pinananatili ang sunod-sunod na kilos.
- source_word: וַיַּגֵּד לְדָוִד
  choice: sinabi niya kay David
  rationale: Ang Hiphil ng נגד ay “magsabi, mag-ulat, magpabatid.” Ang “sinabi” ay malinaw at karaniwan sa Filipino; ipinahihiwatig ng konteksto na ito ay isang ulat.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at likas itong idugtong sa “ipinasabi.”
- source_word: שְׁלָחוֹ יוֹאָב
  choice: ipinasabi sa kanya ni Joab
  rationale: Literal na “ipinadala siya/ito ni Joab,” ngunit sa konteksto ng mensahero at ulat, ipinahihiwatig ng Hebreo ang nilalamang ipinadala upang ipahayag. Ang “ipinasabi” ay natural sa Filipino at nililinaw ang ipinahihiwatig nang hindi binabago ang diwa.
- source_word: לְדָוִד
  choice: kay David
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang David at ang panandang “kay” para sa taong pinagsabihan.
