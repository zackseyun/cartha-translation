translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na takbo ng salaysay, ngunit iniwasan ang alanganing literal na pag-uulit na “umalis at dumating” sa pamamagitan ng “umalis … at pagdating niya.”
