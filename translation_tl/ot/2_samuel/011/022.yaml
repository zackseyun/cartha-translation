  source_fidelity: 'Tapat ang talata sa Hebreo: naipapahayag ang magkakasunod na kilos ng mensahero—umalis, dumating, at nagsabi kay David—at ang kabuuan ng mensaheng ipinagbilin ni Joab. Ang “ipinasabi sa kanya ni Joab” ay isang makatwirang kontekstuwal na paglilinaw ng elliptic na “isinugo/ipinadala [sa kanya] ni Joab,” gaya rin ng audit trail sa Ingles.'
