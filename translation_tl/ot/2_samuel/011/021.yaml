source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: tl
  text: “Sino ang pumatay kay Abimelec na anak ni Jerubeset?[a] Hindi ba’t isang babae ang naghagis sa kanya ng pang-ibabaw na bato ng gilingan[b] mula sa ibabaw ng pader, kaya namatay siya sa Tebes?[c] Bakit kayo lumapit sa pader?” At sabihin mo, “Namatay rin ang lingkod mong si Urias na Heteo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Jerubeset”; ihambing sa Mga Hukom 9:1, na may “Jerobaal.”
    reason: alternative_reading
  - marker: b
    text: O “isang piraso ng bato ng gilingan”; malamang na tumutukoy ang pariralang Hebreo sa pang-ibabaw na bato ng gilingan.
    reason: lexical_alternative
  - marker: c
    text: Tingnan ang Mga Hukom 9:53 para sa pangyayaring tinutukoy dito.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: pumatay
  rationale: Ang pandiwa ay literal na tumutukoy sa paghampas o pagpabagsak, ngunit sa tanong na ito ay malinaw na nakamamatay ang suntok; natural sa Filipino ang “pumatay.”
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: Abimelec na anak ni Jerubeset
  rationale: Sinusunod ang anyo ng pangalan sa tekstong Hebreo rito at hindi ito tahimik na itinutugma sa “Jerobaal” ng Mga Hukom 9.
- source_word: הֲלוֹא אִשָּׁה
  choice: Hindi ba’t isang babae
  rationale: Pinananatili ang retorikal na tanong na umaasang sang-ayunan ng kausap.
- source_word: הִשְׁלִיכָה
  choice: naghagis
  rationale: Karaniwan at tuwirang salin ng kilos sa makabagong Filipino.
- source_word: פֶּלַח רֶכֶב
  choice: pang-ibabaw na bato ng gilingan
  rationale: Malamang na tumutukoy sa umiikot na pang-ibabaw na bato ng gilingan, ngunit inilalahad sa talababa ang mas literal na posibilidad na isang piraso lamang nito.
- source_word: מֵעַל הַחוֹמָה
  choice: mula sa ibabaw ng pader
  rationale: Hayag na pinananatili ang mataas na pinagmulan ng ibinagsak na bato.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: kaya namatay siya sa Tebes
  rationale: Natural na ipinahahayag ang bunga ng paghagis habang pinananatili ang pangalan ng lugar.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: Bakit kayo lumapit sa pader?
  rationale: Malapit sa diwa at anyo ng Hebreo, at pinananatili ang maramihang “kayo.”
- source_word: וְאָמַרְתָּ
  choice: At sabihin mo
  rationale: Isang tuwirang utos sa mensahero na natural sa Filipino at pinananatili ang pagkakasunod ng pananalita.
- source_word: גַּם
  choice: rin
  rationale: 'Pinananatili ang diwang pandagdag: isa rin si Urias sa mga namatay.'
- source_word: עַבְדְּךָ
  choice: lingkod mong
  rationale: Ang “lingkod” ang angkop na magalang na katawagan sa isang tauhan ng hari sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga pangalang karaniwang anyong Filipino at pinanatili ang retorikal na diin, maramihang kausap, at bahagyang di-tiyak na kahulugan ng katawagan sa bato ng gilingan sa pamamagitan ng talababa.
