  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: tl
  text: Kinuha ni David ang mga kalasag na ginto na pag-aari ng mga lingkod ni Hadadezer, at dinala niya ang mga iyon sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ginintuang kalasag.” Maaari ring unawain nang mas literal ang Hebreo bilang “mga kalasag na ginto.” Ayon sa isang di-gaanong tinatanggap na pananaw, “mga lalagyan ng palaso” ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang kahulugan ng לָקַח sa salaysay ang “kumuha.” Sapat itong malawak at hindi nagdaragdag ng mas madiing diwa ng marahas na pag-agaw, bagaman samsam sa digmaan ang konteksto.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: ang mga kalasag na ginto
  rationale: Pinananatili nito ang anyong konstrak ng Hebreo at ang tradisyonal at kontekstuwal na pagkaunawa sa שׁלטים bilang mga kalasag o kagamitang pananggalang. Hindi gaanong malamang ang panukalang “mga lalagyan ng palaso.”
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: na pag-aari ng
  rationale: Sa kontekstong ito, ang parirala ay nagpapahayag ng pagmamay-ari o kaugnayan, hindi lamang ng lokasyon. Likas sa modernong Tagalog ang “pag-aari ng.”
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: mga lingkod ni Hadadezer
  rationale: Maaaring tumukoy ang עֲבָדִים sa mga alipin, lingkod, o opisyal. Dito, malamang na mga lingkod o tauhan ng hari ang tinutukoy, kaya hindi nililimitahan sa “mga alipin” o “mga opisyal.”
- source_word: וַיְבִיאֵם
  choice: at dinala niya ang mga iyon
  rationale: Ang Hiphil ng בוא ay karaniwang “dalhin.” Malinaw na tumutukoy ang panghalip sa mga kalasag.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ito ang karaniwan at kinikilalang anyo ng pangalan ng lugar sa modernong Filipino.
