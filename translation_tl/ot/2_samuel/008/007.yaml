translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “mga lingkod” upang mapanatili ang lawak ng kahulugan ng עֲבָדִים, at “mga kalasag na ginto” upang manatiling malapit sa Hebreong parirala. Ang marker na [a] ay inilagay sa pangunahing teksto.
