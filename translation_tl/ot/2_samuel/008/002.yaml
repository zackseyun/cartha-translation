revisions:
- from: Nilupig niya ang Moab at sinukat ang mga Moabita gamit ang isang lubid[a], matapos silang pahigain sa lupa. Sinukat niya ang dalawang haba ng lubid para sa kamatayan at isang buong haba ng lubid upang panatilihing buhay.[b] Kaya naging mga lingkod ni David ang mga Moabita at nagdala sila ng tributo.
  to: Nilupig niya ang Moab at sinukat ang mga Moabita gamit ang isang lubid[a], matapos niya silang pahigain sa lupa. Sinukat niya ang dalawang haba ng lubid upang patayin at isang buong haba ng lubid upang panatilihing buhay.[b] Kaya naging mga lingkod ni David ang mga Moabita, na nagdadala ng tributo.
  rationale: Pinanatili ang literal at malupit na larawan ng Hebreo, nang hindi isinasalin sa tahasang bahagdan ang mga grupong pinatay at iniligtas. Ang “upang patayin” at “upang panatilihing buhay” ay mas natural na Filipino at wastong kumakatawan sa magkahanay na infinitive na לְהָמִית at לְהַחֲיוֹת. Inayos din ang huling sugnay upang maipakita ang nagpapatuloy na obligasyong magdala ng tributo.
