  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: tl
  text: Nilupig niya ang Moab at sinukat ang mga Moabita gamit ang isang lubid[a], matapos niya silang pahigain sa lupa. Sinukat niya ang dalawang haba ng lubid upang patayin at isang buong haba ng lubid upang panatilihing buhay.[b] Kaya naging mga lingkod ni David ang mga Moabita, na nagdadala ng tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pisi” o “panukat na lubid.”
    reason: lexical_alternative
  - marker: b
    text: 'Inilalarawan ng Hebreo na sinukat ang mga Moabita habang nakahiga sila sa lupa: dalawang sukat ang itinalaga upang patayin at isang buong sukat upang panatilihing buhay. Ipinahihiwatig nito na ang ilan ay pinatay at ang iba ay pinaligtas.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: Nilupig niya
  rationale: Sa kontekstong militar, ipinahahayag ng נכה ang pananakit o paggapi. Ang “nilupig” ay likas sa Filipino at ipinakikitang napasuko ang Moab, gaya ng pinatutunayan ng kasunod na pagbabayad nito ng tributo.
- source_word: מוֹאָב
  choice: ang Moab / ang mga Moabita
  rationale: Pinanatili ang pangalang “Moab” sa unang banggit; ginamit ang “mga Moabita” kapag malinaw na ang tinutukoy ay ang mga taong pinahiga at sinukat.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: sinukat ang mga Moabita gamit ang isang lubid
  rationale: Pinananatili nito ang konkreto at mariing larawan ng pagsukat. Ang חֶבֶל ay lubid o pising ginagamit dito bilang panukat.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: matapos silang pahigain sa lupa
  rationale: Likas na ipinahahayag sa Filipino ang causative na kilos at ang kalagayang pinangyarihan ng pagsukat.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים
  choice: Sinukat niya ang dalawang haba ng lubid
  rationale: Ang “dalawang haba ng lubid” ay nagpapanatili sa paraan ng pagsukat nang hindi tahasang ginagawang matematikal na bahagi ang mga pangkat.
- source_word: לְהָמִית
  choice: para sa kamatayan
  rationale: Pinananatili ng maikli at nominal na parirala ang mabagsik na paralelismo ng Hebreo, sa halip na palawakin agad bilang “upang patayin.”
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: at isang buong haba ng lubid upang panatilihing buhay
  rationale: Ang מְלֹא ay isang buong sukat o haba; ang hiphil ng חיה ay nangangahulugang panatilihing buhay o hayaang mabuhay.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: Kaya naging mga lingkod ni David ang mga Moabita
  rationale: Ang “mga lingkod” ay tuwirang katumbas ng עֲבָדִים at angkop sa pampolitikang pagpapasakop; hindi nito ipinapalagay ang mas tiyak na katayuang panlipunan ng mga alipin.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: nagdala sila ng tributo
  rationale: Sa kontekstong maharlika at pampolitika, ang מִנְחָה ay tributo, hindi handog na pangkulto.
theological_decisions:
- issue: Ang ginawa ni David sa mga Moabita sa pamamagitan ng pagsukat
  choice: Pinanatili ang literal na larawan ng pagpapahiga, pagsukat, at pagtatalaga sa kamatayan o buhay.
  alternative: Sabihing tuwiran sa pangunahing teksto na dalawang-katlo ang pinatay at isang-katlo ang pinaligtas, o ituring ang pagsukat bilang talinghaga lamang ng pagpapasakop.
  rationale: Inilalarawan ng Hebreo ang isang malupit at konkretong pamamaraan, ngunit hindi nito tahasang ginagamit ang mga bahagdan. Pinananatili ng salin ang tindi at ang kaunting kalabuan ng pormulasyon nang hindi ito pinapahina o dinaragdagan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga Moabita” upang maging malinaw na mga tao, hindi ang lupain, ang pinahiga at sinukat. Pinanatili ang mabagsik at maikling “para sa kamatayan,” habang ginawang likas sa Filipino ang “upang panatilihing buhay.”
