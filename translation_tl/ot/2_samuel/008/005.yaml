  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: tl
  text: Dumating ang Aram[b] ng Damasco upang tulungan si Hadadezer[a], na hari ng Zoba, at pinabagsak ni David ang dalawampu't dalawang libong lalaking mula sa Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hadadezer ay binabaybay na “Hadarezer” sa ilang talata at salin.
    reason: alternative_reading
  - marker: b
    text: Ang Hebreong אֲרַם ay isinaling “Aram,” hindi ang tradisyonal na “Siria.” Tinutukoy nito rito ang kahariang Arameo na nakasentro sa Damasco.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Dumating
  rationale: Ang wayyiqtol ng בוא ay nagsasaad ng kasunod na pangyayari sa salaysay; natural itong isalin bilang “dumating.”
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: ang Aram ng Damasco
  rationale: Pinananatili ang pangalang “Aram” para sa kahariang Arameo na nakasentro sa Damasco, sa halip na gamitin ang mas huling pangalang “Siria.”
- source_word: לַעְזֹר
  choice: upang tulungan
  rationale: Tuwirang ipinapahayag ng עזר ang pagbibigay ng tulong o saklolo.
- source_word: לַהֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Transliterasyon ito ng anyo ng personal na pangalan sa talatang Hebreo; inilalahad sa talababa ang ibang anyo ng pangalan.
- source_word: מֶלֶךְ צוֹבָה
  choice: na hari ng Zoba
  rationale: Ginagawang natural sa Filipino ang pamagat na nasa apposition sa pangalang Hadadezer.
- source_word: וַיַּךְ
  choice: pinabagsak
  rationale: Sa kontekstong militar, ang נכה ay nagpapahiwatig ng marahas at mapagpasiyang pagdaig, kadalasang may kasamang pagpatay; hindi ito nilimitahan sa payak na “tinalo.”
- source_word: בַּאֲרָם
  choice: ng Aram
  rationale: Ang ב kasunod ng נכה ay tumutukoy sa grupong sinalakay; pinananatili ng salin ang katawagang “Aram” na ginamit mismo sa Hebreo.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: dalawampu't dalawang libong lalaki
  rationale: Tahasan sa Hebreo ang אִישׁ (“lalaki”); hindi ito pinalitan ng “sundalo,” bagaman ipinahihiwatig ng konteksto na mga mandirigma sila.
