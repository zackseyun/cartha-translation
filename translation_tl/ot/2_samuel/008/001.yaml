base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: tl
  text: Pagkatapos nito, sinalakay ni David ang mga Filisteo at pinasailalim niya sila, at kinuha ni David ang Metheg-ammah[a] mula sa kamay ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang renda ng inang lunsod,” isang pariralang mahirap bigyang-kahulugan. Maaaring idyomatikong tumukoy ito sa pagkontrol sa pangunahing lunsod. Ihambing ang 1 Cronica 18:1, na nagsasabing “Gat at ang mga bayang sakop nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Tagalog na malinaw na nagpapatuloy sa salaysay nang hindi mekanikal na isinasalin ang וַיְהִי.
- source_word: וַיַּךְ
  choice: tinalo
  rationale: Sa kontekstong militar, maaaring tumukoy ang נכה sa pagdaig sa kaaway. Mas natural sa Tagalog ang “tinalo” kaysa sa literal na “hinampas,” habang ang kasunod na pandiwa ang naglalarawan sa kanilang pagpapasailalim.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang anyong Tagalog ng pangalan ng bayang Philistine.
- source_word: וַיַּכְנִיעֵם
  choice: pinasailalim sila
  rationale: Ipinahahayag ng Hiphil ng כנע ang pagdadala sa iba sa pagpapasakop o pagkontrol; malinaw nitong pinananatili ang resultang militar at pampolitika.
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Pinananatili ang malawak at karaniwang kahulugan ng לקח nang hindi nagpapasiya kung ang tinutukoy na bagay ay isang lunsod, sagisag ng kapangyarihan, o pangalan.
- source_word: מֶתֶג הָאַמָּה
  choice: Meteg-ha-Ama
  rationale: Mahirap at hindi tiyak ang parirala. Ang transliterasyon sa pangunahing teksto ay hindi tahimik na nagpapasiya kung ito ay pangalang pantangi o idyomatikong paglalarawan; ipinaliliwanag sa talababa ang literal na larawan at posibleng kahulugan.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang Hebreong idyoma para sa pagkuha mula sa kapangyarihan o pag-aari ng isang tao o bayan, at nauunawaan pa rin ito sa Tagalog.
