  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: tl
  text: Pagkatapos ay isinugo ni Toi ang anak niyang si Joram kay Haring David upang kumustahin ito at pagpalain dahil nakipaglaban si David kay Hadadezer at tinalo niya ito, sapagkat noon ay nakikipagdigma si Hadadezer kay Toi. May dala si Joram na mga kagamitang gawa sa pilak, mga kagamitang gawa sa ginto, at mga kagamitang gawa sa bronse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, isinugo
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa makabagong Tagalog ang “Pagkatapos” at pinananatili ng “isinugo” ang diwa ng pagpapadala sa isang misyon.
- source_word: תֹּעִי אֶת יֽוֹרָם בְּנוֹ
  choice: isinugo ni Toi ang anak niyang si Joram
  rationale: Pinananatili ang mga pangalang Hebreo at gumagamit ng natural na ayos sa Tagalog habang malinaw na si Joram ang anak ni Toi.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: upang kumustahin ito
  rationale: Ang idyoma ay pagtatanong tungkol sa kapayapaan o kalagayan ng isang tao; “kumustahin” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: וּלְבָרֲכוֹ
  choice: at pagpalain
  rationale: Pinananatili ang karaniwang diwa ng ברך na “pagpalain,” bagaman maaari rin itong magpahiwatig ng pagbati sa diplomatikong konteksto.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: dahil nakipaglaban si David kay Hadadezer at tinalo niya ito
  rationale: Nililinaw ang tinutukoy ng mga panlalaking panghalip upang maiwasan ang kalituhan sa Tagalog. Sa kontekstong militar, ipinahihiwatig ng נכה rito ang pagkatalo ni Hadadezer nang hindi kinakailangang sabihing napatay siya.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: sapagkat nakikipagdigma si Hadadezer kay Toi
  rationale: Natural na ipinapahayag sa Tagalog ang siksik na idyomang Hebreo na literal na tumutukoy kay Hadadezer bilang isang “tao ng mga digmaan” kaugnay ni Toi; hindi dinaragdagan ng tiyak na katawagang “kaaway.”
- source_word: וּבְיָדוֹ הָיוּ
  choice: May dala si Joram
  rationale: Ang literal na “nasa kanyang kamay” ay karaniwang idyoma para sa mga bagay na dala niya. Pinangalanan si Joram sapagkat ang kasunod na talaan ay tumutukoy sa mga kaloob na dala ng sugo.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: mga kagamitang pilak, mga kagamitang ginto, at mga kagamitang tanso
  rationale: Malawak ang saklaw ng כְּלִי at maaaring mangahulugang kagamitan, sisidlan, o bagay; ang “mga kagamitan” ay sapat na pangkalahatan. Ang נְחֹשֶׁת ay isinaling “tanso,” ang karaniwang salitang Filipino sa ganitong sinaunang konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumustahin” bilang natural na katumbas ng idyomang tungkol sa kapakanan, ngunit pinanatili ang “pagpalain” upang hindi paliitin iyon sa simpleng pagbati o pagbati sa tagumpay. Nilinaw ang mga panghalip sa pamamagitan ng pagbanggit kina David at Joram.
