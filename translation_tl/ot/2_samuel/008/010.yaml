  naturalness: Likas at marangal ang karamihan ng salin. Ang "noon ay nakikipagdigma" ay nagpapanatili ng natural na Tagalog habang nililinaw ang panahong tinutukoy. Ang "mga kagamitang gawa sa" ay mas malinaw na pagkakalarawan ng mga bagay na dala kaysa sa sunod-sunod na pang-uring "kagamitang pilak/ginto."
  terminology: Napanatili nang wasto ang Toi, Joram, David, at Hadadezer. Ang "pagpalain" ay angkop na direktang katumbas ng ברך at hindi binabawasan sa pagbati lamang. Ginamit ang "bronse" para sa נְחֹשֶׁת, alinsunod sa malamang na metal na tinutukoy.
