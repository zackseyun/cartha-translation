source:
  edition: WLC
  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: tl
  text: Sina Zadok na anak ni Ahitub at Ahimelek na anak ni Abiatar ay mga pari,[a] at si Seraias ay kalihim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong ministro” o “mga opisyal ng hari.” Dahil bahagi ito ng talaan ng mga opisyal ni David, itinuturing ng ilan na mas malawak at administratibo ang kahulugan dito ng salitang isinaling “mga pari.”
    reason: lexical_alternative
  - marker: b
    text: O “eskriba.” Ang salitang Hebreo ay tumutukoy sa isang opisyal na nangangasiwa sa pagsusulat o sa mga gawaing administratibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Pangalang pantangi; tinumbasan sa paraang transliterasyon na malapit sa anyong Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaan ng mga opisyal, pinakanatural itong tumukoy sa tuwirang ugnayan ng ama at anak, hindi lamang sa isang inapo.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Pangalang pantangi; transliterasyon ng anyong Hebreo.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelek
  rationale: Pangalang pantangi; transliterasyon na pinananatili ang hulihang tunog ng Hebreong kaph.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Pangalang pantangi; natural na transliterasyon sa Filipino.
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Ito ang pangunahin at karaniwang kahulugan ng terminong Hebreo. Bagaman maaari itong unawain ng ilan bilang mga mataas na opisyal sa kontekstong maharlika, hindi sapat ang konteksto upang palitan ang karaniwang kahulugan sa pangunahing teksto.
- source_word: שְׂרָיָה
  choice: Seraias
  rationale: Pangalang pantangi; anyong transliterasyon na natural basahin sa Filipino.
- source_word: סוֹפֵר
  choice: kalihim
  rationale: Sa talaan ng korte ng hari, tumutukoy ito sa opisyal na namamahala sa pagsusulat at gawaing administratibo. Mas malinaw sa karaniwang mambabasa ang “kalihim,” habang nananatiling posibleng salin ang “eskriba.”
theological_decisions:
- issue: Kahulugan ng כֹּהֲנִים sa isang talaan ng mga opisyal ng hari
  choice: mga pari
  alternative: mga punong ministro; mga opisyal ng hari
  rationale: Ang karaniwang kahulugan ng salita ay “mga pari.” Dahil nasa konteksto ito ng talaan ng mga opisyal ni David, may mga nagmumungkahi ng mas malawak na administratibong kahulugan; pinanatili ang posibilidad na iyon sa talababa sa halip na tahimik na ipalit sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa likas na pagpapakilala sa dalawang taong magkasamang paksa, “anak ni” para sa natural na ugnayang genealogical, at “kalihim” upang malinaw na maipahayag ang tungkuling administratibo sa korte.
