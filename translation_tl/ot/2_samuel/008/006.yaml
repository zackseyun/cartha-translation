  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: tl
  text: Naglagay si David ng mga garison sa Aram ng Damasco[a]. At ang Aram ay naging mga lingkod ni David na nagdadala ng tributo[b]. Binigyan ni Yahweh si David ng tagumpay saanman siya pumunta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Aram, sa Damasco.” Tradisyonal ding tinatawag na “Siria” ang Aram.
    reason: lexical_alternative
  - marker: b
    text: O “nagdadala ng kaloob” o “handog.” Ang salitang Hebreo ay maaaring tumukoy sa regalo, handog, o tributo; dito, malamang na bayad ito ng isang bansang nasasakupan.
    reason: lexical_alternative
  - marker: c
    text: Sa mas literal na salin, “Iniligtas ni Yahweh si David saanman siya pumunta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Naglagay
  rationale: Ang שׂים ay karaniwang nangangahulugang maglagay o magtalaga; natural ang “naglagay” sa konteksto ng mga garison.
- source_word: נְצִבִים
  choice: mga garison
  rationale: Sa konteksto ng pananakop at pagkontrol sa teritoryo, malamang na tumutukoy ito sa mga nakatalagang hukbo o himpilang militar; pinananatili ng “mga garison” ang diwang militar.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: sa Aram ng Damasco
  rationale: Pinananatili ang Hebreong pangalang heograpiko na Aram, at inilalahad ang ugnayan nito sa Damasco nang malapit sa anyo ng pariralang Hebreo.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: ang Aram ay naging mga lingkod ni David
  rationale: Pinananatili ng “mga lingkod” ang leksikal na halaga ng עֲבָדִים habang malinaw sa konteksto na pambansang pagpapasakop ang tinutukoy.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: na nagdadala ng tributo
  rationale: Maaaring mangahulugan ang מִנְחָה ng regalo, handog, o tributo; sa konteksto ng isang bansang nasakop, “tributo” ang pinakatiyak na kahulugan.
- source_word: וַיֹּשַׁע
  choice: Pinagtagumpay
  rationale: Ang Hiphil ng ישׁע ay tumutukoy sa pagliligtas ni Yahweh; sa konteksto ng mga labanang militar, malinaw at natural na ipinahahayag ito ng “pinagtagumpay,” habang itinatala sa talababa ang mas literal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: saanman siya pumunta
  rationale: Ito ang natural na Tagalog para sa idyomang nagsasaad ng malawak at paulit-ulit na tagumpay sa lahat ng pinuntahan ni David.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng עֲבָדִים sa kontekstong pampolitika
  choice: mga lingkod
  alternative: mga nasasakupan o mga alipin
  rationale: Ang “mga lingkod” ay malapit sa leksikal na anyo at hindi labis na nililinaw ang uri ng pagpapasakop; ipinakikita ng pagdadala ng tributo na pampolitika ang konteksto.
- issue: Paglalahad sa וַיֹּשַׁע sa kontekstong militar
  choice: Pinagtagumpay
  alternative: iniligtas o hinango sa panganib
  rationale: Ipinahihiwatig ng konteksto ang tagumpay sa digmaan, ngunit pinananatili sa talababa ang mas malawak at literal na diwa ng pagliligtas.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “garison” at “tributo” bilang karaniwang terminong historikal-militar. Pinanatili ang “Aram” at “Yahweh” bilang mga pangalang nasa pinagmulang teksto; hindi pinawi ang posibilidad na ang וַיֹּשַׁע ay literal ding mangahulugang “iniligtas.”
