  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: tl
  text: Si Joab na anak ni Zeruia ang namahala sa hukbo[a], at si Jehosafat na anak ni Ahilud ang tagapagtala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang namuno sa hukbo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tagapagtala” ay isang opisyal ng hari na nag-iingat ng mga tala at nag-uulat ng mga bagay sa hari; maaari rin itong isaling “kalihim” o “tagapagtala ng mga pangyayari.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: ang namahala sa hukbo
  rationale: Sa talaan ng mga opisyal, ipinahihiwatig ng עַל ang awtoridad o pangangasiwa. Likas sa modernong Tagalog ang “namahala sa hukbo” at pinananatili nito ang administratibong diwa ng Hebreo.
- source_word: מַזְכִּיר
  choice: tagapagtala
  rationale: Tumutukoy ito sa isang opisyal ng hari na may tungkuling mag-ingat ng mga tala at mag-ulat ng mga bagay sa hari. Maikli at malinaw ang “tagapagtala” at hindi ito nagpapahiwatig na siya lamang ay may-akda ng isang salaysay.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang paraan ito sa Tagalog ng pagtukoy sa isang tao ayon sa kaniyang magulang at tapat na katumbas ng genealogical na gamit ng בֶּן.
- source_word: וְ / וִ
  choice: at
  rationale: Pinag-uugnay ng mga unlaping ito ang dalawang opisyal sa payak na talaan; pinananatili ng “at” ang parataktikong ayos ng Hebreo.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Joab / Zeruia / Jehoshafat / Ahilud
  rationale: Ginamit ang mga anyo ng pangalang pamilyar at angkop sa mga saling Bibliya sa Tagalog.
