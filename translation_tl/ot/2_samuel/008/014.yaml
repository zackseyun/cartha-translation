  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: tl
  text: Naglagay siya ng mga garison sa Edom; sa buong Edom ay naglagay siya ng mga garison. At ang buong Edom ay naging mga lingkod ni David.[a] At binigyan ni Yahweh si David ng tagumpay saanman siya pumunta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ang buong Edom ay naging mga alipin ni David.” Ginagamit dito ang pangalan ng bansa bilang kolektibong tawag sa mga Edomita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Iniligtas” o “iniligtas at inilaban” ni Yahweh si David saanman siya pumunta. Sa kontekstong militar, ang pandiwa ay maaaring tumukoy sa pagbibigay ng tagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: naglagay
  rationale: Karaniwang kahulugan ng שׂים ang ‘maglagay’ o ‘magtakda.’ Ang ‘naglagay’ ay natural sa Filipino at hindi nagdaragdag ng espesipikong diwa na wala sa pandiwa.
- source_word: נְצִבִים
  choice: mga garison
  rationale: Sa konteksto ng pananakop at pagkontrol sa Edom, malamang na tumutukoy ito sa mga nakatalagang puwersa o himpilang militar. Pinananatili ng ‘mga garison’ ang malamang na diwang militar, habang kinikilala sa talababa ang posibleng ‘mga opisyal.’
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: sa Edom / sa buong Edom
  rationale: Tuwirang ipinahahayag ng ב ang lokasyon, at ng בְכָל ang saklaw sa buong lupain.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: ang buong Edom ay naging mga sakop ni David
  rationale: Kolektibong ginagamit ang pangalan ng bansa para sa mga mamamayan nito. Sa konteksto ng pananakop, ipinahahayag ng עֲבָדִים ang pagpapasailalim o sapilitang paglilingkod; malinaw at natural itong naihahatid ng ‘mga sakop,’ nang hindi awtomatikong ipinapalagay ang indibidwal na pagkaalipin.
- source_word: וַיּוֹשַׁע
  choice: pinagtagumpay
  rationale: Ang Hiphil ng ישׁע ay maaaring mangahulugang ‘nagligtas,’ ‘nagpalaya,’ o ‘nagbigay ng tagumpay.’ Sa buod na militar na ito, natural na ipinahahayag ng ‘pinagtagumpay’ ang pagliligtas na nagbunga ng tagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: saanman siya pumunta
  rationale: Natural na katumbas ito ng idyomang nagsasaad ng tagumpay sa bawat lugar o pakikipagsapalaran ni David, nang hindi dinaragdagan ang pandiwa ng tiyak na diwang ‘nagmartsa.’
theological_decisions:
- issue: Paglalarawan sa kalagayan ng Edom sa ilalim ni David
  choice: mga sakop ni David
  alternative: mga alipin o mga lingkod ni David
  rationale: Maaaring saklawin ng עֲבָדִים ang pagkaalipin, paglilingkod, o pampolitikang pagpapasailalim. Dahil bansa ang kolektibong simuno at pananakop ang konteksto, pinananatili ng ‘mga sakop’ ang pampolitikang diwa nang hindi inaalis ang mas matinding posibilidad, na binabanggit sa talababa.
- issue: Diwa ng pagliligtas ni Yahweh kay David
  choice: pinagtagumpay ni Yahweh si David
  alternative: iniligtas ni Yahweh si David
  rationale: Parehong nasa saklaw ng וַיּוֹשַׁע ang pagliligtas at pagbibigay ng tagumpay. Ang pangunahing salin ay umaayon sa kontekstong militar, habang pinananatili sa talababa ang mas literal na alternatibo.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa Hebreo ang mismong Tetragrammaton, kaya pinananatili ito bilang pangalang ‘Yahweh’ sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘garison,’ isang karaniwang hiram na terminong militar, at ‘mga sakop’ upang natural na ipahayag ang kolektibong pampolitikang pagpapasailalim ng Edom habang inilalahad sa talababa ang literal at mas matinding mga alternatibo.
