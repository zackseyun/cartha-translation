translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa salaysay. Ginamit ang “hukbo” bilang malinaw na terminong militar at iniwasan ang lipas na “sinalakay/sinaktan” na maaaring hindi ganap na magpahayag ng pagkatalo. Napanatili ang kuwit at di-ganap na sugnay dahil nagpapatuloy ang pangungusap sa kasunod na talata.
