  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: tl
  text: Nang mabalitaan ni Toi, hari ng Hamat, na tinalo ni David ang buong hukbo ni Hadadezer,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kaparehong salaysay sa 1 Cronica 18:9, “Tou” ang pangalan ng hari. “Toi” ang mababasa sa tekstong Hebreo rito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang mabalitaan
  rationale: Ang pandiwa mula sa שׁמע ay nagsasaad ng sumunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “nang mabalitaan” at malinaw na ipinakikitang nakarating kay Toi ang balita.
- source_word: תֹּעִי
  choice: Toi
  rationale: Sinusunod ng pangunahing teksto ang anyo ng pangalan sa Hebreong teksto ng talatang ito; inilalahad sa talababa ang naiibang anyo sa kaparehong salaysay.
- source_word: מֶלֶךְ חֲמָת
  choice: na hari ng Hamat
  rationale: Tuwirang isinasalin ang construct chain na tumutukoy sa katungkulan at kaharian ni Toi; ang “Hamat” ay ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nabalitaan ni Toi, hindi ang dahilan ng kanyang pagkarinig.
- source_word: הִכָּה
  choice: nilupig
  rationale: Sa kontekstong militar, ipinahihiwatig ng נכה ang pagwasak o paggapi sa kalaban. Ang “nilupig” ay natural at dignified na Tagalog at pinananatili ang marahas at ganap na diwa nang hindi nagiging lipas ang pananalita.
- source_word: אֵת כָּל חֵיל
  choice: ang buong hukbo
  rationale: Ang חַיִל dito ay tumutukoy sa organisadong puwersang militar. Malinaw sa karaniwang mambabasa ang “buong hukbo” at tapat ito sa kolektibong כָּל.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezer
  rationale: Transliterasyon ng personal na pangalan ayon sa kinagawiang anyo sa mga saling Filipino.
