  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: tl
  text: Nagkamit si David ng katanyagan nang bumalik siya matapos niyang talunin ang Aram sa Lambak ng Asin—labingwalong libo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ilang saksi at ang kaparehong salaysay sa 1 Cronica 18:12 ay may “Edom” sa halip na “Aram.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: Nagkaroon ng pangalan
  rationale: Ang idyomang Hebreo ay literal na “gumawa ng pangalan” at tumutukoy sa pagtatamo ng katanyagan. Ang “nagkaroon ng pangalan” ay likas sa Filipino at napapanatili ang larawan ng orihinal.
- source_word: בְּשֻׁבוֹ
  choice: nang bumalik siya
  rationale: Ang preposisyon na may infinitive construct at hulaping panghalip ay nagsasaad ng panahon; malinaw at natural ang ganitong salin.
- source_word: מֵהַכּוֹתוֹ
  choice: mula sa paglipol
  rationale: Ipinahihiwatig ng kayarian ang pagkilos na pinanggalingan niya. Sa konteksto ng labanan at bilang ng napatay, ipinapahayag ng “paglipol” ang puwersa ng נכה nang hindi dinaragdagan ang paraan ng pagkatalo.
- source_word: אֶת אֲרָם
  choice: sa Aram
  rationale: Sinusunod nito ang WLC/Masoretic Text, na may Aram, at iniiwasan ang mas huling katawagang “Syria.”
- source_word: בְּגֵיא מֶלַח
  choice: sa Lambak ng Asin
  rationale: Isinalin bilang pangalan ng lugar at ginamit ang natural na pang-ukol na “sa.”
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: labingwalong libong tauhan
  rationale: Walang tahasang pangngalan sa Hebreo. Ang “tauhan” ay maingat na ipinuno mula sa kontekstong militar at mas angkop kaysa sa pangkalahatang “mga tao.”
theological_decisions:
- issue: Pagkakakilanlan ng natalong kaaway
  choice: Aram sa pangunahing teksto
  alternative: Edom
  rationale: Aram ang basa ng WLC/Masoretic Text sa 2 Samuel 8:13. Gayunman, itinuturo ng ilang sinaunang saksi at ng kaparehong salaysay sa 1 Cronica 18:12 ang Edom; pinanatili ang mahalagang pagkakaibang ito sa talababa sa halip na tahimik na lutasin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong idyoma sa natural na anyong “nagkaroon ng pangalan,” at inilantad sa talababa ang mahalagang variant na Aram/Edom.
