base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: tl
  text: mula sa Aram[a], mula sa Moab, mula sa mga Ammonita[b], mula sa mga Filisteo, mula sa Amalek, at mula sa samsam ni Hadadezer[c], na anak ni Rehob, hari ng Zoba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong אֲרָם (Aram) ay tradisyonal ding isinasaling “Siria.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mga anak ni Ammon.”
    reason: lexical_alternative
  - marker: c
    text: Sa ilang talata, ang pangalang ito ay binabaybay na “Hadarezer.”
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: mula sa Aram
  rationale: Pinananatili ang Hebreong pangalang Aram sa halip na gamitin ang mas huling katawagang heograpiko na “Siria.”
- source_word: וּמִמּוֹאָב
  choice: sa Moab
  rationale: Ang Moab ay pangalang pantangi ng bayan o lupain; malinaw at likas ang tuwirang transliterasyon.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: sa mga anak ni Ammon
  rationale: Pinananatili ang literal na anyong “mga anak ni Ammon,” na nauunawaan dito bilang mga Ammonita at tumutugma sa karaniwang biblikal na pananalita sa Filipino.
- source_word: וּמִפְּלִשְׁתִּים
  choice: sa mga Filisteo
  rationale: Ginamit ang karaniwang katawagang Filipino para sa pangkat-etnikong Philistine.
- source_word: וּמֵעֲמָלֵק
  choice: sa Amalek
  rationale: Pangalang pantangi ang ginamit sa Hebreo, hindi tahasang pangalang-etniko; kaya pinanatili ang “Amalek” sa halip na gawing “mga Amalekita.”
- source_word: וּמִשְּׁלַל
  choice: at sa samsam mula kay
  rationale: Ang שָׁלָל ay mga ari-ariang nakuha sa digmaan. Likas sa Filipino ang “samsam,” at ipinahihiwatig ng “mula kay” kung kanino ito nakuha nang hindi dinaragdagan ang di-kailangang detalye.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Sinusunod ng transliterasyon ang anyo ng pangalan sa talatang ito; itinatala sa talababa ang ibang anyong Hadarezer na makikita sa ilang talata.
- source_word: בֶּן רְחֹב
  choice: na anak ni Rehob
  rationale: Tuwiran at likas na salin ng karaniwang Hebreong ugnayang pampamilya.
- source_word: מֶלֶךְ צוֹבָה
  choice: ang hari ng Zoba
  rationale: Pinananatili ang titulong maharlika at ang pangalang pantangi ng lugar sa malinaw na anyong Filipino.
