  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan ng Hebreo ngunit hindi paulit-ulit ang “at mula” upang maging likas basahin. Ginamit ang “mga anak ni Ammon” upang mapanatili ang kongkretong Hebreong idyoma, samantalang ang iba pang pangkat at lugar ay isinalin ayon sa anyong gramatikal ng pinagmulan.
