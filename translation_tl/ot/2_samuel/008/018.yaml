base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: tl
  text: Si Benaya na anak ni Joiada ang namahala sa mga Kereteo at mga Peleteo, at ang mga anak ni David ay mga pari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong ministro” o “mga opisyal ng hari.” Ang salitang Hebreo ay ang karaniwang tawag sa “mga pari,” ngunit inuunawa ito ng ilan dito sa mas malawak na diwang tumutukoy sa tungkulin sa palasyo, yamang ang konteksto ay tungkol sa pamamahala ng hari.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Si Benaya na anak ni Joiada
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang Hebreo habang pinananatiling madaling makilala ang mga ito.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: sa mga Kereteo at mga Peleteo
  rationale: Mga katawagan ito sa dalawang pangkat. Ginamit ang mga anyong transliterado sa Filipino nang hindi ipinapalagay kung sila ay pangkat-etniko o yunit-militar.
- source_word: וּבְנֵי דָוִד
  choice: ang mga anak ni David
  rationale: Tuwirang katumbas ng pariralang Hebreo at natural sa modernong Tagalog.
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Ito ang karaniwan at tuwirang kahulugan ng salitang Hebreo. Hindi nilutas sa pangunahing teksto ang tensiyong dulot ng konteksto; inilagay sa talababa ang posibleng kahulugang panghukuman.
- source_word: הָיוּ
  choice: ay
  rationale: Likas na ipinahahayag ng panandang panaguri na “ay” ang Hebreong copula na nangangahulugang “sila ay/naging,” nang hindi idinaragdag ang mas interpretibong “naglingkod bilang.”
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: Si Benaya ... ang namahala sa mga Kereteo at mga Peleteo
  rationale: Elliptical ang Hebreo sa pagpapatuloy ng talaan ng mga opisyal. Ang “ang namahala sa” ay likas na pagpuno sa ugnayang ipinahihiwatig ng konteksto at tumutugma sa tungkulin ni Benaya na binabanggit sa kaugnay na mga tala.
theological_decisions:
- issue: Ang pagtawag na כֹּהֲנִים sa mga anak ni David
  choice: Pinanatili sa pangunahing teksto ang “mga pari.”
  alternative: “mga punong ministro” o “mga opisyal ng hari”
  rationale: Ang “mga pari” ang payak na leksikal na kahulugan, bagaman maaaring tumukoy rito ang salita sa mataas na tungkulin sa palasyo. Pinananatili ng salin ang tunay na tensiyon at inilalahad sa talababa ang alternatibong pagkaunawa sa halip na tahimik itong piliin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “namahala sa” upang natural na maipahayag ang elliptical na ugnayan sa Hebreo; pinanatili ang “mga pari” sa teksto at ang alternatibong kahulugang panghukuman sa talababa.
