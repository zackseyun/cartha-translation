reference: 2 Samuel 8:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: tl
  text: Itinalaga rin ni Haring David ang mga iyon[a] kay Yahweh, kasama ng pilak at ginto na itinalaga niya mula sa lahat ng bansang kanyang nasakop.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga iyon” ay tumutukoy sa mga bagay na binanggit sa naunang talata.
    reason: cross_reference
  - marker: b
    text: Maaari ring “kanyang napasailalim.” Ang pandiwang Hebreo ay maaaring mangahulugang pagpapasailalim ng mga bayan sa pamamagitan ng puwersa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: rin
  rationale: Ipinahihiwatig ang pagdaragdag sa ginawa sa mga bagay na binanggit sa naunang talata.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Pinananatili ang panghalip na tumutukoy sa mga bagay na binanggit sa naunang talata nang hindi labis na tinutukoy ang mga ito sa pangunahing teksto.
- source_word: הִקְדִּישׁ
  choice: itinalaga
  rationale: Natural at marangal na salita para sa paghihiwalay o pag-uukol ng mahahalagang bagay para sa Diyos, habang pinananatili ang sagradong diwa.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Karaniwang ayos sa modernong Tagalog para sa titulong maharlika at pangalan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang Yahweh; ang pantukoy na 'kay' ay likas sa Tagalog para sa personal na pangalan.
- source_word: עִם
  choice: kasama ng
  rationale: Malinaw at natural na inuugnay ang mga bagay na iyon sa pilak at ginto.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: pilak at ginto
  rationale: Likas na Tagalog na pagtukoy sa tiyak na mahahalagang metal sa konteksto; hindi kailangan ang paulit-ulit na pantukoy.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: na itinalaga niya
  rationale: Ang aspektong naganap ay angkop sa mga yamang nauna nang itinalaga mula sa mga dating tagumpay.
- source_word: מִכָּל הַגּוֹיִם
  choice: mula sa lahat ng bansa
  rationale: Ang מִן ay nagpapahayag ng pinagmulan, at ang גּוֹיִם ay tumutukoy rito sa mga bansang politikal.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: na kanyang nasakop
  rationale: Ipinapahayag ang militar na pagpapailalim sa natural na Tagalog; inilalahad sa talababa ang mas malawak na alternatibong diwa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa Hebreo; pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Lakas ng kahulugan ng כִּבֵּשׁ
  choice: nasakop
  alternative: napasailalim
  rationale: Ang pandiwa ay maaaring tumukoy sa marahas na pagsupil o pagpapasailalim. Ang 'nasakop' ay malinaw sa kontekstong militar, habang pinananatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'itinalaga' para sa kultikong pag-uukol at 'nasakop' para sa malinaw na kontekstong militar, na may talababa upang mapanatili ang leksikal na saklaw.
