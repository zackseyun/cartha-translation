  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: tl
  text: At naghari si David sa buong Israel, at si David ay nagpapatupad ng katarungan at katuwiran[a] para sa buong bayan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “katarungan at kung ano ang matuwid.” Ang pares na “katarungan at katuwiran” sa Hebreo ay karaniwang pananalita para sa huwarang pamamahala ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ipinahihiwatig ng pandiwa rito ang aktuwal na paghahari ni David, hindi lamang ang pagluklok niya bilang hari.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Likas itong paraan sa modernong Tagalog upang tukuyin ang buong nasasakupan ng kanyang paghahari.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: ipinaiiral niya
  rationale: Ang aspektong imperpektibo ng “ipinaiiral” ay nagpapakita ng nagpapatuloy o nakaugaliang gawain sa pamamahala, gaya ng konstruksiyong Hebreo na may pandiwaring aktibo.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa konteksto ng pamamahala ng hari, tumutukoy ito sa makatarungang paghatol at pangangasiwa, hindi lamang sa isang hatol ng hukuman.
- source_word: וּצְדָקָה
  choice: katuwiran
  rationale: Pinananatili nito ang bukod na diwa ng moral na pagiging tama at matuwid, sa halip na ihalo ito sa “katarungan.”
- source_word: לְכָל עַמּוֹ
  choice: para sa buong bayan niya
  rationale: Ipinapahayag ng “para sa” na ang makatarungang pamamahala ay isinasagawa alang-alang sa kanyang bayan; pinananatili ng “niya” ang hulaping panghalip sa Hebreo.
theological_decisions:
- issue: Paglalahad sa tambalang מִשְׁפָּט וּצְדָקָה bilang buod ng huwarang paghahari
  choice: katarungan at katuwiran
  alternative: katarungan at kung ano ang tama
  rationale: Pinananatiling magkahiwalay ang legal at moral na mga dimensiyon ng huwarang pamumuno nang hindi ginagawang iisang konsepto ang dalawang salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “buong bayan niya” sa halip na mas pormal na “lahat ng kanyang nasasakupan,” at pinanatili ang dalawang mahalagang pangngalang “katarungan” at “katuwiran.”
