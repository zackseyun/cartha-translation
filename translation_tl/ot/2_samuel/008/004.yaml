base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: tl
  text: Nabihag ni David mula sa kanya ang 1,700 mangangabayo[a] at 20,000 sundalong naglalakad. Pagkatapos, pinilay ni David ang lahat ng kabayo ng mga karwahe[b], ngunit nagtira siya ng sapat para sa 100 karwahe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang tekstong Hebreo: “1,700 mangangabayo.” Sa katumbas na salaysay sa 1 Cronica 18:4, “7,000 mangangabayo” ang mababasa.'
    reason: textual_variant
  - marker: b
    text: Sa Hebreo, “ang buong puwersang pangkarwahe.” Ang mga kabayong ginagamit sa mga karwahe ang tinutukoy, sapagkat sila ang maaaring pilayin.
    reason: lexical_alternative
  - marker: c
    text: O, “ngunit nag-iwan siya ng sapat na mga kabayo para sa 100 karwahe.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: nabihag
  rationale: Ang לכד ay tumutukoy sa pagdakip o pagbihag sa labanan; malinaw at natural ang “nabihag” sa kontekstong militar.
- source_word: מִמֶּנּוּ
  choice: mula sa kanya
  rationale: Isahan ang hulaping Hebreo at tumutukoy sa natalong haring si Hadadezer; pinananatili ang isahang reperensiya.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1,700 mangangabayo
  rationale: Ang פָּרָשִׁים ay mga kawal na nakasakay sa kabayo. Sinusunod ng bilang ang tekstong Masoretiko ng Samuel, habang itinatala sa talababa ang kaibahan sa 1 Cronica 18:4.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20,000 kawal na naglalakad
  rationale: Ipinahahayag nito nang malinaw ang mga kawal na lumalaban nang naglalakad, bilang kaibahan sa mga mangangabayo.
- source_word: וַיְעַקֵּר
  choice: pinilay
  rationale: Sa kontekstong ito, ang עקר ay pagputol o pagpinsala sa litid ng mga paa ng kabayo upang hindi na magamit sa digmaan. Ang “pinilay” ay natural at malinaw sa modernong Tagalog nang hindi nagdaragdag ng di-kailangang graphic na detalye.
- source_word: אֶת כָּל הָרֶכֶב
  choice: lahat ng kabayo ng mga karwahe
  rationale: Bagaman karaniwang nangangahulugang “karwahe” o puwersang pangkarwahe ang רֶכֶב, ang bagay na maaaring pilayin ay ang mga kabayong humihila rito; ginawang hayag ang metonimikong tinutukoy.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: nagtira siya ng sapat para sa 100 karwahe
  rationale: Ang hiphil ng יתר ay “mag-iwan” o “magtira.” Ang parirala ay natural na nagpapahiwatig na may itinira siyang mga kabayong sapat para sa isang daang karwahe, habang hindi inuulit ang “kabayo” sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “mangangabayo,” “kawal na naglalakad,” at “karwahe” bilang madaling maunawaang mga terminong militar. Inilagay ang lahat ng marker [a], [b], at [c] sa pangunahing teksto at iniwasang lutasin nang tahimik ang tekstuwal at leksikal na mga kalabuan.
