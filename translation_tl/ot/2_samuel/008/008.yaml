  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: tl
  text: At mula sa Betah at mula sa Berotai[a], na mga lungsod ni Hadadezer, kumuha si Haring David ng napakaraming tanso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na salaysay sa 1 Cronica 18:8, Tibhat at Cun ang mga pangalan ng mga lugar na ito; Betah at Berotai ang mababasa sa tekstong Hebreo ng talatang ito. Ang Berotai ay tinatawag ding “Berota” sa ilang salin.
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa tansong pula o bronse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  choice: At mula sa Betah
  rationale: Tuwirang isinasalin ang pang-ugnay at pang-ukol, at sinusunod ang anyo ng pangalan sa tekstong Hebreo ng talatang ito.
- source_word: וּמִבֵּרֹתַי
  choice: at Berotai
  rationale: Pinananatili ang pangalang pantanging Berotai ayon sa WLC; nauunawaan pa rin ang ikalawang “mula sa” mula sa magkatugmang kayarian sa Filipino.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: na mga lungsod ni Hadadezer
  rationale: Ipinahahayag ang construct chain bilang pag-aari o pagkakaugnay ng mga lungsod kay Hadadezer nang hindi nililinaw nang higit sa pinagmulan.
- source_word: לָקַח
  choice: kumuha
  rationale: Ang payak na diwang “kumuha” ay tapat sa pandiwa at hindi nagpapalagay kung ang diin ay sa pagsamsam o sa pagkuha bilang samsam sa digmaan.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: si Haring David
  rationale: Ito ang natural at marangal na ayos ng titulo at pangalan sa makabagong Filipino.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Sa Filipino, ang “tanso” ang karaniwang salin para sa metal na maaaring tumukoy sa copper o bronze; pinananatili sa talababa ang saklaw na ito.
- source_word: הַרְבֵּה מְאֹד
  choice: napakaraming
  rationale: Natural na ipinahahayag ang mariing dami sa Hebreo at angkop ito sa pangngalang masa na “tanso.”
