base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: tl
  text: Tinalo ni David si Hadadezer, anak ni Rehob[a], na hari ng Zoba, nang magtungo siya upang maibalik ang kaniyang kapangyarihan[b] sa Ilog[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Hadadezer”; “Hadarezer” naman sa ilang tradisyong tekstuwal at sa katumbas na salaysay sa 1 Cronica.'
    reason: textual_variant
  - marker: b
    text: Maaari ring “upang mabawi ang kaniyang kontrol” o “upang muling maitatag ang kaniyang paghahari”; sa literal, “upang ibalik ang kaniyang kamay.”
    reason: lexical_alternative
  - marker: c
    text: Malamang na tumutukoy ito sa Ilog Eufrates.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: Tinalo
  rationale: Sa konteksto ng digmaan, ang נכה ay maaaring tumukoy sa pananakit na humahantong sa pagkatalo. Ang “tinalo” ay natural sa Filipino at hindi nagpapahiwatig na tiyak na pinatay siya.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Tinutumbasan sa transliterasyon ang anyo ng pangalan sa WLC; inilalagay sa talababa ang ibang anyong “Hadarezer.”
- source_word: בֶּן רְחֹב
  choice: anak ni Rehob
  rationale: Likas at tuwirang salin sa Filipino ng patronimikong parirala.
- source_word: מֶלֶךְ צוֹבָה
  choice: hari ng Zoba
  rationale: Tuwirang isinasaad ang paghahari niya sa lugar na Zoba, na tinutumbasan sa transliterasyon.
- source_word: בְּלֶכְתּוֹ
  choice: nang pumunta ito
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng pangyayaring temporal. Ginamit ang “ito” upang maging malinaw na si Hadadezer, hindi si David, ang tinutukoy.
- source_word: לְהָשִׁיב יָדוֹ
  choice: upang muling maitatag ang kapangyarihan niya
  rationale: Idyomatiko ang literal na “ibalik ang kanyang kamay,” kung saan ang “kamay” ay tumutukoy sa kapangyarihan o kontrol. Pinananatili ng “kapangyarihan” ang lawak ng kahulugan, habang itinatala sa talababa ang literal at iba pang posibleng pagbasa.
- source_word: בִּנְהַר
  choice: sa Ilog
  rationale: Pinananatili sa pangunahing teksto ang absolutong katawagang “ang Ilog,” na malamang na tumutukoy sa Eufrates; ibinibigay ang pagkakakilanlang iyon sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tinalo” bilang natural na pananalitang militar; ang “ito” ay nag-aalis ng kalabuan sa panghalip nang hindi binabago ang tinutukoy. Pinanatili ang “Ilog” sa teksto at ipinaliwanag ang malamang na Eufrates sa talababa.
