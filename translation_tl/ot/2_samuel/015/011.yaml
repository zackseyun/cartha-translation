base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: tl
  text: May dalawang daang lalaki mula sa Jerusalem na sumama kay Absalom. Inanyayahan sila, at sumama silang walang kamalay-malay; wala silang anumang nalalaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at wala silang nalalamang anumang bagay.” Ang “walang kamalay-malay” ay maaari ring isalin na “sa kanilang kawalang-malay” o, sa ibang konteksto, “nang may katapatan/integridad.” Ipinahihiwatig ng konteksto na hindi nila alam ang balak ni Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... אֶת־אַבְשָׁלוֹם
  choice: sumama kay Absalom
  rationale: Ang הלך ay ‘pumunta/lumakad,’ at kasama ng אֶת־אַבְשָׁלוֹם ay nagpapahiwatig ng pagsama; natural itong ipinahahayag sa Tagalog bilang ‘sumama kay Absalom.’
- source_word: מָאתַיִם אִישׁ
  choice: dalawang daang lalaki
  rationale: Tahasang panlalaki ang אִישׁ at ginagamit dito sa pagbilang ng mga lalaki.
- source_word: מִירוּשָׁלַםִ
  choice: mula sa Jerusalem
  rationale: Ang מִן ay nagpapahayag ng pinagmulan.
- source_word: קְרֻאִים
  choice: Inanyayahan sila
  rationale: Ang passive participle ng קרא ay nangangahulugang ‘mga inanyayahan.’ Hindi idinagdag ang ‘mga panauhin’ upang manatiling malapit sa tahasang sinasabi ng Hebreo.
- source_word: לְתֻמָּם
  choice: wala silang kamalay-malay
  rationale: Sa konteksto, ang תֹּם/תֻּם ay tumutukoy sa inosente at walang-hinalang pagsama, gaya ng nililinaw ng kasunod na sugnay na wala silang nalalaman.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: sapagkat wala silang anumang nalalaman tungkol sa balak
  rationale: Nililinaw ng sugnay kung bakit wala silang kamalay-malay. Ang ‘tungkol sa balak’ ay kontekstuwal na paglilinaw sa ‘anumang bagay,’ at minarkahan sa talababa upang hindi maitago ang mas literal na anyo.
