translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang pag-uulit ng kilos at ang diin sa kawalang-malay ng mga inanyayahan.
