    text: Maaari ring “may alitan” o “may kasong legal” para sa “may usapin”; ang Hebreong רִיב ay maaaring tumukoy sa alitan, reklamo, o kasong dinidinig sa hukuman.
    reason: lexical_alternative
  revision_rationale: Binago ang paglalarawan ng paglapit sa hari upang malinaw na ang hinahangad ay hatol sa usapin, hindi paghatol sa taong lumalapit. Pinili ang mas tuwirang pandiwa para sa pagtayo, inalis ang di-tahasang dagdag na “bayan,” at pinag-isa ang antas ng panghalip sa diyalogo. Nananatili ang aspektong paulit-ulit ng Hebreong salaysay sa “bumabangon,” “tumatayo,” “lumalapit,” “tinatawag,” at “tinatanong.”
