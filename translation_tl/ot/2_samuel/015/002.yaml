  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: tl
  text: Maagang bumabangon si Absalom at tumatayo sa tabi ng daang papunta sa tarangkahan. Tuwing may taong may usapin[a] at lumalapit sa hari upang humingi ng hatol, tinatawag siya ni Absalom at tinatanong, “Taga-saang lungsod ka?” At sumasagot siya, “Ang iyong lingkod ay mula sa isa sa mga lipi ng Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may alitan” o “may kasong legal” para sa “may usapin”; ang Hebreong רִיב ay maaaring tumukoy sa alitan, reklamo, o kasong dinidinig sa hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: Maagang bumabangon
  rationale: Ipinahahayag ng pandiwa ang maagang pagbangon; ginamit ang aspektong di-ganap upang ipakita ang paulit-ulit na gawain ni Absalom sa konteksto.
- source_word: וְעָמַד
  choice: pumupuwesto
  rationale: Bagaman pangunahing nangangahulugang ‘tumayo,’ mas likas sa Filipino ang ‘pumupuwesto’ para sa sinasadyang paulit-ulit na pagtayo sa isang lugar.
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: sa tabi ng daang papunta sa pintuang-bayan
  rationale: Pinananatili ang lokasyong ‘sa tabi’ at inuunawa ang construct phrase bilang daang patungo sa tarangkahan; nilinaw ng ‘pintuang-bayan’ ang pampublikong pasukan nang hindi dinaragdagan ang diwa.
- source_word: וַיְהִי כָּל הָאִישׁ אֲשֶׁר יִהְיֶה־לּוֹ רִיב
  choice: Tuwing may taong may usapin
  rationale: Ipinakikita ng ‘tuwing’ ang paulit-ulit na pangyayari. Ang רִיב ay maaaring tumukoy sa alitan, reklamo, o kasong legal, kaya pinili ang malawak ngunit angkop-sa-kontekstong ‘usapin.’
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: dinadala sa hari upang hatulan
  rationale: Inilalarawan nito ang paglapit sa hari para sa pasyang panghukuman. Ang ‘upang hatulan’ ay natural at malinaw sa Filipino.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: tinatawag siya ni Absalom
  rationale: Tumutukoy ito sa pagtawag sa tao, hindi kinakailangang isang pormal na pagpapatawag.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: Taga-saang lungsod ka?
  rationale: Likas na modernong Filipino para sa tanong tungkol sa lungsod na pinagmulan.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa isa sa mga lipi ng Israel
  rationale: Tapat na ipinahahayag ang pinagmulan ayon sa lipi, habang pinananatili ang malawak na pagtukoy ng Hebreo.
- source_word: עַבְדֶּךָ
  choice: Ang inyong lingkod
  rationale: Magalang na pagtukoy sa sarili sa harap ng isang maharlikang tao; hindi ipinapalagay na ang nagsasalita ay alipin sa legal na kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pintuang-bayan’ upang ipahiwatig ang tarangkahan ng lungsod at ang aspektong di-ganap upang katawanin ang paulit-ulit na kilos. Ang magalang na ‘inyong lingkod’ ay nagpapanatili sa pormal na pananalita ng kausap kay Absalom.
