base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: tl
  text: At ang lahat ng lingkod niya ay dumaraan sa tabi niya. Ang lahat ng Kereteo, ang lahat ng Peleteo, at ang lahat ng Gateo—animnaraang lalaking sumama sa kanya mula sa Gat[a]—ay dumaraan sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na dumating sa kaniyang paa mula sa Gat.” Maaaring idyoma ito para sa “sumunod sa kanya mula sa Gat” o “sumama sa kanyang pangkat mula sa Gat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: mga lingkod niya
  rationale: Pinananatili ng “mga lingkod” ang malawak na kahulugan ng עֶבֶד nang hindi nililimitahan ang mga ito sa mga opisyal o kawal.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: dumaan sa tabi niya
  rationale: Ang עַל־יָד ay idyomang tumutukoy sa pagiging nasa tabi o gilid; natural sa Filipino ang “sa tabi niya.”
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: mga Kereteo at Peleteo
  rationale: Mga katawagan ito sa mga grupong naglilingkod kay David, kaya tinumbasan sa anyong transliterado sa halip na bigyan ng mapagpakahulugang salin.
- source_word: הַגִּתִּים
  choice: mga Gateo
  rationale: Tumutukoy ito sa mga taga-Gat; ang “mga Gateo” ay maikli at karaniwang anyong Filipino ng katawagang etniko.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: animnaraang lalaki
  rationale: Tuwirang ipinahahayag ang bilang at hindi idinaragdag ang “kawal,” bagaman maaaring ipinahihiwatig iyon ng konteksto.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: na sumama sa kanya mula sa Gat
  rationale: Ang literal na “dumating sa pamamagitan ng kanyang paa” ay isang idyoma para sa pagsama o pagsunod sa isang tao. Mas malinaw at natural sa Filipino ang “sumama sa kanya,” habang inilalagay sa talababa ang literal na larawan at alternatibong pagbasa.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: dumaan sila sa harap ng hari
  rationale: Ang עַל־פְּנֵי ay natural na “sa harap ng”; inuulit ang pandiwa upang maging malinaw ang kilos ng mga pangkat sa prusisyon.
