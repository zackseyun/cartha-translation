  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: tl
  text: Sinabi ni David kay Itai, “Humayo ka at tumawid.” Kaya tumawid si Itai na taga-Gat, kasama ang lahat ng kanyang mga tauhan at lahat ng mga bata na kasama niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: Sige, tumawid ka
  rationale: Ang לֵךְ ay ginagamit dito bilang pahintulot o paghimok na magpatuloy, kasunod ng tiyak na utos na tumawid; natural na ipinahahayag ito sa modernong Tagalog sa pamamagitan ng “Sige.”
- source_word: הַגִּתִּי
  choice: na Geteo
  rationale: Tumutukoy ito sa isang taong mula sa Gat; “Geteo” ang malinaw at tradisyonal na katawagang Filipino para sa gentiliko.
- source_word: אֲנָשָׁיו
  choice: mga tauhan niya
  rationale: Sa kontekstong militar at pampulitika, ang “mga tauhan” ay mas angkop kaysa sa pangkalahatang “mga lalaki.”
- source_word: הַטַּף
  choice: mga bata
  rationale: Karaniwang tumutukoy ang salita sa maliliit na bata o mga musmos bilang bahagi ng sambahayan; pinili ang natural at sapat na malawak na “mga bata.”
