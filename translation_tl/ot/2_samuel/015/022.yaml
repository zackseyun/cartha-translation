    rationale: Ang “taga-Gat” ay tuwiran, madaling unawain, at malinaw na nagpapahiwatig ng pinagmulan/katayuang gentiliko ni Itai.
  - severity: low
    issue: Maaaring magtunog di-gaanong natural ang “lahat ng batang kasama niya.”
    rationale: Ang “lahat ng mga bata na kasama niya” ay malinaw na maramihan at ipinapakita ang הַטַּף bilang mga batang kasama niya.
