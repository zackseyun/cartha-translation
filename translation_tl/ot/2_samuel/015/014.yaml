source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: tl
  text: Sinabi ni David sa lahat ng kanyang mga lingkod na kasama niya sa Jerusalem, “Bumangon kayo at tumakas tayo, sapagkat hindi tayo makatatakas kay Absalom. Magmadali kayong umalis[a], baka magmadali rin siya at maabutan tayo, magpasapit ng kapahamakan sa atin[b], at salakayin ang lungsod sa talim ng tabak[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na “Magmadali kayong lumakad.” Ang Hebreo ay literal na pautos na “magmadali sa paglakad,” na sa konteksto ay nangangahulugang umalis agad.
    reason: lexical_alternative
  - marker: b
    text: Maaaring isalin na “magpasapit ng kasamaan sa atin.” Dito, ang “kasamaan” ay tumutukoy sa kalamidad o kapahamakan, hindi sa moral na kasamaan.
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa bibig ng tabak,” isang Hebreong idyoma para sa pagpatay sa pamamagitan ng tabak.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Ang עֶבֶד ay maaaring mangahulugang lingkod o alipin; sa konteksto ng maharlikang sambahayan, ang “mga lingkod” ay natural at hindi labis na tumutukoy sa kanilang legal na kalagayan.
- source_word: קוּמוּ
  choice: Bumangon kayo
  rationale: Maramihang pautos ito mula sa קום. Ipinahahayag ng “Bumangon kayo” ang agarang pagkilos sa natural at marangal na modernong Tagalog.
- source_word: וְנִבְרָחָה
  choice: at tumakas tayo
  rationale: Ang cohortative na unang panauhang maramihan ay isang panawagang kasama ang nagsasalita; pinananatili ng “tumakas tayo” ang kolektibo at agarang diwa.
- source_word: פְלֵיטָה
  choice: makatatakas
  rationale: Sa konteksto, tumutukoy ang pangngalan sa pagkaligtas sa pamamagitan ng pagtakas. Ang pandiwang anyong Tagalog ay natural at hindi nagdaragdag ng tahasang ideya ng banal na pagliligtas.
- source_word: מִפְּנֵי אַבְשָׁלוֹם
  choice: kay Absalom
  rationale: Ang parirala ay literal na “mula sa harapan ni Absalom,” ngunit dito ay nagpapahiwatig ng pagtakas mula sa banta niya; malinaw itong naihahatid ng “makatatakas kay Absalom.”
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Magmadali kayong umalis
  rationale: Ang pautos na sinusundan ng pawatas ay nagpapatingkad sa pagmamadali. Mas natural sa Tagalog ang “umalis” kaysa sa literal na “lumakad” sa kontekstong ito.
- source_word: פֶּן
  choice: baka
  rationale: Ipinakikilala ng פֶּן ang kinatatakutang maaaring mangyari; ang “baka” ang natural na katumbas nito sa kasalukuyang Tagalog.
- source_word: יְמַהֵר וְהִשִּׂגָנוּ
  choice: baka magmadali rin siya at maabutan tayo
  rationale: Pinananatili nito ang pag-uulit ng ideya ng pagmamadali at ang diwa ng paghabol at pag-abot sa tumatakas.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: magpasapit ng kapahamakan sa atin
  rationale: Dito ang רָעָה ay tumutukoy sa kalamidad o kapahamakan, hindi kinakailangang sa moral na kasamaan. Ang “magpasapit” ay angkop sa idiomang sanhi ng kapahamakang dumarating sa isang tao.
- source_word: וְהִכָּה הָעִיר
  choice: salakayin ang lungsod
  rationale: Sa kontekstong militar, ang נכה ay tumutukoy sa pananakit o paglusob sa lungsod. Ang “salakayin” ay mas natural kaysa sa literal ngunit malabong “hampasin.”
- source_word: לְפִי חָרֶב
  choice: sa talim ng tabak
  rationale: Ito ang malinaw na katumbas ng Hebreong idyoma na literal na “sa bibig ng tabak,” at pinananatili ang larawan ng marahas na pagpatay sa pamamagitan ng tabak.
