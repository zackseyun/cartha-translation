base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: tl
  text: At ang buong lupain[a] ay umiiyak nang malakas, at ang buong bayan ay tumatawid. Tumawid din ang hari sa Lambak ng Kidron[b], at ang buong bayan ay tumatawid sa daang patungo sa ilang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buong lupain” ay isang kolektibong paglalarawan sa mga taong nasa lupain at sa kanilang laganap na pagluluksa.
    reason: idiom_note
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa isang lambak, bangin, o pana-panahong daluyan ng tubig; tradisyonal din itong isinasalin na “Batis ng Kidron.”
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin, “sa ruta ng ilang.” Bahagyang siksik at malabo ang pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: ang buong lupain
  rationale: 'Pinananatili nito ang kolektibong larawang Hebreo: ang lupain ay inilalarawang umiiyak, na tumutukoy sa mga taong naroon at sa laganap na pagluluksa.'
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: ay umiiyak nang malakas
  rationale: Ang literal na larawan ay ‘umiiyak sa malakas na tinig’; ang saling ito ay natural sa modernong Tagalog at malinaw na nagpapahayag ng naririnig na matinding pagluluksa.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Ang עָם ay tumutukoy sa kabuuan ng mga taong kasama ni David, hindi lamang sa mga kawal. Ang ‘buong bayan’ ay kolektibo at marangal sa rehistrong pasalaysay.
- source_word: עֹבְרִים / עֹבֵר
  choice: tumatawid / tumawid
  rationale: Ipinahihiwatig ng ugat na עבר dito ang pagtawid sa isang hangganan o libis. Ginamit ang aspektong nagaganap para sa kilos ng bayan at aspektong ganap para sa tiyak na pagtawid ng hari.
- source_word: בְּנַחַל קִדְרוֹן
  choice: sa Lambak ng Kidron
  rationale: Ang נחל ay maaaring tumukoy sa wadi, bangin, o pana-panahong daluyan ng tubig. Ang ‘Lambak ng Kidron’ ay malinaw at natural sa modernong Tagalog nang hindi ipinapalagay na palaging may umaagos na batis.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: sa daang patungo sa ilang
  rationale: Siksik at bahagyang malabo ang pariralang Hebreo, ngunit malinaw na tumutukoy ito sa ruta o direksiyon papunta sa ilang. Pinananatili ng saling ito ang diwa nang hindi labis na nagpapaliwanag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig ng salaysay. Pinanatili ang kolektibong personipikasyon ng ‘buong lupain,’ habang ginawang natural ang idyomang tumutukoy sa malakas na pag-iyak. Ginamit ang ‘ilang’ para sa wilderness at ‘Lambak ng Kidron’ para sa topograpikong katawagang נחל.
