  source_fidelity: 'Tumpak ang pangunahing kahulugan: ang buong lupain ay inilalarawang nagluluksa nang malakas; ang mga tao ay tumatawid; tumawid ang hari sa Kidron; at nagpatuloy ang mga tao sa daang patungo sa ilang. Ang aspekto ng mga participle sa Hebreo ay maayos na naipapahiwatig sa “ay tumatawid,” samantalang ang pagtawid ng hari ay isang tiyak na kilos sa salaysay.'
  naturalness: May bahagyang kalabuan sa “umiiyak nang malakas habang tumatawid ang buong bayan,” dahil ang “habang” ay mahigpit na nag-uugnay sa dalawang sugnay at maaaring pansamantalang magmukhang ang pag-iyak ang kilos na kaugnay ng bayan. Mas malinaw at mas malapit sa sunod-sunod na mga sugnay Hebreo ang paghihiwalay sa mga ito sa pamamagitan ng “at.”
  terminology: Ang “Lambak ng Kidron,” “ilang,” at “buong bayan” ay angkop sa modernong Filipino Tagalog at sa marangal na rehistro ng salaysay. Ang “buong lupain” ay wastong pagpapanatili ng kolektibong idyomang Hebreo. Ang tala sa Kidron ay maingat na hindi nagtatakda ng iisang topograpikong kahulugan para sa נחל.
