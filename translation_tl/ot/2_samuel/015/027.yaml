base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: tl
  text: 'Pagkatapos, sinabi ng hari sa paring si Zadok, “Tagakita ka ba?[a] Bumalik ka nang payapa sa lungsod, kasama mo ang dalawang anak na lalaki ninyo[b]: ang anak mong si Ahimaas at si Jonatan na anak ni Abiatar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “Nakikita mo ba?” Ang salitang Hebreo ay maaaring tumukoy kay Zadok bilang isang “tagakita” o maging tanong tungkol sa pagkakita o pagkaunawa.
    reason: lexical_alternative
  - marker: b
    text: Maramihan sa Hebreo ang “ninyo” at “kasama ninyo,” bagaman si Zadok ang tuwirang kinakausap. Malamang na kabilang dito si Abiatar o ang kanilang pangkat.
    reason: source_grammar_ambiguity
lexical_decisions:
- source_word: הֲרֹאֶה אַתָּה
  choice: Ikaw ba ay tagakita?
  rationale: Pinananatili nito ang maaaring pagkaunawa sa רֹאֶה bilang ‘tagakita’ at ang anyong patanong ng parirala, nang hindi ito nililimitahan sa literal na pisikal na pagkakita.
- source_word: שֻׁבָה הָעִיר
  choice: Bumalik ka ... sa lungsod
  rationale: Ang שׁוב na may directional he ay pautos na pabalik sa isang lugar; likas sa modernong Tagalog ang ‘bumalik ka sa lungsod.’
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Ipinahahayag ang kalagayang mapayapa at ligtas na kaugnay ng שָׁלוֹם, habang nananatiling natural sa Tagalog.
- source_word: שְׁנֵי בְנֵיכֶם
  choice: ang inyong dalawang anak
  rationale: Pangalawang panauhang maramihan ang hulapi sa Hebrew. Ang ‘inyong’ ay nagpapanatili na sina Ahimaas at Jonatan ay mga anak nina Zadok at Abiatar ayon sa pagkakabanggit, hindi kapwa anak ni Zadok.
- source_word: וַאֲחִימַעַץ בִּנְךָ וִיהוֹנָתָן בֶּן־אֶבְיָתָר
  choice: ang anak mong si Ahimaas at si Jonatan na anak ni Abiatar
  rationale: 'Pinananatili ang magkatulad ngunit hindi magkaparehong pagkakakilanlan: si Ahimaas ang anak ni Zadok, at si Jonatan ang anak ni Abiatar.'
- source_word: אִתְּכֶם
  choice: kasama
  rationale: Natural na ipinahahayag sa Tagalog ang pagsama; ang maramihang saklaw ay makikita na sa ‘inyong dalawang anak’ at sa kabuuang tagubilin sa pangkat.
theological_decisions:
- issue: Pagkakakilanlan ng הֲרֹאֶה bilang titulo o tanong tungkol sa pagkakita
  choice: Ikaw ba ay tagakita?
  alternative: Nakikita mo ba? / Nauunawaan mo ba?
  rationale: Hindi tiyak kung ang רֹאֶה ay pangngalang ‘tagakita’ o participle/pandiwang tumutukoy sa pagkakita o pagkaunawa. Pinili sa teksto ang ‘tagakita’ ngunit inilagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘paring si Zadok’ sa halip na mas mabigat na ayos. Pinanatili ang paglipat mula sa isahang ‘ka/mo’ para kay Zadok tungo sa maramihang ‘inyong,’ na mahalaga dahil ang dalawang anak ay kina Zadok at Abiatar ayon sa pagkakabanggit.
