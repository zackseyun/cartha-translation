revisions:
- from: 'Pagkatapos, sinabi ng hari sa paring si Zadok, “Ikaw ba ay tagakita?[a] Bumalik ka nang payapa sa lungsod, kasama ang inyong dalawang anak: ang anak mong si Ahimaas at si Jonatan na anak ni Abiatar.”'
  to: 'Pagkatapos, sinabi ng hari sa paring si Zadok, “Tagakita ka ba?[a] Bumalik ka nang payapa sa lungsod, kasama mo ang dalawang anak na lalaki ninyo[b]: ang anak mong si Ahimaas at si Jonatan na anak ni Abiatar.”'
  rationale: Inayos ang ayos ng tanong upang maging likas sa modernong Tagalog. Idinagdag ang “na lalaki” upang katawanin ang tinutukoy na mga anak sa Hebreo. Pinanatili ang maramihang possessive na “ninyo,” ngunit ginawang “kasama mo” ang pangunahing pangungusap upang malinaw na si Zadok ang inuutusang bumalik; ang natitirang tekstuwal na tensiyon ng maramihang anyo ay malinaw na itinatala sa talababa.
