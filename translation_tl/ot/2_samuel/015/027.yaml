    rationale: Iisang tao si Zadok na tuwirang kinakausap sa unang bahagi, ngunit maramihan ang “inyo” sa “inyong dalawang anak” at “kasama ninyo.” Ang isang maikling talababa ay nakapagpapanatili ng anyo at ambigwidad ng pinagmulan nang hindi ito ipinipilit ipaliwanag sa pangunahing teksto.
