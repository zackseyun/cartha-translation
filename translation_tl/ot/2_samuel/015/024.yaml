  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: tl
  text: At narito, dumating din si Zadok, kasama ang lahat ng Levita na nagdadala ng kaban ng tipan ng Diyos. Inilapag nila ang kaban ng Diyos[a], at umakyat si Abiatar[b] hanggang sa matapos makatawid mula sa lungsod[c] ang buong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilagay nila ang kaban ng Diyos.” Maaaring tumukoy ang pandiwang Hebreo sa paglalapag o paglalagay nito roon.
    reason: lexical_alternative
  - marker: b
    text: Maaaring “pumaroon sa itaas si Abiatar.” Literal na “umakyat” ang Hebreo, ngunit hindi tiyak ang eksaktong detalye ng kilos sa salaysay.
    reason: alternative_reading
  - marker: c
    text: Ibig sabihin, mula sa Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At naroon
  rationale: Ipinakikilala nito ang isang bagong tagpo at itinutuon ang pansin kay Zadok. Natural ito sa makabagong Tagalog at iniiwasan ang makalumang “narito” o “masdan.”
- source_word: גַם צָדוֹק
  choice: din si Zadok
  rationale: Pinananatili ng “din” ang pandagdag na diwa ng גַם.
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: kasama ang lahat ng Levita
  rationale: Malinaw at likas na tumutukoy ang “kasama” sa mga Levitang kasama ni Zadok.
- source_word: נֹשְׂאִים
  choice: na nagdadala
  rationale: Isinasalin ang participle bilang nagpapatuloy na kilos at gumagamit ng karaniwang makabagong salita.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: kaban ng tipan ng Diyos
  rationale: Pinananatili ang buong ugnayang konstrakto at ang tahasang pagtukoy sa tipan at sa Diyos.
- source_word: וַיַּצִּקוּ
  choice: Inilapag nila
  rationale: Sa konteksto ng pagdadala sa kaban, ipinahihiwatig ng pandiwa ang pagbaba at paglalagay nito sa isang lugar. Ang “inilapag” ay malinaw ngunit hindi labis na nagpapakahulugan.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: at umakyat si Abiatar
  rationale: Pinananatili ang pangunahing diwa ng pataas na pagkilos ng עלה at hindi ito ginagawang paghahandog o ibang gawaing pari.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: hanggang sa makatawid ... ang buong bayan
  rationale: Natural na Tagalog para sa temporal na hangganang ipinapahayag ng עַד תֹּם, habang pinananatili ang diwa ng pagtawid.
- source_word: מִן הָעִיר
  choice: mula sa lungsod
  rationale: Tuwirang pinananatili ang pangkalahatang “lungsod” sa Hebreo sa halip na ipalit ang kontekstuwal na pangalang Jerusalem.
theological_decisions:
- issue: Pagkakakilanlan ng “lungsod”
  choice: lungsod
  alternative: Jerusalem
  rationale: “Ang lungsod” lamang ang tahasang sinasabi ng Hebreo. Bagaman Jerusalem ang malinaw na tinutukoy sa konteksto, inilalagay ang pagkakakilanlang iyon sa talababa upang hindi mapalitan ang mismong anyo ng teksto.
- issue: Diwa ng וַיַּעַל אֶבְיָתָר
  choice: umakyat si Abiatar
  alternative: dumating si Abiatar / naghandog si Abiatar
  rationale: Ang anyong Hebreo mula sa עלה ay pangunahing nagsasaad ng pataas na pagkilos. Pinananatili ng salin ang di-tiyak na detalye ng salaysay at hindi nagdaragdag ng gawaing pangpari na hindi tahasang nakasaad.
- issue: Pagkilos sa kaban sa וַיַּצִּקוּ
  choice: Inilapag nila ang kaban
  alternative: Inilagay nila ang kaban
  rationale: Ang konteksto ay nagpapahiwatig na ibinaba at inilagay muna ang kaban habang tumatawid ang bayan. Binabanggit sa talababa ang mas malawak na posibleng diwa ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaban ng tipan” bilang pamilyar na katawagang biblikal, ngunit iniwasan ang makalumang panawagang “masdan.” Pinanatili sa pangunahing teksto ang mga hindi tiyak na detalye ng mga pandiwang Hebreo at ipinaliwanag ang mga lehitimong alternatibo sa mga talababa.
