  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: tl
  text: Kaya ibinalik nina Zadok at Abiatar ang kaban ng Diyos sa Jerusalem, at nanatili sila roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ibinalik
  rationale: 'Ang anyong Hiphil ng שׁוב ay sanhi o palipat: ipinabalik o dinala pabalik nina Zadok at Abiatar ang kaban. Likas at tuwiran sa modernong Filipino ang “ibinalik.”'
- source_word: צָדוֹק וְאֶבְיָתָר
  choice: nina Zadok at Abiatar
  rationale: Isinalin ang mga pangalang pantangi ayon sa karaniwang anyong Filipino; ginamit ang “nina” dahil sila ang magkasamang tagaganap ng palipat na pandiwa.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Pinanatili ang tiyak na pariralang Hebreo na “kaban ng Diyos” at hindi idinagdag ang “tipan,” na wala sa talatang ito.
- source_word: יְרוּשָׁלָם
  choice: sa Jerusalem
  rationale: Ipinahihiwatig ng pandiwa at konteksto ang patungong direksiyon; natural itong ipinapahayag sa Filipino sa pamamagitan ng “sa.”
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: at nanatili sila roon
  rationale: Sa kontekstong pasalaysay, ipinapahayag ng ישׁב ang patuloy nilang pananatili sa lugar. Dignified at malinaw ang “nanatili sila roon.”
