  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: tl
  text: Umalis ang hari, at sumunod sa kanya nang naglalakad ang buong sambahayan niya.[a] Iniwan ng hari ang sampung babae na kanyang mga kalunya upang magbantay sa bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at ang buong sambahayan niya ay nasa paanan niya.” Ipinahihiwatig ng idyomang Hebreo na sumunod sila sa kanya nang naglalakad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Ang יצא sa anyong pasalaysay ay tumutukoy sa paglabas o pag-alis. Likas sa Filipino ang “umalis” sa tagpong ito at hindi nito dinaragdagan ang diwa.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinanatili ang titulong ginamit ng Hebreo sa halip na palitan ito ng pangalang David.
- source_word: וְכָל בֵּיתוֹ
  choice: ang buong sambahayan niya
  rationale: Dito, ang בַּיִת na may hulaping paari ay tumutukoy sa mga taong kabilang sa sambahayan ng hari, hindi sa gusali.
- source_word: בְּרַגְלָיו
  choice: sumunod sa kanya nang naglalakad
  rationale: Literal itong “sa kanyang mga paa,” ngunit idyomatikong ipinahihiwatig na sumunod sila sa hari nang naglalakad. Isinasalin ang diwa sa natural na Filipino habang itinatala sa talababa ang literal na anyo.
- source_word: וַיַּעֲזֹב
  choice: iniwan
  rationale: Ang עזב dito ay pag-iiwan sa lugar. Hindi ginamit ang “pinabayaan,” na maaaring magpahiwatig ng mas matinding negatibong paghatol.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: ang sampung babae na kanyang mga kalunya
  rationale: Pinananatili ang parehong “mga babae” at ang kasunod na paglalarawang “mga kalunya,” gaya ng apposisyon sa Hebreo.
- source_word: לִשְׁמֹר
  choice: upang magbantay
  rationale: Saklaw ng שׁמר ang pagbabantay, pag-iingat, at pangangalaga. Ang “magbantay” ay malinaw at natural kaugnay ng bahay na naiwan.
- source_word: הַבָּיִת
  choice: sa bahay
  rationale: Tumutukoy ito rito sa pisikal na tirahan ng hari. Pinanatili ang pangkalahatang “bahay” sa halip na ang mas interpretibong “palasyo.”
