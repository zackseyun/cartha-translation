translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” para sa mga taong kabilang sa bahay ng hari at “bahay” para sa mismong tirahan. Pinanatili ang “mga kalunya” bilang tuwirang katawagang nauunawaan sa kasalukuyang Filipino.
