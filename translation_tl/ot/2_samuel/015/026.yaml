  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: tl
  text: Ngunit kung sabihin niya, “Hindi ako nalulugod sa iyo,” narito ako; gawin niya sa akin ang minamabuti niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ayon sa mabuti sa paningin niya,” isang idyomang nangangahulugang “ayon sa minamabuti niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng pangatnig at kondisyunal ang kasalungat na posibilidad sa naunang talata.
- source_word: כֹּה יֹאמַר
  choice: sabihin niya
  rationale: Ang כֹּה kasama ng אמר ay likas na nagpapakilala ng tuwirang pananalita; ang imperpektibo ay tumutukoy sa isang posibleng pangyayari.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Hindi ako nalulugod sa iyo
  rationale: Pinananatili ng “nalulugod” ang relasyonal at mapagpahalagang diwa ng חפץ nang hindi nagpapahiwatig ng pisikal na pagnanasa.
- source_word: הִנְנִי
  choice: narito ako
  rationale: Karaniwang pormula ito ng paghaharap ng sarili na dito ay nagpapahayag ng kahandaan at pagpapasakop.
- source_word: יַעֲשֶׂה לִּי
  choice: gawin niya sa akin
  rationale: Ipinahahayag ng anyong pandiwa ang kusang pagtanggap at pagpapasakop sa gagawin ng Diyos.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: ang anumang mabuti sa paningin niya
  rationale: Pinananatili nito ang Hebreong larawang “mabuti sa kanyang mga mata” sa natural na Filipino; ang kahulugan ay anumang minamabuti niya.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na ikatlong panauhan
  choice: Pinanatili ang “niya” na tumutukoy sa PANGINOON ayon sa konteksto.
  alternative: Ulitin ang “PANGINOON” sa halip na gumamit ng panghalip.
  rationale: Mga panghalip lamang ang nasa Hebreo at malinaw sa mga nakapaligid na talata na ang Diyos ang tinutukoy; hindi kailangang magdagdag ng pangalang wala sa talata.
- issue: Lakas ng pagpapasakop sa הִנְנִי at יַעֲשֶׂה
  choice: “narito ako; gawin niya sa akin”
  alternative: “narito ako; maaari niyang gawin sa akin”
  rationale: Mas tuwirang pinananatili ng pinili ang handang pagpapasakop ni David, nang hindi ito ginagawang simpleng pahayag lamang ng kakayahan o pahintulot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nalulugod” upang panatilihin ang relasyonal na diwa ng pandiwa, at ang “mabuti sa paningin niya” upang mapanatili ang Hebreong larawan nang may paliwanag sa talababa.
