base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: tl
  text: Pagkatapos nito, naglaan[a] si Absalom para sa sarili niya ng isang karwahe, mga kabayo, at limampung lalaking tumatakbo sa unahan niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumawa” o “kumuha.” Maaaring mangahulugan ang pandiwang Hebreo ng paggawa o paglalaan/pagkuha.
    reason: lexical_alternative
  - marker: b
    text: Ang limampung lalaking tumatakbo sa unahan niya ay bumubuo ng pangkat na gaya ng maharlikang eskorte, na nagpapahiwatig ng hayagang pagtataas ni Absalom sa sarili.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na salin sa makabagong Tagalog ng pormulang Hebreo na nag-uugnay sa salaysay sa naunang pangyayari.
- source_word: וַיַּעַשׂ לוֹ
  choice: naglaan ... para sa sarili niya
  rationale: Maaaring tumukoy ang עשה sa paggawa o pagkuha/paglalaan. Sa kontekstong karwahe, mga kabayo, at mga tagatakbo, natural ang “naglaan” at napananatili nito ang diwang para sa sariling gamit.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang karaniwang anyo ng pangalan sa tradisyong biblikal sa Filipino.
- source_word: מֶרְכָּבָה
  choice: isang karwahe
  rationale: Tuwirang tumutukoy ang pangngalan sa karwahe; hindi idinagdag sa pangunahing teksto ang ipinahihiwatig na maharlikang simbolismo.
- source_word: וְסֻסִים
  choice: at mga kabayo
  rationale: Pinananatili ang payak na pagkakaugnay at maramihang bilang ng Hebreo.
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: pati ng limampung lalaki
  rationale: Ang אִישׁ kasunod ng bilang ay karaniwang pananalitang pambilang; ang “lalaki” ay angkop sa kasarian at konteksto.
- source_word: רָצִים לְפָנָיו
  choice: tumatakbo sa unahan niya
  rationale: Inilalarawan ng participle ang patuloy o nakatalagang pagkilos ng mga lalaki sa harap ni Absalom; natural at malinaw ito sa Tagalog.
theological_decisions:
- issue: Pampolitika at maharlikang simbolismo ng pangkat ni Absalom
  choice: Inilarawan lamang sa pangunahing teksto ang karwahe, mga kabayo, at mga lalaking tumatakbo sa unahan niya.
  alternative: Hayagang tawaging maharlikang prusisyon o pagpapanggap na hari ang pangkat.
  rationale: Ipinahihiwatig ng ayos ng pangkat ang pag-aangking maharlika at pagpapataas sa sarili, ngunit hindi ito tahasang sinasabi ng Hebreo. Iniingatan ng salin ang pahiwatig nang hindi ito ginagawang lantad na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “para sa sarili niya” upang likas na maipahayag ang reflexive na diwa, at iniwasang gawing tahasang maharlika ang “karwahe” sa pangunahing teksto.
