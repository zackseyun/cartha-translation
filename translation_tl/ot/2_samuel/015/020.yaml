  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: tl
  text: Kahapon ka lamang dumating, at ngayo’y palalabuyin pa ba kita kasama namin, samantalang ako nama’y pupunta kung saan man ako mapunta?[a] Bumalik ka at isama mong pabalik ang iyong mga kapatid.[b] Sumaiyo nawa ang tapat na pag-ibig at katapatan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “samantalang ako ay pumupunta kung saan ako pumupunta.” Ipinahihiwatig ng idyomang Hebreo ang kawalang-katiyakan ng pagtakas ni David.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay malamang na tumutukoy sa mga kasamahan o kamag-anak ni Itai na dumating na kasama niya.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “tapat na pag-ibig at katapatan,” isang karaniwang pares ng mga salitang tumutukoy sa matatag na pag-ibig at pagiging maaasahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Kahapon ka lamang dumating
  rationale: Ang תְּמוֹל ay literal na “kahapon” at maaari ring magpahiwatig ng kamakailan lamang; ipinahahayag ng “lamang” na bagong dating si Itai.
- source_word: אֲנוּעֲךָ עִמָּנוּ לָלֶכֶת
  choice: palalabuyin pa ba kita kasama namin
  rationale: Ang anyong causative ng נוע ay tumutukoy sa pagpapagala o pagpapalaboy. Ang “palalabuyin” ay nagpapanatili sa diwa ng sapilitang paglalakbay na walang tiyak na hantungan.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: samantalang ako nama’y pupunta kung saan man ako mapunta
  rationale: Pinananatili nito ang pag-uulit at likas na kalabuan ng Hebreo, pati ang kawalang-katiyakan ng pagtakas ni David, nang hindi nagdaragdag ng ideyang “maaari” o “dapat.”
- source_word: שׁוּב וְהָשֵׁב
  choice: Bumalik ka at isama mong pabalik
  rationale: Ang unang pandiwa ay utos na bumalik; ang ikalawa ay causative, kaya ang iba ay isasamang pabalik ng kausap.
- source_word: אַחֶיךָ
  choice: iyong mga kapatid
  rationale: Ito ang tuwirang kahulugan ng salitang Hebreo. Hindi pinalitan ng “mga kasama” upang mapanatili ang kinship wording ng teksto, bagaman maaaring tumukoy ito sa mga kasamahan o kababayan ni Itai.
- source_word: חֶסֶד וֶאֱמֶת
  choice: tapat na pag-ibig at katapatan
  rationale: Ang pares ay nagpapahayag ng matatag at maaasahang pag-ibig at katapatan. Ang saling ito ay likas sa modernong Tagalog at pinananatili ang teolohikal na bigat ng mga salita.
theological_decisions:
- issue: Walang tahasang pandiwa sa hulíng pariralang חֶסֶד וֶאֱמֶת
  choice: Sumaiyo nawa ang tapat na pag-ibig at katapatan
  alternative: Tapat na pag-ibig at katapatan
  rationale: Ang konteksto ay sumusuporta sa pagbasa bilang basbas o mabuting hangarin, ngunit hindi tinutukoy kung ang Diyos ang tahasang simuno; kaya hindi idinagdag ang pangalan ng Diyos.
- issue: Kalabuan ng pupuntahan ni David
  choice: kung saan man ako mapunta
  alternative: kung saan ako pupunta
  rationale: Pinananatili ang di-tiyak at paulit-ulit na pahayag ng Hebreo, sa halip na tahasang sabihing “kung saan ko kaya” o “kung saan ko dapat,” na kapwa maaaring magpasya nang higit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ngayo’y,” “ako nama’y,” at “sumaiyo nawa” upang panatilihin ang dignidad ng salaysay nang hindi maging lipas o labis na pormal. Ang “palalabuyin” ay mas matindi kaysa “pagala-galain” ngunit akma sa causative at sa kalagayan ng sapilitang pagtakas.
