base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: tl
  text: Sinabi ng mga lingkod ng hari sa hari, “Anuman ang piliin ng panginoon kong hari, narito ang iyong mga lingkod.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas pormal, “Ayon sa lahat ng pipiliin ng panginoon kong hari, narito ang iyong mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi
  rationale: Karaniwang salaysay na panumbas sa wayyiqtol ng אמר at natural na pambungad sa tuwirang pananalita.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: mga lingkod ng hari
  rationale: Sa konteksto ng korte, tumutukoy ito sa mga tapat na tauhan o tagapaglingkod ng hari; hindi kailangang idiin dito ang kahulugang alipin.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Likas na panumbas sa Tagalog para sa pinatutungkulan ng pagsasalita.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: Anuman ang piliin
  rationale: Natural na Tagalog para sa idyomang literal na ‘ayon sa lahat ng pipiliin,’ at ipinahahayag ang lubos na kahandaang sumunod.
- source_word: יִבְחַר
  choice: piliin
  rationale: Pinananatili ang pangunahing kahulugan ng בחר na pumili, sa halip na gawing mas interpretatibong ‘ipasiya.’
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Pinananatili ang magalang at pormal na tawag sa hari nang hindi ginagawang pantukoy sa Diyos ang ‘panginoon.’
- source_word: הִנֵּה
  choice: narito
  rationale: Ipinahahayag ang presentasyon at agarang kahandaan ng mga lingkod sa natural ngunit marangal na Tagalog.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Pinananatili ang pag-uulit ng salitang עבד at ang tuwirang pagpapahayag ng katapatan sa hari.
