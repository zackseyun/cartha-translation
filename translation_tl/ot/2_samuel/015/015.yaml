translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na pananalita sa korte at ang pag-uulit ng ‘lingkod,’ habang iniwasan ang lipas na ‘masdan’ para sa הִנֵּה.
