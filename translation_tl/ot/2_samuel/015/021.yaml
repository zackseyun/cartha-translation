  to: Sumagot si Itai sa hari, “Buhay si Yahweh, at buhay ang panginoon kong hari![a] Tunay na kung saan man naroon o maparoroon ang panginoon kong hari—maging kamatayan man o buhay[b]—naroon ang iyong lingkod.”
