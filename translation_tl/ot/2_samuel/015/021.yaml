base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: tl
  text: Sumagot si Itai sa hari, “Buhay si Yahweh, at buhay ang panginoon kong hari![a] Tunay na kung saan man naroon o maparoroon ang panginoon kong hari—maging kamatayan man o buhay[b]—naroon ang iyong lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pormula ito ng panunumpa sa Hebreo: “Buhay si Yahweh, at buhay ang panginoon kong hari.”'
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “sa kamatayan man o sa buhay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת הַמֶּלֶךְ וַיֹּאמַר
  choice: Sumagot si Itai sa hari
  rationale: Pinananatili ang karaniwang pormula ng salaysay para sa tugon sa naunang pananalita, ngunit hindi inuulit ang magkaparehong diwa ng ‘sumagot at nagsabi’ sa paraang mabigat sa modernong Tagalog.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Malapit sa Hebreong pormula ng panunumpa at pinananatili ang personal na banal na pangalang Yahweh.
- source_word: וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: at buhay ang panginoon kong hari
  rationale: Pinananatili ang magkatulad na ikalawang bahagi ng pormula at ang magalang na pagtukoy ni Itai kay David.
- source_word: כִּי אִם
  choice: Tunay na
  rationale: Sa konteksto ng panunumpa, nagpapahayag ito ng matibay na katiyakan at hindi simpleng kondisyon.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: saanman naroon
  rationale: Natural na Tagalog para sa bukás at di-tiyak na lokasyon, habang pinananatili ang diwa ng ‘sa lugar kung saan siya naroon.’
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: sa kamatayan man o sa buhay
  rationale: Pinananatili ang magkatambal at saklaw-lahat na mga posibilidad ng kamatayan at buhay nang hindi nilulutas kung tumutukoy ang mga ito sa kalagayan, hantungan, o bunga.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Dito ay isang magalang na pagtukoy ni Itai sa sarili sa harap ng hari, kaya mas angkop ang ‘lingkod’ kaysa ‘alipin.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng pananalita ni Itai
  choice: Pormal na panunumpa na sinusundan ng matibay na pangako
  alternative: Karaniwang pahayag lamang na sasama siya sa hari
  rationale: Ang dobleng pormulang ‘Buhay si Yahweh, at buhay ang panginoon kong hari’ at ang כִּי אִם ay nagpapahiwatig ng taimtim na panunumpa at katiyakan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘panginoon kong hari’ bilang magalang na titulong pantao; maliit ang titik upang maiba sa pagtukoy sa Diyos. Pinanatili ang maikli at taimtim na himig ng panunumpa.
