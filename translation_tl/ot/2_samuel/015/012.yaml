translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ipinatawag,” “sabwatan,” at “kumampi” upang maging natural ang salaysay habang pinananatili sa mga talababa ang mga tunay na alternatibong leksikal at ang literal na anyo ng idyomang Hebreo.
