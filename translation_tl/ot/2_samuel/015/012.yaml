base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: tl
  text: At ipinatawag ni Absalom si Ahitofel na taga-Gilo,[a] ang tagapayo ni David, mula sa kanyang lungsod, ang Gilo, habang naghahandog siya ng mga hain. Lalong lumakas ang sabwatan,[b] at patuloy na dumami ang mga taong kumampi kay Absalom.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinadala si Ahitofel.” Literal na maaaring isalin nang gayon ang pandiwang Hebreo, ngunit sa konteksto ay malamang na ipinatawag siya ni Absalom upang sumama sa paghihimagsik.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lalong tumatag ang balak.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang mga tao ay patuloy na dumarami kasama ni Absalom,” isang idyoma para sa patuloy na paglaki ng suportang natatanggap niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ipinatawag
  rationale: Kapag tao ang tuwirang layon at ayon sa konteksto ng pangangalap ni Absalom ng mga kakampi, ang pandiwa ay likas na nagpapahiwatig na nagpadala siya ng sugo upang ipatawag si Ahitofel.
- source_word: הַגִּלֹנִי
  choice: taga-Gilo
  rationale: Ang gentilicio ay natural na isinasalin sa modernong Tagalog bilang “taga-Gilo,” at malinaw itong nagpapakilala sa pinagmulan ni Ahitofel.
- source_word: יוֹעֵץ דָּוִד
  choice: ang tagapayo ni David
  rationale: Pinananatili nito ang ugnayang construct at ang pampolitikang tungkulin ni Ahitofel kay David.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: mula sa lungsod nito, sa Gilo
  rationale: Pinananatili ang parehong pangkalahatang katawagan at pangalan ng lugar sa Hebreo. Ang “nito” ay tumutukoy kay Ahitofel at umiiwas sa kalituhang maaaring idulot ng “kanyang” sa Tagalog.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: habang naghahandog siya ng mga handog
  rationale: Ipinahahayag ng parirala ang kasabay na kilos at pinananatili ang kultikong diwa ng זבח, bagaman iniiwasan ang lubhang mekanikal na pag-uulit.
- source_word: הַקֶּשֶׁר
  choice: ang sabwatan
  rationale: Sa konteksto ng lihim at organisadong paghihimagsik laban sa hari, “sabwatan” ang malinaw at karaniwang katumbas.
- source_word: אַמִּץ
  choice: lalong lumakas
  rationale: Kasama ng וַיְהִי, inilalarawan nito ang umuunlad na lakas ng sabwatan, hindi lamang isang nakapirming kalagayan.
- source_word: הוֹלֵךְ וָרָב
  choice: patuloy na dumami
  rationale: Natural nitong ipinahahayag sa Tagalog ang nagpapatuloy at unti-unting pagdami na nasa idyomang Hebreo.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Direkta at malinaw na kolektibong katawagan para sa mga sumasanib sa panig ni Absalom.
- source_word: אֶת אַבְשָׁלוֹם
  choice: kumampi kay Absalom
  rationale: Ang אֶת dito ay nagpapahayag ng pakikisama o pagkakahanay. Ginagawang malinaw ng “kumampi kay” ang kontekstuwal na diwa nang hindi lamang nagsasabing pisikal silang kasama niya.
