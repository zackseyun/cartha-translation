  text: וַ/יִּשְׁלַ֤ח אַבְשָׁלוֹם֙ מְרַגְּלִ֔ים בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּ/שָׁמְעֲ/כֶם֙ אֶת ק֣וֹל הַ/שֹּׁפָ֔ר וַ/אֲמַרְתֶּ֕ם מָלַ֥ךְ אַבְשָׁל֖וֹם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: tl
  text: 'Pagkatapos, nagsugo si Absalom ng mga espiya sa lahat ng lipi ng Israel, na may ganitong bilin: “Kapag narinig ninyo ang tunog ng tambuli, sabihin ninyo, ‘Naging hari na si Absalom sa Hebron!’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: palihim na ... mga tauhan
  rationale: Karaniwang nangangahulugang ‘mga espiya’ ang salita, ngunit sa kontekstong ito ang mga isinugo ay mga lihim na mensahero o ahente na magpapahayag ng sabwatan. Ang pariralang ito ay natural sa Tagalog at hindi nagpapahiwatig na pangangalap ng impormasyon ang kanilang pangunahing gawain.
- source_word: כְּשָׁמְעֲכֶם
  choice: Kapag narinig ninyo
  rationale: Pinananatili ang temporal na diwa ng konstruksyong may כְּ; hindi kailangang dagdagan ng ‘kaagad’ dahil wala itong hiwalay na katumbas sa Hebreo.
- source_word: קוֹל הַשֹּׁפָר
  choice: tunog ng tambuli
  rationale: Ang שׁוֹפָר ay sungay na hinihipan bilang hudyat; ang ‘tambuli’ ang dignified at pamilyar na salitang biblikal sa Tagalog.
- source_word: מָלַךְ
  choice: Naging hari na
  rationale: Ang perfect na pandiwa ay nagpapahayag ng pag-akyat o pagkakaluklok bilang hari, hindi lamang ng patuloy na paghahari.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Natural na lokatibong salin ng pang-ukol בְּ at transliterasyon ng pangalang lugar.
theological_decisions:
- issue: Katayuan ng pahayag tungkol sa pagiging hari ni Absalom
  choice: 'Isinalin bilang iniutos na pahayag: ‘Naging hari na si Absalom,’ nang hindi pinatutunayang lehitimo ang paghahari niya.'
  alternative: ‘Naghahari si Absalom’
  rationale: Mas tumpak na inilalarawan ng ‘naging hari na’ ang inceptive o enthronement sense ng מָלַךְ at pinananatili ang pahayag bilang bahagi ng sabwatan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘palihim na nagsugo ... ng mga tauhan’ upang maipahayag ang lihim na papel ng מְרַגְּלִים nang hindi nagmumungkahing pangunahing tungkulin nila ang maniktik; pinanatili ang ‘tambuli’ bilang angkop na terminong biblikal.
