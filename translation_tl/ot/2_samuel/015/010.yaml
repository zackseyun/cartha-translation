    issue: Hindi tahasang naisalin ang מְרַגְּלִים.
    rationale: Ang ‘palihim na nagsugo ... ng mga tauhan’ ay nagdaragdag ng paraan (‘palihim’) ngunit pinapalitan ang ‘mga espiya’ ng malabong ‘mga tauhan.’ Mas ligtas na panatilihin ang tahasang katawagan ng pinagmulan.
