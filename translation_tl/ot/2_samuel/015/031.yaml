  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: tl
  text: At iniulat kay David, “Kabilang si Ahitofel sa mga nakikipagsabwatan kay Absalom.” Sinabi ni David, “Yahweh, gawin mo sanang kahangalan ang payo ni Ahitofel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “biguin mo sana ang payo ni Ahitofel.” Mas literal na hinihiling sa Hebreo na gawing kahangalan ang kanyang payo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: iniulat
  rationale: Ang Hiphil ng נגד ay nangangahulugang magbalita o mag-ulat. Pinananatili ng pasibong “iniulat” ang di-tiyak na tagapagbalita sa Hebreo at natural ito sa makabagong Filipino.
- source_word: לֵאמֹר
  choice: tuwirang sipi pagkatapos ng “iniulat”
  rationale: Ang quotative na לֵאמֹר ay likas na naipahahayag sa Filipino sa pamamagitan ng tuwirang sipi; ang literal na “na nagsasabi” ay magiging mabigat at di-natural.
- source_word: בַּקֹּשְׁרִים
  choice: sa mga nagsasabwatan
  rationale: Ang anyong maramihan ay tumutukoy sa pangkat ng mga taong kasali sa sabwatan, hindi lamang sa abstraktong sabwatan.
- source_word: עִם
  choice: kay
  rationale: Sa pariralang Filipino na “mga nagsasabwatan kay Absalom,” malinaw na ipinahahayag ng “kay” ang pakikiisa o pagkampi kay Absalom na tinutukoy ng עִם.
- source_word: סַכֶּל
  choice: gawin ... kahangalan
  rationale: 'Pinananatili nito ang tahasang larawan ng Piel imperative: hinihiling na gawing kahangalan ang payo, sa halip na agad itong ipakahulugang “biguin” o “pawalang-bisa.”'
- source_word: נָא
  choice: sana
  rationale: Ipinahahayag ng “sana” ang mapagpakumbabang pakiusap at matinding pagnanais sa panalangin, nang natural sa modernong Filipino.
- source_word: עֲצַת
  choice: payo
  rationale: Ang עֵצָה rito ay estratehikong payo ni Ahitofel. Ang “payo” ay malinaw at kasalukuyang Filipino habang naaangkop pa rin sa kontekstong pampolitika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Ang banal na pangalang יְהוָה sa tuwirang panawagan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton bilang pangalan sa panalangin; pinananatili ng “Yahweh” ang pagkakaiba ng personal na pangalan at ng isang titulo.
- issue: Kung ang panalangin ay humihiling ng kahangalan o tahasang kabiguan ng payo
  choice: gawin ... kahangalan
  alternative: biguin ang payo
  rationale: Ang Hebreo ay gumagamit ng pandiwang kaugnay ng pagiging hangal. Hindi tahasang nilulutas ng salin kung ang resulta ay intrinsikong maling payo, pagtingin dito bilang kahangalan, o pagiging di-epektibo nito; inilalagay sa talababa ang mas interpretibong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na pormulang “iniulat kay David” nang hindi nagdaragdag ng di-binanggit na tagapagbalita. Pinanatili ang pag-uulit ng pangalan ni David at ang matalim, maikling anyo ng kanyang panalangin.
