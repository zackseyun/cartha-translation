  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: tl
  text: Sinabi sa kanya ng hari, “Humayo ka nang payapa.” Kaya tumindig siya at pumunta sa Hebron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pandiwang pasalaysay para sa pagpapakilala ng tuwirang sinabi; natural sa modernong Tagalog ang “Sinabi sa kanya.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na katawagang tumutukoy sa haring kilala na sa konteksto; pinananatili ang katawagan ng Hebreo sa halip na idagdag ang pangalang David.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Pautos na anyo ng הלך. Ang “Humayo ka” ay dignified at natural sa konteksto ng pahintulot at pagpapala.
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Karaniwang idyoma ng pag-alis na may kapayapaan o basbas. Ang “nang payapa” ay malinaw at likas sa Tagalog nang hindi dinaragdagan ang diwa.
- source_word: וַיָּקָם
  choice: tumindig siya
  rationale: Tuwirang ipinapahayag ang pagbangon o pagtayo bilang kasunod na kilos; bahagyang marangal ngunit nauunawaang pananalita.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Payak na pandiwa ng paggalaw na angkop sa kasunod na destinasyong Hebron.
- source_word: חֶבְרוֹנָה
  choice: sa Hebron
  rationale: Ang directional he ay nagsasaad ng pagpunta tungo sa lugar; natural itong ipinahahayag sa Tagalog bilang “sa Hebron.”
