  source_fidelity: 'Tumpak na naipapahayag ang lahat ng pangunahing elemento ng Hebreo: nagsalita ang hari sa kanya, iniutos na umalis nang payapa, at siya ay bumangon at nagpunta sa Hebron. Ang “sa Hebron” ay wastong pagpapahayag ng direksiyonal na anyo ng pangalan ng lugar.'
