base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari kay Zadok, “Ibalik mo sa lungsod ang kaban ng Diyos. Kung makasumpong ako ng lingap sa paningin ni Yahweh, ibabalik niya ako at ipakikita niya sa akin iyon at ang dakong kinaroroonan nito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipakikita niya sa akin ang kanyang sarili at ang kanyang tahanan.” Maaaring unawain ang mga panghalip sa Hebreo bilang higit na tumutukoy sa Diyos, bagaman ang pinakamalapit na antecedent ay “ang kaban ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: Ibalik mo
  rationale: Ang Hiphil na pautos ng שוב ay nakatuon kay Zadok at nagpapahayag na dalhin niyang pabalik ang kaban.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang isinasalin ang אֱלֹהִים bilang “Diyos” at hindi ito itinutugma sa ibang karaniwang katawagan.
- source_word: הָעִיר
  choice: sa lungsod
  rationale: Ipinahihiwatig ng konteksto ang patutunguhan; natural sa modernong Tagalog ang “sa lungsod.”
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Kung makasumpong ako ng lingap sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma at ang relasyonal na diwa ng חֵן, habang gumagamit ng malinaw at marangal na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וֶהֱשִׁבַנִי
  choice: ibabalik niya ako
  rationale: Ang causative na anyo ng שוב na may unang panauhang hulapi ay nangangahulugang pangyayarihin niyang makabalik si David.
- source_word: וְהִרְאַנִי
  choice: at ipakikita sa akin
  rationale: Tuwirang ipinahahayag ng Hiphil ng ראה ang diwang “ipakita sa akin,” na natural din sa Tagalog.
- source_word: אֹתוֹ
  choice: iyon
  rationale: Pinakamalapit na antecedent ang kaban; ang “iyon” ay angkop sa bagay at hindi lubusang nag-aalis sa gramatikal na kalabuan ng Hebreo.
- source_word: נָוֵהוּ
  choice: ang tahanan nito
  rationale: Ang נָוֶה ay tumutukoy sa tirahan o tahanan. Hindi ito isinaling “templo” upang maiwasang magdagdag ng bagay na wala pa sa yugtong ito ng salaysay.
theological_decisions:
- issue: Tinutukoy ng “iyon at ang tahanan nito”
  choice: Ang mga panghalip ay pangunahing tumutukoy sa kaban at sa lugar na kinaroroonan nito.
  alternative: 'Maaaring mas nakatuon sa Diyos ang mga panghalip: “siya at ang kanyang tahanan.”'
  rationale: Ang “kaban ng Diyos” ang pinakamalapit na antecedent, ngunit dahil sagisag ito ng presensiya ng Diyos at panlalaki ang mga panghalip sa Hebreo, nananatiling posible ang pagbasa na tumutukoy sa Diyos. Inilalahad sa talababa ang tunay na kalabuan sa halip na lutasin ito nang tahimik.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang idyomang “sa paningin” at ang pangalang “Yahweh,” habang iniwasan ang makaluma o labis na teknikal na pananalita.
