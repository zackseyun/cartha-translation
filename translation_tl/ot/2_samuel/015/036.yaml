base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: tl
  text: 'Tingnan ninyo, naroon kasama nila ang dalawa nilang anak: si Ahimaas na anak ni Sadoc at si Jonatan na anak ni Abiatar. Ipadala ninyo sa akin sa pamamagitan nila[a] ang bawat bagay na maririnig ninyo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kanilang kamay,” isang idyomang Hebreo na nangangahulugang “sa pamamagitan nila” o “sa pamamagitan ng kanilang paghahatid.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “anumang maririnig ninyo,” “bawat ulat na maririnig ninyo,” o “bawat balitang maririnig ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה שָׁם עִמָּם
  choice: Naroon kasama nila
  rationale: Ang הִנֵּה ay pantawag-pansin at ang שָׁם עִמָּם ay tumutukoy sa kinaroroonan ng mga anak kasama ng mga pari. Sa modernong Tagalog, likas na naihahatid ng “Naroon” ang deiktikong diin nang hindi gumagamit ng makalumang “Narito.”
- source_word: שְׁנֵי בְנֵיהֶם
  choice: ang dalawa nilang anak
  rationale: Tuwirang ipinahihiwatig ng pariralang konstruktibo ang dalawang anak nina Sadoc at Abiatar.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: si Ahimaas na anak ni Sadoc, at si Jonatan na anak ni Abiatar
  rationale: Sa konteksto, ang לְ ay naghahayag kung kaninong anak ang bawat isa. Ang tahasang “anak ni” ay natural sa Tagalog at nililinaw ang kaugnayang ipinahayag na sa naunang parirala.
- source_word: וּשְׁלַחְתֶּם
  choice: Ipadala ninyo
  rationale: Sa kontekstong nagbibigay ng tagubilin, ang anyo ng pandiwa ay may puwersang pautos. Ang “Ipadala ninyo” ay malinaw at marangal na utos sa maramihang kausap.
- source_word: בְּיָדָם
  choice: sa pamamagitan nila
  rationale: Literal itong “sa kanilang kamay,” ngunit karaniwang idyoma ito ng Hebreo para sa ahensiya o paghahatid. Ang “sa pamamagitan nila” ang natural na katumbas sa modernong Tagalog.
- source_word: כָּל דָּבָר אֲשֶׁר תִּשְׁמָעוּ
  choice: ang anumang balitang maririnig ninyo
  rationale: Malawak ang saklaw ng דָּבָר—“salita,” “bagay,” “usapin,” o “ulat.” Sa konteksto ng pagpapahatid ng impormasyong narinig, natural ang “anumang balita,” habang pinananatili sa talababa ang mas literal na mga posibilidad.
theological_decisions: []
translation_notes:
  register: 'Gumamit ng moderno, malinaw, at marangal na Tagalog. Isinalin ang idyomang Hebreo ayon sa likas na gamit sa Filipino, habang inilagay sa mga talababa ang literal at leksikal na mga alternatibo. Ang mga pangalan ay nasa karaniwang anyong Tagalog: Ahimaas, Sadoc, Jonatan, at Abiatar.'
