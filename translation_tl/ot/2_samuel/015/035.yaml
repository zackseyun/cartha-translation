base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: tl
  text: Hindi ba kasama mo roon ang mga paring sina Zadok at Abiatar? Anumang bagay na marinig mo mula sa sambahayan ng hari ay sabihin mo sa mga paring sina Zadok at Abiatar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Tuwirang salin ng pangmaramihang katawagan kina Zadok at Abiatar; inuulit sa dalawang sugnay gaya ng Hebreo.
- source_word: כָּל הַדָּבָר
  choice: anumang bagay
  rationale: Pinananatili ang hayag na pangngalang דָּבָר at ang malawak na saklaw ng כָּל, sa halip na paikliin bilang ‘anumang marinig mo.’
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: mula sa sambahayan ng hari
  rationale: Ang בֵּית ay maaaring tumukoy hindi lamang sa gusali kundi sa sambahayan o korte ng hari; sa konteksto ng pagkuha ng impormasyon, ‘sambahayan’ ang likas ngunit sapat na malawak na salin.
- source_word: תַּגִּיד
  choice: sabihin mo
  rationale: Natural na pautos sa Tagalog para sa Hifil imperfect na ginagamit bilang tagubilin na ipabatid o iulat ang narinig.
