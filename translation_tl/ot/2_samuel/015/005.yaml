  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: tl
  text: At tuwing may lalaking lumalapit upang yumukod sa kanya[a], iniuunat ni Absalom ang kanyang kamay, hinahawakan siya, at hinahalikan siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay-pugay sa kanya.” Maaaring tumukoy ang pandiwang Hebreo sa pagyukod bilang tanda ng paggalang, at hindi kinakailangang sa pagsamba sa makitid na panrelihiyong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At sa tuwing ... inaabot
  rationale: Ipinahihiwatig ng anyong pasalaysay ang paulit-ulit o kinaugaliang kilos; natural itong ipinapahayag sa Filipino sa pamamagitan ng “sa tuwing.”
- source_word: בִּקְרָב אִישׁ
  choice: may lalaking lumalapit
  rationale: Pinananatili ang isahang panlalaking אִישׁ at malinaw na ipinapahayag ang paglapit kay Absalom.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: upang yumukod sa kanya
  rationale: Inilalarawan nito ang pisikal na kilos ng pagpupugay nang hindi ipinapalagay na pagsambang panrelihiyon ang tinutukoy.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: inaabot ni Absalom ang kanyang kamay
  rationale: Ang idyomang Hebreo ay tumutukoy sa pag-unat o pag-abot ng kamay. Tahasang pinangalanan si Absalom upang maiwasan ang malabong reperensiya ng sunod-sunod na panghalip sa Filipino.
- source_word: וְהֶחֱזִיק לוֹ
  choice: hinahawakan ang lalaki
  rationale: Ang החזיק ay nangangahulugang humawak o dumakma; ang “hinahawakan” ay angkop sa magiliw na kilos sa konteksto at hindi kasingtindi ng “sinunggaban.”
- source_word: וְנָשַׁק לוֹ
  choice: at hinahalikan ito
  rationale: Direktang pinananatili ang kahulugan ng pandiwang “humalik,” habang ang “ito” ay malinaw na tumutukoy sa lalaking lumapit.
theological_decisions:
- issue: Kung ang pagyukod ay pagsamba o pagpupugay
  choice: yumukod sa kanya
  alternative: magbigay-galang sa kanya
  rationale: Maaaring tumukoy ang השתחוה sa pagyukod bilang paggalang o pagpupugay, hindi lamang sa pagsambang panrelihiyon. Pinananatili ng salin ang mismong kilos at ng talababa ang saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa tuwing” para sa kinaugaliang kilos at tahasang binanggit si Absalom upang maging natural at malinaw ang daloy ng mga panghalip.
