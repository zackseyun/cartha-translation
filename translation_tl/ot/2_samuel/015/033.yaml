base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: tl
  text: Sinabi ni David sa kanya, “Kung tatawid kang kasama ko[a], magiging pabigat ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Kung sasama ka sa akin.” Ang pandiwang Hebreo ay mas literal na nangangahulugang “tumawid” o “dumaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: Sinabi ... ni David
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang payak na “Sinabi ... ni David” nang hindi kailangang idagdag ang “At” o “Pagkatapos.”
- source_word: לוֹ
  choice: sa kanya
  rationale: Pinananatili ang tahasang panghalip sa Hebreo at hindi ipinapasok sa pangunahing teksto ang pangalang Husai, bagaman siya ang tinutukoy sa konteksto.
- source_word: אִם
  choice: Kung
  rationale: Tuwirang nagpapakilala ito ng kondisyon, at “kung” ang pinakanatural na katumbas sa Filipino.
- source_word: עָבַרְתָּ אִתִּי
  choice: sasama ka sa akin sa pagtawid
  rationale: Pinagsasama nito ang diwa ng pagsama kay David at ang mas literal na kahulugan ng עבר na “tumawid/dumaan,” habang nananatiling malinaw at natural sa Filipino.
- source_word: וְהָיִתָ עָלַי
  choice: magiging ... ka sa akin
  rationale: Ipinahahayag ng konstruksiyon ang magiging epekto o pasaning ipapataw kay David; hinihingi ng idyomang Filipino ang ganitong ayos.
- source_word: לְמַשָּׂא
  choice: pabigat
  rationale: Ang “pabigat” ay karaniwan at malinaw na salin ng isang taong magiging pasanin o hadlang, at angkop sa interpersonal na konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pabigat” sa halip na mas teknikal na “pasanin,” at pinanatili sa teksto at talababa ang pisikal na diwa ng pagtawid na nasa pandiwang Hebreo.
