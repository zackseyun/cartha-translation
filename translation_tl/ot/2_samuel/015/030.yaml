  terminology: Ang “daang paakyat sa Bundok ng mga Olibo,” “umiiyak,” “nakapaa,” at “kani-kaniyang ulo” ay angkop na modernong Tagalog at tapat sa mga pangunahing salitang Hebreo. Ang “nakatalukbong” ay hindi tumutukoy sa uri o paraan ng pantakip; inilalarawan lamang nito ang natatakpang kalagayan ng ulo.
