translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “umaahon” para sa aktuwal na pag-akyat sa dalisdis, “nakapaa” bilang likas na katumbas ng barefoot, at “kani-kaniyang” upang malinaw na maipahayag ang distributibong Hebreo. Pinanatili sa teksto at mga talababa ang retorikal na pag-uulit ng orihinal nang hindi nagiging pilit ang pangungusap.
