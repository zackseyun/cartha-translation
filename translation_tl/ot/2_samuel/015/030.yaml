base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: tl
  text: Umaahon si David sa daang paakyat sa Bundok ng mga Olibo; patuloy siyang umaahon habang umiiyak[a], nakatalukbong ang kanyang ulo at naglalakad na nakapaa. Lahat ng taong kasama niya ay nagtakip ng kani-kaniyang ulo[b], at patuloy silang umaahon habang umiiyak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang “umaahon” upang idiin at gawing buhay ang nagpapatuloy na kilos: “umaahon ... umaahon at umiiyak.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, distributibong isahan ang pagkakasabi: “bawat isa ay nagtakip ng kanyang ulo.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo, madiin at paulit-ulit ang anyo: “umahon sila, patuloy na umaahon at umiiyak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: daang paakyat sa Bundok ng mga Olibo
  rationale: Ang מַעֲלֵה ay paahon o daang paakyat. Ginamit ang nakaugaliang pangalang heograpiko na “Bundok ng mga Olibo” sa halip na ang literal ngunit malabong “mga olibo.”
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: Umaahon ... patuloy siyang umaahon habang umiiyak
  rationale: Pinananatili ang inuulit at nagpapatuloy na kilos ng mga participle sa Hebreo, ngunit ipinahahayag ito sa natural na modernong Tagalog.
- source_word: בֹּכֶה
  choice: umiiyak
  rationale: Tuwirang inilalarawan nito ang pagluha nang hindi idinaragdag ang mas tiyak na diwa ng rituwal na panaghoy.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: na may takip ang ulo
  rationale: Pinananatili ang kalagayan ng ulo bilang natatakpan nang hindi tinutukoy kung anong pantakip o paano ito itinakip.
- source_word: יָחֵף
  choice: nakapaa
  rationale: Maikli, natural, at karaniwang katumbas sa Tagalog ng paglalakad na walang sapin sa paa.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: lahat ng taong kasama niya
  rationale: Pinananatili ang malawak na kahulugan ng הָעָם at hindi ito nililimitahan sa mga kawal.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: Tinakpan ... ang kani-kaniyang ulo
  rationale: 'Ipinahahayag ng “kani-kaniyang” ang distributibong isahan na אִישׁ רֹאשׁוֹ: bawat isa ay nagtakip ng sariling ulo.'
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: patuloy silang umaahon habang umiiyak
  rationale: Ang pandiwa at mga infinitive absolute ay naglalarawan ng madiin at nagpapatuloy na pag-ahon at pag-iyak; ang “patuloy” ay naghahatid nito nang natural sa Tagalog.
