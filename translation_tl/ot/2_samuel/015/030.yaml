  to: Umaahon si David sa daang paakyat sa Bundok ng mga Olibo; patuloy siyang umaahon habang umiiyak[a], nakatalukbong ang kanyang ulo at naglalakad na nakapaa. Lahat ng taong kasama niya ay nagtakip ng kani-kaniyang ulo[b], at patuloy silang umaahon habang umiiyak[c].
