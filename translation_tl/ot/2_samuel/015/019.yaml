  naturalness: Marangal at madaling maunawaang modernong Tagalog ang kabuuan. Gayunman, mas tuwiran at natural para sa עִם הַמֶּלֶךְ ang “manatili kang kasama ng hari” kaysa “manatili sa piling ng hari,” na maaaring magpahiwatig ng mas malapit o pormal na presensiya kaysa sa simpleng “kasama.”
  terminology: Ang “Itai na taga-Gat,” “hari,” at “dayuhan” ay angkop. Ang “ipinatapon” ay katanggap-tanggap para sa גֹּלֶה sa konteksto, bagaman ang direksiyon ng לִמְקוֹמֶךָ ay nananatiling mahirap; wastong minamarkahan ito ng talababa bilang alternatibong pagbasa.
