base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: tl
  text: Sinabi ng hari kay Itai na taga-Gat, “Bakit sasama ka rin sa amin? Bumalik ka at manatili kang kasama ng hari,[a] sapagkat dayuhan ka at isa ka ring ipinatapon mula sa sarili mong lugar.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi ng Hebreo kung sinong hari ang tinutukoy; maaaring tumukoy ito sa naghaharing kapangyarihan sa Jerusalem.
    reason: alternative_reading
  - marker: b
    text: O “isa ka ring ipinatapon patungo sa sarili mong lugar.” Siksik ang pananalita sa Hebreo at maaaring idiin ang pagiging isang taong napalayo ni Itai at ang kaugnayan niya sa sarili niyang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Sinabi ng hari
  rationale: Likas na daloy ng salaysay sa modernong Tagalog; pinananatili ang titulong “hari” sa halip na tukuyin si David sa pangalan.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai na taga-Gat
  rationale: Isinasatitik ang pangalang Itai at natural na isinasalin ang gentilic bilang pinagmulan niya sa Gat.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Bakit sasama ka rin sa amin?
  rationale: Ang imperfect ay angkop na maipahayag bilang tanong tungkol sa nilalayong pagsama; pinananatili ng “rin” ang גַּם.
- source_word: שׁוּב וְשֵׁב
  choice: Bumalik ka at manatili
  rationale: 'Magkaibang pandiwa ang pinananatili: utos na bumalik at pagkatapos ay manatili o manirahan.'
- source_word: עִם הַמֶּלֶךְ
  choice: sa piling ng hari
  rationale: Natural ngunit malapit sa Hebreong “kasama ng hari”; hindi tinutukoy kung sino ang haring tinutukoy.
- source_word: נָכְרִי
  choice: dayuhan
  rationale: Malinaw na tumutukoy sa hindi katutubo o hindi taga-roon, nang walang di-angkop na interpersonal na diwa ng “estranghero.”
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: at isa ka ring ipinatapon mula sa sarili mong lugar
  rationale: Ipinahahayag ang kalagayan ni Itai bilang taong naalis o napalayo sa sariling lugar, habang inilalagay sa talababa ang siksik at maaaring ibang unawa sa pariralang Hebreo.
theological_decisions:
- issue: Tinutukoy ng “hari” sa utos na manatili sa piling ng hari
  choice: Pinanatili ang “hari” nang hindi pinapangalanan ang tinutukoy.
  alternative: “kay Haring Absalom,” “sa hari sa Jerusalem,” o “sa akin na hari”
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang tinutukoy; ang pagpapanatili ng titulo ay umiiwas sa sapilitang paglutas sa tunay na kalabuan.
- issue: Ugnayan ng גֹּלֶה at לִמְקוֹמֶךָ
  choice: “ipinatapon mula sa sarili mong lugar” sa pangunahing teksto
  alternative: “ipinatapon patungo sa sarili mong lugar” o isang mas literal na “isang ipinatapon sa iyong lugar”
  rationale: Siksik at hindi pangkaraniwan ang Hebreong pagkakabuo. Ang pangunahing salin ay malinaw sa Tagalog at akma sa katayuan ng isang taong napalayo sa sariling bayan, ngunit hindi ikinukubli sa talababa ang pormal na direksiyong maaaring ipahiwatig ng לְ.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “taga-Gat” sa halip na isang teknikal na katawagang etniko, at pinanatili sa talababa ang mahahalagang kalabuan ng Hebreo.
