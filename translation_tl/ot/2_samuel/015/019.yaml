  to: Sinabi ng hari kay Itai na taga-Gat, “Bakit sasama ka rin sa amin? Bumalik ka at manatili kang kasama ng hari,[a] sapagkat dayuhan ka at isa ka ring ipinatapon mula sa sarili mong lugar.[b]”
