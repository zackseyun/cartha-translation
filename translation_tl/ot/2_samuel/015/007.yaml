source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ אֵ֣לֲכָה נָּ֗א וַ/אֲשַׁלֵּ֛ם אֶת נִדְרִ֛/י אֲשֶׁר נָדַ֥רְתִּי לַֽ/יהוָ֖ה בְּ/חֶבְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: tl
  text: Pagkaraan ng apatnapung taon,[a] sinabi ni Absalom sa hari, “Payagan po ninyo akong pumunta sa Hebron at tuparin ang panata ko sa PANGINOON.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Apatnapung taon—ganito ang tekstong Hebreo. “Apat na taon” ang mababasa sa ilang sinaunang salin at manuskrito.
    reason: May kapansin-pansing tekstuwal at kronolohikal na suliranin sa ‘apatnapu’; itinatala ang mahalagang alternatibo nang hindi binabago ang WLC sa pangunahing teksto.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Pagkaraan ng apatnapung taon
  rationale: Natural na Filipino para sa panandang-panahong nangangahulugang ‘sa katapusan/pagkaraan ng apatnapung taon,’ habang pinananatili ang bilang ng WLC.
- source_word: אֵלֲכָה נָּא
  choice: Payagan po ninyo akong pumunta
  rationale: Ipinahahayag ang magalang na pakiusap kay David; ang נָּא ay likas na naipapakita sa ‘po’ at sa anyong pahintulot.
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי אֲשֶׁר נָדַרְתִּי
  choice: at tuparin ang panata ko
  rationale: Ang שׁלם kaugnay ng panata ay ‘tuparin/bayaran’; ang ‘tuparin ang panata’ ang natural at malinaw na idyomang Filipino. Hindi na inuulit ang cognate construction dahil magiging mabigat sa Filipino.
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginagamit ang nakaugaliang salin sa malaking titik para sa banal na pangalang YHWH.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Sa gramatika, maaaring iugnay ang pariralang ito sa pagpunta/pagtupad o sa lugar kung saan ginawa ang panata; pinananatili ng ayos ng Filipino ang ilang antas ng ganitong kalabuan.
theological_decisions:
- issue: Hindi pangkaraniwang bilang na ‘apatnapung taon’
  choice: Pinanatili sa pangunahing teksto at nilagyan ng tala
  alternative: ‘apat na taon,’ ayon sa ilang sinaunang saksi at mungkahing pagwawasto
  rationale: Ang apatnapu ang malinaw na pagbasa ng WLC/Masoretic Text. Hindi dapat tahimik na palitan ang pangunahing tekstong pinagmulan, ngunit mahalagang ipaalam ang makabuluhang pagkakaiba sa tekstuwal na tradisyon.
- issue: Pagbibigay ng banal na pangalan
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ang ‘PANGINOON’ ay dignified at pamilyar na Tagalog convention para sa tetragrammaton at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang ‘po ninyo’ upang natural na maipakita ang pakiusap ni Absalom sa hari. Iniwasan ang mas literal ngunit alanganing ‘bayaran ang panata’ at pinili ang karaniwang ‘tuparin ang panata.’
