  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: tl
  text: At isang tagapagbalita ang dumating kay David at nagsabi, “Ang puso ng mga lalaki ng Israel ay pumanig na kay Absalom.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang puso ng mga lalaki ng Israel ay naging kay Absalom” o “ay pagkatapos ni Absalom,” isang idyomang nagsasaad na ang kanilang katapatan ay lumipat sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang wayyiqtol ng בוא ay nagsusulong sa salaysay bilang payak na nagdaang pangyayari; natural sa Filipino ang “dumating.”
- source_word: הַמַּגִּיד
  choice: isang tagapagbalita
  rationale: Ang Hiphil participle mula sa נגד ay tumutukoy sa taong naghahatid ng ulat. Bagaman may definite article sa Hebreo, likas sa Filipino ang “isang” sa unang pagpapakilala sa tauhang ito.
- source_word: לֵאמֹר
  choice: at nagsabi
  rationale: Ipinapakilala nito ang tuwirang pananalita; mas natural sa makabagong Filipino ang koordinadong “at nagsabi” kaysa literal na participial na anyo.
- source_word: הָיָה לֶב
  choice: Ang puso ... ay pumanig na
  rationale: Pinananatili ang larawang “puso” ng Hebreo habang ipinahahayag nang malinaw ang pagbabagong naganap sa katapatan o panig pampolitika.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mga lalaki ng Israel
  rationale: Bagaman pang-isahan ang anyo, kolektibo ang gamit. Pinananatili ng “mga lalaki ng Israel” ang panlalaking katawagan at malamang na pampolitika o pangmilitar na diwa.
- source_word: אַחֲרֵי
  choice: pumanig ... kay
  rationale: Literal itong “kasunod/sa likuran ni,” ngunit sa idyomang ito ay nagpapahiwatig ng pagsunod at katapatan kay Absalom.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino at sa tradisyong biblikal.
