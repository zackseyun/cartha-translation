base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: tl
  text: Nang makarating si David sa tuktok, kung saan siya sumamba sa Diyos[a], at narito[b], sinalubong siya ni Husai na Arkita, na punit ang kanyang tunika at may lupa sa kanyang ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung saan nakaugalian niyang sumamba sa Diyos.” Maaaring tumukoy ang anyo ng pandiwang Hebreo sa isang kilos sa nakaraan o sa nakagawiang kilos.
    reason: lexical_alternative
  - marker: b
    text: Ang “at narito” ay kumakatawan sa isang panandang Hebreo sa pagsasalaysay na nagbibigay-diin sa bigla at kapansin-pansing paglitaw ni Husai.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: tuktok
  rationale: Literal itong “ulo,” ngunit sa kontekstong heograpikal ay tumutukoy sa pinakamataas na bahagi ng burol o bundok. Natural at malinaw sa modernong Filipino ang “tuktok.”
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: kung saan siya sumamba sa Diyos
  rationale: Ang pandiwa ay literal na tumutukoy sa pagyukod bilang pagsamba. Ang “sumamba sa Diyos” ang natural na katumbas ng idyoma, habang ang posibleng kahulugang nakagawian ang kilos ay pinananatili sa talababa.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinakikita nito ang bigla at kapansin-pansing paglitaw ni Husai sa salaysay nang hindi gumagamit ng lipas o artipisyal na ekspresyon.
- source_word: לִקְרָאתוֹ
  choice: papalapit upang salubungin siya
  rationale: Ipinahihiwatig ng parirala ang pagkilos patungo kay David para makipagtagpo; nilinaw ang kilos sa natural na Filipino.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai na Arkita
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalan at ang katawagang tumutukoy sa kanyang pangkat o pinagmulan.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: punit ang suot niyang tunika
  rationale: Ang כֻּתֹּנֶת ay isang kasuotang tulad ng tunika, at ang קָרוּעַ ay naglalarawan sa kalagayan nitong punit bilang tanda ng pagdadalamhati.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: at may lupa sa kanyang ulo
  rationale: Ang אֲדָמָה ay “lupa” o “buong lupa,” hindi espesipikong pinong alabok; pinananatili ng salin ang konkretong larawan ng pagdadalamhati.
theological_decisions:
- issue: Kung minsanan o nakagawian ang pagsamba ni David sa lugar na iyon
  choice: sumamba
  alternative: nakaugalian niyang sumamba
  rationale: Maaaring ipahiwatig ng Hebreong imperfect ang isang payak na kilos sa nakaraan o isang nakagawiang kilos. Hindi tahasang nilutas ng pangunahing teksto ang usapin, at inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Iniwasan ang sobrang literal na “ulo” para sa heograpikal na tuktok, ngunit pinanatili ang “tunika” at “lupa” upang maingatan ang kongkretong larawan ng tekstong Hebreo.
