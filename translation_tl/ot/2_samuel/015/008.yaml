  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: tl
  text: Sapagkat ang lingkod mo ay nanata habang naninirahan ako sa Gesur sa Aram. Sinabi ko, ‘Kung talagang ibabalik ako ni Yahweh sa Jerusalem,[a] maglilingkod ako kay Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung tiyak na maibabalik ako ni Yahweh sa Jerusalem.” Inuulit sa Hebreo ang pandiwang “ibalik” upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: nanata
  rationale: Ang magkaugnay na pangngalan at pandiwa sa Hebreo ay isang idiomatikong pagbibigay-diin. Likas sa modernong Tagalog ang “nanata,” samantalang magiging mabigat at di-likas ang literal na “nanata ng isang panata.”
- source_word: עַבְדְּךָ
  choice: ang lingkod mo
  rationale: Magalang na pagtukoy ito ng nagsasalita sa sarili sa harap ng hari. Pinananatili ng “lingkod mo” ang wikang panghukuman nang hindi ipinipilit ang kahulugang alipin.
- source_word: בְּשִׁבְתִּי
  choice: habang naninirahan ako
  rationale: Ipinahihiwatig ng anyo ang panahong nagpapatuloy kung kailan ginawa ang panata. Natural at malinaw sa kasalukuyang Tagalog ang pariralang ito.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: sa Gesur sa Aram
  rationale: Tuwirang pinananatili ang dalawang lokasyong binanggit ng Hebreo nang hindi higit na tinutukoy ang ugnayang heograpiko o pampolitika ng mga ito.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: Kung talagang ibabalik ako
  rationale: Ang pag-uulit ng ugat na שוב ay nagbibigay-diin sa kondisyon. Ipinahahayag ng “talagang” ang diin, at malinaw sa “ibabalik” ang pagbabalik sa isang lugar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong transliterasyon ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: maglilingkod ako kay Yahweh
  rationale: Pinananatili ng “maglilingkod” ang malawak na kahulugan ng עבד, na maaaring tumukoy sa paglilingkod sa Diyos at may kasamang pagsamba, nang hindi nililimitahan sa gawaing kultiko lamang.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Saklaw ng עבד kapag Diyos ang layon
  choice: maglilingkod
  alternative: sasamba
  rationale: Maaaring kabilang sa pandiwa ang pagsamba, ngunit mas malawak ang pangunahing kahulugan nito. Hindi tahimik na nililimitahan ng “maglilingkod” ang panata sa ritwal na pagsamba lamang.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “ang lingkod mo” bilang magalang na pagtukoy sa sarili sa harap ng hari. Hinati sa dalawang pangungusap ang pagpapakilala sa panata upang maging natural ang daloy, habang pinananatili ang kondisyong may diin at ang malawak na kahulugan ng paglilingkod kay Yahweh.
