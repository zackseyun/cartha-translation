translation:
  language: tl
  text: Lumabas ang hari kasama ang buong bayang naglalakad, at huminto sila sa malayong bahay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring pangalan ito ng lugar: “Bet-merhak.” Ang pariralang Hebreo ay maaaring unawaing “bahay ng kalayuan,” ngunit itinuturing ito ng marami na paglalarawan sa pinakahuling bahay.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lumabas
  rationale: Ang Qal wayyiqtol ng יצא ay karaniwang tumutukoy sa paglabas o pag-alis; natural at tuwiran dito ang “lumabas.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalan ito na tumutukoy kay David sa konteksto.
- source_word: וְכָל הָעָם
  choice: kasama ang buong bayan
  rationale: Malawak ang saklaw ng עָם at hindi dapat ipakahulugang mga kawal lamang; ipinahihiwatig ng “kasama” ang pagsama nila sa hari.
- source_word: בְּרַגְלָיו
  choice: na naglalakad
  rationale: Literal itong “sa tabi/paanan niya,” ngunit sa idyomang ito ay tumutukoy sa mga kasamang naglalakad; natural itong ipinahayag sa Filipino nang hindi ginagawang mga kawal ang bayan.
- source_word: וַיַּעַמְדוּ
  choice: huminto sila
  rationale: Bagaman literal na “tumayo,” sa salaysay ng paglalakbay ay likas itong mangahulugang huminto.
- source_word: בֵּית הַמֶּרְחָק
  choice: sa malayong bahay
  rationale: Pinananatili nito ang mas literal na diwa ng “bahay ng kalayuan” at ang tunay na kalabuan kung ito ay paglalarawan, ang pinakahuling bahay, o pangalan ng lugar.
