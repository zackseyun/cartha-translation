  source_fidelity: 'Tumpak ang pangunahing diwa: umalis ang hari, kasama ang buong pangkat ng mga tao na naglalakad, at huminto sila sa isang bahay na inilalarawan ng Hebrew bilang malayo/layo. Ang “malayong bahay” ay isang maingat na literal na pagsasalin na hindi ipinipilit ang mas interpretatibong “pinakahuling bahay.”'
  naturalness: Natural at marangal ang pangungusap sa makabagong Filipino. Bahagyang inayos ang ayos ng pangungusap upang mas malinaw na ang buong bayan ang kasamang naglalakad at upang direktang ilapit ang pananda ng talababa sa pariralang tinutukoy nito.
  terminology: Ang “hari,” “buong bayan,” at “huminto” ay angkop. Ang “Bet-merhak” ay isang katanggap-tanggap na transliterasyon para sa posibleng pangalan ng lugar. Inalis sa talababa ang dagdag na “sa labas ng lungsod,” dahil hindi ito tahasang nasa pariralang Hebreo.
