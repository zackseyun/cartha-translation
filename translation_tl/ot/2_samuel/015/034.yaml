    issue: Hindi natural ang “mabibigo mo para sa akin ang payo ni Ahitofel.”
    rationale: Sa modernong Filipino, karaniwang ang tao o layunin ang “binibigo,” samantalang ang payo ay “pinawawalang-bisa,” “sinasira,” o “hinahadlangan.” Ang “mapawawalang-bisa mo ... para sa akin” ay natural at mas malapit sa pandiwang Hebreo sa kontekstong ito.
  - severity: low
    issue: Maaaring gawing mas tuwiran ang “noong una.”
    rationale: Ang “noon” ay mas payak at malinaw na katumbas ng nakaraang panahong inihahambing sa “ngayon,” nang hindi binibigyan ng dagdag na pakahulugang ‘sa simula.’
