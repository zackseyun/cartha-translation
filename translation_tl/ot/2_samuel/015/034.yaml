  to: Ngunit kung babalik ka sa lungsod at sasabihin mo kay Absalom, ‘Magiging lingkod mo ako, O hari. Kung paanong naging lingkod ako ng iyong ama noon, gayon din ngayon ay magiging lingkod mo ako,’ mapawawalang-bisa mo para sa akin ang payo ni Ahitofel.
  rationale: Inayos lamang ang huling pandiwa at ang kaugnay nitong parirala upang maging likas na Filipino at maipahayag ang pagpapawalang-bisa sa payo ni Ahitofel. Pinanatili ang kondisyonal na paghahambing at ang hinaharap na anyo na sinusunod ng English POB audit trail, nang hindi nilulutas nang lampas sa kinakailangan ang mga sintaktikong detalye ng Hebreo.
