base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: tl
  text: Ngunit kung babalik ka sa lungsod at sasabihin mo kay Absalom, ‘Magiging lingkod mo ako, O hari. Kung paanong naging lingkod ako ng iyong ama noon, gayon din ngayon ay magiging lingkod mo ako,’ mapawawalang-bisa mo para sa akin ang payo ni Ahitofel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng parirala ang alternatibong mungkahi ni David, kaya natural ang “Ngunit kung” sa konteksto.
- source_word: הָעִיר
  choice: lungsod
  rationale: Tuwirang katumbas ng Hebrew; sa konteksto, tumutukoy ito sa Jerusalem nang hindi kailangang idagdag ang pangalan.
- source_word: עַבְדְּךָ ... עֶבֶד ... עַבְדֶּךָ
  choice: lingkod mo ... lingkod ... lingkod mo
  rationale: Pinananatili ang paulit-ulit na salitang ‘lingkod,’ na mahalaga sa ipinapanukalang pahayag ng katapatan.
- source_word: מֵאָז וְעַתָּה
  choice: noong una ... ngayon
  rationale: Natural na inilalahad ang pagtutulad sa nakaraan at kasalukuyan ayon sa sintaks at diwa ng sugnay.
- source_word: וְהֵפַרְתָּ
  choice: mabibigo mo
  rationale: Ang Hiphil ng פרר dito ay nangangahulugang gawing walang bisa o hadlangan ang bisa ng isang payo.
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: payo ni Ahitofel
  rationale: Tuwirang salin ng konstruktong genitibo at karaniwang anyo ng pangalan sa Filipino.
- source_word: לִי
  choice: para sa akin
  rationale: Pinananatili ang interes o kapakinabangan ni David na ipinapahayag ng Hebrew dative.
theological_decisions:
- issue: Ang pananalita ni Husai bilang bahagi ng lihim na estratehiya ni David
  choice: Isinalin nang tuwiran nang walang moral o teolohikal na paliwanag.
  alternative: Ipaliwanag sa teksto na ito ay panlilinlang o makatuwirang pakana.
  rationale: Hindi tahasang hinahatulan o ipinagtatanggol ng talata ang estratehiya; dapat panatilihin ng salin ang tensiyon ng salaysay.
- issue: Pagkakaugnay ng ‘lingkod ng iyong ama’ at ‘lingkod mo’
  choice: “Kung paanong ... gayon din ...”
  alternative: Paghiwalayin bilang dalawang payak na pahayag na walang malinaw na paghahambing.
  rationale: Ang pagkakasunod ng Hebrew at ang konteksto ay sumusuporta sa paghahambing, ngunit hindi dinaragdagan ang teksto ng doktrinal na interpretasyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “O hari” upang mapanatili ang tuwirang pakikipag-usap at ang pormal na paggalang. Iniwasan ang sobrang makalumang bokabularyo at hindi pinangalanan ang Jerusalem dahil “ang lungsod” lamang ang nasa tekstong Hebrew.
