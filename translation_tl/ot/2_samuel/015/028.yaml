translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “ilang” bilang maikli at pamilyar na katumbas ng wilderness, at “mga tawiran” upang hindi labis na tukuyin kung mga tawiran sa ilog ang tinutukoy. Ang dalawang footnote marker ay kapuwa nasa pangunahing teksto.
