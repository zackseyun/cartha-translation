  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: tl
  text: Tingnan ninyo, maghihintay[b] ako sa mga tawiran[a] sa ilang hanggang sa makarating sa akin ang mensahe mula sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tawiran ng ilang.” Posibleng tumutukoy ito sa mga tawiran sa mababaw na bahagi ng ilog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mananatili ako” o “magtatagal ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Tingnan ninyo
  rationale: Maramihang pautos na ginagamit upang tawagin ang pansin; pinananatili nito ang tuwiran at idiomatikong lakas ng Hebreo.
- source_word: אָנֹכִי
  choice: ako
  rationale: Ang malayang panghalip ay nagbibigay-diin sa nagsasalita; likas na naihahatid ito sa Filipino sa tahasang paggamit ng “ako.”
- source_word: מִתְמַהְמֵהַּ
  choice: maghihintay
  rationale: Ang hitpael participle ay maaaring mangahulugang magtagal, maantala, o manatili; sa konteksto, sadyang mananatili si David habang naghihintay ng balita.
- source_word: בְּעַבְרוֹת
  choice: sa mga tawiran
  rationale: Ang pangmaramihang anyo ay tumutukoy sa mga lugar na tinatawiran, posibleng mga tawiran sa mababaw na bahagi ng ilog. Pinananatili ng “mga tawiran” ang leksikal at tekstuwal na kaluwagan.
- source_word: הַמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay bukás at di-tinitirhang lupain, hindi kinakailangang mabuhanging disyerto; “ilang” ang maikli at tradisyonal ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: עַד בּוֹא דָבָר
  choice: hanggang sa dumating ang balita
  rationale: Sa kontekstong ito, ang דָבָר ay mensahe o ulat. Mas likas sa Filipino ang “dumating ang balita” kaysa literal na “dumating ang salita.”
- source_word: מֵעִמָּכֶם
  choice: mula sa inyo
  rationale: Tuwirang ipinahahayag ang pinagmulan ng balita o mensahe.
- source_word: לְהַגִּיד לִי
  choice: upang ipaalam sa akin
  rationale: Ang hiphil infinitive ng נגד ay nangangahulugang ipabatid o iulat; ang “ipaalam sa akin” ay malinaw at natural.
