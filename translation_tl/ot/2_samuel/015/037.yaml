base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: tl
  text: Kaya pumasok sa lungsod si Husai, na kaibigan ni David, habang pumapasok si Absalom sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “at pumasok si Absalom sa Jerusalem.” Maaaring basahin ang pangatnig na Hebreo bilang payak na “at,” at ang pandiwa bilang simpleng naganap na kilos.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating sa
  rationale: Ang בוא ay nangangahulugang ‘dumating’ o ‘pumasok.’ Sa pariralang ‘sa lungsod,’ natural sa Filipino ang ‘dumating sa lungsod’ at malinaw nitong ipinapakita ang paglapit sa lugar.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Hebreo.
- source_word: רֵעֶה דָוִד
  choice: kaibigan ni David
  rationale: Ang רֵעֶה ay maaaring tumukoy sa kaibigan, kasamahan, o malapit na kaugnay. Pinananatili ng ‘kaibigan ni David’ ang tuwirang kahulugan nang hindi ipinapalagay na opisyal siyang tagapayo.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Pinanatili ang karaniwang pangngalan ng Hebreo sa halip na palitan ito ng ‘Jerusalem,’ bagaman iyon ang tinutukoy sa konteksto.
- source_word: וְאַבְשָׁלֹם
  choice: habang ... naman si Absalom
  rationale: Bagaman maaaring simpleng ‘at’ ang ו, ang kasunod na yiqtol ay maaaring maglahad ng kasabay o nasa likurang pangyayari. Likas sa Filipino ang ‘habang ... naman’ upang ipakita ang pagkakasabay at ang pagtutulad ng dalawang pagdating.
- source_word: יָבֹא
  choice: pumapasok
  rationale: Ang anyong yiqtol kasunod ng naunang wayyiqtol ay maaaring magpahiwatig ng nagpapatuloy at kasabay na kilos; kaya ang ‘pumapasok’ ay mas angkop kaysa sa payak na naganap na ‘pumasok.’
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng lugar sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang ‘lungsod’ sa halip na ulitin ang ‘Jerusalem’ sa unang sugnay upang mapanatili ang leksikal na anyo ng Hebreo. Ang ‘habang ... naman’ ay naghahayag ng malamang na kasabay na kilos nang hindi nagpapasok ng teolohikal na pagpapakahulugan.
