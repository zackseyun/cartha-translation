revisions:
- from: Kaya dumating sa lungsod si Husai, na kaibigan ni David, habang pumapasok naman si Absalom sa Jerusalem.
  to: Kaya pumasok sa lungsod si Husai, na kaibigan ni David, habang pumapasok si Absalom sa Jerusalem.[a]
  rationale: Pinalitan ang “dumating sa lungsod” ng “pumasok sa lungsod” upang maipahayag nang mas tumpak ang pagpasok ni Husai sa lungsod. Pinanatili ang kasabay na pagbasa sa “habang pumapasok,” na suportado ng anyong yiqtol sa konteksto, ngunit idinagdag ang talababa para sa lehitimong alternatibong sunod-sunod na pagbasa. Inalis ang “naman” dahil hindi ito kailangan upang maging natural ang Filipino at maaari itong magdagdag ng bahagyang retorikal na pagtutulad.
