base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: tl
  text: Sinasabi ni Absalom[a], “Kung ako lamang ang italagang hukom sa lupain! Lalapit sana sa akin ang bawat taong may alitan o usaping legal[b], at bibigyan ko siya ng katarungan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring mas literal: “Sino ang magtatalaga sa akin bilang hukom sa lupain?” Ang tanong sa Hebrew ay nagpapahayag ng matinding paghahangad, hindi lamang paghingi ng impormasyon.'
    reason: lexical_alternative
  - marker: b
    text: Ang “bawat taong” ay nagsasalin ng panlalaking anyong isahan sa Hebrew na ginagamit sa pangkalahatang diwa para sa sinumang may usaping legal.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “at ipahahayag kong siya ang nasa tama” o “at kikilalanin kong siya ay matuwid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi noon ni Absalom
  rationale: Sa konteksto, bahagi ito ng paulit-ulit na ginagawa ni Absalom. Ang “noon” ay tumutulong ipahiwatig ang kaugaliang pagkakasunod-sunod nang hindi pinabibigat ang pangungusap.
- source_word: מִי יְשִׂמֵנִי
  choice: Kung ako lamang ang italagang
  rationale: Literal itong “Sino ang magtatalaga sa akin?” ngunit may puwersa ng retorikal na paghahangad. Likas na naihahayag sa Tagalog ng “Kung ako lamang ang italagang,” nang hindi nagdaragdag ng di-tiyak na tagaganap.
- source_word: שֹׁפֵט
  choice: hukom
  rationale: Tumutukoy ito sa taong humahatol sa mga alitan at usaping legal; “hukom” ang tuwiran at malinaw na katumbas.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili ng “lupain” ang malawak na teritoryal na kahulugan ng Hebrew nang hindi ito nililimitahan sa makabagong ideya ng isang bansa.
- source_word: וְעָלַי יָבוֹא
  choice: Sa akin sana lumapit
  rationale: Ipinahahayag nito ang inaasahang bunga ng hinahangad ni Absalom. Ang “sana” ay umaayon sa diwa ng kanyang mapaghangad na pahayag.
- source_word: כָּל אִישׁ
  choice: ang bawat taong
  rationale: Bagaman panlalaking isahan ang anyong Hebrew, pangkalahatan ang gamit nito. Ang “bawat taong” ay natural at tumpak sa modernong Tagalog.
- source_word: רִיב וּמִשְׁפָּט
  choice: may alitan o usaping dapat hatulan
  rationale: Ang רִיב ay alitan o pagtatalo, samantalang ang מִשְׁפָּט sa pares na ito ay isang usaping nangangailangan ng paghatol. Pinananatili ng salin ang dalawang magkaugnay ngunit hindi ganap na magkaparehong diwa.
- source_word: וְהִצְדַּקְתִּיו
  choice: bibigyan ko siya ng makatarungang hatol
  rationale: Ang Hiphil ng צדק ay maaaring mangahulugang ipawalang-sala, kilalaning nasa tama, o igawad ang nararapat na katarungan. Ang saling ito ay natural sa kontekstong hudisyal ngunit ang iba pang posibilidad ay itinatala sa talababa.
