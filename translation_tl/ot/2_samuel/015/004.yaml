  to: Sinasabi ni Absalom[a], “Kung ako lamang ang italagang hukom sa lupain! Lalapit sana sa akin ang bawat taong may alitan o usaping legal[b], at bibigyan ko siya ng katarungan[c].”
  rationale: Inayos ang pandiwang pambungad upang maipakita ang paulit-ulit na pananalita sa konteksto, pinasimple ang ayos ng pangungusap para sa likas na Tagalog, at pinalitan ang “makatarungang hatol” ng “katarungan” upang mas maipakita ang legal na diwa ng וְהִצְדַּקְתִּיו nang hindi ipinipilit ang isang partikular na uri ng kaso. Iningatan ng talababa ang mga posibleng mas tiyak na salin.
