translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong legal na “hukom,” “alitan,” at “hatol,” habang iniwasan ang sobrang teknikal o makalumang pananalita. Ang retorikal na paghahangad at ang posibleng paborableng diwa ng huling pandiwa ay kapuwa pinanatili, kasama ang mga alternatibo sa mga talababa.
