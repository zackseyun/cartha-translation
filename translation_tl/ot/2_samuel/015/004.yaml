  source_fidelity: 'Tumpak ang pangunahing diwa: ang retorikal na paghahangad ni Absalom na maging hukom, ang paglapit sa kanya ng sinumang may alitan o kasong legal, at ang kaniyang pangakong magbigay ng katarungan. Gayunman, ang “Sinabi noon” ay mas madaling basahing minsanang pahayag kaysa sa paulit-ulit na pananalita sa konteksto, at ang “makatarungang hatol” ay maaaring maging neutral na makatarungang pasiya samantalang ang וְהִצְדַּקְתִּיו ay mas tuwirang tumutukoy sa pagbibigay-katarungan o pagpapahayag na nasa tama ang taong lumalapit.'
  naturalness: Natural ang karamihan ng Tagalog, ngunit mas malinaw at mas dumadaloy ang “Lalapit sana sa akin ang bawat taong...” kaysa sa baligtad na ayos na “Sa akin sana lumapit...”. Ang “bibigyan ko siya ng katarungan” ay karaniwang modernong Tagalog sa kontekstong legal at mas malapit sa pandiwang Hebrew.
  terminology: Ang “hukom,” “lupain,” at “alitan” ay angkop. Pinanatili ang “usaping legal” upang ipahayag ang משפט nang hindi inuulit ang ideya ng paghatol sa mismong salin. Ang talababa sa huling pandiwa ay inayos upang iwasang gawing eksklusibong kriminal ang “ipawawalang-sala.”
