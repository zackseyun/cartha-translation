base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: tl
  text: Ganito ang ginawa ni Absalom sa lahat ng mga Israelitang pumupunta sa hari upang magpahatol, at ninakaw ni Absalom ang puso[a] ng mga kalalakihan ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakuha ang loob ng mga kalalakihan ng Israel.” Literal sa Hebreo ang “ninakaw ang puso,” isang larawang nagpapahiwatig na palihim o mapanlinlang niyang nakuha ang kanilang katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: Ganito ang ginawa ni Absalom
  rationale: Tumutukoy ang parirala sa paulit-ulit na asal ni Absalom na inilarawan sa naunang talata. Likas sa Tagalog ang “Ganito ang ginawa” at malinaw nitong ibinabalik ang mambabasa sa paraang iyon.
- source_word: לְכָל יִשְׂרָאֵל אֲשֶׁר יָבֹאוּ
  choice: sa lahat ng Israelitang pumupunta
  rationale: Ang imperpektong pandiwa ay naglalarawan ng nakaugaliang kilos sa nakaraang salaysay. Ang “pumupunta” ay natural na naghahayag ng paulit-ulit na paglapit, at ang “mga Israelita” ay malinaw na tumutukoy sa mga taong kabilang sa Israel.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: sa hari upang magpahatol
  rationale: Sa kontekstong ito, ang מִשְׁפָּט ay isang usaping dinidinig o pasyang legal. Ipinahahayag ng “magpahatol” ang paglapit sa hari bilang hukom nang hindi dinaragdagan ang kahulugan.
- source_word: וַיְגַנֵּב ... אֶת לֵב
  choice: ninakaw ... ang puso
  rationale: Pinananatili nito ang matinding metapora ng Hebreo. Ipinahihiwatig ng idyoma na palihim o mapanlinlang na nakuha ni Absalom ang katapatan ng mga tao, sa halip na basta lamang sila nahikayat.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: kalalakihan ng Israel
  rationale: Ang אַנְשֵׁי ay anyong panlalaki na nangangahulugang “mga lalaki ng.” Pinananatili ng salin ang anyong may kasarian sa pinagmulang teksto, kahit maaari itong kumatawan sa mas malawak na sambayanan.
theological_decisions:
- issue: Saklaw ng may kasariang pananalitang אַנְשֵׁי יִשְׂרָאֵל
  choice: kalalakihan ng Israel
  alternative: mga mamamayan ng Israel / mga Israelita
  rationale: Bagaman maaaring gamitin ang panlalaking katawagan bilang kinatawan ng mas malawak na populasyon, hindi tahasang nilulutas ng salin ang posibleng saklaw nito. Pinananatili sa pangunahing teksto ang panlalaking anyo ng Hebreo.
- issue: Metapora ng pagnanakaw sa puso
  choice: ninakaw ... ang puso
  alternative: nakuha ang loob / nahikayat ang katapatan
  rationale: 'Ang literal na larawan ay mahalaga sa moral na paglalarawan sa ginawa ni Absalom: nakuha niya ang katapatan sa paraang may pahiwatig ng panlilinlang o pagmamanipula. Hindi ito pinapahina tungo sa neutral na “nahikayat.”'
translation_notes:
  register: Makabago at dignidad na Filipino ang ginamit. Ang “upang magpahatol” ay malinaw sa karaniwang mambabasa ngunit nananatiling angkop sa legal na konteksto. Pinanatili ang metaporang “ninakaw ang puso,” habang ipinaliliwanag sa talababa ang idyomatikong diwa nito.
