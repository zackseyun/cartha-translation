  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: tl
  text: Sinabi ni Absalom sa kanya, “Tingnan mo, mabuti at matuwid ang usapin mo[a], ngunit walang sinuman mula sa hari na didinig sa iyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mabuti at matuwid ang kaso mo.” Ang salitang Hebreo ay maaaring mangahulugang “salita,” “bagay,” “usapin,” o, sa legal na konteksto, “kaso.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang tagapakinig para sa iyo mula sa hari,” ibig sabihin, walang taong inatasan ng hari upang dinggin ang kaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: Sinabi ni Absalom sa kanya
  rationale: Likas na daloy ng salaysay sa modernong Tagalog; malinaw na pinananatili ang kausap na tinutukoy ng panghalip.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Ginagamit bilang panawag-pansin sa tuwirang pagsasalita; natural at kasalukuyang katumbas ng literal na “tingnan.”
- source_word: דְבָרֶךָ
  choice: ang usapin mo
  rationale: Sa konteksto ng paglapit para sa paghatol, tumutukoy ito sa legal na usapin o kaso, ngunit pinananatili ng “usapin” ang lawak ng kahulugang maaaring salita, bagay, o kaso.
- source_word: טוֹבִים וּנְכֹחִים
  choice: mabuti at matuwid
  rationale: 'Pinananatili ang dalawang hiwalay na pagtataya ng Hebreo: mabuti at tuwid/tama, nang hindi labis na nililimitahan sa teknikal na legal na bisa.'
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: ngunit walang sinuman mula sa hari na didinig sa iyo
  rationale: Inilalarawan ang kawalan ng taong mula o inatasan ng hari upang dinggin ang nagsasakdal; ang “didingig” ay angkop sa legal na konteksto at marangal ngunit nauunawaang Tagalog.
