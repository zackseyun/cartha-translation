  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: tl
  text: At naglakbay si Abner at ang kanyang mga tauhan sa Araba nang buong gabing iyon. Tumawid sila sa Jordan, dinaanan ang buong Bitron[a], at nakarating sa Mahanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “ang buong rehiyon ng bangin.” Maaaring pangalan ng isang pook ang salitang Hebreo na Bitron, o isang paglalarawan sa heograpiya ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: sa Araba
  rationale: Maaaring tumukoy ang עֲרָבָה sa rehiyon ng lambak ng Jordan at Araba, hindi lamang sa isang karaniwang kapatagan. Pinanatili ang heograpikong pangalan dahil bahagi ito ng tala ng kanilang paglalakbay.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: nang buong gabing iyon
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinahahayag na nagpatuloy ang paglalakbay sa kabuuan ng gabing iyon.
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: Tumawid sila sa Jordan
  rationale: Ang pandiwang עבר kasama ng Jordan ay tuwirang tumutukoy sa pagtawid sa ilog.
- source_word: כָּל הַבִּתְרוֹן
  choice: ang buong Bitron
  rationale: Hindi tiyak kung ang בִּתְרוֹן ay pangalan ng isang pook o paglalarawan sa rehiyong may bangin. Ang transliterasyong “Bitron” ang pinakamahusay na nagpapanatili sa kawalang-katiyakang ito nang hindi labis na binibigyang-kahulugan ang heograpiya.
- source_word: מַחֲנָיִם
  choice: Mahanaim
  rationale: Pangalan ito ng isang pook kaya isinalin ito sa pamamagitan ng transliterasyon.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: naglakbay … dinaanan … nakarating
  rationale: 'Pinananatili ng mga pandiwang ito ang sunod-sunod na kilos: patuloy na paglalakbay, pagdaan sa isang rehiyon, at pagdating sa hantungan.'
- source_word: וַאֲנָשָׁיו
  choice: ang kanyang mga tauhan
  rationale: Tumutugma ito sa literal na “kanyang mga lalaki” ngunit mas natural sa kontekstong militar, nang hindi tahasang nililimitahan ang kahulugan sa “mga sundalo.”
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili bilang mga pangalang heograpiko ang Araba, Jordan, Bitron, at Mahanaim. Inilagay ang talababa sa “Bitron,” ang mismong salitang may leksikal na kawalang-katiyakan.
