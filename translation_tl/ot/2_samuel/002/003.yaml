- from: Dinala rin ni David paakyat ang mga lalaking kasama niya, bawat isa kasama ang sarili niyang sambahayan, at nanirahan sila sa mga bayan ng Hebron.[a]
  to: Dinala ni David paakyat ang mga lalaking kasama niya, bawat isa kasama ang kanyang sambahayan, at nanirahan sila sa mga bayan ng Hebron.[a]
  rationale: Inalis ang “rin” upang hindi magdagdag ng diwang hindi tahasang nasa Hebreo. Pinanatili ang “paakyat” para sa direksiyonal na himig ng הֶעֱלָה, ang distributibong “bawat isa kasama ang kanyang sambahayan” para sa אִישׁ וּבֵיתוֹ, at ang talababa para sa saklaw ng “mga bayan ng Hebron.”
