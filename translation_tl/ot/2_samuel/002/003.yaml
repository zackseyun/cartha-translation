base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: tl
  text: Dinala ni David paakyat ang mga lalaking kasama niya, bawat isa kasama ang kanyang sambahayan, at nanirahan sila sa mga bayan ng Hebron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “sa mga lungsod ng Hebron.” Maaaring tumukoy ang Hebreo sa mga pamayanang sakop ng lugar ng Hebron, hindi lamang sa sentrong lungsod nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: ang mga lalaking kasama niya
  rationale: Tumutukoy ang אֲנָשָׁיו sa mga tauhang lalaki ni David, at nililinaw ng kasunod na parirala na sila ang mga kasama niya. Natural sa modernong Tagalog ang pinagsamang anyong ito nang hindi inuulit ang pag-aari.
- source_word: הֶעֱלָה
  choice: dinala ... paakyat
  rationale: Ang Hiphil ng עלה ay nangangahulugang magdala o magpaakyat. Pinananatili ng “paakyat” ang heograpikal na direksiyon patungo sa Hebron na nasa kaburulan.
- source_word: אִישׁ וּבֵיתוֹ
  choice: bawat isa kasama ang sarili niyang sambahayan
  rationale: 'Distributibo ang אִישׁ: bawat lalaki ay kasama ang kani-kaniyang sambahayan. Mas tumpak dito ang “sambahayan” kaysa literal na “bahay,” at iniiwasan ng “sarili niyang” ang maling pahiwatig na sambahayan ni David ang tinutukoy.'
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan sila
  rationale: Sa konteksto ng paglipat ng tirahan, ipinapahayag ng ישב ang paninirahan o pagtira, hindi lamang ang pag-upo. Likas at malinaw sa Tagalog ang “nanirahan.”
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: sa mga bayan ng Hebron
  rationale: Maaaring mangahulugan ang עָרִים ng mga bayan o lungsod. Ang “mga bayan ng Hebron” ay natural at nagpapanatili ng posibilidad na mga pamayanang kaugnay ng distrito ng Hebron ang tinutukoy.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Ginamit ang nakaugaliang transliterasyon sa Filipino para sa pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang diwang heograpikal ng pag-akyat at ang distributibong ayos ng bawat lalaki kasama ang kaniyang sambahayan. Inilagay ang talababa sa pariralang “mga bayan ng Hebron,” na siyang aktuwal na pinapaliwanag nito.
