  source_fidelity: Tumpak na naipapahayag ng draft ang pagdadala ni David sa mga lalaking kasama niya, ang distributibong pagsama ng kani-kaniyang sambahayan, at ang paninirahan sa mga bayan ng Hebron. Gayunman, ang “rin” ay walang katumbas na pang-abay sa Hebreo at maaaring magdagdag ng diwang “also.”
  naturalness: Likas at angkop sa makabagong Filipino ang karamihan ng pangungusap. Mas maayos na alisin ang hindi kailangang “rin”; malinaw pa rin ang ayos ng pangungusap at ang “bawat isa” ay tumutukoy sa mga lalaking nabanggit.
  terminology: Ang “sambahayan,” “nanirahan,” “mga bayan,” at “Hebron” ay angkop. Ang talababa ay wastong nakakabit sa “mga bayan ng Hebron” at maayos na ipinapaliwanag ang alternatibong “mga lungsod.”
