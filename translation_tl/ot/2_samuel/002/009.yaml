  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: tl
  text: at ginawa niya siyang hari ng Gilead, ng mga Ashurita[a], ng Jezreel, ng Efraim, ng Benjamin, at ng buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Ashurita,” isang anyong maaaring gamitin nang kolektibo. Ipinapalagay ng ilan na “Asher” ang tinutukoy, bilang lipi o rehiyon ng Asher.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: at ginawa niya itong hari
  rationale: Ang Hifil ng מלך na may hulaping tumutukoy sa ikatlong panauhang panlalaki ay nangangahulugang ginawa o itinalaga niya siyang hari. Natural sa modernong Tagalog ang “ginawa niya itong hari,” at napapanatili nito ang diwang sanhi.
- source_word: אֶל / עַל
  choice: sa
  rationale: Sa konteksto ng paghahari sa mga lupain at bayan, likas sa Tagalog ang “hari sa” upang ipahayag ang nasasakupang teritoryo o mga tao; ang paulit-ulit na “sa” ay tumutugma rin sa serye ng Hebreo.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Karaniwang anyong Tagalog ng pangalan ng rehiyon.
- source_word: הָאֲשׁוּרִי
  choice: mga Ashurita
  rationale: 'Mahirap ang anyong Masoretiko: isa itong pang-uring pantao na isahan ngunit maaaring kolektibo ang gamit. Isinasalin itong “mga Ashurita” sa pangunahing teksto habang inilalagay sa talababa ang posibleng pagkaunawa na “Asher.”'
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Karaniwang anyong Tagalog ng pangalan ng lipi.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Karaniwang anyong Tagalog ng pangalan ng lipi.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: buong Israel
  rationale: Ipinapahayag ng כֻּלֹּה ang kabuuang saklaw. Ang “buong Israel” ay malinaw, maikli, at natural sa Tagalog.
