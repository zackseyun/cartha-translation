  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: tl
  text: Sinabi ni Joab, “Buhay ang Diyos! Kung hindi ka nagsalita, hindi sana titigil ang mga tauhan sa paghabol sa kanilang mga kapatid hanggang umaga.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa umaga pa sana aalis ang mga tauhan, bawat isa mula sa pagsunod sa kanyang kapatid.” Ang “aalis” ay maaaring tumukoy sa paghinto ng pagtugis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: Buhay ang Diyos!
  rationale: Pinananatili ang tuwirang Hebreong pormula ng panunumpa sa isang maikli, natural, at marangal na anyo sa Tagalog.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: Kung hindi ka nagsalita
  rationale: Ipinahahayag ang pasubaling salungat sa nangyari at iniiwang walang tahasang layon ang pandiwang “nagsalita,” gaya sa Hebreo.
- source_word: כִּי אָז מֵהַבֹּקֶר
  choice: sa umaga pa sana
  rationale: Sa konteksto, malamang na ang ibig sabihin ay sa umaga lamang sana titigil ang pagtugis. Ang “sana” ay malinaw na naghuhudyat ng di-nangyaring bunga ng pasubali.
- source_word: נַעֲלָה הָעָם
  choice: umurong ang mga tauhan
  rationale: Ang pangunahing diwa ng עלה ay “umakyat/umalis,” ngunit sa kontekstong militar ay tumutukoy ito sa pagkalas o pag-urong mula sa pagtugis. Pinili ang natural na salitang “umurong” habang itinatala sa talababa ang mas literal na larawan.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: tumigil ang bawat isa sa paghabol sa kanyang kapatid
  rationale: Ang literal na “bawat lalaki mula sa likuran ng kanyang kapatid” ay isang Hebreong paraan ng pagsasabing huminto sa pagsunod o pagtugis. Ipinahahayag ng “paghabol” ang kontekstong militar, samantalang pinananatili ng “kapatid” ang diin sa pagkakamag-anak ng mga Israelita.
