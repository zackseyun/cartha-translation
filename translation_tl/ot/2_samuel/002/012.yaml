  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: tl
  text: Pagkatapos, lumabas mula sa Mahanaim patungong Gibeon si Abner na anak ni Ner, kasama ang mga lingkod ni Isboset[a] na anak ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo rito ay “Isboset”; ang taong ito ay tinatawag na “Esbaal” sa 1 Cronica 8:33; 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Pagkatapos, lumabas
  rationale: Isinusulong ng waw-consecutive ang salaysay. Pinananatili ng “lumabas” ang payak na diwa ng pandiwa; ang “Pagkatapos” ay nagbibigay ng natural na daloy sa makabagong Tagalog.
- source_word: אַבְנֵר בֶּן נֵר
  choice: si Abner na anak ni Ner
  rationale: Karaniwang transliterasyon ang ginamit sa mga pangalang pantangi, at natural sa Tagalog ang “na anak ni” para sa patronimiko.
- source_word: וְעַבְדֵי
  choice: kasama ang mga lingkod ni
  rationale: Maaaring tumukoy ang עֶבֶד sa mga lingkod, tauhan, o opisyal. Pinananatili ng “mga lingkod” ang leksikal na diwa nang hindi labis na tinutukoy ang kanilang tungkulin; nililinaw ng “kasama” ang ugnayan ng pinagsamang simuno.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isboset
  rationale: Ito ang anyong batay sa Masoretic Text ng Samuel at ang natural na transliterasyong Tagalog ng Ish-bosheth.
- source_word: בֶּן שָׁאוּל
  choice: na anak ni Saul
  rationale: Tuwirang isinasalin ang patronimiko sa natural na anyong Tagalog.
- source_word: מִמַּחֲנַיִם
  choice: mula sa Mahanaim
  rationale: Ang prefiks na מִן ay nangangahulugang “mula sa”; transliterado ang pangalan ng lugar.
- source_word: גִּבְעֹנָה
  choice: patungong Gibeon
  rationale: Ipinahihiwatig ng directional he ang pagkilos tungo sa lugar. Ang “patungong” ay nagpapanatili ng direksiyonal na diwa nang hindi kinakailangang ipalagay na nakarating na sila roon.
