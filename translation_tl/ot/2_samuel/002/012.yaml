translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inayos ang pagkakasunod ng mga parirala upang maging natural sa Tagalog, habang pinananatili ang mga pangalan, pinagmulan, destinasyon, at ugnayang patronimiko ng tekstong Hebreo.
