  source_fidelity: 'Tapat ang salin sa Hebreo: isinasalaysay nito ang paglabas ni Abner, kasama ang mga lingkod ni Isboset, mula Mahanaim patungo sa Gibeon. Ang “patungong” ay angkop na paghahatid ng direksiyonal na he at hindi nagpapahiwatig nang lampas sa teksto na tiyak nang nakarating sila.'
