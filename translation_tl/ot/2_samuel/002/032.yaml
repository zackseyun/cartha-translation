base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: tl
  text: Binuhat nila si Asahel at inilibing siya sa libingan ng kanyang ama[a] sa Betlehem. Pagkatapos, magdamag na naglakbay si Joab at ang kanyang mga tauhan, at inabutan sila ng bukang-liwayway sa Hebron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa puntod ng kanyang ama.” Ang salitang Hebreo na קֶבֶר ay maaaring tumukoy sa isang puntod o sa isang libingan, gaya ng libingang pampamilya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagliwanag para sa kanila sa Hebron,” isang idyomang Hebreo na tumutukoy sa pagsapit ng bukang-liwayway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: Binuhat nila
  rationale: Sa konteksto, tumutukoy ang נשׂא sa pagbuhat at pagdadala sa bangkay ni Asahel upang ilibing. Likas at malinaw sa Filipino ang “binuhat nila.”
- source_word: עֲשָׂהאֵל
  choice: Asahel
  rationale: Isinalin-titik ang pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing siya
  rationale: Ang קבר ay karaniwang pandiwang nangangahulugang maglibing; tuwiran at natural ang “inilibing siya.”
- source_word: בְּקֶבֶר אָבִיו
  choice: sa libingan ng kanyang ama
  rationale: Maaaring tumukoy ang קֶבֶר sa hukay o sa puntod/libingang pampamilya. Pinananatili ng “libingan” ang lawak ng kahulugan nang hindi pinipili nang tiyak ang isa.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: sa Betlehem
  rationale: Ang pariralang pantukoy ay nagsasaad ng kinaroroonan ng libingan. Sapat at likas sa Filipino ang “sa Betlehem” nang hindi na inuulit ang isang tahasang pandiwa.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: magdamag na naglakbay
  rationale: Malawak ang kahulugan ng הלך, at ipinahihiwatig rito ang tuloy-tuloy na paglalakbay sa buong gabi nang hindi kinakailangang tukuying isang pormal na martsa.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: si Joab at ang kanyang mga tauhan
  rationale: Ang “mga tauhan” ay natural na katumbas ng “kanyang mga lalaki” sa kontekstong militar at hindi labis na nagtatakda na pawang sundalo ang tinutukoy.
- source_word: וַיֵּאֹר לָהֶם
  choice: inabutan sila ng bukang-liwayway
  rationale: Literal na ipinahahayag ng idyomang Hebreo na “nagliwanag para sa kanila.” Ang salin ay natural sa Filipino at pinananatili ang diwang sumapit ang umaga habang naglalakbay sila.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Isinalin-titik ang pangalan ng lugar at ginamit ang karaniwang panandang lokatibong Filipino na “sa.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “libingan” upang mapanatili ang leksikal na lawak ng קֶבֶר, at “inabutan sila ng bukang-liwayway” upang likas na maipahayag ang idyomang Hebreo. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
