  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: tl
  text: Ngunit kinuha ni Abner, na anak ni Ner at kumander ng hukbo ni Saul, si Isboset[a], na anak ni Saul, at dinala niya ito sa Mahanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Isboset ay tinatawag na Esbaal sa 1 Cronica 8:33 at 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Ngunit ... ni Abner
  rationale: Ang וְ ay nagpapakita rito ng pagsalungat sa naunang salaysay tungkol sa pagpapahid kay David ng sambahayan ni Juda; natural itong ipinahayag sa Tagalog bilang “Ngunit.”
- source_word: בֶּן נֵר
  choice: anak ni Ner
  rationale: Tuwirang salin ng karaniwang pariralang nagpapahayag ng ugnayang ama at anak.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: ang kumander ng hukbo ni Saul
  rationale: Ang שַׂר צָבָא ay pinuno o kumander ng hukbo; malinaw at likas sa modernong Tagalog ang napiling parirala at pinananatili nito ang kaugnayan kay Saul.
- source_word: לָקַח
  choice: kinuha
  rationale: Karaniwang kahulugan ng pandiwa ang “kumuha.” Hindi tahasang hinihingi ng talata ang mas marahas na “sinunggaban” o “dinakip.”
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: si Isboset
  rationale: Tinumbasan sa natural na baybay-Tagalog ang personal na pangalang nasa tekstong Hebreo. Ang ibang anyong Esbaal ay inilagay sa talababa.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: at dinala siya
  rationale: Ang Hiphil ng עבר ay causative, “pinaraan” o “dinala sa kabila.” Dahil hindi tinutukoy sa talata kung ano ang tinawid, ang “dinala siya” ay natural at hindi nagdaragdag ng di-tiyak na detalye.
- source_word: מַחֲנָיִם
  choice: Mahanaim
  rationale: Pangalan ng lugar na isinalin sa pamamagitan ng transliterasyon.
