  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kumander” bilang karaniwang salitang Filipino para sa pinunong militar, at pinanatili ang mga pangalang pantangi sa anyong madaling basahin ng mga Tagalog.
