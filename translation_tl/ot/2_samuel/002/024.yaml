base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: tl
  text: Hinabol nina Joab at Abisai si Abner, at lumubog ang araw. Nakarating sila hanggang sa burol ng Amma, na nasa tapat ng Gia[a], sa daan patungo sa ilang ng Gibeon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nasa harap ng Gia”; maaaring tukuyin ng pananalitang Hebreo ang isang lugar na nasa harap o nasa tapat ng ibang lugar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa daang patungo sa ilang ng Gibeon”; maaaring higit na idiin ng Hebreo ang mismong ruta kaysa ang direksiyon lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: Hinabol ... si Abner
  rationale: Ang רדף na may אַחֲרֵי ay nagsasaad ng aktibong paghabol. Likas sa Tagalog ang pandiwang “hinabol,” kaya hindi na kailangang isalin nang hiwalay ang literal na “sa likuran ni Abner.”
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: at lumubog ang araw
  rationale: Ang literal na “dumating ang araw” ay idyomang Hebreo para sa paglubog ng araw. Malinaw at likas sa Tagalog ang “lumubog ang araw.”
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: Nakarating sila hanggang sa
  rationale: Ipinapahayag ng עַד ang hangganan ng kanilang paglalakbay. Ang “nakarating sila hanggang sa” ay natural at pinananatili ang diin sa lugar na kanilang naabot.
- source_word: גִּבְעַת אַמָּה
  choice: burol ng Amma
  rationale: Ito ay construct chain na binubuo ng “burol” at pangalang pantangi. Pinananatili ang pangalang Amma nang hindi ito binibigyan ng di-tiyak na kahulugan.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: na nasa tapat ng Gia
  rationale: Maaaring tukuyin ng עַל־פְּנֵי ang lokasyong kaharap o katapat ng isang lugar. Ang “nasa tapat ng” ay natural na heograpikong paglalarawan ngunit hindi nagtatakda ng direksiyong hindi tahasang binanggit.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: sa daan patungo sa ilang ng Gibeon
  rationale: Ang דֶּרֶךְ ay maaaring mangahulugang “daan” o “ruta.” Ipinahihiwatig ng parirala ang daang patungo sa ilang na kaugnay ng Gibeon.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: Joab / Abisai / Abner / Amma / Gia / Gibeon
  rationale: Isinalin sa karaniwang anyong madaling basahin sa makabagong Filipino ang mga pangalan ng tao at lugar.
