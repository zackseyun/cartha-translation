  text: וַ/יַּ֤עַל שָׁם֙ דָּוִ֔ד וְ/גַ֖ם שְׁתֵּ֣י נָשָׁ֑י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: tl
  text: 'Kaya umakyat doon si David, kasama rin ang dalawa niyang asawa: si Ahinoam na taga-Jezreel at si Abigail, na asawa ni Nabal na taga-Carmel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag dito si Abigail na “asawa ni Nabal” bilang pagkakakilanlang kaugnay ng naunang salaysay. Sa Hebreo, ang “taga-Carmel” ay tumutukoy kay Nabal.
    reason: literary_and_grammatical_clarification
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: umakyat doon
  rationale: Pinananatili ng “umakyat” ang direksiyonal na diwa ng עלה, samantalang natural na tinutukoy ng “doon” ang lugar na nabanggit sa naunang konteksto.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: kasama rin ang dalawa niyang asawa
  rationale: Ang “rin” ay naghahatid sa dagdag na diwa ng וְגַם. Ginawang hayag ang likas na ipinahihiwatig na pagsama ng mga asawa sa pag-akyat ni David upang maging malinaw at natural sa Tagalog.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: si Ahinoam na taga-Jezreel
  rationale: Ang pambansag na pambabae ay tumutukoy sa pinagmulan ni Ahinoam; ang “taga-Jezreel” ay malinaw at karaniwang anyo sa modernong Tagalog.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל
  choice: at si Abigail, na asawa ni Nabal
  rationale: Pinananatili ang pagkakakilanlan kay Abigail sa pamamagitan ng dati niyang asawa, ayon sa Hebreong salaysay, kahit kabilang na siya rito sa mga asawa ni David.
- source_word: הַכַּרְמְלִי
  choice: na taga-Carmel
  rationale: Ang panlalaking anyo sa Hebreo ay naglalarawan kay Nabal bilang lalaking mula sa Carmel. Mas natural sa Tagalog ang “taga-Carmel” kaysa sa hiniram na katawagang etniko.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “asawa” sa halip na mas teknikal o lumang katawagan, at ang “taga-” para sa likas na pagpapahayag ng pinagmulan.
