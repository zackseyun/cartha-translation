base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: tl
  text: At lumabas si Joab na anak ni Zeruya, kasama ang mga tauhan ni David, at nagtagpo sila sa tabi ng imbakan ng tubig[a] sa Gibeon. Umupo ang isang pangkat sa isang panig ng imbakan ng tubig, at ang isa naman sa kabilang panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tipunan ng tubig sa Gibeon”; ang salitang Hebreo ay maaaring tumukoy sa isang ginawang tipunan o imbakan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: At si Joab na anak ni Zeruya
  rationale: Pinananatili ng “At” ang pang-ugnay sa salaysay, at natural sa Tagalog ang “si Joab na anak ni Zeruya” bilang pagkakakilanlan.
- source_word: וְ/עַבְדֵי דָוִד
  choice: at ang mga tauhan ni David
  rationale: Sa kontekstong militar, ang עֲבָדִים ay mga tauhan o tagasunod ni David. Mas natural at hindi gaanong mapanlinlang dito ang “mga tauhan” kaysa literal na “mga lingkod,” nang hindi naman tahasang dinaragdagan ng “mga sundalo.”
- source_word: יָצְאוּ
  choice: ay lumabas
  rationale: Tuwirang katumbas ng karaniwang pandiwang יצא, nang hindi idinaragdag ang mas tiyak na diwang “nagmartsa.”
- source_word: וַֽ/יִּפְגְּשׁ֛וּ/ם
  choice: at nakatagpo nila ang mga iyon
  rationale: Isinasalin ang kahulugang “makatagpo/makasalubong” at pinananatili ang panghalip na tumutukoy sa pangkat nina Abner mula sa naunang talata.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: sa tabi ng imbakan ng tubig sa Gibeon
  rationale: Ang בְּרֵכָה ay maaaring isang ginawang tipunan, imbakan, o lawa ng tubig. Nililinaw ng “sa tabi” ang lokasyong pinagtatagpuan ng dalawang pangkat.
- source_word: יַחְדָּו
  choice: Sama-sama silang naroon
  rationale: Ang adverb ay nagpapahiwatig na ang dalawang pangkat ay nasa iisang lugar. Hiniwalay ito sa sariling pangungusap upang maiwasan ang di-natural o malabong “nakasalubong sila nang magkakasama.”
- source_word: וַ/יֵּשְׁבוּ
  choice: Naupo
  rationale: Pinananatili ang payak na kahulugan ng ישׁב sa tagpong ito.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: ang isang pangkat ... at ang isa naman
  rationale: Natural na ipinahahayag sa Tagalog ang pagtutunggali ng dalawang demonstratibo; ang “pangkat” ay tahasang nagpapalinaw sa dalawang panig ngunit hindi tinutukoy na mga sundalo ang mga ito.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: sa isang panig ng imbakan ng tubig ... sa kabilang panig
  rationale: Ito ang natural na Tagalog para sa Hebreong idyomang naglalarawan sa dalawang pangkat na nasa magkabilang panig ng iisang imbakan ng tubig.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mga tauhan” para sa pangkat ni David at “imbakan ng tubig” para maipakita ang posibleng artipisyal na reservoir, habang inilagay sa talababa ang mas maikli at pamilyar na alternatibong “lawa.”
