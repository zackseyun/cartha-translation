base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: tl
  text: Pagkatapos, hinipan ni Joab ang tambuli[a]. Tumigil ang lahat ng tao, at hindi na nila hinabol ang Israel ni ipinagpatuloy pa ang pakikipaglaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sungay na panghudyat”; ang salitang Hebreo ay tumutukoy sa sungay na ginagamit bilang instrumentong panghudyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: hinipan
  rationale: Kasama ng בַּשּׁוֹפָר, ang pandiwang תקע ay tumutukoy sa pag-ihip o pagpapatunog ng instrumentong hudyat. Likas sa Filipino ang “hinipan ang tambuli.”
- source_word: בַּשּׁוֹפָר
  choice: ang tambuli
  rationale: Ang שׁוֹפָר ay sungay na ginagamit bilang instrumentong panghudyat. Ang “tambuli” ay malinaw, maikli, at likas na katumbas sa Filipino nang hindi ipinapalagay na sungay ito ng tupa.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: Huminto ang buong bayan
  rationale: Bagaman literal na “tumayo” ang עמד, sa kontekstong militar ay nangangahulugan itong tumigil o huminto. Pinananatili ng “buong bayan” ang kolektibong katawagan ng Hebreo.
- source_word: הָעָם
  choice: ang buong bayan
  rationale: Literal na “ang bayan/mga tao” ang Hebreo. Tinutukoy nito rito ang mga tauhan ni Joab, ngunit hindi kailangang gawing mas tiyak na “mga kawal” sa pangunahing teksto.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: hindi na nila hinabol ang Israel
  rationale: Ang רדף אחרי ay “humabol/tumugis,” at ang negasyon na may עוֹד ay “hindi na.” Ang “hinabol” ay natural at malinaw sa makabagong Filipino.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang mismong pangalang “Israel,” gaya ng Hebreo, kahit tumutukoy ito sa hukbong nasa ilalim ni Abner sa konteksto.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: ni ipinagpatuloy pa ang pakikipaglaban
  rationale: Ang יסף na may pawatas, negasyon, at עוֹד ay nagsasaad na hindi na nila ipinagpatuloy o dinagdagan pa ang pagkilos. Ang “ni ... pa” ay natural na nag-uugnay sa naunang negatibong sugnay.
