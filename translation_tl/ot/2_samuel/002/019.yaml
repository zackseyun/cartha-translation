  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: tl
  text: Hinabol ni Asahel si Abner[a], at hindi siya lumiko sa kanan o sa kaliwa mula sa pagsunod kay Abner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tinugis ni Asahel si Abner at hindi siya lumihis sa kanan o sa kaliwa mula sa likuran ni Abner.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: Hinabol
  rationale: Ang רדף ay aktibong paghabol o pagtugis. Natural at malinaw sa makabagong Tagalog ang “hinabol” sa salaysay na ito.
- source_word: אַחֲרֵי אַבְנֵר
  choice: si Abner
  rationale: Kapag ginamit ang pandiwang “hinabol,” tuwirang layon ang likas na ayos sa Tagalog; taglay na ng pandiwa ang diwang “sa likuran ng” o “kasunod ni.”
- source_word: וְלֹא נָטָה
  choice: hindi siya lumiko
  rationale: Ang נטה rito ay paglihis o pagliko mula sa tinatahak na direksiyon. Pinananatili ng “lumiko” ang pisikal na larawan.
- source_word: לָלֶכֶת עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: sa kanan o sa kaliwa
  rationale: Ito ang natural na katumbas ng Hebreong idyoma tungkol sa hindi paglihis sa direksiyon; hindi kailangang isalin nang hiwalay ang לָלֶכֶת dahil naipahihiwatig na ang pagkilos sa “lumiko.”
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: habang sinusundan ito
  rationale: Ipinahahayag nito na hindi lumihis si Asahel sa patuloy na pagsunod kay Abner. Ginamit ang “ito” upang maiwasan ang mabigat na pag-uulit ng pangalan habang nananatiling malinaw ang tinutukoy.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: Asahel / Abner
  rationale: Ginamit ang nakasanayang anyo ng mga pangalang biblikal sa Tagalog.
