base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: tl
  text: Muling sinabi ni Abner kay Asahel, “Lumihis ka na; huwag mo na akong sundan. Bakit pa kita hahampasin at ibubuwal sa lupa? Kung gayon, paano ko maitataas ang mukha ko sa harap ng kapatid mong si Joab?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Paano ko mahaharap ang kapatid mong si Joab?” Literal sa Hebreo, “Paano ko maitataas ang mukha ko sa kapatid mong si Joab?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: Muling sinabi ni Abner
  rationale: Ang idyomang literal na ‘nagdagdag pa upang sabihin’ ay nagpapahiwatig na nagsalita siyang muli; natural at tapat dito ang ‘muling sinabi.’
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: Tumigil ka na sa paghabol sa akin
  rationale: Ang סוּר ay paglihis o pagtigil, at ang מֵאַחֲרַי ay literal na ‘mula sa likuran ko’ ngunit sa konteksto ay paghabol o pagsunod. Dahil habulan ang tagpo, ‘paghabol’ ang likas na salin.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Bakit pa kita hahampasin at ibubuwal sa lupa?
  rationale: Pinananatili nito ang pagkilos ng נכה (‘hampasin’) at ang direksiyon/resulta ng אַרְצָה (‘sa lupa’), nang hindi tahasang ginagawang ‘papatayin,’ bagaman maaaring kamatayan ang ipinahihiwatig.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: paano ko pa maitataas ang mukha ko
  rationale: Pinananatili ang Hebreong larawan ng ‘pag-angat ng mukha,’ na nagpapahayag ng kakayahang humarap nang walang hiya.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: sa harap ng kapatid mong si Joab
  rationale: Ipinapahayag nang natural sa Tagalog ang taong haharapin ni Abner, habang malinaw na pinananatili ang ugnayang magkapatid.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Asahel / Abner / Joab
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa modernong Tagalog.
