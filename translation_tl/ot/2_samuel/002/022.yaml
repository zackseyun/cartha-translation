  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘paghabol’ ayon sa konteksto ng salaysay, at pinanatili sa pangunahing teksto ang larawang ‘maitataas ang mukha’ upang hindi mawala ang Hebreong idyoma.
