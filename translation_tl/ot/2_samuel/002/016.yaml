translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katapat” upang ilarawan ang pares na magkalaban nang hindi nagpapahiwatig ng pagkakaibigan. Inilipat ang talababa sa mismong pangalang Helkat-hazurim, sapagkat ang nilalaman nito ay nagpapaliwanag sa pangalang iyon.
