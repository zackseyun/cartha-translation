  text: וַֽ/יַּחֲזִ֜קוּ אִ֣ישׁ בְּ/רֹ֣אשׁ רֵעֵ֗/הוּ וְ/חַרְבּ/וֹ֙ בְּ/צַ֣ד רֵעֵ֔/הוּ וַֽ/יִּפְּל֖וּ יַחְדָּ֑ו וַ/יִּקְרָא֙ לַ/מָּק֣וֹם הַ/ה֔וּא חֶלְקַ֥ת הַצֻּרִ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: tl
  text: Bawat isa ay humawak sa ulo ng kanyang katapat, at ang kanyang espada ay nasa tagiliran ng kanyang katapat; sabay silang bumagsak. Dahil dito, tinawag na Helkath-hazzurim[a] ang lugar na iyon sa Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Helkath-hazzurim ay transliterasyon ng pangalang Hebreo. Hindi tiyak ang eksaktong kahulugan nito; kabilang sa mga mungkahing kahulugan ang “Bukid ng mga Tagiliran,” “Bukid ng Matalatalim na Tabak,” at iba pang kahawig na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ
  choice: Hinawakan
  rationale: Ipinahihiwatig ng pandiwa sa tagpong ito ang mahigpit at marahas na paghawak sa labanan. Natural sa Filipino ang “hinawakan” sa pariralang “hinawakan ... ang ulo,” habang ang marahas na konteksto ang nagpapalinaw sa lakas ng kilos.
- source_word: אִישׁ
  choice: bawat isa
  rationale: 'Distributibo ang gamit: bawat mandirigma ay kumilos laban sa kanyang katapat. Hindi kailangang ulitin ang kasariang panlalaki sa Filipino.'
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: ang ulo ng kanyang katapat
  rationale: Literal ang רֹאשׁ na “ulo.” Sa kontekstong ito, ang רֵעַ ay ang kaharap o kaparis sa tunggalian, kaya mas angkop ang “katapat” kaysa “kaibigan” o “kasama.”
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: at itinarak ang espada sa tagiliran nito
  rationale: Walang tahasang pandiwa ang masiksik na sugnay sa Hebreo, ngunit malinaw na inilalarawan nito ang espada sa tagiliran ng katapat. Ang “itinarak” ay natural at malinaw sa Filipino, bagaman ginagawa nitong tahasan ang kilos na ipinahihiwatig lamang ng Hebreo.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: Kaya sabay-sabay silang bumagsak
  rationale: Ipinapakita ng “kaya” ang bunga ng magkasabay na pananaksak, at pinananatili ng “sabay-sabay” ang diin ng יַחְדָּו sa sabayang pagbagsak ng lahat ng magkakatapat.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Dahil dito, tinawag ... ang lugar na iyon
  rationale: Hindi tinutukoy kung sino ang nagpangalan; ang pasibong “tinawag” ay natural na paraan sa Filipino upang mapanatili ang di-tiyak na tagaganap. Ipinahihiwatig ng “Dahil dito” na bunga ng pangyayari ang pangalan.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Helkat-hazurim
  rationale: Isinalin sa baybay-Filipino ang tunog ng pangalang Hebreo sa halip na pumili ng isang pinagtatalunang kahulugan. Sa gayon ay hindi artipisyal na nilulutas ang malabong etimolohiya.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: ang lugar na iyon sa Gibeon
  rationale: Natural at maikli sa Filipino ang “sa Gibeon” para tukuyin ang kinaroroonan ng pinangalanang lugar.
