base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: tl
  text: Dumating ang mga lalaki ng Juda, at doon ay pinahiran nila si David bilang hari sa sambahayan ng Juda. At sinabi nila kay David, “Ang mga lalaki ng Jabes-Gilead ang naglibing kay Saul.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ang mga lalaki ng Jabes-Gilead ay naglibing kay Saul.”'
    reason: Ipinapakita nito ang mas payak na salin ng huling nominal na pahayag nang hindi binibigyang-diin ang pagkakakilanlan.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Ang בוא ay nagsasaad dito ng pagdating sa lugar; likas at tuwiran sa salaysay ang “dumating.”
- source_word: אַנְשֵׁי יְהוּדָה
  choice: ang mga lalaki ng Juda
  rationale: Tiyak na panlalaki ang אַנְשֵׁי, kaya pinanatili ang “mga lalaki” sa halip na gawing pangkalahatang “mga tao.”
- source_word: וַיִּמְשְׁחוּ
  choice: pinahiran nila
  rationale: Sa konteksto ng pagkahari, ang משׁח ay tumutukoy sa ritwal na pagpapahid upang kilalanin o italaga ang hari.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang katumbas ito ng pang-abay na tumutukoy sa lugar.
- source_word: לְמֶלֶךְ
  choice: bilang hari
  rationale: Malinaw at natural na ipinapahayag nito ang tungkuling pinaglagyan kay David sa pagpapahid.
- source_word: עַל בֵּית יְהוּדָה
  choice: sa sambahayan ng Juda
  rationale: Pinananatili ng “sambahayan” ang kolektibo at pantribong larawan ng בֵּית nang hindi ito pinapantay lamang sa isang teritoryo.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: At sinabi nila kay David
  rationale: Natural itong salin ng pormulang Hebreo para sa pagbibigay ng ulat at pagpapakilala ng tuwirang pananalita; hindi kailangang ulitin sa Filipino ang “na sinasabi.”
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: ang mga lalaki ng Jabes-Gilead
  rationale: Pinananatili ang panlalaking katawagan at ang tambalang pangalan ng lugar.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: ang naglibing kay Saul
  rationale: Ang ayos na “ang … ang naglibing” ay natural na naghahayag ng pagkakakilanlan o pagbibigay-diin, habang ang payak na sugnay na “na naglibing” ay nananatiling posibleng pagbasa.
theological_decisions:
- issue: Panlalaking kolektibong katawagan sa אַנְשֵׁי
  choice: Isinalin bilang “mga lalaki” sa dalawang paglitaw.
  alternative: “mga tao” o “mga pinuno”
  rationale: Panlalaki ang leksikal na anyo ng Hebreo. Hindi ito ginawang neutral o nilimitahan sa “mga pinuno,” na hindi tahasang sinasabi ng teksto.
- issue: Larawang pantribo sa בֵּית יְהוּדָה
  choice: Pinanatili bilang “sambahayan ng Juda.”
  alternative: “Juda” o “lipi ng Juda”
  rationale: Iniiwasan nitong paliitin ang kahulugan sa lupain lamang o magdagdag ng katawagang “lipi” na wala mismo sa parirala.
- issue: Diin sa pagkakakilanlan sa אֲשֶׁר קָבְרוּ
  choice: “Ang mga lalaki ng Jabes-Gilead ang naglibing kay Saul.”
  alternative: “Ang mga lalaki ng Jabes-Gilead na naglibing kay Saul.”
  rationale: Maaaring may puwersang nagpapakilala ang sugnay, ngunit maaari rin itong basahin bilang payak na sugnay na naglalarawan; pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinahiran” bilang pamilyar na terminong biblikal para sa royal anointing, at “sambahayan” upang mapanatili ang kolektibong larawan ng Hebreo. Inilipat ang talababa sa huling sugnay, na siyang aktuwal na kinalalagyan ng leksikal na alternatibo.
