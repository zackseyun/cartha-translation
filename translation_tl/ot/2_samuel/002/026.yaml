revisions:
- from: Pagkatapos, sumigaw si Abner kay Joab, “Habang panahon na lang bang lalamon ang tabak? Hindi mo ba alam na magiging mapait ang kahihinatnan nito? Hanggang kailan ka hindi magsasabi sa mga tauhan na tumigil sa paghabol sa kanilang mga kapatid?”
  to: Pagkatapos, tumawag si Abner kay Joab at sinabi, “Magpakailanman na lang bang lalamon ang tabak? Hindi mo ba alam na sa huli ay mapait ang kahihinatnan? Hanggang kailan bago mo sabihin sa mga tao na bumalik mula sa pagtugis sa kanilang mga kapatid?”[a]
  rationale: Binago ang mga bahaging nagdaragdag ng tindi o nagkukulang sa kilos na ipinahahayag ng Hebreo. Ang salin ay nananatiling malinaw at marangal sa modernong Filipino Tagalog, habang ang talababa ay nag-iingat sa mas literal na posibilidad ng pariralang tumutukoy sa pagtugis.
