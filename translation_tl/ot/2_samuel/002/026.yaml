base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: tl
  text: Pagkatapos, tumawag si Abner kay Joab at sinabi, “Magpakailanman na lang bang lalamon ang tabak? Hindi mo ba alam na sa huli ay mapait ang kahihinatnan? Hanggang kailan bago mo sabihin sa mga tao na bumalik mula sa pagtugis sa kanilang mga kapatid?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “bumalik mula sa pagsunod sa kanilang mga kapatid.”'
    reason: Ang Hebreong parirala ay literal na ‘bumalik mula sa likuran ng kanilang mga kapatid’; ang ‘pagtugis’ ay kontekstuwal na pagpapakahulugan sa labanan, samantalang ang ‘pagsunod’ ay mas malapit sa anyong leksikal.
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: Habang panahon na lang ba
  rationale: Likas na retorikal na tanong sa modernong Tagalog na nagpapahiwatig ng walang katapusang pagpapatuloy.
- source_word: תֹּאכַל חֶרֶב
  choice: lalamon ang tabak
  rationale: Pinananatili ang matingkad na personipikasyon sa Hebreo, kung saan ang tabak ang lumalamon.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: magiging mapait ang kahihinatnan nito
  rationale: Pinananatili ang talinghagang 'mapait' habang malinaw na ipinahahayag ang pangwakas na resulta.
- source_word: וְעַד מָתַי לֹא תֹאמַר
  choice: Hanggang kailan ka hindi magsasabi
  rationale: Malapit sa anyo at diin ng Hebreo at natural pa rin bilang tanong tungkol sa pagkaantala ni Joab.
- source_word: לָעָם
  choice: sa mga tauhan
  rationale: Sa kontekstong militar, tumutukoy ito sa mga lalaking nasa ilalim ni Joab; mas tiyak at natural kaysa pangkalahatang 'mga tao.'
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: tumigil sa paghabol
  rationale: Sa konteksto ng labanan, ang pagbabalik mula sa likuran ng iba ay nangangahulugang itigil ang pagtugis.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal at emosyonal na puwersa ng magkakamag-anak at kapuwa Israelitang naglalaban.
