translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang personipikasyon ng tabak at ang katawagang 'mga kapatid'; isinalin ang pariralang militar ayon sa konteksto bilang 'tumigil sa paghabol.'
