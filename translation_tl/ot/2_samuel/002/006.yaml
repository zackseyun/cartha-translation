- from: At ngayon, nawa’y ipakita sa inyo ni Yahweh ang tapat na pag-ibig at katapatan[a]. At gagawin ko rin sa inyo ang mabuting ito[c], dahil ginawa ninyo ang bagay na ito[b].
  to: At ngayon, nawa’y ipakita sa inyo ni Yahweh ang tapat na pag-ibig at katapatan[a]. At gagawin ko rin para sa inyo ang kabutihang ito[c], dahil ginawa ninyo ang bagay na ito[b].
