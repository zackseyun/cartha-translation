base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: tl
  text: At ngayon, nawa’y ipakita sa inyo ni Yahweh ang tapat na pag-ibig at katapatan[a]. At gagawin ko rin para sa inyo ang kabutihang ito[c], dahil ginawa ninyo ang bagay na ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipapakita sa inyo ni Yahweh ang tapat na pag-ibig at katapatan.” Maaaring unawain ang pandiwang Hebreo bilang isang kahilingan ng pagpapala o bilang pahayag tungkol sa hinaharap.
    reason: alternative_reading
  - marker: b
    text: 'Ang “bagay na ito” ay tumutukoy sa ginawa nilang binanggit sa naunang talata: ang paglilibing kay Saul.'
    reason: cross_reference
  - marker: c
    text: O “ang mabuting bagay na ito.” Literal na sinasabi ng Hebreo, “ang mabuti/ang kabutihan na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pagpapatuloy mula sa naunang talata at ang temporal na diin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang banal na pangalan bilang transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: יַעַשׂ
  choice: nawa’y ipakita
  rationale: Ang imperfect ay malamang na may puwersang jussive bilang pagpapala o panalangin; ang “ipakita” ay likas kasama ng mga abstraktong layon.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matibay at mapagkakatiwalaang pag-ibig nang hindi ipinapasok ang mas makitid na doktrinal na paliwanag.
- source_word: וֶאֱמֶת
  choice: katapatan
  rationale: Sa tambalang חֶסֶד וֶאֱמֶת, tumutukoy ito sa pagiging maaasahan sa ugnayan, hindi lamang sa abstraktong katotohanan.
- source_word: וְגַם אָנֹכִי
  choice: At gagawin ko rin
  rationale: Pinananatili ng “rin” ang additive at emphatic na diwa ng parirala.
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: gagawin ko rin sa inyo ang mabuting ito
  rationale: Malapit ito sa pormang Hebreo at pinananatili ang pagkakaiba ng טוֹבָה (“mabuti”) sa חֶסֶד (“tapat na pag-ibig”).
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: dahil ginawa ninyo ang bagay na ito
  rationale: Likas na ipinapakita ang dahilan at pinananatili ang demonstratibong pagtukoy sa ginawa nilang binanggit sa naunang talata.
theological_decisions:
- issue: Puwersa ng imperfect na יַעַשׂ
  choice: 'Pagpapala o kahilingan: “nawa’y ipakita”'
  alternative: 'Pahayag tungkol sa hinaharap: “ipapakita”'
  rationale: Ang konteksto ay pagpapala ni David sa mga taga-Jabes-gilead, ngunit tunay na posible rin sa Hebreo ang pagbasa bilang pahayag sa hinaharap; kaya inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan. Pinanatili ang bahagyang pormal na “ang mabuting ito” upang masalamin ang Hebreo at hindi ito ipaghalo sa naunang חֶסֶד; nilinaw sa talababa ang mas likas na alternatibong “kabutihang ito.”
