  terminology: Ang “magigiting na lalaki,” “panginoon,” “sambahayan ng Juda,” at “pinahiran” ay angkop. Ang “pinahiran” ay wastong nagpapanatili sa seremonyal na pandiwa nang hindi nagdaragdag ng kahulugang doktrinal.
