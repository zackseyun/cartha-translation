base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: tl
  text: At ngayon, magpakatatag kayo[a] at maging magigiting na lalaki, sapagkat patay na ang panginoon ninyong si Saul, at ako man ay pinahiran ng sambahayan ng Juda bilang hari nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumakas nawa ang inyong mga kamay.” Idyoma ito para sa pagkakaroon ng lakas ng loob at kahandaang kumilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang tahasang panandang panahong עַתָּה. Ang “kaya ngayon” ay natural na naghuhudyat ng panawagang ibinatay ni David sa naunang sinabi.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: magpakatatag kayo[a]
  rationale: Ang literal na larawan ay “lumakas nawa ang inyong mga kamay,” isang idyoma ng pagpapalakas ng loob at kapasidad na kumilos. Ang “magpakatatag kayo” ay malinaw at natural sa Filipino; iniingatan sa talababa ang konkretong larawan ng Hebreo.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: at maging magigiting na lalaki
  rationale: Ang בְּנֵי חַיִל ay tumutukoy sa mga lalaking may tapang, lakas, at kakayahan, madalas sa kontekstong militar. Ang “magigiting na lalaki” ay likas at pinananatili ang panlalaking anyo at konteksto.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: sapagkat patay na ang inyong panginoong si Saul
  rationale: Ang כִּי ay nagbibigay ng dahilan. Ang אֲדֹנֵיכֶם ay pantawag sa taong pinuno o nakatataas, kaya ang maliit na titik na “panginoon” ay angkop at hindi ito ipinagkakamali sa banal na pangalan.
- source_word: וְגַם אֹתִי מָשְׁחוּ
  choice: Pinahiran din ako
  rationale: Pinananatili ng “din ako” ang dagdag at diin ng וְגַם אֹתִי. Ang “pinahiran” ay tumutukoy sa seremonyal na pagtatalaga, hindi lamang sa pagpili.
- source_word: בֵּית יְהוּדָה
  choice: sambahayan ng Juda
  rationale: Pinananatili ng “sambahayan” ang kolektibong larawan ng בֵּית bilang lipi o pangkat ng Juda, sa halip na gawing pangalan lamang na “Juda.”
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: bilang hari nila
  rationale: Natural nitong ipinahahayag ang tungkuling ipinagkaloob sa pagpapahid at ang pamamahala ni David sa sambahayan ng Juda.
theological_decisions:
- issue: Panlalaking anyo ng לִבְנֵי חַיִל
  choice: maging magigiting na lalaki
  alternative: maging matatapang kayo
  rationale: Tahasang panlalaki ang ekspresyon at ang kausap ay mga lalaking tagapagtanggol at tagasuporta ni Saul. Hindi ito ginawang neutral o abstraktong katangian lamang.
- issue: Kahulugan ng אֲדֹנֵיכֶם para kay Saul
  choice: ang inyong panginoong si Saul
  alternative: ang inyong pinunong si Saul
  rationale: Ito ay makataong titulong pampolitika at pandangal, hindi pagtukoy sa Diyos. Pinananatili ng “panginoon” ang ugnayan ng katapatan at kapamahalaan nang hindi nagdaragdag ng ibang teolohiya.
- issue: Pagpapahid kay David bilang hari
  choice: Pinahiran din ako ng sambahayan ng Juda bilang hari nila
  alternative: Pinili rin ako ng sambahayan ng Juda na maging hari nila
  rationale: Mahalagang panatilihin ang mismong gawa ng pagpapahid bilang seremonyal na pagtatalaga; hindi ito dapat paliitin sa pangkalahatang pagpili lamang.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “magpakatatag” ay mas madaling maunawaan kaysa sa literal na idyoma, habang inilalagay sa talababa ang larawan ng “malalakas na kamay.” Pinanatili ang “sambahayan ng Juda” at “pinahiran” dahil mahalaga ang kanilang historikal at seremonyal na diwa.
