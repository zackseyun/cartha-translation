  terminology: Ang “labanan,” “mga tauhan ng Israel,” at “mga lingkod ni David” ay angkop at magkakatugma sa mga terminong pinili sa audit trail. Ang talababa sa “mga lingkod ni David” ay sapat na nagpapaliwanag ng gamit-militar nito nang hindi pinapalitan ang pangunahing salin.
