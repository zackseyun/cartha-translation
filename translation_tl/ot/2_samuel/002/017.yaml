  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: tl
  text: Napakatindi ng labanan nang araw na iyon,[a] at natalo si Abner at ang mga tauhan ng Israel sa harap ng mga lingkod ni David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Napakabigat ng labanan nang araw na iyon.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “mga lingkod ni David” ay ang kanyang mga tauhan o puwersa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: ang labanan
  rationale: Tumutukoy ito sa tiyak na sagupaan sa salaysay, kaya mas angkop ang “labanan” kaysa sa mas malawak na “digmaan.”
- source_word: קָשָׁה עַד מְאֹד
  choice: napakatindi
  rationale: Pinagsasama nito ang diwa ng קָשָׁה na “matindi/mabigat” at ang malakas na pagpapasidhi ng עַד מְאֹד, sa natural na makabagong Tagalog.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na temporal na parirala sa Tagalog na malinaw na tumutukoy sa araw ng sagupaan.
- source_word: וַיִּנָּגֶף
  choice: natalo
  rationale: Sa kontekstong militar, ang Niphal ng נָגַף ay nagpapahayag ng pagkatalo sa harap ng kalaban, hindi lamang ng pisikal na pagkasugat.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Tagalog.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: at ang mga tauhan ng Israel
  rationale: Ang “mga tauhan” ay natural na tumutukoy sa mga lalaking nasa hukbo ni Abner nang hindi pinalalawak ang saklaw sa lahat ng Israelita.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang Hebreong idyoma para sa pagkatalo sa harap ng isang kalabang puwersa.
- source_word: עַבְדֵי דָוִד
  choice: mga lingkod ni David
  rationale: Malapit ito sa literal na kahulugan ng עֶבֶד at pinananatili ang ugnayan ng paglilingkod kay David; nililinaw sa talababa ang militar na gamit sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawang “sa harap ng” at ang katawagang “mga lingkod ni David,” habang gumamit ng natural na “mga tauhan ng Israel” para sa puwersang pinamumunuan ni Abner.
