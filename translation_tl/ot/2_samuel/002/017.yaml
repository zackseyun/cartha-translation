  source_fidelity: 'Tapat ang salin sa Hebreo: ang tiyak na sagupaan ay inilalarawan bilang napakatindi, at si Abner kasama ang mga tauhan ng Israel ay natalo laban sa mga nasa paglilingkod ni David. Ang “sa harap ng” ay pinananatili ang pormang Hebreo ng paglalarawan sa pagkatalo sa harap ng kalabang puwersa.'
