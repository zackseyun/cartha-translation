  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: tl
  text: Ang haba ng panahon ng paghahari ni David sa Hebron bilang hari sa sambahayan ng Juda ay pitong taon at anim na buwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ang bilang ng mga araw.” Ang idyomang Hebreo ay tumutukoy sa tagal ng paghahari ni David sa Hebron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Sa buod na pahayag na ito, ang anyo ng היה ay likas na naipapahayag sa Filipino sa pamamagitan ng pangungusap na may panandang “ay,” sa halip na ng literal ngunit mabigat na “at nangyari.”
- source_word: מִסְפַּר הַיָּמִים
  choice: Ang haba ng panahon
  rationale: Literal itong “bilang ng mga araw,” ngunit idyoma ito para sa tagal ng panahon; malinaw at likas ang “haba ng panahon” sa modernong Filipino.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: naghari si David
  rationale: Ang literal na “si David ay hari” ay tumutukoy rito sa panahon ng kaniyang paghahari; maikli at natural na ipinahahayag ito ng pandiwang “naghari.”
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Ipinapahiwatig ng pang-ukol ang lugar kung saan siya naghari; karaniwang gamit sa Filipino ang “sa” para sa isang lungsod.
- source_word: עַל בֵּית יְהוּדָה
  choice: sa sambahayan ng Juda
  rationale: Pinananatili ng “sambahayan” ang בֵּית at ang kolektibong diwa nito, sa halip na gawing “Juda” lamang; ang “sa” ay likas na pananda sa Filipino para sa nasasakupan ng paghahari.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: pitong taon at anim na buwan
  rationale: Tuwiran at likas na salin ng itinakdang tagal.
