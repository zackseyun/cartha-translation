  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: tl
  text: Si Isboset[a] na anak ni Saul ay apatnapung taong gulang nang magsimula siyang maghari sa Israel, at dalawang taon siyang naghari. Ngunit ang lipi ng Juda[b] ay sumunod kay David.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Masoretic Text, Isboset ang pangalan dito; ihambing ang alternatibong anyong Esbaal sa kaugnay na mga tradisyon.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “bahay ng Juda,” isang kolektibong katawagan sa lipi o kaharian ng Juda.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “naging tapat kay David” o “pumanig kay David.” Ang literal na idyomang Hebreo ay “nasa likod ni David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: apatnapung taong gulang
  rationale: Karaniwang idyoma ito sa Hebreo para tukuyin ang edad; natural at malinaw ang katumbas sa Tagalog.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isboset
  rationale: Pinananatili ang anyo ng pangalan sa Masoretic Text, gamit ang nakaugaliang baybay sa Filipino.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinakikilala ng anyong Hebreo ang panahon kung kailan nagsimula ang paghahari, gaya ng karaniwang pormula tungkol sa mga hari.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa konteksto ng paghahari, ipinahihiwatig ng עַל ang pamamahala sa isang bayan; natural sa Filipino ang “maghari sa Israel.”
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: at dalawang taon siyang naghari
  rationale: Tuwirang inilalahad ang tagal ng paghahari habang pinananatili ang payak na estilong pasalaysay.
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinakikita ang malinaw na pagsalungat ng katapatan ng Juda sa paghahari ni Isboset sa Israel.
- source_word: בֵּית יְהוּדָה
  choice: ang angkan ng Juda
  rationale: Ang literal na “bahay ng Juda” ay isang kolektibong katawagan sa lipi o sambayanan ng Juda; mas malinaw sa modernong Tagalog ang “angkan” habang pinananatili ang kolektibong diwa.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: ay sumunod kay David
  rationale: Ang literal na “nasa likod ni David” ay idyoma ng pagsuporta o katapatan; pinananatili ng “sumunod kay David” ang larawang Hebreo at ang pampolitikang diwa nang hindi ito labis na nililinaw.
