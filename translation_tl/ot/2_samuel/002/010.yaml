translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “angkan ng Juda” upang maipahayag ang kolektibong diwa ng Hebreong “bahay” nang hindi maging malabo sa karaniwang mambabasa. Inilagay ang mga talababa sa mismong salita o pariralang tinutukoy ng bawat isa.
