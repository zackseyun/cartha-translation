  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: tl
  text: Ngunit pinabagsak ng mga tauhan ni David ang 360 lalaki mula sa lipi ni Benjamin at mula sa mga tauhan ni Abner, at namatay ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At pinabagsak ng mga tauhan ni David ...” Maaari ring isalin na “at” ang pangatnig sa Hebreo; ginamit sa pangunahing teksto ang “ngunit” upang ipakita ang paghahambing sa bilang ng mga nasawi sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: Ngunit ... mga tauhan ni David
  rationale: Maaaring mangahulugang “at” o magpahiwatig ng pagsalungat ang וְ. Ang “Ngunit” ay likas na nagpapakita ng paghahambing sa bilang ng mga namatay sa panig ni David sa naunang talata. Ang עַבְדֵי ay “mga tauhan” sapagkat mga mandirigmang naglilingkod kay David ang tinutukoy, hindi pangunahing ang kalagayan ng pagkaalipin.
- source_word: הִכּוּ
  choice: pinabagsak
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa pananakit o pagpapabagsak sa kaaway. Pinananatili ng “pinabagsak” ang larawang militar at hindi nito isinasanib sa iisang salita ang kasunod na tahasang pahayag na namatay sila.
- source_word: מִ/בִּנְיָמִן
  choice: mula sa lipi ni Benjamin
  rationale: Ipinahihiwatig ng מִן ang pangkat na pinagmulan ng mga nasawi. Idinagdag ang “lipi” upang maging malinaw sa karaniwang mambabasang Filipino na ang Benjamin dito ay pangkat panlipi, hindi lamang isang indibidwal.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: at sa mga tauhan ni Abner
  rationale: Tinutukoy nito ang mga lalaking kabilang sa pangkat ni Abner. Ang “mga tauhan” ay natural sa Filipino para sa mga mandirigma o tagasunod ng isang pinuno.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: 360 lalaki
  rationale: Tuwirang paglilipat ng bilang; ang “lalaki” ay angkop sa mga mandirigmang tinutukoy ng אִישׁ.
- source_word: מֵתוּ
  choice: at namatay ang mga ito
  rationale: Tahasan itong pinanatili dahil hiwalay na sinasabi ng Hebreo na namatay sila, kahit maaari nang ipahiwatig ng “pinabagsak” ang nakamamatay na kinalabasan sa konteksto ng digmaan.
