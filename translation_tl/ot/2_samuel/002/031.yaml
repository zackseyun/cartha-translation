translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “mga tauhan” para sa mga mandirigmang naglilingkod sa isang pinuno, at pinanatili ang dalawang magkahiwalay na ideya ng Hebreo—pinabagsak sila at namatay sila—nang hindi pinapakinis ang posibleng pag-uulit.
