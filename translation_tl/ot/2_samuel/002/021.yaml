base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: tl
  text: Sinabi sa kanya ni Abner, “Lumihis ka sa kanan mo o sa kaliwa mo, dakpin mo para sa iyong sarili ang isa sa mga binata, at kunin mo para sa iyong sarili ang kagamitan niya.[a]” Ngunit hindi nais ni Asahel na lumihis sa pagsunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang baluti niya.” Malamang na tumutukoy ang salitang Hebreo sa kagamitang hinubad mula sa isang mandirigmang napatay o natalo; hindi lubos na tiyak kung anong bagay ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה
  choice: Lumihis ka
  rationale: Sa konteksto ng pagtugis, ipinahihiwatig ng pandiwa ang paglihis mula sa kasalukuyang direksiyon, hindi lamang ang simpleng pagliko.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: sa kanan mo o sa kaliwa mo
  rationale: Pinananatili nito ang tuwirang pakikipag-usap at ang mga hulaping pangalawang panauhang panlalaki sa Hebreo.
- source_word: וֶאֱחֹז לְךָ
  choice: dakpin mo
  rationale: Ang אחז ay nangangahulugang humawak o dumakip; ang “dakpin” ay natural sa konteksto ng sagupaan, samantalang ang kapakinabangan para sa sarili ay ipinahahayag sa kasunod na sugnay.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: ang isa sa mga binata
  rationale: Ang נְעָרִים ay literal na “mga binata” o “mga kabataang lalaki.” Bagaman maaari itong tumukoy sa mga kawal sa salaysay militar, hindi tinutukoy nang labis ang kanilang ranggo.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: kunin mo para sa iyong sarili ang kagamitan niya
  rationale: Malamang na tumutukoy ang חֲלִצָה sa kagamitang hinubad o kinuha mula sa isang mandirigma. Sapat na malawak ang “kagamitan” upang hindi magbigay ng di-tiyak na detalye gaya ng baluti lamang o pangkalahatang samsam.
- source_word: וְלֹא אָבָה
  choice: ayaw
  rationale: Likas at malinaw sa modernong Tagalog ang “ayaw” para sa kawalan ng pagsang-ayon o pagkukusa na ipinahahayag ng אבה.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: lumihis ... sa pagsunod sa kanya
  rationale: Pinananatili nito ang pandiwang “lumihis” at malinaw na ipinahahayag ang larawan ng patuloy na pagtugis sa likuran ni Abner.
