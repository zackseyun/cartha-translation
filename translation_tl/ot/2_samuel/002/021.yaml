revisions:
- from: Sinabi sa kanya ni Abner, “Lumihis ka sa kanan mo o sa kaliwa mo, dakpin mo ang isa sa mga binata, at kunin mo para sa iyong sarili ang kagamitan niya.[a]” Ngunit ayaw lumihis ni Asahel sa pagsunod sa kanya.
  to: Sinabi sa kanya ni Abner, “Lumihis ka sa kanan mo o sa kaliwa mo, dakpin mo para sa iyong sarili ang isa sa mga binata, at kunin mo para sa iyong sarili ang kagamitan niya.[a]” Ngunit hindi nais ni Asahel na lumihis sa pagsunod sa kanya.
  rationale: Idinagdag ang ‘para sa iyong sarili’ sa unang utos upang maipakita rin ang unang לְךָ, at pinalitan ang ‘ayaw’ ng ‘hindi nais’ para sa mas malinaw na aspektong pasalaysay. Pinanatili ang maingat na ‘kagamitan’ at ang umiiral na talababa dahil hindi tiyak ang eksaktong tinutukoy ng חֲלִצָתוֹ.
