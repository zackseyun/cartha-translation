    rationale: Bagaman katanggap-tanggap ang aspektong ito sa salaysay, mas tuwirang inilalahad ng ‘Hindi nais’ ang nakaraang pagsalungat/pag-aatubili ni Asahel sa kontekstong pasalaysay.
