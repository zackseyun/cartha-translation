  text: וְ/יוֹאָ֗ב שָׁ֚ב מֵ/אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּקְבֹּ֖ץ אֶת כָּל הָ/עָ֑ם וַ/יִּפָּ֨קְד֜וּ מֵ/עַבְדֵ֥י דָוִ֛ד תִּשְׁעָֽה עָשָׂ֥ר אִ֖ישׁ וַ/עֲשָׂה אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: tl
  text: At bumalik si Joab mula sa paghabol kay Abner, at tinipon niya ang buong pangkat. Nang bilangin sila, labinsiyam sa mga tauhan ni David ang nawawala, bukod pa kay Asahel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “labinsiyam na lalaki at si Asahel.” Ipinahihiwatig ng pagkakasabi na si Asahel ay dagdag sa labinsiyam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: bumalik
  rationale: Karaniwang kahulugan ng qal na שוב ang pagbabalik; natural ito sa salaysay.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: mula sa paghabol kay Abner
  rationale: Literal itong 'mula sa likuran ni Abner,' ngunit sa kontekstong militar ay tumutukoy sa paghabol sa kaniya.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: at tinipon niya ang buong pangkat
  rationale: Ang עָם ay literal na 'bayan/mga tao,' ngunit dito ay ang pangkat ng mga mandirigmang kasama ni Joab. Iniiwasan ng 'pangkat' ang maling pahiwatig na buong sambayanan ang tinipon.
- source_word: וַיִּפָּקְדוּ
  choice: Nang bilangin sila
  rationale: Ang nifal ng פקד dito ay pagbilang o pagtipon para sa talaan; ang 'nang bilangin sila' ay malinaw at natural.
- source_word: מֵעַבְדֵי דָוִד
  choice: sa mga tauhan ni David
  rationale: Bagaman literal na 'mga lingkod ni David,' sa kontekstong militar ang tinutukoy ay mga lalaking nasa paglilingkod at hukbo ni David. Mas natural sa modernong Filipino ang 'mga tauhan.'
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: labinsiyam
  rationale: Tuwirang bilang ng mga lalaking nawawala; hindi na kailangang ulitin ang 'lalaki' dahil malinaw na saklaw ito ng 'mga tauhan.'
- source_word: וַעֲשָׂה אֵל
  choice: bukod pa kay Asahel
  rationale: Ang anyong nasa ibinigay na teksto ay kumakatawan sa pangalang Asahel na nahati sa ortograpiya/pagmamarka. Ang Hebreo ay literal na 'labinsiyam na lalaki at si Asahel,' kaya malinaw na karagdagan siya sa labinsiyam.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pangkat' para sa pangkat-militar na tinutukoy ng עָם, at 'mga tauhan' para sa עַבְדֵי sa kontekstong paglilingkod-militar. Inilagay ang talababa sa pahayag tungkol kay Asahel, na siyang direktang pinapaliwanag nito.
