  source_fidelity: 'Tumpak ang salin sa daloy ng Hebreo: bumalik si Joab mula sa paghabol kay Abner, tinipon niya ang kaniyang pangkat, at sa pagbilang ay natuklasang kulang ang labinsiyam na tauhan, dagdag pa si Asahel. Ang “bukod pa kay Asahel” ay wastong nagpapalinaw sa sintaks na nagbibilang kay Asahel bilang karagdagan sa labinsiyam.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “buong pangkat,” “Nang bilangin sila,” at “mga tauhan ni David” ay angkop sa kontekstong militar at sa marangal na register ng salaysay.
  terminology: Ang mga pangalan na Joab, Abner, David, at Asahel ay pare-pareho at wasto. Ang “mga tauhan ni David” ay isang natural na pangkontekstong salin ng mga lingkod/kalalakihan ni David, nang hindi nawawala ang diwang militar. Ang talababa ay tumpak at maayos ang pagkakaangkla sa Asahel.
