  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: tl
  text: Pagkatapos, nagtipon ang mga anak ni Benjamin sa likuran ni Abner[a]. Bumuo sila ng iisang pangkat[b] at pumuwesto sa tuktok ng isang burol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumunod kay Abner.” Ang pariralang Hebreo ay maaaring tumukoy sa posisyong nasa likuran niya o sa pagsunod sa kanyang pamumuno.
    reason: lexical_alternative
  - marker: b
    text: O “iisang pulutong.” Tumutukoy ang salitang Hebreo sa isang nagkakaisang pangkat na sama-samang nagtipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: nagtipon
  rationale: Ang hitpael ng קבץ ay nagsasaad ng sama-samang pagtitipon o muling pagbubuo; natural at malinaw ang “nagtipon” sa salaysay.
- source_word: בְנֵי בִנְיָמִן
  choice: ang mga anak ni Benjamin
  rationale: Pinananatili nito ang literal na pananalitang pangkamag-anakan ng Hebreo, bagaman maaari rin itong tumukoy sa mga Benjaminita.
- source_word: אַחֲרֵי אַבְנֵר
  choice: sa likuran ni Abner
  rationale: Pinananatili ang posibleng kahulugang panlugar ng אַחֲרֵי sa tagpong pandigma, habang nililinaw sa talababa ang posibleng diwang pagsunod sa pamumuno.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: iisang pangkat
  rationale: Ang אֲגֻדָּה ay isang nagkakaisang kalipunan o pangkat; ang “iisang pangkat” ay natural sa modernong Filipino at pinananatili ang diin ng אֶחָת.
- source_word: וַיַּעַמְדוּ
  choice: pumuwesto
  rationale: Sa kontekstong pandigma, ang עמד ay tumutukoy sa pagtindig o paglalagay ng sarili sa isang posisyon, hindi lamang sa literal na pagtayo.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: sa tuktok ng isang burol
  rationale: Ang רֹאשׁ ay literal na “ulo” ngunit nangangahulugang “tuktok” sa topograpikong gamit; malinaw at natural ang salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Pinanatili ang Hebreong katawagang “mga anak ni Benjamin” at ang tunay na kalabuan ng אַחֲרֵי sa pamamagitan ng talababa.
