translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa mabilis na salaysay. Iniwasan ang mga salitang arkaiko at ang sobrang teknikal na terminolohiyang anatomikal. Inilagay ang talababa sa “tiyan,” ang mismong salitang may leksikal na katiyakan.
