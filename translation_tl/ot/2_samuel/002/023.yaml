base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: tl
  text: Ngunit tumanggi siyang lumihis, kaya hinampas siya ni Abner sa tiyan[a] gamit ang hulihang dulo ng sibat. Tumagos ang sibat at lumabas sa likod niya. Bumagsak siya roon at namatay sa mismong lugar na iyon. Ang bawat dumating sa lugar kung saan bumagsak at namatay si Asahel ay huminto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang bahagi ng katawan, ngunit hindi tiyak ang eksaktong bahagi. Sa ilang salin, isinasalin ito bilang “ikalimang tadyang”; maaari rin itong tumukoy nang mas pangkalahatan sa tiyan o puson.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: ayaw niyang lumihis
  rationale: Ipinahahayag ng מָאֵן ang tahasang pagtanggi, at pinananatili ng “lumihis” ang konkretong diwa ng סוּר sa konteksto ng patuloy na paghabol.
- source_word: וַיַּכֵּהוּ
  choice: tinamaan siya ni Abner
  rationale: Malawak ang saklaw ng נכה, “hampasin/tamaan.” Ang “tinamaan” ay likas sa salaysay at hindi nagdaragdag kung eksaktong anong galaw ang ginawa ni Abner.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: gamit ang hulihang dulo ng sibat
  rationale: Tinutukoy ng parirala ang likurang bahagi ng sibat, hindi ang karaniwang matulis na dulo nito. Malinaw at natural sa Filipino ang “hulihang dulo.”
- source_word: אֶל הַחֹמֶשׁ
  choice: sa tiyan
  rationale: Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng חֹמֶשׁ. Ang “tiyan” ay natural at tumutukoy sa malawak na bahagi ng katawan nang hindi pinipilit ang tradisyonal ngunit di-tiyak na “ikalimang tadyang.”
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: Tumagos ang sibat at lumabas sa likod niya
  rationale: Tahasan sa Hebreo na lumabas ang sibat sa likuran niya. Nililinaw ng “tumagos” ang ipinahihiwatig na pagdaan nito sa katawan, habang pinananatili ang larawang inilalarawan ng teksto.
- source_word: וַיִּפָּל שָׁם וַיָּמָת תַּחְתָּו
  choice: Bumagsak siya roon at namatay agad sa mismong lugar na iyon
  rationale: Ang תַּחְתָּו ay idyomatikong nagpapahiwatig na namatay siya kung saan siya bumagsak. Ang “agad sa mismong lugar na iyon” ay natural na naghahatid ng agarang pagkamatay at lokasyon.
- source_word: וַיַּעֲמֹדוּ
  choice: napahinto
  rationale: Sa konteksto, ang עמד ay nangangahulugang huminto ang mga dumarating nang makita ang lugar ng pagkamatay ni Asahel. Ang “napahinto” ay likas at naihahatid ang biglang paghinto.
