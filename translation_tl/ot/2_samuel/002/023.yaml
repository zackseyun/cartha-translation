revisions:
- from: Ngunit ayaw niyang lumihis, kaya tinamaan siya ni Abner sa tiyan[a] gamit ang hulihang dulo ng sibat. Tumagos ang sibat at lumabas sa likod niya. Bumagsak siya roon at namatay agad sa mismong lugar na iyon. Ang bawat dumating sa lugar kung saan bumagsak at namatay si Asahel ay napahinto.
  to: Ngunit tumanggi siyang lumihis, kaya hinampas siya ni Abner sa tiyan[a] gamit ang hulihang dulo ng sibat. Tumagos ang sibat at lumabas sa likod niya. Bumagsak siya roon at namatay sa mismong lugar na iyon. Ang bawat dumating sa lugar kung saan bumagsak at namatay si Asahel ay huminto.
  rationale: Ginawa ang maliliit na pagbabago upang maging mas tuwiran ang aktibong pananakit ni Abner, maiwasan ang hindi kailangang dagdag na temporal na diin sa pagkamatay ni Asahel, at maipahayag nang mas direkta ang paghinto ng mga dumarating. Pinanatili ang kahulugan, ang antas ng kawalang-katiyakan sa anatomikal na termino, at ang talababa nitong nakaangkla sa “tiyan.”
