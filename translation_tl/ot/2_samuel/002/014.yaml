base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: tl
  text: Sinabi ni Abner kay Joab, “Pakiusap, hayaang tumindig ang mga binata at magpaligsahan sa harap natin.” Sinabi ni Joab, “Hayaang tumindig sila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: mga binata
  rationale: Tumutukoy sa mga kabataang lalaking mandirigma; natural sa Filipino at hindi sobrang tiyak kumpara sa “mga kawal.”
- source_word: וִישַׂחֲקוּ
  choice: magpaligsahan
  rationale: Ang ugat na שׂחק ay maaaring mangahulugang maglaro o maglibang, ngunit sa kontekstong ito ay isang harapang paligsahan na hahantong sa marahas na labanan. Pinananatili ng “magpaligsahan” ang paunang di-tahas na pananalita nang hindi ito ginagawang inosenteng laro.
- source_word: יָקוּמוּ נָא
  choice: Hayaang tumayo
  rationale: Ipinahahayag ang jussive na pakiusap o mungkahi; ang נָא ay hindi kailangang isalin bilang tahasang “pakiusap” sa natural na usapang Filipino.
- source_word: לְפָנֵינוּ
  choice: sa harap natin
  rationale: Tuwirang pinananatili ang lokatibong pananaw ng Hebreo.
- source_word: יָקֻמוּ
  choice: Sige, tumayo sila
  rationale: Inihahatid ang maikli at tuwirang pagsang-ayon ni Joab; ang “Sige” ay natural na nagpapakita ng pahintulot na nakapaloob sa tugon.
