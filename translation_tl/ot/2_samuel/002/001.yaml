  to: Pagkatapos nito, sumangguni si David kay Yahweh[a]. Sinabi niya, “Aakyat ba ako sa isa sa mga lungsod ng Juda?” Sinabi sa kanya ni Yahweh, “Umakyat ka.” Nagtanong si David, “Saan ako aakyat?” Sumagot si Yahweh, “Sa Hebron.”
  rationale: Pinalitan ang “ahon” ng “akyat” sa lahat ng katumbas na paglitaw upang mapanatili ang pag-uulit ng Hebreong pandiwa at maipahayag nang natural ang direksiyong paitaas. Ginawang tahasan ang huling tagapagsalita upang luminaw ang diyalogo. Walang binago sa nilalaman o sa talababa.
