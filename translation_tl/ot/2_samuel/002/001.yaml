language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: tl
  text: Pagkatapos nito, sumangguni si David kay Yahweh[a]. Sinabi niya, “Aakyat ba ako sa isa sa mga lungsod ng Juda?” Sinabi sa kanya ni Yahweh, “Umakyat ka.” Nagtanong si David, “Saan ako aakyat?” Sumagot si Yahweh, “Sa Hebron.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; karaniwang isinasalin na “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang nakaugaliang alternatibong salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas at malinaw na panandang temporal sa makabagong Filipino, habang pinananatili ang paglipat ng salaysay na nasa Hebreo.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: sumangguni ... kay Yahweh
  rationale: Sa kontekstong ito, ang שׁאל na may בּ at pangalan ng Diyos ay tumutukoy sa paghingi ng patnubay mula sa Diyos, hindi lamang sa karaniwang pagtatanong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang YHWH sa halip na palitan ito ng titulong “Panginoon.”
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Ipinakikilala nito nang natural sa Filipino ang mismong nilalaman ng pagsangguni ni David.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: Aahon ba ako / Umahon ka
  rationale: Pinananatili ang pag-uulit ng iisang pandiwang Hebreo at ang diwang heograpiko ng pag-ahon patungo sa bulubunduking lupain ng Juda.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: sa isa sa mga lungsod ng Juda
  rationale: Malinaw at likas na pagpapahayag ng pagpunta sa isa sa mga lungsod na sakop ng Juda.
- source_word: אָנָה
  choice: Saan
  rationale: Karaniwang makabagong tanong sa Filipino tungkol sa patutunguhan.
- source_word: חֶבְרֹנָה
  choice: Sa Hebron
  rationale: Ipinahahayag ng “Sa” ang direksiyonal na hulaping ה־ sa pangalan ng lugar.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng isang titulo o pumipili ng alternatibong tradisyonal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumangguni” upang ipakita ang paghingi ng banal na patnubay, at pinanatili ang “ahon” sa tanong at sagot upang maingatan ang mahalagang pag-uulit at direksiyonal na diwa ng orihinal.
