base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/020.yaml
  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: tl
  text: Lumingon si Abner at sinabi, “Ikaw ba si Asahel?” Sumagot siya, “Ako nga.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: Lumingon
  rationale: Karaniwang nangangahulugang ‘bumaling’ o ‘lumingon’ ang פנה. Sa tagpong hinahabol si Abner, likas at malinaw sa Filipino ang ‘lumingon.’
- source_word: אַחֲרָיו
  choice: (nakapaloob sa ‘Lumingon’)
  rationale: Tumutukoy ang parirala sa paglingon sa likuran. Sapat nang ipinahihiwatig ito ng pandiwang ‘lumingon’ sa natural na Filipino; magiging mabigat ang literal na ‘lumingon sa likuran niya.’
- source_word: הֲאַתָּה זֶה
  choice: Ikaw ba
  rationale: Idyoma itong tanong para tiyakin ang pagkakakilanlan. Natural na katumbas sa modernong Filipino ang ‘Ikaw ba si Asahel?’ nang hindi pinipilit ang demonstratibong זֶה sa di-likas na anyo.
- source_word: עֲשָׂהאֵל
  choice: Asahel
  rationale: Isinatinig ang pangalang pantangi ayon sa nakaugaliang anyo sa Filipino.
- source_word: אָנֹכִי
  choice: Ako nga
  rationale: Ang malayang panghalip ay buong sagot na nagpapatunay ng pagkakakilanlan. Ipinahahayag ng ‘Ako nga’ ang maikli ngunit tiyak na tugon nang mas natural kaysa sa payak na ‘Ako.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos ng usapan at iniwasan ang sobrang literal ngunit alanganing ‘bumaling sa likuran niya.’
