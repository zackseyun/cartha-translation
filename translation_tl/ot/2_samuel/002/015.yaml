  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang sunod-sunod na pagkilos na “tumayo” at “tumawid,” ang bilang na labindalawa sa bawat panig, ang kaugnayan kina Benjamin at Isboset, at ang pinagmulan ng kabilang labindalawa bilang mga lingkod ni David. Ang “sa panig ng” ay isang maingat at natural na paglalapat ng malawak na saklaw ng לְ sa kontekstong ito.'
  naturalness: Natural, malinaw, at angkop ang marangal na modernong Filipino. Ang “ayon sa bilang” ay bahagyang pormal ngunit mabuti at nauunawaan sa salaysay na ito. Ang “sa panig ng Benjamin at ni Isboset” ay maayos na nagpapakita ng magkasanib na pagkakaugnay nang hindi pinipilit ang isang mas tiyak na kahulugang wala sa teksto.
  terminology: Ang “Isboset,” “Saul,” “Benjamin,” at “mga lingkod ni David” ay magkakatugma at angkop sa Filipino. Pinananatili ng “mga lingkod” ang literal na halaga ng עֲבָדִים, habang wastong ipinaliliwanag ng talababa ang militar na saklaw nito.
