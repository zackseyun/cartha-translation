  text: וַ/יָּקֻ֖מוּ וַ/יַּעַבְר֣וּ בְ/מִסְפָּ֑ר שְׁנֵ֧ים עָשָׂ֣ר לְ/בִנְיָמִ֗ן וּ/לְ/אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וּ/שְׁנֵ֥ים עָשָׂ֖ר מֵ/עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: tl
  text: 'Kaya tumayo sila at tumawid[a] ayon sa bilang: labindalawa sa panig ng Benjamin[b] at ni Isboset[c] na anak ni Saul, at labindalawa mula sa mga lingkod ni David.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumaan” o “pumunta sa kabila.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkilos patawid o patungo sa itinakdang lugar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa Benjamin.” Ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng pinagmulan o pagkakaugnay; dito, malamang na kinakatawan nila ang Benjamin at si Isboset.
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: “Ish-bosheth.” Sa ibang bahagi ng tradisyon ng Lumang Tipan, lumilitaw ang kaugnay na anyong “Eshbaal.”'
    reason: alternative_reading
  - marker: d
    text: Maaari ring “mula sa mga tauhan ni David.” Sa kontekstong militar, ang “mga lingkod” ay maaaring tumukoy sa mga lalaking naglilingkod sa ilalim niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumayo sila
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng kasunod na kilos sa salaysay. Natural sa Filipino ang “tumayo sila” at maaari itong tumukoy sa pagbangon upang kumilos.
- source_word: וַיַּעַבְרוּ
  choice: tumawid
  rationale: Karaniwang nangangahulugan ang עבר na tumawid o dumaan patungo sa kabilang panig. Ang “tumawid” ay angkop sa tagpong lumalapit ang dalawang pangkat sa lugar ng labanan.
- source_word: בְמִסְפָּר
  choice: ayon sa bilang
  rationale: Pinananatili nito ang diwang ang mga kalahok ay binilang at magkapantay ang dami sa magkabilang panig, nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa Hebreo.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
- source_word: לְבִנְיָמִן
  choice: sa panig ng Benjamin
  rationale: Sa konteksto, ang לְ ay malamang na nagsasaad ng panig o kinakatawan. Mas natural sa Filipino ang “sa panig ng Benjamin” kaysa sa literal ngunit malabong “para sa Benjamin.”
- source_word: וּלְאִישׁ בֹּשֶׁת
  choice: at ni Isboset
  rationale: Ipinagpapatuloy ng לְ ang diwa ng pagkakaugnay sa panig na kinakatawan. “Isboset” ang natural na baybay-Filipino ng Masoretikong pangalang Ish-bosheth.
- source_word: בֶּן שָׁאוּל
  choice: na anak ni Saul
  rationale: Tuwirang pinananatili ang pagtukoy sa ama upang malinaw ang pagkakakilanlan ni Isboset.
- source_word: מֵעַבְדֵי דָוִד
  choice: mula sa mga lingkod ni David
  rationale: Ang עֲבָדִים ay literal na “mga lingkod,” bagaman sa kontekstong maharlika at militar maaari itong tumukoy sa mga tauhan o tagasunod. Pinananatili ng salin ang leksikal na lapit sa Hebreo.
