translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Naroon' para sa payak na presensiya at 'mabilis tumakbo' para sa likas na paglilipat ng Hebreong idyoma. Inilagay ang talababa sa salitang 'parang' sa dulo ng pangungusap upang maiwasang mapagkamalang nauukol ito sa pangalang Joab; malinaw pa rin na ipinapaliwanag nito ang 'gasela.'
