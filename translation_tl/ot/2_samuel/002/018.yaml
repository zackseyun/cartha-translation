  source_fidelity: 'Tumpak ang pangunahing nilalaman: naroon ang tatlong anak ni Zeruya at inihambing ang bilis ni Asahel sa isang gasela sa parang. Gayunman, ang “Mabilis tumakbo si Asahel” ay bahagyang nagpapalit ng Hebreong paglalarawan na “matulin/magaan sa kaniyang mga paa” tungo sa tahasang kilos ng pagtakbo. Mas mabuting panatilihin ang metapora ng mga paa.'
