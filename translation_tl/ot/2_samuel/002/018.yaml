base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: tl
  text: 'Naroon ang tatlong anak ni Zeruya: sina Joab, Abisai, at Asahel. Matulin ang mga paa ni Asahel, gaya ng isa sa mga gasela[a] na nasa parang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “usa.” Ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa isang hayop na kahawig ng usa, bagaman mas tiyak dito ang “gasela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: Naroon
  rationale: Likas at maikli itong paraan sa Tagalog upang ipahayag ang presensiya nila sa tagpo, nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: ang tatlong anak ni Zeruya
  rationale: Tinutukoy ng parirala ang tiyak at kilalang pangkat ng tatlong anak ni Zeruya.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: sina Joab, Abisai, at Asahel
  rationale: Ginamit ang makabagong anyong Filipino ng mga pangalang biblikal at ang pantukoy na 'sina' para sa talaan ng mga tao.
- source_word: קַל בְּרַגְלָיו
  choice: Mabilis tumakbo
  rationale: Idyomatikong ipinahahayag sa Tagalog ang bilis ng kanyang mga paa; mas natural ito kaysa sa literal na 'mabilis sa kanyang mga paa.'
- source_word: כְּאַחַד הַצְּבָיִם
  choice: gaya ng isa sa mga gasela
  rationale: Karaniwang tumutukoy ang צְבִי sa gasela, isang hayop na kilala sa bilis; pinananatili rin ang paghahambing sa 'isa' sa mga ito.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: na nasa parang
  rationale: Ang 'parang' ay natural na Filipino para sa bukas na lupain o kaparangan na tirahan ng mailap na hayop, nang hindi labis na nagpapalawak sa payak na בַּשָּׂדֶה.
