  to: Pagkatapos, nagpadala si David ng mga sugo sa mga lalaki ng Jabes-gilead at sinabi sa kanila, “Pagpalain kayo ni Yahweh[a], sapagkat ipinakita ninyo ang ganitong tapat na kabutihan[b] sa inyong panginoon, si Saul, at inilibing ninyo siya.”
