  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: tl
  text: Pagkatapos, nagpadala si David ng mga sugo sa mga lalaki ng Jabes-gilead at sinabi sa kanila, “Pagpalain kayo ni Yahweh[a], sapagkat ipinakita ninyo ang ganitong tapat na kabutihan[b] sa inyong panginoon, si Saul, at inilibing ninyo siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Pinagpala kayo ni Yahweh.” Maaaring unawain ang pormulang Hebreo bilang pahayag ng pagpapala o bilang basbas.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: hesed; maaari itong tumukoy sa kabutihan, katapatan, o tapat na pag-ibig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Sa kontekstong ito, tumutukoy ito sa mga taong isinugo ni David, hindi sa mga anghel. Likas at malinaw sa salaysay ang “mga sugo.”
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: mga lalaki ng Jabes-gilead
  rationale: Tahasang panlalaking maramihan ang Hebreo, kaya pinanatili ang “mga lalaki” sa halip na gawing pangkalahatang “mga taga.”
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Pinagpala kayo ni Yahweh
  rationale: Pinananatili nito ang deklaratibong anyo ng passive participle na בְּרֻכִים, habang natural na ipinapahayag sa Tagalog na si Yahweh ang pinagmumulan o tagagawa ng pagpapala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: חֶסֶד
  choice: tapat na kabutihan
  rationale: Ipinahihiwatig ng חֶסֶד dito kapwa ang kabutihan at katapatan kay Saul na nahayag sa paglilibing sa kanya.
- source_word: אֲדֹנֵיכֶם
  choice: inyong panginoon
  rationale: Ipinakikita nito ang katayuan ni Saul bilang kanilang pinuno at pinaglilingkuran.
- source_word: עִם שָׁאוּל
  choice: sa inyong panginoong si Saul
  rationale: Bagaman literal na “kasama/kay Saul” ang pang-ukol, natural sa Tagalog ang “ipinakita ... sa” at malinaw na si Saul ang tumanggap ng tapat na kabutihan.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: nang ilibing ninyo siya
  rationale: Iniuugnay ng “nang” ang paglilibing kay Saul sa tiyak na gawa ng tapat na kabutihang pinupuri ni David.
theological_decisions:
- issue: Pagpapakahulugan sa pormulang בְּרֻכִים אַתֶּם לַיהוָה
  choice: Pinagpala kayo ni Yahweh
  alternative: Pagpalain kayo ni Yahweh
  rationale: Ang napiling anyo ay mas tuwirang sumusunod sa passive participle at binabasa bilang pahayag, ngunit maaaring maunawaan ang pormula bilang basbas o panalangin; kaya inilagay ang alternatibo sa talababa.
- issue: Paglalarawan sa חֶסֶד
  choice: tapat na kabutihan
  alternative: kabutihang-loob; katapatan; tapat na pag-ibig
  rationale: Hindi nilimitahan ang salita sa damdamin lamang. Sa konteksto, tumutukoy ito sa konkretong gawa ng kabutihan na nagpapakita ng patuloy na katapatan sa namatay nilang panginoon.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “mga sugo” para sa salaysay ng hari, “panginoon” para sa pampolitika at marangal na ugnayan kay Saul, at “tapat na kabutihan” upang maipahayag ang lawak ng hesed nang hindi nagpapasok ng natatanging denominasyonal na pagbasa.
