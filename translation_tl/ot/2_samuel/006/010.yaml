base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: tl
  text: Hindi nais ni David na dalhin sa kanya ang kaban ni Yahweh sa Lungsod ni David[a]. Sa halip, inilihis niya ito sa bahay ni Obed-edom na Gitita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paakyat sa Lungsod ni David.” Ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng paglapit o pag-akyat patungo sa isang lugar.
    reason: lexical_alternative
  - marker: b
    text: O “na taga-Gat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ayaw
  rationale: Ipinahahayag nito ang kawalan ng pagpayag o kahandaan ni David nang hindi pinalalakas tungo sa tahasang mapanlabang pagtanggi.
- source_word: לְהָסִיר אֵלָיו
  choice: na dalhin sa kanya
  rationale: Bagaman literal na may diwang alisin o ilihis ang הֵסִיר, sa konteksto ay tumutukoy ito sa paglilipat ng kaban patungo kay David; natural sa Tagalog ang 'dalhin sa kanya.'
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Pinananatili ang karaniwang katawagan sa sagradong kaban at tuwirang inilalahad ang pangalang tipan na יהוה bilang Yahweh.
- source_word: עַל עִיר דָוִד
  choice: sa Lungsod ni David
  rationale: Ang עַל ay maaaring magpahiwatig ng patungo o paakyat sa isang lugar. Ang 'sa' ay natural na nagsasaad ng destinasyon sa Tagalog, habang inilalagay sa talababa ang posibleng diwang paakyat.
- source_word: וַיַּטֵּהוּ
  choice: inilihis niya ito
  rationale: Malinaw nitong ipinakikita na ibinaling ni David ang kaban mula sa unang destinasyon tungo sa ibang lugar.
- source_word: בֵּית עֹבֵד אֱדוֹם
  choice: sa bahay ni Obed-edom
  rationale: Sa salaysay ng pansamantalang paglalagak ng kaban, ang pisikal na bahay o tirahan ang pinakamalapit na kahulugan ng בֵּית.
- source_word: הַגִּתִּי
  choice: na Gitita
  rationale: Pinananatili ang anyong gentiliko, ibig sabihin ay taong mula sa Gat, sa paraang maikli at angkop sa biblikal na pangalan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kaban' bilang pamilyar na terminong biblikal, 'ayaw' para sa natural na pagpapahayag ng kawalan ng pagpayag, at 'sa halip' upang malinaw ngunit hindi labis na ipakita ang salungat na kilos sa ikalawang sugnay.
