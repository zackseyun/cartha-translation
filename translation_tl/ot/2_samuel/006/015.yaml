- from: Kaya si David at ang buong sambahayan ng Israel ay nag-aahon sa Kaban ni Yahweh, kasabay ng sigawan ng kagalakan[a] at tunog ng tambuli[b].
  to: Si David at ang buong sambahayan ng Israel ay inaakyat ang Kaban ni Yahweh, na may sigawan[a] at tunog ng sungay[b].
  rationale: Inalis ang di-isinasaad na ugnayang sanhi ng “Kaya,” inayos ang pandiwang Filipino upang malinaw ang Kaban bilang layon ng kilos na pagpapaakyat, at pinalitan ang “tambuli” ng mas tuwiran at di-lokal na “sungay.” Pinanatili ang mga angkla ng talababa at ang pangalang Yahweh.
