base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: tl
  text: Si David at ang buong sambahayan ng Israel ay inaakyat ang Kaban ni Yahweh, na may sigawan[a] at tunog ng sungay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na may sigaw ng kagalakan” o “na may pagbubunyi”; ang salitang Hebreo ay maaaring tumukoy sa masiglang sigaw o pagpupugay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tunog ng trumpeta.” Ang Hebreong shofar ay isang hinihipang sungay, kadalasa’y sungay ng lalaking tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: ay nag-aahon
  rationale: Ang Hiphil participle ay nagpapakita ng nagpapatuloy na kilos sa tagpong pasalaysay. Ang “nag-aahon” ay likas sa Filipino at pinananatili ang ideya ng pagdadala paitaas patungong Jerusalem.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: ang buong sambahayan ng Israel
  rationale: Pinananatili ng “sambahayan” ang kolektibo at pampamilyang larawan ng literal na “bahay ng Israel,” sa halip na patagin ito bilang “buong Israel.”
- source_word: אֲרוֹן יְהוָה
  choice: Kaban ni Yahweh
  rationale: Ang אֲרוֹן ay “kaban,” at ang pangalang tipan na יהוה ay isinaling “Yahweh.” Ginamit ang malaking titik sa “Kaban” bilang karaniwang pagtukoy sa banal na Kaban sa kontekstong biblikal.
- source_word: בִּתְרוּעָה
  choice: kasabay ng sigawan ng kagalakan
  rationale: Maaaring tumukoy ang תְרוּעָה sa malakas at masayang pagsigaw o pagbubunyi. Dahil hiwalay na binanggit ang shofar, binigyang-diin dito ang tinig ng mga tao.
- source_word: בְּקוֹל שׁוֹפָר
  choice: tunog ng tambuli
  rationale: Ang קוֹל ay “tunog,” at ang שׁוֹפָר ay isang instrumentong sungay, madalas na sungay ng lalaking tupa. Ang “tambuli” ay isang likas at dignified na salitang Filipino para sa hinihipang sungay, nang hindi nagmumungkahi ng makabagong metal na trumpeta.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “sambahayan ng Israel” upang maipahayag ang kolektibo at pampamilyang diwa ng Hebreo. Ginamit ang “tambuli” bilang likas na katawagan sa instrumentong sungay; ipinaliwanag sa talababa ang mga alternatibo.
