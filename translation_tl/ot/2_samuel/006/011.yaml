  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: tl
  text: Nanatili ang kaban ni Yahweh sa bahay ni Obed-Edom na taga-Gat[a] nang tatlong buwan. Pinagpala ni Yahweh si Obed-Edom at ang buong sambahayan niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Gitita,” ibig sabihin, isang taong may kaugnayan sa Gat.
    reason: cultural_note
  - marker: b
    text: O “ang buong bahay niya.” Ang salitang Hebreo ay maaaring tumukoy nang malawakan sa kanyang pamilya at iba pang kabilang sa tahanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanatili
  rationale: Ipinahihiwatig ng pandiwang ישׁב dito ang patuloy na pananatili ng kaban sa isang lugar; natural ito sa Tagalog at hindi ipinapakitang literal na ‘umupo’ ang kaban.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Tuwirang isinasalin ang construct chain; ang “kaban” ang karaniwang katawagan sa banal na kaban, at pinananatili ang personal na pangalang Yahweh.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: sa bahay ni Obed-Edom
  rationale: Sa unang gamit, tumutukoy ang בֵּית sa pisikal na bahay na kinalagyan ng kaban.
- source_word: הַגִּתִּי
  choice: na taga-Gat
  rationale: Malinaw at likas sa modernong Tagalog ang pagtukoy sa kaugnayan niya sa Gat; nililinaw sa talababa ang mas literal na anyong Hebreo.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: nang tatlong buwan
  rationale: Natural na Tagalog para sa pariralang nagsasaad ng tagal.
- source_word: וַיְבָרֶךְ
  choice: Pinagpala
  rationale: Ito ang tuwiran at karaniwang salin ng ברך.
- source_word: וְאֶת כָּל בֵּיתוֹ
  choice: at ang buo niyang sambahayan
  rationale: Sa ikalawang gamit, maaaring saklawin ng בַּיִת ang pamilya at buong pamunuang pantahanan, hindi lamang ang gusali.
theological_decisions:
- issue: Pagsasalin sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Saklaw ng pagpapala sa כָּל בֵּיתוֹ
  choice: ang buo niyang sambahayan
  alternative: ang buong bahay niya
  rationale: Pinananatili ng “sambahayan” ang malawak na posibleng saklaw—pamilya at mga kabilang sa tahanan—nang hindi nililimitahan ang pagpapala sa pisikal na gusali.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “taga-Gat” sa pangunahing teksto upang madaling maunawaan, habang inilagay sa talababa ang literal na katawagang Hebreo. Pinanatili ang pangalan na “Yahweh” at ang dalawang magkaibang diwa ng בֵּית ayon sa konteksto.
