base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: tl
  text: Nag-alab ang galit ni Yahweh kay Uza, at doon ay sinaktan siya ng Diyos dahil sa pagkakamali.[a] Namatay siya roon sa tabi ng kaban ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa padalus-dalos niyang ginawa,” “dahil sa kawalang-galang,” o marahil “dahil iniabot niya ang kanyang kamay.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo, at iba-iba ang pagkaunawa rito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Nag-alab ang galit
  rationale: Pinananatili nito ang larawang Hebreo ng galit na nag-aalab, habang natural at marangal sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּעֻזָּה
  choice: kay Uza
  rationale: Sa idyomang חרה אף, tinutukoy ng pang-ukol ang taong pinatutungkulan ng galit; natural itong ipahayag sa Tagalog bilang “kay Uza.”
- source_word: וַיַּכֵּהוּ
  choice: sinaktan siya
  rationale: Tuwirang ipinapahayag ang pagkilos ng נכה nang hindi paunang isinasama ang kamatayan, na tahasang binabanggit sa kasunod na sugnay.
- source_word: שָׁם
  choice: doon / roon
  rationale: Pinananatili ang dalawang paglitaw ng pang-abay upang maipakita ang diin ng salaysay sa lugar ng paghampas at kamatayan.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Pinananatili ang pagbabago ng banal na katawagan mula sa Yahweh tungo sa Diyos gaya ng nasa Hebreo.
- source_word: עַל הַשַּׁל
  choice: dahil sa maling ginawa niya
  rationale: Ang שַׁל ay bihira at mahirap tiyakin. Ipinahihiwatig ng salin na may maling kilos na naging dahilan ng hatol, ngunit hindi nito labis na tinutukoy kung iyon ay kamalian, padalus-dalos na kilos, kawalang-galang, o ang mismong pag-abot ng kamay.
- source_word: וַיָּמָת
  choice: Namatay siya
  rationale: Payak at tuwirang salaysay ito, ayon sa Hebreong pandiwa.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: sa tabi ng kaban ng Diyos
  rationale: Sa kontekstong panlunan, natural na ipinahahayag ng “sa tabi” ang עִם at iniiwasang ipahiwatig ang pagsama o pakikisama.
theological_decisions:
- issue: Ang dahilan ng kamatayan ni Uza sa malabong pariralang עַל הַשַּׁל
  choice: dahil sa maling ginawa niya
  alternative: dahil sa pagkakamali; dahil sa padalus-dalos niyang ginawa; dahil sa kawalang-galang; dahil iniabot niya ang kanyang kamay
  rationale: Hindi tiyak ang kahulugan ng bihirang salitang שַׁל. Nagbibigay ang pangunahing teksto ng sapat na diwa ng pananagutan ngunit hindi nito nilulutas nang tahasan ang tunay na kalabuan; inilalahad sa talababa ang mahahalagang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang pangalang Yahweh, ang pag-uulit ng “doon/roon,” at ang kalabuan ng mahirap na pariralang Hebreo sa pamamagitan ng maingat na pangunahing salin at talababa.
