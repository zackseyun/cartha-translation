base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: tl
  text: At lalo ko pang ibababa ang sarili ko kaysa rito, at magiging mababa ako sa sarili kong paningin; ngunit sa piling ng mga aliping babaeng binanggit mo, pararangalan ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: lalo ko pang ibababa ang sarili ko
  rationale: Ang Niphal ng קלל ay nagpapahiwatig ng pagiging mababa o walang halaga sa pagtingin ng iba. Ang pariralang Filipino ay natural na naghahayag ng kusang pagpapakababa ni David nang hindi ipinapalagay na likas siyang kasuklam-suklam.
- source_word: עוֹד מִזֹּאת
  choice: kaysa rito
  rationale: 'Kasama ng “lalo ko pang,” pinananatili nito ang pagpapatuloy at paghahambing: higit pa sa inilarawan ni Mical sa naunang talata.'
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: at magiging mababa ako sa sarili kong paningin
  rationale: Malapit sa Hebreong idyoma at pinananatili ang diwa ng kababaan o mababang katayuan, sa halip na gawing tahasang moral na birtud ang pagpapakumbaba.
- source_word: הָאֲמָהוֹת
  choice: mga aliping babae
  rationale: Ang אָמָה ay tumutukoy sa babaeng alipin o lingkod na mababa ang katayuan. Mas malinaw na pinananatili ng “aliping babae” ang panlipunang agwat na mahalaga sa konteksto.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: binanggit mo
  rationale: Natural at tuwirang tumutukoy sa mga babaeng sinabi ni Mical sa naunang talata.
- source_word: עִמָּם
  choice: sa piling nila
  rationale: Ipinahahayag ang panlipunang pangkat o kapaligiran kung saan tatanggap si David ng karangalan, habang pinananatili ang diwa ng עם.
- source_word: אִכָּבֵדָה
  choice: pararangalan ako
  rationale: Pinananatili ang pasibong diwa ng Niphal at ang tuwirang pagsalungat ng karangalan sa naunang pagpapakababa.
theological_decisions:
- issue: Terminong panlipunang katayuan para sa אָמָהוֹת
  choice: mga aliping babae
  alternative: mga babaeng lingkod
  rationale: Mahalaga sa pagtatalo nina David at Mical ang mababang katayuan ng mga babaeng tinutukoy. Hindi pinapahina ng saling ito ang katotohanang panlipunan ng pagkaalipin, ngunit hindi rin ito nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kusang pagpapakababa o pagiging hinamak
  choice: lalo ko pang ibababa ang sarili ko
  alternative: lalo pa akong hahamakin
  rationale: Maaaring ipahiwatig ng anyong Hebreo ang pagiging itinuring na hamak, ngunit sa konteksto ay sinasagot ni David ang paratang tungkol sa sarili niyang kilos. Pinananatili ng napiling salin ang kusang dimensiyon nang hindi inaalis ang resulta nitong mababang pagtingin sa kanya.
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa. Ginamit ang “mababa sa sarili kong paningin” upang mapanatili ang Hebreong larawan at ang tensiyon ng karangalan at kahihiyan. Walang talababa dahil ang “mga aliping babae” ay malinaw na sa pangunahing teksto.
