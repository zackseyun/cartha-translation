base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: tl
  text: Sinabi ni David kay Mical, “Sa harap ni Yahweh iyon. Siya ang pumili sa akin sa halip na sa iyong ama at sa buong sambahayan ng iyong ama, upang italaga ako bilang pinuno sa bayan ni Yahweh, sa Israel. At nagdiwang ako sa harap ni Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “At sumayaw ako sa harap ni Yahweh.” Mas malawak kaysa sa pandiwang tiyak na tumutukoy sa pagsasayaw ang pandiwang Hebreo rito; maaari itong mangahulugan ng masigla o mapagdiwang na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas sa modernong Tagalog ang pariralang ito para sa pagkilos sa presensiya ni Yahweh, at pinananatili nito ang pag-uulit at diin ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר בָּחַר בִּי
  choice: Siya ang pumili sa akin
  rationale: Tuwirang ipinahahayag ng בחר ang pagpili kay David; ang hiwalay na pangungusap ay malinaw at natural habang ikinakabit pa rin ang pagpili kay Yahweh.
- source_word: מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: sa halip na sa iyong ama at sa buong sambahayan nito
  rationale: Sa konteksto ng pagpili, ang מן ay nagpapakita ng pagpili kay David sa halip na kay Saul at sa dinastiya nito. Ang “sambahayan” ay nagpapanatili sa pampamilya at dinastikong diwa ng בַּיִת.
- source_word: לְצַוֹּת אֹתִי
  choice: upang italaga akong
  rationale: Bagaman karaniwang nangangahulugang “utusan” ang צוה, dito ay tumutukoy ito sa pagtatalaga o pag-aatas kay David sa isang katungkulan.
- source_word: נָגִיד
  choice: pinuno
  rationale: Malinaw na ipinahahayag ng “pinuno” ang awtoridad sa pamamahala nang hindi ipinapasok ang makabagong diwa ng “prinsipe.”
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: sa bayan ni Yahweh, sa Israel
  rationale: Pinananatili ang dalawang pariralang may עַל at ang paglilinaw na ang bayan ni Yahweh ay ang Israel.
- source_word: וְשִׂחַקְתִּי
  choice: At magdiriwang ako
  rationale: Ang שׂחק ay maaaring tumukoy sa masigla, mapaglaro, o mapagdiwang na pagkilos at hindi kasing-tiyak sa pagsasayaw ng mga pandiwang ginamit kanina sa salaysay. Ang anyong pandiwa sa tugon ni David ay natural na mauunawaan bilang pahayag ng patuloy o hinaharap niyang gagawin.
theological_decisions:
- issue: Paglalarawan sa masiglang pagkilos ni David
  choice: magdiriwang ako
  alternative: sasayaw ako
  rationale: Hindi nilimitahan ang שׂחק sa pagsasayaw, sapagkat mas malawak ang saklaw nito kaysa sa mga pandiwang partikular na naglalarawan sa sayaw sa naunang mga talata. Inilagay sa talababa ang tradisyonal at kontekstuwal na alternatibo.
- issue: Paghahambing sa pagpili kay David at sa sambahayan ni Saul
  choice: sa halip na sa iyong ama at sa buong sambahayan nito
  alternative: higit sa iyong ama at sa buong sambahayan nito
  rationale: Sa konstruksiyong בחר + מן, ang konteksto ay nagpapahiwatig ng pagpili sa isa sa halip na sa iba. Iniiwasan ng saling ito ang di-kinakailangang pahiwatig na simpleng paghahambing lamang ng halaga o dangal ang tinutukoy.
- issue: Aspekto ng וְשִׂחַקְתִּי
  choice: magdiriwang ako
  alternative: nagdiwang ako
  rationale: Sa konteksto ng tugon ni David at ng kasunod niyang pahayag sa talata 22, maaaring ipahayag ng anyo ang pasiya niyang patuloy na magdiwang. Hindi nito itinatanggi na ang unang pangungusap ay tumutukoy sa katatapos na pagdiriwang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang mapanatili ang dinastikong diwa, at “bayan” para sa tipanang katawagan sa Israel. Hinati ang mahabang Hebreong pangungusap upang maging malinaw sa Tagalog nang hindi binabago ang ugnayan ng mga kaisipan.
