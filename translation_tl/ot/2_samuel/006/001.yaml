translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tinipon” para sa ipinahihiwatig na pagtitipon ng mga tao, at ang gitling bago ang bilang upang natural na ilahad ang kabuuang bilang bilang paglilinaw.
