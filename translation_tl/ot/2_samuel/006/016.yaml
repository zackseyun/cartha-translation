base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: tl
  text: Habang dumarating sa Lungsod ni David ang kaban ni Yahweh, dumungaw si Mical, na anak ni Saul, sa bintana at nakita niya si Haring David na palukso-lukso at paikot-ikot[a] sa harapan ni Yahweh; at kinamuhian niya ito sa kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga pandiwang Hebreo ay naglalarawan ng masigla at masayang paglukso at pag-ikot sa harapan ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: Habang pumapasok
  rationale: Ipinapahayag nito ang nagpapatuloy na pangyayaring nagsisilbing panahong tagpuan ng pagkakita ni Mical, nang hindi ginagawang matigas ang Hebreong pormulang pasalaysay.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Pinananatili ang construct phrase at ang personal na pangalan ng Diyos.
- source_word: עִיר דָּוִד
  choice: Lungsod ni David
  rationale: Likas na salin ng nakatatag nang pangalan ng pook.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: dumungaw sa bintana
  rationale: Natural na Filipino para sa pagtanaw palabas mula sa isang bintana, nang hindi ipinapalagay kung gaano kataas ang kinaroroonan.
- source_word: מְפַזֵּז
  choice: palukso-lukso
  rationale: Inilalarawan ang masigla at paulit-ulit na paglukso sa pagdiriwang.
- source_word: וּמְכַרְכֵּר
  choice: paikot-ikot
  rationale: Pinananatili ang larawan ng umiikot na galaw at ang pagkakaiba nito sa naunang paglukso.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: hinamak niya ito sa kanyang puso
  rationale: Tuwirang pinananatili ang panloob na paghamak ni Mical kay David at ang idyomang tumutukoy sa puso.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong transliterasyon sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumungaw” at ang magkatambal na “palukso-lukso at paikot-ikot” upang maging natural ngunit manatiling matingkad ang kilos sa tekstong Hebreo.
