revisions:
- from: Habang pumapasok sa Lungsod ni David ang kaban ni Yahweh, dumungaw sa bintana si Mical na anak ni Saul at nakita niya si Haring David na palukso-lukso at paikot-ikot[a] sa harapan ni Yahweh; at hinamak niya ito sa kanyang puso.
  to: Habang dumarating sa Lungsod ni David ang kaban ni Yahweh, dumungaw si Mical, na anak ni Saul, sa bintana at nakita niya si Haring David na palukso-lukso at paikot-ikot[a] sa harapan ni Yahweh; at kinamuhian niya ito sa kanyang puso.
  rationale: Pinalitan ang “pumapasok” ng “dumarating” upang hindi maging mas tiyak kaysa sa payak na Hebreong pandiwa para sa pagdating. Inayos ang ayos ng “dumungaw” para luminaw ang pagtanaw sa pamamagitan ng bintana. Pinalitan ang “hinamak” ng “kinamuhian” bilang mas natural at mas mataas na rehistrong paglalarawan ng panloob na negatibong tugon, nang hindi nagdaragdag ng kahulugan. Pinanatili ang footnote anchor at nilalaman nito.
