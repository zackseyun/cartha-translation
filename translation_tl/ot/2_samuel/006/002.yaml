  to: Bumangon si David at umalis, kasama ang lahat ng taong kasama niya, mula sa Baale-Juda[a] upang iahon mula roon ang kaban ng Diyos, na tinatawag sa Pangalan—ang pangalan ni Yahweh ng mga Hukbo[c], na nakaluklok sa ibabaw ng mga kerubin.[d]
