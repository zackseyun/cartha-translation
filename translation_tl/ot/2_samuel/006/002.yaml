base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: tl
  text: Bumangon si David at umalis, kasama ang lahat ng taong kasama niya, mula sa Baale-Juda[a] upang iahon mula roon ang kaban ng Diyos, na tinatawag sa Pangalan—ang pangalan ni Yahweh ng mga Hukbo[c], na nakaluklok sa ibabaw ng mga kerubin.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Baala ng Juda.” Di-pangkaraniwan ang anyong Hebreo rito at maaaring tumukoy sa lugar na kaugnay ng Kiriat-jearim.
    reason: alternative_reading
  - marker: c
    text: 'Tradisyonal na salin: “Yahweh ng mga Hukbo” o “PANGINOON ng mga hukbo.” Ang “mga Hukbo” ay maaari ring tumukoy sa mga hukbo sa langit.'
    reason: lexical_alternative
  - marker: d
    text: O “na nananahan sa pagitan ng mga kerubin.” Maaaring tumukoy ang huling panghalip sa kaban; nananatiling hindi ganap na malinaw ang pagkakaugnay nito sa masiksik na Hebreong pormula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Bumangon ... at umalis
  rationale: Pinananatili ang dalawang sunod na pandiwa ng salaysay. Likas sa modernong Tagalog ang “bumangon at umalis” bilang pagsisimula at pagpapatuloy ng kilos.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: kasama ang lahat ng taong kasama niya
  rationale: Pinananatili ang kabuuang saklaw ng pangkat at ang bahagyang pag-uulit ng Hebreo.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: mula sa Baale-Juda
  rationale: Itinuturing itong pangalan ng lugar, gaya ng hinihingi ng kasunod na “mula roon,” habang inilalagay sa talababa ang posibleng ibang anyo ng pangalan.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: upang iahon mula roon
  rationale: Ang Hiphil ng עלה ay “iahon” o “dalhin paitaas”; pinananatili rito ang direksiyon ng kilos patungong Jerusalem.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: “Kaban ng Diyos” ang malinaw at nakaugaliang salin ng tawag sa sagradong kaban sa salaysay.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: na tinatawag sa Pangalan
  rationale: Pinananatili ang siksik at marangal na pormula ng Hebreo nang hindi ito ginagawang simpleng pahayag ng pagmamay-ari.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  choice: sa pangalan ni Yahweh ng mga Hukbo
  rationale: Isinasalin ang banal na pangalang יהוה bilang “Yahweh” at ang צְבָאוֹת sa malinaw na “mga Hukbo,” habang pinananatili ang pag-uulit ng “pangalan” sa Hebreo.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: na nakaluklok sa ibabaw ng mga kerubin
  rationale: Sa konteksto ng kaban, ang יֹשֵׁב ay maaaring maglarawan sa paghahari o pagkaluklok. Ang “sa ibabaw” ay malinaw na naghahatid ng larawang kaugnay ng mga kerubin nang hindi inilalarawan ang Diyos na pisikal na nakakulong doon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng צְבָאוֹת sa banal na titulo
  choice: ng mga Hukbo
  alternative: ng mga hukbo sa langit; ng mga karamihan
  rationale: Ang “mga Hukbo” ay tuwirang makabuluhan sa makabagong mambabasa at hindi nililimitahan nang tahasan kung makalangit o makalupa ang tinutukoy.
- issue: Siksik na pormula ng pagtawag sa Pangalan
  choice: na tinatawag sa Pangalan, sa pangalan ni Yahweh
  alternative: na sa ibabaw nito ay tinatawag ang pangalan ni Yahweh; na nagtataglay ng pangalan ni Yahweh
  rationale: Pinananatili ang pag-uulit at sintaktikong tensiyon ng Hebreo; hindi tahasang ipinapasya kung ang kaban ay “tinatawag sa” Pangalan, nagtataglay nito, o siyang dako kung saan ito tinatawag.
- issue: Paglalarawan kay Yahweh kaugnay ng mga kerubin
  choice: nakaluklok sa ibabaw ng mga kerubin
  alternative: nananahan sa pagitan ng mga kerubin
  rationale: Ipinahihiwatig ng konteksto ng kaban ang maharlikang pagkaluklok, ngunit itinatala sa talababa ang tradisyonal at leksikal na posibleng pagbasa tungkol sa pananahan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “kaban,” “iahon,” at “nakaluklok” bilang malinaw na mga salitang biblikal na nauunawaan pa rin ng karaniwang mambabasa. Pinanatili ang bahagyang pag-uulit at ang hindi pangkaraniwang pormula tungkol sa Pangalan upang hindi pakinisin nang labis ang tunay na kalabuan ng Hebreo.
