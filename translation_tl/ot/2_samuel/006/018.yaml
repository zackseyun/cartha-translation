id: 2SA.6.18
reference: 2 Samuel 6:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: tl
  text: Nang matapos ni David na ihandog ang handog na sinusunog at ang mga handog pangkapayapaan, binasbasan niya ang mga tao sa pangalan ni Yahweh ng mga Hukbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang titulong Hebreo ay YHWH tseva’ot; maaari ring isaling “Yahweh ng mga hukbong sandatahan.”
    reason: Nililinaw ang alternatibong pagsasalin sa צְבָאוֹת nang hindi pinakikitid ang kahulugan nito sa pangunahing teksto.
lexical_decisions:
- source_word: וַיְכַל
  choice: Nang matapos
  rationale: Ipinapakita ng anyong pandiwa ang pagkumpleto sa paghahandog bago ang sumunod na pangunahing kilos ni David.
- source_word: מֵהַעֲלוֹת
  choice: na ihandog
  rationale: Sa konteksto ng paghahain, ang Hiphil infinitive ng עלה pagkatapos ng כלה ay likas na nangangahulugang matapos na maghandog.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang malinaw at karaniwang katawagan sa haing עֹלָה, na lubusang sinusunog; pinanatili rin ang isahan ng Hebreo.
- source_word: וְהַשְּׁלָמִים
  choice: at ang mga handog pangkapayapaan
  rationale: Ang שְׁלָמִים ay tumutukoy sa uri ng mga haing nagpapahayag ng kapayapaan, kagalingan, at pakikipag-ugnayan; ang tradisyonal na terminong Filipino ay maikli at madaling makilala.
- source_word: וַיְבָרֶךְ
  choice: binasbasan niya
  rationale: Tuwirang ipinapahayag ng ברך ang pagbabasbas; natural sa modernong Tagalog ang ayos na ito.
- source_word: אֶת־הָעָם
  choice: ang mga tao
  rationale: Tumutukoy ang עָם sa nagkakatipong sambayanan bilang isang kabuuan.
- source_word: בְּשֵׁם
  choice: sa pangalan ni
  rationale: Ipinahihiwatig ng parirala ang pangalan at awtoridad na tinatawagan sa pagbabasbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: צְבָאוֹת
  choice: ng mga Hukbo
  rationale: Malawak ang saklaw ng צְבָאוֹת at maaaring tumukoy sa mga hukbo, kabilang ang makalangit na hukbo; iniiwasan ng saling ito ang di-kinakailangang pagpapakitid sa mga hukbong panlupa lamang.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Saklaw ng titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga Hukbo
  alternative: Yahweh ng mga hukbong sandatahan
  rationale: Pinananatili ng “mga Hukbo” ang mas malawak na kahulugan ng צְבָאוֹת at hindi ipinapalagay kung panlupa o makalangit na hukbo ang pangunahing tinutukoy.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog para sa mabuting ugnayan
  rationale: Ang napiling katawagan ay pamilyar at tumpak, habang kinikilalang saklaw ng salitang Hebreo ang kapayapaan, kagalingan, at pakikisalo o pakikipag-ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga katawagang madaling makilala sa kontekstong biblikal, ngunit iniwasan ang labis na teknikal o denominasyonal na pananalita.
