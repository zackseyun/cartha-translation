  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: tl
  text: At si Mical, na anak na babae ni Saul, ay hindi nagkaroon ng anak hanggang sa araw ng kanyang kamatayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “supling”; ang salitang Hebreo ay maaaring tumukoy sa anak sa pangkalahatan, hindi lamang sa anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: At si Mical
  rationale: Ang waw at preposisyong lamed ay bumubuo ng Hebreong paraang nagpapakilala sa paksa habang iniuugnay ito sa naunang salaysay. Likas sa Tagalog ang “At si Mical.”
- source_word: בַּת שָׁאוּל
  choice: na anak ni Saul
  rationale: Tuwirang ipinakikilala ng construct phrase si Mical ayon sa kanyang kaugnayan kay Saul. Hindi kailangang tukuyin ang kasarian sa salitang “anak” dahil malinaw na ito sa pangalang Mical at mas natural ito sa Tagalog.
- source_word: לֹא הָיָה לָהּ
  choice: ay hindi nagkaroon ng
  rationale: Ang literal na Hebreong idyoma ay “walang naging para sa kanya.” Ang “hindi nagkaroon ng” ang natural at tumpak na pagpapahayag ng kawalan ng pag-aari o karanasan sa Tagalog.
- source_word: יָלֶד
  choice: anak
  rationale: Ang pangngalan ay maaaring tumukoy sa isang anak sa pangkalahatan at hindi kinakailangang sa lalaking anak. Pinananatili ng “anak” ang saklaw na iyon nang hindi labis na tinutukoy ang kasarian.
- source_word: עַד יוֹם מוֹתָהּ
  choice: hanggang sa araw ng kanyang kamatayan
  rationale: Malapit at malinaw nitong isinasalin ang karaniwang Hebreong temporal na parirala at ipinahahayag ang habambuhay na kawalan niya ng anak.
theological_decisions:
- issue: Pahiwatig ng kawalan ng anak “hanggang sa araw ng kanyang kamatayan”
  choice: Pinanatili nang tuwiran ang temporal na parirala bilang paglalarawan ng habambuhay na kawalan ni Mical ng anak.
  alternative: Maaaring isalin nang mas interpretatibo bilang “habambuhay siyang hindi nagkaanak.”
  rationale: Pinananatili ng tuwirang anyo ang pananalita ng Hebreo nang hindi lumilikha ng walang-katuturang pahiwatig na maaaring magkaanak pagkamatay at nang hindi rin nagdaragdag ng teolohikal na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang tradisyonal na baybay na “Mical,” ang natural na pariralang “anak ni Saul,” at isang malapit ngunit idiomatikong pagsasalin ng Hebreong pangungusap.
