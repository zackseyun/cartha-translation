  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: tl
  text: Dinala nila iyon mula sa bahay ni Abinadab[a] na nasa burol, kasama ang Kaban ng Diyos, at naglalakad si Ahio sa unahan ng Kaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa Gibea.” Maaaring basahin ang Hebreong גִּבְעָה bilang karaniwang pangngalang “burol” o bilang pangalang-pook na “Gibea.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Dinala nila iyon
  rationale: Ang anyong maramihan ng נשׂא na may panlaping tumutukoy sa bagay ay nagsasaad ng pagdadala o paglilipat dito. Natural sa Filipino ang “dinala nila iyon” at hindi nito labis na tinutukoy ang paraan ng transportasyon.
- source_word: מִבֵּית אֲבִינָדָב
  choice: mula sa bahay ni Abinadab
  rationale: 'Tuwirang ipinahahayag ng מִן at ng construct na בֵּית אֲבִינָדָב ang pinagmulan: ang bahay ni Abinadab.'
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: na nasa burol
  rationale: Maaaring karaniwang pangngalan na “burol” o pangalang-pook na “Gibea” ang גִּבְעָה. Pinili sa pangunahing teksto ang karaniwang kahulugan dahil may pantukoy ito, habang pinanatili sa talababa ang tunay na alternatibo.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: kasama ang Kaban ng Diyos
  rationale: Ang עִם ay nagpapahayag ng pagsama. Ang “Kaban ng Diyos” ay malinaw at dignified na salin ng אֲרוֹן הָאֱלֹהִים.
- source_word: וְאַחְיוֹ
  choice: at ... si Ahio
  rationale: Isinalin ang pangalang pantangi bilang “Ahio,” at ginamit ang karaniwang panandang Filipino na “si.”
- source_word: הֹלֵךְ
  choice: naglalakad
  rationale: Ang participle ay naglalarawan ng patuloy na kilos kasabay ng pagdadala sa Kaban; mahusay itong naipapahayag ng “naglalakad.”
- source_word: לִפְנֵי הָאָרוֹן
  choice: sa unahan ng Kaban
  rationale: Ang לִפְנֵי ay spatial na “sa harap” o “sa unahan.” Ang “sa unahan” ay natural sa konteksto ng prusisyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang malaking titik sa “Kaban” bilang pinaikling pagtukoy sa Kaban ng Diyos. Inilagay ang marker na [a] kaagad pagkatapos ng “Abinadab,” na siyang pariralang nililinaw ng talababa.
