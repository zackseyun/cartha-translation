  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: tl
  text: Nang makarating sila sa giikan ni Nacon[a], iniunat ni Uza ang kamay niya patungo sa kaban ng Diyos at hinawakan iyon, sapagkat natisod ang mga baka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa giikan ng Nachon,” o, bagaman mas di-malamang, “sa matatag [o nakatalagang] giikan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nadulas ang mga baka” o “muntik nang maibuwal ng mga baka ang kaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: giikan
  rationale: Ang גֹּרֶן ay lugar na pinaggigiikan ng butil. Ang “giikan” ang maikli at likas na katumbas sa modernong Tagalog.
- source_word: נָכוֹן
  choice: ni Nacon
  rationale: Pinakamalamang na pantanging pangalan ang נָכוֹן sa pariralang ito. Pinanatili sa talababa ang posibilidad na tumutukoy ito sa isang matatag o nakatalagang giikan.
- source_word: וַיִּשְׁלַח
  choice: iniunat ... ang kamay niya patungo sa
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang pag-unat ng kamay tungo sa isang bagay. Ginawang tahasan ang “kamay” sa Tagalog upang maging likas at malinaw ang kilos.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: kaban ng Diyos
  rationale: Pinananatili ang buong katawagan sa Hebreo at ang sagradong pagkakakilanlan ng kaban.
- source_word: וַיֹּאחֶז בּוֹ
  choice: hinawakan iyon
  rationale: Ang אחז ay nangangahulugang humawak o kumapit. Ang “hinawakan iyon” ay malinaw at hindi nagdaragdag ng marahas na diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ng pangatnig ang dahilan ng ginawa ni Uza; ang “sapagkat” ay dignipikado at natural sa salaysay.
- source_word: שָׁמְטוּ
  choice: natisod
  rationale: Maaaring magpahiwatig ang pandiwa ng pagkadulas, pagkatisod, o pagkawala ng kontrol. Ang “natisod” ay maikli at hindi nagpapasya kung ang kaban mismo ay muntik nang mahulog.
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Tumutukoy ito sa mga hayop na humihila sa kariton. Ang “mga baka” ang pinakanatural at madaling maunawaang katawagan sa modernong Tagalog.
theological_decisions:
- issue: Dahilan ng pagkilos ni Uza
  choice: Kumilos si Uza sapagkat natisod ang mga baka.
  alternative: Kumilos siya sapagkat nadulas ang mga baka o muntik nilang maibuwal ang kaban.
  rationale: Ang Hebreo ay nagbibigay lamang ng sugnay na sanhi, na ang mga baka ang simuno ng pandiwang may diwang pagdulas o pagkawala ng kontrol. Hindi idinagdag sa pangunahing teksto na ang kaban ay tiyak na muntik nang mahulog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignipikado. Ginamit ang “giikan,” “kaban ng Diyos,” at “mga baka” bilang mga karaniwang salitang madaling maunawaan. Ang pagbabaybay na “Uza” at “Nacon” ay iniangkop sa payak na bigkas sa Filipino; pinanatili sa talababa ang “Nachon” bilang alternatibo.
