  source_fidelity: 'Tapat ang salin sa Hebreo: napanatili ang pagdating sa giikan ni Nacon, ang pagkilos ni Uza tungo sa kaban ng Diyos, at ang sugnay na sanhi tungkol sa mga hayop. Ang “natisod ang mga baka” ay isang maingat at likas na paglalapat ng שָׁמְטוּ na hindi nagdaragdag na tiyak na nahulog o naibuwal ang kaban.'
