  source_fidelity: Ang “May nagbalita” ay nauunawaan at pinananatiling di-tiyak ang tagapaghatid, ngunit mas tahasang natutumbasan ng impersonal na Hophal na וַיֻּגַּד ang “May ibinalita.” Ang “lahat ng pag-aari niya” ay mas makitid kaysa כָּל אֲשֶׁר לוֹ, na sumasaklaw sa lahat ng nasa kanya. Ang natitirang daloy, kabilang ang sanhi ng pagpapala, pag-ahon ng Kaban, at patutunguhan sa Lungsod ni David, ay tapat sa Hebreo.
  naturalness: Marangal, malinaw, at natural ang Tagalog. Ang “nang may kagalakan” ay bahagyang mas tuwirang inilalapat ang pangwakas na בְּשִׂמְחָה sa pagkilos ni David kaysa sa pang-abay na “masayang.”
  terminology: 'Wasto at pare-pareho ang “Yahweh,” “Kaban ng Diyos,” at “Lungsod ni David.” Ang “sambahayan” sa unang paglitaw at “bahay” sa ikalawa ay katanggap-tanggap sa konteksto: malawak ang una at lokasyonal ang ikalawa.'
