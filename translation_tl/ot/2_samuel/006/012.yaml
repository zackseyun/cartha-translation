revisions:
- from: May nagbalita kay Haring David, “Pinagpala ni Yahweh[a] ang sambahayan ni Obed-edom at ang lahat ng pag-aari niya dahil sa Kaban ng Diyos.” Kaya pumunta si David at masayang iniahon ang Kaban ng Diyos mula sa bahay ni Obed-edom patungo sa Lungsod ni David.
  to: 'May ibinalita kay Haring David: “Pinagpala ni Yahweh[a] ang sambahayan ni Obed-edom at ang lahat ng nasa kanya dahil sa Kaban ng Diyos.” Kaya pumunta si David at iniahon niya nang may kagalakan ang Kaban ng Diyos mula sa bahay ni Obed-edom patungo sa Lungsod ni David.'
  rationale: Pinalitan ang pagpapahayag ng ulat upang higit na mapanatili ang impersonal na tinig ng Hebreo, at pinalawak ang “lahat ng pag-aari niya” tungo sa “lahat ng nasa kanya” upang huwag limitahan ang saklaw ng pinagmulan. Inayos din ang paglalagay ng “nang may kagalakan” upang malinaw na ilarawan ang pag-ahon ng Kaban. Walang idinagdag na pagpapakahulugang doktrinal.
