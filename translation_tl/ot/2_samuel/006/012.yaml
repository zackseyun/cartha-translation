id: 2SA.6.12
reference: 2 Samuel 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: tl
  text: 'May ibinalita kay Haring David: “Pinagpala ni Yahweh[a] ang sambahayan ni Obed-edom at ang lahat ng nasa kanya dahil sa Kaban ng Diyos.” Kaya pumunta si David at iniahon niya nang may kagalakan ang Kaban ng Diyos mula sa bahay ni Obed-edom patungo sa Lungsod ni David.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH. Maaari ring isalin ayon sa tradisyon bilang “ang PANGINOON.”'
    reason: Ipinapakita ang banal na pangalang nasa Hebreo at ang karaniwang alternatibong salin nito.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: May nagbalita
  rationale: Ang Hophal na anyo ay hindi pinapangalanan ang tagapagbalita. Natural sa modernong Tagalog ang eksistensiyal na parirala habang nananatiling hindi tiyak kung sino ang naghatid ng balita.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: kay Haring David
  rationale: Karaniwang ayos sa Tagalog ang titulo bago ang pangalang pantangi.
- source_word: לֵאמֹר
  choice: direktang sinundan ng sipi
  rationale: Hindi kailangang isalin nang hiwalay ang Hebreong pormula ng pagsipi; malinaw at natural na naipapakita ito ng panipi sa Tagalog.
- source_word: בֵּרַךְ יְהוָה
  choice: Pinagpala ni Yahweh
  rationale: Tumpak na ipinahahayag ng aspektong naganap ang naiulat na pagpapala; hindi kailangang ipilit ang aspektong katumbas ng English present perfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ang sambahayan ni Obed-edom
  rationale: Sa unang paglitaw, ang בֵּית ay tumutukoy sa mga tao at ari-ariang saklaw ng tahanan, kaya mas malinaw ang “sambahayan” kaysa literal na gusali lamang.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: at ang lahat ng pag-aari niya
  rationale: Natural na Tagalog para sa lahat ng nasa kanya, kasunod ng mas malawak na “sambahayan.”
- source_word: בַּעֲבוּר
  choice: dahil sa
  rationale: 'Malinaw na pinananatili ang ugnayang sanhi: ang pagpapala ay kaugnay ng presensiya ng Kaban.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang Kaban ng Diyos
  rationale: Karaniwang katawagan sa sagradong kaban; ginamit ang malaking titik bilang tiyak na banal na bagay sa salaysay.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Kaya pumunta si David
  rationale: Ipinakikita ng “Kaya” na ang pagkilos ni David ay tugon sa natanggap na balita.
- source_word: וַיַּעַל
  choice: iniahon
  rationale: Pinananatili ang direksiyong pataas ng עלה patungong Jerusalem at mas tiyak ito kaysa pangkalahatang “dinala.”
- source_word: מִבֵּית עֹבֵד אֱדֹם
  choice: mula sa bahay ni Obed-edom
  rationale: Dito ay pinagmulan o lokasyon ang diin, kaya ang kongkretong “bahay” ang natural na salin.
- source_word: עִיר דָּוִד
  choice: Lungsod ni David
  rationale: Itinuturing itong tiyak na pangalan ng lugar, kaya ginamitan ng malaking titik.
- source_word: בְּשִׂמְחָה
  choice: masayang
  rationale: Natural na pang-abay sa Tagalog na nagpapahayag na ang pagdadala sa Kaban ay isinagawa nang may kagalakan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang pinagmulan ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan, samantalang inilalahad sa talababa ang tradisyonal na pamalit na titulo.
- issue: Sanhi ng pagpapala sa sambahayan ni Obed-edom
  choice: dahil sa Kaban ng Diyos
  alternative: alang-alang sa Kaban ng Diyos
  rationale: Ang בַּעֲבוּר ay may malinaw na gamit na sanhi rito. Hindi pinalalawak ng salin kung paano namagitan ang presensiya ng Kaban o ang eksaktong teolohikal na mekanismo ng pagpapala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa malawak na kahulugan ng unang בֵּית at “bahay” para sa pisikal na pinagmulan sa ikalawang paglitaw. Iniwasan ang makaluma o sobrang literal na “at nangyari na ibinalita.”
