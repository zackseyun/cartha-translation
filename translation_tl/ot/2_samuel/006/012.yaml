  - severity: medium
    issue: Ang “lahat ng pag-aari niya” ay nagpapakipot sa saklaw ng כָּל אֲשֶׁר לוֹ.
    rationale: Ang Hebreo ay “lahat ng nasa kanya/lahat ng mayroon siya,” na hindi lamang mga ari-arian. Ang “lahat ng nasa kanya” ay mas malawak at mas tapat.
