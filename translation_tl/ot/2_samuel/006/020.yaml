  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: tl
  text: Pagkatapos, umuwi si David upang pagpalain ang kaniyang sambahayan.[a] Ngunit lumabas si Mical na anak ni Saul upang salubungin si David at sinabi, “Kay dangal-dangal naman ngayon ang hari ng Israel,[b] na naglantad ng sarili ngayon sa harap ng mga babaeng alipin ng kaniyang mga alipin,[c] gaya ng isang taong walang kuwenta na walang pakundangang naglalantad ng sarili!”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaniyang bahay.” Ang salitang Hebreo ay maaaring tumukoy sa tirahan o sa mga taong kabilang sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Mapanukso ang “Kay dangal-dangal naman” sa kontekstong ito; maaari rin itong isalin na, “Kay dakila nga ngayon ang hari ng Israel!”
    reason: rhetorical_clarification
  - marker: c
    text: Maaari ring “mga babaeng lingkod ng kaniyang mga lingkod.” Ang mga salitang Hebreo ay tumutukoy sa mga babaeng nasa mababang katayuang paglilingkod; ang unang salita ay karaniwang nagpapahiwatig ng pagkaalipin.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “isang hamak” o “isang taong walang dangal.” Inuulit at pinatitindi ng Hebreo ang ideya ng paglalantad; hindi nito tiyak na sinasabi ang lawak ng pagkahubad.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: upang pagpalain
  rationale: Tuwirang ipinapahayag ang layunin ng pagbabalik ni David at pinananatili ang karaniwang kahulugan ng ugat na ברך nang hindi dinaragdagan kung pagbati o pormal na pagbabasbas ang tinutukoy.
- source_word: בֵּיתוֹ
  choice: ang kanyang sambahayan
  rationale: Maaaring tumukoy ang בַּיִת sa bahay o sa mga taong kabilang dito. Dahil sila ang pagpapalain ni David, mas likas sa Filipino ang “sambahayan,” habang pinananatili sa talababa ang literal na “bahay.”
- source_word: מִיכַל בַּת שָׁאוּל
  choice: si Mical na anak ni Saul
  rationale: Pinananatili ang pagbibigay-diin ng salaysay sa pagkakakilanlan ni Mical bilang anak ni Saul.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: Kay dangal nga ngayon
  rationale: Pinananatili ang leksikal na diwa ng karangalan at hinahayaang lumitaw sa konteksto ang panunuya. Ang “nga” ay natural na nagpapatalas sa mapanuyang tono nang hindi pinapalitan ang sinabi ng tahasang kabaligtaran.
- source_word: נִגְלָה
  choice: naglantad ng sarili
  rationale: Sinasalamin nito ang Niphal ng גלה at iniiwasang tiyaking ganap na kahubaran ang tinutukoy; nananatili ang posibleng diwa ng pagkalantad o pagkakabukas ng kasuutan.
- source_word: לְעֵינֵי
  choice: sa harap ng
  rationale: Likas na katumbas sa modernong Filipino ng idyomang “sa paningin ng,” at malinaw na ipinapakita ang pampublikong katangian ng kilos.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: mga aliping babae ng kanyang mga alipin
  rationale: Pinananatili ang mababang katayuang panlipunan at ang ugnayang genitibo ng dalawang termino. Bagaman medyo mabigat ang pag-uulit, tapat nitong inilalarawan ang mapanghamak na punto ni Mical.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: gaya ng lubusang paglalantad ng sarili
  rationale: Ang “lubusang” ang naghahatid ng pagpapalakas na dulot ng magkaugnay na infinitive at pandiwa sa Hebreo, nang hindi tuwirang ipinapasok sa teksto ang interpretasyong “walang kahihiyan.”
- source_word: אַחַד הָרֵקִים
  choice: isa sa mga taong walang kuwenta
  rationale: Ang רֵיקִים ay mapanghamak na tawag sa mga itinuturing na walang halaga o walang dangal. Ang “mga taong walang kuwenta” ay malinaw at kasalukuyang Filipino nang hindi nagiging salitang-kanto.
theological_decisions:
- issue: Katayuang panlipunan sa אַמְהוֹת עֲבָדָיו
  choice: mga aliping babae ng kanyang mga alipin
  alternative: mga babaeng lingkod ng kanyang mga lingkod
  rationale: Hindi ito pangunahing usaping doktrinal, ngunit mahalaga sa paghamak ni Mical ang mababang katayuan ng mga babaeng nakakita kay David. Kaya pinanatili ang diwa ng pagkaalipin sa halip na palambutin bilang pangkalahatang paglilingkod.
- issue: Lawak ng pagkalantad ni David
  choice: naglantad ng sarili
  alternative: naghubad / inilantad ang kahubaran
  rationale: Hindi tiyak sa pandiwang נִגְלָה kung ganap na kahubaran ang ibig sabihin. Pinananatili ng salin ang sinadyang tensiyon at hindi nilulutas nang lampas sa ebidensiya ng teksto.
- issue: Mapanuyang pananalita ni Mical
  choice: pinanatili ang positibong salitang “dangal” sa mapanuyang pahayag
  alternative: “Kay kahiya-hiya”
  rationale: Positibo sa anyo ang Hebreo ngunit mapanukso sa konteksto. Ang pagpapanatili sa mismong anyo, na may paliwanag sa talababa, ay hindi tahasang nagpapalit sa sinabi ni Mical ng interpretatibong kabaligtaran.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Mical” bilang anyong angkop sa ortograpiyang Filipino. Pinanatili ang mapanuyang porma ng pananalita, ang pag-uulit ng “ngayon,” ang mababang katayuan ng mga babaeng binanggit, at ang hindi tiyak na lawak ng pagkalantad ni David.
