revisions:
- from: Pagkatapos, umuwi si David upang pagpalain ang kanyang sambahayan.[a] Ngunit lumabas si Mical na anak ni Saul upang salubungin si David at sinabi, “Kay dangal nga ngayon ang hari ng Israel,[b] na naglantad ng sarili ngayon sa harap ng mga aliping babae ng kanyang mga alipin,[c] gaya ng lubusang paglalantad ng sarili ng isa sa mga taong walang kuwenta!”[d]
  to: Pagkatapos, umuwi si David upang pagpalain ang kaniyang sambahayan.[a] Ngunit lumabas si Mical na anak ni Saul upang salubungin si David at sinabi, “Kay dangal-dangal naman ngayon ang hari ng Israel,[b] na naglantad ng sarili ngayon sa harap ng mga babaeng alipin ng kaniyang mga alipin,[c] gaya ng isang taong walang kuwenta na walang pakundangang naglalantad ng sarili!”[d]
  rationale: Inayos ang dalawang pahayag na hindi ganap na likas o malinaw sa Filipino. Pinanatili ng “Kay dangal-dangal naman” ang positibong anyo at mapanuyang puwersa ng Hebreo. Pinalitan ang nominal na huling paghahambing ng malinaw na pandiwang sugnay upang ang mababang-taong ininsulto ang malinaw na aktor ng paglalantad. Ang “walang pakundangan” ay naghahatid ng kontekstuwal na diin ng inuulit na Hebreong anyo nang hindi nangangahulugang ganap na kahubaran.
