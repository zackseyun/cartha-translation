    rationale: Hindi malinaw agad na ang taong walang kuwenta ang gumagawa ng paglalantad. Bukod dito, ang “lubusang” ay maaaring magpahiwatig ng ganap na kahubaran, na hindi hinihingi ng Hebreo. Ang isang malinaw na pandiwang sugnay ay mas tapat sa aktor at sa idiomatikong diin ng Hebreo.
