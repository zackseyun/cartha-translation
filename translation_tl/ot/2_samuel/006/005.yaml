  naturalness: Natural ang karamihan ng bokabularyo at ang marangal na rehistro. Ang binagong ayos ay nag-aalis ng sintaktikong kalabuan. Ang “mga instrumentong pangkalansing” ay mas malinaw na pangalan ng instrumento kaysa sa payak na “kalansing,” na karaniwang tumutukoy rin sa tunog.
