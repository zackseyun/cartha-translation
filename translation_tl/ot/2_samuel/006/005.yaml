base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: tl
  text: At si David at ang buong sambahayan ng Israel ay nagdiriwang[b] sa harap ni Yahweh sa pamamagitan ng lahat ng uri ng instrumentong yari sa kahoy na sipres[a], at ng mga lira, alpa, tamburin, mga instrumentong pangkalansing[c], at pompiyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa lahat ng kahoy ng mga sipres.” Malamang na tumutukoy ito sa sari-saring instrumentong yari sa gayong kahoy. Hindi rin tiyak ang eksaktong uri ng punong tinutukoy; maaari itong isaling “abeto” o “enebro.”
    reason: lexical_alternative
  - marker: b
    text: O “naglalaro” o “nagsasaya.” Ang pandiwang Hebreo ay maaaring tumukoy sa masaya at masiglang pagdiriwang.
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak ang eksaktong instrumentong tinutukoy; maaaring mga sistrum o ibang instrumentong pinatutunog sa pamamagitan ng pag-alog.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: nagdiriwang
  rationale: Sa piel, maaaring tumukoy ang pandiwa sa masaya at masiglang pagdiriwang. Ang “nagdiriwang” ay natural sa Filipino at hindi ito nililimitahan sa simpleng paglalaro; ipinakikita ng kasunod na mga instrumento ang uri ng pagdiriwang.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang Hebreong idyoma para sa pagkilos sa presensiya ni Yahweh at tahasang isinasalin ang banal na pangalan.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: ang buong sambahayan ng Israel
  rationale: Pinananatili ang kolektibong larawang “sambahayan ng Israel” sa halip na paikliin bilang “buong Israel.”
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: na tumutugtog ng sari-saring instrumentong yari sa kahoy na sipres
  rationale: Mahirap at eliptikal ang Hebreo, na literal na “sa lahat ng kahoy ng mga sipres.” Ginagawang malinaw ng salin ang malamang na tinutukoy na mga instrumentong kahoy, habang ipinababatid sa talababa ang literal at di-tiyak na anyo.
- source_word: כִנֹּרוֹת
  choice: mga lira
  rationale: Mas tiyak na tumutukoy ang כִּנּוֹר sa instrumentong kauri ng lyre kaysa sa pangkalahatang alpa.
- source_word: נְבָלִים
  choice: alpa
  rationale: Isang instrumentong de-kuwerdas na naiiba sa כִּנּוֹר; “alpa” ang madaling maunawaang kumbensiyonal na katumbas, bagaman hindi tiyak ang eksaktong anyo.
- source_word: תֻפִּים
  choice: tamburin
  rationale: Tumutukoy sa frame drum o tambourine na ginagamit sa masayang pagtitipon; “tamburin” ang malinaw at kasalukuyang tawag sa Filipino.
- source_word: מְנַעַנְעִים
  choice: kalansing
  rationale: Malamang na instrumentong inaalog upang lumikha ng tunog. Nauunawaan ang “kalansing” nang hindi nagpapanggap na tiyak ang eksaktong sinaunang instrumento.
- source_word: צֶלְצֶלִים
  choice: pompiyang
  rationale: Karaniwang katawagan sa Filipino para sa magkatambal na metal na pinagtatama, na angkop sa Hebreong instrumentong cymbals.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa talata. Pinananatili ng “Yahweh” ang hayag na tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan ng Israel” upang mapanatili ang kolektibong Hebreong larawan. Ang “na tumutugtog” ay nag-uugnay sa mahirap na pariralang tungkol sa kahoy at sa listahan ng mga instrumento nang hindi itinatago ang kawalang-katiyakan, na nakatala sa talababa.
