  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: tl
  text: Sumasayaw[a] si David nang buong lakas sa harap ni Yahweh, at suot ni David ang isang efod[b] na yari sa lino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “umiikot” o “lumulukso-lukso”; inilalarawan ng Hebreo ang masiglang kilos sa pagdiriwang.
    reason: lexical_alternative
  - marker: b
    text: Ang efod ay isang natatanging kasuotang panrelihiyon sa sinaunang Israel; ang suot ni David dito ay yari sa lino.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: sumasayaw
  rationale: Ang participle ay naglalarawan ng masigla at tuloy-tuloy na galaw ng katawan bilang pagdiriwang. Natural sa modernong Tagalog ang “sumasayaw,” samantalang ang mas tiyak na “umiikot” ay maaaring lumabis sa malinaw na ipinahihiwatig ng salita.
- source_word: בְּכָל עֹז
  choice: buong lakas
  rationale: Ipinahahayag ng parirala ang lubos na pag-uukol ng lakas o matinding pagsisikap; malinaw at likas sa Tagalog ang “buong lakas.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ng “sa harap” ang kahulugang bago o nasa presensiya ng isang persona, at ang pang-ukol na “ni” ay angkop sa personal na pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
- source_word: חָגוּר
  choice: nakasuot
  rationale: Ipinakikita ng anyong ito na suot o nakabigkis kay David ang kasuutan; ang “nakasuot” ang pinakanatural at malinaw sa kasalukuyang Tagalog.
- source_word: אֵפוֹד
  choice: efod
  rationale: Isang natatanging kasuotang panrelihiyon ng sinaunang Israel ang efod at wala itong eksaktong katumbas sa Tagalog, kaya pinanatili ang teknikal na katawagan.
- source_word: בָּד
  choice: linong
  rationale: Tumutukoy ang salita rito sa materyal na lino; hindi idinagdag ang “pino” sapagkat hindi tiyak na ipinahahayag ng salitang Hebreo ang kalidad nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Inuna ang likas na ayos na “Buong lakas na sumasayaw” upang malinaw ang tindi ng kilos. Ginamit ang “linong efod” bilang maikli at natural na paglalarawan sa materyal ng teknikal na kasuutan.
