  text: וַ/יַּרְכִּ֜בוּ אֶת אֲר֤וֹן הָֽ/אֱלֹהִים֙ אֶל עֲגָלָ֣ה חֲדָשָׁ֔ה וַ/יִּשָּׂאֻ֔/הוּ מִ/בֵּ֥ית אֲבִינָדָ֖ב אֲשֶׁ֣ר בַּ/גִּבְעָ֑ה וְ/עֻזָּ֣א וְ/אַחְי֗וֹ בְּנֵי֙ אֲבִ֣ינָדָ֔ב נֹהֲגִ֖ים אֶת הָ/עֲגָלָ֥ה חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: tl
  text: Inilagay nila ang kaban ng Diyos sa isang bagong kariton at dinala nila ito mula sa bahay ni Abinadab, na nasa burol[a]. Sina Uza at Ahio, na mga anak ni Abinadab, ang nagpapatakbo sa bagong kariton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa Gibeah,” kung ituturing ang parirala bilang pangalan ng lugar sa halip na paglalarawan ng kinaroroonan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: Inilagay nila ... sa
  rationale: Ang causative na anyo ng רכב ay tumutukoy sa pagpapalulan o paglalagay sa ibabaw; natural sa Tagalog ang “inilagay ... sa” para sa kaban at kariton.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Ang “kaban” ang nakaugaliang katawagan sa sagradong ark at malinaw na nagpapanatili sa tinutukoy ng Hebreo.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: sa isang bagong kariton
  rationale: Ipinahahayag nito ang paglalagay ng kaban sa sasakyan sa natural na modernong Tagalog.
- source_word: וַיִּשָּׂאֻהוּ
  choice: inilabas iyon
  rationale: Maaaring mangahulugang buhatin, dalhin, o alisin ng נשא. Sa kontekstong nakalulan ang kaban sa kariton, ipinahahayag ng “inilabas iyon” ang pagdadala mula sa bahay nang hindi nagpapahiwatig na binuhat lamang ito ng kamay.
- source_word: מִבֵּית אֲבִינָדָב
  choice: mula sa bahay ni Abinadab
  rationale: Natural at tuwirang katumbas sa Tagalog ng pariralang construct sa Hebreo.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: na nasa burol
  rationale: Pinananatili sa pangunahing teksto ang karaniwang topograpikong pagbasa; inilalagay sa talababa ang posibleng pagbasa bilang pangalan ng lugar.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: Sina Uza at Ahio
  rationale: Ginamit ang natural na pantukoy sa mga pangalang pantangi at malinaw na transliterasyon sa Filipino.
- source_word: בְּנֵי אֲבִינָדָב
  choice: mga anak ni Abinadab
  rationale: Sa salaysay na ito, pinakanatural na tumutukoy ang בְּנֵי sa literal na mga anak na lalaki; hindi kailangang palawakin bilang mga inapo.
- source_word: נֹהֲגִים
  choice: ang nagpapatakbo
  rationale: Ang participle ng נהג ay tumutukoy sa pagmamaneho o paggabay; “nagpapatakbo” ang natural na paglalarawan sa pagkontrol sa kariton.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: sa bagong kariton
  rationale: Pinananatili ang pag-uulit sa Hebreo para sa diin at pagkakapare-pareho ng katawagan.
