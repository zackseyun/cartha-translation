  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang natural na ayos ng pangungusap, habang pinananatili ang pag-uulit ng “bagong kariton” at ang tunay na kalabuan kung burol o Gibeah ang tinutukoy.
