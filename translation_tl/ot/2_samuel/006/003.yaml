  naturalness: Natural ang pangkalahatang Tagalog. Mas malinaw at mas idiomatiko ang “dinala nila ito” kaysa “inilabas iyon.” Inilagay ang tanda ng talababa agad pagkatapos ng “burol” upang malinaw ang inaangkla nitong parirala.
  terminology: Ang “kaban ng Diyos,” “bagong kariton,” at mga pangalang Uza, Ahio, at Abinadab ay angkop at pare-pareho. Ang “nagpapatakbo sa bagong kariton” ay katanggap-tanggap para sa paggabay o pagpapaandar ng kariton.
