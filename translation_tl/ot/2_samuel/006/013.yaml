  naturalness: Ang “makaanim na hakbang” ay nauunawaan ngunit hindi gaanong likas sa karaniwang modernong Filipino sa pangungusap na ito. Ang “makalakad nang anim na hakbang” ay mas malinaw at natural. Ang “naghain siya” ay likas sa marangal na rehistrong biblikal.
  terminology: Ang “kaban ni Yahweh” ay angkop at pare-pareho sa pagpapanatili ng banal na pangalan. Pinananatili ang “pinatabang guya” bilang tradisyonal at madaling unawaing pagbasa, habang wastong nililinaw ng talababa na mas malawak ang Hebreong מְרִיא.
