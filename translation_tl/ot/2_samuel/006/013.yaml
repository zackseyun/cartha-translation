base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: tl
  text: Nang makalakad nang anim na hakbang[a] ang mga nagdadala ng kaban ni Yahweh, naghain siya ng isang baka at isang pinatabang guya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anim na yabag.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pinatabang hayop”; tradisyonal itong inuunawa rito bilang pinatabang guya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nang
  rationale: Ang parirala ay nagpapakilala ng pangyayaring naganap nang maabot ang isang tiyak na sandali; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Nang.”
- source_word: נֹשְׂאֵי אֲרוֹן יְהוָה
  choice: ang mga nagdadala ng kaban ni Yahweh
  rationale: Pinananatili ng “mga nagdadala” ang patuloy na kilos ng participle, ginagamit ang nakagawiang “kaban” para sa banal na ark, at tuwirang isinasalin ang pangalang יהוה bilang “Yahweh.”
- source_word: שִׁשָּׁה צְעָדִים
  choice: makaanim na hakbang
  rationale: Tuwirang ipinapahayag ang bilang ng mga hakbang, habang ang anyong “makaanim” ay likas sa makabagong Tagalog para sa pag-abot sa anim na hakbang.
- source_word: וַיִּזְבַּח
  choice: naghandog siya
  rationale: Ipinahihiwatig ng pandiwa ang paghahandog bilang sakripisyo. Ang panghalip na “siya” ay sumusunod sa isahang pandiwa at tumutukoy kay David ayon sa konteksto.
- source_word: שׁוֹר
  choice: isang baka
  rationale: Ang salita ay maaaring tumukoy nang malawakan sa isang hayop na bovine; iniiwasan ng “baka” ang labis na pagtukoy kung toro, kapong baka, o ibang espesipikong uri.
- source_word: מְרִיא
  choice: isang pinatabang guya
  rationale: Ang termino ay tumutukoy sa isang pinatabang hayop. Ang “pinatabang guya” ay malinaw at natural sa kontekstong ito, ngunit itinatala sa talababa na mas malawak ang salitang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng isang titulo.
- issue: Hindi tahasang pinangalanang simuno ng וַיִּזְבַּח
  choice: siya, na tumutukoy kay David ayon sa konteksto
  alternative: naghandog sila
  rationale: Isahan ang pandiwang Hebreo, kaya pinananatili ang isahang simuno. Hindi idinaragdag ang pangalan ni David sa pangunahing teksto upang hindi gawing tahas ang nananatiling pahiwatig lamang sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” bilang pamilyar na katawagan sa banal na ark at “naghandog” bilang natural na pananalita para sa paghahandog ng hain. Ang mga talababa ay inilagay kaagad pagkatapos ng mga salitang tinutukoy ng mga ito.
