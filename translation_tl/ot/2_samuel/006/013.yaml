- from: Nang makaanim na hakbang[a] ang mga nagdadala ng kaban ni Yahweh, naghandog siya ng isang baka at isang pinatabang guya.[b]
  to: Nang makalakad nang anim na hakbang[a] ang mga nagdadala ng kaban ni Yahweh, naghain siya ng isang baka at isang pinatabang guya.[b]
  rationale: Pinalitan ang “makaanim na hakbang” ng mas likas na “makalakad nang anim na hakbang,” at ang “naghandog” ng “naghain” upang maipahayag ang sakripisyong kahulugan ng pandiwang Hebreo. Inayos din ang talababa sa a sa natural na leksikal na alternatibo. Hindi binago ang “baka,” sapagkat maaari nitong katawanin ang pangkalahatang bovine sense ng שׁוֹר nang hindi labis na nagtatalaga ng kasarian o gamit ng hayop.
