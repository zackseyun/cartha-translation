  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: tl
  text: Dinala nila ang kaban ni Yahweh at inilagay ito sa lugar nito, sa loob ng toldang itinayo ni David para rito. At naghandog si David sa harap ni Yahweh ng mga handog na sinusunog at mga handog na pangkapayapaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שְׁלָמִים ay maaari ding isaling “mga handog para sa mabuting ugnayan” o “mga handog para sa kagalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: kaban ni Yahweh
  rationale: Ang אֲרוֹן ay isang kaban o sagradong lalagyan; sa kontekstong ito, ang likas at nakaugaliang salin ay “kaban.” Pinananatili ang personal na pangalang Yahweh.
- source_word: וַיָּבִאוּ
  choice: Dinala nila sa loob
  rationale: Ang Hifil ng בוא ay nagpapahiwatig na ipinasok nila ang kaban sa inihandang lugar; malinaw itong naipapahayag ng “dinala ... sa loob.”
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: at inilagay iyon sa kinalalagyan nito
  rationale: Ang יצג ay tumutukoy sa sadyang paglalagay sa itinakdang posisyon. Ang “kinalalagyan nito” ay natural sa Filipino at pinananatili ang diwa ng בִּמְקוֹמוֹ.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: sa loob ng tolda
  rationale: Tuwirang ipinapahayag ng בְּתוֹךְ ang lokasyon sa loob.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: na itinayo ni David para rito
  rationale: Kapag tolda ang tinutukoy, ang נטה ay nangangahulugang maglatag o magtayo nito. Ang “para rito” ay tumutukoy sa kaban.
- source_word: וַיַּעַל דָּוִד
  choice: naghandog si David
  rationale: Sa konteksto ng paghahain, ang עלה ay nangangahulugang mag-alay o maghandog, hindi lamang “umakyat.”
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Ito ang malinaw at karaniwang paglalarawan sa עֹלָה, isang handog na sinusunog sa altar.
- source_word: שְׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili nito ang kaugnayan ng salitang Hebreo sa kapayapaan at kabuuang kagalingan, habang inilalahad sa talababa ang iba pang lehitimong pagbasa.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat itong tumutugma sa literal na diwang “sa harap” o “sa presensiya” ni Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang transliterasyong “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa mabuting ugnayan; mga handog para sa kagalingan
  rationale: Maaaring tukuyin ng termino ang kapayapaan, mabuting ugnayan, pakikisalo, o ganap na kagalingan. Gumagamit ang teksto ng madaling makilalang salin ngunit hindi isinasara ang tunay na lawak ng kahulugan; inilalahad ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” bilang karaniwang salitang nauunawaan ng modernong mambabasa, at pinanatili ang maikli at sunod-sunod na kilos ng salaysay. Inilagay ang talababa sa mismong terminong שְׁלָמִים na tinutukoy nito.
