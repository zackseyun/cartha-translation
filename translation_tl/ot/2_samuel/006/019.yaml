  source_fidelity: Tumpak ang pangunahing diwa at napapanatili ang pagbibigay-diin ng dobleng pariralang tumutukoy sa buong bayan ng Israel. Gayunman, mas malinaw na dapat ipakita na ang bawat tatlong pagkain ay tig-iisa para sa bawat tao, gaya ng ipinahihiwatig ng distributibong לְאִישׁ at ng mga bilang na 'isa' sa Hebreo.
  naturalness: Ang 'Namahagi siya ... ng' ay maiintindihan ngunit mas natural at malinaw ang 'Ibinahagi niya ... ang.' Ang 'kakaning pasas' ay maaaring magpahiwatig ng partikular na Pilipinong uri ng kakanin at hindi neutral para sa sinaunang pinisáng keyk.
  terminology: Ang 'bahagi ng karne' ay angkop bilang pangunahing salin ng bihira at pinagtatalunang אֶשְׁפָּר, basta may talababa. Mas neutral ang 'keyk ng pasas' para sa אֲשִׁישָׁה kaysa 'kakaning pasas.'
  issues:
