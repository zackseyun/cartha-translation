revisions:
- from: Namahagi siya sa buong bayan, sa buong karamihan ng Israel—sa mga lalaki at mga babae—ng tig-iisang tinapay, isang bahagi ng karne[a], at isang kakaning pasas. Pagkatapos, umuwi ang buong bayan, bawat isa sa kani-kanilang tahanan.
  to: Ibinahagi niya sa buong bayan, sa buong karamihan ng Israel—sa mga lalaki at mga babae—ang tig-iisang tinapay, tig-iisang bahagi ng karne[a], at tig-iisang keyk ng pasas. Pagkatapos, umuwi ang buong bayan, bawat isa sa kani-kanilang tahanan.
