    issue: Hindi malinaw na tig-iisa ang bahagi ng karne at keyk ng pasas para sa bawat tao.
    rationale: Ang 'tig-iisang' sa kasalukuyang ayos ay tuwirang nakakabit lamang sa 'tinapay.' Sa Hebreo, ang bawat tao ay tumatanggap ng isang tinapay, isang אֶשְׁפָּר, at isang אֲשִׁישָׁה.
  - severity: low
    issue: Ang 'kakaning pasas' ay may di-kailangang lokal at posibleng masyadong espesipikong konotasyon.
    rationale: Ang אֲשִׁישָׁה ay isang pinisâ o pressed cake, na karaniwang inuunawang gawa sa pasas; hindi ito kinakailangang katumbas ng Filipino na 'kakanin.'
