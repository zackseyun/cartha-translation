base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: tl
  text: Ibinahagi niya sa buong bayan, sa buong karamihan ng Israel—sa mga lalaki at mga babae—ang tig-iisang tinapay, tig-iisang bahagi ng karne[a], at tig-iisang keyk ng pasas. Pagkatapos, umuwi ang buong bayan, bawat isa sa kani-kanilang tahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang takal/bahagi.” Bihira ang salitang Hebreo na אֶשְׁפָּר at hindi tiyak ang eksaktong kahulugan nito. Marami ang nakauunawa rito bilang isang bahagi ng karne, lalo na dahil sa katumbas na salaysay sa 1 Cronica 16:3.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Namahagi siya
  rationale: Ang piel ng חלק ay tumutukoy rito sa pamamahagi ng mga takdang bahagi sa maraming tao. Natural at tuwiran sa modernong Tagalog ang “namahagi.”
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: sa buong bayan, sa buong karamihan ng Israel
  rationale: Pinananatili ang dalawang magkaugnay at mapagdiing parirala ng Hebreo sa halip na pagsamahin ang mga ito.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: sa mga lalaki at mga babae
  rationale: Ipinahahayag nito sa natural na Tagalog ang idyomang Hebreo na saklaw ang kapuwa lalaki at babae, nang hindi gumagamit ng artipisyal na literalismong “mula lalaki hanggang babae.”
- source_word: לְאִישׁ
  choice: ng tig-iisang
  rationale: Ipinakikita ng “tig-iisang” ang distributibong diwa—isang bahagi para sa bawat tao—at hindi nito nililimitahan sa mga lalaki ang tumanggap.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: tig-iisang tinapay
  rationale: Ang חַלָּה ay isang tinapay o tinapay na bilog/hugis-keyk. Sapat na malinaw at hindi labis na espesipiko ang “tinapay.”
- source_word: אֶשְׁפָּר אֶחָד
  choice: isang bahagi ng karne
  rationale: Bihira at pinagtatalunan ang אֶשְׁפָּר. Malamang na tumutukoy ito sa isang bahagi ng pagkain, marahil karne, gaya ng ipinahihiwatig ng katumbas na salaysay sa 1 Cronica 16:3; nilalagyan ito ng talababa upang mapanatili ang leksikal na kawalang-katiyakan.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: isang kakaning pasas
  rationale: Karaniwang nauunawaan ang אֲשִׁישָׁה bilang pinikpik o pinisang keyk, madalas na gawa sa pasas. Ang “kakaning pasas” ay madaling maunawaan bilang pagkaing matamis na binuo mula sa pasas.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Pagkatapos, umuwi ang buong bayan, bawat isa sa kani-kanilang tahanan
  rationale: Natural na inilalarawan ng “umuwi” ang pag-alis ng mga tao patungo sa kanilang mga tahanan. Pinananatili ng “bawat isa” ang distributibong singular, samantalang inklusibo sa kasarian ang “kani-kanilang.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit na nagbibigay-diin sa saklaw ng pamamahagi, ngunit isinalin nang idyomatiko ang “mula lalaki hanggang babae.” Ginamit ang “kani-kanilang” upang maging natural at inklusibo sa kasarian.
