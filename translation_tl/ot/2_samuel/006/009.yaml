base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: tl
  text: Noong araw na iyon, natakot si David kay Yahweh at sinabi niya, “Paano darating sa akin ang kaban ni Yahweh?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maaari ring isalin: “Paano darating sa akin ang kaban ni Yahweh?” Maaaring ipinahahayag ng tanong ang praktikal na pag-aalinlangan o ang takot at pakiramdam ng pagiging di-karapat-dapat matapos mamatay si Uza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: natakot
  rationale: Sa Qal ng ירא at sa agarang konteksto ng pagkamatay ni Uza, malinaw ang matinding takot ni David. Pinananatili ng “natakot” ang emosyonal na puwersa at ang tuwirang kaugnayan nito kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Natural at malinaw na modernong Tagalog para sa tiyak na panahong tinutukoy ng parirala.
- source_word: אֵיךְ יָבֹא
  choice: Paano makakarating
  rationale: Ipinahahayag nito ang nababagabag na tanong ni David kung paano o sa anong paraan makararating sa kaniya ang kaban, nang hindi ginagawang tahasang pasibo ang pandiwa.
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang katumbas ng pariralang Hebreo; iniiwasang magdagdag ng “sa bahay ko” o “sa lugar ko,” na wala sa teksto.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Natural na Tagalog na construct phrase para sa sagradong kaban na kaugnay ni Yahweh.
theological_decisions:
- issue: Paglalarawan sa tugon ni David kay Yahweh
  choice: natakot si David kay Yahweh
  alternative: nagkaroon ng pagpipitagan si David kay Yahweh
  rationale: Bagaman maaaring saklawin ng ירא ang pagpipitagan, ang pagkamatay ni Uza sa naunang talata ay nagbibigay rito ng malinaw na diwa ng takot; hindi dapat pahinain iyon bilang pagpipitagan lamang.
- issue: Kahulugan ng tanong ni David
  choice: Pinanatiling bukas kung ito ay praktikal na pag-aalinlangan o takot/pakiramdam ng pagiging di-karapat-dapat
  alternative: Ipaliwanag ito bilang simpleng usapin lamang ng transportasyon o bilang tahasang pahayag ng pagiging di-karapat-dapat
  rationale: Hindi nilulutas ng Hebreo kung ang tanong ay tungkol sa praktikal na posibilidad, pagiging angkop, o takot matapos ang kamatayan ni Uza; pinananatili ng salin at talababa ang tensiyong ito.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kaban” bilang nakasanayang katawagan sa ark at pinanatili ang “Yahweh” bilang personal na banal na pangalan. Ang “makakarating” ay mas idiomatiko kaysa payak na “darating” sa ganitong tanong, habang hindi nagdaragdag ng tahasang tagapagdala.
