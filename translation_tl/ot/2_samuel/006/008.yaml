base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: tl
  text: Nagalit si David dahil biglang rumagasa si Yahweh laban kay Uza[a], at tinawag niya ang lugar na iyon na Perez-Uza hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Perez-Uza” ay humigit-kumulang na nangangahulugang “pagputok” o “pagragasa laban kay Uza.” Inuulit nito ang larong-salita sa Hebreo sa pagitan ng pangalan ng lugar at ng biglaang pagragasa ni Yahweh laban kay Uza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: Nagalit si David
  rationale: Ang idyomang Hebreo ay nagpapahayag ng pagkapoot o galit. Ang “Nagalit si David” ay tuwiran, natural, at hindi nilulutas kung kanino o sa ano nakatuon ang galit.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: biglang sumalakay si Yahweh kay Uza
  rationale: Ang pandiwa at kaugnay na pangngalang mula sa ugat פרץ ay naglalarawan ng marahas at biglaang pagbulusok o pagsalakay. Natural na naihahatid ng “biglang sumalakay” ang biglaan at mapaminsalang kilos, samantalang ipinaliliwanag sa talababa ang larong-salita na hindi lubos na matutularan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: kaya tinawag niyang ... ang lugar na iyon
  rationale: Karaniwang pormula ito ng pagbibigay-pangalan. Ang “kaya” ay malinaw na naghahayag ng bunga o tugon sa naunang pangyayari.
- source_word: פֶּרֶץ עֻזָּה
  choice: Perez-Uza
  rationale: Pinanatili bilang pangalan ng lugar sa transliterasyong madaling basahin sa Filipino; ang kahulugan at pag-uugnay nito sa naunang kilos ay inilagay sa talababa.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: gaya ng tawag dito hanggang sa araw na ito
  rationale: Pinananatili ang pananaw ng tagapagsalaysay at nililinaw na ang pangalan ng lugar ang nanatili hanggang sa kaniyang kasalukuyan.
theological_decisions:
- issue: Tuwirang pagkilos ni Yahweh sa paghatol kay Uza
  choice: biglang sumalakay si Yahweh kay Uza
  alternative: nagkaroon ng sakuna si Uza
  rationale: Tahasan sa Hebreo na si Yahweh ang kumilos. Hindi ito pinalalambot bilang aksidente o di-tuwirang bunga.
- issue: Posibleng tinutukoy ng galit ni David
  choice: Nagalit si David
  alternative: Nagalit si David kay Yahweh
  rationale: Hindi tahasang sinasabi ng pariralang Hebreo kung kanino nakatuon ang galit ni David. Pinananatili ng salin ang tunay na kalabuan sa halip na tukuyin si Yahweh o ang pangyayari bilang layon nito.
translation_notes:
  register: Makabagong Filipino na tuwiran at marangal. Ginamit ang “Uza” at “Perez-Uza” bilang mga anyong madaling bigkasin sa Tagalog. Ang “biglang sumalakay” ay natural na katumbas ng marahas na puwersa ng פרץ, habang ang talababa ang nagpapanatili sa etimolohikal na larong-salita.
