source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ אֶל פְּלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל דָּוִד֙ עֲלֵ֔ה כִּֽי נָתֹ֥ן אֶתֵּ֛ן אֶת הַ/פְּלִשְׁתִּ֖ים בְּ/יָדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: tl
  text: At sumangguni si David kay Yahweh. Itinanong niya, “Sasalakayin ko ba ang mga Filisteo? Ibibigay mo ba sila sa aking kamay[a]?” Sinabi ni Yahweh kay David, “Sumalakay ka, sapagkat tiyak na ibibigay ko ang mga Filisteo sa iyong kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipapasailalim mo ba sila sa akin?” Ang Hebreong idyomang “ibigay sa kamay” ay karaniwang tumutukoy sa pagbibigay ng kapangyarihan o tagumpay laban sa isang kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: sumangguni ... kay Yahweh
  rationale: Sa kontekstong ito, ang שׁאל בַּיהוָה ay paghingi ng patnubay sa Diyos. Likas sa modernong Filipino ang “sumangguni kay Yahweh” at hindi nito tinutukoy ang paraang ginamit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na YHWH bilang “Yahweh,” ayon sa anyo ng pangalang nasa tekstong Hebreo.
- source_word: לֵאמֹר
  choice: Itinanong niya
  rationale: Ipinakikilala nito ang nilalaman ng pagsangguni. Mas natural sa Filipino ang tahasang “Itinanong niya” kaysa literal na “na sinasabi,” nang hindi binabago ang diwa.
- source_word: הַאֶעֱלֶה אֶל־פְּלִשְׁתִּים
  choice: Sasalakayin ko ba ang mga Filisteo?
  rationale: Ang עלה ay literal na “umakyat/humayo paitaas,” ngunit sa kontekstong militar ang tanong ay tungkol sa pagsalakay. Inihahatid ng “sasalakayin” ang malinaw na kontekstuwal na diwa sa natural na Filipino.
- source_word: הֲתִתְּנֵם בְּיָדִי
  choice: Ibibigay mo ba sila sa aking kamay?
  rationale: Pinananatili ang Hebreong larawan ng pagbibigay ng kaaway “sa kamay,” na tumutukoy sa pagpapasailalim o pagkakaloob ng tagumpay.
- source_word: עֲלֵה
  choice: Sumalakay ka
  rationale: Inuulit ng utos ang militar na diwa ng naunang עלה. Ang “sumalakay” ay natural at malinaw sa Filipino.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: sapagkat tiyak na ibibigay ko
  rationale: Ang infinitive absolute na sinundan ng finite verb ay nagbibigay-diin sa katiyakan; ipinahahayag ito ng “tiyak na.”
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang parehong idyoma at paralelismo ng tanong at sagot.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Nasa Hebreong teksto ang Tetragrammaton bilang sariling pangalan. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan nang hindi pinapalitan ng isang titulo.
- issue: Ang Diyos bilang nagbibigay ng tagumpay
  choice: “ibibigay ko ang mga Filisteo sa iyong kamay”
  alternative: “pagwawagiin kita laban sa mga Filisteo”
  rationale: 'Pinananatili ang mismong talinghaga at diin ng Hebreo: si Yahweh ang tiyak na magbibigay ng kaaway sa kapangyarihan ni David, sa halip na gawing tahasang abstraktong pahayag tungkol sa tagumpay.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sumangguni” para sa paghingi ng banal na patnubay at “sumalakay” para sa militar na kahulugan ng עלה. Pinanatili ang idyomang “sa kamay” upang mapangalagaan ang larawan at paralelismo ng Hebreo; ipinaliwanag ito sa talababa.
