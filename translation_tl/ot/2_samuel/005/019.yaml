  source_fidelity: 'Tapat ang salin sa daloy at pangunahing kahulugan ng Hebreo: sumangguni si David kay Yahweh, nagtanong kung kikilos siya laban sa mga Filisteo at kung ibibigay sila ni Yahweh sa kanyang kamay, at tumanggap ng katiyakang tugon. Ang “tiyak na ibibigay ko” ay wastong naghahatid ng diin ng infinitive absolute na נָתוֹן אֶתֵּן.'
