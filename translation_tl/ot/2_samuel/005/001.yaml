  source_fidelity: 'Tumpak ang salin sa Hebreo: ang lahat ng lipi ng Israel ay lumapit kay David, kaugnay ng Hebron, at ipinahayag ang literal na pormula ng pagkakamag-anak na “buto mo at laman mo.” Ang “sa Hebron” ay katanggap-tanggap na paraan upang ipahayag ang חֶבְרֹנָה, habang maayos na itinatala ng talababa ang posibleng direksiyonal na pagbasa na “patungong Hebron.”'
  naturalness: 'Natural at malinaw ang modernong Filipino: “Pagkatapos, dumating kay David sa Hebron ang lahat ng lipi ng Israel...” Ang ayos ng pangungusap ay bahagyang pormal ngunit angkop sa salaysay ng Kasulatan. Ang “Narito” ay dignificado at naiintindihan sa ganitong rehistro.'
  terminology: Ang “lipi ng Israel” ay angkop para sa mga tribo, at ang “kami ay buto mo at laman mo” ay wastong literal na pagpapanatili ng Hebreong idyoma. Ang talababa ay sapat na nagpapaliwanag ng kahulugang pagkakamag-anak nang hindi pinapalitan o dinaragdagan ang pangunahing teksto.
