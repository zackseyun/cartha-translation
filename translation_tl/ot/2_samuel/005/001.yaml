  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: tl
  text: Pagkatapos, dumating kay David sa Hebron[a] ang lahat ng lipi ng Israel at sinabi, “Narito, kami ay buto mo at laman mo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungong Hebron”; ang anyong Hebreo ng “Hebron” ay may hulaping nagsasaad ng direksiyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “buto mo at laman mo,” isang idyoma ng pagkakamag-anak na nagpapahayag ng malapit na ugnayang kadugo o iisang pagkakakilanlang pampamilya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, dumating
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay. Likas sa makabagong Tagalog ang “Pagkatapos,” at tuwirang ipinapahayag ng “dumating” ang diwa ng בוא.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ang lahat ng lipi ng Israel
  rationale: Pinananatili nito ang kolektibo at pambansang diwa ng parirala.
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Ang אֶל ay tumutukoy sa pagkilos patungo sa isang tao; natural na katumbas nito rito ang “kay David.”
- source_word: חֶבְרֹנָה
  choice: sa Hebron
  rationale: May hulaping paturol sa direksiyon ang pangalan ng lugar. Sa Tagalog, maaaring saklawin ng “sa” kapwa ang hantungan at lokasyon nang hindi nagiging mabigat ang pangungusap.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: at sinabi
  rationale: Karaniwang pormula ito sa Hebreo para sa pagpapakilala ng tuwirang pananalita; sapat at natural ang “at sinabi” sa Tagalog.
- source_word: הִנּוּ
  choice: Narito
  rationale: Itinatawag ng pantukoy na ito ang pansin sa kasunod na pahayag. Dignificado at karaniwan ang “Narito” nang hindi gumagamit ng makalumang pananalita.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: buto mo at laman mo
  rationale: Pinananatili ang pagkakasunod at talinghagang pampamilya ng Hebreo sa halip na palitan agad ng paliwanag na “mga kamag-anak mo.”
- source_word: אֲנָחְנוּ
  choice: kami ay
  rationale: Ang “kami” ay angkop dahil kausap nila si David, na hindi kabilang sa pangkat ng nagsasalita; nililinaw ng “ay” ang sugnay na walang pandiwa sa Hebreo.
theological_decisions:
- issue: Pormula ng pagkakamag-anak at ang puwersang pampolitika-teolohiko nito
  choice: “kami ay buto mo at laman mo”
  alternative: “kami ay mga kamag-anak mo” o “kami ay sarili mong bayan”
  rationale: Ang literal na talinghaga ay nagpapanatili kapwa sa pag-aangkin ng magkakabahaging pagkakamag-anak at sa batayan ng pambansang pakikiisa kay David. Hindi nito nililimitahan ang pahayag sa isang payak na alyansang pampolitika o dinaragdagan ng tiyak na doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at dignifikadong Filipino. Pinanatili ang Hebreong talinghaga sa pangunahing teksto at ipinaliwanag ito sa talababa upang hindi mawala ang likas na tensiyon sa pagitan ng literal na pagkakamag-anak at ng pampolitikang pakikiisa.
