  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: tl
  text: Kumuha pa si David ng mga kinakasamang babae[a] at mga asawa mula sa Jerusalem[b] matapos siyang dumating mula sa Hebron, at isinilang pa kay David ang mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kinakasamang babae” ay tumutukoy sa mga babaeng kinakasama na iba ang katayuan kaysa sa mga asawa.
    reason: lexical_clarification
  - marker: b
    text: Maaaring “sa Jerusalem.” Literal na “mula sa Jerusalem” ang Hebreo, na maaaring tumukoy sa lugar kung saan kinuha ni David ang mga babae matapos siyang lumipat doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha
  rationale: Tuwirang ipinapahayag ng לקח ang pagkuha ni David sa mga babae bilang bahagi ng kaniyang sambahayan; hindi dinagdagan ng pagpapahalagang wala sa Hebreo.
- source_word: עוֹד
  choice: pa
  rationale: 'Sa dalawang paglitaw nito, ang עוֹד ay nagpapahiwatig ng karagdagan: kumuha pa siya ng mga babae at nagkaroon pa siya ng mga anak.'
- source_word: פִּלַגְשִׁים
  choice: mga kinakasamang babae
  rationale: Natural itong maunawaan sa modernong Filipino at pinananatiling naiiba sa 'mga asawa.' Nililinaw ng talababa ang mas tiyak na katayuan ng concubine sa sinaunang sambahayan.
- source_word: וְנָשִׁים
  choice: at mga asawa
  rationale: Sa pagkakatambal nito sa פִּלַגְשִׁים at sa konteksto ng sambahayan ng hari, ang נָשִׁים ay tumutukoy sa mga asawang babae, hindi lamang sa mga babae sa pangkalahatan.
- source_word: מִירוּשָׁלִַם
  choice: mula sa Jerusalem
  rationale: Pinananatili nito ang karaniwang kahulugan ng pang-ukol מִן na 'mula sa,' kahit maaaring ang parirala ay idiomatikong tumukoy sa lugar kung saan sila kinuha.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: matapos siyang dumating mula sa Hebron
  rationale: Malinaw na pinananatili ang pagkakasunod ng pangyayari at ang Hebron bilang pinanggalingan ni David.
- source_word: וַיִּוָּלְדוּ ... לְדָוִד
  choice: Nagkaroon pa si David
  rationale: Natural na pormulasyon ito sa Filipino para sa Hebreong pasibong 'ipinanganak kay David,' habang pinananatili ang diwang siya ang ama ng mga isinilang.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa mga anak na lalaki at mga anak na babae sa halip na gawing pangkalahatang 'mga anak.'
theological_decisions:
- issue: Pasalaysay na pagbanggit sa pag-aasawa ni David ng maraming babae
  choice: Isinalin bilang payak na paglalahad nang walang idinagdag na pagsang-ayon o pagsaway.
  alternative: Magdagdag ng pananalitang tahasang humahatol o sumasang-ayon sa ginawa ni David.
  rationale: Iniuulat lamang ng talata ang ginawa ni David at ang kapanganakan ng kaniyang mga anak; wala itong tahasang moral na paghatol.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang 'kinakasamang babae' sa pangunahing teksto upang maiwasan ang mas mapanghusgang dating ng 'kerida,' at nilinaw sa talababa ang sinaunang katayuan nito. Pinanatili ang di-karaniwang 'mula sa Jerusalem' dahil iyon ang pormal na anyo ng Hebreo, kalakip ang alternatibo sa talababa.
