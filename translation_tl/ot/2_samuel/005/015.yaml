  text: Ibhar[a], Elishua, Nefeg, at Jafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebrew, inuulit ang pang-ugnay na “at” bago ang bawat pangalan: “at Ibhar, at Elishua, at Nefeg, at Jafia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחָר
  choice: Ibhar
  rationale: Pangalang pantangi sa talaan ng mga anak ni David; tinumbasan sa pamamagitan ng transliterasyon. Pinanatili ang nakagawiang anyong biblikal na “Ibhar” sa Filipino.
- source_word: אֱלִישׁוּעַ
  choice: Elishua
  rationale: Pangalang pantangi; tuwirang isinalin sa mga titik na madaling basahin sa modernong Filipino, nang hindi pilit na kinakatawan ang huling ayin.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Pangalang pantangi; ginamit ang “f” para sa tunog ng Hebrew pe na walang dagesh, at pinanatili ang mga patinig ng Masoretic Text.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Pangalang pantangi; ang paunang yod ay kinatawan ng nakagawiang “J” sa maraming pangalang biblikal sa Filipino, at ang tunog /f/ ay pinanatili.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay ay inuulit bago ang bawat pangalan sa Hebrew. Sa natural na Filipino, ginamit ang mga kuwit at isang “at” bago ang huling pangalan; ipinaliwanag sa talababa ang literal na pag-uulit.
