base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: tl
  text: Dumating si David sa Baal-perazim[a], at doon niya sila pinabagsak. Sinabi niya, “Bumutas si Yahweh sa hanay ng aking mga kaaway sa harapan ko, gaya ng pagragasa ng tubig na bumabasag sa hadlang.” Kaya pinangalanan niyang Baal-perazim ang lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Baal-perazim ay pangalan ng lugar na kaugnay ng mga salitang Hebreo para sa “paglagos” o “pagputok.” Pinaglalaruan nito ang sinabi ni David na si Yahweh ay “bumutas” sa hanay ng kanyang mga kaaway, gaya ng rumaragasang tubig na bumabasag sa hadlang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-perazim
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon. Ipinaliliwanag sa talababa ang kaugnayan nito sa ugat na פרץ.
- source_word: וַיַּכֵּם
  choice: pinabagsak niya sila
  rationale: Ipinahahayag ng נכה ang marahas na paggapi sa labanan; natural sa modernong Filipino ang “pinabagsak” at hindi nito pinahihina ang puwersang militar.
- source_word: פָּרַץ
  choice: bumutas ... sa hanay
  rationale: Ang פרץ ay tumutukoy sa paglagos o paggawa ng puwang sa isang harang. Ang parirala ay natural sa konteksto ng labanan at naiuugnay sa larawan ng rumaragasang tubig.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin sa transliterasyon ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֹיְבַי
  choice: aking mga kaaway
  rationale: Tuwirang katumbas ng pangngalang may hulaping unang panauhang isahan.
- source_word: לְפָנַי
  choice: sa harapan ko
  rationale: Malapit sa anyong Hebreo at malinaw sa konteksto ng pagtatagumpay ni David sa labanan.
- source_word: כְּפֶרֶץ מָיִם
  choice: gaya ng pagbulusok ng tubig
  rationale: Inilalarawan nito ang tubig na bumubutas at rumaragasa sa isang harang. Ang “pagbulusok” ay natural na Filipino; inilalahad sa talababa ang paglalaro sa magkakaugnay na salitang Hebreo.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: pinangalanan niyang ... ang lugar na iyon
  rationale: Natural na modernong Filipino para sa idyomang Hebreo tungkol sa pagbibigay ng pangalan sa isang lugar.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Banal na pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalan ng lugar at ang banal na pangalang Yahweh. Dahil hindi ganap na matutumbasan sa Filipino ang paglalaro sa פרץ, פֶּרֶץ, at Baal-perazim, ipinaliwanag ito sa talababa.
