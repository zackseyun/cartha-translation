revisions:
- from: Kaya pumunta si David sa Baal-perazim[a], at doon ay pinabagsak niya sila. Sinabi niya, “Bumutas si Yahweh sa hanay ng aking mga kaaway sa harapan ko, gaya ng pagbulusok ng tubig.” Kaya pinangalanan niyang Baal-perazim ang lugar na iyon.
  to: Dumating si David sa Baal-perazim[a], at doon niya sila pinabagsak. Sinabi niya, “Bumutas si Yahweh sa hanay ng aking mga kaaway sa harapan ko, gaya ng pagragasa ng tubig na bumabasag sa hadlang.” Kaya pinangalanan niyang Baal-perazim ang lugar na iyon.
  rationale: Inayos ang pandiwa ng pagdating at lalo na ang larawan ng tubig upang maipakita ang puwersa ng Hebreong כְּפֶרֶץ מָיִם. Pinanatili ang “bumutas” upang mapanatili hangga’t maaari ang salitang-ugat na nag-uugnay sa pahayag ni David at sa pangalang Baal-perazim, at nilinaw ang salitang-laro sa talababa nang hindi itinatakda ang isang tiyak na etimolohiya ng pangalan.
