  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: tl
  text: At iniwan nila roon ang kanilang mga diyus-diyosan[b][a], at dinala ni David at ng kanyang mga tauhan ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag sa 1 Cronica 14:12 na nag-utos si David at sinunog ang mga diyus-diyosan. Dito, sinasabi lamang ng Hebreo ng Samuel na dinala ni David at ng kanyang mga tauhan ang mga iyon.
    reason: cross_reference
  - marker: b
    text: O “kanilang mga imahen.” Ang salitang Hebreo ay tumutukoy sa mga imaheng ginagamit sa pagsamba; nililinaw ng “mga diyus-diyosan” ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: iniwan nila
  rationale: Karaniwang nangangahulugan ang עזב na ‘iwan’ o ‘pabayaan.’ Sa salaysay ng pag-urong ng mga Filisteo, natural at tumpak ang ‘iniwan nila.’
- source_word: שָׁם
  choice: roon
  rationale: Payak na pang-abay na panlunan ito; ang ‘roon’ ay natural sa kasunod na lokasyon sa salaysay.
- source_word: עֲצַבֵּיהֶם
  choice: kanilang mga diyus-diyosan
  rationale: Maaaring tumukoy ang pangngalan sa mga imahen, ngunit sa kontekstong panrelihiyon ay mga imaheng sinasamba ng mga Filisteo ang tinutukoy. Nililinaw ng ‘mga diyus-diyosan’ ang gamit nang hindi dinaragdagan ang diwa.
- source_word: וַיִּשָּׂאֵם
  choice: dinala ... ang mga iyon
  rationale: 'Malawak ang saklaw ng נשא: ‘buhatin,’ ‘dalhin,’ o ‘kunin.’ Ang ‘dinala ... ang mga iyon’ ay angkop sa pisikal na kilos at hindi nagpapalagay kung ano agad ang ginawa sa mga ito pagkatapos.'
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: mga tauhan ni David
  rationale: Literal na ‘David at ang kanyang mga lalaki.’ Sa modernong Filipino, likas at malinaw ang ‘mga tauhan ni David’ para sa kanyang mga kasamang mandirigma, habang iniiwasan ang mas makitid na ‘mga sundalo.’
theological_decisions:
- issue: Ugnayan sa katumbas na salaysay sa 1 Cronica 14:12, na nagsasabing sinunog ang mga diyus-diyosan
  choice: Isinalin ang Masoreticong teksto ng 2 Samuel bilang ‘dinala ... ang mga iyon,’ nang hindi itinutugma sa Cronica.
  alternative: Isang pinagtugmang salin na nagpapahiwatig na sinunog agad ang mga ito.
  rationale: Ang Hebreo ng 2 Samuel ay nagsasaad lamang na dinala ni David at ng kanyang mga tauhan ang mga iyon. Idinaragdag ng 1 Cronica na iniutos ni David na sunugin ang mga ito. Pinananatili ng salin ang pagkakaiba ng dalawang salaysay at inilalagay ang dagdag na detalye sa talababa.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang ‘mga tauhan’ sa halip na literal na ‘mga lalaki’ o mas interpretibong ‘mga sundalo.’ Pinanatili ang ayos ng mga panandang [b][a] ayon sa ibinigay na konsultasyong teksto.
