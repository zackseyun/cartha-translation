  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga isinilang sa kaniya sa Jerusalem: Samua, Sobab, Natan, at Solomon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala nito ang kasunod na talaan. Hindi kailangang isalin nang hiwalay ang panimulang pang-ugnay upang maging natural sa modernong Tagalog.
- source_word: שְׁמוֹת
  choice: mga pangalan
  rationale: Tuwirang salin ng maramihang anyong construct ng salitang 'pangalan.'
- source_word: הַיִּלֹּדִים
  choice: mga isinilang
  rationale: Pinananatili ang di-tiyak na sanggunian ng pasibong participle, na literal na tumutukoy sa 'mga isinilang,' nang hindi dinaragdagan ng 'mga anak' o 'mga lalaki.'
- source_word: לוֹ
  choice: sa kaniya
  rationale: Natural na Tagalog na pahayag ng ugnayang magulang-anak sa pariralang 'isinilang sa kaniya.'
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong parirala na nagsasaad ng lugar ng kapanganakan.
- source_word: שַׁמּוּעַ
  choice: Samua
  rationale: Transliterasyong angkop sa baybay at bigkas ng Tagalog.
- source_word: שׁוֹבָב
  choice: Sobab
  rationale: Transliterasyong angkop sa ortograpiyang Tagalog.
- source_word: נָתָן
  choice: Natan
  rationale: Malapit na transliterasyon ng pangalang Hebreo sa ortograpiyang Tagalog.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga Bibliyang Tagalog.
