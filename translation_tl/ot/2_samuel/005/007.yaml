  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: tl
  text: Ngunit sinakop ni David ang kuta ng Zion[a], na siyang Lungsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanggulan ng Zion.” Ang salitang Hebreo ay tumutukoy sa isang pinatibay na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: sinakop
  rationale: Ang pandiwang לכד ay tumutukoy sa pagsakop o pag-agaw ng isang lugar. Likas at malinaw ang “sinakop” sa kontekstong militar.
- source_word: וַ
  choice: Ngunit
  rationale: Ipinagdurugtong ng waw ang salaysay at, sa konteksto, nagpapahiwatig ng bahagyang pagsalungat sa kumpiyansa ng mga Jebuseo sa naunang talata.
- source_word: מְצֻדַת
  choice: kuta
  rationale: Ang מְצוּדָה ay isang matibay at tanggulang lugar. Karaniwan, maikli, at madaling maunawaan sa modernong Filipino ang “kuta.”
- source_word: צִיּוֹן
  choice: Zion
  rationale: Pangalan ito ng lugar; pinanatili ang nakaugaliang anyong “Zion” sa Filipino.
- source_word: הִיא
  choice: na siyang
  rationale: Ginagamit dito ang panghalip bilang panandang nagpapakilala na ang kuta ng Zion ay ang tinatawag na Lungsod ni David.
- source_word: עִיר דָּוִד
  choice: Lungsod ni David
  rationale: Natural nitong ipinapahayag ang ugnayang genitibo at pinananatili ang kinikilalang katawagan sa lugar.
