base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: tl
  text: Dumating sa hari sa Hebron ang lahat ng matatanda ng Israel. Nakipagtipan[a] sa kanila si Haring David sa Hebron, sa harap ni Yahweh[b], at pinahiran nila ng langis si David bilang hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ng tipan,” isang idyomang nangangahulugang “nakipagtipan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa presensya ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: pumunta
  rationale: Ang Qal wayyiqtol ng בוא ay nagsasaad ng pagdating o pagpunta sa isang patutunguhan; natural sa pananaw ng Tagalog na salaysay ang “pumunta” dahil tahasang binanggit ang Hebron bilang patutunguhan.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: lahat ng matatandang pinuno ng Israel
  rationale: Ang זִקְנֵי ay hindi lamang tumutukoy sa edad kundi sa kinikilalang mga pinuno ng sambayanan; nililinaw ito ng “matatandang pinuno” nang hindi inaalis ang literal na larawan.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: sa hari sa Hebron
  rationale: Ipinahihiwatig ng hulaping direksiyonal sa חֶבְרוֹנָה ang pagpunta sa Hebron, kung saan naroon ang hari. Pinananatili rin ang unang pagtukoy na “hari,” bago ang mas tiyak na “Haring David.”
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: nakipagtipan
  rationale: Ang literal na idyomang Hebreo ay “pumutol ng tipan,” ngunit ang natural at marangal na katumbas sa Tagalog ay “nakipagtipan,” na nagpapanatili sa kapwa panig at taimtim na katangian ng kasunduan.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Sa pariralang כרת ברית, ang pang-ukol ay naglalarawan sa mga taong kausap o kabilang sa tipan; natural itong isinasalin na “sa kanila” kasunod ng “nakipagtipan.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang pormal na tagpuan ng tipan bilang ginawa sa harap o presensya ng Diyos, at tuwirang inililipat ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: וַיִּמְשְׁחוּ
  choice: pinahiran nila ng langis
  rationale: Sa kontekstong maharlika, ang משׁח ay ritwal na pagpapahid ng langis. Ang pagbanggit sa langis ay kailangan sa natural na Tagalog upang malinaw na hindi karaniwang pagpapahid ang tinutukoy.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari ng Israel
  rationale: Natural nitong ipinahahayag sa Tagalog ang pagtatalaga kay David sa paghahari at ang kaniyang awtoridad sa Israel, nang hindi labis na pinahahaba ang parirala.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Ito ang natural na Tagalog na ayos ng titulong maharlika at pangalang pantangi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang transliterasyong “Yahweh” upang mapanatili sa teksto ang natatanging pangalang tipan, sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng בְּרִית sa tagpuang maharlika
  choice: tipan
  alternative: kasunduan
  rationale: Mas mahusay na pinananatili ng “tipan” ang taimtim, pampolitika, at panrelihiyong bigat ng בְּרִית; maaaring magmukhang pangkaraniwang kasunduan lamang ang alternatibo.
- issue: Likas na kahulugan ng royal anointing
  choice: pinahiran ng langis bilang hari
  alternative: itinalagang hari
  rationale: Pinananatili ng napiling salin ang nakikitang ritwal na ipinahahayag ng משׁח at hindi ito pinapantay lamang sa pangkalahatang pagtatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maipahayag ang opisyal na papel ng mga elder, at pinanatili ang pag-uulit ng “Hebron” dahil inuulit din ito sa Hebreo at mahalaga sa tagpuan ng tipan.
