base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: tl
  text: Pumunta ang hari at ang kanyang mga tauhan sa Jerusalem, sa mga Jebuseo, na naninirahan sa lupain. Sinabi ng mga Jebuseo[a] kay David, “Hindi ka makakapasok dito, sapagkat maitataboy ka kahit ng mga bulag at mga pilay!”[b] At ang sabi nila, “Hindi makakapasok dito si David.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sinabi niya kay David.” Malamang na kolektibong tumutukoy ang isahan sa mga Jebuseong naninirahan doon.
    reason: textual_variant
  - marker: b
    text: 'Mahirap ang pagkakabuo ng Hebreo. Ang parirala ay may ideyang ang “mga bulag at mga pilay” ang magtataboy o magpapaalis kay David. Panunuya ang diwa: para sa mga Jebuseo, napakatatag ng lungsod kaya kahit ang mga bulag at mga pilay ay makapagtataboy kay David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pumunta
  rationale: Karaniwang pandiwang pasalaysay ang הלך dito. Hindi ginamit ang “nagmartsa” upang hindi magdagdag ng aspektong militar na wala sa mismong pandiwa.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: ang hari at ang kanyang mga tauhan
  rationale: Pinananatili ng “mga tauhan” ang malawak na kahulugan ng אֲנָשָׁיו nang hindi ito nililimitahan sa mga sundalo lamang.
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  choice: sa kinaroroonan ng mga Jebuseong naninirahan sa lupain
  rationale: Ang anyong isahan ay kolektibo at tumutukoy sa mga Jebuseo. Iniwasan ang “upang salakayin” dahil mas tiyak iyon kaysa sa payak na pang-ukol na אֶל, bagaman malinaw na mapanlaban ang konteksto.
- source_word: וַיֹּאמֶר
  choice: Sinabi ng mga Jebuseo
  rationale: Isahan ang pandiwa sa Hebreo, ngunit kolektibo ang pinakamalinaw na pakahulugan sa konteksto. Inilalahad sa talababa ang literal na anyo upang hindi maitago ang gramatikal na tensiyon.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Hindi ka makakapasok dito
  rationale: Ang “makakapasok” ay natural na Filipino para sa mapanghamong pahayag tungkol sa pagpasok sa isang tanggulang lungsod.
- source_word: הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: maitataboy ka kahit ng mga bulag at mga pilay
  rationale: Mahirap ang sintaks ng Hebreo, na literal na may ideyang “maliban kung alisin mo ang mga bulag at mga pilay.” Ipinahihiwatig ng panunuya na napakatatag ng lungsod kaya kahit sila ay makapagtataboy kay David; ang literal na kahirapan ay pinanatili sa talababa.
- source_word: לֵאמֹר ... לֹא יָבֹא דָוִד הֵנָּה
  choice: Sinasabi nila, “Hindi makakapasok dito si David.”
  rationale: Pinananatili ang retorikal na pag-uulit at tuwirang pananalita ng Hebreo sa halip na gawing paliwanag lamang.
theological_decisions:
- issue: Mapanlait na pagbanggit sa mga bulag at mga pilay
  choice: Pinanatili ang kongkretong mga katawagang “mga bulag at mga pilay” bilang iniulat na panunuya ng mga Jebuseo.
  alternative: Paraprasahin bilang “kahit ang pinakamahihina sa amin.”
  rationale: Hindi dapat gawing abstraktong metapora ang mismong mapanuyang pananalita. Ang salin ay nag-uulat ng sinabi ng mga Jebuseo at hindi nagpapatibay sa kanilang pagtingin sa mga taong may kapansanan.
- issue: Sino ang nagsalita kay David
  choice: 'Ginawang kolektibo ang paksa sa pangunahing teksto: “Sinabi ng mga Jebuseo.”'
  alternative: 'Panatilihin ang literal na isahan: “Sinabi niya kay David.”'
  rationale: Isahan ang anyong Hebreo ngunit walang malinaw na indibidwal na tinutukoy; malamang na kolektibo itong tumutukoy sa mga Jebuseo. Inilalahad sa talababa ang tunay na gramatikal na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga tauhan” sa halip na “mga kawal” upang huwag paliitin ang saklaw ng salita, at “makakapasok” upang maging natural ang hamon tungkol sa isang tanggulang lungsod. Ang mga talababa ay inilagay sa mismong mga sugnay na tinutukoy ng mga ito.
