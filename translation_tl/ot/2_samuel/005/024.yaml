  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: tl
  text: Kapag marinig mo ang tunog ng mga yabag ng nagmamartsa sa mga tuktok ng mga punong balsamo[a], kumilos ka nang walang pag-aatubili, sapagkat sa oras na iyon ay humayo na si Yahweh sa unahan mo upang salakayin ang kampo ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong baca.” Hindi tiyak ang eksaktong uri ng punong tinutukoy ng salitang Hebreo; sa ilang matatandang salin, “mga punong morera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Kapag narinig mo
  rationale: Ang היה kasunod ng waw at ang infinitive construct na may ב ay bumubuo ng panghinaharap na temporal na kalagayan; natural itong ipinahahayag sa Tagalog bilang “Kapag narinig mo.”
- source_word: קוֹל צְעָדָה
  choice: ang yabag ng nagmamartsa
  rationale: Ang קוֹל ay tunog at ang צְעָדָה ay paghakbang o pagmamartsa. Ipinahihiwatig ng “yabag ng nagmamartsa” ang naririnig na sunod-sunod na hakbang sa kontekstong militar.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: sa mga tuktok ng mga punong balsamo
  rationale: Tumutukoy ang רָאשֵׁי sa mga tuktok. Hindi tiyak ang eksaktong uri ng punong tinutukoy ng בְּכָאִים; ginamit ang karaniwang “balsamo” at pinanatili sa talababa ang kawalang-katiyakan.
- source_word: אָז תֶּחֱרָץ
  choice: kumilos ka nang buong-tatag
  rationale: Sa kontekstong ito, ang חרץ ay nag-uutos ng masigla at tiyak na pagkilos. Ang “buong-tatag” ay naghahatid ng determinasyon nang hindi nililimitahan ang diwa sa bilis lamang.
- source_word: כִּי אָז
  choice: sapagkat sa oras na iyon
  rationale: Nagbibigay ang כִּי ng dahilan sa iniutos na pagkilos, at inuulit ng אָז ang tiyak na sandali ng palatandaan.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: humayo na si Yahweh sa unahan mo
  rationale: Ang perpektong anyo ng יָצָא ay nagpapahiwatig na sa sandaling marinig ang palatandaan ay nagsimula nang humayo si Yahweh. Malinaw na ipinahahayag ng “sa unahan mo” na siya ang nauuna sa labanan.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: upang salakayin ang kampo ng mga Filisteo
  rationale: Sa kontekstong militar, ang hiphil ng נכה ay tumutukoy sa paglusob o pananakit upang gapiin. Pinananatili ng “kampo” ang literal na מַחֲנֶה at natural ang “salakayin” sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa di-nakikitang pagkilos ni Yahweh sa tunog sa mga puno
  choice: Hindi tuwirang tinukoy kung sino ang nagmamartsa
  alternative: “yabag ng hukbo ni Yahweh” o “yabag ni Yahweh”
  rationale: Binabanggit lamang ng Hebreo ang “tunog/yabag ng pagmamartsa” at saka sinasabing humayo na si Yahweh. Hindi dapat idagdag sa pangunahing teksto ang isang tahasang paksa na wala sa pinagmulan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Aspekto ng יָצָא sa propetikong tagubilin
  choice: humayo na
  alternative: hahayo; humahayo
  rationale: 'Pinananatili nito ang tensiyon ng perpektong pandiwa: sa mismong oras ng palatandaan, ang pagkilos ni Yahweh ay maituturing nang nasimulan, bagaman ang pangyayari ay ipinapahayag bilang tagubilin para sa hinaharap.'
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “yabag ng nagmamartsa” upang maging malinaw ang tunog sa kontekstong militar, at “kumilos ka nang buong-tatag” upang mapanatili ang lakas at lawak ng utos. Ang marker na [a] ay nasa pangunahing teksto.
