  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי מָשְׁח֨וּ אֶת דָּוִ֤ד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑ד וַ/יִּשְׁמַ֣ע דָּוִ֔ד וַ/יֵּ֖רֶד אֶל הַ/מְּצוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: tl
  text: Nang mabalitaan ng mga Filisteo na pinahiran si David bilang hari ng Israel, umahon ang lahat ng mga Filisteo upang hanapin siya. Nang mabalitaan iyon ni David, bumaba siya sa kuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muog.” Ang salitang Hebreo ay tumutukoy sa isang pinatibay na kuta o kanlungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang tawag sa Filipino para sa pangkat na ito.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng balitang narinig ng mga Filisteo.
- source_word: מָשְׁחוּ
  choice: pinahiran
  rationale: Tuwirang ipinapahayag ang ritwal ng pagpapahid; pinananatiling di-tiyak ang mga gumawa nito, gaya ng konteksto ng anyong maramihan sa Hebreo.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari ng Israel
  rationale: Natural sa Filipino at malinaw na tumutukoy sa pagkakahirang kay David upang mamuno sa Israel.
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili ang heograpikong diwa ng pag-akyat nang hindi idinaragdag ang mas tiyak na ideya ng pagmamartsa.
- source_word: כָל־פְלִשְׁתִּים
  choice: ang lahat ng mga Filisteo
  rationale: Pinananatili ang tahasang diin ng כָל sa kabuuan ng mga Filisteo.
- source_word: לְבַקֵּשׁ אֶת־דָּוִד
  choice: upang hanapin siya
  rationale: Saklaw ng 'hanapin' ang mas malawak na kahulugan ng בקש at hindi nito nililimitahan ang layunin sa pagdakip o pagpatay.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Nang mabalitaan iyon ni David
  rationale: Natural na salaysay sa Filipino; ang 'iyon' ay kumakatawan sa bagay na hindi tahasang binanggit ngunit malinaw sa konteksto.
- source_word: וַיֵּרֶד
  choice: bumaba siya
  rationale: Tuwirang pinananatili ang kilos na pagbaba.
- source_word: הַמְּצוּדָה
  choice: ang kuta
  rationale: Ang 'kuta' ay natural at dignified na katumbas ng isang pinatibay na kanlungan o stronghold.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang himig. Ginamit ang 'mabalitaan' para sa natural na pagsasalaysay at ang 'umahon' upang mapanatili ang heograpikong kilos ng tekstong Hebreo. Inilagay ang talababa pagkatapos ng 'kuta,' ang salitang tunay na tinutukoy nito.
