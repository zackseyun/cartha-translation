  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: tl
  text: Dumating ang mga Filisteo at kumalat sa Lambak ng Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumuwesto sa Lambak ng Refaim.”
