lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ang וּ ay nagdurugtong sa naunang salaysay; hindi na kailangang isalin nang hiwalay dahil natural sa modernong Tagalog ang pagsisimula sa pandiwa. Ang פְלִשְׁתִּים ay ang karaniwang pangalang “mga Filisteo.”
- source_word: בָּאוּ
  choice: Dumating
  rationale: Ang Qal perfect ng בוא ay tumutukoy sa pagdating ng mga Filisteo sa lugar; malinaw at natural ang “dumating” sa salaysay.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: kumalat
  rationale: Sa kontekstong militar, inilalarawan ng נטשׁ ang pagkalat o pagpuwesto ng hukbo sa isang malawak na lugar. Pinananatili ng “kumalat” ang konkretong larawan nang hindi labis na ginagawang teknikal ang kahulugan.
- source_word: בְּ/עֵמֶק
  choice: sa Lambak ng
  rationale: Ang בְּ ay lokatibo at ang עֵמֶק ay “lambak.” Ginamit ang malaking titik sapagkat bahagi ito ng pangalan ng lugar.
- source_word: רְפָאִים
  choice: Refaim
  rationale: Bahagi ito ng pangalang heograpiko na עֵמֶק רְפָאִים, kaya tinumbasan sa transliterasyong angkop sa pagbasa sa Filipino sa halip na isalin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang natural na ayos na pandiwa muna. Ang “kumalat” ay nagpapanatili sa lawak ng pandiwang Hebreo, samantalang inilalahad sa talababa ang mas tiyak na posibleng kahulugang militar.
