  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: tl
  text: Muling umahon ang mga Filisteo at kumalat sa Lambak ng Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naglatag ng kanilang hanay” o “pumuwesto sa buong lambak.” Malamang na inilalarawan ng pandiwang Hebreo ang paglawak o pagpuwesto ng mga Filisteo sa lambak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: Muling umahon
  rationale: Ang pinagsamang יָסַף, עוֹד, at infinitibong לַעֲלוֹת ay nagsasaad ng pag-uulit ng naunang pag-ahon o pagsalakay. Likas sa modernong Tagalog ang “muling umahon” at pinananatili nito ang heograpikal at militar na diwa ng עלה.
- source_word: פְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang katawagan sa pangkat-etniko; ang “mga” ay kailangan sa Tagalog upang malinaw na maramihan.
- source_word: וַיִּנָּטְשׁוּ
  choice: pumuwesto nang kalat
  rationale: Sa kontekstong militar, malamang na inilalarawan ng pandiwa ang pagkalat o pagdedepuwesto ng hukbo sa isang lugar, hindi ang simpleng pag-iwan. Pinananatili ng parirala ang posibleng diwa ng pagkalat habang nililinaw na taktikal ang pagkilos.
- source_word: בְּעֵמֶק רְפָאִים
  choice: sa Lambak ng Refaim
  rationale: Ang עֵמֶק ay “lambak,” at ang רְפָאִים ay pangalan ng pook na angkop na tumbasan sa transliterasyong Filipino na “Refaim.”
