  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: tl
  text: At nalaman ni David na itinatag siya ni Yahweh bilang hari ng Israel, at itinaas niya ang kaharian ni David alang-alang sa kanyang bayang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “alang-alang sa bayan ni David, ang Israel,” kung ang “kanyang” ay tumutukoy kay David sa halip na kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: At nalaman
  rationale: Tuwirang inilalarawan ng ידע ang pagkaalam o pagkabatid ni David; ang “nalaman” ay natural sa salaysay at hindi labis na nagpapakahulugan.
- source_word: הֱכִינוֹ
  choice: itinatag siya
  rationale: Ang Hiphil ng כון ay tumutukoy sa pagpapatatag o pagkumpirma. Sa konteksto ng paghahari, malinaw na ipinahahayag ng “itinatag siya” ang pagpap تثبيت ng Diyos kay David sa kanyang katungkulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari sa Israel
  rationale: Ang לְ ay nagpapakita ng tungkulin, at ang עַל ay nagpapahiwatig ng pamamahala. Ang “bilang hari sa Israel” ay natural na Filipino para sa paghahari sa bayan.
- source_word: נִשֵּׂא
  choice: itinaas Niya
  rationale: Ipinahahayag ng anyo ng נשׂא ang pag-angat o pagdakila. Ang “itinaas” ay malinaw at dignified, at ang malaking titik sa “Niya” ay tumutulong tukuyin si Yahweh bilang paksa nang hindi binabago ang diwa.
- source_word: מַמְלַכְתּוֹ
  choice: ang kanyang kaharian
  rationale: Maaaring tumukoy ang מַמְלָכָה sa kaharian, paghahari, o kapangyarihang maharlika. Pinananatili ng “kaharian” ang lawak at konkretong anyo ng orihinal.
- source_word: בַּעֲבוּר
  choice: alang-alang sa
  rationale: Ipinapakita ng parirala ang layunin o kapakinabangan; natural na ipinahahayag ng “alang-alang sa” na ang pag-angat ng kaharian ay para sa ikabubuti ng Israel.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: Kanyang bayang Israel
  rationale: Pinananatili ang ugnayang pag-aari at ang appositional na pagkakakilanlan ng Israel bilang bayan. Ang “Kanyang” ay kumakatawan sa pinakamalamang na pagtukoy kay Yahweh, habang itinatala sa talababa ang tunay na gramatikal na posibilidad na tumukoy ito kay David.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa עַמּוֹ (“kanyang bayan”)
  choice: 'Tumutukoy kay Yahweh: “Kanyang bayang Israel.”'
  alternative: 'Maaaring tumukoy kay David: “kanyang bayang Israel,” ibig sabihin, ang bayan ni David.'
  rationale: Si Yahweh ang kumikilos sa naunang sugnay—Siya ang nagtatag kay David at nagtaas sa kaharian nito—kaya Siya ang pinakamalamang na tinutukoy ng panghalip. Karaniwan din sa Kasulatan ang pagkilala sa Israel bilang bayan ni Yahweh. Gayunman, dahil maaaring tumukoy ang panlalaking panghalip kay David, pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan. Ang mga malaking titik sa “Niya/Kanyang” ay ginagamit lamang upang luminaw ang pinakamalamang na tinutukoy na si Yahweh; ang alternatibong pagtukoy kay David ay malinaw na pinananatili sa talababa.
