  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: tl
  text: Sa Hebron, naghari siya sa Juda nang pitong taon at anim na buwan; at sa Jerusalem, naghari siya nang tatlumpu't tatlong taon sa buong Israel at Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: Sa Hebron
  rationale: Ang בְּ ay nagmamarka ng lugar. Likas sa modernong Tagalog ang “Sa Hebron” para sa lugar na pinagharihan ni David.
- source_word: מָלַךְ
  choice: naghari siya
  rationale: Ang qatal dito ay nagbubuod sa tagal ng pamamahala, hindi lamang sa sandali ng pagluklok; malinaw itong naihahayag ng “naghari siya.”
- source_word: עַל יְהוּדָה
  choice: sa Juda
  rationale: Sa pariralang מלך על, ang עַל ay tumutukoy sa bayan o nasasakupang pinaghaharian. Sa Tagalog, natural at malinaw ang pandiwang “naghari ... sa Juda.”
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: nang pitong taon at anim na buwan
  rationale: Tuwirang pahayag ito ng tagal; ginagamit ang “nang” upang iugnay ang haba ng panahon sa “naghari.”
- source_word: וּבִירוּשָׁלַם
  choice: at sa Jerusalem
  rationale: Ipinakikilala ng pangatnig at pang-ukol ang ikalawang lugar ng paghahari. Karaniwan at natural sa Tagalog ang “sa Jerusalem.”
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: tatlumpu't tatlong taon
  rationale: Ito ang karaniwang makabagong anyo sa Tagalog ng bilang na tatlumpu at tatlo.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: sa buong Israel at Juda
  rationale: Pinananatili ang parehong “Israel” at “Juda,” gaya sa Hebreo, upang maipakita ang buong saklaw ng nagkaisang kaharian at ang nananatiling pagkilala sa dalawang bahagi nito.
