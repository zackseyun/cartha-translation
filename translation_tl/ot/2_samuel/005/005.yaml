translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “naghari siya” upang sundan ang estruktura at diin ng Hebreo. Ginamit ang semicolon upang malinaw na paghiwalayin ang dalawang yugto at lugar ng paghahari.
