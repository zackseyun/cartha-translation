lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: Tatlumpung taong gulang
  rationale: Ang literal na anyong Hebreo na “anak ng tatlumpung taon” ay karaniwang idyoma para sa edad; natural at tumpak itong ipinapahayag sa makabagong Tagalog bilang “tatlumpung taong gulang.”
- source_word: דָּוִד
  choice: David
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ang ב na sinusundan ng infinitive construct ng מלך at hulaping ikatlong panauhang panlalaki ay nagsasaad ng panahon ng pagluklok o pagsisimula ng paghahari. Pinananatili ng salin ang aspektong temporal at ang diwa ng pagsisimula.
- source_word: אַרְבָּעִים שָׁנָה
  choice: apatnapung taon
  rationale: Tuwirang pahayag ito ng tagal ng paghahari.
- source_word: מָלָךְ
  choice: naghari siya
  rationale: Ang pandiwang מלך ay tumutukoy sa paghahari o paggamit ng kapangyarihan bilang hari; “naghari siya” ang natural at eksaktong katumbas.
