  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: tl
  text: Tatlumpung taong gulang si David nang magsimula siyang maghari[a], at naghari siya nang apatnapung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang maging hari siya.”
