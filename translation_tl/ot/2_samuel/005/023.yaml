revisions:
- from: Kaya sumangguni si David kay Yahweh. Sinabi niya, “Huwag kang sumalakay nang harapan. Umikot ka sa likuran nila at lumapit upang salakayin sila sa tapat ng mga punong baka[a].”
  to: Kaya sumangguni si David kay Yahweh, at sinabi ni Yahweh, “Huwag kang sumulong. Umikot ka sa likuran nila at lumapit ka sa kanila sa tapat ng mga puno ng baca[a].”
  rationale: Inalis ang interpretatibong “nang harapan” upang mapanatili ang mas pangkalahatang utos na huwag sumulong, at inalis ang tahasang layuning “upang salakayin” mula sa “lumapit” upang hindi lumampas sa pandiwang Hebreo. Nilinaw ang tagapagsalita bilang si Yahweh. Ang di-tiyak na pangalan ng puno ay isinaling-transliterasyon bilang “baca” at nilagyan ng talababa para sa mga kilalang alternatibo.
