base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: tl
  text: Kaya sumangguni si David kay Yahweh, at sinabi ni Yahweh, “Huwag kang sumulong. Umikot ka sa likuran nila at lumapit ka sa kanila sa tapat ng mga puno ng baca[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong balsamo”; ayon sa tradisyon, “mga punong mulberi.” Hindi tiyak ang uri ng punong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: sumangguni ... kay Yahweh
  rationale: Sa kontekstong ito, ang שׁאל na may בַּיהוָה ay paghingi ng patnubay sa Diyos, hindi simpleng pagtatanong lamang.
- source_word: לֹא תַעֲלֶה
  choice: Huwag kang sumalakay nang harapan
  rationale: Ang עלה ay literal na ‘umakyat’ o ‘sumulong,’ ngunit ipinakikita ng kasunod na utos na hindi ipinagbabawal ang lahat ng pagsalakay; sa halip, hindi dapat gawin ni David ang tuwirang pagsulong na una niyang binalak.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: Umikot ka sa likuran nila
  rationale: Malinaw nitong ipinahahayag ang taktikal na pag-ikot patungo sa likuran ng kalaban.
- source_word: וּבָאתָ לָהֶם
  choice: lumapit upang salakayin sila
  rationale: Sa kontekstong militar, ang בוא + ל ay tumutukoy sa paglapit laban sa isang kaaway; pinananatili ng salin ang direksiyon at layunin ng pagkilos.
- source_word: מִמּוּל
  choice: sa tapat ng
  rationale: Ipinahahayag nito ang posisyong kaharap o katapat ng isang bagay.
- source_word: בְּכָאִים
  choice: mga punong baka
  rationale: Hindi tiyak ang uri ng punong tinutukoy. Ang transliterasyong ‘baka’ ay umiiwas sa pagpapanggap na tiyak ang pagkakakilanlan nito, habang inilalahad sa talababa ang mga karaniwang mungkahing salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangngalang pantangi ang Tetragrammaton sa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Tinutukoy ng וַיֹּאמֶר ang nagsasalita
  choice: Sinabi niya
  alternative: Sinabi ni Yahweh
  rationale: Panlalaking pang-isahang panghalip lamang ang ipinahihiwatig ng pandiwa, kaya pinananatili ang pormal na posibilidad ng ‘niya’; gayunman, malinaw sa konteksto na si Yahweh ang sumasagot kay David.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na wikang militar. Ginamit ang ‘sumangguni’ para sa paghingi ng banal na patnubay at pinanatili ang di-tiyak na pangalan ng puno sa pamamagitan ng transliterasyon at talababa.
