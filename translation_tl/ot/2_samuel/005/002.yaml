base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: tl
  text: Noon pa man[a], noong si Saul pa ang hari namin, ikaw ang nangunguna sa Israel sa paglabas at pagpasok nila.[b] At sinabi sa iyo ni Yahweh, “Ikaw ang magpapastol sa bayan kong Israel, at ikaw ang magiging pinuno[c] ng Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kahapon at noong makalawa,” isang idyomang nangangahulugang “noong una” o “dati pa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “naglalabas at nagpapapasok sa Israel,” isang idyoma para sa pangunguna sa bayan sa kanilang mga gawain, lalo na sa pakikidigma.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tagapamahala.” Ang salitang Hebreo rito ay iba sa karaniwang salita para sa “hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: Noon pa man
  rationale: Likas na idyomatikong Tagalog para sa Hebreong literal na “kahapon at noong makalawa,” na tumutukoy sa panahong nakaraan at nagpapahiwatig na dati pa itong ginagawa ni David.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: nang si Saul ang hari namin
  rationale: Malinaw na temporal na sugnay; natural sa Tagalog ang “hari namin” para sa literal na “hari sa ibabaw namin.”
- source_word: אַתָּה
  choice: ikaw na ang
  rationale: Pinananatili ang diin ng tahasang panghalip sa Hebreo.
- source_word: מוציא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: nangunguna sa Israel sa paglabas at pag-uwi nila
  rationale: Pinananatili ang larawan ng paglabas at pagpasok habang malinaw na ipinahihiwatig ang pamumuno sa bayan, lalo na sa mga pagkilos na militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng pangalang Yahweh ang Tetragrammaton at pinananatili ang personal na pangalan ng Diyos sa teksto.
- source_word: תִרְעֶה
  choice: magpapastol
  rationale: Pinananatili ang maharlika at pastoral na metapora ng Hebreo sa halip na gawing payak na “mamumuno.”
- source_word: נָגִיד
  choice: pinuno
  rationale: Malinaw at likas na katumbas na hindi ipinapantay ang salita sa karaniwang Hebreong termino para sa “hari.”
theological_decisions:
- issue: Paglalarawan sa paghahari bilang pagpapastol
  choice: magpapastol sa bayan kong Israel
  alternative: mamumuno sa bayan kong Israel
  rationale: Ang Hebreo ay sadyang gumagamit ng metapora ng pastol; pinananatili ito upang hindi mawala ang teolohikal na larawan ng haring nangangalaga sa bayan ng Diyos.
- issue: Kahulugan ng נָגִיד
  choice: pinuno
  alternative: hari; prinsipe; tagapamahala
  rationale: Ang “pinuno” ay nagpapanatili sa pagkakaiba nito sa karaniwang salita para sa “hari” at hindi nagpapasok ng makabagong ideya ng anak ng hari na maaaring ipahiwatig ng “prinsipe.”
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang tipanang pangalan na nasa Hebreong teksto nang walang denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Noon pa man” upang natural na maipahayag ang Hebreong idyoma; pinanatili ang metapora ng pagpapastol at ang pagkakaiba ng “pinuno” sa “hari.”
