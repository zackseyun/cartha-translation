translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pati” upang likas na pag-ugnayin ang mga sugo at mga ipinadalang materyales at manggagawa. Inilipat ang mga panandang talababa sa mismong mga pariralang tinatalakay ng bawat tala.
