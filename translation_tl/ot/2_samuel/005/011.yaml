base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: tl
  text: Nagpadala si Hiram na hari ng Tiro ng mga sugo kay David, kasama ang mga troso ng sedro, mga manggagawa sa kahoy, at mga manggagawa sa batong pader[a]. At ipinagtayo nila si David ng isang bahay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga kantero.” Literal na binabanggit sa pariralang Hebreo ang “bato” at “pader.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang palasyo.” Literal na “bahay” ang salitang Hebreo, ngunit sa konteksto ng isang hari maaari itong tumukoy sa palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Nagpadala
  rationale: Likas na salin ng pandiwang שלח sa salaysay; pinananatili nito ang pagkilos ni Hiram bilang paksa.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: si Hiram na hari ng Tiro
  rationale: Karaniwang anyong Filipino ng pangalan at lugar, at malinaw na ipinapakita ang katungkulan ni Hiram.
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Saklaw nito ang pangkalahatang kahulugang mga mensahero at maaari ring magpahiwatig ng mga kinatawang diplomatiko nang hindi ipinipilit ang huling pakahulugan.
- source_word: וַעֲצֵי אֲרָזִים
  choice: mga troso ng sedro
  rationale: Ang literal na ‘mga kahoy/puno ng sedro’ ay tumutukoy sa materyales na kahoy; kongkreto at natural sa konteksto ng pagtatayo ang ‘mga troso.’
- source_word: חָרָשֵׁי עֵץ
  choice: mga manggagawa sa kahoy
  rationale: Pinananatili ang malawak na diwa ng חָרָשׁ bilang bihasang artisan at hindi ito nililimitahan sa mas makitid na gawaing karpintero.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: mga tagagawa ng pader na bato
  rationale: Likas sa Filipino at kapuwa pinananatili ang mga elementong ‘bato’ at ‘pader’ ng mahirap na pariralang Hebreo.
- source_word: וַיִּבְנוּ
  choice: ipinagtayo nila
  rationale: Ipinahahayag nang natural sa Filipino ang maramihang gumawa at ang pagtatayo para sa kapakinabangan ni David.
- source_word: בַיִת לְדָוִד
  choice: isang bahay para kay David
  rationale: Ang pangunahing kahulugan ng בַיִת ay ‘bahay’; hindi tahasang ginagawang ‘palasyo’ ang teksto, bagaman ang gayong kahulugan ay posible sa maharlikang konteksto.
