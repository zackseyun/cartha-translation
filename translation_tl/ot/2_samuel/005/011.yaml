  source_fidelity: Tumpak na naipapahayag ng salin ang pagpapadala ni Hiram ng mga sugo, troso ng sedro, mga manggagawa sa kahoy, at mga manggagawang kaugnay ng batong pader. Ang “ipinagtayo nila si David ng isang bahay” ay wastong nagpapahayag ng pangmaramihang tagagawa at ng pakinabang para kay David.
  naturalness: May bahagyang di-likas na pag-uugnay sa “pati ng mga troso.” Mas malinaw at mas likas sa makabagong Filipino ang “kasama ang,” nang hindi binabago ang saklaw ng mga bagay at taong ipinadala.
