  text: וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/מְּצֻדָ֔ה וַ/יִּקְרָא לָ֖/הּ עִ֣יר דָּוִ֑ד וַ/יִּ֤בֶן דָּוִד֙ סָבִ֔יב מִן הַ/מִּלּ֖וֹא וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: tl
  text: Kaya nanirahan si David sa tanggulan at tinawag niya itong Lungsod ni David. Nagtayo si David sa buong paligid, mula sa Milo papaloob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “mula sa Milo at papaloob,” o “mula sa Milo patungo sa loob.” Ang “Milo” ay malamang na isang kilalang estruktura o patong-patong na tambak na lupa sa Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Likas na salin ng ישב sa salaysay at ipinahihiwatig ang paninirahan ni David sa nasakop na tanggulan.
- source_word: בַּמְּצֻדָה
  choice: sa tanggulan
  rationale: Tumutukoy ang מְצֻדָה sa isang pinatibay at maipagtatanggol na lugar; malinaw at karaniwan sa modernong Filipino ang “tanggulan.”
- source_word: וַיִּקְרָא לָהּ
  choice: tinawag niya itong
  rationale: Tuwirang ipinapahayag ang pagbibigay ng pangalan o katawagan nang hindi dinaragdagan ang diwa.
- source_word: עִיר דָּוִד
  choice: Lungsod ni David
  rationale: Itinuturing itong pantanging pangalan ng lugar at isinasalin sa karaniwang anyong Filipino.
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Pinananatili ang payak na kahulugan ng בנה na “magtayo/magpatayo,” nang hindi ipinapalagay na tahasang “pinatibay” o “muling itinayo.”
- source_word: סָבִיב
  choice: sa buong paligid
  rationale: Ipinakikita ang saklaw na paikot o nakapalibot na ipinahahayag ng סָבִיב.
- source_word: מִן הַמִּלּוֹא
  choice: mula sa Milo
  rationale: Hindi tiyak ang eksaktong tinutukoy ng teknikal o topograpikong terminong מִלּוֹא, kaya pinanatili itong pangalang “Milo” at ipinaliwanag sa talababa.
- source_word: וָבָיְתָה
  choice: papaloob
  rationale: Ipinahahayag ang direksiyonal na diwang patungo sa loob, habang iniiwasang tukuyin ito bilang isang partikular na bahay o gusali.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang “Milo” dahil hindi tiyak ang eksaktong uri ng lugar o estruktura. Inilagay ang pananda [a] pagkatapos ng sugnay na tinutukoy nito.
