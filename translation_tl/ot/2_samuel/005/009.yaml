  source_fidelity: 'Tumpak na naisasalin ang sunod-sunod na kilos sa Hebreo: nanirahan si David sa tanggulan, pinangalanan niya itong Lungsod ni David, at nagtayo siya sa palibot mula sa Milo papaloob. Pinananatili ng “Milo” ang hindi tiyak na topograpiko/teknikal na termino, at ang “papaloob” ay angkop na naghahatid ng direksiyonal na וָבָיְתָה nang hindi ipinagpapalagay ang isang partikular na gusali.'
