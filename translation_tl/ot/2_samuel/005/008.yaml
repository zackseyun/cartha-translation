  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: tl
  text: At sinabi ni David noong araw na iyon, “Sinumang sumalakay sa mga Jebuseo at makarating sa lagusan ng tubig[a], at sa mga pilay at mga bulag, na kinapopootan ng kaluluwa ni David.”[b] Kaya sinasabi nila, “Hindi makapapasok sa bahay[c] ang bulag at ang pilay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “daluyan,” “alulod,” o “tunel.” Malamang na tumutukoy ang salitang Hebreo sa isang sistema o lagusan ng tubig, ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang sintaks ng Hebreo sa bahaging ito. Itinuturing ng ilan na ang mga salitang “mga pilay at mga bulag” ay bahagi ng panunuya ng mga Jebuseo sa naunang talata, sa halip na tuwirang layon ng hamon ni David.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “palasyo.” Sa kontekstong ito, ang “bahay” ay maaaring tumukoy sa tirahang maharlika.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Sinumang sumalakay sa mga Jebuseo
  rationale: Ang כָּל kasama ng participle ay isang di-tiyak na pormula ng hamon. Ang “sinumang sumalakay” ay likas sa modernong Tagalog at hindi labis na tinutukoy kung pananakit, pagpatay, o paglupig ang eksaktong kilos. Ang יְבֻסִי ay anyong isahan ngunit kolektibong katawagan sa mga Jebuseo.
- source_word: וְיִגַּע
  choice: at makarating
  rationale: Karaniwang nangangahulugang “humipo” o “umabot/makarating” ang נגע. Sa kontekstong militar at topograpiko, mas malinaw ang “makarating” at hindi ito nagdaragdag ng marahas na diwang wala sa mismong pandiwa.
- source_word: בַּצִּנּוֹר
  choice: sa lagusan ng tubig
  rationale: Hindi tiyak ang eksaktong kahulugan ng צִנּוֹר, ngunit malamang na tumutukoy ito sa bahagi ng sistema ng tubig o sa isang lagusan/baras. Ang “lagusan ng tubig” ay malinaw sa karaniwang mambabasa habang iniiwan sa talababa ang ibang posibilidad.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הָעִוְרִים
  choice: at sa mga pilay at mga bulag
  rationale: Pinananatili ang pang-ugnay at ang mahirap, siksik na ayos ng Hebreo sa halip na tahimik na ipaliwanag ang ugnayan ng parirala sa hamon ni David. Ang talababa ay naghaharap ng mahalagang alternatibong pagbasa.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: na kinapopootan ng kaluluwa ni David
  rationale: Pinananatili ang tahasang pagbanggit sa “kaluluwa ni David” at ang tindi ng pahayag. Bagaman mas karaniwang Tagalog ang simpleng “kinapopootan ni David,” mabubura roon ang kapansin-pansing idyoma ng Hebreo.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Kaya sinasabi nila
  rationale: Ipinahihiwatig nito ang isang kasabihan at pinananatiling di-tiyak ang tinutukoy ng panghalip, gaya ng nasa Hebreo.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: ang bulag at ang pilay
  rationale: Bagaman isahan ang anyo sa Hebreo, pangkalahatang uri ng tao ang tinutukoy sa kasabihan. Ang isahang anyo sa Tagalog ay natural ding makapagpahayag ng gayong pangkalahatang diwa.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: Hindi makapapasok sa bahay
  rationale: Ang “makapapasok” ay likas na salin ng pagpasok sa isang lugar. Ang בַּיִת ay maaaring karaniwang “bahay” o, sa konteksto, tirahang maharlika; pinananatili sa teksto ang mas malawak na “bahay” at inilalagay sa talababa ang “palasyo.”
theological_decisions:
- issue: Ang pagkapoot ni David sa “mga pilay at mga bulag”
  choice: Pinanatili ang mahirap na pananalita ng tekstong Masoretiko nang hindi ito pinalalambot o ginagawang pangkalahatang aral tungkol sa kapansanan.
  alternative: Unawain ang “mga pilay at mga bulag” bilang bahagi lamang ng panunuya ng mga Jebuseo sa naunang talata, o baguhin ang pangungusap upang huwag iugnay kay David ang pagkapoot.
  rationale: Mahirap at siksik ang sintaks ng Hebreo. Hindi dapat lutasin ng salin nang palihim ang tensiyon o palawakin ang talata tungo sa isang doktrina tungkol sa mga taong may kapansanan o sa pagpasok sa templo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan ang ginamit. Sadyang pinanatili ang putol at mahirap na anyo ng hamon ni David dahil gayon din ang Hebreo; hindi ito pinakinis sa paraang magpapasya sa isang di-tiyak na interpretasyon. Ang “kaluluwa ni David” ay bahagyang pormal ngunit pinili upang mapanatili ang idyoma at tindi ng orihinal.
