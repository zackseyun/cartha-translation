  to: At sinabi ni David noong araw na iyon, “Sinumang sumalakay sa mga Jebuseo at makarating sa lagusan ng tubig[a], at sa mga pilay at mga bulag, na kinapopootan ng kaluluwa ni David.”[b] Kaya sinasabi nila, “Hindi makapapasok sa bahay[c] ang bulag at ang pilay.”
