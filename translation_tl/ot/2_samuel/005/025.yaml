  text: וַ/יַּ֤עַשׂ דָּוִד֙ כֵּ֔ן כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָ֑ה וַ/יַּךְ֙ אֶת פְּלִשְׁתִּ֔ים מִ/גֶּ֖בַע עַד בֹּאֲ/ךָ֥ גָֽזֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: tl
  text: At ginawa iyon ni David, ayon mismo sa iniutos sa kanya ni Yahweh. Nilupig niya ang mga Filisteo mula sa Geba[a] hanggang sa Gezer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Geba” ang mababasa sa tekstong Hebreo. “Gibeon” o ibang pangalan ng lugar ang nasa ilang salin dahil sa mga pagsasaalang-alang sa tekstuwal na pagkakaiba o sa paralelong salaysay.
    reason: textual_variant
  - marker: b
    text: Sa literal, “hanggang sa pagdating mo sa Gezer,” na maaaring tumukoy sa paglapit o sa dakong malapit sa Gezer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: ginawa iyon
  rationale: Ang pariralang Hebreo ay tumutukoy sa pagsunod ni David sa naunang tagubilin. Likas sa modernong Tagalog ang “ginawa iyon” at hindi nito dinaragdagan ang bagay na hindi tahasang inuulit sa talata.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: ayon mismo sa iniutos sa kanya
  rationale: Ipinahahayag nito ang eksaktong pagtugon ni David sa naunang utos, habang natural at malinaw sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיַּךְ
  choice: nilupig
  rationale: Sa kontekstong militar, ang נכה ay maaaring tumukoy sa matagumpay na pananakit o pagkatalo sa kaaway. Ang “nilupig” ay malinaw at marangal na salin ng resulta ng labanan nang hindi gumagamit ng makalumang pananalita.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang modernong Tagalog na tawag sa pangkat-etnikong Philistine.
- source_word: מִגֶּבַע
  choice: mula sa Geba
  rationale: Sinusunod nito ang Masoretikong Teksto, na may pangalang Geba (גבע), kahit may ibang salin o paralelong teksto na nagbabanggit ng ibang lugar.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: hanggang sa Gezer
  rationale: Ang literal na “hanggang sa pagdating mo sa Gezer” ay isang heograpikong pahayag tungkol sa hangganan o dakong nilipol. Ang “hanggang sa Gezer” ay natural sa Tagalog, samantalang inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Paglalarawan sa pagsunod ni David sa utos ng Diyos
  choice: ayon mismo sa iniutos sa kanya
  alternative: gaya ng iniutos sa kanya
  rationale: Pinananatili ng “ayon mismo” ang diin ng כַּאֲשֶׁר sa pagtutugma ng ginawa ni David at ng utos, nang hindi nagdaragdag ng teolohikal na interpretasyon.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang transliterasyon ng personal na pangalan upang malinaw itong maiba sa titulong “Panginoon” at upang direktang katawanin ang tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyon” upang natural na tukuyin ang naunang utos, at “nilupig” para sa kontekstong militar. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinatalakay ng kani-kanilang talababa.
