base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: tl
  text: At lalo pang naging dakila si David[a], at si Yahweh, ang Diyos ng mga hukbo, ay kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patuloy na lumaki ang kanyang kadakilaan.” Gumagamit ang Hebreo ng isang pandiwang may kasamang infinitive absolute upang idiin ang patuloy na pagdami ng kanyang kadakilaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הָלוֹךְ וְגָדוֹל
  choice: patuloy na lumakas si David
  rationale: Ang pinagsamang pandiwang may hangganan at infinitive absolute, kasunod ng וְגָדוֹל, ay nagpapahayag ng tuloy-tuloy na pag-unlad sa kapangyarihan o kadakilaan. Natural sa modernong Tagalog ang “patuloy na lumakas” at angkop ito sa konteksto ng paghahari ni David.
- source_word: דָּוִד
  choice: David
  rationale: Ito ang karaniwang anyo ng pangalan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: ang Diyos ng mga hukbo
  rationale: Ang צְבָאוֹת ay tumutukoy sa mga hukbo o karamihan ng mga puwersa. Pinananatili ng “mga hukbo” ang lawak ng parirala nang hindi tinutukoy kung panlupa o makalangit ang mga ito.
- source_word: עִמּוֹ
  choice: ay kasama niya
  rationale: Tuwirang ipinahahayag nito ang presensya at pagsama ng Diyos kay David habang pinananatili ang panghalip ng Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang mismong ginagamit sa Hebreo; ang “Yahweh” ay transliterasyon na hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng צְבָאוֹת sa titulong אֱלֹהֵי צְבָאוֹת
  choice: Diyos ng mga hukbo
  alternative: Diyos ng mga hukbong makalangit
  rationale: Hindi nililinaw ng talata kung aling mga hukbo ang tinutukoy, kaya iniiwasang paliitin ang kahulugan sa mga hukbong makalangit lamang.
- issue: Uri ng paglago ni David
  choice: lumakas
  alternative: lalo pang naging dakila
  rationale: Sa konteksto ng paghahari, ang גָדֵל ay maaaring tumukoy sa paglawak ng kapangyarihan at katayuan. Ang “lumakas” ay natural at hindi nagpapahiwatig ng likas na moral na kadakilaan, samantalang itinatala sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “patuloy na lumakas” bilang natural na pagpapahayag ng progresibong idyomang Hebreo; pinanatili ang “Yahweh” at ang malawak na “Diyos ng mga hukbo.”
