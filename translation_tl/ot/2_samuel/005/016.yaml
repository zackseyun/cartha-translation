lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: at sina Elisama
  rationale: Isinalin ang pang-ugnay na ו bilang “at.” Ginamit ang “sina” bago ang magkakasunod na pangalan upang maging natural sa modernong Tagalog, at tinumbasan ang pangalang Hebreo ayon sa karaniwang baybay sa Filipino.
- source_word: וְ/אֶלְיָדָע
  choice: Eliada
  rationale: Ipinagpatuloy ang serye ng mga pangalang saklaw ng “sina”; pinanatili ang personal na pangalan sa anyong transliterado sa halip na isalin ang kahulugang etimolohikal nito.
- source_word: וֶ/אֱלִיפָלֶט
  choice: at Elifelet
  rationale: Isinalin ang huling ו bilang “at” upang malinaw at natural na tapusin ang talaan. Ang pangalang Hebreo ay isinatitik bilang “Elifelet,” alinsunod sa tunog at baybay na madaling basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli, dignified, at natural na modernong Filipino. Ginamit ang “sina” para sa talaan ng mga tao, habang pinanatili ang bawat pangalan bilang transliterasyon. Hindi isinama ang footnote ng English POB sapagkat tumutukoy iyon sa pagkakaiba ng mga baybay sa tradisyong Ingles at hindi mahalaga sa saling Filipino.
