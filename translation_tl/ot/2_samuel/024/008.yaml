  yaml_path: translation/ot/2_samuel/024/008.yaml
  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: tl
  text: Naglakbay sila sa buong lupain, at pagkalipas ng siyam na buwan at dalawampung araw, dumating sila sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: Naglakbay sila
  rationale: Ang pandiwang שׁוּט ay tumutukoy sa paggalaw o paglilibot sa isang malawak na lugar. Natural sa makabagong Tagalog ang “naglakbay” at hindi nito ipinahihiwatig na walang tiyak na layunin ang kanilang paglalakbay.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Ipinahahayag ng parirala ang paglalakbay sa kabuuan ng teritoryong tinutukoy. Ang “lupain” ay mas angkop kaysa “mundo” sa konteksto ng pagsisiyasat sa nasasakupan.
- source_word: וַיָּבֹאוּ
  choice: dumating sila
  rationale: Bagaman maaaring isaling “pumaroon” o “dumating” ang בוא, malinaw na destinasyon dito ang Jerusalem, kaya natural at eksakto ang “dumating sila.”
- source_word: מִקְצֵה
  choice: pagkalipas ng
  rationale: Sa pariralang tumutukoy sa panahon, ipinakikita nito ang punto kung kailan natapos ang itinakdang tagal. Ang “pagkalipas ng” ang pinakanatural na pahayag sa Tagalog.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: siyam na buwan at dalawampung araw
  rationale: Tuwirang inililipat nito ang tiyak na tagal sa natural na anyong Tagalog.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ginamit ang nakasanayang anyo ng pangalan ng lungsod sa Tagalog at sa mga salin ng Bibliya.
