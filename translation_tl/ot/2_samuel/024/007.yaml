translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang heograpiko at etniko sa mga anyong madaling makilala, at inilagay ang talababa sa “Negev,” ang salitang talagang may leksikal na alternatibo.
