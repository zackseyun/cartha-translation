base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: tl
  text: Dumating sila sa pinatibay na lunsod ng Tiro at sa lahat ng lunsod ng mga Hivita at mga Cananeo. At umalis sila patungo sa Negev[a] ng Juda, sa Beer-seba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “timog ng Juda.” Ang Hebreong negev ay maaaring tumukoy sa rehiyong tinatawag na Negev o, sa mas pangkalahatang diwa, sa katimugang bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: pinatibay na lunsod ng Tiro
  rationale: Ang מִבְצַר ay isang pinatibay na lugar o tanggulan. Sa pagkakatabi nito sa צֹר, natural itong tumutukoy sa pinatibay na lunsod na Tiro, nang hindi nililimitahan ang kahulugan sa iisang kuta lamang.
- source_word: וְכָל עָרֵי
  choice: at sa lahat ng lunsod ng
  rationale: Ipinagpapatuloy ng parirala ang mga destinasyong narating sa kanilang paglalakbay; ang “sa” ay likas na ipinahihiwatig ng naunang pandiwa ng pagdating.
- source_word: הַחִוִּי
  choice: mga Hivita
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat; ginawang maramihan dahil kolektibong tinutukoy ang kanilang mga lunsod.
- source_word: וְהַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat; ang maramihang anyo ay umaayon sa kolektibong pagtukoy sa mga lunsod.
- source_word: וַיֵּצְאוּ
  choice: Pagkatapos, nagtuloy sila
  rationale: Literal na nangangahulugang “lumabas” ang יצא, ngunit dito ay minamarkahan nito ang susunod na yugto ng ruta. Likas na naipahahayag ng “nagtuloy” ang pag-usad nang hindi binabago ang heograpikong pagkakasunod-sunod.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: sa Negev ng Juda
  rationale: Maaaring mangahulugan ang נֶגֶב ng “timog” o tumukoy sa rehiyong Negev. Sa heograpikong talaan ng ruta, pinananatili ng “Negev” ang posibleng gamit nito bilang pangalan ng rehiyon, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-seba
  rationale: Kinagawiang anyong Filipino ng pangalan ng lugar, na malinaw na nagpapanatili sa dalawang bahagi ng Hebreong pangalan.
