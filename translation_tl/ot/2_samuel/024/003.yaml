  terminology: Wasto at pare-pareho ang ‘Yahweh’ para sa יהוה, samantalang ang אֲדֹנִי ay ‘panginoon kong hari’; malinaw nitong pinaghihiwalay ang banal na pangalan at ang titulong panghukuman. Ang ‘bayan’ ay angkop para sa עָם, at ang ‘kinalulugdan’ ay tumpak para sa חָפֵץ.
