  source_fidelity: Tapat ang salin sa Hebreo. Naipapahayag ang salungat na tugon ni Joab, ang hiling na paramihin ni Yahweh ang bayan nang sandaang ulit, ang implicit na layon ng ‘makita,’ at ang mapanuring tanong tungkol sa nais ng hari. Hindi nito nililimitahan ang עָם sa hukbo.
