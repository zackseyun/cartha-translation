base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: tl
  text: Ngunit sinabi ni Joab sa hari, “Nawa’y paramihin ni Yahweh na iyong Diyos ang bayan nang sandaang ulit sa dami nila ngayon, at nawa’y makita iyon ng mga mata ng panginoon kong hari.[a] Ngunit bakit kinalulugdan ng panginoon kong hari ang bagay na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, walang tahasang layon ang “makita”; ang diwa ay hinihiling ni Joab na mabuhay ang hari upang masaksihan ang gayong pagdami.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng anyong pasalaysay ang salaysay, ngunit salungat ang tugon ni Joab sa utos ng hari kaya angkop ang “Ngunit.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang panlalaking pang-isahan; natural sa Filipino ang pariralang “Yahweh na iyong Diyos.”
- source_word: אֶל הָעָם
  choice: ang bayan
  rationale: Ang עָם ay malawak na tumutukoy sa bayan o sambayanan; hindi ito nililimitahan sa hukbo kahit census ang konteksto.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: nang sandaang ulit sa dami nila ngayon
  rationale: Likas na Filipino para sa idyomang humihiling na dumami ang bayan hanggang sandaang ulit ng kasalukuyang bilang.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: at nawa’y makita iyon ng mga mata ng panginoon kong hari
  rationale: Pinananatili ang kongkretong Hebreong “mga mata” at ang diwa ng hiling na masaksihan ng hari ang pagdami; tahasang inilagay ang likas na ipinahihiwatig na layon na “iyon.”
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Dignified at natural na pormula ng magalang na pagtukoy sa hari.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: kinalulugdan ... ang bagay na ito
  rationale: Malapit sa kahulugan ng חפץ na “malugod” o “masiyahan,” at hindi nito pinahihina ang mapanuring tanong ni Joab.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong אֲדֹנִי, na lumilitaw rin sa talata bilang “panginoon ko.”
- issue: Diwa ng וְעֵינֵי ... רֹאוֹת
  choice: Hiling na makita ng hari ang pagdami
  alternative: Pahayag na makikita pa iyon ng hari habang nabubuhay siya
  rationale: Ang kaugnayan sa naunang jussive ay sumusuporta sa diwa ng pagpapala o hiling, ngunit nananatiling implicit sa Hebreo ang layon ng “makita.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa עָם, “panginoon kong hari” para sa pormulang panghukuman, at “sandaang ulit sa dami nila ngayon” upang maipahayag nang natural ang Hebreong idyoma nang hindi nililimitahan ang tinutukoy sa hukbo.
