revisions:
- from: Ngunit sinabi ng hari kay Arauna, “Hindi! Talagang bibilhin ko ito sa iyo nang may bayad. Hindi ako maghahandog kay Yahweh na aking Diyos ng mga handog na sinusunog na wala akong ginastos.”[a] Kaya binili ni David ang giikan at ang mga baka[c] sa halagang limampung siklong pilak.[b]
  to: Ngunit sinabi ng hari kay Arauna, “Hindi; sa halip, talagang bibilhin ko ito mula sa iyo sa halagang babayaran. Hindi ako maghahandog kay Yahweh na aking Diyos ng mga handog na sinusunog na wala akong ginastos.”[a] Kaya binili ni David ang giikan at ang mga baka[c] sa halagang limampung siklong pilak.[b]
  rationale: Pinalitan ang “nang may bayad” ng “sa halagang babayaran” upang maipahayag nang mas tumpak ang komersiyal na diwa ng מְחִיר. Idinagdag ang “sa halip” upang maipakita ang puwersa ng לֹא כִּי bilang pagtanggi na sinusundan ng mariing alternatibong pasiya. Walang pagbabagong ginawa sa kahulugan, mga pangalan, terminolohiyang panghandog, o mga footnote anchor.
