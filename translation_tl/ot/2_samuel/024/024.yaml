base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: tl
  text: Ngunit sinabi ng hari kay Arauna, “Hindi; sa halip, talagang bibilhin ko ito mula sa iyo sa halagang babayaran. Hindi ako maghahandog kay Yahweh na aking Diyos ng mga handog na sinusunog na wala akong ginastos.”[a] Kaya binili ni David ang giikan at ang mga baka[c] sa halagang limampung siklong pilak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga handog na sinusunog nang walang bayad” o “mga handog na sinusunog na libre.”'
    reason: lexical_alternative
  - marker: b
    text: Sa 1 Cronica 21:25, nagbayad si David ng animnaraang siklong ginto para sa lugar; dito, ang tinukoy na limampung siklong pilak ay para sa giikan at sa mga baka.
    reason: cross_reference
  - marker: c
    text: Maaari ring isalin na “mga bakang lalaki.” Ang salitang Hebreo ay maaaring tumukoy sa mga baka bilang isang pangkat o, nang mas tiyak, sa mga bakang ginagamit sa paggawa o paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Isinatinig ang personal na pangalan ayon sa anyong Hebreo sa talatang ito; ang “Ornan” ay anyo sa kapantay na salaysay sa Mga Cronica.
- source_word: קָנוֹ אֶקְנֶה
  choice: Talagang bibilhin ko ito
  rationale: Ang infinitive absolute na kasunod ng pandiwang may takdang anyo ay nagbibigay-diin sa katiyakan ng pagbili. Likas na naihahayag ito sa Tagalog sa pamamagitan ng “talagang.” Ang “ito” ay ipinahihiwatig ng konteksto.
- source_word: בִּמְחִיר
  choice: nang may bayad
  rationale: Tumutukoy ang מְחִיר sa halaga o bayad sa pagbili. Likas sa modernong Tagalog ang “nang may bayad,” at malinaw nitong pinananatili ang kaibahan sa pagtanggap nang libre.
- source_word: לַיהוָה אֱלֹהַי
  choice: kay Yahweh na aking Diyos
  rationale: Pinananatili ang personal na pangalan ng Diyos at ang unang panauhang pag-aangkin ni David na “aking Diyos.”
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Ito ang handog na lubusang sinusunog sa altar; malinaw at kinikilalang katawagan sa modernong Tagalog ang napiling salin.
- source_word: חִנָּם
  choice: na wala akong ginastos
  rationale: Literal itong “nang walang bayad” o “libre.” Sa konteksto, tumatanggi si David na ihandog ang natanggap niya nang walang sariling gastos; ginagawang malinaw ng salin ang ipinahihiwatig nang hindi binabago ang punto.
- source_word: הַגֹּרֶן
  choice: ang giikan
  rationale: Karaniwang salitang Tagalog para sa patag na lugar na ginagamit sa paggiik.
- source_word: הַבָּקָר
  choice: ang mga baka
  rationale: Ang kolektibong terminong Hebreo ay maaaring tumukoy sa mga baka sa pangkalahatan o, nang mas tiyak, sa mga bakang pantrabaho at panghandog. Pinananatili ng “mga baka” ang mas malawak na diwa.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: sa halagang limampung siklong pilak
  rationale: Natural nitong ipinapahayag sa Tagalog ang halagang ibinayad habang pinananatili ang uri ng metal at yunit ng timbang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng mga handog na חִנָּם
  choice: mga handog na wala akong ginastos
  alternative: mga handog nang walang bayad; mga handog na libre
  rationale: Pinananatili nito ang diin na ayaw ni David maghandog ng isang bagay na hindi niya pinagbayaran, nang hindi nagpapahiwatig na ang handog ay nagkakaroon ng bisa dahil lamang sa halaga nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “giikan,” “mga handog na sinusunog,” at “siklo” bilang malinaw na katawagang biblikal. Iniwasan ang labis na pormal o makalumang ayos, at pinanatili ang mariing pagtanggi at pasiya ni David.
