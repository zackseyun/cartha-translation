base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: tl
  text: Muling nag-alab ang galit ni Yahweh laban sa Israel,[a] at inudyukan niya si David laban sa kanila, at sinabi niya, “Humayo ka at bilangin[b] ang Israel at Juda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinasabi sa 1 Cronica 21:1 na tumindig si Satanas laban sa Israel at inudyukan si David. Sinusunod ng pangunahing teksto rito ang payak na simuno ng Hebreo sa 2 Samuel at pinananatili ang tensiyon sa pagitan ng dalawang salaysay sa halip na pagtugmain ang mga ito.
    reason: cross_reference
  - marker: b
    text: O “numerohan” o “magsagawa ng senso sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַחֲרוֹת
  choice: Muling nag-alab
  rationale: Ipinahahayag ng וַיֹּסֶף ang muling pagkilos, at pinananatili ng “nag-alab” ang metapora ng חרה para sa nag-aapoy na galit sa natural na Filipino.
- source_word: אַף
  choice: ang galit
  rationale: Bagaman literal na maaaring tumukoy sa “ilong,” idyomatiko itong nangangahulugang galit; malinaw at pangkaraniwan ang “galit” sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa idyomang ito, ipinahahayag ng pang-ukol ang galit na nakatuon laban sa Israel.
- source_word: וַיָּסֶת
  choice: inudyukan niya
  rationale: Ang Hiphil ng סות ay nagpapahiwatig ng pag-uudyok o pagtulak sa isang kilos. Natural at malinaw sa Filipino ang “inudyukan.”
- source_word: בָּהֶם
  choice: laban sa kanila
  rationale: Mahirap ang parirala, ngunit sa konteksto ay pinakamalamang na inilalarawan nito ang pag-uudyok kay David na gumawa laban sa Israel sa pamamagitan ng sensus na hahantong sa kaparusahan.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang karaniwang gamit ng infinitive na nagpapakilala sa tuwirang pananalita.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang utos ito ng הלך. Ang “Humayo ka” ay marangal at malinaw, bagaman bahagyang mataas ang rehistro.
- source_word: מְנֵה
  choice: bilangin
  rationale: Tuwirang kahulugan ng מנה ang pagbibilang o pagnunumero; hindi agad ipinapasok sa pangunahing teksto ang mas interpretatibong “magsagawa ng sensus.”
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: ang Israel at Juda
  rationale: Pinananatili ang dalawang pangalang heograpiko-pampolitika nang walang paliwanag na wala sa Hebreo.
theological_decisions:
- issue: Ang banal na ahensiya sa pag-uudyok kay David kumpara sa 1 Cronica 21:1
  choice: inudyukan niya si David
  alternative: inudyukan si David ng isa; o inudyukan ni Satanas si David
  rationale: Ang pinaka-natural na simuno ng וַיָּסֶת ay ang naunang simuno, si Yahweh. Pinananatili ng salin ang tensiyon sa parallel na salaysay sa 1 Cronica sa halip na tahimik itong pagtugmain.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nag-alab” upang mapanatili ang buhay na metapora ng Hebreo. Ang “Humayo ka” ay bahagyang pormal ngunit angkop sa utos sa salaysay. Dapat itama sa publikasyon ang anyong “numero-han” sa talababa bilang “numerohan” kung normalisado ang baybay.
