  to: '“Humayo ka at kausapin mo si David, ‘Ganito ang sabi ni Yahweh: Tatlo ang inilalagay ko sa harap mo.[a] Pumili ka para sa iyong sarili ng isa sa mga iyon, at gagawin ko iyon sa iyo.’”'
