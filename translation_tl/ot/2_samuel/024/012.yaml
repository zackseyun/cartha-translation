base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: tl
  text: '“Humayo ka at kausapin mo si David, ‘Ganito ang sabi ni Yahweh: Tatlo ang inilalagay ko sa harap mo.[a] Pumili ka para sa iyong sarili ng isa sa mga iyon, at gagawin ko iyon sa iyo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlo” lamang; ipinahihiwatig ng konteksto ang pangngalan. Maaari ring isalin na “tatlong bagay” o “tatlong pagpipilian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: Humayo ka at sabihin mo
  rationale: Ipinahahayag ang mariing utos at sunod na kilos sa likas ngunit marangal na modernong Tagalog.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormal na pormula ng mensaherong propetiko at ang tahasang banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: שָׁלֹשׁ
  choice: Tatlo
  rationale: Walang kasamang pangngalan ang bilang sa Hebreo; kayang panatilihin ng Tagalog ang gayong likas na kawalang-tiyak nang hindi nagdaragdag ng ‘bagay’ o ‘pagpipilian.’
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: ang inilalagay ko sa harap mo
  rationale: Sa konteksto ng pagpili, natural nitong ipinahahayag ang paghaharap ng tatlong posibilidad habang hindi ginagawang mismong parusa ang lahat ng tatlo.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: Pumili ka para sa iyong sarili ng isa sa mga iyon
  rationale: Pinananatili ang pandiwang ‘pumili,’ ang etikong datibo na nagbibigay-diin sa personal na pananagutan ni David, at ang partitive na ‘isa sa mga iyon.’
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: at gagawin ko iyon sa iyo
  rationale: Ipinahahayag ang di-kanais-nais na diwa ng לְךָ sa konteksto ng hatol nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang ginagamit ng Hebreo; pinananatili itong transliterado at hindi pinapalitan ng titulo.
- issue: Kung ang tatlo ay tatawaging mga bagay, pagpipilian, o parusa
  choice: Panatilihin ang payak na ‘Tatlo’ at ipaliwanag sa talababa
  alternative: tatlong bagay / tatlong pagpipilian / tatlong parusa
  rationale: Walang pangngalan sa Hebreo. Ang pagdaragdag ng ‘pagpipilian’ o ‘parusa’ ay maaaring maagang magpasya sa ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘Humayo’ upang mapanatili ang solemneng himig ng banal na utos, samantalang ang natitirang pangungusap ay likas sa kasalukuyang gamit. Ang panandang [a] ay inilagay agad pagkatapos ng sugnay na may ipinahihiwatig na pangngalan.
