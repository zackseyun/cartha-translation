  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: tl
  text: Pumunta si Gad kay David at sinabi sa kanya, “Darating ba sa iyo ang pitong taon ng taggutom sa iyong lupain?[a] O tatakas ka ba nang tatlong buwan sa harap ng iyong mga kaaway[b] habang hinahabol ka nila? O magkakaroon ba ng tatlong araw na salot[c] sa iyong lupain? Ngayon, pag-isipan mong mabuti kung anong sagot ang ibabalik ko sa nagsugo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na salaysay sa 1 Cronica 21:12, “tatlong taon ng taggutom” ang mababasa sa halip na “pitong taon.”
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “mga kalaban.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “epidemya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Karaniwang pandiwa ng paglapit sa salaysay; natural sa Filipino para sa pagpunta ni Gad kay David.
- source_word: וַיַּגֶּד
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat; simple at natural ang “sinabi” sa konteksto.
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: pitong taon ng taggutom
  rationale: Ang רָעָב ay malawakang kakulangan sa pagkain, kaya “taggutom” ang tiyak at karaniwang katumbas.
- source_word: בְּאַרְצֶךָ
  choice: sa iyong lupain
  rationale: Tumutukoy sa teritoryong pinamumunuan ni David, hindi sa buong daigdig.
- source_word: אִם שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: O tatlong buwan kang tatakas sa harap ng iyong mga kaaway
  rationale: Pinananatili ang eliptikong anyo ng tatlong pagpipilian habang malinaw na si David at ang kanyang nasasakupan ang tatakas.
- source_word: צָרֶיךָ
  choice: iyong mga kaaway
  rationale: Natural at malinaw na salin ng צַר bilang mga kalabang nagbabanta.
- source_word: וְהוּא רֹדְפֶךָ
  choice: habang hinahabol ka nila
  rationale: Bagaman isahan ang panghalip sa Hebreo, kolektibo ang tinutukoy nitong naunang maramihang “mga kaaway”; natural sa Filipino ang maramihang panghalip.
- source_word: דֶּבֶר
  choice: salot
  rationale: Ang salita ay tumutukoy sa nakamamatay at lumalaganap na sakit; maikli, marangal, at pamilyar ang “salot.”
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Ngayon, pag-isipan mong mabuti
  rationale: Idyomatikong ipinapahayag sa Filipino ang magkaugnay na utos na alamin, tingnan, at timbangin ang pasiya.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: kung anong sagot ang ibabalik ko sa nagsugo sa akin
  rationale: Ang השיב דבר ay idyoma para sa pagbabalik ng sagot; malinaw at natural ito sa modernong Filipino.
theological_decisions:
- issue: Pagkakaiba ng bilang sa katumbas na salaysay sa 1 Cronica 21:12
  choice: “pitong taon ng taggutom” sa pangunahing teksto
  alternative: “tatlong taon ng taggutom” ayon sa 1 Cronica 21:12
  rationale: Pitong taon ang mababasa sa ibinigay na Masoretikong teksto ng 2 Samuel. Hindi ito tahimik na itinugma sa Cronica; inilalahad sa talababa ang pagkakaiba upang mapanatili ang tekstuwal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “taggutom,” “mga kaaway,” at “salot” bilang mga salitang madaling maunawaan ng karaniwang mambabasa. Ang “pag-isipan mong mabuti” ay optimal-equivalence na salin ng literal na pares na “alamin at tingnan,” sapagkat ang konteksto ay humihingi ng maingat na pagpapasiya.
