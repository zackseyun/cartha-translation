- from: Kaya pumunta si Gad kay David at sinabi sa kanya, “Darating ba sa iyong lupain ang pitong taon ng taggutom?[a] O tatlong buwan kang tatakas sa harap ng iyong mga kaaway[b] habang hinahabol ka nila? O magkakaroon ng tatlong araw na salot[c] sa iyong lupain? Ngayon, pag-isipan mong mabuti kung anong sagot ang ibabalik ko sa nagsugo sa akin.”
  to: Pumunta si Gad kay David at sinabi sa kanya, “Darating ba sa iyo ang pitong taon ng taggutom sa iyong lupain?[a] O tatakas ka ba nang tatlong buwan sa harap ng iyong mga kaaway[b] habang hinahabol ka nila? O magkakaroon ba ng tatlong araw na salot[c] sa iyong lupain? Ngayon, pag-isipan mong mabuti kung anong sagot ang ibabalik ko sa nagsugo sa akin.”
