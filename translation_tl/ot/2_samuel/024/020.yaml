base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: tl
  text: Dumungaw si Arauna at nakita niya ang hari at ang mga lingkod ng hari na papalapit sa kanya.[a] Kaya lumabas si Arauna at nagpatirapa sa harap ng hari, na nakasubsob ang mukha sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na dumaraan sa tabi niya” o “na papunta sa kanya.” Literal na inilalarawan ng pariralang Hebreo ang pagkilos ng hari at ng kanyang mga lingkod kaugnay ni Arauna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: Dumungaw
  rationale: Ipinahihiwatig ng pandiwa ang pagtingin mula sa isang puwesto o bukasan; natural at mas tiyak ang “dumungaw” kaysa simpleng “tumingin.”
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Tuwirang inilalarawan ang sumunod na pagkakita matapos dumungaw, ayon sa daloy ng salaysay sa Hebreo.
- source_word: עֲבָדָיו
  choice: ang mga lingkod nito
  rationale: Ang עבד sa kontekstong maharlika ay maaaring tumukoy sa mga lingkod o tagapaglingkod ng hari. Pinananatili ng “mga lingkod” ang malawak at tuwirang kahulugan.
- source_word: עֹבְרִים עָלָיו
  choice: na papalapit sa kanya
  rationale: Ang parirala ay literal na nagsasaad ng pagkilos ng hari at ng kanyang mga lingkod kaugnay ni Arauna. Sa konteksto ng kanilang pagdating sa giikan, malinaw at natural ang “papalapit sa kanya,” habang kinikilala sa talababa ang ibang posibleng pagbasa.
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang katumbas ito ng יצא at umaangkop sa tagpong dumungaw muna si Arauna mula sa kanyang kinaroroonan.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Ipinapahayag nito ang pisikal na pagpapatirapa o pagbibigay-galang nang hindi ipinahihiwatig na sumamba si Arauna sa hari bilang Diyos.
- source_word: אַפָּיו אָרְצָה
  choice: na ang mukha ay nakadikit sa lupa
  rationale: Natural na ipinapahayag sa Filipino ang ganap na pagpapatirapang inilalarawan ng idyomang Hebreo na nakaharap sa lupa.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Transliterasyon ito ng anyo ng pangalan sa Hebreong teksto ng Samuel; hindi ipinapalit ang “Ornan” mula sa katulad na salaysay sa Mga Cronica.
theological_decisions:
- issue: Ang uri ng kilos ni Arauna sa harap ng hari
  choice: Pagyukod o pagpapatirapa bilang paggalang sa isang taong hari
  alternative: Pagsamba sa hari
  rationale: Maaaring tumukoy ang pandiwang Hebreo sa pagsamba o sa pagpapatirapa bilang paggalang. Dahil tao at hari si David sa tagpong ito, pinili ang “yumukod” upang ilarawan ang kilos nang hindi ipinapasok ang kahulugang pagsambang ukol sa Diyos.
translation_notes:
  register: Makabagong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “nito” para sa pag-aari ng haring kababanggit lamang at “kanya” para kay Arauna, upang mabawasan ang kalabuan ng mga panghalip. Pinanatili sa talababa ang tunay na saklaw ng kahulugan ng עֹבְרִים עָלָיו.
