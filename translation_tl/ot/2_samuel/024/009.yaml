base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: tl
  text: Ibinigay ni Joab sa hari ang bilang ng pagpapatala sa bayan. Sa Israel ay may walong daang libong magigiting na lalaking humuhugot ng tabak[a], at ang mga lalaki ng Juda ay limang daang libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Iba ang mga kabuuang bilang sa katumbas na salaysay sa 1 Cronica 21:5: 1,100,000 sa Israel at 470,000 sa Juda. Sinusunod dito ng salin ang tekstong Hebreo ng 2 Samuel at hindi pinagpapareho ang mga bilang.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: ang bilang mula sa pagpapatala sa mga tao
  rationale: Pinananatili nito ang diwa ng bilang na nakuha sa opisyal na pagbibilang o pagpapatala, sa natural na modernong Tagalog.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: Sa Israel ay may
  rationale: Natural itong paraan sa Tagalog upang ipakilala ang kabuuang bilang, samantalang nananatiling malinaw na ang bilang ay para sa Israel.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: walong daang libo
  rationale: Tuwirang salin ng bilang sa tekstong Hebreo.
- source_word: אִישׁ חַיִל
  choice: magigiting na mandirigma
  rationale: Sa konteksto ng militar na pagpapatala, tumutukoy ang parirala sa mga lalaking may lakas at kakayahang lumaban; pinananatili ng 'magigiting' ang diwa ng tapang at ng 'mandirigma' ang kontekstong militar.
- source_word: שֹׁלֵף חֶרֶב
  choice: humahawak ng tabak
  rationale: Pinananatili ang kongkretong larawang militar ng idyomang literal na 'humuhugot ng tabak,' ngunit ang 'humahawak ng tabak' ay mas natural bilang paglalarawan sa mga nasasandatahang mandirigma sa Tagalog.
- source_word: וְאִישׁ יְהוּדָה
  choice: at sa Juda ay may
  rationale: Ipinahahayag ang kolektibong kahulugan ng anyong isahan na אִישׁ at iniiwasan ang di-natural na literal na 'lalaki ng Juda.'
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: limang daang libong lalaki
  rationale: Tuwirang inilalahad ang bilang at pinananatili ang tahasang אִישׁ bilang 'lalaki.'
theological_decisions:
- issue: Pagkakaiba ng mga bilang sa katumbas na salaysay sa 1 Cronica 21:5
  choice: 'Sinunod ang tekstong Masoretiko ng 2 Samuel: 800,000 sa Israel at 500,000 sa Juda.'
  alternative: Itugma ang mga bilang sa 1 Cronica 21:5, o ipaliwanag ang pagkakaiba bilang magkaibang pagsasama o pagbubukod ng mga hukbo.
  rationale: Hindi dapat lutasin sa mismong salin ang pagkakaibang tekstuwal o historikal sa pamamagitan ng haka-hakang pagtutugma. Inilalahad ng pangunahing teksto ang mga bilang sa Hebreo ng 2 Samuel, at binabanggit sa talababa ang paralelo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pagpapatala' sa halip na mas teknikal na 'senso,' at inayos ang pangungusap sa likas na hulma ng Tagalog habang pinananatili ang nilalaman at tensiyon ng tekstong Hebreo.
