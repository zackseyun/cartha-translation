revisions:
- from: Doon ay nagtayo si David ng isang altar para kay Yahweh at naghandog ng mga handog na sinusunog at mga handog para sa kapayapaan.[a] Kaya tumugon nang may pagsang-ayon si Yahweh sa pagsusumamo para sa lupain,[b] at napigil ang salot sa Israel.
  to: Doon ay nagtayo si David ng isang altar para kay Yahweh at naghandog ng mga handog na sinusunog at mga handog pangkapayapaan.[a] Kaya tumugon nang may pagsang-ayon si Yahweh sa pagsusumamo para sa lupain,[b] at napigil ang salot mula sa Israel.
  rationale: Binago ang pangwakas na parirala upang malinaw na maipahayag na ang salot ay napigil mula sa Israel. Pinalitan din ang katawagan sa שְׁלָמִים ng mas natural at mas teknikal na 'mga handog pangkapayapaan.' Pinanatili ang maingat na pagpapahayag ng paborableng pagtugon ni Yahweh sa pagsusumamo, dahil ang diwang ito ay nakapaloob sa pandiwang Hebreo ngunit ang nagsumamo ay hindi tahasang tinutukoy.
