base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: tl
  text: Doon ay nagtayo si David ng isang altar para kay Yahweh at naghandog ng mga handog na sinusunog at mga handog pangkapayapaan.[a] Kaya tumugon nang may pagsang-ayon si Yahweh sa pagsusumamo para sa lupain,[b] at napigil ang salot mula sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog ng pakikipagkaisa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang parirala ay maaaring isaling “tumugon nang may pagsang-ayon si Yahweh ukol sa lupain” o “dininig ni Yahweh ang panalangin para sa lupain.” Hindi tahasang binabanggit dito kung sino ang nagsumamo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Doon ay nagtayo
  rationale: Likas at tuwirang salin ng lokatibong שָׁם at ng pandiwang בנה sa salaysay.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: isang altar para kay Yahweh
  rationale: Ang ל־ ay nagpapahiwatig ng pag-aalay o pagtatalaga ng altar kay YHWH; pinanatili ang pangalang Yahweh.
- source_word: וַיַּעַל עֹלוֹת
  choice: naghandog ng mga handog na sinusunog
  rationale: Ang עלה kasama ng עֹלוֹת ay sakripisyal na idyoma; malinaw sa modernong Filipino ang pariralang ito at pinananatili ang uri ng handog.
- source_word: וּשְׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili ang tradisyonal na ugnayan sa שָׁלוֹם habang inilalagay sa anyong mas natural sa Filipino; ang 'mga handog ng pakikipagkaisa' ay ibinigay bilang alternatibo sa talababa.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: tumugon nang may pagsang-ayon si Yahweh sa pagsusumamo para sa lupain
  rationale: Ang Niphal ng עתר ay naglalaman ng diwang tumugon nang pabor sa pagsusumamo, bagaman hindi tahasang binanggit sa Hebreo kung sino ang nagsumamo. Ang לָאָרֶץ ay inunawang ukol sa o para sa lupain.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: napigil ang salot sa Israel
  rationale: Pinananatili ng 'napigil' ang pasibong diwa ng Niphal עצר; natural na ipinahahayag ng 'sa Israel' ang pag-alis o pagpigil sa salot na nasa bayan.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang pangalan ang יְהוָה sa tekstong Hebreo; ang 'Yahweh' ay malinaw na transliterasyon at hindi pinapalitan ng titulo.
- issue: Kahulugan ng וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: tumugon nang may pagsang-ayon si Yahweh sa pagsusumamo para sa lupain
  alternative: dininig ni Yahweh ang panalangin para sa lupain / nahikayat si Yahweh alang-alang sa lupain
  rationale: Ipinahahayag ang paborableng pagtugon na nakapaloob sa pandiwa ngunit hindi tinutukoy kung kaninong pagsusumamo iyon o kung anong eksaktong teolohikal na mekanismo ang sangkot.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyong biblikal na 'altar,' 'handog,' at 'salot,' at iniwasan ang sobrang teknikal o makalumang pananalita.
