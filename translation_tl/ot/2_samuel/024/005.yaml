base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: tl
  text: Tumawid sila sa Jordan at nagkampo sa Aroer, sa gawing kanan ng lungsod[a] na nasa gitna ng lambak[b] ng Gad, at patungo sa Jazer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa kanan ng lungsod.” Nauunawaan ito ng ilang tagapagpaliwanag bilang “sa timog ng lungsod” batay sa heograpikong paggamit, ngunit pinananatili sa teksto ang literal na oryentasyon.
    reason: lexical_alternative
  - marker: b
    text: O “wadi,” “bangin,” o “pana-panahong daluyan ng tubig.” Maaaring tumukoy ang salitang Hebreo sa lambak, bangin, o daluyang karaniwang tuyo maliban sa ilang panahon.
    reason: lexical_alternative
  - marker: c
    text: O “at sa Jazer.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang direksiyon patungo sa isang lugar o ang pagpunta roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: Tumawid sila sa Jordan
  rationale: Ang Qal wayyiqtol ng עבר na may tuwirang layong Jordan ay likas na tumutukoy sa pagtawid sa ilog. Karaniwan at malinaw sa Filipino ang “tumawid sa Jordan.”
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: at nagkampo sa Aroer
  rationale: Ang חנה ay nangangahulugang humimpil o magtayo ng kampo; ang “nagkampo” ay natural na makabagong Filipino. Ang ב sa pangalan ng lugar ay angkop na isalin na “sa.”
- source_word: יְמִין הָעִיר
  choice: sa kanan ng lungsod
  rationale: Ang ימין ay literal na “kanan” o “kanang bahagi.” Pinananatili ng salin ang mismong oryentasyong spatial sa halip na ipakahulugang “timog,” na hindi tahasang sinasabi ng Hebreo.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: na nasa gitna ng lambak ng Gad
  rationale: Ang relative clause ay tumutukoy sa lungsod. Malawak ang saklaw ng נחל—lambak, bangin, wadi, o tuyong ilug-ilugan—kaya ginamit ang madaling maunawaang “lambak” at inilagay sa talababa ang alternatibo.
- source_word: וְאֶל יַעְזֵר
  choice: at patungo sa Jazer
  rationale: Ang אֶל ay maaaring mangahulugang “sa” o “patungo sa.” Pinananatili ng “patungo sa” ang direksiyon nang hindi ipinapalagay na tahasang sinasabi ng talata ang pagdating sa Jazer.
