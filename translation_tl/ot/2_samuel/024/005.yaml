translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “sa kanan ng lungsod” upang hindi tahimik na gawing “sa timog ng lungsod” ang posibleng heograpikong pahiwatig. Ang ayos ng pangungusap ay malapit sa Hebreo ngunit natural pa rin sa salaysay na Filipino.
