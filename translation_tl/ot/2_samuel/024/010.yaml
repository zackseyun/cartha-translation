reference: 2 Samuel 24:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: tl
  text: Pagkatapos bilangin ni David ang bayan[a], inusig siya ng kanyang budhi.[b] Sinabi ni David kay Yahweh, “Nagkasala ako nang malubha sa ginawa ko. Ngayon, Yahweh, pakiusap, alisin mo ang sala ng iyong lingkod,[c] sapagkat kumilos ako nang napakahangal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itala sa bilang ang bayan” o “magsagawa ng sensus sa bayan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hinampas siya ng puso ni David,” isang idyoma na nagpapahayag na lubha siyang binagabag o inusig ng kanyang budhi.
    reason: cultural_note
  - marker: c
    text: Maaari ring “kasamaan” o “pagkakasala”; ang salitang Hebreo ay maaari ring tumukoy sa kaparusahang bunga ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: inusig siya ng kanyang budhi
  rationale: Ang literal na larawan ay ‘hinampas siya ng puso ni David,’ isang idyoma para sa matinding pagkabagabag o pag-uusig ng budhi. Likas at malinaw sa modernong Tagalog ang napiling salin, habang inilalahad sa talababa ang larawang Hebreo.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: Pagkatapos bilangin ni David ang bayan
  rationale: 'Ipinapakita nito ang pagkakasunod ng mga pangyayari: nangyari ang pag-uusig ng budhi matapos bilangin ni David ang bayan. Ang ‘bilangin’ ay malapit sa pandiwang Hebreo at hindi kasing-interpretibo ng ‘magsagawa ng sensus.’'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: חָטָאתִי מְאֹד
  choice: Nagkasala ako nang malubha
  rationale: Malinaw nitong pinananatili ang pagtatapat ng kasalanan at ang diin ng מְאֹד, sa natural at marangal na Tagalog.
- source_word: הַעֲבֶר נָא
  choice: pakiusap, alisin mo
  rationale: Sa konteksto, ang causative na anyo ng עבר ay humihiling na alisin o palampasin ang sala. Ang ‘pakiusap, alisin mo’ ay malinaw at pinananatili ang mapagpakumbabang pakiusap ng נָא.
- source_word: עֲוֺן עַבְדְּךָ
  choice: ang sala ng iyong lingkod
  rationale: Ang ‘sala’ ay maaaring tumukoy sa moral na kasamaan o pagkakasalang taglay ng nagkasala. Pinananatili nito ang lawak ng עָוֹן nang hindi nililimitahan agad sa kaparusahan.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: sapagkat kumilos ako nang napakahangal
  rationale: Ipinahahayag ng pandiwa ang hangal o walang-muwang na pagkilos, at pinananatili ng ‘napakahangal’ ang matinding diin ng מְאֹד.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa talata ang personal na banal na pangalan. Ang ‘Yahweh’ ay transliterasyon na hindi nagpapalit sa pangalan ng isang titulo.
- issue: Kahulugan ng עָוֹן sa pakiusap ni David
  choice: sala
  alternative: kasamaan, pagkakasala, o kaparusahan
  rationale: Maaaring tumukoy ang salitang Hebreo sa kasamaan, sa kalagayan ng pagiging may-sala, o sa bunga at kaparusahan nito. Ang ‘sala’ ay angkop sa pakiusap na alisin ito at hindi lubusang nagsasara sa magkakaugnay na kahulugang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang natural na idyomang “inusig siya ng kanyang budhi” sa pangunahing teksto, at pinanatili sa talababa ang literal na larawang Hebreo. Ang “bayan” ay mas angkop kaysa “mga tao” para sa kolektibong Israel sa kontekstong ito.
