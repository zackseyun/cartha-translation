base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: tl
  text: Sinabi ni Arauna, “Bakit naparito ang panginoon kong hari sa kanyang lingkod?[a]” Sumagot si David, “Upang bilhin mula sa iyo ang lugar ng giikan at magtayo ng altar para kay Yahweh, upang matigil ang salot sa bayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong lingkod.” Literal na “kanyang lingkod” ang Hebreo, isang pormal at mapagpakumbabang paraan ng pagtukoy ni Arauna sa kanyang sarili sa harap ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ בָּא
  choice: Bakit naparito
  rationale: Natural na modernong Tagalog para sa tuwirang tanong tungkol sa dahilan ng pagdating; ipinahihiwatig ng “naparito” ang pagdating sa kinaroroonan ng nagsasalita.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Pinananatili ang magalang at pormal na pagtukoy kay David bilang nakatataas at hari.
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Tapat sa ikatlong panauhang anyo ng Hebreo at sa pormal na pananalita sa maharlikang hukuman; nilagyan ng talababa dahil mas karaniwan sa Tagalog ang “inyong lingkod.”
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: bilhin sa iyo ang giikan
  rationale: Ang “giikan” ay maikli at karaniwang salin ng lugar na ginagamit sa paggiik; malinaw sa “bilhin sa iyo” ang transaksiyon.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: magtayo ng altar
  rationale: Natural at malinaw na pariralang Tagalog para sa pagtatayo ng dambanang paghahandugan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh para sa Tetragrammaton; ang “para kay” ay natural sa altar na itinatalaga sa kanya.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: nang sa gayon ay matigil ang salot na nagpapahirap sa bayan
  rationale: Pinananatili ng “nang sa gayon” ang layunin o inaasahang resulta at ng “matigil” ang pasibong diwa. Ang idyomang מֵעַל הָעָם ay isinalin ayon sa diwang ang salot ay nakaatang at nagpapahirap sa bayan, sa halip na gayahin ang hindi natural na hulma sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito nang hindi ito pinapalitan ng isang titulo.
- issue: Lakas ng pahayag tungkol sa pagtigil ng salot
  choice: nang sa gayon ay matigil
  alternative: at titigil
  rationale: Ipinapahayag ng sugnay ang layunin o inaasahang bunga ng pagtatayo ng altar, hindi isang tahasang walang-pasubaling katiyakan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na pananalita ni Arauna, ngunit ginawang natural ang huling idyomang Hebreo. Ang marker na [a] ay inilagay mismo sa pangunahing teksto.
