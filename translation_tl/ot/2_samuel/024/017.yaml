base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: tl
  text: Nang makita ni David ang anghel na pumapatay sa bayan, sinabi niya sa PANGINOON, “Tingnan mo, nagkasala ako at gumawa ako ng masama. Ngunit ang mga tupang ito—ano ang ginawa nila? Nawa’y ang iyong kamay ay laban sa akin at sa sambahayan ng aking ama.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Sinusunod ang nakaugaliang marangal na salin ng banal na pangalan sa Tagalog, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- source_word: הַמַּלְאָךְ הַמַּכֶּה בָעָם
  choice: ang anghel na pumapatay sa bayan
  rationale: Ang participle na מַכֶּה ay tumutukoy sa aktuwal na nakamamatay na salot sa konteksto, kaya mas tiyak ang “pumapatay” kaysa sa pangkalahatang “humahampas.”
- source_word: הִנֵּה אָנֹכִי
  choice: Ako ang
  rationale: Likas na naipahahayag sa Tagalog ang diin ng הִנֵּה at dobleng tahasang panghalip sa pamamagitan ng “Ako ang,” sa halip na literal ngunit alanganing “Narito, ako.”
- source_word: הֶעֱוֵיתִי
  choice: gumawa ng masama
  rationale: Pinananatili ang pagkakaiba nito sa “nagkasala” at ipinahahayag ang moral na kamalian nang natural sa modernong Tagalog.
- source_word: הַצֹּאן
  choice: mga tupang ito
  rationale: Pinananatili ang metaporikal na pagtukoy ni David sa bayan bilang mga tupa.
- source_word: יָדְךָ
  choice: parusahan mo
  rationale: Sa konteksto, ang “kamay” ng Diyos ay metonimiya para sa salot o kaparusahan. Ang pandiwang pahayag ay mas natural at malinaw sa Tagalog.
- source_word: בְבֵית אָבִי
  choice: ang sambahayan ng aking ama
  rationale: Ang בֵּית אָבִי ay mas malawak kaysa gusali at tumutukoy sa pamilya o angkan ng ama; “sambahayan” ang maikli at angkop na katumbas.
theological_decisions:
- issue: Pananagutan ni David at pagdurusa ng bayan
  choice: Pinananatili ang tahasang pag-ako ni David ng kasalanan at ang kaniyang pakiusap na sa kaniya at sa sambahayan ng kaniyang ama ibaling ang kaparusahan.
  alternative: Ipaliwanag o bigyang-katwiran kung bakit nagdusa ang bayan.
  rationale: Hindi nilulutas ng talata ang teolohikal na tensiyon; dapat panatilihin ang mismong pananalita at pakiusap ni David nang walang idinagdag na paliwanag.
- issue: Metapora ng mga tupa
  choice: “mga tupang ito”
  alternative: “mga taong ito”
  rationale: Mahalaga ang pastoral na larawan sa Hebreo at hindi ito dapat gawing tahasang paliwanag lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עָם, “nakikiusap ako” para sa magalang at mariing נָא, at natural na ayos ng pangungusap habang pinananatili ang diin, metapora, at teolohikal na tensiyon ng Hebreo.
