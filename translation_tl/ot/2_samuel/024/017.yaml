  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: nakita ni David ang anghel na nananakit sa bayan, inako niya ang kasalanan, tinukoy ang bayan bilang mga tupa, at hiniling na sa kaniya at sa sambahayan ng kaniyang ama ibaling ang kaparusahan. Gayunman, ang “parusahan mo” ay nagpapalit sa literal na metonimiyang “ang iyong kamay ay laban sa” at bahagyang pinasisikip ang pahayag. Ang “Ako ang” at “ako ... ang” ay maaari ring magpahiwatig ng eksklusibong pagtutok na hindi tahasang isinasaad ng Hebreo, kahit may diin ang mga panghalip doon.'
