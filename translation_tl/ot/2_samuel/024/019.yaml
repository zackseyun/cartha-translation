  text: וַ/יַּ֤עַל דָּוִד֙ כִּ/דְבַר גָּ֔ד כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: tl
  text: Kaya umakyat si David ayon sa sinabi ni Gad, gaya ng iniutos ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili nito ang direksiyonal na diwa ng pandiwang עלה, ‘umakyat,’ sa natural at tuwirang Tagalog.
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalan sa Tagalog.
- source_word: כִּדְבַר
  choice: ayon sa sinabi ni
  rationale: Ang כ + דבר ay tumutukoy sa pagsunod sa salita o mensahe ni Gad. Mas natural sa modernong Tagalog ang ‘ayon sa sinabi ni’ kaysa sa literal na ‘ayon sa salita ni,’ habang pinananatili ang diwa ng pahayag na sinunod.
- source_word: גָּד
  choice: Gad
  rationale: Karaniwang transliterasyon ng pangalan ng propeta.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinapahayag nito ang pagtutugma ng sinabi ni Gad at ng utos ni Yahweh nang hindi nagpapabigat sa pangungusap.
- source_word: צִוָּה
  choice: iniutos
  rationale: Tuwirang ipinapahayag ang kahulugan ng צוה na ‘mag-utos.’ Nauunawaan sa konteksto na nauna ang utos ni Yahweh sa pag-akyat ni David, kaya hindi kailangan ng tahasang katumbas ng English past perfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang ‘Yahweh’ ay nagpapangalan sa halip na maghalili ng titulo, nang hindi nagdaragdag ng sektaryong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang ‘sinabi’ bilang natural na katumbas ng idiomatikong ‘salita ni Gad,’ at pinanatili ang ‘umakyat’ upang hindi mawala ang heograpikal na direksiyon.
