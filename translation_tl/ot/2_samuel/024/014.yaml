id: 2SA.24.14
reference: 2 Samuel 24:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: tl
  text: Sinabi ni David kay Gad, “Labis ang aking kagipitan. Mahulog nawa tayo sa kamay ni Yahweh, sapagkat napakarami ng kanyang mga habag[a]; ngunit huwag nawa akong mahulog sa kamay ng tao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sapagkat sagana ang kanyang habag.” Literal sa Hebreo, “sapagkat marami ang kanyang mga habag.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kamay ng tao”; ibig sabihin, sa ilalim ng kapangyarihan o pamamahala ng tao.
    reason: idiom_explanation
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Labis ang aking kagipitan
  rationale: Ipinahahayag ng pang-uring צַר kasama ng לִי ang matinding personal na pagkabalisa at gipit na kalagayan. Likas at marangal sa Filipino ang “Labis ang aking kagipitan” at hindi nito dinaragdagan ang diwa.
- source_word: נִפְּלָה נָּא
  choice: Mahulog nawa tayo
  rationale: Ang cohortative na nasa unang panauhang maramihan ay nagpapanatili sa pagkakaugnay ni David sa bayang haharap sa hatol. Ipinahahayag ng “nawa” ang pakiusap o pagsusumamo ng נָא.
- source_word: בְיַד יְהוָה
  choice: sa kamay ni Yahweh
  rationale: Pinananatili ang Hebreong idyomang “sa kamay,” na tumutukoy sa pagpapasakop sa kapangyarihan o pamamahala ng isang tao. Ginamit ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: כִּי רַבִּים רחמיו
  choice: sapagkat napakarami ng kanyang mga habag
  rationale: Pinananatili ng “mga habag” ang maramihang anyo ng רחמיו at ipinahihiwatig ng “napakarami” ang kasaganaan ng mahabaging pagkilos ni Yahweh.
- source_word: וּבְיַד אָדָם
  choice: ngunit ... sa kamay ng tao
  rationale: Ang pang-isahang אָדָם ay tumutukoy sa tao o sangkatauhan sa pangkalahatan at sadyang itinatapat sa pangalan ni Yahweh. Pinananatili ng salin ang pang-isahang anyo at ang idyoma ng orihinal.
- source_word: אַל אֶפֹּלָה
  choice: huwag nawa akong mahulog
  rationale: Ipinahahayag ng אַל kasama ng unang panauhang pandiwa ang mariing hangarin ni David. Pinananatili rin ang makabuluhang pagbabago mula sa maramihang “tayo” tungo sa pang-isahang “ako.”
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Ang pagbabago mula sa “tayo” tungo sa “ako”
  choice: Mahulog nawa tayo ... huwag nawa akong mahulog
  alternative: Mahulog nawa ako ... huwag nawa akong mahulog
  rationale: Maramihan ang נִפְּלָה ngunit pang-isahan ang אֶפֹּלָה. Pinananatili ang tensiyong ito sa halip na pag-isahin ang bilang, sapagkat maaaring ipinakikiisa ni David ang sarili sa bayan sa unang sugnay at saka ipinahahayag ang personal niyang hangarin sa ikalawa.
- issue: Paglalapat ng אָדָם bilang pangkalahatang katawagan
  choice: tao
  alternative: mga tao; sangkatauhan
  rationale: Pang-isahan ang אָדָם at bumubuo ito ng tuwirang paghahambing sa “kamay ni Yahweh.” Sa Filipino, maaaring gamitin ang “tao” bilang pangkalahatang katawagan nang pinananatili ang anyo at retorika ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang maipahayag nang maikli ang pagsusumamo at volitional na himig ng Hebreo. Pinanatili ang idyomang “sa kamay” at nilinaw ito sa talababa.
