base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: tl
  text: Dumating sila sa Gilead at sa lupain ng Tahtim-Hodshi[a]. Pagkatapos, dumating sila sa Dan-Jaan[b] at saka umikot patungo sa Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malabo ang Hebreong Tahtim-Hodshi. Iminumungkahi ng ilan ang pagbasa o pakahulugang “lupain ng mga Heteo sa Kadesh” o katulad nito, ngunit hindi matiyak ang pangalan ng lugar sa tekstong pinagmulan.
    reason: alternative_reading
  - marker: b
    text: Malamang na pangalan ng lugar ang Dan-Jaan, ngunit hindi matiyak ang eksaktong lokasyon nito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: dumating sila
  rationale: Ang wayyiqtol ng בוא ay nagsasalaysay ng sunod-sunod na paglalakbay. Ang “dumating sila” ay natural sa Filipino at pinananatili ang pag-uulit sa Hebreo.
- source_word: הַגִּלְעָדָה
  choice: sa Gilead
  rationale: Ang directional he ay nagpapahiwatig ng pagpunta sa rehiyon; sapat na itong ipahayag sa Filipino sa pamamagitan ng “sa” kasunod ng “dumating.”
- source_word: אֶרֶץ
  choice: lupain ng
  rationale: Tumutukoy rito ang אֶרֶץ sa isang heograpikong rehiyon o nasasakupan, hindi sa buong daigdig.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Tahtim-Hodshi
  rationale: Malabo ang anyong Hebreo at maaaring isang tambalang pangalan ng lugar. Ang transliterasyon ang pinakalantad na pagpili kaysa magpasok ng haka-hakang emendasyon.
- source_word: דָּנָה יַּעַן
  choice: Dan-Jaan
  rationale: Pinakamainam itong unawain bilang pangalan ng lugar. Isinasama na ng pariralang “dumating sila sa” ang direksiyonal na diwa ng anyo.
- source_word: וְסָבִיב אֶל צִידוֹן
  choice: at naglibot hanggang Sidon
  rationale: Ipinahihiwatig ng סָבִיב ang pag-ikot o pagdaan sa nakapaligid na lugar, samantalang ang אֶל צִידוֹן ay nagsasaad ng direksiyon o hantungan. Natural na pinagsasama ng saling ito ang dalawang diwa nang hindi dinaragdagan ang tiyak na hindi sinasabi ng teksto.
