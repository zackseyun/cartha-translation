  to: Sinabi ni Arauna kay David, “Kunin at ihandog ng aking panginoon, ang hari, ang mabuti sa kanyang paningin.[a] Narito, ang mga bakang panghatak ay para sa handog na sinusunog, at ang mga panggiik at mga kagamitan ng mga baka[b] ay panggatong.”
