base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: tl
  text: Sinabi ni Arauna kay David, “Kunin at ihandog ng aking panginoon, ang hari, ang mabuti sa kanyang paningin.[a] Narito, ang mga bakang panghatak ay para sa handog na sinusunog, at ang mga panggiik at mga kagamitan ng mga baka[b] ay panggatong.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anuman ang sa palagay niya ay mabuti.” Literal sa Hebreo, “ang mabuti sa kanyang mga mata.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring kabilang sa “mga kagamitan ng mga baka” ang mga pamatok o iba pang kagamitang kahoy na gagamiting panggatong.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: Kunin at ihandog
  rationale: Ang anyong pandiwa sa tuwirang pananalita ay nagpapahayag ng magalang na pahintulot o paanyaya. Pinananatili ng “ihandog” ang kontekstong pansakripisyo ng עלה.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ng panginoon kong hari
  rationale: Magalang na katawagang panghukuman ito. Ang ikatlong panauhan ay pinanatili, gaya ng Hebreo, kahit tuwirang kinakausap ang hari.
- source_word: הַטּוֹב בְּעֵינָו
  choice: ang anumang mabuti sa kanyang paningin
  rationale: Pinananatili ang malinaw ngunit likas na salin ng idyomang Hebreo at ang paglipat sa ikatlong panauhan.
- source_word: רְאֵה
  choice: Narito
  rationale: Likas at marangal na panandang pantukoy sa Filipino na itinutuon ang pansin sa mga iniaalok ni Arauna.
- source_word: הַבָּקָר
  choice: ang mga baka
  rationale: Tumutukoy sa mga hayop na pantrabaho na kaugnay ng mga kagamitang panggiik at maaari ring ihandog.
- source_word: לָעֹלָה
  choice: para sa handog na sinusunog
  rationale: Karaniwang salin sa Filipino ng עֹלָה, isang handog na lubusang sinusunog.
- source_word: הַמֹּרִגִּים
  choice: ang mga panggiik
  rationale: Tumutukoy sa mga kahoy na kasangkapang ginagamit sa paggiik; maikli at madaling maunawaan sa Filipino.
- source_word: כְלֵי הַבָּקָר
  choice: mga kagamitan ng mga baka
  rationale: Pinananatili ang malawak na kahulugan ng כְּלִי at iniiwasang limitahan ito sa “mga pamatok,” bagaman maaaring kabilang ang mga iyon.
- source_word: לָעֵצִים
  choice: panggatong
  rationale: Malinaw na ipinahihiwatig ng konteksto na ang kahoy na kagamitan ay gagamiting gatong sa paghahandog.
