base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: tl
  text: 'Nang bumangon si David sa umaga, dumating na[a] kay Gad na propeta, ang tagakita ni David, ang salita ni Yahweh, na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang salita ni Yahweh ay para kay Gad.” Maaari ring unawain na dumating ang salita kay Gad nang panahong iyon, sa halip na bago bumangon si David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Likas na salaysay na katumbas ng קום at malinaw na tumutukoy sa pagbangon ni David.
- source_word: בַּבֹּקֶר
  choice: kinaumagahan
  rationale: Natural sa modernong Tagalog at iniuugnay ang umagang ito sa naunang salaysay.
- source_word: וּדְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang pormulang propetiko at ang diwang kapahayagan; isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: הָיָה אֶל
  choice: dumating na kay
  rationale: Ang idyomang Hebreo ay karaniwang nagsasaad na dumating sa isang tao ang salita ng Diyos. Ipinahihiwatig ng “na” ang malamang na naunang pangyayari kaugnay ng pagbangon ni David, habang nililinaw sa talababa ang mas literal na anyo.
- source_word: גָּד
  choice: Gad
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Tagalog.
- source_word: הַנָּבִיא
  choice: propeta
  rationale: Tuwirang at karaniwang katumbas ng נָבִיא sa Tagalog.
- source_word: חֹזֵה דָוִד
  choice: ang tagakita ni David
  rationale: Pinananatili ang natatanging katawagan na חֹזֶה at ang kaugnayan nito kay David, sa halip na ipantay lamang sa “propeta.”
- source_word: לֵאמֹר
  choice: Sinabi ni Yahweh,
  rationale: Sa Tagalog, mas natural na ipakilala ang tuwirang pananalita sa susunod na talata sa pamamagitan ng tahasang “Sinabi ni Yahweh” kaysa sa nakabitin na “na sinasabi.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pagkakasunod ng pagbangon ni David at pagdating ng salita kay Gad
  choice: dumating na kay Gad
  alternative: dumating kay Gad / ay nasa kay Gad
  rationale: Malamang na pangyayaring nauna ang qatal na הָיָה sa pagbangon ni David, ngunit hindi lubos na tahasan ang aspektuwal na ugnayan. Ipinakikita ng talababa ang mas literal na kayarian upang hindi maitago ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tagakita” upang mapanatili ang pagkakaiba ng חֹזֶה sa “propeta.” Ang em dash ay nagpapakitang ang dalawang katawagan ay kapuwa tumutukoy kay Gad.
