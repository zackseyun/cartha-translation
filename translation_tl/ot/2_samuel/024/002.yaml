revisions:
- from: Kaya sinabi ng hari kay Joab, na pinuno ng hukbong kasama niya, “Libutin ninyo ngayon ang lahat ng lipi ng Israel, mula sa Dan hanggang sa Beer-seba, at bilangin[a] ninyo ang mga tao upang malaman ko ang bilang nila.”
  to: Kaya sinabi ng hari kay Joab, ang pinuno ng hukbo na kasama niya, “Libutin mo ngayon ang lahat ng lipi ng Israel, mula sa Dan hanggang sa Beer-seba, at bilangin[a] ninyo ang mga tao upang malaman ko ang bilang ng mga tao.”
  rationale: Inayos ang unang utos sa isahan (“Libutin mo”) upang tumugma sa Hebreo, ngunit pinanatili ang maramihang “bilangin ninyo” para sa kasunod na pandiwang maramihan. Inayos din ang ayos ng parirala upang si Joab ang malinaw na kasama ng hari. Ibinalik ang “bilang ng mga tao” upang mas malapit na maipakita ang pag-uulit sa Hebreo nang nananatiling natural ang Tagalog.
