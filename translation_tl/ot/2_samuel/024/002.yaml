  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: tl
  text: Kaya sinabi ng hari kay Joab, ang pinuno ng hukbo na kasama niya, “Libutin mo ngayon ang lahat ng lipi ng Israel, mula sa Dan hanggang sa Beer-seba, at bilangin[a] ninyo ang mga tao upang malaman ko ang bilang ng mga tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itala.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbibilang o pagtatala ng mga tao, kung minsan ay sa kontekstong militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Kaya sinabi” at naipakikita nito ang ugnayan sa naunang pangyayari.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan. Bagaman si David ang tinutukoy sa konteksto, pinananatili ang titulong ginamit sa Hebreo.
- source_word: שַׂר הַחַיִל
  choice: pinuno ng hukbo
  rationale: Ang שַׂר ay pinuno o opisyal, at ang חַיִל dito ay puwersang militar. Malinaw at dignified sa kasalukuyang Tagalog ang pariralang ito.
- source_word: אֲשֶׁר אִתּוֹ
  choice: na ... kasama niya
  rationale: Pinananatili ang kamag-anak na sugnay na nagsasabing kasama ng hari si Joab.
- source_word: שׁוּט נָא
  choice: Libutin ninyo ngayon
  rationale: Ipinahihiwatig ng שׁוּט ang paglalakbay sa iba’t ibang bahagi ng isang lugar. Ang נָא ay nagpapalumanay sa utos; sa konteksto ng utos ng hari, sapat ang “ngayon” at magalang na maramihang anyo nang hindi ginagawang pakiusap.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ang lahat ng lipi ng Israel
  rationale: Kasama ng pandiwang “libutin,” malinaw na tumutukoy ito sa pagdaan sa buong nasasakupan ng mga lipi.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: mula sa Dan hanggang sa Beer-seba
  rationale: Pinananatili ang heograpikong merismo para sa kabuuang lupain at ang karaniwang anyo ng mga pangalan sa Tagalog.
- source_word: וּפִקְדוּ
  choice: at bilangin
  rationale: Sa konteksto, ang פקד ay tumutukoy sa sensus o pagtatala. “Bilangin” ang pinakamalinaw na pangunahing salin, habang inilalagay sa talababa ang posibilidad na “itala.”
- source_word: אֶת הָעָם
  choice: ang mga tao
  rationale: Ang עָם ay mas malawak na “mga tao/bayan,” hindi tahasang “mga mandirigma.” Ang “mga tao” ay natural dito at hindi nagpapakitid sa saklaw.
- source_word: וְיָדַעְתִּי
  choice: upang malaman ko
  rationale: Ipinahahayag ang layunin o inaasahang resulta ng utos sa natural na Tagalog.
- source_word: מִסְפַּר הָעָם
  choice: ang bilang nila
  rationale: Natural na Tagalog ang panghalip upang maiwasan ang mabigat na pag-uulit, habang malinaw na ang tinutukoy ay ang bilang ng mga tao.
theological_decisions:
- issue: Saklaw ng הָעָם sa kontekstong militar at administratibo
  choice: ang mga tao
  alternative: ang mga mandirigma / ang mga kawal
  rationale: Bagaman pinuno ng hukbo si Joab at maaaring may layuning militar ang sensus, עָם ang ginamit sa Hebreo, hindi isang tiyak na katawagan para sa mga mandirigma. Kaya pinananatili ang mas malawak na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” bilang likas na anyo ng utos sa pangkat na pinamumunuan ni Joab, yamang maramihan ang pandiwang Hebreo na וּפִקְדוּ. Pinanatili ang “hari” sa halip na ipalit ang pangalang David.
