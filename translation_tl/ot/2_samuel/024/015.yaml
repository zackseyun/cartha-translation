id: 2SA.24.15
reference: 2 Samuel 24:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: tl
  text: Kaya nagpadala si Yahweh ng salot sa Israel mula umaga hanggang sa takdang panahon[a]. Namatay ang pitumpung libong lalaki sa sambayanan, mula Dan hanggang Beer-seba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa itinakdang oras.” Maaari ring mangahulugan ang pariralang Hebreo na “hanggang sa panahon ng pagtitipon,” ngunit hindi ito gaanong malamang dito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: nagpadala
  rationale: Bagaman literal na “nagbigay,” ang “nagpadala ng salot” ang likas na pariralang Filipino sa kontekstong ito at malinaw na pinananatili ang tuwirang pagkilos ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: דֶּבֶר
  choice: salot
  rationale: Karaniwan, malinaw, at marangal na salitang Filipino para sa nakamamatay na peste o epidemya sa konteksto ng paghatol.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Likas sa Filipino at maaaring tumukoy kapuwa sa bayan at sa lupaing tinamaan ng salot.
- source_word: מֵהַבֹּקֶר
  choice: mula umaga
  rationale: Direkta at natural na pahayag ng panimulang oras.
- source_word: וְעַד עֵת מוֹעֵד
  choice: hanggang sa takdang panahon
  rationale: Pinananatili ang diwa ng isang itinakda o tiyak na panahong wakas nang hindi nilulutas nang higit sa ipinahihiwatig ng Hebreo.
- source_word: וַיָּמָת מִן הָעָם
  choice: Namatay ... sa sambayanan
  rationale: Ang “sambayanan” ay malinaw na tumutukoy sa kolektibong bayan ng Israel at iniiwasan ang posibleng kalituhan ng “bayan” bilang isang lokalidad.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: mula Dan hanggang Beer-seba
  rationale: Pinananatili ang nakaugaliang heograpikong pahayag para sa buong saklaw ng Israel.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: pitumpung libong lalaki
  rationale: Pinananatili ang panlalaking katawagang אִישׁ at ang distributibong bilang nito.
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa paghatol
  choice: nagpadala si Yahweh ng salot
  alternative: pinahintulutan ni Yahweh na magkaroon ng salot
  rationale: Tuwirang iniuugnay ng Hebreo kay Yahweh ang pagkilos; walang pandiwang nangangahulugang “pinahintulutan.”
- issue: Kahulugan ng עֵת מוֹעֵד
  choice: takdang panahon
  alternative: panahon ng pagtitipon
  rationale: Sa konteksto, pinakamalamang na tumutukoy ito sa itinakdang hangganan ng panahon. Gayunman, tunay na posible sa leksikon ang kaugnayan ng מוֹעֵד sa pagtitipon, kaya binanggit iyon sa talababa.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “sambayanan” upang tukuyin ang kolektibong bayan nang hindi mapagkamalang isang lungsod o nayon; pinanatili ang “Yahweh” bilang personal na pangalan.
