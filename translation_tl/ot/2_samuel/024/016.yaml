source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: tl
  text: Nang iunat ng anghel ang kamay niya patungo sa Jerusalem upang lipulin ito, nagbago ng pasiya si Yahweh tungkol sa kapahamakan[a] at sinabi sa anghel na lumilipol sa bayan, “Tama na! Iurong mo na ang kamay mo.” Noon, ang anghel ni Yahweh ay nasa tabi ng giikan ni Arauna[b] na Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “umurong si Yahweh sa kapahamakan.” Literal sa Hebreo, “nagbago ng pasiya tungkol sa kapahamakan.” Ang salitang רָעָה rito ay tumutukoy sa kapahamakan o sakuna, hindi sa moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: Si Arauna ay tinatawag na Ornan sa kahalintulad na salaysay sa 1 Cronica 21:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: iniunat ... ang kamay niya
  rationale: Likas na salin ng idyomang Hebreo para sa pag-abot o pag-unat ng kamay upang kumilos; pinananatili ang kongkretong larawan.
- source_word: הַמַּלְאָךְ
  choice: anghel
  rationale: Sa konteksto, ito ay makalangit na tagapagpatupad ng salot at hatol, hindi lamang karaniwang sugo.
- source_word: לְשַׁחֲתָהּ / הַמַּשְׁחִית בָּעָם
  choice: upang lipulin ito / na lumilipol sa bayan
  rationale: Ang “lipulin” ay malinaw na naghahayag ng mapangwasak na kilos at naipananatili sa ikalawang parirala ang nagpapatuloy na kilos ng participle.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: nagbago ng pasiya si Yahweh tungkol sa kapahamakan
  rationale: Ipinahahayag ng Niphal ng נחם ang pagtalikod sa pagpapatuloy ng ipinahayag na hatol. Ang “tungkol sa kapahamakan” ay malapit sa אֶל הָרָעָה at hindi ginagawang moral na kasamaan ang רָעָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: רַב
  choice: Tama na!
  rationale: Natural at mariing katumbas sa modernong Filipino ng maikling interjection na nangangahulugang sapat na.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Iurong mo na ang kamay mo
  rationale: Ipinahahayag ang pagtigil sa kasalukuyang pagkilos habang pinananatili ang larawan ng kamay.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Tuwirang pinananatili ang katawagan ng teksto nang hindi nilulutas ang pagkakakilanlan ng anghel.
- source_word: הָיָה עִם גֹּרֶן
  choice: ay nasa tabi ng giikan
  rationale: Ang “nasa tabi” ay natural na lokatibong salin ng עִם, at ang “giikan” ang karaniwang terminong Filipino para sa threshing floor.
- source_word: הָאֹרְנָה הַיְבֻסִי
  choice: Arauna na Jebuseo
  rationale: Pinananatili ang anyo ng pangalan sa Samuel at natural na tinutukoy ang kaniyang etnikong pagkakakilanlan.
theological_decisions:
- issue: Antropopatikong pananalita tungkol sa Diyos sa וַיִּנָּחֶם יְהוָה
  choice: nagbago ng pasiya si Yahweh tungkol sa kapahamakan
  alternative: nagsisi si Yahweh dahil sa kasamaan / nalungkot si Yahweh dahil sa kapahamakan
  rationale: Pinananatili nito ang tunay na pahayag na tumigil si Yahweh sa pagpapatuloy ng hatol, nang hindi ipinahihiwatig na gumawa siya ng moral na pagkakamali. Hindi rin nito inaalis ang tensiyon ng tekstong naglalarawan ng pagbabago sa ipinapatupad na pasiya.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  alternative: isang teopanikong pagpapakita / isang nilikhang anghel
  rationale: Ang talata ay nagbibigay ng katawagan ngunit hindi nito tiyak na nilulutas ang higit na teolohikal na pagkakakilanlan ng persona.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lipulin,” “kapahamakan,” at “giikan” bilang malinaw at angkop na mga terminong biblikal. Inilipat ang mga panandang talababa sa mismong mga salitang tinatalakay ng bawat tala: [a] sa “kapahamakan” at [b] sa “Arauna.”'
