reference: 2 Samuel 24:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: tl
  text: Nang araw ding iyon, pumunta si Gad kay David at sinabi sa kanya, “Umakyat ka at magtayo ng altar para kay Yahweh[a] sa giikan ni Arauna na Jebuseo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang pangalan niya ay “Ornan” sa 1 Cronica 21:18.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Ang Qal wayyiqtol ng בוא ay nagsasaad ng paglapit o pagdating. Sa Filipino, mas natural ang “pumunta ... kay David” kaysa “dumating ... kay David” sa ganitong salaysay.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw ding iyon
  rationale: Pinananatili nito ang tiyak na pagtukoy sa araw na kaugnay ng naunang pangyayari at natural itong pakinggan sa salaysay.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang direksiyonal na diwa ng pautos na עלה, “umakyat/pumaitaas.”
- source_word: הָקֵם
  choice: magtayo
  rationale: Ang Hiphil imperative ng קום ay literal na “patayuin” o “itayo”; ang “magtayo ng altar” ang natural at tumpak na parirala sa Filipino.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at malinaw na salin ng מזבח sa modernong Filipino.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay maaaring magpahiwatig ng paglalaan o direksiyon. Ang “para kay Yahweh” ay natural sa Filipino at malinaw na ang altar ay inilaan sa kanya.
- source_word: בְּגֹרֶן
  choice: sa giikan
  rationale: Ang גֹּרֶן ay lugar na pinaggigiikan. Sapat na ipinahihiwatig ng “sa” na doon mismo itatayo ang altar nang hindi pinipilit ang mas tiyak na relasyong pansaklaw.
- source_word: ארניה
  choice: Arauna
  rationale: Sinusunod ang anyo ng pangalan sa Samuel; ang “Ornan” ay anyong matatagpuan sa paralelong salaysay sa Mga Cronica.
- source_word: הַיְבֻסִי
  choice: na Jebuseo
  rationale: Natural na anyong Filipino para sa katawagang etniko na tumutukoy sa isang Jebusita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng ל sa לַיהוָה
  choice: para kay Yahweh
  alternative: kay Yahweh
  rationale: Maaaring ipahiwatig ng pang-ukol ang paglalaan (“para sa”) o direksiyon (“kay”). Pinili ang mas natural na Filipino sa konteksto ng pagtatayo ng altar, habang itinatala sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “giikan,” isang maikli at karaniwang terminong biblikal para sa threshing floor, at iniwasan ang mga arkaikong anyo. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng kaugnay na salita o parirala.
