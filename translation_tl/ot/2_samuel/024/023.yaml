base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: tl
  text: Ibinigay ni Arauna, ang hari,[a] ang lahat ng ito sa hari. At sinabi ni Arauna sa hari, “Nawa’y kalugdan ka[b] ni Yahweh, na iyong Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Arauna ang hari.” Pinapakinis ito ng ilang salin upang hindi ipahiwatig na hari si Arauna, ngunit nasa tekstong Hebreo ang titulo.'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tanggapin ka,” “maging kalugud-lugod sa iyo,” o “lingapin ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: ang lahat ng ito
  rationale: Tumutukoy sa kabuuan ng mga bagay na inalok sa naunang konteksto; likas sa Tagalog ang pariralang ito at napapanatili ang pagiging komprehensibo.
- source_word: נָתַן
  choice: ibinigay
  rationale: 'Ang qatal sa salaysay ay angkop na isalin sa aspektong naganap: “ibinigay.”'
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Karaniwang anyong Tagalog ng pangalan sa Samuel; hindi inaangkat ang “Ornan” mula sa katumbas na salaysay sa Mga Cronica.
- source_word: הַמֶּלֶךְ
  choice: na hari
  rationale: Pinananatili ang tahasang apposition ng Hebreo, “Arauna na hari,” kahit hindi pangkaraniwan ang titulong ito sa konteksto.
- source_word: לַמֶּלֶךְ
  choice: sa hari
  rationale: Ipinapakita ng ל ang tumatanggap, si David.
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Direkta at likas na pagpapatuloy ng salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang inilalarawan ang ikalawang panauhang panlalaking isahan na tumutukoy sa Diyos ni David.
- source_word: יִרְצֶךָ
  choice: kalugdan ka
  rationale: Ipinahahayag ang mabuting pagtanggap o paglingap nang hindi nilulutas ang saklaw ng pandiwang רצה sa iisang mas makitid na kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kung pananatilihin ang titulong “hari” para kay Arauna
  choice: Pinanatili sa pangunahing teksto bilang “Arauna na hari”
  alternative: “Ibinigay ni Arauna sa hari...”
  rationale: Tahasan sa Masoretikong teksto ang אֲרַוְנָה הַמֶּלֶךְ. Bagaman maaaring hindi pangkaraniwan o may suliraning tekstuwal, hindi ito dapat tahimik na pakinisin.
- issue: Saklaw ng יִרְצֶךָ
  choice: kalugdan ka
  alternative: tanggapin ka o lingapin ka
  rationale: Pinananatili ang posibilidad ng pagiging kalugod-lugod, pagtanggap, at paglingap sa halip na gawing tiyak ang isa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang di-pangkaraniwang titulong “hari” kay Arauna at gumamit ng “kalugdan ka nawa” bilang natural na pormula ng paghiling na hindi nagpapakipot sa kahulugan ng רצה.
