  terminology: Ang “mga tauhan,” “saktan,” “patayin,” at “magpakatatag” ay angkop sa kontekstong ito. Ang “matatapang na lalaki” ay nagpapanatili sa panlalaking anyo ng בני חיל at sa panawagan sa tapang nang mas natural kaysa “magigiting na lalaki.”
