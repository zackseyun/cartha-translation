  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: tl
  text: 'Pagkatapos, inutusan ni Absalom ang kanyang mga tauhan: “Magmasid kayong mabuti. Kapag masaya ang loob ni Amnon dahil sa alak[a], at sinabi ko sa inyo, ‘Saktan ninyo si Amnon,’ patayin ninyo siya. Huwag kayong matakot. Hindi ba’t ako mismo ang nag-utos sa inyo? Magpakatatag kayo at maging matatapang na lalaki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kapag maganda ang pakiramdam ni Amnon dahil sa alak.” Literal na sinasabi ng Hebreong idyoma na “mabuti” ang kanyang puso dahil sa alak.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: kanyang mga tauhan
  rationale: Maaaring tumukoy ang נַעַר sa kabataan, lingkod, tagapaglingkod, o personal na tauhan. Sa kontekstong ito, sila ang mga tauhang inuutusang magsagawa ng karahasan; natural at sapat na malawak ang “mga tauhan” sa modernong Tagalog.
- source_word: רְאוּ נָא
  choice: Magmasid kayong mabuti
  rationale: Ang pautos na רְאוּ kasama ng נָא ay tumatawag ng maagap at maingat na pansin. Mas natural sa Tagalog ang “magmasid kayong mabuti” kaysa sa literal na “tingnan ninyo ngayon.”
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: kapag masaya na ang puso ni Amnon dahil sa alak
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma na ang puso ay “mabuti” dahil sa alak, nang hindi ipinapalagay na lasing na lasing si Amnon.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Saktan ninyo si Amnon
  rationale: 'Malawak ang saklaw ng נכה: hampasin, saktan, o salakayin. Ang “saktan” ay malinaw na marahas ngunit hinahayaang ang kasunod na utos na “patayin” ang tumukoy sa nakamamatay na kinalabasan.'
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: patayin ninyo siya
  rationale: Ang Hiphil ng מות ay nangangahulugang magdulot ng kamatayan o pumatay. Tuwiran at natural ang salin.
- source_word: אַל תִּירָאוּ
  choice: Huwag kayong matakot
  rationale: Tuwirang pagbabawal ito, at ang karaniwang Tagalog na “huwag kayong matakot” ay malinaw at mariin.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: Hindi ba’t ako mismo ang nag-utos sa inyo?
  rationale: Napananatili ng retorikal na tanong at ng “ako mismo” ang diin ng אָנֹכִי at ang pag-apela ni Absalom sa sarili niyang awtoridad.
- source_word: חִזְקוּ
  choice: Magpakatatag kayo
  rationale: Ang pautos ay panawagan sa lakas ng loob at matibay na pagpapasiya; likas sa kasalukuyang Tagalog ang “magpakatatag.”
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: maging magigiting na lalaki
  rationale: Ang בני חיל ay tumutukoy sa magigiting, may-kakayahan, o matatapang na lalaki at may tonong pandigma. Pinananatili ng salin ang panlalaking anyo at ang diwa ng kagitingan.
theological_decisions:
- issue: Panlalaking pahayag sa לִבְנֵי חָיִל
  choice: maging magigiting na lalaki
  alternative: maging magigiting kayo
  rationale: Panlalaki ang anyo at kahulugan ng Hebreo, at mga lalaking tauhan ang kausap sa tagpong ito. Ang tahasang “lalaki” ay nagpapanatili sa anyo at panlipunang konteksto ng pinagmulan nang hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang marahas at mariing tono ng utos, gayundin ang Hebreong idyoma tungkol sa puso sa pangunahing teksto; ipinaliwanag sa talababa ang mas natural na alternatibo.
