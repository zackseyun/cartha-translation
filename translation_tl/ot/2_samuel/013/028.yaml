  to: 'Pagkatapos, inutusan ni Absalom ang kanyang mga tauhan: “Magmasid kayong mabuti. Kapag masaya ang loob ni Amnon dahil sa alak[a], at sinabi ko sa inyo, ‘Saktan ninyo si Amnon,’ patayin ninyo siya. Huwag kayong matakot. Hindi ba’t ako mismo ang nag-utos sa inyo? Magpakatatag kayo at maging matatapang na lalaki.”'
