  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: tl
  text: Sumagot si Jonadab na anak ni Shimea, na kapatid ni David, “Huwag pong sabihin ng aking panginoon, ‘Pinatay nila ang lahat ng binata, ang mga anak ng hari,’ sapagkat si Amnon lamang ang namatay. Itinakda na ito ni Absalom[a] mula noong araw na gahasain ni Amnon si Tamar, na kapatid ni Absalom.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Itinakda na ito ayon sa salita o utos ni Absalom,” samakatuwid, alinsunod sa matatag na pasiya niya.'
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay maaari ring mangahulugang “hamakin” o “lapastanganin”; sa kontekstong ito, tumutukoy ito sa panggagahasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa pagtugon sa sinabi o balitang nauna; natural ito sa makabagong Tagalog.
- source_word: אֲחִי דָוִד
  choice: na kapatid ni David
  rationale: Tumutukoy kay Shimea bilang kapatid ni David at malinaw na naihihiwalay sa pagkakakilanlan ni Jonadab.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Huwag pong sabihin ng aking panginoon
  rationale: Pinananatili ang pagbabawal o pakiusap at ang magalang na pananalita ni Jonadab sa hari.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: ang lahat ng binata, ang mga anak ng hari
  rationale: Ang נְעָרִים ay tumutukoy rito sa mga kabataang lalaki; pinananatili ang paliwanag na sila ang mga anak ng hari.
- source_word: הֵמִיתוּ
  choice: Pinatay nila
  rationale: Tuwirang katumbas ng causative na anyo ng מות at pinananatili ang maramihang simuno ng iniulat na pahayag.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: si Amnon lamang ang namatay
  rationale: Malinaw na ipinahahayag ang eksklusibong diin ng לְבַדּוֹ.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: Itinakda na ito ni Absalom
  rationale: Ipinapahayag ang isang pasiyang o planong naitakda na, habang iniiwasang gawing tahasang ‘utos’ ang idyomang עַל פִּי; inilalahad sa talababa ang ibang posibleng himig.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: mula nang araw na gahasain ni Amnon
  rationale: Sa konteksto, ang Piel ng ענה ay tumutukoy sa seksuwal na panggagahasa kay Tamar. Ang tahasang pagbanggit kay Amnon ay nag-aalis ng nakalilitong sunod-sunod na panghalip sa Tagalog.
- source_word: אֵת תָּמָר אֲחֹתוֹ
  choice: si Tamar, na kapatid ni Absalom
  rationale: Sa daloy ng salaysay, si Tamar ang kapatid ni Absalom; nililinaw ang reperente upang hindi mapagkamalang inilalarawan siyang kapatid lamang ng gumahasa sa kaniya.
theological_decisions:
- issue: Lakas ng salitang ענה sa paglalarawan sa ginawa kay Tamar
  choice: gahasain
  alternative: hamakin / lapastanganin
  rationale: Ang konteksto ng 2 Samuel 13 ay malinaw na seksuwal na karahasan. Hindi dapat pagaanin ng salin ang ginawa kay Tamar, bagaman pinananatili sa talababa ang mas malawak na saklaw ng pandiwang Hebreo.
- issue: Diwa ng עַל־פִּי אַבְשָׁלוֹם
  choice: Itinakda na ito ni Absalom
  alternative: Iniutos ito ni Absalom
  rationale: Maaaring magpahiwatig ang idyoma ng salita, utos, o matatag na pasiya ni Absalom. Hindi ginagawang tiyak na ‘utos’ sa pangunahing teksto ang tunay na maluwag na saklaw nito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “po” at “aking panginoon” upang mapanatili ang magalang na pananalita sa hari. Tahasang pinangalanan sina Amnon at Absalom sa huling sugnay dahil magiging malabo at alanganin sa Tagalog ang dalawang magkasunod na “niya.”
