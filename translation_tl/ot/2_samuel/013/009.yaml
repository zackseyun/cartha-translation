    issue: Ang “mula rito” sa utos ni Amnon ay hindi tumutumbas nang sapat sa מֵעָלַי (“mula sa akin/mula sa aking harapan”).
    rationale: Ang “rito” ay tumutukoy lamang sa lugar at inaalis ang personal na sentro ng utos ni Amnon. Dapat ding umayon ang pahayag sa kasunod na salaysay na umalis ang lahat “mula sa harap niya.”
  - severity: low
    issue: Maaaring lumabo ang reperente ng “tumanggi itong kumain.”
    rationale: Bagaman malamang na si Amnon ang tinutukoy, ang “siyang” ay mas tuwiran at natural sa magkakasunod na pagtukoy sa pagkain at sa mga panghalip.
