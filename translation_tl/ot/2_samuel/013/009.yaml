  source_fidelity: Tumpak sa pangkalahatan ang pagsasalin ng sisidlan, pagbuhos/paghahain ng pagkain, at sadyang pagtanggi ni Amnon na kumain. Gayunman, ang “mula rito” ay naglilipat ng Hebreong “mula sa akin” tungo sa isang di-tiyak na deiktikong lugar at hindi pinananatili ang paralelismo sa kasunod na “mula sa harap niya.”
  naturalness: Makabago at malinaw ang Filipino. Mas likas at mas malinaw ang “tumanggi siyang kumain” kaysa “tumanggi itong kumain,” dahil tahasang itinuturo nito si Amnon.
  terminology: Ang “kawali” ay katanggap-tanggap para sa sisidlang pagluluto o paghahain. Ang “mga iyon” ay wastong tumutukoy sa mga pagkaing inihanda sa naunang konteksto. Ang “mula sa aking harapan” ay marangal ngunit nauunawaan at mas malapit sa idyomang Hebreo kaysa “mula rito.”
  issues:
