  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: tl
  text: Pagkatapos, kinuha niya ang kawali at ibinuhos ang mga iyon sa harap ni Amnon,[a] ngunit tumanggi siyang kumain. Sinabi ni Amnon, “Palabasin ninyo ang lahat mula sa aking harapan.” Kaya lumabas ang lahat mula sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inihain ang mga iyon sa harap ni Amnon.” Literal na “ibinuhos” ang pandiwang Hebreo, na ginamit dito sa konteksto ng paghahain ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: ang kawali
  rationale: Tumutukoy ito sa sisidlang ginamit sa pagluluto o paghahain. Ang “kawali” ay maikli, natural, at angkop sa konteksto.
- source_word: וַתִּצֹק לְפָנָיו
  choice: ibinuhos ang mga iyon sa harap ni Amnon
  rationale: Ang pandiwang יצק ay literal na “ibuhos.” Pinananatili ng salin ang konkretong kilos, habang ang “mga iyon” ay tumutukoy sa pagkaing inihanda sa naunang konteksto.
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: tumanggi itong kumain
  rationale: Ang מָאֵן ay nagpapahayag ng sadyang pagtanggi, hindi lamang kawalan ng gana.
- source_word: הוֹצִיאוּ
  choice: Palabasin ninyo
  rationale: Ang Hiphil na pautos ng יצא ay nangangahulugang ‘papuntahin sa labas’ o ‘palabasin’; natural itong utos sa Filipino.
- source_word: כָל אִישׁ
  choice: ang lahat
  rationale: Bagaman literal na “bawat lalaki,” ginagamit ito rito bilang kolektibong pagtukoy sa lahat ng naroon.
- source_word: מֵעָלַי
  choice: mula rito
  rationale: Sa utos ni Amnon, ang literal na ‘mula sa akin/sa ibabaw ko’ ay idyomatikong nangangahulugang lumayo sa kaniyang kinaroroonan. Ang “mula rito” ay natural sa tuwirang pananalita.
- source_word: מֵעָלָיו
  choice: mula sa harap niya
  rationale: Ipinahahayag nito na umalis sila sa presensiya o kinaroroonan ni Amnon, at pinananatili ang ugnayan sa naunang utos.
