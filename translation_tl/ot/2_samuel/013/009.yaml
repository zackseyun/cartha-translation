revisions:
- from: Pagkatapos, kinuha niya ang kawali at ibinuhos ang mga iyon sa harap ni Amnon,[a] ngunit tumanggi itong kumain. Sinabi ni Amnon, “Palabasin ninyo ang lahat mula rito.” Kaya lumabas ang lahat mula sa harap niya.
  to: Pagkatapos, kinuha niya ang kawali at ibinuhos ang mga iyon sa harap ni Amnon,[a] ngunit tumanggi siyang kumain. Sinabi ni Amnon, “Palabasin ninyo ang lahat mula sa aking harapan.” Kaya lumabas ang lahat mula sa harap niya.
  rationale: Pinalitan ang “mula rito” ng “mula sa aking harapan” upang maipahayag ang personal na saklaw ng utos ni Amnon at mapanatili ang paralelismo sa kasunod na pangungusap. Pinalinaw rin ang panghalip para kay Amnon. Hindi binago ang literal na “ibinuhos,” at pinanatili ang talababa para sa idyomatikong alternatibong “inihain.”
