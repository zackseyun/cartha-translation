translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na mga reperente upang maiwasan ang kalituhan sa magkasunod na panghalip. Pinanatili ang literal na larawan ng pagbuhos ngunit ipinaliwanag sa talababa ang posibleng idyomatikong pagbasa.
