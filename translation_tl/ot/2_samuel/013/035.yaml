translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo/inyong” bilang magalang na pakikipag-usap sa hari, hindi bilang tunay na maramihan. Pinanatili ang pormal na katawagang panghukuman na “inyong lingkod” nang hindi nagiging makaluma.
