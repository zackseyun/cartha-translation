    rationale: Ang Hebreong בְּנֵי ay “mga anak na lalaki/mga anak na lalaki ng hari” sa talatang ito. Bagaman maaaring gamitin ang “mga anak” sa ibang konteksto, inaalis nito rito ang tahasang kasariang nasa pinagmulan at ang mahalagang pagtukoy sa mga prinsipe.
