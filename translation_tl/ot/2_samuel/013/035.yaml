  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jonadab sa hari, “Tingnan ninyo! Dumating na ang mga anak na lalaki ng hari; kung ano ang sinabi ng inyong lingkod, ganoon nga ang nangyari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” bilang panandang sunod-sunod na pangyayari.
- source_word: יֽוֹנָדָב
  choice: Jonadab
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Tumutukoy ito sa taong hari, si David, kaya karaniwang pangngalan ang ginamit.
- source_word: הִנֵּה
  choice: Tingnan ninyo!
  rationale: Panawag-pansin ang הִנֵּה. Ang magalang na maramihang anyo ay angkop sa pakikipag-usap sa hari at likas sa Filipino.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: ang mga anak ng hari
  rationale: Pinananatili ang maramihan, na mahalaga sa konteksto dahil itinutuwid ni Jonadab ang balitang napatay ang lahat ng anak ng hari. Sa konteksto, mga anak na lalaki ang tinutukoy, ngunit sapat at natural dito ang “mga anak ng hari.”
- source_word: בָּאוּ
  choice: Dumating na
  rationale: Ipinahihiwatig ng aspektong ganap at ng deiktikong הִנֵּה na naroon na sila; likas na ipinapahayag ito sa Filipino sa pamamagitan ng “dumating na.”
- source_word: כִּדְבַר עַבְדְּךָ
  choice: Kung ano ang sinabi ng inyong lingkod
  rationale: Idyomatikong ipinahahayag ang דבר bilang nilalaman ng sinabi, habang pinananatili ang magalang at mapagpakumbabang pagtukoy ni Jonadab sa sarili bilang lingkod ng hari.
- source_word: כֵּן הָיָה
  choice: ganoon nga ang nangyari
  rationale: Pinananatili ang pagtutugmang kayarian ng כִּ...כֵּן at ang diwa ng pagpapatunay; binibigyang-diin ng “nga” na natupad ang naunang sinabi.
