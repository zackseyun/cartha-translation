base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: tl
  text: Nang ilapit niya iyon sa kanya upang kainin niya[a], sinunggaban siya nito at sinabi sa kanya, “Halika, sumiping ka sa akin, kapatid ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nang lumapit siya sa kanya upang kumain.” Maaaring mangahulugan ang pandiwang Hebreo na si Tamar ang lumapit o na inilapit niya sa kanya ang pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: ilapit niya iyon
  rationale: Maaaring mangahulugan ang נגשׁ ng paglapit o pagpapalapit. Sa konteksto ng paghahain ni Tamar ng pagkaing inihanda niya, ang pagpapalapit ng pagkain ang pinakamalamang, ngunit pinananatili sa talababa ang tunay na lexical na alternatibo.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Karaniwang pang-ukol na nagpapahayag ng direksiyon, na may panlalaking panghalip na hulapi.
- source_word: לֶאֱכֹל
  choice: upang kumain
  rationale: Pawatas na nagpapahayag ng layunin. Likas sa Tagalog ang “upang kumain,” at naipahihiwatig ng konteksto ang pagkaing kakainin.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: sinunggaban siya nito
  rationale: Ang חזק na may ב ay tumutukoy sa mahigpit o marahas na paghawak. Ipinahahayag ng “sinunggaban” ang puwersa nang hindi lumalampas sa diwa ng Hebreo; nililinaw ng “nito” na si Amnon ang gumawa upang maiwasan ang kalituhan sa magkasunod na panghalip.
- source_word: וַיֹּאמֶר לָהּ
  choice: at sinabi sa kanya
  rationale: Likas at tuwirang salin ng karaniwang pormula sa pagsasalita.
- source_word: בּוֹאִי
  choice: Halika
  rationale: Pautos na pambabaeng isahan ng בוא. Ang “Halika” ay tuwiran at natural sa makabagong Tagalog.
- source_word: שִׁכְבִי עִמִּי
  choice: sumiping ka sa akin
  rationale: Ang שׁכב na may עִם ay idyomang seksuwal. Malinaw sa Tagalog ang “sumiping” at pinananatili nito ang marangal ngunit mabigat na tono ng tagpo.
- source_word: אֲחוֹתִי
  choice: kapatid ko
  rationale: Tuwirang katawagang pampamilya. Kailangang manatili ito sapagkat pinatitindi nito ang bigat ng moral na paglabag sa salaysay.
theological_decisions:
- issue: Paglalahad sa seksuwal na pautos nang walang mapagpalabong pagpapalumanay
  choice: sumiping ka sa akin
  alternative: matulog ka sa piling ko
  rationale: Seksuwal na idyoma ang Hebreo. Ang “sumiping” ay malinaw ngunit hindi bulgar, kaya hindi nito ikinukubli o pinababaw ang mapang-abusong kahilingan.
- issue: Pagpapanatili sa katawagang pampamilya
  choice: kapatid ko
  alternative: aking kapatid
  rationale: Hindi incidental ang katawagan; sentral ito sa moral at naratibong bigat ng pangyayari. Ang “kapatid ko” ang mas natural na kasalukuyang Tagalog.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sinunggaban” upang ihayag ang puwersa, at “sumiping” upang panatilihing malinaw ang seksuwal na kahulugan nang hindi nagiging bulgar. Inilagay ang panandang [a] mismo sa pangunahing teksto.
