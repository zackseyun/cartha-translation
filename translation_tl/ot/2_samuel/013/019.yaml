base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: tl
  text: Pagkatapos, naglagay si Tamar ng abo sa kanyang ulo at pinunit ang suot niyang natatanging damit[a]. Ipinatong niya ang kanyang kamay sa kanyang ulo, at nagpatuloy siya sa paglakad habang sumisigaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “damit na may palamuti,” “damit na may mahahabang manggas,” “makulay na damit,” o ayon sa tradisyon, “damit na sari-sari ang kulay.” Hindi tiyak ang kahulugan ng Hebreong pananalita, ngunit sa kontekstong ito ay tumutukoy ito sa natatanging kasuutang isinusuot ng mga dalagang anak ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: abo
  rationale: Tumutukoy ito sa abong inilalagay sa ulo bilang hayag na tanda ng pagluluksa; natural sa Filipino ang pang-isahang kolektibong “abo.”
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: naglagay ... ng abo sa kanyang ulo
  rationale: Ipinahahayag nang natural ang diwa ng Hebreong literal na “kumuha ng abo sa kanyang ulo,” na tumutukoy sa paglalagay nito roon.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: natatanging mahabang damit
  rationale: Hindi tiyak ang eksaktong anyo ng damit. Pinananatili ng “natatangi” ang espesyal na katangian nito sa konteksto, samantalang ang “mahabang damit” ay kumakatawan sa posibleng kasuotang umaabot sa mga galang-galangan at bukung-bukong nang hindi ipinipilit ang tradisyonal na “makulay.”
- source_word: אֲשֶׁר עָלֶיהָ
  choice: suot niyang
  rationale: Maikli, natural, at tumpak na Filipino para sa damit na nasa kanya.
- source_word: קָרָעָה
  choice: pinunit
  rationale: Karaniwang salin para sa sadyang pagpunit ng kasuutan bilang tanda ng matinding dalamhati.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: Ipinatong niya ang kanyang kamay sa ulo niya
  rationale: Pinananatili ang konkretong kilos ng dalamhati at kahihiyan nang hindi ito labis na binibigyang-kahulugan.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: lumakad siyang humahagulhol
  rationale: Natural na ipinahahayag sa Filipino ang nagpapatuloy na paglakad kasabay ng malakas na pag-iyak. Ang “humahagulhol” ay naghahatid ng malakas at patuloy na pagdaing ngunit hindi tumutukoy sa espesipikong mga salita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “natatanging mahabang damit” upang kilalanin ang espesyal na kasuutan sa konteksto habang inilalagay sa talababa ang tunay na leksikal na kawalang-katiyakan. Iniwasan ang mas teknikal na “balabal” dahil mas malawak at natural ang “damit” para sa כְתֹנֶת.
