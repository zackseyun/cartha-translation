  to: Pagkatapos, naglagay si Tamar ng abo sa kanyang ulo at pinunit ang suot niyang natatanging damit[a]. Ipinatong niya ang kanyang kamay sa kanyang ulo, at nagpatuloy siya sa paglakad habang sumisigaw.
  rationale: Inalis ang labis na tiyak na “mahabang” mula sa pangunahing teksto dahil hindi tiyak ang kahulugan ng כְתֹנֶת הַפַּסִּים, habang pinanatili ang kontekstuwal na ideya ng isang natatanging kasuutan at ang mga alternatibo sa talababa. Pinalitan ang “humahagulhol” ng “habang sumisigaw” upang mapanatili ang malakas ngunit hindi labis na tinukoy na pag-iyak/pagsigaw ng זָעָקָה, at upang maipahayag ang nagpapatuloy na paglakad sa konstruksyong וַתֵּלֶךְ הָלוֹךְ.
