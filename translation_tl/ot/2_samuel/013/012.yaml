  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Hindi, kapatid ko! Huwag mo akong lapastanganin[a], sapagkat hindi ginagawa sa Israel ang ganitong bagay. Huwag mong gawin ang kasuklam-suklam na bagay na ito[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hamakin” o “gahasain.” Ang pandiwang Hebreo ay maaaring tumukoy sa seksuwal na paglabag at kasabay na kahihiyan o paghamak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lubhang kahiya-hiyang gawa” o “napakasamang gawa.” Ang salitang Hebreo ay tumutukoy sa isang gawaing sukdulang imoral at kahiya-hiya, hindi lamang sa kahangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Sinabi niya rito
  rationale: Likas na salaysay sa modernong Filipino; ipinahihiwatig ng “rito” ang lalaking kausap nang hindi inuulit ang pangalan.
- source_word: אַל אָחִי אַל
  choice: Huwag, kapatid ko! Huwag
  rationale: Pinananatili ang bigla at mariing pagtutol ng unang אַל at ang kasunod na tahasang pagbabawal. Mahalaga ang “kapatid ko” sa bigat ng tagpo.
- source_word: תְּעַנֵּנִי
  choice: lapastanganin
  rationale: Sa Piel at sa kontekstong ito, tumutukoy ang pandiwa sa seksuwal na paglabag na may kasamang paghamak at kahihiyan. Pinananatili ng “lapastanganin” ang lawak na iyon nang hindi tahasang nilulutas sa iisang kahulugan.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: sapagkat hindi ginagawa sa Israel ang ganitong bagay
  rationale: Ipinapahayag ng impersonal na Niphal ang kinikilalang pamantayang moral ng pamayanan; natural at malinaw ito sa Filipino.
- source_word: אַל תַּעֲשֵׂה
  choice: Huwag mong gawin
  rationale: Tuwirang katumbas ng pagbabawal at ang kasunod na layon ang nagbibigay ng moral na bigat.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ang kasuklam-suklam na bagay na ito
  rationale: Ang נְבָלָה ay isang kahiya-hiya at lubhang imoral na gawa, hindi simpleng kamangmangan. Malinaw na ipinahahayag ng “kasuklam-suklam” ang matinding moral na paghatol.
theological_decisions:
- issue: Ang pahayag na hindi ito ginagawa sa Israel
  choice: Pinanatili bilang apela sa pamantayang moral ng Israel
  alternative: Gawing tahasang pahayag tungkol sa kautusan ng Diyos
  rationale: Ang Hebreo ay tumutukoy sa kinikilalang kaugaliang moral ng Israel ngunit hindi tahasang bumabanggit ng isang partikular na kautusan; hindi dapat dagdagan ang sinabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang “lapastanganin” upang mapanatili ang seksuwal at kahihiyang mga pahiwatig ng Hebreo, na nililinaw sa talababa. Inilagay ang ikalawang pananda pagkatapos ng pariralang katumbas ng הַנְּבָלָה הַזֹּאת, sapagkat iyon ang salitang tinatalakay ng talababa.
