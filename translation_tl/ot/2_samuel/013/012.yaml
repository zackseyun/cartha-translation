  naturalness: Marangal, malinaw, at angkop sa modernong Filipino ang kabuuang rehistro. Mas likas ang “Hindi, kapatid ko” para sa unang mariing אַל kaysa sa nakabiting “Huwag,” na walang tahasang pandiwa sa unang sugnay.
  terminology: Ang “lapastanganin” ay maaaring magpahiwatig ng paglabag at paghamak, at ang talababa ay maayos na nagbibigay ng mas tiyak na seksuwal na mga alternatibo. Ang “kasuklam-suklam na bagay” ay sapat na matindi para sa moral na pagkasuklam at kahihiyang saklaw ng נבלה.
