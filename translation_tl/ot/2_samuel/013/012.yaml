  to: Sinabi niya sa kanya, “Hindi, kapatid ko! Huwag mo akong lapastanganin[a], sapagkat hindi ginagawa sa Israel ang ganitong bagay. Huwag mong gawin ang kasuklam-suklam na bagay na ito[b].”
