revisions:
- from: Sinabi sa kanya ni Jehonadab, “Humiga ka sa iyong higaan at magkunwari kang may sakit.[a] Kapag dumating ang iyong ama upang dalawin ka, sabihin mo sa kanya, ‘Pakisuyong papuntahin dito ang kapatid kong si Tamar upang bigyan niya ako ng pagkain,[b] at ipahanda mo sa kanya sa harap ko ang pagkaing para sa maysakit,[c] upang mapanood ko siya at makakain ako mula sa kanyang kamay.’”
  to: Sinabi sa kanya ni Jehonadab, “Humiga ka sa iyong higaan at magkunwari kang may sakit.[a] Kapag dumating ang iyong ama upang dalawin ka, sabihin mo sa kanya, ‘Pakiusap, papuntahin mo ang kapatid kong si Tamar upang bigyan niya ako ng pagkain,[b] at hayaan mong ihanda niya sa harap ko ang pagkaing para sa maysakit,[c] upang makita ko at makakain ako mula mismo sa kanyang kamay.’”
  rationale: Inayos ang sugnay tungkol sa paghahanda upang si Tamar, gaya sa Hebreo, ang malinaw na maghahanda ng pagkain at ang ama ang hihilingang pumayag dito. Pinalitan ang ‘mapanood ko siya’ ng walang-layong ‘upang makita ko’ upang huwag tukuyin nang lampas sa Hebreo ang bagay o taong nakikita. Pinanatili ang mga umiiral na footnote anchor at ang pagkakaiba ng pagbibigay ng pagkain at paghahanda nito.
