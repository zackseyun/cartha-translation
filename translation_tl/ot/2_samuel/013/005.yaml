  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: tl
  text: Sinabi sa kanya ni Jehonadab, “Humiga ka sa iyong higaan at magkunwari kang may sakit.[a] Kapag dumating ang iyong ama upang dalawin ka, sabihin mo sa kanya, ‘Pakiusap, papuntahin mo ang kapatid kong si Tamar upang bigyan niya ako ng pagkain,[b] at hayaan mong ihanda niya sa harap ko ang pagkaing para sa maysakit,[c] upang makita ko at makakain ako mula mismo sa kanyang kamay.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpanggap kang maysakit.” Ang pandiwang Hebreo rito ay tumutukoy sa pagpapakitang tila may sakit.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tinapay,” na madalas ding gamitin para sa pagkain sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay malamang na tumutukoy sa pagkaing espesyal na inihahanda para sa isang maysakit o nagpapagaling.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Humiga ka sa iyong higaan
  rationale: Tuwirang inilalarawan ng parirala ang paghiga sa sariling higaan; natural at marangal ito sa modernong Tagalog.
- source_word: וְהִתְחָל
  choice: magkunwari kang may sakit
  rationale: Sa konteksto, ang hitpael ng חלה ay nagpapahiwatig ng pagpapakitang may sakit, hindi ng tunay na pagkakasakit.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Kapag dumating ang iyong ama upang dalawin ka
  rationale: Ang sunod-sunod na tagubilin ay likas na ipinapahayag sa Tagalog sa kondisyong temporal na “kapag”; ang “dalawin” ay angkop sa pagpunta upang tingnan ang kalagayan ng maysakit.
- source_word: תָּבֹא נָא תָמָר אֲחוֹתִי
  choice: Pakisuyong papuntahin dito ang kapatid kong si Tamar
  rationale: Pinananatili ng “pakisuyo” ang magalang na pakiusap ng נָא, at nililinaw ng “papuntahin dito” na hinihiling sa ama na papuntahin si Tamar kay Amnon.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: upang bigyan niya ako ng pagkain
  rationale: Ang ברה ay tumutukoy sa pagbibigay ng pagkain o pagpapakain, samantalang ang לֶחֶם ay maaaring mangahulugang pagkain sa pangkalahatan; iniwasang ipaghalo ito sa עשה na kasunod na tumutukoy sa paghahanda.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: at ipahanda mo sa kanya sa harap ko ang pagkaing para sa maysakit
  rationale: Pinananatili ang paghahanda, ang literal na elementong nakikita ni Amnon, at ang malamang na diwa ng בִּרְיָה bilang pagkaing inihahanda para sa maysakit o nagpapagaling.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: upang mapanood ko siya
  rationale: Walang tahasang layon ang ראה sa Hebreo. Ang “mapanood ko siya” ay natural sa Tagalog at inuugnay ang pagkakita sa paghahanda nang hindi nagdaragdag ng “ito” na wala sa teksto.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: at makakain ako mula sa kanyang kamay
  rationale: Pinananatili ang mahalagang literal at pansalaysay na detalye na personal na manggagaling sa kamay ni Tamar ang pagkaing kakainin ni Amnon.
