    issue: Nababaligtad ng “ipahanda mo sa kanya” ang tagaganap at direksiyon ng paghahanda.
    rationale: 'Ang וְעָשְׂתָה ay si Tamar ang tagaganap: hinihiling ni Amnon na hayaan siyang maghanda ng pagkain sa harap niya. Ang kasalukuyang Tagalog ay karaniwang nangangahulugang ‘ipaghanda mo siya’ o ‘magpahanda ka para sa kanya.’'
  - severity: medium
    issue: Ang “mapanood ko siya” ay nagbibigay kay Tamar ng tahasang tungkuling layon ng pandiwang ‘makita.’
    rationale: Walang ipinahayag na layon ang אֶרְאֶה sa Hebreo. Sa konteksto ay maaaring inuunawa ang pagkain o ang paghahanda, ngunit hindi dapat gawing tahasang si Tamar ang pinanonood.
