translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “iyong/kanyang” sa pagsasalaysay para sa dignidad, habang nananatiling madaling maunawaan. Hindi nilutas nang labis ang bahagyang kalabuan ng ראה, at pinanatili ang pagkakaiba ng pagbibigay ng pagkain at paghahanda nito.
