  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: tl
  text: Ngunit mapilit siyang hinimok ni Absalom,[a] kaya ipinadala niya si Amnon at ang lahat ng mga anak na lalaki ng hari kasama ni Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinilit siya ni Absalom” o “napapayag siya ni Absalom.” Mas malakas ang idyomang Hebreo kaysa sa isang simpleng pakiusap at nagpapahiwatig ng patuloy na pamimilit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: patuloy siyang kinulit
  rationale: Idyoma ito na nagpapahiwatig ng mapilit at paulit-ulit na pangungumbinsi, hindi ng literal na ‘paglusob’ o ‘pagwasak.’ Ang ‘patuloy na kinulit’ ay natural sa modernong Filipino at pinananatili ang lakas ng pamimilit.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: וַיִּשְׁלַח
  choice: isinama niya
  rationale: Bagaman karaniwang nangangahulugang ‘ipinadala,’ sa konteksto ay pumayag si David na sumama kay Absalom ang mga anak ng hari. Ginagawang malinaw at natural ng ‘isinama niya kay Absalom’ ang direksiyon at kasama ng pagpapadala.
- source_word: אִתּוֹ
  choice: kay Absalom
  rationale: Literal na ‘kasama niya’; nilinaw ang tinutukoy na si Absalom upang maiwasan ang malabong panghalip sa Filipino.
- source_word: אֶת אַמְנוֹן
  choice: si Amnon
  rationale: Hindi isinasalin ang panandang tuwirang layon; ginagamit ang ‘si’ para sa pangalang pantangi bilang layon sa natural na Filipino.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: at ang lahat ng anak na lalaki ng hari
  rationale: Tumpak na ipinapahayag ang mga lalaking anak ng hari at pinananatili ang ugnayang pampamilya at maharlika.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang ‘patuloy siyang kinulit’ upang malinaw sa ordinaryong mambabasa ang mapilit na paghimok, habang inilalahad sa talababa ang mas pormal na mga alternatibo.
