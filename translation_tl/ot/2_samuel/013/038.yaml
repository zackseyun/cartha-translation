translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Pinanatili ang bahagyang ambiguity ng pang-ugnay sa pamamagitan ng talababa; ginawang natural ang Hebreong pahayag ng pananatili nang hindi binabago ang diwa.
