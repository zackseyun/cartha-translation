  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: tl
  text: Ngunit[a] tumakas si Absalom at pumunta sa Gesur, at nanatili siya roon nang tatlong taon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At tumakas si Absalom at pumunta sa Gesur.” Maaaring isalin ang pang-ugnay sa Hebreo bilang “at” o “ngunit,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “at siya ay naroon nang tatlong taon”; maaari ring isalin na “at nanatili siya roon nang tatlong taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֥וֹם
  choice: Ngunit si Absalom
  rationale: Maaaring mangahulugang “at” o magpahiwatig ng bahagyang pagsalungat ang ו ayon sa konteksto. Pinili ang “ngunit” bilang natural na pagpapatuloy na may bahagyang contrast.
- source_word: בָּרַ֖ח
  choice: tumakas
  rationale: Karaniwang kahulugan ng ברח ang pagtakas o paglayo upang umiwas sa panganib; malinaw at likas sa modernong Filipino ang “tumakas.”
- source_word: וַ/יֵּ֣לֶךְ
  choice: pumunta
  rationale: Tuwirang isinasalin ng “pumunta” ang pandiwang הלך sa sunod-sunod na salaysay.
- source_word: גְּשׁ֑וּר
  choice: Gesur
  rationale: Isinalin sa anyong transliterasyon na angkop sa bigkas at baybay sa Filipino.
- source_word: וַ/יְהִי שָׁ֖ם
  choice: at nanatili siya roon
  rationale: Literal na “at siya ay naroon,” ngunit sa pahayag ng tagal, likas at tumpak sa Filipino ang “nanatili siya roon.”
- source_word: שָׁלֹ֥שׁ שָׁנִֽים
  choice: nang tatlong taon
  rationale: Ipinapahayag ng parirala ang tagal; ginagamit ang “nang” upang maging natural ang ugnayan nito sa pandiwang “nanatili.”
