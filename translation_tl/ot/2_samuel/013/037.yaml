  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: tl
  text: Ngunit tumakas si Absalom at pumunta kay Talmai, anak ni Amihur, na hari ng Geshur. At nagluksa siya[a] para sa kanyang anak araw-araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang pinangalanan sa Hebreo ang tinutukoy ng “siya.” Batay sa konteksto, si David ang tinutukoy.
    reason: Paglilinaw sa hindi tahasang simuno habang pinananatili ang ambiguity ng tekstong Hebreo.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: Ngunit tumakas si Absalom
  rationale: Maaaring mangahulugang “at” ang pang-ugnay, ngunit ang “ngunit” ay natural na nagpapakita ng salungat na pag-unlad sa salaysay. Ang בָּרַח ay tuwirang isinaling “tumakas.”
- source_word: וַיֵּלֶךְ אֶל
  choice: at pumunta kay
  rationale: Karaniwan at tuwirang salin ito ng kilos na pagpunta sa isang tao; ang “kay” ang likas na pananda para sa pangalan ng tao sa Filipino.
- source_word: תַּלְמַי בֶּן עמיחור
  choice: Talmai na anak ni Amihur
  rationale: Pinanatili ang mga pangalang pantangi ayon sa anyo ng tekstong Hebreo at ginamit ang natural na hulma ng ugnayang mag-ama sa Filipino.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: ang hari ng Geshur
  rationale: Tinutukoy ng parirala si Talmai bilang hari ng Geshur; nilagyan ng “ang” upang maging malinaw at natural ang appositive sa Filipino.
- source_word: וַיִּתְאַבֵּל
  choice: At nagluksa siya
  rationale: Ang pandiwa ay tumutukoy sa pagluluksa dahil sa kamatayan. Hindi tahasang pinangalanan sa Hebreo ang simuno, kaya pinanatili ang panghalip at ipinaliwanag sa talababa ang kontekstuwal na tinutukoy.
- source_word: עַל בְּנוֹ
  choice: para sa kanyang anak
  rationale: Sa konteksto ng pagluluksa, natural na ipinapahayag ng “para sa” ang Hebreong עַל. Pinanatili ang isahang “anak” at ang hindi tahasang pinangalanang may-ari ng panghalip.
- source_word: כָּל הַיָּמִים
  choice: araw-araw
  rationale: Likas itong pagpapahayag sa modernong Filipino ng nagpapatuloy o paulit-ulit na pagluluksa sa buong panahong tinutukoy, nang hindi ipinapalagay na nangangahulugang buong natitirang buhay niya.
theological_decisions:
- issue: Hindi tahasang simuno ng וַיִּתְאַבֵּל
  choice: Pinanatili sa pangunahing teksto ang “siya,” na may talababa na nagsasabing si David ang nauunawaan mula sa konteksto.
  alternative: Tahasang isalin na “nagluksa si David.”
  rationale: Walang nakasaad na pangngalang simuno sa Hebreo. Ang konteksto ay tumuturo kay David, ngunit ang paglalagay ng pangalan sa pangunahing teksto ay mag-aalis sa tunay na implisitong katangian ng orihinal.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural sa karaniwang mambabasa. Pinanatili ang maikling ayos ng salaysay at iniwasang tahasang pangalanan sa pangunahing teksto ang implisitong simuno.
