  to: Ngunit sinabi niya sa kanya[a], “Huwag! Sapagkat ang malaking kasamaang ito—ang pagpapaalis mo sa akin—ay mas malubha kaysa sa isa pang kasamaang ginawa mo sa akin.” Ngunit hindi siya nakinig sa kanya.
