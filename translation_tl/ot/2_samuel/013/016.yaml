base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya[a], “Huwag! Sapagkat ang malaking kasamaang ito—ang pagpapaalis mo sa akin—ay mas malubha kaysa sa isa pang kasamaang ginawa mo sa akin.” Ngunit hindi siya nakinig sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, maaaring: “Hindi, sapagkat ang malaking kasamaang ito—ang pagpapaalis mo sa akin—ay mas malubha kaysa sa isa pang kasamaang ginawa mo sa akin.” Siksik at mahirap ang pagkakabuo ng Hebreo; ang unang salita ay maaari ring unawain bilang masidhing pagtutol o pagbabawal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Huwag!
  rationale: Karaniwang nagpapahayag ang אַל ng pagbabawal. Bagaman bitin at masidhi ang Hebreong pananalita rito, likas sa Tagalog ang nagsasariling “Huwag!” bilang apurahang pagtutol.
- source_word: אוֹדֹת
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o usaping batayan ng pagtutol ni Tamar; malinaw at natural dito ang “Sapagkat.”
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ang malaking kasamaang ito
  rationale: Pinananatili ng “kasamaan” ang moral na bigat ng רָעָה, at tuwirang inililipat ng “malaki” ang גְּדוֹלָה nang hindi inaalis ang kasunod na paghahambing.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: mas malala kaysa sa nauna mong ginawa sa akin
  rationale: Ang pambabaeng אַחֶרֶת ay tumutukoy sa isa pang naunang kasamaan na hindi na inuulit sa Hebreo. Ipinahihiwatig ito sa Tagalog sa “nauna mong ginawa” nang hindi tahasang dinaragdagan ang teksto.
- source_word: לְשַׁלְּחֵנִי
  choice: ang pagtataboy mo sa akin
  rationale: Sa konteksto, hindi lamang neutral na pagpapaalis kundi marahas na pagtataboy ang kilos; ang nominal na anyo ay akma bilang paliwanag sa “kasamaang ito.”
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Ngunit ayaw niya itong pakinggan
  rationale: Ipinapakita ng אָבָה ang kusang pagtanggi o kawalan ng pagnanais. Natural na Tagalog ang “ayaw ... pakinggan” at malinaw ang salungat na pagliko ng salaysay.
- source_word: לּוֹ
  choice: sa kanya
  rationale: Karaniwang Tagalog na katumbas ng di-tuwirang layon sa pambungad ng tuwirang pananalita.
