  source_fidelity: Ang “pagtataboy” ay mas marahas kaysa sa לְשַׁלְּחֵנִי, na dito ay mas ligtas na “pagpapaalis” o “pagpapauwi/pagpapadala palayo.” Ang “ayaw niya itong pakinggan” ay may malabong panghalip at hindi tuwirang naipapakita na si Tamar ang hindi niya pinakinggan. Pinananatili ng “Huwag!” ang masidhing, elliptikal na אַל nang hindi pinipilit ang pinagtatalunang pagsusuri nito.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Hindi siya nakinig sa kanya” at ang nominal na “ang pagpapaalis mo sa akin.” Ang “mas malubha kaysa sa isa pang kasamaang ginawa mo sa akin” ay malinaw na paghahambing nang hindi nagdaragdag ng detalye.
  terminology: Ang “kasamaan” ay katanggap-tanggap para sa רָעָה sa moral na kontekstong ito. Ginamit ang “pagpapaalis” sa halip na “pagtataboy” upang huwag dagdagan ang antas ng puwersa sa Hebreo.
