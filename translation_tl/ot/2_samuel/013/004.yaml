  text: וַ/יֹּ֣אמֶר ל֗/וֹ מַדּ֣וּעַ אַ֠תָּה כָּ֣כָה דַּ֤ל בֶּן הַ/מֶּ֨לֶךְ֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר הֲ/ל֖וֹא תַּגִּ֣יד לִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ אַמְנ֔וֹן אֶת תָּמָ֗ר אֲח֛וֹת אַבְשָׁלֹ֥ם אָחִ֖/י אֲנִ֥י אֹהֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: tl
  text: Sinabi niya sa kanya[a], “Bakit napakapayat mo, anak ng hari, tuwing umaga? Hindi mo ba sasabihin sa akin?” Sumagot sa kanya si Amnon, “Mahal ko si Tamar[b], na kapatid ng kapatid kong si Absalom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinabi ni Jonadab sa kanya.” Panghalip lamang ang gamit ng Hebreo; malinaw sa naunang talata na si Jonadab ang nagsasalita.
    reason: referent_clarification
  - marker: b
    text: O “Iniibig ko si Tamar” o “Naiibigan ko si Tamar.” Mas literal na sinasabi ng Hebreo, “Mahal ko si Tamar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Tuwirang tanong ito tungkol sa dahilan; ang “Bakit” ang natural at sapat na katumbas sa modernong Tagalog.
- source_word: כָּכָה דַּל
  choice: lalo kang nanghihina
  rationale: Ang דַּל dito ay tumutukoy sa kapansin-pansing pangangayayat o paghina, hindi sa kahirapan. Ang “lalo kang nanghihina” ay natural sa konteksto ng kalagayang lumalala sa bawat umaga.
- source_word: בֶּן הַמֶּלֶךְ
  choice: anak ng hari
  rationale: Pinananatili nito ang literal na ugnayan at ang retorikal na diin ng pagtawag kay Amnon bilang anak ng hari.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: umaga-araw
  rationale: Ipinahihiwatig ng inuulit na parirala ang pangyayaring nagaganap tuwing umaga. Ang “umaga-araw” ay maikli, dignified, at nagpapanatili ng paulit-ulit na diwa.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Hindi mo ba sasabihin sa akin?
  rationale: Ipinahahayag ng הֲלוֹא ang inaasahang pagsang-ayon at banayad na paghimok; natural itong naipapakita ng negatibong tanong sa Tagalog.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: na kapatid ng kapatid kong si Absalom
  rationale: Pinananatili nito ang pagkakaugnay ng mga salita sa Hebreo at ang diin kay Absalom bilang kapatid ni Amnon, bagaman sadyang kapansin-pansin ang pag-uulit ng “kapatid.”
- source_word: אֲנִי אֹהֵב
  choice: Mahal ko
  rationale: Ang אָהֵב ay karaniwang pandiwa para sa pag-ibig. Hindi dinaragdagan ng salin ang moral o sikolohikal na pagpapakahulugang hindi tahasang nasa sugnay.
theological_decisions:
- issue: Paglalarawan sa damdamin o pagnanasa ni Amnon kay Tamar
  choice: Mahal ko si Tamar
  alternative: Iniibig ko si Tamar; Naiibigan ko si Tamar; Hinahangad ko si Tamar
  rationale: Karaniwang pandiwa para sa “umibig/magmahal” ang אָהֵב. Pinananatili ng pangunahing teksto ang pahayag mismo ni Amnon nang hindi ipinapasok ang mas malakas na interpretasyon ng kaniyang pagnanasa mula sa kasunod na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “rito” upang maiwasan ang sunod-sunod na “sa kanya,” at pinanatili ang tahasang ugnayang pampamilya sa huling pangungusap. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
