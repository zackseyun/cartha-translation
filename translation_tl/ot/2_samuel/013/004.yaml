  naturalness: Natural ang karamihan ng salin, ngunit ang “umaga-araw” ay hindi karaniwang modernong Tagalog sa kahulugang ito. Ang “nanghihina” ay maaari, ngunit hindi malinaw na naihahatid ang nakikitang pangangayayat/pagkapayat ng דַּל; “namamayat” ang mas tuwiran at natural sa konteksto.
  terminology: Wasto ang mga pangalang Tamar at Absalom at ang “Mahal ko.” Ang “kapatid ng kapatid kong si Absalom” ay tapat ngunit mabigat; “kapatid ng kapatid kong si Absalom” ay maaaring panatilihin upang huwag burahin ang diin ng Hebreo.
