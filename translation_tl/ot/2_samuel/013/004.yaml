revisions:
- from: Sinabi niya rito[a], “Bakit lalo kang nanghihina, anak ng hari, umaga-araw? Hindi mo ba sasabihin sa akin?” Sumagot sa kanya si Amnon, “Mahal ko si Tamar[b], na kapatid ng kapatid kong si Absalom.”
  to: Sinabi niya sa kanya[a], “Bakit napakapayat mo, anak ng hari, tuwing umaga? Hindi mo ba sasabihin sa akin?” Sumagot sa kanya si Amnon, “Mahal ko si Tamar[b], na kapatid ng kapatid kong si Absalom.”
  rationale: Inayos ang maling deiktikong “rito” tungo sa “sa kanya,” at pinalitan ang di-natural na “umaga-araw” ng “tuwing umaga.” Ginawang “napakapayat mo” ang paglalarawan upang mas malinaw na maihatid ang visible physical decline na ipinahihiwatig ng דַּל, nang hindi ipinapasok ang karagdagang interpretasyon. Napanatili ang literal na “Mahal ko” at ang estrukturang pampamilya sa huling sugnay.
