  revised_text: Kaya ngayon, huwag isapuso ng panginoon kong hari ang bagay na ito[a], sa pag-aakalang, ‘Namatay ang lahat ng anak na lalaki ng hari,’ sapagkat si Amnon lamang ang namatay.
