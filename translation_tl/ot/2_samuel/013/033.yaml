base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: tl
  text: Kaya ngayon, huwag isapuso ng panginoon kong hari ang bagay na ito[a], sa pag-aakalang, ‘Namatay ang lahat ng anak na lalaki ng hari,’ sapagkat si Amnon lamang ang namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “huwag niyang ilagay sa kanyang puso ang bagay/salitang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbing panandang pandiskurso na nagpapakilala sa pagwawasto ni Jonadab; natural sa Filipino ang “Kaya ngayon” sa kontekstong ito.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: huwag isapuso ...
  rationale: Pinananatili ang larawang Hebreo tungkol sa paglalagay ng isang bagay sa puso, habang likas at malinaw sa makabagong Filipino.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Magalang na pananalita sa korte; pinananatili ang personal na “aking/kong” at ang titulong hari.
- source_word: דָּבָר
  choice: ang bagay na ito
  rationale: Malawak na katumbas na maaaring tumukoy sa balita o pahayag na pinag-uusapan nang hindi nililimitahan ang kahulugan.
- source_word: לֵאמֹר
  choice: at sabihing
  rationale: Tuwirang ipinapakilala ang nilalaman ng hindi dapat tanggapin ng hari bilang totoo.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: ang lahat ng anak na lalaki ng hari
  rationale: Tahasang ipinapakita ang kasariang panlalaki ng בְּנֵי sa kontekstong ito at iniiwasang mapagkamalang lahat ng anak, kasama ang mga anak na babae.
- source_word: מֵתוּ
  choice: Namatay
  rationale: Natural na Filipino para sa iniulat na pangyayari; malinaw ang bunga na sila ay patay na.
- source_word: כִּי אִם
  choice: sapagkat ... lamang
  rationale: 'Ipinahahayag ang corrective at exclusive na diwa: hindi lahat, kundi si Amnon lamang.'
- source_word: לְבַדּוֹ
  choice: lamang
  rationale: Likas na paraan sa Filipino upang idiin ang pagiging tanging namatay ni Amnon.
- source_word: מֵת
  choice: namatay
  rationale: Pinananatili ang tuwirang kaibahan sa naunang maling balita at natural sa salaysay na Filipino.
