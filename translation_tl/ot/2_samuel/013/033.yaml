  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “isapuso” upang mapanatili ang idyomang Hebreo nang hindi nagiging mekanikal; ang “panginoon kong hari” ay nagpapanatili ng magalang na pananalita sa korte.
