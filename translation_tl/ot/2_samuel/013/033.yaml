revisions:
- from: Kaya ngayon, huwag isapuso ng panginoon kong hari ang bagay na ito[a] at sabihing, ‘Namatay ang lahat ng anak na lalaki ng hari,’ sapagkat si Amnon lamang ang namatay.
  to: Kaya ngayon, huwag isapuso ng panginoon kong hari ang bagay na ito[a], sa pag-aakalang, ‘Namatay ang lahat ng anak na lalaki ng hari,’ sapagkat si Amnon lamang ang namatay.
  rationale: Pinalitan ang “at sabihing” ng “sa pag-aakalang” upang malinaw na ang kasunod na sipi ang nilalaman ng maling ulat na hindi dapat isapuso ng hari. Hindi binago ang kahulugan, mga pangalan, o antas ng paggalang ng orihinal.
