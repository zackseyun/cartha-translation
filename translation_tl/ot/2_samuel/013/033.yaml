  source_fidelity: 'Tumpak na naihahatid ng draft ang pagwawasto ni Jonadab: hindi lahat ng mga anak na lalaki ng hari ang namatay, kundi si Amnon lamang. Gayunman, ang “at sabihing” ay maaaring magmukhang ikalawang utos na huwag magsalita ang hari, samantalang ipinakikilala ng לֵאמֹר ang nilalaman ng maling akalang hindi niya dapat isapuso.'
  naturalness: Marangal at malinaw sa pangkalahatan. Mas natural at mas malinaw ang “sa pag-aakalang” upang iugnay ang sipi sa bagay na hindi dapat isapuso.
  terminology: Ang “panginoon kong hari,” “isapuso,” at “anak na lalaki” ay angkop sa magalang na rehistro at sa kahulugan ng Hebreo. Ang “isapuso” ay mahusay na idyomatikong katumbas ng “ilagay sa puso.”
  issues:
