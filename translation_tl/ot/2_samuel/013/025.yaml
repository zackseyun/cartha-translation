  to: Ngunit sinabi ng hari kay Absalom, “Huwag na, anak ko. Huwag na kaming lahat pumunta, upang hindi kami maging pabigat sa iyo.” Mariing hinimok siya ni Absalom, ngunit ayaw pumunta ng hari; kaya binasbasan niya si Absalom.
