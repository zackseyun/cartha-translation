  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: tl
  text: Ngunit sinabi ng hari kay Absalom, “Huwag na, anak ko. Huwag na kaming lahat pumunta, upang hindi kami maging pabigat sa iyo.” Mariing hinimok siya ni Absalom, ngunit ayaw pumunta ng hari; kaya binasbasan niya si Absalom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל בְּנִי אַל נָא
  choice: Huwag na, anak ko. Huwag na
  rationale: Natural na inuulit sa Filipino ang magalang ngunit mariing pagtanggi, habang pinananatili ang magiliw na tawag na “anak ko” at ang pakiusap na ipinahihiwatig ng נָא.
- source_word: נִכְבַּד עָלֶיךָ
  choice: maging pabigat sa iyo
  rationale: Ang literal na larawang “maging mabigat sa iyo” ay idyomatikong tumutukoy sa pagpapabigat ng gastusin o paghahanda kay Absalom.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Pinilit siya ni Absalom
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang mariing humimok o nagpumilit sa isang tao; nilinaw ang paksa upang maiwasan ang kalituhan sa mga panghalip.
- source_word: וַיְבָרֲכֵהוּ
  choice: binasbasan niya ito
  rationale: 'Pinananatili ang karaniwang biblikal na kahulugan ng ברך: ang hari ay nagbigay ng basbas kay Absalom.'
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na magalang at marangal. Ginamit ang “sumama” sa halip na literal na “pumunta” dahil ang usapan ay tungkol sa pagsama ng hari at ng buong sambahayan kay Absalom. Ang “ni Absalom” at “ito” ay nagpapalinaw sa salit-salitang tinutukoy ng mga panghalip sa Hebreo nang hindi nagdaragdag ng bagong impormasyon.
