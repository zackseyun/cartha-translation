  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: tl
  text: Pumunta si Absalom sa hari at sinabi, “Narito, may mga manggugupit ng tupa ang iyong lingkod. Sumama sana ang hari at ang kanyang mga lingkod sa iyong lingkod.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה־נָא
  choice: Narito
  rationale: Pinananatili ang pantawag-pansin ng הִנֵּה sa natural at marangal na Filipino; ang magalang na pakiusap na ipinahihiwatig ng נָא ay malinaw na naihahayag sa kasunod na “sana.”
- source_word: גֹזְזִים
  choice: mga manggugupit ng tupa
  rationale: Ang konteksto ay paggugupit ng balahibo ng mga tupa; nililinaw ng “ng tupa” ang kahulugan na likas na ipinahihiwatig ng salitang Hebreo.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Pinananatili ang magalang na pagtukoy ni Absalom sa sarili sa ikatlong panauhan, gaya ng Hebreo.
- source_word: יֵלֶךְ־נָא
  choice: Isama sana ... at sumama
  rationale: Isinasalin ang jussive na may נָא bilang magalang na paanyaya. Inayos ang pangungusap upang natural na maipahayag na kapwa pupunta ang hari at ang kanyang mga lingkod.
