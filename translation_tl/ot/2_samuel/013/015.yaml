  source_fidelity: Tumpak ang pangunahing diwa, ang paghahambing ng pagkamuhi at dating pag-ibig, at ang biglang utos. Gayunman, ang “rito” ay deiktik na “sa lugar/taong ito” at hindi angkop na katumbas ng hulaping “siya” sa Hebreo; nagiging malabo at di-likas ang “pag-ibig na iniibig niya rito noon.”
  naturalness: May ilang di-likas na konstruksiyon sa draft, lalo na ang paulit-ulit na “rito” para kay Tamar. Ang rebisyon ay gumagamit ng “sa kanya” at ng natural na “dati niyang iniukol sa kanya,” habang pinananatili ang mariing pag-uulit sa unang sugnay.
  terminology: Ang “kinamuhian/pagkamuhi” ay angkop para sa שׂנא/שׂנאה at naghahatid ng matinding pagkapoot. Ang “pag-ibig” ay angkop para sa אַהֲבָה. Pinanatili ang pangalang Tamar para sa malinaw na pagtukoy sa babaeng tinutukoy ng hulaping Hebreo.
  issues:
