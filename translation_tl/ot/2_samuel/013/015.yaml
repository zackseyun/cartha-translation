translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Pinanatili ang biglang pagbabago mula sa tinatawag na pag-ibig tungo sa matinding pagkamuhi, pati ang maikli at malupit na dalawang utos. Ginamit ang “rito” para sa taong malapit sa konteksto at upang maiwasan ang paulit-ulit na “sa kanya.”
