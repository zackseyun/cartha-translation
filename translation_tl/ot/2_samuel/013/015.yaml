base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: tl
  text: Pagkatapos, labis na kinamuhian ni Amnon si Tamar—sa isang napakatinding pagkamuhi[a]—sapagkat ang pagkamuhi niya sa kanya ay mas matindi kaysa sa pag-ibig na dati niyang iniukol sa kanya. Sinabi ni Amnon sa kanya, “Tumayo ka, umalis ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mariing inuulit ang salitang-ugat ng “mamuhi”: literal, “kinamuhian niya siya nang napakatinding pagkamuhi.”'
    reason: Ipinakikita ang Hebreong emphatic repetition na bahagyang pinakinis sa natural na Tagalog.
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: Pagkatapos, labis na kinamuhian ni Amnon si Tamar
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, kaya natural ang “Pagkatapos.” Ang שׂנא ay “mamuhi,” at ang hulaping 3fs ay tumutukoy kay Tamar. Ginamit ang pangalan upang maging malinaw ang tinutukoy sa Tagalog.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: masidhing pagkamuhi
  rationale: Ito ay pariralang nagpapalakas sa tindi ng pandiwang “kinamuhian.” Ang “labis na kinamuhian … masidhing pagkamuhi” ay nagpapanatili sa Hebreong pag-uulit at diin nang hindi nagiging lubhang di-likas sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag o dahilan para sa naunang pahayag. Ang “sapagkat” ay malinaw, marangal, at likas sa ganitong salaysay.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: mas matindi ang pagkamuhi ... kaysa sa pag-ibig
  rationale: Ang מִן ay naghuhudyat ng paghahambing. Ang “mas matindi … kaysa” ay malinaw na naghahatid ng komparatibong diwa.
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: pagkamuhi niya rito
  rationale: Pinananatili nito ang ugnayan ng pangngalang “pagkamuhi” at ng kilos na ginawa kay Tamar, ngunit iniiwasan ang napakabigat na literal na “pagkamuhi na ikinamuhian niya sa kanya.”
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: pag-ibig na iniibig niya rito noon
  rationale: Pinananatili ang kapansin-pansing pag-uulit ng pangngalan at pandiwa sa Hebreo. Ang “noon” ay nagpapahiwatig na ang pag-ibig na iyon ay nauna sa kasalukuyang pagkamuhi.
- source_word: קוּמִי
  choice: Tumayo ka
  rationale: Pautos na pambabaeng isahan. Ang “Tumayo ka” ay tuwiran at nagpapanatili sa biglang utos.
- source_word: לֵכִי
  choice: Umalis ka
  rationale: Bagaman literal na “pumunta ka,” sa konteksto ay utos itong lumayo o umalis. Ang “Umalis ka” ay natural na Tagalog at pinananatili ang marahas at maikling pagpapaalis.
