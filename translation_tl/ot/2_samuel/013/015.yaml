    issue: Ginamit ang “rito” bilang pantukoy kay Tamar.
    rationale: Ang “rito” ay karaniwang nangangahulugang “sa/dito sa lugar na ito” o may deiktik na puwersa, hindi simpleng obhetong “sa kanya.” Dahil dito, hindi natural at maaaring mali ang ugnayan ng pandiwa at obheto sa dalawang parirala.
  - severity: medium
    issue: Hindi likas ang “pag-ibig na iniibig niya rito noon.”
    rationale: Hindi karaniwang inilalarawan sa Tagalog ang “pag-ibig” bilang “iniibig ... rito”; hindi rin malinaw na si Tamar ang minahal. Ang “pag-ibig na dati niyang iniukol sa kanya” ay malinaw at nagpapanatili sa naunang panahon ng pag-ibig.
