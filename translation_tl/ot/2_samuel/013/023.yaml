  text: וַֽ/יְהִי֙ לִ/שְׁנָתַ֣יִם יָמִ֔ים וַ/יִּהְי֤וּ גֹֽזְזִים֙ לְ/אַבְשָׁל֔וֹם בְּ/בַ֥עַל חָצ֖וֹר אֲשֶׁ֣ר עִם אֶפְרָ֑יִם וַ/יִּקְרָ֥א אַבְשָׁל֖וֹם לְ/כָל בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: tl
  text: Pagkalipas ng dalawang buong taon[a], may mga manggugupit ng tupa si Absalom sa Baal-Hazor, na malapit sa Efraim, at inanyayahan niya ang lahat ng anak na lalaki ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pagkalipas ng dalawang taon ng mga araw,” isang idyomang nangangahulugang isang buong yugto ng dalawang taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: pagkalipas ng dalawang buong taon
  rationale: Ipinahahayag nang natural sa Filipino ang isang ganap at natapos na dalawang-taóng yugto, habang itinatala sa talababa ang literal na idyomang Hebreo.
- source_word: גֹזְזִים
  choice: mga manggugupit ng tupa
  rationale: Ang pandiwaring mula sa גזז ay tumutukoy rito sa mga taong gumugupit ng balahibo ng mga tupa; nililinaw ng “ng tupa” ang ipinahihiwatig na layon.
- source_word: בְּבַעַל חָצוֹר
  choice: sa Baal-Hazor
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon; natural ang “sa” para sa pook ng gawain.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: na malapit sa Efraim
  rationale: Ang עִם ay nagpapahiwatig dito ng heograpikong pagkalapit o pagkakaugnay, hindi literal na “kasama.”
- source_word: וַיִּקְרָא
  choice: inanyayahan
  rationale: Bagaman pangunahing nangangahulugang “tumawag,” ang gamit nito sa konteksto ay pag-anyaya sa mga anak ng hari sa okasyon.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: ang lahat ng anak na lalaki ng hari
  rationale: Malinaw na pinananatili ang panlalaking anyo ng בְּנֵי at ang kaugnayang maharlika.
- source_word: וַיְהִי
  choice: pagkalipas
  rationale: Ang karaniwang panandang pasalaysay ay likas na naisasama sa sugnay na temporal sa Filipino; hindi dinaragdagan ng salitang “ngayon” na wala naman sa pinagmulan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang Baal-Hazor at Efraim sa karaniwang anyong transliterado. Ang “may mga manggugupit ng tupa si Absalom” ay malapit sa estruktura ng Hebreo at hindi tahasang nagpapasiya kung ang tinutukoy ay ang mga manggagawa lamang o ang buong pagdiriwang ng paggugupit.
