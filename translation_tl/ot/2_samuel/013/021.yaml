  yaml_path: translation/ot/2_samuel/013/021.yaml
  text: When King David heard all these things[a], he was very angry.
translation:
  language: tl
  text: Nang marinig ni Haring David ang lahat ng nangyaring ito, labis siyang nagalit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at nagliyab ito sa kaniya nang matindi,” ibig sabihin, nag-alab nang matindi ang kaniyang galit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Nang ... ni Haring David
  rationale: Sa daloy ng salaysay, natural na ipinapahayag ng “nang” ang pagkakasunod ng pagkarinig at pagkapoot, habang malinaw na pinananatili ang titulong “Haring David.”
- source_word: שָׁמַע
  choice: marinig
  rationale: Tuwirang katumbas ng pandiwang “makarinig”; sa konteksto, tumutukoy ito sa pagkatanggap ni David ng balita tungkol sa mga pangyayari.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: ang lahat ng nangyaring ito
  rationale: Ang דְּבָרִים ay maaaring mangahulugang mga salita, bagay, usapin, o pangyayari. Dito, ang tinutukoy ay ang mga naunang pangyayari kina Tamar at Amnon, kaya malinaw at natural ang “lahat ng nangyaring ito.”
- source_word: וַ/יִּחַר ל֖/וֹ מְאֹד
  choice: labis siyang nagalit
  rationale: Ang Hebreong idyoma ay literal na nagsasaad na “nagliyab ito sa kaniya nang matindi,” na tumutukoy sa matinding galit. Ang “labis siyang nagalit” ay natural sa modernong Tagalog at hindi nagdaragdag ng tahasang pangngalang wala sa Hebreo.
