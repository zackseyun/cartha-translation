translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nangyaring” upang maipakita na ang דְּבָרִים ay tumutukoy rito sa mga pangyayari, at pinanatili sa talababa ang larawan ng pagliyab sa Hebreong idyoma.
