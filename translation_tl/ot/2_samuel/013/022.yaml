  text: וְ/לֹֽא דִבֶּ֧ר אַבְשָׁל֛וֹם עִם אַמְנ֖וֹן לְ/מֵ/רָ֣ע וְ/עַד ט֑וֹב כִּֽי שָׂנֵ֤א אַבְשָׁלוֹם֙ אֶת אַמְנ֔וֹן עַל דְּבַר֙ אֲשֶׁ֣ר עִנָּ֔ה אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: tl
  text: At walang sinabi si Absalom kay Amnon, masama man o mabuti, sapagkat kinasuklaman ni Absalom si Amnon dahil nilapastangan nito si Tamar na kapatid niyang babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinahiya” o “hinamak.” Sa kontekstong ito, tumutukoy ang pandiwang Hebreo sa seksuwal na paglapastangan ni Amnon kay Tamar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: nagsalita ... kay
  rationale: Likas sa modernong Filipino ang “magsalita kay” para sa pakikipag-usap sa isang tao, habang nananatiling malapit sa Hebreong pandiwa at pang-ukol.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: maging masama man o mabuti
  rationale: Pinananatili nito ang magkasalungat na mga dulo ng Hebreong idyoma, na sa konteksto ay nangangahulugang wala siyang anumang sinabi kay Amnon.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng hindi pagsasalita ni Absalom.
- source_word: שָׂנֵא
  choice: kinapootan
  rationale: Tuwiran at matindi itong katumbas ng pandiwang Hebreo para sa pagkapoot, at ang aspektong naganap ay angkop sa salaysay.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: dahil
  rationale: Natural at malinaw sa Filipino ang payak na panandang sanhi; naipahihiwatig nito ang “dahil sa bagay na ginawa” nang hindi mabigat ang pagkakabuo.
- source_word: עִנָּה
  choice: nilapastangan
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa seksuwal na paglabag at pagpapahiya kay Tamar. Ipinahahayag ng “nilapastangan” ang karahasan at pagyurak sa dangal nang hindi ginagawang mas tiyak ang legal na katawagan kaysa sa sugnay na Hebreo.
- source_word: אֲחֹתוֹ
  choice: kanyang kapatid
  rationale: Ang hulapi ay tumutukoy kay Absalom. Malinaw sa daloy ng pangungusap na si Tamar ang kapatid ni Absalom.
