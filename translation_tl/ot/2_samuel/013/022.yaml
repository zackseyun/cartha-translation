translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang Hebreong idyoma sa pangunahing teksto at ipinaliwanag ito sa talababa; iniwasan ang malabo o di-natural na dobleng paggamit ng “dahil.”
