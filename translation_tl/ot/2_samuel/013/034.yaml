base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: tl
  text: Ngunit tumakas si Absalom. Tumingala ang binatang nagbabantay[a] at nakita niya, at narito, maraming taong dumarating sa daang nasa likuran niya, mula sa gilid ng bundok.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang binatang lingkod na nagmamatyag” o “ang bantay.” Pinagsasama sa Hebreo ang salitang maaaring mangahulugang “binata” o “lingkod” at ang salitang “nagmamatyag” o “nagbabantay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mula sa daang nasa likuran niya, sa gilid ng bundok.” Siksik at hindi lubos na tiyak ang ugnayang panglokasyon ng mga parirala sa Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: tumakas
  rationale: Ipinahahayag ng ברח ang pagtakas o paglayo upang makaiwas; likas at tuwiran ang “tumakas” sa makabagong salaysay.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: ang binatang nagbabantay
  rationale: Pinananatili ng “binata” ang נַעַר at ng “nagbabantay” ang participle na צֹפֶה, nang hindi ipinapalagay na may pormal siyang katungkulang bantay.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: tumingala
  rationale: Likas na katumbas sa Filipino ng idyomang Hebreo na literal na “itinaas ang kaniyang mga mata.”
- source_word: וַיַּרְא וְהִנֵּה
  choice: at nakita niyang
  rationale: Sa Filipino, natural na naihahatid ng ayos na ito ang biglaang pagkakita; hindi na kailangang tumbasan nang hiwalay ang הִנֵּה ng isang makalumang pantawag-pansin.
- source_word: עַם רַב
  choice: maraming tao
  rationale: Tuwirang ipinapahayag ang kolektibong עַם at ang dami na isinasaad ng רַב nang hindi dinaragdagan ang diwa ng isang organisadong pulutong.
- source_word: הֹלְכִים
  choice: dumarating
  rationale: Bagaman literal na “naglalakad/pumaparoon,” ang pangkat ay nakikitang papalapit mula sa pananaw ng nagbabantay, kaya natural ang “dumarating.”
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: sa daang nasa likuran niya, mula sa gilid ng bundok
  rationale: Malapit ito sa siksik at medyo malabong paglalarawang pangkalawakan ng Hebreo, habang nananatiling mauunawaan sa Filipino.
