translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa salaysay. Ginamit ang “tunika” upang tukuyin ang partikular na uri ng kasuotan at nilagyan ng talababa dahil hindi tiyak ang kahulugan ng terminong Hebreo. Walang idinagdag na pambungad na “Ngayon” sapagkat walang katumbas na tahasang temporal na salita sa pinagmulan.
