base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: tl
  text: Nakasuot siya ng maringal na tunika[a], sapagkat ganito manamit ang mga birheng anak na babae ng hari. Pagkatapos, inilabas siya ng tagapaglingkod ni Amnon at ikinandado ang pinto sa likuran niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunikang may maraming palamuti,” “tunikang sari-sari ang kulay,” o “mahabang tunikang may manggas”; hindi tiyak ang eksaktong anyo ng kasuotang tinutukoy ng pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: maringal na tunika
  rationale: Tumutukoy ang parirala sa isang natatangi at marangal na kasuotan, ngunit hindi tiyak kung ang diin ay nasa palamuti, mga kulay, haba, o manggas. Pinananatili sa talababa ang mahahalagang alternatibo.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: sapagkat ganito manamit
  rationale: Likas na ipinahahayag sa modernong Tagalog ang nakaugaliang paraan ng pananamit sa ganitong konstruksyon.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: mga dalagang anak ng hari
  rationale: Sa konteksto, ang “dalaga” ay natural at dignified na Tagalog para sa mga anak na babaeng birhen, habang pinananatili ang katayuang maharlika.
- source_word: מְעִילִים
  choice: ipinahiwatig sa paglalarawan ng pananamit
  rationale: Ang anyong maramihan ay tumutukoy sa mga balabal o panlabas na kasuotan. Hindi na ito inuulit bilang hiwalay na parirala upang maiwasan ang alanganing pag-uulit, habang nananatili ang diwa ng pangungusap.
- source_word: מְשָׁרְתוֹ
  choice: tagapaglingkod ni Amnon
  rationale: Ang salita ay tumutukoy sa personal na tagapaglingkod ng lalaking nabanggit sa konteksto. Ginawang tahasan ang reperenteng si Amnon upang maging malinaw sa Tagalog.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: inilabas siya
  rationale: Direkta at natural itong katumbas ng causative na pagpapalabas sa babae, nang hindi dinaragdagan ang tindi bilang “itinaboy.”
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: isinara nang may kandado ang pinto sa likuran niya
  rationale: Ipinahahayag ng נעל ang pagla-lock o pagtrangka, hindi lamang ang simpleng pagsasara. Malinaw ang parirala sa karaniwang modernong Tagalog.
