  text: וַ/תְּכַל֙ דָּוִ֣ד הַ/מֶּ֔לֶךְ לָ/צֵ֖את אֶל אַבְשָׁל֑וֹם כִּֽי נִחַ֥ם עַל אַמְנ֖וֹן כִּֽי מֵֽת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: tl
  text: At nasabik si Haring David na puntahan si Absalom[a], sapagkat napawi na ang kanyang pagdadalamhati kay Amnon, yamang patay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At tumigil si Haring David sa paglabas laban kay Absalom.” Mahirap at malabo ang Hebreo rito.'
    reason: Pinananatili ang tunay na leksikal at sintaktikong kalabuan ng tekstong Hebreo.
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל
  choice: nasabik ... na puntahan
  rationale: Ang anyo sa tekstong Masoretiko ay mahirap at maaaring unawain bilang matinding pananabik na lumapit o pumunta kay Absalom. Pinananatili ng saling ito ang pagbasa ng English POB at umaangkop sa konteksto ng 14:1, habang inilalagay sa talababa ang tunay na alternatibong pagbasa.
- source_word: נִחַם עַל אַמְנוֹן
  choice: napawi na ang kanyang pagdadalamhati kay Amnon
  rationale: Ipinahahayag nito sa likas na modernong Tagalog ang ideya ng pagkaaliw o pagkalubag tungkol kay Amnon, nang hindi ipinahihiwatig na nalimutan ni David ang nangyari.
- source_word: כִּי מֵת
  choice: yamang patay na ito
  rationale: Ang 'yamang' ay nagpapanatili sa sanhi o paliwanag na ipinahahayag ng כִּי, at malinaw na si Amnon ang tinutukoy ng 'ito.'
theological_decisions:
- issue: Kung nanabik ba si David kay Absalom o tumigil siyang kumilos laban sa kanya
  choice: nasabik si Haring David na puntahan si Absalom
  alternative: tumigil si Haring David sa paglabas laban kay Absalom
  rationale: Malabo at mahirap ang Hebreong parirala, at may dalawang matagal nang kinikilalang pagbasa. Ang pangunahing teksto ay sumusunod sa pagbasa ng pananabik, na sinusuportahan ng kasunod na konteksto, ngunit hindi itinatago ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “puntahan” sa halip na literal na “lumabas patungo” upang maging likas sa Tagalog; ginamit ang “pagdadalamhati” upang malinaw na maipahayag ang pagkaaliw ni David tungkol sa namatay na si Amnon.
