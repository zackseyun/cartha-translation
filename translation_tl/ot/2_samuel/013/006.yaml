base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: tl
  text: Kaya nahiga si Amnon at nagkunwaring may sakit. Nang dumating ang hari upang tingnan siya, sinabi ni Amnon sa hari, “Pakiusap, papuntahin ninyo rito ang kapatid kong si Tamar upang gumawa siya ng dalawang tinapay[a] sa harap ko, upang makakain ako mula sa kanyang kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawang keyk” o “dalawang pastry”; hindi tiyak kung anong uri ng pagkain ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahiga
  rationale: Ipinahihiwatig ng pandiwa na humiga si Amnon bilang bahagi ng kanyang pagpapanggap; maikli at natural ang “nahiga” sa salaysay.
- source_word: וַיִּתְחָל
  choice: nagkunwaring may sakit
  rationale: Sa konteksto, hindi tunay na nagkasakit si Amnon kundi nagpanggap upang linlangin ang hari.
- source_word: לִרְאֹתוֹ
  choice: upang tingnan siya
  rationale: Pinananatili nito ang tuwirang kahulugan ng ראה, bagaman sa konteksto ay pagdalaw din ito sa isang inaakalang maysakit.
- source_word: תָּבוֹא נָא
  choice: Pakisuyong papuntahin dito
  rationale: Ipinapahayag ng נָא ang magalang na pakiusap, at ang causative na anyong Filipino ay angkop dahil sa hari inihaharap ang kahilingang papuntahin si Tamar.
- source_word: תָּמָר אֲחֹתִי
  choice: ang kapatid kong si Tamar
  rationale: Ito ang natural at malinaw na ayos sa modernong Tagalog.
- source_word: וּתְלַבֵּב
  choice: pagawain siya
  rationale: Bihira ang pandiwang Hebreo at kaugnay ito ng paghahanda ng pagkaing לְבִבוֹת; iniiwasan ng pangkalahatang “pagawain” ang sobrang pagtukoy sa paraang panluto.
- source_word: לְעֵינַי
  choice: sa harap ko
  rationale: Natural nitong ipinapahayag na nais ni Amnon na makita mismo ang paghahanda, habang pinananatili ang konkretong diwa ng pariralang Hebreo.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: dalawang tinapay
  rationale: Tumutukoy ang לְבִבוֹת sa isang uri ng inihandang pagkaing parang tinapay o keyk, ngunit hindi tiyak ang eksaktong anyo; inilagay ang mga alternatibo sa talababa.
- source_word: וְאֶבְרֶה
  choice: upang makakain ako
  rationale: Malinaw at natural itong nagsasaad ng layunin ng kahilingan ni Amnon.
- source_word: מִיָּדָהּ
  choice: mula sa kamay niya
  rationale: Pinananatili nito ang isahang “kamay” at ang personal na pagpapakain o pag-aabot na ipinahihiwatig ng Hebreo.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Tagalog. Pinanatili ang “mula sa kamay niya” upang huwag mawala ang personal at mapanlinlang na lapit ng kahilingan ni Amnon. Inilagay ang talababa pagkatapos ng “dalawang tinapay,” ang salitang aktuwal na nangangailangan ng paliwanag.
