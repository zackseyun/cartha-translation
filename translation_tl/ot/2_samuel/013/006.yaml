revisions:
- from: Kaya nahiga si Amnon at nagkunwaring may sakit. Nang dumating ang hari upang tingnan siya, sinabi ni Amnon sa hari, “Pakisuyong papuntahin dito ang kapatid kong si Tamar at pagawain siya ng dalawang tinapay[a] sa harap ko, upang makakain ako mula sa kamay niya.”
  to: Kaya nahiga si Amnon at nagkunwaring may sakit. Nang dumating ang hari upang tingnan siya, sinabi ni Amnon sa hari, “Pakiusap, papuntahin ninyo rito ang kapatid kong si Tamar upang gumawa siya ng dalawang tinapay[a] sa harap ko, upang makakain ako mula sa kanyang kamay.”
  rationale: Pinalitan ang hindi gaanong malinaw na causative na “pagawain siya” ng sugnay na tahasang nagsasabing si Tamar ang gagawa ng pagkain. Pinanatili ang magalang na kahilingan sa hari, ang presensiya ni Tamar “sa harap ko,” ang bilang na dalawa, at ang literal na “mula sa kanyang kamay.”
