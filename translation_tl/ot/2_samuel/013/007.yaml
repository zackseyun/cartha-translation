  to: Pagkatapos, nagpadala si David ng mensahe kay Tamar sa bahay[a], na nagsasabi, “Pumunta ka, pakiusap, sa bahay ng kapatid mong si Amnon at ipaghanda mo siya ng pagkaing pampalakas.”
