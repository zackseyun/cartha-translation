base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: tl
  text: Pagkatapos, nagpadala si David ng mensahe kay Tamar sa bahay[a], na nagsasabi, “Pumunta ka, pakiusap, sa bahay ng kapatid mong si Amnon at ipaghanda mo siya ng pagkaing pampalakas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa bahay.” Hindi tahasang sinasabi sa Hebreo kung kaninong bahay ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala ... ng mensahe
  rationale: Ang pandiwa ay literal na ‘nagpadala,’ ngunit dahil sinusundan ito ng patungkol kay Tamar at ng mensaheng ipinapasabi, likas sa Tagalog ang ‘nagpadala ng mensahe.’
- source_word: הַבַּיְתָה
  choice: sa bahay
  rationale: May hulaping paturol ang salita, kaya maaari itong mangahulugang ‘patungo sa bahay’; gayunman, sa konteksto, ipinadala ang mensahe kay Tamar kung nasaan siya. Pinananatili ng ‘sa bahay’ ang maikling pahayag at ang ilang kalabuan kung aling bahay ang tinutukoy.
- source_word: לְכִי נָא
  choice: Pumaroon ka sana
  rationale: Ang pambabaeng isahang pautos na לְכִי ay ‘pumaroon ka,’ at pinalalambot ng נָא ang utos. Ipinahahayag ito ng ‘sana’ bilang magalang ngunit may awtoridad na pakiusap.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: sa bahay ng kapatid mong si Amnon
  rationale: Malinaw at likas na Tagalog ito para sa literal na ‘bahay ni Amnon na kapatid mo,’ habang pinananatili ang ugnayang pampamilya.
- source_word: וַעֲשִׂי לוֹ
  choice: ipaghanda mo siya
  rationale: Malawak ang kahulugan ng עשה na ‘gawin,’ ngunit sa kontekstong pagkain ay likas ang ‘ipaghanda.’ Isinasama ng anyong ipag- ang benepaktibong לוֹ, ‘para sa kaniya.’
- source_word: הַבִּרְיָה
  choice: pagkaing pampalakas
  rationale: Tumutukoy ang bihirang pangngalan sa pagkaing inihahanda para sa maysakit o nagpapagaling. Mas tumpak ang ‘pagkaing pampalakas’ kaysa pangkalahatang ‘pagkain,’ nang hindi tinutukoy ang eksaktong putahe.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang ‘pumaroon’ upang malinaw na ipahiwatig ang pagpunta sa ibang bahay; ang ‘sana’ ay nagpapalambot sa utos. Pinanatili ang kalabuan ng הַבַּיְתָה sa talababa.
