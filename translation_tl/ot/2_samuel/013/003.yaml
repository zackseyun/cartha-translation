id: 2SA.13.3
reference: 2 Samuel 13:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: tl
  text: May kaibigan si Amnon na ang pangalan ay Jonadab, anak ni Shimeah na kapatid ni David. Si Jonadab ay isang lalaking napakatalino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napakarunong” o “napakatuso.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa karunungan, katalinuhan, o katusuhan; ipinakikita ng kasunod na salaysay na ginamit ni Jonadab ang kaniyang talino sa paraang masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  choice: kaibigan
  rationale: Karaniwang tumutukoy ang pangngalan sa kaibigan, kasama, o kabalikat; natural dito ang “kaibigan” bilang paglalarawan sa kaugnayan ni Jonadab kay Amnon.
- source_word: וּלְאַמְנוֹן
  choice: May ... si Amnon
  rationale: Ang Hebreong idyoma na literal na “at kay Amnon” ay nagpapahayag ng pag-aari o kaugnayan; likas itong ipinapahayag sa Tagalog sa hulmahang “May ... si Amnon.” Hindi dinagdagan ng tahasang panandang pamanahon.
- source_word: וּשְׁמוֹ
  choice: na ang pangalan ay
  rationale: Natural na Tagalog na katumbas ng karaniwang Hebreong pormula sa pagpapangalan at malinaw na inuugnay si Jonadab sa naunang “kaibigan.”
- source_word: בֶּן שִׁמְעָה
  choice: anak ni Shimeah
  rationale: Tuwirang salin ng pariralang genealogical; pinanatili ang transliterasyon ng pangalang pantangi.
- source_word: אֲחִי דָוִד
  choice: na kapatid ni David
  rationale: Tinutukoy ng parirala si Shimeah, hindi si Jonadab, bilang kapatid ni David; nilinaw ito sa pamamagitan ng pang-ugnay na “na.”
- source_word: אִישׁ חָכָם מְאֹד
  choice: isang lalaking napakatalino
  rationale: Ang חָכָם ay maaaring mangahulugang marunong, matalino, o tuso depende sa konteksto. Pinananatili ng “napakatalino” ang malawak at hindi pa ganap na moral na tinutukoy na kahulugan, habang ipinauubaya sa kasunod na salaysay ang paglalantad sa masamang paggamit niya ng talino.
theological_decisions:
- issue: Moral na kulay ng חָכָם sa paglalarawan kay Jonadab
  choice: napakatalino
  alternative: napakarunong; napakatuso
  rationale: Hindi tahasang hinahatulan ng mismong salita ang talino ni Jonadab, bagaman ipinakikita ng kasunod na salaysay ang mapaminsalang paggamit nito. Ang salin ay hindi dapat maagang magpasya sa ambiguwidad, kaya inilagay sa talababa ang mga posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na hulmahang “May ... si Amnon,” at hinati sa dalawang pangungusap upang maiwasan ang kalituhan sa pagkakaugnay ng mga pangalan. Ang “na kapatid ni David” ay malinaw na tumutukoy kay Shimeah.
