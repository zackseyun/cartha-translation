base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Amnon kay Tamar, “Dalhin mo ang pagkain sa panloob na silid[a] upang kumain ako mula sa kamay mo.” Kaya kinuha ni Tamar ang mga tinapay na ginawa niya at dinala ang mga iyon kay Amnon, na kapatid niya, sa panloob na silid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa silid” o “sa silid sa loob.” Ang Hebreong חֶדֶר ay tumutukoy sa isang silid sa loob ng bahay; ginamit dito ang “panloob na silid” upang maipakita ang nakabukod na tagpuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: Dalhin mo
  rationale: Pautos na pambabaeng isahan ng בוא sa causative na diwa; natural sa Filipino ang “dalhin mo” kapag inuutusang ilipat ang isang bagay sa tinutukoy na lugar.
- source_word: הַבִּרְיָה
  choice: ang pagkain
  rationale: Tumutukoy sa inihandang makakain at hindi kailangang tukuyin nang mas espesipiko rito, sapagkat binabanggit sa sumunod na sugnay ang mismong mga tinapay.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: sa silid sa loob
  rationale: Ipinahihiwatig ng חֶדֶר ang isang panloob na silid, at ng hulaping patungo sa הֶחָדְרָה ang pagpasok doon. Pareho ang salin sa dalawang paglitaw upang mapanatili ang diin sa liblib na lugar.
- source_word: וְאֶבְרֶה
  choice: para makakain ako
  rationale: Ipinapahayag ang layunin ng utos at ang cohortative na diwa ng pandiwa sa natural na Filipino.
- source_word: מִיָּדֵךְ
  choice: mula sa kamay mo
  rationale: Pinananatili ang tahasang idyomang Hebreo at ang mapagmanipulang pagiging personal ng kahilingan ni Amnon.
- source_word: הַלְּבִבוֹת
  choice: ang mga tinapay
  rationale: Tumutukoy sa mga espesyal na piraso ng masa o tinapay na inihanda ni Tamar. Ang “mga tinapay” ay malinaw at hindi nag-aangkat ng makabagong larawan ng keyk o ng kakaning gawa sa bigas.
- source_word: אָחִיהָ
  choice: na kapatid niya
  rationale: Tahasan itong pinanatili dahil mahalaga sa salaysay at sa bigat ng pangyayari ang kanilang ugnayang magkapatid.
theological_decisions: []
translation_notes:
  register: Makabago at dignidad na Filipino, na may payak na sintaks. Pinanatili ang literal na “mula sa kamay mo” dahil mahalaga ang personal at mapagmanipulang himig ng kahilingan, at ginamit nang pareho ang “silid sa loob” sa dalawang paglitaw ng salitang Hebreo.
