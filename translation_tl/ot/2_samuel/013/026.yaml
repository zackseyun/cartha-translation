base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Absalom[a], “Kung hindi, pakisuyong pahintulutan ninyo ang kapatid kong si Amnon na sumama sa amin.” Ngunit sinabi sa kanya ng hari, “Bakit siya sasama sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasang, “Kung hindi kayo pupunta, pakisuyong pahintulutan ninyo ang kapatid kong si Amnon na sumama sa amin.” Pinaikli ang pahayag sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi / Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang “Pagkatapos” ay likas sa unang pahayag, samantalang ipinakikita ng “Ngunit” ang pagtutol sa sagot ng hari.
- source_word: וָלֹא
  choice: Kung hindi
  rationale: Pinaikling pahayag ito na tumutugon sa naunang pagtanggi. Pinananatili ng “Kung hindi” ang pagkaelliptical ng Hebreo; nililinaw sa talababa ang ipinahihiwatig.
- source_word: נָא
  choice: pakisuyong
  rationale: Magalang na katagang ginagamit sa isang pakiusap; natural at marangal ito sa modernong Filipino.
- source_word: יֵלֶךְ
  choice: pahintulutan ... na sumama / sasama
  rationale: Sa pakiusap ni Absalom, ipinahahayag ng jussive ang paghingi ng pahintulot. Sa tanong ng hari, natural na naipapahayag ng “sasama” ang retorikal na diwa ng imperfect.
- source_word: אִתָּנוּ
  choice: sumama sa amin
  rationale: Likas na salin sa Filipino ng comitative na “with us.”
- source_word: אַמְנוֹן אָחִי
  choice: ang kapatid kong si Amnon
  rationale: Natural na ayos sa Filipino at tumpak na pinananatili ang ugnayang “kapatid ko.”
- source_word: לָמָה
  choice: Bakit
  rationale: Pinakasimple at likas na katumbas ng pangtanong na ito.
- source_word: עִמָּךְ
  choice: sa iyo
  rationale: Sa pandiwang “sumama,” ang “sa iyo” ang natural na Filipino para sa “with you”; isahan ang tinutukoy, si Absalom.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “ninyo/kayo” bilang magalang na isahan sa pakikipag-usap ni Absalom sa hari, samantalang “iyo” ang ginamit sa tugon ng hari kay Absalom. Pinanatili sa pangunahing teksto ang ikli at tunay na pagkaelliptical ng וָלֹא, at ipinaliwanag ito sa talababa.
