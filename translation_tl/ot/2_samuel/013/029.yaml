  source_fidelity: 'Tumpak ang salin sa Hebreo: ang mga tauhan ni Absalom ay gumawa kay Amnon ayon sa utos ni Absalom; tumayo ang lahat ng anak na lalaki ng hari, bawat isa''y sumakay sa kaniyang mola, at tumakas. Napananatili rin ang di-tahasang pagbanggit sa ginawa kay Amnon, gaya ng masikling pananalita ng talata at ng pagpapaliwanag sa naunang talata.'
