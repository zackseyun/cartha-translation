base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: tl
  text: Kaya ginawa ng mga tauhan ni Absalom kay Amnon ang iniutos ni Absalom[a]. Pagkatapos, tumayo ang lahat ng anak na lalaki ng hari, sumakay ang bawat isa sa kaniyang mola, at tumakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, “ginawa kay Amnon ang iniutos ni Absalom.” Tahasang sinabi sa naunang talata ang utos: patayin si Amnon kapag masaya na ang puso nito dahil sa alak.'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: mga tauhan ni Absalom
  rationale: Maaaring tumukoy ang נַעַר sa kabataang lalaki, lingkod, o tagapaglingkod. Sa kontekstong ito, sila ang mga tauhang inutusang kumilos ni Absalom; natural sa modernong Filipino ang “mga tauhan” at hindi nito ipinapalagay ang eksaktong katayuan nila sa sambahayan.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: ginawa ... kay Amnon
  rationale: Pinananatili nito ang maikli at di-tahasang pananalita ng Hebreo; ang naunang talata ang naglilinaw na ang utos ay patayin si Amnon.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ang iniutos
  rationale: Likas na ipinapahayag sa Filipino na tumalima ang mga tauhan sa naunang utos ni Absalom, nang hindi nagdaragdag ng nilalaman.
- source_word: וַיָּקֻמוּ
  choice: tumayo
  rationale: Direktang salin na angkop sa biglaang pagtugon ng mga anak ng hari.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: lahat ng anak na lalaki ng hari
  rationale: Nililinaw ang kasariang tinutukoy ng בְּנֵי sa kontekstong ito at nananatiling natural sa Filipino.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: sumakay ang bawat isa sa kaniyang mola
  rationale: Distributibo ang אִישׁ, kaya “bawat isa”; ang פֶּרֶד ay tiyak na mola.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Ipinahahayag nito ang apurahang paglayo dahil sa panganib.
