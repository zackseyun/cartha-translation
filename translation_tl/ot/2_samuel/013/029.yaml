translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “mga tauhan” sa halip na literal na “mga kabataang lalaki” dahil tungkulin nila bilang mga tauhan ni Absalom ang mahalaga sa konteksto. Iniwasang gawing tahasan sa pangunahing teksto ang pagpatay sapagkat sadyang maikli at di-tuwiran ang Hebreo sa talatang ito.
