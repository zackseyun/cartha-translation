base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: tl
  text: Pagkatapos nito, si Absalom, anak ni David, ay may magandang kapatid na babae na ang pangalan ay Tamar, at minahal siya ni Amnon, anak ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nahumaling sa kanya” o “nagnasa sa kanya.” Ang pandiwang Hebreo ay karaniwang salita para sa “magmahal,” ngunit ipinakikita ng kasunod na salaysay na baluktot ang damdamin ni Amnon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Ang pinagsamang pormulang pasalaysay at pariralang temporal ay nagpapahiwatig ng pagkakasunod-sunod ng mga pangyayari. Natural sa makabagong Tagalog ang “Pagkatapos nito” at hindi kailangang isalin nang literal ang וַיְהִי bilang “at nangyari.”
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: si Absalom na anak ni David ay may
  rationale: Ang Hebreong konstruksiyon ng pag-aari, na literal na “kay Absalom … [ay mayroong],” ay natural na ipinapahayag sa Tagalog sa pamamagitan ng “ay may.” Pinanatili ang “anak ni David” dahil inuulit din ito para kay Amnon at itinatampok ang ugnayan sa sambahayan ni David.
- source_word: אָחוֹת יָפָה
  choice: isang magandang kapatid na babae
  rationale: Tuwirang ipinahahayag ng יָפָה ang kagandahang pisikal. Nilinaw ng “kapatid na babae” ang kasarian, sapagkat walang hiwalay na karaniwang salitang Tagalog na katumbas ng “sister.”
- source_word: וּשְׁמָהּ תָּמָר
  choice: na ang pangalan ay Tamar
  rationale: Pinananatili nito ang payak na sugnay na nagpapakilala sa pangalan at natural na idinudugtong sa paglalarawan sa kapatid.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Minahal siya
  rationale: Ang אָהַב ay karaniwang pandiwa para sa pag-ibig. Hindi muna isinasalin bilang “pagnanasa” upang mapanatili ang sadyang tensiyon sa pagitan ng tawag ng talata sa damdamin ni Amnon at ng kasunod na pagsisiwalat sa masama at marahas nitong anyo.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: ni Amnon na anak ni David
  rationale: Pinanatili ang paulit-ulit na “anak ni David,” na mahalaga sa diin ng teksto sa mga ugnayan sa loob ng maharlikang pamilya.
theological_decisions:
- issue: Pagpapakahulugan sa אָהַב sa isang salaysay na may masamang moral na konteksto
  choice: Minahal siya
  alternative: Nagnasa siya sa kanya; nahumaling siya sa kanya
  rationale: Karaniwang salita para sa “umibig/magmahal” ang ginamit ng Hebreo, samantalang ang kasunod na salaysay ang naglalantad na baluktot at marahas ang damdamin ni Amnon. Pinananatili ng pangunahing teksto ang pampanitikan at teolohikal na tensiyon sa halip na lutasin ito nang maaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapatid na babae” para sa tiyak na kahulugan ng אָחוֹת, at pinanatili ang magkatulad na pagtukoy kina Absalom at Amnon bilang “anak ni David.”
