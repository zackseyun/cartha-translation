  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: tl
  text: Pagkatapos, tinawag niya ang binatang naglilingkod sa kanya at sinabi, “Ilabas mo nga ang babaeng ito[a] palayo sa akin, at itrangka mo[b] ang pinto sa likuran niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pambabae ang anyo ng “ito” at tumutukoy kay Tamar. Ang pananalita ay sadyang mapaglayo at mapanghamak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ikandado mo.” Ang pandiwang Hebreo ay maaaring mangahulugang itrangka, harangan, o ikandado.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: ang binatang naglilingkod sa kanya
  rationale: Pinananatili ng “binata” ang karaniwang diwa ng נַעַר, habang malinaw na ipinahahayag ng “naglilingkod sa kanya” ang participleng מְשָׁרְתוֹ at ang tungkulin niya bilang personal na tagapaglingkod.
- source_word: שִׁלְחוּ נָא
  choice: Ilabas mo nga
  rationale: Sa konteksto, ang utos ay paalisin si Tamar patungo sa labas. Likas sa modernong Tagalog ang “ilabas,” at ipinahihiwatig ng “nga” ang pakiusap o mariing paghiling ng נָא nang hindi pinahihina ang utos.
- source_word: זֹאת
  choice: ang babaeng ito
  rationale: Ang זֹאת ay pambabaeng demonstratibo na tumutukoy kay Tamar. Walang gramatikal na kasarian ang “ito” sa Tagalog, kaya nilinaw ng “babaeng” ang tinutukoy at napanatili ng “ito” ang mapanghamak at mapaglayong tono.
- source_word: מֵעָלַי
  choice: sa harapan ko
  rationale: Bagaman literal na “mula sa ibabaw ko,” idiomatiko itong tumutukoy sa pagpapaalis sa presensiya ng nagsasalita. Natural sa Tagalog ang “ilabas mo … sa harapan ko.”
- source_word: הַחוּצָה
  choice: Ilabas
  rationale: Ang direksiyonal na anyo ay nangangahulugang “patungo sa labas.” Nakasama na ang diwang ito sa pandiwang Tagalog na “ilabas,” kaya iniwasan ang paulit-ulit na “ilabas … sa labas.”
- source_word: וּנְעֹל
  choice: at itrangka mo
  rationale: Ang נעל ay maaaring mangahulugang itrangka, harangan, o ikandado ang pinto. Ang “itrangka” ay angkop sa sinaunang pintuan at malinaw na nagpapahiwatig ng mahigpit na pagsasara.
- source_word: אַחֲרֶיהָ
  choice: sa likuran niya
  rationale: Pinananatili nito ang larawan ng pagsasara ng pinto sa likuran ni Tamar matapos siyang palabasin.
