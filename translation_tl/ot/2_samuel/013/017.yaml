translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binata” sa halip na mas pormal na “kabataang lalaki,” at ang “itrangka” upang ilarawan nang natural ang pagseseguro sa isang sinaunang pinto. Napanatili ang malupit at mapanghamak na tono ng utos nang hindi ito dinaragdagan.
