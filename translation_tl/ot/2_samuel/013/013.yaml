reference: 2 Samuel 13:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: tl
  text: At ako naman, saan ko dadalhin ang aking kahihiyan[a]? At ikaw, magiging tulad ka ng isa sa mga taong walang dangal sa Israel[b]. Kaya ngayon, pakiusap, kausapin mo ang hari[c], sapagkat hindi niya ako ipagkakait sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking kadustaan” o “aking dungis.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isa sa mga hangal sa Israel.” Dito, ang Hebreong נְבָלִים ay tumutukoy sa mga taong kahiya-hiya at walang wastong pagpapasiya sa moral, hindi lamang sa mga kulang sa talino.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, “hindi siya tatangging ibigay ako sa iyo.” Maaaring tunay na pakiusap ito ni Tamar o isang desperadong paraan upang maantala si Amnon.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה
  choice: saan
  rationale: Ang pang-abay na patanong ay tumutukoy sa patutunguhan at bumubuo ng retorikal na tanong kasunod ng pandiwa ng pagdadala.
- source_word: אוֹלִיךְ
  choice: ko dadalhin
  rationale: 'Pinananatili nito ang metapora ng Hiphil ng הלך: saan niya madadala o maiaalis ang idudulot na kahihiyan.'
- source_word: חֶרְפָּתִי
  choice: aking kahihiyan
  rationale: Tumutukoy ito sa personal at panlipunang kahihiyang idudulot ng gagawin ni Amnon; natural at malinaw ang “kahihiyan” sa makabagong Tagalog.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: tulad ng isa sa mga taong walang dangal
  rationale: Sa kontekstong ito, ang נבל ay hindi lamang kulang sa talino kundi isang taong kahiya-hiya at salat sa moral na pagpapasiya. Inihahatid ng “walang dangal” ang moral at panlipunang bigat nito.
- source_word: דַּבֶּר נָא
  choice: pakiusap, kausapin mo
  rationale: Ipinapahayag ng נָא ang taimtim at agarang pagsusumamo; natural sa Tagalog ang “pakiusap” bago ang pautos.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  choice: hindi niya ako ipagkakait sa iyo
  rationale: Ang מנע ay ‘magkait’ o ‘magpigil.’ Pinananatili ng salin ang tuwirang anyo ng Hebreo at ang pahiwatig na hindi tatanggi ang hari na ibigay si Tamar kay Amnon.
theological_decisions:
- issue: Kahulugan at layunin ng pakiusap ni Tamar sa hari
  choice: Isinalin nang tuwiran na hindi siya ipagkakait ng hari kay Amnon, nang hindi nagpapasiya kung tunay itong maaaring mangyari o isang paraan lamang upang maantala ang paglusob.
  alternative: Maaaring tunay na naniwala si Tamar na pahihintulutan ng hari ang kanilang pag-aasawa, o maaaring nagsasalita lamang siya nang madiskarte upang mapigil muna si Amnon.
  rationale: Hindi nililinaw ng talata kung legal o makatotohanan ang mungkahi ni Tamar. Dapat panatilihin ng salin ang tensiyon at kalabuan ng mismong pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng pagdadala ng kahihiyan, ang moral na bigat ng נבל, at ang hindi tiyak na layunin ng pakiusap ni Tamar.
