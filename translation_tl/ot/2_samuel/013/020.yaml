revisions:
- from: Sinabi sa kanya ng kapatid niyang si Absalom[a], “Ang kapatid mo bang si Amnon ang nakasama mo? Ngunit ngayon, kapatid ko, manahimik ka. Kapatid mo siya. Huwag mong dibdibin ang bagay na ito.” Kaya nanatili si Tamar sa bahay ng kapatid niyang si Absalom, wasak ang buhay[b].
  to: Sinabi sa kanya ng kapatid niyang si Absalom[a], “May nangyari ba sa iyo at sa kapatid mong si Amnon? Ngunit ngayon, kapatid ko, manahimik ka. Kapatid mo siya. Huwag mong dibdibin ang bagay na ito.” Kaya nanatili si Tamar, wasak, sa bahay ng kapatid niyang si Absalom[b].
