base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: tl
  text: Sinabi sa kanya ng kapatid niyang si Absalom[a], “May nangyari ba sa iyo at sa kapatid mong si Amnon? Ngunit ngayon, kapatid ko, manahimik ka. Kapatid mo siya. Huwag mong dibdibin ang bagay na ito.” Kaya nanatili si Tamar, wasak, sa bahay ng kapatid niyang si Absalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Nakasama mo ba ang kapatid mong si Amnon?” Isa itong maingat na pananalitang tumutukoy sa seksuwal na paglapastangan.
    reason: lexical_alternative
  - marker: b
    text: O “desolado.” Ang salitang Hebreo ay nagpapahiwatig ng pagkawasak, pagkatiwangwang, o matinding pagkagimbal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: Amnon
  rationale: Isinalinwika ang pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: הָיָה עִמָּךְ
  choice: ang nakasama mo
  rationale: Pinananatili ang maingat at di-tuwirang pananalita ng Hebreo; sa konteksto, tumutukoy ito sa seksuwal na paglapastangan.
- source_word: הַחֲרִישִׁי
  choice: manahimik ka
  rationale: Likas at tuwirang utos sa modernong Filipino na tumutugma sa pandiwang nangangahulugang tumahimik o huwag magsalita.
- source_word: אָחִיךְ הוּא
  choice: Kapatid mo siya
  rationale: Pinananatili ang maikli at nakakabagabag na pangangatwiran ni Absalom batay sa ugnayang pampamilya.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Huwag mong dibdibin ang bagay na ito
  rationale: Ang “dibdibin” ay likas na idyomang Filipino para sa paglalagay ng isang bagay sa kalooban at patuloy na pagpapabigat dito.
- source_word: וַתֵּשֶׁב
  choice: nanatili
  rationale: Ipinapahayag ang patuloy na paninirahan o kalagayan ni Tamar sa bahay ni Absalom.
- source_word: שֹׁמֵמָה
  choice: wasak ang buhay
  rationale: Ipinahahayag ang matinding pagkawasak at pangungulila ng salitang Hebreo sa malinaw at makabagbag-damdaming modernong Filipino, nang hindi nililimitahan ito sa emosyon lamang.
- source_word: בֵּית אַבְשָׁלוֹם
  choice: sa bahay ng kapatid niyang si Absalom
  rationale: Pinananatili ang kongkretong tahanang pinangyarihan at nililinaw ang ugnayang pampamilya gaya ng Hebreo.
theological_decisions:
- issue: Di-tuwirang pagtukoy ng salaysay sa seksuwal na paglapastangan
  choice: Pinanatili sa pangunahing teksto ang maingat na pananalitang “nakasama mo.”
  alternative: “Ang kapatid mo bang si Amnon ang lumapastangan sa iyo?”
  rationale: Ang Hebreo ay gumagamit ng eupemismo sa salaysay ng trauma. Pinananatili ng salin ang tunay na antas ng pagiging di-tuwiran nito, samantalang nililinaw ng talababa ang kahulugan sa konteksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kapatid ko” bilang natural na tuwirang pagtawag, ang “manahimik ka” para sa malinaw na utos, at ang “wasak ang buhay” upang maipahayag ang lawak ng שֹׁמֵמָה. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
