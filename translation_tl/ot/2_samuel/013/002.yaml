  to: Labis na nabagabag si Amnon hanggang sa nagkasakit siya dahil sa kapatid niyang si Tamar, sapagkat birhen pa si Tamar; at para kay Amnon, tila imposibleng may magawa siya sa kaniya.[a][b]
  rationale: Inalis ang hindi kailangang dagdag na “dalaga,” pinalitan ang di-angkop na “rito” ng “sa kaniya,” at inayos ang talababa upang huwag magpasok ng “balak” na wala sa tahasang pahayag. Napanatili ang pinag-aalitang/reflexive-resultative na puwersa ng infinitive sa talababa at ang hindi tiyak na saklaw ng “gumawa ng anuman.”
