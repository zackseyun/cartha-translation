  text: וַ/יֵּ֨צֶר לְ/אַמְנ֜וֹן לְ/הִתְחַלּ֗וֹת בַּֽ/עֲבוּר֙ תָּמָ֣ר אֲחֹת֔/וֹ כִּ֥י בְתוּלָ֖ה הִ֑יא וַ/יִּפָּלֵא֙ בְּ/עֵינֵ֣י אַמְנ֔וֹן לַ/עֲשׂ֥וֹת לָ֖/הּ מְאֽוּמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: tl
  text: Labis na nabagabag si Amnon hanggang sa nagkasakit siya dahil sa kapatid niyang si Tamar, sapagkat birhen pa si Tamar; at para kay Amnon, tila imposibleng may magawa siya sa kaniya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Labis na nabagabag si Amnon hanggang sa nagdulot siya ng pagkakasakit sa sarili niya dahil sa kapatid niyang si Tamar.” Maaaring ilarawan ng pandiwang Hebreo ang resulta—na nagkasakit siya—o ang isang reflexive na diwa.
    reason: lexical_alternative
  - marker: b
    text: Ang “tila imposibleng” ay katumbas ng idyomang Hebreo na nagsasaad na, sa pananaw ni Amnon, wala siyang makitang magagawang paraan upang kumilos kay Tamar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: Labis na nabagabag
  rationale: Ipinahahayag ng pandiwa ang matinding panloob na pagkabalisa o pagkagipit; natural at malinaw sa modernong Filipino ang “labis na nabagabag.”
- source_word: לְהִתְחַלּוֹת
  choice: anupat nagkasakit siya
  rationale: 'Maaaring reflexive o resultative ang hitpael: “magkasakit” o “gawing may sakit ang sarili.” Pinananatili ng salin ang resulta nang hindi ipinapalagay na sinadya niyang magkasakit.'
- source_word: בַּעֲבוּר
  choice: dahil sa
  rationale: Sanhi ang tinutukoy ng pang-ukol sa kontekstong ito.
- source_word: אֲחֹתוֹ
  choice: kapatid niyang
  rationale: Tuwirang katumbas na mahalaga sa ugnayan ng mga tauhan at sa bigat ng salaysay.
- source_word: בְתוּלָה
  choice: dalaga pa ito at birhen
  rationale: Malinaw na ipinahahayag ang seksuwal na kalagayan at ipinahihiwatig ng “dalaga pa” ang kalagayang panlipunan na mahalaga sa kasunod na kahirapang makalapit sa kaniya.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: inakala ni Amnon na imposibleng
  rationale: Natural na Filipino para sa idyomang Hebreo na nagsasaad na sa pananaw ni Amnon ay hindi niya makita kung paano ito maisasagawa.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: may magawa siya rito
  rationale: Pinananatili ang malawak at sadyang hindi tiyak na “gumawa ng anuman sa kaniya,” nang hindi pa tahasang tinutukoy ang krimeng kasunod.
theological_decisions:
- issue: Ang dahilan kung bakit tila imposible para kay Amnon ang kumilos
  choice: Hindi tinukoy sa pangunahing teksto kung anong hadlang ang dulot ng pagiging birhen ni Tamar.
  alternative: Ipaliwanag na mahigpit na binabantayan o nakahiwalay ang mga birheng anak na babae ng hari.
  rationale: Hindi tahasang sinasabi ng Hebreo ang mekanismo ng hadlang; iniiwasan ng salin ang pagpasok ng paliwanag na mula lamang sa rekonstruksiyong pangkultura.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “rito” upang maiwasan ang paulit-ulit na panghalip, at pinanatiling hindi tiyak ang bagay na nais gawin ni Amnon, gaya ng Hebreo.
