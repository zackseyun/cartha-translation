  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: labis na nabagabag si Amnon, nagkasakit dahil kay Tamar na kapatid niya, birhen si Tamar, at wala siyang makitang magagawang paraan upang kumilos laban/ukol sa kaniya. Gayunman, ang “dalaga pa ito at birhen” ay nagdaragdag at nagdodoble ng kahulugang wala sa Hebreo, at ang “rito” ay hindi angkop na pantukoy sa isang tao sa ganitong pangungusap.'
  naturalness: Natural sa pangkalahatan ang rehistro, ngunit mas malinaw at mas matatas ang tuwirang pagtukoy muli kay Tamar kaysa “ito,” at ang “sa kaniya” kaysa “rito.” Ang muling pag-aayos ng pangungusap ay masusundan din ang ugnayan ng sanhi sa Hebreo.
  terminology: Ang “birhen” ang sapat at tuwirang katumbas ng בְּתוּלָה. Pinananatili ang “kapatid” at ang di-tiyak na “may magawa” upang huwag pangunahan ang susunod na pangyayari.
