  text: וַ/תֵּ֣לֶךְ תָּמָ֗ר בֵּ֛ית אַמְנ֥וֹן אָחִ֖י/הָ וְ/ה֣וּא שֹׁכֵ֑ב וַ/תִּקַּ֨ח אֶת הַ/בָּצֵ֤ק ו/תלוש וַ/תְּלַבֵּ֣ב לְ/עֵינָ֔י/ו וַ/תְּבַשֵּׁ֖ל אֶת הַ/לְּבִבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: tl
  text: Kaya pumunta si Tamar sa bahay ng kapatid niyang si Amnon habang nakahiga si Amnon. Kinuha niya ang masa, minasa niya ito, hinubog bilang mga tinapay[a] sa harap ni Amnon, at niluto[b] ang mga tinapay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinubog na parang mga puso.” Bihira ang pandiwa at pangngalang Hebreo rito, at maaaring may kaugnayan ang hugis ng mga tinapay sa salitang “puso.”
    reason: lexical_alternative
  - marker: b
    text: O “pinakuluan.” Maaaring partikular na tumukoy sa pagpapakulo ang pandiwang Hebreo, bagaman maaari rin itong gamitin dito sa mas pangkalahatang diwang “niluto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Kaya pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay at iniuugnay ang ginawa ni Tamar sa naunang tagubilin; natural sa Filipino ang “Kaya” sa ganitong daloy.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: sa bahay ng kapatid niyang si Amnon
  rationale: Malinaw at natural na ipinapahayag ang patutunguhan at ang mahalagang ugnayang pampamilya.
- source_word: וְהוּא שֹׁכֵב
  choice: habang nakahiga ito
  rationale: Ginagawang sirkumstansiyal ang sugnay gaya ng Hebreo at hindi dinaragdagan ng mas tiyak na “nasa kama.” Ang “ito” ay tumutukoy kay Amnon.
- source_word: הַבָּצֵק
  choice: ang masa
  rationale: Karaniwang salitang Filipino para sa dough sa paghahanda ng pagkain.
- source_word: וְתָלֹשׁ
  choice: minasa iyon
  rationale: Ang לוש ay tumutukoy sa pagmamasa ng masa; pinananatili ng salin ang tiyak na kilos at ang natural na paglalaro ng salitang “masa/minasa” sa Filipino.
- source_word: וַתְּלַבֵּב
  choice: hinubog bilang mga tinapay
  rationale: Bihira ang pandiwa at kaugnay ng pangngalang sumusunod. Ipinahahayag ng salin ang paghubog sa pagkaing ginawa nang hindi ipinipilit sa pangunahing teksto na hugis-puso iyon.
- source_word: לְעֵינָיו
  choice: sa harap niya
  rationale: Natural na idyomang Filipino para sa paggawa sa presensiya at paningin ni Amnon.
- source_word: וַתְּבַשֵּׁל
  choice: niluto
  rationale: Maaaring tumukoy ang בשל sa pagpapakulo ngunit maaari ring gamitin nang mas pangkalahatan sa pagluluto; iniiwasan ng “niluto” ang labis na pagtitiyak.
- source_word: הַלְּבִבוֹת
  choice: ang mga tinapay
  rationale: Tumutukoy ito sa mga pagkaing hinubog ni Tamar. Nauunawaan ng karaniwang mambabasa ang “mga tinapay,” samantalang hindi tiyak kung literal na hugis-puso ang ipinahihiwatig ng pambihirang salita.
