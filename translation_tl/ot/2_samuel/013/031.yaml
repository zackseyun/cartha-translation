  footnotes:
  - marker: a
    text: Ang pagpunit ng sariling damit ay nakaugalian nang paraan ng pagpapahayag ng dalamhati, pagkagimbal, o pagluluksa sa Bibliyang Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng sunod na kilos sa salaysay. Likas sa modernong Tagalog ang “tumayo” at angkop sa biglaang reaksiyon ng hari.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na titulo ito ng kilalang hari sa konteksto, si David; pinananatili ang titulo sa halip na ipalit ang personal na pangalan.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: pinunit ang kanyang mga damit
  rationale: Karaniwang idyoma sa Hebreo ang pagpunit ng sariling damit bilang pagpapahayag ng matinding dalamhati o pagkabigla. Direkta at natural ang salin.
- source_word: וַיִּשְׁכַּב אָרְצָה
  choice: humandusay sa lupa
  rationale: Ang שכב at ang direksiyonal na אָרְצָה ay naglalarawan ng paghiga o pagbagsak patungo sa lupa. Ipinahahayag ng “humandusay” ang kilos at tindig ng matinding dalamhati nang hindi labis na dinaragdagan ang teksto.
- source_word: וְכָל עֲבָדָיו
  choice: at lahat ng kanyang mga lingkod
  rationale: Maaaring tumukoy ang עֲבָדִים sa mga lingkod o tagapaglingkod sa korte. Ang “mga lingkod” ang pinakadirekta at hindi nagtatakda ng tiyak na ranggo.
- source_word: נִצָּבִים
  choice: nakatayo
  rationale: Ang Niphal participle ay naglalarawan ng nagpapatuloy na kalagayan sa tagpo; ang “nakatayo” ay likas na katumbas sa Tagalog.
- source_word: קְרֻעֵי בְגָדִים
  choice: punit din ang mga damit
  rationale: Inilalarawan ng passive participle ang kalagayan ng kanilang mga damit bilang napunit na. Nililinaw ng “din” ang pagkakatulad ng kanilang ginawa sa hari, na ipinahihiwatig ng magkatulad na parirala sa Hebreo.
