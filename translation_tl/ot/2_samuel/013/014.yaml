base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: tl
  text: Ngunit ayaw niyang makinig sa kanya[a]. Dinaig niya ito sa lakas[b], nilapastangan niya ito[c], at sinipingan siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “makinig sa kanyang tinig.”
    reason: lexical_alternative
  - marker: b
    text: O “mas malakas siya kaysa sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Ang pandiwang Hebreo ay maaaring mangahulugang “hinamak,” “ipinahiya,” o “nilapastangan”; dito ay tumutukoy ito sa seksuwal na paglapastangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ayaw
  rationale: Ipinahahayag ng pandiwa ang kusang pagtanggi o kawalan ng pagnanais; natural sa modernong Tagalog ang “ayaw niyang makinig.”
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: makinig sa kanya
  rationale: Ang literal na “makinig sa kanyang tinig” ay isang idyoma para sa pagbibigay-pansin o pagsunod sa pakiusap; malinaw at natural ang “makinig sa kanya,” habang inilalagay sa talababa ang literal na anyo.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: Dahil mas malakas siya kaysa sa babae
  rationale: Pinananatili nito ang paghahambing na ipinahahayag ng חזק na may מן at ipinakikita ang lakas bilang paraan ng pagsasagawa ng karahasan, nang hindi agad isinasanib ang sugnay sa kasunod na pandiwa.
- source_word: וַיְעַנֶּהָ
  choice: nilapastangan niya ito
  rationale: Sa konteksto ng sapilitang pakikipagtalik, tumutukoy ang ענה sa seksuwal na paglapastangan at pagpapahiya. Malinaw at mabigat ang “nilapastangan” ngunit pinananatili ang lawak ng Hebreong salita.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: sinipingan
  rationale: Ang שכב na may tuwirang layon ay idyoma para sa pakikipagtalik. Ang “sinipingan” ay maikli, marangal, at hindi kasinggaan ng “sipingan” sa kusang-loob na konteksto; nililinaw ng naunang pandiwa at buong tagpo na sapilitan ang ginawa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “babae” sa paghahambing upang maiwasan ang malabong magkasunod na panghalip, at “ito” sa mga kasunod na sugnay bilang natural na pagtukoy kay Tamar. Tahasang ipinakikita ng “nilapastangan” at ng konteksto ang seksuwal na karahasan nang hindi pinapahina o ginagawang kusang-loob ang pangyayari.
