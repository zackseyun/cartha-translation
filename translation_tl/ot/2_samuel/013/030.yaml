  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: tl
  text: 'Habang nasa daan sila, dumating kay David ang balita[a]: “Pinatay ni Absalom ang lahat ng anak na lalaki ng hari, at wala ni isa sa kanila ang natira.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ulat” o “sabi-sabi”; ang salitang Hebreo ay maaaring tumukoy sa isang balitang hindi pa napapatunayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Habang nasa daan sila
  rationale: Natural na Filipino para sa pangyayaring kasabay na inilalarawan ng pormulang Hebreo; pinananatili nito ang temporal na diwa nang hindi mabigat ang pananalita.
- source_word: הַשְּׁמֻעָה
  choice: ang balita
  rationale: Maaaring tumukoy ang salita sa balita, ulat, o sabi-sabi. Ang “balita” ay natural at maaari pa ring tumukoy sa impormasyong hindi pa napapatunayan; nililinaw sa talababa ang lawak ng kahulugan.
- source_word: בָאָה אֶל דָּוִד
  choice: dumating kay David
  rationale: Tuwiran at natural na katumbas ng kilos ng balitang nakarating kay David.
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tutuldok
  rationale: Sa modernong Filipino, natural na ipakilala ang tuwirang sipi sa pamamagitan ng tutuldok sa halip na idagdag ang mabigat na “na nagsasabi.”
- source_word: הִכָּה
  choice: Pinatay
  rationale: Bagaman literal na “sinaktan” o “pinabagsak,” malinaw na nakamamatay ang diwa sa iniulat na paglipol sa mga anak ng hari. Ang “pinatay” ang pinakanatural at malinaw na Filipino sa kontekstong ito.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: ang lahat ng anak na lalaki ng hari
  rationale: Tumpak na pinananatili ang panlalaking kahulugan ng בְּנֵי at iniiwasang maging malabo ang mas maikling “mga anak.”
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: at wala ni isa sa kanila ang natira
  rationale: Natural at mariing Filipino na nagpapanatili sa ganap na saklaw ng iniulat na pahayag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “anak na lalaki” para sa tiyak na kasarian ng Hebreo, at ang tuwirang sipi ay ipinakilala sa paraang karaniwan sa kasalukuyang Filipino.
