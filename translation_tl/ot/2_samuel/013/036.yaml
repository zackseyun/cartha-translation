translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘narito’ upang mapanatili ang biglang pantawag-pansin ng וְהִנֵּה, at ‘humagulgol’ upang likas na maipahayag ang idyoma ng malakas na panaghoy.
