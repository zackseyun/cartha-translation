revisions:
- from: Nang matapos siyang magsalita, narito, dumating ang mga anak ng hari. Humagulgol sila at umiyak. Maging ang hari at ang lahat ng kanyang mga lingkod ay umiyak nang napakatindi.[a]
  to: Nang matapos na siyang magsalita, narito, dumating ang mga anak ng hari. Itinaas nila ang kanilang tinig at umiyak. Maging ang hari at ang lahat ng kanyang mga lingkod ay umiyak nang napakatindi.[a]
  rationale: Pinalitan ang “Humagulgol sila” ng mas malapit na katumbas ng idyomang Hebreo, upang mapanatili ang magkahiwalay na “pagtaas ng tinig” at pag-iyak nang hindi nagdaragdag ng antas ng paghagulhol na hindi tahasang nakasaad. Idinagdag ang “na” sa unang sugnay para sa mas likas na daloy sa Filipino.
