base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: tl
  text: Nang matapos na siyang magsalita, narito, dumating ang mga anak ng hari. Itinaas nila ang kanilang tinig at umiyak. Maging ang hari at ang lahat ng kanyang mga lingkod ay umiyak nang napakatindi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “umiyak sila ng napakatinding pag-iyak,” isang mariing pananalita para sa matinding pagdadalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Nang matapos siyang magsalita
  rationale: Likas na isinasalin ang pormulang pasalaysay at ang sugnay na temporal; pinananatili nito ang agarang pagkakasunod nang hindi nagiging matigas sa Tagalog.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang pantawag-pansin at masiglang puwersa ng salaysay, bagaman mas pormal ito kaysa sa simpleng pagtanggal sa panandang Hebreo.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: mga anak ng hari
  rationale: Tuwiran at likas na katumbas ng pariralang construct; sa konteksto, tumutukoy ito sa mga anak na lalaki ng hari.
- source_word: בָּאוּ
  choice: dumating
  rationale: Natural sa Tagalog para sa pagdating ng mga anak ng hari sa pinangyayarihan.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: Humagulgol sila
  rationale: Ang idyomang literal na ‘itinaas nila ang kanilang tinig’ ay nagpapahiwatig dito ng malakas na panaghoy; malinaw at natural itong naihahayag ng ‘humagulgol.’
- source_word: וַיִּבְכּוּ
  choice: at umiyak
  rationale: Pinananatili ang hiwalay na pandiwa ng pag-iyak kasunod ng malakas na panaghoy.
- source_word: וְגַם
  choice: Maging
  rationale: 'Malinaw na ipinahahayag ang pagdaragdag: sumama rin sa pag-iyak ang hari at ang kanyang mga lingkod.'
- source_word: וְכָל עֲבָדָיו
  choice: at ang lahat ng kanyang mga lingkod
  rationale: Ang ‘mga lingkod’ ay sapat na malawak para sa עֲבָדָיו at hindi labis na nililimitahan sa mga opisyal o tagapaglingkod sa palasyo.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: umiyak nang napakatindi
  rationale: Natural na Tagalog na naghahatid ng matinding diin ng Hebrew cognate accusative; ipinaliliwanag sa talababa ang literal na anyo.
