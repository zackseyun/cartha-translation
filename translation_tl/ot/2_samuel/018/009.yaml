source:
  edition: WLC
  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: tl
  text: Nagkataong napaharap si Absalom sa mga tauhan ni David habang nakasakay siya sa mola. Dumaan ang mola sa ilalim ng makakapal na sanga ng isang malaking punong terebinto[a], at nasabit ang ulo ni Absalom sa puno. Kaya naiwan siyang nakabitin sa pagitan ng langit at lupa, samantalang nagpatuloy ang mola na nasa ilalim niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang malaking puno ng ensina.” Ang salitang Hebreo ay tumutukoy nang mas tiyak sa terebinto, bagaman isinasalin din ito kung minsan bilang ensina o, sa mas pangkalahatang paraan, malaking puno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי
  choice: Nagkataong napaharap
  rationale: Ipinahihiwatig ng Niphal na hindi sinadyang napunta o napaharap si Absalom sa mga tauhan ni David; natural itong nagpapahayag ng di-inaasahang pagtatagpo.
- source_word: עַבְדֵי דָוִד
  choice: mga tauhan ni David
  rationale: Sa kontekstong militar, tumutukoy ang עֲבָדִים sa mga tauhan o kawal ng hari, hindi pangunahing sa mga aliping nasa gawaing-bahay.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: nakasakay siya sa mola
  rationale: Tuwirang inilalarawan ang kalagayan ni Absalom nang maganap ang pagtatagpo; pinananatili ang tiyak na hayop sa Hebreo.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: sa ilalim ng makakapal na sanga ng isang malaking punong terebinto
  rationale: Ang שׂוֹבֶךְ ay masinsin o nagkakabuhol na mga sanga, at ang אֵלָה ay mas tiyak na terebinto kaysa karaniwang 'ensina' o 'malaking puno.'
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: nasabit ang ulo ni Absalom sa puno
  rationale: Inihahatid ng 'nasabit' ang di-sinasadyang pagkakapit nang hindi dinaragdagan ang teksto ng palagay na buhok niya ang sumabit; 'sa puno' ang natural na pagbalik sa terebinto.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: naiwan siyang nakabitin sa pagitan ng langit at lupa
  rationale: Ang literal na pasibong 'ibinigay/inilagay' ay nagsasaad dito ng naging kalagayan ng pagkakasuspinde; natural sa Tagalog ang 'naiwang nakabitin.'
- source_word: עָבָר
  choice: nagpatuloy sa pagtakbo
  rationale: Ipinakikita ng pandiwa na nagpatuloy ang mola matapos maiwan si Absalom; ang 'sa pagtakbo' ay umaangkop sa mabilis na galaw sa salaysay nang hindi nagsasaad ng direksiyong wala sa teksto.
theological_decisions:
- issue: Kung ano ang nasabit sa puno
  choice: ulo ni Absalom
  alternative: buhok ni Absalom
  rationale: Malinaw na רֹאשׁוֹ ('kanyang ulo') ang nasa tekstong Hebreo. Hindi idinaragdag ang tradisyonal ngunit hindi tahasang binanggit na buhok ang sumabit.
translation_notes:
  register: Makabago at dignidad na Filipino, na may malinaw na daloy ng salaysay. Ginamit ang 'mola' bilang karaniwang salin ng mule, 'mga tauhan' para sa kontekstong militar, at iniwasang idagdag na buhok ni Absalom ang nasabit sapagkat ulo lamang ang tahasang sinasabi ng Hebreo.
