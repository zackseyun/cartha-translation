base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: tl
  text: Nakaupo si David sa pagitan ng dalawang pintuang-bayan[a]. Umakyat ang bantay sa bubong ng pintuang-bayan sa tabi ng pader. Tumingala siya at tumingin, at narito, may isang lalaking tumatakbong mag-isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa pagitan ng dalawang gusali ng pintuan.” Literal sa Hebreo: “sa pagitan ng dalawang pintuan,” na malamang ay tumutukoy sa espasyo sa loob ng isang nakukutaang pasukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: Nakaupo
  rationale: Ang participle ay naglalarawan sa nagpapatuloy na kalagayan o posisyon ni David sa sandaling iyon; natural itong ipinapahayag sa Tagalog bilang “nakaupo.”
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: sa pagitan ng dalawang pintuang-bayan
  rationale: Pinananatili ang literal na “sa pagitan ng dalawang pintuan,” habang nililinaw ng “pintuang-bayan” na bahagi ito ng nakukutaang pasukan ng lungsod.
- source_word: הַצֹּפֶה
  choice: ang bantay
  rationale: Tumutukoy ito sa taong nakatalaga upang magmasid; “bantay” ang pinakanatural na katawagan sa kasalukuyang Tagalog sa kontekstong ito.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: sa bubong ng pintuang-bayan sa tabi ng pader
  rationale: Ipinahahayag nito ang pag-akyat sa ibabaw ng gusali ng pintuan na kaugnay ng pader, nang hindi nagdaragdag ng tiyak na detalyeng arkitektural.
- source_word: וַיִּשָּׂא אֶת עֵינָיו וַיַּרְא
  choice: Tumingin siya
  rationale: Ang literal na idyomang “itinaas ang kanyang mga mata at nakita” ay natural na naihahatid sa modernong Tagalog sa pamamagitan ng “tumingin,” nang hindi binabago ang kilos sa salaysay.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili ng “narito” ang biglaang pagpapakita at pagtuon ng pansin na taglay ng Hebrew na hinnēh.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Ang pangngalan ay panlalaking isahan at tumutukoy sa isang lalaking tao sa tagpo, kaya hindi ito ginawang pangkalahatang “isang tao.”
- source_word: רָץ לְבַדּוֹ
  choice: tumatakbong mag-isa
  rationale: Inilalarawan ng participle ang lalaking kasalukuyang tumatakbo nang walang kasama; natural at tumpak ito sa Tagalog.
