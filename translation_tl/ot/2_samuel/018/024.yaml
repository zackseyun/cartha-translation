  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pintuang-bayan” upang ipakita ang konteksto ng tarangkahan ng lungsod, at pinanatili ang “narito” upang maipahayag ang masiglang pagtuon ng salaysay.
