base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: tl
  text: Pagkatapos, nakita ng bantay ang isa pang lalaking tumatakbo. Tumawag ang bantay sa tagapagbantay ng pintuang-bayan at sinabi, “Tingnan mo! May isang lalaking tumatakbong mag-isa.” Sinabi ng hari, “May dala rin siyang balita[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tagapaghatid ng balita”; ang Hebreong participle ay maaaring tumukoy sa isang taong naghahatid ng ulat, na madalas ay mabuting balita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: bantay
  rationale: Ang participle mula sa צפה ay tumutukoy sa taong nagmamasid mula sa isang puwesto. Natural at angkop sa konteksto ang “bantay.”
- source_word: אִישׁ אַחֵר
  choice: isa pang lalaki
  rationale: Ipinakikilala ng אַחֵר ang ikalawang lalaking hiwalay sa unang mananakbo; malinaw itong naipapahayag ng “isa pang lalaki.”
- source_word: רָץ
  choice: tumatakbo
  rationale: Ang participle ay naglalarawan ng kilos na nagpapatuloy habang nakikita siya ng bantay.
- source_word: הַשֹּׁעֵר
  choice: tagapagbantay ng pintuang-bayan
  rationale: Tumutukoy ito sa taong namamahala o nagbabantay sa tarangkahan ng lunsod. Nililinaw ng “pintuang-bayan” ang tagpo at iniiwasan ang di-tiyak na “pinto.”
- source_word: הִנֵּה
  choice: Tingnan mo!
  rationale: Ang particle ay agarang tumatawag ng pansin sa nakikitang pangyayari; natural sa makabagong Tagalog ang “Tingnan mo!”
- source_word: לְבַדּוֹ
  choice: mag-isa
  rationale: Ipinahihiwatig na walang kasamang pangkat ang mananakbo.
- source_word: גַּם זֶה
  choice: rin siyang
  rationale: Sa natural na Tagalog, ipinakikita ng “rin” na ang ikalawang mananakbo ay katulad din ng una, samantalang ang panghalip ay tumutukoy sa taong itinuro ng זֶה.
- source_word: מְבַשֵּׂר
  choice: may dala ... balita
  rationale: Maaaring tumukoy ang Piel participle sa pagdadala ng ulat, kadalasan ay mabuting balita. Hindi ipinapalagay ng salin na mabuti ang nilalaman ng balita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na takbo ng salaysay at ang pag-uulit ng “bantay,” ngunit gumamit ng natural na ayos ng mga pangungusap. Ginamit ang “pintuang-bayan” para sa tarangkahan ng lunsod, hindi isang karaniwang pinto.
