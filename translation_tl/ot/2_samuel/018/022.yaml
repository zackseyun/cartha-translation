base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: tl
  text: Muling sinabi ni Ahimaaz na anak ni Zadok kay Joab, “Anuman ang mangyari,[a] pahintulutan mo rin sana akong tumakbo kasunod ng Cusita.” Ngunit sinabi ni Joab, “Bakit ka tatakbo, anak ko, gayong wala kang balitang magdudulot sa iyo ng gantimpala?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mangyari na ang mangyayari.”'
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang huling sugnay sa Hebreo. Maaari rin itong mangahulugang “wala kang balitang malugod na tatanggapin” o “wala kang matatamong gantimpala sa balita.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: Muling sinabi
  rationale: Ang idyomang literal na ‘nagdagdag pa’ ay nagpapahiwatig na inulit ni Ahimaaz ang kaniyang pagsasalita o pakiusap. Natural itong ipinapahayag sa Filipino bilang ‘Muling sinabi.’
- source_word: וִיהִי מָה
  choice: Anuman ang mangyari
  rationale: Ipinapahayag ng idyoma ang kahandaang magpatuloy anuman ang kalabasan o kahihinatnan.
- source_word: אָרֻצָה נָּא גַם אֲנִי
  choice: pahintulutan mo rin sana akong tumakbo
  rationale: Ang cohortative na may נָא ay isang magalang ngunit mapilit na pakiusap. Ang ‘pahintulutan mo … sana’ ay natural na naghahatid ng kusang paghiling, at ang ‘rin’ ay kumakatawan sa גַם.
- source_word: הַכּוּשִׁי
  choice: ang Cusita
  rationale: Direktang salin ito ng katawagang etniko mula sa Cus, sa halip na ipantay agad sa makabagong heograpikong katawagang ‘Etiopiano.’
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Bakit ka tatakbo
  rationale: Natural na Filipino ito para sa pagtutol at pagtataka ni Joab. Hindi na kailangang ilipat nang tahasan ang demonstratibong זֶה, na gumaganap na bahagi ng Hebreong idyoma rito.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili nito ang magiliw o nakatatandang paraan ng pagtawag ni Joab, nang hindi ipinahihiwatig na literal niyang anak si Ahimaaz.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: wala kang balitang magdudulot sa iyo ng gantimpala
  rationale: Ang sugnay ay eliptikal at mahirap. Inihahayag ng pangunahing salin ang malamang na diwa na ang pagdadala ng balita ay walang mapapakinabang o matatamong gantimpala si Ahimaaz, habang itinatala sa talababa ang ibang posibleng pagkaunawa.
theological_decisions:
- issue: Kahulugan ng mahirap na sugnay na אֵין בְּשׂוֹרָה מֹצֵאת
  choice: Balitang hindi magdudulot ng gantimpala sa tagapagdala
  alternative: Balitang hindi malugod na tatanggapin
  rationale: Kapuwa pinahihintulutan ng eliptikal na Hebreo ang ideya ng kawalan ng pakinabang o gantimpala at ang ideya ng hindi kanais-nais na pagtanggap. Pinili sa teksto ang una dahil ang מֹצֵאת ay maaaring tumukoy sa resultang matatamo, ngunit hindi isinara ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Cusita’ bilang tuwirang katawagang etniko at iniwasan ang mas tiyak ngunit posibleng anakronistikong ‘Etiopiano.’ Pinanatili sa talababa ang tunay na kalabuan ng huling sugnay.
