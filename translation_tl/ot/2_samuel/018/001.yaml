  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: tl
  text: Pagkatapos, tinipon at inihanay ni David ang mga taong kasama niya[a][b], at nagtalaga siya ng mga pinuno ng tig-iisang libo at mga pinuno ng tig-iisang daan na mamuno sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binilang” o “sinuri.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtitipon, pagsusuri, at pag-oorganisa ng isang hukbo, hindi lamang sa pagbibilang.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga tao”; sa kontekstong ito, tumutukoy ito sa puwersang kasama ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: tinipon at inihanay
  rationale: Sa kontekstong militar, ang פקד ay tumutukoy sa pagmamuster o pag-oorganisa at pagsusuri sa hukbo, hindi lamang sa pagbibilang. Likas sa modernong Tagalog ang pariralang ito at malinaw ang diwang militar-administratibo.
- source_word: הָעָם
  choice: mga tao
  rationale: Pinananatili nito ang karaniwang kahulugan ng עַם, bagaman sa konteksto ay tumutukoy ito sa puwersang kasama ni David. Ipinaliliwanag sa talababa ang kontekstuwal na kahulugan.
- source_word: אֲשֶׁר אִתּוֹ
  choice: kasama niya
  rationale: Tuwirang pinananatili ang relasyonal na pananalita ng Hebreo nang hindi ito pinalalawak bilang pormal na nasa ilalim ng kaniyang pamumuno.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: nagtalaga siya sa kanila
  rationale: Ang שׂים na may עַל ay maaaring mangahulugang maglagay o magtalaga ng mga taong mamumuno sa iba. Malinaw at natural sa modernong Tagalog ang 'nagtalaga ... sa kanila.'
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שַׂר ay pinuno o opisyal; ang 'mga pinuno' ay dignified at madaling maunawaan, at ipinahihiwatig ng konteksto ang tungkuling militar.
- source_word: אֲלָפִים
  choice: tig-iisang libo
  rationale: Ipinahahayag nito na ang bawat pinuno ay nakatalaga sa isang pangkat na isang libo, habang pinananatili ang karaniwang numerikal na pagbasa ng pormulang militar.
- source_word: מֵאוֹת
  choice: tig-iisang daan
  rationale: Pinananatili ang kaparis na estruktura ng Hebreo at nililinaw na mga pangkat na tig-iisang daan ang tinutukoy.
