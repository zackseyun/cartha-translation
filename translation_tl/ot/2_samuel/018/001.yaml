translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'tinipon at inihanay' upang ihatid ang diwang militar ng pagmamuster nang hindi gumagamit ng di-karaniwang hiram na salita; pinanatili naman ang literal na 'mga tao' at nilinaw ang kahulugan nito sa talababa.
