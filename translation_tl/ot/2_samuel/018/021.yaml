  register: Makabagong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang “Cusita” bilang transparent na katawagan sa pinagmulan ng mensahero; pinanatili sa talababa ang posibleng personal na pangalan at tradisyonal na katawagan.
