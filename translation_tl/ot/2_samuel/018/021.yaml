base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Joab sa Cusita[a], “Humayo ka at sabihin mo sa hari ang nakita mo.” Yumukod ang Cusita kay Joab at tumakbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cusi” kung personal na pangalan ang tinutukoy; ayon sa tradisyon, “ang Etiope.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: Cusita
  rationale: Ginamit ang katawagang tumutukoy sa taong mula sa Cus, sa halip na ipalagay agad na personal na pangalan ito. Mas tapat din ito sa sinaunang heograpiya kaysa sa tradisyonal na “Etiope.”
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos ang anyo. Ang “Humayo ka” ay natural at marangal sa salaysay, at malinaw na nag-uutos na umalis upang maghatid ng balita.
- source_word: הַגֵּד
  choice: sabihin mo
  rationale: Ang Hiphil na pautos ng נגד ay nangangahulugang ipaalam o iulat. Ang “sabihin mo” ay payak at angkop sa direktang utos kay Cusita.
- source_word: אֲשֶׁר רָאִיתָה
  choice: ang nakita mo
  rationale: Natural na salin ng pariralang Hebreo at pinananatili ang saklaw nito nang hindi dinaragdagan kung ano mismo ang nakita.
- source_word: וַיִּשְׁתַּחוּ
  choice: Yumukod
  rationale: Ipinahahayag ang pisikal na kilos ng paggalang kay Joab nang hindi ito ginagawang pagsamba o labis na tinutukoy bilang lubos na pagpapatirapa.
- source_word: וַיָּרֹץ
  choice: tumakbo
  rationale: Payak na kahulugan ng רוץ at pinananatili ang mabilis na galaw ng salaysay.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapasulong sa magkakasunod na pangyayari; malinaw itong ipinahahayag ng “Pagkatapos.”
