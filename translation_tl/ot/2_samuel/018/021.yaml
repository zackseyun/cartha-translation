  source_fidelity: 'Tumpak ang salin sa daloy at nilalaman ng Hebreo: ang utos ni Joab, ang ipaaalam sa hari batay sa nakita ng mensahero, ang pagyukod kay Joab, at ang pagtakbo ay lahat naipahayag. Ang “Cusita” ay maingat na pinananatiling katawagang pangkat/pinagmulan, nang hindi ipinagpapalagay na personal na pangalan.'
