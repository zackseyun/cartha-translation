base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: tl
  text: Doon kumalat ang labanan sa buong lupain[a], at noong araw na iyon, mas maraming tao ang nilamon ng kagubatan kaysa sa nilamon ng espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagkawatak-watak ang labanan sa buong lupain.” Maaaring idiin ng Hebreong anyo ang pagkalat o pagkakahiwa-hiwalay ng labanan sa rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: kumalat
  rationale: Ang Niphal na anyo mula sa פוץ ay nagpapahayag ng pagkalat o pagkawatak-watak. Ang “kumalat” ay natural sa makabagong Tagalog at angkop sa paglawak ng labanan sa isang rehiyon.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Idyomatiko itong tumutukoy sa malawak na saklaw ng lugar. Ang “sa buong lupain” ay malinaw at natural; lokal na rehiyon ang tinutukoy ng הָאָרֶץ, hindi ang buong daigdig.
- source_word: וירב ... לֶאֱכֹל
  choice: mas marami ... ang nilamon
  rationale: Kasama ng paghahambing na מֵאֲשֶׁר, ipinahihiwatig ng רבה at ng pawatas na אכל na mas maraming nasawi dahil sa kagubatan. Pinananatili ng “nilamon” ang matalinghagang personipikasyon.
- source_word: היער
  choice: ang kagubatan
  rationale: Ang יַעַר ay isang lugar na masukal o puno ng mga punongkahoy. Karaniwan at marangal na katumbas sa Tagalog ang “kagubatan.”
- source_word: בעם
  choice: sa mga tao
  rationale: Sa pariralang “mas marami sa mga tao,” likas na naipapahayag sa Tagalog ang partitive na diwa ng Hebreo.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: kaysa ng espada
  rationale: Malinaw ang paghahambing sa bilang ng mga nasawi. Hindi na kailangang ulitin ang “nilamon” sa Tagalog dahil nauunawaan itong elipsis, ngunit nananatili ang personipikasyon ng espada.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural itong salin ng temporal na parirala sa salaysay.
