  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: tl
  text: O kung kumilos ako nang taksil laban sa buhay niya[a]—at walang anumang bagay na nalilihim sa hari—ikaw mismo ay titindig sa kabilang panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa tradisyonal na binabasang anyo ng tekstong Hebreo: “laban sa buhay ko.”'
    reason: Ang nakasulat na anyo (ketib) ay “buhay niya,” samantalang ang tradisyonal na binabasang anyo (qere) ay unang panauhan, “buhay ko.”
lexical_decisions:
- source_word: שֶׁקֶר
  choice: kataksilan
  rationale: Sa kontekstong ito, hindi lamang simpleng pagsisinungaling ang ipinahihiwatig kundi ang pagtataksil sa utos ng hari at sa buhay ni Absalom.
- source_word: בְנַפְשׁוֹ
  choice: laban sa buhay niya
  rationale: Pinananatili ang ikatlong-panauhang hulapi ng nakasulat na tekstong WLC at ang diwang ang kataksilan ay nakatuon sa buhay ni Absalom.
- source_word: לֹא יִכָּחֵד
  choice: walang anumang bagay na maikukubli
  rationale: 'Ipinapahayag ang pasibong diwa: walang pangyayari o usapin ang maaaring manatiling lingid sa hari.'
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: tatayo sa malayo
  rationale: Pinananatili ang konkretong larawan ng pagtayo nang hiwalay o malayo, na nagpapahiwatig ng hindi pakikialam o hindi pagsaklolo nang hindi iyon ginagawang tahasang paliwanag sa teksto.
theological_decisions:
- issue: Kung kaninong buhay ang tinutukoy
  choice: buhay niya
  alternative: sarili kong buhay
  rationale: Ang ibinigay na WLC text ay may hulaping ikatlong panauhan sa בְנַפְשׁוֹ; gayunman, kinikilala sa talababa ang tradisyonal na binasang unang panauhan.
- issue: Diwa ng pagtayo sa malayo
  choice: Pinanatili bilang larawang pisikal na may pahiwatig ng paglayo
  alternative: hindi mo ako kakampihan
  rationale: Ang alternatibo ay mas tahasang interpretasyon kaysa sa mismong Hebreo at maaaring mag-alis ng likas na saklaw ng kahulugan nito.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kataksilan” upang maging malinaw ang bigat ng שקר sa konteksto, at pinanatili ang matalinghagang “tatayo sa malayo” sa halip na palitan ito ng isang mas makitid na interpretasyon.
