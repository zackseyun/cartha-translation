  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: tl
  text: Kaya lumabas ang mga kawal[a] patungo sa kaparangan upang harapin ang Israel, at naganap ang labanan sa gubat ng Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang bayan” o “ang mga tao”; dito, tumutukoy ito sa mga kawal ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: ang mga kawal
  rationale: Karaniwang nangangahulugang “ang bayan” o “ang mga tao,” ngunit sa kontekstong militar ay tumutukoy ito sa hukbong nakikipaglaban para kay David. Likas at tiyak sa modernong Tagalog ang “mga kawal.”
- source_word: הַשָּׂדֶה
  choice: sa parang
  rationale: Ang salita ay tumutukoy sa bukid o lantad na lupain. Kasama ng pandiwang “lumabas,” maikli at natural ang “lumabas sa parang,” nang hindi ipinapalagay na literal na sinasakang bukid iyon.
- source_word: לִקְרַאת
  choice: upang harapin
  rationale: Pangunahing diwa nito ang pagpunta upang salubungin o makaharap ang isang tao. Sa konteksto ng labanan, malinaw at natural ang “harapin” habang hinahayaan ang konteksto na magpahiwatig ng pakikipaglaban.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang mismong pangalang ginamit ng Hebreo. Sa konteksto, tumutukoy ito sa mga puwersang Israelitang kapanig ni Absalom, ngunit hindi iyon tahasang ipinapalit sa salin.
- source_word: הַמִּלְחָמָה
  choice: ang labanan
  rationale: Bagaman maaari ring mangahulugang “digmaan,” dito ay isang tiyak na sagupaan ang isinasalaysay, kaya mas angkop ang “labanan.”
- source_word: וַתְּהִי
  choice: naganap
  rationale: Literal itong “naging” o “nangyari.” Sa Tagalog, ang “naganap ang labanan” ay natural na pagpapahayag ng pangyayaring nagsimula o naganap.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: sa gubat ng Efraim
  rationale: Tuwirang pinananatili ang katawagang heograpiko nang hindi nilulutas ang mga tanong tungkol sa eksaktong lokasyon nito.
