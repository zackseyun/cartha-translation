translation_notes:
  register: Makabagong Filipino na natural ngunit marangal ang himig. Pinanatili ang pormal na katawagang “aking panginoong hari” at ang di-tuwirang paraan ng Cusita sa pagbabalita ng pagkamatay ni Absalom.
