base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa Cusita[a], “Mabuti ba ang kalagayan ng binatang si Absalom?” Sumagot ang Cusita, “Maging tulad nawa ng binatang iyon[b] ang mga kaaway ng aking panginoong hari at ang lahat ng bumabangon laban sa iyo upang gawan ka ng masama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Cusita” ay isang taong mula sa Cus; tradisyonal din itong isinasaling “Etiopiano.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tuwirang sinabi ng Cusita na patay na si Absalom. Ipinahiwatig niyang sinapit ni Absalom ang nais niyang sapitin ng lahat ng kaaway ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: ang Cusita
  rationale: Tumutukoy ito sa isang taong mula sa Cus. Pinananatili ng “Cusita” ang heograpiko at etnikong katawagan ng Hebreo nang hindi ipinapantay nang makitid sa makabagong “Etiopiano.”
- source_word: הֲשָׁלוֹם
  choice: Mabuti ba ang kalagayan
  rationale: Ang שָׁלוֹם ay nagtatanong tungkol sa kabuuang kapakanan o kalagayan, hindi lamang kung buhay o ligtas ang tao.
- source_word: לַנַּעַר
  choice: ng binata
  rationale: Maaaring mangahulugang batang lalaki, kabataan, o binata ang נַעַר. Dahil nasa hustong gulang na si Absalom ngunit anak pa ring tinutukoy ng hari, natural at angkop ang “binata.”
- source_word: לְאַבְשָׁלוֹם
  choice: si Absalom
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang pantangi.
- source_word: יִהְיוּ
  choice: Maging ... nawa
  rationale: Ipinahahayag ng anyong jussive ang isang hangarin o sumpang panalangin; malinaw itong naihahatid ng “maging ... nawa.”
- source_word: כַנַּעַר
  choice: tulad ng binatang iyon
  rationale: Ipinahahayag ng כ ang paghahambing, at pinananatili ng “binatang iyon” ang di-tuwirang pagtukoy ng Cusita sa sinapit ni Absalom.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: ang mga kaaway ng aking panginoong hari
  rationale: Pinananatili nito ang magalang at pormal na pananalita sa hari.
- source_word: קָמוּ עָלֶיךָ
  choice: naghihimagsik laban sa iyo
  rationale: Ang idyomang קום על ay tumutukoy sa pagbangon bilang kalaban o sa paghihimagsik, na partikular na angkop sa konteksto ni Absalom.
- source_word: לְרָעָה
  choice: upang gumawa ng masama
  rationale: Ipinakikita nito ang masama at mapaminsalang layunin, hindi lamang ang neutral na ideya ng pagsalungat.
- source_word: וַיֹּאמֶר
  choice: sinabi / Sumagot
  rationale: Natural sa salaysay na Filipino ang “sinabi” para sa tanong ng hari at “sumagot” para sa tugon ng Cusita, habang pinananatili ang pagkakasunod ng usapan.
