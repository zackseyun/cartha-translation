revisions:
- from: Sinabi ng hari sa kanila, “Gagawin ko ang sa tingin ninyo ay mabuti.” Kaya tumayo ang hari sa tabi ng pintuang-bayan[b], at lumabas ang buong bayan nang pangkat-pangkat na tig-iisandaan at tig-iisang libo.[a]
  to: Sinabi ng hari sa kanila, “Gagawin ko ang sa tingin ninyo ay mabuti.” Kaya tumayo ang hari sa tabi ng tarangkahan[b], at lumabas ang lahat ng tao nang pangkat-pangkat na tig-iisandaan at tig-iisang libo.[a]
  rationale: Pinalitan ang “buong bayan” ng “lahat ng tao” upang hindi magmukhang tumutukoy ang talata sa buong populasyong sibilyan, habang pinananatili ang mas malawak na salita ng Hebreo sa halip na tahasang “hukbo.” Pinalitan din ang “pintuang-bayan” ng mas natural na modernong “tarangkahan.” Walang binagong kahulugan sa pahayag ng hari, sa lokasyon niya, o sa organisasyong daan at libo.
