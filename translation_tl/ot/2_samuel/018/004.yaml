base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: tl
  text: Sinabi ng hari sa kanila, “Gagawin ko ang sa tingin ninyo ay mabuti.” Kaya tumayo ang hari sa tabi ng tarangkahan[b], at lumabas ang lahat ng tao nang pangkat-pangkat na tig-iisandaan at tig-iisang libo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, nakaayos sila sa mga yunit ng hukbo na tig-iisandaan at tig-iisang libo.
    reason: cultural_note
  - marker: b
    text: O “sa may tarangkahan.” Sa Hebreo, literal na “sa kamay ng tarangkahan,” isang idyoma na nangangahulugang nasa tabi nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: ang sa tingin ninyo ay mabuti
  rationale: Likas sa modernong Tagalog ang “sa tingin ninyo” bilang katumbas ng idyomang Hebreo na literal na “sa inyong mga mata,” at pinananatili nito ang diwa ng kanilang sariling paghatol.
- source_word: אֶעֱשֶׂה
  choice: Gagawin ko
  rationale: Tuwirang hinaharap na anyo ng עשה, nang hindi dinaragdagan ang lawak ng pangako ng hari.
- source_word: אֶל יַד הַשַּׁעַר
  choice: sa tabi ng pintuang-bayan
  rationale: Ang אֶל יַד ay idyoma ng pagiging katabi o malapit. Nililinaw ng “pintuang-bayan” na ang שַׁעַר ay pasukan ng lunsod o nakukutaang lugar, hindi karaniwang pinto lamang.
- source_word: וְכָל הָעָם
  choice: ang buong bayan
  rationale: Pinananatili ang karaniwang kahulugan ng עָם na “bayan/mamamayan” sa halip na tahasang gawing “hukbo,” bagaman militar ang konteksto.
- source_word: יָצְאוּ
  choice: lumabas
  rationale: Tuwirang salin ng malawak na pandiwang יצא; hindi idinagdag ang mas tiyak na “nagmartsa.”
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: nang pangkat-pangkat na tig-iisandaan at tig-iisang libo
  rationale: Ipinahahayag ang organisadong paghahati sa mga yunit na daan-daan at libo-libo, habang pinananatili ang estrukturang pamilang ng Hebreo.
