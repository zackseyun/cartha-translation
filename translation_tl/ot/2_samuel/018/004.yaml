translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “pintuang-bayan” para sa tarangkahan ng lunsod at “buong bayan” upang igalang ang mas malawak na salitang Hebreo, samantalang nililinaw ng kasunod na parirala at talababa ang kontekstong militar.
