base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: tl
  text: Sinabi ni Joab sa lalaking nagbalita sa kanya, “Aba, nakita mo siya! Bakit hindi mo siya hinampas doon hanggang sa bumagsak siya sa lupa? At ako sana ang may pananagutang magbigay sa iyo[b] ng sampung pirasong pilak[a] at isang sinturon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sampung pilak.” Hindi tinukoy ang yunit, kaya ginamit dito ang “pirasong pilak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “bibigyan sana kita.” Mas literal na sinasabi ng idyomang Hebreo, “nasa akin sana ang pagbibigay sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד
  choice: nagbalita sa kanya
  rationale: Ang may artikulong participle ay tumutukoy sa lalaking nag-ulat kay Joab; natural sa modernong Tagalog ang “nagbalita sa kanya.”
- source_word: וְהִנֵּה רָאִיתָ
  choice: Nakita mo pala siya!
  rationale: Ipinahahayag ng “pala” at ng padamdam ang matalim at nagulat na reaksiyong dala ng וְהִנֵּה, habang ang “siya” ay likas na ipinahihiwatig ng konteksto.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: hinampas doon at pinabagsak sa lupa
  rationale: Pinananatili ng “hinampas” ang pangunahing diwa ng נכה at ng “pinabagsak sa lupa” ang direksiyong אָרְצָה, nang hindi tahasang ginagawang “pinatay” ang pandiwa.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: ako sana ang may pananagutang magbigay sa iyo
  rationale: Ipinananatili nito ang diwa ng pananagutan o obligasyong nasa idyomang עָלַי + pawatas, sa halip na patagin lamang bilang “bibigyan sana kita.”
- source_word: עֲשָׂרָה כֶסֶף
  choice: sampung pirasong pilak
  rationale: Hindi tahasang binanggit sa Hebreo ang yunit. Ang “pirasong pilak” ay malinaw at hindi nagpapalagay na mga siklo o barya ang tinutukoy.
- source_word: חֲגֹרָה אֶחָת
  choice: isang sinturon
  rationale: Ang “sinturon” ay ang malinaw at kasalukuyang katumbas ng חֲגֹרָה, at pinananatili ng “isang” ang bilang sa Hebreo.
theological_decisions:
- issue: Lakas ng idyomang וְעָלַי לָתֶת לְךָ
  choice: ako sana ang may pananagutang magbigay sa iyo
  alternative: bibigyan sana kita
  rationale: Pinananatili ang tunay na diwa ng obligasyon o pananagutang nakapaloob sa Hebreo, nang hindi nagpapasok ng doktrinal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pala” upang likas na maipahayag ang matalim na reaksiyon ni Joab, at iniwasan ang lipas na mga salitang gaya ng “pamigkis” o “tumingin ka.”
