  source_fidelity: 'Ang pangunahing diwa ay mahusay na naipapahayag: si Joab ay tumutugon sa nag-ulat, ang tinutukoy ay si Absalom, hindi tinutukoy ang yunit ng pilak, at naingatan ang idyomang nagsasaad na nasa kay Joab ang pananagutang magbigay. Gayunman, ang “hinampas doon at pinabagsak sa lupa” ay naghahati sa iisang pandiwang Hebreo sa dalawang magkahiwalay na kilos at ginagawang mas tahasang causative ang ikalawa. Ang rebisyon ay mas malinaw na naghahayag na ang paghampas ang kilos at ang pagbagsak sa lupa ang resulta/direksiyon.'
  naturalness: Makabago at marangal ang karamihan ng pananalita. Ang “Nakita mo pala siya!” ay maaaring magpahiwatig ng bagong pagkakatuklas o pagkagulat, samantalang ang וְהִנֵּה ay isang mariing pantawag-pansin sa pagsita ni Joab. Mas tuwiran at natural dito ang “Aba, nakita mo siya!” Ang inayos na sugnay tungkol sa paghampas ay mas likas ding basahin sa Filipino.
  terminology: Ang “nagbalita sa kanya,” “sampung pirasong pilak,” at “isang sinturon” ay angkop. Ang “may pananagutang magbigay” ay katanggap-tanggap na katumbas ng עָלַי + pawatas at pinananatili ang diwa ng obligasyon; hindi ito dapat patagin sa “bibigyan sana kita.”
