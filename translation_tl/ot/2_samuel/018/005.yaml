base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: tl
  text: At iniutos ng hari kina Joab, Abisai, at Itai, “Alang-alang sa akin, pakitunguhan ninyo nang malumanay ang binatang si Absalom.” Narinig ito ng lahat ng kawal nang utusan ng hari ang lahat ng mga pinuno tungkol kay Absalom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: At iniutos ng hari
  rationale: Pinananatili ng “iniutos” ang awtoridad ng pandiwang צוה, at ang titulong “hari” sa halip na palitan ito ng pangalang David.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: kina Joab, Abisai, at Itai
  rationale: Likas sa modernong Tagalog ang “kina” para sa maramihang tiyak na pangalang pantao bilang layon ng utos.
- source_word: לֵאמֹר
  choice: tuwirang sipi nang walang hiwalay na “na sinasabi”
  rationale: Sa Tagalog, sapat at mas natural ang pagpapakilala ng tuwirang pananalita pagkatapos ng “iniutos”; hindi kailangang isalin nang lantad ang pormulang quotative.
- source_word: לְאַט
  choice: pakitunguhan ninyo nang mahinahon
  rationale: Ipinahahayag nito ang maingat at hindi marahas na pagtrato na hinihingi sa kontekstong militar. Nililinaw ng maramihang “ninyo” na sina Joab, Abisai, at Itai ang kinakausap.
- source_word: לִי
  choice: alang-alang sa akin
  rationale: Naipapakita nito ang personal na pakiusap at malasakit ng hari, hindi lamang ang literal na “para sa akin.”
- source_word: לַנַּעַר
  choice: ang binata
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki, kabataan, o binata. Ang “binata” ay hindi nagpapahiwatig na bata pa si Absalom at nananatili ang magiliw na himig ng isang ama.
- source_word: לְאַבְשָׁלוֹם
  choice: si Absalom
  rationale: 'Itinuturing ang ikalawang ל bilang pagtukoy o aposisyon: “ang binata, si Absalom.” Ito ang pinakanatural na anyo sa Tagalog.'
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: Narinig ng buong hukbo
  rationale: Bagaman literal na “buong bayan/mga tao,” ang הָעָם sa agarang tagpong militar ay tumutukoy sa mga kawal na naroon. Ang “buong hukbo” ay malinaw at natural sa Tagalog.
- source_word: בְּצַוֹּת הַמֶּלֶךְ
  choice: nang iutos ng hari
  rationale: Isinasalin ng sugnay na temporal na “nang” ang magkasabay na pangyayaring ipinahihiwatig ng בְּ kasama ng infinitive construct.
- source_word: כָּל הַשָּׂרִים
  choice: lahat ng mga pinuno
  rationale: Sa kontekstong militar, tumutukoy ang שָׂרִים sa mga namumuno sa hukbo. Ang “mga pinuno” ay dignified at malawak na sapat upang hindi magtakda ng ranggong wala sa teksto.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: ang tungkol kay Absalom
  rationale: Natural na katumbas sa Tagalog ng pariralang nangangahulugang “hinggil kay” o “tungkol kay” Absalom.
theological_decisions:
- issue: Ang tindi at layon ng utos ng hari tungkol kay Absalom
  choice: “pakitunguhan ninyo nang mahinahon”
  alternative: “huwag ninyo siyang saktan” o “iligtas ninyo siya”
  rationale: Hindi tahasang sinasabi ng Hebreo na huwag saktan o patayin si Absalom. Pinananatili ng salin ang mas maluwag ngunit mariing kahilingan para sa mahinahong pagtrato, nang hindi dinaragdagan ang utos.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “hukbo” ayon sa kontekstong militar at “binata” upang mapanatili ang paternal na himig nang hindi ginagawang bata si Absalom.
