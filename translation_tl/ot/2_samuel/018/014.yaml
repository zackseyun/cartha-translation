revisions:
- from: Sinabi ni Joab, “Hindi maaari; hindi ako mag-aaksaya ng oras dito sa harap mo.” Pagkatapos, kumuha siya ng tatlong sibat[a] at ibinaon ang mga iyon sa puso ni Absalom habang buháy pa ito sa gitna ng punong terebinto.[b]
  to: Sinabi ni Joab, “Hindi; hindi na ako magtatagal sa harap mo.” Pagkatapos, kumuha siya ng tatlong sibat[a] at ibinaon ang mga iyon sa puso ni Absalom habang buháy pa si Absalom sa gitna ng punong terebinto.[b]
  rationale: Inalis ang mga dagdag na pahiwatig ng imposibilidad at “pag-aaksaya ng oras,” at pinalitan ng natural na Tagalog na nagpapahayag ng pagtanggi ni Joab na magtagal. Nilinaw ang tinutukoy ng “buháy pa” sa pamamagitan ng pagbanggit muli kay Absalom. Pinanatili ang mga leksikal na pagpili at lahat ng wastong footnote anchor.
