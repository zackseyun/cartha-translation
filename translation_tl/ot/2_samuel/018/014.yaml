base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: tl
  text: Sinabi ni Joab, “Hindi; hindi na ako magtatagal sa harap mo.” Pagkatapos, kumuha siya ng tatlong sibat[a] at ibinaon ang mga iyon sa puso ni Absalom habang buháy pa si Absalom sa gitna ng punong terebinto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatlong pamalo/tungkod.” Maaaring mangahulugan ang salitang Hebreo ng pamalo, tungkod, o setro, ngunit sa kontekstong ito ay malamang na tumutukoy ito sa mga sandatang pantusok.
    reason: lexical_alternative
  - marker: b
    text: O “punong ensina.” Ang salitang Hebreo ay karaniwang tumutukoy sa terebinto, ngunit isinasalin ito ng ilan bilang ensina.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה לְפָנֶיךָ
  choice: mag-aaksaya ng oras dito sa harap mo
  rationale: Ipinahahayag ng Hiphil ng יחל kasama ng לְפָנֶיךָ ang pagtanggi ni Joab na manatili o magpaliban pa sa harap ng kausap. Natural sa makabagong Tagalog ang pariralang ito at hindi lipas ang himig.
- source_word: שְׁבָטִים
  choice: mga sibat
  rationale: Bagaman maaaring tumukoy ang salita sa mga pamalo o tungkod, ipinahihiwatig ng kontekstong militar at ng pagbaon sa katawan na mga sandatang pantusok ang tinutukoy.
- source_word: וַיִּתְקָעֵם
  choice: ibinaon ang mga iyon
  rationale: Malinaw na ipinahahayag ng 'ibinaon' ang marahas at puwersahang pagtusok na ipinahihiwatig ng תקע.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: sa puso ni Absalom
  rationale: Pinananatili ang tahasang anatomikong 'puso' sa halip na gawing mas pangkalahatang 'dibdib.'
- source_word: עוֹדֶנּוּ חַי
  choice: habang buháy pa ito
  rationale: Natural at malinaw na Tagalog ito para sa diin na hindi pa patay si Absalom nang saktan siya ni Joab.
- source_word: בְּלֵב הָאֵלָה
  choice: sa gitna ng punong terebinto
  rationale: Sa idyomang Hebreo, ang לֵב dito ay tumutukoy sa kaloob-looban o gitna. Ang 'gitna' ay mas malinaw sa Tagalog, samantalang pinananatili ang mas tiyak na pagkakakilanlan ng אֵלָה bilang terebinto.
