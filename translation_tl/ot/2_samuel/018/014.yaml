translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Hindi maaari' bilang natural na pagtanggi sa לֹא כֵן; iniwasan ang mga lipas na salitang gaya ng 'magluwat.' Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
