base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: tl
  text: Sinabi ng hari, “Mabuti ba ang kalagayan ng binatang si Absalom?” Sumagot si Ahimaaz, “Nakita ko ang malaking kaguluhan[a] nang isugo ni Joab ang lingkod ng hari at ang inyong lingkod, ngunit hindi ko alam kung ano iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malaking karamihan” o “matinding ingay”; ang salitang Hebreo ay maaaring tumukoy sa karamihan ng tao, ingay, o kaguluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Mabuti ba ang kalagayan ng
  rationale: Sa tanong na ito, tumutukoy ang שָׁלוֹם sa kapakanan o kalagayan ni Absalom. Likas ito sa modernong Tagalog at hindi nito nililimitahan ang tanong sa pagiging ligtas lamang.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: ng binatang si Absalom
  rationale: Ang נַעַר ay maaaring mangahulugang batang lalaki, binata, o lingkod ayon sa konteksto. Dito, pinananatili ng “binata” ang di-tuwirang pagtukoy ni David kay Absalom nang hindi ito ginagawang masyadong bata.
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Tuwiran at natural na salin ng pandiwang Qal perfect, unang panauhang isahan.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: ang malaking kaguluhan
  rationale: Ang הָמוֹן ay maaaring tumukoy sa karamihan, ingay, o kaguluhan. Ang “malaking kaguluhan” ay angkop sa konteksto habang pinananatili sa talababa ang tunay na lawak ng kahulugan.
- source_word: לִשְׁלֹחַ
  choice: nang ipadala ni Joab
  rationale: 'Ang infinitive construct na may לְ ay natural na isinasalin dito bilang sugnay na panahunan: “nang ipadala.”'
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: ang lingkod ng hari
  rationale: Sa konteksto, ang עֶבֶד ay isang tauhan o opisyal na nasa ilalim ng hari; ang “lingkod” ay mas angkop kaysa “alipin” nang hindi nagdaragdag ng hindi tiyak na katayuan.
- source_word: וְאֶת עַבְדֶּךָ
  choice: at ang inyong lingkod
  rationale: Pinananatili nito ang mapagpakumbabang pormulang ginagamit ni Ahimaaz sa pagtukoy sa sarili sa harap ng hari.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: ngunit hindi ko alam kung ano iyon
  rationale: Elliptical ang Hebreo, na literal na “hindi ko alam kung ano.” Ang “iyon” ay likas na pagpuno sa Tagalog at hindi nagdaragdag ng bagong impormasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “inyong lingkod” ay nagpapanatili sa magalang at mapagpakumbabang pananalita sa hari. Inilipat ang talababa sa “kaguluhan,” ang salitang aktuwal na tinutukoy nito.
