base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: tl
  text: Sinabi ng bantay, “Nakikita kong ang paraan ng pagtakbo ng nauna[a] ay gaya ng pagtakbo ni Ahimaaz na anak ni Zadok.” Sinabi ng hari, “Mabuting tao siya, at may dala siyang magandang balita.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang pagtakbo ng nauna.”
    reason: lexical_alternative
  - marker: b
    text: O “darating siya na may magandang balita”; maaaring unawain bilang panghinaharap ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: ang bantay
  rationale: Ang participle na ginamit bilang pangngalan ay tumutukoy sa taong nagmamasid mula sa kaniyang puwesto. Ang “bantay” ay natural at malinaw sa makabagong Tagalog.
- source_word: מְרוּצַת הָרִאשׁוֹן
  choice: ang paraan ng pagtakbo ng nauna
  rationale: Literal na tumutukoy ang Hebreo sa “pagtakbo” ng unang tao. Nililinaw ng “paraan ng pagtakbo” na nakilala ng bantay ang mensahero sa estilo o anyo ng kaniyang pagtakbo, hindi lamang sa bilis.
- source_word: כִּמְרֻצַת
  choice: ay gaya ng pagtakbo ni
  rationale: Pinananatili nito ang tahasang paghahambing na ipinahihiwatig ng prefixed כִּ at ang pag-uulit ng konsepto ng “pagtakbo.”
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Ahimaas na anak ni Zadok
  rationale: Isinalin nang tahasan ang ugnayang בן bilang “anak ni,” at ginamit ang karaniwang anyong Tagalog ng pangalang Ahimaaz.
- source_word: אִישׁ טוֹב זֶה
  choice: Mabuting tao siya
  rationale: Natural itong Tagalog para sa literal na “mabuting tao ang isang ito” at pinananatili ang positibong pagtataya ng hari sa mensahero.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: at may dala siyang magandang balita
  rationale: Ipinahahayag nito sa likas na Tagalog ang kontekstuwal na diwa na dumarating siya kaugnay ng magandang balita. Ang posibleng panghinaharap na pagbasa ng pandiwa ay pinanatili sa talababa.
theological_decisions:
- issue: Aspekto/panahon ng יָבוֹא sa pahayag ng hari
  choice: may dala siyang magandang balita
  alternative: darating siya na may magandang balita
  rationale: Sa agarang tagpo, ipinahihiwatig ng hari ang layunin ng papalapit na mensahero, kaya natural ang kasalukuyang pahayag sa Tagalog. Gayunman, maaaring unawain ang yiqtol bilang panghinaharap, kaya hindi inalis ang alternatibong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bantay” sa halip na mas teknikal na “tanod,” at “magandang balita” bilang karaniwang katumbas ng בְּשׂוֹרָה טוֹבָה. Inilagay ang mga panandang talababa sa mismong pariralang tinutukoy ng bawat tala.
