  to: Ngunit sinabi ng lalaki kay Joab, “Kahit tumanggap pa ako ng isang libong pirasong pilak na tinimbang sa aking mga palad[a], hindi ko bubuhatan ng kamay ang anak ng hari. Sapagkat narinig namin na iniutos ng hari sa iyo, kay Abisai, at kay Itai, ‘Ingatan ninyo para sa akin ang binatang si Absalom.’[b]”
