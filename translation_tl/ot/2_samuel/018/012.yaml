base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: tl
  text: Ngunit sinabi ng lalaki kay Joab, “Kahit tumanggap pa ako ng isang libong pirasong pilak na tinimbang sa aking mga palad[a], hindi ko bubuhatan ng kamay ang anak ng hari. Sapagkat narinig namin na iniutos ng hari sa iyo, kay Abisai, at kay Itai, ‘Ingatan ninyo para sa akin ang binatang si Absalom.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tumitimbang ng isang libong pilak sa aking mga palad.” Tumutukoy ang pananalita sa pagtanggap ng malaking bayad na tinutukoy ayon sa timbang.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang tekstong Hebreo sa hulihan ng talata; literal itong may salitang מִי (“sino”) sa pariralang tungkol sa binatang si Absalom. Batay sa konteksto at sa 18:5, marami ang umuunawa rito bilang “Ingatan ninyo para sa akin ang binatang si Absalom.”
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: Kahit tumanggap pa ako ng isang libong pirasong pilak na tinimbang sa aking mga palad
  rationale: Ipinahihiwatig ng pagtimbang ng pilak sa mga palad ang pagtanggap ng napakalaking bayad. Pinanatili ang larawan ng pagtimbang at mga palad, habang ginawang malinaw at likas sa Tagalog ang diwang pasubali. Hindi tinukoy na ‘shekel’ sapagkat walang tahasang yunit sa Hebreo.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: hindi ko bubuhatan ng kamay
  rationale: Ang idyomang Hebreo ay tumutukoy sa marahas na pagkilos laban sa isang tao. Ang ‘bubuhatan ng kamay’ ay likas na idyomang Tagalog na nagpapanatili rin sa larawan ng kamay.
- source_word: בֶּן הַמֶּלֶךְ
  choice: ang anak ng hari
  rationale: Tuwirang salin na nagpapanatili sa ugnayang maharlika na mahalaga sa pangangatwiran ng lalaki.
- source_word: בְאָזְנֵינוּ
  choice: narinig naming
  rationale: Likas na Tagalog para sa idyomang literal na ‘sa aming mga tainga,’ at malinaw na nagsasaad na personal nilang narinig ang utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ipinapahayag nito ang may-awtoridad na tagubilin ng hari.
- source_word: שִׁמְרוּ
  choice: Ingatan ninyo
  rationale: Sa konteksto, ang pandiwa ay nangangahulugang bantayan o panatilihing ligtas. Ang ‘ingatan’ ay natural at malinaw para sa pagprotekta sa isang tao.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: para sa akin ang binatang si Absalom
  rationale: Mahirap unawain ang anyong Masoretiko. Batay sa konteksto at sa kaugnay na utos sa 18:5, inilagay sa pangunahing teksto ang malamang na diwang pag-iingat kay Absalom alang-alang sa hari, habang iniingatan sa talababa ang tunay na suliranin ng tekstong Hebreo.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Ang pantukoy sa Hebreo ay tumutukoy sa tiyak na lalaking nagsasalita sa salaysay.
theological_decisions:
- issue: Kung paano ihahayag ang mahirap na tekstong Masoretiko sa hulihan ng talata
  choice: ‘Ingatan ninyo para sa akin ang binatang si Absalom,’ na may talababa tungkol sa kahirapan ng Hebreo
  alternative: Isalin nang literal ang hindi malinaw na ‘Ingatan ninyo sino/מי sa binata, kay Absalom’
  rationale: Hindi malinaw ang literal na anyo at hindi ito bumubuo ng maayos na pangungusap. Ang piniling diwa ay suportado ng konteksto at ng utos sa 18:5, ngunit hindi itinago ang kawalang-katiyakan dahil malinaw itong binanggit sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong ‘Abisai’ at ‘Itai,’ ang natural na idyomang ‘bubuhatan ng kamay,’ at ang magalang ngunit tuwirang pananalita ng isang kawal sa nakatataas. Pinanatili ang larawan ng pilak na tinitimbang sa mga palad at inilantad sa talababa ang tunay na kahirapan ng tekstong Hebreo.
