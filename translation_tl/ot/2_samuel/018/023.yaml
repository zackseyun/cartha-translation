  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: tl
  text: Ngunit sinabi niya, “Anuman ang mangyari, hayaan mo akong tumakbo.”[a] Kaya sinabi niya sa kanya, “Tumakbo ka.” At tumakbo si Ahimaas sa daan ng kapatagan[b] at nalampasan niya ang Cusita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Mangyari na ang mangyayari, tatakbo ako.” Idyomatiko ang Hebreo at ipinahihiwatig ang pagpupumilit ni Ahimaas na tumakbo anuman ang kahinatnan.
    reason: alternative_reading
  - marker: b
    text: Malamang na tumutukoy ang “kapatagan” sa kapatagan ng Jordan, ngunit hindi kailangang tahasang tukuyin iyon sa pangunahing teksto.
    reason: cultural_note
  - marker: c
    text: O, “naunahan niya sa takbuhan ang Cusita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: “Anuman ang mangyari, hayaan mo akong tumakbo.”
  rationale: Idyomatikong pahayag ito ng pagpupumilit ni Ahimaas. Pinananatili ng salin ang diwang handa siyang tumakbo anuman ang mangyari, habang ipinakikita sa natural na Tagalog na humihingi pa rin siya ng pahintulot.
- source_word: רוּץ
  choice: “Tumakbo ka.”
  rationale: Tuwirang pautos na anyo ng pandiwang ‘tumakbo’; malinaw at natural ito sa Tagalog.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: sa daang dumaraan sa kapatagan
  rationale: Ang דֶּרֶךְ ay daan o ruta, at ang הַכִּכָּר ay kapatagan. Hindi tahasang idinagdag sa pangunahing teksto na ito ang kapatagan ng Jordan.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: nalampasan niya ang Cusita
  rationale: Sa konteksto ng pagtakbo, maaaring mangahulugan ang עבר na dumaan o lumampas sa isa, at maaari ring ipahiwatig na naunahan niya ito. Ang ‘nalampasan’ ay nagpapanatili ng lawak ng kahulugan nang hindi labis na nagpapakahulugan.
- source_word: הַכּוּשִׁי
  choice: ang Cusita
  rationale: Tumutukoy ito sa isang taong mula sa Cus. Pinananatili ng ‘Cusita’ ang etniko at heograpikong katawagan sa Hebreo sa halip na gamitin ang mas interpretatibong ‘Etiope.’
- source_word: אֲחִימַעַץ
  choice: Ahimaas
  rationale: Isina-Filipinong transliterasyon ng pangalang Hebreo, na madaling basahin at bigkasin ng mga mambabasang Tagalog.
