base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: tl
  text: Sinabi sa kanya ni Joab, “Hindi ikaw ang tagapagdala ng balita[a] ngayon. Maaari kang magdala ng balita sa ibang araw, pero huwag kang magdala ng balita ngayon, sapagkat patay ang anak ng hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagdala ng mabuting balita.” Ang salitang Hebreo ay maaaring tumukoy sa balita o mensahe, na madalas ay mabuti; ngunit dito, ang konteksto ay ang pagkamatay ng anak ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: tagapagdala ng balita
  rationale: Ang parirala ay literal na ‘tao ng balita.’ Natural sa modernong Tagalog ang ‘tagapagdala ng balita,’ at hindi nito ipinapalagay na mabuti ang balita sa kontekstong pagkamatay ng anak ng hari.
- source_word: וּבִשַּׂרְתָּ
  choice: Maaari kang magdala ng balita
  rationale: Sa konteksto, tumutukoy ito sa pahintulot o pagkakataong makapagdala ng balita sa ibang araw, hindi sa tiyak na panghuhula lamang.
- source_word: לֹא תְבַשֵּׂר
  choice: huwag kang magdala ng balita
  rationale: Malinaw at natural na ipinapahayag ng ‘huwag’ ang pagbabawal ni Joab para sa araw na iyon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal. Ang ‘sapagkat’ ay malinaw, marangal, at angkop sa salaysay.
- source_word: בֶּן הַמֶּלֶךְ
  choice: anak ng hari
  rationale: Natural na katumbas sa Tagalog ng Hebreong construct chain at pinananatili ang kaugnayan sa hari.
- source_word: מֵת
  choice: patay
  rationale: 'Pinananatili ang stative/resultative na diwa: patay na ang anak ng hari.'
- source_word: הַיּוֹם הַזֶּה
  choice: ngayon
  rationale: Natural na modernong Tagalog para sa paulit-ulit na temporal na pariralang ‘sa araw na ito.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang pag-uulit ng ‘balita’ sa Hebreo at iniwasang tukuyin itong ‘mabuting balita’ sa pangunahing teksto dahil sa konteksto.
