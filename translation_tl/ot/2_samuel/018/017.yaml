base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: tl
  text: 'Kinuha nila si Absalom at inihagis siya sa malaking hukay sa kagubatan, at nagpatong sila sa ibabaw niya ng napakalaking bunton ng mga bato. At tumakas ang buong Israel, bawat isa patungo sa kani-kaniyang tolda.[a]


    [a] Ang “patungo sa kani-kaniyang tolda” ay isang idyomang nangangahulugang nagsiuwi sila sa kani-kanilang tirahan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “patungo sa kani-kaniyang tolda” ay isang idyomang nangangahulugang nagsiuwi sila sa kani-kanilang tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha nila
  rationale: Tuwirang salin ng karaniwang gamit ng לקח sa pagkakasunod-sunod ng salaysay; hindi nagdaragdag ng puwersang hindi tahasang nasa pandiwa.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: inihagis siya
  rationale: Ipinahihiwatig ng שלך ang marahas at kahiya-hiyang pagtatapon sa katawan; natural at malinaw ang “inihagis” sa modernong Tagalog.
- source_word: בַיַּעַר
  choice: sa kagubatan
  rationale: Karaniwang katumbas ng יער at pinananatili ang tagpuang naitatag na sa salaysay.
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: sa malaking hukay
  rationale: Ang פחת ay hukay o malalim na guwang; malinaw ang “hukay,” at pinananatili ng “malaki” ang diin ng pang-uri.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: nagtambak sila sa ibabaw niya
  rationale: Sa kasunod na “bunton ng mga bato,” inilalarawan ng parirala ang paglalagay at pagtatayo ng bunton sa ibabaw ng bangkay. Ang “nagtambak” ay natural sa Tagalog at hindi nagpapahiwatig ng pormal na monumentong hindi tahasang binanggit.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: napakalaking bunton ng mga bato
  rationale: Tapat na inilalarawan ng “bunton ng mga bato” ang גל אבנים, at ipinananatili ng “napakalaki” ang pagpapalakas na dala ng מְאֹד.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: At tumakas ang buong Israel
  rationale: Pinananatili ang kolektibong pangalang “Israel” at ang tuwirang kahulugan ng נוס bilang pagtakas.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: bawat isa patungo sa kani-kaniyang tolda
  rationale: Pinananatili ang distributibong diwa at literal na larawan ng “tolda,” habang gumagamit ng likas na modernong Tagalog. Ipinaliliwanag sa talababa ang idyomatikong diwang pag-uwi sa sariling tirahan.
theological_decisions:
- issue: Kolektibong katawagang וְכָל יִשְׂרָאֵל
  choice: ang buong Israel
  alternative: ang lahat ng Israelita
  rationale: Pinananatili ang kolektibong pambansang pangalan ng tekstong Hebreo nang hindi nililimitahan o pinalalawak ang tinutukoy nito batay sa interpretasyon.
- issue: Literal o idyomatikong salin ng אִישׁ לְאֹהָלוֹ
  choice: bawat isa patungo sa kani-kaniyang tolda
  alternative: bawat isa ay umuwi sa sariling tirahan
  rationale: Nananatili sa pangunahing teksto ang konkretong larawan ng tolda, ngunit inilalagay sa talababa ang malinaw na idyomatikong kahulugan upang hindi mawala ang gamit ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng maiikling pandiwang pasalaysay at iniwasan ang arkaikong bokabularyo. Pinanatili ang “Israel” bilang kolektibong pangalan at ang “tolda” bilang konkretong larawan ng Hebreo, na may paliwanag sa talababa.
