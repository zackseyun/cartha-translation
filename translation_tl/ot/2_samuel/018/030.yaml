translation:
  language: tl
  text: Sinabi ng hari[a], “Tumabi ka at pumuwesto ka rito.” Kaya tumabi siya at pumuwesto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pumihit ka at pumuwesto ka rito.” Maaaring tumukoy ang pandiwang Hebreo sa pagliko o pagpihit sa pangkalahatan, ngunit sa kontekstong ito, malamang na nangangahulugan itong pagtabi upang bigyang-daan ang kasunod na mensahero.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salin ng wayyiqtol ng אמר na nagpapakilala ng tuwirang pananalita; likas ito sa makabagong salaysay sa Filipino.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Tiyak ang pangngalan sa Hebreo at tumutukoy sa haring kilala na sa konteksto; ang “hari” ay may tiyak na diwa sa konstruksyong Filipino.
- source_word: סֹב
  choice: Tumabi ka
  rationale: Ang pautos na anyo ng סבב ay maaaring mangahulugang lumiko o pumihit; sa konteksto, inuutusan ang mensahero na lumipat sa tabi upang magbigay-daan. Natural at malinaw ang “tumabi” nang hindi dinaragdagan ang kilos.
- source_word: הִתְיַצֵּב
  choice: tumayo ka
  rationale: Ang hitpael imperative ng יצב ay nangangahulugang pumuwesto o tumayo sa isang lugar. Ang “tumayo ka” ay maikli, natural, at angkop kasunod ng unang utos.
- source_word: כֹּה
  choice: riyan
  rationale: Adverbio ito ng lugar sa kontekstong pautos. Ang “riyan” ay natural kapag itinuturo ng nagsasalita sa kausap ang isang puwestong malapit sa kausap o tinutukoy na lugar.
- source_word: וַיִּסֹּב
  choice: tumabi siya
  rationale: Inilalarawan nito ang pagtupad sa naunang utos at pinananatili ang leksikal na ugnayan sa “Tumabi ka.”
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Payak na pandiwang pasalaysay ang עמד; sapat at natural sa Filipino ang “tumayo.”
