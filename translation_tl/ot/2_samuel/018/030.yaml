translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tumabi” bilang natural na katumbas na angkop sa tagpo, habang pinanatili sa talababa ang mas pangkalahatang kahulugang “pumihit.”
