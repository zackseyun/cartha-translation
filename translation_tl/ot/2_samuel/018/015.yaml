  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: tl
  text: Pagkatapos, pumalibot kay Absalom ang sampung kabataang lalaki na mga tagapagdala ng sandata ni Joab. Sinaktan nila siya at pinatay siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: pinalibutan
  rationale: Ipinahihiwatig ng סבב sa tagpong ito ang pagkilos sa palibot ng isang tao upang siya ay makubkob; likas at malinaw sa modernong Tagalog ang “pinalibutan.”
- source_word: עֲשָׂרָה נְעָרִים
  choice: sampung kabataang mandirigma
  rationale: Ang נְעָרִים ay maaaring tumukoy sa mga kabataang lalaki o tauhan. Dahil nasa kontekstong militar at sila ang sumalakay kay Absalom, nililinaw ng “kabataang mandirigma” ang tungkulin nila nang hindi sila ipinakikilalang mga bata.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: tagapagdala ng mga sandata ni Joab
  rationale: Ang parirala ay literal na tumutukoy sa mga tagapagdala ng kagamitan o sandata ni Joab. Mas malinaw ito sa karaniwang mambabasang Tagalog kaysa sa teknikal na “tagapagdala ng baluti,” yamang malawak ang saklaw ng כְּלִי.
- source_word: וַיַּכּוּ
  choice: sinaktan nila siya
  rationale: Malawak ang kahulugan ng נכה—hampasin, saktan, o salakayin. Pinananatili ng “sinaktan” ang pisikal na pagkilos at ang pagkakaiba nito sa kasunod na tahasang pagpatay.
- source_word: וַיְמִיתֻהוּ
  choice: pinatay
  rationale: Ang Hiphil ng מות ay nangangahulugang maging sanhi ng kamatayan; tuwiran at natural ang “pinatay.”
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Tagalog na Bibliya.
