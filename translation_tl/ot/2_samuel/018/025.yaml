  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: tl
  text: Pagkatapos, tumawag nang malakas ang bantay at nag-ulat sa hari. Sinabi ng hari, “Kung nag-iisa siya, may balita siyang dala.[a]” Patuloy siyang lumalapit nang lumalapit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may magandang balita siyang dala.” Ang salitang Hebreo ay maaaring tumukoy sa balita sa pangkalahatan, ngunit sa kontekstong ito ay malamang na nagpapahiwatig ng magandang balita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: ang bantay
  rationale: Ang anyong nominal mula sa צפה ay tumutukoy sa taong nakatalagang magmasid. Likas at malinaw sa konteksto ng lungsod ang “bantay.”
- source_word: וַיִּקְרָא
  choice: sumigaw
  rationale: Dito, ang קרא ay pagtawag nang malakas upang ipaalam ang nakita; ang “sumigaw” ay natural na salin sa Filipino.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: nag-ulat sa hari
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat. Ang “nag-ulat” ay angkop sa opisyal na tungkulin ng bantay.
- source_word: אִם לְבַדּוֹ
  choice: Kung nag-iisa siya
  rationale: Tuwirang ipinahahayag ng לְבַדּוֹ na ang mensahero ay nag-iisa, nang hindi nagdaragdag ng pandiwa ng pagdating.
- source_word: בְּשׂוֹרָה בְּפִיו
  choice: may balita siyang dala
  rationale: Literal itong “balita sa kaniyang bibig.” Isinasalin ng natural na idyomang Filipino na “may balita siyang dala” ang kahulugan nang hindi ipinapasok sa pangunahing teksto ang di-tiyak na positibong diwa ng בְּשׂוֹרָה.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: Patuloy namang lumalapit nang lumalapit ang lalaki
  rationale: Ipinahihiwatig ng konstruksiyon ang tuloy-tuloy at papalapit na pagkilos. Ang pagbanggit sa “lalaki” ay nililinaw ang simuno sa natural na Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang natural na idyomang “may balita siyang dala” sa halip na ang literal ngunit di-likas na “may balita sa kaniyang bibig,” habang pinanatili sa talababa ang posibleng positibong diwa ng salitang Hebreo.
