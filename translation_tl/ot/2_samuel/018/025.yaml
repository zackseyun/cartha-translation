revisions:
- from: Kaya sumigaw ang bantay at nag-ulat sa hari. Sinabi ng hari, “Kung nag-iisa siya, may balita siyang dala.[a]” Patuloy namang lumalapit nang lumalapit ang lalaki.
  to: Pagkatapos, tumawag nang malakas ang bantay at nag-ulat sa hari. Sinabi ng hari, “Kung nag-iisa siya, may balita siyang dala.[a]” Patuloy siyang lumalapit nang lumalapit.
  rationale: Pinalitan ang pang-ugnay na may pahiwatig na sanhi ng neutral na pang-ugnay na nagsasaad ng pagpapatuloy ng salaysay, at inalis ang “namang” na walang katumbas sa pinagmulan. Pinanatili ang natural na idyomang Filipino na “may balita siyang dala” at ang maingat na talababa tungkol sa posibleng positibong kahulugan ng בְּשׂוֹרָה.
