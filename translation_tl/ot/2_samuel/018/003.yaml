translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na panghalip na “kayo” para sa hari, habang pinanatili ang tuwiran at apurahang tono ng mga kawal. Inilagay ang mga talababa sa mismong pariralang nililinaw ng bawat isa.
