    rationale: 'Ang pangunahing Hebreong pagbasa ay malinaw na paghahambing: “sapagkat ngayon, tulad/kagaya kayo ng sampung libo sa amin.” Maaaring magbigay ng literal na alternatibo nang walang paglikha ng tekstuwal na suliranin.'
