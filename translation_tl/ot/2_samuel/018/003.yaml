base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: tl
  text: Ngunit sinabi ng mga tao, “Huwag kayong lumabas, sapagkat kung tumakas kami, hindi nila kami pagtutuunan ng pansin[a]; at kung mamatay ang kalahati sa amin, hindi rin nila kami pagtutuunan ng pansin. Sapagkat katumbas kayo ng sampung libo sa amin[b]. Kaya mas mabuti kung mula sa lungsod ay handa kayong tumulong sa amin[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi nila ilalagay ang kanilang puso sa amin,” isang idyomang nangangahulugang hindi nila kami ituturing na pangunahing pakay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sapagkat ngayon, tulad kayo ng sampung libo sa amin.”
    reason: lexical_alternative
  - marker: c
    text: Malamang na ipinahihiwatig nito na mananatili si David sa lungsod upang magbigay ng tulong o karagdagang puwersa kapag kailangan.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Hindi kayo dapat lumabas upang makipaglaban
  rationale: Ang negatibong imperfect sa tuwirang pananalita ay mariing payo o pagbabawal. Nililinaw ng “upang makipaglaban” ang militar na diwa ng paglabas sa konteksto.
- source_word: כִּי אִם נֹס נָנוּס
  choice: Sapagkat kung tumakas kami
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa kilos; sa natural na Tagalog, sapat at malinaw ang kondisyonal na “kung tumakas kami.”
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: hindi nila kami pagtutuunan ng pansin
  rationale: Ang literal na idyomang “ilagay ang puso sa amin” ay tumutukoy sa pagbibigay ng pangunahing pansin o pagpapahalaga; ang piniling salin ay angkop sa kontekstong militar.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: at kung mamatay ang kalahati sa amin
  rationale: Pinananatili nito ang payak na pandiwang “mamatay” sa Hebreo sa halip na ipakahulugang “mapatay,” bagaman labanan ang konteksto.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Sapagkat katumbas kayo ng sampung libo sa amin
  rationale: Ipinahahayag nito ang napakalaking halaga ni David sa hukbo. Ang “katumbas” ay natural sa Tagalog ngunit hindi ipinapakitang usapin lamang ito ng salapi o literal na bilang.
- source_word: וְעַתָּה טוֹב
  choice: Kaya mas mabuti
  rationale: Dito, ipinakikilala ng טוֹב ang mas kanais-nais na hakbang, kaya natural ang komparatibong “mas mabuti.”
- source_word: מֵעִיר לְעָזִיר
  choice: manatili kayo sa lungsod, handang tumulong sa amin
  rationale: Ang parirala ay tumutukoy sa pagtulong mula sa lungsod. Ginagawang malinaw at natural ng salin ang ipinahihiwatig na pananatili ni David roon bilang nakahandang suporta.
