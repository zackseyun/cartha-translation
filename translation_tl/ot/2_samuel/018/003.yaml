  to: Ngunit sinabi ng mga tao, “Huwag kayong lumabas, sapagkat kung tumakas kami, hindi nila kami pagtutuunan ng pansin[a]; at kung mamatay ang kalahati sa amin, hindi rin nila kami pagtutuunan ng pansin. Sapagkat katumbas kayo ng sampung libo sa amin[b]. Kaya mas mabuti kung mula sa lungsod ay handa kayong tumulong sa amin[c].”
