base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: tl
  text: Tumawag si Ahimaas sa hari at sinabi, “Mabuti ang lahat!”[a] Pagkatapos, nagpatirapa siya sa harap ng hari, na nakasubsob ang mukha sa lupa, at sinabi, “Purihin nawa si Yahweh na iyong Diyos, na nagbigay ng mga lalaking nagtaas ng kanilang kamay laban sa aking panginoon, ang hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapayapaan!” Ang Hebreong shalom ay maaaring maging ulat na maayos ang kalagayan o mabuti ang balita, hindi lamang isang pagbati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Tumawag
  rationale: Ipinahihiwatig ng pandiwa ang pagtawag nang malakas upang mag-ulat; natural sa Tagalog ang “Tumawag” sa tagpong ito.
- source_word: שָׁלוֹם
  choice: Kapayapaan!
  rationale: Pinananatili nito ang maikli at siksik na pahayag sa Hebreo, na maaaring pagbati o ulat na mabuti ang kalagayan.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: yumukod siya sa harap ng hari, na ang mukha ay nakadikit sa lupa
  rationale: Inilalarawan nang malinaw ang buong pagpapatirapa nang hindi pinapalitan ang kongkretong kilos ng interpretatibong salita.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Purihin si Yahweh na iyong Diyos
  rationale: Natural at marangal na pormulang papuri sa modernong Tagalog, habang pinananatili ang personal na pangalan ng Diyos.
- source_word: סִגַּר
  choice: nagbigay sa iyong kamay
  rationale: Sa kontekstong militar, nangangahulugan itong ibinigay o ipinailalim ang mga kaaway sa kapangyarihan ng hari; ang idinagdag na “sa iyong kamay” ay idiomatikong nililinaw ang diwa.
- source_word: הָאֲנָשִׁים
  choice: mga lalaking
  rationale: Tumutukoy ang panlalaking pangmaramihan sa tiyak na mga lalaking kasangkot sa paghihimagsik.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: nagtaas ng kanilang kamay laban sa
  rationale: Pinananatili ang larawang Hebreo ng pag-aalsa o marahas na pagsalungat sa halip na tahasang ipakahulugang “naghimagsik.”
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: laban sa panginoon kong hari
  rationale: Pinananatili ang magalang na pananalita ni Ahimaas kay David at ang literal na estruktura ng bansag.
theological_decisions:
- issue: Paglalarawan sa pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa Hebreo, nang hindi ito pinapalitan ng isang titulo o nagdaragdag ng doktrinal na interpretasyon.
- issue: Kung ang שָׁלוֹם ay pagbati o ulat ng mabuting kalagayan
  choice: Kapayapaan! na may talababa
  alternative: Mabuti ang lahat!; Magandang balita!
  rationale: Pinananatili sa pangunahing teksto ang tunay na kalabuan at inilalahad sa talababa ang posibleng gamit nito bilang paborableng ulat.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikling sigaw na “Kapayapaan!” at ang konkretong larawan ng pagpapatirapa at pagtataas ng kamay. Ginamit ang “panginoon kong hari” bilang magalang na pananalita sa korte, hindi bilang banal na titulo.
