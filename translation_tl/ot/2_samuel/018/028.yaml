revisions:
- from: Tumawag si Ahimaas at sinabi sa hari, “Kapayapaan!”[a] Pagkatapos, yumukod siya sa harap ng hari, na ang mukha ay nakadikit sa lupa, at sinabi, “Purihin si Yahweh na iyong Diyos, na nagbigay sa iyong kamay[b] ng mga lalaking nagtaas ng kanilang kamay laban sa panginoon kong hari.”
  to: Tumawag si Ahimaas sa hari at sinabi, “Mabuti ang lahat!”[a] Pagkatapos, nagpatirapa siya sa harap ng hari, na nakasubsob ang mukha sa lupa, at sinabi, “Purihin nawa si Yahweh na iyong Diyos, na nagbigay ng mga lalaking nagtaas ng kanilang kamay laban sa aking panginoon, ang hari.”
  rationale: Inalis ang idinagdag na “sa iyong kamay,” inayos ang pormula ng pagpapala upang hindi maging utos, at pinili ang mas likas na Tagalog na ulat para sa shalom habang pinananatili sa talababa ang literal na alternatibo at ang semantikong saklaw nito. Wala nang kinakailangang talababa para sa “nagbigay,” dahil ang pangunahing teksto ay tuwirang sumasalamin sa pandiwang Hebreo nang walang idinagdag na idyoma.
