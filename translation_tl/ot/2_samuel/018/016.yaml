  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: tl
  text: Pagkatapos, hinipan ni Joab ang tambuli[a], at tumigil ang mga kawal sa paghabol sa Israel[b], sapagkat pinigil ni Joab ang mga kawal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sungay.” Ang Hebreong shofar ay sungay na ginagamit sa pagbibigay ng hudyat, kadalasa’y sungay ng lalaking tupa.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga kawal ng Israel na kakampi ni Absalom.
    reason: cultural_note
  - marker: c
    text: Ang pandiwang Hebreo ay maaari ring mangahulugang “pinigilan,” “hindi hinayaang magpatuloy,” o “hindi pininsala.” Dito, malamang na tumutukoy ito sa pagpigil ni Joab sa kaniyang mga kawal na ipagpatuloy ang paghabol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: hinipan
  rationale: Kapag שׁוֹפָר ang kasamang instrumento, ang תקע ay nangangahulugang hipan o patunugin ito; natural sa Filipino ang “hinipan ang tambuli.”
- source_word: בַּשֹּׁפָר
  choice: ang tambuli
  rationale: Ang שׁוֹפָר ay sungay na hinihipan bilang hudyat. Ang “tambuli” ay likas at marangal na salitang Filipino para sa ganitong instrumentong panghudyat, habang inilalahad sa talababa ang mas konkretong “sungay.”
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: tumigil ang mga kawal sa paghabol
  rationale: Ang שׁוּב kasunod ng מִן at infinitive ay nagpapahayag ng pagtalikod o pagtigil sa ginagawa. Sa kontekstong militar, tumutukoy ang הָעָם sa mga kawal ni Joab; malinaw at natural ang “tumigil ... sa paghabol.”
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang pangalang “Israel” ayon sa Hebreo, kahit sa konteksto ay tumutukoy ito sa hukbong kakampi ni Absalom; nililinaw ito sa talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan kung bakit natigil ang paghabol. Ang “sapagkat” ay malinaw at angkop sa marangal na salaysay.
- source_word: חָשַׂךְ אֶת הָעָם
  choice: pinigil ... ang mga kawal
  rationale: Maaaring mangahulugan ang חָשַׂךְ na pigilan, ipagkait, o iligtas/huwag pinsalain. Sa konteksto, pinatigil ni Joab ang sarili niyang hukbo sa patuloy na paghabol; “pinigil” ang pinakamalinaw nang hindi nagdaragdag ng motibong awa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga kawal” para sa הָעָם dahil malinaw na hukbo ni Joab ang tinutukoy sa konteksto. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
