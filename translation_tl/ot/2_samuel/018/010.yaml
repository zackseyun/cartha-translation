base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: tl
  text: May isang lalaking nakakita at nagbalita kay Joab. Sinabi niya, “Tingnan mo, nakita kong nakabitin si Absalom sa puno ng terebinto.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa puno ng ensina.” Ang Hebreong אֵלָה ay maaaring tumukoy sa terebinto at kung minsan ay isinasalin nang mas pangkalahatan bilang “ensina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: isang lalaki
  rationale: Tuwirang pinananatili ang panlalaking isahan ng parirala, habang natural sa makabagong Tagalog.
- source_word: וַיַּרְא
  choice: Nakita iyon
  rationale: Ang pandiwa ay nangangahulugang ‘nakita’; idinagdag ang kontekstuwal na layong ‘iyon’ upang maging natural at malinaw sa Tagalog.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: ibinalita niya kay Joab
  rationale: Ang נגד sa salaysay ay tumutukoy sa paghahatid ng ulat o balita; mas tiyak dito ang ‘ibinalita’ kaysa sa pangkalahatang ‘sinabi.’
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang pantawag-pansing lakas ng partikula sa natural at kasalukuyang Tagalog, nang hindi gumagamit ng makalumang pananalita.
- source_word: רָאִיתִי
  choice: nakita kong
  rationale: Ipinapahayag ang natapos na pagkakita at maayos na ikinakabit sa kasunod na sugnay sa Tagalog.
- source_word: תָּלוּי
  choice: nakabitin
  rationale: Natural na katumbas ng pasibong partisipyong nangangahulugang nakabitin o nakasuspinde; hindi nito ipinahihiwatig kung paano nangyari iyon.
- source_word: בָּאֵלָה
  choice: sa puno ng terebinto
  rationale: Ang אֵלָה ay pinakatiyak na tumutukoy sa terebinto. Ginamit ang ‘sa’ upang mapanatili ang posibleng lokatibong diwa nang hindi labis na tinutukoy kung nasa loob, gitna, o sanga siya ng puno.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ang ‘Tingnan mo’ ay natural na pantawag-pansin; ang ‘terebinto’ ay pinanatili bilang mas tiyak na katawagang botanikal, na may alternatibo sa talababa.
