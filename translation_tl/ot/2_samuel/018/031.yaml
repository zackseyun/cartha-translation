  naturalness: Magalang at angkop sa salaysay ng korte ang rehistro. Mas malinaw at mas natural ang “ipinagtanggol at iniligtas kayo ... mula sa kamay ng” kaysa “ipinagkaloob ... ang katarungan ... laban sa kapangyarihan ng.”
  terminology: Ang “Yahweh,” “panginoon kong hari,” at “Cushita” ay angkop. Pinananatili ang “Cushita” bilang etnonimo at hindi ginagawang mas tiyak na modernong heograpikal na katawagan.
