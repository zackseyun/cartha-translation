base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: tl
  text: At narito, dumating ang Cushita[a] at sinabi niya, “Tumanggap nawa ng mabuting balita ang panginoon kong hari, sapagkat ngayo’y ipinagtanggol at iniligtas kayo ni Yahweh mula sa kamay ng lahat ng nagbangon laban sa inyo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang taga-Cush.” Posible rin ang tradisyonal na “Etiopiano.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “hinatulan ni Yahweh ngayon ang inyong usapin” o “binigyan kayo ni Yahweh ng katarungan ngayon mula sa kamay ng lahat ng nagbangon laban sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang biglang pagtutok ng salaysay sa pagdating ng bagong mensahero; natural at marangal ito sa salaysay na Filipino.
- source_word: הַכּוּשִׁי
  choice: ang Cusita
  rationale: Etnonimo ito na may tiyak na pantukoy sa Hebreo, hindi personal na pangalan. Mas malapit sa Cush ang “Cusita” kaysa sa posibleng anakronistikong “Etiopiano.”
- source_word: בָּא
  choice: dumating
  rationale: Likas na salin sa Filipino ng kilos na natapos sa sunod-sunod na salaysay.
- source_word: וַיֹּאמֶר הַכּוּשִׁי
  choice: at sinabi niya
  rationale: Ginamit ang panghalip upang maiwasan ang mabigat na agarang pag-uulit ng “ang Cusita,” habang malinaw pa rin ang tinutukoy.
- source_word: יִתְבַּשֵּׂר
  choice: Tumanggap nawa ng mabuting balita
  rationale: Ipinahahayag ang jussive na diwa ng hitpael/imperfect at ang pormal na pagbabalita ng mensahero sa hari.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Pinananatili ang magalang na pormula ng pakikipag-usap sa hari; sa kontekstong ito, ang “panginoon” ay titulo ng paggalang, hindi pagtukoy sa pagka-Diyos.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala sa dahilan o nilalaman ng mabuting balita.
- source_word: שְׁפָטְךָ
  choice: ipinagkaloob sa inyo ... ang katarungan
  rationale: Inilalarawan ang legal at mapagligtas na pagkilos ni Yahweh para sa hari, habang hindi nililimitahan ang pandiwa sa simpleng paghatol lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na katumbas sa modernong Filipino at pinananatili ang diin sa araw na iyon.
- source_word: מִיַּד
  choice: laban sa kapangyarihan ng
  rationale: Ipinahahayag sa likas na Filipino ang idyomang Hebreo na literal na “mula sa kamay ng,” na tumutukoy sa kapangyarihan o kontrol ng mga kalaban.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: lahat ng naghimagsik sa inyo
  rationale: Ang konteksto ay pag-aalsa laban kay David; malinaw nitong ipinahahayag ang mapanlabang pagbangon na nasa pariralang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang Tetragrammaton sa teksto. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Legal at mapagligtas na diwa ng שְׁפָטְךָ
  choice: ipinagkaloob sa inyo ... ang katarungan
  alternative: hinatulan kayo; ipinaghiganti kayo; binigyang-katwiran kayo
  rationale: Maaaring mangahulugan ang anyo ng paghatol o pagbibigay-katarungan para kay David. Ang napiling salin ay nagpapanatili sa paborableng legal na diwa nang hindi nagpapasok ng mas makitid na doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino na may dignidad na angkop sa salaysay ng korte. Ginamit ang magalang na “inyo” sa pakikipag-usap sa hari. Pinanatili ang bahagyang pormal na “At narito” at “nawa,” ngunit iniwasan ang lipas o labis na teknikal na pananalita.
