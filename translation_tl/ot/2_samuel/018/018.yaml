base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: tl
  text: Noong nabubuhay pa si Absalom, kumuha siya ng isang haliging bato at itinayo niya iyon para sa sarili niya sa Lambak ng Hari. Sinabi niya, “Wala akong anak na lalaki na magpapanatili ng alaala ng pangalan ko.” Kaya ipinangalan niya ang haliging bato sa sarili niyang pangalan. Tinatawag itong “Bantayog ni Absalom”[a] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kamay ni Absalom.” Dito, ang “kamay” ay idyomatikong tumutukoy sa isang tandang pang-alaala o bantayog.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב
  choice: kumuha siya ... at itinayo iyon
  rationale: Pinananatili ang dalawang kilos sa Hebreo habang natural na ipinahahayag sa Tagalog ang pagkuha at pagtatayo ng haliging bato.
- source_word: בְחַיּו
  choice: Noong nabubuhay pa si Absalom
  rationale: Natural at malinaw na salin ng idyomang tumutukoy sa ginawa niya habang siya ay buhay pa.
- source_word: מַצֶּבֶת
  choice: haliging bato
  rationale: Ipinakikita ang kongkretong larawan ng isang nakatayong batong pang-alaala, sa halip na agad itong gawing abstraktong ‘bantayog.’
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: sa Lambak ng Hari
  rationale: Tuwirang salin ng pangalan ng pook na maayos at likas pakinggan sa Tagalog.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: magpapanatili sa alaala ng pangalan ko
  rationale: Naipahahayag ang layuning manatiling naaalaala ang pangalan ni Absalom nang hindi nililimitahan ang diwa sa pagpapatuloy lamang ng angkan.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: ipinangalan niya sa sarili niya ang haliging bato
  rationale: Natural na Tagalog para sa Hebreong idyoma na nagsasabing ibinigay niya rito ang sarili niyang pangalan.
- source_word: יַד אַבְשָׁלוֹם
  choice: Bantayog ni Absalom
  rationale: Bagaman literal na ‘Kamay ni Absalom,’ ang יָד dito ay tumutukoy sa isang tandang pang-alaala o bantayog. Inilagay sa talababa ang literal na anyo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang Tagalog na katumbas ng pormulang nagsasaad na nanatili ang pangalan hanggang sa panahon ng pagsulat.
