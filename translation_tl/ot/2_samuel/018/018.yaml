  to: Noong nabubuhay pa si Absalom, kumuha siya ng isang haliging bato at itinayo niya iyon para sa sarili niya sa Lambak ng Hari. Sinabi niya, “Wala akong anak na lalaki na magpapanatili ng alaala ng pangalan ko.” Kaya ipinangalan niya ang haliging bato sa sarili niyang pangalan. Tinatawag itong “Bantayog ni Absalom”[a] hanggang sa araw na ito.
