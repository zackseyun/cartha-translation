base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Ahimaaz na anak ni Zadok, “Pakiusap, hayaan mo akong tumakbo at maghatid ng balita sa hari[a], sapagkat ipinagtanggol siya ni Yahweh mula sa kapangyarihan ng kanyang mga kaaway[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maghatid ng mabuting balita sa hari,” sapagkat ang pandiwang Hebreo ay maaaring tumukoy sa pagpapahayag ng magandang balita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “humatol si Yahweh para sa kanya” o “binigyan siya ni Yahweh ng katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק אָמַר
  choice: Pagkatapos, sinabi ni Ahimaas na anak ni Zadok
  rationale: Ang waw ay nagpapatuloy sa salaysay, kaya natural ang “Pagkatapos.” Ginamit ang karaniwang anyong Tagalog na “Ahimaas” at pinanatili ang pangalang “Zadok.”
- source_word: אָרוּצָה נָּא
  choice: Pakiusap, hayaan mo akong tumakbo
  rationale: Ipinahahayag ng cohortative ang pagnanais o pakiusap, at dinaragdagan ito ng נָא ng magalang na diin.
- source_word: וַ/אֲבַשְּׂרָה אֶת הַ/מֶּלֶךְ
  choice: at maghatid ng balita sa hari
  rationale: Ang piel ng בשׂר ay tumutukoy sa paghahatid o pagpapahayag ng balita, na madalas ay mabuting balita. Hindi tahasang idinagdag ang “mabuti” sa pangunahing teksto upang mapanatili ang lawak ng salita.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o nilalaman ng ibabalitang mensahe sa isang marangal ngunit natural na rehistro.
- source_word: שְׁפָטוֹ יְהוָה
  choice: humatol si Yahweh para sa kanya
  rationale: Pinananatili nito ang hudisyal na diwa ng שׁפט at ang posibilidad na ang ibig sabihin ay humatol ang Diyos nang pabor sa hari, sa halip na tahasang paliitin ito sa pagliligtas lamang.
- source_word: מִיַּד אֹיְבָיו
  choice: laban sa kapangyarihan ng kanyang mga kaaway
  rationale: Ang “kamay” ay idyomang Hebreo para sa kapangyarihan o kontrol. Isinalin ang kahulugan ng idyoma sa natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
theological_decisions:
- issue: Ang hudisyal at mapagligtas na diwa ng שְׁפָטוֹ
  choice: humatol si Yahweh para sa kanya
  alternative: iniligtas siya ni Yahweh
  rationale: Ang pangunahing salin ay nagpapanatili sa salitang-ugat na may diwang paghatol at sa kaisipang paborableng hatol, habang kinikilala sa talababa na sa konteksto ay maaari itong ipahayag bilang pagliligtas mula sa mga kaaway.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pakiusap” upang malinaw ang magalang na kahilingan, at “kapangyarihan” upang maipahayag nang madaling maunawaan ang idyomang Hebreo na “kamay.”
