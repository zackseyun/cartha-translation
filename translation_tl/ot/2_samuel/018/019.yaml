revisions:
- from: Pagkatapos, sinabi ni Ahimaas na anak ni Zadok, “Pakiusap, hayaan mo akong tumakbo at maghatid ng balita sa hari[a], sapagkat humatol si Yahweh para sa kanya[b] laban sa kapangyarihan ng kanyang mga kaaway.”
  to: Pagkatapos, sinabi ni Ahimaaz na anak ni Zadok, “Pakiusap, hayaan mo akong tumakbo at maghatid ng balita sa hari[a], sapagkat ipinagtanggol siya ni Yahweh mula sa kapangyarihan ng kanyang mga kaaway[b].”
  rationale: Pinalitan ang hindi tumpak na “laban sa kapangyarihan” ng “mula sa kapangyarihan,” upang maipahayag ang idiomang Hebreo na “mula sa kamay ng kanyang mga kaaway.” Pinili ang “ipinagtanggol siya” bilang natural na pangunahing salin na sumasaklaw sa hudisyal na pagpapawalang-sala at sa resultang pagliligtas; pinanatili sa talababa ang mas literal na hudisyal na mga posibilidad. Inayos din ang transliterasyon ng pangalan bilang “Ahimaaz.”
