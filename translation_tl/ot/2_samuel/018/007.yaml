  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: tl
  text: Doon ay natalo ang bayan ng Israel sa harap ng mga lingkod ni David, at malaki ang naging pagpatay[a] doon noong araw na iyon—dalawampung libo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang dagok,” “ang pagkatalo,” o “ang salot.” Sa ibang konteksto, ang salitang Hebreo ay maaaring tumukoy sa salot, ngunit dito ay tumutukoy ito sa nakamamatay na paghampas sa labanan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “dalawampung libo” lamang; hindi tahasang binanggit ang “katao” o “lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: natalo
  rationale: Ang Niphal ng נָגַף ay tumutukoy rito sa pagkatalo sa labanan. Malinaw at natural ang “natalo” nang hindi ipinahihiwatig na bawat isa ay napatay.
- source_word: עַם יִשְׂרָאֵל
  choice: ang bayan ng Israel
  rationale: Pinananatili nito ang literal na “bayan ng Israel,” bagaman sa konteksto ay tumutukoy ito sa mga hukbo o tagasunod ni Absalom.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Karaniwang pahayag ito sa Hebreo para sa pagkatalo sa harap ng isang kalaban at pinananatili ang anyo ng orihinal.
- source_word: עַבְדֵי דָוִד
  choice: mga lingkod ni David
  rationale: Malapit ito sa Hebreong עֶבֶד at saklaw ang diwa ng mga tauhan, tagasunod, o kawal ni David nang hindi labis na nagpapakahulugan.
- source_word: הַמַּגֵּפָה
  choice: ang napatay
  rationale: Sa ulat ng labanan, ang מַגֵּפָה ay tumutukoy sa nakamamatay na paghampas o pagpatay, hindi sa salot. Ang “napakalaki ng napatay” ay likas na paraan sa Filipino upang ipahayag ang malaking bilang ng nasawi.
- source_word: גְדוֹלָה
  choice: napakalaki
  rationale: Ipinahahayag nito ang diin ng Hebreong “malaki” at natural na kaugnay ng bilang ng mga napatay.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural at tuwirang katumbas ng karaniwang pariralang temporal sa Hebreo.
- source_word: עֶשְׂרִים אָלֶף
  choice: dalawampung libo
  rationale: Hindi tahasang binabanggit sa Hebreo ang pangngalan. Pinananatili ang bilang lamang upang hindi magdagdag sa pangunahing teksto; malinaw sa konteksto na ito ang bilang ng mga napatay.
