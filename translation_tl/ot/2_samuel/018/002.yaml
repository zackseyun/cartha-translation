  to: 'Ipinadala ni David ang mga kawal: ang isang-katlo ay sa ilalim ng pamumuno ni Joab,[a] ang isang-katlo ay sa ilalim ng pamumuno ni Abisai na anak ni Zeruya at kapatid ni Joab, at ang isang-katlo ay sa ilalim ng pamumuno ni Itai na taga-Gat. Sinabi ng hari sa mga kawal, “Ako mismo ay tiyak na lalabas na kasama ninyo.”'
