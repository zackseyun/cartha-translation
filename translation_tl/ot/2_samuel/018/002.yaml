base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: tl
  text: 'Ipinadala ni David ang mga kawal: ang isang-katlo ay sa ilalim ng pamumuno ni Joab,[a] ang isang-katlo ay sa ilalim ng pamumuno ni Abisai na anak ni Zeruya at kapatid ni Joab, at ang isang-katlo ay sa ilalim ng pamumuno ni Itai na taga-Gat. Sinabi ng hari sa mga kawal, “Ako mismo ay tiyak na lalabas na kasama ninyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa kamay ni,” isang idyoma na nangangahulugang nasa ilalim ng kapangyarihan o pamumuno ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Ipinadala
  rationale: Sa kontekstong militar, tumutukoy ito sa pagpapadala ng mga kawal upang kumilos; natural sa Filipino ang “ipinadala.”
- source_word: הָעָם
  choice: mga kawal
  rationale: Bagaman literal na “bayan/mga tao,” ang tinutukoy dito ay ang puwersang panlaban ni David.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: ang isang-katlo
  rationale: Malinaw nitong pinananatili ang paghahati ng hukbo sa tatlong magkakapantay na bahagi.
- source_word: בְּיַד
  choice: sa ilalim ng pamumuno ni
  rationale: Ang literal na “sa kamay ni” ay idyomang Hebreo para sa pagiging nasa kapangyarihan o pamumuno ng isang tao.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abisai na anak ni Zeruya at kapatid ni Joab
  rationale: Pinananatili ang dalawang ugnayang pampamilya sa natural na ayos sa Filipino.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai na taga-Gat
  rationale: Ang gentilic na הַגִּתִּי ay natural na isinasalin bilang “taga-Gat.”
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Sinabi ng hari
  rationale: Natural na salaysay sa Filipino habang pinananatili ang katawagang “hari.”
- source_word: יָצֹא אֵצֵא
  choice: tiyak na sasama
  rationale: Ang infinitive absolute at pandiwa ay nagbibigay-diin sa katiyakan ng personal na paglahok; sa konteksto, ang “lumabas” ay paglabas kasama nila sa labanan, kaya natural ang “sasama.”
- source_word: גַּם אֲנִי
  choice: Ako mismo
  rationale: Ipinahahayag nito ang diin sa personal na pakikilahok ng hari.
- source_word: עִמָּכֶם
  choice: sa inyo
  rationale: Kasama ng pandiwang “sasama,” malinaw nitong ipinahahayag ang pakikisama sa mga kawal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kawal” para sa kontekstuwal na kahulugan ng הָעָם at “sa ilalim ng pamumuno” para sa idyomang militar na בְּיַד. Pinanatili ang diin ng Hebreo sa “Ako mismo” at “tiyak.”
