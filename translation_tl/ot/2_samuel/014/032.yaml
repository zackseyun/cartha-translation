revisions:
- from: Sinabi ni Absalom kay Joab, “Tingnan mo, ipinasabi ko sa iyo, ‘Pumarito ka para maisugo kita sa hari at sabihin, “Bakit pa ako dumating dito mula sa Geshur? Mas mabuti sana para sa akin kung naroon pa rin ako.”[a]’ Ngayon, hayaan mong makita ko ang mukha ng hari[b]; at kung may kasalanan ako, patayin niya ako.”
  to: 'Sinabi ni Absalom kay Joab, “Tingnan mo, ipinatawag kita: ‘Pumarito ka upang suguin kita sa hari, upang sabihin mo sa hari, “Bakit ako dumating mula sa Geshur? Mas mabuti sana para sa akin kung naroon pa rin ako.”’ Ngayon, makaharap ko ang hari; at kung may pagkakasala ako, patayin niya ako.”'
  rationale: Inalis ang mga dagdag na “pa” at “dito,” nilinaw na si Joab ang magsasabi sa hari, at pinalitan ang konstruksyong may idinagdag na nagbibigay-pahintulot ng natural na idyomatikong Filipino. Inilagay ang mga panandang talababa sa kaugnay na mga parirala.
