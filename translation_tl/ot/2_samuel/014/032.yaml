base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: tl
  text: 'Sinabi ni Absalom kay Joab, “Tingnan mo, ipinatawag kita: ‘Pumarito ka upang suguin kita sa hari, upang sabihin mo sa hari, “Bakit ako dumating mula sa Geshur? Mas mabuti sana para sa akin kung naroon pa rin ako.”’ Ngayon, makaharap ko ang hari; at kung may pagkakasala ako, patayin niya ako.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Ginamit bilang likas na panandang pantawag-pansin sa makabagong Tagalog, hindi bilang utos na literal na tumingin.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: ipinasabi ko sa iyo
  rationale: Ipinahihiwatig ng parirala sa kontekstong ito ang pagpapadala ng mensahe o tawag, hindi ang pagpapadala ng isang bagay.
- source_word: בֹּא הֵנָּה
  choice: Pumarito ka
  rationale: Direkta at marangal na katumbas ng utos na lumapit sa kinaroroonan ng nagsasalita.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: para maisugo kita sa hari
  rationale: Ipinakikita ng anyong cohortative kasunod ng paanyaya ang layunin ng pagpapapunta kay Joab.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Bakit pa ako dumating dito mula sa Geshur?
  rationale: Pinananatili ang aktibong ‘dumating mula sa Geshur’ at hindi ginagawang pasibo na ‘ibinalik’; idinagdag ang ‘dito’ bilang likas na deiktikong paglilinaw sa Tagalog.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Mas mabuti sana para sa akin kung naroon pa rin ako
  rationale: Ginawang natural sa Tagalog ang eliptikong paghahambing habang pinananatili ang diwa na mas nanaisin ni Absalom na nanatili siya sa Geshur.
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Nagsisilbing temporal at retorikal na paglipat mula sa reklamo tungo sa kahilingan, nang hindi ito ginagawang tahasang sanhi at bunga.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: hayaan mong makita ko ang mukha ng hari
  rationale: Pinananatili ang larawan ng Hebreong ‘makita ang mukha’ at ang volitibong lakas ng pahayag; ipinaliliwanag sa talababa ang idyomatikong kahulugan.
- source_word: עָוֺן
  choice: kasalanan
  rationale: Saklaw nito rito ang pagkakasala o pananagutang maaaring maging batayan ng hatol ng hari.
- source_word: וֶהֱמִתָנִי
  choice: patayin niya ako
  rationale: Likas at maringal na Tagalog para sa causative na ‘itulot niyang mamatay ako/ilagay ako sa kamatayan,’ nang hindi ipinapalagay ang isang tiyak na paraan ng pagpatay.
