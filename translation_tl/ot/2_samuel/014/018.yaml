base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: tl
  text: Sumagot ang hari at sinabi sa babae, “Huwag mo sanang ilihim sa akin ang anumang itatanong ko sa iyo.”[a] Sinabi ng babae, “Magsalita po kayo, panginoon kong hari.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “Huwag mo sanang ilihim sa akin ang isang bagay na itinatanong ko sa iyo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas pormal: “Magsalita po ang panginoon kong hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang magkasunod na pandiwang Hebreo para sa pagtugon at pagsasalita, habang nananatiling natural sa salaysay na Tagalog.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng pangngalang may tiyak na pantukoy.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Ang tinutukoy ay ang babae mula sa Tekoa, hindi isang asawang babae.
- source_word: אַל נָא
  choice: Huwag mo sanang
  rationale: Ipinahahayag ng “huwag” ang pagbabawal at ng “sana” ang magalang na pakiusap ng נָא.
- source_word: תְכַחֲדִי מִמֶּנִּי
  choice: ilihim sa akin
  rationale: Natural na Tagalog para sa pagtatago o pagkakait ng impormasyon mula sa nagsasalita.
- source_word: דָּבָר
  choice: anumang
  rationale: Sa loob ng negatibong pahayag, likas na ipinahahayag ng “anumang” ang di-tiyak na “bagay” nang hindi mabigat ang pangungusap.
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: itatanong ko sa iyo
  rationale: Ang participle ay tumutukoy sa tanong na ihaharap agad ng hari; natural sa Tagalog ang aspektong kontemplatibo sa kontekstong ito.
- source_word: יְדַבֶּר נָא
  choice: Magsalita po kayo
  rationale: Ang ikatlong-panauhang jussive ay isang magalang na pormula ng pakikipag-usap; ang “po kayo” ang natural na katumbas nito sa modernong Tagalog.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Pinananatili ang magalang na katawagang panghukuman at ang titulong maharlika.
theological_decisions: []
translation_notes:
  register: Makabago at magalang na Filipino ang ginamit. Ang “po kayo” ay naghahatid ng paggalang na ipinahahayag sa Hebreo sa pamamagitan ng ikatlong-panauhang jussive, samantalang pinananatili ng “panginoon kong hari” ang pormal na pananalita sa harap ng hari.
