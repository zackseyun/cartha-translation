  source_fidelity: 'Tapat ang salin sa daloy ng Hebreo: ang hari ay tumugon at nagsalita, hiniling niyang huwag maglihim ang babae ng anumang itatanong niya, at magalang na hinikayat ng babae ang hari na magsalita. Ang “ilihim sa akin” ay angkop para sa תְכַחֲדִי מִמֶּנִּי, at ang “anumang” ay natural na katumbas ng di-tiyak na דָּבָר sa negatibong pahayag.'
