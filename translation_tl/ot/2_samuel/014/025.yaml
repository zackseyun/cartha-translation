  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: tl
  text: Sa buong Israel, walang lalaking kasingguwapo ni Absalom[a]. Labis siyang pinupuri dahil dito. Mula sa talampakan ng kanyang paa hanggang sa tuktok ng kanyang ulo, wala siyang anumang kapintasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lubhang pinupuri” o “pinupuri nang labis.” Ipinahahayag ng Hebreong parirala ang pambihirang tindi ng papuring iniuukol kay Absalom dahil sa kanyang anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: ni Absalom
  rationale: Ang וּכְ ay bahagi ng paghahambing na nagpapakitang walang lalaking maihahambing kay Absalom sa kagandahan; hindi kailangan ang tahasang temporal na “Ngayon.”
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: Sa buong Israel, walang lalaking kasingguwapo
  rationale: Likas na ipinahahayag sa Filipino ang superlatibong paghahambing sa pamamagitan ng “walang ... kasingguwapo.” Ang “guwapo” ay karaniwan at angkop sa lalaking inilalarawan.
- source_word: לְהַלֵּל מְאֹד
  choice: at lubhang pinupuri
  rationale: Pinananatili nito ang diwa ng napakataas na papuring natanggap ni Absalom dahil sa kanyang anyo, nang hindi ginagawang tuwirang utos na purihin siya.
- source_word: מִכַּף רַגְלוֹ
  choice: Mula sa talampakan ng kanyang paa
  rationale: Ang כַּף kapag tumutukoy sa paa ay idyomatikong nangangahulugang talampakan.
- source_word: וְעַד קָדְקֳדוֹ
  choice: hanggang sa tuktok ng kanyang ulo
  rationale: Ang קָדְקֹד ay tumutukoy sa tuktok o pinakaitaas na bahagi ng ulo; pinananatili ng parirala ang saklaw mula paa hanggang ulo.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: wala siyang anumang kapintasan
  rationale: Ang מוּם dito ay pisikal na kapintasan o depekto. Ang “kapintasan” ay natural ngunit marangal ang rehistro at akma sa paglalarawan ng kanyang anyo.
theological_decisions:
- issue: Saklaw ng “walang kapintasan”
  choice: Pisikal na kapintasan ang tinutukoy sa paglalarawan ng anyo ni Absalom.
  alternative: Isang pahayag na wala siyang moral na pagkukulang.
  rationale: Ang konteksto ay tahasang tungkol sa kagandahan at buong katawan ni Absalom; hindi ipinahihiwatig ng talata na ganap ang kanyang pagkatao o asal.
translation_notes:
  register: Makabago at madaling maunawaang Filipino ang ginamit, ngunit pinanatili ang marangal na himig. Ginamit ang “guwapo” bilang natural na katumbas para sa kagandahan ng isang lalaki, at “kapintasan” upang mapanatili ang bahagyang mataas na rehistro ng paglalarawan.
