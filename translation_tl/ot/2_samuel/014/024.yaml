base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: tl
  text: Ngunit sinabi ng hari, “Pumunta siya sa kaniyang bahay, at huwag siyang humarap sa akin.[a]” Kaya pumunta si Absalom sa kaniyang bahay at hindi humarap sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “huwag niyang makita ang aking mukha”; gayundin sa hulihan ng talata, “hindi niya nakita ang mukha ng hari.” Idyoma ito para sa pagharap sa presensiya ng isang tao o pagkakalooban ng pagkakataong makaharap siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: bumalik / bumalik
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang pagtalikod mula sa pagharap sa hari at pagtungo sa sariling bahay. Natural sa Filipino ang “bumalik,” at pinananatili nito ang pag-uulit ng Hebreo.
- source_word: בֵּיתוֹ
  choice: sarili niyang bahay
  rationale: Ang “bahay” ang tuwirang kahulugan ng בַּיִת; nililinaw ng “sarili niyang” ang hulaping paari at ang kaibahan nito sa kinaroroonan ng hari.
- source_word: וּפָנַי ... לֹא יִרְאֶה / וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: huwag siyang humarap sa akin / hindi humarap sa hari
  rationale: Ang literal na “makita ang mukha” ay idyoma para sa pagharap o pagtanggap ng pakikipagharap. Ang “humarap” ay natural at dignidad na katumbas sa modernong Filipino, habang pinananatili ang pag-uulit at ang diwa ng pagkakait ng pagharap.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Karaniwang katumbas ng מֶלֶךְ sa Filipino.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Maaaring magpahiwatig ang waw ng pagkakasunod o bahagyang pagsalungat. Ang “Ngunit” ay angkop dito sapagkat, kahit pinabalik si Absalom, ipinagkait pa rin ng hari ang pakikipagharap.
theological_decisions:
- issue: Literal na idyomang “makita ang aking mukha/mukha ng hari” laban sa interpretibong “humarap”
  choice: Isinalin sa pangunahing teksto bilang “humarap,” na may literal na anyo sa talababa
  alternative: “huwag niyang makita ang aking mukha ... hindi niya nakita ang mukha ng hari”
  rationale: Hindi natural sa modernong Filipino ang literal na idyoma at maaari itong maunawaan bilang basta pisikal na pagkakita. Ang “humarap” ay tumpak na naghahatid ng kahulugang pagpasok sa presensiya o pagtanggap ng pakikipagharap, samantalang iniingatan ng talababa ang konkretong anyo ng Hebreo at ang tunay na saklaw ng idyoma.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “humarap” upang malinaw na maipahayag ang Hebreong idyoma sa karaniwang wika, at pinanatili sa talababa ang literal na larawan at pag-uulit nito.
