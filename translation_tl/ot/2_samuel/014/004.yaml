  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: tl
  text: Nagsalita sa hari ang babaeng taga-Tekoa.[a] Nagpatirapa siya sa lupa at yumukod. Sinabi niya, “Iligtas mo ako,[b] O Hari!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang babaeng Tekoita.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Iligtas, Hari!” Ipinahihiwatig sa pakiusap na siya mismo ang humihingi ng pagliligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: babaeng taga-Tekoa
  rationale: Ang anyong pang-uri ay nagpapakilala sa babae ayon sa kaniyang pinagmulan; natural at malinaw sa modernong Tagalog ang “babaeng taga-Tekoa.”
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: Kinausap ... ang hari
  rationale: Bagaman karaniwang nangangahulugang “sinabi,” ipinapakita rito ng parirala ang unang paglapit at pagsasalita niya sa hari; natural ang “kinausap” at naiiwasan nito ang alanganing pag-uulit bago ang tuwirang sipi.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: Nagpatirapa siya sa lupa
  rationale: Maikli at likas na Tagalog ito para sa pagbagsak na nakaharap sa lupa, at malinaw na ipinahihiwatig ang tindig ng matinding pagsusumamo.
- source_word: וַתִּשְׁתָּחוּ
  choice: yumukod
  rationale: Ipinahihiwatig ng pandiwa ang pagyukod o pagpapatirapa bilang paggalang at pagsusumamo; ang “yumukod” ay madaling maunawaan at hindi ipinapalagay na pagsambang panrelihiyon.
- source_word: הוֹשִׁיעָה
  choice: Iligtas mo ako
  rationale: Ang pautos mula sa יָשַׁע ay agarang pakiusap para sa pagliligtas. Hindi tahasang nakasaad sa Hebreo ang layon, ngunit malinaw na ang nagsasalita ang humihingi ng pagliligtas.
- source_word: הַמֶּלֶךְ
  choice: Mahal na Hari
  rationale: Ginagamit bilang tuwirang pagtawag sa hari. Ang “Mahal na Hari” ay isang magalang at natural na bokatibo sa Filipino nang hindi dinaragdagan ng pag-aangking “aking hari.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pagkakaiba ng unang pagsasalita sa hari at ng sumunod na tuwirang pakiusap. Ginamit ang “nagpatirapa” para sa malinaw at likas na paglalarawan ng postura, at “yumukod” upang panatilihin ang hiwalay na kilos ng paggalang.
