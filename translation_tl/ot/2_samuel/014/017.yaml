  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: tl
  text: At sinabi ng iyong lingkod, “Nawa ang salita ng panginoon kong hari ay magdulot ng kapanatagan, sapagkat ang panginoon kong hari ay tulad ng anghel ng Diyos[a] sa pagkilala sa mabuti at masama[b]. At sumaiyo nawa si Yahweh na iyong Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tulad ng isang anghel ng Diyos”; ang salitang Hebreo ay maaari ring mangahulugang “sugo ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “upang marinig ang mabuti at ang masama,” isang paraan ng pagsasabi ng pagkilala o paghatol sa mabuti at masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: iyong lingkod
  rationale: Tumutukoy sa isang babaeng alipin o lingkod, ngunit dito ay magalang na pagpapakumbaba sa harap ng hari. Ang “iyong lingkod” ay likas sa Filipino at hindi kailangang ulitin ang kasariang malinaw na sa konteksto.
- source_word: יִהְיֶה נָּא
  choice: nawa ... ay
  rationale: Ipinahahayag ng jussive na may נָא ang magalang na pakiusap; ang “nawa” ay marangal at likas na katumbas.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: ang salita ng panginoon kong hari
  rationale: Pinananatili ang malawak na kahulugan ng דָּבָר bilang salita o pahayag, sa halip na tahasang paliitin ito sa “pasya.”
- source_word: לִמְנוּחָה
  choice: magdulot ng kapanatagan
  rationale: Ang מְנוּחָה ay pahinga, ginhawa, o katahimikan. Sa konteksto, hinihiling na ang pahayag ng hari ang mag-ayos sa usapin at magbigay ng kapanatagan.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: tulad ng anghel ng Diyos
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng sugo o anghel. Sa maringal na paghahambing sa hari, malamang ang makalangit na diwa, ngunit itinatala sa talababa ang tunay na alternatibo.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: sa pagkilala sa mabuti at masama
  rationale: Literal itong “upang marinig ang mabuti at ang masama,” ngunit ang שׁמע ay may diwang hudisyal na pakikinig, pag-unawa, at pagkilatis. Ang “pagkilala” ay natural sa Filipino habang ipinapaliwanag sa talababa ang literal na larawan.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: si Yahweh na iyong Diyos
  rationale: Ginagamit ang personal na pangalang Yahweh para sa יהוה at pinananatili ang ikalawang panauhang pag-aari.
- source_word: יְהִי עִמָּךְ
  choice: sumaiyo nawa
  rationale: Likas at marangal na pormula ng pagpapala sa Filipino para sa jussive na “nawa ay makasama mo.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng מַלְאָךְ sa paghahambing sa hari
  choice: anghel
  alternative: sugo
  rationale: Ang paghahambing ay nagtatanghal sa hari bilang may pambihirang kakayahang kumilala o humatol. Ang “anghel” ang mas malamang na diwa rito, ngunit nananatiling leksikal na posible ang “sugo.”
- issue: Diwa ng “marinig ang mabuti at masama”
  choice: pagkilala sa mabuti at masama
  alternative: pakikinig sa mabuti at masama
  rationale: Ang literal na pandinig ay may hudisyal na diwa sa konteksto. Hindi ginagawang “pagpapasya sa pagitan” sa pangunahing teksto upang hindi labis na lutasin ang saklaw ng idyoma.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “panginoon kong hari” upang mapanatili ang magalang na katawagang panghukuman, at “sumaiyo nawa” bilang likas na pormula ng pagpapala. Lahat ng marker ng talababa ay nasa pangunahing teksto.
