base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: tl
  text: Sinabi ng hari sa kanya, “Ano ang problema?”[a] Sumagot siya, “Tunay nga,[b] isa akong balo, at namatay ang asawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ano ang problema mo?”
    reason: lexical_alternative
  - marker: b
    text: O, “Ay, isa akong balo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָךְ
  choice: Ano ang problema?
  rationale: Ang idyomang Hebreo ay literal na ‘ano sa iyo’ at nagtatanong kung ano ang suliranin ng kausap. Natural at malinaw sa makabagong Tagalog ang ‘Ano ang problema?’; nasa talababa ang anyong tahasang may ‘mo.’
- source_word: אֲבָל
  choice: Tunay nga
  rationale: Dito, ang אֲבָל ay higit na nagsisilbing panandang nagbibigay-diin sa katotohanan ng pahayag kaysa bilang panalungat na ‘ngunit.’ Pinananatili ng ‘Tunay nga’ ang mariing tono, habang itinatala sa talababa ang posibleng himig ng panaghoy.
- source_word: אִשָּׁה אַלְמָנָה
  choice: isa akong balo
  rationale: Bagaman literal na ‘babaeng balo,’ ang ‘isa akong balo’ ang natural at ganap na katumbas sa Tagalog.
- source_word: וַיָּמָת אִישִׁי
  choice: namatay ang asawa ko
  rationale: Sa kontekstong ito, ang אִישׁ na may hulaping unang panauhan ay tumutukoy sa asawa. Ang pandiwang וַיָּמָת ay tuwirang isinalin bilang naganap na pangyayaring ‘namatay.’
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin na pinananatili ang tiyak na pantukoy.
- source_word: וַתֹּאמֶר
  choice: Sumagot siya
  rationale: Bagaman literal na ‘at sinabi niya,’ ang ‘sumagot siya’ ay natural sa Tagalog at malinaw na inilalarawan ang tugon niya sa tanong ng hari nang hindi binabago ang diwa.
