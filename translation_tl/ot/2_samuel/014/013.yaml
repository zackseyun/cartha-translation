    rationale: Ang Hebreong anyo ay paghahambing sa isang taong may-sala/mananagot. Ang “nagkasala” ay maaaring magpahiwatig ng aktuwal na paggawa ng kasalanan at bahagyang naililihis ang retorikal na paghahambing.
  - severity: low
