- from: Pagkatapos ay sinabi ng babae[a], “Kung gayon, bakit kayo nagbalak ng ganitong bagay laban sa bayan ng Diyos? Sapagkat sa pagsasalita ng hari ng salitang ito, para siyang nagkasala[b], dahil hindi ibinalik ng hari ang sarili niyang ipinatapon.”
  to: Pagkatapos ay sinabi ng babae[a], “Kung gayon, bakit kayo nagbalak ng ganitong bagay laban sa bayan ng Diyos? Sapagkat sa pagsasabi ng hari ng bagay na ito, para siyang isang may-sala[b], dahil hindi ibinalik ng hari ang kanyang ipinatapon.”
  rationale: Pinalitan ang “nagkasala” ng “isang may-sala” upang mas tumpak na maipahayag ang כְּאָשֵׁם bilang retorikal na paghahambing sa isang taong guilty o mananagot. Inayos din ang sintaksis ng sugnay tungkol sa pagsasalita ng hari. Ang “kanyang ipinatapon” at ang talababa ay inayos upang huwag magdagdag ng hindi kinakailangang paghahayag tungkol sa kung sino ang tuwirang nagpatapon.
