  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang retorikal na tanong, ang “bayan ng Diyos,” ang paghahambing sa isang may-sala, at ang hindi pagpapabalik sa ipinatapon ay napapanatili. Gayunman, ang “para siyang nagkasala” ay mas tumutukoy sa paggawa ng isang kasalanan kaysa sa pagiging may-sala o mananagot, na siyang diwa ng כְּאָשֵׁם.'
  naturalness: Hindi lubos na natural ang “sa pagsasalita ng hari ng salitang ito.” Mas malinaw at mas maayos sa makabagong Filipino ang “sa pagsasabi ng hari ng bagay na ito.”
  terminology: Ang “bayan ng Diyos” ay angkop. Ang “may-sala” ang mas eksaktong katumbas ng אָשֵׁם sa kontekstong ito kaysa “nagkasala.” Ang “kanyang ipinatapon” ay pinanatili upang maipahayag ang isahang anyo at ugnayan sa hari nang hindi tahasang pinapangalanan si Absalom.
