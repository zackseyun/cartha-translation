  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng babae[a], “Kung gayon, bakit kayo nagbalak ng ganitong bagay laban sa bayan ng Diyos? Sapagkat sa pagsasabi ng hari ng bagay na ito, para siyang isang may-sala[b], dahil hindi ibinalik ng hari ang kanyang ipinatapon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-isip” o “bumuo ng ganitong balak laban sa bayan ng Diyos?”
    reason: lexical_alternative
  - marker: b
    text: O “ang hari ay tulad ng isang may-sala”; ipinahihiwatig ng sarili niyang hatol na para siyang may-sala dahil hindi niya ibinalik ang kanyang ipinatapon.
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: nagbalak
  rationale: Maaaring tumukoy ang pandiwa sa pag-iisip, pagbabalak, o pagbuo ng isang panukala. Sa tuwirang pagsaway ng babae sa patakaran ni David kay Absalom, ang “nagbalak” ay nagpapahayag ng sinasadyang pasiya nang hindi labis na pinatitindi ang paratang.
- source_word: כָּזֹאת
  choice: ng ganitong bagay
  rationale: Tumutukoy ang demonstratibo sa kilos na ipinahihiwatig ng naunang talinghaga; natural ito sa Filipino at pinananatili ang mapanumbat na lakas.
- source_word: עַל עַם אֱלֹהִים
  choice: laban sa bayan ng Diyos
  rationale: Sa pagkakaugnay nito sa חָשַׁב at sa konteksto, may diwang salungat o nakapipinsala. Pinananatili rin ang tahasang malawak na katawagang “bayan ng Diyos.”
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: Sapagkat sa pagsasalita ng hari ng salitang ito
  rationale: 'Itinuturing ang מִן na panimula ng sirkumstansiyal o sanhi: sa mismong pagbigkas ng hatol ay ipinapahiwatig ng hari ang sarili niyang pagkakasala.'
- source_word: כְּאָשֵׁם
  choice: para siyang nagkasala
  rationale: Pinananatili ng “para” ang paghahambing na nasa prefixed כְּ, sa halip na gawing tuwirang pahayag lamang ng hatol.
- source_word: לְבִלְתִּי
  choice: dahil hindi
  rationale: Malinaw at natural na ipinakikita sa Filipino ang batayan ng paratang.
- source_word: הָשִׁיב
  choice: ibinalik
  rationale: Ang Hiphil ng שוב ay “magpabalik” o “ibalik”; dito ay isang taong nasa pagkakatapon ang layon.
- source_word: נִדְּחוֹ
  choice: ang sarili niyang ipinatapon
  rationale: Pinananatili ang isahan at ang kaugnayan nito sa hari. Ang “ipinatapon” ay nagpapahayag ng taong itinaboy o pinanatiling malayo, habang hindi tahasang pinapangalanan si Absalom.
theological_decisions:
- issue: Saklaw ng “bayan ng Diyos” sa paratang ng babae
  choice: Panatilihin ang “bayan ng Diyos” nang hindi ito nililimitahan kay Absalom o sa sambahayan ng hari.
  alternative: “Israel” o “si Absalom at ang sambahayan ng hari”
  rationale: Tahasan sa Hebreo ang עַם אֱלֹהִים. Bagaman nakaugat ang paratang sa pagtrato kay Absalom, ipinahahayag ng pananalita ng babae na may epekto ito sa buong bayang tipan.
- issue: Lakas ng paratang sa כְּאָשֵׁם
  choice: 'Panatilihin ang anyong paghahambing: “para siyang nagkasala.”'
  alternative: “nagkasala ang hari” o “nakatayong may-sala ang hari”
  rationale: May prefixed כְּ ang Hebreo, kaya hindi dapat tahimik na gawing tuwirang hatol ang retorikal na paghahambing.
translation_notes:
  register: Makabagong Filipino na magalang at marangal ang himig. Ginamit ang “kayo” sa pakikipag-usap sa hari. Pinanatili ang retorikal na paghahambing at ang malawak na katawagang “bayan ng Diyos,” habang iniwasan ang denominasyonal o doktrinal na pagpapaliwanag na wala sa teksto.
