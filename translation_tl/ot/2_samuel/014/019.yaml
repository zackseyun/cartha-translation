base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: tl
  text: Sinabi ng hari, “May kinalaman ba si Joab sa lahat ng ito?” Sumagot ang babae, “Sa buhay mo, panginoon kong hari,[a] walang sinumang maaaring lumihis sa kanan o sa kaliwa[b] mula sa anumang sinabi ng panginoon kong hari. Sapagkat ang lingkod mong si Joab ang nag-utos sa akin, at siya mismo ang naglagay ng lahat ng salitang ito sa bibig ng iyong babaeng lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Sa buhay ng iyong kaluluwa.” Isa itong pormula ng panunumpa na maaari ring isaling, “Kung paanong tiyak na buhay ka.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lumihis sa kanan o sa kaliwa” ay idyomang Hebreo para sa paglihis, pagsalungat, o pag-iwas sa sinabi ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: May kamay ba si Joab
  rationale: Pinananatili ang kongkretong larawang Hebreo ng “kamay” bilang tanda ng pakikialam o pagkakasangkot; nauunawaan din ito sa natural na Tagalog bilang pagkakaroon ng bahagi sa isang balak.
- source_word: בְּכָל זֹאת
  choice: sa lahat ng ito
  rationale: Likas at malawak na tumutukoy sa buong pakana o pangyayaring pinag-uusapan.
- source_word: חֵי נַפְשְׁךָ
  choice: Sa buhay mo
  rationale: Maikli at marangal na anyo ng panunumpang nakasalig sa buhay ng hari; iniiwasan ang di-likas na literalismong “buhay ang iyong kaluluwa,” habang inilalahad iyon sa talababa.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: walang sinumang maaaring lumihis sa kanan o sa kaliwa
  rationale: Pinananatili ang metaporang pandireksiyon at ang diwa ng hindi paglihis, pagsalungat, o pag-iwas sa sinabi ng hari.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: mula sa anumang sinabi
  rationale: Ipinakikita ng “mula sa” ang paglihis mula sa mga sinabi ng hari, alinsunod sa pagkakaugnay nito sa naunang idyoma.
- source_word: עַבְדְּךָ יוֹאָב
  choice: ang lingkod mong si Joab
  rationale: Ang “lingkod” ay angkop sa magalang na pananalita sa korte at hindi nagpapahiwatig nang higit sa hinihingi ng konteksto tungkol sa legal na katayuan ni Joab.
- source_word: צִוָּנִי
  choice: nag-utos sa akin
  rationale: Tuwirang ipinahahayag ang awtoridad na ginamit ni Joab sa pagbibigay ng tagubilin sa babae.
- source_word: שָׂם בְּפִי
  choice: naglagay ... sa bibig
  rationale: Pinananatili ang malinaw at masiglang idyomang Hebreo para sa pagbibigay ng mismong mga salitang sasabihin.
- source_word: שִׁפְחָתְךָ
  choice: iyong babaeng lingkod
  rationale: Pinananatili ang pambabaeng anyo at ang magalang na pagtukoy ng babae sa sarili nang hindi gumagamit ng lipas na “alilang babae.”
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: lahat ng salitang ito
  rationale: Ang “mga salita” ang pinakaangkop sapagkat ang tinutukoy ay ang pananalitang inihanda ni Joab para sa babae.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iyong/mo” upang mapanatili ang tuwirang isahang pakikipag-usap at himig ng korte. Pinanatili ang mga larawang “kamay,” “kanan o kaliwa,” at “sa bibig” dahil malinaw pa rin ang mga ito sa Tagalog at mahalaga sa anyong Hebreo.
