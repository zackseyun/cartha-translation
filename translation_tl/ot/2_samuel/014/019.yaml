  source_fidelity: 'Tumpak ang kabuuang pagsasalin sa Hebreo: ang tanong ng hari tungkol sa pagkakasangkot ni Joab, ang pormula ng panunumpa, ang idyomang kanan/kaliwa, ang utos ni Joab, at ang paglalagay niya ng mga salita sa bibig ng babae ay lahat naipahayag. Gayunman, ang unang tanong ay mas magiging malinaw sa modernong Tagalog kung tuwirang ipahihiwatig ang pakikialam ni Joab kaysa sa medyo di-karaniwang “May kamay ba si Joab.”'
