  terminology: Ang “panginoon kong hari,” “lingkod,” “babaeng lingkod,” “nag-utos,” at “mga salita” ay angkop at pare-pareho sa kontekstong panghukuman. Ang “Sa buhay mo” ay katanggap-tanggap na maigsi at marangal na anyo ng panunumpa.
