  to: Sinabi ng hari, “May kinalaman ba si Joab sa lahat ng ito?” Sumagot ang babae, “Sa buhay mo, panginoon kong hari,[a] walang sinumang maaaring lumihis sa kanan o sa kaliwa[b] mula sa anumang sinabi ng panginoon kong hari. Sapagkat ang lingkod mong si Joab ang nag-utos sa akin, at siya mismo ang naglagay ng lahat ng salitang ito sa bibig ng iyong babaeng lingkod.”
