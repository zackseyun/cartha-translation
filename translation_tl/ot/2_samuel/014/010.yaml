  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: tl
  text: Sinabi ng hari, “Ang sinumang magsalita sa iyo ay dalhin mo sa akin, at hindi ka na niya muling gagalawin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ka na niya muling sasaktan.” Ang Hebreong pandiwa ay literal na “hipuin” o “galawin” ngunit, sa kontekstong ito, maaaring magpahiwatig ng mapanakit na paghipo o pananakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Karaniwang salin ng מֶלֶךְ, na pinananatili ang tiyak na pantukoy.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: sinumang magsalita laban sa iyo
  rationale: Ang may-pantukoy na participle ay tumutukoy sa sinumang magsasalita sa babae; sa konteksto, ang pagsasalita ay laban o bilang pagtutol sa kanya, kaya likas sa Filipino ang “magsalita laban sa iyo.”
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: dalhin mo siya sa akin
  rationale: Ang Hiphil ng בוא ay sanhi, “papuntahin” o “dalhin”; ang huli ang pinakanatural dito.
- source_word: לֹא יֹסִיף עוֹד
  choice: hindi na ... muling
  rationale: Magkasamang ipinahihiwatig ng יסף at עוד ang pagtigil ng pag-uulit o pagpapatuloy.
- source_word: לָגַעַת בָּךְ
  choice: gagalawin ka
  rationale: Pinananatili ang pangunahing diwa ng נגע na “humipo/gumalaw,” habang ang “gagalawin” sa Filipino ay maaari ring magpahiwatig ng pananakot, panghihimasok, o pananakit na angkop sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gagalawin” upang mapanatili ang literal na larawan at ang posibleng diwang mapanakit; nilinaw sa talababa ang alternatibong kontekstuwal na kahulugan.
