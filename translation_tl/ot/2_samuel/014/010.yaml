  source_fidelity: Ang “magsalita laban sa iyo” ay nagdaragdag ng diwang pagsalungat na wala sa Hebreong הַמְדַבֵּר אֵלַיִךְ, na tuwirang “ang nagsasalita sa iyo.” Wasto ang “dalhin mo siya sa akin” para sa causative na anyo, at ang “hindi ka na niya muling gagalawin” ay maayos na pinananatili ang literal ngunit malawak na diwa ng נגע.
  naturalness: Natural at marangal sa makabagong Filipino ang “Ang sinumang magsalita sa iyo ay dalhin mo sa akin.” Ang “gagalawin” ay angkop sa kontekstong pananggalang, bagaman dapat linawin ng talababa ang posibleng diwang pananakit nang hindi isinasalin iyon sa pangunahing teksto.
  terminology: Ang “hari” at “dalhin” ay tumpak. Pinananatili ng “gagalawin” ang sinadyang kalabuan ng Hebreong pandiwa; ang alternatibong “sasaktan” ay nararapat lamang sa talababa.
