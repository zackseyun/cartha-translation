  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: tl
  text: Sinabi ng hari sa babae, “Umuwi ka, at magbibigay ako ng mga utos tungkol sa iyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa iyo” o “alang-alang sa iyo.” Maaaring unawain sa higit sa isang paraan ang pang-ukol sa Hebreo, ngunit ang diwa ay maglalabas ang hari ng mga tagubilin hinggil sa babae o sa kanyang usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang payak na “Sinabi” nang hindi kinakailangang ulitin ang “at” o idagdag ang “pagkatapos.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: הָאִשָּׁה
  choice: sa babae
  rationale: Ang tinutukoy sa konteksto ay ang babae mula sa Tekoa; hindi ang kahulugang “asawa” na maaari ring taglayin ng אִשָּׁה sa ibang konteksto.
- source_word: לְכִי לְבֵיתֵךְ
  choice: Umuwi ka
  rationale: Ang literal na “Pumunta ka sa iyong bahay” ay likas na ipinahahayag sa Tagalog bilang “Umuwi ka.” Napananatili nito ang utos na pambabaeng isahan sa konteksto, bagaman walang kasariang gramatikal ang pandiwang Tagalog.
- source_word: וַאֲנִי
  choice: at ... ako
  rationale: Napananatili ang tahasang panghalip na nagbibigay-diin sa hari bilang siyang kikilos.
- source_word: אֲצַוֶּה
  choice: magbibigay ako ng mga utos
  rationale: Ang piel ng צוה ay nangangahulugang mag-utos o magbigay ng mga tagubilin. Ang pariralang ito ay natural sa pananalita ng hari at nagpapanatili ng diwa ng awtoridad.
- source_word: עָלָיִךְ
  choice: tungkol sa iyo
  rationale: Sa pagkakaugnay nito sa צוה, maaaring tukuyin ng עַל ang tao o usaping saklaw ng utos. Ang “tungkol sa iyo” ay nagpapanatili sa malamang na diwa nang hindi ipinapalagay na tiyak na pabor sa babae ang utos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Umuwi ka” bilang natural na katumbas ng literal na “Pumunta ka sa iyong bahay,” at pinanatili sa talababa ang tunay na kalabuan ng pang-ukol sa huling parirala.
