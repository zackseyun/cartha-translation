translation:
  language: tl
  text: Pagkatapos, pumunta ka sa hari at magsalita ka sa kanya nang ganito.[a] At inilagay ni Joab ang mga salita sa bibig niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “inilagay ni Joab ang mga salita sa bibig niya” ay isang idyomang Hebreo na nangangahulugang ibinigay ni Joab sa babae ang eksaktong mga salitang sasabihin niya.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Pagkatapos, pumunta ka
  rationale: Ang Qal perfect na 2fs na may pang-ugnay ay bahagi ng sunod-sunod na tagubilin at may puwersang pautos; natural na ipinapakita ng “Pagkatapos” ang kasunod na hakbang.
- source_word: אֶל־הַמֶּלֶךְ
  choice: sa hari
  rationale: Ang אֶל ay nagpapahayag ng paglapit o pagtungo; sa Filipino, sapat at natural ang “pumunta sa hari.”
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: at sabihin mo sa kanya
  rationale: Ang דבר אֶל ay literal na “magsalita sa,” ngunit sa kontekstong may tiyak na iskrip, mas natural sa Filipino ang “sabihin mo sa kanya” nang hindi dinaragdagan ang nilalaman.
- source_word: כַּדָּבָר הַזֶּה
  choice: ang ganito
  rationale: Ipinakikilala ng parirala ang anyo o nilalaman ng sasabihin. Ang “sabihin ... ang ganito” ay maikli, makabago, at nagpapanatili sa demonstratibong diwa.
- source_word: וַיָּשֶׂם
  choice: inilagay
  rationale: Pinananatili nito ang literal at masining na larawan ng שׂים sa idyomang “ilagay sa bibig.”
- source_word: אֶת־הַדְּבָרִים
  choice: ang mga salitang sasabihin niya
  rationale: Ang דְּבָרִים ay tumutukoy sa ispesipikong pananalitang ibinigay ni Joab. Nililinaw ng “sasabihin niya” ang natural na kahulugan ng idyoma nang hindi pinapalitan ang larawan.
- source_word: בְּפִיהָ
  choice: sa bibig niya
  rationale: Pinananatili ang matingkad na idyomang Hebreo; ipinapaliwanag sa talababa na nangangahulugan itong itinuro ni Joab ang eksaktong sasabihin niya.
