translation_notes:
  register: Makabago at marangal na salaysay sa karaniwang Filipino. Ginamit ang “siya/kanya/niya” sa natural na paraan; malinaw sa konteksto na babae ang kinakausap at tinutukoy. Pinanatili ang idyomang “inilagay ... sa bibig” at ipinaliwanag ito sa talababa.
