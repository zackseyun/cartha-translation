  source_fidelity: Ang unang pangungusap ay tumpak na naghahatid ng sunod-sunod na utos. Gayunman, ang “mga salitang sasabihin niya” ay nagdaragdag ng elementong panghinaharap na wala sa Hebreo at bahagyang ipinapaliwanag na sa loob mismo ng teksto ang idyomang “inilagay ... sa bibig niya.” Mas malapit ang “ang mga salita sa bibig niya.”
  naturalness: Natural at angkop sa makabagong Filipino ang “Pumunta ka sa hari” at “magsalita ka sa kanya nang ganito.” Ang huling pangungusap ay nananatiling malinaw at marangal habang pinananatili ang larawan ng Hebreo.
  terminology: Wasto ang “hari,” “Joab,” at ang idyomang “inilagay ... sa bibig.” Ang talababa ang nararapat na lugar upang ipaliwanag ang idyoma, hindi ang pagdaragdag ng “sasabihin niya” sa pangunahing teksto.
