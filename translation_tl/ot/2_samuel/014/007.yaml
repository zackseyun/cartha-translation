base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: tl
  text: At narito, ang buong angkan ay bumangon laban sa iyong lingkod at nagsabi, “Ibigay mo sa amin ang taong humampas sa kanyang kapatid, upang patayin namin siya kapalit ng buhay ng kapatid na pinatay niya. Lilipulin din namin ang tagapagmana.” Sa gayon, aapulahin nila ang nag-iisa kong natitirang baga[a], kaya ang aking asawa ay mawawalan ng pangalan at lahing matitira sa ibabaw ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang huli kong baga.” Ang natitirang nagbabagang baga ay larawan ng kanyang huling nabubuhay na anak at ng pag-asang magpapatuloy ang kanilang angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang “pangalan at lahing matitira” ay tumutukoy sa pagpapatuloy ng alaala at angkan ng lalaki, hindi lamang sa kanyang reputasyon.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁפְחָתֶךָ
  choice: iyong lingkod
  rationale: Bagaman pambabae ang anyo sa Hebreo, ito ay mapagpakumbabang pagtukoy ng babae sa sarili habang nakikipag-usap sa hari. Likas at marangal sa Tagalog ang “iyong lingkod.”
- source_word: קָמָה ... עַל
  choice: bumangon laban sa
  rationale: Pinananatili nito ang larawan ng pagbangon at malinaw na ipinahihiwatig ang sama-samang pagkilos na laban sa nagsasalita.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: ang buong angkan
  rationale: Ang tinutukoy ay mas malawak na pangkat ng magkakamag-anak, kaya mas tiyak dito ang “angkan” kaysa “pamilya.”
- source_word: תְּנִי
  choice: Ibigay mo sa amin
  rationale: Sa kontekstong panghukuman, hinihingi ng angkan na isuko sa kanila ang anak. Idinagdag ang “sa amin” bilang likas na ipinahihiwatig na layon sa Tagalog.
- source_word: מַכֵּה אָחִיו
  choice: ang taong humampas sa kanyang kapatid
  rationale: Hindi agad isinalin bilang “mamamatay-tao”; pinananatili muna ang kilos ng pananakit bago sabihin ng kasunod na sugnay na napatay niya ang kapatid.
- source_word: וּנְמִתֵהוּ
  choice: upang patayin namin siya
  rationale: Malinaw na ipinapahayag ang nilalayong pagpatay nang hindi nagdaragdag ng tiyak na legal na pamamaraan.
- source_word: בְּנֶפֶשׁ אָחִיו
  choice: kapalit ng buhay ng kapatid
  rationale: Ipinahahayag nito ang diwang buhay-kapalit-ng-buhay ng parirala.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: Lilipulin din namin ang tagapagmana
  rationale: Pinananatili ang tindi ng pandiwa at ang hayagang layuning alisin pati ang natitirang tagapagmana.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: papatayin nila ang natitira kong baga
  rationale: Ang “patayin ang baga” ay likas na Tagalog para sa pag-apula nito at pinananatili ang metapora ng huling nabubuhay na pag-asa ng angkan.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: pangalan at lahing matitira
  rationale: 'Pinananatili ang dalawang kaugnay ngunit hindi magkaparehong ideya: ang pangalan o alaala ng lalaki at ang nagpapatuloy niyang lahi.'
