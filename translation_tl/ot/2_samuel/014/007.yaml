translation_notes:
  register: Makabago ngunit marangal na Tagalog; pinanatili ang tuwirang pananalita, ang legal na diwa ng pagganti ng buhay sa buhay, at ang metapora ng natitirang baga. Ginamit ang “angkan” upang maipakita ang malawak na pangkat ng magkakamag-anak.
