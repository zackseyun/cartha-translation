    issue: Ang “papatayin nila ang ... baga” ay hindi ang pinakalikas na pandiwa para sa pag-apula.
    rationale: Ang כבה ay “apulahin/patayin” sa apoy; “aapulahin” ang mas tiyak at iniiwasang malito sa literal na pagpatay sa naunang pangungusap.
