  terminology: Ang “matalinong babae,” “pagluluksa,” “langis,” at “Tekoa” ay angkop. Nanatiling maingat ang tala sa pandiwang “magluksa,” na nagpapaliwanag ng kontekstuwal na pagpapanggap nang hindi itinatanghal iyon bilang literal na kahulugan ng pandiwa.
