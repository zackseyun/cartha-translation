revisions:
- from: Kaya nagsugo si Joab sa Tekoa at ipinakuha roon ang isang matalinong babae. Sinabi niya rito, “Magkunwari kang nagluluksa[a] at magsuot ka ng damit ng pagluluksa.[b] Huwag kang magpahid ng langis sa iyong katawan,[c] kundi umasta kang gaya ng isang babaeng maraming araw nang nagluluksa dahil sa isang namatay.”[d]
  to: Kaya nagsugo si Joab sa Tekoa at kumuha siya roon ng isang matalinong babae. Sinabi niya rito, “Magkunwari kang nagluluksa[a] at magsuot ka ng damit ng pagluluksa.[b] Huwag kang magpahid ng langis sa iyong katawan,[c] kundi umasta kang gaya ng isang babaeng maraming araw nang nagluluksa dahil sa pagkamatay ng isang tao.”[d]
  rationale: Pinalitan ang causative na “ipinakuha” ng payak na “kumuha siya,” alinsunod sa pandiwang Hebreo. Inayos din ang huling parirala upang maging mas likas sa modernong Filipino nang hindi tinutukoy ang taong namatay. Pinanatili ang mga talababa at ang kanilang mga pananda sa mga kaugnay na parirala.
