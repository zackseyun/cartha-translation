translation_notes:
  register: Gumamit ng makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang Tekoa bilang pangalan ng lugar at ang di-tiyak na pagkakakilanlan ng namatay. Ang pag-uulit ng magalang na particle נָא ay hindi mekanikal na isinalin sa bawat utos; ang tono ay ipinahayag sa natural na paraan nang hindi ginagawang labis na pormal o mapakiusap ang pananalita ni Joab.
