base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: tl
  text: Kaya nagsugo si Joab sa Tekoa at kumuha siya roon ng isang matalinong babae. Sinabi niya rito, “Magkunwari kang nagluluksa[a] at magsuot ka ng damit ng pagluluksa.[b] Huwag kang magpahid ng langis sa iyong katawan,[c] kundi umasta kang gaya ng isang babaeng maraming araw nang nagluluksa dahil sa pagkamatay ng isang tao.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Magluksa ka” o “Umasta kang nagluluksa.” Ang pandiwang Hebreo ay nangangahulugang “magluksa,” ngunit ipinakikita ng konteksto na inuutusan siyang gumanap bilang nagluluksa bilang bahagi ng isang planadong pagpapanggap.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga kasuutan ng pagluluksa.”
    reason: lexical_alternative
  - marker: c
    text: Ang hindi pagpapahid ng langis sa katawan ay kaugalian noon bilang tanda ng pagdadalamhati, kabaligtaran ng karaniwang pag-aayos at pagpapasariwa sa sarili.
    reason: cultural_note
  - marker: d
    text: Sa literal, “gaya ng isang babaeng maraming araw nang nagluluksa dahil sa pagkamatay ng isang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Tekoa
  rationale: Isinalin sa karaniwang transliterasyon sa Filipino bilang pangalan ng lugar, sa halip na isalin ang kahulugan nito.
- source_word: אִשָּׁה חֲכָמָה
  choice: isang matalinong babae
  rationale: Pinananatili ng “matalino” ang pangunahing diwa ng חֲכָמָה habang hindi nililimitahan kung ito ay karunungan, kahusayan, o pagiging tuso sa sitwasyong ito.
- source_word: הִתְאַבְּלִי נָא
  choice: Magkunwari kang nagluluksa
  rationale: Ang pandiwa ay literal na tumutukoy sa pagluluksa, ngunit malinaw sa salaysay na inuutusan siyang gumanap bilang nagluluksa. Ipinahahayag ng “magkunwari” ang kontekstuwal na layunin, habang inilalagay sa talababa ang mas literal na pagbasa.
- source_word: וְלִבְשִׁי נָא בִגְדֵי אֵבֶל
  choice: at magsuot ka ng damit ng pagluluksa
  rationale: Natural at malinaw na Filipino para sa kasuotang ginagamit bilang tanda ng pagdadalamhati; pinananatili rin ang larawan ng Hebreong parirala.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: Huwag kang magpahid ng langis sa iyong katawan
  rationale: Ang סוך ay pagpapahid ng langis sa katawan bilang bahagi ng karaniwang pag-aayos o pagpapaginhawa. Nilinaw ang katawan upang hindi mapagkamalang pagluluto o rituwal na pagbubuhos.
- source_word: וְהָיִית כְּאִשָּׁה
  choice: kundi umasta kang gaya ng isang babae
  rationale: Ipinakikita ng “umasta” na ang tagubilin ay tungkol sa ipinapakitang kalagayan. Ang “kundi” ay natural na nag-uugnay sa kaibahan mula sa naunang pagbabawal, bagaman karaniwang pang-ugnay lamang ang nasa Hebreo.
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: maraming araw nang nagluluksa dahil sa isang namatay
  rationale: Ipinahahayag ng “maraming araw nang” ang nagpapatuloy at matagal na kalagayan. Ang “isang namatay” ay nagpapanatili sa di-tiyak na isahang מֵת, sa halip na tukuyin kung sino ang namatay.
