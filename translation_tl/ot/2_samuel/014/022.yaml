base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: tl
  text: At nagpatirapa si Joab sa lupa, yumukod, at pinagpala ang hari. Sinabi ni Joab, “Ngayon ay alam ng iyong lingkod na nakasumpong ako ng lingap sa iyong paningin, panginoon kong hari, sapagkat tinupad ng hari ang sinabi ng kanyang lingkod.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ginawa ng hari ang salita ng kanyang lingkod.” Maaari rin itong mangahulugang “pinagbigyan ng hari ang kahilingan ng kanyang lingkod.”'
    reason: Ipinakikita ang literal na idyomang Hebreo at ang posibleng kahulugang ayon sa konteksto nang hindi ito ipinipilit sa pangunahing teksto.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: nagpatirapa si Joab sa lupa
  rationale: Ipinahahayag ng pariralang Hebreo ang pagbagsak nang nakaharap sa lupa bilang kilos ng matinding paggalang. Ang “nagpatirapa ... sa lupa” ay natural at malinaw sa modernong Tagalog.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Sa harap ng isang haring tao, tumutukoy ito sa pagpupugay o pagyukod, hindi kinakailangang pagsambang panrelihiyon.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: binasbasan ang hari
  rationale: 'Pinananatili nito ang karaniwang kahulugan ng piel ng ברך sa isang taong layon: magsalita o magpahayag ng pagpapala. Hindi ito pinalitan ng “nagpasalamat,” bagaman maaaring kasama sa konteksto ang pasasalamat.'
- source_word: הַיּוֹם יָדַע עַבְּדְּךָ
  choice: Ngayon ay alam ng iyong lingkod
  rationale: Ipinahahayag ng perpektong pandiwa ang kasalukuyang katiyakang bunga ng ginawa ng hari. Ang “alam ... ngayon” ay mas natural kaysa sa literal ngunit matigas na “ngayong araw ay nalaman.”
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nakasumpong ako ng kagandahang-loob sa iyong paningin
  rationale: Pinananatili ang larawang Hebreo na “sa iyong paningin” at ang pormulang tumutukoy sa pagtanggap o pabor.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Ang “panginoon” dito ay magalang na tawag sa haring tao; pinananatili nito ang wikang panghukuman nang hindi ginagawang banal ang titulo.
- source_word: עָשָׂה הַמֶּלֶךְ אֶת דְּבַר עַבְדּוֹ
  choice: tinupad ng hari ang sinabi ng kanyang lingkod
  rationale: Malapit ito sa literal na “ginawa ang salita ng kanyang lingkod,” ngunit mas natural sa Tagalog. Hindi nito lubusang nilulutas kung ang “salita” ay kahilingan, payo, o bilin.
theological_decisions:
- issue: Pagpugay sa isang haring tao
  choice: “nagpatirapa,” “yumukod,” at “panginoon kong hari” bilang wikang panghukuman
  alternative: “sumamba” at pag-unawa sa “panginoon” bilang banal na titulo
  rationale: Ang konteksto ay paggalang at pagpupugay kay David bilang hari, hindi tahasang pagsambang ukol sa Diyos.
- issue: Kahulugan ng pagpapala sa hari
  choice: “binasbasan ang hari”
  alternative: “nagpasalamat sa hari”
  rationale: Pinananatili ang leksikal na kahulugan ng ברך at hindi ginagawang pasasalamat lamang ang maaaring mas malawak na pahayag ng pagpapala.
- issue: Saklaw ng “salita ng kanyang lingkod”
  choice: “tinupad ... ang sinabi ng kanyang lingkod”
  alternative: “pinagbigyan ... ang kahilingan ng kanyang lingkod”
  rationale: Ang alternatibo ay makatuwiran sa konteksto ngunit mas tiyak kaysa sa Hebreo. Pinananatili ng pangunahing salin ang bahagyang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magalang na pagsasalita ni Joab tungkol sa sarili bilang “iyong lingkod” at tungkol sa kausap niyang hari sa ikatlong panauhan. Ang tandang [a] ay inilagay sa sugnay na aktuwal na ipinaliliwanag nito.
