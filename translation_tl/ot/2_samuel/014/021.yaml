base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari kay Joab, “Tingnan mo, ginawa ko na ang bagay na ito. Pumunta ka at ibalik mo ang binatang si Absalom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinanatili ang tiyak na titulo ng Hebreo sa halip na palitan ito ng personal na pangalan.
- source_word: הִנֵּה נָא
  choice: Masdan mo
  rationale: Ipinahahayag ng הִנֵּה ang pagtawag ng pansin, habang pinalalambot o binibigyang-diin ng נָא ang pahayag. Ang “Masdan mo” ay marangal at nauunawaan, nang hindi labis na ipinapaliwanag ang partikula.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: ginawa ko na ang bagay na ito
  rationale: Malapit ito sa literal na “ginawa ko ang bagay na ito” at hindi tahasang ginagawang “pinagbigyan ko ang kahilingan,” bagaman iyon ang ipinahihiwatig ng konteksto. Ipinakikita ng “na” ang natapos na kilos nang natural sa Tagalog.
- source_word: וְלֵךְ
  choice: Humayo ka at
  rationale: Pinananatili ng “at” ang pang-ugnay bago ang kasunod na utos. Ang “humayo” ay marangal at angkop sa utos ng hari.
- source_word: הָשֵׁב
  choice: ibalik mo
  rationale: 'Ang Hiphil ng שׁוב ay causative: si Joab ang magpapabalik kay Absalom. Malinaw na naihahayag ito ng “ibalik mo.”'
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring mangahulugan ang נַעַר ng bata, kabataan, lingkod, o binata. Dahil nasa hustong gulang si Absalom ngunit tinutukoy pa rin bilang nakababatang lalaki, ang “binata” ang pinakamaikli at marangal na katumbas.
- source_word: אֶת אַבְשָׁלוֹם
  choice: si Absalom
  rationale: Isinalin ang pantukoy sa personal na pangalan ayon sa natural na balarilang Tagalog at pinanatili ang apposisyon sa “ang binata.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig ng salaysay. Pinanatili ang malawak na pananalitang “ginawa ko na ang bagay na ito” upang hindi tahasang lutasin bilang pagbibigay sa kahilingan ni Joab. Walang talababa sapagkat malinaw na naipapahayag sa pangunahing teksto ang literal na diwa at hindi kailangan ang leksikal na alternatibo para maunawaan ang talata.
