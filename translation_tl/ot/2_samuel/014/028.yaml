  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: tl
  text: At nanirahan si Absalom sa Jerusalem sa loob ng dalawang buong taon, at hindi niya nakita ang mukha ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at hindi niya nakita ang mukha ng hari.” Ang idyomang ito ay nangangahulugang hindi siya personal na nakaharap o nakalapit sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang יָשַׁב ay maaaring mangahulugang umupo, manatili, o manirahan. Sa konteksto ng patuloy na paninirahan sa isang lungsod, likas at tumpak ang “nanirahan.”
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang locative phrase ito; “Jerusalem” ang karaniwang anyo ng pangalan ng lugar.
- source_word: שְׁנָתַיִם יָמִים
  choice: nang dalawang buong taon
  rationale: Ang literal na anyong “dalawang taon, mga araw” ay isang idyomang Hebreo na tumutukoy sa ganap na haba ng panahong iyon. Ipinahahayag ng “dalawang buong taon” ang puwersang ito sa natural na Tagalog.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: at hindi niya nakita ang mukha ng hari
  rationale: Pinananatili nito ang konkretong ekspresyong Hebreo at ang tuwirang ayos ng ikalawang sugnay. Nililinaw sa talababa na ang “makita ang mukha” ay tumutukoy sa personal na pagharap o paglapit sa hari.
