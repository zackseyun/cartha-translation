base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: tl
  text: At ngayon, naparito ako upang magsalita sa aking panginoong hari tungkol sa usaping ito, dahil tinakot ako ng mga tao. At sinabi ng inyong babaeng lingkod, “Sana’y makapagsalita ako sa hari; marahil ay gawin ng hari ang sinabi ng kanyang babaeng lingkod.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang panandang tumutukoy sa kasalukuyang paliwanag ng nagsasalita.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: naparito ako upang sabihin
  rationale: Likas sa modernong Tagalog at pinananatili ang ideya ng pagparito para magsalita.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: sa aking panginoong hari
  rationale: Pinananatili ang maharlikang titulo at ang magalang na pagtukoy sa hari.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Ang דָּבָר ay tumutukoy rito sa usapin o kahilingang inilalahad, hindi lamang sa isang binigkas na salita.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: dahil tinakot ako ng mga tao
  rationale: 'Ipinahahayag ang causative na diwa ng Piel ng ירא: ang mga tao ang naging sanhi ng kanyang takot.'
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: Kaya sinabi ng inyong lingkod
  rationale: Ang ikatlong-panauhang pagtukoy sa sarili ay mapagpakumbabang pananalita sa korte; natural at marangal sa Tagalog ang 'inyong lingkod.'
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Pahintulutan ninyo akong magsalita sa hari
  rationale: Inililipat ang magalang at kusang-loob na diwa ng cohortative na may נָא sa malinaw na modernong Tagalog.
- source_word: אוּלַי
  choice: Baka sakaling
  rationale: Natural na Tagalog para sa pag-asang may kawalang-katiyakan.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: gawin ng hari ang hinihiling ng kanyang lingkod
  rationale: Ang literal na 'gawin ang salita' ay hindi likas sa Tagalog; ipinahahayag ng 'hinihiling' ang kontekstuwal na kahulugan nang hindi ipinapalagay na tiyak na ipagkakaloob iyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal, angkop sa pananalita sa harap ng hari. Ginamit ang pangmaramihang anyong-galang na 'ninyo' at ang deferensiyal na 'inyong lingkod.'
