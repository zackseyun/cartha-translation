  source_fidelity: Tumpak na naihahatid ng salin ang utos ni Absalom, ang pag-aari ni Joab sa bukid na katabi ng kanya, ang sebada roon, at ang pagsasagawa ng mga lingkod sa paglalagay ng apoy sa bukid. Gayunman, ang layon ng pandiwang Hebreo na may hulaping pambabae ay ang bukid/lupain; dapat itong tahasang tukuyin sa utos sa Tagalog.
