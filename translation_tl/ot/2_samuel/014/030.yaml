base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Absalom sa kanyang mga lingkod, “Tingnan ninyo, ang bukid ni Joab ay katabi ng bukid ko, at may tanim siyang sebada roon. Pumunta kayo at sunugin ninyo ang bukid.” Kaya sinunog ng mga lingkod ni Absalom ang bukid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקַת
  choice: bukid
  rationale: Sa konteksto, tumutukoy ito sa isang lupang pansakang may tanim na sebada; natural at malinaw ang “bukid” sa modernong Filipino.
- source_word: אֶל יָדִי
  choice: katabi ng bukid ko
  rationale: Ang literal na “nasa aking kamay/tabi” ay isang idyoma ng pagiging magkatabi. Nililinaw ng “bukid ko” ang ipinahihiwatig na ari-arian nang hindi binabago ang diwa.
- source_word: שְׂעֹרִים
  choice: sebada
  rationale: Tumutukoy ang pangmaramihang Hebreo sa barley bilang pananim; “sebada” ang karaniwang katumbas sa Filipino.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: sunugin / sinunog
  rationale: Ang Hiphil ng יצת ay nangangahulugang pagsiklabin o sunugin. Ang pares na “sunugin/sinunog” ay natural sa Filipino at malinaw na naghahayag ng utos at pagsasagawa nito.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: mga lingkod / mga lingkod ni Absalom
  rationale: Maaaring mangahulugan ang עבד ng alipin o lingkod, ngunit hindi binibigyang-diin dito ang legal na kalagayan nila; ang “lingkod” ay angkop sa konteksto ng maharlikang sambahayan.
- source_word: רְאוּ
  choice: Tingnan ninyo
  rationale: Pinatutuon ng pautos na anyo ang pansin ng mga lingkod sa katabing bukid at natural itong pahayag sa Filipino.
- source_word: לְכוּ
  choice: Puntahan ninyo
  rationale: Ipinahahayag nito ang pautos na pagpunta sa tinukoy na bukid; mas natural dito ang “puntahan” kaysa sa hiwalay na “humayo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tahasang pinangalanan si Absalom sa unang sugnay upang maging malinaw ang panghalip sa nakahiwalay na talata; batay ang pagkakakilanlan sa agarang konteksto. Walang talababa dahil naipahayag nang natural sa teksto ang idyomang אֶל יָדִי.
