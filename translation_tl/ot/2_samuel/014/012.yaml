base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng babae, “Pahintulutan po ninyong magsalita ang inyong lingkod[a] ng isang salita sa aking panginoong hari.” Sinabi niya, “Magsalita ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inyong aliping babae” o “inyong babaeng lingkod”; ginamit sa pangunahing teksto ang natural na magalang na pananalitang “inyong lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas na ipinahahayag ng “Pagkatapos ay” ang pagkakasunod-sunod ng pangyayari.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Ang tinutukoy sa konteksto ay ang babaeng nakikipag-usap sa hari, kaya ito ang payak at malinaw na kahulugan.
- source_word: תְּדַבֶּר נָא
  choice: Pahintulutan po ninyong magsalita
  rationale: Ang anyong pakiusap kasama ang נָא ay magalang at mapagpakumbaba; ipinahahayag ito ng “pahintulutan po ninyo” sa natural na Filipino.
- source_word: שִׁפְחָתְךָ
  choice: ang inyong lingkod
  rationale: Bagaman pambabae ang salitang Hebreo, ang “inyong lingkod” ang natural na magalang at mapagpakumbabang pananalita sa Filipino; inilagay sa talababa ang tahasang pambabaeng anyo.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: sa aking panginoong hari
  rationale: Ang אֲדֹנִי ay pantawag-galang sa taong hari, hindi titulong ukol sa Diyos. Pinananatili ng salin ang pormal na pananalita sa korte.
- source_word: דָּבָר
  choice: isang salita
  rationale: Pinananatili nito ang maikli at kongkretong idyomang Hebreo, kahit maaari rin itong mangahulugang “isang bagay” o “isang usapin.”
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Payak nitong ipinagpapatuloy ang salaysay at ipinakikilala ang sagot ng hari.
- source_word: דַּבֵּרִי
  choice: Magsalita ka
  rationale: Tuwirang pautos ito sa isang babae; pinananatili ng salin ang ikli at tuwirang anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at magalang na himig na angkop sa pakikipag-usap sa hari. Ginamit ang “po” at maramihang panghalip-galang na “ninyo/inyong,” habang nanatiling tuwiran at maikli ang tugon ng hari.
