base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: tl
  text: Sinabi ng babae, “Nawa’y alalahanin po ng hari si Yahweh, ang inyong Diyos, upang huwag nang magpatuloy sa paglipol ang tagapaghiganti ng dugo[a], at hindi nila mapuksa ang anak ko.” Sumagot ang hari, “Buhay si Yahweh, ni isang buhok ng inyong anak ay hindi malalaglag sa lupa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kamag-anak na tagapaghiganti dahil sa dugong dumanak.”
    reason: lexical_alternative
  - marker: b
    text: Idyoma sa Hebreo na nangangahulugang ganap na iingatan ang anak.
    reason: idiom_explanation
lexical_decisions:
- source_word: יִזְכָּר נָא הַמֶּלֶךְ
  choice: Alalahanin po sana ng hari
  rationale: Ipinahahayag ng jussive na may נָא ang isang magalang at mapagpakumbabang pakiusap. Likas sa modernong Tagalog ang pagsasama ng “po” at “sana” para mapanatili ang paggalang sa hari.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang panghalip na tumutukoy sa Diyos ng hari. Ginamit ang “inyong” bilang magalang na pang-isahan sa hari.
- source_word: מֵהַרְבִּית גֹּאֵל הַדָּם לְשַׁחֵת
  choice: upang hindi na magpatuloy sa paglipol ang tagapaghiganti ng dugo
  rationale: Ipinahihiwatig ng konstruksyon sa רבה ang pagpapatuloy o pagdaragdag ng mapanirang pagkilos. Iniiwasan ng salin ang alanganing literal na “paramihin ang tagapaghiganti” habang pinananatili ang legal na tauhang גֹּאֵל הַדָּם.
- source_word: גֹּאֵל הַדָּם
  choice: tagapaghiganti ng dugo
  rationale: Tuwirang inilalarawan nito ang kamag-anak na may tungkuling gumanti dahil sa dugong dumanak, nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: at hindi nila mapuksa ang anak ko
  rationale: Pinanatili ang maramihang di-tiyak na simuno ng pandiwa sa “nila.” Ang “mapuksa” ay angkop sa matinding diwa ng השמיד at naiiba nang bahagya sa naunang לשחת.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili ang maikli at maringal na pormula ng panunumpa sa Hebreo sa halip na tahasang idagdag ang mga salitang “isinasumpa ko.”
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: ni isang buhok ng iyong anak ay hindi malalaglag sa lupa
  rationale: Sa konteksto ng panunumpa, ang אִם ay naghahayag ng mariing pagtanggi. Ang idyoma tungkol sa buhok ay pinanatili dahil malinaw ito sa Tagalog at nangangahulugan ng ganap na pag-iingat.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalang tipan ang tuwirang lumilitaw sa tekstong Hebreo. Ang “Yahweh” ay transliterasyong malapit sa pinakatinatanggap na bigkas at hindi itinatago ang pangalan sa likod ng isang titulo.
- issue: Saklaw ng pangako ng hari
  choice: Pinanatili ang idyomang “ni isang buhok ... hindi malalaglag”
  alternative: Walang anumang masamang mangyayari sa iyong anak
  rationale: Ang literal na larawan ay malinaw na nagpapahayag ng ganap na proteksiyon, ngunit hindi nilulutas nang higit sa sinasabi ng teksto ang praktikal o legal na saklaw ng pangako.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong angkop sa pakikipag-usap sa hari. Ginamit ang “po,” “sana,” at magalang na “inyong,” ngunit iniwasan ang lipas o labis na pormal na pananalita. Inilagay ang mga panandang talababa sa mismong mga salitang kanilang ipinaliliwanag.
