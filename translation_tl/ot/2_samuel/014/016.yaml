base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: tl
  text: Sapagkat makikinig ang hari at ililigtas niya ang kanyang aliping babae mula sa kamay[a] ng lalaking naglalayong lipulin ako at ang anak kong lalaki nang magkasama mula sa mana ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kamay” ay maaaring mangahulugang kapangyarihan o kontrol.
    reason: idiom_explanation
  - marker: b
    text: Ang “mana ng Diyos” ay malamang na tumutukoy sa manang inilaan ng Diyos sa loob ng Israel; maaari rin itong mangahulugang mana o pag-aari ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapanatili nito ang paliwanag o batayan ng pagtitiwala ng babae na kaugnay ng naunang sinabi.
- source_word: יִשְׁמַע
  choice: makikinig
  rationale: Ang שׁמע ay maaaring tumukoy sa pakikinig na may pagtugon. Mas natural dito ang “makikinig” kaysa literal na “maririnig,” nang hindi paunang tinutukoy kung ano ang magiging tugon.
- source_word: לְהַצִּיל
  choice: ililigtas
  rationale: Malinaw at karaniwang katumbas ito ng Hiphil ng נצל, na nangangahulugang ilayo o sagipin mula sa panganib o kapangyarihan ng iba.
- source_word: אֲמָתוֹ
  choice: kanyang aliping babae
  rationale: Tiyak na pambabae ang pangngalang Hebreo at ginagamit dito bilang mapagpakumbabang pagtukoy ng babae sa sarili sa harap ng hari.
- source_word: מִכַּף הָאִישׁ
  choice: mula sa kamay ng lalaki
  rationale: Pinananatili ang larawang Hebreo ng “kamay” bilang kapangyarihan o kontrol; nililinaw ito sa talababa.
- source_word: לְהַשְׁמִיד
  choice: naglalayong lipulin
  rationale: Ipinahahayag ng pawatas ang mapanirang layunin ng lalaki. Ang “lipulin” ay angkop sa banta ng pagpatay sa mag-ina at pagpatid sa kanilang angkan.
- source_word: אֹתִי וְאֶת־בְּנִי יַחַד
  choice: kaming mag-ina
  rationale: Natural sa Tagalog ang “mag-ina” at malinaw nitong pinagsasama ang nagsasalitang ina at ang kanyang anak na lalaki, gaya ng diin ng יַחַד.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: mula sa mana ng Diyos
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang posibilidad na tumukoy sa manang inilaan ng Diyos o sa mana na pag-aari ng Diyos.
theological_decisions:
- issue: Kahulugan ng “mana ng Diyos”
  choice: Pinanatili ang malawak na pariralang “mana ng Diyos,” na sa konteksto ay malamang na tumutukoy sa manang inilaan ng Diyos sa loob ng Israel.
  alternative: Maaaring tumukoy ito sa sariling mana o pag-aari ng Diyos—ang kanyang bayan—o sa pampamilyang mana sa kaayusang itinatag ng Diyos.
  rationale: Ang konteksto ay tungkol sa pagkalipol ng linya ng pamilya at pagkawala ng kanilang bahagi sa Israel. Hindi dapat paliitin ng salin ang parirala sa iisang paliwanag lamang.
translation_notes:
  register: Makabagong Filipino na may marangal na himig. Pinanatili ang magalang na pagtukoy ng babae sa sarili bilang “aliping babae” at ang larawang “kamay,” habang ginawang natural ang “ako at ang aking anak na lalaki na magkasama” bilang “kaming mag-ina.”
