base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: tl
  text: Pagkatapos, pumunta si Joab sa hari at sinabi niya ito sa kanya. Ipinatawag ng hari si Absalom,[a] at pumunta si Absalom sa hari. Nagpatirapa siya nang nakasubsob ang mukha niya sa lupa sa harap ng hari. Pagkatapos, hinalikan ng hari si Absalom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, hindi tahasang inuulit ang simuno ng “ipinatawag”; ayon sa konteksto, ang hari ang nagpatawag kay Absalom. Maaari ring isalin ang pandiwa na “tinawag.”
    reason: grammatical_and_lexical_alternative
  - marker: b
    text: Malamang na tanda ang halik ng pakikipagkasundo o muling pagtanggap ng hari kay Absalom, bagaman ang teksto ay nagsasaad lamang na hinalikan niya ito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: pumunta si Joab sa hari
  rationale: Ang בוא ay karaniwang nagsasaad ng pagpunta o paglapit sa isang tao. Natural sa salaysay ang “pumunta ... sa hari” at malinaw ang direksiyon ng kilos.
- source_word: וַיַּגֵּד לוֹ
  choice: sinabi iyon sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat. Hindi binanggit sa Hebreo ang tuwirang layon, kaya ang “iyon” ay tumutukoy lamang sa naunang usapan nang hindi nagdaragdag ng detalye.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: ipinatawag ng hari si Absalom
  rationale: Sa konteksto ng korte, ang קרא אל ay maaaring mangahulugang ipatawag ang isang tao. Ang hari ang malamang na simuno ayon sa daloy ng salaysay, bagaman hindi ito tahasang inuulit sa Hebreo; ipinaliliwanag ito sa talababa.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: nagpatirapa siya
  rationale: Ang anyo ng שׁחה ay tumutukoy sa malalim na pagyukod o pagpapatirapa bilang paggalang. Ang kasunod na pariralang nagsasabing nakasubsob ang mukha sa lupa ay nagpapatunay sa buong pagpapatirapa.
- source_word: עַל־אַפָּיו אַרְצָה
  choice: na nakasubsob ang mukha sa lupa
  rationale: Literal na inilalarawan ng Hebreo ang mukha na nakatuon sa lupa. Ang salin ay natural sa Filipino at malinaw na inilalarawan ang pisikal na ayos.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Karaniwan at natural na katumbas ito ng לפני sa tagpo sa korte.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: hinalikan ng hari si Absalom
  rationale: Tahasang halik ang inilalarawan ng נשׁק. Pinananatili ng salin ang kilos nang hindi isinasama sa pangunahing teksto ang ipinahihiwatig nitong pakikipagkasundo o muling pagtanggap.
theological_decisions:
- issue: Kahulugan ng halik ng hari
  choice: Isinalin nang literal bilang paghalik ng hari kay Absalom.
  alternative: Tukuyin ito bilang pormal na pakikipagkasundo o pagpapanumbalik ng pabor at katayuan.
  rationale: Malamang na nagpapahiwatig ang halik ng pakikipagkasundo o muling pagtanggap, ngunit ang Hebreo ay nagsasaad lamang na hinalikan ng hari si Absalom. Pinananatili sa pangunahing teksto ang kilos at iniiwan sa konteksto at talababa ang posibleng kabuluhan nito.
- issue: Simuno ng pagtawag kay Absalom
  choice: Tinukoy ang hari bilang malamang na simuno, na may talababa tungkol sa di-tahasang simuno sa Hebreo.
  alternative: Panatilihin lamang ang panghalip na “niya,” na maaaring unawaing tumutukoy kay Joab o sa hari.
  rationale: Sa agarang konteksto, ang hari ang natural na nagpapatawag kay Absalom upang humarap sa kanya. Gayunman, dahil hindi tahasang binanggit ng Hebreo ang simuno, kinikilala sa talababa ang anyong ito ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpatirapa” upang tumpak na ilarawan ang kilos sa korte, habang nilinaw ng kasunod na parirala ang postura para sa karaniwang mambabasa. Iniwasan ang labis na interpretasyon sa halik ng hari.
