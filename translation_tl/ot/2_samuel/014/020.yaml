base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: tl
  text: Ginawa ng lingkod mong si Joab ang bagay na ito upang ibahin ang anyo ng usapin.[a] Ngunit marunong ang panginoon ko—taglay ang karunungang gaya ng sa isang anghel ng Diyos—upang malaman ang lahat ng nasa lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibaling ang usapin” o “baguhin ang mukha ng usapin.” Sa literal na Hebreo, “ikutin/baguhin ang mukha ng usapin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng nasa lupa.” Sa konteksto, malamang na ang “lupain” ay tumutukoy sa kaharian o bansa, hindi sa buong daigdig.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: upang
  rationale: Malinaw at natural na ipinahahayag ang layunin ng sumunod na kilos.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: ibahin ang anyo ng usapin
  rationale: Pinananatili ang larawang 'mukha/anyo ng usapin' habang ipinahahayag sa natural na Filipino ang pagbabago sa pagkakaharap o pagkakalahad ng kaso.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: ginawa ... ang bagay na ito
  rationale: Tuwirang salin na iniiwasang ulitin ang 'usapin' at nananatiling natural.
- source_word: עַבְדְּךָ
  choice: lingkod mo
  rationale: Ang magalang na pananalita sa hari ang pangunahing diwa rito; mas angkop ang 'lingkod' kaysa 'alipin.'
- source_word: וַאדֹנִי חָכָם
  choice: Ngunit marunong ang panginoon ko
  rationale: Ang 'ngunit' ay natural na panandang transisyon o bahagyang pagsalungat; ang 'marunong' ay malinaw na katumbas ng papuring ibinibigay sa hari.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: taglay ang karunungang gaya ng sa isang anghel ng Diyos
  rationale: Pinananatili ang tahasang paghahambing at hindi tinutukoy na iisang partikular na anghel.
- source_word: לָדַעַת
  choice: at nalalaman niya
  rationale: Ipinapahayag nang natural sa Filipino ang kakayahan o bunga ng karunungang binanggit.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: lahat ng nangyayari sa lupain
  rationale: Sa konteksto ng paghahari, ang 'lupain' ay malamang na kaharian o bansa; ang 'nangyayari' ay natural na pagpapahayag ng mga bagay o pangyayaring dapat malaman ng hari.
theological_decisions:
- issue: Ang pagtukoy sa מַלְאַךְ הָאֱלֹהִים
  choice: isang anghel ng Diyos
  alternative: ang anghel ng Diyos
  rationale: Ang parirala ay bahagi ng paghahambing sa pambihirang karunungan at hindi kailangang tumukoy sa isang natatanging anghel. Iniiwasan din nitong gawing pahayag tungkol sa kalikasan o walang-hanggang kaalaman ni David ang papuri.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang magalang na pananalita sa hari at ang matalinghagang Hebreong 'anyo/mukha ng usapin,' na nilinaw sa talababa.
