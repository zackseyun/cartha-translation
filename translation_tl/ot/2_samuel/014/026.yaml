base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: tl
  text: 'Tuwing nagpapagupit siya—sa katapusan ng bawat taon siya nagpapagupit, sapagkat mabigat na sa kaniya ang kanyang buhok—kapag nagpagupit siya, tinitimbang niya ang buhok sa kaniyang ulo: dalawang daang siklo ayon sa panimbang ng hari[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa pamamagitan ng bato ng hari,” na tumutukoy sa batong ginagamit bilang opisyal na pamantayan ng timbang ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת רֹאשׁוֹ
  choice: Tuwing nagpapagupit siya
  rationale: Ang pariralang temporal ay tumutukoy sa paulit-ulit na gawain. Likas sa modernong Tagalog ang “nagpapagupit” para sa paggupit ng buhok, nang hindi ipinahihiwatig na ganap itong inahit.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים
  choice: sa katapusan ng bawat taon
  rationale: Ang Hebreong idyoma ay tumutukoy rito sa regular na taunang pagitan; malinaw at natural ito sa Tagalog.
- source_word: אֲשֶׁר יְגַלֵּחַ
  choice: siya nagpapagupit
  rationale: Ipinahahayag ng anyo ng pandiwa ang nakaugaliang kilos at pinananatili ang pag-uulit sa pinagmulang teksto.
- source_word: כִּי כָבֵד עָלָיו
  choice: sapagkat mabigat na sa kaniya ang buhok niya
  rationale: Pinananatili ang larawan ng bigat sa Hebreo habang nililinaw sa Tagalog na buhok ang tinutukoy ng panghalip.
- source_word: וְשָׁקַל אֶת שְׂעַר רֹאשׁוֹ
  choice: tinitimbang niya ang buhok na ginupit sa kaniyang ulo
  rationale: Ang aspektong di-ganap ay angkop sa paulit-ulit na gawain. Ang “na ginupit” ay likas na paglilinaw sa konteksto at hindi nangangahulugang ulo mismo ang tinitimbang.
- source_word: מָאתַיִם שְׁקָלִים
  choice: dalawang daang siklo
  rationale: Ang siklo rito ay yunit ng timbang, hindi salapi; pinananatili ang sinaunang yunit upang hindi magbigay ng di-tiyak na makabagong katumbas.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: ayon sa panimbang ng hari
  rationale: Ang אֶבֶן ay literal na “bato” ngunit tumutukoy sa batong pamantayan sa pagtimbang. Inihahayag ng “panimbang ng hari” ang gamit nito, habang inilalagay sa talababa ang literal at kultural na detalye.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagpapagupit” sa halip na “nag-aahit” upang hindi ipalagay na lubusang inahit ang buhok. Pinanatili ang taunang dalas at ang sinaunang yunit na siklo; ang talababa ay nagpapaliwanag sa royal standard weight.
