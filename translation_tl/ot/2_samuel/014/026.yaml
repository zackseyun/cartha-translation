revisions:
- from: 'Tuwing nagpapagupit siya—sa katapusan ng bawat taon siya nagpapagupit[a], sapagkat mabigat na sa kaniya ang buhok niya—tinitimbang niya ang buhok na ginupit sa kaniyang ulo: dalawang daang siklo ayon sa panimbang ng hari.'
  to: 'Tuwing nagpapagupit siya—sa katapusan ng bawat taon siya nagpapagupit, sapagkat mabigat na sa kaniya ang kanyang buhok—kapag nagpagupit siya, tinitimbang niya ang buhok sa kaniyang ulo: dalawang daang siklo ayon sa panimbang ng hari[a].'
  rationale: Inilipat ang talababa sa “panimbang ng hari,” ang tanging pariralang tinatalakay nito. Idinagdag ang “kapag nagpagupit siya” upang katawanin ang muling temporal na parirala bago ang pagtimbang. Pinanatili ang “nagpapagupit” dahil likas ito sa modernong Tagalog at hindi nito ipinahihiwatig na ganap na inahit ang buhok.
