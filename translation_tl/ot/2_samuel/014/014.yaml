revisions:
- from: Sapagkat tiyak na mamamatay tayong lahat. Para tayong tubig na ibinuhos sa lupa, na hindi na muling matitipon. Gayunman, hindi kumikitil ng buhay ang Diyos[a], kundi nagbabalak siya ng mga paraan upang ang itinaboy ay hindi manatiling malayo sa kanya.[b]
  to: Sapagkat tiyak na mamamatay tayo. Para tayong tubig na ibinuhos sa lupa, na hindi na muling matitipon. Gayunman, hindi kumikitil ng buhay ang Diyos[a], kundi nagbabalak siya ng mga paraan upang ang itinaboy ay hindi manatiling itinaboy palayo sa kanya.[b]
  rationale: Inalis ang dagdag na “lahat” upang hindi lumampas sa saklaw ng Hebreo. Pinalitan ang “manatiling malayo” ng “manatiling itinaboy palayo” upang mapanatili ang mahalagang pag-uulit ng נדח at ang larawan ng pagpapanumbalik mula sa pagkakataboy. Inayos din ang pananalita ng unang talababa para sa natural na modernong Filipino.
