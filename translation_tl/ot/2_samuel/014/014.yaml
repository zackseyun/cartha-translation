  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: tl
  text: Sapagkat tiyak na mamamatay tayo. Para tayong tubig na ibinuhos sa lupa, na hindi na muling matitipon. Gayunman, hindi kumikitil ng buhay ang Diyos[a], kundi nagbabalak siya ng mga paraan upang ang itinaboy ay hindi manatiling itinaboy palayo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi nagtatangi ang Diyos ng sinuman.” Mahirap unawain ang pariralang Hebreo, at may ibang pagpapakahulugan dito.
    reason: alternative_reading
  - marker: b
    text: O, “upang ang isang itinaboy ay hindi maitaboy palayo sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapakita nito na ang pahayag ay dahilan o batayan ng pakiusap ng babae sa naunang konteksto.
- source_word: מוֹת נָמוּת
  choice: tiyak na mamamatay tayong lahat
  rationale: Ang infinitive absolute na sinusundan ng imperfect ay nagbibigay-diin sa katiyakan at di-maiiwasang kamatayan; ang “tayong lahat” ay likas na paglalahad sa Filipino ng pangkalahatang tinutukoy na “tayo.”
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: Para tayong tubig na ibinuhos sa lupa
  rationale: Pinananatili ang paghahambing at ang larawan ng tubig na natapon o ibinuhos sa lupa.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: na hindi na muling matitipon
  rationale: Ipinahahayag nito ang hindi na maibabalik na tubig at, sa paghahambing, ang hindi na mababawi na buhay matapos ang kamatayan.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Gayunman, hindi kumikitil ng buhay ang Diyos
  rationale: Sa mahirap na pariralang ito, inuunawa ang נֶפֶשׁ bilang buhay o taong buháy at ang נָשָׂא bilang pag-aalis ng buhay. Ang “Gayunman” ay malinaw na naghuhudyat ng kaibahan sa di-maiiwasang kamatayan ng tao, habang inilalagay sa talababa ang ibang posibleng pagbasa.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: kundi nagbabalak siya ng mga paraan
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa sinasadyang pag-iisip at pagbuo ng mga hakbang; natural itong naipapahayag bilang pagbabalak ng mga paraan.
- source_word: לְבִלְתִּי יִדַּח
  choice: upang ... hindi manatiling malayo
  rationale: Ipinahahayag ng Niphal ng נדח ang kalagayan ng isang itinaboy o ipinatapon. Ang “hindi manatiling malayo” ay umaangkop sa konteksto ng pagpapanumbalik nang hindi ikinakaila ang literal na alternatibong “hindi maitaboy.”
- source_word: מִמֶּנּוּ נִדָּח
  choice: ang itinaboy ... sa kanya
  rationale: Pinananatili ang isahang taong itinaboy at ang kaugnayan niya sa tinutukoy ng panghalip, na sa daloy ng pangungusap ay ang Diyos.
theological_decisions:
- issue: Kahulugan ng וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: hindi kumikitil ng buhay ang Diyos
  alternative: hindi nagtatangi ang Diyos ng tao
  rationale: Mahirap ang parirala sa sintaks at kahulugan. Ang pagbasa tungkol sa hindi pagkitil ng buhay ay umaayon sa agarang usapan tungkol sa kamatayan at sa kasunod na paggawa ng Diyos ng paraan para sa itinaboy. Gayunman, pinananatili sa talababa ang pagbasa tungkol sa hindi pagtatangi upang hindi maitago ang tunay na kalabuan.
- issue: Diwa ng לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  choice: upang ang itinaboy ay hindi manatiling malayo sa kanya
  alternative: upang ang isang itinaboy ay hindi maitaboy palayo sa kanya
  rationale: Ang pangunahing salin ay nagpapakita ng layuning maibalik ang isang nasa kalagayan ng pagkakataboy. Ang mas tahasang pasibong pagbasa ay inilalagay sa talababa sapagkat posible rin ito ayon sa anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumikitil ng buhay” sa halip na literal na “nag-aalis ng kaluluwa” upang maipahayag ang נֶפֶשׁ bilang buhay o taong buháy sa konteksto. Inilagay ang mga pananda ng talababa sa mismong mga sugnay na may kaukulang kalabuan.
