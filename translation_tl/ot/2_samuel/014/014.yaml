  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang katiyakan ng kamatayan, ang larawan ng tubig na hindi matitipon, ang mahirap na sugnay tungkol sa Diyos at buhay, at ang layunin na ang itinaboy ay hindi manatiling itinaboy. Gayunman, ang “tayong lahat” ay nagdaragdag ng “lahat,” na wala sa tekstong Hebreo, at ang “manatiling malayo” ay nagpapahina sa inuulit na larawan ng pagkakataboy sa huling sugnay.'
  naturalness: Makabago at malinaw ang Filipino. Mas natural at mas malapit sa paralelismong Hebreo ang “hindi manatiling itinaboy palayo sa kanya” kaysa “hindi manatiling malayo sa kanya.”
  terminology: Ang “kumikitil ng buhay” ay angkop na salin sa piniling pagbasa ng mahirap na נָשָׂא נֶפֶשׁ. Pinananatili ng talababa ang alternatibong pagbasa nang hindi ipinipilit ito. Inayos ang salin nito sa mas likas na “hindi nagtatangi ang Diyos ng sinuman.”
