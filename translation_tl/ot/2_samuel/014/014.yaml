    rationale: Ang מוֹת נָמוּת ay “tiyak na mamamatay tayo”; ang “lahat” ay maaaring ipinahihiwatig sa pangkalahatang diwa ngunit hindi tahasang nasa Hebreo.
  - severity: medium
    issue: Nawawala ang pag-uulit ng ‘itinaboy’ sa huling layuning sugnay
    rationale: Ang לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח ay sadyang inuugnay ang isang itinaboy sa hindi pananatiling itinaboy. Ang “manatiling malayo” ay mas maluwag at hindi gaanong natatanaw ang leksikal na pag-uulit.
