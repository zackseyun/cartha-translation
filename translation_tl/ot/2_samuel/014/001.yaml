base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: tl
  text: Nalaman ni Joab, na anak ni Zeruia, na ang puso ng hari ay nakatuon kay Absalom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Nananabik ang hari kay Absalom.” Maikli at hindi ganap na tiyak ang pananalitang Hebreo; maaari rin itong unawain sa mas pangkalahatang diwang “ang puso ng hari ay nakatuon kay Absalom.” May mga nagpapakahulugan din dito nang negatibo: “ang puso ng hari ay laban kay Absalom,” bagaman higit na sinusuportahan ng kasunod na konteksto ang positibong pagkiling.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: Nalaman
  rationale: Isinasalaysay ng wayyiqtol ang kasunod na pangyayari. Likas sa makabagong Filipino ang “nalaman” at hindi na kailangang dagdagan ng tahasang panandang tulad ng “ngayon.”
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: si Joab na anak ni Zeruia
  rationale: Isinalin nang natural ang ugnayang construct at ginamit ang karaniwang anyong Filipino ng mga pangalang pantangi.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nalaman ni Joab.
- source_word: לֵב הַמֶּלֶךְ
  choice: ang puso ng hari
  rationale: Pinananatili ng “puso” ang larawang Hebreo para sa panloob na saloobin, kalooban, o pagmamahal, sa halip na paliitin ito sa “isip.”
- source_word: עַל
  choice: ay nakatuon kay
  rationale: Elliptical at hindi ganap na tiyak ang parirala. Ang “nakatuon kay” ay nagpapanatili ng direksiyon ng saloobin nang hindi lubusang ipinapakahulugang pananabik, pagkiling, o pagkapoot.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang karaniwang transliterasyon ng pangalan sa Filipino.
theological_decisions:
- issue: Ang hindi tiyak na saloobin ng hari kay Absalom
  choice: ang puso ng hari ay nakatuon kay Absalom
  alternative: nananabik ang hari kay Absalom; ang puso ng hari ay laban kay Absalom
  rationale: Maikli at hindi tahasang positibo o negatibo ang Hebreo. Pinananatili ng pangunahing salin ang tunay na kalabuan, samantalang inilalahad sa talababa ang mas tiyak na mga posibleng pagbasa; bagaman higit na sinusuportahan ng kasunod na konteksto ang positibong pagkiling.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang “puso ng hari,” ngunit ginawang likas ang panaguri sa pamamagitan ng “nakatuon kay.”
