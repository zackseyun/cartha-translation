base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: tl
  text: Ipinanganak kay Absalom ang tatlong anak na lalaki at isang anak na babae, na ang pangalan ay Tamar. Siya ay isang babaeng maganda ang anyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: Nagkaroon si Absalom
  rationale: Ang Nifal ng ילד kasama ng ל ay nagsasaad na may mga anak na ipinanganak kay Absalom. Sa natural na modernong Tagalog, malinaw at maikli itong naipapahayag sa “Nagkaroon si Absalom,” nang hindi ipinahihiwatig na siya mismo ang nanganak.
- source_word: שְׁלוֹשָׁה בָנִים
  choice: tatlong anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָנִים, kaya pinanatili ang kasarian sa karaniwang pariralang Tagalog.
- source_word: וּבַת אַחַת
  choice: at isang anak na babae
  rationale: Direktang katumbas ito ng bilang at kasarian sa Hebreo at natural sa modernong Tagalog.
- source_word: וּשְׁמָהּ תָּמָר
  choice: na ang pangalan ay Tamar
  rationale: Ang hulaping pambabae sa שְׁמָהּ ay tumutukoy sa anak na babaeng kababanggit lamang. Natural sa Tagalog ang sugnay na ito pagkatapos ng “isang anak na babae.”
- source_word: תָּמָר
  choice: Tamar
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: הִיא הָיְתָה אִשָּׁה
  choice: Siya ay isang babae
  rationale: Pinananatili ang tahasang panghalip at ang pangngalang אִשָּׁה nang malinaw at marangal sa Tagalog.
- source_word: יְפַת מַרְאֶה
  choice: maganda ang anyo
  rationale: Inilalarawan ng parirala ang panlabas na kagandahan. Ang “maganda ang anyo” ay natural ngunit malapit pa rin sa literal na estruktura at hindi nagpapasobra sa diwa.
