  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Nagkaroon” bilang idiomatikong salin ng pahayag tungkol sa mga anak na ipinanganak kay Absalom, habang ang “maganda ang anyo” ay nagpapanatili sa pisikal na paglalarawan ng Hebreo.
