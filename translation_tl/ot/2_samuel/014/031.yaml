base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: tl
  text: At tumayo si Joab at pumunta sa bahay ni Absalom. Sinabi niya sa kanya, “Bakit sinunog ng mga lingkod mo ang bukid ko?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Kaya tumayo si Joab
  rationale: Isinusulong ng wayyiqtol ang salaysay. Likas sa modernong Filipino ang “kaya” bilang bunga ng naunang pangyayari, at pinananatili ng “tumayo” ang kilos ng pandiwang Hebreo.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: pumunta sa bahay ni Absalom
  rationale: Ang directional he sa הַבָּיְתָה ay nagsasaad ng patutunguhan. Sa konteksto, ang bahay ay tirahan ni Absalom; malinaw at natural ang “pumunta sa bahay ni Absalom.”
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Sinabi niya rito
  rationale: Tumutukoy ang hulaping panlalaki kay Absalom. Ang “rito” ay natural na anaporikong Filipino at umiiwas sa paulit-ulit na pangalan.
- source_word: לָמָּה
  choice: Bakit
  rationale: Tuwirang katumbas ito ng pangtanong na humihingi ng dahilan.
- source_word: הִצִּיתוּ
  choice: sinunog
  rationale: Ang Hiphil ng יצת ay nangangahulugang magsiklab o magsunog. Sa taniman, malinaw at natural sa Filipino ang “sinunog,” na nagpapahiwatig ng sadyang paglalagablab.
- source_word: עֲבָדֶךָ
  choice: mga lingkod mo
  rationale: Bagaman morpolohikal na maaaring kolektibong anyong isahan, maramihan ang pandiwa, kaya maramihan ang diwa. Ang “mga lingkod” ay angkop sa ugnayang panlipunan sa salaysay nang hindi ipinipilit ang mas tiyak na “mga alipin.”
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: ang bukid ko
  rationale: Ang חֶלְקָה ay isang bahagi o parsela ng lupa, at tahasang ipinakikita ng אֲשֶׁר לִי na pag-aari ito ni Joab. Likas at maikli sa konteksto ang “bukid ko.”
- source_word: בָּאֵשׁ
  choice: sinunog
  rationale: Literal na nagsasaad ito ng kasangkapan, “sa pamamagitan ng apoy.” Nasa pandiwang Filipino na “sinunog” ang diwa ng paggamit ng apoy, kaya hindi na kailangang ulitin ang “sa apoy.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit payak. Ginamit ang natural na ayos ng salaysay at tuwirang pananalita. Walang kailangang talababa sapagkat naihahatid ng “sinunog” at “bukid ko” ang kahulugan ng idyomang Hebreo nang walang mahalagang pagkawala.
