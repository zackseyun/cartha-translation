  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: tl
  text: May dalawang anak na lalaki ang inyong lingkod[a]. Nag-away silang dalawa sa bukid, at walang namagitan upang paghiwalayin sila[b]. At sinaktan ng isa ang isa at pinatay niya ang isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “ang inyong babaeng alipin” o “babaeng utusan.” Magalang at mapagpakumbabang pagtukoy ito ng babae sa sarili habang nagsasalita sa hari.
    reason: lexical_alternative
  - marker: b
    text: Literal, “walang tagapagligtas sa pagitan nila,” ibig sabihin, walang pumagitna upang pigilan at paghiwalayin sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: ang inyong lingkod
  rationale: Ang שִׁפְחָה ay babaeng alipin o utusan, ngunit dito ay magalang at mapagpakumbabang pagtukoy ng isang babae sa sarili habang nakikipag-usap sa hari. Natural sa makabagong Filipino ang “inyong lingkod”; ipinapaliwanag sa talababa ang kasarian at literal na diwa.
- source_word: שְׁנֵי בָנִים
  choice: dalawang anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָנִים sa kontekstong ito, kaya hindi sapat ang mas pangkalahatang “dalawang anak.”
- source_word: וַיִּנָּצוּ
  choice: nag-away
  rationale: Ang pandiwa ay tumutukoy sa alitang may pisikal na labanan; sa Filipino, natural na saklaw ng “nag-away” ang ganitong marahas na sagupaan, lalo na sa kasunod na pagpatay.
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Tuwirang lokatibong salin na natural sa Filipino.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: walang namagitan upang paghiwalayin sila
  rationale: Literal na “walang tagapagligtas sa pagitan nila.” Sa konteksto, ang ibig sabihin ay walang pumagitna upang pigilan ang labanan at paghiwalayin sila; pinananatili sa talababa ang literal na larawan.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: sinaktan ng isa ang isa
  rationale: Ang נכה ay “humampas/sumakit.” Ang “sinaktan” ay natural at hindi nagpapasiya kung iisang hampas lamang o mas malawak na pananakit ang naganap.
- source_word: וַיָּמֶת אֹתוֹ
  choice: napatay niya ito
  rationale: 'Bagaman mula sa pandiwang “mamatay,” ang pagkakabuo rito na may layon ay may diwang sanhi: pinatay o naging sanhi ng pagkamatay ng isa ang isa.'
