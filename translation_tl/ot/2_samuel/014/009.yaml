  source_fidelity: Tumpak na naihahatid ng salin ang pormulang pag-ako ng babae sa עָוֹן para sa sarili at sa sambahayan ng kanyang ama, at ang pagpapawalang-singaw sa hari at sa kanyang trono. Ang “sa akin mapunta” ay angkop na katumbas ng mariing inuunang עָלַי, at ang “walang sala” ay wasto sa hudisyal na diwa ng נָקִי.
