source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הַ/תְּקוֹעִית֙ אֶל הַ/מֶּ֔לֶךְ עָלַ֞/י אֲדֹנִ֥/י הַ/מֶּ֛לֶךְ הֶ/עָוֺ֖ן וְ/עַל בֵּ֣ית אָבִ֑/י וְ/הַ/מֶּ֥לֶךְ וְ/כִסְא֖/וֹ נָקִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: tl
  text: Sinabi ng babaeng taga-Tekoa sa hari, “Panginoon kong hari, sa akin mapunta ang pananagutan[a], at sa sambahayan ng aking ama; ngunit walang sala ang hari at ang kanyang trono.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasalanan,” “sala,” o “kaparusahan.” Ang salitang Hebreo ay maaaring tumukoy sa maling gawa, sa pagkakasala, o sa pananagutan at bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: ang babaeng taga-Tekoa
  rationale: Likas sa makabagong Filipino ang “taga-Tekoa” at malinaw nitong pinananatili ang pagkakakilanlan batay sa pinagmulan.
- source_word: עָלַי
  choice: sa akin mapunta
  rationale: Pinananatili nito ang diin ng inuunang parirala at likas na ipinahahayag sa Filipino ang kusang pag-ako ng pananagutan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Panginoon kong hari
  rationale: Pinananatili ang magalang na pormula ng pakikipag-usap sa hari nang hindi inaalis ang dalawang bahagi ng titulong Hebreo.
- source_word: הֶעָוֺן
  choice: ang pananagutan
  rationale: Sa kontekstong hudisyal, saklaw nito ang pag-ako sa sala o kapinsalaang ibubunga nito, habang hindi nililimitahan ang malawak na kahulugan ng עָוֹן sa mismong kasamaan lamang.
- source_word: וְעַל בֵּית אָבִי
  choice: at sa sambahayan ng aking ama
  rationale: Ang “sambahayan” ay nagpapanatili sa panlipunan at pampamilyang saklaw ng literal na “bahay ng aking ama,” hindi lamang sa gusali.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: ngunit ... ang hari at ang kanyang trono
  rationale: 'Ginawang “ngunit” ang pangatnig upang natural na maipakita ang malinaw na paghahambing: sa babae at kanyang sambahayan ang pananagutan, samantalang ligtas dito ang hari at kanyang paghahari.'
- source_word: נָקִי
  choice: walang sala
  rationale: Natural at malinaw na pahayag ito ng kawalan ng legal o moral na pananagutan; ang pang-isahang anyong Hebreo ay tumutukoy sa tambalang paksa.
theological_decisions:
- issue: Pormula ng pagpapawalang-sala sa hari
  choice: walang sala ang hari at ang kanyang trono
  alternative: malinis ang hari at ang kanyang trono / walang pananagutan ang hari at ang kanyang trono
  rationale: Pinananatili nito ang hudisyal na diwa ng talata. Hindi nito ipinahihiwatig na lubos na walang kasalanan ang hari sa lahat ng bagay, kundi na hindi siya mananagot sa usaping tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na pananalita sa hari at ang matalinghagang “trono” bilang sagisag ng maharlikang kapangyarihan o dinastiya.
