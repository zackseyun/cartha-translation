  source_fidelity: 'Tapat ang salin sa tatlong magkakasunod na kilos sa Hebreo: tumindig si Joab, pumunta siya sa Geshur, at dinala niya si Absalom sa Jerusalem. Hindi idinagdag sa pangunahing teksto ang aspektong “pabalik,” na kontekstuwal ngunit hindi leksikal na hayag sa וַיָּבֵא.'
