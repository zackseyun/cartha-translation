  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: tl
  text: Kaya tumindig si Joab at pumunta sa Geshur, at dinala niya si Absalom sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinala niya si Absalom pabalik sa Jerusalem.” Ipinahihiwatig ng konteksto na bumalik siya mula sa pagkakatapon, ngunit walang tahasang salitang “pabalik” sa pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang קום sa sunod-sunod na salaysay ay nagpapahiwatig ng pagbangon upang kumilos. Pinananatili ng “tumindig” ang marangal na himig nang hindi ito ginagawang simpleng “tumayo” lamang o agad na “umalis.”
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang kahulugan ng הלך sa ganitong salaysay ang pagpunta; natural ito sa makabagong Tagalog at hindi nagdaragdag ng di-tiyak na detalye tungkol sa paglalakbay.
- source_word: גְּשׁוּרָה
  choice: sa Geshur
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa Geshur; likas itong ipinapahayag sa Tagalog sa pamamagitan ng “sa.”
- source_word: וַיָּבֵא
  choice: dinala niya
  rationale: Ang Hiphil ng בוא ay “magdala” o “papuntahin.” Ginawang hayag ang panghalip na “niya” para sa malinaw at natural na Tagalog, habang hindi idinaragdag sa pangunahing teksto ang kontekstuwal ngunit di-hayag na “pabalik.”
- source_word: אֶת אַבְשָׁלוֹם
  choice: si Absalom
  rationale: Tuwirang layon ang pangalang Absalom; ginagamit ang “si” alinsunod sa natural na balarila ng Tagalog para sa personal na pangalan.
- source_word: יְרוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Bagaman walang hiwalay na pang-ukol sa Hebreo, malinaw sa sintaks na Jerusalem ang patutunguhan; kinakailangan ang “sa” sa natural na Tagalog.
- source_word: וַ
  choice: Kaya / at
  rationale: Ang mga waw-consecutive ay nag-uugnay sa magkakasunod na kilos. Ang “Kaya” ay angkop sa bungad bilang pagpapatuloy ng naunang pasiya, at ang “at” ay nagpapanatili sa pagkakasunod ng mga kilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling daloy ng salaysay at iniwasang ilagay sa pangunahing teksto ang “pabalik,” sapagkat kontekstuwal lamang ito. Inilagay ang marker na [a] kaagad pagkatapos ng pariralang tinutukoy nito.
