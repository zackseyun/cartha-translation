base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: tl
  text: Kaya ipinatawag ni Absalom si Joab upang isugo siya nito sa hari, ngunit ayaw nitong pumunta sa kanya. Ipinatawag niya itong muli, sa ikalawang pagkakataon, ngunit ayaw pa rin nitong pumunta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: ipinatawag ni Absalom si Joab
  rationale: Bagaman literal na “nagpadala si Absalom kay Joab,” ipinahihiwatig ng kasunod na layunin na nagpadala siya ng mensahe upang ipatawag si Joab. Natural na naihahatid ito ng “ipinatawag” sa modernong Tagalog.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: upang isugo siya nito sa hari
  rationale: Pinananatili nito ang layuning ipasugo ni Absalom ang sarili niya sa hari sa pamamagitan ni Joab. Nililinaw ng “nito” na si Joab ang inaasahang magsusugo, nang hindi dinaragdagan ang papel niya.
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: ngunit ayaw nitong pumunta sa kanya
  rationale: Ang אָבָה ay tumutukoy sa pagiging handa o pagkukusang gawin ang isang bagay. Mas malapit ang “ayaw” kaysa sa mas mariing “tumanggi,” at pinananatili ng “sa kanya” ang direksiyong tahasang nasa Hebreo.
- source_word: עוֹד שֵׁנִית
  choice: Muli ... sa ikalawang pagkakataon
  rationale: Kapuwa isinasalamin ang עוֹד (“muli”) at שֵׁנִית (“sa ikalawang pagkakataon”), kaya napapanatili ang bahagyang pag-uulit at diin ng Hebreo.
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: ipinatawag ... ngunit ayaw ... Muli ... ipinatawag ... ngunit ayaw pa rin
  rationale: Pinananatili ang paulit-ulit na balangkas ng salaysay. Ang “pa rin” sa ikalawang sugnay ay natural na nagpapahayag na hindi nagbago ang tugon ni Joab.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na natural at marangal. Ginamit ang mga panghalip na “siya,” “nito,” at “kanya” ayon sa malapit na konteksto: si Absalom ang isusugo, si Joab ang inaasahang magsusugo at siyang ayaw pumunta, at si Absalom ang pupuntahan. Walang footnote dahil walang mahalagang tekstuwal o teolohikal na kalabuan na nangangailangan nito.'
