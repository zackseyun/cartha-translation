  source_fidelity: Tumpak na naihahatid ng draft ang pagpapatawag ni Absalom kay Joab, ang layuning ipadala siya ni Joab sa hari, at ang pag-aatubili ni Joab na pumunta kay Absalom. Nananatili rin ang pag-uulit sa huling bahagi, kung saan wala nang tahasang katumbas ng “sa kanya” sa Hebreo.
