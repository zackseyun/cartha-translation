  naturalness: Ang binagong pangungusap ay nananatiling malinaw at likas sa modernong Filipino, habang ang “tumayo ako sa ibabaw niya” ay mas malapit sa kilos na inilalarawan ng Hebreo.
  terminology: Ang “korona,” “palamuting nasa bisig,” at “aking panginoon” ay angkop. Inililipat ang panandang leksikal na talababa sa “palamuting nasa bisig,” na siyang tinutukoy nito, at ang talababa tungkol sa ulat ng Amalekita sa dulo ng pangungusap.
