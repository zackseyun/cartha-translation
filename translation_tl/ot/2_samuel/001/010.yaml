revisions:
- from: Kaya tumayo ako sa tabi niya at pinatay ko siya, sapagkat alam kong hindi na siya mabubuhay matapos siyang bumagsak. Pagkatapos, kinuha ko ang koronang nasa ulo niya at ang palamuting nasa bisig niya[a], at dinala ko ang mga iyon dito sa aking panginoon.[b]
  to: Kaya tumayo ako sa ibabaw niya at pinatay ko siya, sapagkat alam kong hindi na siya mabubuhay matapos siyang mabuwal. Pagkatapos, kinuha ko ang koronang nasa ulo niya at ang palamuting nasa bisig niya[a], at dinala ko ang mga iyon dito sa aking panginoon.[b]
  rationale: Inayos ang pagsasalin ng עָמַד עַל upang mapanatili ang mas tiyak na posisyong ipinahihiwatig ng Hebreo, at pinalitan ang “bumagsak” ng “mabuwal” para sa mas angkop na paglalarawan sa sugatang si Saul. Inilipat din ang mga panandang talababa sa mga salitang o pahayag na aktuwal nilang tinutukoy. Walang idinagdag na pagpapakahulugang nag-aayos sa tensiyon sa pagitan ng ulat na ito at ng 1 Samuel 31.
