  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: tl
  text: Kaya tumayo ako sa ibabaw niya at pinatay ko siya, sapagkat alam kong hindi na siya mabubuhay matapos siyang mabuwal. Pagkatapos, kinuha ko ang koronang nasa ulo niya at ang palamuting nasa bisig niya[a], at dinala ko ang mga iyon dito sa aking panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pulseras.” Ang salitang Hebreo ay tumutukoy sa isang palamuting isinusuot sa bisig.
    reason: lexical_alternative
  - marker: b
    text: Ito ang ulat ng Amalekita kay David. Ihambing sa 1 Samuel 31:4–5 ang naunang salaysay tungkol sa pagkamatay ni Saul.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: tumayo ako sa tabi niya
  rationale: Ipinahihiwatig ng עמד על na tumayo ang nagsasalita sa tabi o ibabaw ng kinaroroonan ng nakahandusay na si Saul. Ang “sa tabi niya” ay natural sa Filipino at hindi nagpapahiwatig na literal siyang tumuntong kay Saul.
- source_word: וַאֲמֹתְתֵהוּ
  choice: pinatay ko siya
  rationale: Tuwirang ipinahahayag ng causative na anyo ng מות na ang nagsasalita ang naging sanhi ng kamatayan ni Saul. Malinaw at natural ang “pinatay ko siya.”
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: sapagkat alam kong hindi na siya mabubuhay
  rationale: Pinananatili nito ang dahilan na ibinigay ng Amalekita at ang payak na diwa ng לֹא יִחְיֶה. Ang “hindi na” ay likas na Filipino sa konteksto ng nakamamatay na pagkabagsak.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: matapos siyang bumagsak
  rationale: 'Inihahayag nito ang temporal na ugnayan: nauna ang pagbagsak bago ang sinasabing pagpatay.'
- source_word: הַנֵּזֶר
  choice: korona
  rationale: Tumutukoy dito ang נֵזֶר sa maharlikang palamuti sa ulo; “korona” ang pinakamalinaw at karaniwang katumbas sa modernong Filipino.
- source_word: וְאֶצְעָדָה
  choice: palamuting nasa bisig
  rationale: Ang צְעָדָה ay palamuting isinusuot sa braso o bisig. Mas malinaw ito kaysa “pulseras,” na karaniwang nauunawaang isinusuot lamang sa pulsuhan.
- source_word: זְרֹעוֹ
  choice: bisig niya
  rationale: Ang זְרוֹעַ ay braso o bisig; “bisig” ang angkop at marangal na salitang tumutugma sa kinalalagyan ng palamuti.
- source_word: וָאֲבִיאֵם
  choice: dinala ko ang mga iyon
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay na nasa nakalipas, kaya ang payak na nagdaang anyo ang angkop.
- source_word: אֶל אֲדֹנִי הֵנָּה
  choice: dito sa aking panginoon
  rationale: Si David ang tinutukoy ng אֲדֹנִי bilang nakatataas na tao, hindi bilang banal na titulo. Pinananatili ng “aking panginoon” ang magalang na pahayag, at ng “dito” ang deiktikong הֵנָּה.
theological_decisions:
- issue: Ang ulat ng Amalekita tungkol sa pagkamatay ni Saul
  choice: Isinalin nang tuwiran bilang pahayag ng Amalekita na siya ang pumatay kay Saul.
  alternative: Palambutin o baguhin ang pahayag upang iayon agad sa 1 Samuel 31:4–5.
  rationale: Direktang pananalita ito ng Amalekita. Dapat panatilihin ng salin ang kanyang inaangkin at huwag lutasin sa mismong teksto ang tensiyon nito sa naunang salaysay.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at likas sa pagsasalaysay. Pinanatili ang tuwirang pag-angkin ng Amalekita at hindi inalis ang tensiyon nito sa 1 Samuel 31.
