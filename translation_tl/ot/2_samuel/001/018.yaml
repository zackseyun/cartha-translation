  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: tl
  text: 'at sinabi niyang ituro sa mga anak ni Juda ang “Ang Busog.” Narito, nakasulat ito sa Aklat ni Jasar:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשֶׁת
  choice: “Ang Busog”
  rationale: Maaaring mangahulugang busog bilang sandata o pamagat ng panaghoy. Ginamit bilang pamagat ayon sa konteksto, habang pinananatili ang literal na salitang Hebreo.
- source_word: בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Pinananatili ang kolektibong katawagan ng Hebreo para sa mga kabilang sa lipi o sambahayan ni Juda.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Aklat ni Jasar
  rationale: Isinalin ang סֵפֶר bilang “Aklat” at tinransliterado ang pangalang יָשָׁר, nang hindi ipinagpapalagay kung ito ay pangalan o paglalarawang “matuwid.”
theological_decisions:
- issue: Kung ang קָשֶׁת ay karaniwang pangngalan o pamagat
  choice: 'Ituring na pamagat: “Ang Busog”'
  alternative: “paggamit ng busog” o “ang busog” bilang karaniwang pangngalan
  rationale: Ang kasunod na panaghoy at ang pahiwatig ng pamagat sa konsultasyong salin ay sumusuporta rito, ngunit nananatili sa salin ang literal na kahulugan at hindi nililinaw nang lampas sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “Narito” ay nagpapanatili sa pansin-pantawag na הִנֵּה; ang tutuldok ay naghahanda sa kasunod na sipi.
