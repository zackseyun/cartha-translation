  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: tl
  text: At hinawakan ni David ang kanyang damit at pinunit iyon[a]; gayon din ang ginawa ng lahat ng lalaking kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “kanyang damit,” ngunit maramihan ang hulapi sa “pinunit.”
    reason: textual_grammar
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: hinawakan
  rationale: Ipinapahayag nito ang pisikal na paghawak ni David sa damit bago niya iyon pinunit, nang hindi dinaragdagan ang tindi ng pandiwa.
- source_word: בִּבְגָדוֹ
  choice: ang kanyang damit
  rationale: Ang Hebreo ay nasa isahan at literal na tumutukoy sa kanyang damit; natural din ang isahan sa Tagalog.
- source_word: וַיִּקְרָעֵם
  choice: pinunit iyon
  rationale: Ang pandiwang קרע ay nangangahulugang pagpunit. Bagaman maramihan ang hulaping Hebreo, ang naunang בגדו ay isahan; ginagamit ang neutral na 'iyon' upang maging natural sa Tagalog habang hindi itinatago ang tekstuwal na di-pagkakatugma, na ipinaliliwanag sa talababa.
- source_word: וְגַם
  choice: gayon din ang ginawa
  rationale: Natural nitong ipinahihiwatig sa Tagalog na inulit ng mga kasama ni David ang parehong kilos.
- source_word: כָּל הָאֲנָשִׁים
  choice: lahat ng lalaking
  rationale: Tiyak na 'mga lalaki' ang kahulugan ng האנשים sa kontekstong ito, hindi isang pangkalahatang pangkat ng mga tao.
- source_word: אֲשֶׁר אִתּוֹ
  choice: kasama niya
  rationale: Maikli, tuwiran, at natural na salin ng pariralang tumutukoy sa mga lalaking naroon kasama ni David.
