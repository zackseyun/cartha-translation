  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁא֣וּל וִ/יהוֹנָתָ֗ן הַ/נֶּאֱהָבִ֤ים וְ/הַ/נְּעִימִם֙ בְּ/חַיֵּי/הֶ֔ם וּ/בְ/מוֹתָ֖/ם לֹ֣א נִפְרָ֑דוּ מִ/נְּשָׁרִ֣ים קַ֔לּוּ מֵ/אֲרָי֖וֹת גָּבֵֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: tl
  text: Sina Saul at Jonatan—minamahal at kaaya-aya habang nabubuhay—ay hindi nagkahiwalay maging sa kamatayan. Mas matulin sila kaysa mga agila[a] at mas malakas kaysa mga leon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malalaking ibong mandaragit.” Ang salitang Hebreo ay maaari ring tumukoy sa mga buwitre, bagaman “mga agila” ang tradisyonal at natural na salin dito.
    reason: lexical_alternative
  - marker: b
    text: O “mas makapangyarihan kaysa mga leon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Sina Saul at Jonatan
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal at ang pantukoy na “sina” para sa dalawang tao.
- source_word: הַנֶּאֱהָבִים
  choice: minamahal
  rationale: Ipinahahayag ng anyong pasibo/pang-uri mula sa אהב na sila ay mga taong mahal ng iba; likas at marangal sa modernong Filipino ang “minamahal.”
- source_word: וְהַנְּעִימִם
  choice: kaaya-aya
  rationale: Pinananatili nito ang diwa ng pagiging kalugod-lugod o kaibig-ibig nang hindi ito nililimitahan sa pisikal na kagandahan o moral na kabutihan.
- source_word: בְּחַיֵּיהֶם
  choice: habang nabubuhay
  rationale: Natural na Filipino para sa panahong saklaw ng kanilang buhay, habang nananatiling malinaw ang paghahambing sa kamatayan.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: hindi nagkahiwalay maging sa kamatayan
  rationale: Pinananatili ang makatang pag-uugnay ng buhay at kamatayan at ang diwa ng nifal na hindi sila nahiwalay; hindi nito tinutukoy nang higit sa teksto kung paano sila nanatiling magkasama.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: Mas matulin sila kaysa mga agila
  rationale: Sa paghahambing na ito, ang קלל ay tumutukoy sa bilis, at ang “matulin” ay angkop sa panulaan. Ang נשר ay tradisyonal at natural na isinasaling “agila,” bagaman maaari itong tumukoy nang mas malawak sa malaking ibong mandaragit.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: mas malakas kaysa mga leon
  rationale: Malinaw na ipinahahayag ng “mas malakas” ang paghahambing ng lakas sa גבר at madaling maunawaan ng karaniwang mambabasa.
theological_decisions:
- issue: Tono ng panaghoy ni David para kina Saul at Jonatan
  choice: Pinanatili ang marangal at makatang papuri sa kanilang dalawa nang hindi binabawasan ang positibong paglalarawan kay Saul.
  alternative: Palambutin ang papuri dahil sa mga naunang pagkukulang ni Saul, o palakasin ito na para bang ipinahahayag ng talata ang ganap nilang kabanalan.
  rationale: Isa itong panaghoy sa mga namatay. Dapat panatilihin ang papuring pang-alaala at ang tensiyon nito sa mas malawak na salaysay tungkol kay Saul, sa halip na lutasin iyon sa pagsasalin.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino. Ginamit ang mga gitling upang maipakita ang pariralang naglalarawan kina Saul at Jonatan, at pinanatili ang magkakatulad na paghahambing sa agila at leon.
