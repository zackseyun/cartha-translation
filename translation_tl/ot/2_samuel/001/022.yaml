  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: tl
  text: 'Mula sa dugo ng mga napatay,

    mula sa taba[a] ng mga magigiting,

    hindi umurong ang busog ni Jonatan,

    at hindi bumalik na walang laman ang tabak ni Saul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “taba” ay maaari ring magpahiwatig ng pinakapili o pinakamasaganang bahagi, na nagpapatindi sa larawan ng tagumpay sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: Mula sa dugo ng mga napatay
  rationale: Pinananatili ng “mula sa” ang larawang nagpapahiwatig ng hindi paglayo ng sandata sa dugo, at ang חֲלָלִים ay likas na tumutukoy sa mga napatay sa labanan.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: mula sa taba ng mga magigiting
  rationale: Literal na “taba” ang חֵלֶב at pinananatili rito ang matindi at kongkretong larawang patula; ang גִּבּוֹרִים ay mga malalakas at magigiting na mandirigma, kaya “mga magigiting” ang maikli at marangal na katumbas.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: ang busog ni Jonatan
  rationale: Likas na anyong paari sa Tagalog at pinananatili ang maikli at patulang paralelismo.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: hindi umurong
  rationale: Ipinahahayag ng pandiwa ang pag-atras o pagtalikod; ang “hindi umurong” ay natural sa Tagalog at angkop sa personipikasyon ng busog.
- source_word: וְחֶרֶב שָׁאוּל
  choice: at … ang tabak ni Saul
  rationale: Ginamit ang likas na anyong paari at pinanatili ang pagtutulad sa busog ni Jonatan.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: hindi bumalik na walang laman
  rationale: Pinananatili ang Hebreong idyoma at personipikasyon nang hindi tahasang ipinapaliwanag na naging mabisa o nakapatay ang tabak.
