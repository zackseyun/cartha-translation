revisions:
- from: Pagkatapos, tinawag ni David ang isa sa mga binata at sinabi, “Lumapit ka at saktan mo siya nang malubha.[a]” Kaya sinaktan niya ito, at namatay ito.
  to: Pagkatapos, tinawag ni David ang isa sa mga binata at sinabi, “Lumapit ka at salakayin mo siya.[a]” Kaya sinaktan niya ito, at namatay ito.
  rationale: Pinalitan ang pariralang nagdaragdag ng “nang malubha” ng “salakayin mo siya,” na mas tapat sa saklaw ng Hebreong פְּגַע בּוֹ. Inayos din ang talababa upang magbigay lamang ng angkop na leksikal na alternatibo at mapanatili ang pagkakaiba ng marahas na utos at ng tahasang resultang “namatay.”
  reviewer_model: gpt-5.6-terra
