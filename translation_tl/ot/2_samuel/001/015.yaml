translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “binata” sa halip na “lingkod” o “tauhan” upang mapanatili ang leksikal na lawak ng נַעַר. Inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang tinatalakay.
