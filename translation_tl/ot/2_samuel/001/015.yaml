  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: tl
  text: Pagkatapos, tinawag ni David ang isa sa mga binata at sinabi, “Lumapit ka at salakayin mo siya.[a]” Kaya sinaktan niya ito, at namatay ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lusubin mo siya.” Maaaring tumukoy ang pandiwang Hebreo (פְּגַע בּוֹ) sa marahas na pag-atake o paglusob sa pangkalahatan; malinaw sa konteksto na kamatayan ang naging resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Sa kontekstong pasalaysay, ang קרא ay tumutukoy sa pagtawag o pagpapalapit sa isang tao. Natural at tuwiran sa modernong Tagalog ang “tinawag.”
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: ang isa sa mga binata
  rationale: Maaaring tumukoy ang נְעָרִים sa mga kabataan, lingkod, o tauhan. Pinananatili ng “mga binata” ang tuwirang pahiwatig ng edad o katayuan nang hindi ginagawang teknikal na titulo ang salita.
- source_word: גַּשׁ
  choice: Lumapit ka
  rationale: Karaniwang kahulugan ng pautos na נגשׁ ang lumapit. Ang “Lumapit ka” ay malinaw at natural sa sunod-sunod na utos.
- source_word: פְּגַע בּוֹ
  choice: saktan mo siya nang malubha
  rationale: Ang פגע na may ב ay maaaring mangahulugang salakayin, dagukan, o marahas na saktan. Malinaw sa konteksto na nakamamatay ang utos, ngunit hindi ito ang karaniwang tahasang pandiwang “patayin”; kaya pinananatili ng salin ang marahas at nakamamatay na diwa nang hindi ipinapantay agad sa “patayin.”
- source_word: וַיַּכֵּהוּ
  choice: sinaktan niya ito
  rationale: Ang נכה ay karaniwang nangangahulugang humampas o manakit. Dahil hiwalay na sinasabi ng kasunod na sugnay na namatay siya, pinananatili rito ang pagkakasunod ng kilos at resulta.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: Ang מות ang karaniwang pandiwa para sa pagkamatay, at ipinagpapatuloy ng waw-consecutive ang sunod-sunod na salaysay.
