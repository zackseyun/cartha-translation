  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: tl
  text: Paanong nabuwal ang mga mandirigma! At nawala ang mga sandatang pandigma.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kagamitang pandigma” o “mga baluting pandigma.” Malawak ang saklaw ng pariralang Hebreo at hindi lamang ito tumutukoy sa mga sandatang pansalakay.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga sandatang pandigma” ay maaari ring maunawaan bilang matalinghagang pagtukoy kina Saul at Jonatan bilang lakas-pandigma ng Israel; maaari rin naman itong basahin nang literal.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Kaylaking
  rationale: Naghahayag ito ng matinding panaghoy, hindi nagtatanong. Likas sa makabagong Tagalog ang hulma na “Kaylaking…” para mapanatili ang padamdam at makatang diin.
- source_word: נָפְלוּ
  choice: pagbagsak
  rationale: Sa pariralang “Kaylaking pagbagsak,” malinaw na tumutukoy ito sa sinapit na pagkamatay o pagkatalo, habang pinananatili ang paulit-ulit na larawan ng pagbagsak sa awit.
- source_word: גִבּוֹרִים
  choice: mga mandirigma
  rationale: Sa konteksto ng panaghoy para kina Saul at Jonatan, tumutukoy ang salita sa mga magigiting na lalaking mandirigma. Mas tiyak at natural dito ang “mga mandirigma” kaysa sa malabong “mga makapangyarihan.”
- source_word: וַיֹּאבְדוּ
  choice: naglaho
  rationale: Saklaw ng pandiwa ang pagkawala o pagkapuksa. Pinananatili ng “naglaho” ang posibilidad na literal na nawala o nawasak ang kagamitang pandigma, o na matalinghagang nawala ang mga taong bumubuo sa lakas-militar ng Israel.
- source_word: כְּלֵי מִלְחָמָה
  choice: mga sandata sa digmaan
  rationale: Ang כְּלִי ay malawak na katawagan sa kagamitan o kasangkapan. Natural sa Tagalog ang “mga sandata sa digmaan,” ngunit kailangan ng talababa upang ipakitang maaari ring tumukoy sa mas malawak na kagamitang pandigma o baluti.
theological_decisions:
- issue: Kung literal o matalinghaga ang “mga sandata sa digmaan”
  choice: Pinanatili sa pangunahing teksto ang bukas na pariralang “mga sandata sa digmaan.”
  alternative: Maaaring tumukoy ang parirala mismo kina Saul at Jonatan bilang lakas-pandigma ng Israel, o literal sa mga sandata at kagamitang nawala.
  rationale: Hindi tiyak na nilulutas ng Hebreo ang sanggunian. Ang talababa ay nagpapanatili sa dalawang makatwirang pagbasa nang hindi nagpapasya para sa mambabasa.
translation_notes:
  register: Makatula at marangal na panaghoy sa modernong Filipino Tagalog. Ginamit ang padamdam na “Kaylaking…” upang ihatid ang אֵיךְ bilang panaghoy, hindi bilang tanong. Nasa pangunahing teksto ang lahat ng marker ng talababa.
