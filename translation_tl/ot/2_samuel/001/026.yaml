base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: tl
  text: 'Matindi ang dalamhati ko para sa iyo, kapatid kong Jonatan;

    napakalugud-lugod mo sa akin.

    Kahanga-hanga ang pag-ibig mo sa akin,

    higit sa pag-ibig ng mga babae.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “higit sa pag-ibig para sa mga babae” o “higit sa pag-ibig na ibinibigay ng mga babae.” Makatang paghahambing ang Hebreo at hindi nito tahasang tinutukoy ang eksaktong uri o direksiyon ng paghahambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Matindi ang dalamhati ko dahil sa iyo
  rationale: Ipinahahayag ng parirala ang matinding personal na hapis ni David tungkol kay Jonatan. Likas sa makabagong Filipino ang “matindi ang dalamhati ko,” at pinananatili ng “dahil sa iyo” ang kaugnayan ng עַל sa sanhi o paksa ng panaghoy nang hindi dinaragdagan ang teksto ng tiyak na paliwanag.
- source_word: אָחִי
  choice: kapatid kong
  rationale: Pinananatili ang literal na “kapatid,” na maaari ring magpahayag dito ng napakalapit na ugnayan nang hindi ito pinapalitan ng mas interpretatibong “kaibigan.”
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: lubos kang naging kalugud-lugod sa akin
  rationale: Ang נעם ay tumutukoy sa pagiging kaaya-aya o kalugud-lugod, at ang “lubos” ay nagpapahayag sa diin ng מְאֹד. Pormal ngunit malinaw at marangal ang parirala sa konteksto ng isang panaghoy.
- source_word: נִפְלְאָתָה
  choice: Kahanga-hanga
  rationale: Ipinahahayag nito ang pagiging pambihira o kamangha-mangha ng pag-ibig ni Jonatan, nang hindi ginagawang mismong kahulugan ng pandiwa ang kasunod na paghahambing.
- source_word: אַהֲבָתְךָ לִי
  choice: ang pag-ibig mo sa akin
  rationale: Direktang isinasalin ang karaniwang salita para sa “pag-ibig” at ang kaugnayan nito kay David; natural sa Filipino ang “sa akin.”
- source_word: מֵאַהֲבַת נָשִׁים
  choice: higit sa pag-ibig ng mga babae
  rationale: Isinasalin ng “higit sa” ang paghahambing na ipinahihiwatig ng מִן. Ang “pag-ibig ng mga babae” ay sadyang nananatiling bukas kung ito ay pag-ibig na mula sa mga babae o pag-ibig na iniuugnay sa kanila.
theological_decisions:
- issue: Ang tiyak na uri ng paghahambing sa “pag-ibig ng mga babae”
  choice: Panatilihin ang literal at bukas na paghahambing nang hindi ito ikinakahon bilang seksuwal, romantiko, o purong platoniko.
  alternative: Maaaring unawain ito bilang pag-ibig para sa mga babae, pag-ibig na ibinibigay ng mga babae, o isang pangkalahatang makatang paghahambing.
  rationale: Hindi tinutukoy ng tekstong Hebreo ang eksaktong direksiyon o uri ng pag-ibig sa paghahambing. Ang bukas na salin at talababa ay nagpapanatili sa tunay na kalabuan at tensiyon ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na angkop sa isang makatang panaghoy. Pinanatili ang hati ng mga linya upang maipakita ang paralelismo at emosyonal na diin ng talata.
