base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: tl
  text: Nagluksa sila, umiyak, at nag-ayuno hanggang gabi dahil kay Saul, kay Jonatan na anak niya, sa bayan ni Yahweh, at sa sambahayan ng Israel, sapagkat nabuwal sila sa tabak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: Nagluksa sila
  rationale: Ang ספד ay tumutukoy sa pagluluksa o panaghoy para sa mga namatay. Likas at marangal sa modernong Filipino ang “nagluksa,” at hindi nito labis na nililimitahan ang paraan ng pagpapahayag ng dalamhati.
- source_word: וַיִּבְכּוּ
  choice: umiyak
  rationale: Tuwirang kahulugan ng בכה ang pag-iyak. Pinananatili nitong hiwalay ang aktuwal na pagluha sa mas malawak na pagluluksa na naunang binanggit.
- source_word: וַיָּצֻמוּ
  choice: nag-ayuno
  rationale: Ang צום ang karaniwang pandiwa para sa hindi pagkain bilang pagpapahayag ng dalamhati o debosyon. “Nag-ayuno” ang malinaw at nakaugaliang salin.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Tinutukoy ng parirala ang hangganan ng panahon ng kanilang pagluluksa at pag-aayuno. Natural sa Filipino ang “hanggang gabi.”
- source_word: עַל
  choice: para kay / sa
  rationale: Ipinakikilala ng paulit-ulit na עַל ang mga taong at pangkat na ipinagluksa. Ang “para kay” sa mga pangalan at “sa” sa mga pangkat ay natural na pagpapahayag sa Filipino.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Jonatan na anak niya
  rationale: Pinananatili nito ang paglalarawan ng Hebreo na si Jonatan ay anak ni Saul, nang hindi nagdaragdag ng impormasyong wala sa teksto.
- source_word: עַם יְהוָה
  choice: bayan ni Yahweh
  rationale: Ang “bayan” ay likas na kolektibong katawagan sa Filipino at pinananatili ang ugnayang tipan na ipinahihiwatig ng construct phrase.
- source_word: בֵּית יִשְׂרָאֵל
  choice: sambahayan ng Israel
  rationale: Pinananatili ng “sambahayan ng Israel” ang kolektibo at pampamilyang larawang nasa Hebreong בֵּית, sa halip na paikliin lamang ito bilang “Israel.”
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ang כִּי ng dahilan ng kanilang pagluluksa. Ang “sapagkat” ay malinaw at angkop sa marangal na salaysay.
- source_word: נָפְלוּ בֶּחָרֶב
  choice: nasawi sila sa tabak
  rationale: Sa konteksto ng digmaan, ang “nahulog/nabuwal sa tabak” ay idyoma para sa marahas na pagkamatay. Ang “nasawi sa tabak” ay natural sa Filipino, malinaw na naghahatid ng kahulugan, at pinananatili ang larawan ng tabak.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo na יְהוָה ang nasa Hebreo, kaya ginamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng “bayan ni Yahweh” at “sambahayan ng Israel”
  choice: Pinanatili bilang dalawang magkasunod na pariralang pinag-uugnay ng “at”
  alternative: Pagsamahin ang mga ito bilang iisang paliwanag o alisin ang isa bilang pag-uulit
  rationale: Paulit-ulit na ginagamit ng Hebreo ang וְעַל at hindi nito tahasang nililinaw kung lubos na magkasingkahulugan o may magkaibang diin ang dalawang katawagan. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang magkakahiwalay na kilos na pagluluksa, pag-iyak, at pag-aayuno, pati ang kolektibong idyomang “sambahayan ng Israel.” Walang talababa dahil walang kailangang alternatibong pagbasa upang maunawaan nang tapat ang talata.
