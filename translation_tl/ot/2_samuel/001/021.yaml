  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: tl
  text: 'Mga bundok ng Gilboa,


    huwag kayong patakan ng hamog o ulan,


    ni magkaroon man sa inyo ng mga bukid ng mga handog;[a]


    sapagkat doon nadungisan ang kalasag ng mga mandirigma,


    ang kalasag ni Saul,


    na hindi pinahiran ng langis.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng pariralang Hebreo. Maaari ring isalin na “ni ng masaganang mga bukid,” “ni ng mga bukid ng mga unang bunga,” o “ni ng mga bukid ng mga handog na itinaas.” Ang salitang Hebreo ay madalas tumukoy sa mga handog na ibinukod para sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumutukoy ito sa kalasag ni Saul na hindi pinahiran ng langis, isang karaniwang paghahanda o pangangalaga sa kalasag bago ang labanan, sa halip na tumukoy kay Saul bilang “ang pinahiran.”
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Mga bundok ng Gilboa
  rationale: Tuwirang pakikipag-usap ito sa bulubunduking pook ng Gilboa sa loob ng panaghoy. Ang “mga bundok” ay payak at marangal na katumbas ng הָרֵי.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: huwag magkaroon sa inyo ng hamog o ulan
  rationale: Pinananatili ang anyong sumpa o matinding kahilingan ng אַל at ang tuwirang pagtukoy sa mga bundok sa עֲלֵיכֶם.
- source_word: וּשְׂדֵי תְרוּמוֹת
  choice: ni ng mga bukid ng mga handog
  rationale: Mahirap at malabo ang pariralang Hebreo. Karaniwang tumutukoy ang תְרוּמוֹת sa mga ambag o handog na ibinukod para sa Diyos; kaya pinanatili ang kapansin-pansing literal na ugnayan sa halip na tahimik itong gawing “masaganang bukid.”
- source_word: כִּי שָׁם
  choice: sapagkat doon
  rationale: Likas na ipinakikilala nito sa Filipino ang dahilan ng naunang sumpa.
- source_word: נִגְעַל
  choice: nadungisan
  rationale: Ipinahahayag nito ang pagkadungis at kahihiyang sinapit ng kalasag matapos ang pagkatalo, nang hindi pinipili ang mas tiyak ngunit pinagtatalunang diwang “itinapon.”
- source_word: מָגֵן גִּבּוֹרִים
  choice: ang kalasag ng mga mandirigma
  rationale: Sa konteksto ng labanan, malinaw at natural na inilalarawan ng גִּבּוֹרִים ang magigiting na mandirigma.
- source_word: מָגֵן שָׁאוּל
  choice: ang kalasag ni Saul
  rationale: 'Pinananatili ang patulang pag-uulit: mula sa pangkalahatang “kalasag ng mga mandirigma” tungo sa tiyak na “kalasag ni Saul.”'
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: na hindi pinahiran ng langis
  rationale: Pinananatili ang payak na salita ng Hebreo at iniuugnay sa pinakamalapit na pangngalang “kalasag.” Hindi idinaragdag ang paghahambing na “na para bang,” na wala sa teksto.
theological_decisions:
- issue: Maaaring mapagkamalang titulong teolohikal ang מָשִׁיחַ sa pariralang ito
  choice: Isinalin bilang kilos na “pinahiran” at iniugnay sa kalasag ni Saul.
  alternative: Maaaring iugnay ang “pinahiran” kay Saul bilang ang pinahirang hari.
  rationale: Ang kasunod na בַּשָּׁמֶן (“ng langis”) at ang agarang konteksto tungkol sa kalasag ay higit na umaayon sa karaniwang pagpapahid ng langis sa kalasag. Gayunman, ipinapaliwanag sa talababa ang sanggunian nito sa halip na magpasok ng mesiyanikong kahulugan.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang tuwirang pakikipag-usap sa mga bundok, ang magkahanay na mga parirala, at ang pag-uulit ng “kalasag.” Ang bahagyang di-karaniwang “mga bukid ng mga handog” ay sadyang nagpapanatili sa tunay na hirap at kalabuan ng Hebreo, na nililinaw sa talababa.
