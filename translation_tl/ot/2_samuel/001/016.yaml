  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: tl
  text: Sinabi ni David sa kanya, “Ang dugo mo ay nasa ulo mo[a], sapagkat ang bibig mo ang nagpatotoo laban sa iyo[b] nang sabihin mo, ‘Ako mismo ang pumatay sa pinahiran ni Yahweh.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Mapasa ulo mo ang dugo mo.” Itinatakda ng Hebreong idyoma na siya mismo ang may pananagutan sa kanyang kamatayan.
    reason: lexical_alternative
  - marker: b
    text: O “ang bibig mo ay nagbigay ng patotoo laban sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: Sinabi ni David sa kanya
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Tagalog ang payak na “Sinabi,” habang tahasang naisasalin ang אֵלָיו bilang “sa kanya.”
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Ang dugo mo ay nasa sarili mong ulo
  rationale: Pinananatili ang Hebreong larawang panghukuman na naglalagay sa tao mismo ng pananagutan sa sarili niyang kamatayan. Ipinahihiwatig ng “sarili mong” ang reflexive na diin ng idyoma.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng hatol ni David at pinananatili ang marangal na tonong panghukuman.
- source_word: פִּיךָ
  choice: ang sarili mong bibig
  rationale: Pinananatili ang metonimiya ng bahagi ng katawan at ang diin sa sariling pananalitang nagpatunay sa kanyang pagkakasala.
- source_word: עָנָה בְךָ
  choice: nagpatotoo laban sa iyo
  rationale: Sa kontekstong legal, ang ענה na may ב ay tumutukoy sa pagbibigay ng patotoo laban sa isang tao; malinaw itong naihahayag ng “nagpatotoo laban sa iyo.”
- source_word: לֵאמֹר
  choice: nang sabihin mo
  rationale: Likas na ipinakikilala sa Tagalog ang nilalaman ng patotoo at nililinaw na ang sariling sinabi ng lalaki ang ebidensiya laban sa kanya.
- source_word: אָנֹכִי
  choice: Ako mismo
  rationale: Ang hiwalay na panghalip ay may diin; pinananatili ng “mismo” ang tahasang pag-angkin sa ginawa.
- source_word: מֹתַתִּי
  choice: pumatay
  rationale: 'Tuwiran at natural nitong ipinapahayag ang causative na diwa ng pandiwa: siya ang nagsanhi ng kamatayan.'
- source_word: מְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Isinasalin ang mahahalagang kahulugan ng titulong maharlika para kay Saul nang hindi inaangkat ang mga susunod na Kristolohikal na gamit ng “Mesiyas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang tipang pangalan bilang pangalan, hindi bilang titulong ipinalit dito.
- issue: Kahulugan ng מְשִׁיחַ sa kontekstong maharlika
  choice: pinahiran
  alternative: mesiyas
  rationale: Si Saul ang tinutukoy bilang haring itinalaga sa pamamagitan ng pagpapahid. Isinasalin ang titulo ayon sa konteksto at iniiwasang ipasok sa salaysay ang mga kahulugang umunlad kalaunan.
- issue: Puwersang pangungusap ng sugnay na דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Ang dugo mo ay nasa sarili mong ulo
  alternative: Mapasa ulo mo ang dugo mo
  rationale: Walang tahasang pandiwa ang Hebreo, kaya maaari itong unawain bilang pahayag ng pananagutan o bilang pormulang paghahatol. Pinili sa pangunahing teksto ang natural na pahayag, habang pinananatili sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang larawang panghukuman ng Hebreo at ang diin sa sariling pag-amin, ngunit iniiwasan ang sobrang literal na ayos na magiging alanganin sa karaniwang mambabasa.
