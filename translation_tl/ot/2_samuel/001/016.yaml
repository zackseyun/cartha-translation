  to: Sinabi ni David sa kanya, “Ang dugo mo ay nasa ulo mo[a], sapagkat ang bibig mo ang nagpatotoo laban sa iyo[b] nang sabihin mo, ‘Ako mismo ang pumatay sa pinahiran ni Yahweh.’”
  rationale: Inalis ang hindi kailangang “sarili” sa dalawang parirala upang maging mas likas ang Filipino at maiwasan ang pagdaragdag ng diin na hindi tuwirang minamarkahan sa Hebreo. Pinanatili ang legal na imahen, ang pagsasakdal ng sariling pananalita, ang mariing “Ako mismo,” at ang pangalang Yahweh.
