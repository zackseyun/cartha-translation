base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: tl
  text: Sinabi ni David sa binatang nagbalita sa kanya, “Taga-saan ka?” Sumagot siya, “Anak ako ng isang Amalekitang dayuhang naninirahan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Anak ako ng isang dayuhang naninirahan na Amalekita.” Maaaring tukuyin ng pariralang Hebreo ang ama bilang isang Amalekitang dayuhang naninirahan, o mas malawak na iugnay ang nagsasalita, ayon sa kaniyang pinagmulan, sa isang Amalekitang naninirahang dayuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: binata
  rationale: Karaniwang tumutukoy ang נַעַר sa isang kabataang lalaki. Ang “binata” ay natural sa modernong Tagalog at hindi nagpapahiwatig na siya ay alipin o lingkod.
- source_word: הַמַּגִּיד לוֹ
  choice: nagbalita sa kanya
  rationale: Ang participle ng נגד ay tumutukoy sa taong naghatid ng balita kay David. Mas angkop sa konteksto ang “nagbalita” kaysa sa pangkalahatang “nagsabi.”
- source_word: אֵי מִזֶּה
  choice: Taga-saan ka?
  rationale: Ang idyoma ay nagtatanong tungkol sa pinagmulan. Ang “Taga-saan ka?” ay malinaw at likas sa kasalukuyang Tagalog.
- source_word: בֶּן אִישׁ
  choice: Anak ako ng isang
  rationale: Literal itong “anak ng isang lalaki,” ngunit hindi kailangang ilantad sa Tagalog ang salitang “lalaki”; pinananatili ng “anak ako ng isang” ang ugnayang pampamilya nang hindi nagiging asiwa.
- source_word: גֵּר
  choice: dayuhang naninirahan dito
  rationale: Ang גֵּר ay isang di-katutubong naninirahan sa lupaing hindi niya sariling bayan. Inihahayag ng pariralang ito kapuwa ang pagiging dayuhan at ang paninirahan, nang hindi gumagamit ng lipas o posibleng mapanlinlang na termino.
- source_word: עֲמָלֵקִי
  choice: Amalekita
  rationale: Karaniwang Tagalog na anyo ng katawagang etniko para sa isang taong mula sa Amalek.
- source_word: אָנֹכִי
  choice: ako
  rationale: Ang hayag na panghalip ay nagbibigay-diin sa sariling pagkakakilanlan ng nagsasalita; natural itong isinasama sa “Anak ako.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang usapan at ang pagkakakilanlan ng ama bilang isang Amalekitang dayuhang naninirahan sa lupain. Hindi ginamit ang hulaping “-ng” sa “Amalekita” upang maiwasan ang kalituhan na ang mismong anak, sa halip na ang ama, ang tuwirang inilalarawan ng גֵּר.
