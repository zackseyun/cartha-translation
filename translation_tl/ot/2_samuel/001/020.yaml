  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: tl
  text: Huwag ninyong sabihin ito sa Gat; huwag ninyong ibalita sa mga lansangan ng Askelon, baka magalak ang mga anak na babae ng mga Filisteo, baka magbunyi ang mga anak na babae ng mga hindi tuli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga hindi tuli” ay literal na salin ng isang mapanlibak na katawagang may kaugnayan sa tipan na tumutukoy sa mga Filisteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: sabihin ito
  rationale: Ang pandiwang נגד ay nangangahulugang magsabi, mag-ulat, o magpahayag. Likas sa Tagalog ang “sabihin ito”; idinagdag ang “ito” bilang pahiwatig sa balita tungkol sa pagkamatay nina Saul at Jonatan.
- source_word: בְגַת
  choice: sa Gat
  rationale: Tuwirang lokatibong parirala na may pangalan ng lungsod; pinanatili ang karaniwang anyong “Gat.”
- source_word: תְּבַשְּׂרוּ
  choice: ibalita
  rationale: Ang piel ng בשר ay tumutukoy sa pagdadala o pagpapahayag ng balita. Ang “ibalita” ay natural at malinaw, at naiiba sa naunang “sabihin.”
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: sa mga lansangan ng Askelon
  rationale: Ang חוּצוֹת ay maaaring tumukoy sa mga lansangan o pampublikong liwasan. Ang “mga lansangan” ay natural at pinananatili ang diwa ng hayagang pagpapahayag sa lungsod.
- source_word: פֶּן
  choice: upang hindi
  rationale: Nagpapakilala ito ng negatibong layunin o kinatatakutang resulta. Ang “upang hindi” ay malinaw at marangal sa modernong Tagalog, habang pinananatili ang magkatulad na hulma ng dalawang sugnay.
- source_word: תִּשְׂמַחְנָה
  choice: magalak
  rationale: Ang שמח ay nagpapahayag ng galak. Ang “magalak” ay angkop sa maringal na himig ng panaghoy.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: ang mga anak na babae ng mga Filisteo
  rationale: Pinananatili ng literal na parirala ang makatang pagtukoy sa mga babaeng Filisteo bilang mga magdiriwang.
- source_word: תַּעֲלֹזְנָה
  choice: magbunyi
  rationale: Ang עלז ay nagsasaad ng masigla at matagumpay na pagsasaya. Ipinapakita ng “magbunyi” ang pag-igting mula sa naunang “magalak.”
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: ang mga anak na babae ng mga hindi tuli
  rationale: Literal na tumutukoy ang עֲרֵלִים sa “mga hindi tuli.” Pinananatili ng salin ang etniko-relihiyoso at tipanang talim ng katawagan nang hindi ito ginagawang pangkalahatang insulto.
theological_decisions:
- issue: Pagpapahayag sa tipanang katawagang mapanlibak na עֲרֵלִים
  choice: mga hindi tuli
  alternative: mga pagano
  rationale: Ang Hebreo ay tahasang kaugnay ng pagtutuli at ng pagkakakilanlan sa tipan. Iniiwasan ng literal na salin ang pagpapalit dito ng mas malawak at interpretatibong katawagang “mga pagano.”
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Pinanatili ang dalawang magkatulad na pagbabawal, ang pag-igting mula “magalak” tungo sa “magbunyi,” at ang literal na tipanang katawagan. Ginamit ang “lansangan” sa halip na mas kolokyal na “kalye” upang bumagay sa panaghoy.
