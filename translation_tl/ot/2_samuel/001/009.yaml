  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: tl
  text: At sinabi niya sa akin, “Tumayo ka sana sa ibabaw ko at patayin mo ako, sapagkat sinunggaban ako ng matinding paghihirap[a], sapagkat may buhay pa ako.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinunggaban ako ng pulikat o pangingisay.” Bihira ang salitang Hebreo at hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sapagkat ang buong buhay ko ay nasa akin pa.” Maaari ring unawain ang panimula bilang “bagaman,” ayon sa diwa ng konteksto.
    reason: literal_and_syntactic_alternative
lexical_decisions:
- source_word: עֲמָד נָא עָלַי
  choice: Tumayo ka sana sa ibabaw ko
  rationale: Pinananatili ng “tumayo” at “sa ibabaw ko” ang karaniwang diwa ng עָמַד at עַל sa kalagayan ng isang nakahandusay na sugatan. Ipinahahayag ng “sana” ang pakiusap na taglay ng נָא.
- source_word: וּמֹתְתֵנִי
  choice: at patayin mo ako
  rationale: Ang anyong causative ng מות ay tuwirang pakiusap na maging sanhi ng kaniyang kamatayan. Natural at malinaw sa makabagong Tagalog ang “patayin mo ako.”
- source_word: אֲחָזַנִי
  choice: sinunggaban ako
  rationale: Ang אָחַז ay nangangahulugang humawak o sumunggab. Ipinakikita ng “sinunggaban” ang biglaan at mapangibabaw na pagdating ng kalagayan.
- source_word: הַשָּׁבָץ
  choice: matinding paghihirap
  rationale: Bihira at hindi tiyak ang eksaktong kahulugan ng salitang Hebreo. Hindi labis na tiyak ang “matinding paghihirap,” samantalang inilalahad sa talababa ang posibleng pisikal na mga kahulugan.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: bagaman may buhay pa ako
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buhay na nananatili sa kaniya, hindi kinakailangang sa “kaluluwa” bilang teknikal na katawagan. Natural ang salin, at ipinahahayag ng “bagaman” ang diwang pasalungat na angkop sa konteksto.
- source_word: וַיֹּאמֶר אֵלַי
  choice: At sinabi niya sa akin
  rationale: Tuwirang inililipat nito ang sunod-sunod na pagsasalaysay at ang pakikipag-usap sa unang panauhan.
theological_decisions:
- issue: Diwa ng נֶפֶשׁ sa huling sugnay
  choice: buhay
  alternative: kaluluwa
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa nananatiling buhay o hininga ng sugatan; ang “kaluluwa” ay maaaring magpasok ng teknikal na teolohikal na kahulugang hindi hinihingi ng talata.
- issue: Ugnayan ng huling כִּי sa naunang pahayag
  choice: bagaman
  alternative: sapagkat
  rationale: 'Maaaring maging sanhi ang karaniwang kahulugan ng כִּי, ngunit sa konteksto ay natural itong maunawaan bilang pasalungat: hinihiling niyang patayin siya kahit may buhay pa siya. Itinatala sa talababa ang mas literal na alternatibo upang hindi mawala ang ambiguwidad.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Tuwiran ang pakiusap na “patayin mo ako,” habang iniiwasan ang labis na teknikal o denominasyonal na pananalita. Ang mga panandang talababa ay inilagay kaagad sa mga pariralang ipinaliliwanag ng mga ito.
