  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: tl
  text: Pagkatapos, binigkas ni David ang panaghoy na ito para kay Saul at sa anak nitong si Jonatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “nanaghoy si David sa pamamagitan ng panaghoy na ito”; magkaugnay na pandiwa at pangngalan ang ginamit sa Hebreo bilang pormal na pagpapahayag ng panaghoy para sa namatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: inawit ... ang panaghoy
  rationale: Ang pandiwang קונן ay tumutukoy sa pagbigkas o pag-awit ng pormal na panaghoy. Sa Filipino, likas ang “inawit ang panaghoy” at naipapakita nito ang performatibong diwa nang hindi gumagamit ng alanganing pag-uulit.
- source_word: הַקִּינָה
  choice: panaghoy
  rationale: Ang קִינָה ay pormal na awit o tula ng pagluluksa, karaniwan para sa namatay. Ang “panaghoy” ay malinaw, marangal, at angkop sa konteksto.
- source_word: הַזֹּאת
  choice: na ito
  rationale: Tuwirang inilalarawan ng demonstratibo ang panaghoy.
- source_word: עַל
  choice: para kay
  rationale: Sa konteksto ng pagluluksa, ipinakikilala ng עַל ang mga taong pinapaksa at ipinagluluksa. Natural sa modernong Filipino ang “panaghoy para kay.”
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalang Hebreo sa Filipino.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: בְּנוֹ
  choice: sa anak nitong
  rationale: Ang hulaping panghalip ay tumutukoy kay Saul. Nililinaw ng “nitong” na si Jonatan ay anak ni Saul, hindi ni David.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang waw na kasama ng wayyiqtol ay nagpapatuloy sa pagkakasunod-sunod ng salaysay; natural itong ipinapahayag ng “Pagkatapos.”
