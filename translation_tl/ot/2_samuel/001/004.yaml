base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: tl
  text: Sinabi ni David sa kanya, “Ano ang nangyari?[a] Pakisabi sa akin.” Sumagot siya, “Tumakas mula sa labanan ang mga kawal, at marami rin sa kanila ang nabuwal at namatay.[b] Namatay rin sina Saul at ang anak niyang si Jonatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Ano ang bagay?” Maaari ring isalin, “Ano ang nangyari?” o “Ano ang nangyari sa bagay na ito?”
    reason: lexical_alternative
  - marker: b
    text: Ang “nabuwal” ay karaniwang pananalita sa Hebreo para sa pagkasawi sa labanan; nililinaw ng kasunod na “namatay” ang kinalabasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: Ano ang nangyari?
  rationale: Ang literal na tanong ay “Ano ang bagay/usapin?” ngunit isa itong idyomatikong pagtatanong tungkol sa naganap. Ang “Ano ang nangyari?” ay natural at tumpak sa makabagong Tagalog.
- source_word: הַגֶּד נָא לִי
  choice: Pakisabi sa akin
  rationale: Ang הַגֵּד ay pautos na “sabihin/ibalita,” at ang נָא ay nagpapahayag ng magalang o apurahang pakiusap. Malinaw na naihahatid ng “Pakisabi sa akin” ang dalawang sangkap.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: Tumakas mula sa labanan ang mga kawal
  rationale: Ang נָס ay “tumakas,” at sa konteksto ng digmaan ang הָעָם ay tumutukoy sa mga taong nakikipaglaban. Mas tiyak at natural dito ang “mga kawal” kaysa sa pangkalahatang “mga tao.”
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: at marami rin sa kanila ang nabuwal at namatay
  rationale: Sa konteksto ng labanan, ang נָפַל ay karaniwang larawan ng pagkabuwal o pagkasawi. Pinananatili ng “nabuwal” ang larawang Hebreo, habang malinaw na ipinapahayag ng kasunod na “namatay” ang kinalabasan at pinananatili ang dalawang pandiwa.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: Namatay rin sina Saul at ang anak niyang si Jonatan
  rationale: Tuwirang inilalahad ng Hebreo ang sukdulang balita ng kanilang pagkamatay. Pinananatili ang “anak niyang” dahil tahasan itong nasa teksto, at natural sa Tagalog ang ayos na ito.
