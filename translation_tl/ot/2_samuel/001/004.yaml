translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kawal” ayon sa konteksto ng labanan, at pinanatili ang larawang “nabuwal” nang hindi ikinukubli ang tahasang pagbanggit sa kanilang pagkamatay.
