base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: tl
  text: Pagkamatay ni Saul, matapos bumalik si David mula sa pagsalakay sa mga Amalekita[a], nanatili siya sa Ziklag nang dalawang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Amalek”—isang pang-isahang pangalan na kolektibong tumutukoy sa bayang Amalekita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[hindi tuwirang isinalin]'
  rationale: Pormula ito ng pagpapatuloy at pagtatakda ng tagpo sa salaysay. Likas nang naipahihiwatig sa Filipino ng panimulang pariralang “Pagkamatay ni Saul,” kaya hindi idinagdag ang mabigat na “At nangyari.”
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: Pagkamatay ni Saul
  rationale: Maikli, natural, at tapat na pagpapahayag ng temporal na pariralang “pagkatapos ng kamatayan ni Saul.”
- source_word: וְדָוִד שָׁב
  choice: bumalik si David
  rationale: Pinananatili ang naunang pagbabalik ni David sa loob ng temporal na tagpo. Hindi kailangan sa Filipino ang tahasang katumbas ng English past perfect upang maging malinaw ang pagkakasunod-sunod.
- source_word: מֵהַכּוֹת
  choice: mula sa pagtalo
  rationale: Ipinapahayag ang pandiwang militar na נכה at ang pinagmulan ng pagbabalik. Ang “pagtalo” ay natural sa Filipino at hindi nagpapahiwatig na lubusang nalipol ang buong bayan.
- source_word: אֶת הָעֲמָלֵק
  choice: sa mga Amalekita[a]
  rationale: Ang singular na pangalang-bayan na “Amalek” ay kolektibong tumutukoy sa mga taong Amalekita; ito ang pinakamalinaw na anyo sa modernong Filipino.
- source_word: וַיֵּשֶׁב
  choice: at nanatili siya
  rationale: Ang “nanatili” ay angkop sa pansamantalang paninirahan na dalawang araw at mas natural kaysa “tumahan” sa kontekstong ito.
- source_word: בְּצִקְלָג
  choice: sa Ziklag
  rationale: Karaniwang anyo ng lokatibong parirala at transliterasyon ng pangalan ng lugar.
- source_word: יָמִים שְׁנָיִם
  choice: nang dalawang araw
  rationale: Natural na Filipino para sa accusative of duration; malinaw nitong ipinapakita kung gaano katagal nanatili si David.
