translation_notes:
  register: Modernong Filipino na natural at marangal ang ginamit. Pinanatili ang payak na daloy ng salaysay, iniwasan ang arkaikong pananalita, at inilagay ang talababa sa “mga Amalekita,” ang salitang aktuwal nitong ipinaliliwanag.
