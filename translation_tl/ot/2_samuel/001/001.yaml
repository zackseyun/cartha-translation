  source_fidelity: Kailangan ng maliit na pag-aayos sa ayos ng pangungusap upang malinaw na ang pagbabalik ni David mula sa pagsalakay sa mga Amalekita ay naganap bago siya nanatili sa Ziklag. Ang “pagtalo” ay mas mahina kaysa sa Hebreong הַכּוֹת (“pagpukol/pananalakay; striking down”); ang “salakayin” ay mas malapit nang hindi nagpapahiwatig ng ganap na paglipol.
  naturalness: Natural at modernong Filipino ang “Pagkamatay ni Saul” at “nanatili ... nang dalawang araw.” Mas malinaw at maayos ang daloy sa pamamagitan ng “matapos bumalik si David mula sa pagsalakay ...” bago ang pangunahing sugnay.
  terminology: Ang “mga Amalekita” at “Ziklag” ay angkop. Iningatan ng talababa ang katotohanang pang-isahan ang Hebreong etnonym ngunit kolektibo ang tinutukoy.
