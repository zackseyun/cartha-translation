base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/007.yaml
  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: tl
  text: Lumingon siya at nakita niya ako[a], at tinawag niya ako. Sinabi ko, “Narito ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Lumingon siya sa likuran niya.” Ang pananalita ay nangangahulugang bumaling siya upang tumingin sa likuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Lumingon siya
  rationale: Ang פנה kasama ng אַחֲרָיו ay literal na tumutukoy sa pagharap niya sa nasa likuran niya. Likas na ipinahahayag ito sa modernong Tagalog ng “lumingon,” habang inilalagay sa talababa ang mas literal na anyo.
- source_word: וַיִּרְאֵנִי
  choice: at nakita niya ako
  rationale: Tuwirang ipinahahayag ng ראה na nakita niya ang nagsasalita; pinananatili ng “nakita niya ako” ang payak na kilos sa salaysay.
- source_word: וַיִּקְרָא אֵלָי
  choice: at tinawag niya ako
  rationale: Ang קרא אל ay pagtawag sa isang tao. Natural sa Tagalog ang “tinawag niya ako” at hindi nito ipinapasok ang mas matinding diwa ng pagpapatawag.
- source_word: וָאֹמַר
  choice: Sinabi ko
  rationale: Ang אמר ay karaniwang “sabihin.” Bagaman maaaring “sumagot ako” ayon sa usapan, ang “sinabi ko” ay mas malapit sa Hebreo at malinaw pa rin sa Tagalog.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Ito ang karaniwang pahayag ng paghaharap ng sarili at kahandaang tumugon. Pinananatili ng “Narito ako” ang maikli at marangal na anyo ng Hebreo.
theological_decisions: []
