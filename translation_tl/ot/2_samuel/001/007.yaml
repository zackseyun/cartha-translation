  register: Gumamit ng natural at marangal na modernong Tagalog. Ang “lumingon” ay mas malinaw at hindi paulit-ulit kaysa sa literal na “lumingon sa likuran niya,” samantalang ang talababa ay nagpapanatili sa anyo ng Hebreo.
