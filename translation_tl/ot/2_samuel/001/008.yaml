base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: tl
  text: Sinabi niya sa akin[a], “Sino ka?” At sinabi ko sa kanya, “Isa akong Amalekita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ikalawang sugnay, literal na “at sinabi niya” ang Hebreo; ngunit ayon sa konteksto, “at sinabi ko” ang diwa, sapagkat isinasalaysay ng lalaki ang sarili niyang sagot kay Saul.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Sinabi niya sa akin
  rationale: Ang pandiwa at ang hulaping unang panauhan sa לִי ay nagsasaad na si Saul ang nagsalita sa tagapagsalaysay. Hindi na kailangang isalin ang panimulang waw bilang “At” upang maging natural ang daloy sa Tagalog.
- source_word: מִי אָתָּה
  choice: Sino ka?
  rationale: Ito ang natural at tuwirang katumbas sa Tagalog ng Hebreong tanong na walang tahasang copula.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: At sinabi ko sa kanya
  rationale: Bagaman ikatlong panauhang panlalaki ang anyong nakasulat ng pandiwa (“at sinabi niya”), malinaw sa daloy ng salaysay at sa אֵלָיו (“sa kanya”) na inuulat ng Amalekita ang sarili niyang sagot kay Saul. Isinalin sa unang panauhan at nilagyan ng talababa upang mapanatili ang tekstuwal na detalye.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: Isa akong Amalekita
  rationale: Ang gentiliko ay tumutukoy sa pagkakakilanlan bilang Amalekita, at ang malayang panghalip na אָנֹכִי ay tahasang nagbibigay-diin sa sariling pagkakakilanlan. Natural sa modernong Tagalog ang “Isa akong Amalekita.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang tono. Ginamit ang “Amalekita,” ang karaniwang anyo ng gentiliko sa Tagalog, at pinanatili ang maikli at tuwirang ayos ng diyalogo.
