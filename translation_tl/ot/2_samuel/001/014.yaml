  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: tl
  text: Pagkatapos ay sinabi sa kanya ni David, “Paanong hindi ka natakot na magtaas ng kamay laban sa pinahiran ni Yahweh[a] upang patayin siya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinahiran ni Yahweh” ay tumutukoy sa haring itinalaga ni Yahweh sa pamamagitan ng pagpapahid ng langis.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: Pagkatapos ay sinabi sa kanya ni David
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos ay sinabi,” at malinaw na tumutukoy ang “sa kanya” sa mensaherong Amalekita.
- source_word: אֵיךְ לֹא יָרֵאתָ
  choice: Paanong hindi ka natakot
  rationale: Pinananatili ng “Paanong” ang literal na anyong “Paano?” at ang himig ng pagkabigla at pagsaway, sa halip na agad itong ipakahulugang “Bakit.”
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: pagbuhatan ng kamay
  rationale: Ang idyomang Hebreo ay tumutukoy sa marahas na pagkilos laban sa isang tao. Ang “pagbuhatan ng kamay” ay natural na idyomang Tagalog at pinananatili ang larawan ng kamay.
- source_word: לְשַׁחֵת
  choice: upang patayin siya
  rationale: Bagaman maaaring mangahulugan ang pandiwa ng “sirain” o “lipulin,” malinaw sa konteksto na ang tinutukoy ay nakamamatay na pagkilos laban kay Saul; mas natural at tiyak dito ang “patayin.”
- source_word: מְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Tumutukoy ito kay Saul bilang haring itinalaga sa pamamagitan ng pagpapahid, hindi bilang tuwirang paggamit ng titulong Mesiyas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ng Diyos ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh.”
- issue: Kahulugan ng מְשִׁיחַ para kay Saul
  choice: pinahiran
  alternative: Mesiyas; hinirang na hari
  rationale: Sa salaysay na ito, inilalarawan ng salita ang maharlikang pagtatalaga kay Saul sa pamamagitan ng pagpapahid. Iniiwasan ng “pinahiran” ang di-kinakailangang pag-angkat ng mas huling mesiyanikong gamit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong retorikal na “Paanong” at gumamit ng natural na idyomang “pagbuhatan ng kamay.”
