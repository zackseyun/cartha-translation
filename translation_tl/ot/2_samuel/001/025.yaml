  source_fidelity: Kailangang alisin ang "O" bago ang pangalan ni Jonatan. Walang pantawag na katumbas nito sa Hebreo, at ginagawa nitong si Jonatan ang tuwirang kausap, samantalang nananatiling hindi tahasan sa teksto ang tinutukoy ng hulaping "iyong" sa "iyong matataas na dako." Ang "Paanong" ay mas tuwirang naghahatid ng eksklamatibong אֵיךְ, at ang "mga magigiting" ay mas angkop na katumbas ng גִּבֹּרִים sa kontekstong pandigma.
  naturalness: Makatula at natural sa modernong Filipino ang "Paanong nabuwal ang mga magigiting". Ang payak na sugnay na "Si Jonatan ay napatay" ay malinaw, marangal, at hindi nagdaragdag ng pantawag na wala sa pinagmulan.
  terminology: Ginamit ang "mga magigiting" para sa mga mandirigmang may lakas at kagitingan, hindi lamang mga taong "makapangyarihan." Pinanatili ang "matataas na dako" para sa בָּמוֹתֶיךָ at ang kalabuan ng "iyong."
  issues:
  - severity: medium
    issue: Idinagdag ng "O Jonatan" ang isang pantawag na wala sa tekstong Hebreo.
    rationale: Ang Hebreo ay nagpapangalan lamang kay Jonatan at saka inilalarawan siyang napatay sa "iyong matataas na dako." Ang "O" ay hindi lamang estilistikong dagdag; ikinakabit nito ang panghalip na "iyong" kay Jonatan at sa gayon ay pinapaliit ang kalabuan ng sanggunian.
  - severity: low
