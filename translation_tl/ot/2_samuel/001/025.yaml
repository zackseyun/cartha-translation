  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: tl
  text: Paanong nabuwal ang mga magigiting sa gitna ng labanan! Si Jonatan ay napatay sa iyong matataas na dako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong matataas na lugar.” Maaaring tumukoy ang Hebreo sa mataas na lupain; dito, malamang na ang mga matataas na dako ng Israel ay patulang tinutukoy sa panaghoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Kaylungkot!
  rationale: Nagsisilbi itong bulalas ng panaghoy, hindi tanong. Natural sa makabagong Tagalog ang “Kaylungkot!” bilang pagpapahayag ng matinding dalamhati.
- source_word: נָפְלוּ
  choice: nabuwal
  rationale: Ipinahahayag ng ganap na pandiwa ang nangyari nang pagkabagsak; ang “nabuwal” ay marangal at angkop sa makatang panaghoy tungkol sa pagkamatay sa labanan.
- source_word: גִבֹּרִים
  choice: ang mga makapangyarihan
  rationale: Pinananatili nito ang malawak na diwa ng mga taong bantog sa lakas at kagitingan, nang hindi nililimitahan sa isang tiyak na ranggong militar.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: sa gitna ng labanan
  rationale: Tuwirang pinananatili ang diwa ng pagiging nasa loob o kasagsagan ng labanan.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: עַל
  choice: sa
  rationale: Natural na panandang panlunan sa Tagalog para sa lokatibong gamit ng pang-ukol.
- source_word: בָּמוֹתֶיךָ
  choice: iyong matataas na dako
  rationale: Pinananatili ang literal na larawan ng matataas na lupain at ang ikalawang panauhang hulapi, habang iniiwasang magpasok ng di-tiyak na kultikong kahulugan.
- source_word: חָלָל
  choice: napatay ka
  rationale: Tumutukoy sa isang taong pinaslang o napatay. Ang tahasang sugnay ay natural sa Tagalog at naghahatid ng ipinahihiwatig na predikasyon sa Hebreo.
theological_decisions:
- issue: Tinutukoy ng hulaping ikalawang panauhan sa בָּמוֹתֶיךָ
  choice: Pinanatili sa pangunahing teksto bilang “iyong matataas na dako,” na maaaring mabasa bilang patula at personipikadong pagtukoy sa lupain
  alternative: Ituring itong mga sariling mataas na dako ni Jonatan, o gawing tahasang “matataas na dako ng Israel”
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang tinutukoy ng “iyong.” Pinananatili ng salin ang tunay na kalabuan, samantalang ipinapaliwanag ng talababa ang malamang na patulang pagtukoy sa lupain o kabundukan ng Israel.
translation_notes:
  register: Makatula, marangal, at madaling maunawaan sa modernong Filipino. Ginamit ang “Kaylungkot!” upang malinaw na marinig bilang panaghoy ang אֵיךְ, at “nabuwal” upang mapanatili ang paulit-ulit na larawang makata sa awit.
