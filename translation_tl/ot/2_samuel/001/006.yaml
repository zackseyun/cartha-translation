translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “binata,” “sibat,” “karwaheng pandigma,” at “mangangabayo” bilang mga salitang madaling maunawaan. Isinalin nang idiomatiko ang dalawang וְהִנֵּה upang mapanatili ang buhay na paglalahad nang hindi maging pilit sa Filipino.
