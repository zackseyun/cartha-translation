base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: tl
  text: Sinabi ng binatang nagbalita sa kanya, “Nagkataon[a] na naroon ako sa Bundok Gilboa. Naroon si Saul, nakasandal sa kanyang sibat, at ang mga karwaheng pandigma at mga mangangabayo ay malapit nang makaabot sa kanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit sa isang idyoma ang pandiwa upang idiin na nagkataon lamang ang pagkaroroon niya roon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga karwahe at mga mangangabayo,” “ang puwersa ng mga karwahe at mga mangangabayo,” o “mahigpit nang humahabol sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: binata
  rationale: Karaniwang tumutukoy ang נַעַר sa isang kabataang lalaki; natural at hindi mapanlinlang ang “binata” sa kontekstong ito.
- source_word: הַמַּגִּיד לוֹ
  choice: nagbalita sa kanya
  rationale: Ang participle ng נגד ay tumutukoy sa binatang naghahatid ng ulat kay David; malinaw at natural sa Filipino ang “nagbalita sa kanya.”
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: Nagkataon na naroon ako
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapatingkad sa di-sinasadyang pagkaroroon. Nahuhuli ng “nagkataon” ang Hebreong idyoma nang natural.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: sa Bundok Gilboa
  rationale: Ito ang karaniwang malinaw na anyo para sa pinangalanang bundok sa makabagong Filipino.
- source_word: וְהִנֵּה
  choice: Naroon … at
  rationale: Ginagawang buhay ng הִנֵּה ang eksena. Sa Filipino, naipahihiwatig ito nang natural sa “Naroon” at sa agarang paglalahad ng sumunod na tanawin, sa halip na ulitin ang literal ngunit matigas na “narito.”
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: nakasandal sa kanyang sibat
  rationale: Tuwirang ipinapahayag nito ang pisikal na pagsandig o pagsuporta sa sarili na nasa Niphal participle ng שען.
- source_word: הָרֶכֶב
  choice: mga karwaheng pandigma
  rationale: Maaaring kolektibo ang רֶכֶב para sa puwersang gumagamit ng mga karwaheng pandigma; malinaw sa ordinaryong mambabasa ang napiling anyo.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: mga mangangabayo
  rationale: Ang literal na idyomang “mga panginoon/tagapamahala ng mga kabayo” ay tumutukoy sa mga nakasakay sa kabayo; “mangangabayo” ang natural na katumbas.
- source_word: הִדְבִּקֻהוּ
  choice: papalapit na sa kanya
  rationale: Ang Hiphil ng דבק ay maaaring mangahulugang humabol, umabot, o dumikit nang malapit. Pinananatili ng “papalapit na” ang di-ganap na pag-abot na ipinahihiwatig ng eksena.
