  naturalness: Mas natural at malinaw sa makabagong Filipino ang ‘Noong ikatlong araw’ kaysa ‘Nang ikatlong araw.’ Ang ‘mula sa piling ni Saul’ ay mas maayos na nagpapahiwatig ng pakikisama o presensiya kaysa ‘mula sa panig ni Saul,’ na maaaring magmungkahi ng pangkat o paninindigang pampolitika.
  terminology: Ang ‘lupa,’ ‘kampo,’ ‘punit ang kanyang mga damit,’ at ‘yumukod’ ay angkop. Pinananatili ng ‘yumukod’ ang hindi tiyak na saklaw ng וַיִּשְׁתַּחוּ at hindi ipinipilit ang kahulugang pagsamba.
