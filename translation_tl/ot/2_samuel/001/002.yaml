base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: tl
  text: Noong ikatlong araw, narito, may isang lalaking dumating mula sa kampo, mula sa piling ni Saul[a]. Punit ang kanyang mga damit at may lupa sa kanyang ulo[b]. Pagdating niya kay David, bumagsak siya sa lupa at yumukod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa panig ni Saul.” Ipinahihiwatig ng Hebreo ang kaugnayan o pagiging nasa piling ni Saul, hindi kinakailangang siya ay tuwirang isinugo ni Saul.
    reason: lexical_alternative
  - marker: b
    text: Literal na “lupa sa kanyang ulo,” isang kinaugaliang tanda ng dalamhati o pagluluksa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “nagpatirapa.” Ang pandiwa ay maaaring tumukoy sa malalim na pagyuko o pagpapatirapa bilang paggalang, pagpapasakop, o pagpupugay, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Nang ikatlong araw
  rationale: Likas na salin ng panandang temporal na tumutukoy sa ikatlong araw sa pagkakasunod ng salaysay.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang masiglang paghaharap ng bagong tagpo nang hindi idinaragdag ang di-tahasang diwang 'bigla.'
- source_word: מִן־הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: mula sa kampo, mula sa panig ni Saul
  rationale: Ang מֵעִם ay nagpapahiwatig ng kaugnayan o pagiging nasa piling/panig ni Saul, hindi kinakailangang isinugo mismo ni Saul.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: Punit ang kanyang mga damit
  rationale: Tuwiran at natural na paglalarawan sa kalagayan ng kanyang kasuotan bilang tanda ng pagdadalamhati.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: may lupa sa kanyang ulo
  rationale: Ang אֲדָמָה ay literal na lupa o ground; pinananatili ng salin ang konkretong larawan at hindi ito awtomatikong pinapalitan ng 'abo' o 'alikabok.'
- source_word: וַיִּפֹּל אַרְצָה
  choice: nagpatirapa siya sa lupa
  rationale: Ipinahahayag ang kusang pagbagsak o pagyuko nang nakadapa sa lupa sa paraang natural sa Filipino.
- source_word: וַיִּשְׁתָּחוּ
  choice: yumukod
  rationale: Sinasaklaw nito ang kilos ng malalim na paggalang o pagpapasakop nang hindi agad ipinakahulugang pagsamba.
theological_decisions:
- issue: Kung ang וַיִּשְׁתָּחוּ ay nangangahulugang pagsamba o paggalang sa tao
  choice: yumukod
  alternative: sumamba / nagbigay-galang
  rationale: Sa konteksto, si David ang nilalapitan, at maaaring tumukoy ang pandiwa sa pagpapatirapa bilang paggalang o pagpapasakop. Iniiwasan ng 'yumukod' ang pagpasok ng tiyak na teolohikal na kahulugan na hindi hinihingi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maiikli at malinaw na pangungusap upang maging natural ang salaysay, habang pinananatili ang masiglang “narito” at ang konkretong mga larawan ng punit na damit, lupa sa ulo, at pagpapatirapa.
