  text: הַ/צְּבִי֙ יִשְׂרָאֵ֔ל עַל בָּמוֹתֶ֖י/ךָ חָלָ֑ל אֵ֖יךְ נָפְל֥וּ גִבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: tl
  text: Ang iyong karangalan[a], O Israel, ay napatay sa iyong matataas na dako[b]! Paanong nabuwal ang mga makapangyarihan!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong צְבִי ay maaari ring isaling “kagandahan” o “karilagan”; itinuturing naman ito ng ilan na mas kongkretong “gasela.”
    reason: lexical_alternative
  - marker: b
    text: O “sa iyong mga kataasan.” Topograpiko ang diwa rito; hindi kinakailangang tumukoy ito sa mga mataas na pook-sambahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: ang iyong karangalan
  rationale: Ang צְבִי ay maaaring tumukoy sa kagandahan, karilagan, o karangalan, at maaari ring mangahulugang gasela. Sa panaghoy para kina Saul at Jonatan, ang matalinghagang “karangalan” ay natural na tumutukoy sa ipinagmamalaki ng Israel; ipinahihiwatig ng konteksto at ng kasunod na hulaping “iyong” na tuwirang kinakausap ang Israel.
- source_word: יִשְׂרָאֵל
  choice: O Israel
  rationale: Pinananatili ang pangalang Israel at ginagamit ang “O” upang malinaw na maipahayag ang tuwirang pagtawag sa isang marangal na panaghoy.
- source_word: עַל בָּמוֹתֶיךָ
  choice: sa iyong matataas na dako
  rationale: Pinananatili nito ang topograpikong diwa ng בָּמוֹת bilang mga kataasan, nang hindi agad ipinahihiwatig na mga pook-sambahan ang tinutukoy.
- source_word: חָלָל
  choice: napatay
  rationale: Tumutukoy ito sa isang taong napatay o nasawi sa marahas na paraan. Ang “napatay” ay tuwiran at natural sa Filipino.
- source_word: אֵיךְ נָפְלוּ
  choice: Paanong nabuwal
  rationale: Ang “Paanong” ay nagpapanatili sa pabulalas na himig ng panaghoy, at ang “nabuwal” ay angkop na makatang paglalarawan sa pagkamatay sa labanan.
- source_word: גִבּוֹרִים
  choice: ang mga makapangyarihan
  rationale: Malawak ang saklaw ng גִבּוֹרִים—mga makapangyarihan, mandirigma, o bayani. Pinananatili ng “mga makapangyarihan” ang lawak at ang paulit-ulit na pormula ng panaghoy.
