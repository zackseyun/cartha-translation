translation_notes:
  register: Makabago ngunit marangal na Filipino, na may himig ng panaghoy. Ginamit ang “matataas na dako” upang mapanatili ang makatang topograpiya at ang “nabuwal” upang maipahayag ang refrain nang natural at taimtim.
