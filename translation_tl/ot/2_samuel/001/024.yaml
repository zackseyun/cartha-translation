base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: tl
  text: 'Mga anak na babae ng Israel, tangisan ninyo si Saul,

    na nagkaloob sa inyo ng matingkad na pulang damit na may mga luho,[a]

    na naglagay ng mga palamuting ginto[b] sa inyong mga damit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na may mga karangyaan,” “na may mariringal na palamuti,” o “na may mga palamuti.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga alahas na ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: Mga anak na babae ng Israel
  rationale: Pinananatili ang tuwirang bokatibo at makatang idyomang Hebreo; mas tiyak ito kaysa sa pinapantay na “mga babae ng Israel.”
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: tangisan ninyo si Saul
  rationale: Sa konteksto ng awit-panaghoy, ang pandiwa at אֶל ay tumutukoy sa pagdadalamhati para kay Saul. Likas sa Filipino ang “tangisan” at malinaw na higit ito sa karaniwang pag-iyak.
- source_word: הַמַּלְבִּשְׁכֶם
  choice: na nagbihis sa inyo
  rationale: Ang artikulo at partisipyong tumutukoy kay Saul ay natural na isinasaad bilang sugnay na pang-uri sa Filipino.
- source_word: שָׁנִי
  choice: matingkad na pula
  rationale: Tumutukoy sa scarlet, isang mamahaling telang tinina o kulay nito. Ang parirala ay madaling maunawaan sa modernong Filipino at hindi nagpapanggap na may iisang eksaktong katumbas na katawagan sa kulay.
- source_word: עִם עֲדָנִים
  choice: kalakip ang mariringal na kasuotan
  rationale: Ang bihirang עֲדָנִים ay maaaring mangahulugang mga luho, karangyaan, o mariringal na palamuti. Ang salin ay umaangkop sa pagdadamit ngunit minamarkahan sa talababa ang tunay na leksikal na kalabuan.
- source_word: הַמַּעֲלֶה
  choice: na naglagay
  rationale: Sa kontekstong ito, ang partisipyong mula sa עלה ay may idyomatikong diwang maglagay o magsuot sa ibabaw.
- source_word: עֲדִי זָהָב
  choice: mga palamuting ginto
  rationale: Pinananatili ang malawak na kahulugan ng עֲדִי bilang palamuti; maaari rin itong tumukoy nang mas tiyak sa alahas.
- source_word: עַל לְבוּשְׁכֶן
  choice: sa inyong mga damit
  rationale: Direkta at natural na salin ng pariralang nagsasaad kung saan inilagay ang mga palamuti.
