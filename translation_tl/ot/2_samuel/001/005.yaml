  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Pinanatili ang tuwirang tanong at ang pagkakakilanlan kay Jonatan bilang anak ni Saul; walang idinagdag na paliwanag o denominasyonal na pagbasa.
