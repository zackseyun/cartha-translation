  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: tl
  text: Sinabi ni David sa binatang nagbalita sa kanya, “Paano mo nalaman na patay na si Saul at ang anak niyang si Jonatan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Sinabi” sa halip na laging isalin ang pang-ugnay bilang “At.”
- source_word: הַנַּעַר
  choice: binata
  rationale: Ang נַעַר ay tumutukoy rito sa isang kabataang lalaki na may kakayahang mag-ulat tungkol sa labanan; mas angkop ang “binata” kaysa “bata” o “utusan.”
- source_word: הַמַּגִּיד לוֹ
  choice: nagbalita sa kanya
  rationale: Ang participle ay nagpapakilala sa binata bilang nag-uulat kay David. Ang “nagbalita sa kanya” ay malinaw at natural sa konteksto.
- source_word: אֵיךְ
  choice: Paano
  rationale: Ipinapakilala nito ang tanong tungkol sa batayan o paraan ng pagkakaalam ng binata.
- source_word: יָדַעְתָּ
  choice: mo nalaman
  rationale: Bagaman perfect ang anyong Hebreo, ang “nalaman” ay natural na Tagalog para sa pagkakaalam na nakuha mula sa naunang pangyayari o ulat.
- source_word: כִּי
  choice: na
  rationale: 'Ipinapakilala ng כִּי ang nilalaman ng nalaman: na patay na sina Saul at Jonatan.'
- source_word: מֵת
  choice: patay na
  rationale: Isahan ang pandiwang Hebreo kahit tambalan ang simuno. Sa Tagalog, ang “patay na” ay natural na nagsasaad ng kalagayang bunga ng pagkamatay at maaaring iukol sa dalawang tao.
- source_word: בְּנוֹ
  choice: ang anak niyang
  rationale: Tumutukoy ang hulaping panghalip kay Saul. Ang ayos na “ang anak niyang si Jonatan” ay likas sa Tagalog at malinaw na ipinapakitang anak ni Saul si Jonatan.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: si Saul at ang anak niyang si Jonatan
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan, at inayos ang parirala upang maging malinaw ang kaugnayan ni Jonatan kay Saul.
