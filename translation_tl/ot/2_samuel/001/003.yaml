  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: tl
  text: Sinabi ni David sa kanya, “Saan ka nanggaling?” Sinabi niya sa kanya, “Nakatakas ako mula sa kampo ng Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: Saan
  rationale: Ang parirala ay nagtatanong tungkol sa pinanggalingan. Sa makabagong Tagalog, likas na ipinahahayag ito sa buong tanong na “Saan ka nanggaling?”
- source_word: תָּבוֹא
  choice: ka nanggaling
  rationale: Bagaman imperfect ang anyo, tumutukoy ito rito sa pagdating mula sa isang pinanggalingan. Ang “nanggaling” ang natural na Tagalog sa kontekstong ito.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: mula sa kampo ng Israel
  rationale: Pinananatili ng “kampo” ang militar na tagpuan at ng “ng Israel” ang ugnayang nasa Hebreo.
- source_word: נִמְלָטְתִּי
  choice: Nakatakas ako
  rationale: Ipinahahayag ng Niphal ng מלט ang matagumpay na pagtakas mula sa panganib; tuwiran at natural ang “nakatakas.”
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi ... Sumagot
  rationale: Ang unang “sinabi” ay malapit sa inuulit na pandiwang Hebreo. Sa ikalawang bahagi, nililinaw ng “sumagot” ang natural na takbo ng usapan nang hindi binabago ang nilalaman.
- source_word: דָּוִד
  choice: David
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong saling Tagalog.
