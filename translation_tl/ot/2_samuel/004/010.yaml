  to: Nang may isang nagsabi sa akin[a], ‘Tingnan mo, patay na si Saul,’ at sa sarili niyang palagay ay tagapagdala siya ng mabuting balita, sinunggaban ko siya at pinatay sa Ziklag—iyon ang gantimpalang ibinigay ko sa kanya dahil sa kanyang balita.[b]
