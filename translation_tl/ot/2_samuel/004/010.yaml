base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: tl
  text: Nang may isang nagsabi sa akin[a], ‘Tingnan mo, patay na si Saul,’ at sa sarili niyang palagay ay tagapagdala siya ng mabuting balita, sinunggaban ko siya at pinatay sa Ziklag—iyon ang gantimpalang ibinigay ko sa kanya dahil sa kanyang balita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “ang nagsabi sa akin, ‘Narito, patay na si Saul,’ habang sa sarili niyang palagay ay para siyang tagapagdala ng mabuting balita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Eliptikal at malamang na mapanuya ang huling sugnay sa Hebreo: ang ibig sabihin ni David ay pagpatay, hindi bayad, ang tanging “gantimpalang” natanggap ng mensahero sa pagbabalita tungkol sa pagkamatay ni Saul.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Nang
  rationale: Ipinakikilala rito ang isang tiyak na pangyayaring sumusuporta sa sinabi ni David; natural na naihahatid ng “Nang” ang temporal at pangyayaring diwa.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: may isang nagsabi sa akin
  rationale: Ang may artikulong participle ay substantibo, “ang nagsabi sa akin.” Ang “may isang nagsabi sa akin” ay natural sa modernong Tagalog; hindi na kailangang isalin nang hiwalay ang לֵאמֹר bago ang tuwirang sipi.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: ‘Tingnan mo, patay na si Saul,’
  rationale: Ang הִנֵּה ay pantawag-pansin; malinaw at kasalukuyang katumbas ang “Tingnan mo.” Inihahatid ng “patay na” ang resultative o stative na diwa ng מֵת.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: at inakala niyang mabuting balita ang dala niya
  rationale: Ang literal na “sa sarili niyang mga mata” ay idyomang tumutukoy sa sariling palagay. Pinananatili ng salin ang pananaw ng mensahero at ang diwa ng מְבַשֵּׂר bilang tagapagdala ng mabuting balita.
- source_word: וָאֹחֲזָה בוֹ
  choice: sinunggaban ko siya
  rationale: Ang אָחַז ay paghawak o pagsunggab nang mahigpit. Ang “sinunggaban” ay tuwiran at may angkop na puwersa sa konteksto.
- source_word: וָאֶהְרְגֵהוּ
  choice: at pinatay
  rationale: Tuwirang kahulugan ng pandiwa ang pagpatay; hindi dinaragdagan ng salin ng legal o hudisyal na pahiwatig na wala sa salita mismo.
- source_word: בְּצִקְלָג
  choice: sa Ziklag
  rationale: Karaniwang transliterasyon ng pangalan ng lugar, na may natural na pang-ukol sa Tagalog.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: iyon ang gantimpalang ibinigay ko sa kanya dahil sa kanyang balita
  rationale: Eliptikal at mapanuya ang Hebreong sugnay. Ipinakikita ng “gantimpala” ang bayad na inaasahan ng mensahero, samantalang nililinaw ng konteksto na kamatayan ang aktuwal niyang natanggap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Ginamit ang “Tingnan mo” bilang likas na pantawag-pansin, “sinunggaban” para sa marahas na pagdakip, at “gantimpala” upang mapanatili ang ironiya ng eliptikal na pangwakas na sugnay. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
