  text: וַ/יַּ֨עַן דָּוִ֜ד אֶת רֵכָ֣ב וְ/אֶת בַּעֲנָ֣ה אָחִ֗י/ו בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֵֽרֹתִ֖י וַ/יֹּ֣אמֶר לָ/הֶ֑ם חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: tl
  text: 'Sumagot si David kina Rekab at Baana, na magkapatid, mga anak ni Rimon na taga-Beerot. Sinabi niya sa kanila, “Buháy si Yahweh,[a] na tumubos sa buhay ko mula sa lahat ng kagipitan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay ang personal na pangalan ng Diyos sa Hebreo (YHWH), na tradisyonal ding isinasalin na “PANGINOON.”
    reason: Nililinaw ang banal na pangalan at ang karaniwang alternatibong salin nito.
lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Karaniwang pormulang pasalaysay ito para sa tugon sa isang naunang pangyayari o pananalita.
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: kay Rekab at sa kapatid nitong si Baana
  rationale: Pinananatili ang isahang אָחִיו at nililinaw na si Baana ang kapatid ni Rekab.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: mga anak ni Rimon na taga-Beerot
  rationale: Likas sa modernong Filipino ang “taga-Beerot” para sa gentiliko, habang pinananatili ang kanilang ama at pinagmulan.
- source_word: חַי יְהוָה
  choice: Isinusumpa ko, kung paanong buháy si Yahweh
  rationale: Ipinahahayag nito ang puwersa ng Hebreong pormula ng panunumpa nang malinaw at marangal sa Filipino; ang “buháy” ay may tuldik upang hindi mabasa bilang “bahay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: פָּדָה
  choice: tumubos
  rationale: Pinananatili ang diwa ng pagtubos o pagliligtas na may halaga, sa halip na gawing payak lamang na “nagligtas.”
- source_word: נַפְשִׁי
  choice: buhay ko
  rationale: Sa konteksto, tumutukoy ang נֶפֶשׁ sa buhay o sarili ni David na iniligtas mula sa panganib, hindi lamang sa di-materyal na kaluluwa.
- source_word: מִכָּל־צָרָה
  choice: mula sa bawat kagipitan
  rationale: Ang “kagipitan” ay natural na katumbas ng צרה, at ipinananatili ng “bawat” ang malawak na saklaw ng כָּל.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa pangunahing teksto, habang ipinapaliwanag sa talababa ang tradisyonal na anyo.
- issue: Diwa ng pandiwang פָּדָה
  choice: tumubos
  alternative: nagligtas
  rationale: Pinananatili ng “tumubos” ang leksikal at teolohikal na bigat ng pagpapalaya o pagliligtas, nang hindi nagdaragdag ng partikular na mekanismo ng pagtubos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “taga-Beerot” sa halip na isang artipisyal na gentiliko. Pinanatili ang tutuldok sa hulihan dahil nagpapatuloy sa susunod na talata ang panunumpa at pangungusap ni David.
