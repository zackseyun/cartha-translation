base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: tl
  text: Lalo pa nga, ngayong pinatay ng mga masasamang lalaki ang isang taong matuwid sa sarili niyang bahay, sa kanyang higaan! Hindi ko ba ngayon kayo pananagutin sa kanyang dugo[a] at aalisin kayo sa lupain[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hihingin ko ang kanyang dugo mula sa inyong kamay,” isang idyomang Hebreo na nangangahulugang pananagutin kayo sa pagdanak ng kanyang dugo.
    reason: lexical_alternative
  - marker: b
    text: Ang “aalisin kayo sa lupain” ay tumutukoy sa hudisyal na pagpuksa sa mga pumatay, hindi lamang sa ritwal na paglilinis.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Lalo pa nga ngayon, gayong
  rationale: Ipinahahayag nito ang pangangatwirang mula sa mas magaang kaso sa talata 10 tungo sa mas mabigat na kasong ito. Natural sa Filipino ang “lalo pa nga” para sa diin ng a fortiori.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: masasamang tao
  rationale: Tuwirang ipinapahayag ang moral na paghatol ng רְשָׁעִים sa malinaw at makabagong Filipino.
- source_word: הָרְגוּ
  choice: pinatay
  rationale: Karaniwang pandiwa ito para sa pagpatay. Bagaman pagpaslang ang ipinahihiwatig ng konteksto, hindi iyon tahasang isiningit sa mas pangkalahatang pandiwang Hebreo.
- source_word: אִישׁ צַדִּיק
  choice: isang taong matuwid
  rationale: Pinananatili ang karaniwang kahulugan ng צַדִּיק at ang moral-legal na pagtutulad, sa halip na paliitin ito sa “taong walang sala.”
- source_word: בְּבֵיתוֹ
  choice: sa sarili niyang bahay
  rationale: Malinaw na ipinakikita ang panlaping paari at ang tindi ng pagpatay sa loob ng sariling tahanan ng biktima.
- source_word: עַל מִשְׁכָּבוֹ
  choice: sa ibabaw ng kanyang higaan
  rationale: Malapit sa literal na larawan ng Hebreo at malinaw na tumutukoy sa lugar kung saan nakahiga ang biktima.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: Hindi ko ba kayo pananagutin sa kanyang dugo
  rationale: Natural na inililipat sa Filipino ang legal na idyomang “hingin ang dugo mula sa inyong kamay,” habang pinananatili ang mahalagang larawang “kanyang dugo.”
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: at aalisin kayo sa lupain
  rationale: Ipinahahayag ang hudisyal na pag-aalis na tinutukoy ng pandiwa nang hindi ginagawang ritwal na paglilinis lamang; nililinaw ng konteksto ng kasunod na talata na parusang kamatayan ang isasagawa.
theological_decisions:
- issue: Kung isasalin ang idyomang legal bilang personal na paghihiganti o bilang pananagutan sa pagdanak ng dugo
  choice: pananagutin sa kanyang dugo
  alternative: ipaghihiganti ang kanyang dugo sa inyo
  rationale: Ang Hebreo ay nakatuon sa legal na pagsingil ng pananagutan, hindi lamang sa personal na paghihiganti. Pinananatili ng salin ang salitang “dugo” at ang bigat ng idyomang biblikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tao” sa halip na eksklusibong “lalaki” kung hindi kailangan sa daloy, habang ang konteksto ay malinaw na tumutukoy sa mga lalaking pumatay. Ang padamdam pagkatapos ng unang pangungusap ay naghahatid ng retorikal na tindi bago ang tanong ni David.
