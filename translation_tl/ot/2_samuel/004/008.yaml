  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: tl
  text: Dinala nila ang ulo ni Isboset kay David sa Hebron at sinabi sa hari, “Narito ang ulo ni Isboset, na anak ni Saul, na iyong kaaway at naghangad na kitlin ang iyong buhay. Ngayon, ipinagkaloob ni Yahweh sa panginoon kong hari ang paghihiganti[a] laban kay Saul at sa kanyang mga supling.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga paghihiganti” (maramihan), na maaaring magpahiwatig ng matinding paghihiganti o mga gawa ng paghihiganti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ אֶת רֹאשׁ אִישׁ בֹּשֶׁת
  choice: Dinala nila ang ulo ni Isboset
  rationale: Pinananatili ang tuwirang kahulugan ng רֹאשׁ bilang pisikal na ulo at ang anyong Masoretiko ng pangalan bilang Isboset.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: kay David sa Hebron
  rationale: Likas na ayos sa modernong Tagalog para sa taong pinagdalhan at sa lugar.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang puwersa ng pormulang panturo at presentasyon nang hindi gumagamit ng lipas na pananalita.
- source_word: אֹיִבְךָ
  choice: ang iyong kaaway
  rationale: Tuwiran at natural na katumbas ng pangngalang Hebreo.
- source_word: אֲשֶׁר בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: na naghangad na kitlin ang iyong buhay
  rationale: Ipinahahayag nang malinaw ang idyomang Hebreo na tumutukoy sa paghahangad na patayin ang isang tao, habang pinananatili ang larawan ng ‘buhay.’
- source_word: וַיִּתֵּן יְהוָה ... נְקָמוֹת
  choice: ipinaghiganti ni Yahweh
  rationale: Natural na pandiwang Tagalog para sa pagkakaloob o pagsasagawa ng paghihiganti sa kapakanan ng hari; ang pangalang banal ay tinumbasan bilang Yahweh.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Pinananatili ang magalang na katawagang panghukuman at ang unang panauhang pang-angkin.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: kay Saul at sa kanyang mga supling
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga inapo o supling; ‘mga supling’ ay malinaw at dignidadong modernong Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ang personal na pangalan sa transliterasyong karaniwang kinikilalang Yahweh.
- issue: Kung dapat bang ipahiwatig na mali ang pag-aangkin ng mga mamamaslang tungkol sa paghihiganti ng Diyos
  choice: Pinanatili bilang tuwirang pahayag nila, nang walang dagdag na paghatol
  alternative: Lagyan ng pananalitang ‘akala nila’ o ‘diumano’
  rationale: Iniuulat ng Hebreo ang kanilang sinabi nang walang kwalipikasyon sa talatang ito. Ang salin ay hindi dapat maunang magpasya sa teolohikal na pagtatasa na ipinakikita ng kasunod na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘Isboset’ bilang karaniwang anyong Tagalog ng pangalang Masoretiko at iniwasan ang labis na literal ngunit di-likas na ‘hinanap ang iyong kaluluwa.’ Inilipat ang talababa sa mismong pariralang tungkol sa paghihiganti, na siyang tinutukoy nito.
