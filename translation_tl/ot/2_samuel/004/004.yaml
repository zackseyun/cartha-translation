  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: tl
  text: Si Jonatan na anak ni Saul ay may anak na lalaki na may kapansanan sa mga paa.[a] Limang taong gulang siya nang dumating mula sa Jezreel ang balita tungkol kina Saul at Jonatan. Binuhat siya ng babaeng tagapag-alaga niya at tumakas ang babae. Habang nagmamadali siyang tumakas, nahulog ang bata at naging pilay. Mefiboset ang pangalan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pilay sa magkabilang paa.” Literal na tumutukoy ang pariralang Hebreo sa pagiging naapektuhan sa mga paa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: may kapansanan sa mga paa
  rationale: Likas at magalang na modernong Filipino na nagpapanatili sa diwa ng taong napinsala o may kapansanan sa mga paa, nang hindi ginagawang tahasang sanhi ang kasunod na pagkahulog.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: limang taong gulang
  rationale: Karaniwang idyomatikong paraan sa Filipino ng pagsasaad ng edad.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: nang dumating ... ang balita tungkol kina Saul at Jonatan
  rationale: Inilalahad ang temporal na gamit ng infinitive construct at hindi dinaragdagan ang nilalaman ng balita, gaya ng pagkamatay o pagkatalo.
- source_word: מִיִּזְרְעֶאל
  choice: mula sa Jezreel
  rationale: Tuwirang ipinahahayag ang pinanggalingan ng balita.
- source_word: אֹמַנְתּוֹ
  choice: babaeng tagapag-alaga sa kaniya
  rationale: Ipinakikita ang babaeng nag-aaruga at nagpapalaki sa bata; mas malinaw sa kasalukuyang Filipino kaysa sa salitang maaaring mapagkamalang nars sa ospital.
- source_word: וַתִּשָּׂאֵהוּ
  choice: binuhat siya
  rationale: Ang pandiwa ay nangangahulugang iangat o dalhin; ang 'binuhat' ay natural sa agarang pagtakas kasama ang bata.
- source_word: וַתָּנֹס ... לָנוּס
  choice: tumakas ... tumakas
  rationale: Pinananatili ang pag-uulit ng ugat at ang diwa ng agarang pagtakas.
- source_word: בְּחָפְזָהּ
  choice: habang nagmamadali
  rationale: Natural na inilalahad ang kasabay na kalagayan ng matinding pagmamadali.
- source_word: וַיִּפֹּל
  choice: nahulog ang bata
  rationale: Nililinaw ang panlalaking isahang simuno ng Hebreo at iniiwasan ang kalituhan sa babaeng tagapag-alaga.
- source_word: וַיִּפָּסֵחַ
  choice: naging pilay
  rationale: 'Pinananatili ang inceptive o resultative na diwa: naging pilay siya matapos mahulog.'
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Angkop na transliterasyong Filipino ng pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at pasalaysay. Ginamit ang “babaeng tagapag-alaga” sa halip na “nars” o “yaya” upang maging malinaw ang papel at kasarian sa Hebreo. Inulit ang “ang bata” upang hindi mapagkamalang ang tagapag-alaga ang nahulog.
