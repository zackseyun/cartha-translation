revisions:
- from: May anak na lalaki si Jonatan na anak ni Saul, at may kapansanan ito sa mga paa.[a] Limang taong gulang ang bata nang dumating mula sa Jezreel ang balita tungkol kina Saul at Jonatan. Binuhat siya ng babaeng tagapag-alaga sa kaniya at tumakas. Habang nagmamadali itong tumakas, nahulog ang bata at naging pilay. Mefiboset ang pangalan niya.
  to: Si Jonatan na anak ni Saul ay may anak na lalaki na may kapansanan sa mga paa.[a] Limang taong gulang siya nang dumating mula sa Jezreel ang balita tungkol kina Saul at Jonatan. Binuhat siya ng babaeng tagapag-alaga niya at tumakas ang babae. Habang nagmamadali siyang tumakas, nahulog ang bata at naging pilay. Mefiboset ang pangalan niya.
  rationale: Pinanatili ng rebisyon ang lahat ng impormasyon at ang maingat na di-pagtukoy sa nilalaman ng balita. Pinahusay nito ang daloy ng Filipino, nilinaw ang mga sanggunian ng panghalip, at ginawang mas neutral ang paliwanag sa talababa upang hindi magpahiwatig ng sanhi na wala sa Hebreo.
