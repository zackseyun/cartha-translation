    rationale: Ang Hebreong דֶּרֶךְ הָעֲרָבָה ay ‘sa pamamagitan ng/sa daan ng Araba,’ hindi ‘patungo sa Araba.’
  - severity: low
    issue: Hindi sapat ang katiyakan ng paglalarawan sa Araba sa talababa.
    rationale: Mas maingat na ilarawan ang Araba bilang isang rehiyon ng lambak o kapatagan sa Jordan Rift Valley kaysa sabihing kinabibilangan nito ang Libis ng Jordan.
