base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: tl
  text: Pumasok sila sa bahay habang nakahiga siya sa kaniyang kama, sa silid na tinutulugan niya.[a] Sinaktan nila siya at pinatay. Pagkatapos, inalis nila ang kaniyang ulo,[b] kinuha iyon, at magdamag na naglakbay sila sa daan sa Araba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniyang silid-tulugan.”
    reason: lexical_alternative
  - marker: b
    text: O “pinugot nila ang kaniyang ulo.” Mas literal na “inalis nila ang kaniyang ulo.”
    reason: lexical_alternative
  - marker: c
    text: Ang Araba ay rehiyon ng lambak o kapatagan sa Rift Valley ng Jordan; pangalang heograpiko ang ginamit sa Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: Pumasok sila sa bahay
  rationale: Likas na ipinahihiwatig ng בוא kasama ng הַבַּיִת ang pagpasok sa bahay; malinaw at natural ang salin.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: habang nakahiga siya sa kaniyang kama
  rationale: Ipinapakita ng sugnay ang kalagayan niya nang pumasok sila; pinananatili ng “habang” ang sirkumstansiyal na diwa.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: sa silid na tinutulugan niya
  rationale: Mas natural ito sa modernong Filipino at malapit sa literal na “silid ng kaniyang paghiga/pagtulog,” nang hindi ipinapalagay ang modernong konsepto ng kuwartong-tulugan.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: Sinaktan nila siya at pinatay
  rationale: 'Pinananatiling magkahiwalay ang dalawang pandiwa: ang paghampas/pananakit at ang tahasang pagpatay.'
- source_word: וַיָּסִירוּ אֶת־רֹאשׁוֹ
  choice: inalis nila ang kaniyang ulo
  rationale: Ang Hiphil ng סור ay “mag-alis.” Hindi tahasang tinutukoy ng pandiwa ang paraan, bagaman ipinahihiwatig ng konteksto ang pagpugot.
- source_word: וַיִּקְחוּ אֶת־רֹאשׁוֹ
  choice: kinuha iyon
  rationale: Isinasalin ang hiwalay na kilos ng לקח bilang pagkuha/pagdadala sa ulo. Ginamit ang “iyon” upang maging natural sa Filipino habang malinaw ang tinutukoy.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: naglakbay sa daang patungo sa Araba
  rationale: Ipinahahayag ng דֶּרֶךְ ang ruta o daan, at pinananatili ang Araba bilang pangalang heograpiko.
- source_word: כָּל־הַלָּיְלָה
  choice: magdamag
  rationale: Maikli at natural na katumbas sa Filipino ng “buong gabi.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Iniwasan ang arkaikong “sinaktan hanggang mamatay” at pinanatiling magkahiwalay ang dalawang kilos sa Hebreo. Ginamit ang “Araba” bilang natural na transliterasyong Filipino ng pangalang heograpiko.
