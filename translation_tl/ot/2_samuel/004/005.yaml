base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: tl
  text: Umalis ang mga anak ni Rimon na taga-Beerot, sina Rekab[a] at Baana, at dumating sila sa bahay ni Isboset sa kainitan ng araw, habang nakahiga si Isboset para magpahinga sa tanghali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Rekab” ay tradisyonal ding isinusulat na “Rechab.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang paghiga sa tanghali”; ibig sabihin, pamamahinga sa kalagitnaan ng araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: mga anak ni Rimon na taga-Beerot
  rationale: Pinananatili ang likas na kahulugang pampamilya ng בְּנֵי at inilalarawan ang pinagmulan ni Rimon sa natural na Tagalog.
- source_word: רֵכָב וּבַעֲנָה
  choice: sina Rekab at Baana
  rationale: Malapit na transliterasyon sa mga pangalang Hebreo, na nilagyan ng “sina” ayon sa natural na gamit sa Tagalog.
- source_word: וַיֵּלְכוּ
  choice: Umalis
  rationale: Ipinahahayag ang pagsisimula ng kanilang paglalakbay; mas natural dito kaysa sa payak na “pumunta” bago ang kasunod na pagdating.
- source_word: וַיָּבֹאוּ
  choice: dumating sila
  rationale: Sa pariralang אֶל בֵּית, malinaw na tumutukoy sa pagdating sa bahay at hindi kinakailangang sa pagpasok dito.
- source_word: כְּחֹם הַיּוֹם
  choice: sa kainitan ng araw
  rationale: Malapit sa Hebreong idyoma at hindi nililimitahan nang tahasan sa eksaktong oras ng tanghali.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: bahay ni Isboset
  rationale: Natural na Tagalog para sa Hebreong construct chain; tinutumbasan sa transliterasyon ang personal na pangalan.
- source_word: וְהוּא שֹׁכֵב
  choice: habang nakahiga ito
  rationale: Ipinakikita ang kasabay na kalagayan ni Isboset nang dumating ang mga lalaki. Ang “ito” ay malinaw ang tinutukoy at umiiwas sa sunod-sunod na “siya/sila.”
- source_word: אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: para sa kanyang pamamahinga sa tanghali
  rationale: Natural at marangal na salin ng literal na “paghiga ng tanghali,” nang hindi ipinapalagay na tiyak na natutulog siya.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural at marangal ang himig. Pinanatili ang payak na takbo ng salaysay at ang pagkakaiba ng pag-alis at pagdating. Hindi ginamit ang “umidlip” o “natutulog” sapagkat mas tiyak ang mga iyon kaysa sa Hebreong nagsasabing nakahiga siya para sa pamamahinga.
