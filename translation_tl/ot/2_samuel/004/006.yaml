translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Iniwasan ang makalumang “narito” at ang interpretibong “kunwari,” habang pinanatili sa talababa ang tradisyonal na pagbasa sa lokasyon ng sugat.
