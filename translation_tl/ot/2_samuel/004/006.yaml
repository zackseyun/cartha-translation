base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: tl
  text: At nakapasok sila hanggang sa loob ng bahay habang kumukuha ng trigo, at sinaktan nila siya sa tiyan.[a] Pagkatapos, nakatakas si Rekab at ang kapatid niyang si Baana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “sa ilalim ng ikalimang tadyang.” Malamang na mas pangkalahatang tumutukoy ang pananalitang Hebreo sa tiyan o sa bahagi ng tiyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה בָּאוּ
  choice: At nakapasok sila
  rationale: Ipinahahayag ng parirala ang pagdating o pagpasok nila sa susunod na tagpo. Likas sa modernong Tagalog ang “nakapasok sila” at malinaw nitong inuugnay ang kilos sa bahay nang hindi gumagamit ng makalumang katumbas ng “narito.”
- source_word: עַד תּוֹךְ הַבַּיִת
  choice: hanggang sa loob ng bahay
  rationale: Pinananatili ng “hanggang” ang puwersa ng עַד at ipinahihiwatig ng “sa loob” na nakarating sila sa interior ng bahay, hindi lamang sa pasukan.
- source_word: לֹקְחֵי חִטִּים
  choice: habang kumukuha ng trigo
  rationale: Ang participial phrase ay literal na tumutukoy sa pagkuha ng trigo. Hindi idinagdag ang “kunwari” o “nagkukunwaring,” sapagkat bagaman maaaring iyon ang ipinahihiwatig ng konteksto, hindi ito tahasang sinabi ng Hebreo.
- source_word: וַיַּכֻּהוּ אֶל הַחֹמֶשׁ
  choice: sinaksak nila siya sa tiyan
  rationale: Ang נכה ay pangkalahatang “humampas/sumugat,” ngunit sa salaysay ng pagpaslang, ang “sinaksak” ang malinaw at likas na Tagalog para sa nakamamatay na pag-atake sa bahaging tinutukoy ng חֹמֶשׁ. Ang “tiyan” ay mas madaling maunawaan kaysa sa tradisyonal ngunit malamang na maling “ikalimang tadyang.”
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו נִמְלָטוּ
  choice: Pagkatapos, nakatakas si Rekab at ang kapatid niyang si Baana
  rationale: Likas na inilalahad ng “Pagkatapos” ang pagkakasunod ng pangyayari. Ang Niphal נִמְלָטוּ ay wastong ipinapahayag ng “nakatakas,” at pinananatili ang ugnayang magkapatid.
