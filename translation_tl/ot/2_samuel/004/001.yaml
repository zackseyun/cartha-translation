base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: tl
  text: Nang marinig ng anak ni Saul na namatay si Abner sa Hebron, nanghina ang kanyang mga kamay[a], at nabagabag ang buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nanghina ang kanyang mga kamay,” isang idyoma para sa pagkawala ng lakas o tapang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: anak ni Saul
  rationale: Pinananatili ang di-tuwirang pagkakakilanlan sa tauhan at hindi ipinapasok ang pangalang Isboset, na wala sa talata.
- source_word: כִּי מֵת אַבְנֵר
  choice: na namatay si Abner
  rationale: Ang כִּי ay nagpapakilala sa nilalaman ng kanyang narinig; natural sa Tagalog ang sugnay na may “na.” Sapat ang aspektong naganap na “namatay” upang ipahiwatig na nauna ang pagkamatay sa pagkarinig.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Karaniwang panandang panlunan sa modernong Tagalog.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: nanghina ang kanyang mga kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo tungkol sa panghihina ng mga kamay, na nagpapahiwatig ng pagkawala ng lakas o tapang.
- source_word: כָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong pambansang katawagan sa halip na gawing tahasang bawat indibidwal na Israelita.
- source_word: נִבְהָלוּ
  choice: nabagabag
  rationale: Ipinapahayag ang pagkagulo at matinding pagkabalisa nang hindi labis na tinutukoy kung ito ay sindak, takot, o pagkasiphayo lamang.
