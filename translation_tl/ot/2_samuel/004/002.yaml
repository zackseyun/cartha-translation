revisions:
- from: May dalawang lalaking pinuno ng mga pangkat na mananalakay ang anak ni Saul. Ang pangalan ng isa ay Baana, at ang pangalan ng ikalawa ay Recab. Mga anak sila ni Rimon na taga-Beerot, mula sa mga anak ni Benjamin, sapagkat ang Beerot ay itinuturing ding bahagi ng Benjamin.[a]
  to: Ang anak ni Saul ay may dalawang lalaking pinuno ng mga pangkat na mananalakay. Ang pangalan ng isa ay Baana, at ang pangalan ng pangalawa ay Recab. Mga anak sila ni Rimon na taga-Beerot, mula sa mga anak ni Benjamin, sapagkat ang Beerot ay kabilang din sa Benjamin.[a]
  rationale: Inayos ang daloy sa modernong Filipino at ginawang mas idiomatiko ang huling sugnay, habang pinanatili ang saklaw ng Hebreong pagpapahayag tungkol sa pagkakabilang ng Beerot sa Benjamin. Nananatili ang footnote marker sa mismong sugnay na tinutukoy nito.
