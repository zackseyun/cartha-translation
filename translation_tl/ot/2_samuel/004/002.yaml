translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pangkat na mananalakay” upang mapanatili ang di-regular na katangian ng גְדוּדִים, at “taga-Beerot” bilang likas na katumbas ng gentilic. Inilipat ang marker [a] sa dulo ng pariralang tinutukoy nito.
