  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: tl
  text: Ang anak ni Saul ay may dalawang lalaking pinuno ng mga pangkat na mananalakay. Ang pangalan ng isa ay Baana, at ang pangalan ng pangalawa ay Recab. Mga anak sila ni Rimon na taga-Beerot, mula sa mga anak ni Benjamin, sapagkat ang Beerot ay kabilang din sa Benjamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinibilang na sakop ng Benjamin.”
    reason: Pinananatili ang leksikal na alternatibo para sa תֵּחָשֵׁב עַל בִּנְיָמִן; ang “sakop” ay maaaring magbigay-diin sa teritoryal na pagkakabilang, samantalang ang pangunahing teksto ay pinananatiling mas malawak.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dalawang lalaki
  rationale: Tuwirang tumutukoy ang panlalaking pangmaramihang parirala sa dalawang lalaking indibidwal.
- source_word: שָׂרֵי גְדוּדִים
  choice: mga pinuno ng mga pangkat na mananalakay
  rationale: Ang שָׂרֵי ay mga pinuno o kumander, at ang גְדוּדִים dito ay mga pangkat na karaniwang nagsasagawa ng pagsalakay, hindi kinakailangang mga regular na yunit ng hukbo.
- source_word: בֶן שָׁאוּל
  choice: ang anak ni Saul
  rationale: Tumutukoy ito sa anak ni Saul na binanggit sa naunang konteksto; pinananatili ang isahang ugnayang pampamilya nang hindi ipinapasok ang pangalan mula sa konteksto.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Ang pangalan ng isa ... at ang pangalan ng ikalawa
  rationale: Pinananatili ang paulit-ulit na pormula ng Hebreo at ang tiyak na kahulugan ng הַשֵּׁנִי bilang 'ikalawa.'
- source_word: בְּנֵי רִמּוֹן
  choice: Mga anak sila ni Rimon
  rationale: Nililinaw sa natural na Tagalog na parehong anak ni Rimon sina Baana at Recab.
- source_word: הַבְּאֶרֹתִי
  choice: na taga-Beerot
  rationale: Ang gentilic ay likas na ipinapahayag sa Tagalog sa pamamagitan ng 'taga-' at pangalan ng lugar.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: mula sa mga anak ni Benjamin
  rationale: Pinananatili ang pantribong wika ng Hebreo at ang ideya ng angkan o salinlahi.
- source_word: כִּי גַּם
  choice: sapagkat ... din
  rationale: Ipinakikilala nito ang paliwanag kung bakit iniuugnay ang mga taga-Beerot sa Benjamin.
- source_word: בְּאֵרוֹת
  choice: Beerot
  rationale: Isinalin-titik ang pangalan ng lugar sa anyong angkop sa pagbasa sa Filipino.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: itinuturing ding bahagi ng Benjamin
  rationale: Ipinahahayag ng Niphal ng חשׁב at ng kasunod na pariralang may עַל ang pagkakabilang o pagkakaugnay ng Beerot sa teritoryo o tribo ng Benjamin.
