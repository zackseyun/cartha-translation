  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: tl
  text: Pagkatapos, nag-utos si David sa kanyang mga tauhan, at pinatay nila ang dalawang lalaki. Pinutol nila ang mga kamay at paa ng mga ito at ibinitin sila sa may tipunan ng tubig[a] sa Hebron. Ngunit kinuha nila ang ulo ni Isboset at inilibing iyon sa libingan ni Abner sa Hebron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa ibabaw ng tipunan ng tubig. Ang Hebreong pang-ukol ay maaari ring unawain nang mas malawak bilang pagtukoy sa lokasyon: “sa may tipunan ng tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד
  choice: Pagkatapos, nag-utos si David
  rationale: Ang waw-consecutive ay nagsusulong sa takbo ng salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” at pinananatili ng “nag-utos” ang diwa ng צוה.
- source_word: הַנְּעָרִים
  choice: sa kanyang mga tauhan
  rationale: Maaaring tumukoy ang נְעָרִים sa mga kabataang lalaki o sa mga tagapaglingkod/tauhan. Sa konteksto, sila ang mga tauhan ni David na nagsagawa ng utos; mas natural at hindi labis na nakatuon sa edad ang “mga tauhan.” Idinagdag ang “kanyang” upang maging malinaw sa Tagalog ang kaugnayan nila kay David na ipinahihiwatig ng konteksto.
- source_word: וַיַּהַרְגוּם
  choice: at pinatay nila ang dalawang lalaki
  rationale: Karaniwang pandiwa para sa pagpatay ang הרג. Nilinaw bilang “ang dalawang lalaki” ang panghalip na maramihan, na tumutukoy kina Recab at Baana sa naunang konteksto.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: Pinutol nila ang mga kamay at paa ng mga ito
  rationale: Ang קצץ ay nangangahulugang putulin. Tuwirang pinananatili ang malupit na detalye ng salaysay nang hindi ito dinaragdagan ng moral na paliwanag.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: ibinitin sila sa may tipunan ng tubig[a]
  rationale: Ang תלה ay “ibitin.” Ang בְּרֵכָה ay isang pool o imbakan/tipunan ng tubig, at maaaring mas malawak na tumukoy ang עַל sa lokasyon sa may lugar na iyon, hindi lamang sa ibabaw nito. Pinananatili sa talababa ang alternatibong pagbasa.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Ang “sa Hebron” ang natural na katumbas sa Tagalog para sa parehong pagbanggit sa lugar.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: ang ulo ni Isboset
  rationale: Tuwirang isinasalin ang construct chain. Ginamit ang anyong “Isboset,” isang malinaw na transliterasyon na angkop sa baybay-Filipino.
- source_word: לָקָחוּ
  choice: kinuha nila
  rationale: Karaniwang kahulugan ng לקח ang “kunin”; hindi kailangan ang mas interpretibong “inalis” o “binalikan.”
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: inilibing iyon sa libingan ni Abner
  rationale: Ang ipinahihiwatig na layon ay ang ulo ni Isboset. Malinaw at marangal sa Tagalog ang “libingan” para sa קבר.
theological_decisions:
- issue: Moral o teolohikal na paglalarawan sa ginawa ni David
  choice: Isinalaysay nang tuwiran ang utos, pagpatay, pagputol, at pagbibitin nang walang idinagdag na moral na paghatol.
  alternative: Gumamit ng tahasang wikang panghukuman gaya ng “ipinabitay” o “ipinapatay bilang parusa.”
  rationale: Iniuulat ng talata ang ginawa ni David ngunit hindi ito tahasang binibigyan ng moral o teolohikal na pagsusuri. Pinananatili ng salin ang bigat at tensiyon ng salaysay nang hindi ipinapasok ang isang tiyak na interpretasyong panghukuman.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignificado, at madaling maunawaan. Iniwasan ang arkaikong pananalita at ang eupemismong magpapalabo sa marahas na detalye ng Hebreong salaysay.
