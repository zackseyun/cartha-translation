  source_fidelity: 'Tapat ang salin sa pagkakasunod ng Hebreo: nag-utos si David, pinatay ang dalawang salarin, pinutol ang kanilang mga kamay at paa, ibinitin ang mga ito malapit sa tipunan ng tubig sa Hebron, at inilibing ang ulo ni Isboset sa libingan ni Abner. Ang paglilinaw na “ang dalawang lalaki” ay wastong nakabatay sa agarang konteksto at hindi nagbabago ng kahulugan.'
