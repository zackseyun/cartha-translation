  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: tl
  text: Ngunit tumakas patungong Gitaim ang mga taga-Beerot, at hanggang sa araw na ito ay doon pa rin sila naninirahan bilang mga dayuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at hanggang sa araw na ito ay doon pa rin sila naninirahan bilang mga dayuhang residente.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: tumakas
  rationale: Ang Qal wayyiqtol ng ברח ay nagsasaad ng pagtakas. Ang payak na nagdaang panahong “tumakas” ay tapat sa anyong Hebreo at natural sa salaysay.
- source_word: הַבְּאֵרֹתִים
  choice: ang mga taga-Beerot
  rationale: Ito ay pangmaramihang katawagan sa mga taong nagmula sa Beerot; mas natural sa modernong Tagalog ang “mga taga-Beerot” kaysa sa transliteradong katawagang etniko.
- source_word: גִּתָּיְמָה
  choice: patungong Gitaim
  rationale: Ang hulaping directional he ay nagpapahiwatig ng kilos tungo sa lugar; malinaw itong naipahahayag ng “patungong Gitaim.”
- source_word: וַיִּהְיוּ שָׁם
  choice: nanirahan sila roon
  rationale: Sa kaugnayan nito sa גָּרִים at sa pariralang “hanggang sa araw na ito,” inilalarawan ng sugnay ang patuloy na paninirahan, hindi lamang ang pag-iral o pagkanaroroon.
- source_word: גָּרִים
  choice: bilang mga dayuhan
  rationale: Ang גור ay tumutukoy sa paninirahan bilang hindi katutubong kasapi ng pamayanan. Ang “mga dayuhan” ay malinaw at natural, bagaman maaari rin itong linawin bilang mga dayuhang naninirahan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang salin ito ng Hebreong pahayag na tumutukoy sa pagpapatuloy hanggang sa panahon ng tagapagsalaysay.
- source_word: וַ
  choice: Ngunit
  rationale: Sa konteksto, ang pangatnig ay nagpapakilala ng paliwanag na may bahagyang pagsalungat sa naunang pahayag tungkol sa Beerot at Benjamin.
