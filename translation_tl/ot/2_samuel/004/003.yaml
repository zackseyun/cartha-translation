translation_notes:
  register: Gumamit ng modernong, dignidadong Filipino. Pinili ang “mga taga-Beerot” bilang likas na katawagan sa mga mamamayan, at “bilang mga dayuhan” upang ihatid ang katayuang panlipunan ng גָּרִים nang hindi gumagamit ng lipas o teknikal na salita.
