  terminology: Ang “mga taga-Beerot” ay angkop para sa gentilic. Ang pangunahing saling “mga dayuhan” ay katanggap-tanggap para sa גָּרִים, habang pinananatili ng talababa ang mas tiyak na panlipunang diwa na “mga dayuhang residente.” Walang isyung teolohikal o pangalang pantangi na nangangailangan ng pagbabago.
