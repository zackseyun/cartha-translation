translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang literal na “mga taong kasama niya” at ang kolektibong pangalang “Aram,” habang ginawang natural ang kilos-militar sa “sumulong … upang makipaglaban.”
