  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: tl
  text: Kaya sumulong si Joab at ang mga taong kasama niya upang makipaglaban laban sa Aram[a], at tumakas sila sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Aram”; ibig sabihin, ang mga hukbo ng Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: sumulong
  rationale: Literal itong nangangahulugang “lumapit,” ngunit kasama ng לַמִּלְחָמָה ay tumutukoy sa pagsulong upang makipaglaban. Likas at malinaw sa Filipino ang “sumulong” sa kontekstong militar.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: at ang mga taong kasama niya
  rationale: Pinananatili nito ang karaniwang kahulugan ng עָם na “mga tao,” habang malinaw sa konteksto na sila ang mga tauhang nakikipaglaban kasama ni Joab.
- source_word: לַמִּלְחָמָה
  choice: upang makipaglaban
  rationale: Ipinahahayag ng parirala ang layunin ng paglapit o pagsulong. Mas natural sa modernong Filipino ang pandiwang “makipaglaban” kaysa sa literal na “patungo sa labanan.”
- source_word: בַּאֲרָם
  choice: sa Aram
  rationale: Ang בְּ ay may diwang pakikipaglaban laban sa isang katunggali sa kontekstong ito. Pinananatili ang pangalang “Aram,” gaya ng anyong Hebreo, sa halip na tahasang palitan ng “mga Arameo.”
- source_word: וַיָּנֻסוּ
  choice: at tumakas sila
  rationale: Tuwirang katumbas ng נוּס ang “tumakas”; hindi nito ipinahihiwatig ang maayos at planadong pag-urong na maaaring dalhin ng “umatras.”
- source_word: מִפָּנָיו
  choice: sa harap niya
  rationale: Pinananatili nito ang Hebreong idyomang “tumakas mula sa harap niya.” Ang panghalip na isahan ay tumutukoy kay Joab bilang pangunahing tauhan ng sugnay.
- source_word: יוֹאָב
  choice: Joab
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
