  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: tl
  text: Nang makita ng Aram na natalo sila sa harap ng Israel[a], sama-sama silang nagtipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At nakita ng Aram na natalo ito sa harap ng Israel, at nagtipon sila.” Ang pangalang “Aram” ay isahan sa Hebreo ngunit kolektibong tumutukoy sa mga Arameo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay; likas na iniuugnay ng “Nang” ang pagkakita sa sumunod na pagkilos.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang pantangi sa Hebreo, na dito ay kolektibong tumutukoy sa mga Arameo; kaya maramihan ang kasunod na panghalip.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng kanilang nakita, hindi isang sugnay na nagsasaad ng sanhi.
- source_word: נִגַּף
  choice: natalo
  rationale: Sa konteksto ng labanan, ang Niphal ay nangangahulugang dumanas ng pagkatalo; malinaw ito nang hindi dinaragdagan ang paraan o tindi ng pagkatalo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang larawang Hebreo ng pagkatalo “sa harap” ng kalaban, sa halip na gawing tahasang ahenteng “ng Israel.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Tuwirang anyo ng pangalang pantangi sa modernong Filipino.
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Likas na salin ng Niphal ng אָסף bilang kusang pagtitipon o pag-aassemble; hindi ipinapasok ang mas tiyak na ideya ng muling pagpapangkat militar.
- source_word: יָחַד
  choice: magkakasama
  rationale: Malinaw na ipinahahayag ang adberbiyal na kahulugang “together.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang “Aram” bilang pangalan at ipinaliwanag sa talababa ang kolektibong gamit nito. Ginamit ang “sa harap ng Israel” upang mapanatili ang pahayag na לִפְנֵי at ang bahagyang literal na larawang pandigma.
