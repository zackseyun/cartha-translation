base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: tl
  text: Nang maibalita ito kay David, tinipon niya ang buong Israel, tumawid siya sa Jordan, at dumating sa Helam. Pumuwesto ang mga Arameo para salubungin si David sa labanan, at nakipaglaban sila sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at nilabanan nila siya.” Literal sa Hebreo, “nakipaglaban sila sa kanya,” isang idyoma para sa pakikipaglaban sa isang kalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Nang maibalita ito kay David
  rationale: Pinananatili ang di-tiyak na tagapagbalita sa balintiyak na anyo. Likas sa Tagalog ang “nang” bilang ugnayang pasalaysay; ang “ito” ay tumutukoy sa naunang ulat sa konteksto.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: tinipon niya ang buong Israel
  rationale: Tuwirang inililipat ang kolektibong “buong Israel” nang hindi nililimitahan ito sa salitang “hukbo,” na wala sa Hebreo.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: tumawid sila sa Jordan
  rationale: Ang עָבַר kasama ng Jordan ay tumutukoy sa pagtawid sa ilog. Ginamit ang maramihang “sila” sapagkat si David at ang tinipon niyang Israel ang malinaw na magkakasamang tumawid.
- source_word: וַיָּבֹא חֵלָמָה
  choice: at dumating sa Helam
  rationale: Ipinahihiwatig ng directional he ang pagpunta sa lugar; natural na katumbas sa Tagalog ang “dumating sa Helam.”
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Pumuwesto ang mga Arameo
  rationale: Sa kontekstong militar, ang עָרַךְ ay pag-aayos o pagpuwesto para sa labanan. Isinalin ang kolektibong Aram bilang “mga Arameo” para sa malinaw at natural na Tagalog.
- source_word: לִקְרַאת דָּוִד
  choice: para salubungin si David sa labanan
  rationale: Pinananatili ng “salubungin” ang diwa ng pagharap o pakikipagtagpo, habang nililinaw ng kontekstuwal na “sa labanan” na masama ang layunin.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: at nakipaglaban sila sa kanya
  rationale: Ang literal na konstruksyon ay “nakipaglaban kasama/kay siya,” ngunit sa idyomang ito ang עִם ay tumutukoy sa kalaban. Ang “nakipaglaban sila sa kanya” ay natural at nananatiling malapit sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Arameo” sa halip na kolektibong “Aram” upang maging likas sa karaniwang mambabasa, at iniwasang idagdag ang “hukbo” kung saan “Israel” lamang ang nasa Hebreo.
