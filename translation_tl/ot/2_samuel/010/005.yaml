  to: Nang ibalita kay David, nagsugo siya upang salubungin sila, sapagkat labis na napahiya ang mga lalaki. Sinabi ng hari, “Manatili kayo sa Jerico hanggang tumubo ang inyong mga balbas, saka kayo bumalik.”
