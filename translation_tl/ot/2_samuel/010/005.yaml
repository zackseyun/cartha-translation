translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na estilong pasalaysay. Ginamit ang “sapagkat” para sa pormal ngunit karaniwang ugnayang sanhi, at iniwasan ang pagdaragdag ng “mga mensahero” dahil hindi ito tahasang nasa tekstong Hebreo.
