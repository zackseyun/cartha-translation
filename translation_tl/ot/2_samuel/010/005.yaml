base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: tl
  text: Nang ibalita kay David, nagsugo siya upang salubungin sila, sapagkat labis na napahiya ang mga lalaki. Sinabi ng hari, “Manatili kayo sa Jerico hanggang tumubo ang inyong mga balbas, saka kayo bumalik.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Nang ibalita ito kay David
  rationale: Ang Hiphil ng נגד ay nangangahulugang magbalita o magsabi. Hindi tinukoy sa Hebreo ang gumagawa, kaya natural sa Tagalog ang di-tiyak na konstruksiyong “ibalita.” Ang “ito” ay tumutukoy sa nangyari sa naunang konteksto.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: nagsugo siya upang salubungin sila
  rationale: Pinananatili nito ang diwang may isinugo si David upang sumalubong sa kanila nang hindi dinaragdagan ang tahasang hindi binanggit na “mga mensahero.”
- source_word: כִּי הָיוּ הָאֲנָשִׁים נִכְלָמִים מְאֹד
  choice: sapagkat labis na napahiya ang mga lalaki
  rationale: Ipinahahayag ng Niphal na נכלם ang pagdanas ng kahihiyan, at ipinapakita ng מְאֹד ang matinding antas nito. Ang “labis na napahiya” ay natural at malinaw sa modernong Tagalog.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Sinabi ng hari
  rationale: Pinananatili ang tahasang titulong “hari,” na tumutukoy kay David, habang natural na isinasalaysay ang sunod na pangyayari.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Manatili kayo sa Jerico
  rationale: Sa kontekstong ito, ang ישׁב ay nangangahulugang pansamantalang manatili, hindi lamang umupo. Ang “sa Jerico” ang likas na gamit para sa isang lungsod.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: hanggang tumubo muli ang inyong mga balbas
  rationale: Ang צמח ay “tumubo.” Bagaman hindi tahasang nakasulat ang “muli,” malinaw sa naunang konteksto na inahit ang kalahati ng kanilang mga balbas, kaya ipinahahayag nito nang natural ang nilalayong muling pagtubo.
- source_word: וְשַׁבְתֶּם
  choice: saka kayo bumalik
  rationale: Ang שׁוב ay “bumalik.” Ipinahahayag ng “saka” ang temporal na pagkakasunod na ipinahihiwatig ng pang-ugnay matapos ang sugnay na “hanggang.”
