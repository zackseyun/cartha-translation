  - severity: medium
    issue: Idinagdag ang “muli” sa “hanggang tumubo muli ang inyong mga balbas.”
    rationale: Ang יְצַמַּח ay “tumubo” o “lumago”; hindi nito tahasang sinasabing “muli.” Totoong ipinahihiwatig ng naunang talata ang konteksto ng muling pagtubo, ngunit dapat manatili sa talata ang payak na pandiwang nasa pinagmulan.
