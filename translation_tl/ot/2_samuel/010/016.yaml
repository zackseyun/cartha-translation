  naturalness: Malinaw at angkop sa makabagong Filipino ang rehistro. Mas natural ding gamitin ang pang-uring “mga Arameong mula sa ...” sa halip na “mga Arameo na nasa ...”.
  terminology: Ang “Arameo,” “Ilog,” “Helam,” “Shobak,” at “kumandante ng hukbo” ay angkop. Pinananatili ang “Ilog” sa pangunahing teksto at ang pagkakakilanlan nito bilang Eufrates sa talababa.
