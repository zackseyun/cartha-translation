base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: tl
  text: Nagpadala si Hadadezer at inilabas niya ang mga Arameong mula sa kabila ng Ilog[a]. Dumating sila sa Helam, at nasa unahan nila[c] si Shobak[b], ang kumandante ng hukbo ni Hadadezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, mula sa kabila ng Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: O “Shobach,” isang karaniwang alternatibong baybay ng pangalan.
    reason: lexical_alternative
  - marker: c
    text: Ang “nasa unahan nila” ay malamang na nangangahulugang siya ang nangunguna sa kanila o nasa pinakaharap ng kanilang hanay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Nagpadala
  rationale: Karaniwang diwa ng שלח sa sunod-sunod na salaysay; natural ito sa makabagong Filipino at hindi dinaragdagan kung ano mismo ang ipinadala.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: inilabas niya ang mga Arameo
  rationale: Pinananatili ang causative na diwa ng Hiphil ng יצא—pinangyari ni Hadadezer na lumabas ang mga puwersang Arameo—nang hindi ito malayang ginagawang 'tinipon' o 'pinakilos.'
- source_word: אֲרָם
  choice: ang mga Arameo
  rationale: Sa konteksto, tumutukoy ito sa mga taong o puwersang Arameo, hindi lamang sa lupaing Aram; iniiwasan din ng 'Arameo' ang posibleng anakronismong dulot ng 'Siriano.'
- source_word: מֵעֵבֶר הַנָּהָר
  choice: na nasa kabila ng Ilog
  rationale: Malapit sa literal na 'mula/nasa kabila ng Ilog.' Pinananatili sa pangunahing teksto ang katawagang 'Ilog,' habang tinutukoy sa talababa na malamang ay Eufrates ito.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: Dumating sila sa Helam
  rationale: Itinuturing ang חֵילָם bilang pangalan ng lugar at isinasalin ang pandiwa sa natural na Filipino.
- source_word: וְשׁוֹבַךְ
  choice: Shobak
  rationale: Direktang transliterasyon ng anyong katinig sa tekstong Hebreo; itinatala sa talababa ang karaniwang alternatibong Shobach.
- source_word: שַׂר צְבָא
  choice: ang kumandante ng hukbo
  rationale: Malinaw at makabagong katawagang militar para sa pinuno ng hukbo.
- source_word: לִפְנֵיהֶם
  choice: nasa unahan nila
  rationale: Pinananatili ang lokatibong larawan ng literal na 'sa harap nila' at ang likas na pahiwatig sa kontekstong militar na siya ang nangunguna, nang hindi lubusang nilulutas ang saklaw ng parirala.
