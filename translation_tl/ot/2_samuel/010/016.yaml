translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang 'Ilog' bilang pantanging katawagan ayon sa anyo ng Hebreo, at ginamit ang 'Arameo' sa halip na 'Siriano.' Ang ayos ng huling sugnay ay ginawang natural sa Filipino habang pinananatili ang ambiguwidad ng לִפְנֵיהֶם.
