source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: tl
  text: Nang makita ng mga Ammonita na tumakas na ang Aram[a], tumakas din sila mula kay Abisai at pumasok sa lungsod. Pagkatapos, bumalik si Joab mula sa pakikipaglaban sa mga Ammonita[b] at pumunta sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Aram” ay tumutukoy rito sa mga Arameo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Ammon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ang literal na 'mga anak ni Ammon' ay hindi likas sa modernong Filipino bilang katawagan sa isang bayan; malinaw at tumpak na ipinahahayag ng 'mga Ammonita' ang kolektibong kahulugan.
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: makita ... na tumakas na ang Aram
  rationale: Pinananatili ng 'makita ... na' ang tuwirang persepsiyon ng ראה, at ipinahihiwatig ng 'tumakas na' na nauna ang pagtakas ng Aram sa naging reaksiyon ng mga Ammonita.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo at ang kolektibo o pambansang diwa nito; iniiwasan ang anakronistikong 'Siria.'
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: tumakas din sila mula sa harap ni Abisai
  rationale: Ang 'mula sa harap ni' ay likas na sapat sa Filipino at pinananatili ang larawang militar ng pag-urong mula sa kaharap na puwersa.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: pumasok sa lungsod
  rationale: Natural na salin ito ng pagpasok sa tiyak at malamang na nakukutaang lungsod; hindi tinutukoy ng talata ang pangalan nito.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: umurong si Joab mula sa pakikipaglaban sa mga Ammonita
  rationale: Sa kontekstong militar, ang שׁוב ... מעל ay tumutukoy sa pagtalikod o pag-urong mula sa pakikipaglaban. Mas malinaw ito kaysa sa literal ngunit malabong 'bumalik mula sa ibabaw ng.'
- source_word: וַיָּבֹא יְרוּשָׁלָם
  choice: pumunta sa Jerusalem
  rationale: Maaaring mangahulugan ang בוא ng 'pumunta' o 'dumating' ayon sa pananaw. Ang 'pumunta' ay natural sa salaysay at hindi nagdaragdag ng ikalawang 'bumalik.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang 'mga Ammonita' sa pangunahing teksto para sa likas na daloy, habang inilagay sa talababa ang literal na idyomang Hebreo. Ang 'umurong ... mula sa pakikipaglaban' ay nagpapaliwanag sa diwang militar nang hindi nagdaragdag ng dahilan o kinalabasan.
