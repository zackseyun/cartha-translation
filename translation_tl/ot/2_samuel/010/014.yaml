revisions:
- from: Nang makita ng mga Ammonita na tumakas na ang Aram[a], tumakas din sila mula sa harap ni Abisai at pumasok sa lungsod. Kaya umurong si Joab mula sa pakikipaglaban sa mga Ammonita[b] at pumunta sa Jerusalem.
  to: Nang makita ng mga Ammonita na tumakas na ang Aram[a], tumakas din sila mula kay Abisai at pumasok sa lungsod. Pagkatapos, bumalik si Joab mula sa pakikipaglaban sa mga Ammonita[b] at pumunta sa Jerusalem.
  rationale: Pinalitan ang "Kaya umurong" ng "Pagkatapos, bumalik" upang maipakita ang payak na pagsunod ng pangyayari at ang pangunahing diwa ng וַיָּשָׁב. Pinasimple rin ang "mula sa harap ni Abisai" tungo sa mas likas na "mula kay Abisai," na sapat na nagpapahayag ng pagtakas palayo sa kaniya sa kontekstong militar.
