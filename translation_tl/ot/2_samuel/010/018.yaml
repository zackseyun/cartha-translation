  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: tl
  text: Tumakas ang mga Arameo mula sa harap ng Israel, at pumatay si David mula sa mga Arameo ng pitong daang tauhan ng mga karwaheng pandigma[a] at apatnapung libong mangangabayo. Sinaktan din niya si Shobac, ang kumandante ng kaniyang hukbo[b], at namatay siya roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pitong daang karwahe” o “pitong daang hukbong-karwahe.” Hindi tiyak kung ang tinutukoy ay ang mga karwahe o ang mga tauhan ng hukbong-karwahe. Sa 1 Cronica 19:18, “pitong libong karwahe” ang bilang.
    reason: textual_variant
  - marker: b
    text: Maaaring tumukoy ang “kaniyang” kay Hadadezer o sa Aram bilang isang bansa; pang-isahan ang hulapi sa Hebreo. Maaari ring isalin, “ang kumandante ng hukbo ng mga Arameo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Tumakas ang mga Arameo sa harap ng Israel
  rationale: Ginamit ang “mga Arameo” bilang likas na kolektibong katumbas ng אֲרָם. Ang “sa harap ng Israel” ay nagpapanatili sa larawang nasa idyomang מִפְּנֵי habang malinaw na nagpapahiwatig ng pag-atras sa labanan.
- source_word: וַיַּהֲרֹג דָּוִד מֵאֲרָם
  choice: nakapatay si David sa kanila ng
  rationale: Tuwirang ipinahahayag ng הרג ang pagpatay. Ang “sa kanila” ay tumutukoy pabalik sa mga Arameo at natural na naihahatid ang מֵאֲרָם sa Filipino.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: pitong daang tauhan ng mga karwaheng pandigma
  rationale: Ang רֶכֶב ay maaaring tumukoy sa karwahe o sa hukbong gumagamit ng mga karwahe. Dahil mga nasawi ang binibilang sa konteksto, ginawang tahasang pantao ang tinutukoy sa pangunahing teksto, habang inilalahad sa talababa ang literal na anyo at ang kaibang bilang sa 1 Cronica 19:18.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: apatnapung libong mangangabayo
  rationale: Ang “mangangabayo” ay malinaw at karaniwang modernong katumbas ng פָּרָשִׁים, mga kawal na nakasakay sa kabayo.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Shobac
  rationale: Isinulat ang pangalan ayon sa bigkas na ipinahihiwatig ng tekstong Masoretiko, sa anyong angkop sa ortograpiyang Filipino.
- source_word: שַׂר צְבָאוֹ
  choice: ang pinuno ng hukbo niya
  rationale: Ang שַׂר sa kontekstong militar ay “pinuno” o “kumandante,” at ang hulaping panghalip sa צְבָאוֹ ay pang-isahan. Pinanatili ng “niya” ang tunay na kalabuan ng tinutukoy ng panghalip sa halip na tahimik itong gawing maramihan.
- source_word: הִכָּה
  choice: Pinabagsak
  rationale: Ang נכה ay maaaring mangahulugang humampas, gumapi, o pumatay. Ang “pinabagsak” ay angkop sa nakamamatay na dagok dito at naiiba sa naunang הרג.
- source_word: וַיָּמָת שָׁם
  choice: at namatay siya roon
  rationale: Tuwiran at walang dagdag na paliwanag na salin ng sugnay, kasama ang tahasang שָׁם, “roon.”
