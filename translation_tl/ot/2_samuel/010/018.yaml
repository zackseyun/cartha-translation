revisions:
- from: Tumakas ang mga Arameo sa harap ng Israel, at nakapatay si David sa kanila ng pitong daang tauhan ng mga karwaheng pandigma[a] at apatnapung libong mangangabayo. Pinabagsak din niya si Shobac, ang pinuno ng hukbo niya[b], at namatay siya roon.
  to: Tumakas ang mga Arameo mula sa harap ng Israel, at pumatay si David mula sa mga Arameo ng pitong daang tauhan ng mga karwaheng pandigma[a] at apatnapung libong mangangabayo. Sinaktan din niya si Shobac, ang kumandante ng kaniyang hukbo[b], at namatay siya roon.
  rationale: Inayos ang sintaksis ng sugnay na may bilang upang maging natural na modernong Tagalog at malinaw na maihatid ang “mula sa Aram.” Pinalitan ang “Pinabagsak” ng “Sinaktan” upang mas malapit sa saklaw ng Hebreong pandiwa at hindi lampasan ang ipinahihiwatig nito. Nananatili ang tekstuwal na kalabuan sa pangunahing teksto at mga talababa.
