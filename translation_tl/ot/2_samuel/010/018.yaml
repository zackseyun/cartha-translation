translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang makalumang “karro,” “hukbohan,” at “pinatay sa tabak.” Pinanatili sa talababa ang kahirapan sa רֶכֶב at ang pang-isahang panghalip sa צְבָאוֹ upang hindi alisin ang tunay na tekstuwal at reperensiyal na kalabuan.
