  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: tl
  text: Sinabi niya, “Kung manaig sa akin ang Aram, tutulungan mo ako; ngunit kung manaig sa iyo ang mga Ammonita, pupunta ako upang tulungan ka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: manaig
  rationale: Sa kontekstong militar, ang חזק ay tumutukoy sa pagiging mas malakas o pagkakaroon ng pananaig laban sa kalaban. Likas at maikli sa Tagalog ang “manaig sa.”
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang nasa Hebreo sa halip na gamitin ang mas huling heopolitikal na katawagang “Siria.” Maaari itong tumukoy sa bayan o hukbo ng Aram ayon sa konteksto.
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: sa akin / sa iyo
  rationale: Kasama ng חזק, ipinahihiwatig ng מן ang pagiging nakahihigit o nananaig laban sa isang tao; natural itong naipapahayag ng “manaig sa akin/iyo.”
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: tutulungan mo ako
  rationale: Ang literal na anyo ay “ikaw ay magiging sa akin bilang pagliligtas,” ngunit sa usapang taktikal sa labanan, natural na ipinahahayag nito ang pag-alalay o pagtulong sa kasamang hukbo.
- source_word: בְּנֵי עַמּוֹן
  choice: ang mga Ammonita
  rationale: Ito ang karaniwang likas na katawagan sa Tagalog para sa pangkat-etnikong literal na tinatawag na “mga anak ni Ammon.”
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: pupunta ako upang tulungan ka
  rationale: Pinananatili ng “pupunta” ang pandiwa ng pagkilos na הלך, at ipinapahayag ng “upang tulungan” ang layuning magligtas o sumaklolo sa kontekstong militar nang hindi ito binibigyan ng di-kinakailangang teolohikal na kulay.
