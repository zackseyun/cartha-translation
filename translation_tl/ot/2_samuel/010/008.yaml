base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: tl
  text: Lumabas ang mga anak ni Ammon[a] at pumuwesto para sa labanan sa bungad ng tarangkahan. Samantala, ang mga Arameo ng Zoba at Rehob, ang mga tauhan ng Tob[b], at ang mga taga-Maaca ay nakahiwalay sa parang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Ammonita.” Sa Hebreo, “mga anak ni Ammon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Ish-tob,” bilang pangalan ng lugar. Ang Hebreong אִישׁ טוֹב ay maaaring unawaing “mga tauhan ng Tob” o bilang pangalang “Ish-tob.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas
  rationale: Karaniwang kahulugan ng יָצָא sa salaysay ang paglabas; ang pandiwang Tagalog ay malinaw at angkop sa paglabas ng hukbo mula sa lungsod.
- source_word: בְּנֵי עַמּוֹן
  choice: ang mga anak ni Ammon
  rationale: Pinananatili ang anyong Hebreo ng pangalang-etniko, habang inilalagay sa talababa ang mas karaniwang katawagang “mga Ammonita.”
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: pumuwesto para sa labanan
  rationale: Ipinahihiwatig ng idyomang militar ang pag-aayos ng hukbo sa puwesto o hanay para lumaban; natural ito sa modernong Tagalog nang hindi dinaragdagan ang detalye.
- source_word: פֶּתַח הַשָּׁעַר
  choice: sa bungad ng pintuang-bayan
  rationale: Ang פֶּתַח ay bungad o pasukan. Nililinaw ng “pintuang-bayan” na ito ang tarangkahan ng lungsod, hindi karaniwang pinto ng gusali.
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: ang mga Arameo ng Zoba at Rehob
  rationale: Ang אֲרַם ay tumutukoy sa Aram o sa mga Arameo. Ginamit ang pangkat-etnikong anyo upang maging natural sa Tagalog at upang tukuyin ang mga hukbong nagmula sa Zoba at Rehob.
- source_word: וְאִישׁ טוֹב
  choice: ang mga tauhan ng Tob
  rationale: Maaaring unawain ang אִישׁ bilang mga tauhan o kalalakihan ng Tob. Malinaw nitong ipinahahayag na isang pangkat mula sa Tob ang tinutukoy, habang itinatala sa talababa ang posibleng pangalang-lugar na Ish-tob.
- source_word: וּמַעֲכָה
  choice: ang Maaca
  rationale: Ang Maaca rito ay pangalan ng kaalyadong bayan o kaharian; pinanatili ang pantanging pangalan.
- source_word: לְבַדָּם בַּשָּׂדֶה
  choice: ay nakahiwalay sa parang
  rationale: Ipinakikita ng לְבַדָּם na ang mga kaalyadong hukbo ay nakapuwesto nang bukod sa mga Ammonita, at ang שָׂדֶה ay bukid, parang, o lantad na lupain. Ang “parang” ay maikli at natural nang hindi ipinapasok ang salitang “lantad,” na wala sa teksto.
