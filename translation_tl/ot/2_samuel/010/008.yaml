translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pintuang-bayan” para sa tarangkahan ng lungsod at “parang” para sa שָׂדֶה. Pinanatili ang anyong “mga anak ni Ammon” at ang tunay na kalabuan ng אִישׁ טוֹב sa pamamagitan ng mga talababa.
