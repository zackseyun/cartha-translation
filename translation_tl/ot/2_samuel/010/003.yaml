revisions:
- from: Sinabi ng mga pinuno ng mga Ammonita kay Hanun na kanilang panginoon, “Sa palagay mo ba'y pinararangalan ni David ang iyong ama kaya siya nagpadala sa iyo ng mga taong makikiramay[a]? Hindi ba ipinadala ni David sa iyo ang kanyang mga lingkod upang siyasatin ang lungsod, maniktik doon, at pabagsakin iyon?”
  to: Sinabi ng mga pinuno ng mga Ammonita kay Hanun na kanilang panginoon, “Sa palagay mo ba’y pinararangalan ni David ang iyong ama kaya siya nagpadala sa iyo ng mga dumamay[a]? Hindi ba ipinadala ni David sa iyo ang kanyang mga lingkod upang siyasatin ang lungsod, tiktikan ito, at pabagsakin ito?”
  rationale: Pinanatili ang retorikal na anyo at ang pampolitikang hinala ng mga pinuno, ngunit ginawang tuwiran ang pagtukoy sa lungsod sa dalawang huling infinitive. Pinakinis din ang katawagan sa mga dumamay nang hindi inaalis ang paliwanag ng talababa tungkol sa kanilang tungkulin bilang mga sugo ng pakikiramay.
