    issue: Ang “maniktik doon” ay hindi gaanong tuwirang tumutugma sa panghalip na tumutukoy sa lungsod.
    rationale: Ang וּלְרַגְּלָהּ ay “upang tiktikan ito,” na ang hulapi ay tumutukoy sa lungsod. Ang “tiktikan ito” ay kapwa mas tapat at mas malinaw.
  - severity: low
    issue: Medyo mabigat ang “mga taong makikiramay” bilang pantukoy sa mga dumating upang umaliw.
    rationale: Bagaman nauunawaan, mas natural ang “mga dumamay”; ipinapaliwanag naman ng talababa na sila ay mga sugo na dumating upang makiramay matapos mamatay ang ama ni Hanun.
