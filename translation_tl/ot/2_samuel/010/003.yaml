base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: tl
  text: Sinabi ng mga pinuno ng mga Ammonita kay Hanun na kanilang panginoon, “Sa palagay mo ba’y pinararangalan ni David ang iyong ama kaya siya nagpadala sa iyo ng mga dumamay[a]? Hindi ba ipinadala ni David sa iyo ang kanyang mga lingkod upang siyasatin ang lungsod, tiktikan ito, at pabagsakin ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga ito ay mga sugong ipinadala upang makiramay kay Hanun sa pagkamatay ng kanyang ama.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: mga pinuno ng mga Ammonita
  rationale: Ang שָׂרִים ay maaaring tumukoy sa mga prinsipe o matataas na opisyal. Mas natural at malinaw sa modernong Filipino ang “mga pinuno,” habang pinananatili ang kontekstong pampamahalaan.
- source_word: אֲדֹנֵיהֶם
  choice: kanilang panginoon
  rationale: Tumutukoy ito sa taong may kapangyarihan sa kanila, si Hanun, at hindi sa titulong ukol sa Diyos. Pinananatili ng “panginoon” ang pormal at maharlikang ugnayan.
- source_word: הַמְכַבֵּד
  choice: pinararangalan
  rationale: Ang pandiwa ay nangangahulugang nagpapakita ng dangal o paggalang. Ang “pinararangalan” ay likas at hindi nagbibigay rito ng teolohikal na diwa ng pagluwalhati.
- source_word: בְּעֵינֶיךָ
  choice: Sa palagay mo ba'y
  rationale: Literal itong “sa iyong mga mata,” ngunit idiomatikong tumutukoy sa pananaw o palagay ni Hanun. Ang salin ay natural sa Filipino at pinananatili ang mapanuyang tanong.
- source_word: מְנַחֲמִים
  choice: mga taong makikiramay
  rationale: Sa konteksto ng pagkamatay ng ama ni Hanun, ang mga ito ay mga sugong pumunta upang magpahayag ng pakikiramay, hindi lamang pangkalahatang magbigay-aliw.
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Ipinakikilala nito ang retorikal na tanong na umaasang sasang-ayon si Hanun sa hinala ng kanyang mga pinuno.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: siyasatin ang lungsod
  rationale: Ang חקר ay pagsusuri o masusing pagsisiyasat. Ang “siyasatin” ay angkop sa pinaghihinalaang layuning militar.
- source_word: וּלְרַגְּלָהּ
  choice: maniktik doon
  rationale: Ang Piel ng רגל ay tumutukoy sa pag-espiya o pagmamanman. Ginagawang malinaw ng “doon” na ang lungsod ang lugar na pagmamanmanan.
- source_word: וּלְהָפְכָהּ
  choice: pabagsakin iyon
  rationale: Ang הפך ay maaaring mangahulugang baligtarin, ibagsak, o gibain. Sa kontekstong militar, ipinahahayag ng “pabagsakin” ang layuning lupigin nang hindi pinalalabis bilang ganap na pagwasak.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Karaniwang katawagan ito sa mga tauhan o sugo ng hari. Pinananatili ng “mga lingkod” ang ugnayang maharlika at paglilingkod.
theological_decisions:
- issue: Hinalang pampolitika, hindi pahayag na pinagtitibay ng tagapagsalaysay
  choice: Isinalin ang paratang bilang dalawang retorikal na tanong.
  alternative: Isalin bilang tahasang pahayag na tunay na nagpadala si David ng mga espiya.
  rationale: Ang mga pinuno ni Hanun ang nagsasalita; hindi sinasabi ng tagapagsalaysay na tama ang kanilang hinala. Pinananatili ng anyong patanong ang agwat na ito.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “mga pinuno” sa halip na “mga prinsipe” para sa malinaw na tungkuling pampamahalaan, at “makikiramay” para sa likas na paglalarawan sa mga sugong dumalaw matapos ang isang pagkamatay.
