  to: Nang makita ni Joab na ang linya ng labanan ay nakapuwesto laban sa kanya sa harap at sa likuran, pumili siya mula sa lahat ng piling mandirigma ng Israel[a] at inihanay sila upang harapin ang Aram[b].
  rationale: Pinalitan ang “may mga hanay” ng “ang linya ng labanan” upang maipahayag nang mas tumpak ang Hebreong idyomang “harap ng labanan,” habang pinananatili ang taktikal na larawan ng banta sa harap at likuran. Walang ibang pagbabagong pangkahulugan ang ginawa.
