base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: tl
  text: Nang makita ni Joab na ang linya ng labanan ay nakapuwesto laban sa kanya sa harap at sa likuran, pumili siya mula sa lahat ng piling mandirigma ng Israel[a] at inihanay sila upang harapin ang Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “pumili siya mula sa lahat ng mga piling lalaki ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Aram” dito ay tumutukoy sa mga puwersang Arameo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Pinananatili ang payak na salaysay ng Hebreong ראה, na sa konteksto ay kasama ang pagkilala ni Joab sa kalagayang militar.
- source_word: פְּנֵי הַמִּלְחָמָה הָיְתָה אֵלָיו
  choice: may mga hanay na nakapuwesto laban sa kanya
  rationale: Ang literal na ‘mukha ng labanan ay patungo sa kanya’ ay isang idyomang militar. Ipinahahayag ng salin ang mga hanay o larangang nakaharap kay Joab nang hindi ginagamit ang di-likas na literal na parirala sa Tagalog.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: sa harap at sa likuran
  rationale: Likas at malinaw itong naghahatid ng magkasalungat na posisyon ng mga puwersang humaharap kay Joab sa dalawang panig.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: pumili siya mula sa lahat ng piling mandirigma ng Israel
  rationale: Ang בְּחוּרֵי ay tumutukoy sa mga piling lalaking panlaban; ang ‘mandirigma’ ay malinaw sa kontekstong militar, samantalang pinananatili ng ‘mula sa lahat’ ang saklaw ng מִכֹּל.
- source_word: וַיַּעֲרֹךְ
  choice: inihanay sila
  rationale: Sa kontekstong militar, ang ערך ay nangangahulugang ayusin o ihanay ang mga kawal para sa labanan.
- source_word: לִקְרַאת אֲרָם
  choice: upang harapin ang Aram
  rationale: Ipinahahayag ng ‘harapin’ ang pakikipagsagupa na ipinahihiwatig ng לִקְרַאת, habang pinananatili ang pangalang Aram sa halip na palitan ito ng mas huling katawagang heograpiko.
