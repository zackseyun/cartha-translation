translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Ammonita” at “mga Arameo” bilang likas na katawagang etniko; iniwasan ang sobrang literal na “mga anak ni Ammon.” Ang mga pangalang Bet-rehob, Zoba, Maaca, at Tob ay tinransliterado. Pinanatili sa mga talababa ang kongkretong idyoma ng Hebreo at ang tunay na kalabuan ng אִישׁ טוֹב.
