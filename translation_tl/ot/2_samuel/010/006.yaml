  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: tl
  text: Nang makita ng mga Ammonita na naging kasuklam-suklam sila kay David[a], nagsugo sila at umupa ng mga Arameo[b] mula sa Bet-rehob at Zoba—dalawampung libong kawal na lumalaban nang naglalakad—pati ng hari ng Maaca na may isang libong tauhan, at ng mga taga-Tob[c] na may labindalawang libong tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “naging mabahong amoy sila kay David.”
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “Aram”; ayon sa tradisyon, “Siria/mga Siriano.”
    reason: lexical_alternative
  - marker: c
    text: Posible ring “Ish-tob,” kung ituturing na pangalan ng lugar o angkan; dito ay isinaling “mga taga-Tob.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Nang makita
  rationale: Pinananatili nito ang karaniwang kahulugang “makita,” habang likas na ipinahihiwatig sa salaysay ang pagkilala nila sa kanilang kalagayan.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Mas natural at malinaw sa modernong Tagalog kaysa sa literal na “mga anak ni Ammon,” at tumutukoy sa bayan ng Ammon.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: naging kasuklam-suklam sila kay David
  rationale: Ipinahahayag ang idyomatikong diwa ng pagiging lubhang nakaiinis o karima-rimarim kay David, habang inilalagay sa talababa ang literal na larawan ng masamang amoy.
- source_word: וַיִּשְׁלְחוּ
  choice: nagsugo sila
  rationale: Ang pandiwa ay literal na “nagpadala/nagsugo”; hindi na idinagdag kung sino ang isinugo sapagkat hindi ito tahasang binanggit sa Hebreo.
- source_word: וַיִּשְׂכְּרוּ
  choice: umupa
  rationale: Ang konteksto ay pag-upa ng hukbong tutulong sa digmaan; sapat ang “umupa” nang hindi idinaragdag sa teksto ang salitang “mersenaryo.”
- source_word: אֲרַם בֵּית רְחוֹב
  choice: mga Arameo mula sa Bet-rehob
  rationale: Ang “mga Arameo” ay tuwirang kumakatawan sa Aram, at ang “mula sa” ay natural na nag-uugnay sa pangkat at lugar sa Tagalog.
- source_word: אֲרַם צוֹבָא
  choice: mga Arameo mula sa Zoba
  rationale: Pinananatili ang makasaysayang katawagang Arameo at ang pangalan ng lugar.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: dalawampung libong kawal na naglalakad
  rationale: Tuwirang inilalarawan ang mga kawal na lumalaban nang naglalakad, sa halip na gumamit ng mas teknikal na “impanterya.”
- source_word: מֶלֶךְ מַעֲכָה
  choice: hari ng Maaca
  rationale: Ang parirala ay tumutukoy sa pinuno ng lugar o kaharian ng Maaca, hindi sa haring Maaca ang pangalan.
- source_word: אֶלֶף אִישׁ
  choice: isang libong tauhan
  rationale: Natural na bilang para sa kasamang puwersang militar sa Tagalog.
- source_word: אִישׁ טוֹב
  choice: mga taga-Tob
  rationale: Sa konteksto, malamang na tumutukoy ito sa mga tao o mandirigma mula sa Tob; pinananatili sa talababa ang posibleng pagbasa na “Ish-tob.”
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: labindalawang libong tauhan
  rationale: Tuwirang pinananatili ang bilang at ang militar na konteksto.
