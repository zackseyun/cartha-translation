  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: tl
  text: Nang mabalitaan ni David, isinugo niya si Joab at ang buong hukbo ng magigiting na mandirigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang buong hukbo—ang magigiting na mandirigma.” Maaaring unawain ang Hebreo na ang “magigiting na mandirigma” ay isa pang tawag sa “hukbo,” o na sila ang bumubuo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Nang mabalitaan iyon ni David
  rationale: Ang Qal wayyiqtol ng שׁמע ay nangangahulugang ‘narinig’ o ‘nabalitaan.’ Ginamit ang ‘nang’ upang likas na ipahayag sa Filipino ang pagkakasunod ng mga pangyayari; ang ‘iyon’ ay kontekstuwal na pantukoy na kailangan para sa natural na pangungusap, bagaman walang tahasang layon sa Hebreo.
- source_word: וַיִּשְׁלַח
  choice: isinugo niya
  rationale: Karaniwang kahulugan ng Qal ng שׁלח ang ‘ipadala’ o ‘isugo.’ Ang ‘isinugo’ ay natural at marangal sa kontekstong militar nang hindi nagdaragdag ng espesipikong utos na wala sa teksto.
- source_word: אֶת יוֹאָב
  choice: si Joab
  rationale: Hindi isinasalin ang pantukoy sa tuwirang layon na אֶת; ginamit ang personal marker na ‘si’ na hinihingi ng balarilang Filipino.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: at ang buong hukbo
  rationale: Ang צָבָא ay tumutukoy rito sa puwersang militar, kaya ‘hukbo’ ang malinaw na modernong katumbas. Likas na isinasalin ang כָּל bilang ‘buong.’
- source_word: הַגִּבֹּרִים
  choice: ng magigiting na mandirigma
  rationale: Maaaring tumukoy ang גִּבֹּרִים sa malalakas, magigiting, o kilalang mandirigma. Pinananatili ng pariralang ito ang lakas ng salita nang hindi tiyak na ipinapalagay na isang pormal na piling yunit lamang sila.
theological_decisions:
- issue: Ugnayan ng הַגִּבֹּרִים sa כָּל הַצָּבָא
  choice: Isinalin bilang ‘ang buong hukbo ng magigiting na mandirigma.’
  alternative: ‘ang buong hukbo—ang magigiting na mandirigma’
  rationale: Maaaring basahin ang הַגִּבֹּרִים bilang paglalarawan o pagtukoy sa kung sino ang bumubuo sa hukbo, o bilang apposition na muling nagpapangalan sa hukbo. Pinili sa pangunahing teksto ang natural na genitival na anyo sa Filipino at inilagay sa talababa ang appositional na pagbasa upang hindi alisin ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang ‘hukbo’ at ‘magigiting na mandirigma’ bilang madaling maunawaang mga terminong militar; iniwasan ang arkaikong pananalita at ang labis na pagtukoy sa kanila bilang isang pormal na elite corps.
