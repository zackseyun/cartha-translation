base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: tl
  text: Sinabi ni David, “Magpapakita ako ng kabutihan kay Hanun na anak ni Nahas, kung paanong nagpakita sa akin ng kabutihan ang kanyang ama.” Kaya nagsugo si David ng kanyang mga lingkod upang aliwin siya dahil sa kanyang ama.[a] At dumating ang mga lingkod ni David sa lupain ng mga Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang aliwin siya tungkol sa kanyang ama.” Malamang na tumutukoy ang pananalitang Hebreo sa pakikiramay sa pagkamatay ng kanyang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: kabutihan
  rationale: Sa kontekstong diplomatiko, tumutukoy ito sa kabutihang-loob o tapat na pakikitungo. Ang “kabutihan” ay natural at sapat na malawak upang magamit sa dalawang paglitaw ng salita nang hindi ito nililimitahan sa isang teknikal na kahulugang teolohikal.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Hanun na anak ni Nahas
  rationale: Ginamit ang karaniwang anyong Filipino para sa ugnayang mag-ama at ang natural na transliterasyon ng mga pangalan.
- source_word: כַּאֲשֶׁר
  choice: kung paanong
  rationale: Malinaw nitong ipinapakita ang paghahambing at pagganti ni David sa kabutihang dati niyang natanggap.
- source_word: עָשָׂה ... חֶסֶד
  choice: nagpakita ... ng kabutihan
  rationale: Ito ang natural na pariralang Filipino para sa Hebreong idyomang “gumawa ng hesed.”
- source_word: לְנַחֲמוֹ אֶל־אָבִיו
  choice: upang aliwin siya sa pagkawala ng kanyang ama
  rationale: Ang pandiwa ay tumutukoy sa pag-aaliw, at sa konteksto ay pakikiramay sa pagkamatay ng ama. Ang “pagkawala” ay dignified at natural, habang ipinapaliwanag sa talababa ang mas literal na anyo at ang kontekstuwal na pakahulugan.
- source_word: בְּיַד עֲבָדָיו
  choice: sa pamamagitan ng kanyang mga lingkod
  rationale: Pinananatili nito ang ideya ng ahensiya sa idyomang Hebreo na “sa kamay ng,” ngunit sa natural na Filipino.
- source_word: עַבְדֵי דָוִד
  choice: mga lingkod ni David
  rationale: Natural na anyong Filipino para sa genitibong parirala.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: lupain ng mga Ammonita
  rationale: Ang “mga Ammonita” ang malinaw at karaniwang katumbas ng etnonimong literal na “mga anak ni Ammon.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “kabutihan” at “mga lingkod ni David” upang maipakita ang estruktura ng Hebreo. Inilagay ang talababa sa pariralang tunay nitong ipinaliliwanag, hindi pagkatapos ng “Sinabi ni David.”
