revisions:
- from: Sinabi ni David, “Magpapakita ako ng kabutihan kay Hanun na anak ni Nahas, kung paanong nagpakita sa akin ng kabutihan ang kanyang ama.” Kaya nagsugo si David sa pamamagitan ng kanyang mga lingkod upang aliwin siya sa pagkawala ng kanyang ama.[a] At dumating ang mga lingkod ni David sa lupain ng mga Ammonita.
  to: Sinabi ni David, “Magpapakita ako ng kabutihan kay Hanun na anak ni Nahas, kung paanong nagpakita sa akin ng kabutihan ang kanyang ama.” Kaya nagsugo si David ng kanyang mga lingkod upang aliwin siya dahil sa kanyang ama.[a] At dumating ang mga lingkod ni David sa lupain ng mga Ammonita.
  rationale: Inayos ang pagpapahayag ng pagsusugo upang maging natural at malinaw sa Filipino. Pinalitan ang tahasang “sa pagkawala” ng “dahil sa kanyang ama” upang hindi idagdag sa pangunahing teksto ang detalyeng kontekstuwal na hindi hayagang isinasaad ng Hebreo; nananatili ang paliwanag tungkol sa pakikiramay sa talababa.
