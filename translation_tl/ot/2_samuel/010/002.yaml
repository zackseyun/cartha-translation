  naturalness: Ang “nagsugo si David sa pamamagitan ng kanyang mga lingkod” ay hindi gaanong natural dahil walang malinaw na tuwirang layon ng “nagsugo.” Ang “nagsugo si David ng kanyang mga lingkod” ay malinaw, likas, at ipinapahayag pa rin na ginamit niya ang mga lingkod bilang kanyang mga kinatawan.
  terminology: Ang “kabutihan,” “mga lingkod,” at “mga Ammonita” ay angkop sa makabago ngunit marangal na Filipino. Pinanatili ang “Hanun na anak ni Nahas” at ang hindi-teknikal na “kabutihan” para sa חֶסֶד sa kontekstong diplomatiko.
