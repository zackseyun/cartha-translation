  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: tl
  text: Nang makita ng lahat ng haring naglilingkod kay Hadadezer na natalo sila ng Israel, nakipagpayapaan sila sa Israel at naglingkod sa kanila. Kaya hindi na nangahas ang Aram na iligtas ang mga Ammonita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: naglilingkod kay Hadadezer
  rationale: Natural na Filipino para sa mga haring nasa ilalim ng kapangyarihan ni Hadadezer, habang pinananatili ang diwa ng pagiging mga lingkod o sakop.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: natalo sila sa harap ng Israel
  rationale: Pinananatili ang karaniwang Hebreong pahayag na tumutukoy sa pagkatalo sa pakikipagdigma.
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: nakipagkasundo sila sa Israel
  rationale: Ang pandiwa sa kontekstong pandigma ay tumutukoy sa pakikipagpayapaan o pakikipagkasundo.
- source_word: וַיַּעַבְדוּם
  choice: naglingkod sa kanila
  rationale: Tuwirang pinananatili ang pangmaramihang reperente ng hulaping panghalip, na tumutukoy sa Israel bilang isang kolektibong bayan.
- source_word: לְהוֹשִׁיעַ
  choice: iligtas
  rationale: Pinananatili ang pangunahing kahulugan ng Hifil na 'magligtas' sa halip na paliitin ito sa mas pangkalahatang 'tumulong.'
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Likas at malinaw na katawagan sa modernong Filipino para sa 'mga anak ni Ammon,' ibig sabihin, ang bayan ng Ammon.
theological_decisions:
- issue: Saklaw ng kolektibong pangalang Israel at pangmaramihang panghalip
  choice: Israel ... sa kanila
  alternative: Israel ... dito
  rationale: Iningatan ang pagbabago mula sa kolektibong pangalang isahan tungo sa pangmaramihang panghalip sa Hebreo, nang hindi ito pinapantay sa isang interpretatibong reperente.
- issue: Kahulugan ng pagliligtas sa mga Ammonita
  choice: iligtas
  alternative: tulungan
  rationale: Ang mas tiyak na leksikal na diwa ng הוֹשִׁיעַ ay pinanatili; hindi nito kinakailangang ipahiwatig ang espirituwal na kaligtasan sa kontekstong militar.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'nakipagkasundo' bilang likas na pahayag para sa pagtatatag ng kapayapaan, at 'mga Ammonita' bilang karaniwang etnonimo. Walang kailangang talababa.
