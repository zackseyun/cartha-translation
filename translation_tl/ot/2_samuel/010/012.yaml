  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: tl
  text: Magpakatatag ka, at magpakatatag tayo alang-alang sa ating bayan at sa mga lungsod ng ating Diyos. At gawin nawa ni Yahweh ang mabuti sa kanyang paningin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “At gagawin ni Yahweh ang mabuti sa kanyang paningin.” Maaaring unawain ang anyong Hebreo bilang payak na pahayag tungkol sa hinaharap, bagaman isinalin dito bilang hangarin ng pagpapaubaya sa kalooban ni Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Magpakatatag ka
  rationale: Tuwirang pautos sa ikalawang panauhang panlalaki; natural na ipinahahayag ang lakas ng loob at katatagan sa harap ng labanan.
- source_word: וְנִתְחַזַּק
  choice: at magpakatatag tayo
  rationale: Ang Hitpael cohortative ay may diwang kusang pagpapakatatag; pinananatili rin nito ang pag-uulit at ugnayan sa unang pautos.
- source_word: בְּעַד
  choice: alang-alang sa
  rationale: Ipinahahayag dito ang pagkilos para sa kapakanan at pagtatanggol ng bayan at ng mga lungsod.
- source_word: עַמֵּנוּ
  choice: ating bayan
  rationale: Ang עַם ay tumutukoy sa sambayanan, hindi lamang sa hukbo; ang “bayan” ay natural at malawak ang saklaw sa Filipino.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: mga lungsod ng ating Diyos
  rationale: Tapat sa construct chain at pinananatili ang pagkakaugnay ng mga lungsod sa Diyos ng Israel.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang Yahweh.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: gawin nawa ni Yahweh ang mabuti sa kanyang paningin
  rationale: Pinananatili ang Hebreong idyoma at binabasa ang yiqtol bilang hangarin ng mapagpakumbabang pagpapaubaya sa kalooban ng Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa יַעֲשֶׂה bilang hangarin o payak na hinaharap
  choice: gawin nawa ni Yahweh
  alternative: at gagawin ni Yahweh
  rationale: Kasunod ng mga panghihikayat, maaari itong magpahayag ng hangarin at pagpapaubaya, ngunit nananatiling posible sa anyong Hebreo ang pagbasa bilang payak na hinaharap; kaya inilalahad ang alternatibo sa talababa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili bilang pantanging pangalan ang Tetragrammaton sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magpakatatag” upang natural na maipahayag ang magkapares na pautos at cohortative, at “bayan” upang maiwasang paliitin ang עַם bilang hukbo lamang.
