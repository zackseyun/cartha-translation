  verdict: approve
  source_fidelity: 'Tapat ang salin sa sunod-sunod na pandiwang Hebreo: kinuha ni Hanun ang mga lingkod ni David, inahitan ang kalahati ng balbas ng bawat isa, pinutol ang mga kasuotan sa gitna hanggang sa bahaging tinutukoy ng pambihirang termino, at pinaalis sila. Hindi nito dinaragdagan ang antas ng dahas o ang tiyak na uri ng kasuotan.'
  naturalness: Natural at malinaw ang makabagong Filipino. Ang “mga lingkod ni David,” “inahitan ang kalahati ng kanilang mga balbas,” at “pinaalis sila” ay angkop sa salaysay. Tuwiran ngunit hindi bulgar ang “mga puwit” sa kontekstong historikal ng pampublikong kahihiyan.
  terminology: Ang “mga lingkod” ay sapat na malawak para sa עבד sa kontekstong mga sugo ng hari. Ang “mga kasuotan” ay hindi labis na tumitiyak sa uri ng damit. Ang pangunahing salin na “mga puwit” ay isang makatwirang pagbasa ng שְׁתוֹתֵיהֶם, at wastong pinananatili ng talababa ang pinagtatalunang anatomikong pagtukoy at mga alternatibo.
