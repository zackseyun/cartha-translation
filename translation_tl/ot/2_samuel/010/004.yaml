base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: tl
  text: Kaya kinuha ni Hanun ang mga lingkod ni David, inahitan ang kalahati ng kanilang mga balbas, pinutol sa gitna ang kanilang mga kasuotan hanggang sa kanilang mga puwit[a], at pinaalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa bahaging inuupuan nila” o “hanggang sa kanilang maseselang bahagi.” Bihira ang salitang Hebreo, kaya pinagtatalunan ang eksaktong bahagi ng katawan na tinutukoy. Malinaw sa konteksto na pinutol nang napakaikli ang kanilang mga kasuotan upang ilantad at hiyain sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang salaysay na diwa ng לקח; hindi dinaragdagan ng mas marahas na pahiwatig ng “dinakip,” bagaman malinaw sa konteksto na nasa kapangyarihan sila ni Hanun.
- source_word: עַבְדֵי דָוִד
  choice: mga lingkod ni David
  rationale: Maaaring tumukoy ang עבד sa alipin, lingkod, o opisyal. Bilang mga sugo sa paglilingkod sa hari, likas at sapat na malawak ang “mga lingkod.”
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: inahitan ang kalahati ng kanilang mga balbas
  rationale: Tuwirang ipinahahayag ang sadyang pag-ahit sa kalahati ng balbas ng bawat lalaki bilang kahihiyan.
- source_word: וַיִּכְרֹת
  choice: pinutol
  rationale: Ang כרת ay nangangahulugang putulin o tanggalin sa pamamagitan ng pagputol; ang “pinutol” ay natural para sa bahagi ng kasuotan.
- source_word: מַדְוֵיהֶם
  choice: kanilang mga kasuotan
  rationale: Malawak ang terminong Hebreo para sa kasuotan at hindi nito tiyak na tinutukoy kung balabal o ibang uri ng damit.
- source_word: בַּחֵצִי
  choice: sa gitna
  rationale: Pinananatili ang lokatibong diwa ng pagputol sa kalagitnaan ng kasuotan.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: hanggang sa kanilang mga puwit
  rationale: Malamang na tumutukoy ang pambihirang salitang שְׁתוֹת sa puwit o bahaging inuupuan. Tuwiran ang salin ngunit nilalagyan ng talababa dahil pinagtatalunan ang eksaktong anatomikong tinutukoy.
- source_word: וַיְשַׁלְּחֵם
  choice: pinaalis sila
  rationale: Natural na ipinahahayag ang pagpapayaon sa kanila matapos silang hiyain.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “mga lingkod” para sa mga tauhan o opisyal sa paglilingkod sa hari, at pinanatili sa talababa ang tunay na kawalang-katiyakan ng pambihirang terminong anatomiko.
