  source_fidelity: Kailangang itama ang tinutukoy ng paksa sa ikalawang sugnay. Ang pandiwang וַיַּעֲרֹךְ ay nagpapatuloy sa paksa na si Joab, hindi si Abisai. Ang paggamit ng “nito” sa draft ay maliwanag na tumutukoy kay Abisai at sa gayon ay nagbabago ng tinutukoy ng Hebreo.
  naturalness: Natural at marangal sa modernong Filipino ang “ipinagkatiwala niya sa kapatid niyang si Abisai” at “inayos niya ang mga ito sa hanay.” Mas malinaw ito kaysa sa panghalip na “nito,” na nagdudulot ng maling sanggunian.
  terminology: Ang “nalalabi sa hukbo” ay angkop sa kontekstong militar para sa יֶתֶר הָעָם. Ang “mga anak ni Ammon” ay tapat sa Hebreo; ang “mga Ammonita” ay angkop na alternatibo sa talababa. Pinananatili ang nakaugaliang pangalang “Abisai.”
