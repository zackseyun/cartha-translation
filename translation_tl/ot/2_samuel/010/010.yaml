translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'hukbo' upang linawin ang militar na kahulugan ng הָעָם, samantalang pinanatili ang Hebreong ekspresyong 'mga anak ni Ammon.' Ang panghalip na 'nito' ay nililinaw na si Abisai ang paksa ng paghahanay, ayon sa pinakamalapit na antecedent at daloy ng Hebreo.
