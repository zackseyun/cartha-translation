base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: tl
  text: At ang nalalabi sa hukbo ay ipinagkatiwala niya sa kapatid niyang si Abisai,[a] at inayos niya ang mga ito sa hanay upang harapin ang mga anak ni Ammon.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ibinigay niya sa kamay ng kapatid niyang si Abisai,” isang idyoma para sa pagpapaubaya ng hukbo sa kanyang pamumuno.'
    reason: lexical_alternative
  - marker: b
    text: 'O “mga Ammonita.” Hebreo: “mga anak ni Ammon.”'
    reason: lexical_alternative
  - marker: c
    text: O “inihanay niya sila” o “inilagay niya sila sa pormasyon para sa labanan.” Ang pandiwang Hebreo ay tumutukoy sa pag-aayos ng mga kawal sa hanay ng pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: ang nalabi sa hukbo
  rationale: Ang יֶתֶר ay tumutukoy sa nalabi, at bagaman literal na 'bayan/mga tao' ang הָעָם, malinaw sa kontekstong militar na ang tinutukoy ay ang nalalabing hukbo.
- source_word: נָתַן בְּיַד
  choice: ipinailalim niya sa pamumuno
  rationale: Ang literal na 'ibinigay sa kamay' ay isang idyoma ng pagtitiwala sa awtoridad ng isang tao; malinaw at natural sa Filipino ang napiling salin sa kontekstong militar.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
- source_word: אָחִיו
  choice: kapatid niyang
  rationale: Pinananatili ang tahasang ugnayang pampamilya; tumutukoy ang hulapi kay Joab.
- source_word: וַיַּעֲרֹךְ
  choice: inayos nito ang hanay nila
  rationale: Sa kontekstong militar, ang pandiwa ay nangangahulugang ihanay o ihanda ang mga kawal sa pormasyon para sa labanan.
- source_word: לִקְרַאת
  choice: upang harapin
  rationale: Ipinahihiwatig ng salita ang pagharap o pagsalubong; sa konteksto ng labanan, natural ang 'harapin' nang hindi dinaragdagan ang kahulugan.
- source_word: בְּנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Pinananatili nito ang literal na ekspresyong Hebreo at ang kaugnayan ng bayan sa ninunong si Ammon; maipaliliwanag sa talababa ang mas karaniwang 'mga Ammonita.'
