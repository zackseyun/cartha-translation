base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: tl
  text: Nang makalampas nang kaunti si David sa tuktok[a], naroon si Ziba, ang lingkod ni Mefiboset[b], upang salubungin siya. May dala siyang dalawang asnong may siyá, at nakalulan sa mga iyon ang dalawang daang tinapay, sandaang kumpol ng pasas, sandaang bungang tag-araw[c], at isang sisidlang-balat ng alak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang makalampas nang kaunti sa taluktok.” Literal na “kaunti mula sa ulo” ang Hebreo; ginagamit dito ang “ulo” para sa tuktok ng burol o bundok.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “lingkod” ay maaari ring mangahulugang “binata” o “alalay.” Sa kontekstong ito, malamang na tumutukoy ito sa tungkulin ni Ziba kay Mefiboset.
    reason: lexical_alternative
  - marker: c
    text: Ang “bungang tag-araw” ay maaaring mas tiyak na tumukoy sa mga igos, ngunit mas malawak ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: makalampas nang kaunti ... sa tuktok
  rationale: Ang רֹאשׁ ay literal na “ulo,” ngunit sa topograpikong konteksto ay tumutukoy sa tuktok. Natural na ipinahahayag ng parirala ang pagdaan ni David nang kaunti lampas dito.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinakikita ng marker ang bigla at kapansin-pansing paglitaw ni Ziba. Sa modernong Tagalog, likas na naihahatid ng “naroon” ang eksena nang hindi gumagamit ng arkaikong padamdam.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: ang lingkod ni Mefiboset
  rationale: Maaaring mangahulugang “binata,” “tagapaglingkod,” o “alalay” ang נַעַר. Dito, ang tungkulin ni Ziba kay Mefiboset ang binibigyang-diin, kaya “lingkod” ang pinakamalinaw.
- source_word: צֶמֶד חֲמֹרִים
  choice: dalawang asno
  rationale: Ang צֶמֶד ay isang pares. Mas natural sa Tagalog ang tuwirang bilang na “dalawang asno” kaysa “isang pares ng mga asno.”
- source_word: חֲבֻשִׁים
  choice: may mga síya
  rationale: Sa konteksto, ang mga asno ay inihanda para sakyan o magkarga. Ang “may mga síya” ay malinaw at materyal na tiyak.
- source_word: מָאתַיִם לֶחֶם
  choice: dalawang daang tinapay
  rationale: Karaniwang nabibilang sa Tagalog ang “tinapay” nang hindi kailangang idagdag ang “piraso” o “bilog.”
- source_word: צִמּוּקִים
  choice: kumpol ng pasas
  rationale: Tumutukoy ito sa mga pinatuyong ubas na magkakadikit o pinagsama; iniiwasan ng “kumpol” ang mas tiyak ngunit hindi tiyak na “bibingka ng pasas.”
- source_word: קַיִץ
  choice: bungang-ani sa tag-araw
  rationale: Maaaring tumukoy ang salita sa mga bungang-ani sa tag-araw, at sa ilang konteksto ay lalo na sa mga igos. Pinananatili ng salin ang mas malawak na kahulugan.
- source_word: נֵבֶל יָיִן
  choice: isang sisidlang-balat na puno ng alak
  rationale: Ang נֵבֶל dito ay lalagyang yari sa balat. Nililinaw ng “sisidlang-balat” ang sinaunang uri ng lalagyan, at ang “puno ng alak” ay natural na Tagalog para sa nilalaman nito.
