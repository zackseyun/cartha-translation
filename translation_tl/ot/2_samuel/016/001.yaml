translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “naroon” upang mapanatili ang biglang paglitaw na ipinahihiwatig ng וְהִנֵּה nang hindi maging arkaiko. Nilagyan ng tuldik ang “síya” upang hindi mapagkamalang panghalip na “siya.”
