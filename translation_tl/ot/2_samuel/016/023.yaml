base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: tl
  text: Ang payong ibinigay ni Ahitofel noong mga araw na iyon ay gaya ng pagsangguni ng isang tao sa Diyos[a]; gayon ang lahat ng payo ni Ahitofel para kay David at para kay Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gaya ng pagtatanong tungkol sa salita ng Diyos.” Ipinakikita ng paghahambing sa Hebreo kung gaano kataas ang pagtingin sa payo ni Ahitofel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: payo
  rationale: Ang “payo” ang natural at kasalukuyang salitang Filipino para sa payong ibinibigay ng isang tagapayo; pinananatili rin ang pag-uulit nito sa talata.
- source_word: יָעַץ
  choice: ibinibigay
  rationale: Sa pariralang “payong ibinibigay,” natural na naipahahayag ang pandiwang Hebreo nang hindi inuulit nang alanganin ang salitang “payo.”
- source_word: בַּיָּמִים הָהֵם
  choice: noong mga araw na iyon
  rationale: Tuwirang katumbas ito ng panahong tinutukoy at angkop sa marangal na salaysay.
- source_word: כַּאֲשֶׁר יִשְׁאַל
  choice: parang nagmumula sa pagsangguni
  rationale: Ipinahahayag nito ang paghahambing sa paghingi ng patnubay, hindi ang pagkakakilanlan ng payo ni Ahitofel sa pahayag ng Diyos.
- source_word: בִּדְבַר הָאֱלֹהִים
  choice: sa Diyos
  rationale: Sa konteksto, ang parirala ay tumutukoy sa pagsangguni sa Diyos para sa patnubay. Inilalagay sa talababa ang mas leksikal na posibilidad na “tungkol sa salita ng Diyos.”
- source_word: כֵּן
  choice: Ganoon itinuring
  rationale: Ginagawang natural sa Filipino ang maikli at eliptikong Hebreong “gayon,” habang iniuugnay ito sa pagpapahalagang inilalarawan ng paghahambing.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: kapwa ni David at ni Absalom
  rationale: Ang “kapwa … at …” ay natural na tumutumbas sa inuulit na גַּם … גַּם at nagpapakita na pareho nilang itinuring nang gayon ang kanyang payo.
theological_decisions:
- issue: Lakas ng paghahambing sa pagsangguni sa Diyos
  choice: Inilalarawan ang payo ni Ahitofel bilang itinuring na parang nagmula sa pagsangguni sa Diyos, nang hindi sinasabing iyon mismo ay kinasihang pahayag.
  alternative: Maaaring unawain ito bilang matinding pagmamalabis lamang tungkol sa taas ng paggalang sa kanyang payo, o bilang payong praktikal na gumaganap na gaya ng isang orakulo.
  rationale: Paghahambing ang gamit ng Hebreo, hindi tuwirang pagpapantay. Pinananatili ng salin ang pambihirang bigat ng kanyang payo ngunit hindi ito ginagawang banal na kapahayagan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “payo” sa halip na mas teknikal o makalumang “konsulta,” at pinanatili ang paghahambing at ang bahagyang elipsis ng Hebreo nang hindi nagdaragdag ng denominasyonal na paliwanag.
