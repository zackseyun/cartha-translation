base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: tl
  text: Sinabi ni Husai kay Absalom, “Hindi! Sapagkat sa taong pinili ni Yahweh, ng bayang ito, at ng bawat lalaki sa Israel ako papanig[a], at mananatili akong kasama niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tradisyonal na pagbasa sa Hebreo ay literal na “sa kanya ako magiging.” Ang nakasulat na mga katinig ay maaari namang basahing “hindi ako magiging.”
    reason: textual_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Hindi! Sa halip,
  rationale: Ang parirala ay mariing pagtanggi na sinusundan ng pagtutuwid. Mas natural sa modernong Tagalog ang “Hindi! Sa halip” kaysa sa literal na “Hindi, sapagkat,” habang pinananatili ang puwersa ng sagot.
- source_word: אֲשֶׁר בָּחַר
  choice: kung sino ang pinili
  rationale: Tinutukoy ng sugnay ang taong pinili; pinananatili ng “kung sino ang pinili” ang bahagyang kaluwagan ng anyong Hebreo nang hindi ipinapangalan kung sino iyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וְהָעָם הַזֶּה
  choice: ng bayang ito
  rationale: Ang עָם ay kolektibong pangngalan na isahan; ang “bayang ito” ay natural at malapit sa anyong Hebreo.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: at ng bawat lalaki sa Israel
  rationale: Pinananatili ang distributibong “bawat” at ang tahasang panlalaking אִישׁ, sa halip na gawing pangkalahatang “bawat Israelita.”
- source_word: לוֹ אֶהְיֶה (qere; ketiv לא אהיה)
  choice: sa kanya ako papanig
  rationale: Ang tradisyonal na pagbasa ay literal na “sa kanya ako magiging.” Sa konteksto ng katapatan sa hari, malinaw at natural ang “papanig,” habang itinatala sa talababa ang literal at tekstuwal na anyo.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: at mananatili akong kasama niya
  rationale: Bagaman ang יָשַׁב ay maaaring mangahulugang “umupo” o “tumira,” dito ay tumutukoy ito sa patuloy na pananatili at pakikisama.
theological_decisions:
- issue: Paglalarawan sa pagpili ni Yahweh, ng bayan, at ng mga lalaki ng Israel
  choice: kung sino ang pinili ni Yahweh, ng bayang ito, at ng bawat lalaki sa Israel
  alternative: ang taong pinili ni Yahweh at ng buong Israel
  rationale: Hindi pinagsasanib ang tatlong paksa bilang “buong Israel,” upang manatili ang retorikal na pagkakahanay at posibleng tensiyon sa pagitan ng banal at pampublikong pagpili.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pangalan din ang ginamit sa salin.
- issue: Katapatan ni Husai sa taong pinili
  choice: sa kanya ako papanig
  alternative: magiging kanya ako
  rationale: Ipinahahayag ng konteksto ang panig o katapatan, ngunit ang literal na pagbasa at pagkakaiba ng ketiv/qere ay pinananatili sa talababa upang hindi maitago ang tekstuwal na kalabuan.
translation_notes:
  register: Makabago at marangal na Filipino; simple ang pangungusap ngunit pinananatili ang mariing pagtanggi, ang tatluhang paksa ng pagpili, at ang tekstuwal na kalabuan sa huling sugnay.
