translation:
  language: tl
  text: At ikalawa, sino ang dapat kong paglingkuran? Hindi ba sa harap ng kanyang anak?[a] Kung paanong naglingkod ako sa harap ng iyong ama, gayon din ako magiging sa harap mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “sa harap ng kanyang anak … sa harap ng iyong ama … sa harap mo.” Isa itong idyomang pangmaharlika na tumutukoy sa paglilingkod sa presensiya o sa ilalim ng pamamahala ng isang hari.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: At ikalawa
  rationale: Likas na panandang diskurso sa Filipino para sa ikalawang katuwiran ni Husai.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: sino ang dapat kong paglingkuran
  rationale: Sa kontekstong maharlika, ang עבד ay paglilingkod na nagpapahayag ng katapatan; ipinakikita ng “dapat” ang puwersa ng retorikal na tanong.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Hindi ba sa harap ng kanyang anak?
  rationale: Pinananatili ang inaasahang positibong sagot ng הֲלוֹא at ang paulit-ulit na idyomang לִפְנֵי, sa halip na burahin ang larawang panghukuman.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Kung paanong naglingkod ako sa harap ng iyong ama
  rationale: Pinananatili ang paghahambing at ang maharlikang idyoma ng paglilingkod sa harap ng hari.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: gayon din akong maglilingkod sa harap mo
  rationale: Bagaman literal na “gayon ako magiging sa harap mo,” kailangang ipahiwatig muli ang paglilingkod upang maging natural at malinaw sa modernong Filipino; nananatili ang “sa harap mo” upang maingatan ang paralelismo.
