translation:
  language: tl
  text: Binato niya si David at ang lahat ng lingkod ni Haring David[a], samantalang ang lahat ng mga tao at ang lahat ng magigiting na mandirigma ay nasa kanan at kaliwa ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinukol niya ng mga bato si David at ang lahat ng lingkod ni Haring David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: Binato niya
  rationale: Ang piel ng סקל kasama ng בָּאֲבָנִים ay tumutukoy sa paghagis ng mga bato laban sa isang tao. Likas at malinaw sa modernong Tagalog ang “binato,” at hindi nito ipinahihiwatig na isa itong pormal na paglalapat ng parusang kamatayan.
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Malawak ang saklaw ng עבד, ngunit dito ay tumutukoy ito sa mga taong naglilingkod sa hari. Pinananatili ng “mga lingkod” ang lawak ng salita nang hindi ipinapalagay na sila ay mga alipin.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Natural na pamagat at pangalan sa Tagalog ang “Haring David,” na malinaw na nagpapanatili sa pagkahari ni David.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Ang עָם ay karaniwang “bayan” o “mga tao.” Sa konteksto, tumutukoy ito sa buong pangkat na kasama ni David at hindi lamang sa mga kawal.
- source_word: הַגִּבֹּרִים
  choice: mga magigiting na mandirigma
  rationale: Ang גִּבּוֹרִים dito ay malamang na mga kilalang lalaking mandirigma ni David. Mas malinaw sa karaniwang mambabasa ang “magigiting na mandirigma” kaysa sa literal na “malalakas na lalaki.”
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: nasa kanan at kaliwa ni David
  rationale: Ipinapakita ng parirala ang pagkakapuwesto sa magkabilang panig. Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa Tagalog; si David ang pinakamalamang na tinutukoy ayon sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binato” bilang likas na paglalarawan ng pag-atake, at “magigiting na mandirigma” upang maipahayag ang militaryong diwa ng הַגִּבֹּרִים. Nilinaw ang huling panghalip bilang “ni David” para sa natural na pagbasa.
