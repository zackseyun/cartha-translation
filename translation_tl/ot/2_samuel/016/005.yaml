translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “angkan” at “sambahayan” upang mapanatili ang magkaibang antas ng ugnayang pampamilya at dinastiko. Inilagay ang talababa sa pangungusap na may pinatinding konstruksiyong Hebreo.
