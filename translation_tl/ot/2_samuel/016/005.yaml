base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: tl
  text: Nang dumating si Haring David sa Bahurim, narito, may isang lalaking lumabas mula roon. Siya ay mula sa angkan ng sambahayan ni Saul, at ang pangalan niya ay Simei na anak ni Gera. Patuloy siyang lumalabas habang sumusumpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paulit-ulit siyang lumalabas at sumusumpa.” Pinatitingkad ng Hebreo ang pandiwang “lumabas” (participle + infinitive absolute), na malamang ay nagpapahayag ng paulit-ulit o tuloy-tuloy na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: Nang dumating si Haring David sa Bahurim
  rationale: Ang waw + qatal ay nagpapatuloy sa salaysay, ngunit dito ay nagsisilbing panahong tagpuan para sa kasunod na pangyayari; natural sa Tagalog ang “Nang dumating.” Ang עַד ay tumutukoy sa pag-abot sa lugar.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinahihiwatig ang bigla at kapansin-pansing paglitaw ng lalaki nang hindi gumagamit ng di-natural na literalismong “masdan.”
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: ang isang lalaking lumabas mula roon
  rationale: Ang participle ay naglalarawan sa paglabas na nasaksihan sa tagpo; malinaw at natural ang nakaraang aspekto sa Tagalog.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: Kabilang siya sa angkan ng sambahayan ni Saul
  rationale: Ang מִשְׁפָּחָה ay mas malawak na pangkat ng magkakamag-anak o angkan, samantalang pinananatili ng “sambahayan ni Saul” ang dinastiko at pampamilyang diwa ng בֵּית.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: ang pangalan niya ay Simei na anak ni Gera
  rationale: Natural na pormula ng pagkakakilanlan sa modernong Tagalog na nagpapanatili sa pangalan at kaugnayang pampamilya.
- source_word: יֹצֵא יָצוֹא
  choice: Patuloy siyang lumalabas
  rationale: Ang participle na sinundan ng infinitive absolute ay nagbibigay-diin sa tuloy-tuloy o paulit-ulit na kilos; pinananatili ng “patuloy” ang saklaw na ito.
- source_word: וּמְקַלֵּל
  choice: habang nanunumpa
  rationale: Ang participle ay kasabay ng patuloy na paglabas. Sa konteksto, ang piel ng קלל ay tumutukoy sa pagbigkas ng sumpa o panlalait, kaya ang “nanunumpa” ay angkop at dignified.
