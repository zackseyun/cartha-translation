revisions:
- from: Nang dumating si Haring David sa Bahurim, naroon ang isang lalaking lumabas mula roon. Kabilang siya sa angkan ng sambahayan ni Saul, at ang pangalan niya ay Simei na anak ni Gera. Patuloy siyang lumalabas habang nanunumpa.[a]
  to: Nang dumating si Haring David sa Bahurim, narito, may isang lalaking lumabas mula roon. Siya ay mula sa angkan ng sambahayan ni Saul, at ang pangalan niya ay Simei na anak ni Gera. Patuloy siyang lumalabas habang sumusumpa.[a]
