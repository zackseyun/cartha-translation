base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: tl
  text: Dumating ang hari at ang buong bayang kasama niya na pagod na, at nagpahinga siya roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isahan ang pandiwa sa Hebreo: “nagpahinga siya” o “nanariwa siya.” Maaari rin itong unawain nang kolektibo: “nagpahinga sila.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ipinahihiwatig ng בוא dito ang pagdating sa isang lugar; natural sa salaysay ang “dumating.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang pinananatili ang titulong ginamit sa Hebreo, sa halip na palitan ito ng pangalang David.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: at ang buong bayang kasama niya
  rationale: Pinananatili ang saklaw ng כָּל at ang diwa ng sugnay na “na kasama niya,” sa natural na Filipino.
- source_word: עֲיֵפִים
  choice: na pagod na
  rationale: Ang pang-uri ay tumutukoy sa pisikal na pagkapagod; malinaw at karaniwan sa modernong Filipino ang “pagod na.”
- source_word: וַיִּנָּפֵשׁ
  choice: at nagpahinga siya
  rationale: Ang pandiwa ay nasa isahan at may diwang pagpapanumbalik ng lakas o paghinga. Pinananatili ng “siya” ang tunay na anyong isahan, habang natural na ipinahahayag ng “nagpahinga” ang diwa sa Filipino.
- source_word: שָׁם
  choice: roon
  rationale: Karaniwang pang-abay na tumutukoy sa lugar na narating at pinagpahingahan.
theological_decisions:
- issue: Kung ang nagpahinga ay ang hari lamang o ang buong pangkat
  choice: Pinanatili sa pangunahing teksto ang isahang “nagpahinga siya.”
  alternative: “nagpahinga sila” bilang kolektibong pag-unawa ayon sa maramihang pangkat na kababanggit lamang
  rationale: Isahan ang pandiwang Hebreo, kaya hindi ito tahimik na ginawang maramihan. Gayunman, binabanggit sa talababa ang makatuwirang kolektibong pag-unawa upang mapanatili ang tunay na kalabuan ng pangungusap.
translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang “bayan” para sa עָם bilang pangkat ng mga taong kasama ng hari, at pinanatili sa pangunahing teksto ang isahang pandiwa ng Hebreo.
