id: 2SA.16.8
reference: 2 Samuel 16:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: tl
  text: Ibinalik ni Yahweh sa iyo ang lahat ng dugong ibinuhos sa sambahayan ni Saul[a], na hinalinhan mo sa paghahari. Ibinigay ni Yahweh ang kaharian sa kamay ng anak mong si Absalom. At tingnan mo, nasa iyong kapahamakan ka[b], sapagkat isa kang taong nagbububo ng dugo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng pagdanak ng dugo sa sambahayan ni Saul” o “ang buong pananagutan sa dugo ng sambahayan ni Saul.” Literal na “ang lahat ng mga dugo ng sambahayan ni Saul” ang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nasa iyong kasamaan ka.” Ang salitang Hebreo ay maaaring tumukoy sa moral na kasamaan o sa kapahamakan o sakuna; sa kontekstong ito, malamang na ang kapahamakang sumapit kay David ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: Ang “taong nagbububo ng dugo” ay maaari ring isaling “taong may pananagutan sa dugo” o, nang mas literal, “taong may mga dugo.” Tumutukoy ang idyoma sa isang taong kilala sa karahasan o nababahiran ng pananagutan sa pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: Ibinalik sa iyo
  rationale: 'Pinananatili nito ang sanhi at pagbabalik na diwa ng Hiphil ng שוב: ang ibinubuhos na dugo o pananagutan dito ay pinabalik ni Yahweh kay David.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
  choice: ang lahat ng dugong ibinuhos sa sambahayan ni Saul
  rationale: Ang maramihang דמים ay idyomang maaaring tumukoy sa dugong ibinuhos o pananagutan sa pagdanak ng dugo. Likas sa Tagalog ang 'dugong ibinuhos' at hindi nito ipinahihiwatig na dugo mismo ni Saul lamang ang tinutukoy.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: na hinalinhan mo bilang hari
  rationale: Ipinahahayag ng תחתיו ang paghahari ni David sa lugar o bilang kahalili ni Saul.
- source_word: וַיִּתֵּן ... אֶת הַמְּלוּכָה בְּיַד
  choice: Ibinigay ... ang kaharian sa kamay
  rationale: Pinananatili ang Hebreong larawan ng paglilipat ng pamamahala o kapangyarihan sa kamay ng isang tao.
- source_word: וְהִנְּךָ
  choice: At masdan mo
  rationale: Nagbibigay-pansin ang הנה sa kalagayan ni David; marangal ngunit nauunawaan pa rin ang 'masdan mo' sa makabagong Tagalog.
- source_word: בְּרָעָתֶךָ
  choice: dinaranas mo ngayon ang sarili mong kapahamakan
  rationale: Sa konteksto, malamang na tumutukoy ang רעה sa sakuna o kapahamakang sumapit kay David. Ang talab ng hulaping 'iyong' ay pinananatili sa 'sarili mong,' habang inilalagay sa talababa ang tunay na posibilidad na 'kasamaan' ang ibig sabihin.
- source_word: אִישׁ דָּמִים
  choice: isang taong nagbububo ng dugo
  rationale: Likas na Tagalog na idyoma ito para sa taong namumukod sa pagdanak ng dugo, nang hindi agad nililimitahan ang paratang sa pagiging uhaw sa dugo o sa pormal na pagkakasala lamang.
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa teksto.
- issue: Kahulugan ng בְּרָעָתֶךָ
  choice: sarili mong kapahamakan
  alternative: sarili mong kasamaan
  rationale: Itinuturo ng agarang konteksto ang kapahamakang dulot ng paghihimagsik ni Absalom, ngunit inilalahad sa talababa ang moral na kahulugang nananatiling posible. Hindi ipinakikitang sinasang-ayunan ng tagapagsalaysay ang teolohikal na paratang ni Simei.
- issue: Paratang na אִישׁ דָּמִים
  choice: taong nagbububo ng dugo
  alternative: taong may pananagutan sa dugo
  rationale: Pinananatili ang matinding paratang ni Simei at ang saklaw nito sa karahasan o pagkakasala sa dugo, nang hindi nagdaragdag ng hatol mula sa tagapagsalaysay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” para sa dinastikong diwa ng בֵּית, “hinalinhan” para sa paghahari sa lugar ni Saul, at “masdan mo” bilang malinaw ngunit hindi kolokyal na pantawag-pansin. Ang mga panandang [a], [b], at [c] ay nakalagay mismo sa pangunahing teksto at tumutugma sa mga talababa.
