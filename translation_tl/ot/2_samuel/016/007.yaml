  to: 'At ito ang sinabi ni Simei habang isinusumpa niya si David: “Lumayas ka, lumayas ka, taong may-sala sa pagbububo ng dugo[a] at taong walang kabuluhan[b]!”'
  rationale: Idinagdag ang “at” upang maipakita ang tahasang pag-uugnay ng dalawang magkakatumbas na bansag sa Hebreo. Pinagaan ang pambungad para sa likas na modernong Filipino at pinili ang “may-sala sa pagbububo ng dugo” upang maihatid ang paratang ng bloodguilt nang walang dagdag na pagpapakahulugan tungkol sa motibo. Napanatili ang mga angkla ng talababa at ang kawalang-katiyakan sa leksikal na mga alternatibo.
