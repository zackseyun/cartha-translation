base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: tl
  text: 'At ito ang sinabi ni Simei habang isinusumpa niya si David: “Lumayas ka, lumayas ka, taong may-sala sa pagbububo ng dugo[a] at taong walang kabuluhan[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “tao ng mga dugo,” isang idyoma para sa taong may pananagutan sa pagbububo ng dugo o marahas na pagpatay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “masamang tao” o “hamak na tao.” Ang Hebreong “tao ng belial” ay isang idyoma para sa taong walang kabuluhan o masama, at hindi kinakailangang tumukoy sa pangalang pantanging “Belial.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: At ganito ang sinabi
  rationale: Likas na panimulang pormula sa Filipino na pinananatili ang puwersa ng ‘at ganito’ bago ang tuwirang sinabi.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na Shimei.
- source_word: בְּ/קַֽלְל/וֹ
  choice: habang isinusumpa niya si David
  rationale: Ang preposisyon na may infinitive construct at hulaping panghalip ay nagsasaad ng kasabay na kilos. Nilinaw bilang ‘David’ ang tinutukoy ng panghalip ayon sa konteksto.
- source_word: צֵא צֵא
  choice: Lumayas ka! Lumayas ka
  rationale: Ang inuulit na pautos ay mariing pagtataboy; ang ‘lumayas’ ay natural at sapat ang tindi sa makabagong Filipino.
- source_word: אִישׁ הַ/דָּמִים
  choice: taong nagkasala sa pagbububo ng dugo
  rationale: Ang literal na maramihang ‘mga dugo’ ay idyoma para sa pagkakasala dahil sa marahas na pagpatay o pagbububo ng dugo. Iniiwasan nitong ipakahulugan na likas na uhaw sa dugo ang tao.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: taong walang kabuluhan
  rationale: Pinananatili ang ikalawang magkatumbas na bansag. Dito ang beliyya‘al ay karaniwang pangngalang panlalait na tumutukoy sa pagiging hamak o walang kabuluhang moral, hindi kinakailangang pangalang pantangi.
theological_decisions:
- issue: Pagpapakahulugan sa אִישׁ הַדָּמִים
  choice: taong nagkasala sa pagbububo ng dugo
  alternative: taong uhaw sa dugo
  rationale: Ang Hebreong idyoma ay maaaring tumukoy sa pananagutan sa pagbububo ng dugo; ang ‘uhaw sa dugo’ ay maaaring magdagdag ng motibong hindi tahasang sinasabi.
- issue: Pagpapakahulugan sa בְּלִיַּעַל
  choice: 'karaniwang bansag: ‘taong walang kabuluhan’'
  alternative: ‘masamang tao’ o ‘tao ni Belial’
  rationale: Sa kontekstong ito, ang salita ay isang panlalait tungkol sa moral na kawalang-halaga o kasamaan. Ang ‘Belial’ bilang pangalang pantangi ay maaaring magpasok ng mas huling personipikasyon na hindi hinihingi ng teksto.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang ‘lumayas’ upang maipakita ang bagsik ng dobleng pautos, at inulit ang ‘taong’ upang mapanatili ang paralelismo ng dalawang bansag sa Hebreo.
