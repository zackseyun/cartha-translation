  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וְ/אַיֵּ֖ה בֶּן אֲדֹנֶ֑י/ךָ וַ/יֹּ֨אמֶר צִיבָ֜א אֶל הַ/מֶּ֗לֶךְ הִנֵּה֙ יוֹשֵׁ֣ב בִּ/ירוּשָׁלִַ֔ם כִּ֣י אָמַ֔ר הַ/יּ֗וֹם יָשִׁ֤יבוּ לִ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל אֵ֖ת מַמְלְכ֥וּת אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: tl
  text: At sinabi ng hari, “At nasaan ang anak ng iyong panginoon?” Sinabi ni Ziba sa hari, “Narito, nananatili siya sa Jerusalem[a], sapagkat sinabi niya, ‘Sa araw na ito, ibabalik sa akin ng sambahayan ng Israel ang kaharian ng aking ama.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatira siya sa Jerusalem.” Ang Hebreong participle ay maaaring mangahulugan ng patuloy na pagtira o pananatili sa isang lugar, hindi lamang ng literal na pag-upo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: At sinabi ng hari
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa marangal na salaysay sa Tagalog ang “At sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: וְאַיֵּה
  choice: At nasaan
  rationale: Pinananatili ang pang-ugnay at ang tuwirang tanong tungkol sa kinaroroonan.
- source_word: בֶּן אֲדֹנֶיךָ
  choice: ang anak ng iyong panginoon
  rationale: Tumutukoy ang אֲדֹנֶיךָ sa taong pinaglilingkuran ni Ziba. Ang “panginoon” ay pormal ngunit malinaw rito at hindi ginagamitan ng malaking titik upang hindi ipakahulugang banal na titulo.
- source_word: הִנֵּה
  choice: Narito
  rationale: Inihaharap nito ang tugon ni Ziba at likas na katumbas ng deiktikong puwersa ng Hebreo.
- source_word: יוֹשֵׁב
  choice: nananatili
  rationale: Ang participle ng ישׁב ay maaaring tumukoy sa pananatili o patuloy na pagtira sa isang lugar, hindi lamang sa literal na pag-upo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilang ibinigay ni Ziba; ang “sapagkat” ay malinaw at angkop sa dignified na salaysay.
- source_word: הַיּוֹם
  choice: Sa araw na ito
  rationale: Pinananatili ang tahasang temporal na diin ng pahayag.
- source_word: יָשִׁיבוּ לִי
  choice: ibabalik sa akin
  rationale: Ang Hiphil ng שוב ay nangangahulugang ipabalik o isauli; ang “ibabalik sa akin” ay natural sa bagay na tinutukoy na kaharian.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ang sambahayan ng Israel
  rationale: Pinananatili ang kolektibo at pambansang larawan ng Hebreong parirala sa halip na paikliin lamang bilang “Israel.”
- source_word: מַמְלְכוּת אָבִי
  choice: ang kaharian ng aking ama
  rationale: Malapit ito sa ayos at kahulugan ng Hebreo at hindi nito nilulutas o binabago ang ugnayang ipinahayag sa siniping pananalita.
theological_decisions:
- issue: Ang paratang ni Ziba tungkol sa motibo ng anak ng kanyang panginoon
  choice: Tuwirang iniulat ang sinabi ni Ziba nang hindi pinatutunayang totoo iyon.
  alternative: Dagdagan ng mga salitang nagpapahiwatig ng pag-aalinlangan, gaya ng “sinabi raw” o “inaangkin niyang sinabi.”
  rationale: Iniulat lamang ng Hebreo ang sinabi ni Ziba. Ang pagdaragdag ng tahasang pagdududa ay magpapasok ng paghatol na wala sa talata; hinahayaan ng salin na ang mas malawak na konteksto ang sumuri sa paratang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong “sambahayan ng Israel” at ang pormal na “panginoon” upang maipakita ang panlipunang ugnayan at kolektibong pahayag ng pinagmulan. Inilagay ang talababa sa “Jerusalem,” kaagad pagkatapos ng pariralang saklaw ng leksikal na alternatibo.
