  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang sunod-sunod na salaysay, ang tanong ng hari, ang pagtukoy kay Ziba sa anak ng kanyang panginoon, ang pananatili sa Jerusalem, at ang iniulat na motibo hinggil sa pagbabalik ng kaharian ng ama.'
  naturalness: Natural at malinaw ang makabagong Filipino, habang ang bahagyang pormal na himig ng “panginoon,” “sapagkat,” at “sambahayan ng Israel” ay angkop sa salaysay. Ang “Narito” ay katanggap-tanggap na katumbas ng panandang pagpapakilala sa tugon ni Ziba.
