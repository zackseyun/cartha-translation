revisions:
- from: Kaya nagpatuloy sa daan si David at ang kanyang mga tauhan. Samantala, nagpatuloy rin si Shimei sa gilid ng burol, sa tapat ni David. Habang naglalakad, patuloy siyang sumusumpa, naghahagis ng mga bato sa tapat ni David,[a] at nagsasaboy ng alikabok.
  to: Kaya nagpatuloy sa daan si David at ang kanyang mga tauhan. Samantala, nagpatuloy rin si Shimei sa gilid ng burol, sa tapat ni David. Habang naglalakad siya, patuloy siyang sumusumpa, naghahagis ng mga bato kay David,[a] at naghahagis ng alikabok.
  rationale: Inayos ang ikalawang paglitaw ng pariralang panglugar upang maging malinaw sa Filipino na ang mga bato ay inihahagis kay David, hindi lamang sa isang lugar na nasa harapan niya. Itinatala ng talababa ang literal na pag-uulit ng Hebreo. Pinalitan din ang “nagsasaboy” ng “naghahagis” upang mas tumpak na maipahayag ang mapanuyang pagkahagis ng alikabok.
