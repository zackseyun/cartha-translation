base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: tl
  text: Kaya nagpatuloy sa daan si David at ang kanyang mga tauhan. Samantala, nagpatuloy rin si Shimei sa gilid ng burol, sa tapat ni David. Habang naglalakad siya, patuloy siyang sumusumpa, naghahagis ng mga bato kay David,[a] at naghahagis ng alikabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “naghahagis ng mga bato sa tapat niya,” na inuulit ang pananalitang “sa tapat niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: sa daan
  rationale: Ang דֶּרֶךְ ay karaniwang tumutukoy sa daan o landas. Ang “sa daan” ay konkreto, natural, at malinaw na nagsasaad ng rutang tinatahak ni David.
- source_word: בְּצֵלַע הָהָר
  choice: sa gilid ng burol
  rationale: Ang צֵלַע ay “tagiliran/gilid,” at kasama ng הָהָר ay tumutukoy sa dalisdis o gilid ng burol/bundok. Pinananatili ng salin ang topograpikong kaibahan sa daang tinatahak ni David.
- source_word: לְעֻמָּתוֹ
  choice: sa tapat ni David
  rationale: Ipinahihiwatig ng parirala ang posisyong katapat o kahilera. Inulit ito sa salin dahil dalawang beses din itong lumilitaw sa Hebreo; ginamit ang pangalan upang maiwasan ang malabong panghalip.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: nagpatuloy rin ... Habang naglalakad, patuloy
  rationale: Ang magkaugnay na anyo ng הלך ay nagbibigay-diin sa tuloy-tuloy na pagkilos. Inihahayag ito sa natural na Filipino nang hindi ginagawang mekanikal ang pag-uulit.
- source_word: וַיְקַלֵּל
  choice: patuloy siyang sumusumpa
  rationale: Sa Piel, ang קלל ay nangangahulugang “sumumpa” o “manumpa laban sa.” Ipinapakita ng “patuloy” ang duratibong kilos sa konteksto.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: naghahagis ng mga bato
  rationale: Maaaring mangahulugan ang סקל ng pagbato bilang pagpatay, ngunit dito ay inilalarawan ang patuloy na panggugulo mula sa gilid ng burol. Iniiwasan ng “naghahagis ng mga bato” ang di-kinakailangang pahiwatig ng pormal na pagbitay.
- source_word: וְעִפַּר בֶּעָפָר
  choice: nagsasaboy ng alikabok
  rationale: Ang magkaugnay na pandiwa at pangngalan ay naglalarawan ng paghahagis o pagsasaboy ng lupa/alabok bilang mapanlait na kilos. Natural at malinaw sa Filipino ang “nagsasaboy ng alikabok.”
- source_word: וַאֲנָשָׁיו
  choice: ang kanyang mga tauhan
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking kasama o tagasunod ni David. Ang “mga tauhan” ay likas at angkop sa salaysay.
- source_word: וַיֵּלֶךְ
  choice: nagpatuloy
  rationale: Bagaman payak na “pumunta/lumakad” ang הלך, ipinahihiwatig ng daloy ng salaysay na nagpatuloy si David sa paglalakbay sa kabila ng pang-aabuso ni Shimei.
