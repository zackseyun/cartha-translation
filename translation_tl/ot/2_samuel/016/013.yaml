  source_fidelity: 'Tumpak ang kabuuang daloy: magkasabay na nagpapatuloy si David kasama ng kanyang mga tauhan at si Shimei sa gilid ng burol na katapat niya, habang patuloy na nanunumpa, naghahagis ng bato, at naghahagis ng alikabok. Gayunman, ang “naghahagis ng mga bato sa tapat ni David” ay maaaring mangahulugang inihahagis lamang ang mga bato sa lugar na nasa harapan ni David, sa halip na kay David. Ang ikalawang לְעֻמָּתוֹ ay mas natural na ipinahahayag sa Filipino bilang direksiyon ng paghahagis, habang itinatala sa talababa ang literal na pananalita.'
  naturalness: Natural ang karamihan ng salin at ang marangal na register nito. Mas malinaw at mas idiomatiko ang “naghahagis ng mga bato kay David” kaysa “naghahagis ng mga bato sa tapat ni David.” Ang “naghahagis ng alikabok” ay mas tuwirang tumutugma sa kilos kaysa “nagsasaboy ng alikabok.”
  terminology: Ang “daan,” “mga tauhan,” “gilid ng burol,” at “sumusumpa” ay angkop sa modernong Filipino Tagalog at sa kontekstong pasalaysay. Pinanatili ang “sa tapat ni David” para sa unang paglitaw ng לְעֻמָּתוֹ at nilinaw sa talababa ang literal na ikalawang paglitaw nang hindi pinipilit ang hindi likas na pag-uulit sa pangunahing teksto.
