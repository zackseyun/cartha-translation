translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang topograpiya, ang tuloy-tuloy na pagkilos, at ang dalawang paglitaw ng לְעֻמָּתוֹ. Ginamit ang “ni David” sa halip na paulit-ulit na “niya” upang maging malinaw kung sino ang tinutukoy.
