base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: tl
  text: Sinabi ng hari kay Ziba, “Tingnan mo, sa iyo na ang lahat ng pag-aari ni Mefiboset.” Sinabi ni Ziba, “Yumuyukod ako sa inyo. Nawa'y kalugdan ninyo ako, panginoon kong hari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang pantawag-pansing diin ng Hebreo sa natural na makabagong Tagalog.
- source_word: לְךָ כֹּל אֲשֶׁר לִמְפִי בֹשֶׁת
  choice: sa iyo na ang lahat ng pag-aari ni Mefiboset
  rationale: Ipinahahayag ang paglilipat ng pagmamay-ari na ipinasiya ng hari; ang “na” ay likas sa Tagalog para sa bagong kalagayang ito.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: Yumuyukod ako sa inyo
  rationale: Tumutukoy sa pagpapatirapa o pagyukod bilang paggalang sa hari; hindi ito pinalalabas na pagsambang panrelihiyon.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: Nawa'y kalugdan ninyo ako
  rationale: Natural na katumbas ng idyomang Hebreo na literal na “makasumpong ng biyaya sa iyong mga mata.”
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Pinananatili ang magalang na titulong pantao at ang kaugnayan ng unang panauhan nang hindi ito iniuugnay sa banal na pangalang PANGINOON.
theological_decisions:
- issue: Kahulugan ng pagyukod ni Ziba
  choice: Ipinahayag bilang paggalang at pagpapasakop sa hari
  alternative: Isalin bilang “sumasamba ako”
  rationale: Sa kontekstong maharlika, ang pandiwa ay tumutukoy sa pisikal na pagpapatirapa o pagyukod sa nakatataas; ang “sumasamba” ay maaaring magpasok ng hindi nilalayong panrelihiyong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na “inyo/ninyo” sa pakikipag-usap sa hari at ang karaniwang anyong pangalang “Mefiboset.”
