  - severity: low
    issue: Medyo hindi natural ang ‘mga bungang-ani sa tag-araw.’
    rationale: Ang parirala ay maaaring magmukhang paulit-ulit, dahil ang ‘bungang-ani’ ay may ideya na ng ani. Ang ‘mga bunga ng tag-araw’ ay payak at pinananatili ang hindi tiyak na uri ng produkto.
