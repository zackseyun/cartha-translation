  naturalness: 'Kailangan ng maliit ngunit mahalagang pagsasaayos upang maging natural ang paralelismong Tagalog: ‘para sakyan/kainin/inumin ng ...’ Mas malinaw rin ang ‘mga bunga ng tag-araw’ kaysa ‘mga bungang-ani sa tag-araw,’ na medyo mabigat at paulit-ulit ang dating.'
  terminology: Ang ‘asno,’ ‘sambahayan ng hari,’ ‘tinapay,’ ‘ilang,’ at ‘mga kabataang lalaki’ ay angkop. Pinanatili ang alternatibong tala para sa mas malawak na kahulugan ng קַיִץ at sa posibleng kahulugang ‘mga tauhan/lingkod’ ng נְעָרִים.
