base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari kay Ziba, “Para saan ang mga ito?” Sumagot si Ziba, “Ang mga asno ay para sakyan ng sambahayan ng hari; ang tinapay at mga bunga ng tag-araw[a] ay para kainin ng mga kabataang lalaki[b]; at ang alak ay para inumin ng sinumang mapagod sa ilang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ani sa tag-araw.” Maaaring tumukoy ang salitang Hebreo sa iba't ibang bunga o produktong inaani sa panahong iyon.
    reason: lexical_alternative
  - marker: b
    text: O “mga kabataang tauhan” o “mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: Para saan ang mga ito?
  rationale: Likas na tanong ito sa modernong Tagalog tungkol sa layunin ng mga dalang bagay, habang pinananatili ang diwa ng literal na Hebreong ‘Ano ang mga ito sa/para sa iyo?’
- source_word: הַחֲמוֹרִים
  choice: mga asno
  rationale: Karaniwan at tumpak na katawagan sa hayop sa dignidad na angkop sa salin ng Kasulatan.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: sambahayan ng hari
  rationale: Ang בֵּית dito ay tumutukoy sa pangkat ng pamilya at mga tauhan ng hari, hindi lamang sa gusaling tinitirhan niya.
- source_word: לִרְכֹּב
  choice: masasakyan
  rationale: Natural na Tagalog na nagpapahayag ng layunin ng mga asno nang hindi na nangangailangan ng tahasang katumbas ng Ingles na ‘on.’
- source_word: הַלֶּחֶם
  choice: tinapay
  rationale: Pinananatili ang payak at tiyak na kahulugan, yamang hiwalay na binanggit ang iba pang pagkain.
- source_word: הַקַּיִץ
  choice: mga bungang-ani sa tag-araw
  rationale: Hindi tinutukoy ng Hebreo ang isang partikular na uri ng bunga; ang parirala ay nagpapanatili sa masaklaw na kahulugan ng bungang o produktong inaani sa tag-araw.
- source_word: הַנְּעָרִים
  choice: mga kabataang lalaki
  rationale: Pinananatili ang pangunahing leksikal na diwa, bagaman maaari rin itong tumukoy sa mga kabataang tauhan o tagapaglingkod sa pangkat ng hari.
- source_word: הַיָּעֵף
  choice: sinumang napapagod
  rationale: Ang pang-isahang pang-uri ay ginagamit sa panlahatang diwa; likas na ipinahahayag ito sa Tagalog bilang sinumang taong napapagod.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang ‘ilang’ ay maikli, natural, at sapat na malawak para sa lupaing masukal, tigang, o malayo sa pamayanan, nang hindi nililimitahan ito sa mabuhanging disyerto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘sambahayan’ para sa pangkat ng hari at ang ‘ilang’ para sa malawak na kahulugan ng מִדְבָּר. Inayos ang magkakaugnay na sugnay gamit ang tuldok-kuwit upang maging malinaw ang tatlong layunin ng mga dala ni Ziba.
