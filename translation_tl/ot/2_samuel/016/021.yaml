  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: tl
  text: Sinabi ni Ahitofel kay Absalom, “Sipingan mo ang mga kinakasama ng iyong ama[a], na iniwan niya upang magbantay sa bahay. Sa gayon, mababalitaan ng buong Israel na naging kasuklam-suklam ka sa iyong ama[b], at lalakas ang loob ng lahat ng kasama mo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sipingan” ay katumbas ng Hebreong eupemismo na literal na “pumasok sa,” na tumutukoy rito sa pakikipagtalik. Ang mga kinakasama ay mga babaeng may kinikilalang katayuan bilang asawa, ngunit mas mababa kaysa pangunahing asawa.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “naging karima-rimarim ka sa iyong ama.” Literal na ipinahihiwatig ng pandiwang Hebreo ang pagiging mabaho o nakapandidiri, bilang larawan ng pagiging kasuklam-suklam.'
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “lalakas ang mga kamay ng lahat ng kasama mo,” isang idyoma para sa pagkakaroon ng tapang o tibay ng loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: Sipingan mo
  rationale: Seksuwal na eupemismo ang pariralang Hebreo sa kontekstong ito. Malinaw ngunit hindi mahalay ang “sipingan,” at pinananatili nito ang dignidad at bigat ng payo.
- source_word: פִּלַגְשֵׁי
  choice: mga kinakasama
  rationale: Tumutukoy ito sa mga babaeng may kinikilalang ugnayang marital ngunit mas mababa ang katayuan kaysa pangunahing asawa. Mas madaling maunawaan sa modernong Filipino ang “mga kinakasama”; nililinaw ng talababa ang sinaunang katayuan.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: iniwan niya upang magbantay sa palasyo
  rationale: Pinananatili ng “magbantay” ang kahulugan ng שׁמר. Sa konteksto ng sambahayan ng hari, natural na tumutukoy ang הַבָּיִת sa palasyo o maharlikang tahanan.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Sa gayon, mababalitaan ng buong Israel
  rationale: Ipinahahayag ng sugnay ang inaasahang bunga ng utos. Ang “buong Israel” ay kolektibong tumutukoy sa bayan.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: ginawa mong kasuklam-suklam ang iyong sarili sa iyong ama
  rationale: Inihahatid nito ang matinding talinghaga ng Hebreong pandiwa—maging mabaho, kamuhi-muhi, o labis na kasuklam-suklam—at pinananatili ang posibleng diwa na sadyang inilagay ni Absalom ang sarili sa gayong kalagayan.
- source_word: וְחָזְקוּ יְדֵי
  choice: lalakas ang loob
  rationale: Karaniwang idyoma ito para sa pagkakaroon ng tapang at matibay na pasiya. Natural sa Filipino ang “lalakas ang loob,” habang inilalagay sa talababa ang literal na larawan ng mga kamay.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: lahat ng kasama mo
  rationale: Malapit ito sa malawak na pananalita ng Hebreo at hindi nililimitahan ang tinutukoy sa isang partikular na uri ng tagasuporta.
theological_decisions:
- issue: Seksuwal na eupemismo sa payong pampolitika
  choice: Isinaling “Sipingan mo” upang malinaw ngunit hindi mahalay na ipahayag ang seksuwal na gawain.
  alternative: “Pasukin mo” o “Makipagtalik ka sa”
  rationale: Ang literal na “pasukin” ay maaaring maging malabo sa Filipino, samantalang ang “makipagtalik” ay mas tahas kaysa eupemistikong Hebreo. Pinananatili ng pinili ang bigat ng hayagang pagputol ni Absalom sa kanyang ama nang hindi ito ginagawang sensasyonal.
- issue: Lakas ng נִבְאַשְׁתָּ at ang ugnayan nito sa ama
  choice: “ginawa mong kasuklam-suklam ang iyong sarili sa iyong ama”
  alternative: “naging kasuklam-suklam ka sa iyong ama”
  rationale: Maaaring ipahayag ng anyo ang pagkalagay o pagiging kamuhi-muhi. Ang pinili ay angkop sa sinadyang pampolitikang kilos sa konteksto, ngunit binabanggit sa talababa ang mas payak na alternatibo upang mapanatili ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sipingan” bilang malinaw ngunit mahinahong seksuwal na eupemismo, “palasyo” para sa maharlikang sambahayan, at “lalakas ang loob” bilang natural na katumbas ng Hebreong idyoma. Nakalagay ang lahat ng marker [a]–[c] sa pangunahing teksto.
