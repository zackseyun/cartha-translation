  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: tl
  text: Dumating sa Jerusalem si Absalom at ang buong bayan—ang mga lalaki ng Israel[a]—at kasama niya si Ahitofel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maaaring literal na “ang buong bayan, bawat lalaki ng Israel” o “ang buong bayan, ang mga lalaki ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלֹום
  choice: si Absalom
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino; hindi na isinalin nang hiwalay ang panimulang וְ dahil likas na naipahihiwatig ng tuloy-tuloy na salaysay ang pagkakasunod ng pangyayari.
- source_word: וְ/כָל הָ/עָם אִישׁ יִשְׂרָאֵל
  choice: at ang buong bayan—ang mga lalaki ng Israel[a]
  rationale: Ang עָם ay likas na 'bayan' o 'mga tao,' hindi lamang hukbo. Pinanatili ng pariralang nasa gitling ang apposisyon at panlalaking kolektibong diwa ng אִישׁ יִשְׂרָאֵל, habang inilalagay sa talababa ang posibleng distributibong pagbasa.
- source_word: בָּאוּ יְרוּשָׁלִָם
  choice: Dumating sa Jerusalem
  rationale: Ang בוא ay nangangahulugang dumating o pumasok; natural sa modernong Filipino ang 'dumating sa Jerusalem' sa kontekstong ito.
- source_word: וַ/אֲחִיתֹפֶל אִתּוֹ
  choice: at kasama niya si Ahitofel
  rationale: Ang sugnay ay walang tahasang pandiwa sa Hebreo; natural itong ipinahayag sa Filipino bilang 'kasama niya.' Sa konteksto, si Absalom ang pinakamalamang na tinutukoy ng panghalip.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inuna ang pandiwa upang maging natural ang salaysay, at gumamit ng gitling upang malinaw na ipakitang ang “mga lalaki ng Israel” ay appositional na paglalarawan sa “buong bayan.”
