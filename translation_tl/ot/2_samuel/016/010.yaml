  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: tl
  text: Ngunit sinabi ng hari, “Ano ang pakialam ko sa inyo, mga anak na lalaki ni Zeruya? [a] Kung isinusumpa niya ako dahil sinabi sa kanya ni Yahweh, ‘Sumpain mo si David,’ sino ang makapagsasabi, ‘Bakit mo ginawa iyon?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sapagkat isinusumpa niya ako dahil sinabi sa kanya ni Yahweh, ‘Sumpain mo si David.’” Maaari ring unawain ang mga particle sa Hebreo bilang pagpapaliwanag sa halip na kondisyon.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Ano ang pakialam ko sa inyo
  rationale: Idyoma ito ng paglayo o pagsaway, hindi literal na tanong tungkol sa pag-aari. Likas sa modernong Tagalog ang saling ito at pinananatili ang mariing pagtutol ng hari.
- source_word: בְּנֵי צְרֻיָה
  choice: mga anak ni Zeruya
  rationale: Tuwirang pariralang tumutukoy kina Joab at Abisai sa pamamagitan ng pangalan ng kanilang ina; ginamit ang karaniwang anyong Tagalog ng pangalang Zeruya.
- source_word: יְקַלֵּל / קַלֵּל
  choice: isinusumpa / Sumpain
  rationale: Pinananatili ang ugnayang leksikal ng pandiwa at ng utos sa sipi. Ang “sumpain” ay angkop sa mapanlait na pagsumpang ginagawa kay David.
- source_word: כִּי ... וְכִי
  choice: Kung ... dahil
  rationale: Ang unang particle ay binasa bilang kondisyon at ang ikalawa bilang dahilan. Malinaw sa Tagalog ang lohika habang kinikilala sa talababa ang maaari ring paliwanag na pagbasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אָמַר לוֹ
  choice: sinabi sa kanya
  rationale: Natural na Tagalog para sa natapos na pagsasalitang ipinapakitang dahilan ng kasalukuyang kilos.
- source_word: אֶת דָּוִד
  choice: si David
  rationale: Si David ang tuwirang layon ng pandiwang “sumpain”; hindi kailangang dagdagan ng pang-ukol sa Tagalog.
- source_word: וּמִי יֹאמַר
  choice: sino ang makapagsasabi
  rationale: Ipinahahayag ng retorikal na tanong na walang nararapat o may kakayahang humamon sa ipinapalagay na utos ni Yahweh.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Bakit mo ginawa iyon?
  rationale: Maikli, malinaw, at natural na pagsasalin ng tuwirang hamon.
theological_decisions:
- issue: Pakikibahagi ng Diyos sa pagsumpa ni Simei
  choice: Inilahad bilang posibilidad na sumusumpa si Simei dahil sinabi sa kanya ni Yahweh na sumpain si David.
  alternative: Maaaring gawing pahintulot lamang ng Diyos ang pangyayari, o ilahad bilang ganap at walang-kondisyong utos.
  rationale: Tahasang binabanggit ng Hebreo na sinabi ni Yahweh, “Sumpain mo si David,” ngunit inilalagay ito ng pangunahing pagbasa sa kondisyunal na pangangatwiran ni David. Pinananatili nito ang tensiyong teolohikal nang hindi ipinapaliwanag bilang pahintulot lamang o moral na pagsang-ayon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ano ang pakialam ko sa inyo” upang natural na maipahayag ang idyomatikong pagsaway, at pinanatili ang pangalang Yahweh at ang mahirap na teolohikal na pahayag ng talata.
