  source_fidelity: 'Kailangang itama ang anyo ng unang pandiwa: ang “Marahil ay tingnan ni Yahweh” ay hindi natural na pagbuo sa Filipino. Ang “pansinin” ay mahusay na katumbas sa kontekstong ito ng Hebreong ‘makita/look on,’ sapagkat nagpapahiwatig ito ng pagbibigay-pansin sa kalagayan ni David. Mas malapit din sa Hebreo na panatilihin ang inuulit na pangalang Yahweh sa ikalawang sugnay.'
