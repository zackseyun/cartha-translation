base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: tl
  text: Marahil ay pansinin ni Yahweh ang aking paghihirap[a], at suklian ako ni Yahweh ng mabuti kapalit ng pagsumpa niya sa akin sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa nakasulat na anyo, “ang aking kasamaan.”
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: Marahil
  rationale: Likas at marangal na pagpapahayag ng pag-asa na may kasamang kawalang-katiyakan.
- source_word: יִרְאֶה
  choice: tingnan
  rationale: Pinananatili ang konkretong larawan ng ‘pagkakita’ habang ipinahihiwatig ang pagbibigay-pansin ni Yahweh sa kalagayan ni David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: ב/עונ/י
  choice: ang aking paghihirap
  rationale: Sinusunod ng pangunahing teksto ang tradisyonal na pagbasa na tumutukoy sa kaawa-awang kalagayan o pagdurusa ni David; ang nakasulat na anyong maaaring mangahulugang ‘aking kasamaan’ ay pinananatili sa talababa.
- source_word: וְהֵשִׁיב ... לִי טוֹבָה
  choice: gantihan niya ako ng mabuti
  rationale: Sa konteksto ng kabutihang ibinabalik bilang tugon sa sumpa, malinaw at natural sa Tagalog ang ‘gantihan ... ng mabuti.’
- source_word: תַּחַת
  choice: kapalit ng
  rationale: 'Ipinahahayag ang pagpapalit o katumbas na tugon: kabutihan bilang kapalit ng pagsumpa.'
- source_word: קִלְלָתוֹ
  choice: pagsumpa sa akin ng taong ito
  rationale: Ipinakikita ang patuloy na mapanlait na kilos ni Shimei at nililinaw ang reperente ng panlalaking panghalip nang hindi kailangang isingit ang pangalan.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang diin at anyong pangkuwento ng Hebreong pananalita.
theological_decisions:
- issue: Pagbasa sa ב/עונ/י ayon sa ketiv/qere
  choice: aking paghihirap
  alternative: aking kasamaan
  rationale: Ang tradisyonal na binibigkas na pagbasa at ang konteksto ng paghamak kay David ay pumapabor sa ‘paghihirap,’ ngunit ang nakasulat na anyo ay maaaring tumukoy sa ‘kasamaan.’ Pinananatili sa talababa ang tunay na tekstuwal at teolohikal na tensiyon.
- issue: Paksa ng ikalawang sugnay
  choice: gantihan niya ako
  alternative: gantihan ako ni Yahweh
  rationale: Bagaman inuulit ng Hebreo ang pangalang Yahweh, natural sa Tagalog ang panghalip kapag malinaw na ang tinutukoy; hindi nito binabago ang kumikilos o ang diwa ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh, ang maingat na ‘Marahil,’ at ang tekstuwal na pagkakaiba sa pamamagitan ng talababa.
