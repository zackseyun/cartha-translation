  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר בָּ֞א חוּשַׁ֧י הָ/אַרְכִּ֛י רֵעֶ֥ה דָוִ֖ד אֶל אַבְשָׁל֑וֹם וַ/יֹּ֤אמֶר חוּשַׁי֙ אֶל אַבְשָׁלֹ֔ם יְחִ֥י הַ/מֶּ֖לֶךְ יְחִ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: tl
  text: Nang dumating kay Absalom si Husai na Arkita, na kaibigan ni David, sinabi niya kay Absalom, “Mabuhay ang hari! Mabuhay ang hari!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na panandang pasalaysay sa Tagalog para sa temporal na sugnay; naipapakita nito ang pagkakasunod ng pangyayari nang hindi pilit na isinasalin ang pormulang Hebreo.
- source_word: בָּא
  choice: dumating
  rationale: Ang karaniwang pandiwa ng pagdating ang pinakanatural sa kontekstong humarap si Husai kay Absalom.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: si Husai na Arkita
  rationale: Isinalin sa baybay-Tagalog ang pangalan at ang katawagang pangkat o pinagmulan; malinaw at natural ang hulma sa Filipino.
- source_word: רֵעֶה דָוִד
  choice: na kaibigan ni David
  rationale: Tuwirang pinananatili ang ugnayang personal at pampolitika ni Husai kay David.
- source_word: אֶל אַבְשָׁלוֹם
  choice: kay Absalom
  rationale: Ang ‘kay’ ay natural na pananda sa taong nilapitan o pinuntahan at sa taong kinausap sa kasunod na sugnay.
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Karaniwang salin ng אמר sa pagpapakilala ng tuwirang pananalita; nilinaw ng panghalip ang tagapagsalita nang hindi nagdaragdag ng interpretasyon.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mabuhay ang hari!
  rationale: Ito ang likas na Filipino para sa jussive na pampublikong pagbubunyi o royal acclamation.
- source_word: יְחִי הַמֶּלֶךְ (repeated)
  choice: Mabuhay ang hari!
  rationale: Pinanatili ang eksaktong pag-uulit upang maipahayag ang diin at ang hindi hayagang nilulutas na kabalintunaan ng katapatan ni Husai.
theological_decisions:
- issue: Ang posibleng dalawang pakahulugan ng pagbubunyi ni Husai kay Absalom
  choice: Pinanatili ang karaniwang pagbubunyi sa hari nang walang paliwanag tungkol sa kabalintunaan o panlilinlang.
  alternative: Lagyan ang salin ng pahiwatig na pakunwari o mapanlinlang ang sinabi ni Husai.
  rationale: Hindi tahasang ipinapaliwanag ng talata kung sino ang tinutukoy ni Husai sa kaniyang kalooban. Ang tuwirang pagbubunyi ay nagpapanatili sa tensiyong pasalaysay at hindi ipinapasok sa teksto ang paliwanag mula sa mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Mabuhay ang hari!’ bilang natural na pampublikong pagbubunyi. Walang talababa dahil ang alternatibong literal na ‘Nawa’y mabuhay ang hari’ ay hindi nagbibigay ng mahalagang pagkakaibang kailangan upang maunawaan ang talata.
