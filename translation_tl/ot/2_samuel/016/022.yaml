revisions:
- from: Kaya nagtayo sila ng tolda para kay Absalom sa bubungan. Pagkatapos, sinipingan ni Absalom ang mga kalunya ng kanyang ama sa paningin ng buong Israel.[a]
  to: Kaya itinatag nila ang tolda para kay Absalom sa bubungan, at sumiping si Absalom sa mga kalunya ng kanyang ama sa paningin ng buong Israel.[a]
  rationale: Binago ang di-tiyak na “ng tolda” tungo sa “ang tolda” upang maipakita ang tiyak na pantukoy sa Hebreo. Pinalitan ang “sinipingan” ng mas idiomatikong “sumiping ... sa,” na pinananatili ang pigil na eupemismo ng orihinal. Inayos din ang pangungusap at ang ikalawang alternatibo sa talababa para sa natural na modernong Filipino, nang hindi binabago ang kahulugan o ang pampublikong katangian ng kilos.
