  verdict: revise
  source_fidelity: 'Kailangang panatilihin ang katiyakan ng הָאֹהֶל: ang Hebreo ay tumutukoy sa isang tiyak na toldang inihanda para kay Absalom, hindi lamang sa anumang tolda. Ang “sumiping sa” ay angkop na modernong Filipino na eupemismo para sa idyomang וַיָּבֹא ... אֶל at malinaw na tumutukoy sa seksuwal na kilos nang hindi nagdaragdag ng detalye.'
  naturalness: Natural at marangal ang “sa bubungan” at “sa paningin ng buong Israel.” Gayunman, mas idiomatiko ang “sumiping si Absalom sa” kaysa sa transitive na “sinipingan ni Absalom ang.” Ang “At” ay mas malapit sa sunod-sunod na salaysay ng Hebreo kaysa sa “Pagkatapos,” na hindi kailangan upang ipahiwatig ang pagkakasunod.
  terminology: Ang “kalunya” ay wastong modernong Filipino para sa פִּילֶגֶשׁ at pinananatili ang kaibhan nito sa asawa. Ang pangalang “Absalom” at “Israel” ay tama. Ang “sa paningin ng buong Israel” ay tapat sa לְעֵינֵי כָּל־יִשְׂרָאֵל at pinananatili ang pampublikong katangian nang hindi ipinagpapalagay na literal na naroon ang bawat tao.
  issues:
