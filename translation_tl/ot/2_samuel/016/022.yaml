base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: tl
  text: Kaya itinatag nila ang tolda para kay Absalom sa bubungan, at sumiping si Absalom sa mga kalunya ng kanyang ama sa paningin ng buong Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa harap ng buong Israel”; o, “sa ganap na hayag na pagtingin ng buong Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: nagtayo sila
  rationale: Ang pandiwang נטה, kapag tolda ang layon, ay tumutukoy sa pag-uunat at pagtatayo nito. Natural sa modernong Tagalog ang “nagtayo” sa ganitong konteksto.
- source_word: הָאֹהֶל
  choice: ang tolda
  rationale: May tiyak na pantukoy ang pangngalan sa Hebreo, kaya pinanatili ang katiyakan sa “ang tolda.”
- source_word: עַל הַגָּג
  choice: sa bubungan
  rationale: Ang גָּג ay patag na bubungan na nagagamit bilang lantad na lugar. Ang “sa bubungan” ay mas malinaw kaysa “sa bubong” bilang lokasyon ng itinayong tolda.
- source_word: וַיָּבֹא ... אֶל
  choice: sinipingan
  rationale: Ito ay Hebreong idyoma para sa pakikipagtalik. Pinananatili ng “sinipingan” ang mahinahon ngunit malinaw at marangal na pagpapahayag nang hindi ito ginagawang labis na tahasan.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: mga kalunya ng kanyang ama
  rationale: Tuwirang ipinahahayag nito ang ugnayang nasa construct phrase at gumagamit ng karaniwang salitang Filipino para sa mga concubine, nang hindi sila tinatawag na ganap na mga asawa.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: sa paningin ng buong Israel
  rationale: Malapit ito sa literal na “sa mga mata ng buong Israel” at pinananatili ang diwa na hayagan at nasaksihan ng bayan ang ginawa.
theological_decisions:
- issue: Pagpapahayag sa seksuwal na idyoma sa konteksto ng pag-agaw sa kapangyarihan
  choice: sinipingan
  alternative: nakipagtalik sa; pumasok sa
  rationale: Ang “sinipingan” ay natural na eupemismo sa Filipino na malinaw ang seksuwal na kahulugan ngunit pinananatili ang pigil at mabigat na tono ng salaysay. Hindi nito ginagawang mas tahasan ang Hebreo, at iniiwasan din ang literal ngunit malabong “pumasok sa.”
- issue: Hayagang katangian ng ginawa ni Absalom
  choice: sa paningin ng buong Israel
  alternative: sa harap ng buong Israel; habang nakikita ng buong Israel
  rationale: Pinananatili nito ang larawang “mga mata” sa Hebreo at ang pampublikong katangian ng pagkilos, nang hindi nagpapasya kung literal na bawat Israelita ang naroon o kung kinakatawan ang buong bayan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang ginamit. Hinati sa dalawang pangungusap upang maging malinaw ang sunod-sunod na kilos, habang pinananatili ang ugnayang salaysay ng Hebreo. Ang “sinipingan” ay sadyang eupemistiko, gaya ng orihinal.
