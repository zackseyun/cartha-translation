    issue: Hindi naipakita ang katiyakan ng “ang tolda.”
    rationale: May pantukoy na הָ sa הָאֹהֶל. Ang “nagtayo sila ng tolda” ay di-tiyak; dapat itong “itinatag nila ang tolda” o katumbas nito.
  - severity: low
    issue: Hindi pinakanatural ang pandiwang “sinipingan.”
    rationale: Sa modernong Filipino, ang “sumiping sa” ang mas karaniwang ayos para sa eupemistikong pagpapahayag ng pakikipagtalik. Mas malinaw nitong naipapahayag ang idyomang Hebreo nang hindi nagiging tahasan.
  - severity: low
    issue: Hindi natural ang ikalawang alternatibo sa talababa.
    rationale: Ang “hayagang nakikita ng buong Israel” ay hindi maayos na pagbuo sa Filipino. Maaaring gamitin ang “sa ganap na hayag na pagtingin ng buong Israel.”
  revised_text: Kaya itinatag nila ang tolda para kay Absalom sa bubungan, at sumiping si Absalom sa mga kalunya ng kanyang ama sa paningin ng buong Israel.[a]
