  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: tl
  text: Sinabi ni Absalom kay Husai, “Ganito ba ang katapatan mo sa kaibigan mo?[a] Bakit hindi ka sumama sa kaibigan mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kabutihan” o “tapat na pagmamahal” sa halip na “katapatan” (Hebreo: חֶסֶד).'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: ang katapatan mo
  rationale: Maaaring tumukoy ang חֶסֶד sa kabutihan, tapat na pagmamahal, o katapatan. Sa konteksto, kinukuwestiyon ni Absalom ang paninindigan ni Husai kay David, kaya ang “katapatan” ang pinakanatural na salin nang hindi nagdaragdag ng hayagang teolohikal na kahulugan.
- source_word: רֵעֶךָ
  choice: kaibigan mo
  rationale: Ang רֵעַ ay maaaring mangahulugang kaibigan, kasama, o kasamahan. Dito ay tumutukoy ito kay David, at natural sa modernong Tagalog ang “kaibigan.”
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Bakit hindi ka sumama sa kaibigan mo?
  rationale: Ang הלך na may אֶת ay nagpapahayag dito ng pagsama sa isang tao. Tuwiran at natural ang “sumama” sa Tagalog.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: Ganito ba ang katapatan mo sa kaibigan mo?
  rationale: Walang tahasang pandiwa ang pariralang Hebreo at retorikal ang tanong. Likas na ipinahahayag sa Tagalog ng “Ganito ba...?” ang mapanuyang pagkuwestiyon ni Absalom.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pandiwang pasalaysay ang וַיֹּאמֶר. Pinananatili ng “Sinabi” ang anyo ng Hebreo habang ang sipi mismo ang naghahayag ng mga tanong.
