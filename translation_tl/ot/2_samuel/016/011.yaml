  source_fidelity: Malapit ang salin sa Hebreo. Wasto nitong pinananatili ang diin ng הִנֵּה, ang matalinghagang pisikal na pinagmulan ng anak, ang banta sa buhay ni David, ang pagkakakilanlang Benjaminita, ang maramihang utos na huwag manghimasok, at ang tuwirang pag-uugnay ni David ng pagsumpa sa sinabi ni Yahweh. Gayunman, ang וְאַף כִּי עַתָּה ay isang retorikal na 'gaano pa kaya/how much more' na hindi lubos na naipahahayag ng 'Lalo pa nga'.
  naturalness: Natural at marangal sa kabuuan, ngunit ang 'Lalo pa nga ang Benjaminita na ito!' ay hindi ganap na pangungusap sa modernong Tagalog at mahina ang retorikal na paghahambing. Ang 'Gaano pa kaya itong Benjaminita!' ay mas likas at mas malinaw na naghahatid ng punto ni David.
  terminology: Ang 'Yahweh,' 'Benjaminita,' at 'mga lingkod' ay angkop at pare-pareho. Ang 'sinabi sa kanya ni Yahweh na gawin iyon' ay katanggap-tanggap na pagpapalinaw sa ipinahihiwatig na layon; ang talababa ay wastong nagsasaad na hindi tahasang ibinibigay ng Hebreo ang nilalaman ng sinabi.
