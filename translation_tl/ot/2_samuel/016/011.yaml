  to: Pagkatapos, sinabi ni David kay Abisai at sa lahat ng kanyang mga lingkod, “Tingnan ninyo, ang sarili kong anak na nagmula sa aking katawan ay naglalayong pumatay sa akin. Gaano pa kaya itong Benjaminita! Pabayaan ninyo siya at hayaan siyang sumpain ako, sapagkat sinabi sa kanya ni Yahweh na gawin iyon.[a]”
