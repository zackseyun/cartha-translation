source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Abisai at sa lahat ng kanyang mga lingkod, “Tingnan ninyo, ang sarili kong anak na nagmula sa aking katawan ay naglalayong pumatay sa akin. Gaano pa kaya itong Benjaminita! Pabayaan ninyo siya at hayaan siyang sumpain ako, sapagkat sinabi sa kanya ni Yahweh na gawin iyon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sapagkat sinabi sa kanya ni Yahweh.” Hindi tahasang binabanggit sa Hebreo kung ano ang sinabi, ngunit ipinahihiwatig ng konteksto na iyon ay ang pagsumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pinananatili ang panawag-pansin at pagbibigay-diin ng Hebreo. Ang maramihang “ninyo” ay angkop dahil kinakausap ni David si Abisai at ang lahat ng kanyang mga lingkod.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: ang sarili kong anak na nagmula sa aking katawan
  rationale: Inilalarawan ng Hebreo ang likas at pisikal na pinagmulan ng anak kay David. Iniiwasan ng “katawan” ang nakalilitong literal na “sinapupunan” para sa isang lalaking nagsasalita.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: naglalayong pumatay sa akin
  rationale: Ang idyomang Hebreo na “hinahanap ang aking buhay” ay nangangahulugang nagtatangkang kumitil ng buhay. Malinaw at natural ito sa modernong Tagalog.
- source_word: וְאַף כִּי עַתָּה
  choice: Lalo pa nga
  rationale: 'Ipinapakita ang retorikal na paghahambing: kung sariling anak ni David ay nagtatangka sa kanyang buhay, lalo nang maaasahan iyon mula sa Benjaminita.'
- source_word: בֶּן הַיְמִינִי
  choice: ang Benjaminita na ito
  rationale: Tumutukoy ito sa isang kasapi ng lipi ni Benjamin. Ang “Benjaminita” ay maikli, malinaw, at karaniwang katawagan sa Tagalog na biblikal.
- source_word: הַנִּחוּ לוֹ
  choice: Pabayaan ninyo siya
  rationale: Isinasalin ang maramihang pautos sa mga tauhan ni David at ipinahihiwatig na huwag nilang pigilan o saktan ang lalaki.
- source_word: וִיקַלֵּל
  choice: at hayaan siyang sumpain ako
  rationale: Ang anyo ay pagpapatuloy na nagpapahintulot matapos ang pautos. Ginawang tahas ang layon na “ako” mula sa malinaw na konteksto.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: sapagkat sinabi sa kanya ni Yahweh na gawin iyon
  rationale: Natural na ipinapahayag sa Tagalog ang ipinahihiwatig na nilalaman ng sinabi, habang ang talababa ay nagbibigay ng mas literal at hindi ganap na tahasang anyo ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kung ang pananalita ni David ay tuwirang nag-uugnay sa pagsumpa sa sinabi ni Yahweh o inilalarawan lamang itong pahintulot ng Diyos
  choice: 'Pinanatili ang tuwirang pahayag ni David: “sinabi sa kanya ni Yahweh na gawin iyon.”'
  alternative: “pinahintulutan siya ni Yahweh”
  rationale: Tuwirang sinasabi ng Hebreo na nagsalita si Yahweh sa lalaki. Hindi ito pinalambot bilang pahintulot lamang, kaya nananatili ang teolohikal na tensiyon ng sinabi ni David.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang malinaw na idyomang “naglalayong pumatay sa akin” sa halip na ang di-natural na literal na “hinahanap ang buhay ko.” Ang marker na [a] ay inilagay sa pariralang talagang tinatalakay ng talababa.
