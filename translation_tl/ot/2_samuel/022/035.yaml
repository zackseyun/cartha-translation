base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: tl
  text: Sinasanay niya ang mga kamay ko sa pakikipagdigma[a], at nababaluktot ng mga bisig ko ang tansong busog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa digmaan.”
    reason: lexical_alternative
  - marker: b
    text: O “kayang baluktutin ng mga bisig ko ang bronseng busog.” Ipinahihiwatig ng Hebreo na nababaluktot ang busog dahil sa lakas na ipinagkaloob ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: Sinasanay
  rationale: Ang anyong participle ng למד ay tumutukoy sa patuloy na pagtuturo o pagsasanay. Sa konteksto ng pakikipaglaban, likas sa modernong Tagalog ang “sinasanay” at ipinahihiwatig nito ang praktikal na paghahanda.
- source_word: יָדַי
  choice: ang mga kamay ko
  rationale: Pinananatili ang literal na pangmaramihang larawan ng mga kamay sa halip na gawing pangkalahatang “ako.”
- source_word: לַמִּלְחָמָה
  choice: sa pakikipagdigma
  rationale: Maaaring tumukoy ang מִלְחָמָה sa digmaan o labanan. Ang “pakikipagdigma” ay angkop kasunod ng pagsasanay sa mga kamay at pinananatili ang aktuwal na kontekstong militar.
- source_word: וְנִחַת
  choice: nababaluktot
  rationale: Ang bihirang anyo ng pandiwa ay maaaring unawain bilang pagbaluktot o pagiging nabaluktot ng busog. Inilalarawan ng salin ang busog na sumusuko sa lakas ng mga bisig nang hindi labis na nililinaw ang gramatikal na ambiguwidad.
- source_word: קֶשֶׁת
  choice: busog
  rationale: Ito ang karaniwang salitang Tagalog para sa sandatang tinutukoy.
- source_word: נְחוּשָׁה
  choice: tansong
  rationale: Ang נְחוּשָׁה ay maaaring tumukoy sa bronse o tanso. Ang “tansong busog” ay natural at tradisyonal na paglalarawan sa Tagalog; nililinaw sa talababa ang alternatibong “bronseng.”
- source_word: זְרֹעֹתַי
  choice: ng mga bisig ko
  rationale: Pinananatili ang literal na pangmaramihang “mga bisig” at ang paralelismo nito sa “mga kamay ko.”
theological_decisions:
- issue: Pagkilos ng Diyos sa kakayahang militar
  choice: Iniuugnay ng talata sa Diyos ang pagsasanay at lakas ng nagsasalita sa literal na pakikipagdigma.
  alternative: Unawain ito bilang pangkalahatang pahayag tungkol sa espirituwal na pakikibaka ng lahat ng mananampalataya.
  rationale: Ang konteksto ay awit ng pasasalamat ni David tungkol sa pagliligtas at pagpapalakas ng Diyos sa aktuwal na labanan. Hindi ginagawang alegorya ng salin ang pahayag.
- issue: Ambiguwidad ng וְנִחַת
  choice: “nababaluktot ng mga bisig ko ang tansong busog”
  alternative: “kayang baluktutin ng mga bisig ko ang tansong busog” o “nababaluktot ang tansong busog sa mga bisig ko”
  rationale: Hindi lubos na tiyak ang anyo at sintaks ng pandiwa. Pinananatili ng pangunahing salin ang konkretong resulta, habang inilalahad sa talababa ang mas malinaw na pagbasa bilang kakayahan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong paralelismo ng “mga kamay” at “mga bisig,” gayundin ang literal na kontekstong militar. Ginamit ang “niya” sapagkat ipinagpapatuloy ng talata ang pagtukoy sa Diyos mula sa konteksto.
