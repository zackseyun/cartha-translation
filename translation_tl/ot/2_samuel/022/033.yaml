  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: tl
  text: Ang Diyos ang aking matibay na kanlungan, at ginagawa niyang walang kapintasan ang aking landas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, kung mas literal na susundin ang anyong katinig, “at ginagawa niyang walang kapintasan ang kanyang landas.” Sinusuportahan ng kaagapay na Awit 18:32 ang “aking landas.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Ang Diyos
  rationale: Ang may-tiyak na anyo ng אֵל ay likas na tumutukoy sa Diyos; ang “Ang Diyos” ay malinaw at marangal sa modernong Tagalog.
- source_word: מָעוּזִּי חָיִל
  choice: aking matibay na kanlungan
  rationale: Pinagsasama nito ang diwa ng proteksiyon sa מָעוֹז at ng lakas sa חָיִל nang hindi nililimitahan ang larawan sa isang kuta.
- source_word: וַיַּתֵּר
  choice: ginagawa niya
  rationale: Mahirap ang eksaktong diwa ng pandiwa, ngunit sa konstruksiyong ito at sa kaagapay na Awit 18:32, ipinahihiwatig nito ang paggawa o paghahanda sa landas na maging buo.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Ipinahahayag nito ang integridad, kabuuan, o pagiging walang maipipintas, nang hindi awtomatikong magpahiwatig ng ganap na kawalan ng kasalanan.
- source_word: דרכו
  choice: aking landas
  rationale: Sinusunod ang pagbasa na “aking landas,” na sinusuportahan ng kaagapay na Awit 18:32; pinananatili sa talababa ang tunay na posibilidad na “kanyang landas.”
theological_decisions:
- issue: Pagbasa sa panghalip ng huling salita
  choice: Ginagawa ng Diyos na walang kapintasan ang landas ng nagsasalita.
  alternative: Ginagawa niyang walang kapintasan ang kanyang landas.
  rationale: Maaaring ipahiwatig ng anyong katinig at pagkatuldok sa Samuel ang “kanyang landas,” ngunit sinusuportahan ng kaagapay na Awit 18:32 ang “aking landas.” Hindi tuluyang nilutas ang tekstuwal at interpretatibong tensiyon; iniingatan ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “kanlungan” upang panatilihin ang larawang proteksiyon at “landas” para sa matalinghagang דרך. Inilagay ang talababa pagkatapos ng buong sugnay na tinutukoy nito.
