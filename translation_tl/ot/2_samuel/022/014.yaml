  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: tl
  text: Nagpakulog si Yahweh mula sa langit, at ipinarinig ng Kataas-taasan ang kanyang tinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinigay ang kanyang tinig”; maaari ring isalin na “nagpahayag ng kanyang tinig.” Isa itong patulang pahayag na kaagapay ng “nagpakulog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: nagpakulog
  rationale: Ang anyong Hiphil ng רעם ay tumutukoy sa pagpapakulog o paglikha ng kulog. Ang “nagpakulog” ay natural sa Filipino at malinaw na nagpapanatili sa larawan ng pagpapakita ng Diyos sa gitna ng unos.
- source_word: מִן שָׁמַיִם
  choice: mula sa langit
  rationale: Maaaring tumukoy ang שָׁמַיִם sa langit o kalangitan. Sa kontekstong si Yahweh ang kumikilos, ang “mula sa langit” ay natural at pinananatili ang kapuwa panlunan at teolohikal na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְעֶלְיוֹן
  choice: at ang Kataas-taasan
  rationale: Dito, ang עֶלְיוֹן ay titulong pantukoy sa Diyos at kaagapay ng “Yahweh” sa paralelismong patula. Ang “Kataas-taasan” ang malinaw at kinagawiang salin sa Filipino.
- source_word: יִתֵּן קוֹלוֹ
  choice: ipinarinig ang kanyang tinig
  rationale: Literal itong “ibinigay ang kanyang tinig.” Isinasalin itong “ipinarinig ang kanyang tinig” upang maging natural sa Filipino habang pinananatili ang larawan ng malakas na tinig na kaagapay ng kulog.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit sa talata ang banal na pangalan. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng יְהוָה at עֶלְיוֹן
  choice: Iniharap bilang magkaagapay na pagtukoy sa iisang Diyos sa paralelismong Hebreo
  alternative: Unawain ang “Kataas-taasan” bilang hiwalay na katawagang hindi tahasang itinutumbas kay Yahweh
  rationale: Magkaagapay ang dalawang parirala sa tula, ngunit hindi dinaragdagan ng salin ang teksto ng isang tahasang paliwanag tungkol sa kanilang ugnayan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawang patula ng unos, habang ginawang natural ang idyomang Hebreo sa ikalawang linya.
