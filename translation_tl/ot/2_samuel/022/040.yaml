translation:
  language: tl
  text: Sinangkapan mo ako ng lakas para sa labanan[a]; pinaluhod mo sa ilalim ko ang mga bumangon laban sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Binigkisan mo ako ng lakas para sa labanan.” Ang pandiwang Hebreo ay may larawan ng pagbibigkis o pagsasangkap bilang paghahanda.
    reason: lexical_alternative
  - marker: b
    text: O “pinayuko mo sa ilalim ko ang mga kalaban ko.” Maaaring tumukoy ang pandiwa sa pagpapaluhod o pagpapayuko sa mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: Binigkisan mo ako
  rationale: Ang pandiwa ay may larawan ng pagbibigkis o paghahanda sa isang tao. Pinananatili ng “binigkisan” ang konkretong larawan ng Hebreo at ang marangal na himig ng awit.
- source_word: חַיִל
  choice: ng lakas
  rationale: Sa kontekstong pandigma, tumutukoy ito sa lakas o kakayahang ipinagkaloob sa nagsasalita; malinaw at natural ang “lakas.”
- source_word: לַמִּלְחָמָה
  choice: para sa labanan
  rationale: Ang “labanan” ay angkop sa agarang konteksto at mas tiyak dito kaysa sa mas malawak na “digmaan.”
- source_word: תַּכְרִיעַ
  choice: pinaluhod mo
  rationale: Ang causative na anyo ay nangangahulugang pinayuko o pinaluhod. Pinananatili ng “pinaluhod” ang pisikal na larawan ng sapilitang pagpapasakop.
- source_word: קָמַי
  choice: ang mga bumangon laban sa akin
  rationale: Tuwirang pinananatili nito ang participial na larawan ng mga tumindig o bumangon nang may pagkapoot laban sa nagsasalita.
- source_word: תַּחְתֵּנִי
  choice: sa ilalim ko
  rationale: Ito ang tuwirang kahulugan ng parirala at pinananatili ang larawan ng mga kaaway na ibinaba at isinailalim sa nagsasalita.
