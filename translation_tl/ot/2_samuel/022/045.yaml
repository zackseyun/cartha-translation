  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: tl
  text: Ang mga dayuhan ay pakunwaring nagpapasakop sa akin[a]; sa sandaling marinig nila, sumusunod sila sa akin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napipilitang yumukod sa akin” o “nagkukunwaring sumusunod sa akin.” Ipinahihiwatig ng pandiwang Hebreo ang atubili, sapilitan, o di-taos-pusong pagpapasakop.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa pagkarinig ng tainga”; ibig sabihin, “sa sandaling marinig nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: ang mga dayuhan
  rationale: Ang literal na Hebreong idyoma ay “mga anak ng dayuhan/ibang lupain,” ngunit tumutukoy ito sa mga taong dayuhan. Ang “mga dayuhan” ay natural at malinaw sa modernong Tagalog nang hindi ipinahihiwatig na mga anak lamang nila ang tinutukoy.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: pakunwaring nagpapasakop sa akin
  rationale: Sa konteksto ng awit ng tagumpay, ang Hitpael ng כחש ay maaaring magpahiwatig ng pagkukunwari, sapilitang pagyukod, o di-taos-pusong pagpapasakop. Pinananatili ng salin ang problematikong kulay ng pandiwa sa halip na ilarawan itong kusang pagsunod.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: pagkarinig pa lamang nila
  rationale: Ang literal na “sa pagkarinig ng tainga” ay isang Hebreong idyoma para sa agarang pagtugon sa narinig. Ang “pa lamang” ay natural na naghahatid ng diwang “sa sandaling marinig.”
- source_word: יִשָּׁמְעוּ לִי
  choice: sinusunod na nila ako
  rationale: Ang שׁמע na may ל ay karaniwang nangangahulugang makinig nang may pagtugon, kaya ang “sinusunod” ay mas angkop kaysa sa payak na “naririnig.” Ang “na” ay nagpapakita ng agarang pagsunod sa pagkakarinig.
