translation:
  language: tl
  text: Nanghihina ang mga dayuhan at nanginginig silang lumalabas mula sa kanilang mga kuta.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nalalanta ang mga dayuhan.” Mas literal, ang pandiwang Hebreo ay maaaring mangahulugang “malanta” o “kumupas.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang pandiwang Hebreo rito. Kabilang sa mga posibilidad ang “lumalabas na nakayukyok,” “lumalabas na paika-ika,” o, sa mas literal na pagbasa, “nagbibigkis.”
    reason: lexical_alternative
  - marker: c
    text: O “mula sa kanilang mga tanggulan”; maaari rin, bagaman mas malamang na hindi, “mula sa kanilang mga bilangguan” o “mula sa kanilang mga kulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: mga dayuhan
  rationale: Ang literal na pariralang “mga anak ng pagiging banyaga” ay isang idyoma para sa mga taong mula sa ibang bayan. Natural at malinaw sa makabagong Filipino ang “mga dayuhan.”
- source_word: יִבֹּלוּ
  choice: nanghihina
  rationale: Karaniwang nangangahulugan ang נבל na “malanta” o “kumupas.” Sa makatang konteksto ng pagkatalo sa digmaan, ipinahihiwatig nito ang paghina ng loob o lakas; pinananatili sa talababa ang mas literal na larawan.
- source_word: וְיַחְגְּרוּ
  choice: nanginginig na lumalabas
  rationale: Mahirap tiyakin ang pandiwa rito. Bagaman karaniwang nangangahulugan ang ugat na חגר na “magbigkis,” sa konteksto ay maaaring tumukoy sa takot o hindi matatag na paglabas ng mga nasupil na kaaway. Ang mga alternatibo ay inilalahad sa talababa.
- source_word: מִמִּסְגְּרוֹתָם
  choice: mula sa kanilang mga kuta
  rationale: Maaaring tumukoy ang מִסְגְּרוֹת sa mga lugar na nakasara o nababakuran. Sa awit ng tagumpay sa digmaan, ang “mga kuta” ang pinakaangkop, habang pinananatili sa talababa ang iba pang posibleng diwa.
