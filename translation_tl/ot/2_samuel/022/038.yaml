base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: tl
  text: Hinabol ko ang aking mga kaaway at nilipol sila, at hindi ako bumalik hangga't hindi sila lubusang naubos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa lubusan ko silang naubos” o “hanggang sa tuluyan silang nagwakas.” Ang anyong Hebreo ay maaaring tumukoy sa pagkaubos nila o sa pag-ubos sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: Hinabol ko
  rationale: Ang Qal ng רדף ay nangangahulugang humabol o tumugis. Natural sa makabagong Filipino ang “hinabol” at angkop ito sa kontekstong pandigma.
- source_word: אֹיְבַי
  choice: ang aking mga kaaway
  rationale: Tuwirang ipinapahayag ng pangngalang אויב na may hulaping unang panauhan ang “aking mga kaaway,” kaya napapanatili ang personal at pandigmang diin.
- source_word: וָאַשְׁמִידֵם
  choice: at nilipol sila
  rationale: Sa Hiphil, ang שׁמד ay nangangahulugang pumuksa, lumipol, o ganap na magwasak. Ang “nilipol” ay matindi ngunit dignificado at hindi kolokyal.
- source_word: וְלֹא אָשׁוּב
  choice: at hindi ako bumalik
  rationale: Ang שׁוב ay maaaring mangahulugang bumalik o tumalikod. Dito, ang “hindi ako bumalik” ay natural at pinananatili ang posibilidad na tumutukoy ito sa hindi paghinto o pagtalikod sa pagtugis.
- source_word: עַד כַּלּוֹתָם
  choice: hangga't hindi sila lubusang naubos
  rationale: Ang כלה ay maaaring mangahulugang matapos, maubos, o lubusang mapawi. Ipinahihiwatig ng parirala ang pagpapatuloy hanggang sa ganap na wakas ng mga kaaway, habang inilalagay sa talababa ang tunay na gramatikal at leksikal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at dignipikadong Filipino. Ginamit ang “nilipol” upang mapanatili ang matinding puwersang pandigma ng Hebreo; iniwasan ang mas kolokyal na “inubos” sa pangunahing sugnay. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang pinapaliwanag nito.
