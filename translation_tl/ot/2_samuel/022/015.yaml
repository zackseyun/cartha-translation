  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: tl
  text: Nagpadala siya ng mga palaso at pinangalat niya sila; nagpadala siya ng kidlat at nilito niya sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang dalawang pandiwa bilang “itinaboy sila,” sapagkat inilalarawan ng mga ito ang epekto ng mga palaso at kidlat sa mga kaaway ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Nagpadala siya
  rationale: Pinananatili ng “nagpadala” ang malawak na kahulugan ng שלח at ang matalinghagang paglalarawan sa Hebreo nang hindi labis na tinutukoy kung paano pinakawalan ang mga palaso.
- source_word: חִצִּים
  choice: mga palaso
  rationale: Karaniwan at malinaw na salin ng חִצִּים, at pinananatili nito ang kongkretong larawang pandigma.
- source_word: וַיְפִיצֵם
  choice: at pinangalat sila
  rationale: Ipinahahayag ng “pinangalat” ang causative na diwang ‘ikalat/pangalatin.’ Ang “sila” ay likas na tumutukoy sa mga kaaway na ipinahihiwatig ng mas malawak na konteksto.
- source_word: בָּרָק
  choice: nagpakidlat siya
  rationale: Ang בָּרָק ay ‘kidlat.’ Ginawang pandiwang sugnay sa Tagalog upang natural na maipahayag ang maikli at eliptikong pariralang Hebreo habang nananatiling Diyos ang gumagawa.
- source_word: וַיְהֻמֵּם
  choice: at nilito sila
  rationale: Ang המם ay nangangahulugang magligalig, magpagulo, o magtaboy. Ang “nilito sila” ay maikli, natural, at nagpapanatili sa causative na epekto nang hindi ito nililimitahan sa pagkatalong militar.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip sa “pinangalat sila” at “nilito sila”
  choice: Ang “sila” ay tumutukoy sa mga kaaway o kalaban sa mas malawak na konteksto ng awit.
  alternative: Maaaring hayaang kontekstuwal lamang ang tinutukoy, ngunit nangangailangan pa rin ang natural na Tagalog ng hayag na layon.
  rationale: May tahasang panghalip na layon sa Hebreo, at ang konteksto ng pakikidigma ng Diyos ang pinakamatibay na batayan na mga kaaway ang tinutukoy.
- issue: Eliptikong gamit ng “kidlat”
  choice: Isinaling “nagpakidlat siya” upang ipakita ang kilos ng Diyos.
  alternative: “kidlat” o “mga kidlat” bilang putol na pariralang patula.
  rationale: Walang ikalawang tahasang pandiwa bago ang בָּרָק, ngunit natural na ipinagpapatuloy ng Hebreong tula ang kilos ng naunang pandiwa. Nililinaw ng Tagalog ang sintaks nang hindi binabago ang larawan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at masiglang anyong patula, ang larawang pandigma, at ang magkatulad na epekto ng mga palaso at kidlat.
