  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: tl
  text: Iniyuko niya ang langit at bumaba; makapal na kadiliman[a] ang nasa ilalim ng kanyang mga paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “madilim na ulap.” Ang Hebreong עֲרָפֶל ay maaaring tumukoy sa siksik na dilim na kaugnay ng pagpapakita ng PANGINOON.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: Iniyuko
  rationale: Ang pandiwang נטה na may שָׁמַיִם bilang layon ay naglalarawan sa Diyos na pinapayuko ang langit. Ang “iniyuko” ay malinaw, masigla, at nagpapanatili sa kosmikong larawan.
- source_word: שָׁמַיִם
  choice: ang langit
  rationale: Ang anyong maramihan sa Hebreo ay karaniwang tumutukoy sa langit o kalangitan. Natural sa modernong Tagalog ang “ang langit” at angkop pa rin sa maringal na tulang teopaniko.
- source_word: וַיֵּרַד
  choice: at bumaba
  rationale: Tuwirang katumbas ito ng ירד at malinaw na pinananatili ang kilos na inilalarawan sa taludtod.
- source_word: וַעֲרָפֶל
  choice: makapal na kadiliman
  rationale: Ang עֲרָפֶל ay maaaring tumukoy sa siksik na dilim o madilim na ulap na kaugnay ng pagpapakita ng PANGINOON. Pinananatili ng “makapal na kadiliman” ang bigat at siksik na katangian ng larawan nang hindi nilulutas ang leksikal na saklaw nito.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Natural at tuwirang katumbas ito ng panandang panlunan na “sa ilalim” o “nasa ibaba ng.”
- source_word: רַגְלָיו
  choice: kanyang mga paa
  rationale: Literal na “kanyang mga paa” ang pangngalang may hulaping panghalip. Pinananatili nito ang kongkreto at antropomorpikong larawan ng Hebreo.
theological_decisions:
- issue: Antropomorpiko at panlunang larawan ng pagpapakita ng Diyos
  choice: Pinanatili nang tuwiran ang “bumaba” at “sa ilalim ng kanyang mga paa.”
  alternative: Palambutin bilang “nagpakita siya mula sa langit” o ibang di-katawang paglalarawan.
  rationale: Gumagamit ang tulang Hebreo ng antropomorpikong wika sa isang teopaniya. Hindi dapat ipaliwanag o alisin ng salin ang tensiyon sa pagitan ng kadakilaan ng Diyos at ng kongkretong larawang patula.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang maikli at makapangyarihang paralelismo ng tulang Hebreo. Ginamit ang “langit” kaysa “mga kalangitan” upang maging natural sa ordinaryong mambabasa, nang hindi nawawala ang kosmikong diwa.
