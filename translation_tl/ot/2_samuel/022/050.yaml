  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: tl
  text: 'Kaya pupurihin[a] kita, Yahweh, sa gitna ng mga bansa,

    at aawitan ko ng papuri ang iyong pangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pasasalamatan.”'
    reason: Pinananatili ang leksikal na saklaw ng ידה, na maaaring magpahayag ng pagpupuri o pasasalamat.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahahayag ng parirala ang bunga o kongklusyon mula sa pagliligtas na inilarawan sa naunang konteksto. Likas at tuwiran sa makabagong Filipino ang “Kaya.”
- source_word: אוֹדְךָ
  choice: pupurihin kita
  rationale: Ang anyong hiphil ng ידה ay maaaring mangahulugang magpuri o magpasalamat. Ang “pupurihin” ay angkop sa konteksto ng awit at sa paralelismo nito sa “aawitan ko ng papuri,” habang itinatala sa talababa ang posibleng diwang “pasasalamatan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos, hindi pinalitan ng titulong “PANGINOON,” upang direktang katawanin ang Tetragrammaton sa tekstong Hebreo.
- source_word: בַּגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Tumutukoy ang גּוֹיִם sa mga bansang nakapaligid o mga bansang hindi Israel. Naipahahayag ng “sa gitna ng mga bansa” ang pampublikong pagpupuri sa kanilang kalipunan nang hindi ipinapasok ang mas huling konotasyon ng “mga Hentil.”
- source_word: וּלְשִׁמְךָ
  choice: at aawitan ko ng papuri ang iyong pangalan
  rationale: Pinananatili ang “pangalan,” na tumutukoy sa nahayag na pagkakakilanlan at dangal ng Diyos, at natural na inilalahad sa Filipino ang ugnayan nito sa pandiwang “aawitan.”
- source_word: אֲזַמֵּר
  choice: aawitan ko ng papuri
  rationale: Ang piel ng זמר ay nangangahulugang umawit o tumugtog bilang pagpupuri. Ang napiling parirala ay malinaw na nagpapakita ng pagsamba at nagpapanatili sa patulang paralelismo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulo at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Saklaw ng אוֹדְךָ
  choice: pupurihin kita
  alternative: pasasalamatan kita
  rationale: Parehong maaaring taglayin ng ידה ang diwa ng pagpupuri at pasasalamat. Mas malinaw ang patulang ugnayan ng “pupurihin” sa kasunod na pag-awit ng papuri, ngunit hindi itinatanggi ang alternatibong diwa, kaya inilagay iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang linyang paralelismo ng tulang Hebreo at ginamit ang “mga bansa” sa halip na “mga Hentil” upang maiwasan ang hindi kailangang mas huling konotasyon.
