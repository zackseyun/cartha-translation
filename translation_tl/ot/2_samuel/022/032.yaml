  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: tl
  text: Sapagkat sino ang Diyos maliban kay Yahweh? At sino ang bato maliban sa ating Diyos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sino ang Bato maliban sa ating Diyos?” Ang salitang Hebreo para sa “bato” ay madalas na metapora para sa Diyos at kung minsan ay halos nagsisilbing titulo niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagpapaliwanag o nagbibigay-batayan sa naunang papuri, at likas itong pakinggan sa marangal na makabagong Filipino.
- source_word: מִי
  choice: sino
  rationale: Tuwirang katumbas ng panghalip na pananong at angkop sa retorikal na tanong.
- source_word: אֵל
  choice: Diyos
  rationale: Sa kontekstong ito, tumutukoy ito sa tunay na Diyos sa isang pahayag ng kanyang pagiging bukod-tangi.
- source_word: מִבַּלְעֲדֵי
  choice: maliban kay/sa
  rationale: 'Ipinahahayag ang pagbubukod: walang ibang Diyos at walang ibang batong maihahambing sa kanya.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong pangalan ang Tetragrammaton upang mapanatili ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: וּמִי
  choice: At sino
  rationale: Pinananatili ang pang-ugnay at ang paralelismong patula ng dalawang retorikal na tanong.
- source_word: צוּר
  choice: bato
  rationale: Pinananatili ang konkretong metapora ng Hebreo para sa katatagan, lakas, at kanlungan ng Diyos, sa halip na ipaliwanag lamang ang kahulugan nito.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Pinananatili ang unang panauhang maramihan at ang sama-samang pagkilala sa Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung ang צוּר ay karaniwang metapora o halos isang titulo
  choice: bato
  alternative: Bato
  rationale: Ang anyong panaguri sa retorikal na tanong ay natural na maisalin bilang karaniwang pangngalang metaporikal. Gayunman, maaaring unawain itong halos isang titulo para sa Diyos, kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at balanseng paralelismo ng tulang Hebreo, pati ang metaporang “bato.”
