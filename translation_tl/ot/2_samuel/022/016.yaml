base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: tl
  text: 'At lumitaw ang mga daluyan ng dagat;


    nalantad ang mga pundasyon ng sanlibutan[a]


    sa pagsaway ni Yahweh,[b]


    sa bugso ng hininga ng kanyang ilong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig na tinatahanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay ang personal na pangalang Hebreo ng Diyos, na madalas isinasaling “PANGINOON.”
    reason: divine_name_explanation
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: nakita
  rationale: 'Pinananatili nito ang balintiyak na diwa ng Niphal ng ראה at ang malinaw na larawang makata: ang dating natatakpan ay nakita.'
- source_word: אֲפִקֵי יָם
  choice: mga daluyan ng dagat
  rationale: Ang אֲפִיקִים ay maaaring tumukoy sa mga daluyan, uka, o higaan ng tubig. Ang “mga daluyan ng dagat” ay hindi nagpapasya nang labis kung ang tinutukoy ay mga uka sa pinakasahig o mga bukal.
- source_word: יִגָּלוּ
  choice: nalantad
  rationale: Ang Niphal ng גלה ay nangangahulugang mabunyag o matanggalan ng takip. Ang “nalantad” ay likas at matingkad sa makabagong Tagalog.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: mga pundasyon ng sanlibutan
  rationale: Tuwirang isinasalin ng “mga pundasyon” ang מֹסְדוֹת. Ang תֵּבֵל ay makatang katawagan sa daigdig, kung minsan ay may diin sa daigdig na tinatahanan; pinananatili sa talababa ang aspektong iyon.
- source_word: בְּגַעֲרַת יְהוָה
  choice: dahil sa pagsaway ni Yahweh
  rationale: Ang גְּעָרָה ay matinding pagsaway o saway, at ang בְּ ay nagpapahayag dito ng sanhi o paraan. Nililinaw ng “dahil sa” ang ugnayang sanhi nang hindi pinapahina ang larawan ng banal na pagsaway.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: dahil sa bugso ng hininga mula sa kanyang mga butas ng ilong
  rationale: Pinagsasama ng parirala ang נְשָׁמָה at רוּחַ upang ilarawan ang isang malakas na pagbuga. Ang אַף ay literal na ilong o butas ng ilong at maaari ring magpahiwatig ng galit; pinananatili ng salin ang tahasang antropomorpikong larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang יְהוָה sa teksto. Ang “Yahweh” ay direktang transliterasyon na nagpapanatili sa personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Larawan ng אַפּוֹ bilang mga butas ng ilong o galit
  choice: kanyang mga butas ng ilong
  alternative: kanyang galit
  rationale: Bagaman maaaring mangahulugan ng galit ang אַף, ang pagbanggit sa hininga at bugso ay nagpapatingkad sa literal na larawan ng pagbuga mula sa ilong. Hindi ito pinapalitan ng abstraktong “galit,” kaya nananatili ang lakas at tensiyong makata ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal at makata ang rehistro. Ginamit ang magkahanay na “nakita” at “nalantad” upang mapanatili ang estruktura at matinding larawang kosmiko ng Hebreo. Inayos ang mga talababa batay sa aktuwal na mga salita sa pinagmulan; hindi sinunod ang tila napagpalit na mga marker sa English consultation layer.
