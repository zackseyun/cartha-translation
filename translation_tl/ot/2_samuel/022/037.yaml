translation:
  language: tl
  text: Pinaluwang mo ang aking mga hakbang sa ilalim ko.[a] Hindi nadulas ang aking mga bukung-bukong.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “Pinaluwang mo ang aking mga hakbang sa ilalim ko.” Idyomang Hebreo ito para sa pagbibigay ng maluwag at matatag na tuntungan.
    reason: lexical_alternative
  - marker: b
    text: O “hindi nangatog ang aking mga bukung-bukong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Pinaluwang mo
  rationale: Ang Hiphil ng רחב ay nagsasaad ng pagpapaluwang o pagbibigay ng maluwag na puwang; pinananatili ng salin ang tahasang sanhi at makatang larawan.
- source_word: צַעֲדַי
  choice: ang aking mga hakbang
  rationale: Tuwirang tumutukoy ang צעד sa mga hakbang o paghakbang. Bagaman hindi pangkaraniwan ang buong idyoma sa Tagalog, mahalagang panatilihin ang larawan sa Hebreo sa halip na palitan ito ng “lupa.”
- source_word: תַּחְתֵּנִי
  choice: sa ilalim ko
  rationale: Pinananatili nito ang literal na larawang panlunan ng תַּחְתֵּנִי at ang kaugnayan nito sa matatag at maluwag na tuntungan.
- source_word: וְלֹא
  choice: at hindi
  rationale: Pinananatili ang payak na pag-uugnay at pagtanggi ng Hebreo nang hindi ginagawang tahasang layunin o bunga.
- source_word: מָעֲדוּ
  choice: nanghina
  rationale: Sa konteksto ng mga bukung-bukong, ipinahihiwatig ng מעד ang pagkawala ng katatagan, pag-uga, o pagdulas. Ang “nanghina” ay likas sa Tagalog para sa mga bukung-bukong na hindi bumigay, habang inilalahad sa talababa ang alternatibong “nadulas.”
- source_word: קַרְסֻלָּי
  choice: ang aking mga bukung-bukong
  rationale: Mas tiyak ito kaysa “mga paa” at pinananatili ang pisikal na larawan ng katatagan sa orihinal.
