translation:
  language: tl
  text: Ginawa niyang mga kublihan sa palibot niya ang dilim[a]—isang kalipunan ng tubig, makakapal na ulap sa kalangitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Inilagay niya ang dilim sa palibot niya bilang mga kublihan—isang kalipunan ng tubig, makakapal na ulap sa kalangitan.” Lubhang makata ang Hebreo, at ang bihirang pariralang isinaling “isang kalipunan ng tubig” ay maaari ring unawaing “isang masa ng tubig” o, nang mas malaya, “maiitim na ulap na may dalang ulan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: Ginawa niya
  rationale: Ang pandiwa ay maaaring mangahulugang “inilagay” o “ginawa.” Mas natural sa Filipino ang “ginawa niyang kanlungan” at napapanatili nito ang ideya ng pagtatakda sa dilim bilang kublihan.
- source_word: חֹשֶׁךְ
  choice: ang dilim
  rationale: Tuwirang katumbas ito ng pangngalan at angkop sa makatang paglalarawan ng pagpapakita ng Diyos sa gitna ng bagyo.
- source_word: סְבִיבֹתָיו
  choice: sa palibot niya
  rationale: Malinaw at likas na Filipino para sa bagay na nakapaligid sa kaniya.
- source_word: סֻכּוֹת
  choice: kanlungan
  rationale: Literal itong maramihang “mga silungan” o “mga kublihan.” Ginamit ang kolektibong “kanlungan” upang maging natural sa Filipino nang hindi ipinahihiwatig ang mga kubol na ginagamit sa kapistahan.
- source_word: חַשְׁרַת מַיִם
  choice: ang namuong mga tubig
  rationale: Bihira at mahirap tiyakin ang parirala. Ipinahahayag ng “namuong” ang pagkakatipon o pagkakapal ng tubig habang pinananatili ang kongkretong larawan ng bagyo.
- source_word: עָבֵי שְׁחָקִים
  choice: makakapal na ulap sa kalangitan
  rationale: Ang עָבִים ay makakapal na ulap, at ang שְׁחָקִים ay tumutukoy sa kalangitan o matataas na himpapawid. Dignified at madaling maunawaan ang salin.
