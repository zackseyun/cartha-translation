  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: tl
  text: 'Tumatawag ako kay Yahweh, na karapat-dapat purihin,

    at naliligtas ako mula sa aking mga kaaway.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְהֻלָּל
  choice: na karapat-dapat purihin
  rationale: Ang passive participle ng הלל ay naglalarawan kay Yahweh bilang dapat purihin. Likas sa modernong Tagalog ang pariralang ito at napapanatili ang adjectival na diwa.
- source_word: אֶקְרָא
  choice: Tumatawag ako kay
  rationale: Ang קרא kasama ng pangalan ng Diyos ay tumutukoy sa pagtawag o pagdaing sa kanya. Ang aspektong imperfect ay angkop na ihayag bilang pangkalahatan o paulit-ulit na kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וּמֵאֹיְבַי
  choice: at ... mula sa aking mga kaaway
  rationale: Pinananatili ng “at” ang koordinasyon ng וּ, at tuwirang ipinapahayag ng “mula sa aking mga kaaway” ang pinagmumulan ng pagliligtas nang walang idinagdag na larawang wala sa Hebreo.
- source_word: אִוָּשֵׁעַ
  choice: inililigtas niya ako
  rationale: Ang Niphal imperfect ng ישׁע ay literal na passive, “naliligtas ako.” Sa natural na Tagalog, ang aktibong “inililigtas niya ako” ay malinaw na nagpapahayag ng pagliligtas, at si Yahweh ang di-tahasang tagaganap ayon sa konteksto.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng titulo.
- issue: Di-tahasang tagaganap ng pagliligtas sa אִוָּשֵׁעַ
  choice: inililigtas niya ako
  alternative: naliligtas ako
  rationale: Passive ang anyong Hebreo at hindi tahasang inuulit ang tagaganap. Sa konteksto, si Yahweh ang malinaw na pinagmumulan ng pagliligtas; ginagamit ang natural na aktibong Tagalog nang hindi nagdaragdag ng ibang teolohikal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Gumamit ng dalawang linyang anyong patula. Walang talababa dahil natural na naipahahayag sa pangunahing teksto ang diwa ng מְהֻלָּל.
