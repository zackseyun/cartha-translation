  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: tl
  text: Nang magkagayon, umuga at yumanig ang lupa; nanginig at umuga ang mga pundasyon ng langit, sapagkat siya'y nagalit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ / וַיִּתְגָּעֲשׁוּ
  choice: umugoy / umuga
  rationale: Pinananatili ang magkaugnay ngunit hindi lubos na magkaparehong galaw ng lupa at ng mga pundasyon; natural din ang mga pandiwang ito sa makabagong Tagalog.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: mga pundasyon ng langit
  rationale: Tuwirang pinananatili ang kosmikong larawan at ang pangmaramihang 'mga pundasyon.'
- source_word: יִרְגָּזוּ
  choice: nanginig
  rationale: Ipinahahayag ang marahas na panginginig nang hindi dinaragdagan ang kahulugan ng pinagmulang salita.
- source_word: כִּי חָרָה לוֹ
  choice: sapagkat nag-alab ang kanyang galit
  rationale: Ang idyomang Hebreo ay literal na may diwang 'uminít/nag-alab sa kanya'; ang saling ito ay malinaw sa Tagalog habang pinananatili ang larawan ng nag-aapoy na galit.
theological_decisions:
- issue: Paksa ng galit sa כִּי חָרָה לוֹ
  choice: ang kanyang galit
  alternative: siya ay nagalit
  rationale: Kapwa posible bilang natural na pagpapahayag, ngunit ang napiling anyo ay mas malapit sa nag-aalab na puwersa ng idyomang Hebreo at hindi nagdaragdag ng dahilan o layon ng galit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino; pinanatili ang matinding patulang paglalarawan at ang paralelismo ng mga galaw.
