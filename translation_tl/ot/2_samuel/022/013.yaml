  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: tl
  text: Mula sa ningning sa harap niya[a], nagliyab ang mga baga ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula sa liwanag sa harap niya, nagningas ang mga baga ng apoy.”
    reason: Alternatibong pagsasalin sa נֹגַהּ at בָּעֲרוּ; inalis ang tautolohikal na “nagliliyab” kasunod ng “nagningas.”
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Mula sa ningning
  rationale: Ang נֹגַהּ ay tumutukoy sa ningning o maningning na liwanag. Likas at marangal sa modernong Filipino ang “ningning,” at isinasalin ng “mula sa” ang panlaping מִן bilang pinagmulan.
- source_word: נֶגְדּוֹ
  choice: sa harap niya
  rationale: Ang נֶגֶד na may hulaping ikatlong panauhang panlalaki ay nangangahulugang nasa harap niya. Pinananatili nito ang larawang panlunan nang hindi dinaragdagan ng salitang “presensya.”
- source_word: בָּעֲרוּ
  choice: nagliyab
  rationale: Ang qal ng בער ay nangangahulugang magsunog, magningas, o magliyab. Ang “nagliyab” ay masigla at likas na paglalarawan sa biglang pag-alab ng mga baga.
- source_word: גַּחֲלֵי אֵשׁ
  choice: mga baga ng apoy
  rationale: Tuwirang pinananatili ng parirala ang anyong construct na “mga baga ng apoy” at ang matinding larawang patula ng Hebreo.
theological_decisions:
- issue: Larawang teopanik at hindi tahasang paksa
  choice: Inilalarawan ang mga baga ng apoy na nagliyab mula sa ningning sa harap niya, nang hindi nagdaragdag ng tahasang pagkilos ng Diyos.
  alternative: “Pinaalab ng kanyang ningning ang mga baga ng apoy.”
  rationale: Masinsin at patula ang Hebreo at hindi nito tahasang sinasabing ang ningning ang sanhi o ang Diyos ang tuwirang gumawa. Pinananatili ng salin ang pagkakasunod at tunay na kalabuan ng larawan.
translation_notes:
  register: Modernong Filipino Tagalog na patula, marangal, at madaling maunawaan. Ginamit ang “niya” sa maliit na titik alinsunod sa karaniwang kasalukuyang tuntunin at upang huwag magpasok ng tipograpikong interpretasyon na wala sa Hebreo.
