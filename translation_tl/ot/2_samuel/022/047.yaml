  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: tl
  text: Buhay si Yahweh! Purihin nawa ang aking Bato! Dakilain nawa ang Diyos, ang Bato ng aking kaligtasan![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang hulihang parirala na “ang Diyos ng Bato ng aking kaligtasan.”
    reason: Pinananatili ang posibleng mahigpit na construct na pagbasa ng אֱלֹהֵי צוּר יִשְׁעִי, sa halip na tahimik na lutasin ang gramatikal na kalabuan.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh!
  rationale: 'Ang pang-uring חַי kasama ng banal na pangalan ay isang masiglang pahayag ng papuri: buhay at kumikilos si Yahweh. Natural sa modernong Tagalog ang sugnay na “Buhay si Yahweh,” at pinananatili nito ang doxological na diin.'
- source_word: וּבָרוּךְ
  choice: Purihin
  rationale: Sa konteksto ng pagpupuri, ang בָּרוּךְ ay isang pagbubunyi sa Diyos. Mas natural at marangal sa Tagalog ang “Purihin” kaysa sa literal ngunit alanganing “Pagpalain,” na maaaring magpahiwatig na tao ang nagbibigay ng pagpapala sa Diyos.
- source_word: צוּרִי
  choice: ang aking Bato
  rationale: Pinananatili ang kongkretong talinghaga ng צוּר bilang larawan ng katatagan at kanlungan ng Diyos. Ginamit ang malaking titik sa “Bato” dahil titulo o metapora ito para sa Diyos sa taludtod.
- source_word: וְיָרֻם
  choice: Dakilain
  rationale: Ang anyong jussive ay nagpapahayag ng hangarin o panawagan sa pagpupuri. Ang “Dakilain” ay natural na katumbas sa Tagalog at kaagapay ng “Purihin.”
- source_word: אֱלֹהֵי
  choice: ang Diyos
  rationale: Isinalin bilang “ang Diyos” at itinuring na sinusundan ng paliwanag na appositional, alinsunod sa paralelismong patula. Ang posibleng mahigpit na construct reading ay inilagay sa talababa.
- source_word: צוּר יִשְׁעִי
  choice: ang Bato ng aking kaligtasan
  rationale: Pinananatili ang metaporang “Bato” at ang malawak na diwa ng יֶשַׁע bilang “kaligtasan.” Hindi ito pinalitan ng mas interpretibong “kanlungan” o nilimitahan sa isang partikular na uri ng pagliligtas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Talinghagang צוּר para sa Diyos
  choice: Bato
  alternative: kanlungan; matibay na bato
  rationale: Mahalaga sa teolohiya at tula ng taludtod ang larawan ng Diyos bilang Bato—matatag, maaasahan, at mapagligtas—kaya hindi ito ipinakahulugan lamang bilang “kanlungan.”
- issue: Ugnayan ng אֱלֹהֵי צוּר יִשְׁעִי
  choice: ang Diyos, ang Bato ng aking kaligtasan
  alternative: ang Diyos ng Bato ng aking kaligtasan; ang Diyos ng aking batong tagapagligtas
  rationale: Maaaring basahin nang mahigpit na construct chain ang anyong Masoretiko, ngunit ang paralelismong patula at ang diwa ng katabing mga linya ay sumusuporta sa appositional na pagbasa. Dahil tunay ang gramatikal na tensiyon, hindi itinago ang alternatibo kundi inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa patulang pagpupuri. Gumamit ng maiikli at magkakatulad na pagbubunyi upang maipakita ang tatluhang ritmo ng Hebreo. Pinanatili ang “Yahweh,” “Bato,” at “kaligtasan” bilang mahahalagang terminong teolohikal, habang iniwasan ang lipas o pilit na sintaks.
