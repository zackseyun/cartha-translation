  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: tl
  text: 'Nakitungo[a] sa akin si Yahweh ayon sa aking katuwiran;

    ginantimpalaan niya ako ayon sa kalinisan ng aking mga kamay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ginantimpalaan ako.” Ang pandiwang Hebreo ay maaaring mangahulugang makitungo o gumanti sa isang tao ayon sa kanyang ginawa.
    reason: lexical_alternative
  - marker: b
    text: Ang “kalinisan ng aking mga kamay” ay isang Hebreong pahayag na tumutukoy sa kawalang-sala o kalinisan ng mga gawa ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: Nakitungo sa akin
  rationale: Ang גמל ay maaaring tumukoy sa pakikitungo o pagganti sa isang tao ayon sa kanyang ginawa. Pinananatili ng “nakitungo sa akin” ang lawak ng kahulugan, habang ipinahihiwatig ng kasunod na parallel na mabuting pagganti ang tinutukoy rito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כְּצִדְקָתִי
  choice: ayon sa aking katuwiran
  rationale: Tuwirang ipinapahayag nito ang matuwid na asal ng nagsasalita sa konteksto, nang hindi ito pinalalawak bilang pag-aangkin ng ganap na kawalang-kasalanan.
- source_word: כְּבֹר יָדַי
  choice: ayon sa kalinisan ng aking mga kamay
  rationale: Pinananatili ang konkretong Hebreong larawan ng malilinis na kamay bilang sagisag ng malinis o walang-salang pagkilos.
- source_word: יָשִׁיב לִי
  choice: ginantihan niya ako
  rationale: Sa Hiphil, ang שוב dito ay nangangahulugang magsauli o gumanti. Ang “ginantihan” ay natural sa Filipino at angkop sa diwa ng katumbas na tugon sa asal.
theological_decisions:
- issue: Kung ipinahihiwatig ng talata ang ganap na kawalang-kasalanan o sariling karapat-dapat sa harap ng Diyos
  choice: Pinanatili ang tuwirang pahayag ng nagsasalita tungkol sa “aking katuwiran” at “kalinisan ng aking mga kamay.”
  alternative: Palambutin ang personal na pag-aangkin ng katuwiran, o ipakahulugan itong ganap na kawalang-kasalanan at kaligtasang nakamit sa sariling gawa.
  rationale: Malinaw na nasa unang panauhan ang Hebreo. Hindi dapat alisin ang tensiyong teolohikal nito, ngunit hindi rin dapat dagdagan ang teksto ng pag-aangkin tungkol sa ganap na kawalang-kasalanan o kaligtasan sa pamamagitan ng merito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismong patula at ang konkretong larawan ng “malilinis na kamay.”
