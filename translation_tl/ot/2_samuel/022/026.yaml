  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: tl
  text: Sa taong tapat, ipinakikita mong tapat ka; sa mandirigmang walang kapintasan, ipinakikita mong wala kang kapintasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: tapat
  rationale: Sa kontekstong ito, tumutukoy ito sa taong may matatag na katapatan; pinananatili rin ng salin ang pag-uulit na kaugnay ng pandiwang תִּתְחַסָּד.
- source_word: תִּתְחַסָּד
  choice: ipinakikita mong tapat ka
  rationale: Ang anyong pandiwa ay nagpapahayag kung paano ipinakikilala o ipinakikita ng Diyos ang sarili sa tapat; natural ito sa Tagalog at pinananatili ang ugnayang-ugat sa חָסִיד.
- source_word: גִּבּוֹר תָּמִים
  choice: mandirigmang walang kapintasan
  rationale: Ang גִּבּוֹר ay isang makapangyarihang lalaki o mandirigma; sa awit ng mandirigma, ang 'mandirigma' ang angkop sa konteksto. Ang תָּמִים ay inilalarawang buo sa asal o walang kapintasan.
- source_word: תִּתַּמָּם
  choice: ipinakikita mong wala kang kapintasan
  rationale: Pinananatili ang paglalaro sa ugat ng תָּמִים at ang reflexive o self-presentational na diwa nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglalarawan sa tugon ng Diyos ayon sa pagkatao ng tao
  choice: 'Pinanatili ang magkatugmang pahayag: sa tapat ay ipinakikita ng Diyos na tapat siya, at sa walang kapintasan ay wala siyang kapintasan.'
  alternative: Ipaliwanag ito bilang paggantimpala ng Diyos o bilang ganap na pahayag tungkol sa kanyang likas.
  rationale: Hindi tahasang sinasabi ng Hebreo kung mekanismo ng pagganti o pangkalahatang paglalarawan ng likas ng Diyos ang tinutukoy; iniiwasan ng salin na lutasin ang tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang parallelismo at pag-uulit ng mga salitang magkaugnay sa Hebreo.
