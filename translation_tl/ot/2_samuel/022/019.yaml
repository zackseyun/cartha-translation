  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: tl
  text: Hinarap nila ako[a] sa araw ng aking kapahamakan, ngunit si Yahweh[b] ay sandigan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sinalubong nila ako” o “Dinatnan nila ako.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay transliterasyon ng banal na pangalang Hebreo na YHWH; sa tradisyon, isinasalin itong “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: Sinalubong nila ako
  rationale: Ang Piel ng קדמ na may unang panauhang layon ay nangangahulugang lumapit, sumalubong, o humarap sa isang tao. Sa kontekstong ito, masama ang layunin ng mga kaaway; pinananatili ng “sinalubong” ang kilos nang hindi labis na nililinaw kung ito ay pag-atake o pagharang.
- source_word: בְּיוֹם אֵידִי
  choice: sa araw ng aking kapahamakan
  rationale: Tuwirang ipinapahayag ang panahong tinutukoy, at ang “kapahamakan” ay angkop sa אֵיד bilang matinding sakuna o pagbagsak, hindi lamang panloob na paghihirap.
- source_word: וַיְהִי
  choice: ngunit ... ang naging
  rationale: 'Bagaman pormal na may pang-ugnay na “at,” malinaw sa daloy ang pagsalungat: dumating ang mga kaaway sa panahon ng kapahamakan, ngunit nagbigay ng sandigan si Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: מִשְׁעָן לִי
  choice: ang naging sandigan ko
  rationale: Ang מִשְׁעָן ay isang bagay na masasandalan o maaasahan. Ang “sandigan” ay natural at marangal na metapora sa modernong Filipino, at ipinapahayag ng “ko” ang ugnayang nasa לִי.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Lakas ng kilos sa יְקַדְּמֻנִי
  choice: Sinalubong nila ako
  alternative: Hinarap nila ako
  rationale: May mapanlabang diwa ang konteksto, ngunit hindi tahasang sinasabi ng pandiwa kung paano naganap ang pagharap. Iniiwasan ng “sinalubong” ang pagdaragdag ng mas tiyak na kilos kaysa sa nasa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kapahamakan” at “sandigan” upang mapanatili ang matalinghagang lakas ng Hebreo habang nananatiling malinaw sa karaniwang mambabasa.
