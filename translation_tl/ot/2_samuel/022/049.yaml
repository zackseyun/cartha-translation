translation:
  language: tl
  text: na naglalabas sa akin mula sa aking mga kaaway; itinataas mo ako sa ibabaw ng mga bumabangon laban sa akin; inililigtas mo ako mula sa taong marahas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “mula sa isang taong marahas.” Literal, “mula sa isang tao ng mga karahasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: na naglalabas sa akin
  rationale: Pinananatili ang konkretong larawang causative ng יצא, “naglalabas,” at ang kaugnayang panlarawan sa Diyos mula sa naunang konteksto.
- source_word: מֵאֹיְבָי
  choice: mula sa aking mga kaaway
  rationale: Tuwirang inililipat ang pang-ukol at pangngalang may hulaping unang panauhang isahan.
- source_word: וּמִקָּמַי
  choice: mga bumabangon laban sa akin
  rationale: Pinananatili ang pandiwang larawan ng קום at ang diwang mapanlaban, sa halip na gawing pangkalahatang “mga kalaban.”
- source_word: תְּרוֹמְמֵנִי
  choice: itinataas mo ako nang higit sa
  rationale: Ipinahahayag ang pag-angat sa ibabaw ng mga kaaway at pinananatili ang patayong metapora ng רום sa natural na Tagalog.
- source_word: מֵאִישׁ חֲמָסִים
  choice: mula sa taong marahas
  rationale: Pinananatili ang isahang איש, habang natural na ipinahahayag sa Tagalog ang katangiang marahas na nasa חֲמָסִים.
- source_word: תַּצִּילֵנִי
  choice: inililigtas mo ako
  rationale: Ang “inililigtas” ay natural at marangal na katumbas ng נצל sa konteksto ng pagsagip mula sa marahas na kaaway.
theological_decisions:
- issue: Pagkakakilanlan ng “taong marahas”
  choice: 'Pinanatiling pangkalahatan at isahan: “taong marahas.”'
  alternative: Tukuyin bilang isang partikular na makasaysayang kaaway o gawing maramihan.
  rationale: Isahan ang איש, ngunit hindi pinapangalanan ng talata ang tinutukoy; kaya hindi dapat ipasok ang isang tiyak na interpretasyong teolohikal o pangkasaysayan.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang tatlong magkakatulad na sugnay at ang mga konkretong larawang “naglalabas,” “itinataas,” at “bumabangon.”
