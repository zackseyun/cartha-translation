id: 2SA.22.29
reference: 2 Samuel 22:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: tl
  text: Sapagkat ikaw ang aking ilawan, Yahweh, at binibigyang-liwanag ni Yahweh ang aking kadiliman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang pang-ugnay na nagpapaliwanag o nagbibigay-batayan sa naunang pahayag, nang hindi labis na nililimitahan ang gamit nito sa mahigpit na sanhi lamang.
- source_word: אַתָּה
  choice: ikaw
  rationale: Tuwirang ikalawang panauhang isahan na pakikipag-usap sa Diyos; natural at malinaw sa modernong Tagalog.
- source_word: נֵירִי
  choice: aking ilawan
  rationale: Ang נֵר ay konkretong ilawan, hindi lamang abstraktong liwanag. Pinananatili ng “ilawan” ang matingkad na metapora ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: וַיהוָה
  choice: at ... ni Yahweh
  rationale: Pinananatili ang pang-ugnay at ang pag-uulit ng banal na pangalan sa ikalawang sugnay, gaya ng paralelismo sa Hebreo.
- source_word: יַגִּיהַּ
  choice: binibigyang-liwanag
  rationale: 'Ipinahahayag ang causative na diwa ng Hiphil: si Yahweh ang nagpapaliwanag o nagbibigay-liwanag sa kadiliman.'
- source_word: חָשְׁכִּי
  choice: aking kadiliman
  rationale: Pinananatili ang unang panauhang hulapi at ang bukas na metaporikal na kahulugan, nang hindi tinutukoy kung ito ay panganib, dalamhati, o ibang uri ng paghihirap.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kalikasan ng metaporang נֵירִי
  choice: aking ilawan
  alternative: aking liwanag
  rationale: 'Mas kongkreto ang Hebreo: inilalarawan ang Diyos bilang ilawan. Hindi ito ginagawang abstraktong “liwanag,” bagaman iyon ang ipinahihiwatig na epekto.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang konkretong imahen ng “ilawan,” ang pag-uulit ng “Yahweh,” at ang personal na “aking kadiliman.” Hindi nilagyan ng talababa dahil ang tekstong salin mismo ay sapat na malinaw at walang alternatibong kailangang ilahad upang mapanatili ang tunay na ambiguwidad.
