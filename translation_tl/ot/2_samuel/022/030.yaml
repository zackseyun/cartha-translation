  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: tl
  text: Sapagkat sa pamamagitan mo, kaya kong sumugod laban sa isang pangkat ng mandirigma[a][b]; sa pamamagitan ng aking Diyos, kaya kong lumundag sa ibabaw ng isang pader[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “kasama mo” o “sa tulong mo”; maaaring magpahayag ang pang-ukol sa Hebreo ng pagsama o ng paraan. Dito, itinuring itong paraan: binibigyan ng Diyos ng kakayahan ang nagsasalita.'
    reason: lexical_alternative
  - marker: b
    text: O “isang pangkat ng mga mananalakay.”
    reason: lexical_alternative
  - marker: c
    text: O “isang tanggulang pader.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang papuri at patotoo, at natural ang ugnayang ito sa makatang Filipino.
- source_word: בְכָה
  choice: sa pamamagitan mo
  rationale: Ang pang-ukol na בְּ ay maaaring tumukoy sa paraan o kasabay; dito, ang pangunahing salin ay paraan, na nagpapakitang ang Diyos ang nagbibigay-kakayahan.
- source_word: אָרוּץ
  choice: kaya kong sumugod
  rationale: Ang Qal imperfect ay maaaring magpahayag ng kakayahan sa kontekstong makata. Ang “sumugod” ay natural sa larawang pandigma at pinananatili ang diwa ng mabilis na pagkilos laban sa isang pangkat.
- source_word: גְּדוּד
  choice: isang pangkat ng mandirigma
  rationale: Maaaring tumukoy sa hukbo, pangkat, o pangkat ng mga mananalakay. Ang parirala ay malinaw sa modernong Filipino nang hindi labis na nililimitahan ang uri ng pangkat.
- source_word: בֵּאלֹהַי
  choice: sa pamamagitan ng aking Diyos
  rationale: Inuulit ang diwa ng paraan o nagbibigay-kakayahang ahensiya, habang pinananatili ng “aking Diyos” ang personal na tono.
- source_word: אֲדַלֶּג
  choice: kaya kong lumundag sa ibabaw
  rationale: Ang Piel imperfect ng דלג ay nangangahulugang lumundag o tumalon; ang pagpapahayag ng kakayahan ay kaagapay ng unang linya.
- source_word: שׁוּר
  choice: isang pader
  rationale: Tumutukoy sa pader, lalo na bilang harang o bahagi ng tanggulan. “Pader” ang pinakadirekta at madaling maunawaan sa Filipino.
theological_decisions:
- issue: Pagbibigay-kakayahan ng Diyos sa larawang pandigma
  choice: 'Inilarawan ang mga kilos bilang kakayahang nagmumula sa Diyos: “kaya kong sumugod” at “kaya kong lumundag.”'
  alternative: 'Payak na paglalahad ng kilos: “sumusugod ako” at “lumulundag ako.”'
  rationale: Sa makatang konteksto, likas na maipahayag ng mga imperfect ang kakayahang dulot ng tulong ng Diyos. Hindi nito pinalalawak ang pahayag tungo sa isang doktrinang lampas sa talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sa pamamagitan” upang malinaw na ipahayag ang paraang nagbibigay-kakayahan, at pinanatili ang magkatimbang na estruktura ng dalawang linyang makata.
