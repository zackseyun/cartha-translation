  source_fidelity: Ang “aking mga paa” ay sumusunod sa qere (רַגְלַי), na umaayon sa unang panauhan sa mga kasunod na sugnay. Gayunman, ang ketiv ay “kanyang mga paa” (רַגְלָיו), kaya dapat itong ipabatid sa talababa. Ang “pinatatatag niya ako” ay maayos na nagpapahiwatig ng Hiphil na pagpapastand/magpanatag sa matataas na dako.
  naturalness: Ang “Ginagawa niyang tulad ng sa mga usa ang aking mga paa” ay hindi likas na ayos sa modernong Filipino dahil malabo ang “tulad ng sa.” Mas malinaw at natural ang paghahambing na “tulad ng mga paa ng usa.”
  terminology: Ang “mga usa,” “matataas na dako,” at “pinatatatag” ay angkop sa patulang rehistro at hindi ipinapalagay na ang mga “mataas na dako” ay mga pook-sambahan.
