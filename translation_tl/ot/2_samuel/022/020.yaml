  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: tl
  text: Inilabas niya ako tungo sa maluwang na lugar[a]; iniligtas niya ako sapagkat nalugod siya sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungo sa bukás na lugar” o “tungo sa malawak na lugar.” Inihahambing ng larawang Hebreo ang kalayaan at ginhawa sa pagkakasikip o kagipitan.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat kinalugdan niya ako” o “sapagkat nasiyahan siya sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Inilabas niya ako
  rationale: Ang Hiphil ng יצא ay may sanhiang diwang “ilabas.” Natural ito sa modernong Tagalog at pinananatili ang larawan ng pagliligtas mula sa pagkakakulong o kagipitan.
- source_word: לַמֶּרְחָב
  choice: sa maluwang na lugar
  rationale: Ang מֶרְחָב ay tumutukoy sa malawak, bukás, o maluwang na pook, na kaibahan ng pagkakasikip at kagipitan. Pinananatili ng salin ang kongkretong larawan sa Hebreo.
- source_word: יְחַלְּצֵנִי
  choice: iniligtas niya ako
  rationale: Ang Piel ng חלץ ay maaaring mangahulugang hugutin, iligtas, o sagipin. Ang “iniligtas” ay malinaw at likas sa Tagalog, at kaagapay ng naunang sugnay.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagliligtas. Ang “sapagkat” ay dignificado ngunit nauunawaan pa rin sa modernong Tagalog.
- source_word: חָפֵץ בִּי
  choice: nalugod siya sa akin
  rationale: Ang חפץ na may ב ay nagpapahayag ng pagkakaroon ng lugod o kasiyahan sa isang tao. Iniiwasan ng “nalugod” ang labis na pagpapaliwanag habang pinananatili ang personal at positibong diwa.
theological_decisions:
- issue: Dahilan ng pagliligtas ng Diyos
  choice: sapagkat nalugod siya sa akin
  alternative: sapagkat kinalugdan niya ako / sapagkat nasiyahan siya sa akin
  rationale: Tahasang iniuugnay ng talata ang pagliligtas sa pagkalugod ng Diyos kay David. Pinananatili ang ugnayang ito nang hindi ipinapakahulugan kung ito ay gantimpala sa merito o bahagi ng mas malawak na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang paralelismo at ang larawan ng paglabas tungo sa maluwang na pook. Inilagay ang [b] pagkatapos ng buong pariralang tinutukoy nito.
