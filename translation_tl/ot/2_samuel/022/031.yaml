  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: tl
  text: Kung tungkol sa Diyos, walang kapintasan ang kanyang daan; ang salita ni Yahweh ay nasubok na[a]. Siya ay kalasag ng lahat ng kumakanlong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinalisay” o “napatunayang dalisay.” Inilalarawan ng Hebreo ang metal na dinadalisay at sinusubok sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Kung tungkol sa Diyos
  rationale: Ipinapahayag ang Diyos bilang paksa sa pasimula ng sugnay at natural na tinutumbasan ang topical opening ng Hebreo.
- source_word: תָּמִים דַּרְכּוֹ
  choice: walang kapintasan ang kanyang daan
  rationale: Ang תָּמִים ay nagsasaad ng pagiging buo at walang depekto; ang 'daan' ay tumutukoy sa paraan ng pagkilos ng Diyos.
- source_word: אִמְרַת יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng 'salita' ang malawak na diwa ng אִמְרָה bilang sinabi o pahayag, at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: צְרוּפָה
  choice: subok na
  rationale: 'Ipinahahayag nito ang resulta ng larawan ng metal na dinalisay at sinubok: napatunayang dalisay at maaasahan.'
- source_word: מָגֵן הוּא
  choice: Siya ay kalasag
  rationale: Pinananatili ang tuwirang metapora ng proteksiyon at ang tahasang panghalip ng Hebreo.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: ng lahat ng nanganganlong sa kanya
  rationale: Ang חוסה ay konkretong paghanap ng kanlungan, kaya mas tumpak ang 'nanganganlong' kaysa sa mas abstraktong 'nagtitiwala.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Metaporikal na puwersa ng צְרוּפָה
  choice: subok na
  alternative: dinalisay; napatunayan
  rationale: Ang 'subok na' ay malinaw sa modernong Tagalog ngunit pinahihintulutan ng talababa na manatili ang larawan ng pagdadalisay ng metal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong patula, ang konkretong larawan ng kalasag at kanlungan, at ang ambiguity ng צְרוּפָה sa pamamagitan ng talababa.
