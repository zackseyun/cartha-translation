  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: tl
  text: Umakyat ang usok mula sa mga butas ng kanyang ilong[a], at apoy na tumutupok mula sa kanyang bibig; nagliyab ang mga baga mula sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kanyang ilong.” Ang salitang Hebreo para sa “ilong” o “butas ng ilong” ay maaari ring tumukoy sa “galit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: Pumailanlang
  rationale: Ipinahahayag ang paitaas na paggalaw ng usok sa natural ngunit marangal na wikang patula.
- source_word: עָשָׁן
  choice: usok
  rationale: Tuwiran at karaniwang katumbas ng pangngalan.
- source_word: בְּאַפּוֹ
  choice: mula sa kanyang mga butas ng ilong
  rationale: Pinananatili ang kongkretong larawang antropomorpiko at ang pagkakatulad nito sa 'mula sa kanyang bibig'; ang pang-ukol ay isinalin ayon sa diwa ng usok na lumalabas mula roon.
- source_word: וְאֵשׁ
  choice: at apoy
  rationale: Tuwirang pinananatili ang pangatnig at pangngalan.
- source_word: מִפִּיו
  choice: mula sa kanyang bibig
  rationale: Tuwiran at natural, at pinananatili ang paralelismo sa mga butas ng ilong.
- source_word: תֹּאכֵל
  choice: na tumutupok
  rationale: Pinananatili ang aktibong larawan ng apoy na lumalamon o umuubos, sa paraang natural sa Filipino.
- source_word: גֶּחָלִים
  choice: mga baga
  rationale: Ang 'mga baga' ang karaniwang Filipino para sa nagbabagang uling o coals sa ganitong konteksto.
- source_word: בָּעֲרוּ
  choice: nagliyab
  rationale: Malinaw at masiglang ipinahahayag ang pagningas o matinding pagkasunog.
- source_word: מִמֶּנּוּ
  choice: mula sa kanya
  rationale: Pinananatili ang pinagmulan ng nagliliyab na mga baga at ang matinding larawan ng teopaniya.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos sa teopaniya
  choice: Panatilihin nang kongkreto ang 'mga butas ng ilong,' 'bibig,' at ang apoy at usok na nagmumula sa kanya.
  alternative: Unawain ang אַף bilang 'galit' at gawing abstrakto ang paglalarawan.
  rationale: Ang talata ay patulang teopaniya. Ang kongkretong larawan ay nagpapanatili sa paralelismo at puwersa ng Hebreo nang hindi nilulutas ang matalinghagang tensiyon bilang isang abstraktong pahayag lamang tungkol sa galit.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang matingkad na larawang teopaniko at ang tatluhang galaw ng usok, apoy, at mga baga.
