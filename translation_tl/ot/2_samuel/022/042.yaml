  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: tl
  text: Dumaing sila, ngunit walang sinumang magliligtas; dumaing sila kay Yahweh, ngunit hindi niya sila sinagot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: Humingi sila ng tulong
  rationale: Sa konteksto ng pagkatalo at kawalan ng tagapagligtas, ipinahahayag ng anyo ang desperadong paghingi ng saklolo, hindi lamang pagtingin.
- source_word: וְאֵין
  choice: ngunit walang
  rationale: Bagaman karaniwang pang-ugnay ang וְ, pasalungat ang diwa rito dahil nabigo ang kanilang paghingi ng tulong.
- source_word: מֹשִׁיעַ
  choice: magligtas
  rationale: Ang participle ng ישׁע ay tumutukoy sa sinumang makapagliligtas; natural sa Filipino ang 'walang magligtas' at hindi nito ginagawang titulo ang salita.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ipinakikita ng אֶל ang pinatutunguhan ng kanilang daing, at tuwirang pinananatili ang pangalang tipan na יְהוָה bilang Yahweh.
- source_word: וְלֹא עָנָם
  choice: ngunit hindi niya sila sinagot
  rationale: Ang ענה ay nangangahulugang sumagot; ang panghalip na paksa ay tumutukoy kay Yahweh, at ipinahahayag ng 'ngunit' ang kabiguang tumanggap ng tugon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang katangian nito bilang personal na pangalang tipan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Hindi pagsagot ni Yahweh
  choice: hindi niya sila sinagot
  alternative: hindi sila pinakinggan
  rationale: Mas tuwirang katumbas ng ענה ang 'sumagot.' Hindi pinalalambot o ipinapaliwanag ang teolohikal na tensiyon ng tahasang hindi pagsagot.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang magkaugnay ngunit hindi mekanikal na pariralang 'humingi ng tulong' at 'dumaing' upang gawing natural ang elipsis sa ikalawang sugnay habang pinananatili ang paralelismo.
