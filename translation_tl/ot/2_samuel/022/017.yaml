base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: tl
  text: Mula sa kaitaasan ay iniunat niya ang kaniyang kamay[a] at kinuha niya ako; hinango niya ako mula sa maraming tubig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpadala siya mula sa kaitaasan.” Ang pandiwang Hebreo ay literal na maaaring mangahulugang “magpadala” o “mag-unat.” Ang “iniunat niya ang kaniyang kamay” ay idiomatikong paglalahad sa Filipino ng pagkilos na ipinahihiwatig ng konteksto ng pagsagip; hindi tahasang binabanggit sa Hebreo ang “kamay.”
    reason: lexical_alternative
  - marker: b
    text: O “mula sa malalawak na tubig” o “mula sa malalakas na tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: nag-abot siya
  rationale: Ang pandiwa ay karaniwang nangangahulugang “magpadala” at maaari ring tumukoy sa pag-uunat. Sa larawang pagliligtas, ang “nag-abot siya” ay likas sa Filipino at ipinahihiwatig ang pagkilos mula sa itaas nang hindi tahasang nagdaragdag ng bagay gaya ng “kamay,” na wala sa Hebreo.
- source_word: מִמָּרוֹם
  choice: mula sa kaitaasan
  rationale: Pinananatili nito ang matayog at makatang spatial na larawan ng מָרוֹם nang hindi ito nililimitahan sa mas tiyak na “langit.”
- source_word: יִקָּחֵנִי
  choice: kinuha niya ako
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng לקח at hinahayaan ang kasunod na pandiwa na linawin ang larawan ng pagsagip.
- source_word: יַמְשֵׁנִי
  choice: hinango niya ako
  rationale: Ang Hiphil ng משה ay nangangahulugang hanguin o ilabas, lalo na mula sa tubig. Ang “hinango” ay natural, marangal, at angkop sa makatang pagliligtas.
- source_word: מִמַּיִם רַבִּים
  choice: mula sa maraming tubig
  rationale: Pinananatili nito ang literal at makatang larawan ng Hebreo. Maaaring ipakahulugan ang רַבִּים bilang malawak, malakas, o saganang tubig, ngunit hindi iyon pinipili nang tahasan sa pangunahing teksto.
theological_decisions:
- issue: Larawan ng pagliligtas ng Diyos mula sa itaas
  choice: Panatilihin ang “mula sa kaitaasan” at huwag gawing tahasang “mula sa langit.”
  alternative: mula sa langit
  rationale: Ang Hebreo ay gumagamit ng pangkalahatang salitang tumutukoy sa mataas na dako. Nananatili sa salin ang transendenteng pagkilos ng Diyos nang hindi dinaragdagan ang kosmolohikal na katiyakan ng teksto.
- issue: Hindi binanggit na layon ng יִשְׁלַח
  choice: Gamitin ang “nag-abot siya” nang hindi idinaragdag ang “kamay.”
  alternative: iniunat niya ang kanyang kamay
  rationale: Malinaw sa konteksto ang kilos ng pagsagip, ngunit walang tahasang layon ang pandiwa sa Hebreo. Iniiwasan ng pangunahing salin na gawing eksplisito ang ipinahihiwatig lamang.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang “kaitaasan” at “hinango” upang mapanatili ang mataas na rehistro ng awit, ngunit nananatiling madaling maunawaan. Ang semicolon ay nagpapanatili sa tatlong magkakasunod na kilos ng pagliligtas.
