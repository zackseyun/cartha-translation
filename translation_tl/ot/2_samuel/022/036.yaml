base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/036.yaml
  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: tl
  text: 'Ibinigay mo sa akin ang kalasag ng iyong pagliligtas,

    at ang pagpapakumbaba mo[a] ang nagpadakila sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kahinahunan mo” o “ang mapagpalang pagyukod mo.” Mahirap tiyakin ang kahulugan ng salitang Hebreo; maaaring tumukoy ito sa mapagpalang pagyukod ng Diyos upang itaas ang nagsasalita. Nauunawaan din ito ng ilan bilang “ang pagtulong mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Ibinigay mo
  rationale: Pinananatili ang payak na nagdaang kilos ng Qal wayyiqtol at ang tuwirang pakikipag-usap sa Diyos.
- source_word: לִי
  choice: sa akin
  rationale: Likas na katumbas sa Tagalog ng di-tuwirang layon sa pariralang 'ibinigay mo sa akin.'
- source_word: מָגֵן
  choice: kalasag
  rationale: Pinananatili ang kongkretong larawang pandigma sa halip na gawin itong abstraktong 'proteksiyon.'
- source_word: יִשְׁעֶךָ
  choice: iyong pagliligtas
  rationale: Malinaw at likas na ipinapahayag ang pagliligtas na nagmumula sa Diyos habang pinananatili ang anyo ng pariralang Hebreo.
- source_word: וַעֲנֹתְךָ
  choice: ang pagpapakumbaba mo
  rationale: Mahirap at pinagtatalunang anyo ito. Ang 'pagpapakumbaba' ay nagpapanatili sa kapansin-pansing larawan ng Diyos na kusang yumuyuko upang itaas ang nagsasalita, nang hindi nilulutas nang palihim ang tunay na kalabuan.
- source_word: תַּרְבֵּנִי
  choice: ang nagpadakila sa akin
  rationale: Ang Hiphil ng רבה ay nagsasaad ng pagpapalaki o pagpapadakila. Sa konteksto ng pagliligtas at pagtataas sa nagsasalita, natural ang 'nagpadakila sa akin.'
theological_decisions:
- issue: Ang kahulugan ng וַעֲנֹתְךָ kapag tumutukoy sa Diyos
  choice: ang pagpapakumbaba mo
  alternative: ang kahinahunan mo; ang mapagpalang pagyukod mo; ang pagtulong mo
  rationale: Pinananatili ng pangunahing salin ang teolohikal na tensiyon ng Diyos na nagpapakumbaba o yumuyuko upang itaas ang kanyang lingkod. Dahil mahirap ang salitang Hebreo at may iba pang posibleng pagkaunawa, inilalahad ang mga iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kongkretong 'kalasag' at ang sadyang kapansin-pansing 'pagpapakumbaba' upang hindi pakinisin ang kalabuan at teolohikal na tensiyon ng Hebreo.
