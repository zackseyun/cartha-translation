base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: tl
  text: Inubos ko sila[a] at dinurog ko sila[b]; hindi sila bumangon, at bumagsak sila sa ilalim ng aking mga paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nilipol ko sila.” Ang pandiwang Hebreo ay literal na tumutukoy sa pagkain o pag-ubos, ngunit ginagamit dito bilang larawan ng pagwasak sa digmaan.
    reason: lexical_alternative
  - marker: b
    text: O, “hinampas ko sila” o “sinugatan ko sila.” Saklaw ng pandiwang Hebreo ang marahas na paghampas, pagdurog, o pagsugat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Inubos ko sila
  rationale: Ang אכל ay literal na “kumain,” ngunit sa konteksto ng pakikipagdigma ay nangangahulugang “ubusin” o “lipulin.” Pinananatili ng “inubos” ang matinding talinghaga at likas ito sa makabagong Filipino.
- source_word: וָאֶמְחָצֵם
  choice: dinurog ko sila
  rationale: Ang מחץ ay maaaring mangahulugang “durugin,” “hampasin,” o “sugatan.” Ipinahahayag ng “dinurog” ang marahas at ganap na pagkatalo sa masining na pananalita ng awit.
- source_word: וְלֹא יְקוּמוּן
  choice: hindi sila bumangon
  rationale: Tuwirang isinasalin ang pahayag na hindi sila tumayo o bumangon, nang hindi idinaragdag ang modal na diwang “hindi nila kayang bumangon.”
- source_word: וַיִּפְּלוּ
  choice: bumagsak sila
  rationale: Ang “bumagsak” ay natural na salin ng נפל sa larawang pandigma at malinaw na naglalarawan ng pagkagupo.
- source_word: תַּחַת רַגְלָי
  choice: sa ilalim ng aking mga paa
  rationale: Pinananatili nito ang konkretong larawan ng mga kaaway na lubusang napasuko at ibinagsak sa paanan ng nagtagumpay.
theological_decisions:
- issue: Marahas na larawang pandigma sa awit ng tagumpay ni David
  choice: Panatilihin ang tahasang unang panauhang paglalarawan ng lubos na paglipol at pagkagupo.
  alternative: Palambutin ito bilang “Lubusan ko silang tinalo.”
  rationale: Gumagamit ang Hebreo ng matitindi at konkretong pandiwa ng pagkawasak at pagpapasuko. Hindi dapat pahinain ng salin ang tindi ng orihinal o gawing abstrakto ang masining na larawan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; tuwiran at masining ang himig upang tumugma sa awit ng tagumpay. Pinanatili ang magkatabing matitinding pandiwa at ang konkretong larawan ng mga kaaway sa ilalim ng mga paa.
