  text: ang Diyos na nagbibigay sa akin ng paghihiganti at nagpapasailalim sa akin ng mga bayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: ang Diyos
  rationale: Tuwirang katumbas ng pariralang tumutukoy sa Diyos.
- source_word: הַנֹּתֵן נְקָמוֹת לִי
  choice: na nagbibigay sa akin ng paghihiganti
  rationale: Pinananatili ang literal at teolohikal na tensiyon ng לִי bilang “sa akin,” sa halip na ipakahulugang “para sa akin”; maramihan sa Hebreo ang נְקָמוֹת ngunit likas sa Filipino ang kolektibong “paghihiganti.”
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: at nagpapasuko ng mga bayan sa ilalim ko
  rationale: Ipinahahayag ang larawan ng pagbaba/pagpapailalim sa kapangyarihan ng nagsasalita sa natural na Filipino, habang pinananatili ang “mga bayan” para sa עַמִּים.
theological_decisions:
- issue: Ang ugnayan ng Diyos, ng nagsasalita, at ng paghihiganti
  choice: “nagbibigay sa akin ng paghihiganti”
  alternative: “naghihiganti para sa akin”
  rationale: Hindi tahasang nilulutas ang ambiguwidad ng Hebreong לִי; sinusunod ang source evidence at ang adjudicated consultation reading na “to me.”
- issue: Pagpapailalim ng mga bayan
  choice: “nagpapasuko ng mga bayan sa ilalim ko”
  alternative: “nagpapababa ng mga bayan sa ilalim ko”
  rationale: Ang “nagpapasuko” ay natural na naghahatid ng kontekstuwal na diwa ng מוֹרִיד ... תַּחְתֵּנִי nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding pananalita ng talata at iniwasang palambutin ang “paghihiganti.”
