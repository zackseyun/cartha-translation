base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: tl
  text: Sumakay siya sa isang kerubin at lumipad; nagpakita[a] siya sa mga pakpak ng hangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakita siya sa mga pakpak ng hangin.” Ang pandiwang Hebreo ay maaaring mangahulugang “nakita siya” o “nagpakita siya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: Sumakay siya
  rationale: Ang Qal wayyiqtol ng רכב ay karaniwang nangangahulugang sumakay. Likas sa modernong Filipino ang “sumakay” at pinananatili nito ang matingkad na larawan.
- source_word: עַל
  choice: sa
  rationale: Ipinapahayag dito ng pang-ukol ang kinalalagyan o sinasakyan. Mas natural sa Filipino ang “sa” kaysa sa mekanikal na “sa ibabaw ng” sa parehong parirala.
- source_word: כְּרוּב
  choice: isang kerubin
  rationale: Isahan ang pangngalan at tumutukoy sa makalangit na nilalang na kaugnay ng trono sa Hebreong Kasulatan. Ginamit ang kinikilalang salitang “kerubin,” at nilinaw ng “isang” ang bilang.
- source_word: וַיָּעֹף
  choice: at lumipad
  rationale: Ang payak na kahulugan ng עוף ay lumipad; hindi dinagdagan ng di-tiyak na diwang gaya ng “pumailanlang.”
- source_word: וַיֵּרָא
  choice: nagpakita siya
  rationale: Ang Niphal na anyo ng ראה ay maaaring mangahulugang “nakita” o “nagpakita.” Ang “nagpakita siya” ay natural sa konteksto ng teopanikong tula, habang itinatala sa talababa ang tunay na alternatibo.
- source_word: כַּנְפֵי
  choice: mga pakpak ng
  rationale: Tuwirang inililipat ang construct plural na “mga pakpak,” na pinananatili ang konkretong larawang patula.
- source_word: רוּחַ
  choice: hangin
  rationale: Sa kontekstong ito, pinakamalamang na hangin ang kahulugan ng רוּחַ. Ang “espiritu” o “unos” ay magdaragdag ng pagpapakahulugang hindi hinihingi ng mismong salita.
theological_decisions:
- issue: Paglilipat sa larawang teopaniko ng banal na mandirigma nang hindi ito ginagawang abstrakto o sistematiko
  choice: Panatilihin ang konkretong larawan ng pagsakay sa kerubin, paglipad, at pagpapakita sa mga pakpak ng hangin.
  alternative: Ipaliwanag ang mga larawan bilang sagisag ng presensya o kapangyarihan ng Diyos.
  rationale: Patula at sadyang matingkad ang talata. Ang tuwirang pagpapanatili sa mga larawan ay hindi nagpapataw ng paliwanag na teolohikal na wala sa teksto.
- issue: Ambiguwidad ng וַיֵּרָא
  choice: nagpakita siya
  alternative: nakita siya
  rationale: Parehong posible ang diwang “nagpakita” at “nakita.” Mas natural sa pangunahing teksto ang una, ngunit pinananatili sa talababa ang pasibong pagbasa upang hindi mawala ang ambiguwidad ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli, matindi, at matalinghagang galaw ng tulang Hebreo; iniwasan ang arkaikong pananalita at labis na pagpapaliwanag.
