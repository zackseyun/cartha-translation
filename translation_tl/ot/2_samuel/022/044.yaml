  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: tl
  text: Iniligtas mo ako mula sa mga alitan ng aking bayan[a]; pinanatili mo akong pinuno ng mga bansa[b]; isang bayang hindi ko nakilala ay naglingkod sa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa mga hidwaan ng aking bayan.” Maaaring tumukoy ang Hebreo sa alitan sa loob ng sariling bayan ni David o sa mga tunggaliang kinasasangkutan ng kaniyang bayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iningatan mo ako bilang pinuno ng mga bansa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “isang bayang hindi ko nakilala ay maglilingkod sa akin.” Maaaring magkaroon ng himig na panghinaharap ang pandiwang Hebreo sa kontekstong patula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Iniligtas mo ako
  rationale: Ang Hiphil ng פלט ay nagsasaad ng pagpapaligtas o pagpapalabas mula sa panganib. Likas at malinaw sa makabagong Filipino ang “iniligtas.”
- source_word: מֵרִיבֵי עַמִּי
  choice: mula sa mga alitan ng aking bayan
  rationale: 'Maaaring tumukoy ang רִיב sa alitan, pagtatalo, o hidwaan. Pinananatili ng parirala ang malawak na ugnayan ng genitibo: maaaring mga alitan sa loob ng sariling bayan ni David o mga tunggaliang kinasasangkutan nito.'
- source_word: תִּשְׁמְרֵנִי
  choice: pinanatili mo ako
  rationale: Ang שׁמר ay maaaring mangahulugang ingatan, bantayan, o panatilihin. Sa konteksto, ang “pinanatili” ay angkop sa patuloy na pag-iingat ng Diyos kay David sa kaniyang katayuan.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: pinuno ng mga bansa
  rationale: Metaporikal na tumutukoy ang רֹאשׁ sa pangunahing pinuno. Mas natural sa Filipino ang “pinuno” kaysa literal na “ulo,” habang napapanatili ang diwa ng pamumuno sa mga bansa.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Sa kontekstong maharlika, tumutukoy ito sa mga bansang nasa labas ng Israel. Iniiwasan ng “mga bansa” ang mas huling relihiyosong pakahulugan ng “mga Hentil.”
- source_word: עַם לֹא יָדַעְתִּי
  choice: isang bayang hindi ko nakilala
  rationale: Pinananatili ng “isang bayan” ang pang-isahang kolektibong anyo ng עַם, at ipinahihiwatig ng “hindi ko nakilala” ang dating kawalan ng pagkakilala o ugnayan.
- source_word: יַעַבְדֻנִי
  choice: naglingkod sa akin
  rationale: Ang עבד ay maaaring tumukoy sa paglilingkod o pagpapasakop sa isang hari. Ang pangnagdaan ay umaayon sa mapagbalik-tanaw na konteksto ng awit, ngunit maaaring magkaroon ng hinaharap na himig ang imperfect.
theological_decisions:
- issue: Maharlikang pananalita tungkol sa pamumuno sa mga banyagang bansa
  choice: Pinanatili ang agarang makasaysayan at maharlikang diwa tungkol kay David.
  alternative: Basahin ang talata bilang tuwirang mesyaniko sa pangunahing teksto.
  rationale: Ang talata ay bahagi ng awit ni David tungkol sa pagliligtas at paghahari. Maaaring magkaroon ito ng mas malawak na tipolohikal o mesyanikong kabuluhan sa kabuuan ng Kasulatan, ngunit hindi iyon tahasang idinaragdag sa salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bayan” para sa pang-isahang עַם at “mga bansa” para sa גּוֹיִם. Pinili ang “pinuno” sa halip na literal na “ulo” upang maging natural nang hindi nawawala ang maharlikang kahulugan.
