base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: tl
  text: At sinabi ni David kay Yahweh ang mga salita ng awit na ito noong araw na iniligtas siya ni Yahweh mula sa kamay ng lahat ng kanyang mga kaaway at mula sa kamay ni Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga salita ng awit na ito”; tahasang ipinakikilala ng pananalita ang komposisyon bilang isang awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sinabi
  rationale: Karaniwang nangangahulugang ‘nagsalita/nagsabi’ ang דּבר. Bagaman awit ang nilalaman, pinananatili ng ‘sinabi’ ang anyo ng Hebreo sa halip na gawing ‘inawit.’
- source_word: לַיהוָה / יְהוָה
  choice: kay Yahweh / ni Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang ‘Yahweh,’ ayon sa anyo ng pinagmulang teksto.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ang mga salita ng awit na ito
  rationale: Pinananatili ang parehong דִּבְרֵי (‘mga salita’) at שִׁירָה (‘awit’) sa Hebreo.
- source_word: בְּיוֹם
  choice: nang araw na
  rationale: Natural na pariralang Filipino na nagpapakilala sa pagkakataon o panahon ng pagliligtas habang pinananatili ang ‘araw’ sa Hebreo.
- source_word: הִצִּיל
  choice: iligtas
  rationale: Sa kontekstong ito, tumutukoy ang נצל sa pagliligtas mula sa kapangyarihan at panganib ng mga kaaway.
- source_word: מִכַּף
  choice: mula sa kamay ng
  rationale: Pinananatili ang konkretong metapora ng כַּף, na nagsasaad din ng kapangyarihan o pagkakahawak.
- source_word: כָּל אֹיְבָיו
  choice: lahat ng kanyang mga kaaway
  rationale: Tuwirang inilalarawan ang kabuuan ng mga kaaway ni David.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng personal na pangalan sa modernong Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang natatanging pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong idyomang ‘mula sa kamay’ at ang bahagyang pormal na ‘mga salita ng awit na ito’ dahil mahalaga ang mga ito sa anyo ng pinagmulang teksto.
