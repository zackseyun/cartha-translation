  to: At sinabi ni David kay Yahweh ang mga salita ng awit na ito noong araw na iniligtas siya ni Yahweh mula sa kamay ng lahat ng kanyang mga kaaway at mula sa kamay ni Saul.[a]
  rationale: Pinalitan ang “nang araw na” ng “noong araw na” upang maging natural at wastong Filipino, habang pinananatili ang temporal na pagtitiyak ng בְּיוֹם at ang lahat ng iba pang kahulugan ng teksto.
