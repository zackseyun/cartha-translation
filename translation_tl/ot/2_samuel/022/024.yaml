  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: tl
  text: Ako'y walang kapintasan sa harap niya[a], at iningatan ko ang sarili ko laban sa aking pagkakasala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buo/tapat ako sa kanya.” Maaaring idiin ng salitang Hebreo ang integridad o kabuuan, hindi lamang ang kawalan ng maipaparatang.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa aking kasalanan/kasamaan.” Maaaring mangahulugan ang salitang Hebreo ng pagkakasala, kasalanan, o kasamaan ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Ako'y
  rationale: Ang Qal wayyiqtol ng היה ay nagsasaad dito ng kalagayan sa nakaraan. Sa natural na tulang Tagalog, sapat ang sugnay na “Ako'y walang kapintasan”; malinaw ang aspektong nakaraan mula sa konteksto at sa kasunod na “iningatan.”
- source_word: תָמִים
  choice: walang kapintasan
  rationale: Ipinahahayag ng תָמִים ang integridad o kabuuan ng pagkatao sa moral at relasyonal na diwa. Pinananatili ng “walang kapintasan” ang matibay na pahayag nang hindi kinakailangang mangahulugan ng ganap na kawalan ng kasalanan.
- source_word: לוֹ
  choice: sa harap niya
  rationale: 'Bagaman literal na “sa kanya,” relasyonal at mapanuring idyoma ito: ganito ang kalagayan ng nagsasalita sa paningin ng Diyos. Natural sa Tagalog ang “sa harap niya.”'
- source_word: וָאֶשְׁתַּמְּרָה
  choice: iningatan ko ang sarili ko
  rationale: Ang anyong reflexive ng שׁמר ay nagpapahiwatig ng pagbabantay sa sarili. Malinaw at natural itong naihahatid ng “iningatan ko ang sarili ko.”
- source_word: מֵעֲוֺנִי
  choice: mula sa aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, kasalanan, o pagkakasala. Ang “aking kasamaan” ay nagpapanatili sa moral na bigat at sa unang-panauhang hulapi ng Hebreo.
theological_decisions:
- issue: Kung ang pahayag ni David ay nangangahulugan ng ganap na kawalan ng kasalanan
  choice: Pahayag ng integridad at pagiging walang kapintasan sa harap ng Diyos sa kontekstong ito
  alternative: Pahayag ng ganap na moral na kasakdalan
  rationale: Ang תָמִים ay maaaring maglarawan ng integridad o kabuuan nang hindi sapilitang nangangahulugan ng ganap na kawalan ng kasalanan. Pinananatili ng salin ang matinding pag-aangkin ng teksto at ang tensiyon nito, nang hindi ito nilulutas sa isang denominasyonal na paraan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ako'y” bilang natural na anyong patula at ang “sarili ko” upang mapanatili ang reflexive na diwa nang hindi nagiging labis na pormal.
