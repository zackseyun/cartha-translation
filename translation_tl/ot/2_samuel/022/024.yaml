  naturalness: Marangal at malinaw ang unang sugnay. Sa ikalawang sugnay, mas idiomatiko sa modernong Tagalog ang “iningatan ko ang sarili ko laban sa ...” kaysa “mula sa ...” kapag ang tinutukoy ay isang moral na panganib na binabantayan o iniiwasan.
