  text: כִּ֥י אֲפָפֻ֖/נִי מִשְׁבְּרֵי מָ֑וֶת נַחֲלֵ֥י בְלִיַּ֖עַל יְבַעֲתֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: tl
  text: Sapagkat pinalibutan ako ng mga daluyong ng kamatayan[a]; sinindak ako ng rumaragasang mga agos ng kasamaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga daluyong” bilang “malalakas na alon” o “mga humahampas na alon.”
    reason: lexical_alternative
  - marker: b
    text: O “mga agos ni Belial,” kung ituturing na pantanging pangalan ang בְלִיַּעַל; maaari rin itong isalin bilang “kapahamakan” o “kawalang-kabuluhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang sanhi o paliwanag na kaugnayan nito sa naunang pahayag at likas itong pakinggan sa marangal na makabagong Filipino.
- source_word: אֲפָפֻנִי
  choice: pinalibutan ako
  rationale: Malinaw na ipinahahayag ang larawan ng pagiging napalibutan o nakulong ng panganib.
- source_word: מִשְׁבְּרֵי
  choice: mga daluyong
  rationale: Ang “daluyong” ay likas at makatang salin para sa malalakas at mapanganib na alon; pinananatili nito ang marahas na larawang-tubig.
- source_word: מָוֶת
  choice: kamatayan
  rationale: Tuwirang katumbas na nagpapanatili sa personipikadong larawan ng kamatayan bilang umaapaw na panganib.
- source_word: נַחֲלֵי
  choice: rumaragasang mga agos
  rationale: Bagaman maaari itong tumukoy sa mga batis o ilog sa wadi, hinihingi ng konteksto ang larawan ng mabilis at mapaminsalang tubig.
- source_word: בְלִיַּעַל
  choice: kasamaan
  rationale: Ginamit bilang karaniwang pangngalan na tumutukoy sa ubod ng masama o mapaminsalang puwersa. Mas natural ito sa Filipino kaysa sa literal na “kawalang-kabuluhan,” habang hindi ginagawang tiyak na pangalan ang salita.
- source_word: יְבַעֲתֻנִי
  choice: sinindak ako
  rationale: Ipinahahayag ang biglaan at matinding takot na taglay ng pandiwang Hebreo.
theological_decisions:
- issue: Kung ang בְלִיַּעַל ay karaniwang pangngalan o pantanging pangalang “Belial”
  choice: Isinalin bilang karaniwang pangngalang “kasamaan” sa pangunahing teksto.
  alternative: Belial; kapahamakan; kawalang-kabuluhan
  rationale: Sa sinaunang kontekstong patula, hindi kinakailangang tumukoy ang salita sa isang personal na demonyong may pangalang Belial. Pinananatili sa talababa ang tunay na posibilidad ng pagbasa rito bilang pantanging pangalan.
translation_notes:
  register: Makabagong Filipino na marangal at makata, ngunit madaling maunawaan. Pinanatili ang magkatambal na larawang-tubig at ang matinding banta ng kamatayan at kasamaan; iniwasan ang arkaikong salita at ang hindi kailangang demonolohikal na pagpapakahulugan.
