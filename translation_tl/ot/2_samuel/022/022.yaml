base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: tl
  text: Sapagkat sinunod ko ang mga daan ni Yahweh, at hindi ako gumawa ng kasamaan sa pagtalikod sa aking Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag at natural sa marangal na tulang Filipino.
- source_word: שָׁמַרְתִּי
  choice: sinunod ko
  rationale: Ang שׁמר ay maaaring mangahulugang ingatan o sundin; sa kaugnayan nito sa mga daan ng Diyos, malinaw at natural ang 'sinunod ko.'
- source_word: דַּרְכֵי
  choice: ang mga daan
  rationale: Pinananatili ang larawang Hebreo na tumutukoy sa paraan ng pamumuhay o asal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ng isang titulo.
- source_word: וְלֹא רָשַׁעְתִּי
  choice: at hindi ako gumawa ng kasamaan
  rationale: Ipinahahayag ng רשע ang paggawa o pagkilos nang masama; malinaw itong naihahatid ng pariralang Filipino.
- source_word: מֵאֱלֹהָי
  choice: sa pagtalikod sa aking Diyos
  rationale: Ang מִן ay literal na 'mula sa,' at kasama ng רשע ay nagpapahiwatig ng masamang paglayo o pagtalikod sa Diyos; pinananatili ng salin ang kapuwa moral at relasyonal na diwa.
theological_decisions:
- issue: Paglilipat sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo, kaya pinananatili ito sa halip na palitan ng titulo.
- issue: Diwa ng רָשַׁעְתִּי מֵאֱלֹהָי
  choice: hindi ako gumawa ng kasamaan sa pagtalikod sa aking Diyos
  alternative: hindi ako masamang lumayo sa aking Diyos
  rationale: Pinananatili ng pinili ang moral na lakas ng pandiwa at ang ideya ng paglayo na ipinahihiwatig ng pang-ukol, nang hindi ito ginagawang simpleng pahayag lamang ng kawalang-sala.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang matulaing larawang 'mga daan' at iniwasan ang luma o labis na teknikal na pananalita.
