  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: tl
  text: 'Ang aking Diyos[a], ang aking bato, na sa kanya ako nanganganlong;

    ang aking kalasag at ang sungay ng aking kaligtasan[b],

    ang aking matibay na kuta at aking kanlungan,

    ang aking tagapagligtas[c]—

    inililigtas mo ako mula sa karahasan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Diyos ng aking bato.” Ganito ang mas literal na anyo ng konstruksiyong Hebreo, ngunit maaaring basahin ang dalawang parirala bilang magkatabing titulo: “ang aking Diyos, ang aking bato.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreong larawan, ang “sungay” ay sagisag ng lakas at matagumpay na kapangyarihan.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring: “ang nagliligtas sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: ang aking Diyos, ang aking bato
  rationale: Maaaring unawain nang literal ang konstruksiyon bilang “Diyos ng aking bato,” ngunit sa sunod-sunod na mga titulo sa tula, mas natural sa Tagalog ang apposisyong “ang aking Diyos, ang aking bato.” Pinananatili ito bilang tunay na alternatibo sa talababa.
- source_word: אֶחֱסֶה בוֹ
  choice: na sa kanya ako nanganganlong
  rationale: Ang חָסָה ay paghanap ng ligtas na masisilungan o kanlungan. Ang “nanganganlong” ay natural, kasalukuyan ang dating, at pinananatili ang tahasang “sa kanya.”
- source_word: מָגִנִּי
  choice: ang aking kalasag
  rationale: Tuwirang pinananatili ang kongkretong larawan ng pananggalang at proteksiyon.
- source_word: קֶרֶן יִשְׁעִי
  choice: sungay ng aking kaligtasan
  rationale: Pinananatili ang literal na larawang Hebreo ng sungay bilang sagisag ng lakas at matagumpay na kapangyarihan, sa halip na palitan agad ng paliwanag.
- source_word: מִשְׂגַּבִּי
  choice: ang aking matibay na kuta
  rationale: Ang salita ay tumutukoy sa mataas at ligtas na tanggulan. Ang “matibay na kuta” ay malinaw at natural sa makabagong Tagalog.
- source_word: וּמְנוּסִי
  choice: at kanlungan
  rationale: Tumutukoy ito sa lugar na tinatakbuhan upang maligtas. Ang “kanlungan” ay maikli, marangal, at angkop sa tula.
- source_word: מֹשִׁעִי
  choice: ang aking tagapagligtas
  rationale: Ang anyong ito mula sa יׁשׁע ay tumutukoy sa isang nagliligtas. Tapat at karaniwang Tagalog ang “tagapagligtas,” habang ang “tagapagligtas sa panganib” o “tagapagpalaya” ay mas interpretatibo.
- source_word: מֵחָמָס
  choice: mula sa karahasan
  rationale: Pinananatili ang abstraktong pangngalang חָמָס bilang “karahasan” at hindi dinaragdagan ng mga tahasang gumagawa nito, na wala sa Hebreo.
- source_word: תֹּשִׁעֵנִי
  choice: inililigtas mo ako
  rationale: Ikalawang panauhang panlalaki na may unang panauhang layon. Ipinahahayag ng aspektong Tagalog ang aktuwal o patuloy na pagliligtas nang hindi labis na nililimitahan ang aspekto ng Hebreo.
theological_decisions:
- issue: Sunod-sunod na metaporikong titulo para sa Diyos
  choice: Pinanatili ang “bato,” “kalasag,” “sungay,” “matibay na kuta,” at “kanlungan.”
  alternative: Isalin ang mga ito bilang mga abstraktong katawagang gaya ng “tagapagtanggol” o “pinagmumulan ng lakas.”
  rationale: Ang kongkretong mga larawan ang nagbibigay ng lakas at teolohikal na himig sa tula. Hindi dapat patagin ng salin ang mga ito sa paliwanag lamang.
- issue: Kahulugan ng מֹשִׁעִי
  choice: ang aking tagapagligtas
  alternative: ang aking tagapagligtas sa panganib / tagapagpalaya
  rationale: Tapat ang “tagapagligtas” sa pahayag ng teksto na ang Diyos ang nagliligtas, nang hindi nagdaragdag ng mas tiyak na uri ng pagliligtas kaysa sa isinasaad ng talata.
- issue: Aspekto ng תֹּשִׁעֵנִי
  choice: inililigtas mo ako
  alternative: ililigtas mo ako
  rationale: Maaaring magpahiwatig ang Hebreong imperfect ng patuloy, karaniwan, o hinaharap na kilos ayon sa konteksto. Ang “inililigtas mo ako” ay angkop sa papuring naglalarawan sa pagkilos ng Diyos, ngunit hindi itinatanggi ang posibleng himig na panghinaharap.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may maikling mga pariralang angkop sa tulang awit. Pinanatili ang mga kongkretong metapora at ang paglipat mula sa mga titulo tungkol sa Diyos tungo sa tuwirang pakikipag-usap sa kanya sa huling linya.
