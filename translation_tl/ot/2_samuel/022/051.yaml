  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מגדיל יְשׁוּע֣וֹת מַלְכּ֑/וֹ וְ/עֹֽשֶׂה חֶ֧סֶד לִ/מְשִׁיח֛/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֖/וֹ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: tl
  text: Dakilang pagliligtas ang ibinibigay niya sa kanyang hari[a], at ipinakikita niya ang tapat na pag-ibig[b] sa kanyang pinahiran[c]—kay David at sa kanyang lahi magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga dakilang pagliligtas” o “mga dakilang tagumpay para sa kanyang hari.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “katapatan sa tipan” o “matatag na pag-ibig.” Ang salitang Hebreo ay madalas tumukoy sa pag-ibig na tapat at matatag sa isang tipan.
    reason: lexical_alternative
  - marker: c
    text: Ang “kanyang pinahiran” ay maaari ring isaling “kanyang Mesiyas.” Dito, una itong tumutukoy kay David o sa haring mula sa kanyang angkan, habang umaalingawngaw rin ang mas malawak na pangakong mesiyaniko.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: Dakilang pagliligtas ang ibinibigay
  rationale: Ang מגדיל ay literal na ‘nagpapalaki’ o ‘ginagawang dakila,’ ngunit kasama ng יְשׁוּעוֹת ay tumutukoy sa pagbibigay ng dakilang pagliligtas o mga tagumpay. Likas sa makabagong Tagalog ang napiling ayos at napananatili nito ang diwang causative.
- source_word: מַלְכּוֹ
  choice: sa kanyang hari
  rationale: Tuwirang isinasalin ang pangngalan at hulaping panghalip, at pinananatili ang ugnayan ng Diyos at ng haring mula sa sambahayan ni David.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: at ipinakikita niya ang tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang matatag at tapat na pag-ibig, lalo na sa konteksto ng tipan. Mas natural sa karaniwang Tagalog ang ‘tapat na pag-ibig,’ habang nililinaw sa talababa ang dimensiyon ng katapatan sa tipan.
- source_word: לִמְשִׁיחוֹ
  choice: sa kanyang pinahiran
  rationale: Ang מָשִׁיחַ ay ‘taong pinahiran.’ Sa agarang konteksto, si David o ang haring Davidiko ang tinutukoy; hindi ginawang tahasang titulong ‘Mesiyas’ ang pangunahing teksto upang mapanatili ang historikal at mesiyanikong saklaw.
- source_word: לְדָוִד
  choice: kay David
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog.
- source_word: וּלְזַרְעוֹ
  choice: at sa kanyang lahi
  rationale: Ang זֶרַע ay maaaring kolektibong tumukoy sa supling o mga inapo. Ang ‘lahi’ ay natural sa Tagalog at napananatili ang kolektibong diwa at kaugnayan sa pangako.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na makabagong Tagalog para sa walang hanggang pagpapatuloy.
theological_decisions:
- issue: Paglalarawan sa חֶסֶד sa konteksto ng tipan kay David
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; matatag na pag-ibig
  rationale: Ipinahihiwatig ng salita ang pag-ibig na matatag at tapat sa ipinangakong ugnayan. Iniiwasan ng pangunahing salin ang sobrang pagpapaliwanag, ngunit pinananatili sa talababa ang mahalagang dimensiyon ng tipan.
- issue: Pagkasalin sa מְשִׁיחוֹ
  choice: kanyang pinahiran
  alternative: kanyang Mesiyas
  rationale: Unang tinutukoy rito si David at ang haring Davidiko. Pinananatili ng ‘pinahiran’ ang leksikal na kahulugan at ang mas malawak na mesiyanikong alingawngaw nang hindi pinapawi ang agarang historikal na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos ng pangungusap at ang karaniwang bokabularyong biblikal na ‘pinahiran’ at ‘magpakailanman.’ Ang gitling na em dash bago ang ‘kay David’ ay nagpapakita na si David ang agarang tinutukoy ng ‘kanyang pinahiran’ nang hindi inaalis ang saklaw sa kanyang lahi.
