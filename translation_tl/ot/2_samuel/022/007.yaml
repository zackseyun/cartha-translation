base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: tl
  text: Sa kagipitan ko ay tumawag ako kay Yahweh, at tumawag ako sa aking Diyos. Mula sa kanyang templo[b] ay narinig niya[a] ang tinig ko, at ang sigaw ko para humingi ng saklolo ay umabot sa kanyang mga tainga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naririnig niya,” bilang makatang pangkasalukuyang pagsasalin ng pandiwang Hebreo na pormal na nasa anyong pasalaysay na nakaraan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “templo” ay maaari ring mangahulugang “palasyo” o “santuwaryo,” at maaaring tumukoy dito sa makalangit na tirahan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Sa kagipitan ko
  rationale: Ipinapahayag ng parirala ang kalagayan ng matinding hirap o kapighatian; natural at marangal sa modernong Tagalog ang “sa kagipitan ko.”
- source_word: אֶקְרָא יְהוָה
  choice: tumawag ako kay Yahweh
  rationale: Ang קרא ay tumutukoy sa pagtawag o pagdaing sa Diyos. Pinanatili ang pangalang Yahweh at isinalin ang mga anyong pandiwa ayon sa salaysay ng nagdaang pagliligtas.
- source_word: וְאֶל־אֱלֹהַי אֶקְרָא
  choice: sa aking Diyos ako humingi ng saklolo
  rationale: Iniiwasan nito ang matigas na pag-uulit ng “tumawag” ngunit pinananatili ang parallelismo at nililinaw ang paghingi ng tulong na likas sa konteksto.
- source_word: וַיִּשְׁמַע
  choice: narinig niya
  rationale: Ang wayyiqtol ay pormal na pandiwang nagsasalaysay ng naganap; ang nakaraang panahunan ay angkop sa awit na nagbabalik-tanaw sa pagliligtas.
- source_word: מֵהֵיכָלוֹ
  choice: Mula sa kanyang templo
  rationale: Maaaring mangahulugan ang הֵיכָל ng templo, palasyo, o santuwaryo. “Templo” ang malinaw na pangunahing salin, habang inilalahad sa talababa ang tunay na lawak ng salita.
- source_word: שַׁוְעָתִי
  choice: ang paghingi ko ng tulong
  rationale: Ang שַׁוְעָה ay isang sigaw o daing na humihingi ng saklolo; natural sa Tagalog ang napiling parirala.
- source_word: בְּאָזְנָיו
  choice: umabot sa kanyang pandinig
  rationale: Ang literal na “sa kanyang mga tainga” ay idyomatikong nagsasaad na dininig ang daing. Pinananatili ng “umabot sa kanyang pandinig” ang larawan sa natural na Tagalog.
theological_decisions:
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ng Diyos ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit sa halip na palitan ito ng isang titulo.
- issue: Tirahan ng Diyos sa הֵיכָל
  choice: templo
  alternative: palasyo; santuwaryo
  rationale: Pinananatili ng “templo” ang sagradong diwa, ngunit hindi ipinagpapalagay na ang makalupang gusali lamang ang tinutukoy; maaaring tumukoy ang tula sa makalangit na tirahan o palasyo ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang nakaraang panahunan upang sundin ang pormal na daloy ng mga pandiwang Hebreo. Pinanatili ang parallelismo nang hindi nagiging mekanikal ang pag-uulit.
