base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: tl
  text: Dinurog ko sila na parang alabok ng lupa; tulad ng putik sa mga lansangan, pinulbos ko sila at niyurakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “inilatag ko sila” o “pinatag ko sila”; maaaring mangahulugan ang pandiwang Hebreo ng pagpalo o pagtapak upang kumalat o mapatag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Dinurog ko sila
  rationale: Ang Qal ng שׁחק na may hulaping 3mp ay nagpapahiwatig ng pagdurog o paggiling nang pino. Likas sa modernong Tagalog ang “dinurog” at pinananatili nito ang marahas na larawan.
- source_word: כַּעֲפַר אָרֶץ
  choice: na parang alabok ng lupa
  rationale: Karaniwang nangangahulugang “alabok” o pinong lupa ang עפר. Pinananatili ng parirala ang ugnayang genitibo ng Hebreo at malinaw ang paghahambing.
- source_word: כְּטִיט חוּצוֹת
  choice: tulad ng putik sa mga lansangan
  rationale: Ang טיט ay putik o burak, at ang חוצות ay mga lansangan o pampublikong lugar. Natural at malinaw sa Tagalog ang “putik sa mga lansangan.”
- source_word: אֲדִקֵּם
  choice: pinulbos ko sila
  rationale: Ang Hiphil ng דקק ay pagdurog hanggang maging pino. Iniiwasan ng “pinulbos” ang simpleng pag-uulit sa “dinurog” at pinananatili ang pagsidhi ng larawan.
- source_word: אֶרְקָעֵם
  choice: niyurakan
  rationale: Maaaring tumukoy ang רקע sa pagpalo o pagtapak upang mapatag o kumalat. Sa larawan ng putik sa lansangan at sa kontekstong pandigma, malinaw na naihahatid ng “niyurakan” ang pagtapak at paglapastangan, habang inilalagay sa talababa ang posibleng diwang paglatag o pagpapantay.
