  source_fidelity: 'Tapat ang salin sa Hebreo: ang וְאֶשְׁחָקֵם ay wastong naihayag bilang “Dinurog ko sila,” ang כַּעֲפַר אָרֶץ bilang “parang alabok ng lupa,” at ang כְּטִיט חוּצוֹת bilang “tulad ng putik sa mga lansangan.” Ang magkasunod na אֲדִקֵּם at אֶרְקָעֵם ay napapanatili bilang magkaibang marahas na kilos—“pinulbos ko sila at niyurakan”—na angkop sa paralelismo at larawang pandigma. Hindi nito ipinipilit ang isang tiyak na kahulugan sa huling pandiwa; maayos na inilalaan ng talababa ang posibleng diwa ng pagpapalatag o pagpapantay.'
