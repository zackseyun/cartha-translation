  text: חֶבְלֵ֥י שְׁא֖וֹל סַבֻּ֑/נִי קִדְּמֻ֖/נִי מֹֽקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: tl
  text: 'Pinalibutan ako ng mga lubid ng Sheol[a];

    sinalubong ako[b] ng mga bitag ng kamatayan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay” para sa “Sheol.”
    reason: alternative_reading
  - marker: b
    text: O “hinarap ako” o “dumating sa harap ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: mga lubid ng
  rationale: Pinananatili ng “mga lubid” ang konkretong larawang patula ng pagkagapos o pagkakasilo at kaagapay ng “mga bitag” sa ikalawang linya.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang katawagang Hebreo para sa daigdig o kinaroroonan ng mga patay upang hindi ito paliitin sa libingan lamang.
- source_word: סַבֻּנִי
  choice: Pinalibutan ako
  rationale: Tuwirang ipinahahayag ang diwa ng pag-ikot at lubos na pagpalibot sa nagsasalita.
- source_word: קִדְּמֻנִי
  choice: sinalubong ako
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng mga bitag na humarap o dumating upang salubungin ang nagsasalita, nang hindi labis na pinatitindi bilang paglusob.
- source_word: מֹקְשֵׁי
  choice: mga bitag ng
  rationale: Ang “mga bitag” ay malinaw at karaniwang katumbas ng mga panilo o patibong, at angkop sa larawan ng panganib.
- source_word: מָוֶת
  choice: kamatayan
  rationale: Tuwirang salin ng pangngalan at natural sa pariralang patulang “mga bitag ng kamatayan.”
theological_decisions:
- issue: Paglalahad sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Ang transliterasyon ay nagpapanatili sa lawak at tensiyong teolohikal ng katawagang Hebreo, na maaaring tumukoy sa libingan, kamatayan, o kinaroroonan ng mga patay, nang hindi pumipili nang tahasan sa isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na patula ngunit madaling maunawaan. Ginamit ang “lubid” at “bitag” upang mapanatili ang magkatugmang konkretong larawan ng pagkagapos at pagkakasilo. Ang mga marker na [a] at [b] ay inilagay kaagad pagkatapos ng kaugnay na salita o sugnay.
