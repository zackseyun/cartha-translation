source:
  edition: WLC
  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: tl
  text: Inililigtas mo ang mga taong api[a], ngunit nakatuon ang iyong mga mata sa mga palalo[b] upang ibaba sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahirap.” Ang salitang Hebreo ay maaaring tumukoy sa mahirap, naghihirap, api, o inaapi.
    reason: lexical_alternative
  - marker: b
    text: O “mga matataas,” samakatuwid ay yaong mga nagmamataas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: mga tao
  rationale: Ang pangngalang kolektibo ay tumutukoy sa isang pangkat ng mga tao. Likas sa makabagong Tagalog ang “mga tao” sa pangungusap na ito at hindi nito nililimitahan ang diwa sa isang bansang pampolitika.
- source_word: עָנִי
  choice: api
  rationale: Maaaring tumukoy ang salita sa mahirap, naghihirap, inaapi, o ibinabang tao. Ipinahahayag ng “api” ang dinaranas na kababaan nang hindi ito nililimitahan sa kakulangan sa salapi; pinananatili sa talababa ang alternatibong “mahirap.”
- source_word: תּוֹשִׁיעַ
  choice: inililigtas mo
  rationale: Ang Hiphil ng ישׁע ay nangangahulugang magligtas o magpalaya mula sa panganib. Malawak at natural sa Tagalog ang “inililigtas.”
- source_word: עֵינֶיךָ
  choice: iyong mga mata
  rationale: Pinananatili ang kongkretong larawang Hebreo sa halip na palitan lamang ng abstraktong “pansin” o “tingin.”
- source_word: רָמִים
  choice: mga palalo
  rationale: 'Sa pagtutunggali nito sa mga api, ang “matataas” ay may negatibong moral na diwa: yaong mga nagmamataas. Natural na ipinahahayag ito ng “mga palalo,” habang inilalagay sa talababa ang mas literal na alternatibo.'
- source_word: תַּשְׁפִּיל
  choice: upang ibaba sila
  rationale: Ang Hiphil ng שׁפל ay “gawing mababa” o “ibaba.” Ang pariralang ito ay nagpapanatili sa metapora ng kataasan at kababaan at maayos na nag-uugnay sa idyomang tungkol sa mga mata.
- source_word: וְ
  choice: ngunit
  rationale: Bagaman karaniwang “at” ang pang-ugnay, malinaw na magkasalungat ang pagliligtas sa mga api at pagbaba sa mga palalo. Likas na ipinahahayag ng “ngunit” ang ugnayang ito.
theological_decisions:
- issue: Moral na pagmamataas o katayuang panlipunan lamang
  choice: Inilalarawan ang pagliligtas ng Diyos sa mga api at ang pagbaba niya sa mga palalo.
  alternative: Maaaring unawain ang taludtod bilang pagtutunggali ng mga dukha at ng mga taong mataas ang katayuan.
  rationale: Maaaring may panlipunan at pangkabuhayang pahiwatig ang Hebreo, ngunit ang pagtutunggali ng עָנִי at רָמִים ay may moral ding bigat. Hindi nililimitahan ng salin ang “api” sa kahirapang pangkabuhayan, at itinatala ng mga talababa ang mga leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang konkretong larawang “iyong mga mata” at ang patulang pagtutunggali ng mga api at mga palalo. Ginamit ang “mga taong api” sa halip na “bayang api” upang maiwasan ang di-sinasadyang pagpapakahulugang isang bansang pampolitika lamang.
