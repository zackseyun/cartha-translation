  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: tl
  text: Sa taong dalisay, ipinakikita mong dalisay ka; ngunit sa taong liko, ipinakikita mong salungat ka sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinakikita mong baluktot ka” o “ipinakikita mong tuso ka.” Bihira at mahirap tiyakin ang pandiwang Hebreo; inilalarawan nito ang katapat na pakikitungo ng Diyos sa taong liko.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: dalisay
  rationale: Tumutukoy ito sa kadalisayan o kalinisan; natural at marangal ang “dalisay” at napapanatili nito ang ugnayan sa kasunod na pandiwang mula sa kaparehong ugat.
- source_word: תִּתָּבָר
  choice: ipinakikita mong dalisay ka
  rationale: Inihahatid nito ang malamang na pansariling diwa ng anyong pandiwa at ang pag-uulit ng ugat na נָבָר sa patulang paralelismo.
- source_word: עִקֵּשׁ
  choice: liko
  rationale: Ang pang-uri ay tumutukoy sa taong baluktot o mapanlinlang sa asal. Ang “liko” ay maikli, matalinghaga, at angkop na kasalungat ng “dalisay.”
- source_word: תִּתַּפָּל
  choice: ipinakikita mong salungat ka
  rationale: Bihira at mahirap tiyakin ang pandiwa. Ang “salungat” ay nagpapanatili sa ideya ng katapat at mapanlabang tugon sa taong liko nang tuwirang magbintang ng moral na kabuktutan sa Diyos; inilalahad sa talababa ang mas literal na posibilidad.
- source_word: עִם
  choice: sa
  rationale: Sa Filipino, natural na ipinahahayag ng “sa” ang pakikitungo o pagtugon kaugnay ng taong inilalarawan, bagaman literal na maaari itong sabihing “kasama ng.”
theological_decisions:
- issue: Kung paano isasalin ang tugon ng Diyos sa taong liko nang alisin ang tensiyon o iparatang sa Diyos ang moral na kabuktutan
  choice: ipinakikita mong salungat ka
  alternative: ipinakikita mong baluktot ka / ipinakikita mong tuso ka
  rationale: Pinananatili ng “salungat” ang katapat na tugon ng Diyos sa taong liko at ang sadyang matinding paralelismo, habang ang talababa ay tapat na nagbubukas sa mas literal na “baluktot.” Hindi pinapawi ang tunay na kalabuan ng bihirang pandiwa.
translation_notes:
  register: Makabagong Filipino na dignified at patula. Ginamit ang maikling “sa dalisay” at “sa liko” upang mapanatili ang siksik na paralelismo ng Hebreo; ang “liko” ay pangngalang gamit para sa taong baluktot ang asal.
