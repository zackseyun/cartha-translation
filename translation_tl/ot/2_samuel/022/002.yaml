  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: tl
  text: 'At sinabi niya: “Ang PANGINOON ang aking malaking bato, aking tanggulan, at tagapagligtas na sumasagip sa akin.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin ng banal na pangalan sa malalaking titik, na malinaw sa karaniwang mambabasang Filipino.
- source_word: סַלְעִי
  choice: aking malaking bato
  rationale: Ipinananatili ang konkretong larawan ng סֶלַע bilang matibay at mataas na batuhan, habang iniiwasang mapagkamalan itong maliit na bato.
- source_word: מְצֻדָתִי
  choice: aking tanggulan
  rationale: Likas at dignified na katumbas ng isang matibay na lugar ng depensa o kuta.
- source_word: מְפַלְטִי לִי
  choice: aking tagapagligtas
  rationale: Ang hulaping unang panauhan at ang לִי ay parehong nagpapatingkad sa personal na kaugnayan; sa natural na Tagalog, sapat itong naihahayag ng “aking,” samantalang ang literal na “para sa akin” ay magiging mabigat at tila inuulit lamang ang diwa.
theological_decisions:
- issue: Paglalahad sa banal na pangalan יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Pinananatili ang malawak na tradisyon ng saling Filipino nang walang pag-angkat ng natatanging paninindigang denominasyonal; ipinahihiwatig ng malalaking titik na banal na pangalan ang nasa Hebreo.
- issue: Pagpapanatili sa diin ng לִי
  choice: Isinama sa natural na personal na pariralang “aking tagapagligtas”
  alternative: “tagapagligtas para sa akin”
  rationale: Ang לִי ay maaaring idiin bilang “para sa akin,” ngunit kasunod ng מְפַלְטִי na may hulaping “aking,” mas natural sa Filipino na hindi doblehin ang pagmamay-ari/personal na kaugnayan. Hindi nito binabago ang teolohikal na diwa ng personal na pagliligtas.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makatang tatluhang paglalarawan at ang konkretong imahen ng batuhan, tanggulan, at tagapagligtas.
