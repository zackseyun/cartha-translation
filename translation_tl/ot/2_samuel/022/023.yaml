  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: tl
  text: 'Sapagkat ang lahat ng kanyang mga hatol ay nasa harapan ko,

    at hindi ako lumihis sa kanyang mga tuntunin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at hindi ako lumihis sa mga iyon.”
    reason: Pinananatili ang posibilidad na ang panghalip ay kolektibong tumutukoy sa lahat ng naunang nabanggit na mga hatol at tuntunin.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapahayag ang dahilan ng naunang pahayag at pinananatili ang tahasang ugnayang sanhi sa daloy ng tula.
- source_word: כָל מִשְׁפָּטָיו
  choice: ang lahat ng kanyang mga hatol
  rationale: Pinananatili ang kabuuang saklaw ng כָל at ang legal na diwa ng מִשְׁפָּט, habang malinaw na itinatangi ito sa kasunod na חֻקּוֹת.
- source_word: לְנֶגְדִּי
  choice: nasa harapan ko
  rationale: Pinananatili ang metapora ng mga hatol na laging nakikita o nasa kamalayan ng nagsasalita.
- source_word: וְחֻקֹּתָיו
  choice: at ... kanyang mga tuntunin
  rationale: Ang 'mga tuntunin' ay natural sa modernong Filipino at naghahatid ng diwa ng mga itinakdang kautusan, nang hindi ipinapantay sa 'mga hatol.'
- source_word: לֹא אָסוּר
  choice: hindi ako lumihis
  rationale: Ang סוּר ay nangangahulugang lumihis o tumalikod; ang 'lumihis' ay natural at angkop sa moral na konteksto.
- source_word: מִמֶּנָּה
  choice: sa kanyang mga tuntunin
  rationale: Ginawang tahasan ang malamang na tinutukoy ng pambabaeng pang-isahang panghalip upang maging malinaw sa Filipino, habang itinatala sa talababa ang literal at maaaring kolektibong pagbasa.
theological_decisions:
- issue: Pagpapanatili ng pagkakaiba ng mga terminong legal sa tipan
  choice: Isinalin nang magkahiwalay bilang 'mga hatol' at 'mga tuntunin.'
  alternative: Gawing pareho ang mga ito bilang 'mga batas' o 'mga utos.'
  rationale: Dalawang magkaibang salitang Hebreo ang ginamit nang magkatulad sa tula; pinananatili ng salin ang kanilang pagkakaiba nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Tinutukoy ng מִמֶּנָּה
  choice: Inugnay sa 'kanyang mga tuntunin' sa pangunahing teksto.
  alternative: Isalin nang mas malabo bilang 'sa mga iyon,' na maaaring tumukoy nang sama-sama sa lahat ng naunang batas.
  rationale: Ang anyong pambabaeng pang-isahan ay hindi tuwirang tumutugma sa naunang panlalaking maramihan, kaya may tunay na kalabuan. Pinili ang pinakamalinaw na natural na pagbasa sa teksto at pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang paralelismong patula at ang metaporang 'nasa harapan ko.'
