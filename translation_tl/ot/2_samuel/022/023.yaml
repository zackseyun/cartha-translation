  source_fidelity: 'Tapat ang salin sa Hebreo: ang כִּי ay naipapahayag bilang sanhi sa “Sapagkat,” ang כָל מִשְׁפָּטָיו bilang “ang lahat ng kanyang mga hatol,” at ang לְנֶגְדִּי bilang “nasa harapan ko.” Ang “hindi ako lumihis” ay wastong katumbas ng לֹא אָסוּר. Ang tahasang “sa kanyang mga tuntunin” ay isang natural at kontekstuwal na paglilinaw ng hindi pangkaraniwang pambabaeng pang-isahang מִמֶּנָּה, habang pinananatili ng talababa ang alternatibong saklaw.'
