translation:
  language: tl
  text: At ginantimpalaan ako ni Yahweh ayon sa aking katuwiran, ayon sa aking kalinisan sa harap ng kanyang mga mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ginantihan
  rationale: Sa kontekstong ito, ang anyo ng שוב ay nagpapahayag ng pagganti o pagbibigay ng katumbas ayon sa ginawa. Ang “ginantihan” ay likas sa Tagalog at hindi nililimitahan ang diwa sa positibong “ginantimpalaan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לִי
  choice: ako
  rationale: Ito ang di-tuwirang layon ng pandiwa; sa likas na Tagalog, ang “ginantihan ako” ang malinaw na katumbas.
- source_word: כְּצִדְקָתִי
  choice: ayon sa aking katuwiran
  rationale: Ang צְדָקָה ay tumutukoy sa pagiging matuwid o tama. Pinananatili ng “ayon sa” ang puwersa ng כְּ at hindi pinakikitid ang diwa sa legal na katarungan lamang.
- source_word: כְּבֹרִי
  choice: ayon sa aking kalinisan
  rationale: Ang בֹּר ay nangangahulugang kalinisan o kadalisayan. Hindi idinagdag ang “mga kamay” sapagkat wala ito sa Hebreong teksto ng talatang ito.
- source_word: לְנֶגֶד עֵינָיו
  choice: sa harap ng kanyang mga mata
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo, habang ipinaliliwanag sa talababa ang idyomatikong kahulugang “sa kanyang paningin.”
theological_decisions:
- issue: Ang pahayag ni David tungkol sa kanyang katuwiran at kalinisan
  choice: Pinanatili ang tuwirang pahayag sa unang panauhan nang walang pagpapalambot o doktrinal na paliwanag.
  alternative: Ipaliwanag ito bilang relatibong katapatan sa tipan o baguhin ang pananalita upang maiwasan ang tensiyon sa mga kasalanan ni David.
  rationale: Malinaw na iniuugnay ng Hebreo ang pagganti ni Yahweh sa katuwiran at kalinisan ng nagsasalita. Dapat panatilihin ng salin ang tunay na teolohikal na tensiyon at huwag magpasok sa pangunahing teksto ng isang partikular na interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “katuwiran” at “kalinisan” upang mapanatili ang pormal at teolohikal na bigat ng Hebreo; pinanatili rin ang konkretong larawan ng “mga mata.”
