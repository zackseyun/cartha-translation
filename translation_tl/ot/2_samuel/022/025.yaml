  source_fidelity: Ang “At,” “Yahweh,” “ayon sa aking katuwiran,” at “ayon sa aking kalinisan” ay tapat sa Hebreo. Gayunman, ang “ginantihan ako ni Yahweh” ay maaaring mangahulugang gumanti o maghiganti si Yahweh laban sa nagsasalita, sa halip na tumbasan o gantimpalaan siya ayon sa kanyang katuwiran. Dahil positibo ang paghahalintulad sa katuwiran at kalinisan sa kontekstong ito, kailangan ng mas malinaw na pandiwa.
  naturalness: Marangal at malinaw ang kabuuang pangungusap. Mas likas at hindi malabo ang “ginantimpalaan ako” sa kontekstong ito. Ang “sa harap ng kanyang mga mata” ay katanggap-tanggap na literal na larawan; ang talababa ay nagbibigay ng likas na idyomatikong alternatibo.
  terminology: Ang “katuwiran” ay angkop para sa צְדָקָה, at ang “kalinisan” ay tapat sa בֹּרִי nang hindi nagdaragdag ng “mga kamay.” Wastong pinanatili ang pangalang “Yahweh.”
