  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: tl
  text: Pinatalikod mo ang aking mga kaaway sa harap ko[a]; nilipol ko ang mga napopoot sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ibinigay mo sa akin ang batok ng aking mga kaaway.” Idyoma ito para sa pagpapatalikod at pagpapaurong sa mga kaaway upang tumakas sa harap ng nagwagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: ang aking mga kaaway
  rationale: Ang אֹיֵב na may hulaping unang panauhang isahan ay karaniwang nangangahulugang “aking mga kaaway.” Ito ang pinakatuwiran at likas na katumbas sa modernong Filipino.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: Pinatalikod mo sa akin
  rationale: Literal itong tumutukoy sa pagbibigay ng “batok” o “likod ng leeg,” ngunit isa itong idyoma para sa pagpapatalikod at pagpapatakas sa mga kaaway. Ang “Pinatalikod mo sa akin” ay natural sa Filipino at pinananatili ang larawan ng mga kaaway na tumatakas mula sa nagwagi.
- source_word: מְשַׂנְאַי
  choice: ang mga napopoot sa akin
  rationale: Ang participle mula sa שׂנא na may hulaping unang panauhang isahan ay tumutukoy sa mga taong napopoot sa nagsasalita. Ang “mga napopoot sa akin” ay dignified, malinaw, at nagpapanatili sa patuloy na paglalarawan sa kanila.
- source_word: וָאַצְמִיתֵם
  choice: nilipol ko
  rationale: Ang Hiphil ng צמת ay nagpapahayag ng pagwasak o ganap na pagkitil. Ang “nilipol ko” ay malakas ngunit hindi kolokyal, at angkop sa makatang salaysay ng tagumpay.
