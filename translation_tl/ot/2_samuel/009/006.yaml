base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: tl
  text: Dumating kay David si Mefiboset na anak ni Jonatan at apo ni Saul. Nagpatirapa siya at yumukod. Sinabi ni David, “Mefiboset!” Sumagot siya, “Narito ang lingkod mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: Nagpatirapa siya
  rationale: Likas na salin sa Filipino para sa literal na ‘bumagsak sa kanyang mukha,’ na nagpapahayag ng lubos na pagpapakumbaba sa harap ng hari.
- source_word: וַיִּשְׁתָּחוּ
  choice: at yumukod
  rationale: Pinananatiling hiwalay sa naunang kilos ang ikalawang pandiwa, na tumutukoy sa pagyukod bilang paggalang.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Narito ang lingkod mo
  rationale: Natural at tuwirang tugon sa Filipino na pinananatili ang pormula ng pagpapakilala at pagpapasakop sa hari.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: anak ni Jonatan at apo ni Saul
  rationale: Nililinaw sa karaniwang Filipino ang ugnayang salinlahi; ang ikalawang ‘anak’ sa Hebreo ay ginagamit sa mas malawak na kahulugang inapo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang pangalang “Mefiboset,” ang karaniwang anyong Filipino. Ang “lingkod mo” ay nagpapanatili ng magalang at mapagpakumbabang tono nang hindi nagdaragdag ng titulong wala sa teksto.
