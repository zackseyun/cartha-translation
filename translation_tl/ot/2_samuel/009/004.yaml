  yaml_path: translation/ot/2_samuel/009/004.yaml
  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: tl
  text: Sinabi ng hari sa kanya, “Nasaan siya?” Sinabi ni Ziba sa hari, “Naroon siya sa bahay ni Makir na anak ni Amiel, sa Lo-debar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Naroon siya
  rationale: Sa kontekstong sagot sa tanong na “Nasaan siya?”, likas sa modernong Tagalog ang “Naroon siya” at naipapahayag nito ang pantawag-pansing at panuturong diwa ng הִנֵּה nang hindi gumagamit ng lipas na “Narito.”
- source_word: בֵּית מָכִיר
  choice: sa bahay ni Makir
  rationale: Tuwirang inilalarawan ang kinaroroonan niya sa sambahayan o tahanan ni Makir; pinananatili ang payak na pahayag ng Hebreo.
- source_word: בְּלוֹ דְבָר
  choice: sa Lo-debar
  rationale: Isinasalin bilang pangalang pantangi ng lugar at tina-transliterate sa paraang madaling basahin sa Filipino.
