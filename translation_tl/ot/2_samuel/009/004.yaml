  register: Modernong Filipino Tagalog na payak, dignified, at natural. Pinanatili ang pag-uulit ng “Sinabi” na kaayon ng payak na estilo ng salaysay sa Hebreo; ginamit ang mga anyong Filipino na Makir at Amiel para sa mga pangalan.
