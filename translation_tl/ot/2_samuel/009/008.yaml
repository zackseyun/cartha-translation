base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: tl
  text: At yumukod siya at sinabi, “Ano ba ang iyong lingkod, at pinag-ukulan mo ng pansin ang isang patay na aso na gaya ko?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bumaling ka sa isang patay na aso na gaya ko.” Ang “patay na aso” ay matinding pahayag ng pagpapakumbaba at kawalang-halaga sa sarili.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod siya
  rationale: Ipinahahayag ang pisikal na kilos ng pagyukod bilang paggalang at pagpapakumbaba, nang hindi ito nililimitahan sa pagsamba.
- source_word: מֶה עַבְדֶּךָ
  choice: Ano ba ang iyong lingkod
  rationale: Pinananatili ang di-karaniwang tanong na “ano,” na nagpapahayag ng matinding pagpapakumbaba; ang “lingkod” ay angkop sa magalang na pananalita sa hari.
- source_word: כִּי
  choice: at
  rationale: Sa Filipino, likas na nag-uugnay ang “at” sa retorikal na tanong at sa ipinakitang pagpansin, bagaman ang diwa ay maaari ring ilahad bilang “upang” o “kaya.”
- source_word: פָנִיתָ אֶל
  choice: pinag-ukulan mo ng pansin
  rationale: Natural nitong inihahatid ang kontekstuwal na diwa ng Hebreong “bumaling sa,” samakatuwid ay mapagkaloob na pagpansin ng hari.
- source_word: הַכֶּלֶב הַמֵּת
  choice: isang patay na aso
  rationale: Pinananatili ang matinding larawan ng paghamak sa sarili; natural sa Filipino ang di-tiyak na “isang” sa ganitong paghahambing.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: na gaya ko
  rationale: Malinaw at tuwirang iniuugnay ang larawang “patay na aso” sa nagsasalita.
theological_decisions: []
