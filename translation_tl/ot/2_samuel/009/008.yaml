  terminology: Ang “lingkod” ay angkop na magalang na pantukoy sa sarili sa pakikipag-usap sa hari. Ang “yumukod” ay hindi labis na nagpapakahulugan sa kilos bilang pagsamba, at ang “patay na aso” ay pinananatili ang matinding idyoma ng teksto.
