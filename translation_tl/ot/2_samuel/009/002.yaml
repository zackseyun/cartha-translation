revisions:
- from: May isang lingkod ang sambahayan ni Saul na ang pangalan ay Ziba. Ipinatawag nila siya kay David. Sinabi sa kanya ng hari, “Ikaw ba si Ziba?” Sumagot siya, “Ang inyong lingkod.”[a]
  to: May isang lingkod ang sambahayan ni Saul; Ziba ang pangalan niya. Ipinatawag nila siya kay David. Sinabi sa kanya ng hari, “Ikaw ba si Ziba?” Sumagot siya, “Ang inyong lingkod.”[a]
  rationale: Nilinaw ang pagpapakilala kay Ziba sa pamamagitan ng mas likas na hiwalay na pangungusap. Pinanatili ang lahat ng impormasyong nasa Hebreo, ang impersonal na maramihang pagpapatawag, ang marangal na register, at ang elipsis sa tugon. Bahagyang inayos din ang paliwanag sa talababa tungo sa mas karaniwang teknikal na anyong “eliptiko.”
