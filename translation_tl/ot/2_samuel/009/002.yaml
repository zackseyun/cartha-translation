base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: tl
  text: May isang lingkod ang sambahayan ni Saul; Ziba ang pangalan niya. Ipinatawag nila siya kay David. Sinabi sa kanya ng hari, “Ikaw ba si Ziba?” Sumagot siya, “Ang inyong lingkod.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas tahasan, “Ako po ang inyong lingkod.” Eliptiko ang sagot sa Hebreo: “Ang inyong lingkod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: May isang ... ang sambahayan ni Saul
  rationale: Ang pariralang may לְ ay nagpapahayag dito ng pag-iral o pag-aari. Likas sa modernong Tagalog ang ayos na “May isang lingkod ang sambahayan ni Saul,” nang hindi nagdaragdag ng tahasang temporal na panandang wala sa Hebreo.
- source_word: עֶבֶד
  choice: lingkod
  rationale: Maaaring mangahulugang alipin o lingkod ang עֶבֶד, ngunit sa kontekstong ito ay tumutukoy ito sa isang tauhan ng sambahayan ni Saul. Pinananatili ng “lingkod” ang mababang katayuan nang hindi labis na tinutukoy ang eksaktong legal na kalagayan.
- source_word: וּשְׁמוֹ צִיבָא
  choice: na ang pangalan ay Ziba
  rationale: Malinaw at dignified na Tagalog ito para sa Hebreong pormula ng pagpapakilala sa pangalan.
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  choice: Ipinatawag nila siya kay David
  rationale: Sa kontekstong ito, ang קרא na may patutunguhan ay nangangahulugang ipatawag ang isang tao sa presensiya ni David. Mas natural ang “ipinatawag” kaysa literal na “tinawag ... kay David.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na titulong tumutukoy kay David; tuwiran itong isinalin.
- source_word: הַאַתָּה צִיבָא
  choice: Ikaw ba si Ziba?
  rationale: Natural na anyong patanong sa Tagalog na tapat sa Hebreong interrogative.
- source_word: עַבְדֶּךָ
  choice: Ang inyong lingkod
  rationale: Pinananatili ang eliptikal at magalang na sagot na literal na “iyong lingkod.” Ginamit ang “inyong” bilang magalang na pakikipag-usap sa hari, hindi bilang maramihan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “sambahayan” para sa dinastiko at pangbahay na saklaw ng בֵּית, at “inyong” bilang magalang na anyo sa hari. Inilipat ang talababa sa eliptikal na sagot, na siyang tunay na nangangailangan ng paliwanag.
