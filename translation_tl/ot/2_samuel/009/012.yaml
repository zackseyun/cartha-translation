translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang karaniwang anyong Tagalog ng mga pangalang Mefiboset at Siba, habang pinanatili ang Mica bilang transliterasyon ng pangalang Hebreo. Iniwasan ang mekanikal na pagsasalin ng panimulang וְ dahil natural ang tuloy-tuloy na salaysay kahit walang “At” sa ikalawang pangungusap.
