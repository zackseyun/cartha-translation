base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: tl
  text: May batang anak na lalaki si Mefiboset, at Mica ang pangalan niya. Ang buong sambahayan ni Siba[a] ay mga lingkod na naglilingkod kay Mefiboset[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ang lahat ng naninirahan sa bahay ni Siba.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “mga alipin,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְפִיבֹשֶׁת
  choice: May ... si Mefiboset
  rationale: Ang Hebreong konstruksiyong may לְ ay nagpapahayag ng pag-aari o pagkakaroon. Ang “May ... si Mefiboset” ang natural na katumbas nito sa modernong Tagalog.
- source_word: בֵּן קָטָן
  choice: batang anak na lalaki
  rationale: Ang בֵּן ay “anak na lalaki,” at ang קָטָן ay tumutukoy rito sa murang edad o pagiging bata, hindi lamang sa maliit na pangangatawan.
- source_word: וּשְׁמוֹ מִיכָא
  choice: at Mica ang pangalan nito
  rationale: Pinananatili nito ang hiwalay na sugnay ng Hebreo at malinaw na ang tinutukoy ay ang anak. Ang “Mica” ay tuwirang transliterasyon ng מִיכָא.
- source_word: וְכֹל מוֹשַׁב בֵּית צִיבָא
  choice: Ang buong sambahayan ni Siba
  rationale: Ang מוֹשַׁב בֵּית ay kolektibong tumutukoy sa mga nakatira sa bahay o sambahayan. Natural at maikli sa Tagalog ang “buong sambahayan,” habang inilalahad sa talababa ang mas literal na posibilidad.
- source_word: עֲבָדִים
  choice: mga lingkod
  rationale: Maaaring mangahulugan ang עֲבָדִים ng mga lingkod o mga alipin ayon sa konteksto. Dito, nakatuon ang salaysay sa paglilingkod ng sambahayan ni Siba kay Mefiboset, kaya “mga lingkod” ang angkop sa pangunahing teksto nang hindi ikinukubli ang alternatibo.
- source_word: לִמְפִיבֹשֶׁת
  choice: ni Mefiboset
  rationale: Pagkatapos ng “mga lingkod,” natural sa Tagalog ang “ni Mefiboset” upang ipahayag kung kanino sila naglilingkod, nang hindi labis na binibigyang-diin ang pagmamay-ari.
