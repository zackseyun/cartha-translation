  to: Ikaw, ang iyong mga anak, at ang iyong mga alipin ay magbubungkal ng lupain para sa kanya. Dadalhin mo ang ani, at ito ay magiging tinapay[a] para sa anak ng iyong panginoon, at kakain siya nito. Ngunit si Mefiboset, na anak ng iyong panginoon, ay laging kakain ng tinapay sa aking hapag. Si Ziba ay may labinlimang anak na lalaki at dalawampung alipin.
