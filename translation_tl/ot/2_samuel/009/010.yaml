  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: tl
  text: Ikaw, ang iyong mga anak, at ang iyong mga alipin ay magbubungkal ng lupain para sa kanya. Dadalhin mo ang ani, at ito ay magiging tinapay[a] para sa anak ng iyong panginoon, at kakain siya nito. Ngunit si Mefiboset, na anak ng iyong panginoon, ay laging kakain ng tinapay sa aking hapag. Si Ziba ay may labinlimang anak na lalaki at dalawampung alipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay literal na “tinapay,” ngunit maaari rin itong tumukoy sa pagkain o panustos sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: magbubungkal ng lupain para sa kanya
  rationale: Sa konteksto, ang עבד na may אֲדָמָה ay tumutukoy sa gawaing pagsasaka para sa kapakinabangan ni Mefiboset. Natural sa Filipino ang “magbubungkal ng lupain” at malinaw ang benepisyaryo.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: ikaw, ang iyong mga anak, at ang iyong mga alipin
  rationale: Ang עֲבָדִים dito ay mga taong kabilang sa nakataling lakas-paggawa ng sambahayan, kaya mas tiyak ang “mga alipin” kaysa sa pangkalahatang “mga lingkod.”
- source_word: וְהֵבֵאתָ
  choice: ipapasok mo ang ani
  rationale: Literal na “dadalahin/ipapasok mo”; ipinahihiwatig ng konteksto ng pagsasaka na ang dinadala ay ang ani. Nilinaw ito nang hindi labis na nagpapaliwanag.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: upang magkaroon ng pagkain ang anak ng iyong panginoon at makakain siya
  rationale: Maaaring literal na “tinapay” ang לֶחֶם ngunit dito ay maaari ring mangahulugang pagkain o panustos. Ginamit ang natural na “pagkain,” habang pinanatili sa talababa ang leksikal na saklaw.
- source_word: יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: ay palaging kakain sa aking hapag
  rationale: Ang pariralang Hebreo ay isang idyoma ng patuloy na pagtustos at pakikisalo. Ang “palaging kakain sa aking hapag” ay natural, marangal, at hindi nagdaragdag ng interpretasyong teolohikal.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: Si Ziba ay may labinlimang anak na lalaki at dalawampung alipin
  rationale: Walang tahasang pandiwa ang sugnay sa Hebreo; natural na idinagdag ang “ay may” sa Filipino bilang impormasyong pangkaligiran. Ang בָּנִים ay isinaling “anak na lalaki,” at ang עֲבָדִים ay “alipin.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “hapag” para sa dignidad ng tagpong maharlika, at “alipin” upang maipakita ang nakataling katayuang panlipunan ng עֲבָדִים. Lumilitaw sa pangunahing teksto ang marker na [a].
