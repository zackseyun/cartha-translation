  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: tl
  text: Ipinakuha siya ni Haring David[a] mula sa bahay ni Makir na anak ni Amiel sa Lo-debar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Nagsugo si Haring David at kinuha siya.” Maaari ring isalin: “Nagsugo si Haring David upang kunin siya.”'
    reason: Pinagsasama ng “ipinakuha” ang dalawang magkasunod na pandiwa sa Hebreo sa likas na Tagalog; ibinibigay ng talababa ang mas literal na ayos at isang idiomatikong alternatibo.
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: ipinakuha siya
  rationale: Ang magkasunod na pandiwang “nagsugo” at “kinuha siya” ay likas na ipinahahayag sa modernong Tagalog bilang “ipinakuha siya.” Ipinakikita nito na nagpadala ang hari ng mga tao upang kunin siya, nang hindi ipinahihiwatig na si David mismo ang pumunta.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Ito ang natural at marangal na ayos sa Tagalog para sa titulong may kasunod na pangalang pantangi.
- source_word: מִבֵּית
  choice: mula sa bahay ni
  rationale: Pinananatili ng “bahay” ang maaaring pagtukoy sa tahanan o sambahayan, bagaman sa konteksto ay malamang na lugar na tinitirhan.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Makir na anak ni Amiel
  rationale: Isinalin ang ugnayang בֶּן nang tahasan bilang “anak ni” at ginamit ang mga anyong pangalan na natural sa baybay-Filipino.
- source_word: מִלּוֹ דְבָר
  choice: sa Lo-debar
  rationale: Ang Lo-debar ay pangalang-lugar. Sa Tagalog, natural ang “sa” kasunod ng “bahay ni Makir” upang tukuyin ang kinaroroonan nito, kahit inuulit ng Hebreo ang pang-ukol na מִן (“mula”).
