translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “ipinakuha” upang maiwasan ang asiwa at posibleng maling pahiwatig ng literal na “nagsugo ... at kinuha,” na maaaring magmukhang si David mismo ang kumuha sa lalaki.
