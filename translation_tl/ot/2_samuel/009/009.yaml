  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ng hari si Ziba, na lingkod ni Saul,[a] at sinabi sa kanya, “Ang lahat ng pag-aari ni Saul at ng buong sambahayan niya[b] ay ibinigay ko na sa anak ng panginoon mo.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tauhan ni Saul” o “binata ni Saul.” Dito, malamang na tumutukoy ang salita sa isang lingkod o tagapaglingkod sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “buong sambahayan niya” ay maaaring sumaklaw sa angkan, mga tauhan, at ari-ariang nauugnay sa sambahayan ni Saul.
    reason: lexical_alternative
  - marker: c
    text: Ang “anak ng panginoon mo” ay tumutukoy kay Mefiboset, na apo ni Saul. Sa Hebreo, maaaring gamitin ang “anak” sa mas malawak na diwang “inapo.”
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: lingkod
  rationale: Bagaman maaari itong mangahulugang “binata” o “tagapaglingkod,” sa konteksto ng sambahayan ni Saul ay tumutukoy ito sa tungkulin o katayuan ni Ziba bilang lingkod o tauhan.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: ang lahat ng pag-aari ni Saul
  rationale: Ang Hebreong idyoma na literal na “lahat ng naging kay Saul” ay malinaw na nagsasaad ng pagmamay-ari; natural itong ipinahahayag sa modernong Tagalog bilang “lahat ng pag-aari ni Saul.”
- source_word: וּלְכָל בֵּיתוֹ
  choice: at ng buong sambahayan niya
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay, sambahayan, angkan, o ari-arian. Dito, ang “buong sambahayan” ay nagpapanatili sa lawak ng kahulugan nang hindi nililimitahan ito sa gusali lamang.
- source_word: נָתַתִּי
  choice: ibinigay ko na
  rationale: Nagsasaad ang anyong ganap ng natapos nang pagkakaloob na nananatiling may bisa; likas sa Tagalog ang “ibinigay ko na” para sa aspektong ito.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: sa anak ng panginoon mo
  rationale: Ang אֲדוֹן dito ay isang nakatataas sa kaayusang panlipunan, hindi banal na titulo. Pinananatili ng “anak” ang malawak na gamit ng Hebreo para sa anak o inapo.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Pagkatapos, ipinatawag ... at sinabi
  rationale: Isinusulong ng magkakasunod na pandiwa ang salaysay. Ang “ipinatawag” ay natural sa konteksto ng hari na nagpapaharap ng isang tao, at ang “Pagkatapos” ay malinaw na nag-uugnay sa naunang pangyayari.
theological_decisions:
- issue: Ang kahulugan ng “panginoon” sa לְבֶן אֲדֹנֶיךָ
  choice: Ginamit ang maliit na titik sa “panginoon” bilang katawagang panlipunan para sa nakatataas.
  alternative: “amo” o “maykapal”
  rationale: Si Saul ang tinutukoy na nakatataas ni Ziba sa sambahayan; walang pahiwatig na banal na titulo ang salita rito. Ang “maykapal” ay teolohikal na mali sa konteksto, samantalang ang “amo” ay posible ngunit mas makitid ang dating.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinatawag” sa halip na literal na “tinawag” upang maging natural sa tagpong maharlika. Pinanatili ang “panginoon” bilang panlipunang katawagan, na nilinaw ng maliit na titik at talababa.
