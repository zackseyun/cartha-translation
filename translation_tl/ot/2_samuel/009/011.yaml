base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: tl
  text: Sinabi ni Ziba sa hari, “Anumang iutos ng panginoon kong hari sa kanyang lingkod, gagawin ng inyong lingkod.” At kumakain si Mefiboset sa hapag ko[a], gaya ng isa sa mga anak ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa hapag ko.” May ilang salin na gumagamit ng “sa hapag ng hari” upang pakinisin ang biglang paglipat ng panauhan; gayunman, unang panauhan ang nasa Masoretic Text, na malamang na nagpapahayag ng pananaw ni David.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang panimulang pandiwa sa salaysay para sa tuwirang pananalita.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: ang lahat ng iutos
  rationale: Likas sa Tagalog at pinananatili ang saklaw ng כְּכֹל אֲשֶׁר at ang diwa ng utos ng imperfect na יְצַוֶּה.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Pinananatili ang magalang na katawagan sa hari nang hindi ginagawang denominasyonal ang “panginoon.”
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: kanyang lingkod / inyong lingkod
  rationale: Sa kontekstong ito, magalang na pagtukoy ito ni Ziba sa sarili bilang nasa paglilingkod sa hari; ang “lingkod” ay mas angkop kaysa “alipin.”
- source_word: כֵּן יַעֲשֶׂה
  choice: Gagawin ... ang lahat
  rationale: Isinasalin bilang malinaw na pangako ng pagsunod; ang korrelatibong anyo ng Hebreo ay natural na naipapahayag sa ayos na Tagalog.
- source_word: אֹכֵל
  choice: palaging kumakain
  rationale: Ang Qal participle ay nagpapahiwatig ng nagpapatuloy o nakagawiang kalagayan, hindi lamang ng minsanang pagkain.
- source_word: עַל שֻׁלְחָנִי
  choice: sa hapag ko
  rationale: Tapat sa unang panauhang hulapi ng Masoretic Text; “sa hapag” ang natural na Tagalog para sa pakikisalo.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: gaya ng isa sa mga anak ng hari
  rationale: Pinananatili ang paghahambing at ang katayuang tulad ng isang anak ng hari.
theological_decisions:
- issue: Nagsasalita sa pariralang “sa hapag ko”
  choice: Pinanatili ang unang panauhang “sa hapag ko,” ayon sa Masoretic Text.
  alternative: “sa hapag ng hari,” ayon sa ilang salin at sinaunang bersiyon, upang gawing tuwirang salaysay ng tagapagsalaysay ang huling sugnay.
  rationale: Malinaw na שֻׁלְחָנִי ay “aking hapag/hapag ko.” Bagaman may biglang paglipat ng panauhan pagkatapos ng sinabi ni Ziba, hindi dapat tahimik na iwasto o pakinisin ang tunay na tensiyon sa teksto; ipinaliliwanag ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “inyong lingkod” bilang likas na magalang na pagtukoy sa sarili sa harap ng hari. Pinanatili ang tekstuwal na tensiyon sa “hapag ko” at nilinaw sa talababa.
