  to: Sinabi ni Ziba sa hari, “Anumang iutos ng panginoon kong hari sa kanyang lingkod, gagawin ng inyong lingkod.” At kumakain si Mefiboset sa hapag ko[a], gaya ng isa sa mga anak ng hari.
