base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: tl
  text: Sinabi ng hari, “May natitira pa bang sinuman sa sambahayan ni Saul upang maipakita ko sa kanya ang kabutihang-loob ng Diyos[a]?” Sinabi ni Ziba sa hari, “May anak na lalaki pa si Jonatan na may kapansanan sa dalawang paa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tapat na pag-ibig ng Diyos,” “katapatan ng Diyos sa tipan,” o “kabutihang-loob na maka-Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Sa mas tradisyonal na pananalita, “pilay ang dalawang paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: May natitira pa ba
  rationale: Likas na tanong ito kung mayroon pang nalalabing kabilang sa angkan ni Saul; hindi nito ipinapalagay na wala nang natitira.
- source_word: לְבֵית שָׁאוּל
  choice: sa sambahayan ni Saul
  rationale: Ang ‘sambahayan’ ay tumutukoy rito sa pamilya o angkan ni Saul, hindi lamang sa kaniyang tirahan.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: upang maipakita ko sa kanya
  rationale: Kapag kasama ng חֶסֶד, likas sa Filipino ang ‘magpakita ng kabutihang-loob’; pinananatili rin ng ‘upang’ ang layunin o kusang hangarin ng hari.
- source_word: חֶסֶד אֱלֹהִים
  choice: kabutihang-loob ng Diyos
  rationale: Pinananatili nito ang malawak na diwa ng חֶסֶד bilang mapagbigay at tapat na kabutihan, gayundin ang posibleng ugnayan nito sa Diyos, nang hindi nililimitahan ang parirala sa iisang paliwanag.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: May anak na lalaki pa si Jonatan
  rationale: Natural nitong ipinahahayag sa Filipino na may natitira pang anak na lalaki ni Jonatan.
- source_word: נְכֵה רַגְלָיִם
  choice: may kapansanan sa dalawang paa
  rationale: Tumpak at magalang na modernong pananalita ito para sa pisikal na kapansanang nakaaapekto sa kaniyang dalawang paa; iniiwasan nito ang mapanlait na dating na maaaring taglayin ng ilang tradisyonal na termino.
theological_decisions:
- issue: Saklaw ng חֶסֶד אֱלֹהִים
  choice: kabutihang-loob ng Diyos
  alternative: tapat na pag-ibig ng Diyos; katapatan ng Diyos sa tipan; kabutihang-loob na maka-Diyos
  rationale: Maaaring tukuyin ng parirala ang kabutihang nagmumula sa Diyos, katangiang tulad ng sa Diyos, o katapatang kaugnay ng tipan. Pinananatiling maluwag ng pangunahing salin ang tunay na saklaw ng parirala, habang inilalahad sa talababa ang mahalagang kahulugan ng katapatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sambahayan’ sa diwang pamilya o angkan, at ang ‘may kapansanan’ bilang magalang at kasalukuyang katawagan. Ang ayos ng pangungusap ay natural sa Filipino ngunit nananatiling malapit sa diin at ambiguwidad ng Hebreo.
