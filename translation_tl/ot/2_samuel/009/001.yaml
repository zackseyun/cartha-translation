  naturalness: Natural at marangal ang “Sinabi ni David,” “sambahayan ni Saul,” at “alang-alang kay Jonatan.” Mas malinaw at likas ang “May natitira pa bang sinuman” kaysa “May natitira pa ba,” dahil tahasang tao ang hinahanap ni David.
