  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: tl
  text: Sinabi ni David, “May natitira pa bang sinuman sa sambahayan ni Saul upang magpakita ako sa kanya ng kabutihan[a] alang-alang kay Jonatan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tapat na kabutihan,” “tapat na pag-ibig,” o “katapatan sa tipan.” Ang salitang Hebreo ay madalas tumutukoy sa kabutihang may katapatan at paninindigan, hindi lamang sa damdamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pandiwang pasalaysay ang אמר. Bagaman tanong ang kasunod na pananalita, likas sa Filipino ang “Sinabi ni David.”
- source_word: הֲכִי יֶשׁ עוֹד
  choice: May ... pa ba
  rationale: Natural na tanong sa modernong Filipino na nagpapahayag ng patuloy na pag-iral o pagkakaroon.
- source_word: אֲשֶׁר נוֹתַר
  choice: natitira
  rationale: Ipinahihiwatig ng נותר ang isang nananatili o nakaligtas; malinaw at hindi labis na tiyak ang “natitira.”
- source_word: לְבֵית שָׁאוּל
  choice: sa sambahayan ni Saul
  rationale: Ang בֵּית dito ay tumutukoy sa pamilya o angkan, hindi lamang sa gusali. Saklaw ng “sambahayan” ang kaugnayang pampamilya at pandinastiya.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: upang maipakita ko sa kanya ang tapat na kabutihan
  rationale: Ang paggawa ng חֶסֶד sa isang tao ay idyomang nangangahulugang magpakita ng kabutihang may katapatan. Inilalarawan ng “tapat na kabutihan” ang gawa at ang dimensiyon ng paninindigan nang hindi ito nililimitahan sa damdamin.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: alang-alang kay Jonatan
  rationale: Likas na Filipino para sa motibo o batayan ng pagkilos na ipinahahayag ng בַּעֲבוּר.
theological_decisions:
- issue: Lawak ng kahulugan ng חֶסֶד sa balak ni David para sa sambahayan ni Saul
  choice: tapat na kabutihan
  alternative: kabutihan; tapat na pag-ibig; katapatan sa tipan
  rationale: May kasamang katapatan at paninindigan ang חֶסֶד, lalo na dahil sa ugnayan ni David kay Jonatan. Pinananatili ng salin ang mas mayamang diwa ngunit hindi ipinipilit sa pangunahing teksto ang “tipan” na hindi tahasang binanggit sa talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan” upang ipakita ang pamilyang saklaw ng “bahay ni Saul,” at “alang-alang” bilang natural na katumbas ng motibong nakabatay kay Jonatan.
