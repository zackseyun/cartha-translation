  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: tl
  text: At nanirahan si Mefiboset sa Jerusalem, sapagkat lagi siyang kumakain sa hapag ng hari. At pilay siya sa magkabilang paa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: nanirahan
  rationale: Kapag ginagamit kasama ng pangalan ng isang lungsod, ang pandiwaring ito ay tumutukoy sa paninirahan, hindi lamang sa literal na pag-upo. Ang “nanirahan” ay likas sa makabagong Filipino at angkop sa salaysay.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paninirahan ni Mefiboset sa Jerusalem. Pinananatili ng “sapagkat” ang malinaw na ugnayang sanhi nang hindi nagiging masyadong kolokyal.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: hapag ng hari
  rationale: Natural itong katumbas sa Filipino ng Hebreong construct phrase at pinananatili ang larawan ng pagtanggap ng pagkain at pakikisalo sa hari.
- source_word: תָּמִיד ... אֹכֵל
  choice: lagi siyang kumakain
  rationale: Ang pang-abay at participle ay nagsasaad ng palagian o nakaugaliang kilos. Ang anyong ito ay malinaw at natural sa Filipino.
- source_word: פִסֵּחַ
  choice: pilay
  rationale: Direkta at karaniwang katumbas ito ng salitang Hebreo para sa kapansanan sa paglakad, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: שְׁתֵּי רַגְלָיו
  choice: sa magkabilang paa
  rationale: Tumpak nitong ipinahahayag na parehong paa ang tinutukoy at mas natural ito sa Filipino kaysa sa literal na “sa dalawa niyang paa.”
- source_word: וְהוּא
  choice: At pilay siya
  rationale: Pinananatili ng “At” ang pandugtong na waw at ang huling naglalarawang pahayag ng talata.
