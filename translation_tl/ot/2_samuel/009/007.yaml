base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: tl
  text: Sinabi sa kanya ni David, “Huwag kang matakot, sapagkat tiyak na magpapakita ako sa iyo ng kabutihang-loob[a] alang-alang sa iyong amang si Jonatan. Ibabalik ko sa iyo ang lahat ng lupain ng iyong ninunong si Saul[b], at palagi kang kakain sa aking hapag[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kabutihang-loob” ay salin ng Hebreong hesed, na maaari ring mangahulugang “matatag na pag-ibig,” “tapat na pag-ibig,” o “katapatan sa tipan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Saul na iyong ama.” Maaaring tumukoy ang “ama” sa isang ninuno; si Saul ay lolo ni Mefiboset.
    reason: lexical_alternative
  - marker: c
    text: Ang “kakain sa aking hapag” ay tumutukoy sa patuloy na pagtustos at pribilehiyong makisalo sa hari.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Likas at tuwirang makabagong Tagalog para sa negatibong pautos at sa pagpapalakas-loob ni David.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: sapagkat tiyak na magpapakita ako
  rationale: Ipinahahayag ng infinitive absolute kasama ng finite verb ang matinding katiyakan; ipinapanatili ito ng “tiyak na” nang hindi nagiging asiwa ang Tagalog.
- source_word: חֶסֶד
  choice: tapat na kabutihan
  rationale: Pinagsasama nito ang kongkretong kagandahang-loob at ang katapatang nakaugat sa ugnayan kay Jonatan, nang hindi ipinipilit ang isang makitid na teknikal na kahulugan.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: alang-alang sa iyong amang si Jonatan
  rationale: Ang “alang-alang sa” ay natural na naghahayag ng dahilan at pansariling ugnayang nag-udyok sa pagkilos ni David.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Ibabalik ko sa iyo
  rationale: Malinaw na ipinahahayag ng Tagalog ang pagpapanumbalik ng ari-arian sa pinagkalooban.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: ang lahat ng lupain ... ni Saul
  rationale: Maaaring kolektibo ang singular na שָׂדֶה; mas angkop ang “lupain” sa kabuuang ari-arian kaysa sa makitid na “bukid.”
- source_word: שָׁאוּל אָבִיךָ
  choice: iyong ninunong si Saul
  rationale: Maaaring tumukoy ang אָב sa isang ninuno; si Saul ay lolo ni Mefiboset. Pinananatili ng “ninuno” ang lawak ng terminong Hebreo at iniiwasan ang maling pagkaunawang siya ang agarang ama.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: palagi kang kakain sa aking hapag
  rationale: Natural na Tagalog ito para sa patuloy na pakikisalo at pagtustos; hindi kailangang ulitin ang literal na “tinapay” upang maipahayag ang idyoma.
theological_decisions:
- issue: Saklaw ng חֶסֶד
  choice: tapat na kabutihan
  alternative: kabutihan; matatag na pag-ibig; tapat na pag-ibig; katapatan sa tipan
  rationale: Ang gawa ni David ay kongkretong kabutihang bunga ng katapatan niya sa kaugnayan kay Jonatan. Pinananatili ng salin ang dalawang aspekto nang hindi ginagawang lantad na teknikal ang terminong “tipan” sa pangunahing teksto.
- issue: Relasyon ni Saul kay Mefiboset sa אָבִיךָ
  choice: ninuno
  alternative: ama; lolo
  rationale: Literal na “ama” ang Hebreo ngunit malawak ang semantikong saklaw nito. Ang “ninuno” ay tumpak sa konteksto at hindi labis na nililimitahan ang salita, samantalang ipinaliliwanag ng talababa na si Saul ang lolo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hapag” bilang dignified ngunit karaniwang nauunawaang salita; iniwasan ang sobrang literal na pariralang maaaring magdulot ng kalituhan, habang pinanatili sa mga talababa ang mahahalagang Hebreong pahiwatig.
