  source_fidelity: 'Ang salin ay tapat sa pangunahing daloy at mga detalye ng Hebreo: ang malaking bato sa Gibeon, pagdating ni Amasa, kasuotan ni Joab, sinturon, tabak, baywang, kaluban, at pagkahulog. Gayunman, ang “Nang humakbang siya” ay mas makitid kaysa sa וְהוּא יָצָא (“at/nang siya ay lumabas”), na hindi tahasang nagsasabing isang hakbang lamang ang ginawa niya.'
  naturalness: Makabago at natural ang pangkalahatang Tagalog. Nililinaw ng rebisyon ang pagkakaugnay ng sinturon, tabak, at kaluban at iniiwasan ang bahagyang malabong “tabak na nakakabit ... at nasa kaluban nito.”
  terminology: Ang “damit-pandigma,” “sinturon,” “tabak,” “baywang,” at “kaluban” ay angkop sa marangal ngunit modernong rehistro. Ang “damit-pandigma” ay suportado ng malamang na kahulugan ng מַד sa kontekstong ito; pinananatili ng talababa ang mga alternatibo.
