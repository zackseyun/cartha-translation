revisions:
- from: Nang nasa tabi na sila ng malaking bato sa Gibeon, dumating si Amasa sa harap nila.[a] Nakasuot noon si Joab ng damit-pandigma,[b] at sa ibabaw nito ay may sinturong kinasasabitan ng tabak na nakakabit sa kanyang baywang at nasa kaluban nito. Nang humakbang siya, nahulog iyon.[c]
  to: Nang nasa tabi sila ng malaking bato sa Gibeon, dumating si Amasa sa harap nila.[a] Nakasuot noon si Joab ng damit-pandigma,[b] at sa ibabaw nito ay may sinturon na may tabak na nakatali sa kanyang baywang, na nasa kaluban nito. Nang siya'y lumabas, nahulog iyon.[c]
  rationale: Inalis ang “na” sa pambungad dahil wala itong katapat na aspektuwal na diin sa Hebreo. Pinalitan ang “humakbang” ng “lumabas” upang huwag paliitin ang kahulugan ng יָצָא. Inayos ang paglalarawan ng sinturon, tabak, at kaluban para sa mas malinaw na natural na Tagalog nang hindi nagdaragdag ng detalye. Napanatili ang maingat na kalabuan ng “iyon,” kasama ang talababa tungkol sa malamang na tinutukoy nito.
