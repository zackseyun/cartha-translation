base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: tl
  text: Nang nasa tabi sila ng malaking bato sa Gibeon, dumating si Amasa sa harap nila.[a] Nakasuot noon si Joab ng damit-pandigma,[b] at sa ibabaw nito ay may sinturon na may tabak na nakatali sa kanyang baywang, na nasa kaluban nito. Nang siya'y lumabas, nahulog iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “dumating si Amasa upang salubungin sila.” Literal sa Hebreo: “dumating sa harap nila.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanyang balabal” o “damit na suot niya.” Sa kontekstong ito, malamang na kasuotang pandigma ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Malamang na ang tabak ang tinutukoy ng “iyon,” gaya ng ipinahihiwatig ng pambabaeng anyo ng pandiwa sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה אֲשֶׁר בְּגִבְעוֹן
  choice: Nang nasa tabi na sila ng malaking bato sa Gibeon
  rationale: Ang עִם sa paglalarawan ng lokasyon ay maaaring mangahulugang nasa tabi o malapit sa isang bagay. Natural sa Tagalog ang “nasa tabi,” at malinaw nitong pinananatili ang tagpuan.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: dumating si Amasa sa harap nila
  rationale: Pinananatili ng “sa harap nila” ang literal at malawak na diwa ng לִפְנֵיהֶם, sa halip na ipagpalagay na tiyak na sumalubong siya sa kanila.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: Nakasuot noon si Joab ng damit-pandigma
  rationale: Sa kontekstong ito, ang מַד ay angkop na tumukoy sa natatanging kasuotang pandigma o opisyal. Nililinaw ng saling ito ang malamang na diwa nang hindi nagdaragdag ng tiyak na anyo ng kasuotan.
- source_word: וְעָלָיו חֲגוֹר חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: at sa ibabaw nito ay may sinturong kinasasabitan ng tabak na nakakabit sa kanyang baywang at nasa kaluban nito
  rationale: Inilalarawan nito ang sinturon, tabak, baywang, at kaluban ayon sa pagkakasunod ng Hebreo, habang gumagamit ng likas na pananalita sa Tagalog.
- source_word: וְהוּא יָצָא
  choice: Nang humakbang siya
  rationale: Ang יָצָא ay karaniwang “lumabas,” ngunit sa tagpong ito ay maaari ring ilarawan ang pag-abante o paghakbang ni Joab. Ang “humakbang” ay natural at hindi nagpapahiwatig ng isang hindi binanggit na gusali o lugar na nilabasan.
- source_word: וַתִּפֹּל
  choice: nahulog iyon
  rationale: Pambabae ang anyo ng pandiwa at pinakamalamang na tumutukoy sa חֶרֶב, “tabak,” ngunit pinananatili ng “iyon” sa pangunahing teksto ang bahagyang di-tuwirang pagtukoy ng Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng pambabaeng pandiwang וַתִּפֹּל
  choice: Gumamit ng “iyon” sa pangunahing teksto at ipinaliwanag sa talababa na malamang na tabak ang tinutukoy.
  alternative: Tahasang isalin na “nahulog ang tabak.”
  rationale: Walang mahalagang doktrinal na usapin, ngunit may gramatikal na kalabuan sa ibabaw ng teksto. Ang pambabaeng anyo ay malakas na tumuturo sa tabak, subalit hindi tahasang inuulit ng Hebreo ang pangngalan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may malinaw na daloy ng salaysay. Iniwasan ang lipas na “bigkis” at teknikal na “eskabarda,” ngunit pinanatili ang konkretong larawan ng sinturon, tabak, baywang, at kaluban. Inilagay ang bawat talababa kaagad pagkatapos ng pariralang nililinaw nito.
