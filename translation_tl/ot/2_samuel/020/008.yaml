    rationale: Sa “tabak na nakakabit sa kanyang baywang at nasa kaluban nito,” maaaring hindi agad malinaw kung ano ang tinutukoy ng “nito.” Ang inayos na ayos ay nagpapanatili ng parehong detalye habang ginagawang malinaw na ang kaluban ay para sa tabak.
