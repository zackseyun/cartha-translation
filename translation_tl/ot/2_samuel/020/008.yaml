    rationale: Ang יָצָא ay “lumabas” at maaaring magpahiwatig ng paglabas/pag-usad, ngunit hindi nito partikular na sinasabing humakbang. Ang “lumabas” ang mas malapit na salin at pinananatili ang pagiging bigla o hindi ganap na tiyak ng parirala.
  - severity: low
