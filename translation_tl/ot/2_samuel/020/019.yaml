base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: tl
  text: Ako ay kabilang sa mga mapayapa at tapat sa Israel. Hinahangad mong puksain ang isang lungsod at isang ina sa Israel[a]. Bakit mo lalamunin ang mana ni Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lungsod na isang ina sa Israel,” na malamang ay tumutukoy sa isang mahalaga o nangangalagang lungsod sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי
  choice: mga mapayapa at tapat
  rationale: 'Pinananatili nito ang maramihang kolektibong diwa ng dalawang anyo: kabilang ang nagsasalita sa mga taong nagtataguyod ng kapayapaan at kilala sa katapatan sa Israel.'
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: hinahangad mong puksain
  rationale: Ang participle at infinitive ay nagpapahayag ng aktibong layuning magdulot ng kamatayan. Dahil lungsod ang tuwirang layon, mas natural ang “puksain” kaysa “patayin,” habang nananatili ang bigat ng marahas na pagwasak.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: isang lungsod at isang ina sa Israel
  rationale: Pinananatili ang literal na pagkakaugnay at matingkad na larawang “ina,” nang hindi agad ipinapasyang appositional ang parirala. Inilalagay sa talababa ang malamang na alternatibong pagbasa.
- source_word: תְבַלַּע
  choice: lalamunin
  rationale: Tuwirang pinananatili ang matinding metapora ng “paglunok” sa halip na palitan ito ng paliwanag na “wawasakin.”
- source_word: נַחֲלַת יְהוָה
  choice: mana ni Yahweh
  rationale: Ang “mana” ay natural at malinaw na katumbas ng נַחֲלָה at pinananatili ang tipang diwa na ang Israel ay pag-aari ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton sa tekstong Hebreo.
theological_decisions:
- issue: Ang metaporang “ina sa Israel”
  choice: Panatilihin sa pangunahing teksto ang “isang lungsod at isang ina sa Israel.”
  alternative: “isang lungsod na isang ina sa Israel”
  rationale: Maaaring appositional ang Hebreo at tumukoy sa lungsod bilang isang mahalaga o nangangalagang “ina,” ngunit hindi ganap na nilulutas ng anyo nito ang ugnayan. Pinananatili ng salin ang tunay na kalabuan at ang retorikal na larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “puksain” upang maging natural kapag lungsod ang layon, at pinanatili ang matingkad na metaporang “lalamunin.”
