  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: tl
  text: Naroon ang isang masamang tao[a] na ang pangalan ay Seba na anak ni Bicri, isang Benjaminita. Hinipan niya ang tambuli[b] at sinabi, “Wala kaming bahagi kay David, at wala kaming mana sa anak ni Jesse. Bawat isa, sa kani-kaniyang tolda, Israel!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang hamak na tao” o “isang suwail na tao”; mas literal, “isang tao ng belial.” Dito, ang belial ay nangangahulugang kasamaan o kawalang-halaga, hindi kinakailangang isang pangalang pantangi.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: shofar, isang sungay na hinihipan bilang hudyat sa publiko; ayon sa tradisyon, karaniwan itong sungay ng lalaking tupa.'
    reason: cultural_note
lexical_decisions:
- source_word: נִקְרָא
  choice: Naroon
  rationale: Sa konstruksiyong ito, ang Niphal ng קרא kasama ng שָׁם ay gumaganap na panandang eksistensiyal. Ang “Naroon” ay natural sa salaysay at hindi nagpapahiwatig na pinangalanan ang lalaki.
- source_word: אִישׁ בְּלִיַּעַל
  choice: isang masamang tao
  rationale: Dito, ang בְּלִיַּעַל ay paglalarawan sa isang hamak, masama, o suwail na tao, hindi kinakailangang pangalang pantangi. Natural at malinaw sa modernong Tagalog ang “masamang tao,” habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba na anak ni Bicri
  rationale: Isinalin sa karaniwang anyong Filipino ang mga personal na pangalan at pinanatili ang ugnayang ama-anak.
- source_word: אִישׁ יְמִינִי
  choice: isang Benjaminita
  rationale: Tumutukoy ang parirala sa pagkakabilang sa lipi ni Benjamin; malinaw at maikli ang “Benjaminita.”
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: Hinipan niya ang tambuli
  rationale: Ang שׁוֹפָר ay sungay na hinihipan bilang hudyat. Ang “tambuli” ang natural na salitang Filipino para sa ganitong instrumentong pantawag o pananda, at nililinaw sa talababa ang materyal at gamit nito.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Wala kaming bahagi kay David
  rationale: Pinananatili ng “bahagi” ang larawan ng חֵלֶק bilang parte o kaparte at ang pampolitikang pahayag na wala silang pakialam o kapakinabangan sa paghahari ni David.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: at wala kaming mana sa anak ni Jesse
  rationale: Ang “mana” ay tuwirang katumbas ng נַחֲלָה at pinananatili ang resonansiya ng minanang pag-aari habang gumagana bilang talinghaga sa pampolitikang ugnayan.
- source_word: בְּבֶן יִשַׁי
  choice: sa anak ni Jesse
  rationale: Pinananatili ang bahagyang mapanghamak na pagtukoy kay David sa pamamagitan ng kaniyang angkan sa halip na tawagin siyang hari.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Bawat isa sa kani-kaniyang tolda
  rationale: Inililipat nito sa natural na Tagalog ang distributibong idyoma habang pinananatili ang literal na larawan ng pagbalik ng bawat tao sa kaniyang tolda.
- source_word: יִשְׂרָאֵל
  choice: O Israel
  rationale: Ang “O” ay nagpapanatili sa tahasang bokatibo at sa mariing himig ng panawagang maghimagsik.
theological_decisions:
- issue: Kung ang בְּלִיַּעַל ay pangalang pantangi na “Belial” o mapaglarawang katawagan
  choice: Mapaglarawang katawagang “masamang tao”
  alternative: “isang tao ni Belial,” “isang hamak na tao,” o “isang suwail na tao”
  rationale: Sa kontekstong ito, inilalarawan ng parirala ang masamang pagkatao ni Seba; hindi hinihingi ng teksto ang mas huling pagkaunawa kay Belial bilang isang demonyong pangalang pantangi. Iniiwasan ng salin ang pagpasok ng gayong teolohikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “Naroon” bilang maikling panimulang eksistensiyal, “tambuli” para sa instrumentong panghudyat, at pinanatili ang “O Israel” upang maipahayag ang mariing bokatibong panawagan. Inilagay ang bawat talababa kaagad sa terminong nililinaw nito.
