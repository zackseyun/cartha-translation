  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: tl
  text: At si Ira na Jairita ay pari rin ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “punong opisyal” o “tagapayo ng hari”; literal na “pari” ang salitang Hebreo, ngunit sa ilang konteksto ng maharlikang korte maaari itong tumukoy sa isang mataas na opisyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At ... rin
  rationale: Pinananatili ng “At” ang ugnay sa naunang talaan, at ipinahahayag ng “rin” ang dagdag na diin ng גַּם sa natural na Filipino.
- source_word: עִירָא
  choice: Ira
  rationale: Isinalin sa karaniwang transliterasyon sa Filipino ang pangalang pantangi.
- source_word: הַיָּאִרִי
  choice: na Jairita
  rationale: Ang anyong gentiliko ay tumutukoy sa kaugnayan ni Ira kay Jair, sa angkan man o pangkat; ang “Jairita” ay maikli at likas na katawagan sa Filipino.
- source_word: הָיָה
  choice: ay
  rationale: Sa talaan ng mga opisyal, gumaganap itong simpleng kopula sa nakaraan. Hindi kailangang tahasang ulitin ang panandang nakaraan sa Filipino, at iniiwasan ng “ay” ang mas interpretibong “naging.”
- source_word: כֹהֵן
  choice: pari
  rationale: Ang pangunahing leksikal na kahulugan ay “pari.” Bagaman maaari itong tumukoy sa isang mataas na opisyal sa konteksto ng korte ng hari, pinananatili sa pangunahing teksto ang literal na diwa at inilalagay sa talababa ang mga posibleng kahulugang pampangasiwaan.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas sa Filipino ang “pari ni David” para sa relasyong ipinahahayag ng לְ, habang hindi tiyak na nililimitahan ang tungkulin sa kultiko o pampangasiwaan.
theological_decisions:
- issue: Kahulugan ng כֹּהֵן sa konteksto ng korte ng hari
  choice: Panatilihin ang “pari” sa pangunahing teksto
  alternative: “punong opisyal” o “tagapayo ng hari”
  rationale: Bagaman maaaring gamitin dito ang כֹּהֵן para sa isang mataas na opisyal na naglilingkod sa hari, “pari” ang payak at karaniwang kahulugan nito. Pinananatili ng salin ang tunay na kalabuan ng Hebreo sa halip na magpasya agad para sa isang di-kultikong katungkulan.
translation_notes:
  register: Modernong Filipino na maikli at marangal, na angkop sa estilong talaan ng mga opisyal. Ginamit ang “Jairita” bilang natural na katawagang pang-angkan at “pari ni David” upang mapanatili ang maikling anyo at kalabuan ng Hebreo.
