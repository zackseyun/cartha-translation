translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Hindi pinapaganda o pinahihina ang marahas na detalye ng salaysay. Ang hulmaing ‘buong karunungang’ ay nagpapanatili sa diin ng Hebreo habang nananatiling natural sa pasalaysay na Tagalog.
