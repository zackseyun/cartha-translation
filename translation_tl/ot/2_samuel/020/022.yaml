base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: tl
  text: Pagkatapos, nagtungo ang babae sa lahat ng tao nang buong karunungan. Pinutol nila ang ulo ni Sheba na anak ni Bicri at inihagis ito kay Joab. Hinipan ni Joab ang trompeta, at nagkawatak-watak sila palayo sa lungsod, bawat isa ay umuwi sa kanyang tolda.[a] Bumalik si Joab sa Jerusalem, sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat isa sa kanyang tolda,” isang nakagawiang pahayag para sa pag-uwi o pagbalik ng bawat isa sa sarili niyang lugar.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל כָּל הָעָם בְּחָכְמָתָהּ
  choice: buong karunungang pumunta ang babae sa lahat ng tao
  rationale: Pinananatili ang kilos na ‘pumunta’ at ang tahasang diin ng Hebreo sa karunungan ng babae, ngunit isinasaayos sa likas na daloy ng modernong Tagalog.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: pinugutan nila ng ulo
  rationale: Ito ang malinaw at natural na katumbas sa Tagalog ng literal na ‘pinutol nila ang ulo,’ nang hindi pinahihina ang marahas na kilos.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba na anak ni Bicri
  rationale: Pinananatili ang mga pangalang Hebreo at malinaw na inilalahad ang patronimiko sa karaniwang anyong Tagalog.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: inihagis ang ulo kay Joab
  rationale: Inuulit ang ‘ulo’ upang maging malinaw ang layon sa Tagalog; ipinahihiwatig ng אֶל ang direksiyon o tumanggap.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Hinipan ni Joab ang tambuli
  rationale: Ang ‘tambuli’ ay natural at pamilyar na salitang Tagalog para sa sungay na ginagamit bilang hudyat. Nililinaw ang paksang si Joab na ipinahihiwatig ng konteksto.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: nagsialis sila mula sa lungsod
  rationale: Ipinapahayag ang pagkalat o pag-alis ng mga kumukubkob nang hindi nagpapahiwatig na tumakas sila sa takot.
- source_word: אִישׁ לְאֹהָלָיו
  choice: bawat isa ay umuwi sa kanyang tolda
  rationale: Natural na Tagalog para sa pormulang Hebreo na nagsasaad ng pag-uwi o pagbalik ng bawat isa sa sarili niyang lugar.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: Bumalik naman si Joab sa hari sa Jerusalem
  rationale: Pinananatili ang pagbabalik ni Joab at ang ugnayan ng Jerusalem sa hari nang may malinaw na daloy sa Tagalog.
