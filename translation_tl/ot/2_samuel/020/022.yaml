revisions:
- from: Pagkatapos, buong karunungang pumunta ang babae sa lahat ng tao. Pinugutan nila ng ulo si Sheba na anak ni Bicri at inihagis ang ulo kay Joab. Hinipan ni Joab ang tambuli, at nagsialis sila mula sa lungsod, bawat isa ay umuwi sa kanyang tolda.[a] Bumalik naman si Joab sa hari sa Jerusalem.
  to: Pagkatapos, nagtungo ang babae sa lahat ng tao nang buong karunungan. Pinutol nila ang ulo ni Sheba na anak ni Bicri at inihagis ito kay Joab. Hinipan ni Joab ang trompeta, at nagkawatak-watak sila palayo sa lungsod, bawat isa ay umuwi sa kanyang tolda.[a] Bumalik si Joab sa Jerusalem, sa hari.
  rationale: Inayos ang maling hulma ng unang pangungusap at ginawang natural na Tagalog ang instrumental na diwa ng בְּחָכְמָתָהּ. Ginawang tahasan ang ulo bilang layon ng pagputol at paghagis. Inihayag ang pag-alis palayo sa lungsod upang maipakita ang paglusaw ng mga kumukubkob, habang pinanatili ang idyomatikong “umuwi sa kanyang tolda” at ang kaugnay na talababa.
