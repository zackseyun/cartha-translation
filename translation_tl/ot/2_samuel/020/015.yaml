translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lupang pansalakay” sa halip na teknikal o banyagang “siege ramp,” at pinag-iba ang “panlabas na tanggulan” (חֵל) sa “muog” (חוֹמָה). Pinanatili sa pangunahing teksto ang “siya” upang huwag burahin ang tunay na panghalip at posibleng pagtutok kay Sheba.
