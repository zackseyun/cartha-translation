base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: tl
  text: Dumating sila at kinubkob siya sa Abel-bet-maaca[a]. Nagtambak sila ng rampang pangkubkob laban sa lungsod, at nakapuwesto ito sa may tanggulan[b]. Sinisira naman ng lahat ng tauhang kasama ni Joab ang iyon upang pabagsakin ang pader.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinubkob nila ito.” “Siya” ang literal na panghalip sa Hebreo at malamang na nakatuon kay Sheba, bagaman ang lungsod ang kinukubkob.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa panlabas na muog, depensibong pilapil, o ibang tanggulan ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating sila
  rationale: Likas na salaysay na katumbas ng wayyiqtol mula sa בוא at malinaw na tumutukoy sa pagdating ng hukbo.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: kinubkob siya
  rationale: Ang צור na may עַל ay nangangahulugang kubkubin. Pinanatili ang panlalaking isahang panghalip na malamang tumutukoy kay Sheba, sa halip na gawing tahasang lungsod ang tuon.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: sa Abel-bet-maaca
  rationale: Isinalin sa modernong baybay-Tagalog ang tambalang pangalan ng lugar nang hindi binibigyan ng di-tiyak na kahulugan ang mga bahagi nito.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: Nagtambak sila ng lupang pansalakay
  rationale: Ang literal na larawan ng 'pagbuhos' ay isang idyoma para sa pagtatambak ng lupa; ang סֹלְלָה ay lupang rampa o bunton na ginagamit sa pagkubkob.
- source_word: אֶל הָעִיר
  choice: laban sa lungsod
  rationale: Bagaman maaaring literal na 'patungo sa lungsod,' ipinahahayag ng 'laban sa' ang direksiyon at layuning militar sa konteksto.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: umabot iyon sa panlabas na tanggulan
  rationale: Ang pambabaeng pandiwa ay pinakamalamang na tumutukoy sa סֹלְלָה. Ang חֵל ay isang panlabas na depensibong muog o tanggulan; ipinahahayag ng 'umabot' na naitayo o nakadikit doon ang bunton nang hindi labis na nilulutas ang eksaktong estruktura.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: lahat ng tauhang kasama ni Joab
  rationale: Ang אֶת dito ay nagpapahiwatig ng pakikisama; sa konteksto, ang עָם ay mga tauhan o kawal ni Joab.
- source_word: מַשְׁחִיתִם
  choice: Patuloy namang winawasak
  rationale: Pinananatili ang nagpapatuloy na kilos ng participle mula sa שׁחת. Hindi nililimitahan sa isang tiyak na paraan ng pagsira gaya ng paghampas.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: ang muog upang maibagsak ito
  rationale: Ang Hiphil ng נפל ay 'magpabagsak.' Ginawang tahasan ang muog bilang nauunawaang layon ng naunang pandiwa upang maging malinaw sa Tagalog.
