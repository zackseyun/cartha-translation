revisions:
- from: Dumating sila at kinubkob siya sa Abel-bet-maaca[a]. Nagtambak sila ng lupang pansalakay laban sa lungsod, at umabot iyon sa panlabas na tanggulan[b]. Patuloy namang winawasak ng lahat ng tauhang kasama ni Joab ang muog upang maibagsak ito.
  to: Dumating sila at kinubkob siya sa Abel-bet-maaca[a]. Nagtambak sila ng rampang pangkubkob laban sa lungsod, at nakapuwesto ito sa may tanggulan[b]. Sinisira naman ng lahat ng tauhang kasama ni Joab ang iyon upang pabagsakin ang pader.
