base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: tl
  text: Sinabi ni Joab kay Amasa[a], “Mabuti ba ang kalagayan mo, kapatid ko?” At hinawakan ni Joab ang balbas ni Amasa gamit ang kaniyang kanang kamay upang halikan siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang paghawak sa balbas at paghalik ay mga kilos na kaugnay ng magiliw na pagbati; sa kontekstong ito, mapanlinlang ang ginawa ni Joab.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם
  choice: Mabuti ba ang kalagayan mo
  rationale: Ang idyoma ay nagtatanong tungkol sa kapayapaan o kalagayan ng isang tao. Likas ito sa modernong Filipino at mas napapanatili ang diwa kaysa sa karaniwang “Kumusta ka?”
- source_word: אָחִי
  choice: kapatid ko
  rationale: Pinananatili ang tahasang hulaping paari at ang magiliw o mapaglapit na tawag na mapanlinlang sa konteksto.
- source_word: וַתֹּחֶז
  choice: hinawakan
  rationale: Ipinapahayag nito ang paghawak nang hindi agad pinalalabis bilang marahas na pagsunggab; sa kasunod na talata pa mahahayag ang pag-atake.
- source_word: יַד יְמִין יוֹאָב
  choice: ng kanang kamay niya
  rationale: Pinananatili ang tiyak na detalye tungkol sa kanang kamay ni Joab sa natural na ayos ng Filipino.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: ang balbas ni Amasa
  rationale: Direkta at natural na pagpapahayag ng pag-aari, habang pinananatili ang mahalagang detalyeng pangkultura.
- source_word: לִנְשָׁק לוֹ
  choice: upang halikan siya
  rationale: Ipinahahayag ng infinitive na may ל ang layunin ng paghawak; malinaw itong naihahatid ng “upang.”
