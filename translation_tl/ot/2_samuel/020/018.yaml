base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya[a], “Noong unang panahon, sinasabi nila, ‘Talagang magtanong sila sa Abel[b],’ at sa gayon ay tinatapos nila ang usapin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Noon ay talagang sinasabi nila, ‘Talagang nagtatanong sila sa Abel,’ at sa gayon ay tinatapos nila ang usapin.” May dalawang konstruksyon sa Hebreo na nagbibigay-diin sa pandiwa. Ang huling pandiwa ay maaari ring isaling “dinadala nila sa katapusan” o “tinatapos nila.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Abel” ay pinaikling pangalan ng Abel-bet-maaca, ang lunsod na kinukubkob sa kontekstong ito.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Pagkatapos ay sinabi niya
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay, at ang לֵאמֹר ay likas na ipinahihiwatig ng tuwirang sipi sa Filipino.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: ganito ang lagi nilang sinasabi
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagpapalakas sa pandiwa. Sa konteksto ng isang dating kasabihan, ipinahahayag ng “lagi nilang sinasabi” ang nakaugaliang pagsasalita nang natural sa Filipino.
- source_word: בָרִאשֹׁנָה
  choice: Noong unang panahon
  rationale: Tumutukoy ito sa dating panahon o sinaunang kaugalian, hindi lamang sa unang hakbang ng isang pagkakasunod-sunod.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Dapat talagang sumangguni
  rationale: Ang infinitive absolute at imperfect ay nagbibigay-diin sa pagtatanong o pagsangguni. Pinananatili ng “talagang” ang diin, samantalang inilalahad ng “dapat” ang maaaring mapag-utos o mapagpayo na puwersa ng kasabihan.
- source_word: בְּאָבֵל
  choice: sa Abel
  rationale: Ang Abel ay pinaikling pangalan ng Abel-bet-maaca. Ang “sa” ay natural na maaaring tumukoy sa lugar kung saan humihingi ng payo.
- source_word: וְכֵן הֵתַמּוּ
  choice: at sa ganoong paraan nila tinatapos ang usapin
  rationale: Ang וְכֵן ay nangangahulugang “at sa gayong paraan,” at ang Hiphil ng תמם ay nagsasaad ng pagdadala ng isang bagay sa katapusan. Ang “tinatapos ang usapin” ay nagpapanatili sa kongkretong diwa nang hindi ito awtomatikong binibigyang-kahulugang “nilulutas.”
theological_decisions:
- issue: Puwersa ng שָׁאֹל יְשָׁאֲלוּ sa loob ng kasabihan
  choice: Dapat talagang sumangguni
  alternative: Talagang sumasangguni sila
  rationale: Maaaring unawain ang anyong Hebreo bilang mapag-utos/mapagpayo o bilang paglalarawan ng nakagawian. Pinili sa teksto ang likas na mapagpayong pagbasa, habang itinatala sa talababa ang alternatibong pagkakabuo ng buong pangungusap.
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa. Ginamit ang “sumangguni” kaysa payak na “magtanong” dahil ipinahihiwatig ng konteksto ang paghingi ng payo, ngunit hindi ginawang “lumutas” ang huling pandiwa upang mapanatili ang mas literal at bahagyang malabong diwa ng Hebreo.
