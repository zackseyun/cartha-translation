    issue: Ang “lagi nilang sinasabi” ay mas malakas kaysa sa dating nakagawiang pagsasalita.
    rationale: Ang “lagi” ay karaniwang nangangahulugang palagi o every time; ang Hebreong parirala ay mas maingat na naipahahayag bilang “sinasabi nila noon” o “noong unang panahon.”
  - severity: medium
    issue: Ang “sumangguni” ay nagbibigay ng mas espesipikong kahulugan kaysa שאל.
    rationale: Maaaring tumukoy ang konteksto sa paghingi ng payo, ngunit ang pandiwa ay pangunahing “magtanong/magsiyasat.” Ang mas payak na salin ay mas pinananatili ang saklaw ng Hebreo.
