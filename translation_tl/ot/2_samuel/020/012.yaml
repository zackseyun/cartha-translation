  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: tl
  text: Gumugulong-gulong si Amasa sa dugo sa gitna ng daan.[a] Nang makita ng lalaki na tumitigil ang lahat ng tao, inilipat niya si Amasa mula sa daan tungo sa bukid at tinakpan siya ng isang kasuotan, sapagkat nakita niyang tumitigil ang bawat lumalapit kay Amasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namimilipit.” Mas literal na inilalarawan ng pandiwang Hebreo ang paggulong-gulong ng isang tao; dito, malamang na tumutukoy ito sa hirap na pagkilos ni Amasa habang nakahandusay at sugatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: gumugulong-gulong
  rationale: Inilalarawan ng anyong Hitpolel ang paulit-ulit o patuloy na pag滚/galaw ni Amasa habang sugatan. Pinananatili ng “gumugulong-gulong” ang konkretong larawan ng Hebreo nang hindi ipinapalagay na kusa o moral na may bahid ang kilos.
- source_word: בַּדָּם
  choice: sa dugo
  rationale: Hindi idinaragdag ang “sarili niyang” dahil hindi iyon tahasang sinasabi sa Hebreo; natural din sa Filipino ang “sa dugo.”
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: sa gitna ng daan
  rationale: Ang מְסִלָּה ay isang daan o lansangan, kadalasa’y pangunahing o nakaangat na daan. Ang payak na “daan” ang pinakanatural dito at malinaw na naihahatid ng “sa gitna” ang בְּתוֹךְ.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: May tiyak na pantukoy ang Hebreo, kaya tumutukoy ito sa isang partikular na lalaking nauunawaan mula sa konteksto.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: na humihinto ang lahat
  rationale: Sa tagpong ito, ang עמד ay pagkatigil ng mga dumarating dahil nakaharang si Amasa sa daan. Ang aspektong nagaganap na “humihinto” ay angkop sa daloy ng salaysay.
- source_word: וַיַּסֵּב
  choice: inilipat niya
  rationale: Ipinahihiwatig ng Hiphil na pinapangyari ng lalaki na maalis si Amasa sa daan. Hindi idinaragdag ang mas tiyak na paraang “kinaladkad,” na wala sa teksto.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: mula sa daan tungo sa bukid
  rationale: Malinaw nitong ipinapakita ang pinagmulan at patutunguhan ng paglilipat nang natural sa Filipino.
- source_word: בֶּגֶד
  choice: isang kasuotan
  rationale: Pangkalahatang salita ang בֶּגֶד para sa damit o kasuotan; hindi ito nililimitahan sa balabal.
- source_word: כָּל הַבָּא עָלָיו
  choice: ang bawat makarating sa kinaroroonan nito
  rationale: Ipinahahayag nito ang pagdating ng mga tao sa lugar kung saan nakahandusay si Amasa, nang hindi dinaragdagan ang tekstong Hebreo ng tahasang “makakita.”
- source_word: וְעָמָד
  choice: humihinto
  rationale: Inuulit nito ang naunang obserbasyon na tumitigil ang mga dumarating dahil kay Amasa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito/nito” para kay Amasa sa kasunod na mga sugnay upang maiwasan ang malabong sunod-sunod na “niya/kaniya,” habang nananatiling natural ang salaysay.
