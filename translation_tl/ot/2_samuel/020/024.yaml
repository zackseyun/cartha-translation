  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang tungkuling panghukuman/pampangasiwaan sa Hebreo: si Adoram ay nangangasiwa sa מַס, at si Jehoshafat, anak ni Ahilud, ay ang opisyal na הַמַּזְכִּיר. Ang “sapilitang paggawa” ay angkop sa kontekstong ito at hindi maling naipapakahulugang karaniwang buwis.'
