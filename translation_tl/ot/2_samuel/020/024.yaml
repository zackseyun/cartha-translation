  text: Adoram was over the forced labor[a], and Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: tl
  text: Si Adoram ang namamahala sa sapilitang paggawa[a], at si Jehoshafat na anak ni Ahilud ang tagapagtala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “takdang paglilingkod-paggawa”; ang salitang Hebreo ay tumutukoy sa sapilitang paggawa para sa estado, hindi sa karaniwang pagbubuwis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Isinalin sa baybay-Filipino ang personal na pangalan batay sa anyong Hebreo.
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng עַל ang pamamahala o pananagutan sa isang gawain; natural itong ipinahayag sa Filipino bilang “ang namamahala sa.”
- source_word: הַמַּס
  choice: sapilitang paggawa
  rationale: Sa administrasyong maharlika, ang מַס ay tumutukoy rito sa sapilitang paglilingkod-paggawa na ipinapataw ng estado, hindi lamang sa buwis na salapi.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Ginamit ang karaniwang baybay-Filipino ng pangalang Hebreo.
- source_word: בֶּן אֲחִילוּד
  choice: na anak ni Ahilud
  rationale: Natural na salin sa Filipino ng patronimikong konstruksyong Hebreo.
- source_word: הַמַּזְכִּיר
  choice: tagapagtala
  rationale: Ang titulo ay tumutukoy sa opisyal ng hari na nangangalaga ng mga tala at memorandum ng pamahalaan; mas tiyak ang “tagapagtala” kaysa “kalihim,” na maaaring tumukoy sa ibang tungkulin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan ng mga opisyal, habang ginawang likas sa Filipino ang mga nominal na sugnay ng Hebreo.
