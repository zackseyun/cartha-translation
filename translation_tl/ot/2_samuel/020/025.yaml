  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: tl
  text: At si Seva ang kalihim[a], at sina Zadok at Abiatar ang mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagasulat.” Ang salitang Hebreo ay maaaring tumukoy sa opisyal na tagasulat o kalihim ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: Seva
  rationale: Tuwirang transliterasyon ng pangalang nasa tekstong Masoretiko; hindi ito ipinapantay nang walang katiyakan sa mga variant na pangalan sa mga kaagapay na tala.
- source_word: סֹפֵר
  choice: kalihim
  rationale: Sa konteksto ng talaan ng mga opisyal ng hari, tumutukoy ito sa isang opisyal na tagasulat o kalihim. Mas natural sa makabagong Filipino ang “kalihim” bilang katawagan sa tungkuling administratibo, habang inilalahad sa talababa ang literal at posibleng alternatibo.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Likas at pamantayang salin ng pangmaramihang katawagan para sa mga paring naglilingkod sa kulto ng Israel.
- source_word: וְ
  choice: at
  rationale: Pinanatili ang paulit-ulit na pang-ugnay upang maipakita ang payak na ayos ng talaan sa Hebreo.
