base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: tl
  text: At isa sa mga tauhan[a] ni Joab ang tumayo sa tabi niya at nagsabi, “Ang sinumang kumakampi kay Joab at ang sinumang nasa panig ni David ay sumunod kay Joab![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “mga kabataang lalaki,” “mga lingkod,” o “mga tagapaglingkod”; dito ay tumutukoy ito sa mga nakabababang tauhan ni Joab.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “sa likod ni Joab.” Sa konteksto, isa itong panawagang sumama at sumunod sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: At isa
  rationale: Ipinakikilala ng אִישׁ ang isang di-tinutukoy na lalaki mula sa pangkat ni Joab; natural sa Tagalog ang “isa” sa ganitong konteksto.
- source_word: עָמַד עָלָיו
  choice: tumayo sa tabi niya
  rationale: Ang עמד na may עַל ay maaaring mangahulugang tumayo sa ibabaw o sa tabi ng isang tao. Sa Tagalog, ang “sa tabi niya” ay malinaw na nagpapakitang pumuwesto siya malapit kay Amasa nang hindi ipinahihiwatig na literal siyang tumuntong dito.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: sa mga tauhan ni Joab
  rationale: Sa kontekstong militar, ang נַעַר ay maaaring tumukoy sa kabataang lalaki, lingkod, tagapaglingkod, o nakabababang tauhan. Ang “mga tauhan” ang pinakanatural at hindi labis na tiyak.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: Ang sinumang kumakampi kay Joab
  rationale: Bagaman ang חָפֵץ ay maaaring mangahulugang nalulugod o nagnanais, sa sigaw na ito ang diwa ay pagsuporta at katapatan kay Joab; malinaw itong naipahahayag ng “kumakampi.”
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: at ang sinumang panig kay David
  rationale: Ang לְדָוִד ay nagpapahayag dito ng pagpanig o katapatan kay David. Pinananatili ng “panig kay David” ang maigsi at pampolitika-militar na diwa.
- source_word: אַחֲרֵי יוֹאָב
  choice: sumunod kay Joab
  rationale: Literal itong “sa likod ni Joab,” ngunit sa ganitong panawagan ay nangangahulugang humayo o sumunod sa kanya. Kailangan sa natural na Tagalog ang tahasang pandiwang “sumunod.”
