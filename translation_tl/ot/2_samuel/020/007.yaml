  to: Lumabas ang mga tauhan ni Joab, ang mga Kereteo, ang mga Peleteo, at ang lahat ng magigiting na mandirigma kasunod niya. Lumabas sila mula sa Jerusalem upang tugisin si Sheba na anak ni Bikri.
