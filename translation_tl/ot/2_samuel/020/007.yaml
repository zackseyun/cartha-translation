base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: tl
  text: Lumabas ang mga tauhan ni Joab, ang mga Kereteo, ang mga Peleteo, at ang lahat ng magigiting na mandirigma kasunod niya. Lumabas sila mula sa Jerusalem upang tugisin si Sheba na anak ni Bikri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: Lumabas na kasunod niya
  rationale: Pinananatili ang kilos at ayos ng idyomang Hebreo na ‘lumabas kasunod niya,’ pati ang panghalip na ang tinutukoy ay makikita sa konteksto.
- source_word: אַנְשֵׁי יוֹאָב
  choice: mga tauhan ni Joab
  rationale: Likas sa makabagong Filipino at malinaw na tumutukoy sa mga lalaking nasa ilalim ng pamumuno ni Joab.
- source_word: הַכְּרֵתִי
  choice: mga Kereteo
  rationale: Pinanatili bilang pangalan ng pangkat sa halip na bigyan ng mapagpalagay na kahulugan; ang anyong Kereteo ay pamilyar at angkop sa Filipino.
- source_word: הַפְּלֵתִי
  choice: mga Peleteo
  rationale: Isinalin bilang pangalan ng pangkat na karaniwang kapares ng mga Kereteo, nang walang mapagpalagay na pagpapakahulugan.
- source_word: כָל הַגִּבֹּרִים
  choice: lahat ng magigiting na mandirigma
  rationale: Ipinahahayag ang lakas, kagitingan, at malinaw na diwang militar ng גִּבּוֹרִים sa natural na Filipino.
- source_word: מִירוּשָׁלִַם
  choice: mula sa Jerusalem
  rationale: Tuwirang ipinakikita ang pinanggalingan ng kanilang paglabas.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: upang tugisin
  rationale: Ang ‘tugisin’ ay natural at tiyak na katumbas ng paghabol na may layuning abutan.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba na anak ni Bikri
  rationale: Pinananatili ang patronimikong anyo ng Hebreo; ginamit ang Bikri bilang malapit na transliterasyon ng pangalang בִּכְרִי.
