base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: tl
  text: Lumapit siya sa kanya, at sinabi ng babae, “Ikaw ba si Joab?” Sumagot siya, “Ako nga.” Pagkatapos ay sinabi nito sa kanya, “Pakinggan mo ang mga salita ng iyong lingkod[a].” Sumagot siya, “Nakikinig ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong babaeng lingkod.” Mapagpakumbabang pagtukoy ito ng babae sa kanyang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: Lumapit siya sa kanya
  rationale: Tuwirang ipinahahayag ang pisikal na paglapit at ang direksiyon nito, nang hindi dinaragdagan ang layunin ni Joab.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Sa kontekstong ito, tumutukoy ito sa babaeng nagsasalita at hindi partikular sa isang asawa.
- source_word: הַאַתָּה יוֹאָב
  choice: Ikaw ba si Joab?
  rationale: Natural at tuwirang tanong ito sa modernong Filipino para tiyakin ang pagkakakilanlan.
- source_word: אָ֑נִי
  choice: Ako nga
  rationale: Maikli at likas na sagot sa Filipino na nagpapahayag ng pagkilala sa sarili, gaya ng nagsasariling panghalip sa Hebreo.
- source_word: שְׁמַע
  choice: Pakinggan mo
  rationale: Ipinahahayag ng pautos na anyo ang hinihinging maingat na pakikinig, hindi lamang ang pisikal na pagkarinig.
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Pinananatili ang maramihang anyo at pormal na tono ng Hebreong construct phrase.
- source_word: אֲמָתֶךָ
  choice: iyong lingkod
  rationale: Natural itong mapagpakumbabang pagtukoy sa sarili sa Filipino. Hindi likas ulitin sa pangunahing teksto ang kasariang pambabae, kaya nililinaw iyon sa talababa.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: Nakikinig ako
  rationale: Natural na ipinahahayag ang nagpapatuloy at handang pakikinig na taglay ng participle at tahasang panghalip.
