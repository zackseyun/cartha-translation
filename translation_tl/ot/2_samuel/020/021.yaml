base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: tl
  text: “Hindi ganoon ang usapin. Sa halip, may isang lalaki mula sa kabundukan ng Efraim[a], na ang pangalan ay Seba na anak ni Bicri. Nagtaas siya ng kamay laban sa hari, laban kay David.[b] Ibigay ninyo sa akin ang taong iyon lamang, at lalayo ako sa lungsod.” Sinabi ng babae kay Joab, “Tingnan mo, ihahagis sa iyo ang ulo niya mula sa ibabaw ng pader.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa bulubundukin ng Efraim”; ayon sa tradisyon, “mula sa Bundok Efraim.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong idyoma ay literal na “nagtaas ng kanyang kamay”; sa kontekstong ito, ang diwa ay “naghimagsik laban sa hari, laban kay David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: Hindi ganoon ang usapin
  rationale: Likas na pagtanggi sa naunang palagay ng babae, habang pinananatili ang pagtukoy sa mismong usapin.
- source_word: כִּי
  choice: Sa halip
  rationale: Ipinakikilala rito ang pagwawasto at paliwanag matapos ang pagtanggi.
- source_word: מֵהַר אֶפְרַיִם
  choice: mula sa bulubundukin ng Efraim
  rationale: Ang parirala ay karaniwang tumutukoy sa mataas at maburol na rehiyon ng Efraim, hindi lamang sa iisang bundok.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: na ang pangalan ay Seba na anak ni Bicri
  rationale: Malinaw at natural na inililipat sa Tagalog ang pormula ng pagpapangalan.
- source_word: נָשָׂא יָדוֹ
  choice: Nagtaas siya ng kamay
  rationale: Pinananatili ang kongkretong Hebreong idyoma at ang larawan ng hayagang paglaban; ipinaliliwanag sa talababa ang diwang paghihimagsik.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: laban sa hari, laban kay David
  rationale: Pinananatili ang inulit na pang-ukol at ang mariing pagtutumbas sa hari at kay David.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Ibigay ninyo siya lamang
  rationale: Pinananatili ang pautos na pagpapasakamay sa nag-iisang taong hinihingi, nang hindi idinaragdag sa pangunahing teksto ang tahasang layong wala sa Hebreo.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: at lalayo ako sa lungsod
  rationale: Sa konteksto ng pagkubkob, ang kahulugan ay umurong o lumayo mula sa lungsod, hindi umalis mula sa loob nito.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na nagpapanatili sa diin ng Hebreo nang hindi gumagamit ng lipas na pananalita.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: ihahagis sa iyo ang ulo niya sa ibabaw ng pader
  rationale: Ang balangkas na may הִנֵּה at pasibong participle ay likas na tumutukoy rito sa nalalapit na pangyayari; ang 'sa ibabaw ng pader' ay angkop sa kilos sa konteksto.
