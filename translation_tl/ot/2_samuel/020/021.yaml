revisions:
- from: “Hindi ganoon ang usapin. Sa halip, may isang lalaki mula sa bulubundukin ng Efraim[a] na ang pangalan ay Seba na anak ni Bicri. Nagtaas siya ng kamay laban sa hari, laban kay David.[b] Ibigay ninyo siya lamang, at lalayo ako sa lungsod.” Sinabi ng babae kay Joab, “Tingnan mo, ihahagis sa iyo ang ulo niya sa ibabaw ng pader.”
  to: “Hindi ganoon ang usapin. Sa halip, may isang lalaki mula sa kabundukan ng Efraim[a], na ang pangalan ay Seba na anak ni Bicri. Nagtaas siya ng kamay laban sa hari, laban kay David.[b] Ibigay ninyo sa akin ang taong iyon lamang, at lalayo ako sa lungsod.” Sinabi ng babae kay Joab, “Tingnan mo, ihahagis sa iyo ang ulo niya mula sa ibabaw ng pader.”
  rationale: Inayos ang panawagang isuko si Seba upang maging likas na modernong Tagalog, habang pinananatili ang kahulugang si Seba lamang ang hinihingi. Nilinaw rin ang direksiyon ng paghahagis sa ulo bilang mula sa ibabaw ng pader. Pinalitan ang 'bulubundukin' ng mas karaniwang 'kabundukan' at inayos ang katumbas na talababa.
