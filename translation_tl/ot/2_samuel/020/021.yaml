translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyoma tungkol sa pagtataas ng kamay at ang mariing pag-uulit na “laban sa hari, laban kay David,” habang ginawang natural sa Tagalog ang daloy ng usapan.
