source:
  edition: WLC
  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: tl
  text: Nang dumating si David sa bahay niya sa Jerusalem, kinuha ng hari ang sampung babae—ang mga konkubina na iniwan niya upang magbantay sa bahay—at ikinulong sila sa isang bahay na binabantayan.[a] Pinaglaanan niya sila, ngunit hindi na siya sumiping sa kanila.[b] Kaya nanatili silang nakakulong hanggang sa araw ng kanilang kamatayan, namumuhay na parang mga biyuda kahit buhay pa si David.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bahay ng pagbabantay” o “bahay ng kustodiya”; tumutukoy ito sa isang lugar ng pagkakapiit o mahigpit na pagbabantay.
    reason: lexical_alternative
  - marker: b
    text: Ang “sumiping sa kanila” ay isang magalang na pahayag para sa pakikipagtalik.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, literal na “pagkabiyuda ng pagiging buhay”; ibig sabihin, namuhay silang parang mga biyuda bagaman buhay pa si David.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: bahay niya
  rationale: Pinananatili ang karaniwang kahulugan ng בַּיִת; sa konteksto, ito ang maharlikang tirahan ni David, ngunit hindi kailangang gawing mas tiyak na 'palasyo.'
- source_word: פִּלַגְשִׁים
  choice: mga kinakasama
  rationale: Likas at madaling maunawaang modernong Filipino para sa mga babaeng may kinikilalang ugnayang marital ngunit mas mababa ang katayuan kaysa pangunahing asawa; iniiwasan ang masyadong teknikal o makalumang termino.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: iniwan upang magbantay sa bahay
  rationale: Ang שׁמר ay tahasang nagpapahiwatig ng pagbabantay o pag-iingat; malinaw at natural ang parirala sa Filipino.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: isang bahay na binabantayan
  rationale: Pinananatili ang konkretong 'bahay' at ang diwa ng kustodiya o pagbabantay nang hindi ipinapalagay na proteksiyon lamang ang layunin.
- source_word: וַיְכַלְכְּלֵם
  choice: pinaglaanan niya sila
  rationale: Ipinahahayag ang patuloy na paglalaan ng mga pangangailangan nang natural sa Filipino.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: hindi na siya sumiping sa kanila
  rationale: Inililipat sa likas na Filipino ang Hebreong eupemismo para sa pakikipagtalik, nang hindi ginagawang tahasan o magaspang.
- source_word: צְרֻרוֹת
  choice: nanatili silang nakakulong
  rationale: Ipinapakita ang pasibo at nagpapatuloy na kalagayan ng pagkakapiit o pagkakahiwalay.
- source_word: עַד יוֹם מֻתָן
  choice: hanggang sa araw ng kanilang kamatayan
  rationale: Malapit sa nominal na anyo ng Hebreo at malinaw sa Filipino.
- source_word: אַלְמְנוּת חַיּוּת
  choice: namumuhay na parang mga biyuda kahit buhay pa ang kanilang asawa
  rationale: 'Inilalahad ang di-pangkaraniwang kabalintunaan ng parirala: wari''y mga biyuda sila bagaman buhay pa si David.'
theological_decisions:
- issue: Ang moral at panlipunang katangian ng pagtrato ni David sa mga kinakasama niya
  choice: Isinalaysay nang tuwiran ang pagbabantay, pagkakakulong, paglalaan, at paghinto ng pakikipagtalik nang walang pagdadahilan o dagdag na paghatol.
  alternative: Ilarawan ito bilang proteksiyon lamang, o magdagdag ng tahasang moral na pagkondena.
  rationale: Hindi tahasang hinahatulan o ipinagtatanggol ng talata ang ginawa ni David. Dapat panatilihin ng salin ang bigat at tensiyon ng salaysay nang hindi nagdaragdag ng doktrinal o moral na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang 'mga kinakasama' sa halip na teknikal na 'mga concubine'; pinanatili ang mabigat na diwa ng pagkakakulong at ang kabalintunaan ng pamumuhay na parang biyuda.
