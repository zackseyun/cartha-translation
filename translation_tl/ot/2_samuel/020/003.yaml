  naturalness: Natural at marangal ang karamihan ng daloy. Ang “ikinulong sila sa isang bahay na binabantayan” ay malinaw, moderno, at pinananatili ang kongkretong “bahay” at ang diwa ng kustodiya. Ang “mga konkubina” ay isang matatag na terminong Filipino para sa natatanging institusyong tinutukoy ng Hebreo.
  terminology: Gamitin ang “mga konkubina” para sa פִּלַגְשִׁים. Panatilihin ang “sumiping” bilang magalang na eupemismo, at “mga biyuda kahit buhay pa si David” upang maipahayag ang sadyang kabalintunaan ng אַלְמְנוּת חַיּוּת.
