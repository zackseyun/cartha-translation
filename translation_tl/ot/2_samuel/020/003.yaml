revisions:
- from: Nang dumating si David sa bahay niya sa Jerusalem, kinuha ng hari ang sampung babae—ang mga kinakasama niyang iniwan upang magbantay sa bahay—at inilagay sila sa isang bahay na binabantayan.[a] Pinaglaanan niya sila, ngunit hindi na siya sumiping sa kanila.[b] Kaya nanatili silang nakakulong hanggang sa araw ng kanilang kamatayan, namumuhay na parang mga biyuda kahit buhay pa ang kanilang asawa.[c]
  to: Nang dumating si David sa bahay niya sa Jerusalem, kinuha ng hari ang sampung babae—ang mga konkubina na iniwan niya upang magbantay sa bahay—at ikinulong sila sa isang bahay na binabantayan.[a] Pinaglaanan niya sila, ngunit hindi na siya sumiping sa kanila.[b] Kaya nanatili silang nakakulong hanggang sa araw ng kanilang kamatayan, namumuhay na parang mga biyuda kahit buhay pa si David.[c]
  rationale: Pinalitan ang malabong paglalarawan ng kustodiya ng tahasang “ikinulong” upang maipakita ang בֵּית מִשְׁמֶרֶת at ang kasunod na צְרֻרוֹת. Pinalitan ang “mga kinakasama” ng “mga konkubina” upang mapanatili ang natatanging katayuang panlipunan ng פִּלַגְשִׁים. Itinuwid ang tala sa אַלְמְנוּת חַיּוּת upang hindi mapagkamalang “habambuhay” ang “buhay pa.”
