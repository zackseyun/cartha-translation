- from: Si Yoab ang namuno sa buong hukbo ng Israel, at si Benaya na anak ni Yehoyada ang namuno sa mga Kari[a] at sa mga Peleteo.
  to: Si Yoab ang namamahala sa buong hukbo ng Israel, at si Benaya na anak ni Yehoyada ang namamahala sa mga Kereteo[a] at sa mga Peleteo.
  rationale: Pinalitan ang hindi pangkaraniwang «Kari» ng «Kereteo,» na tumutugma sa pangunahing transliterasyong Cherethites sa audit trail at sa karaniwang pagkilala sa pangkat. Inayos din ang pananalita upang ilarawan ang katungkulang administratibo, hindi isang natapos na gawa. Iningatan ng talababa ang leksikal na pag-aalinlangan.
