base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: tl
  text: Si Yoab ang namamahala sa buong hukbo ng Israel, at si Benaya na anak ni Yehoyada ang namamahala sa mga Kereteo[a] at sa mga Peleteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “mga Kereteo.” Hindi tiyak ang eksaktong transliterasyon ng pangalan ng pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Si Yoab
  rationale: Isinalin ang pang-ugnay ayon sa likas na daloy ng isang talaan ng mga opisyal, nang hindi nagdaragdag ng tahasang panandang temporal. Ang יוֹאָב ay tinumbasan sa makabagong transliterasyong Tagalog na “Yoab.”
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: ang namuno sa buong hukbo ng Israel
  rationale: Sa pariralang nominal na ito, ang אֶל ay nagsasaad ng saklaw ng kapangyarihan o pamumuno. Ang צָבָא rito ay organisadong hukbong militar, at pinananatili ng “buong” ang כָּל.
- source_word: וּ/בְנָיָה֙ בֶּן יְה֣וֹיָדָ֔ע
  choice: at si Benaya na anak ni Yehoyada
  rationale: Pinanatili ang ugnayang ama-anak at ginamit ang malinaw na makabagong transliterasyon ng mga pangalang Hebreo.
- source_word: עַל ה/כרי
  choice: ang namuno sa mga Kari[a]
  rationale: Ang עַל sa talaan ng mga tungkulin ay nagpapahayag ng pamamahala. Dahil כרי ang anyong nasa ibinigay na tekstong Hebreo, transliterasyon ang ginamit sa pangunahing teksto sa halip na tahimik itong palitan ng mas karaniwang anyong “Kereteo.”
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: at sa mga Peleteo
  rationale: Ang ikalawang עַל ay kaagapay ng una at nakikibahagi sa pandiwang “namuno.” Ginawang maramihan sa Tagalog ang kolektibong katawagan sa pangkat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namuno sa” para sa pormulang administratibo at ang “hukbo” para sa puwersang militar. Pinanatili sa talababa ang tunay na tekstuwal o leksikal na pag-aalinlangan sa כרי.
