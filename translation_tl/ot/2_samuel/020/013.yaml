base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: tl
  text: Nang maialis na siya mula sa pangunahing daan[a], nagpatuloy ang lahat ng tauhan sa pagsunod kay Joab upang tugisin si Seba na anak ni Bicri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa daan” o “mula sa lansangan.” Ang salitang Hebreo ay maaaring tumukoy sa isang pangunahing daan o nakaangat na lansangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Nang ... na
  rationale: Ipinakikita ang temporal na ugnayan at ang agarang pagpapatuloy ng mga tauhan matapos maalis ang sagabal; natural ito sa makabagong salaysay sa Filipino.
- source_word: הֹגָה
  choice: maialis na siya
  rationale: Ang Hophal na anyo ay pasibo at nagsasaad na ipinaalis o inalis ang tinutukoy; ang panghalip na “siya” ay tumutukoy kay Amasa ayon sa naunang talata, nang hindi tahasang idinaragdag ang “bangkay” na wala sa mismong sugnay.
- source_word: מִן הַמְסִלָּה
  choice: sa pangunahing daan
  rationale: Ang מְסִלָּה ay maaaring tumukoy sa lansangan, pangunahing daan, o nakaangat na daan. Ang “pangunahing daan” ay malinaw at natural sa konteksto ng dinaraanan ng hukbo.
- source_word: עָבַר
  choice: nagpatuloy
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa na muling umusad ang mga tauhan nang maalis ang sagabal, hindi lamang na nilampasan nila iyon.
- source_word: כָּל אִישׁ
  choice: ang lahat ng tauhan
  rationale: Kolektibong tumutukoy ito sa bawat lalaking kabilang sa puwersang militar. Ang “mga tauhan” ay natural at tumpak sa konteksto nang hindi ginagawang pangkalahatan ang tinutukoy.
- source_word: אַחֲרֵי יוֹאָב
  choice: sa pagsunod kay Joab
  rationale: Ipinahahayag ang paglakad nila kasunod ni Joab bilang pinuno; mas likas ito sa Filipino kaysa sa literal na “sa likuran ni Joab.”
- source_word: לִרְדֹּף
  choice: upang tugisin
  rationale: Ang pawatas ay nagsasaad ng layunin, at ang “tugisin” ay angkop sa seryosong kontekstong militar.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: si Sheba na anak ni Bicri
  rationale: Pinananatili ang patronimikong anyo ng pangalang Hebreo sa natural na sintaks ng Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangunahing daan” upang maipakita ang mas tiyak na diwa ng מְסִלָּה, habang inilagay sa talababa ang mga mas pangkalahatang alternatibo. Pinanatili ang panghalip na “siya” upang hindi magdagdag sa teksto ng tahasang salitang “bangkay,” bagaman malinaw sa konteksto na si Amasa ang tinutukoy.
