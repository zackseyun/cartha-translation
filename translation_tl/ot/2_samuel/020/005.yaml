  yaml_path: translation/ot/2_samuel/020/005.yaml
  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: tl
  text: Kaya umalis si Amasa upang tipunin ang Juda[a], ngunit nahuli siya nang lampas sa itinakdang panahong itinakda ni David para sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipatawag ang Juda.” Ang pandiwang Hebreo ay maaaring tumukoy sa apurahang pagtawag upang magkatipon; sa kontekstong ito, malamang na kabilang dito ang pagpapakilos sa mga mandirigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Karaniwang salaysay na anyo ng הלך; natural sa makabagong Filipino at ipinahihiwatig na nagtungo siya upang gawin ang iniutos.
- source_word: לְהַזְעִיק
  choice: upang tipunin
  rationale: Ang Hiphil ng זעק ay tumutukoy sa apurahang pagtawag upang magkatipon. Ang “tipunin” ay malinaw at hindi labis na nagtatakda na militar lamang ang pagtitipon.
- source_word: אֶת יְהוּדָה
  choice: ang Juda
  rationale: Kolektibong tinutukoy ng pangalang Juda ang mga mamamayan o kalalakihan ng Juda; pinananatili ng salin ang maikling anyo ng Hebreo.
- source_word: וייחר
  choice: lumampas siya
  rationale: Sa kontekstong may kasunod na מִן, ang אחר ay nangangahulugang nahuli o lumampas sa takdang oras.
- source_word: מִן הַמּוֹעֵד
  choice: sa itinakdang panahon
  rationale: Ang מוֹעֵד ay isang takda o itinakdang oras; kasama ng “lumampas,” natural nitong ipinapahayag na hindi nasunod ang taning.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: ibinigay sa kanya ni David
  rationale: Ang יעד ay pagtatakda ng panahon, at ang panlalaking isahang paksa ay natural na tumutukoy kay David sa naunang talata. Ginawang tahasan ang reperente upang maiwasan ang malabong panghalip sa Filipino.
