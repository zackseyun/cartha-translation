translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Juda” bilang kolektibong pangalan, gaya ng Hebreo, at iniwasang gawing tahasang militar ang pangunahing teksto. Ang “panahon” ay mas angkop dito kaysa “oras” dahil tatlong araw ang takdang binanggit sa naunang talata.
