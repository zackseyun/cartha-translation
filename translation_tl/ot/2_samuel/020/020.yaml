  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: tl
  text: Sumagot si Joab at sinabi, “Malayong mangyari sa akin, malayong mangyari, na ako'y lumamon o manira!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Sumagot si Joab
  rationale: Ang dalawang Hebreong pandiwa ay karaniwang pormula sa pagsagot. Sa natural na modernong Tagalog, sapat na ang “Sumagot si Joab” at hindi kailangang ulitin ang diwang “at sinabi.”
- source_word: חָלִילָה חָלִילָה לִי
  choice: Hinding-hindi ko gagawin iyon!
  rationale: Ipinahahayag ng dobleng חָלִילָה ang mariin at ganap na pagtanggi. Pinananatili ng “hinding-hindi” ang pag-uulit at diin sa natural na Tagalog.
- source_word: אֲבַלַּע
  choice: lulunukin
  rationale: Pinananatili ang matingkad na larawan ng ugat na בלע, “lumunok,” na ginagamit dito bilang talinghaga sa paglamon o pagsakop sa lungsod.
- source_word: וְאִם אַשְׁחִית
  choice: o lilipulin
  rationale: Sa konteksto ng pagkubkob, malinaw na ipinapahayag ng “lilipulin” ang Hiphil ng שׁחת, ang pagwasak o pagdala sa kapahamakan. Ang “o” ay natural na nag-uugnay sa dalawang mariing itinatangging kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hinding-hindi” upang likas na maipakita ang dobleng pagtanggi, habang pinanatili ang matingkad na larawang “lulunukin.”
