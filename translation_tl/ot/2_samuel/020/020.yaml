    rationale: Walang hayag na layon ang dalawang pandiwa sa Hebreo. Maaaring ipahiwatig ng konteksto ang bayan/lungsod, ngunit ang pagdaragdag nito sa teksto ay nagpapaliit sa iniwang di-tiyak na saklaw ng orihinal.
  - severity: low
