    rationale: Ang “Hinding-hindi ko gagawin iyon” ay tama ang pangkalahatang diwa, ngunit mas malapit ang “Malayong mangyari sa akin, malayong mangyari” sa personal at inuulit na mariing pagtatakwil sa Hebreo.
  revised_text: Sumagot si Joab at sinabi, “Malayong mangyari sa akin, malayong mangyari, na ako'y lumamon o manira!”
