  verdict: revise
  source_fidelity: Ang “lungsod” ay hindi nakasaad sa Hebreo. Bagaman ito ay mauunawaan mula sa malawak na konteksto ng pagkubkob, hindi ito dapat idagdag sa pangunahing teksto. Ang “Hinding-hindi ko gagawin iyon” ay naipahahayag ang pagtanggi ngunit hindi gaanong pinananatili ang idyomang “malayo sa akin” at ang dobleng diin ng חָלִילָה.
  naturalness: Ang “Malayong mangyari sa akin” ay isang malinaw at marangal na idyomang Tagalog para sa mariing pagtatakwil. Ang pag-uulit nito ay may sinadyang bigat, na tumutugma sa Hebreo.
  terminology: Pinananatili ang “lumamon” bilang matingkad na katumbas ng בלע nang walang pagdaragdag ng layon. Ang “manira” ay tuwiran at malawak na katumbas ng Hiphil ng שׁחת; hindi nito ipinipilit ang partikular na layon na “lungsod.”
  issues:
