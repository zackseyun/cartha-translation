base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: tl
  text: Dumaan siya sa mga lupain ng lahat ng lipi ng Israel patungong Abel at Bet-maaca. Nagtipon ang lahat ng Berita[a] at sumunod din sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng Berita.” Ang ibang salin ay may “lahat ng Bicrita,” na iniuugnay ang pangkat kay Sheba na anak ni Bicri batay sa konteksto; ngunit mas tuwirang sinusuportahan ng tekstong Masoretiko rito ang “Berita.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin, “at dumating din silang kasunod niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Dumaan siya
  rationale: Ang pandiwang עבר sa anyong pasalaysay ay tumutukoy sa pagdaan o pagtahak sa mga lupain. Pinananatili ang panghalip na “siya” dahil hindi inuulit ng Hebreo ang pangalan ng tauhan sa talatang ito.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: sa mga lupain ng lahat ng lipi ng Israel
  rationale: Ang בְּ ay lokatibo o distributibo rito. Idinagdag ang “mga lupain” upang maging malinaw sa natural na Tagalog na ang pagdaan ay sa mga nasasakupan ng mga lipi, hindi sa mga taong bumubuo sa mga lipi.
- source_word: אָבֵלָה
  choice: hanggang sa Abel
  rationale: Ang hulaping directional he ay nagpapahiwatig ng patungong direksiyon. Ginamit ang karaniwang anyong “Abel” ng pangalang-lugar.
- source_word: וּבֵית מַעֲכָה
  choice: at Bet-maaca
  rationale: Pangalan ito ng lugar, kaya hindi isinaling literal na “bahay ni Maaca.” Pinanatiling magkahiwalay ang Abel at Bet-maaca ayon sa tahasang anyo ng tekstong Masoretiko.
- source_word: וְכָל הַבֵּרִים
  choice: ang lahat ng Berita
  rationale: Ang tekstong Masoretiko ay higit na tuwirang tumutukoy sa isang pangkat na “mga Berita.” Ginamit ang transliteradong katawagan upang hindi ipasok sa pangunahing teksto ang kontekstuwal na pagbasa na “mga Bicrita.”
- source_word: וַיִּקָּהֲלוּ
  choice: Nagtipon
  rationale: Ipinapahayag ng pandiwa ang sama-samang pagtitipon ng pangkat; natural at maikli ang “nagtipon” sa modernong Tagalog.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: at sumunod din sa kanya
  rationale: Bagaman literal na “dumating/pumaroon din sa likuran niya,” ipinahihiwatig ng idyoma sa konteksto ang pagsama at pagsunod sa kanyang pagkilos. Isinasalin ng “din” ang אַף.
theological_decisions:
- issue: Hindi pinangalanang paksa ng וַיַּעֲבֹר
  choice: Pinanatili ang “siya” nang hindi tinukoy ang pangalan.
  alternative: Tukuyin sa salin bilang “si Sheba” o “si Joab.”
  rationale: Hindi tahasang inuulit ng Hebreo ang pangalan sa talatang ito. Ang paglalagay ng pangalan ay magpapasya sa isang sangguniang kailangang matukoy mula sa konteksto, kaya pinanatili ang pormal na kalabuan ng pinagmulan.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “Bet-maaca” at “Berita” bilang madaling basahing transliterasyon sa Tagalog. Ang dalawang pangungusap ay nagpapalinaw sa pagbabago ng paksa nang hindi nagdaragdag ng pangalang wala sa Hebreo.
