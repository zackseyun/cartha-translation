base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: tl
  text: At isang matalinong babae ang sumigaw mula sa lungsod, “Makinig kayo! Makinig kayo! Pakisabi ninyo kay Joab, ‘Lumapit ka rito upang makausap kita.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: isang matalinong babae
  rationale: Tuwirang inilalarawan ang babae bilang may karunungan; natural at malinaw ito sa modernong Filipino.
- source_word: וַתִּקְרָא
  choice: ang sumigaw
  rationale: Sa tagpong tumatawag siya mula sa lungsod patungo sa hukbo sa labas, mas angkop ang malakas na ‘sumigaw’ kaysa sa di-tiyak na ‘tumawag.’
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Makinig kayo! Makinig kayo!
  rationale: Pinananatili ang pag-uulit at ang pangmaramihang pautos, na nakatuon muna sa mga taong makakarinig at makapaghahatid ng mensahe.
- source_word: אִמְרוּ נָא אֶל יוֹאָב
  choice: Pakisabi kay Joab
  rationale: Ang נָא ay magalang na pakiusap; natural itong naipapahayag ng ‘paki-’ nang hindi dinaragdagan ang diwa.
- source_word: קְרַב עַד הֵנָּה
  choice: Lumapit ka rito
  rationale: Natural na Filipino para sa utos na lumapit hanggang sa kinaroroonan ng nagsasalita.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: upang makausap kita
  rationale: Ipinahahayag ang layuning personal na magsalita kay Joab; ang ‘makausap’ ay natural at hindi nagpapahiwatig ng nilalaman ng usapan.
