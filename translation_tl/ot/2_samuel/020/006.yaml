base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: tl
  text: Sinabi ni David kay Abisai, “Ngayon, mas malaking pinsala ang gagawin sa atin ni Seba na anak ni Bicri kaysa kay Absalom. Ikaw, isama mo ang mga tauhan ng iyong panginoon at habulin mo siya, baka makahanap siya ng mga lungsod na pinatibay at makatakas sa ating paningin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at iligtas/agawin ang ating mga mata,” isang idyomang nangangahulugang makatakas sa ating paningin o makaiwas sa atin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: mas malaking pinsala ang gagawin sa atin
  rationale: Ipinahahayag ng pandiwa rito ang pagdudulot ng pinsala o kaguluhan, hindi ang abstraktong kasamaan; pinananatili rin ng “mas malaking” ang paghahambing kay Absalom.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba na anak ni Bicri
  rationale: Isinalin sa karaniwang anyong Tagalog ang mga pangalang pantangi, habang malinaw na pinananatili ang ugnayang ama-anak.
- source_word: מִן אַבְשָׁלוֹם
  choice: kaysa kay Absalom
  rationale: Likas na ipinapahayag sa Tagalog ng “kaysa kay” ang paghahambing na dala ng pang-ukol na מִן.
- source_word: אַתָּה קַח
  choice: Ikaw, isama mo
  rationale: Pinananatili ng tahasang “Ikaw” ang diin sa utos ni David kay Abisai. Sa konteksto, ang pagkuha sa mga tauhan ay nangangahulugang isama sila sa pagtugis.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: mga tauhan ng iyong panginoon
  rationale: Ang “mga tauhan” ay natural sa kontekstong militar at hindi labis na nagpapakahulugan sa katayuan nila; pinananatili ng “iyong panginoon” ang hirarkikong pananalita at ang ikalawang panauhang panlapi.
- source_word: וּרְדֹף אַחֲרָיו
  choice: at habulin mo siya
  rationale: Ang רדף ay tumutukoy sa militar na pagtugis. Ang “habulin” ay malinaw at likas na modernong Tagalog.
- source_word: פֶּן
  choice: baka
  rationale: Ipinapahayag ng “baka” ang kinatatakutang maaaring mangyari, na siyang tungkulin ng פֶּן sa pangungusap.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: makapunta siya sa mga napapaderang lungsod
  rationale: Bagaman literal na “makatagpo/makahanap para sa sarili,” ang parirala sa konteksto ay tumutukoy sa pag-abot at pagkakaroon niya ng kanlungan sa mga lungsod na may depensa. Iniiwasan ng salin ang di-likas na “makahanap para sa sarili” nang hindi ginagawang tiyak na pagkamkam ang kahulugan.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: at makatakas sa ating paningin
  rationale: Natural itong katumbas ng idyomang Hebreo na literal na may larawan ng “pagligtas/pag-agaw sa ating mga mata,” ibig sabihin ay makaiwas o mawala sa paningin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga tauhan” para sa kontekstong militar, “napapaderang lungsod” para sa mga lungsod na may depensa, at “baka” bilang natural na pahayag ng pangamba. Inilagay ang talababa pagkatapos ng idyomang ipinaliliwanag nito.
