base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari kay Amasa, “Tipunin mo para sa akin ang mga lalaki ng Juda[a] sa loob ng tatlong araw, at ikaw naman ay manatili rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pananalitang isinaling “mga lalaki ng Juda” ay isang panlalaking kolektibong katawagan. Malamang na tumutukoy ito sa mga lalaking maaaring tipunin upang lumaban, ngunit hindi tahasang sinasabi sa mismong pananalita na sila ay “mga mandirigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa makabagong Filipino ang “Pagkatapos” bilang panandang pasalaysay.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan na tumutukoy kay David sa konteksto, nang hindi pinapalitan ng pangalang pantangi.
- source_word: הַזְעֶק
  choice: Tipunin mo
  rationale: Ang Hiphil imperative ng זעק ay nagpapahiwatig ng pagpapatawag o pagmomobilisa upang magkatipon; malinaw at natural dito ang “tipunin.”
- source_word: לִי
  choice: para sa akin
  rationale: Ipinahihiwatig ng datibo na ang pagtitipon ay gagawin para sa kapakanan o atas ng hari.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: ang mga lalaki ng Juda
  rationale: Bagaman isahan sa anyo ang אִישׁ, kolektibo ang gamit nito. Pinananatili ng “mga lalaki ng Juda” ang panlalaking kolektibong pahayag nang hindi dinaragdag ang mas tiyak na “mga mandirigma.”
- source_word: שְׁלֹשֶׁת יָמִים
  choice: sa loob ng tatlong araw
  rationale: Sa konteksto ng utos, nagsasaad ito ng palugit o takdang panahon, hindi ng tagal ng pagkilos.
- source_word: וְאַתָּה
  choice: at ikaw naman
  rationale: Pinananatili ang tahasang panghalip at diin dito; ang “naman” ay natural na nagpapakita ng paglipat ng utos kay Amasa nang hindi nagpapasok ng labis na pagsalungat.
- source_word: פֹּה
  choice: rito
  rationale: Natural na deiktikong pang-abay sa Filipino para sa lugar na malapit sa nagsasalita.
- source_word: עֲמֹד
  choice: manatili
  rationale: Bagaman literal na “tumayo,” ang pandiwa rito ay utos na huwag umalis at manatili sa lugar; mas natural at kontekstuwal ang “manatili.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rito” at “manatili” para sa natural na utos ng hari, habang pinanatili sa talababa ang di-tiyak na saklaw ng kolektibong אִישׁ יְהוּדָה.
