base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: tl
  text: Ngunit hindi nag-ingat si Amasa sa espadang nasa kamay ni Joab. Sinaktan siya ni Joab nito sa tiyan[a], at tumapon sa lupa ang kanyang mga bituka. Hindi na siya muling sinaktan ni Joab, at namatay siya. Pagkatapos, hinabol ni Joab at ng kapatid niyang si Abisai si Seba na anak ni Bicri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ikalimang tadyang.” Ganito ito tradisyonal na isinasalin, ngunit sa kontekstong ito, mas malamang na tumutukoy ang salitang Hebreo sa tiyan o sa bahagi ng tiyan sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: hindi nag-ingat
  rationale: Ipinahahayag ng Niphal dito ang hindi pagiging mapagbantay ni Amasa sa sandatang hawak ni Joab. Natural at malinaw sa modernong Filipino ang “hindi nag-ingat.”
- source_word: חֶרֶב
  choice: espada
  rationale: Karaniwang katumbas ito ng salitang Hebreo at angkop sa sandatang tinutukoy sa salaysay.
- source_word: בְּיַד יוֹאָב
  choice: nasa kamay ni Joab
  rationale: 'Kongkreto at lokatibo ang parirala: hawak ni Joab ang espada.'
- source_word: וַיַּכֵּהוּ בָהּ
  choice: Sinaksak siya ni Joab nito
  rationale: Malawak ang kahulugan ng נכה na “hampasin/saktan,” ngunit sa konteksto ng espada, sugat sa tiyan, at paglabas ng mga bituka, malinaw at natural sa Filipino ang “sinaksak.”
- source_word: אֶל הַחֹמֶשׁ
  choice: sa tiyan
  rationale: Sa mga salaysay na ito sa Samuel, malamang na tumutukoy ang חֹמֶשׁ sa bahagi ng tiyan o abdomen, hindi sa isang tiyak na tadyang.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: tumapon sa lupa ang kanyang mga bituka
  rationale: Pinananatili nito ang tahasan at marahas na larawan ng tekstong Hebreo sa paraang nauunawaan at hindi kolokyal.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Hindi na siya muling sinaktan ni Joab
  rationale: Literal na hindi “inulit” ni Joab ang ginawa sa kanya; nililinaw ng salin ang ipinahihiwatig na ikalawang pananakit nang hindi dinaragdagan ang detalye.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Payak nitong pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: רָדַף אַחֲרֵי
  choice: hinabol
  rationale: Natural na salitang Filipino para sa pagtugis sa isang tumatakas na kaaway.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba na anak ni Bicri
  rationale: Isinalin ang ugnayang pampamilya at ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang tahasang karahasan ng salaysay nang hindi gumagamit ng sobrang kolokyal o masagwang pananalita. Inilagay ang talababa sa “tiyan,” ang salitang may tunay na alternatibong leksikal.
