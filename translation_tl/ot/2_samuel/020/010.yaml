  to: Ngunit hindi nag-ingat si Amasa sa espadang nasa kamay ni Joab. Sinaktan siya ni Joab nito sa tiyan[a], at tumapon sa lupa ang kanyang mga bituka. Hindi na siya muling sinaktan ni Joab, at namatay siya. Pagkatapos, hinabol ni Joab at ng kapatid niyang si Abisai si Seba na anak ni Bicri.
