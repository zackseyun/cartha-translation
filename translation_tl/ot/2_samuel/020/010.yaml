  source_fidelity: Kailangang iwasan ang “sinaksak,” dahil ang וַיַּכֵּהוּ ay pangkalahatang “sinaktan/hinampas” at hindi tahasang tumutukoy sa pagsaksak. Ang natitirang daloy—kawalan ng pagbabantay, sugat sa tiyan, paglabas ng mga bituka, kawalan ng ikalawang pananakit, kamatayan, at pagtugis—ay tapat sa Hebreo.
  naturalness: Malinaw at marangal ang modernong Filipino. Ang “Sinaktan siya ni Joab nito sa tiyan” ay natural na sapat sa konteksto at mas maingat kaysa “sinaksak.”
  terminology: Ang “espada,” “tiyan,” “bituka,” “Abisai,” “Seba,” at “Bicri” ay angkop. Ang talababa sa “tiyan” ay wastong inilagay para sa pinagtatalunang kahulugan ng חֹמֶשׁ.
  issues:
