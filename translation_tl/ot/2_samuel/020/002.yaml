  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: tl
  text: Kaya umalis[a] sa pagsunod kay David ang bawat lalaki ng Israel[b] at sumunod kay Seba na anak ni Bicri. Ngunit kumapit nang mahigpit sa kanilang hari ang mga lalaki ng Juda, mula sa Ilog Jordan hanggang Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umakyat” o “umahon.” Dito, ginamit ang salita sa diwang pag-alis upang sumunod sa ibang pinuno.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bawat lalaki ng Israel,” isang panlalaking kolektibong pananalita na tumutukoy sa mga lalaking Israelita bilang isang pangkat.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעַל
  choice: umalis
  rationale: Ang pangunahing diwa ng pandiwang עלה ay “umakyat” o “umahon,” ngunit sa salaysay na ito ay tumutukoy ito sa pag-alis ng mga lalaki ng Israel mula sa panig ni David. Ang “umalis” ay likas sa modernong Tagalog nang hindi ipinapalagay ang tiyak na direksiyon ng kanilang paglalakbay.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ang bawat lalaki ng Israel
  rationale: Pinananatili nito ang distributibong anyo at panlalaking katawagan ng Hebreo. Ipinaliliwanag sa talababa na kolektibo ang pahayag.
- source_word: מֵאַחֲרֵי דָוִד ... אַחֲרֵי שֶׁבַע
  choice: sa pagsunod kay David ... sumunod kay Sheba
  rationale: Ang pag-uulit ng אַחֲרֵי ay nagpapakita ng paglipat ng pagsunod o pagkampi mula kay David patungo kay Sheba. Pinananatili ng salin ang pandiwang “sumunod” sa dalawang bahagi.
- source_word: וְאִישׁ יְהוּדָה
  choice: Ngunit ... ang mga lalaki ng Juda
  rationale: Bagaman nasa anyong isahan ang Hebreo, kolektibo ang kahulugan. Ang “Ngunit” ay likas na nagpapahayag ng malinaw na kaibahan sa pagtalikod ng Israel.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: kumapit nang mahigpit sa kanilang hari
  rationale: Pinananatili nito ang kongkretong talinghaga ng דבק, “dumikit” o “kumapit,” kasama ang pahiwatig ng matatag na katapatan, sa halip na palitan iyon ng ganap na interpretatibong “nanatiling tapat.”
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלִָם
  choice: mula sa Jordan hanggang Jerusalem
  rationale: Tuwirang inilalahad ang saklaw ng paglalakbay o patuloy na pagsama sa hari, nang walang dagdag na diin na wala sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa pagbabago ng katapatan ng Israel
  choice: Pinanatili ang magkatugmang “sa pagsunod kay David” at “sumunod kay Sheba.”
  alternative: Isalin bilang “tumalikod kay David at pumanig kay Sheba.”
  rationale: Mas malinaw ang alternatibo tungkol sa pagtataksil, ngunit higit itong interpretatibo. Ang napiling anyo ay nagpapanatili sa larawan ng Hebreo tungkol sa pagsunod sa isang pinuno nang hindi pinapahina ang malinaw na paglipat ng pagkampi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang konkretong larawan ng mahigpit na pagkapit at ang panlalaking kolektibong pananalita ng Hebreo; nilinaw lamang sa talababa ang mga ito.
