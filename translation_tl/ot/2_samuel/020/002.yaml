    rationale: Ang “Sheba” ay anyong Ingles samantalang ang “Bicri” ay karaniwang anyong Tagalog. Ang “Seba, anak ni Bicri” ay mas likas at mas konsistent sa modernong Tagalog na tradisyong biblikal.
  - severity: low
    issue: Maaaring linawin ang pangalang heograpikal na Jordan.
    rationale: Ang “Ilog Jordan” ay mas natural sa Tagalog at tuwirang tumutukoy sa ilog na nasa Hebreong הַיַּרְדֵּן.
