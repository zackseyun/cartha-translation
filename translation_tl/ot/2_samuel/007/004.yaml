  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: tl
  text: 'Ngunit nang gabing iyon, dumating kay Natan ang salita ni Yahweh:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ngunit ... dumating
  rationale: Ang unang וַיְהִי ay nagsusulong ng salaysay. Ang “Ngunit” ay likas sa Filipino at ipinakikita ang pagsalungat sa naunang pagsang-ayon ni Natan, samantalang ang pandiwang “dumating” ay inilalapat sa pangunahing pormulang sumusunod.
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Likas na salin sa Filipino ng tiyak na pariralang temporal na literal na “sa gabing iyon.”
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: dumating ... ang salita ni Yahweh
  rationale: Pinananatili ang karaniwang pormulang propetiko at ang bigat ng “salita,” habang ginagamit ang likas na pandiwang Filipino para sa pahayag na tinanggap ng propeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל נָתָן
  choice: kay Natan
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong tumatanggap ng salita; “Natan” ang anyong mas malapit sa pangalang Hebreo נָתָן.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitibong ito ay nagpapakilala sa mismong sasabihin sa susunod na talata. Sa modernong Filipino, sapat at mas natural ang tutuldok kaysa sa tahasang “na sinasabi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin pinipili ang mas huling anyong “Jehova.”
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Ngunit” upang ihayag ang kontekstuwal na pagsalungat sa payo ni Natan sa naunang talata. Isinalin ang Nathan bilang “Natan,” na mas tuwirang umaayon sa Hebreo at karaniwang anyo sa Filipino. Walang talababa sapagkat walang mahalagang tekstuwal o semantikong kalabuan na kailangang ilahad sa mambabasa.
