base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: tl
  text: At ang iyong sambahayan[b] at ang iyong kaharian ay pagtitibayin magpakailanman sa harap mo[a]; ang iyong trono ay itatatag magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa harap mo”; “sa harap ko” ang mababasa sa ilang sinaunang saksi sa teksto.'
    reason: textual_variant
  - marker: b
    text: Ang “sambahayan” dito ay malamang na tumutukoy sa maharlikang angkan ni David—samakatuwid, sa kaniyang dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: ay magiging matatag
  rationale: Ang Niphal ng אמן ay nagpapahayag ng pagiging tiyak, matibay, at namamalagi. Natural sa modernong Filipino ang “magiging matatag” at hindi nito inuulit nang eksakto ang pananalita sa hulihan.
- source_word: בֵּיתְךָ
  choice: iyong sambahayan
  rationale: Sa kontekstong maharlika, ang בַּיִת ay tumutukoy sa sambahayan o angkan ni David, lalo na sa kaniyang dinastiya, hindi lamang sa isang gusali. Pinananatili ng “sambahayan” ang talinghaga; nililinaw sa talababa ang dinastikong diwa.
- source_word: וּמַמְלַכְתְּךָ
  choice: at ang iyong kaharian
  rationale: Tuwirang ipinahahayag ng מַמְלָכָה ang kaharian o paghahari; “kaharian” ang malinaw at likas na katumbas sa kontekstong ito.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag ng parirala ang walang hanggang pananatili. Pinananatili rin ang pag-uulit nito sa talata bilang pagbibigay-diin.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: 'Ang ibinigay na tekstong Hebreo ay nasa ikalawang panauhang panlalaki: “sa harap mo.” Pinananatili ito sa pangunahing teksto, habang inilalagay sa talababa ang mahalagang variant na “sa harap ko.”'
- source_word: כִּסְאֲךָ
  choice: iyong trono
  rationale: Ang כִּסֵּא ay literal na luklukan ng hari at metonimiya rin para sa paghahari; “trono” ang karaniwan at malinaw na salin.
- source_word: יִהְיֶה נָכוֹן
  choice: ay mananatiling matatag
  rationale: Ipinahahayag ng היה נָכוֹן ang pagiging matibay at tiyak. Ang “mananatiling matatag” ay likas sa Filipino at naihihiwalay nang bahagya sa naunang וְנֶאְמַן.
theological_decisions:
- issue: Ang pangakong dinastiko at ang posibleng mesiyanikong kabuluhan nito
  choice: Pinanatili ang mga larawang “sambahayan,” “kaharian,” at “trono” nang hindi tahasang isinasalin ang mga ito bilang mesiyanikong katuparan.
  alternative: Isalin ang “sambahayan” bilang “dinastiya,” o gawing tahasan sa teksto ang mesiyanikong pagbasa.
  rationale: Sa agarang konteksto, ang pangako ay tungkol sa maharlikang angkan ni David. Maaaring makita rito ang mas malawak na mesiyanikong kabuluhan, ngunit hindi iyon dapat idagdag sa mismong salin nang lampas sa sinasabi ng Hebreo.
- issue: Pagkakaiba ng teksto sa לְפָנֶיךָ
  choice: “sa harap mo” sa pangunahing teksto
  alternative: “sa harap ko”
  rationale: Ang ibinigay na WLC text ay nagbabasa ng “sa harap mo,” kaya iyon ang pinagmulan ng pangunahing salin. Gayunman, mahalaga at angkop sa konteksto ang pagbasa ng ilang saksi na “sa harap ko,” kaya pinanatili ito sa talababa nang hindi tahimik na nilulutas ang variant.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” sa halip na ang mas malabong “bahay” upang maipahiwatig ang angkan nang hindi lubusang pinapalitan ng paliwanag na “dinastiya.”
