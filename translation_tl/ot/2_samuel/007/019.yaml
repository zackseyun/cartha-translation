  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: tl
  text: At ito man ay maliit na bagay pa sa paningin mo, O Panginoong DIYOS; nagsalita ka rin tungkol sa sambahayan[a] ng iyong lingkod ukol sa malayong hinaharap[b]. At ito ang turo para sa tao[c], O Panginoong DIYOS.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay,” na maaari ring mangahulugang sambahayan, angkan, o dinastiya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hanggang sa malayo”; dito ay tumutukoy sa panahong malayo pa sa hinaharap.
    reason: lexical_alternative
  - marker: c
    text: Mahirap unawain ang Hebreo ng huling parirala. Maaari rin itong isalin na “ito ang saligang tuntunin para sa sangkatauhan,” “ito ang kautusan o kaugalian ng tao,” o “ito ang turo tungkol sa sangkatauhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת
  choice: At maging ito ay maliit na bagay pa
  rationale: Pinananatili ang diwa ng קטן, “maging maliit,” at ng עוֹד זֹאת, “maging ito pa,” nang hindi pinalalabis ang pahiwatig na hindi sapat ang naunang pangako.
- source_word: בְּעֵינֶיךָ
  choice: sa paningin mo
  rationale: Likas na katumbas sa Filipino ng Hebreong idyoma para sa pagtataya o pagtingin.
- source_word: אֲדֹנָי יְהוִה
  choice: O Panginoong DIYOS
  rationale: Ginagamit ang nakaugaliang anyo para sa tambalang banal na titulo at iniiwasan ang paulit na “Panginoong PANGINOON.” Idinagdag ang “O” bilang likas na panawag sa Filipino.
- source_word: וַתְּדַבֵּר גַּם אֶל
  choice: nagsalita ka rin tungkol sa
  rationale: Sa konteksto, ang sinabi ng Diyos ay may kinalaman sa sambahayan ni David; malinaw at natural dito ang “tungkol sa.”
- source_word: בֵּית עַבְדְּךָ
  choice: sambahayan ng iyong lingkod
  rationale: Ipinahahayag ng “sambahayan” ang בית bilang pamilya o angkan habang pinananatili sa talababa ang posibleng dinastikong kahulugan.
- source_word: לְמֵרָחוֹק
  choice: para sa malayong hinaharap
  rationale: Ang literal na ideya ng kalayuan ay tumutukoy rito sa panahong darating.
- source_word: תּוֹרַת
  choice: turo
  rationale: Ang תּוֹרָה ay maaaring tumukoy sa turo, tagubilin, tuntunin, o kautusan. Mas malawak ang “turo” at hindi nito agad nililimitahan ang mahirap na parirala sa isang legal na kodigo.
- source_word: הָאָדָם
  choice: para sa tao
  rationale: Pinananatili ang payak na kahulugan ng אָדָם, habang inilalahad sa talababa ang posibleng kolektibong kahulugang “sangkatauhan” at iba pang ugnayang sintaktiko.
theological_decisions:
- issue: Kahulugan ng mahirap na pariralang וְזֹאת תּוֹרַת הָאָדָם
  choice: At ito ang turo para sa tao
  alternative: At ito ang saligang tuntunin para sa sangkatauhan; At ito ang kautusan o kaugalian ng tao; At ito ang turo tungkol sa sangkatauhan
  rationale: Hindi tiyak ang ugnayan ng תּוֹרַת at הָאָדָם at hindi rin tiyak kung indibidwal o kolektibo ang “tao.” Nanatiling malapit ang pangunahing teksto sa mga salitang Hebreo at hindi ipinapasok ang isang tiyak na dinastiko o mesiyanikong pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong larawang “sa paningin mo” at ang tunay na kalabuan ng huling parirala; iniwasan ang makalumang balangkas at ang pagpapasok ng denominasyonal na paliwanag.
