base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: tl
  text: At ngayon, loobin mo pong pagpalain ang sambahayan[b] ng iyong lingkod, upang manatili ito sa harap mo magpakailanman. Sapagkat ikaw, Panginoong Yahweh[a], ang nagsalita, at sa pamamagitan ng iyong pagpapala ay pagpapalain ang sambahayan ng iyong lingkod magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Panginoong Yahweh” ay kumakatawan sa Hebreong pinagsamang titulo at pangalan na Adonai YHWH.
    reason: alternative_reading
  - marker: b
    text: Ang “sambahayan” ay maaari ring tumukoy sa angkan o dinastiya ng lingkod sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: loobin mo pong pagpalain
  rationale: Ipinahahayag ng “loobin” ang kusang-loob at mapagbiyayang pagsang-ayon na hinihiling sa הוֹאֵל, habang ang “po” ay likas na nagpapakita ng magalang at mapakiusap na himig sa modernong Tagalog. Pinagsama ito sa infinitibong “pagpalain” upang maging natural ang pangungusap.
- source_word: בֵּית עַבְדְּךָ
  choice: ang sambahayan ng iyong lingkod
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay, sambahayan, o dinastiya. Mas natural sa Tagalog ang “sambahayan” kapag mga tao at ang nagpapatuloy na angkan ang tinutukoy, ngunit hindi nito ganap na nilulutas ang dynastikong pahiwatig.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: upang manatili ito sa harap mo magpakailanman
  rationale: Ang literal na diwang “maging ... sa harap mo” ay nangangahulugan ng patuloy na pag-iral. Ang “manatili” ay malinaw at natural, nang hindi idinaragdag ang mas tiyak na ideya ng pagiging ‘matatag.’
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili ang pagsasama ng titulong אֲדֹנָי at ng personal na pangalang יהוה. Ang pang-angkop sa “Panginoong” ay natural sa Tagalog.
- source_word: דִּבַּרְתָּ
  choice: ang nagsalita
  rationale: Tinutukoy ng perpektong anyo ang nauna at tiyak na pahayag ng Diyos na saligan ng panalangin ni David. Natural sa Tagalog ang hulmaing “ikaw ... ang nagsalita.”
- source_word: וּמִבִּרְכָתְךָ
  choice: at sa pamamagitan ng iyong pagpapala
  rationale: Ipinapakita nito ang pagpapala ng Diyos bilang pinagmulan o paraang nagdudulot ng pinagpalang kalagayan ng sambahayan.
- source_word: יְבֹרַךְ
  choice: pagpapalain
  rationale: Ang pasibong di-ganap na anyo ay angkop na isalin bilang hinaharap na pasibo sa konteksto ng panalangin at katiyakan.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, marangal, at malinaw na katumbas sa Tagalog ng walang hanggang pagpapatuloy sa kontekstong tipan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa “bahay” ni David
  choice: sambahayan
  alternative: bahay; angkan; dinastiya
  rationale: Sa konteksto, higit sa gusali ang tinutukoy at kasama ang nagpapatuloy na angkan ni David. Ang “sambahayan” ay natural ngunit sapat na malawak; nililinaw sa talababa ang dynastikong posibilidad upang hindi mawala ang sinadyang lawak ng בַּיִת.
- issue: Paglalahad sa אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS; Kataas-taasang PANGINOON
  rationale: Direktang pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo, habang isinasalin ang אֲדֹנָי bilang titulong “Panginoon.”
- issue: Lakas ng katiyakan sa huling sugnay
  choice: pagpapalain ... magpakailanman
  alternative: nawa’y pagpalain ... magpakailanman
  rationale: Ang יְבֹרַךְ ay pasibong imperfect at, matapos sabihing nagsalita na ang Diyos, ang sugnay ay natural na mababasa bilang tiyak na bunga ng kanyang pagpapala, hindi lamang panibagong kahilingan.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “po” sa pakiusap bilang likas na panandang-galang sa panalangin, ngunit iniwasan ang makaluma o labis na pormal na pananalita. Ang ayos ng mga sugnay ay nananatiling malapit sa Hebreo habang natural sa karaniwang mambabasa.
