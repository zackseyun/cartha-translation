  naturalness: Ang “pastulan ang aking bayang Israel” ay hindi gaanong likas sa modernong Tagalog kapag ang bayan ang tuwirang layon. Ang “magpastol sa aking bayang Israel” ay mas natural at pinananatili ang metapora. Ang pagpapanatili ng tanong bilang iisang pangungusap ay mas malinaw kaysa sa pag-uulit ng “Sinabi ko ba?”
  terminology: Ang “mga anak ni Israel,” “mga lipi ng Israel,” “magpastol,” at “sedro” ay angkop at walang idinagdag na doktrinal na pagpapakahulugan. Pinananatili ng talababa ang pagkakaiba ng Masoretikong teksto at ng parallel sa 1 Cronica.
