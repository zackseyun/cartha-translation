  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: tl
  text: 'Sa lahat ng dakong nilakaran ko sa gitna ng lahat ng anak ni Israel, may sinabi ba ako kailanman sa isa sa mga lipi ng Israel[a], na inutusan kong magpastol sa aking bayang Israel, na ganito: ‘Bakit hindi ninyo ako ipinagtayo ng bahay na yari sa sedro?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “isa sa mga lipi ng Israel.” Sa katulad na talata sa 1 Cronica 17:6 ay “mga hukom ng Israel,” na malamang na tumutukoy sa mga pinunong inatasang magpastol sa bayan.'
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: nilakaran ko
  rationale: Pinananatili ang kongkretong larawan ng paglakad at ang diwa ng pagkilos ng Diyos sa gitna ng kanyang bayan, sa halip na ipahiwatig ang pananatili sa isang tiyak na tahanan.
- source_word: בְּכָל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Sa lahat ng dakong ... sa gitna ng lahat ng mga anak ni Israel
  rationale: Ang “lahat ng dakong” ay likas na kaugnay ng larawan ng paglakad, samantalang ang “sa gitna ng” ay nagpapahayag ng presensiya ng Diyos sa kanyang bayan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal na pinananatili ang karaniwang Hebreong katawagan sa bayang nagmula kay Israel, ngunit sa anyong malinaw at mauunawaan sa modernong Tagalog.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: may sinabi ba ako kailanman
  rationale: Natural na Tagalog ito para sa mariing retorikal na tanong ng Hebreo at malinaw na nagpapahiwatig na walang gayong utos na ibinigay.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: alinman sa mga lipi ng Israel
  rationale: Tapat itong sumusunod sa tekstong Masoretiko, na bumabasa ng “mga lipi,” habang ang “alinman” ay angkop sa saklaw ng negatibong retorikal na tanong.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: na inutusan kong pastulan
  rationale: Pinananatili ng “pastulan” ang metaporang pastoral para sa pangangalaga at pamumuno sa bayan, sa halip na gawing tahasang “pamahalaan.”
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: aking bayang Israel
  rationale: Pinananatili ang pag-aangkin ng Diyos sa bayan at ang appositional na pagkakakilanlan nito bilang Israel.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Bakit hindi ninyo ako ipinagtayo ng bahay na yari sa sedro?
  rationale: Ang “ipinagtayo” ay likas na Tagalog para sa pagtatayo para sa kapakinabangan o gamit ng isang tao. Ang “ninyo” ay nagpapanatili sa maramihang anyo ng pandiwang Hebreo, at nililinaw ng “yari sa sedro” ang materyal ng bahay.
theological_decisions:
- issue: Katawagan sa tipang bayan ng Israel
  choice: mga anak ni Israel
  alternative: mga Israelita / bayan ng Israel
  rationale: Pinananatili ang pormal na larawan ng Hebreong בְּנֵי יִשְׂרָאֵל nang hindi nagdaragdag ng doktrinal na pagpapakahulugan. Hindi likas na nagtatakda ng kasarian ang Tagalog na “mga anak.”
- issue: Tensiyon sa pagitan ng “mga lipi” at ng tungkuling mamuno bilang pastol
  choice: mga lipi ng Israel
  alternative: mga hukom o pinuno ng Israel
  rationale: Ang WLC sa 2 Samuel 7:7 ay may “mga lipi,” kaya iyon ang isinalin sa pangunahing teksto. Hindi tahasang nilutas ang kahirapan ng kasunod na sugnay; inilalahad sa talababa ang ibang pagbasa sa parallel na 1 Cronica 17:6.
- issue: Metapora ng pastoral na pamumuno
  choice: pastulan ang aking bayang Israel
  alternative: pamahalaan ang aking bayang Israel
  rationale: Ang “pastulan” ay nagpapanatili sa metapora at sa saklaw nitong maaaring tumukoy kapuwa sa pangangalaga at pamumuno, nang hindi ito nililimitahan sa isang denominasyonal na pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “dako,” “pastulan,” at “sedro” bilang mga salitang biblikal ngunit karaniwan pa ring nauunawaan. Hinati sa dalawang tanong ang mahabang pangungusap upang maging malinaw sa Tagalog, habang pinananatili ang iisang retorikal na daloy at ang tunay na tekstuwal na tensiyon.
