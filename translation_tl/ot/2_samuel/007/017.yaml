lexical_decisions:
- source_word: כְּכֹל
  choice: Ayon sa lahat ng
  rationale: Pinananatili nito ang diwa ng pagtutugma o pagsunod sa kabuuan ng ipinahayag, pati ang pag-uulit sa Hebreo.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mga salitang ito
  rationale: Sa konteksto ng mensaheng ipinahayag ng Diyos, mas angkop ang “mga salita” kaysa sa mas malawak na “mga bagay” o “mga usapin.”
- source_word: וּכְכֹל
  choice: at ayon sa buong
  rationale: Pinananatili ang magkatimbang na pag-uulit ng Hebreo; ginamit ang “buong” para sa natural na Filipino sa pariralang tumutukoy sa isang pangitain.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: pangitaing ito
  rationale: Ang “pangitain” ang tuwirang salin ng terminong tumutukoy sa propetikong kapahayagang maaaring matanggap sa anyong nakikita.
- source_word: כֵּן
  choice: gayon
  rationale: Ipinahihiwatig nito na eksaktong alinsunod sa mga salita at pangitain ang sinabi ni Natan.
- source_word: דִּבֶּר
  choice: nagsalita
  rationale: Karaniwan at tuwirang katumbas ito ng pandiwang Hebreo para sa pagsasalita.
- source_word: נָתָן
  choice: Natan
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Natural na Filipino ito para sa pagsasalitang nakatuon sa isang tao.
theological_decisions:
- issue: Kalikasan ng propetikong kapahayagan sa חִזָּיוֹן
  choice: pangitain
  alternative: kapahayagan
  rationale: Pinananatili ng “pangitain” ang tahasang terminong Hebreo at ang posibleng biswal na anyo ng propetikong pagtanggap, nang hindi ito nilalawak o nililimitahan nang higit sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit at balanseng ayos ng Hebreo, bagaman bahagyang pormal ang “gayon nagsalita” upang maipakita ang puwersa ng כֵּן.
