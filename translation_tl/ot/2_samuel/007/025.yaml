    issue: Ang “sambahayan” ay hindi lubos na pinananatili ang metaporang “bahay.”
    rationale: Ang בֵּיתוֹ ay literal na “kanyang bahay,” bagaman malinaw na tumutukoy ito sa maharlikang sambahayan/angkan o dinastiya sa konteksto. Ang “bahay” sa pangunahing teksto, na may talababa, ay mas malapit sa pinagmulan at mas pare-pareho sa pangunahing terminolohiya ng kabanata.
  - severity: medium
    issue: Hindi likas ang “gawin mo ang ayon sa sinabi mo.”
    rationale: Walang kinakailangang panghalip o pantukoy na “ang” sa Tagalog na katumbas ng maigsi at bukas na object ng וַעֲשֵׂה. Ang “gawin mo ayon sa sinabi mo” ay natural at hindi nagdaragdag ng kahulugan.
