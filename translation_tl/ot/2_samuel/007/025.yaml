  source_fidelity: Tumpak sa kabuuan ang pag-render sa panalangin, sa utos na patatagin ang sinabi ng Diyos, at sa pangwakas na kahilingang kumilos siya ayon sa kanyang sinabi. Gayunman, ang “sambahayan” ay higit na tumutukoy sa household kaysa sa pangunahing metaporang “bahay” (בֵּיתוֹ), na sa kontekstong ito ay may dinastikong saklaw.
  naturalness: Ang “gawin mo ang ayon sa sinabi mo” ay hindi likas na konstruksiyon sa makabagong Tagalog. Mas natural at tapat sa pinaikling Hebreong pahayag ang “gawin mo ayon sa sinabi mo.”
  terminology: Pinananatili ang “Yahweh na Diyos,” “lingkod,” “salita,” at “magpakailanman.” Pinalitan ang “sambahayan” ng “bahay” upang mapanatili ang mahalagang terminong pangtipan; ipinaliliwanag ng talababa ang dinastikong diwa.
  issues:
