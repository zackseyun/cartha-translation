base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: tl
  text: At ngayon, Yahweh na Diyos, patatagin mo magpakailanman ang salitang[a] sinabi mo tungkol sa iyong lingkod at sa kanyang bahay[b], at gawin mo ayon sa sinabi mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangakong sinabi mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang bahay” dito ay tumutukoy sa kanyang maharlikang angkan o dinastiya, hindi lamang sa kanyang pisikal na tahanan o sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at isinasalin ang אֱלֹהִים bilang karaniwang titulong “Diyos.” Likas sa makabagong Tagalog ang pariralang pantawag na “Yahweh na Diyos.”
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Pinananatili ng “salita” ang tahasang pananalita ng Hebreo at ang pag-uulit ng ugat na דבר, sa halip na agad itong bigyang-kahulugang “pangako.”
- source_word: דִּבַּרְתָּ
  choice: sinabi mo
  rationale: Natural at tuwiran itong katumbas ng naunang pagsasalita ng Diyos; hindi nito idinaragdag ang mas tiyak na diwang “ipinangako.”
- source_word: עַל עַבְדְּךָ
  choice: tungkol sa iyong lingkod
  rationale: Ang עַל ay tumutukoy sa paksa ng sinabi, at ang “lingkod” ay angkop sa mapagpakumbabang pananalita ni David sa Diyos.
- source_word: בֵּיתוֹ
  choice: sa kanyang sambahayan
  rationale: Pinananatili ng “sambahayan” ang talinghagang “house” habang maaari ring tumukoy sa pamilya at angkan; nililinaw sa talababa ang mahalagang diwang maharlikang linya o dinastiya.
- source_word: הָקֵם
  choice: patatagin mo
  rationale: Ipinahahayag nito ang causative na diwa ng Hiphil—ang hiling na pairalin at panatilihing matatag ng Diyos ang kanyang sinabi—nang hindi tahasang ipinapalit ang interpretibong “tuparin.”
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, marangal, at malinaw na salin ng diwang walang-hanggang pagpapatuloy.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: at gawin mo ang ayon sa sinabi mo
  rationale: Pinananatili ang payak na pandiwang “gawin” at ang pag-uulit ng “sinabi,” sa halip na idagdag ang interpretibong “tuparin mo.”
theological_decisions:
- issue: Kung isasalin ang דָּבָר bilang “salita” o bilang mas interpretibong “pangako”
  choice: salita
  alternative: pangako
  rationale: Covenantal ang konteksto, ngunit literal na “salita” ang ginamit sa Hebreo. Pinananatili ito sa pangunahing teksto upang manggaling sa konteksto ang diwa ng pangako; inilalagay ang “pangako” bilang leksikal na alternatibo sa talababa.
- issue: Kung gagawing tahasan ang בֵּיתוֹ bilang “dinastiya”
  choice: sambahayan
  alternative: maharlikang angkan o dinastiya
  rationale: Mahalaga sa kabanata ang dinastikong diwa, ngunit pinananatili ng “sambahayan” ang talinghaga ng “house” at ang saklaw nitong pamilya o angkan. Nililinaw ng talababa ang espesipikong diwa sa kontekstong ito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Tuwiran ang panalangin at pinanatili ang pag-uulit ng “sinabi,” gayundin ang personal na pangalang Yahweh. Inilipat ang marker [a] sa “salita,” sapagkat ang kaugnay na talababa ay alternatibong salin ng הַדָּבָר, hindi ng “ngayon.”
