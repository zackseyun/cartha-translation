base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: tl
  text: 'Ngayon nga, ito ang sasabihin mo sa lingkod kong si David: Ganito ang sabi ni Yahweh ng mga hukbo: ‘Kinuha kita mula sa pastulan[a], mula sa pagpapastol sa kawan, upang maging pinuno[b] ng aking bayan, ng Israel.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kulungan ng mga tupa.” Ang salitang Hebreo ay maaaring tumukoy sa pastulan o sa lugar na tinitirhan ng kawan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagapamahala” o “prinsipe” para sa “pinuno.” Ang salitang Hebreo ay tumutukoy sa isang itinalagang mamuno at hindi kinakailangang sa tiyak na titulong “hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang puwersang panahunan at transisyonal ng parirala sa natural na modernong Tagalog.
- source_word: לְעַבְדִּי לְדָוִד
  choice: sa lingkod kong si David
  rationale: Ang “lingkod” ay angkop na katawagang marangal at tipanang ginagamit para kay David; natural sa Tagalog ang estrukturang may “si.”
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  rationale: Tuwirang pinananatili ang banal na pangalang Yahweh at ang malawak na diwa ng צְבָאוֹת nang hindi nililimitahan sa makalangit o makalupang hukbo lamang.
- source_word: מִן הַנָּוֶה
  choice: mula sa pastulan
  rationale: Ang נָוֶה ay maaaring tumukoy sa pastulan o tirahan ng kawan; “pastulan” ang pinakamalinaw sa konteksto.
- source_word: מֵאַחַר הַצֹּאן
  choice: mula sa pagsunod sa kawan
  rationale: Pinananatili ang literal na larawang “mula sa likuran/pagsunod sa kawan” habang nananatiling mauunawaan bilang gawain ng pastol.
- source_word: נָגִיד
  choice: pinuno
  rationale: Ipinahahayag ang taong itinalagang mamuno nang hindi ipinapasok ang mas tiyak na titulong “hari.”
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: ng aking bayan, ng Israel
  rationale: Ang pamumuno “sa” isang bayan ay natural na ipinapahayag sa Tagalog bilang “pinuno ng”; pinananatili ng kuwit ang appositional na pag-uulit at diin ng Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Nasa teksto ang Tetragrammaton bilang sariling pangalan; ang “Yahweh” ay direktang kumakatawan rito nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng עֶבֶד para kay David
  choice: lingkod
  alternative: alipin
  rationale: Dito ito ay katawagang nagpapahayag ng paglilingkod at kaugnayan ni David sa Diyos, hindi pagdidiin sa kalagayang pagkaalipin.
- issue: Saklaw ng נָגִיד
  choice: pinuno
  alternative: tagapamahala / prinsipe / hari
  rationale: Ang salita ay tumutukoy sa isang itinalagang mamuno ngunit hindi kinakailangang gamitin ang tiyak na titulong “hari”; pinananatili ng “pinuno” ang saklaw at tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyong biblikal nang hindi nagiging lipas o labis na pormal; pinanatili ang pag-uulit sa hulihan upang katawanin ang diin ng Hebreo.
