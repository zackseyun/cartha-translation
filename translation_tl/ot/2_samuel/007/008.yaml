  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: utos kay Nathan para kay David, ang titulong “Yahweh ng mga hukbo,” ang pagpili kay David mula sa pastulan at kawan, at ang paghirang sa kanya bilang namumuno sa Israel. Gayunman, ang “Ganito ang sinabi” ay nakapagpapahiwatig ng nakaraang pananalita, samantalang ang pormulang כֹּה אָמַר ay mas natural at tumpak na “Ganito ang sabi.” Ang “pagpapastol sa kawan” ay mas natural na Tagalog para sa idiomatikong paglalarawan ng dating gawain ni David bilang pastol.'
