    rationale: Mas natural at mas angkop sa kasalukuyang pormula ng pagpapahayag ang “Ganito ang sabi ni Yahweh.”
  - severity: low
    issue: “mula sa pagsunod sa kawan”
    rationale: Bagaman malapit sa literal na larawan ng Hebreo, hindi ito ang pinakanatural na Tagalog para sa tungkulin ng pastol; “mula sa pagpapastol sa kawan” ay malinaw at idiomatiko nang hindi binabago ang diwa.
