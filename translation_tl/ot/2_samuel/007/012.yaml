    issue: Hindi likas ang “natupad na ang iyong mga araw.”
    rationale: Bagaman literal na nauugnay sa “mapuno/maganap” ang Hebreo, ang Filipino ay karaniwang nagsasaad ng idyomang ito bilang pagtatapos ng mga araw o buhay ng tao.
  - severity: low
    issue: Ang “pagkatapos mo” ay bahagyang nakabiti sa Filipino.
    rationale: Ang “pagkatapos mong pumanaw” ay ginagawang malinaw ang tinutukoy na yugto nang hindi binabago ang kahulugang paghalili pagkatapos ni David.
  - severity: low
    issue: Ang pariralang “sarili mong tunay na supling” sa talababa ay maaaring magdala ng di-kailangang pahiwatig.
    rationale: Sapat na ang “biyolohikal na supling” upang ipaliwanag ang idiomang Hebreo ng pisikal na pinagmulan.
