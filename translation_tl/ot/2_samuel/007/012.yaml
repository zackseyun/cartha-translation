base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: tl
  text: Kapag natapos na ang mga araw mo at nahimlay ka na kasama ng iyong mga ninuno,[a] ibabangon ko ang iyong supling pagkatapos mong pumanaw,[b] na magmumula sa sarili mong katawan,[c] at itatatag ko ang kanyang kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nahimlay kasama ng iyong mga ninuno” ay isang Hebreong idyoma para sa pagkamatay at pakikiisa sa mga ninunong namatay na.
    reason: cultural_note
  - marker: b
    text: O “inapo.” Ang Hebreong salita ay literal na “binhi” at maaaring tumukoy sa mga supling bilang isang lahi o sa isang kinatawang supling.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mula sa iyong mga panloob na bahagi,” isang idyoma na nangangahulugang mula sa sarili mong katawan—samakatuwid, iyong biyolohikal na supling.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: Kapag natupad na ang iyong mga araw
  rationale: Ginagamit dito ang כִּי upang ipakilala ang pangyayari sa hinaharap. Pinananatili ng “natupad na ang iyong mga araw” ang Hebreong larawan ng pagkapuno o pagkaganap ng mga araw at ang maringal na tono nito.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: at nahimlay ka na kasama ng iyong mga ninuno
  rationale: Ang parirala ay isang karaniwang Hebreong idyoma para sa kamatayan at pakikiisa sa mga ninunong namatay na. Ang “nahimlay” ay likas, marangal, at nagpapanatili sa larawan nang hindi tahasang pinapaliwanag sa pangunahing teksto.
- source_word: וַהֲקִימֹתִי
  choice: ibabangon ko
  rationale: Sa supling bilang layon, ipinahihiwatig ng Hiphil ng קום ang pagpapalitaw o pagbangon ng isang hahalili. Pinananatili ng “ibabangon” ang motibo ng paghalili.
- source_word: זַרְעֲךָ
  choice: ang iyong supling
  rationale: Ang זֶרַע ay maaaring tumukoy sa lahi nang pangkatan o sa isang kinatawang inapo. Ang “supling” ay mas likas kaysa literal na “binhi” at hindi kasing-tiyak ng “anak,” kaya naiiwan ang saklaw ng Hebreo.
- source_word: אַחֲרֶיךָ
  choice: pagkatapos mo
  rationale: 'Tuwirang ipinahahayag nito ang panahong paghalili: darating ang supling kasunod ni David.'
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: na magmumula sa sarili mong katawan
  rationale: Literal itong tumutukoy sa paglabas mula sa mga panloob na bahagi. Malinaw at likas na ipinahahayag ng salin ang tunay na pisikal o biyolohikal na pinagmulan.
- source_word: וַהֲכִינֹתִי אֶת־מַמְלַכְתּוֹ
  choice: at itatatag ko ang kanyang kaharian
  rationale: Ang Hiphil ng כון ay nangangahulugang gawing matatag o itatag. Ang “itatatag” ay angkop sa pangakong dinastiko, at malinaw na isinasalin ng “kaharian” ang מַמְלָכָה.
theological_decisions:
- issue: Saklaw ng זַרְעֲךָ sa pangako kay David
  choice: ang iyong supling
  alternative: ang iyong inapo / ang iyong binhi
  rationale: Maaaring pangkatan o kinatawang isahan ang Hebreo. Hindi nililimitahan ng “supling” ang pangako sa iisang agarang katuparan, ngunit hindi rin nito ipinapasok sa mismong talata ang mas malawak na dinastiko o mesiyanikong pagbasa.
- issue: Pagkakakilanlan at kasarian ng ipinangakong supling
  choice: kanyang kaharian
  alternative: kaharian nito
  rationale: Ang hulaping panlalaki sa מַמְלַכְתּוֹ at ang konteksto ng isang maharlikang hahalili ay sumusuporta sa “kanyang.” Hindi pinapangalanan ng salin ang supling at sa gayon ay hindi nito nilulutas nang higit sa teksto ang kanyang pagkakakilanlan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang solemneng larawan ng pagpanaw sa “nahimlay” at ang wikang panghari sa “ibabangon” at “itatatag,” habang ipinaliliwanag sa mga talababa ang mga Hebreong idyoma at ang likas na kalabuan ng “supling.”
