- from: Kapag natupad na ang iyong mga araw at nahimlay ka na kasama ng iyong mga ninuno,[a] ibabangon ko pagkatapos mo ang iyong supling,[b] na magmumula sa sarili mong katawan,[c] at itatatag ko ang kanyang kaharian.
  to: Kapag natapos na ang mga araw mo at nahimlay ka na kasama ng iyong mga ninuno,[a] ibabangon ko ang iyong supling pagkatapos mong pumanaw,[b] na magmumula sa sarili mong katawan,[c] at itatatag ko ang kanyang kaharian.
  rationale: Pinahusay ang likas na modernong Filipino sa idyoma ng pagpanaw at sa temporal na parirala ng paghalili. Pinananatili ng salin ang saklaw na maaaring pangkatan o kinatawang isahan ng “supling,” ang pagbibigay-diin sa pisikal na pagmamana, at ang pangakong itatatag ng Diyos ang kaharian nito.
