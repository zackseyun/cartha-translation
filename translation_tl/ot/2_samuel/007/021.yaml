base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: tl
  text: Dahil sa iyong salita[a] at ayon sa iyong puso[b], ginawa mo ang lahat ng kadakilaang ito[c] upang ipaalam ito sa iyong lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa iyong salita” o “dahil sa iyong pangako.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ayon sa iyong puso,” na tumutukoy sa sarili mong layunin o kalooban.
    reason: lexical_alternative
  - marker: c
    text: 'Isahan sa Hebreo: “lahat ng kadakilaang ito”; maaari ring isaling “lahat ng dakilang bagay na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: Dahil sa iyong salita
  rationale: Ang בַּעֲבוּר ay nagsasaad ng dahilan o batayan, at ang דָּבָר ay maaaring tumukoy sa salita, sinabi, o pangako. Pinananatili ng “salita” ang lawak ng Hebreo, samantalang ang “dahil sa” ay likas sa makabagong Tagalog.
- source_word: וּכְלִבְּךָ
  choice: at ayon sa iyong puso
  rationale: Ang לֵב ay maaaring tumukoy sa kalooban, layunin, o hangarin. Pinananatili ng salin ang metapora ng Hebreo nang hindi agad nililimitahan ang kahulugan sa isa lamang sa mga ito.
- source_word: עָשִׂיתָ
  choice: ginawa mo
  rationale: Tumutukoy ang ganap na anyo ng pandiwa sa natapos na pagkilos ng Diyos. Ang payak na “ginawa mo” ang pinakanatural na katumbas sa Tagalog sa konteksto ng panalangin.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ang lahat ng kadakilaang ito
  rationale: Ang Hebreo ay gumagamit ng isang pangngalang abstrakto at isahan, “kadakilaan,” na nagbubuklod sa ginawa ng Diyos bilang isang dakilang pagpapamalas. Pinananatili ito sa halip na gawing maramihang “mga dakilang bagay.”
- source_word: לְהוֹדִיעַ
  choice: upang ipaalam ito
  rationale: Ang Hiphil ng ידע ay causative, “magpangyaring malaman.” Ang “ipaalam” ay natural na Tagalog at pinananatili ang causative na diwa; ang “ito” ay tumutukoy sa naunang binanggit na kadakilaan.
- source_word: עַבְדֶּךָ
  choice: sa iyong lingkod
  rationale: Sa panalangin ng hari, ang “lingkod” ang angkop at nakaugaliang tawag sa mapagpakumbabang pagtukoy ni David sa sarili sa harap ng Diyos.
theological_decisions:
- issue: Tinutukoy ng “iyong salita” sa konteksto ng tipan
  choice: iyong salita
  alternative: iyong pangako; ang sinabi mo
  rationale: Bagaman malamang na tumutukoy ito sa ipinahayag ng Diyos kay David at maaaring maunawaan bilang pangako, “salita” mismo ang mas malawak na pahayag ng Hebreo at hindi nito inuunahan ang mambabasa sa isang mas makitid na pagpapakahulugan.
- issue: Antropomorpikong pananalita tungkol sa Diyos sa “ayon sa iyong puso”
  choice: ayon sa iyong puso
  alternative: ayon sa iyong kalooban; ayon sa iyong hangarin
  rationale: Pinananatili ang mismong metapora ng tekstong Hebreo para sa panloob na layunin o pasiya ng Diyos, sa halip na palitan ito ng abstraktong teolohikal na pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “salita,” “puso,” at ang isahang “kadakilaan” upang maingatan ang lawak, metapora, at anyo ng Hebreo; ginamit ang “ipaalam” para sa likas na Tagalog na causative na pagpapahayag.
