  terminology: Ang “mga anak ni Israel,” “Ehipto,” “tolda,” at “tabernakulo” ay angkop. Pinananatili ang “tabernakulo” para sa מִשְׁכָּן, kasama ang talababa para sa mas malawak na leksikal na kahulugan.
