  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: tl
  text: Sapagkat hindi ako nanirahan sa isang bahay mula nang araw na iniahon ko mula sa Ehipto ang mga anak ni Israel hanggang sa araw na ito, kundi ako'y naglalakbay-lakbay sa isang tolda at sa isang tabernakulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tabernakulo” ay maaari ring isaling “tahanan” o “dakong tirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: nanirahan
  rationale: Karaniwang kahulugan ng ישׁב ang manirahan o tumahan. Likas sa modernong Filipino ang “nanirahan” sa konteksto ng bahay at ipinahihiwatig ng pariralang temporal na nagpapatuloy ang kalagayan hanggang sa kasalukuyang araw.
- source_word: בְּבַיִת
  choice: sa isang bahay
  rationale: Hindi tiyak ang pangngalan sa Hebreo. Pinananatili ng “isang bahay” ang payak na kahulugan at hindi ito agad binibigyang-kahulugang templo.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: mula nang araw na iahon ko
  rationale: Itinatakda ng parirala ang simula ng panahon. Ang Hiphil ng עלה ay literal na “iaahon,” isang karaniwang paglalarawan sa paglabas mula sa Ehipto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Direktang sinasalamin nito ang konstruksiyong Hebreo at natural din sa marangal na Filipino; saklaw ng parirala ang sambayanang nagmula kay Israel.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Malinaw at natural nitong ipinapahayag ang pinagmulan ng pag-ahon nang hindi nagdaragdag ng paliwanag.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Ito ang natural at malapit na katumbas ng karaniwang pahayag na temporal sa Hebreo.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: sa halip, nagpalipat-lipat ako
  rationale: Ipinakikita ng participle na hitpael ang patuloy na pagkilos o paglibot. Ang “nagpalipat-lipat” ay malinaw na kabaligtaran ng paninirahan sa isang permanenteng bahay.
- source_word: בְּאֹהֶל
  choice: na nasa tolda
  rationale: Ang “tolda” ang payak at kasalukuyang salin ng אֹהֶל. Ang pag-uugnay na “na nasa” ay nagpapakitang ang Diyos ang nagpalipat-lipat habang kaugnay ng tolda.
- source_word: וּבְמִשְׁכָּן
  choice: at nasa tabernakulo
  rationale: Sa kontekstong santuaryo, kinikilala ng “tabernakulo” ang kultikong gamit ng מִשְׁכָּן habang pinananatili ang hiwalay na katawagan nito mula sa “tolda.”
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita; ang sambayanang Israel
  rationale: Pinananatili ang pormang pampamilya ng Hebreo nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy; sa konteksto, ito ang buong bayang Israel.
- issue: Kultikong kahulugan ng מִשְׁכָּן
  choice: tabernakulo
  alternative: tahanan; dakong tirahan
  rationale: Ang konteksto ay ang naililipat na santuaryo bago magkaroon ng permanenteng templo. Pinananatili ng “tabernakulo” ang makasaysayan at kultikong pagtukoy, ngunit itinatala sa talababa ang mas literal na kahulugan.
- issue: Ugnayan ng אֹהֶל at מִשְׁכָּן
  choice: tolda at tabernakulo
  alternative: toldang tahanan; tolda bilang tahanan
  rationale: Maaaring dalawang magkaugnay na paglalarawan ang parirala, ngunit hindi nilulutas ng salin kung ganap na magkasingtukoy ang dalawang katawagan. Pinananatili ang parehong pangngalan gaya ng nasa Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nanirahan” sa halip na mas lumang “tumahan,” at “nagpalipat-lipat” upang maipahayag ang patuloy at di-permanenteng pagkilos. Pinanatili ang tradisyonal na terminong “tabernakulo” dahil sa kontekstong santuaryo, na may talababa para sa literal na saklaw nito.
