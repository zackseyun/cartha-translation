base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: tl
  text: 'Humayo ka at sabihin mo sa lingkod kong si David, ‘Ganito ang sabi ni Yahweh: Ikaw ba ang magtatayo para sa akin ng isang bahay na titirhan ko?’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ikaw ba ang siyang magtatayo para sa akin ng isang bahay na titirhan ko?” Mariin at retorikal ang tanong sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos na Qal sa ikalawang panauhang panlalaki; pinananatili ng “Humayo ka” ang marangal na himig ng salaysay.
- source_word: וְאָמַרְתָּ
  choice: at sabihin mo
  rationale: Ang waw na sinusundan ng perfect pagkatapos ng pautos ay may kasunod na puwersang pautos; natural itong isinalin bilang ikalawang utos.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: sa lingkod kong si David
  rationale: Ang עבד sa maharlika at tipanang konteksto ay “lingkod,” at ang pangalang David ay appositional; natural sa Tagalog ang “lingkod kong si David.”
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormulang mensaherong propetiko at ang personal na pangalang יְהוָה bilang Yahweh.
- source_word: הַאַתָּה
  choice: Ikaw ba ang
  rationale: Ang pantanong na pantukoy kasama ng tahasang panghalip ay mariin; ipinahahayag ng “Ikaw ba ang” ang diin at hindi agad inaalis ang retorikal na puwersa.
- source_word: תִּבְנֶה לִּי בַיִת
  choice: magtatayo para sa akin ng isang bahay
  rationale: Ang “bahay” ay sumusunod sa literal na בית at pinananatili ang mahalagang paglalaro sa kahulugan ng “bahay” sa buong kabanata, sa halip na maagang tukuying “templo.”
- source_word: לְשִׁבְתִּי
  choice: na matitirhan ko
  rationale: 'Ipinahahayag ang layunin ng infinitive construct na may hulaping unang panauhan: isang bahay para tirhan ng nagsasalita.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi pamalit na titulo.
- issue: Kahulugan ng בַיִת
  choice: bahay
  alternative: templo
  rationale: Bagaman santuwaryo ang tinutukoy, mahalagang mapanatili ang salitang “bahay” dahil sa sinadyang ugnayan nito sa sambahayan o dinastiya ni David sa kasunod na bahagi.
- issue: Puwersa ng tanong na הַאַתָּה תִּבְנֶה
  choice: Ikaw ba ang magtatayo…?
  alternative: Magtatayo ka ba…?
  rationale: Pinananatili ng napiling anyo ang mariing pagtukoy sa “ikaw” at ang retorikal na tensiyon ng tanong nang hindi ito ginagawang tahasang pahayag.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “Humayo” upang umangkop sa propetikong salaysay, ngunit iniwasan ang labis na makaluma o teknikal na pananalita. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng tanong na tinutukoy nito.
