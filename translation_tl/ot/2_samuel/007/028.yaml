  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: tl
  text: Ngayon nga, Panginoong Yahweh[a], ikaw ang Diyos, at totoo ang iyong mga salita[b]. Sinabi mo sa iyong lingkod ang mabuting bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Panginoong Yahweh,” na pinagsasama ang titulong Adonai (“Panginoon”) at ang banal na pangalang YHWH (“Yahweh”).'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “magiging totoo ang iyong mga salita” o “maaasahan ang iyong mga salita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon nga
  rationale: Ipinahihiwatig ng וְעַתָּה ang paglipat sa kasalukuyang tugon o konklusyon ni David; natural itong ipinapahayag sa Tagalog bilang “Ngayon nga.”
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili nito ang dalawang sangkap ng tawag—אֲדֹנָי (“Panginoon”) at ang personal na pangalang יהוה (“Yahweh”)—nang malinaw at natural sa Tagalog.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: ikaw ang Diyos
  rationale: Natural na Tagalog ito para sa mariing Hebreong pahayag na “ikaw, siya, ang Diyos,” at pinananatili ang tuwirang pagkilala kay Yahweh bilang Diyos.
- source_word: דְבָרֶיךָ
  choice: iyong mga salita
  rationale: Maramihan ang anyong Hebreo, kaya pinananatili ang “mga salita” sa halip na gawing isahan o ang mas interpretibong “mga pangako.”
- source_word: יִהְיוּ אֱמֶת
  choice: totoo ang iyong mga salita
  rationale: Natural na ipinahahayag sa Tagalog ang katotohanan at pagiging maaasahan ng sinabi ng Diyos. Nananatili sa talababa ang posibleng hinaharap na diin ng imperfect na יִהְיוּ.
- source_word: וַתְּדַבֵּר
  choice: Sinabi mo
  rationale: Tuwirang isinasalin ang pandiwang “nagsalita/nagsabi” nang hindi ito nililimitahan sa interpretibong “ipinangako.”
- source_word: אֶל עַבְדְּךָ
  choice: sa iyong lingkod
  rationale: Sa panalanging makahari, “lingkod” ang natural at angkop na tawag ni David sa sarili sa harap ng Diyos.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ang mabuting bagay na ito
  rationale: Pinananatili ang malawak at hindi espesipikong kahulugan ng parirala sa halip na ipakahulugang agad na “pangako” o “pagpapala.”
theological_decisions:
- issue: Paglalahad sa banal na pangalan sa אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa tipang pangalan na יהוה, samantalang ang “Panginoon” ay kumakatawan sa אֲדֹנָי; hindi nito pinagsasanib o itinatago ang dalawang magkaibang katawagan.
- issue: Panahunan at saklaw ng יִהְיוּ אֱמֶת
  choice: totoo ang iyong mga salita
  alternative: magiging totoo ang iyong mga salita
  rationale: Sa konteksto, pinagtitibay ni David ang likas na katotohanan at pagiging maaasahan ng mga salita ng Diyos. Gayunman, maaaring unawain ang imperfect bilang nakatuon sa magiging katuparan, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang malinaw na ayos ng pangungusap at karaniwang bokabularyo, habang pinananatili ang maramihang “mga salita,” ang malawak na “mabuting bagay,” at ang posibleng tensiyon sa panahunan ng יִהְיוּ sa talababa.
