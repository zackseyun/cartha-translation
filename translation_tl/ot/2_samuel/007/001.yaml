base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: tl
  text: Nang naninirahan ang hari sa kanyang bahay[a], at binigyan siya ni Yahweh ng kapahingahan mula sa lahat ng kanyang kaaway sa paligid,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang palasyo.” Sa Hebreo, “sa kanyang bahay”; pinanatili rito ang “bahay” dahil inihahanda rin nito ang paglalaro ng salita sa “bahay” sa mga susunod na bahagi ng kabanata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nang
  rationale: Ipinakikilala ng pormulang Hebreo ang pangyayaring kasunod bilang isang sugnay na panahunan. Natural sa modernong Tagalog ang “Nang” at hindi nito dinaragdagan ang teksto ng hiwalay na panandang katumbas ng “ngayon.”
- source_word: יָשַׁב
  choice: naninirahan na
  rationale: Sa konteksto, tumutukoy ang pandiwa sa matatag na paninirahan, hindi lamang sa pisikal na pag-upo. Ipinahihiwatig ng “na” ang kalagayang umiiral na nang mangyari ang kasunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinanatili ang tiyak na titulong ginamit sa Hebreo sa halip na ipalit ang pangalang David.
- source_word: בְּבֵיתוֹ
  choice: sa kanyang bahay
  rationale: Ang בַּיִת ay pangunahing nangangahulugang “bahay.” Pinananatili rin nito ang mahalagang paglalaro sa kahulugan ng “bahay” sa kabuuan ng kabanata.
- source_word: וַיהוָה
  choice: at ... ni Yahweh
  rationale: Pinanatili ang pang-ugnay sa loob ng pangungusap at isinalin ang banal na pangalang יְהוָה bilang “Yahweh.” Inangkop ang ayos sa likas na balarila ng Tagalog.
- source_word: הֵנִיחַ לוֹ
  choice: binigyan na siya ... ng kapahingahan
  rationale: 'Ipinahahayag nito ang sanhiang diwa ng Hiphil ng נוח: si Yahweh ang nagkaloob sa hari ng pahinga o katiwasayan mula sa labanan.'
- source_word: מִסָּבִיב
  choice: sa lahat ng dako
  rationale: Ipinahahayag ang ganap na katiwasayan sa buong paligid nang hindi gumagamit ng lipas o mabigat na pananalita.
- source_word: מִכָּל אֹיְבָיו
  choice: mula sa lahat ng kanyang kaaway
  rationale: Malinaw na tinutukoy ang mga kaaway bilang pinagmulan ng kaguluhang ipinagpahinga sa hari; hindi kailangan sa Tagalog na maramihan ang “kaaway” pagkatapos ng “lahat.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Posibleng diwang maharlikang tirahan ng בַּיִת
  choice: bahay
  alternative: palasyo
  rationale: Bagaman tahanan ng hari ang tinutukoy, mas tuwirang katumbas ng בַּיִת ang “bahay,” at pinananatili nito ang sinadyang pagkakaugnay ng iba’t ibang diwa ng “bahay” sa kabanata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatiling hindi ganap ang pangungusap sa pamamagitan ng kuwit sa hulihan sapagkat ang talata ay sugnay na naghahanda sa pagpapatuloy sa 2 Samuel 7:2.
