  naturalness: Marangal at madaling maunawaan ang draft, ngunit mas natural ang “mula sa lahat ng kanyang kaaway sa paligid” kaysa “sa lahat ng dako mula sa lahat ng kanyang kaaway.” Inalis din ang mga sobrang “na” upang maging mas tuwiran ang daloy ng sugnay.
  terminology: Ang “Yahweh,” “bahay,” at “kapahingahan” ay angkop. Ang “bahay” ay wastong pinanatili, kasama ang talababa tungkol sa kasunod na paglalaro ng salita sa kabanata.
