  - severity: medium
    issue: Hindi likas na pagkakasunod ng mga pariralang panglunan at pangmula
    rationale: Ang “sa lahat ng dako mula sa lahat ng kanyang kaaway” ay mabigat at maaaring malabo. Ang paglalagay ng “sa paligid” kasunod ng “mga kaaway” ay mas malinaw na naghahayag ng kapahingahang mula sa mga kaaway na nakapaligid.
  - severity: low
