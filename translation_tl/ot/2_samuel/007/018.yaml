base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: tl
  text: Pagkatapos, pumasok si Haring David at umupo sa harap ni Yahweh. Sinabi niya, “Sino ako, Panginoong Yahweh, at ano ang bahay ko[a], na dinala mo ako hanggang dito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay ko.” Maaari itong tumukoy sa pamilya o sambahayan ni David, pati sa kanyang angkan o umuusbong na dinastiya. Inuulit sa kabanatang ito ang salitang “bahay” sa ganitong magkakaugnay na mga diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok
  rationale: Tuwirang ipinahihiwatig ng pandiwa ang pagpasok ni David, nang hindi tinutukoy ang isang lokasyong hindi pinangalanan sa talata.
- source_word: וַיֵּשֶׁב
  choice: umupo
  rationale: Sa kontekstong ito, ang pisikal na kahulugang “umupo” ang pinakaangkop bago nagsalita si David.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural itong salin ng pagiging nasa presensiya ni Yahweh at pinananatili ang personal na pangalang nasa tekstong Hebreo.
- source_word: מִי אָנֹכִי
  choice: Sino ako
  rationale: Karaniwang pahayag ito ng mapagpakumbabang pagkamangha sa Filipino at pinananatili ang retorikal na lakas ng Hebreo.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili nito kapwa ang titulong אֲדֹנָי at ang banal na pangalang יהוה nang hindi lumilikha ng alanganing “Panginoong Panginoon.”
- source_word: וּמִי בֵיתִי
  choice: at ano ang sambahayan ko
  rationale: Bagaman “sino” ang literal na panghalip at “bahay” ang literal na pangngalan, ang pormulang ito ay natural na tumutukoy sa kabuluhan ng pamilya, sambahayan, o angkan ni David. Ang “ano ang sambahayan ko” ay malinaw sa modernong Filipino habang pinananatili ang masaklaw na diwa.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: upang dalhin mo ako hanggang dito
  rationale: Ang Hiphil ng בוא ay “dalhin,” at ang “hanggang dito” ay sadyang maaaring tumukoy kapwa sa narating na kalagayan at sa puntong ito ng buhay ni David.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo na יהוה ang ginagamit ng tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Kahulugan ng בֵּיתִי (“aking bahay”)
  choice: sambahayan ko, na may talababa tungkol sa bahay, pamilya, angkan, at dinastiya
  alternative: bahay ko / pamilya ko / angkan ko / dinastiya ko
  rationale: Sentral sa kabanata ang maraming kahulugan ng “bahay.” Ang “sambahayan” ay natural sa Filipino at hindi nililimitahan ang salita sa gusali lamang, samantalang nililinaw ng talababa ang literal at dinastikong alingawngaw nito.
- issue: Lakas ng pangwakas na tanong
  choice: upang dalhin mo ako hanggang dito?
  alternative: na dinala mo ako nang ganito kalayo?
  rationale: Pinananatili ng “hanggang dito” ang maaaring sabay na spatial, temporal, at kalagayang kahulugan ng עַד הֲלֹם nang hindi tahasang nilulutas ang saklaw nito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang maiwasang mapagkamalang gusali lamang ang “bahay,” habang pinananatili sa talababa ang mahalagang larong-salita at dinastikong pahiwatig ng kabanata.
