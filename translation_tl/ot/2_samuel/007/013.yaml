base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: tl
  text: Siya ang magtatayo ng isang bahay para sa aking pangalan[a], at itatatag ko ang trono ng kanyang kaharian magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang templo para sa aking pangalan.” Sa Hebreo, “isang bahay para sa aking pangalan,” na nagpapanatili sa paglalaro ng salitang “bahay” sa kabanata—bilang templo at bilang sambahayan o dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Siya ang
  rationale: Ang hiwalay na panghalip na panlalaking isahan ang tahasang paksa. Ang “Siya ang” ay likas sa Tagalog at bahagyang pinananatili ang pagtuon ng Hebreo sa paksa nang hindi labis na nagpapadiin.
- source_word: יִבְנֶה
  choice: magtatayo
  rationale: Ang Qal imperfect 3ms ng בנה ay tumutukoy sa gawaing darating sa konteksto ng pangako. Ang “magtatayo” ang natural na anyong panghinaharap sa modernong Tagalog.
- source_word: בַּיִת
  choice: isang bahay
  rationale: Literal na “bahay” ang salita. Bagaman templo ang agarang tinutukoy, pinananatili ng “bahay” ang paglalaro ng kahulugan sa kabanata sa pagitan ng sambahan at sambahayan/dinastiya.
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Tuwirang pinananatili nito ang Hebreong idyoma at ang teolohikal na bigat ng “pangalan” nang hindi ito ipinapaliwanag nang higit sa teksto.
- source_word: וְכֹנַנְתִּי
  choice: at itatatag ko
  rationale: Ang unang panauhang perfect na may pang-ugnay ay may panghinaharap na diwa sa pagkakasunod-sunod ng pangako. Ang “itatatag” ay angkop sa pagpapatibay ng maharlikang trono.
- source_word: כִּסֵּא
  choice: ang trono
  rationale: Sa kontekstong maharlika, tuwirang katumbas ng כִּסֵּא ang “trono.”
- source_word: מַמְלַכְתּוֹ
  choice: ng kanyang kaharian
  rationale: Ang salita ay tumutukoy sa kaharian o saklaw ng paghahari; “kanyang kaharian” ang malinaw at natural na kabit sa “trono.”
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag ng karaniwang idyomang ito ang walang-hanggang pagpapatuloy. Pinananatili ng “magpakailanman” ang buong lakas ng pangako.
theological_decisions:
- issue: Kung isasalin ang בַּיִת bilang “bahay” o bibigyang-kahulugang “templo”
  choice: bahay
  alternative: templo
  rationale: Templo ang agarang tinutukoy, ngunit nakasalalay ang balangkas ng kabanata sa dobleng kahulugan ng “bahay”—gusaling sambahan at sambahayan o dinastiya. Ang “bahay” sa pangunahing teksto ang mas mahusay na nagpapanatili sa sinadyang tensiyon at paglalaro ng salita.
- issue: Ang lakas ng עַד עוֹלָם sa pangako kay David
  choice: magpakailanman
  alternative: sa napakahabang panahon
  rationale: Sa konteksto ng tipan, ang parirala ay may buong diwa ng patuloy na walang hanggan. Hindi dapat pahinain ang pangako sa pamamagitan ng pagsasalin nito bilang isang di-tiyak ngunit mahabang panahon lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang literal na “bahay” at ang idyomang “para sa aking pangalan” upang hindi mawala ang pampanitikan at teolohikal na lalim ng Hebreo.
