base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: tl
  text: At itinatag mo para sa iyong sarili ang iyong bayang Israel upang maging bayan mo magpakailanman; at ikaw, Yahweh[a], ay naging Diyos nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay gumagamit ng banal na pangalang YHWH, na isinaling “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “ikaw ang kanilang Diyos.” Maaaring unawain ang Hebreo bilang paglalarawan ng kalagayan, ngunit ipinahihiwatig ng “naging Diyos nila” ang pagtatatag ng ugnayan sa tipan sa kontekstong ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: itinatag mo
  rationale: Ang pandiwang mula sa כון sa masidhing anyo ay nagpapahayag ng pagpapatatag o pagtatatag. Ang “itinatag mo” ay natural sa Filipino at angkop sa konteksto ng pakikipagtipan.
- source_word: לְךָ ... לְךָ לְעָם
  choice: para sa iyong sarili ... upang maging bayan mo
  rationale: Pinananatili nito ang pag-uulit at ang diwa ng pag-aari at pagtatalaga kay Yahweh, habang nananatiling malinaw at natural sa Filipino.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ang iyong bayang Israel
  rationale: Pinananatili nito kapwa ang pag-aari (“iyong bayan”) at ang pangalang Israel sa natural na ayos ng Filipino.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na katumbas ito ng pariralang tumutukoy sa walang-hanggang pananatili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: naging Diyos nila
  rationale: Ang היה na may ל ay maaaring magpahiwatig ng pagpasok sa isang ugnayan. Dito, kasunod ng pagtatatag sa Israel bilang bayan niya, ipinapakita ng “naging Diyos nila” ang katugmang panig ng tipan.
theological_decisions:
- issue: Ang magkatugmang pormula ng tipan
  choice: “upang maging bayan mo ... naging Diyos nila”
  alternative: “upang maging bayan mo ... ikaw ang kanilang Diyos”
  rationale: Pinananatili ng salin ang magkatugmang ugnayan—Israel bilang bayan ni Yahweh at si Yahweh bilang Diyos nila—nang hindi nagdaragdag ng doktrinang wala sa talata. Gayunman, kinikilala sa talababa ang posibleng statibong pagbasa ng pandiwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tuwirang pagtawag sa Diyos sa ikalawang panauhan, ang personal na pangalang Yahweh, at ang pormula ng tipan nang hindi pinapawi ang posibleng statibong kahulugan ng huling sugnay.
