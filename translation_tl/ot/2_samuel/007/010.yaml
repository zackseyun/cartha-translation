source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: tl
  text: At magtatakda ako ng isang lugar para sa aking bayang Israel at itatanim ko sila, upang manirahan sila sa sarili nilang lugar at hindi na magambala. Hindi na sila pahihirapan ng mga masasamang tao[a], gaya noong una.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng kasamaan”; maaari ring “mga gumagawa ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: magtatakda ako
  rationale: Ang שׂוּם ay literal na ‘maglagay,’ ngunit kapag מָקוֹם ang layon sa konteksto ng pangako, ipinahihiwatig nito ang pagtatalaga ng isang lugar. Likas sa modernong Tagalog ang ‘magtatakda’ at pinananatili nito ang pagkilos ng Diyos.
- source_word: מָקוֹם
  choice: isang lugar
  rationale: Pinananatili ang payak at malawak na kahulugan ng salita; ang ‘tinubuang-bayan’ ay maaaring magdagdag ng kahulugang hindi tahasang nasa Hebreo.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: para sa aking bayang Israel
  rationale: Itinuturing ang ‘Israel’ bilang paliwanag kung sino ang ‘aking bayan,’ habang pinananatili ang ugnayang tipan na ipinahahayag ng ‘aking.’
- source_word: וּנְטַעְתִּיו
  choice: at itatanim ko sila
  rationale: Pinananatili ang talinghaga ng pagtatanim bilang matatag na pagkakalagay. Bagaman isahan ang hulaping Hebreo dahil kolektibong isahan ang Israel, mas natural sa Tagalog ang maramihang ‘sila.’
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: upang manirahan sila sa sarili nilang lugar
  rationale: Ang pandiwa at panghalip ay tumutukoy sa Israel bilang kolektibong bayan. Ipinahahayag ng ‘sa sarili nilang lugar’ ang idyomatikong diwa ng panatag na paninirahan, hindi ang literal na lokasyong ‘sa ilalim nito.’
- source_word: יִרְגַּז
  choice: magambala
  rationale: Saklaw ng רגז ang pagyanig, pagkabalisa, o paggambala. Sa konteksto ng seguridad ng bayan laban sa mga maniniil, ang ‘magambala’ ay malinaw ngunit hindi labis na tiyak.
- source_word: בְנֵי עַוְלָה
  choice: mga taong masama
  rationale: Ang literal na ‘mga anak ng kasamaan’ ay idyomang Hebreo para sa masasamang tao o gumagawa ng masama. Ang ‘mga taong masama’ ay natural sa Tagalog; inilalagay sa talababa ang literal na anyo upang mapanatili ang idyoma ng pinagmulan.
- source_word: לְעַנּוֹתוֹ
  choice: pahihirapan
  rationale: Ang Piel ng ענה ay maaaring mangahulugang pahirapan, apihin, o hamakin. Malawak at angkop sa konteksto ang ‘pahihirapan,’ nang hindi nililimitahan ang uri ng pang-aapi.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: gaya noong una
  rationale: Malapit ito sa temporal na paghahambing ng Hebreo at natural na tumutukoy sa naunang panahon ng pang-aapi.
theological_decisions:
- issue: Kolektibong isahan ang Israel sa mga pandiwa at hulaping panghalip sa Hebreo
  choice: Gamitin ang maramihang ‘sila’ sa Tagalog
  alternative: 'Panatilihin ang personipikasyong isahan: ‘siya’'
  rationale: Karaniwang ituring ng Hebreo ang isang bayan bilang kolektibong isahan. Sa Tagalog, mas malinaw at natural ang ‘sila’ kapag ang tinutukoy ay ang mga kabilang sa bayang Israel; pasyang pangwika ito at hindi doktrinal.
- issue: Idyomang בְנֵי עַוְלָה
  choice: Isalin sa pangunahing teksto bilang ‘mga taong masama’ at ilagay sa talababa ang literal na anyo
  alternative: Panatilihin sa pangunahing teksto ang ‘mga anak ng kasamaan’
  rationale: Ang literal na anyo ay maaaring mapagkamalang tumutukoy sa tunay na mga anak. Ang idyomatikong salin ay mas nauunawaan sa modernong Tagalog, samantalang pinananatili ng talababa ang anyo at puwersa ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang agrikultural na talinghagang ‘itatanim,’ iniwasan ang teknikal o makalumang pananalita, at isinalin nang idyomatiko ang Hebreong ‘mga anak ng kasamaan’ na may talababa para sa literal na anyo.
