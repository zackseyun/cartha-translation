base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: tl
  text: At kasama mo ako saan ka man pumunta, at inalis ko ang lahat ng iyong mga kaaway mula sa iyong harapan. At gagawin kong dakila ang iyong pangalan[a], tulad ng pangalan ng mga dakila[b] sa daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bibigyan kita ng dakilang katanyagan.” Ang “pangalan” sa Hebreo ay madalas tumukoy sa reputasyon o katanyagan.
    reason: lexical_alternative
  - marker: b
    text: O “tulad ng pangalan ng mga dakilang tao sa daigdig.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: At ako'y sumaiyo
  rationale: Ipinahahayag nito ang nakaraang presensiya at pagsuporta ng Diyos kay David. Ang “sumaiyo” ay likas at marangal na katumbas ng literal na “kasama mo.”
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: saan ka man pumunta
  rationale: Likas na Filipino para sa idyomang Hebreo na sumasaklaw sa lahat ng pinuntahan at pinagdaanan ni David.
- source_word: וָאַכְרִתָה
  choice: nilipol ko
  rationale: Sa konteksto ng mga kaaway, malinaw na naihahatid ng “nilipol” ang puwersa ng Hiphil ng כרת, na nangangahulugang alisin o puksain, nang hindi pilit na pinananatili ang di-likas na idyomang “pinutol.”
- source_word: מִפָּנֶיךָ
  choice: sa harapan mo
  rationale: 'Pinananatili ang larawang pangkalawakan ng Hebreo: inalis ng Diyos ang mga kaaway mula sa harapan o landas ni David.'
- source_word: וְעָשִׂיתִי לְךָ שֵׁם גָּדוֹל
  choice: At gagawin kong dakila ang iyong pangalan
  rationale: Ang hinaharap na “gagawin” ay angkop sa daloy mula sa mga nakaraang gawa tungo sa pangako. Pinananatili ng “pangalan” ang biblikal na idyoma para sa reputasyon o katanyagan.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: tulad ng pangalan ng mga dakila
  rationale: Inuulit ang “pangalan” gaya ng Hebreo at hindi nililimitahan ang substantibong pang-uri sa mga lalaki lamang.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: sa lupa
  rationale: Dito ay malawak ang paghahambing sa mga bantog sa daigdig, hindi lamang sa isang partikular na lupain; natural sa Filipino ang “sa lupa.”
theological_decisions:
- issue: Panahunan ng וְעָשִׂיתִי sa konteksto ng pangako ng Diyos
  choice: 'Hinaharap: “gagawin kong dakila ang iyong pangalan”'
  alternative: 'Ganap/nakaraan: “ginawa kong dakila ang iyong pangalan”'
  rationale: Bagaman qatal ang anyo, ang daloy ng talumpati ay mula sa pagsasalaysay ng mga nagawa na ng Diyos tungo sa ipinangangako niya; kaya pinakamalinaw sa Filipino ang hinaharap, habang kinikilala ang posibleng pagbasa bilang ganap na gawa.
- issue: Saklaw ng אֶרֶץ
  choice: “lupa,” sa diwang daigdig
  alternative: “lupain,” na maaaring tumukoy sa isang tiyak na teritoryo
  rationale: Ang paghahambing sa “mga dakila” ay tila pangkalahatan; gayunman, likas na may lawak ng kahulugan ang salitang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na idyomang “pangalan,” habang ipinaliwanag sa talababa ang kahulugang katanyagan. Ang “ako'y sumaiyo” ay bahagyang mataas ang rehistro ngunit natural sa tekstong banal; ang natitirang pangungusap ay tuwiran at pangkasalukuyang gamit.
