revisions:
- from: At ako'y sumaiyo saan ka man pumunta, at nilipol ko ang lahat ng iyong kaaway sa harapan mo. At gagawin kong dakila ang iyong pangalan[a], tulad ng pangalan ng mga dakila sa lupa.[b]
  to: At kasama mo ako saan ka man pumunta, at inalis ko ang lahat ng iyong mga kaaway mula sa iyong harapan. At gagawin kong dakila ang iyong pangalan[a], tulad ng pangalan ng mga dakila[b] sa daigdig.
  rationale: Pinalitan ang lipas na “sumaiyo” ng modernong “kasama mo ako,” at ang masyadong matinding “nilipol” ng “inalis” upang masaklaw ang kahulugan ng Hebreong pandiwa nang walang dagdag na pagpapakahulugan. Pinanatili ang hinaharap na “gagawin kong dakila” dahil promissory ang daloy. Inayos ang mga angkla ng talababa at ginamit ang “daigdig” para sa pangkalahatang saklaw ng “earth.”
