  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל נָתָ֣ן הַ/נָּבִ֔יא רְאֵ֣ה נָ֔א אָנֹכִ֥י יוֹשֵׁ֖ב בְּ/בֵ֣ית אֲרָזִ֑ים וַֽ/אֲרוֹן֙ הָֽ/אֱלֹהִ֔ים יֹשֵׁ֖ב בְּ/ת֥וֹךְ הַ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: tl
  text: At sinabi ng hari kay Natan na propeta, “Tingnan mo, nakatira ako sa isang bahay na yari sa sedro, ngunit ang Kaban ng Diyos ay nasa loob ng mga tabing[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ng isang tabing.” Ang salitang Hebreo ay tumutukoy sa tabing o telang pantakip ng tolda, malamang na nagpapahiwatig sa mga pantakip ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi labis na tinutukoy ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na titulo ang ginamit sa Hebreo; hindi kailangang idagdag ang pangalang David.
- source_word: נָתָן הַנָּבִיא
  choice: kay Natan na propeta
  rationale: Natural na appositional na pagkakakilanlan sa modernong Tagalog at pinananatili ang titulo.
- source_word: רְאֵה נָא
  choice: Tingnan mo
  rationale: Natural na panawag-pansin sa Tagalog; ang pakiusap na puwersa ng נָא ay banayad at hindi kailangang gawing tahasang “pakiusap.”
- source_word: אָנֹכִי יוֹשֵׁב
  choice: nakatira ako
  rationale: Ipinapahayag ang paninirahan, na siyang diwa ng יוֹשֵׁב sa paghahambing na ito, sa natural na Tagalog.
- source_word: בְּבֵית אֲרָזִים
  choice: sa isang bahay na yari sa sedro
  rationale: Nililinaw na ang sedro ang materyales o kahoy ng bahay, alinsunod sa construct phrase.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: ngunit ang Kaban ng Diyos
  rationale: Ang waw ay may puwersang paghahambing dito; ang “ngunit” ay malinaw na naghahambing sa tirahan ng hari at sa kinalalagyan ng Kaban.
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  choice: ay nasa loob ng mga tabing
  rationale: Sa Tagalog, hindi natural na sabihing “nakatira” ang Kaban. Ang “nasa” ay nagpapanatili sa diwa ng kinalalagyan, at ang “mga tabing” ay nagpapahayag sa kolektibong gamit ng singular na יְרִיעָה nang hindi ito ginagawang pangkalahatang “tolda.”
theological_decisions:
- issue: Ang pansamantalang kinalalagyan ng Kaban
  choice: “nasa loob ng mga tabing”
  alternative: “nasa loob ng tolda” o “nasa loob ng isang tabing”
  rationale: Partikular na binabanggit ng Hebreo ang יְרִיעָה, isang tabing o telang pantakip ng tolda. Pinananatili ng salin ang kongkretong larawan at hindi nagdaragdag ng mas huling teolohiya tungkol sa templo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Kaban ng Diyos” bilang malinaw na katawagan sa banal na kaban, at “sedro” bilang karaniwang salin sa pangalan ng kahoy. Iniwasan ang di-natural na personipikasyong “nakatira ang Kaban” habang pinananatili ang paghahambing ng dalawang kinalalagyan.
