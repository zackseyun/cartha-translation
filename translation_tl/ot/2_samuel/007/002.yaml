  source_fidelity: Tapat ang salin sa Hebreo. Napanatili ang daloy ng salaysay sa “At sinabi,” ang pagtukoy na “ang hari,” ang paghahambing sa pagitan ng bahay na sedro at ng kinalalagyan ng Kaban, at ang kongkretong larawan ng יְרִיעָה sa “mga tabing.” Ang “nasa loob” ay isang natural na paraan upang ipahayag ang lokasyon ng Kaban nang hindi di-natural na pinapersonipika ito.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Tingnan mo” ay angkop na panawag-pansin sa tuwirang pananalita, at ang “bahay na yari sa sedro” ay malinaw at idiomatiko. Maayos ring tunog ang “ngunit ang Kaban ng Diyos ay nasa loob ng mga tabing.”
  terminology: Wasto at pare-pareho ang “Natan na propeta,” “Kaban ng Diyos,” at “sedro.” Ang “mga tabing” ay isang katanggap-tanggap na kolektibong pagsasalin ng singular na Hebreong יְרִיעָה, at ang talababa ay wastong nagtatala ng alternatibong isahan at ng ugnayan nito sa mga pantakip ng tolda/tabernakulo.
