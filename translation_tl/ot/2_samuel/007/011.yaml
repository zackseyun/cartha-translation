base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: tl
  text: at mula noong araw na nagtalaga ako ng mga hukom upang mamahala sa bayan kong Israel. Ipinagkaloob ko sa iyo ang kapahingahan mula sa lahat ng iyong mga kaaway. Ipinahahayag din sa iyo ni Yahweh na si Yahweh ang gagawa ng isang bahay[a] para sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itatatag ni Yahweh ang isang sambahayan para sa iyo.” Dito, ang “bahay” ay maaaring tumukoy sa maharlikang angkan o dinastiya ni David, habang ipinapaalingawngaw din nito ang hangarin ni David na magtayo ng isang bahay, samakatuwid ay templo, para kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: at mula noong araw
  rationale: Pinananatili ang pang-ugnay at ang panahong pinagsisimulan ng parirala, na nakaugnay sa naunang pangungusap.
- source_word: צִוִּיתִי שֹׁפְטִים עַל עַמִּי יִשְׂרָאֵל
  choice: nagtalaga ako ng mga hukom upang mamahala sa bayan kong Israel
  rationale: Sa kontekstong ito, ang צוה ay tumutukoy sa pag-aatas o pagtatalaga sa mga hukom. Nililinaw ng “upang mamahala” ang diwa ng עַל nang hindi ginagawang simpleng lokasyong “sa ibabaw ng.”
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Ipinagkaloob ko sa iyo ang kapahingahan mula sa lahat ng iyong mga kaaway
  rationale: Ipinahahayag ng Hiphil ng נוח ang pagbibigay ng pahinga o katiwasayan; pinananatili ng salin ang Diyos bilang kumikilos.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: Ipinahahayag din sa iyo ni Yahweh
  rationale: Ang נגד sa Hiphil ay “magpahayag” o “magpabatid.” Ang “din” ay kumakatawan sa nag-uugnay na וְ at sa paglipat tungo sa kasunod na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: na si Yahweh ang gagawa ng isang bahay para sa iyo
  rationale: Pinananatili ng “bahay” at “gagawa” ang sadyang pag-uugnay sa templong nais ipagawa ni David at sa sambahayan o dinastiyang ipinapangako sa kaniya.
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinananatili ang tipanang pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kahulugan ng בַּיִת sa pangako kay David
  choice: bahay, na may diwang dinastiko ngunit hindi nilulutas ang talinghaga
  alternative: sambahayan, angkan, o dinastiya
  rationale: 'Sadyang naglalaro ang konteksto sa dalawang diwa ng “bahay”: gusali o templo at angkan o dinastiya. Ang “bahay” ang higit na nagpapanatili sa pampanitikan at teolohikal na pag-igting.'
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “bayan kong Israel” bilang natural na katumbas ng “aking bayan, Israel,” at pinanatili ang “bahay” upang hindi mawala ang dobleng kahulugan ng salitang Hebreo.
