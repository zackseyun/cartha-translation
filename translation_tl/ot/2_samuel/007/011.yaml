  terminology: Wastong ginagamit ang “Yahweh” para sa יהוה. Ang “bayan kong Israel,” “mga hukom,” at “bahay” ay angkop. Sa talababa, mas mabuting gamitin ang “magtayo” para sa hangarin ni David tungkol sa templo, at iwasan ang “malamang,” na hindi kailangan upang ipaliwanag ang sinadyang pampanitikang alusyon.
