  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: tl
  text: Sinabi ni Natan sa hari, “Humayo ka at gawin mo ang lahat ng nasa puso mo, sapagkat kasama mo si Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Natural na pagsasalaysay ito sa modernong Tagalog; ipinahihiwatig na ng pagkakasunod ng mga pangyayari ang puwersa ng waw-consecutive nang hindi kailangang idagdag ang “at.”
- source_word: נָתָן
  choice: Natan
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Tuwirang isinasalin ang pangngalang may pantukoy; hindi idinaragdag ang pangalang David, na wala sa mismong talata.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: ang lahat ng nasa puso mo
  rationale: Pinananatili ang idyomang Hebreo. Ang “puso” rito ay maaaring tumukoy sa kalooban, balak, o pasiya, hindi lamang sa damdamin.
- source_word: לֵךְ עֲשֵׂה
  choice: Humayo ka at gawin mo
  rationale: Ipinapahayag ng magkasunod na pautos ang pahintulot at paghikayat na isagawa ang balak; natural at marangal sa Tagalog ang “humayo ka at gawin mo.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng payo ni Natan sa malinaw at dignified na paraan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ito ng personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan iyon ng isang titulo.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Pinananatili ang payak na diwa ng presensiya at pagsama nang hindi tahasang dinaragdagan ng “sumusuporta sa iyo” o “panig sa iyo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pahayag na “kasama mo si Yahweh”
  choice: Pinanatili bilang payak na pahayag ni Natan
  alternative: Ipaliwanag bilang tiyak na pagsang-ayon ng Diyos sa planong ito
  rationale: Hindi nilulutas nang palihim ang tensiyon sa kasunod na salaysay, kung saan tumanggap si Natan ng karagdagang salita mula kay Yahweh. Isinasalin lamang dito ang sinabi ni Natan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang idyomang “nasa puso mo” dahil nauunawaan ito sa Tagalog at naihahatid ang mas malawak na diwa ng panloob na balak o kalooban.
