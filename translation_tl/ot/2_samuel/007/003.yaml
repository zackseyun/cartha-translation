  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Humayo ka at gawin mo” ay angkop na pagpapahayag ng paghikayat/pahintulot, at nauunawaan sa Tagalog ang “nasa puso mo” bilang balak o kalooban.
