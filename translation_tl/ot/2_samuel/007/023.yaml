source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: tl
  text: At sino ang tulad ng iyong bayan, tulad ng Israel—ang nag-iisang bansa sa lupa na pinaroonan ng Diyos upang tubusin para sa kanyang sarili bilang isang bayan, upang gumawa ng pangalan para sa kanyang sarili, at upang gawin para sa inyo ang mga dakilang at nakapangingilabot na bagay[a] para sa iyong lupain sa harap ng iyong bayan, na tinubos mo para sa iyong sarili mula sa Ehipto[b], mula sa mga bansa at sa kanilang mga diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dakila at kahanga-hangang bagay.” Ang salitang Hebreo ay maaaring tumukoy sa mga gawang pumupukaw ng paghanga, sindak, o takot.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang huling sugnay sa Hebreo. Maaari rin itong isalin na “mula sa Ehipto, sa mga bansa at sa diyos nito” o “mula sa Ehipto, sa mga bansa at mga diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: At sino ang tulad ng iyong bayan, tulad ng Israel
  rationale: Pinananatili ang retorikal na tanong at ang mariing pagkakakilanlan sa Israel nang hindi inaalis ang inuulit na paghahambing.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: ang nag-iisang bansa sa lupa
  rationale: Ipinahahayag ang natatanging kalagayan ng Israel sa konteksto ng retorikal na tanong.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: na pinuntahan ng Diyos
  rationale: Itinuturing ang אֱלֹהִים bilang tumutukoy sa Diyos ng Israel at pinananatili ang konkretong larawan ng pagparoon niya upang kumilos.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: upang tubusin para sa kanyang sarili bilang isang bayan
  rationale: Ang “tubusin” ay natural at tumpak para sa פדה, samantalang pinananatili ng natitirang parirala ang layunin at ugnayang ipinahahayag ng Hebreo.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: upang gumawa ng pangalan para sa kanyang sarili
  rationale: Natural na Filipino para sa idyomang tumutukoy sa pagtatamo ng pagkilala sa pamamagitan ng makapangyarihang mga gawa.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: at upang gawin para sa inyo
  rationale: Tahasan nitong pinananatili ang ikalawang panauhang maramihan na לָכֶם sa Masoretic Text.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: ang mga dakila at nakapangingilabot na bagay
  rationale: Ipinakikita ng “nakapangingilabot” na ang mga gawa ay pumupukaw hindi lamang ng paghanga kundi pati ng sindak o takot.
- source_word: לְאַרְצֶךָ מִפְּנֵי עַמְּךָ
  choice: para sa iyong lupain sa harap ng iyong bayan
  rationale: Pinananatili ang singular na “iyong” at ang spatial na diwa ng מִפְּנֵי, bagaman siksik at mahirap ang pagkakaugnay ng parirala.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: na tinubos mo para sa iyong sarili mula sa Ehipto
  rationale: Inuulit ang “tubusin” para sa inuulit na פדה at pinananatili ang biglang paglipat sa tuwirang pagtawag sa Diyos.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: mula sa mga bansa at sa kanilang mga diyos
  rationale: Ito ang pinakanauunawaang pagbasa sa konteksto ng mga bansang pinaalis sa harap ng Israel, ngunit inilalahad sa talababa ang tunay na hirap ng Hebreo.
theological_decisions:
- issue: Bilang at tinutukoy ng אֱלֹהִים
  choice: 'Isahan: “Diyos,” na tumutukoy sa Diyos ng Israel'
  alternative: 'Maramihan: “mga diyos”'
  rationale: Sa daloy ng panalangin, ang Diyos ng Israel ang kumikilos upang tubusin ang kanyang bayan; ang maramihang anyong morpolohikal ay hindi nangangailangan ng maramihang salin dito.
- issue: Paglipat mula sa ikatlong panauhan tungo sa ikalawang panauhan
  choice: Pinanatili ang “Diyos/kanyang” at pagkatapos ay “inyo/iyong/mo”
  alternative: Gawing pare-pareho ang lahat bilang ikalawang panauhan para sa mas makinis na Filipino
  rationale: Ang paglipat ng panauhan ay nasa Masoretic Text at maaaring mahalagang katangian ng retorika; hindi ito tahimik na pinakinis.
- issue: Mahirap na pangwakas na pariralang גּוֹיִם וֵאלֹהָיו
  choice: “mula sa mga bansa at sa kanilang mga diyos”
  alternative: “mula sa Ehipto, sa mga bansa at sa diyos nito” o “mula sa Ehipto, sa mga bansa at mga diyos”
  rationale: Ang pangunahing salin ay umaayon sa konteksto ng pagliligtas at pagpapalayas sa mga bansa, ngunit hindi tiyak ang sintaks at panlaping panghalip kaya pinananatili sa talababa ang ibang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mahabang retorikal na tanong, ang pag-uulit ng “para sa kanyang/iyong sarili,” ang paglipat ng panauhan, at ang bahagyang siksik na sintaks kung kinakailangan upang huwag ikubli ang mga tensiyon ng tekstong Hebreo.
