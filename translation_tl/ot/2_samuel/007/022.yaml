  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: tl
  text: Kaya, dakila ka, Panginoong Yahweh[a], sapagkat walang gaya mo, at walang Diyos maliban sa iyo[b], ayon sa lahat ng narinig namin mismo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Adonai YHWH,” isang tambalang tawag na pinagsasama ang titulong “Panginoon” at ang banal na pangalang Yahweh.'
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “walang Diyos bukod sa iyo” o “walang diyos maliban sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyon mula sa naunang panalangin at sa mga ginawa ng Diyos; likas at malinaw ang “Kaya” sa modernong Tagalog.
- source_word: גָּדַלְתָּ
  choice: dakila ka
  rationale: Maaaring ipahayag ng Qal perfect ang kinikilalang o namamalaging kadakilaan. Pinananatili ng “dakila ka” ang tuwirang papuri nang hindi dinaragdagan ang kahulugan.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili nito kapwa ang titulong Adonai at ang personal na pangalang YHWH, habang natural ang pagkakaugnay ng mga ito sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pahayag at angkop sa marangal na rehistro ng panalangin.
- source_word: אֵין כָּמוֹךָ
  choice: walang gaya mo
  rationale: Tuwirang ipinahahayag ng karaniwang Hebreong parirala ang kawalan ng sinumang maihahambing sa Diyos.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: at walang Diyos maliban sa iyo
  rationale: 'Ang זוּלָתֶךָ ay nagpapahayag ng pagbubukod: “maliban sa iyo” o “bukod sa iyo.” Pinananatili ng salin ang tahasang pagpapahayag na iisa lamang ang Diyos.'
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: ayon sa lahat ng narinig ng sarili naming mga tainga
  rationale: Pinananatili ng “ayon sa” ang ugnayang ipinahihiwatig ng pang-ukol, at ng “sarili naming mga tainga” ang mariing Hebreong idyoma nang maging natural sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalan sa tambalang אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS; Makapangyarihang PANGINOON
  rationale: Hayagang taglay ng teksto ang titulong Adonai at ang pangalang YHWH. Pinananatili ng “Panginoong Yahweh” ang pagkakaiba ng titulo at ng personal na pangalan nang hindi nagbubunga ng paulit-ulit na “Panginoong PANGINOON.”
- issue: Eksklusibong pahayag tungkol sa Diyos sa אֵין אֱלֹהִים זוּלָתֶךָ
  choice: walang Diyos maliban sa iyo
  alternative: walang ibang diyos bukod sa iyo
  rationale: Pinananatili nito ang tuwiran at ganap na pahayag ng teksto tungkol sa pagiging walang kapantay at tanging Diyos, nang hindi nagdaragdag ng pilosopikal o denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panalangin at papuri. Ginamit ang “sapagkat” at ang mariing “sarili naming mga tainga” upang mapanatili ang pormal na himig at diin ng Hebreo nang hindi maging lipas o matigas ang pananalita.
