base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: tl
  text: Sapagkat ikaw, Yahweh ng mga hukbo, Diyos ng Israel, ang nagpahayag nito sa iyong lingkod[a] nang sabihin mo, “Magtatayo ako ng bahay para sa iyo.”[b] Kaya naglakas-loob[c] ang iyong lingkod na idalangin sa iyo ang panalanging ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinunyag mo ang tainga ng iyong lingkod,” isang idyomang Hebreo na nangangahulugang ipinaalam o ipinahayag ito sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” ay maaari ring magpahiwatig ng sambahayan o dinastiya sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “natagpuan ng iyong lingkod ang kanyang puso,” ibig sabihin, nagkaroon siya ng lakas ng loob o matatag na pasiyang manalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  rationale: Tuwirang pinanatili ang pangalang Yahweh at isinalin ang צְבָאוֹת bilang “mga hukbo,” na malinaw sa makabagong Tagalog at maaaring tumukoy sa mga puwersang nasa ilalim ng kapangyarihan ng Diyos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Likas at tuwirang salin ng pariralang nagpapakilala sa Diyos kaugnay ng Israel.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: ang nagpahayag nito sa iyong lingkod
  rationale: Ang literal na “ibinunyag ang tainga” ay isang idyomang Hebreo para sa paghahayag o pagpapaalam. Ginawang natural sa Tagalog ang pangunahing teksto, habang inilagay sa talababa ang literal na larawan.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ang “lingkod” ay angkop sa mapagpakumbabang pananalita ni David sa harap ng Diyos at hindi labis na nagdidiin sa kahulugan ng pagkaalipin.
- source_word: לֵאמֹר
  choice: nang sabihin mo
  rationale: Pinanatili ang puwersang nagpapakilala sa tuwirang sipi, ngunit inayos sa natural na balangkas ng Tagalog.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Magtatayo ako ng bahay para sa iyo
  rationale: Pinanatili ang “bahay” upang huwag limitahan ang sadyang pag-uugnay nito sa literal na gusali at sa sambahayan o dinastiya ni David.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Malinaw at natural na ipinahahayag ang bunga ng paghahayag ng Diyos sa panalangin ni David.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: naglakas-loob
  rationale: Natural na idyomang Tagalog na naghahatid ng diwang nagkaroon si David ng tapang o paninindigang manalangin, habang itinatala sa talababa ang literal na Hebreo.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: na idalangin sa iyo ang panalanging ito
  rationale: Tuwiran at dignified na salin na nagpapanatili sa Diyos bilang pinatutungkulan ng tiyak na panalanging ito.
theological_decisions:
- issue: Idyoma ng banal na paghahayag
  choice: “nagpahayag nito sa iyong lingkod” sa pangunahing teksto
  alternative: “ibinunyag mo ang tainga ng iyong lingkod”
  rationale: Ang literal na larawan ay malabo sa karaniwang mambabasang Tagalog. Ang napiling salin ay naghahatid ng kahulugan nang hindi inaalis ang literal na anyo sa talababa.
- issue: Kahulugan ng “bahay”
  choice: Pinanatili ang salitang “bahay” nang hindi tinukoy bilang templo o dinastiya.
  alternative: “templo” o “dinastiya/sambahayan”
  rationale: Sa konteksto ng tipan kay David, may mahalagang pagtutugma ng literal na bahay at ng dinastikong sambahayan. Ang mas tiyak na salin ay maaaring magpasya sa isang kahulugang hindi nililimitahan ng Hebreo.
- issue: Idyoma ng pagkakaroon ng loob
  choice: “naglakas-loob”
  alternative: “natagpuan ang kanyang puso”
  rationale: Ipinahahayag ng natural na Tagalog ang tapang o paninindigang ipinahihiwatig ng idyoma, ngunit pinananatili sa talababa ang literal na anyo upang makita ang pinagmulan ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Yahweh” bilang transliterasyon ng banal na pangalan at “mga hukbo” bilang madaling maunawaang anyo ng tradisyonal na titulong Hebreo. Iniwasan ang sobrang literal na mga idyomang magiging malabo sa Tagalog, ngunit pinanatili ang mga ito sa mga talababa.
