  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: tl
  text: At ano pa ang masasabi ni David sa iyo? Kilala mo ang iyong lingkod, Panginoong Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: At ano pa ang masasabi ni David sa iyo?
  rationale: Ang literal na diwa na “ano pa ang maidaragdag ni David na sabihin” ay likas na ipinahahayag sa modernong Tagalog bilang retorikal na tanong na “ano pa ang masasabi.” Pinanatili ang “At” upang ipakita ang pagpapatuloy ng panalangin.
- source_word: וְאַתָּה יָדַעְתָּ
  choice: Kilala mo
  rationale: Ang pandiwang ידע rito ay tumutukoy sa pagkakilala ng Diyos sa lingkod niya. Ang “Kilala mo” ay natural at malinaw sa Tagalog, at pinananatili ang diin sa “mo” na nasa tahasang panghalip na Hebreo.
- source_word: עַבְדְּךָ
  choice: ang iyong lingkod
  rationale: Sa panalanging makahari, ang עבד ay mapagpakumbabang pagtukoy ni David sa sarili bilang lingkod ng Diyos; “lingkod” ang angkop na salin kaysa “alipin” sa kontekstong ito.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili ng “Panginoon” ang titulong אֲדֹנָי at ng “Yahweh” ang personal na pangalang tipan na יהוה, nang hindi lumilikha ng paulit-ulit na “Panginoong PANGINOON.”
theological_decisions:
- issue: Paglilipat ng tambalang banal na titulo אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS; Panginoong PANGINOON
  rationale: Malinaw na pinaghihiwalay ng salin ang titulong Adonai at ang pangalang YHWH. Hindi nito itinatago ang personal na pangalan sa likod ng kapalit na titulong “DIYOS,” at iniiwasan ang hindi likas na pag-uulit.
- issue: Saklaw ng pagkakilala ng Diyos sa “iyong lingkod”
  choice: Kilala mo ang iyong lingkod
  alternative: Nalalaman mo ang iyong lingkod
  rationale: Hindi dinaragdagan ng salin kung ano mismo ang nalalaman ng Diyos—ang pagkatao, puso, o kalagayan ni David—kaya napapanatili ang malawak na pahayag ng tekstong Hebreo.
translation_notes:
  register: Makabago, marangal, at likas na Filipino. Ginamit ang “masasabi” para sa idyomang Hebreo at “Kilala mo” para sa natural na personal na diwa ng ידע. Ang pangungusap ay nananatiling tuwirang panalangin ni David.
