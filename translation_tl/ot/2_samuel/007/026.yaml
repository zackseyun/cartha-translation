  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: tl
  text: At nawa’y maging dakila magpakailanman ang pangalan mo[a], sa pagsasabing, “Si Yahweh ng mga hukbo ang Diyos na namumuno sa Israel.” At nawa’y maging matatag sa harap mo ang sambahayan[b] ng lingkod mong si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nawa’y dakilain magpakailanman ang pangalan mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” dito ay tumutukoy sa pamilya o dinastiya ni David, hindi lamang sa isang pisikal na gusali.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: At nawa’y maging dakila
  rationale: Ang di-ganap na pandiwa sa konteksto ng panalangin ay nagpapahayag ng kahilingan. Likas sa Tagalog ang “nawa’y maging dakila,” at hindi nito ipinapalagay ang tahasang balintiyak na anyo na wala sa Hebreo.
- source_word: שִׁמְךָ
  choice: ang pangalan mo
  rationale: Pinananatili ang Hebreong idyoma, na maaaring tumukoy sa reputasyon, karangalan, o nahayag na pagkakakilanlan ng Diyos nang hindi ito nililimitahan sa isa lamang sa mga kahulugang iyon.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na katumbas sa Tagalog para sa walang-hanggang pagpapatuloy.
- source_word: לֵאמֹר
  choice: at sabihin ng mga tao
  rationale: Ginagawang malinaw sa natural na Tagalog ang di-tiyak na nagsasalita na ipinahihiwatig ng Hebreong panandang pambanggit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili ang malawak na larawan ng mga hukbo o karamihang nasa ilalim ng kapangyarihan ni Yahweh.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: ang Diyos na naghahari sa Israel
  rationale: Ipinahahayag ang pinakanatural na diwa ng עַל bilang kapamahalaan o paghahari, habang iniiwasan ang malabong lokatibong tunog ng “Diyos sa Israel.”
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: At ... ang sambahayan ng lingkod mong si David
  rationale: Ang “sambahayan” ay natural na salin ng בַּיִת sa diwang kabilang ang pamilya at angkan; ipinaliliwanag sa talababa ang dinastikong saklaw nito.
- source_word: יִהְיֶה נָכוֹן
  choice: nawa’y maging matatag
  rationale: Pinagsasama nito ang panalanging puwersa ng konteksto at ang diwa ng katatagan, katiyakan, at pagkakatatag.
- source_word: לְפָנֶיךָ
  choice: sa harapan mo
  rationale: Tuwirang pinananatili ang relasyonal at tipanang larawan ng Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon.”
- issue: Kahulugan ng “bahay” sa pangako kay David
  choice: sambahayan, na may paliwanag na tumutukoy sa angkan o dinastiya
  alternative: dinastiya
  rationale: Iniiwasan ng “sambahayan” ang maling pagkaunawang gusali lamang ito, ngunit hindi rin lubusang pinapawi ang mahalagang paglalaro sa salitang “bahay” sa buong kabanata.
- issue: Puwersa ng mga pandiwang וְיִגְדַּל at יִהְיֶה
  choice: kahilingan sa panalangin sa pamamagitan ng “nawa”
  alternative: payak na pahayag tungkol sa hinaharap
  rationale: Ang agarang konteksto ay panalangin ni David, kaya malamang na bolitibo ang mga anyo; gayunman, hindi dinaragdagan ang teksto ng katiyakang higit sa ipinahihiwatig nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinili ang “nawa’y” upang natural na maipahayag ang panalangin; ang “Yahweh ng mga hukbo” ay sadyang nagpapanatili sa anyo at lawak ng Hebreong banal na titulo. Inilipat ang marker [b] sa “sambahayan,” na siyang aktuwal na tinutukoy ng talababa.
