  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: tl
  text: Ngunit ang matapat kong pag-ibig ay hindi aalis sa kanya[a], gaya ng inalis ko ito mula kay Saul, na inalis ko mula sa harap mo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking kagandahang-loob” o “aking katapatan sa tipan.” Ang salitang Hebreo ay tumutukoy sa matatag at tapat na pag-ibig sa loob ng isang tipanang ugnayan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “na inalis ko mula sa harap mo.” Maaaring tumukoy ito sa pag-aalis kay Saul sa kanyang katungkulan kaugnay ni David, hindi lamang sa pisikal na paglayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: aking tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy rito sa matatag at tapat na pag-ibig sa loob ng isang tipanang ugnayan; likas sa makabagong Tagalog ang “tapat na pag-ibig” at hindi nito nililimitahan ang kahulugan sa awa lamang.
- source_word: יָסוּר
  choice: hindi lalayo
  rationale: Ang סור ay maaaring mangahulugang lumihis, lumayo, o maalis. Dahil ang paksa ay “tapat na pag-ibig,” malinaw at natural ang “hindi lalayo.”
- source_word: מִמֶּנּוּ
  choice: sa kanya
  rationale: Ipinahihiwatig ng מִן ang paglayo mula sa tinutukoy na anak o maharlikang supling; sa Tagalog, natural na saklaw ito ng pariralang “lalayo sa kanya.”
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Pinananatili nito ang tahasang paghahambing sa nangyari kay Saul.
- source_word: הֲסִרֹתִי
  choice: pag-aalis ko / inalis ko
  rationale: Ang Hiphil ng סור ay causative at nangangahulugang alisin. Ang dalawang anyong Tagalog ay umaangkop sa kani-kanilang sugnay habang pinananatili ang pag-uugnay ng magkaparehong pandiwang Hebreo.
- source_word: מֵעִם שָׁאוּל
  choice: kay Saul
  rationale: Sa sugnay na “pag-aalis ko nito kay Saul,” malinaw na ang tapat na pag-ibig ang inalis mula kay Saul; natural ito sa Tagalog at hindi nagpapalabis ng interpretasyon.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: na inalis ko sa harap mo
  rationale: Pinananatili ng “sa harap mo” ang larawang literal ng מִלְּפָנֶיךָ at hindi ito tahasang nilulutas bilang pagkawala sa pagkahari o pisikal na pag-alis lamang.
theological_decisions:
- issue: Kalikasan ng חֶסֶד sa konteksto ng tipan kay David
  choice: tapat na pag-ibig
  alternative: awa; kagandahang-loob; katapatan sa tipan
  rationale: Ipinakikita ng konteksto ang nananatiling paglingap at katapatan ng Diyos sa ipinangakong linya ni David. Ang “tapat na pag-ibig” ay nagpapanatili sa relasyonal at tipanang bigat nang hindi nagpapasok ng mas makitid na pormulang doktrinal.
- issue: Tinutukoy ng “sa harap mo”
  choice: Panatilihin ang Hebreong larawan bilang “sa harap mo.”
  alternative: mula sa iyong presensya; mula sa pagiging hari sa harap mo
  rationale: Malinaw na may kinalaman ito sa pag-aalis kay Saul kaugnay ni David, ngunit hindi tinutukoy ng parirala kung posisyon, presensya, o pareho ang pangunahing diin. Pinananatili ng salin ang tunay na kaluwagan ng pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ngunit” para sa malinaw na pagsalungat, “tapat na pag-ibig” para sa tipanang bigat ng חֶסֶד, at “sa harap mo” upang mapanatili ang Hebreong larawan at kaluwagan ng kahulugan.
