  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: tl
  text: Ako ay magiging ama niya, at siya ay magiging anak ko. Kapag siya ay magkasala, didisiplinahin ko siya sa pamamagitan ng pamalo ng mga tao at ng mga hampas ng mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “mga hampas ng mga anak ng tao.” Ang pariralang Hebreo ay isang idyoma para sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Ako ay magiging ama niya
  rationale: Ipinahahayag ng konstruksiyong may ל ang ugnayang ama-anak. Ang “magiging ama niya” ay likas sa modernong Tagalog at pinananatili ang pormulang pangtipan.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: at siya ay magiging anak ko
  rationale: Pinananatili nito ang katumbas at tugunang pahayag ng ugnayan nang hindi nagdaragdag ng interpretasyon.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Kapag gumawa siya ng kasamaan
  rationale: Sa kontekstong ito, ipinakikilala ng אֲשֶׁר ang kalagayang magaganap kapag nagkasala ang anak. Ang “kapag” ay hindi kasing-kondisyonal ng “kung,” at ang “gumawa ng kasamaan” ay nagpapanatili sa bigat moral ng ugat na עוה.
- source_word: וְהֹכַחְתִּיו
  choice: didisiplinahin ko siya
  rationale: Ang Hiphil ng יכח ay tumutukoy rito sa pagtutuwid o pagdidisiplina, gaya ng nililinaw ng kasunod na mga larawan ng pamalo at mga hampas.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: sa pamamagitan ng pamalo ng mga tao
  rationale: Pinananatili ng “pamalo” ang metapora ng שֵׁבֶט at iniiwang bukas kung karaniwang paraang pantao o mga taong instrumento ng pagdidisiplina ang tinutukoy.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: at ng mga hampas ng mga anak ng tao
  rationale: Ang “mga hampas” ay malinaw na katumbas ng נְגָעִים sa kontekstong ito. Pinananatili sa pangunahing teksto ang anyong Hebreo na “mga anak ng tao,” habang ibinibigay sa talababa ang mas idyomatikong pagpapahayag.
theological_decisions:
- issue: Saklaw ng pangakong pagiging anak kaugnay ng maharlikang angkan ni David at ng kalaunang mesiyanikong paggamit nito
  choice: Isinalin ang talata ayon sa tuwirang konteksto nito tungkol sa anak o haring mula kay David, nang hindi nagdaragdag ng tahasang mesiyanikong paliwanag.
  alternative: Gawing tahasang tumutukoy sa Mesiyas ang pangunahing teksto.
  rationale: Ang pahayag ay unang gumaganap sa tipan kay David tungkol sa kanyang supling. Pinananatili ng salin ang pananalita at teolohikal na puwang para sa kalaunang paggamit nito sa Kasulatan nang hindi ipinapasok iyon sa mismong teksto.
- issue: Kung kondisyonal o inaasahang pangyayari ang paggawa ng kasamaan
  choice: Kapag gumawa siya ng kasamaan
  alternative: Kung gumawa siya ng kasamaan
  rationale: Ang אֲשֶׁר kasama ng kasunod na anyo ay likas na naglalahad ng pagkakataon o kalagayan. Ang “kapag” ay nagpapanatili sa temporal na diin at hindi labis na nagpapalakas sa kondisyunal na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang karaniwang “ama niya” at “anak ko” sa halip na piliting tularan ang konstruksiyong Hebreo. Sadyang pinanatili ang bahagyang di-karaniwang “pamalo ng mga tao” at “mga anak ng tao” upang huwag paliitin ang posibleng kahulugan ng mga instrumentong pantao o mga taong tagapagdulot ng disiplina.
