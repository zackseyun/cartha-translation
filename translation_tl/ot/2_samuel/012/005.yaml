  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: tl
  text: Nag-alab nang matindi ang galit ni David laban sa lalaki. Sinabi niya kay Natan, “Buhay si Yahweh, ang lalaking gumawa nito ay anak ng kamatayan[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ng kamatayan,” ibig sabihin, isang taong karapat-dapat mamatay o nararapat hatulan ng kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Nag-alab ... ang galit
  rationale: Pinananatili nito ang matinding larawan ng Hebreong idyoma na literal na nagsasabing ‘nag-alab ang galit,’ at natural pa rin sa makabagong Filipino.
- source_word: בָּאִישׁ
  choice: laban sa lalaki
  rationale: Ipinakikita ng pang-ukol na ang lalaki ang pinatutungkulan ng galit ni David; ang ‘laban sa’ ay malinaw at angkop sa mapanghatol na tono.
- source_word: מְאֹד
  choice: nang matindi
  rationale: Tuwirang inilalahad ang pampatinding pang-abay upang hindi mawala ang lakas ng pahayag.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Ito ay maikli at natural na katumbas sa Filipino ng karaniwang Hebreong pormula ng panunumpa, habang pinananatili ang literal na pahayag na buhay si Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: tuwirang pahayag pagkatapos ng panunumpa
  rationale: Dito, ipinakikilala ng כִּי ang nilalaman ng pahayag na pinagtitibay ng panunumpa; hindi kailangan ng hiwalay na salitang katumbas sa natural na Filipino.
- source_word: בֶן מָוֶת
  choice: anak ng kamatayan
  rationale: Pinananatili ang kapansin-pansing Hebreong idyoma at ang bigat ng hatol; ipinaliliwanag sa talababa ang idiomatikong kahulugan nito.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tinutukoy ng tiyak na pangngalan ang mayamang lalaki sa talinghaga ni Natan.
- source_word: הָעֹשֶׂה זֹאת
  choice: na gumawa nito
  rationale: Malinaw na isinasalin ng sugnay na panuring ang Hebreong participle na kumikilala sa nagkasala ayon sa ginawa niya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo.
- issue: Literal o idiomatikong pagsasalin ng בֶן מָוֶת
  choice: anak ng kamatayan
  alternative: karapat-dapat mamatay; dapat patayin
  rationale: Pinananatili sa pangunahing teksto ang tunay na anyo at lakas ng Hebreong idyoma, ngunit nililinaw sa talababa ang kahulugan upang hindi ito mapagkamalang literal na ugnayang pampamilya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang matingkad na larawang Hebreo—ang pag-aalab ng galit at ang ‘anak ng kamatayan’—habang nilinaw sa talababa ang di-pamilyar na idyoma.
