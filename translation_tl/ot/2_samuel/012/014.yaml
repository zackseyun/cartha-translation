  source_fidelity: 'Tumpak na pinananatili ng pangunahing teksto ang mahirap ngunit tuwirang MT na pagbasa: si David ang lubos na humamak sa “mga kaaway ni Yahweh.” Naipapahayag din ang mariing katiyakan ng מוֹת יָמוּת sa “tiyak na mamamatay.” Gayunman, ang “anak” ay hindi tahasang naipapasa ang panlalaking kahulugan ng הַבֵּן; ligtas at natural itong maitama bilang “anak mong lalaki.”'
  naturalness: Marangal at karaniwang modernong Filipino Tagalog ang pangungusap. Mas malinaw at mas likas ang “dahil sa bagay na ito, ...” na may kuwit. Ang binagong talababa ay mas direkta at idiomatiko kaysa “Ganito rin ang salin ng marami.”
