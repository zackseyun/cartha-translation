    rationale: Ang “anak” sa Tagalog ay walang kasarian, samantalang ang Hebreong בֵּן ay “anak na lalaki.” Ang “anak mong lalaki” ay natural at pinananatili ang semantikong detalye nang walang dagdag na interpretasyon.
