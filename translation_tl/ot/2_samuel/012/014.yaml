base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: tl
  text: Gayunman[a], dahil sa bagay na ito, lubos mong hinamak ang mga kaaway ni Yahweh, ang anak mong lalaki na isinilang sa iyo ay tiyak na mamamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maraming salin ang nagsasalin sa sugnay na ito bilang “binigyan mo ang mga kaaway ni Yahweh ng dahilan upang humamak” o “upang lumapastangan,” batay sa isang interpretatibo o emendadong pagbasa ng mahirap na tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Gayunman
  rationale: Ipinahahayag nito ang mariing pagsalungat o paglilimita kasunod ng naunang pahayag ng kapatawaran.
- source_word: כִּי
  choice: dahil
  rationale: Malinaw nitong ipinakikilala ang dahilan ng kaparusahang ipinahayag.
- source_word: נִאֵץ נִאַצְתָּ
  choice: lubos mong hinamak
  rationale: Pinananatili ng “lubos” ang mariing puwersa ng infinitive absolute na kasunod ng pandiwang may kaparehong ugat; likas at marangal sa modernong Tagalog ang “hinamak.”
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: ang mga kaaway ni Yahweh
  rationale: Tuwirang pinananatili ang mga kaaway ni Yahweh bilang layon ng kilos ayon sa ibinigay na tekstong Masoretiko, sa halip na palitan ito ng isang interpretatibo o emendadong pagbasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan na kinakatawan ng Tetragrammaton sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בַּדָּבָר הַזֶּה
  choice: sa bagay na ito
  rationale: Sapat ang lawak ng “bagay” upang tumukoy sa buong pangyayari o ginawang tinatalakay nang hindi ito labis na nililinaw.
- source_word: גַּם
  choice: ang anak
  rationale: Hindi hiwalay na isinalin ang partikula sapagkat naipahihiwatig na ng ayos ng pangungusap ang pagdaragdag o pagbibigay-diin, at magiging pilit dito ang “gayundin.”
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: ang anak na isinilang sa iyo
  rationale: Pinananatili ang tiyak na kahulugang “anak na lalaki” ng בֵּן sa konteksto sa pamamagitan ng “anak,” habang natural na isinasalin ang pasibong participle bilang “isinilang sa iyo.”
- source_word: מוֹת יָמוּת
  choice: tiyak na mamamatay
  rationale: Ipinahahayag ng “tiyak” ang mariing katiyakan ng infinitive absolute na kasama ng imperfect.
theological_decisions:
- issue: Paksa at layon sa sugnay tungkol sa “mga kaaway ni Yahweh”
  choice: 'Pagbasang nakabatay sa MT: lubos na hinamak ni David ang “mga kaaway ni Yahweh.”'
  alternative: 'Interpretatibo o emendadong pagbasa: binigyan ni David ang “mga kaaway ni Yahweh” ng pagkakataong humamak o lumapastangan.'
  rationale: Sa anyo ng ibinigay na tekstong Hebreo, ang pariralang “mga kaaway ni Yahweh” ang pinakatuwirang layon ng pandiwa. Dahil mahirap ang diwa nito sa konteksto, inilalahad sa talababa ang laganap na alternatibo sa halip na tahimik na ipalit iyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang “Yahweh” bilang pangalan ng Diyos at ang sadyang mahirap na pagbasa ng tekstong Masoretiko; ipinaliwanag ang karaniwang alternatibo sa talababa.
