translation:
  language: tl
  text: At dapat siyang magbigay ng apat-na-ulit na kabayaran para sa babaeng tupa, sapagkat ginawa niya ang bagay na ito at hindi siya naawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi siya nagpakita ng habag.” Ang pandiwang Hebreo ay maaari ring magpahiwatig ng hindi pagpaparaya o hindi pagpipigil sa pananakit dahil sa awa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: ang babaeng tupa
  rationale: Tiyak na tumutukoy ang כִּבְשָׂה sa isang babaeng tupa. Likas at malinaw sa modernong Filipino ang “babaeng tupa,” at pinananatili nito ang kasarian ng hayop sa salaysay.
- source_word: יְשַׁלֵּם
  choice: babayaran niya
  rationale: Ang Piel ng שׁלם dito ay tumutukoy sa pagbabayad bilang kabayaran o pagsasauli. Sa konteksto ng hatol ni David, ipinahihiwatig ng anyong Filipino ang itinakdang pananagutan.
- source_word: אַרְבַּעְתָּיִם
  choice: nang apat na ulit
  rationale: Ang anyong pamilang ay nangangahulugang apat na beses na kabayaran. Karaniwan at madaling maunawaan sa Filipino ang “nang apat na ulit.”
- source_word: עֵקֶב אֲשֶׁר
  choice: sapagkat
  rationale: Ipinakikilala ng parirala ang dahilan ng hatol; ang “sapagkat” ay natural, malinaw, at marangal ang rehistro.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: ginawa niya ang bagay na ito
  rationale: Pinananatili ng “bagay na ito” ang malawak na saklaw ng דָּבָר nang hindi ito nililimitahan sa isang mas tiyak na interpretasyon gaya ng “kasalanan” o “krimen.”
- source_word: לֹא חָמָל
  choice: hindi siya naawa
  rationale: Maaaring ipahiwatig ng חמל ang hindi pananakit o pagpaparaya dahil sa awa. Sa kontekstong ito, natural na ipinapahayag ng “hindi siya naawa” ang kawalan ng habag habang pinananatili sa talababa ang alternatibong diin na “hindi niya pinaligtas.”
