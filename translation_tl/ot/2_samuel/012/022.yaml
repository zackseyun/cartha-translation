  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: tl
  text: Sinabi niya, “Habang buhay pa ang bata, nag-ayuno ako at umiyak, sapagkat sinabi ko, ‘Sino ang nakaaalam? Baka kahabagan ako ni Yahweh at mabuhay ang bata.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: Habang buhay pa ang bata
  rationale: Likas na salin sa modernong Tagalog na pinananatili ang nagpapatuloy ngunit nanganganib na kalagayan ng bata.
- source_word: צַמְתִּי
  choice: nag-ayuno ako
  rationale: Tuwirang katumbas ng pandiwang tumutukoy sa pag-aayuno.
- source_word: וָאֶבְכֶּה
  choice: at umiyak
  rationale: Karaniwan at marangal na Tagalog para sa pagluha o pagtangis, nang hindi pinalalabis ang diwa.
- source_word: כִּי אָמַרְתִּי
  choice: sapagkat sinabi ko
  rationale: Ipinakikita ang sanhi ng pag-aayuno at pag-iyak habang pinananatili ang dignidad ng salaysay.
- source_word: מִי יוֹדֵעַ
  choice: Sino ang nakaaalam?
  rationale: Pinananatili ang idyomatikong tanong at ang tunay na kawalang-katiyakan ni David.
- source_word: יְחָנֵּנִי
  choice: baka kahabagan ako
  rationale: Ang חנן ay tumutukoy sa mapagbiyayang pagkiling o awa. Ang 'baka' ay natural na naghahayag ng inaasam ngunit hindi tiyak na tugon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְחַי הַיָּלֶד
  choice: at mabuhay ang bata
  rationale: Sa saklaw ng 'baka,' ipinahahayag nito ang inaasam na posibilidad at hindi isang tiyak na resulta.
theological_decisions:
- issue: Paglalapat sa pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Antas ng katiyakan sa pag-asa ni David
  choice: Baka kahabagan ako ni Yahweh at mabuhay ang bata
  alternative: Kahabagan ako ni Yahweh at mabubuhay ang bata
  rationale: Ang 'Sino ang nakaaalam?' at ang anyo ng pahayag ay nagpapakita ng pag-asa sa gitna ng kawalang-katiyakan, hindi ng katiyakan o pag-aangkin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'nakaaalam' bilang wastong anyong may pag-uulit ng patinig, at ang 'baka' upang idiomatikong dalhin sa parehong kasunod na sugnay ang kawalang-katiyakan.
