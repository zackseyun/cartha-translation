base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: tl
  text: At nagpadala siya ng mensahe sa pamamagitan ng propetang si Natan[a], at pinangalanan niya siyang Jedidias[b], dahil kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kamay ng propetang si Natan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Jedidias ay malamang na nangangahulugang “minamahal ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpadala siya ng mensahe
  rationale: Ang pandiwa ay literal na “nagpadala.” Sa kasunod na pariralang nagsasaad na ginawa ito sa pamamagitan ni Natan, likas sa modernong Tagalog na linawin ang ipinahihiwatig na mensahe.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: sa pamamagitan ng propetang si Natan
  rationale: Ang literal na idyomang “sa kamay ni” ay tumutukoy rito sa ahensiya o tagapamagitan; malinaw at natural itong ipinahahayag ng “sa pamamagitan ng.”
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: pinangalanan niya ang bata
  rationale: Ang Hebreong “tinawag ang pangalan niya” ay karaniwang idyoma para sa pagbibigay ng pangalan. Ang “pinangalanan” ang natural na katumbas sa Tagalog, at ang “ang bata” ay nilinaw mula sa konteksto.
- source_word: יְדִידְיָהּ
  choice: Jedidias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal; ang kahulugan ng pangalan ay inilagay sa talababa.
- source_word: בַּעֲבוּר
  choice: dahil kay
  rationale: Ipinahahayag nito ang dahilan o batayan ng pagpapangalan. Pinananatili ng “dahil kay” ang maikli at bahagyang bukas na ugnayan ng parirala sa pinagmulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
theological_decisions:
- issue: Simuno ng “nagpadala” at “pinangalanan”
  choice: Si Yahweh ang ipinahihiwatig na simuno ng dalawang pandiwa.
  alternative: Maaaring unawain na si Natan ang nagpangalan, bilang tagapamagitan ni Yahweh.
  rationale: Sa naunang sugnay ng konteksto, si Yahweh ang huling tahasang simuno, at ang pariralang “sa pamamagitan ng propetang si Natan” ay nagpapakilala kay Natan bilang tagapamagitan. Gayunman, hindi dinagdagan ang salin ng tahasang “si Yahweh” bilang simuno, kaya nananatili ang anyo at bahagyang sintaktikong puwang ng Hebreo.
- issue: Kaugnayan ng pariralang בַּעֲבוּר יְהוָה
  choice: dahil kay Yahweh
  alternative: alang-alang kay Yahweh
  rationale: Ang “dahil kay Yahweh” ay nagpapanatili sa dahilan o batayang ipinahihiwatig ng בַּעֲבוּר nang hindi tiyakang ipinapaliwanag kung ito ay dahil sa pag-ibig ni Yahweh, sa kanyang utos, o sa ibang kaugnay na dahilan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “propetang si Natan” at “pinangalanan” bilang mga likas na anyo, habang pinanatili ang personal na pangalang Yahweh at ang maikling sanhiing parirala ng Hebreo.
