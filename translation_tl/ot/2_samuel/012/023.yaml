  to: Pero ngayon, patay na siya. Bakit pa ako mag-aayuno? Maibabalik ko pa ba siya? Ako ang pupunta sa kanya[a], pero hindi siya babalik sa akin.
  rationale: Idinagdag ang “pa” sa unang retorikal na tanong upang maisalin ang unang עוֹד bilang pagpapatuloy ng pag-aayuno (“any longer”). Pinakinis din ang unang pangungusap sa modernong natural na Tagalog. Walang idinagdag na paliwanag ukol sa kalagayan ng bata o ni David pagkatapos ng kamatayan.
