  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: tl
  text: Pero ngayon, patay na siya. Bakit pa ako mag-aayuno? Maibabalik ko pa ba siya? Ako ang pupunta sa kanya[a], pero hindi siya babalik sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako ay patungo sa kanya.” Ang participle sa Hebreo ay maaari ring magpahayag ng hinaharap na tiyak na mangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Pero ngayong
  rationale: Ipinahihiwatig nito ang malinaw na pagbabago sa tugon ni David matapos mamatay ang bata; natural sa Tagalog ang panandang pasalungat na “Pero ngayong.”
- source_word: מֵת
  choice: patay na siya
  rationale: Inilalarawan ng Hebreo ang kasalukuyang kalagayan bunga ng pagkamatay. Ang “patay na siya” ay tuwiran at natural.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: bakit ako mag-aayuno?
  rationale: Ipinapahayag nito ang retorikal na tanong kung bakit ipagpapatuloy pa ni David ang pag-aayuno, nang hindi inuulit sa pariralang ito ang עוֹד na kasunod ng “ibalik.”
- source_word: הַאוּכַל
  choice: Maibabalik ko ... ba
  rationale: Ang anyong tanong ay tungkol sa kakayahan o posibilidad. Likas sa Tagalog ang paggamit ng “maibabalik ... ba” sa kontekstong ito.
- source_word: לַהֲשִׁיבוֹ עוֹד
  choice: Maibabalik ko pa ba siya
  rationale: Ang Hiphil ng שוב ay “pangyarihing bumalik,” kaya ang “ibalik” ay tumpak; ipinahahayag ng “pa” ang עוֹד at ang imposibilidad na mapanumbalik ang bata sa buhay.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Ako ang pupunta sa kanya
  rationale: Pinananatili ng “Ako ang” ang hayag at mariing panghalip, samantalang natural na ipinahahayag ng “pupunta” ang tiyak na hinaharap na maaaring taglayin ng participle.
- source_word: וְהוּא לֹא יָשׁוּב אֵלָי
  choice: pero hindi siya babalik sa akin
  rationale: Ipinakikita ng “pero” ang matinding pagsalungat sa dalawang direksiyon ng pagpunta; pinananatili ng “babalik” ang ugnayang leksikal sa naunang “maibabalik.”
theological_decisions:
- issue: Kung ipinahihiwatig ba ng sinabi ni David ang mulat na muling pagkikita nila ng namatay na bata sa kabilang buhay
  choice: Isinalin nang tuwiran bilang “Ako ang pupunta sa kanya,” nang hindi nililinaw kung ano ang kalikasan ng pagpuntang iyon.
  alternative: Maaaring tumukoy lamang ito sa pagkamatay ni David at pagpunta niya sa kinaroroonan ng mga patay, o maaaring unawain bilang pahiwatig ng personal na muling pagkikita.
  rationale: Sinasabi lamang ng Hebreo na pupunta si David sa bata at hindi babalik sa kanya ang bata. Hindi dapat dagdagan ng salin ang talata ng isang tiyak na doktrina tungkol sa kalagayan pagkatapos ng kamatayan o sa kaligtasan ng mga sanggol.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang karaniwang “pag-aayuno,” “ibalik,” at “babalik,” at pinanatili ang retorikal na daloy at ang hindi nilulutas na pahiwatig tungkol sa kamatayan.
