  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: tl
  text: Inaliw ni David ang asawa niyang si Batseba[a]. Lumapit siya rito at sumiping sa kanya[b]. Nagsilang siya ng isang anak na lalaki, at pinangalanan niya itong Solomon. At minahal siya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “binigyan ng kaaliwan ang asawa niyang si Batseba.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga idyomang “lumapit sa kanya” at “sumiping sa kanya” ay tumutukoy sa pakikipagtalik.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: inaliw
  rationale: Ang piel ng נחם ay tumutukoy sa pag-aliw matapos ang matinding dalamhati; natural at malinaw ang “inaliw” sa makabagong Filipino.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Karaniwang anyong Filipino ng pangalang Bathsheba.
- source_word: אִשְׁתּוֹ
  choice: ang asawa niyang
  rationale: Hayagang pinananatili ang pagtukoy ng Hebreo kay Batseba bilang asawa ni David.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: Nilapitan niya ito at sinipingan
  rationale: Natural at marangal na Filipino para sa magkaugnay na idyomang tumutukoy sa pakikipagtalik, nang hindi nagiging malabo o bulgar.
- source_word: וַתֵּלֶד בֵּן
  choice: Nagsilang ito ng isang anak na lalaki
  rationale: Tuwiran at natural na katumbas ng Hebreong pahayag.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: pinangalanan niya itong Solomon
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na “tinawag niya ang pangalan nito”; ang panlalaking isahang simuno ay pinakamalamang na si David.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Karaniwang anyo ng pangalan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֲהֵבוֹ
  choice: minahal siya
  rationale: Tuwirang ipinapahayag ng אהב ang pag-ibig, at ang hulapi ay tumutukoy sa bagong-silang na anak.
theological_decisions:
- issue: Paglalarawan kay Batseba bilang asawa ni David
  choice: ang asawa niyang si Batseba
  alternative: si Batseba
  rationale: Mahalagang panatilihin ang אִשְׁתּוֹ sapagkat hayagang kinikilala siya ng salaysay bilang asawa ni David.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Simuno ng pagpapangalan kay Solomon
  choice: si David ang ipinahihiwatig ng “niya”
  alternative: si Batseba ang nagpangalan
  rationale: Panlalaking isahan ang anyong Masoretiko וַיִּקְרָא, kaya pinakamalapit sa tekstong WLC na si David ang nagpangalan, bagaman may sinaunang pagkakaibang tekstuwal na sumusuporta sa pambabaeng anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Isinalin ang dobleng idyomang seksuwal sa maikli ngunit tahasang “Nilapitan niya ito at sinipingan,” habang pinanatili ang malinaw na pagkakasunod-sunod ng salaysay.
