    issue: Mali ang lexical-alternative footnote na “inulila.”
    rationale: Ang וַיְנַחֵם ay nangangahulugang magbigay ng kaaliwan o umaliw, hindi mang-ulila o maging ulila. Nagpapasok ito ng ibang kahulugan.
  - severity: medium
    issue: Hindi natural at kulang sa linaw ang “sinipingan,” at walang talababa para sa seksuwal na idyoma.
    rationale: Ang Hebreo ay may dalawang magkaugnay na pahayag—lumapit/pumasok sa kanya at sumiping sa kanya—na tumutukoy sa pakikipagtalik. Mas maayos ang aktibong “sumiping sa kanya,” na may maikling paliwanag sa talababa.
