  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: tl
  text: Pagkatapos, tinipon ni David ang buong bayan[a] at pumunta sa Rabba. Nakipaglaban siya rito at sinakop ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong hukbo” o “ang lahat ng kawal”; sa literal na Hebreo, “ang buong bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: tinipon
  rationale: Ang אסף ay nangangahulugang tipunin o pagsama-samahin. Pinananatili ng “tinipon” ang payak na diwa nang hindi ipinapalagay na isang pormal na pagtitipon ng hukbo ang tinutukoy.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Literal na “ang buong bayan” ang parirala. Sa konteksto, malamang na tumutukoy ito sa mga mandirigma o hukbo, ngunit עָם ang ginamit at hindi isang tiyak na terminong militar; kaya pinanatili sa pangunahing teksto ang mas malawak na kahulugan.
- source_word: רַבָּתָה
  choice: sa Rabba
  rationale: Ang pangalang-lugar na רַבָּה ay may directional he, na nagpapahiwatig ng pagpunta roon. Likas sa Tagalog ang “pumunta sa Rabba.”
- source_word: וַיִּלָּחֶם בָּהּ
  choice: nakipaglaban siya rito
  rationale: Ang לחם na may ב ay nagpapahayag ng pakikipagdigma laban sa lunsod. Ang “rito” ay natural na tumutukoy sa Rabba at iniiwasan ang di-likas na pagtukoy sa lunsod bilang “siya.”
- source_word: וַיִּלְכְּדָהּ
  choice: sinakop ito
  rationale: Sa salaysay ng digmaan, ang לכד ay tumutukoy sa pagkuha o pagsakop sa isang lunsod. Ang “sinakop” ay malinaw at angkop sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Rabba,” ang karaniwang anyong Filipino ng Rabbah. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang pagkakasunod-sunod ng mga kilos.
