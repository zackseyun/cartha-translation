base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: tl
  text: 'Pagkatapos, isinugo ni Yahweh si Natan kay David. Lumapit siya kay David at sinabi sa kanya, “May dalawang lalaki sa isang lungsod: ang isa ay mayaman at ang isa ay mahirap.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Ang שׁלח sa anyong pasalaysay ay nangangahulugang nagpadala o nagsugo. Ang “isinugo” ay likas sa marangal na salaysay at angkop sa misyong ibinigay ni Yahweh kay Natan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶת נָתָן
  choice: si Natan
  rationale: Hindi isinasalin nang hiwalay ang pantukoy sa tuwirang layon na אֶת; ginagamit ang natural na anyong Filipino ng pangalang Nathan bilang “Natan.”
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Ang אֶל ay tumutukoy sa patutunguhan ng pagsusugo. Ang “kay David” ang natural na katumbas at hindi nito ipinapasok ang interpretasyong “laban kay David.”
- source_word: וַיָּבֹא אֵלָיו
  choice: Pumunta siya kay David
  rationale: Maaaring mangahulugan ang בוא אֶל ng pagpunta o paglapit sa isang tao. Inulit ang “David” sa halip na gumamit ng magkasunod na malabong panghalip.
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi rito
  rationale: Pinananatili ang tahasang di-tuwirang layon ng Hebreo. Ang “rito” ay tumutukoy kay David at umiiwas sa alanganing pag-uulit ng pangalan.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dalawang lalaki
  rationale: Dalawang lalaking indibidwal ang tinutukoy sa talinghaga; malinaw at natural ang “dalawang lalaki.”
- source_word: הָיוּ
  choice: May
  rationale: Ang הָיוּ ay eksistensiyal dito. Ang “May” ang pinakanatural na makabagong Filipino para sa “there were,” nang hindi idinaragdag ang di-tahasang ideya ng paninirahan.
- source_word: בְּעִיר אֶחָת
  choice: sa isang lungsod
  rationale: Malapit itong sumusunod sa literal na “sa isang lungsod” at natural bilang pambungad ng isang salaysay.
- source_word: אֶחָד עָשִׁיר
  choice: ang isa ay mayaman
  rationale: Ginawang ganap na sugnay ang maikling pariralang nominal ng Hebreo upang maging likas at malinaw sa Filipino.
- source_word: וְאֶחָד רָאשׁ
  choice: at ang isa ay mahirap
  rationale: Ang רָאשׁ ay tumutukoy sa taong salat o mahirap. Malinaw ang tuwirang kaibahan nito sa “mayaman.”
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang pantangi ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON”; mas malapit din ito sa karaniwang rekonstruksiyon kaysa “Jehovah.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “isinugo” para sa tonong pasalaysay; ginamit ang “May” bilang natural na eksistensiyal na katumbas ng הָיוּ. Hindi kailangan ang talababa dahil natural at tapat ang “May dalawang lalaki sa isang lungsod,” at walang mahalagang tekstuwal o semantikong kalabuan na mawawala.
