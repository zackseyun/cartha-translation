  to: 'Pagkatapos, isinugo ni Yahweh si Natan kay David. Lumapit siya kay David at sinabi sa kanya, “May dalawang lalaki sa isang lungsod: ang isa ay mayaman at ang isa ay mahirap.”'
  rationale: Pinalitan ang “Pumunta siya kay David at sinabi rito” ng “Lumapit siya kay David at sinabi sa kanya” upang maging natural ang pagtukoy sa taong kausap at upang maipahayag nang malapit ang וַיָּבֹא אֵלָיו (“dumating/lumapit siya sa kanya”). Hindi binago ang kahulugan ng talata.
