  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: tl
  text: Tumayo sa tabi niya ang matatanda ng kaniyang sambahayan[a] upang ibangon siya mula sa lupa, ngunit hindi siya pumayag, at hindi siya kumain ng tinapay[b] kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ang matatanda ng kaniyang bahay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kumain ng tinapay” ay maaari ring mangahulugang kumain o tumanggap ng pagkain sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Tumayo
  rationale: Ang pandiwang קום ay tumutukoy dito sa pagkilos ng matatanda habang nilalapitan at tinutulungang ibangon si David.
- source_word: זִקְנֵי בֵיתוֹ
  choice: ang matatanda sa kaniyang sambahayan
  rationale: Literal na “ang matatanda ng kaniyang bahay,” ngunit ang “sambahayan” ay mas malinaw sa modernong Tagalog para sa mga nakatatandang kasapi o opisyal ng maharlikang tahanan.
- source_word: עָלָיו
  choice: sa tabi niya
  rationale: Maaaring literal na “sa ibabaw niya” o “sa piling niya”; sa tagpong sinusubukan nila siyang ibangon, natural at hindi labis na tiyak ang “sa tabi niya.”
- source_word: לַהֲקִימוֹ
  choice: upang ibangon siya
  rationale: Ang anyong causative ng קום ay nangangahulugang “papangyarihing bumangon,” na tuwirang naipahahayag ng “ibangon.”
- source_word: מִן הָאָרֶץ
  choice: mula sa lupa
  rationale: Sa konteksto ng pagpapatirapa ni David, ang אֶרֶץ ay tumutukoy sa lupang kinahihigaan niya.
- source_word: וְלֹא אָבָה
  choice: ngunit ayaw niyang bumangon
  rationale: Ang אָבָה ay nagpapahayag ng kawalan ng pagnanais o pagsang-ayon. Idinagdag ang ipinahihiwatig na “bumangon” upang maging malinaw at natural sa Tagalog nang hindi pinalalakas ito tungo sa “tumanggi.”
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: at hindi siya kumain ng tinapay kasama nila
  rationale: Pinananatili ang kongkretong “tinapay” at ang “kasama nila,” bagaman ang parirala ay maaari ring tumukoy nang mas malawak sa pagkain.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sambahayan” sa halip na literal na “bahay” upang maiwasang mapagkamalang gusali lamang, at pinanatili ang Hebreong larawan ng pagkain ng tinapay sa pangunahing teksto.
