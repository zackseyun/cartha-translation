  text: Ang mayaman ay may napakaraming tupa at baka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעָשִׁיר הָיָה
  choice: ng mayaman
  rationale: Ang konstruksyong היה na may לְ ay nagsasaad ng pagmamay-ari. Sa natural na Filipino, malinaw itong naipapahayag sa hulma na “Napakarami ... ng mayaman.”
- source_word: צֹאן
  choice: tupa
  rationale: Tumutukoy ang salita sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Ang “tupa” ang natural na katapat dito at nababagay sa kaibahan nito sa baka.
- source_word: וּבָקָר
  choice: at baka
  rationale: Ang בָּקָר ay tumutukoy sa malalaking alagang hayop ng kawan, karaniwan ay mga baka; “baka” ang malinaw at karaniwang salin sa Filipino.
- source_word: הַרְבֵּה מְאֹד
  choice: Napakarami
  rationale: Pinatitindi ng מְאֹד ang dami. Likas at tuwirang ipinapahayag ng “napakarami” ang diin ng parirala.
