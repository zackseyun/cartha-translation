  terminology: Ang “Yahweh” ay wastong salin ng banal na pangalan. Ang “yumukod” ay angkop na kongkretong salin ng וַיִּשְׁתָּחוּ at ang talababa ay wastong nagpapanatili sa mga posibleng saklaw na “sumamba” at “nagpatirapa.”
