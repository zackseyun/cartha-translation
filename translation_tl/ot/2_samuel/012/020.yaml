base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: tl
  text: Pagkatapos, bumangon si David mula sa lupa, naghugas, nagpahid ng langis, at nagpalit ng damit. Pumunta siya sa bahay ni Yahweh at yumukod[a]. Pagkatapos, pumunta siya sa kanyang bahay, humingi, at inihain nila sa kanya ang tinapay, at kumain siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumamba” o “nagpatirapa.” Ang pandiwang Hebreo ay maaaring tumukoy sa pisikal na pagyukod bilang pagpapakita ng pagpipitagan o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... מֵהָאָרֶץ
  choice: bumangon ... mula sa lupa
  rationale: Tuwirang inilalarawan ang pagbangon ni David mula sa lupang hinigaan niya habang nagdadalamhati.
- source_word: וַיִּרְחַץ
  choice: naghugas
  rationale: Malawak ang saklaw ng pandiwang Hebreo—maaaring paghuhugas o pagligo—kaya pinanatili ang hindi tiyak na lawak ng kilos.
- source_word: וַיָּסֶךְ
  choice: nagpahid ng langis sa katawan
  rationale: Tumutukoy ang סוך sa paglalagay ng langis sa sarili; malinaw at likas ito sa makabagong Tagalog at hindi ipinahihiwatig ang seremonyal na pagpapahid ng ibang tao.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: nagpalit ng damit
  rationale: Likas na katumbas sa Tagalog ng pagpapalit ng kasuotan matapos ang pagluluksa.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang karaniwang pariralang Hebreo para sa santuwaryo at ang personal na pangalang יְהוָה.
- source_word: וַיִּשְׁתָּחוּ
  choice: yumukod
  rationale: Pinananatili ang pisikal na kilos ng pagyukod nang hindi nililimitahan ang kahulugan sa abstraktong 'sumamba'; malinaw sa konteksto ang pagpipitagan kay Yahweh.
- source_word: וַיִּשְׁאַל
  choice: humingi
  rationale: Walang tahasang layon ang pandiwang Hebreo. Hindi idinagdag ang 'ng pagkain,' sapagkat ang sumunod na sugnay lamang ang nagpapahiwatig kung ano ang hiningi.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: Inihain nila sa kanya ang tinapay
  rationale: Likas na Tagalog para sa paglalagay ng tinapay sa harap niya, habang pinananatili ang di-tinukoy na maramihang tagaganap at ang literal na 'tinapay.'
- source_word: וַיֹּאכַל
  choice: kumain siya
  rationale: Payak at tuwirang katumbas ng pangwakas na kilos sa salaysay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginamit sa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinanatili itong Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng וַיִּשְׁתָּחוּ
  choice: yumukod
  alternative: sumamba; nagpatirapa
  rationale: Maaaring tukuyin ng pandiwa ang pisikal na pagyukod o pagpapatirapa bilang pagsamba. Pinananatili ng 'yumukod' ang kongkretong kilos at ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maiikling pandiwang pasalaysay at iniwasang punan ang walang tahasang layon ng “humingi.” Inilagay ang talababa pagkatapos ng “yumukod,” ang salitang tunay nitong ipinapaliwanag.
