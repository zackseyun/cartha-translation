  to: Pagkatapos, bumangon si David mula sa lupa, naghugas, nagpahid ng langis, at nagpalit ng damit. Pumunta siya sa bahay ni Yahweh at yumukod[a]. Pagkatapos, pumunta siya sa kanyang bahay, humingi, at inihain nila sa kanya ang tinapay, at kumain siya.
