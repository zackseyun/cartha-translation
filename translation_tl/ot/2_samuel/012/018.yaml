base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: tl
  text: Nang ikapitong araw, namatay ang bata. Natakot ang mga lingkod ni David na sabihin sa kanya na patay na ang bata, sapagkat sinabi nila, “Tingnan ninyo, noong buhay pa ang bata, kinausap namin siya, ngunit hindi niya kami pinakinggan. Paano namin ngayon sasabihin sa kanya, ‘Patay na ang bata’? Baka may gawin siyang masama[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “Baka may gawin siyang nakapipinsala,” “Baka masama ang maging reaksiyon niya,” o posibleng “Baka saktan niya ang sarili niya.” Maikli ang pahayag na Hebreo at hindi tinutukoy ang eksaktong kilos na kinatatakutan.
    reason: Pinananatili ang leksikal at kontekstuwal na kalabuan ng וְעָשָׂה רָעָה at inilalagay ang pananda sa sugnay na ipinaliliwanag nito.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Nang ikapitong araw
  rationale: Natural na panandang temporal sa makabagong Tagalog para sa susunod na pangyayari sa salaysay; hindi kailangang gawing literal ang panimulang וַיְהִי.
- source_word: וַיָּמָת הַיָּלֶד
  choice: namatay ang bata
  rationale: Ang יֶלֶד ay maaaring ‘bata’ o ‘batang lalaki’; ang ‘bata’ ang pinakaangkop sa sanggol sa konteksto at hindi nagpapahiwatig ng higit na edad.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד לְהַגִּיד לוֹ
  choice: Natakot ang mga lingkod ni David na sabihin sa kanya
  rationale: Ang ירא ay takot o pangamba rito, at ang ‘mga lingkod’ ay dignified at malinaw na katumbas ng עֲבָדִים sa sambahayan ng hari.
- source_word: הִנֵּה בִהְיוֹת הַיֶּלֶד חַי
  choice: Noong buhay pa ang bata
  rationale: Ang ‘pa’ ay natural na naghahayag ng kontrast sa pagkamatay. Hindi isinalin nang hiwalay ang הִנֵּה dahil ang tungkulin nitong pantawag-pansin ay naipahihiwatig na ng tuwirang pananalita sa Tagalog.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: kinausap natin siya, ngunit hindi niya tayo pinakinggan
  rationale: Ang ‘hindi niya tayo pinakinggan’ ay likas na Tagalog na katumbas ng Hebreong idyomang ‘hindi nakinig sa ating tinig’; iniiwasan nito ang di-likas na literalismo.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Paano natin ngayon sasabihin sa kanya
  rationale: Pinananatili ang balisang retorikal na tanong; ang ‘ngayon’ ay nagpapakita ng inferensiyang dulot ng naunang kalagayan.
- source_word: וְעָשָׂה רָעָה
  choice: Baka gumawa siya ng masama
  rationale: Malapit ito sa maikli at walang-tiyak-na-layon na Hebreo. Hindi tinutukoy kung ang masama ay pananakit sa sarili, pananakit sa iba, o ibang masamang reaksiyon.
theological_decisions:
- issue: Ang tiyak na kahulugan ng וְעָשָׂה רָעָה
  choice: Iniwan itong walang tiyak na layon bilang ‘Baka gumawa siya ng masama.’
  alternative: ‘Baka saktan niya ang sarili niya’ o ‘Baka masama ang maging reaksiyon niya.’
  rationale: Hindi binabanggit ng Hebreo ang bagay o ang eksaktong kilos na kinatatakutan. Ang pagtukoy sa pananakit sa sarili o sa isang partikular na sikolohikal na reaksiyon ay lalampas sa sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang ‘lingkod’ sa halip na mas kolokyal na ‘katulong,’ at likas na idyomang Tagalog sa halip na kopyahin ang Hebreong ‘makinig sa aming tinig.’ Ang panandang [a] ay inilagay sa unang pahayag tungkol sa pagkamatay gaya ng consultation layer, bagaman ang nilalaman ng talababa ay nagpapaliwanag sa malabong huling sugnay.
