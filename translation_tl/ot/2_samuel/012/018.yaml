  source_fidelity: 'Kailangang itama ang mga panghalip sa iniulat na pananalita: ang mga lingkod ay nagsasalita tungkol kay David, kaya ang Hebreong unang panauhang maramihan ay eksklusibo sa kausap na si David (“namin/kami”), hindi inklusibong “natin/tayo.” Napananatili rin ang hindi-tiyak na saklaw ng וְעָשָׂה רָעָה sa “Baka may gawin siyang masama.”'
  naturalness: Likas at marangal ang pangunahing daloy sa modernong Filipino. Ang “namin/kami” ang parehong mas natural at mas tumpak sa sitwasyong direktang kausap si David. Idinagdag ang “Tingnan ninyo” upang katawanin ang pantawag-pansing הִנֵּה nang hindi nagiging lipas ang rehistro.
  terminology: Ang “bata,” “mga lingkod,” at “patay na” ay angkop sa konteksto at rehistro. Ang “may gawin siyang masama” ay hindi nagtatalaga ng tiyak na layon o uri ng kinatatakutang kilos.
