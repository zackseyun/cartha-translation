revisions:
- from: Nang ikapitong araw, namatay ang bata. Natakot ang mga lingkod ni David na sabihin sa kanya na patay na ang bata[a], sapagkat sinabi nila, “Noong buhay pa ang bata, kinausap natin siya, ngunit hindi niya tayo pinakinggan. Paano natin ngayon sasabihin sa kanya, ‘Patay na ang bata’? Baka gumawa siya ng masama.”
  to: Nang ikapitong araw, namatay ang bata. Natakot ang mga lingkod ni David na sabihin sa kanya na patay na ang bata, sapagkat sinabi nila, “Tingnan ninyo, noong buhay pa ang bata, kinausap namin siya, ngunit hindi niya kami pinakinggan. Paano namin ngayon sasabihin sa kanya, ‘Patay na ang bata’? Baka may gawin siyang masama[a].”
  rationale: Inayos ang eksklusibong unang panauhang maramihan upang hindi maisama si David sa mga lingkod na nagsasalita. Inilipat ang talababa sa huling sugnay na siyang saklaw nito. Isinama ang natural na pantawag-pansin na “Tingnan ninyo” para sa הִנֵּה, habang iniingatan ang bukas na kahulugan ng kinatatakutang gagawin ni David.
