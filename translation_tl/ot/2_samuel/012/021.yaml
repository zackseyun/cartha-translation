translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pero” upang malinaw na maipakita ang retorikal na pagsalungat nang hindi nagiging labis na pormal. Inilagay ang talababa sa mismong pariralang “kumain ng tinapay,” na siyang ipinaliliwanag nito.
