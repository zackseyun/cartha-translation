base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: tl
  text: Sinabi sa kanya ng mga lingkod niya, “Ano itong ginawa mo? Noong buhay pa ang bata, nag-ayuno ka at umiyak; pero nang mamatay ang bata, bumangon ka at kumain ng tinapay.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kumain ng tinapay,” isang idyoma na maaaring tumukoy sa pagkain sa pangkalahatan o sa pagkain ng isang kainan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: Sinabi sa kanya ng mga lingkod niya
  rationale: Pinananatili ang pagsulong ng salaysay at ang kolektibong pagkilos ng mga lingkod. Ang “mga lingkod” ang angkop na katawagan sa konteksto ng maharlikang sambahayan nang hindi ipinapalagay ang tiyak nilang legal na katayuan.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Ano itong ginawa mo?
  rationale: Natural na tanong sa modernong Tagalog na pinananatili ang pagkagulat ng mga lingkod at hindi ginagawang tahasang “Bakit,” na maaaring magdagdag ng interpretasyon.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Noong buhay pa ang bata
  rationale: Sa konteksto, ipinakikilala ng parirala ang kalagayang temporal na ikinukumpara sa pagkamatay ng bata. Ang “bata” ay angkop sa sanggol na tinutukoy.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: nag-ayuno ka at umiyak
  rationale: Tuwiran at malinaw na salin ng dalawang kilos, na may dignidad na angkop sa salaysay.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: pero nang mamatay ang bata
  rationale: Ipinapakita ng “pero” ang matinding paghahambing sa naunang kilos, habang ang “mamatay” ay nagpapanatili sa dinamikong anyo ng pandiwang Hebreo.
- source_word: קַמְתָּ
  choice: bumangon ka
  rationale: Karaniwan at tuwirang katumbas sa Tagalog ng pagkilos na inilarawan.
- source_word: וַתֹּאכַל לָחֶם
  choice: at kumain ng tinapay
  rationale: Pinananatili ang kongkretong “tinapay” ng Hebreo, habang nililinaw sa talababa na maaari itong maging idyoma para sa pagkain sa pangkalahatan.
