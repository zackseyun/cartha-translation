  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: tl
  text: Ngayon, tipunin mo ang nalalabing mga kawal, magkampo laban sa lungsod, at sakupin ito, baka ako ang makasakop sa lungsod at matawag ang lungsod sa pangalan ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at matawag ang pangalan ko sa ibabaw nito.” Ipinahihiwatig ng Hebreong idyoma na ang karangalan sa pagsakop sa lungsod ay maiuugnay sa nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang diskurso na naghaharap ng agarang susunod na hakbang; likas sa Tagalog ang “Kaya ngayon” sa ganitong pakiusap.
- source_word: אֱסֹף
  choice: tipunin mo
  rationale: Isahang pautos ang pandiwa at tumutukoy kay David; malinaw at karaniwan ang “tipunin.”
- source_word: יֶתֶר הָעָם
  choice: ang nalalabing mga kawal
  rationale: Bagaman karaniwang nangangahulugang “bayan” o “mga tao” ang עָם, ang konteksto ng pagkubkob ay tumutukoy sa natitirang puwersang panlaban.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: magkampo laban sa lungsod
  rationale: Pinananatili ang pangunahing kahulugan ng חנה na paghimlay o pagkakampo at ang mapanlabang diwa ng עַל, nang hindi tahasang pinapalitan ng mas interpretibong “kubkubin.”
- source_word: וְלָכְדָהּ
  choice: at sakupin iyon
  rationale: Sa salaysay ng digmaan, ang לכד ay tumutukoy sa pagkuha o pagsakop sa isang lungsod; natural sa Tagalog ang “sakupin.”
- source_word: פֶּן
  choice: baka
  rationale: Ipinahahayag ang babala tungkol sa maaaring mangyari kung hindi susundin ang utos; likas na katumbas sa modernong Tagalog ang “baka.”
- source_word: אֶלְכֹּד אֲנִי
  choice: ako pa ang sumakop
  rationale: Pinananatili ang pag-uulit ng pandiwang לכד at ang diin ng tahasang panghalip na אֲנִי; ipinahihiwatig ng “pa” ang di-nais na paglipat ng karangalan kay Joab.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: at matawag iyon sa pangalan ko
  rationale: Natural itong Tagalog para sa Hebreong idyoma na literal na nagsasabing tatawagin ang pangalan ng nagsasalita sa ibabaw ng lungsod. Pinananatili ng talababa ang mas literal na anyo at nililinaw ang diwa ng pagkilala sa mananakop.
