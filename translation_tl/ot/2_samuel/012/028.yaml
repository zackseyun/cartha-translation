    issue: Ang “Kaya” sa “Kaya ngayon” ay masyadong sanhi-bunga.
    rationale: Ang וְעַתָּה ay panandang diskurso (“ngayon/at ngayon”), hindi kinakailangang pangatnig na nangangahulugang “kaya.”
  - severity: medium
    issue: 'Hindi wasto ang gramatikang literal ng talababa: “at tawagin dito ang pangalan ko.”'
    rationale: Passive ang וְנִקְרָא (“at matawag/matawag na”), at ang pangalan ang paksa ng pandiwa; hindi rin tumpak ang “dito” para sa panghalip na tumutukoy sa lungsod.
