base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: tl
  text: Nakipaglaban si Joab sa Rabba ng mga Ammonita at nasakop niya ang maharlikang lungsod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kabiserang lungsod.” Sa Hebreo, literal na “ang lungsod ng paghahari/maharlikang kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: Nakipaglaban
  rationale: Ang Niphal ng לחם ay tumutukoy sa pakikipaglaban. Natural sa modernong Tagalog ang “nakipaglaban” at malinaw ang diwang militar sa kasunod na parirala.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Rabba ng mga Ammonita
  rationale: Pinananatili ang Rabba bilang pangalang pantangi, habang ang בְּנֵי עַמּוֹן ay isinasalin sa karaniwang makabagong katawagang etniko na “mga Ammonita.”
- source_word: וַיִּלְכֹּד
  choice: nasakop niya
  rationale: Sa kontekstong militar, ang לכד ay nangangahulugang bihagin, agawin, o sakupin. Ang “nasakop niya” ay natural para sa pagkuha ng isang lungsod at nililinaw ang simuno na si Joab.
- source_word: עִיר הַמְּלוּכָה
  choice: ang maharlikang lungsod
  rationale: Malapit ito sa literal na “lungsod ng paghahari/maharlikang kapangyarihan” at hindi nito tahasang ipinapalagay na ang tinutukoy ay kabisera, bagaman posible ang pagbasa na iyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “maharlikang lungsod” upang mapanatili ang anyo at bahagyang kalabuan ng Hebreo; inilagay sa talababa ang mas interpretatibong “kabiserang lungsod.”
