  to: Bakit mo hinamak ang salita ni Yahweh[a] upang gumawa ng masama sa paningin niya? Pinabuwal mo si Urias na Heteo sa pamamagitan ng tabak, kinuha mo ang asawa niya upang maging sarili mong asawa[b], at pinatay mo siya sa pamamagitan ng tabak ng mga Ammonita.[c]
