reference: 2 Samuel 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: tl
  text: Bakit mo hinamak ang salita ni Yahweh[a] upang gumawa ng masama sa paningin niya? Pinabuwal mo si Urias na Heteo sa pamamagitan ng tabak, kinuha mo ang asawa niya upang maging sarili mong asawa[b], at pinatay mo siya sa pamamagitan ng tabak ng mga Ammonita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinuring mong walang halaga ang salita ni Yahweh?”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kinuha mo ang asawa niya para sa iyo bilang asawa”; binibigyang-diin ng pananalita ang personal na pag-angkin ni David sa asawa ni Urias.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa pamamagitan ng tabak ng mga anak ni Ammon.” Ipinahihiwatig nito na pinapangyari ni David ang pagkamatay ni Urias sa kamay ng mga Ammonita.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Tuwirang tanong ito na nagpapahayag ng mabigat na paratang ni Natan; natural at sapat ang “Bakit” sa makabagong Tagalog.
- source_word: בָּזִיתָ
  choice: hinamak
  rationale: Ang pandiwang בזה ay nagpapahiwatig ng paghamak o pagtingin nang may pag-alipusta, hindi lamang simpleng pagsuway.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang lawak ng דָּבָר, na maaaring tumukoy sa ipinahayag na salita o utos, at tuwirang isinasalin ang pangalang יְהוָה bilang “Yahweh.”
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: sa paggawa ng masama sa paningin niya
  rationale: Natural na Tagalog ito para sa ugnayan ng paghamak at masamang gawa, habang pinananatili ang Hebreong pormulang “sa paningin niya.”
- source_word: הִכִּיתָ בַחֶרֶב
  choice: Pinabagsak mo sa tabak
  rationale: Pinananatili ng “pinabagsak” ang larawan ng נכה at ang marahas na bisa nito nang hindi ito lubusang ipinapareho sa kasunod na tahasang pandiwang “pinatay.”
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: kinuha mo ang asawa niya upang maging sarili mong asawa
  rationale: Pinananatili nito ang tahasang pag-aangkin para sa sarili sa לְךָ at ang layuning gawin siyang asawa sa לְאִשָּׁה.
- source_word: הָרַגְתָּ
  choice: pinatay mo
  rationale: Karaniwang pandiwa para sa pagpatay ang הרג; hindi na kailangang idagdag sa mismong salin ang mas tiyak na legal na katawagang “pinaslang” o “minurder.”
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: sa pamamagitan ng tabak ng mga Ammonita
  rationale: Ipinakikita ng parirala na naging kasangkapan ni David ang puwersang Ammonita sa pagkamatay ni Urias, at pinananatili rin ang pag-uulit ng “tabak.”
- source_word: אוּרִיָּה הַחִתִּי
  choice: Urias na Heteo
  rationale: Ginagamit ang mga anyong pangalang karaniwan at madaling makilala sa tradisyong Tagalog, habang pinananatili ang pagkakakilanlang etniko ni Urias.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang tipan ang יְהוָה sa mismong tekstong Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pananagutan ni David bagaman mga Ammonita ang tuwirang pumatay kay Urias
  choice: “pinatay mo siya sa pamamagitan ng tabak ng mga Ammonita”
  alternative: “pinatay siya ng mga Ammonita”
  rationale: Tuwirang ibinibintang ng Hebreo kay David ang pagpatay habang kinikilala ang paraang ginamit niya—ang sandatahang lakas ng mga Ammonita. Hindi dapat pahinain ang moral na pananagutang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding tono ng paratang, ang pag-uulit ng “tabak,” at ang pagkakaiba ng dalawang pandiwang Hebreo para sa marahas na pagpabagsak at tahasang pagpatay. Ginamit ang “Urias,” “Heteo,” at “Ammonita” bilang mga anyong pamilyar sa mga mambabasang Tagalog.
