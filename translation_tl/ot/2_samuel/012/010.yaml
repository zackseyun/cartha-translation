base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: tl
  text: Kaya ngayon, hindi kailanman aalis ang tabak sa iyong bahay[a], sapagkat hinamak mo ako[b] at kinuha mo ang asawa ni Uria na Heteo upang maging asawa mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay”; maaari itong tumukoy sa sambahayan, pamilya, angkan, o dinastiya.
    reason: lexical_alternative
  - marker: b
    text: Tuwirang sinasabi sa Hebreo, “hinamak mo ako.” Ang kasalanang ginawa laban kina Uria at sa kaniyang asawa ay inilalarawan bilang paghamak sa Diyos mismo.
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinagsasama nito ang temporal na diwang “ngayon” at ang paghihinuha na ang kasunod na hatol ay bunga ng naunang paratang.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: hindi kailanman mawawala
  rationale: Likas na ipinahahayag sa modernong Tagalog ang patuloy at walang-taning na pag-iral ng hatol; iniiwasan nito ang matigas na literal na “hindi mawawala hanggang magpakailanman.”
- source_word: חֶרֶב
  choice: ang tabak
  rationale: Pinananatili ang konkretong larawan ng karahasan at digmaan sa Hebreo sa halip na ipaliwanag agad bilang kapahamakan.
- source_word: מִבֵּיתְךָ
  choice: sa iyong sambahayan
  rationale: Likas sa Tagalog at maaaring tumukoy sa pamilya at mga kabilang sa bahay, habang nililinaw sa talababa na maaari ring saklawin ng Hebreong “bahay” ang angkan o dinastiya.
- source_word: עֵקֶב כִּי
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi para sa dahilan ng ipinahayag na hatol.
- source_word: בְזִתָנִי
  choice: hinamak mo ako
  rationale: Tuwirang pinananatili ang pandiwang nagpapahayag ng paghamak at ang unang panauhang panghalip na tumutukoy sa Diyos.
- source_word: וַתִּקַּח
  choice: at kinuha mo
  rationale: Inilalahad bilang natapos na kilos at likas na iniuugnay sa naunang paratang.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: ang asawa ni Uria na Heteo
  rationale: Pinananatili ang diin na ang babae ay asawa ni Uria at isinasalin nang natural ang katawagang etniko.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: upang maging asawa mo
  rationale: Natural na Tagalog para sa Hebreong pariralang tumutukoy sa pagkuha sa isang babae bilang asawa, nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng “ako” sa “hinamak mo ako”
  choice: 'Pinanatili ang tuwirang banal na tinutukoy: “hinamak mo ako.”'
  alternative: “hinamak mo ang salita/utos ng PANGINOON”
  rationale: May tahasang hulaping unang panauhang isahan ang Hebreo. Pinananatili nito ang bigat na ang kasalanan laban kina Uria at sa kaniyang asawa ay paghamak din sa Diyos, nang walang idinagdag na interpretibong pangngalan.
- issue: Saklaw ng “iyong bahay”
  choice: Isinalin sa teksto bilang “iyong sambahayan,” na may talababa tungkol sa mas malawak na saklaw.
  alternative: “iyong pamilya,” “iyong angkan,” o “iyong dinastiya”
  rationale: Maaaring saklawin ng בַּיִת ang sambahayan, pamilya, angkan, at maharlikang linya. Hindi nililimitahan ng talababa ang hatol sa isa lamang sa mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabak” upang mapanatili ang matinding larawan ng Hebreo, at “sambahayan” para sa natural na daloy habang inilalahad sa talababa ang lawak ng salitang “bahay.”
