base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: tl
  text: Dumating sa mayamang lalaki ang isang manlalakbay.[a] Hindi niya ginustong kumuha mula sa sarili niyang kawan ng mga tupa at mula sa sarili niyang kawan ng mga baka upang ipaghanda ang panauhing dumating sa kanya. Kaya kinuha niya ang babaeng kordero ng mahirap na lalaki at inihanda iyon para sa lalaking dumating sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaugnay ngunit magkaiba ang mga salitang Hebreo: ang una ay tumutukoy sa isang taong naglalakbay, at ang ikalawa ay sa isang taong tinatanggap bilang panauhin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: manlalakbay
  rationale: Tumutukoy ito sa isang taong naglalakbay. Ang “manlalakbay” ay likas sa makabagong Filipino at pinananatili ang pananagutan ng mayaman na magpatuloy ng dumating.
- source_word: וַיַּחְמֹל
  choice: nanghinayang siyang kumuha
  rationale: Karaniwang nangangahulugang “maawa” o “magtipid/huwag galawin” ang pandiwa, ngunit walang tahasang layon dito. Sa konteksto, nag-atubili ang mayaman na gamitin ang sarili niyang mga hayop; malinaw at natural itong ipinahahayag ng “nanghinayang siyang kumuha.”
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: mula sa sarili niyang kawan ng mga tupa o sa sarili niyang bakahan
  rationale: Pinananatili ng “kawan” at “bakahan” ang kolektibong diwa at ng “sarili niyang” ang mga hulaping paari. Ang “o” ay natural na naghahayag sa Filipino na ayaw niyang kumuha mula sa alinman sa dalawang pag-aari niya.
- source_word: לַעֲשׂוֹת / וַיַּעֲשֶׂהָ
  choice: ipaghanda / inihanda iyon
  rationale: Sa konteksto ng pagkain, ang עשה ay tumutukoy sa paghahanda. Inuulit ng salin ang ugnayang leksikal nang hindi ipinapalagay ang tiyak na paraan ng pagluluto.
- source_word: לָאֹרֵחַ
  choice: para sa panauhin
  rationale: Ang אָרֵחַ ay maaaring tumukoy sa isang naglalakbay o sa isang tinatanggap bilang panauhin. Ang “panauhin” ay natural at pinananatili ang bahagyang pagkakaiba nito sa naunang הֵלֶךְ.
- source_word: כִּבְשַׂת
  choice: babaeng kordero
  rationale: Tiyak na babaeng batang tupa ang tinutukoy ng Hebreo; pinananatili ng salin ang kasarian at edad ng hayop.
- source_word: הָאִישׁ הָרָאשׁ
  choice: mahirap na lalaki
  rationale: Ang רָאשׁ ay tumutukoy sa mahirap o nangangailangan. Malinaw at tuwiran ang “mahirap na lalaki,” at katapat ito ng “mayamang lalaki.”
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: dumating sa kanya
  rationale: Ang mga pariralang participial ay naglalarawan sa bisitang dumating. Natural sa salaysay na Filipino ang “dumating sa kanya” at hindi nito dinaragdagan ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manlalakbay” at “panauhin” upang maipakita ang tunay na leksikal na pagkakaiba sa Hebreo, habang pinanatiling natural ang daloy ng talinghaga.
