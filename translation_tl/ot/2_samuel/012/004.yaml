  to: Dumating sa mayamang lalaki ang isang manlalakbay.[a] Hindi niya ginustong kumuha mula sa sarili niyang kawan ng mga tupa at mula sa sarili niyang kawan ng mga baka upang ipaghanda ang panauhing dumating sa kanya. Kaya kinuha niya ang babaeng kordero ng mahirap na lalaki at inihanda iyon para sa lalaking dumating sa kanya.
