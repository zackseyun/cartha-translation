  naturalness: Ang “ipinanganak ng asawa ni Uria para kay David” ay mabigat at hindi idiomatiko. Ang “isinilang ng asawa ni Uria kay David” ay natural na modernong Tagalog. Ang pag-uulit ng “ang bata” sa huling sugnay ay malinaw at iniiwasan ang impersonal na “ito.”
  terminology: Ang “Yahweh,” “hinampas,” “asawa ni Uria,” at “bata” ay angkop. Pinananatili ang hindi pagbibigay ng pangalan kay Batseba sa pangunahing teksto.
