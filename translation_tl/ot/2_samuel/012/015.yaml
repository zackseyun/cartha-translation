base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: tl
  text: Pagkatapos ay umuwi si Natan, at hinampas ni Yahweh ang batang isinilang ng asawa ni Uria kay David,[a] at nagkasakit ang bata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “asawa ni Uria.” Pinananatili ng katawagang ito ang sadyang hindi pagbanggit dito sa pangalan ni Batseba.
    reason: cultural_note
  - marker: b
    text: Ang salitang Hebreo ay maaari ring ipakahulugang “malubhang nagkasakit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ נָתָן אֶל בֵּיתוֹ
  choice: Pagkatapos, umuwi si Natan
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang אֶל בֵּיתוֹ ay literal na “patungo sa kaniyang bahay,” ngunit natural na ipinahahayag sa modernong Tagalog bilang “umuwi.”
- source_word: וַיִּגֹּף
  choice: hinampas
  rationale: Ang נָגַף ay tuwirang tumutukoy sa paghampas na nagdudulot ng kapinsalaan. Pinananatili ng “hinampas” ang tahasang pagkilos nang hindi tinutukoy nang higit sa teksto ang uri ng sakit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos, sa halip na palitan ng titulong “PANGINOON.”
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Ang “bata” ay natural at sapat na malawak para sa batang tinutukoy sa konteksto.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: ang batang ipinanganak ng asawa ni Uria para kay David
  rationale: Pinananatili ang sadyang pagtukoy ng Hebreo sa babae bilang “asawa ni Uria,” at ang לְדָוִד bilang “para kay David,” nang hindi pinapawi ang moral na diin ng salaysay.
- source_word: וַיֵּאָנַשׁ
  choice: kaya nagkasakit ito
  rationale: Tumutukoy ang pandiwa sa pagkakasakit ng bata. Ang “kaya” ay likas na naghahayag sa Tagalog ng resultang kaugnayan sa naunang paghampas, at ang “ito” ay malinaw na bumabalik sa bata.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Tahasang ahensiya sa pagkakasakit ng bata
  choice: hinampas ni Yahweh ang bata
  alternative: pinahintulutan ni Yahweh na magkasakit ang bata
  rationale: Tuwirang iniuugnay ng Hebreo kay Yahweh ang kilos; hindi ito dapat palambutin bilang pahintulot lamang.
- issue: Pagkakakilanlan sa ina ng bata
  choice: asawa ni Uria
  alternative: Batseba
  rationale: Pinananatili ang sadyang katahimikan ng talata sa pangalan ni Batseba at ang moral na tensiyon ng pagtawag sa kaniya bilang asawa ni Uria.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “umuwi” para sa likas na daloy ng salaysay, habang pinanatili ang matinding pandiwang “hinampas” at ang katawagang “asawa ni Uria.”
