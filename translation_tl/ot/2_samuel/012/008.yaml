base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: tl
  text: At ibinigay ko sa iyo ang sambahayan ng iyong panginoon at ang mga asawa ng iyong panginoon sa iyong kandungan[a]. Ibinigay ko rin sa iyo ang sambahayan ng Israel at Juda. At kung kulang pa iyon, magdaragdag pa sana ako sa iyo ng ganito at ganoon pa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa iyong dibdib.” Ipinahihiwatig ng idyomang Hebreo ang malapit na pagtanggap o pag-aari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ng mga bagay na katulad nito at niyon, at higit pa.” Ang Hebreong parirala ay isang idyoma para sa pagdaragdag ng iba pang mga bagay na gayon ding uri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: ibinigay ko
  rationale: Ang Qal wayyiqtol ng נתן ay nagsasalaysay ng nakaraang ginawa ng Diyos; natural at tumpak ang payak na aspektong naganap sa Tagalog.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: sambahayan ng iyong panginoon
  rationale: Maaaring tumukoy ang בַּיִת sa bahay, sambahayan, o dinastiya. Ipinahihiwatig dito ang maharlikang sambahayan ni Saul, kaya mas malawak at natural ang “sambahayan” kaysa literal na gusali.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: mga asawa ng iyong panginoon
  rationale: Tuwirang construct phrase ito. Pinananatili ng “panginoon” ang ugnayan ni David sa dati niyang hari nang hindi ito ipinagkakamali sa banal na pangalang PANGINOON.
- source_word: בְּחֵיקֶךָ
  choice: sa iyong kandungan
  rationale: Ang חֵיק ay dibdib o kandungan at isang idyoma ng malapit na pagtanggap o pag-aari. Pinananatili ng “sa iyong kandungan” ang kongkretong larawan at ang hindi lubusang nilulutas na implikasyon nito.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: sambahayan ng Israel at Juda
  rationale: Pinananatili ang pag-uulit ng בֵּית at maaaring saklawin ang bayan at maharlikang nasasakupan, nang hindi agad pinapakahulugang “kaharian.”
- source_word: וְאִם מְעָט
  choice: kung kulang pa iyon
  rationale: Natural na Filipino ito para sa hipotetikal na kawalan ng kasapatan, habang pinananatili ang kondisyon ng Hebreo.
- source_word: וְאֹסִפָה לְּךָ
  choice: dinagdagan ko sana para sa iyo
  rationale: Ang Hiphil ng יסף ay nangangahulugang magdagdag. Ipinahahayag ng “sana” ang hipotetikal o salungat-sa-katotohanang diwa ng sugnay.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: ng ganito at ganoon pa
  rationale: Ang dobleng demonstratibong idyoma ay sadyang di-tiyak at tumutukoy sa higit pang mga bagay na katulad ng nauna; pinananatili ng salin ang ganitong bukas na diwa.
theological_decisions:
- issue: Kung ipinahihiwatig ng talata ang banal na pagsang-ayon sa pagiging mga asawang seksuwal ni David ng mga asawa ni Saul
  choice: Isinalin ang pahayag bilang pagbibigay ng “mga asawa ng iyong panginoon sa iyong kandungan,” nang walang dagdag na paliwanag kung ito ay pag-aasawa, pag-angkin sa maharlikang sambahayan, o pangangalaga.
  alternative: “Ibinigay ko sa iyo ang harem ng iyong panginoon” o “ipinagkatiwala ko sa iyo ang mga babae ng iyong panginoon.”
  rationale: Nagsasaad ang Hebreo ng paglilipat na kaugnay ng maharlikang paghalili at pag-aari, ngunit hindi nito tahasang nililinaw ang lahat ng legal, seksuwal, o moral na implikasyon. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan” upang maipakita ang malawak na kahulugan ng בֵּית, at “kandungan” upang mapanatili ang larawang Hebreo nang hindi nagpapasok ng tiyak na interpretasyong wala sa teksto.
