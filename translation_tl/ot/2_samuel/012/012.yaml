  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: tl
  text: Sapagkat ginawa mo iyon nang lihim, ngunit gagawin ko ang bagay na ito sa harap ng buong Israel at sa harap ng araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sa katanghaliang-tapat”; literal, “at sa harap ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng hatol na ipinahayag sa naunang talata at natural na pinananatili ang paliwanag na ugnayan.
- source_word: עָשִׂיתָ
  choice: ginawa mo iyon
  rationale: Tumutukoy ang pandiwa sa kasalanan ni David nang hindi na ito muling tahasang binabanggit; pinananatili ng “iyon” ang maikli at pahiwatig na anyo ng Hebreo.
- source_word: בַסָּתֶר
  choice: nang lihim
  rationale: Natural na katumbas ito ng paggawa sa lihim o tagong kalagayan at malinaw na ikinokontra sa hayagang pagkilos na kasunod.
- source_word: וַאֲנִי
  choice: ngunit ... ko
  rationale: 'Bagaman maaaring simpleng pang-ugnay ang waw, malinaw na pasalungat ang konteksto: lihim ang ginawa ni David, samantalang hayagan ang gagawin ng Diyos.'
- source_word: אֶעֱשֶׂה
  choice: gagawin ko
  rationale: Pinananatili nito ang tuwirang unang-panauhang pagkilos at ang panghinaharap na pahayag ng hatol.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Pinananatili ang demonstratibong diin at ang konkretong pagtukoy sa ipinahayag na gawa ng paghatol.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: sa harap ng buong Israel
  rationale: Likas at malinaw nitong ipinahahayag ang pampublikong katangian ng gagawin, sa presensya o paningin ng buong Israel.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: at sa harap ng araw
  rationale: Pinananatili sa pangunahing teksto ang matingkad at literal na larawan ng Hebreo, habang ipinaliliwanag sa talababa ang idyomatikong kahulugan.
theological_decisions:
- issue: Ang gumaganap sa ipinahayag na hatol
  choice: 'Panatilihin ang tuwirang unang-panauhang pagkilos ng Diyos: “gagawin ko ang bagay na ito”'
  alternative: “ipagagawa ko ang bagay na ito”
  rationale: Tuwirang pandiwang nasa unang panauhan ang gamit ng Hebreo. Bagaman isinasagawa ang hatol sa pamamagitan ng mga pangyayari at tao sa salaysay, hindi dapat palambutin o baguhin ang tahasang ahensiya sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” para sa paliwanag na ugnayan, “nang lihim” bilang likas na idyoma, at pinanatili ang literal na larawang “sa harap ng araw” upang hindi mawala ang anyo at diin ng Hebreo.
