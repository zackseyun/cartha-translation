base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: tl
  text: 'Sinabi ni Natan kay David[a], “Ikaw ang taong iyon! Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Pinahiran kita upang maging hari ng Israel, at iniligtas kita mula sa kamay ni Saul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ikaw ang taong iyon!” Sa literal, “Ikaw ang tao!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang payak na “Sinabi” rito; malinaw na ang pagkakasunod mula sa konteksto.
- source_word: אַתָּה הָאִישׁ
  choice: Ikaw ang taong iyon!
  rationale: Mariin at kasukdulan ang nominal na sugnay matapos ang talinghaga ni Natan. Ang “taong iyon” ay natural na tumutukoy sa lalaking nasa talinghaga, habang inilalahad sa talababa ang literal na anyo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili nito ang pormal na pormula ng mensaherong propetiko sa malinaw at kasalukuyang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at natural na salin ng pariralang construct, at pinananatili ang tipanang titulo.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: Ako ... at ako
  rationale: Pinananatili ang pag-uulit at diin ng malalayang panghalip sa dalawang ginawa ng Diyos.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: nagpahid sa iyo bilang hari
  rationale: Ang pagpahid ay tumutukoy sa pagtatalaga sa maharlikang katungkulan; pinananatili ng “nagpahid” ang kongkreto at teolohikal na larawan ng Hebreo.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Tagalog, ang “hari sa Israel” ay likas na nagpapahayag ng paghahari o awtoridad sa bansa nang hindi mabigat ang “sa ibabaw ng Israel.”
- source_word: הִצַּלְתִּיךָ
  choice: nagligtas sa iyo
  rationale: Sa kontekstong ito, malinaw itong tumutukoy sa pagliligtas mula sa panganib at kapangyarihan ni Saul.
- source_word: מִיַּד שָׁאוּל
  choice: mula sa kamay ni Saul
  rationale: Pinananatili ang malinaw na idyomang Hebreo para sa kapangyarihan o kontrol ng isang kaaway.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng titulong “Panginoon.”
- issue: Kahulugan ng maharlikang pagpahid
  choice: nagpahid sa iyo bilang hari
  alternative: nagtalaga sa iyo bilang hari
  rationale: Ang “nagpahid” ay nagpapanatili sa aktuwal na larawang Hebreo at sa kahalagahan nito bilang tanda ng pagtatalaga sa pagkahari, nang hindi ito pinapaliit sa abstraktong “nagtalaga.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Pinanatili ang pormal na tinig ng pahayag ng propeta, ang pag-uulit ng “ako,” at ang idyomang “mula sa kamay ni Saul,” habang iniwasan ang lipas o labis na teknikal na pananalita.
