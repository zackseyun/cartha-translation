    rationale: 'Ang כֹּה אָמַר ay karaniwang pormula ng pagpapahayag: “Ganito ang sabi ni Yahweh.” Hindi ito nangangailangan ng past tense at mas natural ang present-formula sa Tagalog.'
  - severity: low
    issue: Hindi ganap na malinaw ang saklaw ng “hari sa Israel.”
    rationale: Ang עַל יִשְׂרָאֵל ay tumutukoy sa paghahari sa Israel. Ang “hari ng Israel” ay mas tuwiran at natural na Tagalog para rito.
  - severity: low
