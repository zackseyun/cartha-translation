    rationale: Ang buong pahayag, kabilang ang pormulang “Ganito ang sabi ni Yahweh,” ay iisang direktang pagsasalita ni Natan; sapat ang isang antas ng panipi.
  revised_text: 'Sinabi ni Natan kay David[a], “Ikaw ang taong iyon! Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Pinahiran kita upang maging hari ng Israel, at iniligtas kita mula sa kamay ni Saul.”'
