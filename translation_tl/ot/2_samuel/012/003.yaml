  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: tl
  text: Ngunit ang mahirap na lalaki ay walang anuman maliban sa isang munting inahing tupa, na binili niya. Pinanatili niya itong buhay, at lumaki itong kasama niya at ng kaniyang mga anak. Kumakain ito mula sa kaniyang subo, umiinom mula sa kaniyang saro, at nahihiga sa kaniyang kandungan[b]; para niya itong anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “sa kaniyang kandungan” ay maaari ring isaling “sa kaniyang mga bisig” o “sa kaniyang dibdib”; inilalarawan nito ang malapit at magiliw na pag-aaruga.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: mahirap na lalaki
  rationale: Tumutukoy ito sa isang dukha o kapos na tao; pinananatili ng salin ang panlalaking isahan at ang kaibahan sa mayamang lalaki sa konteksto.
- source_word: אֵין כֹּל כִּי אִם
  choice: walang anumang pag-aari maliban sa
  rationale: Ipinahahayag ng idyoma ang lubos na kawalan na may iisang eksepsiyon; nililinaw ng 'pag-aari' ang diwang ipinahihiwatig sa konteksto.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: isang munting babaeng tupa
  rationale: Ang כִּבְשָׂה ay babaeng tupa, at ipinapakita ng 'munting' ang kaliitan at magiliw na himig ng קְטַנָּה.
- source_word: אֲשֶׁר קָנָה
  choice: na binili niya
  rationale: Karaniwang kahulugan ng קנה rito ang bumili o mag-angkin; ang 'binili' ang pinakatiyak at natural sa salaysay.
- source_word: וַיְחַיֶּהָ
  choice: Inalagaan niya itong manatiling buhay
  rationale: Pinananatili nito ang causative na diwa na pinanatili o itinaguyod niya ang buhay nito, habang natural sa Filipino ang pagbanggit sa kaniyang pag-aalaga.
- source_word: וַתִּגְדַּל עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: lumaki itong kasama niya at ang kaniyang mga anak
  rationale: Ang בָּנָיו ay pormal na 'kaniyang mga anak na lalaki,' ngunit maaaring katawanin ang mga anak sa sambahayan; ang 'kasama' ay natural na nagpapahiwatig ng יַחְדָּו.
- source_word: מִפִּתּוֹ
  choice: mula sa kaniyang kapirasong pagkain
  rationale: Ang פַּת ay isang piraso o subo ng tinapay/pagkain; pinananatili ng salin ang matalik na larawang ibinabahagi niya ang sarili niyang pagkain.
- source_word: מִכֹּסוֹ
  choice: mula sa kaniyang saro
  rationale: Tuwirang pinananatili ang larawang umiinom ang tupa mula sa mismong sisidlan ng lalaki.
- source_word: בְחֵיקוֹ תִשְׁכָּב
  choice: nahihiga sa kaniyang kandungan
  rationale: Ang חֵיק ay maaaring dibdib, bisig, o kandungan; 'kandungan' ay natural at malinaw na larawan ng malapit at magiliw na pag-aaruga, at ang 'nahihiga' ay hindi nagpapalagay na natutulog ito.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: Para niya itong anak na babae
  rationale: Natural na Filipino ito para sa tahasang paghahambing na ang tupa ay tulad ng isang anak na babae sa kaniya, nang hindi ginagawang literal na pagkakamag-anak.
theological_decisions:
- issue: Masinsing larawang pampamilya para sa babaeng tupa
  choice: Panatilihin nang tuwiran ang magiliw na larawang kasambahay at parang anak ang tupa
  alternative: Palambutin ang paglalarawan upang hindi maging labis na sentimental
  rationale: Sadyang pinatitingkad ng Hebreo ang habag at bigat ng talinghaga sa paglalarawang malapit ang tupa sa sambahayan; hindi ito dapat pahinain.
- issue: Saklaw ng בָּנָיו
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Bagaman panlalaki ang anyong Hebreo at maaaring isaling 'mga anak na lalaki,' ang 'mga anak' ay natural sa Tagalog para sa sambahayan at hindi kinakailangang magpasiya kung mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'kaniya' at 'saro' upang mapanatili ang dignidad ng salaysay; iniwasan ang labis na literal na ayos na magiging alanganin sa Tagalog.
