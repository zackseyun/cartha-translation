  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: tl
  text: Kinuha niya ang korona mula sa ulo ng kanilang hari[a]. Ang bigat ng korona ay isang talentong ginto[b], at may isang mahalagang bato rito. Inilagay ang korona sa ulo ni David. Inilabas niya mula sa lungsod ang napakaraming samsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang korona ni Milcom” (tinatawag ding “Malcam”), kung ang מַלְכָּם ay babasahin bilang pangalan ng diyos ng mga Ammonita sa halip na “kanilang hari.”
    reason: alternative_reading
  - marker: b
    text: Ang talento ay napakalaking sinaunang yunit ng timbang, na madalas tantiyahing humigit-kumulang 34 na kilo, bagaman magkakaiba ang eksaktong pamantayan noon.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: korona
  rationale: Karaniwan at likas na salitang Filipino para sa maharlikang putong sa kontekstong ito.
- source_word: מַלְכָּם
  choice: kanilang hari
  rationale: 'Sinusunod nito ang ibinigay na morpolohiya: מֶלֶךְ na may hulaping pangatlong panauhang maramihan. Nananatili sa talababa ang posibleng pagbasa rito bilang pangalang Milcom o Malcam.'
- source_word: מֵעַל רֹאשׁוֹ
  choice: mula sa ulo nito
  rationale: Ipinahahayag ng “mula sa” ang pag-aalis ng korona sa kinaroroonan nito sa ulo; ang “nito” ay tumutukoy sa hari sa naunang parirala.
- source_word: כִּכַּר זָהָב
  choice: isang talentong ginto
  rationale: Ang כִּכָּר ay malaking sinaunang yunit ng timbang. Pinanatili ang tradisyonal na terminong “talento” at ipinaliwanag ito sa talababa.
- source_word: וְאֶבֶן יְקָרָה
  choice: at may isang mahalagang bato rito
  rationale: Tahas ngunit maikli ang Hebreo, literal na “at isang mahalagang bato.” Nililinaw ng “rito” ang kaugnayan nito sa korona nang hindi tiyakang inilalarawan kung paano nakakabit ang bato.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: Inilagay iyon sa ulo ni David
  rationale: Natural na Filipino para sa pangyayaring ang korona ay napunta sa ulo ni David, alinsunod sa konteksto at sa resultang ipinahahayag ng sugnay.
- source_word: שְׁלַל הָעִיר
  choice: samsam mula sa lungsod
  rationale: Ang “samsam” ay malinaw at kasalukuyang salitang Filipino para sa mga ari-ariang kinuha bilang booty sa digmaan.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: Inilabas niya mula sa lungsod ang napakaraming samsam
  rationale: Pinananatili ng “inilabas” ang causative/directional na diwa ng הוֹצִיא, at natural na ipinahahayag ng “napakarami” ang matinding kasaganaan ng samsam.
theological_decisions:
- issue: Kung ang מַלְכָּם ay nangangahulugang “kanilang hari” o pangalang “Milcom/Malcam” ng diyos ng mga Ammonita
  choice: kanilang hari
  alternative: Milcom o Malcam
  rationale: Sinusuportahan ng ibinigay na morpolohiya at ng kasunod na “mula sa ulo nito” ang pagtukoy sa isang hari. Gayunman, tunay at matagal nang kinikilalang alternatibo ang pagbasa rito bilang pangalan ng diyos ng mga Ammonita, kaya hindi ito inalis kundi inilagay sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “korona,” “mahalagang bato,” at “samsam” bilang likas ngunit tumpak na mga katumbas. Pinanatili ang “talento” dahil yunit ito ng sinaunang timbang at nilinaw sa talababa. Iniwasang lutasin nang palihim ang tunay na kalabuan sa מַלְכָּם.
