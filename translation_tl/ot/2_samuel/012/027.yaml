  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: tl
  text: Pagkatapos, nagsugo si Joab ng mga mensahero kay David at sinabi[a], “Nakipaglaban ako sa Rabba, at nakuha ko rin ang lunsod ng tubig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “ang lunsod ng mga tubig,” na malamang ay tumutukoy sa bahagi ng Rabba na kumokontrol sa suplay nito ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong ito, tumutukoy ito sa mga taong isinugo upang maghatid ng ulat, hindi sa mga anghel.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: Nakipaglaban ako sa Rabba
  rationale: Ipinahahayag ng pandiwa ang pakikipagdigma, at natural sa Filipino ang “nakipaglaban ... sa Rabba” sa konteksto ng pagsalakay sa isang lunsod.
- source_word: רַבָּה
  choice: Rabba
  rationale: Isinalin sa baybay-Filipino ang pangalang pantangi nang hindi idinaragdag ang pagkakakilanlang malinaw na sa konteksto.
- source_word: גַּם
  choice: rin
  rationale: Pinananatili nito ang pandagdag na diwa na ang pagsakop ay karagdagan sa pakikipaglaban.
- source_word: לָכַדְתִּי
  choice: nasakop ko
  rationale: Ang “nasakop” ay natural na terminong militar para sa matagumpay na pagkuha ng isang lunsod.
- source_word: עִיר הַמָּיִם
  choice: lunsod ng mga tubig
  rationale: Malapit ito sa anyo ng Hebreo at hindi agad nilulutas ang maaaring kahulugan nitong bahagi ng lunsod na kumokontrol sa suplay ng tubig.
