base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: tl
  text: Sinabi ni David kay Natan, “Nagkasala ako laban kay Yahweh.” Sinabi naman ni Natan kay David, “Inalis na rin ni Yahweh ang iyong kasalanan[a]; hindi ka mamamatay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinalampas na rin ni Yahweh ang iyong kasalanan.” Literal na may diwang “pinaraan” o “pinalampas” ang pandiwang Hebreo; dito, tumutukoy ito sa pag-aalis ng kasalanan o ng pananagutang dulot nito.
    reason: lexical_alternative
  - marker: b
    text: O “hindi ka papatayin.” Payak na sinasabi ng Hebreo na “hindi ka mamamatay,” bagaman maaaring ipinahihiwatig ng legal na konteksto na hindi ipatutupad ang hatol na kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Ang Qal perfect na unang panauhan ay tuwirang pag-amin sa nagawang kasalanan. Likas at malinaw sa modernong Tagalog ang “Nagkasala ako.”
- source_word: לַיהוָה
  choice: laban kay Yahweh
  rationale: Bagaman maaaring mangahulugan ang ל ng direksiyon o kaugnayan, kasama ng חטא ay natural itong nagpapahayag ng taong laban sa kaniya ginawa ang kasalanan.
- source_word: גַּם
  choice: rin
  rationale: Pinananatili ng “rin” ang dagdag o tugon na ipinahihiwatig ng גַּם nang hindi labis na binibigyang-kahulugan ito.
- source_word: הֶעֱבִיר
  choice: Inalis na
  rationale: Ang Hiphil ng עבר ay literal na “pinaraan” o “pinalampas,” ngunit kapag ang layon ay kasalanan, ipinahihiwatig nito ang pag-aalis ng kasalanan o ng pananagutang kaugnay nito. Malinaw at natural ang “inalis,” habang inilalagay sa talababa ang mas literal na larawan.
- source_word: חַטָּאתְךָ
  choice: ang iyong kasalanan
  rationale: Tumutukoy ito sa pagkakasalang ipinagtapat ni David; hindi hinihingi ng konteksto ang kahulugang “handog para sa kasalanan.”
- source_word: לֹא תָמוּת
  choice: hindi ka mamamatay
  rationale: Payak na sinasabi ng Hebreo na hindi mamamatay si David. Hindi idinaragdag sa pangunahing teksto ang mas interpretatibong “hindi ka papatayin.”
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi ... Sinabi naman
  rationale: Natural nitong inilalahad sa Tagalog ang sunod-sunod na pananalita; ang “naman” ay malinaw na nagmamarka sa tugon ni Natan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan ng Diyos ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Kalikasan ng pag-aalis sa kasalanan sa הֶעֱבִיר חַטָּאתְךָ
  choice: Inalis na rin ni Yahweh ang iyong kasalanan
  alternative: Pinalampas na rin ni Yahweh ang iyong kasalanan
  rationale: Malinaw na ipinahahayag ng talata ang banal na pag-aalis sa kasalanan at ang bunga nitong hindi pagkamatay ni David, ngunit hindi nito ipinaliliwanag dito ang paraan ng pagtubos. Kaya hindi nagdaragdag ang salin ng sistematikong paliwanag.
- issue: Saklaw ng לֹא תָמוּת
  choice: hindi ka mamamatay
  alternative: hindi ka papatayin
  rationale: Pinananatili ang payak ngunit maringal na pahayag ng Hebreo. Maaaring may legal na hatol na kamatayan sa likod ng pananalita, ngunit hindi tahasang gumagamit ang teksto ng pandiwang “papatayin.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagsasalaysay sa Kasulatan. Ginamit ang “kay” sa mga personal na pangalan at iniwasan ang labis na teknikal o denominasyonal na pananalita.
