base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: tl
  text: Dumulog si David sa Diyos alang-alang sa bata.[a] Nag-ayuno si David[b]; pagkatapos, pumasok siya, nagpalipas ng gabi, at nahiga sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bata” ay ang anak ni David na dinapuan ng sakit (mga talata 15, 18). Maaari ring isalin ang salitang Hebreo na “batang lalaki.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, magkaugnay ang pandiwa at pangngalan: sa literal, “nag-ayuno ng ayuno.” Ang pag-uulit na ito ay nagbibigay-diin sa kanyang pag-aayuno.'
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: dumulog
  rationale: Sa kontekstong ito, ang בקש ay taimtim na paghahanap o paglapit sa Diyos para sa kapakanan ng bata. Ang “dumulog” ay natural sa modernong Filipino at nagpapahiwatig ng mapanalanging paglapit nang hindi kasing-tiyak o kasing-lakas ng “nagsumamo.”
- source_word: אֶת־הָאֱלֹהִים
  choice: sa Diyos
  rationale: Bagaman tuwirang layon sa Hebreo ang Diyos, hinihingi ng pandiwang Filipino na “dumulog” ang pang-ukol na “sa.”
- source_word: בְּעַד
  choice: alang-alang sa
  rationale: Ipinahahayag nito na kumilos si David para sa kapakanan ng bata; pinananatili nito ang puwersang namamagitan ng parirala.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Maaaring tumukoy ang נער sa bata, batang lalaki, kabataan, o lingkod. Dito ay anak ni David na maysakit; ang “bata” ay natural at hindi nagpapalagay ng edad na mas matanda kaysa ipinahihiwatig ng konteksto.
- source_word: וַיָּצָם ... צוֹם
  choice: nag-ayuno
  rationale: Hindi likas sa Filipino ang tuwirang pag-uulit na “nag-ayuno ng ayuno.” Ginamit ang natural na pandiwa, habang ipinaliliwanag sa talababa ang magkaugnay na pandiwa at pangngalan sa Hebreo at ang pagbibigay-diin nito.
- source_word: וּבָא
  choice: pumasok siya
  rationale: Pinananatili nito ang direksiyonal na diwa ng בוא sa daloy ng salaysay, nang hindi tinutukoy ang lugar na hindi naman pinangalanan sa talata.
- source_word: וְלָן
  choice: nagpalipas ng gabi
  rationale: Malinaw at natural itong katumbas ng לון, na tumutukoy sa pananatili o pagpapalipas ng magdamag.
- source_word: וְשָׁכַב אָרְצָה
  choice: nahiga sa lupa
  rationale: Tuwirang inilalarawan nito ang kilos at kinalalagyan ni David. Hindi ginamit ang “sahig” sapagkat “lupa” ang tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Katangian ng paglapit ni David sa Diyos
  choice: dumulog sa Diyos
  alternative: nagsumamo sa Diyos / hinanap ang Diyos
  rationale: Ipinahihiwatig ng konteksto ang pananalangin o pagsusumamo, ngunit ang pandiwang בקש mismo ay mas malawak na “maghanap/humiling.” Ang “dumulog” ay nagpapanatili ng mapanalanging konteksto nang hindi ginagawang tahasang pagsusumamo ang maaaring sadyang malawak na salita.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang “dumulog” bilang natural na pananalitang panrelihiyon ngunit hindi labis na denominasyonal. Pinanatiling magkakahiwalay ang mga kilos sa huling bahagi ng talata sa halip na ipakahulugang buong gabing nakahiga si David, sapagkat magkakaugnay ngunit magkakahiwalay na pandiwa ang nasa Hebreo.
