base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh: ‘Narito, magpapasapit ako ng kapahamakan laban sa iyo mula sa sarili mong sambahayan. Kukunin ko ang iyong mga asawa sa harap ng iyong mga mata at ibibigay ko sila sa iyong kasamahan[a]. Sasiping siya sa iyong mga asawa sa harap ng araw na ito[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong kapuwa” o “isang taong malapit sa iyo.” Malawak ang kahulugan ng salitang Hebreo na רֵעַ.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa harap ng araw na ito”; ibig sabihin, lantad at hayagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na katumbas sa modernong Tagalog ng pormulang ginagamit ng mensaherong propeta.
- source_word: הִנְנִי
  choice: Tingnan mo
  rationale: Pinananatili ang panawag-pansing bisa ng katagang Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: מֵקִים ... רָעָה
  choice: magbabangon ako ng kapahamakan
  rationale: Ang רָעָה ay tumutukoy rito sa kapahamakang dumarating bilang paghatol, hindi sa moral na kasamaan; ang “magbabangon” ay sumasalamin sa pandiwang מֵקִים.
- source_word: מִבֵּיתֶךָ
  choice: mula mismo sa sarili mong sambahayan
  rationale: Ang בַּיִת ay tumutukoy sa sambahayan o pamilya ni David; nililinaw ng “mismo” na magmumula sa loob nito ang kapahamakan.
- source_word: לְעֵינֶיךָ
  choice: sa harap ng iyong mga mata
  rationale: Pinananatili ang kongkretong larawan at ang diwang mangyayari ito nang lantad at batid ni David.
- source_word: לְרֵעֶיךָ
  choice: sa isang taong malapit sa iyo
  rationale: Pinananatili ang lawak ng רֵעַ, na maaaring mangahulugang kapuwa, kasamahan, o taong malapit, nang hindi labis na tinutukoy ang relasyon.
- source_word: וְשָׁכַב עִם
  choice: sisipingan niya
  rationale: Ang “sisipingan” ay isang dignified at malinaw na Tagalog na eupemismo para sa seksuwal na pakikipagtalik.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: sa harap ng araw na ito
  rationale: Pinananatili ang kapansin-pansing literal na larawan ng tekstong Hebreo, habang ipinapaliwanag sa talababa ang kahulugang lantad at hayagan.
theological_decisions:
- issue: Kahulugan ng רָעָה sa konteksto ng paghatol ng Diyos
  choice: kapahamakan
  alternative: kasamaan
  rationale: Sa kontekstong ito, tumutukoy ang salita sa mapaminsalang paghatol na ibabangon laban kay David, hindi sa moral na kasamaan. Pinananatili nito ang pahayag tungkol sa pagkilos ni Yahweh nang hindi ipinahihiwatig na gumagawa siya ng moral na kasamaan.
- issue: Pagkakakilanlan ng רֵעַ
  choice: isang taong malapit sa iyo
  alternative: iyong kapuwa / iyong kasamahan
  rationale: Hindi tahasang pinapangalanan ng talata ang tao. Ang salin ay nagpapanatili sa di-tiyak ngunit relational na kahulugan ng Hebreo at hindi ipinapasok sa mismong talata ang pagkakakilanlang mahihinuha mula sa kasunod na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang bigat ng pahayag ng paghatol, ang konkretong larawang “sa harap ng iyong mga mata” at “sa harap ng araw na ito,” at ang eupemistikong paraan ng Hebreo sa pagtukoy sa pakikipagtalik.
