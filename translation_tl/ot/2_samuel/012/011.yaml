revisions:
- from: 'Ganito ang sinabi ni Yahweh: ‘Tingnan mo, magbabangon ako ng kapahamakan laban sa iyo mula mismo sa sarili mong sambahayan. Kukunin ko ang iyong mga asawa sa harap ng iyong mga mata at ibibigay ko sila sa isang taong malapit sa iyo[a]. Sisipingan niya ang iyong mga asawa sa harap ng araw na ito[b].’'
  to: 'Ganito ang sabi ni Yahweh: ‘Narito, magpapasapit ako ng kapahamakan laban sa iyo mula sa sarili mong sambahayan. Kukunin ko ang iyong mga asawa sa harap ng iyong mga mata at ibibigay ko sila sa iyong kasamahan[a]. Sasiping siya sa iyong mga asawa sa harap ng araw na ito[b].’'
  rationale: Inayos ang pormulang pangpropeta sa pangkasalukuyang “Ganito ang sabi,” pinalitan ang mas interpretatibong paglalarawan ng רֵעֶךָ ng “iyong kasamahan,” at pinakinis ang mga pandiwang Tagalog nang hindi binabago ang kahulugan, antas ng katiyakan, o eupemistikong register ng Hebreo. Napanatili ang mga talababa at ang wastong mga angkla nito.
