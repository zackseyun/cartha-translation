base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: tl
  text: Nang makita ni David na nagbubulungan ang kanyang mga lingkod, napagtanto niyang patay na ang bata. Kaya sinabi ni David sa kanyang mga lingkod, “Patay na ba ang bata?” Sumagot sila, “Patay na.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, iisang salitang “Patay” lamang ang sagot; idinagdag ang “na” upang maging natural sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: makita
  rationale: Tuwirang ipinapahayag ng ראה ang nakitang kilos ng mga lingkod na naging batayan ng pagkaunawa ni David.
- source_word: מִתְלַחֲשִׁים
  choice: nagbubulungan
  rationale: Ipinahihiwatig ng anyong hitpael participle ng לחש ang mahina at palihim na pag-uusap sa isa't isa; natural itong ipinapahayag ng “nagbubulungan.”
- source_word: וַיָּבֶן
  choice: napagtanto
  rationale: Ang בין dito ay mental na pagkilala batay sa napansing palatandaan. Mas natural sa kasalukuyang Tagalog ang “napagtanto” kaysa sa literal ngunit maaaring mabigat na “naunawaan.”
- source_word: מֵת
  choice: patay na
  rationale: Ipinapahayag ng salita ang kalagayan ng pagkamatay. Ang “patay na” ang natural na Tagalog kapwa sa pahayag at sa tanong, at ipinakikita ng “na” ang kalagayang naganap na.
- source_word: הַיָּלֶד
  choice: ang bata
  rationale: Maaaring mangahulugan ang יֶלֶד ng bata o batang lalaki; “ang bata” ang pinakatumpak sa konteksto ng sanggol na anak ni David.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng sambahayan ng hari, tumutukoy ang עֶבֶד sa mga tagapaglingkod o tauhan; hindi kailangang idiin dito ang legal na katayuang alipin.
- source_word: הֲמֵת הַיֶּלֶד
  choice: Patay na ba ang bata?
  rationale: Pinananatili nito ang tanong tungkol sa kalagayan ng bata at natural ang ayos sa modernong Tagalog.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: sinabi ... sumagot
  rationale: Literal na “sinabi ... sinabi” ang mga pandiwa, ngunit malinaw sa konteksto na tugon ang ikalawang pagsasalita; ang “sumagot” ay natural at hindi nagdaragdag ng bagong nilalaman.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “nagbubulungan” para sa tahimik na pag-uusap ng mga lingkod at “napagtanto” para sa paghinuha ni David mula sa kanilang kilos.
