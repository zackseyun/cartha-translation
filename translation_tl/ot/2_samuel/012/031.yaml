  naturalness: Malinaw at likas ang makabagong Filipino ng salin. Ang “mga kasangkapang pamutol na bakal” ay bahagyang mas natural at mas malinaw kaysa “mga pamutol na bakal.”
  terminology: Ang “mga Ammonita,” “ladrilyo,” at “Jerusalem” ay angkop. Ang “mga tao” ay pinanatili para sa הָעָם, nang hindi nagdadagdag ng espesipikong kahulugang militar.
