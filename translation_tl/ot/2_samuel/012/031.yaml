base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: tl
  text: Inilabas niya ang mga taong naroon at ipinagtrabaho sila gamit ang mga lagari,[a] matutulis na kasangkapang bakal, at mga kasangkapang pamutol na bakal. Pinagtrabaho rin niya sila sa gawaan ng ladrilyo.[b] Ganito ang ginawa niya sa lahat ng lungsod ng mga Ammonita.[c] Pagkatapos, bumalik si David at ang lahat ng mga tao sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “inilagay sila sa lagari, sa matutulis na kasangkapang bakal, at sa mga kasangkapang pamutol na bakal.” Hindi tiyak ang eksaktong mga pangalan ng mga kagamitan.'
    reason: lexical_alternative
  - marker: b
    text: 'Mahirap unawain ang Hebreo. Ayon sa tradisyonal na pagbasa: “pinaraan niya sila sa hurno ng ladrilyo”; nauunawaan ito ng ilan bilang pagpatay sa halip na sapilitang paggawa.'
    reason: alternative_reading
  - marker: c
    text: Ihambing ang 1 Cronica 20:3, isang kaagapay na salaysay na mahirap ding unawain ang pananalita.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: Inilabas
  rationale: Karaniwang kahulugan ng hiphil ng יצא ang pagpapalabas o paglalabas; likas at tuwiran ang “inilabas” sa makabagong Tagalog.
- source_word: וַיָּשֶׂם
  choice: ipinagtrabaho sila gamit ang
  rationale: Literal itong “inilagay,” ngunit sa pagkakasunod ng mga kasangkapan ay maaaring tumukoy sa sapilitang pagtatalaga sa trabaho. Pinananatili ng salin ang pagbasa bilang paggawa nang hindi ikinukubli ang alternatibo sa talababa.
- source_word: בַּמְּגֵרָה
  choice: mga lagari
  rationale: Ang מְגֵרָה ay lagari. Ginawang maramihan dahil maaaring kolektibo o instrumental ang anyong isahan at mas natural ito sa talaan ng mga kagamitan.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: matutulis na kasangkapang bakal
  rationale: Hindi tiyak ang eksaktong kagamitan; maaaring matalim na kasangkapan o panggiik. Ang mas malawak na parirala ay umiiwas sa labis na pagtitiyak.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: mga pamutol na bakal
  rationale: Tumutukoy ang salita sa mga kasangkapang pamputol, ngunit hindi tiyak ang eksaktong uri; kaya pinanatiling pangkalahatan ang salin.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: Pinagtrabaho rin niya sila
  rationale: Literal na “pinaraan niya sila,” ngunit sa konteksto ay maaaring sapilitang paggawa ang diwa. Dahil mahirap ang Hebreo, inilalahad sa talababa ang tradisyonal na literal at mas marahas na pagbasa.
- source_word: במלכן
  choice: sa gawaan ng ladrilyo
  rationale: Mahina at mahirap ang anyong katinig. Ang pagbasa bilang lugar ng paggawa ng ladrilyo ay nagbibigay ng magkakaugnay na diwa ng sapilitang paggawa, habang itinatala ang ibang pagbasa sa talababa.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Ganito ang ginawa niya
  rationale: Natural na buod sa Tagalog ng ginawa ni David sa iba pang mga lungsod.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: sa lahat ng lungsod ng mga Ammonita
  rationale: Ang “mga Ammonita” ang natural na etnonimo sa Tagalog para sa בְנֵי עַמּוֹן.
- source_word: וַיָּשָׁב דָּוִד וְכָל הָעָם יְרוּשָׁלִָם
  choice: bumalik si David at ang buong hukbo sa Jerusalem
  rationale: Bagaman literal na “ang buong bayan/mga tao,” sa konteksto ng pagbabalik mula sa kampanyang militar ay natural ang “buong hukbo.”
theological_decisions:
- issue: Kung pinatay ni David ang mga bihag na Ammonita sa pamamagitan ng mga kasangkapan at hurno o pinilit silang magtrabaho
  choice: Pinilit silang magtrabaho gamit ang mga kasangkapan at sa gawaan ng ladrilyo
  alternative: Pinatay sila sa pamamagitan ng mga lagari at kasangkapang bakal at pinaraan sa hurno; o inilagay sila sa ilalim ng mga kasangkapang iyon
  rationale: Mahigit sa isang pagbasa ang pinahihintulutan ng mahirap na Hebreo, lalo na sa וַיָּשֶׂם at וְהֶעֱבִיר ... במלכן. Pinili sa pangunahing teksto ang sapilitang-paggawa na pagbasa dahil magkakaugnay ito sa konteksto at sa kaagapay na 1 Cronica 20:3, ngunit malinaw na pinanatili sa talababa ang mas marahas na tradisyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gawaan ng ladrilyo” sa halip na “hurno” sa pangunahing teksto upang ipakita ang napiling pagbasa bilang sapilitang paggawa, habang ang tunay na ambiguwidad at posibilidad ng pagpatay ay hayagang pinanatili sa talababa. Ang lahat ng marker [a]–[c] ay nasa pangunahing teksto.
