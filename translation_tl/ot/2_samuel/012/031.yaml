revisions:
- from: Inilabas niya ang mga taong naroon at ipinagtrabaho sila gamit ang mga lagari,[a] matutulis na kasangkapang bakal, at mga pamutol na bakal. Pinagtrabaho rin niya sila sa gawaan ng ladrilyo.[b] Ganito ang ginawa niya sa lahat ng lungsod ng mga Ammonita.[c] Pagkatapos, bumalik si David at ang buong hukbo sa Jerusalem.
  to: Inilabas niya ang mga taong naroon at ipinagtrabaho sila gamit ang mga lagari,[a] matutulis na kasangkapang bakal, at mga kasangkapang pamutol na bakal. Pinagtrabaho rin niya sila sa gawaan ng ladrilyo.[b] Ganito ang ginawa niya sa lahat ng lungsod ng mga Ammonita.[c] Pagkatapos, bumalik si David at ang lahat ng mga tao sa Jerusalem.
