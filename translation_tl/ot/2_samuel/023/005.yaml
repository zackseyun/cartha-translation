  to: Sapagkat hindi gayon ang aking sambahayan sa Diyos[a]; gayunman, nagtatag siya para sa akin ng walang-hanggang tipan, na maayos sa lahat ng bagay at iniingatan. Sapagkat ito ang buong kaligtasan ko at ang lahat ng aking ninanais—hindi nga ba niya ito palalaguin?[b]
