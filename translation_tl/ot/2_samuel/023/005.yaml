  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: tl
  text: Sapagkat hindi gayon ang aking sambahayan sa Diyos[a]; gayunman, nagtatag siya para sa akin ng walang-hanggang tipan, na maayos sa lahat ng bagay at iniingatan. Sapagkat ito ang buong kaligtasan ko at ang lahat ng aking ninanais—hindi nga ba niya ito palalaguin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ba gayon ang aking sambahayan sa Diyos?” Marami ang umuunawa sa pambungad bilang positibong retorikal na tanong, sa halip na negatibong pahayag.
    reason: alternative_reading
  - marker: b
    text: O, “sapagkat tiyak na pasisibulin niya ito” o “palalaguin niya ito.” Mahirap ang pangwakas na sugnay sa Hebreo at maaaring basahin bilang retorikal na tanong o mariing pagpapatibay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Sa simula, nagpapaliwanag ito at nag-uugnay sa naunang pahayag; ang iba pang paglitaw nito sa talata ay isinalin ayon sa kani-kanilang gamit sa pangungusap.
- source_word: לֹא כֵן
  choice: hindi gayon
  rationale: Pinananatili ang negatibong anyo at ang sadyang di-tiyak na tinutukoy ng “gayon,” sa halip na ipaliwanag ito nang higit sa Hebreo.
- source_word: בֵּיתִי
  choice: aking sambahayan
  rationale: Ang “sambahayan” ay natural sa modernong Filipino at maaari pa ring tumukoy sa pamilya at sa dinastikong angkan ni David.
- source_word: עִם אֵל
  choice: sa harap ng Diyos
  rationale: Bagaman karaniwang “kasama ng Diyos” ang literal na anyo, mas natural dito ang relasyonal na “sa harap ng Diyos” nang hindi nilulutas ang kahirapan ng buong sugnay.
- source_word: בְרִית עוֹלָם
  choice: walang-hanggang tipan
  rationale: Karaniwan at malinaw na pananalitang biblikal para sa isang tipang may namamalaging bisa.
- source_word: שָׂם לִי
  choice: gumawa siya sa akin
  rationale: Ipinahahayag nang natural ang pagtatatag ng tipan, habang pinananatili ang Hebreong לִי, na literal na “para/sa akin,” sa halip na awtomatikong gawing “kasama ko.”
- source_word: עֲרוּכָה בַכֹּל
  choice: inayos sa lahat ng bagay
  rationale: Pinananatili ang diwa ng isang tipang lubos na isinaayos o itinakda nang maayos.
- source_word: וּשְׁמֻרָה
  choice: tiniyak na mananatili
  rationale: Natural na Filipino para sa pasibong diwa ng pagiging binantayan, iniingatan, o pinananatiling ligtas.
- source_word: כָל יִשְׁעִי
  choice: buo kong kaligtasan
  rationale: Ipinapakita ang kabuuang saklaw ng כָּל at ang malawak na kahulugan ng יֵשַׁע bilang kaligtasan o pagliligtas.
- source_word: וְכָל חֵפֶץ
  choice: ang lahat ng aking ninanais
  rationale: Ang חֵפֶץ ay maaaring “hangarin,” “nais,” o “kaluguran”; pinili ang malinaw at natural na “ninanais.”
- source_word: כִּי לֹא יַצְמִיחַ
  choice: hindi nga ba niya ito palalaguin?
  rationale: Binabasa bilang positibong retorikal na tanong; ipinahahayag ng “palalaguin” ang causative na anyo ng pandiwang צמח, ngunit iniiwang maluwag ang tinutukoy ng “ito.”
theological_decisions:
- issue: Kahulugan ng pambungad na כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: 'Isinalin bilang negatibong pahayag: “hindi gayon ang aking sambahayan sa harap ng Diyos.”'
  alternative: “Hindi ba gayon ang aking sambahayan sa harap ng Diyos?” o “Tunay na gayon ang aking sambahayan sa harap ng Diyos.”
  rationale: Negatibo ang nakapuntos na tekstong Hebreo, bagaman maaaring unawain ang parirala bilang positibong retorikal na tanong. Pinananatili sa pangunahing teksto ang tensiyon at inilalagay sa talababa ang mahalagang alternatibo.
- issue: Pangwakas na כִּי לֹא יַצְמִיחַ
  choice: 'Isinalin bilang positibong retorikal na tanong: “hindi nga ba niya ito palalaguin?”'
  alternative: “Sapagkat tiyak na palalaguin niya ito” o ang literal na negatibong “sapagkat hindi niya ito palalaguin.”
  rationale: Mas umaayon ang retorikal na tanong sa pahayag tungkol sa walang-hanggang tipan, ngunit mahirap at siksik ang Hebreo. Hindi tahasang pinangalanan ang layon upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang mapanatili ang saklaw na pampamilya at pandinastiya, at iniwasang gawing mas tiyak kaysa sa Hebreo ang dalawang mahirap na sugnay.
