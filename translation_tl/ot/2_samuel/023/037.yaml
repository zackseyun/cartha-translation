base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: tl
  text: si Zelek na Ammonita, si Naharai[a] na taga-Beerot, tagapagdala ng mga sandata ni Joab na anak ni Zeruia;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Naharai ay binabaybay ding Nahrai sa ilang transliterasyong Ingles.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶלֶק
  choice: Zelek
  rationale: Pangalan ng tao; isinalin sa baybay na madaling basahin sa modernong Filipino habang malapit sa anyong Hebreo.
- source_word: הָעַמֹּנִי
  choice: Ammonita
  rationale: Karaniwang katawagang Filipino sa isang taong mula sa bayan ng Ammon.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Pinananatili ang mga patinig na ipinahihiwatig ng Masoretikong pagbasa; inilagay sa talababa ang mas maikling alternatibong transliterasyon.
- source_word: הַבְּאֵרֹתִי
  choice: taga-Beerot
  rationale: Likas at malinaw na Filipino para sa katawagang heograpiko na tumutukoy sa isang taong mula sa Beerot.
- source_word: נשאי כְּלֵי
  choice: tagapagdala ng mga sandata
  rationale: Sa kontekstong militar, ang parirala ay tumutukoy sa taong nagdadala ng kagamitang pandigma. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit maaaring makitid na “tagapagdala ng baluti.”
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joab na anak ni Zeruia
  rationale: Tuwirang pinananatili ang pagkakakilanlan kay Joab sa pamamagitan ng pangalan ng kanyang magulang, ayon sa Hebreo.
theological_decisions: []
translation_notes:
  register: Maikli at marangal ang anyo upang mapanatili ang estilo ng talaan. Ginamit ang natural na “taga-Beerot” at ang malinaw na pariralang “tagapagdala ng mga sandata.” Inilipat ang pananda ng talababa sa pangalang Naharai, sapagkat iyon ang tinutukoy ng talababa.
