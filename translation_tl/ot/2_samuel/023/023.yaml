translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa. Ginamit ang “tatlumpu” at “tatlo” bilang kinikilalang mga pangkat ng mga mandirigma sa konteksto. Iniwasan ang labis na teknikal o makalumang pananalita, at pinanatili sa mga talababa ang tunay na mga alternatibong pagbasa sa Hebreo.
