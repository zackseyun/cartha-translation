  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: tl
  text: Siya ay pinarangalan sa hanay ng Tatlumpu[a], ngunit hindi niya naabot ang antas ng Tatlo[b]. At itinalaga siya ni David na mamahala sa bantay ni David[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Higit siyang pinarangalan kaysa sa Tatlumpu.” Maaaring paghahambing ang ipinahihiwatig ng pagkakabuo sa Hebreo sa halip na pagsama sa kaniya sa pangkat.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ngunit hindi siya nakarating sa Tatlo,” ibig sabihin, hindi niya naabot ang ranggo ng tatlong pangunahing mandirigma.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa kaniyang mishmaath.” Maaari itong mangahulugang “sa kaniyang pamumuno,” “sa kaniyang nasasakupan,” o “sa kaniyang bantay.” Ang saling “bantay ni David” ay batay sa malamang na diwang militar sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים נִכְבָּד
  choice: Pinarangalan siya sa tatlumpu
  rationale: Ang Niphal na נִכְבָּד ay nagpapahayag na siya ay pinarangalan o iginalang. Maaaring unawain ang מִן bilang paglalagay sa kaniya sa loob ng pangkat o bilang paghahambing; pinananatili ng pangunahing salin ang unang posibilidad at inilalagay sa talababa ang ikalawa.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: ngunit hindi niya naabot ang antas ng tatlo
  rationale: Sa konteksto ng ranggo ng mga mandirigma, ang בוא אֶל ay may diwang pag-abot sa katayuan ng isang pangkat. Nililinaw ng “antas” ang idyomatikong diwa nang hindi ipinapantay si Benaias sa tatlo.
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: At itinalaga siya ni David
  rationale: Bagaman literal na “inilagay,” ang שׂים ay natural na nangangahulugang “italaga” kapag tungkulin o pamamahala ang tinutukoy.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: na mamahala sa kaniyang bantay
  rationale: Ang מִשְׁמַעַת ay maaaring tumukoy sa utos, nasasakupan, o pangkat na nasa ilalim ng kapangyarihan. Sa kontekstong militar at maharlika, malamang na isang bantay o personal na pangkat ng seguridad ang tinutukoy, ngunit minamarkahan ang leksikal na kawalang-katiyakan.
