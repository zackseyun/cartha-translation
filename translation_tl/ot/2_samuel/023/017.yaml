revisions:
- from: Sinabi niya, “Huwag nawang mangyari sa akin sa harap ni Yahweh na gawin ko ito! Hindi ba ito ang dugo ng mga lalaking humayo nang nakataya ang kanilang buhay?” Kaya ayaw niya itong inumin. Ito ang ginawa ng tatlong magigiting na mandirigma.
  to: Sinabi niya, “Huwag nawang mangyari sa akin, Yahweh, na gawin ko ito! Hindi ba dugo ito ng mga lalaking humayo nang nakataya ang kanilang buhay?” Kaya hindi niya nais itong inumin. Ang mga bagay na ito ang ginawa ng tatlong magigiting na mandirigma.
  rationale: Inalis ang dagdag na “sa harap ni” at ginawang bokatibo ang “Yahweh,” na mas malapit sa pormula ng Hebreo at sa English audit trail. Pinanatili ang retorikal na tanong at ang idiomang “nakataya ang kanilang buhay.” Isinaayos ang pangwakas na demonstratibo upang maipakita ang maramihang “mga bagay na ito,” at ginamit ang “hindi niya nais” upang maihatid ang hindi-pagpayag/pagkagustong ipinahihiwatig ng אָבָה.
