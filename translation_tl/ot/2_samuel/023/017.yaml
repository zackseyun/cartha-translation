base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: tl
  text: Sinabi niya, “Huwag nawang mangyari sa akin, Yahweh, na gawin ko ito! Hindi ba dugo ito ng mga lalaking humayo nang nakataya ang kanilang buhay?” Kaya hindi niya nais itong inumin. Ang mga bagay na ito ang ginawa ng tatlong magigiting na mandirigma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Huwag nawang mangyari sa akin sa harap ni Yahweh
  rationale: Ang חָלִילָה ay mariing pahayag ng pagkasuklam o pagtanggi. Ang pariralang “sa harap ni Yahweh” ay natural sa Tagalog at pinananatili ang posibleng ugnayang ipinahihiwatig ng לִי יְהוָה nang hindi tiyak na ginagawang panawagan ang banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalan ng Diyos sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: na gawin ko ito
  rationale: Malinaw at natural na ipinapahayag ang mariing pagtanggi ni David na isagawa ang tinutukoy na kilos.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Hindi ba ito ang dugo ng mga lalaki
  rationale: Pinananatili ang anyong retorikal na tanong ng Hebreo at ang matinding paghahambing ng tubig sa dugo ng mga lalaking nagsapanganib.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: humayo nang nakataya ang kanilang buhay
  rationale: Ang literal na “humayo dala/kasama ang kanilang mga buhay” ay isang pahayag ng pagharap sa panganib na ikamatay; malinaw itong naihahatid ng “nakataya ang kanilang buhay.”
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Kaya ayaw niya itong inumin
  rationale: Ang אָבָה ay tumutukoy sa pagpayag o pagkukusa. Ang “ayaw” ay natural na makabagong Tagalog; ang isahang “ito” ay tumutukoy sa tubig.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: Ito ang ginawa ng tatlong magigiting na mandirigma
  rationale: Pinananatili ang pangwakas na pagbubuod sa ginawa ng tatlong elite na mandirigma, habang natural ang ayos ng pangungusap sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa tubig bilang dugo
  choice: 'Panatilihin bilang retorikal na tanong: “Hindi ba ito ang dugo...?”'
  alternative: “Para ko na ring iinumin ang dugo...”
  rationale: Hindi literal na sinasabing dugo ang tubig; itinuturing ito ni David na katumbas ng dugo dahil nakuha iyon sa panganib ng buhay. Pinananatili ng salin ang matinding talinghaga at hindi ito nilulutas sa paliwanag sa mismong teksto.
- issue: Pagkakaugnay ng יְהוָה sa pahayag na חָלִילָה לִי
  choice: “sa harap ni Yahweh”
  alternative: “O Yahweh”
  rationale: Maaaring unawain ang banal na pangalan bilang panawagan o bilang pagtukoy sa mariing pagtanggi sa harap ng Diyos. Pinili ang anyong natural sa Tagalog na hindi labis na nagpapasya na ito ay tuwirang bokatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “magigiting na mandirigma” upang maging malinaw ang militar na gamit ng גִּבֹּרִים sa konteksto. Walang footnote dahil sapat na naipahahayag sa teksto ang idiom at retorikal na paghahambing.
