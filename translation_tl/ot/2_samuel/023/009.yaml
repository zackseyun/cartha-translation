translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang pantangi at ang hindi tiyak na kahulugan ng huling pandiwa, sa halip na tahasang gawing “umurong” sa pangunahing teksto.
