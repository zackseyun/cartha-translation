  to: Kasunod niya ay si Eleazar na anak ni Dodo, na anak ni Ahohi.[a] Isa siya sa tatlong magigiting na mandirigmang kasama ni David nang tuyain nila[b] ang mga Filisteo na nagtipon doon para sa labanan, at umakyat ang mga tauhan ng Israel.[c]
