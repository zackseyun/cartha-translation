  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: tl
  text: Kasunod niya ay si Eleazar na anak ni Dodo, na anak ni Ahohi.[a] Isa siya sa tatlong magigiting na mandirigmang kasama ni David nang tuyain nila[b] ang mga Filisteo na nagtipon doon para sa labanan, at umakyat ang mga tauhan ng Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anak ni Dodai, anak ng isang Ahohita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hamunin nila” o “hamakin nila.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “umakyat ang mga tauhan ng Israel”; sa konteksto, maaaring ang ibig sabihin ay umalis o umurong sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: Kasunod niya si
  rationale: Likas na paraan sa modernong Tagalog upang ipakilala ang susunod na mandirigma sa pagkakasunod-sunod, habang pinupunan ang pandiwang ipinahihiwatig ng sugnay na Hebreo.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: anak ni Dodo, na anak ni Ahohi
  rationale: Sinusunod ang anyo ng tekstong katinig bilang magkakasunod na pangalan; inilalagay sa talababa ang posibleng pagbasa kay Ahohi bilang katawagang pangangkan.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: Isa siya sa tatlong magigiting na mandirigma
  rationale: Ipinahahayag nang malinaw ang pagiging kabilang ni Eleazar sa tatluhang pangkat; ang 'magigiting na mandirigma' ay angkop sa militar at bayaning diwa ng גברים sa konteksto.
- source_word: עִם דָּוִד
  choice: kasama ni David
  rationale: Tuwirang nagpapahayag ng pakikisama o pagkakaugnay kay David.
- source_word: בְּ/חָֽרְפָם
  choice: nang tuyain nila
  rationale: Pinananatili ang pangunahing diwa ng חרף na paghamak o panunukso sa kalaban; hindi nilulutas nang labis ang militar na pahiwatig na maaari ring unawaing paghamon.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na ito.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: nagtipon doon para sa labanan
  rationale: Natural na Tagalog na nagpapakitang ang mga Filisteo ang nagtipon para makipagdigma.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: at umakyat ang mga tauhan ng Israel
  rationale: Pinananatili sa pangunahing teksto ang literal na kahulugan ng עלה, kahit maaaring tumukoy ito sa pag-alis o pag-urong sa konteksto; ipinaliliwanag ang posibilidad na iyon sa talababa.
