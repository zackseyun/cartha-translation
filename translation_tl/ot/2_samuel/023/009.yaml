    rationale: Ang “anak ni Dodai na isang Ahohita” ay maaaring magmukhang si Dodai mismo ang Ahohita. Ang alternatibong pagbasa ay “anak ni Dodai, anak ng isang Ahohita.”
  - severity: low
    issue: Hindi angkop na lexical alternative ang “lapastanganin” sa talababa b.
    rationale: Ang חרף ay tumutukoy sa paghamak/panunuya o paghamon sa kaaway; ang “lapastanganin” ay karaniwang may mas espesipikong relihiyosong pahiwatig sa modernong Filipino.
