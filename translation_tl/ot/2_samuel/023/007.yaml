  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: tl
  text: Ngunit ang taong humipo sa kanila[c] ay kailangang sangkapan ang sarili ng bakal at ng tangkay ng sibat[a], at sila ay lubusang susunugin sa apoy sa mismong kinaroroonan nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kailangang sangkapan ang sarili ng bakal at ng tangkay ng sibat.” Literal: “mapuno ng bakal at kahoy ng sibat.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tiyak na susunugin sa apoy doon mismo.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwa upang magbigay-diin.
    reason: lexical_alternative
  - marker: c
    text: Ang “kanila” ay tumutukoy sa masasamang taong inihalintulad sa mga tinik sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ
  choice: Ngunit ang taong
  rationale: Ang אִישׁ ay panlalaking isahan ngunit ginagamit dito bilang pangkalahatang pagtukoy sa sinumang hahawak sa mga tinik; pinananatili ng “ang taong” ang anyong isahan at likas ito sa makabagong Tagalog. Ang panimulang וְ ay angkop na isinaling “Ngunit” dahil sa pagsalungat sa paglalarawan sa naunang talata.
- source_word: יִגַּע בָּהֶם
  choice: humipo sa kanila
  rationale: Ang נגע ay karaniwang nangangahulugang humipo o dumikit. Ang “humipo” ang tuwirang diwa sa larawan ng mapanganib na mga tinik.
- source_word: יִמָּלֵא
  choice: dapat magsangkap sa sarili
  rationale: Literal na “mapuno,” ngunit sa kasamang mga kasangkapan ay idyomatikong tumutukoy sa paglalaan o pagsasangkap sa sarili. Malinaw ang praktikal na diwa nang hindi tinutukoy kung anong uri ng kagamitang bakal ang gamit.
- source_word: בַרְזֶל
  choice: bakal
  rationale: “Bakal” lamang ang tahasang sinasabi ng Hebreo; hindi dinaragdagan ng salitang “kasangkapan” sa pangunahing teksto.
- source_word: וְעֵץ חֲנִית
  choice: at tangkay ng sibat
  rationale: Literal itong “kahoy ng sibat,” na tumutukoy sa mahabang kahoy na tangkay o shaft nito, hindi sa talim.
- source_word: וּבָאֵשׁ
  choice: sa apoy
  rationale: Ang ב ay nagpapahayag dito ng paraang ginagamit sa pagsunog; natural sa Tagalog ang “susunugin sa apoy.”
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: lubusang susunugin
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa tiyak o ganap na pagsunog; ipinahahayag ito ng “lubusang.”
- source_word: בַּשָּׁבֶת
  choice: sa mismong kinaroroonan nila
  rationale: 'Ang bihirang anyong ito ay karaniwang inuunawang tumutukoy sa lugar: “sa lugar” o “doon mismo.” Pinananatili ng salin ang lokal na diwa habang kinikilala sa talababa ang posibleng mas maikling pagbasa.'
