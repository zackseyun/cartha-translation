translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magsangkap sa sarili” upang maipahayag ang idyomatikong diwa ng Hebreo nang hindi nawawala ang literal na larawan ng bakal at tangkay ng sibat. Pinanatili ang panghalip na maramihan para sa tinutukoy na mga taong gaya ng mga tinik.
