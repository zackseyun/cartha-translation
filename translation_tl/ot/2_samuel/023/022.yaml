  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: tl
  text: Ang mga bagay na ito ay ginawa ni Benaya na anak ni Joiada, at tanyag siya[a] sa gitna ng tatlong magigiting na mandirigma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at mayroon siyang pangalan,” isang idyomang Hebreo na nangangahulugang kilala o tanyag siya.
    reason: lexical_alternative
  - marker: b
    text: Iniuugnay ito ng ilang tagapagpaliwanag sa mas malawak na talaan ng mga mandirigma ni David at inihahambing sa mga pagbasa na “tatlumpu”; ngunit “tatlo” ang mababasa sa tekstong Hebreo rito.
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Ang mga bagay na ito ay ginawa
  rationale: Tumutukoy ang demonstratibo sa mga kabayanihang isinalaysay bago nito; pinananatili ng salin ang pabalik na pagtukoy at ang payak na diwa ng pandiwang ‘gumawa.’
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya na anak ni Joiada
  rationale: Isinasalin ang ugnayang construct bilang likas na pariralang Filipino at tinutumbasan ang mga pangalan ayon sa karaniwang anyong biblikal sa Tagalog.
- source_word: וְלוֹ שֵׁם
  choice: at tanyag siya
  rationale: Ang literal na idyomang ‘may pangalan siya’ ay tumutukoy sa pagkakaroon ng reputasyon o katanyagan. Ang ‘tanyag siya’ ay malinaw at likas sa modernong Filipino, habang inilalahad sa talababa ang literal na anyo.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: sa gitna ng tatlong magigiting na mandirigma
  rationale: Pinananatili ang bilang na ‘tatlo’ ng tekstong Hebreo at isinasalin ang הַגִּבֹּרִים bilang mga mandirigmang kinikilala sa kanilang pambihirang tapang at kakayahan.
