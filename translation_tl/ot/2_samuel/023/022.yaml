translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Isinalin nang natural ang idyomang Hebreo ngunit pinanatili sa talababa ang literal na larawan; iniwasan ding palitan sa pangunahing teksto ang ‘tatlo’ ng mungkahing ‘tatlumpu.’
