  yaml_path: translation/ot/2_samuel/023/034.yaml
  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: tl
  text: Si Elifelet na anak ni Ahasbai na anak ng Maacatita[a], at si Eliam na anak ni Ahitofel na Gilonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “Si Elifelet na anak ni Ahasbai na Maacatita; at si Eliam na anak ni Ahitofel na Gilonita.” Nakabatay ang pagkakaiba sa kung kanino ikinakabit ang katawagang “Maacatita” sa talaang ito at sa paghahambing sa 1 Cronica 11:35–36.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang malapit sa anyong Hebreo ng pangalan.
- source_word: בֶּן
  choice: anak ni/ng
  rationale: Sa talaan ng mga pangalan, karaniwang tumutukoy ito sa ugnayang ama at anak; ginamit ang likas na anyong Filipino ayon sa kasunod na pangngalan.
- source_word: אֲחַסְבַּי
  choice: Ahasbai
  rationale: Tuwirang transliterasyon ng personal na pangalan ayon sa bigkas na angkop sa Filipino.
- source_word: הַמַּעֲכָתִי
  choice: ang Maacatita
  rationale: Pinanatili bilang katawagang etniko o panrehiyon, sa halip na palawakin bilang 'mula sa Maaca.'
- source_word: אֱלִיעָם
  choice: Eliam
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Transliterasyong Filipino na kumakatawan sa katinig na ח sa nakasanayang payak na anyo.
- source_word: הַגִּלֹנִי
  choice: Gilonita
  rationale: Ginawang katawagang panrehiyon sa natural na anyong Filipino; tumutukoy sa isang taga-Gilo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Si” sa bawat pangunahing pangalan at ang “na anak ni” bilang likas na anyo ng talaang genealogical. Pinanatili sa talababa ang tunay na kalabuan ng pagkakaugnay ng “Maacatita.”
