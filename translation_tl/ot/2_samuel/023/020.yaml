  text: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חי רַב פְּעָלִ֖ים מִֽ/קַּבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת ה/אריה בְּ/ת֥וֹךְ הַ/בֹּ֖אר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: tl
  text: At si Benaya, anak ni Jehoiada, na anak ng isang magiting na lalaking bantog sa mga gawa mula sa Kabzeel—pinabagsak niya ang dalawang Ariel[a] ng Moab. Bumaba rin siya at pinabagsak ang leon sa loob ng hukay sa isang araw na may niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan dito ng Hebreong אֲרִאֵל (’ariel). Maaaring tumukoy ito sa “mga lalaking tulad ng leon,” “mga bayani,” o sa isang titulo o pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: isang magiting na lalaki
  rationale: Sa konteksto ng talaan ng mga mandirigma, ang parirala ay pinakamalamang na tumutukoy sa lakas o kagitingan, hindi lamang sa pagiging buhay. Ang “magiting na lalaki” ay likas at marangal sa modernong Tagalog.
- source_word: רַב פְּעָלִים
  choice: bantog sa mga gawa
  rationale: Ipinahihiwatig ng parirala ang pagiging kapansin-pansin dahil sa maraming dakilang nagawa. Iniiwasan ng salin ang mabigat at di-likas na literalismong “marami sa mga gawa.”
- source_word: מִקַּבְצְאֵל
  choice: mula sa Kabzeel
  rationale: Tuwirang ipinapahayag ng prefixed na מִן ang pinagmulan o bayang pinanggalingan.
- source_word: הִכָּה
  choice: nagpabagsak / pinabagsak
  rationale: Ang pandiwang נכה sa salaysay ng pakikipaglaban ay tumutukoy sa marahas na paggapi o pagpatay. Pinananatili ng “pinabagsak” ang kilos nang hindi higit na tinutukoy kaysa sa Hebreo.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: dalawang Ariel ng Moab
  rationale: Hindi tiyak ang kahulugan ng אֲרִאֵל dito. Pinananatili ang anyong “Ariel” sa pangunahing teksto at ipinaliliwanag sa talababa upang hindi ito sapilitang gawing “mga bayani,” “mga lalaking tulad ng leon,” o pangalan/titulo.
- source_word: יָרַד
  choice: bumaba
  rationale: Payak at natural na katumbas ng karaniwang pandiwang nagsasaad ng pagbaba.
- source_word: הָאֲרִי
  choice: ang leon
  rationale: Malinaw na leon ang tinutukoy ng pangngalan at pinananatili ang tiyak na pantukoy.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: sa loob ng hukay
  rationale: Maaaring mangahulugan ang בּוֹר ng hukay o balon/imbakan ng tubig. Ang “hukay” ang mas malawak na salin, at natural na ipinapahayag ng “sa loob” ang בְּתוֹךְ.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: noong araw na umuulan ng niyebe
  rationale: Natural nitong ipinahahayag sa Tagalog ang araw na may niyebe, habang hindi ipinapalagay kung gaano na ito katagal na bumagsak.
theological_decisions:
- issue: Hindi tiyak na kahulugan ng אֲרִאֵל
  choice: Panatilihin bilang “Ariel” na may talababa
  alternative: “mga bayani,” “mga lalaking tulad ng leon,” o isang pangalan/titulo
  rationale: Walang sapat na katiyakan sa anyo at kahulugan upang gawing tiyak ang alinman sa mga interpretasyon; ang transliterasyon ay nagpapanatili sa tunay na kalabuan ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bantog sa mga gawa” para sa likas na daloy, “pinabagsak” upang mapanatili ang lawak ng pandiwang Hebreo, at inilagay ang [a] kaagad pagkatapos ng salitang “Ariel” na siyang ipinapaliwanag nito.
