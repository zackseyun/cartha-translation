revisions:
- from: At si Benaya na anak ni Jehoiada, na anak ng isang magiting na lalaki at bantog sa mga gawa, mula sa Kabzeel—siya ang nagpabagsak sa dalawang Ariel[a] ng Moab. Bumaba rin siya at pinabagsak ang leon sa loob ng hukay noong araw na umuulan ng niyebe.
  to: At si Benaya, anak ni Jehoiada, na anak ng isang magiting na lalaking bantog sa mga gawa mula sa Kabzeel—pinabagsak niya ang dalawang Ariel[a] ng Moab. Bumaba rin siya at pinabagsak ang leon sa loob ng hukay sa isang araw na may niyebe.
  rationale: Inalis ang di-tiyak na implikasyong aktuwal na umuulan ng niyebe at inayos ang pariralang naglalarawan sa ninuno ni Benaya para sa mas malinaw na modernong Tagalog. Pinanatili ang lahat ng mahahalagang ambigwidad, lalo na ang Ariel, at ang kahulugang marahas ngunit hindi labis na tinutukoy ng “pinabagsak.”
