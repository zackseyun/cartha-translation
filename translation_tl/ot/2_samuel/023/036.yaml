lexical_decisions:
- source_word: יִגְאָל
  choice: Igal
  rationale: Pangalan ng tao; tinumbasan sa karaniwang anyong Tagalog batay sa bigkas ng Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas at maikling panumbas sa Tagalog para sa ugnayang genealogical sa isang talaan ng mga pangalan.
- source_word: נָתָן
  choice: Natan
  rationale: Pangalan ng tao; ginamit ang anyong mas malapit sa Hebreong pagbigkas at natural sa ortograpiyang Tagalog.
- source_word: מִצֹּבָה
  choice: na mula sa Zoba
  rationale: Ang pang-ukol na מִן ay karaniwang nagsasaad ng pinagmulan; sa talaang ito, pinakamalamang na heograpikong pinagmulan ang tinutukoy.
- source_word: בָּנִי
  choice: Bani
  rationale: Pangalan ng tao; tuwirang transliterasyon na angkop sa Tagalog.
- source_word: הַגָּדִי
  choice: na Gadita
  rationale: Ang anyong gentiliko ay tumutukoy sa kasapi ng lipi o taong mula sa Gad; ang “Gadita” ay maikli at malinaw sa konteksto ng talaan.
