  text: Igal, anak ni Natan, mula sa Zoba[a]; Bani na Gadita;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taga-Zoba.” Maaaring tumukoy ang pang-ukol sa pinagmulan o kaugnayan; pinili ang “mula sa Zoba” bilang mas tuwirang heograpikong diwa.
