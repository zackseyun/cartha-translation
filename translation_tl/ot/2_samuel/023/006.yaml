  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: tl
  text: Ngunit ang mga walang kabuluhan[a] ay pawang parang mga tinik na itinapon, sapagkat hindi sila maaaring hawakan ng kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na beliyya‘al dito ay malamang na nangangahulugang “walang kabuluhan” o “masama,” at hindi ang kalaunang pangalang pantangi na “Belial.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: mga taong walang kabuluhan
  rationale: Dito, ang pangngalan ay tumutukoy sa masasama o walang-kuwentang tao, hindi sa kalaunang pangalang pantangi na “Belial.” Idinagdag ang “mga taong” upang maging malinaw ang personal at maramihang tinutukoy.
- source_word: כְּקוֹץ
  choice: parang mga tinik
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang larawan at maramihan ang tinutukoy; natural sa Tagalog ang “mga tinik.”
- source_word: מֻנָד
  choice: itinapon
  rationale: Ipinapahayag ng pasibong pandiwaring Hebreo ang pagtataboy o paghahagis palayo. Ang “itinapon” ay angkop sa larawan ng mga tinik at sa kasunod na paliwanag.
- source_word: כֻּלָּהֶם
  choice: ang lahat
  rationale: Pinananatili ang saklaw na walang eksepsiyon habang natural ang ayos sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paghahambing sa ikalawang bahagi ng taludtod.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: hindi mahahawakan ang mga iyon ng kamay
  rationale: Ipinahihiwatig ng pahayag na hindi hinahawakan nang tuwiran ang gayong mga tinik. Ang “hindi mahahawakan” ay nagpapahayag ng praktikal na imposibilidad nang hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Kung pangalang pantangi ba ang בְלִיַּעַל
  choice: Itinuring itong paglalarawan sa mga taong walang kabuluhan o masasama.
  alternative: Isalin bilang “Belial,” na tila pangalan ng isang personipikadong nilalang.
  rationale: Sa kontekstong ito at sa gamit ng salita sa sinaunang Hebreo, mas malamang na karaniwang pangngalan ito para sa kasamaan o kawalang-kabuluhan, hindi ang kalaunang pangalang pantangi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga ng mga tinik at ang ugnayang sanhi na ipinahihiwatig ng כִּי.
