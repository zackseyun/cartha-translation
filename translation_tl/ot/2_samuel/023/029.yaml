  text: חֵ֥לֶב בֶּֽן בַּעֲנָ֖ה הַ/נְּטֹפָתִ֑י אִתַּי֙ בֶּן רִיבַ֔י מִ/גִּבְעַ֖ת בְּנֵ֥י בִנְיָמִֽן־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: tl
  text: si Heleb na Netofatita, anak ni Baana; si Itai na anak ni Ribai, mula sa Gibea ng mga anak ni Benjamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa Gibea ng mga Benjaminita.” Sa literal, “mula sa Gibea ng mga anak ni Benjamin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: Heleb
  rationale: Pangalan ng tao; tinumbasan ayon sa anyong Hebreo at karaniwang baybay sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na ekspresyong Filipino para sa ugnayang mag-ama sa isang talaan ng mga pangalan.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Pangalan ng tao; pinasimple ang transliterasyon para sa natural na bigkas at baybay sa Filipino.
- source_word: הַנְּטֹפָתִי
  choice: na Netofatita
  rationale: Ang gentilic ay tumutukoy sa pinagmulan o kaugnayan sa Netofa; ang hulaping -ita ay karaniwang anyong Filipino para sa mga katawagang ganito.
- source_word: אִתַּי
  choice: Itai
  rationale: Pangalan ng tao; ang dobleng katinig ng transliterasyong Ingles ay hindi kailangan sa natural na baybay sa Filipino.
- source_word: רִיבַי
  choice: Ribai
  rationale: Pangalan ng tao; malapit sa anyong Hebreo at madaling basahin sa Filipino.
- source_word: מִגִּבְעַת
  choice: mula sa Gibea
  rationale: Ang pang-ukol na מִן ay nagpapahayag ng pinagmulan, kaya tuwirang isinalin na “mula sa.”
- source_word: בְּנֵי בִנְיָמִן
  choice: ng mga anak ni Benjamin
  rationale: Pinananatili ang literal na idyomang Hebreo upang hindi mawala ang anyo at posibleng saklaw nito; sa konteksto, tumutukoy ito sa mga Benjaminita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa talaan ng mga mandirigma. Ginamit ang “si” bago ang bawat pangalan upang maging natural ang listahan sa Filipino, at inilagay ang talababa sa pariralang talagang may alternatibong pagbasa.
