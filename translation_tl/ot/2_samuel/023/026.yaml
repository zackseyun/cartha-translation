lexical_decisions:
- source_word: חֶלֶץ
  choice: Helez
  rationale: Pangalan ng tao; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: הַפַּלְטִי
  choice: na Paltita
  rationale: Pang-uring tumutukoy sa angkan o lugar na kaugnay ni Helez. Pinananatili ng “Paltita” ang anyong mas tuwirang sinusuportahan ng tekstong Hebreo rito.
- source_word: עִירָא
  choice: Ira
  rationale: Pangalan ng tao; transliterado nang tuwiran at natural sa Filipino.
- source_word: בֶן
  choice: anak ni
  rationale: Karaniwang Filipino para sa Hebreong panandang nagpapakilala sa ama; hindi kailangang idagdag ang “lalaking” dahil malinaw sa pangalan at konteksto.
- source_word: עִקֵּשׁ
  choice: Ikes
  rationale: Pangalan ng tao; ang dobleng katinig ng Hebreo ay hindi likas na kailangang katawanin sa modernong ortograpiyang Filipino.
- source_word: הַתְּקוֹעִי
  choice: na Tekoita
  rationale: Pang-uring nagsasaad ng pinagmulan o kaugnayan sa Tekoa; pinananatili ang maikli at magkahanay na anyo ng listahan sa Hebreo.
