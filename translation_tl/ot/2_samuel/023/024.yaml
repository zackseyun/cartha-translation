  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: tl
  text: Si Asahel na kapatid ni Joab ay kabilang sa Tatlumpu; si Elhanan na anak ni Dodo[a] na taga-Betlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ni Dodo”; sa paralelong tala sa 1 Cronica 11:26, “Dodai.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Asahel
  rationale: Ginamit ang nakagawiang transliterasyon sa Filipino para sa kilalang pangalang עֲשָׂהאֵל; ang magkahiwalay na baybay sa tekstong Hebreo ay kumakatawan sa iisang pangalan.
- source_word: אֲחִי יוֹאָב
  choice: kapatid ni Joab
  rationale: Likas at tuwirang Filipino para sa ugnayang pampamilya na ipinahahayag ng construct chain.
- source_word: בַּשְּׁלֹשִׁים
  choice: kabilang sa Tatlumpu
  rationale: Ipinahahayag ng בְּ at ng tiyak na pangkat na 'Tatlumpu' ang pagiging kasapi sa pangkat ng mga piling mandirigma.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: בֶּן דֹּדֹו
  choice: anak ni Dodo
  rationale: Sinusunod ang Masoretic Text na דֹּדֹו bilang pangalang Dodo, sa halip na itugma agad sa paralelong Dodai.
- source_word: בֵּית לָחֶם
  choice: taga-Betlehem
  rationale: Natural na Filipino para sa kaugnayan sa lugar sa kontekstong ito, nang hindi nagdaragdag ng higit sa ipinahihiwatig ng Hebreo.
