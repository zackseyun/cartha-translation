base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/035.yaml
  text: Hezro the Carmelite[a], Paarai the Arbite[c][b];
translation:
  language: tl
  text: Si Hezro[a] na taga-Carmel[b]; si Paarai na taga-Arab[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hazro.”
    reason: lexical_alternative
  - marker: b
    text: Ang “taga-Carmel” dito ay nangangahulugang isang taong mula sa Carmel; hindi ito tumutukoy sa orden ng mga Carmelita na lumitaw nang mas huli.
    reason: cultural_note
  - marker: c
    text: O “ang Arbita.” Ang tinutukoy ay malamang na isang taong mula sa lugar na Arab.
    reason: lexical_alternative
lexical_decisions:
- source_word: חצרו
  choice: Hezro
  rationale: Pangalan ng tao sa talaan ng mga mandirigma ni David. Isinalin ito sa karaniwang anyong “Hezro,” habang inilagay sa talababa ang posibleng anyong “Hazro.”
- source_word: הַכַּרְמְלִי
  choice: na taga-Carmel
  rationale: Ang anyong gentiliko ay tumutukoy sa pinagmulan ng tao. Mas malinaw at natural sa modernong Tagalog ang “taga-Carmel” kaysa sa hiram na katawagang maaaring mapagkamalang kasapi ng orden ng mga Carmelita.
- source_word: פַּעֲרַי
  choice: Paarai
  rationale: Pangalan ng tao; ang transliterasyong “Paarai” ay malapit sa pagbigkas na ipinahihiwatig ng tekstong Hebreo.
- source_word: הָאַרְבִּי
  choice: na taga-Arab
  rationale: Ang gentiliko ay malamang na tumutukoy sa isang taong nagmula sa lugar na tinatawag na Arab. Pinananatili ng “taga-Arab” ang heograpikong diwa nang hindi ipinagpapalagay ang di-tiyak na anyong pantanging pangalan sa Tagalog.
