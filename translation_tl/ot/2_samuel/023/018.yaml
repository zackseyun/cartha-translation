  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: tl
  text: Si Abisai[a], kapatid ni Joab at anak ni Zeruya, ang pinuno ng Tatlo. Iwinasiwas niya ang kanyang sibat laban sa tatlong daang tao at pinatay niya ang mga ito[b], at naging bantog siya sa hanay ng Tatlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “pinuno ng Tatlo.” Dahil sa katumbas na salaysay sa 1 Cronica 11:20 at sa kawalang-katiyakan ng teksto sa bahaging ito, inuunawa ng ilan na “Tatlumpu” ang tinutukoy na pangkat.'
    reason: textual_variant
  - marker: b
    text: 'Maaari ring: “Itinaas” o “iwinasiwas niya ang kanyang sibat laban sa tatlong daang mga napatay.” Maikli at siksik ang Hebreo; literal: “pinukaw/itinaas niya ang kanyang sibat laban sa tatlong daang mga napatay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: ang pinuno ng Tatlo
  rationale: Ang רֹאשׁ ay nangangahulugang “ulo” o “pinuno.” Bagaman may suliraning tekstuwal kung “Tatlo” o “Tatlumpu” ang tinutukoy, pinanatili sa pangunahing teksto ang pagbasa ng MT at ang kaugnay na בַּשְּׁלֹשָׁה sa hulihan ng talata.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: Iwinasiwas niya ang kanyang sibat
  rationale: Ang pandiwa ay literal na “gumising, pumukaw, o magtaas.” Sa kontekstong pandigma at sibat ang layon, natural na ipinahahayag ng “iwinasiwas” ang aktibong paggamit nito nang hindi masyadong nagpapaliwanag.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: laban sa tatlong daan at napatay niya ang mga ito
  rationale: Ang חָלָל ay tumutukoy sa mga napatay o napatay sa pagkasaksak. Siksik ang Hebreo; ginawang malinaw at natural sa Tagalog ang ipinahihiwatig na kinalabasan, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: וְלוֹ שֵׁם
  choice: at naging bantog siya
  rationale: Literal itong “at sa kanya ay may pangalan,” isang idyomang tumutukoy sa pagkakaroon ng pangalan, reputasyon, o katanyagan. Ang “naging bantog siya” ay natural na katumbas sa modernong Tagalog.
- source_word: בַּשְּׁלֹשָׁה
  choice: sa Tatlo
  rationale: Ang בְּ na kasama ng bilang ay relasyonal dito. Ang “sa Tatlo” ay maikli at natural, at ipinakikitang nakilala siya kaugnay ng pangkat na iyon.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Abisai ... Joab ... Zeruya
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog.
