  to: Si Abisai[a], kapatid ni Joab at anak ni Zeruya, ang pinuno ng Tatlo. Iwinasiwas niya ang kanyang sibat laban sa tatlong daang tao at pinatay niya ang mga ito[b], at naging bantog siya sa hanay ng Tatlo.
