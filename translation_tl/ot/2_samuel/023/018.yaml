translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang katawagang “Tatlo” bilang pangalan ng natatanging pangkat, at inilagay sa talababa ang posibleng pagbasa na “Tatlumpu.”
