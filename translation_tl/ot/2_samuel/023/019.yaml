  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: tl
  text: Hindi ba mas pinarangalan siya kaysa sa Tatlo?[a] Kaya naging pinuno siya ng mga ito. Ngunit hindi niya naabot ang katayuan ng Tatlo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi ba pinarangalan siya sa gitna ng Tatlo?” Maaaring unawain ang Hebreo nang hindi gaanong pahambing, ngunit mas umaangkop sa balarila at sa kaugnay na talata ang “mas pinarangalan ... kaysa sa Tatlo.”'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi niya naabot ang ranggo o katayuan ng “Tatlo,” ang pinakamataas na pangkat sa magigiting na mandirigma ni David.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: kaysa sa Tatlo
  rationale: Ang מִן kasunod ng נִכְבָּד ay pinakamalamang na naghahayag ng paghahambing. Ang “Tatlo” ay tawag sa natatanging pangkat ng mga mandirigma ni David.
- source_word: הֲכִי נִכְבָּד
  choice: Hindi ba mas pinarangalan siya
  rationale: Ang הֲכִי ay bumubuo ng retorikal na tanong na umaasang sasang-ayon ang mambabasa, at ang נִכְבָּד ay tumutukoy sa pagiging pinarangalan o mataas ang pagkilala.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: Kaya naging pinuno nila siya
  rationale: Sa kontekstong militar, ang שַׂר ay likas na maisasalin bilang “pinuno.” Pinananatili ng “nila” ang pagtukoy sa pangkat na nabanggit.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: Ngunit hindi niya naabot ang katayuan ng Tatlo
  rationale: Bagaman literal na “hindi siya dumating hanggang sa Tatlo,” ang idyoma ay tumutukoy sa hindi pag-abot sa kanilang ranggo o antas; nililinaw ito ng “katayuan” nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang malaking titik sa “Tatlo” upang ipakitang ito ay tawag sa isang tiyak na pangkat, hindi lamang bilang.
