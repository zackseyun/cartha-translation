  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magigiting na mandirigma” sa halip na isang arkaikong katawagan. Pinanatili sa pangunahing teksto ang mahihirap na pangalang anyo ng Tekstong Masoretiko at inilagay sa mga talababa ang mahahalagang tekstuwal at leksikal na alternatibo.
