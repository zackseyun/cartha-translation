base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga magigiting na mandirigma na kasama ni David: si Joseb-basebet[a], isang Tahkemonita, ang pinuno ng Tatlo.[b] Siya si Adino na Eznita[c], na iwinasiwas ang kanyang sibat laban sa walong daang mga napatay sa isang pagkakataon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang tekstong Hebreo ng talatang ito. Ang “Joseb-basebet” ay ayon sa Tekstong Masoretiko; “Jasobeam na Hakmonita” naman ang mababasa sa paralelong 1 Cronica 11:11.
    reason: textual_variant
  - marker: b
    text: O “pinuno ng Tatlumpu,” ayon sa ilang sinaunang saksi at tagapagpaliwanag; “pinuno ng Tatlo” ang mababasa sa Tekstong Masoretiko.
    reason: alternative_reading
  - marker: c
    text: Sa Hebreo, “Adino na Eznita,” isang pariralang napakahirap unawain. Marami ang umuunawa rito bilang katulad ng “itinaas niya ang kanyang sibat” o “iwinasiwas niya ang kanyang sibat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: magigiting na mandirigma
  rationale: Tumutukoy ang גִּבּוֹרִים sa mga lalaking bantog sa lakas at tapang sa digmaan; natural at malinaw sa modernong Filipino ang “magigiting na mandirigma.”
- source_word: אֲשֶׁר לְדָוִד
  choice: ni David
  rationale: Ipinahihiwatig ng lamed ang kaugnayan nila kay David. Sa konteksto ng talaan, maikli at natural ang “mga ... ni David” nang hindi ipinahihiwatig na pag-aari niya sila.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Joseb-basebet
  rationale: Mahirap ang tekstong Masoretiko, ngunit maaari itong panatilihin bilang pangalang pantangi sa halip na ituwid ayon sa paralelong talata.
- source_word: תַּחְכְּמֹנִי
  choice: Tahkemonita
  rationale: Tuwirang transliterasyon ito ng katawagang pangangkan o panlugar sa tekstong Hebreo ng Samuel.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: ang pinuno ng Tatlo
  rationale: Ito ang pinakanatural na pagbasa sa pagkakapatinig ng tekstong Masoretiko; ang ibang pagbasa ay inilagay sa talababa.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Adino na Eznita
  rationale: Lubhang malabo ang parirala. Ang pagpapanatili rito bilang pangalan at katawagan ang pinakapormal na pagsunod sa tekstong Masoretiko nang hindi tahimik na nagmumungkahi ng pagwawasto.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: lumaban sa walong daang napatay
  rationale: Sa kontekstong pandigma, ipinahihiwatig ng עַל ang pagharap laban sa kanila, samantalang ang חָלָל ay tumutukoy sa mga napatay. Idinagdag ang “lumaban” upang maging buo ang pangungusap sa Filipino habang kinikilala sa talababa ang hirap ng naunang parirala.
- source_word: בְּפַעַם אֶחָד
  choice: sa isang pagkakataon
  rationale: Tumutukoy ang idyoma sa iisang okasyon o engkuwentro.
