lexical_decisions:
- source_word: שַׁמָּה
  choice: Shama
  rationale: Pangalang pantangi; tinumbasan sa karaniwang anyong transliterado sa modernong Filipino, na hindi kailangang panatilihin ang tahimik na h sa hulihan ng nakaugaliang anyong Ingles.
- source_word: הַחֲרֹדִי
  choice: taga-Harod
  rationale: Ang gentiliko na may pantukoy ay likas at malinaw na ipinahahayag sa Filipino bilang pinagmulan o kaugnayan sa lugar na Harod; pinananatili rin nito ang maikling anyo ng talaan.
- source_word: אֱלִיקָא
  choice: Elika
  rationale: Pangalang pantangi; tuwirang transliterasyon na malinaw at natural basahin sa Filipino.
- source_word: הַחֲרֹדִי
  choice: taga-Harod
  rationale: Inulit nang pareho para kay Elika upang mapanatili ang estruktura at ritmo ng tekstong Hebreo.
