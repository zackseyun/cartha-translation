lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Benaya
  rationale: Pangalan ng tao; isina-Filipino ang transliterasyon ayon sa karaniwang bigkas at baybay sa Tagalog.
- source_word: פִּרְעָתֹנִי
  choice: na taga-Piraton
  rationale: Ang anyong gentiliko ay likas na ipinahahayag sa Tagalog bilang pinagmulan ng isang tao.
- source_word: הִדַּי
  choice: Hiday
  rationale: Tuwirang transliterasyon ng pangalang nasa Masoretic Text; hindi ito pinalitan ng ibang anyo sa magkatulad na tala.
- source_word: מִ/נַּחֲלֵי
  choice: mula sa mga bangin
  rationale: Ang נחל ay maaaring tumukoy sa libis, bangin, o daanan ng rumaragasang tubig na maaaring matuyo; pinili ang natural at madaling maunawaang 'mga bangin' habang inilalahad sa talababa ang saklaw ng kahulugan.
- source_word: גָעַשׁ
  choice: Gaas
  rationale: Pangalan ng lugar; isina-Filipino ang transliterasyon.
