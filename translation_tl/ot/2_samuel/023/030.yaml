  text: Si Benaya na taga-Piraton, si Hiday[b] na mula sa mga bangin[a] ng Gaas;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na naḥal ay maaaring tumukoy sa bangin, libis, o daanan ng rumaragasang tubig na kadalasang tuyo.
