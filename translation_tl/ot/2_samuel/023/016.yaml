revisions:
- from: Sapilitang tumagos ang tatlong magigiting na mandirigma sa kampo ng mga Filisteo. Sumalok sila ng tubig mula sa balon ng Betlehem na nasa tabi ng pintuang-bayan, dinala iyon, at ibinigay kay David. Ngunit ayaw niyang inumin iyon[a]; sa halip, ibinuhos niya iyon para sa PANGINOON.[b]
  to: Nakapasok nang puwersahan ang tatlong magigiting na mandirigma sa kampo ng mga Filisteo. Sumalok sila ng tubig mula sa balon ng Betlehem na nasa may pintuan ng bayan, at dinala nila ito kay David. Ngunit ayaw niyang inumin ito[a]; sa halip, ibinuhos niya ito sa PANGINOON.[b]
  rationale: Pinalitan ang pariralang maaaring magpahiwatig na napilitan ang mga mandirigma ng isang natural na Filipino na malinaw na nagsasaad ng puwersahang paglusot. Iningatan ang payak na kahulugan ng pagdadala kay David at ang hindi lubusang pagtukoy sa ritwal na katangian ng pagbubuhos. Nilinaw rin ang talababa tungkol sa maramihang hulapi nang hindi nilulutas nang lampas sa teksto ang idiomatikong gamit nito.
