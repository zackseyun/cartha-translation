    rationale: Ang “sapilitang” sa Filipino ay karaniwang nangangahulugang ‘napilitan’ o ‘ginawang sapilitan,’ samantalang ang וַיִּבְקְעוּ ay nagsasaad na puwersahan nilang nilusutan/binasag ang posisyon ng kaaway.
