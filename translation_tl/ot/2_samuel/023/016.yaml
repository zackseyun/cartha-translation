  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: tl
  text: Nakapasok nang puwersahan ang tatlong magigiting na mandirigma sa kampo ng mga Filisteo. Sumalok sila ng tubig mula sa balon ng Betlehem na nasa may pintuan ng bayan, at dinala nila ito kay David. Ngunit ayaw niyang inumin ito[a]; sa halip, ibinuhos niya ito sa PANGINOON.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “inumin ang mga iyon.” Maramihan ang hulapi, na malamang ay idiomatikong tumutukoy sa tubig; karaniwang isahan ang pagtukoy rito sa Filipino.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “ibinuhos” ay maaaring magpahiwatig ng pagbubuhos bilang handog na inumin sa PANGINOON.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: Sapilitang tumagos
  rationale: Ipinahihiwatig ng pandiwa ang paglusot sa pamamagitan ng pagwasak o pag突破 sa kinalalagyan ng kalaban. Likas sa Filipino ang pariralang ito at pinananatili nito ang puwersahang katangian ng kilos nang hindi nagdaragdag ng isang tahasang labanan na wala sa teksto.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ang tatlong magigiting na mandirigma
  rationale: Sa mga salaysay tungkol kay David, ang גִּבּוֹרִים ay tumutukoy sa mga piling mandirigma. Mas malinaw sa karaniwang mambabasa ang “magigiting na mandirigma” kaysa sa literal ngunit di-likas na “makapangyarihang mga lalaki.”
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: sa kampo ng mga Filisteo
  rationale: Tuwirang inilalarawan ang kampong militar na pag-aari o kinaroroonan ng mga Filisteo.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: Sumalok sila ng tubig
  rationale: Ang pandiwa ay karaniwang tumutukoy sa pagkuha ng tubig mula sa balon. Ang “sumalok” ay natural at kongkreto sa Filipino.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: mula sa balon ng Betlehem na nasa tabi ng pintuang-bayan
  rationale: Pinananatili ang kaugnayan ng balon sa Betlehem at ang lokasyon nito sa may tarangkahan ng bayan. Nililinaw ng “pintuang-bayan” na hindi ito karaniwang pinto lamang.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: dinala iyon, at ibinigay kay David
  rationale: Ipinapakita ng “dinala” ang pagbuhat at pagdadala ng tubig. Ang “ibinigay kay David” ay natural na pagpapahayag ng pagdadala nito sa kaniya, bagaman mas literal ang “dinala kay David.”
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Ngunit ayaw niyang inumin iyon
  rationale: Ipinapanatili ng “ayaw” ang diwa ng kawalan ng pagsang-ayon o kagustuhang uminom. Ginamit ang isahang “iyon” ayon sa natural na Filipino para sa tubig, samantalang ipinaliliwanag sa talababa ang anyong maramihan sa Hebreo.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: ibinuhos niya iyon
  rationale: Pinananatili sa pangunahing teksto ang kongkretong kilos ng pagbubuhos. Hindi tahasang tinatawag na ritwal na handog upang hindi higit na tukuyin ang kilos kaysa sa mismong salaysay.
- source_word: לַיהוָה
  choice: para sa PANGINOON
  rationale: Ipinahihiwatig ng pang-ukol ang pag-uukol ng ibinuhos sa Diyos. Isinalin ang banal na pangalan bilang “PANGINOON” alinsunod sa karaniwang anyo sa saling Filipino.
theological_decisions:
- issue: Ang uri ng pagbubuhos ni David ng tubig
  choice: Isang literal na pagbubuhos na iniukol sa PANGINOON, na may pahiwatig ng handog na inumin
  alternative: Isa lamang itong sagisag na pagtangging uminom, na walang kaugnayang panritwal
  rationale: Madalas magkaroon ng panritwal na diwa ang נסך, at pinatitibay ito rito ng pariralang “para sa PANGINOON.” Gayunman, hindi tinawag ng pangunahing teksto ang kilos na isang pormal na handog na inumin; inilagay sa talababa ang pahiwatig na iyon upang mapanatili ang tensiyong nasa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang maging malinaw ang sinaunang konteksto, at “magigiting na mandirigma” bilang natural na tawag sa piling mga tauhan ni David. Ang mga pangungusap ay pinadulas nang hindi inaalis ang sunod-sunod na kilos ng Hebreong salaysay.
