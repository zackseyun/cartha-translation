  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: tl
  text: Ngunit pumuwesto siya sa gitna ng bukid at ipinagtanggol iyon; pinabagsak niya ang mga Filisteo, at nagdulot si Yahweh ng isang malaking tagumpay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang dakilang pagliligtas” o “isang dakilang kaligtasan.” Saklaw ng salitang Hebreo ang mga diwang ito; dito, tumutukoy ito sa pagliligtas ni Yahweh sa pamamagitan ng tagumpay sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: pumuwesto siya
  rationale: Ipinahihiwatig ng Hitpael ng יצב ang sinasadyang paglagay ng sarili sa isang posisyon at paninindigan doon; likas at malinaw ang “pumuwesto” sa salaysay ng labanan.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: sa gitna ng bukid
  rationale: Ang חֶלְקָה ay isang takdang bahagi o parsela ng lupa. Ang “bukid” ay malinaw sa karaniwang mambabasa at ang “sa gitna” ay tuwirang nagpapahayag ng בְּתוֹךְ.
- source_word: וַיַּצִּילֶהָ
  choice: ipinagtanggol iyon
  rationale: Karaniwang nangangahulugan ang נצל ng pagliligtas o pagsagip. Sa konteksto, ang hulaping pambabae ay tumutukoy sa bahagi ng lupa; ipinahahayag ng “ipinagtanggol iyon” kung paano niya iniligtas ang bukid mula sa mga kaaway.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: pinabagsak niya ang mga Filisteo
  rationale: Sa konteksto ng labanan, ang נכה ay maaaring mangahulugang hampasin, pabagsakin, o talunin. Pinananatili ng “pinabagsak” ang lakas ng pandiwa nang hindi nililimitahan ito sa simpleng pananakit.
- source_word: וַיַּעַשׂ יְהוָה
  choice: nagdulot si Yahweh
  rationale: Kapag ang עשה ay may abstraktong layon gaya ng תְּשׁוּעָה, ipinahihiwatig nito ang pagsasakatuparan o pagdudulot. Malinaw na pinananatili ng “nagdulot” ang pagkilos at pangunahing papel ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalang “Yahweh” sa halip na palitan ng isang titulo.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: isang malaking tagumpay
  rationale: Maaaring tumukoy ang תְּשׁוּעָה sa pagliligtas, kaligtasan, o tagumpay. Sa agarang konteksto ng labanan, “malaking tagumpay” ang pinakanatural na kahulugan, habang inilalahad sa talababa ang iba pang tunay na diwa ng salita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng תְּשׁוּעָה sa konteksto ng labanan
  choice: tagumpay
  alternative: pagliligtas o kaligtasan
  rationale: Ang tagumpay sa labanan ang agarang tinutukoy, ngunit ang Diyos ang tahasang sanhi nito. Hindi itinatanggi ang mas malawak na diwa ng pagliligtas; pinananatili iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “iyon” upang malinaw na tumukoy sa bukid, at ang tuldok-kuwit upang mapanatili ang magkakaugnay na pagkilos sa talata. Inilagay ang pananda ng talababa pagkatapos ng “tagumpay,” sapagkat ang talababa ay nagpapaliwanag sa saklaw ng תְּשׁוּעָה.
