  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: tl
  text: Noon, nasa muog si David, at nasa Betlehem noon ang himpilan ng mga Filisteo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Inuulit sa Hebreo ang salitang nangangahulugang “noon”: “Noon, nasa muog si David, at nasa Betlehem noon ang himpilan ng mga Filisteo.”'
    reason: Ipinapakita ang kapansin-pansing pag-uulit ng panandang temporal sa orihinal.
lexical_decisions:
- source_word: אָז
  choice: noon ... noon
  rationale: Dalawang beses itong lumilitaw sa Hebreo. Pinanatili ang pag-uulit upang maipahayag ang magkaparehong panahong tinutukoy sa dalawang sugnay.
- source_word: מְצוּדָה
  choice: muog
  rationale: Natural at maikling salin para sa isang ligtas at napapatibay na lugar na ginagamit sa kontekstong militar.
- source_word: מַצַּב
  choice: himpilan
  rationale: Sa kontekstong militar, tumutukoy ito sa nakatalagang puwesto o pangkat ng mga sundalo; ang “himpilan” ay malinaw nang hindi labis na tinutukoy ang anyo nito.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang anyong Filipino para sa pangalan ng bayang ito.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Karaniwang baybay sa makabagong Filipino para sa pangalang-lugar.
- source_word: וְ
  choice: at
  rationale: Tuwirang pinananatili ang koordinasyon ng dalawang sugnay sa Hebreo.
