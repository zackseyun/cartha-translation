revisions:
- from: Pinabagsak din niya ang isang Ehipsiyo[a], isang lalaking kahanga-hanga ang anyo. May sibat sa kamay ang Ehipsiyo, ngunit bumaba siya upang harapin ito na tungkod[b] lamang ang dala. Inagaw niya ang sibat mula sa kamay ng Ehipsiyo at pinatay ito sa sarili nitong sibat.
  to: Pinabagsak din niya ang isang Ehipsiyo[a], isang lalaking kahanga-hanga ang anyo. May sibat sa kamay ang Ehipsiyo, at bumaba siya patungo sa Ehipsiyo na may dalang tungkod[b]. Inagaw niya ang sibat mula sa kamay ng Ehipsiyo at pinatay niya ang Ehipsiyo gamit ang sarili nitong sibat.
  rationale: Inalis ang mga dagdag na nuwes ng pagsalungat at pagiging “lamang,” nilinaw ang mga reperente sa pamamagitan ng pag-uulit ng “Ehipsiyo,” at pinalitan ang maling alternatibong “garote” ng “baston.” Pinanatili ang maingat na pagpapahayag ng hindi tiyak na paglalarawan sa anyo ng Ehipsiyo.
