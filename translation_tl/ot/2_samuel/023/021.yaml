base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: tl
  text: Pinabagsak din niya ang isang Ehipsiyo[a], isang lalaking kahanga-hanga ang anyo. May sibat sa kamay ang Ehipsiyo, at bumaba siya patungo sa Ehipsiyo na may dalang tungkod[b]. Inagaw niya ang sibat mula sa kamay ng Ehipsiyo at pinatay niya ang Ehipsiyo gamit ang sarili nitong sibat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang lalaking makisig” o “isang lalaking kapansin-pansin ang anyo.” Malawak ang tinutukoy ng pariralang Hebreo tungkol sa anyo ng Ehipsiyo; dahil sa kahalintulad na salaysay sa 1 Cronica 11:23, nauunawaan ito ng ilan bilang pahiwatig na pambihira ang kanyang tangkad.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pamalo” o “baston.” Ang salitang Hebreo na שֵׁבֶט ay maaaring tumukoy sa tungkod, pamalo, setro, o baston depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Ipinahahayag nito ang marahas na paggapi sa konteksto ng labanan nang hindi inuuna ang tahasang “pinatay” na nasa hulihan ng talata.
- source_word: אִישׁ מִצְרִי
  choice: isang Ehipsiyo
  rationale: Natural at sapat sa modernong Tagalog ang katawagang etniko; hindi na kailangang ulitin ang “lalaki” rito.
- source_word: אשר מַרְאֶה
  choice: isang lalaking kahanga-hanga ang anyo
  rationale: Pinananatili nito ang malawak na diwa ng מַרְאֶה bilang nakikitang anyo, nang hindi tiyak na ipinapakahulugang guwapo o napakatangkad.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: May sibat sa kamay ang Ehipsiyo
  rationale: Natural na Tagalog na nagpapanatili sa kongkretong larawan ng sandata sa kamay.
- source_word: וַיֵּרֶד אֵלָיו
  choice: bumaba siya upang harapin ito
  rationale: Pinananatili ang literal na kilos na “bumaba” habang ipinapakita sa natural na Tagalog na lumapit siya laban sa Ehipsiyo.
- source_word: בַּשָּׁבֶט
  choice: na tungkod lamang ang dala
  rationale: Ang שֵׁבֶט ay maaaring tungkod, pamalo, o garote. “Tungkod” ang pinakamalawak at hindi labis na mapagpakahulugan; ang “lamang” ay natural na naghahayag ng malinaw na paghahambing sa sibat sa konteksto.
- source_word: וַיִּגְזֹל
  choice: inagaw
  rationale: Ang pandiwa ay nagsasaad ng sapilitang pagkuha; malinaw at masigla rito ang “inagaw.”
- source_word: וַיַּהַרְגֵהוּ
  choice: pinatay ito
  rationale: Direkta at karaniwang modernong salin ng הרג.
- source_word: בַּחֲנִיתוֹ
  choice: sa sarili nitong sibat
  rationale: Ang hulaping panghalip ay pinakanatural na tumutukoy sa Ehipsiyo, na siyang dating may hawak ng sibat, at malinaw nitong ipinakikita ang pagbaligtad ng kalagayan.
- source_word: וְהוּא
  choice: din niya
  rationale: Natural na ipinahahayag ang pandagdag na ugnayan nito sa naunang talaan ng mga ginawa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at pasalaysay. Ginamit ang “ito” para sa Ehipsiyo upang maiwasan ang malabong sunod-sunod na panghalip. Inilagay ang marker [b] sa “tungkod,” ang salitang talagang tinatalakay ng talababa.
