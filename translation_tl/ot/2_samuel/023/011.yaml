  text: וְ/אַחֲרָ֛י/ו שַׁמָּ֥א בֶן אָגֵ֖א הָרָרִ֑י וַ/יֵּאָסְפ֨וּ פְלִשְׁתִּ֜ים לַ/חַיָּ֗ה וַ/תְּהִי שָׁ֞ם חֶלְקַ֤ת הַ/שָּׂדֶה֙ מְלֵאָ֣ה עֲדָשִׁ֔ים וְ/הָ/עָ֥ם נָ֖ס מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: tl
  text: Kasunod niya ay si Shammah, anak ni Agee na Hararita. Nagtipon ang mga Filisteo upang lumaban[a]. May isang bahagi ng bukid doon na punô ng mga lentilhas, at tumakas ang mga tao mula sa harap ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng Hebreong לַחַיָּה. Maaaring ang ibig sabihin nito ay “upang lumaban,” ngunit maaari rin itong unawain nang mas literal bilang “sa isang pangkat” o katulad na pangkat militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Kasunod niya
  rationale: Pinananatili ang maikling ugnayang nagsasaad ng pagkakasunod-sunod sa talaan nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: si Sama, na anak ni Age, na Hararita
  rationale: Isinalin ang ugnayang pampamilya nang tuwiran at tinumbasan sa natural na anyong Tagalog ang mga pangalang pantangi at ang katawagang pangangkan o panrehiyon.
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: Nagtipon ang mga Filisteo
  rationale: Ang 'nagtipon' ay natural na katumbas ng pagkakatipon o pag-aasambleng ipinahihiwatig ng pandiwa sa kontekstong militar.
- source_word: לַחַיָּה
  choice: upang lumaban[a]
  rationale: Mahirap ang parirala. Pinili ang malamang na gamit nito sa kontekstong militar, na kaayon din ng kahawig na salaysay sa 1 Cronica 11:13, habang inilalahad sa talababa ang mas literal na posibilidad.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: isang bahagi ng bukid
  rationale: Inilalarawan nito ang isang takdang parsela o bahagi ng bukid; malinaw at natural ito sa makabagong Tagalog.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: punô ng mga lentehas
  rationale: Pinananatili ang tuwirang larawan ng Hebreo sa halip na ipakahulugang 'tinamnan ng mga lentehas.'
- source_word: וְהָעָם
  choice: ang mga tao
  rationale: Hindi tinukoy bilang mga kawal sapagkat ang karaniwang kahulugan ng עָם ay 'mga tao,' bagaman maaaring tumukoy ito sa mga Israelitang naroon.
- source_word: נָס מִפְּנֵי פְלִשְׁתִּים
  choice: tumakas ... mula sa harap ng mga Filisteo
  rationale: Malapit itong sumusunod sa idyomang Hebreo at malinaw na nagsasaad na umurong o tumakas sila dahil sa mga Filisteo.
