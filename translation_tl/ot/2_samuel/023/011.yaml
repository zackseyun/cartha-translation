    issue: Ang mga pangalang "Sama" at "Age" ay labis na naangkop kumpara sa transliterasyon ng Hebreo.
    rationale: Ang "Shammah" at "Agee" ay mas malinaw na nagpapanatili sa mga pangalang שַׁמָּא at אָגֵא nang hindi binabago ang kahulugan.
