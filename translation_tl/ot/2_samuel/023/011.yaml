revisions:
- from: Kasunod niya si Sama, na anak ni Age, na Hararita. Nagtipon ang mga Filisteo upang lumaban[a]. Naroon ang isang bahagi ng bukid na punô ng mga lentehas, at tumakas ang mga tao mula sa harap ng mga Filisteo.
  to: Kasunod niya ay si Shammah, anak ni Agee na Hararita. Nagtipon ang mga Filisteo upang lumaban[a]. May isang bahagi ng bukid doon na punô ng mga lentilhas, at tumakas ang mga tao mula sa harap ng mga Filisteo.
  rationale: Pinalitan ang di-karaniwang "lentehas" ng "lentilhas" at isinaayos ang transliterasyon ng mga pangalan para sa mas malapit na pagsunod sa Hebreo. Pinanatili ang kontekstuwal na pagbasa na "upang lumaban" kasama ng talababa, dahil ang pariralang Hebreo ay pinagtatalunan at hindi dapat gawing tiyak ang alternatibong pagbasa.
