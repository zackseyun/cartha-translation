  source_fidelity: Maayos na naipapahayag ng draft ang pagkakasunod sa talaan, ang pagkakakilanlan ni Shammah, ang pagtitipon ng mga Filisteo, ang parsela ng bukid, at ang pagtakas ng mga tao. Ang "upang lumaban" para sa mahirap na לַחַיָּה ay isang makatuwirang kontekstuwal na pagbasa at ang kawalang-katiyakan ay wastong minamarkahan sa talababa.
  naturalness: Malinaw at marangal ang pangkalahatang Tagalog. Gayunman, ang "lentehas" ay hindi ang karaniwang anyong ginagamit sa Filipino/Tagalog na pagsasalin para sa lentils; "lentilhas" ang mas matatag at madaling makilalang anyo. Pinakinis din ang pangalan upang mapanatili ang transliterasyon ng pinagmulang pangalan.
  terminology: Ang "Hararita," "Filisteo," at "mga tao" ay angkop. Pinanatili ang hindi matiyak na terminong militar sa talababa at hindi ipinilit ang isang alternatibong pagbasa bilang tiyak.
