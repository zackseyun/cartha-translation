lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: Abi-albon
  rationale: Pangalan ng tao; tinumbasan sa pamamagitan ng transliterasyon. Pinanatili ang gitling upang maipakita ang dalawang bahaging nakikita sa tekstong Masoretiko, bagaman maaari rin itong isulat bilang iisang salitang “Abialbon.”
- source_word: הָעַרְבָתִי
  choice: Arbatita
  rationale: May artikulong gentiliko na tumutukoy sa pinagmulan o kaugnayan sa isang lugar. Ang hulaping “-ita” ay natural at karaniwang paraan sa Tagalog upang ipahayag ang gayong katawagan, samantalang pinananatili ng “Arbat-” ang di-tiyak na pangalang-heograpiko.
- source_word: עַזְמָוֶת
  choice: Azmavet
  rationale: Pangalan ng tao; direktang transliterasyon na mas malapit sa tunog ng Hebreong pangwakas na tav kaysa sa nakaugaliang Ingles na “Azmaveth.”
- source_word: הַבַּרְחֻמִי
  choice: Barhumita
  rationale: May artikulong gentiliko na tumutukoy sa kaugnayan sa isang lugar. Sinusunod ng “Barhum-” ang anyo at pagbigkas ng tekstong Masoretiko; ginagamit ang natural na hulaping Tagalog na “-ita.”
