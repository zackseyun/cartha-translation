translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang “Si” bago sa unang pangalan at “at si” bago sa ikalawa upang maging natural ang talaan ng mga tao. Ang mga katawagang gentiliko ay nilagyan ng hulaping “-ita,” ayon sa karaniwang gamit sa saling biblikal at modernong Filipino.
