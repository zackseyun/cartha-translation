base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: tl
  text: Ang Espiritu ni Yahweh ay nagsalita sa pamamagitan ko[a], at ang kanyang salita ay nasa dila ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagsalita sa akin.” Ang pang-ukol na Hebreo ay maaaring unawain bilang “sa” o “sa pamamagitan,” bagaman malamang dito ang diwang tagapamagitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: Ang Espiritu ni Yahweh
  rationale: Bagaman maaaring mangahulugan ang רוּחַ ng hangin, hininga, o espiritu, ang konteksto ng propetikong pagsasalita ay tumutukoy sa Espiritu bilang banal na tagapagsalita. Pinanatili ang pangalang Yahweh para sa יְהוָה.
- source_word: דִּבֶּר
  choice: nagsalita
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagsasalita; ang aspektong naganap ay angkop sa pagbabalik-tanaw ni David.
- source_word: בִּי
  choice: sa pamamagitan ko
  rationale: 'Sa kontekstong ito, ang pang-ukol na בְּ ay malamang na instrumental: si David ang ginamit na tagapamagitan ng banal na pananalita. Ang saling ito ay natural sa modernong Tagalog, habang inilalahad sa talababa ang mas literal ngunit malabong alternatibo.'
- source_word: וּמִלָּתוֹ
  choice: at ang kanyang salita
  rationale: Ang מִלָּה ay ‘salita’ o ‘pahayag.’ Pinananatili ng ‘salita’ ang konkretong larawan at bigat ng banal na pananalita nang hindi ito pinalalawak bilang ‘mensahe.’
- source_word: עַל לְשׁוֹנִי
  choice: ay nasa dila ko
  rationale: Malapit itong sumusunod sa larawang Hebreo na ‘sa ibabaw ng aking dila’ ngunit gumagamit ng natural na pananalitang Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang natatanging tipang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng רוּחַ sa kontekstong ito
  choice: Espiritu
  alternative: hininga; hangin
  rationale: Ang banal na pagkilos sa propetikong pagsasalita ang nagpapahiwatig ng ‘Espiritu.’ Hindi nito kailangang linawin ang lahat ng susunod na doktrinal na tanong tungkol sa persona ng Espiritu.
- issue: Ugnayan ni Yahweh, ng Espiritu, at ng salitang binigkas
  choice: Pinanatili ang magkatabing pahayag na ang Espiritu ni Yahweh ang nagsalita at ang salita niya ay nasa dila ni David
  alternative: Pag-isahin o ipaliwanag ang dalawang sugnay bilang isang sistematikong pahayag tungkol sa inspirasyon
  rationale: Pinananatili ng salin ang paralelismo at teolohikal na tensiyon ng Hebreo nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa pamamagitan ko” upang natural na ihayag ang malamang na instrumental na diwa, at pinanatili ang konkretong larawang “nasa dila ko.”
