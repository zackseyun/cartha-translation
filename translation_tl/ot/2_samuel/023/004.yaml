  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: tl
  text: Siya ay gaya ng liwanag sa umaga kapag sumisikat ang araw[a], isang umagang walang ulap; sa ningning matapos ang ulan[b], sumisibol ang sariwang damo mula sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “at gaya ng liwanag sa umaga.” Eliptikal ang linyang Hebreo at ipinagpapatuloy nito ang paglalarawan sa pinuno sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa ningning, mula sa ulan, damo mula sa lupa”—isang siksik na larawang patula tungkol sa bagong pananim na lumilitaw pagkatapos ng ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: Siya ay gaya ng liwanag
  rationale: Ang וּ na may pahambing na כְּ ay nagpapatuloy sa paglalarawan sa pinunong binanggit sa naunang talata. Idinagdag ang “Siya ay” dahil walang tahasang pandiwa o simuno sa Hebreo, ngunit malinaw ang tinutukoy sa konteksto.
- source_word: בֹּקֶר
  choice: umaga
  rationale: Karaniwang kahulugan ito ng salita at napapanatili nito ang pag-uulit at larawang patula sa dalawang paglitaw.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: kapag sumisikat ang araw
  rationale: Likas na Tagalog ito para sa pagsikat o pagliwanag ng araw at angkop sa temporal na daloy ng taludtod.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: isang umagang walang ulap
  rationale: Tuwirang pinananatili ang larawan ng maaliwalas at walang-ulap na umaga sa natural na Tagalog.
- source_word: מִנֹּגַהּ
  choice: sa ningning
  rationale: Ang נֹגַהּ ay ningning o kaningningan. Ang pang-ukol na מִן ay nasa isang siksik at malabong ugnayang patula, kaya ginamit ang “sa” nang hindi labis na nililinaw ang sanhi.
- source_word: מִמָּטָר
  choice: matapos ang ulan
  rationale: Bagaman literal na “mula sa ulan,” malamang na inilalarawan ng parirala ang paglago na lumilitaw kasunod ng ulan. Pinananatili ng talababa ang mas literal at siksik na anyo.
- source_word: דֶּשֶׁא
  choice: sariwang damo
  rationale: Tumutukoy ang salita sa sariwa at luntiang pananim o damong bagong usbong; malinaw at buhay ang “sariwang damo” sa modernong Tagalog.
- source_word: מֵאָרֶץ
  choice: mula sa lupa
  rationale: Pinananatili nito ang larawan ng halamang umuusbong mula sa lupa at ang kahulugan ng אָרֶץ sa kontekstong ito.
theological_decisions:
- issue: Di-tahasang simuno ng paghahambing
  choice: Tahasan ang “Siya ay,” na tumutukoy sa matuwid na pinuno sa talata 3.
  alternative: Iwan bilang putol na pariralang “At gaya ng liwanag sa umaga...”
  rationale: Eliptikal ang tulang Hebreo, ngunit ipinakikilala ng agarang konteksto ang tinutukoy. Nililinaw ito sa Tagalog nang walang idinaragdag na bagong teolohikal na diwa.
- issue: Ugnayan ng huling sugnay
  choice: Ilarawan ang sariwang damong sumisibol sa ningning matapos ang ulan.
  alternative: Panatilihin ang lubhang literal na “mula sa ningning, mula sa ulan, damo mula sa lupa.”
  rationale: Siksik at maaaring unawain sa iba’t ibang paraan ang mga pang-ukol sa Hebreo. Ang pangunahing teksto ay naghahatid ng likas na larawan ng bagong paglago pagkatapos ng ulan, habang itinatala sa talababa ang literal na pagkakasunod at nananatiling bukas ang eksaktong ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang paghahambing at pag-uulit ng “umaga,” habang maingat na nilinaw ang elipsis at ang siksik na huling larawan sa pamamagitan ng mga talababa.
