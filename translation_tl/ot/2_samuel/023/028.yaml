lexical_decisions:
- source_word: צַלְמוֹן
  choice: Zalmon
  rationale: Pangalan ng tao; ang “Zalmon” ay tuwirang transliterasyon ng anyong katinig sa Hebreo at kaayon ng konsultasyong teksto.
- source_word: הָאֲחֹחִי
  choice: na Ahohita
  rationale: Ang gentilic na may pantukoy ay nagsasaad ng kaugnayan sa angkan o pangkat. Natural sa modernong Tagalog ang hulaping “-ita” at ang pariralang “na Ahohita” sa ganitong talaan.
- source_word: מַהְרַי
  choice: Maharai
  rationale: Pangalan ng tao; isinalin sa pamamagitan ng karaniwang transliterasyon.
- source_word: הַנְּטֹפָתִי
  choice: na Netofatita
  rationale: Ang gentilic na may pantukoy ay maaaring tumukoy sa pinagmulan o kaugnayan sa Netofa. Pinananatili ng “Netofatita” ang maikli at magkahanay na estilo ng listahan nang hindi nilulutas kung heograpiko o pang-angkan ang tiyak na ugnayan.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na anyong Filipino para sa talaan ng mga mandirigma. Ginamit ang “Si” sa unang pangalan at “at si” sa ikalawa upang maging malinaw ang paghahanay; pinanatili ang tuldok-kuwit dahil bahagi lamang ito ng nagpapatuloy na listahan.
