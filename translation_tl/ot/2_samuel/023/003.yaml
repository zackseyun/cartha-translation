id: 2SA.23.3
reference: 2 Samuel 23:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: tl
  text: 'Nagsalita ang Diyos ng Israel;

    sinabi sa akin ng Bato ng Israel:

    “Ang namamahala sa mga tao[a] nang matuwid,

    ang namamahala nang may takot sa Diyos[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sangkatauhan.” Ang Hebreong אָדָם ay maaaring tumukoy nang kolektibo sa sangkatauhan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang linyang ito bilang may mesiyanikong kabuluhan—isang huwarang paglalarawan sa hari na sukdulang natutupad sa Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: Nagsalita
  rationale: Ganap na pandiwang nagpapakilala sa pahayag. Ang payak na naganap na anyo ay natural sa Filipino at angkop sa estilong patula at propetiko.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang construct na tumutukoy sa Diyos ng Israel.
- source_word: לִי דִבֶּר
  choice: sinabi sa akin
  rationale: 'Ang לִי ay pinakanatural na di-tuwirang layon: kay David itinukoy ang banal na pahayag. Pinananatili ng “sinabi” ang paralelismo nang hindi nagiging alanganin sa Filipino.'
- source_word: צוּר יִשְׂרָאֵל
  choice: ang Bato ng Israel
  rationale: Pinananatili ang banal na titulo at metapora ng צוּר, na nagpapahiwatig ng katatagan at kanlungan, sa halip na ipaliwanag ito sa mismong teksto.
- source_word: מוֹשֵׁל
  choice: ang namamahala
  rationale: Ang participle ay inilalarawan bilang pangkalahatang uri ng pinuno, hindi bilang isang tahasang pinangalanang tao.
- source_word: בָּאָדָם
  choice: sa mga tao
  rationale: Ipinahahayag nito sa likas at inklusibong modernong Filipino ang kolektibong saklaw ng אָדָם bilang mga taong pinamamahalaan.
- source_word: צַדִּיק
  choice: nang matuwid
  rationale: Bagaman pang-uri sa anyo, sa masinsing tulang Hebreo ay inilalarawan nito ang paraan ng pamamahala; ang pang-abay na “nang matuwid” ang pinakanatural na katumbas.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: ang namamahala nang may takot sa Diyos
  rationale: Pinananatili ang ikalawang participial na parirala at ang diwa ng mapitagang pananagutan sa harap ng Diyos. Hindi nililinaw nang higit sa Hebreo ang masinsing ugnayang sintaktiko.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang anyong Hebreo ito para sa nag-iisang Diyos, kaya isahan ang salin.
theological_decisions:
- issue: Pangkalahatang huwaran ng paghahari o mesiyanikong pahayag
  choice: Isinalin ang taludtod bilang paglalarawan sa huwarang matuwid na namamahala, nang walang tahasang pagkilala sa Mesiyas sa pangunahing teksto.
  alternative: Maaaring unawain ang paglalarawan bilang may mesiyanikong kabuluhan at sukdulang natutupad sa Mesiyas.
  rationale: Hindi tahasang binabanggit ng Hebreo ang Mesiyas. Pinananatili ng pangunahing salin ang pangkalahatang pahayag tungkol sa matuwid na paghahari, habang inilalahad sa talababa ang posibleng mesiyanikong kabuluhan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at patulang paralelismo, pati ang di-ganap na pangungusap na nagpapatuloy sa kasunod na talata. Ginamit ang “Bato ng Israel” bilang tradisyonal ngunit malinaw na banal na metapora.
