base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: tl
  text: Tumindig siya at pinabagsak ang mga Filisteo hanggang sa mangalay ang kanyang kamay at kumapit ang kanyang kamay sa tabak.[a] At nagkaloob si Yahweh ng malaking tagumpay noong araw na iyon. Ang mga tao ay bumalik sa kanya para lamang hubaran ang mga napatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumikit ang kanyang kamay sa tabak.” Maaaring ilarawan nito ang kamay na nanigas sa mahigpit at matagal na paghawak; hindi tiyak sa Hebreo ang eksaktong pisikal na kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hinubaran nila ang mga napatay upang kunin ang kanilang mga sandata, baluti, at iba pang samsam pagkatapos ng labanan.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: Tumindig siya
  rationale: Ipinahihiwatig ng Qal ng קום ang mapagpasyang pagkilos sa labanan. Ang “tumindig” ay likas at marangal sa salaysay nang hindi nagdaragdag ng paliwanag.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: pinabagsak ang mga Filisteo
  rationale: Sa kontekstong militar, ang נכה ay tumutukoy sa marahas at kadalasang nakamamatay na pananakit. Ipinahahayag ng “pinabagsak” ang lakas ng kilos nang hindi tahasang sinasabing bawat isa ay pinatay.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: hanggang sa mangalay ang kanyang kamay
  rationale: Ang יגע ay nagsasaad ng pagod o pagkaubos ng lakas. Sa Filipino, ang “mangalay ang kamay” ang natural na paglalarawan sa pagod ng kamay dahil sa patuloy na paggamit.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: kumapit ito sa tabak
  rationale: Ang דבק ay “kumapit/dumikit.” Pinananatili ng “kumapit” ang matingkad na larawan at ang posibilidad ng literal na paninigas o masining na paglalarawan, nang hindi nagbibigay ng medikal na paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: malaking tagumpay
  rationale: Maaaring mangahulugan ang תְּשׁוּעָה ng pagliligtas, kaligtasan, o tagumpay. Sa agarang konteksto ng labanan, malinaw na naipakikita ng “tagumpay” ang kinalabasan habang nananatili ang mas malawak na saklaw sa talababa.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: Ang mga tauhan ay bumalik sa likuran niya
  rationale: Sa konteksto ng hukbo, tumutukoy ang הָעָם sa mga tauhang kasama niya. Ang “sa likuran niya” ay nagpapanatili sa literal na ugnayan ng אַחֲרָיו at nagpapakitang sumunod sila matapos ang kanyang mapagpasyang pakikipaglaban.
- source_word: אַךְ לְפַשֵּׁט
  choice: para lamang hubaran ang mga napatay
  rationale: Sa labanan, ang פשט ay tumutukoy sa paghuhubad sa mga napatay upang kunin ang sandata, baluti, at samsam. Pinananatili ng “lamang” ang mahigpit na puwersa ng אַךְ.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang personal na pangalan. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nag-aangkat ng sektaryang pagpapakahulugan.
- issue: Kahulugan ng תְּשׁוּעָה sa salaysay ng labanan
  choice: tagumpay
  alternative: pagliligtas / kaligtasan
  rationale: Ang agarang tinutukoy ay ang mapagpasyang kinalabasan ng labanan, kaya natural ang “tagumpay.” Gayunman, hindi ikinukubli ang mas malawak na saklaw ng salita; inilalahad ito sa talababa, at tahasang pinananatili ang pagkilos ni Yahweh bilang pinagmulan nito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tabak” para sa estilong biblikal na hindi lipas, at “mga tauhan” upang malinaw ang kontekstong militar. Ang mga talababa ay inilagay sa mismong sugnay na kanilang nililinaw; inayos nito ang maliwanag na pagkapalit ng mga marker sa ibinigay na English consultation layer.
