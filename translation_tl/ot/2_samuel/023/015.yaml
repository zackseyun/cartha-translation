id: 2SA.23.15
reference: 2 Samuel 23:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתְאַוֶּ֥ה דָוִ֖ד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בֹּ֥אר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: tl
  text: At nanabik si David at nagsabi,[a] “Sino ang magbibigay sa akin ng maiinom na tubig mula sa balon ng Bethlehem na nasa tabi ng pintuang-bayan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malayang salin, “Kung may magbigay lamang sa akin ng maiinom na tubig mula sa balon ng Bethlehem na nasa tabi ng pintuang-bayan!” Ginagamit sa Hebreo ang tanong na “Sino ang...?” bilang pagpapahayag ng pananabik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: nanabik
  rationale: Ipinahahayag ng hitpael ng אוה ang matinding pagnanais. Likas at marangal sa makabagong Tagalog ang “nanabik,” at pinananatili nito ang damdaming nasa Hebreo.
- source_word: וַיֹּאמַר
  choice: nagsabi
  rationale: Karaniwang pandiwa ito para sa pagsasalita. Hindi idinagdag ang “sa sarili” o “napabulalas” sapagkat hindi tahasang nasa Hebreo ang mga iyon.
- source_word: מִי
  choice: Sino ang magbibigay
  rationale: Pinananatili ang anyong patanong ng Hebreo, bagaman sa konteksto ay pagpapahayag ito ng pananabik o paghahangad.
- source_word: יַשְׁקֵנִי
  choice: magbibigay sa akin ng maiinom
  rationale: Ang hiphil ng שקה ay nangangahulugang magpainom o magbigay ng maiinom. Ang pariralang ito ay malinaw at natural kasunod ng tuwirang layon na “tubig.”
- source_word: מַיִם
  choice: tubig
  rationale: Tuwirang katumbas sa Tagalog.
- source_word: מִבֹּאר
  choice: mula sa balon
  rationale: Karaniwang tumutukoy ang בְּאֵר sa balon, hindi sa imbakan ng tubig.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng lugar.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: na nasa tabi ng pintuang-bayan
  rationale: Tinutukoy nito ang partikular na balon malapit sa pasukan ng lungsod. Nililinaw ng “pintuang-bayan” na ang tinutukoy ay tarangkahan ng bayan, hindi karaniwang pinto.
