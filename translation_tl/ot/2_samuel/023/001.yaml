  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: tl
  text: 'Ito ang mga huling salita ni David:


    Pahayag ni David na anak ni Jesse,

    pahayag ng lalaking itinaas sa kaitaasan,

    ng pinahiran ng Diyos ni Jacob,[a]

    at ng kalugud-lugod na mang-aawit ng Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Mesiyas ng Diyos ni Jacob.” Sa Hebreo, “ang pinahiran ng Diyos ni Jacob.” Dito ay tuwirang tumutukoy ang parirala kay David bilang haring pinahiran, bagaman may taglay itong maharlika at mesiyanikong alingawngaw.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “ang kaaya-ayang mang-aawit ng mga awit ng Israel.” Siksik ang pariralang Hebreo at maaaring iugnay ang “kalugud-lugod” sa mang-aawit o sa mga awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי ... הָאַחֲרֹנִים
  choice: mga huling salita
  rationale: Tuwirang inililipat ang karaniwang kahulugan ng parirala bilang pangwakas na kapahayagan ni David.
- source_word: נְאֻם
  choice: pahayag
  rationale: Ang salita ay pormal na panandang ginagamit sa maringal o propetikong kapahayagan. Natural sa modernong Tagalog ang “pahayag,” samantalang pinananatili ng ayos at pag-uulit ang solemneng tono.
- source_word: הַגֶּבֶר
  choice: ang lalaki
  rationale: Pinananatili ang payak na kahulugang “lalaki” sa halip na idagdag ang maaaring pahiwatig na mandirigma o makapangyarihang tao.
- source_word: הֻקַם עָל
  choice: itinaas
  rationale: Ipinahahayag ang pasibong pagkataas o pagkadakila nang hindi tinutukoy nang higit sa Hebreo kung sino ang tahasang gumagawa.
- source_word: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב
  choice: ang pinahiran ng Diyos ni Jacob
  rationale: Tumutukoy sa maharlikang pagpapahid kay David at pinananatili ang teolohikal na alingawngaw nang hindi agad ginagawa itong pantanging titulong “Mesiyas.”
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: ang kaaya-ayang mang-aawit ng Israel
  rationale: Ang Hebreo ay siksik at maaaring iugnay ang “kaaya-aya” sa mang-aawit o sa mga awit. Ang salin ay natural at malapit sa tradisyonal na pagkaunawa, habang inilalahad sa talababa ang alternatibo.
theological_decisions:
- issue: Kung gagawing pantanging titulong Mesiyas ang מְשִׁיחַ
  choice: ang pinahiran ng Diyos ni Jacob
  alternative: ang Mesiyas ng Diyos ni Jacob
  rationale: Si David ang tuwirang tinutukoy sa magkakasunod na paglalarawan. Ang “pinahiran” ay nagpapanatili sa historikal at maharlikang diwa pati sa mesiyanikong alingawngaw, nang hindi ipinipilit na tuwirang pagkakakilanlan kay Cristo ang pangunahing diwa rito.
- issue: Kung sino ang nagtaas kay David sa הֻקַם עָל
  choice: pasibong “itinaas” nang walang tahasang simuno
  alternative: “itinaas ng Diyos”
  rationale: Ipinahihiwatig ng konteksto ang Diyos bilang gumagawa, ngunit hindi Siya tahasang pinangalanan sa mismong sugnay; pinananatili ng salin ang anyong pasibo at ang bahagyang di-tiyak na pagkakahayag.
translation_notes:
  register: Makabago ngunit maringal na Filipino. Ginamit ang maikling mga taludtod upang maipakita ang paulit-ulit at makatang ayos ng Hebreo. Hindi isinalin ang panimulang וְ bilang “Ngayon,” sapagkat wala itong tahasang temporal na diwa rito.
