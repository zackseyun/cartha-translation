  source_fidelity: 'Tumpak ang pangunahing mga katumbas: “mga huling salita,” ang inuulit na pormal na “pahayag,” “pinahiran,” at “Diyos ni Jacob.” Gayunman, kailangang ipakita sa Tagalog ang magkakatulad na ayos ng tatlong pariralang ipinakikilala ng נְאֻם, at mas malinaw na maisalin ang ideya ng “raised on high.”'
  naturalness: Ang kasalukuyang paghahalili ng “ng lalaking,” “ang pinahiran,” at “at ng kaaya-ayang” ay hindi magkakatulad sa balarila at nagpapalabo sa appositional na listahan. Ang rebisyon ay gumagamit ng magkakatulad na pariralang may “ng” at nananatiling maringal ngunit natural sa modernong Filipino.
  terminology: Ang “pahayag” ay angkop para sa נְאֻם sa kontekstong ito. Pinananatili ang “pinahiran” sa halip na gawing pangunahing teksto ang “Mesiyas,” sapagkat si David ang tuwirang tinutukoy. Ang “kalugud-lugod na mang-aawit ng Israel” ay natural na panumbas sa siksik na pangwakas na pariralang Hebreo.
  issues:
