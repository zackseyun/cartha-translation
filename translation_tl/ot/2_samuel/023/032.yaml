  text: Elyahba the Shaalbonite[a], the sons of Jashen, Jonathan.
translation:
  language: tl
  text: Si Elyahba na taga-Shaalbon[a], ang mga anak ni Jashen, si Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maikli at mahirap unawain ang tekstong Hebreo rito. Sa literal: “Si Elyahba na taga-Shaalbon, ang mga anak ni Jashen, si Jonathan.” Ipinapalagay ng ilang tagapagpaliwanag na may iregularidad sa teksto at iba ang kanilang pagbubuo sa talaan, gaya ng pagturing kay Jonathan bilang isa sa “mga anak ni Jashen.” Pinananatili ng saling ito ang pagkakasabi ng tekstong Hebreo ayon sa pagkakapasa sa halip na baguhin ito.'
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: Elyahba
  rationale: Pangalan ng tao; tinumbasan sa paraang transliterasyon upang sundan ang anyong Hebreo.
- source_word: הַשַּׁעַלְבֹנִי
  choice: na taga-Shaalbon
  rationale: Ang anyong gentiliko ay tumutukoy sa isang taong mula sa Shaalbon; natural at malinaw sa modernong Filipino ang “taga-Shaalbon.”
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Malinaw na pangmaramihang anyong construct ng “anak.” Pinanatili ang bilang kahit mahirap ang kasunod na pagkakahanay ng mga pangalan.
- source_word: יָשֵׁן
  choice: Jashen
  rationale: Itinuring na pangalang pantangi sa pariralang “mga anak ni Jashen,” nang walang pagwawasto sa tekstong Hebreo.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino para sa pagiging madaling makilala at mabasa.
