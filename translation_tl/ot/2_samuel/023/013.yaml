base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: tl
  text: Pagkatapos, tatlumpu sa mga pangunahing mandirigma ng pangkat na Tatlumpu[a] ang bumaba at pumunta kay David sa panahon ng anihan[b], sa yungib ng Adullam. Samantala, isang pangkat ng mga Filisteo ang nagkakampo sa Lambak ng Refaim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlumpu mula sa tatlumpu, pinuno.” Mahirap ang pagkakabuo ng parirala. Maaaring ang ibig sabihin ay “tatlumpu sa mga pangunahing mandirigma,” o maaaring mas tiyak itong tumukoy sa mga kabilang sa “Tatlumpu,” ang piling mga mandirigma ni David.
    reason: alternative_reading
  - marker: b
    text: O “sa pag-aani.”
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreong חַיַּת פְּלִשְׁתִּים ay literal na “buhay na nilalang” o “hayop ng mga Filisteo,” ngunit ginagamit dito bilang idyoma para sa isang pangkat o yunit ng hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: bumaba
  rationale: Pinananatili nito ang karaniwang direksiyonal na diwa ng pandiwang ירד sa natural na Tagalog.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: tatlumpu sa mga pangunahing mandirigma ng pangkat na Tatlumpu
  rationale: Inilalahad nito ang dalawang pagbanggit sa ‘tatlumpu’ at ang katayuan nilang mga pinuno, ngunit nilalagyan ng talababa dahil siksik at mahirap tiyakin ang eksaktong ugnayang sintaktiko ng Hebreo.
- source_word: וַיָּבֹאוּ
  choice: pumunta
  rationale: Likas na salaysay sa Tagalog para sa pagkilos patungo kay David; hindi idinagdag ang ideya ng pakikipagkita na wala sa Hebreo.
- source_word: אֶל קָצִיר
  choice: sa panahon ng anihan
  rationale: Bagaman literal na may pang-ukol na ‘patungo sa,’ malamang na panahunan ang gamit ng parirala rito.
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Tuwirang ipinahahayag ang patutunguhan nang walang dagdag na detalye.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: sa yungib ng Adullam
  rationale: Tuwirang salin ng pariralang konstrakto at natural sa modernong Tagalog.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: isang pangkat ng mga Filisteo
  rationale: Ang חַיָּה ay literal na maaaring tumukoy sa buhay na nilalang o hayop, ngunit idiomatiko itong tumutukoy rito sa isang pangkat ng hukbo.
- source_word: חֹנָה
  choice: nagkakampo
  rationale: Ipinakikita ng anyong participle ang nagpapatuloy na kalagayan sa likuran ng pangunahing pangyayari.
- source_word: בְּעֵמֶק רְפָאִים
  choice: sa Lambak ng Refaim
  rationale: Pinananatili ang pangalang-pook sa transliterasyong angkop sa Tagalog.
