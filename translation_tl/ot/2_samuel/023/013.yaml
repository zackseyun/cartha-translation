  register: Gumamit ng modernong, marangal, at madaling maunawaang Filipino. Pinanatili ang katawagang “Tatlumpu” bilang pangalan ng piling pangkat at ipinaliwanag sa talababa ang mahirap at tunay na malabong pariralang Hebreo.
