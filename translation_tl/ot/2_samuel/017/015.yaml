base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Husai sa mga paring sina Sadoc at Abiatar, “Ganito at ganoon[a] ang ipinayo ni Ahitofel kay Absalom at sa matatanda ng Israel, at ganito at ganoon naman ang ipinayo ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idyoma sa Hebreo ang “ganito at ganoon,” na tumutukoy sa diwa o buod ng sinabi nang hindi ito inuulit nang salita por salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: sa mga paring sina Sadoc at Abiatar
  rationale: Malinaw at natural na iniuugnay ang “mga pari” sa dalawang pangalan, gaya ng sintaks ng Hebreo.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ganito at ganoon
  rationale: Pinananatili ang di-tiyak na idyomang tumutukoy sa nilalaman ng sinabi nang hindi ito inuulit nang salita por salita.
- source_word: יָעַץ
  choice: ipinayo
  rationale: Ang pandiwa ay tumutukoy sa pagbibigay ng payong estratehiko sa kontekstong pampolitika; natural at sapat ang bigat ng “ipinayo.”
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: kay Absalom at sa matatanda ng Israel
  rationale: Nililinaw ng mga panandang “kay” at “sa” ang mga tumanggap ng payo; ang “matatanda” ay tuwirang tumutugma sa זִקְנֵי bilang mga kinikilalang pinuno.
- source_word: יָעַצְתִּי אָנִי
  choice: ang ipinayo ko
  rationale: Ang “ko” sa hulihan ng magkatulad na sugnay, kasama ng “naman,” ay natural na nagtatampok sa paghahambing at sa diin ng malayang panghalip na אָנִי.
