  source_fidelity: 'Tapat ang salin sa Hebreo: naipapakita ang pagsulong ng salaysay, ang pagtukoy kina Sadoc at Abiatar bilang mga pari, ang paulit na idyomang כָּזֹאת וְכָזֹאת, at ang magkatapat na payo nina Ahitofel at Husai. Ang “naman” ay likas na naghahayag ng paghahambing na nasa pag-uulit ng Hebreo nang walang idinagdag na kahulugan.'
