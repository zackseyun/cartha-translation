  text: beds[a], basins, and pottery vessels, and wheat, barley, flour[b], roasted grain, beans, lentils[d][c], and parched grain.
translation:
  language: tl
  text: mga higaan, mga palanggana[a], at mga sisidlang yari sa luwad; trigo, sebada, harina, inihaw na butil, mga habas[b], lentehas, at inihaw na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mangkok.”
    reason: lexical_alternative
  - marker: b
    text: Ang habas ay malamang na tumutukoy sa broad bean o fava bean.
    reason: lexical_clarification
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: mga higaan
  rationale: Tumutukoy ito sa isang bagay o lugar na hinihigaan. Bagaman isahan ang anyong Hebreo, maaari itong gamiting kolektibo; likas sa talaan ng mga panustos ang maramihang “mga higaan.”
- source_word: סַפּוֹת
  choice: mga palanggana
  rationale: Malamang na tumutukoy sa malalapad na sisidlan. Ang “mga palanggana” ay malinaw at likas sa makabagong Filipino, habang pinananatili sa talababa ang posibleng “mga mangkok.”
- source_word: כְלִי יוֹצֵר
  choice: mga kagamitang palayok
  rationale: Literal itong “mga sisidlan ng magpapalayok” at tumutukoy sa mga kagamitang yari sa luwad. Ang salin ay natural at ipinahihiwatig ang materyal at gamit.
- source_word: חִטִּים
  choice: trigo
  rationale: Karaniwang makabagong Filipino para sa butil na wheat.
- source_word: שְׂעֹרִים
  choice: sebada
  rationale: Karaniwang makabagong Filipino para sa barley.
- source_word: קֶמַח
  choice: harina
  rationale: Malinaw na katumbas ng giniling na butil sa kontekstong ito.
- source_word: קָלִי
  choice: inihaw na butil
  rationale: Tumutukoy sa butil na inihaw o pinatuyo sa init. Ginamit ang kaparehong salin sa dalawang paglitaw upang mapanatili ang sadyang pag-uulit sa Hebreo.
- source_word: פּוֹל
  choice: mga habas
  rationale: Mas tiyak na tumutukoy ang salita sa broad beans o fava beans. Ang “habas” ang tuwirang katawagang Filipino; nilinaw ito sa talababa dahil hindi ito pangkaraniwan sa lahat ng mambabasa.
- source_word: עֲדָשִׁים
  choice: lentehas
  rationale: Karaniwang katawagang Filipino para sa lentils.
