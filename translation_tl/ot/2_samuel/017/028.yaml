  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang dalawang magkaparehong paglitaw ng “inihaw na butil” sa tekstong Hebreo, sa halip na pag-iba-ibahin ang salin para lamang maiwasan ang pag-uulit.
