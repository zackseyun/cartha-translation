translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Filipino. Pinili ang “pantakip” at “bukana ng balon” bilang karaniwang pananalita, samantalang pinanatili sa talababa ang di-pangkaraniwang anyo ng huling pariralang Hebreo.
