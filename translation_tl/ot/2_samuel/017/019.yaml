  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: tl
  text: Kinuha ng babae ang isang pantakip at inilatag ito sa ibabaw ng bukana ng balon. Pagkatapos, ikinalat niya sa ibabaw nito ang dinurog na butil[a], at walang nakaalam nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binayong butil.” Ang salitang Hebreo ay tumutukoy sa mga butil na dinurog o binayo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at walang bagay na nalaman.”
    reason: literal_rendering
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה. Sa salaysay, ang tinutukoy ay ang babaeng nasa bahay, kaya “ang babae” ang pinakanatural at hindi nagdaragdag ng tiyak na ugnayang hindi tahasang sinabi rito.
- source_word: הַמָּסָךְ
  choice: isang pantakip
  rationale: Ang מָסָךְ ay maaaring tumukoy sa pantakip, tabing, o kurtina. Ang “pantakip” ay malinaw sa konteksto at hindi nagpapalagay kung anong materyal ang ginamit.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: sa ibabaw ng bukana ng balon
  rationale: Literal itong “sa ibabaw ng mukha ng balon.” Sa likas na Tagalog, “bukana ng balon” ang malinaw na tumutukoy sa bahaging tinakpan.
- source_word: וַתִּשְׁטַח
  choice: ikinalat
  rationale: Ang pandiwang שׁטח ay nangangahulugang maglatag o magkakalat sa ibabaw. Ang “ikinalat” ay angkop sa paglalagay ng dinurog na butil upang magmukhang karaniwang ibabaw ang pantakip.
- source_word: הָרִפוֹת
  choice: dinurog na butil
  rationale: Ang bihirang salitang רִפוֹת ay tumutukoy sa mga butil na dinurog o binayo. Nauunawaan sa modernong Filipino ang “dinurog na butil” at hindi nito labis na tinutukoy ang uri ng butil.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: at walang nakaalam sa nangyari
  rationale: Literal na “at walang bagay na nalaman” ang Hebreo. Ang “walang nakaalam sa nangyari” ay natural na Filipino at pinananatili ang diwa na hindi nabunyag ang ginawa nila, nang hindi ginagawa itong tahasang sugnay ng layunin o bunga.
