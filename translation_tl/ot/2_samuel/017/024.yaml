  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: tl
  text: Pagkatapos, dumating si David sa Mahanaim, at tumawid si Absalom sa Jordan, kasama niya ang lahat ng kalalakihan ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: dumating
  rationale: Ang Qal perfect ng בוא ay nagsasaad ng pagdating sa isang patutunguhan; natural sa makabagong Tagalog ang “dumating ... sa.”
- source_word: מַחֲנָיְמָה
  choice: sa Mahanaim
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa lugar; naipapahayag ito ng “dumating ... sa Mahanaim.”
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: tumawid ... sa Jordan
  rationale: Ang עבר na may tuwirang layon na Jordan ay tumutukoy sa pagtawid sa ilog; malinaw at likas sa Tagalog ang “tumawid sa Jordan.”
- source_word: הוּא
  choice: si Absalom ... kasama
  rationale: Ang malayang panghalip ay tahasang inuugnay si Absalom sa kasunod na pangkat. Sa Tagalog, naihahatid ito nang natural sa pag-uulit ng paksa at sa pariralang “kasama ang,” sa halip na sa mabigat na literal na “siya.”
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: lahat ng kalalakihan ng Israel
  rationale: Ang אִישׁ ay panlalaking pangngalan na ginagamit nang kolektibo pagkatapos ng כָל. Pinananatili ng “kalalakihan” ang panlalaking at malamang na militar na sanggunian, nang hindi ito pinalalawak tungo sa buong sambayanan.
- source_word: עִמּוֹ
  choice: kasama
  rationale: Ipinapahayag ng preposisyon at hulaping panghalip ang pagsama kay Absalom; likas na Tagalog ang “kasama ang ...” sa ayos ng pangungusap.
- source_word: וְ
  choice: Pagkatapos / naman
  rationale: Ang unang waw ay nagsusulong sa salaysay at natural na isinasalin bilang “Pagkatapos.” Ang ikalawa ay nag-uugnay ng kasunod na sabayang pangyayari; ang “naman” ay nagbibigay ng maayos na transisyon nang hindi nagdaragdag ng pagsalungat.
