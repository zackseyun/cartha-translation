  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת עֲמָשָׂ֗א שָׂ֧ם אַבְשָׁלֹ֛ם תַּ֥חַת יוֹאָ֖ב עַל הַ/צָּבָ֑א וַ/עֲמָשָׂ֣א בֶן אִ֗ישׁ וּ/שְׁמ/וֹ֙ יִתְרָ֣א הַ/יִּשְׂרְאֵלִ֔י אֲשֶׁר בָּא֙ אֶל אֲבִיגַ֣ל בַּת נָחָ֔שׁ אֲח֥וֹת צְרוּיָ֖ה אֵ֥ם יוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: tl
  text: At itinalaga ni Absalom si Amasa na mamuno sa hukbo kapalit ni Joab. Si Amasa ay anak ng isang lalaking nagngangalang Itra na Israelita,[a] na sumiping kay Abigail na anak ni Nahas at kapatid ni Zeruia na ina ni Joab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Itra na Israelita.” Sa 1 Cronica 2:17: “Jeter na Ismaelita.”'
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם
  choice: itinalaga
  rationale: Sa konteksto, tumutukoy ito sa paglalagay kay Amasa sa isang tungkulin; natural sa Filipino ang “itinalaga.”
- source_word: תַּחַת יוֹאָב
  choice: kapalit ni Joab
  rationale: Ipinahahayag ng תַּחַת dito ang paghalili, hindi ang lokasyong nasa ilalim.
- source_word: עַל הַצָּבָא
  choice: na mamuno sa hukbo
  rationale: Inihahayag ng parirala ang awtoridad ni Amasa sa hukbo; mas natural ito kaysa literal na “sa ibabaw ng hukbo.”
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: anak ng isang lalaking nagngangalang Itra
  rationale: Pinananatili ang di-tiyak na “isang lalaki” at likas na isinasama ang kasunod na pagkakakilanlan.
- source_word: הַיִּשְׂרְאֵלִי
  choice: na Israelita
  rationale: Sinusunod ang WLC/Masoretic Text; inilalahad sa talababa ang naiibang pagbasa sa 1 Cronica 2:17.
- source_word: אֲשֶׁר בָּא אֶל
  choice: na sumiping kay
  rationale: Ang Hebreong eupemismo ay tumutukoy sa pakikipagtalik. Ang “sumiping kay” ay dignified at malinaw nang hindi labis na tahasan.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: Abigail na anak ni Nahas
  rationale: Direktang isinasalin ang ugnayang anak-magulang sa natural na Filipino.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: kapatid ni Zeruia na ina ni Joab
  rationale: Pinananatili ang appositional na pagkilala kay Zeruia bilang ina ni Joab.
