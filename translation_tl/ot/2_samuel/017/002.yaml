base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: tl
  text: Sasalakayin ko siya habang pagod siya at nanghihina[a]. Sisindakin ko siya, at tatakas ang lahat ng taong kasama niya. Pagkatapos, ang hari lamang ang papatayin ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mahina ang mga kamay,” isang idyoma para sa nanghihinang lakas o tapang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Sasalakayin ko siya
  rationale: Ang בוא na may עַל ay maaaring tumukoy sa paglapit laban sa isang tao sa paraang mapanlaban. Sa kontekstong militar, likas at malinaw sa Filipino ang “sasalakayin,” kahit hindi nito pinananatili ang literal na larawan ng “pagdating sa ibabaw/laban sa.”
- source_word: יָגֵעַ
  choice: pagod
  rationale: Tumutukoy ang pang-uri sa pagkapagod dahil sa hirap o pagkilos; karaniwan at malinaw ang “pagod” sa modernong Filipino.
- source_word: וּרְפֵה יָדַיִם
  choice: mahina ang loob[a]
  rationale: Literal itong “mahina/maluwag ang mga kamay,” isang idyoma para sa nanghihinang lakas o tapang. Ang “mahina ang loob” ay natural na idyomang Filipino na angkop sa posibilidad ng panghihina ng tapang, habang ipinapaliwanag sa talababa ang konkretong Hebreong larawan at mas malawak na saklaw.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: Sisindakin ko siya
  rationale: Ang Hiphil ng חרד ay causative—gagawing manginig o matakot ang isang tao. Maikli at likas na ipinahahayag ng “sisindakin” ang matinding takot o pagkataranta.
- source_word: וְנָס כָּל־הָעָם אֲשֶׁר אִתּוֹ
  choice: at tatakas ang lahat ng taong kasama niya
  rationale: Pinananatili ang payak na koordinasyong Hebreo sa halip na tahasang gawing sanhi at bunga, at malinaw na naihahatid ang אֲשֶׁר אִתּוֹ bilang “kasama niya.”
- source_word: וְהִכֵּיתִי
  choice: papatayin ko
  rationale: Madalas mang literal na “hahampasin/sasaktan” ang נכה, sa kontekstong ito ang layunin ay patayin ang hari bilang tanging target. Likas at hindi malabong Filipino ang “papatayin.”
- source_word: הַמֶּלֶךְ לְבַדּוֹ
  choice: ang hari lamang
  rationale: Pinananatili ang tiyak na titulong “ang hari” at ang diin ng לְבַדּוֹ na siya lamang ang target.
