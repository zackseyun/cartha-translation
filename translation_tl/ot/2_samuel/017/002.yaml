translation_notes:
  register: Modernong Filipino na natural at marangal. Gumamit ng tuwirang bokabularyong angkop sa salaysay-militar; iniwasan ang lipas na “manglulupaypay” at ang di-natural na literal na “mahina ang mga kamay” sa pangunahing teksto.
