  source_fidelity: Ang “mahina ang loob” ay masyadong nakatuon sa kawalan ng tapang, samantalang ang רְפֵה יָדַיִם (“mahina/maluluwag ang mga kamay”) ay nagpapanatili ng larawang tumutukoy sa nanghihinang lakas at maaari ring magpahiwatig ng panghihina ng loob. Ang “nanghihina” ay mas malawak at mas akma sa kasunod na talababa. Ang iba pang bahagi ay tapat sa daloy at diwang militar ng Hebreo.
  naturalness: Natural at malinaw sa modernong Filipino ang rebisyong pananalita. Ang “pagod at nanghihina” ay payak ngunit marangal, at ang “sisindakin” ay angkop para sa pagpapanginig o pagpapataranta sa kaaway.
  terminology: Napanatili ang “hari” bilang tiyak na titulo. Ang “sasalakayin,” “sisindakin,” at “papatayin” ay angkop sa kontekstong militar; ang huli ay sinusuportahan ng agarang konteksto ng planong patayin ang hari bilang tanging target.
