  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: tl
  text: Maging ang magiting na lalaki[a] na ang puso ay gaya ng puso ng leon ay lubusang panghihinaan ng loob[b], sapagkat alam ng buong Israel na isang makapangyarihang mandirigma ang iyong ama at magigiting na lalaki ang mga kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “anak ng kagitingan/lakas”; gayundin ang kaugnay na pangmaramihang idyoma sa hulihan ng talata.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “matutunaw, matutunaw”—isang mariing pagkakabuo na nangangahulugang lubusang mawawalan ng tapang o panghihinaan ng loob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל / בְנֵי חַיִל
  choice: magiting na lalaki / magigiting na lalaki
  rationale: Ang idyoma ay literal na “anak/mga anak ng lakas o kagitingan” at tumutukoy sa mga lalaking kilala sa tapang at husay sa pakikipaglaban. Pinananatili ng “magiting” ang ugnayang leksikal ng dalawang paglitaw at natural ito sa makabagong Filipino.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: ang puso ay gaya ng puso ng leon
  rationale: Pinananatili ang tahasang paghahambing at larawan ng Hebreo sa halip na paikliin bilang “pusong-leon.”
- source_word: הִמֵּס יִמָּס
  choice: lubusang panghihinaan ng loob
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin. Ang saling ito ay natural na nagpapahayag sa Filipino ng ganap na pagkawala ng tapang, habang itinatala sa talababa ang literal na larawang “matutunaw.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit mawawalan ng tapang maging ang magiting na lalaki.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: alam ng buong Israel
  rationale: Tuwirang ipinahahayag ang pangkalahatan at matatag nang kaalaman ng Israel.
- source_word: גִבּוֹר
  choice: isang makapangyarihang mandirigma
  rationale: Sa kontekstong militar, inilalarawan nito si David bilang bantog at malakas na mandirigma; nililinaw ng “mandirigma” ang diwa nang hindi nagdaragdag ng doktrinal na pakahulugan.
- source_word: אֲשֶׁר אִתּוֹ
  choice: ang mga kasama niya
  rationale: Natural at maikli itong katumbas ng pariralang “na kasama niya.”
