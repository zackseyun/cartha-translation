base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Husai kay Absalom, “Hindi mabuti ang payong ibinigay ni Ahitofel sa pagkakataong ito[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pagkakataong ito mismo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos ay sinabi” at malinaw nitong ipinapakita ang pagkakasunod-sunod ng mga pangyayari.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Hebreo sa mga saling Tagalog.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: kay Absalom
  rationale: Ang “kay” ang natural na panandang Tagalog para sa taong pinatutungkulan ng pagsasalita.
- source_word: לֹא טוֹבָה
  choice: Hindi mabuti
  rationale: Pinananatili nito ang malawak at tuwirang diwa ng Hebreong טוֹבָה nang hindi ito pinakikitid sa “hindi mahusay” o “hindi matalino.”
- source_word: הָעֵצָה
  choice: ang payo
  rationale: Maaaring tumukoy ang עֵצָה sa payo, kapasiyahan, o plano. Ang “payo” ay natural at angkop sa papel ni Ahitofel bilang tagapayo, habang nananatiling bukás sa estratehikong diwa ng konteksto.
- source_word: אֲשֶׁר יָעַץ
  choice: ibinigay
  rationale: Sa Tagalog, likas ang pariralang “payong ibinigay” at naiiwasan nito ang alanganing pag-uulit na katumbas ng literal na “payong ipinayo.”
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Hebreo sa mga saling Tagalog.
- source_word: בַּפַּעַם הַזֹּאת
  choice: sa pagkakataong ito
  rationale: Tumpak at natural nitong ipinahihiwatig na ang negatibong pagtatasa ay ukol sa payo ni Ahitofel sa partikular na pagkakataong ito, hindi kinakailangang sa lahat ng payo niya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang pagtatasa ni Husai at ang limitasyon nitong tumutukoy sa partikular na pagkakataong ito. Inilipat ang talababa sa pariralang tunay nitong tinutukoy; sa English consultation layer, lumilitaw itong nakakabit sa “Absalom,” ngunit ang nilalaman nito ay malinaw na tumutukoy sa בַּפַּעַם הַזֹּאת.
