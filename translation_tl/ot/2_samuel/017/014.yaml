  - severity: low
    issue: Medyo di-likas ang “magdala si Yahweh ng kapahamakan.”
    rationale: Mas karaniwang kolokasyon sa modernong Filipino ang “magdulot ... ng kapahamakan,” habang pareho ang kahulugan at pananagutan ng paksa.
