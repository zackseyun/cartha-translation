  to: Pagkatapos, sinabi ni Absalom at ng lahat ng kalalakihan ng Israel, “Mas mabuti ang payo ni Hushai na Arkita kaysa sa payo ni Ahitofel.” Sapagkat ipinasiya ni Yahweh[a] na biguin ang mabuting payo ni Ahitofel, upang magdulot si Yahweh ng kapahamakan[b] kay Absalom.
