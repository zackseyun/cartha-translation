  naturalness: Malinaw at marangal ang Tagalog. Mas likas ang “magdulot ... ng kapahamakan” kaysa “magdala ... ng kapahamakan” sa ganitong sugnay.
  terminology: Wasto at pare-pareho ang “payo,” “Yahweh,” at “kapahamakan.” Ang “Arkita” ay katanggap-tanggap na anyong gentiliko. Pinananatili ng talababa ang leksikal na lawak ng צִוָּה at רָעָה nang hindi ipinipilit ang isang doktrinal na pagbasa.
