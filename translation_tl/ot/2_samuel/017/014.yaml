  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Absalom at ng lahat ng kalalakihan ng Israel, “Mas mabuti ang payo ni Hushai na Arkita kaysa sa payo ni Ahitofel.” Sapagkat ipinasiya ni Yahweh[a] na biguin ang mabuting payo ni Ahitofel, upang magdulot si Yahweh ng kapahamakan[b] kay Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iniutos ni Yahweh.” Karaniwang nangangahulugang “mag-utos” ang pandiwang Hebreo, ngunit dito maaari nitong ilarawan ang mabisang pasiya ni Yahweh tungkol sa payo ni Ahitofel.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “kasamaan,” “pinsala,” o “sakuna”; dito, tumutukoy ito sa kapahamakang sasapit kay Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” habang pinananatili ang pagkakasunod-sunod ng pangyayari.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: at ng lahat ng kalalakihan ng Israel
  rationale: Kolektibo ang singular na אִישׁ sa konteksto. Pinananatili ng “kalalakihan” ang tahasang panlalaking anyo ng Hebreo.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: Mas mabuti ... kaysa sa payo
  rationale: May pahambing na gamit ang טוֹבָה dahil sa מִן; ang “mas mabuti ... kaysa” ang likas na katumbas sa Tagalog.
- source_word: עֲצַת
  choice: payo
  rationale: Saklaw ng עֵצָה ang payo at estratehikong panukala. Malinaw at natural ang “payo” sa tagpong ito ng pagpapayo sa hari.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Hushai na Arkita
  rationale: Ang הָאַרְכִּי ay katawagang gentiliko; ang “Arkita” ay tuwirang anyong Tagalog nito.
- source_word: צִוָּה
  choice: ipinasiya
  rationale: Karaniwang nangangahulugang “nag-utos” ang pandiwa, ngunit dito inilalarawan nito ang mabisang pasiya ni Yahweh na mawalan ng bisa ang payo; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: לְהָפֵר
  choice: na biguin
  rationale: Ang Hiphil ng פרר ay tumutukoy sa pagpawalang-bisa o paghadlang sa bisa ng isang payo. Ipinahahayag ng “biguin” na hindi magtatagumpay ang estratehiya.
- source_word: הַטּוֹבָה
  choice: ang mahusay na payo
  rationale: Ang “mahusay” ay nagpapahayag ng kontekstuwal na kahulugan ng טוֹבָה bilang mahusay o mabisang estratehiya, hindi bilang moral na kabutihan.
- source_word: לְבַעֲבוּר הָבִיא
  choice: upang magdala
  rationale: Ang parirala ay nagpapahayag ng layunin o nilalayong resulta; natural itong naihahatid ng “upang.”
- source_word: הָרָעָה
  choice: kapahamakan
  rationale: Maaaring mangahulugan ang רָעָה ng kasamaan, pinsala, o sakuna. Dito, ang kapahamakang sasapit kay Absalom ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreo ang mismong pangalang tipan na YHWH; pinananatili itong “Yahweh” sa teksto.
- issue: Paglalarawan sa pagkilos ng Diyos sa צִוָּה לְהָפֵר
  choice: ipinasiya ni Yahweh na biguin
  alternative: iniutos ni Yahweh na biguin; itinakda ni Yahweh na pawalang-bisa
  rationale: Ipinahahayag ng konteksto ang mabisang pasiya ng Diyos tungkol sa pagkabigo ng payo ni Ahitofel. Hindi tinutukoy ng teksto kung kanino ibinigay ang isang utos, kaya natural ang “ipinasiya,” habang pinananatili sa talababa ang literal na posibilidad na “iniutos.”
- issue: Kahulugan ng הָרָעָה bilang gawa ng Diyos
  choice: kapahamakan
  alternative: kasamaan; pinsala; sakuna
  rationale: Sa konteksto, tumutukoy ito sa kapahamakang hatol na sasapit kay Absalom, hindi kinakailangang sa moral na kasamaan. Ang talababa ay nagpapanatili sa mas malawak na saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “payo” sa halip na mas teknikal na “konseho,” at “kapahamakan” upang maipahayag ang judicial na ruin nang hindi nilulutas nang lampas sa konteksto ang semantikong lawak ng רָעָה. Pinanatili ang pangalang “Yahweh” at ang panlalaking kolektibong “kalalakihan.”
