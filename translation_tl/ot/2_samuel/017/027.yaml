base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: tl
  text: Nang dumating si David sa Mahanaim, sina Shobi na anak ni Nahash mula sa Rabba ng mga Ammonita, Makir na anak ni Amiel mula sa Lo-debar, at Barzilai na taga-Gilead mula sa Rogelim,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Nang dumating
  rationale: Ang וַיְהִי ay nagsusulong ng salaysay at ang כְּבוֹא ay temporal. Likas na naipahahayag sa Tagalog ang dalawa sa “Nang dumating,” nang hindi nagdaragdag ng tahasang salitang “ngayon.”
- source_word: דָוִד מַחֲנָיְמָה
  choice: si David sa Mahanaim
  rationale: Ipinahihiwatig ng hulaping directional na ה ang pagpunta patungo sa Mahanaim; sapat at natural sa Tagalog ang “sa Mahanaim” kasunod ng “dumating.”
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Shobi na anak ni Nahash
  rationale: Isinatinig ang mga pangalang pantangi at natural na isinalin ang patronymic na בֶן bilang “anak ni.”
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: mula sa Rabba ng mga Ammonita
  rationale: Ang Rabba ay pangalan ng lungsod, at ang בְּנֵי עַמּוֹן dito ay kinaugaliang katawagang etniko sa mga Ammonita.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Makir na anak ni Amiel
  rationale: Ginamit ang anyong pangalang madaling bigkasin sa Filipino at pinanatili ang ugnayang ama-anak.
- source_word: מִלֹּא דְבָר
  choice: mula sa Lo-debar
  rationale: Pangalan ito ng lugar at isinatinig sa halip na isalin ang posibleng kahulugan ng mga bahagi nito.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai na taga-Gilead
  rationale: Ang gentilic na הַגִּלְעָדִי ay natural na ipinahahayag sa modernong Tagalog bilang “taga-Gilead.”
- source_word: מֵרֹגְלִים
  choice: mula sa Rogelim
  rationale: Pinanatili bilang isinatinig na pangalan ng lugar.
