base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: tl
  text: Nagdala rin sila ng pulot, namuong gatas[a], mga tupa[b], at keso mula sa baka[c] para kainin ni David at ng mga taong kasama niya. Sapagkat sinabi nila, “Gutom, pagod, at uhaw ang mga tao sa ilang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mantikilya.” Malawak ang kahulugan ng salitang Hebreo para sa produktong mula sa gatas; malamang na tumutukoy ito rito sa namuong gatas sa halip na sa makabagong mantikilya.
    reason: lexical_alternative
  - marker: b
    text: O “maliliit na alagang hayop”; maaaring kabilang sa salitang Hebreo ang mga tupa at kambing.
    reason: lexical_alternative
  - marker: c
    text: Ang pariralang Hebreo ay tumutukoy sa produktong gatas na mula sa mga baka; hindi tiyak ang eksaktong uri nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: pulot
  rationale: Karaniwang tumutukoy ito sa pulot-pukyutan, bagaman maaari rin itong tumukoy sa matamis na arnibal sa ilang konteksto.
- source_word: חֶמְאָה
  choice: keso
  rationale: Tumutukoy ito sa produktong mula sa gatas, malamang ay namuong gatas o malambot na keso kaysa makabagong mantikilya. Ginamit ang payak na “keso” para sa natural na modernong Tagalog.
- source_word: צֹאן
  choice: mga tupa
  rationale: Maaaring kolektibong tumukoy ang Hebreo sa maliliit na alagang hayop, kabilang ang mga tupa at kambing; “mga tupa” ang maikli at natural na salin habang inilalagay sa talababa ang mas malawak na diwa.
- source_word: שְׁפוֹת בָּקָר
  choice: kesong mula sa gatas ng baka
  rationale: Isinasalin ito bilang produktong-gatas na mula sa mga baka nang hindi tinutukoy nang labis ang eksaktong paraan ng paggawa.
- source_word: הִגִּישׁוּ
  choice: nagdala sila
  rationale: Ang literal na diwa ay “inilapit” o “iniharap,” ngunit sa konteksto ng paglalaan ng pagkain, mas natural sa Tagalog ang “nagdala.”
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ לֶאֱכֹל
  choice: para kainin ni David at ng mga taong kasama niya
  rationale: Natural na ipinahahayag sa Tagalog ang layunin ng pagdadala at ang mga tatanggap ng pagkain.
- source_word: כִּי אָמְרוּ
  choice: Sapagkat sinabi nila
  rationale: Pinananatili ang paliwanag na dahilan ng kanilang ginawa at ang tuwirang daloy ng salaysay.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: Gutom, pagod, at uhaw
  rationale: Pinananatili ang tatluhang paglalarawan at ang antas ng tindi ng Hebreo.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay natural at malawak na salin para sa lupang tiwangwang o di-gaanong tinitirhan, hindi kinakailangang mabuhanging disyerto.
