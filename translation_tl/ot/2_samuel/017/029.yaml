translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “pulot,” “keso,” at “sa ilang” bilang natural na mga katawagan; pinanatili sa mga talababa ang tunay na leksikal na kalabuan ng mga produktong-gatas at ng צֹאן.
