base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: tl
  text: Lulusubin natin siya sa isa sa mga lugar kung saan siya matatagpuan, at dadaganan natin siya gaya ng hamog na bumabagsak sa lupa. Walang matitira sa kaniya ni sa lahat ng lalaking kasama niya—kahit isa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: Lulusubin natin siya
  rationale: Ang literal na diwang “pupunta tayo sa kaniya” ay malinaw na paglusob sa kontekstong militar. Ipinahahayag ng “lulusubin” ang poot na ipinahihiwatig ng parirala nang hindi dinaragdagan ang paraan ng pag-atake.
- source_word: בְאַחַת הַמְּקוֹמֹת אֲשֶׁר נִמְצָא שָׁם
  choice: sa isa sa mga lugar na matagpuan siya
  rationale: Pinananatili nito ang “isa sa mga lugar” at ang pasibong diwa ng נִמְצָא, sa halip na gawing tiyak ang lugar o magdagdag ng diwang posibilidad.
- source_word: וְנַחְנוּ עָלָיו
  choice: at dadaganan natin siya
  rationale: Ang נוח ay “magpahinga/manatili o lumapag sa ibabaw,” hindi “bumagsak.” Sa larawang militar, ang “dadaganan” ay natural na nagpapahiwatig ng lubos na pagtabon at paggapi habang pinananatili ang kaibahan nito sa יִפֹּל, “bumabagsak,” sa kasunod na paghahambing.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: gaya ng hamog na bumabagsak sa lupa
  rationale: Tuwirang pinananatili ang paghahambing at ang pandiwang “bumabagsak,” pati ang larawan ng hamog na lumalaganap sa lupa.
- source_word: וְלֹא נוֹתַר ... גַּם אֶחָד
  choice: Walang matitira ...—kahit isa
  rationale: Natural na isinasalin ang diwa ng pananatili o pagkaligtas at pinananatili ang mariing pangwakas na “kahit isa.”
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: sa kaniya o sa lahat ng lalaking kasama niya
  rationale: Saklaw ng pahayag si David at ang buong pangkat ng mga lalaking kasama niya. Ang “o” ay likas sa negatibong pangungusap sa Filipino at malinaw na naghahatid ng kabuuang saklaw.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na himig-militar. Iniwasang isalin ang נוח bilang “babagsak” upang hindi ito mapaghalo sa ibang pandiwa, יִפֹּל (“bumabagsak”), na ginamit para sa hamog.
