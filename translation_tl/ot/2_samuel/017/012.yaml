  - severity: low
    issue: Mas natural ang negatibong ugnayang "ni sa" kaysa "o sa."
    rationale: Sa pangungusap na "Walang matitira," ang "ni sa lahat" ay mas idiomatiko at malinaw na sumasaklaw kapwa kay David at sa lahat ng kasama niya.
  revised_text: Lulusubin natin siya sa isa sa mga lugar kung saan siya matatagpuan, at dadaganan natin siya gaya ng hamog na bumabagsak sa lupa. Walang matitira sa kaniya ni sa lahat ng lalaking kasama niya—kahit isa.
