  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: tl
  text: Naging mabuti ang panukala sa paningin ni Absalom at sa paningin ng lahat ng nakatatanda ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang bagay na iyon ay tama sa paningin ni Absalom at sa paningin ng lahat ng nakatatanda ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: naging kalugod-lugod
  rationale: Ang pandiwa mula sa ישר, kasama ng idyomang בְּעֵינֵי, ay nagsasaad dito na ang isang bagay ay itinuring na mabuti o katanggap-tanggap, hindi na ito ay matuwid sa moral na diwa.
- source_word: הַדָּבָר
  choice: ang panukala
  rationale: Bagaman maaari itong literal na mangahulugang “ang bagay” o “ang salita,” tumutukoy ito sa salaysay sa payong kapapahayag lamang; malinaw at likas sa Filipino ang “panukala.”
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang larawan ng karaniwang idyomang Hebreo para sa pagtataya o pagsang-ayon at nauunawaan pa rin sa modernong Filipino.
- source_word: אַבְשָׁלֹם
  choice: Absalom
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa mga saling Filipino.
- source_word: וּבְעֵינֵי
  choice: at sa paningin ng
  rationale: Pinananatili ang pag-uulit sa Hebreo upang maipakita ang diin at estruktura ng pinagmulan.
- source_word: כָּל
  choice: lahat ng
  rationale: Tuwirang salin ng panlahatang pantukoy.
- source_word: זִקְנֵי
  choice: matatandang pinuno ng
  rationale: Sa konteksto, tumutukoy ito sa kinikilalang mga nakatatandang lider ng bayan, hindi lamang sa matatandang lalaki; nililinaw ito ng “pinuno.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginamit ang pamantayang anyo ng pangalan sa Filipino.
