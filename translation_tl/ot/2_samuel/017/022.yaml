base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: tl
  text: Bumangon si David at ang lahat ng taong kasama niya, at tumawid sila sa Jordan. Pagsapit ng liwanag ng umaga[a], wala ni isa ang hindi nakatawid sa Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hanggang sa magliwanag ang umaga.” Pinananatili ng pariralang Hebreo ang larawan ng liwanag ng umaga habang tinutukoy ang panahong natapos ang pagtawid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Bumangon
  rationale: Ang Qal wayyiqtol ng קום ay karaniwang nangangahulugang “bumangon.” Pinananatili nito ang galaw ng salaysay nang hindi idinaragdag ang mas interpretatibong diwang “humayo.”
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: at ang lahat ng taong kasama niya
  rationale: Tuwirang inilalarawan nito ang buong pangkat na kasama ni David. Ang “mga tao” ay hindi naglilimita sa pangkat sa mga lalaking nasa hustong gulang.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: at tumawid sila sa Jordan
  rationale: Ang עבר na may tuwirang layon na “Jordan” ay likas na isinasaling “tumawid sa Jordan” sa makabagong Tagalog.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Pagsapit ng liwanag ng umaga
  rationale: Pinananatili nito ang larawan ng אוֹר, “liwanag,” habang malinaw na ipinahihiwatig ang panahong natapos ang pagtawid. Inilalagay sa talababa ang posibleng mas literal na temporal na pagbasa.
- source_word: עַד אַחַד לֹא נֶעְדָּר
  choice: wala ni isang hindi nakatawid
  rationale: Sa kaugnayan ng kasunod na sugnay, likas na ipinahahayag sa Tagalog ang diwa na walang sinumang naiwan o nabigong tumawid. Pinananatili ng “wala ni isa” ang diin ng Hebreong idyoma.
- source_word: אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: hindi nakatawid sa Jordan
  rationale: 'Isinasama ito sa naunang negatibong pahayag upang mapanatili ang litotes ng Hebreo: wala ni isang taong hindi tumawid.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Jordan” alinsunod sa karaniwang anyo ng pangalan sa mga saling Filipino. Inilagay ang talababa sa pariralang talagang tinutukoy nito, ang “liwanag ng umaga.”
