translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘Haring David,’ ‘Tumindig,’ at ‘sapagkat’ para sa marangal na salaysay, ngunit iniwasan ang lipas o labis na pormal na ayos.
