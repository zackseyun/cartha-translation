base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: tl
  text: Nang makaalis na ang mga humahabol, umahon sina Ahimaaz at Jonatan mula sa balon. Nagpunta sila at nagbalita kay Haring David. Sinabi nila kay David, “Bumangon kayo at agad na tumawid sa ilog, sapagkat ganito ang ipinayo ni Ahitofel laban sa inyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: Pagkaalis nila
  rationale: Likas at maikli sa Tagalog; ang “nila” ay tumutukoy sa mga umalis na humahabol, ayon sa konteksto.
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: umahon ang dalawa mula sa balon
  rationale: Ang pandiwa ay literal na ‘umahon’; idinagdag ang ‘ang dalawa’ upang maging malinaw ang di-nakasulat na simuno mula sa konteksto nang hindi binabago ang diwa.
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ דָּוִד
  choice: pumunta kay Haring David upang ibalita ang nangyari
  rationale: Ipinahahayag nang natural ang sunod-sunod na pagpunta at pagsasabi; ang layon ng pagbabalita ay malinaw sa konteksto.
- source_word: קוּמוּ
  choice: Tumindig kayo
  rationale: Pinananatili ang literal at marangal na utos na bumangon o tumindig, at ang maramihang anyo ay ipinahahayag sa ‘kayo’.
- source_word: וְעִבְרוּ מְהֵרָה אֶת־הַמַּיִם
  choice: at mabilis na tumawid sa ilog
  rationale: Ang ‘tubig’ ay tumutukoy sa tawiran ng Jordan sa konteksto; ‘ilog’ ang natural na Filipino habang hindi tahasang ipinapasok ang pangalang Jordan.
- source_word: כִּי כָכָה יָעַץ עֲלֵיכֶם אֲחִיתֹפֶל
  choice: sapagkat ganito ang ipinayo ni Ahitofel laban sa inyo
  rationale: Pinananatili ang idiomatikong ‘ganito’ at ang mapanlabang puwersa ng עֲלֵיכֶם, nang hindi dinaragdagan ang nilalaman ng payo.
