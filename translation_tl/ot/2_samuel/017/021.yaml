revisions:
- from: Pagkaalis nila, umahon ang dalawa mula sa balon at pumunta kay Haring David upang ibalita ang nangyari. Sinabi nila kay David, “Tumindig kayo at mabilis na tumawid sa ilog, sapagkat ganito ang ipinayo ni Ahitofel laban sa inyo.”
  to: Nang makaalis na ang mga humahabol, umahon sina Ahimaaz at Jonatan mula sa balon. Nagpunta sila at nagbalita kay Haring David. Sinabi nila kay David, “Bumangon kayo at agad na tumawid sa ilog, sapagkat ganito ang ipinayo ni Ahitofel laban sa inyo.”
  rationale: Nilinaw ang mga referent na hinihingi ng agarang konteksto upang hindi magmukhang iisang grupo ang umalis at umahon. Inalis ang idinagdag na “ang nangyari,” pinanatili ang sunod-sunod na kilos na umahon, nagpunta, at nag-ulat, at ginawang mas natural ang agarang utos na bumangon at tumawid.
