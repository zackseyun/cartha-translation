base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: tl
  text: Nakapuwesto sina Jonatan at Ahimaas sa En-rogel.[a] Ang babaeng lingkod[b] ay pumupunta roon upang magbalita sa kanila, at sila naman ay pumupunta upang magbalita kay Haring David, sapagkat hindi sila maaaring makitang pumapasok sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nakatayo.” Sa konteksto, malamang na ang ibig sabihin ay nananatili o nakatalaga sila roon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “babaeng alipin.” Ang salitang Hebreo ay tumutukoy sa isang babaeng lingkod o alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: nakapuwesto
  rationale: Ang literal na diwa ay “nakatayo,” ngunit kasama ng pagtukoy sa isang lugar, ipinahihiwatig dito na nananatili o nakatalaga sila roon. Ang “nakapuwesto” ay natural sa makabagong Filipino at angkop sa lihim na paghahatid ng balita.
- source_word: בְּעֵין רֹגֵל
  choice: sa En-rogel
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon at ginamitan ng karaniwang panandang panlunan na “sa.”
- source_word: הַשִּׁפְחָה
  choice: ang babaeng lingkod
  rationale: Tiyak na tumutukoy ang salita sa isang babaeng lingkod at may tiyak na pantukoy sa Hebreo. Hindi tahasang idinidiin sa konteksto ang legal na katayuan niya bilang alipin, kaya “babaeng lingkod” ang malinaw at hindi labis na tiyak na salin.
- source_word: וְהָלְכָה ... וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: ay pumupunta ... at sila naman ay pumupunta upang magbalita
  rationale: Inilalarawan ng mga anyo ng pandiwa ang nakagawiang o itinakdang paraan ng pagpapasa ng mensahe, hindi lamang ang isang natapos na kilos. Ipinahahayag ito ng aspektong nagaganap na “pumupunta.”
- source_word: וְהִגִּידָה לָהֶם
  choice: magbalita sa kanila
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi, mag-ulat, o magpabatid. Ang “magbalita” ay natural sa konteksto ng pagpapasa ng mahalagang impormasyon.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: kay Haring David
  rationale: Ito ang likas na ayos sa Filipino para sa titulo at pangalang pantangi.
- source_word: כִּי לֹא יוּכְלוּ לְהֵרָאוֹת
  choice: sapagkat hindi sila maaaring makitang
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang Niphal ng ראה ay nagpapahayag dito ng pagiging nakikita o napapansin ng iba.
- source_word: לָבוֹא הָעִירָה
  choice: pumapasok sa lungsod
  rationale: Ang hulaping patungo sa עִירָה ay nagpapahiwatig ng pagkilos papasok o patungo sa lungsod. Natural na katambal ng “makitang” ang “pumapasok.”
