  source_fidelity: 'Tumpak na naihahatid ng salin ang ayos at diwa ng Hebreo: sina Jonatan at Ahimaas ay nakatalaga sa En-rogel; ang babaeng lingkod ang naghahatid ng ulat sa kanila; saka sila mag-uulat kay Haring David. Ang aspektong pangpamamaraan sa “pumupunta” ay katanggap-tanggap para sa inilalarawang lihim na daloy ng mensahe, at ang “hindi sila maaaring makitang pumapasok sa lungsod” ay maayos na tumutumbas sa dahilan sa hulihan ng talata.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Nakapuwesto,” “babaeng lingkod,” at “magbalita” ay angkop sa marangal ngunit madaling basahing rehistro. Hindi kinakailangang idagdag o tukuyin ang pangalan ng lungsod.
  terminology: 'Wasto at pare-pareho ang mga pangalan at titulo: Jonatan, Ahimaas, En-rogel, at Haring David. Ang “babaeng lingkod” ay isang maingat na pangunahing salin ng שִׁפְחָה, habang pinananatili ng talababa ang posibleng “babaeng alipin.” Ang mga panandang talababa ay tama ang pagkakakabit sa kaugnay na mga salita.'
