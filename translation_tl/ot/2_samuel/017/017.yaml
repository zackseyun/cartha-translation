translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na takbo ng paghahatid ng mensahe at hindi tinukoy na Jerusalem ang “lungsod,” yamang hindi ito tahasang pinangalanan sa talata.
