base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: tl
  text: Dumating sa bahay ang mga tauhan ni Absalom at tinanong ang babae, “Nasaan sina Ahimaas at Jonatan?” Sumagot ang babae, “Tumawid sila sa daluyan ng tubig.”[a] Hinanap sila ng mga tauhan, ngunit hindi sila natagpuan, kaya bumalik ang mga ito sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kabila ng sapa” o “sa kanal ng tubig.” Hindi pangkaraniwan ang pariralang Hebreo (מִיכַל הַמָּיִם), kaya hindi tiyak ang eksaktong uri o kahulugan ng daluyan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: mga tauhan ni Absalom
  rationale: Sa konteksto, tumutukoy ang עֶבֶד sa mga taong naglilingkod at kumikilos bilang mga ahente ni Absalom. Mas natural dito ang “mga tauhan” kaysa “mga alipin,” sapagkat hindi itinatampok ng talata ang kanilang legal na kalagayan.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה, ngunit ang tinutukoy rito ay ang babaeng nasa bahay na nabanggit sa konteksto; hindi mahalaga rito ang katayuan niya bilang asawa.
- source_word: הַבַּיְתָה
  choice: sa bahay
  rationale: Ipinahihiwatig ng hulaping paturol ang pagpunta patungo sa bahay. Ang “dumating sa bahay” ay natural sa Tagalog at hindi nagdaragdag ng tiyak na pahayag na pumasok sila sa loob.
- source_word: עָבְרוּ
  choice: Tumawid sila
  rationale: Karaniwang nangangahulugan ang עבר na dumaan o tumawid. Dahil kaugnay ito ng isang daluyan ng tubig, malinaw at likas ang “tumawid.”
- source_word: מִיכַל הַמָּיִם
  choice: sa daluyan ng tubig
  rationale: Hindi pangkaraniwan at may katiyakan ang eksaktong anyo o uri ng tubigan sa pariralang Hebreo. Ang “daluyan ng tubig” ay malapit sa posibleng kahulugan nang hindi labis na tinutukoy kung ito ay sapa, kanal, o ibang uri ng agos.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: Hinanap sila ng mga tauhan, ngunit hindi sila natagpuan
  rationale: Ang בקשׁ ay paghahanap sa mga tao sa kontekstong ito. Nilinaw ang mga di-binanggit na layon at simuno upang maiwasan ang kalituhan sa natural na Tagalog.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: kaya bumalik ang mga ito sa Jerusalem
  rationale: Ang שׁוב ay “bumalik.” Ang “kaya” ay natural na naghahayag ng bunga ng bigong paghahanap, at ang “mga ito” ay malinaw na tumutukoy sa mga tauhan ni Absalom.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tauhan” para sa mga ahente ni Absalom at nilinaw ang mga panghalip upang maging madaling sundan ang salaysay. Pinanatili sa talababa ang kawalang-katiyakan ng pambihirang pariralang Hebreo tungkol sa daluyan ng tubig.
