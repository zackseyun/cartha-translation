translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pahintulutan mo” at “hayaan mo” upang mapanatili ang anyo ng mungkahi o pakiusap sa magkakasunod na cohortative, samantalang ang “humayo” ay natural na nagpapahayag ng pagbangon upang kumilos.
