  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Ahitofel kay Absalom[a], “Pahintulutan mo akong pumili ng labindalawang libong lalaki, at hayaan mo akong humayo at habulin si David ngayong gabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na pagkakasalin: “Pakiusap, pipili ako ng labindalawang libong lalaki, at babangon ako at hahabulin ko si David sa gabing ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay. Likas sa makabagong Filipino ang “Pagkatapos” bilang panandang pasulong sa naratibo.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang Hebreo.
- source_word: אֶל־אַבְשָׁלֹם
  choice: kay Absalom
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong pinagsabihan.
- source_word: אֶבְחֲרָה נָּא
  choice: Pahintulutan mo akong pumili
  rationale: Ang cohortative na may נָא ay nagpapahayag ng magalang na pakiusap o mungkahi, hindi lamang payak na pahayag tungkol sa hinaharap.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: labindalawang libong lalaki
  rationale: Pinananatili ng “lalaki” ang karaniwang kahulugan ng אִישׁ nang hindi nagdaragdag ng mas tiyak na katawagang militar gaya ng “kawal.”
- source_word: וְאָקוּמָה
  choice: at hayaan mo akong humayo
  rationale: Literal na “bumangon” ang קוּם, ngunit sa kontekstong ito ay nagpapahiwatig ito ng pagtindig upang kumilos o umalis. Inihahatid ng “humayo” ang kilos sa natural at marangal na Filipino.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: at habulin si David
  rationale: Ang רדף kasunod ng אַחֲרֵי ay tumutukoy sa pagtugis. Sapat at natural sa Filipino ang “habulin si David,” nang hindi inuulit ang diwang “sa likuran.”
- source_word: הַלָּיְלָה
  choice: ngayong gabi
  rationale: Tumutukoy ang parirala sa kasalukuyang gabi; “ngayong gabi” ang malinaw at likas na katumbas sa modernong Filipino.
