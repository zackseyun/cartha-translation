translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tingnan ninyo” bilang natural na panawag-pansin, at pinili ang mga terminong militar na malinaw sa ordinaryong mambabasa habang pinananatili sa talababa ang leksikal na lawak ng פְּחָתִים at מַגֵּפָה.
