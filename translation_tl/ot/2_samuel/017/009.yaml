  to: Narito, ngayon ay nakakubli siya sa isa sa mga hukay[a] o sa ibang lugar. Kapag may ilan sa kanila na napatay sa unang sagupaan, sasabihin ng sinumang makarinig nito, ‘Nagkaroon ng matinding pagkatalo[b] sa mga taong nasa panig ni Absalom.’
