  text: הִנֵּ֨ה עַתָּ֤ה הֽוּא נֶחְבָּא֙ בְּ/אַחַ֣ת הַ/פְּחָתִ֔ים א֖וֹ בְּ/אַחַ֣ד הַ/מְּקוֹמֹ֑ת וְ/הָיָ֗ה כִּ/נְפֹ֤ל בָּ/הֶם֙ בַּ/תְּחִלָּ֔ה וְ/שָׁמַ֤ע הַ/שֹּׁמֵ֨עַ֙ וְ/אָמַ֔ר הָֽיְתָה֙ מַגֵּפָ֔ה בָּ/עָ֕ם אֲשֶׁ֖ר אַחֲרֵ֥י אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: tl
  text: Narito, ngayon ay nakakubli siya sa isa sa mga hukay[a] o sa ibang lugar. Kapag may ilan sa kanila na napatay sa unang sagupaan, sasabihin ng sinumang makarinig nito, ‘Nagkaroon ng matinding pagkatalo[b] sa mga taong nasa panig ni Absalom.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isa sa mga lubak.” Ang salitang Hebreo ay maaaring tumukoy sa mga hukay, lubog na bahagi ng lupa, o katulad na mapagtataguan sa lupain.
    reason: lexical_alternative
  - marker: b
    text: Ang “matinding pagkatalo” ay maaari ring isaling “pagkawasak” o “matinding dagok” sa mga nasa panig ni Absalom. Dito, ang salitang Hebreo ay tumutukoy sa matinding pagpuksa sa labanan, hindi sa salot na sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: Tingnan ninyo, sa ngayon
  rationale: Pinananatili ng panawagang “Tingnan ninyo” ang masiglang pagtawag-pansin ng הִנֵּה, at ipinahahayag ng “sa ngayon” ang agarang kalagayang tinutukoy ng עַתָּה.
- source_word: נֶחְבָּא
  choice: nagtatago siya
  rationale: Likas ito sa modernong Tagalog para sa kasalukuyang kalagayan ng pagiging nakakubli. Bagaman maaaring literal na “nakakubli,” hindi naman kailangang tukuyin kung sino ang nagkubli sa kaniya.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: sa isa sa mga hukay
  rationale: Ang פְּחָתִים ay maaaring tumukoy sa mga hukay o lubog na bahagi ng lupa na mapagtataguan; “hukay” ang tuwiran at madaling maunawaang katumbas.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: sa ibang lugar
  rationale: Ipinahahayag nito nang natural ang malawak at di-tiyak na alternatibong lugar na kasunod ng אוֹ.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: Kapag may ilan sa kanila na napatay sa unang pagsalakay
  rationale: Sa kontekstong militar, ang נפל ב ay tumutukoy sa mga bumagsak o nasawi sa pangkat. Nililinaw ng “sa unang pagsalakay” ang kahulugan ng בַּתְּחִלָּה bilang unang sagupaan.
- source_word: הַשֹּׁמֵעַ
  choice: sinumang makarinig nito
  rationale: Natural na ipinapahayag nito ang pangkalahatang di-tiyak na diwa ng articular participle.
- source_word: מַגֵּפָה
  choice: matinding pagkatalo
  rationale: Sa kontekstong ito, tumutukoy ang salita sa mabigat na dagok o pagkapuksa sa labanan, hindi sa salot na sakit. Pinananatili ng “matinding pagkatalo” ang militar na diwa nang hindi kinakailangang ipalagay na lubos na minasaker ang pangkat.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: mga tauhang sumusunod kay Absalom
  rationale: Ang אַחֲרֵי ay nagpapahiwatig dito ng katapatan at pagsunod sa pinuno. Ang “mga tauhan” ay angkop sa pangkat na militar/pampolitika sa konteksto.
