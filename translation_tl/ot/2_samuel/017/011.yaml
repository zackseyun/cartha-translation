  - severity: low
    issue: Maaaring pakinisin ang paghahambing na “sindami ... sa tabi ng dagat.”
    rationale: Mas natural sa makabagong Filipino ang “kasingdami ng buhangin sa tabing-dagat,” habang pinananatili ang diwang “gaya ng buhangin sa tabi ng dagat sa dami.”
