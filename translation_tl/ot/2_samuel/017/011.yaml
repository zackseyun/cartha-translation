base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: tl
  text: Ngunit ipinapayo ko na tiyak na tipunin sa iyo ang buong Israel, mula sa Dan hanggang sa Beer-seba, kasingdami ng buhangin sa tabing-dagat, at ikaw mismo ang manguna sa labanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at ang iyong mukha ay humahayo sa labanan,” isang idyomang nangangahulugang ikaw mismo ang personal na manguna sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ngunit
  rationale: Sa konteksto, ipinakikilala ng pang-ugnay ang salungat na payo ni Husai kapalit ng plano ni Ahitofel; natural na ipinahahayag ito ng “Ngunit.”
- source_word: יָעַצְתִּי
  choice: ipinapayo ko
  rationale: Ang pandiwang יעץ ay nangangahulugang magpayo; ang kasalukuyang anyo ay angkop sa mismong kilos ng pagpapayo sa talumpati.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: tiyak na tipunin
  rationale: Ang infinitive absolute kasunod ng finite verb ay nagbibigay-diin sa pagtitipon; pinananatili ng “tiyak na” ang mariing puwersa nito.
- source_word: עָלֶיךָ
  choice: sa iyo
  rationale: Kasama ng אסף, tumutukoy ito sa pagtitipon sa o sa paligid ng isang pinuno; “sa iyo” ang natural na Filipino.
- source_word: כָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili nito ang kolektibo at sumasaklaw-sa-lahat na diwa ng parirala.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: mula sa Dan hanggang sa Beer-seba
  rationale: Heograpikong merismo ito para sa buong saklaw ng Israel; pinananatili ang mga pangalang-pook.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: sindami ng buhangin sa tabi ng dagat
  rationale: Natural na Filipino itong naghahayag ng napakalaking bilang habang pinananatili ang larawan ng tekstong Hebreo.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: ikaw mismo ang manguna
  rationale: Literal na “at ang iyong mukha ay humahayo,” ngunit idiomatikong tumutukoy sa personal na paglahok ni Absalom; sa kontekstong militar, ipinahihiwatig na siya mismo ang nasa unahan.
- source_word: בַּקְרָב
  choice: sa labanan
  rationale: Ang קְרָב ay tumutukoy sa labanan o pakikipaglaban; malinaw at dignified ang “sa labanan.”
