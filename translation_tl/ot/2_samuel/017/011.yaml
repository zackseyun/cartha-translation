translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “tiyak na tipunin” upang mapanatili ang diin ng Hebreo, at ang idyomang “iyong mukha” ay isinalin ayon sa kahulugan ngunit ipinaliwanag sa talababa.
