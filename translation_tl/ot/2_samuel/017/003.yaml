  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: tl
  text: At ibabalik ko sa iyo ang buong bayan[a]; ang lalaking hinahanap mo ay gaya ng pagbabalik ng lahat. Magiging payapa ang buong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap unawain ang Hebreo; literal: “gaya ng pagbabalik ng lahat, ang lalaking hinahanap mo.” Malabo ang ugnayan ng mga salita. Malamang na ang diwa ay na kapag ang iisang lalaking hinahanap ay napangasiwaan, babalik ang lahat ng iba pa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: At ibabalik ko
  rationale: 'Ang anyong Hiphil ng שׁוב ay sanhi: pangyayarihin ng nagsasalita na makabalik ang bayan. Likas at tuwiran sa Tagalog ang “ibabalik ko.”'
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Ang עָם ay tumutukoy sa kabuuan ng mga tao bilang isang sambayanan. Hindi ito nilimitahan sa “hukbo,” sapagkat mas malawak ang salitang Hebreo.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Pinananatili ang payak na direksiyon ng pariralang Hebreo.
- source_word: כְּשׁוּב הַכֹּל
  choice: kapag bumalik ang lahat
  rationale: Ang Hebreo ay maikli, eliptikal, at mahirap ang sintaks. Ipinahahayag ng salin ang diwang pagbabalik ng lahat nang hindi ginagawang tahasang sanhi o kondisyon ang parirala.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: ang lalaking hinahanap mo
  rationale: Pinananatili ang tiyak at isahang “lalaki,” na sa konteksto ay si David, nang hindi inilalagay ang pangalan sa mismong teksto.
- source_word: יִהְיֶה שָׁלוֹם
  choice: magiging payapa
  rationale: Sa kontekstong pampolitika at pandigmaan, ang שָׁלוֹם ay kalagayan ng kapayapaan at katiwasayan. Natural sa modernong Tagalog ang “magiging payapa.”
theological_decisions:
- issue: Ang ipinahihiwatig na kahihinatnan para sa lalaking hinahanap
  choice: mawawala na
  alternative: mapapatay na
  rationale: Malinaw sa konteksto na balak patayin si David, ngunit hindi tahasang ginagamit sa talatang ito ang pandiwang “patayin.” Ang “mawawala na” ay nagpapanatili sa ipinahihiwatig na diwa nang hindi dinaragdagan ang mahirap at eliptikal na tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at madaling maunawaan. Ginamit ang “buong bayan” sa halip na mas makitid na “buong hukbo,” at nilagyan ng talababa ang mahirap at eliptikal na gitnang sugnay.
