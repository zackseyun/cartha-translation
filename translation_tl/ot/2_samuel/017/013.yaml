translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang marahas na eksaherasyon ng Hebreo nang hindi ito ipinapaliwanag sa mismong talata; inilagay sa talababa ang saklaw ng נחל at ang retorikal na lakas ng pangwakas na larawan.
