base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: tl
  text: At kung umurong siya patungo sa isang lunsod, magdadala ang buong Israel ng mga lubid sa lunsod na iyon, at kakaladkarin natin ito hanggang sa batis[a], hanggang wala nang matagpuan doon kahit isang maliit na bato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilog,” “tuyong daluyan ng tubig,” o “bangin.” Ang salitang Hebreo ay maaaring tumukoy sa isang pana-panahong daluyan ng tubig o bangin.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “kahit isang maliit na bato” ay isang eksaheradong larawan ng lubos na pagkawasak.
    reason: figurative_language
lexical_decisions:
- source_word: יֵאָסֵף
  choice: umatras siya papasok
  rationale: Ang Nifal ng אסף ay maaaring literal na ‘matipon,’ ngunit sa kontekstong militar ay tumutukoy sa pag-urong o pagkukubli ni David sa loob ng isang lunsod. Natural sa Filipino ang ‘umatras siya papasok.’
- source_word: וְהִשִּׂיאוּ
  choice: magdadala
  rationale: Kasama ang חבלים bilang layon, ipinahihiwatig nito ang pagdadala ng mga lubid patungo sa lunsod.
- source_word: חֲבָלִים
  choice: mga lubid
  rationale: Pinananatili nito ang konkretong larawan ng mga lubid na gagamitin sa marahas at eksaheradong paghila sa lunsod.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: kakaladkarin natin iyon
  rationale: Ang סחב ay ‘kaladkarin’ o ‘hatakin.’ Ang panghalip ay tumutukoy sa lunsod; ang ‘iyon’ ay natural at hindi malabo sa Filipino.
- source_word: הַנַּחַל
  choice: bangin ng ilog
  rationale: Ang נחל ay maaaring tumukoy sa batis, ilog, o tuyong/napapanahong daluyan sa isang bangin. Ang ‘bangin ng ilog’ ay mas madaling maunawaan kaysa sa hiram na ‘wadi’ habang pinananatili ang heograpikong larawan.
- source_word: גַּם צְרוֹר
  choice: kahit isang maliit na bato
  rationale: Ang צְרוֹר ay maliit na bato o batong-bilog; ang parirala ay eksaheradong larawan ng lubos na pagkawasak. Ang ‘kahit isang maliit na bato’ ay pormal ngunit natural.
