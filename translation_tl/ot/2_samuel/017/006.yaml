  naturalness: Natural at malinaw sa makabagong Filipino ang “Ganito ang sinabi ni Ahitofel,” “Gagawin ba natin ang kanyang sinabi?” at “ikaw ang magsalita.” Ang mga ito ay marangal ngunit hindi lipas na rehistro.
  terminology: Napananatili ang mga pangalang Husai, Absalom, at Ahitofel. Ang “kanyang sinabi” ay angkop na idiomatikong salin ng “kanyang salita,” habang itinatala ng talababa ang mas literal na anyo.
