base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: tl
  text: Nang dumating si Husai kay Absalom, sinabi ni Absalom sa kanya, “Ganito ang sinabi ni Ahitofel. Gagawin ba natin ang kanyang sinabi?[a] Kung hindi, ikaw ang magsalita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gagawin ba natin ang kanyang salita?” Mas literal sa Hebreo ang “gagawin ba natin ang kanyang salita?”; tumutukoy ito sa pagsasagawa ng mungkahi ni Ahitofel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Nang dumating
  rationale: Karaniwang nagsusulong ng salaysay ang wayyiqtol ng בוא; natural sa Tagalog ang “nang dumating” sa paglapit ni Husai kay Absalom.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Isina-Tagalog ang baybay ng pangalang Hebreo ayon sa karaniwang bigkas.
- source_word: אֶל אַבְשָׁלוֹם
  choice: kay Absalom
  rationale: Ang אֶל ay nagpapahayag ng patutunguhan; “kay” ang natural na pananda kapag tao ang nilalapitan.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: sinabi
  rationale: Hindi kailangang ulitin sa Tagalog ang literal na “sinabi ... na sinasabi”; sapat at natural ang isang pandiwa sa pagpapakilala ng tuwirang pananalita.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: Ganito ang ipinayo
  rationale: Tinutukoy ng parirala ang nilalaman o paraan ng naunang sinabi ni Ahitofel. Sa konteksto, ang kaniyang pananalita ay payo, kaya malinaw at likas ang “ipinayo” nang hindi dinaragdagan ang diwa.
- source_word: הֲנַעֲשֶׂה
  choice: Isasagawa ba natin
  rationale: Ang interrogative at unang panauhang maramihang imperfect ay deliberatibo. Ang “isasagawa ba natin” ay natural na tanong tungkol sa pagpapatupad ng panukala.
- source_word: אֶת דְּבָרוֹ
  choice: ang sinabi niya
  rationale: Literal itong “ang kaniyang salita,” ngunit sa konteksto ay tumutukoy sa ipinayo ni Ahitofel. Pinananatili ng “ang sinabi niya” ang lawak ng דָּבָר at ang idiomatikong kahulugan.
- source_word: אִם אַיִן
  choice: Kung hindi
  rationale: Maikli at natural na katumbas ng kondisyunal na pagsalungat.
- source_word: אַתָּה דַבֵּר
  choice: ikaw ang magsalita
  rationale: Ang tahasang panghalip na אַתָּה ay nagbibigay-diin kay Husai; pinananatili ito ng hulma na “ikaw ang.”
