translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “ipinayo” at “isasagawa” upang natural na maipahayag ang konteksto ng pagpapasya, samantalang inilagay sa talababa ang mas literal na Hebreong idyoma. Ang panandang [a] ay inilagay kaagad pagkatapos ng kaugnay na tanong.
