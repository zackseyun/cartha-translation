    issue: Malabo ang reperensiya ng “nito” sa “May balon sa bakuran nito.”
    rationale: Ang antecedent nito ay madaling basahing “bahay,” ngunit ang panghalip na pang-isahan sa Hebreo ay tumutukoy sa lalaking may-ari ng bahay. Dapat itong linawin nang hindi binabago ang kahulugan.
  - severity: low
    issue: Idinadagdag ng “umalis” ang isang kilos na hindi tahasang isinasaad.
    rationale: Sinasabi ng Hebreo na ang dalawa ay nagmadaling pumunta at dumating sa bahay. Maaaring ipahiwatig ng konteksto ang pag-alis, ngunit hindi kailangang ilagay ito sa pangunahing teksto.
