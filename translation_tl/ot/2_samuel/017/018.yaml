revisions:
- from: 'Ngunit nakita sila ng isang binata at ibinalita kay Absalom. Kaya dali-daling umalis silang dalawa at pumunta sa bahay ng isang lalaki sa Bahurim. May balon sa bakuran nito, at bumaba sila roon.[a]


    [a] O, “bumaba sila sa loob nito,” ibig sabihin, sa balon.'
  to: Ngunit nakita sila ng isang binata at ibinalita ito kay Absalom. Kaya nagmamadaling pumunta silang dalawa sa bahay ng isang lalaki sa Bahurim. May balon ang lalaking iyon sa kaniyang bakuran, at bumaba sila roon.[a]
  rationale: Nilinaw ang may-ari ng balon upang tumugma sa panghalip na tumutukoy sa lalaki sa Hebreo. Inalis ang “umalis,” na hindi tuwirang nakasaad, at pinanatili ang pagmamadali at ang tahasang pagtukoy na dalawa ang kumilos. Napanatili ang footnote anchor at ang maingat na implicit na “roon” sa pangunahing teksto.
