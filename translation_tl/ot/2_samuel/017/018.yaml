base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: tl
  text: Ngunit nakita sila ng isang binata at ibinalita ito kay Absalom. Kaya nagmamadaling pumunta silang dalawa sa bahay ng isang lalaki sa Bahurim. May balon ang lalaking iyon sa kaniyang bakuran, at bumaba sila roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bumaba sila sa loob nito,” ibig sabihin, sa balon.
    reason: Ipinakikita ang leksikal at referensiyal na alternatibo para sa וַיֵּרְדוּ שָׁם nang hindi inaalis ang bahagyang kalabuan ng pangunahing teksto.
lexical_decisions:
- source_word: נַעַר
  choice: binata
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki, kabataang lalaki, o lingkod. Ang “binata” ay natural sa modernong Tagalog at hindi tahasang nagpapasiya na siya ay isang lingkod.
- source_word: וַיַּגֵּד
  choice: ibinalita
  rationale: Ang Hifil ng נגד ay nangangahulugang magsabi o mag-ulat. Ang “ibinalita” ay angkop sa konteksto ng agarang pagpapaabot ng impormasyon kay Absalom.
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Tahasang ipinakikita ng Hebreo na dalawang tao ang tinutukoy; malinaw at natural itong naihahayag ng “silang dalawa.”
- source_word: מְהֵרָה
  choice: dali-daling
  rationale: Ipinahahayag nito ang pagmamadali. Pinananatili ng “dali-daling” ang agarang kilos sa isang likas na ekspresyong Tagalog.
- source_word: בֵּית אִישׁ
  choice: bahay ng isang lalaki
  rationale: Tuwirang inililipat nito ang construct phrase nang malinaw at natural sa Tagalog.
- source_word: בְּבַחוּרִים
  choice: sa Bahurim
  rationale: Ang Bahurim ay pangalan ng lugar; ang “sa” ang natural na panandang lokatibo sa Tagalog.
- source_word: בְאֵר
  choice: balon
  rationale: Karaniwang tumutukoy ang בְאֵר sa balon. Bagaman posible sa konteksto ang isang imbakan ng tubig, hindi kailangang lumihis sa pangunahing kahulugan.
- source_word: בַּחֲצֵרוֹ
  choice: sa bakuran nito
  rationale: Ang חָצֵר ay isang nakapaloob na lugar na kaugnay ng bahay. Mas karaniwan at madaling maunawaan sa modernong Tagalog ang “bakuran” kaysa “looban,” at malinaw ang reperensiya ng “nito” sa lalaki.
- source_word: וַיֵּרְדוּ שָׁם
  choice: bumaba sila roon
  rationale: Literal na “bumaba sila roon” ang Hebreo. Pinananatili nito ang bahagyang implicit na patutunguhan, habang ipinahihiwatig ng konteksto na sa balon sila bumaba.
