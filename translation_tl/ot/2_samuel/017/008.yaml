  naturalness: Natural at angkop ang kabuuang rehistro. Gayunman, ang “nagngingitngit ang kanilang kalooban” ay hindi karaniwang paraan sa modernong Filipino upang ilarawan ang disposisyon; mas karaniwang nauugnay ang “nagngingitngit” sa tunog o pagkiskis ng ngipin. Ang “mabagsik ang kanilang loob” ay mas natural at naghahatid ng mapanganib na tindi ng idyoma.
  terminology: Ang “magigiting,” “mga tauhan,” “mandirigma,” at “mga kawal” ay angkop sa kontekstong militar. Pinananatili ng talababa ang literal na imaheng “mapait ang kaluluwa” at hindi nito ikinukulong ang idyoma sa iisang pakahulugan.
