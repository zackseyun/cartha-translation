base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: tl
  text: 'Sinabi ni Husai, “Kilala mo ang iyong ama at ang kanyang mga tauhan: magigiting sila at mabagsik ang kanilang loob[a], gaya ng isang inahing oso sa parang na nawalan ng mga anak. Mandirigma ang iyong ama, at hindi siya magpapalipas ng gabi kasama ng mga kawal.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mapait ang kaluluwa”; isa itong idyoma na maaari ring mangahulugang “mababagsik,” “galit,” o “mapait ang loob.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kasama ng mga tao.” Sa kontekstong ito, malamang na ang “mga tao” ay ang hukbong kasama ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: magigiting
  rationale: Ipinahahayag nito ang lakas at tapang ng mga tauhan ni David sa kontekstong militar, nang hindi na inuulit ang “mga tauhan” bilang “mga mandirigma.”
- source_word: מָרֵי נֶפֶשׁ
  choice: nagngingitngit ang kanilang kalooban
  rationale: Natural itong Filipino para sa matindi, mapanganib, at galít na disposisyon. Pinananatili sa talababa ang literal na larawang Hebreo na “mapait ang kaluluwa/kalooban.”
- source_word: כְּדֹב שַׁכּוּל
  choice: gaya ng isang inahing oso ... na nawalan ng mga anak
  rationale: Malinaw nitong ipinahahayag ang pambabaeng oso at ang pagkawala ng mga anak na dahilan ng mabangis na pagkilos nito.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang “parang” ay natural na katumbas ng bukas na lupain o field sa larawang ito.
- source_word: אִישׁ מִלְחָמָה
  choice: Mandirigma
  rationale: Maikli at natural na Filipino para sa lalaking bihasa at sanay sa pakikidigma.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: hindi siya magpapalipas ng gabi kasama ng mga kawal
  rationale: Tumpak na ipinahahayag ng “magpapalipas ng gabi” ang לין; ang “mga kawal” ay umaangkop sa pangkat ni David sa kontekstong militar, habang binabanggit sa talababa ang mas literal na “mga tao.”
- source_word: יָדַעְתָּ
  choice: Kilala mo
  rationale: Sa Filipino, natural ang “kilala mo” kapag ang tinutukoy ay ang pagkakilala sa ugali at kakayahan ng isang tao at ng kanyang mga tauhan.
- source_word: אֲנָשָׁיו
  choice: ang kanyang mga tauhan
  rationale: Pinananatili nito ang pangkalahatang “his men” ngunit malinaw na tumutukoy sa mga kasamahan ni David.
