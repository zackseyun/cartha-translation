base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: tl
  text: Ngayon, magsugo kayo agad at sabihin kay David, ‘Huwag kang magpalipas ng gabi sa mga kapatagan ng ilang[a], at tiyakin mong tumawid ka, kung hindi ay baka malamon ang hari at ang lahat ng taong kasama niya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “sa mga tawiran sa ilang.” Ang salitang Hebreo ay karaniwang tumutukoy sa mga kapatagan o mabababang lupain, ngunit iniuugnay ito ng ilan sa tawiran dahil agad na iniutos kay David na tumawid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbing panandang diskurso na nag-uugnay sa naunang payo at nagpapakilala ng apurahang susunod na hakbang.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: magsugo agad kayo
  rationale: Ipinakikita ng maramihang pautos at ng מְהֵרָה ang agarang pagpapadala ng mga mensahero; likas at malinaw ito sa modernong Tagalog.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: at sabihin kay David
  rationale: Natural na Tagalog para sa pormulang Hebreo ng paghahatid ng mensahe; hindi na kailangang ulitin ang literal na ‘na sinasabi’.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Huwag kang magpalipas ng gabi
  rationale: Tumpak na ipinahahayag ang לון bilang pananatili o pagtulog sa isang lugar nang magdamag.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: sa mga kapatagan ng ilang
  rationale: Ang עֲרָבוֹת ay tumutukoy sa mga kapatagan o mabababang lupain; ito ang tuwirang pagbasa sa tekstong WLC. Inilalagay sa talababa ang alternatibong pagkaunawang nauugnay sa tawiran dahil sa konteksto.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: Sa halip, tiyakin mong tumawid ka
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa utos. Ang ‘tiyakin mong’ ay natural na paraan upang maipakita ang mariing puwersa nito.
- source_word: פֶּן
  choice: kung hindi ay baka
  rationale: Malinaw na naghahayag ng babala at posibleng masamang bunga sa kasalukuyang Tagalog.
- source_word: יְבֻלַּע
  choice: malamon
  rationale: Pinananatili ang matingkad na larawang Hebreo ng pagiging ‘nilamon,’ na sa kontekstong militar ay nagpapahiwatig ng lubusang pagkawasak o pagkalupig.
- source_word: לַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang titulong ginamit ng Hebreo sa halip na palitan ito ng pangalang David.
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: at ang buong bayang kasama niya
  rationale: Ang עָם ay mas malawak kaysa ‘mga kawal’; ang ‘buong bayan’ ay nagpapanatili sa kolektibong saklaw ng pangkat na kasama ni David.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang ‘kayo’ sa utos sa mga tagapaghatid at isahan na ‘ka’ sa mensaheng para kay David. Pinanatili ang matinding larawang ‘malamon’ at nilagyan ng talababa ang heograpikong alternatibo nang hindi pinapalitan ang pangunahing kahulugan ng tekstong Hebreo.
