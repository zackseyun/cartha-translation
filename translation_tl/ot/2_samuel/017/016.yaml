  to: Ngayon, magsugo kayo agad at sabihin kay David, ‘Huwag kang magpalipas ng gabi sa mga kapatagan ng ilang[a], at tiyakin mong tumawid ka, kung hindi ay baka malamon ang hari at ang lahat ng taong kasama niya.’
