  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: tl
  text: Nang makita ni Ahitofel na hindi isinagawa ang payo niya[a], siniyahan niya ang asno, tumindig, at pumunta sa kanyang bahay sa kanyang bayan. Nagbigay siya ng mga tagubilin sa kanyang sambahayan[b]. Pagkatapos, nagbigti siya[c] at namatay, at inilibing siya sa libingan ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “hindi sinunod ang payo niya.” Literal sa Hebreo: “hindi ginawa ang payo niya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “inayos niya ang mga gawain ng kanyang sambahayan.” Mas literal sa Hebreo: “nagbigay siya ng mga utos sa kanyang bahay/sambahayan.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sinakal niya ang sarili.” Ang pandiwa ay maaaring tumukoy sa pagkamatay sa pagbitin o sa pagsakal; sa konteksto, inilalarawan nito ang pagpapakamatay ni Ahitofel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: ang payo niya
  rationale: Ang עֵצָה ay maaaring tumukoy sa payo, panukala, o planong estratehiko. Likas sa modernong Tagalog ang “payo” at napananatili nito ang diwang pampulitika ng konteksto.
- source_word: נֶעֶשְׂתָה
  choice: hindi isinagawa
  rationale: Literal itong “hindi ginawa.” Ang “hindi isinagawa” ay natural na tumutukoy sa payong hindi ipinatupad nang hindi nililimitahan ang diwa sa simpleng hindi pakikinig.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: siniyahan niya ang asno
  rationale: Sa ganitong konteksto, ang חבש ay paghahanda sa asno para sakyan, karaniwang sa pamamagitan ng pagsisilya. Pinanatili ang tiyak na “ang asno” sapagkat walang hulaping paari sa Hebreo.
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Pinananatili nito ang hiwalay na sunod-sunod na kilos ng salaysay bago siya pumunta, sa halip na isama agad ang kahulugan sa “umalis.”
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: sa kanyang bahay sa kanyang bayan
  rationale: Ipinapahayag nito ang dalawang lokatibong sangkap ng Hebreo sa likas na ayos ng Tagalog. Ang עִיר ay maaaring lungsod o bayan; mas natural at hindi labis na tiyak dito ang “bayan.”
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: Nagbigay siya ng mga tagubilin sa kanyang sambahayan
  rationale: Malapit ito sa tahasang pahayag na nag-utos o nagbilin siya sa kanyang bahay/sambahayan. Hindi nito tahimik na ipinapalit ang mas interpretatibong idyomang “inayos niya ang kanyang mga gawain.”
- source_word: וַיֵּחָנַק
  choice: nagbigti siya
  rationale: Ang anyo ay nauunawaang reflexive sa konteksto ng pagpapakamatay. Ang “nagbigti” ang natural na Tagalog para sa pagkitil sa sarili sa pamamagitan ng pagbitin, habang inilalahad sa talababa ang posibleng diwang pagsakal.
- source_word: בְּקֶבֶר אָבִיו
  choice: sa libingan ng kanyang ama
  rationale: Ang קֶבֶר ay libingan o puntod. Ang “libingan” ay dignified at sapat na malawak, at pinananatili ang tahasang pagtukoy sa kanyang ama.
theological_decisions:
- issue: Paraan at ahensiya ng pagkamatay ni Ahitofel
  choice: nagbigti siya
  alternative: sinakal niya ang sarili / siya ay nabigti
  rationale: Ipinahihiwatig ng konteksto na kusa niyang ginawa ito, ngunit ang ugat na חנק ay maaaring tumukoy sa pagkasakal o pagkamatay sa pagbitin. Pinili ang natural na pangunahing salin at pinanatili sa talababa ang leksikal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang himig. Ginamit ang “sambahayan” upang saklawin ang mga tao at mga gawaing nasa ilalim ng kanyang bahay, at iniwasan ang masyadong kolokyal o denominasyonal na pananalita.
