  text: Israel and Absalom camped in the land of Gilead.
translation:
  language: tl
  text: Nagkampo ang Israel at si Absalom sa lupain ng Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: Nagkampo
  rationale: Ang pandiwang חנה sa anyong wayyiqtol ay tumutukoy sa pagtatayo o pananatili sa kampo. Likas at malinaw sa modernong Tagalog ang “nagkampo,” at angkop ito sa kontekstong militar.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Ginagamit dito ang “Israel” bilang pangkalahatang tawag sa mga Israelitang hukbo na kasama ni Absalom. Pinananatili ang pambansang pangalan ayon sa Hebreo sa halip na tahasang idagdag ang “hukbo.”
- source_word: וְאַבְשָׁלֹם
  choice: at si Absalom
  rationale: Iniuugnay ng וְ si Absalom sa Israel bilang magkasamang simuno. Ang “si” ay kailangan sa natural na Tagalog para sa personal na pangalan.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Ang אֶרֶץ na sinusundan ng pangalang-heograpiko ay nangangahulugang lupain o nasasakupan nito. Ang “lupain ng Gilead” ay malinaw at tapat sa anyo ng Hebreo.
