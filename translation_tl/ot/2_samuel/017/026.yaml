translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang kolektibong “Israel” at hindi idinagdag sa teksto ang paliwanag na tumutukoy ito sa mga hukbong kakampi ni Absalom.
