base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Absalom, “Pakisuyong tawagin din si Husai na Arkita, at pakinggan natin kung ano ang masasabi rin niya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos ay sinabi” ang pagkakasunod-sunod ng pangyayari.
- source_word: קְרָא נָא
  choice: Pakisuyong tawagin
  rationale: Ang pautos na may נָא ay may magalang na himig ng pakiusap; malinaw at likas ito sa modernong Tagalog.
- source_word: גַּם
  choice: din
  rationale: Ipinakikitang si Husai ay isa pang tagapayo na tatawagin bukod kay Ahitofel.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai na Arkita
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang pantangi at ang katawagang tumutukoy sa pinagmulan o angkan niya.
- source_word: וְנִשְׁמְעָה
  choice: at pakinggan natin
  rationale: Ang cohortative na unang panauhang maramihan ay nagpapahayag ng mungkahi o sama-samang pagpapasiya; ang “pakinggan natin” ang likas na katumbas.
- source_word: מַה בְּפִיו
  choice: kung ano ... ang masasabi niya
  rationale: Ang literal na “kung ano ang nasa bibig niya” ay isang idyoma para sa sasabihin o ipapanukala ng isang tao; inihahatid ng salin ang kahulugan nang natural.
- source_word: גַּם הוּא
  choice: rin ... niya
  rationale: Pinananatili ng “rin” ang diin na dapat ding marinig ang sasabihin ni Husai bilang karagdagang tagapayo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Pakisuyong” upang mapanatili ang magalang na pakiusap, at “Arkita” bilang natural na Filipino na anyo ng gentilic.
