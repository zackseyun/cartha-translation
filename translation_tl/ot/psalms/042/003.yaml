  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: tl
  text: Ang mga luha ko ang naging tinapay ko araw at gabi[a], habang sinasabi nila sa akin buong araw, “Nasaan ang Diyos mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang luha ko ang naging tinapay ko,” yamang maaaring kolektibo ang gamit ng anyong isahan sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: ang naging … ko
  rationale: Ipinapahayag ng היה + ל kung ano ang naging kalagayan o nagsilbing bagay para sa nagsasalita; natural sa Filipino ang balangkas na “ang naging … ko.”
- source_word: דִמְעָתִי
  choice: mga luha ko
  rationale: Bagaman anyong isahan sa Hebreo, maaari itong gamiting kolektibo; ang maramihang “mga luha” ang natural sa konteksto ng patuloy na pagtangis.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Pinananatili ang kongkretong metapora ng Hebreo sa halip na gawing pangkalahatang “pagkain.”
- source_word: יוֹמָם וָלָיְלָה
  choice: araw at gabi
  rationale: Natural at maikli itong katumbas ng merismong tumutukoy sa walang tigil na tagal.
- source_word: בֶּאֱמֹר
  choice: habang sinasabi nila
  rationale: Ang ב na may infinitive construct ay nagpapahiwatig ng kasabay na kilos; ipinakikita ng “habang” na nagpapatuloy ang panunuya kasabay ng pagluha.
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang ipinahahayag nito ang direksiyon ng kanilang pagsasalita sa salmista.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Karaniwang modernong Filipino ito para sa paulit-ulit o tuloy-tuloy na kilos sa maghapon.
- source_word: אַיֵּה
  choice: Nasaan
  rationale: Tuwiran at mariing tanong ito hinggil sa kinaroroonan o tila kawalan ng Diyos.
- source_word: אֱלֹהֶיךָ
  choice: ang Diyos mo
  rationale: Ang hulapi ay ikalawang panauhang panlalaking isahan; ang “Diyos” ay tumutukoy sa kinikilalang Diyos ng salmista.
theological_decisions:
- issue: Kalikasan ng tanong ng mga nanunuya
  choice: “Nasaan ang Diyos mo?” bilang tuwirang panunuya tungkol sa tila kawalan ng Diyos
  alternative: “Ano na ang nangyari sa Diyos mo?”
  rationale: Tuwirang nagtatanong ang Hebreo kung nasaan ang Diyos. Pinananatili nito ang tensiyon ng tila hindi pagharap o pagtulong ng Diyos nang hindi dinaragdagan ang pahiwatig ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matingkad na metaporang “tinapay” at ang tuwirang panunuyang “Nasaan ang Diyos mo?”
