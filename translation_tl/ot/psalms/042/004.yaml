  to: 'Naaalala ko ang mga bagay na ito at ibinubuhos ko ang aking kalooban: kung paanong dati akong sumasama kasama ng pulutong[a] at inaakay sila[b] patungo sa bahay ng Diyos, sa gitna ng mga sigaw ng galak at pasasalamat—isang malaking pulutong na nagdiriwang.'
