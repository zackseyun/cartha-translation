  terminology: Ang “kalooban,” “bahay ng Diyos,” “sigaw ng galak,” at “pasasalamat” ay angkop sa modernong Filipino Tagalog at sa matayog na rehistro ng salmo. Ang “malaking pulutong na nagdiriwang” ay malinaw na katumbas ng festal multitude.
