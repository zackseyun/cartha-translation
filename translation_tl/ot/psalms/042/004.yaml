  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “pulutong” at “bahay ng Diyos” upang mapanatili ang larawan ng sama-samang paglalakbay sa kapistahan. Inilipat ang mga pananda ng talababa sa mismong mga salitang may leksikal na kawalang-katiyakan.
