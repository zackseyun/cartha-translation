base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: tl
  text: 'Naaalala ko ang mga bagay na ito at ibinubuhos ko ang aking kalooban: kung paanong dati akong sumasama kasama ng pulutong[a] at inaakay sila[b] patungo sa bahay ng Diyos, sa gitna ng mga sigaw ng galak at pasasalamat—isang malaking pulutong na nagdiriwang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama sa prusisyon.” Mahirap tiyakin ang kahulugan ng Hebreong בַּסָּךְ; maaaring tumukoy ito sa nagkakatipong pulutong sa kapistahan o sa pangkat na nagpuprusisyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ginagabayan sila” o “sumasabay sa kanila.” Bihira ang Hebreong pandiwang אֶדַּדֵּם, kaya hindi tiyak ang eksaktong diwa nito, bagaman malinaw sa konteksto na sama-sama silang patungo sa bahay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: Naaalala ko ang mga bagay na ito
  rationale: Pinananatili ang maramihang panturo at ang mapagnilay na puwersa ng pandiwa sa kasalukuyang paggunita.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: habang ibinubuhos ko ang aking kalooban
  rationale: Ang literal na larawan ay pagbubuhos ng sariling נֶפֶשׁ; ang “kalooban” ay likas at marangal sa modernong Tagalog para sa panloob na sarili at damdamin, nang hindi ito nililimitahan sa “dalamhati” lamang.
- source_word: כִּי אֶעֱבֹר
  choice: kung paanong dati akong sumasama
  rationale: Ang כִּי ay nagpapakilala sa nilalaman ng alaala, at ang imperfect ay ipinahayag bilang nakagawiang kilos noon.
- source_word: בַּסָּךְ
  choice: sa pulutong
  rationale: Mahirap ang pambihirang pangngalan; sa konteksto, malamang na tumutukoy ito sa nagkakatipong pangkat o prusisyon patungo sa templo. Hindi isinama sa pangunahing teksto ang hindi gaanong malamang na kahulugang “silungan.”
- source_word: אֶדַּדֵּם
  choice: inaakay sila
  rationale: Ang bihirang pandiwa at hulaping maramihan ay malamang na nagsasaad ng pag-akay sa kanila, ngunit pinananatili sa talababa ang posibilidad na simpleng pagsama o paggabay ang diwa.
- source_word: עַד בֵּית אֱלֹהִים
  choice: patungo sa bahay ng Diyos
  rationale: Natural na pahayag sa Tagalog para sa direksiyong tungo sa pook ng pagsamba, habang pinananatili ang literal na “bahay ng Diyos.”
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: sa gitna ng mga sigaw ng galak at pasasalamat
  rationale: Ipinahahayag ang naririnig at masiglang kapaligiran ng pagdiriwang; ang רִנָּה ay mas malakas kaysa tahimik na kagalakan.
- source_word: הָמוֹן חוֹגֵג
  choice: isang malaking pulutong na nagdiriwang
  rationale: Malinaw at likas na Tagalog para sa napakaraming taong nagdiriwang ng kapistahan, nang hindi nawawala ang kolektibo at pistal na diwa.
