    issue: Di-gaanong angkop na pandiwa sa “inuutusan ... ang kanyang tapat na pag-ibig”
    rationale: Sa karaniwang Filipino, ang “inuutusan” ay madalas na may taong o nilalang na pinauutusang kumilos. Ang “iniuutos” ay mas tuwirang katumbas ng ‘commands/ordains’ kapag ang iniutos ang siyang layon, at pinananatili nito ang matalinghagang puwersa ng Hebreong יְצַוֶּה.
  - severity: low
    issue: “Sa araw” ay maaaring tumukoy sa isang tiyak na araw
    rationale: Ang יוֹמָם ay pang-abay na ‘by day/daytime.’ Ang “Sa maghapon” ay mas idiomatiko bilang katapat ng “sa gabi” at hindi nagpapahiwatig ng isang partikular na araw.
