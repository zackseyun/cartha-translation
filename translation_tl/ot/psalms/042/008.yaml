base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: tl
  text: Sa maghapon ay iniuutos ni Yahweh ang kanyang tapat na pag-ibig; at sa gabi, kasama ko ang kanyang awit[b]—isang panalangin sa Diyos ng buhay ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Diyos na nagbibigay sa akin ng buhay.” Mas literal sa Hebreo ang “sa Diyos ng buhay ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang awit sa kanya ang kasama ko,” kung ang שירה ay uunawaing walang hulaping paari; sinusunod ng pangunahing teksto ang pagbasa na “ang kanyang awit.”
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם
  choice: Sa araw
  rationale: Pang-abay na tumutukoy sa panahon; maikli at natural itong katambal ng “sa gabi.”
- source_word: יְצַוֶּה
  choice: inuutusan
  rationale: Pinananatili ang masigla at makatang larawang si Yahweh mismo ang nag-uutos o nagsusugo sa kanyang pag-ibig, sa halip na pahinain ito bilang simpleng pagkakaloob.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Ipinahahayag ang matibay, maaasahan, at may katapatang pag-ibig na saklaw ng חֶסֶד nang hindi ito nililimitahan sa awa lamang.
- source_word: וּבַלַּיְלָה
  choice: at sa gabi
  rationale: Pinananatili ang payak na pang-ugnay at ang pagtutumbas ng araw at gabi.
- source_word: שירה
  choice: ang kanyang awit
  rationale: Sinusunod ang pagbasa na tumutukoy sa awit bilang kanya, na kaagapay ng “kanyang tapat na pag-ibig”; kinikilala sa talababa ang ibang posibleng pagbasa.
- source_word: עִמִּי
  choice: kasama ko
  rationale: Likas na Filipino para sa diwang ang awit ay nananatiling kapiling ng salmista.
- source_word: תְּפִלָּה
  choice: isang panalangin
  rationale: 'Itinuturing na paglalarawan sa naunang “awit”: ang awit na kasama niya ay isang panalanging inihaharap sa Diyos.'
- source_word: לְאֵל
  choice: sa Diyos
  rationale: Ipinapakita ng “sa” ang patutunguhan o pinatutungkulan ng panalangin.
- source_word: חַיָּי
  choice: ng buhay ko
  rationale: Pinananatili ang Hebreong pariralang paari at hindi ito ipinagkakamaling “buhay na Diyos” o tahasang binibigyang-kahulugang “nagbibigay-buhay.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa isang karaniwang titulo.
- issue: Kahulugan ng לְאֵל חַיָּי
  choice: sa Diyos ng buhay ko
  alternative: sa Diyos na nagbibigay sa akin ng buhay; sa buhay na Diyos
  rationale: Ang חַיָּי ay may hulaping unang panauhan at nangangahulugang “buhay ko,” hindi pang-uring “buhay” na naglalarawan sa Diyos. Pinananatili ng pangunahing teksto ang bukas na ugnayang ipinahihiwatig ng pariralang Hebreo.
- issue: Ugnayan ng שירה sa Diyos
  choice: ang kanyang awit
  alternative: isang awit sa kanya
  rationale: Sinusunod ng pangunahing teksto ang tradisyonal at kontekstuwal na pagbasa na ang awit ay sa Diyos o nagmumula sa kanya, ngunit hindi itinatago ang tunay na alternatibong pagsusuri ng anyo.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na balangkas at malinaw na pagtutumbas ng araw at gabi. Sadyang pinanatili ang matapang na personipikasyon sa “inuutusan … ang kanyang tapat na pag-ibig” at ang bahagyang palaisipang “Diyos ng buhay ko,” sa halip na ipaliwanag ang mga ito sa loob ng pangunahing teksto.
