revisions:
- from: Sa araw, inuutusan ni Yahweh ang kanyang tapat na pag-ibig; at sa gabi, kasama ko ang kanyang awit[b]—isang panalangin sa Diyos ng buhay ko.[a]
  to: Sa maghapon ay iniuutos ni Yahweh ang kanyang tapat na pag-ibig; at sa gabi, kasama ko ang kanyang awit[b]—isang panalangin sa Diyos ng buhay ko.[a]
  rationale: Inayos lamang ang pang-abay na pangpanahon at ang anyo ng pandiwa upang maging mas likas at tumpak sa modernong Filipino. Hindi binago ang kahulugan, ang personipikasyon ng tapat na pag-ibig, ang pagpili sa banal na pangalang Yahweh, o ang sinasadyang bukas na diwa ng “Diyos ng buhay ko.”
