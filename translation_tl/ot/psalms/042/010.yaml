  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: tl
  text: Para bang dinudurog ang aking mga buto[a], nilalait ako ng mga kaaway ko; buong araw nila akong sinasabihan, “Nasaan ang iyong Diyos?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Para bang nakamamatay na sugat sa aking mga buto” o “May pagpatay sa aking mga buto.” Mahirap unawain ang larawang Hebreo; maaari itong magpahayag ng nakamamatay na sugat o ng napakatinding kirot na wari’y dumudurog sa kaloob-looban.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח בְּעַצְמוֹתַי
  choice: Parang dinudurog ang aking mga buto
  rationale: Bagaman ang רֶצַח ay karaniwang tumutukoy sa pagpatay, mahirap ang larawang patula rito. Ang saling ito ay nagpapanatili sa marahas at matinding kirot na wari'y umaabot sa mga buto, nang hindi ito ipinakahulugang literal na pagpatay.
- source_word: חֵרְפוּנִי
  choice: nilalait ako
  rationale: Ipinahahayag ng חרף ang paghamak o mapanuyang pananalita. Ang “nilalait” ay natural sa modernong Tagalog at angkop sa kasunod na tuwirang panunuya.
- source_word: צוֹרְרָי
  choice: aking mga kaaway
  rationale: Tumutukoy ito sa mga taong kumakalaban sa mang-aawit. Malinaw, karaniwan, at marangal ang “mga kaaway” sa Tagalog.
- source_word: בְּאָמְרָם אֵלַי כָּל הַיּוֹם
  choice: buong araw na sinasabi sa akin
  rationale: Pinananatili nito ang direksiyon ng pananalita at ang patuloy o paulit-ulit na pagtuya sa buong maghapon.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Nasaan ang iyong Diyos?
  rationale: Tuwirang pinananatili ang mapanuyang tanong at ang tensiyon tungkol sa waring kawalan ng tulong ng Diyos, nang walang idinagdag na paliwanag.
theological_decisions:
- issue: Ang hamon ng mga kaaway tungkol sa Diyos
  choice: Nasaan ang iyong Diyos?
  alternative: Nasaan na ang iyong Diyos?
  rationale: Ang payak na “Nasaan” ay mas malapit sa Hebreo at hindi nagdaragdag ng partikulang maaaring magpalakas o magtakda ng isang tiyak na himig. Nananatiling bukas ang bigat ng mapanuyang hamon at ng panaghoy.
translation_notes:
  register: Makabago at dignified na Tagalog, na may payak na bokabularyong madaling maunawaan. Pinanatili ang matinding larawang patula at ang tuwirang panunuya nang hindi nilulutas ang teolohikal na tensiyon.
