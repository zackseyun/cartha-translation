  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: tl
  text: Nauuhaw ang kaluluwa ko sa Diyos, sa buháy na Diyos. Kailan ako pupunta at haharap sa Diyos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang mukha ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: nauuhaw
  rationale: Pinananatili nito ang kongkretong talinghaga ng pagkauhaw at likas itong nagpapahayag ng patuloy na pananabik sa konteksto.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Pinananatili nito ang Hebreong idyoma at ang diin sa buong panloob na pagkatao, sa halip na payak na gawing “ako.”
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Sa talinghaga ng pagkauhaw, natural sa Filipino ang “nauuhaw sa Diyos” bilang pagpapahayag ng matinding pananabik sa kaniya.
- source_word: לְאֵל חָי
  choice: sa buháy na Diyos
  rationale: Likas at malinaw nitong isinasalin ang tiyak na katawagang “ang Diyos na buháy”; ginamit ang tuldik upang luminaw ang bigkas at kahulugan.
- source_word: מָתַי
  choice: Kailan
  rationale: Tuwirang pinananatili ang tanong tungkol sa panahon nang hindi idinaragdag ang di-hayag na “hanggang kailan.”
- source_word: אָבוֹא
  choice: makapupunta
  rationale: Ipinahahayag nito ang inaasam na pagpunta sa presensiya ng Diyos, na angkop sa konteksto ng pagsamba o paglalakbay sa santuwaryo.
- source_word: וְאֵרָאֶה
  choice: at haharap
  rationale: Ang Niphal na anyo ay inuunawang “magpakita/humarap,” hindi “makakita.” Natural sa Filipino ang “haharap sa Diyos” para sa paglapit sa kaniyang presensiya.
- source_word: פְּנֵי אֱלֹהִים
  choice: sa Diyos
  rationale: Sa pariralang “haharap sa Diyos,” naipahahayag ang idyomatikong kahulugan ng pagharap sa presensiya ng Diyos; inilagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang פְּנֵי אֱלֹהִים
  choice: haharap sa Diyos
  alternative: haharap sa mukha ng Diyos
  rationale: Ipinahahayag ng talata ang pananabik na makalapit sa presensiya ng Diyos, malamang sa pagsamba. Iniiwasan ng saling ito ang di-likas na pananalita at hindi nito ipinapalagay na tinutukoy ang pisikal na pagkakita sa Diyos, habang pinananatili sa talababa ang literal na larawan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang matinding talinghaga ng pagkauhaw at ang katawagang “buháy na Diyos,” habang ginawang likas sa Filipino ang idyoma ng pagharap sa presensiya ng Diyos.
