base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: tl
  text: Bakit ka nanlulumo, O kaluluwa ko, at bakit ka nababagabag sa loob ko? Umasa ka sa Diyos, sapagkat pupurihin ko pa siya, ang aking Diyos na tumutulong upang maitaas ang aking mukha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga kaligtasan ng aking mukha.” Isa itong siksik na idyomang Hebreo; maaaring tumukoy sa pagliligtas o tulong ng Diyos na nag-aangat sa mukhang lugmok.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: ka nanlulumo
  rationale: Ipinahahayag nito ang pagiging nakayuko o lugmok dahil sa matinding kalungkutan; natural sa modernong Tagalog ang “nanlulumo” habang pinananatili ang damdaming patula.
- source_word: נַפְשִׁי
  choice: O kaluluwa ko
  rationale: Ang salitang נֶפֶשׁ ay tumutukoy rito sa panloob na sarili na kinakausap ng salmista; pinananatili ng “kaluluwa ko” ang introspektibo at patulang himig.
- source_word: תֶּהֱמִי
  choice: ka nababagabag
  rationale: Saklaw ng pandiwa ang pag-ugong, pagkabalisa, o matinding kaguluhan; malinaw na ipinahahayag ng “nababagabag” ang panloob na ligalig.
- source_word: עָלָי
  choice: sa loob ko
  rationale: Bagaman literal na “sa ibabaw ko,” idiomatiko itong tumutukoy sa ligalig na nararanasan sa kalooban ng nagsasalita.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Umasa ka sa Diyos
  rationale: Ang utos ay nagsasaad ng paghihintay na may pag-asa at pagtitiwala; ang “umasa” ay maikli, natural, at angkop sa panawagan sa sarili.
- source_word: עוֹד אוֹדֶנּוּ
  choice: muli ko pa siyang pupurihin
  rationale: Ipinahahayag ng עוֹד ang inaasahang pagpapatuloy o pagbabalik ng pagpupuri sa kabila ng kasalukuyang dalamhati.
- source_word: יְשׁוּעוֹת פָּנַי
  choice: ang kaligtasan ng aking mukha
  rationale: Pinananatili ang siksik at konkretong larawan ng Hebreo sa pangunahing teksto sa halip na tahimik na ipaliwanag ito; nililinaw sa talababa ang posibleng idiomatikong diwa.
- source_word: וֵאלֹהָי
  choice: at ang aking Diyos
  rationale: Pinananatili ang payak na pang-ugnay at ang marubdob na personal na pagtatapat sa hulihan ng talata.
theological_decisions:
- issue: Pagpapakahulugan sa יְשׁוּעוֹת פָּנַי
  choice: ang kaligtasan ng aking mukha
  alternative: ang tumutulong upang maitaas kong muli ang aking mukha; ang kaligtasan ng aking anyo
  rationale: Malabo at masinsin ang pariralang Hebreo. Pinananatili ng pangunahing teksto ang literal na imahen at ang teolohikal na tensiyon na ang Diyos ang kaligtasang nag-aalis ng panlulumo sa mukha; ang idiomatikong paliwanag ay inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Ginamit ang “O kaluluwa ko” para sa tuwirang pakikipag-usap sa sarili, at iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
