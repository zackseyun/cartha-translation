  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: tl
  text: 'Sinasabi ko sa Diyos, ang aking bato,


    “Bakit mo ako kinalimutan?


    Bakit ako naglalakad na nagdadalamhati[a]


    sa ilalim ng pang-aapi ng kaaway?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bakit ako naglalakad na nanlulumo sa ilalim ng pang-aapi ng kaaway?”
    reason: Maaaring ilarawan ng קֹדֵר ang pagdadalamhati o ang madilim at nanlulumong kalagayan.
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Sinasabi ko
  rationale: Ang Qal cohortative na unang panauhan ay maaaring magpahayag ng pasiya o agarang pagsasalita. Ang “Sinasabi ko” ay natural na pambungad sa tuwirang hinaing at hindi isinasara ang bahagyang volitibong himig.
- source_word: לְאֵל
  choice: sa Diyos
  rationale: Ang אֵל ay karaniwang katawagan sa Diyos sa kontekstong ito, hindi pangalang pantangi.
- source_word: סַלְעִי
  choice: ang aking Bato
  rationale: Pinananatili ang kongkretong metapora ng matatag na kanlungan sa halip na ipaliwanag lamang bilang “aking kanlungan.” Ginamit ang malaking titik bilang marangal na pantukoy sa Diyos, hindi bilang hiwalay na pangalang pantangi.
- source_word: שְׁכַחְתָּנִי
  choice: mo ako kinalimutan
  rationale: Tuwirang ipinapahayag ng perpektong pandiwa ang hinaing na waring kinalimutan siya ng Diyos; hindi ito pinalambot bilang simpleng pakiramdam at hindi rin pinalakas tungo sa “pinabayaan.”
- source_word: קֹדֵר
  choice: nagdadalamhati
  rationale: Maaaring tumukoy ang participle sa pagiging madilim o malungkot at, sa konteksto ng panaghoy, sa pagdadalamhati. Ang “nagdadalamhati” ay malinaw at marangal sa modernong Filipino, habang inilalagay sa talababa ang alternatibong “nanlulumo.”
- source_word: אֵלֵךְ
  choice: ako naglalakad
  rationale: Pinananatili ang larawang “lumakad” ng הלך at ipinahihiwatig ng aspektong Filipino ang nagpapatuloy na kalagayan.
- source_word: בְּלַחַץ
  choice: sa ilalim ng pang-aapi
  rationale: Ang לַחַץ ay panggigipit o pang-aapi. Ipinahahayag ng “sa ilalim ng” ang mabigat na kalagayang dulot ng kaaway nang hindi labis na nililinaw kung pangyayari o sanhi ang gamit ng pang-ukol.
- source_word: אוֹיֵב
  choice: ng kaaway
  rationale: Ang isahang anyo ay maaaring indibidwal, pangkalahatan, o kolektibong katawagan. Natural sa Filipino ang “kaaway” at pinananatili nito ang di-tiyak na bilang.
theological_decisions:
- issue: Metaporikal na katawagan sa Diyos na סַלְעִי
  choice: ang aking Bato
  alternative: ang aking kanlungan; ang aking malaking bato
  rationale: Pinananatili ang metapora ng Diyos bilang matatag na bato sa halip na palitan ito ng pagpapakahulugan, kaya nananatili ang poetikong at teolohikal na larawan.
- issue: Hinaing na kinalimutan ng Diyos ang salmista
  choice: Bakit mo ako kinalimutan?
  alternative: Bakit tila kinalimutan mo ako?
  rationale: Walang “tila” sa Hebreo. Pinananatili ang matapang na pananalita ng tapat na panaghoy at ang teolohikal na tensiyon nito nang hindi ipinapalagay na literal na walang alam o malasakit ang Diyos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong patula sa maiikling linya, ang tuwirang tanong ng panaghoy, at ang metaporang “Bato.”
