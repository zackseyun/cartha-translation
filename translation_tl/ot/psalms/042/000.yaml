translation:
  language: tl
  text: Para sa tagapanguna ng mga mang-aawit.[a] Isang Maskil[b] ng mga anak ni Korah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa tagapanguna ng mga mang-aawit.” Ang pang-ukol sa Hebreo ay maaaring isalin sa alinman sa dalawang paraan sa mga pamagat ng Awit.
    reason: alternative_reading
  - marker: b
    text: Ang “Maskil” ay isang teknikal na termino sa mga pamagat ng Awit. Hindi tiyak ang eksaktong kahulugan nito; kabilang sa mga mungkahi ang “awit na mapagnilay” o “akdang nagtuturo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “para sa mga anak ni Korah.” Maaaring ipahiwatig ng pamagat ang pagkakatha, kaugnayan, o ang mga nilalayong umawit o tumugtog nito.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Sa mga pamagat ng Awit, karaniwang tumutukoy ang salita sa namamahala sa musika o pag-awit. Likas sa modernong Filipino ang pariralang ito at pinananatili ng “Para sa” ang malamang na diwang patungkol sa pinag-ukulan, habang kinikilala sa talababa ang maaari ring pagbasa.
- source_word: מַשְׂכִּיל
  choice: Isang Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan ng teknikal na terminong ito sa mga pamagat ng Awit. Pinanatili ang transliterasyon upang hindi ipilit ang mga mungkahing kahulugang gaya ng mapagnilay o nagtuturo.
- source_word: לִבְנֵי
  choice: ng mga anak ni
  rationale: Maaaring magpahiwatig ang pang-ukol ng pagkakatha, kaugnayan, pag-aari, o pagtatalaga sa mga tagaganap. Malawak at hindi labis na mapagpasya ang “ng mga anak ni,” at inilalahad sa talababa ang alternatibong “para sa.”
- source_word: קֹרַח
  choice: Korah
  rationale: Isinalin sa karaniwang anyong transliterado ang pangalang pantangi.
