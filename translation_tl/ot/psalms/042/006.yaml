base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: tl
  text: Diyos ko, ang aking kaluluwa ay nanlulumo sa loob ko; kaya inaalaala kita[c] mula sa lupain ng Jordan at sa mga Hermon[a], mula sa Bundok Mizar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nasa anyong maramihan sa Hebreo ang “mga Hermon,” marahil ay tumutukoy sa kabundukan o sa mga taluktok ng Hermon.
    reason: lexical_alternative
  - marker: b
    text: Ang “Bundok Mizar” ay maaaring pangalan ng isang pook; maaari rin itong isaling “munting bundok” o “burol ng Mizar.”
    reason: lexical_alternative
  - marker: c
    text: O “kaya aalalahanin kita.” Maaaring ipahayag ng pandiwang Hebreo ang kasalukuyang kapasiyahan o isang kilos sa hinaharap ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang inililipat ang pangngalang may hulaping unang panauhan; maaari rin itong basahin bilang tuwirang pagtawag sa Diyos nang hindi nagdaragdag ng padamdam.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: nanlulumo ang aking kaluluwa sa loob ko
  rationale: Pinananatili ang makatang pagtukoy sa 'kaluluwa,' habang likas na ipinahahayag sa modernong Tagalog ang kalagayang nakayuko o lugmok sa kalooban.
- source_word: עַל־כֵּן
  choice: kaya
  rationale: Malinaw at natural na naghahayag ng bunga o lohikal na kaugnayan.
- source_word: אֶזְכָּרְךָ
  choice: inaalaala kita
  rationale: Ang imperfect ay maaaring tumukoy sa kasalukuyan o nagpapatuloy na kilos; pinananatili sa talababa ang posibleng hinaharap o kapasiyahang pagbasa.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: mula sa lupain ng Jordan
  rationale: Pinananatili ang heograpikong diwa ng rehiyong kaugnay ng Jordan, hindi lamang ng ilog.
- source_word: וְחֶרְמוֹנִים
  choice: at sa mga Hermon
  rationale: Pinananatili ang tunay na anyong maramihan ng Hebreo, na maaaring tumukoy sa kabundukan o mga taluktok ng Hermon.
- source_word: מֵהַר מִצְעָר
  choice: mula sa Bundok Mizar
  rationale: Itinuturing ang Mizar bilang pangalang pook, na siyang hindi gaanong mapagpasiyang salin sa heograpikong konteksto.
