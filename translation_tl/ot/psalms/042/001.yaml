source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: tl
  text: Kung paanong nananabik[a] ang usa sa mga daluyan ng tubig[b], gayon nananabik sa iyo ang kaluluwa ko[c], O Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humihingal sa pananabik”; ang pandiwang Hebreo ay nagpapahiwatig ng matinding pananabik na tulad ng pagkauhaw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga batis” o “mga agusan ng tubig.”
    reason: lexical_alternative
  - marker: c
    text: Ang “kaluluwa ko” ay maaari ring unawain bilang “ang buhay ko,” “ang buong pagkatao ko,” o “ako mismo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Kung paanong … ang usa
  rationale: Ang כְּ ay naghahayag ng paghahambing, at ang אַיָּל ay tumutukoy sa usa, na maaaring partikular na lalaking usa. Ang “usa” ang pinakanatural at madaling maunawaan sa modernong Tagalog.
- source_word: תַּעֲרֹג
  choice: nananabik
  rationale: Ipinahihiwatig ng ערג ang masidhing pananabik na maihahalintulad sa pagkauhaw o paghingal. Pinananatili ng “nananabik” ang tindi ng pagnanais nang hindi nililimitahan ang larawan sa pisikal na paghingal.
- source_word: עַל
  choice: sa
  rationale: Kasama ng pandiwang ערג, natural na ipinahahayag ng “sa” ang bagay na pinananabikan ng usa.
- source_word: אֲפִיקֵי מָיִם
  choice: mga daluyan ng tubig
  rationale: Ang אֲפִיקִים ay maaaring tumukoy sa mga daluyan, agusan, o batis. Ang “mga daluyan ng tubig” ay malinaw, natural, at pinananatili ang tahasang larawan at maramihang anyo ng Hebreo.
- source_word: כֵּן
  choice: gayon
  rationale: Minamarkahan ng כֵּן ang ikalawang bahagi ng paghahambing. Ang “gayon” ay maikli, marangal, at angkop sa panulaang biblikal.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang kaluluwa, buhay, sarili, o buong pagkatao. Ang “kaluluwa ko” ay angkop sa mapanalangin at makatang himig, habang nililinaw sa talababa ang mas malawak na saklaw nito.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ang אֵלֶיךָ ay literal na nakatuon “sa” o “patungo sa” Diyos. Sa Tagalog, natural na kabit ng “nananabik” ang “sa iyo,” at pinananatili nito ang direksiyon ng pagnanais.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ang Diyos ay tuwirang kinakausap. Ang “O Diyos” ay malinaw na pantawag at angkop sa dignidad ng awit.
theological_decisions:
- issue: Saklaw ng kahulugan ng נַפְשִׁי
  choice: ang kaluluwa ko
  alternative: ang buhay ko; ang buong pagkatao ko; ako mismo
  rationale: Hindi sapilitang nagtuturo ang salitang Hebreo ng mahigpit na paghihiwalay ng katawan at kaluluwa; maaari nitong tukuyin ang buhay o buong sarili. Pinanatili ang tradisyonal at makatang “kaluluwa ko,” ngunit hindi isinasara ang mas malawak na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal at makata. Ginamit ang “gayon” upang mapanatili ang malinaw na balangkas ng paghahambing. Iniwasan ang sobrang literal na “humihingal” sa pangunahing teksto, ngunit inilagay ito bilang leksikal na posibilidad sa talababa.
