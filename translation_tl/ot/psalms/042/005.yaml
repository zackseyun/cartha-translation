  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: tl
  text: Bakit ka nanglulumo, kaluluwa ko, at bakit ka nababagabag sa loob ko? Umasa ka sa Diyos, sapagkat pupurihin ko pa siya—ang pagliligtas na dulot ng kanyang presensya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga pagliligtas ng kanyang mukha.” Sa Hebreo, ang “mukha” ay madalas tumukoy sa presensya; maaari ring unawain ang parirala bilang tulong o pagliligtas na nagmumula sa kanyang presensya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: nanglulumo
  rationale: Ang pandiwa ay literal na tumutukoy sa pagyukod o paglugmok. Ang “nanglulumo” ay likas sa modernong Tagalog at naipahihiwatig ang matinding pagkalugmok nang hindi inaalis ang patulang tono.
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Dito, kinakausap ng makata ang kanyang panloob na sarili. Pinananatili ng “kaluluwa ko” ang patula at mapagnilay na pananalita nang hindi iginigiit ang isang teknikal na antropolohiya.
- source_word: וַתֶּהֱמִי
  choice: nababagabag
  rationale: Ipinahihiwatig ng pandiwa ang maingay na pagkabalisa o kaguluhan. Ang “nababagabag” ay malinaw at natural na paglalarawan ng panloob na ligalig.
- source_word: עָלָי
  choice: sa loob ko
  rationale: Bagaman literal na “sa ibabaw ko” o “laban sa akin,” ang konteksto ay tumutukoy sa ligalig na nararanasan sa kalooban ng nagsasalita.
- source_word: הוֹחִילִי
  choice: Umasa ka
  rationale: Ang pautos ay panawagan sa may pagtitiwalang paghihintay. Ang “Umasa ka” ay maikli, natural, at taglay ang tiwala at pag-asam.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Ito ang likas na Tagalog para sa Diyos bilang pinagtutuunan ng pag-asa.
- source_word: עוֹד
  choice: muli ko pa
  rationale: Ipinapahayag nito na sa kabila ng kasalukuyang pagdurusa ay darating pa ang pagkakataong muling magpuri.
- source_word: אוֹדֶנּוּ
  choice: siyang pupurihin
  rationale: Sa konteksto ng salmo, ang pandiwa ay angkop na tumutukoy sa pagpuri o pagpapasalamat sa Diyos.
- source_word: יְשׁוּעוֹת
  choice: pagliligtas
  rationale: Ang anyong maramihan ay maaaring maging masidhi o abstraktong paggamit. Ang isahang “pagliligtas” ay natural sa Tagalog habang pinananatili ang diwa ng pagliligtas o tulong.
- source_word: פָּנָיו
  choice: kanyang presensya
  rationale: Literal itong “kanyang mukha,” ngunit madalas na tumutukoy ang Hebreong “mukha” sa presensya ng isang tao. Ang “presensya” ay malinaw sa modernong Tagalog; pinananatili sa talababa ang literal na larawan at sintaktikong kalabuan.
theological_decisions:
- issue: Ang kahulugan ng pariralang יְשׁוּעוֹת פָּנָיו
  choice: ang pagliligtas na nagmumula sa kanyang presensya
  alternative: ang mga pagliligtas ng kanyang mukha; ang tulong ng kanyang mukha
  rationale: Literal at hindi pangkaraniwan ang pariralang Hebreo. Ang pangunahing salin ay nagpapahayag na ang pagliligtas ay nagmumula sa presensya ng Diyos, ngunit hindi nito ipinapalit ang ibang refrain na may “aking mukha at aking Diyos,” na wala sa ibinigay na tekstong WLC. Inilalahad sa talababa ang literal na anyo upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na patula, marangal, at madaling maunawaan. Ginamit ang “kaluluwa ko” upang mapanatili ang tuwirang pakikipag-usap ng makata sa sarili. Ang gitling bago ang huling parirala ay nagpapakita ng paliwanag o apposition nang hindi lubusang nilulutas ang masalimuot na sintaks ng Hebreo.
