base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: tl
  text: Tumatawag ang kalaliman sa isa’t isa sa ugong ng iyong mga talon[a]; lahat ng iyong humahampas na alon at mga daluyong ay dumaan sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong rumaragasang mga agos” o “iyong mga daluyan ng tubig.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lumipas sa akin” o “rumagasa sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: ang kalaliman ... kapwa kalaliman
  rationale: Ang תְּהוֹם ay tumutukoy sa malalim na tubig o kailaliman. Pinananatili ng “kalaliman” ang matulaing pag-uulit nang hindi nililimitahan ang larawan sa isang tiyak na kosmolohikal na pakahulugan; ipinahihiwatig ng “kapwa” ang ugnayang “isa ... sa isa” na likas sa Filipino.
- source_word: קוֹרֵא
  choice: tumatawag
  rationale: Tuwirang ipinapahayag nito ang masiglang kilos ng participle at pinananatili ang personipikasyon ng mga kalaliman.
- source_word: לְקוֹל
  choice: sa ugong ng
  rationale: Ang קוֹל ay literal na “tinig” o “tunog,” ngunit sa konteksto ng rumaragasang tubig, natural at kongkreto sa Filipino ang “ugong.”
- source_word: צִנּוֹרֶיךָ
  choice: iyong mga talon
  rationale: Maaaring tumukoy ang צִנּוֹר sa lagusan, daluyan, o rumaragasang buhos ng tubig. Ang “mga talon” ay malinaw at madaling maunawaan, habang itinatala sa talababa ang mas malawak na alternatibo.
- source_word: מִשְׁבָּרֶיךָ
  choice: iyong humahampas na alon
  rationale: Tumutukoy ang מִשְׁבָּר sa mga alon na bumabagsak o humahampas. Inilalarawan ng parirala ang pagkabasag at lakas ng alon sa natural na Filipino.
- source_word: וְגַלֶּיךָ
  choice: at mga daluyong
  rationale: Ang גַּל ay “alon.” Ginamit ang “daluyong” upang mapanatili ang kaibhan nito sa naunang humahampas na alon at maipahayag ang marahas na imahen ng dagat.
- source_word: עָלַי עָבָרוּ
  choice: ay dumaan sa ibabaw ko
  rationale: 'Malapit ito sa anyo at larawan ng Hebreo: naranasan ng nagsasalita na lampasan o tabunan siya ng mga tubig, nang hindi tahasang pinapalitan ang pandiwa ng mas interpretatibong “tinangay.”'
theological_decisions:
- issue: Pagmamay-ari ng Diyos sa mga alon at daluyong
  choice: Pinanatili ang “iyong” sa parehong uri ng alon.
  alternative: Alisin ang ikalawang pagmamay-ari at gawing pangkalahatang larawan lamang ng unos.
  rationale: Tahasan sa Hebreo ang mga hulaping pangalawang panauhan sa צִנּוֹרֶיךָ, מִשְׁבָּרֶיךָ, at גַלֶּיךָ. Pinananatili nito ang teolohikal na tensiyon na ang mga tubig na dumadaig sa makata ay inilalarawang pag-aari ng Diyos, nang ipaliwanag kung paanong nauugnay ang Diyos sa pagdurusa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matulaing pag-uulit at marahas na larawang-tubig; iniwasan ang lipas na bokabularyo at ang labis na pagpapaliwanag sa taludtod.
