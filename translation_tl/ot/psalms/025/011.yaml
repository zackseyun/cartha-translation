  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: tl
  text: Alang-alang sa iyong pangalan[a], Yahweh, patawarin mo ang aking pagkakasala[b], sapagkat malaki ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iyong pangalan” ay umaapela sa pagkatao, reputasyon, at karangalan ni Yahweh, hindi lamang sa bigkas ng pangalan.
    reason: cultural_note
  - marker: b
    text: Ang salitang Hebreo na עָוֹן ay maaari ring isaling “aking kasamaan” o “aking pananagutan sa kasalanan”; maaari itong tumukoy sa masamang gawa, sa pagkakasala, o sa bigat at bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Alang-alang sa
  rationale: Ipinahahayag nito ang batayan ng pakiusap at natural na tumutugma sa idyomang Hebreo na umaapela sa pangalan o karangalan ng Diyos.
- source_word: שִׁמְךָ
  choice: iyong pangalan
  rationale: Pinananatili ang kongkretong pananalita ng Hebreo sa halip na ipalit sa pangunahing teksto ang “karangalan” o “pagkatao.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang personal na pangalan, hindi ng pamagat na “PANGINOON.”
- source_word: וְסָלַחְתָּ
  choice: patawarin mo
  rationale: Bagaman anyong perfect na may waw, gumaganap ito bilang mapitagang pakiusap sa konteksto ng panalangin; malinaw at likas sa Tagalog ang anyong ito.
- source_word: לַעֲוֺנִי
  choice: ang aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa maling gawa, pagkakasala, pananagutan, o bunga nito. Ang “kasamaan” ay dignified at nauunawaan, habang ang tala ay nagpapanatili sa lawak ng salita.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ang sanhi o dahilan ng pakiusap sa paraang angkop sa marangal na himig ng panalangin.
- source_word: רַב הוּא
  choice: ito ay malaki
  rationale: Ang panghalip ay bumabalik sa kasamaan; ang “malaki” ay nagpapanatili sa tindi at di-pangbilang na kahulugan ng רַב.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa Hebreo ang personal na pangalang YHWH. Ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahulugan ng עָוֹן
  choice: kasamaan
  alternative: pagkakasala; pananagutan sa kasalanan
  rationale: Hindi ipinipirmi ng Hebreo kung ang diin ay nasa masamang gawa, pagkakasala, o pananagutang dulot nito; nililinaw sa talababa ang tunay na saklaw.
- issue: Lohika ng pakiusap na “sapagkat ito ay malaki”
  choice: Pinanatiling dahilan ang laki ng kasamaan
  alternative: bagaman ito ay malaki
  rationale: 'Karaniwang causal ang כִּי rito. Pinananatili nito ang matapang na tensiyon ng panalangin: ang bigat ng kasamaan mismo ang nagpapatingkad sa pangangailangan sa kapatawaran, sa halip na tahimik itong gawing concessive.'
translation_notes:
  register: Makabago ngunit marangal na Tagalog para sa panalangin. Ginamit ang “alang-alang sa” at “sapagkat” upang panatilihin ang taimtim na himig nang hindi nagiging lipas o labis na teknikal. Inayos ang mga marker upang ang tala [a] ay para sa “pangalan” at ang [b] ay para sa עָוֹן.
