  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: tl
  text: Mabuti at matuwid si Yahweh; kaya itinuturo niya sa mga makasalanan ang daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “tinuturuan niya ang mga makasalanan kung aling daan ang tatahakin,” o, “ginagabayan niya ang mga makasalanan sa daan.” Ang pandiwa ay maaaring mangahulugang magturo, magbigay ng tagubilin, o magbigay ng direksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mabuti
  rationale: Tumutukoy ito sa moral na kabutihan ni Yahweh at natural na katambal ng “matuwid.”
- source_word: וְיָשָׁר
  choice: at matuwid
  rationale: Pinananatili ng “matuwid” ang diwa ng moral na pagiging tuwid o wasto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at natural nitong ipinahahayag ang bunga o lohikal na kaugnayan ng dalawang sugnay.
- source_word: יוֹרֶה
  choice: itinuturo niya
  rationale: Ang anyong Hiphil ng ירה ay maaaring mangahulugang magturo, magbigay ng tagubilin, o magturo ng direksiyon; ang “itinuturo” ay angkop sa parehong pagtuturo at paggabay sa landas.
- source_word: חַטָּאִים
  choice: mga makasalanan
  rationale: Tuwiran nitong pinananatili ang moral na katawagang nasa tekstong Hebreo.
- source_word: בַּדָּרֶךְ
  choice: ang daan
  rationale: Pinananatili nito ang metapora ng daan nang hindi idinaragdag ang salitang “tama,” na hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo.
- issue: Diwa ng יוֹרֶה ... בַּדָּרֶךְ
  choice: itinuturo niya sa mga makasalanan ang daan
  alternative: tinuturuan niya ang mga makasalanan sa daan; ginagabayan niya ang mga makasalanan sa daan
  rationale: Natural ito sa makabagong Tagalog at pinananatili ang metapora, habang kinikilala sa talababa na maaaring idiin ng pandiwa ang pagtuturo o paggabay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “si Yahweh” ayon sa likas na balarila ng Tagalog para sa personal na pangalan. Napanatili ang maikli at lohikal na anyo ng talata at ang metapora ng “daan.”
