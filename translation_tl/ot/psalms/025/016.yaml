translation:
  language: tl
  text: Bumaling ka sa akin at lingapin mo ako, sapagkat ako ay nag-iisa[a] at naghihirap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malungkot” o “nakahiwalay.” Ang יָחִיד ay maaaring mangahulugang nag-iisa o nakahiwalay, at maaari ring magpahiwatig ng kalungkutan.
    reason: lexical_alternative
  - marker: b
