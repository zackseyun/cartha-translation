    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Humarap ka sa akin
  rationale: Ang pandiwang פנה na sinusundan ng אֵלַי ay pakiusap na ibaling ng Diyos ang kanyang pansin sa nagsasalita. Likas sa makabagong Tagalog ang “Humarap ka sa akin” at napapanatili nito ang larawang direksiyonal ng Hebreo.
- source_word: וְחָנֵּנִי
  choice: at kahabagan mo ako
  rationale: Ang חנן ay paghingi ng kagandahang-loob o pabor. Sa konteksto ng panalangin, malinaw at marangal ang “kahabagan mo ako,” bagaman maaari rin itong isaling “pagmagandahang-looban mo ako.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap; ang “sapagkat” ay angkop sa dignidad ng panalangin at malinaw ang ugnayang sanhi.
- source_word: יָחִיד
  choice: nag-iisa
  rationale: Sa panaghoy, maaaring tumukoy ang יָחִיד sa pagiging nag-iisa, hiwalay, o malungkot. Pinili ang “nag-iisa” upang mapanatili ang obhetibong kalabuan sa pagitan ng pag-iisa at damdaming kalungkutan.
- source_word: וְעָנִי
  choice: at naghihirap
  rationale: 'Malawak ang saklaw ng עָנִי: dukha, api, o nasa kapighatian. Ang “naghihirap” ay natural at hindi nililimitahan ang kahulugan sa kahirapang pangkabuhayan lamang.'
- source_word: אָנִי
  choice: ako ay
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa kalagayan ng nagsasalita. Ang “ako ay” ay nagpapanatili ng diin at maayos sa dignidad ng talata.
