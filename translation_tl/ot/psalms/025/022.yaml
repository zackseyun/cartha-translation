  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: tl
  text: Tubusin mo, O Diyos, ang Israel mula sa lahat ng kanyang[a] mga kagipitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kagipitan,” kung ang Israel ay ituturing na kolektibong bayan sa halip na panatilihin ang isahang anyong gramatikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: Tubusin mo
  rationale: Ang pautos na anyo ng פדה ay tumutukoy sa pagtubos o pagpapalaya kapalit ng halaga. Pinananatili ng “tubusin” ang bigat na teolohikal at tipanang taglay ng salita.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos pagkatapos ng pautos; likas at marangal sa Filipino ang “O Diyos.”
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tumutukoy ang pangalang pantangi sa bayang Israel bilang isang kabuuan sa kontekstong ito.
- source_word: מִכֹּל
  choice: sa lahat ng
  rationale: Ipinahihiwatig ng מִן kasama ng כֹּל ang pagliligtas mula sa kabuuan ng mga kagipitan; natural sa Filipino ang “sa lahat ng.”
- source_word: צָרוֹתָיו
  choice: kanyang mga kagipitan
  rationale: Ang צָרוֹת ay mga kagipitan, kapighatian, o matitinding suliranin. Malawak at angkop sa panalanging salmo ang “mga kagipitan,” habang pinananatili ng “kanyang” ang panlalaking isahang hulapi ng Hebreo.
theological_decisions:
- issue: Isahang panghalip para sa kolektibong Israel
  choice: Panatilihin ang isahang “kanyang mga kagipitan”
  alternative: “kanilang mga kagipitan,” kung ituturing ang Israel bilang kolektibong bayan sa natural na Filipino
  rationale: May hulaping ikatlong panauhang panlalaki at isahan ang צָרוֹתָיו. Pinananatili ng “kanyang” ang gramatikal na anyo ng Hebreo at ang pagtrato sa Israel bilang isang kolektibong katauhan, bagaman maaaring ipahayag ito sa Filipino bilang maramihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tubusin” upang mapanatili ang tipanan at teolohikal na bigat ng pandiwang Hebreo, at “kagipitan” upang saklawin ang sari-saring paghihirap na tinutukoy ng pangngalan.
