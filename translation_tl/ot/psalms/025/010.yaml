  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: tl
  text: Ang lahat ng landas ni Yahweh ay tapat na pag-ibig at katapatan sa mga tumutupad sa kanyang tipan at kanyang mga patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “katapatan” ay maaari ring isaling “katotohanan.” Sa tambalang Hebreo na “tapat na pag-ibig at katapatan,” madalas na tumutukoy ito sa maaasahan at matibay na katapatan, hindi lamang sa abstraktong katotohanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: lahat ng
  rationale: Saklaw ng pang-ukol ang kabuuan ng mga landas ni Yahweh; natural at malinaw ang “lahat ng” sa Filipino.
- source_word: אָרְחוֹת
  choice: mga landas
  rationale: Pinananatili nito ang metapora ng dinaanan o landas habang likas pa rin sa makabagong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matatag at mapagkakatiwalaang pag-ibig na mayaman sa kontekstong tipan.
- source_word: אֱמֶת
  choice: katapatan
  rationale: Sa tambalang חֶסֶד וֶאֱמֶת, higit na nangingibabaw ang diwa ng maaasahang katapatan kaysa abstraktong katotohanan.
- source_word: לְנֹצְרֵי
  choice: para sa mga tumutupad
  rationale: Ipinahihiwatig ng participle ng נצר ang maingat na pag-iingat o pagtupad; ang “para sa” ay natural na nagsasaad ng ugnayang ipinakikilala ng לְ.
- source_word: בְרִיתוֹ
  choice: kanyang tipan
  rationale: Ang “tipan” ang karaniwan at tumpak na salin sa biblikal na konteksto.
- source_word: וְעֵדֹתָיו
  choice: at mga patotoo
  rationale: Pormal nitong pinananatili ang diwa ng mga patotoo o tuntuning nagsisilbing saksi, nang hindi ito nililimitahan sa “mga utos” lamang.
theological_decisions:
- issue: Ugnayang panaguri sa pahayag na ang lahat ng landas ni Yahweh ay חֶסֶד וֶאֱמֶת
  choice: Inilalarawan mismo ang lahat ng landas ni Yahweh bilang tapat na pag-ibig at katapatan para sa mga tumutupad sa kanyang tipan at mga patotoo.
  alternative: Ang mga landas ni Yahweh ay humahantong sa tapat na pag-ibig at katapatan.
  rationale: Ang sugnay na Hebreo na walang tahasang pandiwa ay pinakamadaling basahin bilang pagpapahayag na ang mga landas ni Yahweh ay may ganitong katangian. Pinananatili ng “para sa” ang kaugnayan sa mga tagapag-ingat ng tipan nang hindi ipinapaliwanag nang lampas sa teksto kung paano ito nauugnay sa pagkamasunurin ng tao.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metapora ng “mga landas,” ang pangalang Yahweh, at ang pormal na salitang “mga patotoo.” Hindi nilagyan ng hiwalay na talababa ang לְ sapagkat ang mga posibleng saling “para sa” at “sa” ay walang mahalagang pagkakaibang kailangang ipaliwanag sa Filipino sa talatang ito.
