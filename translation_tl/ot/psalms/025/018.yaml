  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: tl
  text: Tingnan mo ang aking paghihirap at pagdurusa, at patawarin mo ang lahat ng aking mga kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “buhatin o alisin mo ang lahat ng aking mga kasalanan.” Ang pandiwang Hebreo ay maaaring mangahulugang “buhatin,” “dalhin,” o “alisin”; dito, idyoma ito para sa pagpapatawad ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pautos na pakiusap sa Diyos na bigyang-pansin at tugunan ang kalagayan ng nananalangin.
- source_word: עָנְיִי
  choice: ang aking paghihirap
  rationale: Saklaw nito ang pagdurusa o kaabaan at hindi nililimitahan ang diwa sa kahirapang pangkabuhayan.
- source_word: וַעֲמָלִי
  choice: at pagdurusa
  rationale: Sa parallelismo sa עָנְיִי, tumutukoy ito sa mabigat at masakit na karanasan; natural sa modernong Filipino ang pares na 'paghihirap at pagdurusa.'
- source_word: וְשָׂא
  choice: at patawarin mo
  rationale: Bagaman literal na 'buhatin/dalhin/alisin,' kapag kasalanan ang layon ay idyoma ito para sa pag-aalis ng sala, kaya malinaw na ipinahahayag ng 'patawarin' ang diwa.
- source_word: לְכָל
  choice: ang lahat ng
  rationale: Ang לְ ay bahagi ng Hebreong konstruksyon; hindi kailangang katawanin nang hiwalay sa natural na Filipino.
- source_word: חַטֹּאותָי
  choice: aking kasalanan
  rationale: Karaniwan at malinaw na salin ng pangmaramihang anyo sa kontekstong nagsisisi at humihingi ng kapatawaran.
theological_decisions:
- issue: Idyomatikong gamit ng נשׂא kapag kasalanan ang layon
  choice: 'Isinalin bilang tuwirang kahilingan ng kapatawaran: ''patawarin mo ang lahat ng aking kasalanan.'''
  alternative: '''alisin mo ang lahat ng aking kasalanan'' / ''buhatin mo palayo ang lahat ng aking kasalanan'''
  rationale: Ipinahihiwatig ng Hebreong larawan ang pagbuhat o pag-aalis ng kasalanan, ngunit ang 'patawarin' ang malinaw at natural na katumbas ng idyoma sa Filipino nang walang idinadagdag na natatanging doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong tuwirang panalangin at ang parallelismong 'paghihirap at pagdurusa.'
