  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נַ֭פְשׁ/וֹ בְּ/ט֣וֹב תָּלִ֑ין וְ֝/זַרְע֗/וֹ יִ֣ירַשׁ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: tl
  text: Ang kanyang kaluluwa ay mananahan sa kabutihan[b], at ang kanyang mga supling ay magmamana ng lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig.” Ang Hebreong אֶרֶץ ay maaaring mangahulugang “lupain” o “daigdig”; dito, mas angkop ang “lupain” dahil sa pahiwatig ng tipan tungkol sa pagmamana nito.
    reason: alternative_reading
  - marker: b
    text: O “tutuloy” / “magpapalipas ng gabi.” Ang pandiwang Hebreo ay may larawan ng pagtuloy o pagpapalipas ng gabi, at dito ay tumutukoy sa patuloy na pananatili.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: ang kanyang kaluluwa
  rationale: Pinananatili nito ang Hebreong makatang pahayag na נֶפֶשׁ, na maaaring tumukoy sa kaluluwa, sarili, o buhay, sa halip na payak na gawing 'siya.'
- source_word: בְּטוֹב
  choice: sa kabutihan
  rationale: Sinasaklaw ng טוֹב ang kabutihan, kaginhawahan, at mabuting kalagayan. Pinananatili ng 'sa kabutihan' ang moral at karanasang lawak nito nang hindi nililimitahan sa materyal na kasaganaan.
- source_word: תָלִין
  choice: mananahan
  rationale: Bagaman ang לון ay literal na maaaring mangahulugang magpalipas ng gabi o tumuloy, maaari rin itong maglarawan ng pananatili. Natural sa Tagalog ang 'mananahan' at ipinahihiwatig nito ang matatag na pananatili.
- source_word: וְזַרְעוֹ
  choice: at ang kanyang mga supling
  rationale: Ang זֶרַע ay literal na 'binhi' ngunit dito ay tumutukoy sa mga anak o inapo. Ang 'mga supling' ay maikli at pinananatili ang kolektibong diwa.
- source_word: יִירַשׁ
  choice: magmamana
  rationale: Maaaring mangahulugan ang ירשׁ na magmana o magmay-ari. Ang 'magmamana' ay angkop sa pahiwatig ng tipan at sa karaniwang wikang biblikal.
- source_word: אָרֶץ
  choice: lupain
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupain o sa buong mundo. Sa pagsasama nito sa ירשׁ, malamang na nangingibabaw ang pahiwatig ng lupang ipinangako, habang itinatala sa talababa ang mas malawak na posibilidad.
theological_decisions:
- issue: Saklaw ng אָרֶץ kasama ng יִירַשׁ
  choice: lupain
  alternative: daigdig
  rationale: Malamang na umaalingawngaw ang parirala sa wika ng tipan tungkol sa pagmamana ng lupain. Gayunman, tunay na posible rin ang mas malawak na kahulugang 'daigdig,' kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang makatang 'kaluluwa' at ang malawak na 'kabutihan'; ginamit ang 'mananahan' upang maging natural habang hindi lubusang nawawala ang larawan ng pananatili. Inilagay ang [b] pagkatapos ng pariralang kaugnay ng pandiwa at ang [a] pagkatapos ng 'lupain' upang malinaw ang tinutukoy ng bawat talababa.
