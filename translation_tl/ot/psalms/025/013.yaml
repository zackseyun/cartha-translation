  source_fidelity: 'Tumpak na naihahatid ng salin ang mga pangunahing bahagi ng Hebreo: ang makatang "kanyang kaluluwa," ang pananatili sa טוֹב, ang kolektibong "mga supling," at ang pagmamana ng אֶרֶץ. Ang "lupain" ay isang makatwirang pangunahing pagbasa sa konstruksiyong יירשׁ אָרֶץ, habang hindi isinasara ng talababa ang posibleng "daigdig."'
