  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: tl
  text: Ang integridad at katuwiran nawa[a] ang mag-ingat sa akin, sapagkat sa iyo ako naghihintay nang may pag-asa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang integridad at katuwiran ay mag-iingat sa akin.” Maaaring magpahayag ang pandiwang Hebreo ng tiyak na pag-asam o ng isang kahilingan o panalangin sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat sa iyo ako umaasa.” Ang pandiwang Hebreo ay nagpapahiwatig ng paghihintay na may pag-asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: katapatan
  rationale: Tumutukoy sa kabuuan o pagiging walang daya ng moral na pagkatao. Natural sa modernong Tagalog ang “katapatan” at hindi nito ipinahihiwatig na ganap na walang kasalanan ang nagsasalita.
- source_word: וָיֹשֶׁר
  choice: at katuwiran
  rationale: Ang יֹשֶׁר ay literal na pagkatuwid at, sa usaping etikal, katuwiran. Pinananatili ng “katuwiran” ang magkaugnay ngunit hindi lubos na magkaparehong katangian sa תֹּם.
- source_word: יִצְּרוּנִי
  choice: Ingatan sana ako
  rationale: Mula sa נצר, “magbantay, mag-ingat, magpanatili.” Maaaring magpahayag ang yiqtol dito ng panalangin o tiyak na pag-asam; ang “sana” ay angkop sa tono ng pagsusumamo habang iniiwan sa talababa ang alternatibong pagpapahayag ng pagtitiwala.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang kahilingan. Dignified at malinaw ang “sapagkat” sa tulang panalangin.
- source_word: קִוִּיתִיךָ
  choice: sa iyo ako naghihintay nang may pag-asa
  rationale: Saklaw ng קוה ang paghihintay na may pag-asa at pananabik. Tahasang pinananatili ng salin ang dalawang sangkap upang maiwasang maging karaniwang paghihintay lamang ang diwa.
theological_decisions:
- issue: Kung itinuturing ng talata na pansariling merito ang katapatan at katuwiran, o hinihiling lamang na ang mga katangiang ito ang maging tagapag-ingat sa umaasa sa Diyos
  choice: Isinalin bilang panalangin na ang katapatan at katuwiran ang mag-ingat sa salmista, nang walang dagdag na paliwanag tungkol sa merito.
  alternative: Isalin bilang tiyak na pahayag na iingatan siya ng mga katangiang ito, o ipaliwanag ang mga ito bilang batayan ng gantimpala ng Diyos.
  rationale: Tuwirang binabanggit ng Hebreo ang mga moral na katangian bilang mga tagaganap ng pag-iingat at kasabay nito ang paghihintay ng salmista sa Diyos. Pinananatili ng salin ang tensiyong ito at hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “katapatan at katuwiran” bilang maikli at makatang tambalan. Ang “naghihintay nang may pag-asa” ay bahagyang mas tahasan upang maipakita ang buong diwa ng קוה.
