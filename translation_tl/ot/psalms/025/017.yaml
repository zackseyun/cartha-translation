  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: tl
  text: Ang mga paghihirap ng puso ko ay dumami[a]; ilabas mo ako mula sa aking mga kagipitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lumawak ang mga paghihirap ng puso ko,” na mas literal na pinananatili ang larawang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “ilabas mo ako mula sa aking mga kasikipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹת
  choice: mga ligalig
  rationale: Tumutukoy ang pangngalan sa mga problema, kapighatian, o kalagayang nagdudulot ng hirap. Ang “mga ligalig” ay likas at marangal na Filipino at angkop sa kaugnayan nito sa puso.
- source_word: לְבָבִי
  choice: ng puso ko
  rationale: Ang לֵבָב ay tumutukoy sa kaloob-looban ng tao, kasama ang damdamin at pag-iisip. Pinananatili ng “puso” ang larawang Hebreo.
- source_word: הִרְחִיבוּ
  choice: dumami
  rationale: Literal na nangangahulugang “pinalawak” o “pinalaki” ang pandiwa. Dahil mga ligalig ang simuno, ipinahihiwatig dito na lumubha o dumami ang mga ito. Malinaw sa makabagong Filipino ang “dumami,” habang inilalagay sa talababa ang mas literal na larawan.
- source_word: מִמְּצוּקוֹתַי
  choice: sa aking mga kagipitan
  rationale: Ang pangngalan ay may diwa ng kasalatan sa luwang, pagkakapos, o matinding kagipitan. Pinananatili ng “mga kagipitan” ang maramihang anyo at ang larawan ng nakasasakal na kalagayan.
- source_word: הוֹצִיאֵנִי
  choice: ilabas mo ako
  rationale: Literal itong nangangahulugang “ilabas mo ako.” Pinananatili ng salin ang kongkretong larawan ng pagliligtas mula sa masikip o mapanganib na kalagayan.
