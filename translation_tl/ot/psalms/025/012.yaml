  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: tl
  text: Sino ang taong may takot kay Yahweh? Tuturuan siya ni Yahweh sa daang dapat niyang piliin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa daang pinipili niya” o “sa daang pipiliin niya.” Pinahihintulutan ng Hebreo ang bahagyang magkakaibang diwa ng huling pandiwa, at maaaring unawaing ang pumipili ay ang tao o si Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה הָאִישׁ
  choice: Sino ang taong
  rationale: Ang מִי זֶה ay isang idyomatikong retorikal na tanong. Ang “Sino ang taong” ay natural sa modernong Tagalog at pinananatili ang panlalaking isahan ng הָאִישׁ habang maaari pa ring tumukoy sa isang kinatawang tao.
- source_word: יְרֵא יְהוָה
  choice: may takot kay Yahweh
  rationale: Sa kontekstong karunungan at debosyonal, ang ירא ay tumutukoy sa mapitagang takot. Ang “may takot” ay mas natural at may bigat sa Tagalog kaysa sa literal na “natatakot,” na maaaring magpahiwatig lamang ng pangamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang pamagat na “Panginoon.”
- source_word: יוֹרֶנּוּ
  choice: Tuturuan siya ni Yahweh
  rationale: Ang Hiphil ng ירה ay maaaring mangahulugang magturo, magbigay-tagubilin, o pumatnubay. Ang “tuturuan” ay malinaw at natural; ginawang tahas si Yahweh bilang paksa ayon sa matibay na pahiwatig ng konteksto.
- source_word: בְּדֶרֶךְ
  choice: sa daang
  rationale: Pinananatili ng “daan” ang metapora ng landas o paraan ng pamumuhay.
- source_word: יִבְחָר
  choice: dapat niyang piliin
  rationale: Ang imperpektong pandiwa ay maaaring magpahayag ng pagpili, pagpiling gagawin, o nararapat na pagpili. Ang “dapat niyang piliin” ay angkop sa konteksto ng pagtuturo, ngunit inilalahad sa talababa ang tunay na saklaw ng ibang posibleng pagbasa.
theological_decisions:
- issue: Ang paksa ng “tuturuan siya”
  choice: Si Yahweh ang nagtuturo sa taong may takot sa kanya.
  alternative: Maaaring panatilihing di-tiyak ang paksa ng pandiwa.
  rationale: Walang tahasang paksa ang pandiwang Hebreo, ngunit ang pinakamalapit na konteksto at daloy ng salmo ay matibay na tumutukoy kay Yahweh. Ang pagbanggit sa kanya sa salin ay nag-aalis din ng nakalilitong sunod-sunod na panghalip sa Tagalog.
- issue: Ang paksa at nuance ng יִבְחָר
  choice: Ang tao ang pipili sa daang itinuro sa kanya—“dapat niyang piliin.”
  alternative: “sa daang pinipili niya” o “sa daang pipiliin niya,” na maaari ring unawaing ang pumipili ay si Yahweh.
  rationale: Pinapaboran ng konteksto ng pagtuturo ang nararapat piliin ng taong may takot kay Yahweh, ngunit hindi ganap na nilulutas ng anyong Hebreo ang nuance o reperente; kaya pinanatili sa talababa ang mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang pariralang “may takot kay Yahweh” upang ipahayag ang mapitagang takot, at pinanatili ang metapora ng “daan.”
