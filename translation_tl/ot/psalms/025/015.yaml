  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: tl
  text: 'Ang mga mata ko ay laging nakatuon kay Yahweh,

    sapagkat ilalabas niya ang mga paa ko mula sa lambat[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “palabas mula sa lambat.” Literal na “ilalabas” ang pandiwang Hebreo, kaya nananatili ang larawan ng pagliligtas mula sa pagkakasilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: ang mga mata ko
  rationale: Pinananatili ang konkretong larawang nasa Hebreo sa halip na gawing mas interpretatibong “ang tingin ko.”
- source_word: תָּמִיד
  choice: laging
  rationale: Natural sa makabagong Tagalog at malinaw na nagpapahayag ng patuloy o nakaugaliang pagtutok.
- source_word: אֶל
  choice: nakatuon kay
  rationale: Kasama ng “mga mata,” natural nitong ipinapahayag ang direksiyon ng pansin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa titik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng patuloy na pagtutok ng salmista kay Yahweh.
- source_word: הוּא
  choice: niya
  rationale: Malinaw sa konteksto ang tinutukoy na gumagawa. Hindi na dinagdagan ng “siya mismo,” na maaaring magbigay ng labis na diin sa Tagalog.
- source_word: יוֹצִיא
  choice: ilalabas
  rationale: Pinananatili ang literal at konkretong diwa ng Hiphil na “magpalabas” o “mag-alis mula sa loob,” sa halip na gawing pangkalahatang “ililigtas.”
- source_word: מֵרֶשֶׁת
  choice: sa lambat
  rationale: Ang “lambat” ang tuwirang kahulugan at pinananatili ang larawan ng pagkakasilo; sa pariralang “ilalabas ... sa lambat,” ang “sa” ay may diwang pinagmulan.
- source_word: רַגְלָי
  choice: ang mga paa ko
  rationale: Pinananatili ang literal na maramihang anyo at ang pisikal na larawan ng mga paang nasilo.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ginagamit sa talata ang Tetragrammaton bilang personal na pangalan; pinananatili itong pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Tiyak na pagliligtas sa anyong di-ganap na יוֹצִיא
  choice: ilalabas niya
  alternative: inilalabas niya
  rationale: Sa konteksto, ipinahahayag ng salmista ang pagtitiwala sa gagawing pagliligtas ni Yahweh. Gayunman, hindi dinaragdagan ng paliwanag kung kailan o paano ito mangyayari.
translation_notes:
  register: Makabagong Filipino Tagalog na payak ngunit marangal. Pinanatili ang paralelismong patula, ang konkretong “mga mata” at “mga paa,” at ang larawan ng lambat. Ang “nakatuon” ay idyomatikong Tagalog para sa mga matang nakaharap at nananatiling umaasa kay Yahweh.
