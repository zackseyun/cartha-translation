  naturalness: Ang “lihim na pakikipag-ugnayan” ay teknikal at hindi karaniwang Tagalog sa isang salmong patula. Ang “mga may takot sa kanya” ay nauunawaan ngunit mas natural ang “mga may takot kay Yahweh.” Ang tuwirang ayos na “ipinababatid niya sa kanila ang kanyang tipan” ay malinaw at marangal.
  terminology: Pinananatili ang “Yahweh” para sa יהוה at “tipan” para sa בְּרִיתוֹ. Ang “may takot kay Yahweh” ay ang nakaugaliang biblikal na Tagalog na nagpapanatili sa mapitagang diwa ng ירא nang hindi ito ginagawang simpleng paggalang.
