translation:
  language: tl
  text: 'Ang lihim na payo ni Yahweh ay para sa mga may takot kay Yahweh,

    at ipinababatid niya sa kanila ang kanyang tipan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוֹד
  choice: lihim na pakikipag-ugnayan
  rationale: Ang salitang Hebreo ay maaaring tumukoy sa lihim o kumpidensiyal na usapan at sa malapit na samahan ng magkakatiwala; pinananatili ng parirala ang dalawang aspektong ito nang hindi nililimitahan sa simpleng “payo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לִירֵאָיו
  choice: para sa mga may takot sa kanya
  rationale: Pinananatili ang karaniwang biblikal na diwa ng ירא bilang mapitagang pagkatakot sa Diyos, nang hindi ito pinapaliit sa paggalang lamang.
- source_word: וּבְרִיתוֹ לְהוֹדִיעָם
  choice: at ang kanyang tipan ay ipinababatid niya sa kanila
  rationale: Binabasa ang infinitive לְהוֹדִיעָם ayon sa natural na sintaks bilang pagpapakilala o pagpapaalam ng Diyos sa kanyang tipan sa kanila; malinaw at likas ito sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng סוֹד kaugnay ng Diyos at ng mga may takot sa kanya
  choice: lihim na pakikipag-ugnayan
  alternative: payo; matalik na pakikipagkaibigan
  rationale: Hindi tahasang nilulutas ang leksikal na tensiyon sa pagitan ng kumpidensiyal na kapahayagan at matalik na ugnayan; ang napiling salin ay nagdadala ng dalawang ideya.
- issue: Ugnayan ng ikalawang sugnay sa tipan
  choice: ang Diyos ang nagpapabatid ng kanyang tipan sa kanila
  alternative: ang kanyang tipan ang layuning magpabatid nito sa kanila
  rationale: Ang לְהוֹדִיעָם ay karaniwang nauunawaan na ang paksa ay si Yahweh at ang layon ay ang tipan; iniiwasan ang malabong Tagalog na maaaring magmukhang ang tipan mismo ang gumagawa ng pagpapabatid.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “tipan” bilang nakaugaliang terminong biblikal at “may takot sa kanya” upang mapanatili ang teolohikal na bigat ng Hebreo.
