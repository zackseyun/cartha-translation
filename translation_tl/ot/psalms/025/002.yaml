base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: tl
  text: Diyos ko, sa iyo ako nagtitiwala; huwag mo akong hayaang mapahiya[a]; huwag mong hayaang magbunyi ang mga kaaway ko dahil sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahiya.” Ang pandiwang Hebreo ay maaaring tumukoy sa panloob na pagkahiya o sa hayagang pagkapahiya at pagkadusta.
    reason: lexical_alternative
  - marker: b
    text: O “huwag mong hayaang magtagumpay ang mga kaaway ko laban sa akin” o “magalak sila dahil sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang ipinapahayag ng hulaping unang panauhang isahan ang “aking Diyos.” Natural at marangal sa makabagong Tagalog ang “Diyos ko” bilang tuwirang pagtawag.
- source_word: בְּךָ
  choice: sa iyo
  rationale: Sa konstruksiyong may בָּטַח, tinutukoy ng ב ang pinagtutuunan ng pagtitiwala. “Sa iyo” ang likas na katumbas sa Tagalog.
- source_word: בָטַחְתִּי
  choice: ako nagtitiwala
  rationale: Ang Qal perfect na unang panauhang isahan ay maaaring magpahayag ng matatag at nagpapatuloy na pagtitiwala. Ang kasalukuyang anyo sa Tagalog ay malinaw na naghahatid ng paninindigang ito.
- source_word: אַל אֵבוֹשָׁה
  choice: huwag mo akong hayaang mapahiya
  rationale: Ang אַל kasama ng anyong pakiusap ay isinaling natural bilang “huwag ... hayaang.” Maaaring tumukoy ang בושׁ sa panloob na pagkahiya o sa hayagang pagkapahiya; pinapaboran ng konteksto ng mga kaaway ang ikalawa.
- source_word: יַעַלְצוּ
  choice: magbunyi
  rationale: Ang עלץ ay masidhing pagkagalak o pagbubunyi. Pinananatili ng “magbunyi” ang matula at marangal na tono nang hindi ipinapalagay na literal na nagtagumpay na ang mga kaaway.
- source_word: אֹיְבַי
  choice: ang mga kaaway ko
  rationale: Tuwirang katumbas ito ng pangngalang may hulaping unang panauhang isahan.
- source_word: לִי
  choice: dahil sa sinapit ko
  rationale: Kasunod ng pandiwa ng pagbubunyi, minamarkahan ng לִי ang taong pinagtutuunan ng mapanlibak na galak. Ang Tagalog na “dahil sa sinapit ko” ay natural at nagpapahiwatig ng pagbubunyi sa kapahamakan ng nagsasalita, habang inilalagay sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Ang pakiusap ng salmista tungkol sa kahihiyan
  choice: huwag mo akong hayaang mapahiya
  alternative: huwag mo akong hayaang mahiya
  rationale: Sa harap ng mga kaaway, malamang na pampublikong pagkadusta o pagkabigo ang diin, hindi lamang panloob na damdamin. Gayunman, tunay na posible rin ang kahulugang panloob kaya pinanatili ito sa talababa.
- issue: Ang pagbubunyi ng mga kaaway
  choice: magbunyi ... dahil sa sinapit ko
  alternative: magtagumpay laban sa akin / magalak dahil sa akin
  rationale: Ang pandiwa ay pangunahing tumutukoy sa masidhing pagkagalak, hindi tahasang sa militar o pangkalahatang pagtatagumpay. Iniwasan ng salin ang sobrang paglilinaw, habang ipinahihiwatig ng parirala ang mapanlibak na galak sa kapahamakan ng salmista.
translation_notes:
  register: Makabago ngunit marangal na wikang panalangin. Ginamit ang “Diyos ko” at “sa iyo ako nagtitiwala” bilang natural na Tagalog; iniwasan ang arkaikong ayos. Ang “magbunyi” ay nagpapanatili ng matula at masidhing tono ng Hebreo.
