  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: tl
  text: Ingatan mo ang buhay ko at iligtas ako; huwag akong mapahiya, sapagkat nagpapakupkop ako sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa mismong buhay o sarili ng nagsasalita, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: וְהַצִּילֵנִי
  choice: at iligtas ako
  rationale: Tuwirang ipinahahayag ang pakiusap na sagipin o ilayo ang nagsasalita sa panganib.
- source_word: אַל־אֵבוֹשׁ
  choice: huwag mo akong hayaang mapahiya
  rationale: Ang Hebreong anyo ay pakiusap na huwag danasin ng salmista ang kahihiyan o pagkabigo; natural itong naipapahayag sa Tagalog sa paraang ito.
- source_word: חָסִיתִי בָךְ
  choice: nanganganlong ako sa iyo
  rationale: Pinananatili ang larawan ng paghanap ng proteksiyon at katiwasayan sa Diyos; ang aspektong Tagalog ay angkop sa patuloy na pagtitiwala sa kasalukuyang panalangin.
theological_decisions:
- issue: Saklaw ng נֶפֶשׁ
  choice: buhay ko
  alternative: kaluluwa ko
  rationale: Iniiwasang ipakahulugan ang talata bilang eksklusibong tumutukoy sa hiwalay na espirituwal na sangkap; dito ay hinihingi ng salmista na ingatan ang kanyang buhay o buong sarili.
- issue: Ahensiya sa kahihiyan
  choice: huwag mo akong hayaang mapahiya
  alternative: huwag akong mapahiya
  rationale: Ipinakikita ang pakiusap sa Diyos nang hindi sinasabing ang Diyos mismo ang tuwirang nagpapahiya; nananatiling bukas ang pinagmumulan ng bantang kahihiyan.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nanganganlong” upang mapanatili ang matalinghagang diwa ng paghahanap ng kanlungan sa Diyos.
