base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: tl
  text: Ginagabayan niya ang mga mapagpakumbaba sa kung ano ang tama[a], at itinuturo niya sa mga mapagpakumbaba ang kanyang daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa katarungan” o “sa paghatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: Ginagabayan niya
  rationale: Ang Hiphil ng דרך ay nangangahulugang gumabay o magpat走 sa isang daan. Likas sa modernong Tagalog ang “ginagabayan” at malinaw na ipinahahayag ang patuloy na pagkilos ng Diyos.
- source_word: עֲנָוִים
  choice: ang mga mapagpakumbaba
  rationale: Maaaring tumukoy ang salita sa mga mapagpakumbaba, maamo, aba, o napipighati. Sa konteksto ng pagtanggap ng turo ng Diyos, “mga mapagpakumbaba” ang pinakanatural at angkop, habang pinananatili ang pag-uulit para sa diin.
- source_word: בַּמִּשְׁפָּט
  choice: sa kung ano ang tama
  rationale: 'Malawak ang saklaw ng מִשְׁפָּט: paghatol, katarungan, o wastong pasiya. Dito, ang “sa kung ano ang tama” ay natural sa Tagalog at nagpapanatili sa diwa ng pamantayan o landas ng matuwid na paggabay nang hindi nililimitahan sa hukuman.'
- source_word: וִילַמֵּד
  choice: at itinuturo niya
  rationale: Ang Piel ng למד ay “magturo” o “magbigay-aral.” Ang “itinuturo niya” ay payak, kasalukuyan, at madaling maunawaan.
- source_word: דַּרְכּוֹ
  choice: ang kanyang daan
  rationale: Isahan ang anyo at may panlalaking ikatlong panauhang hulapi. Pinananatili ng “kanyang daan” ang metaporang Hebreo para sa asal, kalooban, at landasing itinakda ng Diyos.
theological_decisions:
- issue: Kahulugan ng עֲנָוִים kaugnay ng paggabay at pagtuturo ng Diyos
  choice: mga mapagpakumbaba
  alternative: mga maamo; mga aba; mga napipighati
  rationale: Binibigyang-diin ng konteksto ng salmo ang mapagpakumbaba at handang maturuang saloobin sa harap ng Diyos. Gayunman, hindi ipinagkakaila ng salin na maaaring kabilang sa saklaw ng salitang Hebreo ang pagiging aba o napipighati.
- issue: Kahulugan ng בַּמִּשְׁפָּט bilang pamantayan o larangan ng paggabay
  choice: sa kung ano ang tama
  alternative: sa katarungan; sa paghatol
  rationale: Pinananatili ng napiling salin ang etikal na diwa at ang posibilidad na ang מִשְׁפָּט ay tumukoy sa wastong pasiya. Inilalagay sa talababa ang ibang tunay na posibilidad upang hindi tahimik na lutasin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit payak. Pinanatili ang magkatulad na pagbanggit sa “mga mapagpakumbaba” at ang metaporang “daan.”
