  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: tl
  text: Huwag mong alalahanin ang mga kasalanan ng aking kabataan o ang aking mga pagsuway[a]. Alalahanin mo ako ayon sa iyong tapat na pag-ibig[b], alang-alang sa iyong kabutihan, O Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at ang aking mga pagsuway”; karaniwang nangangahulugang “at” ang pangatnig sa Hebreo, ngunit maaaring gamitin ang “o” sa ganitong magkatambal na negatibong pahayag.
    reason: lexical_alternative
  - marker: b
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na maaaring magpahiwatig ng awa, katapatan, at pag-ibig na matibay sa isang ugnayan o tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: mga kasalanan ng aking kabataan
  rationale: Tumutukoy ang maramihang חַטֹּאות sa mga aktuwal na kasalanang nagawa noong kabataan; pinananatili ng parirala ang tuwirang ugnayang nasa Hebreo.
- source_word: וּפְשָׁעַי
  choice: o ang aking mga pagsuway
  rationale: Ang פשע ay tumutukoy sa kusang paglabag o paghihimagsik. Likas sa Filipino ang “o” sa magkatambal na layon ng negatibong pakiusap, habang inilalahad sa talababa ang literal na pangatnig na “at.”
- source_word: אַל תִּזְכֹּר
  choice: Huwag mong alalahanin
  rationale: Tuwirang ipinapahayag nito ang negatibong pakiusap na huwag nang isaalang-alang o ipanagot ang mga kasalanan.
- source_word: כְּחַסְדְּךָ
  choice: ayon sa iyong tapat na pag-ibig
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang pagmamahal at matibay na katapatan ng חֶסֶד; ipinahihiwatig ng כְּ na ang katangiang ito ng Diyos ang pamantayan ng kaniyang pagkilos.
- source_word: זְכָר לִי אַתָּה
  choice: Alalahanin mo ako
  rationale: 'Pinananatili nito ang sadyang pagtutol sa naunang “huwag mong alalahanin” ang mga kasalanan: ang tao mismo ang alalahanin ng Diyos nang may kagandahang-loob.'
- source_word: לְמַעַן טוּבְךָ
  choice: alang-alang sa iyong kabutihan
  rationale: Ipinakikita ng לְמַעַן na ang sariling kabutihan ng Diyos ang batayan o dahilan ng pakiusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh.”
- issue: Saklaw ng kahulugang חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; pag-ibig na nakabatay sa tipan
  rationale: Hindi nililimitahan sa habag lamang ang salita; pinananatili ng “tapat na pag-ibig” ang pagsasama ng pagmamahal, katapatan, at matibay na kagandahang-loob nang hindi ipinapasok sa pangunahing teksto ang isang mas makitid na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alalahanin” sa dalawang magkatapat na pakiusap upang mapanatili ang retorikal na paglalaro sa pandiwang זכר. Pinanatili ang “O Yahweh” bilang tuwirang pagtawag at ang personal na pangalan ng Diyos.
