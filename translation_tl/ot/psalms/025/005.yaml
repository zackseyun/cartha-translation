  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: tl
  text: Patnubayan mo ako sa iyong katotohanan[a] at turuan mo ako, sapagkat ikaw ang Diyos ng aking kaligtasan; ikaw ang hinihintay ko buong araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Patnubayan mo ako sa pamamagitan ng iyong katapatan,” sapagkat ang salitang Hebreo ay maaaring mangahulugang “katotohanan” o “katapatan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “umaasa ako sa iyo buong araw.” Ang pandiwang Hebreo ay nagpapahiwatig ng paghihintay na may pag-asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Patnubayan mo ako
  rationale: Ang Hiphil imperative ng דרך ay humihiling na akayin o patnubayan ang nagsasalita sa isang landas. Likas sa modernong Tagalog ang “patnubayan” at napapanatili nito ang larawan ng paggabay.
- source_word: בַאֲמִתֶּךָ
  choice: sa iyong katotohanan
  rationale: Maaaring tumukoy ang אֱמֶת sa katotohanan, pagiging maaasahan, o katapatan. Sa konteksto ng pagpapatnubay at pagtuturo, ang “sa iyong katotohanan” ay natural na nagpapahayag ng pamantayan o larangang sinusundan.
- source_word: וְלַמְּדֵנִי
  choice: at turuan mo ako
  rationale: Tuwirang kahulugan ng Piel imperative ng למד ang pagtuturo; malinaw at likas sa Tagalog ang pariralang ito.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng pangatnig ang dahilan ng naunang pakiusap. Ang “sapagkat” ay marangal ngunit karaniwang nauunawaan sa modernong Tagalog.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: ang Diyos ng aking kaligtasan
  rationale: Pinananatili nito ang nominal na anyo ng pariralang Hebreo at malinaw na inilalarawan ang Diyos bilang pinagmumulan ng pagliligtas.
- source_word: אוֹתְךָ קִוִּיתִי
  choice: sa iyo ako naghihintay
  rationale: Ang קוה ay paghihintay na may pag-asa o pananabik. Sa Tagalog, natural ang “maghintay sa iyo” sa panalanging nakatuon sa Diyos, habang inilalahad sa talababa ang mahalagang diwa ng pag-asa.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Likas at maikli itong katumbas ng idyomang tumutukoy sa kabuuan ng maghapon.
theological_decisions:
- issue: Kahulugan ng אֱמֶת kaugnay ng patnubay ng Diyos
  choice: katotohanan
  alternative: katapatan
  rationale: Ang pagkakatambal ng pagpapatnubay at pagtuturo ay pumapabor sa katotohanan bilang nilalaman o pamantayan ng landas. Gayunman, tunay na posibilidad sa Hebreo ang “katapatan,” kaya pinanatili ito sa talababa.
- issue: Diwa ng קוה
  choice: naghihintay
  alternative: umaasa; naghihintay nang may pag-asa
  rationale: Saklaw ng pandiwang Hebreo ang kapwa paghihintay at pag-asang umaasa. Pinananatili ng pangunahing teksto ang konkretong larawan ng paghihintay, at nililinaw ng talababa ang inaasahang pag-asa nang hindi ipinipilit ang iisang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang payak na sintaks at mga karaniwang salitang “patnubayan,” “turuan,” at “naghihintay.” Inilagay ang [a] pagkatapos ng magkapares na kahilingang saklaw ng alternatibong pagbasa, at ang [b] pagkatapos ng sugnay tungkol sa paghihintay upang malinaw ang kaugnayan ng bawat talababa.
