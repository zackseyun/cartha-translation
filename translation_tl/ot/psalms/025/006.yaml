  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: tl
  text: Alalahanin mo, Yahweh, ang iyong mga habag[a] at ang iyong tapat na pag-ibig[b], sapagkat ang mga ito ay mula pa noong unang panahon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga awa” o “malasakit.”
    reason: lexical_alternative
  - marker: b
    text: Plural ang anyo sa Hebreo; maaari ring unawain na “mga gawa ng iyong tapat na pag-ibig.”
    reason: lexical_alternative
  - marker: c
    text: O “mula pa sa walang hanggan.” Ang pariralang Hebreo ay maaaring tumukoy sa napakalayong nakaraan o sa walang hanggang tagal.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pakiusap ang Qal imperative; natural ito sa makabagong Filipino at pinananatili ang diwa ng pagtawag sa Diyos na kumilos ayon sa kaniyang likas na habag.
- source_word: רַחֲמֶיךָ
  choice: ang iyong mga habag
  rationale: Pinananatili ng maramihang “mga habag” ang plural na Hebreo at ipinahihiwatig ang sagana o paulit-ulit na pagpapakita ng awa at malasakit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: וַחֲסָדֶיךָ
  choice: at ang iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay pag-ibig na matatag at tapat. Bagaman plural ang anyong Hebreo, mas likas sa Filipino ang kolektibong pang-isahang “tapat na pag-ibig”; itinatala sa talababa ang plural.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng pakiusap.
- source_word: מֵעוֹלָם
  choice: mula pa noong unang panahon
  rationale: Ipinahahayag ang malayong nakaraan nang hindi ipinipilit kung ang tinutukoy ay sinaunang panahon o walang hanggang tagal.
- source_word: הֵמָּה
  choice: ang mga ito ay
  rationale: Tumutukoy pabalik sa mga habag at tapat na pag-ibig; hayag na inilalagay ang kopula para sa natural na Filipino.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na halinhan ng titulo.
- issue: Saklaw ng panahon sa מֵעוֹלָם
  choice: mula pa noong unang panahon
  alternative: mula pa sa walang hanggan
  rationale: Maaaring tumukoy ang parirala sa malayong nakaraan o sa walang hanggang tagal. Pinananatili ng pangunahing salin ang kontekstuwal na diwa ng sinaunang panahon, habang inilalahad sa talababa ang mas malakas na alternatibo.
- issue: Bilang ng וַחֲסָדֶיךָ
  choice: pang-isahang kolektibong “tapat na pag-ibig”
  alternative: mga tapat na pag-ibig / mga gawa ng tapat na pag-ibig
  rationale: Plural ang Hebreo, ngunit hindi natural sa Filipino ang “mga pag-ibig” sa ganitong gamit. Ang pang-isahan ay idiomatiko, at ang pormang plural ay hindi ikinukubli kundi itinatala sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa panalangin. Ginamit ang “Alalahanin mo” bilang natural na pakiusap, at iniwasan ang arkaikong bokabularyo. Ang mga talababa ay nagpapanatili sa mahahalagang leksikal at temporal na alternatibo.
