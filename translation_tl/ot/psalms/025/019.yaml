  yaml_path: translation/ot/psalms/025/019.yaml
  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: tl
  text: Tingnan mo ang aking mga kaaway, sapagkat napakarami nila; at marahas ang kanilang pagkapoot sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at kinapopootan nila ako nang may poot ng karahasan.” Idiniriin ng Hebreong pananalita ang marahas at walang-awang katangian ng kanilang pagkapoot.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pautos na panlalaking isahan ng ראה na nakatuon sa Diyos sa isang panalangin. Pinananatili ng “Tingnan mo” ang tuwirang pakiusap sa natural na modernong Tagalog.
- source_word: אוֹיְבַי
  choice: ang aking mga kaaway
  rationale: Tuwirang salin ng pangngalang may hulaping unang panauhang isahan; malinaw at karaniwang katawagan ang “mga kaaway.”
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikilala nito ang dahilan ng pakiusap: hinihiling ng salmista na tingnan ng Diyos ang kanyang mga kaaway dahil napakarami nila.'
- source_word: רָבּוּ
  choice: napakarami nila
  rationale: Ang Qal perfect ng רבה ay naglalarawan dito sa malaking bilang ng mga kaaway. Likas at mariing ipinahahayag ito ng “napakarami nila.”
- source_word: וְשִׂנְאַת חָמָס שְׂנֵאוּנִי
  choice: at marahas ang kanilang pagkapoot sa akin
  rationale: Pinananatili ang marahas o brutal na katangian ng חָמָס at ang diin ng magkaugnay na pangngalan at pandiwang mula sa ugat שנא, habang iniiwasan ang di-likas na pag-uulit sa Tagalog.
