  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: tl
  text: 'Ni David.[a]


    Sa iyo, Yahweh, itinataas ko ang aking kaluluwa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Para kay David” o “Ukol kay David.” Hindi ganap na tinutukoy ng Hebreo ang uri ng kaugnayan ng awit kay David.
    reason: source_ambiguity
  - marker: b
    text: Maaari ring “aking buhay” o “aking buong sarili.” Ang Hebreong salita para sa “kaluluwa” (nefesh) ay maaaring tumukoy sa buong pagkatao, hindi lamang sa bahaging di-nakikita.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ni David
  rationale: Likas at maikli itong anyo para sa pamagat ng awit. Maaaring magpahiwatig ang pang-ukol na לְ ng pagkakatha, pag-uukol, o kaugnayan, kaya inilagay sa talababa ang ibang posibilidad.
- source_word: אֵלֶיךָ
  choice: Sa iyo
  rationale: Tuwirang isinasalin ang direksiyon ng panalangin at pinananatili ang pagbibigay-diin sa Diyos sa unahan ng pangungusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng titulong Panginoon.
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Pinananatili ang tradisyonal at kongkretong larawan ng Hebreo, habang nililinaw sa talababa na ang נֶפֶשׁ ay maaari ring tumukoy sa buhay o buong sarili.
- source_word: אֶשָּׂא
  choice: itinataas ko
  rationale: Tapat sa larawang 'inaangat/itinataas' at natural sa marangal na wikang panalangin sa Filipino.
theological_decisions:
- issue: Saklaw ng נֶפֶשׁ
  choice: kaluluwa, na may paliwanag sa talababa
  alternative: buhay ko; buong sarili ko
  rationale: Hindi nililimitahan ang salitang Hebreo sa di-materyal na bahagi ng tao; pinananatili ang matalinghagang pananalita at ang mas malawak na saklaw nito.
- issue: Kahulugan ng לְ sa pamagat
  choice: Ni David, na may alternatibo sa talababa
  alternative: Para kay David; ukol kay David
  rationale: Karaniwang ipinahihiwatig nito ang kaugnayan kay David at madalas ay pagkakatha, ngunit hindi ganap na tinutukoy ng anyong Hebreo ang eksaktong uri ng kaugnayan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikli at panalanging ayos ng Hebreo, pati ang personal na pangalang Yahweh at ang matalinghagang “itinataas ko ang aking kaluluwa.”
