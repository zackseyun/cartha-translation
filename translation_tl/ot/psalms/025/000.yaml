  source_fidelity: 'Tapat ang salin sa Hebreo: ang לְדָוִד ay maingat na ibinigay bilang pamagat na “Ni David,” ang אֵלֶיךָ ay “Sa iyo,” ang pandiwang אֶשָָּׂא ay “itinataas ko,” at ang נַפְשִׁי ay pinanatiling “aking kaluluwa.” Ang footnote sa נֶפֶשׁ ay wastong pumipigil sa labis na makitid na pagbasa nito bilang tanging di-materyal na bahagi ng tao.'
  naturalness: 'Natural at marangal ang modernong Filipino: “Sa iyo, Yahweh, itinataas ko ang aking kaluluwa.” Ang ayos na inuuna ang “Sa iyo” ay angkop sa panalanging tono at sa pagbibigay-diin ng Hebreo.'
