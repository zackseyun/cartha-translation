base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: tl
  text: 'Ipaalam mo sa akin ang iyong mga daan[a], O Yahweh;

    ituro mo sa akin ang iyong mga landas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ipaalam mo sa akin” ay literal na “pangyarihin mong malaman ko”; tradisyonal na isinasalin na “ipakita mo sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: iyong mga daan
  rationale: Pinananatili ng “mga daan” ang konkretong metapora ng Hebreo para sa mga paraan o landasin ni Yahweh nang hindi ito nililimitahan sa asal lamang.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo, at ipinahihiwatig ng “O” ang tuwirang pagtawag sa panalangin.
- source_word: הוֹדִיעֵנִי
  choice: Ipaalam mo sa akin
  rationale: Sinasalamin nito ang causative na anyo ng ידע, “pangyarihin mong malaman ko” o “ipaalam sa akin,” sa natural na makabagong Tagalog.
- source_word: אֹרְחוֹתֶיךָ
  choice: iyong mga landas
  rationale: Ang “mga landas” ay nagpapanatili sa bahagyang pagkakaiba nito sa דֶּרֶךְ at sa paralelismong patula ng talata.
- source_word: לַמְּדֵנִי
  choice: ituro mo sa akin
  rationale: Ito ang tuwiran at natural na salin ng Piel imperative na may unang panauhang isahan na hulapi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: O Yahweh
  alternative: O PANGINOON
  rationale: Personal na pangalan ang tahasang ginagamit sa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatugmang metapora ng “mga daan” at “mga landas,” gayundin ang anyong panalangin at tuwirang pagtawag kay Yahweh.
