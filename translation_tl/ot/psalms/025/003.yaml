  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: tl
  text: Tunay, walang sinumang naghihintay sa iyo[a] ang mapapahiya; mapapahiya ang mga nagtataksil nang walang dahilan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umaasa sa iyo.” Ang pandiwang Hebreo ay nangangahulugang paghihintay na may pag-asam.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga nagtataksil nang walang kabuluhan” o “ang mga nagtataksil para sa wala.” Maaaring unawain sa higit sa isang paraan ang salitang Hebreo na רֵיקָם; dito, isinalin itong “nang walang dahilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Tunay
  rationale: Dito, nagbibigay ang גַּם ng diin sa pahayag sa halip na simpleng pagdaragdag; natural itong naipahahayag ng “Tunay” sa marangal na makabagong Tagalog.
- source_word: כָּל ... לֹא
  choice: walang sinuman
  rationale: Ang literal na ayos na “lahat ... ay hindi” ay likas na ipinahahayag sa Tagalog bilang “walang sinuman,” habang pinananatili ang pangkalahatang pagtanggi.
- source_word: קֹוֶיךָ
  choice: naghihintay sa iyo
  rationale: Ang קוה ay paghihintay na may pag-asam. Pinananatili ng “naghihintay sa iyo” ang tuwirang larawan, habang ipinapaliwanag sa talababa ang diwa ng pag-asa.
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: mapapahiya / mapapahiya
  rationale: Ang בוש ay tumutukoy sa pagdanas ng kahihiyan o pagkabigo sa harap ng iba. Ang pag-uulit ng iisang salin ay nagpapanatili sa matinding pagtutulad at pagsalungat ng dalawang linya.
- source_word: הַבּוֹגְדִים
  choice: ang mga nagtataksil
  rationale: Ipinapakita ng participle ang patuloy o kinaugaliang pagkilos nang walang katapatan; malinaw at natural ang aktibong pariralang “mga nagtataksil.”
- source_word: רֵיקָם
  choice: nang walang dahilan
  rationale: Maaaring tumukoy ang רֵיקָם sa pagkilos nang walang sapat o makatarungang dahilan. Ang saling ito ay angkop sa konteksto ngunit pinananatili sa talababa ang tunay na ibang pagbasa.
