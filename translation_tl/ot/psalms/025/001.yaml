id: PSA.25.1
reference: Psalms 25:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: tl
  text: 'Kay David.


    Sa iyo, Yahweh, itinataas ko ang aking kaluluwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking buhay,” “aking sarili,” o “buong pagkatao.” Ang Hebreong salita para sa “kaluluwa” (nefesh) ay maaaring tumukoy sa buong tao, hindi lamang sa bahaging di-materyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Ang ל na may kasunod na pangalang David sa pamagat ng awit ay nagpapahiwatig ng kaugnayan kay David. Pinananatili ng “Kay David” ang pagiging bukás nito sa pagkakatha, pag-aalay, o ibang kaugnayan, at hindi nagdaragdag ng salitang “awit” na wala sa Hebreo.
- source_word: אֵלֶיךָ
  choice: Sa iyo
  rationale: Tuwirang katumbas ito ng אֶל na may hulaping pangalawang panauhang panlalaki at angkop sa natural na makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: נַפְשִׁי
  choice: ang aking kaluluwa
  rationale: Malawak ang saklaw ng נֶפֶשׁ at maaari itong tumukoy sa kaluluwa, buhay, sarili, o buong pagkatao. Pinananatili ng “aking kaluluwa” ang metapora at tradisyonal na bigat ng panalangin nang hindi nililimitahan ang kahulugan.
- source_word: אֶשָּׂא
  choice: itinataas ko
  rationale: Ang anyong Qal na ito ng נָשָׂא ay nangangahulugang “itinataas ko” o “dinadala ko.” Sa pariralang ito, natural na pinananatili ng “itinataas ko” ang larawan ng pagtitiwala at pagharap sa Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng נֶפֶשׁ sa panalangin
  choice: kaluluwa, na may talababa tungkol sa “buhay,” “sarili,” o buong pagkatao
  alternative: buhay ko; sarili ko
  rationale: Hindi tiyak na tumutukoy lamang ang salita sa di-materyal na bahagi ng tao. Pinananatili sa teksto ang Hebreong metapora at ipinababatid sa talababa ang mas malawak na saklaw nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Kay David” bilang maikli at neutral na pamagat; ang ayos na “Sa iyo, Yahweh” ay nagpapanatili sa diin ng Hebreo. Hindi ginamit ang bokatibong “O” dahil hindi ito tahasang nasa Hebreo at mas natural sa kasalukuyang Tagalog ang tuwirang pagtawag na “Yahweh.”
