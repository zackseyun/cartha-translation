  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: tl
  text: Punuin mo ng kahihiyan ang kanilang mga mukha, upang hanapin nila ang pangalan mo[a], Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at hanapin nila ang pangalan mo”; maaaring unawain ang pandiwang Hebreo bilang payak na pagpapatuloy, bagaman malamang na layunin o bunga ang ipinahahayag dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Punuin mo
  rationale: Ang Piel imperative na panlalaking isahan ay tuwirang pakiusap sa Diyos; pinananatili ng “Punuin mo” ang larawan at lakas ng Hebreo.
- source_word: פְנֵיהֶם
  choice: ang kanilang mga mukha
  rationale: Tuwirang inililipat ang pangmaramihang anyo at pinananatili ang larawan ng hayag at nakikitang pagkapahiya.
- source_word: קָלוֹן
  choice: kahihiyan
  rationale: Saklaw nito ang hiya, kasiraang-puri, at pagkapahiya nang hindi nililimitahan ang salita sa panlabas na dungis lamang.
- source_word: וִיבַקְשׁוּ
  choice: upang hanapin nila
  rationale: Ang imperfect na may waw pagkatapos ng pautos ay malamang na nagsasaad ng layunin o bunga; likas sa Tagalog ang “upang” para rito, habang itinatala sa talababa ang posibleng payak na pagpapatuloy.
- source_word: שִׁמְךָ
  choice: ang pangalan mo
  rationale: Pinananatili ang biblikal na larawan ng pangalan bilang pahayag ng pagkakakilanlan at reputasyon ng Diyos nang hindi ito labis na ipinapaliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Layunin o bunga ng kahihiyang hinihiling sa Diyos
  choice: Iniuugnay ang kahihiyan sa layuning hanapin nila ang pangalan ni Yahweh.
  alternative: “at hanapin nila ang pangalan mo,” bilang payak na pagpapatuloy o kasunod na pakiusap.
  rationale: Karaniwang maaaring magpahayag ng layunin o bunga ang Hebreong imperfect na may waw kasunod ng pautos. Pinananatili ng saling ito ang tensiyon na ang hatol ay maaaring humantong sa paghahanap o pagkilala sa Diyos, nang hindi ipinahihiwatig na tiyak ang tunay na pagsisisi.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Punuin mo” upang mapanatili ang konkretong larawan ng Hebreo, at “upang” para sa malamang na layunin o bunga. Inilagay ang pananda ng talababa pagkatapos ng buong pangungusap.
