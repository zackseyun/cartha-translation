lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng panawagan ng salmista sa kalapit na konteksto.
- source_word: נוֹעֲצוּ
  choice: magsabwatan
  rationale: Ang Niphal ng יעץ ay nagpapahiwatig ng sama-samang pagpapayo o pagpaplano; sa kontekstong hayagang laban sa Diyos, likas na ipinahahayag ng “magsabwatan” ang masamang layunin.
- source_word: לֵב יַחְדָּו
  choice: nagkaisa sila
  rationale: Inihahatid sa natural na modernong Tagalog ang larawan ng iisang puso, samakatuwid ay nagkakaisang kalooban o layunin, nang hindi inuulit nang alanganin ang ideya ng sama-samang pagkilos.
- source_word: עָלֶיךָ
  choice: laban sa iyo
  rationale: Ang עַל ay may malinaw na diwang pasalungat sa konteksto ng mapanlabang pagpaplano at pakikipagtipan.
- source_word: בְּרִית
  choice: tipan
  rationale: Ang “tipan” ang tuwirang katumbas na nagpapanatili sa pormal at nagbibigkis na katangian ng kasunduan.
- source_word: יִכְרֹתוּ
  choice: nakikipagtipan sila
  rationale: Ang idyomang כרת ברית, literal na “pumutol ng tipan,” ay natural na ipinahahayag sa Tagalog bilang “makipagtipan.” Ang anyong di-ganap ay hinayaang may aspektong nagpapatuloy o kasalukuyang inilalarawan.
theological_decisions:
- issue: Paglalarawan sa mapanlabang tipan laban sa Diyos
  choice: laban sa iyo ay nakikipagtipan sila
  alternative: bumubuo sila ng alyansa laban sa iyo
  rationale: Pinananatili ng “tipan” ang bigat at pormal na diwa ng בְּרִית, samantalang malinaw na inilalahad ng “laban sa iyo” ang paghihimagsik na nasa konteksto nang hindi ito pinahihina bilang karaniwang koordinasyong pampolitika.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magsabwatan” upang maipakita ang mapanlabang sama-samang pagpaplano, at “nakikipagtipan” upang mapanatili ang bokabularyong biblikal nang natural sa Tagalog.
