  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: tl
  text: Sa gayon, habulin mo sila sa iyong unos, at sindakin mo sila sa iyong bagyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa ganitong paraan, habulin mo sila sa iyong unos, at sa iyong ipo-ipo ay sindakin mo sila.”
    reason: Alternatibong salin ng כֵּן bilang “Sa ganitong paraan” at ng סוּפָה bilang “ipo-ipo.”
lexical_decisions:
- source_word: כֵּן
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang larawan at natural na ipinahahayag sa Tagalog ang hinihiling na kaukulang pagkilos; maaari rin itong mangahulugang “sa ganitong paraan.”
- source_word: תִּרְדְּפֵם
  choice: habulin mo sila
  rationale: Ang רדף ay karaniwang nangangahulugang humabol o tumugis. Ang “habulin” ay malinaw, natural, at angkop sa masidhing panalangin ng salmo.
- source_word: בְּסַעֲרֶךָ
  choice: sa pamamagitan ng iyong unos
  rationale: Ipinakikita ng בְּ dito ang kasangkapan o paraang ginagamit sa paghabol. Ang “unos” ay marangal at makatang salitang tumutukoy sa malakas na bagyo.
- source_word: וּבְסוּפָתְךָ
  choice: sa iyong bagyo
  rationale: Ang סוּפָה ay isang marahas na bagyo o ipo-ipo. Pinananatili ng “bagyo” ang kaugnay ngunit hindi lubusang magkaparehong larawan ng dalawang salitang Hebreo.
- source_word: תְבַהֲלֵם
  choice: sindakin mo sila
  rationale: Sa piel, ang בהל ay nangangahulugang magdulot ng matinding takot o pagkataranta. Ang “sindakin” ay tuwiran at nagpapanatili sa lakas ng pakiusap.
theological_decisions:
- issue: Pagkilos ng Diyos sa panalanging humihingi ng hatol
  choice: Pinanatili ang tuwirang pakiusap na habulin at sindakin ng Diyos ang mga kaaway.
  alternative: “Nawa’y habulin mo sila … at nawa’y sindakin mo sila …”
  rationale: Sa konteksto ng panalangin, ang mga imperfect na pandiwa sa Hebreo ay may puwersang jussive. Natural sa makatang Tagalog ang pautos na anyong ginagamit bilang tuwirang pakiusap sa Diyos, nang hindi pinahihina ang tensiyong teolohikal ng salmo.
translation_notes:
  register: Modernong Filipino na may dignidad at makatang tindi. Ginamit ang “unos” upang maiba sa “bagyo,” samantalang inilagay sa talababa ang mas tiyak na “ipo-ipo” bilang posibleng salin ng סוּפָה.
