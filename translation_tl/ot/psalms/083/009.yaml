translation:
  language: tl
  text: Gawin mo sa kanila ang ginawa mo sa Midian[a], at kina Sisera at Jabin sa Ilog Kishon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “Gawin mo sa kanila tulad ng Midian, tulad ni Sisera, tulad ni Jabin, sa Ilog Kishon.” Ipinahihiwatig lamang sa Hebreo ang “ang ginawa mo.”'
    reason: lexical_alternative
  - marker: b
    text: Tingnan ang Mga Hukom 4:7, 13; 5:21 tungkol sa pagkatalo nina Sisera at Jabin sa Kishon.
    reason: cross_reference
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Gawin mo sa kanila
  rationale: Pinananatili ang tuwirang pautos at ang natural na ugnayan ng pandiwa at panghalip; ipinahihiwatig ng konteksto ang pagkilos laban sa mga kaaway nang hindi idinaragdag ang salitang “laban.”
- source_word: כְּמִדְיָן
  choice: ang ginawa mo sa Midian
  rationale: Ginagawang malinaw sa natural na Tagalog ang pahapyaw na paghahambing sa Hebreo. Ang “Midian” ay tumutukoy sa bayan o pangkat na dating tinalo ng Diyos.
- source_word: כְּסִיסְרָא כְיָבִין
  choice: gayundin kina Sisera at Jabin
  rationale: Ang “kina” ay angkop sa dalawang pangalang pantangi at nagpapanatili sa magkakatulad na paghahambing, habang umaasa sa pandiwang nauna.
- source_word: בְּנַחַל קִישׁוֹן
  choice: sa Ilog Kishon
  rationale: Ang נחל ay maaaring tumukoy sa batis, ilog, o agos sa lambak. Ang “Ilog Kishon” ang natural at nakikilalang katawagan sa modernong Tagalog para sa pinangalanang daluyan ng tubig.
theological_decisions:
- issue: Ipinahiwatig ngunit hindi tahasang inuulit na pagkilos ng Diyos sa mga paghahambing
  choice: 'Isinaad lamang nang buo sa unang paghahambing: “ang ginawa mo sa Midian,” at ginamit ang “gayundin” para kina Sisera at Jabin.'
  alternative: Literal na “tulad ng Midian, tulad ni Sisera, tulad ni Jabin.”
  rationale: Nililinaw nito ang hinihiling na pag-uulit ng nakaraang pagliligtas o paghatol nang hindi tinutukoy nang higit sa sinasabi ng konteksto kung ano mismo ang dapat gawin.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Tagalog. Ginamit ang “Ilog Kishon” bilang natural na pangalang heograpiko at ang “kina” para sa magkasamang pagtukoy kina Sisera at Jabin.
