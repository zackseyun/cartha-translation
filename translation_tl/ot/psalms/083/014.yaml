  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: tl
  text: 'Gaya ng apoy na tumutupok sa kagubatan,

    at gaya ng liyab na nagpapalagablab sa mga bundok,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: Gaya ng apoy
  rationale: Ang unlaping כ ay naghahayag ng paghahambing; natural at malinaw sa makabagong Filipino ang “gaya ng apoy.”
- source_word: תִּבְעַר
  choice: na tumutupok
  rationale: Ang Qal ng בער ay tumutukoy sa pagkasunog ng kagubatan. Ipinahihiwatig ng “tumutupok” ang mapaminsalang paglamon ng apoy nang hindi lumalayo sa larawan ng Hebreo.
- source_word: יָעַר
  choice: sa kagubatan
  rationale: Ang יער ay “gubat/kagubatan.” Ang “kagubatan” ay dignified at angkop sa tulang biblikal.
- source_word: וּ/כְ/לֶהָבָה
  choice: at gaya ng liyab
  rationale: Pinananatili ang magkatulad na paghahambing at ang pagtutumbas ng “apoy” at “liyab.”
- source_word: תְּלַהֵט
  choice: na nagpapalagablab
  rationale: Ang Piel ng להט ay masidhi o sanhiang pagkasunog; ipinapahayag ng “nagpapalagablab” ang matinding pagliyab ng mga bundok.
- source_word: הָרִים
  choice: sa mga bundok
  rationale: Tuwirang katumbas ng pangmaramihang הָרִים; ang pariralang Filipino ay likas sa pandiwang “nagpapalagablab.”
