base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: tl
  text: Gawin mong tulad nina Oreb at Zeeb ang kanilang mga maharlika, at tulad nina Zeba at Zalmunna[a] ang lahat ng kanilang mga prinsipe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sina Oreb at Zeeb ay mga pinunong Midianita na natalo sa Hukom 7:25; sina Zeba at Zalmunna naman ay mga haring Midianita na natalo sa Hukom 8:5–21.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Gawin mong
  rationale: Ang pautos na anyo ay nakatuon sa Diyos. Likas sa Tagalog ang “gawin mong tulad” upang ihayag ang hinihinging paghahambing.
- source_word: נְדִיבֵמוֹ
  choice: kanilang mga maharlika
  rationale: Tumutukoy ang נָדִיב sa mga taong may mataas na katayuan o mga prominenteng pinuno. Pinananatili ng “mga maharlika” ang kaibhan nito sa נְסִיכֵמוֹ.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: tulad nina Oreb at Zeeb
  rationale: Mga pangalang pantangi ang Oreb at Zeeb. Ang “nina” ay likas na panandang Tagalog para sa dalawang taong pinaghahambingan.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: tulad nina Zeba at Zalmunna
  rationale: Pinanatili bilang mga pangalang pantangi ang dalawang pinunong Midianita; hindi na kailangang ulitin ang “tulad” bago ang ikalawang pangalan sa natural na Tagalog.
- source_word: כָּל
  choice: lahat
  rationale: Tahasang pinananatili ang kabuuang saklaw ng panalangin laban sa mga pinuno ng kaaway.
- source_word: נְסִיכֵמוֹ
  choice: lahat nilang prinsipe
  rationale: Ang נָסִיךְ ay pinuno, prinsipe, o nakatalagang tagapamahala. Pinananatili ng “mga prinsipe” ang mataas na pampolitikang diwa at ang pagkakaiba nito sa “mga maharlika.”
theological_decisions:
- issue: Makasaysayang pagtukoy sa loob ng panalanging humihingi ng paghatol
  choice: Pinananatili ang apat na pangalan bilang huwaran ng sinapit ng mga dating kaaway ng bayan ng Diyos.
  alternative: Unawain ang mga pangalan bilang pangkalahatang halimbawa lamang ng mga natalong kaaway.
  rationale: Tiyak na mga pinunong Midianita sa Hukom 7–8 sina Oreb, Zeeb, Zeba, at Zalmunna. Ang pagpapanatili sa kanilang mga pangalan ay naghahayag ng pag-apela ng salmista sa naunang pagliligtas at paghatol ng Diyos nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang likas na ayos na “Gawin mong tulad nina…” at pinanatili ang magkaibang katawagang “mga maharlika” at “mga prinsipe” upang katawanin ang paralelismo at leksikal na pagkakaiba sa Hebreo.
