translation:
  language: tl
  text: Laban sa iyong bayan ay palihim silang nagpapakana; nagsasanggunian sila laban sa mga iniingatan mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ikinubli mo” o “mga itinatangi mo.” Maaaring tumukoy ang Hebreo sa mga itinago o iningatan sa ligtas na lugar, at maaari ring magpahiwatig ng mga pinahahalagahan bilang kayamanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: palihim silang nagpapakana
  rationale: Pinagsasama nito ang tuso at mapanlinlang na pagkilos ng Hiphil ng ערם at ang lihim na payo o balak na ipinahihiwatig ng סוֹד. Natural itong pakinggan sa modernong Filipino at malinaw ang masamang layunin nang hindi labis na pinatitindi ang diwa.
- source_word: וְיִתְיָעֲצוּ
  choice: nagsasanggunian sila
  rationale: Ipinapahayag ng anyong Hitpael ang sama-sama o kapuwa isinasagawang pagsangguni. Pinananatili ng salin ang diwang ito nang hindi agad pinipili ang mas interpretatibong “nagsasabwatan.”
- source_word: עַל עַמְּךָ
  choice: laban sa iyong bayan
  rationale: Sa konteksto ng mapanlabang pagpapakana, ang עַל ay nagpapahiwatig ng pagsalungat. Ang “bayan” ay angkop at marangal na salin ng עַם para sa sambayanan ng Diyos.
- source_word: צְפוּנֶיךָ
  choice: mga iniingatan mo
  rationale: Ang salita mula sa צפן ay maaaring tumukoy sa mga ikinubli, iningatan, o itinuring na kayamanan. Ang “mga iniingatan mo” ay natural sa Filipino at pinananatili ang posibilidad ng pagkukubli para sa kaligtasan, habang ang higit na literal na alternatibo ay nasa talababa.
theological_decisions:
- issue: Kahulugan ng צְפוּנֶיךָ kaugnay ng bayan ng Diyos
  choice: mga iniingatan mo
  alternative: mga ikinubli mo; mga itinatangi mo
  rationale: Hindi tiyak kung pangunahing binibigyang-diin ng Hebreo ang pagiging nakatago, ligtas na iniingatan, o pinahahalagahan bilang kayamanan. Pinili ang “mga iniingatan mo” dahil naipahihiwatig nito ang pangangalaga nang hindi itinatakda ang isang partikular na doktrinal na paliwanag; pinananatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Inuna ang pariralang “Laban sa iyong bayan” upang bahagyang mapanatili ang diin ng Hebreo. Ang “palihim silang nagpapakana” ay malinaw sa karaniwang mambabasa at tumutugma sa paralelismong “nagsasanggunian sila.”
