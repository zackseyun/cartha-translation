  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: tl
  text: Nalipol sila sa En-dor[a]; naging dumi sila para sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ng En-dor” o “malapit sa En-dor.” Maaaring ipahayag ng pang-ukol sa Hebreo ang ilang magkakalapit na ugnayang panlunan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naging dumi sila sa ibabaw ng lupa.” Sa literal, “naging dumi sila para sa lupa,” isang larawang nagpapahiwatig na ang kanilang mga bangkay ay naging dumi o pataba para sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: nalipol sila
  rationale: Ipinahahayag ng Nifal perfect ng שׁמד ang pagkalipol o lubusang pagkawasak. Likas sa modernong Tagalog ang “nalipol sila” at napananatili nito ang resultang dinanas ng simuno.
- source_word: בְּעֵין דֹּאר
  choice: sa En-dor
  rationale: Ang בְּ ay lokatibo rito. Sapat na maluwag ang “sa” upang masaklaw ang ‘sa loob,’ ‘sa lugar,’ o ‘malapit sa’ En-dor nang hindi nagpapanggap ng labis na katiyakan.
- source_word: הָיוּ
  choice: naging
  rationale: Bagaman maaaring mangahulugang ‘sila ay,’ ang היה na may pangngalang panaguri ay maaaring magpahayag ng pagpasok sa isang kalagayan; malinaw itong naihahatid ng “naging.”
- source_word: דֹּמֶן
  choice: dumi
  rationale: Tumutukoy ang salita sa dumi o pataba mula sa hayop. Pinananatili ng “dumi” ang marahas na larawan ng kahihiyan at pagkabulok habang nananatiling angkop sa marangal na rehistro ng salmo.
- source_word: לָאֲדָמָה
  choice: para sa lupa
  rationale: Ang אֲדָמָה ay lupa o ground, at pinananatili ng “para sa lupa” ang di-karaniwang ugnayang ipinahahayag ng ל, sa halip na agad itong pakinisin bilang ‘sa ibabaw ng lupa.’
