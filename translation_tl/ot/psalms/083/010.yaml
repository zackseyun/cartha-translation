translation_notes:
  register: Modernong Filipino Tagalog na maikli, tuwiran, at marangal. Pinanatili ang matinding larawan ng Hebreo at ang kalabuan ng mga pang-ukol, habang iniwasan ang sobrang kolokyal na “tae” at ang pagpapalabnaw ng larawan bilang “pataba” lamang.
