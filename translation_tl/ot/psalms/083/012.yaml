  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: tl
  text: na nagsabi, “Akinin natin ang mga pastulan ng Diyos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tahanan ng Diyos” o “mga dakong tirahan ng Diyos.”
