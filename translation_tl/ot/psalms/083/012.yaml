lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: na nagsabi
  rationale: Ang pariralang panaguri ay nag-uugnay sa mga kaaway na binanggit sa naunang konteksto; natural sa Filipino ang “na nagsabi.”
- source_word: נִירֲשָׁה
  choice: Kunin nating pag-aari
  rationale: Ipinahahayag ng cohortative na anyo ang sama-samang hangaring ariin o kamkamin ang lupain. Nananatili rito ang diwang pagkuha ng pag-aari nang hindi nililimitahan sa mana lamang.
- source_word: לָּנוּ
  choice: nating
  rationale: Ipinahihiwatig ng panghalip na ang pagkuha ay para sa kanila mismo; likas itong naipapahayag sa Filipino sa “nating” kasama ng “pag-aari.”
- source_word: נְאוֹת
  choice: mga pastulan
  rationale: Maaaring tumukoy ang salita sa mga pastulan, tahanan, o dakong tirahan. Pinananatili ng “mga pastulan” ang kongkretong larawan at ang maramihang anyo ng Hebreo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Malinaw sa konteksto ng salmo na ang tinutukoy ay ang Diyos ng Israel, kaya isahan ang salin.
theological_decisions:
- issue: Kahulugan ng נְאוֹת אֱלֹהִים
  choice: mga pastulan ng Diyos
  alternative: mga tahanan ng Diyos / mga dakong tirahan ng Diyos
  rationale: Maaaring ilarawan ng parirala ang lupaing pag-aari ng Diyos, ang mga tahanan, o mga dakong tirahan. Pinananatili ng pangunahing salin ang larawan ng Hebreo, habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ang “Kunin nating pag-aari” ay malinaw sa karaniwang mambabasa at angkop sa mapanlupig na hangarin ng mga nagsasalita. Inilagay ang pananda ng talababa pagkaraan ng pariralang may leksikal na kalabuan.
