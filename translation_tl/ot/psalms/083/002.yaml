  language: tl
  text: Sapagkat narito, nagkakagulo ang iyong mga kaaway, at itinataas ng mga napopoot sa iyo ang kanilang mga ulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “taas-noo ang mga napopoot sa iyo”; ipinahihiwatig nito ang mapaghamong pagmamataas.
    reason: Pinananatili ng pangunahing salin ang literal na larawan ng Hebreo, habang inilalahad ng talababa ang posibleng idyomatikong diwa nang hindi ito ipinipilit bilang tanging kahulugan.
lexical_decisions:
- source_word: יֶהֱמָיוּן
  choice: nag-iingay
  rationale: Inilalarawan ng pandiwa ang maingay at magulong pagkilos o pag-ungol; natural na naihahatid ng “nag-iingay” ang larawan nang hindi labis na tinutukoy ang uri ng kaguluhan.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: nagmamatigas
  rationale: Ang literal na idyomang “itinaas ang ulo” ay tumutukoy dito sa mapanghamon at palalong pagkilos. Pinili ang natural na idyomang Filipino na nagpapahayag ng tahasang pagsalungat.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na ikalawang panauhan
  choice: iyong mga kaaway / napopoot sa iyo
  alternative: mga kaaway at napopoot sa Diyos
  rationale: Pinananatili ang tuwirang pakikipag-usap ng salmista sa Diyos, gaya ng nasa Hebreo, sa halip na palitan ang panghalip ng tahasang pangngalan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa panulaang panalangin. Ginamit ang “Sapagkat tingnan mo” upang mapanatili ang כִּי הִנֵּה bilang pagbibigay-dahilan na may panawag-pansin.
