base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: tl
  text: Malaman nawa nila na ikaw lamang, na ang pangalan ay Yahweh[a], ang Kataas-taasan sa ibabaw ng buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring anyuing “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Malaman nawa nila
  rationale: Ang Qal imperfect na may pang-ugnay ay nasa konteksto ng panalangin o kahilingan. Ipinahahayag ng “nawa” ang hangaring malaman nila, sa halip na gawing payak na pahayag tungkol sa hinaharap.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng dapat nilang malaman.
- source_word: שִׁמְךָ יְהוָה
  choice: na ang pangalan ay Yahweh
  rationale: Pinananatili ng pariralang paningit ang pagkakakilanlan ng kinakausap ayon sa kaniyang personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לְבַדֶּךָ
  choice: ikaw … lamang
  rationale: Ipinahahayag nito ang mariing pagiging bukod-tangi ng kinakausap; natural sa Filipino ang hulma na “ikaw lamang ang…”
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Ito ang malinaw at kinikilalang katumbas sa Filipino ng titulong nagsasaad ng kataas-taasang kalagayan.
- source_word: עַל כָּל הָאָרֶץ
  choice: sa buong lupa
  rationale: Dito, ang עַל ay nagpapahiwatig ng paghahari o kataasan sa ibabaw ng lahat, at ang הָאָרֶץ ay may pandaigdigang saklaw.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan at hindi ito pinapalitan ng titulong “PANGINOON”; inilalagay sa talababa ang kilalang alternatibong anyong “Jehova.”
- issue: Saklaw ng pagiging Kataas-taasan
  choice: ikaw … lamang ang Kataas-taasan
  alternative: ikaw ang Kataas-taasan nang nag-iisa
  rationale: Pinananatili nito ang eksklusibong diin ng לְבַדֶּךָ nang hindi nagpapasya nang higit sa sinasabi ng teksto kung ang diin ay nasa persona o sa predikasyong “Kataas-taasan.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang likas na maipahayag ang himig ng panalangin, at mga gitling upang malinaw na maitanghal ang pariralang tumutukoy sa banal na pangalan nang hindi nawawala ang diin sa “ikaw lamang.”
