translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng talaan at ang pagkakaiba ng pangalang-rehiyon na “Filistia” sa tahasang katawagan sa mga tao. Itinama ang pagkakalagay ng mga panandang talababa upang ang tala tungkol sa Byblos ay sumunod sa Gebal at ang alternatibong “mga Filisteo” ay sumunod sa Filistia.
