  text: Gebal[a], Ammon, and Amalek[b]; Philistia with the inhabitants of Tyre.
translation:
  language: tl
  text: Ang Gebal[a], Ammon, at Amalek; ang Filistia[b], kasama ang mga naninirahan sa Tiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang Gebal sa lungsod ng Fenicia na kaugnay ng Byblos.
    reason: cultural_note
  - marker: b
    text: O “ang mga Filisteo,” kung ang pangalan ng rehiyon ay ginagamit bilang pantukoy sa mga naninirahan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבָל
  choice: Gebal
  rationale: Pinanatili ang anyong Hebreo ng pangalang-pook; posibleng tumukoy ito sa lungsod ng Fenicia na kilala bilang Byblos.
- source_word: וְעַמּוֹן
  choice: Ammon
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng bayan o lupain.
- source_word: וַעֲמָלֵק
  choice: Amalek
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pambansa.
- source_word: פְּלֶשֶׁת
  choice: Filistia
  rationale: Ang anyong Hebreo ay tahasang tumutukoy sa lupain o rehiyon; pinanatili ito sa halip na tahasang gawing pangalan ng mga tao.
- source_word: עִם
  choice: kasama ang
  rationale: Likas na Filipino para sa pang-ukol na nag-uugnay sa huling pangkat sa talaan.
- source_word: יֹשְׁבֵי צֽוֹר
  choice: mga naninirahan sa Tiro
  rationale: Tuwirang ipinahahayag ang construct phrase na tumutukoy sa mga taong naninirahan sa Tiro.
- source_word: צֽוֹר
  choice: Tiro
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang-pook.
