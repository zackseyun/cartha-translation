lexical_decisions:
- source_word: גַּם
  choice: Maging
  rationale: Ipinahihiwatig dito ang mariing pagdaragdag sa Asiria sa samahan ng mga kaaway, hindi lamang ang payak na “at.”
- source_word: אַשּׁוּר
  choice: Asiria
  rationale: Ito ang karaniwang makabagong Tagalog na pangalan ng bansang tinutukoy sa konteksto.
- source_word: נִלְוָה
  choice: nakisama
  rationale: Ang Niphal ng לוה ay tumutukoy sa paglakip o pagsama; natural na ipinapahayag ng “nakisama” ang pag-anib sa pangkat nang hindi dinaragdagan ng mas tiyak na ideya ng pormal na alyansa.
- source_word: עִמָּם
  choice: sa kanila
  rationale: Tuwirang tumutukoy sa mga bansang naunang binanggit; likas sa Tagalog ang pariralang “nakisama sa kanila.”
- source_word: הָיוּ
  choice: naging
  rationale: Pinananatili nito ang posibleng diwa ng pagganap o pagpasok nila sa papel na inilalarawan ng kasunod na panaguri.
- source_word: זְרוֹעַ
  choice: bisig
  rationale: Pinananatili ang kongkretong metapora ng Hebreo para sa lakas o suportang militar.
- source_word: לִבְנֵי לוֹט
  choice: ng mga anak ni Lot
  rationale: Pinananatili ang Hebreong idyomang pampamilya, na sa konteksto ay tumutukoy sa mga bayang nagmula kay Lot.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa pamamagitan ng transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan o tungkulin nito.
