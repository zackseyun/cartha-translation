translation:
  language: tl
  text: 'Diyos ko, gawin mo silang tulad ng alikabok na ipinapaikot ng hangin[a],

    parang ipa na tinatangay ng hangin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tulad ng gulong.” Ang Hebreong גַּלְגַּל ay maaaring tumukoy sa gulong o sa isang bagay na gumugulong o umiikot. Pinili ng pangunahing teksto ang larawang ng isang magaan na bagay na ipinapaikot ng hangin, kaagapay ng kasunod na larawan ng ipa na tinatangay ng hangin.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong קַשׁ ay mas literal na tumutukoy sa dayami o tuyong pinaggapasan. Ginamit dito ang “ipa” upang ipakita ang magaan na bagay na madaling tangayin ng hangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang panawagan ito na may hulaping unang panauhang isahan; natural at marangal sa modernong Tagalog ang “Diyos ko.”
- source_word: שִׁיתֵמוֹ
  choice: gawin mo sila
  rationale: Sa kontekstong sinusundan ng mga paghahambing, malinaw at natural na ipinahahayag ng “gawin mo sila” ang pakiusap na itulad sila sa mga larawang kasunod.
- source_word: כַגַּלְגַּל
  choice: parang alikabok na ipinipihit ng hangin
  rationale: Ang גַּלְגַּל ay maaaring tumukoy sa gulong o sa isang bagay na gumugulong o umiikot. Pinili ng pangunahing teksto ang larawan ng magaan na bagay na umiikot sa hangin dahil kaagapay nito ang ipang tinatangay, ngunit pinanatili sa talababa ang literal na alternatibong “gulong.”
- source_word: כְּקַשׁ
  choice: parang ipa
  rationale: Bagaman mas literal na dayami o tuyong pinaggapasan ang קַשׁ, ipinahahayag ng “ipa” sa Tagalog ang magaan na basurang agrikultural na madaling tangayin ng hangin; nililinaw ng talababa ang mas literal na kahulugan.
- source_word: לִפְנֵי רוּחַ
  choice: tinatangay nito
  rationale: Likas na Tagalog ito para sa idyomang “sa harap ng hangin,” at ang “nito” ay malinaw na tumutukoy sa hangin sa naunang taludtod nang hindi inuulit ang salita.
