  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: tl
  text: O Diyos[a], huwag kang manatiling tahimik; huwag kang tumahimik, at huwag kang manatiling walang-kibo, O Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang magkaibang titulong Hebreo para sa Diyos ang ginamit sa talatang ito: אֱלֹהִים (’Elohim) sa simula at אֵל (’El) sa hulihan. Ang ikalawa ay maaari ring isaling “Makapangyarihan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag sa Diyos sa isang panalangin; likas at marangal sa modernong Tagalog ang “O Diyos.”
- source_word: אַל דֳּמִי לָךְ
  choice: huwag kang manahimik
  rationale: Ipinahahayag ng parirala ang pakiusap na huwag manatiling tahimik o hindi tumutugon ang Diyos.
- source_word: אַל תֶּחֱרַשׁ
  choice: huwag kang magbingi-bingihan
  rationale: Maaaring tumukoy ang pandiwa sa pagiging bingi o sa pananahimik. Pinananatili ng saling ito ang pagkakaiba nito sa unang pandiwa at ang diwa ng tila hindi pagtugon, habang inilalahad sa talababa ang alternatibo.
- source_word: וְאַל תִּשְׁקֹט
  choice: at huwag kang manatiling walang-kibo
  rationale: Ipinahihiwatig ng שׁקט ang katahimikan, kapanatagan, o kawalan ng pagkilos. Ang “manatiling walang-kibo” ay natural na nagpapahayag dito ng tahimik na hindi pagkilos.
- source_word: אֵל
  choice: O Diyos
  rationale: Ikalawang titulong pantawag sa Diyos sa hulihan ng talata. Ang “O Diyos” ay malinaw at likas; itinatala sa talababa na ibang salitang Hebreo ito at maaari ring magpahiwatig ng “Makapangyarihan.”
theological_decisions:
- issue: Pagpapakahulugan sa tatlong magkakatulad ngunit hindi magkaparehong pakiusap
  choice: manahimik; magbingi-bingihan; manatiling walang-kibo
  alternative: manahimik; manatiling tahimik; manatiling payapa
  rationale: Pinananatili ang tatlong magkahiwalay na pandiwa ng Hebreo at ang tumitinding panawagan, nang hindi ipinapantay ang lahat sa iisang salitang Tagalog.
- issue: Paglilipat sa dalawang titulong אֱלֹהִים at אֵל
  choice: Parehong “Diyos” sa pangunahing teksto
  alternative: Isalin ang אֵל bilang “Makapangyarihang Diyos” o “Makapangyarihan”
  rationale: Parehong tumutukoy sa Diyos sa tuwirang panawagan. Hindi tiyak na kailangang gawing tahasang “Makapangyarihan” ang אֵל rito; pinananatili sa talababa ang leksikal na pagkakaiba.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at panalanging himig. Pinanatili ang tatlong negatibong pakiusap sa Hebreo at gumamit ng mga karaniwang ekspresyong “manahimik,” “magbingi-bingihan,” at “walang-kibo.”
