  yaml_path: translation/ot/psalms/083/004.yaml
  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: tl
  text: Sinasabi nila, “Halikayo, lipulin natin sila upang hindi na sila maging isang bansa, at hindi na kailanman maalaala ang pangalan ng Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְרוּ
  choice: Sinasabi nila
  rationale: Ang Qal perfect ay maaaring tumukoy sa sinabi nila, ngunit sa panulaang diskurso, ang kasalukuyang anyo ay likas na naghahatid ng masigla at patuloy na balak ng mga kaaway.
- source_word: לְכוּ
  choice: Halikayo
  rationale: Ang maramihang pautos ng הלך ay ginagamit dito bilang panghikayat sa magkakasabwat, hindi bilang literal na utos na pumunta sa isang lugar.
- source_word: וְנַכְחִידֵם
  choice: lipulin natin sila
  rationale: Ang Hiphil na anyo ng כחד ay nagpapahiwatig ng pagpapalaho o lubusang pagwasak; malinaw, mariin, at dignidad ang “lipulin” sa modernong Filipino.
- source_word: מִגּוֹי
  choice: bilang isang bansa
  rationale: Ipinahihiwatig ng מִן kasama ng גוי ang pag-aalis sa Israel sa pag-iral nito bilang isang bayan o bansa.
- source_word: וְלֹא יִזָּכֵר
  choice: upang hindi na maalaala pa
  rationale: Ang Niphal imperfect ng זכר ay pasibo, “maalaala” o “mabanggit.” Ipinakikita ng “upang” ang layuning bunga ng naunang panukala.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: ang pangalan ng Israel
  rationale: Pinananatili nito ang payak na construct chain at ang biblikal na diwa ng pangalan bilang pagkakakilanlan.
- source_word: עוֹד
  choice: hindi na ... pa
  rationale: Sa negatibong pahayag, ang עוד ay nangangahulugang “hindi na” o “hindi na kailanman”; likas sa Filipino ang balangkas na “hindi na ... pa.”
