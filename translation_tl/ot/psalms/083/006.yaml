lexical_decisions:
- source_word: אָהֳלֵי
  choice: mga tolda ng
  rationale: Pinananatili ang konkretong larawang nasa maramihang anyong construct ng אֹהֶל, sa halip na gawing tuwirang pangalan ng mga mamamayan.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pangalan ng bansa o lupain; pinanatili bilang pangalang pantangi.
- source_word: יִשְׁמְעֵאלִים
  choice: mga Ismaelita
  rationale: Pangmaramihang katawagan sa pangkat ng mga taong nagmula kay Ismael; ito ang likas na anyo sa modernong Tagalog.
- source_word: מוֹאָב
  choice: Moab
  rationale: Pangalan ng bansa o lupain; pinanatili ang anyong Hebreo sa halip na gawing “mga Moabita.”
- source_word: הַגְרִים
  choice: mga Hagrita
  rationale: Katawagan sa isang pangkat ng mga tao; ang “Hagrita” ay malapit sa katinigang anyo ng Hebreo, habang inilagay sa talababa ang karaniwang alternatibong “Hagarita.”
