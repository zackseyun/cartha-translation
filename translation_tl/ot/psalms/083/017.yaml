translation:
  language: tl
  text: Mapahiya nawa sila at masindak magpakailanman; malagay nawa sila sa kahihiyan[a] at mapahamak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahiya sila … mapahiya sila.” Gumagamit ang Hebreo ng dalawang magkaugnay na salita para sa hiya (בוש at חפר), na may bahagyang magkaibang himig.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Mapahiya nawa sila
  rationale: Ang Qal imperfect na ginagamit bilang pakiusap o sumpang panalangin ay likas na naipahahayag sa Filipino sa pamamagitan ng “nawa.” Saklaw ng “mapahiya” ang pagkadama at kalagayan ng kahihiyan nang hindi ginagawang payak na hulang panghinaharap.
- source_word: וְיִבָּהֲלוּ
  choice: at masindak
  rationale: Ipinahahayag ng Niphal ng בהל ang matinding pagkabalisa, pagkagulat, o takot. Ang “masindak” ay maikli, marangal, at angkop sa tindi ng konteksto.
- source_word: עֲדֵי עַד
  choice: magpakailanman
  rationale: Ang idyoma ay tumutukoy sa walang-hanggang tagal. “Magpakailanman” ang natural at matatag na katumbas sa modernong Filipino.
- source_word: וְיַחְפְּרוּ
  choice: malagay nawa sila sa kahihiyan
  rationale: Malapit ang חפר sa בוש ngunit maaari itong magdiin sa kahihiyan o pagkapahiya bilang kalagayan. Pinananatili ng ibang parirala ang kaugnay ngunit hindi ganap na magkaparehong himig ng dalawang salitang Hebreo.
- source_word: וְיֹאבֵדוּ
  choice: at mapahamak
  rationale: Ang אבד ay maaaring mangahulugang mapahamak, malipol, o mawala. Hindi labis na tinutukoy ng “mapahamak” ang paraan ng kanilang wakas at natural ito sa konteksto ng panalanging laban sa mga kaaway.
theological_decisions:
- issue: Lakas ng mga pandiwang nagpapahayag ng sumpang panalangin
  choice: Isinalin ang mga imperfect bilang mga kahilingang may “nawa.”
  alternative: Mapapahiya sila at masisindak magpakailanman; malalagay sila sa kahihiyan at mapapahamak.
  rationale: Sa konteksto, ang mga pandiwa ay mga kahilingan o panalangin laban sa mga kaaway, hindi lamang mga hula tungkol sa hinaharap. Pinananatili ng “nawa” ang puwersang ito nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang balanseng paralelismo at “nawa” upang malinaw na marinig ang himig ng panalangin; iniwasan ang labis na teknikal o makalumang pananalita.
