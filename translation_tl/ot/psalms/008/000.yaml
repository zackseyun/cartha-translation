  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika; ayon sa Gitit.[a] Isang awit na kaugnay ni David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Gitit” ay isang hindi tiyak na katawagang Hebreo, marahil ay pangalan ng isang himig o instrumentong pangmusika.
    reason: cultural_note
  - marker: b
    text: Ang pariralang Hebreo ay maaari ring mangahulugang “ni David,” “kay David,” o “para kay David.” Maaari itong tumukoy sa pagkatha, pag-aari, pag-uugnay, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng awit, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Malinaw at likas sa modernong Filipino ang pariralang ito nang hindi ipinapalagay na koro lamang ang pinamamahalaan.
- source_word: עַל
  choice: ayon sa
  rationale: Sa konteksto ng tagubiling pangmusika, ipinahihiwatig nito na ang awit ay itatanghal kaugnay ng kasunod na teknikal na katawagan, nang hindi tiyak na nagpapasya kung iyon ay himig o instrumento.
- source_word: הַגִּתִּית
  choice: Gitit
  rationale: Hindi tiyak ang tinutukoy ng terminong Hebreo—maaaring isang himig, instrumento, o ibang katawagang pangmusika—kaya pinanatili ito bilang transliterasyon.
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Ang “Awit” ang nakaugaliang katawagang Filipino para sa mizmor at angkop bilang katawagan sa uring pampanitikan ng Mga Awit.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas sa Filipino ang “ni David” at maaari itong magpahiwatig ng pagkatha o kaugnayan; nililinaw sa talababa na mas malawak ang saklaw ng Hebreong le.
theological_decisions:
- issue: Pagkatha o kaugnayang ipinahihiwatig ng לְדָוִד
  choice: ni David
  alternative: kay David / para kay David
  rationale: Hindi tiyak na hinihingi ng Hebreo ang eksklusibong kahulugang si David ang may-akda. Ginamit ang likas na pamagat na Filipino, habang pinananatili sa talababa ang posibilidad ng pagkatha, pag-uugnay, o pag-aalay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at teknikal na anyo ng pamagat; isinalin ang hindi tiyak na terminong pangmusika sa pamamagitan ng transliterasyon at ipinaliwanag sa talababa.
