  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: tl
  text: O Yahweh[a], aming Panginoon, kay dakila ng iyong pangalan sa buong daigdig!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH.” Karaniwang isinasalin bilang “PANGINOON”; maaari ring isatitik na “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang banal na pangalang YHWH upang mapanatili ang pagkakaiba nito sa kasunod na titulong אֲדֹנֵינוּ.
- source_word: אֲדֹנֵינוּ
  choice: aming Panginoon
  rationale: Likas at marangal na tawag sa Diyos sa Filipino; ipinahahayag nito ang kaniyang kapamahalaan, samantalang ang “aming panginoon” na maliit ang titik ay maaaring magmukhang karaniwang amo lamang.
- source_word: מָה אַדִּיר
  choice: kay dakila
  rationale: Ang מָה ay ginagamit dito bilang padamdam, at ang אַדִּיר ay nagpapahiwatig ng kadakilaan at maringal na kapangyarihan. Natural sa modernong Filipino ang “kay dakila.”
- source_word: שִׁמְךָ
  choice: iyong pangalan
  rationale: Pinananatili ang Hebreong larawan ng pangalan bilang pagpapahayag ng dangal at pagkakakilanlan ng Diyos nang hindi ito labis na ipinapaliwanag sa teksto.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Sa konteksto ng salmo, ang הָאָרֶץ ay pandaigdigan ang saklaw; mas malinaw dito ang “daigdig” kaysa “lupain.”
theological_decisions:
- issue: Ang pagkakasunod ng banal na pangalan at titulo sa יְהוָה אֲדֹנֵינוּ
  choice: O Yahweh, aming Panginoon
  alternative: O PANGINOON, aming Panginoon
  rationale: Pinananatili ng “Yahweh” ang personal na banal na pangalan at malinaw itong naihihiwalay sa titulong “Panginoon,” nang hindi pinapawi ang makabuluhang pag-uulit sa Hebreo.
- issue: Saklaw ng “iyong pangalan”
  choice: iyong pangalan
  alternative: iyong karangalan
  rationale: Hindi tahasang nilulutas ang mas malawak na teolohikal na kahulugan ng “pangalan”; pinananatili ang konkretong pananalita ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang padamdam na “kay dakila” upang likas na maipahayag ang paghanga ng Hebreo. Ang “aming Panginoon” ay mas angkop sa direktang panawagan kaysa “Panginoon namin,” bagaman kapwa posible.
