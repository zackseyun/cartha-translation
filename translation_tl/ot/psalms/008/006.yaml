  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: tl
  text: Ginawa mo siyang mamahala[a] sa mga gawa ng iyong mga kamay; inilagay mo ang lahat sa ilalim ng kanyang mga paa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Binigyan mo siya ng kapamahalaan sa mga gawa ng iyong mga kamay.”
    reason: lexical_alternative
  - marker: b
    text: Isahang panlalaki ang anyo ng “siya” at “kanyang” sa Hebreo, bilang pagpapatuloy ng pananalitang kumakatawan sa sangkatauhan sa naunang talata.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Ginawa mo siyang mamahala
  rationale: Ang Hiphil ng משל ay nagsasaad ng paglalagay o paghirang sa isang tao upang mamahala. Pinananatili ng salin ang causative na diwa habang natural sa makabagong Tagalog.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: sa mga gawa ng iyong mga kamay
  rationale: Ang בְּ kasunod ng משל ay tumutukoy sa saklaw ng pamamahala. Pinananatili rin ng parirala ang kongkretong larawan ng mga kamay ng Diyos.
- source_word: כֹּל
  choice: ang lahat
  rationale: Ganap at malawak ang saklaw ng כֹּל sa konteksto; ang “ang lahat” ay maikli, natural, at hindi nililimitahan ang tinutukoy.
- source_word: שַׁתָּה
  choice: inilagay mo
  rationale: Tuwirang ipinapahayag nito ang kahulugan ng Qal na ‘ilagay’ o ‘itakda’ at malinaw ang kaugnayan sa kasunod na parirala.
- source_word: תַחַת רַגְלָיו
  choice: sa ilalim ng kanyang mga paa
  rationale: Pinananatili nito kapwa ang literal na larawan at ang Hebreong pahiwatig ng pagpapasakop sa kapamahalaan.
theological_decisions:
- issue: Isahang pananalita tungkol sa sangkatauhan
  choice: Panatilihin ang isahang “siya” at “kanyang”
  alternative: “sila” at “kanilang”
  rationale: Isahang panlalaki ang mga anyong Hebreo at kumakatawan ang mga ito sa tao o sangkatauhan sa konteksto. Bagaman walang kasariang gramatikal ang mga panghalip sa Tagalog, pinananatili ng isahan ang estruktura at representatibong diwa ng Hebreo.
- issue: Wika ng pamamahala
  choice: “Ginawa mo siyang mamahala”
  alternative: “Binigyan mo siya ng kapamahalaan”
  rationale: Mas tuwirang pinananatili ng napiling salin ang causative na puwersa ng pandiwang Hebreo nang hindi dinaragdagan ang talata ng isang abstraktong pangngalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang kongkretong larawang “mga kamay” at “sa ilalim ng kanyang mga paa,” pati ang isahang representatibong pananalita ng Hebreo.
