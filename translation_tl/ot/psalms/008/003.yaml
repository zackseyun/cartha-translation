source:
  edition: WLC
  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: tl
  text: Kapag tinitingnan ko ang iyong kalangitan—ang gawa ng iyong mga daliri, ang buwan at mga bituin na inilagay mo sa kani-kanilang lugar—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sapagkat nakikita ko ang iyong kalangitan—ang gawa ng iyong mga daliri, ang buwan at mga bituin na itinatag mo—”'
    reason: Ipinapakita ang posibleng sanhi na kahulugan ng כִּי, ang mas tuwirang “nakikita ko” para sa אֶרְאֶה, at ang pormal na “itinatag mo” para sa כּוֹנָנְתָּה.
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: 'Sa kontekstong patula, ipinakikilala nito ang pagkakataon o kalagayang humahantong sa pagninilay sa susunod na talata. Pinananatili rin ng talababa ang posibleng pagbasa na sanhi: “Sapagkat.”'
- source_word: אֶרְאֶה
  choice: tinitingnan ko
  rationale: Ipinahihiwatig ng imperfect ng ראה rito ang mapagnilay na pagmamasid. Likas sa modernong Tagalog ang “tinitingnan ko” at mas aktibo kaysa simpleng “nakikita ko.”
- source_word: שָׁמֶיךָ
  choice: iyong kalangitan
  rationale: Ang “kalangitan” ay likas, marangal, at kolektibong katawagan sa Tagalog na naipapahayag ang malawak na cosmic na saklaw ng Hebreong maramihan.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: ang gawa ng iyong mga daliri
  rationale: Tuwirang pinananatili ang larawang antropomorpiko ng Hebreo. Ginagamit ang “gawa” bilang kolektibong pangngalan.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: ang buwan at mga bituin
  rationale: Natural sa Tagalog ang paglalagay ng “ang” sa buwan; ang “mga” ay malinaw na naghahayag ng maramihan ng mga bituin.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ang “na” ang natural at payak na pang-ugnay na panumbas sa relative particle sa pangungusap na ito.
- source_word: כּוֹנָנְתָּה
  choice: inilagay mo sa kani-kanilang lugar
  rationale: Ipinahahayag nito ang diwa ng pagtatatag, pag-aayos, at paglalagay sa takdang posisyon. Ang “kani-kanilang” ay idiomatikong tumutukoy sa buwan at mga bituin nang hindi ipinapalagay ang mas tiyak na mekanismo.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa malikhaing pagkilos ng Diyos
  choice: Panatilihin nang literal ang “iyong mga daliri”
  alternative: “iyong likhang-kamay” o “mga ginawa mo”
  rationale: Sadyang gumagamit ang Hebreo ng matalik at makapangyarihang larawang patula. Ang pagpapanatili nito ay hindi nangangahulugang nilulutas ng salin ang tanong tungkol sa pisikal na anyo ng Diyos.
- issue: Saklaw ng כּוֹנָנְתָּה
  choice: “inilagay mo sa kani-kanilang lugar”
  alternative: “itinatag mo”
  rationale: Pinananatili ng piniling parirala ang ideya ng maayos at matatag na pagkakalagay ng mga bagay sa langit, habang ang mas pormal na alternatibo ay inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang paralelismo at ang bitin na em dash sapagkat nagpapatuloy ang kaisipan sa kasunod na talata. Ang marker na [a] ay inilagay sa dulo dahil saklaw ng talababa ang ilang alternatibong pagbasa sa buong linya.
