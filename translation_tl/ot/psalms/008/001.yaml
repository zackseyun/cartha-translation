  source_fidelity: 'Tapat ang salin sa pangunahing diwa at patulang ayos ng Hebreo: malinaw na naipapakita ang pangalang יהוה bilang “Yahweh,” ang אֲדֹנֵינוּ bilang “aming Panginoon,” ang ekslamatibong מָה אַדִּיר bilang “kay dakila,” at ang kosmikong saklaw ng “buong daigdig” at “kalangitan.” Ang deklaratibong “Inilagay mo” ay umaayon sa tradisyonal at kontekstuwal na pagbasa ng huling sugnay. Mahalaga ring hindi ikinukubli ng talababa ang suliraning gramatikal ng anyong Masoretiko, na maaaring basahing pautos.'
