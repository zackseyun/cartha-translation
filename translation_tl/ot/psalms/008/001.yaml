id: PSA.8.1
reference: Psalms 8:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֤ה אֲדֹנֵ֗י/נוּ מָֽה אַדִּ֣יר שִׁ֭מְ/ךָ בְּ/כָל הָ/אָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥/ה ה֝וֹדְ/ךָ֗ עַל הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: tl
  text: 'Yahweh[a], aming Panginoon,

    kay dakila ng iyong pangalan sa buong daigdig!

    Inilagay mo ang iyong karilagan sa ibabaw ng kalangitan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH, ang banal na pangalan ng Diyos; ayon sa kaugalian ay isinasaling “ang PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: 'Ang anyo ng pandiwang Hebreo ay maaaring basahing pautos: “Ilagay mo ang iyong karilagan sa ibabaw ng kalangitan.”'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa transliterasyong karaniwang ginagamit sa makabagong Filipino, sa halip na palitan ito ng isang titulo.
- source_word: אֲדֹנֵינוּ
  choice: aming Panginoon
  rationale: Ang אֲדוֹן na may hulaping unang panauhang maramihan ay isang tuwirang pagtawag sa Diyos; natural at marangal sa Filipino ang “aming Panginoon.”
- source_word: מָה אַדִּיר
  choice: kay dakila
  rationale: Ang מָה ay ekslamatibo rito, at ang אַדִּיר ay nagpapahayag ng kadakilaan at maringal na kapangyarihan. Pinananatili ng “kay dakila” ang masidhing paghanga ng tula.
- source_word: שִׁמְךָ
  choice: iyong pangalan
  rationale: Pinananatili ang Hebreong larawan ng “pangalan,” na maaaring sumaklaw sa ipinakilalang pagkakakilanlan at reputasyon ng Diyos nang hindi ito ipinapaliwanag sa mismong taludtod.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Ang “daigdig” ay malinaw na nagpapahiwatig ng pandaigdig at kosmikong saklaw, lalo na sa pagtapat nito sa “kalangitan.”
- source_word: תְּנָה
  choice: inilagay mo
  rationale: Sa daloy ng awit, nauunawaan ang sugnay bilang patulang pagpapahayag na inilagay ng Diyos ang kanyang karilagan sa ibabaw ng kalangitan. Gayunman, anyong pautos ang Masoretikong pagbabaybay, kaya tahasang itinatala ang literal na posibilidad sa talababa.
- source_word: הוֹדְךָ
  choice: iyong karilagan
  rationale: Ang הוֹד ay tumutukoy sa maringal na kagandahan, dignidad, o kaluwalhatian. Ang “karilagan” ay matingkad at patula nang hindi inuulit ang “dakila.”
- source_word: עַל הַשָּׁמָיִם
  choice: sa ibabaw ng kalangitan
  rationale: Pinananatili nito ang larawang ang karilagan ng Diyos ay nakalagay sa ibabaw o higit pa sa mismong kalangitan.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa Hebreo, hindi lamang ang titulong אֲדֹנָי. Kaya pinananatili ang pagkakaiba ng “Yahweh” at ng kasunod na titulong “aming Panginoon.”
- issue: Pag-unawa sa תְּנָה
  choice: inilagay mo
  alternative: ilagay mo
  rationale: Ang konteksto at sinaunang tradisyon ng pagbasa ay sumusuporta sa isang pahayag tungkol sa karilagan ng Diyos, ngunit anyong pautos ang katinig at patinig ng Masoretikong teksto. Hindi nilulutas nang palihim ang tensiyon; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang “daigdig” at “kalangitan” upang mapanatili ang kosmikong lawak, at ang maikling ekslamasyong “kay dakila” upang maging natural sa pagbigkas at pagsamba.
