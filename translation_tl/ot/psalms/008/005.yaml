  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: tl
  text: Gayunman, ginawa mo siyang bahagyang mas mababa kaysa sa Diyos[a], at pinutungan mo siya ng kaluwalhatian at karangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaysa sa mga nilalang sa langit.” Sa Septuagint ay “kaysa sa mga anghel,” isang saling makikita rin sa Hebreo 2:7.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: ginawa mo siyang ... mas mababa
  rationale: Ipinahahayag ng Hiphil ng חסר na inilagay ang isang tao sa mas mababang kalagayan; likas sa Filipino ang paghahambing na “ginawa mo siyang ... mas mababa.”
- source_word: מְּעַט
  choice: bahagyang
  rationale: Sa kontekstong Hebreo, pinakamalamang na antas ang tinutukoy—kaunting kababaan—hindi maikling tagal.
- source_word: מֵאֱלֹהִים
  choice: kaysa sa Diyos
  rationale: Bagaman maaaring tumukoy ang אֱלֹהִים sa Diyos o sa mga nilalang sa langit ayon sa konteksto, ang tuwirang pagbasa rito ay “Diyos”; inilagay sa talababa ang mahalagang alternatibo.
- source_word: וְכָבוֹד
  choice: kaluwalhatian
  rationale: Ang כָּבוֹד ay nagpapahiwatig ng bigat, dangal, o kaluwalhatian; ang “kaluwalhatian” ay angkop sa maringal na paralelismo.
- source_word: וְהָדָר
  choice: karangalan
  rationale: Ang הָדָר ay maaaring mangahulugang karilagan, kamahalan, o karangalan; pinananatili ng “karangalan” ang ipinagkaloob na dignidad nang hindi inuulit ang “kaluwalhatian.”
- source_word: תְּעַטְּרֵהוּ
  choice: pinutungan mo siya
  rationale: Ang Piel ng עטר ay karaniwang nangangahulugang putungan o palibutan; malinaw na naihahatid ng “pinutungan” ang maharlikang larawan.
theological_decisions:
- issue: Tinutukoy at kumakatawang bisa ng panghalip na isahan
  choice: Panatilihin ang isahang “siya”
  alternative: “sila” o “sangkatauhan”
  rationale: Isahan ang mga anyong panghalip sa Hebreo, samantalang kumakatawan sa sangkatauhan ang “tao” sa konteksto. Hindi ginawang tahasang maramihan o abstraktong kolektibo ang teksto.
- issue: Pagpapakahulugan sa אֱלֹהִים
  choice: Diyos
  alternative: “mga nilalang sa langit” o “mga anghel”
  rationale: Pinapaboran ng agarang tekstong Hebreo ang “Diyos.” Ang “mga anghel” ay mula sa Septuagint at makikita sa Hebreo 2:7, kaya pinanatili bilang mahalagang alternatibo sa talababa sa halip na ipasok sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matayog na larawang patula sa “pinutungan,” habang ang “bahagyang mas mababa” ay malinaw na naghahayag ng antas at hindi ng tagal.
