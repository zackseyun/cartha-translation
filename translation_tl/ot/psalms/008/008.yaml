  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִפּוֹר
  choice: mga ibon
  rationale: Bagaman pang-isahan ang anyo sa Hebreo, kolektibo ang gamit nito sa talaan ng mga nilalang; natural sa modernong Tagalog ang “mga ibon.”
- source_word: שָׁמַיִם
  choice: langit
  rationale: Sa kontekstong ito, tumutukoy ito sa himpapawid na nililiparan ng mga ibon. Ang “langit” ay natural, malinaw, at marangal sa tulang Tagalog.
- source_word: וּדְגֵי הַיָּם
  choice: at ang mga isda sa dagat
  rationale: Tuwirang ipinahahayag ng pariralang konstrukto ang mga isdang nasa dagat; ginawang maramihan sa Tagalog upang maipakita ang kolektibong diwa.
- source_word: עֹבֵר
  choice: pati ang lahat ng dumaraan
  rationale: Pang-isahan ang participle sa Hebreo ngunit malamang na kolektibo at sumasaklaw sa iba pang buhay-dagat. Pinananatili ng “lahat ng dumaraan” ang malawak na saklaw nang natural sa Tagalog.
- source_word: אָרְחוֹת
  choice: mga landas
  rationale: Pinananatili ng “mga landas” ang matulaing larawan ng mga ruta o daanang tinatahak sa dagat.
- source_word: יַמִּים
  choice: mga dagat
  rationale: Maramihan ang Hebreo; pinananatili ng “mga dagat” ang anyo at lawak ng matulaing larawan.
