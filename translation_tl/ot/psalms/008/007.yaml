    pati ang mga hayop sa parang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: mga tupa
  rationale: Tumutukoy ito sa maliliit na alagang hayop na kawan, lalo na sa mga tupa at kambing. Pinili ang “mga tupa” bilang maikli, kongkreto, at likas na katumbas sa makatang talaan.
- source_word: וַאֲלָפִים
  choice: at baka
  rationale: Tumutukoy ito sa malalaking alagang hayop na bovine. Ang “baka” ang natural at malawak na katawagan sa modernong Filipino, nang hindi nililimitahan ang kahulugan sa kapon o hayop na pantrabaho gaya ng maaaring ipahiwatig ng “barakong baka” o “ökse.”
- source_word: כֻּלָּם
  choice: ang lahat
  rationale: Pinananatili ang tahasang diin ng anyong Hebreo na walang ibinubukod sa dalawang naunang pangkat.
- source_word: וְגַם
  choice: pati
  rationale: 'Likas na ipinahahayag ng “pati” ang pandagdag na puwersa ng parirala: mula sa mga alagang hayop ay pinalalawak ang saklaw tungo sa mga hayop sa parang.'
- source_word: בַּהֲמוֹת
  choice: mga hayop
  rationale: Sa kontekstong ito, malawak ang saklaw ng salita. Mas natural at malinaw sa kasalukuyang Filipino ang “mga hayop” kaysa “mga halimaw” o isang katawagang para lamang sa mga alagang hayop.
- source_word: שָׂדָי
  choice: sa parang
  rationale: Ang makatang anyo ay tumutukoy sa bukid o lantad na lupain. Ang “sa parang” ay natural at nagpapanatili sa larawan ng mga hayop na nasa labas ng tahanan o pastulan ng mga alagang kawan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na simple ngunit marangal at makata. Inuna ang “ang lahat” upang malinaw na saklaw nito kapuwa ang mga tupa at baka, at ginamit ang “pati” para sa maayos na paglipat sa mga hayop sa parang.
