  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: tl
  text: Mula sa bibig ng mga sanggol at mga batang sumususo, itinatag mo ang lakas[a] dahil sa iyong mga kalaban, upang patahimikin ang kaaway at ang naghihiganti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papuri,” ayon sa tradisyon ng Septuagint na makikita rin sa Mateo 21:16; “lakas” ang mababasa sa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: Mula sa bibig ng
  rationale: Ang מִן kasama ng פֶּה ay nangangahulugang ‘mula sa bibig ng.’ Pinanatili ang isahang kolektibong anyo, na natural sa Filipino sa pariralang ito.
- source_word: עוֹלְלִים
  choice: mga sanggol
  rationale: Tumutukoy sa napakabatang mga bata; malinaw at makabago ang ‘mga sanggol.’
- source_word: יֹנְקִים
  choice: mga batang sumususo
  rationale: Ang participle ay literal na tumutukoy sa mga sumususo. Pinananatili ng salin ang kongkretong larawan at naihihiwalay ito sa mas pangkalahatang ‘mga sanggol.’
- source_word: יִסַּדְתָּ
  choice: itinatag mo
  rationale: Karaniwang kahulugan ng יסד ang magtatag o maglagay ng matibay na saligan. Ang ‘itinatag’ ay angkop sa abstraktong layon na ‘lakas.’
- source_word: עֹז
  choice: lakas
  rationale: Ang tuwirang kahulugan ng Hebreo ay ‘lakas’ o ‘kapangyarihan.’ Hindi ipinalit sa pangunahing teksto ang ‘papuri’ ng tradisyong Griyego.
- source_word: לְמַעַן
  choice: dahil sa
  rationale: Sa konteksto, ipinakikita nito ang dahilan o okasyong kaugnay ng mga kalaban. Ang ‘dahil sa’ ay natural habang hindi lubusang isinasara ang ugnayang sanhi at layunin.
- source_word: צוֹרְרֶיךָ
  choice: iyong mga kalaban
  rationale: Tumutukoy sa mga taong sumasalungat nang may poot. Malinaw at karaniwan ang ‘mga kalaban.’
- source_word: לְהַשְׁבִּית
  choice: upang patahimikin
  rationale: Ang causative infinitive ay ‘magpangyaring tumigil.’ Sa konteksto ng pagsalungat, ang ‘patahimikin’ ay natural at matingkad.
- source_word: אוֹיֵב
  choice: ang kaaway
  rationale: Ang isahang anyo ay maaaring kumatawan sa isang uri o pangkat; pinanatili ito bilang ‘ang kaaway.’
- source_word: מִתְנַקֵּם
  choice: ang mapaghiganti
  rationale: Ang participle ay tumutukoy sa taong naghihiganti o naghahangad ng paghihiganti. Ang ‘mapaghiganti’ ay maikli, natural, at hindi nagdaragdag ng tiyak na motibo.
theological_decisions:
- issue: Hebreong עֹז kumpara sa ‘papuri’ na kaugnay ng Septuagint at Mateo 21:16
  choice: Isinalin ang עֹז bilang ‘lakas’ sa pangunahing teksto.
  alternative: papuri
  rationale: Malinaw na ‘lakas/kapangyarihan’ ang mababasa sa tekstong Hebreo. Bilang paggalang sa primasiya ng orihinal na wika, sinusunod ito ng pangunahing teksto; inilalagay sa talababa ang mahalagang tradisyong Griyego sa halip na ipasok iyon sa salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matulaing larawan ng bibig ng mga sanggol at batang sumususo, gayundin ang tensiyon sa pagitan ng Hebreong ‘lakas’ at tradisyong Griyegong ‘papuri.’
