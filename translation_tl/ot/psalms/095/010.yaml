source:
  edition: WLC
  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: tl
  text: Sa loob ng apatnapung taon ay kinasuklaman ko ang salinlahing iyon[a], at sinabi ko, “Sila ay bayang may pusong ligaw, at hindi nila nakilala ang aking mga daan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nayamot ako sa salinlahing iyon” o “nalungkot ako dahil sa salinlahing iyon.” Ang pandiwang Hebreo ay maaaring magpahayag ng pagkasuklam, pagkayamot, o dalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Sa loob ng apatnapung taon
  rationale: Likas na ipinahahayag sa Filipino ang buong tagal ng panahong tinutukoy ng pariralang Hebreo.
- source_word: אָקוּט
  choice: kinasuklaman ko
  rationale: Pinananatili nito ang matinding diwa ng pagkayamot, pagkasuya, o pagkasuklam sa pandiwang קוט; inilalagay sa talababa ang mas banayad na posibleng salin.
- source_word: בְּדוֹר
  choice: ang salinlahing iyon
  rationale: Ang בְּ ay kaugnay ng pandiwang nagpapahayag ng saloobin, kaya natural na tuwirang layon sa Filipino; ipinakikilala ng “iyon” ang salinlahing nasa ilang ayon sa konteksto.
- source_word: עַם
  choice: isang bayan
  rationale: Ang kolektibong pangngalan ay tumutukoy sa isang pangkat ng mga tao bilang kabuuan; ang “bayan” ay natural at marangal sa kontekstong biblikal.
- source_word: תֹּעֵי לֵבָב
  choice: ligaw ang puso
  rationale: Pinananatili ang talinghaga ng pagkaligaw at ang pokus sa panloob na pagkatao, habang gumagamit ng natural na pariralang Filipino.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: hindi nila nakilala ang aking mga daan
  rationale: Ang “nakilala” ay nagpapanatili sa diwa ng ידע bilang pagkilala o pagkaalam batay sa karanasan, at ang “mga daan” ay iniiwang metaporikal tulad ng Hebreo.
- source_word: וָאֹמַר
  choice: at sinabi ko
  rationale: Tuwirang pinananatili ang pagkakasunod ng reaksiyon at hatol ng nagsasalita.
theological_decisions:
- issue: Saloobin ng Diyos na ipinahahayag ng קוט
  choice: Matinding pagkasuklam o pagkasuya (“kinasuklaman ko”)
  alternative: Pagkalungkot o matinding pagkayamot (“nalungkot ako dahil sa” / “yamot na yamot ako sa”)
  rationale: Sinasaklaw ng pandiwang Hebreo ang pagkasuya, pagkayamot, at dalamhati. Pinananatili ng pangunahing salin ang matinding puwersa ng konteksto, ngunit kinikilala sa talababa ang tunay na lawak ng kahulugan.
- issue: Diwa ng לֹא יָדְעוּ דְרָכָי
  choice: “hindi nila nakilala ang aking mga daan”
  alternative: “hindi nila alam ang aking mga daan”
  rationale: Ipinahihiwatig ng konteksto ang hindi pagkilala o hindi pagkatuto sa mga kaparaanan ng Diyos, nang hindi nilulutas kung ito ay pangunahing kaalaman, pagkaunawa, o pagkilala sa karanasan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “salinlahi,” “bayan,” at “mga daan” upang mapanatili ang dignidad at mga talinghaga ng Hebreo; iniwasan ang labis na kolokyal o denominasyonal na pananalita.
