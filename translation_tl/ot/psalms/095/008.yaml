  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: tl
  text: Huwag ninyong patigasin ang inyong puso, tulad ng sa Meriba[a], tulad ng noong araw sa Masa[b] sa ilang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Meriba ay nangangahulugang “pakikipagtalo” o “alitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Masa ay nangangahulugang “pagsubok.”
    reason: lexical_alternative
  - marker: c
    text: Tingnan ang Exodo 17:7 at Bilang 20:13 tungkol sa mga pangyayari sa ilang na tinutukoy rito.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: Huwag ninyong patigasin
  rationale: Ang אַל kasama ng anyong pandiwa ay naghahayag ng pagbabawal. Ang Hiphil ng קשׁה ay nangangahulugang “patigasin” o “gawing matigas.”
- source_word: לְבַבְכֶם
  choice: ang inyong puso
  rationale: Isahan ang pangngalang Hebreo ngunit maramihan ang tinutukoy ng hulaping paari. Pinananatili ng likas na pariralang Tagalog na “ang inyong puso” ang kolektibong paglalarawan nang hindi nawawala ang maramihang kausap.
- source_word: כִּמְרִיבָה
  choice: gaya sa Meriba
  rationale: Maaaring mangahulugan ang מְרִיבָה ng “pakikipagtalo” o “alitan,” ngunit dito ay tumutukoy ito sa pangalang kaugnay ng isang tiyak na pangyayari sa ilang. Pinananatili ang pangalang Meriba at inilalagay sa talababa ang kahulugan nito.
- source_word: כְּיוֹם מַסָּה
  choice: gaya noong araw sa Masa
  rationale: Ipinahihiwatig ng parirala ang paghahambing sa makasaysayang araw o pangyayari sa Masa. Ang “noong araw sa Masa” ay natural sa Tagalog at hindi ginagawang tahasang abstraktong “araw ng pagsubok” ang pangalan.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, marangal, at karaniwang salin ng מִדְבָּר sa konteksto ng paglalakbay ng Israel; hindi nito nililimitahan ang lugar sa mabuhanging disyerto lamang.
theological_decisions:
- issue: Kung isasalin ang מְרִיבָה at מַסָּה bilang karaniwang pangngalan o pananatilihin bilang mga pangalang makasaysayan
  choice: Pinanatili bilang “Meriba” at “Masa.”
  alternative: “gaya sa alitan, gaya noong araw ng pagsubok sa ilang”
  rationale: Ang magkatambal na mga pangalan at ang pagbanggit sa ilang ay tumutukoy sa mga tiyak na pangyayari sa kasaysayan ng Israel. Ang pagpapanatili sa mga pangalan ay nag-iingat sa ugnayan sa Exodo 17:7 at Bilang 20:13, samantalang ipinapaliwanag sa mga talababa ang kahulugang leksikal ng mga ito.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “inyong puso” bilang kolektibong isahan, gaya ng anyo ng pangngalang Hebreo, at pinanatili ang mga pangalang Meriba at Masa upang hindi mawala ang makasaysayang pahiwatig.
