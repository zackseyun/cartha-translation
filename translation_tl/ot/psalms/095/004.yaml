  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: tl
  text: 'Nasa kamay niya ang kailaliman ng lupa,

    at kanya rin ang kaitaasan ng mga bundok.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Nasa kamay niya
  rationale: Tumutukoy ang sugnay sa PANGINOON sa naunang talata. Pinananatili ng salin ang kongkretong larawang Hebreo ng pag-aari at kapamahalaan, at likas itong pakinggan sa modernong Tagalog.
- source_word: מֶחְקְרֵי
  choice: ang kailaliman
  rationale: Ang salita ay tumutukoy sa malalalim, mahirap abutin, o nakatagong mga dako. Ang “kailaliman” ay malinaw na katapat ng “kaitaasan” sa ikalawang linya.
- source_word: אָרֶץ
  choice: ng lupa
  rationale: Sa konteksto ng papuri sa Maylalang, tumutukoy ito sa buong lupa, hindi lamang sa isang partikular na lupain.
- source_word: וְתוֹעֲפוֹת
  choice: ang kaitaasan
  rationale: Tumutukoy ito sa matataas na bahagi o rurok. Ang “kaitaasan” ay nagpapanatili sa patulang pagsalungat sa “kailaliman” nang hindi labis na nililimitahan ang kahulugan sa mismong mga taluktok.
- source_word: הָרִים
  choice: ng mga bundok
  rationale: Natural at pangkalahatan sa Tagalog ang pariralang ito para sa saklaw ng lahat ng kabundukan.
- source_word: לוֹ
  choice: at kanya rin
  rationale: Maikli nitong ipinahahayag ang pag-aari gaya ng Hebreo. Ipinakikita ng “rin” na kapuwa ang kailaliman at kaitaasan ay sa Diyos.
theological_decisions:
- issue: Saklaw ng pag-aari at kapamahalaan ng Diyos sa larawan ng sangnilikha
  choice: Isang pangkalahatang pahayag na ang kailaliman ng lupa at kaitaasan ng mga bundok ay nasa pag-aari at kapamahalaan ng PANGINOON.
  alternative: Isang lokal na pagtukoy lamang sa lupain ng Israel at sa anyo ng kalupaan nito.
  rationale: Ang magkatambal na sukdulang “kailaliman” at “kaitaasan,” kasama ng pangkalahatang paanyaya ng salmo sa pagsamba, ay nagpapahiwatig ng buong sangnilikha.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Pinanatili ang larawan ng “kamay” at ang balanseng paghahambing ng kailaliman at kaitaasan. Walang footnote dahil naipahahayag ng pangunahing teksto ang lehitimong lawak ng mga salitang Hebreo nang hindi kailangang pumili ng mas makitid na alternatibo.
