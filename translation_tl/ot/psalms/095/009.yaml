translation:
  language: tl
  text: kung saan ako sinubok at siniyasat ng inyong mga ninuno,[a] kahit nakita nila ang aking gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung saan ako sinubok ng inyong mga ama; siniyasat nila ako at nakita rin nila ang aking gawa.” Maaari ring isalin nang mas literal ang Hebreo, ngunit malamang na konsesibo ang diwa ng pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: kung saan
  rationale: Tumutukoy ang pang-ugnay sa lugar na binanggit sa naunang talata, kaya ang lokatibong “kung saan” ang pinakamalinaw sa daloy.
- source_word: נִסּוּנִי
  choice: ako sinubok
  rationale: Karaniwang nangangahulugan ang נסה na subukin o ilagay sa pagsubok; pinananatili ng “sinubok” ang mapanghamong diwa ng ginawa nila sa Diyos.
- source_word: אֲבוֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Bagaman literal na “inyong mga ama,” natural sa makabagong Filipino ang “mga ninuno” para sa mga naunang salinlahi ng sambayanan, nang hindi binabago ang tinutukoy.
- source_word: בְּחָנוּנִי
  choice: siniyasat
  rationale: Ang בחן ay pagsubok o pagsusuri upang patunayan ang isang bagay. Ipinakikita ng “siniyasat” ang bahagyang kaibahan nito sa naunang “sinubok” habang pinananatili ang parallelismo.
- source_word: גַּם
  choice: kahit
  rationale: 'Bagaman madalas itong mangahulugang “din” o “maging,” malamang na konsesibo rito: sinubok nila ang Diyos sa kabila ng nakita nilang gawa niya.'
- source_word: רָאוּ
  choice: nakita nila
  rationale: Tuwirang salin ito ng ganap na pandiwa; sapat na ipinahihiwatig ng “kahit” na nauna o umiiral na ang karanasan nila sa gawa ng Diyos.
- source_word: פָעֳלִי
  choice: ang aking ginawa
  rationale: Ang פעל ay gawa o ginawa. Mas natural sa Filipino ang “aking ginawa” kaysa “aking gawain” sa kontekstong tumutukoy sa makapangyarihang pagkilos ng Diyos.
theological_decisions:
- issue: Konsesibong diwa ng huling sugnay
  choice: kahit nakita nila ang aking ginawa
  alternative: sinubok nila ako; nakita rin nila ang aking gawa
  rationale: 'Maaaring literal na unawain ang גַּם bilang “din,” ngunit mas angkop sa babala ng konteksto ang konsesibong diwa: sinubok nila ang Diyos sa kabila ng nakita nilang pagkilos niya. Inilalahad sa talababa ang mas literal na posibilidad.'
- issue: Paglalarawan sa אֲבוֹתֵיכֶם
  choice: inyong mga ninuno
  alternative: inyong mga ama
  rationale: Tumutukoy ang panlalaking anyo sa mga naunang salinlahi ng bayang kinakausap. Ang “mga ninuno” ay malinaw at natural na kolektibong katawagan sa Filipino, samantalang inilalapit ng “mga ama” ang pormal na anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong pandiwa sa pamamagitan ng “sinubok at siniyasat,” at minarkahan ang tunay na ambiguwidad ng גַּם sa talababa.
