  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: tl
  text: 'Halikayo, magpatirapa tayo[a] at lumuhod;

    magpuri tayo[b] sa harap ni Yahweh, ang ating Maylikha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa pagyukod nang napakababa o pagpapatirapa bilang pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “pagpalain natin.” Ang pandiwang Hebreo ay “magpala”; kapag tumutukoy sa Diyos, maaari itong mangahulugang magpuri o magsalita ng pagpapala tungkol sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Halikayo
  rationale: Isang maramihang pautos na nag-aanyaya sa kapulungan. Likas at marangal sa makabagong Filipino ang “Halikayo.”
- source_word: נִשְׁתַּחֲוֶה
  choice: magpatirapa tayo
  rationale: Tumutukoy ang pandiwa sa pagyukod nang napakababa o pagpapatirapa bilang pagpapasakop at pagsamba; pinananatili ng salin ang pisikal na kilos.
- source_word: וְנִכְרָעָה
  choice: at yumukod
  rationale: Ipinahihiwatig ng pandiwa ang pagyuko o pagbaba ng katawan. Pinananatili nito ang sunod-sunod na larawan ng mga kilos ng pagpipitagan nang hindi inuulit agad ang “lumuhod.”
- source_word: נִבְרְכָה
  choice: lumuhod tayo
  rationale: Sa kontekstong ito, ang ugat ברך ay ginagamit sa diwang “lumuhod,” gaya ng hinihingi rin ng kasunod na לִפְנֵי (“sa harap ni”). Naiiba ito sa karaniwang pandiwang “pagpalain” na kadalasang nasa ibang stem.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Tuwirang ipinapahayag ang paglapit at pagpipitagan sa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עֹשֵׂנוּ
  choice: ang ating Maylikha
  rationale: Ang participle na may hulaping pangmaramihang unang panauhan ay nangangahulugang “ang gumawa/lumikha sa atin.” Maikli, likas, at marangal ang “ating Maylikha.”
theological_decisions:
- issue: Pagpapakahulugan sa נִבְרְכָה
  choice: lumuhod tayo
  alternative: pagpalain natin
  rationale: Bagaman kaugnay sa anyo ng kilalang salitang Hebreo para sa “pagpalain,” ang gamit dito, kasunod ng dalawang pandiwa ng pisikal na pagpipitagan at ng pariralang “sa harap ni Yahweh,” ay “lumuhod.” Iniiwasan nitong ipasok sa teksto ang leksikal na diwang hindi hinihingi ng taludtod.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang tatlong magkakasunod na kilos—pagpapatirapa, pagyukod, at pagluhod—ay pinanatili upang maipakita ang matinding pisikal na pagpipitagan ng Hebreo. Ginawang dalawang linya ang taludtod upang sundan ang paralelismo nito.
