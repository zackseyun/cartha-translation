  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: tl
  text: Halikayo, umawit tayo nang may galak kay Yahweh; sumigaw tayo sa Bato ng ating kaligtasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: Halikayo
  rationale: Ang maramihang pautos ng הלך ay ginagamit dito bilang paanyaya o panawagan. Likas sa modernong Tagalog ang “Halikayo” at napananatili nito ang sama-samang diwa.
- source_word: נְרַנְּנָה
  choice: umawit tayo nang may galak
  rationale: Ang cohortative na anyo ng רנן ay tumutukoy sa masigla at maligayang tinig ng papuri; ipinahahayag ng salin ang awit at kagalakan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Itinuturo ng לְ ang pinatutungkulan ng papuri, at tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה.
- source_word: נָרִיעָה
  choice: sumigaw tayo
  rationale: Ang cohortative ng רוע/ריע ay nangangahulugang magtaas ng malakas na sigaw, karaniwan sa pagsamba o pagtatagumpay. Hindi idinagdag ang “nang may galak” sa ikalawang sugnay sapagkat wala iyon sa mismong pandiwa.
- source_word: לְצוּר
  choice: sa Bato
  rationale: Pinananatili ang konkretong talinghagang “Bato,” na nagpapahiwatig ng katatagan, lakas, at kanlungan; ang malaking titik ay nagpapakitang titulo o talinghaga ito para sa Diyos.
- source_word: יִשְׁעֵנוּ
  choice: ng ating kaligtasan
  rationale: Pinananatili nito ang anyong pangngalan at ang malawak na saklaw ng יֵשַׁע bilang pagliligtas o kaligtasan, sa halip na paliitin sa pandiwang paraphrase.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Talinghagang צוּר para sa Diyos
  choice: Bato ng ating kaligtasan
  alternative: batong nagliligtas sa atin
  rationale: Pinananatili ang nominal at matalinghagang kayarian ng Hebreo, pati ang teolohikal na tensiyon ng Diyos bilang “Bato” at ng kaligtasan bilang kaugnay na pangngalan.
translation_notes:
  register: Makabago, marangal, at angkop sa sama-samang pagsamba. Ginamit ang inklusibong “tayo” sa dalawang cohortative at ang likas na paanyayang “Halikayo.”
