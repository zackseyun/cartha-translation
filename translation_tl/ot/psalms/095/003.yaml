  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: tl
  text: Sapagkat si Yahweh ay dakilang Diyos at dakilang Hari na higit sa lahat ng mga diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “higit sa lahat ng mga nilalang na makalangit.” Ang Hebreong אֱלֹהִים ay maaaring tumukoy sa mga diyos, mga nilalang na makalangit, o mga nilalang sa langit, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang paanyaya sa pagsamba at pinananatili ang ugnayang sanhi.
- source_word: אֵל גָּדוֹל
  choice: dakilang Diyos
  rationale: Likas at marangal na paglalarawan sa pagka-Diyos at kadakilaan ni Yahweh; pinananatili rin ang pag-uulit ng גָּדוֹל sa dalawang sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וּמֶלֶךְ גָּדוֹל
  choice: at dakilang Hari
  rationale: Pinananatili ang magkatulad na ayos at ang ikalawang pahayag tungkol kay Yahweh.
- source_word: עַל
  choice: na higit sa
  rationale: Malinaw at natural sa modernong Tagalog bilang pagpapahayag ng kataas-taasan o pangingibabaw.
- source_word: כָּל אֱלֹהִים
  choice: lahat ng mga diyos
  rationale: Pinananatili ang leksikal at teolohikal na tensiyon ng maramihang אֱלֹהִים nang hindi ipinapasiya kung tumutukoy ito sa mga diyus-diyosan, mga sinasabing diyos, o mga nilalang na makalangit.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng אֱלֹהִים sa pariralang עַל כָּל אֱלֹהִים
  choice: mga diyos
  alternative: mga nilalang na banal; mga nilalang sa langit
  rationale: Ang “mga diyos” ang pinakadirektang salin at hindi nito tahimik na nilulutas ang pagkakakilanlan o ontolohikal na katayuan ng mga tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang paralelismo ng “dakilang Diyos” at “dakilang Hari,” gayundin ang tunay na kalabuan ng אֱלֹהִים.
