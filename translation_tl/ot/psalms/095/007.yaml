base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: tl
  text: Sapagkat siya ang ating Diyos, at tayo ang bayang kanyang pinapastulan, at mga tupang nasa kanyang kamay. Ngayon, kung pakikinggan ninyo ang kanyang tinig—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “Ngayon, makinig sana kayo sa kanyang tinig!” Maaaring magpahayag ang salitang Hebreo ng marubdob na paghiling, hindi lamang ng kondisyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang panawagan sa pagsamba; natural at malinaw ang paliwanag na ugnayan sa Filipino.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang ipinahahayag ang Diyos na kinikilala at kinauugnayan ng buong bayan.
- source_word: עַם מַרְעִיתוֹ
  choice: bayang kanyang pinapastulan
  rationale: Pinananatili ang larawang pastoral habang mas natural sa Filipino kaysa sa literal na 'bayan ng kanyang pastulan.'
- source_word: צֹאן יָדוֹ
  choice: mga tupang nasa kanyang kamay
  rationale: Malapit sa literal na 'mga tupa ng kanyang kamay' ngunit mas malinaw sa Filipino; pinananatili ang larawan ng paggabay, pag-iingat, at pamamahala nang hindi ito tahasang ipinapaliwanag sa teksto.
- source_word: הַיּוֹם
  choice: Ngayon
  rationale: Natural na panandang-panahon at mahalagang retorikal na tulay patungo sa babala sa kasunod na talata.
- source_word: אִם
  choice: kung
  rationale: Pinananatili ang kondisyunal na anyo na natural na humahantong sa utos sa kasunod na talata; inilalahad sa talababa ang posibleng himig ng marubdob na paghiling.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: pakikinggan ninyo ang kanyang tinig
  rationale: Ang 'pakikinggan' ay nagpapanatili sa pandinig bilang pangunahing larawan habang nagpapahiwatig ng maingat na pagtugon, nang hindi tahasang isinasalin bilang 'susundin.'
theological_decisions:
- issue: Lakas ng huling sugnay הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ
  choice: 'Kondisyunal at mapanghikayat: “Ngayon, kung pakikinggan ninyo ang kanyang tinig—”'
  alternative: 'Marubdob na paghiling: “Ngayon, makinig sana kayo sa kanyang tinig!”'
  rationale: Maaaring gamitin ang אִם sa patula at mapanghikayat na pananalita bilang paghiling, ngunit maayos ding binabasa rito bilang pambungad sa babala ng susunod na talata. Pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang pastol at tupa, gayundin ang bitin na wakas na nagpapatuloy sa kasunod na talata.
