  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: tl
  text: 'Kaya sa galit ko ay nanumpa ako,

    “Hindi sila makapapasok sa aking kapahingahan.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kung makapasok sila sa aking kapahingahan”—isang pormula ng panunumpa na ang ibig sabihin ay “hindi sila makapapasok sa aking kapahingahan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “aking pahingahang dako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Kaya
  rationale: Iniuugnay nito ang panunumpa sa naunang paghihimagsik bilang bunga o pasiya; natural sa modernong Tagalog ang “Kaya.”
- source_word: נִשְׁבַּעְתִּי
  choice: nanumpa ako
  rationale: Tuwirang ipinapahayag ng Niphal ng שבע ang panunumpa o pagsumpa ng isang panata.
- source_word: בְאַפִּי
  choice: sa galit ko
  rationale: Bagaman kaugnay sa literal na “ilong” ang אַף, ang idyomatikong kahulugan dito ay galit.
- source_word: אִם
  choice: Hindi sila
  rationale: Pagkatapos ng pandiwang “nanumpa,” ang אִם ay bahagi ng pinaikling pormula ng panunumpa na naghahayag ng mariing pagtanggi; kailangang ilantad ang negasyon upang maging malinaw sa Tagalog.
- source_word: יְבֹאוּן אֶל
  choice: makapapasok
  rationale: Ang בוא kasama ng אֶל ay natural na naipapahayag bilang pagpasok; ang anyong “makapapasok” ay angkop sa ipinagkakait na pagpasok.
- source_word: מְנוּחָתִי
  choice: aking kapahingahan
  rationale: Pinananatili ng “kapahingahan” ang posibilidad na tumukoy kapuwa sa kalagayan ng pamamahinga at sa dakong pahingahan, nang hindi agad nililimitahan ang kahulugan.
theological_decisions:
- issue: Pinaikling pormula ng panunumpa na may אִם
  choice: “Hindi sila makapapasok sa aking kapahingahan.”
  alternative: “Kung makapasok sila sa aking kapahingahan.”
  rationale: Sa Hebreo, ang literal na kondisyong “kung” matapos ang panunumpa ay isang eliptikong pormula ng mariing pagtanggi. Nililinaw sa salin ang tunay na bisa nito nang hindi nagdaragdag ng bagong diwa.
- issue: Saklaw ng מְנוּחָה
  choice: aking kapahingahan
  alternative: aking pahingahang dako
  rationale: Maaaring tumukoy ang salita sa pahinga bilang kalagayan o sa isang dako ng pamamahinga. Pinananatili ng napiling salin ang sadyang lawak at teolohikal na tensiyon ng termino.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng Kasulatan. Ginamit ang “kapahingahan” upang mapanatili ang siksik at malawak na kahulugan ng Hebreo; inilagay ang mga pananda ng talababa sa mismong talata.
