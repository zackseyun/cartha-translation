  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: tl
  text: Kanya ang dagat[a], sapagkat siya ang gumawa nito[b], at ang tuyong lupa ay hinubog ng kanyang mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa kanya ang dagat”; literal sa Hebreo, “na sa kanya [ang] dagat.”
    reason: lexical_alternative
  - marker: b
    text: O “at siya ang gumawa nito.” Pormal na “at” ang pang-ugnay sa Hebreo, bagaman malamang na nagsasaad ito rito ng dahilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: Kanya
  rationale: 'Ang konstruksiyong may לְ ay nagpapahayag ng pag-aari: ang dagat ay sa kanya. Ang “Kanya ang dagat” ay likas at tuwirang Filipino na nagpapanatili sa diin ng Hebreo.'
- source_word: הַיָּם
  choice: ang dagat
  rationale: Karaniwang kahulugan nito ang “dagat”; hindi kailangan ang mas malawak at mas interpretibong “karagatan.”
- source_word: וְהוּא
  choice: sapagkat siya
  rationale: 'Bagaman pormal na “at” ang וְ, malamang na sanhi ang ugnayan dito: kanya ang dagat sapagkat siya ang gumawa nito. Minamarkahan sa talababa ang mas pormal na alternatibo.'
- source_word: עָשָׂהוּ
  choice: gumawa nito
  rationale: Tumutukoy ang hulaping panghalip sa dagat. Ang “gumawa” ang malinaw na katumbas ng עשה sa konteksto ng paglikha.
- source_word: וְיַבֶּשֶׁת
  choice: at ang tuyong lupa
  rationale: Ang יַבֶּשֶׁת ay tuyong lupa bilang kaibahan ng dagat; pinananatili ng salin ang malinaw na pagtutunggaling ito.
- source_word: יָדָיו
  choice: ng kanyang mga kamay
  rationale: Pinananatili ang tahasang maramihang “mga kamay” at ang matalinghagang paglalarawan sa pagkilos ng Diyos.
- source_word: יָצָרוּ
  choice: hinubog
  rationale: Ipinahihiwatig ng יצר ang sinadyang paghubog. Naiiba ang “hinubog” sa naunang “gumawa,” kaya napapanatili ang baryasyon ng mga pandiwa sa Hebreo.
theological_decisions:
- issue: Matalinghagang pagbanggit sa mga kamay ng Diyos
  choice: Panatilihin ang “hinubog ng kanyang mga kamay”
  alternative: “hinubog niya” o “hinubog ng kanyang kapangyarihan”
  rationale: Tahasang binabanggit ng Hebreo ang mga kamay ng Diyos. Ang pagpapanatili sa larawang patula ay tapat sa teksto at hindi ito kailangang gawing abstrakto.
- issue: Pagkakaiba ng mga pandiwang עשה at יצר
  choice: Isalin bilang “gumawa” at “hinubog”
  alternative: Gamitin ang iisang pandiwa para sa dalawa
  rationale: Pinananatili ng dalawang magkaibang pandiwa ang leksikal na baryasyon at paralelismong patula nang hindi nagdaragdag ng teolohikal na pagkakaibang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maikli at patulang “Kanya ang dagat,” habang pinanatili ang konkretong larawan ng “kanyang mga kamay.”
