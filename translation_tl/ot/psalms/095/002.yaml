base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: tl
  text: 'Lumapit tayo sa kanyang harapan[a] nang may pasasalamat;

    sumigaw tayo ng galak sa kanya sa pamamagitan ng mga awit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa kanyang mukha”; karaniwang idyoma ito sa Hebreo para sa personal niyang presensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: Lumapit tayo
  rationale: Ang Hiphil cohortative na unang panauhang maramihan ay isang paanyaya o paghikayat. Likas sa modernong Tagalog ang “Lumapit tayo” at angkop sa kasunod na pagtukoy sa kanyang harapan.
- source_word: פָנָיו
  choice: sa kanyang harapan
  rationale: Literal itong “kanyang mukha,” ngunit karaniwang idyoma sa Hebreo para sa personal na presensiya. Pinananatili ng “harapan” ang konkretong larawan habang malinaw at natural sa Tagalog.
- source_word: בְּתוֹדָה
  choice: nang may pasasalamat
  rationale: Maaaring tumukoy ang תוֹדָה sa pasasalamat, papuri, o handog ng pasasalamat. Dahil kaagapay nito ang masayang pag-awit, ang diwang pasasalamat ang pinakamalamang dito.
- source_word: בִּזְמִרוֹת
  choice: sa pamamagitan ng mga awit
  rationale: Tumutukoy ang זְמִרוֹת sa mga awit o himig, madalas na papuri. Ang “mga awit” ay malawak, malinaw, at hindi labis na espesipiko gaya ng “mga salmo.”
- source_word: נָרִיעַ
  choice: sumigaw tayo ... nang may kagalakan
  rationale: Ang Hiphil cohortative ay nag-aanyaya sa isang malakas at masayang sigaw ng pagbubunyi. Nahuhuli ng pariralang ito kapwa ang lakas ng tinig at ang masayang tono.
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang pang-ukol na ל na may hulaping ikatlong panauhang panlalaki ay nagpapahayag ng direksiyon ng pagpupuri; tuwiran itong naipapahayag ng “sa kanya.”
