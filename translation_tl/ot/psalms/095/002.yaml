  source_fidelity: 'Tapat ang unang linya sa dalawang pangunahing sangkap ng Hebreo: ang cohortative na paanyaya (“Lumapit tayo”) at ang paglapit sa harapan/presensiya ng Diyos nang may pasasalamat. Tumpak ding naipapahayag ng “sa kanya” ang לוֹ. Sa ikalawang linya, naroon ang mga ideya ng masayang sigaw at mga awit, ngunit ang kasalukuyang ayos ay bahagyang nagpapalabo sa ugnayan ng “mga awit” sa pagbubunyi.'
