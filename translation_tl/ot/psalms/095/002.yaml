  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatulad na anyong “tayo” upang mapanatili ang dalawang cohortative na paanyaya ng Hebreo; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
