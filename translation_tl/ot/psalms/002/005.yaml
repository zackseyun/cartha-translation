base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: tl
  text: Pagkatapos, magsasalita siya sa kanila sa kanyang galit, at sa nag-aalab niyang poot ay sisindakin niya sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sa tindi ng kanyang galit ay gugulatin niya sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Tumutukoy sa kasunod na kilos sa daloy ng awit. Likas sa modernong Tagalog ang “Pagkatapos” at malinaw nitong iniuugnay ang tugon ng Diyos sa naunang paghihimagsik.
- source_word: יְדַבֵּר
  choice: magsasalita siya
  rationale: Ang Piel imperfect ay nagpapakita ng kasunod na tugon ng Diyos; ang anyong panghinaharap ay angkop sa pagkakasunod-sunod ng mga kilos.
- source_word: אֵלֵימוֹ
  choice: sa kanila
  rationale: Ang panghalip ay tumutukoy sa mga hari at pinunong naghihimagsik sa mga naunang talata.
- source_word: בְאַפּוֹ
  choice: sa kanyang galit
  rationale: Bagaman literal na kaugnay ng “ilong” ang אַף, galit ang idyomatikong kahulugan nito rito. Iniiwasan ng salin ang malabong literalismo.
- source_word: וּבַחֲרוֹנוֹ
  choice: at sa nag-aalab niyang poot
  rationale: Ipinahihiwatig ng חָרוֹן ang matindi at nag-aapoy na galit. Pinananatili ng “nag-aalab na poot” ang larawang-init at ang pag-igting mula sa naunang “galit.”
- source_word: יְבַהֲלֵמוֹ
  choice: sisindakin niya sila
  rationale: Ang Piel ng בהל ay nangangahulugang magdulot ng biglaang takot, pagkataranta, o panghihilakbot. Natural at matindi sa Tagalog ang “sisindakin.”
theological_decisions:
- issue: Antropopatikong paglalarawan sa galit ng Diyos
  choice: Pinanatili ang tahasang “galit” at “nag-aalab na poot.”
  alternative: Palambutin bilang “pagkayamot” o gawing abstraktong “hatol.”
  rationale: Malakas at personal ang paglalarawan ng tekstong Hebreo sa pagtutol ng Diyos sa paghihimagsik. Hindi ito dapat pahinain o gawing abstrakto sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nag-aalab na poot” upang mapanatili ang pag-igting at metapora ng init sa Hebreo; ang “sisindakin” ay naghahatid ng biglaan at matinding takot.
