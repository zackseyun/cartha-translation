  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: tl
  text: Ang nakaluklok sa kalangitan ay tumatawa[a]; nililibak sila ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang nakaupo sa kalangitan ay tumatawa; kinukutya sila ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: nakaluklok
  rationale: Ang participle ay literal na “nakaupo” o “nananahan,” ngunit sa konteksto ng Awit 2 ay may maharlika at naghaharing diwa. Ipinahahayag ng “nakaluklok” ang soberanong paghahari nang hindi labis na nagpapaliwanag.
- source_word: בַּשָּׁמַיִם
  choice: sa kalangitan
  rationale: Ang “kalangitan” ay natural at marangal na salin sa modernong Tagalog at naihahatid ang malawak na diwa ng Hebreong anyong maramihan nang hindi gumagamit ng di-likas na “mga langit.”
- source_word: יִשְׂחָק
  choice: tumatawa
  rationale: Pinananatili nito ang payak at matingkad na antropomorpikong larawan. Ang mapanuyang bisa ay malinaw sa konteksto at sa kasunod na pandiwa.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ay titulong אֲדֹנָי, hindi ang pangalang YHWH. “Panginoon” ang natural at nakaugaliang marangal na katumbas sa Tagalog.
- source_word: יִלְעַג
  choice: nililibak
  rationale: Ang “nililibak” ay malinaw na naghahayag ng paghamak at panunuya at angkop sa dignidad ng tulang biblikal.
- source_word: לָמוֹ
  choice: sila
  rationale: Tumutukoy ito sa mga bansang, hari, at pinunong naghihimagsik sa naunang mga talata. Likas sa Tagalog ang tuwirang layon na “sila” pagkatapos ng “nililibak.”
theological_decisions:
- issue: Maharlika at antropomorpikong paglalarawan sa Diyos
  choice: Gamitin ang “nakaluklok” upang mapanatili ang maharlikang diwa, habang tuwirang isinasalin ang “tumatawa” at “nililibak.”
  alternative: “Ang nakaupo sa kalangitan ay tumatawa; kinukutya sila ng Panginoon.”
  rationale: Hindi dapat pahinain ang larawan ng soberanong Diyos o ipaliwanag palayo ang matingkad na antropomorpikong pananalita. Ang “nakaluklok” ay umaayon sa konteksto ng mga hari at paghahari, ngunit inilalahad sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Ginamit ang “kalangitan” sa halip na ang di-likas na literal na maramihang “mga langit,” at “nakaluklok” upang maipahiwatig ang maharlikang konteksto.
