  text: 'Bakit nagkakagulo ang mga bansa,


    at ang mga bayan ay nagbabalak ng walang kabuluhang bagay?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nagbubulay-bulay tungkol sa kahungkagan,” “bumubulong tungkol sa kawalang-kabuluhan,” o, ayon sa nakaugaliang salin, “nagbabalak nang walang saysay.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbulong, pagbubulay-bulay, o pagbuo ng balak; ang pangngalan naman ay nangangahulugang kahungkagan, kawalang-kabuluhan, o bagay na walang saysay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas at tuwirang tanong sa modernong Tagalog, at pinananatili ang retorikal na puwersa ng Hebreo.
- source_word: רָגְשׁוּ
  choice: nag-aalsa
  rationale: Ipinahahayag ang magulo at mapanlabang pagkilos ng mga bansa. Mas angkop sa sama-samang paghihimagsik kaysa sa literal na damdaming ipinahihiwatig ng “nagngangalit.”
- source_word: גוֹיִם
  choice: ang mga bansa
  rationale: Tumutukoy sa mga bansang politikal; iniiwasan ng saling ito ang pagpasok ng mas huling kaibahang teolohikal na maaaring ipahiwatig ng “mga Hentil.”
- source_word: לְאֻמִּים
  choice: ang mga bayan
  rationale: Pinananatili ang malapit ngunit hindi eksaktong magkaparehong paralelismo ng “mga bansa” at tumutukoy sa mga pangkat ng mga tao.
- source_word: יֶהְגּוּ
  choice: nagbabalak
  rationale: Sa konteksto ng mapanlabang mga pinuno at bansa, natural itong tumutukoy sa pag-iisip o pagbuo ng balak, habang inilalahad sa talababa ang mas malawak na kahulugang pagbulong o pagbubulay.
- source_word: רִיק
  choice: ng walang kabuluhan
  rationale: Pinananatili ang nominal na diwa ng kawalan, kahungkagan, o kabulaanan bilang laman ng kanilang binabalak, sa halip na tahasang gawin lamang itong pang-abay na “nang walang saysay.”
