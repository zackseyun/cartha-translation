  terminology: Ang “Yahweh,” “atas,” at “Anak” ay angkop. Pinanatili ang malaking titik sa “Anak” bilang kanonikal na pagsasalin, habang malinaw na ipinababatid ng talababa na walang kapitalisasyon ang Hebreo. Ang talababa para sa huling sugnay ay dapat magpaliwanag na ang pangunahing teksto ay isang idiomatikong pagsasalin ng literal na wika ng pag-aanak, hindi isang paglutas sa kahulugan nito bilang pagluklok, pag-aampon, o iba pa.
