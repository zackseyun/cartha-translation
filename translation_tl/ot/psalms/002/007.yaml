- from: Ipahahayag ko ang atas ni Yahweh. Sinabi niya sa akin, “Ikaw ang aking Anak[a]; ngayong araw ay ipinanganak kita[b].”
  to: Ipahahayag ko ang atas ni Yahweh. Sinabi niya sa akin, “Ikaw ang aking Anak[a]; ngayon ay naging ama mo ako[b].”
  rationale: Pinalitan ang “ipinanganak kita” upang maiwasan ang karaniwang modernong Filipino na pahiwatig ng pisikal at maternal na panganganak. Ang “naging ama mo ako” ay idiomatiko at katumbas ng kinikilalang alternatibong pagbasa, samantalang pinananatili ng talababa ang literal na larawang pag-aanak at ang hindi pa nilulutas na kahulugan nito. Inayos din ang “ngayong araw” tungo sa mas tuwirang “ngayon.”
