base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: tl
  text: Ipahahayag ko ang atas ni Yahweh. Sinabi niya sa akin, “Ikaw ang aking Anak[a]; ngayon ay naging ama mo ako[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anak.” Hindi ipinakikita sa Hebreo ang kaibhan ng malaki at maliit na titik; ginamit sa pangunahing teksto ang “Anak” upang ipahiwatig ang maharlika at mesiyanikong kabuluhan ng talata sa konteksto nito at sa paggamit dito sa iba pang bahagi ng Kasulatan.
    reason: alternative_reading
  - marker: b
    text: 'Mas literal: “ngayon ay isinilang kita” o “ngayon ay inanak kita.” Gumagamit ang Hebreo ng wika ng pag-aanak/pagsilang. Maaaring iugnay ang larawan sa pagluklok o pag-aampon sa hari, ngunit hindi ito nilulutas ng pangunahing teksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Ipahahayag ko
  rationale: Ipinakikilala ng anyong pandiwa ang isang taimtim at hayagang pagpapahayag. Ang “ipahahayag” ay likas sa makabagong Filipino at angkop sa maharlikang konteksto.
- source_word: אֶל חֹק
  choice: ang atas
  rationale: Sa idyomang ito, ang אֶל ay tumutukoy sa nilalaman o paksa ng pagpapahayag, at ang חֹק ay isang makapangyarihang pasiya sa konteksto ng paghahari. Mas natural ang “ang atas” kaysa sa literal ngunit mabigat na “tungkol sa tuntunin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אָמַר אֵלַי
  choice: Sinabi niya sa akin
  rationale: Ang paksa ay si Yahweh mula sa naunang parirala; malinaw at natural sa Filipino ang panghalip na “niya.”
- source_word: בְּנִי אַתָּה
  choice: Ikaw ang aking Anak
  rationale: Tuwirang pinananatili ang ugnayang ipinahahayag ng Hebreo. Ang malaking titik sa “Anak” ay nagpapahiwatig ng maharlika at mesiyanikong kabuluhan, habang inilalahad sa talababa ang anyong maliit ang titik.
- source_word: הַיּוֹם
  choice: ngayong araw
  rationale: Pinananatili nito ang tiyak na temporal na diin ng Hebreo at mas taimtim ang himig kaysa sa payak na “ngayon.”
- source_word: יְלִדְתִּיךָ
  choice: ipinanganak kita
  rationale: Pinananatili ang metapora ng panganganak o pag-aanak sa Hebreo nang hindi ito nilulutas bilang pagluklok, pag-aampon, o ibang partikular na interpretasyon.
theological_decisions:
- issue: Maharlika at mesiyanikong kabuluhan ng בְּנִי
  choice: “Ikaw ang aking Anak” sa pangunahing teksto
  alternative: “Ikaw ang aking anak”
  rationale: Ang agarang konteksto ay tungkol sa haring mula sa lipi ni David, at ginagamit din ang talata bilang mesiyanikong pahayag sa mas malawak na kanon. Hindi nagpapakita ng malaking titik ang Hebreo, kaya pinananatili sa talababa ang alternatibong anyo.
- issue: Kahulugan ng “ngayong araw ay ipinanganak kita”
  choice: Panatilihin ang wika ng panganganak o pag-aanak
  alternative: “ngayong araw ay naging ama mo ako”
  rationale: Hindi tahasang nilulutas ng Hebreo kung ang larawan ay tumutukoy sa pagluklok bilang hari, pakikipagtipang pag-aampon, o mesiyanikong katuparan. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “atas” para sa maharlikang pasiya at pinanatili ang pangalang “Yahweh.” Iniwasan ang labis na teknikal o makalumang pananalita, ngunit pinanatili ang taimtim na tono at ang sadyang teolohikal na kalabuan ng huling pahayag.
