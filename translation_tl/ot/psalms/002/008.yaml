base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: tl
  text: Humingi ka sa akin, at ibibigay ko sa iyo ang mga bansa bilang pamana mo, at ang mga dulo ng daigdig bilang pag-aari mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pinakamalalayong bahagi ng daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: Humingi ka sa akin
  rationale: Ang pautos na שְׁאַל kasama ng מִמֶּנִּי ay tuwirang nag-uutos na humiling sa nagsasalita. Likas at malinaw sa modernong Tagalog ang “Humingi ka sa akin.”
- source_word: וְאֶתְּנָה
  choice: at ibibigay ko sa iyo
  rationale: Ang kohortatibong anyo pagkatapos ng pautos ay nagpapahayag dito ng tugon o pangako. Idinagdag ang “sa iyo” na malinaw na ipinahihiwatig ng kasunod na mga hulaping pangalawang panauhan.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Tumutukoy ito sa mga bayan o bansa; iniiwasan ng saling ito ang pagpasok ng mas huling pagkakaibang Judio-Hentil.
- source_word: נַחֲלָתֶךָ
  choice: bilang pamana mo
  rationale: Ang נַחֲלָה ay minana o itinakdang bahagi. Ipinakikita ng “bilang” ang kaugnayang predikatibo sa “mga bansa.”
- source_word: וַאֲחֻזָּתְךָ
  choice: bilang pag-aari mo
  rationale: Ang אֲחֻזָּה ay pag-aari o hawak na lupain. Pinananatili ng “pag-aari” ang paralelismo ngunit itinatangi ito sa “pamana.”
- source_word: אַפְסֵי אָרֶץ
  choice: ang mga dulo ng daigdig
  rationale: Karaniwang idyoma ito para sa pinakamalalayong hangganan o bahagi ng daigdig.
theological_decisions:
- issue: Saklaw ng pangako sa hari o Mesiyas
  choice: Isinalin bilang tuwirang pangako sa kinakausap na hari o anak nang hindi tahasang tinutukoy sa salin kung sino ang katuparang Mesiyaniko.
  alternative: Gawing tahasang Mesiyaniko ang pananalita.
  rationale: Ang Hebreo ay nangangako ng pandaigdigang paghahari sa kinakausap, ngunit hindi nito sa talatang ito lamang tahasang nilulutas ang buong kanonikal at Kristolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “daigdig” upang panatilihin ang pandaigdigang lawak at ang bahagyang mataas na himig ng awit.
