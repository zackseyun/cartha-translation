  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: tl
  text: Hagkan ninyo ang anak[a][b], kung hindi’y magagalit siya at mapapahamak kayo sa landas, sapagkat mabilis magliyab ang kanyang galit.[c] Mapalad ang lahat ng nanganganlong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magbigay-pugay kayo sa anak.” Literal na “hagkan” ang pandiwa, ngunit sa isang makaharing tagpo maaari itong tumukoy sa pagpapasakop o pagbibigay-pugay.
    reason: lexical_alternative
  - marker: b
    text: Di-karaniwan dito ang Hebreong bar. Karaniwan itong inuunawang “anak,” na kaayon ng Awit 2:7, ngunit may mga nagmumungkahi ng “kadalisayan” o “nang dalisay.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “sapagkat magliliyab ang kanyang galit sa sandaling panahon” o “sapagkat ang kanyang galit ay magliliyab nang bahagya lamang.” Masinsin ang pahayag sa Hebreo at maaaring idiin ang biglaan o ang kaiklian.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Hagkan ninyo
  rationale: Tuwirang pinananatili ang konkretong larawan ng pandiwang ‘humalik/hagkan.’ Sa kontekstong makahari, maaari itong magpahiwatig ng pagpapasakop o pagbibigay-pugay; inilalahad ang diwang iyon sa talababa sa halip na ipalit agad sa larawan ng Hebreo.
- source_word: בַר
  choice: ang anak
  rationale: Bagaman di-karaniwan at pinagtatalunan ang salitang בַר dito, ang ‘anak’ ang pinakamalinaw na kaugnay ng maharlikang pahayag sa Awit 2:7. Pinanatili sa talababa ang ibang mungkahing pagbasa.
- source_word: פֶּן
  choice: kung hindi’y
  rationale: Likas na makabagong Tagalog para sa babala ng negatibong bunga matapos ang isang utos; iniiwasan nito ang mas mabigat na ‘baka’ na maaaring magtunog na walang katiyakan lamang.
- source_word: יֶאֱנַף
  choice: magagalit siya
  rationale: Malinaw na ipinapahayag ang personal na simuno at ang diwa ng pandiwang tumutukoy sa pagkagalit.
- source_word: וְתֹאבְדוּ
  choice: at mapapahamak kayo
  rationale: Inihahatid ang babalang maaaring malipol o mapahamak nang hindi tinutukoy ang paraan ng kapahamakan.
- source_word: דֶרֶךְ
  choice: sa landas
  rationale: Pinananatili ang maigsi at matulaing larawan ng Hebreo. Ang ‘landas’ ay maaaring tumukoy kapwa sa tinatahak na daan at sa takbo ng pamumuhay.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: sapagkat mabilis magliyab ang kanyang galit
  rationale: Pinananatili ang larawan ng pagliyab at ipinahahayag ang posibleng diin ng כִּמְעַט sa biglaan o nalalapit na pagsiklab. Dahil maaari rin itong mangahulugang ‘kaunti lamang’ o ‘sa sandaling panahon,’ inilagay ang mga iyon sa talababa.
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Karaniwang marangal at likas na salin ng pormulang beatitudinal sa Mga Awit; higit na malawak kaysa simpleng damdaming ‘masaya.’
- source_word: חֹסֵי בוֹ
  choice: lahat ng nanganganlong sa kanya
  rationale: Tumpak na pinananatili ang larawan ng paghahanap ng kanlungan at proteksiyon, sa halip na paliitin ito sa abstraktong ‘nagtitiwala.’
theological_decisions:
- issue: Pagkakakilanlan ng בַר sa Awit 2:12
  choice: Isinalin bilang ‘ang anak,’ kaugnay ng maharlikang anak sa Awit 2:7.
  alternative: Maaaring unawain bilang ‘kadalisayan,’ ‘nang dalisay,’ o bilang isang tekstuwal at lingguwistikong suliranin na walang tiyak na filial na tinutukoy.
  rationale: Malakas na itinuturo ng agarang konteksto ng awit ang isang maharlikang anak, ngunit hindi dapat ikubli ang tunay na hirap ng salitang בַר o ipasok sa talata ang mas huling detalyadong pagbubuo ng doktrina. Kaya ‘anak’ ang nasa pangunahing teksto at nasa talababa ang ibang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang matulaing ‘hagkan,’ ‘landas,’ ‘magliyab,’ at ‘nanganganlong,’ habang ginawang likas ang daloy sa pamamagitan ng ‘kung hindi’y.’ Hindi ginawang malaking titik ang ‘anak’ sapagkat walang gayong pagtatangi sa tekstong Hebreo at upang hindi paunang lutasin sa tipograpiya ang teolohikal na pagkakakilanlan ng tinutukoy.
