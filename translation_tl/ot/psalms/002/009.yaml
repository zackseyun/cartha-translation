  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: tl
  text: Babasagin mo sila sa setrong bakal[b][a]; dudurugin mo sila gaya ng sisidlang yari ng magpapalayok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa alternatibong tradisyon ng teksto na makikita sa ilang sinaunang salin at umaalingawngaw sa Pahayag: “Papastulan mo sila sa setrong bakal” o “Pamumunuan mo sila sa setrong bakal.”'
    reason: alternative_reading
  - marker: b
    text: Ang “setro” ay maaari ding isaling “pamalo” o “tungkod.” Ang salitang Hebreo ay maaaring tumukoy sa sagisag ng kapangyarihan o sa kasangkapan ng pagdidisiplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: babasagin mo sila
  rationale: Ang pagbigkas sa Masoretic Text at ang pagkakapantay nito sa “dudurugin mo sila” ay pumapabor sa kahulugang mapanirang paghatol. Pinananatili sa talababa ang mahalagang alternatibong tradisyong “papastulan” o “pamumunuan.”
- source_word: בְּשֵׁבֶט
  choice: sa pamamagitan ng setro
  rationale: Maaaring tumukoy ang שֵׁבֶט sa pamalo, tungkod, o setro. Sa maharlikang konteksto ng Awit 2, malinaw na ipinahihiwatig ng “setro” ang kapangyarihan ng hari habang nananatiling angkop bilang kasangkapan ng paghatol.
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Tuwirang katawagan sa materyal na naglalarawan sa setro at nagbibigay-diin sa lakas at tindi nito.
- source_word: כִּכְלִי
  choice: parang sisidlan
  rationale: Malawak ang kahulugan ng כְּלִי, na maaaring sisidlan o kagamitan. Ang “sisidlan” ang pinakanatural kasama ng magpapalayok at hindi nililimitahan ang larawan sa isang tiyak na uri ng palayok.
- source_word: יוֹצֵר
  choice: ng magpapalayok
  rationale: Sa ganitong parirala, karaniwang tumutukoy ang יוֹצֵר sa taong humuhubog ng mga sisidlang luwad, kaya natural at tiyak ang “magpapalayok.”
- source_word: תְּנַפְּצֵם
  choice: dudurugin mo sila
  rationale: Ipinahihiwatig ng pandiwa ang marahas na pagbasag o pagdurog. Matingkad at likas sa modernong Tagalog ang “dudurugin,” lalo na sa larawan ng marupok na sisidlan.
theological_decisions:
- issue: Kung ang unang pandiwa ay naglalarawan ng mapanirang paghatol o maharlikang pamamahala
  choice: 'Mapanirang paghatol: “Babasagin mo sila”'
  alternative: 'Maharlikang pamamahala: “Papastulan mo sila” o “Pamumunuan mo sila”'
  rationale: Pumapabor ang pagbigkas sa Masoretic Text at ang parallel na “dudurugin mo sila” sa larawan ng paghatol. Gayunman, mahalaga ang alternatibo dahil makikita ito sa ilang sinaunang salin at umaalingawngaw sa Pahayag; kaya inilagay ito sa talababa sa halip na alisin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “setro” upang mapanatili ang maharlikang konteksto, at ang magkatugmang “babasagin” at “dudurugin” upang maipakita ang matinding larawan ng paghatol nang hindi pinapawi ang alternatibong pagbasa.
