base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/003.yaml
  text: Let us tear off their chains and cast their ropes from us[a][b][c].
translation:
  language: tl
  text: “Lagutin natin ang kanilang mga gapos[a] at itapon palayo sa atin ang kanilang mga lubid[b].”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga panali.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga tali.”
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “at itapon ang kanilang mga lubid mula sa atin.”'
    reason: literal_rendering
lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Lagutin natin
  rationale: Ang unang panauhang maramihang cohortative ay nagpapahayag ng sama-samang paninindigan o pag-uudyok. Ipinahihiwatig ng pandiwa ang marahas na pagputol o pagkalas sa pumipigil; malinaw at matindi sa makabagong Tagalog ang “lagutin natin.”
- source_word: מֹוסְרוֹתֵימוֹ
  choice: kanilang mga gapos
  rationale: Tumutukoy ang pangngalan sa mga panali o bagay na pumipigil. Pinananatili ng “mga gapos” ang kongkretong larawan nang hindi ipinapalagay na literal na bakal ang mga ito.
- source_word: וְנַשְׁלִיכָה
  choice: at itapon
  rationale: Isa rin itong unang panauhang maramihang cohortative. Likas at tuwiran sa Tagalog ang “itapon,” at ipinahahayag nito ang mariing pagtatakwil sa pumipigil.
- source_word: מִמֶּנּוּ
  choice: palayo sa atin
  rationale: Ipinakikita ng pang-ukol at hulaping unang panauhang maramihan na inaalis ng mga nagsasalita ang mga panali mula sa kanilang sarili. Ang “palayo sa atin” ay natural na nagpapahayag ng direksiyon ng pagtatapon.
- source_word: עֲבֹתֵימוֹ
  choice: kanilang mga lubid
  rationale: Ang salita ay tumutukoy sa mga lubid o makakapal na panali. Karaniwan at madaling maunawaan ang “mga lubid,” at pinananatili nito ang paralelismo sa “mga gapos.”
theological_decisions:
- issue: Metapora ng pagpipigil ng Diyos at ng hari
  choice: Panatilihin ang kongkretong larawan ng “mga gapos” at “mga lubid” nang hindi ito tahasang tinatawag na pang-aapi.
  alternative: Isalin sa mas abstraktong paraan bilang “mga pumipigil” o ipaliwanag bilang mapaniil na paghahari.
  rationale: Sa konteksto, ang nagsasalita ay mga naghihimagsik laban sa PANGINOON at sa kanyang Hinirang, ngunit inilalahad lamang ng talata ang sarili nilang paglalarawan sa paghahari bilang mga panali. Pinananatili ng salin ang tensiyong ito at hindi ipinapasya sa mismong teksto kung makatarungan o mapaniil ang pagpipigil.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatambal na “gapos” at “lubid” upang mapanatili ang kongkreto at patulang paralelismo ng Hebreo; ang “natin” sa dalawang pandiwa ay kumakatawan sa lakas ng mga cohortative.
