  text: וַ֭/אֲנִי נָסַ֣כְתִּי מַלְכִּ֑/י עַל צִ֝יּ֗וֹן הַר קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/006.yaml
  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: tl
  text: “Ngunit ako, iniluklok ko[a] ang aking hari sa Zion, sa aking banal na bundok.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinalaga ko ang aking hari”; inuunawa naman ng ilan ang pandiwa bilang “pinahiran ko ang aking hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: 'Ipinapahayag nito ang pagsalungat at diin ng malayang panghalip: taliwas sa paghihimagsik ng mga bansa at mga pinuno, ipinahahayag ng PANGINOON ang sarili niyang pasiya.'
- source_word: נָסַכְתִּי
  choice: iniluklok ko
  rationale: Malinaw nitong ipinahahayag sa makabagong Tagalog ang paglalagay o pagtatalaga sa hari sa kaniyang trono. Hindi nito ipinagkakamali ang pandiwa sa karaniwang salitang Hebreo para sa ritwal na pagpapahid.
- source_word: מַלְכִּי
  choice: ang aking hari
  rationale: Tuwirang pinananatili ang pangngalang may hulaping paari sa unang panauhan. Ginamit ang maliit na titik upang hindi magdagdag ng interpretasyong wala sa anyong leksikal ng Hebreo.
- source_word: עַל
  choice: sa
  rationale: Sa pariralang tumutukoy sa lugar, ang “sa” ang likas na katumbas sa Tagalog at hindi nagpapahiwatig na ang Zion ang pinaghaharian sa halip na lugar ng pagluklok.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Ginamit ang nakaugaliang transliterasyon sa Tagalog ng pangalan ng lugar.
- source_word: הַר קָדְשִׁי
  choice: sa aking banal na bundok
  rationale: Likas at tuwirang salin ito ng pariralang nangangahulugang “aking banal na bundok,” habang pinananatili ang heograpikong larawan ng הַר bilang bundok.
theological_decisions:
- issue: Kung ang נָסַכְתִּי ay dapat isaling ritwal na pagpapahid o maharlikang pagluklok
  choice: maharlikang pagluklok (“iniluklok ko”)
  alternative: ritwal na pagpapahid (“pinahiran ko”) o simpleng pagtatalaga/paglalagay (“itinalaga ko”)
  rationale: Ang konteksto ay tugon ng PANGINOON sa mga naghihimagsik na hari sa pamamagitan ng pagpapahayag sa pinili niyang hari sa Zion. Pinananatili ng “iniluklok” ang diwa ng maharlikang pagtatalaga nang hindi sapilitang nililimitahan ang pandiwa sa ritwal na pagpapahid. Hindi rin nito hinahadlangan ang mesiyanikong pagbasa sa mas malawak na konteksto ng Kasulatan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mariing pagsalungat sa “Ngunit ako” at ang larawan ng maharlikang pagluklok; iniwasan ang sobrang tradisyonal o denominasyonal na pananalita.
