  text: Kaya nga ngayon, mga hari, maging marunong kayo; magpaturo kayo, mga hukom ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumanggap kayo ng pagsaway,” “tumanggap kayo ng pagtutuwid,” o, ayon sa konteksto, “tanggapin ninyo ang babala.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtanggap ng turo, disiplina, o payo, hindi lamang sa babala.
