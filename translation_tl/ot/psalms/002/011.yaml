  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: tl
  text: Maglingkod kayo kay Yahweh nang may takot[a], at magalak kayo[b] nang may panginginig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang may pagpipitagan”; ang salitang Hebreo para sa “takot” ay maaari ring magpahiwatig ng pagkamangha at pagpipitagan sa harap ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magbunyi kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Maglingkod kayo
  rationale: Ang pangmaramihang pautos ng עבד ay tumutukoy sa paglilingkod at katapatan kay Yahweh. Pinananatili ng “maglingkod” ang malawak na diwa at hindi ito nililimitahan sa gawaing pagsamba lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּיִרְאָה
  choice: nang may takot
  rationale: Maaaring mangahulugan ang יִרְאָה ng takot, pagpipitagan, o pagkamangha. Ang “takot” ang tuwirang salin at nagpapanatili sa matinding tono ng pagpapasakop sa awtoridad ng Diyos.
- source_word: וְגִילוּ
  choice: at magalak kayo
  rationale: Ang גיל ay nagpapahayag ng matinding kagalakan o pagbubunyi. Likas at malinaw sa modernong Filipino ang “magalak,” habang inilalagay sa talababa ang mas masidhing alternatibong “magbunyi.”
- source_word: בִּרְעָדָה
  choice: nang may panginginig
  rationale: Ang רְעָדָה ay panginginig o pagyanig, kadalasan dahil sa takot o matinding pagpipitagan. Pinananatili ng parirala ang kapansin-pansing pagsasama ng kagalakan at panginginig.
theological_decisions:
- issue: Ang magkatambal na utos ng masayang pagtugon at may-takot na pagpapasakop
  choice: 'Pinanatili ang dalawang utos sa kanilang tensiyon: “Maglingkod kayo kay Yahweh nang may takot, at magalak kayo nang may panginginig.”'
  alternative: Maaaring palambutin bilang “Sumamba kayo kay Yahweh nang may pagpipitagan, at magdiwang kayo,” ngunit mawawala ang tahasang takot at panginginig.
  rationale: Magkatabing inilalahad ng Hebreo ang takot at kagalakan nang walang paliwanag. Hindi nilulutas ng salin ang paradoksong ito kundi kapuwa itong pinananatili.
- issue: Pagsasalin sa יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa pamamagitan ng karaniwang transliterasyong “Yahweh.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kayo” upang malinaw na katawanin ang pangmaramihang pautos. Ang “nang may” ay likas na pariralang Filipino para sa paraan ng pagkilos, at sadyang pinanatili ang matinding pagtatambal ng takot, kagalakan, at panginginig.
