  naturalness: Ang “Pumupuwesto” at “nagsasama-sama” ay likas na modernong Filipino at naipahahayag ang sinadya, nagkakaisang pagkilos nang hindi dinaragdagan ang kahulugan.
  terminology: Wastong panatilihin ang “Yahweh.” Ang “kanyang pinahiran” ang pinakatapat na salin ng מְשִׁיחוֹ; maaaring ilagay sa talababa ang “kanyang Mesiyas” bilang pamagat na alternatibo, nang hindi ipinipilit ang isang tiyak na pagbasa sa pangunahing teksto.
