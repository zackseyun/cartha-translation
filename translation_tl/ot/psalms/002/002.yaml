  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: tl
  text: Pumupuwesto ang mga hari ng daigdig, at nagsasama-sama ang mga pinuno laban kay Yahweh at laban sa kanyang pinahiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang Mesiyas.” Lit., “kanyang pinahiran.”
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: Naghahanay upang lumaban
  rationale: Ipinahahayag ng Hitpael ng יצב ang sinasadya at mapanlabang pagpuwesto. Likas sa Filipino ang pariralang ito at malinaw ang puwersang adversatibo ng konteksto.
- source_word: מַלְכֵי אֶרֶץ
  choice: ang mga hari sa lupa
  rationale: Pinananatili ang malawak at pandaigdigang saklaw ng אֶרֶץ sa konteksto ng Awit 2.
- source_word: וְרוֹזְנִים
  choice: at ... ang mga pinuno
  rationale: Ang רוֹזְנִים ay tumutukoy sa matataas na pinunong pampolitika; malinaw at makabago ang 'mga pinuno.'
- source_word: נוֹסְדוּ יָחַד
  choice: sama-samang nagtitipon
  rationale: Ipinakikita ang nagkakaisa at koordinadong pagkilos nang hindi ipinapasok sa pangunahing teksto ang mas interpretatibong 'nagbabalak' o 'nakikipagsabwatan.'
- source_word: עַל
  choice: laban kay ... at laban sa
  rationale: Sa kontekstong ito, adversatibo ang עַל at nagpapahiwatig ng tahasang pagsalungat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili bilang pangalan ang Tetragrammaton sa halip na palitan ito ng titulong 'PANGINOON.'
- source_word: מְשִׁיחוֹ
  choice: kanyang Hinirang
  rationale: Ang מָשִׁיחַ ay literal na isang taong pinahiran o itinalaga. Ang 'Hinirang' ay natural at marangal sa Filipino at hindi agad naglilimita sa reperensiya sa teknikal na titulong 'Mesiyas.'
theological_decisions:
- issue: Ang agarang maharlikang reperensiya at mas malawak na mesiyanikong kabuluhan ng מְשִׁיחוֹ
  choice: kanyang Hinirang
  alternative: kanyang Mesiyas; kanyang pinahiran
  rationale: Pinananatili ng 'Hinirang' ang katauhan at natatanging pagtatalaga ng hari habang hindi tahimik na nilulutas ang tensiyon sa pagitan ng agarang Davidikong hari at ng mas malawak na mesiyanikong pagbasa. Inilalagay sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang aktibong larawang 'naghahanay upang lumaban' upang maipakita ang sinadya at mapanlabang pagpuwesto, at iniwasan ang 'nakikipagsabwatan' dahil mas interpretatibo iyon kaysa sa anyong Hebreo.
