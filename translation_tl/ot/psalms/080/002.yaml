  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: tl
  text: Sa harap ng Efraim, Benjamin, at Manases, pukawin mo ang iyong kapangyarihan[b], at pumarito ka upang iligtas kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at humayo ka para sa aming kaligtasan.” Literal na “humayo/lumakad” ang pandiwang Hebreo, ngunit sa konteksto ay pakiusap itong mamagitan ang Diyos para sa kanyang bayan.
    reason: lexical_alternative
  - marker: b
    text: O “lakas” o “makapangyarihang lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: Sa harap ng
  rationale: Pinananatili nito ang spatial na larawan ng Diyos na nasa unahan o nagpapakita sa harap ng mga lipi, at natural ito sa makabagong Tagalog.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Efraim, Benjamin, at Manases
  rationale: Mga pangalang pantangi ito na isinalin ayon sa karaniwang anyong Filipino; ginamit ang natural na bantas sa halip na ulitin ang pangatnig.
- source_word: עוֹרְרָה
  choice: pukawin mo
  rationale: Nananatili ang metapora ng paggising o pagpapakilos sa kapangyarihan, habang malinaw na isang marubdob na pakiusap ang anyong pautos.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: ang iyong kapangyarihan
  rationale: Saklaw ng גְּבוּרָה ang lakas, kapangyarihan, at makapangyarihang kakayahan; ang 'kapangyarihan' ay natural, marangal, at madaling maunawaan.
- source_word: וּלְכָה
  choice: at pumarito ka
  rationale: Bagaman literal na mula sa pandiwang 'lumakad/pumunta,' sa panalanging ito ay pakiusap na kumilos ang Diyos para sa mga humihingi; ipinahahayag ng 'pumarito' ang kilos patungo sa kanila nang hindi dinaragdagan ang diwa.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: upang iligtas kami
  rationale: Likas na ipinahahayag sa Tagalog ang layunin ng pagparito, habang pinananatili ang diwa ng kaligtasan o pagliligtas para sa bayan.
theological_decisions:
- issue: Paglalarawan sa pagkilos ng Diyos sa panalangin
  choice: Tuwirang pakiusap na ipamalas ng Diyos ang kanyang kapangyarihan at pumarito upang magligtas.
  alternative: Pukawin mo ang iyong lakas at humayo ka para sa aming kaligtasan.
  rationale: Ang talata ay isang marubdob na panalangin, hindi isang pahayag na dapat gawing sistematikong doktrina. Pinananatili ng salin ang tensiyon sa pagitan ng literal na 'humayo' at ng kontekstuwal na pakiusap na lumapit at mamagitan ang Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino, angkop sa panalangin at madaling maunawaan ng karaniwang mambabasa. Ginamit ang 'pukawin' upang mapanatili ang Hebreong metapora at 'pumarito' upang maging natural ang pakiusap sa konteksto. Ang lahat ng panandang talababa ay nakalagay sa pangunahing teksto.
