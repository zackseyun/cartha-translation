lexical_decisions:
- source_word: גֶּפֶן
  choice: isang puno ng ubas
  rationale: Tumutukoy ito sa punong ubas at ginagamit dito bilang talinghaga para sa Israel. Likas sa makabagong Filipino ang “isang puno ng ubas,” at hindi nito tahasang pinapalitan ng Israel ang talinghaga.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Ipinahihiwatig ng pang-ukol ang pinagmulan. Ang “mula sa Ehipto” ay malinaw at natural sa Filipino at umaalingawngaw sa paglabas mula sa Ehipto.
- source_word: תַּסִּיעַ
  choice: Naglabas ka
  rationale: Ang Hiphil ng נסע ay maaaring mangahulugang magpaalis, magpalakbay, o bumunot at maglipat. Sa talinghaga ng pag-alis ng puno ng ubas mula sa Ehipto, ipinahahayag ng “naglabas” ang sanhi at direksiyon nang hindi lubusang inaalis ang saklaw ng pandiwa.
- source_word: תְּגָרֵשׁ
  choice: pinalayas mo
  rationale: Ang Piel ng גרש ay karaniwang nangangahulugang palayasin o itaboy. Ang “pinalayas” ay tuwiran at likas sa konteksto ng pagpapaalis sa mga bansa sa lupain.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa mga bansang nasa lupain. Iniiwasan ng “mga bansa” ang pagpasok ng mas huling teknikal na diwa ng “mga Hentil.”
- source_word: וַתִּטָּעֶהָ
  choice: at itinanim mo iyon
  rationale: Ang hulapi ay tumutukoy sa pambabaeng pangngalang “puno ng ubas,” ngunit gramatikal lamang ang kasarian nito sa Hebreo. Natural sa Filipino ang “iyon” para sa halaman at malinaw ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan ng puno ng ubas bilang talinghaga
  choice: Pinanatili sa pangunahing teksto ang talinghagang “isang puno ng ubas.”
  alternative: Tahasan itong isalin bilang “Israel.”
  rationale: Talinghaga ang mismong anyo ng Hebreo. Ang pagpapalit nito ng “Israel” sa pangunahing teksto ay magpapaliwanag sa halip na magsalin; inilagay ang pagkakakilanlan sa talababa.
- issue: Saklaw ng kahulugan ng תַּסִּיעַ
  choice: Isinalin bilang “Naglabas ka,” na angkop sa paglabas mula sa Ehipto.
  alternative: “Pinalakbay mo” o “binunot mo at inilipat.”
  rationale: May leksikal na tensiyon sa pagitan ng pagpapayaon at pagbunot/paglilipat. Pinili ang natural na pangunahing salin habang pinananatili sa talababa ang mahahalagang alternatibo.
- issue: Panghalip para sa puno ng ubas
  choice: Ginamit ang “iyon.”
  alternative: Gumamit ng panghalip na nagpapahiwatig ng taong babae.
  rationale: Ang pambabaeng anyo ng hulaping Hebreo ay umaayon sa gramatikal na kasarian ng “puno ng ubas” at hindi sapilitang personipikasyon. Ang “iyon” ay natural sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng dalawang sugnay at ang talinghaga ng puno ng ubas. Inilagay ang mga marker na [b][a] kasunod ng pariralang pinaiilawan ng dalawang talababa, ayon sa ibinigay na pagkakasunod sa consultation layer.
