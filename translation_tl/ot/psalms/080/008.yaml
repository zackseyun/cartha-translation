  text: Inilipat mo ang isang puno ng ubas[b] mula sa Ehipto[a]; pinalayas mo ang mga bansa at itinanim mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Pinalakbay mo mula sa Ehipto ang isang puno ng ubas” o “Binunot mo mula sa Ehipto ang isang puno ng ubas.” Maaaring ipahiwatig ng pandiwang Hebreo ang pagpapalakad/pagpapayaon o ang pagbunot at paglilipat.'
    reason: lexical_alternative
