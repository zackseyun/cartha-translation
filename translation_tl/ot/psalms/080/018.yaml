  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: tl
  text: Kung magkagayon, hindi kami tatalikod sa iyo; bigyan mo kami ng buhay[a], at tatawag kami sa iyong pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buhayin mo kami.” Maaari ring mangahulugang “panatilihin mo kaming buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Kung magkagayon, hindi
  rationale: Ipinahihiwatig ng pang-ugnay at pagtanggi ang magiging bunga ng naunang pakiusap. Likas sa modernong Tagalog ang “Kung magkagayon” at hindi nito ginagawang tiyak ang ugnayan nang higit sa ipinahihintulot ng konteksto.
- source_word: נָסוֹג
  choice: tatalikod
  rationale: Ang pandiwa ay tumutukoy sa pag-urong o pagtalikod. Ang “tatalikod” ay malinaw at angkop sa katapatan sa Diyos nang hindi ipinapasok ang mas makitid na diwa ng “muling magkakasala.”
- source_word: מִמֶּךָּ
  choice: sa iyo
  rationale: Kasama ng “tatalikod,” ang “sa iyo” ang natural na katumbas sa Tagalog ng paghihiwalay na ipinahihiwatig ng Hebreong pang-ukol.
- source_word: תְּחַיֵּנוּ
  choice: bigyan mo kami ng buhay
  rationale: Sinasalamin nito ang causative na diwa ng חיה at pinananatili ang malawak na saklaw na maaaring tumukoy sa pagbuhay, pagpapanibagong-buhay, o pagpapanatiling buhay.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: at tatawag kami sa iyong pangalan
  rationale: Natural na inilalarawan nito ang Hebreong idyoma ng pagtawag o pagdalangin sa pangalan ng Diyos, habang pinananatili ang tahasang pagbanggit sa “pangalan.”
theological_decisions:
- issue: Diwa ng pakiusap na magbigay ng buhay
  choice: Isang pakiusap na bigyan o muling pagkalooban ng Diyos ng buhay ang bayan upang manatili silang tapat at tumawag sa kanya.
  alternative: Maaaring unawain nang mas makitid bilang “buhayin mo kaming muli” o mas malawak bilang “panatilihin mo kaming buhay.”
  rationale: Malawak ang saklaw ng Hebreong חיה sa Piel. Pinananatili ng “bigyan mo kami ng buhay” ang tensiyon sa pagitan ng muling pagbuhay at pagpapanatili sa buhay sa halip na tahimik na pumili ng isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong panalangin, ang maramihang tinig ng bayan, at ang idyomang “tumawag sa iyong pangalan.”
