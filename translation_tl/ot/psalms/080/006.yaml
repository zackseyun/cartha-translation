translation:
  language: tl
  text: 'Ginagawa mo kaming sanhi ng alitan sa aming mga kapitbahay,

    at kinukutya sila ng aming mga kaaway.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at kinukutya kami ng aming mga kaaway.” Ang Hebreong לָמוֹ ay “sila,” ngunit may ilang sinaunang salin na nagpapahiwatig ng “kami.”'
    reason: Itinutuwid ang alternatibong tala upang tumpak na maipakita ang kalabuan sa pagtukoy at ang tekstuwal na alternatibong “kami,” habang pinananatili sa pangunahing teksto ang ikatlong panauhang maramihan ng Masoretikong Hebreo.
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Ginagawa mo kaming
  rationale: 'Tuwirang ipinapahayag ang ikalawang panauhang sanhi: ‘ginagawa/itinatakda mo kami bilang.’'
- source_word: מָדוֹן
  choice: sanhi ng alitan
  rationale: Ang pangngalan ay tumutukoy sa pagtatalo o hidwaan; natural sa Filipino ang ‘sanhi ng alitan’ sa konstruksiyong ito.
- source_word: לִשְׁכֵנֵינוּ
  choice: sa aming mga kapitbahay
  rationale: Pinananatili ang ugnayang ipinahihiwatig ng לְ at ang maramihang ‘aming mga kapitbahay.’
- source_word: יִלְעֲגוּ
  choice: kinukutya
  rationale: Ang pandiwa ay nangangahulugang manlibak o mangutya; ang aspektong Filipino ay piniling umayon sa kasalukuyan at patuloy na kalagayan ng panaghoy.
- source_word: לָמוֹ
  choice: sila
  rationale: Pinananatili sa pangunahing teksto ang ikatlong panauhang maramihan ng tekstong Masoretiko, gaya ng audited consultation layer, habang inilalahad sa talababa ang tunay na sintaktikong kalabuan.
theological_decisions:
- issue: Tinutukoy ng לָמוֹ
  choice: ‘sila,’ na pinakamalapit na tumutukoy sa mga kapitbahay
  alternative: ‘kami’ o ‘sa kani-kanilang sarili’
  rationale: Ang anyong Masoretiko ay ikatlong panauhang maramihan, kaya hindi ito tahasang ginawang ‘kami.’ Gayunman, posible ang ibang pag-unawa sa di-karaniwang patulang gamit, kaya pinanatili ang tensiyon sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino; malinaw para sa karaniwang mambabasa at angkop sa panaghoy na patula. Ginamit ang ‘kapitbahay’ sa mas malawak na diwang mga karatig-bayan o kalapit na mga tao.
