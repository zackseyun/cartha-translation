  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: tl
  text: Sinunog sa apoy at pinutol—sa iyong pagsaway[a] ay nalilipol sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “sa pagsaway ng iyong mukha.” Ang “mukha” ay Hebreong larawan ng presensya o personal na pagharap.
    reason: Pinananatili ng pangunahing teksto ang natural na Tagalog, habang itinatala ang larawang Hebreo ng “mukha” na nasa pinagmulan.
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: Sinunog sa apoy
  rationale: Pinananatili ang pasibong anyo at malinaw na larawan ng pagkasunog; ang pambabaeng isahan ay tumutukoy sa punong ubas sa konteksto.
- source_word: כְּסוּחָה
  choice: pinutol
  rationale: Ipinahahayag ang pagtabas o pagputol sa punong ubas nang natural at tuwiran sa Tagalog.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: sa pagsaway ng iyong mukha
  rationale: Pinananatili ang literal at matinding idyomang Hebreo sa halip na gawing simpleng 'sa iyong pagsaway,' upang huwag mawala ang larawan ng personal na pagharap ng Diyos.
- source_word: יֹאבֵדוּ
  choice: napapahamak sila
  rationale: Ang pandiwa ay maaaring tumukoy sa pagkapahamak o pagkalipol; pinili ang natural na kasalukuyang anyo na kasuwato ng makatang paglalarawan.
theological_decisions:
- issue: Ang sanhi at paksa ng pagkapahamak
  choice: Pinanatili ang tahasang 'sila' at ang pagsaway mula sa mukha ng Diyos.
  alternative: Maaaring gawing 'nalilipol ito sa iyong pagsaway,' na inuugnay ang pandiwa sa punong ubas bilang isang kolektibong bagay.
  rationale: Maramihan ang יֹאבֵדוּ, kaya pinananatili ang tunay na pagbabago mula sa pambabaeng isahang punong ubas tungo sa maramihang 'sila,' malamang ang bayan na kinakatawan nito.
translation_notes:
  register: Makata, marangal, at tuwiran. Ginamit ang gitling upang mapanatili ang siksik na ayos ng Hebreong taludtod at ang ugnayan ng pagkasunog, pagputol, at pagkapahamak.
