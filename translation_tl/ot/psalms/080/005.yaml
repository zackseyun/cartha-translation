  text: You have fed them bread of tears[a], and given them tears to drink in full measure.
translation:
  language: tl
  text: Pinakain mo sila ng tinapay ng luha, at pinainom mo sila ng saganang luha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maaaring “luha ayon sa ikatlong panukat” o “luha sa tatlong sukat.” Malamang na tumutukoy ang huling salita sa malaking takal, ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Pinakain mo sila
  rationale: Ang Hiphil ng אכל na may hulaping 3mp ay causative, ‘pinakain’ o ‘pinakain mo sila.’ Likas ito sa modernong Tagalog at malinaw na tumutukoy sa ginawa ng Diyos.
- source_word: לֶחֶם דִּמְעָה
  choice: tinapay ng luha
  rationale: Pinananatili ang matingkad at sadyang di-karaniwang metapora ng Hebreo sa halip na gawing pangkalahatang ‘pagkaing may luha.’ Ang isahang דִּמְעָה ay natural na maisasalin bilang kolektibong ‘luha.’
- source_word: וַתַּשְׁקֵמוֹ
  choice: at pinainom mo sila
  rationale: Ang Hiphil ng שקה ay nangangahulugang ‘pinainom’ o ‘binigyan upang inumin.’ Ang ‘pinainom mo sila’ ay maikli, natural, at kaagapay ng ‘pinakain mo sila.’
- source_word: בִּדְמָעוֹת
  choice: ng ... luha
  rationale: Sa konteksto ng pandiwang ‘pinainom,’ ipinahihiwatig ng preposisyon ang bagay na ipinainom. Natural sa Tagalog ang ‘pinainom ... ng luha.’
- source_word: שָׁלִישׁ
  choice: saganang
  rationale: Malabo ang tiyak na kahulugan ng terminong panukat. Ipinahihiwatig nito rito ang malaking dami; ang ‘saganang’ ay nagpapanatili sa diin nang hindi nag-aangkin ng tiyak na sukat. Inilalahad sa talababa ang mas literal na mga posibilidad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paralelismong ‘pinakain/pinainom’ at ang matinding metaporang ‘tinapay ng luha.’ Ang panandang [a] ay inilagay pagkatapos ng pariralang saklaw ng paliwanag.
