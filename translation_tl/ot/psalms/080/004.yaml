source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: tl
  text: Yahweh, Diyos ng mga hukbo, hanggang kailan ka magngangalit[a] laban sa panalangin ng iyong bayan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “uusok ka.” Inilalarawan ng pandiwang Hebreo ang galit na parang usok o pag-aalimpuyo. Maaari ring isalin, “hanggang kailan uusok ang galit mo laban sa panalangin ng iyong bayan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Diyos ng mga hukbo
  rationale: Pinananatili ang saklaw ng צְבָאוֹת nang hindi nililimitahan kung panlupa o makalangit na mga hukbo ang tinutukoy.
- source_word: עַד מָתַי
  choice: hanggang kailan
  rationale: Likas na pananalitang Filipino para sa pormula ng paghihinagpis sa Hebreo.
- source_word: עָשַׁנְתָּ
  choice: magngangalit
  rationale: Ipinahahayag sa natural at marangal na Filipino ang matinding galit na inilalarawan ng pandiwang Hebreo bilang pag-usok o pag-aalimpuyo; ipinapaliwanag sa talababa ang literal na larawan.
- source_word: בִּתְפִלַּת
  choice: laban sa panalangin
  rationale: Binabasa ang pang-ukol na בְּ sa adversatibong diwa sa kontekstong ito, kaya ang galit ay nakaharap laban sa panalangin.
- source_word: עַמֶּךָ
  choice: iyong bayan
  rationale: Ang “bayan” ay natural na tumutukoy sa sama-samang sambayanang nakikipagtipan sa Diyos sa konteksto ng salmo.
theological_decisions:
- issue: Paglalahad sa banal na titulong יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Yahweh, Diyos ng mga hukbo
  alternative: Panginoong Diyos ng mga hukbo
  rationale: Pinananatili ang personal na pangalang יְהוָה at ang sadyang malawak na kahulugan ng “mga hukbo.”
- issue: Pagpapanatili sa larawang pag-usok bilang galit
  choice: magngangalit, na may talababa tungkol sa literal na larawang pag-usok
  alternative: uusok laban sa
  rationale: Ang tuwirang “uusok laban sa panalangin” ay madaling mapagkamalang pisikal na usok at hindi likas sa Filipino. Ang “magngangalit” ay nagpapanatili sa nag-aalimpuyong tindi at antropomorpikong tensiyon, habang ang talababa ang tahasang nag-iingat sa larawan ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magngangalit” upang maging natural ang matinding larawang patula, at inilagay sa talababa ang literal na metapora upang hindi ito mawala.
