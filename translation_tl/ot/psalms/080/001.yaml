source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: tl
  text: 'Pastol ng Israel, makinig ka,


    ikaw na umaakay kay Jose na gaya ng isang kawan;


    ikaw na nakaluklok sa ibabaw ng mga kerubin,[a]


    magningning ka![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakaluklok sa gitna ng mga kerubin.” Literal na “nakaupo/nakaluklok, mga kerubin” ang Hebreo; hindi nito tahasang tinutukoy ang eksaktong relasyong panlunan. Karaniwang larawan ito ng maharlikang presensiya ng Diyos.
    reason: alternative_reading
  - marker: b
    text: O “magpakita ka sa iyong ningning.” Ang pandiwang Hebreo ay maaaring tumukoy sa maningning na pagpapakita.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה יִשְׂרָאֵל
  choice: Pastol ng Israel
  rationale: Pinananatili ang tuwirang panawagan at ang talinghaga ng Diyos bilang pastol; natural at marangal itong titulo sa Filipino.
- source_word: הַאֲזִינָה
  choice: makinig ka
  rationale: Ang pautos ay humihiling ng masusing pakikinig. Mas natural sa modernong Filipino ang “makinig ka” kaysa sa literal ngunit pilit na “ikiling mo ang iyong tainga.”
- source_word: נֹהֵג
  choice: umaakay
  rationale: Sa konteksto ng pagpapastol, ipinahihiwatig nito ang aktibong paggabay sa kawan. Ang “umaakay” ay natural at hindi nagdaragdag ng marahas na diwa ng pagtataboy.
- source_word: כַּצֹּאן
  choice: na gaya ng isang kawan
  rationale: Ang צאן ay pangngalang kolektibo para sa maliliit na alagang hayop; pinananatili ng “isang kawan” ang kolektibong larawan.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Pinananatili ang pangalang nasa Hebreo sa halip na tahasang palitan ng “Israel” o “mga lipi sa hilaga,” kahit maaari itong kumatawan sa mga taong iyon.
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: nakaluklok sa ibabaw ng mga kerubin
  rationale: Sa banal at maharlikang larawang ito, ang יֹשֵׁב ay higit sa karaniwang pag-upo at tumutukoy sa pagkaluklok bilang hari. Hindi lubos na tiyak sa Hebreo ang eksaktong kaugnayang panlunan, kaya itinatala sa talababa ang ibang salin.
- source_word: הוֹפִיעָה
  choice: magningning ka
  rationale: Sa konteksto ng pagpapakita ng Diyos, ang pandiwa ay nagsasaad ng maningning na pagpapahayag o paglitaw. Maikli at makata ang “magningning ka,” habang ang mas malinaw na alternatibo ay inilalagay sa talababa.
theological_decisions:
- issue: Ang pagkaluklok ng Diyos kaugnay ng mga kerubin
  choice: nakaluklok sa ibabaw ng mga kerubin
  alternative: nakaluklok sa gitna ng mga kerubin
  rationale: Ipinahihiwatig ng parirala ang maharlikang presensiya ng Diyos na kaugnay ng mga kerubin, ngunit hindi tahasang tinutukoy ng Hebreo kung “sa ibabaw,” “sa gitna,” o “sa pagitan.” Pinili ang karaniwang larawan ng trono nang hindi itinatago ang alternatibo.
- issue: Ang kahulugan ng “Jose”
  choice: panatilihin ang pangalang “Jose”
  alternative: ipaliwanag sa teksto bilang Israel o mga lipi sa hilaga
  rationale: Metonimiko man ang gamit at maaaring tumukoy sa bayan ng Israel, lalo na sa mga lipi sa hilaga, pangalang “Jose” mismo ang nasa tekstong Hebreo at hindi ito dapat tahimik na palitan.
- issue: Ang maningning na pagpapakita ng Diyos
  choice: magningning ka
  alternative: magpakita ka sa iyong ningning
  rationale: Pinananatili ng pangunahing salin ang matinding maikling pautos at ang larawan ng liwanag; nililinaw ng alternatibo ang diwa ng pagpapakita ng Diyos nang hindi ito ipinipilit sa pangunahing teksto.
translation_notes:
  register: Makata, marangal, at tuwiran ang rehistro, ngunit gumagamit ng karaniwang modernong Filipino. Hinati sa magkakatimbang na mga linya upang maipakita ang paralelismo. Iniwasan ang arkaikong “dinggin” dahil maaaring magpahiwatig iyon ng tuwirang layon na wala sa parirala, samantalang malinaw at likas ang “makinig ka.”
