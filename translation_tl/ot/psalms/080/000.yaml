  source_fidelity: 'Tumpak na naipapahayag ng salin ang anim na bahagi ng superskripsiyong Hebreo: destinasyon sa tagapanguna, ang hindi tiyak na pahiwatig na אֶל sa pamamagitan ng “ayon sa,” ang pamagat/katawagang “Mga Liryo,” ang hiwalay na עֵדוּת bilang “Isang patotoo,” ang kaugnayan kay Asaf, at ang genre na “Awit.” Hindi nito inaangkin nang labis ang tiyak na himig, may-akda, o gamit-litruhjikal.'
