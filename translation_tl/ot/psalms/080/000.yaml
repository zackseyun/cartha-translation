  yaml_path: translation/ot/psalms/080/000.yaml
  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: tl
  text: 'Para sa tagapanguna ng mga mang-aawit: ayon sa “Mga Liryo.” Isang patotoo.[a] Awit ni Asaf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa tagapanguna ng mga mang-aawit: sa himig na ‘Mga Liryo.’ Patotoo. Para kay Asaf. Isang awit.” Malamang na nag-iingat ang pamagat sa Hebreo ng mga tagubiling musikal o liturhikal na hindi na tiyak ang eksaktong kahulugan.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Ipinahihiwatig ng karaniwang pormula sa pamagat ng mga awit ang taong nangangasiwa sa musikal na pagtatanghal; malinaw at likas ito sa modernong Tagalog.
- source_word: אֶל
  choice: ayon sa
  rationale: Sa mga pamagat ng Awit, malamang na nagpapakilala ito ng himig, estilo, o tagubilin sa pagtatanghal, bagaman hindi tiyak ang eksaktong bisa.
- source_word: שֹׁשַׁנִּים
  choice: “Mga Liryo”
  rationale: Literal itong tumutukoy sa mga liryo ngunit malamang na pamagat ng isang himig o katawagang musikal, kaya nilagyan ng panipi.
- source_word: עֵדוּת
  choice: Isang patotoo
  rationale: Pinananatili ang tuwirang kahulugan at ang pagiging hiwalay nito sa “Mga Liryo”; maaaring isa itong liturhikal o musikal na katawagan.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Likas na anyo sa Tagalog para sa kaugnayan kay Asaf, habang hindi tahasang nililimitahan kung ito ay akda niya, para sa kaniya, o kabilang sa koleksiyong nauugnay sa kaniya.
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwan at marangal na salin ng katawagan sa isang komposisyong inaawit; ang malaking titik ay angkop sa pamagat.
