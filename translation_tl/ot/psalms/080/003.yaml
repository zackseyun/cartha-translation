  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: tl
  text: Diyos, ibalik mo kami[a]; pasikatin mo ang iyong mukha sa amin[b], upang maligtas kami.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panumbalikin mo kami” o “papagbalikin mo kami.” Ang pandiwang Hebreo ay maaaring mangahulugang magpangyaring bumalik ang isang tao.
    reason: lexical_alternative
  - marker: b
    text: Literal na “pasikatin mo ang iyong mukha sa amin,” isang larawan ng kagandahang-loob at presensiya ng Diyos. Ihambing sa Bilang 6:25.
    reason: cross_reference
  - marker: c
    text: Maaari ring “at maliligtas kami.” Ang anyong Hebreo ay maaaring maunawaan bilang panalangin para sa bungang ito o bilang tiyak na pahayag tungkol sa magiging bunga.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang pagtawag ito sa Diyos ng Israel. Likas sa modernong Tagalog ang “Diyos” kahit walang idinagdag na pantawag na “O.”
- source_word: הֲשִׁיבֵנוּ
  choice: ibalik mo kami
  rationale: Ang Hiphil ng שׁוב ay causative, “papagbalikin/ibalik.” Pinananatili ng “ibalik mo kami” ang kongkretong diwa ng pagbabalik at maaari ring tumukoy sa pagpapanumbalik ng kalagayan o ugnayan.
- source_word: וְהָאֵר
  choice: pasikatin mo
  rationale: Ang Hiphil imperative ng אור ay “pasikatin.” Natural itong katambal ng “mukha” sa Tagalog at pinananatili ang causative na anyo.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang literal at mahalagang larawang Hebreo ng mukha ng Diyos, na nagpapahiwatig ng kanyang presensiya at pagpapala, sa halip na palitan ito ng interpretatibong “presensiya.”
- source_word: וְנִוָּשֵׁעָה
  choice: upang maligtas kami
  rationale: Ang Niphal na unang panauhang maramihan ay naglalahad ng ninanais na bunga ng mga naunang pakiusap. Sinasalamin ng “upang maligtas kami” ang panalanging tono at ang malawak na saklaw ng ישׁע.
theological_decisions:
- issue: Volitive na diwa ng huling pandiwa kaugnay ng mga naunang pautos
  choice: “upang maligtas kami” bilang hinihiling na layunin o bunga
  alternative: “at maliligtas kami” bilang tiyak o inaasahang bunga
  rationale: Kasunod ng dalawang pautos ang cohortative-like na anyo, kaya pinakamainam itong marinig bilang ninanais na bunga. Gayunman, tunay na posible ang pagbasa bilang tiyak na resulta at inilalagay iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sa amin” upang maging natural at malinaw ang Hebreong larawan ng mukha ng Diyos na sumisikat tungo sa kanyang bayan. Pinanatili ang “mukha” at “maligtas” dahil mahalaga ang kanilang matalinghaga at teolohikal na lawak.
