base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: tl
  text: Diyos ng mga hukbo, ibalik mo kami[a]; pasikatin mo ang iyong mukha[b], at maliligtas kami[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panumbalikin mo kami” o “pabalikin mo kami.” Ang pandiwang Hebreo ay maaaring magpahayag kapwa ng pagbabalik at panunumbalik.
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong mukha” ay isang idyoma para sa mapagpalang presensiya at pagsang-ayon ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “masasagip kami.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa pagsagip o kaligtasan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang pagtawag ito sa Diyos ng Israel; sa natural na Tagalog, sapat ang “Diyos” nang walang pantawag na “O.”
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili nito ang malawak na larawan ng mga puwersang nasa ilalim ng kapangyarihan ng Diyos, sa halip na limitahan iyon sa mga hukbong panlupa lamang.
- source_word: הֲשִׁיבֵנוּ
  choice: ibalik mo kami
  rationale: Ang anyong causative ng שוב ay “pangyarihing bumalik.” Ang “ibalik mo kami” ay natural at pinananatiling bukas kung ang tinutukoy ay pagbabalik, panunumbalik, o kapwa nito.
- source_word: וְהָאֵר
  choice: pasikatin mo
  rationale: Ipinahahayag ng hiphil ng אור ang causative na diwa, “pangyarihing lumiwanag”; natural itong isinasalin na “pasikatin mo” kasama ng “mukha.”
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang kongkretong idyomang Hebreo para sa mapagpalang presensiya at pagsang-ayon ng Diyos, sa halip na ipalit agad ang interpretasyong “presensiya.”
- source_word: וְנִוָּשֵׁעָה
  choice: at maliligtas kami
  rationale: Malawak ang saklaw ng ישׁע at maaaring tumukoy sa pagliligtas o pagsagip. Pinananatili ng “maliligtas” ang lawak na iyon at ang resulta ng pagkilos ng Diyos.
theological_decisions:
- issue: Pagsasalin sa titulong אֱלֹהִים צְבָאוֹת
  choice: Diyos ng mga hukbo
  alternative: Diyos ng mga hukbong makalangit
  rationale: Hindi nililimitahan ng tekstong Hebreo ang צְבָאוֹת sa mga hukbong makalangit lamang. Ang “mga hukbo” ay nagpapanatili sa lawak at larawan ng kapangyarihan ng Diyos sa lahat ng puwersa.
- issue: Saklaw ng kaligtasan sa וְנִוָּשֵׁעָה
  choice: maliligtas kami
  alternative: masasagip kami
  rationale: Maaaring tumukoy ang Hebreo sa malawak na pagliligtas, kabilang ang makasaysayang pagsagip. Hindi pinapaliit ng “maliligtas” ang saklaw nito at hindi rin ipinipilit na espirituwal lamang ang kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na larawang “mukha” at ang malawak na titulong “Diyos ng mga hukbo,” habang gumamit ng tuwirang mga pandiwang “ibalik,” “pasikatin,” at “maliligtas.”
