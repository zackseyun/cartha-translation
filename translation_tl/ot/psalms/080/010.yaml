  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: tl
  text: 'Natakpan ng lilim nito ang mga bundok,

    at natakpan ng mga sanga nito ang mga sedro ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang napakalalaking sedro.” Maaaring isang idyoma ang pariralang Hebreo na “mga sedro ng Diyos” para sa mga sedrong pambihira ang laki o karilagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: Natakpan
  rationale: 'Ang Qal perfect na maramihan ay inilalarawan sa natural na Filipino bilang natapos na kalagayan: natakpan ang mga bundok ng lilim ng punong ubas.'
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tuwirang katumbas ng pangngalang maramihan na may pantukoy.
- source_word: צִלָּהּ
  choice: ng lilim nito
  rationale: Ang צֵל ay maaaring 'lilim' o 'anino'; mas angkop ang 'lilim' sa larawan ng malagong punong ubas na lumalaganap at tumatakip.
- source_word: וַעֲנָפֶיהָ
  choice: at ng mga sanga nito
  rationale: 'Pinananatili ang paralelismo at elipsis ng Hebreo: kung paanong natakpan ng lilim ang mga bundok, gayon din natakpan ng mga sanga ang mga sedro.'
- source_word: אַרְזֵי אֵל
  choice: ang mga sedro ng Diyos
  rationale: Pinananatili sa pangunahing teksto ang tahasang pariralang Hebreo na 'mga sedro ng Diyos,' sa halip na agad itong ipakahulugang superlatibong 'napakalalaking sedro.'
theological_decisions:
- issue: Kahulugan ng אֵל sa pariralang אַרְזֵי אֵל
  choice: mga sedro ng Diyos
  alternative: napakalalaking sedro / mariringal na sedro
  rationale: Maaaring literal na kaugnayan sa Diyos o idyomang Hebreo para sa pambihirang laki at karilagan. Pinananatili ng pangunahing teksto ang tunay na anyo at tensiyon ng parirala, habang inilalahad sa talababa ang posibleng idyomatikong diwa.
- issue: Ugnayan ng וַעֲנָפֶיהָ sa אַרְזֵי אֵל
  choice: Ang mga sedro ay natakpan ng mga sanga nito, na ipinahihiwatig ng pandiwa sa unang linya
  alternative: Ang mga sanga nito ay tulad ng mga sedro ng Diyos
  rationale: 'Mas matibay na sinusuportahan ng paralelismong Hebreo ang elipsis ng pandiwang ''natakpan'': lilim—mga bundok; mga sanga—mga sedro. Hindi naglalaman ang teksto ng tahasang pananda ng paghahambing na ''tulad ng.'''
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang patulang elipsis sa ikalawang linya upang maipakita ang mahigpit na paralelismo ng Hebreo, nang hindi nagdaragdag ng paghahambing na wala sa teksto.
