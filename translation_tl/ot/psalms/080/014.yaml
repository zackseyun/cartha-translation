  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: tl
  text: O Diyos ng mga hukbo, bumalik ka nawa; tumingin ka mula sa langit at masdan mo, at lingapin mo ang punong ubas na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawin mo ang punong ubas na ito.” Ang pandiwang Hebreo ay maaaring mangahulugang “dalawin,” “asikasuhin,” “lingapin,” o “siyasatin”; dito, hinihiling na kumilos ang Diyos para sa ikabubuti nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Diyos ng mga hukbo
  rationale: Pinananatili nito ang larawan ng Diyos bilang pinuno ng mga hukbo, kabilang ang makalangit na hukbo, sa halip na palitan ito ng mas malawak ngunit higit na interpretatibong “Makapangyarihang Diyos.”
- source_word: שׁוּב נָא
  choice: bumalik ka nawa
  rationale: Ang שׁוּב ay tuwirang pakiusap na bumalik o muling humarap sa bayan; ipinahahayag ng “nawa” ang mapagpakumbabang pagsusumamo ng נָא sa marangal at likas na Tagalog.
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: tumingin ka mula sa langit
  rationale: Tuwirang inilalarawan ang masusing pagtingin mula sa makalangit na kinaroroonan nang hindi dinaragdagan ang Hebreo.
- source_word: וּרְאֵה
  choice: at masdan mo
  rationale: Pinananatili ang ikalawang utos sa poetikong pagkakasunod; ang “masdan” ay natural na katuwang ng “tumingin” at nagpapahiwatig ng pagbibigay-pansin.
- source_word: וּפְקֹד
  choice: at lingapin mo
  rationale: Sa konteksto ng panalangin para sa punong ubas, ipinahahayag ng “lingapin” ang mapagkalingang pagdalaw at pagkilos para sa ikabubuti nito, habang ang lawak ng pandiwa ay nililinaw sa talababa.
- source_word: גֶּפֶן זֹאת
  choice: ang punong ubas na ito
  rationale: Ang גֶּפֶן ay iisang punong ubas, hindi ubasan; pinananatili ng salin ang eksaktong metapora para sa Israel.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֱלֹהִים צְבָאוֹת
  choice: Diyos ng mga hukbo
  alternative: Makapangyarihang Diyos
  rationale: Pinananatili ng pinili ang militar at kosmikong larawan ng צְבָאוֹת at iniiwasang ipalit ang isang teolohikal na titulo na hindi siyang payak na leksikal na kahulugan.
- issue: Diwa ng פקד sa panalangin
  choice: lingapin mo
  alternative: dalawin mo
  rationale: Sa kontekstong ito, ang hinihingi ay hindi lamang pagdating kundi mapagkalingang pakikialam para sa kapakanan ng punong ubas. Gayunman, hindi lubusang nilulutas ang lawak ng salita; inilalahad sa talababa ang iba pang posibleng diwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang ihatid ang taimtim na pakiusap, at “punong ubas” upang maging malinaw sa karaniwang mambabasa na isang halaman, hindi isang ubasan, ang metapora.
