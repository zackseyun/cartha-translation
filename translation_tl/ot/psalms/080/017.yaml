  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: tl
  text: Mapasa lalaking nasa iyong kanan ang iyong kamay—sa anak ng tao na iyong pinalakas para sa iyong sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִי
  choice: Mapasa
  rationale: Ipinahahayag ng jussive ng היה ang isang dalangin o kahilingan; likas at marangal sa Tagalog ang “mapasa” sa ganitong patulang pananalita.
- source_word: יָדְךָ
  choice: iyong kamay
  rationale: Pinananatili ang kongkretong talinghagang “kamay,” na maaaring magpahiwatig ng kapangyarihan, pagtangkilik, o pagkilos nang hindi nililimitahan ang kahulugan.
- source_word: עַל
  choice: sa
  rationale: Ang “sa” ang natural na katumbas sa Tagalog para sa pagkakalapat o pagtangkilik na hinihiling sa konteksto.
- source_word: אִישׁ יְמִינֶךָ
  choice: lalaking nasa iyong kanan
  rationale: Natural itong Tagalog at pinananatili ang kaugnayan ng lalaki sa kanang kamay o kanan ng Diyos; inilalahad sa talababa ang tunay na ambiguwidad ng idyoma.
- source_word: בֶּן אָדָם
  choice: anak ng tao
  rationale: Pinananatili ang isahan, panlalaking anyo at ang biblikal na parirala nang hindi ito tahasang ginagawang titulo ng Mesiyas.
- source_word: אִמַּצְתָּ
  choice: iyong pinalakas
  rationale: Ang Piel ng אמץ ay nagsasaad ng pagpapalakas o pagpapatatag; malinaw na naihahatid ng “pinalakas” ang sanhi at bunga.
- source_word: לָּךְ
  choice: para sa iyong sarili
  rationale: 'Inililitaw nito ang kaugnayan o layunin ng pagpapalakas: ginawa siya ng Diyos na malakas para sa sarili niyang layunin o pag-aari.'
theological_decisions:
- issue: Kung ang “lalaking nasa iyong kanan” at “anak ng tao” ay dapat isaling tahasan bilang titulong mesiyaniko
  choice: Pinanatili bilang patulang pagtukoy sa isang tao, nang walang malaking titik o paliwanag na tahasang mesiyaniko
  alternative: Isalin o ipaliwanag bilang tuwirang pagtukoy sa Mesiyas, o bilang kolektibong pagtukoy sa Israel
  rationale: Maaaring magkaroon ang mga salita ng maharlika, kolektibo, o mesiyanikong alingawngaw, ngunit hindi ipinipilit ng Hebreo sa talatang ito ang iisang pagbasa. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Ginamit ang “mapasa” upang mapanatili ang himig ng panalangin. Ang “nasa iyong kanan” ay mas natural kaysa sa literal na “lalaki ng iyong kanang kamay,” habang ang talababa ang nagpapanatili sa lawak ng idyomang Hebreo.
