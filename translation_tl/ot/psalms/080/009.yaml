  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: tl
  text: Naghanda ka ng puwang para rito[a], at nag-ugat ito[b] at pinuno nito ang lupain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nilinis mo ang lugar sa harap nito.” Maaari ring tumukoy ang pandiwang Hebreo sa paghahanda ng lugar o pag-aalis ng mga sagabal sa harap ng baging.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “nag-ugat ang mga ugat nito,” isang ekspresyong Hebreo na nangangahulugang matatag itong nag-ugat.'
    reason: lexical_alternative
  - marker: c
    text: O “daigdig.” Maaaring tumukoy ang salitang Hebreo sa isang partikular na lupain o sa buong daigdig.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Nilinis mo ang lugar sa harap nito
  rationale: Ang Piel ng פנה kasama ng לְפָנֶיהָ ay tumutukoy sa pag-aalis ng sagabal o paghahanda ng puwang sa harap ng puno ng ubas. Natural sa Filipino ang “nilinis mo ang lugar” at pinananatili nito ang larawang pang-agrikultura.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: at nag-ugat ito
  rationale: 'Literal na inuulit ng Hebreo ang salitang-ugat: “nag-ugat ang mga ugat nito.” Ang “nag-ugat ito” ang natural na katumbas sa Filipino at naghahayag ng matatag na pagkakatatag nang hindi nagdaragdag ng di-hayag na pagpapalalim.'
- source_word: וַתְּמַלֵּא
  choice: at pinuno
  rationale: Pinananatili ng “pinuno” ang pangunahing kahulugan ng מלא at ang larawan ng baging na lumalaganap hanggang sakupin ang lupain.
- source_word: אָרֶץ
  choice: ang lupain
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupain” o “daigdig.” Sa konteksto ng baging na larawan ng Israel, malamang na lokal ang saklaw, kaya “lupain” ang nasa teksto habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Ang tinutukoy ng baging
  choice: Panatilihin ang talinghagang baging at gamitin ang panghalip na “ito.”
  alternative: 'Tukuyin nang tuwiran ang Israel: “Nag-ugat ang Israel at pinuno nito ang lupain.”'
  rationale: Malinaw sa mas malawak na konteksto na Israel ang baging, ngunit hindi ito tahasang pinapangalanan sa talata. Ang pagpapanatili sa talinghaga ay tapat sa Hebreo at hindi naglalagay ng paliwanag sa pangunahing teksto.
- issue: Saklaw ng אָרֶץ
  choice: “ang lupain”
  alternative: “ang daigdig”
  rationale: Ang konteksto ay pumapabor sa lupain bilang teritoryong nilaganapan ng baging, ngunit nananatiling posible sa leksikon ang mas malawak na “daigdig”; kaya hindi lubusang isinasara ang alternatibo at inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling paralelismo at talinghagang pang-agrikultura ng Hebreo. Ginamit ang “puno ng ubas” sa talababa para sa madaling pagkaunawa, ngunit hindi idinagdag ang referent na Israel sa pangunahing teksto.
