  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: tl
  text: O Yahweh, Diyos ng mga hukbo, ibalik mo kami[a]; pasikatin mo ang iyong mukha, upang maligtas kami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panumbalikin mo kami” o “pabalikin mo kami.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at maliligtas kami.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh upang tuwirang katawanin ang Tetragrammaton at mapanatili ang pagkakakilanlan nito bilang pangalan ng Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang titulong banal ito na nakapuwesto kasunod ng Yahweh sa tambalang panawagan.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili nito ang malawak na larawan ng mga hukbo o kalipunan sa ilalim ng kapangyarihan ng Diyos, nang hindi nililimitahan sa hukbong panlupa.
- source_word: הֲשִׁיבֵנוּ
  choice: ibalik mo kami
  rationale: Ang causative imperative ng שוב ay maaaring tumukoy sa pagpapabalik o pagpapanumbalik. Ang “ibalik mo kami” ay natural, maikli, at nagpapanatili ng saklaw na iyon.
- source_word: הָאֵר
  choice: pasikatin mo
  rationale: Ipinapahayag ng causative imperative ang pagpapasikat o pagpapaliwanag; ang “pasikatin” ay nagpapanatili sa konkretong metapora.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang literal at teolohikal na makabuluhang idyoma ng mukha ng Diyos sa halip na ipakahulugan agad bilang presensiya o pagsang-ayon.
- source_word: וְנִוָּשֵׁעָה
  choice: upang maligtas kami
  rationale: Ang cohortative/volitional na anyo kasunod ng mga pautos ay likas na maipapahayag bilang layunin o bunga, habang kinikilala sa talababa ang posibleng sunod na katiyakan.
theological_decisions:
- issue: Paglalahad sa יְהוָה אֱלֹהִים צְבָאוֹת
  choice: O Yahweh, Diyos ng mga hukbo
  alternative: O Yahweh, Diyos ng mga hukbong sandatahan
  rationale: Pinananatili ang banal na pangalan at ang malawak na kahulugan ng צְבָאוֹת; iniiwasan ang mas makitid na pagbasa na para lamang sa mga hukbong militar ng tao.
- issue: Ugnayan ng וְנִוָּשֵׁעָה sa mga naunang pakiusap
  choice: upang maligtas kami
  alternative: at maliligtas kami
  rationale: Maaaring ipahiwatig ng anyong volitional ang layunin o inaasahang bunga. Pinili sa teksto ang purposive na pagbasa ngunit pinanatili sa talababa ang posibleng pagbasa bilang kasunod na katiyakan.
- issue: Kahulugan ng הֲשִׁיבֵנוּ
  choice: ibalik mo kami
  alternative: panumbalikin mo kami
  rationale: Hindi tahasang nilulutas kung ang diin ay pagpapabalik-loob, pagbabalik mula sa pagkakalayo, o ganap na pagpapanumbalik; ang pangunahing salin ay sadyang malawak.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang panawagang “O Yahweh” ay nagpapanatili ng taimtim na himig, samantalang ang maiikling pautos ay umaayon sa anyo ng panalanging Hebreo. Pinanatili ang konkretong idyomang “pasikatin mo ang iyong mukha” kahit mas matalinghaga ito kaysa karaniwang usapan.
