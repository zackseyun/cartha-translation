  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: tl
  text: 'Sinisira[a] ito ng baboy-ramo mula sa gubat,

    at nanginginain dito ang mga hayop sa parang.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nginangatngat ito.”
    reason: Ang bihirang pandiwang Hebreo ay maaaring tumukoy sa mapanirang pagkain o pagngatngat sa halaman.
  - marker: b
    text: O “at kinakain ito ng mga hayop sa parang.”
    reason: Ang pandiwang Hebreo ay karaniwang nangangahulugang manginain o kumain; ang “nanginginain” ay pinananatili ang larawan ng mga hayop na kumakain ng halaman.
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: Nilalapa ito
  rationale: Ang bihirang pandiwang כרסם ay tumutukoy sa mapanirang pagkain o pagngatngat ng hayop. Ipinahihiwatig ng “nilalapa” kapwa ang pagkain at matinding pagkasira ng punong ubas.
- source_word: חֲזִיר מִיָּעַר
  choice: baboy-ramo mula sa gubat
  rationale: Ang חֲזִיר ay baboy, at nililinaw ng מִיָּעַר na nagmumula ito sa gubat; likas at tiyak sa Filipino ang “baboy-ramo.”
- source_word: זִיז שָׂדַי
  choice: mababangis na hayop sa parang
  rationale: Ang bihirang זִיז ay tumutukoy sa gumagalaw o buhay na nilalang, lalo na sa mga hayop. Sa kontekstong ito, malinaw at natural ang kolektibong “mababangis na hayop,” habang pinananatili ng “sa parang” ang larawan ng שָׂדַי.
- source_word: יִרְעֶנָּה
  choice: nanginginain dito
  rationale: Karaniwang nangangahulugan ang רעה sa Qal na manginain o kumain ng pananim. Ang “nanginginain dito” ay nagpapanatili sa larawang pastoral at tumutukoy sa punong ubas na nauna sa konteksto.
