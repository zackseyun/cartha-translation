  register: Makabago at marangal na Filipino; pinili ang “nilalapa” upang maging buhay ang larawang makata at ang “nanginginain” upang mapanatili ang tiyak na kilos ng mga hayop. Ang hati sa dalawang linya ay sumusunod sa paralelismo ng tulang Hebreo.
