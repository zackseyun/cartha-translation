    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: Umabot
  rationale: Ang Piel ng שלח ay naglalarawan sa pagpapalawak o pagpapaabot ng paglago ng puno ng ubas. Sa Filipino, natural na ipinahahayag ng “umabot” ang lawak na tinutukoy ng עַד, habang pinananatili ang larawan ng paglaganap.
- source_word: קְצִירֶהָ
  choice: ang mga sanga nito
  rationale: Di-pangkaraniwan ang gamit ng קציר sa kontekstong ito; sa paralelismo ng taludtod, tumutukoy ito sa lumalawak na bahagi ng puno ng ubas. Malinaw at likas sa modernong Filipino ang “mga sanga,” ngunit inilalahad sa talababa ang mas pangkalahatang posibilidad.
- source_word: עַד יָם
  choice: hanggang sa dagat
  rationale: Ang עַד ay nagsasaad ng hangganan o lawak. Ang “hanggang sa dagat” ay tuwirang katumbas at malamang na tumutukoy sa Dagat Mediteraneo nang hindi ito isinasama bilang tahasang interpretasyon sa pangunahing teksto.
- source_word: וְאֶל נָהָר
  choice: at hanggang sa Ilog
  rationale: Bagaman אֶל ay karaniwang “sa/patungo sa,” hinihingi ng paralelismo sa עַד יָם ang ideya ng lawak. Ang malaking titik sa “Ilog” ay nagpapahiwatig ng malamang na pagtukoy sa Eufrates, na ipinaliliwanag sa talababa.
- source_word: יוֹנְקוֹתֶיהָ
  choice: ang mga usbong nito
  rationale: Ang pangngalan ay tumutukoy sa sariwa o batang pagtubo mula sa halaman. Natural at tumpak sa larawang panghalaman ang “mga usbong,” at mas malinaw ito kaysa sa teknikal na “mga suhi.”
theological_decisions:
- issue: Heograpikong saklaw ng dagat at ng Ilog
  choice: Pinanatili sa teksto ang “dagat” at “Ilog,” at ipinaliwanag lamang sa talababa ang malamang na pagtukoy sa Mediteraneo at Eufrates.
  alternative: Tahasang isalin bilang “Dagat Mediteraneo” at “Ilog Eufrates.”
  rationale: Pinananatili nito ang matalinghagang pananalita at antas ng katiyakan ng Hebreo, nang hindi ginagawang bahagi ng teksto ang interpretasyong heograpiko.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “puno ng ubas” sa mga paliwanag upang linawin ang talinghaga, ngunit hindi ito inulit sa mismong taludtod. Inayos ang mga marker ayon sa bahaging aktuwal na ipinapaliwanag ng bawat talababa.
