translation:
  language: tl
  text: Iniunat nito ang mga sanga nito hanggang sa dagat[a], at ang mga usbong nito hanggang sa Ilog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo rito ay di-pangkaraniwan at maaari ring tumukoy nang mas pangkalahatan sa lumalawak na pagtubo ng punong ubas.
    reason: lexical_alternative
  - marker: b
