source:
  edition: WLC
  text: לָ֭/מָּה פָּרַ֣צְתָּ גְדֵרֶ֑י/הָ וְ֝/אָר֗וּ/הָ כָּל עֹ֥בְרֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: tl
  text: 'Bakit mo giniba ang mga bakod nito[a],

    kaya pinipitas ng lahat ng dumaraan sa daan ang bunga nito?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pader nito” o “mga halamang-bakod nito”; tumutukoy ang Hebreo sa pananggalang sa paligid ng isang ubasan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pinipitas ito.” Ipinahihiwatig ng pandiwang Hebreo ang pagpitas o pagkuha ng ani mula sa punong-ubas, hindi kinakailangang ang lubusang pagwasak dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas at tuwirang katumbas sa makabagong Tagalog ng panaghoy na patanong na “bakit.”
- source_word: פָּרַצְתָּ
  choice: giniba
  rationale: Ipinahahayag ang pagbuwag sa pananggalang ng ubasan, habang pinananatili ang tuwirang pakikipag-usap sa Diyos.
- source_word: גְדֵרֶיהָ
  choice: mga bakod nito
  rationale: Ang גדר ay pananggalang na pader, bakod, o halamang-bakod sa paligid ng ubasan. Mas malinaw sa karaniwang mambabasa ang “mga bakod” kaysa “mga pader,” na maaaring magpahiwatig ng kuta o lungsod.
- source_word: וְאָרוּהָ
  choice: kaya pinipitas ... ang bunga nito
  rationale: Ang pandiwa ay tumutukoy sa pagpitas o pagkuha mula sa punong-ubas. Idinagdag ang “bunga” bilang likas na ipinahihiwatig na layon sa Tagalog, nang hindi ginagawang ganap na pagwasak ang kilos.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: lahat ng dumaraan sa daan
  rationale: Pinananatili ang kolektibong diwa at ang makatang larawan ng sinumang naglalakbay sa daan.
theological_decisions:
- issue: Tinutukoy ng mga hulaping pambabae
  choice: Pinanatili ang larawan ng punong-ubas o ubasan sa pamamagitan ng “nito” at “bunga nito.”
  alternative: Tuwirang tukuyin ang Israel at alisin ang talinghaga ng ubasan.
  rationale: Sa kalapit na konteksto, inilalarawan ang Israel bilang punong-ubas na inilabas mula sa Ehipto. Pinananatili ng salin ang talinghaga at hindi ito ginagawang tahasang prosa tungkol sa Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang makatang indayog. Ginamit ang “bakod” upang mapanatili ang larawan ng ubasan at ang “kaya” upang maipakita ang likas na bunga ng pagbuwag sa pananggalang, bagaman ang Hebreo ay gumagamit lamang ng pang-ugnay na maaari ring isaling “at.”
