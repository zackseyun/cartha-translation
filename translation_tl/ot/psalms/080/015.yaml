  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “usbong,” “sanga,” o “punong-ugat.” Bihira ang salitang Hebreo at ginamit dito sa larawan ng punong-ubas.
    reason: lexical_alternative
  - marker: b
