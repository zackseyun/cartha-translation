lexical_decisions:
- source_word: כַנָּה
  choice: puno
  rationale: Bihira ang salitang Hebreo at bahagi ito ng larawan ng ubasan. Ang “puno” ay natural sa Filipino at hindi labis na nagtatakda kung usbong, sanga, o punong-tangkay ang tinutukoy.
- source_word: נָטְעָה
  choice: itinanim
  rationale: Karaniwang kahulugan ng pandiwa ang “magtanim,” at pinananatili nito ang larawang pang-ubasan.
- source_word: יְמִינֶךָ
  choice: iyong kanang kamay
  rationale: Pinananatili ang kongkretong larawan ng kanang kamay ng Diyos bilang tagapagpahiwatig ng makapangyarihan niyang pagkilos.
- source_word: וְעַל
  choice: at
  rationale: Ikinakabit nito ang ikalawang layon sa una. Ang pag-uulit ng “at ang” ay malinaw at likas sa Filipino.
- source_word: בֵּן
  choice: anak
  rationale: Ito ang tuwirang kahulugan ng salitang Hebreo. Hindi ito ginawang “sanga” sa pangunahing teksto upang mapanatili ang personipikasyon at ang posibleng kolektibong pahiwatig.
- source_word: אִמַּצְתָּה
  choice: pinalakas
  rationale: 'Ipinahahayag nito ang causative na diwa ng Piel: ginawang malakas o matatag ang tinutukoy.'
- source_word: לָּךְ
  choice: para sa iyong sarili
  rationale: Inililitaw nito ang diwang ang anak ay pinalakas ng Diyos para sa sarili niyang layunin.
theological_decisions:
- issue: Pagkakakilanlan ng “anak” sa larawan ng punong-ubas
  choice: Pinanatili ang literal na “anak” nang hindi tinutukoy sa pangunahing teksto kung sino ito.
  alternative: Maaaring unawain bilang “sanga,” bilang kolektibong Israel, o sa isang tipolohikal o mesiyanikong pagbasa.
  rationale: Israel bilang punong-ubas ang agarang konteksto, ngunit “anak” ang mismong salitang Hebreo. Pinananatili ng salin ang sadyang pag-igting at hindi ipinapasok sa teksto ang isang tiyak na interpretasyong teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong patula at ang bitin na pangwakas na gitling, yamang nagpapatuloy ang diwa sa kasunod na talata.
