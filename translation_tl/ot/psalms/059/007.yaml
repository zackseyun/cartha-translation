  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: tl
  text: Narito, bumubulwak[a] ang kanilang mga salita mula sa kanilang bibig; mga tabak ang nasa kanilang mga labi, sapagkat sinasabi nila[b], “Sino ang nakaririnig?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umaagos nang sagana.” Ang pandiwang Hebreo ay naglalarawan ng pagsasalitang parang bumubula o bumubulwak.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, payak lamang na “sapagkat, ‘Sino ang nakaririnig?’” Walang tahasang “sinasabi nila” at walang binanggit na layon ng “nakaririnig,” kaya nananatiling bukas ang mapagmataas nilang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Ginamit bilang pantawag-pansin sa makabagong Tagalog. Napananatili nito ang puwersa ng partikulang Hebreo nang hindi gumagamit ng masyadong makalumang pananalita.
- source_word: יַבִּיעוּן
  choice: bumubulwak
  rationale: Ang Hiphil ng נבע ay naglalarawan ng pagbulwak o tuloy-tuloy na pag-agos. Pinananatili ng “bumubulwak” ang matingkad na larawan ng marahas at walang-pigil na pananalita.
- source_word: בְּפִיהֶם
  choice: mula sa kanilang bibig
  rationale: Bagaman maaaring literal na “sa/pamamagitan ng kanilang bibig,” natural sa Tagalog ang “mula sa” kasabay ng larawang ipinahihiwatig ng pagbulwak.
- source_word: חֲרָבוֹת
  choice: mga tabak
  rationale: Karaniwang kahulugan nito ang mga tabak. Pinanatili ang metapora ng nakapipinsalang pananalita sa halip na ipaliwanag ito bilang simpleng paninira o karahasan.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: nasa kanilang mga labi
  rationale: Natural na Tagalog ito para sa bagay na kanilang binibigkas at pinananatili ang paralelismo ng bibig at mga labi.
- source_word: כִּי
  choice: sapagkat sinasabi nila
  rationale: Ang כִּי ay nagbibigay ng dahilan, samantalang ang “sinasabi nila” ay isang malinaw ngunit minarkahang pagpapahayag ng ipinahihiwatig na introduksiyon sa kasunod na tuwirang pananalita.
- source_word: מִי שֹׁמֵעַ
  choice: Sino ang nakaririnig?
  rationale: Tinutumbasan nito ang Hebreong participle sa pangkasalukuyang diwa at pinananatiling maikli at bukas ang mapanghamong tanong.
theological_decisions:
- issue: Hindi tahasang layon ng pandiwang “nakaririnig”
  choice: Sino ang nakaririnig?
  alternative: Sino ang nakaririnig sa amin? / Sino ang nakaririnig nito?
  rationale: Walang binanggit na layon ang Hebreo. Ang hindi pagdaragdag nito ay nagpapanatili sa sinadyang kalabuan at sa kayabangang para bang walang sinuman—pati ang Diyos—ang nakaririnig, nang hindi tahasang inilalagay sa teksto ang wala roon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Idinagdag ang “ang kanilang mga salita” bilang likas na ipinahihiwatig na paksa ng “bumubulwak” upang maging maayos sa Tagalog, ngunit hindi ito pinagkamalang “mga tabak”; ang mga tabak ay nananatiling kaugnay ng mga labi ayon sa sintaks ng Hebreo.
