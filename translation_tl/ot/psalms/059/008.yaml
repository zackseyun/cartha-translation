  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: tl
  text: 'Ngunit ikaw[a], Yahweh, ay tumatawa sa kanila;

    kinukutya mo ang lahat ng bansa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gayunman, ikaw, Yahweh, ay tumatawa sa kanila; nililibak mo ang lahat ng bansa.”
    reason: Maaaring katawanin ang panimulang וְ bilang “Gayunman,” at ang תִּלְעַג bilang “nililibak.”
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ang waw na sinusundan ng tahasang panghalip ay nagpapahiwatig dito ng pagsalungat sa naunang paglalarawan. Likas sa modernong Tagalog ang “Ngunit ikaw” at pinananatili nito ang diin sa “ikaw.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: תִּשְׂחַק לָ/מוֹ
  choice: tumatawa sa kanila
  rationale: Pinananatili ng “tumatawa” ang tuwirang larawan ng pandiwa, habang ipinahahayag ng “sa kanila” ang pinatutungkulan ng pagtawa.
- source_word: תִּלְעַג
  choice: kinukutya
  rationale: Malinaw at kasalukuyang salitang Tagalog ang “kinukutya” para sa pagkutya o panlilibak; ang aspektong di-ganap ay angkop sa anyong Hebreo.
- source_word: לְ/כָל גּוֹיִם
  choice: ang lahat ng bansa
  rationale: Ang גּוֹיִם ay malawak na tumutukoy sa mga bansa, hindi kinakailangang sa teknikal na kahulugang “mga Hentil.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Larawan ng pagtawa ng Diyos
  choice: tumatawa sa kanila
  alternative: nililibak sila
  rationale: Pinananatili ang kongkretong larawan at teolohikal na puwersa ng שׂחק nang hindi ito agad ipinapaliwanag sa mas abstraktong paraan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pagtawag na “Yahweh” nang walang “O,” na hindi likas sa karaniwang modernong Tagalog; pinanatili ang paralelismo ng tulang Hebreo sa dalawang linya.
