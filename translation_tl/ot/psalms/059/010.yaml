id: PSA.59.10
reference: Psalms 59:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֱלֹהֵ֣י חסד/ו יְקַדְּמֵ֑/נִי אֱ֝לֹהִ֗ים יַרְאֵ֥/נִי בְ/שֹׁרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: tl
  text: Ang Diyos ng kanyang tapat na pag-ibig[b] ay mauuna sa akin[a]; hahayaan ako ng Diyos na makita ang aking mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ibang pagbigkas o tradisyon ng salin: “Ang aking Diyos, sa kanyang tapat na pag-ibig, ay mauuna sa akin” o “Ang aking Diyos ng tapat na pag-ibig ay mauuna sa akin.”'
    reason: alternative_reading
  - marker: b
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na madalas tumutukoy sa matatag at mapagkakatiwalaang pag-ibig o awa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: Ang Diyos ng
  rationale: Pinananatili ang anyong construct ng אֱלֹהִים at ang kaugnayan nito sa kasunod na pangngalang may hulapi.
- source_word: חסדו
  choice: kanyang tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at mapagkakatiwalaang pag-ibig o awa; pinananatili rin ang panlalaking ikatlong panauhang hulapi bilang “kanyang.”
- source_word: יְקַדְּמֵנִי
  choice: ay mauuna sa akin
  rationale: Ang Piel ng קדם ay maaaring mangahulugang mauna, sumalubong, o humarap. Ang “mauuna sa akin” ay nagpapanatili sa pangunahing larawan nang hindi labis na ipinapaliwanag ang uri ng tulong ng Diyos.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Inuulit ang “Diyos” sa halip na palitan ng panghalip upang mapanatili ang pag-uulit at diin ng Hebreo.
- source_word: יַרְאֵנִי
  choice: hahayaan ako ... na makita
  rationale: 'Ang Hiphil ng ראה ay causative o permissive: “ipakita” o “hayaang makita.” Pinili ang likas na Filipino na hindi tahasang nagdaragdag ng ideya ng pagtatagumpay.'
- source_word: בְשֹׁרְרָי
  choice: ang aking mga kaaway
  rationale: Malinaw at natural na katumbas ng mga taong laban o galit sa nagsasalita.
theological_decisions:
- issue: Hulaping panghalip sa חסדו
  choice: kanyang tapat na pag-ibig
  alternative: aking Diyos, sa kanyang tapat na pag-ibig / aking Diyos ng tapat na pag-ibig
  rationale: Sinusunod ng pangunahing teksto ang WLC, na may hulaping 3ms (“kanyang”). Dahil hindi pangkaraniwan ang parirala at may ibang tradisyon ng pagbasa o pagbigkas, inilalahad sa talababa ang makabuluhang alternatibo nang hindi ito ipinapalit sa pinagmulang teksto.
- issue: Ipinahihiwatig na kinalabasan ng יַרְאֵנִי בְשֹׁרְרָי
  choice: hahayaan ako ng Diyos na makita ang aking mga kaaway
  alternative: ipakikita sa akin ng Diyos ang pagbagsak/pagtatagumpay ko laban sa aking mga kaaway
  rationale: Maaaring ipahiwatig ng konteksto ang pagkakitang nagapi ang mga kaaway, ngunit hindi tahasang nakasaad ang “pagbagsak” o “pagtatagumpay” sa Hebreo; pinanatili ang tensiyon at pagpipigil ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang di-pangkaraniwang konstruksiyong “Ang Diyos ng kanyang tapat na pag-ibig” dahil ito ang tuwirang pagbasa ng WLC, habang inilagay sa talababa ang mahahalagang alternatibo. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
