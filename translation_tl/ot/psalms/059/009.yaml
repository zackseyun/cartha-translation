  text: עֻ֭זּ/וֹ אֵלֶ֣י/ךָ אֶשְׁמֹ֑רָה כִּֽי אֱ֝לֹהִ֗ים מִשְׂגַּבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: tl
  text: 'Ang lakas niya[a]—sa iyo ako maghihintay[b],

    sapagkat ang Diyos ang aking muog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na “lakas niya.” Maraming sinaunang salin at tradisyonal na pagbasa ang umuunawa rito bilang tuwirang pagtawag: “O aking Lakas.” Maaari ring unawain: “Ang lakas niya—sa iyo ako maghihintay.”'
    reason: alternative_reading
  - marker: b
    text: O “sa iyo ako magbabantay” o “mapagmatyag na maghihintay sa iyo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbabantay, mapagmatyag na paghihintay, o paghihintay sa isang darating.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: O aking Lakas
  rationale: Ginamit bilang tuwirang pagtawag sa Diyos, gaya ng malamang na diwa sa konteksto at ng tradisyonal na pagbasa. Gayunman, ang anyong may patinig sa WLC ay literal na “lakas niya,” kaya tahasang pinanatili ang suliranin sa talababa.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Pinananatili ang direksiyon ng אֶל patungo sa Diyos at likas itong kaugnay ng “maghihintay” sa Filipino.
- source_word: אֶשְׁמֹרָה
  choice: maghihintay ako
  rationale: Ang pandiwa ay pangunahing may diwang mag-ingat o magbantay, ngunit sa kontekstong nakatuon sa Diyos ay maaari itong magpahiwatig ng mapagmatyag na paghihintay. “Maghihintay” ang pinakanatural na pangunahing salin, habang nasa talababa ang mas literal na alternatibo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng mapagtiwalang paghihintay ng mang-aawit.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang tawag sa Diyos ng Israel sa modernong Filipino.
- source_word: מִשְׂגַּבִּי
  choice: aking muog
  rationale: Ang “muog” ay maikli, marangal, at nagpapanatili sa larawan ng mataas at matibay na dakong kanlungan.
theological_decisions:
- issue: Kung ang עֻזּוֹ ay tuwirang pagtawag na “aking Lakas” o ikatlong panauhang “lakas niya”
  choice: O aking Lakas
  alternative: Ang lakas niya
  rationale: 'Mas malinaw sa konteksto ang pagtawag sa Diyos bilang lakas ng mang-aawit, ngunit hindi binago nang palihim ang tunay na hirap ng tekstong Masoretiko: inilalahad sa talababa na ang ibinigay na anyong WLC ay “lakas niya.”'
- issue: Kung ang אֶשְׁמֹרָה ay pagbabantay o paghihintay
  choice: maghihintay ako
  alternative: magbabantay ako
  rationale: Sa pagharap sa Diyos, ang mapagmatyag na paghihintay ang likas na diwa sa Filipino. Pinananatili sa talababa ang mas tuwirang leksikal na kahulugan upang hindi alisin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na may dignidad at bahagyang makatang himig. Ginamit ang “muog” upang mapanatili ang matibay na larawang pananggalang; maikli ang mga linya para sa anyong salmo. Ang mga malaking titik sa “Lakas” ay nagpapakitang tuwirang tawag ito sa Diyos, hindi isang abstraktong katangian.
