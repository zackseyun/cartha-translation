base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: tl
  text: 'Ngunit ako''y aawit tungkol sa iyong lakas;

    sa umaga''y aawit ako nang may galak[a] tungkol sa iyong tapat na pag-ibig[b],

    sapagkat ikaw ay naging tanggulan at kanlungan para sa akin

    sa araw ng aking kagipitan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sisigaw ako sa galak.” Maaaring idiin ng pandiwa ang masayang pagsigaw gayundin ang pag-awit.
    reason: lexical_alternative
  - marker: b
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na madalas tumutukoy sa matibay at mapagtipang pag-ibig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako'y
  rationale: Ang pangatnig at tahasang panghalip ay nagpapakita ng pagsalungat ng salmista sa kilos ng mga kaaway sa naunang konteksto.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: aawit tungkol sa iyong lakas
  rationale: Pinananatili nito ang pasiya o hinaharap na kilos ng nagsasalita at ang lakas ng Diyos bilang paksa ng awit.
- source_word: וַאֲרַנֵּן
  choice: aawit ako nang may galak
  rationale: Ang pandiwang רנן ay tumutukoy sa malakas at masayang pagpuri; pinananatili ng salin ang musikal na diwa at masiglang damdamin.
- source_word: לַבֹּקֶר
  choice: sa umaga
  rationale: Likas na temporal na parirala sa Filipino at umaayon sa paghahambing sa gabi sa nakapaligid na konteksto.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ipinapahayag nito ang matibay, maaasahan, at mapagtipang pag-ibig na saklaw ng Hebrew na חֶסֶד nang hindi gumagamit ng makaluma o sektaryong katawagan.
- source_word: כִּי הָיִיתָ
  choice: sapagkat ikaw ay naging
  rationale: Ipinakikita ang sanhi ng papuri at ang naranasan nang pagkilos ng Diyos na mahalaga pa rin sa kasalukuyan.
- source_word: מִשְׂגָּב לִי
  choice: tanggulan ko
  rationale: Ang מִשְׂגָּב ay isang mataas at ligtas na kuta; ang 'tanggulan' ay malinaw, matulain, at natural sa Filipino.
- source_word: וּמָנוֹס
  choice: at kanlungan
  rationale: Tumutukoy ang מָנוֹס sa lugar na matatakbuhan para sa kaligtasan; pinananatili ng 'kanlungan' ang kaibhan nito sa 'tanggulan.'
- source_word: בְּיוֹם צַר לִי
  choice: sa araw ng aking kagipitan
  rationale: Pinananatili ang larawan ng isang 'araw' o panahon ng personal na matinding hirap, sa likas na wikang Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa חֶסֶד sa konteksto ng pagliligtas ng Diyos
  choice: iyong tapat na pag-ibig
  alternative: iyong pag-ibig na ayon sa tipan; iyong habag
  rationale: Sinasaklaw ng 'tapat na pag-ibig' ang katapatan, pananatili, at mapagtipang kabutihan ng Diyos nang hindi nililimitahan ang salita sa habag lamang o nagdaragdag ng paliwanag sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang bahagyang patulang ayos at paghahati ng mga linya upang mapanatili ang paralelismo ng salmo; iniwasan ang labis na makaluma at denominasyonal na pananalita.
