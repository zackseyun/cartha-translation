  verdict: revise
  source_fidelity: 'Ang pangunahing salin ay malapit sa Hebreo: napananatili ang pag-uulit ng utos, ang tindi ng poot, ang ganap na pagwawakas, ang layunin/kinalabasan ng pagkakilala, at ang Selah. Gayunman, ang “ang Diyos ang namamahala sa Jacob” ay masidhi nang nagpapakahulugang namumuno ang Diyos *sa* Jacob, samantalang ang בְּיַעֲקֹב ay literal na “sa Jacob” at may kinikilalang saklaw na kalabuan. Ang “hanggang sa wala na sila” ay mas tuwirang katumbas ng וְאֵינֵמוֹ kaysa “hanggang sa mawala sila.”'
  naturalness: Likas at marangal ang “Lipulin mo sila sa iyong poot.” Mas natural at mas tumpak ang “ang Diyos ay naghahari sa Jacob” para sa patulang rehistro at upang huwag agad gawing isang kahulugang “namamahala sa Jacob” ang parirala. Ang kuwit bago ang pangwakas na parirala ay tumutulong na hindi ito mabasa na hangganan lamang ng pamamahala sa Jacob.
  terminology: 'Ang “lipulin,” “poot,” “Diyos,” “Jacob,” “mga dulo ng daigdig,” at “Selah” ay angkop. Dapat itama ang talababa b: ang “sa ibabaw ng Jacob” ay hindi natural na Tagalog para sa interpretasyong “over Jacob”; ang wastong alternatiba ay “namamahala sa Jacob.”'
