  - severity: medium
    issue: Hindi natural at hindi wasto ang alternatibong “sa ibabaw ng Jacob” sa talababa b.
    rationale: Ang “over Jacob” sa kontekstong ito ay tungkol sa pamamahala, hindi pisikal na kinalalagyan. Ang “namamahala sa Jacob” ang natural na Tagalog na alternatiba.
  - severity: low
    issue: Ang “mawala sila” ay bahagyang mas mahina kaysa “wala na sila.”
    rationale: Ang וְאֵינֵמוֹ ay “at sila ay wala na / are no more.” Ang “hanggang sa wala na sila” ay tuwiran at natural.
