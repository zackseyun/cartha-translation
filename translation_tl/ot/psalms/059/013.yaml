base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: tl
  text: Lipulin mo sila sa iyong poot[a]; lipulin mo sila hanggang sa wala na sila, upang malaman nila na ang Diyos ay naghahari sa Jacob, hanggang sa mga dulo ng daigdig[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Wasakin mo sila sa iyong poot; wasakin mo sila, at wala na sila.” Mas biglaan at literal ang ganitong pagkakasalin sa Hebreo.'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa Jacob” ay tumutukoy sa paghahari ng Diyos kaugnay ng Jacob, samakatuwid ay Israel; isinasalin naman ito ng ilan na “namamahala sa Jacob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: Lipulin
  rationale: Ang inuulit na Piel imperative ay humihiling na lubusang wakasan o wasakin ang mga kaaway. Likas at mariin sa makabagong Tagalog ang “lipulin,” at pinananatili ang pag-uulit para sa diin.
- source_word: בְחֵמָה
  choice: sa iyong poot
  rationale: Ang חֵמָה ay matinding nag-aalab na galit. Ipinahihiwatig ng konteksto na poot ito ng Diyos; ang “sa iyong poot” ay natural na pagpapahayag ng modal o instrumental na בְּ sa Tagalog.
- source_word: וְאֵינֵמוֹ
  choice: hanggang sa mawala sila
  rationale: Literal itong “at sila ay wala na.” Sa kasunod ng inuulit na utos, malinaw at natural na ipinapahayag ng “hanggang sa mawala sila” ang ganap na kinalabasan nang hindi pinahihina ang panawagan.
- source_word: וְיֵדְעוּ
  choice: upang malaman nila
  rationale: Ang waw na sinusundan ng imperfect sa konteksto ng panalangin ay maaaring magpahayag ng layunin o kinalabasan. Pinananatili ng “upang malaman nila” ang ugnayang ito nang hindi ito ginagawang tiyak na simpleng panghinaharap.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel at tuwirang isinasalin bilang “ang Diyos.”
- source_word: מֹשֵׁל
  choice: ang namamahala
  rationale: Ang participle ay nagpapahiwatig ng patuloy na paghahari o pamamahala. Natural at malinaw ang “ang namamahala” sa kasalukuyang Tagalog.
- source_word: בְּיַעֲקֹב
  choice: sa Jacob
  rationale: Pinananatili ang literal na preposisyong “sa” at ang pangalang Jacob bilang katawagan sa bayang tipan, sa halip na tahimik na ipakahulugang “Israel” o “sa ibabaw ng Jacob.”
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: hanggang sa mga dulo ng daigdig
  rationale: Karaniwang idyoma ito para sa pinakamalalayong bahagi ng buong mundo. Ang “mga dulo ng daigdig” ay malinaw, marangal, at likas sa Tagalog.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong ito, kaya pinanatili itong transliterasyon sa halip na hulaan ang salin.
theological_decisions:
- issue: Panawagan na lubusang lipulin ang mga kaaway
  choice: Pinanatili ang tuwirang kahilingan na ganap silang lipulin.
  alternative: Palambutin ito bilang pagpigil lamang sa kanila o alisin sa paraphrase ang ganap na pagkawasak.
  rationale: Inuulit ng Hebreo ang mariing utos at sinasabing sila ay mawawala na. Hindi dapat pahinain ng salin ang tindi ng panalangin.
- issue: Saklaw ng pamamahala ng Diyos kaugnay ng Jacob at ng buong daigdig
  choice: Pinanatili kapwa ang pamamahala ng Diyos “sa Jacob” at ang pagkakilala rito hanggang sa mga dulo ng daigdig.
  alternative: Isalin bilang pamamahala lamang sa Israel, o burahin ang partikular na pagtukoy sa Jacob upang gawing pangkalahatan lamang ang pahayag.
  rationale: Magkasamang ipinapahayag ng talata ang natatanging kaugnayan ng pamamahala ng Diyos sa Jacob at ang pandaigdig na abot ng pagkakilala rito. Pinananatili ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinili ang “lipulin” upang mapanatili ang matinding patulang panawagan; pinanatili ang “Jacob” at “Selah” dahil mahalaga ang anyo at likas na kalabuan ng pinagmulang teksto.
