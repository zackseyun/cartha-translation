base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: tl
  text: Huwag mo silang patayin, baka makalimot ang bayan ko; pagpalabuyin mo sila[a] sa pamamagitan ng iyong kapangyarihan[b] at ibaba mo sila, O Panginoon, aming kalasag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yanigin mo sila” o “pasuray-surayin mo sila”; maaaring tumukoy ang pandiwang Hebreo sa pagpapagalaw nang walang kapanatagan o sa pagpapabuway-buway.
    reason: lexical_alternative
  - marker: b
    text: O “iyong lakas”; ang salitang Hebreo ay maaaring mangahulugang lakas, kapangyarihan, o hukbong pandigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  choice: Huwag mo silang patayin
  rationale: Ang אַל na sinusundan ng anyong pautos/pakiusap ay nagpapahayag ng pagbabawal, at ang הרג ay karaniwang pandiwa para sa pagpatay. Malinaw at natural ang salin.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: baka makalimot ang bayan ko
  rationale: Ipinahahayag ng פֶּן ang kinatatakutang bunga. Natural sa modernong Tagalog ang “baka” at pinananatili nito ang diwang pag-iingat, hindi katiyakan.
- source_word: הֲנִיעֵמוֹ
  choice: Pagpalabuyin mo sila
  rationale: Ang causative na anyo ng נוע/ניע ay maaaring tumukoy sa pagpapagalaw nang walang kapanatagan, pagpapagala, pagyanig, o pagpapasuray. Ang “pagpalabuyin” ay angkop sa konteksto ng nagpapatuloy na paghatol sa halip na agarang kamatayan, habang inilalagay sa talababa ang ibang posibleng diwa.
- source_word: בְחֵילְךָ
  choice: sa pamamagitan ng iyong kapangyarihan
  rationale: Maaaring mangahulugan ang חַיִל ng lakas, kapangyarihan, o hukbo. Dito, ang kapangyarihan ng Diyos ang pinakaangkop na instrumental na diwa ng pang-ukol na בְּ.
- source_word: וְהוֹרִידֵמוֹ
  choice: at ibagsak mo sila
  rationale: Ang causative ng ירד ay literal na pagpapababa. Pinananatili ng “ibagsak” ang larawan ng pagpapababa o pagpapahamak nang hindi tinutukoy ang eksaktong paraan.
- source_word: מָגִנֵּנוּ
  choice: aming kalasag
  rationale: Ang literal na “kalasag” ay mahalagang talinghaga para sa Diyos sa Mga Awit at hindi dapat gawing abstraktong “tagapagtanggol” lamang.
- source_word: אֲדֹנָי
  choice: O Panginoon
  rationale: Ito ang titulong אֲדֹנָי sa tuwirang pagtawag sa Diyos, hindi ang Tetragrammaton. Ipinakikita ng “O” ang bokatibong gamit sa marangal na Tagalog.
theological_decisions:
- issue: Kalikasan ng hinihinging paghatol
  choice: Hinihiling na huwag munang patayin ang mga kaaway kundi ilagay sila sa nagpapatuloy at nakikitang kahihiyan at pagbagsak upang hindi makalimot ang bayan.
  alternative: Maaaring mas pangkalahatang tumukoy ang talata sa pagyanig at pagpapababa sa kanila, nang walang tiyak na ideya ng pagpapalaboy.
  rationale: Ang pagkakasunod-sunod na “huwag ... patayin,” “pagpalabuyin,” at “ibagsak” ay naghahambing sa agarang kamatayan at sa mas matagal na paghatol. Pinananatili ng salin at talababa ang tensiyong ito nang hindi pinipilit ang iisang kahulugan ng הֲנִיעֵמוֹ.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “bayan ko” para sa kolektibong עַמִּי, “aming kalasag” upang mapanatili ang salmista at teolohikal na talinghaga, at “O Panginoon” bilang natural na tuwirang pagtawag. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinatalakay ng kani-kanilang talababa.
