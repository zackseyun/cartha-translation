base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: tl
  text: 'Para sa tagapanguna ng awitan: “Huwag Mong Lipulin.”[a] Kay David.[b] Isang miktam.[c] Nang magsugo si Saul ng mga tao, minatyagan nila ang bahay upang patayin siya.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na pangalan ng isang himig o notasyong pangmusika ang “Huwag Mong Lipulin.”
    reason: cultural_note
  - marker: b
    text: Ang “Kay David” ay maaari ring mangahulugang “ni David” o “para kay David”; hindi tiyak sa Hebreo ang eksaktong uri ng kaugnayan.
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak ang kahulugan ng “miktam,” kaya pinanatili rito ang anyong Hebreo sa halip na isalin nang mapagpalagay.
    reason: lexical_alternative
  - marker: d
    text: 'Hindi tahasang nakasulat sa Hebreo ang “mga tao,” ngunit ipinahihiwatig sila ng kasunod na pandiwang nasa anyong maramihan. Mas pormal: “Nang magsugo si Saul, minatyagan nila ang bahay upang patayin siya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng awitan
  rationale: Tumutukoy ang karaniwang panimulang pormula sa pinuno ng pagtatanghal ng musika. Malinaw ito sa modernong Tagalog nang hindi ipinapalagay na isang koro lamang ang pinamumunuan.
- source_word: אַל־תַּשְׁחֵת
  choice: “Huwag Mong Lipulin”
  rationale: Malamang na pangalan ito ng himig o tagubiling pangmusika, kaya inilagay sa panipi at ginawang pamagat sa halip na ituring na bahagi ng panalangin.
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ng payak na “Kay David” ang lawak ng gamit ng Hebreong לְ, na maaaring magpahiwatig ng akda, kaugnayan, pag-aalay, o pag-uukol.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Hindi tiyak ang kahulugan ng terminong Hebreo, kaya tinumbasan ito sa baybay sa halip na bigyan ng mapagpalagay na salin.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: Nang magsugo si Saul ng mga tao
  rationale: 'Ang בְּ na kasama ng pawatas ay temporal: “nang magsugo.” Hindi tahasang binanggit ang “mga tao,” ngunit likas itong ipinahihiwatig ng kasunod na pandiwang maramihan.'
- source_word: וַיִּשְׁמְרוּ
  choice: at binantayan nila
  rationale: Sa konteksto ng layuning pumatay, ang שׁמר ay tumutukoy sa mapanganib na pagbabantay o pagmamanman, hindi sa pag-iingat para maprotektahan.
- source_word: אֶת־הַבַּיִת
  choice: ang bahay
  rationale: Pinanatili ang tiyak ngunit walang tahasang nagmamay-aring anyo ng Hebreo; hindi idinagdag ang “niya,” bagaman bahay ni David ang tinutukoy sa konteksto.
- source_word: לַהֲמִיתוֹ
  choice: upang patayin siya
  rationale: Tuwirang ipinapahayag nito ang layunin ng pagbabantay at ang panlalaking isahang hulapi.
theological_decisions:
- issue: Ugnayan ni David sa awit sa pariralang לְדָוִד
  choice: Kay David
  alternative: Akda ni David
  rationale: Hindi ginawang tiyak ang pagkamay-akda sapagkat maaaring magkaroon ng higit sa isang ugnayan ang panandang לְ sa mga pamagat ng Awit.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa pamagat ng isang awit. Pinanatili ang maiikling yunit ng superskripsiyon at ang mga tunay na kalabuan ng mga terminong pangmusika, ng לְדָוִד, at ng di-tahasang layon ng “magsugo.”
