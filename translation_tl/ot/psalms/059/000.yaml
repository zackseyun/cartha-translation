    issue: Medyo alangan ang “Nang ..., at ...” sa pangungusap na pangyayari.
    rationale: Sa Tagalog, ang temporal na sugnay na pinangungunahan ng “Nang” ay karaniwang sinusundan nang direkta ng pangunahing sugnay. Hindi binabago ng pagtanggal sa “at” ang ugnayang temporal at sunod-sunod na kilos sa Hebreo.
  - severity: low
    issue: Ang “binantayan” ay maaaring mabasa bilang pagguwardiya o pagprotekta.
    rationale: Ipinakikita ng layuning “upang patayin siya” na ang שׁמר ay pagmamatyag/surveillance. Ang “minatyagan” ay mas tiyak na naghahatid ng di-protektibong pagbabantay nang walang pagdaragdag ng kahulugan.
