translation:
  language: tl
  text: Bumabalik sila pagsapit ng gabi; umaangil silang parang mga aso[a] at umiikot sa lungsod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umuungol silang parang mga aso” o “gumagawa sila ng malakas na ingay na parang mga aso.” Ang pandiwang Hebreo ay maaaring tumukoy sa malakas na tunog na tulad ng sa hayop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpapalibot-libot sa lungsod” o “gumagala sa lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Bumabalik sila
  rationale: Tuwirang ipinahahayag ang Qal imperfect na שוב at ang paulit-ulit na pagkilos ng mga kaaway.
- source_word: לָעֶרֶב
  choice: tuwing gabi
  rationale: Ang לָעֶרֶב ay panandang-panahon. Sa konteksto ng paulit-ulit na paglalarawan, natural sa Filipino ang “tuwing gabi”; maaari rin itong unawain bilang “pagsapit ng gabi.”
- source_word: יֶהֱמוּ
  choice: umuuungol
  rationale: Ang המה ay tumutukoy sa malakas at tulad-hayop na ingay. Ang “umuuungol” ay angkop sa larawan ng mga asong nagbabanta nang hindi nililimitahan ang tunog sa tahol.
- source_word: כַכָּלֶב
  choice: parang mga aso
  rationale: Bagaman isahan ang כֶּלֶב sa Hebreo, maaari itong gamitin sa pangkalahatan; mas natural sa Filipino ang maramihan dahil maramihan ang simuno.
- source_word: וִיסוֹבְבוּ
  choice: at gumagala sa buong
  rationale: Ang סבב ay nangangahulugang umikot o maglibot. Ipinahahayag ng “gumagala sa buong” ang pag-ikot nila sa lungsod nang hindi idinaragdag ang mas tiyak na ideya ng pangangaso.
- source_word: עִיר
  choice: lungsod
  rationale: Tinutukoy ng konteksto ang partikular na lungsod; natural na naipapahiwatig ito sa Filipino kahit walang pantukoy na “ang” pagkatapos ng “sa buong.”
