  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: tl
  text: Sapagkat, masdan mo, nagtatambang sila laban sa aking buhay; nagsasama-sama laban sa akin ang mga makapangyarihan, kahit wala akong pagsuway o kasalanan, PANGINOON.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: inaabangan nila ang aking buhay
  rationale: Ipinahahayag ang larawan ng palihim na pagtambang at pinananatili ang נֶפֶשׁ bilang “buhay” sa kontekstong may banta sa buhay ng salmista.
- source_word: יָג֣וּרוּ עָלַי
  choice: nagtitipon laban sa akin
  rationale: Ang pandiwa ay tumutukoy rito sa sama-samang paglapit o pagtitipon laban sa isang tao.
- source_word: עַזִּים
  choice: malalakas na tao
  rationale: Pinananatili ang pangunahing diwa ng lakas o kapangyarihan nang hindi dinaragdagan ang teksto ng tiyak na katangiang gaya ng “marahas” o “mabangis.”
- source_word: פִשְׁעִי ... חַטָּאתִי
  choice: pagsuway o kasalanan ko
  rationale: Tinutukoy nang magkahiwalay ang mapaghimagsik na paglabag (פֶּשַׁע) at kasalanan (חַטָּאת), gaya ng Hebreong paralelismo.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakagawiang anyong malalaking titik sa Tagalog para sa banal na pangalang YHWH.
theological_decisions:
- issue: Batayan ng paglusob at pahayag ng kawalang-sala
  choice: “hindi dahil sa pagsuway o kasalanan ko”
  alternative: “bagaman wala akong pagsuway o kasalanan”
  rationale: Maaaring maunawaan ang לֹא bilang pagtanggi na ang sariling kasalanan ng salmista ang sanhi ng paglusob. Iniiwasan nitong gawing lubos at pangkalahatang pahayag ng pagiging walang kasalanan ang taludtod.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa panulaan. Ang “Sapagkat tingnan mo” ay sadyang nagpapanatili sa pangangatwiran ng כִּי at sa panawagang pansinin ang kalagayan sa הִנֵּה.
