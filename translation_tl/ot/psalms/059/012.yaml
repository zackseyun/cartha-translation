  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: tl
  text: Ang kasalanan ng kanilang bibig—ang salita ng kanilang mga labi[a]—mahuli nawa sila sa sarili nilang kapalaluan dahil sa sumpa at kasinungalingang sinasabi nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Dahil sa kasalanan ng kanilang bibig—ang salita ng kanilang mga labi—mahuli nawa sila sa kanilang kapalaluan, dahil sa sumpa at kabulaanang sinasabi nila.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawaing ang kanilang kapalaluan, pati ang sumpa at kasinungalingang sinasabi nila, ay magkakatabing dahilan kung bakit sila dapat mahuli.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: חַטַּאת
  choice: kasalanan
  rationale: Tumutukoy rito sa moral na kasalanang nahahayag sa pananalita, hindi sa handog para sa kasalanan.
- source_word: פִּימוֹ
  choice: kanilang bibig
  rationale: Ang pang-isahang anyo na may maramihang panlapi ay kolektibo; pinananatili ang larawang patula ng bibig at mga labi.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: ang salita ng kanilang mga labi
  rationale: Malapit ito sa konstruksiyong Hebreo at pinananatili ang paralelismong bibig–mga labi.
- source_word: וְיִלָּכְדוּ
  choice: mahuli nawa sila
  rationale: Ang Niphal imperfect ay may diwang jussive sa konteksto ng panalangin; malinaw na ipinapahayag ng “nawa” ang kahilingan.
- source_word: בִגְאוֹנָם
  choice: sa sarili nilang kapalaluan
  rationale: Ang גאון ay kapalaluan o mapagmataas na pagtataas sa sarili. Nililinaw ng “sarili nilang” na ang kapalaluan nila ang kalagayan o paraan ng pagkahuli sa kanila, nang hindi pinipili nang lubos sa pagitan ng locative at instrumental na diwa.
- source_word: מֵאָלָה
  choice: dahil sa mga sumpa
  rationale: Ang מִן ay nauunawaan bilang sanhi. Ang pang-isahang אָלָה ay maaaring kolektibong tumukoy sa mapanumpang pananalita; natural sa Filipino ang maramihang “mga sumpa.”
- source_word: וּמִכַּחַשׁ
  choice: at kasinungalingan
  rationale: Ang כַּחַשׁ ay kasinungalingan, kabulaanan, o pandaraya; “kasinungalingan” ang tuwiran at karaniwang salita rito.
- source_word: יְסַפֵּרוּ
  choice: sinasabi nila
  rationale: Bagaman maaaring mangahulugang “isinasalaysay,” sa konteksto ay malawak na tumutukoy ito sa kanilang binibigkas; natural ang “sinasabi nila.”
theological_decisions:
- issue: Ugnayang sintaktiko ng kasalanan, mga salita, pagkahuli, kapalaluan, at mapanlinlang na pananalita
  choice: Itinuring ang unang sugnay bilang pahayag at ang kasunod bilang kahilingang mahuli sila sa kanilang kapalaluan dahil sa kanilang mga sumpa at kasinungalingan.
  alternative: Maaaring ikabit ang “kasalanan ng kanilang bibig, ang salita ng kanilang mga labi” bilang dahilan ng “mahuli nawa sila,” at maaaring basahin ang huling parirala bilang karagdagang dahilan.
  rationale: Hindi tiyak ang paghahati at ugnayan ng mga parirala sa Hebreo. Pinananatili ng pangunahing teksto ang matinding paralelismo, samantalang itinatala sa talababa ang kapani-paniwalang alternatibong sintaks.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang matalinghagang pares na “bibig” at “mga labi,” ang imprecatoryong “nawa,” at ang tunay na kalabuan ng sintaks sa pamamagitan ng mga talababa.
