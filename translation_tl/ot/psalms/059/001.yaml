  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: tl
  text: Iligtas mo ako sa aking mga kaaway, Diyos ko; ilagay mo ako sa mataas na lugar, malayo sa mga lumalaban sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipagsanggalang mo ako laban sa mga lumalaban sa akin.” Inilalarawan ng pandiwang Hebreo ang paglalagay sa isang mataas at hindi madaling maabot na lugar, kaya ligtas sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Iligtas mo ako
  rationale: Ang Hiphil na pautos ng נצל na may hulaping unang panauhan ay pakiusap na hanguin o ilayo ang nagsasalita sa panganib. Natural sa makabagong Tagalog ang “iligtas” at angkop sa agarang pagliligtas na hinihingi rito.
- source_word: מֵאֹיְבַי
  choice: sa aking mga kaaway
  rationale: Karaniwang salita ang אֹיֵב para sa “kaaway,” at ipinahahayag ng מִן ang pagliligtas mula sa kanila; sa Tagalog, natural itong mababasa bilang “iligtas ... sa aking mga kaaway.”
- source_word: אֱלֹהָי
  choice: Diyos ko
  rationale: Tuwirang pagtawag ito sa Diyos na may hulaping nangangahulugang “ko.” Pinananatili ng “Diyos ko” ang personal at agarang panawagan.
- source_word: מִּמִתְקוֹמְמַי
  choice: mga lumalaban sa akin
  rationale: Ang participial na anyo mula sa קום ay tumutukoy sa mga bumabangon o nagtatayo ng sarili laban sa nagsasalita. Ang “mga lumalaban sa akin” ay malinaw at likas sa kasalukuyang Tagalog nang hindi nililimitahan ang uri ng pagsalungat.
- source_word: תְּשַׂגְּבֵנִי
  choice: ilagay mo ako sa mataas na lugar, hindi maaabot
  rationale: Ang Piel ng שגב ay maaaring mangahulugang ilagay sa mataas at di-malapitang lugar, at sa gayon ay ipagsanggalang. Pinananatili ng salin ang kongkretong larawan ng kataasan habang nililinaw ang ipinahihiwatig nitong kaligtasan.
theological_decisions:
- issue: Personal na pagtawag na אֱלֹהָי
  choice: Diyos ko
  alternative: aking Diyos
  rationale: Kapuwa maaari sa Tagalog, ngunit mas natural bilang tuwirang panawagan ang “Diyos ko,” at hindi ito nagdaragdag ng anumang doktrinal na kahulugan.
- issue: Larawan ng proteksiyon sa תְּשַׂגְּבֵנִי
  choice: ilagay mo ako sa mataas na lugar, hindi maaabot
  alternative: ipagsanggalang mo ako
  rationale: Pinananatili ng piniling salin ang matalinghagang paglalagay sa isang mataas at di-maaabot na lugar sa halip na palitan iyon ng abstraktong paliwanag lamang.
translation_notes:
  register: Makabago, marangal, at panalanging Tagalog. Ginamit ang payak na “mga lumalaban sa akin” at pinanatili ang kongkretong larawan ng mataas at di-maaabot na kanlungan. Ang [a] ay inilagay mismo sa pangunahing teksto.
