  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: tl
  text: Sila'y pagala-gala upang maghanap ng makakain; kung hindi sila mabusog, magpapalipas sila ng gabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “uungol sila.” Maaaring unawain ang pandiwang Hebreo bilang “magpalipas ng gabi” o bilang “umungol/magreklamo.” Ang ikalawang kahulugan ay umaayon sa larawan ng mga asong gutom sa nakapaligid na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Sila
  rationale: Ang hiwalay na panghalip na panlalaking maramihan ay nagbibigay-diin o paghahambing; natural na naipahihiwatig ito ng “Sila” sa Filipino.
- source_word: ינועון
  choice: pagala-gala
  rationale: Mula sa נוּעַ, tumutukoy ito sa pabalik-balik o di-mapakaling pagkilos; ang “pagala-gala” ay angkop sa larawan ng mga gutom na kaaway na naghahanap ng pagkain.
- source_word: לֶאֱכֹל
  choice: upang maghanap ng makakain
  rationale: Ang infinitive na may לְ ay nagpapahayag ng layunin, literal na “upang kumain.” Sa konteksto ng pagala-gala, natural na ipinahahayag sa Filipino ang paghahanap ng makakain.
- source_word: אִם לֹא
  choice: kung hindi
  rationale: Pinananatili nito ang tuwirang kondisyunal na diwa ng parirala nang hindi ginagawang katiyakan o konsesyon.
- source_word: יִשְׂבְּעוּ
  choice: mabusog
  rationale: Ang שָׂבַע ay tumutukoy sa pagkabusog o pagkakaroon ng sapat na pagkain; “mabusog” ang natural at tiyak na salitang Filipino.
- source_word: וַיָּלִינוּ
  choice: magpapalipas sila ng gabi
  rationale: Ang anyo ay maaaring iugnay sa לוּן/לִין, “magpalipas ng gabi/manuluyan.” Pinananatili ito sa pangunahing teksto bilang tuwirang leksikal na pagbasa, habang itinatala sa talababa ang makabuluhang alternatibong “umungol” ayon sa konteksto ng mga asong mababangis.
