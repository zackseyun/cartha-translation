  source_fidelity: 'Tapat ang salin sa Hebreo: ang ינועון ay naipahayag bilang di-mapakaling paggala, ang לֶאֱכֹל bilang layuning maghanap ng makakain, at ang אִם־לֹא יִשְׂבְּעוּ bilang kondisyong hindi pagkabusog. Ang “magpapalipas sila ng gabi” ay isang leksikal na posibleng pagbasa ng וילינו, at maayos na itinatala ng talababa ang kontekstuwal na alternatibong pagbasa na “uungol sila.” Hindi nito ipinipilit ang alinman sa pinagtatalunang pagbasa.'
