base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: tl
  text: Wala akong kasalanan, ngunit tumatakbo sila at pumupuwesto[a]; gumising ka upang salubungin ako, at tingnan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at naghahanda.” Ang pandiwa ay maaaring tumukoy sa pagpuwesto o sa paghahanda para kumilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: nang walang kasalanan
  rationale: Ipinahahayag ng parirala ang kawalan ng kasalanan o pananagutan. Hindi nilagyan ng tahasang panghalip upang mapanatili ang bahagyang kalabuan ng Hebreo, bagaman ipinahihiwatig ng konteksto ang pag-aangkin ng salmista na wala siyang kasalanan.
- source_word: יְרוּצוּן
  choice: tumatakbo sila
  rationale: Pinananatili nito ang matingkad at pangunahing larawan ng pandiwang רוץ, na maaari ring mangahulugang nagmamadali.
- source_word: וְיִכּוֹנָנוּ
  choice: at pumupuwesto
  rationale: Ipinahihiwatig ng anyo ng כון ang paglalagay o pagtatatag ng sarili sa isang posisyon. Ang “pumupuwesto” ay natural sa modernong Tagalog at hindi labis na nagpapasya kung ito ay paghahanda sa pagsalakay.
- source_word: עוּרָה
  choice: gumising ka
  rationale: Tuwirang pinananatili ang matapang na larawang pantao sa panalangin sa Diyos, sa halip na gawing paliwanag lamang na kumilos siya.
- source_word: לִקְרָאתִי
  choice: upang salubungin ako
  rationale: Malapit ito sa literal na idyomang “upang makipagtagpo sa akin.” Sa konteksto, pakiusap itong lumapit ang Diyos upang tumulong, ngunit hindi iyon tahasang idinagdag sa teksto.
- source_word: וּרְאֵה
  choice: at tingnan mo
  rationale: Pinananatili ang maikli at tuwirang pautos ng ראה at ang tuloy-tuloy na pakiusap ng salmista.
theological_decisions:
- issue: Pautos na may larawang pantao na nakatuon sa Diyos
  choice: Panatilihin ang “gumising ka.”
  alternative: “Bumangon ka” o “kumilos ka.”
  rationale: Ang panaghoy ay gumagamit ng larawang tila natutulog ang Diyos upang manawagan ng kanyang agarang pagkilos. Ang pagpapanatili nito ay hindi nagsasabing literal na natutulog ang Diyos, kundi iniingatan ang lakas at tensiyong patula ng panalangin.
- issue: Kung kaninong kasalanan ang tinutukoy sa בְּלִי עָוֺן
  choice: Huwag magdagdag ng tahasang “ko” sa pangunahing teksto.
  alternative: “Nang wala akong kasalanan.”
  rationale: Ipinahihiwatig ng mas malawak na konteksto na ang salmista ang walang kasalanan, ngunit walang nakadugtong na panghalip sa pariralang Hebreo sa talatang ito. Pinananatili ng salin ang pormal na kalabuan.
translation_notes:
  register: Makabago at dignidad na Tagalog, na may maikli at masiglang mga pandiwa. Pinanatili ang anyong panalangin at ang matapang na metaporang “gumising ka.”
