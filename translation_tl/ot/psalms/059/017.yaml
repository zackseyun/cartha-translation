  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: tl
  text: Lakas ko[a], sa iyo ako aawit ng papuri, sapagkat ang Diyos ang aking matibay na tanggulan, ang Diyos ng aking tapat na pag-ibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “lakas ko” ay tuwirang pagtawag ng mang-aawit sa Diyos.
    reason: vocative_clarification
  - marker: b
    text: 'Maaari ring isalin: “ang Diyos kong tapat magmahal” o “ang Diyos na nagpapakita sa akin ng tapat na pag-ibig.” Literal sa Hebreo: “ang Diyos ng aking tapat na pag-ibig.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  choice: O lakas ko
  rationale: Ang עֹז na may hulaping unang panauhan ay “lakas ko.” Sa patulang konteksto, tuwirang kinakausap ang Diyos; pinananatili ng “O” ang bokatibong diin sa marangal at likas na Tagalog.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ang אֶל ay nagsasaad ng direksiyon, “sa” o “patungo sa.” Sa konteksto ng pag-awit, natural ang “sa iyo ako aawit.”
- source_word: אֲזַמֵּרָה
  choice: ako aawit ng papuri
  rationale: Ang Piel ng זמר sa Mga Awit ay karaniwang tumutukoy sa pag-awit ng papuri, na maaaring may kasamang musika. Malinaw at natural sa modernong Tagalog ang “aawit ng papuri.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan ng pag-awit. Ang “sapagkat” ay malinaw, marangal, at angkop sa tulang biblikal.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan, iisang Diyos ng Israel ang tinutukoy rito, kaya isinalin sa isahang diwa.
- source_word: מִשְׂגַּבִּי
  choice: aking matibay na tanggulan
  rationale: Ang מִשְׂגָּב ay isang mataas at ligtas na lugar ng proteksiyon. Naipahahayag ng “matibay na tanggulan” ang seguridad at depensibong larawan nito.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: ang Diyos ng aking tapat na pag-ibig
  rationale: Literal itong “Diyos ng aking hesed.” Pinananatili ng “tapat na pag-ibig” ang diwa ng matatag at tipanang katapatan, habang ang konstruksiyong “Diyos ng aking…” ay nagpapanatili sa siksik at hindi lubos na tiyak na ugnayan ng pariralang Hebreo.
theological_decisions:
- issue: Kahulugan at kaugnayan ng חַסְדִּי sa Diyos
  choice: 'Pinanatili ang genitibong anyo: “ang Diyos ng aking tapat na pag-ibig”'
  alternative: “ang Diyos kong tapat magmahal” o “ang Diyos na nagpapakita sa akin ng tapat na pag-ibig”
  rationale: Maaaring ilarawan ng siksik na pariralang Hebreo ang Diyos bilang bukal o sagisag ng tapat na pag-ibig, o ang tapat na pag-ibig ng Diyos sa mang-aawit. Hindi nilulutas ng pangunahing salin ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang patulang tuwirang pagtawag na “O lakas ko,” ang malinaw na larawang “matibay na tanggulan,” at ang sinadyang siksik na anyo ng huling parirala. Ang bawat talababa ay may katumbas na marker sa pangunahing teksto.
