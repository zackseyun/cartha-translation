  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: tl
  text: 'Ngunit ikaw, Yahweh, Diyos ng mga hukbo, Diyos ng Israel,


    gumising ka upang papanagutin[a] ang lahat ng bansa.


    Huwag mong pagpakitaan ng lingap ang sinumang taksil na gumagawa ng kasamaan.[b]


    Selah[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang parusahan” o “upang dalawin.” Malawak ang diwa ng pandiwang Hebreo na פקד; sa kontekstong ito, maaari itong tumukoy sa pagdalaw upang papanagutin o parusahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Huwag mong kahabagan ang sinumang taksil na gumagawa ng kasamaan.” Ang pandiwang Hebreo na חנן ay literal na tumutukoy sa pagpapakita ng pabor, biyaya, o kagandahang-loob.
    reason: lexical_alternative
  - marker: c
    text: Ang “Selah” ay malamang na isang panandang pangmusika o panliturhiya, ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Diyos ng mga hukbo
  rationale: Pinananatili ang larawan ng צְבָאוֹת bilang mga hukbo o hanay, nang hindi nililimitahan kung makalupa o makalangit ang tinutukoy.
- source_word: הָקִיצָה
  choice: gumising ka
  rationale: Pinananatili ang matapang na metaporang patula ng panawagan sa Diyos na kumilos.
- source_word: לִפְקֹד
  choice: upang papanagutin
  rationale: Sa konteksto ng paghatol, ipinahahayag nito ang pagharap at paghatol ng Diyos, habang hindi lubusang ikinukulong ang malawak na diwa ng פקד sa aktuwal na pagpaparusa lamang.
- source_word: כָּל הַגּוֹיִם
  choice: ang lahat ng bansa
  rationale: Ang “mga bansa” ang likas at malawak na katumbas ng גּוֹיִם dito; hindi nito ipinapasok ang mas makitid na pagkakaibang Judio-Hentil.
- source_word: אַל תָּחֹן
  choice: Huwag mong pagpakitaan ng lingap
  rationale: Malapit ito sa pangunahing diwa ng חנן na magpakita ng pabor o biyaya, at angkop sa marangal na pananalita ng panalangin.
- source_word: בֹּגְדֵי אָוֶן
  choice: sinumang taksil na gumagawa ng kasamaan
  rationale: Pinananatili kapuwa ang kataksilan ng בגד at ang moral na kasamaan ng אָוֶן sa natural na Filipino.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinananatili sa transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan at gamit nito.
theological_decisions:
- issue: Saklaw ng כָּל הַגּוֹיִם sa panalanging humihingi ng paghatol
  choice: lahat ng bansa
  alternative: lahat ng Hentil
  rationale: Ang Hebreo ay maaaring tumukoy sa mga bansang hindi Israel, ngunit sa talatang ito ang “lahat ng bansa” ang nagpapanatili sa kolektibo at pampolitikang diwa nang hindi nagpapasok ng mas huling teolohikal na pagkakahati.
- issue: Lakas ng paghatol sa לִפְקֹד
  choice: papanagutin
  alternative: parusahan
  rationale: Malinaw pa rin ang hudisyal na pakiusap, ngunit napananatili ang saklaw ng pandiwang maaaring mangahulugang dalawin, harapin, siyasatin, o parusahan ayon sa konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang tuwirang panawagang “gumising ka” at ang titulong “Diyos ng mga hukbo” upang huwag pahinain ang matapang at militar na larawan ng salmo. Ginamit ang “papanagutin” at nilagyan ng talababa upang mapanatili ang tunay na lawak ng פקד.
