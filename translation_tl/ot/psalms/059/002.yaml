  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: tl
  text: 'Iligtas mo ako mula sa mga gumagawa ng kasamaan,[a]

    at sagipin mo ako mula sa mga lalaking mamamatay-tao.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa masasamang tao.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga lalaki ng dugo,” isang idyoma para sa mga uhaw sa dugo o mga may-sala sa pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Iligtas mo ako
  rationale: Ang pautos na anyo ng נצל ay isang pagsusumamo na mailayo sa panganib; likas at malinaw sa modernong Tagalog ang “iligtas mo ako.”
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: mula sa mga gumagawa ng kasamaan
  rationale: Pinananatili nito ang Hebreong kayariang “mga gumagawa ng” at ang moral na diwa ng אָוֶן sa konteksto, sa halip na paikliin agad bilang “masasamang tao.”
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: mula sa mga lalaking mapagpadanak ng dugo
  rationale: Ang אַנְשֵׁי ay panlalaking pangmaramihan, at ang דָמִים (“mga dugo”) ay idyomang tumutukoy sa pagdanak ng dugo o pagkakasala sa pagpatay. Ang salin ay malinaw sa Tagalog habang nananatiling malapit sa larawan ng dugo.
- source_word: הוֹשִׁיעֵנִי
  choice: sagipin mo ako
  rationale: Ang ישׁע ay tumutukoy sa pagliligtas mula sa panganib. Ginamit ang “sagipin” upang mapanatili ang bahagyang pagkakaiba sa naunang pandiwang נצל nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Panlalaking anyo ng אַנְשֵׁי
  choice: mga lalaking mapagpadanak ng dugo
  alternative: mga taong mapagpadanak ng dugo
  rationale: Pinananatili ang gramatikal na panlalaking pagtukoy ng Hebreo at ang kontekstong tumutukoy sa mararahas na lalaking kalaban, nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Idyomang דָמִים
  choice: mapagpadanak ng dugo
  alternative: mga taong may dugo
  rationale: Ang literal na “mga taong may dugo” ay malabo at hindi likas sa Tagalog. Ipinahahayag ng “mapagpadanak ng dugo” ang idyomatikong diwa ng marahas o mamamatay-taong mga kalaban habang pinananatili ang larawan ng dugo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkatulad ngunit hindi eksaktong magkaparehong mga pandiwa sa pamamagitan ng “iligtas” at “sagipin,” at iniwasan ang sobrang literal na pariralang magiging malabo sa karaniwang mambabasa.
