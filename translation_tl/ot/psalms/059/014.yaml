  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: tl
  text: Bumabalik sila pagsapit ng gabi; umuungol[a] silang parang mga aso at gumagala sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “umaalulong.” Ang pandiwang Hebreo ay maaaring tumukoy sa malakas na ingay na gaya ng tunog ng hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: Bumabalik sila
  rationale: Ang pandiwang שוב ay nangangahulugang “bumalik.” Ginamit ang pangkasalukuyang anyo upang maipakita ang paulit-ulit nilang ginagawa sa larawan ng talata.
- source_word: לָעֶרֶב
  choice: pagsapit ng gabi
  rationale: Ang עֶרֶב ay “gabi” o “takipsilim.” Natural sa modernong Tagalog ang “pagsapit ng gabi” at malinaw nitong ipinahahayag ang takdang panahon.
- source_word: יֶהֱמוּ
  choice: umuungol
  rationale: Ang המה ay maaaring tumukoy sa malakas at waring makahayop na ingay. Ang “umuungol” ay angkop sa kasunod na paghahambing sa mga aso ngunit pinananatili sa talababa ang posibilidad na “umaalulong.”
- source_word: כַכָּלֶב
  choice: parang mga aso
  rationale: Bagaman pang-isahan ang “aso” sa Hebreo, maaari itong gamitin bilang pangkalahatang paghahambing. Ang pangmaramihang “mga aso” ay natural sa Tagalog dahil maramihan ang simuno at ipinahihiwatig ang isang pangkat.
- source_word: וִיסוֹבְבוּ עִיר
  choice: at pagala-gala sa lungsod
  rationale: Ang סבב ay nangangahulugang umikot o maglibot. Ipinahahayag ng “pagala-gala sa lungsod” ang patuloy nilang paglibot nang hindi tahasang nagdaragdag ng layunin o motibo.
