  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: tl
  text: Sapagkat mabuti si Yahweh; ang kanyang tapat na pag-ibig[a] ay magpakailanman, at ang kanyang katapatan ay nananatili sa sali’t salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salita ay hesed, na may diwa ng matatag na pag-ibig, awa, at tapat na pagmamalasakit, lalo na sa konteksto ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang panawagan sa awit at pinananatili ang paliwanag na ugnayan ng talata.
- source_word: טוֹב
  choice: mabuti
  rationale: Tuwirang ipinahahayag ang kabutihang moral at mapagkalingang kabutihan ni Yahweh nang hindi pinakikitid ang kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na pahayag sa Tagalog para sa walang hanggang tagal.
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Pinagsasama nito ang pag-ibig at matatag na katapatan na saklaw ng חֶסֶד, nang hindi ito nililimitahan sa awa lamang o sa isang teknikal na kategoryang teolohikal.
- source_word: וְעַד דֹּר וָדֹר
  choice: at ... sa sali’t salinlahi
  rationale: Ang karaniwang idyomang Tagalog na “sa sali’t salinlahi” ay malinaw na naghahatid ng pagpapatuloy sa magkakasunod na henerasyon at tumutugma sa Hebreong pag-uulit.
- source_word: אֱמוּנָתוֹ
  choice: ang kanyang katapatan
  rationale: Ipinahahayag nito ang pagiging maaasahan, matatag, at tapat ng Diyos, kaagapay ng kanyang חֶסֶד.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito sa halip na palitan ng titulo.
- issue: Lawak ng kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; kagandahang-loob; katapatan sa tipan
  rationale: Pinananatili ng parirala ang sabayang diwa ng pag-ibig, awa, at matatag na katapatan nang hindi ipinipilit ang isang mas makitid na pagbasa.
- issue: Walang tahasang pandiwa sa huling sugnay
  choice: ang kanyang katapatan ay sa sali’t salinlahi
  alternative: ang kanyang katapatan ay nananatili sa sali’t salinlahi
  rationale: Pinananatili ang payak at patulang nominal na anyo ng Hebreo. Likas sa Tagalog ang ganitong sugnay, kaya hindi kailangang idagdag ang pandiwang “nananatili,” bagaman iyon ang ipinahihiwatig.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinili ang “sa sali’t salinlahi” bilang pamilyar at natural na katumbas ng Hebreong idyoma, at iniwasan ang di-kinakailangang pagdaragdag ng pandiwa sa huling sugnay.
