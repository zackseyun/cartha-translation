  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: tl
  text: Kilalanin ninyo na si Yahweh ang Diyos. Siya ang gumawa sa atin, at hindi tayo ang gumawa sa ating mga sarili.[a] Tayo ang kanyang bayan at ang mga tupa sa kanyang pastulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa tradisyonal na pagbasa sa gilid: “Siya ang gumawa sa atin, at tayo ay kanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Kilalanin ninyo
  rationale: Ang maramihang pautos ng ידע ay nananawagan hindi lamang sa pagkaalam kundi sa pagkilala at pagtanggap sa isang tiyak na katotohanan. Likas at malinaw ito sa modernong Tagalog.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng dapat kilalanin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הוּא אֱלֹהִים
  choice: si Yahweh ang Diyos
  rationale: Ang ayos na may 'ang Diyos' ay natural sa Tagalog at naipahahayag ang diin ng panghalip הוּא nang hindi idinaragdag ang salitang 'tanging,' na hindi tahasang nasa Hebreo.
- source_word: הוּא עָשָׂנוּ
  choice: Siya ang gumawa sa atin
  rationale: Pinananatili ng 'Siya ang' ang diin sa Diyos bilang gumawa; ang payak na aspektong naganap ay angkop sa pahayag ng salmo.
- source_word: וְלֹא אֲנַחְנוּ
  choice: at hindi tayo ang gumawa sa ating sarili
  rationale: Sinusunod ng pangunahing teksto ang nakasulat na anyong לא, 'hindi.' Nililinaw sa natural na Tagalog ang eliptikong Hebreo sa pamamagitan ng pag-uulit sa diwang 'gumawa,' nang hindi binabago ang kahulugan.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Tuwirang salin ng katawagang tipan para sa bayang nauukol sa Diyos.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: at ang mga tupa sa kanyang pastulan
  rationale: Pinananatili ang pastoral na larawan ng צאן at מַרְעִית; natural sa Tagalog ang 'mga tupa sa kanyang pastulan.'
theological_decisions:
- issue: Pagkakaiba ng ketiv at qere sa וְלֹא/וְלוֹ אֲנַחְנוּ
  choice: 'Sa pangunahing teksto: “at hindi tayo ang gumawa sa ating sarili,” ayon sa ketiv לא.'
  alternative: 'Ayon sa tradisyonal na qere לוֹ: “Siya ang gumawa sa atin, at tayo ay kanya.”'
  rationale: Ang katinig na tekstong לא ay likas na nangangahulugang 'hindi,' samantalang ang tradisyonal na pagbasa na לוֹ ay nangangahulugang 'kanya.' Kapwa sinauna at makabuluhan ang mga pagbasa; pinananatili sa pangunahing teksto ang nakasulat na anyo at inilalagay sa talababa ang tradisyonal na pagbasa upang hindi maitago ang tunay na tekstuwal na pagkakaiba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kilalanin ninyo” upang maipakita ang panawagan sa may-kamalayang pagkilala; pinanatili ang pangalang “Yahweh” at ang payak na larawang pastoral.
