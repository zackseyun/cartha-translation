base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: tl
  text: Pumasok kayo sa kanyang mga pintuang-daan nang may pasasalamat[a], sa kanyang mga looban nang may papuri; magpasalamat kayo sa kanya; pagpalain ninyo ang kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may handog ng pasasalamat.” Maaaring tumukoy ang salitang Hebreo (תּוֹדָה) sa pasasalamat o sa isang handog ng pasasalamat, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Pumasok kayo
  rationale: Ang maramihang pautos ng בוא, kasama ng “mga pintuang-daan” at “mga looban,” ay likas na tumutukoy sa pagpasok sa lugar ng pagsamba.
- source_word: שְׁעָרָיו
  choice: kanyang mga pintuang-daan
  rationale: Pinananatili ang maramihang anyo at ang konkretong larawan ng mga pasukan sa banal na bakuran.
- source_word: בְּתוֹדָה
  choice: nang may pasasalamat
  rationale: Maaaring mangahulugan ang תוֹדָה ng pasasalamat o handog ng pasasalamat. Sa pagkakatambal nito sa “papuri,” natural dito ang abstraktong kahulugan, habang inilalahad sa talababa ang posibleng kahulugang kultiko.
- source_word: חֲצֵרֹתָיו
  choice: kanyang mga looban
  rationale: Ang “mga looban” ay malinaw at natural na tawag sa mga bakuran sa loob ng santuwaryo at pinananatili ang larawang pangtemplo.
- source_word: בִּתְהִלָּה
  choice: nang may papuri
  rationale: Tuwirang isinasalin ang תְהִלָּה at pinananatili ang paralelismo sa “nang may pasasalamat.”
- source_word: הוֹדוּ לוֹ
  choice: magpasalamat kayo sa kanya
  rationale: Sa kontekstong pagsamba, ang Hiphil ng ידה ay karaniwang nangangahulugang magpasalamat; pinananatili rin nito ang ugnayang leksikal sa תוֹדָה.
- source_word: בָּרֲכוּ
  choice: purihin ninyo
  rationale: Bagaman literal na “pagpalain,” sa Filipino ang “pagpalain ang pangalan ng Diyos” ay madaling maunawaang pagkakaloob ng biyaya sa Diyos. Ang “purihin” ay natural na naghahatid ng kahulugang magsalita nang mabuti at magpahayag ng pagpupuri, ngunit bahagyang nagsasanib sa naunang תְהִלָּה.
- source_word: שְׁמוֹ
  choice: ang kanyang pangalan
  rationale: Pinananatili ang literal na pahayag tungkol sa pangalan bilang kumakatawan sa nahayag na pagkakakilanlan at dangal ng Diyos.
theological_decisions:
- issue: Larawan ng pagpasok sa mga pintuang-daan at mga looban
  choice: Panatilihin ang konkretong larawang pangtemplo bilang “mga pintuang-daan” at “mga looban.”
  alternative: Gawing pangkalahatan bilang pagpasok sa “presensya” o “bahay” ng Diyos.
  rationale: Tahasang inilalarawan ng Hebreo ang pagpasok ng mga sumasamba sa banal na bakuran; hindi dapat palitan iyon ng abstraksiyong wala sa talata.
- issue: Pagpapala sa pangalan ng Diyos
  choice: Isalin ang בָּרֲכוּ bilang “purihin ninyo” para sa malinaw at likas na Filipino.
  alternative: “Pagpalain ninyo ang kanyang pangalan.”
  rationale: Ang literal na “pagpalain” ay maaaring magpahiwatig sa modernong Filipino na nagbibigay ang tao ng biyaya sa Diyos. Sa kontekstong ito, ang utos ay pagpupuri o mabuting pagsasalita tungkol sa kanyang pangalan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kayo/ninyo” upang ipakita ang maramihang pautos. Pinanatili ang maikli at balanseng paralelismo ng tulang Hebreo.
