  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: tl
  text: 'Awit para sa pasasalamat.[a]


    Humiyaw nang may galak kay Yahweh, buong daigdig!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Awit ng pasasalamat” o “Awit para sa handog na pasasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan sa isang awit sa Aklat ng mga Awit; natural at matatag sa makabagong Filipino.
- source_word: לְתוֹדָה
  choice: para sa pasasalamat
  rationale: Maaaring tumukoy ang תּוֹדָה sa pasasalamat, papuri, o handog na pasasalamat. Pinananatili ng saling ito ang layon ng pang-ukol na לְ nang hindi ipinapalagay na tiyak na seremonyang paghahandog ang tinutukoy.
- source_word: הָרִיעוּ
  choice: sumigaw kayo nang may galak
  rationale: Ang pautos na anyong Hiphil ay nananawagan ng malakas at masayang pagbubunyi; malinaw at likas ito sa Filipino.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay tumutukoy sa pinatutungkulan ng sigaw, at ang pangalang יְהוָה ay isinasalin bilang Yahweh.
- source_word: כָּל־הָאָרֶץ
  choice: Buong lupa
  rationale: Sa pangkalahatang panawagan ng awit, ang אָרֶץ ay pinakamalamang na tumutukoy sa buong lupa, hindi lamang sa isang lupain.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang taglay ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang anyo nito bilang personal na banal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng כָּל־הָאָרֶץ
  choice: Buong lupa
  alternative: Buong lupain
  rationale: Ipinahihiwatig ng pandaigdigang panawagan sa pagsamba ang malawak na kahulugang “buong lupa,” bagaman maaari ring mangahulugan ng “lupain” ang אָרֶץ sa ibang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inuna ang natural na ayos na “Buong lupa” bilang tuwirang panawagan, habang pinanatili ang lakas at masayang tono ng pautos.
