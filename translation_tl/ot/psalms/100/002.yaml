  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: tl
  text: 'Maglingkod kayo kay Yahweh nang may kagalakan;

    lumapit kayo sa kanyang harapan nang may sigaw ng kagalakan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang may masayang pag-awit.” Ang salitang Hebreo ay maaaring tumukoy sa masiglang papuri na ipinapahayag sa sigaw o sa awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Maglingkod kayo
  rationale: Ang maramihang pautos na anyo ng עבד ay tumutukoy sa paglilingkod kay Yahweh nang may debosyon at pagsunod. Pinananatili ng “maglingkod” ang lawak ng kahulugan nang hindi ito nililimitahan sa pormal na pagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּשִׂמְחָה
  choice: nang may kagalakan
  rationale: Ipinapahayag ng בְּ ang paraan o kalagayan ng paglilingkod. Ang “nang may kagalakan” ay natural at marangal na Filipino para sa masayang paglilingkod.
- source_word: בֹּאוּ
  choice: lumapit kayo
  rationale: Ang pautos na בוא ay nangangahulugang pumarito o lumapit. Ang “lumapit kayo” ay angkop sa kasunod na pariralang “sa harap niya” at hindi nagdaragdag ng tahasang pagtukoy sa pagpasok sa santuwaryo.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Pinananatili nito ang relasyonal at panlunan na diwa ng Hebreong idyoma, na literal na tumutukoy sa paglapit sa harap o presensiya niya.
- source_word: בִּרְנָנָה
  choice: nang may masayang sigaw
  rationale: Ang רננה ay maaaring tumukoy sa umaalingawngaw na sigaw ng galak o masayang pag-awit. Pinananatili ng “masayang sigaw” ang masigla at hayagang tinig ng pagpupuri, habang inilalahad sa talababa ang posibleng kahulugang pag-awit.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang ipinahayag sa Israel sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” upang ipakita ang maramihang pautos sa Hebreo. Inilagay ang talababa sa “masayang sigaw,” ang pariralang aktuwal na may leksikal na alternatibo.
