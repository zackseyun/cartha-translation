  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/000.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: tl
  text: 'Awit para sa pasasalamat.[a]


    Buong daigdig, sumigaw kayo nang may kagalakan kay Yahweh!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Awit para sa handog ng pasasalamat” o “Awit ng pasasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang salin ng salmong inaawit; maikli at angkop bilang pamagat.
- source_word: הָרִיעוּ
  choice: sumigaw kayo nang may kagalakan
  rationale: Ipinapahayag ang malakas at masayang sigaw na hinihingi ng pandiwang Hebreo, sa likas na modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang natatanging banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulong 'Panginoon'.
- source_word: כָּל־הָאָרֶץ
  choice: Buong daigdig
  rationale: Pinananatili ang pandaigdig na saklaw ng panawagan at nagbibigay ng natural na pangungusap sa Tagalog.
theological_decisions:
- issue: Kahulugan ng לְתוֹדָה sa pamagat
  choice: para sa pasasalamat
  alternative: para sa handog ng pasasalamat; awit ng pasasalamat
  rationale: Maaaring tumukoy ang parirala sa layunin o gamit ng awit, sa uri ng handog, o sa katangian nito. Pinili sa teksto ang tuwirang kahulugang 'para sa pasasalamat' at inilagay sa talababa ang tunay na leksikal at ritwal na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inuna ang panawagang “Buong daigdig” upang maging natural at mariin sa Tagalog, habang pinananatili ang diwa at saklaw ng Hebreo.
