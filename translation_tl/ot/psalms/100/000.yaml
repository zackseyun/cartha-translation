  source_fidelity: 'Tumpak ang salin sa Hebreong מִזְמוֹר לְתוֹדָה: ang “Awit para sa pasasalamat” ay isang wastong pagbasa ng pamagat, at maayos na pinananatili ng talababa ang posibilidad na tumukoy ito sa handog ng pasasalamat o sa awit ng pasasalamat. Ang “Buong daigdig, sumigaw kayo nang may kagalakan kay Yahweh!” ay wastong naghahatid ng maramihang pautos na הָרִיעוּ, ang tuwirang banal na pangalan, at ang saklaw na כָּל־הָאָרֶץ.'
