  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: tl
  text: Salmo ni David[a], nang tumakas siya mula sa kanyang anak na si Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pariralang isinaling “ni David” ay maaari ring mangahulugang “isinulat ni David,” “para kay David,” o “kaugnay ni David”; maaaring ipahiwatig ng pamagat ang pagiging may-akda, pag-aalay, o kaugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Karaniwang katawagan sa Filipino para sa isang musikal o patulang komposisyon sa Aklat ng mga Salmo; mas tiyak ito kaysa sa pangkalahatang “awit.”
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas na anyo sa Filipino para sa pamagat na nag-uugnay ng salmo kay David, habang hindi tahasang nililimitahan ang ugnayan sa pagiging may-akda lamang.
- source_word: בְּבָרְחוֹ
  choice: nang tumakas siya
  rationale: Likas na temporal na salin ng pang-ukol na ב na kasama ng infinitive construct at hulaping panghalip.
- source_word: מִפְּנֵי
  choice: mula sa
  rationale: Sa konteksto ng pagtakas, ito ang malinaw at natural na katumbas ng idyomang literal na “mula sa harapan/presensya ng.”
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Filipino.
- source_word: בְּנוֹ
  choice: kanyang anak
  rationale: Tuwirang pinananatili ang ugnayang pampamilya na binibigyang-diin ng pamagat.
theological_decisions:
- issue: Kahulugan ng superskripsiyong Davidiko
  choice: Ginamit ang “ni David” nang hindi tahasang sinasabing siya ang sumulat.
  alternative: “isinulat ni David” o “para kay David”
  rationale: Maaaring tumukoy ang Hebreong לְ sa pagiging may-akda, pag-aalay, pag-aari, o kaugnayan. Pinananatili ng “ni David” at ng talababa ang tunay na lawak ng kahulugan sa halip na pumili ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino na maikli at marangal, angkop sa pamagat ng salmo. Inuna ang natural na ayos na “kanyang anak na si Absalom” upang maging malinaw sa karaniwang mambabasa.
