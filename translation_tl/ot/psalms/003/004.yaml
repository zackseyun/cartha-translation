  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: tl
  text: Ako’y tumatawag kay Yahweh nang malakas, at sinasagot niya ako[a] mula sa kanyang banal na bundok[b]. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at sinagot niya ako mula sa kanyang banal na bundok.” Maaaring isalin sa pangnagdaang panahunan ang pandiwang Hebreo ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Madalas gamitin sa mga tradisyonal na salin ang “mula sa kanyang banal na burol.” Ang salitang Hebreo ay pangunahing nangangahulugang “bundok” at malamang na tumutukoy sa Zion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: Sa aking tinig
  rationale: Pinananatili nito ang literal na diwang “aking tinig” at ang paglalagay nito sa unahan ng taludtod, habang malinaw na ipinapahiwatig na ginagamit ng salmista ang kanyang tinig sa pagtawag.
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang likas na panandang Filipino para sa direksiyon ng pagtawag o panalangin sa isang tiyak na persona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan nito ang personal na pangalang banal sa Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: אֶקְרָא
  choice: tumatawag ako
  rationale: Ang קרא sa konteksto ng panalangin ay nangangahulugang tumawag o dumaing. Ang “tumatawag ako” ay natural, malinaw, at hindi labis na nagpapakitid sa uri ng pagdaing.
- source_word: וַיַּעֲנֵנִי
  choice: at sinasagot niya ako
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang buhay na pagtitiwala ng salmista na tumutugon ang Diyos. Gayunman, maaaring unawain ang anyong Hebreo bilang naganap na kilos, kaya isinama ang alternatibo sa talababa.
- source_word: מֵהַר קָדְשׁוֹ
  choice: mula sa kanyang banal na bundok
  rationale: Ang הַר ay pangunahing nangangahulugang “bundok.” Malamang na tumutukoy ito sa Zion, ngunit hindi idinaragdag ang pangalang iyon sa pangunahing teksto.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan o gamit ng terminong ito, kaya ang transliterasyon ang pinakatapat at hindi mapagpasyang salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ito ng titulo o gumamit ng ibang tradisyonal na anyo.
- issue: Aspekto o panahunan ng וַיַּעֲנֵנִי sa tulang Hebreo
  choice: pangkasalukuyang “sinasagot niya ako”
  alternative: pangnagdaan na “sinagot niya ako”
  rationale: Maaaring magpahayag ang anyong pandiwa ng isang naganap na tugon, ngunit maaari rin itong ihatid sa salin bilang buhay o kinagawiang katiyakan. Pinili ang pangkasalukuyan sa pangunahing teksto at pinanatili sa talababa ang lehitimong pangnagdaang pagbasa.
translation_notes:
  register: Makabago ngunit marangal at bahagyang patula ang rehistro. Ang ayos na “Sa aking tinig ay tumatawag ako” ay sadyang nagpapanatili sa pagdidiin ng Hebreo sa “aking tinig,” nang hindi gumagamit ng lipas o lubhang teknikal na pananalita.
