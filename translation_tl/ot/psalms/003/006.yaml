lexical_decisions:
- source_word: לֹא אִירָא
  choice: Hindi ako matatakot
  rationale: 'Ang Qal imperfect na אִירָא kasama ng negasyon ay likas na naihahayag sa Filipino bilang pananalig o matatag na pasiya tungkol sa hinaharap: “Hindi ako matatakot.”'
- source_word: מֵרִבְבוֹת עָם
  choice: sa laksa-laksang tao
  rationale: Ang רְבָבוֹת ay tumutukoy sa napakaraming bilang, literal na mga sampung libo. Pinananatili ng “laksa-laksa” ang malaking-bilang na larawan nang hindi ito ginagawang eksaktong bilang, at ang עָם dito ay kolektibong mga tao.
- source_word: אֲשֶׁר סָבִיב שָׁתוּ עָלָי
  choice: pumalibot sa akin
  rationale: Ang pinagsamang diwa ng סָבִיב, שָׁתוּ, at עָלָי ay mga taong pumuwesto sa lahat ng panig ng nagsasalita. Likas at maikli sa Filipino ang “pumalibot sa akin,” habang inilalahad sa talababa ang posibleng tahasang diwang laban sa kaniya.
