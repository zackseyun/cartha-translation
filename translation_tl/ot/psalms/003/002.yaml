  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: tl
  text: Marami ang patuloy na nagsasabi tungkol sa akin[a], “Wala siyang kaligtasan sa Diyos.”[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa aking kaluluwa/buhay.” Maaaring ang ibig sabihin ay “tungkol sa akin” o “sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kaligtasan” ay maaari ring isaling “pagliligtas.” Ang “sa Diyos” ay maaari ring maunawaang “mula sa Diyos,” ngunit hindi ito tahasang nililinaw ng Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Ang “Selah” ay malamang na terminong musikal o liturhikal; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: Marami
  rationale: Ginagamit ang pang-uri bilang pangngalan at tumutukoy sa maraming tao. Likas at maikli ang “Marami” sa Filipino.
- source_word: אֹמְרִים
  choice: patuloy na nagsasabi
  rationale: Ang participle ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagkilos. Ipinahahayag ito ng “patuloy na nagsasabi” nang hindi labis na nagpapaliwanag.
- source_word: לְנַפְשִׁי
  choice: tungkol sa akin
  rationale: Literal itong “sa aking kaluluwa/buhay,” ngunit ang נֶפֶשׁ ay maaaring tumukoy sa mismong tao. Mas malinaw sa makabagong Filipino ang idyomatikong “tungkol sa akin”; binabanggit sa talababa ang literal na anyo at posibleng pagbasa.
- source_word: אֵין
  choice: Wala
  rationale: Ito ang likas na katumbas sa Filipino ng Hebreong eksistensiyal na pagtanggi.
- source_word: יְשׁוּעָתָה
  choice: kaligtasan
  rationale: Saklaw ng salita ang pagliligtas o pagsagip. Pinananatili ng “kaligtasan” ang agarang diwa ng pagliligtas at ang mas malawak na teolohikal na bigat ng salita sa Mga Awit.
- source_word: לּוֹ
  choice: para sa kanya / siyang
  rationale: Ang hulaping panghalip ay tumutukoy sa salmista sa ikatlong panauhan sa loob ng siniping pahayag. Sa natural na pangungusap na Filipino, naipahahayag ito ng “siyang” sa “Wala siyang kaligtasan.”
- source_word: בֵאלֹהִים
  choice: sa Diyos
  rationale: Pinananatili ng “sa Diyos” ang karaniwang puwersa ng pang-ukol ב at hindi tahasang nagpapasya kung ang diin ay ‘mula sa Diyos,’ ‘nasa Diyos,’ o ‘sa piling ng Diyos.’
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong musikal o liturhikal, kaya transliterasyon ang pinakamalinaw at hindi mapangahas na paraan.
theological_decisions:
- issue: Kung isasalin ang יְשׁוּעָה bilang “kaligtasan” o mas kontekstuwal na “pagliligtas”
  choice: kaligtasan
  alternative: pagliligtas; saklolo
  rationale: Maaaring tumukoy ang salita sa kongkretong pagsagip sa panganib, ngunit pinananatili ng “kaligtasan” ang parehong agarang diwa at mas malawak na teolohikal na resonansiya nang hindi nililimitahan ang kahulugan.
- issue: Kung literal o idyomatiko ang pagsasalin sa לְנַפְשִׁי
  choice: tungkol sa akin
  alternative: sa aking kaluluwa; sa akin
  rationale: Dito, maaaring kumatawan ang נֶפֶשׁ sa buong pagkatao. Ang literal na “sa aking kaluluwa” ay maaaring maling magpahiwatig na panloob o sikolohikal lamang ang tinutukoy. Gayunman, ipinauubaya sa talababa ang posibilidad na ang mga salita ay sinasabi rin nang tuwiran sa salmista.
- issue: Ang puwersa ng ב sa בֵאלֹהִים
  choice: sa Diyos
  alternative: mula sa Diyos; sa piling ng Diyos; sa pamamagitan ng Diyos
  rationale: Hindi lubos na tinutukoy ng Hebreong pang-ukol ang ugnayan. Ang “sa Diyos” ang pinakapormal na likas na salin at nagpapanatili ng tunay na kalabuan sa halip na gawing tahasan ang ‘mula sa Diyos.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy na nagsasabi” upang ipakita ang nagpapatuloy na puwersa ng participle. Pinanatili ang “Selah” bilang transliterasyon, at inilagay sa mga talababa ang mga tunay na leksikal at pang-ukol na kalabuan.
