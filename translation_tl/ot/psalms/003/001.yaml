  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: tl
  text: Yahweh, napakarami ng aking mga kaaway! Marami ang bumabangon laban sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo at ang pantawag na O, sa halip na palitan ito ng isang titulo.
- source_word: מָה רַבּוּ
  choice: napakarami
  rationale: Ang מָה ay ginagamit dito bilang padamdam na nagpapatingkad sa dami; natural itong ipinapahayag sa Tagalog bilang “napakarami.”
- source_word: צָרָי
  choice: aking mga kaaway
  rationale: Tumutukoy ito sa mga taong aktibong sumasalungat sa nagsasalita. Ang “mga kaaway” ay malinaw at likas sa modernong Tagalog nang hindi nililimitahan sa kontekstong militar.
- source_word: רַבִּים
  choice: Marami
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at inilalagay sa unahan para sa diin; tumutugma rito ang payak na “Marami.”
- source_word: קָמִים
  choice: bumabangon
  rationale: Ang participle ng קום ay naglalarawan ng patuloy o kasalukuyang pagbangon bilang pagsalungat, nang hindi dinaragdagan ng mas tiyak na kilos gaya ng paglusob.
- source_word: עָלָי
  choice: laban sa akin
  rationale: Kapag kasama ng קום, ang עַל ay nagpapahayag ng kilos na salungat sa isang tao; ang “laban sa akin” ang likas na katumbas sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo; hindi kailangan ang talababa dahil nasa pangunahing teksto mismo ang anyong pinili.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang padamdam at ang pag-uulit ng ideya ng napakaraming sumasalungat. Ginamit ang “bumabangon laban” upang mapanatili ang talinghagang Hebreo at ang aktibong, nagpapatuloy na pagsalungat.
