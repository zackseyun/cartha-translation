base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: tl
  text: Ngunit ikaw, Yahweh, ang kalasag na nakapalibot sa akin[a], ang aking kaluwalhatian, at ang nagtataas ng aking ulo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kalasag para sa akin” o “kalasag na nagtatanggol sa akin.” Maaaring magpahiwatig ang pang-ukol sa Hebrew ng pagkilos para sa kapakanan ng isang tao, bagaman dito ay malamang na larawan ito ng pag-iingat na nakapalibot sa akin.
    reason: lexical_alternative
  - marker: b
    text: Ang “nagtataas ng aking ulo” ay isang idyomang Hebrew na maaaring tumukoy sa pagpapanumbalik ng dangal o lakas ng loob, o sa pagbibigay-katarungan sa isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ang pangatnig na kasunod ng tahasang panghalip ay nagpapakita ng mariing pagsalungat sa naunang paghihirap. Likas sa Tagalog ang “Ngunit ikaw” at napananatili nito ang diin sa kausap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: מָגֵן בַּעֲדִי
  choice: ang kalasag sa palibot ko
  rationale: Ang מָגֵן ay isang pananggalang na kalasag. Maaaring mangahulugan ang בַּעֲדִי ng “para sa akin” o “alang-alang sa akin,” ngunit kasama ng “kalasag” ay malamang na inilalarawan nito ang pag-iingat na nakapalibot sa nagsasalita.
- source_word: כְּבוֹדִי
  choice: ang aking kaluwalhatian
  rationale: Napananatili ng “kaluwalhatian” ang maikli at masaklaw na larawan ng Hebrew, na maaaring tumukoy sa dangal, karangalan, o kaluwalhatian ng mang-aawit.
- source_word: וּ/מֵרִים רֹאשִׁי
  choice: at ang nagtataas ng aking ulo
  rationale: Ang participle ay naglalarawan ng katangiang patuloy o karaniwang ginagawa. Pinananatili rin ng salin ang kongkretong idyoma sa halip na paliitin ito sa iisang interpretasyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng “nagtataas ng aking ulo”
  choice: Panatilihin ang literal na idyoma sa pangunahing teksto
  alternative: nagbabalik ng aking dangal / nagbibigay sa akin ng lakas ng loob / ipinagtatanggol ako
  rationale: Maaaring saklawin ng larawan ang pagpapanumbalik ng dangal, tapang, o pagiging matuwid sa harap ng iba. Ang literal na idyoma ay nagpapanatili sa yamang patula at sa lawak ng kahulugan nito.
- issue: Kahulugan ng כְּבוֹדִי bilang pahayag tungkol kay Yahweh
  choice: ang aking kaluwalhatian
  alternative: ang aking karangalan
  rationale: Hindi nililinaw ng teksto kung ang diin ay nasa kaluwalhatian, dangal, o karangalang nagmumula kay Yahweh. Pinananatili ng “kaluwalhatian” ang teolohikal at patulang lawak ng salita.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang tuwirang pagtawag na “Yahweh” at ang magkakapantay na pariralang “ang kalasag… ang aking kaluwalhatian… at ang nagtataas…” ay nagpapanatili sa diin at patulang ayos ng Hebrew nang hindi nagiging pilit sa Tagalog.
