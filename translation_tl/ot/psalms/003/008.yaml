  yaml_path: translation/ot/psalms/003/008.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: tl
  text: 'Kay Yahweh ang pagliligtas;

    sa iyong bayan ang pagpapala mo.[a]

    Selah[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Mapasa iyong bayan ang pagpapala mo.” Walang pandiwa ang sugnay sa Hebreo, kaya maaari itong basahin bilang isang pahayag o bilang isang panalangin.
    reason: alternative_reading
  - marker: b
    text: Ang “Selah” ay malamang na panandang liturhikal o pangmusika; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: Kay Yahweh
  rationale: 'Ang לְ ay nagpapahayag dito ng pag-aari o kaugnayan: ang pagliligtas ay kay Yahweh o nagmumula sa kanya. Pinananatili ang pangalang Yahweh ayon sa tuwirang anyo ng יהוה.'
- source_word: הַיְשׁוּעָה
  choice: ang pagliligtas
  rationale: Ang יְשׁוּעָה ay tumutukoy sa pagsagip o pagpapalaya. Mas buhay at likas sa kasalukuyang Tagalog ang “pagliligtas” kaysa sa mas abstraktong “kaligtasan” sa konteksto ng salmong ito.
- source_word: עַל
  choice: sa
  rationale: Sa pariralang tumutukoy sa pagpapalang nakalagay o nananatili sa bayan, likas sa Tagalog ang “sa”; hindi kailangang gawing mas literal ngunit mabigat na “sa ibabaw ng.”
- source_word: עַמְּךָ
  choice: iyong bayan
  rationale: Ang עַם ay isang bayang nakaugnay sa Diyos bilang kanyang sambayanan. Ang “iyong bayan” ay likas, marangal, at nagpapanatili ng panlahatan at tipanang diwa.
- source_word: בִרְכָתֶךָ
  choice: ang pagpapala mo
  rationale: Tuwirang katumbas ng בְּרָכָה ang “pagpapala.” Pinili ang karaniwang ayos na “pagpapala mo” upang maging natural sa modernong Tagalog.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong ito at malamang na panandang liturhikal o pangmusika, kaya itinumbas ito sa baybay na “Selah” sa halip na hulang salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang pangalang tipan na יהוה. Ang “Yahweh” ang pinakamalapit na karaniwang transliterasyon at hindi nito pinapalitan ang pangalan ng isang titulo.
- issue: Pag-unawa sa sugnay na עַל עַמְּךָ בִרְכָתֶךָ
  choice: sa iyong bayan ang pagpapala mo
  alternative: mapasa iyong bayan ang pagpapala mo
  rationale: Walang pandiwa ang sugnay sa Hebreo, kaya maaari itong unawain bilang pahayag o bilang panalangin. Pinananatili ng pangunahing salin ang payak na sugnay na walang tahasang pandiwa, habang inilalahad sa talababa ang posibleng panalanging pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang maikli at bahagyang patulang ayos upang mapanatili ang paralelismo at ang tunay na kalabuan ng sugnay na walang pandiwa. Ang “bayan” ay mas natural sa salmong panlahat kaysa “mga tao,” at hindi nito nililimitahan ang diwa sa makabagong bansang-estado.
