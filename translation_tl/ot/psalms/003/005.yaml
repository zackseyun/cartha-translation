  text: אֲנִ֥י שָׁכַ֗בְתִּי וָֽ/אִ֫ישָׁ֥נָ/ה הֱקִיצ֑וֹתִי כִּ֖י יְהוָ֣ה יִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/005.yaml
  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: tl
  text: Ako'y humiga at natulog; nagising ako, sapagkat inaalalayan ako ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: Ako'y humiga
  rationale: Ang pandiwang שׁכב ay nangangahulugang humiga. Pinananatili ng tahasang “Ako” ang diin ng Hebreong אֲנִי at natural itong nagsisimula sa sunod-sunod na kilos.
- source_word: וָאִישָׁנָה
  choice: at natulog
  rationale: Ang ישׁן ay “matulog.” Ang “natulog” ay payak at natural na naglalarawan sa kasunod na kilos.
- source_word: הֱקִיצוֹתִי
  choice: nagising ako
  rationale: Ang קיץ ay nangangahulugang magising. Ang “nagising ako” ang karaniwang makabagong Filipino at malinaw na intransitibo ang kilos.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng ligtas na paggising ng nagsasalita. Ang “sapagkat” ay malinaw na panumbas sa sanhi at angkop sa marangal na tulang panrelihiyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyong “Yahweh” ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: יִסְמְכֵנִי
  choice: inaalalayan ako
  rationale: Ang סמך ay maaaring mangahulugang sumuporta, umalalay, o magpanatili. Likas sa Filipino ang “inaalalayan ako” at ipinahahayag nito ang patuloy na pagkalinga at suporta sa konteksto.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng ligtas na paggising at pagkilos ng Diyos
  choice: sapagkat inaalalayan ako ni Yahweh
  alternative: sapagkat sinusuportahan ako ni Yahweh
  rationale: Pinananatili ang tahasang ugnayang sanhi ng כִּי at ang malawak na diwa ng סמך nang hindi tinutukoy kung anong tiyak na paraan ng pag-alalay ang tinutukoy.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: 'Makabagong Filipino Tagalog na payak ngunit marangal. Napanatili ang maigsi at sunod-sunod na galaw ng Hebreong tula: paghiga, pagtulog, paggising, at ang dahilan ng kaligtasan.'
