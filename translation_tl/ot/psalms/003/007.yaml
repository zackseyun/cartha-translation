base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: tl
  text: Bumangon ka, Yahweh! Iligtas mo ako, Diyos ko! Sapagkat sinaktan mo sa panga[a] ang lahat ng aking mga kaaway; binali mo ang mga ngipin ng masasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “panga” ay maaari ring isaling “pisngi.” Ang mga pandiwang Hebreo ay nasa anyong nagsasaad ng ganap na pagkilos (“sinaktan mo … binali mo”), ngunit sa tulang panalangin maaari rin itong magpahayag ng tiyak o karaniwang pagkilos ng Diyos.
    reason: Pinananatili ang leksikal na saklaw ng לֶחִי at ang aspektuwal na kalabuan ng dalawang Hebreong perfect.
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Tuwirang pautos ng קום na humihiling sa Diyos na kumilos; natural at marangal sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הוֹשִׁיעֵנִי
  choice: Iligtas mo ako
  rationale: Malawak at pangunahing diwa ng Hiphil imperative ng ישׁע, na angkop sa agarang pagsagip.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang ipinapahayag ang personal na panawagan at anyong paari.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pakiusap.
- source_word: הִכִּיתָ
  choice: sinaktan mo
  rationale: Inilalarawan ang ganap na pagkilos sa nakaraan; ang 'sinaktan' ay natural kasama ng panga at hindi gumagamit ng di-likas na pariralang 'hinampas sa panga.'
- source_word: אֶת כָּל אֹיְבַי
  choice: ang lahat ng aking kaaway
  rationale: Malinaw at tuwirang salin ng buong layon.
- source_word: לֶחִי
  choice: sa panga
  rationale: Ang 'panga' ay umaangkop sa kasunod na larawan ng pagbali ng mga ngipin; maaari ring mangahulugang 'pisngi.'
- source_word: שִׁנֵּי רְשָׁעִים
  choice: ang mga ngipin ng masasama
  rationale: Pinananatili ang kongkreto at marahas na larawang ginamit sa Hebreo, pati ang kolektibong pagtukoy sa masasama.
- source_word: שִׁבַּרְתָּ
  choice: binali mo
  rationale: Karaniwang Tagalog para sa ganap na pagkilos na pagbali sa mga ngipin; pinananatili ang parallel na anyong perpektibo.
theological_decisions:
- issue: Aspekto ng הִכִּיתָ at שִׁבַּרְתָּ sa konteksto ng panalangin
  choice: 'Ganap/naganap: “sinaktan mo … binali mo”'
  alternative: 'Kasalukuyan o tiyak na pagkilos: “sinasaktan mo … binabali mo”'
  rationale: Parehong perfect ang mga pandiwang Hebreo at pinakanatural na katawanin bilang naganap na kilos sa Tagalog. Gayunman, maaari ring ipahiwatig ng wikang patula ang tiyak o katangiang pagkilos ng Diyos; binabanggit ito sa talababa upang hindi alisin ang tunay na puwang ng pagbasa.
- issue: Marahas na larawan laban sa mga kaaway
  choice: Panatilihin ang pananakit sa panga at pagbali ng mga ngipin
  alternative: Palambutin bilang pangkalahatang pagkatalo ng masasama
  rationale: Kongkreto ang Hebreong larawan at nagpapahiwatig ng pagpapahiya at pag-alis ng kakayahang manakit; hindi ito dapat gawing abstraktong paraphrase.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang masidhing bantas upang katawanin ang apurahang panawagan, habang pinanatili ang personal na pangalang Yahweh at ang kongkretong imahen ng orihinal.
