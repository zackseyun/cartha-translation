base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: tl
  text: Nawa’y magalak ang kalangitan, at magsaya ang lupa; nawa’y dumagundong ang dagat[a] at ang lahat ng laman nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: umugong ang dagat.'
    reason: Ang Hebreong pandiwa ay maaaring tumukoy sa pagdagundong o sa malakas na pag-ugong.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Nawa’y magalak
  rationale: Ang Qal imperfect ay may puwersang paghiling o paghimok sa konteksto ng panawagan sa sangnilikha; natural itong ipinahahayag sa Filipino sa pamamagitan ng “nawa’y.”
- source_word: הַשָּׁמַיִם
  choice: ang kalangitan
  rationale: Ipinakikita ng kolektibong “kalangitan” ang malawak at makatang saklaw ng anyong Hebreong karaniwang tumutukoy sa mga langit o sa kalawakan sa itaas.
- source_word: וְתָגֵל
  choice: at magsaya
  rationale: Ang גיל ay nagpapahayag ng matinding galak. Pinananatili ng “magsaya” ang pagkakatulad sa unang sugnay nang hindi inuulit ang “magalak.”
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa hanay na kalangitan–lupa–dagat, ang tinutukoy ay ang daigdig bilang bahagi ng sangnilikha, hindi isang partikular na lupain.
- source_word: יִרְעַם
  choice: nawa’y dumagundong
  rationale: Ang רעם ay tumutukoy sa malakas na tunog na gaya ng kulog. Ang “dumagundong” ay natural na mailalapat sa dagat at napapanatili ang maringal na larawang patula.
- source_word: הַיָּם
  choice: ang dagat
  rationale: Ito ang karaniwan at tuwirang katumbas ng ים sa kontekstong makata.
- source_word: וּמְלֹאוֹ
  choice: at ang lahat ng naroroon
  rationale: Literal itong “at ang kapuspusan nito,” isang idyomang tumutukoy sa lahat ng nilalaman ng dagat. Ang “lahat ng naroroon” ay malinaw at natural sa modernong Filipino.
theological_decisions:
- issue: Puwersang bolitibo ng mga imperfect na pandiwa sa tula
  choice: 'Isinalin bilang paghiling o panawagan: “Nawa’y magalak … nawa’y dumagundong.”'
  alternative: 'Maaaring unawain bilang payak na hinaharap: “Magagalak … dagundong ang dagat.”'
  rationale: Ang konteksto ng awit ay isang panawagan sa buong sangnilikha na magpuri. Kaya mas angkop ang bolitibong pagbasa, nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makata, maringal, at madaling maunawaan sa modernong Filipino. Ginamit ang “nawa’y” upang malinaw na maipahayag ang panawagan sa sangnilikha, at pinanatili ang tatluhang larawang kalangitan–lupa–dagat.
