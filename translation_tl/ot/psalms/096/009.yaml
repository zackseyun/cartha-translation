base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: tl
  text: Sumamba kayo kay Yahweh sa karilagan ng kabanalan[a]; manginig kayo sa harap niya, buong daigdig!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suot ang banal na kasuotan” o “sa banal na karilagan.” Maaaring tumukoy ang pariralang Hebreo sa karilagang taglay ng kabanalan o sa banal na gayak o kasuotang ginagamit sa pagsamba.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Sumamba kayo
  rationale: Ang pandiwa ay literal na tumutukoy sa pagyukod o pagpapatirapa bilang pagpipitagan. Ang “sumamba kayo” ay natural sa modernong Tagalog at malinaw na naghahatid ng relihiyosong diwa ng utos.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang banal na יהוה bilang “Yahweh.”
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: sa marilag na kabanalan
  rationale: Ipinahahayag ng “marilag” ang karilagan, kagandahan, o kadakilaan ng הֲדָרָה, samantalang pinananatili ng “kabanalan” ang abstraktong diwa ng קֹדֶשׁ. Hindi nito lubusang nilulutas ang posibleng pagtukoy sa banal na kasuotan, kaya inilalahad iyon sa talababa.
- source_word: חִילוּ
  choice: manginig
  rationale: Maaaring tumukoy ang pandiwa sa panginginig, pamimilipit, o matinding pagkabagabag. Sa konteksto ng pagsamba, ang “manginig” ay naghahatid ng takot at pagpipitagan sa presensiya ng Diyos nang hindi nagdaragdag ng diwa ng pisikal na sakit.
- source_word: מִפָּנָיו
  choice: sa harap niya
  rationale: Natural na salin ito ng idyomang literal na tumutukoy sa pagiging nasa harap ng kaniyang mukha o presensiya.
- source_word: כָּל־הָאָרֶץ
  choice: buong lupa
  rationale: Ang pandaigdig na panawagan ng salmo ay mas angkop sa “buong lupa” kaysa sa isang partikular na lupain.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng בְּהַדְרַת קֹדֶשׁ
  choice: sa marilag na kabanalan
  alternative: suot ang banal na kasuotan; sa banal na karilagan
  rationale: Maaaring ilarawan ng parirala ang karilagang kaugnay ng kabanalan o ang banal na gayak ng mga sumasamba. Pinananatili sa pangunahing teksto ang malawak at makatang diwa, at inilalagay sa talababa ang alternatibong tumutukoy sa kasuotan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at makata ngunit madaling maunawaan. Ginamit ang maramihang “kayo” upang maipakita ang maramihang pautos sa Hebreo, at ang padamdam sa hulihan upang mapanatili ang lakas ng pandaigdig na panawagan.
