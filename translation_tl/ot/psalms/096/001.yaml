  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: tl
  text: Umawit kayo para kay Yahweh ng isang bagong awit; umawit kayo para kay Yahweh, buong daigdig![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH,” ang banal na pangalan ng Diyos, na tradisyonal na isinasalin bilang “PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Pautos na maramihan ang pandiwa; tuwirang nananawagan ito sa lahat ng kausap na umawit, nang hindi nagdaragdag ng bagay tulad ng “papuri” na wala sa Hebreo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinapakita ng ל ang pinag-uukulan ng pag-awit. Ang “kay” ang likas na anyo sa Tagalog para sa personal na pinag-uukulan.
- source_word: שִׁיר חָדָשׁ
  choice: isang bagong awit
  rationale: Tuwirang katumbas ng “new song”; kailangan sa natural na Tagalog ang panandang “isang” sa kontekstong ito.
- source_word: כָּל הָאָרֶץ
  choice: buong daigdig
  rationale: Sa pandaigdigang konteksto ng salmo, tumutukoy ito sa buong mundo, hindi lamang sa isang lupain. Ang “buong daigdig” ay natural na panawagan at pinananatili ang malawak na saklaw ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulong “PANGINOON”; inilalahad ng talababa ang tradisyonal na alternatibo nang hindi ipinipilit ang isang denominasyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkatulad na pautos upang maipakita ang diin at paralelismo ng tulang Hebreo. Ginamit ang “buong daigdig” bilang tuwirang kinakausap, gaya ng Hebreo.
