  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: tl
  text: Karangalan at karilagan ay nasa harap niya; lakas at kagandahan ay nasa kanyang santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang ikalawang linya na “lakas at karilagan ay nasa kanyang santuwaryo.” Ang Hebreong תִפְאֶרֶת ay maaari ring mangahulugang “karilagan” o “kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: karangalan
  rationale: Ipinahihiwatig ng הוֹד ang maringal na dangal o kaningningan. Ang “karangalan” ay likas at dignified sa Filipino at naihihiwalay sa kasunod na הָדָר.
- source_word: הָדָר
  choice: karilagan
  rationale: Ang הָדָר ay tumutukoy sa maringal na kagandahan o kadakilaan. Pinananatili ng “karilagan” ang matayog at makatang diwa ng katambal na salita.
- source_word: לְפָנָיו
  choice: ay nasa harap niya
  rationale: Tuwirang pinananatili nito ang larawang pangkalagayan ng Hebreong “sa harap niya,” sa halip na ipakahulugang “nasa kanyang presensya.”
- source_word: עֹז
  choice: lakas
  rationale: Karaniwang kahulugan ng עֹז ang lakas o kapangyarihan; malinaw at natural ang “lakas” sa pagtutumbas na patula.
- source_word: תִפְאֶרֶת
  choice: kagandahan
  rationale: Maaaring mangahulugan ang תִפְאֶרֶת ng kagandahan, karilagan, o kaluwalhatian. Pinipili ang “kagandahan” upang mapanatili ang estetikong diwa at hindi ulitin ang “karilagan.”
- source_word: בְּמִקְדָּשׁוֹ
  choice: nasa kanyang santuwaryo
  rationale: Ang מִקְדָּשׁ ay banal na dako o santuwaryo. Hindi ito labis na nililimitahan ng “santuwaryo” sa isang partikular na gusaling templo.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip sa “niya” at “kanyang”
  choice: Pinanatili ang mga panghalip na tumutukoy sa PANGINOON ayon sa konteksto.
  alternative: Palitan ang mga panghalip ng tahasang “PANGINOON.”
  rationale: Bagaman hindi inuulit sa talata ang banal na pangalan, malinaw sa agarang konteksto na ang PANGINOON ang tinutukoy. Ang pagpapanatili sa mga panghalip ay sumusunod sa Hebreong daloy at hindi nagdaragdag sa teksto.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang “santuwaryo” bilang malawak at pamilyar na katawagan sa banal na dako. Nasa pangunahing teksto ang panandang [a].
