  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: tl
  text: Ipahayag ninyo sa gitna ng mga bansa ang kanyang kaluwalhatian; sa gitna ng lahat ng sambayanan, ang kanyang mga kahanga-hangang gawa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang mga kababalaghan” o “ang kanyang mga kamangha-manghang gawa.”
    reason: Ipinakikita ang leksikal na saklaw ng נִפְלְאוֹתָיו, na maaaring isalin bilang mga kababalaghan, kamangha-manghang gawa, o kahanga-hangang gawa.
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Ipahayag ninyo
  rationale: Ang maramihang pautos na piel ng ספר ay nananawagan ng hayagang pagsasalaysay o pagpapahayag. Ang “Ipahayag ninyo” ay natural sa makabagong Filipino at nagpapanatili sa mariing tono ng panawagan.
- source_word: בַגּוֹיִם
  choice: sa mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy sa mga bansa o mga bayan. Ang “mga bansa” ay angkop sa pandaigdig na saklaw ng salmo at hindi nag-aangkat ng mas huling etniko-relihiyosong diwa ng “mga Hentil.” Sa Filipino, natural na naipahihiwatig ng “sa” ang pagpapahayag sa gitna ng mga bansang iyon.
- source_word: כְּבוֹדוֹ
  choice: ang kanyang kaluwalhatian
  rationale: Saklaw ng כָּבוֹד ang mabigat na karangalan, kaningningan, at kaluwalhatian. Ang “kaluwalhatian” ang pinakakaraniwan at marangal na salin sa konteksto ng pagpupuri.
- source_word: בְּכָל הָעַמִּים
  choice: sa lahat ng mga sambayanan
  rationale: Pinananatili ng “mga sambayanan” ang pagkakaiba ng עַמִּים sa naunang גּוֹיִם at ang paralelismong patula, habang malinaw na tumutukoy sa mga pangkat ng tao at hindi lamang sa mga estado o teritoryo.
- source_word: נִפְלְאוֹתָיו
  choice: ang kanyang mga kahanga-hangang gawa
  rationale: Ang salita, mula sa פלא, ay tumutukoy sa pambihira at kamangha-manghang mga ginawa. Nililinaw ng “mga kahanga-hangang gawa” na mga pagkilos ang tinutukoy, samantalang pinananatili ang diwa ng pagkamangha.
theological_decisions:
- issue: Pangkalahatang saklaw ng pagpapahayag
  choice: Ang kaluwalhatian at mga gawa ng PANGINOON ay dapat ipahayag sa mga bansa at sa lahat ng mga sambayanan.
  alternative: Iukol ang tinutukoy pangunahin lamang sa mga karatig-bansa ng Israel.
  rationale: Mariing ipinahihiwatig ng magkatambal na גּוֹיִם at כָּל הָעַמִּים ang malawak at pandaigdig na saklaw. Pinananatili ng salin ang saklaw na ito nang hindi nagdaragdag ng mga mas huling pormulasyong misiyolohikal na wala mismo sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga sambayanan” upang mapanatili ang patulang pagkakaiba ng “mga bansa” at “mga bayan/peoples,” at semicolon upang ihayag ang balanseng paralelismo ng dalawang hati ng taludtod.
