  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: tl
  text: Umawit kayo kay Yahweh; pagpalain ninyo ang kanyang pangalan; ibalita ninyo[a] araw-araw ang kanyang pagliligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipahayag ninyo ang mabuting balita ng kanyang pagliligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Ang maramihang pautos ng שׁיר ay tuwirang panawagang umawit; hindi dinagdagan ng di-hayag na layon gaya ng “papuri.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay tumutukoy sa pinag-uukulan ng awit, at ang pangalang tipan na יהוה ay pinanatiling “Yahweh.”
- source_word: בָּרֲכוּ
  choice: pagpalain ninyo
  rationale: Pinananatili nito ang karaniwang biblikal na idyoma at ang pagkakaiba nito sa naunang utos na umawit; ang “purihin” ay mas natural ngunit pinapantay ang dalawang magkaibang pandiwa.
- source_word: שְׁמוֹ
  choice: ang kanyang pangalan
  rationale: Tuwirang katumbas ng pangngalang may hulaping ikatlong panauhang panlalaki; pinananatili ang biblikal na pahayag tungkol sa pangalan bilang pagkakakilanlan at dangal.
- source_word: בַּשְּׂרוּ
  choice: ibalita ninyo
  rationale: Ang Piel na pautos ng בשר ay tumutukoy sa paghahayag o pagdadala ng mabuting balita. Likas at maikli sa Filipino ang “ibalita,” habang inilalagay sa talababa ang mas tahasang pagpapakahulugan.
- source_word: מִיּוֹם לְיוֹם
  choice: araw-araw
  rationale: Likas na Filipino para sa Hebreong idyomang nagsasaad ng patuloy at arawang pag-uulit.
- source_word: יְשׁוּעָתוֹ
  choice: ang kanyang pagliligtas
  rationale: Saklaw ng יְשׁוּעָה ang pagliligtas o kaligtasan. Ang “pagliligtas” ay angkop dito bilang ipinababalitang gawa ni Yahweh, nang hindi nililimitahan sa isang partikular na uri ng tagumpay.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ang tao bilang nagpapala sa pangalan ng Diyos
  choice: pagpalain ninyo ang kanyang pangalan
  alternative: purihin ninyo ang kanyang pangalan; dakilain ninyo ang kanyang pangalan
  rationale: Pinananatili ang biblikal at teolohikal na tensiyon ng ברך kapag Diyos ang pinag-uukulan. Ang diwa rito ay pagpupuri o pagdakila, ngunit hindi ito tahimik na ipinalit sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kanyang” sa kasalukuyang baybay at ang payak na ayos na pautos. Pinanatili ang biblikal na idyomang “pagpalain ang kanyang pangalan,” samantalang ang mas tiyak na diwa ng בשר ay nilinaw sa talababa.
