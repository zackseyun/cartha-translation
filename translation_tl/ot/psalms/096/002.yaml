  source_fidelity: 'Tapat ang salin sa tatlong maramihang pautos ng Hebreo: שִׁירוּ (“Umawit kayo”), בָּרֲכוּ (“pagpalain ninyo”), at בַּשְּׂרוּ (“ibalita ninyo”). Wasto ang “kay Yahweh” para sa לַיהוָה, at naipapahayag ng “araw-araw” ang idyomang מִיּוֹם לְיוֹם. Ang “kanyang pagliligtas” ay angkop para sa יְשׁוּעָתוֹ at hindi labis na naglilimita sa saklaw nito.'
