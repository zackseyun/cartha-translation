  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: tl
  text: Sapagkat mga diyus-diyosan[b] ang lahat ng diyos ng mga bayan[a], ngunit si Yahweh[c] ang gumawa ng kalangitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga bayan” bilang “mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “mga walang-kabuluhang diyus-diyosan.” Ang salitang Hebreo ay maaaring magpahiwatig ng kawalang-laman o kawalang-halaga.'
    reason: lexical_alternative
  - marker: c
    text: Hebreo YHWH, na tradisyonal na isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang panawagan at natural na nag-uugnay sa taludtod sa konteksto.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: ang lahat ng diyos ng mga bayan
  rationale: Pinananatili ang malawak na saklaw ng כָּל, ang payak na kahulugan ng אֱלֹהֵי bilang “mga diyos,” at ang kolektibong diwa ng הָעַמִּים bilang “mga bayan.”
- source_word: אֱלִילִים
  choice: mga diyus-diyosan
  rationale: Ito ang malinaw at karaniwang katumbas sa Tagalog; ipinahihiwatig ng salitang Hebreo ang kawalang-halaga, ngunit hindi iyon ginawang tahasang dagdag sa pangunahing teksto.
- source_word: וַיהוָה
  choice: ngunit si Yahweh
  rationale: Ang pangatnig ay nagpapakita rito ng matinding pagsalungat sa mga diyos ng mga bayan. Ang pangalan ng Diyos na יהוה ay tuwirang isinalin bilang “Yahweh.”
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Natural na kolektibong katumbas sa Tagalog ng anyong Hebreo na tumutukoy sa langit o mga kalangitan.
- source_word: עָשָׂה
  choice: ang gumawa
  rationale: Pinananatili ang malawak at tuwirang kahulugan ng pandiwang “gumawa,” sa halip na gamitin ang mas tiyak na “lumalang.”
theological_decisions:
- issue: Paglalarawan sa mga diyos ng mga bayan
  choice: mga diyus-diyosan
  alternative: mga walang-kabuluhang diyus-diyosan
  rationale: Pinananatili ng pangunahing salin ang tahasang kahulugan habang inilalagay sa talababa ang polemikong pahiwatig ng kawalang-halaga, upang hindi palabis na lutasin ang saklaw ng salita.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inuna ang panaguri (“mga diyus-diyosan”) upang maging natural at madiin ang paghahambing, habang ang “si Yahweh ang gumawa” ay nagpapatingkad sa kaibahan sa pagitan ng mga diyus-diyosan at ng Maylalang.
