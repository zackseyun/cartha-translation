id: PSA.96.7
reference: Psalms 96:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: tl
  text: Iukol ninyo kay Yahweh[a], kayong mga angkan ng mga bayan[b]; iukol ninyo kay Yahweh ang kaluwalhatian at lakas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang banal na pangalang יהוה; maaari rin itong isaling “PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga lipi ng mga bansa.”
    reason: lexical_alternative
  - marker: c
    text: Ang “iukol” ay mas literal na “ibigay”; dito, ang diwa ay kilalanin ang nararapat kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Iukol ninyo
  rationale: Ang literal na diwa ay “ibigay ninyo,” ngunit sa panawagan sa pagsamba, hinihimok ang mga bayan na kilalanin at iukol kay Yahweh ang nararapat sa kanya. Pinananatili ng “iukol” ang larawan ng pagbibigay nang hindi ipinahihiwatig na may naidaragdag ang tao sa Diyos.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagmamarka sa pinag-uukulan ng utos, at ang pangalang יהוה ay tinumbasan ng “Yahweh” upang mapanatili ang personal na banal na pangalan.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: mga angkan ng mga bayan
  rationale: Ang מִשְׁפָּחוֹת ay mga angkan o magkakamag-anak na pangkat, samantalang ang עַמִּים ay mga bayan o pangkat ng mga tao. Pinananatili ng salin ang dalawang antas at ang mga anyong maramihan.
- source_word: כָּבוֹד
  choice: kaluwalhatian
  rationale: Sa konteksto ng pagsamba, tumutukoy ito sa kaluwalhatian o karangalang nararapat kilalanin kay Yahweh; ang “kaluwalhatian” ay angkop sa marangal at makatang himig.
- source_word: וָעֹז
  choice: at lakas
  rationale: Ang עֹז ay lakas, kapangyarihan, o kalakasan. Ang “lakas” ay tuwiran, natural, at hindi nilalampasan ang saklaw ng salitang Hebreo.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung ang mga tao ba ay literal na nagbibigay ng kaluwalhatian at lakas sa Diyos
  choice: Iukol bilang pagkilala sa nararapat sa Diyos
  alternative: Ibigay nang literal
  rationale: Ang paulit-ulit na הָבוּ ay may literal na larawang “magbigay,” ngunit sa panawagang ito sa pagsamba, ang kahulugan ay pagkilala at pag-uukol sa Diyos ng kaluwalhatian at lakas na taglay at nararapat sa kanya. Hindi nito ipinahihiwatig na ang Diyos ay tumatanggap ng katangiang dati niyang wala.
translation_notes:
  register: Makabagong Filipino na marangal at patula, ngunit madaling maunawaan. Pinanatili ang pag-uulit ng utos sa Hebreo at ginamit ang tuldok-kuwit upang malinaw na hatiin ang dalawang magkahanay na panawagan.
