  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: tl
  text: Magbunyi ang bukirin at ang lahat ng naroon; saka aawit sa galak[a] ang lahat ng punongkahoy sa gubat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisigaw sa galak.” Ang pandiwang Hebreo ay maaaring tumukoy sa isang matunog na sigaw ng kagalakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: Magbunyi
  rationale: Ang pandiwa ay nagpapahayag ng masidhing kagalakan at, sa anyong patula rito, nagsisilbing paanyaya o hangarin. Pinananatili ng “magbunyi” ang lakas at marangal na himig nito.
- source_word: שָׂדַי
  choice: ang bukirin
  rationale: Bagaman isahan ang anyo sa Hebreo, kolektibo ang gamit nito. Ang “bukirin” ay likas sa modernong Filipino at nagpapanatili sa larawan ng lupang nasa labas.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: at ang lahat ng naroon
  rationale: Tapat nitong ipinahahayag na kasama sa pagbubunyi ang lahat ng nasa bukirin nang hindi nililimitahan kung ano ang mga iyon.
- source_word: אָז
  choice: saka
  rationale: 'Ipinakikita ng “saka” ang kasunod na galaw sa tula: kasunod ng pagbubunyi ng bukirin ay ang masayang tinig ng mga puno.'
- source_word: יְרַנְּנוּ
  choice: aawit sa galak
  rationale: Ang piel na pandiwa ay maaaring tumukoy sa matunog na sigaw o awit ng kagalakan. Ang “aawit sa galak” ay angkop sa patulang pagbibigay-katauhan sa mga puno, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: כָּל עֲצֵי יָעַר
  choice: ang lahat ng punongkahoy sa gubat
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at ang malinaw na larawan ng buong kagubatang nakikibahagi sa galak.
theological_decisions:
- issue: Pagbibigay-katauhan sa sangnilikha sa pagpupuri
  choice: Tuwirang panatilihin ang patulang larawan ng bukirin at mga punongkahoy na nagbubunyi at umaawit.
  alternative: Ipaliwanag ito bilang talinghaga lamang ng ganda o kasaganaan ng kalikasan.
  rationale: Mismong salmo ang naglalarawan sa di-pantaong sangnilikha bilang nakikibahagi sa masayang pagtugon. Ang tuwirang larawan ay nagpapanatili sa lawak ng pagpupuri ng sangnilikha nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal at patula ang wika. Ginamit ang “magbunyi” upang maipakita ang masidhing kagalakan at ang lakas ng paanyaya; ang “saka” ay malinaw at natural na pananda ng kasunod na kilos.
