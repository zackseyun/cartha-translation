  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang pambungad na pariralang nakaugnay sa naunang linya, ang inuulit na pagdating, ang layuning humatol, ang saklaw na “lupa/sanlibutan,” at ang magkatambal na katuwiran at katapatan. Ang “ayon sa” ay isang katanggap-tanggap at natural na paraan upang ipahayag ang pang-abay na בְ sa konteksto ng paghatol.'
