id: PSA.96.13
reference: Psalms 96:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: tl
  text: sa harap ni Yahweh[a], sapagkat dumarating siya, sapagkat dumarating siya upang hatulan ang lupa. Hahatulan niya ang sanlibutan ayon sa katuwiran, at ang mga bayan[b] ayon sa kanyang katapatan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay transliterasyon ng banal na pangalang יהוה (YHWH).
    reason: translation_clarity
  - marker: b
    text: Maaari ring “mga bansa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ayon sa kanyang katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Likas na katumbas sa Filipino ng idyomang nangangahulugang “before” o “in the presence of,” at angkop bago sa personal na pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng karaniwang transliterasyon, sa halip na palitan ito ng isang titulo.
- source_word: כִּי בָא ... כִּי בָא
  choice: sapagkat dumarating siya, sapagkat dumarating siya
  rationale: Ipinahahayag ng anyong Hebreo ang tiyak at nalalapit na pagdating. Pinananatili ang pag-uulit bilang makatang pagdidiin.
- source_word: לִשְׁפֹּט
  choice: upang hatulan
  rationale: Bagaman maaaring tumukoy ang ugat sa pamamahala, itinatampok ng kasunod na katuwiran at katapatan ang gawaing humahatol.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa parallelismo sa תֵּבֵל, pandaigdig ang saklaw; ang “lupa” ay natural at malawak ang kahulugan sa kontekstong ito.
- source_word: יִשְׁפֹּט
  choice: Hahatulan niya
  rationale: Ang imperpektibo ay likas na naghahayag dito ng gawaing darating matapos ipahayag ang kanyang pagdating.
- source_word: תֵּבֵל
  choice: ang sanlibutan
  rationale: Tumutukoy sa maayos o tinatahanang daigdig; ang “sanlibutan” ay dignified at malinaw na katumbas sa makatang konteksto.
- source_word: בְּצֶדֶק
  choice: ayon sa katuwiran
  rationale: Ipinahahayag ang matuwid na pamantayan o katangian ng paghatol. Mas natural ito sa Filipino kaysa sa literal na “sa pamamagitan ng katuwiran.”
- source_word: וְעַמִּים
  choice: at ang mga bayan
  rationale: Pinananatili ang maramihang kolektibong diwa ng עַמִּים nang hindi awtomatikong ginagawang mga estadong pampolitika.
- source_word: בֶּאֱמוּנָתוֹ
  choice: ayon sa kanyang katapatan
  rationale: Ang אֱמוּנָה ay nagpapahiwatig ng pagiging maaasahan, matatag, at tapat. Ang pariralang ito ay natural na inilalarawan ang pamantayan o katangian ng kanyang paghatol.
theological_decisions:
- issue: Kalikasan ng banal na paghatol sa makatang konteksto
  choice: Pinanatili ang salitang “hatulan” nang hindi pinahihina bilang simpleng pamamahala o pinalalawak bilang isang ganap na doktrina ng huling paghuhukom.
  alternative: Isalin bilang “pamahalaan,” o tahasang tukuyin bilang huling paghuhukom.
  rationale: Malinaw na ipinahahayag ng talata ang pandaigdig na paghatol ni Yahweh, ngunit hindi dapat dagdagan ng salin ang sinasabi ng Hebreo.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili nito ang pangalan sa tekstong pinagmulan sa halip na palitan ng titulo, nang walang pag-aangkin hinggil sa eksaktong sinaunang bigkas.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang makatang pag-uulit at ang pangkalahatang saklaw ng paghatol. Ginamit ang “sapagkat” para sa dignified na daloy at “ayon sa” upang natural na maipahayag sa Filipino ang pamantayan o katangian ng paghatol.
