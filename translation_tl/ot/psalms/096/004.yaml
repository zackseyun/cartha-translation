  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: tl
  text: Sapagkat dakila si Yahweh at lubos na dapat purihin; siya ay dapat katakutan nang higit kaysa sa lahat ng mga diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga diyos” ay maaaring tumukoy sa mga diyos ng mga bansa; sa kasunod na talata, inilalarawan ang mga iyon bilang mga walang kabuluhang diyus-diyosan.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang panawagan sa pagsamba at likas ang ganitong ugnayang paliwanag sa Tagalog.
- source_word: גָדוֹל
  choice: dakila
  rationale: Ipinahahayag nito ang kadakilaan sa katayuan at karangalan, hindi lamang ang kapangyarihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וּמְהֻלָּל מְאֹד
  choice: at lubos na dapat purihin
  rationale: Ang pasibong participle at pang-abay ay likas na naipahahayag sa Tagalog bilang papuring lubos na nararapat sa kaniya.
- source_word: נוֹרָא הוּא
  choice: siya ay dapat katakutan
  rationale: Pinananatili nito ang diwang siya ay pumupukaw ng takot na may paggalang, sa halip na pahinain iyon bilang paghanga lamang.
- source_word: עַל כָּל אֱלֹהִים
  choice: nang higit sa lahat ng mga diyos
  rationale: Ang עַל ay nagpapahayag dito ng paghahambing at pagiging nakahihigit; pinananatili ng 'mga diyos' ang tuwirang anyo ng Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang banal na pangalan, kaya pinananatili ito bilang pangalan at hindi pinapalitan ng titulo.
- issue: Kahulugan ng אֱלֹהִים sa konteksto
  choice: mga diyos
  alternative: mga diyus-diyosan
  rationale: Ang Hebreo ay nagsasabing 'mga diyos.' Bagaman inilalarawan sila ng kasunod na talata bilang walang kabuluhang mga diyus-diyosan, hindi iyon isiningit sa talatang ito.
- issue: Diwa ng נוֹרָא
  choice: dapat katakutan
  alternative: kasindak-sindak
  rationale: Pinananatili ng napiling salin ang ugnayang tugon ng may-paggalang na pagkatakot at ang teolohikal na tensiyon ng salita, nang hindi ito ginagawang simpleng paghanga o purong sindak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'dakila,' 'lubos na dapat purihin,' at 'dapat katakutan' upang mapanatili ang anyong papuri at may-paggalang na pagkatakot ng Hebreo. Inilagay ang kinakailangang panandang talababa pagkatapos ng 'mga diyos.'
