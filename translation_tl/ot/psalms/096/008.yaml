base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: tl
  text: Iukol ninyo kay Yahweh ang kaluwalhatiang nararapat sa kanyang pangalan; magdala kayo ng handog[a] at pumasok sa kanyang mga patyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaloob” o “tributo.” Ayon sa konteksto, ang salitang Hebreo ay maaaring tumukoy sa isang kaloob, tributo, o handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Iukol ninyo
  rationale: Sa pormulang ito ng pagpupuri, ang utos ay kilalanin at ibigay kay Yahweh ang karangalang nauukol sa kanya, hindi magbigay sa kanya ng isang bagay na kulang sa kanya. Likas sa modernong Tagalog ang “iukol” para sa ganitong diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang יהוה at pinananatili ang personal na pangalan ng Diyos sa teksto.
- source_word: כְּבוֹד שְׁמוֹ
  choice: ang kaluwalhatiang nararapat sa kanyang pangalan
  rationale: Ang כָּבוֹד ay kaluwalhatian o karangalang iniuukol kay Yahweh. Ginagawang malinaw ng “nararapat” ang idyomatikong ugnayan nang hindi ipinapahiwatig na may kulang sa Diyos; pinananatili naman ang literal na “kanyang pangalan.”
- source_word: שְׂאוּ
  choice: magdala kayo
  rationale: Bagaman pangunahing nangangahulugang “buhatin” o “dalhin,” kasama ng מִנְחָה ay natural itong tumutukoy sa pagdadala ng handog.
- source_word: מִנְחָה
  choice: handog
  rationale: 'Malawak ang saklaw ng salita: maaari itong tumukoy sa kaloob, tributo, o handog. Ang “handog” ang pinakanatural sa konteksto ng pagsamba nang hindi ito nililimitahan sa handog na butil.'
- source_word: וּבֹאוּ
  choice: at pumasok
  rationale: Ang pandiwa ay literal na “pumarito” o “dumating,” ngunit dahil ang patutunguhan ay mga looban ng santuwaryo, natural sa Tagalog ang “pumasok.”
- source_word: לְחַצְרוֹתָיו
  choice: sa kanyang mga looban
  rationale: Ang חֲצֵרוֹת ay tumutukoy sa mga bukás na looban o courtyard ng santuwaryo. Ang “mga looban” ay malinaw at marangal sa modernong Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Nasa Hebreong teksto ang Tetragrammaton bilang personal na pangalan. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng כְּבוֹד שְׁמוֹ
  choice: kaluwalhatiang nararapat sa kanyang pangalan
  alternative: kaluwalhatian ng kanyang pangalan
  rationale: Maaaring panatilihin nang mas literal ang pariralang “kaluwalhatian ng kanyang pangalan,” ngunit maaaring maging malabo iyon sa Tagalog. Ipinahahayag ng napiling anyo ang panawagang kilalanin ang kaluwalhatiang nauukol kay Yahweh, habang nananatili ang pagtukoy sa kanyang pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “ninyo/kayo” upang maipakita ang maramihang pautos sa Hebreo. Ang “mga looban” ay mas madaling maunawaan kaysa sa teknikal o sinaunang katawagan para sa mga courtyard ng templo.
