id: PSA.96.10
reference: Psalms 96:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: tl
  text: Sabihin ninyo sa gitna ng mga bansa, “Naghahari si Yahweh![a] Tunay na matatag ang daigdig[b]; hindi ito mayayanig. Hahatulan niya ang mga bayan nang may katarungan.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hari si Yahweh” o “Naging hari si Yahweh.” Maaaring unawain ang Hebreo bilang pahayag ng kasalukuyang pagkahari o ng pagluklok bilang hari.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “daigdig na tinitirhan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nang matuwid” o “nang patas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Sabihin ninyo
  rationale: Maramihang pautos ng אמר. Payak at tuwiran ito, habang ipinahihiwatig ng kasunod na parirala na hayagang ipapahayag ang mensahe.
- source_word: בַגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang ב ay tumutukoy sa larangan o kinalalagyan ng pagpapahayag, at pinananatili ng “mga bansa” ang pandaigdigang saklaw ng גּוֹיִם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מָלָךְ
  choice: Naghahari
  rationale: Natural na pahayag ito ng kasalukuyang paghahari sa konteksto ng salmong tungkol sa pagkahari, ngunit inilalahad sa talababa ang posibleng stative o ingressive na pagbasa.
- source_word: אַף
  choice: Tunay na
  rationale: Ipinahahayag nito ang mariing pagpapatibay at iniuugnay ang paghahari ni Yahweh sa katatagan ng daigdig.
- source_word: תִּכּוֹן
  choice: matatag
  rationale: Ipinahahayag ang resultang diwa ng Nifal ng כון—ang daigdig ay naitatag at nananatiling matibay—sa natural na Filipino.
- source_word: תֵּבֵל
  choice: daigdig
  rationale: Malinaw at marangal na katumbas ito ng mundong may kaayusan; inilalahad sa talababa ang mas tiyak na diwang “daigdig na tinitirhan.”
- source_word: בַּל תִּמּוֹט
  choice: hindi ito mayayanig
  rationale: Pinananatili nito ang patulang larawan ng isang bagay na hindi mapaaalis sa matatag nitong kalagayan.
- source_word: יָדִין
  choice: Hahatulan niya
  rationale: Pinananatili ang pangunahing hudisyal na diwa ng דין sa konteksto ng banal na pagkahari.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Pinananatili nito ang maramihang kolektibong diwa at ang pagkakaiba sa naunang גּוֹיִם, “mga bansa.”
- source_word: בְּמֵישָׁרִים
  choice: nang may katarungan
  rationale: Natural nitong ipinahahayag sa konteksto ng paghatol ang tuwid, patas, at walang-kinikilingang diwa ng מֵישָׁרִים.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Aspekto ng מָלָךְ sa pahayag tungkol sa pagkahari
  choice: Naghahari si Yahweh
  alternative: Hari si Yahweh; Naging hari si Yahweh
  rationale: Ang anyong qatal sa ganitong salmo ay maaaring magpahayag ng kasalukuyang pagkahari o ng pagluklok/pagsisimula ng paghahari. Pinili sa pangunahing teksto ang natural na kasalukuyang pahayag at pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa pampublikong pagbasa. Ginamit ang “sa gitna ng mga bansa” upang mapanatili ang lokatibong diwa, at “mga bayan” upang hindi mapatag ang pagkakaiba ng גּוֹיִם at עַמִּים. Inilagay ang bawat talababa kaagad pagkatapos ng salitang o sugnay na tinutukoy nito.
