id: PSA.6.8
reference: Psalms 6:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: tl
  text: Lumayo kayo sa akin, kayong lahat na gumagawa ng kasamaan,[a] sapagkat dininig ni Yahweh ang tinig ng aking pag-iyak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumagawa ng katiwalian” o, sa mas maikling anyo, “mga gumagawa ng masama.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang tinig/tunog ng aking pag-iyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Lumayo kayo sa akin
  rationale: Ang maramihang pautos na סוּרוּ ay tuwirang nagpapalayas o nagpapalayo sa mga kinakausap. Likas at mariin sa makabagong Tagalog ang “Lumayo kayo sa akin.”
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: kayong lahat na gumagawa ng kasamaan
  rationale: Pinananatili nito ang pagiging pangmaramihan at ang pandiwang larawan ng mga taong aktibong gumagawa ng אָוֶן. Ang “kasamaan” ay malinaw at dignified, bagaman maaaring saklawin ng אָוֶן ang kabulaanan, kapinsalaan, o katiwalian.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang utos. Ang “sapagkat” ay malinaw at angkop sa marangal na himig ng tula.
- source_word: שָׁמַע
  choice: dininig
  rationale: Ang ganap na pandiwa ay nagpapahayag ng natapos na pakikinig na mahalaga sa kasalukuyang pagtitiwala ng salmista. Ang “dininig” ay higit na nagpapahiwatig ng mapagtuong pakikinig kaysa sa payak na “narinig.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nang tuwiran ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: קוֹל בִּכְיִי
  choice: ang tinig ng aking pag-iyak
  rationale: Ang קוֹל ay maaaring “tinig” o “tunog,” at ang בִּכְיִי ay “aking pag-iyak/pagtangis.” Pinananatili ng salin ang audibleng larawan at ang anyong parirala ng Hebreo nang hindi ginagawang “mga luha,” na biswal ang diin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “ang PANGINOON.”
- issue: Saklaw ng אָוֶן
  choice: kasamaan
  alternative: katiwalian; kabulaanan; kapinsalaan
  rationale: Malawak ang semantikong saklaw ng אָוֶן. Ang “kasamaan” ay hindi nagpapasok ng isang makitid na doktrinal na pakahulugan at akma sa mga taong inuusig o sinasalungat ng salmista.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang makatang himig. Ginamit ang “kayo” upang maipakita ang maramihang pautos, at pinanatili ang personal at mariing tono ng salmista.
