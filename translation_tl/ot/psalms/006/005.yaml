source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: tl
  text: Sapagkat sa kamatayan ay walang pag-alaala sa iyo; sa Sheol[a], sino ang magpapasalamat sa iyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa libingan” o “sa daigdig ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng dahilan para sa naunang pagsusumamo, habang nananatiling natural at marangal sa tulang Tagalog.
- source_word: אֵין
  choice: walang
  rationale: Tuwirang ipinahahayag ng “walang” ang eksistensiyal na pagtanggi sa maikli at likas na paraan.
- source_word: בַּמָּוֶת
  choice: sa kamatayan
  rationale: 'Pinananatili nito ang lokatibong larawan at ang pagkakatulad ng dalawang hanay: “sa kamatayan” at “sa Sheol.”'
- source_word: זִכְרֶךָ
  choice: pag-alaala sa iyo
  rationale: Sinasaklaw ng “pag-alaala” ang diwa ng paggunita o pagbanggit nang hindi nililimitahan ang salita sa isa lamang sa mga kahulugang iyon.
- source_word: בִּשְׁאוֹל
  choice: sa Sheol
  rationale: Pinananatili ang natatanging katawagang Hebreo upang hindi ito paliitin sa “libingan” lamang o ipakahulugan ayon sa mas tiyak na makabagong konsepto.
- source_word: מִי
  choice: sino
  rationale: Likas at tuwirang katumbas para sa retorikal na tanong.
- source_word: יוֹדֶה לָּךְ
  choice: magpapasalamat sa iyo
  rationale: Tuwirang ipinapahayag nito ang karaniwang kahulugan ng ידה sa Hiphil; posible rin ang “pupuri sa iyo,” ngunit mas malinaw na napapanatili rito ang diwa ng pasasalamat.
theological_decisions:
- issue: Pagsasalin sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Ang transliterasyon ay nagpapanatili sa saklaw at tensiyong teolohikal ng konseptong Hebreo nang hindi ito awtomatikong itinutumbas sa isang pisikal na libingan o sa mas huling doktrina tungkol sa kabilang-buhay.
- issue: Kawalan ng pag-alaala at pasasalamat sa kamatayan
  choice: Pinanatili bilang pahayag at retorikal na tanong ng makata
  alternative: Ipaliwanag bilang ganap na doktrinang metapisikal tungkol sa kalagayan ng mga patay
  rationale: Hindi dinaragdagan ng salin ang sinasabi ng panaghoy. Pinananatili nito ang argumento ng makata sa konteksto ng pagsamba at pag-alaala nang hindi tahimik na nilulutas ang mas malawak na tanong tungkol sa kabilang-buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang bahagyang makatang ayos na “sa kamatayan ay” upang mapanatili ang paralelismo sa “sa Sheol,” ngunit iniwasan ang lipas o labis na pormal na pananalita.
