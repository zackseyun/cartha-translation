id: PSA.6.2
reference: Psalms 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: tl
  text: Kaawaan mo ako[a], Yahweh, sapagkat nanghihina ako[b]; pagalingin mo ako, Yahweh, sapagkat nanginginig ang aking mga buto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pagpakitaan mo ako ng kagandahang-loob” o “Pagkalooban mo ako ng pabor.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nangayayat ako” o “nanlulupaypay ako”; inilalarawan ng Hebreo ang pagkaubos ng lakas o matinding panghihina.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nababagabag ang aking mga buto” o “nangagigimbal ang aking mga buto.” Ang “mga buto” ay maaaring magpahayag ng matinding paghihirap ng buong katawan o kaibuturan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kaawaan mo ako
  rationale: Ang pautos na anyo ng חנן ay pakiusap na pagpakitaan ng kagandahang-loob o pabor. Ang “Kaawaan mo ako” ang pinakanatural at marangal na pakiusap sa modernong Tagalog, habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי sa dalawang pagkakataon ang dahilan o batayan ng bawat pakiusap; malinaw at angkop sa dignidad ng panulaan ang “sapagkat.”
- source_word: אֻמְלַל
  choice: nanghihina
  rationale: Ipinahihiwatig ng salita ang kalagayan ng panghihina, pagkapayat, o unti-unting pagkaubos ng lakas. Natural sa Tagalog ang “nanghihina” at hindi nito nililimitahan ang diwa sa isang tiyak na karamdaman.
- source_word: רְפָאֵנִי
  choice: pagalingin mo ako
  rationale: Tuwirang ipinapahayag ng רפא ang pagpapagaling. Pinananatili ng salin ang tuwirang pakiusap at maaaring saklawin ang pisikal at buong-katauhang paghihirap.
- source_word: נִבְהֲלוּ
  choice: nanginginig
  rationale: Maaaring tumukoy ang בהל sa pagkagimbal, pagkabalisa, o pagkataranta. Sa mga buto bilang simuno, malinaw na naipadarama ng “nanginginig” ang matinding pisikal o panloob na pagkabagabag, habang kinikilala sa talababa ang ibang posibleng pagbasa.
- source_word: עֲצָמָי
  choice: aking mga buto
  rationale: Pinananatili ang literal at makapangyarihang larawan ng Hebreo. Sa panulaang Hebreo, maaari rin itong kumatawan sa buong katawan o sa kaibuturan ng tao.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; o ang pamalit na titulong “PANGINOON”
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang nasa Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng pakiusap na חָנֵּנִי
  choice: Kaawaan mo ako
  alternative: Pagpakitaan mo ako ng kagandahang-loob
  rationale: Hindi nilulutas ng salin ang pakiusap bilang isang teknikal na doktrina ng biyaya. Ang pangunahing teksto ay gumagamit ng natural na pananalita, at pinananatili ng talababa ang diwa ng pabor o kagandahang-loob.
- issue: Kalikasan ng paghihirap na inilalarawan ng “mga buto”
  choice: Pinanatili ang literal na “aking mga buto”
  alternative: aking buong katawan; aking kaibuturan
  rationale: Maaaring pisikal at/o panloob ang paghihirap. Ang literal na larawan ay nagpapanatili sa sadyang lawak at tensiyon ng tula sa halip na magtakda ng iisang uri ng karamdaman.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang tuwirang mga pautos na pakiusap at pinanatili ang paralelismo, pag-uulit ng “Yahweh,” at konkretong larawang “mga buto.”
