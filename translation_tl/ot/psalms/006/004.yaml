  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: tl
  text: Bumalik ka, O Yahweh; iligtas mo ang buhay ko; sagipin mo ako alang-alang sa iyong tapat na pag-ibig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: Bumalik ka
  rationale: Tuwirang pinananatili ang panawagan sa Diyos na muling lumapit o kumilos para sa salmista, nang hindi dinaragdagan ang di-tahasang layon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: חַלְּצָה נַפְשִׁי
  choice: iligtas mo ang buhay ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong sarili ng nagsasalita, hindi lamang sa isang hiwalay na espirituwal na 'kaluluwa'; ang חַלֵּץ ay pagliligtas o paghango mula sa panganib.
- source_word: הוֹשִׁיעֵנִי
  choice: sagipin mo ako
  rationale: Nagbibigay ng natural na Filipino at bahagyang leksikal na pagkakaiba sa naunang חַלְּצָה habang pinananatili ang magkatulad na pakiusap para sa pagliligtas.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: dahil sa iyong tapat na pag-ibig
  rationale: Ipinahahayag ang batayan ng pakiusap; ang חֶסֶד ay matatag, tapat, at may-pagtipang pag-ibig, na natural na naisasalin bilang 'tapat na pag-ibig.'
theological_decisions:
- issue: Batayan ng pagliligtas
  choice: dahil sa iyong tapat na pag-ibig
  alternative: alang-alang sa iyong tapat na pag-ibig
  rationale: Pinananatiling nakabatay ang pakiusap sa sariling חֶסֶד ng Diyos, hindi sa merito ng salmista. Ang 'dahil sa' ay malinaw at natural, samantalang maaari ring ipahayag ng 'alang-alang sa' ang layon o konsiderasyon.
- issue: Kahulugan ng נַפְשִׁי
  choice: ang buhay ko
  alternative: ang kaluluwa ko / ako
  rationale: Ang konteksto ng panganib at pagliligtas ay pumapabor sa 'buhay ko,' ngunit saklaw rin ng salitang Hebreo ang buong sarili; hindi ito ginawang teknikal na pahayag tungkol sa komposisyon ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tatlong pautos na pakiusap at ang maikli, apurahang ritmo ng Hebreo; ginamit ang 'O Yahweh' bilang taimtim na tuwirang pagtawag.
