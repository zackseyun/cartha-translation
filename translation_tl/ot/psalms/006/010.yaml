  text: Mapahiya at lubhang masindak ang lahat ng aking kaaway[a]; tumalikod sila at biglang mapahiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malagay sa kahihiyan at lubhang matakot … bumalik at biglang malagay sa kahihiyan.”
