lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mapahiya
  rationale: Pinananatili nito ang diwa ng kahihiyan o pagkakalagay sa kahihiyan ng בוש, at ang anyong pakiusap o hangarin ng patula at jussive na konteksto.
- source_word: וְיִבָּהֲלוּ
  choice: at lubhang matakot
  rationale: Ang בהל ay nagsasaad ng matinding takot o pagkasindak; natural sa modernong Tagalog ang 'lubhang matakot' kasabay ng מְאֹד.
- source_word: מְאֹד
  choice: lubhang
  rationale: Tuwirang pang-abay na nagpapasidhi at angkop sa marangal na register ng salmo.
- source_word: כָּל אֹיְבָי
  choice: ang lahat ng aking kaaway
  rationale: Tumpak at natural na salin ng construct na may hulaping panghalip.
- source_word: יָשֻׁבוּ
  choice: umurong sila
  rationale: Sa konteksto ng mga kaaway, ipinahihiwatig ng שׁוב ang pagtalikod o pag-atras; malinaw ang 'umurong' nang hindi labis na nagdaragdag ng imaheng militar.
- source_word: יֵבֹשׁוּ
  choice: mapahiya
  rationale: Inuulit ang salitang ginamit sa unang sugnay upang mapanatili ang patulang pag-uulit ng Hebreo.
- source_word: רָגַע
  choice: biglang
  rationale: Ginagamit dito bilang pang-abay na nagsasaad ng dagliang pangyayari; natural at tuwiran ang 'biglang' sa Tagalog.
