  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: tl
  text: At ang kaluluwa[a] ko ay lubhang nababagabag[b]. Ngunit ikaw[c], Yahweh[d]—hanggang kailan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong נֶפֶשׁ ay maaari ding tumukoy sa “buhay ko” o “ako mismo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lubhang nasisindak” o “lubhang nagugulumihanan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “at ikaw”; ginamit ang “ngunit ikaw” upang maipakita ang biglang pagbaling ng panaghoy.
    reason: lexical_alternative
  - marker: d
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: At ang kaluluwa ko
  rationale: Pinananatili ng “kaluluwa” ang malawak na diwa ng נֶפֶשׁ bilang panloob na sarili, buhay, o mismong pagkatao. Ang “At” ay kumakatawan sa panandang pang-ugnay na וְ.
- source_word: נִבְהֲלָה מְאֹד
  choice: ay lubhang nababagabag
  rationale: Ang נבהל ay maaaring mangahulugang lubhang magulumihanan, masindak, o mabalisa; ipinahahayag ng “lubhang nababagabag” ang matinding ligalig nang hindi nililimitahan ang salita sa takot lamang. Isinasalin ng “lubhang” ang pampalakas na מְאֹד.
- source_word: וְאַתָּה
  choice: Ngunit ikaw
  rationale: Bagaman literal na “at ikaw,” ipinahihiwatig ng pang-ugnay sa konteksto ang biglang pagbaling mula sa paghihirap ng nagsasalita tungo sa tuwirang pagsamo sa Diyos; natural itong naipahahayag ng “Ngunit ikaw.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang katawanin ang personal na pangalang YHWH sa tekstong Hebreo, sa halip na palitan ito kaagad ng isang titulo.
- source_word: עַד מָתָי
  choice: hanggang kailan?
  rationale: Ito ang likas na katumbas sa Filipino ng karaniwang pormula ng panaghoy sa Hebreo at pinananatili ang bigat at pagkaapurahan ng tanong.
theological_decisions:
- issue: Paglalarawan sa נֶפֶשׁ
  choice: kaluluwa
  alternative: buhay ko / ako mismo
  rationale: Hindi nilulutas ng salin ang נֶפֶשׁ bilang hiwalay at di-materyal na bahagi lamang ng tao; inilalahad sa talababa ang posibleng diwang “buhay” o “sarili” upang mapanatili ang lawak ng salitang Hebreo.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pangalan ang nasa Hebreo. Pinananatili sa teksto ang anyong “Yahweh,” habang kinikilala sa talababa ang tradisyonal na pamalit na titulong “PANGINOON,” nang hindi nag-aangkat ng natatanging doktrinang denominasyonal.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinili ang “ko ay” sa halip na pinaikling “ko’y” para sa malinaw at payak na pagbasa. Ang em dash bago ang tanong ay nagpapanatili sa biglang pagkaputol at hindi natapos na pagsamo ng Hebreo.
