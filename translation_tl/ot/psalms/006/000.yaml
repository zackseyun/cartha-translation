  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: tl
  text: 'Para sa direktor ng musika: sa saliw ng mga instrumentong de-kuwerdas, ayon sa Sheminith[a]. Isang salmo ni David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Sheminith, na maaaring mangahulugang “ang ikawalo,” isang ayos sa oktaba, o isang instrumentong may walong kuwerdas.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang salmo na nauugnay kay David” o “isang salmo para kay David”; maaaring magpahiwatig ang Hebreo ng pagkakatha o iba pang kaugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa direktor ng musika
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Malinaw at natural sa modernong Filipino ang “direktor ng musika.”
- source_word: בִּנְגִינוֹת
  choice: sa saliw ng mga instrumentong de-kuwerdas
  rationale: Tumutukoy ang salita sa musikang tinutugtog sa mga instrumentong may kuwerdas. Ipinahahayag ng “sa saliw” ang gamit na musikal nang hindi labis na tinutukoy ang paraan ng pagtugtog.
- source_word: עַל
  choice: ayon sa
  rationale: Sa isang pamagat na musikal, maaari nitong ipakilala ang himig, estilo, o takdang paraan ng pagtugtog. Iniiwasan ng “ayon sa” ang pagpapasyang isa lamang itong pisikal na instrumento.
- source_word: הַשְּׁמִינִית
  choice: Sheminith
  rationale: Hindi tiyak ang teknikal na kahulugan ng terminong Hebreo. Pinananatili ang transliterasyon upang hindi magbigay ng huwad na katiyakan; ipinaliliwanag sa talababa ang mga posibilidad.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ito ang karaniwang katawagan sa isang awit na inilaan para sa musikal na pagtatanghal, at “salmo” ang kinikilalang katumbas sa Filipino.
- source_word: לְדָוִד
  choice: ni David
  rationale: Natural na anyo ito sa pamagat ng salmo sa Filipino. Dahil maaaring magpahiwatig ang pang-ukol na Hebreo ng pagkakatha, pag-uugnay, o paglalaan, nililinaw sa talababa ang saklaw ng kahulugan.
theological_decisions:
- issue: Pagkakatha o pagkakaugnay na ipinahihiwatig ng לְדָוִד
  choice: Isang salmo ni David
  alternative: Isang salmo na nauugnay kay David; isang salmo para kay David
  rationale: Pinananatili sa maikli at natural na anyo ang tradisyonal na pamagat, ngunit hindi itinuturing na tanging posibleng kahulugan ang tuwirang pagkakatha ni David. Inilalahad sa talababa ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “instrumentong de-kuwerdas” bilang pamilyar na terminong musikal, at pinanatili ang hindi tiyak na teknikal na katawagang “Sheminith” na may paliwanag sa talababa.
