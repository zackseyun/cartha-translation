  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: tl
  text: 'Dininig ni Yahweh ang pagsusumamo ko;

    tatanggapin ni Yahweh ang panalangin ko.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “kukunin.”'
    reason: Ipinababatid ang pangunahing kahulugan ng pandiwang Hebreo habang ginagamit sa teksto ang mas likas na “tatanggapin” ayon sa konteksto.
lexical_decisions:
- source_word: שָׁמַע
  choice: dininig
  rationale: Ipinahahayag ng aspektong qatal na natapos na ang pagdinig at may bisa ito sa kasalukuyan. Likas sa Filipino ang “dininig” para sa panalanging pinakinggan at pinagtuunan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: תְּחִנָּתִי
  choice: ang pagsusumamo ko
  rationale: Ang תְּחִנָּה ay taimtim na paghingi ng awa o pabor. Napananatili ng “pagsusumamo” ang tindi nito at naihihiwalay ito sa karaniwang salitang “panalangin” sa kasunod na linya.
- source_word: תְּפִלָּתִי
  choice: ang panalangin ko
  rationale: Ito ang natural at karaniwang katumbas sa Filipino ng pangkalahatang salitang Hebreo para sa panalangin.
- source_word: יִקָּח
  choice: tatanggapin
  rationale: Bagaman pangunahing nangangahulugang “kukunin” ang לָקַח, ang diwa nito kapag panalangin ang layon ay tatanggapin iyon. Pinananatili ng anyong panghinaharap ang pagtitiwala ng salmista nang hindi ginagawang tahasang “sasagutin.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng pagtanggap sa panalangin
  choice: tatanggapin ang panalangin
  alternative: sasagutin ang panalangin
  rationale: Hindi tahasang sinasabi ng pandiwang לָקַח na ibibigay ang hinihinging sagot. Ang “tatanggapin” ay nagpapanatili sa saklaw at bahagyang talinghaga ng orihinal.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang magkatulad na dalawang linya upang mapanatili ang paralelismo ng Hebreo, at sadyang pinag-iba ang “pagsusumamo” at “panalangin.”
