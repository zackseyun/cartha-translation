id: PSA.6.1
reference: Psalms 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: tl
  text: 'O Yahweh, huwag mo akong sawayin sa iyong galit,

    at huwag mo akong disiplinahin sa iyong poot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Pinanatili ang pangalang tipan na Yahweh; ang “O” ay natural at marangal na panandang pantawag sa isang makatang panalangin.
- source_word: אַל
  choice: huwag
  rationale: Tuwirang ipinapahayag ang pakiusap na negatibo kasama ng kasunod na pandiwa.
- source_word: בְּאַפְּךָ
  choice: sa iyong galit
  rationale: Ang אַף ay literal na “ilong” ngunit idyomatikong tumutukoy sa galit; natural sa Filipino ang “sa iyong galit.”
- source_word: תוֹכִיחֵנִי
  choice: sawayin mo ako
  rationale: Ang Hiphil ng יכח ay nangangahulugang sumaway o pumuna upang ituwid; malinaw at angkop sa kasalukuyang Filipino ang “sawayin.”
- source_word: וְאַל
  choice: at huwag
  rationale: Pinananatili ang pang-ugnay at ang magkatugmang kayarian ng dalawang linya.
- source_word: בַּחֲמָתְךָ
  choice: sa iyong poot
  rationale: Ang חֵמָה ay matinding nag-aalab na galit; ang “poot” ay marangal at naiiba sa unang terminong “galit.”
- source_word: תְיַסְּרֵנִי
  choice: disiplinahin mo ako
  rationale: Ang Piel ng יסר ay tumutukoy sa pagdidisiplina o pagtutuwid, hindi kinakailangang sa pagpaparusa lamang; malinaw ito sa modernong Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasan sa Hebreo ang Tetragrammaton; ang “Yahweh” ay mas malapit sa malawak na tinatanggap na rekonstruksiyon ng bigkas at pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Pagkakaiba ng dalawang katawagan sa banal na pagkagalit
  choice: galit / poot
  alternative: galit / matinding galit
  rationale: Pinananatili ang magkaugnay ngunit magkaibang אַף at חֵמָה, pati ang poetikong paralelismo, nang hindi ipinapalagay na lubos na magkaiba ang kahulugan ng mga ito.
- issue: Saklaw ng pagtutuwid sa תְיַסְּרֵנִי
  choice: disiplinahin mo ako
  alternative: parusahan mo ako
  rationale: Hindi nililimitahan ng salitang Hebreo ang kilos sa kaparusahan lamang; maaaring kabilang dito ang pagtutuwid sa pamamagitan ng disiplina.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong panalangin. Pinanatili ang balanseng paralelismo ng dalawang sugnay at ang bahagyang pagkakaiba ng “galit” at “poot.”
