translation:
  language: tl
  text: Humina ang aking mata dahil sa dalamhati[a]; tumanda ito dahil sa lahat ng kaaway ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nanlalabo ang aking mata dahil sa pagkayamot; nanghihina ito dahil sa lahat ng mga kalaban ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: Nanghihina
  rationale: Ipinahahayag ng pandiwa ang panghihina o unti-unting pagkasira. Sa mata bilang simuno, likas sa Filipino ang “nanghihina” at hindi nito nililimitahan ang larawan sa paglabo lamang.
- source_word: מִכַּעַס
  choice: sa dalamhati
  rationale: Maaaring tumukoy ang כַּעַס sa hinagpis, pagkayamot, o galit. Ang “dalamhati” ay angkop sa konteksto ng personal na panaghoy, habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: עֵינִי
  choice: ang aking mata
  rationale: Isahan ang anyong Hebreo, kaya pinanatili ang “mata” sa halip na gawing maramihan.
- source_word: עָתְקָה
  choice: nalalabo ito
  rationale: Ang pandiwa ay literal na maaaring mangahulugang tumanda at, sa kontekstong ito, mawalan ng lakas o masira. Para sa mata, malinaw at likas na naihahatid ng “nalalabo” ang bunga nito, samantalang inilalagay sa talababa ang mas pormal na larawang “naluma.”
- source_word: בְּכָל
  choice: dahil sa lahat ng
  rationale: Ipinahahayag dito ng pang-ukol ang sanhi o dahilan ng kalagayan ng mata; natural itong isinasalin na “dahil sa lahat ng.”
- source_word: צוֹרְרָי
  choice: aking mga kaaway
  rationale: Tumutukoy ang participle sa mga taong laban o mapaniil sa nagsasalita. Ang “mga kaaway” ang pinakanatural at sapat na matinding katumbas sa makabagong Filipino.
