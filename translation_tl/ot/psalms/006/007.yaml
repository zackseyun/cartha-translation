translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang isahang “mata” at ang paralelismong naglalarawan sa pisikal na epekto ng matinding emosyon; iniwasan ang sobrang literal ngunit di-likas na “tumanda ang mata” sa pangunahing teksto.
