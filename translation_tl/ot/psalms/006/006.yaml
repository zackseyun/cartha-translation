lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Pagod na ako
  rationale: Ipinahahayag ng pandiwa ang kalagayan ng matinding pagkapagod na bunga ng patuloy na paghihirap; natural sa modernong Tagalog ang “Pagod na ako.”
- source_word: בְּאַנְחָתִי
  choice: sa aking pagdaing
  rationale: Maaaring tumukoy ang אַנְחָה sa pagdaing o pagbubuntong-hininga. Pinananatili ng “pagdaing” ang tinig ng panaghoy at ang ugnayang ipinahihiwatig ng pang-ukol.
- source_word: בְכָל לַיְלָה
  choice: gabi-gabi
  rationale: Pinakamalinaw nitong ipinahahayag ang paulit-ulit na pangyayari sa bawat gabi, sa halip na ang tagal lamang ng isang gabi.
- source_word: אַשְׂחֶה
  choice: binabaha ko ng luha
  rationale: Ang Hiphil ay literal na nagpapahiwatig ng pagpapalutang sa higaan. Ang “binabaha ko ng luha” ay natural na matalinghagang Tagalog na nagpapanatili sa pagmamalabis at lakas ng larawan.
- source_word: מִטָּתִי
  choice: aking higaan
  rationale: Ang “higaan” ay malinaw at karaniwang katumbas ng מִטָּה bilang lugar ng pagtulog.
- source_word: בְּדִמְעָתִי
  choice: sa aking mga luha
  rationale: Ipinakikita rito ang luha bilang paraang ginagamit sa lubos na pagbasa sa pahingahan. Ginawang maramihan sa Tagalog upang maging natural, bagaman kolektibong isahan ang anyong Hebreo.
- source_word: עַרְשִׂי
  choice: aking pahingahan
  rationale: Pinananatili ng “pahingahan” ang pagkakaiba nito sa naunang מִטָּה at ang lexical variation ng parallelism, nang hindi gumagamit ng lipas o labis na tiyak na salita.
- source_word: אַמְסֶה
  choice: binabasa kong lubos
  rationale: Literal itong maaaring mangahulugang pinatutunaw o nilulusaw, ngunit sa konteksto ay matalinghagang lubos na pagbabasa sa luha. Malinaw sa Tagalog ang “binabasa kong lubos” habang nananatili ang tindi.
