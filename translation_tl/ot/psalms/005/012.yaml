source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: tl
  text: Sapagkat ikaw, Yahweh, ay nagpapala sa matuwid; gaya ng kalasag, pinalilibutan mo siya ng iyong lingap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “pinuputungan mo siya ng iyong lingap na gaya ng kalasag.” Ang pandiwang Hebreo ay maaaring mangahulugang “putungan” o “palibutan”; ang larawan ng kalasag ay umaangkop sa pagpaligid na nagbibigay-proteksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o batayan ng naunang panalangin at pagtitiwala; pinananatili ng “Sapagkat” ang ugnayang ito.
- source_word: תְּבָרֵךְ
  choice: pinagpapala mo
  rationale: Ang imperfect ay maaaring magpahayag ng palagian o tiyak na pagkilos ng Diyos. Likas sa Tagalog ang pangkasalukuyang anyong ito para sa gayong katiyakan.
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Ang pang-isahang pang-uri ay ginagamit bilang pangngalan para sa kinatawang taong matuwid o sa uring kinabibilangan niya. Pinananatili ng “ang matuwid” ang pagiging pangkalahatan nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na nakasaad sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: כַּצִּנָּה
  choice: gaya ng kalasag
  rationale: Malinaw na paghahambing ang prefiks na כְּ. Maaaring tumukoy ang צִנָּה sa malaking kalasag, ngunit sapat at natural ang “kalasag” sa pangunahing teksto.
- source_word: רָצוֹן
  choice: lingap
  rationale: Tumutukoy ito sa mabuting kalooban at pagpapabor ng Diyos. Ang “lingap” ay likas, marangal, at angkop sa larawan ng mapag-ingat na proteksiyon.
- source_word: תַּעְטְרֶנּוּ
  choice: pinalilibutan mo siya
  rationale: Bagaman maaari itong mangahulugang “pinuputungan,” itinuturo ng larawan ng kalasag ang pag-ikot o pagpaligid bilang proteksiyon. Pinananatili sa talababa ang ibang posibleng kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa natatanging pangalang tipan nang hindi ito ginagawang titulong “Panginoon.”
- issue: Ugnayan ng lingap at proteksiyon
  choice: Ang lingap ng Diyos ay inilalarawang pumapaligid sa matuwid na gaya ng kalasag.
  alternative: Ang matuwid ay pinupuputungan ng lingap na gaya ng kalasag.
  rationale: Ang larawan ng kalasag ay mas natural na nagpapahiwatig ng mapag-ingat na pagpaligid, ngunit hindi inaalis ang leksikal na posibilidad na “pinuputungan.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “O Yahweh” bilang malinaw na pantawag, at ang payak na “ang matuwid” upang manatiling pangkalahatan ang kinakatawang tao nang hindi nililimitahan sa isang partikular na indibidwal.
