id: PSA.5.8
reference: Psalms 5:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: tl
  text: Yahweh, akayin mo ako sa iyong katuwiran dahil sa aking mga kaaway[a]; gawin mong tuwid sa harap ko ang iyong daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa mga nagmamatyag sa akin” o “dahil sa mga nag-aabang sa akin”; maaaring tumukoy ang salitang Hebreo sa mga kaaway na may masamang layuning nagmamasid.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gawin mong patag sa harap ko ang iyong landas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang pangalang Yahweh bilang tuwirang transliterasyon ng banal na pangalan sa Hebreo; ang pagtawag ay likas nang ipinahihiwatig ng tuwirang pananalita.
- source_word: נְחֵנִי
  choice: akayin mo ako
  rationale: Tuwirang ipinahahayag ng pandiwang נחה ang pangunguna o paggabay; natural sa Filipino ang “akayin mo ako” sa konteksto ng panalangin.
- source_word: בְצִדְקָתֶךָ
  choice: sa iyong katuwiran
  rationale: Pinananatili nito ang malawak na diwa ng צדקה bilang matuwid na katangian at pamantayan ng Diyos, nang hindi ito nililimitahan sa hudisyal na katarungan lamang.
- source_word: לְמַעַן
  choice: dahil sa
  rationale: Sa konteksto, ipinakikilala nito ang kalagayang dulot ng mga kalaban bilang dahilan ng kahilingan; malinaw at natural ang “dahil sa.”
- source_word: שׁוֹרְרָי
  choice: aking mga kaaway
  rationale: Ito ang malinaw na kahulugan sa konteksto, habang inilalagay sa talababa ang posibleng mas tiyak na diwa ng mga kaaway na nagmamatyag o nag-aabang.
- source_word: הושר
  choice: gawin mong tuwid
  rationale: Ang causative na anyo ng ישר ay maaaring mangahulugang gawing tuwid o patag. Pinananatili ng “gawin mong tuwid” ang metapora ng isang malinaw at wastong landas.
- source_word: לְפָנַי
  choice: sa harap ko
  rationale: Karaniwan at tuwirang katumbas ito ng pariralang Hebreo.
- source_word: דַּרְכֶּךָ
  choice: iyong daan
  rationale: Ang “daan” ay nagpapanatili sa sabay na literal at metaporikal na diwa ng דרך bilang landas o paraan ng pamumuhay.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng צדקה sa talatang ito
  choice: katuwiran
  alternative: katarungan
  rationale: Ang panalangin ay humihingi ng paggabay na naaayon sa matuwid na katangian ng Diyos. Mas malawak ang “katuwiran” kaysa sa tiyak na diwang hudisyal ng “katarungan” at pinananatili nito ang teolohikal na tensiyon ng salita.
translation_notes:
  register: Makabago ngunit marangal na Filipino, angkop sa panalangin at tulang Hebreo. Pinanatili ang maikli at tuwirang anyo ng dalawang pakiusap, pati ang metapora ng paggabay at daan.
