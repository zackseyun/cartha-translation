  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: tl
  text: Sapagkat ikaw ay hindi Diyos na nalulugod sa kasamaan; hindi maaaring manirahan sa piling mo ang masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi maaaring manirahan sa piling mo ang kasamaan”; maaari ring tumukoy sa “taong masama” o “gumagawa ng masama.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pakiusap at natural na nag-uugnay sa daloy ng pangangatwiran ng salmo.
- source_word: אֵל
  choice: Diyos
  rationale: Tumutukoy sa tunay na Diyos na tuwirang kinakausap; ito ang likas at marangal na salin sa Tagalog.
- source_word: חָפֵץ
  choice: nalulugod sa
  rationale: Ipinahahayag nito ang pagkakaroon ng kasiyahan o pagsang-ayon, hindi lamang simpleng pagnanais.
- source_word: רֶשַׁע
  choice: kasamaan
  rationale: Abstraktong pangngalan ito para sa moral na kasamaan o kabuktutan; malinaw at natural ang “kasamaan” sa modernong Tagalog.
- source_word: יְגֻרְךָ
  choice: hindi maaaring manirahan sa piling mo
  rationale: Ang pandiwang גור ay tumutukoy sa pansamantalang paninirahan o panunuluyan. Inihahatid ng parirala ang diwa ng hindi pagtanggap sa presensiya ng Diyos nang hindi nagiging labis na teknikal.
- source_word: רָע
  choice: ang masama
  rationale: Maaaring tumukoy ang substantibong anyo sa kasamaan o sa isang masamang tao. Pinili ang sadyang maikling “ang masama,” na likas sa Tagalog at nagpapanatili ng ilang kalabuan kung tao ba o kasamaan ang tinutukoy.
theological_decisions:
- issue: Kung ang רָע ay abstraktong “kasamaan” o personal na “masamang tao”
  choice: ang masama
  alternative: ang kasamaan / ang taong masama / ang gumagawa ng masama
  rationale: Kayang tumukoy ng Hebreo kapuwa sa masama bilang konsepto at sa masamang tao. Ang “ang masama” sa Tagalog ay maaaring marinig bilang substantibong moral na katangian o bilang isang taong masama, kaya hindi nito tahimik na nilulutas ang tunay na kalabuan ng teksto. Nililinaw sa talababa ang dalawang posibilidad.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “sa piling mo” upang natural na ihayag ang paninirahan o panunuluyan kasama ng Diyos, habang pinanatili ng “ang masama” at ng talababa ang kalabuan ng Hebreo.
