id: PSA.5.1
reference: Psalms 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: tl
  text: 'Pakinggan mo ang aking mga salita, Yahweh;

    unawain mo ang aking daing.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking pagbubulay-bulay” o “aking mahinang pag-ungol.” Ang salitang Hebreo ay maaaring tumukoy sa panloob na pagninilay o sa mahinang pagbigkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: aking mga salita
  rationale: Tuwirang inilalarawan ng pangmaramihang anyo na may hulaping unang panauhan ang mga salitang sinasabi ng mang-aawit.
- source_word: הַאֲזִינָה
  choice: Pakinggan mo
  rationale: Isang taimtim na pakiusap na makinig nang mabuti; natural ito sa modernong Tagalog at hindi kasing patalinghaga ng literal na “ikiling ang tainga.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בִּינָה
  choice: unawain mo
  rationale: 'Pinananatili ang diwang kognitibo ng pandiwang בין: hinihiling ng mang-aawit na maunawaan o matalos ng Diyos ang kaniyang ipinahahayag.'
- source_word: הֲגִיגִי
  choice: aking daing
  rationale: Maaaring tumukoy ang salita sa pagbubulay, mahinang pag-ungol, o pabulong na pagbigkas. Sa konteksto ng panaghoy, natural na ipinahahayag ng “daing” ang masidhing panloob o mahinang tinig nang hindi isinasara ang ibang posibilidad, na inilalahad sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasan ang personal na pangalan sa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Saklaw ng הֲגִיגִי
  choice: aking daing
  alternative: aking pagbubulay-bulay; aking mahinang pag-ungol
  rationale: Ang konteksto ng panalanging-panaghoy ay umaayon sa “daing,” ngunit hindi tiyak na iisang emosyonal na kahulugan lamang ang salita; kaya pinananatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal at angkop sa panalangin. Ginamit ang “Pakinggan mo” bilang natural na katumbas ng Hebreong idyoma, at pinanatili ang “Yahweh” bilang personal na pangalan. Ang hati ng mga linya ay sumusunod sa paralelismo ng taludtod.
