  source_fidelity: Tumpak ang salin sa Hebreong superskripsiyon. Ang “Para sa tagapangasiwa ng awitan” ay angkop para sa לַמְנַצֵּחַ; pinananatili ng “ayon sa” ang teknikal ngunit di-ganap na tiyak na gamit ng אֶל; at ang “mga plauta” ay isang makatwirang pangunahing salin ng הַנְּחִילוֹת na may maayos na talababa para sa kawalang-katiyakan. Ang “Isang salmo ni David” ay tapat sa מִזְמוֹר לְדָוִד at hindi sapilitang inaangking si David ang may-akda.
