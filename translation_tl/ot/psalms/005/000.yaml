  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: ayon sa mga plauta[a]. Isang salmo ni David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa mga instrumentong hinihipan.” Hindi tiyak ang kahulugan ng terminong Hebreo; maaaring isa itong teknikal na tagubiling musikal at tradisyonal din itong hindi isinasalin bilang “Nehilot.”
    reason: lexical_alternative
  - marker: b
    text: Ang pamagat na “ni David” ay maaaring magpahiwatig ng pag-akda, pag-aalay sa kaniya, pagkakaugnay sa kaniya, o pagkabilang sa koleksiyong Davidiko.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa musikal na pagtatanghal. Likas sa makabagong Tagalog ang “tagapangasiwa ng awitan” at hindi nito ipinapalagay na koro lamang ang sangkot.
- source_word: אֶל
  choice: ayon sa
  rationale: Sa teknikal na gamit nito sa mga pamagat na musikal, maaaring ipakilala ng אֶל ang himig, paraan ng pagtugtog, o instrumentasyon. Pinananatili ng “ayon sa” ang lawak na ito.
- source_word: הַנְּחִילוֹת
  choice: mga plauta
  rationale: Malamang na tumutukoy ang di-tiyak na terminong musikal na ito sa mga plauta o iba pang instrumentong hinihipan. Ginamit sa teksto ang mas tradisyonal at tiyak na “mga plauta,” habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Ang “salmo” ang kinikilalang katumbas sa kontekstong kanonikal at angkop sa isang awiting nilalayong tugtugin.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang “ni David” ang likas at tradisyonal na anyo ng Tagalog para sa maikling pamagat. Hindi lubusang tinutukoy ng Hebreong לְ kung ito ay pag-akda, pag-aalay, pag-uugnay, o pagkabilang sa koleksiyon, kaya nililinaw sa talababa ang saklaw nito.
