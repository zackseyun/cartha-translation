base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: tl
  text: 'Hatulan mo silang maysala, O Diyos;


    mabuwal nawa sila sa sarili nilang mga balak.[a]


    Itaboy mo sila[b] dahil sa dami ng kanilang mga pagsuway,


    sapagkat naghimagsik sila laban sa iyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “mabuwal sila dahil sa sarili nilang mga balak” o “mabigo sila sa kanilang mga balak.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “itaboy” ay maaari ring isaling “palayasin” o “ipalayas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: Hatulan mo silang maysala
  rationale: Ang Hiphil na pautos ng אשם na may hulaping pangmaramihan ay humihiling sa Diyos na kilalanin o hatulan silang maysala. Pinananatili nito ang diwang panghukuman nang hindi agad tinutukoy ang isang partikular na parusa.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos sa loob ng isang panalangin.
- source_word: יִפְּלוּ
  choice: mabuwal nawa sila
  rationale: Ang imperfect na may puwersang jussive ay isang pakiusap sa Diyos, hindi lamang prediksiyon. Likas sa makatang panalangin ang “nawa.”
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: sa sarili nilang mga balak
  rationale: Ang מוֹעֵצוֹת ay tumutukoy sa mga balak o panukala. Pinananatili ng “sa” ang bahagyang kalabuan ng מן kung ang kanilang mga balak ang sanhi o kasangkapan ng pagbagsak, o kung ang diwa ay pagbagsak mula sa mga iyon.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: dahil sa dami ng kanilang mga pagsuway
  rationale: Causal ang gamit ng בְּ kasama ng רֹב. Ang “pagsuway” ay malinaw at may sapat na bigat para sa פֶּשַׁע, na maaari ring magpahiwatig ng paghihimagsik.
- source_word: הַדִּיחֵמוֹ
  choice: Itaboy mo sila
  rationale: Ang Hiphil na pautos ng נדח ay nangangahulugang paalisin, itaboy, o palayasin. Ang “itaboy” ay matindi ngunit natural sa modernong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng kahilingan at angkop sa marangal na himig ng salmo.
- source_word: מָרוּ בָךְ
  choice: naghimagsik sila laban sa iyo
  rationale: Ang מרה na may בְּ ay tahasang nagsasaad ng paghihimagsik laban sa Diyos.
theological_decisions:
- issue: Wika ng panalanging humihiling ng paghatol
  choice: 'Pinanatili bilang tuwirang mga kahilingan sa Diyos: “Hatulan,” “mabuwal nawa,” at “Itaboy.”'
  alternative: Isalin bilang mga prediksiyon lamang tungkol sa sasapitin ng masasama.
  rationale: Ang Hebreo ay gumagamit ng mga pautos at imperfect na may puwersang jussive. Pinananatili ng salin ang tahasang panawagan para sa banal na paghatol at hindi pinahihina ang teolohikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang makatang “nawa” para sa jussive na pakiusap, habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
