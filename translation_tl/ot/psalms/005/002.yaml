  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: tl
  text: Pakinggan mo ang daing ko para humingi ng tulong, Hari ko at Diyos ko, sapagkat sa iyo ako nananalangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ako ay mananalangin.” Maaaring magpahayag ang anyong Hebreo ng kasalukuyan, patuloy, o hinaharap na kilos ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Pakinggan mo
  rationale: Ang pautos na anyo ng קשׁב ay humihiling ng masusing pakikinig. Likas at tuwiran sa makabagong Tagalog ang “Pakinggan mo.”
- source_word: לְקוֹל שַׁוְעִי
  choice: ang sigaw ko para sa tulong
  rationale: Ang קוֹל ay “tinig/tunog,” ngunit kasama ng שַׁוְעָה ay tumutukoy ito sa naririnig na daing o sigaw para sa saklolo. Inihahatid ng parirala ang buong diwa nang hindi nagiging alanganin sa Tagalog.
- source_word: מַלְכִּי
  choice: aking Hari
  rationale: Pinananatili ang maharlikang titulong ginagamit sa tuwirang pakikipag-usap sa Diyos. Ang malaking titik ay estilong Filipino para sa banal na katawagan, hindi dagdag na kahulugan mula sa Hebreo.
- source_word: וֵאלֹהָי
  choice: at aking Diyos
  rationale: Tuwirang salin ng katawagang אֱלֹהִים na may hulaping unang panauhan at isahan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap. Ang “sapagkat” ay malinaw at angkop sa marangal na himig ng panalangin.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng pang-ukol ang pinatutunguhan ng panalangin; natural itong ipinapahayag bilang “sa iyo” sa Tagalog.
- source_word: אֶתְפַּלָּל
  choice: ako nananalangin
  rationale: Ang hitpael imperfect na unang panauhang isahan ng פלל ay maaaring magpahayag ng kasalukuyan, nagpapatuloy, nakagawian, o hinaharap na kilos ayon sa konteksto. Ang kasalukuyang “nananalangin” ay angkop sa agarang panawagan ng salmista.
theological_decisions:
- issue: Pagtawag sa Diyos bilang hari
  choice: aking Hari at aking Diyos
  alternative: aking hari at aking Diyos
  rationale: Tuwirang kinakausap ang Diyos sa dalawang katawagan. Pinananatili ng salin ang dalawang ito nang walang idinaragdag na doktrinal na paliwanag.
- issue: Aspekto o panahon ng אֶתְפַּלָּל
  choice: ako nananalangin
  alternative: ako ay mananalangin
  rationale: Maaaring kasalukuyan o hinaharap ang Hebreong imperfect. Pinili sa pangunahing teksto ang nagpapatuloy na pananalangin dahil sa agarang konteksto, habang pinananatili sa talababa ang tunay na posibilidad ng pagbasa sa hinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sigaw ko para sa tulong” sa halip na ang mas literal ngunit hindi likas na “tunog ng aking sigaw,” at inilagay ang talababa sa pandiwang may tunay na kalabuan sa aspekto o panahon.
