  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: tl
  text: 'Ngunit nawa’y magalak ang lahat ng kumakanlong sa iyo;

    magpakailanman nawa silang sumigaw sa tuwa.[a]

    Lukuban mo sila,[b]

    at magbunyi sa iyo

    ang mga umiibig sa iyong pangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaawit sa tuwa.” Ang pandiwang Hebreo ay maaaring tumukoy sa matunog na sigaw ng kagalakan at maaari ring kabilang ang pag-awit.
    reason: lexical_alternative
  - marker: b
    text: O “takpan mo sila” o “kanlungan mo sila.” Larawan ito ng pagtatakip bilang pangangalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: magalak
  rationale: Ang Qal imperfect ay likas basahin bilang pakiusap o hangarin sa konteksto ng panalangin. Ang “magalak” ay nagpapanatili ng volitional na diwa at angkop sa marangal na tulang Filipino.
- source_word: חוֹסֵי בָךְ
  choice: ang lahat ng nanganganlong sa iyo
  rationale: Ang participle ng חסה ay tumutukoy sa paghanap ng kanlungan at proteksiyon, hindi lamang sa panloob na pagtitiwala. Pinananatili ng “nanganganlong” ang kongkretong larawan.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinapahayag nito ang nagpapatuloy at walang takdang panahong tagal; natural din ito sa makatang rehistro.
- source_word: יְרַנֵּנוּ
  choice: sumigaw sa tuwa
  rationale: Ang Piel ng רנן ay maaaring tumukoy sa matunog at masiglang sigaw ng kagalakan, na maaari ring kabilang ang pag-awit. Hindi ito pinakitid sa pag-awit lamang.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Lukuban mo sila
  rationale: Ang Hiphil ng סכך ay naghahatid ng larawan ng pagtatakip o paglulukob bilang proteksiyon. Maikli at malinaw ang “lukuban,” habang nananatili ang talinghaga ng orihinal.
- source_word: וְיַעְלְצוּ בְךָ
  choice: upang magdiwang sa iyo
  rationale: Ang עלץ ay masidhing kagalakan. Ang “magdiwang” ay natural sa modernong Filipino at pinananatili ng “sa iyo” na ang Diyos ang sentro at batayan ng galak.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: ang mga umiibig sa iyong pangalan
  rationale: Hayagang sinasabi ng Hebreo ang “iyong pangalan,” na tumutukoy sa nahayag na pagkakakilanlan at reputasyon ng Diyos; hindi ito pinasimple bilang “umiibig sa iyo.”
theological_decisions:
- issue: Pakiusap o hangarin laban sa prediksiyon sa mga imperfect na pandiwa
  choice: 'Isinalin ang mga anyo bilang mga pakiusap o hangarin: “magalak,” “sumigaw,” “lukuban mo,” at “upang magdiwang.”'
  alternative: “Magagalak sila… sisigaw sila… lulukuban mo sila… magdiriwang sila.”
  rationale: Sa konteksto ng panalangin ng salmo, ang mga imperfect ay natural na may jussive o optative na puwersa. Iniiwasan nitong gawing tiyak na prediksiyon ang maaaring hiling o panalangin.
- issue: Ugnayan ng וְיַעְלְצוּ sa naunang sugnay
  choice: “upang magdiwang sa iyo”
  alternative: “at magdiwang sa iyo”
  rationale: Maaaring basahin ang waw bilang simpleng pagdurugtong o bilang resulta/layunin. Pinili ang “upang” dahil natural nitong ipinapakita na ang paglulukob ng Diyos ang nagbubunga ng pagdiriwang, gaya ng konsultasyong Ingles, bagaman nananatiling posible ang simpleng “at.”
translation_notes:
  register: Modernong Filipino na marangal at makata ngunit madaling maunawaan. Ginamit ang “nanganganlong” at “lukuban” upang mapanatili ang konkretong larawang proteksiyon; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Ang marker na [a] ay inilagay pagkatapos ng linyang kinauukulan at ang [b] pagkatapos ng “Lukuban mo sila.”
