  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: tl
  text: Ngunit ako, dahil sa kasaganaan ng iyong tapat na pag-ibig, ay papasok sa iyong bahay; yuyukod ako nang nakaharap sa iyong banal na templo, nang may takot sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “takot” dito ay maaari ring ipakahulugang “pagpipitagan” o “pagkamangha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ipinahahayag ng pangatnig at tahasang panghalip ang pagsalungat ng salmista sa masasamang taong binanggit sa naunang konteksto.
- source_word: בְּרֹב חַסְדְּךָ
  choice: dahil sa kasaganaan ng iyong tapat na pag-ibig
  rationale: Ang בְּ ay nauunawaan bilang batayan ng paglapit, at ang חֶסֶד ay tumutukoy sa sagana, matatag, at matapat na pag-ibig ng Diyos, na may pahiwatig ng katapatan sa tipan.
- source_word: אָבוֹא בֵיתֶךָ
  choice: papasok sa iyong bahay
  rationale: Ang imperfect ay nagpapahayag ng pasiya o inaasahang kilos. Pinananatili ng “bahay” ang pagkakaiba nito sa הֵיכַל sa kasunod na sugnay.
- source_word: אֶשְׁתַּחֲוֶה
  choice: yuyukod ako
  rationale: Pinananatili nito ang kongkretong kilos ng pagyukod o pagpapatirapa na nagpapahayag ng pagsamba.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: nang nakaharap sa iyong banal na templo
  rationale: Ang אֶל ay patungong direksiyon sa kontekstong ito; ang parirala ay natural na isinasalin sa Filipino bilang pagyukod na nakaharap sa banal na templo.
- source_word: בְּיִרְאָתֶךָ
  choice: nang may takot sa iyo
  rationale: Pinananatili ng “takot” ang bigat ng יִרְאָה, habang ipinahihiwatig ng konteksto ang mapitagang pagkamangha sa harap ng Diyos.
theological_decisions:
- issue: Kahulugan ng חֶסֶד bilang batayan ng paglapit sa Diyos
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; awa
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang pag-ibig at matatag na katapatan ng Diyos nang hindi nililimitahan ang salita sa awa lamang o labis na ipinapasok ang terminong “tipan” sa pangunahing teksto.
- issue: Saklaw ng יִרְאָה sa pagsamba
  choice: takot sa iyo
  alternative: pagpipitagan sa iyo; pagkamangha sa iyo
  rationale: Pinananatili nito ang tunay na tensiyon ng banal na takot, paggalang, at pagkamangha sa halip na palambutin ito tungo sa simpleng paggalang lamang.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “tapat na pag-ibig” bilang malinaw at likas na katumbas ng חֶסֶד; iniwasan ang mas teknikal na “katapatan sa tipan” sa pangunahing teksto. Ang “nang nakaharap sa” ay mas natural kaysa literal na “tungo sa” kasunod ng “yuyukod.”
