  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: tl
  text: 'Sapagkat walang anumang mapagkakatiwalaan sa bibig nila[a];

    sa kaloob-looban nila ay kapahamakan[b].

    Ang lalamunan nila ay bukás na libingan;

    sa pamamagitan ng kanilang dila ay nagsasalita sila nang matamis[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang anumang mapagkakatiwalaan sa bibig niya,” kung mahigpit na pananatilihin ang anyong isahan sa simula ng talata.
    reason: alternative_reading
  - marker: b
    text: O, “ang kanilang panloob na pagkatao ay pagkawasak”; maaari ring ipahiwatig ng salitang Hebreo ang mapanirang mga balak o mga kapahamakan.
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “ginagawang makinis nila ang kanilang dila”; maaari itong mangahulugang nagsasalita sila nang matamis o mapang-akit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang pakiusap at pinananatili ang lohikal na ugnayan ng talata.
- source_word: אֵין ... נְכוֹנָה
  choice: walang anumang mapagkakatiwalaan
  rationale: Ipinahahayag ang ganap na kawalan ng pagiging matatag, maaasahan, o mapagkakatiwalaan sa kanilang sinasabi.
- source_word: בְּפִיהוּ
  choice: sa bibig nila
  rationale: Bagaman anyong isahan ang hulapi sa tekstong Hebreo, maramihan ang mga kasunod na hulapi at kolektibong tinutukoy ang masasama. Ang maramihang anyo ay malinaw at likas sa Tagalog; iniingatan sa talababa ang anyong isahan.
- source_word: קִרְבָּם
  choice: ang kanilang kalooban
  rationale: Tumutukoy sa panloob na pagkatao o nasa loob nila. Likas sa Tagalog ang “kalooban” at hindi nito nililimitahan ang diwa sa isang partikular na sangkap gaya ng puso.
- source_word: הַוּוֹת
  choice: kapahamakan
  rationale: Ang maramihang pangngalan ay maaaring tumukoy sa mapanirang mga balak, pagkawasak, o kapahamakan. Ang abstraktong “kapahamakan” ay maikli at angkop bilang panaguri.
- source_word: קֶבֶר פָּתוּחַ
  choice: bukás na libingan
  rationale: Pinananatili ang matingkad na larawang Hebreo ng nakamamatay at bulok na pananalita.
- source_word: גְּרוֹנָם
  choice: lalamunan nila
  rationale: Ito ang likas na katawagang anatomiko sa konteksto ng pagsasalita at pinananatili ang metapora.
- source_word: לְשׁוֹנָם
  choice: gamit ang kanilang dila
  rationale: Pinananatili ang konkretong larawan ng dila bilang kasangkapan ng mapanlinlang na pananalita.
- source_word: יַחֲלִיקוּן
  choice: nambobola sila
  rationale: Ang Hiphil ng חלק ay literal na nauugnay sa pagpapakinis at sa kontekstong ito ay tumutukoy sa matamis ngunit mapanlinlang na pananalita. Likas at malinaw sa modernong Tagalog ang “nambobola.”
theological_decisions:
- issue: Metaporang antropolohikal sa קִרְבָּם
  choice: ang kanilang kalooban
  alternative: ang kanilang panloob na pagkatao; ang kanilang puso
  rationale: Ipinakikita ng talata ang kasamaang nasa loob na nahahayag sa pagsasalita. Sapat na malawak ang “kalooban” upang hindi ipakahulugan na iisang kakayahan lamang, gaya ng damdamin o isip, ang tinutukoy.
- issue: Bilang ng בְּפִיהוּ ayon sa konteksto
  choice: sa bibig nila
  alternative: sa bibig niya
  rationale: Anyong isahan ang hulapi sa simula, ngunit maramihan ang mga kasunod na hulapi. Pinili ang kolektibong maramihan para sa malinaw na daloy habang hayagang itinatala ang anyong isahan bilang alternatibo.
- issue: Diwa ng הַוּוֹת
  choice: kapahamakan
  alternative: mga kapahamakan; pagkawasak; mapanirang mga balak
  rationale: Hindi nililimitahan ng salin ang salita sa moral na kasamaan lamang o sa isang tiyak na balak; pinananatili nito ang malawak na diwa ng mapanirang kalagayan at bunga.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at patulang himig. Ginamit ang “mapagkakatiwalaan,” “kalooban,” at “kapahamakan” para maging malinaw sa karaniwang mambabasa habang pinananatili ang paralelismo at mga konkretong larawan ng bibig, lalamunan, libingan, at dila. Ang tuldik sa “bukás” ay tumutulong na ibukod ito sa “bukas” na tumutukoy sa susunod na araw.
