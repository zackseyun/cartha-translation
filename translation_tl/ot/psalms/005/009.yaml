  source_fidelity: 'Wasto ang pangunahing pag-unawa sa Hebreo: ang talata ay nagbibigay ng dahilan, inilalarawan ang kawalan ng maaasahan sa pananalita, ang mapanirang nasa loob, ang lalamunang gaya ng nakabukas na libingan, at ang madulas na pananalita. Gayunman, ang “nambobola” ay mas kolokyal at mas tiyak kaysa sa יַחֲלִיקוּן; mas maingat ang “nagsasalita sila nang matamis,” na iniingatan ang larawan ng makinis o madulas na pananalita nang hindi ipinapasok ang isang partikular na motibo.'
  naturalness: Malinaw at likas sa pangkalahatan ang Tagalog. Ang “sa kaloob-looban nila” ay mas tuwirang patula at mas natural na katumbas ng קִרְבָּם kaysa “ang kanilang kalooban,” na maaari ring mangahulugang pasiya o nais. Ang binagong huling linya ay marangal at hindi labis na impormal.
