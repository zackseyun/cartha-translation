base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: tl
  text: 'Yahweh, sa umaga ay maririnig mo ang tinig ko;

    sa umaga ay ihaharap ko sa iyo ang aking dalangin[a],

    at mag-aabang ako nang may pag-asa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aayusin ko para sa iyo.” Maaaring tumukoy ito sa maayos na paghahanda o paghaharap ng aking panalangin sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “at magmamasid ako nang may pag-asa.” Ang pandiwang Hebreo ay maaaring mangahulugang magmasid, maghintay, o tumanaw nang may pag-asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בֹּקֶר
  choice: sa umaga
  rationale: Likas na panandang pamanahon sa modernong Tagalog; pinanatili ang pag-uulit nito sa dalawang sugnay.
- source_word: תִּשְׁמַע
  choice: maririnig mo
  rationale: Ang di-ganap na anyo ng pandiwa ay maaaring magpahayag ng hinaharap o tiyak na inaasahan; ang hinaharap na anyo ay angkop sa daloy ng panalangin.
- source_word: קוֹלִי
  choice: ang tinig ko
  rationale: Tuwirang katumbas na hindi nagpapalakas sa diwa tungo sa 'daing' o 'sigaw.'
- source_word: אֶעֱרָךְ לְךָ
  choice: ihaharap ko sa iyo ang aking dalangin
  rationale: Ang pandiwa ay literal na tumutukoy sa pagsasaayos o paghahanda. Dahil walang hayag na layon sa Hebreo, ginawang malinaw ang ipinahihiwatig ng konteksto ng panalangin, habang inilagay sa talababa ang mas literal na alternatibo.
- source_word: וַאֲצַפֶּה
  choice: at mag-aabang ako nang may pag-asa
  rationale: Saklaw ng pandiwa ang pagmamasid, paghihintay, at pagtanaw nang may inaasahan. Ang 'mag-aabang' ay natural sa Tagalog at pinananatili ang aktibong paghihintay.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinanatili ang personal na pangalan sa transliterasyong karaniwang kumakatawan sa anyong Hebreo.
- issue: Hindi hayag na layon ng אֶעֱרָךְ
  choice: ang aking dalangin
  alternative: 'walang tahasang layon: ''aayusin ko para sa iyo'''
  rationale: Malinaw sa konteksto na panalangin ang inihaharap, ngunit hindi ito tahasang nakasulat sa Hebreo; kaya nilinaw sa pangunahing teksto at pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang patulang pag-uulit ng “sa umaga” at gumamit ng payak na bokabularyong madaling maunawaan. Ang mga anyong panghinaharap ay umaayon sa magkakasunod na di-ganap na pandiwa sa Hebreo at sa tiyak na paghihintay ng nananalangin.
