translation:
  language: tl
  text: Wawasakin mo ang mga nagsasalita ng kasinungalingan;[a] kinasusuklaman ni Yahweh ang taong may pagkakasala sa pagdanak ng dugo at pandaraya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Winawasak mo ang mga nagsasalita ng kasinungalingan.” Maaaring tumukoy ang pandiwang Hebreo sa mangyayari o sa karaniwang pagkilos ng Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tao ng mga dugo at pandaraya”—isang idyoma para sa taong may pagkakasala sa pagdanak ng dugo at pandaraya; maaari ring isalin, “taong marahas at mapanlinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Wawasakin mo
  rationale: Ang Piel ng אבד na nasa ikalawang panauhang panlalaki ay nangangahulugang magpangyaring mapahamak o mawasak. Maaaring unawain ang anyo bilang hinaharap o bilang pangkalahatang paglalarawan ng pagkilos ng Diyos; pinili rito ang likas na Tagalog na anyong hinaharap.
- source_word: דֹּבְרֵי כָזָב
  choice: mga nagsasalita ng kasinungalingan
  rationale: Pinananatili nito ang pandiwang diwa ng literal na pariralang “mga nagsasalita ng kabulaanan” sa malinaw at likas na makabagong Tagalog.
- source_word: אִישׁ דָּמִים
  choice: taong marahas
  rationale: Ang idyomang literal na “tao ng mga dugo” ay tumutukoy sa taong kakikitaan ng karahasan, pagdanak ng dugo, o pagkakasala sa dugo. Ang “taong marahas” ay natural sa Tagalog at hindi ito pinakikitid sa mamamatay-tao lamang.
- source_word: וּמִרְמָה
  choice: at mapanlinlang
  rationale: Ang מִרְמָה ay pandaraya, panlilinlang, o pagtataksil. Bilang paglalarawan sa tao, likas ang pang-uring “mapanlinlang.”
- source_word: יְתָעֵב
  choice: kinasusuklaman
  rationale: Ang Piel ng תעב ay nagpapahayag ng matinding pagkamuhi o pagkasuklam; pinananatili ng “kinasusuklaman” ang tindi at dignidad ng pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa kilos ng Diyos sa תְּאַבֵּד
  choice: Wawasakin mo
  alternative: Winawasak mo
  rationale: Maaaring marinig ang imperfect na Hebreo bilang kilos sa hinaharap o bilang pangkalahatang gawain ng Diyos. Pinili ang hinaharap ngunit itinabi sa talababa ang tunay na alternatibo.
- issue: Pagpapahayag ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Idyomang אִישׁ דָּמִים
  choice: taong marahas
  alternative: taong mapagpadanak ng dugo
  rationale: Saklaw ng idyoma ang taong namumuhay sa karahasan o may pagkakasala sa dugo. Ang pangunahing salin ay likas at malawak, samantalang nililinaw ng talababa ang literal na larawan at mas tahasang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panulaang panrelihiyon. Pinanatili ang tuwirang pakikipag-usap sa Diyos sa unang sugnay at ang pagbanggit kay Yahweh sa ikalawa. Iniwasan ang sobrang literal na “tao ng mga dugo,” ngunit inilagay ang larawang Hebreo sa talababa.
