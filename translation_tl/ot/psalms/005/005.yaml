  text: לֹֽא יִתְיַצְּב֣וּ הֽ֭וֹלְלִים לְ/נֶ֣גֶד עֵינֶ֑י/ךָ שָׂ֝נֵ֗אתָ כָּל פֹּ֥עֲלֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: tl
  text: Ang mga hambog[a] ay hindi makatatayo sa harap ng iyong mga mata; kinapopootan mo ang lahat ng gumagawa ng kasamaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mapagmataas,” “mga hangal,” o “mga walang-galang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng gumagawa ng masama” o “lahat ng gumagawa ng kabuktutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: makatatayo
  rationale: Ipinahahayag ng Hitpael ng יצב ang pagtindig o pagharap. Pinananatili ng “makatatayo” ang diwang hindi sila makapananatili sa presensiya ng Diyos.
- source_word: הוֹלְלִים
  choice: mga hambog
  rationale: Sa anyong ito, tumutukoy ito sa mga nagyayabang o mapagmataas, hindi lamang sa mga kulang sa karunungan. Likas at tuwiran sa modernong Filipino ang “mga hambog.”
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: sa harap ng iyong mga mata
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo habang malinaw na tumutukoy sa paningin o presensiya ng Diyos.
- source_word: שָׂנֵאתָ
  choice: kinapopootan mo
  rationale: Tuwirang ipinahahayag ng pandiwa ang matinding pagkamuhi. Hindi ito pinalalambot bilang simpleng pagsalungat o pagtanggi.
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Likas sa Filipino ang pariralang ito at pinananatili nito kapwa ang aktibong paggawa at ang moral na diwa ng אָוֶן.
theological_decisions:
- issue: Ang pahayag tungkol sa pagkapoot ng Diyos
  choice: Panatilihin ang tuwirang “kinapopootan mo ang lahat ng gumagawa ng kasamaan.”
  alternative: “Tinututulan mo” o “tinatanggihan mo ang lahat ng gumagawa ng kasamaan.”
  rationale: Malinaw na nangangahulugang “kapootan” ang Hebreong שָׂנֵאתָ. Pinananatili ng salin ang matalim na teolohikal na pahayag ng teksto sa halip na palambutin ito.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang konkretong larawang “sa harap ng iyong mga mata” at ang tahasang pananalitang “kinapopootan” nang hindi niluluwagan ang tensiyong teolohikal.
