  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: tl
  text: Kung hindi ako naniwalang makikita ko ang kabutihan ni Yahweh sa lupain ng mga buháy—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi kumpleto ang pangungusap sa Hebreo: “Kung hindi ako naniwalang makikita ko ang kabutihan ni Yahweh sa lupain ng mga buháy—”. Hindi tahasang sinabi ang magiging bunga.'
    reason: alternative_reading
  - marker: b
    text: 'Maaaring ipinahihiwatig: “Nawalan na sana ako ng pag-asa,” o “Pinanghinaan na sana ako ng loob.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא
  choice: Kung hindi
  rationale: Ipinapahayag nito ang kondisyong salungat sa nangyari, habang hinahayaang hindi banggitin ang bunga ng kondisyon gaya sa Hebreo.
- source_word: הֶאֱמַנְתִּי
  choice: ako naniwala
  rationale: Ang Hiphil ng אמן ay nangangahulugang maniwala o magtiwala; ang kasunod na parirala ang nagsasaad ng nilalaman ng paniniwala.
- source_word: לִרְאוֹת
  choice: makikita ko
  rationale: Bagaman infinitive na “makita” ang anyong Hebreo, natural sa Tagalog na gawin itong nilalaman ng “naniwala” sa pamamagitan ng “makikita ko.”
- source_word: בְּטוּב
  choice: ang kabutihan
  rationale: Pinananatili ang malawak na diwa ng טוּב bilang kabutihan at kagandahang-loob, nang hindi ito nililimitahan sa materyal na pagpapala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi bilang isang titulo.
- source_word: בְּאֶרֶץ חַיִּים
  choice: sa lupain ng mga buháy
  rationale: Likas at tumpak na katumbas ng idyomang Hebreo para sa daigdig o kalagayan ng mga nabubuhay, bilang kabaligtaran ng kamatayan.
- source_word: '[implicit apodosis after לוּלֵא]'
  choice: —
  rationale: Ginagamit ang gitling upang mapanatili ang biglang naputol at hindi kinumpletong kondisyon sa tekstong Hebreo, sa halip na gawing bahagi ng pangunahing teksto ang isang ipinapalagay na bunga.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh.
- issue: Hindi binanggit na bunga ng kondisyong לוּלֵא
  choice: Panatilihing hindi kumpleto ang pangungusap at markahan ng gitling
  alternative: Idagdag sa teksto ang “Nawalan na sana ako ng pag-asa” o “Pinanghinaan na sana ako ng loob”
  rationale: Elliptical ang Hebreo at hindi tahasang sinasabi ang bunga. Pinananatili ng salin ang tunay na pagkukulang na ito, samantalang ipinapaliwanag sa talababa ang malamang na diwa ayon sa konteksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “mga buháy” na may tuldik upang luminaw ang bigkas at maiwasang mabasa bilang “bahay.” Pinanatili ang ellipsis ng Hebreo sa pamamagitan ng gitling at ipinaliwanag ito sa mga talababa.
