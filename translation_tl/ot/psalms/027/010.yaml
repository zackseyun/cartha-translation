  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: tl
  text: Sapagkat pinabayaan ako ng aking ama at ina, ngunit tatanggapin ako ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “titipunin niya ako” o “kukupkupin niya ako.” Literal na nangangahulugang “tipunin” ang pandiwang Hebreo; dito, ipinahihiwatig nito ang mapagkalingang pagtanggap at proteksiyon ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat kahit
  rationale: Ang כִּי ay nag-uugnay sa talata sa nakapaligid na pahayag ng pagtitiwala. Sa Filipino, ang pagsasama ng “sapagkat” at “kahit” ay likas na naghahatid ng batayan at ng malinaw na paghahambing sa pagitan ng pagtalikod ng mga magulang at pagtanggap ni Yahweh, nang hindi ginagawang tahasang kondisyon ang pangungusap.
- source_word: אָבִי וְאִמִּי
  choice: aking ama at ina
  rationale: Tuwirang salin ng mga pangngalang may unang panauhang panakip; natural sa Filipino na isang “aking” lamang ang gamitin para sa magkaugnay na pares.
- source_word: עֲזָבוּנִי
  choice: pabayaan ako
  rationale: Ang עזב ay maaaring mangahulugang iwan, pabayaan, o talikuran. Ang “pabayaan” ay natural at marangal, at naipapahiwatig ang masakit na pagkawala ng pag-aaruga nang hindi kinakailangang tukuyin kung aktuwal na nangyari na ito o inilalarawan bilang sukdulang posibilidad.
- source_word: וַיהוָה
  choice: naman ... ni Yahweh
  rationale: Bagaman karaniwang “at” ang ו, malinaw na may pagsalungat dito. Ang “naman” ay natural na panandang paghahambing sa Filipino. Pinanatili ang pangalang tipan bilang “Yahweh” ayon sa patakaran ng proyekto.
- source_word: יַאַסְפֵנִי
  choice: tatanggapin ... ako
  rationale: Literal na “titipunin ako” ang אסף, ngunit sa kontekstong personal ay nangangahulugan itong tanggapin o kupkupin. Ang “tatanggapin ako” ay malinaw at natural, habang inilalahad sa talababa ang konkretong larawan at saklaw ng salitang Hebreo.
theological_decisions:
- issue: Kahulugan ng pagtalikod ng ama at ina
  choice: kahit pabayaan ako
  alternative: pabayaan man ako / pinabayaan ako
  rationale: Ang anyong ganap sa Hebreo ay maaaring ilarawan ang pagtalikod bilang tiyak o ganap, ngunit sa konteksto ng pagtitiwala ay maaari rin itong tumukoy sa sukdulang posibilidad. Pinananatili ng “kahit” ang retorikal na diin nang hindi iginiit na aktuwal nang nagtakwil ang mga magulang.
- issue: Paglalarawan sa pagkalinga ni Yahweh
  choice: tatanggapin naman ako
  alternative: titipunin niya ako / kukupkupin niya ako
  rationale: Hindi nililimitahan ang יַאַסְפֵנִי sa tirahan lamang o sa isang partikular na doktrinang pangkaligtasan. Ipinahahayag nito ang mapagkalingang pagtanggap at proteksiyon ni Yahweh.
- issue: Pagbigkas sa banal na pangalan יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit ang “Yahweh” bilang tuwirang representasyon ng pangalan ng Diyos alinsunod sa itinakdang patakaran ng proyekto, nang hindi inaangkat ang isang denominasyonal na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “ama at ina” sa halip na mas kolokyal na “tatay at nanay,” at ang “tatanggapin” bilang natural na pangunahing salin habang pinananatili sa talababa ang literal na larawang “titipunin.”
