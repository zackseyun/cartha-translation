  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: tl
  text: Kahit magkampo laban sa akin ang isang hukbo[a], hindi matatakot ang puso ko; kahit sumiklab laban sa akin ang digmaan, sa ganitong kalagayan ay magtitiwala ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung magkampo laban sa akin ang isang hukbo, hindi matatakot ang puso ko; kung sumiklab laban sa akin ang digmaan, magtitiwala ako.” Ang salitang Hebreo na אִם ay maaaring isaling “kung” o “kahit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang huling parirala na “dito ako nakatitiyak” o “sa kabila nito ay panatag ako.” Maaaring idiin ng Hebreo ang pagtitiwala o ang kapanatagan sa gitna ng banta.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kahit
  rationale: Maaaring mangahulugang kondisyunal na “kung” o konsesibong “kahit.” Sa magkatulad na mga taludtod at sa konteksto, malinaw at natural na ipinahahayag ng “kahit” ang pananatiling walang takot sa harap ng banta.
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: magkampo ... ang isang hukbo
  rationale: Pinananatili ng “magkampo” ang larawang militar ng pandiwang חנה, samantalang ang מַחֲנֶה, bagaman literal na “kampo,” ay tumutukoy rito sa hukbong nagkakampo.
- source_word: לֹא יִירָא לִבִּי
  choice: hindi matatakot ang puso ko
  rationale: Pinananatili ang tahasang paksa na “puso ko” sa Hebreo sa halip na gawing payak na “hindi ako matatakot.”
- source_word: תָּקוּם עָלַי מִלְחָמָה
  choice: sumiklab laban sa akin ang digmaan
  rationale: Ang קום ay “bumangon/lumitaw,” ngunit sa modernong Tagalog, natural na inilalarawan ng “sumiklab” ang pagsisimula o pagharap ng digmaan habang pinananatili ang masiglang larawan.
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: kahit sa ganitong kalagayan ay magtitiwala ako
  rationale: Ipinapakita ang demonstratibong בְּזֹאת bilang pagtukoy sa banta na kasasabi lamang, ngunit hindi nagdaragdag ng tahasang layon ng pagtitiwala na wala sa talata. Ang “magtitiwala” ay nagpapanatili sa diwa ng בטח bilang tiwala o kapanatagan.
theological_decisions:
- issue: Ang tinutukoy ng בְּזֹאת at ang diwa ng בטח
  choice: “kahit sa ganitong kalagayan ay magtitiwala ako” bilang pagtukoy sa bantang inilarawan
  alternative: “dito ako nakatitiyak,” “sa kabila nito ay panatag ako,” o pagtukoy sa PANGINOON mula sa naunang konteksto
  rationale: Pinapaboran ng pinakamalapit na konteksto ang pagtukoy ng demonstratibo sa hukbo at digmaan. Gayunman, hindi tahasang binabanggit sa talata ang layon ng pagtitiwala, kaya hindi ito idinagdag at ang ibang posibleng pagbasa ay inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paralelismo, ang “puso ko,” at ang militar na larawan. Ginamit ang “magkampo” sa karaniwang baybay at iniwasang gawing tahasan ang layon ng pagtitiwala dahil hindi ito nakasaad sa talata.
