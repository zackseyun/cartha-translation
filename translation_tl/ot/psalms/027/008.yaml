  source_fidelity: Ang pangunahing suliranin ay ang “Sa iyo ay sinasabi ng puso ko,” na sa Filipino ay madaling mabasang ang puso ng salmista ang nagsasabi kay Yahweh na hanapin (niya at ng iba) ang mukha ng salmista. Hindi nito naipahihiwatig ang piniling pagbasa na ang puso ay nagbibigay-boses sa panawagan ng Diyos. Ang “Sa ngalan mo” ay mas malinaw na katumbas ng piniling ‘On your behalf,’ habang pinananatili sa talababa ang tunay na kalabuan ng Hebreong pambungad. Napananatili ang maramihang utos na בַּקְּשׁוּ at ang pag-uulit ng ‘mukha.’
  naturalness: Mas natural at malinaw sa makabagong marangal na Filipino ang “Sa ngalan mo, sinasabi ng puso ko,” kaysa “Sa iyo ay sinasabi ng puso ko.” Ang “Ang mukha mo, Yahweh, ang hinahanap ko” ay maayos na patulang diin at likas na ayos sa Filipino.
  terminology: Ang “Yahweh” ay wastong katumbas ng יְהוָה ayon sa ibinigay na patakaran. Ang “mukha” ay dapat manatili sa pangunahing teksto upang mapanatili ang leksikal na pag-uulit; ang “presensya” ay angkop lamang bilang alternatibo sa talababa. Ang “hinahanap ko” ay katanggap-tanggap para sa imperfect na nagpapahayag ng kasalukuyang paninindigan; ang “hahanapin ko” ay dapat manatiling alternatibo.
