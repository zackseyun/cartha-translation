base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: tl
  text: Sa ngalan mo, sinasabi ng puso ko[a], “Hanapin ninyo ang aking mukha.” Ang mukha mo[b], Yahweh, ang hinahanap ko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang pambungad na Hebreo. Maaari rin itong isalin na “Sa iyo, sinasabi ng puso ko,” o, kung iba ang pag-uugnay ng mga salita, “Sinasabi ng puso ko tungkol sa iyo, ‘Hanapin ninyo ang mukha niya.’”
    reason: alternative_reading
  - marker: b
    text: O “presensya mo.” Sa Hebreo, ang “mukha” ay madalas tumutukoy sa personal na presensya.
    reason: lexical_alternative
  - marker: c
    text: O “hahanapin ko.” Maaaring magpahayag ang pandiwang Hebreo ng kasalukuyang paninindigan o layuning gagawin sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ אָמַר לִבִּי
  choice: Sa iyo ay sinasabi ng puso ko
  rationale: Pinananatili nito ang karaniwang diwa ng לְךָ bilang “sa iyo” at ang patulang pahayag ng panloob na tugon, nang hindi ipinipilit ang isang tiyak na paliwanag sa mahirap na sintaks.
- source_word: בַּקְּשׁוּ
  choice: Hanapin ninyo
  rationale: Ang pandiwa ay pautos at maramihan. Pinananatili ng “hanapin ninyo” ang bilang at tuwirang lakas ng utos.
- source_word: פָנָי / פָּנֶיךָ
  choice: aking mukha / mukha mo
  rationale: Pinananatili ang literal at makabuluhang pag-uulit ng “mukha” sa dalawang hati ng talata; maaari rin itong tumukoy sa personal na presensya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֲבַקֵּשׁ
  choice: ang hinahanap ko
  rationale: Ipinapahayag nito ang kasalukuyang matatag na tugon ng nagsasalita. Maaari ring magtaglay ang anyong Hebreo ng diwang panghinaharap.
theological_decisions:
- issue: Ang mahirap na pambungad na לְךָ אָמַר לִבִּי
  choice: Sa iyo ay sinasabi ng puso ko, “Hanapin ninyo ang aking mukha.”
  alternative: 'Para sa iyo ay sinasabi ng puso ko; o: Sinasabi ng puso ko tungkol sa iyo, “Hanapin ninyo ang mukha niya.”'
  rationale: Hindi ganap na tiyak ang ugnayan ng לְךָ sa natitirang pangungusap. Pinananatili ng pangunahing salin ang tekstong Masoretiko at ang tuwirang sipi, habang inilalahad sa talababa ang iba pang posibleng pagbasa.
- issue: Ang kahulugan ng “mukha” ng Diyos
  choice: mukha
  alternative: presensya
  rationale: Ang “mukha” ay nagpapanatili sa larawan at pag-uulit ng Hebreo, samantalang kinikilala sa talababa na madalas itong tumukoy sa personal na presensya ng Diyos.
- issue: Ang banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng tradisyonal na titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang patulang pag-uulit ng “mukha,” ang maramihang pautos na “hanapin ninyo,” at ang bahagyang kakaibang ayos ng pambungad upang hindi maitago ang tunay na kalabuan ng Hebreo.
