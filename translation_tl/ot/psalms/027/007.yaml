  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: tl
  text: Dinggin mo, Yahweh, ang tinig ko habang tumatawag ako; mahabag ka sa akin[a] at sagutin mo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagpakitaan mo ako ng magandang-loob” o “pagkalooban mo ako ng iyong pabor.” Ang pandiwang Hebreo na חנן ay humihingi ng mapagbiyayang paglingap.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dinggin mo
  rationale: Ang pautos na anyo ng שׁמע ay isang tuwirang pakiusap na makinig nang may pagtugon. Ang “dinggin mo” ay likas at marangal sa panalangin at mas angkop dito kaysa sa payak na “marinig mo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang pangalang tipan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: קוֹלִי
  choice: ang tinig ko
  rationale: Pinananatili nito ang kongkretong Hebreong pahayag na “aking tinig” sa halip na paikliin lamang bilang “ako.”
- source_word: אֶקְרָא
  choice: habang tumatawag ako
  rationale: Ang Qal imperfect na קרא ay tumutukoy sa patuloy o kasabay na pagtawag ng salmista sa Diyos. Ang “habang” ay natural na nagpapahayag ng ugnayan nito sa pakiusap na dinggin siya nang hindi nililimitahan sa isang takdang pagkakataon.
- source_word: וְחָנֵּנִי
  choice: mahگabag ka sa akin
  rationale: Ang חנן ay paghingi ng mapagbiyayang paglingap o pabor. Ang “mahabag ka sa akin” ay natural sa makabagong Filipino at nagpapanatili sa diwa ng mapagkalingang pabor, bagaman hindi nito lubos na naihihiwalay ang חנן sa ibang mga salitang Hebreo para sa awa.
- source_word: וַעֲנֵנִי
  choice: sagutin mo ako
  rationale: Tuwiran at natural na salin ng pautos na anyo ng ענה sa konteksto ng panalangin.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang “Yahweh” at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Diwa ng חנן
  choice: mahگabag ka sa akin
  alternative: pagmagandahang-loob mo ako / kaawaan mo ako
  rationale: Pinili ang natural na pananalitang Filipino nang hindi ginagawang teknikal o denominasyonal ang pakiusap. Ipinaliliwanag sa talababa na sentral sa pandiwa ang mapagbiyayang pabor.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino para sa panalangin. Pinanatili ang kongkretong pariralang “ang tinig ko” at ang tuwirang pagtawag sa Diyos. Ginamit ang “habang tumatawag ako” upang natural na katawanin ang di-tiyak na aspektong Hebreo.
