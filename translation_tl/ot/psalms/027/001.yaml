base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: tl
  text: 'Kay David.[a]


    Si Yahweh ang aking liwanag at aking kaligtasan;

    sino ang katatakutan ko?

    Si Yahweh ang tanggulan ng aking buhay;

    sino ang dapat kong pangambahan?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ni David” o “Para kay David.” Maaaring tumukoy ang Hebreong לְדָוִד sa pagiging may-akda o sa ibang kaugnayan kay David.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ng maikling pamagat ang ugnayang ipinahihiwatig ng לְ nang hindi tiyak na nililimitahan ito sa pagiging may-akda; nililinaw sa talababa ang iba pang posibleng pagbasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan sa Tetragrammaton sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אוֹרִי
  choice: aking liwanag
  rationale: Pinanatili ang malinaw at makapangyarihang metapora ng Hebreong אוֹר.
- source_word: וְיִשְׁעִי
  choice: at aking kaligtasan
  rationale: Ang “kaligtasan” ay likas na salin ng יֵשַׁע at sapat na malawak upang saklawin ang pagliligtas at katiwasayang ipinahahayag sa salmo.
- source_word: מִמִּי אִירָא
  choice: sino ang katatakutan ko?
  rationale: Isinalin bilang likas na retorikal na tanong sa Filipino; hindi kailangang ilantad ang Hebreong pang-ukol na מִן upang maipahayag ang diwa.
- source_word: מָעוֹז חַיַּי
  choice: tanggulan ng aking buhay
  rationale: Ang “tanggulan” ay nagpapahayag ng matibay na proteksiyon ng מָעוֹז at mas likas sa kasalukuyang Filipino kaysa sa mas makalumang “muog.”
- source_word: מִמִּי אֶפְחָד
  choice: sino ang pangangambahan ko?
  rationale: Pinananatili ang paralelismo at ang bahagyang pagkakaiba ng פחד mula sa ירא sa pamamagitan ng “pangangambahan” sa halip na ulitin ang “katatakutan.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili nito sa halip na palitan ng isang titulo.
- issue: Saklaw ng “aking kaligtasan”
  choice: Pinanatili bilang malawak na metapora ng pagliligtas
  alternative: aking tagapagligtas
  rationale: Pangngalan ang יִשְׁעִי (“aking kaligtasan”), kaya hindi ito ginawang tahasang katawagan sa Diyos bilang “tagapagligtas”; pinananatili rin nito ang anyo at teolohikal na lakas ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikli at balanseng paralelismo ng tulang Hebreo, ang mga metaporang “liwanag,” “kaligtasan,” at “tanggulan,” at ang dalawang magkaugnay ngunit magkaibang pandiwa para sa takot.
