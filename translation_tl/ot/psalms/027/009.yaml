  source_fidelity: 'Tapat ang salin sa mga pangunahing sugnay ng Hebreo: ang pag-ikli ng “mukha,” ang pagsusumamo na huwag itaboy sa galit ang lingkod, ang dating napatunayang tulong ng Diyos, at ang magkaibang pandiwang “itakwil” at “pabayaan.” Napananatili rin ang tuwirang bokatibo at ang construct phrase na “Diyos ng aking kaligtasan.”'
