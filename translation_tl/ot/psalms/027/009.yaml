source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: tl
  text: 'Huwag mong ikubli sa akin ang iyong mukha;

    huwag mong itaboy sa galit ang iyong lingkod.

    Ikaw ang naging tulong ko.

    Huwag mo akong itakwil o pabayaan,

    O Diyos ng aking kaligtasan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Diyos ng aking pagliligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: ikubli sa akin ang iyong mukha
  rationale: Pinananatili ang malinaw na larawang Hebreo tungkol sa mukha ng Diyos. Likas sa marangal na panalangin ang “ikubli,” at ipinahihiwatig ng “sa akin” ang pagkakait ng pabor o presensiya nang hindi pinapalitan ang mismong larawan.
- source_word: תַּט בְּאַף עַבְדֶּךָ
  choice: itaboy sa galit ang iyong lingkod
  rationale: Sa konteksto, ang נטה na may tuwirang layon at בְּאַף ay nagpapahayag ng galit na pagtanggi o pagpapaalis. Ang “itaboy” ay malinaw at likas sa Filipino, samantalang ang “lingkod” ay angkop na mapagpakumbabang katawagan ng nananalangin sa Diyos.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: Ikaw ang naging tulong ko
  rationale: Ang עֶזְרָה ay “tulong,” at ang qatal na הָיִיתָ ay tumutukoy sa napatunayan nang pagtulong ng Diyos na mahalaga pa rin sa kasalukuyang pagsusumamo.
- source_word: תִּטְּשֵׁנִי
  choice: itakwil
  rationale: Ipinahahayag ng נטש ang mariing pagtanggi o pagtataboy. Pinananatili ng “itakwil” ang lakas nito at ang kaibhan nito sa kasunod na עזב.
- source_word: תַּעַזְבֵנִי
  choice: pabayaan
  rationale: Ang עזב ay maaaring mangahulugang iwan o pabayaan. Ang “pabayaan” ay natural sa makabagong Filipino at naiiba pa rin sa mas mariing “itakwil.”
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: O Diyos ng aking kaligtasan
  rationale: Pormal na pinananatili ang construct phrase at ang teolohikal na bigat ng יֶשַׁע. Ipinakikita ng “O” ang tuwirang pagtawag sa Diyos sa panalangin.
theological_decisions:
- issue: Antropomorpikong pananalitang “iyong mukha” para sa Diyos
  choice: Panatilihin ang “iyong mukha” sa pangunahing teksto
  alternative: iyong presensiya
  rationale: Tahasang gumagamit ang Hebreo ng “mukha,” isang karaniwang larawang biblikal para sa pabor o presensiya ng Diyos. Ang pagpapanatili nito ay hindi tahimik na nagpapaliwanag o nag-aalis sa talinghaga.
- issue: Kahulugan ng עבד kaugnay ng Diyos
  choice: lingkod
  alternative: alipin
  rationale: Dito, ang salmista ay mapagpakumbabang tumatawag sa sarili bilang nakatalaga sa Diyos; hindi pangunahing diin ang legal na kalagayan ng pagkaalipin. Kaya “lingkod” ang mas angkop sa panalanging ito.
- issue: Saklaw ng יִשְׁעִי
  choice: aking kaligtasan
  alternative: aking pagliligtas
  rationale: Ang “kaligtasan” ay nagpapanatili sa malawak na saklaw ng Hebreo, samantalang maaaring idiin ng “pagliligtas” ang mismong gawa ng pagpapalaya. Inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino para sa panalangin. Pinanatili ang paralelismo, tuwirang pakiusap, at larawang “mukha” ng Diyos. Iniwasan ang labis na arkaikong pananalita, habang nananatiling angkop sa pampublikong pagbasa.
