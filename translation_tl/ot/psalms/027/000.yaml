  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: tl
  text: 'Kay David.[a]


    Si Yahweh ang aking liwanag at aking kaligtasan—kanino ako matatakot? Si Yahweh ang tanggulan ng aking buhay—kanino ako mangangamba?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ni David” o “Para kay David.” Ang Hebreong לְדָוִד ay maaaring magpahiwatig ng pagkakatha, pag-uukol, o kaugnayan kay David.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ang maikli at tradisyonal na anyo ng pamagat habang hindi lubusang nilulutas kung ito ay tumutukoy sa pagkakatha, pag-uukol, o kaugnayan kay David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: אוֹרִי
  choice: aking liwanag
  rationale: Literal at likas na salin ng metaporang Hebreo.
- source_word: יִשְׁעִי
  choice: aking kaligtasan
  rationale: Pinananatili ang pangngalang abstrakto at ang parallelism sa 'aking liwanag.'
- source_word: מָעוֹז חַיַּי
  choice: tanggulan ng aking buhay
  rationale: Ang 'tanggulan' ay malinaw na nagpapahayag ng matibay at ligtas na kanlungan, habang pinananatili ang genitibong 'ng aking buhay.'
- source_word: אִירָא / אֶפְחָד
  choice: matatakot / mangangamba
  rationale: Gumagamit ng dalawang magkalapit ngunit magkaibang pandiwa upang maipakita ang leksikal na baryasyon at paralelismo ng Hebreo.
theological_decisions:
- issue: Kahulugan ng superskripsiyong לְדָוִד
  choice: Kay David
  alternative: Ni David / Para kay David
  rationale: Hindi tiyak sa pang-ukol na לְ lamang kung awtor, pinag-ukulan, o kaugnayan ang tinutukoy; inilalahad sa talababa ang mga lehitimong posibilidad.
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Inilalantad ang tetragrammaton bilang personal na pangalan at iniiwasang palitan ito ng titulong maaaring magkubli sa leksikal na pagkakaiba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang maikling superskripsiyon, ang dalawang metapora, at ang magkatapat na retorikal na tanong ng Hebreo.
