  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: tl
  text: At ngayon, tataas ang ulo ko nang higit sa mga kaaway na nakapaligid sa akin; mag-aalay ako sa kanyang tolda[a] ng mga haing may sigaw ng kagalakan[b]. Aawit ako, oo, tutugtog ako para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang” ay pinakamalamang na tumutukoy kay Yahweh.
    reason: referent_clarification
  - marker: b
    text: O “mga hain ng masayang pagbubunyi.” Maaaring idiin ng pariralang Hebreo ang katangian ng mga hain o ang sigaw na kasabay ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang paglipat sa kasalukuyan o nalalapit na pagbabago ng kalagayan.
- source_word: יָרוּם רֹאשִׁי
  choice: tataas ang ulo ko
  rationale: Pinananatili ang larawang Hebreo ng ulo bilang tanda ng dangal, pagtitiwala, at pagtatagumpay, at ang diwang inaasahan ng imperpektibo.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: sa ibabaw ng mga kaaway na nakapaligid sa akin
  rationale: Ipinahahayag ng עַל ang pagiging nakahihigit sa mga kaaway, samantalang inilalarawan ng סְבִיבוֹתַי na pinalilibutan nila ang salmista.
- source_word: וְאֶזְבְּחָה
  choice: Mag-aalay ako
  rationale: Ang cohortative ay nagpapahayag ng matibay na hangarin; natural sa Filipino ang 'mag-aalay' kasunod ng tahasang layon na mga hain.
- source_word: בְאָהֳלוֹ
  choice: sa kanyang tolda
  rationale: Pinananatili ang panghalip at ang larawan ng santuwaryong tolda nang hindi pinapalitan ng mas tradisyonal ngunit di-gaanong payak na 'tabernakulo.'
- source_word: זִבְחֵי תְרוּעָה
  choice: mga haing may sigaw ng kagalakan
  rationale: Ipinakikita ang mga hain at ang malakas na masayang pagbubunyi, habang inilalagay sa talababa ang posibleng ugnayang naglalarawan mismo sa katangian ng mga hain.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: Aawit ako at tutugtog ako
  rationale: Pinananatili ang magkatambal na mga pandiwa ng pag-awit at paggawa ng musika bilang mga pahayag ng kusang pagpupuri.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Isinasalin ang banal na pangalang יהוה bilang 'Yahweh' at ipinahahayag ng 'para kay' ang pinag-uukulan ng awit at musika.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit sa tekstong Hebreo ang mismong pangalan ng Diyos; pinananatili ito bilang 'Yahweh' sa halip na palitan ng isang titulo.
- issue: Tinutukoy ng hulaping panghalip sa בְאָהֳלוֹ
  choice: ang kanyang tolda, na pinakamalamang ay tolda ni Yahweh
  alternative: tolda ng salmista
  rationale: Mas natural sa konteksto ng paghahain at pagpupuri na tumukoy ang panghalip kay Yahweh, ngunit hindi pinapalitan sa pangunahing teksto ng tahasang 'tolda ni Yahweh' upang mapanatili ang anyo at bahagyang kalabuan ng Hebreo.
- issue: Ugnayan ng זִבְחֵי at תְרוּעָה
  choice: mga haing sinasabayan ng sigaw ng kagalakan
  alternative: mga haing ang katangian ay masayang pagbubunyi
  rationale: Maaaring tukuyin ng pariralang construct ang kasabay na pagbubunyi o ang masayang katangian ng mga hain; pinili sa teksto ang mas natural na Filipino at itinabi sa talababa ang ibang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalinghagang “tataas ang ulo ko,” ang larawan ng tolda bilang santuwaryo, at ang masiglang tunog ng pagbubunyi nang hindi gumagamit ng labis na teknikal o denominasyonal na pananalita.
