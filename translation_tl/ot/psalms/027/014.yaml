id: PSA.27.14
reference: Psalms 27:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: tl
  text: Maghintay ka kay Yahweh[a]; magpakatatag ka, at magpakatatag din ang puso mo[b]. Oo, maghintay ka kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Maghintay ka kay” ay maaari ring isaling “Umasa ka kay.” Ipinahihiwatig ng salitang Hebreo ang matiyagang paghihintay na may pagtitiwala at pag-asa.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “at palalakasin niya ang puso mo.” Maaaring basahin ang pandiwang Hebreo bilang panghihikayat o bilang pahayag tungkol sa gagawin ni Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: Maghintay ka / Oo, maghintay ka
  rationale: Ang piel imperative ng קוה ay tumutukoy sa matiyagang paghihintay na may pagtitiwala at pag-asa. Pinananatili ang pag-uulit bilang mariing pangwakas na panawagan.
- source_word: אֶל
  choice: kay
  rationale: Kasama ng קוה, itinuturo ng pang-ukol ang persona na pinagtutuunan ng naghihintay na pagtitiwala. Ang “kay Yahweh” ay natural sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: חֲזַק
  choice: magpakatatag ka
  rationale: Pinananatili nito ang tuwirang pautos at hindi nililimitahan kung moral, emosyonal, o espirituwal ang katatagang hinihingi.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: at magpakatatag din ang puso mo
  rationale: Ipinapahayag nito sa natural ngunit marangal na Tagalog ang posibleng exhortational/jussive na diwa at pinananatili ang tahasang larawan ng “puso.” Ang “din” ay nag-uugnay sa ikalawang panawagan sa naunang “magpakatatag ka” nang hindi binubura ang ambiguwidad sa talababa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulong “Panginoon.”
- issue: Talab ng וְיַאֲמֵץ
  choice: 'Pakiusap/panghikayat: “magpakatatag din ang puso mo”'
  alternative: 'Pahayag/pangako: “palalakasin niya ang puso mo”'
  rationale: Maaaring ituring ang anyo bilang nagpapatuloy sa sunod-sunod na panghihikayat, ngunit maaari rin itong basahin bilang pahayag na si Yahweh ang magpapalakas. Nasa pangunahing teksto ang panghikayat at malinaw na iniingatan sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang paralelismo, pag-uulit, at metapora ng puso. Ginamit ang “magpakatatag” upang maiwasan ang labis na kolokyal na “lakasan ang loob,” habang ang “Oo” ay naghahatid ng mariing pag-uulit sa huling linya.
