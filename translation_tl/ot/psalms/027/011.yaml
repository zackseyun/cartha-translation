base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: tl
  text: 'Ituro mo sa akin ang iyong daan, Yahweh,

    at akayin mo ako sa patag na landas

    dahil sa mga kaaway ko.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa mga nagmamatyag sa akin nang may pagkapoot.” Ang salitang Hebreo ay maaaring tumukoy sa mga kaaway, kabilang ang mga kalabang nag-aabang o nagmamatyag ng pagkakataong makapinsala sa salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Ituro mo sa akin
  rationale: Ang Hiphil ng ירה ay nangangahulugang magturo o magbigay-aral. Pinananatili ng “Ituro mo sa akin” ang diwang humihiling ng pagtuturo at likas itong pakinggan sa isang panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: דַּרְכֶּךָ
  choice: iyong daan
  rationale: Ang דֶּרֶךְ ay maaaring tumukoy sa literal na landas at sa paraan ng pamumuhay; pinananatili ng “iyong daan” ang dalawang posibleng diwa.
- source_word: וּנְחֵנִי
  choice: at akayin mo ako
  rationale: Ang נחה ay “umakay” o “pumatnubay.” Ang “akayin” ay malinaw na nagpapanatili sa larawan ng paglalakbay sa isang landas.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: sa patag na landas
  rationale: Ang אֹרַח ay landas, at ang מִישׁוֹר ay pangunahing tumutukoy sa patag o pantay na lupa. Pinananatili ng salin ang kongkretong larawan habang hinahayaang marinig din ang pahiwatig ng matuwid at ligtas na landasin.
- source_word: לְמַעַן
  choice: dahil sa
  rationale: Sa kontekstong ito, ipinakikilala nito ang dahilan ng kahilingan kaugnay ng mga taong laban sa salmista.
- source_word: שׁוֹרְרָי
  choice: mga kaaway ko
  rationale: Malinaw at natural na salin ito para sa mga kalabang may masamang hangarin. Inilagay sa talababa ang posibleng mas tiyak na diwa ng mga nagmamatyag nang may pagkapoot.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang makabagong transliterasyon, sa halip na palitan ito ng isang titulo.
- issue: Larawan ng “patag na landas”
  choice: patag na landas
  alternative: matuwid na landas
  rationale: Pinili ang pangunahing kongkretong kahulugan ng מִישׁוֹר at hindi nilimitahan ang taludtod sa moral na kahulugan lamang; nananatiling posible ang pahiwatig ng katuwiran.
translation_notes:
  register: Makabago, natural, at marangal na Filipino para sa panalangin. Ginamit ang “akayin” upang mapanatili ang malinaw na larawan ng paglalakbay, at ang talababa ay ikinabit sa “mga kaaway ko,” ang salitang tinutukoy nito.
