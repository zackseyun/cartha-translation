  source_fidelity: 'Tumpak na naisasalin ang mga pangunahing elemento ng Hebreo: ang hiling na turuan (הוֹרֵנִי), ang pangalan na Yahweh, ang “iyong daan,” ang pag-akay sa “patag na landas,” at ang dahilan kaugnay ng mga kaaway. Ang “patag” ay angkop para sa pangunahing larawan ng מִישׁוֹר at hindi isinasara ang posibleng matalinghagang pahiwatig.'
