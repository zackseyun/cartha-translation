base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: tl
  text: Sapagkat ikukubli niya ako sa kanyang silungan[a] sa araw ng kapahamakan[b]; itatago niya ako sa tagong dako ng kanyang tolda; itataas niya ako sa ibabaw ng isang bato.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanyang kubol,” “sa kanyang pabilyon,” o “sa kanyang tabernakulo.” Ang salitang Hebreo ay tumutukoy sa isang istrukturang pananggalang at maaari ring magpahiwatig ng santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa araw ng kasawian” o “sa araw ng kagipitan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ilalagay niya ako sa mataas na dako sa ibabaw ng isang bato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng pagtitiwala ng mang-aawit sa naunang konteksto.
- source_word: יִצְפְּנֵנִי
  choice: ikukubli niya ako
  rationale: Ipinahahayag ng צפן ang pagkukubli na may layuning ingatan; natural at marangal ang “ikukubli” sa makabagong Filipino.
- source_word: בְּסֻכּוֹ
  choice: sa kanyang silungan
  rationale: Ang סֻכָּה ay isang kubol o istrukturang pananggalang. Pinananatili ng “silungan” ang kongkretong larawan at di nito nililimitahan ang kahulugan sa santuwaryo.
- source_word: בְּיוֹם רָעָה
  choice: sa araw ng kapahamakan
  rationale: Sa konteksto, ang רָעָה ay tumutukoy sa kasawian o matinding kagipitan, hindi pangunahing sa moral na kasamaan.
- source_word: יַסְתִּרֵנִי
  choice: itatago niya ako
  rationale: Pinananatili ang paralelismo ng dalawang pandiwa ng pagkukubli habang iniiwasan ang eksaktong pag-uulit.
- source_word: בְּסֵתֶר
  choice: sa tagong dako
  rationale: Malinaw na ipinahahayag ang lokatibong larawan ng isang lihim o nakatagong lugar.
- source_word: אָהֳלוֹ
  choice: ng kanyang tolda
  rationale: Kongkretong katumbas ng אֹהֶל ang “tolda”; maaari nitong pahiwatigang santuwaryo nang hindi tahasang ipinapasok iyon sa salin.
- source_word: בְּצוּר
  choice: sa ibabaw ng isang bato
  rationale: Pinananatili ang larawan ng matibay at mataas na lugar ng kaligtasan.
- source_word: יְרוֹמְמֵנִי
  choice: itataas niya ako
  rationale: Tumpak na inilalarawan ang pag-aangat o paglalagay sa mataas na kalagayan, nang hindi ginagawang abstraktong “dadakilain.”
theological_decisions:
- issue: Posibleng pahiwatig ng santuwaryo sa סֻכּוֹ at אָהֳלוֹ
  choice: Gamitin ang “silungan” at “tolda,” na nagpapanatili sa larawan ng proteksiyon at bukas pa rin sa pahiwatig ng santuwaryo.
  alternative: Isalin bilang “tabernakulo,” “santuwaryo,” o iba pang tahasang terminong panritwal.
  rationale: Karaniwang kongkretong pangngalan ang mga salitang Hebreo. Posible ang kaugnayan sa santuwaryo, ngunit hindi ito dapat gawing tiyak kung hindi hinihingi ng teksto.
- issue: Kahulugan ng רָעָה sa pariralang בְּיוֹם רָעָה
  choice: Kapahamakan o kasawian
  alternative: Moral na kasamaan
  rationale: Ang konteksto ay tungkol sa panahong may panganib at kagipitan kung kailan humihingi ng proteksiyon ang mang-aawit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong magkakaugnay na larawan—silungan, tagong dako ng tolda, at mataas na bato—at ang paralelismo ng dalawang pandiwa ng pagkukubli.
