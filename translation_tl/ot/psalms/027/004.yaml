id: PSA.27.4
reference: Psalms 27:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: tl
  text: 'Isang bagay ang hiniling ko kay Yahweh[a]; ito ang hahanapin ko: na manirahan ako sa bahay ni Yahweh sa lahat ng araw ng aking buhay, upang pagmasdan ang kagandahan[b] ni Yahweh at sumangguni[c] sa kanyang templo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang kaaya-ayang katangian ni Yahweh” o “ang lingap ni Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “maghanap” o “magnilay.” Mahirap tiyakin ang tiyak na diwa ng pandiwang Hebreo rito; maaaring tumukoy ito sa masusing pagtatanong, paghahanap, o pagmumuni sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת שָׁאַלְתִּי
  choice: Isang bagay ang hiniling ko
  rationale: Ang pambabaeng pang-isahang bilang ay ginagamit bilang pangngalan at binibigyang-diin ang iisang kahilingan. Natural sa modernong Tagalog ang “isang bagay ang hiniling ko.”
- source_word: מֵאֵת יְהוָה
  choice: kay Yahweh
  rationale: Ipinapakita ng parirala kung kanino iniharap ang kahilingan. Ang “kay” ang natural na katumbas sa Tagalog sa pandiwang “hiniling.”
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: ito ang aking hahangarin
  rationale: Inuulit ng panghalip ang iisang kahilingan, at ang di-ganap na pandiwa ay nagpapahayag ng nagpapatuloy o matatag na layunin. Ang “hahangarin” ay akma sa saklaw ng paghahanap at masidhing pagnanais.
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  choice: na manirahan ako sa bahay ni Yahweh
  rationale: Ang anyong may hulaping unang panauhan ay nagsasaad ng nilalaman ng kahilingan. Pinananatili ng “manirahan” ang diwa ng pananatili, at ng “bahay” ang imahen ng tahanan at lugar ng pagsamba.
- source_word: כָּל יְמֵי חַיַּי
  choice: sa lahat ng araw ng aking buhay
  rationale: Malapit ito sa pahayag ng Hebreo at malinaw na tumutukoy sa buong haba ng buhay.
- source_word: לַחֲזוֹת
  choice: upang pagmasdan
  rationale: Ipinahihiwatig ng pawatas ang layunin. Ang “pagmasdan” ay higit sa karaniwang pagtingin at angkop sa mapagnilay na konteksto.
- source_word: בְּנֹעַם יְהוָה
  choice: ang kagandahan ni Yahweh
  rationale: Maaaring tumukoy ang נֹעַם sa kagandahan, kaaya-ayang katangian, o lingap. Ang “kagandahan” ay natural at marangal, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: וּלְבַקֵּר
  choice: at magsiyasat
  rationale: Mahirap tiyakin ang tiyak na diwa ng pandiwa rito. Pinananatili ng “magsiyasat” ang ideya ng masusing paghahanap o pagtatanong sa santuwaryo nang hindi isinasara ang posibilidad ng mapagnilay na kahulugan.
- source_word: בְּהֵיכָלוֹ
  choice: sa kanyang templo
  rationale: Sa konteksto ng pagsamba, ang הֵיכָל ay tumutukoy sa templo o santuwaryo. Ang “templo” ang tuwiran at madaling maunawaang katumbas.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo; binabanggit sa talababa ang tradisyonal na salin.
- issue: Saklaw ng נֹעַם יְהוָה
  choice: ang kagandahan ni Yahweh
  alternative: ang kaaya-ayang katangian ni Yahweh; ang lingap ni Yahweh
  rationale: Hindi ganap na nilulutas ng konteksto kung pisikal na talinghaga, kaaya-ayang presensiya, o lingap ang nangingibabaw. Ginamit ang natural na “kagandahan” at pinanatili sa talababa ang ibang posibleng diwa.
- issue: Diwa ng וּלְבַקֵּר sa templo
  choice: magsiyasat
  alternative: maghanap; magnilay
  rationale: Maaaring magpahiwatig ang pandiwa ng masusing pagsisiyasat, paghahanap, o mapagnilay na pagdulog. Hindi nilulutas nang dogmatiko ang malabong leksikal na ito; inilalahad ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang makatang tindig. Iniwasan ang sobrang arkaikong bokabularyo, ngunit pinanatili ang pag-uulit ng “Yahweh,” ang imahen ng “bahay,” at ang leksikal na tensiyon sa “kagandahan” at “magsiyasat.”
