  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: tl
  text: Nang lumapit sa akin ang mga gumagawa ng masama upang lamunin ang aking laman[a]—ang aking mga kalaban at mga kaaway—sila ang natisod at nabuwal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “kainin ang aking laman.” Isa itong matingkad na larawan ng marahas na pagsalakay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
  choice: Nang lumapit
  rationale: 'Ang infinitive construct na may בִּ ay temporal: “nang” o “habang.” Natural sa Tagalog ang “Nang lumapit” at pinananatili nito ang kilos ng paglapit.'
- source_word: מְרֵעִים
  choice: mga gumagawa ng masama
  rationale: Ang participle ay tumutukoy sa mga taong gumagawa ng masama. Mas malinaw at natural ito sa modernong Tagalog kaysa sa “mga masasamang tao,” na maaaring magtunog na paglalarawan lamang ng katangian.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: upang lamunin ang aking laman
  rationale: Pinananatili ng “lamunin” ang marahas at matingkad na larawan ng literal na “kainin,” habang ang “aking laman” ay hindi nagpapalabo sa metapora.
- source_word: צָרַי וְאֹיְבַי לִי
  choice: ang aking mga kaaway at mga kalaban
  rationale: Pinananatili ang dalawang magkatambal na katawagan sa Hebreo. Hindi na hiwalay na isinalin ang לִי bilang “laban sa akin” dahil likas na itong ipinahihiwatig ng “aking” at magiging paulit-ulit sa Tagalog.
- source_word: הֵמָּה
  choice: sila ang
  rationale: 'Ipinahahayag ng ayos na “sila ang” ang diin ng hiwalay na panghalip sa Hebreo: ang mismong mga sumalakay ang bumagsak.'
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: natisod at nabuwal
  rationale: Pinananatili ang sunod na larawan ng pagkatisod at pagbagsak nang hindi tinutukoy kung pisikal, militar, o matalinghaga ang pagkatalo.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na ritmo para sa salmo. Ginamit ang “lamunin” upang maging natural ngunit mapanatili ang marahas na larawan ng Hebreo; ang gitling ay nagpapakita na ang “aking mga kaaway at mga kalaban” ay tumutukoy rin sa naunang “mga gumagawa ng masama.”
