  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: tl
  text: Huwag mo akong ibigay sa kagustuhan ng aking mga kalaban[a], sapagkat bumangon laban sa akin ang mga bulaang saksi, at nagbubuga sila ng karahasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa kalooban ng aking mga kalaban.” Ang Hebreong נֶפֶשׁ dito ay malamang na nangangahulugang kagustuhan, pita, o kalooban, hindi “kaluluwa” sa makitid na diwa.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin ang hulihan na “at isang nagbubuga ng karahasan” o iugnay ito bilang paglalarawan sa mga bulaang saksi: “na nagbubuga ng karahasan.” Ang anyong Hebreo ay nasa isahan ngunit maaaring gamitin nang kolektibo o pamahagi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: ibigay mo ako
  rationale: Ang נתן na may אַל at hulaping tumutukoy sa nagsasalita ay nangangahulugang huwag siyang ibigay o ipaubaya sa kapangyarihan ng iba. Likas sa Filipino ang pariralang “Huwag mo akong ibigay.”
- source_word: בְּנֶפֶשׁ
  choice: sa kagustuhan ng
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa nais, pita, o kalooban, hindi lamang sa “kaluluwa.” Pinananatili ng “kagustuhan” ang diwang nais gawin ng mga kalaban sa salmista.
- source_word: צָרָי
  choice: aking mga kalaban
  rationale: Tumutukoy ito sa mga taong kumakalaban o naninindak. Ang “mga kalaban” ay natural at malawak ang saklaw sa modernong Filipino.
- source_word: קָמוּ בִי
  choice: bumangon laban sa akin
  rationale: Ang קום na may בְּ laban sa isang tao ay karaniwang nangangahulugang bumangon o tumindig laban sa kaniya. Pinananatili rito ang larawan ng tekstong Hebreo.
- source_word: עֵדֵי שֶׁקֶר
  choice: mga bulaang saksi
  rationale: Ito ay mga saksing nagbibigay ng kasinungalingan. Ang “mga bulaang saksi” ay maikli, natural, at angkop sa legal na tagpo.
- source_word: וִיפֵחַ חָמָס
  choice: at nagbubuga sila ng karahasan
  rationale: Ang יפח ay naglalarawan ng paghinga, pagbuga, o pagbigkas, at ang חָמָס ay marahas na kasamaan o karahasan. Ang “nagbubuga sila ng karahasan” ay nagpapanatili sa matingkad na talinghaga habang inuugnay nang natural ang parirala sa mga bulaang saksi.
- source_word: חָמָס
  choice: karahasan
  rationale: Karaniwang ipinahihiwatig ng salita ang karahasan, malupit na kasamaan, o marahas na kawalang-katarungan. “Karahasan” ang tuwiran at pinakamatibay na katumbas dito.
