translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bulaang saksi” upang mapanatili ang legal na himig, at ang “nagbubuga ng karahasan” upang mapanatili ang matinding larawang Hebreo nang hindi tahasang nilulutas ang kalabuan ng bilang; ipinaliwanag ito sa talababa.
