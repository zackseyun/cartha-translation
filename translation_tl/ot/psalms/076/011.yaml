base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: tl
  text: Manata kayo kay Yahweh na inyong Diyos, at tuparin ninyo ang inyong mga panata. Lahat ng nakapalibot sa kanya ay magdala ng handog[a] sa Kinatatakutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaloob,” “regalo,” o “tributo.” Ang salitang Hebreo ay tumutukoy sa kaloob na inihaharap sa isang pinararangalan o nakatataas, at maaaring may diwang pagkilala sa kapangyarihan o katayuang pampolitika.
    reason: lexical_alternative
  - marker: b
    text: O “sa Isa na dapat katakutan.” Binibigyang-diin ng titulong Hebreo na ang Diyos ang nararapat katakutan at pagpitaganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Mangako kayo
  rationale: Maramihang pautos mula sa נדר, na tumutukoy sa paggawa ng panata. Likas sa makabagong Tagalog ang “mangako,” habang nililinaw ng kasunod na pariralang “inyong mga panata” ang uri ng pangako.
- source_word: וְשַׁלְּמוּ
  choice: at tuparin ninyo ang inyong mga panata
  rationale: Ang שלם dito ay nangangahulugang bayaran o ganapin ang ipinangakong panata. Ang “tuparin” ang pinakanatural at malinaw na katumbas sa Tagalog; tahasang inuulit ang “mga panata” na ipinahihiwatig lamang sa Hebreo.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: kay Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh,” at inilalahad ang אֱלֹהֵיכֶם bilang appositional na “inyong Diyos.”
- source_word: כָּל סְבִיבָיו
  choice: Lahat ng nasa palibot niya
  rationale: Tumutukoy ang parirala sa lahat ng tao o mga bayan sa palibot niya, hindi lamang sa mga lugar. Pinananatili ng salin ang lawak ng sanggunian nang hindi nagpapasya kung mga indibidwal o mga bansa ang tinutukoy.
- source_word: יוֹבִילוּ
  choice: ay magdala
  rationale: Ang Hiphil ng יבל ay nangangahulugang magdala o maghatid, lalo na ng kaloob. Ang “magdala” ay natural at angkop sa konteksto.
- source_word: שַׁי
  choice: handog
  rationale: Ang שַׁי ay kaloob na inihaharap sa isang nakatataas o pinararangalan. Natural at marangal ang “handog” sa Tagalog, samantalang ipinapaliwanag sa talababa ang posibleng diwang regalo o tributo.
- source_word: לַמּוֹרָא
  choice: sa Kinatatakutan
  rationale: Ang מוֹרָא ay kaugnay ng takot, pangamba, at pagpipitagan, at dito ay ginagamit bilang titulo para sa Diyos. Pinananatili ng “Kinatatakutan” ang matinding diwa at hindi ito pinapahina tungo sa karaniwang papuri lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pag-unawa sa לַמּוֹרָא bilang titulo para sa Diyos
  choice: sa Kinatatakutan
  alternative: sa Isa na dapat katakutan; sa Kakila-kilabot na Isa
  rationale: Binibigyang-diin ng konteksto ang nakapanghihilakbot na kamahalan ng Diyos. Pinananatili ng salin ang tensiyon ng takot at pagpipitagan nang hindi ito ginagawang basta paghanga lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga panata” upang gawing hayag ang layon na ipinahihiwatig ng ikalawang pandiwa sa Hebreo. Ang “Kinatatakutan” ay sinadyang panatilihing matindi at bahagyang makata bilang isang banal na titulo.
