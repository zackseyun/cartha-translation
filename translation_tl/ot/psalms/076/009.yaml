  yaml_path: translation/ot/psalms/076/009.yaml
  text: when God rises for judgment[a], to save all the humble of the earth[b]. Selah
translation:
  language: tl
  text: 'Nang bumangon ang Diyos upang humatol,

    upang iligtas ang lahat ng mapagpakumbaba[a] sa lupa[b]. Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga maamo”; o, “mga api.”
    reason: lexical_alternative
  - marker: b
    text: O, “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/קוּם
  choice: Nang bumangon
  rationale: Ang בְּ na kasunod ng infinitive construct ng קוּם ay temporal. Likas sa Filipino ang “nang bumangon,” at hindi ipinipilit ng anyong Hebreo ang isang tiyak na panahunan nang hiwalay sa konteksto.
- source_word: לַ/מִּשְׁפָּט
  choice: upang humatol
  rationale: Ipinahahayag nito ang layunin ng pagbangon ng Diyos para sa gawaing panghukuman. Mas natural sa Filipino ang pandiwang “humatol” kaysa sa literal na “para sa paghatol,” habang pinananatili ang legal na diwa ng מִשְׁפָּט.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, iisa ang tinutukoy rito; “Diyos” ang karaniwang salin.
- source_word: לְ/הוֹשִׁיעַ
  choice: upang iligtas
  rationale: Ang Hiphil infinitive ng ישׁע ay tumutukoy sa pagliligtas o pagsagip. Malinaw at malawak ang saklaw ng “iligtas.”
- source_word: כָּל
  choice: lahat ng
  rationale: Kolektibong tinutukoy ng כָּל ang buong pangkat.
- source_word: עַנְוֵי
  choice: mga mapagpakumbaba
  rationale: Maaaring tumukoy ang עָנָו sa mapagpakumbaba, maamo, o api. Pinananatili ng “mapagpakumbaba” ang mahalagang diwang asal at espirituwal nang hindi ikinakaila ang panlipunang dimensiyon; nasa talababa ang ibang posibilidad.
- source_word: אֶרֶץ
  choice: lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng buong lupa o ng isang lupain. Ang “lupa” ay angkop sa malawak na saklaw ng taludtod, habang inilalagay sa talababa ang “lupain.”
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa pamamagitan ng transliterasyon sapagkat hindi tiyak ang kahulugan at malamang na isa itong panandang musikal o liturhiko.
theological_decisions:
- issue: Saklaw ng kahulugan ng עַנְוֵי
  choice: mga mapagpakumbaba
  alternative: mga maamo; mga api
  rationale: Hindi nilulutas nang sapilitan kung pangunahing tinutukoy ang kababaang-loob, kaamuan, o kalagayan ng pagkaapi. Ang pangunahing salin ay malawak, at pinananatili sa talababa ang tunay na mga alternatibo.
- issue: Diwa ng מִשְׁפָּט
  choice: upang humatol
  alternative: para sa katarungan
  rationale: Binibigyang-diin ng konteksto ang pagkilos ng Diyos bilang hukom. Gayunman, hindi nito itinatanggi na ang layunin ng paghatol ay katarungan, lalo na sa pagliligtas sa mga aba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatugmang “upang humatol / upang iligtas” para malinaw ang dalawang layuning kaugnay ng pagbangon ng Diyos. Pinanatili ang “Selah” bilang di-tiyak na panandang nasa tekstong Hebreo.
