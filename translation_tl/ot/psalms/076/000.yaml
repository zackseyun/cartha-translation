  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika[a]; may kasamang mga instrumentong de-kuwerdas. Isang salmo ni Asaf[b], isang awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Para sa direktor ng musika.”
    reason: alternative_rendering
  - marker: b
    text: Ang “ni Asaf” ay maaaring magpahiwatig na siya ang sumulat, na ang awit ay kaugnay ng pangkat ng mga mang-aawit na nagmula o pinangalanan kay Asaf, o na ito ay inialay para kay Asaf.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Likas at malinaw sa modernong Filipino ang pariralang ito nang hindi nililimitahan ang tungkulin sa koro lamang.
- source_word: בִּנְגִינֹת
  choice: gamit ang mga instrumentong de-kuwerdas
  rationale: Tumutukoy ang salita sa musikang tinutugtog sa mga instrumentong may kuwerdas; pinananatili ng salin ang tiyak na instrumental na kahulugan nang hindi dinaragdagan ang paraan ng pagtugtog.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ito sa uring pampanitikan at pangmusika ng komposisyon, at naihihiwalay ito sa kasunod na katawagang 'awit.'
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Maikli at likas itong anyo sa Filipino. Maaaring ipahiwatig ng Hebreong לְ ang pagkatha, kaugnayan, pag-aari, o paghahandog; nililinaw sa talababa ang saklaw ng kahulugan.
- source_word: שִׁיר
  choice: isang awit
  rationale: Pinananatili nito ang ikalawang katawagan sa uri ng komposisyon at ang magkatabing paglalarawang 'salmo' at 'awit.'
theological_decisions:
- issue: Ang kaugnayan ni Asaf sa salmo
  choice: ni Asaf
  alternative: para kay Asaf / kaugnay ni Asaf
  rationale: Hindi tiyak na personal na pagkatha lamang ang kahulugan ng לְאָסָף. Ginamit ang natural na maikling anyo sa pangunahing teksto, habang tahasang pinananatili sa talababa ang iba pang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'tagapangasiwa ng awitan' sa halip na mas teknikal o makitid na 'tagakumpas ng koro,' at pinanatili ang dalawang magkaibang tagubilin sa pagtatanghal sa pamamagitan ng tuldok-kuwit.
