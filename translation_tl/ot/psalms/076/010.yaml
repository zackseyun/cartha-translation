  source_fidelity: 'Tumpak na isinasalin ng teksto ang כִּי bilang “Sapagkat,” ang חֲמַת אָדָם bilang “poot ng tao,” at ang תּוֹדֶךָּ bilang “pupurihin ka.” Ang huling sugnay ay wastong pinananatiling metaporikal: ang Diyos ang simuno ng ikalawang panauhang pandiwa, at ang “nalalabing poot” ang bagay na ibinibigkis sa sarili. Hindi nito nilulutas nang labis ang kilalang kahirapan ng Hebreo.'
  naturalness: Marangal, patula, at malinaw ang modernong Filipino. Ang “ibibigkis mo sa iyong sarili” ay bahagyang di-karaniwan, ngunit ang pagka-di-karaniwan nito ay angkop na katapat ng sadyang mahirap at metaporikal na Hebreong parirala; malinaw pa rin ang kayarian nito.
  terminology: Ang “poot” ay angkop na matinding katumbas ng חֵמָה. Ang “tao” ay nananatiling pangkalahatang katawagan at ang talababa ay wastong nagpapaliwanag na tumutukoy ito sa sangkatauhan. Ang “nalalabing” ay akmang salin ng שְׁאֵרִית sa kontekstong patula.
