  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: tl
  text: Sapagkat pupurihin ka ng poot ng tao[a]; ibibigkis mo sa iyong sarili ang nalalabing poot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tao” rito ay tumutukoy sa sangkatauhan sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “pipigilin mo ang nalalabing poot.” Mahirap unawain ang Hebreo ng huling sugnay; mas malapit sa anyong Masoretiko ang pangunahing teksto at pinananatili nito ang metapora.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang sanhi o paliwanag na kaugnayan ng talata sa naunang panawagan, sa paraang natural at marangal sa Filipino.
- source_word: חֲמַת אָדָם
  choice: poot ng tao
  rationale: Ang חֵמָה ay matinding poot o galit, at ang אָדָם ay tumutukoy rito sa tao o sangkatauhan sa pangkalahatan. Pinananatili ng parirala ang payak at patulang anyo ng Hebreo.
- source_word: תּוֹדֶךָּ
  choice: pupurihin ka
  rationale: Ang Hiphil ng ידה ay karaniwang nangangahulugang magpasalamat o pumuri. Sa kontekstong ito, ang poot ng tao ay nauuwi sa kapurihan ng Diyos, kaya mas angkop ang “pupurihin ka.”
- source_word: שְׁאֵרִית
  choice: nalalabi
  rationale: Tumutukoy ito sa natira o nalalabing bahagi. Ang “nalalabi” ay natural sa Filipino at malinaw na pinananatili ang larawan ng natirang poot.
- source_word: חֵמֹת
  choice: poot
  rationale: Bagaman maramihan ang anyo sa Hebreo, likas na pangngalang di-mabilang ang “poot” sa Filipino; ang literal na maramihang anyo ay magiging alanganin at maaaring magpahiwatig ng ibang kahulugan.
- source_word: תַּחְגֹּר
  choice: ibibigkis mo sa iyong sarili
  rationale: Ang חגר ay ang pagbibigkis o pagtatali sa palibot ng sarili, kadalasan kaugnay ng kasuotan o sandata. Pinananatili ng salin ang metapora nang hindi ipinapasiya kung ito ay pagsusuot, pagsasandata, o pagpigil.
theological_decisions:
- issue: Kahulugan ng huling sugnay na שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: Ang Diyos ang simuno at “ibibigkis” niya sa kanyang sarili ang nalalabing poot.
  alternative: Pipigilin mo ang nalalabing poot; o maligayang papalibot sa iyo ang nalalabing poot.
  rationale: Ang pandiwang nasa ikalawang panauhang panlalaki na isahan ay likas na tumutukoy sa Diyos bilang simuno. Mahirap at pinagtatalunan ang sugnay, kaya sinusunod ng pangunahing teksto ang pagkakapunto ng Masoretic Text at pinananatili ang metapora sa halip na lutasin ito sa pamamagitan ng pagpapakahulugan.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “poot” upang mapanatili ang tindi ng חֵמָה, at ang hindi pangkaraniwang larawang “ibibigkis mo sa iyong sarili” upang huwag ikubli ang tunay na hirap at kalabuan ng tekstong Hebreo.
