  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: tl
  text: Mula sa langit ay ipinarinig mo ang hatol[a]; natakot ang daigdig[b] at tumahimik[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ipinarinig mo ang iyong paghatol.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “daigdig” bilang “lupain,” ngunit pumapabor sa mas malawak na kahulugan ang paghahambing dito ng langit at daigdig.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “natahimik” o “naging payapa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Mula sa langit
  rationale: Ang מִן ay nagsasaad ng pinagmulan, at ang שָׁמַיִם ay likas na naipapahayag sa modernong Tagalog bilang “langit.” Pinananatili nito ang makatang paghahambing ng langit at daigdig.
- source_word: הִשְׁמַעְתָּ
  choice: ipinarinig mo
  rationale: 'Ang anyong Hiphil ng שׁמע ay may sanhiang diwa: “ginawang marinig” o “ipinarinig.” Ang “ipinarinig mo” ay natural sa Tagalog at hindi kasing-interpretatibo ng “ipinahayag mo.”'
- source_word: דִּין
  choice: ang hatol
  rationale: Sa konteksto, tumutukoy ang דִּין sa pasiya o gawa ng Diyos bilang hukom. Ang “hatol” ay malinaw at nakatuon sa hudisyal na pasiya, samantalang ang “katarungan” ay mas malawak.
- source_word: אֶרֶץ
  choice: ang daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupain” o “daigdig,” ngunit ang pagtutol nito sa “langit” ay pumapabor sa mas malawak at kosmikong kahulugan.
- source_word: יָרְאָה
  choice: natakot
  rationale: Pinananatili ng “natakot” ang tuwiran at maikling lakas ng ירא sa konteksto ng banal na paghatol, nang hindi ito nililimitahan sa mas interpretatibong “namangha.”
- source_word: וְשָׁקָטָה
  choice: at tumahimik
  rationale: Ang שׁקט ay nagpapahiwatig ng katahimikan, pagkawalang-kilos, o pamamahinga matapos ang kaguluhan. Natural ang “tumahimik” sa Tagalog at maayos na kaagapay ng “natakot.”
theological_decisions:
- issue: Saklaw ng אֶרֶץ bilang katapat ng langit sa tula
  choice: ang daigdig sa pangkalahatan
  alternative: ang lupain, maaaring isang mas lokal na lupain o ang makalupang nasasakupan
  rationale: Ang “mula sa langit” at “ang daigdig” ay bumubuo ng kosmikong pagtutol na karaniwan sa tulang Hebreo. Pinananatili ng saling ito ang malawak na saklaw nang hindi nagdaragdag ng tiyak na pambansang pagtukoy.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino. Ginamit ang “ipinarinig” upang mapanatili ang sanhiang anyo ng Hebreo, “hatol” para sa hudisyal na diwa, at “daigdig” upang maipakita ang kosmikong pagtutol sa “langit.”
