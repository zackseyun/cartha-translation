  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: tl
  text: Sa iyong pagsaway[a], O Diyos ni Jacob, kapuwa nasadlak sa mahimbing na pagtulog ang karwahe at kabayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dahil sa iyong pagsaway” o “Mula sa iyong pagsaway.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “karwahe at kabayo,” isang makatang pagtukoy sa puwersang militar; nauunawaan ng ilan na kasama rin sa larawan ang mga nakasakay sa mga ito.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: Sa iyong pagsaway
  rationale: Maaaring ipahiwatig ng מִן ang pinagmulan o sanhi. Likas sa Filipino ang “sa iyong pagsaway” at naipahahayag nito ang dagliang bunga ng makapangyarihang pagsaway ng Diyos nang hindi nilulutas ang ugnayan bilang sanhi lamang.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: O Diyos ni Jacob
  rationale: Ang pariralang konstrukt ay isang titulong pantawag sa Diyos; ang “O” ay malinaw at marangal na naghuhudyat ng tuwirang pagtawag.
- source_word: נִרְדָּם
  choice: nawalan ng malay
  rationale: Ang Niphal ng רדם ay tumutukoy sa pagkalugmok sa mahimbing na tulog o kawalang-malay. Sa konteksto ng pagkatalo sa digmaan, ang “nawalan ng malay” ay likas sa modernong Filipino at pinananatili ang larawan ng lubos na pagkawala ng kakayahang kumilos nang hindi tahasang ginagawang kamatayan.
- source_word: וְרֶכֶב וָסוּס
  choice: kapuwa ... ang karwahe at ang kabayo
  rationale: Tapat nitong pinananatili ang dalawang pangngalan sa Hebreo at ipinakikita ng “kapuwa” ang pagkakaparis ng mga ito. Hindi nito pinapalitan ang karwahe ng mangangabayo, na magiging interpretatibong pagpapalawak.
theological_decisions:
- issue: Kalikasan ng pagkatalong inilalarawan
  choice: Inilalarawan ng pagsaway ng Diyos na lubusang nawalan ng kakayahang kumilos ang puwersang militar ng kaaway, sa pamamagitan ng larawan ng mahimbing na tulog o kawalang-malay.
  alternative: Maaari itong unawain bilang literal na pagtulog, o bilang makatang larawan ng kamatayan o ganap na pagkawasak.
  rationale: Ginagamit ng Hebreo ang נִרְדָּם, na nagpapanatili sa larawan ng malalim na tulog o stupor. Hindi dapat gawing tahasang kamatayan ang taludtod, ngunit hindi rin dapat bawasan ang larawan tungo sa ordinaryong pagtulog lamang.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang tuwirang pagtawag na “O Diyos ni Jacob,” ang pares na “karwahe at kabayo,” at ang makatang tensiyon sa pagitan ng mahimbing na tulog, kawalang-malay, at ganap na pagkatalo.
