lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: Ikaw—ikaw
  rationale: Pinananatili ang mariing pag-uulit ng panghalip sa Hebreo nang hindi nagdaragdag ng diwa ng pagiging bukod-tangi.
- source_word: נוֹרָא
  choice: dapat katakutan
  rationale: Ipinahahayag ang predikatibong diwa ng isang pumupukaw at karapat-dapat sa takot, habang nananatiling bukas sa sindak at mapitagang pagkatakot.
- source_word: וּמִי
  choice: at sino
  rationale: Likas na tinutumbasan ang pang-ugnay at pananong nang hindi ipinipilit ang salungatang diwa.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: ang makatatayo sa harap mo
  rationale: 'Sa retorikal na tanong, ipinahihiwatig ng anyong Hebreo ang kakayahan o posibilidad: walang makapananatili o makahaharap sa Diyos.'
- source_word: מֵאָז
  choice: mula nang
  rationale: Pinananatili ang panandang temporal na nangangahulugang mula sa panahong iyon o simula nang, sa halip na gawing payak na 'kapag.'
- source_word: אַפֶּךָ
  choice: mag-alab ang iyong galit
  rationale: Ang אַף ay idyomatikong tumutukoy sa galit; ang 'mag-alab' ay natural na Filipino para sa pagsisimula o pag-iral ng galit sa temporal na parirala.
theological_decisions:
- issue: Kalikasan ng pagkatakot sa Diyos
  choice: dapat katakutan
  alternative: kakila-kilabot; kasindak-sindak
  rationale: Pinananatili nito kapwa ang matinding sindak at ang nararapat na mapitagang pagkatakot, nang hindi nililimitahan ang salita sa panlabas na paglalarawan lamang.
- issue: Temporal na ugnayan ng galit ng Diyos
  choice: mula nang mag-alab ang iyong galit
  alternative: kapag nagagalit ka; sa panahon ng iyong galit
  rationale: Iginagalang ang מֵאָז bilang panandang nagsasaad ng simulang punto, habang ginagawang natural sa Filipino ang kaugnayan nito sa galit.
translation_notes:
  register: Makabagong, marangal, at patulang Filipino. Pinanatili ang mariing pag-uulit na “Ikaw—ikaw” at ang retorikal na tanong. Ginamit ang “makatatayo” ayon sa pormal na anyo ng panlaping maka- sa hinaharap/kontemplatibo.
