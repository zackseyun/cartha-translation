  source_fidelity: Ang pag-uulit na “Ikaw—ikaw,” ang retorikal na “at sino,” at ang “makatatayo sa harap mo” ay tapat sa Hebreo. Gayunman, ang “mag-alab” ay nagdaragdag ng larawan ng pagliyab na wala sa אַפֶּךָ. Ang מֵאָז ay mas maingat na maipapahayag bilang “mula nang ikaw ay magalit,” na pinananatili ang panimulang temporal na diwa nang walang dagdag na metapora.
  naturalness: Marangal at natural ang kabuuang Filipino. Ang “dapat katakutan” ay katanggap-tanggap na predikatibong pagsasalin ng נוֹרָא, bagaman may bahagyang deontikong himig; sa kontekstong patula ay malinaw itong nangangahulugang karapat-dapat katakutan. Mas natural at mas di-nagdaragdag ang “mula nang ikaw ay magalit” kaysa “mula nang mag-alab ang iyong galit.”
  terminology: Wasto ang “galit” para sa אַף sa idyomatikong gamit nito. Pinananatili ng “dapat katakutan” ang bigat ng banal na sindak at mapitagang pagkatakot; hindi nito pinapahina ang termino gaya ng posibleng epekto ng ilang makabagong gamit ng “kahanga-hanga.”
