  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: tl
  text: Nasa Salem[a] ang kanyang silungan[b], at nasa Sion ang kanyang tahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na iniuugnay ang Salem sa Jerusalem; magkatambal sa talata ang Salem at Sion bilang mga pangalan para sa lugar na tinitirhan ng Diyos.
    reason: cross_reference
  - marker: b
    text: Para sa “silungan,” maaari ring “tabernakulo,” “kubol,” o “pabilyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: nasa
  rationale: Sa konteksto, ang anyo ng היה ay nagsasaad ng kinaroroonan. Likas sa modernong Tagalog ang hulma na “Nasa … ang …” kaysa sa literal ngunit di-likas na “ay nasa.”
- source_word: בְשָׁלֵם
  choice: sa Salem
  rationale: Pinananatili ang tiyak na pangalang Salem sa halip na ipakahulugang Jerusalem, ayon sa mismong Hebreo.
- source_word: סֻכּוֹ
  choice: ang kanyang silungan
  rationale: Ang סֻכָּה ay isang kubol o kanlungang masisilungan. Malinaw at natural ang “silungan” at hindi nito ipinapasok ang teknikal na kultikong diwa ng “tabernakulo.”
- source_word: וּמְעוֹנָתוֹ
  choice: at … ang kanyang tahanan
  rationale: Ang מְעוֹנָה ay tirahan o tahanan. Ang “tahanan” ay maikli, marangal, at likas sa paralelismong patula.
- source_word: בְצִיּוֹן
  choice: nasa Sion
  rationale: Isinasalin ang צִיּוֹן sa nakaugaliang anyong Tagalog na “Sion,” habang pinananatili itong tiyak na pangalan.
theological_decisions:
- issue: Ugnayan ng Salem at Sion
  choice: Panatilihing magkahiwalay sa pangunahing teksto ang dalawang pangalan ng lugar.
  alternative: Isalin ang Salem bilang Jerusalem upang gawing tahasan ang tradisyonal na pagkakakilanlan.
  rationale: Magkatambal sa tula ang Salem at Sion bilang mga lugar ng tahanan ng Diyos. Ang pagpapanatili sa dalawang pangalan ay hindi tahimik na nagpapasya sa pagkakakilanlan ng Salem at pinananatili ang tekstuwal at teolohikal na himig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang likas na ayos na “Nasa … ang …” at pinanatili ang maikli at balanseng paralelismo ng tulang Hebreo.
