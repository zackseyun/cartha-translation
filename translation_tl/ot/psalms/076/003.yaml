    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: Doon
  rationale: Pang-abay na tumutukoy sa lugar na binanggit sa naunang konteksto; hindi inuulit sa talata ang pangalan ng lugar.
- source_word: שִׁבַּר
  choice: binali niya
  rationale: Ang Piel perfect ng שבר ay nagsasaad ng mariin at ganap na pagsira; natural sa Filipino ang “binali” para sa mga sandata, bagaman saklaw din ng kilos ang buong hanay na nagtatapos sa digmaan.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: ang nagliliyab na mga palaso ng pana
  rationale: Ang רֶשֶׁף ay maaaring tumukoy sa liyab o kislap at, sa kaugnayan nito sa pana, sa mga palaso. Pinananatili ng “nagliliyab na mga palaso” ang matingkad na larawang Hebreo nang hindi ikinukubli na mga palaso ang tinutukoy.
- source_word: מָגֵן
  choice: ang kalasag
  rationale: Karaniwan at malinaw na katumbas ng sandatang panangga.
- source_word: וְחֶרֶב
  choice: ang tabak
  rationale: Natural at marangal na modernong katawagan sa sandatang ito; ang pang-ugnay ay naipapakita sa ayos ng talaan.
- source_word: וּמִלְחָמָה
  choice: at ang digmaan
  rationale: Maaaring mangahulugang digmaan, pakikidigma, o labanan. Ang “digmaan” ay nagpapanatili sa malawak at pangwakas na saklaw ng salita matapos ilista ang mga sandata.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili bilang transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan at malamang na panandang musikal o liturhikal.
theological_decisions:
- issue: Ang di-hayag na simuno ng pandiwang panlalaking isahan
  choice: “niya,” na tumutukoy sa Diyos ayon sa konteksto
  alternative: Isang hindi tinukoy na panlalaking simuno
  rationale: Walang tahasang simuno sa mismong talata, ngunit ang Diyos ang kumikilos sa agarang konteksto. Hindi idinaragdag ang pangalang “Diyos” upang mapanatili ang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at patulang himig. Pinanatili ang maikling deiktikong “Doon,” ang di-hayag na pagkakakilanlan ng simuno sa pamamagitan ng “niya,” at ang tradisyonal na “Selah.”
