  terminology: Ang “kalasag,” “tabak,” at “digmaan” ay wasto at angkop sa modernong Filipino Tagalog na may pormal-patulang rehistro. Ang “mga palasong kumikislap” ay mas likas na ayos sa Tagalog at pinananatili ang matalinghagang larawan ng Hebreo.
