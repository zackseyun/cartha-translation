translation:
  language: tl
  text: Doon niya winasak ang mga palasong kumikislap ng pana[a], ang kalasag, ang tabak, at ang digmaan[b]. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nagliliyab na mga palaso ng pana” o, sa mas payak na salin, “ang mga palaso ng pana.” Ang salitang Hebreo ay literal na naglalarawan ng liyab o kislap.
    reason: lexical_alternative
  - marker: b
