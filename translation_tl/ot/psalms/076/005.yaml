  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: tl
  text: 'Sinamsaman ang mga malalakas ang loob;

    natulog sila sa kanilang tulog,

    at walang sinuman sa magigiting na mandirigma

    ang natagpuan ang kanilang mga kamay.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at walang sinuman sa magigiting na mandirigma ang nakagamit ng kanilang mga kamay”; ibig sabihin, nawalan sila ng kakayahang kumilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: sinamsaman
  rationale: Ang anyong ito mula sa ugat na שלל ay nagpapahiwatig na ang mga dating makapangyarihan ay sila mismong nasamsaman. Pinananatili ng “sinamsaman” ang larawang militar at ang aspektong pasibo.
- source_word: אַבִּירֵי לֵב
  choice: matatapang ang puso
  rationale: Malapit ito sa literal na “makapangyarihan/matatag ang puso” at likas sa modernong Filipino bilang paglalarawan sa matatapang at matitibay ang loob.
- source_word: נָמוּ שְׁנָתָם
  choice: natulog sila sa kanilang tulog
  rationale: Pinananatili ang sadyang pag-uulit at matinding larawang patula ng Hebreo, nang hindi tahasang nilulutas kung karaniwang pagtulog o kamatayang tulad ng pagtulog ang tinutukoy.
- source_word: אַנְשֵׁי חַיִל
  choice: magigiting na mandirigma
  rationale: Ipinahahayag nito ang lakas, kagitingan, at malinaw na kontekstong militar ng parirala.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: walang sinuman ... ang nakatagpo sa kanilang mga kamay
  rationale: Inilalapit nito sa di-karaniwang larawan ng Hebreo na “hindi natagpuan ang kanilang mga kamay,” habang ang talabinghagang kahulugan na hindi sila makakilos o makagamit ng lakas ay ipinaliliwanag sa talababa.
theological_decisions:
- issue: Kung ang “pagtulog” ay tahasang kamatayan
  choice: Pinanatili ang “natulog sila sa kanilang tulog.”
  alternative: “Nakatulog sila sa tulog ng kamatayan.”
  rationale: Malakas na ipinahihiwatig ng konteksto ang pagkatalo at posibleng kamatayan, ngunit walang tahasang salitang “kamatayan” sa Hebreo; kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Filipino na nagpapanatili sa maigting na paralelismo at kakaibang mga larawan ng tulang Hebreo. Ginamit ang “sinamsaman” at “mandirigma” para sa malinaw na kontekstong militar; ang literal na larawang kaugnay ng mga kamay ay pinanatili sa teksto at nilinaw sa talababa.
