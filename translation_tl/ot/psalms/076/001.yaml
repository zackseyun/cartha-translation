  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: tl
  text: Kilala ang Diyos sa Juda[a]; dakila ang pangalan niya sa Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nagpakilala ang Diyos sa Juda”; maaaring ipahiwatig ng anyong Hebreo ang alinman sa kalagayang “kilala” o, ayon sa konteksto, ang higit na pangyayaring diwang “nagpakilala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pangalan niya” ay maaaring tumukoy sa kanyang nahayag na pagkakakilanlan o kabantugan, hindi lamang sa mismong binibigkas na pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: Kilala
  rationale: Ang Niphal ng ידע ay karaniwang may estadibo o pasibong diwang “kilala.” Pinananatili ng “Kilala” ang maikli at patulang pahayag nang hindi tahasang idinaragdag ang reflexibong diwang “nagpakilala.”
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Likas na katumbas ng ב sa pangalang maaaring tumukoy sa lupain o bayan ang “sa”; pinananatili rin nito ang heograpiko at pangkomunidad na pahiwatig.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang kahulugan nito rito at tumutukoy sa Diyos ng Israel.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang “sa” ang natural na salin at pinananatili ang pagkakatulad ng estruktura sa “sa Juda.”
- source_word: גָּדוֹל
  choice: dakila
  rationale: Tuwirang inilalarawan ng pang-uri ang pangalan ng Diyos bilang dakila; marangal at natural ito sa modernong Filipino at hindi ginagawang pandiwa ang Hebreo.
- source_word: שְׁמוֹ
  choice: ang pangalan niya
  rationale: Pinananatili ang kongkretong Hebreong pahayag. Sa tula, maaaring saklawin ng “pangalan” ang nahayag na pagkakakilanlan at pagkabantog ng Diyos, hindi lamang ang binibigkas na pangalan.
theological_decisions:
- issue: Diwa ng pagkakilala sa Diyos
  choice: Kilala ang Diyos
  alternative: Nagpakilala ang Diyos
  rationale: Pinananatili ng pangunahing salin ang karaniwang estadibo o pasibong diwa ng נוֹדָע, habang inilalahad sa talababa ang posibleng mas pangyayaring diwa nang hindi ito ipinapasok sa teksto.
- issue: Diwa ng banal na “pangalan”
  choice: dakila ang pangalan niya
  alternative: dakila ang kanyang kabantugan
  rationale: Pinananatili nito ang biblikal at teolohikal na bigat ng “pangalan” bilang nahayag na pagkakakilanlan at reputasyon ng Diyos, sa halip na paliitin ito sa kabantugan lamang.
translation_notes:
  register: 'Makabago, maikli, at marangal na Filipino na nagpapanatili sa paralelismo ng tulang Hebreo: “sa Juda / sa Israel” at “Kilala ang Diyos / dakila ang pangalan niya.” Inilagay ang [a] pagkaraan ng unang sugnay at ang [b] pagkaraan ng ikalawa upang malinaw ang saklaw ng bawat talababa.'
