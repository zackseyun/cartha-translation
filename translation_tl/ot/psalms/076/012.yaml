  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: tl
  text: Pinababagsak niya ang espiritu ng mga pinuno[a]; siya ay kinatatakutan ng mga hari sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinipigil niya ang espiritu ng mga pinuno.” Ang “espiritu” ay maaari ring mangahulugang “hininga,” “lakas ng loob,” o “disposisyon.”
    reason: lexical_alternative
  - marker: b
    text: O “Siya ay kakila-kilabot sa mga hari sa lupa.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: Pinuputol
  rationale: Ang Qal imperfect ng בצר ay maaaring magpahiwatig ng pagputol o pagpigil. Pinananatili ng “pinuputol” ang mariin at mapagpasiyang pagkilos laban sa kapangyarihan o loob ng mga pinuno.
- source_word: רוּחַ
  choice: espiritu
  rationale: Maaaring mangahulugan ang רוּחַ ng espiritu, hininga, lakas ng loob, o disposisyon. Pinananatili ng “espiritu” ang lawak at tunay na kalabuan ng salitang Hebreo.
- source_word: נְגִידִים
  choice: mga pinuno
  rationale: Ang נָגִיד ay tumutukoy sa pinuno, tagapamahala, o prinsipe. Natural sa makabagong Filipino ang “mga pinuno” at malinaw ang pagtutulad nito sa mga hari sa kasunod na linya.
- source_word: נוֹרָא
  choice: kakila-kilabot
  rationale: Ipinahihiwatig ng נוֹרָא ang isang kinatatakutan at pumupukaw ng sindak. Ang “kakila-kilabot” ay nagpapanatili sa matinding diwa nito nang hindi gumagamit ng salitang maaaring humina sa karaniwang gamit.
- source_word: לְמַלְכֵי אָרֶץ
  choice: sa mga hari sa lupa
  rationale: 'Ang לְ ay relasyonal dito: siya ay kakila-kilabot para o sa pananaw ng mga hari. Ang “sa mga hari sa lupa” ay malapit sa estrukturang Hebreo at natural sa Filipino.'
theological_decisions:
- issue: Kalikasan ng pagkilos ng Diyos sa mga pinuno
  choice: Inilalarawan ang Diyos na mapagpasiyang nagpapabagsak o nagpapahina sa espiritu ng mga pinuno.
  alternative: Maaaring tumukoy ito sa pagpigil sa kanilang galit o tapang, o sa pagkitil ng kanilang hininga at buhay.
  rationale: Pinahihintulutan ng kombinasyon ng יִבְצֹר at רוּחַ ang mga pagbasa tungkol sa pagputol, pagpigil, tapang, disposisyon, o hininga. Hindi nililimitahan ng pangunahing salin ang taludtod sa kamatayan o sa isang partikular na damdamin.
- issue: Ugnayan ng Diyos sa mga hari sa lupa
  choice: Siya ay kakila-kilabot sa kanila, kaya likas na kinatatakutan.
  alternative: Tahasan itong isalin na “kinatatakutan siya ng mga hari sa lupa.”
  rationale: Pinananatili ng predikatibong “kakila-kilabot sa” ang anyo at saklaw ng נוֹרָא לְ habang malinaw pa ring ipinahahayag ang sindak na dulot ng Diyos.
translation_notes:
  register: Mataas ngunit malinaw na makabagong Filipino. Ginamit ang “mga pinuno” sa halip na “mga prinsipe” upang maiwasan ang labis na pagkitid sa maharlikang titulo. Ang “kakila-kilabot” ay nagpapanatili sa banal na sindak ng Hebreo; hindi nito ipinahihiwatig na masama ang Diyos.
