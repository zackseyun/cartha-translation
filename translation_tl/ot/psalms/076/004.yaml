translation:
  language: tl
  text: 'Maningning ka,

    mas marilag kaysa sa mga bundok ng samsam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Maningning at marilag ka mula sa mga bundok ng biktima.” Ang salitang Hebreo ay maaaring tumukoy sa biktima o, sa pinalawak na kahulugan, sa samsam; maaari ring mangahulugang “mula sa” ang pang-ukol.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: nagniningning
  rationale: Ipinahahayag nito ang ningning at maningning na kaluwalhatian. Likas ito sa makabagong Filipino at hindi ipinahihiwatig na tumatanggap lamang ang Diyos ng liwanag mula sa iba.
- source_word: אַתָּה
  choice: ka
  rationale: Ang panghalip na ikalawang panauhan ay likas na ikinakabit sa panaguri sa Filipino; hindi kailangan ang hiwalay na pandiwang katumbas ng English na “are.”
- source_word: אַדִּיר
  choice: mas marilag
  rationale: Saklaw ng salita ang kadakilaan, karangalan, at kapangyarihan. Dahil sinusundan ito ng מִן, malinaw na naipapahayag ng “mas marilag kaysa” ang malamang na paghahambing.
- source_word: מֵהַרְרֵי
  choice: kaysa sa mga bundok ng
  rationale: Ginagamit dito ang מִן bilang pananda ng paghahambing. Pinananatili ng “mga bundok ng” ang ugnayang construct ng Hebreo.
- source_word: טָרֶף
  choice: samsam
  rationale: Maaaring mangahulugan ang pangngalan ng nasilang biktima o ng nakuhang samsam. Mas natural sa marangal na tulang Filipino ang “samsam” sa pariralang ito, habang pinananatili sa talababa ang mas literal na larawan ng “biktima.”
theological_decisions:
- issue: Kahulugan ng pariralang מֵהַרְרֵי טָרֶף
  choice: 'Paghahambing: ang Diyos ay mas marilag kaysa sa “mga bundok ng samsam.”'
  alternative: Maaaring unawain bilang “nagniningning ka mula sa mga bundok ng samsam,” o gamitin ang “mga bundok ng biktima.”
  rationale: Malakas na sinusuportahan ng sintaks kasama ng אַדִּיר ang paghahambing, ngunit hindi tinutukoy ng salin ang isang tiyak na pangyayaring pangkasaysayan o doktrinal na pakahulugan. Inilalahad sa talababa ang tunay na leksikal at sintaktikong posibilidad.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang “nagniningning” at “marilag” upang mapanatili ang larawan ng liwanag at kadakilaan nang hindi nagiging lipas o labis na teknikal. Inilagay ang marker [a] sa mismong teksto.
