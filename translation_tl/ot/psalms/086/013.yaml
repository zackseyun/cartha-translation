base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: tl
  text: Sapagkat dakila ang iyong tapat na pag-ibig sa akin, at iniligtas mo ang aking buhay mula sa kailaliman ng Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa pinakamababang Sheol,” “mula sa kailaliman ng daigdig ng mga patay,” o “mula sa libingan sa ibaba.” Ang Sheol ay katawagang Hebreo para sa daigdig o kalagayan ng mga patay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang pagpupuri o panalangin habang pinananatili ang makatang ugnayan ng mga taludtod.
- source_word: חַסְדְּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ipinahahayag ang matatag, mapagkalinga, at relasyonal na puwersa ng חֶסֶד nang hindi ito nililimitahan sa awa lamang.
- source_word: גָּדוֹל
  choice: dakila
  rationale: Likas at marangal na katumbas ng 'malaki/dakila' sa konteksto ng pag-ibig ng Diyos.
- source_word: עָלָי
  choice: sa akin
  rationale: Natural na Filipino para sa pag-ibig na nakatuon at ipinagkakaloob sa nagsasalita.
- source_word: וְהִצַּלְתָּ
  choice: at iniligtas mo
  rationale: Tuwirang ipinahahayag ang natapos na pagkilos ng pagsagip o pagliligtas.
- source_word: נַפְשִׁי
  choice: aking buhay
  rationale: Sa konteksto ng pagliligtas mula sa Sheol, ang נֶפֶשׁ ay natural na tumutukoy sa buhay o buong sarili; iniiwasan din nitong magpasok ng teknikal na paghihiwalay ng katawan at kaluluwa.
- source_word: מִשְּׁאוֹל
  choice: mula sa ... Sheol
  rationale: Pinananatili ang sinaunang Hebreong katawagan sa daigdig o kalagayan ng mga patay nang hindi ito itinutumbas agad sa isang mas huling tiyak na doktrina.
- source_word: תַּחְתִּיָּה
  choice: kailaliman ng
  rationale: Likas na Filipino na nagpapanatili sa larawan ng sukdulang pagbaba o pinakamababang bahagi, bagaman maaari rin itong unawain bilang 'pinakamababang Sheol.'
theological_decisions:
- issue: Paglalarawan sa שְׁאוֹל nang hindi nagpapasok ng mas huling doktrinal na katiyakan
  choice: Sheol
  alternative: daigdig ng mga patay; libingan sa kailaliman
  rationale: Ang transliterasyon ay nagpapanatili sa sariling larawan ng tekstong Hebreo. Ipinaliliwanag ng talababa ang kahulugan at mga posibleng salin nang hindi ito tinutumbasan nang tahasan sa impiyerno.
- issue: Kahulugan ng נַפְשִׁי sa konteksto ng bantang kamatayan
  choice: aking buhay
  alternative: aking kaluluwa; ako
  rationale: Ang 'aking buhay' ay malinaw at natural sa modernong Filipino at akma sa pagliligtas mula sa Sheol, habang hindi itinatanggi ang mas malawak na kahulugan nitong buong sarili.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “tapat na pag-ibig” para sa covenantal at matatag na חֶסֶד, at pinanatili ang “Sheol” upang hindi paliitin o labis na tukuyin ang sinaunang larawan. Ang talababa ay inilagay sa mismong pariralang “Sheol” upang malinaw ang tinutukoy nito.
