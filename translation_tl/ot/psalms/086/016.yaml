base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: tl
  text: Bumaling ka sa akin at pagpakitaan mo ako ng kagandahang-loob; ibigay mo ang iyong lakas sa iyong lingkod, at iligtas mo ang anak ng iyong babaeng lingkod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Bumaling ka sa akin
  rationale: Ang pautos na פּנה kasama ng אֵלַי ay panawagang ituon ng Diyos ang kaniyang pansin sa nagsasalita. Likas at marangal sa Filipino ang “bumaling ka sa akin.”
- source_word: וְחָנֵּנִי
  choice: at kahabagan mo ako
  rationale: Ang חנן ay tumutukoy sa pagpapakita ng kagandahang-loob o pabor. Sa konteksto ng panalangin, natural na ipinahahayag ito ng “kahabagan,” nang hindi inaalis ang diwa ng mapagbiyayang pagtugon.
- source_word: תְּנָה עֻזְּךָ
  choice: ibigay mo ang iyong lakas
  rationale: Tuwirang pinananatili ang pautos na “ibigay” at ang עֹז bilang “lakas,” na hinihingi ng salmista bilang tulong mula sa Diyos.
- source_word: לְעַבְדֶּךָ
  choice: sa iyong lingkod
  rationale: Ang “lingkod” ay angkop sa mapagpakumbabang pagtatalaga ng sarili sa Diyos at mas natural sa kasalukuyang Filipino kaysa isang teknikal na pagtukoy sa pagkaalipin.
- source_word: וְהוֹשִׁיעָה
  choice: at iligtas mo
  rationale: Tuwirang katumbas ng pautos mula sa ישׁע at pinananatili ang malawak na diwa ng pagsagip.
- source_word: לְבֶן אֲמָתֶךָ
  choice: ang anak ng iyong babaeng lingkod
  rationale: Pinananatili ang tahasang pagtukoy sa ina sa Hebreo. Bagaman bahagyang pormal, malinaw sa modernong Filipino ang “babaeng lingkod” at iniiwasan ang malabo o makalumang katawagan.
theological_decisions:
- issue: Mapagpakumbabang mga katawagang עבד at אמה
  choice: “iyong lingkod” at “anak ng iyong babaeng lingkod”
  alternative: “iyong alipin” at “anak ng iyong aliping babae”
  rationale: Pinananatili ang dalawang magkaugnay na katawagan at ang mahalagang pagbanggit sa ina, ngunit gumagamit ng “lingkod” upang umangkop sa tono ng panalangin nang hindi ipinipilit na ang institusyon ng pagkaalipin ang pangunahing diin.
- issue: Saklaw ng חנן
  choice: “kahabagan mo ako”
  alternative: “pagpakitaan mo ako ng kagandahang-loob”
  rationale: Ang “kahabagan” ay natural at maikli sa panalanging Filipino; nananatili rito ang pakiusap para sa mapagbiyayang pabor, bagaman maaari ring idiin ng salita ang kagandahang-loob.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa panalangin. Ginamit ang “bumaling,” “lingkod,” at “iligtas” bilang pamilyar ngunit hindi kolokyal na bokabularyo. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
