  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at likas sa makabagong Filipino ang “pagpakitaan mo ako ng kagandahang-loob” para sa pakiusap na ito. Katanggap-tanggap ang “babaeng lingkod” bilang malinaw na katumbas ng אמה sa magkatambal na pagpapakumbaba ng talata.
