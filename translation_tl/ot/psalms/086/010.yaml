  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: tl
  text: Sapagkat dakila ka at gumagawa ng mga kamangha-manghang bagay; ikaw lamang ang Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang pakiusap at papuri, habang nananatiling natural at marangal sa makabagong Tagalog.
- source_word: גָדוֹל
  choice: dakila
  rationale: Tumutukoy sa kadakilaan ng Diyos sa kalagayan at kapangyarihan; ang “dakila” ay tuwiran at angkop sa konteksto ng papuri.
- source_word: וְעֹשֵׂה
  choice: at gumagawa
  rationale: Ang participle ay nagpapahayag ng gawaing likas at patuloy na ginagawa; natural itong naihahatid ng pangkasalukuyang “gumagawa.”
- source_word: נִפְלָאוֹת
  choice: mga kamangha-manghang bagay
  rationale: Pinananatili ang maramihang diwa at tumutukoy sa pambihirang mga gawa na pumupukaw ng paghanga.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, malinaw na tumutukoy ito rito sa iisang Diyos na direktang kinakausap.
- source_word: לְבַדֶּךָ
  choice: ikaw lamang
  rationale: 'Inilalagay sa diin ang eksklusibong pahayag ng Hebreo: walang iba kundi ang kinakausap ang Diyos.'
theological_decisions:
- issue: Eksklusibong pahayag tungkol sa Diyos sa huling sugnay
  choice: ikaw lamang ang Diyos
  alternative: ikaw ang Diyos na nag-iisa
  rationale: Ang piniling ayos ay natural sa Tagalog at malinaw na pinananatili ang diin ng לְבַדֶּךָ na ang kinakausap lamang ang Diyos, nang walang idinadagdag na pilosopikal o denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may payak na anyong patula. Hindi kailangan ang talababa sapagkat ang “ikaw lamang ang Diyos” ay tuwirang naghahatid ng diin at kahulugan ng Hebreo nang hindi lumilikha ng mahalagang alternatibong pagbasa.
