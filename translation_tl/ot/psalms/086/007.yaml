base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/007.yaml
  text: In the day of my distress I call to you, because you answer me.
translation:
  language: tl
  text: Sa araw ng aking kagipitan, tumatawag ako sa iyo, sapagkat sinasagot mo ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Sa araw ng aking kagipitan
  rationale: Pinananatili ang temporal na parirala at isinasalin ang צָרָה bilang “kagipitan,” isang natural at marangal na salitang tumutukoy sa matinding hirap o pagkabalisa.
- source_word: אֶקְרָאךָּ
  choice: tumatawag ako sa iyo
  rationale: Ang imperfect na anyo sa kontekstong ito ay angkop na ihayag bilang kasalukuyan o nakaugaliang pagtawag; pinananatili rin ang tuwirang patungkol sa Diyos.
- source_word: כִּי
  choice: sapagkat
  rationale: Isinasalin bilang panandang sanhi, kaayon ng konteksto at ng kasunod na pahayag na batayan ng pagtawag.
- source_word: תַעֲנֵנִי
  choice: sinasagot mo ako
  rationale: Ang imperfect ay maaaring magpahayag ng inaasahan o tiyak na tugon; ang kasalukuyang anyo ay nagpapanatili sa payak na katiyakang nasa Hebreo nang hindi nagdaragdag ng modal na salita.
theological_decisions:
- issue: Ang ugnayan ng כִּי sa pagtawag at pagsagot ng Diyos
  choice: “sapagkat sinasagot mo ako” bilang dahilan ng pagtawag
  alternative: “dahil sasagutin mo ako” bilang tahasang panghinaharap
  rationale: Pinananatili ng kasalukuyang anyo ang aspektuwal na lawak ng Hebreong imperfect at ang teolohikal na tensiyon sa pagitan ng karanasan, pagtitiwala, at inaasahang tugon, nang hindi ito nililimitahan sa hinaharap lamang.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at angkop sa panalangin. Ginamit ang “kagipitan” sa halip na mas teknikal o mas matinding mga salitang maaaring magpaliit sa saklaw ng Hebreo.
