base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: tl
  text: Magpakita ka sa akin ng isang tanda ng kabutihan,[a] upang makita ito ng mga napopoot sa akin at mapahiya sila, sapagkat ikaw, Yahweh, ang tumulong at umaliw sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gawan mo ako ng tanda para sa aking ikabubuti.” Sa literal, “Gumawa ka kasama ko ng tanda para sa mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי
  choice: Gawan mo ako
  rationale: Pinananatili nito ang literal na diwa ng pandiwang ‘gumawa’ at ng pariralang ‘sa/kasama ko,’ habang natural na ipinahahayag sa Filipino na hinihiling ng mang-aawit na kumilos ang Diyos para sa kanya.
- source_word: אוֹת
  choice: tanda
  rationale: Ang ‘tanda’ ay karaniwan at malinaw na katumbas ng isang nakikitang palatandaan o katibayan.
- source_word: לְטוֹבָה
  choice: ng iyong kabutihan
  rationale: Ipinahahayag nito ang tandang nagpapakita ng mabuti o lingap mula sa Diyos. Bahagya itong mas tahasang pagbasa kaysa literal na ‘para sa ikabubuti,’ kaya inilalahad sa talababa ang alternatibo.
- source_word: וְיִרְאוּ
  choice: upang makita ito
  rationale: Ang di-ganap na pandiwa kasunod ng pautos ay likas na nagsasaad ng layunin o bunga; nililinaw ng ‘ito’ na ang tanda ang makikita.
- source_word: שֹׂנְאַי
  choice: mga napopoot sa akin
  rationale: Pinananatili ang tahasang personal na pagkapoot ng participle, sa halip na palawakin ito bilang ‘mga kaaway.’
- source_word: וְיֵבֹשׁוּ
  choice: mapahiya sila
  rationale: Sinasalamin nito ang pampubliko o obhetibong pagkapahiya at kabiguang saklaw ng בוש, hindi lamang panloob na pagkadama ng hiya.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng kanilang pagkapahiya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: עֲזַרְתַּנִי
  choice: ang tumulong sa akin
  rationale: Ang perpektong pandiwa ay tumutukoy sa naganap na tulong ng Diyos; natural sa Filipino ang sugnay na ito bilang dahilan at pagkilala.
- source_word: וְנִחַמְתָּנִי
  choice: umaliw sa akin
  rationale: Ang ‘umaliw’ ay natural at dignidad na salin ng נחם sa kahulugang magbigay-ginhawa o magpalakas ng loob.
theological_decisions:
- issue: Pagpapakahulugan sa ‘tanda para sa mabuti’
  choice: tanda ng iyong kabutihan
  alternative: tanda para sa aking ikabubuti; tanda ng lingap
  rationale: Maaaring tumukoy ang Hebreo sa isang tandang nagpapakita ng kabutihan o lingap ng Diyos, o sa tandang magdudulot ng mabuti sa mang-aawit. Pinili sa teksto ang natural na unang pagbasa ngunit pinanatili sa talababa ang tunay na saklaw ng parirala.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay transliterasyong nagpapanatili rito bilang pangalan at hindi bilang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘napopoot’ at ‘sapagkat’ upang mapanatili ang dignidad ng panalangin nang hindi maging lipas o mahirap unawain.
