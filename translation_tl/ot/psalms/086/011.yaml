  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: tl
  text: Ituro mo sa akin ang iyong daan, Yahweh, upang lumakad ako sa iyong katotohanan.[a] Pag-isahin mo ang aking puso[b] upang matakot ako sa iyong pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa iyong katapatan.” Ang salitang Hebreo ay maaaring tumukoy kapuwa sa katotohanan at sa katapatan o pagiging maaasahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gawin mong buo at hindi hati ang aking puso.” Ang pandiwang Hebreo ay nangangahulugang “pag-isahin” o “gawing isa,” at nagpapahiwatig ng pusong hindi nahahati sa katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Ituro mo sa akin
  rationale: Ang Hiphil imperative ng ירה na may hulaping unang panauhan ay isang pakiusap na turuan ang nagsasalita. Natural at tuwiran sa modernong Tagalog ang “Ituro mo sa akin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahihiwatig ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: דַּרְכֶּךָ
  choice: ang iyong daan
  rationale: Maaaring tumukoy ang דֶּרֶךְ sa literal na daan o, gaya rito, sa paraan ng pamumuhay na itinuturo ng Diyos. Pinananatili ng “daan” ang metapora at ang isahang anyo.
- source_word: אֲהַלֵּךְ
  choice: upang lumakad ako
  rationale: Ang imperfect na kasunod ng utos ay natural na nagpapahayag ng layunin o bunga. Pinananatili rin ng “lumakad” ang Hebreong metapora para sa pamumuhay.
- source_word: בַּאֲמִתֶּךָ
  choice: sa iyong katotohanan
  rationale: Ang אֱמֶת ay maaaring mangahulugang katotohanan, katapatan, o pagiging maaasahan. Tuwiran ang “katotohanan,” habang inilalahad sa talababa ang tunay na alternatibong “katapatan.”
- source_word: יַחֵד
  choice: Pag-isahin mo
  rationale: Ang Piel imperative ng יחד ay nangangahulugang pag-isahin o gawing isa. Pinananatili ng salin ang larawan ng pusong hindi nahahati ang katapatan.
- source_word: לְבָבִי
  choice: ang aking puso
  rationale: Tumutukoy ang לֵבָב sa panloob na pagkatao, kasama ang kalooban at damdamin. Karaniwan at angkop sa panalangin ang “puso.”
- source_word: לְיִרְאָה
  choice: upang matakot ako
  rationale: Nagpapahayag ng layunin ang infinitive na may ל. Pinananatili ang “matakot” upang hindi paliitin ang saklaw nito sa paggalang lamang, bagaman kasama rito ang pagpipitagan at paghanga.
- source_word: שְׁמֶךָ
  choice: sa iyong pangalan
  rationale: Pinananatili ang “pangalan,” na sa Hebreo ay maaaring kumatawan sa persona, karangalan, at reputasyon ng Diyos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng אֱמֶת
  choice: katotohanan
  alternative: katapatan
  rationale: Kapuwa posible ang katotohanang sinusunod at ang katapatan ng Diyos. Pinili ang tuwirang “katotohanan” at pinanatili sa talababa ang alternatibo upang hindi mawala ang tunay na leksikal na kalabuan.
- issue: Kahulugan ng pagkatakot sa pangalan ng Diyos
  choice: matakot ako sa iyong pangalan
  alternative: igalang ko nang may pagpipitagan ang iyong pangalan
  rationale: Saklaw ng ירא ang takot, pagpipitagan, at paghanga. Pinananatili ang “matakot” upang hindi pahinain o lutasin nang labis ang teolohikal na bigat ng salita.
- issue: Larawan ng pusong pinag-iisa
  choice: Pag-isahin mo ang aking puso
  alternative: Gawin mong buo at hindi hati ang aking puso
  rationale: Tuwirang ipinapahayag ng יחד ang paggawa sa puso na isa. Ang diwa ay kalayaang mula sa magkakahating katapatan, ngunit hindi ito pinalitan ng mas paliwanag na parapreys sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang mga pangunahing metaporang Hebreo—“daan,” “lumakad,” at “puso”—at ang personal na pangalang “Yahweh.” Ang “aking” sa halip na “ko” ay nagbibigay ng bahagyang marangal na himig nang hindi nagiging lipas o mahirap unawain.
