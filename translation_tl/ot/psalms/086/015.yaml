id: PSA.86.15
reference: Psalms 86:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: tl
  text: Ngunit ikaw, Panginoon, ay Diyos na mahabagin at mapagbigay-loob, hindi madaling magalit, at sagana sa tapat na pag-ibig at katapatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katotohanan.” Sa pormulang ito tungkol sa tipan, ang salitang Hebreo ay madalas tumutukoy sa katapatan o pagiging maaasahan, hindi lamang sa katotohanan bilang isang abstraktong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Sa konteksto, ang pangatnig at hayag na panghalip ay nagpapakita ng mariing pagsalungat; natural itong naihahayag ng “Ngunit ikaw” sa Filipino.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ang Adonai ay mapitagang titulong pantukoy sa Diyos; “Panginoon” ang likas at nakaugaliang katumbas sa Tagalog.
- source_word: אֵל
  choice: Diyos
  rationale: Tinutukoy nito ang Panginoon bilang Diyos sa pormulang umaalingawngaw sa Exodo 34:6; hindi kailangang dagdagan ng diwang “makapangyarihan.”
- source_word: רַחוּם
  choice: mahabagin
  rationale: Tumpak at karaniwang salitang Filipino ito para sa malalim na habag o awa, at angkop sa marangal na rehistro ng salmo.
- source_word: וְ/חַנּוּן
  choice: at mapagbigay-loob
  rationale: Ipinahahayag nito ang pagiging handang magpakita ng lingap at di-karapat-dapat na kabutihan. Mas malinaw ito sa ordinaryong mambabasa kaysa sa “mapagbiyaya,” na maaari ring mangahulugang sagana sa biyaya o talento.
- source_word: אֶרֶךְ אַפַּיִם
  choice: hindi madaling magalit
  rationale: Ang literal na idyomang Hebreo ay nangangahulugang mabagal magalit. Ang napiling anyo ay natural sa modernong Filipino at pinananatili ang tiyak na diwa ng pagpipigil sa galit.
- source_word: וְ/רַב חֶסֶד
  choice: at sagana sa tapat na pag-ibig
  rationale: Ipinahahayag ng רַב ang kasaganaan, samantalang ang חֶסֶד ay pag-ibig na matatag, tapat, at may kaugnayan sa tipan. Iniiwasan ng parirala ang pagpapaliit nito sa damdamin lamang.
- source_word: וֶ/אֱמֶת
  choice: at katapatan
  rationale: Sa tambalang ito kasama ng חֶסֶד, madalas na tumutukoy ang אֱמֶת sa pagiging maaasahan at tapat, bagaman maaari rin itong isaling “katotohanan”; pinananatili sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Paglalahad ng pormula ng tipan na umaalingawngaw sa Exodo 34:6
  choice: Gumamit ng malinaw at marangal na pananalitang “mahabagin at mapagbigay-loob ... sagana sa tapat na pag-ibig at katapatan.”
  alternative: “Maawain at mapagbiyaya ... sagana sa kagandahang-loob at katotohanan.”
  rationale: Pinananatili ng salin ang pagkakaugnay ng habag, lingap, pagtitimpi sa galit, matatag na pag-ibig, at pagiging maaasahan ng Diyos nang hindi nag-aangkat ng natatanging interpretasyong denominasyonal.
- issue: Saklaw ng kahulugan ng אֱמֶת
  choice: katapatan
  alternative: katotohanan
  rationale: Mas lantad sa kontekstong pang-ugnayan at pangtipan ang diwa ng pagiging tapat o maaasahan, ngunit lehitimo ang “katotohanan” at kaya'y tahasang ibinigay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Panginoon” at “Diyos” bilang karaniwang katawagan sa tekstong biblikal; iniwasan ang sobrang arkaikong bokabularyo at pinanatili ang maindayog na pagkakasunod ng mga katangian.
