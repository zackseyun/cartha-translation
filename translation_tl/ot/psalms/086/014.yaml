  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: tl
  text: Diyos, nagbangon laban sa akin ang mga palalo, at sinikap ng isang pangkat ng malulupit na patayin ako; hindi ka nila isinasaalang-alang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang pagtawag ito sa Diyos. Hindi na dinagdagan ng “O” sapagkat walang hiwalay na katumbas nito sa Hebreo, at natural sa makabagong Tagalog ang “Diyos” bilang panawag.
- source_word: זֵדִים
  choice: mga palalo
  rationale: Tumutukoy ito sa mga taong mapagmataas, hambog, o walang pakundangan. Ang “mga palalo” ay maikli, marangal, at angkop sa pananalita ng Mga Awit.
- source_word: קָמוּ עָלַי
  choice: naghimagsik laban sa akin
  rationale: Ang idyomang Hebreo ay nagpapahayag ng pagbangon laban sa isang tao nang may poot. Mas malinaw sa Tagalog ang “naghimagsik laban” kaysa literal na “tumayo laban.”
- source_word: וַעֲדַת
  choice: isang pangkat ng
  rationale: Nangangahulugan itong isang nagkatipong grupo. Ipinahihiwatig ng “pangkat” ang kolektibong pagkilos nang hindi nagdaragdag ng di-tiyak na organisasyong pampolitika o panrelihiyon.
- source_word: עָרִיצִים
  choice: malulupit
  rationale: Inilalarawan nito ang mararahas, mapaniil, at walang-awang mga tao. Ang “malulupit” ay natural at malinaw sa kasalukuyang Tagalog.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: nagtatangkang kitlin ang buhay ko
  rationale: Ang literal na “hinanap ang buhay ko” ay hindi natural at maaaring malabo sa Tagalog. Ipinahahayag ng idyoma ang hangaring patayin ang nagsasalita; pinananatili ng “kitlin ang buhay ko” ang larawan ng buhay habang nililinaw ang banta.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: hindi ka nila isinasaalang-alang
  rationale: Literal itong hindi paglalagay sa Diyos sa harap nila, isang talinghaga ng kawalan ng pagkilala o pagpapahalaga sa kaniya. Ang salin ay naghahatid ng diwa sa natural na Tagalog.
theological_decisions:
- issue: Kung lalagyan ng pantawag na “O” ang Diyos
  choice: Diyos
  alternative: O Diyos
  rationale: Malinaw ang tuwirang pagtawag sa Diyos, ngunit walang hiwalay na katagang “O” sa Hebreo. Hindi ito idinagdag sa pangunahing teksto.
- issue: Kung pananatilihin nang literal ang idyomang “hanapin ang buhay ko”
  choice: nagtatangkang kitlin ang buhay ko
  alternative: hinahanap ang buhay ko
  rationale: Sa Hebreo, ang paghahanap sa buhay ng isang tao sa ganitong konteksto ay nagpapahiwatig ng layuning pumatay. Dahil hindi malinaw o natural sa Tagalog ang literal na anyo, ginawang tahasan ang nakamamatay na hangarin nang hindi nagdaragdag ng partikular na paraan ng pagpatay.
- issue: Kung pananatilihin ang metaporang “hindi ka inilagay sa harap nila”
  choice: hindi ka nila isinasaalang-alang
  alternative: hindi ka nila inilalagay sa harap nila
  rationale: Ang literal na anyo ay alanganin at madaling mapagkamalang pisikal na paglalagay sa Tagalog. Ang piniling salin ay naghahayag ng kawalan nila ng pagkilala sa Diyos nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago at dignified na Filipino Tagalog, na may payak ngunit matinding pananalita. Ginamit ang “palalo,” “malulupit,” at “kitlin ang buhay” bilang mga salitang madaling maunawaan ngunit angkop sa panalangin at panaghoy. Walang panandang talababa dahil ang mahahalagang idyoma ay malinaw na naipahayag sa pangunahing teksto.
