  text: כִּֽי אַתָּ֣ה אֲ֭דֹנָ/י ט֣וֹב וְ/סַלָּ֑ח וְ/רַב חֶ֝֗סֶד לְ/כָל קֹרְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: tl
  text: Sapagkat ikaw, Panginoon, ay mabuti at mapagpatawad[a], sagana sa tapat na pag-ibig sa lahat ng tumatawag sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handang magpatawad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pagsusumamo. Likas sa makabagong Tagalog ang “sapagkat” at malinaw nitong pinananatili ang ugnayang lohikal.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinanatili ang tahasang panghalip upang maipahayag ang diin ng tuwirang pakikipag-usap ng mang-aawit sa Diyos.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ay titulong banal na אֲדֹנָי, hindi ang pangalang YHWH. Ang “Panginoon” ang natural at marangal na katumbas sa panalangin.
- source_word: טוֹב
  choice: mabuti
  rationale: Pinananatili ng “mabuti” ang malawak na pangunahing diwa ng salita at hindi ito nililimitahan sa kabaitan lamang.
- source_word: סַלָּח
  choice: mapagpatawad
  rationale: Inilalarawan ng pang-uri ang Diyos bilang may likas na disposisyong magpatawad. Maikli at natural ang “mapagpatawad”; inilagay sa talababa ang mas tahasang “handang magpatawad.”
- source_word: רַב חֶסֶד
  choice: sagana sa tapat na pag-ibig
  rationale: Ipinahahayag ng “sagana” ang kasaganaan o tindi, samantalang pinananatili ng “tapat na pag-ibig” ang pagsasama ng pag-ibig at matibay na katapatan sa חֶסֶד.
- source_word: לְכָל קֹרְאֶיךָ
  choice: sa lahat ng tumatawag sa iyo
  rationale: Ang parirala ay tumutukoy sa lahat ng dumudulog at nananalangin sa Diyos. Ang “tumatawag sa iyo” ay natural at hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: Amo; aking Panginoon
  rationale: Titulong אֲדֹנָי ang nasa Hebreo at hindi ang Tetragrammaton. Kaya hindi ito isinalin na para bang tahasang YHWH ang pinagmulan.
- issue: Pagsasalin sa חֶסֶד
  choice: tapat na pag-ibig
  alternative: wagas na pag-ibig; awa; matibay na pag-ibig
  rationale: Pinananatili ng “tapat na pag-ibig” ang teolohikal na lawak ng mapagmahal na kabutihan at katapatan; mas makitid ang “awa” lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pananalita sa Diyos at ang maikli ngunit makatang ayos ng talata.
