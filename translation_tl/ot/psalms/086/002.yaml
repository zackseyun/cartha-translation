  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: tl
  text: 'Ingatan mo ang buhay ko[a], sapagkat ako’y matapat[b].

    Iligtas mo ako, ang iyong lingkod na nagtitiwala sa iyo;

    ikaw ang Diyos ko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kaluluwa ko”; dito ay tumutukoy sa “buhay ko” o sa buong sarili ko.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maka-Diyos,” “debotado,” o “tapat sa tipan.” Hindi ipinahihiwatig ng salitang Hebreo ang kawalang-kasalanan o ganap na kabanalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: Ingatan mo
  rationale: Ang pautos na anyo ng שׁמר ay isang pakiusap sa Diyos para sa pag-iingat at proteksiyon; natural at tuwiran ito sa makabagong Tagalog.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa konteksto ng paghingi ng kaligtasan, ang נֶפֶשׁ ay tumutukoy sa buhay o buong sarili ng salmista, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: כִּי
  choice: sapagkat
  rationale: 'Pinananatili nito ang ugnayang sanhi: ang kasunod na pahayag ang batayan ng pakiusap.'
- source_word: חָסִיד
  choice: matapat
  rationale: Ipinahahayag nito ang debosyon at katapatan sa tipan nang hindi nagpapahiwatig ng kawalang-kasalanan o ganap na kabanalan.
- source_word: הוֹשַׁע
  choice: Iligtas mo
  rationale: Tuwirang katumbas ito ng pautos na anyo at angkop kapwa sa agarang pagsagip at sa mas malawak na diwang teolohikal ng pagliligtas.
- source_word: עַבְדְּךָ
  choice: ang iyong lingkod
  rationale: Pinananatili nito ang mapagpakumbabang katawagang panrelasyon ng salmista sa Diyos; hindi pangunahing diin dito ang legal na kalagayan ng isang alipin.
- source_word: אַתָּה אֱלֹהַי
  choice: ikaw ang Diyos ko
  rationale: Pinananatili ang tahasang personal na pagpapahayag ng ugnayan sa Diyos.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: na nagtitiwala sa iyo
  rationale: Ang participial na parirala ay likas na inuunawang paglalarawan sa “iyong lingkod” at nagpapahiwatig ng patuloy na pagtitiwala.
theological_decisions:
- issue: Kahulugan ng חָסִיד bilang paglalarawan ng salmista sa sarili
  choice: “Ako’y matapat,” na tumutukoy sa tapat at debotong pakikipag-ugnayan sa Diyos
  alternative: “Ako’y banal,” “ako’y maka-Diyos,” o “ako’y isa sa iyong mga tapat”
  rationale: Hindi inaangkin ng salmista ang ganap na kabanalan o kaligtasang pinaghirapan niya. Umaapela siya sa katapatan sa loob ng kanyang ugnayan sa Diyos habang humihingi pa rin ng pagliligtas.
- issue: Ugnayan ng הַבּוֹטֵחַ אֵלֶיךָ sa pangungusap
  choice: 'Iniuugnay sa “iyong lingkod”: “ang iyong lingkod na nagtitiwala sa iyo”'
  alternative: 'Gawing hiwalay na pahayag: “ako ay nagtitiwala sa iyo”'
  rationale: Sinusuportahan ng anyong participial at ng pagkakasunod ng mga salita ang appositional na paglalarawan sa lingkod, habang ang salin ay nananatiling malinaw sa Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “ako’y” bilang banayad na estilong patula na karaniwan pa rin sa salin ng mga Awit. Hinati sa tatlong linya upang malinaw ang parallelismo at maiwasan ang malabong pagkakabit ng “ikaw ang Diyos ko” sa pariralang tumutukoy sa lingkod.
