  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: tl
  text: 'Panalangin ni David.


    Ikiling mo sa akin ang iyong tainga, Yahweh, at sagutin mo ako, sapagkat ako''y dukha[a] at nangangailangan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “api” o “aba.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong dukha, pinahihirapan, o ibinaba ang kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Panalangin ni David
  rationale: Likas at maikli sa Tagalog; pinananatili ang posibleng diwa na ito ay panalanging nauugnay kay David nang hindi dinaragdagan ang pamagat.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Ikiling mo sa akin ang iyong pandinig
  rationale: Pinananatili ang larawang Hebreo ng pagkiling ng tainga, ngunit ginagamit ang 'pandinig' upang maging natural at dignidad sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng natatanging pangalan ng Diyos sa tekstong Hebreo.
- source_word: עֲנֵנִי
  choice: sagutin mo ako
  rationale: Tuwirang isinasalin ang pakiusap ng nagsasalita.
- source_word: עָנִי
  choice: dukha
  rationale: Maaaring mangahulugang mahirap, api, o aba ang salita; ang 'dukha' ay maikli at likas, habang ang ibang posibleng diwa ay inilalahad sa talababa.
- source_word: אֶבְיוֹן
  choice: nangangailangan
  rationale: Ipinahahayag ang kalagayan ng isang taong salat at nangangailangan nang hindi inuulit lamang ang 'dukha.'
theological_decisions:
- issue: Kahulugan ng עָנִי
  choice: dukha
  alternative: api o aba
  rationale: Hindi nilulutas nang tahimik ang malawak na saklaw ng salitang Hebreo; inilalagay sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang patulang larawang 'ikiling ... ang iyong pandinig' at ang pangalang Yahweh; iniwasan ang labis na arkaikong pananalita.
