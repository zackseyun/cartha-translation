base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: tl
  text: Lahat ng bansang ginawa mo ay darating at yuyukod sa harap mo[a], Panginoon, at pararangalan nila ang iyong pangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sasamba sa harap mo”; ang pandiwang Hebreo ay maaaring tumukoy sa pagyukod bilang pagpipitagan at, sa pinalawak na diwa, sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: O “luluwalhatiin nila ang iyong pangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Lahat ng bansang
  rationale: Pinananatili ang pangkalahatang saklaw ng כָּל at ang malawak na kahulugan ng גּוֹיִם bilang mga bansa, nang hindi ito nililimitahan sa isang partikular na pangkat-etniko.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: ginawa mo
  rationale: Tuwirang sinasalamin ang karaniwang kahulugan ng עשה na ‘gumawa,’ habang hinahayaang ang konteksto ang magpahiwatig na ang Diyos ang lumalang sa mga bansa.
- source_word: יָבֹאוּ
  choice: darating
  rationale: Ang di-ganap na anyo ay nagpapahayag dito ng inaasahang pangyayari sa hinaharap; natural itong ipinapahayag sa Filipino sa pamamagitan ng ‘darating.’
- source_word: וְיִשְׁתַּחֲווּ
  choice: at yuyukod
  rationale: Pinananatili ang kongkretong larawan ng pagyukod bilang pagpapakumbaba at pagpipitagan, nang hindi agad nililimitahan ang salita sa mas interpretatibong ‘sasamba.’
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Natural at malinaw na katumbas ng Hebreong idyoma na tumutukoy sa pagharap o pagiging nasa presensiya ng isang tao.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Karaniwan, marangal, at angkop na salin sa Filipino ng banal na titulong אֲדֹנָי.
- source_word: וִיכַבְּדוּ
  choice: at pararangalan nila
  rationale: Ang piel ng כבד ay maaaring mangahulugang magparangal o lumuwalhati; ang ‘pararangalan’ ay natural sa pariralang may ‘pangalan’ at pinananatili ang diwa ng pagbibigay-dangal.
- source_word: לִשְׁמֶךָ
  choice: ang iyong pangalan
  rationale: Natural na kayarian sa Filipino para sa paggalang sa pangalan, na kumakatawan din sa ipinakilalang pagkakakilanlan at reputasyon ng Diyos.
theological_decisions:
- issue: Saklaw ng pagtugon ng mga bansa
  choice: Lahat ng bansang ginawa ng Diyos ay inilalarawang darating, yuyukod, at magbibigay-parangal sa kanya.
  alternative: Maaaring unawain bilang masidhing pananalita tungkol sa napakaraming bansa, sa halip na bawat bansa nang walang eksepsiyon.
  rationale: Malinaw na ginagamit ng Hebreo ang כָּל, kaya pinananatili ng salin ang pangkalahatang saklaw at hindi ito kusang pinapaliit.
- issue: Kahulugan ng pagyukod
  choice: yuyukod
  alternative: sasamba
  rationale: Ang pandiwa ay maaaring tumukoy sa pisikal na pagpapatirapa o pagyukod at, sa pagpapalawak, sa pagsamba. Pinananatili sa pangunahing teksto ang kongkretong larawan at inilalagay sa talababa ang leksikal na alternatibo.
- issue: Pagsasalin ng אֲדֹנָי
  choice: Panginoon
  alternative: Amo
  rationale: Bilang banal na titulo sa kontekstong ito, ‘Panginoon’ ang marangal at kinikilalang salin, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak at madaling maunawaang mga pandiwa—‘darating,’ ‘yuyukod,’ at ‘pararangalan’—habang pinananatili ang paralelismo at taimtim na himig ng salmo.
