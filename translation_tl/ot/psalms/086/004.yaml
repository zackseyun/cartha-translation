base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: tl
  text: Pasayahin mo ang kaluluwa ng iyong lingkod[a], sapagkat sa iyo, Panginoon, itinataas ko ang aking kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buhay” o “pagkatao ng iyong lingkod.” Ang salitang Hebreo na nephesh ay maaaring tumukoy sa kaluluwa, buhay, o buong sarili depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ (שׂמח)
  choice: Pasayahin mo
  rationale: Ang Piel imperative ay tuwirang pakiusap na ang Diyos ang magdulot ng galak. Likas sa makabagong Tagalog ang “Pasayahin mo” at malinaw nitong pinananatili ang pautos na anyo.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: kaluluwa / aking kaluluwa
  rationale: Sa panalanging ito, tumutukoy ang נֶפֶשׁ sa kaloob-loobang sarili o buong pagkatao ng salmista. Pinananatili ng “kaluluwa” ang debosyonal na bigat at ang makatang pag-uulit sa dalawang paglitaw.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Sa tuwirang pakikipag-usap sa Diyos sa Mga Awit, ipinahahayag nito ang mapagpakumbabang paglilingkod at debosyon. Mas angkop dito ang “lingkod” kaysa “alipin,” sapagkat hindi panlipunang pagkaalipin ang pangunahing diin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pakiusap. Ang “sapagkat” ay malinaw, marangal, at angkop sa panalangin.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinahahayag ng אֶל ang direksiyon patungo sa Diyos; natural itong kaakibat ng “itinataas ko.”
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Isa itong banal na titulo. Ang “Panginoon” ang karaniwan at marangal na katumbas sa panalanging Tagalog.
- source_word: אֶשָּׂא (נשׂא)
  choice: itinataas ko
  rationale: Pinananatili nito ang Hebreong metapora ng pag-aangat ng sarili sa Diyos sa panalangin at pagtitiwala, nang hindi ito pinapaliwanag nang labis.
theological_decisions:
- issue: Saklaw ng kahulugan ng נֶפֶשׁ sa panalangin
  choice: “kaluluwa” sa dalawang paglitaw
  alternative: “buhay,” “sarili,” o “buong pagkatao”
  rationale: Pinananatili ng “kaluluwa” ang espirituwal at makatang bigat ng talata pati ang sinadyang pag-uulit, ngunit nililinaw sa talababa na mas malawak ang saklaw ng salitang Hebreo at hindi nito ipinipilit ang isang teknikal na antropolohiya.
- issue: Kahulugan ng עבד kaugnay ng Diyos
  choice: iyong lingkod
  alternative: iyong alipin
  rationale: Sa konteksto ng panalanging ito, ang pangunahing diin ay mapagpakumbabang debosyon at paglilingkod sa Diyos, hindi ang kalagayang panlipunan ng isang alipin.
translation_notes:
  register: Makabago ngunit marangal na wikang Tagalog para sa panalangin. Pinanatili ang direktang pakiusap, ang pagtawag na “Panginoon,” ang metapora ng pagtataas ng kaluluwa, at ang pag-uulit ng נֶפֶשׁ. Ang “sapagkat” ay bahagyang pormal ngunit malinaw at angkop sa salmong panalangin.
