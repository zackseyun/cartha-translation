id: PSA.86.1
reference: Psalms 86:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: tl
  text: 'Isang panalangin ni David.


    Ikiling mo ang iyong tainga, Yahweh, at sagutin mo ako, sapagkat ako ay dukha[a] at nangangailangan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinahihirapan.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong dukha, pinahihirapan, o ibinaba ang kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Isang panalangin
  rationale: Likas na salin ng pangngalang nagsasaad ng uri ng awit sa pamagat.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang karaniwang anyong Filipino para sa kaugnayan kay David sa pamagat; hindi nito kailangang tiyakin kung may-akda, may-ari, o pinag-ukulan si David.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Ikiling mo ang iyong tainga
  rationale: Pinananatili ang kongkretong metapora ng Hebreo para sa masusing pakikinig habang nananatiling malinaw sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: עֲנֵנִי
  choice: sagutin mo ako
  rationale: Tumpak at likas na pahayag sa konteksto ng panalangin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng pakiusap sa marangal ngunit nauunawaang wika.
- source_word: עָנִי
  choice: dukha
  rationale: Ipinahahayag ang pangunahing diwa ng karalitaan, ngunit minamarkahan sa talababa ang maaari ring diwang pinahihirapan.
- source_word: וְאֶבְיוֹן
  choice: at nangangailangan
  rationale: Likas na katumbas na nagpapanatili sa paralelismo sa salitang 'dukha'.
- source_word: אָֽנִי
  choice: ako ay
  rationale: Nilalagyan ng likas na pang-ugnay sa Filipino ang nominal na sugnay ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng עָנִי
  choice: dukha, na may talababa
  alternative: pinahihirapan; aba
  rationale: Kasama ng אֶבְיוֹן, malakas ang diwa ng karalitaan at pangangailangan, ngunit maaari ring tumukoy ang salita sa taong pinahihirapan o ibinababa ang kalagayan; hindi nilulutas nang tahimik ang kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Pinanatili ang metaporang “ikiling mo ang iyong tainga” at ang tuwirang panawag na “Yahweh,” habang iniwasan ang labis na sinauna o sektaryong pananalita.
