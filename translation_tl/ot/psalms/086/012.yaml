  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: tl
  text: Pupurihin kita[a], Panginoon kong Diyos, nang buong puso ko, at luluwalhatiin ko ang iyong pangalan magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magpapasalamat ako sa iyo”; maaaring tumukoy ang pandiwang Hebreo sa pasasalamat o pagpupuri sa konteksto ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Pupurihin kita
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpasalamat o magpuri. Sa konteksto ng pagsamba at sa pagkakatambal nito sa pagluwalhati sa pangalan ng Diyos, natural ang “Pupurihin kita.” Ang anyong imperpektibo ay ipinahayag bilang panghinaharap na tila panata.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Pinananatili ang karaniwang marangal na salin ng banal na titulong אֲדֹנָי nang hindi ito pinalalawak.
- source_word: אֱלֹהַי
  choice: kong Diyos
  rationale: Malinaw na ipinapahayag ng hulaping unang panauhan ang “aking Diyos.” Sa tuwirang pagtawag, likas sa Filipino ang “Panginoon kong Diyos.”
- source_word: בְּכָל לְבָבִי
  choice: nang buong puso ko
  rationale: Pinananatili nito ang larawan ng puso at ipinahahayag ang lubos at hindi hati-hating debosyon sa natural na modernong Filipino.
- source_word: וַאֲכַבְּדָה
  choice: at luluwalhatiin ko
  rationale: Ang Piel ng כבד ay nangangahulugang parangalan o luwalhatiin. Dahil “ang iyong pangalan” ang layon at pagsamba ang konteksto, ang “luluwalhatiin” ang angkop na mataas ngunit madaling maunawaang salita.
- source_word: שִׁמְךָ
  choice: ang iyong pangalan
  rationale: Pinananatili ang Hebreong metonimiya ng pangalan bilang kapahayagan ng pagkatao at reputasyon ng Diyos.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal nitong ipinahahayag ang walang hanggang pagpapatuloy sa konteksto ng panata ng pagpupuri.
theological_decisions:
- issue: Pagsasalin sa banal na tawag na אֲדֹנָי אֱלֹהַי
  choice: Panginoon kong Diyos
  alternative: O Panginoon, aking Diyos
  rationale: Pinananatili ang dalawang titulo at ang personal na kaugnayang ipinahahayag ng hulapi, nang walang idinadagdag na pantawag na wala sa Hebreo.
- issue: Saklaw ng kahulugan ng אוֹדְךָ
  choice: Pupurihin kita
  alternative: Magpapasalamat ako sa iyo
  rationale: Tunay na posible ang parehong pagpupuri at pasasalamat. Pinili ang pagpupuri dahil kaagapay nito ang pagluwalhati sa pangalan ng Diyos, habang ang leksikal na alternatibo ay hayagang pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nang buong puso ko” bilang likas na idyoma, at pinanatili ang mataas na wikang panambahan sa “luluwalhatiin” at “magpakailanman.”
