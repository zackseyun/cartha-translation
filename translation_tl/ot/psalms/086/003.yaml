  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: tl
  text: Mahabag ka sa akin[a], Panginoon, sapagkat buong araw akong tumatawag sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagpakitaan mo ako ng kagandahang-loob.” Ang pandiwang Hebreo ay maaaring magpahayag ng pakiusap para sa mapagbiyayang pabor o awa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Mahabag ka sa akin
  rationale: Ang pautos na anyo ng חנן na may hulaping unang panauhan ay isang pakiusap para sa mapagbiyayang pabor o awa. Likas sa makabagong Tagalog na panalangin ang “Mahabag ka sa akin,” bagaman maaari ring idiin ng “Pagpakitaan mo ako ng kagandahang-loob” ang diwa ng pabor.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang kinaugaliang at angkop na salin ng banal na titulong אֲדֹנָי sa panalangin; hindi kailangang gawing “aking Panginoon” ang anyong nakapaloob sa titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng pakiusap at malinaw na pinananatili ng “sapagkat” ang ugnayang sanhi.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng אֶל na may hulaping ikalawang panauhan ang direksiyon ng pagtawag; “sa iyo” ang likas na katambal ng pandiwang “tumatawag.”
- source_word: אֶקְרָא
  choice: akong tumatawag
  rationale: Ang קרא ay maaaring mangahulugang tumawag o dumaing. Pinananatili ng “tumatawag” ang payak na diwa nang hindi nagdaragdag ng tinding hindi tahasang minarkahan.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Likas at tuwirang salin ito ng “lahat/buong araw,” at ipinahihiwatig sa konteksto ang patuloy o paulit-ulit na pagtawag.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: aking Panginoon; Amo
  rationale: Tinutukoy ang Diyos sa panalangin sa pamamagitan ng karaniwang banal na titulo. Isinasalin ang titulo sa likas at marangal na Tagalog nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Saklaw ng kahulugan ng חנן
  choice: Mahabag ka sa akin
  alternative: Pagpakitaan mo ako ng kagandahang-loob
  rationale: Maaaring ipahayag ng pandiwa ang pakiusap para sa awa o mapagbiyayang pabor. Ang pangunahing salin ay natural sa panalangin, habang pinananatili ng talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na wikang panalangin. Ginamit ang “sapagkat” upang mapanatili ang tahasang ugnayang sanhi, at iniwasan ang labis na matindi o sektaryong pananalita.
