  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: tl
  text: Walang katulad mo sa mga diyos[a], Panginoon, at walang mga gawang katulad ng mga gawa mo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga makalangit na nilalang.” Literal na sinasabi ng Hebreo, “sa mga diyos,” isang karaniwang paraan sa Biblia ng pagpapahayag na walang kapantay ang Panginoon sa lahat ng kapangyarihang itinuturing na diyos.
    reason: alternative_reading
  - marker: b
    text: Ang “mga gawa” ay maaari ring isaling “mga ginawa” o “mga kilos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Walang
  rationale: Ang existential negative ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng “walang,” at pinananatili nito ang ganap na pagtanggi.
- source_word: כָּמוֹךָ
  choice: katulad mo
  rationale: Tuwirang ipinahahayag nito ang paghahambing at pagiging walang kapantay ng kinakausap.
- source_word: בָאֱלֹהִים
  choice: sa gitna ng mga diyos
  rationale: Pinananatili ang tahasang maramihang anyo ng Hebreo at ang paghahambing sa loob ng pangkat, nang hindi nilulutas ang teolohikal na tensiyon ng pahayag.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Angkop na salin ng banal na titulong ginagamit bilang panawag sa panalangin; dignificado at likas sa Tagalog.
- source_word: וְאֵין
  choice: at walang
  rationale: Pinananatili ang paralelismong patula at ang ikalawang existential negative sa payak na Tagalog.
- source_word: כְמַעֲשֶׂיךָ
  choice: mga gawang katulad ng sa iyo
  rationale: Ang “mga gawa” ay malawak na katumbas ng מַעֲשֶׂה at maaaring tumukoy sa mga ginawa, dakilang kilos, o gawain ng Diyos.
theological_decisions:
- issue: Kahulugan ng “sa gitna ng mga diyos”
  choice: Panatilihin ang maramihang “mga diyos” bilang patulang pagpapahayag na walang maihahambing sa Panginoon sa lahat ng itinuturing na banal na kapangyarihan.
  alternative: “sa gitna ng mga makalangit na nilalang” o pagpapalabnaw bilang “walang diyos na katulad mo”
  rationale: Maramihan ang אֱלֹהִים sa Hebreo sa pariralang ito. Ang tuwirang salin ay nagpapanatili sa tunay na anyo, puwersa, at teolohikal na tensiyon ng teksto nang hindi ipinapalagay na itinataguyod nito ang politeismo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalangin at tula. Pinanatili ang balanseng paralelismo ng dalawang sugnay at ang tahasang “mga diyos” ng Hebreo.
