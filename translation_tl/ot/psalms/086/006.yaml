base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: tl
  text: 'Dinggin mo, Yahweh, ang aking panalangin,

    at pakinggan mong mabuti ang tinig ng aking mga pagsusumamo para sa awa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “aking mga pagsusumamo”; tumutukoy ito sa marubdob na mga pakiusap para sa awa o lingap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Dinggin mo
  rationale: Ang pautos na anyo ng אזן ay masidhing panawagang makinig. Ang “dinggin mo” ay natural at marangal sa panalangin at pinananatili ang kaibhan nito sa kasunod na pandiwang קשב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: תְּפִלָּתִי
  choice: ang aking panalangin
  rationale: Tuwirang katumbas ng pangngalang תְּפִלָּה na may hulaping unang panauhang isahan.
- source_word: וְהַקְשִׁיבָה
  choice: at pakinggan mong mabuti
  rationale: Ang קשב ay tumutukoy sa maingat at matamang pakikinig; ipinahahayag ng “mabuti” ang diin nito nang natural sa modernong Tagalog.
- source_word: בְּקוֹל
  choice: ang tinig ng
  rationale: Pinananatili ng “tinig” ang tahasang pangngalang קוֹל at ang pandamang larawan ng Hebreo.
- source_word: תַּחֲנוּנוֹתָי
  choice: aking mga pagsusumamo para sa awa
  rationale: Ang תַּחֲנוּנִים ay marubdob na mga pakiusap na humihingi ng lingap o awa. Malinaw itong naipapahayag ng pariralang ito sa kasalukuyang Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang tinatawag ng salmista ang Diyos ng Israel sa kaniyang personal na pangalan. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na wikang angkop sa panalangin. Pinanatili ang paralelismo sa pagitan ng “dinggin” at “pakinggan mong mabuti,” pati ang larawan ng “tinig” sa Hebreo.
