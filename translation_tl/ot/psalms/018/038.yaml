  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: tl
  text: Dudurugin ko sila[a], at hindi sila makakabangon[b]; babagsak sila sa ilalim ng aking mga paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Babasagin ko sila” o “Pababagsakin ko sila”; ang pandiwang Hebreo ay nagpapahiwatig ng marahas na pagdurog sa labanan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi sila makatayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Dudurugin ko sila
  rationale: Ang pandiwang מחץ ay naghahayag ng marahas at matinding pagdurog sa labanan. Likas at malinaw sa modernong Tagalog ang “dudurugin” at pinananatili nito ang lakas ng larawan.
- source_word: וְלֹא
  choice: at hindi
  rationale: Tuwirang pinananatili ang payak na pang-ugnay at pasalungat na pagtanggi ng Hebreo.
- source_word: יֻכְלוּ קוּם
  choice: hindi sila makababangon
  rationale: Ang יכל ay tumutukoy sa kakayahan at ang קום sa pagbangon o pagtayo. Ang “makababangon” ay natural at pinananatili ang larawan ng mga natalong hindi na makatayo mula sa pagkabagsak.
- source_word: יִפְּלוּ
  choice: babagsak sila
  rationale: Tuwirang katumbas ng נפל ang “bumagsak.” Ang aspektong di-ganap ng Hebreo ay natural na naipahahayag dito sa anyong panghinaharap, kaayon ng “dudurugin.”
- source_word: תַּחַת רַגְלָי
  choice: sa ilalim ng aking mga paa
  rationale: Pinananatili ang literal na larawang panlunan at ang diwa ng ganap na pagkatalo.
theological_decisions:
- issue: Marahas na larawan ng labanan sa isang maharlikang awit
  choice: Panatilihin ang unang-panauhang wika ng pagdurog at pagbagsak nang hindi pinapalambot
  alternative: Gumamit ng mas banayad na “tatalunin” o “dadaigin”
  rationale: Tahasan sa Hebreo ang larawan ng marahas na pagdurog at pagbagsak. Ang pagpapalambot nito ay mag-aalis sa tindi ng tekstong pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “makababangon” sa halip na mas kolokyal na “makakabangon,” at pinanatili ang matinding larawang pandigma ng Hebreo.
