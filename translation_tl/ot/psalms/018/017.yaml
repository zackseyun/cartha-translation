  text: יַצִּילֵ֗/נִי מֵ/אֹיְבִ֥/י עָ֑ז וּ֝/מִ/שֹּׂנְאַ֗/י כִּֽי אָמְצ֥וּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: tl
  text: Iniligtas niya ako mula sa malakas kong kaaway[a], at mula sa mga napopoot sa akin[b], sapagkat mas malalakas sila kaysa sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Inililigtas niya ako,” kung ang di-ganap na pandiwa sa tulang Hebreo ay uunawaing may pangkasalukuyang diwa.
    reason: lexical_alternative
  - marker: b
    text: Isahan sa Hebreo ang “kaaway ko”; maramihan naman ang kasunod na parirala, “mga napopoot sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Iniligtas niya ako
  rationale: Ang Hiphil ng נצל ay nangangahulugang ‘magligtas’ o ‘magligtas mula sa panganib.’ Ang aspektong di-ganap ay maaaring magkaroon ng pangkasalukuyang himig sa tula, ngunit ang konteksto ay nagsasalaysay ng nakaraang pagliligtas, kaya natural ang pangnagdaan.
- source_word: מֵאֹיְבִי
  choice: mula sa malakas kong kaaway
  rationale: Isahan ang anyong Hebreo na may hulaping unang panauhan (‘kaaway ko’); pinanatili ang isahan sa Tagalog.
- source_word: עָז
  choice: malakas
  rationale: Tuwirang katumbas ng pang-uring ‘malakas’ o ‘makapangyarihan’ at natural na panuring sa ‘kaaway.’
- source_word: וּמִשֹּׂנְאַי
  choice: at mula sa mga napopoot sa akin
  rationale: Maramihang participle mula sa שׂנא, literal na ‘mga napopoot sa akin.’ Ang sugnay na ito ay natural sa modernong Tagalog at pinananatili ang patuloy na pagkapoot.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikilala nito ang dahilan ng pagliligtas: higit ang lakas ng mga kaaway kaysa sa nagsasalita.'
- source_word: אָמְצוּ מִמֶּנִּי
  choice: mas malalakas sila kaysa sa akin
  rationale: Ang אמץ ay ‘maging malakas,’ at ang מן ay naghahayag ng paghahambing o pagiging nakahihigit; malinaw at natural itong naipahahayag sa Tagalog sa anyong pahambing.
theological_decisions:
- issue: Aspektong temporal ng pambungad na pandiwa sa tulang Hebreo
  choice: 'Pangnagdaang salaysay: “Iniligtas niya ako”'
  alternative: 'Pangkasalukuyan o mala-pangkalahatang pahayag: “Inililigtas niya ako”'
  rationale: Isinasalaysay ng bahaging ito ng salmo ang nakaraang pagkilos ng Diyos bilang tugon sa paghihirap ng salmista. Pinananatili ng pangnagdaan ang daloy ng salaysay nang hindi itinatanggi ang posibleng pangkasalukuyang himig ng anyong Hebreo.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Tagalog. Pinanatili ang isahang “kaaway” at ang maramihang “mga napopoot,” pati ang malinaw na paghahambing ng lakas sa hulihan.
