  text: וַ/יַּרְעֵ֬ם בַּ/שָּׁמַ֨יִם יְֽהוָ֗ה וְ֭/עֶלְיוֹן יִתֵּ֣ן קֹל֑/וֹ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: tl
  text: 'Dumagundong si Yahweh sa kalangitan,

    at ipinarinig ng Kataas-taasan ang kanyang tinig[a]—

    mga batong yelo at mga baga ng apoy.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinigay ang kanyang tinig”; maaari ring “nagpalabas ng kanyang tinig.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “yelo at mga baga ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: Dumagundong
  rationale: Ang pandiwang רעם sa konteksto ng pagpapakita ng Diyos sa gitna ng bagyo ay tumutukoy sa pagdagundong na gaya ng kulog. Likas at makata sa Filipino ang “dumagundong,” at kaagapay ito ng pagbanggit sa tinig ng Diyos.
- source_word: בַּשָּׁמַיִם
  choice: sa kalangitan
  rationale: Ang שׁמים ay tumutukoy sa langit o kalangitan. Pinananatili ng “sa kalangitan” ang mataas na estilong patula nang hindi nagiging lipas ang wika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang banal na יהוה, sa halip na palitan ito ng isang titulo.
- source_word: וְעֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Itinatanghal ng עֶלְיוֹן ang Diyos bilang pinakamataas. Ang “Kataas-taasan” ay matatag, malinaw, at marangal na titulong Filipino.
- source_word: יִתֵּן קֹלוֹ
  choice: ipinarinig ... ang kanyang tinig
  rationale: Literal na “ibinigay ang kanyang tinig,” isang Hebreong idyoma para sa pagpapalabas o pagpaparinig ng tinig. Ang “ipinarinig” ay natural sa modernong Filipino; inilalagay sa talababa ang mas literal na anyo.
- source_word: בָּרָד
  choice: mga batong yelo
  rationale: Bagaman pang-isahan ang anyo, maaari itong gamiting kolektibo. Ang “mga batong yelo” ay kongkreto at karaniwang tawag sa hailstones.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: at mga baga ng apoy
  rationale: Pinananatili nito ang matingkad at sadyang hindi lubos na ipinaliliwanag na larawang Hebreo, nang hindi ipinapalagay na kidlat o ibang tiyak na penomeno ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng “mga batong yelo at mga baga ng apoy” sa naunang sugnay
  choice: Pinanatili bilang biglaang eliptikal na pagpapatuloy pagkatapos ng gatlang
  alternative: Lagyan ng ipinahiwatig na pandiwa gaya ng “nagpadala” o “bumagsak”
  rationale: Walang tahasang pandiwang finite para sa mga elementong ito sa Hebreo. Iniiwasan ng gatlang ang pagdaragdag ng kilos na hindi tahasang sinabi at pinananatili ang maigting na takbo ng tula.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Ginamit ang “dumagundong” upang natural na ilarawan ang kulog nang hindi inuunahan ang tahasang “tinig,” at pinanatili ang elipsis ng huling parirala sa pamamagitan ng gatlang. Ang mga pananda ng talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
