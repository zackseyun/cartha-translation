base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: tl
  text: Umakyat ang usok mula sa kanyang mga butas ng ilong[a], at lumamon ang apoy mula sa kanyang bibig; nagliyab ang mga baga mula sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kanyang galit.” Ang salitang Hebreo na אַף ay maaaring mangahulugang “ilong” o, bilang isang idyoma, “galit.” Dito, pinapaboran ng kaagapay na “mula sa kanyang bibig” ang kongkretong larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: Umakyat ang usok
  rationale: Tuwirang pinananatili ang pataas na kilos ng Qal perfect עָלָה at ang payak na kahulugan ng עָשָׁן.
- source_word: בְּאַפּוֹ
  choice: mula sa kanyang mga butas ng ilong
  rationale: Maaaring mangahulugan ang אַף ng ilong o galit, ngunit pinapaboran ng kaagapay na “mula sa kanyang bibig” at ng larawan ng usok at apoy ang kongkretong kahulugan. Likas sa Filipino ang maramihang “mga butas ng ilong” sa ganitong larawan.
- source_word: מִפִּיו תֹּאכֵל
  choice: lumamon ang apoy mula sa kanyang bibig
  rationale: Pinananatiling pandiwa ang תֹּאכֵל at isinasalin ang aktibong diwang ‘kumain/lumamon/tumupok.’ Ang “lumamon” ay masigla at patula ngunit nauunawaan sa modernong Filipino.
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: nagliyab ang mga baga
  rationale: Ang גֶּחָלִים ay nagliliyab na baga o uling, at ang בָּעֲרוּ ay nagsasaad ng pagliyab o pagkasunog. Iniiwasang ulitin ang ‘nagniningas’ dahil nasa pandiwa na ang diwa.
- source_word: מִמֶּנּוּ
  choice: mula sa kanya
  rationale: Tuwirang pinananatili ang pinagmumulang diwa ng מן nang hindi dinaragdagan kung paano lumabas o nagliyab ang mga baga.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos sa isang teopanikong awit
  choice: Panatilihin ang kongkretong larawang “mga butas ng ilong” at “bibig.”
  alternative: Isalin ang אַף bilang “galit” at gawing mas abstrakto ang larawan.
  rationale: Sadyang gumagamit ang talata ng makapangyarihang larawang pantao upang ilarawan ang pagpapakita ng Diyos. Ang pagpapanatili rito ay tapat sa paralelismo at hindi agad nilulutas ang tunay na leksikal na posibilidad ng ‘galit,’ na inilalagay sa talababa.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Pinanatili ang masidhing larawan at paralelismo ng Hebreo, pati ang bahagyang matigas ngunit sadyang aktibong sugnay na “lumamon ang apoy.”
