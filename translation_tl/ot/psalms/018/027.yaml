  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: tl
  text: Sapagkat inililigtas mo ang mga taong naghihirap[a], ngunit ibinababa mo ang mga matang mapagmataas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taong dukha” o “mga taong aba.” Ang salitang Hebreo ay maaaring tumukoy sa kahirapan, paghihirap, o mababang kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga matang mataas”—isang idyomang Hebreo para sa kapalaluan o pagmamataas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahihiwatig nito ang dahilan o paliwanag kaugnay ng naunang pahayag, habang pinananatili ang patulang daloy.
- source_word: עַם עָנִי
  choice: ang mga taong api
  rationale: Ang עַם ay kolektibong tumutukoy sa isang pangkat ng mga tao, at ang עָנִי ay maaaring mangahulugang dukha, api, o aba. Ang “mga taong api” ay natural sa modernong Tagalog at angkop sa konteksto ng pagliligtas mula sa paghihirap.
- source_word: תוֹשִׁיעַ
  choice: inililigtas mo
  rationale: Ang Hiphil ng ישׁע ay nangangahulugang magligtas o magpalaya mula sa panganib. Malawak at likas sa salin ng Mga Awit ang “inililigtas.”
- source_word: וְ
  choice: ngunit
  rationale: 'Bagaman karaniwang “at” ang pang-ugnay, malinaw na pasalungat ang ugnayan ng dalawang hanay: inililigtas ang api, ngunit ibinababa ang palalo.'
- source_word: עֵינַיִם רָמוֹת
  choice: mga matang palalo
  rationale: Pinananatili nito ang kongkretong Hebreong idyoma ng “matataas na mata,” na tumutukoy sa pagmamataas o kapalaluan.
- source_word: תַּשְׁפִּיל
  choice: ibinababa mo
  rationale: Pinananatili ng “ibinababa” ang larawan ng pagpapababa at ang tuwirang pagsalungat nito sa “matang palalo.”
theological_decisions:
- issue: Saklaw ng kahulugan ng עָנִי
  choice: mga taong api
  alternative: mga taong dukha; mga taong aba
  rationale: Hindi nililimitahan ng “api” ang salita sa kahirapang pangkabuhayan lamang at hindi rin nito ipinapalagay na panloob na kababaang-loob lamang ang tinutukoy. Nananatili rito ang diwa ng mga taong nasa paghihirap na inililigtas ng Diyos.
- issue: Pagpapakahulugan sa “matataas na mata”
  choice: mga matang palalo
  alternative: mga taong mapagmataas
  rationale: Pinananatili ang mismong idyoma at larawan ng Hebreo sa halip na palitan agad ng tahasang pagtukoy sa mga taong mapagmataas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga taong api” sa halip na “bayang api” upang maiwasang magmukhang isang bansang politikal ang tinutukoy, habang pinananatili ang kolektibong diwa. Napanatili ang patulang pagsalungat ng pagliligtas at pagpapababa.
