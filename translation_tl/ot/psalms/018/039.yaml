  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: tl
  text: Sinangkapan mo ako ng lakas para sa labanan[a]; ipinailalim mo sa akin ang mga bumangon laban sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “Binigkisan mo ako ng lakas para sa labanan.”
    reason: lexical_alternative
  - marker: b
    text: O “pinayuko mo sa ilalim ko ang mga bumangon laban sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: Sinangkapan mo ako
  rationale: Ang pandiwang אזר ay literal na tumutukoy sa pagbibigkis at, sa kontekstong ito, sa paghahanda o pagsasangkap. Ang “sinangkapan” ay malinaw sa makabagong Filipino at pinananatili ang diwang inihanda ng Diyos ang nagsasalita.
- source_word: חַיִל
  choice: ng lakas
  rationale: Dito, ang חַיִל ay kakayahan o lakas na kailangan sa pakikipaglaban, hindi hukbo bilang pangkat at hindi lamang katapangan bilang ugali.
- source_word: לַמִּלְחָמָה
  choice: para sa labanan
  rationale: Ang “labanan” ay likas na katumbas sa agarang konteksto ng pakikipaglaban at mas tiyak dito kaysa sa mas malawak na “digmaan.”
- source_word: תַּכְרִיעַ
  choice: ipinailalim mo
  rationale: Ang Hiphil ng כרע ay may larawan ng pagpapayuko o pagpapaluhod. Kasama ng תַּחְתָּי, ang “ipinailalim” ay natural na nagpapahayag ng paggapi at pagpapasakop, samantalang inilalahad sa talababa ang mas pormal na larawan ng pagpapayuko.
- source_word: קָמַי
  choice: ang mga bumangon laban sa akin
  rationale: Pinananatili nito ang pandiwang larawan ng mga taong tumindig o naghimagsik laban sa nagsasalita, sa halip na gawing pangkalahatang “mga kaaway.”
- source_word: תַּחְתָּי
  choice: sa akin
  rationale: Sa pariralang “ipinailalim mo sa akin,” naipapahayag ang spatial na larawan ng תַּחְתָּי bilang tanda ng pagkatalo at pagpapasakop.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na may bahagyang patulang himig. Ginamit ang “sinangkapan” para sa malinaw na pangunahing teksto, habang pinanatili sa talababa ang literal na talinghaga ng pagbibigkis. Ang ikalawang sugnay ay ginawang natural sa Filipino nang hindi inaalis ang larawan ng paggapi at pagpapailalim.
