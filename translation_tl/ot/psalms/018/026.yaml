  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: tl
  text: Sa taong dalisay, ipinakikita mong dalisay ka; at sa taong baluktot, ipinakikita mong pilipit ka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ipinakikita mong tuso ka” o “dinaraig mo sa talino ang baluktot.” Gumagamit ang Hebreo ng magkatugmang paglalaro ng mga salita: pinakikitunguhan ng Diyos ang taong baluktot sa paraang tumutugma sa at bumabaligtad sa kabaluktutan ng taong iyon; hindi ito nangangahulugang siya mismo ay nagiging baluktot sa moral na diwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: dalisay
  rationale: Tumutukoy ang salita sa kalinisan o kadalisayang moral. Likas at marangal ang “dalisay” sa makabagong Filipino at naipaparis ito sa kasunod na pandiwang mula sa parehong ugat.
- source_word: תִּתְבָּרָר
  choice: ipinakikita mong dalisay ka
  rationale: Ang hitpael ng ברר ay nagpapahayag dito ng pagpapamalas ng sarili bilang dalisay kaugnay ng taong dalisay; pinananatili ng salin ang ugnayang diwa at ang pag-uulit ng salita.
- source_word: עִקֵּשׁ
  choice: baluktot
  rationale: Tumutukoy ito sa taong lihis o pilipit ang asal. Ang “baluktot” ay malinaw na talinghagang moral at kaagapay ng kasunod na larawan ng pagkapilipit.
- source_word: תִּתְפַּתָּל
  choice: ipinakikita mong mapilipit ka
  rationale: Ang hitpael ng פתל ay maaaring tumukoy sa pagkilos na pilipit o tuso. Pinananatili ng “mapilipit” ang matinding paralelismo at nakakagulat na talinghaga ng Hebreo nang hindi tahimik na pinapahina ito.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa tugon ng Diyos sa taong baluktot
  choice: Panatilihin sa pangunahing teksto ang matinding katumbasang “ipinakikita mong mapilipit ka.”
  alternative: “ipinakikita mong tuso ka” o “dinaraig mo sa talino ang baluktot”
  rationale: Inilalarawan ng tula ang tugon ng Diyos na tumutugma at bumabaligtad sa kabaluktutan ng tao. Pinananatili ng pangunahing teksto ang tunay na tensiyon at paralelismo; nililinaw ng talababa na hindi ito pagsasabing nagiging masama ang Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismong patula na “dalisay/dalisay” at “baluktot/mapilipit,” kasama ang matinding teolohikal na tensiyon ng orihinal.
