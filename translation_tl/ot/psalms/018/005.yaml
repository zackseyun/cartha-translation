  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: tl
  text: Pinalibutan ako ng mga lubid ng Sheol[a]; sinalubong[b] ako ng mga bitag ng kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay” para sa “Sheol.”
