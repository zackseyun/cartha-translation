lexical_decisions:
- source_word: חֶבְלֵי
  choice: mga lubid ng
  rationale: Pinananatili ng “mga lubid” ang konkretong larawang patula ng pagkagapos o pagkakasilo, nang hindi ito binibigyang-kahulugang mga hapdi ng panganganak.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang salitang Hebreo upang huwag paliitin ang saklaw nito tungo lamang sa libingan o lagyan ito ng mas huling doktrinal na kahulugan.
- source_word: סְבָבוּנִי
  choice: Pinalibutan ako
  rationale: Tuwirang ipinapahayag ang pag-ikot o pagpalibot sa nagsasalita at natural sa modernong Tagalog.
- source_word: קִדְּמוּנִי
  choice: sinalubong ako
  rationale: Ang pandiwa ay maaaring mangahulugang humarap, sumalubong, o makatagpo. Ipinahihiwatig ng “sinalubong” ang bantang pagharap habang pinananatili ang kilos ng pagdating sa harap.
- source_word: מוֹקְשֵׁי
  choice: mga bitag ng
  rationale: Karaniwan at malinaw na katumbas ang “mga bitag,” at pinananatili nito ang larawan ng panganib na lihim na naghihintay.
- source_word: מָוֶת
  choice: kamatayan
  rationale: Pamantayang salin na nagpapanatili sa kamatayan bilang nagbabantang kapangyarihan sa taludtod.
theological_decisions:
- issue: Pagpapakahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Pinananatili ng transliterasyon ang lawak at tunay na kalabuan ng konseptong Hebreo, at hindi ito ipinapantay agad sa isang tiyak na doktrina tungkol sa kabilang-buhay.
- issue: Lakas ng קִדְּמוּנִי
  choice: sinalubong ako
  alternative: humarap sa akin; dumating sa harap ko; nakatagpo ako
  rationale: Ang konteksto ay mapanganib, ngunit hindi kailangang dagdagan ng tahasang ideya ng pagsalakay. Ang “sinalubong” ay likas at nananatiling malapit sa diwa ng pagharap o pagtatagpo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang magkatambal na larawang “mga lubid” at “mga bitag,” gayundin ang pagkakaiba ng Sheol at kamatayan. Inilagay ang bawat talababa kaagad pagkatapos ng pariralang tinutukoy nito.
