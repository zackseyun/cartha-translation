  naturalness: Marangal at malinaw ang Tagalog. Mas likas at mas tiyak sa larawang militar ang "makakasugod ako laban sa" kaysa "masasalakay ko ang." Ang paglalagay ng "ay" pagkatapos ng mga pariralang pambukas ay nagbibigay ng maayos na daloy nang hindi binabago ang diin.
  terminology: Ang "pangkat ng mga mandirigma" ay angkop para sa גְּדוּד nang hindi ito ginagawang buong hukbo. Ang "pader" ang payak na katumbas ng שׁוּר; ang "muog" ay wastong alternatibong talababa. Napananatili ang personal at teolohikong mahalagang "aking Diyos."
