  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: tl
  text: Sapagkat sa pamamagitan mo ay makakasugod ako laban sa isang pangkat ng mga mandirigma[a]; at sa pamamagitan ng aking Diyos ay malulundagan ko ang isang pader[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makakatakbo ako laban sa isang pangkat ng mga mananalakay.”
    reason: lexical_alternative
  - marker: b
    text: O “malulundagan ko ang isang muog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o paliwanag kaugnay ng nakapaligid na patotoo ng papuri.
- source_word: בְךָ
  choice: sa pamamagitan mo
  rationale: Ipinakikita ng ב ang paraan o kapangyarihang nagmumula sa Diyos; malinaw at likas ito sa modernong Tagalog.
- source_word: אָרֻץ
  choice: masasalakay ko
  rationale: Ang literal na larawan ay pagtakbo, ngunit sa kontekstong militar tumutukoy ito sa mabilis na pagsugod laban sa kaaway. Pinananatili ng anyong potensiyal ang pahiwatig ng kakayahang kaloob ng Diyos.
- source_word: גְּדוּד
  choice: isang pangkat ng mga mandirigma
  rationale: Ang גְּדוּד ay pangkat militar o pangkat ng mga mananalakay; iniiwasan nitong palakihin ang saklaw na parang buong hukbo.
- source_word: וּבֵאלֹהַי
  choice: at sa pamamagitan ng aking Diyos
  rationale: Pinananatili ang parallelismo sa unang sugnay at ang personal na pagpapahayag na 'aking Diyos.'
- source_word: אֲדַלֶּג
  choice: malulundagan ko
  rationale: Tapat ito sa larawan ng דלג, ang paglukso o paglundag upang malampasan ang isang hadlang, at ipinahahayag ang kakayahang dulot ng Diyos.
- source_word: שׁוּר
  choice: isang pader
  rationale: Ito ang payak at malawak na kahulugan, bagaman sa kontekstong militar maaari itong tumukoy sa muog o tanggulang pader.
theological_decisions:
- issue: Kalikasan ng larawang militar sa talata
  choice: Panatilihin ang kongkretong larawan ng pagsalakay sa pangkat ng mga mandirigma at paglundag sa pader bilang patotoo sa kapangyarihang kaloob ng Diyos.
  alternative: Gawing pangkalahatang pahayag tungkol sa pagdaig sa mga pagsubok sa buhay.
  rationale: Tahasang militar ang mga salitang Hebreo. Hindi dapat espirituwalisahin sa salin ang larawan, bagaman maaaring makita ng mambabasa ang mas malawak na aplikasyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'sa pamamagitan mo' upang malinaw na ipahayag ang banal na pagpapalakas, at pinanatili ang dalawang kongkretong larawang militar. Ang mga panandang [a] at [b] ay nasa mismong teksto at tumutugma sa mga talababa.
