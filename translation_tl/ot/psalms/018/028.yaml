  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: tl
  text: 'Sapagkat ikaw ang nagsisindi ng aking ilawan[a];

    Yahweh, ang aking Diyos, ang nagbibigay-liwanag sa aking kadiliman[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinagniningning mo ang aking ilawan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “aking kadiliman”; maaaring tumukoy ang parirala sa kapighatian, panganib, o kalungkutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng papuri at pagtitiwala sa konteksto; likas at marangal ang “Sapagkat” sa tulang Filipino.
- source_word: תָּאִיר
  choice: nagsisindi
  rationale: Ang Hiphil ng אור ay causative, “magbigay-liwanag” o “magpaliwanag.” Sa kaugnayan ng ilawan, natural sa Filipino ang “nagsisindi” at nananatili ang kongkretong larawan.
- source_word: נֵרִי
  choice: aking ilawan
  rationale: Literal na “aking ilawan”; pinananatili nito ang kongkretong metapora sa halip na gawing abstraktong “liwanag.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: Tapat na isinasalin ang pangngalang may panlaping paari at pinananatili ang personal na pagpapahayag ng ugnayan.
- source_word: יַגִּיהַּ
  choice: pinagliliwanag
  rationale: Ipinahahayag ng pandiwa ang pagpapaliwanag o pagpapaliwanag nang maliwanag; malinaw at natural ang “pinagliliwanag” at kaagapay ito ng larawan ng pagsindi sa unang linya.
- source_word: חָשְׁכִּי
  choice: aking kadiliman
  rationale: Literal na pangngalang may unang-panauhang panlapi. Pinananatili nito ang sadyang malawak na metapora na maaaring tumukoy sa kapighatian, panganib, o kalungkutan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; ang “Yahweh” ay mas tuwirang transliterasyon at pinananatili itong personal na pangalan, hindi titulo.
- issue: Kahulugan ng “aking kadiliman”
  choice: Panatilihin bilang bukas na metapora
  alternative: Tukuyin bilang kapighatian, panganib, o kalungkutan
  rationale: Hindi nililinaw ng tekstong Hebreo kung panlabas na kagipitan o panloob na kalungkutan ang tinutukoy, kaya hindi dapat tahimik na piliin ang isa lamang.
translation_notes:
  register: Modernong Filipino na may marangal at makatang himig. Ginamit ang karaniwang “nagsisindi” sa larawan ng ilawan at pinanatili ang “aking kadiliman” upang hindi paliitin ang saklaw ng metapora. Ang tuwirang paglipat mula sa “ikaw” tungo sa “Yahweh na aking Diyos” ay sumusunod sa paralelismo at gramatika ng Hebreo.
