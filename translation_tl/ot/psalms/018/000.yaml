revisions:
- from: Para sa tagapangasiwa ng musika.[a] Awit ni David,[b] na lingkod[c] ni Yahweh. Binigkas niya kay Yahweh ang mga salita ng awit na ito nang iligtas siya ni Yahweh mula sa kamay ng lahat niyang kaaway at mula sa kamay ni Saul.[d]
  to: Para sa tagapangasiwa ng musika.[a] Awit ni David,[b] ang lingkod ni Yahweh,[c] na bumigkas kay Yahweh ng mga salita ng awit na ito noong araw na iniligtas siya ni Yahweh mula sa kamay ng lahat ng kanyang mga kaaway at mula sa kamay ni Saul.[d]
  rationale: Inayos ang apposition upang malinaw na si David ang “lingkod ni Yahweh,” hindi ang awit. Ibinalik ang tahasang temporal na elementong “noong araw na” para sa בְּיוֹם, habang pinanatili ang natural na Filipino, ang pangalan na “Yahweh,” ang pag-uulit ng “mula sa kamay,” at lahat ng umiiral na talababa.
