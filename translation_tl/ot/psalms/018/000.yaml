  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לַ/מְנַצֵּ֤חַ לְ/עֶ֥בֶד יְהוָ֗ה לְ/דָ֫וִ֥ד אֲשֶׁ֤ר דִּבֶּ֨ר לַ/יהוָ֗ה אֶת דִּ֭בְרֵי הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/י֤וֹם הִֽצִּיל יְהוָ֘ה אוֹת֥/וֹ מִ/כַּ֥ף כָּל אֹ֝יְבָ֗י/ו וּ/מִ/יַּ֥ד שָׁאֽוּל׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika.[a] Awit ni David,[b] ang lingkod ni Yahweh,[c] na bumigkas kay Yahweh ng mga salita ng awit na ito noong araw na iniligtas siya ni Yahweh mula sa kamay ng lahat ng kanyang mga kaaway at mula sa kamay ni Saul.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Para sa punong mang-aawit.” Hindi tiyak ang eksaktong tungkuling tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, maaaring mangahulugan ang pormula na ang awit ay kay David, para kay David, o kaugnay ni David; karaniwan itong nauunawaan bilang pagtukoy sa kanyang pagkakatha.
    reason: source_ambiguity
  - marker: c
    text: Maaari ring isaling “alipin.” Maaaring tumukoy ang salitang Hebreo sa lingkod o alipin; dito ay ginagamit ito bilang marangal na katawagan kay David.
    reason: lexical_alternative
  - marker: d
    text: Ang “mula sa kamay” ay idyomang Hebreo na nangangahulugang mula sa kapangyarihan o kontrol ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Karaniwang pormula ito sa mga pamagat ng Awit. Ang salitang Hebreo ay tumutukoy sa isang namumuno o nangangasiwa; ipinahahayag ng salin ang malamang na tungkulin nito sa kontekstong pangmusika nang hindi nililimitahan sa koro lamang.
- source_word: לְדָוִד
  choice: Awit ni David
  rationale: Natural itong pormula sa modernong Tagalog para sa pamagat ng isang awit. Gayunman, hindi ganap na tinutukoy ng pang-ukol na Hebreo kung ito ay akda, pag-aari, alay, o kaugnay kay David, kaya pinananatili sa talababa ang saklaw ng posibilidad.
- source_word: לְעֶבֶד יְהוָה
  choice: na lingkod ni Yahweh
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod o alipin. Dito ay marangal na katawagan ito kay David bilang taong naglilingkod at nabibilang kay Yahweh, kaya mas angkop sa konteksto ang “lingkod,” habang binabanggit ang alternatibo sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: Binigkas niya kay Yahweh ang mga salita ng awit na ito
  rationale: Pinananatili nito ang tahasang pagkilos ng pagsasalita, ang patungkol na “kay Yahweh,” at ang pormal na pariralang “mga salita ng awit na ito,” ngunit gumagamit ng natural na ayos sa Tagalog.
- source_word: בְּיוֹם הִצִּיל
  choice: nang iligtas
  rationale: Ang literal na “noong araw na iligtas” ay isang Hebreong paraan ng pagtukoy sa pagkakataon ng pagliligtas. Ang “nang iligtas” ay likas sa Tagalog at hindi nangangahulugang iisang araw lamang ang buong pagliligtas.
- source_word: מִכַּף כָּל אֹיְבָיו וּמִיַּד שָׁאוּל
  choice: mula sa kamay ng lahat niyang kaaway at mula sa kamay ni Saul
  rationale: Pinananatili ang konkretong metapora at ang paralelismo ng Hebreo. Sa konteksto, ang “kamay” ay tumutukoy sa kapangyarihan o kontrol, na nililinaw sa talababa.
theological_decisions:
- issue: Paglalarawan sa pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin pinipili ang anyong “Jehova,” na nagmula sa mas huling pinagsamang tradisyon ng pagbasa.
- issue: Kung “lingkod” o “alipin” ang עֶבֶד
  choice: lingkod
  alternative: alipin
  rationale: Parehong nasa saklaw ng salitang Hebreo. Sa pamagat na ito, marangal na pagkakakilanlan ni David sa kaugnayan niya kay Yahweh ang nangingibabaw, kaya “lingkod” ang mas natural; hindi itinatanggi ng talababa ang mas matinding diwa ng pag-aari at pagpapasakop na maaaring taglayin ng salita.
- issue: Ugnayan ni David sa awit sa pariralang לְדָוִד
  choice: Awit ni David
  alternative: Para kay David; ukol kay David; kaugnay ni David
  rationale: Karaniwang nauunawaan ang pormula bilang pag-uugnay ng awit kay David, madalas bilang may-akda. Dahil hindi espesipiko ang pang-ukol sa Hebreo, hindi idinidikta sa talababa na awtor lamang ang posibleng ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang anyo ng pamagat at ang paulit-ulit na pangalang “Yahweh,” pati ang metaporang “mula sa kamay,” habang inilagay sa mga talababa ang mga tunay na kalabuan sa Hebreo.
