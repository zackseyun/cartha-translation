  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
translation:
  language: tl
  text: 'Pinaluluwang mo ang aking hakbang sa ilalim ko[a],

    at hindi nadulas ang aking mga bukung-bukong.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Binibigyan mo ng luwang ang aking hakbang.” Inilalarawan ng idyomang Hebreo ang pagbibigay ng Diyos ng sapat na puwang at matatag na tuntungan sa paghakbang.
    reason: lexical_alternative
  - marker: b
    text: O “at hindi natisod ang aking mga bukung-bukong”; maaari ring ipahiwatig ng pandiwa ang pagsuray o pagkawala ng matatag na tuntungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Pinaluluwang mo
  rationale: Pinananatili ang causative na diwa ng Hiphil ng רחב, “gawing maluwang” o “paluwangin,” at ang tuwirang pakikipag-usap sa Diyos.
- source_word: צַעֲדִי
  choice: ang aking hakbang
  rationale: Ang pangngalan ay tumutukoy sa “aking hakbang” o “aking paghakbang.” Pinanatili ang mismong larawan at gramatikal na layon sa halip na palitan ito ng “lupa” o “daan.”
- source_word: תַחְתָּי
  choice: sa ilalim ko
  rationale: Tuwirang pinananatili ang pansahalang kahulugan na “sa ilalim ko,” kahit ang buong parirala ay isang matalinghagang larawan ng maluwag at matatag na tuntungan.
- source_word: וְלֹא מָעֲדוּ
  choice: at hindi nadudulas
  rationale: Ang מעד ay maaaring mangahulugang madulas, sumuray, o mawalan ng matatag na tuntungan. Ang “hindi nadudulas” ay likas sa Filipino at akma sa bukung-bukong bilang simuno.
- source_word: קַרְסֻלָּי
  choice: ang aking mga bukung-bukong
  rationale: Pinananatili ang tiyak at matingkad na katawagan sa mga bukung-bukong sa halip na gawing mas pangkalahatang “mga paa.”
