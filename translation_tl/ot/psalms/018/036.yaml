translation_notes:
  register: Makabagong Filipino na marangal at patula. Pinanatili ang kakaibang ngunit malinaw na larawan ng Hebreo—ang pagpapaluwang sa hakbang “sa ilalim” ng nagsasalita—sa halip na tahasang palitan ito ng paliwanag gaya ng “pinaluluwang ang daan.”
