  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֤ה סַֽלְעִ֥/י וּ/מְצוּדָתִ֗/י וּ/מְפַ֫לְטִ֥/י אֵלִ֣/י צ֭וּרִ/י אֶֽחֱסֶה בּ֑/וֹ מָֽגִנִּ֥/י וְ/קֶֽרֶן יִ֝שְׁעִ֗/י מִשְׂגַּבִּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: tl
  text: 'Si Yahweh ang aking batong bangin,

    aking kuta at aking tagapagligtas;

    aking Diyos, aking malaking bato—

    sa kanya ako kumakanlong—

    aking kalasag at sungay ng aking kaligtasan[b],

    at aking mataas na kanlungan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sa Bibliya, ang “sungay” ay larawan ng lakas at ng kapangyarihang nagdudulot ng matagumpay na pagliligtas.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: סַלְעִי
  choice: aking batong tanggulan
  rationale: Ipinahihiwatig ng סֶלַע ang matibay na batuhan o batong dalisdis na nagsisilbing proteksiyon. Pinananatili ng saling ito ang larawang-bato ngunit inihihiwalay ito sa צוּרִי sa kasunod na linya.
- source_word: מְצוּדָתִי
  choice: aking kuta
  rationale: Ang מְצוּדָה ay isang lugar na pinatibay para sa pagtatanggol; maikli, likas, at malinaw sa modernong Tagalog ang “kuta.”
- source_word: מְפַלְטִי
  choice: aking tagapagligtas
  rationale: Ang anyong Hebreo ay tumutukoy sa isang nagpapalaya o nagliligtas mula sa panganib. Pinananatili ng “tagapagligtas” ang personal at aktibong diwa nito.
- source_word: אֵלִי
  choice: aking Diyos
  rationale: Sa kontekstong ito, ang אֵל na may hulaping paari ay tuwirang katawagan sa Diyos.
- source_word: צוּרִי
  choice: aking malaking bato
  rationale: Ang צוּר ay larawan ng katatagan at proteksiyon. Ang “malaking bato” ay natural na salin at nananatiling naiiba sa “batong tanggulan” para sa סֶלַע.
- source_word: אֶחֱסֶה בּוֹ
  choice: sa kanya ako nanganganlong
  rationale: Ang חסה ay nangangahulugang humanap o kumuha ng kanlungan. Pinananatili ng “nanganganlong” ang konkretong larawan ng proteksiyon, sa halip na gawing pangkalahatang “nagtitiwala.”
- source_word: מָגִנִּי
  choice: aking kalasag
  rationale: Tuwirang pinananatili ang larawang pandigma at pananggalang ng Hebreo.
- source_word: קֶרֶן יִשְׁעִי
  choice: sungay ng aking kaligtasan
  rationale: 'Pinananatili ang matapang na metaporang Hebreo: ang sungay ay sagisag ng lakas at matagumpay na pagliligtas.'
- source_word: מִשְׂגַּבִּי
  choice: aking mataas na kanlungan
  rationale: Tumutukoy ang מִשְׂגָּב sa isang mataas at mahirap marating na ligtas na lugar. Naipapakita ng saling ito ang taas at seguridad nito at hindi ito ipinapareho sa naunang “kuta.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Ang “Yahweh” ang mas malapit na karaniwang transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Pagpapanatili sa magkakaibang larawan ng proteksiyon
  choice: batong tanggulan, kuta, malaking bato, kalasag, sungay, at mataas na kanlungan
  alternative: Pagpapantay-pantay sa mga ito bilang “bato” o “tanggulan” lamang
  rationale: Sinasadyang ipagsama ng tulang Hebreo ang maraming magkakaiba ngunit magkakaugnay na larawan. Pinananatili ng salin ang pagkakaibang iyon nang hindi dinaragdagan ang teolohikal na kahulugan.
- issue: Metapora ng קֶרֶן יִשְׁעִי
  choice: sungay ng aking kaligtasan
  alternative: aking makapangyarihang tagapagligtas
  rationale: Hindi nilulutas sa isang paliwanag ang masinsing metapora ng Hebreo. Pinananatili ito sa teksto at nililinaw lamang sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Pinanatili ang maikli at sunod-sunod na mga larawang makata ng Hebreo. Ginamit ang “nanganganlong” para sa malinaw na larawang naghahanap ng proteksiyon, at pinag-iba ang “kuta” at “mataas na kanlungan” upang katawanin ang dalawang magkaibang terminong Hebreo.
