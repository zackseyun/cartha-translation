  text: בְּנֵי נֵכָ֥ר יִבֹּ֑לוּ וְ֝/יַחְרְג֗וּ מִֽ/מִּסְגְּרֽוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/045.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: tl
  text: Nanghihina ang mga dayuhan, at nanginginig silang lumalabas mula sa kanilang mga kuta.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mga anak ng dayuhan” o “mga anak ng pagiging dayuhan”; maaari ring isaling “mga anak ng mga dayuhan.”'
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang pandiwang isinaling “nanginginig silang lumalabas”; maaari rin itong mangahulugang “lumalabas silang nakayuko sa takot” o “papilay-pilay silang lumalabas.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kuta” ay maaari ring isaling “mga tanggulan” o, sa mas pangkalahatang diwa, “mga napapaderang lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: mga dayuhan
  rationale: Ang literal na idyomang Hebreo ay “mga anak ng pagiging dayuhan/dayuhan,” ngunit sa modernong Tagalog, ang “mga anak ng mga dayuhan” ay maaaring magpahiwatig lamang ng lahi o magulang. Ang “mga dayuhan” ang natural na katumbas sa konteksto, habang inilalahad sa talababa ang literal na anyo.
- source_word: יִבֹּלוּ
  choice: nanghihina
  rationale: Ang Qal ng נבל ay maaaring mangahulugang malanta, kumupas, o mawalan ng lakas. Sa paglalarawan sa mga natalong kaaway, malinaw at makatang ipinahahayag ng “nanghihina” ang unti-unting pagkawala ng kanilang lakas nang hindi inililipat dito ang diwa ng panginginig.
- source_word: וְיַחְרְגוּ
  choice: nanginginig silang lumalabas
  rationale: Bihira at hindi tiyak ang pandiwang חרג. Malamang na inilalarawan nito ang paglabas nang may takot o pagkabalisa. Pinananatili ng salin ang malamang na diwa, at binabanggit sa talababa ang iba pang posibilidad.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: mula sa kanilang mga kuta
  rationale: Ang מִסְגְּרוֹת ay tumutukoy sa mga nakukulong o napapaderang lugar. Sa kontekstong militar, natural ang “mga kuta,” samantalang ang “mga kulungan” ay maaaring magpahiwatig na bihag na sila.
