translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “mga dayuhan” sa pangunahing teksto upang maiwasan ang mapanlinlang na literalismong “mga anak ng mga dayuhan,” ngunit pinanatili sa talababa ang tahasang idyomang Hebreo. Ang tatlong panandang [a], [b], at [c] ay nasa pangunahing teksto.
