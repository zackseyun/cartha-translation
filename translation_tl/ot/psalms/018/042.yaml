translation:
  language: tl
  text: Dinurog ko silang pino na parang alabok na tinatangay ng hangin[a]; gaya ng putik sa mga lansangan, ibinuhos ko sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa ibabaw ng mukha ng hangin”; isang larawang Hebreo para sa alabok na tinatangay o ikinakalat ng hangin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “gaya ng putik sa mga lansangan, inubos ko sila.” Ang pandiwang Hebreo ay maaaring mangahulugang “ibuhos” o “ubusin/alisan ng laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Dinurog ko silang pino
  rationale: Ang Qal ng שׁחק na may hulaping tumutukoy sa kanila ay nagpapahiwatig ng pagdurog o paggiling hanggang maging pinong butil. Likas sa modernong Filipino ang “dinurog ko silang pino” at napapanatili nito ang larawan ng lubusang pagwasak.
- source_word: כְּעָפָר
  choice: parang alabok
  rationale: Karaniwang tumutukoy ang עָפָר sa alabok o maluwag na lupa. Ang “alabok” ang pinakanatural dito at kaayon ng larawan ng pinong dinurog na bagay.
- source_word: עַל פְּנֵי רוּחַ
  choice: na tinatangay ng hangin
  rationale: Literal itong “sa ibabaw/harap ng hangin,” ngunit inilalarawan ng idyomang Hebreo ang alabok na dinadala o ikinakalat ng hangin. Malinaw at natural sa Filipino ang “tinatangay ng hangin.”
- source_word: כְּטִיט חוּצוֹת
  choice: parang putik sa mga lansangan
  rationale: Ang טִיט ay putik o burak, at ang חוּצוֹת ay mga lansangan o pampublikong daan. Pinananatili ng salin ang mapanghamak na larawan habang gumagamit ng pangkaraniwang modernong salita.
- source_word: אֲרִיקֵם
  choice: ibinuhos ko sila
  rationale: Ang Hiphil ng ריק ay maaaring mangahulugang ibuhos o alisan ng laman. Ang “ibinuhos ko sila” ay nagpapanatili sa kongkretong larawan at umaayon sa putik na ibinubuhos sa lansangan.
