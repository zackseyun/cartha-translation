  text: וָ/אֱהִ֣י תָמִ֣ים עִמּ֑/וֹ וָ֝/אֶשְׁתַּמֵּ֗ר מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/023.yaml
  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: tl
  text: Ako’y walang kapintasan sa harap niya[a][b], at iningatan ko ang aking sarili mula sa aking kasamaan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buo” o “matuwid.” Ang “walang kapintasan” dito ay tumutukoy sa integridad, hindi kinakailangang sa ganap na kawalan ng kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “niya” ay tumutukoy sa PANGINOON ayon sa nakapaligid na konteksto. Mas literal din ang “kasama niya” para sa pariralang Hebreo.
    reason: cross_reference_and_lexical_alternative
  - marker: c
    text: Maaari ring “mula sa aking sala” o “mula sa aking pagkakasala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Naging … ako
  rationale: Ang Qal wayyiqtol na unang panauhan ng היה ay nagsasaad dito ng kalagayan sa nakaraang salaysay. Pinananatili ng “naging … ako” ang pandiwang anyo, bagaman hindi nito kailangang ipahiwatig ang isang tiyak na sandali ng pagbabago.
- source_word: תָמִים
  choice: walang kapintasan
  rationale: Sa kontekstong moral, tumutukoy ang תמים sa integridad o pagiging buo at matuwid, hindi kinakailangang sa ganap na kawalan ng kasalanan. Malinaw at marangal sa modernong Filipino ang “walang kapintasan.”
- source_word: עִמּוֹ
  choice: sa harap niya
  rationale: Literal na may diwang “kasama niya” ang עִמּוֹ, ngunit sa pahayag tungkol sa asal at integridad, likas sa Filipino ang “sa harap niya,” na nagpapahayag ng katayuan ng nagsasalita kaugnay niya. Pinananatili ang panghalip sa halip na tahasang ipalit ang pangalan ng PANGINOON.
- source_word: וָאֶשְׁתַּמֵּר
  choice: iningatan ko ang aking sarili
  rationale: 'Ang Hitpael ng שמר ay may reflexive na diwa: binantayan o iningatan ng nagsasalita ang kanyang sarili. Tahasang pinananatili ng salin ang diwang ito.'
- source_word: מֵעֲוֺנִי
  choice: mula sa aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, kasalanan, o pagkakasala/pananagutan. Pinananatili ng “aking kasamaan” ang malakas na moral na diwa at ang panlaping unang panauhan; ang מִן ay isinaling “mula sa.”
theological_decisions:
- issue: Ang kahulugan ng “walang kapintasan” kaugnay ng kalagayang moral ng tao
  choice: Tumutukoy ito sa integridad o matuwid na pamumuhay sa ugnayan niya sa Diyos, nang hindi awtomatikong ipinapakahulugang ganap na walang kasalanan.
  alternative: Unawain ito bilang pag-aangkin ng lubos na kawalang-kasalanan.
  rationale: Malakas ang pag-aangkin ng salmista tungkol sa kanyang asal, kaya hindi ito pinahihina; gayunman, hindi rin dinaragdagan ang teksto ng doktrina ng ganap na kawalang-kasalanan. Pinananatili ng talababa ang saklaw ng תמים.
- issue: Ang tinutukoy ng panghalip na “niya”
  choice: Panatilihin ang panghalip sa pangunahing teksto at tukuyin sa talababa na ang PANGINOON ang tinutukoy ayon sa konteksto.
  alternative: Ilagay nang tuwiran ang “PANGINOON” sa pangunahing teksto.
  rationale: Panghalip ang nasa Hebreo sa talatang ito. Ang pagpapanatili rito ay tapat sa anyo ng pinagmulan habang nililinaw ng talababa ang reperensiya.
- issue: Saklaw ng עָוֹן
  choice: “aking kasamaan,” na pinananatiling bukas kung ito ay partikular na hilig o gawa ng pagkakasala.
  alternative: “aking sala” o “aking pagkakasala,” na maaaring higit na magdiin sa guilt o pananagutan.
  rationale: Maraming magkakaugnay na diwa ang עָוֹן. Ang pangunahing salin ay hindi dapat tahasang pumili ng legal na “guilt” kung hindi iyon sapilitang hinihingi ng konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “walang kapintasan” at “iningatan ko ang aking sarili” upang mapanatili ang lakas at reflexive na anyo ng Hebreo; inilagay sa mga talababa ang mahahalagang alternatibo at ang kontekstuwal na reperensiya ng panghalip.
