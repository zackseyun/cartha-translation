base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: tl
  text: Ang Diyos na nagbibigkis sa akin ng lakas[a] at ginagawang walang kapintasan ang aking landas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbibigay sa akin ng kapangyarihan.” Literal na inilalarawan ng Hebreo ang pagbibigkis ng חָיִל, na maaaring mangahulugang lakas, kapangyarihan, o kagitingan.
    reason: lexical_alternative
  - marker: b
    text: O “ginagawang ganap/buo ang aking landas.” Ang תָּמִים ay maaaring tumukoy sa kabuuan, integridad, o pagiging walang kapintasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Ang Diyos
  rationale: Pinananatili ng pantukoy na “Ang” ang tiyak at mapaglarawang anyo ng Hebreo habang natural pa rin sa Filipino.
- source_word: הַמְאַזְּרֵנִי
  choice: na nagbibigkis sa akin
  rationale: Mula sa אזר, na tumutukoy sa pagbibigkis o pagsusuot ng sinturon bilang paghahanda sa pagkilos. Pinananatili ng salin ang kongkretong talinghaga sa kontekstong pandigma.
- source_word: חָיִל
  choice: ng lakas
  rationale: Maaaring mangahulugan ng lakas, kapangyarihan, o kagitingan. Ang “lakas” ang pinakamalinaw at pinakanatural sa pariralang ito nang hindi nililimitahan ang diwa sa kagitingang militar lamang.
- source_word: וַיִּתֵּן
  choice: at ginagawang
  rationale: Bagaman karaniwang nangangahulugang “nagbigay” ang נתן, dito ay nagpapahayag ito ng resultang kalagayan ng landas; kaya mas natural sa Filipino ang “ginagawang.”
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Ipinahihiwatig ng תמים ang kabuuan, integridad, o pagiging walang kapintasan, hindi kinakailangang ganap na kawalan ng kasalanan. Ang alternatibong saklaw ay pinananatili sa talababa.
- source_word: דַּרְכִּי
  choice: aking landas
  rationale: Pinananatili ng “landas” ang talinghaga ng דרך para sa takbo ng buhay o asal at karaniwan itong nauunawaan sa makabagong Filipino.
theological_decisions:
- issue: Kahulugan ng תָּמִים kaugnay ng landas ng mang-aawit
  choice: walang kapintasan
  alternative: ganap o buo
  rationale: Inilalarawan ng talata ang Diyos bilang siyang humuhubog sa landas ng mang-aawit ayon sa integridad. Hindi nito kailangang ipahayag ang ganap na kawalan ng kasalanan; itinatala sa talababa ang tunay na lawak ng salitang Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghaga ng pagbibigkis at ang bahagyang pormal na “landas” dahil mahalaga ang mga ito sa larawang patula ng Hebreo.
