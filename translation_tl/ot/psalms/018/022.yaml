  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: tl
  text: 'Sapagkat ang lahat ng kanyang mga hatol ay nasa harap ko,

    at hindi ko inilayo sa akin ang kanyang mga tuntunin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at hindi ako lumihis sa kanyang mga tuntunin.” Maaaring unawain ang pandiwang Hebreo bilang pag-aalis ng mga tuntunin mula sa sarili o bilang paglihis mula sa mga ito; pinananatili sa pangunahing teksto ang mas tuwirang palipat na diwa, “inilayo ... sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang pahayag at natural ang ugnayang ito sa makabagong Tagalog.
- source_word: כָל מִשְׁפָּטָיו
  choice: ang lahat ng kanyang mga hatol
  rationale: Pinananatili ng “lahat” ang saklaw ng כָל, at ng “mga hatol” ang hudisyal at tipanang diwa ng מִשְׁפָּטִים.
- source_word: לְנֶגְדִּי
  choice: nasa harap ko
  rationale: Pinananatili ang larawan ng mga hatol na laging nakalagay sa paningin at kamalayan ng nagsasalita, nang hindi idinaragdag ang salitang “lagi.”
- source_word: וְחֻקֹּתָיו
  choice: at ... ang kanyang mga tuntunin
  rationale: Ang “mga tuntunin” ay natural at marangal na salin ng mga itinakdang kautusan o batas na tinutukoy ng חֻקּוֹת.
- source_word: לֹא אָסִיר מֶנִּי
  choice: hindi ko inilayo sa akin
  rationale: 'Pinananatili ang tuwirang, palipat na diwa ng Hiphil: hindi inalis o inilayo ng nagsasalita sa kanyang sarili ang mga tuntunin.'
