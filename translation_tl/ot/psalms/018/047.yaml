translation:
  language: tl
  text: ang Diyos na nagkakaloob sa akin ng paghihiganti[a] at nagpapasakop ng mga bayan sa akin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gawang paghihiganti”; maramihan ang anyo sa Hebreo at maaaring may abstrakto o masidhing diwa.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwa rito ay karaniwang inuunawang “nagpapasuko” o “nagpapasakop,” hindi “nagsasalita,” kahit kaugnay ito ng karaniwang pandiwang Hebreo na nangangahulugang “magsalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: ang Diyos
  rationale: Ipinahihiwatig ng pantukoy sa Hebreo ang tiyak na pagtukoy sa Diyos; likas itong naipapahayag sa Filipino sa pamamagitan ng “ang Diyos.”
- source_word: הַנּוֹתֵן
  choice: na nagkakaloob
  rationale: Ang participle ay naglalarawan sa Diyos bilang siyang patuloy o likas na gumagawa nito. Dignified at natural ang “na nagkakaloob” sa kontekstong patula.
- source_word: נְקָמוֹת
  choice: ng paghihiganti
  rationale: Ang anyong maramihan sa Hebreo ay maaaring may abstrakto o masidhing diwa. Pinananatili ng “paghihiganti” ang tuwirang diwa ng makatarungang pagganti at hindi ito pinapalambot tungo sa “pagbibigay-katarungan” lamang.
- source_word: לִי
  choice: sa akin
  rationale: Tuwirang kinakatawan nito ang tatanggap o nakikinabang sa pagkilos, habang hindi tiyak na nilulutas kung ang paghihiganti ay ibinibigay sa salmista o isinasagawa para sa kanya.
- source_word: וַיַּדְבֵּר
  choice: at nagpapasailalim
  rationale: Sa anyo at kontekstong ito, ang pandiwa ay tradisyonal at leksikal na inuunawang “magpasuko” o “magpasailalim,” hindi “magsalita.” Ang kasalukuyang anyo ay umaayon sa naglalarawang daloy ng talata.
- source_word: עַמִּים
  choice: ng mga bayan
  rationale: Ang “mga bayan” ay natural na katumbas ng maramihang עַמִּים at maaaring tumukoy sa magkakaibang pangkat o sambayanan, hindi lamang sa mga estadong politikal.
- source_word: תַּחְתָּי
  choice: sa akin
  rationale: Kasama ng “nagpapasailalim,” natural na ipinahahayag ng “sa akin” ang metaporang paglalagay ng mga bayan sa ilalim ng kapangyarihan ng salmista nang hindi inuulit nang alanganin ang salitang “ilalim.”
theological_decisions:
- issue: Wika tungkol sa paghihiganti ng Diyos
  choice: Pinanatili ang “paghihiganti” bilang pagkilos na ipinagkakaloob ng Diyos sa salmista.
  alternative: pagbibigay-katarungan; pagliligtas
  rationale: Tuwirang tumutukoy ang נְקָמוֹת sa paghihiganti o mga gawang pagganti. Ang mas malalambot na salita ay makababawas sa lakas ng Hebreo at makapagpapasok ng interpretasyong hindi tahasang sinasabi ng teksto.
- issue: Ugnayan ng paghihiganti sa salmista
  choice: “nagkakaloob sa akin ng paghihiganti”
  alternative: “gumaganti para sa akin”
  rationale: Pinananatili ng napiling anyo ang estruktura at bahagyang kalabuan ng לִי bilang tatanggap o nakikinabang, sa halip na tiyaking ang Diyos mismo ang gumaganti para sa salmista sa paraang mas tahasang ipinapahayag kaysa sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang patulang anyo at teolohikal na tindi ng “paghihiganti.” Ginamit ang maliit na titik sa simula sapagkat maaaring pagpapatuloy ito ng naunang sugnay. Ang “nagpapasailalim sa akin ng mga bayan” ay mas likas sa Filipino kaysa sa literal na “naglalagay ng mga bayan sa ilalim ko,” habang pinananatili ang larawan ng pagpapasakop.
