  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: tl
  text: Nagkakaloob siya ng mga dakilang tagumpay[a] sa kanyang hari at nagpapakita ng tapat na pag-ibig sa kanyang pinahiran[b]—kay David at sa kanyang supling[c] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang simula ng talata: “Siya ay tore ng mga pagliligtas para sa kanyang hari.” Mahirap ang anyong Hebreo rito sa teksto at sintaks; ang kaugnay na pahayag sa 2 Samuel 22:51 ay may diwang “Ginagawa niyang dakila ang mga pagliligtas/tagumpay ng kanyang hari.”'
    reason: textual_variant
  - marker: b
    text: Ang “kanyang pinahiran” ay maaari ring isaling “kanyang Mesiyas.” Agad itong tumutukoy kay David o sa haring mula sa kanyang angkan, ngunit may mas malawak din itong mesiyanikong diwa.
    reason: alternative_reading
  - marker: c
    text: Ang “supling” ay salin ng pang-isahang pangngalang maaaring tumukoy sa buong angkan ni David at maaari ring magpahiwatig ng isang inapo sa mas malawak na kontekstong mesiyaniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל
  choice: Nagbibigay ... ng mga dakilang
  rationale: Ang anyo sa MT ay mahirap sa teksto at sintaks. Kaugnay ng 2 Samuel 22:51, ipinahihiwatig nito na ginagawang dakila o ipinagkakaloob ng Diyos ang mga pagliligtas/tagumpay ng kanyang hari. Ang pariralang ito ay natural sa Filipino habang hindi itinatago ang suliranin, na inilalahad sa talababa.
- source_word: יְשׁוּעוֹת
  choice: mga tagumpay
  rationale: Ang pangmaramihang anyo ay tumutukoy sa mga gawa ng pagliligtas. Sa kontekstong maharlika at pandigma, ang “mga tagumpay” ay natural at ipinahihiwatig pa rin ang paulit-ulit na pagliligtas ng Diyos.
- source_word: מַלְכּוֹ
  choice: kanyang hari
  rationale: Tuwirang pinananatili ang ugnayang maharlika at tipan na ipinapahayag ng hulaping panghalip.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: at nagpapakita ng tapat na pag-ibig
  rationale: Ang חֶסֶד ay pag-ibig na matatag, tapat, at kaugnay ng tipan. Ang “tapat na pag-ibig” ay malinaw at marangal sa modernong Filipino.
- source_word: לִמְשִׁיחוֹ
  choice: sa kanyang pinahiran
  rationale: Si David o ang haring mula sa kanyang angkan ang agarang tinutukoy. Pinananatili ng “pinahiran” ang literal at maharlikang diwa nang hindi agad nililimitahan ang salita sa titulong “Mesiyas.”
- source_word: לְדָוִד
  choice: kay David
  rationale: Karaniwang anyong Filipino ng pangalan at natural na pananda para sa tiyak na taong pinag-uukulan.
- source_word: וּלְזַרְעוֹ
  choice: at sa kanyang binhi
  rationale: Ang זֶרַע ay pang-isahang pangngalang kolektibo. Ang “binhi” ay nagpapanatili sa anyong ito at sa bukás na pagtukoy kapuwa sa angkan ni David at sa posibleng iisang inapo.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na salin ng walang-hanggang pagpapatuloy.
theological_decisions:
- issue: Mesiyanikong diwa ng מְשִׁיחוֹ sa isang maharlikang awit tungkol kay David
  choice: kanyang pinahiran
  alternative: kanyang Mesiyas
  rationale: Si David o ang haring Davidiko ang agarang tinutukoy, ngunit may mas malawak na mesiyanikong diwa ang salita. Ang pangunahing salin at talababa ay kapuwa nagpapanatili sa tensiyong ito.
- issue: Saklaw ng זַרְעוֹ
  choice: kanyang binhi
  alternative: kanyang mga inapo
  rationale: Hindi nililimitahan ng pang-isahang kolektibong anyo ang kahulugan sa buong dinastiya lamang o sa isang inapo lamang; pinananatili ng “binhi” ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tapat na pag-ibig” para sa wikang tipan, “pinahiran” upang mapanatili ang agarang Davidikong konteksto at mesiyanikong diwa, at “binhi” upang mapanatili ang pang-isahang kolektibo at kaugnay na kalabuan.
