  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: tl
  text: Ginawa niyang kublihan ang kadiliman[a]; sa palibot niya’y ang kanyang silungan[b]—dilim ng tubig[c], makakapal na ulap sa kalangitan.
  philosophy: optimal-equivalence
  footnotes:
