lexical_decisions:
- source_word: יָשֶׁת
  choice: Ginawa niya
  rationale: Ang Qal na anyo ng שׁית ay tumutukoy sa pagtatakda o paglalagay; natural sa Tagalog ang “ginawa niyang” para sa pagtatatag sa kadiliman bilang kublihan.
- source_word: חֹשֶׁךְ
  choice: kadiliman
  rationale: Tuwirang pinananatili ang kongkretong larawan ng dilim sa pagpapakita ng Diyos sa bagyo.
- source_word: סִתְרוֹ
  choice: kanyang kublihan
  rationale: Ang סתר ay isang lugar ng pagkukubli; ang “kublihan” ay natural, marangal, at lokatibo sa modernong Tagalog.
- source_word: סְבִיבוֹתָיו
  choice: sa palibot niya
  rationale: Pinananatili ang malinaw na larawang spatial ng nakapaligid sa kanya.
- source_word: סֻכָּתוֹ
  choice: kanyang kanlungan
  rationale: Ang סֻכָּה ay maaaring kubol o silungan; ipinahahayag ng “kanlungan” ang gamit nito bilang pantakip nang hindi nagpapasok ng terminong kultiko.
- source_word: חֶשְׁכַת מַיִם
  choice: dilim ng tubig
  rationale: Pinananatili ang construct chain at ang bahagyang matalinghagang tekstura ng Hebreo sa halip na lubusang pakinisin bilang “madidilim na tubig.”
- source_word: עָבֵי שְׁחָקִים
  choice: makakapal na ulap sa kalangitan
  rationale: Ang עָבֵי ay makakapal o masisinsing ulap, at ang שְׁחָקִים ay patulang katawagan sa langit o kalangitan.
theological_decisions:
- issue: Ang kadiliman ay nagkukubli sa Diyos sa larawan ng isang pagpapakita sa gitna ng bagyo, ngunit hindi tinutukoy kung ito ay moral o metapisikal na kadiliman.
  choice: Isinalin ang larawan bilang aktuwal na patulang pagkukubli sa paligid ng Diyos.
  alternative: Ipaliwanag ang kadiliman bilang sagisag ng paghatol, o ang kanlungan bilang tahasang larawan ng tabernakulo.
  rationale: Ang Hebreo ay nagbibigay ng magkakatumbas na larawan ng bagyo at pagkukubli. Hindi dapat dagdagan ng salin ang isang doktrinal na paliwanag na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinananatili ang maikli at masinsing paralelismo ng tulang Hebreo. Ginamit ang “dilim ng tubig” upang mapanatili ang tunay na anyo at bahagyang kalabuan ng חֶשְׁכַת מַיִם, habang inilagay sa talababa ang mas natural na alternatibong “madidilim na tubig.”
