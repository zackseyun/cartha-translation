  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: tl
  text: Tumatawag ako kay Yahweh[a], na karapat-dapat na purihin, at naliligtas ako mula sa aking mga kaaway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang Hebreo na YHWH.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “at maliligtas ako mula sa aking mga kaaway.” Maaaring unawain sa panghinaharap ang pandiwang Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: karapat-dapat purihin
  rationale: Ang pasibong pandiwaring mula sa הלל ay naglalarawan kay Yahweh bilang marapat tumanggap ng papuri. Mas malinaw at natural ito kaysa sa payak na “pinupuri.”
- source_word: אֶקְרָא
  choice: Tumatawag ako kay
  rationale: Ang קרא na sinusundan ng banal na pangalan ay tumutukoy sa pagtawag o pagdulog sa Diyos. Ang “tumatawag ako kay” ay likas sa modernong Filipino at angkop sa panalanging konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וּמִן
  choice: at ... mula sa
  rationale: Pinananatili ng “at” ang payak na pag-uugnay ng dalawang sugnay nang hindi nagdaragdag ng mas tiyak na ugnayang sanhi at bunga kaysa sa Hebreo.
- source_word: אֹיְבַי
  choice: aking mga kaaway
  rationale: Tuwirang salin ng pangngalang אויב na may hulaping unang panauhang isahan.
- source_word: אִוָּשֵׁעַ
  choice: naliligtas ako
  rationale: Ang Niphal imperfect ng ישׁע ay maaaring magpahayag ng pangkalahatan o inaasahang resulta. Ang “naliligtas ako” ay nagpapanatili sa diwang pangkumpisal ng taludtod, habang inilalagay sa talababa ang posibleng hinaharap na pagbasa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; o ang tradisyonal na pamalit na “PANGINOON”
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Aspekto ng אִוָּשֵׁעַ
  choice: 'pangkasalukuyan/pangkalahatang resulta: “naliligtas ako”'
  alternative: 'panghinaharap: “maliligtas ako”'
  rationale: Maaaring magpahayag ang Hebrew imperfect ng pangkalahatan, inaasahan, o panghinaharap na kilos. Hindi nilulutas nang tahimik ang kalabuan; inilalahad sa talababa ang panghinaharap na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismong patula at ang payak na pang-ugnay na “at,” habang ginawang natural ang ayos ng pangungusap. Itinama ang pagkakalagay ng mga marker upang ang talababa tungkol sa banal na pangalan ay nakaugnay sa “Yahweh” at ang talababa tungkol sa aspekto ay nakaugnay sa “naliligtas.”
