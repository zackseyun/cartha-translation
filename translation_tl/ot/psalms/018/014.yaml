  source_fidelity: Ang “ipinakawala niya ang kaniyang mga palaso” ay angkop para sa וַיִּשְׁלַח חִצָּיו. Tama ring unawain ang dalawang hulaping pangmaramihan bilang mga kaaway na ipinahihiwatig ng konteksto. Gayunman, ang “nagpakawala siya ng napakaraming kidlat” ay nagdaragdag ng isang tahasang pandiwang ‘magpakawala’ sa ikalawang sugnay. Mas maingat na isalin ang וּבְרָקִים רָב bilang instrumentong “sa pamamagitan ng maraming kidlat,” habang itinatala ang posibleng pandiwang pagbasa ng רָב.
  naturalness: Mas natural sa makabagong Filipino ang “sa pamamagitan ng maraming kidlat ay nilito niya sila” kaysa “nagpakawala siya ng napakaraming kidlat.” Pinananatili nito ang matalinghaga ngunit marangal na rehistro at nililinaw na ang kidlat ang paraan ng pagkalito.
  terminology: Ang “mga palaso,” “kidlat,” at “nilito” ay tumpak at angkop. Ang “kaniyang” ay katanggap-tanggap sa pormal na rehistro. Inilipat ang talababa sa “maraming kidlat,” kung saan direktang nauugnay ang alternatibong pagbasa.
