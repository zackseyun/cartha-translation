translation:
  language: tl
  text: Ipinakawala niya ang kaniyang mga palaso at pinangalat sila; sa pamamagitan ng maraming kidlat[a] ay nilito niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ipinakawala niya ang kaniyang mga palaso at pinangalat sila; pinarami niya ang mga kidlat at nilito niya sila.” Ang salitang Hebreo para sa “marami” ay maaari ring unawain bilang “sagana” o bilang pandiwang “pinarami niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ipinakawala niya
  rationale: Ang שׁלח ay nangangahulugang magpadala o magpakawala. Sa larawan ng pakikidigma, natural na inilalarawan ng “ipinakawala” ang pagpapaulan ng mga palaso.
- source_word: חִצָּיו
  choice: ang kaniyang mga palaso
  rationale: Tuwirang isinasalin ng parirala ang pangmaramihang חֵץ na may panlaping paari sa ikatlong panauhang panlalaki.
- source_word: וַיְפִיצֵם
  choice: at pinangalat sila
  rationale: Ang pandiwa ay nangangahulugang ikalat o papangalatin. Ang “sila” ay pinakamalamang na tumutukoy sa mga kaaway na nauunawaan mula sa konteksto.
- source_word: וּבְרָקִים
  choice: kidlat
  rationale: Ang בְּרָקִים ay pangmaramihang ‘mga kidlat/mga kislap ng kidlat.’ Sa Filipino, karaniwang ginagamit bilang di-mabilang ang “kidlat,” at malinaw ang larawan sa pariralang “napakaraming kidlat.”
- source_word: רָב
  choice: napakaraming
  rationale: Maaaring unawain ang רָב bilang nagsasaad ng dami—‘marami’ o ‘sagana’—sa halip na bilang hiwalay na pandiwang ‘pinarami.’ Pinananatili ng salin at talababa ang tunay na kalabuan.
- source_word: וַיְהֻמֵּם
  choice: at nilito sila
  rationale: Ang המם ay tumutukoy sa pagkalito, pagkataranta, o kaguluhan sa labanan. Maikli at natural ang “nilito sila” nang hindi ipinapalagay ang ganap na pagkatalo.
theological_decisions:
- issue: Tinutukoy ng mga hulaping pangmaramihan sa ‘pinangalat sila’ at ‘nilito sila’
  choice: Ang mga kaaway ni David na nauunawaan mula sa mas malawak na konteksto
  alternative: Ang mga palaso o kidlat mismo ang pinangalat
  rationale: Sa larawan ni YHWH bilang mandirigma, ang mga palaso at kidlat ang mga sandatang ginagamit upang pangalatin at lituhin ang mga kaaway. Ito rin ang higit na angkop sa gamit ng המם sa konteksto ng labanan.
- issue: Gamit ng רָב kaugnay ng kidlat
  choice: 'Pang-uri/pang-abay na nagsasaad ng kasaganaan: ‘napakaraming kidlat’'
  alternative: 'Pandiwang pagbasa: ‘pinarami niya ang mga kidlat’'
  rationale: Parehong posible ang mga pagbasa sa masalimuot na anyo ng Hebreo. Pinili sa teksto ang mas natural na Filipino at inilagay sa talababa ang pandiwang alternatibo upang hindi burahin ang kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “kaniyang” para sa malinaw at pormal na pagtukoy, at “ipinakawala” upang mapanatili ang masiglang larawan ng Diyos bilang mandirigma. Inilagay ang marker na [a] sa mismong teksto.
