base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: tl
  text: Nang magkagayon, umuga at yumanig ang lupa; nanginig at umuga ang mga pundasyon ng mga bundok, sapagkat nag-alab ang galit niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat nagalit siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: umuga
  rationale: Ipinahahayag ng געשׁ ang marahas na pag-alimbukay o pag-uga. Pinananatili ng “umuga” ang masiglang larawang patula at naihihiwalay ito sa kasunod na pandiwang רעשׁ.
- source_word: וַתִּרְעַשׁ
  choice: yumanig
  rationale: Karaniwang tumutukoy ang רעשׁ sa pagyanig na gaya ng lindol. Likas sa Filipino ang “yumanig ang lupa” at pinananatili nito ang pagkakaiba ng magkatabing pandiwa.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa konteksto ng kosmikong pagpapakita ng Diyos, ang “lupa” ay mas angkop kaysa sa mas lokalisadong “lupain.”
- source_word: מוֹסְדֵי הָרִים
  choice: ang mga pundasyon ng mga bundok
  rationale: Tuwirang pinananatili ang larawang patula tungkol sa mga saligang kinatatayuan ng mga bundok.
- source_word: יִרְגָּזוּ
  choice: nanginig
  rationale: Ang רגז ay nagpapahiwatig ng panginginig o matinding pagkabalisa; malinaw at natural dito ang “nanginig.”
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: umuga
  rationale: Muling ginagamit ng tekstong Hebreo ang ugat געשׁ, ngayon sa anyong hitpael. Ang pag-uulit ng “umuga” ay nagpapanatili sa pagkakaugnay ng simula at ikalawang hati ng taludtod.
- source_word: כִּי חָרָה לוֹ
  choice: sapagkat nag-alab ang galit niya
  rationale: Ang חרה + ל ay isang idyoma para sa nag-aalab na galit. Ang salin ay likas sa Filipino habang pinananatili ang matingkad na talinghaga ng Hebreo.
theological_decisions:
- issue: Antropopatikong paglalarawan sa galit ng Diyos
  choice: sapagkat nag-alab ang galit niya
  alternative: sapagkat nagalit siya
  rationale: Pinananatili ng napiling salin ang tunay at matinding galit ng Diyos at ang larawang “nag-alab” sa Hebreo, nang hindi nagdaragdag ng paliwanag o denominasyonal na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na wikang patula. Ginamit ang “Nang magkagayon” upang ihatid ang pasalaysay na pagkakasunod, at pinanatili ang magkakaibang pandiwa para sa marahas na paggalaw. Inilagay ang talababa sa pariralang tungkol sa galit, na siyang aktuwal na saklaw ng alternatibong salin.
