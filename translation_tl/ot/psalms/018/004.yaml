  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: tl
  text: 'Pinalibutan ako ng mga lubid ng kamatayan,

    at sinindak ako ng mga rumaragasang agos ng kapahamakan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga rumaragasang agos ng kasamaan” o “ng kawalang-kabuluhan.” Posible rin ang “Belial” kung ituturing na pangalang pantangi, ngunit mas malamang dito na karaniwang pangngalan ito na tumutukoy sa kasamaan o kapahamakan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: Pinalibutan ako
  rationale: Tuwirang ipinapahayag ang larawan ng ganap na pagkubkob o pagligid, sa natural na modernong Tagalog.
- source_word: חֶבְלֵי
  choice: mga lubid ng
  rationale: Pinananatili ang konkretong pangunahing kahulugan na mga lubid; posible rin ang diwang mga bitag o hapdi, ngunit hindi kailangang ipalit dito.
- source_word: מָוֶת
  choice: kamatayan
  rationale: Karaniwan at tuwirang katumbas ng salitang Hebreo.
- source_word: נַחֲלֵי
  choice: mga rumaragasang agos ng
  rationale: Ang נחל ay maaaring tumukoy sa batis, tuyong ilog, o rumaragasang tubig. Idinagdag ang “rumaragasang” upang malinaw na maipadama ang mapanganib na puwersa ng larawang patula.
- source_word: בְלִיַּעַל
  choice: kapahamakan
  rationale: Sa kontekstong ito, ang karaniwang pangngalang tumutukoy sa kasamaan, kawalang-kabuluhan, o mapanirang kapahamakan ang mas malamang kaysa isang pangalang pantangi. Ang “kapahamakan” ay natural at angkop sa mapanirang agos na inilalarawan.
- source_word: יְבַעֲתוּנִי
  choice: sinindak ako
  rationale: Ipinahahayag nito ang biglaan at matinding takot; mas masidhi at mas patula kaysa “tinakot” habang nananatiling nauunawaan.
theological_decisions:
- issue: Kung ang בְלִיַּעַל ay pangalang pantangi na “Belial” o karaniwang pangngalang nagsasaad ng kapahamakan o kasamaan
  choice: 'Karaniwang pangngalan: “kapahamakan”'
  alternative: “Belial,” “kasamaan,” o “kawalang-kabuluhan”
  rationale: Hindi hinihingi ng konteksto ng awit ang mas huling pag-unawa kay Belial bilang isang personipikadong masamang nilalang. Pinananatili ng salin ang mapanirang puwersa ng parirala nang hindi nag-aangkat ng gayong pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang matitinding larawang patula—mga lubid at rumaragasang agos—nang hindi pinapantay o nilulutas ang pagkakaiba ng mga ito.
