  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: tl
  text: Sa taong tapat, ipinakikita mong ikaw ay tapat[a]; sa lalaking walang kapintasan, ipinakikita mong ikaw ay walang kapintasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa taong tapat sa Diyos, ipinakikita mong ikaw ay tapat.” Magkaugnay ang mga salitang Hebreo para sa “taong tapat” at “ipinakikita mong ikaw ay tapat”; kapwa ito mula sa ugat na חסד, na maaaring magpahiwatig ng tapat na pag-ibig o katapatan sa ugnayang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: tapat
  rationale: Tumutukoy sa taong may matatag na katapatan at debosyon sa loob ng ugnayang tipan. Ang “tapat” ay natural sa modernong Tagalog at naipaparis sa pandiwang mula sa parehong ugat.
- source_word: תִּתְחַסָּד
  choice: ipinakikita mong ikaw ay tapat
  rationale: Pinananatili nito ang reflexive na diwa ng hitpael at ang tugunang paglalarawan, pati ang pag-uulit ng konsepto ng חסד kasama ng חָסִיד.
- source_word: גְּבַר
  choice: lalaki
  rationale: Ang pangngalan ay tiyak na panlalaking isahan. Ang “lalaki” ay tumpak at hindi kinakailangang idagdag ang posibleng diwa ng lakas, na hindi pangunahing punto rito.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Ipinahahayag nito ang moral na kabuuan o integridad sa konteksto, at angkop sa paralelismo ng talata.
- source_word: תִּתַּמָּם
  choice: ipinakikita mong ikaw ay walang kapintasan
  rationale: Pinananatili ang reflexive na anyo at ang malinaw na leksikal na ugnayan sa תָּמִים, nang hindi inililihis ang kahulugan tungo sa abstraktong metapisikal na kasakdalan.
theological_decisions:
- issue: Tugunang paglalarawan sa Diyos kaugnay ng katangian ng tao
  choice: Isinalin bilang “ipinakikita mong ikaw ay…” upang mapanatili ang makatang tugunan at ang reflexive na anyo.
  alternative: “Sa tapat ay tapat ka” o “kinahahabagan mo ang mahabagin.”
  rationale: Hindi ipinahihiwatig na nagbabago ang likas na katangian ng Diyos ayon sa tao. Gayunman, hindi rin inaalis ang tunay na tensiyon ng Hebreong pahayag na inilalarawan ang pakikitungo ng Diyos bilang katugon ng katangian ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang panlalaking pagtukoy ng גְּבַר at ang makatang pag-uulit ng mga magkaugnay na salita.
