source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: tl
  text: 'Ang Diyos—walang kapintasan ang kanyang daan;

    ang salita ni Yahweh ay dinalisay[a];

    siya ay kalasag ng lahat ng kumakanlong sa kanya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinubok” o “pinadalisay.” Inilalarawan ng Hebreo ang metal na dinadalisay sa apoy, kaya binibigyang-diin ang subok na kadalisayan ng salita ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagtitiwala sa kanya.” Mas literal na nangangahulugan ang Hebreo na “kumakanlong sa kanya,” na nagpapanatili sa larawan ng Diyos bilang ligtas na kanlungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Ang Diyos
  rationale: Ang אֵל ay tumutukoy sa Diyos; ang pantukoy at puwesto nito sa simula ay nagbibigay-diin sa paksa. Ang paghinto na minarkahan ng gitling ay natural na naghahatid ng diin sa Filipino.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Ipinahihiwatig ng תמים ang kabuuan at kawalan ng depekto. Malinaw at likas sa modernong Filipino ang 'walang kapintasan' at hindi nito nililimitahan ang kahulugan sa abstraktong konsepto ng pagiging perpekto.
- source_word: דַּרְכּוֹ
  choice: ang kanyang daan
  rationale: Ang דרך ay literal na 'daan' at dito ay talinghaga para sa paraan ng pagkilos ng Diyos. Pinananatili ng salin ang imahen ng pinagmulang teksto.
- source_word: אִמְרַת יְהוָה
  choice: ang salita ni Yahweh
  rationale: Ang אִמְרָה ay pahayag o salita. Ang יְהוָה ay personal na pangalang banal, kaya isinalin bilang 'Yahweh' sa halip na palitan ng isang titulo.
- source_word: צְרוּפָה
  choice: dinalisay
  rationale: Ang anyo mula sa צרף ay pumupukaw sa pagdadalisay ng metal sa apoy, kaya ipinahahayag ang subok na kadalisayan ng salita ni Yahweh. Pinananatili ng 'dinalisay' ang metapora.
- source_word: מָגֵן
  choice: kalasag
  rationale: Literal na nangangahulugang 'kalasag' ang מָגֵן. Pinananatili ang konkretong larawan ng proteksiyon sa halip na gawing pangkalahatang 'tagapagtanggol.'
- source_word: הַחֹסִים בּוֹ
  choice: lahat ng nanganganlong sa kanya
  rationale: Ang חסה ay paghanap ng kanlungan o proteksiyon. Ang 'nanganganlong sa kanya' ay likas sa Filipino at pinananatili ang larawang kaugnay ng Diyos bilang kalasag.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang יְהוָה ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'PANGINOON,' nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Kahulugan ng pagkanlong sa Diyos
  choice: nanganganlong sa kanya
  alternative: nagtitiwala sa kanya
  rationale: Bagaman kasama sa pagkanlong ang pagtitiwala, mas konkretong tumutukoy ang חסה sa paghahanap ng ligtas na kanlungan. Pinananatili rin nito ang ugnayan sa larawan ng kalasag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang anyong patula. Ginamit ang karaniwang 'kanyang/kanya' sa halip na mas pormal o lipas na anyo. Pinanatili ang mga konkretong talinghaga ng daan, pagdadalisay, kalasag, at pagkanlong.
