  language: tl
  text: Humingi sila ng tulong, ngunit walang tagapagligtas; tumawag sila sa PANGINOON, ngunit hindi niya sila sinagot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: Humingi sila ng tulong
  rationale: Ipinahahayag ang paghingi o pagsigaw para sa saklolo sa natural na modernong Tagalog, nang hindi ipinapalagay na tahasang inuulit sa Hebreo ang pandiwang “tumawag” sa ikalawang sugnay.
- source_word: מוֹשִׁיעַ
  choice: tagapagligtas
  rationale: Pinananatili ang aktibong diwa ng isang nagliligtas at ang anyong pangngalan ng Hebreo.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Sinusunod ang nakaugaliang salin ng tetragrammaton sa malaking titik, kaayon ng ibinigay na konsultasyong teksto.
- source_word: עָנָם
  choice: sinagot niya sila
  rationale: Tuwirang inililipat ang pandiwang “sumagot” kasama ang layong maramihan.
theological_decisions:
- issue: Ang kawalan ng tagapagligtas para sa mga kaaway
  choice: “walang tagapagligtas”
  alternative: “walang sinumang magligtas”
  rationale: Pinananatili ang pangngalang anyo at mariing pahayag ng Hebreo nang hindi dinaragdagan ang teksto ng paliwanag.
- issue: Ang hindi pagsagot ng PANGINOON
  choice: “hindi niya sila sinagot”
  alternative: “wala siyang isinagot sa kanila”
  rationale: Pinananatili ang tuwirang pahayag ng teksto at hindi ipinapaliwanag ang dahilan ng hindi pagsagot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “PANGINOON” para sa banal na pangalan at “tagapagligtas” upang mapanatili ang anyong pangngalan ng מקור. Idinagdag ang “tumawag sila” sa ikalawang sugnay bilang likas na pagpuno sa elipsis ng Hebreo.
