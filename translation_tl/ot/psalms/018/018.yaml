  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: tl
  text: Hinarap nila ako sa araw ng aking kapahamakan[a], ngunit si Yahweh ang aking sandigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinalubong nila ako” o “Humarap sila sa akin” sa araw ng aking kapahamakan.
    reason: Pinahihintulutan ng יְקַדְּמוּנִי ang diwang pagsalubong, pagharap, o pagdating laban sa isang tao; hindi ganap na tinutukoy ng salita lamang ang eksaktong uri ng masamang pagharap.
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Hinarap nila ako
  rationale: Ang Piel ng קדם na may hulaping unang panauhan ay maaaring mangahulugang sinalubong o hinarap nila ako. Sa kontekstong mapanlaban, malinaw ang “hinarap” ngunit hindi nito labis na tinutukoy na isang tahasang pagsalakay ang ginawa.
- source_word: בְיוֹם אֵידִי
  choice: sa araw ng aking kapahamakan
  rationale: Tuwirang ipinahahayag ang panahong dumating ang אֵיד—kapahamakan, sakuna, o kasawian. Ang “kapahamakan” ay angkop sa marangal na panulaan at mas malawak kaysa pansariling paghihirap lamang.
- source_word: וַיְהִי
  choice: ngunit ... ang naging
  rationale: Bagaman karaniwang nag-uugnay o nagpapasulong ng salaysay ang waw sa היה, malinaw ang pagsalungat ng ikalawang linya sa unang linya; kaya natural ang “ngunit.” Pinananatili ng “naging” ang pandiwang diwa ng היה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: לְמִשְׁעָן לִי
  choice: naging sandigan ko
  rationale: Ang מִשְׁעָן ay bagay o taong masasandigan para sa suporta. Natural sa Filipino ang “sandigan ko” at pinananatili nito ang larawang metaporikal ng tumutulong at nagpapatatag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyon nito at hindi pamalit na titulo.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “kapahamakan” at “sandigan” upang mapanatili ang bigat at metapora ng Hebreo nang hindi nagiging lipas o labis na teknikal.
