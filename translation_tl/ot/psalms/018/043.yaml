  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: tl
  text: 'Inililigtas mo ako sa mga alitan ng bayan[a];

    ginagawa mo akong pinuno ng mga bansa[b];

    isang bayang hindi ko dating kilala ay naglilingkod sa akin[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga pagtatalo ng bayan” o “sa mga sigalot ng bayan.” Maaaring tumukoy ang salitang Hebreo sa alitan, pagtatalo, o usapin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ulo ng mga bansa”; ang “ulo” ay talinghaga para sa pinuno.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “maglilingkod sa akin.” Maaaring magkaroon ng diwang hinaharap ang pandiwang Hebreo sa kontekstong ito.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Inililigtas mo ako
  rationale: Ang Piel ng פלט ay nagpapahayag ng aktibong pagliligtas. Likas at tuwiran sa makabagong Tagalog ang “inililigtas mo ako.”
- source_word: מֵרִיבֵי עָם
  choice: sa mga alitan ng bayan
  rationale: Maaaring tumukoy ang רִיב sa alitan, pagtatalo, o sigalot. Malawak ang “mga alitan” at pinananatili ng “bayan” ang isahang pangngalang kolektibo na עָם.
- source_word: תְּשִׂימֵנִי
  choice: ginagawa mo akong
  rationale: Karaniwang nangangahulugang “ilagay/italaga” ang שׂים, ngunit mas likas sa Tagalog ang “ginagawa mo akong pinuno” para sa pagtataas sa isang katungkulan.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: pinuno ng mga bansa
  rationale: Literal na “ulo” ang רֹאשׁ ngunit metaporikal itong tumutukoy sa namumuno. Malinaw at dignidadong katumbas ang “pinuno,” samantalang ang גּוֹיִם ay mga bansang pampolitika rito.
- source_word: עַם לֹא יָדַעְתִּי
  choice: isang bayang hindi ko dating kilala
  rationale: Hindi tiyak ang עַם at kaya isinaling “isang bayan.” Ipinahihiwatig ng “dating” na ang kawalan ng pagkakilala ay nauuna sa paglilingkod, nang hindi ipinapalagay na hindi pa rin sila kilala ngayon.
- source_word: יַעַבְדוּנִי
  choice: naglilingkod sa akin
  rationale: Ang עבד ay “maglingkod.” Maaaring kasalukuyan, katangian, o darating na kilos ang imperfect; ang kasalukuyang anyo ay maayos sa daloy ng tula, habang itinatala sa talababa ang posibleng hinaharap.
theological_decisions:
- issue: Saklaw ng גּוֹיִם at עַם sa isang maharlikang awit
  choice: “mga bansa” at “isang bayan” bilang mga kolektibong pampolitika
  alternative: “mga Hentil” para sa גּוֹיִם
  rationale: Ang konteksto ay ang pagtataas sa hari sa ibabaw ng mga banyagang pangkat. Hindi kinakailangang ipasok ang mas huling teolohikal na kaibahan ng Judio at Hentil.
- issue: Panahunan ng יַעַבְדוּנִי
  choice: Kasalukuyang “naglilingkod sa akin”
  alternative: Hinaharap na “maglilingkod sa akin”
  rationale: Maaaring magpahayag ang Hebrew imperfect ng nagpapatuloy, katangian, o darating na kilos. Hindi sapat ang konteksto upang lubusang alisin ang alternatibong hinaharap, kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panulaang biblikal. Gumamit ng maiikling magkakatimbang na linya. Pinili ang “bayan” para sa isahang kolektibong עָם at “mga bansa” para sa גּוֹיִם; iniwasan ang denominasyonal o mas huling etnikong-teolohikal na pagpapakahulugan.
