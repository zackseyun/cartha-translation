  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: tl
  text: Ginantimpalaan ako ni Yahweh ayon sa aking katuwiran; ayon sa kalinisan ng aking mga kamay[a], ginantimpalaan niya ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kalinisan ng aking mga kamay” ay isang idyomang Hebreo para sa walang-sala o matuwid na pamumuhay.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: Ginantimpalaan ako
  rationale: Sa konteksto, ang גמל ay tumutukoy sa mabuting pagganti na naaayon sa asal ng nagsasalita. Likas sa modernong Tagalog ang “ginantimpalaan,” habang ang ikalawang taludtod ang nagpapanatili sa ideya ng katumbas na ganti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כְּצִדְקִי
  choice: ayon sa aking katuwiran
  rationale: Tuwirang pinananatili ang unang panauhang pahayag tungkol sa צדק bilang matuwid na asal o integridad sa konteksto, nang hindi pinapahina ang teolohikal na tensiyon.
- source_word: כְּבֹר
  choice: ayon sa kalinisan
  rationale: Pinananatili ng “kalinisan” ang kongkretong larawan ng בֹּר at ang ugnayan nito sa “mga kamay.”
- source_word: יָדַי
  choice: ng aking mga kamay
  rationale: Literal na pinananatili ang larawang Hebreo ng malilinis na kamay, na tumutukoy sa inosente o matuwid na pamumuhay.
- source_word: יָשִׁיב לִי
  choice: ginantihan niya ako
  rationale: Ipinapahayag nito ang katumbas na pagganti o pagtalima sa ginawa ng isang tao at maayos na itinatambal sa “ginantimpalaan” sa unang taludtod.
theological_decisions:
- issue: Maaaring ipakahulugan ang “aking katuwiran” bilang ganap na kawalang-kasalanan o sariling pagliligtas
  choice: Panatilihin ang tuwirang pahayag na “aking katuwiran.”
  alternative: aking kawalang-sala; katuwiran ng aking panig
  rationale: Malinaw na ginagamit ng Hebreo ang צדק na may unang panauhang paari. Sa konteksto, ipinahahayag ng mang-aawit ang kaniyang integridad at ang makatarungang pagbibigay-katwiran sa kaniya ni Yahweh; hindi dapat lutasin ng salin ang tensiyong teolohikal sa pamamagitan ng pagpapahina sa pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang paralelismong patula, ang personal na pangalang Yahweh, at ang kongkretong larawan ng malilinis na kamay.
