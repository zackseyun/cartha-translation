  text: 'Mula sa ningning sa harap niya,


    dumaan ang makakapal niyang ulap—


    graniso at mga baga ng apoy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mula sa liwanag sa harap niya, lumampas ang kanyang mga ulap—graniso at nagliliyab na mga baga.” Masinsin at lubhang patula ang Hebreo, kaya maaaring bahagyang mag-iba ang pagkakalahad at pag-uugnay ng mga larawan ng bagyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Mula sa ningning
  rationale: Ang נֹגַהּ ay ningning o liwanag; ipinahahayag ng “mula sa” ang pinagmulan na taglay ng pang-ukol na מִן.
- source_word: נֶגְדּוֹ
  choice: sa harap niya
  rationale: Likas at tuwirang katumbas ito ng נֶגֶד na may hulaping panghalip, at pinananatili ang larawang panlunan.
- source_word: עָבָיו
  choice: ang makakapal niyang ulap
  rationale: Ang עָב ay tumutukoy sa makapal na kumpol ng ulap; nililinaw ng “makakapal” ang kaibhan nito sa karaniwang salita para sa ulap, habang pinananatili ng “niyang” ang hulaping paari.
- source_word: עָבְרוּ
  choice: dumaan
  rationale: Ang Qal na maramihan ng עבר ay nangangahulugang dumaan o lumampas; natural ang “dumaan” sa galaw ng mga ulap.
- source_word: בָּרָד
  choice: graniso
  rationale: Ito ang karaniwan at tiyak na modernong salin ng terminong meteorolohiko.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: at mga baga ng apoy
  rationale: Malapit itong sumusunod sa pariralang konstruktong “mga baga ng apoy” at pinananatili ang matingkad na larawang patula.
theological_decisions:
- issue: Larawan ng pagpapakita ng Diyos sa gitna ng bagyo
  choice: Pinanatili ang mga larawan ng ningning, makakapal na ulap, graniso, at mga baga ng apoy nang hindi ipinapaliwanag kung literal o matalinghaga ang bawat detalye.
  alternative: Ituring ang lahat bilang pawang talinghaga ng tagumpay sa digmaan, o palawakin bilang tahasang salaysay ng isang literal na himalang meteorolohiko.
  rationale: Masinsin at patula ang Hebreo. Dapat panatilihin ng salin ang tindi at teolohikal na tensiyon ng larawan nang hindi nagpapataw ng paliwanag na lampas sa teksto.
translation_notes:
  register: Makabago at marangal na Filipino, na may maiikling linyang patula. Ginamit ang “makakapal niyang ulap” upang katawanin ang espesipikong עָב at ang hulaping paari. Idinagdag ang “may” bago sa graniso upang maging malinaw at natural ang putol-putol na sintaks sa Filipino, habang kinikilala sa talababa ang mas pormal at mas masinsing alternatibo.
