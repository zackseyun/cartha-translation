  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: tl
  text: Mula sa kaitaasan ay nagpadala siya; kinuha niya ako; hinango niya ako mula sa maraming tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa malalaking tubig.” Literal sa Hebreo ang “mula sa maraming tubig,” isang karaniwang larawan ng napakalaking panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: umabot siya
  rationale: Literal na nangangahulugang “nagpadala/nag-unat,” ngunit walang tahasang layon ang pandiwa sa Hebreo. Ang “umabot siya” ay likas sa Filipino sa tagpong ito ng pagsagip at hindi nagdaragdag ng “kamay,” na wala sa teksto.
- source_word: מִמָּרוֹם
  choice: mula sa kaitaasan
  rationale: Pinananatili nito ang larawan ng mataas na dako nang hindi tahasang ginagawang “langit,” na mas tiyak kaysa sa Hebreo.
- source_word: יִקָּחֵנִי
  choice: kinuha niya ako
  rationale: Tuwirang salin ng karaniwang pandiwang “kumuha”; sa konteksto, tumutukoy ito sa pagkuha upang iligtas.
- source_word: יַמְשֵׁנִי
  choice: hinango niya ako
  rationale: Ang pandiwa ay tumutukoy sa paghango o pag-ahon mula sa tubig. Ang “hinango” ay malinaw, marangal, at angkop sa matalinghagang pagliligtas.
- source_word: מִמַּיִם רַבִּים
  choice: mula sa maraming tubig
  rationale: Malapit ito sa literal na “many waters” at pinananatili ang makatang larawan ng napakalaking panganib sa halip na tahasang ipaliwanag iyon sa pangunahing teksto.
theological_decisions:
- issue: Kung tahasang tutukuyin na mula sa langit ang pagliligtas
  choice: Panatilihin ang “mula sa kaitaasan.”
  alternative: “mula sa langit”
  rationale: “Kaitaasan” ang sinasabi ng Hebreo, hindi tahasang “langit”; kaya hindi nililimitahan ng salin ang larawan sa isang mas tiyak na kosmolohikal na pagbasa.
- issue: Kung gagawing literal o matalinghaga ang “maraming tubig”
  choice: Panatilihin ang larawan ng “maraming tubig.”
  alternative: “mula sa matinding panganib”
  rationale: Maaaring tunay o matalinghaga ang larawan sa tula. Ang pagpapanatili nito ay hindi tahasang nagpapasya kung paano lamang dapat unawain ang panganib.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kaitaasan” upang mapanatili ang makatang himig, at “hinango” upang malinaw na ilarawan ang pagsagip mula sa tubig. Inilagay ang talababa pagkatapos ng “maraming tubig,” ang pariralang talagang tinutukoy nito.
