  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: tl
  text: Ibinigay mo sa akin ang kalasag ng iyong pagliligtas; inalalayan ako ng iyong kanang kamay, at ang iyong kababaang-loob[a] ang nagpadakila sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iyong kahinahunan.” Ang salitang Hebreo ay maaaring mangahulugang kababaang-loob, kaamuan, o kahinahunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Ibinigay mo
  rationale: Ang Qal wayyiqtol ng נתן ay nagsasaad dito ng nakaraang pagkilos; natural at tuwiran sa makabagong Tagalog ang “Ibinigay mo.”
- source_word: מָגֵן
  choice: kalasag
  rationale: Karaniwang kahulugan nito ang pananggalang na kalasag; malinaw ito at pinananatili ang larawang pandigma ng tula.
- source_word: יִשְׁעֶךָ
  choice: ng iyong pagliligtas
  rationale: Pinananatili ang construct phrase na “kalasag ng iyong pagliligtas” at ang malawak na diwa ng pagliligtas, hindi lamang isang tiyak na pagsagip.
- source_word: וִימִינְךָ
  choice: ng iyong kanang kamay
  rationale: Pinananatili nang literal ang biblikal na larawan ng kanang kamay bilang lakas at aktibong pagtulong.
- source_word: תִסְעָדֵנִי
  choice: inalalayan ako
  rationale: Ang סעד ay nangangahulugang umalalay, sumuporta, o magpanatili. Ang “inalalayan ako” ay natural sa Tagalog at angkop sa personal na tulong na inilalarawan.
- source_word: וְעַנְוַתְךָ
  choice: ang iyong kababaang-loob
  rationale: Maaaring tumukoy ang salita sa kapakumbabaan, kaamuan, o kahinahunan. Pinananatili ng “kababaang-loob” ang kapansin-pansing paglalapat ng katangiang ito sa Diyos nang hindi pinapawi ang tensiyong teolohikal.
- source_word: תַרְבֵּנִי
  choice: ang nagpadakila sa akin
  rationale: Ang Hiphil ng רבה ay “magpalaki” o “gawing dakila.” Ang “nagpadakila sa akin” ay maikli, natural, at akma sa konteksto.
theological_decisions:
- issue: Paglalarawan sa Diyos sa pamamagitan ng וְעַנְוַתְךָ
  choice: iyong kababaang-loob
  alternative: iyong kahinahunan
  rationale: Pinahihintulutan ng Hebreo ang kapakumbabaan, kaamuan, o kahinahunan. Pinananatili sa pangunahing teksto ang nakakagulat na diwa ng kababaang-loob ng Diyos—ang kanyang pagpapakababang tumulong—sa halip na tahimik itong gawing mas banayad; inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga larawang “kalasag” at “kanang kamay,” pati ang sadyang kapansin-pansing pagtukoy sa kababaang-loob ng Diyos.
