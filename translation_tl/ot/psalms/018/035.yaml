  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang nakaraang pagbibigay ng Diyos ng “kalasag ng iyong pagliligtas,” ang pagsuporta ng kanyang kanang kamay, at ang paggawa niyang dakila sa nagsasalita. Napananatili rin ang metaporang “kalasag” at “kanang kamay” at ang pagkakasunod ng mga sugnay.'
