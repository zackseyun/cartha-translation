  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: tl
  text: Sinasanay niya ang aking mga kamay sa pakikipaglaban, at kaya ng aking mga bisig na baluktutin ang busog na bronse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas literal na salin, “at nabaluktot ng aking mga bisig ang isang busog na bronse.” Mahirap ang sugnay na Hebreo at maaari itong isalin sa pasibong diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: Sinasanay
  rationale: Ang pandiwang למד ay maaaring mangahulugang “nagtuturo” o “nagsasanay.” Sa konteksto ng pakikipaglaban, ang “sinasanay” ay malinaw na tumutukoy sa praktikal na paghahanda.
- source_word: יָדַי
  choice: ang aking mga kamay
  rationale: Pinananatili ang kongkretong maramihang larawan ng Hebreo.
- source_word: לַמִּלְחָמָה
  choice: sa pakikipaglaban
  rationale: Likas sa makabagong Tagalog at tapat sa diwang militar ng “digmaan” o “labanan.”
- source_word: וְנִחֲתָה
  choice: kaya ... na baluktutin
  rationale: Mahirap ang anyo at sintaks ng pandiwa. Ipinahahayag ng salin ang kakayahang ipinagkaloob sa mang-aawit, habang inilalahad sa talababa ang mas pormal na pasibong pagbasa.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: busog na tanso
  rationale: Ang “busog” ang wastong Tagalog para sa bow, samantalang ang “pana” ay karaniwang arrow. Ang נְחוּשָׁה ay tumutukoy sa tanso o bronse; “tanso” ang mas karaniwang katawagan sa Tagalog.
- source_word: זְרוֹעֹתָי
  choice: aking mga bisig
  rationale: Pinananatili ang maramihang anyo at ang larawan ng lakas ng katawan.
theological_decisions:
- issue: Pagpapakahulugan sa mahirap na pariralang וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: 'Ipinahahayag ang ipinagkaloob na kakayahan: “kaya ng aking mga bisig na baluktutin ang busog na tanso.”'
  alternative: “at ang busog na tanso ay nababaluktot ng aking mga bisig”
  rationale: Bagaman siksik at hindi tiyak ang sintaks ng Hebreo, ang pangunahing salin ay natural sa Tagalog at umaayon sa paralelismo tungkol sa pagsasanay at pagpapalakas ng Diyos. Hindi itinatago ang posibleng pasibong pagbasa, kaya inilalagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “busog” sa halip na “pana” upang tumpak na tukuyin ang sandatang binabaluktot bago magpalipad ng palaso.
