  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: tl
  text: Ikaw na nagliligtas sa akin mula sa aking mga kaaway[a]; tunay ngang itinataas mo ako nang higit sa mga bumabangon laban sa akin[b]; inililigtas mo ako mula sa taong marahas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking Tagapagligtas mula sa aking mga kaaway.” Ang pambungad sa Hebreo ay isang participle na ginagamit bilang pantawag o paglalarawan sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “dinadakila mo ako nang higit sa mga bumabangon laban sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mula sa isang lalaki ng karahasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: ikaw na nagliligtas sa akin
  rationale: Ang participle na may hulaping unang panauhan ay tumutukoy sa Diyos bilang siyang palaging nagliligtas sa salmista. Ang “ikaw na” ay natural na tuwirang pagtawag sa Filipino at pinananatili ang participial na paglalarawan.
- source_word: מֵאֹיְבַי
  choice: mula sa aking mga kaaway
  rationale: Tuwirang inilalarawan ang pinagmumulan ng pagliligtas at pinananatili ang maramihang anyo at hulaping unang panauhan.
- source_word: אַף
  choice: tunay ngang
  rationale: Ipinahahayag ang pagpapatindi at pagdaragdag ng kasunod na sugnay, hindi lamang payak na pag-uugnay.
- source_word: מִן קָמַי
  choice: nang higit sa mga bumabangon laban sa akin
  rationale: 'Ang קָמַי ay mga kalabang bumabangon laban sa nagsasalita; kasunod ng רום, ang מִן ay likas na nagpapahayag ng paghahambing: itinataas nang higit sa kanila.'
- source_word: תְּרוֹמְמֵנִי
  choice: itinataas mo ako
  rationale: Pinananatili ang patayong larawan ng causative/intensive na anyo ng רום sa malinaw at kasalukuyang Filipino.
- source_word: מֵאִישׁ חָמָס
  choice: mula sa taong marahas
  rationale: Pinananatili ang isahang taong gumagawa o kinakatawan ng karahasan. Mas natural sa Filipino ang “taong marahas” kaysa literal na “lalaki ng karahasan,” habang hindi ginagawang maramihan o abstrakto ang referent.
- source_word: תַּצִּילֵנִי
  choice: inililigtas mo ako
  rationale: Ipinahahayag ang pagliligtas mula sa panganib. Bagaman kapareho ng salitang Filipino na ginamit sa unang linya, natural ito at hindi nangangailangan ng artipisyal na lexical na pagkakaiba.
theological_decisions:
- issue: Tinutukoy at kinakausap sa pambungad na participle
  choice: 'Tuwirang kinakausap ang Diyos: “ikaw na nagliligtas sa akin.”'
  alternative: Maaaring gawing pamagat na “aking Tagapagligtas” o iugnay bilang relative clause sa naunang talata.
  rationale: Ang Hebreo ay likas na lumilipat mula sa substantival na participle na naglalarawan sa Diyos tungo sa mga pandiwang nasa ikalawang panauhan. Pinananatili ng tuwirang pagtawag ang kayarian ng tula.
- issue: Pagpapakahulugan sa מן kasunod ng רום
  choice: 'Paghahambing: “nang higit sa mga bumabangon laban sa akin.”'
  alternative: 'Pinagmumulan o paglayo: “mula sa mga bumabangon laban sa akin.”'
  rationale: Likas sa רום na may מן ang diwang pag-angat nang higit o sa ibabaw ng mga kalaban, ngunit itinatala sa talababa ang mas tuwirang alternatibo.
- issue: Paglalarawan sa אִישׁ חָמָס
  choice: “taong marahas”
  alternative: “isang lalaki ng karahasan” o “taong gumagawa ng karahasan.”
  rationale: Hindi kailangang idiin ang biyolohikal na kasarian sa Filipino upang mapanatili ang isahang taong tinutukoy. Ang parirala ay naglalarawan sa isang marahas na maniniil nang hindi nagdaragdag ng doktrinal na kahulugan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “ikaw na” upang maging natural ang tuwirang pagtawag sa Diyos; iniwasan ang mas arkaikong “nag-aadya.” Ang tatlong marker na [a], [b], at [c] ay nasa pangunahing teksto at tumutugma sa mga talababa.
