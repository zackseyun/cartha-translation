  text: כִּ֤י מִ֣י אֱ֭לוֹהַּ מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֝֗וּר זוּלָתִ֥/י אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: tl
  text: Sapagkat sino ang Diyos maliban kay Yahweh? At sino ang bato bukod sa ating Diyos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bukod kay Yahweh” sa unang tanong at “maliban sa ating Diyos” sa ikalawa; kapuwa nagpapahayag ng pagiging bukod-tangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang batayan o paliwanag para sa naunang papuri habang nananatiling natural at marangal sa Filipino.
- source_word: מִי
  choice: sino
  rationale: Tuwirang katumbas ng panghalip na pananong at angkop sa retorikal na tanong.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Tumutukoy dito sa tunay na Diyos sa eksklusibong paghahambing kay Yahweh.
- source_word: מִבַּלְעֲדֵי
  choice: maliban kay
  rationale: Malinaw na nagpapahayag ng eksklusyon at natural gamitin bago ang pangalan ng isang persona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וּמִי
  choice: At sino
  rationale: Pinananatili ang pang-ugnay at ang paralelismo ng dalawang retorikal na tanong.
- source_word: צוּר
  choice: bato
  rationale: Pinananatili ang konkretong metapora ng katatagan, lakas, at proteksiyon sa halip na ipaliwanag lamang bilang 'kanlungan.'
- source_word: זוּלָתִי
  choice: bukod sa
  rationale: Nagpapahayag ng eksklusyon na kaagapay ng מִבַּלְעֲדֵי habang natural ang pagkakaiba ng pananalita sa Filipino.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Pinananatili ang unang panauhang maramihang hulapi at ang pansambayanan at tipanang diwa nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa Hebreo; ang transliterasyong 'Yahweh' ay hindi nagpapalit dito ng titulo.
- issue: Metapora ng צוּר para sa Diyos
  choice: bato
  alternative: Bato; kanlungan; tanggulan
  rationale: Pinananatili ng 'bato' ang mismong larawang Hebreo at ang teolohikal na pahiwatig ng katatagan at proteksiyon nang hindi ginagawang tahasang paliwanag ang metapora.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismo ng Hebreo, ang dalawang retorikal na tanong, ang personal na pangalang Yahweh, at ang metaporang “bato.”
