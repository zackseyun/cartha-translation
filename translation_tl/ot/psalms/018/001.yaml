translation:
  language: tl
  text: At sinabi niya, “Mahal kita[a], Yahweh, lakas ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay may himig ng magiliw at mahabaging pagmamahal. Sa ibang konteksto, maaari itong magpahiwatig ng habag; dito, ipinahahayag nito ang malalim na pag-ibig sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Pinananatili ang waw-consecutive at ang pormulang nagpapakilala sa mismong sinabi, ayon sa tekstong WLC at sa ibinigay na paghahati ng talata.
- source_word: אֶרְחָמְךָ
  choice: Iniibig kita
  rationale: Ang pandiwa ay may diwa ng magiliw at mahabaging pagmamahal. Sa tuwirang pakikipag-usap sa Diyos, likas sa modernong Tagalog ang “Iniibig kita” at hindi nito ipinahihiwatig na kinahahabagan ng salmista ang Diyos; inilalahad sa talababa ang mas literal na nuances.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: חִזְקִי
  choice: lakas ko
  rationale: Tuwiran at natural itong katumbas ng pangngalang may hulaping unang panauhan, at ipinahahayag na si Yahweh ang lakas ng nagsasalita.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyon sa halip na gawing isang titulo.
- issue: Diwa ng רחם kapag ang Diyos ang kinakausap
  choice: Iniibig kita
  alternative: Nahabag ako sa iyo / Labis kitang minamahal
  rationale: May likas na diwa ang ugat na רחם ng habag at magiliw na pagmamahal, ngunit ang “nahabag ako sa iyo” ay magbibigay ng maling pahiwatig sa kontekstong ito. Pinananatili ng pangunahing salin ang debosyonal na diwa, habang inilalagay sa talababa ang leksikal na tensiyon.
translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Ginamit ang “lakas ko” sa halip na “aking lakas” upang maging mas natural sa karaniwang mambabasa, habang nananatiling angkop sa panalanging patula.
