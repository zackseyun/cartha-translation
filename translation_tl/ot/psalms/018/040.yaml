  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: tl
  text: Pinatalikod mo sa akin ang aking mga kaaway[a]; nilipol ko ang mga napopoot sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ibinigay mo sa akin ang batok ng aking mga kaaway,” isang idyoma na nangangahulugang pinatakas o ipinagapi sa akin ang mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: aking mga kaaway
  rationale: Karaniwang makabagong salin ng אֹיֵב na may hulaping unang panauhang isahan; malinaw nitong pinananatili ang diwa ng mga kalaban.
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: Pinatalikod mo sa akin
  rationale: Ang literal na larawan ay ‘ibinigay mo sa akin ang batok/leeg.’ Sa konteksto, isa itong idyoma ng pagpapatakas o paggapi sa mga kaaway. Ang ‘pinatalikod’ ay likas sa Filipino at pinananatili ang larawan ng pagtalikod, samantalang inilalagay sa talababa ang literal na anyo.
- source_word: וּמְשַׂנְאַי
  choice: ang mga napopoot sa akin
  rationale: Pinananatili ang participial na diwa ng isang pangkat ng mga taong namumuhi sa nagsasalita; ang ‘napopoot’ ay marangal ngunit nauunawaan pa rin sa makabagong Filipino.
- source_word: אַצְמִיתֵם
  choice: nilipol ko
  rationale: Ang Hiphil ng צמת ay nagpapahayag ng pagpapahamak o lubusang pagpuksa. Ang ‘nilipol’ ay sapat na matindi at angkop sa patulang rehistro ng Awit.
theological_decisions:
- issue: Larawan ng pagkatalo ng mga kaaway sa עֹרֶף
  choice: Isinalin sa teksto bilang ‘Pinatalikod mo sa akin’ at ipinaliwanag sa talababa ang literal na larawan.
  alternative: ‘Ibinigay mo sa akin ang mga batok ng aking mga kaaway’
  rationale: Iniiwasan nitong gawing lubhang malabo o di-likas ang Filipino habang hindi itinatago ang kongkretong larawang Hebreo. Hindi rin dinaragdagan ang teksto ng tahasang pagtukoy sa Diyos, yamang hindi iyon pinangalanan sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pinatalikod’ upang maging natural ang idyomang Hebreo, at ‘nilipol’ upang mapanatili ang lakas at patulang tono ng pandiwa.
