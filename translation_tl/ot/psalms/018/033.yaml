  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: tl
  text: Ginagawa niyang tulad ng mga paa ng usa ang aking mga paa[a], at pinatatayo niya ako sa aking matataas na dako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, pambabaeng maramihan ang salitang ginamit: “mga babaeng usa.” Ipinahihiwatig ng larawan ang mabilis at tiyak na paghakbang.'
    reason: lexical_alternative
  - marker: b
    text: O “sa aking mga kaitaasan.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: Ginagawa niyang tulad
  rationale: Ang Piel participle ng שׁוה ay nagsasaad dito ng pagtiyak na ang mga paa ng mang-aawit ay maging tulad ng sa mga usa. Likas sa Filipino ang hulma na “ginagawa niyang tulad ng.”
- source_word: רַגְלַי
  choice: ang aking mga paa
  rationale: Tuwirang katumbas ito ng pangngalang רֶגֶל na may hulaping unang panauhan at angkop sa larawan ng maliksi at matatag na pagkilos.
- source_word: כָּאַיָּלוֹת
  choice: tulad ng sa mga usa
  rationale: Ang pambabaeng anyong maramihan ay tumutukoy sa mga babaeng usa, ngunit sa karaniwang modernong Filipino, ang “mga usa” ang pinakanatural at hindi nangangailangan ng di-pamilyar na natatanging katawagan. Ang “sa” ay nililinaw na ang mga paa ng mang-aawit ang inihahambing sa mga paa ng usa.
- source_word: וְעַל בָּמוֹתַי
  choice: at ... sa aking matataas na dako
  rationale: Pinananatili nito ang pang-ukol, ang hulaping unang panauhan, at ang konkretong larawang patula ng matataas na lugar, nang hindi ito binibigyan ng di-tiyak na kultikong kahulugan.
- source_word: יַעֲמִידֵנִי
  choice: pinatatayo niya ako
  rationale: Ang Hiphil ng עמד ay literal na “nagpapangyaring tumayo” o “nagpapatayo.” Pinananatili ng salin ang tahasang causative na diwa at hindi idinaragdag ang konsepto ng pagiging ligtas o matatag bagaman ipinahihiwatig iyon ng larawan.
theological_decisions:
- issue: Larawan ng liksi at matatag na pagtayo
  choice: Pinanatili ang mga larawan ng mga paa ng usa at pagtayo sa matataas na dako nang walang tahasang pagdaragdag ng militar o espirituwalisadong paliwanag.
  alternative: Maaaring isaling “inilalagay niya ako nang matatag sa aking matataas na dako,” ngunit ang “nang matatag” ay pagpapaliwanag sa ipinahihiwatig sa halip na tahasang nilalaman ng Hebreo.
  rationale: May kontekstong pandigma at pagliligtas ang salmo, ngunit sa talatang ito ang mismong pananalita ay metaporikal. Ang mas pormal na hulma ay nagpapanatili sa lawak at tensiyon ng larawan.
- issue: Kahulugan ng בָּמוֹתַי
  choice: aking matataas na dako
  alternative: aking matataas na lugar; aking mga kaitaasan
  rationale: Pinananatili ang unang-panauhang hulapi at hindi ipinapalagay na tumutukoy ito sa mga kultikong dambana. Maaari itong tumukoy sa mataas na lupain o mga lugar ng pagtatagumpay sa konteksto.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “matataas na dako” upang mapanatili ang konkretong imahen at ang unang panauhan; iniwasang idagdag sa pangunahing teksto ang “ligtas” o “matatag,” na ipinahihiwatig ngunit hindi tahasang nakasaad.
