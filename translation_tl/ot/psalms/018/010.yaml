  yaml_path: translation/ot/psalms/018/010.yaml
  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: tl
  text: Sumakay siya sa isang kerubin at lumipad; humagibis siya[a] sa mga pakpak ng hangin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabilis na lumipad” o “bumulusok.” Bihira ang pandiwang Hebreo, ngunit malamang na tumutukoy ito sa mabilis na pagkilos sa himpapawid.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “hininga” o “espiritu”; “hangin” ang pinakanababagay rito sa larawan ng bagyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: Sumakay
  rationale: Karaniwang kahulugan ng רכב ang pagsakay. Tuwiran at natural ang “sumakay” at pinananatili nito ang malinaw na larawan ng Diyos bilang mandirigmang nakasakay.
- source_word: עַל
  choice: sa
  rationale: Ipinapakita rito ng pang-ukol ang kinalalagyan o sinasakyan. Natural sa Filipino ang “sumakay sa isang kerubin.”
- source_word: כְּרוּב
  choice: isang kerubin
  rationale: Isahan ang pangngalang Hebreo. Ang “kerubin” ang nakaugaliang katawagang biblikal sa Filipino, at nililinaw ng “isang” na isahan ito nang hindi ipinapaliwanag nang labis ang makalangit na nilalang.
- source_word: וַיָּעֹף
  choice: lumipad
  rationale: Tuwirang katumbas ito ng pandiwang עוף at pinananatili ang magkatulad na larawan ng mabilis na pagkilos sa himpapawid.
- source_word: וַיֵּדֶא
  choice: humagibis
  rationale: Bihira ang pandiwang ito, ngunit sa paralelismo sa “lumipad” ay malamang na tumutukoy sa mabilis na pagkilos sa himpapawid. Ipinahahayag ng “humagibis” ang bilis nang hindi tiyak na itinatakda kung ito ay pagbulusok o ibang uri ng paglipad.
- source_word: כַּנְפֵי
  choice: mga pakpak ng
  rationale: Literal at natural na salin ng construct plural na כַּנְפֵי; pinananatili nito ang matalinghagang larawan ng hangin na may mga pakpak.
- source_word: רוּחַ
  choice: hangin
  rationale: Bagaman maaari ring mangahulugang “hininga” o “espiritu,” ang “hangin” ang pinakanababagay sa nakapaligid na larawan ng bagyo at pagpapakita ng Diyos.
theological_decisions:
- issue: Larawan ng Diyos na nakasakay sa kerubin
  choice: Pinanatili ang kongkretong makatang larawan na sumakay ang Diyos sa isang kerubin.
  alternative: Ipaliwanag ang kerubin bilang sagisag ng ulap-bagyo o hukbo ng mga anghel.
  rationale: Hayagang inilalarawan ng Hebreo ang Diyos na nakasakay sa kerubin, ngunit hindi nito tinutukoy kung paano eksaktong dapat unawain ang larawan. Ang tuwirang salin ay umiiwas sa pagpasok ng isang tiyak na paliwanag na wala sa talata.
- issue: Kahulugan ng רוּחַ
  choice: Isinalin bilang “hangin” sa pangunahing teksto.
  alternative: “espiritu” o “hininga”
  rationale: Ang konteksto ng pagpapakita ng Diyos sa gitna ng bagyo ay pumapabor sa “hangin,” ngunit itinala sa talababa ang tunay na lawak ng kahulugan ng salitang Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang masiglang paralelismo at kongkretong larawang patula. Ginamit ang “kerubin” bilang pamilyar na katawagang biblikal, habang ang “humagibis” ay malinaw at masiglang nagpapahiwatig ng mabilis na pagkilos.
