  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: tl
  text: Sa aking kagipitan, tumatawag ako kay Yahweh,[a] at humihingi ako ng tulong sa aking Diyos. Mula sa kanyang templo[b] ay naririnig niya ang aking tinig; ang daing ko sa kanyang harapan ay umaabot sa kanyang pandinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Maririnig niya mula sa kanyang templo ang aking tinig ... makararating sa kanyang pandinig ang daing ko sa kanyang harapan.” Maaaring unawain na may puwersang panghinaharap ang mga pandiwang Hebreo.'
    reason: alternative_reading
  - marker: b
    text: Ang “templo” ay maaari ring isaling “palasyo” o “santuwaryo”; maaaring tukuyin ng salitang Hebreo ang tirahan ng isang hari o ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Sa aking kagipitan
  rationale: Ipinahahayag ng צַר ang pagk berada sa matinding hirap o kagipitan, at ginagawang personal ito ng לִי.
- source_word: אֶקְרָא יְהוָה
  choice: tumatawag ako kay Yahweh
  rationale: Ang קרא kasama ng banal na pangalan ay tumutukoy sa pagtawag o pagdalangin sa Diyos; natural sa Tagalog ang 'tumatawag ... kay.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng transliterasyong 'Yahweh,' sa halip na palitan ito ng isang titulo.
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: at humihingi ako ng tulong sa aking Diyos
  rationale: Ang שׁוע sa Piel ay isang sigaw o pagsusumamo para sa tulong; malinaw at natural sa modernong Tagalog ang napiling parirala.
- source_word: יִשְׁמַע
  choice: naririnig niya
  rationale: Maaaring kasalukuyan, kinagawian, o hinaharap ang puwersa ng Hebrew imperfect. Ang masiglang kasalukuyan ay angkop sa patulang paglalarawan, habang inilalahad sa talababa ang hinaharap na pagbasa.
- source_word: מֵהֵיכָלוֹ
  choice: Mula sa kanyang templo
  rationale: Ang הֵיכָל ay maaaring mangahulugang templo, palasyo, o santuwaryo. 'Templo' ang malinaw na pangunahing salin sa kontekstong tumutukoy sa tahanan ng Diyos.
- source_word: קוֹלִי
  choice: ang aking tinig
  rationale: Karaniwang katumbas ng קוֹל ang 'tinig' sa konteksto ng panalangin.
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: ang daing ko sa kanyang harapan
  rationale: Ang שַׁוְעָה ay daing para sa tulong, at ang לְפָנָיו ay literal na 'sa harap niya' o 'sa kanyang presensya.'
- source_word: תָּבוֹא בְאָזְנָיו
  choice: ay umaabot sa kanyang pandinig
  rationale: Natural na Tagalog ito para sa larawang ang daing ay dumarating sa mga tainga ng Diyos, nang hindi ipinahihiwatig na hindi niya ito pinapansin.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang 'Yahweh' sa halip na palitan ng titulo.
- issue: Panahunan o aspekto ng יִשְׁמַע at תָּבוֹא
  choice: 'Masiglang kasalukuyan: ''naririnig ... umaabot'''
  alternative: 'Hinaharap: ''maririnig ... makararating'''
  rationale: Hindi tiyak na itinatakda ng mga Hebrew imperfect ang oras dito. Ang kasalukuyang pagbasa ay natural sa patulang pagsasalaysay, ngunit tunay ding posible ang hinaharap kaya pinananatili iyon sa talababa.
- issue: Lokasyon ng Diyos na tinutukoy ng הֵיכָל
  choice: templo
  alternative: palasyo o santuwaryo
  rationale: Maaaring tumukoy ang salita sa makalangit na tirahan o maharlikang palasyo ng Diyos, hindi lamang sa isang gusali sa lupa; pinananatili sa talababa ang saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang paralelismo at ang personal na banal na pangalang Yahweh. Ginamit ang 'umaabot sa kanyang pandinig' bilang natural na Tagalog para sa Hebreong antropomorpikong larawang 'dumarating sa kanyang mga tainga.'
