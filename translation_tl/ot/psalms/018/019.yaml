  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: tl
  text: Inilabas niya ako sa maluwang na lugar[a]; iniligtas niya ako[b], sapagkat nalugod siya sa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang bukás na lugar” o “sa isang maluwang na pook.” Inihahambing ng larawang Hebreo ang kagipitan o pagkakakulong sa kalayaan at kaligtasan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinagip niya ako” o “hinango niya ako.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sapagkat nasiyahan siya sa akin” o “sapagkat kinalugdan niya ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Inilabas niya ako
  rationale: Ang Hiphil ng יצא ay causative, “ilabas” o “pangyaring makalabas.” Likas sa modernong Tagalog ang “inilabas niya ako” at pinananatili nito ang larawan ng pagliligtas.
- source_word: לַמֶּרְחָב
  choice: sa maluwang na lugar
  rationale: Ang מֶרְחָב ay tumutukoy sa kaluwangan o bukás at maluwang na pook, bilang kabaligtaran ng pagkakakulong o kagipitan. Malinaw at natural ang “maluwang na lugar” sa Tagalog.
- source_word: יְחַלְּצֵנִי
  choice: iniligtas niya ako
  rationale: Ang Piel ng חלץ ay maaaring mangahulugang hugutin, iligtas, o sagipin. Ang “iniligtas” ay dignified at pangkalahatang nauunawaan, at angkop sa parallelism ng naunang sugnay.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagliligtas. Ang “sapagkat” ay malinaw, natural, at angkop sa marangal na rehistro ng salmo.
- source_word: חָפֵץ
  choice: nalugod
  rationale: Ipinahahayag ng חפץ ang kasiyahan, pagkalugod, o mabuting kalooban. Pinananatili ng “nalugod” ang personal na pabor nang hindi ipinapasok ang isang partikular na doktrinal na paliwanag.
- source_word: בִּי
  choice: sa akin
  rationale: Kasama ng חפץ, ang בִּי ay tumutukoy sa taong kinalulugdan. Natural sa Tagalog ang “nalugod siya sa akin.”
theological_decisions:
- issue: Kalikasan ng pabor ng Diyos sa huling sugnay
  choice: sapagkat nalugod siya sa akin
  alternative: sapagkat nasiyahan siya sa akin; sapagkat kinalugdan niya ako
  rationale: Sinasabi ng Hebreo na ang pagkalugod ng Diyos ang dahilan ng pagliligtas, ngunit hindi nito nililinaw kung ito ay dahil sa merito, tipan, pagpili, o biyaya. Pinananatili ng salin ang bukás na teolohikal na tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang konkretong larawan ng paglabas tungo sa isang maluwang na lugar at iniwasang tukuyin nang higit sa Hebreo ang batayan ng pagkalugod ng Diyos.
