  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: tl
  text: Sapagkat sinunod ko ang mga daan ni Yahweh, at hindi ako masamang lumayo sa aking Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at hindi ako gumawa ng kasamaan sa paglayo sa aking Diyos.” Mas literal, “at hindi ako kumilos nang masama mula sa aking Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag at likas ang daloy nito sa makatang pangangatwiran ng salmo.
- source_word: שָׁמַרְתִּי
  choice: sinunod ko
  rationale: Ang שׁמר ay nangangahulugang ingatan o sundin. Sa konteksto ng pamumuhay ayon sa kalooban ng Diyos, malinaw at natural sa modernong Tagalog ang “sinunod ko.”
- source_word: דַּרְכֵי
  choice: ang mga daan
  rationale: Pinananatili ng “mga daan” ang karaniwang metaporang Hebreo para sa itinakdang paraan ng pamumuhay at pagkilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: at hindi ako tumalikod nang masama sa aking Diyos
  rationale: Pinagsasama nito ang diwa ng רשע, “kumilos nang masama,” at ng מִן, “mula sa” o paglayo. Ang “tumalikod nang masama” ay maikli at malinaw habang pinananatili ang ugnayan ng kasamaan at paglayo sa Diyos.
theological_decisions:
- issue: Ang mariing pahayag ng salmista tungkol sa sarili niyang katuwiran
  choice: Iniharap ito bilang katapatan sa mga daan ni Yahweh at hindi masamang pagtalikod sa Diyos.
  alternative: Unawain ang pahayag bilang ganap na kawalan ng anumang kasalanan.
  rationale: Ang Hebreo ay nakatuon sa pagsunod at sa hindi paglayo sa Diyos. Pinananatili ng salin ang lakas ng pahayag nang hindi nagdaragdag ng tahasang pag-aangkin ng ganap na kawalang-kasalanan.
- issue: Ugnayan ng רָשַׁעְתִּי at מֵאֱלֹהָי
  choice: “tumalikod nang masama sa aking Diyos”
  alternative: “gumawa ng kasamaan sa paglayo sa aking Diyos”
  rationale: Maaaring unawain ang parirala bilang masamang pagtalikod o bilang paggawa ng kasamaan na nahahayag sa paglayo. Pinili sa teksto ang mas maikli at natural na anyo, habang inilalahad sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang tradisyonal at malinaw na metaporang “mga daan,” ngunit ginamit ang natural na “sinunod” upang ipahayag ang pagsunod sa itinakdang pamumuhay.
