  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: tl
  text: Nang magkagayo'y, nagpakita ang mga daluyan ng tubig[a], at nalantad ang mga pundasyon ng sanlibutan[b] dahil sa pagsaway mo, Yahweh, dahil sa bugso ng hininga mula sa mga butas ng iyong ilong[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ilalim ng ilog” o “mga daluyan ng agos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pundasyon ng daigdig.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “mula sa hininga ng hangin/espiritu ng iyong mga butas ng ilong”; isa itong matingkad na paglalarawan sa napakalakas na hininga ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: nakita
  rationale: 'Pinananatili ang pasibong diwa ng Niphal ng ראה: ang mga daluyan ay naging nakikita dahil nahawi ang tubig.'
- source_word: אֲפִיקֵי מַיִם
  choice: mga daluyan ng tubig
  rationale: Ang אֲפִיקִים ay maaaring tumukoy sa mga daluyan, ilalim ng ilog, o agosang-tubig; ang saling ito ay malapit sa Hebreo at natural sa Filipino.
- source_word: וַיִּגָּלוּ
  choice: nalantad
  rationale: Ipinahahayag ng Niphal ng גלה ang pagkatuklas o pagkakahantad; ang “nalantad” ay angkop sa marahas na larawang kosmiko.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: mga pundasyon ng sanlibutan
  rationale: Ang מוֹסְדוֹת ay mga pundasyon o saligan, at ang תֵּבֵל ay ang daigdig o sanlibutan bilang maayos na tahanan ng tao.
- source_word: מִגַּעֲרָתְךָ
  choice: dahil sa pagsaway mo
  rationale: Maaaring ipahayag ng מִן ang sanhi; malinaw at natural sa Filipino ang “dahil sa” habang pinananatili ang bisa ng banal na pagsaway.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: dahil sa bugso ng hininga mula sa mga butas ng iyong ilong
  rationale: Pinananatili nito ang magkakaugnay na נְשָׁמָה (hininga/bugso), רוּחַ (hangin/hininga), at אַף (ilong/butas ng ilong), pati ang matingkad na antropomorpikong larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Antropomorpikong paglalarawan sa hininga ng Diyos
  choice: panatilihin ang “bugso ng hininga mula sa mga butas ng iyong ilong”
  alternative: dahil sa tindi ng iyong galit
  rationale: Ang Hebreo ay gumagamit ng kongkretong larawang katawan. Hindi ito dapat patagin bilang abstraktong “galit,” bagaman maaaring magpahiwatig ng galit ang אַף.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Ginamit ang “sanlibutan” upang tumbasan ang kosmikong תֵּבֵל, ngunit inilagay sa talababa ang mas karaniwang “daigdig.” Pinanatili ang konkretong antropomorpikong larawan at ang mga pasibong pandiwa ng Hebreo.
