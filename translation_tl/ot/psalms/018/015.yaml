  to: Nang magkagayo'y, nagpakita ang mga daluyan ng tubig[a], at nalantad ang mga pundasyon ng sanlibutan[b] dahil sa pagsaway mo, Yahweh, dahil sa bugso ng hininga mula sa mga butas ng iyong ilong[c].
