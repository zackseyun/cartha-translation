translation:
  language: tl
  text: Ikiniling niya ang kalangitan at bumaba; makapal na kadiliman[a] ang nasa ilalim ng kanyang mga paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “madilim na ulap” o “pusikit na dilim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: Iyukod
  rationale: Ang נטה ay maaaring mangahulugang iunat, ikiling, o iyukod. Sa makatang paglalarawan ng pagpapakita ng Diyos, malinaw at matingkad na ipinapakita ng “iyukod” ang kalangitang ibinababa upang siya ay bumaba.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Pinananatili ng “kalangitan” ang mataas na makatang himig at malawak na saklaw ng karaniwang maramihang anyo sa Hebreo.
- source_word: וַיֵּרַד
  choice: bumaba
  rationale: Direkta at natural itong katumbas ng ירד at malinaw na naghahayag ng pagkilos mula sa itaas pababa.
- source_word: וַעֲרָפֶל
  choice: makapal na kadiliman
  rationale: Ang עֲרָפֶל ay tumutukoy sa pusikit o makapal na dilim na kaugnay kung minsan ng pagpapakita ng Diyos. Hindi nito labis na tinutukoy ang larawan bilang ulap lamang.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Natural at tuwirang katumbas ito ng panandang panlunan sa Hebreo.
- source_word: רַגְלָיו
  choice: kanyang mga paa
  rationale: Literal na “kanyang mga paa” ang anyong Hebreo; pinananatili ang kongkreto at antropomorpikong larawan.
theological_decisions:
- issue: Antropomorpikong larawan ng pagpapakita ng Diyos
  choice: Pinanatili ang kongkretong larawan ng Diyos na nagpayuko sa kalangitan, bumaba, at may kadiliman sa ilalim ng kanyang mga paa.
  alternative: Palambutin ito bilang pangkalahatang talinghaga lamang ng pagkilos o pakikialam ng Diyos.
  rationale: Makatula at antropomorpiko ang talata, ngunit hindi dapat alisin o ipaliwanag nang labis sa salin ang tunay na larawan at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at makata ngunit madaling maunawaan. Ginamit ang “kalangitan” para sa mataas na himig at “iyukod” upang mapanatili ang matingkad na kilos ng Hebreo.
