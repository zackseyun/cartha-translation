  naturalness: Marangal at nauunawaang Tagalog ang draft, ngunit mas natural at liturhikal ang “Purihin ang aking Bato” bilang katumbas ng benediction na “blessed be,” kaysa “pagpalain,” na maaaring marinig bilang paghiling na tumanggap ang Diyos ng pagpapala. Hindi kailangan ang malaking titik sa “bato,” sapagkat sapat ang konteksto upang ipakitang metapora ito para sa Diyos.
  terminology: Pinananatili ang “Yahweh,” “Bato,” at “kaligtasan.” Ang “Diyos ng aking kaligtasan” ay wastong literal at teolohikal na hindi labis na mapagpaliwanag.
