base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: tl
  text: 'Buhay si Yahweh,


    at purihin ang aking bato;


    at maitaas ang Diyos ng aking kaligtasan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at dakilain ang Diyos ng aking kaligtasan,” o “at dakila ang Diyos ng aking kaligtasan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Ang חַי ay predikatibong pahayag na ang Diyos ay buhay. Likas sa modernong Tagalog ang “Buhay si Yahweh” at hindi nito idinaragdag ang di-kinakailangang diwa ng panunumpang “Saksi si Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וּבָרוּךְ
  choice: at pagpalain
  rationale: Sa konteksto ng pagpupuri, ang anyo ay isang bendisyong aklamasyon. Ang “pagpalain” ay natural at marangal na katumbas sa Tagalog.
- source_word: צוּרִי
  choice: ang aking Bato
  rationale: Tuwirang pinananatili ang metapora ng צוּר para sa Diyos bilang matatag na tagapagtanggol. Ginamit ang malaking titik upang malinaw na tumutukoy ito sa Diyos, hindi sa isang literal na bato.
- source_word: וְיָרוּם
  choice: at dakilain
  rationale: Bagaman imperfect ang anyong Hebreo, maaari itong magkaroon ng jussive o aklamasyong puwersa sa konteksto ng pagpupuri. Ang “dakilain” ay umaayon sa parallel na “pagpalain” habang hindi itinatago ang ibang posibleng pagbasa.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: ang Diyos ng aking kaligtasan
  rationale: Pinananatili nito ang kayariang construct at ang diwa na ang Diyos ang pinagmumulan ng kaligtasan o pagliligtas ng mang-aawit.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Puwersa ng וְיָרוּם sa konteksto ng pagpupuri
  choice: 'jussive o doxological: “dakilain”'
  alternative: 'declarative: “dakila ang Diyos ng aking kaligtasan” o “itinataas ang Diyos ng aking kaligtasan”'
  rationale: Ang imperfect na pandiwa ay maaaring basahing hangad o aklamasyon, ngunit maaari rin itong unawaing pahayag. Pinili sa pangunahing teksto ang pagbasa na pinakamainam sa parallelism, at inilagay sa talababa ang tunay na ambiguity.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinanatili ang tatlong magkakaugnay na pahayag ng pagpupuri at ang metaporang “Bato.” Ang talababa ay minarkahan sa pangunahing teksto.
