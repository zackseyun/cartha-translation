  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: tl
  text: At ginantimpalaan ako ni Yahweh ayon sa aking katuwiran,[a] ayon sa kalinisan ng aking mga kamay[b] sa harap ng kanyang mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “ginantimpalaan” bilang “tinumbasan” o “ibinalik sa akin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbibigay pabalik o pagganti ayon sa ginawa ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “kalinisan ng aking mga kamay” ay isang Hebreong idyoma para sa inosente o matuwid na asal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ginantihan
  rationale: Ang Hiphil ng שוב na may לִי ay nagsasaad ng pagbibigay pabalik o pagganti ayon sa ginawa ng isang tao. Likas sa modernong Filipino ang “ginantihan ako” at hindi nito nililimitahan ang diwa sa gantimpalang positibo lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כְצִדְקִי
  choice: ayon sa aking katuwiran
  rationale: Ang כְּ ay nagpapahayag ng pagtutugma o pamantayan, at ang צֶדֶק dito ay tumutukoy sa katuwiran o matuwid na asal ng salmista.
- source_word: כְּבֹר יָדַי
  choice: ayon sa kalinisan ng aking mga kamay
  rationale: Pinananatili ang konkretong Hebreong larawan ng malilinis na kamay, na tumutukoy sa inosente o matuwid na asal.
- source_word: לְנֶגֶד עֵינָיו
  choice: sa harap ng kanyang mga mata
  rationale: Malapit ito sa literal na larawan ng Hebreo at pinananatili ang antropomorpikong pahayag tungkol sa pagsusuri ng Diyos.
theological_decisions:
- issue: Kung palalambutin ang pag-aangkin ng salmista sa sariling katuwiran
  choice: Pinanatili ang tuwirang pahayag na ginantihan siya ayon sa kanyang katuwiran at sa kalinisan ng kanyang mga kamay.
  alternative: Ipaliwanag ito bilang katapatan sa tipan o relatibong kawalang-sala nang hindi gumagamit ng “katuwiran.”
  rationale: Tahasang inuugnay ng Hebreo ang tugon ni Yahweh sa “aking katuwiran” at “kalinisan ng aking mga kamay.” Dapat panatilihin ng salin ang teolohikal na tensiyong ito sa halip na lutasin o palambutin ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pangalang Yahweh, ang salitang “katuwiran,” at ang konkretong larawan ng mga kamay at mga mata. Inilagay ang [a] pagkatapos ng unang sugnay na nangangailangan ng leksikal na paliwanag at ang [b] pagkatapos ng idyomatikong parirala.
