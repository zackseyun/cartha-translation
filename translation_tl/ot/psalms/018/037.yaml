base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: tl
  text: 'Hinabol ko ang aking mga kaaway at inabutan sila;

    hindi ako bumalik hanggang sa maubos sila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa lubos silang malipol.”
    reason: Ipinakikita ang mas tahasang alternatibong salin ng כַּלּוֹתָם habang pinananatili sa pangunahing teksto ang di-tiyak na ahente.
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: Hinabol ko
  rationale: Ang Qal imperfect na unang panauhan ay ginamit sa konteksto ng patulang pagsasalaysay ng naganap na tagumpay; ang aspektong nagdaan ang pinakanatural sa Filipino.
- source_word: אֹיְבַי
  choice: ang aking mga kaaway
  rationale: Tuwirang inililipat ang pangngalang may hulaping unang panauhan at pinananatili ang diwang pakikidigma.
- source_word: וְאַשִּׂיגֵם
  choice: at inabutan sila
  rationale: Ang Hiphil ng נשׂג ay nangangahulugang umabot o makahabol sa mga tinutugis. Ang “inabutan” ay malinaw at likas sa modernong Filipino.
- source_word: וְלֹא אָשׁוּב
  choice: hindi ako bumalik
  rationale: Pinananatili ang karaniwang kahulugan ng שוב at ang determinasyong hindi tumigil o umurong sa pagtugis.
- source_word: עַד כַּלּוֹתָם
  choice: hanggang sa maubos sila
  rationale: Ang infinitive construct ng כלה na may hulaping tumutukoy sa mga kaaway ay naglalarawan ng lubos na pagkaubos o pagkalipol. Ang “maubos sila” ay natural at hindi tahasang nagdaragdag ng ahente na hindi tinukoy ng anyong Hebreo.
theological_decisions:
- issue: Karahasan at di-tahasang ahente sa huling parirala
  choice: hanggang sa maubos sila
  alternative: hanggang sa lubos ko silang mapuksa
  rationale: Hindi pinalalambot ang ganap na pagkatalo ng mga kaaway, ngunit hindi rin idinaragdag na ang nagsasalita ang tahasang ahente, sapagkat hindi iyon hayagang sinasabi ng anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inabutan” sa larawan ng pagtugis at “maubos” upang ipahayag ang lubos na pagkatalo nang hindi nagpapasok ng ahenteng hindi tahasang binanggit.
