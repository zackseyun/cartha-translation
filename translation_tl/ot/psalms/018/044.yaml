  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: tl
  text: 'Pagkarinig pa lamang nila, sumusunod sila sa akin;

    ang mga dayuhan ay nagkukunwaring sumusunod sa akin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nagsisinungaling sila sa akin” o “sapilitang nagpapasakop sila sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Pagkarinig pa lamang nila
  rationale: Ipinahahayag ng idyomang Hebreo ang agarang pagtugon sa mismong pagkarinig. Ang likas na saling Filipino ay nagpapanatili sa diin ng 'mere hearing' nang hindi nagiging asiwa ang literal na 'sa pagkarinig ng tainga.'
- source_word: יִשָּׁמְעוּ לִי
  choice: sumusunod sila sa akin
  rationale: Ang שׁמע na may ל ay karaniwang nangangahulugang makinig sa awtoridad at sumunod, hindi lamang makarinig. Ang kasalukuyang anyong Filipino ay angkop sa pangkalahatang paglalarawan ng tagumpay ng hari.
- source_word: בְּנֵי נֵכָר
  choice: mga dayuhan
  rationale: Ang literal na 'mga anak ng banyagang lupain/pagiging banyaga' ay idyomang tumutukoy sa mga dayuhan. 'Mga dayuhan' ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: יְכַחֲשׁוּ לִי
  choice: nangangalagang sumunod sa akin
  rationale: Sa konteksto ng pananakop, ang piel ng כחש ay maaaring magpahiwatig ng pagkukunwari o sapilitang pagpapasakop. Ipinakikita ng 'nangangalagang sumunod' ang panlabas ngunit hindi taos-pusong pagsunod, habang pinananatili ng talababa ang mas literal at iba pang posibleng diin.
theological_decisions:
- issue: Kung tunay o pakunwari ang pagpapasakop ng mga dayuhan
  choice: Ipinahiwatig sa pangunahing teksto ang hindi taos-pusong pagsunod sa pamamagitan ng 'nangangalagang sumunod.'
  alternative: Nagsisinungaling sila sa akin; napipilitang magpasakop sa akin.
  rationale: 'Malawak ang saklaw ng כחש: maaari itong mangahulugang magsinungaling/manlinlang, o sa kontekstong militar ay magkunwaring o napipilitang magpasakop. Hindi dapat ipakahulugan ito bilang tunay at kusang katapatan.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'pagkarinig pa lamang' upang natural na maipahayag ang idyomang Hebreo, at 'mga dayuhan' sa halip na literal ngunit asiwa na 'mga anak ng pagiging banyaga.'
