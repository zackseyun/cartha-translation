  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: tl
  text: Kaya magpapasalamat ako sa iyo sa mga bansa[a], Yahweh, at aawit ako ng papuri sa iyong pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa mga bansa”; maaari ring “sa mga Hentil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinapakita nito ang bunga o kongklusyon mula sa naunang konteksto, sa natural at malinaw na modernong Tagalog.
- source_word: אוֹדְךָ
  choice: magpapasalamat ako sa iyo
  rationale: Ang Hiphil ng ידה sa konteksto ng mga awit ay tumutukoy sa hayagang pagpapasalamat o pagpupuri; pinananatili ng parirala ang tuwirang pagtukoy sa Diyos.
- source_word: בַגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Malawak ang saklaw ng גוים bilang mga bansa o mga bayan. Ang 'sa gitna ng mga bansa' ay nagpapanatili sa internasyonal at lokatibong diwa ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan iyon ng isang titulo.
- source_word: וּלְשִׁמְךָ
  choice: sa iyong pangalan
  rationale: Kasama ng pandiwang 'aawit ng papuri,' natural sa Tagalog ang 'sa iyong pangalan' at pinananatili nito ang layon ng papuri.
- source_word: אֲזַמֵּרָה
  choice: aawit ako ng papuri
  rationale: Ang Piel ng זמר ay tumutukoy sa pag-awit o pagtugtog bilang papuri; malinaw na naihahayag ng salin ang pagsambang diwa at ang paralelismo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na gumamit ng pamalit na titulo.
- issue: Saklaw ng גוים
  choice: mga bansa
  alternative: mga Hentil
  rationale: Sa konteksto ng Hebreong Awit, maaaring tumukoy ang salita sa mga bansa sa pangkalahatan. Hindi nililimitahan ng pangunahing salin ang kahulugan sa isang kalaunang teknikal na gamit, habang itinatala sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'O Yahweh' upang mapanatili ang tuwirang panawagan at ang banal na pangalan; ang bahagyang pormal na 'sa gitna ng' ay tumpak sa lokatibong diwa ng Hebreo.
