lexical_decisions:
- source_word: לְכוּ
  choice: Halikayo
  rationale: Isang maramihang paanyaya na natural sa makabagong Tagalog at angkop sa utos na lumapit at magmasid.
- source_word: חֲזוּ
  choice: tingnan ninyo
  rationale: Inilalarawan ang masinsing pagmamasid; malinaw at likas itong pakinggan sa ordinaryong Tagalog.
- source_word: מִפְעֲלוֹת
  choice: mga gawa
  rationale: Direktang tumutukoy sa mga ginawa o pagkilos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang natatanging pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: שָׂם
  choice: naglagay
  rationale: Pinananatili ang pangunahing diwa ng pandiwang 'maglagay/magtakda' at hindi ito pinapalitan ng mas tiyak na sanhiing pandiwa.
- source_word: שַׁמּוֹת
  choice: mga pagkawasak
  rationale: Pinananatili ang matinding larawan ng mga lugar o kalagayang winasak, nang hindi nilulutas kung digmaan, hatol, o ibang kapahamakan ang tinutukoy.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Pinananatili ang saklaw na maaaring tumukoy sa lupa o daigdig ayon sa konteksto.
theological_decisions:
- issue: Ang kaugnayan ni Yahweh sa mga pagkawasak
  choice: kung paanong naglagay siya ng mga pagkawasak
  alternative: na ginawang wasak ang lupa
  rationale: Sinusundan ang sintaks at pandiwa ng Hebreo at pinananatili ang teolohikal na tensiyon nang hindi dinaragdagan o pinahihina ang pagkilos ng Diyos.
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang pinagmulang teksto ay gumagamit ng tetragrammaton, isang natatanging pangalan; kaya pangalan ang inilalahad sa salin.
