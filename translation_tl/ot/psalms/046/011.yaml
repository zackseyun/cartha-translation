  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: tl
  text: 'Si Yahweh ng mga Hukbo ay kasama natin.[a]

    Ang Diyos ni Jacob ang ating matibay na tanggulan.[b]

    Selah.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang PANGINOON ng mga hukbo ay kasama natin.” Ang Hebreong צְבָאוֹת ay tumutukoy sa mga hukbo o pangkat na pandigma at madalas ay may makalangit na pahiwatig.'
    reason: lexical_alternative
  - marker: b
    text: Ang “matibay na tanggulan” ay maaari ring isaling “kanlungan” o “mataas na kuta.” Ang Hebreong מִשְׂגָּב ay tumutukoy sa isang ligtas at mataas na dakong nagbibigay-proteksiyon.
    reason: lexical_alternative
  - marker: c
    text: Ang “Selah” ay isang Hebreong terminong liturhikal o musikal na hindi tiyak ang eksaktong kahulugan; kaya pinanatili itong walang salin.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang mapanatili ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga Hukbo
  rationale: Tumutukoy ang salita sa mga hukbo o sama-samang puwersang pandigma, na maaari ring magkaroon ng makalangit na pahiwatig. Mas malinaw sa makabagong Filipino ang “mga Hukbo” kaysa sa tradisyonal ngunit hindi gaanong karaniwang “mga hukbo ng langit” na magiging mas tiyak kaysa sa Hebreo.
- source_word: עִמָּנוּ
  choice: ay kasama natin
  rationale: Tuwirang ipinapahayag nito ang kahulugang “with us”; idinagdag ang “ay” upang maging likas ang sugnay na walang hayag na pandiwa sa Hebreo.
- source_word: מִשְׂגָּב
  choice: matibay na tanggulan
  rationale: Inilalarawan ng salita ang isang ligtas at mataas o pinatibay na dakong kanlungan. Pinananatili ng “matibay na tanggulan” ang larawan ng proteksiyon at depensa.
- source_word: לָנוּ
  choice: ating
  rationale: Ang lamed na may hulaping unang panauhang maramihan ay nagpapahiwatig ng kapakinabangan—isang tanggulan para sa atin. Likas itong naipahahayag sa Filipino bilang “ating matibay na tanggulan.”
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: ang Diyos ni Jacob
  rationale: Pinananatili nito ang pagkakakilanlang tipan at ang likas na anyo ng pariralang konstrakto sa Filipino.
- source_word: סֶלָה
  choice: Selah
  rationale: Dahil hindi tiyak ang eksaktong kahulugan at tungkuling liturhikal o musikal ng termino, pinanatili ito bilang transliterasyon sa halip na bigyan ng mapagpasiyang salin.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה sa titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga Hukbo
  alternative: ANG PANGINOON ng mga hukbo
  rationale: Hayagang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan, samantalang hindi nililimitahan ng “mga Hukbo” ang tinutukoy sa makalupa o makalangit na hukbo lamang.
- issue: Larawan ng מִשְׂגָּב
  choice: ating matibay na tanggulan
  alternative: ating kanlungan
  rationale: Pinananatili ng “tanggulan” ang larawan ng pinatibay at ligtas na dakong mataas, habang ang “kanlungan” ay mas pangkalahatan at maaaring magpahina sa metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatulad na estruktura ng dalawang linya upang mapanatili ang paralelismo ng tula. Ang “Yahweh ng mga Hukbo” ay pinanatiling titulo, at ang “Selah” ay hindi binigyan ng tiyak na interpretasyon.
