  source_fidelity: 'Tumpak na naihahatid ang dalawang nominal na sugnay sa Hebreo: si Yahweh ay kasama ng bayan, at ang Diyos ni Jacob ay isang מִשְׂגָּב para sa kanila. Ang “Yahweh ng mga Hukbo,” “kasama natin,” “Diyos ni Jacob,” at “matibay na tanggulan” ay nananatiling malapit sa diwa at larawang-singaw ng pinagmulan. Ang “Selah” ay wastong hindi isinasalin dahil hindi tiyak ang tumpak na kahulugan nito.'
