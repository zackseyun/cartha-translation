  text: אֱלֹהִ֣ים בְּ֭/קִרְבָּ/הּ בַּל תִּמּ֑וֹט יַעְזְרֶ֥/הָ אֱ֝לֹהִ֗ים לִ/פְנ֥וֹת בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: tl
  text: Ang Diyos ay nasa gitna niya[a]; hindi siya matitinag[b]. Tutulungan siya ng Diyos pagsapit ng bukang-liwayway.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa loob niya.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi siya mauuga” o “hindi siya susuray.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa pagbaling ng umaga”; ibig sabihin, sa pagsapit ng umaga o bukang-liwayway.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salitang Hebreo, malinaw sa konteksto na tumutukoy ito sa iisang Diyos ng Israel.
- source_word: בְּקִרְבָּהּ
  choice: nasa gitna niya
  rationale: Ipinahihiwatig ng parirala ang presensiya ng Diyos sa loob o kalagitnaan ng lungsod. Likas sa modernong Tagalog ang “nasa gitna niya,” at pinananatili nito ang panghalip na pambabae sa Hebreo nang hindi tahasang pinapalitan ng “lungsod.”
- source_word: בַּל
  choice: hindi
  rationale: Payak at tumpak nitong ipinapahayag ang patulang pagtanggi nang hindi nagdaragdag ng diin na hindi tiyak sa teksto.
- source_word: תִּמּוֹט
  choice: matitinag
  rationale: Ang pandiwang mula sa מוט ay nagsasaad ng pag-uga, pag-urong, o pagkawala ng katatagan. Ang “matitinag” ay natural at marangal na Tagalog na nagpapanatili sa larawan ng matatag na lungsod.
- source_word: יַעְזְרֶהָ
  choice: Tutulungan siya
  rationale: Ipinapahayag ng imperfect ang tiyak o inaasahang pagkilos ng Diyos. Maikli at tuwiran itong katumbas sa Tagalog.
- source_word: לִפְנוֹת בֹּקֶר
  choice: pagsapit ng bukang-liwayway
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagdating o paglitaw ng umaga. Mas natural sa Tagalog ang “pagsapit ng bukang-liwayway” kaysa sa literal na “pagbaling ng umaga,” habang pinananatili ang panahong tinutukoy.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na pambabae
  choice: Pinanatili ang panghalip na “niya/siya,” na sa agarang konteksto ay bumabalik sa lungsod ng Diyos o Zion.
  alternative: Tahasan itong isalin bilang “lungsod” o unawain nang mas malawak bilang sambayanan ng Diyos.
  rationale: Ang gramatikang pambabaeng isahan ay likas na tumutukoy sa lungsod sa naunang talata. Ang pagpapanatili sa panghalip ay umiiwas sa hindi kailangang pagpapaliwanag sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling paralelismo at katiyakan ng tulang Hebreo, habang iniwasan ang sobrang literal na pariralang magiging asiwa sa ordinaryong mambabasa.
