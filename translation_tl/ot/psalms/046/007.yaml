lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: צְבָאוֹת
  choice: ng mga Hukbo
  rationale: Ang maramihang “mga Hukbo” ay malinaw sa makabagong Tagalog at pinananatili ang militar at kosmikong lawak ng titulong Hebreo.
- source_word: עִמָּנוּ
  choice: Kasama natin
  rationale: Natural at tuwirang ipinahahayag nito ang presensiya ng Diyos sa pakikiisa at pag-iingat sa kanyang bayan.
- source_word: מִשְׂגָּב
  choice: matibay na kanlungan
  rationale: Pinagsasama nito ang diwa ng isang ligtas, mataas, at depensibong lugar nang hindi nililimitahan sa isang tiyak na gusali.
- source_word: לָנוּ
  choice: ating
  rationale: Sa pariralang “ating matibay na kanlungan,” likas na naipapahayag sa Tagalog ang kaugnayan at kapakinabangang tinutukoy ng לָנוּ.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: ang Diyos ni Jacob
  rationale: Tuwirang katumbas ito ng construct chain at pinananatili ang tipanang ugnayan sa patriyarkang si Jacob.
- source_word: סֶלָה
  choice: Selah
  rationale: Dahil hindi tiyak ang eksaktong kahulugan o gamit nito, pinanatili ito bilang transliterasyon sa halip na bigyan ng mapagpasyang interpretasyon.
theological_decisions:
- issue: Paglilipat ng banal na titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga Hukbo
  alternative: PANGINOON ng mga hukbo
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at isinasalin ang צְבָאוֹת sa malinaw na makabagong Tagalog. Ang tradisyonal na anyo ay inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “matibay na kanlungan” upang natural na maipahayag ang proteksiyon at katiwasayang taglay ng מִשְׂגָּב; pinanatili ang “Selah” dahil hindi tiyak ang kahulugan nito.
