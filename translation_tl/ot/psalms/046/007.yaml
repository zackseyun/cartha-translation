translation:
  language: tl
  text: Kasama natin si Yahweh ng mga Hukbo; ang Diyos ni Jacob ay matibay na tanggulan para sa atin.[a] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “Kasama natin ang PANGINOON ng mga hukbo.”
