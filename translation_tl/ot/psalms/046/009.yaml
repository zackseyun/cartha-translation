  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: tl
  text: Pinatitigil niya ang mga digmaan hanggang sa dulo ng daigdig; binabali niya ang pana at pinuputol ang sibat[b]; sinusunog niya sa apoy ang mga kariton[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga karwaheng pandigma.” Ang salitang Hebreo ay karaniwang nangangahulugang “mga kariton” o “mga sasakyang panghakot,” ngunit dahil sa konteksto ng digmaan, isinasalin ito ng ilan bilang “mga karwaheng pandigma.”
    reason: lexical_alternative
  - marker: b
    text: O, “pinuputol-putol ang sibat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית
  choice: Pinatitigil niya
  rationale: Ang Hiphil participle ng שׁבת ay nagsasaad ng pagpapahinto. Pinananatili ng “pinatitigil” ang causative na diwa at ang tuloy o karaniwang pagkilos na angkop sa tula.
- source_word: מִלְחָמוֹת
  choice: ang mga digmaan
  rationale: Tuwirang katumbas ito ng pangngalang maramihan at saklaw nito ang mga armadong labanan sa pangkalahatan.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: hanggang sa dulo ng daigdig
  rationale: Pinananatili nito ang larawang “hanggang sa dulo” at ipinahihiwatig ang malawak, pandaigdig na saklaw nang hindi ginagawang tahasang “sa buong daigdig.”
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: binabali niya ang pana
  rationale: Ang Piel ng שׁבר ay nangangahulugang baliin o durugin. Ang “binabali” ay malinaw at hindi labis ang tindi; ang isahang “pana” ay ginagamit bilang pangkalahatang kinatawan ng ganitong sandata.
- source_word: וְקִצֵּץ חֲנִית
  choice: at pinuputol ang sibat
  rationale: Ang קצץ ay maaaring tumukoy sa pagputol, pagputol ng bahagi, o pagputol-putol. Hindi tinutukoy ng Hebreo kung eksaktong ilang bahagi, kaya hindi isinalin bilang “hinahati sa dalawa.”
- source_word: עֲגָלוֹת
  choice: ang mga kariton
  rationale: Karaniwang tumutukoy ang עֲגָלוֹת sa mga kariton o sasakyang panghakot, hindi sa karaniwang salitang Hebreo para sa mga karwaheng pandigma. Pinanatili sa pangunahing teksto ang payak na leksikal na kahulugan.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: sinusunog niya sa apoy
  rationale: Likas sa Tagalog ang pariralang ito at pinananatili ang tahasang larawan ng pagsunog sa pamamagitan ng apoy.
theological_decisions:
- issue: Tradisyonal na pagpapakahulugan sa עֲגָלוֹת sa konteksto ng digmaan
  choice: mga kariton
  alternative: mga karwaheng pandigma
  rationale: Walang doktrinang nakasalalay rito. Mas karaniwang leksikal na kahulugan ng salita ang “mga kariton,” ngunit maaaring maunawaan itong mga karwaheng pandigma dahil sa konteksto; kaya inilagay ang huli bilang alternatibo sa talababa.
- issue: Lawak ng kahulugan ng קִצֵּץ
  choice: pinuputol ang sibat
  alternative: pinuputol-putol ang sibat
  rationale: Hindi nilulutas nang higit sa sinasabi ng Hebreo kung isang bahagi lamang ang pinuputol o winawasak ito sa maraming piraso. Ang pangunahing salin ay nagpapanatili ng lawak na iyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikli at magkakatugmang mga sugnay ng tulang Hebreo, gayundin ang kongkretong larawan ng mga sandatang sinisira. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinutukoy ng mga ito.
