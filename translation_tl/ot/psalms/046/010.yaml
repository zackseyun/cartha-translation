  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: tl
  text: Tumigil kayo[a] at kilalanin ninyo na ako ang Diyos. Itataas ako sa gitna ng mga bansa[b]; itataas ako sa daigdig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bumitiw kayo” o “Manahimik kayo.” Ang pandiwang Hebreo ay maaaring mangahulugang lumuwag, huminto, o bumitiw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Mataas ako” o “Dinadakila ako.” Ang anyong Hebreo ay maaaring unawain bilang pangkasalukuyan o panghinaharap ayon sa konteksto.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isaling “lupain” ang “daigdig,” ngunit pumapabor ang malawak na saklaw ng salmo sa kahulugang “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Tumigil kayo
  rationale: Ang pautos na anyo ng רפה ay maaaring mangahulugang bumitiw, lumuwag, o tumigil. Sa konteksto ng kaguluhan at mga digmaan sa salmo, malinaw at natural na ipinahahayag ng “Tumigil kayo” ang pagpapatigil sa pagsisikap o paglaban, habang hindi ito nililimitahan sa tahimik na pagninilay.
- source_word: וּדְעוּ
  choice: at kilalanin ninyo
  rationale: Ang ידע ay pangunahing “malaman,” ngunit dito ay may diwa ng pagkilala o pagtanggap kung sino ang Diyos. Mas natural sa Filipino ang “kilalanin ninyo na ako ang Diyos” at naipapakita nito ang higit sa basta kaalamang pangkaisipan.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala ng כִּי ang nilalaman ng dapat kilalanin; ang “na” ang natural na pang-ugnay sa Filipino.
- source_word: אָנֹכִי אֱלֹהִים
  choice: ako ang Diyos
  rationale: Pinananatili ng ayos na ito ang diin sa unang panauhang panghalip at natural itong pahayag sa Filipino.
- source_word: אָרוּם
  choice: Itataas ako
  rationale: Ang Qal imperfect ng רום ay maaaring magpahayag ng tiyak na pagdakila sa hinaharap. Pinananatili ng “Itataas ako” ang matalinghagang larawan at ang pasibong anyo ng pagpaparangal, nang hindi tahimik na nilulutas kung ito ay pangkasalukuyan o panghinaharap; inilalahad sa talababa ang alternatibo.
- source_word: בַּגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy sa mga bansa o mga bayan bilang mga pangkat. Ang “sa gitna ng mga bansa” ay natural at nagpapahayag ng pandaigdigang saklaw.
- source_word: בָּאָרֶץ
  choice: sa buong daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng lupain o daigdig. Dahil kaagapay ito ng “mga bansa” at malawak ang saklaw ng salmo, “daigdig” ang mas malamang na kahulugan; nililinaw ng “buong” ang natural na pandaigdigang diwa sa Filipino.
theological_decisions:
- issue: Lakas at saklaw ng pautos na הַרְפּוּ
  choice: Isang utos na tumigil o bumitiw sa pagsisikap at paglaban sa harap ng paghahari ng Diyos
  alternative: Isang panawagan lamang sa tahimik na panloob na pagninilay, o isang utos lamang na ihinto ang digmaan
  rationale: Ang pandiwa ay nagsasaad ng pagluwag, pagbitiw, o pagtigil. Sa konteksto ng mga bansang nagkakagulo at ng Diyos na nagpapahinto ng mga digmaan, mas malawak ito kaysa pribadong katahimikan, ngunit hindi kailangang ikulong sa isang uri lamang ng pagtigil.
- issue: Panahunan o aspekto ng אָרוּם
  choice: Tiyak na pagdakila, isinalin sa anyong panghinaharap na “Itataas ako”
  alternative: “Mataas ako” o “Dinadakila ako” bilang pangkasalukuyang pahayag
  rationale: Maaaring magkaroon ng pangkasalukuyan o panghinaharap na puwersa ang imperfect ayon sa konteksto. Ang hinaharap ay angkop sa tiyak na pagpapahayag ng magiging hayag na kataasan ng Diyos, ngunit pinananatili sa talababa ang tunay na alternatibo.
- issue: Saklaw ng אֶרֶץ
  choice: Ang buong daigdig
  alternative: Ang lupain
  rationale: Ang pagkakatambal nito sa “mga bansa” at ang pangkalahatang saklaw ng salmo ay pumapabor sa pandaigdigang kahulugan, bagaman leksikal na posible ang “lupain.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pangmaramihang “kayo/ninyo” upang katawanin ang Hebreong pangmaramihang pautos. Iniwasan ang tradisyonal ngunit madaling mapakitid na “Manahimik kayo” sa pangunahing teksto, sapagkat maaaring ipakahulugan iyon bilang kawalan lamang ng ingay o pribadong pagninilay.
