translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling maiikli ang magkakahiwalay na bahagi ng pamagat at hindi nilutas nang tiyak ang malabong kaugnayan ng mga anak ni Kora o ang kahulugan ng Alamot.
