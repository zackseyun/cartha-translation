  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan. Sa mga anak ni Kora. Ayon sa Alamot[a]. Isang awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “ayon sa mga dalaga,” ibig sabihin, para sa mga tinig ng babae o matataas na tinig; malamang na panutong musikal o pangalan ng himig ang salitang Hebreo na “Alamot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa nangangasiwa sa pagtatanghal ng musika. Malinaw at likas sa makabagong Filipino ang pariralang ito nang hindi nililimitahan ang tungkulin sa pagkoro lamang.
- source_word: לִבְנֵי קֹרַח
  choice: Ukol sa mga anak ni Kora
  rationale: Maaaring magpahiwatig ang lamed ng kaugnayan, pag-akda, o pagkakatalaga. Pinananatili ng “ukol sa” ang lawak ng kahulugan nang hindi nagpapasiya kung sila ang sumulat o nagtanghal.
- source_word: עַל
  choice: Ayon sa
  rationale: Sa mga panutong musikal, madalas nitong ipinakikilala ang himig, estilo, o paraan ng pagtatanghal; natural itong ipinahahayag ng “ayon sa.”
- source_word: עֲלָמוֹת
  choice: Alamot
  rationale: Hindi tiyak kung ito ay pangalan ng himig, katawagang musikal, o tumutukoy sa mga dalaga o matataas na tinig. Ang transliterasyon ang pinakamahusay na nagpapanatili sa kawalang-katiyakan.
- source_word: שִׁיר
  choice: Isang awit
  rationale: Tinutukoy nito ang uri ng komposisyon; simple, marangal, at natural ang “isang awit.”
