  text: Umugong at bumula man ang tubig nito; manginig man ang mga bundok sa pagbulwak nito.[a] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapalaluan nito,” “sa kataasan nito,” o “sa pag-apaw nito.” Maaaring tumukoy ang salitang Hebreo sa kataasan, kapalaluan, o pagtaas at pagbulwak; dito, mas angkop sa larawan ng nag-aalimpuyong tubig ang “pagbulwak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: umugong
  rationale: Ipinahahayag ng pandiwang המה ang malakas at magulong ingay; ang “umugong” ay likas at matingkad para sa nag-aalimpuyong tubig.
- source_word: יֶחְמְרוּ
  choice: bumula
  rationale: Sa konteksto ng tubig, inilalarawan ng חמר ang pagkulo, pag-alimbukay, o pagbula; pinananatili ng “bumula” ang konkretong larawang patula.
- source_word: מֵימָיו
  choice: ang mga tubig nito
  rationale: Isinasalin ang panlaping 3ms bilang “nito,” na tumutukoy sa dagat na binanggit sa naunang talata, at pinananatili ang ugnayang pag-aari.
- source_word: יִרְעֲשׁוּ
  choice: manginig
  rationale: Ang רעשׁ ay tumutukoy sa malakas na pagyanig; ang “manginig” ay natural na paglalarawan sa mga bundok na niyayanig.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Pinananatili ang tiyak na anyo ng pangngalang Hebreo at ang kolektibong tanawin ng tula.
- source_word: בְּגַאֲוָתוֹ
  choice: sa pag-apaw nito
  rationale: Maaaring mangahulugan ang גאות ng kataasan, kapalaluan, o pagtaas/pagbulwak. Sa agarang larawan ng magulong tubig, malinaw at natural ang pisikal na diwang “pag-apaw,” nang hindi tuluyang ikinukubli ang leksikal na kalabuan.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatiling transliterasyon sapagkat hindi tiyak ang eksaktong tungkulin nito bilang panandang pangmusika o panliturhiya.
