base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: tl
  text: Isang ilog—ang mga batis nito ay nagpapagalak sa lungsod ng Diyos,[a] ang mga banal na tirahan ng Kataas-taasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “May isang ilog na ang mga batis nito ay nagpapagalak sa lungsod ng Diyos.” Walang hayag na pandiwang eksistensiyal gaya ng “may” sa makatang pambungad sa Hebreo; maaaring idagdag ito upang maging mas natural sa Filipino.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tirahan” ay pangmaramihan sa Hebreo. Maaari itong unawain nang kolektibo bilang “tahanan” o mas malayang isalin bilang “santuwaryo.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: Isang ilog
  rationale: Pinananatili ang walang-pandiwang makatang pambungad at ang di-tiyak na anyo ng pangngalan. Maaaring idagdag sa natural na Filipino ang “May,” ngunit mas tuwirang inilalarawan ng “Isang ilog—” ang Hebreo.
- source_word: פְּלָגָיו
  choice: ang mga batis nito
  rationale: Ang pangmaramihang anyong may hulaping panlalaking isahan ay tumutukoy pabalik sa ilog. Likas at malinaw sa Filipino ang “mga batis” para sa mga agos o sangang tubig nito.
- source_word: יְשַׂמְּחוּ
  choice: nagpapagalak
  rationale: 'Ipinahahayag nito ang sanhiang diwa ng Piel: ang mga batis ang nagdudulot ng galak. Nananatili rin ang marangal at makatang himig.'
- source_word: עִיר אֱלֹהִים
  choice: lungsod ng Diyos
  rationale: Tuwirang tinutumbasan ang Hebreong construct chain sa isang likas at pamilyar na pariralang Filipino.
- source_word: קְדֹשׁ
  choice: banal na dako
  rationale: Ang anyo ay panlalaking isahan, kaya hindi ito basta ginawang pang-uring tuwirang tumutukoy sa pangmaramihang מִשְׁכְּנֵי. Ang “banal na dako” ay kumakatawan sa substantibong diwa habang pinananatili ang ugnayang appositional sa lungsod ng Diyos.
- source_word: מִשְׁכְּנֵי
  choice: mga tahanan
  rationale: Pinananatili ang tahasang pangmaramihang anyo ng Hebreo. Hindi ito pinakinis bilang iisang “tahanan” o binigyang-kahulugang “santuwaryo,” bagaman maaaring kolektibo o poetiko ang gamit.
- source_word: עֶלְיוֹן
  choice: Kataas-taasan
  rationale: Ito ang malinaw at kinikilalang salin ng banal na titulong nangangahulugang ang Most High, at pinananatili ang teolohikal na bigat nito.
theological_decisions:
- issue: Kung gagawing isahan ang pangmaramihang מִשְׁכְּנֵי bilang “tahanan” o “santuwaryo”
  choice: Panatilihin bilang “mga tahanan”
  alternative: “tahanan” o “santuwaryo”
  rationale: Pangmaramihan ang tekstong Hebreo. Maaaring kolektibo, pampalakas, o tumukoy sa mga banal na nasasakupan ang anyo, ngunit hindi dapat tahimik na alisin ng salin ang pormal na pagkakaibang ito.
- issue: Ang sintaktikong ugnayan ng קְדֹשׁ sa מִשְׁכְּנֵי עֶלְיוֹן
  choice: “sa banal na dako ng mga tahanan ng Kataas-taasan”
  alternative: “ang mga banal na tahanan ng Kataas-taasan”
  rationale: Isahan ang קְדֹשׁ samantalang pangmaramihan ang מִשְׁכְּנֵי, kaya iniiwasang ipakitang payak lamang na nagkakatugmang pang-uri at pangngalan ang mga ito. Gayunman, kinikilala sa talababa ang posibilidad ng mas idiomatikong pag-unawa sa buong parirala.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikli at walang-pandiwang makatang pambungad sa pamamagitan ng gatlang, habang ginawang malinaw sa talababa ang mas karaniwang ayos na may “May.” Ang “nagpapagalak” at “Kataas-taasan” ay may angkop na biblikal na dignidad nang hindi lipas ang wika.
