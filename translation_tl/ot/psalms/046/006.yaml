lexical_decisions:
- source_word: הָמוּ
  choice: Nagkagulo
  rationale: Ipinahihiwatig ng pandiwa ang maingay at magulong pagkilos. Likas sa makabagong Filipino ang “nagkagulo” at naipapaloob nito kapwa ang ingay at kaguluhan nang hindi tahasang nagdaragdag ng motibong pandigma.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Tumutukoy ito rito sa mga bayang politikal at katambal ng “mga kaharian.” Hindi ginamit ang “mga Hentil” sapagkat hindi binibigyang-diin sa talata ang pagkakaibang Judio at Hentil.
- source_word: מָטוּ
  choice: nayanig
  rationale: Ipinapakita ng salita ang pagkawala ng katatagan, pag-uga, o pagdausdos. Ang “nayanig” ay natural at matulaing Filipino at hindi nito pinangungunahan ang teksto sa pagsasabing lubusang bumagsak na ang mga kaharian.
- source_word: מַמְלָכוֹת
  choice: ang mga kaharian
  rationale: Tuwiran at karaniwang katumbas ito para sa mga nasasakupang politikal na pinamumunuan ng hari.
- source_word: נָתַן בְּקוֹלוֹ
  choice: ipinahayag ang kanyang tinig
  rationale: Ang literal na idyoma ay “ibinigay niya ang kanyang tinig.” Pinananatili ng “ipinahayag ang kanyang tinig” ang bigat ng makapangyarihang pagbigkas at mas natural kaysa sa literal na anyo sa Filipino.
- source_word: תָּמוּג
  choice: natunaw
  rationale: Pinananatili nito ang matingkad na larawan ng pagkawala ng tibay o anyo sa harap ng tinig ng Diyos, sa halip na paliitin iyon sa simpleng pagyanig.
- source_word: אָרֶץ
  choice: ang lupa
  rationale: Ang “lupa” ay natural na katumbas at maaari ritong tumukoy sa buong daigdig sa kontekstong pandaigdig ng mga bansa at kaharian.
theological_decisions:
- issue: Di-tahasang simuno ng נָתַן
  choice: “kanyang” tumutukoy sa Diyos
  alternative: Tahasang pangalanan bilang “ang PANGINOON”
  rationale: Panlalaking isahan ang di-tahasang simuno sa Hebreo, at ipinakikilala ng nakapaligid na konteksto na ito ang Diyos. Hindi idinagdag ang banal na pangalan sapagkat hindi ito tahasang nasa talatang ito.
translation_notes:
  register: Makabago, marangal, at matulaing Filipino. Ginamit ang “nagkagulo” bilang malinaw na pangunahing salin, habang inilagay sa talababa ang alternatibong higit na nagtatampok sa maingay na ugong ng הָמוּ. Pinanatili ang maikli at mabilis na galaw ng tulang Hebreo.
