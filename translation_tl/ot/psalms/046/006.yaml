  text: Nagkagulo ang mga bansa[a], nayanig ang mga kaharian; ipinarinig niya ang kanyang tinig, natunaw ang daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nasa kaguluhan ang mga bansa, nayanig ang mga kaharian.”
