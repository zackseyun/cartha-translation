  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: tl
  text: Ang Diyos ang ating kanlungan at lakas, lubos na maaasahang tulong sa mga kagipitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na ayos ng Hebreo: “tulong sa mga kagipitan, natagpuan nang lubos.” Masiksik ang huling parirala; maaari nitong ipahiwatig na ang Diyos ay napatunayang lubos na maaasahan o madaling matagpuan bilang tulong sa panahon ng kagipitan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ang Diyos
  rationale: Bagaman anyong maramihan ang salita sa morpolohiya, isahan ang diwa rito at tumutukoy sa Diyos ng Israel.
- source_word: לָנוּ
  choice: ating
  rationale: Literal itong “para sa atin” o “sa atin,” ngunit likas sa Tagalog ang pang-angking “ating” sa pariralang “ating kanlungan at lakas.”
- source_word: מַחֲסֶה
  choice: kanlungan
  rationale: Tuwiran at marangal na salita ito para sa ligtas na silungan o pinagtatakbuhan.
- source_word: וָעֹז
  choice: at lakas
  rationale: Pinananatili nito ang abstraktong diwa ng עֹז at likas na kapares ng “kanlungan.”
- source_word: עֶזְרָה
  choice: tulong
  rationale: Tuwirang katumbas ito ng tulong o saklolo, nang hindi dinaragdagan ang larawan ng Hebreo.
- source_word: בְּצָרוֹת
  choice: sa mga kagipitan
  rationale: Ipinapahayag ng maramihang anyo ang sari-saring panahon o kalagayan ng matinding hirap; pinananatili ng “mga kagipitan” ang bilang at bigat nito.
- source_word: נִמְצָא מְאֹד
  choice: lubos na maaasahan
  rationale: Literal na “natagpuang lubos” ang masiksik na parirala. Sa natural na Tagalog, ipinahihiwatig nitong ang Diyos ay napatutunayang laging naroroon at maaasahan bilang tulong; inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Kayarian at diwa ng huling sugnay
  choice: “lubos na maaasahang tulong sa mga kagipitan”
  alternative: “tulong sa mga kagipitan na natagpuang lubos” o “tulong na madaling matagpuan sa mga kagipitan”
  rationale: Masiksik at bahagyang malabo ang Hebreong עֶזְרָה בְצָרוֹת נִמְצָא מְאֹד. Iniiwasan ng pangunahing salin ang hindi likas na literalismo ngunit hindi rin tahasang nilulutas kung ang diin ay sa pagiging naroroon, madaling matagpuan, o napatunayang maaasahan. Pinananatili sa talababa ang literal na hugis at mga posibleng pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kanlungan,” “lakas,” at “kagipitan” upang mapanatili ang matulaing bigat nang manatiling madaling maunawaan. Ang “lubos na maaasahan” ay natural na pagpapahayag ng masiksik na Hebreong נִמְצָא מְאֹד, habang kinikilala ng talababa ang literal na anyo at tunay na saklaw ng kahulugan.
