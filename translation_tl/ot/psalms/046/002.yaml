translation:
  language: tl
  text: Kaya hindi tayo matatakot kahit magbago ang lupa[a], kahit gumewang ang mga bundok sa kaibuturan ng mga dagat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kahit maiba ang lupa.” Ang pandiwang Hebreo ay maaaring mangahulugang magbago o magpalit; sa kontekstong ito, inilalarawan nito ang pagkagambala sa katatagan ng lupa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kahit manginig ang mga bundok sa kaibuturan ng mga dagat.” Ang pariralang Hebreo ay maaaring tumukoy sa gitna ng mga dagat bilang kinaroroonan ng pagyanig; hindi nito tahasang minamarkahan ang direksiyong “patungo sa.”
    reason: source_ambiguity
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at malinaw na ipinahahayag ang lohikal na bunga ng naunang pagpapahayag na ang Diyos ang kanlungan at kalakasan.
- source_word: לֹא נִירָא
  choice: hindi tayo matatakot
  rationale: Ipinapahayag ng imperfect na unang panauhang maramihan ang matatag na pasiya at pagtitiwala; natural ito sa modernong Tagalog.
- source_word: בְּהָמִיר אָרֶץ
  choice: kahit magbago ang lupa
  rationale: Pinananatili ang pangunahing diwa ng מוּר na ‘magbago/maiba’ at ang circumstantial na gamit ng ב; sa konteksto, ang pagbabago ay kosmikong pagkagambala.
- source_word: וּבְמוֹט הָרִים
  choice: kahit gumewang ang mga bundok
  rationale: Ang מוֹט ay tumutukoy sa pagkawala ng katatagan, pag-uga, o paggewang. Hindi tahasang nilalagyan ng direksiyong ‘papasok’ ang pandiwa dahil maaaring lokatibo ang kasunod na parirala.
- source_word: בְּלֵב יַמִּים
  choice: patungo sa puso ng mga dagat
  rationale: Pinananatili ang matingkad na metaporang ‘puso’ para sa kaloob-looban o gitna, pati ang tahasang maramihang ‘mga dagat.’ Ang ‘patungo sa’ ay naghahayag ng galaw na ipinahihiwatig ng larawang patula.
