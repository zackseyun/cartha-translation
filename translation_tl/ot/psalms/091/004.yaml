base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: tl
  text: Tatakpan ka niya ng kanyang mga balahibo[a], at sa ilalim ng kanyang mga pakpak ay manganganlong ka; ang kanyang katapatan ay malaking kalasag at panangga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabalahibo niyang pakpak.”
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang katotohanan ay kalasag at panangga.” Hindi tiyak ang eksaktong uri ng pananggalang na tinutukoy ng huling salitang Hebreo.
    reason: lexical_and_textual_ambiguity
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: ng kanyang mga balahibo
  rationale: Ang אֶבְרָה ay tumutukoy sa balahibo o mabalahibong bahagi ng pakpak. Ang “mga balahibo” ay natural sa modernong Tagalog at malinaw na nagpapanatili sa larawan ng ibong kumukupkop.
- source_word: יָסֶךְ
  choice: tatakpan
  rationale: Ang Hiphil ng סכך ay nagpapahiwatig ng pagtatakip bilang pag-iingat o pagprotekta. Tuwirang kaakibat ito ng larawan ng mga balahibo at pakpak.
- source_word: לָךְ
  choice: ka
  rationale: Tuwirang ikalawang panauhan ang kausap; hindi kailangang tukuyin ang kasarian sa Tagalog.
- source_word: וְתַחַת כְּנָפָיו
  choice: at sa ilalim ng kanyang mga pakpak
  rationale: Pinananatili ang kongkretong larawang pang-ibon at ang lokasyon ng proteksiyon.
- source_word: תֶּחְסֶה
  choice: manganganlong ka
  rationale: Ang חסה ay nangangahulugang humanap o manganlong sa ligtas na kanlungan. Ang “manganganlong” ay maikli, dignified, at natural sa salin-awit.
- source_word: צִנָּה
  choice: malaking kalasag
  rationale: Ang צִנָּה ay karaniwang malaking kalasag na nagsasanggalang sa katawan; inilantad ang sukat upang maiba sa kasunod na katawagang pandepensa.
- source_word: וְסֹחֵרָה
  choice: at panangga
  rationale: Bihira at hindi tiyak ang eksaktong anyo ng depensang tinutukoy ng סֹחֵרָה. Ang “panangga” ay nagpapanatili sa pangkalahatang larawang pandepensa nang hindi labis na tinutukoy ang anyo nito.
- source_word: אֲמִתּוֹ
  choice: ang kanyang katapatan
  rationale: Maaaring mangahulugan ang אֱמֶת ng katotohanan, katapatan, o pagiging maaasahan. Sa konteksto ng proteksiyon, malinaw na naihahayag ng “katapatan” ang pagiging mapagkakatiwalaan ng Diyos habang pinananatili sa talababa ang leksikal na alternatibo.
theological_decisions:
- issue: Kahulugan ng אֲמִתּוֹ bilang batayan ng proteksiyon
  choice: ang kanyang katapatan
  alternative: ang kanyang katotohanan
  rationale: Parehong leksikal na posible. Mas natural sa konteksto ng kanlungan at proteksiyon ang “katapatan,” sapagkat itinatampok nito ang pagiging maaasahan ng Diyos nang hindi nagdaragdag ng doktrinal na paliwanag; pinananatili ang “katotohanan” bilang alternatibo sa talababa.
- issue: Eksaktong kahulugan ng סֹחֵרָה
  choice: panangga
  alternative: munting kalasag; depensang nakapalibot
  rationale: Hindi tiyak ang bihirang salitang Hebreo. Iniiwasan ng pangkalahatang “panangga” ang huwad na katiyakan at pinananatili ang parallel na larawang pandepensa.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad na angkop sa tula. Ginamit ang karaniwang “mga balahibo” sa halip na teknikal o lipas na katawagan, at ang “manganganlong” upang mapanatili ang maikli at matalinghagang himig. Ang dalawang magkasunod na larawang pandepensa ay pinanatili bilang “malaking kalasag at panangga,” habang hayagang kinikilala sa talababa ang kawalang-katiyakan ng huling salitang Hebreo.
