  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: tl
  text: Maaaring mabuwal ang isang libo sa tabi mo[a], at sampung libo sa kanan mo, ngunit hindi iyon lalapit sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Mabubuwal ang isang libo sa tabi mo, at sampung libo sa kanan mo.” Ang pandiwang Hebreo para sa “mabuwal” ay maaaring unawain bilang panghinaharap o nagsasaad ng posibilidad sa kontekstong patula.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi lalapit sa iyo.” Hindi binanggit sa Hebreo ang simuno; ipinahihiwatig ng konteksto na iyon ang nagbabantang kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: Maaaring mabuwal
  rationale: Ang Qal imperfect ng נפל ay maaaring magpahayag ng mangyayari o ng posibilidad sa kontekstong patula. Pinananatili ng “maaaring mabuwal” ang tunay na kalabuan nang hindi ipinipilit ang tiyak na hinaharap.
- source_word: מִצִּדְּךָ
  choice: sa tabi mo
  rationale: Bagaman literal na may pang-ukol na “mula sa,” ang parirala kasama ng pagbuwal ay tumutukoy sa kinalalagyan sa tabi ng kausap.
- source_word: אֶלֶף
  choice: isang libo
  rationale: Tuwirang salin ng bilang at pinananatili ang paralelismong patula.
- source_word: וּרְבָבָה
  choice: at sampung libo
  rationale: Ang רְבָבָה ay karaniwang tumutukoy sa sampung libo at nagpapatingkad sa pag-angat mula sa isang libo.
- source_word: מִימִינֶךָ
  choice: sa kanan mo
  rationale: Likas na modernong Tagalog para sa puwestong nasa kanang bahagi; pinananatili nito ang larawang spatial nang hindi nagiging pilit ang “mula sa iyong kanan.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Kasama ng נגשׁ, ipinahihiwatig ng אֶל ang pagkilos papalapit sa kausap; natural itong isinasama sa pariralang “lalapit sa iyo.”
- source_word: לֹא יִגָּשׁ
  choice: hindi iyon lalapit
  rationale: Walang tahasang simuno sa Hebreo. Ang “iyon” ay di-tiyak na pagtukoy sa banta o kapahamakang nasa konteksto, at ang “lalapit” ay tuwirang nagpapahayag ng paglapit nang hindi dinaragdagan ang diwa ng pag-abot o pananakit.
theological_decisions:
- issue: Di-tahasang simuno ng huling sugnay
  choice: Ginamit ang di-tiyak na “iyon,” na tumutukoy sa banta o kapahamakang nasa konteksto.
  alternative: Tukuyin ito nang mas tiyak bilang “salot” o “kapahamakan,” o isaayos ang pangungusap upang walang hayag na simuno.
  rationale: Hindi pinapangalanan ng talata ang simuno. Ang “iyon” ay nagbibigay ng natural na Tagalog habang iniiwasang paliitin ang kahulugan sa isang tiyak na uri ng panganib.
- issue: Aspekto o modalidad ng יִפֹּל
  choice: “Maaaring mabuwal,” bilang posibilidad.
  alternative: “Mabubuwal,” bilang tiyak na pangyayari sa hinaharap.
  rationale: Pinahihintulutan ng Hebrew imperfect sa tulang ito ang modal o panghinaharap na pagbasa. Inilalagay sa pangunahing teksto ang modal na pagbasa at itinatala sa talababa ang alternatibo upang mapanatili ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mabuwal” upang mapanatili ang bigat at larawang patula ng pagkahandusay, at “sa kanan mo” bilang mas likas na anyo kaysa “sa iyong kanang kamay.”
