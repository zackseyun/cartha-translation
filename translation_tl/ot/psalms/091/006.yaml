  text: מִ֭/דֶּבֶר בָּ/אֹ֣פֶל יַהֲלֹ֑ךְ מִ֝/קֶּ֗טֶב יָשׁ֥וּד צָהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/006.yaml
  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: tl
  text: 'ni sa salot na gumagala sa dilim,[a]

    ni sa kapahamakang nananalanta sa katanghaliang-tapat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakahahawang sakit” sa halip na “salot,” at maaaring “nakamamatay na salot” sa halip na “kapahamakan.” Gumagamit ang Hebreo ng magkatulad na mga salitang patula para sa mapaminsalang panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: salot
  rationale: Karaniwang tumutukoy sa nakamamatay at laganap na sakit o plague. Ang “salot” ay malinaw, natural, at angkop sa marangal na wikang patula.
- source_word: בָּאֹפֶל
  choice: sa dilim
  rationale: Pinananatili ang larawan ng matinding kadiliman at ang kaibahan nito sa katanghaliang-tapat.
- source_word: יַהֲלֹךְ
  choice: gumagala
  rationale: Pinananatili ang personipikasyon ng salot bilang panganib na kumikilos sa dilim; mas natural sa Filipino kaysa sa literal na “lumalakad” sa kontekstong ito.
- source_word: קֶּטֶב
  choice: kapahamakan
  rationale: 'Malawak ang saklaw ng salitang Hebreo: maaari itong tumukoy sa pagkawasak o nakamamatay na salot. Hindi nililimitahan ng “kapahamakan” ang larawan sa sakit lamang.'
- source_word: יָשׁוּד
  choice: nananalanta
  rationale: Ipinahahayag ang marahas at malawakang pamiminsala habang nananatiling natural at masigla sa modernong Filipino.
- source_word: צָהֳרָיִם
  choice: sa katanghaliang-tapat
  rationale: Tumpak na tumutukoy sa tanghaling maliwanag at malinaw na ipinapakita ang patulang kaibahan sa dilim.
- source_word: מִן
  choice: ni sa
  rationale: Sa pagpapatuloy ng talaan sa Awit 91:5–6, ipinahahayag nito ang pagliligtas mula sa magkahanay na panganib. Ang “ni sa” ay likas na nagdurugtong sa naunang talata.
theological_decisions:
- issue: Kung ang קֶטֶב ay tiyak na isa ring uri ng salot
  choice: kapahamakan
  alternative: nakamamatay na salot
  rationale: Pinananatili ang tunay na luwag ng kahulugan at ang patulang paralelismo nang hindi ipinapalagay na sakit lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang personipikasyon at ang kaibahan ng dilim at katanghaliang-tapat.
