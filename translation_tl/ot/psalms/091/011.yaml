  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: tl
  text: 'Sapagkat mag-uutos siya sa kanyang mga anghel tungkol sa iyo[a],

    upang ingatan ka[b] sa lahat ng iyong mga lakad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa iyo.” Maaaring tumukoy ang Hebreong kayarian kapwa sa pakinabang ng isang tao at sa bagay na may kinalaman sa kanya.
    reason: lexical_alternative
  - marker: b
    text: O “bantayan ka” o “pangalagaan ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang katiyakan at pinananatili ang paliwanag na daloy ng tula.
- source_word: מַלְאָכָיו
  choice: kanyang mga anghel
  rationale: Bagaman maaari ring mangahulugang mga sugo, ang konteksto ng Awit 91 ay tumutukoy sa mga makalangit na nilalang na inuutusang mangalaga.
- source_word: יְצַוֶּה
  choice: uutusan
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagbibigay ng utos; likas sa Filipino ang hulma na ‘uutusan niya ang kanyang mga anghel.’
- source_word: לָּךְ
  choice: hinggil sa iyo
  rationale: Ipinahihiwatig ng parirala ang taong saklaw o pakay ng utos, hindi ang pinatutungkulan ng pagsasalita. Pinananatili ng ‘hinggil sa iyo’ ang di-tiyak na pagitan ng reference at benefit.
- source_word: לִשְׁמָרְךָ
  choice: upang ingatan ka
  rationale: Ipinapahayag ng infinitive ang layunin ng utos at ang aktibong pag-iingat o pagbabantay sa gitna ng panganib.
- source_word: בְּכָל
  choice: sa lahat ng
  rationale: Tuwirang pinananatili ang saklaw na walang ibinubukod.
- source_word: דְּרָכֶיךָ
  choice: iyong lakad
  rationale: Ang ‘lakad’ ay likas na metapora sa Filipino para sa mga landas at takbo ng buhay, habang nananatiling malapit sa lawak ng Hebreong salita.
theological_decisions:
- issue: Ang tinutukoy ng ikatlong panauhang isahan sa ‘uutusan niya’
  choice: Ang Diyos ang uutusan sa kanyang mga anghel na ingatan ang kinakausap.
  alternative: Iwanang walang tahasang pangalan ang simuno, gaya ng nasa Hebreo.
  rationale: Malinaw sa konteksto ng awit na ang Diyos ang simuno, ngunit pinanatili sa mismong salin ang panghalip na ‘niya’ upang hindi magdagdag ng pangalang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘hinggil sa iyo’ upang mapanatili ang pormal na ugnayan ng utos at ng taong saklaw nito; ang mas likas ngunit bahagyang mas interpretatibong ‘para sa iyo’ ay inilagay sa talababa. Ang ‘iyong lakad’ ay nagpapanatili sa metaporang maaaring tumukoy kapwa sa literal na paglalakbay at sa takbo ng buhay.
