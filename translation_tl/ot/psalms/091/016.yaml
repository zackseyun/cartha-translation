  text: אֹ֣רֶךְ יָ֭מִים אַשְׂבִּיעֵ֑/הוּ וְ֝/אַרְאֵ֗/הוּ בִּֽ/ישׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: tl
  text: Bubusugin ko siya ng mahabang buhay, at ipakikita ko sa kanya ang pagliligtas ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kaligtasan ko.” Ang salitang Hebreo ay maaaring tumukoy sa pagsagip mula sa panganib at sa kaligtasan sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: mahabang buhay
  rationale: Literal na ‘haba ng mga araw,’ ngunit ang likas at malinaw na katumbas sa modernong Tagalog ay ‘mahabang buhay.’ Nananatili rito ang diwa ng mahabang panahon ng pamumuhay.
- source_word: אַשְׂבִּיעֵהוּ
  choice: Bubusugin ko siya
  rationale: Ang Hiphil ng שׂבע ay nangangahulugang papupunuin o bibigyang-kasiyahan ang isang tao. Ang ‘bubusugin’ ay nagpapanatili sa matingkad na larawan ng Hebreo at ang mahabang buhay ang bagay na ipinambubusog.
- source_word: וְאַרְאֵהוּ
  choice: at ipakikita ko sa kanya
  rationale: Ang causative na anyo ng ראה ay ‘ipakita’ o ‘pangyaring makita.’ Malinaw na pinananatili ng salin ang pagkilos ng Diyos bilang siyang nagpapakita.
- source_word: בִּישׁוּעָתִי
  choice: ang pagliligtas ko
  rationale: Ang יְשׁוּעָה ay maaaring tumukoy sa pagsagip mula sa panganib at sa mas malawak na kaligtasan. Ang ‘pagliligtas ko’ ay natural sa Tagalog at pinananatiling bukas ang saklaw ng salita.
theological_decisions:
- issue: Saklaw ng יְשׁוּעָה sa pangwakas na pangako ng awit
  choice: pagliligtas ko
  alternative: kaligtasan ko
  rationale: Sa konteksto ng Awit 91, kitang-kita ang kongkretong pagsagip ng Diyos, ngunit maaari ring magkaroon ng mas malawak na kahulugan ang salita. Ang ‘pagliligtas’ ay hindi naglilimita rito sa isang tiyak na panganib, at ang talababa ay nagpapanatili sa alternatibong ‘kaligtasan.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang ‘bubusugin’ upang mapanatili ang matalinghagang lakas ng Hebreo; ang ‘mahabang buhay’ ay mas natural kaysa sa literal na ‘haba ng mga araw.’
