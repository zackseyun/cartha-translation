  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: tl
  text: Sapagkat ikaw[a], Yahweh, ang aking kanlungan; ginawa mong tahanan ang Kataas-taasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, ayon sa isang karaniwang pagkaunawa sa mahirap na Hebreo: “Sapagkat sinabi mo, ‘Si Yahweh ang aking kanlungan,’ at ginawa mong tahanan ang Kataas-taasan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang sanhi o batayang ipinahihiwatig ng pangatnig at ang marangal na himig ng salmo.
- source_word: אַתָּה
  choice: ikaw
  rationale: Hayagang pinananatili ang ikalawang panauhang pang-isahan at ang diin nito sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מַחְסִי
  choice: ang aking kanlungan
  rationale: Ang “kanlungan” ay natural at tumpak na salitang Filipino para sa lugar ng proteksiyon, lalo na sa pananalita ng mga salmo.
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Pinananatili bilang banal na titulong tumutukoy sa Diyos.
- source_word: שַׂמְתָּ
  choice: ginawa mong
  rationale: Ipinahahayag ang kahulugang gawing o ituring na tahanan ang tinutukoy, sa natural na ayos ng Filipino.
- source_word: מְעוֹנֶךָ
  choice: tahanan
  rationale: Malinaw na tumutukoy sa tirahan at iniiwasang ulitin ang “kanlungan”; ang panghalip na “mong” sa pandiwa ang naghahayag ng ‘iyong.’
theological_decisions:
- issue: Sintaks ng nagsasalita at kinakausap sa Awit 91:9
  choice: 'Direktang pakikipag-usap kay Yahweh sa unang sugnay, na sinusundan ng pahayag sa ikalawang panauhan: “Sapagkat ikaw, Yahweh, ang aking kanlungan; ginawa mong tahanan ang Kataas-taasan.”'
  alternative: “Sapagkat sinabi mo, ‘Si Yahweh ang aking kanlungan,’ at ginawa mong tahanan ang Kataas-taasan.”
  rationale: Walang hayagang pandiwang “sinabi” sa Masoretikong teksto. Pinananatili ng pangunahing salin ang mismong pagkakasulat at ang mahirap na paglipat mula “aking” tungo sa “mong,” samantalang inilalagay sa talababa ang karaniwang alternatibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kanlungan” at “tahanan” bilang malinaw at karaniwang mga salita, at pinanatili ang tunay na kahirapan ng sintaks sa halip na tahimik na dagdagan ng pandiwang wala sa Hebreo.
