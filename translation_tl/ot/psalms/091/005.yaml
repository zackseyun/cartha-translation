id: PSA.91.5
reference: Psalms 91:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: tl
  text: Hindi ka matatakot sa lagim ng gabi[a][b], ni sa palasong lumilipad sa araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matinding pangamba” sa halip na “lagim.”
    reason: lexical_alternative
  - marker: b
    text: O “Hindi mo kailangang matakot,” upang idiin ang diwa ng katiyakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: hindi ka matatakot
  rationale: Ang Qal imperfect na may לֹא ay likas na naghahayag dito ng katiyakan o pangako, hindi kinakailangang isang utos. Pinananatili ng hinaharap na anyong Filipino ang diwang ito.
- source_word: פַּחַד
  choice: lagim
  rationale: Ipinahihiwatig ng pangngalan ang isang bagay na nagdudulot ng matinding takot o pangamba, hindi lamang ang damdamin ng pagkatakot. Ang “lagim” ay natural at marangal na katumbas sa makatang konteksto.
- source_word: לָיְלָה
  choice: ng gabi
  rationale: Natural na ipinapahayag sa Filipino ang ugnayan bilang “lagim ng gabi,” habang pinananatili ang pagtutunggali ng gabi at araw.
- source_word: חֵץ
  choice: palaso
  rationale: Ang karaniwang kahulugan ay literal na palaso. Pinananatili ang kongkretong larawan sa halip na ipaliwanag ito bilang isang pangkalahatang panganib.
- source_word: יָעוּף
  choice: lumilipad
  rationale: Tuwirang inilalarawan ng Qal imperfect ng עוּף ang paglipad; ang participial na “lumilipad” ay natural na panuring sa Filipino.
- source_word: יוֹמָם
  choice: sa araw
  rationale: Ang adberbio ay nangangahulugang sa panahon ng araw at natural na itinatambal sa “ng gabi.”
- source_word: מִן ... מִן
  choice: sa ... ni sa
  rationale: Ipinakikilala ng inuulit na pang-ukol ang mga banta na hindi katatakutan. Sa Filipino, natural itong naipapahayag sa pandiwang “matatakot sa” at sa koordinasyong “ni sa.”
theological_decisions:
- issue: Kung utos o pangako/katiyakan ang pahayag
  choice: 'Pangako o katiyakan: “Hindi ka matatakot”'
  alternative: 'Utos: “Huwag kang matakot”'
  rationale: Ang לֹא na kasama ng imperfect sa makatang kontekstong ito ay pinakamalinaw na mababasa bilang katiyakan tungkol sa taong nasa ilalim ng pag-iingat ng Diyos. Hindi ito ginagawang tahasang utos, bagaman maaaring madama ang kaugnay na diwa ng pagpapatatag.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “palaso” upang mapanatili ang kongkretong larawang Hebreo, at “Hindi ka matatakot” upang maipahayag ang pangakong himig nang hindi ito ginagawang utos.
