  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: tl
  text: Sa sarili mong mga mata, magmamasid ka lamang at makikita mo ang kabayarang matatanggap ng masasama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang ganting matatanggap ng masasama” o “ang parusang matatanggap ng masasama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: lamang
  rationale: Naglilimita at nagbibigay-diin na ang kausap ay makakakita lamang sa sinapit ng masasama, hindi makikibahagi rito.
- source_word: בְּעֵינֶיךָ
  choice: ng iyong mga mata
  rationale: Pinananatili ang larawan sa Hebreo ng tuwirang pagkakita gamit ang sariling mga mata nang hindi nagdaragdag ng salitang wala sa teksto.
- source_word: תַבִּיט
  choice: Titingnan mo
  rationale: Karaniwan at malinaw na katumbas ng pandiwang nangangahulugang tumingin o magmasid.
- source_word: וְשִׁלֻּמַת
  choice: ang ganti
  rationale: Ipinahahayag ang ideya ng nararapat na kabayaran o balik nang hindi labis na tinutukoy kung paano ito isasagawa.
- source_word: רְשָׁעִים
  choice: sa masasama
  rationale: Natural na makabagong Tagalog para sa pangkat ng mga taong inilalarawan bilang masama.
- source_word: תִּרְאֶה
  choice: at makikita mo
  rationale: Tuwirang inililipat ang payak na pandiwa para sa pagkakita at pinananatili ang pagkakaugnay nito sa naunang pandiwa.
theological_decisions:
- issue: Uri ng sasapitin ng masasama
  choice: ang ganti sa masasama
  alternative: ang parusa sa masasama; ang kabayarang tatanggapin ng masasama
  rationale: Mas malawak ang diwa ng pangngalang Hebreo kaysa sa tahasang 'parusa.' Pinananatili ng 'ganti' ang diwa ng nararapat na balik o kabayaran nang hindi nilulutas ang likas na lawak ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng mga pandiwa ng pagtingin at pagkakita, gayundin ang larawan ng mga mata sa Hebreo.
