id: PSA.91.14
reference: Psalms 91:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: tl
  text: Dahil kumakapit siya sa akin[a], ililigtas ko siya; ilalagay ko siya sa mataas at ligtas na lugar[b], sapagkat kilala niya ang aking pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dahil iniibig niya ako” o “Dahil itinuon niya sa akin ang kaniyang pagmamahal.” Ang pandiwang Hebreo ay nagpapahiwatig ng matibay na pagkakaugnay o pagkapit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itataas ko siya sa ligtas na lugar” o “poprotektahan ko siya.” Ang pandiwang Hebreo ay naglalarawan ng paglalagay sa isang mataas at hindi madaling maabot na lugar, kaya ligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Dahil / sapagkat
  rationale: Ipinananatili ng dalawang salitang ito ang sanhi o batayan ng ipinangakong pagkilos ng Diyos. Ginamit ang bahagyang pag-iiba upang maging natural sa makabagong Tagalog.
- source_word: בִי חָשַׁק
  choice: kumakapit siya sa akin
  rationale: Ipinahahayag nito ang matibay na pagkakaugnay at pagmamahal sa Diyos, at hindi lamang isang panandaliang damdamin.
- source_word: וַאֲפַלְּטֵהוּ
  choice: ililigtas ko siya
  rationale: Malinaw at likas na salin ito ng ipinangakong pagliligtas mula sa panganib.
- source_word: אֲשַׂגְּבֵהוּ
  choice: ilalagay ko siya sa mataas at ligtas na lugar
  rationale: Pinananatili nito ang larawang Hebreo ng paglalagay sa isang mataas at hindi madaling maabot na lugar, habang nililinaw ang diwa ng kaligtasan.
- source_word: יָדַע
  choice: kilala niya
  rationale: Ang pandiwa ay tumutukoy sa personal at may-kaugnayang pagkilala, hindi lamang sa kaalamang pangkaisipan.
- source_word: שְׁמִי
  choice: aking pangalan
  rationale: Pinananatili ang tahasang larawan ng orihinal; maaaring saklawin ng 'pangalan' ang nahayag na pagkatao at katangian ng Diyos nang hindi iyon ipinapasok sa pangunahing teksto.
theological_decisions:
- issue: Matibay na pagkakaugnay sa Diyos sa בִי חָשַׁק
  choice: kumakapit siya sa akin
  alternative: iniibig niya ako; itinuon niya sa akin ang kaniyang pagmamahal
  rationale: Pinananatili ng 'kumakapit' ang tensiyon sa pagitan ng pagmamahal at matatag na pagkapit o debosyon, nang hindi nililimitahan ang pandiwa sa damdamin lamang.
- issue: Larawan ng proteksiyon sa אֲשַׂגְּבֵהוּ
  choice: ilalagay ko siya sa mataas at ligtas na lugar
  alternative: poprotektahan ko siya; itataas ko siya
  rationale: Pinananatili ang patulang larawan ng seguridad sa isang mataas at hindi madaling maabot na lugar, sa halip na gawing abstraktong 'poprotektahan' lamang o ipakahulugang pagpaparangal ang 'itataas.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang 'kumakapit' ay sadyang nagpapanatili sa kongkretong larawan ng matibay na attachment, at ang 'mataas at ligtas na lugar' ay nagpapanatili sa metapora ng proteksiyon sa pamamagitan ng kaitaasan.
