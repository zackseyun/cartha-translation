  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: tl
  text: Ang nananahan[a] sa kanlungan[b] ng Kataas-taasan ay manunuluyan[c] sa lilim ng Makapangyarihan sa lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang taong nananahan” o “Sinumang nananahan.” Panlalaking isahan ang anyong gramatikal sa Hebreo, ngunit maaari itong tumukoy bilang kinatawan sa sinumang tao.
    reason: lexical_alternative
  - marker: b
    text: O “sa lihim na dako” o “sa tagong kanlungan.”
    reason: lexical_alternative
  - marker: c
    text: O “mananatili” o “magpapalipas ng gabi.” Ipinahihiwatig ng pandiwang Hebreo ang pagtuloy nang magdamag at, sa mas malawak na diwa, ang patuloy na pananatili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Ang nananahan
  rationale: Ang pandiwaring Hebreo ay ginagamit bilang pangngalan at tumutukoy sa taong palagi o matatag na naninirahan. Ang “nananahan” ay mas angkop sa tulang panrelihiyon at mas malinaw sa diwang patuloy na pananatili kaysa sa literal na “nakaupo.” Hindi minarkahan ng kasarian ang Tagalog, bagaman panlalaking isahan ang anyong Hebreo at maaari itong kumatawan sa sinumang tao.
- source_word: בְּסֵתֶר
  choice: sa kanlungan
  rationale: Ang סֵתֶר ay isang tago o ligtas na dako. Ipinahahayag ng “kanlungan” ang proteksiyon sa natural na modernong Tagalog, samantalang inilalagay sa talababa ang mas tahasang diwa ng pagiging lihim o tago.
- source_word: עֶלְיוֹן
  choice: ng Kataas-taasan
  rationale: Isang titulong banal na nangangahulugang ang pinakamataas. Ang “Kataas-taasan” ay marangal, malinaw, at kinikilalang katumbas sa Tagalog.
- source_word: בְּצֵל
  choice: sa lilim
  rationale: 'Tuwirang ipinahahayag ng “sa lilim” ang larawan ng Hebreo: pagiging malapit at nasa ilalim ng proteksiyon ng Diyos.'
- source_word: שַׁדַּי
  choice: ng Makapangyarihan sa lahat
  rationale: Isinalin ang titulong שַׁדַּי ayon sa kinagawiang kahulugang “Makapangyarihan sa lahat” upang maging malinaw sa modernong mambabasa sa halip na baybayin lamang bilang Shaddai.
- source_word: יִתְלוֹנָן
  choice: ay manunuluyan
  rationale: Ang pandiwa mula sa לון ay pangunahing tumutukoy sa pagtuloy o pagpapalipas ng gabi at maaari ring mangahulugang pananatili. Pinananatili ng “manunuluyan” ang kongkretong larawan at ang kaagapay nitong ugnayan sa “nananahan.”
theological_decisions:
- issue: Ang panlalaking isahang kalahok bilang kinatawan
  choice: Ang nananahan
  alternative: Ang taong nananahan / Sinumang nananahan
  rationale: Panlalaking isahan ang anyong Hebreo ngunit maaari itong gamitin bilang kinatawan. Dahil hindi nagpapakita ng kasarian ang likas na anyong Tagalog na “ang nananahan,” hindi sapilitang idinagdag ang “lalaki” o ang panghalip na “siya”; ipinaliliwanag sa talababa ang gramatikal na anyo at lawak ng pagtukoy.
- issue: Pagsasalin sa titulong שַׁדַּי
  choice: Makapangyarihan sa lahat
  alternative: Shaddai
  rationale: Isinalin bilang titulo upang maipahayag ang kahulugan sa ordinaryong mambabasa, nang hindi ginagawang pangalang transliterado ang anyo o nagdaragdag ng natatanging doktrinal na paliwanag.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikli at balanseng anyo ng tulang Hebreo: “nananahan/kanlungan” na kaagapay ng “manunuluyan/lilim.” Ginamit ang mga titulong “Kataas-taasan” at “Makapangyarihan sa lahat” nang walang dagdag na paliwanag sa mismong talata.'
