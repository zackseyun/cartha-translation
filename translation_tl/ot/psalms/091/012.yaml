  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: tl
  text: Bubuhatin ka nila sa kanilang mga kamay[a], upang hindi tumama ang paa mo sa bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “dadalhin ka nila” o “iaangat ka nila.” Literal, “sa kanilang mga palad/kamay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: Sa kanilang mga kamay
  rationale: Ang כַּפַּיִם ay anyong dual ng כַּף at maaaring tumukoy sa mga palad o mga kamay. Mas natural sa modernong Filipino ang “sa kanilang mga kamay,” habang nananatili ang larawan ng pag-alalay.
- source_word: יִשָּׂאוּנְךָ
  choice: bubuhatin ka nila
  rationale: Ang נָשָׂא ay maaaring mangahulugang buhatin, dalhin, o alalayan. Ang “bubuhatin” ay malinaw na nagpapahayag ng pag-angat at pagsuporta nang hindi nagdaragdag ng di-tiyak na direksiyon.
- source_word: פֶּן
  choice: upang hindi
  rationale: Nagpapakilala ang פֶּן ng negatibong layunin o kinalabasang iniiwasan. Ang “upang hindi” ay natural at tumpak sa kasalukuyang Filipino.
- source_word: תִּגֹּף
  choice: tumama
  rationale: Mula sa נָגַף, inilalarawan dito ang pagkabangga o pagtama ng paa. Ang “tumama” ay tuwiran at hindi ipinapalagay na matitisod o mabubuwal ang tao.
- source_word: בָּאֶבֶן
  choice: sa isang bato
  rationale: Sa konstruksyong ito, ang בְּ ay tumutukoy sa bagay na tatamaan. Walang tiyak na artikulo sa diwa, kaya ang “isang bato” ay angkop.
- source_word: רַגְלֶךָ
  choice: ang paa mo
  rationale: Isahan ang רֶגֶל at may hulaping pangalawang panauhang panlalaki na isahan. Natural din sa Filipino ang isahang “paa” sa pahayag na ito.
theological_decisions:
- issue: Tradisyonal na pananalita laban sa makabagong saling nakabatay sa Hebreo
  choice: Sa kanilang mga kamay ay bubuhatin ka nila
  alternative: Aalalayan ka nila sa kanilang mga kamay
  rationale: Pinananatili ng napiling salin ang konkretong larawan ng pagbuhat na nasa pandiwang נָשָׂא at iniiwasang gawing mas abstrakto ang proteksiyon.
- issue: Ugnayan ng פֶּן sa naunang pangako
  choice: upang hindi tumama
  alternative: nang hindi tumama / baka tumama
  rationale: Ang “upang hindi” ay nagpapanatili sa negatibong layunin o pag-iwas na ipinahihiwatig ng פֶּן, nang hindi nagpapasya kung ito ay dapat unawain lamang bilang layunin o bilang kinalabasang iniiwasan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga kamay” sa halip na mas literal na “mga palad” dahil mas natural ito sa konteksto ng pagbuhat, at pinanatili sa talababa ang saklaw ng kahulugan ng pandiwa.
