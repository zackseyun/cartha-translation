  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: tl
  text: Sinasabi ko kay Yahweh[a], “Aking kanlungan at aking tanggulan, aking Diyos; sa kaniya ako nagtitiwala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Sinasabi ko
  rationale: Ang Qal imperfect na unang panauhang isahan ay maaaring kasalukuyan o hinaharap; sa patuloy na pagpapahayag ng pagtitiwala sa tulang ito, natural ang kasalukuyang “Sinasabi ko.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay tumutukoy rito sa kinakausap ng salmista, kaya “kay Yahweh,” hindi “tungkol kay Yahweh.”
- source_word: יהוה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מַחְסִי
  choice: aking kanlungan
  rationale: Ang מַחְסֶה ay ligtas na dakong masisilungan; malinaw at karaniwan sa makabagong Filipino ang “kanlungan.”
- source_word: וּמְצוּדָתִי
  choice: at aking tanggulan
  rationale: Ang מְצוּדָה ay isang matibay na lugar ng pagtatanggol; pinananatili ng “tanggulan” ang larawang militar at mahusay itong kapares ng “kanlungan.”
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: 'Tuwirang ipinahahayag ng hulaping unang panauhan ang personal na ugnayan: “aking Diyos.”'
- source_word: אֶבְטַח בּוֹ
  choice: na pinagtitiwalaan ko
  rationale: Ipinahahayag ng בטח ang matatag na pagtitiwala. Ginagawang likas sa Filipino ng sugnay na panuring ang literal na “sa kaniya ako nagtitiwala” habang pinananatili ang reperensiya sa “aking Diyos.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh”; inilalahad sa talababa ang tradisyonal na salin upang maging malinaw sa mambabasa.
- issue: Panahunan ng אֹמַר at אֶבְטַח
  choice: 'Kasalukuyang pagpapahayag: “Sinasabi ko” at “pinagtitiwalaan ko”'
  alternative: 'Panghinaharap: “Sasabihin ko” at “pagtitiwalaan ko”'
  rationale: Pinahihintulutan ng mga imperfect na anyo ang higit sa isang aspektuwal na pagbasa. Sa konteksto, ang kasalukuyang anyo ay likas na nagpapahayag ng nagpapatuloy at matatag na pagtitiwala nang hindi nagdaragdag ng di-kinakailangang diin sa hinaharap.
translation_notes:
  register: Makabago, marangal, at payak na Filipino. Pinanatili ang maikli at makatang serye ng mga pariralang nominal sa Hebreo sa halip na idagdag ang “Ikaw ang” o “Siya ang,” na maaaring tahasang magpasya sa estruktura at pananaw na hindi ganap na ipinapahayag ng pinagmulang teksto.
