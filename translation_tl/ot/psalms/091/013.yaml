  source_fidelity: 'Tapat ang salin sa paralelismong Hebreo at sa dalawang antas ng pandiwa: ang “Tatapak ka” para sa תִּדְרֹךְ at ang mas mariing “yuyurakan mo” para sa תִּרְמֹס. Wasto ang “leon,” “kobra,” at “batang leon.” Ang “serpiyente” ay isang katanggap-tanggap na kontekstuwal na salin ng תַנִּין sa talaan ng mga hayop sa lupa, habang pinananatili ng talababa ang alternatibong “dragon.”'
