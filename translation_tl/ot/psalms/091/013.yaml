  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: tl
  text: Tatapak ka sa leon at sa kobra[a]; yuyurakan mo ang batang leon at ang serpiyente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa tradisyon, “asp.”
    reason: lexical_alternative
  - marker: b
    text: O “dragon.” Sa ibang konteksto, ang salitang Hebreo ay maaaring tumukoy sa isang malaking reptilya o nilalang-dagat; dito, nababagay ang “serpiyente” sa talaan ng mapanganib na mga hayop sa lupa.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: sa
  rationale: Ipinahihiwatig ng pang-ukol ang bagay na tatapakan; natural sa Filipino ang pandiwang “tatapak” na sinusundan ng “sa.”
- source_word: שַׁחַל
  choice: leon
  rationale: Makatulang tawag ito sa leon. Malinaw at likas sa kasalukuyang Filipino ang “leon,” habang sapat nang ipinakikita ng konteksto ang panganib nito.
- source_word: פֶתֶן
  choice: kobra
  rationale: Tumutukoy ito sa makamandag na ahas, na tradisyonal na tinutumbasan ng asp o cobra. Mas madaling makilala ng mga modernong mambabasa ang “kobra.”
- source_word: תִּדְרֹךְ
  choice: tatapak ka
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki na isahan ay nangangahulugang pagtapak sa ibabaw ng isang bagay. Natural at tuwiran sa Filipino ang “tatapak ka.”
- source_word: תִּרְמֹס
  choice: yuyurakan mo
  rationale: Mas mariin ito kaysa sa naunang pandiwa at nagsasaad ng sapilitang pagsupil sa pamamagitan ng pagyurak. Pinananatili ng “yuyurakan” ang pag-igting ng paralelismo.
- source_word: כְּפִיר
  choice: batang leon
  rationale: Karaniwang tumutukoy sa isang bata ngunit malakas nang leon, hindi lamang sa munting anak nito. Tumpak at malinaw ang “batang leon.”
- source_word: תַנִּין
  choice: serpiyente
  rationale: Maaaring tumukoy ang salita sa malaking reptilya, ahas, dragon, o nilalang-dagat depende sa konteksto. Sa talaang ito ng mapanganib na mga hayop sa lupa, ang “serpiyente” ang pinakamalapit na pagbasa nang hindi inaalis ang alternatibong “dragon” sa talababa.
theological_decisions:
- issue: Kung ang תַנִּין ay dapat unawain bilang mitolohikal na “dragon” o zoolohikal na “serpiyente”
  choice: serpiyente
  alternative: dragon
  rationale: Kaagapay ito ng leon, kobra, at batang leon sa isang listahan ng mapanganib na mga nilalang na malalampasan ng taong iniingatan. Kaya mas nababagay sa agarang konteksto ang zoolohikal na pagbasa. Gayunman, tunay na saklaw ng salitang Hebreo ang “dragon” o malaking nilalang, kaya pinanatili iyon bilang alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang “tatapak” at “yuyurakan” upang mapanatili ang pag-igting ng magkatulad na mga linya. Ang “serpiyente” ay bahagyang mas pampanitikan kaysa “ahas” at tumutugma sa malaki o nakatatakot na nilalang na ipinahihiwatig ng תַנִּין.
