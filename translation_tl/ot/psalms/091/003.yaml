source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: tl
  text: Sapagkat siya ang magliligtas sa iyo mula sa bitag ng manghuhuli ng ibon, mula sa mapaminsalang salot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “salot ng kapahamakan”; maaari ring “nakamamatay na salot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang paliwanag o batayan ng naunang katiyakan; likas sa Tagalog ang “Sapagkat” bilang pang-ugnay.
- source_word: הוּא
  choice: siya ang
  rationale: Ang hiwalay na panghalip sa Hebreo ay may diin; naipapahayag ito nang natural sa Tagalog sa hulma na “siya ang.”
- source_word: יַצִּילְךָ
  choice: magliligtas sa iyo
  rationale: Ang Hiphil ng נצל ay tumutukoy sa pagliligtas o pagsagip mula sa panganib; dignified at karaniwan ang “magliligtas.”
- source_word: מִפַּח
  choice: mula sa bitag
  rationale: Ang פַּח ay bitag o silo. Mas malinaw sa karaniwang modernong Tagalog ang “bitag,” habang pinananatili ang konkretong larawan.
- source_word: יָקוּשׁ
  choice: ng manghuhuli ng ibon
  rationale: Tumutukoy ang salita sa taong naglalagay ng bitag, lalo na upang manghuli ng mga ibon. Ganap at madaling maunawaan ang pariralang ito sa Tagalog.
- source_word: מִדֶּבֶר
  choice: mula sa salot
  rationale: Ang דֶּבֶר ay malubha at malawakang sakit o peste. Ang “salot” ay maikli, matimbang, at angkop sa konteksto.
- source_word: הַוּוֹת
  choice: mapaminsala
  rationale: Ipinahihiwatig ng anyong ito ang kapahamakan, pagkawasak, o matinding pinsala. Ang “mapaminsala” ay natural na panuring sa “salot” at hindi nito nililimitahan ang diwa sa kamatayan lamang.
theological_decisions:
- issue: Kalikasan ng mga panganib na binabanggit
  choice: Pinanatili ang mga konkretong larawan ng bitag at salot nang hindi ipinapasiyang literal lamang o sagisag lamang ang mga ito.
  alternative: Ituring ang mga panganib bilang pisikal lamang, o bilang espirituwal at metaporikal lamang.
  rationale: Tunay at konkretong panganib ang tinutukoy ng mga salitang Hebreo, ngunit sa patulang konteksto maaari rin silang kumatawan sa mas malawak na saklaw ng proteksiyon ng Diyos.
- issue: Diwa ng הַוּוֹת bilang panuring sa salot
  choice: mapaminsalang salot
  alternative: nakamamatay na salot; salot ng kapahamakan
  rationale: Pinananatili ng “mapaminsala” ang lawak ng diwang pagkawasak o kapahamakan, samantalang ang “nakamamatay” ay maaaring magtakda ng mas makitid na kahulugan kaysa sa hinihingi ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “siya ang” upang madama ang diin ng panghalip sa Hebreo, at “manghuhuli ng ibon” sa halip na isang makaluma o teknikal na katawagan.
