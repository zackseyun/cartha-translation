  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: tl
  text: Tatawag siya sa akin, at sasagutin ko siya; kasama niya ako sa kagipitan. Ililigtas ko siya at parararangalan ko siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Tatawag siya sa akin
  rationale: Ang קרא na may personal na layon sa konteksto ng panalangin ay nangangahulugang tumawag o dumulog sa Diyos. Likas at malinaw sa modernong Tagalog ang “tatawag siya sa akin.”
- source_word: וְאֶעֱנֵהוּ
  choice: at sasagutin ko siya
  rationale: Karaniwang kahulugan ng ענה rito ang sumagot o tumugon; tuwiran din nitong pinananatili ang ugnayan ng pagtawag at pagsagot.
- source_word: עִמּוֹ אָנֹכִי
  choice: Kasama niya ako
  rationale: Ang nauunang עִמּוֹ ay may diin. Pinananatili ng ayos na “Kasama niya ako” ang diing iyon nang natural sa Tagalog.
- source_word: בְצָרָה
  choice: sa gitna ng kagipitan
  rationale: Ang צָרָה ay tumutukoy sa kagipitan, matinding hirap, o panganib. Ang parirala ay malinaw at marangal, at ipinapakita ang presensiya ng Diyos habang nararanasan ang hirap.
- source_word: אֲחַלְּצֵהוּ
  choice: ililigtas ko siya
  rationale: Sa Piel, ang חלץ ay maaaring mangahulugang hanguin, sagipin, o iligtas mula sa panganib. Pinakamalawak at likas sa Tagalog ang “ililigtas.”
- source_word: וַאֲכַבְּדֵהוּ
  choice: at pararangalan
  rationale: Sa Piel, ang כבד ay nangangahulugang parangalan o luwalhatiin. Dahil tao ang layon, natural at hindi malabo sa teolohiya ang “pararangalan.”
theological_decisions:
- issue: Paglalahad ng mga pangako sa banal na pananalita nang hindi nagdaragdag ng mga kondisyong wala sa talata
  choice: 'Tuwirang pagkakasunod ng tugon ng Diyos: pagsagot, pakikisama sa kagipitan, pagliligtas, at pagpaparangal'
  alternative: Gawing tahasang nakasalalay ang mga pangako sa naunang katapatan ng tao
  rationale: Ipinahahayag ng Hebreo ang tugon ng Diyos sa tumatawag sa kaniya ngunit hindi nagdaragdag ng paliwanag o kondisyon sa talatang ito. Pinananatili ng salin ang pangako at tensiyong nasa teksto.
- issue: Kahulugan ng וַאֲכַבְּדֵהוּ kapag ang taong iniingatan ang layon
  choice: pararangalan
  alternative: luluwalhatiin
  rationale: Parehong saklaw ng כבד ang mga pagbasa, ngunit mas natural sa modernong Tagalog ang “pararangalan” kapag tao ang layon at hindi nito ipinahihiwatig na kapantay ng tao ang kaluwalhatian ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang diin ng Hebreo sa “Kasama niya ako” at iniwasan ang makaluma o labis na denominasyonal na pananalita.
