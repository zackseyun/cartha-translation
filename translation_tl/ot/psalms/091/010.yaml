  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: tl
  text: Walang kapahamakan[a] na sasapit sa iyo, at walang salot na lalapit sa iyong tolda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasamaan.”
    reason: lexical_alternative
  - marker: b
    text: O “tirahan”; maaaring tumukoy ang “tolda” sa tahanan o sambahayan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: sasapit
  rationale: Ang pandiwa ay tumutukoy sa isang bagay na mangyayari o darating sa isang tao. Likas at malinaw sa Filipino ang “sasapit” sa ganitong pangako ng pag-iingat.
- source_word: רָעָה
  choice: kapahamakan
  rationale: Sa konteksto, tumutukoy ito sa nakapipinsalang kasawian o panganib, hindi lamang sa moral na kasamaan. Pinananatili ng talababa ang mas literal na alternatibo.
- source_word: נֶגַע
  choice: salot
  rationale: Maaaring tumukoy ang salita sa isang matinding pinsala, sakit, o hampas. Ang “salot” ay angkop sa konteksto ng Awit 91 at nagpapanatili sa diwa ng mapaminsalang karamdaman o plaga.
- source_word: יִקְרַב
  choice: lalapit
  rationale: Tuwirang pinananatili nito ang larawang pangkalawakan ng isang panganib na hindi makalalapit.
- source_word: אָהֶל
  choice: tolda
  rationale: Ito ang kongkretong kahulugan ng salitang Hebreo. Maaaring kumatawan ang tolda sa tahanan o sambahayan, kaya ibinigay ang mas malawak na diwa sa talababa.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinahahayag nito ang direksiyon patungo sa kausap at likas na kaakibat ng “sasapit” sa Filipino.
theological_decisions:
- issue: Saklaw ng ipinangakong pag-iingat
  choice: Ihayag nang tuwiran at patula ang pangako ng pag-iingat ng Diyos, gaya ng nasa Hebreo, nang walang idinagdag na paliwanag tungkol sa lawak nito.
  alternative: Ipaliwanag ito bilang ganap at walang-pasubaling katiyakang hindi kailanman makararanas ng anumang pisikal na pagdurusa ang tapat na tao.
  rationale: Tuwiran ang pangako sa Hebreo, ngunit hindi dapat lutasin ng salin ang mas malawak na usaping teolohikal tungkol sa pagdurusa at providensiya na hindi tahasang tinatalakay ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “kapahamakan” at “sasapit” bilang natural na pares, habang pinanatili ang konkretong larawan ng “tolda” at ang maikli at tuwirang paralelismo ng Hebreo.
