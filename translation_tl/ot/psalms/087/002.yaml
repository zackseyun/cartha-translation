  text: Iniibig ni Yahweh ang mga pintuan ng Zion nang higit kaysa sa lahat ng tirahan ni Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “higit sa lahat ng tirahan ni Jacob.”
