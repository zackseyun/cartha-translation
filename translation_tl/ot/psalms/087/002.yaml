lexical_decisions:
- source_word: אֹהֵב
  choice: Iniibig
  rationale: Ang Qal participle ay gumaganap bilang pandiwa at nagpapahayag ng nagpapatuloy o pangkalahatang pag-ibig ni Yahweh. Likas at marangal sa Filipino ang “iniibig.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: שַׁעֲרֵי
  choice: ang mga pintuan
  rationale: Pinananatili ang kongkretong larawan ng maramihang “mga pintuan” ng Zion; hindi ito tahasang pinalitan ng interpretasyong “lungsod.”
- source_word: צִיּוֹן
  choice: Zion
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa modernong saling Filipino.
- source_word: מִכֹּל
  choice: nang higit kaysa sa lahat
  rationale: Ipinahahayag nito ang paghahambing na likas na diwa ng מִן kasunod ng pandiwa ng pagtatangi o pagpili.
- source_word: מִשְׁכְּנוֹת
  choice: mga tahanan
  rationale: Sa kontekstong ito, tumutukoy ito sa mga tirahan, hindi sa kultikong tabernakulo. Malinaw at pangkaraniwan ang “mga tahanan.”
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinananatili ang pangalang nasa Hebreo, kahit ginagamit ito nang kolektibo para sa bayan o mga lupain ng Israel.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pahambing na diwa ng מִכֹּל
  choice: nang higit kaysa sa lahat
  alternative: higit sa lahat
  rationale: Malinaw nitong ipinakikitang higit na iniibig ni Yahweh ang mga pintuan ng Zion kaysa sa iba pang mga tahanan ng Jacob, nang hindi nagdaragdag ng teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyong patula, ang kongkretong larawan ng mga pintuan, at ang kolektibong pangalang “Jacob.”
