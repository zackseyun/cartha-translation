translation:
  language: tl
  text: 'Salmo ng mga anak ni Kora; isang awit.[a]


    Ang pundasyon nito ay nasa mga banal na bundok.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Salmo para sa mga anak ni Kora; isang awit.” Maaaring magpahiwatig ang Hebreo ng pagkakaugnay o pagtatalaga, hindi lamang ng tuwirang pag-akda.
    reason: lexical_alternative
  - marker: b
    text: Walang tahasang binabanggit sa Hebreo kung ano ang tinutukoy ng “nito”; maaaring ipinahihiwatig ang Sion o Jerusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: ng mga anak ni Kora
  rationale: Ipinapahayag nito ang kaugnayan ng awit sa pangkat ng mga anak ni Kora nang hindi tahasang iginigiit ang personal na pagkakatha; maaari ring unawain ang ל־ bilang “para sa.”
- source_word: מִזְמוֹר שִׁיר
  choice: Awit …; isang awitin
  rationale: Parehong pinananatili ang dalawang katawagang Hebreo, mizmor at shir, habang gumagamit ng natural at marangal na pamagat sa Filipino.
- source_word: יְסוּדָתוֹ
  choice: Ang pundasyon nito
  rationale: Pinananatili ang panghalip na walang tahasang tinutukoy sa Hebreo at hindi basta nagpapasya kung ang ipinahihiwatig ay Sion/Jerusalem o ibang referent.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: nasa mga banal na bundok
  rationale: Natural na Filipino para sa literal na “sa mga bundok ng kabanalan,” na pinananatili ang maramihang anyo ng “mga bundok.”
theological_decisions:
- issue: Ang tinutukoy ng hulaping panghalip sa יְסוּדָתוֹ
  choice: Gumamit ng “nito” nang walang idinagdag na tahasang tinutukoy.
  alternative: “Ang pundasyon ng Sion/Jerusalem” o “Ang kanyang pundasyon.”
  rationale: Walang tahasang antecedent sa talata. Ang “nito” ay nagpapanatili sa tunay na kalabuan at umiiwas sa pagpapasok ng interpretasyong hindi binanggit mismo ng teksto.
- issue: Kaugnayan ng mga anak ni Kora sa awit
  choice: “ng mga anak ni Kora” na may paliwanag sa talababa.
  alternative: “para sa mga anak ni Kora.”
  rationale: Karaniwang anyo ito ng pamagat sa Filipino, ngunit nililinaw ng talababa na ang ל־ ay maaaring magpahiwatig ng pagkakaugnay o pagtatalaga sa halip na tuwirang pag-akda.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pamagat at ang bahagyang palaisipang paglipat sa linyang tungkol sa pundasyon, sapagkat wala ring tahasang antecedent sa Hebreo.
