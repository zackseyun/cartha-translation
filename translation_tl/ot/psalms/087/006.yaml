  naturalness: Mas natural ang “Bibilang si Yahweh” sa walang tahasang layon sa sugnay, at ang “Itong isa” ay natural na tumutukoy sa isang indibidwal nang hindi nagdaragdag ng pangngalang wala sa pinagmulan. Ang “mga bayan” ay maaaring mangahulugang mga pamayanan o bayan/town sa kasalukuyang Filipino; “mga mamamayan” ay mas malinaw na tumutukoy sa mga tao bilang mga pangkat.
  terminology: Napananatili ang “Yahweh” at “Selah.” Pinananatili rin ang “doon” at ang footnote na nagbibigay lamang ng kontekstuwal na alternatibo, hindi pinapalitan ang ambiguwidad ng Hebreo sa pangunahing teksto.
