lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: יִסְפֹּר
  choice: Bibilangin
  rationale: Ang qal na anyo ng ספר ay pangunahing nangangahulugang “bilangin”; ang kasunod na parirala ang nagbibigay ng konteksto ng pagtatala.
- source_word: בִּכְתוֹב
  choice: kapag itinatala niya
  rationale: Ang ב na may infinitive construct ay temporal dito. Ang “kapag itinatala niya” ay natural sa Filipino at nagpapahiwatig ng pagpaparehistro.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Ang “mga bayan” ay tumutukoy sa maraming pangkat ng mga tao at hindi kailangang limitahan sa mga estadong pampolitika.
- source_word: זֶה
  choice: Ang taong ito
  rationale: Tumutukoy ang panlalaking isahang demonstratibo sa isang indibidwal; natural itong ipinahahayag sa Filipino bilang “ang taong ito” nang hindi nililimitahan sa lalaking kasarian.
- source_word: יֻלַּד
  choice: ay ipinanganak
  rationale: Tuwirang ipinapahayag ang passive na kahulugan ng ילד bilang kapanganakan.
- source_word: שָׁם
  choice: doon
  rationale: Pinananatili ang literal na pang-abay na panlunan at hindi tahasang pinapalitan ng “sa Zion,” bagaman iyon ang tinutukoy ng konteksto.
- source_word: סֶלָה
  choice: Selah
  rationale: Tinutumbasan sa transliterasyon ang liturhikal o musikal na terminong hindi tiyak ang eksaktong kahulugan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang pangalang tipan sa anyong transliterado sa halip na palitan ito ng titulo.
- issue: Kung gagawing tahasan ang tinutukoy ng שָׁם
  choice: doon
  alternative: sa kanya; sa Zion
  rationale: Bagaman ang Zion ang malinaw na kontekstuwal na tinutukoy, pang-abay na “doon” ang aktuwal na anyo sa Hebreo; pinananatili nito ang paraan ng pagpapahayag at hindi labis na nilulutas ang reperensiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “mga bayan” para sa kolektibong עַמִּים at pinanatili ang “Selah” dahil hindi tiyak ang kahulugan nito.
