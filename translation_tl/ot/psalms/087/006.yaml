  text: 'Bibilang si Yahweh[a] kapag itinatala niya ang mga mamamayan: “Itong isa ay ipinanganak doon.” Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa konteksto, “sa kanya,” na tumutukoy sa Zion sa mga nakapaligid na talata.
