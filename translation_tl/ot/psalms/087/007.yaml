  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: tl
  text: 'At ang mga mang-aawit at mga mananayaw[a]: “Lahat ng aking bukal ay nasa iyo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga manunugtog ng plauta.” Karaniwang inuunawa ang salitang Hebreo bilang tumutukoy sa pagsasayaw o pag-ikot sa sayaw, ngunit iminungkahi rin ang diwang may kaugnayan sa isang instrumentong pangmusika.
    reason: lexical_alternative
  - marker: b
    text: Ang “Lahat ng aking bukal ay nasa iyo” ay isang patulang talinghaga na maaari ring mangahulugang “Lahat ng aking mga pinagmumulan” o “Lahat ng pinagmumulan ng aking buhay ay nasa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: At ang mga mang-aawit
  rationale: Ang anyong participle mula sa שׁיר, ‘umawit,’ ay likas na tumutukoy sa mga mang-aawit. Mas angkop ito sa kaagapay na larawang musikal kaysa sa posibleng pagbasa na ‘mga pinuno.’
- source_word: כְּחֹלְלִים
  choice: pati ang mga mananayaw
  rationale: Malamang na tumutukoy ito sa mga sumasayaw o umiikot sa sayaw. Ang ‘pati’ ay natural na naghahayag sa Filipino na magkasamang tinutukoy ang mga mang-aawit at mananayaw, habang inilalagay sa talababa ang posibleng kahulugang ‘mga manunugtog ng plauta.’
- source_word: כָּל
  choice: Lahat
  rationale: Tuwirang ipinahahayag ang kabuuan at natural sa patulang deklarasyon.
- source_word: מַעְיָנַי
  choice: aking bukal
  rationale: Ang מַעְיָן ay bukal o fountain. Pinananatili ng ‘bukal’ ang kongkreto at patulang larawan at hindi agad nilulutas ang talinghaga bilang ‘pinagmumulan ng buhay’ o ‘mga pagpapala.’
- source_word: בָּךְ
  choice: ay nasa iyo
  rationale: Pinananatili ang karaniwang diwa ng ב bilang ‘nasa/sa loob ng’ sa matalinghagang pahayag, na ang kinakausap ay ang Zion sa anyong pambabaeng isahan.
theological_decisions:
- issue: Ang matalinghagang puwersa ng ‘aking bukal’ sa pakikipag-usap sa Zion
  choice: Panatilihin ang larawang ‘Lahat ng aking bukal ay nasa iyo.’
  alternative: ‘Lahat ng pinagmumulan ng aking buhay ay nasa iyo’ o ‘Lahat ng aking pagpapala ay nasa iyo.’
  rationale: Ipinagdiriwang ng salmo ang Zion bilang lugar ng pagkakabilang at buhay, ngunit hindi tahasang nililinaw ng Hebreo ang buong saklaw ng larawan. Ang pagpapanatili sa ‘bukal’ ay umiiwas sa paglalagay ng isang tiyak na doktrinal na paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘mang-aawit’ at ‘mananayaw’ bilang natural na pangmaramihang katawagan, at pinanatili ang maigsi at matalinghagang ‘bukal’ upang mapanatili ang tula at tunay na kalabuan ng Hebreo.
