  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/001.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
translation:
  language: tl
  text: Isang salmo ng mga anak ni Kora[a]; isang awit. Ang pundasyon niya[b] ay nasa mga banal na bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “para sa mga anak ni Kora.” Ang לְ ay maaaring magpahiwatig ng pag-uukol o pagkakaugnay, hindi lamang ng tuwirang pagkakatha.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “Ang pundasyon nito,” na tumutukoy sa Sion o Jerusalem. Hindi tahasang binabanggit sa talatang ito ang tinutukoy ng hulaping panghalip sa Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: ng mga anak ni Kora
  rationale: Ang “ng” ay likas at maikli sa Filipino para sa kaugnayan o pagkakaugnay ng salmo sa mga anak ni Kora, nang hindi tiyak na ipinapahayag na sila mismo ang sumulat. Ipinaliliwanag sa talababa ang maaari ring pagbasa na “para sa.”
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Itinatangi ng “salmo” ang terminong pang-uring pampanitikan na מִזְמוֹר mula sa kasunod na שִׁיר, habang nananatiling pamilyar sa mga mambabasa ng Bibliya.
- source_word: שִׁיר
  choice: awit
  rationale: Tuwirang katumbas ng karaniwang salitang Hebreo para sa awit; pinananatili nito ang dalawang magkaugnay ngunit magkahiwalay na katawagang pang-uring pampanitikan.
- source_word: יְסוּדָתוֹ
  choice: Ang pundasyon niya
  rationale: Ang “pundasyon” ay tuwirang salin ng pangngalang mula sa יסד. Hindi tahasang tinutukoy sa talata kung kanino o saan tumutukoy ang hulaping panghalip; nakatutulong ang “niya” na huwag agad lutasin ang sanggunian.
- source_word: בְּהַרְרֵי
  choice: nasa mga bundok
  rationale: Likas sa Filipino ang “nasa” sa pagpapahayag ng kinalalagyan at hindi nito labis na nililinaw kung ang diwa ay “sa,” “nasa ibabaw ng,” o “sa gitna ng” mga bundok.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Ang “banal” ang tuwiran, matatag, at angkop na katumbas ng קֹדֶשׁ bilang paglalarawan sa mga bundok.
theological_decisions:
- issue: Ang tinutukoy ng hulaping panghalip sa יְסוּדָתוֹ
  choice: Pinanatili ang di-tiyak na sanggunian sa “Ang pundasyon niya.”
  alternative: “Ang pundasyon nito,” na inuunawang tumutukoy sa Sion o Jerusalem; o “Itinatag niya ito,” na ginagawang tahasan ang Diyos bilang tagapagtatag.
  rationale: May hulaping panghalip na ikatlong panauhan ang Hebreo ngunit walang tahasang antecedent sa talatang ito. Hindi dapat sapilitang piliin sa pangunahing teksto kung ang ipinahihiwatig ay ang Diyos o ang Sion/Jerusalem.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “salmo” at “awit” upang mapanatili ang dobleng katawagang מִזְמוֹר שִׁיר, at ang bantas na tuldok-kuwit upang malinaw na magkaugnay ang dalawang bahagi ng pamagat.
