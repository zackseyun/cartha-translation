  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang superskripsiyong may pag-uugnay sa mga anak ni Kora, ang magkahiwalay na katawagang “salmo” at “awit,” at ang di-tiyak na hulaping ikatlong panauhan sa יְסוּדָתוֹ. Ang “nasa mga banal na bundok” ay sapat na katumbas ng בְּהַרְרֵי קֹדֶשׁ.'
