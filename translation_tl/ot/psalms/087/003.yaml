translation:
  language: tl
  text: Mga mariringal na bagay ang sinasabi tungkol sa iyo[a], lungsod ng Diyos. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa iyo.” Ang pang-ukol sa Hebreo ay maaari ring tumukoy sa mga bagay na sinasabi sa loob ng lungsod; “tungkol sa iyo” ang higit na angkop sa diwa ng papuri sa Sion.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Mariringal na bagay
  rationale: Ang anyong pambabae na maramihan mula sa כבד ay ginagamit bilang pangngalan at tumutukoy sa mga bagay na marangal, dakila, o maluwalhati. Likas at marangal sa modernong Filipino ang “mariringal na bagay” sa konteksto ng tulang papuri.
- source_word: מְדֻבָּר
  choice: ang sinasabi
  rationale: Pual participle ito ng דבר at nagpapahayag ng patuloy o pangkalahatang pagsasalita. Ang “sinasabi” ay natural na Filipino at nagpapanatili sa di-tiyak na tagaganap ng balintiyak na Hebreo.
- source_word: בָּךְ
  choice: tungkol sa iyo
  rationale: Maaaring ipakahulugan ang pang-ukol na ב bilang “tungkol sa iyo” o “sa loob mo” sa konstruksiyong ito. Pinakamalinaw sa konteksto ng papuri sa Zion ang “tungkol sa iyo,” habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: עִיר הָאֱלֹהִים
  choice: lungsod ng Diyos
  rationale: Tuwirang construct chain itong nangangahulugang “lungsod ng Diyos.” Gumaganap itong pantawag o paglilinaw sa tinutukoy ng “iyo,” kaya hindi na kailangan ang tahasang “O.”
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan nito at malamang na panandang liturhikal o musikal. Isinatinig ito sa halip na bigyan ng mapagpalagay na interpretasyon.
