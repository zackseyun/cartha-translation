base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: tl
  text: Babanggitin ko ang Rahab[a] at Babilonia bilang mga kumikilala sa akin[b]; narito ang Filistia at Tiro, kasama ang Cush—ang isang ito ay ipinanganak doon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Rahab ay patulang pangalan para sa Ehipto.
    reason: alternative_reading
  - marker: b
    text: O kaya, “sa mga kumikilala sa akin.” Pinaikli ang pariralang Hebreo at maaari itong ipahiwatig na ibinibilang ang mga bansang ito sa mga kumikilala sa nagsasalita.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, sa Sion, ayon sa konteksto ng awit.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Babanggitin ko
  rationale: Ang Hifil ng זכר ay karaniwang nangangahulugang “banggitin” o “alalahanin.” Ang “babanggitin” ay likas sa makabagong Tagalog at angkop sa talaan ng mga bansa.
- source_word: רַהַב
  choice: Rahab
  rationale: Pinanatili ang patulang pangalang Hebreo. Sa kontekstong ito, tumutukoy ito sa Ehipto, na ipinaliliwanag sa talababa.
- source_word: וּבָבֶל
  choice: at Babilonia
  rationale: Ginamit ang karaniwang pangalang Tagalog para sa Babilonia.
- source_word: לְיֹדְעָי
  choice: sa mga kumikilala sa akin
  rationale: Ang pariralang Hebreo ay patulang pinaikli at maaaring mangahulugang kabilang sa mga kumikilala sa nagsasalita o binabanggit sa kanila. Pinili ang “sa mga kumikilala sa akin” upang mapanatili ang posibleng diwa ng pagsasama nang hindi labis na nililinaw.
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili nito ang pantawag-pansing bisa ng הִנֵּה sa isang marangal ngunit madaling maunawaang anyo.
- source_word: פְלֶשֶׁת
  choice: Filistia
  rationale: Lugar o rehiyon ang tahasang tinutukoy ng Hebreo, kaya pinanatili ang pangalan ng lupain sa halip na gawing “mga Filisteo.”
- source_word: וְצוֹר
  choice: at Tiro
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan ng lugar.
- source_word: עִם כּוּשׁ
  choice: kasama ang Cush
  rationale: Tuwirang ipinahahayag ng עִם ang pagsama; natural at malinaw ang “kasama ang” sa Tagalog.
- source_word: כּוּשׁ
  choice: Cush
  rationale: Pinanatili ang transliterasyon upang maiwasan ang mapanlinlang na pagtutumbas sa makabagong Ethiopia.
- source_word: זֶה
  choice: ang isang ito
  rationale: Pinananatili nito ang isahang panlalaking demonstratibo nang hindi idinaragdag ang salitang “lalaki,” na wala sa Hebreo.
- source_word: יֻלַּד שָׁם
  choice: ay ipinanganak doon
  rationale: Tuwirang inilalarawan ng pasibong pandiwa at pang-abay ang kapanganakan sa lugar na tinutukoy ng konteksto.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa “mga kumikilala sa akin”
  choice: Pinanatili ang unang panauhang “akin” nang hindi tinutukoy kung sino ang nagsasalita.
  alternative: Ang nagsasalita ay ang PANGINOON, o ang Sion na isinatao.
  rationale: Hindi tahasang pinapangalanan ng mismong taludtod ang nagsasalita. Hinahayaan ng salin na ang konteksto ng awit ang gumabay sa pagkilala rito.
- issue: Tinutukoy ng “doon”
  choice: Pinanatili ang “doon.”
  alternative: Palitan ito ng “sa Sion” o “sa lungsod ng Diyos.”
  rationale: Ipinahihiwatig ng kabuuang konteksto na Sion ang tinutukoy, ngunit hindi ito tahasang inuulit sa Hebreo ng taludtod; kaya pinanatili ang tunay na pagpapaubaya sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog para sa tulang biblikal. Pinanatili ang mga pangalang Rahab at Cush at ang mga hindi tahasang tinukoy na pagkakakilanlan ng nagsasalita at ng lugar na “doon.”
