base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: tl
  text: At tungkol sa Zion ay sasabihin[a], “Ang taong ito at ang taong iyon ay ipinanganak sa kanya,” at ang Kataas-taasan mismo ang magtatatag sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sunod-sunod na tao ang ipinanganak sa kanya.” Inuulit sa Hebreo ang “tao at tao” upang ipahayag ang diwang distributibo—isa-isa o bawat isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: At tungkol sa Zion
  rationale: Ang לְ ay nagpapakilala rito ng paksa; natural na naihahayag ito bilang “tungkol sa,” habang pinananatili ng “At” ang dugtong na patula.
- source_word: יֵאָמַר
  choice: ay sasabihin
  rationale: Ang Niphal imperfect ay impersonal na pasibo at ang hinaharap na anyo ay angkop sa pahayag ng taludtod.
- source_word: אִישׁ וְאִישׁ
  choice: Ang isang ito at ang isang iyon
  rationale: Ang pag-uulit ng אִישׁ ay may diwang distributibo—mga tao na isa-isa—at hindi kailangang limitahan sa kasariang lalaki.
- source_word: יֻלַּד בָּהּ
  choice: ay ipinanganak sa kanya
  rationale: Pinananatili ang isahang pandiwa ng Hebreo at ang personipikasyon ng Zion bilang isang lungsod na tila ina.
- source_word: בָּהּ
  choice: sa kanya
  rationale: Tumutukoy ang pambabaeng hulapi sa Zion; pinananatili ng “sa kanya” ang personipikasyon sa halip na gawing simpleng “doon.”
- source_word: וְהוּא
  choice: at ... mismo
  rationale: Ipinahahayag ng “mismo” ang diin ng tahasang panghalip na הוּא.
- source_word: יְכוֹנְנֶהָ
  choice: ang magtatatag sa kanya
  rationale: Sinasaklaw ng “magtatatag” ang diwa ng paglalagay sa matatag at tiyak na kalagayan nang hindi labis na nililinaw kung ito ay pagtatatag o pagpapatibay.
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Ito ang malinaw at marangal na salin ng titulong banal na עֶלְיוֹן.
theological_decisions:
- issue: Ang tinutukoy ng idiniing panghalip na וְהוּא kasama ng עֶלְיוֹן
  choice: “ang Kataas-taasan mismo” ang siyang magtatatag sa Zion
  alternative: “at siya, ang Kataas-taasan, ang magtatatag sa kanya”
  rationale: Kapwa tumutukoy sa Diyos ang panghalip at ang titulong kasunod nito. Inililipat ng “mismo” ang diin ng Hebreo nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Zion” bilang kinikilalang pangalang biblikal at pinanatili ang personipikasyon nito sa “sa kanya.”
