  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: tl
  text: Tumatawag ako sa iyo[a], sapagkat sinasagot mo ako, O Diyos; ikiling mo ang iyong tainga sa akin[b]; pakinggan mo ang aking pananalita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tumawag ako sa iyo, sapagkat sasagutin mo ako, O Diyos.” Sa panalanging patula, ang mga anyo ng pandiwang Hebreo ay maaaring unawain na may diwang nakaraan, kasalukuyan, o hinaharap na buong pagtitiwala.
    reason: alternative_reading
  - marker: b
    text: Ang Hebreong “ikiling mo ang iyong tainga sa akin” ay isang idyomang humihiling sa Diyos na makinig nang mabuti.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Tumatawag ako sa iyo
  rationale: Ang Qal perfect na may hulaping tumutukoy sa kausap ay maaaring magpahiwatig ng nakaraan, kasalukuyang panawagan, o pananalig sa panalanging patula. Likas sa modernong Tagalog ang “Tumatawag ako sa iyo,” habang iniiwan sa talababa ang iba pang posibleng aspekto.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Pinananatili ang maikli at tahasang ugnayang sanhi: tumatawag ang salmista dahil nagtitiwala siyang sasagutin siya ng Diyos.'
- source_word: תַעֲנֵנִי
  choice: sinasagot mo ako
  rationale: Ang imperfect na anyo ay maaaring kasalukuyan o may tiyak na hinaharap na diwa. Ang kasalukuyang “sinasagot mo ako” ay nagpapahayag ng pananalig sa pagtugon ng Diyos nang hindi lubusang isinasara ang ibang aspektuwal na pagbasa.
- source_word: אֵל
  choice: O Diyos
  rationale: Ginamit bilang tuwirang panawag. Ang “O Diyos” ay marangal at likas sa wikang panalangin.
- source_word: הַט אָזְנְךָ לִי
  choice: ikiling mo sa akin ang iyong tainga
  rationale: Pinananatili ang konkretong Hebreong talinghaga at ang puwersa ng pautos; ipinaliliwanag sa talababa na ito ay pakiusap na makinig nang mabuti.
- source_word: שְׁמַע
  choice: pakinggan mo
  rationale: Ang pautos na “pakinggan mo” ay mas natural sa modernong Tagalog kaysa sa literal na “dinggin mo” sa pangungusap na ito at malinaw na humihiling ng masusing pakikinig.
- source_word: אִמְרָתִי
  choice: ang aking mga salita
  rationale: Inihahatid ang diwa ng sinambit o pananalita sa natural na Tagalog. Ang maramihang “mga salita” ay angkop sa kahulugan ng buong ipinahahayag na panalangin, bagaman ang nakasulat na anyo sa WLC ay morpolohikal na isahan.
