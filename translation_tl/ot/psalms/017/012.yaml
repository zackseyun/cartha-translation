lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: Para siyang
  rationale: Ang pangngalang Hebreo ay tumutukoy sa wangis o pagkakahawig niya. Ginawang tuwirang paghahambing upang maging natural sa modernong Tagalog nang hindi binabago ang diwa.
- source_word: כְּאַרְיֵה
  choice: gaya ng leon
  rationale: Malinaw at natural nitong ipinapahayag ang paghahambing na minamarkahan ng כ.
- source_word: יִכְסוֹף
  choice: sabik
  rationale: Ipinahihiwatig ng pandiwa ang matinding pagnanais; sa larawan ng mandaragit, natural na ipinapahayag ito ng “sabik.”
- source_word: לִטְרוֹף
  choice: lumapa
  rationale: Sa konteksto ng leon at biktima, ang “lumapa” ay matingkad at likas na salitang Tagalog para sa marahas na pagsunggab at pagpunit sa biktima.
- source_word: וְכִכְפִיר
  choice: gaya ng batang leon
  rationale: Ang כְּפִיר ay batang leon; pinananatili ng parirala ang ikalawang magkatulad na paghahambing.
- source_word: יֹשֵׁב
  choice: nag-aabang
  rationale: Literal itong “nakaupo,” ngunit sa konteksto ng isang leon sa taguan, ang kilos ay paghihintay upang tambangan ang biktima. Ang mas natural na kahulugan sa Tagalog ang ginamit, habang inilagay sa talababa ang literal na anyo.
- source_word: בְּמִסְתָּרִים
  choice: sa mga taguan
  rationale: Pinananatili nito ang ideya ng mga nakatagong lugar at ang anyong maramihan ng Hebreo.
