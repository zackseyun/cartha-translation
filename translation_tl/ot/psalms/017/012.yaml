  text: Para siyang[a][c] leon na sabik lumapa, gaya ng batang leon na nag-aabang sa mga taguan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Ang wangis niya ay gaya ng leon.” Nagsisimula ang Hebreo sa pangngalang “ang wangis niya,” ngunit mas natural sa Tagalog ang tuwirang paghahambing.'
