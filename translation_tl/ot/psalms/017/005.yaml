translation:
  language: tl
  text: Alalayan mo ang mga hakbang ko sa iyong mga landas[a]; hindi nadulas ang mga paa ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Matatag ang mga hakbang ko sa iyong mga landas.” Maaaring unawain ang Hebreo bilang pakiusap o bilang pahayag ng matatag na pagtahak.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹךְ
  choice: Nananatili
  rationale: Ang anyo mula sa תמך ay maaaring magpahiwatig ng matatag na pagkapit o ng pag-alalay. Sa konteksto ng paglakad at ng kasunod na hindi pagdulas, likas na ipinapahayag ng “nananatili” ang matatag na pagtahak nang hindi nagpapasya nang labis kung ito ay sariling pagkapit o pag-alalay ng Diyos.
- source_word: אֲשֻׁרַי
  choice: ang mga hakbang ko
  rationale: Pinananatili nito ang kongkretong talinghaga ng paglakad at natural ito sa makabagong Filipino.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: sa iyong mga landas
  rationale: Ang מַעְגָּל ay tumutukoy sa landas o bakas na tinatahak. Ang “mga landas” ay malinaw, marangal, at likas sa Filipino, habang pinananatili ng “sa” ang Hebreong larawan ng paglakad sa loob ng itinakdang daan.
- source_word: בַּל
  choice: hindi
  rationale: Tuwirang katumbas ng patulang pananggi sa kontekstong ito.
- source_word: נָמֹטּוּ
  choice: nadulas
  rationale: Sa pagkakaugnay nito sa mga paa, ang “nadulas” ang pinakamalinaw at natural na paglalarawan sa pagkawala ng katatagan.
- source_word: פְעָמָי
  choice: ang mga paa ko
  rationale: Bagaman maaari itong tumukoy sa mga hakbang o yapak, ang “mga paa ko” ay likas na katambal ng pandiwang “nadulas” at nagpapanatili ng paralelismo nang hindi paulit-ulit.
theological_decisions:
- issue: Ang תָּמֹךְ ay maaaring basahing pahayag o pakiusap
  choice: 'Isinalin sa pangunahing teksto bilang pahayag: “Nananatili ang mga hakbang ko”'
  alternative: “Alalayan mo ang mga hakbang ko” o “Inalalayan ang mga hakbang ko”
  rationale: Maaaring unawain ang di-tiyak na anyong Hebreo bilang pagtiyak ng matatag na pagtahak o bilang pakiusap na alalayan. Ang daloy at paralelismo sa “hindi nadulas” ay pumapabor sa pahayag, ngunit itinatala sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago at dignified na Filipino; pinanatili ang kongkretong larawan ng mga hakbang, landas, at mga paang hindi nadudulas. Iniwasan ang sobrang arkaikong “yapak” at ang abstraktong “mga daan” upang manatiling malinaw ang talinghaga.
