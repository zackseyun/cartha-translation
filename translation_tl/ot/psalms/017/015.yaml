  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: tl
  text: Ngunit ako, sa katuwiran, mamamasdan ko ang iyong mukha; sa paggising ko[a], masisiyahan ako sa iyong wangis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa paggising ko” ay maaaring tumukoy sa karaniwang paggising mula sa pagtulog, o sa paggising na kaugnay ng pangwakas na pagbibigay-katarungan o muling pagkabuhay.
    reason: alternative_reading
  - marker: b
    text: O “anyo” o “larawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: sa katuwiran
  rationale: Pinananatili ang saklaw o kalagayang ipinahihiwatig ng בְּ at ang malawak na kahulugan ng צֶדֶק, nang hindi ipinapasiya kung ito ay integridad ng salmista, makatarungang pagkilos, o pagbibigay-katuwiran ng Diyos.
- source_word: אֶחֱזֶה
  choice: mamamasdan ko
  rationale: Ang חזה ay higit sa karaniwang pagkakita at maaaring magpahiwatig ng mapagnilay o masusing pagtingin; natural at marangal sa modernong Tagalog ang “mamamasdan.”
- source_word: פָנֶיךָ
  choice: ang iyong mukha
  rationale: Tuwirang pinananatili ang konkretong salitang Hebreo sa halip na palitan ng interpretatibong “presensya.”
- source_word: אֶשְׂבְּעָה
  choice: masisiyahan ako
  rationale: Likas na ipinahahayag sa Tagalog ang pagiging ganap na nasisiyahan o napupuno, habang pinananatili ang resultang diwa ng pandiwa.
- source_word: בְּהָקִיץ
  choice: paggising ko
  rationale: Natural na panandang pamanahon ito sa Tagalog at hindi nito tinutukoy kung ang paggising ay mula sa karaniwang pagtulog o tumutukoy sa pangwakas na pagbangon.
- source_word: תְּמוּנָתֶךָ
  choice: iyong wangis
  rationale: Sinasaklaw ng “wangis” ang anyo o pagkakahawig nang hindi sapilitang nagpapahiwatig ng tiyak na pisikal na hugis.
theological_decisions:
- issue: Kung ang בְּהָקִיץ ay karaniwang paggising sa pagtulog o nagpapahiwatig ng muling pagkabuhay/pangwakas na pagbibigay-katarungan
  choice: Pinanatili sa pangunahing teksto ang hindi tiyak na “paggising ko.”
  alternative: Maaaring unawain bilang pang-araw-araw na paggising mula sa pagtulog o bilang pagbangon sa pangwakas na pagbibigay-katarungan/muling pagkabuhay.
  rationale: Hindi tahasang nililinaw ng pariralang Hebreo ang uri ng paggising, kaya pinananatili ang tunay na teolohikal na tensiyon at inilalahad ang mga posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang makatang himig. Ginamit ang “Ngunit ako” upang idiomatikong katawanin ang mariing אֲנִי sa kaibahan ng naunang konteksto; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
