translation:
  language: tl
  text: Tungkol sa mga gawa ng tao, sa pamamagitan ng salita ng iyong mga labi ay iniwasan ko ang mga landas ng mga marahas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas literal: “iniingatan ko ang aking sarili laban sa mga landas ng mga marahas.” Maaari ring basahin ang Hebreo bilang “pinagmasdan ko ang mga landas ng mga marahas,” ngunit mas pinapaboran ng konteksto ang diwang pag-iwas sa mga iyon.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִ/פְעֻלּוֹת אָדָם
  choice: Tungkol sa mga gawa ng tao
  rationale: Itinuturing ang ל bilang pananda ng paksang tinatalakay. Ang “mga gawa ng tao” ay likas sa Tagalog at pinananatili ang pangkalahatang pagtukoy ng אָדָם sa sangkatauhan.
- source_word: בִּ/דְבַר שְׂפָתֶי/ךָ
  choice: sa pamamagitan ng salita ng iyong mga labi
  rationale: Ipinahahayag ng ב ang kasangkapan o paraang gumabay sa mang-aawit. Pinananatili ng “iyong mga labi” ang matalinghagang larawan ng Hebreo para sa salita ng Diyos.
- source_word: שָׁמַרְתִּי
  choice: iniwasan ko
  rationale: Bagaman karaniwang nangangahulugang “iningatan” o “sinunod” ang pandiwa, ipinahihiwatig ng kasunod na “mga landas ng marahas” at ng konteksto ang pagpipigil at paglayo sa gayong pamumuhay.
- source_word: אָרְחוֹת
  choice: mga landas
  rationale: Pinananatili nito ang kongkretong talinghaga para sa takbo ng buhay o asal.
- source_word: פָּרִיץ
  choice: marahas
  rationale: Tumutukoy ang salita sa marahas o malupit na tao. Ang anyong “mga landas ng marahas” ay maikli at natural, at maaaring tumukoy sa mararahas na tao bilang isang uri.
theological_decisions:
- issue: Kahulugan ng sugnay na may שָׁמַרְתִּי
  choice: Sinasabi ng mang-aawit na sa pamamagitan ng salita ng Diyos ay iniwasan niya ang mararahas na landas.
  alternative: Maaari ring unawain na pinagmasdan o binantayan niya ang mga landas ng marahas.
  rationale: Maaaring mangahulugan ang שׁמר na mag-ingat, magbantay, sumunod, o magmasid. Mas naaangkop sa pahayag ng katapatan sa konteksto ang pag-iwas, ngunit hindi ganap na inaalis ang ibang posibleng pagbasa kaya inilalahad ito sa talababa.
translation_notes:
  register: Makabagong, marangal, at malinaw na Filipino. Pinanatili ang matulaing “salita ng iyong mga labi” at “mga landas,” habang ginawang tuwiran ang diwa ng pag-iwas. Inilagay ang pananda ng talababa sa mismong teksto.
