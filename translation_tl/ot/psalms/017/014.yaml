  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: tl
  text: Iligtas mo ako sa pamamagitan ng iyong kamay mula sa mga tao[a], Yahweh—mula sa mga tao ng mundong ito, na ang bahagi ay nasa buhay na ito. Pinupuno mo ang kanilang tiyan ng iyong inimbak na kayamanan; sagana sila sa mga anak na lalaki[b], at iniiwan nila ang kanilang kasaganaan sa maliliit nilang anak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mula sa mga tao—sa pamamagitan ng iyong kamay,” o “mula sa mga taong nasa iyong kamay.” Masinsin ang pagkakabuo ng Hebreo at maaaring unawain sa higit sa isang paraan.'
    reason: alternative_reading
  - marker: b
    text: 'Hebreo: “mga anak na lalaki.” Panlalaki ang anyong maramihan at malamang na idinidiin ang maraming anak na lalaki bilang tanda ng kasaganaan. Maaari ring unawain na ang kanilang mga anak ang “nasisiyahan” o “nabubusog.”'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Ang Hebreong salita ay mas tiyak na tumutukoy sa maliliit na bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: mula sa mga tao
  rationale: Sa konteksto, tumutukoy ito sa mga taong kalaban ng salmista, hindi sa mga patay. Inulit sa Tagalog ang pahiwatig na “Iligtas mo ako” mula sa naunang talata upang maging malinaw at natural ang pangungusap.
- source_word: יָדְךָ
  choice: sa pamamagitan ng iyong kamay
  rationale: Ipinahahayag nito ang pagkilos ni Yahweh nang hindi inaalis ang masinsing sintaks ng Hebreo; inilalahad sa talababa ang iba pang posibleng pagkakaugnay ng parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מֵחֶלֶד
  choice: mga tao ng mundong ito
  rationale: Tumutukoy ang חֶלֶד sa kasalukuyan at lumilipas na larangan ng buhay ng tao. Iniiwasan ng pariralang ito ang moral na dagdag na pahiwatig ng “makamundo.”
- source_word: חֶלְקָם בַּחַיִּים
  choice: na ang bahagi ay nasa buhay na ito
  rationale: Pinananatili ang larawan ng “bahagi” at ang temporal na diin, nang hindi tahasang nagdaragdag ng aral tungkol sa kabilang buhay.
- source_word: וּצְפִינְךָ
  choice: iyong inimbak na kayamanan
  rationale: Ang salita ay tumutukoy sa bagay na itinago o inimbak; ang “kayamanan” ay angkop sa kasunod na larawan ng kasaganaan ngunit hindi nililimitahan ito sa salapi.
- source_word: תְּמַלֵּא בִטְנָם
  choice: Pinupuno mo ang kanilang tiyan
  rationale: Pinananatili ang kongkretong larawan ng Hebreo tungkol sa pagkabusog at kasaganaan.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: nasisiyahan sila sa pagkakaroon ng mga anak na lalaki
  rationale: Itinuturing na simuno ang mga taong tinutukoy at pinananatili ang tiyak na panlalaking anyo ng בָנִים. Ginawang likas sa Tagalog ang idyomang literal na “nasisiyahan sa mga anak na lalaki.”
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: iniiwan nila ang kanilang kasaganaan
  rationale: Ang יֶתֶר ay maaaring tumukoy sa labis, natira, o kasaganaan; ang “kasaganaan” ay angkop sa pamana para sa susunod na salinlahi.
- source_word: לְעוֹלְלֵיהֶם
  choice: sa maliliit nilang anak
  rationale: Mas tiyak itong tumutukoy sa maliliit na bata kaysa sa pangkalahatang “mga anak,” kaya pinanatili ang pagkakaibang leksikal sa בָנִים.
theological_decisions:
- issue: Ang kaugnayan ng mga kalaban sa kamay ni Yahweh
  choice: 'Iniuugnay ang “iyong kamay” sa pagliligtas ni Yahweh: “sa pamamagitan ng iyong kamay.”'
  alternative: “mula sa mga tao—sa pamamagitan ng iyong kamay” o “mula sa mga taong nasa iyong kamay”
  rationale: Masinsin at maaaring unawain sa iba’t ibang paraan ang sintaks ng Hebreo. Ang pangunahing salin ay natural sa Tagalog, samantalang pinananatili sa talababa ang tunay na kalabuan nang hindi ipinapasyang mga kasangkapan sila ng paghatol ng Diyos.
- issue: Ang pansamantalang kasaganaan ng masasama
  choice: “ang bahagi ay nasa buhay na ito”
  alternative: “ang bahagi ay kasama ng mga buháy”
  rationale: Ipinakikita nito ang diin sa kasalukuyang buhay ngunit hindi tahasang nagdaragdag ng konklusyon tungkol sa huling paghuhukom o kabilang buhay.
- issue: Ang kahulugan ng יִשְׂבְּעוּ בָנִים
  choice: Nasisiyahan ang mga tao sa pagkakaroon ng mga anak na lalaki.
  alternative: “Nabubusog ang kanilang mga anak.”
  rationale: Maaaring iugnay sa higit sa isang paraan ang maikling pariralang Hebreo. Pinili ang pagbasa na kaayon ng larawan ng maraming supling bilang kasaganaan, ngunit kinikilala ang alternatibong sintaktikong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” bilang personal na pangalan; iniwasan ang “makamundo” dahil maaari itong magdagdag ng tahasang moral na paghatol na wala sa mismong salita. Ang pag-uulit ng “Iligtas mo ako” mula sa diwa ng naunang talata ay kailangan upang maging buo at natural ang talata sa Tagalog.
