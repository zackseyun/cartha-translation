  source_fidelity: 'Tumpak na naipapahayag ng salin ang Hebreong pakiusap: ang hatol ng nananalangin ay lumabas mula sa harapan ng Diyos, at ang mga mata ng Diyos ay tumingin sa matuwid. Napananatili ang literal at makatang “iyong mga mata,” gayundin ang hudisyal na larawan ng מִשְׁפָּטִי nang hindi ipinipilit na paborable ang magiging hatol.'
  naturalness: Marangal, malinaw, at likas sa makabagong Filipino ang pangunahing teksto. Ang ayos na “Mula sa iyong harapan ay lumabas nawa” ay bahagyang matulaing minarkahan ngunit angkop sa panalangin at salmo. Ang “masdan nawa ng iyong mga mata” ay sadyang matulaing antropomorpismo at nauunawaan nang natural sa rehistrong ito.
  terminology: Ang “hatol tungkol sa akin” ay maingat na katumbas ng מִשְׁפָּטִי at iniiwasan ang mas interpretibong “pagpapawalang-sala” sa pangunahing teksto. Ang “kung ano ang matuwid” ay angkop para sa מֵישָׁרִים; wastong ibinibigay ng talababa ang “katarungan” at “kung ano ang tama” bilang mga alternatibo. Ang mga panandang [a] at [b] ay wastong nakakabit sa mga salitang tinatalakay.
