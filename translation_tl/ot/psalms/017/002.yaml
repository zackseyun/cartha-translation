  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: tl
  text: Mula sa iyong harapan ay lumabas nawa ang hatol tungkol sa akin[a]; masdan nawa ng iyong mga mata kung ano ang matuwid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagpapawalang-sala sa akin ay magmula sa iyong presensiya.”
    reason: alternative_reading
  - marker: b
    text: O “ang katarungan” o “kung ano ang tama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: mula sa iyong harapan
  rationale: Pinananatili nito ang kongkretong larawan ng pasiya na nagmumula sa harapan o presensiya ng Diyos, sa halip na gawing simpleng “mula sa iyo.”
- source_word: מִשְׁפָּטִי
  choice: ang hatol tungkol sa akin
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa hatol, katarungan, usapin, o pagpapawalang-sala. Ang “hatol tungkol sa akin” ay natural sa Filipino at hindi agad nagpapalagay na paborable ang magiging pasiya.
- source_word: יֵצֵא
  choice: lumabas nawa
  rationale: Inilalarawan ng יצא ang paglabas o paglitaw mula sa isang pinagmulan. Ang “lumabas nawa” ay nagpapanatili sa galaw ng hatol mula sa harapan ng Diyos at sa anyong pakiusap.
- source_word: עֵינֶיךָ
  choice: iyong mga mata
  rationale: Pinananatili ang tahasang makatang paglalarawan sa masusing pagsusuri ng Diyos sa halip na paikliin lamang sa “ikaw.”
- source_word: תֶּחֱזֶינָה
  choice: masdan nawa
  rationale: Ipinahihiwatig ng חזה ang maingat na pagtingin o pagmamasid. Ang “masdan” ay dignificado ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: מֵישָׁרִים
  choice: kung ano ang matuwid
  rationale: Saklaw ng pangmaramihang anyo ang katuwiran, pagkamakatarungan, o mga bagay na tama. Pinananatili ng pariralang ito ang malawak na moral at hudisyal na diwa.
theological_decisions:
- issue: Kung ang dalawang di-ganap na pandiwa ay pahayag tungkol sa hinaharap o pakiusap
  choice: 'Pakiusap: “lumabas nawa … masdan nawa”'
  alternative: 'Pahayag: “lalabas … mamasdan”'
  rationale: Bagaman maaaring ipahayag ng mga anyong Hebreo ang hinaharap, ang konteksto ng panalangin ay likas na nagpapahiwatig ng pagsusumamo. Hindi nito ginagawang tahasang katiyakan ang hindi tiyak sa gramatika.
- issue: Kung ang מִשְׁפָּטִי ay dapat nang isalin bilang pagpapawalang-sala
  choice: “ang hatol tungkol sa akin”
  alternative: “ang pagpapawalang-sala sa akin”
  rationale: Iniiwasang ipasok sa pangunahing teksto ang paborableng resulta na ipinahihiwatig ng konteksto ngunit hindi tahasang itinatakda ng mismong salita.
translation_notes:
  register: Makabago at marangal na Filipino na nagpapanatili sa makatang-hudisyal na larawan ng Hebreo. Ang bahagyang minarkahang ayos na “Mula sa iyong harapan ay lumabas nawa” ay sadyang nagpapanatili sa diin sa pinagmumulan ng hatol.
