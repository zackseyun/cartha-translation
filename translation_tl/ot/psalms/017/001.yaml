  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: tl
  text: 'Panalangin ni David.


    Dinggin mo, Yahweh, ang makatarungang usapin[a];

    pakinggan mo ang aking daing;

    makinig ka sa aking panalangin

    na nagmumula sa mga labing walang daya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang katuwiran”—samakatuwid, ang matuwid o makatarungan. Ang salitang Hebreo ay maaaring mangahulugang katuwiran, katarungan, o isang makatarungang usapin; dito, malamang na tumutukoy ito sa makatarungang kaso ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Panalangin ni David
  rationale: Ang pormulang pamagat ay likas na tumutukoy sa panalanging kaugnay o iniuukol kay David; ang “ni David” ang pinakanatural na salin sa modernong Tagalog habang pinananatili ang karaniwang pagkaunawa sa pamagat.
- source_word: שִׁמְעָה
  choice: Dinggin mo
  rationale: Pinananatili nito ang tuwirang pakiusap at ang marangal na himig ng panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinatinig ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צֶדֶק
  choice: ang makatarungang usapin
  rationale: Sa konteksto, malamang na tumutukoy ito sa matuwid o makatarungang kaso ng nananalangin, hindi lamang sa abstraktong katuwiran. Ang talababa ay nagpapanatili sa mas literal na posibilidad.
- source_word: הַקְשִׁיבָה
  choice: pakinggan mo
  rationale: Ipinahahayag nito ang masusing pagbibigay-pansin sa daing, at natural ang anyo sa kasalukuyang Tagalog.
- source_word: רִנָּתִי
  choice: ang aking daing
  rationale: Bagaman maaari itong tumukoy sa isang malakas o umaalingawngaw na sigaw, ang “daing” ay angkop sa konteksto ng panalanging-lamento.
- source_word: הַאֲזִינָה
  choice: makinig ka sa
  rationale: Natural na katumbas ito ng panawagang ituon ang pandinig, habang pinananatili ang pag-uulit ng mga pakiusap na makinig ang Diyos.
- source_word: תְפִלָּתִי
  choice: aking panalangin
  rationale: Pinananatili nito ang leksikal na ugnayan sa תְּפִלָּה sa pamagat.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: na nagmumula sa mga labing walang daya
  rationale: Nililinaw ng parirala na ang panalangin ay nagmumula sa bibig na hindi nandaraya, nang hindi binabago ang moral na pahayag ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng צֶדֶק bilang layon ng “dinggin”
  choice: ang makatarungang usapin
  alternative: ang katuwiran; ang matuwid
  rationale: Pinakamalamang na tumutukoy ito sa makatarungang kaso o pakiusap ng salmista, ngunit hindi ganap na inaalis ang mas abstraktong kahulugang “katuwiran,” kaya inilalahad iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panulaan at panalangin. Gumamit ng magkakaibang likas na pandiwa—“dinggin,” “pakinggan,” at “makinig”—upang katawanin ang tatlong magkakahilerang panawagan sa Hebreo nang hindi nagiging artipisyal o lipas ang wika.
