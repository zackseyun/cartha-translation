  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: tl
  text: Ipakita mo ang iyong kahanga-hangang tapat na pag-ibig[a], ikaw na sa pamamagitan ng iyong kanang kamay ay nagliligtas sa mga nanganganlong sa iyo mula sa mga bumabangon laban sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Gawin mong kahanga-hanga ang iyong tapat na pag-ibig.” Ang pandiwang Hebreo ay maaaring mangahulugang ipakita ang isang bagay bilang pambihira o gawin itong bukod-tangi at kamangha-mangha.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring iugnay sa “mga nanganganlong” ang pangwakas na parirala: “mga nanganganlong sa iyong kanan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Ipakita mo ang iyong kahanga-hanga
  rationale: Ang Hiphil imperative ng פלא ay maaaring tumukoy sa pagpapakitang pambihira o sa paggawa ng isang bagay na kamangha-mangha. Ang pahayag na ito ay natural sa makabagong Tagalog habang pinananatili sa talababa ang saklaw ng pandiwa.
- source_word: חֲסָדֶיךָ
  choice: iyong ... tapat na pag-ibig
  rationale: Ang חסד ay sumasaklaw sa awa, katapatan, at matibay na pag-ibig sa loob ng isang ugnayan. Ang “tapat na pag-ibig” ay malinaw at marangal nang hindi nagdaragdag ng teknikal na terminong teolohikal.
- source_word: מוֹשִׁיעַ
  choice: ikaw na ... ay nagliligtas
  rationale: Ang participle ay tumutukoy sa Diyos bilang siyang tagapagligtas. Mas natural sa direktang panalangin sa Tagalog ang “ikaw na nagliligtas” kaysa sa tahasang pantawag na “O Tagapagligtas.”
- source_word: חוֹסִים
  choice: mga nanganganlong sa iyo
  rationale: Pinananatili ng “nanganganlong” ang kongkretong larawan ng pagtakbo sa Diyos para sa proteksiyon. Idinagdag ang “sa iyo” bilang likas at malinaw na ipinahihiwatig na hantungan ng pagkakanlong sa konteksto.
- source_word: מִמִּתְקוֹמְמִים
  choice: mula sa mga bumabangon laban sa kanila
  rationale: Ang anyo mula sa קום ay naglalarawan ng mga kaaway na bumabangon nang may pagkapoot. Ang “laban sa kanila” ay nilinaw mula sa konteksto, sapagkat walang tahasang layon ang parirala sa Hebreo.
- source_word: בִּימִינֶךָ
  choice: sa pamamagitan ng iyong kanang kamay
  rationale: Sa pangunahing pagbasa, ipinahihiwatig ng בְּ ang kasangkapan o paraan ng pagliligtas. Pinananatili ng “kanang kamay” ang antropomorpikong larawan ng kapangyarihan ng Diyos.
theological_decisions:
- issue: Ugnayang sintaktiko ng pangwakas na pariralang בִּימִינֶךָ
  choice: 'Iniugnay sa pagliligtas ng Diyos: “sa pamamagitan ng iyong kanang kamay ay nagliligtas.”'
  alternative: 'Maaaring iugnay sa mga nanganganlong: “mga nanganganlong sa iyong kanang kamay.”'
  rationale: Dahil nasa hulihan ang parirala sa Hebreo, tunay na posible ang dalawang ugnayan. Ang instrumental na pagbasa ang pinakamaayos sa pangunahing teksto, ngunit hindi dapat alisin ang alternatibong pagbasa kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, marangal, at panalanging Tagalog. Ginamit ang “nanganganlong” upang mapanatili ang larawan ng kanlungan, at iniwasan ang mga salitang masyadong teknikal o makaluma. Ang ayos ng pangungusap ay bahagyang binago para maging malinaw kung paano inililigtas ng Diyos ang mga nanganganlong, habang ang tunay na sintaktikong kalabuan ay pinanatili sa talababa.
