base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: tl
  text: 'Panalangin ni David.


    Dinggin mo, Yahweh, ang katarungan; bigyang-pansin mo ang aking daing; pakinggan mo ang aking panalanging mula sa mga labing walang daya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ang katuwiran”; o, “ang makatarungang usapin.” Ang Hebreong צֶדֶק ay maaaring tumukoy sa katuwiran, katarungan, o isang makatarungang usapin; maaaring tumukoy rito sa makatarungang kaso ng nananalangin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Panalangin ni David
  rationale: Ang לְ sa pamagat ay likas na maisasalin bilang pag-aari o kaugnayan; pinananatili ng karaniwang anyong ito ang maikli at marangal na pamagat.
- source_word: צֶדֶק
  choice: ang matuwid kong usapin
  rationale: Maaaring mangahulugan ang salita ng katuwiran, katarungan, o isang makatarungang usapin. Sa konteksto ng pagsusumamo, malinaw sa Filipino ang 'matuwid kong usapin' habang kinikilala sa talababa ang tunay na lawak ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng titulong PANGINOON.
- source_word: רִנָּתִי
  choice: aking daing
  rationale: Bagaman maaari itong tumukoy sa isang malakas na sigaw, sa konteksto ng panalangin ay natural at angkop ang 'daing.'
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: mula sa mga labing walang pandaraya
  rationale: Pinananatili ang metonimiya ng 'mga labi' at ang pahayag na ang panalangin ay hindi nagmumula sa mapanlinlang na pananalita.
theological_decisions:
- issue: Kung ang צֶדֶק ay abstraktong 'katuwiran' o ang makatarungang usapin ng nananalangin
  choice: ang matuwid kong usapin
  alternative: ang katuwiran
  rationale: Ipinahihiwatig ng kasunod na paghingi na dinggin ang daing at panalangin na ang tinutukoy ay ang kanyang makatarungang kaso, ngunit inilalahad sa talababa ang mas literal at malawak na alternatibo upang hindi mawala ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magkatugmang pakiusap na 'Pakinggan,' 'bigyang-pansin,' at 'dinggin' upang mapanatili ang tatlong magkahanay na pandiwa sa Hebreo. Pinanatili ang pangalang Yahweh at ang larawang 'mga labi.'
