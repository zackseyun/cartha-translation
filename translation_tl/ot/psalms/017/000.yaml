  - severity: low
    issue: Ang “mga labing walang pandaraya” ay medyo mabigat sa modernong Filipino.
    rationale: Ang “mga labing walang daya” ay nananatiling matapat sa metonimiya ng Hebreo at mas likas sa daloy ng pangungusap.
