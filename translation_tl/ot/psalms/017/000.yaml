  naturalness: Marangal at malinaw ang pangkalahatang rehistro. Gayunman, mas likas at mas tuwiran ang “Dinggin mo ... ang katarungan” para sa unang pakiusap, at ang “mga labing walang daya” ay mas payak at natural kaysa “mga labing walang pandaraya.”
  terminology: Ang “Yahweh,” “panalangin,” at “daing” ay angkop. Ang “katarungan” ay pinananatiling malapit sa saklaw ng צֶדֶק nang hindi ipinipilit ang isang partikular na pagbasa. Ang talababa ay magbibigay ng “katuwiran” at “makatarungang usapin” bilang mga lehitimong posibilidad.
