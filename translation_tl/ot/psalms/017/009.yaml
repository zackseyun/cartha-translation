translation:
  language: tl
  text: 'mula sa masasamang sumasalanta sa akin,

    sa mga kaaway kong nagtatangka sa buhay ko at pumapalibot sa akin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “sa mga kaaway kong nakamamatay na pumapalibot sa akin.” Literal na kasama sa Hebreo ang salitang “buhay/kaluluwa” (נֶפֶשׁ). Maaaring inilalarawan nito ang mga kaaway na laban sa buhay ng mang-aawit, sa halip na basta ang tindi ng pagiging nakamamatay nila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: mula sa
  rationale: Ipinakikilala ng parirala ang pinagmumulan ng panganib na hinihinging ipagsanggalang ng mang-aawit; natural sa Filipino ang “mula sa.”
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Tumutukoy ang pangngalang pang-uri sa mga taong may sala o gumagawa ng masama, nang hindi nagdaragdag ng kasariang wala sa Hebreo.
- source_word: זוּ
  choice: na
  rationale: Ang sinaunang panandang pantukoy na ito ay nag-uugnay sa “masasama” at sa kilos nilang mapaminsala.
- source_word: שַׁדּוּנִי
  choice: naninira sa akin
  rationale: Ang pandiwang שׁדד ay nagpapahiwatig ng marahas na pamiminsala o pagwasak. Malinaw at natural ang “naninira” at hindi nito ipinipilit na lubos na napuksa na ang nagsasalita.
- source_word: אֹיְבַי
  choice: mga kaaway ko
  rationale: Tuwirang inilalarawan ang mga taong laban sa mang-aawit.
- source_word: בְּנֶפֶשׁ
  choice: nagtatangka sa buhay ko
  rationale: Sa konteksto, malamang na ipinahihiwatig ng נֶפֶשׁ ang buhay ng mang-aawit na pinupuntirya ng mga kaaway. Ginawang malinaw sa Filipino ang banta sa buhay, habang inilalahad sa talababa ang tunay na kalabuan ng parirala.
- source_word: יַקִּיפוּ עָלָי
  choice: pumapalibot sa akin
  rationale: Ipinahihiwatig ng Hiphil ng נקף kasama ng עַל ang pagkubkob o pagpalibot sa isang tao.
