  - severity: medium
    issue: Hindi natural at semantikong mali ang alternatibong “mortal kong mga kaaway.”
    rationale: Ang “mortal” ay hindi karaniwang katumbas ng “deadly” sa Filipino. Dapat ilahad ng talababa ang alternatibong pag-unawa na ang mga kaaway ay laban sa buhay ng mang-aawit, o sila ay nakamamatay.
