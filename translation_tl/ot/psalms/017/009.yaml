  source_fidelity: 'Ang pangkalahatang kahulugan ay tapat sa Hebreo: ang nagsasalita ay humihingi ng pag-iingat mula sa masasama at sa mga kaaway na nakapaligid sa kanya. Gayunman, ang “naninira” ay maaaring tumukoy lamang sa paninira o panlalait at kulang ang marahas na saklaw ng שׁדד. Ang “nagtatangka sa buhay ko” ay isang katanggap-tanggap na kontekstuwal na paglilinaw ng bְּנֶפֶשׁ, basta''t mapanatili sa talababa ang alternatibong pagbasa.'
  naturalness: Natural at marangal ang pangungusap sa makabagong Filipino. Mas tiyak at mas angkop sa marahas na konteksto ang “sumasalanta sa akin” kaysa “naninira sa akin.” Inihanay rin ang “nagtatangka sa buhay ko” bago ang “pumapalibot sa akin” upang mas malapit sa ayos ng Hebreo.
  terminology: Ang “masasama,” “mga kaaway ko,” at “buhay” ay angkop. Hindi angkop ang “mortal kong mga kaaway” bilang alternatibong salin, sapagkat ang “mortal” sa Filipino ay karaniwang nangangahulugang may kamatayan, hindi “nakamamatay” o “kaaway laban sa aking buhay.”
