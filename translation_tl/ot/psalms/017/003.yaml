  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: tl
  text: Sinuri mo ang puso ko; dinalaw mo ako sa gabi; sinubok mo ako; wala kang natagpuan.[a] Ipinasiya kong hindi lalabag ang aking bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, mas literal, “Ipinasiya ko; hindi lalampas ang aking bibig,” na maaaring tumukoy sa pasiyang huwag lumampas sa nararapat sa pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: Sinuri mo
  rationale: Ipinahahayag ng pandiwa ang masusing pagsusuri o pagsubok sa panloob na pagkatao; natural itong kaugnay ng “puso” sa Filipino.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili ang karaniwang larawang Hebreo para sa panloob na pagkatao, pag-iisip, at layunin.
- source_word: פָּקַדְתָּ לַּיְלָה
  choice: dinalaw mo ako sa gabi
  rationale: Pinananatili ng “dinalaw” ang idyomang Hebreo, habang ipinahihiwatig ng konteksto na ang pagdalaw ay may kasamang pagsisiyasat.
- source_word: צְרַפְתַּנִי
  choice: sinubok mo ako
  rationale: Bagaman mula sa larawan ng pagdadalisay ng metal ang pandiwa, ang kontekstuwal na diwa rito ay pagsusuri o pagsubok sa pagkatao.
- source_word: בַל תִּמְצָא
  choice: ngunit wala kang natagpuan
  rationale: Walang tahasang layon sa Hebreo. Pinananatili ng salin ang pagiging maikli at hindi nagdaragdag ng “kasamaan” o ibang tiyak na bagay.
- source_word: זַמֹּתִי
  choice: Ipinasiya ko
  rationale: Itinuturing itong pandiwang anyo na nagsasaad ng matatag na layunin o pasiya.
- source_word: בַל יַעֲבָר פִּי
  choice: hindi lalabag ang aking bibig
  rationale: Ang literal na “hindi lalampas ang aking bibig” ay tumutukoy sa hindi paglabag o paglampas sa hangganan sa pananalita; ang “lalabag” ay malinaw ngunit pinananatili ang moral na diin.
theological_decisions:
- issue: Pagpapakahulugan sa huling sugnay
  choice: Ipinasiya kong hindi lalabag ang aking bibig.
  alternative: Ang aking bibig ay hindi lumalabag; o, Ang aking bibig ay hindi lalampas sa aking ipinasiya.
  rationale: Siksik at mahirap ang Hebreo. Ang pagbasa sa זַמֹּתִי bilang pandiwang “ipinasiya ko” at sa kasunod na sugnay bilang nilalaman ng pasiya ay angkop sa konteksto, ngunit inilalahad sa talababa ang mas literal na pagkakabuo upang hindi maitago ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga larawang “puso” at “bibig,” gayundin ang maigsi at di-tiyak na layon ng “wala kang natagpuan.”
