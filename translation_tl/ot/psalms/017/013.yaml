  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: tl
  text: Bumangon ka, Yahweh! Harapin mo siya at pabagsakin mo siya. Iligtas mo ang buhay ko[a] mula sa taong masama sa pamamagitan ng iyong tabak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay nephesh, na maaari ring isaling “kaluluwa” o “sarili”; dito ay malamang na tumutukoy ito sa buhay na nanganganib.
    reason: lexical_alternative
  - marker: b
    text: 'O: “iligtas mo ang buhay ko mula sa taong masama, na siyang iyong tabak.” Maaari ring ilarawan ng Hebreo ang taong masama bilang kasangkapan sa kamay ni Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Pautos na anyo ng קום na tuwirang nakikiusap kay Yahweh na kumilos; natural at apurahan sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: קַדְּמָה פָנָיו
  choice: Harapin mo siya
  rationale: Literal na tumutukoy sa pagpunta sa harap ng kanyang mukha; sa konteksto ng pakikipaglaban, nangangahulugan itong salubungin o komprontahin ang kaaway.
- source_word: הַכְרִיעֵהוּ
  choice: pabagsakin
  rationale: Ang Hiphil na pautos mula sa כרע ay nagpapahayag ng pagpapayuko o pagpapababa sa kalaban; malinaw na naihahatid ng “pabagsakin” ang marahas na konteksto.
- source_word: פַּלְּטָה
  choice: Iligtas mo
  rationale: Karaniwang pandiwa para sa pagliligtas mula sa panganib; likas at marangal sa Tagalog.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa konteksto ng mortal na panganib, ang נֶפֶשׁ ay tumutukoy sa buhay o sarili, hindi kinakailangang sa isang di-materyal na kaluluwa.
- source_word: מֵרָשָׁע
  choice: mula sa taong masama
  rationale: Ang pang-isahang רָשָׁע ay tumutukoy rito sa partikular na masamang kalaban, kasuwato ng mga pang-isahang panghalip sa naunang mga sugnay.
- source_word: חַרְבֶּךָ
  choice: sa pamamagitan ng iyong tabak
  rationale: 'Ginagawang malinaw ang malamang na instrumental na ugnayan: ginagamit ni Yahweh ang kanyang tabak upang iligtas ang salmista, habang pinananatili sa talababa ang posibleng appositional na pagbasa.'
theological_decisions:
- issue: Ugnayan ng “iyong tabak” sa “taong masama”
  choice: 'Instrumental: inililigtas ni Yahweh ang salmista sa pamamagitan ng kanyang tabak.'
  alternative: 'Appositional: ang taong masama ang “iyong tabak,” samakatuwid ay isang kasangkapan sa kamay ni Yahweh.'
  rationale: Mas madaling umayon sa sunod-sunod na pakiusap para sa tuwirang pagkilos ng Diyos ang instrumental na pagbasa. Gayunman, siksik at maaaring unawain sa dalawang paraan ang Hebreong מֵרָשָׁע חַרְבֶּךָ, kaya pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa panalangin. Gumamit ng maiikling pautos upang mapanatili ang apurahang himig ng Hebreo; iniwasan ang labis na arkaiko o sektaryong pananalita.
