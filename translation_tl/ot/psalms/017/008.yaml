  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: tl
  text: Ingatan mo ako gaya ng balintataw ng mata[a]; ikubli mo ako sa lilim ng iyong mga pakpak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gaya ng itim ng mata.”
    reason: Alternatibong idyomatikong Tagalog para sa pupil ng mata; pinananatili nito ang konkretong larawan ng Hebreo nang hindi ito pinalalawak bilang paliwanag.
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Ingatan mo ako
  rationale: Ang שׁמר ay nangangahulugang mag-ingat, magbantay, o magpanatiling ligtas. Likas sa makabagong Tagalog ang “Ingatan mo ako” at malinaw nitong naipapahayag ang pakiusap para sa proteksiyon.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: gaya ng balintataw ng mata
  rationale: Tumutukoy ang idyomang Hebreo sa pupil o gitnang maitim na bahagi ng mata, na likas na maingat na pinangangalagaan. Ang “balintataw ng mata” ay tuwiran, maikli, at dignidadong salin sa Tagalog.
- source_word: בְּצֵל
  choice: sa lilim
  rationale: Ang צֵל ay maaaring “anino” o “lilim.” Sa konteksto ng mapagkalingang pagtatakip ng mga pakpak, mas natural sa Tagalog ang “sa lilim” habang pinananatili ang konkretong larawan.
- source_word: כְּנָפֶיךָ
  choice: ng iyong mga pakpak
  rationale: Ang כָּנָף ay “pakpak.” Pinananatili ng salin ang matalinghagang larawan ng pag-iingat ng Diyos sa halip na palitan ito ng paliwanag na “proteksiyon.”
- source_word: תַּסְתִּירֵנִי
  choice: ikubli mo ako
  rationale: Ang Hiphil ng סתר ay nangangahulugang ikubli o itago. Ang “ikubli mo ako” ay tuwiran at angkop sa marangal na pananalita ng tula, nang hindi ginagawang interpretatibong “kanlungan mo ako.”
theological_decisions:
- issue: Paglalarawan sa maingat na pinangangalagaang bahagi ng mata
  choice: 'Isinalin ang idyoma ayon sa konkretong tinutukoy nito: “balintataw ng mata.”'
  alternative: “parang itim ng mata” o isang malayang idyomang tumutukoy sa minamahal
  rationale: Ang talata ay gumagamit ng larawan ng isang maselan at maingat na iniingatang bahagi ng katawan. Pinananatili ng salin ang larawang ito nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Matalinghagang mga pakpak ng Diyos
  choice: Pinanatili ang “iyong mga pakpak.”
  alternative: “iyong pagkalinga” o “iyong proteksiyon”
  rationale: Tahasan sa Hebreo ang makatang larawan ng mga pakpak. Ang literal na pagpapanatili rito ay nag-iingat sa teolohikal at pampanitikang bisa ng talata nang hindi nilulutas ang metapora sa isang abstraktong paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “Ingatan,” “balintataw,” “ikubli,” at “lilim” upang mapanatili ang maikli, matindi, at makatang pakiusap ng Hebreo. Ang panghalip na isahan na “iyong” ay tumutugma sa kausap sa tekstong Hebreo.
