  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: tl
  text: Sa aming mga hakbang, ngayo’y pinalilibutan nila ako[a]; itinitig nila ang kanilang mga mata upang ibuwal ako sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na may paglipat ng panauhan ang Hebreo: “aming mga hakbang … pinalilibutan nila ako.” Maaari ring unawain ang unang parirala bilang, “Ang aming mga hakbang—ngayo’y pinalilibutan nila ako.”'
    reason: textual_variant
  - marker: b
    text: Walang tahasang layon na “ako” sa pariralang Hebreo. Maaari rin itong isalin, “itinitig nila ang kanilang mga mata upang ako’y mapayuko sa lupa,” o “upang ibagsak [ako] sa lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: sa aming mga hakbang
  rationale: Ang pangngalan ay tumutukoy sa mga hakbang o yapak. Ginamit ang pariralang may “sa” upang hindi ito gawing tuwirang layon ng pandiwang may tahasang hulaping isahan na “ako.”
- source_word: עַתָּה
  choice: ngayo’y
  rationale: Payak at likas na katumbas ng pang-abay na nagsasaad ng kasalukuyang panganib.
- source_word: סבבוני
  choice: pinalilibutan nila ako
  rationale: Pinananatili ang kahulugang “palibutan” at ang tahasang unang panauhang isahan na hulaping ־נִי (“ako”) sa tekstong Hebreo.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: itinitig nila ang kanilang mga mata
  rationale: Pinananatili ang matingkad na larawan ng mga matang sadyang itinutuon sa kanilang pakay; natural sa modernong Tagalog ang “itinitig.”
- source_word: לִנְטוֹת
  choice: upang ibuwal ako
  rationale: Sa mapanlabang konteksto, ipinahihiwatig ng pandiwa ang pagyuko o pagpapabagsak. Isinama sa teksto ang ipinahihiwatig na layong “ako,” ngunit itinala sa talababa na wala itong tahasang katumbas sa Hebreo.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Dito, ang אֶרֶץ ay kongkretong tumutukoy sa lupa o sa ibabaw ng daigdig, hindi sa isang lupain o bansa.
theological_decisions:
- issue: Paglipat mula sa maramihang “aming” tungo sa isahang “ako”
  choice: Pinanatili ang “sa aming mga hakbang … ako.”
  alternative: “Pinalilibutan nila ngayon ang aming mga hakbang” o pare-parehong maramihang pagtukoy.
  rationale: Ang Masoretikong teksto ay may maramihang hulapi sa “aming mga hakbang” ngunit tahasang isahang hulapi sa pandiwang “pinalilibutan nila ako.” Hindi dapat pakinisin ang tunay na paglipat ng panauhan.
- issue: Hindi tahasang layon ng לִנְטוֹת
  choice: “upang ibuwal ako sa lupa,” na may talababa tungkol sa elipsis at alternatibong pagbasa.
  alternative: “upang yumuko sa lupa” o “upang magpabagsak sa lupa.”
  rationale: Sinusuportahan ng konteksto ang masamang layuning ibagsak ang salmista, ngunit hindi tahasang binabanggit ng Hebreo ang layon at maaari ring iugnay ang pagyuko sa kanilang mga mata. Kaya pinanatili sa talababa ang gramatikal at leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang hindi pangkaraniwang paglipat mula “aming” tungo sa “ako” sa halip na gawing pare-pareho ang bilang; gumamit ng mga talababa upang ilahad ang tunay na sintaktiko at leksikal na kalabuan.
