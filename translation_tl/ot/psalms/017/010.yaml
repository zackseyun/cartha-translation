  text: They close up their fat hearts[a]; with their mouths they speak arrogantly.
translation:
  language: tl
  text: Naging manhid ang kanilang puso[a]; ang kanilang mga bibig ay nagsasalita nang may pagmamataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isinara nila ang kanilang taba.” Ang “taba” ay matalinghagang pananalita na maaaring tumukoy sa pusong naging manhid, sarado, o kampante sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: kanilang pusong pinataba
  rationale: Literal na tumutukoy sa “kanilang taba,” ngunit sa tulang Hebreo ay maaaring larawan ito ng pusong naging manhid o kampante sa kasaganaan. Idinagdag ang “puso” bilang ipinahihiwatig na bahagi, habang pinananatili ng “pinataba” ang kongkretong larawan at ang bahagyang kalabuan ng orihinal.
- source_word: סָּגְרוּ
  choice: isinasara
  rationale: Ang pandiwa ay nangangahulugang magsara o magkulong. Ang pangkasalukuyang anyo ay angkop sa patuloy na paglalarawan sa asal ng masasama sa konteksto.
- source_word: פִּימוֹ
  choice: kanilang mga bibig
  rationale: Bagaman kolektibong isahan ang anyo na may maramihang hulapi, natural sa Tagalog ang maramihang “mga bibig” para sa maramihang paksa.
- source_word: דִּבְּרוּ
  choice: nagsasalita
  rationale: Ang ganap na anyong Hebreo ay maaaring maglarawan dito ng karaniwang o nagpapatuloy na kilos; natural itong ipahayag sa pangkasalukuyang Tagalog.
- source_word: בְגֵאוּת
  choice: nang may pagmamataas
  rationale: Ipinahahayag nito ang mapagmataas o palalong paraan ng pagsasalita, nang hindi pinapahina ang negatibong moral na diwa.
