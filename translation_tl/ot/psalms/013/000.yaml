  text: For the choir director. A psalm of David[a].
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika. Isang salmo ni David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinulat ni David” o “para kay David.” Sa mga pamagat ng salmo, maaaring magpahiwatig ang Hebreo ng pag-akda o ng pagkakaugnay kay David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng salmo, tumutukoy ang salita sa taong nangangasiwa sa pagtatanghal ng musika. Mas malawak at mas tapat sa Hebreo ang “tagapangasiwa ng musika” kaysa “direktor ng koro,” yamang hindi tahasang binabanggit ang koro.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ito ang karaniwang katawagang pang-genre para sa awit na nilalapatan o sinasaliwan ng musika, at ang “salmo” ang kinikilalang likas na katumbas nito sa Filipino.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas sa Filipino ang “salmo ni David” at hindi nito kailangang ipasiya kung ang ugnayan ay tahasang pag-akda, pag-aalay, pag-uukol, o pagkakaugnay kay David.
theological_decisions:
- issue: Kahulugan ng לְדָוִד sa pamagat ng salmo
  choice: ni David
  alternative: isinulat ni David; para kay David
  rationale: Maaaring magpahiwatig ang pang-ukol na Hebreo ng pag-akda o ng mas malawak na pagkakaugnay o pag-uukol. Pinananatili ng “ni David” ang kalabuan sa natural na Filipino, at nililinaw sa talababa ang iba pang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino na maikli at marangal, angkop sa isang pamagat ng salmo. Ginamit ang “tagapangasiwa ng musika” upang maging malinaw sa karaniwang mambabasa nang hindi nililimitahan ang tungkulin sa pamamahala ng koro lamang.
