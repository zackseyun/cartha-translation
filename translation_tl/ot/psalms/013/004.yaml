  source_fidelity: Ang pangunahing salin ng אֶמּוֹט bilang “nanghihina” ay hindi sapat na tapat sa pandiwang מוט, na tumutukoy sa pagyanig, pagkatisod, o pagkawala ng katatagan, hindi pangunahing sa panghihina. Ang iba pang mga elemento—ang isahang “kaaway ko,” maramihang “mga kalaban ko,” at yabang na “Nadaig ko siya”—ay tapat sa Hebreo.
  naturalness: Natural at angkop sa makabagong Filipino ang daloy na “upang hindi sabihin ng kaaway ko ... at magsaya ang mga kalaban ko.” Mas malinaw at mas tumpak ang “ako’y natitinag” kaysa “ako’y nanghihina,” habang nananatiling patula at madaling maunawaan.
  terminology: Wasto ang “kaaway,” “kalaban,” at “nadaig.” Ang “natitinag” ay angkop na pangunahing katumbas ng אֶמּוֹט; ang “nadudulas” ay maaaring panatilihin bilang alternatibong larawan sa talababa.
