- source_word: כִּי
  choice: dahil
  rationale: Malinaw na ipinakikita ang sanhi ng pagsasaya ng mga kalaban.
- source_word: אֶמּוֹט
  choice: ako'y nanghihina
  rationale: Ipinahihiwatig ang pagkawala ng katatagan; inilalagay sa talababa ang mas literal na mga larawang “natitinag” at “nadudulas.”
