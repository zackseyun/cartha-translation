  rationale: Inayos ang nawawalang layon ng ‘sagutin,’ ginawang bokatibong mas natural ang pagtawag sa Diyos, at pinalitan ang panandang panglayunin ng panandang nagpapahayag ng kinatatakutang resulta. Pinanatili ang metapora ng mga mata at ang sadyang siksik, poetikong ugnayan ng pagtulog at kamatayan, nang walang pagpapasok ng doktrinal o interpretatibong pagpapaliwanag sa pangunahing teksto.
