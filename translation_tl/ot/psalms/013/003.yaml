base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: tl
  text: Tingnan mo ako at sagutin mo ako, Yahweh, Diyos ko; liwanagan mo ang aking mga mata[a], baka ako matulog sa kamatayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang larawang “liwanagan ang aking mga mata” ay maaaring tumukoy sa panibagong sigla, linaw, o pag-asa.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na siksik ang Hebreo: “baka ako matulog—kamatayan.” Maaari rin itong unawaing “matulog sa kamatayan”; tradisyonal na salin: “matulog ng tulog ng kamatayan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: Tingnan mo ako
  rationale: Ang pautos na anyo ng נבט ay panawagan na ibaling ng Diyos ang kanyang mapagmalasakit na pansin sa nagsasalita. Likas at tuwiran sa Filipino ang “Tingnan mo ako.”
- source_word: עֲנֵנִי
  choice: sagutin
  rationale: Sa konteksto ng panalangin, karaniwang nangangahulugang “sagutin” ang ענה. Hindi nito idinaragdag sa salin ang ideyang tiyak na paborable ang tugon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָי
  choice: aking Diyos
  rationale: Tuwirang ipinapahayag ang unang panauhang pag-aari at ang personal na paglapit ng salmista.
- source_word: הָאִירָה עֵינַי
  choice: bigyang-liwanag mo ang aking mga mata
  rationale: Pinananatili ang larawang Hebreo ng pagbibigay-liwanag sa mga mata, na maaaring tumukoy sa panibagong sigla, linaw, o pag-asa nang hindi nililimitahan sa isa lamang.
- source_word: פֶּן
  choice: upang hindi
  rationale: Likas sa modernong Filipino at malinaw na ipinakikilala ang kinatatakutang kahihinatnan.
- source_word: אִישַׁן הַמָּוֶת
  choice: makatulog sa kamatayan
  rationale: Malapit ito sa maigsi at siksik na larawang Hebreo, “matulog [ng/sa] kamatayan,” at hindi nagdaragdag ng ikalawang pangngalang “tulog” sa pangunahing teksto.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulong “PANGINOON.”
- issue: Larawang “bigyang-liwanag ang aking mga mata”
  choice: Panatilihin ang metapora
  alternative: Ibalik mo ang aking lakas / bigyan mo ako ng pag-asa
  rationale: Maaaring saklawin ng larawan ang panibagong sigla, linaw, at pag-asa. Hindi ito tahasang nililinaw ng teksto, kaya hindi dapat ikulong ang salin sa iisang pakahulugan.
- issue: Ugnayan ng pagtulog at kamatayan
  choice: makatulog sa kamatayan
  alternative: matulog ng tulog ng kamatayan
  rationale: Pinananatili ang metaporang kamatayan bilang pagtulog at ang kakaibang siksik na pahayag, habang inilalagay sa talababa ang tradisyonal na mas pinalawak na anyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may tuwiran at taimtim na himig ng panalangin. Ginamit ang “upang hindi” sa halip na mas arkaikong “baka,” at pinanatili ang masidhing metapora ng tekstong Hebreo.
