id: PSA.13.1
reference: Psalms 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: tl
  text: Hanggang kailan, Yahweh? Kalilimutan mo ba ako magpakailanman? Hanggang kailan mo ikukubli sa akin ang iyong mukha[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “ang iyong presensiya” o “ang iyong lingap.” Sa Hebreo, ang pagkukubli ng mukha ay maaaring mangahulugan ng pagkakait ng presensiya o lingap.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Hanggang kailan
  rationale: Likas na katumbas sa Filipino ng tanong tungkol sa tagal; pinananatili rin ng pag-uulit ang mariing daing ng salmista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: תִּשְׁכָּחֵנִי
  choice: Kalilimutan mo ba ako
  rationale: Pinananatili ang payak na kahulugan ng pandiwang שׁכח at ang anyong patanong ng hinaing; hindi ito pinahina bilang simpleng hindi pagpansin.
- source_word: נֶצַח
  choice: magpakailanman
  rationale: Ipinahahayag ang matinding reklamo ng salmista na tila walang katapusan ang pagkalimot sa kaniya.
- source_word: תַּסְתִּיר
  choice: ikukubli
  rationale: Ang Hiphil ng סתר ay nagsasaad ng pagtatago o pagkukubli; ang “ikukubli” ay natural at marangal sa wikang panulaan.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang konkretong larawang Hebreo sa halip na ipalit agad ang ipinahihiwatig nitong presensiya o lingap.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Sa pariralang Filipino na “ikubli sa akin,” natural nitong ipinahahayag ang paglalayo o pagkakait ng mukha sa nagsasalita.
theological_decisions:
- issue: Paglalarawan sa tila pagkalimot ng Diyos
  choice: 'Panatilihin bilang tuwirang tanong ng hinaing: “Kalilimutan mo ba ako magpakailanman?”'
  alternative: Ipaliwanag o pahinain bilang pakiramdam lamang ng salmista na hindi siya pinapansin
  rationale: Ang talata mismo ay gumagamit ng matapang na wika ng panaghoy. Hindi dapat lutasin sa salin ang teolohikal na tensiyon sa pagitan ng karanasan ng salmista at ng katapatan ng Diyos.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Nasa tekstong Hebreo ang banal na pangalan mismo; pinananatili ito bilang pangalan at hindi pinapalitan ng titulo.
- issue: Kahulugan ng “iyong mukha”
  choice: Panatilihin ang “iyong mukha” sa pangunahing teksto
  alternative: ang iyong presensiya o lingap
  rationale: Ang “mukha” ay mismong larawan ng Hebreo at maaaring magpahiwatig ng presensiya at lingap. Pinananatili ng literal na larawan ang lawak at puwersa ng idyoma.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig ng panaghoy. Ang dalawang ulit na “Hanggang kailan” ay pinanatili para sa ritmo at diin. Hinati ang unang sugnay upang maging malinaw at natural ang pambihirang pagsasama ng “hanggang kailan” at “magpakailanman,” nang hindi inaalis ang sinasadyang tensiyon nito.
