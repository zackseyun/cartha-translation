    text: O “Hanggang kailan magtatagumpay laban sa akin ang aking kaaway?” Mas literal sa Hebreo, “maitaas sa ibabaw ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Hanggang kailan
  rationale: Likas na pananalita ng panaghoy sa Tagalog at pinananatili ang inuulit na tanong.
- source_word: אָשִׁית עֵצוֹת
  choice: magpapasan ng mga balak
  rationale: Ang pandiwa ay literal na ‘maglagay/magtakda,’ at ang pangngalan ay ‘mga payo/balak.’ Sa konteksto, ipinahihiwatig ng parirala ang mabigat at paulit-ulit na pagbabalak sa sarili; pinananatili ng ‘mga balak’ ang anyong maramihan.
- source_word: בְּנַפְשִׁי
  choice: sa aking kalooban
  rationale: Tumutukoy ang נֶפֶשׁ dito sa panloob na sarili. Ang ‘kalooban’ ay natural at marangal sa modernong Tagalog nang hindi nililimitahan ito sa isip lamang.
- source_word: יָגוֹן
  choice: dalamhati
  rationale: Malinaw na ipinapahayag ang malalim na lungkot at angkop sa makatang rehistro ng Awit.
- source_word: בִּלְבָבִי
  choice: sa puso ko
  rationale: Pinananatili ang Hebreong larawan ng puso bilang sentro ng panloob na buhay.
- source_word: יוֹמָם
  choice: buong araw
  rationale: Ipinahahayag ang patuloy na tagal sa maghapon; ang alternatibong ‘sa araw’ ay maaari ring tumukoy sa kaibahan ng araw at gabi.
- source_word: יָרוּם
  choice: magmamataas
  rationale: Pinananatili ang larawang patayo ng pagiging mataas sa ibabaw ng iba, habang natural sa Tagalog bilang pag-angat o pangingibabaw ng kaaway.
- source_word: אֹיְבִי עָלָי
  choice: sa akin ang aking kaaway
  rationale: Ang ‘sa akin’ kasama ng ‘magmamataas’ ay nagpapahiwatig ng pangingibabaw; hindi ito ginawang tuwirang ‘magtagumpay’ sa pangunahing teksto upang mapanatili ang metapora.
