  text: Hanggang kailan ako maglalatag ng mga balak sa aking kalooban[a], na may dalamhati sa puso ko buong araw? Hanggang kailan mangingibabaw sa akin ang aking kaaway?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hanggang kailan ako maglalagay ng mga balak sa aking sarili?”
    reason: lexical_alternative
