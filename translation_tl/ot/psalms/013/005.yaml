base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: tl
  text: 'Ngunit ako nama’y nagtiwala sa iyong tapat na pag-ibig;

    magagalak ang puso ko sa iyong pagliligtas.[a]

    Aawit ako kay Yahweh,

    sapagkat sagana ang kabutihang ipinakita niya sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaligtasan.” Ang salitang Hebreo ay maaaring tumukoy sa pagligtas mula sa kasalukuyang kagipitan gayundin sa kaligtasan sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako nama’y
  rationale: Ipinapakita ng “ngunit” ang pagsalungat sa naunang panaghoy, at binibigyang-diin ng “ako nama’y” ang panghalip nang natural sa modernong Tagalog.
- source_word: בְּחַסְדְּךָ
  choice: sa iyong tapat na pag-ibig
  rationale: Sinasaklaw nito ang mapagmahal, matatag, at matapat na diwa ng חֶסֶד nang hindi nililimitahan sa awa lamang.
- source_word: בָטַחְתִּי
  choice: nagtiwala
  rationale: Pinananatili ng aspektong naganap ang buo at matatag na pagtitiwala ng nagsasalita, habang malinaw sa konteksto na nananatili ang bisa nito.
- source_word: יָגֵל לִבִּי
  choice: magagalak ang puso ko
  rationale: Likas na ipinahahayag sa Filipino ang inaasahang kagalakan ng buong panloob na pagkatao.
- source_word: בִּישׁוּעָתֶךָ
  choice: sa iyong pagliligtas
  rationale: Ang “pagliligtas” ay malinaw na tumutukoy sa pagkilos ng Diyos upang iligtas mula sa kasalukuyang panganib, ngunit maaari ring taglayin ang mas malawak na diwa ng kaligtasan.
- source_word: אָשִׁירָה
  choice: Aawit ako
  rationale: Ipinahahayag nito sa natural na Tagalog ang pasiya o determinasyong taglay ng Hebrew cohortative.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang יְהוָה bilang “Yahweh.”
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng pag-awit at angkop ito sa marangal na himig ng salmo.
- source_word: גָמַל עָלָי
  choice: sagana ang kabutihang ginawa niya sa akin
  rationale: Ipinahahayag nito ang ganap at masaganang pakikitungo ng Diyos nang hindi ginagawang transaksiyonal ang pahayag.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan.
- issue: Lawak ng kahulugan ng יְשׁוּעָה
  choice: pagliligtas
  alternative: kaligtasan
  rationale: Ang agarang konteksto ay pagligtas mula sa matinding kalagayan, ngunit hindi isinasara ang mas malawak na teolohikal na diwa; pinananatili sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panulaan, ngunit madaling maunawaan. Pinanatili ang parallelism at paghahati ng mga linya ng salmo nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
