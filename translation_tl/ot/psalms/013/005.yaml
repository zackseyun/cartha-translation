    issue: Hindi gaanong idiomatiko ang “sagana ang kabutihang ginawa niya sa akin.”
    rationale: Bagaman nauunawaan, hindi ito ang pinakalikas na modernong Tagalog at hindi agad malinaw kung ang “sagana” ay tumutukoy sa kabutihan o sa paraan ng paggawa. Ang “sagana ang kabutihang ipinakita niya sa akin” ay mas malinaw at pinananatili ang diwa ng masaganang mabuting pakikitungo.
