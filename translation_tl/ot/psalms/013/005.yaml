  rationale: Pinalitan lamang ang huling pananalita upang maging mas natural at malinaw sa modernong Tagalog, habang pinananatili ang kahulugang ang Diyos ay nakitungo nang mabuti at sagana sa nagsasalita. Walang pagbabago sa saklaw ng kahulugan o sa anchor ng talababa.
