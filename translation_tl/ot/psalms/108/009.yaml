base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: tl
  text: Ang Moab ay aking palanggana na panghugas[a]; sa Edom ay ihahagis ko ang aking sandalyas[b]; sa ibabaw ng Filistia ay sisigaw ako ng tagumpay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking palayok na panghugas.” Ang larawan sa Hebreo ay isang sisidlang ginagamit sa paghuhugas at nagpapahiwatig ng pagpapahiya o pagpapasakop sa Moab.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ihahagis ko ang aking sapatos.” Malamang na sumasagisag ang kilos sa kapamahalaan o pag-angkin sa Edom.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “laban sa Filistia ay sisigaw ako” o “sa Filistia ay magbubunyi ako.” Ang pandiwang Hebreo ay maaaring tumukoy sa masayang sigaw o sigaw sa digmaan.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: aking palanggana para sa paghuhugas
  rationale: Ang סִיר ay isang sisidlan o palanggana, at nililinaw ng רַחְצִי na ginagamit ito sa paghuhugas. Pinananatili ng parirala ang kongkretong larawan habang gumagamit ng karaniwan at malinaw na modernong Filipino.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: ihahagis ko ang aking sandalyas
  rationale: Ang Hiphil na anyo ng שלך ay nangangahulugang maghagis, at ang נַעַל ay kasuotang panpaa. Ang “sandalyas” ay angkop sa sinaunang konteksto at pinananatili ang larawan sa halip na palitan ito ng pagpapakahulugang “aangkinin ko.”
- source_word: עַל / עֲלֵי
  choice: sa / sa ibabaw ng
  rationale: Malawak ang saklaw ng pang-ukol na עַל. Ang “sa Edom” ay natural para sa paghagis ng sandalyas, samantalang ang “sa ibabaw ng Filistia” ay nagpapanatili sa aspektong pansaklaw ng sigaw nang hindi lubusang nilulutas kung ito ay laban, ukol, o ibabaw ng nasakop na lupain.
- source_word: אֶתְרוֹעָע
  choice: sisigaw ako sa pagtatagumpay
  rationale: Ang pandiwa ay tumutukoy sa malakas na sigaw na maaaring masaya o pandigma. Ipinahihiwatig ng konteksto ang tagumpay, ngunit pinananatili pa rin ang aktuwal na kilos ng pagsigaw.
- source_word: פְלֶשֶׁת
  choice: Filistia
  rationale: Pangalan ito ng lupain o rehiyon, hindi tuwirang katawagan sa mga mamamayan nito; kaya “Filistia” ang mas malapit sa anyo ng Hebreo.
- source_word: מוֹאָב / אֱדוֹם
  choice: Moab / Edom
  rationale: Ginamit ang nakaugaliang modernong anyo sa Filipino ng mga pangalang pantangi.
theological_decisions:
- issue: Matalinghagang pananalita tungkol sa paghahari at pagpapasakop sa mga bansang kaaway
  choice: Pinanatili ang kongkretong mga larawan ng palanggana, paghagis ng sandalyas, at sigaw ng pagtatagumpay.
  alternative: Tahasang ipakahulugan ang mga ito bilang pagpapahiya, pag-angkin, at pananakop sa Moab, Edom, at Filistia.
  rationale: Matingkad at sadyang matalinghaga ang tulang Hebreo. Ang pagpapaliwanag sa simbolismo sa mga talababa, sa halip na ipalit iyon sa mismong teksto, ay umiiwas sa labis na pagtiyak sa kahulugan at nagpapanatili sa tensiyong patula.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli at matinding paralelismo ng tulang Hebreo, pati ang mga kongkretong larawan nito. Ginamit ang mga anyong panghinaharap na “ihahagis” at “sisigaw” upang katawanin ang di-ganap na mga pandiwang Hebreo sa konteksto ng pahayag ng pagkilos.
