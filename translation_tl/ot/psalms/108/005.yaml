    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Mataas ka nawa
  rationale: Ang anyong pautos/pakiusap mula sa רום ay humihiling na ang Diyos ay maging mataas o dakilain. Pinananatili ng “nawa” ang himig ng panalangin nang hindi ginagawang tahasang pasibo ang pandiwang Hebreo.
- source_word: עַל שָׁמַיִם
  choice: sa ibabaw ng kalangitan
  rationale: Ipinakikita ng “sa ibabaw” ang patayong larawan ng pagiging higit na mataas, at ang “kalangitan” ay likas na panumbas sa maramihang anyong Hebreo.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang kinakausap ang Diyos; malinaw at marangal sa Filipino ang pantawag na “O Diyos.”
- source_word: וְעַל כָּל הָאָרֶץ
  choice: at sa ibabaw ng buong lupa
  rationale: Pinananatili ang pagkakasunod at kosmikong pagtutulad ng kalangitan at lupa. Sa kontekstong ito, ang הָאָרֶץ ay ang buong daigdig, hindi isang tiyak na lupain.
- source_word: כְבוֹדֶךָ
  choice: ang iyong kaluwalhatian
  rationale: Sa konteksto ng pagpupuri sa Diyos, ang “kaluwalhatian” ang likas at malawak na panumbas sa כָּבוֹד, na sumasaklaw sa dangal, karilagan, at kadakilaan.
theological_decisions:
- issue: Walang hayag na pandiwa sa ikalawang taludtod
  choice: at sa ibabaw ng buong lupa ang iyong kaluwalhatian
  alternative: at mapasa ibabaw ng buong lupa ang iyong kaluwalhatian
  rationale: Verbless ang ikalawang sugnay sa Hebreo. Pinananatili ng salin ang matulaing pagkakaltas at ang tunay na posibilidad na marinig ito bilang kaparis na kahilingan o bilang pahayag, sa halip na tahasang magdagdag ng pandiwang magpapasya sa kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may anyong patula. Ginamit ang “iyong” sa halip na “mo” upang panatilihin ang pormal na himig. Sadyang hindi dinagdagan ng pandiwa ang ikalawang taludtod upang mapanatili ang pagkakaltas at tensiyong gramatikal ng Hebreo.
