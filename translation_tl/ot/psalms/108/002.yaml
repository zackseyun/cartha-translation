lexical_decisions:
- source_word: עוּרָה
  choice: Gumising ka
  rationale: Tuwirang pautos na patulang itinuturing na parang buhay ang mga instrumentong tinatawag; pinananatili rin nito ang pag-uulit ng ugat עור sa kasunod na pandiwa.
- source_word: הַנֵּבֶל
  choice: alpa
  rationale: Karaniwan at madaling maunawaang makabagong katawagan para sa isang instrumentong de-kuwerdas; iniiwasan ang arkaikong katawagan.
- source_word: וְכִנּוֹר
  choice: at lira
  rationale: Ang כינור ay karaniwang kinikilalang lira; ang hiwalay na katawagan ay nagpapanatili sa dalawang magkaibang instrumentong nasa paralelismo.
- source_word: אָעִירָה
  choice: Gigisingin ko
  rationale: Ipinahahayag ang kusang pasiya ng nagsasalita at inuulit ang konsepto ng paggising mula sa unang pandiwa.
- source_word: שָּׁחַר
  choice: ang bukang-liwayway
  rationale: Natural at marangal na salin ng bukang-araw, habang pinananatili ang matingkad na personipikasyon na para bang gigisingin ng mang-aawit ang bukang-liwayway.
