  text: Gumising kayo, alpa at lira! Gigisingin ko ang bukang-liwayway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Pupukawin ko ang umaga.” Matingkad na larawang patula ito sa Hebreo: bumabangon ang mang-aawit bago magbukang-liwayway upang magpuri sa Diyos.'
