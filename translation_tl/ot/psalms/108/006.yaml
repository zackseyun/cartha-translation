  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: tl
  text: Upang masagip ang mga minamahal mo[a], magligtas ka sa pamamagitan ng iyong kanang kamay at sagutin mo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mailigtas” sa halip na “masagip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Upang
  rationale: Likas at malinaw na nagpapakilala ng layunin o inaasahang resulta, habang pinananatili ang ugnayan ng mga sugnay.
- source_word: יֵחָלְצוּן
  choice: masagip
  rationale: Ipinahahayag ang diwang pasibo ng Nifal ng חלץ—ang mailabas sa panganib o mapalaya. Ang “masagip” ay natural at matingkad sa konteksto ng panalangin.
- source_word: יְדִידֶיךָ
  choice: ang mga minamahal mo
  rationale: Pinananatili ang maramihan at ang diwa ng mga taong mahal ng Diyos nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: הוֹשִׁיעָה
  choice: magligtas ka
  rationale: Tuwirang utos mula sa ישׁע. Ang anyong “magligtas ka” ay hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: יְמִינְךָ
  choice: sa pamamagitan ng iyong kanang kamay
  rationale: Malinaw na ipinakikita ang gamit o paraan, at pinananatili ang larawan ng kanang kamay bilang kapangyarihang kumikilos.
- source_word: וַעֲנֵנִי
  choice: at sagutin mo ako
  rationale: Pinananatili ang unang panauhang isahan na hulapi at ang tuwirang pakiusap ng salmista.
theological_decisions:
- issue: Paglipat mula sa maramihang makikinabang tungo sa isang nagsusumamo
  choice: Panatilihin ang “mga minamahal mo” at “sagutin mo ako.”
  alternative: Gawing maramihan ang hulí, gaya ng “sagutin mo kami.”
  rationale: Sadyang lumilipat ang tekstong Hebreo mula sa pamayanan patungo sa indibidwal na nagsasalita. Hindi ito dapat pagtugmain sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng panalangin, ang larawan ng kanang kamay, at ang paglipat mula sa maramihan tungo sa isahan.
