  text: A song, a psalm of David[a].
translation:
  language: tl
  text: Isang awit, isang salmo ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula kay David” o “para kay David”; maaaring magpahiwatig ang Hebreo ng pagkatha, pag-aalay, pag-aari, o kaugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר
  choice: awit
  rationale: Karaniwang tumutukoy ang pangngalan sa isang awit. Pinananatili ng payak na “awit” ang pagkakaiba nito sa kasunod na katawagang מִזְמוֹר nang hindi nililimitahan ang uri nito sa awit ng papuri.
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Sa mga pamagat ng Mga Awit, ito ang kinikilalang katawagan para sa isang lirikal na komposisyong karaniwang may kaugnayan sa musika.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas sa Filipino ang “ni David” bilang maikli at marangal na anyo sa pamagat. Maaari itong magpahiwatig ng pagkatha, pag-aari, o kaugnayan, kaya hindi nito tahasang nilulutas ang saklaw ng Hebreong לְ.
theological_decisions:
- issue: Kahulugan ng pagbanggit kay David sa pamagat
  choice: Panatilihin ang bahagyang malabong “ni David.”
  alternative: “isinulat ni David” o “para kay David”
  rationale: Maaaring magpahiwatig ang Hebreong לְדָוִד ng pagkatha, pag-aalay, pag-aari, o kaugnayan. Hindi dapat gawing mas tiyak ng salin ang hindi tahasang tinutukoy ng teksto.
translation_notes:
  register: Maikli, marangal, at likas na modernong Filipino ang anyo. Pinanatili ang dalawang magkatabing katawagang pangmusika na “awit” at “salmo,” at inilagay ang talababa pagkatapos ng pariralang “ni David,” na siyang ipinaliliwanag nito.
