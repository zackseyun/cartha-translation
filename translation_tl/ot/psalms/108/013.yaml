  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: tl
  text: Sa tulong ng Diyos, gagawa tayo nang buong tapang[a], at siya ang yuyurak sa ating mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gagawa tayo ng mga dakilang bagay”; maaaring idiin ng idyomang Hebreo ang lakas, kagitingan, o matagumpay na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Sa tulong ng Diyos
  rationale: 'Ipinahihiwatig ng בְּ ang pakikisama o paraan: kikilos ang bayan na umaasa sa tulong ng Diyos. Likas ito sa makabagong Tagalog at hindi nito lubhang nililimitahan ang kahulugan sa instrumento lamang.'
- source_word: נַעֲשֶׂה
  choice: gagawa tayo
  rationale: Pinananatili ang payak na pandiwang עשה at ang unang panauhang maramihan, na nasa aspektong di-ganap at tumutukoy rito sa inaasahang pagkilos.
- source_word: חָיִל
  choice: nang buong tapang
  rationale: Sa kontekstong pandigma, ang חַיִל ay maaaring tumukoy sa lakas, kagitingan, o matagumpay na pagkilos. Ang pariralang ito ay natural sa Tagalog at pinananatili ang idyomatikong diwa nang hindi tahasang ipinapalagay ang tagumpay.
- source_word: וְהוּא
  choice: at siya ang
  rationale: Pinananatili ang payak na pag-uugnay at binibigyang-diin ang tahasang panghalip, na naglilipat ng pansin mula sa pagkilos ng bayan tungo sa mapagpasyang pagkilos ng Diyos.
- source_word: יָבוּס
  choice: yuyurak
  rationale: Matingkad na katumbas ito ng בוס, na nangangahulugang tumapak o yumurak, at pinananatili ang larawang pandigma ng lubos na pagkatalo.
- source_word: צָרֵינוּ
  choice: ating mga kaaway
  rationale: Malinaw at karaniwang salin ng mga kumakalaban sa bayan; angkop sa dignidad at tulang himig ng Awit.
theological_decisions:
- issue: Ang kumikilos sa pagtatagumpay
  choice: Parehong pinananatili ang pagkilos ng bayan sa pag-asa sa Diyos at ang mapagpasyang pagkilos mismo ng Diyos.
  alternative: Maaaring gawing lubos na Diyos lamang ang kumikilos, o gawing pansuporta lamang ang papel niya sa pagkilos ng tao.
  rationale: Tahasan sa Hebreo ang “gagawa tayo” kasabay ng “siya ang yuyurak.” Hindi pinag-iisa o pinapawi ng salin ang dalawang magkaugnay ngunit magkaibang pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “buong tapang” upang natural na maipahayag ang idyomang עשה חיל, habang ang “yuyurak” ay nagpapanatili sa matingkad na larawang pandigma.
