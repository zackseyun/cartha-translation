translation:
  language: tl
  text: Hindi ba itinakwil mo kami[a], O Diyos? At hindi ka ba lumalabas kasama ng aming mga hukbo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinaboy mo kami.” Ang pandiwang Hebreo ay maaaring magpahayag ng mariing pagtatakwil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Naghuhudyat ito ng retorikal na tanong na umaasang sasang-ayon ang kausap; pinananatili ng “Hindi ba” ang puwersang patanong sa natural na Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, ang mga pandiwa ay nasa isahan at tumutukoy ito sa Diyos ng Israel.
- source_word: זְנַחְתָּנוּ
  choice: itinakwil mo kami
  rationale: Ang זנח ay nagpapahayag ng mariin o puwersahang pagtanggi at pagtataboy. Ang “itinakwil” ay malinaw, marangal, at nagpapanatili sa bigat ng panaghoy.
- source_word: וְלֹא
  choice: At hindi ... ba
  rationale: Pinananatili ang payak na pag-uugnay at pagtanggi ng Hebreo, habang likas na ipinagpapatuloy sa Tagalog ang retorikal na tanong.
- source_word: תֵצֵא
  choice: lumalabas
  rationale: Ang di-ganap na pandiwa ay maaaring magpahayag ng kasalukuyan o karaniwang pagkilos sa konteksto ng panaghoy. Hindi ito pinalakas tungo sa mas interpretatibong “nakikidigma.”
- source_word: בְּצִבְאֹתֵינוּ
  choice: na kasama ng aming mga hukbo
  rationale: Sa kontekstong militar, ang צבא ay “hukbo”; ang pang-ukol ב ay natural na nagpapahayag rito ng pagsama o pagsuporta.
theological_decisions:
- issue: Ang pananalita tungkol sa pagtatakwil ng Diyos sa panaghoy
  choice: Isinalin bilang tuwirang daing na itinakwil ng Diyos ang kanyang bayan at hindi siya lumalabas na kasama ng kanilang mga hukbo.
  alternative: Palambutin bilang “iniwan mo kami” o “hindi ka sumama sa amin.”
  rationale: Malakas ang salitang Hebreo na זנח. Pinananatili ng salin ang teolohikal na tensiyon at tapang ng panaghoy sa halip na pahinain o ipaliwanag agad ang paratang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “O Diyos” bilang likas na tuwirang pagtawag at “mga hukbo” para sa malinaw na kontekstong militar; pinanatili ang dalawang magkaugnay na retorikal na tanong.
