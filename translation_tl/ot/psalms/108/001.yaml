  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: tl
  text: Matatag ang puso ko, O Diyos; aawit ako at tutugtog, maging ang aking kaluwalhatian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buo kong pagkatao.” Literal sa Hebreo, “ang aking kaluwalhatian,” isang makatang pahayag na maaaring tumukoy sa panloob na pagkatao ng nagsasalita, o maging sa dila bilang kasangkapan ng pagpupuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: matatag
  rationale: Ipinahahayag ng salita ang pagiging matibay, matatag, o handa. Sa konteksto ng pasiyang magpuri, likas na ipinahahayag ng “matatag” ang panloob na katatagan at matibay na kapasiyahan.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Sa Hebreo, ang “puso” ay karaniwang tumutukoy sa kalooban, damdamin, at panloob na pagkatao; malinaw at likas din ang ganitong gamit sa Tagalog.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang kinakausap dito ang Diyos. Pinananatili ng “O Diyos” ang marangal at makatang anyo ng pagtawag.
- source_word: אָשִׁירָה
  choice: aawit ako
  rationale: Ang cohortative ay nagpapahayag ng kusang-loob at matibay na pasiya. Ang “aawit ako” ay natural na naghahatid ng intensiyong iyon.
- source_word: וַאֲזַמְּרָה
  choice: at tutugtog
  rationale: Ang זמר sa piel ay maaaring tumukoy sa pagtugtog o paglikha ng musikang papuri. Ang “tutugtog” ay umiiwas sa paulit-ulit na “aawit” at pinananatili ang posibleng instrumental na diwa.
- source_word: אַף
  choice: pati
  rationale: Pinalalawak at binibigyang-diin nito ang pahayag patungo sa huling parirala. Likas sa Tagalog ang “pati” para sa ganitong pagdaragdag.
- source_word: כְּבוֹדִי
  choice: ang aking kaluwalhatian
  rationale: Literal itong “aking kaluwalhatian.” Dahil makata at hindi tiyak kung tumutukoy sa buong pagkatao, kaluluwa, o dila, pinananatili sa teksto ang larawan at inilalagay sa talababa ang mga posibleng kahulugan.
theological_decisions:
- issue: Kahulugan ng כְּבוֹדִי sa wikang patula ng pagpupuri
  choice: ang aking kaluwalhatian
  alternative: ang buo kong pagkatao; ang aking kaluluwa; ang aking dila
  rationale: Hindi ganap na tiyak ang tinutukoy ng metaporang Hebreo. Ang literal-makatang salin ay nagpapanatili sa tunay na kalabuan sa halip na pumili agad ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at makata ngunit madaling maunawaan. Pinanatili ang tradisyonal na bokatibong “O Diyos” at ang sadyang di-tiyak na larawang “aking kaluwalhatian.”
