  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: tl
  text: Sino ang magdadala sa akin sa pinatibay na lungsod? Sino ang aakay sa akin hanggang sa Edom?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinatibay na lungsod” ay maaaring tumukoy sa isang tiyak na tanggulan sa Edom, na tradisyonal na iniuugnay ng marami sa Sela/Petra, ngunit hindi pinangalanan ng tekstong Hebreo ang lungsod.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, ang ikalawang pandiwa ay pormal na nasa anyong maaaring isaling “umakay na sa akin,” ngunit maaari itong unawain na may diwang hinaharap ayon sa parallelismo sa unang tanong.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Likas at tuwirang katumbas ng panghalip na pananong na nagbubukas sa bawat retorikal na tanong.
- source_word: יֹבִלֵנִי
  choice: magdadala sa akin
  rationale: Ang Hiphil ng יבל ay nagsasaad ng pagpaparating o pag-akay sa isang patutunguhan; malinaw at natural dito ang “magdadala sa akin.”
- source_word: עִיר מִבְצָר
  choice: napapaderang lungsod
  rationale: Ang tambalang Hebreo ay tumutukoy sa isang lungsod na pinatibay bilang tanggulan. Ang “napapaderang lungsod” ay madaling maunawaan at hindi ipinapalagay sa pangunahing teksto kung aling tiyak na lungsod ito.
- source_word: נָחַנִי
  choice: mangunguna sa akin
  rationale: Bagaman pormal na qatal ang anyo, ang pandiwa ay nasa magkatulad na patulang tanong kasama ng imperfect sa unang taludtod at likas na may hinaharap o modal na diwa rito. Pinananatili ng “mangunguna” ang kahulugang umakay o gumabay.
- source_word: עַד אֱדוֹם
  choice: hanggang sa Edom
  rationale: Pinananatili ng “hanggang sa” ang diwa ng hangganan o lawak na karaniwang ipinahahayag ng עַד, habang natural pa rin sa Filipino.
theological_decisions:
- issue: Panahunan ng נָחַנִי
  choice: Isinalin sa hinaharap/modal na “mangunguna sa akin.”
  alternative: “Sino ang nanguna sa akin” o “sino ang umakay sa akin.”
  rationale: Ang pormal na perfect ay nasa parallelismo sa unang tanong na may imperfect; sa konteksto, ang dalawang taludtod ay kapuwa nakaharap sa inaasahang pag-akay. Binabanggit sa talababa ang pormal na alternatibo upang hindi maitago ang anyong Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “napapaderang lungsod” kaysa mas teknikal na “pinatibay na lungsod,” at pinanatili ang patulang parallelismo ng dalawang tanong.
