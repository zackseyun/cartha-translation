base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: tl
  text: 'Nagsalita ang Diyos sa kanyang kabanalan[a]: “Ako''y magbubunyi[b]; hahatiin ko ang Shekem at susukatin ko ang Lambak ng Sucot.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanyang banal na dako” o “sa pamamagitan ng kanyang kabanalan.” Ang pariralang Hebreo ay maaaring tumukoy sa kabanalan ng Diyos o sa isang banal na dakong kaugnay niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magagalak nang lubos.” Ang pandiwang Hebreo ay nagpapahayag ng masigla at matagumpay na kagalakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang pandiwang pang-isahan na דִּבֶּר ay nagpapakitang ang tinutukoy ay ang Diyos ng Israel, hindi maramihang mga diyos.
- source_word: דִּבֶּר
  choice: Nagsalita
  rationale: Likas at marangal sa Filipino ang aspektong perpektibo upang ihayag ang natapos nang pagsasalita ng Diyos na mahalaga pa rin sa kasalukuyang pahayag.
- source_word: בְּקָדְשׁוֹ
  choice: sa kanyang kabanalan
  rationale: Pinananatili nito ang pangunahing pagbasa na tumutukoy sa kabanalan ng Diyos, habang inilalahad sa talababa ang posibleng kahulugang pook o santuwaryo.
- source_word: אֶעְלֹזָה
  choice: Ako'y magbubunyi
  rationale: Ipinahahayag ng pandiwa ang masidhi at matagumpay na kagalakan; mas angkop dito ang marangal na “magbubunyi” kaysa sa payak na “magagalak.”
- source_word: אֲחַלְּקָה
  choice: hahatiin ko
  rationale: Sa konteksto ng teritoryo, tumutukoy ito sa paghahati o pagtatalaga ng lupain. Malinaw at konkreto sa Filipino ang “hahatiin ko.”
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Isinalin sa baybay na malapit sa Hebreong pangalan ng pook at madaling bigkasin sa Filipino.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: at ang Lambak ng Sucot
  rationale: 'Malinaw na ipinapakita ng parirala ang ugnayang konstrukto: ang lambak na kaugnay ng pook na Sucot.'
- source_word: אֲמַדֵּד
  choice: susukatin ko
  rationale: Pinananatili ang konkretong larawan ng pagsukat sa lupain, na sa konteksto ay nagpapahiwatig din ng pag-aangkin at pagtatalaga nito.
theological_decisions:
- issue: Saklaw ng tuwirang sinabi at pagkakakilanlan ng nagsasalita
  choice: Itinuring na salita mismo ng Diyos ang lahat ng pandiwang nasa unang panauhan.
  alternative: Maaaring ang “Ako'y magbubunyi” ay salita ng salmista matapos niyang iulat na nagsalita ang Diyos, at ang kasunod lamang ang salita ng Diyos.
  rationale: Pinakamadulas sa sintaks at sa magkakaugnay na pahayag tungkol sa lupain ang pagbasa sa mga pandiwang nasa unang panauhan bilang iisang tuwirang salita ng Diyos. Gayunman, walang panandang panipi sa Hebreo, kaya pinanatili sa talababa ang tunay na posibilidad ng ibang saklaw ng sipi.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinili ang “magbubunyi” upang mapanatili ang mataas at matagumpay na himig ng tula, samantalang ang “hahatiin” at “susukatin” ay tuwiran at madaling maunawaan. Ginamit ang “Shekem” at “Sucot” bilang malinaw na transliterasyon ng mga pangalang Hebreo.
