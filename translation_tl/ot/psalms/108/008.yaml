id: PSA.108.8
reference: Psalms 108:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: tl
  text: Akin ang Gilead; akin ang Manases; ang Efraim ang muog ng aking ulo[a]; ang Juda ang aking tungkod ng pamumuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “muog ng aking ulo,” isang matalinghagang larawan ng lakas at proteksiyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang Juda ang aking tagapagbatas” o “ang Juda ang aking pinuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: akin
  rationale: Ang ל na may hulaping unang panauhang isahan ay nagpapahayag ng pag-aari; natural at tuwiran itong naihahayag ng “akin” sa konteksto ng pahayag ng hari.
- source_word: גִלְעָד
  choice: Gilead
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyong Filipino.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Pangalan ng lipi at rehiyon; ginamit ang nakaugaliang anyong Filipino.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Pangalan ng lipi; ginamit ang nakaugaliang anyong Filipino.
- source_word: מָעוֹז
  choice: muog
  rationale: Tumutukoy sa matibay na tanggulan o pinagmumulan ng lakas at proteksiyon; pinananatili ng “muog” ang larawang militar.
- source_word: רֹאשִׁי
  choice: aking ulo
  rationale: Literal na “aking ulo.” Pinananatili ang matalinghagang larawan sa halip na ipakahulugan agad bilang helmet o pangkalahatang proteksiyon.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Pangalan ng lipi; ginamit ang nakaugaliang anyong Filipino.
- source_word: מְחֹקְקִי
  choice: aking tungkod ng pamumuno
  rationale: Ang salita ay maaaring tumukoy sa tagapagbatas o pinuno, o sa tungkod na sagisag ng kaniyang kapangyarihan. Ang “tungkod ng pamumuno” ay nagpapanatili sa konkretong maharlikang larawan at sa kaugnayan nito sa pamamahala.
theological_decisions:
- issue: Larawan ng paghahari para sa Juda sa מְחֹקְקִי
  choice: ang aking tungkod ng pamumuno
  alternative: ang aking tagapagbatas
  rationale: Inilalarawan ng talata ang mga lipi at lupain bilang pag-aari o kasangkapan ng naghaharing nagsasalita. Ang “tungkod ng pamumuno” ay hindi nagpapahiwatig na literal na gumagawa ng batas ang Juda para sa Diyos, ngunit pinananatili sa talababa ang tunay na posibilidad na ang pangngalan ay tumutukoy sa tagapagbatas o pinuno.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at magkakatugmang mga sugnay ng tulang Hebreo, pati ang di-pangkaraniwang larawan ng “muog ng aking ulo.”
