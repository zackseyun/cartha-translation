  source_fidelity: 'Tumpak na naisalin ang sunod-sunod na pag-aangkin: Gilead at Manases ay “akin,” habang ang Efraim ay “muog ng aking ulo” at ang Juda ay kaugnay ng sagisag ng pamumuno. Napananatili ang literal at sadyang makatang larawan ng רֹאשִׁי (“aking ulo”), nang hindi ito ginagawang interpretatibong “helmet.” Ang “tungkod ng pamumuno” ay isang katanggap-tanggap na metonimikong salin ng מְחֹקְקִי sa kontekstong maharlika.'
