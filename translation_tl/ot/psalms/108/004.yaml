translation:
  language: tl
  text: Sapagkat ang iyong tapat na pag-ibig ay dakila, higit kaysa kalangitan, at ang iyong katapatan ay umaabot hanggang sa mga ulap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpupuri sa konteksto at likas itong pakinggan sa marangal na tulang Filipino.
- source_word: גָדוֹל מֵעַל שָׁמַיִם
  choice: dakila, higit pa sa kalangitan
  rationale: Pinananatili nito ang ideya ng kadakilaan at ang larawang pangkalawakan ng paglagpas sa langit, nang hindi nililimitahan ang pahayag sa pisikal na taas lamang.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ipinahahayag nito ang matatag, maaasahan, at mapagtipang pag-ibig na saklaw ng חֶסֶד, sa malinaw at likas na modernong Filipino.
- source_word: וְעַד שְׁחָקִים
  choice: at umaabot sa mga ulap
  rationale: Ang pandiwang “umaabot” ay likas na ipinahihiwatig ng paralelismo, samantalang pinananatili ng “mga ulap” ang kongkretong larawang patula ng שְׁחָקִים.
- source_word: אֲמִתֶּךָ
  choice: iyong katapatan
  rationale: Sa paralelismo sa חֶסֶד at bilang paglalarawan sa Diyos, higit na malinaw na ipinakikita ng “katapatan” ang diwa ng pagiging maaasahan, bagaman posible rin ang “katotohanan.”
theological_decisions:
- issue: Paglalarawan sa magkaugnay na mga katangian ng Diyos sa tulang Hebreo
  choice: “tapat na pag-ibig” at “katapatan”
  alternative: “awa” at “katotohanan”
  rationale: Inilalahad ng piniling mga salita ang matatag at maaasahang katangian ng Diyos nang hindi nagdaragdag ng natatanging denominasyonal na pakahulugan. Pinananatili sa talababa ang tunay na leksikal na posibilidad na “katotohanan.”
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang “kalangitan” at “mga ulap” upang mapanatili ang mataas na larawang patula, habang ang ayos ng pangungusap ay ginawang malinaw sa karaniwang mambabasa.
