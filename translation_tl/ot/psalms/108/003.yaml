  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים יְהוָ֑ה וַ֝/אֲזַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: tl
  text: 'Magpapasalamat ako sa iyo[a] sa gitna ng mga bayan[b], O Yahweh,

    at aawit ako ng papuri sa iyo sa gitna ng mga bansa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Pupurihin kita.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, magkatulad na mga pananalita ang “sa gitna ng mga bayan” at “sa gitna ng mga bansa,” na kapuwa tumutukoy sa pandaigdig na tagapakinig ng papuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Magpapasalamat ako sa iyo
  rationale: Sa konteksto ng pagsamba sa mga Awit, ang Hiphil ng ידה ay karaniwang tumutukoy sa hayagang pagpapasalamat o pagpupuri na kumikilala sa ginawa at pagkatao ng Diyos. Pinananatili ng parirala ang tuwirang pagtukoy sa kausap.
- source_word: בָעַמִּים
  choice: sa gitna ng mga bayan
  rationale: Ang maramihang עַמִּים ay tumutukoy sa iba't ibang pangkat ng mga tao. Ang “mga bayan” ay nagpapanatili sa maramihan at sa pandaigdig na saklaw nang hindi ito ipinapareho sa “mga bansa” sa ikalawang linya.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” at ginamit ang “O” upang malinaw na ipakita ang tuwirang pagtawag sa Diyos.
- source_word: וַאֲזַמֶּרְךָ
  choice: at aawit ako ng papuri sa iyo
  rationale: Ang Piel ng זמר ay tumutukoy sa pag-awit o pagtugtog bilang papuri. Ang “aawit ako ng papuri” ay malinaw at likas sa modernong Filipino habang pinananatili ang musikal at mapagpuring diwa.
- source_word: בַּל
  choice: sa gitna ng
  rationale: Sa patulang gamit dito, kahanay nito ang בָ sa unang linya. Ang parehong salin ay nagpapanatili sa paralelismo.
- source_word: אֻמִּים
  choice: mga bansa
  rationale: Ang אֻמִּים ay tumutukoy sa mga bayan o bansa. Ang “mga bansa” ay likas na katumbas at bahagyang ipinaiiba ito sa עַמִּים, habang pareho pa ring nagpapahayag ng pandaigdig na tagapakinig.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng Hebreong teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng pagpupuri
  choice: sa gitna ng mga bayan ... sa gitna ng mga bansa
  alternative: sa mga tao ... sa mga bansa
  rationale: Pinananatili ang magkatulad ngunit hindi ganap na magkaparehong mga salitang Hebreo at ang diin na ang pasasalamat at papuri ay ihahayag sa pandaigdig na kapulungan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkatimbang na linya ng tulang Hebreo, ang tuwirang pagtawag na “O Yahweh,” at ang bahagyang pagkakaiba ng “mga bayan” at “mga bansa.”
