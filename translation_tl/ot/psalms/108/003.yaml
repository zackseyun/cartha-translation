  source_fidelity: 'Tapat ang salin sa dalawang magkahanay na sugnay ng Hebreo: ang אוֹדְךָ ay wastong naipahayag bilang “Magpapasalamat ako sa iyo,” ang בָעַמִּים bilang “sa gitna ng mga bayan,” ang banal na pangalan ay “Yahweh,” at ang וַאֲזַמֶּרְךָ ... בַּל־אֻמִּים bilang “aawit ako ng papuri sa iyo sa gitna ng mga bansa.” Napananatili ang pandiwang nasa unang panauhan at ang tuwirang kausap. Ang “sa gitna ng” ay angkop na katumbas ng patulang kahulugang “among.”'
