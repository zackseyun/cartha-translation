  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: tl
  text: Ibigay mo sa amin ang tulong laban sa kaaway[a], sapagkat walang kabuluhan ang pagsagip na mula sa tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kagipitan,” kung ang צַר ay inuunawa bilang kalagayan ng paghihirap sa halip na isang kaaway.
    reason: lexical_alternative
  - marker: b
    text: Ang “tao” rito ay pangkalahatan at tumutukoy sa pagsagip o tulong na nagmumula sa tao. Maaari ring isalin na “walang kabuluhan ang pagsagip na mula sa mga tao.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  choice: Bigyan mo
  rationale: Pakiusap na pautos ang anyo; natural sa panalangin ang “Bigyan mo kami,” at ipinahihiwatig ng isahang pandiwa na ang Diyos ang kinakausap.
- source_word: לָּנוּ
  choice: kami
  rationale: Tuwirang katumbas ng panghalip na tumutukoy sa nagsasalita at sa kaniyang pangkat.
- source_word: עֶזְרַת
  choice: tulong
  rationale: Karaniwan, malinaw, at marangal na katumbas ng tulong o saklolo.
- source_word: מִצָּר
  choice: laban sa kaaway
  rationale: Maaaring personal na “kaaway” o impersonal na “kagipitan” ang צַר. Ang personal na diwa ay angkop sa kontekstong pandigma, at natural sa Filipino ang “tulong laban sa.”
- source_word: וְשָׁוְא
  choice: sapagkat walang kabuluhan
  rationale: Ang שָׁוְא ay nagpapahayag ng kawalang-saysay o kawalang-halaga. Ginawang “sapagkat” ang pang-ugnay upang mailabas ang makatwirang kaugnayan ng dalawang linya nang hindi binabago ang diwa.
- source_word: תְּשׁוּעַת
  choice: ang pagliligtas
  rationale: Sa konteksto, tumutukoy ito sa pagsagip o pagtatagumpay. Ang “pagliligtas” ay natural at hindi nagpapasok ng mas makitid na doktrinal na kahulugan.
- source_word: אָדָם
  choice: ng tao
  rationale: 'Generic ang אָדָם dito: ang pagliligtas na nagmumula sa tao, hindi isang partikular na lalaki. Ang “tao” ay maikli, natural, at saklaw ang sangkatauhan sa Filipino.'
theological_decisions:
- issue: Generic na kahulugan ng אָדָם sa pahayag tungkol sa limitasyon ng tulong ng tao
  choice: tao
  alternative: sangkatauhan
  rationale: Hindi kasarian ng isang indibidwal ang diin kundi ang kawalang-saysay ng pagliligtas na nagmumula sa mga tao kung ihahambing sa tulong ng Diyos. Pinananatili ng “tao” ang maikling anyong patula.
- issue: Saklaw ng תְּשׁוּעַת sa kontekstong pandigma
  choice: pagliligtas
  alternative: pagsagip; pagtatagumpay
  rationale: Pinananatili ang malawak na saklaw ng salitang Hebreo at iniiwasang tukuyin lamang ito bilang walang-hanggang kaligtasan o bilang tagumpay militar.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinananatili ang marangal at maikling himig ng panalangin. Ginamit ang “kami” dahil ang nagsasalita ay humihingi para sa kaniyang pangkat, at ang “mo” ay likas na nagpapakita na ang Diyos ang tuwirang kinakausap.
