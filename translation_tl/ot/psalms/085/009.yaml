  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: tl
  text: Tunay na malapit ang pagliligtas niya sa mga may takot sa kanya, upang manahan ang kaluwalhatian sa ating lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaluwalhatian” ay maaaring tumukoy sa nahahayag na presensiya ng Diyos o sa karangalang naibalik sa lupain.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Tunay na
  rationale: Ginamit dito ang אַךְ bilang mariing pagpapatunay, hindi bilang mahigpit na paglilimita.
- source_word: קָרוֹב
  choice: malapit
  rationale: Tuwirang ipinahahayag ng salita ang pagiging malapit o nalalapit.
- source_word: לִירֵאָיו
  choice: sa mga may takot sa kanya
  rationale: Pinananatili ang biblikal na diwa ng pagkatakot sa Diyos, na higit sa simpleng paggalang ngunit hindi rin nangangahulugang sindak lamang.
- source_word: יִשְׁעוֹ
  choice: ang pagliligtas niya
  rationale: Ang יֵשַׁע ay maaaring tumukoy sa kaligtasan o pagliligtas; mas natural sa pangungusap na Filipino ang aktibong diwang “pagliligtas niya.”
- source_word: לִשְׁכֹּן
  choice: upang manahan
  rationale: Ipinahahayag ng infinitive na may ל ang layunin o bunga; ang “upang” ay nagpapanatili sa ugnayang ito nang hindi ito lubusang nilulutas.
- source_word: כָּבוֹד
  choice: kaluwalhatian
  rationale: Pinananatili nito ang bigat at sadyang pagiging bukas ng salitang Hebreo, na maaaring tumukoy sa nahahayag na presensiya ng Diyos o sa karangalang naibalik.
- source_word: בְּאַרְצֵנוּ
  choice: sa ating lupain
  rationale: Sa konteksto, tumutukoy ang אֶרֶץ sa lupain ng bayan, hindi sa buong daigdig.
theological_decisions:
- issue: Tinutukoy ng כָּבוֹד (“kaluwalhatian”)
  choice: Iniwan bilang “kaluwalhatian” nang hindi tinutukoy kung kanino ito tahasang nauukol.
  alternative: “kaluwalhatian ng Diyos” o “karangalan” na naibalik sa lupain
  rationale: Hindi tahasang nililinaw ng Hebreo kung ito ay nahahayag na presensiya ng Diyos o karangalang bumabalik sa lupain; pinananatili ng salin ang makatang kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang maikling anyong patula at ang teolohikal na pagiging bukas ng “kaluwalhatian.”
