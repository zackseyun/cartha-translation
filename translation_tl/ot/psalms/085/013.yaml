  text: Righteousness will go before him and will make a path for his steps.
translation:
  language: tl
  text: 'Ang katuwiran ay lalakad sa unahan niya,

    at gagawa ng daan para sa kanyang mga hakbang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at gagawing daan ang kanyang mga hakbang.”'
    reason: Ang masinsing sintaksis ng Hebreo ay maaaring unawain bilang paggawa ng daan para sa kanyang mga hakbang o bilang paggawa sa kanyang mga hakbang na isang daan.
lexical_decisions:
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Tuwirang inilalarawan ang moral na kaayusan o pagiging matuwid; natural din itong gumaganap bilang personipikadong simuno sa konteksto.
- source_word: לְפָנָיו יְהַלֵּךְ
  choice: mangunguna sa kanya
  rationale: Ipinahahayag ang literal na diwang ‘lalakad sa harap niya’ sa natural na Filipino, habang pinananatili ang larawan ng katuwirang nauuna.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: maghahanda ng daan para sa kanyang mga hakbang
  rationale: Ang יָשֵׂם ay maaaring mangahulugang maglagay o magtakda, at ang parirala ay malamang na tumutukoy sa paghahanda/paglalatag ng daang tatahakin ng kanyang mga hakbang. Pinananatili ng salin ang konkretong larawang ito nang hindi ginagawang abstrakto ang ‘daan.’
theological_decisions:
- issue: Referente ng panlalaking hulaping -יו (‘kanya’)
  choice: Pinanatili ang panghalip na ‘kanya’ nang hindi pinangalanan ang referente.
  alternative: Gawing ‘ng Diyos’ o ‘ni Yahweh.’
  rationale: Hindi tahasang pinapangalanan ng talata ang referente; nalalaman lamang ito mula sa naunang konteksto. Ang pagpapanatili sa panghalip ay nag-iingat sa anyo at bahagyang kalabuan ng Hebreo.
- issue: Sintaksis ng וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: ‘maghahanda ng daan para sa kanyang mga hakbang’
  alternative: ‘gagawing daan ang kanyang mga hakbang’
  rationale: Posible ang alternatibong pagkakaugnay ng mga salita, ngunit mas natural sa konteksto ang katuwiran bilang naghahanda ng landas sa harap niya. Isang talababa ang nagpapanatili sa tunay na alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘katuwiran’ upang mapanatili ang personipikasyon, at ‘mangunguna’ upang natural na maipahayag ang larawang ‘lalakad sa harap niya.’
