base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: tl
  text: Pinagpakitaan mo ng lingap ang iyong lupain, Yahweh; ibinalik mo ang kapalaran ng Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibinalik mo ang pagkabihag ng Jacob” o “ibinalik mo ang mga bihag ng Jacob.” Maaaring tumukoy ang idyomang Hebreo sa pagpapanumbalik mula sa pagkatapon o sa mas malawak na pagbaligtad ng kalagayan.
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: Kinalugdan mo
  rationale: Ang Qal ng רצה ay nagpapahiwatig ng pagkalugod o pagpapakita ng lingap. Natural at marangal sa Tagalog ang “kinalugdan mo,” at hindi nito nililimitahan ang diwa sa simpleng pagtanggap lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אַרְצְךָ
  choice: ang iyong lupain
  rationale: Tumutukoy ang אֶרֶץ sa lupaing nauugnay sa Diyos, malamang sa lupain ng Israel. Mas angkop ang “lupain” kaysa sa makabagong pampolitikang “bansa.”
- source_word: שַׁבְתָּ
  choice: ibinalik mo
  rationale: Sa idyomang שׁוּב שְׁבוּת, ipinahihiwatig ng pandiwa ang pagpapanumbalik o pagbabalik. Pinananatili ng “ibinalik mo” ang konkretong larawan ng Hebreo habang natural sa Tagalog.
- source_word: שבות
  choice: mabuting kalagayan
  rationale: Maaaring tumukoy ang idyoma sa malawak na pagbaligtad ng masamang kalagayan, hindi lamang sa literal na paglaya mula sa pagkabihag. Malinaw sa karaniwang mambabasa ang “mabuting kalagayan,” habang inilalagay sa talababa ang mas tiyak na alternatibo.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinananatili ang pangalang nasa tekstong Hebreo. Sa kontekstong patula, kumakatawan ang Jacob sa bayang Israel, ngunit hindi ito tahasang pinapalitan ng interpretasyong iyon.
theological_decisions:
- issue: Kahulugan ng idyomang שׁוּב שְׁבוּת יַעֲקֹב
  choice: ibinalik mo ang mabuting kalagayan ng Jacob
  alternative: ibinalik mo mula sa pagkabihag ang Jacob / ibinalik mo ang mga bihag ng Jacob
  rationale: Maaaring mangahulugan ang idyoma ng pangkalahatang pagpapanumbalik o ng pagbabalik mula sa pagkabihag. Pinipili ng pangunahing teksto ang mas malawak na diwa at pinananatili sa talababa ang posibleng pahiwatig ng pagkatapon at pagkabihag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kinalugdan” upang ipahayag ang banal na lingap nang hindi nagiging kolokyal, at pinanatili ang “Jacob” bilang kolektibong pangalang patula. Ang marker na [a] ay inilagay pagkatapos ng sugnay na tinutukoy ng talababa.
