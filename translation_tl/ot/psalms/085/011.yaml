lexical_decisions:
- source_word: אֱמֶת
  choice: katotohanan
  rationale: Maaaring tumukoy ang אֱמֶת sa katotohanan, katapatan, o pagiging maaasahan. Pinananatili ng “katotohanan” ang abstraktong katangiang katambal ng katuwiran, samantalang inilalahad sa talababa ang “katapatan” bilang tunay na posibilidad.
- source_word: מֵאֶרֶץ
  choice: mula sa lupa
  rationale: Bagaman maaaring mangahulugan ang אֶרֶץ na “lupain,” mas angkop dito ang “lupa” dahil katapat ito ng “langit” sa patayong larawang patula.
- source_word: תִּצְמָח
  choice: sisibol
  rationale: Tumutukoy ang צמח sa pagsibol o pagtubo, lalo na ng halaman. Likas at malinaw sa Filipino ang “sisibol” at napapanatili nito ang larawang panghalaman.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Saklaw ng צֶדֶק ang katuwiran at katarungan. Ang “katuwiran” ang pangunahing salin dahil abstraktong katangiang moral ang inilalarawan, ngunit pinananatili sa talababa ang “katarungan.”
- source_word: מִשָּׁמַיִם
  choice: mula sa langit
  rationale: Natural sa Filipino ang isahang “langit” at malinaw nitong naipapakita ang pagtutulad at pagtatambis sa “lupa.”
- source_word: נִשְׁקָף
  choice: titingin
  rationale: Ang Niphal ng שׁקף ay karaniwang nangangahulugang tumingin mula sa mataas na dako. Dahil hayag na ang pinagmulan na “mula sa langit,” sapat at natural ang “titingin” habang napapanatili ang pagbibigay-katauhan sa katuwiran.
theological_decisions:
- issue: Pagpapakahulugan sa צֶדֶק sa tulang may moral na diwa
  choice: katuwiran
  alternative: katarungan
  rationale: Parehong sinasaklaw ng salitang Hebreo ang moral na katuwiran at makatarungang kaayusan. Ginamit sa pangunahing teksto ang “katuwiran” bilang katambal ng “katotohanan,” ngunit hindi inalis ang “katarungan” at inilagay ito sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang parallelismong lupa–langit, ang larawang pagsibol, at ang pagbibigay-katauhan sa katuwiran. Inilagay ang mga panandang [a] at [b] kaagad pagkatapos ng mga salitang may leksikal na alternatibo.
