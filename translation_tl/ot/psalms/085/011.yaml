base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: tl
  text: "Ang katotohanan[a] ay sisibol mula sa lupa,\n    at ang katuwiran[b] ay titingin pababa mula sa langit."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang katapatan ay sisibol mula sa lupa.”
    reason: lexical_alternative
