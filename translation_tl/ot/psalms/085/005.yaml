  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: tl
  text: Magagalit ka ba sa amin magpakailanman? Patatagalin mo ba ang galit mo sa sali't salinlahi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “uunatin mo ba ang galit mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: magpakailanman
  rationale: Likas at malinaw na katumbas ng pang-abay na tumutukoy sa walang-hanggang panahon sa isang retorikal na tanong.
- source_word: תֶּאֱנַף בָּנוּ
  choice: magagalit ka ba sa amin
  rationale: Tuwirang pinananatili ang wika ng galit; ang “sa amin” ay likas sa modernong Tagalog at maaaring magpahiwatig na ang galit ay nakatuon laban sa kanila.
- source_word: תִּמְשֹׁךְ
  choice: patatagalin mo ba
  rationale: Ang literal na “uunatin/hihilahin” ay idyomang nangangahulugang pahahabain sa panahon; “patatagalin” ang natural na katumbas sa konteksto.
- source_word: אַפְּךָ
  choice: ang galit mo
  rationale: Bagaman literal na “ilong,” malinaw na ang idyomatikong kahulugan dito ay galit; hindi ito pinalalambot bilang simpleng pagkainis.
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahi
  rationale: Karaniwang dignipikado at madaling maunawaang Tagalog para sa pagpapatuloy sa sunod-sunod na mga salinlahi.
theological_decisions:
- issue: Antropopatikong paglalarawan sa galit ng Diyos
  choice: Panatilihin ang tahasang “galit.”
  alternative: “Hindi ka ba malulugod sa amin” o “patuloy mo ba kaming sasalungatin.”
  rationale: Tahasang binabanggit ng Hebreo ang galit ng Diyos at ang pagpapatagal nito. Pinananatili nito ang tensiyon ng panaghoy nang hindi pinapahina o ipinapaliwanag palayo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sali't salinlahi” upang mapanatili ang makatang himig ng Awit nang hindi nagiging lipas o mahirap unawain.
