  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: tl
  text: Tunay nga, ibibigay ni Yahweh ang mabuti[a], at magbibigay ng ani ang ating lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kabutihan” o “mabubuting bagay.” Malawak ang kahulugan ng ekspresyong Hebreo at maaaring tumukoy sa kabutihang moral at materyal sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Tunay nga
  rationale: Dito, ang גַּם ay malamang na nagbibigay-diin sa katiyakan ng pahayag, hindi lamang nagdaragdag ng isa pang ideya. Likas sa makabagong Tagalog ang “Tunay nga” para sa ganitong mariing pagpapatibay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יִתֵּן
  choice: ibibigay
  rationale: Ang imperfect na anyo ay may hinaharap na diwa sa konteksto ng inaasahang pagpapala.
- source_word: הַטּוֹב
  choice: ang mabuti
  rationale: Pinananatili ng parirala ang malawak na saklaw ng Hebreo, na maaaring tumukoy sa kabutihan o sa mabubuting bagay nang hindi ito nililimitahan sa materyal na pagpapala.
- source_word: וְאַרְצֵנוּ
  choice: at ang ating lupain
  rationale: Sa kontekstong agrikultural, ang אֶרֶץ ay tumutukoy sa lupaing tinitirhan at sinasaka ng bayan.
- source_word: תִּתֵּן
  choice: magbubunga
  rationale: Bagaman literal na “magbibigay,” ang “magbubunga” ang likas na ekspresyon sa Tagalog kapag lupain ang simuno at ani ang tinutukoy.
- source_word: יְבוּלָהּ
  choice: magbubunga
  rationale: Ang diwa ng יְבוּלָהּ, “ani o bunga nito,” ay isinama sa pandiwang “magbubunga” upang maging natural at malinaw ang linya sa Tagalog.
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang banal na pangalan; pinananatili itong “Yahweh” upang hindi mapalitan ng titulo ang pangalan.
- issue: Saklaw ng הַטּוֹב
  choice: ang mabuti
  alternative: mabubuting bagay
  rationale: Hindi nililinaw ng Hebreo kung moral na kabutihan, materyal na pagpapala, o kapwa ang tinutukoy. Pinananatili ng “ang mabuti” ang sadyang lawak at tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “magbubunga” bilang natural na idyomang agrikultural, habang pinanatili sa talababa ang malawak na kahulugan ng הַטּוֹב.
