  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: tl
  text: Ipakita mo sa amin[a], Yahweh, ang iyong tapat na pag-ibig, at ipagkaloob mo sa amin ang iyong pagliligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Pangyarihin mong makita namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: Ipakita mo sa amin
  rationale: Ang anyong Hiphil na pautos ng ראה na may hulaping unang panauhang maramihan ay literal na “pangyarihin mong makita namin.” Ang “Ipakita mo sa amin” ang natural na katumbas sa modernong Tagalog at pinananatili ang tuwirang pakiusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: חַסְדֶּךָ
  choice: ang iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig o kagandahang-loob, kadalasan sa konteksto ng tipan. Ang “tapat na pag-ibig” ay malinaw, natural, at hindi labis na nililimitahan ang saklaw nito.
- source_word: וְיֶשְׁעֲךָ
  choice: at ... ang iyong pagliligtas
  rationale: Maaaring mangahulugan ang יֶשַׁע ng kaligtasan, pagliligtas, o tagumpay. Pinili ang “pagliligtas” upang idiin ang pagkilos ng Diyos na sumasagip habang pinananatili ang malawak na diwang teolohikal.
- source_word: תִּתֶּן לָנוּ
  choice: ipagkaloob mo sa amin
  rationale: Literal itong “ibigay mo sa amin.” Ang “ipagkaloob mo sa amin” ay natural at marangal sa panalanging Tagalog, at malinaw na naghahayag ng pakiusap.
theological_decisions:
- issue: Paglalarawan sa חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; pag-ibig na ayon sa tipan
  rationale: Pinananatili ng “tapat na pag-ibig” ang katapatan at pagmamahal na saklaw ng salita nang hindi ito nililimitahan sa awa lamang o ginagawang tahasang teknikal ang ideya ng tipan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabagong Filipino Tagalog na natural sa panalangin ngunit marangal ang tono. Ginamit ang tuwirang pakiusap na “Ipakita mo” at “ipagkaloob mo,” at pinanatili ang pangalang Yahweh.
