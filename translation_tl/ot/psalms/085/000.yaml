  text: Para sa tagapangasiwa ng musika[a]. Sa mga anak ni Korah[b]. Isang salmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Para sa direktor ng musika,” “Para sa punong musikero,” o “Para sa tagapanguna ng awitan.”
