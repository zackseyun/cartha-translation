lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang “tagapangasiwa ng awitan,” habang pinananatili ng “Para sa” ang gamit ng panlaping ל.
- source_word: לִבְנֵי
  choice: Ukol sa mga anak ni
  rationale: Maaaring magpahiwatig ang ל ng pag-aari, kaugnayan, pag-akda, o pag-aalay. Pinananatili ng “Ukol sa” ang lawak ng posibleng ugnayan at iniiwasang tiyakang ipasya kung sila ang mga may-akda o pinag-alayan.
- source_word: קֹרַח
  choice: Korah
  rationale: Isinalin sa karaniwang transliterasyon sa Filipino ang pangalang pantangi.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ito sa isang awit na kaugnay ng saliw o pagtatanghal na musikal; ang “salmo” ang natural at kinikilalang katawagan sa Filipino.
