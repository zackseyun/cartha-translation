  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: tl
  text: Hindi ka ba babalik at bubuhayin kami[a], upang magalak sa iyo ang iyong bayan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muli kaming bubuhayin” o “bibigyan kami ng panibagong buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ka ba
  rationale: Pinananatili ang retorikal na tanong na umaasang positibo ang sagot at ang himig ng mapag-asang pakiusap.
- source_word: תָּשׁוּב
  choice: muling babaling
  rationale: Ang שוב ay maaaring mangahulugang bumalik o bumaling. Sa Filipino, ang “muling babaling” ay natural kapag Diyos ang paksa at hindi nito tahasang idinaragdag ang pahiwatig na “sa amin” o “nang may lingap.”
- source_word: תְּחַיֵּנוּ
  choice: bubuhayin kami
  rationale: Ang Piel ng חיה ay nagsasaad ng pagbibigay o pagpapanumbalik ng buhay. Pinananatili ng “bubuhayin kami” ang malawak na kahulugan nang hindi ito nililimitahan sa espirituwal, pisikal, o pambansang pagpapanibago.
- source_word: וְעַמְּךָ
  choice: upang ... ang iyong bayan
  rationale: Ang waw ay nauunawaan dito bilang nag-uugnay sa inaasahang bunga o layunin. Ang “upang” ay malinaw at likas sa modernong Filipino, habang pinananatili ng “iyong bayan” ang ugnayang tipan.
- source_word: יִשְׂמְחוּ
  choice: magalak
  rationale: Ang imperfect sa kontekstong ito ay angkop unawain bilang ninanais na bunga. Ang “magalak” kasunod ng “upang” ay likas na nagpapahayag nito.
- source_word: בָךְ
  choice: sa iyo
  rationale: Sa pandiwa ng paggalak, ang ב ay tumutukoy sa sentro o layon ng kagalakan. Ang “sa iyo” ay tuwiran at hindi inililipat ang kahulugan tungo sa “dahil sa iyo.”
theological_decisions:
- issue: Kung gagawing tahasan na ang pagbaling ng Diyos ay pagbaling sa kanyang bayan nang may lingap
  choice: Pinanatili ang mas malawak na “muling babaling.”
  alternative: “muling babaling sa amin” o “muling magpapakita ng lingap”
  rationale: Hindi tahasang nasa Hebreo ang “sa amin” o “nang may lingap,” bagaman malamang iyon ang diwa sa konteksto. Hindi idinagdag sa pangunahing teksto ang interpretasyong iyon.
- issue: Kung ang pagbuhay ay espirituwal na pagpapanibago lamang o mas malawak na pagpapanumbalik
  choice: Ginamit ang “bubuhayin kami” nang walang paglilimita.
  alternative: “panunumbalikin ang aming pambansang buhay” o “papanibaguhin kami sa espiritu”
  rationale: Malawak ang saklaw ng Hebreong pananalita. Maaaring kasama rito ang pangkomunidad, pisikal, at espirituwal na pagpapanumbalik, kaya hindi ito nilimitahan sa isang kategorya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bayan” sa halip na “mga tao” upang mapanatili ang kolektibo at pangtipang diwa ng עַם. Ang ayos na “magalak sa iyo ang iyong bayan” ay bahagyang mataas ang rehistro ngunit natural sa panalangin at malinaw ang diin sa Diyos bilang sentro ng kagalakan.
