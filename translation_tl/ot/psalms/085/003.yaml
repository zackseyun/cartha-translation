  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: tl
  text: Iniurong mo ang lahat ng iyong poot; tinalikuran mo ang nag-aalab mong galit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iniurong mo ang lahat ng iyong poot; umurong ka mula sa alab ng iyong galit.”
    reason: Pinananatili ng alternatibo ang mas literal na larawan at estruktura ng pariralang Hebreo.
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: Iniurong mo
  rationale: Sa kontekstong ang layon ay poot, ang אסף ay tumutukoy sa pag-aalis o pagbawi nito. Likas sa makabagong Tagalog ang “iniurong” at pinananatili nito ang larawan ng pagpigil o pagbawi.
- source_word: כָל
  choice: lahat ng
  rationale: Tuwirang ipinahahayag ang kabuuan at tindi ng pagkakaalis ng poot.
- source_word: עֶבְרָתֶךָ
  choice: iyong poot
  rationale: Ang עֶבְרָה ay matinding galit o poot. Ang “poot” ay marangal at malinaw nang hindi labis na arkaiko.
- source_word: הֱשִׁיבוֹתָ
  choice: tinalikuran mo
  rationale: Ang Hiphil ng שוב na may מִן ay nagpapahiwatig ng pagtalikod o pag-urong mula sa isang bagay. Ang “tinalikuran mo” ay natural at hindi ito binibigyang-kahulugan bilang pagsisisi.
- source_word: מֵחֲרוֹן
  choice: nag-aalab
  rationale: Pinananatili ng “nag-aalab” ang larawang init o pagliyab na taglay ng חָרוֹן habang natural na naglalarawan sa galit.
- source_word: אַפֶּךָ
  choice: mong galit
  rationale: Bagaman literal na “ilong,” ang אַף sa idyomang ito ay nangangahulugang galit. Naipagpapatuloy ng “nag-aalab” ang kongkretong larawan ng Hebreo.
theological_decisions:
- issue: Matalinghagang paglalarawan sa galit ng Diyos
  choice: Pinanatili ang larawan ng nag-aalab na galit.
  alternative: Lubos mong inalis ang iyong poot; humupa ang matindi mong galit.
  rationale: Ang Hebreo ay gumagamit ng matingkad na larawang may init para sa banal na poot. Hindi ito dapat gawing purong abstrakto o pahinain sa salin.
- issue: Ugnayan ng dalawang magkatulad na sugnay
  choice: 'Isinalin ang mga ito bilang magkatulad ngunit hindi ganap na magkasingkahulugang kilos: “iniurong” at “tinalikuran.”'
  alternative: Inalis mo ang lahat ng iyong poot; pinawi mo ang iyong matinding galit.
  rationale: Pinananatili nito ang paralelismo at ang bahagyang pagkakaiba ng אסף at שוב nang hindi nagpapasok ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at angkop sa salmo. Ginamit ang “poot” para sa mataas ngunit nauunawaang rehistro, at “nag-aalab na galit” upang mapanatili ang matingkad na larawang Hebreo.
