  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: tl
  text: 'Ang tapat na pag-ibig at katotohanan[a] ay nagtagpo;

    ang katuwiran[b] at kapayapaan ay naghalikan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan” para sa “katotohanan” (אֱמֶת).
    reason: lexical_alternative
  - marker: b
    text: O “katarungan” para sa “katuwiran” (צֶדֶק).
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matibay at maaasahang pag-ibig sa ugnayan, hindi lamang damdamin o habag.
- source_word: אֱמֶת
  choice: katotohanan
  rationale: Saklaw ng salita ang katotohanan, katapatan, at pagiging maaasahan. Pinili ang “katotohanan” upang mapanatili ang lawak ng kahulugan; inilagay sa talababa ang “katapatan.”
- source_word: נִפְגָּשׁוּ
  choice: nagtagpo
  rationale: Likas na salin ito ng naganap na pagtatagpo at pinananatili ang pagsasatao sa mga katangian.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Maaaring tumukoy sa katuwiran o katarungan. Ang “katuwiran” ay angkop sa makatang pagsasatao, habang pinananatili sa talababa ang lehitimong alternatibong “katarungan.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ito ang pinakakilala at likas na salin sa kontekstong ito, bagaman maaaring saklawin ng Hebreo ang kabuuan at mabuting kalagayan.
- source_word: נָשָׁקוּ
  choice: naghalikan
  rationale: Tuwirang pinananatili ang matingkad na larawang makata ng dalawang personipikadong katangiang humahalik sa isa’t isa.
theological_decisions:
- issue: Pagsasatao sa mga katangiang kaugnay ng tipan at moralidad
  choice: 'Panatilihin nang literal ang makatang pagsasatao: “nagtagpo” at “naghalikan.”'
  alternative: Ipaliwanag bilang “nagkaisa,” “nagkasundo,” o “nagkasundo nang lubos.”
  rationale: Inilalarawan ng Hebreo ang mga katangian bilang mga kumikilos na persona. Pinananatili nito ang larawan at teolohikal na tensiyon nang hindi nagdaragdag ng tiyak na interpretasyong hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at balanseng anyong patula, pati ang matingkad na pagsasatao sa apat na katangian.
