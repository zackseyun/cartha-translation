  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: tl
  text: Ipanumbalik mo kami[a], O Diyos ng aming kaligtasan, at alisin mo sa amin ang iyong galit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pabalikin mo kami.” Mas literal, “pangyariin mo kaming bumalik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: Ibalik mo kami
  rationale: Ang Hiphil imperative na may hulaping unang panauhang maramihan ay nangangahulugang ‘pangyariing bumalik’ o ‘ibalik.’ Likas sa Filipino ang ‘Ibalik mo kami’ at pinananatili nito ang pagkilos ng Diyos nang hindi nililimitahan ang pakiusap sa panloob na pagsisisi lamang.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: O Diyos ng aming kaligtasan
  rationale: Pinananatili ng ‘Diyos ng aming kaligtasan’ ang anyong construct at ang diwang ang kaligtasan o pagliligtas ay nagmumula at nauukol sa Diyos. Idinagdag ang ‘O’ bilang likas at marangal na pantawag sa Filipino.
- source_word: וְהָפֵר
  choice: at alisin mo
  rationale: Sa layong ‘iyong galit,’ ang Hiphil imperative ng פרר ay humihiling na pahintuin, pawalang-bisa, o alisin ang galit. Ang ‘alisin mo’ ay malinaw at natural sa Filipino.
- source_word: כַּעַסְךָ
  choice: iyong galit
  rationale: Ang ‘galit’ ang pinakakaraniwan at tuwirang katumbas ng pangngalang tumutukoy sa galit o pagkayamot sa kontekstong ito.
- source_word: עִמָּנוּ
  choice: sa amin
  rationale: Bagaman karaniwang nangangahulugang ‘kasama namin’ ang pang-ukol, sa pariralang tungkol sa pag-aalis ng galit, likas sa Filipino ang ‘alisin mo sa amin.’ Hindi nito dinaragdagan ang mas tiyak na ideyang ‘laban sa amin.’
theological_decisions:
- issue: Kung ang pambungad na pakiusap ay moral na pagbabalik-loob o pagpapanumbalik ng bayan sa mabuting kalagayan sa harap ng Diyos
  choice: Ibalik mo kami
  alternative: Panumbalikin mo kami / Pabalikin mo kami
  rationale: Kayang saklawin ng ‘Ibalik mo kami’ ang pagpapanumbalik at ang pagpapabalik nang hindi tahimik na nilulutas ang tunay na lawak ng Hebreo. Pinananatili rin nito ang pagkukusa at pagkilos ng Diyos.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa panalangin. Ginamit ang ‘O Diyos’ para sa likas na tuwirang pagtawag, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
