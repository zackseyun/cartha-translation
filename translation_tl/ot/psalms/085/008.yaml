id: PSA.85.8
reference: Psalms 85:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: tl
  text: Makikinig ako sa sasabihin ng Diyos na si Yahweh, sapagkat magsasalita siya ng kapayapaan sa kanyang bayan at sa mga tapat sa kanya[a]; ngunit huwag silang bumalik sa kahangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banal niya” o “mga maka-Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at huwag silang bumalik sa kamangmangan.” Ayon sa isang hindi gaanong malamang na pagbasa, ang huling salita ay nangangahulugang “pagtitiwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: Makikinig ako
  rationale: Ang Qal cohortative ay nagpapahayag ng pasiya o kusang hangaring makinig. Likas sa modernong Tagalog ang “Makikinig ako” at pinananatili nito ang aktibong pagtutuon ng salmista.
- source_word: מַה יְדַבֵּר
  choice: sa sasabihin
  rationale: Itinuturo ng imperfect ang malapit nang sabihin ng Diyos. Sa Tagalog, natural na naipapahayag ang diwa ng pariralang “makikinig sa kung ano ang sasabihin” sa mas maikli at malinaw na “makikinig sa sasabihin.”
- source_word: הָאֵל יְהוָה
  choice: Diyos na si Yahweh
  rationale: Pinananatili ang parehong אֵל at ang pangalang tipan na יהוה. Ang “Diyos na si Yahweh” ay malinaw at likas na pagkakaugnay ng titulo at sariling pangalan sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikilala nito ang dahilan ng pakikinig ng salmista: magsasalita ang Diyos ng kapayapaan. Ang “sapagkat” ay angkop sa marangal na rehistro ng salmo.'
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Pinananatili ng “kapayapaan” ang malawak na diwa ng shalom—kagalingan, katiwasayan, at naibalik na maayos na ugnayan—nang hindi ito labis na pinalalawak sa pangunahing teksto.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Ang “bayan” ay natural na kolektibong katawagan sa bayang pag-aari ng Diyos at angkop sa konteksto ng Mga Awit.
- source_word: חֲסִידָיו
  choice: mga tapat sa kanya
  rationale: Ang חָסִיד ay tumutukoy sa mga taong may katapatan at debosyon sa loob ng pakikipagtipan. Iniiwasan ng saling ito ang posibleng teknikal o denominasyonal na pakahulugan ng “mga banal.”
- source_word: וְאַל יָשׁוּבוּ
  choice: ngunit huwag silang bumalik
  rationale: Ang אַל kasama ng imperfect ay may puwersang pagbabawal o paghihikayat, hindi payak na hula. Ipinakikita ng “ngunit huwag” ang babalang kasunod ng pangako ng kapayapaan.
- source_word: לְכִסְלָה
  choice: sa kahangalan
  rationale: Ang karaniwang diwa ng pangngalan sa kontekstong ito ay “kahangalan,” na tumutukoy sa muling pagbabalik sa hangal o suwail na landas. Nananatili sa talababa ang mas di-karaniwang pagbasa na “pagtitiwala.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang sariling pangalan ng Diyos sa halip na palitan ng isang titulo.
- issue: Diwa ng חֲסִידָיו
  choice: mga tapat sa kanya
  alternative: mga banal; mga maka-Diyos
  rationale: Pinananatili ng piniling salin ang ugnayang katapatan at debosyon nang hindi nag-aangkat ng mas huling teknikal na gamit ng “banal.”
- issue: Puwersa ng pangwakas na sugnay
  choice: 'babala o paghihikayat: “ngunit huwag silang bumalik sa kahangalan”'
  alternative: 'paglalarawan o pangako: “at hindi sila babalik sa kahangalan”'
  rationale: 'Malakas na itinuturo ng אַל na pagbabawal ang sugnay. Pinananatili nito ang tensiyon ng teksto: nagsasalita ang Diyos ng kapayapaan, ngunit pananagutan ng bayan na huwag bumalik sa kahangalan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong bayan ng Diyos, “mga tapat sa kanya” para sa relasyonal na diwa ng חֲסִידָיו, at malinaw na anyong pagbabawal sa pangwakas na sugnay. Inilagay ang bawat talababa sa mismong bahaging tinutukoy nito.
