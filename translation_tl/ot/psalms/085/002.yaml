  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: tl
  text: Pinatawad mo ang kasamaan ng iyong bayan[a]; tinakpan mo ang lahat ng kanilang kasalanan[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Pinasan mo” o “dinala mo ang kasamaan ng iyong bayan.” Gumagamit ang idyomang Hebreo ng larawan ng pagbuhat o pagdadala upang ipahayag ang pagpapatawad o pag-aalis ng sala.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lahat ng kanilang mga kasalanan.” Isahan ang pangngalan sa Hebreo ngunit may hulaping tumutukoy sa maramihan, kaya maaari itong unawain bilang kolektibong “kasalanan” o distributibong “mga kasalanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: Pinatawad mo
  rationale: Ang literal na diwa ng pandiwa ay ‘itinaas, dinala, pinasan,’ ngunit kapag עָוֹן ang layon, isa itong idyoma para sa pag-aalis ng sala o pagpapatawad. Malinaw at natural sa modernong Tagalog ang ‘pinatawad,’ habang inilalahad sa talababa ang kongkretong larawan.
- source_word: עֲוֺן
  choice: kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, sala, o bunga ng pagkakasala. Pinananatili ng ‘kasamaan’ ang moral na bigat nito at ang bahagyang pagkakaiba nito sa kasunod na חַטָּאתָם.
- source_word: עַמֶּךָ
  choice: iyong bayan
  rationale: Sa kontekstong pangkatawan at pakikipagtipan, natural na tumutukoy ang עַם sa bayang nauugnay sa Diyos; ang ‘iyong bayan’ ay dignified at karaniwang salin sa Tagalog.
- source_word: כִּסִּיתָ
  choice: tinakpan mo
  rationale: Pinananatili nito ang literal na metapora ng כסה at ang kaugnayan nito sa pagpapatawad, nang hindi agad pinapawi ang makatang larawan.
- source_word: כָל
  choice: lahat
  rationale: Tuwirang katumbas ito ng כָל at natural na kasama ng kolektibong pariralang sumusunod.
- source_word: חַטָּאתָם
  choice: lahat nilang kasalanan
  rationale: Ang pangngalan ay nasa isahan na may panlaping maramihan at maaaring unawain nang kolektibo. Sa Tagalog, ang ‘lahat nilang kasalanan’ ay likas at maaari ring basahin bilang kabuuan ng kanilang kasalanan; ang posibleng distributibong ‘lahat ng kanilang mga kasalanan’ ay nasa talababa.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang kahulugan ng terminong Hebreo, kaya isinalin-transliterado ito sa halip na lagyan ng mapagpasyang paliwanag gaya ng ‘pahinga’ o ‘interlude.’
theological_decisions:
- issue: Paglilipat sa idyomang נָשָׂא עָוֹן
  choice: Pinatawad mo ang kasamaan ng iyong bayan
  alternative: Pinasan mo / inalis mo ang sala ng iyong bayan
  rationale: Ipinahahayag ng idyoma ang pagpapatawad o pag-aalis ng sala. Ang pangunahing salin ay malinaw sa ordinaryong mambabasa, samantalang pinananatili ng talababa ang pisikal na larawang nasa Hebreo nang hindi ipinipilit kung ‘pagpasan’ o ‘pag-aalis’ ang eksaktong diin.
- issue: Kolektibo o distributibong pagbasa sa חַטָּאתָם
  choice: lahat nilang kasalanan
  alternative: lahat ng kanilang mga kasalanan
  rationale: Isahan ang anyong Hebreo ngunit may panlaping tumutukoy sa maramihan, kaya maaaring kolektibo ang ‘kasalanan’ o distributibo ang ‘mga kasalanan.’ Pinananatili ng pangunahing salin ang kolektibong anyo at itinatala ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at patula. Ginamit ang ‘bayan’ para sa kolektibo at relasyonal na עַם. Pinanatili ang ‘Selah’ dahil hindi tiyak ang kahulugan nito. Ang ayos na ‘lahat nilang kasalanan’ ay natural sa Tagalog at pinananatili ang kolektibong ambiguwidad ng Hebreo.
