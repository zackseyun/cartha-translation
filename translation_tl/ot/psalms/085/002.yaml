    rationale: Ang “ang lahat ng kanilang kasalanan” ay natural, marangal, at pinananatili ang kolektibong singular ng חטאתם, habang ang talababa ay maaari pa ring maglahad ng distributibong “mga kasalanan.”
  - severity: low
