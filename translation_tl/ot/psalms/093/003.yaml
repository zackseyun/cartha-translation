  naturalness: Mas natural at malinaw ang “Nagtaas ang mga ilog” kaysa sa balintiyak na “Itinaas ng mga ilog.” Ang “itinataas ng mga ilog ang kanilang mga alon na humahampas” ay maayos na Filipino at pinananatili ang marahas na larawang patula.
  terminology: Tama ang “Yahweh,” “mga ilog,” at “kanilang tinig.” Pinananatili ng “mga alon na humahampas” ang ipinahihiwatig na tubig/alon ng bihirang דָּכְיָם, habang ang talababa ay nag-iingat sa ibang posibleng pagbibigay-kahulugan.
