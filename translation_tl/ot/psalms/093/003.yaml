  text: נָשְׂא֤וּ נְהָר֨וֹת יְֽהוָ֗ה נָשְׂא֣וּ נְהָר֣וֹת קוֹלָ֑/ם יִשְׂא֖וּ נְהָר֣וֹת דָּכְיָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: tl
  text: 'Nagtaas ang mga ilog[a], O Yahweh;

    nagtaas ang mga ilog ng kanilang tinig;

    itinataas ng mga ilog ang kanilang mga alon na humahampas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga baha.” Mas literal na “mga ilog” ang salitang Hebreo, bagaman maaari itong tumukoy rito sa rumaragasang tubig.
    reason: lexical_alternative
  - marker: b
    text: O “kanilang mga dambuhalang alon” o “kanilang paglagapak.” Bihira ang pangngalang Hebreo at maaaring tumukoy sa malakas na paghampas o paglagapak ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: itinaas / itinataas
  rationale: Pinananatili ng “itinaas” ang pangunahing larawan ng נשׂא na pag-aangat. Ang dalawang perfect ay isinalin sa naganap na anyo, samantalang ang panghuling imperfect ay ginawang masiglang kasalukuyan upang maipakita ang pataas na kasukdulan ng tulang Hebreo.
- source_word: נְהָרוֹת
  choice: mga ilog
  rationale: Karaniwang nangangahulugang “mga ilog” ang pangngalan. Bagaman maaaring ipakahulugang “mga baha” sa konteksto ng magulong tubig, hindi iyon ipinipilit sa pangunahing teksto.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh”; idinagdag ang “O” upang likas na maipahayag sa Filipino ang tuwirang pagtawag.
- source_word: קוֹלָם
  choice: kanilang tinig
  rationale: Pinananatili ng “tinig” ang personipikasyon sa tula, na para bang sumisigaw ang mga ilog, habang natural pa rin sa makabagong Filipino.
- source_word: דָּכְיָם
  choice: kanilang humahampas na mga alon
  rationale: Bihira at hindi ganap na tiyak ang salitang ito, ngunit tumutukoy ito sa paghampas o paglagapak ng tubig. Ang “humahampas na mga alon” ay malinaw at nagpapanatili sa marahas na puwersa ng larawan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh, bilang “O Yahweh” sa tuwirang pagtawag
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang tatlong-ulit na “mga ilog” at ang pag-uulit ng pandiwa upang madama ang paralelismo at lumalakas na galaw ng tulang Hebreo.
