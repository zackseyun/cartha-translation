  source_fidelity: 'Ang pangunahing diwa ay wasto: ipinahahayag ng talata ang paghahari ni Yahweh, ang kaniyang kamahalan at lakas na gaya ng kasuotan/pamigkis, at ang katatagan ng daigdig. Gayunman, ang “nabibihisan” ay nagpapahiwatig na may ibang nagbibihis sa kaniya at hindi nito natural na naihahatid ang aktibong/middle na metapora ng Hebreo. Ang “ibinigkis niya ito sa kanyang sarili” ay labis na nililinaw ang isang bagay na hindi hayagang layon ng pandiwang Hebreo at nagiging di-likas ang larawan.'
  naturalness: Ang “nagdamit ... ng” ay mas likas at marangal na Filipino para sa metaporang pagsusuot. Ang “nagbigkis siya” ay maikli, poetiko, at angkop sa pandiwang refleksibo sa Hebreo; nililinaw ng talababa ang metapora. Ang “matibay na naitatag” ay mas tuwirang tumutugma sa ‘itinatag/fixed’ kaysa “matatag na nakatayo.”
  terminology: Ang “Yahweh,” “kamahalan,” “lakas,” at “daigdig” ay angkop na mga katumbas. Pinananatili ang banal na pangalan at ang marangal ngunit makabagong rehistro.
