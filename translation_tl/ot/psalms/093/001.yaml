  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: tl
  text: Naghahari si Yahweh[a]; nagdamit siya ng kamahalan. Nagdamit si Yahweh ng lakas; nagbigkis siya[b]. Tunay ngang matibay na naitatag ang daigdig[c]; hindi ito matitinag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Naging hari si Yahweh.” Maaaring unawain ang pandiwang Hebreo bilang pagsisimula ng paghahari, ngunit malamang na ipinahahayag dito ang kasalukuyan niyang paghahari.
    reason: alternative_reading
  - marker: b
    text: Ang larawan ay ng pagbibigkis ng lakas na parang pamigkis o kagamitang pandigma.
    reason: cultural_note
  - marker: c
    text: O, “matibay na naitatag ang tinatahanang mundo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: מָלָךְ
  choice: Naghahari
  rationale: Sa konteksto ng awit, ipinahahayag nito ang kasalukuyan at patuloy na paghahari ni Yahweh. Posible rin ang ingresibong diwang “naging hari,” kaya inilagay iyon sa talababa.
- source_word: גֵּאוּת
  choice: kamahalan
  rationale: Kapag tumutukoy kay Yahweh, ipinahihiwatig nito ang maringal at mataas na kalagayan, hindi ang negatibong diwa ng pagmamataas.
- source_word: לָבֵשׁ
  choice: nabibihisan
  rationale: Pinananatili ang metapora ng pananamit at ang pag-uulit ng pandiwa sa dalawang magkatulad na sugnay.
- source_word: עֹז
  choice: lakas
  rationale: Ito ang tuwiran at likas na katumbas sa konteksto ng maharlikang kapangyarihan ni Yahweh.
- source_word: הִתְאַזָּר
  choice: ibinigkis niya ito sa kanyang sarili
  rationale: Ipinapahayag ng anyong hitpael ang pagbibigkis sa sarili. Ang “ito” ay tumutukoy sa lakas sa naunang sugnay at pinananatili ang larawan ng pagsusuot ng pamigkis.
- source_word: אַף
  choice: Tunay ngang
  rationale: Ipinahahayag nito ang mariing pagpapatuloy mula sa matatag na paghahari ni Yahweh tungo sa katatagan ng daigdig.
- source_word: תִּכּוֹן
  choice: matatag na nakatayo
  rationale: Natural na Filipino ito para sa diwang ang daigdig ay matibay na naitatag o nakapirmi, nang hindi gumagamit ng alanganing pag-uulit na “matatag na naitatag.”
- source_word: תֵּבֵל
  choice: daigdig
  rationale: Tumutukoy ito sa maayos at tinatahanang mundo; malinaw at makabagong katumbas ang “daigdig.”
- source_word: בַּל תִּמּוֹט
  choice: hindi ito matitinag
  rationale: Likas na idyomang Filipino ito para sa katatagang hindi mauuga, matutumba, o mawawala sa kinalalagyan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito upang hindi mapalitan ng isang titulo.
- issue: Aspekto ng מָלָךְ sa awit ng paghahari
  choice: Kasalukuyang “Naghahari”
  alternative: Ingresibong “Naging hari”
  rationale: Pangunahing ipinahahayag ng konteksto ang umiiral na paghahari ni Yahweh, ngunit hindi ganap na isinasara ng anyong Hebreo ang ingresibong pagbasa; kaya tinukoy ang alternatibo sa talababa.
- issue: Kaugnayan ng “lakas” sa mga metapora ng pananamit at pagbibigkis
  choice: Ang lakas ay kapuwa inilalarawang kasuotan at ipinahiwatig na ibinigkis ni Yahweh sa sarili
  alternative: Iugnay lamang ang “lakas” sa “nabibihisan” at hayaang walang layon ang “ibinigkis niya ang kanyang sarili”
  rationale: Pinananatili nito ang dalawang larawang Hebreo habang nagbibigay ng malinaw at natural na ugnayan sa Filipino, nang hindi ginagawang literal na sandata ang lakas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo at mga metapora ng pananamit at pagbibigkis, habang iniwasan ang sobrang makaluma o alanganing literal na pananalita.
