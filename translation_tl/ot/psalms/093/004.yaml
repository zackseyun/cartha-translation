base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: tl
  text: Higit na maringal si Yahweh[b] sa kaitaasan kaysa sa dagundong ng maraming tubig[a], kaysa sa malalakas na daluyong ng dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Higit na makapangyarihan si Yahweh sa kaitaasan kaysa sa dagundong ng maraming tubig, kaysa sa mga daluyong ng dagat.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, YHWH; tradisyonal na isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִקֹּלוֹת מַיִם רַבִּים
  choice: kaysa sa dagundong ng maraming tubig
  rationale: Comparative ang מִן sa konteksto. Ang “dagundong” ay likas na Filipino para sa malakas na tunog ng tubig, samantalang pinananatili ng “maraming tubig” ang Hebreong larawang ποιetiko.
- source_word: אַדִּירִים
  choice: malalakas
  rationale: Sa paglalarawan sa mga daluyong, malinaw na ipinahahayag ng “malalakas” ang puwersa ng dagat; maaari ring unawain ang salita bilang “maringal,” kaya inilalahad ang alternatibong balangkas sa talababa.
- source_word: מִשְׁבְּרֵי יָם
  choice: mga daluyong ng dagat
  rationale: Ang מִשְׁבָּר ay tumutukoy sa humahampas o bumabaling malalaking alon. Ang “daluyong” ay natural, marangal, at madaling maunawaang katumbas sa modernong Tagalog.
- source_word: אַדִּיר
  choice: maringal
  rationale: Saklaw ng salita ang lakas, kadakilaan, at maharlikang karangalan. Ang “maringal” ay angkop sa konteksto ng paghahari sa awit at inuugnay ang paghahambing sa unang mga parirala.
- source_word: בַּמָּרוֹם
  choice: sa kaitaasan
  rationale: Pinananatili nito ang ideya ng dakilang taas nang hindi espesipikong ipinapakahulugang “langit.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paghahambing sa mga pariralang may מִן
  choice: Si Yahweh ay higit na maringal kaysa sa dagundong ng tubig at sa mga daluyong ng dagat.
  alternative: 'Maaaring basahin bilang magkakahiwalay na pahayag: maringal o malalakas ang maraming tubig at mga daluyong, ngunit maringal si Yahweh sa kaitaasan.'
  rationale: Pinakamalamang na comparative ang dalawang מִן, ngunit dahil maaaring marinig ang Hebreo bilang sunod-sunod na paglalarawan bago ang pangwakas na pahayag, pinananatili sa talababa ang tunay na sintaktikong posibilidad.
- issue: Pagtutumbas sa pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang tradisyonal na pamalit na titulo ay itinatala upang makatulong sa mga mambabasang pamilyar dito.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Ginamit ang “dagundong” at “daluyong” upang maging natural ang larawang pandinig at ang lakas ng dagat; iniwasan ang labis na teknikal o denominasyonal na pananalita.
