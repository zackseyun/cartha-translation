translation:
  language: tl
  text: Matatag ang trono mo mula pa noong unang panahon[a]; ikaw ay mula pa sa walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Matatag ang trono mo mula pa noong sinaunang panahon; ikaw ay mula sa kawalang-hanggan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: Matatag na
  rationale: Ang anyo ay nagsasaad ng matibay at tiyak na kalagayan. Likas sa modernong Tagalog ang “matatag na” at hindi nito ipinahihiwatig na may ibang nagtatag sa trono.
- source_word: כִּסְאֲךָ
  choice: ang trono mo
  rationale: Tuwirang katumbas ng כִּסֵּא na may hulaping ikalawang panauhang panlalaki na isahan.
- source_word: מֵאָז
  choice: mula pa noong unang panahon
  rationale: Ipinahahayag ang malayong nakaraan sa natural at marangal na Tagalog, habang pinananatili ang temporal na larawan ng Hebreo.
- source_word: מֵעוֹלָם
  choice: mula pa sa walang hanggan
  rationale: Sa pagtukoy sa Diyos, ipinahahayag nito ang walang takdang nakaraan o walang hanggang pag-iral; pinananatili ng salin ang patulang kaibahan nito sa “unang panahon.”
- source_word: אָתָּה
  choice: ikaw ay
  rationale: Ang malayang panghalip ay ginagamit bilang simuno ng sugnay na may nauunawaang panaguri; kailangan ang “ay” para sa malinaw at marangal na ayos sa Tagalog.
theological_decisions:
- issue: Temporal na pananalita tungkol sa pag-iral ng Diyos
  choice: ikaw ay mula pa sa walang hanggan
  alternative: ikaw ay naroon na mula pa sa walang hanggan
  rationale: Tahasang pinananatili ang pahayag ng Hebreo tungkol sa walang takdang pag-iral ng Diyos nang hindi nagdaragdag ng pilosopikal o denominasyonal na pagpapaliwanag.
- issue: Kalagayan ng trono
  choice: Matatag na ang trono mo
  alternative: Itinatag na ang trono mo
  rationale: Mas malapit ang “matatag” sa statibong diwa ng נָכוֹן at iniiwasang lutasin kung ang diin ay nasa pagiging matibay o sa naunang pagkakatatag.
translation_notes:
  register: Makabago ngunit marangal at patula ang wika. Ginamit ang karaniwang “trono” at ang likas na pariralang “mula pa sa walang hanggan.” Ang “noong unang panahon” ay madaling maunawaan ng ordinaryong mambabasa habang pinananatili ang sinaunang temporal na saklaw ng מֵאָז.
