source:
  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: tl
  text: Lubos na mapagkakatiwalaan ang iyong mga patotoo; ang kabanalan ay nababagay sa iyong bahay, Yahweh, magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kahabaan ng mga araw.”
    reason: Ipinakikita ang literal na anyo ng idyomang Hebreo na isinaling “magpakailanman.”
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: iyong mga patotoo
  rationale: Pinananatili ng “mga patotoo” ang diwa ng mga pahayag o patotoong ibinigay ng Diyos, nang hindi ito nililimitahan sa mga batas o tuntunin lamang.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: lubos na mapagkakatiwalaan
  rationale: Ipinahahayag ng Niphal ng אמן ang katatagan at pagiging maaasahan; natural na naihahatid ng “lubos na mapagkakatiwalaan” ang diwang ito sa makabagong Tagalog.
- source_word: לְבֵיתְךָ
  choice: sa iyong bahay
  rationale: Pinananatili ang literal na larawan ng “bahay,” bagaman tumutukoy ito sa tahanan o santuwaryo ng Diyos sa konteksto.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: ang kabanalan ay nababagay
  rationale: Ipinakikita ng parirala na ang kabanalan ay angkop at nararapat sa bahay ng Diyos; ang “nababagay” ay natural at marangal sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְאֹרֶךְ יָמִים
  choice: magpakailanman
  rationale: Ang literal na “sa kahabaan ng mga araw” ay isang idyoma para sa walang hanggang tagal; “magpakailanman” ang malinaw at natural na katumbas sa Tagalog, habang inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ang personal na pangalang tahasang nasa Hebreo at iniiwasang palitan ito ng isang titulo.
- issue: Saklaw ng לְאֹרֶךְ יָמִים
  choice: magpakailanman
  alternative: sa kahabaan ng mga araw
  rationale: Idyomatikong tumutukoy ang parirala sa patuloy o walang hanggang tagal. Pinili ang natural na Tagalog sa teksto at pinanatili ang literal na anyo sa talababa.
- issue: Kaugnayan ng panghuling pariralang temporal
  choice: Iniuugnay sa pagiging angkop ng kabanalan sa bahay ng Diyos
  alternative: Maaaring basahin kasunod ng pantawag na “Yahweh” dahil sa ayos ng mga salita
  rationale: Pinakamalinaw na inilalarawan ng parirala kung gaano katagal nababagay ang kabanalan sa bahay ng Diyos, ngunit pinananatili ng bantas ang posisyon ng pantawag nang hindi ginagawang hiwalay na pahayag.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang karaniwang ayos na panaguri–simuno sa unang sugnay para sa likas na diin, at pinanatili ang “bahay” sa halip na tahasang gawing “templo” upang hindi paliitin ang larawang Hebreo.
