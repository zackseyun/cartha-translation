  text: אֱלֹהִ֥ים בְּ/אַרְמְנוֹתֶ֗י/הָ נוֹדַ֥ע לְ/מִשְׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: tl
  text: Ang Diyos ay kilala sa mga kuta nito bilang matibay na tanggulan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga palasyo nito.” Ang salitang Hebreo ay maaaring tumukoy sa maringal na mga tirahan o sa pinatibay na mga gusali; sinusuportahan ng konteksto ng katiwasayan ng lungsod ang “mga kuta.”
    reason: lexical_alternative
  - marker: b
    text: O “bilang kanlungan” o “bilang muog.” Ang salitang Hebreo ay tumutukoy sa isang mataas at ligtas na lugar na nagbibigay-proteksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ang Diyos
  rationale: Bagaman anyong maramihan sa Hebreo, ginagamit ito rito bilang pang-isahang titulo para sa Diyos ng Israel.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: sa mga kuta nito
  rationale: Maaaring tumukoy ang אַרְמוֹן sa maringal na palasyo o pinatibay na gusali. Sa konteksto ng katiwasayan ng Sion, nangingibabaw ang diwa ng depensa. Ang hulaping pambabae na pang-isahan ay tumutukoy sa lungsod; natural sa modernong Tagalog ang “nito.”
- source_word: נוֹדַע
  choice: ay kilala
  rationale: Ang Niphal ng ידע ay maaaring magpahayag ng kalagayang pasibo, “kilala,” at pinananatili nito ang maigsi at bahagyang bukas na pahayag ng tulang Hebreo.
- source_word: לְמִשְׂגָּב
  choice: bilang matibay na tanggulan
  rationale: Ang מִשְׂגָּב ay isang mataas at ligtas na lugar na nagbibigay-proteksiyon; malinaw at natural na naihahatid ng “matibay na tanggulan” ang larawang ito.
theological_decisions:
- issue: Tinutukoy ng pambabaeng hulapi sa “mga kuta nito”
  choice: Tumutukoy ito sa Sion, ang lungsod na ipinagdiriwang sa awit.
  alternative: Maaaring unawain bilang mas pangkalahatang pagtukoy sa lupain o pamayanan.
  rationale: Nakatuon ang agarang konteksto ng Awit 48 sa Bundok Sion at sa lungsod ng Diyos, kaya ang lungsod ang pinakamalamang na tinutukoy.
- issue: Diwa ng נוֹדַע kaugnay ng pagpapakilala ng Diyos
  choice: “ay kilala,” na nagpapanatili sa statibo o pasibong diwa
  alternative: “ipinakilala ang sarili” o “nagpakilalang”
  rationale: Hindi tahasang ipinahahayag ng anyong Hebreo ang reflexive na ideya ng sadyang pagpapakilala sa sarili, kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang maigsi at patulang ayos ng Hebreo. Ginamit ang “nito” para sa lungsod dahil walang gramatikal na kasariang pambabae ang panghalip sa Tagalog; ang “matibay na tanggulan” ay naghahatid ng larawan ng ligtas at mataas na depensa.
