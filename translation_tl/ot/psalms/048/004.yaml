  rationale: Pinananatili ang batayang diwa ng עָבַר na pagdaan at ang diin ng יַחְדָּו sa sama-samang pagkilos, nang hindi ipinapasok ang mas tiyak ngunit di-tiyak na ideya ng pagsalakay o pagmartsa.
