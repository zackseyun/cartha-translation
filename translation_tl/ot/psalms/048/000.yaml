translation:
  language: tl
  text: Isang awit, isang salmo, ng[a] mga anak ni Korah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mga anak ni Korah.” Sa mga pamagat ng salmo, maaaring tumukoy ang pang-ukol sa Hebreo sa kaugnayan, pag-akda, pag-aalay, o konteksto ng pagtatanghal.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר
  choice: awit
  rationale: Karaniwang salitang Hebreo ito para sa isang awit; likas at malinaw ang “awit” sa makabagong Filipino nang hindi nagdaragdag ng tiyak na uri o layunin.
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Ito ang nakagawiang katawagan sa uring pampanitikan at pangmusika sa mga pamagat ng Mga Awit. Pinananatili itong hiwalay sa שִׁיר upang hindi mawala ang dobleng pagtukoy sa Hebreo.
- source_word: לִבְנֵי
  choice: ng mga anak ni
  rationale: Malawak ang maaaring tungkulin ng pang-ukol na ל sa mga pamagat ng salmo. Ang “ng” ang pinakamaikli at hindi gaanong nagtatakda kung may-akda, kaugnay, pinag-alayan, o tagapagtanghal ang tinutukoy; inilalahad sa talababa ang “para sa” bilang tunay na posibilidad.
- source_word: קֹרַח
  choice: Kora
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo na Korah.
theological_decisions:
- issue: Tungkulin ng pariralang לִבְנֵי קֹרַח sa pamagat
  choice: ng mga anak ni Kora
  alternative: para sa mga anak ni Kora
  rationale: Maaaring magpahiwatig ang Hebreong ל ng kaugnayan, pag-akda, pag-aalay, o konteksto ng pagtatanghal. Hindi tiyak na nilulutas ng pangunahing salin ang ugnayang ito, at pinananatili ng talababa ang mahalagang alternatibo.
translation_notes:
  register: Maikli, marangal, at likas sa makabagong Filipino. Pinanatili ang dalawang katawagang “awit” at “salmo” ayon sa Hebreo, at ikinabit ang panandang [a] sa “ng,” ang salitang tinatalakay ng talababa.
