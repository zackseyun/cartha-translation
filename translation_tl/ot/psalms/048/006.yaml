  text: Doon sila sinaklot ng panginginig at ng paghihirap na gaya ng sa babaeng nanganganak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ding isalin: “pamimilipit na gaya ng sa babaeng nanganganak.” Maaaring idiin ng salitang Hebreo na חִיל ang mismong pamimilipit sa sakit o ang paghihirap na ibinubunga nito.'
