  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sinakmal” upang mapanatili ang biglaan at matinding puwersa ng Hebreo, at ang “matinding kirot” upang maipakita ang pisikal na larawan ng paghihirap sa panganganak.
