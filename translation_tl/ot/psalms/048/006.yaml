lexical_decisions:
- source_word: רְעָדָה
  choice: panginginig
  rationale: Tumutukoy sa aktuwal na panginginig o pagkayanig; pinananatili nito ang kongkretong larawan at natural sa modernong Tagalog.
- source_word: אֲחָזָתַם
  choice: sinakmal sila
  rationale: Ang pandiwang אחז ay nangangahulugang humawak o sumunggab. Ipinahahayag ng “sinakmal” ang biglaan at makapangyarihang pagdaig sa kanila.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang katumbas ng pang-abay na panlunan at pinananatili ang malinaw na tagpuan.
- source_word: חִיל
  choice: matinding kirot
  rationale: Maaaring tumukoy ang חִיל sa pamimilipit, hapdi ng panganganak, o matinding paghihirap. Ang “matinding kirot” ay nagpapanatili sa pisikal na lakas ng larawan nang hindi nililimitahan ito sa damdaming takot lamang.
- source_word: כַּיּוֹלֵדָה
  choice: gaya ng sa babaeng nanganganak
  rationale: Malinaw at likas na paghahambing sa sakit na dinaranas ng isang babae habang nanganganak.
