  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: tl
  text: Kung paanong ang iyong pangalan, O Diyos, gayon din ang papuring nauukol sa iyo hanggang sa mga dulo ng lupa[a]; ang iyong kanang kamay ay puno ng katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang papuring nauukol sa iyo ay nasa mga dulo ng lupa.” Ang Hebreong pang-ukol ay literal na “sa” o “sa ibabaw ng.”
    reason: lexical_alternative
  - marker: b
    text: O “katarungan.” Maaaring tumukoy ang Hebreong צֶדֶק sa katuwiran o katarungan.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן
  choice: Kung ano ang iyong pangalan ... gayon din
  rationale: Pinananatili ang paghahambing at balanseng kayarian ng Hebreong כְּ...כֵּן, habang natural na dumadaloy sa makabagong Tagalog.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ipinahihiwatig ng konteksto ang tuwirang pagtawag; ang “O Diyos” ay marangal at malinaw na bokatibo.
- source_word: תְּהִלָּתְךָ
  choice: ang papuri sa iyo
  rationale: Ang pangunahing diwa ay papuring nauukol o ibinibigay sa Diyos. Mas natural sa Tagalog ang “papuri sa iyo” kaysa “iyong papuri,” na maaaring mapagkamalang papuring binibigkas ng Diyos.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: hanggang sa mga dulo ng lupa
  rationale: Ipinahahayag nito sa likas na Tagalog ang lawak ng papuri, bagaman literal na maaaring unawain ang עַל bilang “sa ibabaw ng” o “sa.”
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Saklaw ng salita ang moral na katuwiran at katarungan. Pinili ang “katuwiran” sa pangunahing teksto at pinanatili ang “katarungan” bilang lehitimong alternatibo sa talababa.
- source_word: מָלְאָה יְמִינֶךָ
  choice: ang iyong kanang kamay ay puspos
  rationale: Pinananatili ang konkretong larawan ng kanang kamay at ang kalagayang lubos itong napuno; ang “puspos” ay maikli, marangal, at natural sa panulaang biblikal.
theological_decisions:
- issue: Saklaw ng צֶדֶק bilang katangian ng kanang kamay ng Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring tumukoy ang Hebreo kapuwa sa matuwid na katangian at sa makatarungang pagkilos. Hindi nilulutas nang palihim ang semantikong tensiyon; inilalagay ang alternatibo sa talababa.
- issue: Kaugnayan ng pangalan ng Diyos at papuri sa kaniya
  choice: Pinanatili ang tahasang paghahambing nang hindi ipinapaliwanag ang “pangalan” bilang “karangalan” o “kabantugan.”
  alternative: Kung ano ang iyong kabantugan, gayon din ang papuri sa iyo
  rationale: Ang “pangalan” ay maaaring magpahiwatig ng reputasyon o pagkakilala sa Diyos, ngunit mahalagang panatilihin ang kongkretong salitang ginamit ng Hebreo at ang masaganang teolohikal na pahiwatig nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Pinanatili ang panulaang paghahambing, ang larawan ng “kanang kamay,” at ang tunay na kalabuan ng עַל at צֶדֶק. Ang “puspos” ay bahagyang mataas ang registro ngunit madaling maunawaan at angkop sa salmo.
