  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: tl
  text: Maganda sa kataasan ang Bundok Zion, ang kagalakan ng buong daigdig, sa malayong hilaga[a]—ang lungsod ng dakilang Hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sa hilagang mga dalisdis”; literal na, “sa malalayong bahagi o tagiliran ng hilaga.” Posible ring alusyon ang parirala sa imahen ng banal na bundok na iniuugnay sa Zaphon.
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה
  choice: Maganda
  rationale: Likas at makabagong panaguring pang-uri na nagpapanatili sa positibong paglalarawan sa Zion.
- source_word: נוֹף
  choice: sa kataasan
  rationale: Ang mahirap na pangngalan ay malamang na tumutukoy sa taas, matayog na anyo, o kinalalagyan; pinananatili ng parirala ang aspektong topograpiko nang hindi labis na nililinaw.
- source_word: מְשׂוֹשׂ
  choice: ang kagalakan
  rationale: Tumutugma sa diwang 'joy/delight' at natural sa pariralang 'ang kagalakan ng buong daigdig.'
- source_word: כָּל הָאָרֶץ
  choice: ng buong daigdig
  rationale: Ipinahahayag ang malawak at pandaigdig na saklaw, sa halip na limitahan ang kahulugan sa isang lupain.
- source_word: הַר צִיּוֹן
  choice: ang Bundok Zion
  rationale: Karaniwang modernong anyo sa Filipino para sa pangngalang heograpiko at pangalan ng lugar.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: sa mga dulong bahagi ng hilaga
  rationale: Malapit sa literal na 'mga malalayong bahagi/tagiliran ng hilaga' at pinananatili ang kalabuan sa pagitan ng heograpikong paglalarawan at posibleng pahiwatig sa Zaphon.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: ang lungsod ng dakilang Hari
  rationale: Natural na salin ng construct chain; ang malaking titik sa 'Hari' ay nagpapakita ng kontekstuwal na pagtukoy sa Diyos nang hindi dinaragdagan ang teksto.
theological_decisions:
- issue: Kahulugan ng יַרְכְּתֵי צָפוֹן kaugnay ng Bundok Zion
  choice: sa mga dulong bahagi ng hilaga
  alternative: sa hilagang mga dalisdis; sa mga liblib na bahagi ng Zaphon/Hilaga
  rationale: Pinananatili ng pangunahing teksto ang heograpikong anyo at ang posibleng alusyon sa banal o kosmikong bundok, sa halip na pasiyahan ang debateng interpretasyon.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Pinanatili ang magkakasunod na panuring at appositional na estruktura ng Hebreo, habang ginawang malinaw sa pamamagitan ng mga kuwit. Ginamit ang “daigdig” para sa pandaigdig na saklaw at “kataasan” upang hindi labis na tukuyin ang di-tiyak na נוֹף.
