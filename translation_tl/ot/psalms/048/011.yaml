  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: tl
  text: Magalak ang Bundok ng Sion; magsaya ang mga anak na babae ng Juda[a] dahil sa iyong mga hatol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bayan/pamayanan ng Juda,” sapagkat ang “mga anak na babae” ay maaaring patulang tumukoy sa mga nakadependeng bayan o pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: Magalak
  rationale: Ang Qal imperfect na יִשְׂמַח ay may tonong paghiling o paghikayat sa kontekstong patula; likas na ipinahahayag ito ng pautos na “Magalak” sa Filipino.
- source_word: הַר צִיּוֹן
  choice: ang Bundok ng Sion
  rationale: Pinananatili ang heograpikong larawan at ang pangalang pantangi sa isang likas at kinikilalang anyong Filipino.
- source_word: תָּגֵלְנָה
  choice: magsaya
  rationale: Ang pandiwa ay tumutukoy sa matinding kagalakan. Ang “magsaya” ay natural na katumbas at bahagyang nag-iiba sa naunang “magalak” habang pinananatili ang magkatulad na larangan ng kahulugan.
- source_word: בְּנוֹת יְהוּדָה
  choice: ang mga anak na babae ng Juda
  rationale: Pinananatili sa pangunahing teksto ang literal at patulang larawan. Maaaring tumukoy ang parirala sa mga bayan o pamayanan ng Juda, kaya inilagay ang heograpikong pagbasa sa talababa.
- source_word: לְמַעַן
  choice: dahil sa
  rationale: Sa konteksto, ipinakikilala nito ang dahilan ng kagalakan; ang “dahil sa” ang pinakanatural na pananalitang Filipino.
- source_word: מִשְׁפָּטֶיךָ
  choice: iyong mga hatol
  rationale: Maaaring mangahulugan ang מִשְׁפָּט ng hatol, katarungan, pasiya, o tuntunin. Dito, ang maramihang “mga hatol” ay angkop sa mga gawa ng Diyos bilang hukom sa konteksto ng salmo.
theological_decisions:
- issue: Kahulugan ng מִשְׁפָּטֶיךָ sa konteksto
  choice: iyong mga hatol
  alternative: iyong katarungan; iyong mga tuntunin
  rationale: Iniuugnay ng nakapaligid na konteksto ang kagalakan sa mapagpasiyang pagkilos ng Diyos bilang Hari at Hukom, hindi pangunahin sa mga kautusang ipinahayag. Pinananatili ng “mga hatol” ang diwang ito nang hindi labis na nililinaw kung anong partikular na mga gawa ang tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang paralelismong patula sa “Magalak… magsaya,” gayundin ang literal na larawang “mga anak na babae ng Juda,” habang nililinaw sa talababa ang posibleng heograpikong kahulugan.
