  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: tl
  text: Sapagkat ang Diyos na ito ang ating Diyos magpakailanman; siya ang papatnubay sa atin maging sa kabila ng kamatayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng huling pariralang Hebreo. Maaari rin itong isalin na “hanggang sa kamatayan.” Sa ibang pagbasa ng mga katinig, maaari itong mangahulugang “magpakailanman.”
    reason: Ang עַל־מוּת ay isang mahirap at pinagtatalunang parirala; kailangang panatilihin para sa mambabasa ang tunay na kalabuan sa halip na itago ito.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: Sapagkat ang Diyos na ito
  rationale: Pinananatili ang demonstratibong diin ng זֶה at ang ugnayang nagbibigay-katwiran ng כִּי.
- source_word: אֱלֹהֵינוּ עוֹלָם וָעֶד
  choice: ang ating Diyos magpakailanman
  rationale: Likas na salin sa modernong Tagalog ng pormulang nagsasaad ng walang-hanggang kaugnayan ng Diyos sa kanyang bayan.
- source_word: יְנַהֲגֵנוּ
  choice: papatnubay sa atin
  rationale: Ipinahahayag ang patuloy na paggabay o pangunguna nang may marangal at karaniwang wikang panrelihiyon.
- source_word: עַל־מוּת
  choice: maging sa kabila ng kamatayan
  rationale: Kinakatawan ang pagbasa sa עַל bilang paglagpas o pananatili sa kabila ng kamatayan, habang minamarkahan sa talababa ang tunay na tekstuwal at leksikal na kalabuan.
theological_decisions:
- issue: Saklaw ng paggabay ng Diyos kaugnay ng kamatayan
  choice: maging sa kabila ng kamatayan
  alternative: hanggang sa kamatayan; o, magpakailanman
  rationale: Hindi tahasang nilulutas ang lahat ng teolohikal na implikasyon. Ang pangunahing salin ay sumusunod sa posibleng diwa ng paglagpas sa kamatayan, ngunit inilalahad sa talababa ang ibang mahahalagang pagbasa ng mahirap na pariralang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “papatnubay” bilang pamilyar ngunit hindi lipas na salitang angkop sa patulang pagsamba; iniwasan ang labis na teknikal o denominasyonal na pananalita.
