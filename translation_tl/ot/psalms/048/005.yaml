translation:
  language: tl
  text: Nakita nila; kaya sila'y namangha; nasindak sila at nagmadaling tumakas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagmamadali silang umalis” o “tumakas sila nang buong pagmamadali.” Ipinahihiwatig ng pandiwang Hebreo ang biglaan at takot na pagmamadali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: nila / sila
  rationale: Ang tahasang panghalip na panlalaking maramihan ay may diin sa Hebreo. Sa natural na Tagalog, sapat itong maipahayag sa mga panghalip na “nila” at “sila,” nang hindi dinaragdagan ng artipisyal na “sila mismo.”
- source_word: רָאוּ
  choice: Nakita
  rationale: Karaniwang Qal na anyo ng ראה, “makita.” Ang “nakita” ang pinakapayak at angkop na salin sa konteksto.
- source_word: כֵּן
  choice: ito, kaya
  rationale: Maaaring tumukoy ang כֵּן sa nakita nila (“ito/gayon”) at maaari ring mag-ugnay sa sumunod na reaksiyon. Pinananatili ng “ito, kaya” ang parehong pagtukoy at resultang ugnayan nang natural sa Tagalog.
- source_word: תָּמָהוּ
  choice: namangha
  rationale: Ipinahahayag ng תמה ang pagkabigla o pagkamangha. Hindi tinutukoy ng “namangha” kung positibo o negatibo ang damdamin, kaya hindi nito nilulutas nang labis ang leksikal na lawak.
- source_word: נִבְהֲלוּ
  choice: nasindak
  rationale: Ang Nifal ng בהל ay tumutukoy sa matinding pagkagulat, pagkabagabag, o pagkatakot. Sa tumitinding pagkakasunod-sunod ng reaksiyon, ang “nasindak” ay maikli, marangal, at angkop.
- source_word: נֶחְפָּזוּ
  choice: nagmadaling tumakas
  rationale: Ang Nifal ng חפז ay nagpapahiwatig ng apurahan at takot na pagmamadali. Sa konteksto, natural na ipinahahayag ng “nagmadaling tumakas” ang mabilis na paglayo nang hindi tahasang idinaragdag ang “sa takot” sa pangunahing teksto.
