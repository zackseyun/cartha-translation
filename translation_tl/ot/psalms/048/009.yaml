  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: tl
  text: 'Pinagbulay-bulayan namin, O Diyos,

    ang iyong tapat na pag-ibig

    ga loob ng iyong templo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: Pinagbulay-bulay namin
  rationale: Sa kontekstong ito, ang piel perfect na anyo ng דמה ay pinakamalamang na tumutukoy sa masusing pag-iisip o pagbubulay. Likas sa makabagong Tagalog ang “pinagbulay-bulay” at angkop ito sa konteksto ng pagsamba.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ginagamit dito ang pangngalan bilang tuwirang pagtawag. Nililinaw ng “O Diyos” ang panalanging tono nang walang idinaragdag na diwa.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ipinahahayag ng חֶסֶד ang pag-ibig na matatag, tapat, at may kaugnayang tipan. Pinananatili ng “tapat na pag-ibig” ang lawak ng diwa nang hindi ito nililimitahan sa habag lamang.
- source_word: בְּקֶרֶב
  choice: sa loob ng
  rationale: Ipinahahayag ng parirala ang lokasyon sa kaloob-looban o loob ng isang lugar. Mas natural sa Tagalog ang “sa loob ng” kaysa sa literal na “sa gitna ng” para sa pananatili sa templo.
- source_word: הֵיכָלֶךָ
  choice: iyong templo
  rationale: Bagaman maaaring mangahulugan ang הֵיכָל na palasyo o templo, malinaw na “templo” ang pinakaangkop sa konteksto ng pagsamba sa awit na ito.
theological_decisions:
- issue: Diwa ng חֶסֶד bilang katangian ng Diyos
  choice: tapat na pag-ibig
  alternative: habag; kagandahang-loob; pag-ibig na ayon sa tipan
  rationale: Pinananatili ng salin ang relasyonal na katapatan at pag-ibig na saklaw ng salitang Hebreo, nang hindi ito pinakikitid sa habag o ginagawang teknikal na terminong teolohikal.
- issue: Gamit ng אֱלֹהִים bilang tuwirang pagtawag o simpleng pagtukoy
  choice: 'Tuwirang pagtawag: “O Diyos”'
  alternative: 'Simpleng pagtukoy: “Diyos”'
  rationale: Pinakanatural basahin ang sugnay bilang tuwirang pananalita sa Diyos sa loob ng panalangin o awit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang anyong patula sa tatlong linya upang mapanatili ang tuwirang pagtawag sa Diyos at ang daloy ng talata.
