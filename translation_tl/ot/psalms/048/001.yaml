  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: tl
  text: Dakila si Yahweh at lubos na pinupuri[a] sa lungsod ng ating Diyos, sa kanyang banal na bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at lubos na marapat purihin.” Ang salitang Hebreo ay isang pasibong pandiwaring maaaring isalin nang mas literal bilang “lubos na pinupuri” o nang mas idyomatiko bilang “lubos na marapat purihin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Dakila
  rationale: Bilang panaguring pang-uri sa simula ng talata, ipinahahayag nito ang kadakilaan ni Yahweh nang hindi nililimitahan ang diwa sa lakas lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וּמְהֻלָּל מְאֹד
  choice: at lubos na karapat-dapat purihin
  rationale: Ang pasibong pandiwaring מְהֻלָּל, na pinalalakas ng מְאֹד, ay likas na naipahahayag sa Tagalog bilang pagiging lubos na karapat-dapat sa papuri; nananatili sa talababa ang mas literal na posibilidad na “lubos na pinupuri.”
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: sa lungsod ng ating Diyos
  rationale: Pinananatili nito ang lokatibong gamit ng בְּ at ang ugnayang pag-aari sa pariralang “lungsod ng ating Diyos.”
- source_word: הַר קָדְשׁוֹ
  choice: sa kanyang banal na bundok
  rationale: Malinaw at natural nitong tinutukoy ang banal na bundok bilang lokasyon na kaagapay ng lungsod ng Diyos; ang ikalawang “sa” ay ipinahiwatig ng estrukturang Hebreo at kailangang ulitin sa natural na Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng pasibong pandiwaring מְהֻלָּל
  choice: karapat-dapat purihin
  alternative: pinupuri
  rationale: Maaaring tumukoy ang anyo sa aktuwal na pagpuri o sa pagiging marapat sa papuri. Ang pangunahing teksto ay gumagamit ng natural na predikatibong diwa, habang itinatala sa talababa ang mas literal na alternatibo upang hindi maitago ang leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling paralelismo ng tulang Hebreo at ginamit ang “Yahweh” bilang pangalan, hindi bilang titulo.
