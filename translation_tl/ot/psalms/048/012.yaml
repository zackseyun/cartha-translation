lexical_decisions:
- source_word: סֹבּוּ
  choice: Libutin ninyo
  rationale: Ang pangmaramihang pautos mula sa סבב ay tumatawag sa mga nakikinig na gumalaw sa palibot ng Zion. Likas sa modernong Tagalog ang “libutin” at pinananatili nito ang kongkretong kilos.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Pangngalang pantangi ito at walang salitang “Bundok” sa Hebreo.
- source_word: וְהַקִּיפוּהָ
  choice: at ikutan ito
  rationale: Pangmaramihang pautos ito na may hulaping tumutukoy sa Zion bilang lungsod. Ipinahahayag ng “ikutan” ang pag-ikot sa palibot nang hindi nagpapahiwatig ng mapusok na pagkubkob.
- source_word: סִפְרוּ
  choice: bilangin ninyo
  rationale: Sa tuwirang layon na mga tore, ang kahulugan ay pagtiyak sa bilang, hindi pagsasalaysay.
- source_word: מִגְדָּלֶיהָ
  choice: ang mga tore nito
  rationale: Tumutukoy ang hulaping pambabae sa Zion. Bagaman hindi likas sa Tagalog ang pambabaeng panghalip para sa lungsod, malinaw na pinananatili ng “nito” ang pagtukoy sa Zion.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyo” upang maipakita ang pangmaramihang pautos. Hindi ipinilit ang pambabaeng personipikasyon ng Hebreo dahil hindi ito likas sa panghalip ng Tagalog, ngunit malinaw na ang Zion ang tinutukoy.
