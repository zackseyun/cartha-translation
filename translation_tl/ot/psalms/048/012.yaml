  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: tl
  text: Lumibot kayo sa Zion at ikutin ninyo ito[a]; bilangin ninyo ang mga tore nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ikutin ninyo ang Zion at palibutan ninyo ito.”
