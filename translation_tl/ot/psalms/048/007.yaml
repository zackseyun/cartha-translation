  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: tl
  text: Sa pamamagitan ng silangang hangin, winawasak mo ang mga barko ng Tarsis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga barkong patungong Tarsis” o “mga barkong Tarsis,” isang pariralang maaaring tumukoy sa malalaking barkong pangkalakalan na naglalayag sa dagat at nauugnay sa Tarsis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: Sa pamamagitan ng hanging silangan
  rationale: 'Ang רוּחַ kasama ng קָדִים ay tumutukoy sa hanging silangan, at ang בְּ ay instrumental: ito ang paraang ginamit sa pagwasak.'
- source_word: תְּשַׁבֵּר
  choice: winawasak mo
  rationale: Ang Piel ng שׁבר ay nagpapahayag ng marahas at matinding pagbasag. Pinananatili ng 'winawasak mo' ang ikalawang panauhang panlalaki na tuwirang tumutukoy sa Diyos sa konteksto.
- source_word: אֳנִיּוֹת
  choice: ang mga barko
  rationale: Karaniwang salin ng pangmaramihang pangngalan na tumutukoy sa mga sasakyang-dagat; natural ang 'mga barko' sa modernong Filipino.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Isinasalin sa nakaugaliang anyong Filipino ng pangalang pantangi. Hindi nilulutas sa pangunahing teksto ang maaaring kahulugang barkong kaugnay ng Tarsis o uri ng malalaking barkong pangkalakalan.
theological_decisions:
- issue: Tinutukoy ng pandiwang nasa ikalawang panauhan
  choice: Tuwirang pakikipag-usap sa Diyos ('winawasak mo')
  alternative: Di-tiyak o pangkalahatang pahayag
  rationale: Ang anyong ikalawang panauhang panlalaki ng pandiwa at ang konteksto ng salmo ay natural na nagpapatuloy sa tuwirang pakikipag-usap sa Diyos, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Sa pamamagitan ng' upang hayagang ipakita ang instrumental na gamit ng pang-ukol, at 'winawasak' upang maipahayag ang lakas ng pandiwa habang nananatiling natural.
