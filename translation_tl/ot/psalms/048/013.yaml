translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang idyomang ‘ituon ang puso’ at ang pambabaeng panghalip para sa Sion/lungsod. Ginamit ang ‘muog’ at ‘mga tanggulan’ bilang madaling maunawaang bokabularyong pangdepensa, na may mga talababa para sa tunay na mga alternatibong leksikal.
