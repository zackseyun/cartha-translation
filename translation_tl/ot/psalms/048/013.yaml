  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: tl
  text: Ituon ninyo ang inyong puso sa kanyang muog[a]; libutin ninyo ang kanyang mga tanggulan[b], upang maisalaysay ninyo ito sa susunod na salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang panlabas na pader.” Malawak ang saklaw ng salitang Hebreo at tumutukoy sa muog o iba pang depensa ng isang lungsod.
    reason: lexical_alternative
  - marker: b
    text: O “kanyang mga palasyo.” Maaaring tumukoy ang salitang Hebreo sa mariringal na gusali o sa matitibay na tanggulan; pinapaboran ng konteksto ng pagsusuri sa mga depensa ng lungsod ang “mga tanggulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Ituon ninyo ang inyong puso
  rationale: Pinananatili ang larawang Hebreo ng ‘puso,’ na saklaw ang pag-iisip at pagbibigay-pansin, habang likas sa modernong Tagalog ang pandiwang ‘ituon.’
- source_word: לְחֵילָה
  choice: sa kanyang muog
  rationale: Ang חֵיל sa paglalarawan ng lungsod ay tumutukoy sa depensibong pader o kuta. Ang ‘muog’ ay maikli, marangal, at malinaw na katawagang pangdepensa.
- source_word: פַּסְּגוּ
  choice: libutin ninyo
  rationale: Bihira ang pandiwa at sa konteksto ay nag-uutos ng pisikal na pagdaan upang masuri ang mga gusali ng lungsod. Ipinahahayag ng ‘libutin’ ang pagkilos nang hindi nililimitahan ito sa purong pagmamasid.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ang kanyang mga tanggulan
  rationale: Maaaring mangahulugan ang אַרְמוֹן ng mga palasyo o matitibay na gusali. Dahil kasama ito sa pagsusuri sa mga depensa ng Sion, ang ‘mga tanggulan’ ang pinakamalinaw sa konteksto.
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at marangal na panandang nagsasaad ng layunin.
- source_word: תְּסַפְּרוּ
  choice: maisalaysay ninyo ito
  rationale: Ang piel ng ספר ay nangangahulugang maglahad o magsalaysay. Nilinaw ng ‘ito’ ang bagay na isasalaysay—ang napagmasdang kalagayan ng Sion—nang hindi nagdaragdag ng tiyak na interpretasyon.
- source_word: לְדוֹר אַחֲרוֹן
  choice: sa susunod na salinlahi
  rationale: Likas na katumbas ng ‘sa isang salinlahing darating’ at pinananatili ang diwa ng pagpasa ng patotoo sa hinaharap.
