  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: tl
  text: 'Gaya ng aming narinig, gayon din ang aming nakita sa lungsod ni Yahweh ng mga hukbo, sa lungsod ng aming Diyos: itatatag ng Diyos ang lungsod[a] magpakailanman. Selah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, ang hulapi sa “itatatag” ay pambabaeng isahan at tumutukoy sa lungsod, na inilalarawan na parang isang babae. Maaari ring isalin: “itatatag ito ng Diyos magpakailanman.”'
    reason: Ipinapaliwanag ang pambalarilang kasarian at personipikasyon na hindi tuwirang maipakikita sa mga panghalip na Tagalog.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Gaya ng ... gayon din
  rationale: Pinananatili ang magkaugnay na paghahambing na “kung paanong/gaya ng ... gayon,” sa dignidad ngunit malinaw na makabagong Tagalog.
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: aming narinig ... aming nakita
  rationale: Tuwirang ipinapahayag ang magkatapat na karanasan ng narinig na ulat at aktuwal na nasaksihan; hindi kailangang piliting ipakita sa Tagalog ang aspektong perpekto sa pamamagitan ng dagdag na salita.
- source_word: בְּעִיר
  choice: sa lungsod
  rationale: Natural at tuwirang katumbas ng lokatibong parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili ang malawak na kahulugan ng maramihang “mga hukbo” nang hindi nililimitahan kung makalangit o makalupa ang tinutukoy.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Tuwirang inililipat ang pangngalan at hulaping unang panauhang maramihan.
- source_word: יְכוֹנְנֶהָ
  choice: itatatag ng Diyos ang lungsod
  rationale: Ang pandiwa ay nangangahulugang itatag o gawing matibay. Inulit ang “lungsod” upang maging malinaw sa Tagalog ang tinutukoy ng hulaping pambabae, sapagkat walang kasariang pambalarila ang mga panghalip sa Tagalog.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Natural at malinaw na katumbas ng walang hanggang pananatili.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili bilang transliterasyon dahil hindi tiyak ang eksaktong gamit o kahulugan nito.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa halip na palitan ng titulo.
- issue: Tinutukoy ng hulaping pambabae sa יְכוֹנְנֶהָ
  choice: ang lungsod
  alternative: ito / siya
  rationale: Ang hulapi ay pambabaeng isahan at likas na tumutukoy sa עִיר, “lungsod,” na pambabae sa Hebreo. Dahil walang katumbas na panghalip na may kasariang pambalarila sa Tagalog, inulit ang “lungsod” at ipinaliwanag sa talababa ang personipikasyon.
- issue: Lakas ng pandiwang כון
  choice: itatatag
  alternative: patatatagin / gagawing matatag
  rationale: Ang “itatatag” ay nagpapanatili sa larawan ng Diyos na nagbibigay ng matibay at namamalaging katayuan sa lungsod, nang hindi nagpapaliit sa kahulugan tungo lamang sa kaligtasan laban sa panganib.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pares na “Gaya ng ... gayon din” upang mapanatili ang balangkas ng tulang Hebreo. Hindi ginamitan ng kasariang panghalip ang lungsod dahil magiging di-likas o malabo iyon sa Tagalog; sa halip, inulit ang pangngalan at inilagay sa talababa ang detalye ng Hebreo.
