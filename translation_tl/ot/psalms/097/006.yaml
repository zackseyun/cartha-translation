  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: tl
  text: 'Ipinahahayag ng kalangitan ang kanyang katuwiran[a],

    at nakikita ng lahat ng mga bayan ang kanyang kaluwalhatian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring tumukoy ang salitang Hebreo kapwa sa katuwiran at katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: Ipinahahayag
  rationale: Ang Hiphil perfect ng נגד ay nangangahulugang ipaalam o ipahayag. Ang kasalukuyang anyo ay natural sa makatang paglalarawan at nagpapanatili sa buhay at pangkalahatang bisa ng pahayag.
- source_word: הַשָּׁמַיִם
  choice: ang kalangitan
  rationale: Ang שָׁמַיִם ay tumutukoy sa kalangitan o mga langit. Sa maringal at kosmikong tagpo ng salmo, ang “kalangitan” ay natural sa modernong Filipino at angkop bilang tila personipikadong saksi.
- source_word: צִדְקוֹ
  choice: ang kanyang katuwiran
  rationale: Ang צֶדֶק ay maaaring tumukoy kapwa sa katuwiran at katarungan. Pinili ang “katuwiran” bilang malawak at nakaugaliang salin para sa matuwid na katangian at mga gawa ng Diyos, habang inilalagay sa talababa ang tunay na alternatibong “katarungan.”
- source_word: וְרָאוּ
  choice: at nakikita
  rationale: Bagaman perfect ang anyong Hebreo at maaari ring isaling nakaraang kilos, ang kasalukuyang panahunan ay angkop sa matingkad at pangkalahatang pahayag ng tula.
- source_word: כָל הָעַמִּים
  choice: ng lahat ng mga bayan
  rationale: Ang plural na עַמִּים ay literal na “mga bayan” o “mga sambayanan.” Ang “lahat ng mga bayan” ay nagpapanatili sa pangmaramihang diwa at pandaigdigang saklaw nang hindi nililimitahan sa mga estadong politikal.
- source_word: כְּבוֹדוֹ
  choice: ang kanyang kaluwalhatian
  rationale: Kapag tumutukoy sa Diyos, ang כָּבוֹד ay karaniwang nagpapahayag ng hayag na kadakilaan at karangalan. “Kaluwalhatian” ang pinakanaaangkop at kinikilalang salin sa maringal na kontekstong ito.
theological_decisions:
- issue: Kahulugan ng banal na katangiang צִדְקוֹ
  choice: ang kanyang katuwiran
  alternative: ang kanyang katarungan
  rationale: Saklaw ng salitang Hebreo kapwa ang moral na katuwiran at ang makatarungang paghatol o pagkilos. Pinananatili sa pangunahing teksto ang “katuwiran,” ngunit itinatala ang “katarungan” upang hindi mapawi ang leksikal at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang makatang himig. Ginamit ang “kalangitan,” “katuwiran,” at “kaluwalhatian” upang mapanatili ang mataas na rehistro ng salmo nang manatiling madaling maunawaan.
