  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: tl
  text: Ang mga bundok ay natutunaw na parang pagkit sa harap ni Yahweh,[a] sa harap ng Panginoon ng buong lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa harap/presensiya ni Yahweh”; isinaling “sa harap ni Yahweh” para sa natural na Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tiyak na pangngalang maramihan; likas itong isinasalin sa Filipino bilang “ang mga bundok,” na nagpapanatili sa makatang larawan ng sangnilikha.
- source_word: כַּדּוֹנַג
  choice: na parang pagkit
  rationale: Ang unlaping כַּ ay naghahayag ng paghahambing. Ang “parang pagkit” ay natural sa modernong Filipino at malinaw na nagpapanatili sa pagtutulad.
- source_word: נָמַסּוּ
  choice: ay natutunaw
  rationale: Ang pandiwa ay nangangahulugang matunaw o malusaw. Ginamit ang pangkasalukuyang anyo upang ihatid ang buhay at makatang paglalarawan ng kapangyarihan ng pagpapakita ng Diyos, bagaman anyong perfect ang Hebreo.
- source_word: מִלִּפְנֵי
  choice: sa harap ng
  rationale: Literal itong tumutukoy sa pagiging mula sa harap o presensiya ng isang persona. Ang “sa harap ng” ay maikli, natural, at nagpapanatili sa diwa ng presensiya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalang Hebreo sa transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֲדוֹן
  choice: Panginoon
  rationale: Ang titulo ay nangangahulugang panginoon o amo. Ang “Panginoon” ay angkop sa marangal na makatang rehistro at malinaw na naiiba sa personal na pangalang Yahweh.
- source_word: כָּל הָאָרֶץ
  choice: ng buong lupa
  rationale: Direktang pinananatili nito ang ugnayang “Panginoon ng buong lupa” at ang pansaklaw na diwa ng כָּל.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan, samantalang ang אֲדוֹן sa ikalawang hati ay isinasaling “Panginoon” bilang titulo.
- issue: Aspekto ng נָמַסּוּ sa kontekstong patula
  choice: pangkasalukuyang “natutunaw”
  alternative: pangnagdaan na “natunaw”
  rationale: Bagaman perfect ang anyong Hebreo, maaari itong maglarawan nang matingkad sa isang teopanikong tagpo. Ang pangkasalukuyan ay natural sa Filipino at hindi nagtatakda nang labis ng tiyak na kronolohiya.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang paralelismo ng dalawang pariralang “sa harap,” ang paghahambing sa pagkit, at ang pagkakaiba ng personal na pangalang “Yahweh” sa titulong “Panginoon.”
