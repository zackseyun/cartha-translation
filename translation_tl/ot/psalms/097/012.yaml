  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: tl
  text: Magalak kayo kay Yahweh, kayong mga matuwid, at magpasalamat kayo sa paggunita sa kanyang kabanalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “magpasalamat kayo sa pagbanggit sa kanyang kabanalan.” Ang זֵכֶר ay maaaring mangahulugang paggunita, alaala, o pagbanggit. May mga saling “kanyang banal na pangalan,” ngunit literal na sinasabi rito ng Hebreo na “kanyang kabanalan”; wala rito ang salitang “pangalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Magalak kayo
  rationale: Pautos na maramihan mula sa שׂמח; likas at marangal itong panawagan sa masayang pagtugon.
- source_word: צַדִּיקִים
  choice: kayong mga matuwid
  rationale: Tuwirang tawag sa isang pangkat na inilalarawang matuwid; pinananatili ang maramihan at ang bokatibong diin.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang בְּ ay tumutukoy sa pinagtutuunan o batayan ng kagalakan; ang banal na pangalang יהוה ay isinaling Yahweh.
- source_word: וְהוֹדוּ
  choice: at magpasalamat kayo
  rationale: Hiphil na pautos na maramihan mula sa ידה; sa kontekstong ito, malinaw na ipinahahayag ang pasasalamat o pagpupuri.
- source_word: לְזֵכֶר
  choice: sa pag-alaala sa
  rationale: Maaaring mangahulugang pag-alaala, alaala, o pagbanggit ang זֵכֶר. Ang 'sa pag-alaala sa' ay nagpapanatili sa pangunahing kahulugan nang hindi isinasara ang saklaw nito; inilalahad sa talababa ang ibang posibilidad.
- source_word: קָדְשׁוֹ
  choice: kanyang kabanalan
  rationale: Literal na 'kanyang kabanalan.' Hindi idinagdag ang 'pangalan' sapagkat walang שֵׁם sa tekstong Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kung idaragdag ang 'pangalan' sa קָדְשׁוֹ
  choice: kanyang kabanalan
  alternative: kanyang banal na pangalan
  rationale: Walang salitang שֵׁם ('pangalan') sa Hebreo. Bagaman pamilyar ang kahaliling parirala sa ibang mga awit, hindi ito dapat ipasok dito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'magalak' at 'magpasalamat' bilang likas na mga pautos, at pinanatili ang bahagyang di-karaniwang 'pag-alaala sa kanyang kabanalan' upang huwag tabunan ang tunay na leksikal na tensiyon ng Hebreo.
