  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: tl
  text: 'Mapahiya ang lahat ng naglilingkod sa mga larawang inukit,

    ang mga nagmamalaki sa mga diyus-diyosan;

    yumukod kayo sa kanya, lahat kayong mga diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, “lahat kayong nilalang sa langit,” o “lahat kayong anghel.” Sa Hebreo: “lahat ng mga diyos.” Maaaring polemikal itong tumukoy sa mga diyos ng mga bansa, o sa mga nilalang sa langit na nasa harap ng PANGINOON.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Mapahiya
  rationale: Ipinahahayag ng pandiwa ang pagkahantad sa kahihiyan o pagkadusta; natural sa Filipino ang pormang ito at naipapanatili nito ang puwersa ng Hebreong anyo sa konteksto.
- source_word: עֹבְדֵי
  choice: naglilingkod
  rationale: Ang participle mula sa עבד ay tumutukoy sa mga gumagawa ng paglilingkod na, dahil sa layon nito, ay malinaw na panrelihiyon o pansamba.
- source_word: פֶסֶל
  choice: mga larawang inukit
  rationale: Tiyak na tumutukoy ang salita sa mga imaheng hinubog sa pamamagitan ng pag-ukit, kaya mas eksakto ito kaysa sa pangkalahatang 'diyus-diyosan.'
- source_word: הַמִּתְהַלְלִים
  choice: mga nagmamapuri
  rationale: Ipinahihiwatig ng hitpael ang pagmamalaki o pagyayabang; dignified at natural sa makabagong Filipino ang 'nagmamapuri.'
- source_word: בָּאֱלִילִים
  choice: sa mga diyus-diyosan
  rationale: Tumutukoy ang אֱלִילִים sa mga idolo at maaari ring magtaglay ng mapanlibak na diwang 'walang kabuluhan'; hindi idinagdag ang huling diwa upang maiwasan ang labis na pagpapaliwanag sa teksto.
- source_word: הִשְׁתַּחֲווּ
  choice: yumukod
  rationale: Pinananatili nito ang pisikal na larawan ng pagpapatirapa o pagyukod bilang pagpupugay, sa halip na agad itong gawing mas interpretibong 'sumamba.'
- source_word: לוֹ
  choice: sa kanya
  rationale: Ito ang tuwiran at natural na katumbas ng pang-ukol na ל na may panghalip na hulapi sa pariralang 'yumukod sa kanya.'
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Pinananatili ng literal na salin ang sadyang tensiyon kung ang tinutukoy ay mga diyos ng mga bansa o mga nilalang sa langit.
theological_decisions:
- issue: Tinutukoy ng כָּל אֱלֹהִים
  choice: kayong lahat na mga diyos
  alternative: kayong lahat na mga nilalang sa langit; kayong lahat na mga anghel
  rationale: Literal na 'lahat ng mga diyos' ang Hebreo. Maaaring polemikal itong tumukoy sa mga diyos ng mga bansa, o tumukoy sa mga nilalang sa langit na nasa harap ng PANGINOON. Pinanatili sa pangunahing teksto ang literal na pananalita at inilagay sa talababa ang ibang posibleng pagbasa upang hindi lutasin nang palihim ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng tula at ang pagkakaiba ng 'mga larawang inukit' at 'mga diyus-diyosan.' Ginamit ang 'yumukod' upang mapanatili ang konkretong kilos sa Hebreo, at ang 'mga diyos' upang huwag takpan ang tunay na leksikal at teolohikal na tensiyon.
