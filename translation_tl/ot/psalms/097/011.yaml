  text: א֭וֹר זָרֻ֣עַ לַ/צַּדִּ֑יק וּֽ/לְ/יִשְׁרֵי לֵ֥ב שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/011.yaml
  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: tl
  text: 'Ang liwanag ay inihasik para sa matuwid[a],

    at ang kagalakan ay para sa mga may pusong matuwid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Ang liwanag ay ikinalat/itinanim para sa matuwid.” Pinananatili ng Hebreo ang larawang pansakahan: ang liwanag ay inilalarawang parang binhing inihahasik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: liwanag
  rationale: Tuwirang pinananatili ang malawak na matalinghagang larawan ng liwanag, na maaaring magpahiwatig ng pagpapala, kaligtasan, o kaginhawahan nang hindi nililimitahan sa isa lamang.
- source_word: זָרֻעַ
  choice: inihasik
  rationale: Pinananatili ang pasibong anyo at larawang pansakahan ng pandiwang זרע. Likas sa Filipino ang “inihasik” at mas tiyak ito kaysa sa pagpapakahulugang “inihanda” o “inilaan.”
- source_word: לַצַּדִּיק
  choice: para sa matuwid
  rationale: Ipinahahayag ng “para sa” ang kapakinabangan o patutunguhan na taglay ng ל, samantalang pinananatili ng “matuwid” ang pangkalahatang kinatawang diwa ng isahang anyo.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: at ... para sa mga may pusong matuwid
  rationale: Natural na modernong Tagalog para sa idyomang tumutukoy sa mga taong matuwid ang kalooban, habang pinananatili ang paralelismo sa unang linya.
- source_word: שִׂמְחָה
  choice: kagalakan
  rationale: Dignificado at malinaw na katumbas ng joy/gladness, at angkop sa maikling paralelismong patula.
theological_decisions:
- issue: Matalinghagang kahulugan ng “liwanag”
  choice: Pinanatili ang “Ang liwanag ay inihasik” nang hindi tahasang ipinakahulugang kaligtasan, kasaganaan, o pagpapawalang-sala.
  alternative: “Inilaan ang kaligtasan/kasaganaan para sa matuwid.”
  rationale: Hindi nilulutas ng Hebreong tula ang lawak ng larawan. Ang pagpapanatili sa talinghaga ay nag-iingat sa tunay na ambiguwidad at lakas ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at patula. Ginamit ang “inihasik” upang mapanatili ang di-karaniwang ngunit sadyang matingkad na larawan ng orihinal; ang “mga may pusong matuwid” ay natural na pagpapahayag ng idyomang Hebreo.
