id: PSA.97.8
reference: Psalms 97:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: tl
  text: 'Nakarinig ang Sion at nagalak;

    nagbunyi ang mga anak na babae ng Juda[a]

    dahil sa iyong mga hatol, Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bayan ng Juda” o “mga nayon ng Juda.” Literal sa Hebreo ang “mga anak na babae ng Juda,” isang makatang pananalitang maaaring tumukoy sa mga pamayanang sakop o nakapaligid sa Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: Nakarinig
  rationale: Qal perfect, ikatlong panauhang pambabae na isahan, na ang Sion ang simuno. Hindi dinagdagan ng tiyak na layon upang mapanatili ang pagkakabukas ng Hebreo.
- source_word: וַתִּשְׂמַח
  choice: at nagalak
  rationale: Ipinapahayag ng שׂמח ang tuwa o kagalakan; likas at marangal sa modernong Tagalog ang “nagalak.”
- source_word: צִיּוֹן
  choice: ang Sion
  rationale: Pinanatili ang pantanging pangalang Sion sa karaniwang anyong Tagalog, sa halip na ipalit ang Jerusalem o ang bayan na maaari nitong katawanin.
- source_word: וַתָּגֵלְנָה
  choice: nagbunyi
  rationale: Ang גיל ay nagpapahiwatig ng masiglang kagalakan. Naiiba ang “nagbunyi” sa naunang “nagalak” at pinananatili ang pagtindi ng diwa.
- source_word: בְּנוֹת יְהוּדָה
  choice: ang mga anak na babae ng Juda
  rationale: Ito ang literal at makatang anyo ng Hebreo. Maaari rin itong tumukoy sa mga bayan o pamayanan ng Juda, kaya inilagay ang heograpikong pakahulugan sa talababa sa halip na lutasin ang ambiguwidad sa pangunahing teksto.
- source_word: לְמַעַן
  choice: dahil sa
  rationale: Sa konteksto, ipinakikilala nito ang dahilan ng kanilang kagalakan; natural na naihahatid ito ng “dahil sa.”
- source_word: מִשְׁפָּטֶיךָ
  choice: iyong mga hatol
  rationale: Pinananatili ng “mga hatol” ang maramihang anyo at hudisyal na diwa ng מִשְׁפָּט, nang hindi nililimitahan ito sa mga kautusan lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi bilang titulong “Panginoon.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kung literal o heograpikong idyoma ang בְּנוֹת יְהוּדָה
  choice: mga anak na babae ng Juda
  alternative: mga bayan ng Juda / mga nayon ng Juda
  rationale: Pinananatili sa pangunahing teksto ang literal na makatang larawan, samantalang inilalahad sa talababa ang posibleng pagtukoy nito sa mga nakapaligid na pamayanan ng Juda.
translation_notes:
  register: Makabago ngunit marangal na Tagalog; pinanatili ang paralelismong patula, ang pagkakaiba ng “nagalak” at “nagbunyi,” at ang tunay na ambiguwidad ng “mga anak na babae ng Juda.”
