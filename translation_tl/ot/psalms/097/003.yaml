  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: tl
  text: Apoy ang nauuna sa kanya at tinutupok nito ang kanyang mga kalaban sa buong paligid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang mga kaaway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: Apoy
  rationale: Tuwirang tumutukoy sa apoy; hindi kailangan ang pantukoy na magdaragdag ng katiyakan o pagiging di-tiyak na wala sa tulang Hebreo.
- source_word: לְפָנָיו
  choice: nauuna sa kanya
  rationale: Likas na Filipino para sa larawang ang apoy ay humahayo sa harapan niya, nang hindi pinapangalanan ang tinutukoy ng panghalip.
- source_word: תֵּלֵךְ
  choice: nauuna
  rationale: Sa kontekstong ito, ipinahahayag ng הלך ang pag-usad ng apoy sa harapan niya; mas natural ito kaysa sa literal na 'lumalakad.'
- source_word: וּתְלַהֵט
  choice: tumutupok
  rationale: Inihahatid ang matinding pagkasunog na ipinahihiwatig ng pandiwa habang nananatiling natural at makata sa Filipino.
- source_word: סָבִיב
  choice: sa buong paligid
  rationale: Pinananatili ang saklaw na paikot o nakapalibot, hindi lamang isang panig.
- source_word: צָרָיו
  choice: kanyang mga kalaban
  rationale: Ipinapahayag ang mga sumasalungat o kumakalaban sa kanya; ang 'mga kaaway' ay nananatiling wastong alternatibo.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na panlalaking isahan sa konteksto ng pagpapakita ng Diyos sa Awit 97
  choice: Panatilihin ang 'kanya/kanyang' at hayaang linawin ng konteksto ang tinutukoy.
  alternative: Palitan ng tahasang 'PANGINOON' kahit wala ang pangalang iyon sa mismong talata.
  rationale: Panghalip ang nasa Hebreo, at malinaw ang tinutukoy mula sa konteksto. Pinananatili nito ang daloy ng tula at iniiwasang magdagdag ng pangngalang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'tumutupok' upang mapanatili ang malakas at makatang larawan ng nagliliyab na apoy, at iniwasan ang sobrang literal na 'lumalakad ang apoy.'
