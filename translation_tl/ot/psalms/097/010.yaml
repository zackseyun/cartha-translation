base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: tl
  text: Kayong umiibig kay Yahweh, kapootan ninyo ang masama. Iniingatan niya ang buhay ng mga tapat sa kanya; inililigtas niya sila mula sa kamay ng masasama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Iniingatan niya ang mga kaluluwa ng kanyang mga banal.” Ang Hebreong nephashot ay maaaring mangahulugang “buhay,” “mga tao,” o “mga kaluluwa”; at ang hasidav ay maaari ring isaling “kanyang mga tapat,” “kanyang mga maka-Diyos,” o “kanyang mga banal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Kayong umiibig kay Yahweh
  rationale: Ginagawang malinaw sa natural na Tagalog ang tuwirang pagtukoy sa mga umiibig kay Yahweh, habang pinananatili ang diwa ng Hebreong pariralang literal na ‘mga umiibig kay Yahweh.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa pamamagitan ng transliterasyong ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
- source_word: שִׂנְאוּ
  choice: kapootan ninyo
  rationale: Ang pandiwa ay pautos sa ikalawang panauhang maramihan. Ang ‘kapootan ninyo’ ay tuwiran at hindi pinahihina ang utos.
- source_word: רָע
  choice: ang masama
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa masama sa malawak na moral na kahulugan.
- source_word: שֹׁמֵר
  choice: Iniingatan niya
  rationale: Ipinahahayag ng participle ang palagian o likas na gawain ni Yahweh na mangalaga at magbantay.
- source_word: נַפְשׁוֹת
  choice: ang buhay
  rationale: Sa konteksto ng pag-iingat at pagliligtas mula sa masasama, ang salita ay tumutukoy sa buhay o mismong persona, hindi kinakailangang sa di-materyal na kaluluwa.
- source_word: חֲסִידָיו
  choice: mga tapat sa kanya
  rationale: Ipinapahayag nito ang mga taong may katapatan at debosyon kay Yahweh. Natural ito sa modernong Tagalog at hindi gumagamit ng katawagang maaaring may makitid na tradisyong eklesiastiko.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang Hebreong larawan ng ‘kamay’ bilang kapangyarihan o kontrol, na malinaw pa rin sa Tagalog.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Tumutukoy ito sa mga taong may kasalanan o masamang asal; ang ‘masasama’ ay payak at pangkalahatan.
- source_word: יַצִּילֵם
  choice: inililigtas niya sila
  rationale: Ipinahahayag ang aktibong pagsagip mula sa kapangyarihan ng masasama nang hindi kinakailangang ipakahulugan dito ang mas malawak na sistematikong konsepto ng kaligtasan.
theological_decisions:
- issue: Kahulugan ng נַפְשׁוֹת sa konteksto
  choice: ang buhay
  alternative: ang mga kaluluwa; ang mga persona
  rationale: Ang magkatambal na pag-iingat at pagliligtas mula sa kamay ng masasama ay pumapabor sa konkretong diwa ng buhay o persona. Hindi ipinapasok ang isang tiyak na doktrina tungkol sa kaluluwa na hindi tahasang itinuturo ng talata.
- issue: Pagpapakahulugan sa חֲסִידָיו
  choice: mga tapat sa kanya
  alternative: kanyang mga banal; kanyang mga maka-Diyos; kanyang mga matapat
  rationale: Sinasaklaw nito ang katapatan, debosyon, at ugnayan kay Yahweh nang hindi nililimitahan ang salita sa isang teknikal o denominasyonal na katawagan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tuwirang utos, ang pangalang Yahweh, at ang Hebreong larawang ‘mula sa kamay,’ habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
