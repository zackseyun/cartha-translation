id: PSA.97.1
reference: Psalms 97:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: tl
  text: 'Naghahari si Yahweh!

    Magalak ang daigdig;

    magsaya ang maraming pulo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga baybaying lupain.” Ang salitang Hebreo ay maaaring tumukoy sa mga pulo o sa malalayong lupaing nasa baybayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מָלָךְ
  choice: Naghahari
  rationale: Ipinahahayag nito ang aktuwal at nagpapatuloy na paghahari ni Yahweh nang hindi ipinipilit ang mas tiyak na kahulugang ‘naging hari’ o isang bagong pagluklok.
- source_word: תָּגֵל
  choice: Magalak
  rationale: Ang imperfect ay nauunawaan dito bilang panawagan o paghihikayat, kaayon ng anyong patula ng talata.
- source_word: הָאָרֶץ
  choice: ang daigdig
  rationale: Mas malinaw nitong naihahatid ang pandaigdig na saklaw sa konteksto, sa halip na ang posibleng mas makitid na ‘lupain.’
- source_word: יִשְׂמְחוּ
  choice: magsaya
  rationale: Pinananatili ang panawagang diwa at ang parallelismo sa ‘magalak,’ habang iniiwasan ang hindi kailangang pag-uulit.
- source_word: אִיִּים
  choice: mga pulo
  rationale: Likas at madaling maunawaang salin ito sa modernong Tagalog. Maaari ring tumukoy ang Hebreo sa malalayong baybaying lupain, kaya inilagay ang alternatibo sa talababa.
- source_word: רַבִּים
  choice: maraming
  rationale: Tuwiran at likas na panumbas sa pang-uring nagsasaad ng dami.
theological_decisions:
- issue: Saklaw at aspekto ng paghahari ni Yahweh
  choice: Isang pandaigdigang pagpapahayag na naghahari si Yahweh
  alternative: Maaaring unawain ang מָלָךְ bilang ‘naging hari’ o ang הָאָרֶץ bilang ‘lupain’ lamang
  rationale: Ang pagkakatambal ng daigdig at maraming pulo o baybaying lupain ay nagpapahiwatig ng malawak na saklaw. Pinananatili ng ‘naghahari’ ang pahayag ng pagkahari nang hindi nilulutas nang labis ang posibleng ingressive na diwa ng anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikling mga linyang patula at magkatugmang panawagang ‘Magalak’ at ‘magsaya.’
