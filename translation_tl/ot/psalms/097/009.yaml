  text: כִּֽי אַתָּ֤ה יְהוָ֗ה עֶלְי֥וֹן עַל כָּל הָ/אָ֑רֶץ מְאֹ֥ד נַ֝עֲלֵ֗יתָ עַל כָּל אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: tl
  text: Sapagkat ikaw, Yahweh, ang Kataas-taasan sa buong lupa; lubha kang nakatataas sa lahat ng diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng nilalang na makadiyos” o “sa lahat ng nilalang na makalangit.” Ang Hebreong ’elohim ay maaaring tumukoy sa mga diyos, mga nilalang na makadiyos, o mga kapangyarihang makalangit, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag; likas sa makabagong Tagalog ang “Sapagkat” sa ganitong daloy.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinanatili ang hayag na panghalip upang maipakita ang diin na si Yahweh mismo ang kataas-taasan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Natural at marangal na salin ito ng katawagang nagpapahayag ng sukdulang kataasan at kapamahalaan.
- source_word: עַל כָּל הָאָרֶץ
  choice: sa buong lupa
  rationale: Ipinahahayag ng parirala ang pagiging kataas-taasan ni Yahweh sa ibabaw ng buong daigdig; ang “sa buong lupa” ay malinaw at likas sa Tagalog.
- source_word: מְאֹד
  choice: lubha
  rationale: Pinananatili nito ang matinding pagpapalakas sa pandiwa nang hindi dinaragdagan ang diwa ng Hebreo.
- source_word: נַעֲלֵיתָ
  choice: kang nakatataas
  rationale: Ipinahahayag ang resulta o kalagayan ng pagiging mataas; ang aspektong kasalukuyang kalagayan ay angkop sa patulang konteksto.
- source_word: עַל כָּל אֱלֹהִים
  choice: sa lahat ng diyos
  rationale: Pinananatili ng “mga diyos” ang tahasang pangmaramihang anyo at ang polemikong diin ng Hebreo, nang hindi agad ipinapasiya kung mga diyus-diyosan, makalangit na nilalang, o ibang nag-aangking banal ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אֱלֹהִים sa huling taludtod
  choice: mga diyos
  alternative: mga banal na nilalang; mga nilalang sa langit
  rationale: Ang “mga diyos” ang pinakadirektang salin ng pangmaramihang anyo at pinananatili nito ang tunay na kalabuan at teolohikal na tensiyon tungkol sa eksaktong tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang patulang ayos at parallelism, habang iniwasan ang labis na teknikal o makalumang pananalita.
