base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: tl
  text: Ulap at makapal na dilim ang nakapalibot sa kanya[a]; katuwiran at katarungan ang pundasyon ng kanyang trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ulap at karimlan ang nakapalibot sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנָן
  choice: ulap
  rationale: Isahang pangngalan sa Hebreo na angkop panatilihin bilang makatang kolektibong isahan sa Tagalog.
- source_word: וַעֲרָפֶל
  choice: at makapal na dilim
  rationale: Ipinahihiwatig ng עֲרָפֶל ang siksik na dilim o maitim na ulap sa konteksto ng pagpapakita ng Diyos; pinananatili ng parirala ang bigat ng larawan nang hindi ito ginagawang abstrakto.
- source_word: סְבִיבָיו
  choice: ang nakapalibot sa kanya
  rationale: Tuwirang ipinapahayag ang kahulugang 'sa paligid niya' sa natural na ayos ng pangungusap sa Tagalog.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Pinananatili ang moral na pagiging matuwid at ang pagkakaiba nito sa kasunod na מִשְׁפָּט.
- source_word: וּמִשְׁפָּט
  choice: at katarungan
  rationale: Ang 'katarungan' ay natural na tumutukoy sa makatarungang paghatol o kaayusang legal at mahusay na katuwang ng 'katuwiran.'
- source_word: מְכוֹן
  choice: ang pundasyon
  rationale: Tumpak at likas na katumbas para sa matatag na saligan o base ng trono.
- source_word: כִּסְאוֹ
  choice: ng kanyang trono
  rationale: 'Pinananatili ang construct relationship ng Hebreo: ang pundasyon ay yaong sa kanyang trono.'
theological_decisions:
- issue: Larawan ng pagpapakita at pagkakubli ng Diyos
  choice: Panatilihin ang ulap at makapal na dilim bilang nakapalibot sa Diyos.
  alternative: Ipaliwanag ang larawan bilang hiwaga o kadakilaan na nakapalibot sa kanya.
  rationale: 'Pinananatili nito ang tensiyon sa tekstong Hebreo: ang Diyos ay nagpapakilala ngunit nananatiling nakakubli, nang hindi ginagawang abstraktong paliwanag ang makatang larawan.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'makapal na dilim' upang mapanatili ang matinding larawang teopaniko, at ang pares na 'katuwiran at katarungan' upang hindi mapag-isa ang dalawang magkaugnay ngunit magkaibang salitang Hebreo.
