  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: tl
  text: Tinatanglawan ng kanyang mga kidlat ang sanlibutan; nakikita ito ng lupa at nanginginig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at yumanig.” Ang pandiwang Hebreo ay maaaring mangahulugang manginig, mamilipit, o yumanig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: tinatanglawan
  rationale: 'Ipinahahayag ang sanhiang diwa ng Hiphil ng אור: ang mga kidlat ang nagbibigay-liwanag. Likas at malinaw ang kasalukuyang panahunan para sa masiglang paglalarawang patula.'
- source_word: בְרָקָיו
  choice: kanyang mga kidlat
  rationale: Pinananatili ang maramihang anyo at ang panlaping tumutukoy sa Diyos nang hindi gumagamit ng mabigat na pariralang “mga kislap ng kidlat.”
- source_word: תֵּבֵל
  choice: sanlibutan
  rationale: Tumutukoy sa daigdig sa malawak o tinatahanang saklaw nito at pinananatiling naiiba sa הָאָרֶץ sa ikalawang hati ng taludtod.
- source_word: רָאֲתָה
  choice: nakikita
  rationale: Bagaman qatal ang anyong Hebreo, ang kasalukuyang panahunan ay angkop sa buhay at nagpapatuloy na paglalarawan ng pagpapakita ng Diyos. Ang “ito” ay likas na dagdag sa Tagalog upang maging buo ang pandiwa, habang hindi mahigpit na tinutukoy kung kidlat o pagliliwanag ang nakita.
- source_word: וַתָּחֵל
  choice: at nanginginig
  rationale: Ang pandiwa mula sa חול/חיל ay maaaring magpahiwatig ng panginginig, pamimilipit, o pagyanig. Ang “nanginginig” ay malawak at hindi labis na nagpapasya kung takot, hirap, o lindol ang larawan.
- source_word: הָאָרֶץ
  choice: lupa
  rationale: Dito ay kosmiko ang saklaw at kasabay ng personipikasyong nakakakita at nanginginig. Pinananatili rin ng “lupa” ang pagkakaiba sa תֵּבֵל na isinaling “sanlibutan.”
theological_decisions:
- issue: Kosmikong saklaw ng pagpapakita ng Diyos
  choice: “sanlibutan” at “lupa” bilang magkaugnay ngunit magkaibang katawagan
  alternative: Unawain ang הָאָרֶץ bilang isang tiyak na lupain o rehiyon
  rationale: Ang paralelismo at konteksto ng teopaniya sa awit ay pumapabor sa buong daigdig bilang saklaw, nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Personipikasyon ng lupa
  choice: Pinanatiling ang lupa ay “nakikita” at “nanginginig”
  alternative: Ipaliwanag ang mga pandiwa bilang karanasan lamang ng mga naninirahan sa lupa
  rationale: Tuwirang personipikasyon ang nasa tulang Hebreo; ang paglilipat nito sa mga tao ay magpapaliit sa sadyang kosmikong larawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismong patula, ang personipikasyon ng lupa, at ang pagkakaiba ng “sanlibutan” at “lupa.”
