source:
  edition: WLC
  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: tl
  text: Inilayo mo sa akin ang mga kakilala ko[a]; ginawa mo akong kasuklam-suklam sa kanila[b]. Ako'y nakakulong at hindi makalabas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kasamahan ko” o “mga taong nakakakilala sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “ginawa mo akong isang karumal-dumal na bagay sa kanila.”
    reason: lexical_alternative
  - marker: c
    text: O “Ako'y nakapinid at hindi makalabas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Inilayo mo
  rationale: Tuwirang ipinapahayag ng Hiphil ng רחק ang pagpapalayo; natural ito sa Tagalog at pinananatili ang Diyos bilang gumagawa.
- source_word: מְיֻדָּעַי
  choice: ang mga kakilala ko
  rationale: Ang anyong mula sa ידע ay tumutukoy sa mga taong kilala ng nagsasalita. Mas malapit ito sa lawak ng Hebreo kaysa sa “mga kaibigan,” na maaaring magpahiwatig ng higit na matalik na ugnayan.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Karaniwang diwa ng paghihiwalay ng מן na may hulaping unang panauhan; kasama ng “inilayo,” likas sa Tagalog ang “sa akin.”
- source_word: שַׁתַּנִי
  choice: ginawa mo akong
  rationale: Bagaman literal na “inilagay/itinalaga mo ako,” ang konstruksiyong may kasunod na panaguri ay natural na nangangahulugang ginawa o itinuring na gayon.
- source_word: תוֹעֵבוֹת
  choice: kasuklam-suklam
  rationale: Pinananatili ang matinding pagkamuhi o pandidiri ng תועבה habang gumagamit ng natural na panaguring Tagalog. Hindi kailangang gayahin ang pormal na pangmaramihang anyo upang maipahayag ang tungkuling predikatibo.
- source_word: לָמוֹ
  choice: sa kanila
  rationale: Tumutukoy sa naunang mga kakilala at angkop sa predikatibong pahayag na naging kasuklam-suklam ang salmista sa kanilang paningin.
- source_word: כָּלֻא
  choice: Ako'y nakakulong
  rationale: Inihahayag ang pasibo o estadong diwa ng כלא—nakapinid o napipigilan—nang hindi tiyak na ipinapalagay na nasa pormal na bilangguan.
- source_word: וְלֹא אֵצֵא
  choice: at hindi makalabas
  rationale: Bagaman pormal na “at hindi ako lumalabas,” ipinahihiwatig ng naunang pagkakakulong ang kawalan ng kakayahang lumabas; malinaw at natural ang “hindi makalabas.”
