  text: הֲ/לַ/מֵּתִ֥ים תַּעֲשֶׂה פֶּ֑לֶא אִם רְ֝פָאִ֗ים יָק֤וּמוּ יוֹד֬וּ/ךָ סֶּֽלָה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: tl
  text: Gumagawa ka ba ng mga kababalaghan para sa mga patay? Bumabangon ba ang mga espiritu ng mga yumao upang purihin ka? Selah[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anino” sa halip na “mga espiritu ng mga yumao.” Ang salitang Hebreo na Refaim ay isang patulang katawagan sa mga patay sa daigdig ng mga patay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: para sa mga patay
  rationale: Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang retorikal na tanong kung gagawa ang Diyos ng kababalaghan para sa mga namatay.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: gumagawa ka ba ng mga kababalaghan
  rationale: Ang עשה kasama ng פֶּלֶא ay tumutukoy sa paggawa ng pambihirang gawa. Ginamit ang maramihang “mga kababalaghan” bilang likas na parirala sa Tagalog, bagaman isahan ang anyo sa Hebreo.
- source_word: אִם
  choice: ba
  rationale: Dito, nagpapakilala ang אִם ng ikalawang retorikal na tanong, hindi ng tunay na kondisyon. Ang hulaping “ba” ang malinaw at likas na panandang pananong sa Tagalog.
- source_word: רְפָאִים
  choice: mga espiritu ng mga yumao
  rationale: Sa kontekstong patula, tumutukoy ito sa mga patay na nasa daigdig ng mga patay. Malinaw ito sa modernong mambabasa nang hindi ginagamit ang posibleng nakalilitong pangalang “Refaim”; inilalahad sa talababa ang mas literal na larawang “mga anino.”
- source_word: יָק֤וּמוּ
  choice: bumabangon
  rationale: Pinananatili ng “bumabangon” ang matingkad na larawan ng pagtindig o pagbangon ng mga yumao sa retorikal na tanong, nang hindi tahasang ginagawang pahayag tungkol sa doktrina ng muling pagkabuhay.
- source_word: יוֹדוּךָ
  choice: upang purihin ka
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpasalamat o magpuri. Ang “purihin ka” ay angkop sa konteksto ng pampublikong pagkilala at pagsamba sa Awit.
- source_word: סֶּלָה
  choice: Selah
  rationale: Hindi tiyak ang kahulugan at tungkulin ng terminong ito, kaya tinumbasan ito sa pamamagitan ng transliterasyon sa halip na bigyan ng mapagpalagay na salin.
theological_decisions:
- issue: Kahulugan ng רְפָאִים sa patulang paglalarawan sa daigdig ng mga patay
  choice: mga espiritu ng mga yumao
  alternative: mga anino; mga patay; Refaim
  rationale: Ipinahihiwatig ng talata ang mga yumao sa Sheol at ang retorikal na tanong kung makababangon sila upang magpuri. Pinananatili ng salin ang larawang ito nang hindi nagpapasya sa mga susunod na doktrina tungkol sa kalagayan ng tao pagkamatay.
- issue: Ang “pagbangon” ng mga yumao
  choice: bumabangon ba
  alternative: babangon ba; tumitindig ba
  rationale: Pinananatili itong retorikal na tanong at hindi ginawang tahasang pagtanggi o pagpapatunay sa muling pagkabuhay. Ang aspektong di-ganap ay tumutugma sa masiglang paglalarawan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang retorikal na mga tanong at iniwasan ang teknikal o denominasyonal na pananalita.
