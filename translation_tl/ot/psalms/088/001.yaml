  text: יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑/י יוֹם צָעַ֖קְתִּי בַ/לַּ֣יְלָה נֶגְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: tl
  text: 'Yahweh, Diyos ng aking kaligtasan,


    araw at gabi ay sumisigaw ako sa harap mo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalan sa Hebreo at pinananatili ang personal na pagtawag sa Diyos sa panalangin.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Diyos ng aking kaligtasan
  rationale: Pinananatili ang ugnayang konstrukto ng “Diyos ng” at ang malawak na diwa ng יְשׁוּעָה bilang kaligtasan o pagliligtas nang hindi nililimitahan ang uri ng saklolo.
- source_word: יוֹם
  choice: sa araw
  rationale: Ginagamit itong pang-abay na panahunan at itinapat sa “sa gabi.”
- source_word: צָעַקְתִּי
  choice: sumisigaw ako
  rationale: Ang pandiwa ay nagsasaad ng mariing pagdaing o paghingi ng tulong. Ang aspektong nagaganap ay angkop sa tuloy-tuloy na panaghoy ng salmo, bagaman maaari rin itong unawaing “sumigaw ako.”
- source_word: בַלַּיְלָה
  choice: sa gabi
  rationale: Natural na modernong Tagalog para sa panahong kaagapay at katapat ng “sa araw.”
- source_word: נֶגְדֶּךָ
  choice: nasa harap mo ako
  rationale: Pinananatili ang literal na larawang “sa harap mo” at ginagawang malinaw sa Tagalog ang ipinahihiwatig na pagharap ng nagsasalita sa Diyos.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng יְשׁוּעָתִי
  choice: aking kaligtasan
  alternative: aking pagliligtas
  rationale: Mas malawak ang “kaligtasan” at hindi nito maagang tinutukoy kung pisikal, panlipunan, o espirituwal ang hinihinging pagliligtas.
- issue: Ugnayan ng mga pariralang “sa araw,” “sa gabi,” at “sa harap mo”
  choice: sa araw ay sumisigaw ako; sa gabi, nasa harap mo ako
  alternative: sumisigaw ako araw at gabi sa harap mo
  rationale: Pinananatili ng napiling ayos ang patulang paghinto at ang walang tahasang pandiwang huling parirala ng Hebreo, sa halip na pag-isahin nang tiyak ang lahat ng panahong parirala sa pandiwang “sumisigaw.”
translation_notes:
  register: Makabago ngunit marangal na wikang panalangin. Ginamit ang “sumisigaw” upang ihayag ang tindi ng צעק, at pinanatili ang maikli at putol na anyong patula ng talata.
