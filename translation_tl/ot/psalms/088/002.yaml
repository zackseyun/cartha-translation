  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: tl
  text: Dumating nawa sa iyong harapan ang aking panalangin[a]; ikiling mo ang iyong tainga sa aking daing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa harap ng iyong mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: Dumating nawa
  rationale: Ang Qal imperfect na 3fs ay kaayon ng pambabaeng simuno na תְּפִלָּתִי. Sa konteksto ng panalangin, ipinahahayag nito ang isang pakiusap o hangarin, kaya ang “dumating nawa” ay tumpak at likas sa marangal na modernong Tagalog.
- source_word: לְפָנֶיךָ
  choice: sa iyong harapan
  rationale: Literal itong tumutukoy sa pagdating “sa harap ng iyong mukha,” isang idyoma para sa paglapit sa presensiya ng Diyos. Pinananatili ng “sa iyong harapan” ang konkretong larawan nang hindi nagiging asiwa.
- source_word: תְּפִלָּתִי
  choice: ang aking panalangin
  rationale: Ang תְּפִלָּה ay karaniwang nangangahulugang “panalangin”; hindi ito pinakipot sa “pakiusap” lamang.
- source_word: הַטֵּה
  choice: ikiling mo
  rationale: Ang Hiphil imperative ng נטה ay may diwang “ikiling” o “iunat.” Kapag tainga ang layon, inilalarawan nito ang kusang pagbibigay-pansin upang makinig.
- source_word: אָזְנְךָ
  choice: ang iyong tainga
  rationale: Pinanatili ang isahang “tainga” at ang metaporang Hebreo ng masusing pakikinig.
- source_word: לְרִנָּתִי
  choice: sa aking daing
  rationale: Maaaring tumukoy ang רִנָּה sa malakas na sigaw, maging sa galak o dalamhati. Dahil ang Awit 88 ay panaghoy, ipinahahayag ng “daing” ang masidhing sigaw ng paghihirap nang hindi nagpapahiwatig ng kagalakan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang paralelismo, ang pakiusap na ipinahahayag ng imperfect, at ang konkretong metapora ng pagkiling ng tainga. Ginamit ang “daing” upang umangkop sa konteksto ng panaghoy ng Awit 88.
