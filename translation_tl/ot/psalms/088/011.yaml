  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: tl
  text: 'Isinasalaysay ba sa libingan ang iyong tapat na pag-ibig,

    at sa Abadon[a] ang iyong katapatan?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapahamakan” o “sa dako ng kapahamakan.” Ang Hebreong “Abadon” ay matalinghagang tawag sa daigdig ng pagkawasak at kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: Isinasalaysay ba
  rationale: Ang Pual na anyo ng ספר kasama ng panandang pananong ay naghahayag ng retorikal na tanong na “isinasalaysay ba?” Pinananatili nito ang diwang pasibo at ang makatang tono.
- source_word: בַּקֶּבֶר
  choice: sa libingan
  rationale: Ang קבר ay tumutukoy sa libingan o dakong pinaglilibingan. Ang “libingan” ang malinaw, natural, at malawak na katumbas sa modernong Tagalog.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay nagpapahiwatig ng matibay at mapagkakatiwalaang pag-ibig at katapatan sa ugnayan. Ang “tapat na pag-ibig” ay likas sa Tagalog at hindi labis na nagpapakipot sa kahulugan.
- source_word: אֱמוּנָתְךָ
  choice: iyong katapatan
  rationale: Ang אֱמוּנָה rito ay tumutukoy sa pagiging maaasahan at tapat ng Diyos, na kahilera ng חֶסֶד.
- source_word: בָּאֲבַדּוֹן
  choice: sa Abadon
  rationale: Sa pagkakahilera nito sa “libingan,” ang אֲבַדּוֹן ay makatang tawag sa dako o kalagayan ng pagkawasak at kamatayan. Pinananatili ng “Abadon” ang natatanging larawang Hebreo, habang inilalahad sa talababa ang mga karaniwang-nominal na kahulugan.
theological_decisions:
- issue: Kung isasalin ang אֲבַדּוֹן bilang karaniwang pangngalang “kapahamakan/pagkawasak” o pananatilihin bilang makatang terminong “Abadon”
  choice: Abadon sa pangunahing teksto
  alternative: kapahamakan; dako ng kapahamakan
  rationale: Dahil kahilera ito ng “libingan,” malamang na tumutukoy ito hindi lamang sa abstraktong pagkawasak kundi sa daigdig o dako ng mga patay. Pinananatili ng “Abadon” ang talinghagang Hebreo nang hindi ipinipilit ang iisang interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang retorikal na tanong, ang makatang pagkakahilera ng “libingan” at “Abadon,” at ang elipsis ng pandiwa sa ikalawang sugnay.
