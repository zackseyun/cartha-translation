  text: 'Inilagay mo ako sa pinakamalalim na hukay,

    sa mga madidilim na lugar, sa kalaliman.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Inilagay mo ako
  rationale: Tuwirang ipinahahayag ng anyong 2ms + 1cs ang pagkilos ng kausap sa nagsasalita. Natural sa modernong Filipino ang “Inilagay mo ako” at hindi nito pinahihina ang tuwirang pag-uugnay ng pagkilos sa Diyos.
- source_word: בְּבוֹר
  choice: sa ... hukay
  rationale: Maaaring tumukoy ang בּוֹר sa hukay, balon, o tila-bilangguang lubog. Pinananatili ng “hukay” ang matalinghagang larawan nang hindi ito tiyak na ginagawang “libingan.”
- source_word: תַּחְתִּיּוֹת
  choice: pinakamalalim
  rationale: Ipinahihiwatig ng salita ang pinakamababang bahagi o mga lugar sa kailaliman. Ang “pinakamalalim na hukay” ay natural sa Filipino at malinaw na naghahatid ng sukdulang lalim.
- source_word: בְּמַחֲשַׁכִּים
  choice: sa madidilim na mga lugar
  rationale: Maramihan ang anyo at tumutukoy sa madidilim na lugar o mga kadiliman. Pinananatili ng salin ang kongkretong maramihang larawan.
- source_word: בִּמְצֹלוֹת
  choice: sa kalaliman
  rationale: Tumutukoy ito sa malalalim na dako, lalo na sa kailaliman ng tubig o sa mga tila bangin. Ang “sa kalaliman” ay natural at nagpapanatili sa makatang larawan ng di-maabot na lalim.
theological_decisions:
- issue: Ang Diyos bilang tuwirang tagaganap sa panaghoy
  choice: 'Pinanatili ang tuwirang ikalawang panauhan: “Inilagay mo ako”'
  alternative: Isang impersonal na salin na nagpapalabo o nagpapahina sa pagkilos ng Diyos
  rationale: Tuwirang kinakausap ng Hebreo ang Diyos bilang siyang naglagay sa mang-aawit sa kalagayang ito. Pinananatili ng salin ang tensiyong teolohikal ng panaghoy sa halip na lutasin o palambutin iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong magkakapantay na larawan ng hukay, madidilim na mga lugar, at kalaliman. Walang footnote dahil sapat na naipahahayag sa pangunahing teksto ang leksikal na saklaw nang hindi kinakailangang pumili ng mas tiyak na “libingan” o “balon.”
