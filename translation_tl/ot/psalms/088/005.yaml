id: PSA.88.5
reference: Psalms 88:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: tl
  text: 'Malaya ako sa gitna ng mga patay[a],

    gaya ng mga napatay na nakahimlay sa libingan,

    na hindi mo na inaalaala[b],

    at sila’y nahiwalay sa iyong kamay.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “malaya sa piling ng mga patay.” Ang Hebreo ay gumagamit ng salitang nangangahulugang “malaya” o “nakalaya,” malamang sa mapait na paraan: para bang patay na ang salmista at wala na sa daigdig at mga gawain ng mga buhay.'
    reason: lexical_alternative
  - marker: b
    text: Ang “inaalaala” rito ay malamang na hindi lamang mental na paggunita; maaari rin itong magpahiwatig ng pagbibigay-pansin o pagkilos para sa isang tao.
    reason: lexical_alternative
  - marker: c
    text: O “naputol mula sa iyong kamay.” Ang “kamay” ay larawang Hebreo para sa kapangyarihan, pamamahala, o pagkalinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: sa gitna ng mga patay
  rationale: Ipinahahayag ng בְּ ang kalagayan ng salmista sa kinaroroonan o hanay ng mga patay, hindi lamang ang pagsama niya sa kanila.
- source_word: חָפְשִׁי
  choice: malaya
  rationale: 'Pinananatili ang kabalintunaang larawan ng pagiging malaya o nakalaya: para bang wala na siya sa daigdig at mga gawain ng mga buhay. Ipinaliliwanag sa talababa ang mapait at ironikong diwa nito.'
- source_word: חֲלָלִים
  choice: mga napatay
  rationale: Sa kontekstong patula, karaniwang tumutukoy ito sa mga taong marahas na napatay; natural at malinaw sa makabagong Filipino ang “mga napatay.”
- source_word: שֹׁכְבֵי קֶבֶר
  choice: nakahimlay sa libingan
  rationale: Ipinananatili ng “nakahimlay” ang patuloy na kalagayang inilalarawan ng participle, habang ang “libingan” ay natural na katumbas ng קֶבֶר.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: na hindi mo na inaalaala
  rationale: Tuwirang pinananatili ang larawan ng pag-alaala at ang עוֹד (“na”), nang hindi ito agad nililimitahan sa mental na paggunita lamang.
- source_word: מִיָּדְךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang Hebreong metapora ng kamay, na maaaring magpahiwatig ng kapangyarihan, pamamahala, o pagkalinga.
- source_word: נִגְזָרוּ
  choice: nahiwalay
  rationale: Natural sa Filipino ang “nahiwalay” para sa pagiging cut off o severed, habang nananatili ang matinding larawan ng pagkakabukod mula sa kamay ng Diyos.
theological_decisions:
- issue: Ang kahulugan ng pag-alaala ng Diyos sa mga patay
  choice: Pinanatili ang “inaalaala” sa pangunahing teksto.
  alternative: kinakalinga; binibigyang-pansin
  rationale: Sa panaghoy, ang pag-alaala ay maaaring mangahulugan ng pagbibigay-pansin at pagkilos para sa isang tao, ngunit pinananatili ng literal na larawan ang tensiyong teolohikal at hindi ipinahihiwatig na literal na nakakalimot ang Diyos.
- issue: Ang diwa ng “malaya” sa gitna ng mga patay
  choice: Pinanatili ang kabalintunaang “malaya.”
  alternative: pinabayaan; ibinukod
  rationale: Ang Hebreo ay gumagamit ng wika ng kalayaan o pagkakalaya sa mapait at ironikong paraan. Ang pagpapanatili rito ay umiiwas sa pagpasok ng mas tiyak na ideya ng lubos na pagtalikod ng Diyos.
- issue: Pagkahiwalay mula sa kamay ng Diyos
  choice: Pinanatili ang larawan ng “iyong kamay.”
  alternative: nahiwalay sa iyong kapangyarihan; hindi na saklaw ng iyong pagkalinga
  rationale: Hindi nililimitahan ng salin ang “kamay” sa kapangyarihan lamang o sa pagkalinga lamang; hinahayaang manatili ang lawak at bigat ng orihinal na metapora.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang patulang ayos at maiikling linya, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Pinanatili ang mabibigat na larawan ng kamatayan, pag-alaala, at kamay ng Diyos nang hindi nilulutas ang likas na tensiyon ng panaghoy.
