  source_fidelity: 'Tumpak na naipapahayag ng salin ang Hebreong pagkakaugnay: ang nagsasalita ay “malaya” sa hanay ng mga patay, gaya ng marahas na napatay na nasa libingan; hindi na sila inaalala ng Diyos at nahiwalay sila mula sa kaniyang kamay. Napananatili ang mapait na kabalintunaan ng חָפְשִׁי at ang metapora ng “kamay,” nang hindi ito labis na binibigyang-kahulugan.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang maiikling patulang linya ay angkop sa panaghoy. Ang “nakahimlay sa libingan” ay maayos na katumbas ng participial na paglalarawan, at ang “sila’y nahiwalay sa iyong kamay” ay nauunawaan sa kontekstong patula.
