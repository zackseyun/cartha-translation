  text: לָ/מָ֣ה יְ֭הוָה תִּזְנַ֣ח נַפְשִׁ֑/י תַּסְתִּ֖יר פָּנֶ֣י/ךָ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: tl
  text: Bakit, Yahweh, itinatakwil mo ako?[a] Ikinukubli mo sa akin ang iyong mukha?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang aking nefesh.” Maaari itong mangahulugang “ako,” “ang aking kaluluwa,” o “ang aking buhay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ikubli ang mukha” ay isang Hebreong idyoma na maaaring tumukoy sa pagkakait ng presensiya, lingap, o pansin.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: Bakit
  rationale: Tuwirang tanong sa dahilan; pinananatili ang tindi at likas na himig ng panaghoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng personal na pangalang banal sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: תִּזְנַח
  choice: itinatakwil
  rationale: Malinaw na ipinahahayag ang diwa ng pagtanggi o pagtataboy; ang aspektong di-ganap ay angkop sa reklamong nararanasan ng nagsasalita.
- source_word: נַפְשִׁי
  choice: ako
  rationale: Sa kontekstong ito, ang Hebreong nefesh na may unang panauhang panlapi ay natural na tumutukoy sa buong sarili ng nagsasalita; mas karaniwan sa modernong Tagalog ang 'ako' kaysa literal na 'aking kaluluwa.'
- source_word: תַּסְתִּיר
  choice: ikinukubli
  rationale: Pinananatili ang konkretong larawan ng pagtatago habang gumagamit ng marangal at likas na pandiwang Tagalog.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang literal na larawang Hebreo, na maaaring magpahiwatig ng presensiya, lingap, o pansin.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Likas na katumbas sa Tagalog sa pariralang 'ikinukubli sa akin ang iyong mukha.'
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng נַפְשִׁי
  choice: ako
  alternative: ang aking kaluluwa; ang aking buhay
  rationale: Maaaring tumukoy ang nefesh sa kaluluwa, buhay, o buong sarili. Ang 'ako' ay natural sa Tagalog at hindi nagpapasya pabor sa isang hiwalay na antropolohikal na sangkap; itinatala sa talababa ang literal at iba pang posibleng pakahulugan.
- issue: Idiomang pagtatago ng mukha
  choice: pinanatili ang 'ikinukubli ... ang iyong mukha'
  alternative: inilalayo mo sa akin ang iyong presensiya o lingap
  rationale: Pinananatili ang matinding konkretong larawan at ang saklaw ng maaaring kahulugan nang hindi tahasang nililimitahan ito sa lingap lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'O Yahweh' upang mapanatili ang tahasang pagtawag sa Diyos. Ang 'ako' ay mas natural kaysa 'aking kaluluwa,' habang ang tunay na leksikal na lawak ng nefesh ay pinanatili sa talababa. Parehong tanong na 'Bakit' ang hayagang isinulat upang tularan ang balanseng paralelismo ng panaghoy.
