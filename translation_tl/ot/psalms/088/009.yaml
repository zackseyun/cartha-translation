base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: tl
  text: Nanghihina ang mata ko dahil sa pagdurusa.[a] Tumatawag ako sa iyo araw-araw, Yahweh; iniuunat ko sa iyo ang aking mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nanlalata ang mata ko dahil sa pagdurusa” o “Nasasaktan ang mata ko dahil sa paghihirap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: ang mata ko
  rationale: Isahan ang pangngalan sa Hebreo. Pinananatili nito ang kongkretong larawang patula, bagaman maaari itong tumukoy sa paningin o sa buong kalagayan ng nagsasalita.
- source_word: דָאֲבָה
  choice: nanghihina
  rationale: Ipinahihiwatig ng pandiwa ang panlalata, panghihina, o unti-unting pagkaubos dahil sa pagdurusa. Ang “nanghihina” ay likas sa modernong Tagalog at hindi nito nililimitahan ang kahulugan sa pisikal na kirot.
- source_word: מִנִּי עֹנִי
  choice: dahil sa pagdurusa
  rationale: Ipinapahayag ng parirala ang sanhi o pinagmumulan. Ang “pagdurusa” ay malinaw at angkop sa konteksto ng salmo.
- source_word: קְרָאתִיךָ
  choice: Tumatawag ako sa iyo
  rationale: Kasama ng “araw-araw,” likas na maunawaan ang anyong Hebreo bilang palagian o paulit-ulit na pananalangin. Hindi dinaragdagan ng salin ang tindi na maaaring ipahiwatig ng “sumisigaw.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל יוֹם
  choice: araw-araw
  rationale: Ipinahihiwatig nito ang paulit-ulit na gawain sa bawat araw, hindi kinakailangang walang tigil sa buong maghapon.
- source_word: שִׁטַּחְתִּי
  choice: inilalahad ko
  rationale: Inilalarawan nito ang pag-uunat o paglaladlad ng mga kamay bilang kilos ng pagsusumamo. Ang “inilalahad” ay natural at marangal sa Tagalog.
- source_word: כַפָּי
  choice: ang aking mga kamay
  rationale: Bagaman maaaring tumukoy ang salita sa mga palad, “mga kamay” ang likas na katawagan sa Tagalog para sa kilos ng pananalangin.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang isahang “mata” at ang pisikal na kilos ng paglalahad ng mga kamay. Ginamit ang pangkasalukuyang anyo upang ipakita ang paulit-ulit na pananalangin na nililinaw ng “araw-araw.”
