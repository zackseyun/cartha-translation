  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: tl
  text: 'Ibinilang ako sa mga bumababa sa hukay[a];

    ako’y naging gaya ng isang lalaking walang lakas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan.” Ang “hukay” sa Hebreo ay karaniwang makatang larawan ng kamatayan.
    reason: lexical_alternative
  - marker: b
    text: O “gaya ng isang malakas na lalaking walang sigla.” Ang salitang Hebreo para sa “lalaki” ay maaaring magpahiwatig ng lakas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Ibinilang ako
  rationale: Ang Niphal ng חשׁב ay nagsasaad na ang nagsasalita ay itinuring o ibinilang na kabilang sa isang pangkat. Pinananatili ng anyong naganap ang perpektong anyo ng Hebreo, habang malinaw pa rin ang kasalukuyang kalagayang bunga nito.
- source_word: עִם
  choice: sa
  rationale: Bagaman literal na “kasama ng,” natural na ipinahahayag sa Filipino ng “ibinilang ... sa” ang pagkabilang sa tinutukoy na pangkat.
- source_word: יוֹרְדֵי בוֹר
  choice: mga bumababa sa hukay
  rationale: Pinananatili ang participial na larawan ng mga taong bumababa at ang matalinghagang “hukay” bilang larawan ng kamatayan.
- source_word: בּוֹר
  choice: hukay
  rationale: Ang “hukay” ay malapit sa kongkretong larawan ng Hebreo at hindi agad nililimitahan ang kahulugan sa literal na libingan lamang.
- source_word: הָיִיתִי
  choice: ako’y naging
  rationale: Ipinahahayag nito ang perpektong anyo ng היה at ang pagdating ng makata sa inilalarawang kalagayan.
- source_word: כְּגֶבֶר
  choice: gaya ng isang lalaki
  rationale: Karaniwang nangangahulugang “lalaki” ang גבר, bagaman maaari itong magpahiwatig ng lakas; pinananatili sa talababa ang alternatibong iyon at ang kabalintunaan nito sa kasunod na parirala.
- source_word: אֵין אֱיָל
  choice: na walang lakas
  rationale: Tuwiran at malinaw nitong isinasalin ang kawalan ng אֱיָל, “lakas” o “sigla,” nang hindi ginagawang mas tiyak ang kahulugan kaysa sa Hebreo.
theological_decisions:
- issue: Ang “hukay” bilang larawan ng kamatayan
  choice: Pinanatili ang “hukay” sa pangunahing teksto.
  alternative: “libingan”
  rationale: Hindi tahasang nilulutas ng salin kung literal na libingan o mas malawak na makatang larawan ng kamatayan ang tinutukoy; ipinapaliwanag ang saklaw sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang dalawang linya at tuldok-kuwit ay nagpapanatili sa magkatimbang na mga pahayag ng Hebreong tula. Inilagay ang bawat pananda ng talababa kaagad sa salitang nililinaw nito.
