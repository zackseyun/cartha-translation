translation:
  language: tl
  text: Ang nag-aapoy mong galit ay dumaan sa ibabaw ko[a]; nilipol ako ng iyong mga sindak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “rumagasa sa ibabaw ko.” Ang pandiwang Hebreo ay literal na “dumaan,” ngunit nagpapahiwatig ang konteksto ng puwersang dumadaig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinuksa ako” o “inihiwalay ako” para sa “nilipol ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: Dumaan sa ibabaw ko
  rationale: Pinananatili ang pangunahing larawan ng pandiwang עבר, “dumaan/tumawid,” kasama ang עָלַי, “sa ibabaw ko.” Sa konteksto, ipinahihiwatig nito ang puwersang lumalampas at lumulunod, ngunit hindi iyon labis na ipinapaliwanag sa pangunahing teksto.
- source_word: חֲרוֹנֶיךָ
  choice: ang nag-aapoy mong galit
  rationale: Ipinapahayag ang matinding galit at pinananatili ang larawang may kaugnayan sa pag-aalab na taglay ng חרון. Bagaman anyong maramihan sa Hebreo, likas itong isalin bilang isang di-mabilang na konsepto sa Filipino.
- source_word: בִּעוּתֶיךָ
  choice: mga sindak na mula sa iyo
  rationale: Ang ביעות ay tumutukoy sa mga bagay o karanasang nagdudulot ng matinding takot. Nililinaw ng “mula sa iyo” ang hulaping panghalip nang hindi ipinapalagay kung ang tinutukoy ay damdamin, gawa, o kapahamakan.
- source_word: צִמְּתוּתֻנִי
  choice: nilipol ako
  rationale: Ang צמת ay maaaring mangahulugang lipulin, puksain, o putulin. Ang “nilipol” ay natural at matindi, angkop sa sukdulang pananalita ng panaghoy.
theological_decisions:
- issue: Ang Diyos ang pinagmumulan ng galit at mga sindak sa pananalita ng salmista
  choice: 'Pinanatili ang tuwirang pag-uugnay sa Diyos: “mong galit” at “mula sa iyo.”'
  alternative: Palambutin bilang galit o mga sindak na pinahintulutan lamang ng Diyos.
  rationale: Tuwirang iniuugnay ng mga hulaping second-person singular sa Hebreo ang galit at mga sindak sa kinakausap na Diyos. Hindi dapat patahimikin ang teolohikal na tensiyon ng panaghoy.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinili ang “nag-aapoy mong galit” upang mapanatili ang larawang Hebreo, at ang “mga sindak na mula sa iyo” upang maging natural nang hindi nilulutas ang maaaring saklaw ng pangngalan.
