  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: tl
  text: 'Inilayo mo sa akin ang nagmamahal sa akin at ang kaibigan ko;

    ang mga kakilala ko ay kadiliman.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nasa kadiliman ang mga kakilala ko,” o “kadiliman na lamang ang kasama ko.” Lubhang maigsi ang pangwakas na parirala sa Hebreo at maaari itong unawain sa mahigit isang paraan.
    reason: alternative_reading
  - marker: b
    text: O, “kadiliman ang mga kakilala ko.”
    reason: previous_rendering
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Inilayo mo
  rationale: Ang Hiphil perfect na ikalawang panauhang panlalaki ay nagpapahayag na ang Diyos, na tuwirang kinakausap, ang naging sanhi ng pagkalayo.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Kasunod ng “inilayo,” natural na ipinahahayag nito ang paghihiwalay mula sa nagsasalita.
- source_word: אֹהֵב
  choice: ang nagmamahal sa akin
  rationale: Ang substantibong participle ay tumutukoy sa taong nagmamahal, hindi sa taong minamahal; iniiwasan ng saling ito ang posibleng pagbaligtad ng pananaw sa “minamahal.”
- source_word: וָרֵעַ
  choice: at ang kaibigan ko
  rationale: Sa konteksto ng ugnayang personal, “kaibigan” ang pinakanatural na katumbas ng רֵעַ; nililinaw ng “ko” ang relasyong ipinahihiwatig ng taludtod.
- source_word: מְיֻדָּעַי
  choice: ang mga kakilala ko
  rationale: Pinananatili nito ang pagkakaiba ng mas malawak na mga kakilala mula sa malapit na nagmamahal at kaibigan na binanggit sa unang hati.
- source_word: מַחְשָׁךְ
  choice: ay kadiliman
  rationale: Pinananatili ang matindi at maikling nominal na pangungusap ng Hebreo, habang ginagamit ang “ay” upang maging malinaw sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng מְיֻדָּעַי at מַחְשָׁךְ sa maikling pangwakas na parirala
  choice: ang mga kakilala ko ay kadiliman
  alternative: nasa kadiliman ang mga kakilala ko; kadiliman na lamang ang kasama ko
  rationale: Ang ayos ng Masoretic Text ay maaaring basahin bilang nominal na pangungusap na ang “kadiliman” ang panaguri, ngunit lubhang maigsi ang Hebreo at hindi tiyak ang eksaktong relasyon. Pinanatili sa teksto ang pinakamalapit na ayos at inilagay sa talababa ang ibang makatuwirang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal ang himig. Pinanatili ang matalim at hindi ganap na nilutas na larawan ng huling parirala sa halip na gawing mas tiyak kaysa sa Hebreo.
