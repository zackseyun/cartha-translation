    issue: Ang talababa [b] ay halos kapareho lamang ng pangunahing salin sa Tagalog.
    rationale: Ang “kadiliman ang mga kakilala ko” ay pagbabago lamang ng ayos mula sa “ang mga kakilala ko ay kadiliman.” Gayunman, tapat nitong pinananatili ang footnote anchor at ang audit-trail na dating pagbabalangkas, at hindi ito nagdudulot ng maling kahulugan.
