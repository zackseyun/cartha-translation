  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: tl
  text: Ako'y nagdurusa at malapit nang mamatay mula pa sa aking kabataan; pinasan ko ang mga sindak na mula sa iyo; lubos akong nadaig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng huling salitang Hebreo. Maaari rin itong isaling “ako'y naguguluhan,” “ako'y lupaypay,” o “ako'y nalilito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: nagdurusa
  rationale: Sa konteksto ng panaghoy, tumutukoy ito sa taong pinahihirapan o nasa matinding paghihirap, hindi lamang sa mahirap sa kabuhayan.
- source_word: וְגֹוֵעַ
  choice: malapit nang mamatay
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na kalagayang naghihingalo o nasa bingit ng kamatayan; natural at malinaw ito sa modernong Tagalog.
- source_word: מִנֹּעַר
  choice: mula pa sa aking kabataan
  rationale: Ipinapakita ng parirala ang tagal ng paghihirap mula sa maagang yugto ng buhay; ang “aking” ay likas na ipinahihiwatig ng unang panauhan.
- source_word: נָשָׂאתִי
  choice: pinapasan ko
  rationale: Pinananatili nito ang kongkretong larawan ng pagbubuhat o pagdadala habang ipinahahayag ang patuloy na pagtitiis sa kasalukuyang paghihirap. Maaari ring unawain ang Hebreong anyo bilang “pinasan ko” o “matagal ko nang pinapasan.”
- source_word: אֵמֶיךָ
  choice: mga kakilabutang mula sa iyo
  rationale: Tuwirang ipinapahayag ang matitinding sindak na kaugnay ng pakikitungo ng Diyos sa salmista, habang pinananatili ang ikalawang panauhang pagtukoy sa Diyos.
- source_word: אָפוּנָה
  choice: hindi ko na kaya
  rationale: Mahirap tiyakin ang eksaktong diwa ng salitang Hebreo. Ipinahahayag ng saling ito ang pagiging lubos na nadaig o hindi na makayanan, nang hindi pinipili nang tiyak kung ang diin ay pagkalito, panghihina, o pagkawasak.
theological_decisions:
- issue: Ang pinagmulan o kaugnayan ng “mga kakilabutan”
  choice: Iniuugnay ang mga kakilabutan nang tuwiran sa Diyos sa pariralang “mula sa iyo.”
  alternative: Maaaring unawain ang mga ito bilang mga sindak na nararanasan lamang sa presensiya ng Diyos, sa halip na nagmumula sa kaniyang pakikitungo.
  rationale: Ang hulaping ikalawang panauhan sa אֵמֶיךָ ay likas na nag-uugnay sa mga kakilabutan sa Diyos. Hindi pinapahina ng salin ang matinding teolohikal na tensiyon ng tuwirang panaghoy sa kaniya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Ako'y” upang mapanatili ang maikli at makatang himig; ang “hindi ko na kaya” ay likas sa kasalukuyang Filipino ngunit nananatiling angkop sa tindi ng panaghoy.
