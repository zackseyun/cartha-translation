base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: tl
  text: Sapagkat ang kaluluwa ko ay punô ng mga paghihirap, at ang buhay ko ay nalalapit sa Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay.” Ang salitang Hebreo ay “Sheol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng kalagayan ng mang-aawit sa konteksto at pinananatili ang puwersang sanhi.
- source_word: שָׂבְעָה
  choice: ay punô
  rationale: Ang pandiwa ay nangangahulugang mapuno o malipos; ang “punô” ay likas sa Filipino at pinananatili ang larawang lubos na napuspos.
- source_word: בְרָעוֹת
  choice: ng mga paghihirap
  rationale: Sa konteksto, tumutukoy ito sa mga kasawiang nagpapahirap sa mang-aawit, hindi sa kasamaang moral na ginawa niya.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Pinananatili nito ang pagkakaiba sa חַיַּי sa ikalawang hati at ang patulang paralelismo, bagaman maaari ring tumukoy ang נֶפֶשׁ sa buhay o buong sarili.
- source_word: וְחַיַּי
  choice: at ang buhay ko
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang gumaganap ang חַיִּים bilang pangngalang abstrakto na nangangahulugang buhay.
- source_word: לִשְׁאוֹל
  choice: sa Sheol
  rationale: Pinananatili ang katawagang Hebreo para sa daigdig o kinaroroonan ng mga patay nang hindi ito agad ipinapantay sa mas makitid o mas huling konseptong teolohikal.
- source_word: הִגִּיעוּ
  choice: ay nalalapit
  rationale: Ang pandiwa ay literal na tumutukoy sa pag-abot o pagdating; sa panaghoy na ito, malinaw na ipinahihiwatig ng “nalalapit” ang papalapit na kamatayan nang hindi sinasabing naroon na siya.
theological_decisions:
- issue: Pagbibigay-kahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Iniiwasan nitong ipasok ang isang mas makitid o mas huling doktrinal na kahulugan at pinananatili ang sariling larawan at saklaw ng tekstong Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sapagkat” para sa malinaw na ugnayang sanhi at pinanatili ang “Sheol” upang huwag ikubli ang terminong Hebreo o lutasin nang labis ang saklaw nito.
