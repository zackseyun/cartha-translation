  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: tl
  text: 'Nakadagan sa akin ang iyong poot,

    at pinahirapan mo ako sa lahat ng iyong mga alon na humahampas.[a]

    Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga daluyong” o “mga alon na nagbabagsakan.” Ang salitang Hebreo ay tumutukoy sa mga alon sa dagat na bumabasag at humahampas.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכָה
  choice: nakadagan
  rationale: Ang pandiwang סמך ay may diwang pagsandal o pagsuporta. Sa poot na nasa ibabaw ng nagsasalita, ipinahahayag ng “nakadagan” ang poot na nakahimlay at mabigat na nakapatong sa kaniya, nang hindi ginagawang tahasang paliwanag ang larawang spatial.
- source_word: חֲמָתֶךָ
  choice: iyong poot
  rationale: Ang חֵמָה ay tumutukoy sa matinding galit o poot. Ang “poot” ay natural at marangal sa panaghoy at pinananatili ang bigat ng pahayag tungkol sa galit ng Diyos.
- source_word: מִשְׁבָּרֶיךָ
  choice: iyong humahampas na alon
  rationale: Ang מִשְׁבָּר ay alon sa dagat na bumabagsak o humahampas. Mas malinaw sa karaniwang mambabasa ang “humahampas na alon” kaysa sa teknikal o di-tiyak na “daluyong,” habang pinananatili ang masiglang larawan ng Hebreo.
- source_word: עִנִּיתָ
  choice: pinahirapan mo ako
  rationale: Sa Piel, ang ענה ay maaaring mangahulugang pahirapan, apiin, o ibaba. Sa konteksto ng dinaranas na kapighatian, ang “pinahirapan mo ako” ay tuwiran at hindi ito nililimitahan sa panlipunang pang-aapi.
- source_word: וְכָל
  choice: at ... sa lahat ng
  rationale: Ikinakabit ng וְ ang ikalawang sugnay at binibigyang-diin ng כָּל ang kabuuan ng mga alon. Ang “at ... sa lahat ng” ay likas sa Filipino bilang pagpapahayag ng paraang ginamit sa pagpapahirap.
- source_word: סֶלָה
  choice: Sela
  rationale: Hindi tiyak ang kahulugan ng terminong liturhikal na ito, kaya isinalin lamang sa baybay-Filipino sa halip na bigyan ng isang di-tiyak na pakahulugan.
theological_decisions:
- issue: Galit ng Diyos at ang kaniyang tuwirang pagkilos sa pagdurusa
  choice: Tuwirang sinasabi na nakadagan sa mang-aawit ang poot ng Diyos at pinahirapan siya ng Diyos sa pamamagitan ng lahat ng Kaniyang humahampas na alon.
  alternative: Gawing impersonal ang pagdurusa o palambutin ang “poot” bilang karaniwang dalamhati lamang.
  rationale: Tuwirang iniuugnay ng Hebreo sa Diyos kapuwa ang poot at ang pagpapahirap. Pinananatili ng salin ang tensiyong teolohikal ng panaghoy at hindi ipinapaliwanag o pinahihina ang sinabi ng mang-aawit.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Ang “nakadagan” ay malinaw at masigla ngunit hindi kolokyal; ang “humahampas na alon” ay madaling maunawaan at mas tumpak sa larawang pandagat kaysa sa payak na “mga alon.”
