  yaml_path: translation/ot/psalms/088/017.yaml
  text: They surrounded me like water all day long[a]; together they closed in on me.
translation:
  language: tl
  text: Buong araw nila akong pinalibutan na parang tubig; sama-sama nila akong pinaligiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sama-sama nila akong kinubkob,” na nagbibigay-diin sa pagsasara sa paligid; ang “pinaligiran” ay higit na nagpapanatili sa pagkakatulad ng dalawang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי
  choice: Pinalibutan nila ako
  rationale: Ang Qal perfect na may hulaping unang panauhan ay nagsasaad na pinaligiran ang salmista; natural sa modernong Tagalog ang “pinalibutan” at pinananatili nito ang larawang mapanupil.
- source_word: כַמַּיִם
  choice: na parang tubig
  rationale: Pinananatili ng “parang” ang paghahambing na minamarkahan ng כ, habang ang isahan na “tubig” ay likas sa Tagalog at nagpapahiwatig ng pag-apaw o paglamon.
- source_word: כָּל הַיּוֹם
  choice: buong maghapon
  rationale: Likas at marangal na ekspresyong Tagalog ito para sa patuloy na pangyayari sa kabuuan ng araw.
- source_word: הִקִּיפוּ
  choice: kinubkob
  rationale: Ipinapahayag ng “kinubkob” ang masinsin at mapanganib na pagsasara sa paligid, habang iniiwasan ang mekanikal na pag-uulit ng “pinalibutan.”
- source_word: עָלַי
  choice: ako
  rationale: Sa pariralang “nila akong kinubkob,” ang bagay na tinutukoy ng עָלַי ay likas na naisasama sa pandiwang Tagalog; nananatili ang diwang ang mga panganib ay nakapaligid at nakatuon laban sa nagsasalita.
- source_word: יָחַד
  choice: sama-sama
  rationale: Malinaw nitong ipinahahayag na sabay-sabay at nagkakaisa ang mga bumabanta.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kinubkob” upang ihatid ang tumitinding larawan ng pagsasara sa paligid, ngunit inilakip sa talababa ang mas mahigpit na leksikal na paralelismo. Inilagay ang marker na [a] sa pangunahing teksto.
