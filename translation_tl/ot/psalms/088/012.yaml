  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: tl
  text: Makikilala ba sa kadiliman ang iyong kababalaghan, o ang iyong katuwiran[a] sa lupain ng pagkalimot?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lupain ng pagkalimot” ay isang matalinghagang tawag sa daigdig ng mga patay.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/יִוָּדַע
  choice: Maipakikilala ba
  rationale: Ang Nifal imperfect sa tanong ay may pasibong diwa. Likas sa modernong Tagalog ang “maipakikilala ba,” at naipapahayag nito ang ideya ng pagiging naipabatid o nakilala nang hindi ipinipilit kung kasalukuyan o hinaharap ang pokus.
- source_word: בַּ/חֹשֶׁךְ
  choice: sa kadiliman
  rationale: Tinutumbasan nito ang pang-ukol at tiyak na anyo ng pangngalan. Sa konteksto, higit ito sa karaniwang kawalan ng liwanag at nagpapahiwatig sa daigdig ng mga patay.
- source_word: פִּלְאֶךָ
  choice: ang iyong kababalaghan
  rationale: Pinananatili ang isahang anyo ng Hebreo. Ang “kababalaghan” ay maaaring tumukoy nang kolektibo sa kahanga-hangang kapangyarihan o gawa ng Diyos.
- source_word: וְצִדְקָתְךָ
  choice: o ang iyong katuwiran
  rationale: Ang “o” ay natural na nag-uugnay sa magkatulad na retorikal na tanong. Karaniwang katumbas ng צדקה ang “katuwiran,” habang inilalagay sa talababa ang posibleng “katarungan.”
- source_word: בְּאֶרֶץ
  choice: sa lupain
  rationale: Natural na Tagalog para sa matalinghagang pariralang “sa lupain ng …,” na tumutukoy rito sa daigdig ng mga patay.
- source_word: נְשִׁיָּה
  choice: pagkalimot
  rationale: Tuwirang inilalarawan ang kalagayan ng pagkalimot nang hindi dinaragdagan ng mas tiyak na interpretasyong maaaring ipahiwatig ng “paglaho sa kawalan.”
theological_decisions:
- issue: Kahulugan ng צדקה sa tulang tumutukoy sa katangian at mga gawa ng Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring mangahulugan ang salitang Hebreo ng moral na katuwiran o ng katarungan. Ginamit sa pangunahing teksto ang mas malawak at tradisyonal na “katuwiran,” habang pinanatili sa talababa ang tunay na posibleng kahulugang “katarungan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong at paralelismo ng tulang Hebreo, gayundin ang madilim na larawang tumutukoy sa kamatayan. Inilagay ang [a] kaagad pagkatapos ng salitang may alternatibong salin at ang [b] pagkatapos ng buong matalinghagang parirala.
