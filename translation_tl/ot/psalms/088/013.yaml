base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: tl
  text: Ngunit ako naman, O Yahweh, ay dumaraing sa iyo; pagsapit ng umaga, ang panalangin ko ay dumarating sa harap mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasalubong sa iyo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagdating sa harap, pagsalubong, o pag-una.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako naman
  rationale: Ipinapahayag ng pang-ugnay at hiwalay na panghalip ang mariing paghahambing o pagsalungat. Likas sa modernong Tagalog ang “Ngunit ako naman” at napapanatili nito ang diin sa nagsasalita.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng pang-ukol ang direksiyon ng pagdaing patungo kay Yahweh. Karaniwan at malinaw sa Tagalog ang “sa iyo.”
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo. Ang “O” ay angkop sa tuwirang pagtawag sa panalangin.
- source_word: שִׁוַּעְתִּי
  choice: dumaraing
  rationale: Ang pandiwa ay tumutukoy sa matinding paghingi ng tulong. Ang aspektong nagaganap sa “dumaraing” ay natural sa konteksto ng patuloy na panalangin ng salmista, nang hindi binabawasan ang bigat ng kanyang pagsusumamo.
- source_word: וּבַבֹּקֶר
  choice: pagsapit ng umaga
  rationale: Malinaw at likas na ipinapahayag nito ang panahong tinutukoy. Hindi na hiwalay na isinalin ang pang-ugnay dahil sapat na ang semicolon upang ipakita ang ugnayan ng dalawang sugnay.
- source_word: תְּפִלָּתִי
  choice: ang panalangin ko
  rationale: Tuwirang pinananatili ang pangngalan sa isahan at ang unang panauhang pagmamay-ari.
- source_word: תְקַדְּמֶךָּ
  choice: dumarating sa harap mo
  rationale: Napananatili nito ang larawan ng panalanging umaabot sa presensiya ng Diyos. Hindi nito labis na nililimitahan ang pandiwang Hebreo, na maaaring mangahulugang lumapit, sumalubong, o mauna.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Panahunan o aspekto ng שִׁוַּעְתִּי
  choice: dumaraing
  alternative: dumaing ako; dumaing na ako
  rationale: Bagaman perfect ang anyong Hebreo, maaari itong maglarawan sa panalanging isinasagawa o paulit-ulit na inihaharap sa kontekstong patula. Ang “dumaraing” ay tumutugma sa kasalukuyang pagsusumamo nang hindi ipinipilit na minsanang kilos lamang ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dumaraing” upang ihayag ang matinding paghingi ng tulong, at “dumarating sa harap mo” upang mapanatili ang matalinghagang galaw ng panalangin nang hindi pinapawi ang saklaw ng pandiwang Hebreo.
