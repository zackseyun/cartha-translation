  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: tl
  text: 'Isang awit. Isang salmo ng mga anak ni Korah. Para sa tagapanguna ng mga mang-aawit: ayon sa Mahalat Leanot[a]. Isang Maskil[b] ni Heman na Ezrahita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng “Mahalat Leanot.” Maaaring tumukoy ito sa isang himig o estilo ng musika. Iminumungkahi rin ng iba ang “ayon sa Mahalat, para sa tugunang pag-awit” o “ayon sa Mahalat, tungkol sa paghihirap.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Maskil” ay isang teknikal na katawagan sa mga pamagat ng salmo, na madalas unawain bilang isang akdang nagtuturo o nagbubulay-bulay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Isang awit
  rationale: Tuwirang salin ng katawagang pang-uri sa pamagat; natural at malinaw sa modernong Filipino.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Nakaugaliang katawagan para sa awit na may saliw ng musika at angkop sa pamagat ng mga Salmo.
- source_word: לִבְנֵי קֹרַח
  choice: ng mga anak ni Kora
  rationale: Hindi tiyak kung ang ל ay tumutukoy sa pag-akda, pag-uugnay, o pag-aalay; pinananatili ng “ng” ang maikli at likas na pahayag nang hindi labis na nagpapasya.
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Naghahatid ng tungkuling pamusikang ipinahihiwatig ng termino sa mga pamagat nang malinaw sa karaniwang mambabasa.
- source_word: עַל
  choice: ayon sa
  rationale: Maaaring magpakilala ng himig, estilo, o tagubilin sa pagtatanghal; hindi nito ipinipilit ang isang tiyak na pakahulugan.
- source_word: מָחֲלַת לְעַנּוֹת
  choice: Mahalat Leanot
  rationale: Hindi tiyak ang kahulugan ng teknikal na parirala, kaya tinumbasan ito sa baybay-Filipino at ipinaliwanag ang mga posibilidad sa talababa.
- source_word: מַשְׂכִּיל
  choice: Isang Maskil
  rationale: Teknikal at hindi ganap na tiyak na katawagan sa mga pamagat ng salmo; pinanatili bilang transliterasyon upang huwag paliitin ang kahulugan.
- source_word: לְהֵימָן
  choice: ni Heman
  rationale: Likas na Filipino para sa kaugnayan kay Heman, habang hindi tahasang nilulutas kung pag-akda o ibang uri ng pagkakaugnay ang tinutukoy.
- source_word: הָאֶזְרָחִי
  choice: na Ezraita
  rationale: Pinananatili ang tradisyonal na pagkakakilanlang etniko o pampangkan ayon sa anyong konsonantal ng Hebreo.
