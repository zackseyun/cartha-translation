translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili sa transliterasyon ang malalabong teknikal na terminong pamusika at pampanitikan, kalakip ang maiikling paliwanag sa talababa. Ang hiwa-hiwalay na maiikling pangungusap ay sumasalamin sa sunod-sunod na mga katawagan sa pamagat ng Hebreo.
