  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: tl
  text: Sino ang makauunawa sa sarili niyang mga pagkakamali? Linisin mo ako sa mga nakatagong pagkukulang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga lihim na kasalanan” o “sa mga nakatagong bagay.” Maaaring tumukoy ang Hebreo sa mga pagkukulang na lingid sa nagsasalita, ikinubli sa iba, o basta nakatago.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: mga pagkakamali
  rationale: Saklaw ng pangngalan ang mga pagkakamali, pagkaligaw, o kasalanang nagawa dahil sa pagkakamali. Likas sa makabagong Tagalog ang “mga pagkakamali” at hindi nito labis na nililimitahan ang diwa sa hindi sinasadyang kasalanan lamang.
- source_word: מִי
  choice: Sino
  rationale: Karaniwang panghalip na patanong na angkop sa retorikal na tanong.
- source_word: יָבִין
  choice: makakikilala
  rationale: Ang pandiwa ay tumutukoy sa pag-unawa o pagkilala nang may pag-unawa. Sa konteksto, ipinahihiwatig ng “makakikilala” ang hirap ng tao na lubos na mapansin at maunawaan ang sarili niyang mga pagkakamali.
- source_word: מִנִּסְתָּרוֹת
  choice: mula sa mga kasalanang lingid sa akin
  rationale: Literal itong tumutukoy sa “mga bagay na nakatago.” Dahil kaparis ito ng “mga pagkakamali,” malamang na mga kasalanan o pagkukulang ang tinutukoy. Nililinaw ng “lingid sa akin” ang isang natural na pagbasa sa konteksto, habang inilalagay sa talababa ang iba pang tunay na posibilidad.
- source_word: נַקֵּנִי
  choice: Linisin mo ako
  rationale: Ang piel imperative ng נקה ay maaaring mangahulugang magpawalang-sala, mag-alis ng sala, o maglinis. Natural ang “Linisin mo ako” sa panalangin at napapanatili nito ang diwa ng paglilinis mula sa pagkakasala nang hindi ito ikinukulong sa legal o ritwal na kahulugan.
theological_decisions:
- issue: Kung ano ang mga nakatagong bagay o pagkukulang
  choice: Mga kasalanang lingid sa nagsasalita
  alternative: Mga lihim na kasalanan, mga kasalanang lingid sa iba, o mga nakatagong bagay sa pangkalahatan
  rationale: Malakas na ipinahihiwatig ng paralelismo sa “mga pagkakamali” na moral ang tinutukoy. Gayunman, hindi tahasang sinasabi ng Hebreo kung kanino nakatago ang mga ito, kaya pinananatili sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sarili niyang” upang ipakita ang likas na ugnayan ng retorikal na tanong sa sariling mga pagkakamali. Ang talababa ay nagpapanatili sa tunay na kalabuan ng Hebreo.
