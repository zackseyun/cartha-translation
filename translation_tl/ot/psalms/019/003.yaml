  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: tl
  text: 'Walang pananalita at walang mga salita;

    hindi naririnig ang kanilang tinig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tunog.” Ang Hebreong קוֹל ay maaaring mangahulugang “tinig” o “tunog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: walang
  rationale: Likas at tuwirang pagpapahayag ito ng eksistensiyal na pagtanggi sa Filipino, kapuwa para sa “pananalita” at “mga salita.”
- source_word: אֹמֶר
  choice: pananalita
  rationale: Tumutukoy ito sa pasalitang pagpapahayag sa pangkalahatan, hindi sa isang tiyak na kasabihan; natural din ang pagtambal nito sa “mga salita.”
- source_word: דְּבָרִים
  choice: mga salita
  rationale: Sa paralelismong patula at konteksto ng pagpapahayag at pakikinig, ang kongkretong kahulugang “mga salita” ang pinakaangkop.
- source_word: בְּלִי
  choice: hindi
  rationale: Ipinahahayag nito ang negatibong kalagayan ng kasunod na pandiwang balintiyak; malinaw at natural sa Filipino ang “hindi naririnig.”
- source_word: נִשְׁמָע
  choice: naririnig
  rationale: Tuwirang isinasalin ang balintiyak na diwa ng שׁמע at nananatiling natural sa kasalukuyang Filipino.
- source_word: קוֹלָם
  choice: kanilang tinig
  rationale: Pinananatili ng “tinig” ang pagsasatao sa kalangitan sa nakapaligid na tula. Dahil maaari ring mangahulugang “tunog” ang קוֹל, inilagay sa talababa ang leksikal na alternatibo.
theological_decisions:
- issue: Ang patotoo ng kalangitan bilang komunikasyong walang ordinaryong pananalita
  choice: 'Isinalin ang taludtod bilang pagtanggi sa literal at naririnig na pananalita: “Walang pananalita at walang mga salita; hindi naririnig ang kanilang tinig.”'
  alternative: Maaaring unawain ang linya na lumalaganap ang kanilang tinig nang walang pananalita o mga salita, kaya itinatampok ang tahimik ngunit laganap na patotoo.
  rationale: 'Sinusuportahan ng anyo ng Hebreo ang pahayag tungkol sa kawalan ng literal na pananalita at mga salitang naririnig. Pinananatili nito ang tensiyong patula: ipinahahayag ng sangnilikha ang kaluwalhatian ng Diyos, ngunit hindi sa karaniwang wika ng tao, nang hindi labis na nilulutas ang talinghaga.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikling paralelismong patula at iniwasan ang mga salitang masyadong teknikal o makaluma.
