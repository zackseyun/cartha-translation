source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: tl
  text: "Ang mga tuntunin ni Yahweh ay matuwid,\n    nagpapagalak sa puso;\nAng utos ni Yahweh ay dalisay[a],\n    nagbibigay-liwanag sa mga mata."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malinaw.” Maaaring idiin ng salitang Hebreo ang kadalisayan, ngunit maaari rin itong magpahiwatig ng kalinawan, na umaangkop sa kasunod na pariralang “nagbibigay-liwanag sa mga mata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: mga tuntunin
  rationale: Tumutukoy ito sa mga itinakdang tagubilin o atas sa hanay ng mga salitang kaugnay ng Torah. Pinananatili ng “mga tuntunin” ang diwang may awtoridad at naibubukod ito sa “utos” sa kasunod na linya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: יְשָׁרִים
  choice: matuwid
  rationale: Ipinahahayag ng pang-uri na tama at walang liko ang mga tuntunin. Ang “matuwid” ay angkop sa marangal na wikang patula at hindi nililimitahan ang kahulugan sa pagiging tama lamang sa praktikal na diwa.
- source_word: מְשַׂמְּחֵי לֵב
  choice: nagpapagalak sa puso
  rationale: 'Inilalarawan ng participle ang patuloy o likas na epekto ng mga tuntunin. Malinaw na ipinapahayag ng “nagpapagalak” ang causative na diwa: pinasasaya o pinupuspos ng galak ang puso.'
- source_word: לֵב
  choice: puso
  rationale: Pinananatili ang konkretong larawang Hebreo. Bagaman maaaring saklawin ng לֵב ang isip, kalooban, at panloob na pagkatao, sapat na malawak at likas sa tulang Filipino ang “puso.”
- source_word: מִצְוַת
  choice: utos
  rationale: Ang pang-isahang anyo ay kumakatawan sa utos ni Yahweh bilang kabuuan. Ang “utos” ay natural sa modernong Filipino at pinananatili ang pagkakaiba nito sa “mga tuntunin.”
- source_word: בָּרָה
  choice: dalisay
  rationale: Pangunahing ipinahahayag ng salita ang kadalisayan o kalinisan. Ang “dalisay” ay tapat sa batayang kahulugan, habang ang posibleng diwang “malinaw” ay inilagay sa talababa dahil umaangkop din iyon sa kasunod na larawan ng pagbibigay-liwanag.
- source_word: מְאִירַת עֵינָיִם
  choice: nagbibigay-liwanag sa mga mata
  rationale: Pinananatili nito ang causative na kilos at ang konkretong metapora ng liwanag at mga mata. Mas natural ito sa Filipino kaysa sa abstraktong “nagbibigay-unawa,” na magpapaliit sa posibleng saklaw ng larawan.
- source_word: עֵינָיִם
  choice: mga mata
  rationale: Pinanatili ang konkretong pangngalan sa halip na ipakahulugan agad bilang “paningin” o “pang-unawa,” sapagkat maaaring magpahiwatig ang larawan kapuwa ng pagkaunawa at sigla.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng larawang “nagbibigay-liwanag sa mga mata”
  choice: Pinanatili ang konkretong metapora
  alternative: nagbibigay ng pang-unawa
  rationale: Maaaring tumukoy ang idyoma sa malinaw na pagkaunawa, panibagong sigla, o kapuwa nito. Hindi ito nilutas sa isang abstraktong pagpapakahulugan upang mapanatili ang lawak at tensiyon ng tulang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang dalawang magkatulad na linya, ang mga konkretong larawang “puso,” “liwanag,” at “mga mata,” at ang pagkakaiba ng “mga tuntunin” at “utos.” Inilagay ang marker [a] pagkatapos ng “dalisay,” ang salitang talagang tinutukoy ng alternatibong pagbasa.
