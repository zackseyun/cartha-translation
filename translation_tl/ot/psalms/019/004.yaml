  register: Makabago, malinaw, at marangal na Tagalog na may anyong patula. Pinanatili sa pangunahing teksto ang hindi pangkaraniwang “linya” dahil iyon ang pagbasa ng WLC, habang ipinaliwanag sa talababa ang sinaunang at kontekstuwal na alternatibong “tunog/tinig.” Parehong marker na [a] at [b] ay nasa pangunahing teksto.
