  source_fidelity: 'Tapat ang salin sa tekstong Hebreo: pinananatili sa pangunahing teksto ang “kanilang linya” para sa קַוָּם, ang “mga salita” para sa מִלֵּיהֶם, at ang di-tiyak na panghalip na “sa mga iyon” para sa בָּהֶם. Ang “umabot” ay isang katanggap-tanggap na patulang pagsasalin ng יָצָא sa kontekstong ito. Napananatili rin ang payak na “tolda” para sa אֹהֶל.'
