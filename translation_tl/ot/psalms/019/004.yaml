  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: tl
  text: 'Sa buong lupa ay umabot ang kanilang linya[a],

    at ang kanilang mga salita hanggang sa dulo ng daigdig.

    Sa mga iyon ay naglagay siya ng tolda para sa araw[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umabot sa buong lupa ang kanilang tunog/tinig.” “Kanilang linya” ang mababasa sa mga katinig ng tekstong Hebreo, ngunit ang ilang sinaunang salin at maraming tagapagpaliwanag ay inuunawa itong “tunog” o “tinig” sa kontekstong patula.
    reason: alternative_reading
  - marker: b
    text: Ang “sa mga iyon” ay malamang na tumutukoy sa kalangitan na binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: ang kanilang linya
  rationale: Pinananatili ang pagbasa ng tekstong Masoretiko na קַו, “linya.” Bagaman hindi pangkaraniwan ang talinghagang ito sa Tagalog, inilalarawan ng “umabot ang kanilang linya” ang paglaganap nito sa buong lupa at pinananatili ang tunay na tekstuwal at semantikong tensiyon; ang “tinig/tunog” ay inilagay sa talababa.
- source_word: יָצָא
  choice: umabot
  rationale: Sa kontekstong patula, likas na ipinapahayag ng “umabot” ang paglabas at paglaganap ng linya sa buong lupa, nang hindi binabago ang simuno o ang saklaw ng kilos.
- source_word: מִלֵּיהֶם
  choice: ang kanilang mga salita
  rationale: Tuwirang katumbas ng pangngalang tumutukoy sa mga salita o pananalita at pinananatili ang verbal na larawan na kaugnay ng naunang talata.
- source_word: תֵבֵל
  choice: daigdig
  rationale: Likas at marangal na salin ng תֵבֵל bilang sanlibutan o tinatahanang mundo; ang “dulo ng daigdig” ay malinaw na pariralang patula sa modernong Tagalog.
- source_word: שָׂם
  choice: naglagay
  rationale: Tuwirang inilalarawan ang ginawa ng Diyos na paglalagay; hindi kailangan ang mas interpretatibong “nagtalaga.”
- source_word: אֹהֶל
  choice: tolda
  rationale: Karaniwang kahulugan nito ay literal na tolda. Iniiwasan ng saling ito ang kultikong pahiwatig ng “tabernakulo.”
- source_word: בָּהֶם
  choice: sa mga iyon
  rationale: Pinananatili ang panghalip na maramihan at hindi tahasang itinatakda sa pangunahing teksto kung ano ang tinutukoy nito; malamang na tumutukoy ito sa kalangitan sa naunang konteksto.
- source_word: לַשֶּׁמֶשׁ
  choice: para sa araw
  rationale: Payak at tuwirang salin ng pariralang pang-ukol, kung saan ang “araw” ay ang araw sa kalangitan.
