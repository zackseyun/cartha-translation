  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: tl
  text: Ang mga iyon ay higit na kanais-nais kaysa ginto[a], maging kaysa saganang dalisay na ginto, at higit na matamis kaysa pulot at pulot na tumutulo mula sa suklay-pukyutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “dapat hangarin ... at higit na matamis kaysa pulot, maging pulot na tumutulo mula sa suklay-pukyutan.” Gumagamit ang Hebreo ng mga anyong participle na may mga pariralang pahambing; ang huling parirala ay mas literal na “umaagos na pulot ng mga suklay-pukyutan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: higit na kanais-nais
  rationale: Ang pasibong participle ng חמד ay ginagamit bilang panaguri at tumutukoy sa naunang binanggit na mga tuntunin ng PANGINOON. Ipinahihiwatig ng kasunod na מִן ang paghahambing, kaya natural ang “higit na kanais-nais.”
- source_word: מִזָּהָב
  choice: kaysa ginto
  rationale: Ang מִן ay naghuhudyat ng paghahambing dito; “kaysa ginto” ang likas na katumbas sa Filipino.
- source_word: וּמִפַּז רָב
  choice: maging kaysa saganang dalisay na ginto
  rationale: Ang פַּז ay mas tiyak kaysa זָהָב at tumutukoy sa dalisay o pinong ginto, samantalang ang רָב ay nagpapahayag ng kasaganaan. Pinananatili ng “maging” ang pasidhi ng ikalawang paghahambing.
- source_word: וּמְתוּקִים
  choice: at higit na matamis
  rationale: Kaagapay ito ng “higit na kanais-nais” at sinusundan din ng pahambing na מִן, kaya nararapat ang pahambing na anyo.
- source_word: מִדְּבַשׁ
  choice: kaysa pulot
  rationale: Ang מִן ay pahambing at ang דבש ay pulot; malinaw at natural ang “kaysa pulot.”
- source_word: וְנֹפֶת צוּפִים
  choice: at pulot na tumutulo mula sa bahay-pukyutan
  rationale: Ang נֹפֶת ay pulot na umaagos o tumutulo, at ang צוּפִים ay malamang na mga suklay o selda ng bahay-pukyutan. Pinananatili ng salin ang matingkad na larawang Hebreo nang hindi ipinipilit ang isang teknikal na katawagan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga iyon” upang tumukoy sa maramihang antecedent sa naunang talata nang hindi inuulit o nilulutas ang eksaktong katawagan nito. Pinanatili ang pag-igting mula sa karaniwang ginto tungo sa saganang dalisay na ginto, at ang konkretong larawan ng tumutulong pulot.
