id: PSA.19.14
reference: Psalms 19:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: tl
  text: Nawa’y maging kalugod-lugod sa harap mo[a] ang mga salita ng aking bibig at ang pagbubulay ng aking puso, Yahweh, aking bato at aking manunubos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa iyong paningin.” Literal sa Hebreo: “sa harap ng iyong mukha/presensya.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “manunubos” ay salin ng salitang tumutukoy sa isang nagliligtas o bumabawi; sa batas ng sinaunang Israel, madalas itong kaugnay ng pananagutan ng isang malapit na kamag-anak.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: Nawa’y maging
  rationale: Ang Qal imperfect ay may puwersang optatibo o jussive sa konteksto ng panalangin; malinaw itong naipahahayag ng “Nawa’y maging.”
- source_word: לְרָצוֹן
  choice: kalugod-lugod
  rationale: Ipinahahayag ng רָצוֹן na ang mga salita at pagbubulay ay nawa’y tanggapin nang may pagsang-ayon; natural sa makabagong Tagalog ang “kalugod-lugod.”
- source_word: אִמְרֵי פִי
  choice: mga salita ng aking bibig
  rationale: Pinananatili ang kongkretong larawang Hebreo at ang pagtutumbas nito sa panloob na pagbubulay.
- source_word: וְהֶגְיוֹן לִבִּי
  choice: at ang pagbubulay ng aking puso
  rationale: Maaaring tumukoy ang הֶגְיוֹן sa tahimik na pagninilay, pagbulay, o pag-usal. Ang “pagbubulay” ay likas at marangal na salitang Filipino na nagpapanatili sa panloob na katapat ng binibigkas na mga salita.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Malapit ito sa literal na “sa harap ng iyong mukha/presensya” at pinananatili ang diwang ang panalangin ay inihaharap at sinusuri sa presensya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan sa halip na palitan ito ng titulong “Panginoon.”
- source_word: צוּרִי
  choice: aking bato
  rationale: Pinananatili ang tuwirang metapora ng צוּר para sa katatagan at pagkupkop ng Diyos, sa halip na agad itong ipaliwanag bilang “kanlungan.”
- source_word: וְגֹאֲלִי
  choice: at aking manunubos
  rationale: Ang גֹאֵל ay isang tagapagligtas o tagabawi, na kadalasang may kaugnayan sa pananagutan ng malapit na kamag-anak. Ang “manunubos” ay maikli at hindi labis na nililimitahan ang kahulugan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na halinhan ito ng isang titulo.
- issue: Metaporang צוּרִי
  choice: aking bato
  alternative: aking kanlungan
  rationale: Hindi ipinaliliwanag nang palihim ang metapora; nananatili ang makatang larawan ng Diyos bilang matatag na tagapagsanggalang.
- issue: Saklaw ng גֹאֲלִי
  choice: aking manunubos
  alternative: aking kamag-anak na manunubos o aking tagapagligtas
  rationale: Pinananatili ang ideya ng pagtubos o pagbawi nang hindi ipinapalagay na ang buong legal na papel ng kamag-anak na manunubos ang tiyak na diin sa taludtod.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino. Pinanatili ang paralelismo ng panlabas na pananalita at panloob na pagbubulay, gayundin ang metaporang “bato.” Hindi ginamit ang makalumang pantawag na “O” bago ang Yahweh sapagkat sapat at natural sa Filipino ang tuwirang pagtawag sa pangalan.
