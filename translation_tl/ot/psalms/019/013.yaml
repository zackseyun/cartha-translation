  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: tl
  text: Pigilan mo rin ang iyong lingkod sa mga kasalanang mapangahas[a]; huwag mong hayaang pagharian ako ng mga iyon. Kung magkagayon, magiging walang kapintasan ako[b] at magiging malaya sa malaking pagsuway[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga palalo” o “sa mga taong mapagmataas.” Maaaring tumukoy ang Hebreo sa mga taong mapagmataas o sa mga kasalanang ginagawa nang may kapalaluan at pangangahas.
    reason: alternative_reading
  - marker: b
    text: O “magiging buo ako,” “magiging matuwid ako,” o “magiging walang sala ako.” Ang salitang Hebreo ay maaaring magpahiwatig ng kabuuan o integridad.
    reason: lexical_alternative
  - marker: c
    text: O “sa malaking paghihimagsik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: rin
  rationale: Ikinakabit nito ang panalangin sa naunang kahilingan tungkol sa mga lihim na pagkakamali at pinananatili ang dagdag na diwa ng salita.
- source_word: מִזֵּדִים
  choice: sa mga kasalanang mapangahas
  rationale: Maaaring tumukoy ang anyo sa mga taong palalo o sa mga pagkakasalang bunga ng kapalaluan at kusang pangangahas. Mas akma rito ang ikalawa dahil kasalanan at pagkakamali ang paksa ng kalapit na konteksto, ngunit inilalahad sa talababa ang tunay na ambiguwidad.
- source_word: חֲשֹׂךְ
  choice: Pigilan
  rationale: Tuwirang ipinahahayag ang pakiusap na hadlangan ng Diyos ang lingkod upang hindi siya madala sa gayong mga kasalanan.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Likas at marangal na katawagan sa isang nananalangin na nagpapasakop sa Diyos.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: huwag mong hayaang pagharian ako ng mga iyon
  rationale: Pinananatili ang larawan ng mga kasalanan bilang kapangyarihang maaaring mangibabaw sa tao.
- source_word: אָז
  choice: Kung magkagayon
  rationale: Malinaw na ipinakikita ang bungang susunod kapag pinigilan ng Diyos ang nagsasalita.
- source_word: אֵיתָם
  choice: magiging walang kapintasan ako
  rationale: Ipinahahayag ang moral na integridad o pagiging buo, hindi ang ganap na kawalan ng anumang kasalanan.
- source_word: וְנִקֵּיתִי
  choice: mawawalan ng sala
  rationale: Inihahatid ang diwa ng pagiging malaya o malinis mula sa pananagutan sa pagkakasala sa natural na modernong Tagalog.
- source_word: מִפֶּשַׁע רָב
  choice: sa malaking pagsuway
  rationale: Ang פשע ay malubhang paglabag o paghihimagsik laban sa Diyos; pinananatili ng salin ang bigat at ang anyong isahan ng Hebreo.
theological_decisions:
- issue: Tinutukoy ng מִזֵּדִים
  choice: mga kasalanang mapangahas
  alternative: mga palalo o mapagmataas na tao
  rationale: Pinapaboran ng agarang konteksto tungkol sa mga pagkakamali at kasalanan ang moral na pagbasa, at natural ding masasabing naghahari ang kasalanan sa tao. Gayunman, hindi inaalis ang alternatibong pagtukoy sa mga tao at inilalagay ito sa talababa.
- issue: Diwa ng אֵיתָם
  choice: walang kapintasan sa diwa ng integridad
  alternative: buo, matuwid, o walang sala
  rationale: Hindi ito inilalahad bilang doktrina ng ganap na kawalang-kasalanan; inilalarawan nito ang buo at matuwid na pamumuhay na bunga ng pagpigil ng Diyos.
- issue: Ugnayan ng dalawang huling pahayag
  choice: 'dalawang magkaugnay ngunit magkahiwalay na bunga: integridad at pagkawala ng sala'
  alternative: isang pahayag lamang na inuulit sa ibang salita
  rationale: Pinananatili ang dalawang anyo sa Hebreo, אֵיתָם at וְנִקֵּיתִי, nang hindi ipinipilit na lubos silang magkapareho o ganap na magkaiba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang “pagharian” upang mapanatili ang matingkad na larawan ng paghahari o pangingibabaw. Iniwasan ang sobrang teknikal na bokabularyo at pinanatili sa mga talababa ang mahahalagang alternatibong pagbasa.
