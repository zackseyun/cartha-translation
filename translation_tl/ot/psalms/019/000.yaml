lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ang salita sa taong namamahala sa pagtatanghal ng musika. Likas sa makabagong Filipino ang pariralang ito at pinananatili ng “para sa” ang diwa ng panlaping לַ.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ito ang karaniwang katawagan sa ganitong uri ng awiting panrelihiyon at mas tiyak kaysa sa pangkalahatang “awit.”
- source_word: לְדָוִד
  choice: ni David
  rationale: Ito ang maikli, natural, at nakaugaliang anyo sa Filipino para sa pamagat ng salmo. Hindi nito ganap na nilulutas kung ang kaugnayan ay pagkatha, pag-aari o pag-uugnay, o pag-aalay; nililinaw sa talababa ang saklaw ng Hebreo.
theological_decisions:
- issue: Kahulugan ng לְדָוִד sa pamagat
  choice: ni David
  alternative: isinulat ni David; para kay David
  rationale: Maaaring ipahiwatig ng pariralang Hebreo ang pagkatha, pagkakaugnay o pag-aari, o pag-aalay. Ginamit ang nakaugaliang “ni David” sa teksto at pinanatili sa talababa ang tunay na kalabuan nito.
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “tagapangasiwa ng awitan” sa halip na mas teknikal o masyadong pangkalahatang katawagan, at ikinabit ang [a] kay David, na siyang tinutukoy ng talababa.
