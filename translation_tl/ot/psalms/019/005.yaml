  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: tl
  text: At ito ay gaya ng lalaking ikakasal na lumalabas mula sa silid-pangkasal niya[a]; gaya ng mandirigma, nagagalak itong tumakbo sa isang landas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kanopya ng kasalan niya” o “mula sa silid-pangkasal niya.” Ang Hebreong חֻפָּה ay maaaring tumukoy sa isang kanopya ng kasalan o sa silid-pangkasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: At ito ay
  rationale: Tumutukoy ang panghalip sa araw sa naunang talata. Ang “ito” ay natural sa Filipino para sa araw, habang pinananatili ng “At” ang pang-ugnay na Hebreo.
- source_word: כְּחָתָן
  choice: tulad ng lalaking ikakasal
  rationale: Ang חָתָן ay lalaking ikakasal. Malinaw at kasalukuyang Filipino ito at pinananatili ang larawang pangkasal.
- source_word: יֹצֵא
  choice: na lumalabas
  rationale: Ipinahahayag ng participle ang masigla at kasalukuyang larawan ng paglabas.
- source_word: מֵחֻפָּתוֹ
  choice: mula sa silid-pangkasal nito
  rationale: Maaaring tumukoy ang חֻפָּה sa tolda o silid na kaugnay ng kasalan. Ang “silid-pangkasal” ay angkop sa larawan ng lalaking ikakasal na masayang lumalabas; inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: יָשִׂישׂ
  choice: nagagalak ito
  rationale: Ang pandiwa ay nagpapahiwatig ng masiglang kagalakan. Ang “nagagalak” ay dignificado ngunit madaling maunawaan.
- source_word: כְּגִבּוֹר
  choice: tulad ng mandirigma
  rationale: Ang גִּבּוֹר ay malakas na tao o mandirigma. Pinananatili ng “mandirigma” ang malakas at bayaning larawan.
- source_word: לָרוּץ
  choice: tatakbo
  rationale: Tuwirang ipinahahayag nito ang layunin o kahandaang tumakbo nang hindi nagdaragdag ng diwang paligsahan.
- source_word: אֹרַח
  choice: sa isang landas
  rationale: Ang אֹרַח ay landas o daan. Ang “isang landas” ay hindi nagdaragdag ng possessive na wala sa Hebreo at pinananatili ang talinghaga.
