translation_notes:
  register: Makabagong Filipino na may dignidad at bahagyang makatang himig. Ginamit ang “lalaking ikakasal” sa halip na mas kolokyal o hiram na katawagan, at pinanatili ang personipikasyon ng araw. Ang panghalip na “nito/ito” ay tumutukoy sa araw, hindi sa lalaking ikakasal.
