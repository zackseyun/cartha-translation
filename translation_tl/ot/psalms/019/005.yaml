  naturalness: Mas malinaw at likas sa makabagong Filipino ang paglalagay ng “niya” para sa silid ng lalaking ikakasal at ang paghihiwalay ng paghahambing na “gaya ng mandirigma” mula sa pandiwang “nagagalak.” Ang “tumakbo” ay tuwirang naihahayag ang infinitive na לָרוּץ nang walang diwa ng hinaharap.
