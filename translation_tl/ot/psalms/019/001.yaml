  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: tl
  text: Ipinapahayag ng kalangitan ang kaluwalhatian ng Diyos, at ibinabalita ng kalawakan[a] ang gawa ng kanyang mga kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalawakan ng langit.” Ang Hebreong רָקִיעַ ay tumutukoy sa nakalatag na langit o malawak na bobeda ng langit.
    reason: lexical_alternative
  - marker: b
    text: O “kanyang likha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: ang kalangitan
  rationale: Ang maramihang anyong Hebreo ay tumutukoy sa langit o mga langit. Pinananatili ng “kalangitan” ang mataas at makatang rehistro at ang malawak na saklaw ng larawan.
- source_word: מְסַפְּרִים
  choice: ipinapahayag
  rationale: Ang pandiwaring participle mula sa ספר ay nangangahulugang nagsasalaysay o naghahayag. Ang “ipinapahayag” ay natural sa personipikasyon ng kalangitan at ipinahihiwatig ang patuloy na kilos.
- source_word: כְּבוֹד
  choice: kaluwalhatian
  rationale: Karaniwang katumbas ito ng כבוד sa kontekstong biblikal at naipahahayag ang marangal at mabigat na kadakilaan ng Diyos.
- source_word: אֵל
  choice: Diyos
  rationale: Bagaman maaaring gamitin bilang titulong “El,” sa talatang ito ay natural itong tumutukoy sa Diyos na Maylalang; hindi hinihingi ng konteksto ang transliterasyon bilang pangalang pantangi.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: ang gawa ng kanyang mga kamay
  rationale: Pinananatili nito ang kongkreto at antropomorpikong idyoma ng Hebreo sa halip na gawing mas abstrakto bilang “kanyang likha.”
- source_word: מַגִּיד
  choice: ibinabalita
  rationale: Ang Hiphil participle ng נגד ay tumutukoy sa pagpapakilala o paghahayag. Ang “ibinabalita” ay makata at nagbibigay ng natural na paralelismo nang hindi inuulit ang “ipinapahayag.”
- source_word: הָרָקִיעַ
  choice: ang kalawakan
  rationale: Ang רָקִיעַ ay ang nakalatag o nakabukang lawak ng langit. Ang “kalawakan” ay malinaw at marangal sa modernong Filipino, bagaman maaari rin itong unawain ngayon bilang outer space; kaya nililinaw sa talababa ang imaheng Hebreo.
theological_decisions:
- issue: Paglilipat ng אֵל
  choice: Diyos
  alternative: El
  rationale: Maaaring titulo o katawagan ang אֵל, ngunit dito ay tuwirang tumutukoy ito sa Diyos na ang kaluwalhatian ay ipinahahayag ng sangnilikha. Ang “Diyos” ay natural at hindi nagdaragdag ng diin sa isang pangalang pantangi na hindi kinakailangan ng konteksto.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino. Pinananatili ang personipikasyon, ang paralelismo ng dalawang linya, at ang kongkretong idyomang “gawa ng kanyang mga kamay.”
