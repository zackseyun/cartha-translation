id: PSA.19.7
reference: Psalms 19:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: tl
  text: Ang kautusan ni Yahweh ay ganap at nagpapanumbalik ng buhay[a]; ang patotoo ni Yahweh ay mapagkakatiwalaan at ginagawang marunong ang walang muwang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: nagbibigay ng panibagong sigla sa buong pagkatao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: kautusan
  rationale: Maaaring tumukoy ang תּוֹרָה sa turo o tagubilin sa malawak na diwa, ngunit sa kontekstong ito ay may bigat ng ipinahayag at tipanang kalooban ni Yahweh. Pinananatili ng “kautusan” ang puwersang iyon at natural ito sa makatang paghahanay ng talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos, hindi pinalitan ng isang titulo.
- source_word: תְּמִימָה
  choice: ganap
  rationale: Ipinahahayag nito ang pagiging buo, walang kapintasan, at lubos na maaasahan; malinaw at marangal ang “ganap” sa modernong Filipino.
- source_word: מְשִׁיבַת נָפֶשׁ
  choice: nagpapanumbalik ng buhay
  rationale: Pinananatili ng “nagpapanumbalik” ang diwa ng pagbabalik sa ugat na שׁוב, samantalang ang “buhay” ay natural na katumbas ng malawak na gamit ng נֶפֶשׁ para sa buhay o buong pagkatao. Inilagay sa talababa ang malakas na kontekstuwal na diwa ng muling pagpapasigla.
- source_word: עֵדוּת
  choice: patotoo
  rationale: Tuwirang inilalarawan nito ang pinatotohanan at tipanang pahayag ni Yahweh at pinananatili ang magkakatugmang katawagan para sa banal na kapahayagan.
- source_word: נֶאֱמָנָה
  choice: mapagkakatiwalaan
  rationale: Malinaw nitong ipinapahayag sa kasalukuyang Filipino ang katatagan at pagiging maaasahan ng patotoo.
- source_word: מַחְכִּימַת
  choice: ginagawang marunong
  rationale: 'Tuwiran nitong naihahayag ang causative na diwa: nagiging marunong ang tinutukoy na tao.'
- source_word: פֶּתִי
  choice: ang walang muwang
  rationale: Tumutukoy ito sa taong walang karanasan, madaling malinlang, at hindi pa nahuhubog, hindi kinakailangang sa isang taong likas na masama. Natural sa Filipino ang “walang muwang” para sa ganitong diwa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng מְשִׁיבַת נָפֶשׁ
  choice: nagpapanumbalik ng buhay
  alternative: nagbibigay ng panibagong sigla sa buong pagkatao
  rationale: Maaaring ipahiwatig ng parirala ang pagpapanumbalik ng buhay o ang muling pagpapasigla ng tao. Pinananatili ng pangunahing salin ang leksikal na puwersa ng שׁוב at נֶפֶשׁ, habang inilalahad sa talababa ang mahalagang kontekstuwal na posibilidad nang hindi nilulutas nang sapilitan ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinananatili ang balanseng estruktura at paralelismo ng tulang Hebreo. Ginamit ang pang-ugnay na “at” upang maging likas sa Filipino nang hindi binabago ang lohikal na ugnayan ng mga sugnay.
