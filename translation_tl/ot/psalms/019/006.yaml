base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: tl
  text: Ang pagsikat nito ay mula sa isang dulo ng kalangitan[a], at ang paglibot nito[b] ay hanggang sa mga dulo ng kalangitan; walang nalilingid sa init nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paglabas nito.” Ang salitang Hebreo ay maaaring tumukoy sa paglitaw ng araw o sa lugar na pinagmumulan nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pag-ikot nito” o “landas nito.” Binibigyang-diin ng Hebreo ang pagtahak ng araw sa kalangitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: mula sa isang dulo ng kalangitan
  rationale: Ang קָצֶה ay “dulo” o “hangganan.” Likas sa Filipino ang “isang dulo” sa ganitong paglalarawan, at pinananatili ng “kalangitan” ang marangal at makatang diwa ng שָׁמַיִם.
- source_word: מוֹצָאוֹ
  choice: ang pagsikat nito
  rationale: Ang מוֹצָא ay maaaring tumukoy sa paglabas o pinagmumulan. Dahil araw ang tinutukoy sa naunang talata, malinaw at likas ang “pagsikat,” habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: וּתְקוּפָתוֹ
  choice: at ang pag-ikot nito
  rationale: Ang תְּקוּפָה ay nagpapahiwatig ng pag-ikot, paglibot, o pagtahak sa isang paikot na landas. Ang “pag-ikot” ay maikli, makata, at madaling maunawaan.
- source_word: עַל קְצוֹתָם
  choice: ay hanggang sa mga dulo niyon
  rationale: Ginagamit dito ang עַל sa diwang saklaw o hantungan. Ang “mga dulo niyon” ay nagpapanatili sa maramihang anyo at nag-uugnay pabalik sa kalangitan.
- source_word: וְאֵין נִסְתָּר
  choice: walang nalilingid
  rationale: Tumpak at matipid na ipinahahayag ng “walang nalilingid” ang eksistensiyal na pagkakaila kasama ng pasibong anyong נִסְתָּר, at angkop ito sa marangal na tulang Filipino.
- source_word: מֵחַמָּתוֹ
  choice: sa init nito
  rationale: Ang חַמָּה rito ay init ng araw, hindi lamang banayad na warmth. Walang kasariang ipinapataw ang panghalip na Filipino na “nito,” kaya natural nitong naiiwasan ang di-kinakailangang pagpapalakas ng personipikasyon.
theological_decisions:
- issue: Antas ng personipikasyon sa araw
  choice: Gamitin ang karaniwang panghalip na Filipino na “nito” habang pinananatili ang makatang paglalarawan sa pagkilos ng araw.
  alternative: Lalong gawing tila persona ang araw sa pamamagitan ng mga salitang nagpapahiwatig ng sinadyang pagkilos.
  rationale: Panlalaking isahan ang mga hulaping Hebreo dahil sa gramatikal na kasarian ng “araw.” Hindi kailangang dagdagan sa Filipino ang personipikasyon o magpahiwatig ng mitolohikong pagka-diyos; nilalarawan ng talata ang araw bilang bahagi ng nilikha.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa makabagong Filipino. Ginamit ang “kalangitan” bilang likas na kolektibong katumbas ng Hebreong pangmaramihan, at ang semicolon upang panatilihin ang malinaw na paghati sa huling pahayag.
