  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: tl
  text: Gayundin, ang iyong lingkod ay binabalaan ng mga ito[a]; may malaking gantimpala sa pagsunod sa mga ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nag-iingat dahil sa mga ito” o “tumatanggap ng babala mula sa mga ito”; maaaring ipahiwatig ng pandiwang Hebreo ang pagiging binabalaan o ang pag-iingat batay sa babala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “may masaganang bunga” o “may malaking kahihinatnan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: din
  rationale: Pinananatili ang pandagdag na diwa ng Hebreo at likas ang puwesto nito sa makabagong Tagalog.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Tumutukoy ang salmista sa sarili niya bilang lingkod ng Diyos; ang “lingkod” ay angkop sa debosyonal na ugnayan sa konteksto.
- source_word: נִזְהָר
  choice: binabalaan
  rationale: 'Pinananatili ang pasibong diwa ng Niphal: ang lingkod ay binibigyang-babala o pinaaalalahanang mag-ingat.'
- source_word: בָּהֶם
  choice: sa pamamagitan ng mga iyon
  rationale: Tumutukoy pabalik sa mga tuntunin at hatol ng PANGINOON at malinaw na ipinapahayag ang instrumental na gamit.
- source_word: בְּשָׁמְרָם
  choice: sa pagsunod sa mga iyon
  rationale: Sa kontekstong ito, ang שמר ay hindi lamang pag-iingat kundi maingat na pagtupad o pagsunod; likas at malinaw ito sa Tagalog.
- source_word: עֵקֶב
  choice: gantimpala
  rationale: Ipinahihiwatig ang mabuting bunga o kapalit na kasunod ng pagsunod, nang hindi ipinapasok ang isang sistemang teolohikal tungkol sa merito.
- source_word: רָב
  choice: malaking
  rationale: Tuwirang inilalarawan ang lawak o kasaganaan ng gantimpala.
theological_decisions:
- issue: Kung ang talata ay nagtuturo ng pag-asang nakabatay sa merito o nagsasaad lamang ng mabuting bunga ng pagsunod
  choice: Pinanatili ang “may malaking gantimpala,” na nagsasaad ng positibong bunga nang hindi nililinaw kung ito ay kinita bilang merito.
  alternative: “Nagdudulot ito ng malaking pakinabang” o isang mas tahasang pahayag na ang pagsunod ay kumikita ng gantimpala mula sa Diyos.
  rationale: Hindi tinutukoy ng Hebreong parirala ang eksaktong mekanismo o teolohiya ng gantimpala; nararapat panatilihin ang tensiyon at hindi ito labis na ipaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga iyon” upang malinaw na tumukoy sa mga utos at tuntuning binanggit sa naunang konteksto; iniwasan ang mas arkaikong “yaon.”
