base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: tl
  text: Ang pagkatakot kay Yahweh ay dalisay[a] at nananatili magpakailanman[b]; ang mga hatol ni Yahweh[c] ay totoo at pawang matuwid[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malinis.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nakatayo magpakailanman.”
    reason: lexical_alternative
  - marker: c
    text: O “mga tuntunin ni Yahweh.”
    reason: lexical_alternative
  - marker: d
    text: Sa Hebreo, “pawang matuwid”; ibig sabihin, ang lahat ng hatol ay matuwid bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: ang pagkatakot kay Yahweh
  rationale: Pinananatili ang mayamang idyomang Hebreo na sumasaklaw sa takot, pagpipitagan, at debosyon kay Yahweh, sa halip na paliitin ito sa 'pagsamba' o 'relihiyon.'
- source_word: טְהוֹרָה
  choice: dalisay
  rationale: Likas at marangal sa modernong Filipino; naipahahayag nito ang pagiging puro o malinis sa moral at rituwal na diwa.
- source_word: עוֹמֶדֶת לָעַד
  choice: nananatili magpakailanman
  rationale: Natural na inililipat ang literal na 'nakatayo magpakailanman' bilang idyoma ng permanenteng pananatili.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: ang mga hatol ni Yahweh
  rationale: Pinananatili ang hudisyal na himig ng מִשְׁפָּט, habang kinikilala sa talababa ang posibleng diwang 'mga tuntunin.'
- source_word: אֱמֶת
  choice: totoo
  rationale: Ang pang-uri/panaguring 'totoo' ang pinakanatural na Filipino para sa predikatibong gamit ng Hebreo.
- source_word: צָדְקוּ יַחְדָּו
  choice: lubos na matuwid
  rationale: Ipinahahayag ang kolektibo at ganap na katuwiran ng lahat ng hatol bilang isang kabuuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang tinutukoy ng 'pagkatakot kay Yahweh' sa magkakasunod na paglalarawan ng kapahayagan ng Diyos
  choice: Panatilihin ang Hebreong pananalitang 'pagkatakot kay Yahweh.'
  alternative: Ang pagsamba kay Yahweh; ang relihiyon ni Yahweh; ang pagpipitagan kay Yahweh
  rationale: Pinananatili nito ang tunay na lawak at tensiyong teolohikal ng parirala—takot, pagpipitagan, at tapat na debosyon—nang hindi ito ipinapakahulugan nang labis.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pagkatakot' upang mapanatili ang tradisyonal at teolohikal na bigat ng Hebreo; 'dalisay,' 'nananatili,' at 'lubos na matuwid' ang natural na mga katumbas sa kasalukuyang gamit.
