translation:
  language: tl
  text: 'Araw-araw ay saganang nagbubuhos ng pahayag[a],

    at gabi-gabi ay naghahayag ng kaalaman.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bumubukal ng pahayag.” Inilalarawan ng pandiwang Hebreo ang sagana at patuloy na pag-agos, hindi lamang ang pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpapabatid ng kaalaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם ... לְיוֹם
  choice: Araw sa araw
  rationale: Pinananatili nito ang maikli at patulang anyo ng Hebreo, pati ang diwa ng pagpapatuloy o paghahatid mula sa isang araw tungo sa kasunod.
- source_word: יַבִּיעַ
  choice: saganang nagbubuhos
  rationale: Ang pandiwa ay naglalarawan ng pag-apaw o masaganang pagdaloy. Nililinaw ng “saganang” ang lakas ng larawan, na maaaring hindi sapat na maipahiwatig ng “nagbubuhos” lamang.
- source_word: אֹמֶר
  choice: pahayag
  rationale: Tumutukoy ito sa ipinahahayag o sinasabi. Ang “pahayag” ay likas sa makabagong Tagalog at angkop sa patulang paglalarawan ng patuloy na pagpapahayag ng kalangitan.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: at gabi sa gabi
  rationale: Tumutugma ito sa “araw sa araw” at pinananatili ang parallelismo at siksik na anyo ng Hebreo.
- source_word: יְחַוֶּה
  choice: naghahayag
  rationale: Maaaring mangahulugang nagpapabatid, nagpapakita, o naghahayag. Ang “naghahayag” ay natural at nagpapanatili ng bahagyang saklaw sa pagitan ng pagsasabi at pagbubunyag.
- source_word: דָּעַת
  choice: kaalaman
  rationale: Ito ang tuwirang katumbas na nagpapanatili sa konseptuwal na parallelismo nito sa “pahayag.”
