base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: tl
  text: Pinatitibay nila ang isang masamang balak para sa sarili nila[a]; pinag-uusapan nila ang pagtatago ng mga bitag. Sinasabi nila, “Sino ang makakakita sa mga iyon?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang “isang masamang balak” ay maaari ring isaling “isang masamang usapin” o “isang masamang gawain,” sapagkat ang salitang Hebreo ay maaaring mangahulugang “salita,” “bagay,” “usapin,” o “gawain.”
    reason: lexical_alternative
  - marker: b
    text: O, “Sino ang makakakita sa atin?” Ganito inuunawa ng ilan ang sinabi ng mga nagbabalak tungkol sa kanilang sarili. Gayunman, ikatlong panauhang maramihan (“mga iyon” o “sila”) ang anyong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ
  choice: Pinagtitibay nila
  rationale: Ang Piel ng חזק ay nagpapahayag ng pagpapalakas o pagpapatatag. Ang “pinagtitibay” ay natural sa Filipino at pinananatili ang diwa ng sinasadyang pagpapatatag sa masamang binabalak.
- source_word: לָמוֹ
  choice: para sa kanilang sarili
  rationale: 'Sa konteksto, ang panghalip ay pinakamainam unawain bilang pabalik sa mga nagbabalak: pinagtitibay nila ito para sa sarili nilang layunin.'
- source_word: דָּבָר רָע
  choice: isang masamang balak
  rationale: Malawak ang saklaw ng דָּבָר—salita, bagay, usapin, o gawain. Dahil ang kasunod ay tungkol sa pagtatago ng mga bitag, malinaw at natural ang “masamang balak,” habang itinatala sa talababa ang mas literal na mga posibilidad.
- source_word: יְסַפְּרוּ
  choice: pinag-uusapan nila
  rationale: Bagaman maaaring mangahulugang “isinasalaysay” o “sinasabi,” inilalarawan dito ng Piel ng ספר ang pag-uusap nila tungkol sa lihim na gawain; kaya ang “pinag-uusapan” ay angkop sa konteksto.
- source_word: לִטְמוֹן
  choice: ang pagtatago
  rationale: Ang טמן ay nangangahulugang magtago o magkubli. Pinananatili ng “pagtatago” ang pangunahing leksikal na diwa nang hindi ito pinapalitan ng mas interpretatibong “paglalagay.”
- source_word: מוֹקְשִׁים
  choice: mga bitag
  rationale: Ang מוֹקֵשׁ ay patibong o bitag. Ang “bitag” ay karaniwan, malinaw, at angkop kapuwa sa literal at matalinghagang gamit sa Mga Awit.
- source_word: אָמְרוּ
  choice: Sinasabi nila
  rationale: Bagaman nasa qatal ang anyo, sa daloy ng tulang Hebreo maaari itong magsalaysay ng kasalukuyan o nakagawiang pananalita. Kaayon ito ng mga pandiwang naglalarawan sa patuloy nilang pagbabalak.
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: Sino ang makakakita sa mga iyon?
  rationale: Ikatlong panauhang maramihan ang hulapi sa לָמוֹ, kaya pinananatili ng “mga iyon” ang gramatikal na “them.” Hindi tahasang tinutukoy ng siksik na pananalitang Hebreo kung ang tinutukoy ay ang mga bitag o ibang bahagi ng balak.
theological_decisions:
- issue: Ang tinutukoy ng ikatlong panauhang maramihan sa מִי יִרְאֶה לָּמוֹ
  choice: “Sino ang makakakita sa mga iyon?”
  alternative: “Sino ang makakakita sa atin?”
  rationale: Pinananatili sa pangunahing teksto ang ikatlong panauhang maramihan ng Hebreo at hindi ginagawang unang panauhan. Gayunman, dahil maaaring katawanin ng pahayag ang tuwirang pananalita ng mga nagbabalak at hindi tahasan ang antecedent, itinatala ang alternatibo sa talababa nang hindi nilulutas nang sapilitan ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bitag” sa halip na mas matandang “silo,” at pinanatili ang magkakatulad na pandiwang pangkasalukuyan upang maipakita ang tuloy-tuloy o nakagawiang pagbabalak. Ang medyo pormal na “para sa kanilang sarili” ay sadyang pinanatili upang katawanin ang לָמוֹ nang hindi ito binubura.
