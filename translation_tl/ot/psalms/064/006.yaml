  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: tl
  text: 'Masusi nilang sinasaliksik ang mga kasamaan:


    “Sabi nila, ‘Natapos na namin ang masusing pagsisiyasat.’”[a]


    Ang kalooban at puso ng tao ay malalim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Malabo ang Hebreo sa linyang ito. Paulit-ulit ang salitang kaugnay ng “saliksik” o “paghahanap nang masusi.” Maaari rin itong unawain bilang: “Ganap na naming nabuo ang isang pakana na masusi naming pinaghandaang mabuti.”'
    reason: Ang תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ ay isang siksik at pinagtatalunang parirala. Ang pangunahing salin ay pinananatili ang pag-uulit ng ugat na חפשׂ; itinatala ng talababa ang makatwirang pagkaunawang tumutukoy ito sa isang planong maingat na inihanda.
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Nagbabalak sila ng masasama
  rationale: Ang pandiwang חפשׂ ay literal na tumutukoy sa masusing paghahanap o pagsisiyasat, ngunit kasama ng עוֹלֹת ay inilalarawan nito ang masinsing pagbabalak ng masasamang gawa.
- source_word: תַּמְנוּ
  choice: Ganap na
  rationale: Pinananatili ang diwa ng pagtatapos o pagbuo nang lubos; ang anyo ay unang panauhang maramihan kaya inilalahad bilang sinabi ng mga nagbabalak.
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: ang balak na masusi naming pinag-isipan
  rationale: Ang magkaugnay na mga salita mula sa ugat na חפשׂ ay nagbibigay-diin sa masusing pagsisiyasat. Ginawang likas sa Tagalog nang hindi idinaragdag bilang tiyak ang ideya ng pagtatago.
- source_word: קֶרֶב אִישׁ וְלֵב עָמֹק
  choice: Malalim ang kalooban at puso ng bawat tao
  rationale: Isinasalin ang קֶרֶב bilang panloob na pagkatao o kalooban at pinananatili ang hiwalay ngunit magkaugnay na pagbanggit sa puso.
theological_decisions:
- issue: Kung ang huling linya ay moral na paghatol o paglalarawan sa di-maarok na panloob na pagkatao
  choice: Malalim ang kalooban at puso ng bawat tao
  alternative: Napakasalimuot ng kalooban at puso ng tao
  rationale: Pinananatili ang payak na metaporang עָמֹק, “malalim,” upang huwag ipakahulugan nang lampas sa tahasang sinasabi ng Hebreo.
translation_notes:
  register: Makabago at marangal na Tagalog; pinili ang “nagbabalak,” “masusi,” at “kalooban” bilang mga salitang madaling maunawaan ngunit angkop sa panulaang biblikal. Iningatan ang maikli at matinding daloy ng talata.
