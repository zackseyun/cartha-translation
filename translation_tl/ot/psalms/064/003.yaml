  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: tl
  text: 'na humahasa ng kanilang dila na parang espada;

    inihahanda nilang ipana ang kanilang palaso—

    isang mapait na salita—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: humahasa
  rationale: Ipinananatili ang talinghaga ng paghahasa at natural na inilalarawan sa Tagalog ang palagiang ginagawa ng mga tinutukoy.
- source_word: כַחֶרֶב
  choice: na parang espada
  rationale: Tuwirang paghahambing ito sa espada; malinaw at karaniwan ang “espada” sa modernong Tagalog.
- source_word: דָּרְכוּ חִצָּם
  choice: inihahanda nilang ipana ang kanilang palaso
  rationale: Ang דָּרַךְ ay karaniwang tumutukoy sa pag-igting o paghahanda ng sandata para ipana. Dahil “palaso,” hindi “pana,” ang tahasang layon sa Hebreo, iniiwasan ang literal ngunit malabong “binabaluktot ang palaso” habang pinananatili ang larawan ng paghahandang magpaputok.
- source_word: דָּבָר מָר
  choice: isang mapait na salita
  rationale: Pinananatili ang isahang “salita” at ang literal na katangiang “mapait,” na dito ay nagpapahiwatig ng nakasasakit o malupit na pananalita nang hindi pinapalitan ang talinghaga.
