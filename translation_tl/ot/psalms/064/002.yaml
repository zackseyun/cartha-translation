  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: tl
  text: 'Ikubli mo ako mula sa lihim na pagsasanggunian ng mga gumagawa ng masama[a],

    mula sa kaguluhan ng mga gumagawa ng kasamaan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lihim na pakana ng mga gumagawa ng masama.” Ang salitang Hebreo na סוֹד ay maaaring tumukoy sa lihim na pagsasanggunian, panloob na pangkat, o palihim na pakana.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa magulong pagkilos ng mga gumagawa ng kasamaan.” Ang salitang Hebreo na רִגְשָׁה ay nagpapahiwatig ng mapanlaban na pag-aalimpuyo, ingay, o kaguluhan; maaari rin itong tumukoy sa nagkakagulong karamihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: Ikubli mo ako
  rationale: Ang Hiphil ng סתר na may hulaping unang panauhan ay nangangahulugang “ikubli/itago mo ako.” Sa konteksto ng panalangin, likas itong isinalin bilang tuwirang pakiusap sa Diyos.
- source_word: מִסּוֹד
  choice: sa lihim na pagpupulong
  rationale: Maaaring tumukoy ang סוֹד sa lihim na pagsasanggunian, malapit na pangkat, o sabwatan. Pinananatili ng “lihim na pagpupulong” ang diwa ng kapuwa pagiging palihim at sama-samang pagpapayo nang hindi ipinapalagay agad na tiyak na pakana ito.
- source_word: מְרֵעִים
  choice: mga gumagawa ng masama
  rationale: Ang participle mula sa רעע ay tumutukoy sa mga taong gumagawa ng masama; malinaw at natural sa modernong Filipino ang pariralang ito at napapanatili ang aktibong diwa.
- source_word: מֵרִגְשַׁת
  choice: sa magulong pagtitipon
  rationale: Ipinahihiwatig ng רִגְשָׁה ang maingay o mapoot na pagkakagulo at maaari ring tumukoy sa nagkakatipong karamihan. Sinasaklaw ng “magulong pagtitipon” ang dalawang aspektong ito.
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Literal itong tumutukoy sa mga gumagawa ng אָוֶן. Ang “mga gumagawa ng kasamaan” ay kasalukuyan, malinaw, at pinananatili ang aktibo o nakagawiang paggawa.
