base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: tl
  text: Kaya matatakot ang lahat ng tao[a] at ipahahayag nila ang ginawa ng Diyos; mauunawaan nila ang kanyang gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat tao” o “buong sangkatauhan.” Ang Hebreo ay may pariralang “kol adam,” na literal na “lahat ng tao”; kolektibo itong tumutukoy sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: matatakot
  rationale: Ang ירא ay maaaring magpahiwatig ng takot at pagpipitagan. Sa konteksto ng hayag na paghatol ng Diyos, pinananatili ng “matatakot” ang pangunahing puwersa ng salita nang hindi inaalis ang posibilidad ng mapitagang sindak.
- source_word: כָּל אָדָם
  choice: ang lahat ng tao
  rationale: Ang אָדָם ay kolektibong tumutukoy sa sangkatauhan, hindi lamang sa mga lalaking indibidwal. Likas at malinaw sa modernong Tagalog ang “lahat ng tao.”
- source_word: וַיַּגִּידוּ
  choice: ipahahayag nila
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam, isalaysay, o ipahayag. Ang “ipahahayag” ay angkop sa pampubliko at patotoong himig ng taludtod.
- source_word: פֹּעַל אֱלֹהִים
  choice: ang ginawa ng Diyos
  rationale: Ang פֹּעַל ay gawa o kilos. Ang “ginawa ng Diyos” ay natural sa Tagalog at tumutukoy sa tiyak na pagkilos niya sa konteksto.
- source_word: וּמַעֲשֵׂהוּ
  choice: ang kanyang gawa
  rationale: Literal itong “at ang kanyang gawa.” Pinananatili ang konkretong sanggunian sa pagkilos ng Diyos at ang bahagyang pag-uulit ng tulang Hebreo.
- source_word: הִשְׂכִּילוּ
  choice: mauunawaan nila
  rationale: Ang Hiphil ng שׂכל ay maaaring mangahulugang umunawa, magkaroon ng kabatiran, o kumilos nang may karunungan. Dahil ang layon dito ay ang gawa ng Diyos, pinakamalinaw ang “mauunawaan.”
theological_decisions:
- issue: Kolektibong kahulugan ng אָדָם
  choice: ang lahat ng tao
  alternative: bawat tao; buong sangkatauhan
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito at sumasaklaw sa mga tao sa pangkalahatan. Hindi ito dapat paliitin sa mga lalaki lamang.
- issue: Saklaw ng takot sa ירא
  choice: matatakot
  alternative: magkakaroon ng pagpipitagan; masisindak
  rationale: Hindi nilulutas nang labis ang tensiyon sa pagitan ng pangamba dahil sa paghatol at mapitagang pagkilala sa Diyos. Ang “matatakot” ang pinakadirekta at malawak na katumbas sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Kaya” upang ipakita ang bunga ng naunang pagkilos ng Diyos; iniwasan ang labis na teknikal o denominasyonal na pananalita.
