translation:
  language: tl
  text: upang tudlaan mula sa mga taguan[a] ang taong walang kapintasan[b]; bigla nila siyang tinutudla at hindi sila natatakot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga lihim na lugar.” Literal na “sa” ang pang-ukol sa Hebreo, ngunit ipinahihiwatig ng konteksto na umaatake sila mula sa nakakubling mga puwesto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang taong walang sala.” Ang salitang Hebreo ay maaaring tumukoy sa moral na integridad o kawalang-sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: upang tudlaan
  rationale: Sa kontekstong naglalarawan ng pananambang, ang ירה ay tumutukoy sa pagpapakawala ng pantudla. Ang “tudlaan” ay likas at marangal sa makatang Tagalog at umiiwas sa makabagong pahiwatig ng baril.
- source_word: בַּמִּסְתָּרִים
  choice: mula sa mga taguan
  rationale: Ang pangngalan ay tumutukoy sa mga lihim o nakakubling lugar. Bagaman literal na “sa loob ng mga taguan,” malinaw na ipinahihiwatig ng konteksto ang pinagmumulan ng palihim na pagtudla.
- source_word: תָּם
  choice: ang taong walang kapintasan
  rationale: Ipinahahayag ng תם ang integridad o kawalang-sala. Pinananatili ng “walang kapintasan” ang moral na diwa nang hindi sinasabing ganap na walang kasalanan ang tinutukoy.
- source_word: פִּתְאֹם
  choice: bigla
  rationale: Tuwirang ipinahahayag nito ang di-inaasahan at mabilis na paglusob.
- source_word: יֹרֻהוּ
  choice: nila siyang tinutudla
  rationale: Tumutukoy ang panlalaking isahang hulapi sa taong walang kapintasan. Ang pandiwang “tinutudla” ay nagpapanatili sa larawang makata ng pag-atake at hindi nagpapasok ng makabagong baril.
- source_word: וְלֹא יִירָאוּ
  choice: at hindi sila natatakot
  rationale: Pinananatili nito ang maikli at walang tahasang layon na pahayag ng Hebreo; hindi idinaragdag kung kanino o saan sila hindi natatakot.
