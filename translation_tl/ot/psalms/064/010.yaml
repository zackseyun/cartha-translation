  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: tl
  text: Magagalak kay Yahweh ang matuwid at maghahanap ng kanlungan sa kanya; magbubunyi[a] ang lahat ng may pusong matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magmamalaki.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagmamalaki o masayang pagbubunyi; positibo ang diwa nito sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: magagalak
  rationale: Ang imperfect ay nauunawaan dito bilang inaasahang magiging tugon matapos ang pagliligtas at paghatol ng Diyos; likas at marangal sa Filipino ang “magagalak.”
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Ang pang-isahang pang-uri ay ginamit bilang pangngalan at kumakatawan sa taong matuwid; hindi na kailangang idagdag ang “lalaki” o “tao” sa Filipino.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ipinapakita ng pang-ukol ang pinagtutuunan ng kagalakan, at tuwirang pinananatili ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: וְחָסָה בּוֹ
  choice: at manganganlong sa kanya
  rationale: Pinananatili ng “manganganlong” ang larawan ng paghahanap ng kanlungan at proteksiyon, sa halip na paliitin ito sa pangkalahatang pagtitiwala lamang.
- source_word: וְיִתְהַלְלוּ
  choice: magmamalaki
  rationale: Ang hitpael ng הלל ay maaaring mangahulugang magmalaki, magbunyi, o magdiwang. Pinananatili ng “magmamalaki” ang kapansin-pansing leksikal na puwersa, habang nililinaw ng talababa ang positibong diwa sa konteksto.
- source_word: יִשְׁרֵי לֵב
  choice: mga may matuwid na puso
  rationale: Natural itong modernong Filipino para sa idyomang Hebreo tungkol sa mga taong matuwid ang panloob na disposisyon, habang pinananatili ang metapora ng puso.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Positibo ngunit maaaring ambiguwong diwa ng התהלל
  choice: magmamalaki
  alternative: magbubunyi / magdiriwang
  rationale: Hindi tinutukoy nang tahasan sa sugnay ang bagay ng pagmamalaki. Pinananatili ng salin ang leksikal na tensiyon, samantalang ipinahihiwatig ng konteksto na ang pagmamalaki ay dahil sa Diyos at sa kanyang pagliligtas, hindi sariling pagmamataas.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang pang-isahang “ang matuwid” bilang kinatawang katawagan, at ang “mga may matuwid na puso” para sa malinaw at karaniwang ayos ng pangungusap. Pinanatili ang pangalang Yahweh at ang metapora ng panganganlong.
