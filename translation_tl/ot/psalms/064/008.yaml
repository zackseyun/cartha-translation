  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: tl
  text: Sila’y pinatitisod[a]; laban sa kanila ang sarili nilang dila; napapailing[b] ang lahat ng nakakakita sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasalin, “Pinatisod siya/iyon ng dila nila sa kanila.” Mahirap tiyakin ang ugnayan ng mga panghalip sa unang sugnay sa Hebreo, kaya magkakaiba ang mga salin. Sinusunod ng pangunahing teksto ang diwang ang masasama ay napapahamak dahil sa sarili nilang pananalita.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang pandiwa bilang “umiiling,” “nangingilabot,” o, sa ilang konteksto, “lumalayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: Sila'y ibinubuwal
  rationale: Ang Hiphil ng כשׁל ay may diwang ‘magpatisod’ o ‘magpabagsak.’ Bagaman 3ms ang hulaping Hebreo (‘siya/iyon’), mahirap ang sintaks ng taludtod at kolektibo ang pinakamalinaw na diwa sa konteksto. Pinananatili ng pasibong anyo ang hindi tiyak na tagaganap.
- source_word: עָלֵימוֹ
  choice: laban sa kanila
  rationale: Ang על na may panghalip na hulapi ay maaaring mangahulugang ‘sa ibabaw nila’ o ‘laban sa kanila.’ Ang ‘laban sa kanila’ ay natural sa Filipino at angkop sa larawan ng sarili nilang pananalitang bumabalik sa kanila.
- source_word: לְשׁוֹנָם
  choice: ang sarili nilang dila
  rationale: Pinanatili ang kongkretong larawang ‘dila’ sa halip na gawing abstraktong ‘pananalita.’ Idinagdag ang ‘sarili’ upang malinaw na ang dila nila mismo ang laban sa kanila, ayon sa diwa ng konteksto.
- source_word: יִתְנֹדֲדוּ
  choice: napapailing
  rationale: Maaaring tumukoy ang נוד sa pag-iling, pag-uga, pangingilabot, paglayo, o paglalagalag. Sa kontekstong nakikita ng mga nagmamasid ang sinapit nila, natural na ipinahahayag ng ‘napapailing’ ang nakikitang reaksiyon nang hindi itinatakda kung ito ay pagkutya o pagkagulat.
- source_word: כָּל רֹאֵה בָם
  choice: ang lahat ng nakakakita sa kanila
  rationale: Tuwirang inililipat ang pansaklaw na כָּל at ang participial na pariralang ‘nakakakita sa kanila’ sa natural na ayos ng Filipino.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “Sila’y” para sa maindayog na anyong patula, “sarili nilang dila” upang panatilihin ang kongkretong imahen, at “napapailing” bilang natural na reaksiyong nakikita ng iba. Ang mahirap na sintaks ng Hebreo ay hindi ikinubli at inilalahad sa talababa.
