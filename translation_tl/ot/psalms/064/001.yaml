  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: tl
  text: Dinggin mo, O Diyos, ang tinig ko sa aking pagdaing[a]; ingatan mo ang buhay ko mula sa pangamba sa kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aking pagbubulay-bulay” o “sa aking pagninilay.” Ang salitang Hebreo ay maaaring tumukoy sa panloob na pag-iisip gayundin sa ipinahahayag na daing.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dinggin mo
  rationale: Tuwirang pautos na nakatuon sa Diyos. Ang “dinggin” ay likas sa marangal na panalangin at nagpapahiwatig ng pakikinig na may pagtugon.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawag sa Diyos; pinananatili ng “O” ang taimtim na himig ng panalangin.
- source_word: קוֹלִי
  choice: ang tinig ko
  rationale: Pinananatili ang kongkretong larawan ng Hebreong קוֹל sa halip na paikliin lamang bilang “ako” o “ang panalangin ko.”
- source_word: בְשִׂיחִי
  choice: sa aking pagdaing
  rationale: Sa konteksto ng paghingi ng pagliligtas laban sa kaaway, ang diwang panaghoy o daing ang pinakamalamang, ngunit inilalahad sa talababa ang tunay na posibilidad na tumukoy ito sa pagbubulay-bulay o pagninilay.
- source_word: מִפַּחַד
  choice: mula sa pangamba sa
  rationale: Ang פַּחַד ay maaaring mangahulugang takot, pangamba, o sindak. Ang “pangamba” ay natural sa Filipino at nagpapahayag ng matinding banta nang hindi labis na pinatitindi ang salita.
- source_word: אוֹיֵב
  choice: kaaway
  rationale: Pinananatili ang anyong isahan ng Hebreo, na maaari ring gamitin nang pangkalahatan o kolektibo sa tulang Hebreo.
- source_word: תִּצֹּר
  choice: ingatan mo
  rationale: Ang pandiwang נצר ay nangangahulugang bantayan, ingatan, o panatilihing ligtas. Ang “ingatan mo” ay tuwiran at natural kasama ng “buhay ko.”
- source_word: חַיָּי
  choice: ang buhay ko
  rationale: Ito ang natural na katumbas ng literal na “aking buhay,” at iniiwasang ipakahulugan ito bilang “kaluluwa.”
theological_decisions:
- issue: Kahulugan ng בְשִׂיחִי sa konteksto ng panaghoy
  choice: pagdaing
  alternative: pagbubulay-bulay o pagninilay
  rationale: Mas umaangkop sa konteksto ng banta ng kaaway ang pasalitang panaghoy, ngunit hindi tiyak na iyon lamang ang saklaw ng salitang Hebreo. Kaya pinananatili sa talababa ang posibilidad ng panloob na pagninilay.
translation_notes:
  register: Makabago ngunit marangal na Filipino para sa panalangin. Ginamit ang “dinggin” at “O Diyos” upang mapanatili ang tuwirang panawagan, habang ang natitirang pangungusap ay payak at madaling maunawaan.
