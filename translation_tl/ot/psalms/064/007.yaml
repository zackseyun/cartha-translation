translation:
  language: tl
  text: Ngunit pinana sila ng Diyos gamit ang isang palaso; bigla silang nasugatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas literal: “Ngunit pinana sila ng Diyos gamit ang isang palaso; bigla silang nagkaroon ng mga sugat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: pinana sila
  rationale: Ang Hiphil ng ירה na may hulaping 3mp ay nagsasaad na pinaputukan o pinana sila. Sa Filipino, likas at tuwiran ang pandiwang “pinana,” at pinananatili nito ang Diyos bilang kumikilos sa salaysay.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin dito para sa nag-iisang Diyos, na siyang paksa ng kilos.
- source_word: חֵץ
  choice: pinana
  rationale: Ang חֵץ ay “palaso.” Nasa pandiwang “pinana” na sa Filipino ang ideya ng paggamit ng palaso, kaya hindi na kailangang ulitin sa pangunahing teksto; inilalahad sa talababa ang mas pormal na anyo.
- source_word: פִּתְאֹם
  choice: bigla
  rationale: Tuwirang ipinapahayag ang di-inaasahan at dagliang pagdating ng hatol.
- source_word: הָיוּ מַכּוֹתָם
  choice: silang nasugatan
  rationale: Bagaman mas literal na “nangyari/dumating ang kanilang mga sugat,” ang resultang diwa ay natural na naihahayag sa Filipino bilang “nasugatan sila.”
theological_decisions:
- issue: Paglalarawan sa aktibong paghatol ng Diyos sa matulaing larawan
  choice: Panatilihing Diyos mismo ang nagpapana at sumusugat sa kanila.
  alternative: Palabnawin ang larawan bilang di-tahasang pagbaligtad lamang ng kanilang kalagayan.
  rationale: Malinaw sa Hebreo na Diyos ang paksa ng mapaghiganting kilos. Hindi dapat pahinain ang kaniyang pagkilos o dagdagan ito ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikling “pinana sila” upang mapanatili ang lakas ng tulang Hebreo; ang mas literal ngunit hindi gaanong likas na kayarian ay inilagay sa talababa.
