  text: For the choir director. A psalm of David[a].
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika. Isang salmo ni David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “akda ni David” o “para kay David.” Ang pariralang Hebreo ay maaaring tumukoy sa pagkatha, kaugnayan, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng Mga Awit, tumutukoy ang salita sa taong namamahala sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang “tagapangasiwa ng musika,” at hindi nito nililimitahan ang tungkulin sa koro lamang.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ito sa ganitong uri ng awiting panrelihiyon na may kaugnayan sa musika. Ang “salmo” ang kinikilalang katumbas sa Filipino at angkop bilang pamagat ng uri.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang panandang Hebreo na לְ sa mga pamagat ng salmo ay maaaring magpahiwatig ng pagkatha, kaugnayan, pag-aari, o pag-aalay. Pinakanatural sa Filipino ang “ni David,” habang nililinaw sa talababa ang lawak ng posibleng kahulugan.
theological_decisions:
- issue: Kahulugan ng pag-uugnay kay David sa pamagat
  choice: ni David
  alternative: “akda ni David” o “para kay David”
  rationale: Hindi tiyak na pagkatha lamang ang ipinahihiwatig ng Hebreong parirala. Iniwasan ang “akda ni David” sa pangunahing teksto upang hindi gawing mas tiyak kaysa sa orihinal ang pag-uugnay kay David.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa ng musika” sa halip na mas makitid na “direktor ng koro,” at pinanatili sa talababa ang tunay na kalabuan ng pag-uugnay kay David.
