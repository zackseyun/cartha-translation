  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: tl
  text: Lahat sila ay naghihintay sa iyo[a] na bigyan mo sila ng kanilang pagkain sa takdang panahon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumitingin sa iyo nang may pananabik” o “umaasa sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: O “sa angkop na panahon” o “sa tamang oras.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Silang lahat
  rationale: Tumutukoy ito sa kabuuan ng mga nilalang na binanggit sa konteksto at pinananatili ang diwang “lahat sila.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng parirala ang pagtutok at pagdepende sa Diyos bilang pinagmumulan ng kanilang hinihintay.
- source_word: יְשַׂבֵּרוּן
  choice: naghihintay
  rationale: Ang anyong Piel ng שׂבר ay nagpapahayag ng paghihintay na may pag-asa. Ang “naghihintay” ay tuwiran at likas, habang nililinaw ng kasunod na sugnay kung ano ang hinihintay.
- source_word: לָתֵת
  choice: na ibigay mo
  rationale: Ipinahahayag ng pawatas ang nilalaman ng kanilang paghihintay; natural itong isinasalin sa Filipino bilang “na ibigay mo.”
- source_word: אָכְלָם
  choice: ang kanilang pagkain
  rationale: Pangkalahatang tawag ito sa pagkain o panustos, kaya ang “pagkain” ay angkop sa sari-saring nilalang sa salmo at hindi lamang sa mga mandaragit.
- source_word: בְּעִתּוֹ
  choice: sa takdang panahon
  rationale: Ipinahahayag ng parirala ang angkop o itinakdang oras ng paglalaan. Ang “sa takdang panahon” ay natural sa Filipino at hindi labis na nagpapakahulugan.
theological_decisions:
- issue: Pagkalinga ng Diyos sa sangnilikha
  choice: Inilalarawan ang lahat ng nilalang bilang umaasa sa Diyos para sa kanilang pagkain, nang walang idinagdag na mas matinding wikang doktrinal kaysa sa nasa Hebreo.
  alternative: Isang mas malayang salin na tahasang nagbibigay-diin sa pagtitiwala o mapagsambang pag-asa.
  rationale: Ipinakikita ng salmo ang pagdepende ng mga nilalang sa Diyos para sa ikabubuhay. Pinananatili ng salin ang temang ito nang hindi nagdaragdag ng ideyang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang payak na estruktura at ang diwa ng may-pag-asang paghihintay, habang inilagay sa talababa ang tunay na mga alternatibong kahulugan.
