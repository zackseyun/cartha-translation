  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: tl
  text: Ginawa niya ang buwan para sa mga takdang panahon[a]; alam ng araw kung kailan ito lulubog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapanahunan” o “mga kapistahan.” Ang salitang Hebreo ay maaaring tumukoy sa mga tiyak o itinakdang panahon, kabilang ang mga panahon ng kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: Ginawa
  rationale: Karaniwang kahulugan ng Qal na עשה ang “gumawa.” Ang Diyos ang nauunawaang simuno mula sa konteksto; hindi kailangang ipakahulugang “itinalaga.”
- source_word: יָרֵחַ
  choice: ang buwan
  rationale: Tuwirang tumutukoy sa buwan bilang katawang makalangit.
- source_word: לְמוֹעֲדִים
  choice: upang palatandaan ang mga takdang panahon
  rationale: 'Ipinahahayag ng לְ ang layunin o gamit ng buwan, at pinananatili ng “mga takdang panahon” ang malawak na saklaw ng מוֹעֵד: mga itinakdang oras, kapanahunan, at mga petsa ng kapistahan. Idinagdag ang “palatandaan” bilang likas na Filipino na paglalahad ng gamit na ipinahihiwatig ng parirala.'
- source_word: שֶׁמֶשׁ
  choice: ang araw
  rationale: Karaniwang salin ng salitang tumutukoy sa araw.
- source_word: יָדַע
  choice: alam
  rationale: 'Pinananatili ang literal at patulang pagsasatao: ang araw ay “nakaaalam,” sa halip na gawing purong paliwanag tungkol sa galaw nito.'
- source_word: מְבוֹאוֹ
  choice: kung kailan ito lulubog
  rationale: Bagaman literal na may diwang “pagpasok” ang מָבוֹא, kapag araw ang tinutukoy ay nangangahulugan itong paglubog. Ang “kung kailan ito lulubog” ay natural sa Filipino at umaangkop sa pandiwang “alam.”
theological_decisions:
- issue: Saklaw ng מוֹעֲדִים sa konteksto ng kaayusan ng paglikha
  choice: mga takdang panahon
  alternative: mga kapanahunan; mga kapistahan
  rationale: Ang buwan ay kaugnay ng pagtatakda ng mga panahon at petsa, kabilang ang mga kapistahan, ngunit hindi hinihingi ng talata na limitahan ang salita sa alinman sa mga ito. Pinananatili ng malawak na salin ang tunay na semantikong saklaw.
- issue: Patulang pagsasatao sa יָדַע
  choice: alam ng araw kung kailan ito lulubog
  alternative: may takdang paglubog ang araw
  rationale: Pinananatili ng napiling salin ang larawan sa Hebreo na ang araw ay “nakaaalam,” sa halip na alisin ang pagsasatao at gawing tahasang pahayag lamang tungkol sa itinakdang kaayusan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang pagsasatao ng araw, habang ginawang likas sa Tagalog ang layuning ipinahihiwatig ng parirala tungkol sa buwan.
