id: PSA.104.24
reference: Psalms 104:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: tl
  text: Napakarami ng iyong mga gawa, O Yahweh! Ginawa mo silang lahat nang may karunungan; ang lupa ay punô ng iyong mga nilalang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong mga pag-aari” o “lahat ng pag-aari mo.” Ang salitang Hebreo ay maaaring tumukoy sa anumang pag-aari o natamo; sa kontekstong ito, malawak itong maaaring tumukoy sa mga bagay na ginawa ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: Napakarami
  rationale: Ipinahahayag ng pinagsamang mga salita ang paghanga sa dami at pagkakaiba-iba ng mga gawa ng Diyos; natural at masigla ito sa makabagong Tagalog.
- source_word: מַעֲשֶׂיךָ
  choice: iyong mga gawa
  rationale: Tuwirang katumbas ito na angkop sa konteksto ng paglikha at hindi lamang tumutukoy sa mga kilos sa kasaysayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כֻּלָּם
  choice: silang lahat
  rationale: Malinaw na tumutukoy pabalik sa lahat ng mga gawa at pinananatili ang kabuuang saklaw.
- source_word: בְּחָכְמָה
  choice: nang may karunungan
  rationale: Pinananatili ang pangngalang 'karunungan' at ipinapahayag ang paraan ng paggawa ng Diyos sa natural na Tagalog.
- source_word: עָשִׂיתָ
  choice: Ginawa mo
  rationale: Payak at tuwirang salin ng ganap na pagkilos sa Hebreo; ang kasalukuyang kalagayan ng sangnilikha ay malinaw sa kasunod na linya.
- source_word: מָלְאָה הָאָרֶץ
  choice: ang lupa ay punô
  rationale: Ipinapahayag ang resultang kalagayan ng Hebreong perfect at ang pandaigdigang kahulugan ng הָאָרֶץ sa awit ng paglikha.
- source_word: קִנְיָנֶךָ
  choice: iyong mga nilalang
  rationale: Sa konteksto ng mga gawa ng paglikha, ito ang pinakanatural na salin, ngunit mas makitid kaysa sa literal na diwa ng bagay na pag-aari o natamo; kaya nilagyan ng talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan ang Tetragrammaton sa Hebreo; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng קִנְיָנֶךָ
  choice: iyong mga nilalang
  alternative: iyong mga pag-aari; lahat ng pag-aari mo
  rationale: Itinuturo ng konteksto ang mga nilikha ng Diyos, ngunit hindi ganap na nilulutas ang leksikal na diwa ng pag-aari o natamo; pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang masiglang padamdam na “Napakarami” at ang natural na “nang may karunungan,” habang pinanatili sa talababa ang kalabuan ng huling salitang Hebreo.
