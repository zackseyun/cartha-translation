  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: tl
  text: Nawa'y kalugdan niya ang aking pagbubulay-bulay[a]; ako'y magagalak kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nawa'y maging matamis sa kanya ang aking pagbubulay-bulay,” o “maging katanggap-tanggap sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: kalugdan
  rationale: Ipinapahayag ng Qal na pandiwa ang pagiging kaaya-aya, matamis, o katanggap-tanggap. Ang “kalugdan” ay likas at marangal na pananalangin na maging kasiya-siya sa Diyos ang pagbubulay ng salmista.
- source_word: עָלָיו
  choice: niya
  rationale: Sa konstruksyong kasama ng ערב, tinutukoy ng עַל at hulaping 3ms ang Diyos bilang siyang nakalulugod o tumatanggap; natural itong naipahahayag sa Filipino sa aktibong anyong “kalugdan niya.”
- source_word: שִׂיחִי
  choice: aking pagbubulay-bulay
  rationale: Maaaring tumukoy ang שִׂיחַ sa pagninilay, pagbubulay, o pananalita. Sa kontekstong mapagsamba ng salmo, ang “pagbubulay-bulay” ang pinakamalinaw habang hindi nililimitahan sa tahimik na pag-iisip lamang.
- source_word: אָנֹכִי
  choice: ako'y
  rationale: May bahagyang diin ang malayang panghalip. Pinananatili ng tahasang “ako'y” ang diin nang hindi nagiging mabigat ang tula.
- source_word: אֶשְׂמַח
  choice: magagalak
  rationale: Ang imperfect ay maaaring magpahayag ng pasiya o nagpapatuloy na disposisyon. Ang “magagalak” ay nagpapanatili sa hinaharap o mapagpasiyang himig.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang בְּ ay tumutukoy sa Diyos bilang pinagmumulan o layon ng kagalakan. Sa natural na Filipino, “magagalak kay Yahweh” ang malinaw na katumbas; pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung ang unang linya ay pag-asang malugod ang Diyos o pahayag na likas na matamis ang pagbubulay
  choice: Nawa'y kalugdan niya
  alternative: Nawa'y maging matamis sa kanya / katanggap-tanggap sa kanya
  rationale: Ang jussive na gamit ng imperfect ay natural na panalangin o hangarin. Hindi nito ipinapalagay na tiyak nang tinanggap ng Diyos ang pagbubulay, kaya napapanatili ang mapagpakumbabang himig.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Ginamit ang “pagbubulay-bulay” bilang madaling maunawaang salitang panrelihiyon, at ang pinaikling “Nawa'y” at “ako'y” upang mapanatili ang maindayog na anyo.
