  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: tl
  text: Doon naglalayag ang mga barko, at naroon ang Leviatan na iyong hinubog upang maglaro sa dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Leviatan na iyong hinubog upang makipaglaro ka rito.” Maaaring unawain ang pangwakas na parirala na ang Diyos ang makikipaglaro sa Leviatan, sa halip na ang Leviatan ang maglaro sa dagat.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: Tumutukoy ito sa dagat na binanggit sa naunang talata; payak at likas ang “Doon” sa makabagong Filipino.
- source_word: אֳנִיּוֹת יְהַלֵּכוּן
  choice: naglalayag ang mga barko
  rationale: Sa konteksto ng dagat, likas na ipinahahayag ng “naglalayag” ang patuloy na paggalaw ng mga sasakyang-dagat.
- source_word: לִוְיָתָן
  choice: Leviatan
  rationale: Pinanatili bilang transliteradong katawagan upang maingatan ang makatang at intertekstuwal na bisa ng pangalang Hebreo.
- source_word: זֶה יָצַרְתָּ
  choice: na iyong hinubog
  rationale: Ginawang sugnay na panuring ang literal na “ito na hinubog mo”; pinananatili ng “hinubog” ang kongkretong diwa ng יצר.
- source_word: לְשַׂחֶק
  choice: upang maglaro
  rationale: Malinaw at kasalukuyang katumbas ito ng masigla at mapaglarong kilos na inilalarawan ng infinitibo.
- source_word: בּוֹ
  choice: sa dagat
  rationale: Ang panlalaking panghalip ay pinakamalamang na bumabalik sa “dagat” ng naunang talata. Inulit ang pangngalan sa Filipino upang maging malinaw ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng בּוֹ at ang ugnayan nito sa “maglaro”
  choice: Hinubog ang Leviatan upang maglaro sa dagat.
  alternative: Hinubog ang Leviatan upang paglaruan o kalaruin ng Diyos.
  rationale: Ang dagat ang agarang konteksto at lokasyon kapuwa ng mga barko at ng Leviatan, kaya ito ang pinakamadaling pagbasa. Gayunman, maaaring unawain ang pangwakas na parirala bilang paglalaro ng Diyos sa Leviatan o kasama nito; pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “barko” at “naglalayag” bilang karaniwang mga salita, habang pinanatili ang “Leviatan” bilang biblikal na katawagan. Ang “naroon” ay idinagdag para sa natural na koordinasyon at upang malinaw na ilagay ang Leviatan sa tagpo ng dagat.
