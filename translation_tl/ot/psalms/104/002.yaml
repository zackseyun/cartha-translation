translation:
  language: tl
  text: 'Binabalot mo ang iyong sarili ng liwanag na gaya ng isang kasuotan;

    inuunat mo ang kalangitan na parang tabing[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “telang pantolda.” Ang salitang Hebreo ay maaaring tumukoy sa isang telang ginagamit na tabing sa tolda o sa sagradong tolda.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: Binabalot mo ang iyong sarili
  rationale: Ang Qal participle ay naglalarawan nang buhay sa patuloy na kilos. Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang larawang ang Diyos mismo ang nababalot.
- source_word: אוֹר
  choice: ng liwanag
  rationale: Tuwirang katumbas ito ng pangngalang Hebreo at pinananatili ang liwanag bilang metaporikal na ipinambabalot, sa halip na palitan ito ng interpretasyong gaya ng ‘ningning’ o ‘karangyaan.’
- source_word: כַשַּׂלְמָה
  choice: na gaya ng isang kasuotan
  rationale: Malawak ang saklaw ng שַׂלְמָה bilang damit o balabal. Ang ‘kasuotan’ ay marangal at hindi nagpapakipot sa larawan sa isang tiyak na uri ng damit.
- source_word: נוֹטֶה
  choice: inuunat mo
  rationale: Ipinahahayag nito ang pag-uunat o paglaladlad sa isang bagay at pinananatili ang masiglang aspektong di-ganap ng Hebreong participle.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Natural na katumbas sa Tagalog para sa Hebreong tumutukoy sa langit o mga langit sa malawak na larawan ng paglikha.
- source_word: כַיְרִיעָה
  choice: na parang tabing
  rationale: Ang יְרִיעָה ay isang nakaladlad na telang tabing, madalas sa tolda. Maikli at natural ang ‘tabing’; inilalahad sa talababa ang tunay na kahulugang pantolda.
theological_decisions:
- issue: Ang makataong larawan ng Diyos na binabalot ang sarili ng liwanag at nag-uunat ng kalangitan
  choice: Tuwirang pinanatili ang matalinghagang paglalarawan.
  alternative: Ipaliwanag bilang ‘napalilibutan ka ng liwanag’ o ‘ipinapakita mo ang liwanag bilang iyong karangyaan.’
  rationale: Ang taludtod ay gumagamit ng matingkad na tula upang ilarawan ang kadakilaan at kapangyarihang lumikha ng Diyos. Ang pagpapanatili sa metapora ay umiiwas sa pagpasok ng paliwanag na wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang aspektong di-ganap na ‘binabalot’ at ‘inuunat’ upang maipakita ang magkasunod na participle ng Hebreo at mapanatili ang buhay na paglalarawang patula.
