lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Sa ibabaw ng mga iyon
  rationale: Pinananatili nito ang kahulugang 'sa ibabaw/itaas ng mga iyon,' na tumutukoy sa mga tubig na binanggit sa naunang talata, nang hindi ito ginagawang mas malabong 'sa tabi ng mga iyon.'
- source_word: עוֹף הַשָּׁמַיִם
  choice: ang mga ibon sa langit
  rationale: Likas itong Filipino para sa kolektibong pariralang tumutukoy sa mga ibong lumilipad, habang pinananatili ang makatang pagtukoy sa langit.
- source_word: יִשְׁכּוֹן
  choice: naninirahan
  rationale: Ipinahahayag nito ang diwa ng paninirahan o pagtahan nang hindi ipinapalagay na tahasang pamumugad ang tinutukoy.
- source_word: מִבֵּין
  choice: mula sa gitna ng
  rationale: Natural na ipinahahayag sa Filipino ang pinagmumulan ng tinig mula sa loob o pagitan ng mga sanga.
- source_word: עֳפָאיִם
  choice: mga sanga
  rationale: Ito ang pinakamalinaw na salin sa konteksto, ngunit bihira at hindi ganap na tiyak ang salitang Hebreo, kaya inilalahad sa talababa ang iba pang posibilidad.
- source_word: יִתְּנוּ קוֹל
  choice: ipinapahayag nila ang kanilang tinig
  rationale: Pinananatili ang literal at makatang idyomang 'nagbibigay ng tinig' nang hindi ito nililimitahan sa 'umaawit,' na mas tiyak kaysa sa Hebreo.
