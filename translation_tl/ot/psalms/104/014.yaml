id: PSA.104.14
reference: Psalms 104:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: tl
  text: 'Pinatutubo niya ang damo para sa mga alagang hayop,

    at ang mga halaman para sa gawain ng tao[a],

    upang maglabas ng tinapay mula sa lupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa gawain ng sangkatauhan.” Generic o kumakatawan sa lahat ng tao ang Hebreong אָדָם.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: Pinatutubo niya
  rationale: Pinananatili ng anyong causative ang diwang ang Diyos ang nagpapasibol at nagpapalago, habang natural ang pahayag sa makabagong Tagalog.
- source_word: חָצִיר
  choice: damo
  rationale: Sa konteksto, tumutukoy ito sa halamang kinakain ng mga hayop; malinaw at karaniwan ang “damo.”
- source_word: לַבְּהֵמָה
  choice: para sa mga alagang hayop
  rationale: Ang בְּהֵמָה ay kolektibong tumutukoy rito sa mga domestikadong hayop na nanginginain. Mas malawak at mas natural sa Tagalog ang “mga alagang hayop” kaysa “mga baka.”
- source_word: וְעֵשֶׂב
  choice: at ang mga halaman
  rationale: Mas malawak ang עֵשֶׂב kaysa sa mga halamang-gamot lamang; pinananatili ng “mga halaman” ang saklaw nito.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: para sa gawain ng tao
  rationale: Ang עֲבֹדָה ay maaaring tumukoy sa paggawa, paglilingkod, paggamit, o paglilinang. Hindi nililimitahan ng saling ito ang parirala sa pagsasaka lamang at pinananatili ang kaiklian at bahagyang kalabuan ng Hebreo.
- source_word: הָאָדָם
  choice: tao
  rationale: Generic o kumakatawan sa buong sangkatauhan ang אָדָם rito. Sa Tagalog, likas na maaaring tumukoy ang “tao” sa sinumang tao o sa sangkatauhan nang hindi kinakailangang tukuyin ang kasarian.
- source_word: לְהוֹצִיא
  choice: upang maglabas
  rationale: Pinananatili nito ang causative na ideya ng paglalabas o pagpapalabas at ang posibleng ugnayang layunin o bunga ng infinitive.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Bagaman maaari ring mangahulugan ng pagkain sa mas malawak na gamit, “tinapay” ang tuwirang kahulugan at angkop sa larawang agrikultural.
- source_word: מִן הָאָרֶץ
  choice: mula sa lupa
  rationale: Ang lupa ang inilalarawang pinagmumulan ng ani; natural at tapat sa konteksto ang parirala.
theological_decisions:
- issue: Generic na kahulugan ng הָאָדָם
  choice: tao
  alternative: sangkatauhan
  rationale: Ang singular na אָדָם ay kumakatawan dito sa mga tao sa pangkalahatan. Ang “tao” ay source-shaped at natural na generic sa Tagalog; ibinibigay sa talababa ang mas hayagang kolektibong alternatibo.
- issue: Ugnayan ng mga halaman sa עֲבֹדַת הָאָדָם
  choice: para sa gawain ng tao
  alternative: upang linangin ng tao
  rationale: Maaaring unawain ang parirala bilang mga halamang kaugnay ng paggawa, paggamit, o paglilinang ng tao. Iniiwasan ng pangunahing teksto na ipako ito sa pagsasaka lamang.
translation_notes:
  register: Makabago, marangal, at patulang Tagalog. Pinanatili ang tatlong linyang daloy, ang causative na kilos ng Diyos, at ang bahagyang kalabuan ng pariralang tumutukoy sa gawain ng tao.
