  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: tl
  text: Naroon ang dagat—malaki at napakalawak[a]. Doon ay hindi mabilang ang mga nilalang na gumagalaw—mga nilalang na may buhay, maliliit at malalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “malawak ang mga kamay,” isang idyomang tumutukoy sa napakalawak na abot o lawak.
    reason: cultural_note
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: Naroon ang dagat
  rationale: Ang deiktikong זֶה ay nagtatanghal sa dagat bilang tanawin; natural na naipapahayag ito sa Tagalog sa pamamagitan ng “Naroon ang dagat.”
- source_word: גָּדוֹל
  choice: malaki
  rationale: Tuwirang ipinahahayag ang laki ng dagat at pinananatili ang marangal na himig ng tula.
- source_word: וּרְחַב יָדַיִם
  choice: at napakalawak[a]
  rationale: Ang literal na idyomang “malawak ang mga kamay” ay hindi natural sa Tagalog; ipinahahayag ng “napakalawak” ang diwang malapad ang abot o lawak sa magkabilang panig, habang ipinaliliwanag sa talababa ang larawan ng Hebreo.
- source_word: שָׁם
  choice: Doon
  rationale: Tumutukoy ang pang-abay na panlunan sa dagat na kababanggit lamang.
- source_word: רֶמֶשׂ
  choice: mga nilalang na gumagalaw
  rationale: Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa mga gumagapang o nagkukuyog na nilalang; hindi ito nililimitahan ng salin sa isang uri ng hayop-dagat.
- source_word: וְאֵין מִסְפָּר
  choice: hindi mabilang
  rationale: Natural at malinaw na katumbas ng idyomang nangangahulugang walang makabilang sa dami.
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: mga nilalang ... maliliit man o malalaki
  rationale: Ang “mga nilalang” ay nagpapahayag ng buhay na mga nilalang, at ang pares na “maliliit man o malalaki” ay natural na inklusibong paghahambing sa Tagalog.
