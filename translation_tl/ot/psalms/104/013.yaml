  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: tl
  text: Dinidiligan niya ang mga bundok mula sa kanyang mga silid sa itaas; nabubusog ang lupa sa bunga ng iyong mga gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa bunga ng iyong mga gawa.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng pinagmulan o paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Dinidiligan niya
  rationale: Ang Hiphil participle ng שׁקה ay ginawang likas na pandiwang Filipino. Ipinahihiwatig ng konteksto na ang Diyos ang gumagawa.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Ito ang karaniwang kahulugan ng הָרִים at pinananatili ang tiyak na anyo.
- source_word: מֵעֲלִיּוֹתָיו
  choice: mula sa kanyang mga silid sa itaas
  rationale: Pinananatili nito ang larawang arkitektural ng mga silid sa itaas sa kosmikong tahanan ng Awit 104, pati ang panghalip na ikatlong panauhan.
- source_word: מִפְּרִי
  choice: sa bunga ng
  rationale: Maaaring ipahayag ng מִן ang pinagmulan o ang paraang nagdudulot ng pagkabusog; likas sa Filipino ang 'sa bunga ng' at hindi nito labis na nililinaw ang ugnayan.
- source_word: מַעֲשֶׂיךָ
  choice: iyong mga gawa
  rationale: Malawak ang 'mga gawa' upang saklawin ang malikhaing pagkilos ng Diyos at pinananatili ang ikalawang panauhan ng Hebreo.
- source_word: תִּשְׂבַּע
  choice: nabubusog
  rationale: Ipinahahayag nito ang pagkapuno o pagkasapat na tinutukoy ng שׂבע, sa natural at marangal na Filipino.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa agarang konteksto ng pagdidilig at bunga, natural ang 'lupa' habang maaari pa ring tumukoy sa daigdig bilang lupain.
theological_decisions:
- issue: Hindi tahasang binanggit ang simuno ng unang sugnay
  choice: Dinidiligan niya ang mga bundok
  alternative: Dinidiligan ang mga bundok
  rationale: Malinaw sa nakapaligid na konteksto na Diyos ang simuno. Ang 'niya' ay nagbibigay ng likas na Filipino nang hindi nagdaragdag ng bagong teolohikong pahayag.
- issue: Paglipat mula ikatlong panauhan tungo sa ikalawang panauhan
  choice: kanyang ... iyong
  alternative: iyong ... iyong
  rationale: 'Pinananatili ang tunay na pagbabago ng panauhan sa Hebreo: מֵעֲלִיּוֹתָיו ay ''kanyang,'' samantalang מַעֲשֶׂיךָ ay ''iyong.'' Hindi ito pinapantay upang mapanatili ang anyo at tensiyon ng teksto.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawang 'mga silid sa itaas' at ang pagbabago mula ikatlo tungo sa ikalawang panauhan. Inilagay ang marker [a] sa hulihan ng ikalawang sugnay, kung saan naroon ang aktuwal na leksikal na alternatibo.
