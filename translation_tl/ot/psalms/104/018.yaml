base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: tl
  text: Ang matataas na bundok ay para sa mga kambing-gubat[a]; ang mga bato ay kanlungan ng mga hyrax[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ibex,” mga ligaw na kambing sa kabundukan.
    reason: lexical_alternative
  - marker: b
    text: Ang hyrax ay isang maliit na hayop na naninirahan sa mababatong lugar.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: matataas na bundok
  rationale: Likas at tuwirang salin ng pariralang tumutukoy sa mataas na lupaing tirahan ng mga hayop.
- source_word: לַיְּעֵלִים
  choice: para sa mga kambing-gubat
  rationale: Ang יָעֵל ay kambing na ligaw na naninirahan sa kabundukan, karaniwang kinikilalang ibex. Mas madaling maunawaan ng karaniwang mambabasa ang “kambing-gubat,” habang inilalahad sa talababa ang mas tiyak na katawagan.
- source_word: סְלָעִים
  choice: mga bato
  rationale: Pinananatili ang payak at malawak na kahulugan ng mga batong pormasyon, nang hindi ito nililimitahan sa bangin o talampas.
- source_word: מַחְסֶה
  choice: kanlungan
  rationale: Ipinahahayag nito ang isang lugar na nagbibigay ng proteksiyon at angkop sa marangal na himig ng salmo.
- source_word: לַשְׁפַנִּים
  choice: ng mga hyrax
  rationale: Ang שָׁפָן ay karaniwang kinikilalang hyrax, isang maliit na hayop na naninirahan sa mababatong lugar. Iniiwasan ng katawagang ito ang mapanlinlang na paghahambing dito sa kuneho o badger.
