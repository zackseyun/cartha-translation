translation:
  language: tl
  text: Sumisikat ang araw; bumabalik sila at humihiga sa kanilang mga lungga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tirahan” o “mga silungan.” Ang salitang Hebreo ay tumutukoy sa isang tahanan o tirahan; sa konteksto ng mga hayop, ang “mga lungga” ang pinakamalinaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: Sumisikat
  rationale: Ang Qal imperfect ng זרח, na ang paksa ay ang araw, ay tumutukoy sa pagsikat nito; natural at malinaw sa modernong Tagalog ang “sumisikat.”
- source_word: הַשֶּׁמֶשׁ
  choice: ang araw
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: יֵאָסֵפוּן
  choice: nagsisiuwi sila
  rationale: Maaaring passive o reflexive/intransitive ang Niphal ng אסף. Sa konteksto ng mga hayop na bumabalik pagsikat ng araw, ipinahahayag ng “nagsisiuwi” ang sama-samang pag-urong o pagbabalik nang hindi nagpapahiwatig ng panlabas na tagapagtipon.
- source_word: וְאֶל מְעוֹנֹתָם
  choice: at ... sa kanilang mga lungga
  rationale: Literal na patungo sa kanilang mga tirahan; sa konteksto ng mga leon, ang “mga lungga” ang natural na tawag sa kanilang mga silungan.
- source_word: יִרְבָּצוּן
  choice: nahihimlay
  rationale: Ang רבץ ay karaniwang paglalarawan sa hayop na humihiga o namamahinga. Ang “nahihimlay” ay marangal at natural dito, at ipinakikitang nananatili silang nakahiga sa mga lungga.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pagkakasunod-sunod ng pagsikat ng araw, pag-uwi ng mga hayop, at paghihimlay nila. Ginamit ang “nagsisiuwi” upang likas na katawanin ang posibleng reflexive/intransitive na diwa ng יֵאָסֵפוּן nang hindi pilit na nilulutas ang anyong Niphal.
