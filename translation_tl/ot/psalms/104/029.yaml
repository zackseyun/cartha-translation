  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: tl
  text: Kapag ikinukubli mo ang iyong mukha[a], nasisindak sila; kapag binawi mo ang kanilang hininga[b], namamatay sila at bumabalik sa kanilang alabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong presensiya.” Ang Hebreong “iyong mukha” ay karaniwang pagpapahayag para sa personal na presensiya o lingap.
    reason: lexical_alternative
  - marker: b
    text: O “kanilang espiritu.” Ang Hebreong רוּחַ ay maaaring mangahulugang “hininga,” “hangin,” o “espiritu”; sa konteksto ng pagkamatay at pagbabalik sa alabok, higit na angkop dito ang “hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: ikinukubli mo
  rationale: Ang Hifil ng סתר ay nangangahulugang magkubli o magtago. Likas at marangal sa makabagong Tagalog ang “ikinukubli mo,” at pinananatili nito ang larawan ng pag-urong ng lingap o presensiya ng Diyos.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Literal itong “iyong mukha.” Pinananatili ang kongkretong larawang Hebreo, habang nililinaw sa talababa na maaari itong tumukoy sa personal na presensiya o lingap.
- source_word: יִבָּהֵלוּן
  choice: nasisindak sila
  rationale: Ang Niphal ng בהל ay nagpapahayag ng matinding pagkagulat, pangamba, o pagkabalisa. Ang “nasisindak” ay natural at sapat ang lakas sa konteksto.
- source_word: תֹּסֵף
  choice: binawi mo
  rationale: Ang אסף ay maaaring mangahulugang tipunin, alisin, o bawiin. Sa konteksto ng buhay at kamatayan, malinaw na ipinahihiwatig ng “binawi” ang pag-aalis ng hiningang nagbibigay-buhay.
- source_word: רוּחָם
  choice: ang kanilang hininga
  rationale: Ang רוּחַ ay maaaring mangahulugang hininga, hangin, o espiritu. Dahil kasunod nito ang pagkamatay at pagbabalik sa alabok, “hininga” ang pinakaangkop, ngunit pinananatili sa talababa ang alternatibong “espiritu.”
- source_word: יִגְוָעוּן
  choice: namamatay sila
  rationale: Ang גוע ay nangangahulugang malagutan ng buhay o mamatay. Ang “namamatay” ang pinakatuwiran at natural na katumbas sa Tagalog.
- source_word: עֲפָרָם
  choice: kanilang alabok
  rationale: May hulaping paari ang Hebreo, kaya pinananatili ang “kanilang.” Ang “alabok” ay nag-iingat sa alusyon sa pagkalalang at mortalidad.
- source_word: יְשׁוּבוּן
  choice: bumabalik
  rationale: Ang שוב ay “bumalik.” Ang anyong ito ay natural sa pangungusap at pinananatili ang pamilyar na larawan ng pagbabalik sa alabok.
theological_decisions:
- issue: Kahulugan ng רוּחָם sa konteksto ng paglikha at kamatayan
  choice: kanilang hininga
  alternative: kanilang espiritu
  rationale: Ang talata ay naglalarawan sa mga nilalang na nawawalan ng nagbibigay-buhay na hininga, namamatay, at bumabalik sa alabok. Hindi nito sapilitang nilulutas ang mas malawak na usapin tungkol sa kalikasan ng espiritu; nakatala ang lehitimong alternatibo sa talababa.
- issue: Antropomorpikong pananalita tungkol sa mukha ng Diyos
  choice: ang iyong mukha
  alternative: ang iyong presensiya
  rationale: Pinananatili ang matingkad na larawang Hebreo sa halip na gawing abstrakto. Ipinakikita ng talababa ang idyomatikong diwang presensiya o lingap nang hindi inaalis ang orihinal na larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawang “mukha” at ang possessibong “kanilang alabok.” Ginamit ang pares na “kapag” upang maipahayag ang dalawang magkakaugnay na kilos at bunga nang natural sa Tagalog.
