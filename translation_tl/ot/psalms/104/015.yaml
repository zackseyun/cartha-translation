  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: tl
  text: 'at alak na nagpapasaya sa puso ng tao,

    na nagpapakinang sa mukha nang higit kaysa langis[a],

    at tinapay na nagpapalakas sa puso ng tao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nagpapakinang sa mukha sa pamamagitan ng langis.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang paghahambing (“nang higit kaysa langis”) o ang kasangkapan/pinagmulan (“sa pamamagitan ng/mula sa langis”).
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַיִן
  choice: at alak
  rationale: Ang יַיִן ay alak na mula sa ubas; sa konteksto ng salmo, sapat at natural sa Filipino ang pangkalahatang salitang “alak.”
- source_word: יְשַׂמַּח
  choice: na nagpapasaya
  rationale: Ang Piel ng שׂמח ay nagsasaad ng pagdudulot ng galak. Pinananatili ng “nagpapasaya” ang sanhiang diwa at natural itong pakinggan.
- source_word: לְבַב אֱנוֹשׁ
  choice: sa puso ng tao
  rationale: Ang לְבַב ay tumutukoy sa panloob na buhay o kalooban, at ang אֱנוֹשׁ ay kinatawang isahan para sa mortal na sangkatauhan. Likas na naipahahayag ito ng “puso ng tao” nang walang pagtatakda sa kasarian.
- source_word: לְהַצְהִיל פָּנִים
  choice: na nagpapakinang sa mukha
  rationale: Ipinahahayag ng pandiwang anyo ang pagpapaliwanag o pagpapakinang. Ang “nagpapakinang sa mukha” ay malinaw, makata, at napapanatili ang larawan ng nagliliwanag na mukha.
- source_word: מִשָּׁמֶן
  choice: nang higit kaysa langis
  rationale: 'Binasa ang מִן bilang paghahambing: higit kaysa langis. Posible rin ang kahulugang kasangkapan o pinagmulan, kaya itinala ang alternatibo sa talababa.'
- source_word: וְלֶחֶם
  choice: at tinapay
  rationale: Ang לֶחֶם ay literal na “tinapay” at tumutukoy rito sa pangunahing pagkain; hindi kailangang palawakin sa “pagkain.”
- source_word: יִסְעָד
  choice: na nagpapalakas
  rationale: Ang סעד ay nangangahulugang umalalay, magtaguyod, o magpalakas. Sa konteksto ng sustansiyang dulot ng tinapay, natural ang “nagpapalakas.”
theological_decisions:
- issue: Ang kinatawang isahang אֱנוֹשׁ
  choice: tao
  alternative: mortal na tao / sangkatauhan
  rationale: Hindi partikular na lalaki ang tinutukoy kundi ang tao bilang kinatawan ng sangkatauhan. Ang “tao” ay tumpak at likas na inklusibo sa Filipino.
- issue: Ang kaugnayan ng alak at langis sa pagkinang ng mukha
  choice: Ang alak ang nagpapakinang sa mukha nang higit kaysa langis
  alternative: Pinakikinang ang mukha sa pamamagitan ng langis
  rationale: Pinili sa pangunahing teksto ang paghahambing na gamit ng מִן, ngunit tunay na posible sa Hebreo ang pagbasa rito bilang kasangkapan o pinagmulan; hindi ito ginawang usaping doktrinal at pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang karaniwang “tao” sa halip na mas luma o nakalilitong katawagan, at pinanatili ang tatluhang larawan ng alak, langis, at tinapay.
