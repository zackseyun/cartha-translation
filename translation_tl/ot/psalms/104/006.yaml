base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: tl
  text: Tinakpan mo ito ng napakalalim na tubig na parang damit[a]; nakatayo ang tubig sa ibabaw ng mga bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalaliman,” “mga kailaliman,” o “sinaunang kalaliman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: kalaliman
  rationale: Tumutukoy ito sa napakalalim na tubig o malawak na kailaliman. Pinananatili ng “kalaliman” ang kosmikong larawan nang hindi ito ginagawang tahasang mitolohikal.
- source_word: כַּלְּבוּשׁ
  choice: na parang damit
  rationale: Tahasang pinananatili ang paghahambing na ipinahihiwatig ng כ at ang kahulugan ng לְבוּשׁ bilang damit, sa natural na ayos ng modernong Tagalog.
- source_word: כִּסִּיתוֹ
  choice: Tinakpan mo ito
  rationale: Ang pandiwa ay ikalawang panauhang panlalaki na isahan, na may hulaping tumutukoy sa ikatlong panauhang panlalaki na isahan. Kaya pinananatili ang tuwirang pakikipag-usap sa Diyos at ang panghalip na “ito,” na tumutukoy sa lupa mula sa naunang talata.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Ipinahahayag dito ang posisyon ng tubig na nasa ibabaw o higit sa mga bundok; ang “sa ibabaw ng” ay malinaw at natural sa Tagalog.
- source_word: הָרִים
  choice: mga bundok
  rationale: Karaniwang tumutukoy ang salita sa mga bundok, na angkop sa maringal na larawan ng paglikha.
- source_word: יַעַמְדוּ
  choice: nakatayo
  rationale: Pinananatili ang literal at masiglang larawan ng pandiwang עמד, bagaman hindi karaniwang sinasabing “nakatayo” ang tubig sa ordinaryong prosa.
- source_word: מָיִם
  choice: ang tubig
  rationale: Bagaman pangmaramihan ang anyong Hebreo, ang “tubig” ay likas na pangngalang di-mabilang sa Tagalog at tumutukoy rito sa mga tubig na ipinakilala bilang kalaliman.
theological_decisions:
- issue: Panauhan ng pandiwa at kinakausap
  choice: 'Tuwirang pakikipag-usap sa Diyos: “Tinakpan mo ito”'
  alternative: 'Salaysay sa ikatlong panauhan: “Tinakpan niya ito”'
  rationale: Malinaw na ikalawang panauhang panlalaki na isahan ang anyong Hebreo, at tuwirang kinakausap ang PANGINOON sa konteksto. Pinananatili nito ang anyo ng papuring nakatuon sa Diyos.
- issue: Tinutukoy ng hulaping panghalip sa כִּסִּיתוֹ
  choice: “ito,” na tumutukoy sa lupa
  alternative: Gawing tahasan ang “lupa”
  rationale: Pinananatili ng “ito” ang panghalip ng Hebreo at ang ugnayan nito sa pundasyong/lupang binanggit sa talata 5, nang hindi nagdaragdag ng pangngalang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matapang na larawang patula na “nakatayo” ang tubig sa halip na pakinisin bilang “umabot” o “nanatili,” at iniwasan ang sobrang teknikal na “sinaunang kalaliman.”
