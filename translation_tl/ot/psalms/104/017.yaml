translation:
  language: tl
  text: Kung saan namumugad ang mga ibon; ang tahanan ng tagak ay nasa mga sipres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong fir,” “mga enebro,” o iba pang punong conifer; hindi tiyak kung anong eksaktong uri ng puno ang tinutukoy ng salitang Hebreo.
