lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: Doon
  rationale: Ang pinagsamang panandang ugnayan at pang-abay na pook ay tumutukoy sa mga punong binanggit sa naunang talata. Likas at malinaw sa Filipino ang “Doon.”
- source_word: צִפֳּרִים
  choice: ang mga ibon
  rationale: Pangkalahatang katawagan ito sa mga ibon at angkop ang tiyak na anyo sa tagpong inilalarawan.
- source_word: יְקַנֵּנוּ
  choice: namumugad
  rationale: Mula sa pandiwang קנן, na nangangahulugang gumawa o magkaroon ng pugad. Ang “namumugad” ay maikli, likas, at nagpapanatili sa pandiwang kilos.
- source_word: חֲסִידָה
  choice: tagak
  rationale: Karaniwang katumbas sa Filipino ng ibong tinutukoy na stork. Pinanatili ang pang-isahang anyo bilang kinatawan ng uri.
- source_word: בְּרוֹשִׁים
  choice: mga sipres
  rationale: Tumutukoy ito sa isang uri ng punong conifer, ngunit hindi tiyak ang eksaktong species. Ang “mga sipres” ay isang karaniwan at angkop na salin; inilagay sa talababa ang iba pang posibilidad.
- source_word: בֵּיתָהּ
  choice: ang tahanan ng tagak
  rationale: Literal na “bahay/tahanan nito.” Ang “tahanan” ay natural sa paglalarawan ng tirahan ng ibon at pinananatili ang larawang nasa Hebreo.
