  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikling paralelismo upang mapanatili ang anyong patula. Inilagay ang talababa pagkatapos ng “mga sipres,” ang salitang talagang may leksikal na kawalang-katiyakan.
