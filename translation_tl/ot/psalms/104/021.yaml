  text: Ang mga batang leon ay umuungal para sa masisila at naghahanap ng kanilang pagkain mula sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: mga batang leon
  rationale: Tumutukoy ang כְּפִירִים sa mga batang leon; malinaw at likas ito sa makabagong Tagalog.
- source_word: שֹׁאֲגִים
  choice: umuungal
  rationale: Karaniwang salitang Tagalog para sa malakas na sigaw ng leon.
- source_word: לַטָּרֶף
  choice: para sa masisila
  rationale: Ang טֶרֶף ay hayop o pagkaing sinisila; pinananatili ng 'masisila' ang larawang pangangaso.
- source_word: וּלְבַקֵּשׁ
  choice: at humihingi
  rationale: Maaaring mangahulugang humanap o humingi ang בקש; dahil ang kasunod ay 'mula sa Diyos,' natural na ipinahahayag rito ang paghingi nang hindi inaalis ang diwa ng paghahanap.
- source_word: מֵאֵל אָכְלָם
  choice: sa Diyos ng kanilang pagkain
  rationale: Ipinakikita ng מֵאֵל na sa Diyos nagmumula ang kanilang pagkain; ang hulma ng Tagalog na 'humihingi sa Diyos' ay malinaw at natural.
theological_decisions:
- issue: Ang Diyos bilang pinagmumulan ng pagkain ng mababangis na hayop
  choice: humihingi sa Diyos ng kanilang pagkain
  alternative: hinahanap ang kanilang pagkain mula sa Diyos
  rationale: Pinananatili ang tuwirang pag-uugnay ng pangangailangan ng mga leon sa pagkalinga ng Diyos, nang hindi dinaragdagan ng paliwanag kung paano ito ibinibigay.
translation_notes:
  register: Makabago, payak, at marangal na Filipino; pinanatili ang matalinghagang paglalarawan na ang ungol ng mga leon ay paghingi nila sa Diyos.
