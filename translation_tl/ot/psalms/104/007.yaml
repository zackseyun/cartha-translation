  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: tl
  text: 'Sa pagsaway mo ay tumakas sila;

    sa dagundong ng iyong kulog ay nagmadali silang lumayo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: pagsaway mo
  rationale: Ang גְּעָרָה ay isang makapangyarihan at mariing pagsaway. Likas sa makabagong Filipino ang “pagsaway” at pinananatili nito ang larawan ng utos ng Diyos na nagpapaurong sa mga tubig.
- source_word: יְנוּסוּן
  choice: tumakas sila
  rationale: Ang נוּס ay nangangahulugang tumakas o lumayo upang makaiwas. Ang payak na nagdaang “tumakas” ay angkop sa salaysay at sa biglang pag-urong ng mga tubig.
- source_word: קוֹל רַעַמְךָ
  choice: dagundong ng iyong kulog
  rationale: Ang קוֹל ay tunog o tinig, at ang רַעַם ay kulog. Masigla at likas sa Filipino ang “dagundong ng iyong kulog,” na naghahatid ng lakas ng tunog nang hindi ginagawang literal na tinig ang kulog.
- source_word: יֵחָפֵזוּן
  choice: nagmadali silang lumayo
  rationale: Ang חפז ay nagpapahiwatig ng pagmamadali at maaari ring may bahid ng pagkagulat o pangamba. Inilalarawan ng “nagmadaling lumayo” ang mabilis na kilos nang hindi ipinapasok ang mas tiyak na ideya ng pagkataranta.
- source_word: מִן ... מִן
  choice: Sa ... sa
  rationale: Bagaman pangunahing nangangahulugang “mula sa” ang מִן, dito ay ipinakikita nito ang sanhi o pangyayaring nagbunsod ng kilos. Ang “sa pagsaway” at “sa dagundong” ay natural at pinananatili ang agarang pagtugon.
theological_decisions:
- issue: Tinutukoy ng maramihang mga pandiwa
  choice: Pinanatiling panghalip na “sila,” na tumutukoy sa mga tubig sa naunang konteksto.
  alternative: Gawing tahasan ang simuno bilang “ang mga tubig.”
  rationale: Hindi inuulit ng Hebreo ang simuno sa talatang ito. Ang “sila” ay nagpapanatili sa daloy at pagkakaugnay ng tula nang hindi nagdaragdag ng pangngalang wala sa mismong taludtod.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang magkatulad na taludtod at ang masiglang larawan ng mabilis na pag-urong ng mga tubig sa makapangyarihang pagsaway at kulog ng Diyos.
