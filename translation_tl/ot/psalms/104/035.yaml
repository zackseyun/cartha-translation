base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: tl
  text: Mawala nawa sa lupa ang mga makasalanan,[a] at huwag nang umiral ang masasama. Purihin mo si Yahweh, kaluluwa ko. Aleluya![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Magwakas nawa ang mga makasalanan mula sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Purihin ninyo si Yah!” Ang “Yah” ay pinaikling anyo ng pangalang Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: mawala nawa
  rationale: Ipinahahayag ng Qal imperfect ng תמם ang pagdating sa wakas o pagkaubos. Sa kontekstong ito, likas sa Tagalog ang “mawala nawa” at napananatili nito ang diwang panalangin o hangarin nang hindi ipinapalagay ang tiyak na paraan ng pag-aalis.
- source_word: חַטָּאִים
  choice: mga makasalanan
  rationale: Personal ang tinutukoy ng pangngalang Hebreo—mga taong inilalarawang makasalanan—hindi ang kasalanan bilang abstraktong bagay.
- source_word: מִן הָאָרֶץ
  choice: sa lupa
  rationale: Kosmiko ang saklaw ng Awit 104, kaya “lupa” ang angkop kaysa sa isang lokal na “lupain.” Kasama na sa pandiwang “mawala” ang diwa ng pag-aalis mula rito.
- source_word: וּרְשָׁעִים
  choice: at ang masasama
  rationale: Tumutukoy ito sa masasamang tao bilang isang uri; maikli at natural sa modernong Tagalog ang “ang masasama.”
- source_word: עוֹד אֵינָם
  choice: huwag nang umiral
  rationale: Malinaw nitong naihahayag ang paghahangad na hindi na sila manatili o umiral, habang pinananatili ang patulang diin ng Hebreo.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Purihin mo ... O kaluluwa ko
  rationale: Kapag Diyos ang layon ng ברך, “purihin” ang natural at kinikilalang katumbas sa Tagalog. Napananatili ng “O kaluluwa ko” ang tuwirang pangangaral ng makata sa kanyang sarili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang kinakatawan ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַלְלוּ יָהּ
  choice: Aleluya!
  rationale: Ang “Aleluya” ang kinikilalang anyong liturhikal sa Tagalog; nililinaw sa talababa ang literal na kahulugan at ang pinaikling pangalang Yah.
theological_decisions:
- issue: Kung ang hinihiling na magwakas ay ang kasalanan lamang o ang mga makasalanan mismo
  choice: Ang mga makasalanan at masasamang tao mismo ang sinasabing mawala sa lupa.
  alternative: Mawala nawa sa lupa ang mga kasalanan.
  rationale: Mga personal na katawagan ang חַטָּאִים at רְשָׁעִים. Hindi pinalalambot ng salin ang mahirap na pahayag upang gawin itong hangarin lamang tungkol sa abstraktong kasalanan; pinananatili rin ng “nawa” at “huwag nawa” ang anyong hangarin o panalangin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may patulang himig. Ginamit ang “Yahweh” para sa tetragrammaton at “Aleluya” bilang pamilyar na anyong liturhikal. Inilagay ang mga pananda ng talababa sa mismong pariralang ipinaliliwanag ng bawat talababa.
