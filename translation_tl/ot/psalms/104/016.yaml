  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: tl
  text: 'Saganang natutustusan[a] ang mga puno ni Yahweh—

    ang mga sedro ng Lebanon na itinanim niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lubos na napupuno” o “busog.” Ipinahihiwatig ng pandiwang Hebreo na ang mga ito ay ganap na napaglalaanan o lubos na napupunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: Nasasapatan
  rationale: Ang Qal ng שבע ay nagsasaad ng pagiging lubos na napunan o pagkakaroon ng sapat. Ang “nasasapatan” ay likas sa makabagong Filipino at hindi labis na nagpapahiwatig na may kamalayang nakadarama ng kasiyahan ang mga puno.
- source_word: עֲצֵי
  choice: ang mga puno ni
  rationale: Construct plural ito ng עֵץ. Pinananatili ng “mga puno ni” ang tuwirang kaugnayan nito sa kasunod na banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אַרְזֵי
  choice: ang mga sedro ng
  rationale: Tiyak na tumutukoy ang אֶרֶז sa sedro. Ang ikalawang linya ay nagsisilbing apposition na tumutukoy sa mga punong binanggit sa unang linya.
- source_word: לְבָנוֹן
  choice: Lebanon
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na pang-ugnay sa Filipino para sa sugnay na naglalarawan sa mga sedro.
- source_word: נָטָע
  choice: itinanim niya
  rationale: Qal perfect 3ms ng נטע. Nauunawaang si Yahweh ang paksa; ang “niya” ay kailangan sa Filipino upang maging malinaw at natural.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na banal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng “mga puno ni Yahweh”
  choice: Pinanatili bilang tuwirang ugnayang paari
  alternative: “malalaking puno” o “mga puno ng Diyos” bilang idyomatikong paglalarawan
  rationale: Maaaring magpahiwatig ang parirala ng pag-aari, pagkakalikha, o pambihirang kadakilaan, ngunit hindi nilulutas ng salin ang posibleng saklaw nito. Pinananatili ang anyo ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nasasapatan” upang ipahayag ang kasaganaan nang hindi tahasang nagdaragdag ng “tubig,” bagaman iyon ang ipinahihiwatig ng konteksto. Ang gitling na em ay nagpapakita na ang “mga sedro ng Lebanon” ay tumutukoy nang higit na tiyak sa “mga puno ni Yahweh.”
