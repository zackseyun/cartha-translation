base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: tl
  text: Tumaas ang mga bundok[a], bumaba ang mga lambak, patungo sa lugar na itinatag mo para sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa isa pang posibleng pagbasa sa tulang Hebreo: “Umakyat ang mga tubig sa ibabaw ng mga bundok; bumaba sa mga lambak, patungo sa lugar na itinatag mo para sa kanila.” Sa pagbabasang ito, ang mga tubig ang ipinahihiwatig na paksa.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: Umahon
  rationale: Ang Qal imperfect 3mp ng עלה ay nagsasaad ng paggalaw paitaas. Likas sa makabagong Tagalog ang “umahon” at angkop sa makatang larawan ng paglitaw o pagtaas ng lupain.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tiyak na pangngalang maramihan; pinananatili ng “ang mga bundok” ang artikulo at ang konkretong larawang heograpiko.
- source_word: יֵרְדוּ
  choice: lumubog
  rationale: Ang Qal imperfect 3mp ng ירד ay nangangahulugang bumaba. Sa paralelismo sa pag-ahon ng mga bundok, ipinahahayag ng “lumubog” ang pagbaba ng mga lambak nang natural sa Tagalog.
- source_word: בְקָעוֹת
  choice: ang mga lambak
  rationale: Tumutukoy sa mabababang bahagi ng lupain o mga lambak; malinaw at karaniwang salita ang “mga lambak.”
- source_word: אֶל מְקוֹם
  choice: patungo sa lugar
  rationale: Ipinahahayag ng parirala ang pagkilos tungo sa isang hantungan. Ang “patungo sa lugar” ay natural at pinananatili ang direksiyonal na diwa.
- source_word: זֶה
  choice: na
  rationale: Bagaman demonstratibo ang זֶה, likas sa Tagalog na isama ito sa sugnay na “lugar na itinatag mo”; naipahihiwatig ng kayarian ang tiyak na lugar nang hindi nagiging pilit ang pangungusap.
- source_word: יָסַדְתָּ
  choice: itinatag mo
  rationale: Ang Qal perfect 2ms ng יסד ay “itinatag” o “inilagay sa matatag na kalagayan.” Ang “itinatag mo” ay marangal at angkop sa pagsasaayos ng Diyos sa sangnilikha.
- source_word: לָהֶם
  choice: para sa mga iyon
  rationale: Pinananatili nito ang panlalaking maramihang reperensiya ng hulapi nang hindi tiyakang nilulutas kung tumutukoy ito sa mga anyong-lupa o, sa alternatibong pagbasa, sa mga tubig.
theological_decisions:
- issue: Paksa ng mga pandiwa sa makatang taludtod
  choice: Ang mga bundok ang umahon at ang mga lambak ang lumubog.
  alternative: 'Ang mga tubig ang ipinahihiwatig na paksa: “Dumaan ang mga iyon sa ibabaw ng mga bundok; bumaba ang mga iyon sa mga lambak.”'
  rationale: Maaaring basahin ang Hebreong may mga bundok at lambak bilang mga paksa ng kani-kanilang pandiwa, na nagbibigay ng magkakaugnay na larawan ng pagsasaayos sa lupain. Gayunman, dahil pag-urong ng mga tubig ang konteksto, tunay ding posible ang alternatibong pagbasa at pinananatili ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maigsi at makatang paralelismo, at iniwasang lutasin sa pangunahing teksto ang tunay na kalabuan tungkol sa paksa ng mga pandiwa.
