source:
  edition: WLC
  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: tl
  text: Nagtakda ka ng hangganang hindi nila matatawid[a]; hindi sila babalik upang takpan ang lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “limitasyon” o “guhit-hangganan.”
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “sila” ay ang mga tubig. Maaaring umalingawngaw rito ang salaysay ng baha, ngunit maaari ring tumukoy ang talata sa itinakdang kaayusan ng mga tubig sa paglikha.
    reason: cross_reference
lexical_decisions:
- source_word: גְּבוּל
  choice: hangganan
  rationale: Tumutukoy ito sa itinakdang dulo o limitasyon; natural ang “hangganan” sa Filipino at angkop sa larawang nililimitahan ng Diyos ang tubig.
- source_word: שַׂמְתָּ
  choice: nagtakda ka
  rationale: Bagaman literal na “naglagay ka,” mas likas na katambal ng “hangganan” ang “nagtakda ka” at naipahahayag nito ang sadyang pagtatatag ng limitasyon.
- source_word: בַּל
  choice: hindi
  rationale: Tahasang itinatanggi ng kataga ang kasunod na kilos; sa konteksto, ipinahahayag nito ang di-mapapasong limitasyong itinakda ng Diyos.
- source_word: יַעֲבֹרוּן
  choice: nila matatawid
  rationale: Ang pandiwa ay nangangahulugang dumaan o tumawid; malinaw na inilalarawan ng “matatawid” ang paglampas sa isang hangganan.
- source_word: יְשׁוּבוּן
  choice: sila babalik
  rationale: Pinananatili nito ang payak na kahulugan ng שוב na “bumalik” nang hindi tahasang dinaragdagan ang teksto ng “muli.”
- source_word: לְכַסּוֹת
  choice: upang takpan
  rationale: Malapit ito sa literal na “takpan” at pinananatili ang larawan ng tubig na tumatakip sa lupa sa halip na ipakahulugan agad bilang “bahain.”
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa kontekstong kosmiko ng salmo, ang “lupa” ay natural na Filipino para sa daigdig na tinatakpan ng tubig, habang pinananatili ang saklaw na maaaring tumukoy sa earth o land.
theological_decisions:
- issue: Tinutukoy ng mga pandiwang maramihan
  choice: Pinanatili ang panghalip na “nila/sila,” na sa konteksto ay tumutukoy sa mga tubig.
  alternative: Tahasan itong isalin bilang “mga tubig,” o unawain nang mas malawak bilang magulong tubig o dagat.
  rationale: Malinaw sa naunang konteksto na tubig ang tinutukoy, ngunit ang pagpapanatili sa panghalip ay sumusunod sa Hebreo at hindi labis na nagpapaliwanag sa pangunahing teksto.
- issue: Kaugnayan sa salaysay ng baha
  choice: Hindi tahasang binanggit ang baha sa pangunahing teksto; inilagay lamang sa talababa ang posibleng alusyon.
  alternative: Isalin o ipaliwanag sa teksto na hindi na muling babahain ng tubig ang buong daigdig.
  rationale: Maaaring umalingawngaw rito ang salaysay ng baha, ngunit ang talata mismo ay maaari ring tumukoy sa kaayusan ng paglikha at sa patuloy na hangganan ng mga tubig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagtakda” at “hangganan” bilang natural na tambalan; pinanatili ang mga panghalip at ang pandiwang “takpan” upang hindi lampasan ang detalye at posibleng mga pahiwatig ng Hebreo.
