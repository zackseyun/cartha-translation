  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: tl
  text: 'Purihin mo si Yahweh, kaluluwa ko!


    Yahweh, Diyos ko, napakadakila mo!


    Karilagan at karingalan ang iyong isinuot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Purihin mo
  rationale: Ang pandiwa ay literal na “pagpalain,” ngunit kapag Diyos ang layon, ang diwa nito ay sambahin at purihin siya. Mas natural at malinaw sa modernong Tagalog ang “Purihin mo” kaysa “Pagpalain mo” nang hindi inaalis ang panawagan sa sariling kaluluwa.
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Pinananatili ang tuwirang pakikipag-usap ng makata sa kaniyang sariling buong pagkatao o kalooban. Ang “kaluluwa ko” ay natural at pamilyar sa marangal na pananalitang patula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: 'Pinananatili ang personal na kaugnayang ipinahahayag ng hulaping unang panauhan: “my God.”'
- source_word: גָּדַלְתָּ מְּאֹד
  choice: napakadakila mo
  rationale: 'Bagaman nasa anyong perfect ang pandiwa, stative ang gamit nito sa papuri: ipinahahayag nito ang sukdulang kadakilaan ng Diyos sa kasalukuyan.'
- source_word: הוֹד וְהָדָר
  choice: Karangyaan at karingalan
  rationale: Ang magkatambal na mga salita ay tumutukoy sa maningning at maharlikang kadakilaan. Pinananatili ng pares na ito ang patulang pag-uugnay nang hindi pinagsasanib ang dalawang termino.
- source_word: לָבָשְׁתָּ
  choice: ang iyong isinuot
  rationale: 'Pinananatili ang aktibong talinghaga ng pagsusuot: ang karangyaan at karingalan ay inilalarawang wari’y kasuutan ng Diyos. Hindi kailangang idagdag ang “sa iyong sarili” dahil likas na malinaw iyon sa Tagalog.'
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, hindi ang titulong אֲדֹנָי. Pinananatili ng “Yahweh” ang pagkakaibang ito, habang ipinapaliwanag sa talababa ang anyong Hebreo at ang ibang nakaugaliang salin.
- issue: Kahulugan ng “pagpapala” sa Diyos
  choice: Purihin mo
  alternative: Pagpalain mo
  rationale: Hindi ipinahihiwatig ng talata na nagkakaloob ang tao ng pagpapalang wala sa Diyos. Sa ganitong doxolohikal na gamit ng ברך, ang tao ay nagpupuri at nagpapahayag ng pagsamba sa Diyos; kaya “Purihin mo” ang pinakamalinaw na katumbas sa Tagalog.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinanatili ang tuwirang panawagan sa sariling kaluluwa, ang pag-uulit sa pangalang Yahweh, at ang talinghaga ng karangyaan at karingalan bilang kasuutan.
