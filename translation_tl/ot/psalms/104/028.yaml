base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: tl
  text: Nagbibigay ka sa kanila, at tinitipon nila iyon; binubuksan mo ang iyong kamay, at nabubusog sila sa mabubuting bagay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “napupuno sila ng mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: nagbibigay ka
  rationale: Ang Qal imperfect na nakatuon sa Diyos ay inilalarawan bilang palagian o paulit-ulit na pagkilos sa konteksto ng patuloy niyang paglalaan sa mga nilalang.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Ang ל na may hulaping pangatlong panauhang maramihan ay likas na tumutukoy sa tumatanggap ng ibinibigay ng Diyos.
- source_word: יִלְקֹטוּן
  choice: tinitipon nila iyon
  rationale: Ang לקט ay nangangahulugang magtipon o mamulot. Idinagdag ang “iyon” bilang likas na layon sa Filipino, na tumutukoy sa ibinibigay ng Diyos, nang hindi nililimitahan ang larawan sa gawaing pang-agrikultura.
- source_word: תִּפְתַּח
  choice: binubuksan mo
  rationale: Tuwirang isinasalin ang Qal imperfect ng פתח; walang idinagdag na “nang maluwang” sapagkat hindi iyon tahasang nasa Hebreo.
- source_word: יָדְךָ
  choice: iyong kamay
  rationale: Pinanatili ang kongkretong larawang antropomorpiko ng bukás na kamay bilang sagisag ng mapagbigay na paglalaan ng Diyos.
- source_word: יִשְׂבְּעוּן
  choice: nabubusog sila
  rationale: Ang שבע ay maaaring mangahulugang mapuno o masiyahan. Sa konteksto ng pagkain at paglalaan sa mga nilalang, natural at kongkreto sa Filipino ang “nabubusog.”
- source_word: טוֹב
  choice: sa mabubuting bagay
  rationale: Ang טוב ay ginagamit dito bilang pangngalan sa diwang “mabuti” o “mabubuting bagay.” Ang maramihang parirala ay mas natural sa Filipino, bagaman bahagyang pinalalawak nito ang maigsi at kolektibong anyo ng Hebreo.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa paglalaan ng Diyos
  choice: binubuksan mo ang iyong kamay
  alternative: sagana kang naglalaan
  rationale: Pinananatili ng literal na larawan ang kongkreto at patulang paglalarawan ng salmo sa patuloy na pangangalaga ng Diyos, sa halip na gawing abstraktong paliwanag.
- issue: Saklaw ng kasiyahang ipinahahayag ng שבע at טוב
  choice: nabubusog sila sa mabubuting bagay
  alternative: napupuno sila ng mabuti
  rationale: Pinili ang pananalitang natural sa konteksto ng pagpapakain sa mga nilalang, habang inilalagay sa talababa ang mas pormal na posibilidad upang hindi maitago ang lawak ng kahulugan.
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang pangkasalukuyang aspektong nagaganap upang ipakita ang palagian at paulit-ulit na paglalaan ng Diyos. Pinanatili ang paralelismo at ang larawan ng bukás na kamay.
