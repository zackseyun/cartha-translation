  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: tl
  text: Pinapasibol niya ang mga bukal sa mga lambak[a]; umaagos ang mga ito sa pagitan ng mga bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga daluyan ng tubig na pana-panahon lamang umaagos” o “sa mga bangin.” Ang salitang Hebreo ay maaaring tumukoy sa mga daluyang pana-panahon lamang umaagos, o sa mga lambak na kinaroroonan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Pinabubukal niya
  rationale: Ang Hiphil participle ay naglalarawan sa patuloy na pagkilos ng Diyos. Sa konteksto ng mga bukal, ang “pinabubukal niya” ay likas sa Filipino at ipinapahayag na siya ang nagpapalabas ng tubig, bagaman mas literal ang “ipinapadala niya.”
- source_word: מַעְיָנִים
  choice: mga bukal
  rationale: Karaniwang tumutukoy ang salita sa likas na pinagmumulan ng tubig; malinaw at karaniwan sa modernong Filipino ang “mga bukal.”
- source_word: בַּנְּחָלִים
  choice: sa mga lambak
  rationale: Maaaring tumukoy ang נחל sa lambak, bangin, o pana-panahong agusan. Ang “mga lambak” ay madaling maunawaan at angkop sa larawang heograpiko, habang pinananatili sa talababa ang mas tiyak na mga alternatibo.
- source_word: בֵּין
  choice: sa pagitan ng
  rationale: Tuwirang ipinahahayag nito ang kinaroroonan ng agos kaugnay ng mga bundok.
- source_word: הָרִים
  choice: mga bundok
  rationale: Ang “mga bundok” ang karaniwang katumbas at nababagay sa malawak na larawan ng paglikha sa awit.
- source_word: יְהַלֵּכוּן
  choice: umaagos ang mga iyon
  rationale: Literal itong “lumalakad/pumupunta,” ngunit kapag tubig ang tinutukoy, natural at tumpak sa Filipino ang “umaagos.” Nililinaw ng “ang mga iyon” na mga bukal o tubig ng mga bukal ang tinutukoy.
theological_decisions:
- issue: Di-hayag na tinutukoy ng articular participle
  choice: Ang “niya” ay tumutukoy sa Diyos
  alternative: 'Panatilihing participial: “Ang nagpapadaloy…”'
  rationale: Ipinagpapatuloy ng talata ang paglalarawan sa mapagkalingang pagkilos ng Diyos sa sangnilikha. Kailangan sa natural na Filipino ang hayag na panghalip, ngunit walang idinaragdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit payak. Ginamit ang “pinabubukal” upang maging likas ang larawan ng Diyos na nagpapalabas ng mga bukal; pinanatili sa talababa ang lawak ng kahulugan ng נחל. Ang marker na [a] ay nasa mismong teksto.
