  text: Ang lahat ng hayop sa parang ay umiinom mula sa mga iyon[a]; pinapawi ng mga ligaw na asno[b] ang kanilang uhaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinaiinom ng mga iyon.” Maaaring ilarawan ng pandiwang Hebreo ang mga tubig bilang nagbibigay-inom sa mga hayop.
