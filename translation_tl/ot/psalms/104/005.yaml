  text: יָֽסַד אֶ֭רֶץ עַל מְכוֹנֶ֑י/הָ בַּל תִּ֝מּ֗וֹט עוֹלָ֥ם וָ/עֶֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: tl
  text: Itinatag niya ang lupa sa mga pundasyon nito[a]; hindi ito mauuga magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga saligan nito.” Gumagamit ang Hebreo ng larawang pang-arkitektura upang ilarawan ang katatagan ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: Itinatag
  rationale: Ipinahahayag ng pandiwa ang pagtatatag sa pamamagitan ng paglalagay ng pundasyon. Pinananatili ng “itinatag” ang larawang pang-arkitektura at likas itong pakinggan sa makabagong Filipino.
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Sa konteksto ng awit tungkol sa paglikha, tumutukoy ito sa buong lupa, hindi lamang sa isang tiyak na lupain.
- source_word: עַל
  choice: sa
  rationale: Likas na ipinahahayag ng “sa” ang pagkakalagay o pagkakasalig sa mga pundasyon.
- source_word: מְכוֹנֶיהָ
  choice: mga pundasyon nito
  rationale: Ang pangngalan ay maaaring tumukoy sa mga saligan, patungan, o matitibay na kinatatayuan. Pinakamalinaw na pinananatili ng “mga pundasyon nito” ang talinghagang pang-arkitektura.
- source_word: בַּל תִּמּוֹט
  choice: hindi ito mauuga
  rationale: Ang anyong pasibo ng pandiwa ay nagsasaad ng hindi paggalaw o pagkawala ng katatagan. Ang “mauuga” ay natural at pinananatili ang larawan ng katatagan.
- source_word: עוֹלָם וָעֶד
  choice: magpakailanman
  rationale: Ang magkatambal na mga salita sa Hebreo ay matinding pahayag ng walang-hanggang tagal. Likas na katumbas nito sa Filipino ang “magpakailanman,” nang hindi gumagamit ng mabigat at di-likas na pag-uulit.
theological_decisions:
- issue: Matalinghagang paglalarawan sa kaayusan ng nilikha
  choice: Panatilihin ang larawan ng lupa na nakatatag sa mga pundasyon at hindi mauuga.
  alternative: Isaad lamang na matatag na inilagay ng Diyos ang mundo.
  rationale: Makatang paglalarawan ang talata, hindi paliwanag sa makabagong agham. Ang pagpapanatili sa larawan ng mga pundasyon ay umiiwas sa pag-aangkop nito sa anumang sistemang pang-agham o natatanging doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at matatag na himig ng tulang Hebreo, pati ang larawang pang-arkitektura.
