  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: tl
  text: Ginagawa niyang mga hangin[a][b] ang kanyang mga mensahero, at nagliliyab na apoy ang kanyang mga tagapaglingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring mangahulugang “mga hangin” o “mga espiritu.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Ginagawa niyang mga mensahero ang mga hangin, at mga tagapaglingkod ang mga ningas ng apoy.” Isa pang tradisyonal na salin: “Ginagawa niyang mga espiritu ang kanyang mga anghel, at ningas ng apoy ang kanyang mga tagapaglingkod.” Ang huling pagbasa ay makikita sa Hebreo 1:7.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׂה
  choice: Ginagawa niya
  rationale: Ang pandiwaring Hebreo ay naglalarawan sa palagiang pagkilos ng Diyos. Likas sa modernong Tagalog ang “ginagawa niya” at pinananatili nito ang aktibong diwa.
- source_word: מַלְאָכָיו
  choice: ang kanyang mga mensahero
  rationale: Ang מַלְאָךְ ay maaaring tumukoy sa “mensahero” o “anghel.” Pinananatili ng “mga mensahero” ang malawak na leksikal na kahulugan nang hindi agad nagpapasya kung mga nilalang sa langit o mga puwersang ginagamit ng Diyos ang tinutukoy.
- source_word: רוּחוֹת
  choice: mga hangin
  rationale: Ang רוּחַ ay maaaring mangahulugang “hangin,” “hininga,” o “espiritu.” Sa konteksto ng awit tungkol sa sangnilikha at sa katambal nitong nagliliyab na apoy, ang “mga hangin” ang pinakamalinaw na pangunahing pagbasa, habang inilalahad sa talababa ang tunay na kalabuan.
- source_word: מְשָׁרְתָיו
  choice: ang kanyang mga tagapaglingkod
  rationale: Tumutukoy ito sa mga naglilingkod o tumutupad ng atas. Ang “mga tagapaglingkod” ay natural, marangal, at malinaw sa pangkaraniwang modernong Tagalog.
- source_word: אֵשׁ
  choice: apoy
  rationale: Tuwirang katumbas ito ng salitang Hebreo at pinananatili ang larawang mula sa kalikasan.
- source_word: לֹהֵט
  choice: nagliliyab
  rationale: Ipinahahayag nito ang matindi at aktibong pagningas ng apoy sa natural at masiglang Tagalog.
theological_decisions:
- issue: Kung ang talata ay nagsasabing ginagawang hangin ang mga mensahero o ginagawang mga mensahero ang mga hangin, at kung “mga anghel/mga espiritu” ang tinutukoy
  choice: Ginagawa niyang mga hangin ang kanyang mga mensahero, at nagliliyab na apoy ang kanyang mga tagapaglingkod.
  alternative: 'Ginagawa niyang mga mensahero ang mga hangin, at mga tagapaglingkod ang mga ningas ng apoy; o: Ginagawa niyang mga espiritu ang kanyang mga anghel, at ningas ng apoy ang kanyang mga tagapaglingkod.'
  rationale: Maaaring unawain sa higit sa isang paraan ang sintaks ng Hebreo, at may higit sa isang kahulugan ang מַלְאָךְ at רוּחַ. Sinusunod ng pangunahing salin ang tuwirang ayos ng Hebreo at ang larawang pangkalikasan ng Awit 104, ngunit hindi itinatago ng mga talababa ang ibang posibleng pagbasa, lalo na ang tradisyonal na pagbasa na makikita sa Hebreo 1:7.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kanyang” ayon sa karaniwang kasalukuyang baybay at ang “mga tagapaglingkod” sa halip na mas teknikal o panrelihiyong katawagan. Pinanatili sa mga talababa ang leksikal at sintaktikong kalabuan ng Hebreo.
