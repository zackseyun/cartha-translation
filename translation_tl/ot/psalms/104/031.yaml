  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: tl
  text: Manatili nawa magpakailanman ang kaluwalhatian ni Yahweh[a]; magalak nawa si Yahweh sa kanyang mga gawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong banal na pangalan ay YHWH, na tradisyonal na isinasaling “PANGINOON.”
    reason: divine_name
  - marker: b
    text: 'Maaari ring unawain: “dahil sa kanyang mga gawa.” Bahagyang nag-iiba ang diwa ng pang-ukol na Hebreo ayon sa ugnayang ipinahihiwatig nito rito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... לְעוֹלָם
  choice: Manatili nawa magpakailanman
  rationale: Ang jussive na יְהִי ay nagpapahayag ng hangarin o panalangin. Ang “manatili nawa magpakailanman” ay likas sa modernong Tagalog at malinaw na naghahatid ng patuloy na pag-iral na ipinahihiwatig ng לְעוֹלָם.
- source_word: כְבוֹד
  choice: kaluwalhatian
  rationale: Karaniwang salin ito ng כָּבוֹד sa kontekstong nagpupuri sa Diyos at naipahahayag nito ang kanyang karangalan at kadakilaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: יִשְׂמַח
  choice: magalak nawa
  rationale: Kaagapay ito ng unang sugnay bilang isang hangarin. Ang “magalak” ay natural, marangal, at angkop sa matulaing konteksto.
- source_word: בְּמַעֲשָׂיו
  choice: sa kanyang mga gawa
  rationale: Sa konteksto ng Awit 104, ang מַעֲשֶׂה ay tumutukoy sa mga nilikha o ginawa ng Diyos. Pinananatili ng “sa kanyang mga gawa” ang malawak na kahulugan at ang payak na ugnayang ipinahihiwatig ng pang-ukol na בְּ.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan, samantalang ang “PANGINOON” ang tradisyonal na pamalit na titulo.
- issue: Ugnayan ni Yahweh sa kanyang mga gawa sa ikalawang sugnay
  choice: magalak ... sa kanyang mga gawa
  alternative: magalak ... dahil sa kanyang mga gawa
  rationale: Hindi tahasang nililinaw ng Hebreong בְּ kung ang diin ay nasa kinaroroonan o layon ng kagalakan, o sa dahilan nito. Ang “sa” ay nagpapanatili ng mas malawak na ugnayan at hindi sapilitang nilulutas ang bahagyang kalabuan.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Ginamit ang “nawa” upang mapanatili ang himig ng hangarin o panalangin, at iniwasan ang lipas o labis na teknikal na pananalita.
