base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: tl
  text: Isinusugo mo ang iyong Espiritu[a]; sila ay nalilikha, at pinapanibago mo ang ibabaw ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong hininga” o “iyong hangin”; maaaring taglayin ng salitang Hebreo na רוּחַ ang lahat ng tatlong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: isinusugo mo
  rationale: Ang Piel ng שׁלח ay nangangahulugang “isugo” o “ipadala.” Ang “isinusugo mo” ay natural at marangal sa Filipino at malinaw na ipinapakitang ang Diyos ang aktibong nagpapadala.
- source_word: רוּחֲךָ
  choice: iyong Espiritu
  rationale: Maaaring mangahulugan ang רוּחַ ng espiritu, hininga, o hangin. Sa konteksto ng paglikha at pagbibigay-buhay, ang “iyong Espiritu” ang pinakamainam sa pangunahing teksto, habang pinananatili sa talababa ang tunay na lawak ng salitang Hebreo.
- source_word: יִבָּרֵאוּן
  choice: sila ay nalilikha
  rationale: Ang Niphal ng ברא ay nagsasaad ng pagiging nilikha. Tuwirang ipinapahayag ng “nalilikha” ang diwang pasibo nang hindi idinaragdag ang ideya ng “muling” paglikha, sapagkat ang pagpapanibago ay nasa kasunod na sugnay.
- source_word: וּתְחַדֵּשׁ
  choice: at pinapanibago mo
  rationale: Ang Piel ng חדשׁ ay “panibaguhin” o “gawing bago.” Ang “pinapanibago” ay natural sa modernong Filipino at nagpapahiwatig ng patuloy o paulit-ulit na pagpapanumbalik nang hindi nangangahulugang ganap na pagpapalit.
- source_word: פְּנֵי
  choice: ang ibabaw ng
  rationale: Literal itong “mukha ng,” ngunit ang “ibabaw ng” ang likas na katumbas sa Filipino para sa ibabaw ng lupa at malinaw na naghahatid ng larawang Hebreo.
- source_word: אֲדָמָה
  choice: lupa
  rationale: Ang אֲדָמָה ay tumutukoy sa lupa o lupang-taniman. Ang “lupa” ay malawak na nauunawaan at angkop sa larawan ng ibabaw nitong pinapanibago.
theological_decisions:
- issue: Kahulugan ng רוּחַ sa konteksto ng paglikha
  choice: iyong Espiritu
  alternative: iyong hininga o iyong hangin
  rationale: Ipinahihiwatig ng talata ang nagbibigay-buhay na pagkilos ng Diyos, kaya makatuwiran ang “Espiritu.” Gayunman, hindi nilulutas nang palihim ang maraming kahulugan ng רוּחַ; inilalahad sa talababa ang “hininga” at “hangin.”
- issue: Ugnayan ng unang dalawang sugnay
  choice: Kapag isinusugo mo … sila ay nalilikha
  alternative: Isinusugo mo … at sila ay nalilikha
  rationale: Ginagawang malinaw ng “kapag” ang ugnayan ng pagsusugo at pagkalikha na likas sa konteksto, ngunit inilalagay sa talababa ang higit na parataktikong anyo upang mapanatili ang posibleng mas tuwirang pagbasa sa Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Espiritu” para sa pangunahing pagbasa at “ibabaw ng lupa” bilang natural na katumbas ng idyomang Hebreo. Pinanatili sa mga talababa ang leksikal at sintaktikong kalabuan.
