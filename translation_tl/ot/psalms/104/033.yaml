  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: tl
  text: 'Aawit ako kay Yahweh habang ako''y nabubuhay;

    aawit ako ng papuri sa aking Diyos habang ako''y may buhay pa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang ako'y nabubuhay pa.” Ang Hebreo ay maaaring tumukoy nang mas malawak sa patuloy na pag-iral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: Aawit ako
  rationale: Ang Qal cohortative na unang panauhan ay nagpapahayag dito ng matatag na layuning magpuri; natural itong isinasalin bilang pasyang panghinaharap.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay tumutukoy sa pinag-uukulan ng awit, at pinananatili ang personal na pangalang יהוה bilang Yahweh.
- source_word: בְּחַיָּי
  choice: habang ako'y nabubuhay
  rationale: Bagaman literal na 'sa aking buhay,' temporal ang gamit nito at tumutukoy sa buong panahong siya ay buhay.
- source_word: אֲזַמְּרָה
  choice: aawit ako ng papuri
  rationale: Ang Piel cohortative ng זמר ay tumutukoy sa musikal na pagpupuri. Ang 'aawit ng papuri' ay natural sa Filipino at hindi nagdaragdag ng tiyak na instrumentong hindi binanggit sa Hebreo.
- source_word: לֵאלֹהַי
  choice: sa aking Diyos
  rationale: Malinaw na ipinahahayag ng hulaping unang panauhan ang personal at relasyonal na 'aking Diyos,' habang ang ל ay nagsasaad ng pinag-uukulan ng papuri.
- source_word: בְּעוֹדִי
  choice: habang ako'y naririto pa
  rationale: Ipinahihiwatig ng עוֹד na nagpapatuloy pa ang pag-iral. Ang 'naririto pa' ay likas na Filipino at bahagyang pinananatili ang kaibhan nito sa naunang 'nabubuhay,' nang hindi gumagamit ng pilosopikal na tunog ng 'umiiral.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalang יהוה ang tuwirang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Lawak ng kahulugan ng בְּעוֹדִי
  choice: habang ako'y naririto pa
  alternative: habang ako'y nabubuhay pa
  rationale: Maaaring tumukoy ang parirala sa nagpapatuloy na pag-iral nang mas malawak kaysa sa simpleng pagbanggit ng haba ng buhay. Pinananatili ng salin ang bahagyang kaibhan ngunit inilalagay sa talababa ang mas karaniwang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad ngunit hindi ganap na magkaparehong dalawang hanay ng tula, at iniwasan ang masyadong teknikal na salitang “umiiral” sa pangunahing teksto.
