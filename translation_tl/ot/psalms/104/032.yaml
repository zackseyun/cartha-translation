  source_fidelity: 'Tapat ang salin sa Hebreo: ang participial na "ang tumitingin" ay natural na naipahayag bilang "Tinitingnan niya," ang אֶרֶץ ay wastong "lupa" sa kosmikong konteksto, at malinaw na naipapakita ang panginginig ng lupa at pag-uusok ng mga bundok sa paghipo ng Diyos. Napananatili rin ang kasalukuyan at matulang bisa ng mga pandiwa.'
  naturalness: Likas, malinaw, at marangal ang modernong Tagalog. Ang magkatimbang na dalawang sugnay na may tuldok-kuwit ay angkop sa Hebreong tula. Ang "mga iyon" ay bahagyang demonstratibo ngunit katanggap-tanggap at malinaw na tumutukoy sa mga bundok.
