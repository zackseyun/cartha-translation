  text: הַ/מַּבִּ֣יט לָ֭/אָרֶץ וַ/תִּרְעָ֑ד יִגַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: tl
  text: Tinitingnan niya ang lupa[a], at ito'y nanginginig; hinihipo niya ang mga bundok, at umuusok ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Siyang tumitingin sa lupa, at ito’y nanginginig; hinihipo niya ang mga bundok, at umuusok ang mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Tinitingnan niya
  rationale: Ang Hiphil participle ay naglalarawan sa Diyos bilang “ang tumitingin.” Likas sa modernong Tagalog ang tahasang panghalip at napapanatili nito ang buhay na kilos sa kasalukuyan.
- source_word: לָאָרֶץ
  choice: ang lupa
  rationale: Bagaman maaaring mangahulugang “lupain” ang אֶרֶץ, ang malawak na konteksto ng paglikha sa Awit 104 ay tumutukoy sa buong lupa.
- source_word: וַתִּרְעָד
  choice: at ito'y nanginginig
  rationale: Ipinahahayag ng רעד ang panginginig o pagyanig. Ang “nanginginig” ay matula ngunit karaniwan, at malinaw na ang lupa ang tinutukoy.
- source_word: יִגַּע
  choice: hinihipo niya
  rationale: Ang נגע ay karaniwang nangangahulugang “humipo.” Ipinakikita ng payak na salitang ito na sa bahagyang paghipo lamang ng Diyos ay tumutugon ang mga bundok.
- source_word: בֶּהָרִים
  choice: ang mga bundok
  rationale: Ang הָרִים ay tuwirang tumutukoy sa mga bundok at pinananatili ang lakas ng larawan.
- source_word: וְיֶעֱשָׁנוּ
  choice: at umuusok ang mga iyon
  rationale: Ang pandiwang mula sa עשׁן ay nangangahulugang “umusok.” Nililinaw ng “ang mga iyon” na ang maramihang simuno ay ang mga bundok.
theological_decisions:
- issue: Di-tahasang banal na simuno sa pariralang participial
  choice: Gamitin ang “niya,” na tumutukoy sa Diyos ayon sa konteksto.
  alternative: Mas pormal na “Siyang tumitingin sa lupa...”
  rationale: Malinaw sa nakapaligid na konteksto na ang Diyos ang simuno. Mas natural sa modernong Tagalog ang tahasang panghalip, samantalang inilalagay sa talababa ang mas pormal na estruktura upang mapanatili ang anyo at bahagyang tensiyon ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal, malinaw, at matula. Pinili ang “Tinitingnan” kaysa mas mataas na “minamasdan” upang manatiling madaling maunawaan, at pinanatili ang maikli at magkatimbang na dalawang sugnay ng Hebreong tula.
