  text: יֵצֵ֣א אָדָ֣ם לְ/פָעֳל֑/וֹ וְֽ/לַ/עֲבֹ֖דָת֣/וֹ עֲדֵי עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/023.yaml
  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: tl
  text: Lumalabas ang tao[a] para sa kaniyang gawain at pagpapagal hanggang gabi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang sangkatauhan.” Ang salitang Hebreo ay singular ngunit pangkalahatang tumutukoy sa mga tao.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “para sa kaniyang gawain at sa kaniyang pagpapagal hanggang gabi.”'
    reason: previous_rendering
lexical_decisions:
- source_word: יֵצֵא
  choice: Lumalabas
  rationale: Ang Qal imperfect ay nagpapahayag dito ng nakaugaliang kilos. Likas sa modernong Tagalog ang “lumalabas” at pinananatili nito ang diwa ng paglabas upang magtrabaho sa araw.
- source_word: אָדָם
  choice: ang tao
  rationale: Ang אָדָם ay pangkalahatang singular na tumutukoy sa sangkatauhan sa kaibahan ng mga hayop sa naunang mga talata. Ang “ang tao” ay natural na generic sa Tagalog at pinananatili ang anyong singular.
- source_word: לְפָעֳלוֹ
  choice: para sa kaniyang gawain
  rationale: Ang פֹּעַל ay gawain, gawa, o aktibidad. Ipinahahayag ng לְ pagkatapos ng יֵצֵא ang layunin o patutunguhan; natural itong isalin na “para sa kaniyang gawain.”
- source_word: וְלַעֲבֹדָתוֹ
  choice: at pagpapagal
  rationale: Ang עֲבֹדָה ay maaaring mangahulugang paggawa, paglilingkod, o pagpapagal. Ang “pagpapagal” ay nagpapakita ng kaunting pagkakaiba sa kaagapay nitong “gawain” nang hindi itinatanggi ang kanilang magkasanib na kahulugan.
- source_word: עֲדֵי עָרֶב
  choice: hanggang gabi
  rationale: Tuwirang ipinahahayag nito ang hangganan sa oras ng maghapong paggawa at natural ang pariralang “hanggang gabi” sa Tagalog.
theological_decisions:
- issue: Pangkalahatang kahulugan ng אָדָם
  choice: ang tao
  alternative: ang sangkatauhan
  rationale: Ang talata ay nagsasaad ng karaniwang kaayusan ng gawain ng mga tao sa nilikha. Pinananatili ng “ang tao” ang generic at representative singular ng Hebreo, samantalang nililinaw ng talababa na buong sangkatauhan ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kaniyang” bilang pormal ngunit karaniwang anyo. Pinanatili ang parallel na “gawain at pagpapagal,” ngunit iniwasan sa pangunahing teksto ang mabigat na pag-uulit ng “para sa kaniyang”; nasa talababa ang mas pormal na anyo.
