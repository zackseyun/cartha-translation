  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: tl
  text: Itinatakda mo ang dilim, at nagiging gabi; sa gabi ay gumagala[a] ang lahat ng hayop sa gubat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumagapang” o “gumagalaw-galaw.” Maaaring tumukoy ang pandiwang Hebreo sa pagkilos ng mga hayop sa gabi, pati sa paggala ng mga ito upang humanap ng masisila.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: nagtatakda
  rationale: Ang pandiwa ay nangangahulugang maglagay o magtakda. Pinananatili ng “nagtatakda” ang tuwirang pagkilos ng Diyos at natural itong kaugnay ng kaayusan ng dilim at gabi.
- source_word: חֹשֶׁךְ
  choice: dilim
  rationale: Karaniwang katumbas ng salitang Hebreo at tumutukoy rito sa pagdating ng dilim bilang bahagi ng kaayusan ng sangnilikha.
- source_word: וִיהִי לָיְלָה
  choice: at sumasapit ang gabi
  rationale: Ipinahahayag ng parirala ang kalagayang bunga ng pagtatakda ng dilim. Ang “sumasapit” ay natural sa makabagong Tagalog at malinaw na naghuhudyat ng pagdating ng gabi.
- source_word: בּוֹ
  choice: sa panahong iyon
  rationale: Ang hulaping panghalip ay tumutukoy sa gabi. Ginawang temporal ang pahayag upang maging natural sa Tagalog nang hindi binabago ang tinutukoy nito.
- source_word: תִרְמֹשׂ
  choice: gumagala
  rationale: Maaaring tumukoy ang pandiwa sa paggapang o pagkilos-lakad ng mga hayop. Ang “gumagala” ay angkop sa lahat ng hayop sa gubat at hindi ipinapalagay na pawang naghahanap sila ng masisila.
- source_word: כָּל חַיְתוֹ יָעַר
  choice: ang lahat ng hayop sa gubat
  rationale: Natural at malinaw na salin ng pangkalahatang pariralang tumutukoy sa buong uri ng mga hayop na naninirahan sa gubat.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa kaayusan ng sangnilikha
  choice: Tuwirang nagtatakda ang Diyos ng dilim, at sumasapit ang gabi.
  alternative: Pinahihintulutan lamang ng Diyos na dumating ang dilim at gabi.
  rationale: Tuwirang iniuugnay ng pandiwang nasa ikalawang panauhan ang pagkilos sa Diyos. Pinananatili ito ng salin nang hindi nagdaragdag ng pilosopikal na paliwanag tungkol sa sanhi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sumasapit ang gabi” at “sa panahong iyon” para sa likas na daloy, habang pinananatili ang tuwirang pagkilos ng Diyos at ang malawak na kahulugan ng kilos ng mga hayop.
