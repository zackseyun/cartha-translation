id: PSA.101.6
reference: Psalms 101:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: tl
  text: Ang mga mata ko ay nakatuon sa mga tapat sa lupain, upang sila’y manirahang kasama ko[a]. Ang namumuhay nang may integridad[b]—siya ang maglilingkod sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang sila’y umupong kasama ko.” Ang pandiwang Hebreo ay maaaring mangahulugang “umupo” o “manirahan”; dito, malamang na ipinahihiwatig nito ang patuloy na pakikisama sa presensiya ng hari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nang walang kapintasan.” Ang “may integridad” dito ay tumutukoy sa matuwid at buong pamumuhay, hindi sa ganap na kawalan ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Ang mga mata ko ay nakatuon
  rationale: Pinananatili ang konkretong larawan ng Hebreong idyoma habang likas na ipinahahayag ang masusing pansin o pagsang-ayon.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: sa mga tapat sa lupain
  rationale: Ang נֶאֱמָן ay tumutukoy sa mga taong tapat o mapagkakatiwalaan; ang אֶרֶץ dito ay malamang na lupain o nasasakupan ng hari.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: upang manirahan silang kasama ko
  rationale: Maaaring mangahulugan ang יָשַׁב ng umupo o manirahan. Sa konteksto, ipinahihiwatig nito ang patuloy na pakikisama sa presensiya ng hari.
- source_word: הֹלֵךְ בְּדֶרֶךְ תָּמִים
  choice: Ang namumuhay nang walang kapintasan
  rationale: Ang literal na paglakad sa isang daan ay talinghaga para sa paraan ng pamumuhay. Ang תָּמִים ay integridad o matuwid na asal, hindi ganap na kawalan ng kasalanan.
- source_word: הוּא
  choice: siya ang
  rationale: 'Ipinapakita ang diin ng hiwalay na panghalip sa Hebreo: ang gayong tao mismo ang karapat-dapat maglingkod.'
- source_word: יְשָׁרְתֵנִי
  choice: maglilingkod sa akin
  rationale: Ang שׁרת ay personal na paglilingkod, na maaari ring magkaroon ng opisyal o pangkorteng diwa. Malinaw at hindi labis na panrelihiyon ang saling ito.
theological_decisions:
- issue: Moral na katangian ng mga kasama o lingkod ng hari
  choice: Inilalarawan ang pabor ng salmista sa mga tapat sa lupain at ang taong may integridad bilang karapat-dapat maglingkod sa kaniya.
  alternative: Maaaring unawain ang talata nang mas makitid bilang pagpili lamang ng mga opisyal sa korte.
  rationale: Sinasaklaw ng Hebreo kapuwa ang malapit at patuloy na pakikisama at ang opisyal na paglilingkod; hindi nililimitahan ng salin ang kahulugan sa isa lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang larawang “mga mata” at ang bahagyang pormal na diin ng “siya ang,” habang ginawang likas sa Tagalog ang talinghagang Hebreo tungkol sa paglakad bilang “namumuhay.”
