  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: tl
  text: Tuwing umaga ay lilipulin ko ang lahat ng masasama sa lupain[a], upang alisin sa lungsod ni Yahweh[b] ang lahat ng gumagawa ng kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng masasama sa daigdig.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “lupain” o “daigdig”; mas angkop dito ang “lupain” dahil sa konteksto ng pamamahala ng hari.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “ang PANGINOON.” Kabilang sa ibang anyo ang “Yahweh” at “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Tuwing umaga
  rationale: Ang anyong maramihan na may pang-ukol/pantukoy ay may paulit-ulit na diwa. Natural na ipinahahayag ng “tuwing umaga” ang pagkilos sa bawat umaga.
- source_word: אַצְמִית
  choice: lilipulin ko
  rationale: Ang Hiphil ng צמת ay tumutukoy sa pagpapahamak o lubusang pagwawakas. Ang “lilipulin” ay angkop sa maharlika at panghukom na konteksto.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: ang lahat ng masasama sa lupain
  rationale: Ang רִשְׁעֵי ay pangmaramihang substantibong pang-uri, “ang masasama.” Maaaring “lupain” o “daigdig” ang אָרֶץ; mas angkop dito ang “lupain” dahil sa konteksto ng pamamahala ng hari.
- source_word: לְהַכְרִית
  choice: upang alisin
  rationale: Ang pawatas ay nagpapahayag ng layunin ng naunang kilos. Pinananatili ng “upang alisin” ang layuning ganap na iwaksi sila mula sa lungsod, nang hindi inuulit nang mabigat ang “lilipulin.”
- source_word: מֵעִיר יְהוָה
  choice: sa lungsod ni Yahweh
  rationale: Ang מִן ay nangangahulugang pag-aalis mula sa isang lugar; natural sa Filipino ang “alisin sa lungsod.” Ipinahahayag ng “lungsod ni Yahweh” ang kaugnayang pag-aari sa maikli at marangal na paraan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: ang lahat ng gumagawa ng kasamaan
  rationale: Tapat itong nagpapahayag sa literal na “mga gumagawa ng kasamaan” sa malinaw at likas na modernong Filipino.
theological_decisions:
- issue: Saklaw ng אָרֶץ
  choice: lupain
  alternative: daigdig
  rationale: Ang tinig ng isang haring nag-aalis ng masasama sa kaniyang nasasakupan, kasunod ng pagbanggit sa lungsod ni Yahweh, ay pumapabor sa “lupain.” Gayunman, tunay na leksikal na posibilidad ang “daigdig” at pinanatili sa talababa.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo; kinikilala sa talababa ang tradisyonal at alternatibong anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lilipulin” upang mapanatili ang matinding panghukom na puwersa ng pandiwa, at ang “gumagawa ng kasamaan” upang maging natural habang malapit sa Hebreong parirala.
