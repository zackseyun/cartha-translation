  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: tl
  text: 'Kay David.[a] Isang awit.


    Aawitin ko ang tapat na pag-ibig at katarungan;

    sa iyo, Yahweh, ako''y aawit ng papuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “kay David” ay maaaring magpahiwatig na siya ang may-akda, na sa kaniya inialay ang awit, o na may kaugnayan ito sa kaniya.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ng karaniwang anyo sa mga pamagat ng awit ang saklaw ng לְ, na maaaring tumukoy sa may-akda, pinag-alayan, o kaugnayan, nang hindi ito nililimitahan sa tahasang “ni David.”
- source_word: מִזְמוֹר
  choice: Isang awit
  rationale: Likas at malinaw na katumbas sa Filipino para sa teknikal na katawagan sa isang awiting musikal sa Aklat ng mga Awit.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Sinasaklaw nito ang matibay na pag-ibig, katapatan, at awa na taglay ng חֶסֶד, lalo na sa konteksto ng tipan.
- source_word: וּמִשְׁפָּט
  choice: at katarungan
  rationale: Sa tambalan nito sa חֶסֶד at sa etikal na tema ng salmo, “katarungan” ang pinakalikas na kahulugan, habang posible rin ang “paghatol.”
- source_word: אָשִׁירָה
  choice: Aawitin ko
  rationale: Ipinahahayag ng cohortative ang kusang pasiya o hangarin; natural itong naihahatid ng panghinaharap na “Aawitin ko.”
- source_word: לְךָ
  choice: sa iyo
  rationale: Tinutukoy nito ang pinag-uukulan ng awit at papuri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֲזַמֵּרָה
  choice: ako'y aawit ng papuri
  rationale: Inihahatid ang diwa ng pag-awit o pagtugtog bilang papuri at pinananatili ang patulang paralelismo nang hindi nagiging malabo sa Filipino.
theological_decisions:
- issue: Paglalarawan sa חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa
  rationale: Hindi nililimitahan sa awa ang salitang sumasaklaw rin sa matatag na katapatan at pag-ibig, lalo na sa ugnayang may tipan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa talata mismo ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang pangalan sa salin.
- issue: Saklaw ng לְדָוִד sa pamagat
  choice: Kay David
  alternative: Ni David
  rationale: Ang “Kay David” ay hindi tahasang nagpapasiya kung ito ay pag-akda, pag-aalay, pagmamay-ari, o pagkakaugnay, kaya napapanatili ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Gumamit ng hiwalay na pamagat at dalawang linyang taludtod upang maipakita ang paralelismo ng Hebreo. Ang “ako'y” ay bahagyang patula ngunit pamilyar at angkop sa awit.
