id: PSA.101.0
reference: Psalms 101:0
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: tl
  text: 'Awit ni David.[a]


    Aawit ako tungkol sa tapat na pag-ibig at katarungan;

    sa iyo, Yahweh,[b] ako ay aawit ng papuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “kay David” ay maaaring magpahiwatig na siya ang may-akda, na inialay sa kaniya ang awit, o na kaugnay ito sa kaniya.
    reason: alternative_reading
  - marker: b
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; tradisyonal din itong isinasalin na “PANGINOON.”'
    reason: divine_name
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: Awit ni David
  rationale: Likas at maikli sa Filipino bilang pamagat. Maaaring magpahiwatig ang לְדָוִד ng pagkatha, pag-aalay, o kaugnayan kay David, kaya pinanatili sa talababa ang saklaw ng kahulugan.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matatag at mapagkakatiwalaang pag-ibig na madalas ipahiwatig ng salitang Hebreo, sa halip na paliitin lamang sa “awa.”
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Ang “katarungan” ay angkop sa malawak na etikal na diwa rito; maaari rin itong tumukoy sa paghatol o makatarungang pasiya depende sa konteksto.
- source_word: אֲזַמֵּרָה
  choice: aawit ng papuri
  rationale: Malinaw at natural itong katumbas sa Filipino ng pag-awit o pagtugtog bilang papuri, at nababagay sa patulang konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinumbasan ang personal na pangalan ng Diyos sa Hebreo sa karaniwang rekonstruksiyong “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ugnayan ni David sa awit
  choice: “Awit ni David” sa teksto, na may talababa tungkol sa saklaw ng pariralang Hebreo
  alternative: “Awit na para kay David” o “Awit na kaugnay ni David”
  rationale: Hindi tiyak sa gramatika lamang kung ang superskripsiyon ay nagsasaad ng pagkatha, pag-aalay, o kaugnayan; hindi ito dapat tahimik na pasiyahan.
- issue: Paglalahad ng banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan na nasa tekstong Hebreo, habang ipinapaliwanag sa talababa ang tradisyonal na anyong pamalit.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may payak na estrukturang patula. Ginamit ang “ako ay” sa halip na kontraksiyon upang mapanatili ang dignidad at linaw ng linya.
