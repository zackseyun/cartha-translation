  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: tl
  text: 'Hindi ako maglalagay sa harap ng aking mga mata

    ng anumang bagay na walang kabuluhan.[a]

    Kinamumuhian ko ang gawain ng mga lumilihis;[b]

    hindi iyon kakapit sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anumang kasuklam-suklam na bagay” o “anumang bagay ni Belial.” Malamang na ang Hebreong בְּלִיָּעַל dito ay nangangahulugang “walang kabuluhan” o “masama,” hindi isang pangalang pantangi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga gawa ng mga tumatalikod” o “ang gawain ng mga taong liko ang landas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: maglalagay
  rationale: Ang Qal imperfect na first-person singular ng שׂים ay nangangahulugang maglagay o magtakda. Pinananatili ng “maglalagay” ang kusang pagpapasiya ng nagsasalita.
- source_word: לְנֶגֶד עֵינַי
  choice: sa harap ng aking mga mata
  rationale: Pinananatili nito ang kongkretong larawan ng isang bagay na sadyang inilalagay sa tanaw ng nagsasalita.
- source_word: דְּבַר בְּלִיָּעַל
  choice: anumang bagay na walang kabuluhan
  rationale: Malawak ang diwa ng דְּבַר bilang bagay o usapin, at dito ang בְּלִיָּעַל ay malamang na tumutukoy sa kawalang-halaga o kasamaan, hindi sa isang pangalang pantangi. Pinananatili ng talababa ang mas matitinding posibleng kahulugan.
- source_word: עֲשֹׂה סֵטִים
  choice: ang gawain ng mga lumilihis
  rationale: Ipinapahayag ng עֲשֹׂה ang paggawa o gawain, samantalang ang סֵטִים ay tumutukoy sa mga lumilihis o tumatalikod. Pinananatili ng salin ang larawan ng paglihis nang hindi labis na tinutukoy kung anong uri nito.
- source_word: שָׂנֵאתִי
  choice: Kinamumuhian ko
  rationale: Bagaman perfect ang anyo, ipinahahayag nito rito ang matatag at nagpapatuloy na paninindigan ng salmista.
- source_word: לֹא יִדְבַּק בִּי
  choice: hindi iyon kakapit sa akin
  rationale: Ang דבק ay nangangahulugang kumapit, dumikit, o manatiling nakakabit. Ang “kakapit” ay likas sa Tagalog at pinananatili ang metapora.
theological_decisions:
- issue: Kahulugan ng בְּלִיָּעַל
  choice: Karaniwang diwa na “walang kabuluhan” o “masama,” hindi pangalang pantangi
  alternative: “anumang bagay ni Belial”
  rationale: Sa pariralang דְּבַר בְּלִיָּעַל, mas likas sa konteksto ang paglalarawan sa isang walang-halaga o masamang bagay kaysa pagtukoy sa isang pinangalanang espirituwal na nilalang. Iniiwasan nitong ipasok sa teksto ang mas huling personipikasyon kay Belial.
- issue: Tinutukoy ng panghalip sa לֹא יִדְבַּק בִּי
  choice: “iyon,” na maaaring tumukoy sa gawain o masamang bagay na nabanggit
  alternative: “sila,” bilang pagtukoy sa mga lumilihis
  rationale: Singular ang pandiwang Hebreo, kaya mas malamang na ang gawain o bagay ang hindi kakapit sa nagsasalita. Ang “iyon” ay hindi labis na nagpapasiya kung alin sa mga naunang singular na konsepto ang eksaktong tinutukoy.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang parallelism at kongkretong larawan ng “sa harap ng aking mga mata” at “kakapit sa akin.” Ginamit ang “kinamumuhian” sa halip na mas kolokyal na “ayaw na ayaw” upang umangkop sa panata at matatag na himig ng salmo.
