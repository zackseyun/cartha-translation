  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: tl
  text: Ang gumagawa ng pandaraya[a] ay hindi mananahan sa loob ng aking bahay; ang nagsasalita ng mga kasinungalingan ay hindi makatatayo sa harap ng aking mga mata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nagsasagawa ng panlilinlang.” Literal sa Hebreo, “ang gumagawa ng pandaraya,” na nagpapahiwatig ng nakagawiang mapanlinlang na asal.
    reason: lexical_alternative
  - marker: b
    text: O “hindi maitatatag sa harap ng aking mga mata.” Ang pandiwang Hebreo ay maaaring mangahulugang “maitatag” o “maging matatag”; sa kontekstong ito, malamang na ibig sabihin ay hindi pahihintulutang manatili ang gayong tao sa harapan ng nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: mananahan
  rationale: Ang pandiwang ישׁב ay maaaring mangahulugang “umupo,” “manahan,” o “manatili.” Kasama ng “sa loob ng aking bahay,” malinaw na ipinahihiwatig ng “mananahan” ang patuloy na paninirahan o tinatanggap na presensiya sa sambahayan.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: sa loob ng aking bahay
  rationale: Ang בְּקֶרֶב ay nangangahulugang “sa gitna” o “sa loob.” Natural sa modernong Tagalog ang “sa loob ng aking bahay” at pinananatili nito ang saklaw ng personal na sambahayan ng nagsasalita.
- source_word: עֹשֵׂה רְמִיָּה
  choice: ang gumagawa ng pandaraya
  rationale: Ang participle na עֹשֵׂה kasama ng רְמִיָּה ay tumutukoy sa taong palagiang nagsasagawa ng mapanlinlang na gawain. Pinananatili ng salin ang pandiwang anyo at hindi ito nililimitahan sa isang katawagang tulad ng “mandaraya.”
- source_word: דֹּבֵר שְׁקָרִים
  choice: ang nagsasalita ng mga kasinungalingan
  rationale: Pinananatili nito ang participial na anyo at ang maramihang שְׁקָרִים, pati ang pagkakapantay ng hulma sa naunang parirala.
- source_word: יִכּוֹן
  choice: makatatayo
  rationale: Sa Niphal, ang כון ay maaaring mangahulugang “maitatag,” “maging matatag,” o “makatayo.” Ang “makatatayo” ay maikli, natural, at angkop sa larawan ng isang taong nasa harapan ng hari, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: לְנֶגֶד עֵינַי
  choice: sa harap ng aking mga mata
  rationale: Pinananatili ng salin ang konkretong Hebreong larawan ng pagiging nasa harap ng mga mata ng nagsasalita, sa halip na paikliin lamang bilang “sa harap ko.”
theological_decisions:
- issue: Saklaw ng pagpapaalis ng nagsasalita sa taong mapanlinlang
  choice: Isinalin ang talata bilang personal at maharlikang pasiya tungkol sa kung sino ang maaaring manahan sa sambahayan at humarap sa nagsasalita.
  alternative: Unawain ito bilang pangkalahatang pahayag tungkol sa bahay ng Diyos o bilang talinghaga lamang ng panloob na kalinisan.
  rationale: Inilalarawan ng Awit 101 ang pasiya ng haring nagsasalita hinggil sa matuwid na pamamahala at kaayusan ng kaniyang sambahayan. Kaya pinanatili ang unang panauhang “aking bahay” at “aking mga mata” nang hindi ito ginawang mas malawak na doktrinang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Gumamit ng moderno ngunit marangal na Tagalog. Ang “mananahan” at “makatatayo” ay bahagyang mataas ang rehistro ngunit malinaw pa rin sa karaniwang mambabasa at angkop sa tonong maharlika ng awit. Inilagay ang [a] pagkatapos ng “pandaraya” at ang [b] pagkatapos ng ikalawang sugnay upang malinaw na tumukoy ang bawat talababa sa tamang parirala.
