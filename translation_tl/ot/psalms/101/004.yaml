translation:
  language: tl
  text: Ang pusong baluktot ay lalayo sa akin; hindi ko malalaman ang masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Wala akong anumang kinalaman sa masama.” Literal sa Hebreo, “Hindi ko malalaman ang masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: puso
  rationale: Sa antropolohiyang Hebreo, tumutukoy ito sa kalooban at pag-iisip ng panloob na pagkatao. Karaniwan at malinaw sa Filipino ang “puso,” at pinananatili nito ang moral na diin.
- source_word: עִקֵּשׁ
  choice: liko
  rationale: Naglalarawan ito ng moral na pagkalihis o kabuktutan. Pinananatili ng “liko” ang metapora ng paglihis sa tuwid at natural itong kaugnay ng “puso.”
- source_word: יָסוּר מִמֶּנִּי
  choice: lalayo sa akin
  rationale: Ang pandiwa at pang-ukol ay nagpapahayag ng pagtalikod o paglayo mula sa nagsasalita. Ang “lalayo sa akin” ay natural sa Filipino at tapat sa diwa ng paghihiwalay.
- source_word: רָע
  choice: ang masama
  rationale: Malawak ang saklaw nito at maaaring tumukoy sa kasamaan o sa anumang masama. Pinananatili ng “ang masama” ang pangkalahatang moral na kahulugan.
- source_word: לֹא אֵדָע
  choice: hindi ko kikilalanin
  rationale: Literal itong “hindi ko malalaman/makikilala,” ngunit sa konteksto ay maaaring magpahiwatig ng hindi pagkilala, pakikisangkot, o pakikipag-ugnayan. Ang “kikilalanin” ay nagpapanatili ng talinghagang nakaugat sa “pagkilala” nang mas natural kaysa sa “hindi ko malalaman.”
theological_decisions:
- issue: Kahulugan ng “malaman/kilalanin” kaugnay ng masama
  choice: Pinananatili ang wikang “kikilalanin,” na nagpapahayag ng pagtangging kilalanin o makisangkot sa masama.
  alternative: “Wala akong anumang kinalaman sa masama,” o ang mas literal na “Hindi ko malalaman ang masama.”
  rationale: Maaaring relational o participatory ang ידע sa kontekstong etikal. Ang saling “kikilalanin” ay hindi lubusang nilulutas ang ambiguwidad, samantalang nililinaw ng talababa ang idiomatikong implikasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maikling “pusong liko” upang mapanatili ang matingkad na metapora ng Hebreo; iniwasan ang mas teknikal o mas denominasyonal na pagpapakahulugan.
