  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: tl
  text: Bibigyang-pansin ko ang landas na walang kapintasan[a]—kailan ka darating sa akin?[b] Mamumuhay ako nang may pusong tapat sa loob ng aking bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pag-iisipan kong mabuti ang landas ng katapatan” o “Kikilos ako nang may karunungan sa landas na walang kapintasan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ganito ang tuwirang sabi ng Hebreo: “kailan ka darating sa akin?” Hindi tahasang binanggit ang simuno; marami ang umuunawa na Diyos ang kinakausap.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Bibigyang-pansin ko
  rationale: Ang Hiphil ng שׂכל ay maaaring tumukoy sa maingat na pagsasaalang-alang o sa matalinong pagkilos. Pinananatili ng “Bibigyang-pansin ko” ang kusang-loob at masusing pagtutuon nang hindi ipinipilit kung pagninilay o pagkilos ang higit na nangingibabaw.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: ang landas na walang kapintasan
  rationale: Pinananatili ng “landas” ang talinghagang etikal ng דֶּרֶךְ. Ang “walang kapintasan” ay nagpapahayag ng kabuuang katapatan sa asal, hindi ng ganap na kawalan ng kasalanan.
- source_word: מָתַי תָּבוֹא אֵלָי
  choice: kailan ka darating sa akin?
  rationale: Ang pandiwa ay nasa ikalawang panauhang panlalaking isahan, ngunit hindi tahasang binabanggit ang simuno. Pinananatili ng tuwirang tanong ang gramatika at ang sadyang hindi tinukoy na kausap.
- source_word: אֶתְהַלֵּךְ
  choice: Mamumuhay ako
  rationale: Sa Hitpael, ang הלך ay maaaring tumukoy sa paraan ng pamumuhay o pag-uugali. Mas natural sa makabagong Tagalog ang “mamumuhay” kaysa literal na “lalakad” sa kontekstong ito.
- source_word: בְּתָם לְבָבִי
  choice: nang may pusong tapat
  rationale: Ang תֹּם ay nagsasaad ng integridad, kabuuan, at kawalang-daya. Ang “pusong tapat” ay likas at malinaw na Tagalog para sa panloob na katapatan.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: sa loob ng aking bahay
  rationale: Natural na ipinahahayag nito ang lokatibong diwa ng בְּקֶרֶב at pinananatili ang tahanan bilang saklaw ng pamumuhay ng nagsasalita.
theological_decisions:
- issue: Ang ipinahihiwatig na simuno ng “kailan ka darating sa akin?”
  choice: Panatilihin ang ikalawang panauhang pagtawag nang hindi tahasang pinapangalanan ang kausap.
  alternative: Unawain ang kausap bilang Diyos; o iugnay ang sugnay nang mas impersonal sa pagdating ng landas na walang kapintasan.
  rationale: Bagaman karaniwang inuunawa na Diyos ang kinakausap, walang tahasang simuno sa Hebreo. Iniiwasan ng salin na lutasin ang isang bagay na iniwang di-tiyak ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mamumuhay” upang natural na maipahayag ang etikal na diwa ng Hebreong talinghagang “lalakad,” habang pinanatili ang “landas” sa unang sugnay. Inilapit ang mga panandang talababa sa mismong mga pariralang nililinaw ng mga ito.
