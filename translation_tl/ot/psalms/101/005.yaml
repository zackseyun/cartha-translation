  naturalness: 'Likas at malinaw ang modernong Filipino: “Ang sinumang lihim na naninirang-puri sa kapwa niya” at “hindi ko matitiis” ay maayos ang daloy at marangal ang rehistro. Ang “kapwa niya” ay angkop na malawak na katumbas ng רֵעֵהוּ.'
