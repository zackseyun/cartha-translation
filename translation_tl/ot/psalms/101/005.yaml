base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: tl
  text: Ang sinumang lihim na naninirang-puri sa kapwa niya, lilipulin ko[a]; ang may mapagmataas na tingin at palalong puso[b], hindi ko matitiis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “puputulin ko” o “pupuksa ko.”
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “mataas ang mga mata at malawak ang puso,” isang idyomang Hebreo para sa mapagmataas na anyo at palalong kalooban.'
    reason: cultural_note
lexical_decisions:
- source_word: מלושני
  choice: Ang sinumang ... naninirang-puri
  rationale: Ang anyo mula sa ugat לשׁן ay tumutukoy sa taong nagsasalita nang may masamang layunin laban sa iba. Likas sa modernong Tagalog ang “sinumang naninirang-puri” at napapanatili nito ang pangkalahatang saklaw.
- source_word: בַסֵּתֶר
  choice: lihim na
  rationale: Literal itong tumutukoy sa paggawa sa isang lihim o tagong lugar; ang “lihim na” ay malinaw at likas na pang-abay sa Tagalog.
- source_word: רֵעֵהוּ
  choice: sa kapwa niya
  rationale: Ang רֵעַ ay maaaring tumukoy sa kapitbahay, kasama, o kapwa taong malapit sa lipunan. Mas malawak at natural dito ang “kapwa” kaysa sa heograpikong “kapitbahay.”
- source_word: אַצְמִית
  choice: lilipulin ko
  rationale: Ang Hiphil ng צמת ay may matinding diwang pagpuksa o pag-alis. Pinananatili ng “lilipulin” ang tindi nang hindi tinutukoy ang eksaktong paraan ng paghatol.
- source_word: גְּבַהּ עֵינַיִם
  choice: may mapagmataas na tingin
  rationale: Literal na “mataas ang mga mata,” isang larawang Hebreo para sa kapalaluan na nakikita sa tingin o asal. Inililipat ng salin ang larawan sa natural na Tagalog.
- source_word: וּרְחַב לֵבָב
  choice: at palalong puso
  rationale: Literal na “malawak ang puso,” ngunit sa kontekstong ito ay idyoma para sa kayabangan, hindi pagiging bukas-palad. Ang “palalong puso” ang malinaw na katumbas.
- source_word: לֹא אוּכָל
  choice: hindi ko matitiis
  rationale: Literal na “hindi ko kaya,” na may ipinahihiwatig na diwa ng hindi pagtitiis o pagpapahintulot sa gayong tao. Pinananatili ng “hindi ko matitiis” ang moral na pagtanggi.
theological_decisions:
- issue: Saklaw ng paghatol sa pahayag ng hari tungkol sa wastong pamamahala
  choice: Ipinahahayag ng nagsasalita ang matibay na pasiyang alisin o lipulin ang mapanira at palalong tao, nang hindi tinutukoy ang eksaktong paraan.
  alternative: Maaaring unawain bilang tiyak na pagpatay sa gayong tao, o bilang matinding pagpapahayag lamang ng pagtangging makisama sa kaniya.
  rationale: Matindi ang אַצְמִית, samantalang ang kasunod na לֹא אוּכָל ay nagpapahayag ng hindi pagtitiis. Dapat panatilihin ang bigat ng paghatol ngunit huwag magdagdag ng paraang penal na hindi tahasang sinasabi ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kapwa” upang saklawin ang kapitbahay, kasama, o kapwa tao; “naninirang-puri” para sa malisyosong pananalita; at “lilipulin” upang mapanatili ang tindi ng pandiwang Hebreo. Lahat ng panandang talababa ay nasa pangunahing teksto.
