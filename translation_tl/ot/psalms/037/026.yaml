  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: tl
  text: 'Buong araw siyang nagpapakita ng kagandahang-loob at nagpapautang,

    at ang kanyang mga supling ay isang pagpapala.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinagpala ang kanyang mga supling.” Literal sa Hebreo, “ang kanyang mga supling [ay] para sa isang pagpapala.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Buong araw
  rationale: Pinananatili nito ang temporal na diwa ng idyomang Hebreo at, kasabay ng mga pandiwaring naglalarawan ng nakagawiang kilos, nagpapahiwatig ng patuloy o palagiang gawain.
- source_word: חוֹנֵן
  choice: nagpapakita ng kagandahang-loob
  rationale: Ipinahahayag nito ang diwa ng חנן na magpakita ng biyaya o pabor, habang natural na tumutukoy rito sa mapagbigay na pakikitungo sa kapwa.
- source_word: וּמַלְוֶה
  choice: at nagpapautang
  rationale: Ang anyong Hiphil ng לוה ay nangangahulugang magpautang, hindi mangutang; ang pandiwang Filipino ay likas at nagpapanatili sa aspektong nakagawian.
- source_word: וְזַרְעוֹ
  choice: at ang kanyang mga supling
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga anak o inapo. Ang “mga supling” ay nagpapanatili sa lawak nito nang hindi gumagamit ng literal ngunit malabong “binhi.”
- source_word: לִבְרָכָה
  choice: ay isang pagpapala
  rationale: Literal itong “para sa isang pagpapala.” Ang saling ito ay natural sa Filipino at ipinahihiwatig na ang mga supling ay pagpapala, sa halip na tahimik na gawing sila ang tumatanggap ng pagpapala.
theological_decisions:
- issue: Diwa ng pangwakas na pariralang לִבְרָכָה
  choice: ang kanyang mga supling ay isang pagpapala
  alternative: pinagpala ang kanyang mga supling
  rationale: Pinakamalapit na ipinahahayag ng pang-ukol na לְ kasama ng בְּרָכָה ang pagtatalaga o kalalabasan na “para sa isang pagpapala.” Gayunman, posible ring unawain itong nagsasabing pinagpala ang mga supling, kaya inilalahad ang alternatibo sa talababa sa halip na alisin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapakita ng kagandahang-loob” upang panatilihin ang mas malawak na diwa ng חנן, at “mga supling” upang maipahayag ang kolektibong זֶרַע.
