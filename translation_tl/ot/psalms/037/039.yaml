  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: tl
  text: Ang kaligtasan ng mga matuwid ay mula kay Yahweh[a]; siya ang kanilang kuta[b] sa panahon ng kagipitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH; tradisyonal na isinasalin na “ang PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kanlungan” o “matibay na tanggulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: kaligtasan
  rationale: Sinasaklaw ng תְּשׁוּעָה ang pagliligtas, kaligtasan, at tagumpay. Ang “kaligtasan” ay angkop sa marangal na himig ng salmo, habang nililinaw sa talababa ang kongkretong diwa ng pagliligtas.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Pangmaramihang pang-uri itong ginagamit bilang pangngalan at tumutukoy sa mga taong kinikilala sa kanilang katuwiran.
- source_word: מֵיְהוָה
  choice: mula kay Yahweh
  rationale: Ang מִן ay tumutukoy sa pinagmumulan. Likas sa Filipino ang “mula kay” kapag personal na pangalan ang kasunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na kinakatawan ng Tetragrammaton.
- source_word: מָעוּזָּם
  choice: kanilang kuta
  rationale: Ang מָעוֹז ay lugar o pinagmumulan ng lakas at proteksiyon. Pinananatili ng “kuta” ang matibay at mapagtanggol na larawan; ang hulaping pangmaramihan ay isinalin bilang “kanilang.”
- source_word: בְּעֵת
  choice: sa panahon ng
  rationale: Natural na katumbas sa modernong Filipino ng pariralang tumutukoy sa isang panahon o pagkakataon.
- source_word: צָרָה
  choice: kagipitan
  rationale: Ang צָרָה ay tumutukoy sa problema, kapighatian, o matinding kahirapan. Ang “kagipitan” ay malinaw at likas sa konteksto ng pangangailangan sa kanlungan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagpapahayag sa ikalawang sugnay na walang tahasang pandiwa
  choice: siya ang kanilang kuta
  alternative: ang kanilang kuta; si Yahweh ang kanilang kuta
  rationale: Walang nakasulat na kopula sa Hebreo. Idinagdag ang natural na “siya ang” sa Filipino upang malinaw na iugnay ang sugnay kay Yahweh nang hindi nagdaragdag ng bagong nilalaman.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa panulaan. Pinanatili ang maikling balanseng ayos ng dalawang sugnay at ang larawang pandepensa ng “kuta.”
