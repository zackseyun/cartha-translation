base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: tl
  text: Masiyahan ka kay Yahweh, at ibibigay niya sa iyo ang mga hangarin ng iyong puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga kahilingan ng iyong puso.” Ang pangngalang Hebreo ay maaaring tumukoy kapwa sa hinihiling at sa panloob na ninanais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Magalak ka
  rationale: Ang Hitpael na pautos ay nananawagan sa kausap na makasumpong at makadama ng galak; natural at marangal sa modernong Tagalog ang “Magalak ka.”
- source_word: עַל
  choice: kay
  rationale: Bagaman literal na “sa ibabaw ng/sa,” ang pang-ukol dito ay tumutukoy sa pinagtutuunan ng galak. Ang “kay Yahweh” ang natural na anyo sa Tagalog para sa personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: יִתֶּן
  choice: ibibigay niya
  rationale: Ang Qal imperfect na may pang-ugnay ay natural na nagpapahayag ng kasunod na pangako o resulta sa konteksto ng karunungang-payo.
- source_word: מִשְׁאֲלֹת
  choice: mga hangarin
  rationale: Maaaring tumukoy ang pangngalan sa mga hinihiling o sa mga ninanais. Ang “mga hangarin” ay angkop sa kaugnay na pariralang “ng iyong puso” habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: לִבֶּךָ
  choice: iyong puso
  rationale: Pinananatili ng “puso” ang larawang Hebreo para sa kalooban, pagnanasa, at panloob na pagkatao nang hindi ito pinalalawak sa pangunahing teksto.
theological_decisions:
- issue: Posibleng pagbasa sa pangako bilang walang-takdang materyal na kasaganaan
  choice: Tuwirang isalin ang pangako nang walang idinagdag na limitasyon.
  alternative: Idagdag ang “maka-Diyos na mga hangarin” o sabihing huhubugin muna ng Diyos ang mga hangarin.
  rationale: Direkta ang pahayag sa Hebreo. Ang pagdaragdag ng gayong paliwanag sa pangunahing teksto ay lulutas sa teolohikal na tensiyong hindi tahasang nilulutas ng talata.
- issue: Paglilipat ng banal na pangalan
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili rito ang banal na pangalan bilang Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, patula, at marangal. Ginamit ang “Magalak ka” sa halip na mas kolokyal na “Masiyahan ka,” at pinanatili ang tradisyonal ngunit malinaw na larawang “puso.”
