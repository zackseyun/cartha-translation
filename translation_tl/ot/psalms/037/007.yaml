  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: tl
  text: Manahimik ka sa harap ni Yahweh[a], at matiyaga kang maghintay sa kanya[b]. Huwag kang mag-alab sa galit dahil sa taong nagtatagumpay sa kanyang lakad[c]—sa lalaking nagsasagawa ng mga pakana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tumahimik ka sa harap ni Yahweh.” Maaaring idiin ng pandiwang Hebreo ang pananahimik at pagiging tahimik.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sabik na maghintay sa kanya.” Maaaring magpahiwatig ang pandiwang Hebreo ng matiyaga ngunit masidhi, at maging masakit, na paghihintay.
    reason: lexical_alternative
  - marker: c
    text: Ang “lakad” ay maaaring tumukoy sa takbo ng kanyang buhay, asal, o mga ginagawa.
    reason: clarification
lexical_decisions:
- source_word: דּוֹם
  choice: Manahimik ka
  rationale: Saklaw ng pautos na pandiwa ang pananahimik at pagpipigil sa sarili. Likas sa modernong Tagalog ang “manahimik” at naipahihiwatig nito ang tahimik na pagtitimpi sa harap ng Diyos.
- source_word: לַיהוָה
  choice: sa harap ni Yahweh
  rationale: Sa ugnayan nito sa דּוֹם, ipinapahayag ng lamed ang pagkilos sa presensiya o harapan ni Yahweh. Pinananatili ang personal na pangalang nasa tekstong Hebreo.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: at matiyagang maghintay sa kanya
  rationale: Maaaring magpahiwatig ang hitpolel ng חול ng pagkabalisa o pamimilipit, ngunit sa kontekstong ito ay tumutukoy ito sa matiyaga, at maaaring masidhing, paghihintay sa Diyos. Malinaw ang pangunahing diwa habang inilalagay sa talababa ang tunay na saklaw ng salita.
- source_word: אַל תִּתְחַר
  choice: Huwag kang mag-alab sa galit
  rationale: Ang חרה ay gumagamit ng larawan ng pag-init o pag-aalab upang ilarawan ang galit. Pinananatili ng salin ang metapora sa halip na gawing pangkalahatang “mabalisa.”
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: dahil sa taong nagtatagumpay sa kanyang lakad
  rationale: Ang בְּ ay tumutukoy sa sanhi o kinauukulan ng galit; ang participle ay nagsasaad ng pagtatagumpay, at ang דֶּרֶךְ ay nagpapanatili sa larawang “lakad” bilang takbo ng pamumuhay o ginagawa.
- source_word: בְּאִישׁ
  choice: dahil sa lalaking
  rationale: Ang אִישׁ ay panlalaking isahan. Pinananatili ang anyong panlalaki ng pinagmulan, habang kumakatawan ang tauhan sa isang uri ng tao.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: nagsasagawa ng mga pakana
  rationale: Ang parirala ay tumutukoy sa aktuwal na pagpapatupad ng pinag-isipang mga plano. Ang “pakana” ay likas sa Tagalog at angkop sa negatibong konteksto nang hindi nagdaragdag ng tahasang “masama” na wala sa pangngalan.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kasarian ng אִישׁ
  choice: lalaki
  alternative: tao o sinuman
  rationale: Panlalaking isahan ang salita sa pinagmulan. Pinananatili ito nang hindi ipinapalagay na ang aral ay para lamang sa mga lalaki.
- issue: Tindi ng paghihintay sa וְהִתְחוֹלֵל לוֹ
  choice: matiyagang maghintay sa kanya
  alternative: sabik na maghintay sa kanya / mamilipit sa paghihintay sa kanya
  rationale: Ipinakikita ng konteksto ang mapagtiis na paghihintay, ngunit maaaring taglayin ng anyong Hebreo ang matindi o masakit na pananabik. Hindi isinasama sa pangunahing linya ang “mamilipit” dahil magiging labis na literal at malabo, ngunit pinananatili ang posibilidad sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog; tuwirang pautos at may bahagyang makatang himig. Pinanatili ang metapora ng pag-aalab at ang larawan ng lakad, habang nilinaw sa mga talababa ang mahahalagang leksikal na alternatibo.
