  to: Manahimik ka sa harap ni Yahweh[a], at matiyaga kang maghintay sa kanya[b]. Huwag kang mag-alab sa galit dahil sa taong nagtatagumpay sa kanyang lakad[c]—sa lalaking nagsasagawa ng mga pakana.
