translation:
  language: tl
  text: Sapagkat tulad ng damo, mabilis silang malalanta[a], at tulad ng luntiang damo, kukupas sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tulad ng damo, mabilis silang puputulin … at tulad ng luntiang damo, malalanta sila.” Magkakalapit ang saklaw ng mga pandiwang Hebreo rito—maaaring tumukoy sa pagkatuyo, pagkupas, pagkalanta, o pagkaputol—kaya iba-iba ang pagkakahati ng larawan sa mga salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang tagubilin; likas at malinaw sa Filipino ang “Sapagkat” bilang panandang nagpapaliwanag.
- source_word: כֶחָצִיר
  choice: tulad ng damo
  rationale: Karaniwang tumutukoy ang חָצִיר sa damo o pananim; pinananatili ng “damo” ang payak na larawan ng panandaliang halaman.
- source_word: מְהֵרָה
  choice: mabilis
  rationale: Ipinahahayag nito ang bilis ng pagpanaw; tuwiran at natural ang “mabilis” sa kasalukuyang Filipino.
- source_word: יִמָּלוּ
  choice: malalanta
  rationale: Maaaring saklawin ng pandiwa ang pagkatuyo, pagkalanta, o ayon sa ibang pagsusuri ay pagkaputol. Ang “malalanta” ay angkop sa larawang halaman ngunit inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: tulad ng sariwang halaman
  rationale: Pinagsasama ng parirala ang luntiang kulay at murang pagsibol. Mas natural sa Filipino ang “sariwang halaman” kaysa sa mas mabigat na “luntiang pananim,” at iniiwasan nito ang di-kailangang pag-uulit ng “damo.”
- source_word: יִבּוֹלוּן
  choice: kukupas
  rationale: Tumutukoy ito sa pagkawala ng kasariwaan o sigla ng halaman. Ang “kukupas” ay nagbibigay ng natural na parallelismo sa “malalanta” nang lubusang pag-isahin ang dalawang pandiwa.
