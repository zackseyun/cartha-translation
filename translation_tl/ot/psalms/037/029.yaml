id: PSA.37.29
reference: Psalms 37:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: tl
  text: Ang mga matuwid ay magmamana ng lupain at maninirahan doon magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “lupain” o “daigdig”; dito, ang “lupain” ay umaangkop sa paulit-ulit na pananalita ng Awit 37.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: ang mga matuwid
  rationale: Pangmaramihang pang-uri na ginamit bilang pangngalan para sa mga taong matuwid bilang isang pangkat; natural at marangal ito sa modernong Tagalog.
- source_word: יִירְשׁוּ
  choice: magmamana
  rationale: Pinananatili nito ang diwa ng pagtanggap o pag-angkin bilang mana, kasama ang pangako at tipanang himig na umuulit sa Awit 37.
- source_word: אָרֶץ
  choice: lupain
  rationale: Maaaring mangahulugang ‘lupain’ o ‘daigdig’ ang אֶרֶץ. Mas angkop sa paulit-ulit na pananalita ng Awit 37 ang ‘lupain,’ habang pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: וְיִשְׁכְּנוּ
  choice: at maninirahan
  rationale: Ipinahihiwatig ng שׁכן ang matatag at namamalaging paninirahan; malinaw at natural ang ‘maninirahan’ sa kasalukuyang Tagalog.
- source_word: לָעַד
  choice: magpakailanman
  rationale: Tuwirang ipinapahayag nito ang walang-hanggang o patuloy na tagal sa dignified na modernong Tagalog.
- source_word: עָלֶיהָ
  choice: doon
  rationale: Tumutukoy ang hulaping pambabae pabalik sa lupain. Mas natural sa Tagalog ang ‘doon’ kaysa sa literal na ‘sa ibabaw nito’ para sa paninirahan sa isang lupain.
theological_decisions:
- issue: Saklaw ng אָרֶץ sa konteksto ng pangako
  choice: lupain
  alternative: daigdig
  rationale: Sinusuportahan ng agarang konteksto ng Awit 37 ang ‘lupain’ dahil paulit-ulit ang pangakong mamanahin ito. Gayunman, maaari ring tumukoy ang salitang Hebreo sa ‘daigdig,’ kaya hindi nilutas nang dogmatiko ang saklaw at inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang ‘mga matuwid’ at ‘magmamana’ upang mapanatili ang moral at pangakong himig ng Hebreo; ginawang idiomatiko ang עָלֶיהָ bilang ‘doon.’
