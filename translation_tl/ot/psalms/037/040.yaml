  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: tl
  text: Tinutulungan sila ni Yahweh at inililigtas sila[a]; inililigtas niya sila mula sa masasama at sinasagip sila, sapagkat nagpapakupkop sila sa kanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinasagip sila” sa dalawang paglitaw; inuulit sa Hebreo ang iisang pandiwa ng pagliligtas upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sapagkat nagtitiwala sila sa kanya”; mas literal na inilalarawan ng Hebreo ang pagpapakupkop sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעְזְרֵם
  choice: Tinutulungan sila
  rationale: Ang pandiwang עזר ay nangangahulugang tumulong o umalalay; ang pangkasalukuyang anyo ay natural sa Filipino bilang pangkalahatang buod ng pagkilos ni Yahweh.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: inililigtas sila; inililigtas niya sila
  rationale: Ang dalawang anyo ay mula sa פלט, na tumutukoy sa pagliligtas o pagpapalaya mula sa panganib. Pinanatili ang pag-uulit para maihatid ang diin ng Hebreo.
- source_word: מֵרְשָׁעִים
  choice: mula sa masasama
  rationale: Ang pangmaramihang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa masasamang tao, nang hindi kailangang idagdag sa pangunahing teksto ang salitang “tao.”
- source_word: וְיוֹשִׁיעֵם
  choice: at sinasagip sila
  rationale: Ang ישׁע ay malawak na salitang tumutukoy sa pagliligtas. Ginamit ang “sinasagip” upang manatiling malinaw at natural habang hindi inuulit sa Filipino ang parehong salitang ginamit para sa פלט.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita ang sanhi o dahilan ng pagliligtas ni Yahweh sa isang marangal at likas na rehistro.
- source_word: חָסוּ בוֹ
  choice: nanganganlong sila sa kanya
  rationale: Pinananatili ng “nanganganlong” ang larawan ng paghahanap ng kanlungan o proteksiyon, sa halip na gawing pangkalahatang “nagtitiwala.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapanatili sa inuulit na pandiwang פלט
  choice: “inililigtas sila; inililigtas niya sila”
  alternative: Pagsamahin sa iisang sugnay, gaya ng “tinutulungan at inililigtas sila”
  rationale: Magkasunod na inuulit ng Hebreo ang parehong ugat upang magbigay-diin, kaya hindi ito pinaikli o inalis.
- issue: Kahulugan ng חָסוּ בוֹ
  choice: “nanganganlong sila sa kanya”
  alternative: “nagtitiwala sila sa kanya”
  rationale: Ang konkretong talinghaga ng pagkanlong ang pangunahing diwa ng Hebreo; maaaring ipahiwatig nito ang pagtitiwala ngunit hindi iyon ipinalit sa larawan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong pag-uulit at ang talinghaga ng pagkanlong. Ang mga panghalip ay nasa karaniwang anyong “sila/kanya,” at iniwasan ang labis na arkaiko o denominasyonal na pananalita.
