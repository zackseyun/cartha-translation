  text: פִּֽי צַ֭דִּיק יֶהְגֶּ֣ה חָכְמָ֑ה וּ֝/לְשׁוֹנ֗/וֹ תְּדַבֵּ֥ר מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: tl
  text: Ang bibig ng taong matuwid ay bumibigkas ng karunungan[a], at ang dila niya ay nagsasalita ng katarungan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbubulay ng karunungan” o “marahang umuusal ng karunungan.” Ang pandiwang Hebreo ay maaaring tumukoy sa mahinang pagbigkas o pagbubulay, ngunit malamang na pasalitang pagpapahayag ang tinutukoy rito dahil kapantay nito ang “ang dila niya ay nagsasalita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “paghatol” o “kung ano ang tama.” Ang salitang Hebreo ay maaaring tumukoy sa katarungan, isang legal na pasiya, o sa bagay na matuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: Ang bibig ng taong matuwid
  rationale: Pinananatili ang konstruksiyong “bibig ng matuwid” at ang metonimiya ng bibig para sa pananalita. Ang “taong matuwid” ay likas sa modernong Filipino at kumakatawan sa pang-isahang צַדִּיק nang hindi nagdaragdag ng kasariang hindi gramatikal na ipinahahayag sa Tagalog.
- source_word: יֶהְגֶּה
  choice: bumibigkas
  rationale: Maaaring tumukoy ang הָגָה sa mahinang pagbigkas, pagbubulay, o pag-usal. Dahil bibig ang simuno at kapantay nito ang linyang tungkol sa dilang nagsasalita, nangingibabaw rito ang hayag na pagsasalita; pinananatili ng “bumibigkas” ang diwang maingat at may tinig na pagpapahayag.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwan at marangal na katumbas ng חָכְמָה bilang nilalaman ng sinasabi ng taong matuwid.
- source_word: וּלְשׁוֹנוֹ
  choice: at ang dila niya
  rationale: Tuwirang pinananatili ang larawan ng “dila” at ang paralelismo nito sa “bibig,” habang gumagamit ng likas na ayos sa modernong Filipino.
- source_word: תְּדַבֵּר
  choice: nagsasalita
  rationale: Direkta at natural na katumbas ng pandiwa sa kontekstong patula; ipinahahayag nito ang nakagawiang kilos na inilalarawan ng talata.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Saklaw ng מִשְׁפָּט ang katarungan, paghatol, pasiya, at kung ano ang tama. Sa kontekstong ito ng matuwid na pananalita, “katarungan” ang pinakamalinaw na pangunahing salin, habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Pang-isahang panlalaking anyo sa tulang karunungan
  choice: taong matuwid
  alternative: matuwid na lalaki; ang matuwid
  rationale: Panlalaki at pang-isahan sa gramatikang Hebreo ang צַדִּיק, ngunit maaari itong magkaroon ng kinatawang diwa. Walang gramatikal na kasarian ang katumbas na pangngalan at pang-uri sa Tagalog; kaya hindi idinaragdag ang “lalaki,” na maaaring magpahiwatig na lalaki lamang ang tinutukoy. Pinananatili naman ng “taong matuwid” ang pang-isahang huwarang tao.
- issue: Ugnayan ng pagbigkas at pagbubulay
  choice: bumibigkas ng karunungan
  alternative: nagbubulay ng karunungan; marahang umuusal ng karunungan
  rationale: Hindi pinipili ang panloob na pagbubulay bilang tanging kahulugan, sapagkat “bibig” ang simuno at ang kasunod na parallel na linya ay tahasang tungkol sa pagsasalita. Gayunman, kinikilala sa talababa ang lawak ng pandiwang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang patulang paralelismo ng “bibig” at “dila,” at ginamit ang karaniwang aspektong naglalarawan ng nakagawiang kilos.
