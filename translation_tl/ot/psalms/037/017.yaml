  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: tl
  text: Sapagkat ang mga bisig ng masasama ay mababali[a], ngunit inaalalayan ni Yahweh ang mga matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga bisig”; malamang na larawan ito ng lakas o kapangyarihan ng masasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag ang dahilan o paliwanag kaugnay ng naunang pahayag; natural sa makabagong Tagalog ang “Sapagkat” at napapanatili nito ang puwersang sanhi.
- source_word: זְרוֹעוֹת
  choice: mga bisig
  rationale: Literal itong tumutukoy sa mga bisig, na sa tulang Hebreo ay maaari ring kumatawan sa lakas o kapangyarihan. Pinanatili ang kongkretong larawan.
- source_word: רְשָׁעִים
  choice: ng masasama
  rationale: Pangmaramihang substantibong pang-uri para sa mga taong masama; maikli, natural, at malinaw sa Tagalog.
- source_word: תִּשָּׁבַרְנָה
  choice: ay mababali
  rationale: Ang Niphal imperfect na pambabaeng pangmaramihan ay umaayon sa “mga bisig” at nagpapahayag ng pasibong pangyayari sa hinaharap.
- source_word: וְ
  choice: ngunit
  rationale: Bagaman karaniwang “at,” adversatibo ang gamit dito dahil pinaghahambing ang sasapitin ng masasama at ang pag-alalay sa mga matuwid.
- source_word: סוֹמֵךְ
  choice: inaalalayan
  rationale: Ang participle ay nagpapahiwatig ng patuloy na pagsuporta o pagpapanatili. Natural sa Tagalog ang “inaalalayan” at angkop sa larawang ang masasama ay mababalian ng bisig samantalang ang mga matuwid ay sinusuportahan.
- source_word: צַדִּיקִים
  choice: ang mga matuwid
  rationale: Pangmaramihang substantibong pang-uri na tumutukoy sa mga taong namumuhay nang matuwid; karaniwan at malinaw ang salin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pagkabali ng mga bisig ng masasama
  choice: Pinanatili ang literal na “mga bisig ... mababali,” na may talababa tungkol sa metonimikong kahulugan.
  alternative: Isalin nang tahasan bilang “mawawasak ang lakas/kapangyarihan ng masasama.”
  rationale: Pinananatili nito ang kongkretong matulaing larawan at hindi sapilitang nilulutas kung pisikal na bisig o lakas/kapangyarihang kinakatawan nito ang pangunahing diin.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang banal na pangalan nang hindi ito ginagawang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo at malinaw na pagsalungat ng dalawang sugnay, pati ang konkretong larawang patula ng Hebreo.
