  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: tl
  text: Ngunit siya'y nagdaan[a], at narito, wala na siya; hinanap ko siya, ngunit hindi siya natagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “siya'y pumanaw.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagdaan o paglaho; dito inilalarawan nito ang biglang pagkawala ng masamang tao sa paningin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: siya'y nagdaan
  rationale: Pinananatili nito ang pangunahing diwa ng עבר na pagdaan nang hindi tiyak na ipinahihiwatig na namatay siya; sa konteksto, maaari rin itong tumukoy sa kanyang paglaho.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Napananatili ang biglang pagtawag-pansin at ang pagkagulat na ipinahihiwatig ng הִנֵּה.
- source_word: אֵינֶנּוּ
  choice: wala na siya
  rationale: Likas at maikli itong katumbas ng Hebreong idyoma para sa pagkawala o hindi na pagkanaroon, nang hindi ipinapakahulugang napawi ang pag-iral.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: hinanap ko siya
  rationale: Karaniwan at malinaw na salin ng בקשׁ sa kontekstong naghahanap ng isang taong nawala sa paningin.
- source_word: וְלֹא נִמְצָא
  choice: ngunit hindi siya natagpuan
  rationale: Pinananatili ang pasibong anyo ng Niphal at malinaw na ipinahahayag ang salungat na kinalabasan ng paghahanap.
