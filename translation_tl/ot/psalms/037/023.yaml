  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: tl
  text: Mula kay Yahweh ay pinatatatag ang mga hakbang ng isang tao, at nalulugod siya sa landas ng taong iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain na ang tao ang simuno ng “nalulugod siya”: “at nalulugod siya sa kaniyang landas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: Mula kay Yahweh
  rationale: Ang מִן ay tahasang nagsasaad ng pinagmulan o bukal ng pagkakatatag. Pinananatili ng “Mula kay Yahweh” ang ayos at diin ng Hebreo.
- source_word: מִצְעֲדֵי
  choice: mga hakbang
  rationale: Tumutukoy ito sa mga hakbang sa paglakad at, sa konteksto ng karunungan, sa takbo ng buhay.
- source_word: גֶבֶר
  choice: isang tao
  rationale: Bagaman panlalaki ang anyo ng pangngalan, ginagamit ito rito bilang pangkalahatang pagtukoy sa isang tao; natural itong naihahayag sa modernong Filipino nang hindi idinaragdag ang di-kinakailangang diwa ng lakas.
- source_word: כּוֹנָנוּ
  choice: pinatatatag
  rationale: Ang passive na anyo ng כון ay nagpapahiwatig ng pagiging matatag o tiyak; pinananatili ng “pinatatatag” ang aspektong ito at hindi ito nililimitahan sa simpleng paggabay.
- source_word: וְדַרְכּוֹ
  choice: at … sa landas nito
  rationale: Ang דרך ay maaaring literal o patalinghagang landas. Ginamit ang “nito” upang tumukoy sa tao at maiwasan ang pag-aagawan ng dalawang “siya” sa Filipino.
- source_word: יֶחְפָּץ
  choice: nalulugod siya
  rationale: Ang חפץ ay nangangahulugang malugod o masiyahan. Naiwang implicit ang simuno gaya sa Hebreo, habang ang pangunahing pagbasa ay tumutukoy kay Yahweh.
theological_decisions:
- issue: Simuno ng יֶחְפָּץ (“nalulugod”)
  choice: 'Si Yahweh ang simuno: nalulugod siya sa landas ng tao.'
  alternative: 'Maaaring ang tao ang simuno: nalulugod ang tao sa kaniyang landas.'
  rationale: Hindi tahasang binanggit sa Hebreo ang simuno. Pinakamalapit at higit na magkakaugnay ang pagtukoy kay Yahweh, ngunit tunay na posible ang pagbasa na ang tao ang simuno; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang talinghaga ng mga hakbang at landas, ang passive na diwa ng pandiwa, at ang tunay na kalabuan ng implicit na simuno sa ikalawang sugnay.
