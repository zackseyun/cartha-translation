  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: tl
  text: Iwanan mo ang galit, at talikuran ang poot; huwag kang magngitngit—hahantong lamang iyon sa paggawa ng masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling bahagi, “huwag kang magngitngit para lamang gumawa ng masama.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Iwanan mo ang galit
  rationale: Ang הֶרֶף ay utos na tumigil, bumitiw, o magparaya; sa Filipino, natural na naipapahayag ng “iwanan” ang sadyang pagtalikod sa galit. Ang אַף ay idyomatikong tumutukoy sa galit, hindi literal na ilong.
- source_word: וַעֲזֹב חֵמָה
  choice: at talikuran ang poot
  rationale: Ang עזב ay nangangahulugang iwan o talikuran, samantalang ang חֵמָה ay matinding nag-aalab na galit. Ang “poot” ay marangal at makatang katawagang naiiba sa naunang “galit.”
- source_word: אַל תִּתְחַר
  choice: huwag kang magngitngit
  rationale: Ang hitpael ng חרה ay maaaring maglarawan ng pag-iinit, pagkayamot, o matinding pagkabalisa. Ang “magngitngit” ay likas na Filipino at pinananatili ang init at tindi ng damdamin.
- source_word: אַךְ לְהָרֵעַ
  choice: hahantong lamang iyon sa paggawa ng masama
  rationale: 'Ang אַךְ ay naghihigpit sa kinalabasan (“lamang”), at ang infinitibong לְהָרֵעַ ay maaaring unawain bilang layunin o bunga: “upang gumawa ng masama” o “hahantong sa paggawa ng masama.” Pinili ang pagbasa bilang bunga ayon sa konteksto, habang inilalagay sa talababa ang mas literal na alternatibo.'
theological_decisions:
- issue: Puwersa ng huling sugnay
  choice: 'Babala tungkol sa bunga ng pagngingitngit: “hahantong lamang iyon sa paggawa ng masama.”'
  alternative: “huwag kang magngitngit para lamang gumawa ng masama”
  rationale: Maaaring ipahiwatig ng לְ + infinitibo ang layunin o bunga. Ang konteksto ng awit ay nagbababala na ang mainit na pagkabalisa ay nauuwi sa masamang gawa; gayunman, hindi tiyak ang sintaktikong ugnayan, kaya pinananatili sa talababa ang mas literal na pagbasa.
translation_notes:
  register: Modernong Filipino na may marangal at makatang himig. Ginamit ang magkaparis ngunit hindi magkaparehong “galit” at “poot,” at ang masiglang “magngitngit” upang ipakita ang tindi ng Hebreong pandiwa nang hindi gumagamit ng lipas o teknikal na pananalita.
