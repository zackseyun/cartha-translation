  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: tl
  text: Nagmamatyag[a] ang masama sa matuwid at naghahangad na patayin siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inaabangan.” Sa kontekstong ito, ang pandiwang Hebreo ay maaaring magpahiwatig ng pagmamasid na may masamang balak.
    reason: lexical_alternative
  - marker: b
    text: O “upang siya’y patayin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: nagmamatyag
  rationale: Ang pandiwaring mula sa צפה ay tumutukoy sa pagbabantay o pagmamasid. Ang “nagmamatyag” ay nagpapanatili sa batayang kahulugan at maaari ring magpahiwatig ng masamang balak ayon sa kasunod na sugnay.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Ang pang-isahang pang-uri na ginamit bilang pangngalan ay tumutukoy sa isang taong masama; natural sa Tagalog ang “ang masama” bilang kinatawang katawagan.
- source_word: לַצַּדִּיק
  choice: sa matuwid
  rationale: Pinananatili ng “matuwid” ang mahalagang kategoryang etikal ng צַדִּיק at natural itong katapat ng “masama” sa konteksto ng salmo.
- source_word: וּמְבַקֵּשׁ
  choice: at naghahangad
  rationale: Ang בקש ay karaniwang “maghanap” o “hangarin.” Dito, ang “naghahangad” ay malinaw na nagpapahayag ng layuning mapaminsala nang hindi sinasabing nagtagumpay na ito.
- source_word: לַהֲמִיתוֹ
  choice: na patayin siya
  rationale: Ang Hiphil infinitive ng מות ay literal na magdulot ng kamatayan. Ang “patayin siya” ay tuwiran, natural, at tumpak sa modernong Tagalog.
- source_word: וּ
  choice: at
  rationale: Tuwirang pinag-uugnay ng pangatnig ang pagmamatyag at paghahangad na pumatay.
