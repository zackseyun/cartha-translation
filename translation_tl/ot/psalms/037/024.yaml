id: PSA.37.24
reference: Psalms 37:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: tl
  text: Kahit siya'y mabuwal[a], hindi siya tuluyang ibubuwal, sapagkat hinahawakan ni Yahweh ang kanyang kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat kung siya'y mabuwal, hindi siya ibubuwal.” Ang pangatnig na Hebreo ay maaaring isaling “sapagkat,” “kung,” o, ayon sa konteksto, “kahit.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring isalin ang huling sugnay na “sapagkat inaalalayan ni Yahweh ang kanyang kamay.”
    reason: translation_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kahit
  rationale: 'Sa konteksto, may diwang concessive ang pangatnig: maaaring mabuwal ang matuwid, ngunit hindi siya mananatiling nakahandusay. Nananatili sa talababa ang posibilidad na unawain itong “Sapagkat” o “Kung.”'
- source_word: יִפֹּל
  choice: siya'y mabuwal
  rationale: Ang נפל ay karaniwang nangangahulugang “mahulog” o “mabuwal.” Pinananatili ng “mabuwal” ang malawak na talinghaga at hindi ito nililimitahan sa kasalanan, pisikal na panganib, o isang partikular na kabiguan.
- source_word: יוּטָל
  choice: hindi siya tuluyang ibubuwal
  rationale: Ang Hophal ng טול ay nagpapahiwatig ng pagkakahagis o pagkakabagsak. Ibinubukod ito sa naunang “mabuwal,” habang ang “tuluyang” ay naghahayag ng diwa na hindi siya pababayaang manatiling nakabagsak, nang hindi sinasabing hindi siya kailanman daranas ng pagbagsak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: סוֹמֵךְ
  choice: hinahawakan
  rationale: Ang participle ng סמך ay tumutukoy sa patuloy na pagsuporta o pag-alalay. Sa Filipino, natural ang “hinahawakan ... ang kamay” at malinaw nitong inilalarawan ang aktibong pag-alalay.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tahasang “kanyang kamay” ang Hebreo. Pinananatili ito bilang layon ng pandiwa at ang larawan ni Yahweh na umaalalay sa taong matuwid.
theological_decisions:
- issue: Talinghaga ng pagbuwal
  choice: Pangkalahatang kabiguan, kapahamakan, o paghina ng taong matuwid, nang hindi tinutukoy ang eksaktong uri nito
  alternative: Partikular na pagkakasala o espirituwal na pagtalikod; o pisikal na panganib lamang
  rationale: Hindi nililinaw ng mga pandiwang Hebreo kung moral, espirituwal, o pisikal ang pagbagsak. Pinananatili ng salin ang lawak at tensiyon ng pahayag.
- issue: Saklaw ng proteksiyon ni Yahweh
  choice: Maaaring mabuwal ang tao ngunit hindi siya tuluyang pababayaan sa kanyang pagkabuwal
  alternative: Hindi kailanman mabubuwal ang matuwid
  rationale: Malinaw na kinikilala ng unang sugnay ang posibilidad ng pagbuwal; ang ikalawa ay nangangakong aalalayan siya ni Yahweh, hindi na magiging ligtas siya sa lahat ng kabiguan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mabuwal” upang mapanatili ang talinghaga, at “hinahawakan ... ang kamay” bilang natural na paglalarawan ng patuloy na pag-alalay. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
