  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: tl
  text: Pinagtatawanan siya ng Panginoon[a], sapagkat nakikita niyang darating ang araw ng taong iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kinukutya siya.” Literal na “tumatawa” ang pandiwang Hebreo, ngunit mapanuyang pagtawa ang diwa nito sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “araw ng taong iyon” ay tumutukoy sa itinakdang araw ng pagbagsak o paghatol sa masamang tao.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ang אֲדֹנָי ay karaniwang titulong tumutukoy sa Diyos bilang Panginoon; natural at marangal itong salin sa modernong Tagalog.
- source_word: יִשְׂחַק
  choice: pinagtatawanan
  rationale: Pangunahing kahulugan ng pandiwang שׂחק ang pagtawa. Sa kayariang may לוֹ at sa konteksto ng napipintong pagbagsak ng masama, ang likas na Tagalog ay “pinagtatawanan,” na nagpapanatili sa larawan ng pagtawa at nagpapahiwatig ng mapanuyang diwa nang hindi pinapalitan ng mas interpretatibong “kinukutya.”
- source_word: לוֹ
  choice: siya
  rationale: Kasama ng “pinagtatawanan,” likas na ipinahahayag ng Tagalog na ang tinutukoy na masamang tao ang layon ng pagtawa; hindi kailangang isalin nang hiwalay ang pang-ukol ל.
- source_word: כִּי
  choice: sapagkat
  rationale: Ang unang כִּי ay nagbibigay ng dahilan sa pagtawa ng Panginoon.
- source_word: רָאָה
  choice: nakikita
  rationale: Bagaman perfect ang anyong Hebreo, ipinahahayag nito rito ang kasalukuyang pagkabatid o pagtanaw ng Diyos. Pinananatili ng “nakikita” ang pandamang larawan sa halip na gawing interpretatibong “alam.”
- source_word: כִּי
  choice: na
  rationale: Ang ikalawang כִּי ay nagpapakilala sa nilalaman ng nakikita ng Panginoon.
- source_word: יָבֹא
  choice: darating
  rationale: Ipinahahayag ng imperfect ang isang nalalapit na pangyayari sa hinaharap; natural at tuwiran sa Tagalog ang “darating.”
- source_word: יוֹמוֹ
  choice: ang araw nito
  rationale: Literal itong “ang araw niya/nito.” Ginamit ang “nito” upang malinaw na tumukoy sa masamang tao at maiwasan ang kalituhan sa naunang Diyos, habang pinananatili ang maikli at sadyang di-tahasang pahayag ng Hebreo.
theological_decisions:
- issue: Kalikasan ng pagtawa ng Diyos
  choice: Pinagtatawanan siya ng Panginoon
  alternative: Kinukutya siya ng Panginoon
  rationale: Tuwirang nangangahulugang “tumatawa” ang pandiwang Hebreo, ngunit mapanuyang pagtawa ang ipinahihiwatig ng konteksto ng paghuhukom. Pinananatili ng salin ang pangunahing larawang leksikal nang hindi ipinahihiwatig na walang saysay o malupit ang tugon ng Diyos.
- issue: Kahulugan ng “araw nito”
  choice: Pinanatili sa pangunahing teksto ang matalinghagang “araw nito”
  alternative: ang itinakdang araw ng pagbagsak o paghatol sa kanya
  rationale: Hindi tahasang binabanggit ng Hebreo ang “pagbagsak” o “paghatol,” bagaman malinaw itong ipinahihiwatig ng konteksto. Pinananatili ng pangunahing teksto ang maigsi at may tensiyong pananalita, at inilalagay ang paliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pinagtatawanan” bilang natural na katumbas ng Hebreong pandiwa at kayariang may pang-ukol. Ang “nito” ay nagpapalinaw na ang “araw” ay sa masamang tao, hindi sa Panginoon. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
