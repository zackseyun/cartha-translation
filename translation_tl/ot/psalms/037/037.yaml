  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: tl
  text: Pagmasdan ang taong walang kapintasan at tingnan ang taong matuwid, sapagkat may kinabukasan[a] ang taong mapayapa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kinabukasan” ay maaari ring isaling “kahihinatnan” o “huling kalagayan”; may ilan ding umaunawa rito bilang “mga inapo.”
    reason: lexical_alternative
  - marker: b
    text: O “ang taong may kapayapaan.” Maaari ring ipahiwatig ng “mapayapa” ang kaginhawaan o kabuuan ng kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: Pagmasdan mo
  rationale: Sa kontekstong ito, ang pautos na anyo ng שׁמר ay nangangahulugang maingat na pagtuunan ng pansin, hindi bantayan o ingatan.
- source_word: תָּם
  choice: ang taong walang kapintasan
  rationale: Tumutukoy ang תָּם sa taong may buo at matuwid na asal, hindi sa lubos na kawalan ng kasalanan. Idinagdag ang “taong” upang maging natural sa Filipino ang pangngalang gamit ng pang-uri.
- source_word: וּרְאֵה
  choice: at tingnan mo
  rationale: Pinananatili ang ikalawang pautos at ang paralelismo nito sa “Pagmasdan mo.”
- source_word: יָשָׁר
  choice: ang matuwid
  rationale: Karaniwang inilalarawan ng יָשָׁר ang moral na katuwiran; pinananatili ng “ang matuwid” ang gamit nitong pangngalan.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang dalawang pautos.
- source_word: אַחֲרִית
  choice: kinabukasan
  rationale: Maaaring tumukoy sa hinaharap, kahihinatnan, o huling kalagayan. Ang “kinabukasan” ay natural at ipinahihiwatig ang mabuting pag-asang kaiba sa wakas ng masasama sa kasunod na talata.
- source_word: לְאִישׁ
  choice: ang taong
  rationale: Bagaman panlalaking isahan ang אִישׁ, ang “tao” ang karaniwang tumpak at dignified na katumbas sa Filipino at hindi nito binubura ang pagiging isahan.
- source_word: שָׁלוֹם
  choice: mapayapa
  rationale: Dito ay inilalarawan ng שָׁלוֹם ang tao. Ang “mapayapa” ay natural na Filipino, habang ang mas malawak na diwang kagalingan at kabuuan ay inilalahad sa talababa.
theological_decisions:
- issue: Saklaw ng panlalaking isahang אִישׁ sa kasabihang pangkarunungan
  choice: ang taong
  alternative: ang lalaki
  rationale: Ang אִישׁ ay isahan at panlalaki sa gramatika, ngunit sa Filipino ang “tao” ang likas na tawag sa isang indibidwal sa ganitong pangkalahatang aral; hindi kailangang ipakahulugang lalaki lamang ang tinutukoy.
- issue: Kahulugan ng אַחֲרִית sa kapalaran ng matuwid
  choice: may kinabukasan
  alternative: may mabuting kahihinatnan / may mga inapo
  rationale: Pinananatili ng “kinabukasan” ang positibong pag-asa nang hindi tiyakang nililimitahan ang salita sa huling kalagayan o sa mga inapo. Nasa talababa ang tunay na saklaw ng kahulugan.
- issue: Paglalarawan ng אִישׁ שָׁלוֹם
  choice: ang taong mapayapa
  alternative: ang taong may kapayapaan / ang taong nasa mabuting kalagayan
  rationale: Maaaring ilarawan ng parirala ang ugali ng tao o ang kalagayang taglay niya. Pinipili ng pangunahing teksto ang natural na paglalarawan sa ugali, habang pinananatili sa talababa ang iba pang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagmasdan” at “tingnan” upang mapanatili ang dalawang magkatulad na pautos. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
