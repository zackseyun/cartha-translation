  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: tl
  text: Nasa puso niya ang kautusan ng kanyang Diyos; hindi madudulas ang kanyang mga hakbang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nasa puso niya ang turo ng kanyang Diyos; hindi matitisod ang kanyang mga hakbang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: ang kautusan ng
  rationale: Maaaring tumukoy ang תּוֹרָה sa kautusan, tagubilin, o turo. Sa konteksto ng karunungang awit, ipinahihiwatig nito ang makapangyarihang tagubilin ng Diyos; pinananatili ng “kautusan” ang bigat na tipan at moral ng salita.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Tuwirang inilalarawan ng hulaping ikatlong panauhang panlalaki ang personal na kaugnayang “kanyang Diyos.”
- source_word: בְּלִבּוֹ
  choice: nasa puso niya
  rationale: Ipinapahayag ng pariralang Hebreo na naisaloob ang kautusan. Sa gamit ng Hebreo, saklaw ng “puso” ang pag-iisip, kalooban, at panloob na pagkatao.
- source_word: לֹא תִמְעַד
  choice: hindi madudulas
  rationale: Ang מעד ay maaaring mangahulugang madulas, matisod, o mayanig. Ang aspektong di-ganap kasama ng negasyon ay likas na maisasalin dito bilang katiyakang “hindi madudulas.”
- source_word: אֲשֻׁרָיו
  choice: ang kanyang mga hakbang
  rationale: Tumutukoy ang pangngalang maramihan sa mga hakbang o yapak at nagpapanatili sa talinghaga ng matatag na pamumuhay.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa konteksto ng karunungan
  choice: kautusan
  alternative: tagubilin; turo
  rationale: Ang “kautusan” ay nagpapanatili sa awtoridad at bigat na tipan ng kalooban ng Diyos, samantalang kinikilala sa talababa ang mas malawak na kahulugang “turo.”
- issue: Panahunan o modalidad ng לֹא תִמְעַד
  choice: hindi madudulas
  alternative: hindi nadudulas
  rationale: Maaaring ipahayag ng anyong Hebreo ang pangkalahatang katotohanan o katiyakan. Ang hinaharap na anyo sa Filipino ay malinaw na naghahatid ng matatag na bunga nang hindi ginagawang ganap na imposibilidad ang talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na terminong “kautusan” at ang talinghaga ng puso at mga hakbang; inilagay ang tunay na mga alternatibong leksikal sa talababa.
