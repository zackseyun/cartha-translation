  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: tl
  text: 'Sapagkat malilipol ang masasama,

    at ang mga kaaway ni Yahweh ay tulad ng karilagan ng mga pastulan[a];

    maglalaho sila—tulad ng usok, maglalaho sila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa tradisyonal na pagpapakahulugan: “tulad ng taba ng mga kordero.” Mahirap unawain nang tiyak ang pariralang Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o sanhi na kaugnay ng naunang pahayag.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Likas at karaniwang katawagan sa modernong Tagalog para sa mga taong masama ang asal.
- source_word: יֹאבֵדוּ
  choice: malilipol
  rationale: Ipinahahayag ang pagkapahamak o lubos na pagwawakas, habang pinananatili ang aspektong hinaharap.
- source_word: וְאֹיְבֵי יְהוָה
  choice: at ang mga kaaway ni Yahweh
  rationale: Tuwirang inililipat ang pariralang konstrak at pinananatili ang personal na pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: כִּיקַר כָּרִים
  choice: tulad ng karilagan ng mga pastulan
  rationale: Pinipili ang posibleng kahulugan ng יקר bilang karilagan at כרים bilang mga pastulan; ang mahirap na parirala at tradisyonal na pagbasa ay inilalahad sa talababa.
- source_word: כָּלוּ
  choice: maglalaho sila
  rationale: Ang pag-uulit ng pandiwa ay pinananatili upang maipahayag ang diin sa ganap na pagkawala.
- source_word: בֶעָשָׁן
  choice: tulad ng usok
  rationale: Binabasa ang pang-ukol bilang paghahambing na natural sa Tagalog at kaayon ng larawan ng paglalaho.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng titulo.
- issue: Pagpapakahulugan sa כִּיקַר כָּרִים
  choice: tulad ng karilagan ng mga pastulan
  alternative: tulad ng taba ng mga kordero
  rationale: Mahirap at hindi tiyak ang pariralang Hebreo. Pinananatili sa pangunahing teksto ang pagbasa tungkol sa karilagan ng pastulan, samantalang inilalagay sa talababa ang tradisyonal na alternatibo upang hindi maitago ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo at pag-uulit ng tulang Hebreo nang hindi nagiging artipisyal ang daloy.
