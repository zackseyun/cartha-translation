  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: tl
  text: Ngunit ang mga suwail ay sama-samang lilipulin; ang kinabukasan ng masasama ay puputulin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang wakas ng masasama ay puputulin.” Ang salitang Hebreo ay maaari ring mangahulugang “kahihinatnan” o “wakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: Ngunit ang mga suwail
  rationale: Ang פֹשְׁעִים ay tumutukoy sa mga lumalabag o naghihimagsik. Likas sa makabagong Tagalog ang “mga suwail” at napapanatili nito ang diwa ng sadyang pagsalungat. Isinalin ang waw na “Ngunit” upang ihayag ang kaibahan sa kapalaran ng mga matuwid sa konteksto.
- source_word: נִשְׁמְדוּ
  choice: lilipulin
  rationale: Ang Niphal ng שׁמד ay nagsasaad ng pagkapuksa o pagkalipol. Ang “lilipulin” ay malinaw at marangal, at naipahahayag ang tindi ng hatol nang hindi nagpapasya tungkol sa metapisikal na pagkalipol.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Tuwirang ipinahahayag ng “sama-sama” ang kolektibong diwa ng יַחְדָּו at natural itong pakinggan sa Tagalog.
- source_word: אַחֲרִית
  choice: kinabukasan
  rationale: Maaaring tumukoy ang אַחֲרִית sa kinabukasan, kahihinatnan, o wakas. Sa paghahambing ng hantungan ng matuwid at masama, malinaw na naipahahayag ng “kinabukasan” ang nalalabing pag-asa o hantungan ng masasama habang pinananatili sa talababa ang alternatibong “wakas.”
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Ang “masasama” ay karaniwan, malinaw, at angkop na katumbas ng רְשָׁעִים bilang kategoryang moral sa panulaang karunungan.
- source_word: נִכְרָתָה
  choice: puputulin
  rationale: Pinananatili ng “puputulin” ang konkretong idyoma ng Niphal ng כרת, sa halip na patagin ito bilang simpleng “wawasakin.”
theological_decisions:
- issue: Kahulugan ng אַחֲרִית sa konteksto ng paghatol
  choice: ang kinabukasan ng masasama ay puputulin
  alternative: ang wakas ng masasama ay puputulin; ang salinlahi ng masasama ay puputulin
  rationale: Saklaw ng אַחֲרִית ang kinabukasan, kahihinatnan, wakas, at kung minsan ay salinlahi. Pinakamalinaw sa konteksto ng magkaibang hantungan ang “kinabukasan,” ngunit hindi tiyak na iyon lamang ang saklaw; kaya inilalahad sa talababa ang lehitimong “wakas” at “kahihinatnan” nang hindi pinipili ang doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago at dignified na Filipino; payak para sa karaniwang mambabasa ngunit pinananatili ang matinding imahen ng paglipol at pagkaputol. Ginamit ang aspektong panghinaharap upang natural na maipahayag sa Tagalog ang ipinahahayag na hantungan.
