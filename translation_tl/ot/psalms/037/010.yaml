base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: tl
  text: Kaunti na lamang ang panahon, at wala na ang masama[a]; kapag tiningnan mong mabuti ang lugar niya, wala na siya roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ang masasama.” Ang pang-isahang anyo sa Hebreo ay maaaring gamitin sa pangkalahatan o bilang kinatawan ng isang uri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: Kaunting panahon na lamang
  rationale: Ipinahahayag ng parirala ang maikling panahong nalalabi; natural ito sa modernong Tagalog at pinananatili ang pananaw sa hinaharap.
- source_word: וְאֵין רָשָׁע
  choice: mawawala na ang taong masama
  rationale: Ang eksistensiyal na pagtanggi ay may inaasahang katuparan sa konteksto. Ang 'mawawala na' ay malinaw na nagsasaad na hindi na siya matatagpuan o naroroon, nang hindi kinakailangang tukuyin ang paraan ng pagkawala.
- source_word: רָשָׁע
  choice: ang taong masama
  rationale: Ang pang-isahang panlalaking anyo ay substantibo at maaaring kumatawan sa isang uri ng tao. Ang 'taong masama' ay natural, dignidad, at hindi nagpapahiwatig na lalaki lamang ang saklaw.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: kahit hanapin mong mabuti
  rationale: Ang hitpolel ng בין ay nagpapahiwatig ng masusi o mapanuring pagmamasid. Sa kongkretong larawan ng paghahanap sa dating kinaroroonan, natural ang 'hanapin mong mabuti'; ipinakikita ng 'kahit' ang diwang konsesibo ng konteksto.
- source_word: עַל מְקוֹמוֹ
  choice: ang kaniyang kinaroroonan
  rationale: Tumutukoy ito sa lugar na iniugnay sa taong masama. Mas natural sa Tagalog ang 'kaniyang kinaroroonan' kaysa literal na 'kaniyang lugar' sa kontekstong ito.
- source_word: וְאֵינֶנּוּ
  choice: wala na siya roon
  rationale: Muling idinidiin ng huling sugnay ang pagkawala niya mula sa dating kinaroroonan; maikli at malinaw ang salin.
theological_decisions:
- issue: Kung indibidwal o kolektibo ang רָשָׁע
  choice: 'Pinanatili sa pangunahing teksto ang kinatawang pang-isahan: ''ang taong masama.'''
  alternative: 'Maaaring unawain bilang pangkalahatan o kolektibo: ''ang masasama.'''
  rationale: Pang-isahan ang anyong Hebreo ngunit madalas itong gamitin bilang kinatawan ng isang uri. Hindi dapat tahimik na alisin ang tunay na saklaw na ito, kaya nilinaw sa talababa ang kolektibong posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'kaniyang' para sa pormal ngunit madaling maunawaang rehistro; iniwasan ang sobrang literal na ayos na magiging matigas sa Tagalog.
