translation:
  language: tl
  text: Nakita ko ang isang masama at malupit na tao na yumayabong gaya ng luntiang punong katutubo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nakita ko ang isang masama at malupit na tao na lumalawak, gaya ng isang malagong punong katutubo.” Mahirap unawain ang pananalitang Hebreo; malamang na ipinahihiwatig nito ang isang punong masiglang tumutubo sa sarili nitong lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Ang Qal perfect na unang panauhan ay likas na isinasalin sa Filipino bilang payak na naganap. Nananatili rito ang himig ng personal na patotoo ng mang-aawit.
- source_word: רָשָׁע
  choice: taong masama
  rationale: Tumutukoy ito sa isang taong masama sa moral na diwa. Ang paglalagay ng “taong” ay ginagawang malinaw at natural ang pangngalang gamit ng pang-uri sa Filipino.
- source_word: עָרִיץ
  choice: malupit
  rationale: Ipinahihiwatig ng salita ang isang makapangyarihan, mapaniil, at nakatatakot na tao. Ang “malupit” ay malinaw sa karaniwang Filipino at hindi nililimitahan ang kahulugan sa pisikal na karahasan lamang.
- source_word: וּמִתְעָרֶה
  choice: na yumayabong
  rationale: Inilalarawan ng Hitpael participle ang paglawak o masaganang paglago. Ang “yumayabong” ay likas sa larawang-puno at naipahahayag ang hayag na pag-unlad ng masamang tao, bagaman hindi nito tahasang tinutularan ang reflexive na anyo ng Hebreo.
- source_word: כְּאֶזְרָח
  choice: gaya ng ... punong katutubo
  rationale: Karaniwang nangangahulugan ang אֶזְרָח ng “katutubo” o “isinilang sa lupain.” Sa paghahambing na ito, malamang na ipinahihiwatig ang punong tumutubo sa sarili nitong lupain; idinagdag ang “puno” upang maging malinaw ang larawang patula.
- source_word: רַעֲנָן
  choice: luntian
  rationale: Naglalarawan ito ng sariwa, masigla, at mayamang paglago ng halaman. Pinananatili ng “luntian” ang kongkretong larawang-puno habang ipinahihiwatig ang kasaganaan nito.
