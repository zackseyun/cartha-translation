  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: tl
  text: Maghintay ka nang may pagtitiwala kay Yahweh[a] at sundin mo ang kanyang daan. Itataas ka niya upang manahin mo ang lupain[b][c]; kapag pinawi ang masasama, makikita mo iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Umasa ka kay Yahweh” o “Maghintay ka kay Yahweh.” Ang pandiwang Hebreo ay tumutukoy sa matiyaga at may-pananabik na pagtitiwala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “daigdig.” Ang salitang Hebreo na אָרֶץ ay maaaring mangahulugang “lupain” o “daigdig.” Pinili rito ang “lupain” dahil paulit-ulit na ginagamit sa Awit 37 ang pananalita tungkol sa pagmamana ayon sa tipan.
    reason: alternative_reading
  - marker: c
    text: Ihambing sa Mateo 5:5, kung saan muling lumilitaw ang pangakong mamanahin ang daigdig o lupain.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: Maghintay ka
  rationale: Ipinahahayag ng pautos na pandiwa ang matiyaga at may-pagtitiwalang paghihintay kay Yahweh. Mas tuwirang pinananatili ng “maghintay” ang aspekto ng pagtitiis kaysa sa “umasa” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: שְׁמֹר דַּרְכּוֹ
  choice: sundin mo ang kanyang daan
  rationale: Sa Filipino, natural na ipinahahayag ng “sundin ang kanyang daan” ang matapat na pamumuhay ayon sa landas at kalooban ni Yahweh; iniiwasan nito ang di-likas na literal na “bantayan ang kanyang daan.”
- source_word: וִירוֹמִמְךָ
  choice: Itataas ka niya
  rationale: Pinananatili nito ang larawan ng pagtataas, karangalan, at pagpapawalang-sala na taglay ng Hiphil ng רום.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: upang manahin mo ang lupain
  rationale: Pinananatili ng “manahin” ang pahiwatig ng tipan, at ang “lupain” ay umaayon sa paulit-ulit na pangako ng mana sa Awit 37, habang inilalagay sa talababa ang lehitimong kahulugang “daigdig.”
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: kapag nilipol na ang masasama
  rationale: Ipinahahayag ng pariralang may ב ang panahon ng pangyayari. Ang “nilipol” ay natural sa Filipino at naghahatid ng matinding hudisyal na diwa ng pagkaputol o pag-alis, nang hindi gumagamit ng di-likas na literal na “pinutol ang masasama.”
- source_word: תִּרְאֶה
  choice: makikita mo iyon
  rationale: Ang “iyon” ay idinagdag para sa likas at malinaw na Filipino, na tumutukoy sa pagkalipol ng masasama; wala itong hiwalay na katumbas na salita sa Hebreo.
theological_decisions:
- issue: Kahulugan ng אָרֶץ sa konteksto ng tipan at karunungan
  choice: lupain
  alternative: daigdig
  rationale: Ang “lupain” ang higit na umaayon sa konteksto ng Lumang Tipan at sa paulit-ulit na pananalita tungkol sa pagmamana sa Awit 37. Gayunman, tunay ding kahulugan ng אָרֶץ ang “daigdig,” kaya pinanatili ito bilang alternatibo sa talababa at hindi isinara ang mas malawak na pag-unawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sundin ang kanyang daan” at “nilipol” upang maging likas sa karaniwang mambabasa habang pinananatili ang larawan, bigat, at teolohikal na tensiyon ng Hebreo.
