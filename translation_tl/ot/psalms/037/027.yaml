  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: tl
  text: Lumayo ka sa kasamaan, gumawa ka ng mabuti, at manirahan ka magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, ayon sa paulit-ulit na tema ng awit, “at manirahan ka sa lupain magpakailanman” o “at mamuhay kang panatag magpakailanman.” Hindi tahasang binabanggit sa Hebreo ang “sa lupain.”
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: Lumayo ka
  rationale: Ang pautos na pandiwa ay nangangahulugang lumihis o lumayo. Natural sa modernong Filipino ang “lumayo ka” at malinaw nitong ipinahahayag ang sinasadyang pagtalikod.
- source_word: מֵרָע
  choice: sa masama
  rationale: Ang מִן kasama ng רַע ay tumutukoy sa bagay na nilalayuan. Sa kontekstong etikal, natural ang “sa masama.”
- source_word: וַעֲשֵׂה טוֹב
  choice: at gumawa ka ng mabuti
  rationale: Pinananatili nito ang anyong pautos at ang tuwirang pagtutumbas ng masama at mabuti.
- source_word: וּשְׁכֹן
  choice: at manirahan ka
  rationale: Ang pandiwa ay karaniwang tumutukoy sa paninirahan o pananatili sa isang lugar. Mas natural sa kasalukuyang Filipino ang “manirahan” kaysa “tumahan,” habang napapanatili ang larawan ng matatag na paninirahan.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag nito ang pangmatagalan o walang hanggang pagpapatuloy at tuwirang nakakabit sa pautos na “manirahan.”
theological_decisions:
- issue: Kahulugan ng וּשְׁכֹן לְעוֹלָם
  choice: “at manirahan ka magpakailanman” nang hindi dinaragdagan ang hindi tahasang binanggit na lugar
  alternative: “at manirahan ka sa lupain magpakailanman” o “at mamuhay kang panatag magpakailanman”
  rationale: Sunod-sunod na pautos ang nasa Hebreo. Paulit-ulit na tema sa Awit 37 ang paninirahan sa lupain, ngunit walang tahasang layon na “lupain” sa talatang ito. Kaya pinananatili sa pangunahing teksto ang maikli at bukas na pahayag, at inilalagay sa talababa ang kontekstuwal na pagbasa.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “manirahan” upang mapanatili ang larawan ng paninirahan nang hindi maging lipas ang himig. Ang mga pautos ay nilinaw sa pamamagitan ng “ka,” at hindi tahasang idinagdag sa pangunahing teksto ang “sa lupain.”
