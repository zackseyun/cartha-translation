  yaml_path: translation/ot/psalms/037/006.yaml
  text: He will bring forth your righteousness like the light[b][a], and your justice like the noonday.
translation:
  language: tl
  text: Ilalantad niya ang iyong katuwiran[a] na gaya ng liwanag, at ang iyong katarungan[b] na gaya ng katanghaliang-tapat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapatunay na ikaw ay nasa tama” sa halip na “iyong katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: O “iyong usapin” sa halip na “iyong katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ilalantad niya
  rationale: Ang Hiphil ng יצא ay nagsasaad na may pinangyayaring lumitaw o mahayag. Ang “Ilalantad niya” ay natural sa Filipino at malinaw na ipinapakita ang ginagawang hayag ng Diyos.
- source_word: כָאוֹר
  choice: na gaya ng liwanag
  rationale: Pinananatili nito ang paghahambing na ipinahihiwatig ng כ at ang larawan ng isang bagay na malinaw na nakikita.
- source_word: צִדְקֶךָ
  choice: ang iyong katuwiran
  rationale: Maaaring tumukoy ang צדק sa katuwiran, pagiging nasa tama, o pagpapatunay na nasa tama ang isang tao. Pinananatili sa pangunahing teksto ang mas tuwirang “katuwiran,” habang inilalagay sa talababa ang kontekstuwal na alternatibo.
- source_word: וּמִשְׁפָּטֶךָ
  choice: at ang iyong katarungan
  rationale: Malawak ang saklaw ng משפט at maaaring mangahulugang hatol, katarungan, o usaping ipinaglalaban. Ang “katarungan” ay nagpapanatili ng leksikal na lawak at ng parallelismo sa “katuwiran.”
- source_word: כַצָּהֳרָיִם
  choice: na gaya ng katanghaliang-tapat
  rationale: Ang צהריים ay tumutukoy sa tanghali. Ang “katanghaliang-tapat” ay likas at marangal na pananalita sa Filipino at nagpapahiwatig ng pinakamaningning na bahagi ng araw.
