  source_fidelity: 'Tapat ang salin sa Hebreo: ang וְהוֹצִיא ay naipahahayag bilang gagawing hayag o ilalantad, at napapanatili ang dalawang paghahambing na “gaya ng liwanag” at “gaya ng katanghaliang-tapat.” Ang “katuwiran” para sa צִדְקֶךָ at “katarungan” para sa מִשְׁפָּטֶךָ ay kapwa nasa saklaw ng mga salita sa kontekstong ito, nang hindi isinasara ang posibleng diwang vindication o just cause.'
