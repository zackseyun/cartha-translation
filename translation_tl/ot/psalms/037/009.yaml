  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: tl
  text: 'Sapagkat aalisin ang mga gumagawa ng masama,

    ngunit ang mga naghihintay kay Yahweh—

    sila ang magmamana ng lupain.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lupa.” Ang salitang Hebreo ay maaaring mangahulugang “lupain” o “ang lupa”; dito, higit na angkop sa konteksto ng tipan sa awit ang “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Likas na ipinahahayag sa Filipino ang paliwanag o batayan ng naunang pangaral.
- source_word: מְרֵעִים
  choice: ang mga gumagawa ng masama
  rationale: Malinaw at karaniwang pananalita para sa participial na katawagang tumutukoy sa mga taong gumagawa ng kasamaan.
- source_word: יִכָּרֵתוּן
  choice: ay lilipulin
  rationale: Ipinahahayag ang pag-aalis sa mga gumagawa ng masama. Mas natural ito kaysa sa literal na 'puputulin,' bagaman bahagyang mas tiyak ang dating nito.
- source_word: וְקֹוֵי
  choice: ngunit ang mga naghihintay kay
  rationale: Pinananatili ng 'naghihintay' ang diwa ng matiyagang paghihintay na may pag-asa; ang 'ngunit' ay natural na naghahayag ng pagsalungat ng dalawang pangkat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הֵמָּה
  choice: sila ang
  rationale: Ipinakikita ang diin ng hiwalay na panghalip sa Hebreo sa natural na paraang Filipino.
- source_word: יִירְשׁוּ
  choice: magmamana
  rationale: Pinananatili ang diwang pangako at tipan ng pandiwa, sa halip na ang mas neutral na 'magmamay-ari.'
- source_word: אָרֶץ
  choice: lupain
  rationale: Ang konteksto ng Awit 37 ay umaalingawngaw sa pangakong tipan tungkol sa lupain, ngunit maaari ring tumukoy ang salita sa buong lupa; inilalahad ang alternatibo sa talababa.
theological_decisions:
- issue: Saklaw ng אָרֶץ sa pangako
  choice: lupain
  alternative: lupa o buong daigdig
  rationale: Mas akma sa agarang konteksto ng awit at sa wikang pangtipan ang 'lupain,' ngunit hindi ganap na nilulutas ng Hebreo kung limitado lamang dito ang saklaw. Kaya pinananatili sa talababa ang mas malawak na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang paghahanay at gitling upang mapanatili ang diin sa הֵמָּה nang hindi nagiging matigas ang pangungusap.
