  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: tl
  text: Hindi siya pababayaan[a] ni Yahweh sa kamay ng masamang tao,[b] ni hahatulang may sala[c] kapag nilitis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iiwan” o “tatalikuran” sa halip na “pababayaan.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kanyang kamay”; tumutukoy ito sa kamay ng masamang tao, samakatuwid, sa kanyang kapangyarihan o kontrol.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “ipahahayag na may sala” o “kokondenahin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יַעַזְבֶנּוּ
  choice: hindi siya pababayaan
  rationale: Ang עזב ay maaaring mangahulugang iwan, pabayaan, o talikuran. Likas sa makabagong Filipino ang “pababayaan” at angkop ito sa pangakong hindi ipauubaya ng Diyos ang matuwid sa masama.
- source_word: בְיָדוֹ
  choice: sa kamay nito
  rationale: Pinananatili ang literal na larawan ng Hebreong “sa kanyang kamay.” Ginamit ang “nito” upang tumukoy sa masamang tao sa naunang konteksto nang hindi pinapalitan ang idyoma ng tahasang interpretasyong “sa kapangyarihan nito.”
- source_word: יַרְשִׁיעֶנּוּ
  choice: hahatulang salarin
  rationale: Ang Hiphil ng רשע ay may legal na diwang magpahayag na nagkasala o humatol bilang salarin. Ang “hahatulang salarin” ay malinaw at pinananatili ang forensic na himig.
- source_word: בְּהִשָּׁפְטוֹ
  choice: kapag nilitis siya
  rationale: Ang ב na sinusundan ng infinitive construct ng שפט at hulaping panghalip ay temporal dito. Ang “kapag nilitis siya” ay natural sa Filipino at hindi nagtatakda ng uri o lugar ng hukuman.
theological_decisions:
- issue: Tinutukoy ng mga panghalip sa talata
  choice: Ang “siya” ay tumutukoy sa matuwid na tao, samantalang ang “nito” sa “kamay nito” ay tumutukoy sa masamang tao sa naunang konteksto.
  alternative: Unawain ang mga tauhan sa pangkalahatan bilang sinumang matuwid at masama, nang hindi binibigyang-diin ang panlalaking anyo ng Hebreo.
  rationale: Ipinagpapatuloy ng mga panlalaking pang-isahang panghalip sa Hebreo ang paghaharap sa matuwid at masamang tao sa konteksto. Hindi ginagawang tahasan sa mismong talata ang pangngalang “masama,” kaya napapanatili rin ang anyo at bahagyang pagdepende sa konteksto.
- issue: Legal na diwa ng ikalawang hanay
  choice: Hindi hahatulan ni Yahweh na salarin ang matuwid kapag nilitis siya.
  alternative: Hindi pahihintulutan ni Yahweh na ituring siyang masama.
  rationale: Ang pagsasama ng Hiphil רשע at שפט ay malinaw na may legal o panghukuman na diwa. Pinananatili ito nang hindi ipinapasok ang mas huling mga sistematikong kategoryang teolohikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pangalang “Yahweh,” ang larawang “sa kamay,” at ang legal na himig ng ikalawang sugnay. Ginamit ang “nito” upang ihiwalay ang kamay ng masamang tao mula sa matuwid na tinutukoy ng “siya,” habang nananatiling umaasa sa konteksto ang talata.
