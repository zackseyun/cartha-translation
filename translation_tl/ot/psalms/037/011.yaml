translation:
  language: tl
  text: Ngunit mamanahin ng mga mapagpakumbaba[a] ang lupain[b], at magagalak sila sa saganang kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maaamo.”
    reason: lexical_alternative
  - marker: b
    text: O “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: mga mapagpakumbaba
  rationale: Tumutukoy ito sa mga aba o mababang-loob. Likas at malinaw sa modernong Filipino ang “mga mapagpakumbaba,” habang pinananatili sa talababa ang “maaamo” bilang lehitimong alternatibo at mahalagang ugnay sa Mateo 5:5.
- source_word: יִירְשׁוּ
  choice: mamanahin
  rationale: Pinananatili ng “mamanahin” ang panghinaharap na diwa at ang kaugnayan ng pandiwa sa pamana at tipanang pag-aari, sa halip na gawing payak lamang na “aangkinin.”
- source_word: אָרֶץ
  choice: ang lupain
  rationale: Maaaring mangahulugan ang salita ng “lupain” o “daigdig.” Sa Awit 37, ang paulit-ulit na pagmamana at paninirahan sa lupain ang pumapabor sa “lupain,” ngunit pinananatili sa talababa ang mas malawak na “daigdig.”
- source_word: וְהִתְעַנְּגוּ
  choice: at lubos silang magagalak
  rationale: Ipinahahayag ng anyong Hitpael ang masidhing pagkagalak o pagkalugod. Natural sa Filipino ang “lubos silang magagalak” at naipakikita ang tindi ng kasiyahan nang hindi pilit ang literal na anyong pasarili.
- source_word: עַל
  choice: sa
  rationale: Bagaman may literal na saklaw na “sa ibabaw ng/dahil sa,” ang “sa” ang likas na pang-ukol sa Filipino kasunod ng “magagalak” at ng abstraktong pangngalang “kapayapaan.”
- source_word: רֹב
  choice: saganang
  rationale: Ipinahahayag ng “sagana” ang kasaganaan o kalakhan at natural itong panuring sa “kapayapaan.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ito ang pamantayan at maikli ngunit malawak na salin, na sa konteksto ay sumasaklaw sa katiwasayan at mabuting kalagayan.
theological_decisions:
- issue: Ugnay sa Mateo 5:5 at sa tradisyonal na saling “ang maaamo ang magmamana ng lupa/daigdig”
  choice: Isinalin ang Hebreo bilang “mga mapagpakumbaba ... ang lupain” sa pangunahing teksto, na may “maaamo” at “daigdig” bilang mga alternatibo sa talababa.
  alternative: Ang maaamo ang magmamana ng daigdig.
  rationale: Inuuna nito ang pinakamalamang na kahulugan sa konteksto ng Hebreong Awit 37 nang hindi ikinukubli ang mga lehitimong salitang nagpapanatili sa kilalang ugnay sa Mateo 5:5.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Ngunit” para sa malinaw na paghahambing, “mamanahin” upang mapanatili ang tipanang diwa, at “lubos silang magagalak” bilang natural na paglilipat ng masidhing/reflexive na pandiwang Hebreo.
