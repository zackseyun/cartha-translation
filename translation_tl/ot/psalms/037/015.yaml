  yaml_path: translation/ot/psalms/037/015.yaml
  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: tl
  text: 'Ang kanilang tabak ay tatagos sa sarili nilang puso[a],

    at ang kanilang mga pana ay mababali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili nilang mga puso.” Isahan ang “puso” sa Hebreo bagaman maramihan ang nagmamay-ari; karaniwan itong kolektibong pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: ang kanilang tabak
  rationale: Isahan ang pangngalang חֶרֶב na may hulaping pangmaramihan; pinananatili ng “kanilang tabak” ang kolektibo o distributibong diwa ng Hebreo.
- source_word: תָּבוֹא
  choice: ay tatagos
  rationale: Ang karaniwang diwang “darating/papasok” ng בוא, kapag iniugnay sa tabak at puso, ay likas na nangangahulugang pagtagos sa kontekstong ito.
- source_word: בְלִבָּם
  choice: sa sarili nilang puso
  rationale: Ang בְּ ay may diwang “sa/loob ng,” at nililinaw ng “sarili” ang kontekstuwal na pagbaling ng sandata laban sa mga may-ari nito nang hindi binabago ang kahulugan.
- source_word: וְקַשְּׁתוֹתָם
  choice: at ang kanilang mga pana
  rationale: Maramihan ang קַשְּׁתוֹת na may hulaping “kanila”; ang “mga pana” ang karaniwang modernong Tagalog para sa mga busog na sandata sa kontekstong ito.
- source_word: תִּשָּׁבַרְנָה
  choice: ay mababali
  rationale: Ang Niphal imperfect ay nagpapahayag na ang mga pana ay babali o babasagin; “mababali” ang tuwiran at likas na anyong pasibo/resultatibo sa Tagalog.
