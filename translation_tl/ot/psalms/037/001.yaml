  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: tl
  text: 'Kay David.[a]


    Huwag kang mag-init dahil sa masasama;

    huwag kang mainggit sa mga gumagawa ng kalikuan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ni David” o “Para kay David.” Maaaring ipahiwatig ng Hebreong pananda ang pagkakatha, kaugnayan, o paghahandog.
    reason: textual_or_grammatical_ambiguity
  - marker: b
    text: Maaari ring “sa mga gumagawa ng kawalang-katarungan” o “sa mga gumagawa ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ng “Kay David” ang maikli at malawak na ugnayang ipinahihiwatig ng לְ, na maaaring tumukoy sa pagkakatha, kaugnayan, o paghahandog, nang hindi ito nililimitahan sa “Isinulat ni David.”
- source_word: אַל
  choice: Huwag
  rationale: Ang אַל na may imperfect ay nagpapahayag ng pagbabawal; “Huwag” ang natural at tuwirang katumbas sa Tagalog.
- source_word: תִּתְחַר
  choice: mag-init
  rationale: Ang hitpael ng חרה ay literal na naglalarawan ng pag-iinit at maaaring mangahulugang mabalisa, mainis, o magalit. Pinananatili ng “mag-init” ang talinghaga at lawak ng kahulugan ng Hebreo.
- source_word: בַּמְּרֵעִים
  choice: dahil sa masasama
  rationale: Ang בְּ dito ay tumutukoy sa sanhi o dahilan ng pag-iinit. Natural sa Tagalog ang “dahil sa,” at ang “masasama” ay malinaw na tumutukoy sa mga taong gumagawa ng masama.
- source_word: תְּקַנֵּא
  choice: mainggit
  rationale: Sa konteksto ng salmo, ang קנא ay tumutukoy sa pagkainggit sa mga masama, kaya “mainggit” ang pinakanatural na katumbas.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: sa mga gumagawa ng kalikuan
  rationale: Pinananatili ng “mga gumagawa” ang aktibong participial na anyo ng עֹשֵׂי, habang ang “kalikuan” ay dignificado at sapat na malawak para sa עַוְלָה, na maaaring tumukoy sa mali, kawalang-katarungan, o kasamaan.
