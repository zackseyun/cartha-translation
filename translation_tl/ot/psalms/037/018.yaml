  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: tl
  text: Alam ni Yahweh ang mga araw ng mga taong walang kapintasan[a], at ang kanilang mana ay magiging walang hanggan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga matuwid” o “mga buo ang loob.” Tumutukoy ito sa mga taong may integridad; hindi nito kailangang ipahiwatig na ganap silang walang kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at ang kanilang mana ay magiging magpakailanman.” Maaaring ipahiwatig ng parirala ang namamalaging pag-aari o ang pagiging permanente nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יוֹדֵעַ
  choice: Alam
  rationale: Tuwirang ipinapahayag ng participle ang patuloy at mapagmalasakit na pagkilala ni Yahweh; hindi na idinagdag sa salin ang mga posibleng implikasyong gaya ng ‘binabantayan.’
- source_word: יְמֵי
  choice: ang mga araw ng
  rationale: Pinananatili ang konkretong idyomang Hebreo, na sa konteksto ay maaaring tumukoy sa haba o takbo ng buhay.
- source_word: תְמִימִם
  choice: mga walang kapintasan
  rationale: Ipinahihiwatig nito ang kabuuan ng loob at integridad sa kontekstong karunungan, nang hindi kinakailangang mangahulugan ng ganap na kawalan ng kasalanan.
- source_word: נַחֲלָתָם
  choice: ang kanilang mana
  rationale: Ang ‘mana’ ay natural sa modernong Filipino at nagpapanatili sa diwang legal, kongkreto, at tipanang nakapaloob sa נַחֲלָה.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na katumbas sa Filipino ng pananatili nang walang hanggan.
- source_word: תִּהְיֶה
  choice: ay mananatili
  rationale: Bagaman literal na ‘ay magiging,’ mas natural sa Filipino ang ‘mananatili’ sa ugnayan nito sa mana at sa לְעוֹלָם; nililinaw nito ang pagpapatuloy nang hindi binabago ang pangunahing diwa.
theological_decisions:
- issue: Kahulugan ng ‘mga walang kapintasan’ sa kontekstong karunungan
  choice: Mga taong namumuhay nang may integridad
  alternative: Mga taong ganap na walang kasalanan; mga matuwid; mga buo ang loob
  rationale: Ang תְמִימִם ay naglalarawan ng kabuuan at integridad sa paghahambing ng matuwid at masama, hindi tahasang doktrina ng ganap na kawalang-kasalanan.
- issue: Lakas ng kahulugan ng kaalaman ni Yahweh
  choice: Isinaling payak bilang ‘Alam’
  alternative: Kinikilala; binabantayan; pinangangalagaan
  rationale: Maaaring may diwang mapagmalasakit at tipanan ang ידע rito, ngunit ang payak na ‘Alam’ ang nagpapanatili sa pahiwatig nang hindi ito ginagawang tahasang pagpapakahulugan.
- issue: Permanente bang pag-aari o walang hanggang mana
  choice: Pinanatili ang ‘mana’ at ‘magpakailanman’
  alternative: Ang kanilang pag-aari ay hindi mawawala
  rationale: Hindi nilulutas ng salin kung ang diin ay nasa walang hanggang mana o sa permanenteng pagmamay-ari; pinananatili nito ang saklaw ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang pangalan na ‘Yahweh,’ ang idyomang ‘mga araw,’ at ang teolohikal na kaluwagan ng ‘alam’ at ‘mana.’
