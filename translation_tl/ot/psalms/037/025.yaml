source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: tl
  text: Bata pa ako noon, at ngayo’y matanda na ako, ngunit hindi ko pa nakitang pinabayaan ang taong matuwid ni ang kanyang mga supling[b] na namamalimos[a] ng pagkain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “humahanap” o “humihingi ng tinapay”; sa kontekstong ito, malamang na tumutukoy sa pamamalimos para sa pangunahing pagkain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kanyang binhi,” ibig sabihin, kanyang mga supling o inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Noong bata pa ako
  rationale: Likas na Filipino para sa predikatibong “ako ay bata/noong kabataan ko,” at malinaw na inihahanda ang paghahambing sa katandaan.
- source_word: גַּם זָקַנְתִּי
  choice: at ngayo'y matanda na
  rationale: Inilalabas ang pag-usad mula kabataan hanggang sa kasalukuyang katandaan; ang ganitong gamit ng “ngayon” ay angkop na optimal-equivalence para sa paired life-stage expression.
- source_word: וְלֹא רָאִיתִי
  choice: hindi ko pa nakitang
  rationale: Ipinapahayag ang personal na obserbasyong umaabot mula noon hanggang ngayon, nang hindi ito ginagawang ganap na pangako.
- source_word: צַדִּיק
  choice: ang taong matuwid
  rationale: Ang substantibong panlalaking isahan ay may pangkalahatang kinatawang diwa. Natural sa Filipino ang “taong matuwid” at hindi nito nililimitahan ang tinutukoy sa lalaki lamang.
- source_word: נֶעֱזָב
  choice: pinabayaan
  rationale: Tumpak at natural na pasibong diwa ng עזב; taglay nito ang bigat ng pagiging iniwan o hindi inalagaan.
- source_word: וְזַרְעוֹ
  choice: ni ang kanyang mga supling
  rationale: Ang זֶרַע ay tumutukoy sa anak o mga inapo. Ang “ni” ay natural na nag-uugnay ng ikalawang bagay na hindi nakita, samantalang ang “mga supling” ay nagpapanatili ng lawak ng kahulugan.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: namamalimos ng pagkain
  rationale: Bagaman literal na “humahanap/humihingi ng tinapay,” sa konteksto ay tumutukoy ito sa paghingi ng pangunahing makakain. “Namamalimos ng pagkain” ang malinaw at natural na Filipino, habang inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Personal na obserbasyon ba ito o ganap na teolohikal na garantiya?
  choice: 'Pinanatili bilang unang-panauhang patotoo: “hindi ko pa nakitang.”'
  alternative: Isalin bilang pangkalahatan at walang-pasubaling pangako na hindi kailanman daranas ng matinding pangangailangan ang sinumang matuwid o ang kanyang mga inapo.
  rationale: Malinaw na inilalahad ng Hebreo ang karanasan ng nagsasalita mula kabataan hanggang katandaan. Hindi pinalalawak ng salin ang pahayag lampas sa anyong obserbasyonal nito.
- issue: Kasarian at bilang sa צַדִּיק at זַרְעוֹ
  choice: “ang taong matuwid” at “kanyang mga supling”
  alternative: “ang matuwid na lalaki ... kanyang mga anak” o “ang mga matuwid ... kanilang mga anak”
  rationale: Pinananatili ng “taong matuwid” ang kinatawang isahan nang hindi nagdaragdag ng di-kinakailangang pagtukoy sa kasarian. Ang “mga supling” ay natural na nagpapahayag ng kolektibong kahulugan ng זֶרַע.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ngayo'y” bilang bahagyang pampanitikang pagpapaikli na karaniwan sa saling biblikal; ang kabuuang pangungusap ay nananatiling natural. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa dalawang leksikal na paliwanag.
