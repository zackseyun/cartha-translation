  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: tl
  text: Magtiwala ka kay Yahweh at gumawa ng mabuti; manirahan ka sa lupain at linangin ang katapatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manginain sa katapatan” o “magpakabusog sa katapatan”; isa pang posibleng salin ay “tamasahin ang katiwasayan.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo; maaaring pumupukaw ito ng larawan ng panginginain o pagpapakain sa katapatan o pagiging maaasahan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Magtiwala ka
  rationale: Ang pautos na anyo ng בטח ay tumutukoy sa paglalagak ng tiwala o pananalig sa isang tao. Likas at tuwiran sa makabagong Tagalog ang “magtiwala ka.”
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Minamarkahan ng ב ang pinagtutuunan ng pagtitiwala. Ginamit ang “kay” dahil personal na pangalan ang Yahweh.
- source_word: וַעֲשֵׂה טוֹב
  choice: at gumawa ng mabuti
  rationale: Tuwirang pinananatili ang pautos at ang malawak na diwa ng paggawa ng kabutihan.
- source_word: שְׁכָן אֶרֶץ
  choice: manirahan ka sa lupain
  rationale: Ang שׁכן ay nangangahulugang manirahan o mamalagi. Ang “lupain” ay mas angkop kaysa “daigdig” sa konteksto ng awit, kung saan mahalaga ang panatag na paninirahan sa lupain.
- source_word: וּרְעֵה
  choice: at linangin
  rationale: Ang רעה ay literal na magpastol, magpakain, o manginain. Dahil abstrakto ang layon nitong אֱמוּנָה, ipinahahayag ng “linangin” ang aktibong pag-aalaga at pagpapaunlad nang hindi nagiging labis na malabo; pinanatili sa talababa ang mas literal na larawang pastoral.
- source_word: אֱמוּנָה
  choice: ang katapatan
  rationale: Maaaring tumukoy ang אֱמוּנָה sa katatagan, pagiging maaasahan, katapatan, o katiwasayan. Ang “katapatan” ay umaayon sa etikal na himig ng magkakasunod na utos, ngunit hindi nito isinasara ang ibang posibleng diwa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalang tipan sa pamamagitan ng transliterasyong “Yahweh,” nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng וּרְעֵה אֱמוּנָה
  choice: linangin ang katapatan
  alternative: manginain sa katapatan; magpakabusog sa katapatan; tamasahin ang katiwasayan
  rationale: Mahirap at tunay na may higit sa isang posibleng pakahulugan ang pariralang Hebreo. Pinili ang isang natural na saling nagpapanatili sa aktibong utos, habang inilalahad sa talababa ang literal na larawang pagpastol/panginginain at ang posibleng diwang katiwasayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maiikling pautos at ang paralelismo ng talata. Ang tuldok-kuwit ay naghihiwalay sa dalawang magkaugnay na pares ng utos.
