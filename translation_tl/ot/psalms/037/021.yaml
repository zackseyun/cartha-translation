  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: tl
  text: Nangungutang ang masama ngunit hindi nagbabayad; ang matuwid nama'y nagpapakita ng kagandahang-loob[a] at nagbibigay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpapakita ng pabor” o “mapagbigay.” Ang pandiwang Hebreo ay may diwang pagpapakita ng biyaya o pabor, na dito ay nahahayag sa mapagbigay na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: O “nagpapahiram.” Literal na “nagbibigay” ang pandiwang Hebreo; dahil sa konteksto, inuunawa ito ng ilan bilang bukas-palad na pagpapahiram.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: nangungutang
  rationale: Ang Qal participle ng לוה ay tumutukoy sa pangungutang. Ang aspektong di-ganap ng “nangungutang” ay natural sa Filipino at angkop sa pangkalahatang pahayag na tulad ng kawikaan.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Ginagamit ang pang-uri bilang pangngalan para sa isang kinatawang uri ng tao. Pinananatili ng “ang masama” ang maikli at matalim na paghahambing ng tulang Hebreo.
- source_word: לֹא יְשַׁלֵּם
  choice: hindi nagbabayad
  rationale: Sa konteksto ng pangungutang, ang Piel ng שלם ay nangangahulugang magbayad o magsauli ng pagkakautang. Natural sa Filipino ang “hindi nagbabayad” bilang paglalarawan ng nakaugaliang asal.
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Ang substantibong pang-uri ay tuwirang katapat ng רָשָׁע. Pinananatili nito ang kinatawang isahan at ang bokabularyong karaniwan sa karunungang biblikal.
- source_word: חוֹנֵן
  choice: nagpapakita ng kagandahang-loob
  rationale: Ang חנן ay pangunahing nagpapahiwatig ng pagpapakita ng biyaya o pabor. Inilalahad ito ng parirala sa natural na modernong Filipino nang hindi agad nililimitahan sa pagkakawanggawa lamang.
- source_word: וְנוֹתֵן
  choice: at nagbibigay
  rationale: Karaniwang kahulugan ng נתן ang “magbigay.” Hindi ito pinaliit sa “magpahiram,” bagaman posible ang gayong pag-unawa dahil sa konteksto.
theological_decisions:
- issue: Kinatawang panlalaking isahan sa paghahambing ng karunungan
  choice: Panatilihin ang mga katawagang isahan na “ang masama” at “ang matuwid.”
  alternative: “Ang masasama … ang mga matuwid” o “ang taong masama … ang taong matuwid.”
  rationale: Panlalaking isahan ang mga substantibo sa Hebreo, ngunit ginagamit ang mga ito bilang kinatawang uri. Ang maikling anyong Filipino ay nagpapanatili sa isahan at hindi nagdaragdag ng kasariang hindi kailangang ipahayag sa salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang baligtad na ayos sa unang sugnay upang maging masigla at natural ang paralelismong patula; ang “nama’y” ay malinaw na naghuhudyat ng pagtutunggali. Inilagay ang mga talababa sa mismong salitang tinutukoy ng bawat alternatibo.
