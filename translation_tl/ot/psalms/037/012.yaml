translation:
  language: tl
  text: Nagpapakana ang masama laban sa matuwid[a], at nagngangalit siya ng ngipin laban sa matuwid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagbabalak laban sa matuwid” o “nagpaplano ng masama laban sa matuwid.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pagngangalit ng ngipin” ay isang idyomang nagpapahayag ng matinding galit at pagkapoot.
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: nagbabalak ng masama
  rationale: Ang pandiwaring Hebreo ay tumutukoy sa pagbuo ng isang balak, at sa konteksto ay malinaw na may masamang layunin; natural itong ipinahahayag sa Filipino bilang “nagbabalak ng masama.”
- source_word: רָשָׁע
  choice: ang taong balakyot
  rationale: Ginamit ang pang-uri bilang pangngalan para sa isang masamang tao. Nililinaw ng “taong balakyot” ang isahang tinutukoy at pinananatili ang marangal na estilong patula.
- source_word: לַצַּדִּיק
  choice: laban sa taong matuwid
  rationale: Ipinahihiwatig ng pang-ukol ang taong pinupuntirya ng masamang balak; ang “laban sa” ang natural na katumbas, at ang “taong matuwid” ay nagpapanatili sa isahang anyo.
- source_word: חֹרֵק
  choice: nagngangalit
  rationale: Tumutukoy ang pandiwa sa pagngangalit o paggiling ng mga ngipin bilang pagpapakita ng matinding galit at poot. Ang “nagngangalit” ay natural at malinaw sa modernong Filipino.
- source_word: עָלָיו
  choice: dito
  rationale: Ang hulaping panghalip ay tumutukoy sa taong matuwid. Ang “dito” ay natural kasunod ng pariralang nagpapahayag ng galit at pagkapoot.
- source_word: שִׁנָּיו
  choice: ang kanyang mga ngipin
  rationale: Tuwirang isinalin ang pangngalang maramihan at ang hulaping paari upang mapanatili ang kongkretong larawan ng Hebreong idyoma.
