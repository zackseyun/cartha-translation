base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: tl
  text: Binunot na ng masasama ang kanilang tabak at binanat ang kanilang pana, upang pabagsakin ang mga dukha at nangangailangan, upang katayin ang mga taong matuwid ang pamumuhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga matuwid ng landas”; maaari ring, “mga matuwid sa kanilang landas.” Ang “landas” ay larawan ng takbo o paraan ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: Binunot na ... ang kanilang tabak
  rationale: Ang literal na diwa ng pandiwa ay “buksan,” ngunit kapag tabak ang layon, tumutukoy ito sa pagbunot mula sa kaluban. Likas at malinaw sa Filipino ang “binunot ang tabak.”
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Pinananatili nito ang pangkalahatang kategoryang moral ng pangmaramihang anyong Hebreo nang hindi nililimitahan sa isang kasarian.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: at binaluktot ang kanilang pana
  rationale: Ang pandiwa, kapag ginamit sa pana, ay tumutukoy sa pagbaluktot o paghahanda nito sa pagpana. Pinananatili rin ang isahang kolektibong “pana” ng Hebreo.
- source_word: לְהַפִּיל
  choice: upang pabagsakin
  rationale: Tuwirang ipinahahayag ang causative na diwang “maging sanhi ng pagbagsak” at ang marahas na layunin ng masasama.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ang dukha at nangangailangan
  rationale: Ipinakikita ng magkapares na salita ang kahirapan at kawalang-kakayahang matustusan ang pangangailangan, habang pinananatili ang paralelismo ng Hebreo.
- source_word: לִטְבֹחַ
  choice: upang katayin
  rationale: Mas matindi ito kaysa sa karaniwang “patayin” at inilalarawan ang malupit na pagpaslang na ipinahihiwatig ng pandiwang Hebreo.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: ang mga taong matuwid ang pamumuhay
  rationale: Ang literal na “matuwid sa landas” ay tumutukoy sa moral na takbo ng buhay. Ang “matuwid ang pamumuhay” ay natural sa modernong Filipino habang pinananatili ang talinghaga sa talababa.
theological_decisions:
- issue: Saklaw ng יִשְׁרֵי דָרֶךְ
  choice: mga taong matuwid ang pamumuhay
  alternative: mga matuwid sa landas
  rationale: Hindi ginawang pahayag tungkol sa ganap na kawalang-kasalanan; inilalarawan ng parirala ang matuwid na takbo o asal sa buhay. Nasa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “katayin” upang mapanatili ang tindi ng karahasan sa pinagmulang Hebreo; ang “matuwid ang pamumuhay” naman ay umiiwas sa di-likas na literal na hulma habang inilalagay sa talababa ang talinghagang “landas.”
