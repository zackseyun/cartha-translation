  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: tl
  text: 'Kay David.[a]


    Huwag kang magngitngit dahil sa masasama;

    huwag kang mainggit sa mga gumagawa ng kalikuan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “ni David,” “para kay David,” o “tungkol kay David.”
    reason: superscription_ambiguity
  - marker: b
    text: O “mga gumagawa ng kawalang-katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ang maikli at sadyang malabong superskripsiyon; maaaring tumukoy sa pag-akda, pag-uukol, o kaugnayan kay David.
- source_word: אַל־תִּתְחַר
  choice: Huwag kang mag-init sa galit
  rationale: Ipinahahayag ang larawan ng Hebreong pandiwa na nangangahulugang uminit o mag-alab sa pagkayamot o galit, sa halip na paliitin ito sa simpleng pag-aalala.
- source_word: בַּמְּרֵעִים
  choice: dahil sa masasama
  rationale: Natural na salin para sa mga taong gumagawa ng masama; ang pang-ukol ay inuunawang dahilan o sanhi ng pag-init ng damdamin.
- source_word: אַל־תְּקַנֵּא
  choice: huwag kang mainggit
  rationale: Tuwirang ipinapahayag ang pagbabawal sa pagkainggit o paninibugho.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: sa mga gumagawa ng kalikuan
  rationale: Pinananatili ang aktibong pariralang 'mga gumagawa' at ang moral na bigat ng עַוְלָה bilang kalikuan o kawalang-katarungan.
theological_decisions:
- issue: Kahulugan ng superskripsiyong לְדָוִד
  choice: Kay David
  alternative: Awit ni David
  rationale: Hindi tiyak na ang לְ ay laging tanda ng tuwirang pag-akda; iniiwasang lutasin ang tunay na ambiguwidad ng Hebreo.
- issue: Damdaming ipinagbabawal sa unang sugnay
  choice: pag-init sa galit
  alternative: pagkabalisa o pagkainis
  rationale: Pinananatili ang pisikal na metapora at saklaw ng pandiwa nang hindi ipinapalagay na pag-aalala lamang ang tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang isahang kausap na “kang” ayon sa mga pandiwang Hebreo, at pinanatili ang maikli at patulang pagkakahanay ng dalawang pagbabawal.
