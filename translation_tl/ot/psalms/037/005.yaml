  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: tl
  text: Ipagkatiwala mo kay Yahweh ang iyong landas[a]; magtiwala ka sa kanya, at siya’y kikilos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Igulong mo ang iyong landas sa ibabaw ni Yahweh.” Ang larawang ito ay nangangahulugang ipaubaya o ipagkatiwala sa kanya ang landas o takbo ng buhay ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “gagawin niya iyon” o “isasakatuparan niya iyon.” Sinasabi lamang ng Hebreo na “siya ay gagawa/kikilos,” nang walang tahasang layon.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Ipagkatiwala mo
  rationale: Ang literal na larawan ay “igulong” o “iukol sa ibabaw,” ngunit sa idyomang ito ang diwa ay ipaubaya o ipagkatiwala kay Yahweh ang sariling tatahaking landas. Likas at malinaw sa modernong Tagalog ang “ipagkatiwala.”
- source_word: עַל
  choice: kay
  rationale: Bagaman literal na “sa ibabaw ng” ang pang-ukol, hinihingi ng pandiwang Tagalog na “ipagkatiwala” ang “kay” kapag tao ang pinagkakatiwalaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: דַּרְכֶּךָ
  choice: ang iyong landas
  rationale: Ang “landas” ay tuwirang katumbas na maaari ring tumukoy sa direksiyon o takbo ng buhay, gaya ng karaniwang gamit sa panitikang karunungan.
- source_word: וּבְטַח
  choice: magtiwala ka
  rationale: Tuwiran nitong naipapahayag ang pautos na anyo at ang personal na pananalig na hinihingi ng teksto.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Ito ang likas na pang-ukol sa modernong Tagalog kasunod ng “magtiwala,” at malinaw na tumutukoy kay Yahweh.
- source_word: וְהוּא
  choice: at siya ang
  rationale: 'Pinananatili nito ang pagkakasunod ng Hebreo at ang diin sa panghalip: si Yahweh mismo ang kikilos.'
- source_word: יַעֲשֶׂה
  choice: kikilos
  rationale: Malawak ang kahulugan ng pandiwang עשה—gumawa, isagawa, o kumilos—at walang tahasang layon dito. Pinananatili ng “kikilos” ang pagiging bukas ng pangako nang hindi nagdaragdag ng hindi sinabi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kung tutukuyin ang di-binanggit na layon ng יַעֲשֶׂה
  choice: siya ang kikilos
  alternative: gagawin niya iyon; isasakatuparan niya iyon
  rationale: Walang tahasang layon ang pandiwa sa Hebreo. Ang bukas na pananalitang “kikilos” ay umiiwas sa pagdaragdag ng mas tiyak na pangako kaysa sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “landas” upang mapanatili ang matalinghagang saklaw ng דֶּרֶךְ bilang daan at takbo ng buhay; ginamit ang “siya ang” upang maipakita ang diin ng panghalip sa Hebreo.
