  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: tl
  text: Sapagkat ang mga pinagpala niya ay magmamana ng lupain[a], ngunit ang mga isinumpa niya ay puputulin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “lupain” o “daigdig”; sa kontekstong tipanan ng Awit, higit na angkop dito ang “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang batayan o paliwanag ng naunang pahayag at natural na nag-uugnay sa daloy ng pangangatwiran ng awit.
- source_word: מְבֹרָכָיו
  choice: ang mga pinagpala niya
  rationale: Pinananatili ang pasibong diwa ng participle at ang ugnayan sa panlalaking isahang tinutukoy, na sa konteksto ay ang Panginoon.
- source_word: יִירְשׁוּ
  choice: magmamana
  rationale: Pinananatili ang diwa ng pagtanggap at pag-aari, pati ang tipanang himig ng pangako tungkol sa lupain.
- source_word: אָרֶץ
  choice: lupain
  rationale: Sa paulit-ulit na pangako ng Awit 37, ang 'lupain' ang pinakamalapit sa tipanan at karunungang konteksto; maaari rin itong mangahulugang 'daigdig,' kaya inilagay ang alternatibo sa talababa.
- source_word: וּמְקֻלָּלָיו
  choice: ngunit ang mga isinumpa niya
  rationale: Ang 'ngunit' ay natural na nagpapahayag ng malinaw na pagsalungat ng dalawang linya; pinananatili ng 'isinumpa niya' ang pasibong anyo at kaagapay na balangkas ng 'pinagpala niya.'
- source_word: יִכָּרֵתוּ
  choice: lilipulin
  rationale: Sa Filipino, ang 'lilipulin' ay natural na naghahatid ng hudisyal na diwa ng Niphal כרת na 'aalisin' o 'puputulin mula sa bayan/lupain,' nang hindi gumagamit ng alanganing literalismong 'puputulin.'
theological_decisions:
- issue: Tinutukoy ng mga hulaping ikatlong panauhang panlalaking isahan sa 'mga pinagpala niya' at 'mga isinumpa niya'
  choice: Ginawang tahas sa Filipino sa pamamagitan ng 'niya,' na nauunawaang tumutukoy sa Panginoon ayon sa konteksto.
  alternative: Isaling mas nominal bilang 'ang kanyang mga pinagpala' at 'ang kanyang mga isinumpa,' nang hindi gaanong tahasang ipinahihiwatig ang gumagawa.
  rationale: Taglay na ng Hebreo ang ugnayan sa isang panlalaking isahang tinutukoy. Nililinaw ng 'niya' ang gramatika ngunit hindi pinapangalanan sa talata ang tinutukoy nang higit sa sinasabi ng teksto.
- issue: Saklaw ng אָרֶץ
  choice: lupain
  alternative: daigdig
  rationale: Ang 'lupain' ay nagpapanatili sa tipanan at karunungang tagpuan ng Awit 37 at hindi agad nagpapalawak sa pangako sa buong mundo; gayunman, tunay na leksikal na posibilidad ang 'daigdig' at pinananatili sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang magkatimbang na 'mga pinagpala niya' at 'mga isinumpa niya.' Ang 'lilipulin' ay piniling natural na katumbas ng idyomang Hebreo na 'puputulin/aalisin,' habang pinananatili ang bigat ng hatol.
