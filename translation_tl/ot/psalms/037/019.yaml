  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: tl
  text: Hindi sila mapapahiya sa panahon ng kapahamakan[a], at sa mga araw ng taggutom ay mabubusog sila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa panahon ng kaguluhan” o “sa panahon ng kasawian.” Ang tinutukoy ay kapighatian o sakuna, hindi moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magkakaroon sila ng sapat” o “mapupuno sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mapapahiya
  rationale: Ipinahahayag ng בושׁ ang pagdanas ng kahihiyan o pagkabigo sa inaasahan. Ang “mapapahiya” ay natural sa makabagong Tagalog at maaaring tumukoy sa kahihiyang idinulot ng mga pangyayari, hindi lamang sa pansariling pagkapahiya.
- source_word: בְּעֵת רָעָה
  choice: sa panahon ng kapahamakan
  rationale: Ang רָעָה rito ay tumutukoy sa masamang kalagayan o sakuna, hindi sa moral na kasamaan. Mas malinaw ang “kapahamakan” kaysa literal na “kasamaan,” habang pinananatili ang bigat ng adversity.
- source_word: וּבִימֵי רְעָבוֹן
  choice: at sa mga araw ng taggutom
  rationale: Tuwirang inilalarawan ng parirala ang mga panahong may matinding kakulangan sa pagkain. Ang “taggutom” ang karaniwan at tiyak na salin ng רְעָבוֹן.
- source_word: יִשְׂבָּעוּ
  choice: mabubusog sila
  rationale: Ang שׂבע ay nangangahulugang mabusog o magkaroon ng sapat na pagkain. Sa konteksto ng taggutom, mas kongkreto at natural ang “mabubusog” kaysa pangkalahatang “masisiyahan.”
