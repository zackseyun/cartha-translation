translation:
  language: tl
  text: Mas mabuti ang kaunting pag-aari ng taong matuwid[a] kaysa sa saganang pag-aari ng maraming masasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Mas mabuti ang kaunti para sa taong matuwid.” Eliptiko ang Hebreo at maaaring ipahiwatig, sa halip na tahasang sabihin, ang pagmamay-ari.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mas mabuti
  rationale: Sa pahambing na anyo ng kawikaan, ang טוֹב ay nangangahulugang “mas mabuti,” hindi lamang “mabuti.”
- source_word: מְעַט
  choice: ang kaunting pag-aari
  rationale: Ang מְעַט ay maliit na halaga o dami. Idinagdag ang “pag-aari” bilang likas na pagpapahayag sa Filipino ng ipinahihiwatig na pagmamay-ari sa eliptikong parirala.
- source_word: לַצַּדִּיק
  choice: ng taong matuwid
  rationale: Maaaring magpahiwatig ng pagmamay-ari ang ל sa paghahambing na ito. Pinananatili ng “taong matuwid” ang isahang kolektibong diwa ng Hebreo.
- source_word: מֵהֲמוֹן
  choice: kaysa sa kasaganaan ng
  rationale: Ang הָמוֹן ay maaaring tumukoy sa kasaganaan, dami, o malaking kalipunan. Ang “kasaganaan” ay angkop sa kaibahan nito sa “kaunti” at hindi ito nililimitahan sa salapi lamang.
- source_word: רְשָׁעִים רַבִּים
  choice: maraming taong masama
  rationale: 'Ang רְשָׁעִים ay pangmaramihang substantibong pang-uri, at ang רַבִּים ay likas na naglalarawan sa mga taong iyon: “maraming taong masama.”'
