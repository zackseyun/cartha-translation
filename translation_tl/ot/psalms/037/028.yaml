base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: tl
  text: 'Sapagkat iniibig ni Yahweh ang katarungan

    at hindi niya pinababayaan ang mga tapat sa kanya[a];

    iniingatan sila magpakailanman[b],

    ngunit puputulin ang lahi ng masasama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang mga banal,” “kanyang mga makadiyos,” o “mga matapat sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain nang mas mahigpit ang Hebreo: “ang mga tapat sa kanya ay iniingatan magpakailanman.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: אֹהֵב
  choice: iniibig
  rationale: Tuwirang ipinahahayag ng pandiwaring Hebreo ang pag-ibig; ang “iniibig” ay natural at marangal sa konteksto.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Tumutukoy rito sa makatarungang kaayusan o sa kung ano ang matuwid, hindi lamang sa isang hatol.
- source_word: יַעֲזֹב
  choice: pinababayaan
  rationale: Likas na salin sa Filipino para sa pagtalikod o pag-iwan, at angkop sa katiyakang pastoral ng talata.
- source_word: חֲסִידָיו
  choice: ang mga tapat sa kanya
  rationale: Ipinahihiwatig ng salita ang mga taong may katapatan at debosyon sa Diyos; iniiwasan nito ang posibleng makitid na teknikal na pakahulugan ng “mga banal.”
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw at karaniwang Filipino para sa walang-hanggang tagal.
- source_word: נִשְׁמָרוּ
  choice: iniingatan sila
  rationale: Ipinapahayag ang pasibong diwa ng pag-iingat o pagpapanatiling ligtas sa natural na ayos ng Filipino.
- source_word: זֶרַע
  choice: lahi
  rationale: Sa kontekstong ito, ang kolektibong “binhi” ay tumutukoy sa mga supling o salinlahi; natural sa Filipino ang “lahi.”
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Karaniwang kolektibong tawag sa mga taong masama sa panitikang karunungan.
- source_word: נִכְרָת
  choice: lilipulin
  rationale: Malinaw na ipinahahayag ang pagkawala o pagkaputol ng lahi; mas natural ito sa Filipino kaysa sa literal na “puputulin” para sa mga tao.
theological_decisions:
- issue: Saklaw at diwa ng חֲסִידָיו
  choice: “ang mga tapat sa kanya,” na tumutukoy sa mga taong may katapatan at debosyon kay Yahweh
  alternative: “kanyang mga banal,” “mga makadiyos sa kanya,” o “mga matapat sa kanya”
  rationale: Pinananatili ng salin ang kaugnayan sa tipanang katapatan nang hindi nag-aangkat ng mas huling teknikal o denominasyonal na diwa ng “mga banal.”
- issue: Ugnayan ng dalawang gitnang sugnay
  choice: 'Dalawang magkaugnay na pahayag: hindi sila pinababayaan, at iniingatan sila magpakailanman'
  alternative: 'Mas mahigpit na pagsasanib: “ang mga tapat sa kanya ay iniingatan magpakailanman”'
  rationale: Maaaring basahin ang ikalawang sugnay bilang pagpapalawak sa una. Pinananatili ng tuldok-kuwit ang daloy at ang bahagyang kalayaan ng dalawang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan, “mga tapat sa kanya” upang idiin ang relasyonal na katapatan, at “lilipulin ang lahi” bilang natural na Filipino para sa pagkaputol ng mga inapo.
