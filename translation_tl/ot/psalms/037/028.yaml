  source_fidelity: 'Tumpak ang pangunahing daloy: iniibig ni Yahweh ang katarungan, hindi niya pinababayaan ang kaniyang mga tapat, iniingatan sila magpakailanman, at ang supling ng masasama ay napuputol. Gayunman, ang “lilipulin” ay mas tiyak at masidhi kaysa sa Niphal ng כרת (“puputulin/mapuputol”), na sadyang nagpapanatili ng idyomang pagkaputol.'
  naturalness: Malinaw at marangal ang Filipino. Natural ang “iniingatan sila magpakailanman” at ang paghihiwalay ng dalawang gitnang sugnay. Mas natural din ang “kanyang mga makadiyos” kaysa “mga makadiyos sa kanya” sa talababa.
