translation:
  language: tl
  text: At dumaing sila kay Yahweh sa kanilang paghihirap; iniligtas niya sila mula sa kanilang mga kagipitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “mga kagipitan” ay maaari ring isaling “mga paghihirap” o “mga matitinding kagipitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Nang magkagayon, dumaing sila
  rationale: Ipinahihiwatig ng anyong pasalaysay ang pagsunod ng pangyayari, at ang “dumaing” ay likas na nagsasaad ng marubdob na paghingi ng tulong.
- source_word: אֶל
  choice: kay
  rationale: Karaniwang panandang paturol sa taong dinaraingan; likas itong gamitin bago ang pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בַּצַּר לָהֶם
  choice: sa kanilang paghihirap
  rationale: Ipinapahayag nito ang kalagayan nila sa gitna ng matinding problema o dalamhati; natural at malinaw ang “paghihirap” sa modernong Filipino.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: mula sa kanilang mga kagipitan
  rationale: Pinananatili ng “mga kagipitan” ang maramihang anyo at ang larawan ng mabibigat at masisikip na kalagayan.
- source_word: יוֹשִׁיעֵם
  choice: iniligtas niya sila
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagliligtas o paghango sa panganib; ang aspektong naganap ay angkop sa daloy ng salaysay.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumaing” upang ihatid ang marubdob na paghingi ng tulong nang hindi nagiging sobrang kolokyal; pinanatili rin ang pagkakaiba ng isahang “paghihirap” at maramihang “mga kagipitan.”
