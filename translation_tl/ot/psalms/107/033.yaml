base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: tl
  text: 'Ginagawa niyang ilang ang mga ilog,

    at tigang na lupain[a] ang mga bukal ng tubig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “uhaw” o “pagkauhaw”; dito ay tumutukoy sa isang tuyot at walang-tubig na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: Ginagawa niyang … ang
  rationale: Ang pandiwang שׂים ay maaaring mangahulugang “ilagay” o “gawin.” Sa konteksto, malinaw na pagbabago ng kalagayan ang inilalarawan, kaya natural sa Tagalog ang hulma na “ginagawa niyang … ang.”
- source_word: נְהָרוֹת
  choice: mga ilog
  rationale: Ito ang tuwiran at karaniwang kahulugan ng pangmaramihang pangngalan.
- source_word: לְמִדְבָּר
  choice: ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o disyertong lupain. Ang “ilang” ay maikli, dignified, at angkop sa patulang kaibahan nito sa mga ilog.
- source_word: וּמֹצָאֵי מַיִם
  choice: mga bukal ng tubig
  rationale: Literal na tumutukoy ang מוֹצָאֵי sa mga labasan o pinagmumulan; kapag kaugnay ng tubig, natural itong tumutukoy sa mga bukal o pinagmumulan ng tubig.
- source_word: לְצִמָּאוֹן
  choice: tigang na lupain
  rationale: Literal na “uhaw” o “pagkauhaw” ang pangngalan, ngunit dito ay inilalarawan nito ang isang tuyot at walang-tubig na kalagayan o lugar. Pinananatili ng “tigang na lupain” ang konkretong larawang katapat ng “ilang.”
