  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: tl
  text: At dumaing sila kay Yahweh sa kanilang kagipitan, at inilabas niya sila mula sa kanilang mga paghihirap.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Kaya dumaing sila
  rationale: Ang pandiwa ay tumutukoy sa apurahang paghingi ng tulong. Likas sa modernong Tagalog ang “dumaing” sa ganitong panalangin, at ipinahihiwatig ng “kaya” ang pagsulong ng salaysay.
- source_word: אֶל־יְהוָה
  choice: kay Yahweh
  rationale: Ang אֶל ay nagsasaad ng pinatutungkulan ng daing, at pinananatili ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: בַּצַּר לָהֶם
  choice: sa kanilang kagipitan
  rationale: Ang צַר ay kalagayan ng matinding hirap o pagkakapos. Ang “sa kanilang kagipitan” ay natural at marangal na Tagalog at pinananatili ang isahang anyo ng Hebreo.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: mula sa kanilang mga paghihirap
  rationale: Ipinahihiwatig ng מִן ang paglabas mula sa isang kalagayan, samantalang pinananatili ng “mga paghihirap” ang maramihang anyo at diwa ng mga panggigipit o kagipitan.
- source_word: יוֹצִיאֵם
  choice: inilabas niya sila
  rationale: Ang Hiphil ng יצא ay literal na “magpalabas” o “ilabas.” Pinananatili ng salin ang konkretong larawan ng paglalabas sa halip na agad itong gawing mas interpretatibong “iniligtas.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at hindi ito pinapalitan ng titulo.
- issue: Kung gagawing tahasang “iniligtas” ang יוֹצִיאֵם
  choice: inilabas niya sila
  alternative: iniligtas niya sila
  rationale: May diwa ng pagliligtas ang konteksto, ngunit ang anyong Hebreo ay nagpapanatili ng konkretong larawan ng paglabas. Hindi tahasang nilulutas ng salin ang larawang ito sa isang abstraktong teolohikal na termino.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dumaing” upang ipahayag ang apurahang panawagan nang hindi maging labis na kolokyal, at pinanatili ang konkretong larawang “inilabas” mula sa Hebreo.
