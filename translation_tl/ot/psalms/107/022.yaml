  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: tl
  text: Maghandog sila ng mga hain ng pasasalamat[a], at isalaysay nila ang kanyang mga gawa na may sigaw ng kagalakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga haing pasasalamat.”
    reason: lexical_alternative
  - marker: b
    text: O “ipahayag nila ang kanyang mga gawa nang may kagalakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Maghandog sila
  rationale: Ang anyong pandiwa ay gumaganap bilang panawagan o paghihikayat. Natural sa modernong Tagalog ang “Maghandog sila” at napapanatili nito ang kontekstong pansamba.
- source_word: זִבְחֵי תוֹדָה
  choice: mga handog ng pasasalamat
  rationale: Tumutukoy ang pariralang konstrukto sa mga haing iniuukol bilang pasasalamat. Ang “mga handog ng pasasalamat” ay malinaw, marangal, at malapit sa diwa ng Hebreo.
- source_word: תוֹדָה
  choice: pasasalamat
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa pasasalamat o handog-pasasalamat, hindi lamang sa pangkalahatang pagpupuri.
- source_word: וִיסַפְּרוּ
  choice: at isalaysay nila
  rationale: Ang piel ng ספר ay nangangahulugang maglahad o magsalaysay, kadalasan nang may detalye. Ang “isalaysay” ay natural para sa pagpapahayag ng mga ginawa ng Diyos.
- source_word: מַעֲשָׂיו
  choice: ang kanyang mga gawa
  rationale: Saklaw ng salita ang mga gawa o ginawa. Ang “mga gawa” ay karaniwang salin sa mga Awit at hindi nililimitahan ang kahulugan sa isang uri lamang ng kilos.
- source_word: בְּרִנָּה
  choice: nang may masayang awitan
  rationale: Ang רִנָּה ay masiglang sigaw ng kagalakan na maaari ring ipahayag sa pag-awit. Inihahatid ng “masayang awitan” ang galak at malamang na kontekstong musikal o liturhikal.
