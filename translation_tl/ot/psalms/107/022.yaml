  register: Makabago ngunit marangal na Filipino; pinanatili ang paralelismong panawagan sa dalawang pandiwa. Ginamit ang “kanyang” ayon sa karaniwang modernong baybay, at iniwasan ang labis na interpretibong terminolohiya.
