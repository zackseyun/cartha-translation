  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: tl
  text: Magpasalamat sila kay Yahweh dahil sa kanyang tapat na pag-ibig at sa kanyang mga kamangha-manghang gawa para sa mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga anak ng tao”; maaari ring isalin na “sa sangkatauhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Magpasalamat sila
  rationale: Ang anyong maramihan ay naghahayag ng panawagan o paghikayat. Likas sa makabagong Tagalog ang “Magpasalamat sila,” at pinananatili nito ang diwa ng paulit-ulit na panawagan sa salmo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tinutukoy ng לְ ang pinag-uukulan ng pasasalamat. Ginamit ang “kay” para sa personal na pangalan at pinanatili ang pangalang Yahweh.
- source_word: חַסְדּוֹ
  choice: kanyang tapat na pag-ibig
  rationale: Ang חֶסֶד ay pag-ibig at kabutihang matapat at nananatili. Ang “tapat na pag-ibig” ay malinaw at hindi nililimitahan ang salita sa awa lamang o sa isang tahasang teknikal na terminong teolohikal.
- source_word: וְנִפְלְאוֹתָיו
  choice: at sa kanyang mga kamangha-manghang ginawa
  rationale: Ang pangngalan mula sa פלא ay tumutukoy sa pambihira at kahanga-hangang mga gawa. Ang “mga kamangha-manghang ginawa” ay natural sa Tagalog at pinananatili ang aktibong diwa.
- source_word: לִבְנֵי אָדָם
  choice: para sa mga tao
  rationale: Sa konteksto, ang parirala ay tumutukoy sa mga taong nakikinabang sa mga kamangha-manghang gawa. Ang “para sa mga tao” ay natural at kinakatawan ang kolektibong diwa ng אָדָם; inilagay sa talababa ang mas literal na idyoma.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang יהוה sa tekstong Hebreo. Ang “Yahweh” ay tuwirang kumakatawan sa tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng בני אדם
  choice: mga tao
  alternative: mga anak ng tao; sangkatauhan
  rationale: Ang idyomang Hebreo ay pangkalahatang tumutukoy sa mga tao, hindi lamang sa mga lalaking anak. Pinili ang likas at inklusibong katumbas habang pinananatili sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Magpasalamat sila” bilang tuwirang panawagan at “mga kamangha-manghang ginawa” bilang karaniwang pananalita na angkop pa rin sa tulang panrelihiyon.
