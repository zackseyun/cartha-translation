  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: tl
  text: 'Sapagkat binibigyang-kasiyahan niya ang taong uhaw,


    at pinupuspos niya ng mabubuting bagay ang taong gutom.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa panawagan ng nakapaligid na konteksto na magpasalamat sa Diyos.
- source_word: הִשְׂבִּיעַ
  choice: binibigyang-kasiyahan
  rationale: Ipinapahayag ng Hiphil ng שבע ang pagpapabusog o pagbibigay ng ganap na kasiyahan; ang aspektong ganap sa Hebreo ay likas na naihahayag sa Filipino bilang pangkalahatang katotohanan sa kasalukuyan.
- source_word: נֶפֶשׁ
  choice: tao
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa buong taong may pagkauhaw o pagkagutom, hindi lamang sa isang hiwalay na di-materyal na bahagi. Ang “tao” ay malinaw at natural sa modernong Filipino.
- source_word: שֹׁקֵקָה
  choice: nauuhaw
  rationale: Ang salita ay naglalarawan ng matinding pananabik o pagkauhaw; kasabay ng “nagugutom,” pinananatili ng “nauuhaw” ang kongkretong paralelismo.
- source_word: רְעֵבָה
  choice: nagugutom
  rationale: Direkta at karaniwang katumbas na nagpapanatili sa paralelismo sa “nauuhaw.”
- source_word: מִלֵּא
  choice: pinupuspos
  rationale: Ang Piel ng מלא ay nangangahulugang punuin. Ang “pinupuspos” ay natural ngunit marangal, at ipinahihiwatig ang saganang pagpuno.
- source_word: טוֹב
  choice: mabuti
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na saklaw ng pangngalang/adjektibong Hebreo—ang mabuti o mabubuting bagay—nang hindi nililimitahan sa materyal na mga bagay lamang.
theological_decisions:
- issue: Antropolohikal na diwa ng נֶפֶשׁ
  choice: Isinalin bilang “tao” sa dalawang magkatulad na parirala.
  alternative: “kaluluwa,” “sarili,” o “buhay”
  rationale: Sa kontekstong ito, ang Hebreong נֶפֶשׁ ay ang buong buhay na taong nakararanas ng uhaw at gutom. Iniiwasan ng “tao” ang di-sinasadyang pagpapakahulugang ang tinutukoy ay isang hiwalay at di-materyal na bahagi lamang, habang pinananatili ang paralelismo.
- issue: Saklaw ng טוֹב
  choice: “ng mabuti”
  alternative: “ng mabubuting bagay” o “ng kabutihan”
  rationale: Ang anyong Hebreo ay maaaring tumukoy sa mabuti sa malawak na kahulugan o sa mabubuting bagay. Pinananatili ng “ng mabuti” ang saklaw at ambiguwidad nang hindi nagdaragdag ng tiyak na uri ng biyaya.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at patula. Inulit ang “taong” sa dalawang linya upang mapanatili ang paralelismong Hebreo. Ginamit ang “pinupuspos” bilang masiglang salitang pampanitikan na mauunawaan pa rin ng karaniwang mambabasa.
