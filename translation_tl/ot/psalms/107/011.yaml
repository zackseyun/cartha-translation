  text: כִּֽי הִמְר֥וּ אִמְרֵי אֵ֑ל וַ/עֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: tl
  text: Sapagkat naghimagsik sila laban sa mga salita ng Diyos at hinamak ang payo ng Kataas-taasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat sinuway nila ang mga salita ng Diyos at itinakwil ang payo ng Kataas-taasan.”
    reason: Mga posibleng salin ng הִמְרוּ at נָאָצוּ na nagpapanatili sa diwa ng pagsalungat at paghamak.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng dahilan ng kalagayan o hatol na binanggit sa naunang talata; likas at malinaw ang “Sapagkat” sa daloy ng salmo.
- source_word: הִמְרוּ
  choice: naghimagsik ... laban sa
  rationale: Ipinahahayag ng pandiwang מרה ang tahasang pagrerebelde o pagsuway; pinananatili ng parirala ang lakas at ugnayang ipinahihiwatig ng Hebreo.
- source_word: אִמְרֵי
  choice: mga salita
  rationale: Ang construct plural ng אִמְרָה ay tumutukoy sa mga ipinahayag na salita; natural at sapat ang “mga salita” sa modernong Tagalog.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang katawagan ito sa Diyos sa konteksto at hindi kailangang palawakin bilang “Makapangyarihan,” na maaaring magdagdag ng diin na hindi tahasang hinihingi rito.
- source_word: וַעֲצַת
  choice: at ... ang payo
  rationale: Maaaring tumukoy ang עֵצָה sa payo, panukala, o layunin. Pinananatili ng “payo” ang ideya ng banal na karunungan nang hindi nililimitahan ito sa isang itinakdang plano.
- source_word: עֶלְיוֹן
  choice: Kataas-taasan
  rationale: Itinatag at marangal na salin ito ng banal na titulong עֶלְיוֹן, at pinananatili ang pagkakaiba nito sa אֵל.
- source_word: נָאָצוּ
  choice: hinamak
  rationale: Ipinahahayag ng נאץ ang paghamak o pagturing nang may pag-alipusta; maikli, natural, at matindi ang “hinamak.”
theological_decisions:
- issue: Paglalarawan sa magkatambal na banal na titulong אֵל at עֶלְיוֹן
  choice: Diyos ... Kataas-taasan
  alternative: Makapangyarihang Diyos ... Pinakadakila
  rationale: Pinananatili ng napiling salin ang dalawang magkaibang banal na katawagan at ang matayog na paralelismo nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “naghimagsik” upang panatilihin ang matinding diwa ng Hebreo, at “payo” upang huwag labis na tukuyin kung payo, plano, o layunin ang diin.
