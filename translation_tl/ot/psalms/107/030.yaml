  yaml_path: translation/ot/psalms/107/030.yaml
  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: tl
  text: Kaya natuwa sila nang tumahimik ang mga alon[a], at inakay niya sila sa daungang minimithi nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, walang tahasang simuno: maaari ring “nang tumahimik ang mga ito,” na tumutukoy sa mga alon o tubig.'
    reason: lexical_alternative
  - marker: b
    text: O “sa pantalan na minimithi nila” o “sa inaasam nilang hantungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Kaya natuwa sila
  rationale: Ang שׂמח ay nagpapahayag ng tuwa. Ipinahihiwatig ng “Kaya” ang pagsulong ng salaysay at ang tugon sa naunang pagpapatahimik sa bagyo.
- source_word: כִּי
  choice: nang
  rationale: Maaaring ipakilala ng כִּי ang sanhi o kalagayang nagdulot ng kanilang tuwa. Likas sa Tagalog ang “nang” dito at hindi nito labis na nililinaw kung temporal o sanhi ang ugnayan.
- source_word: יִשְׁתֹּקוּ
  choice: tumahimik ang mga alon
  rationale: Ang שׁתק ay nangangahulugang tumahimik o tumigil. Walang tahasang simuno sa sugnay, ngunit sa konteksto ang mga alon o tubig ang tumahimik; inilantad ito upang maging malinaw at natural sa Tagalog, habang itinabi sa talababa ang mas literal na posibilidad.
- source_word: וַיַּנְחֵם
  choice: at inakay niya sila
  rationale: Ang נחה ay “umakay” o “pumatnubay.” Ang “inakay” ay natural at tuwirang nagpapakita ng personal na pagkilos ng Diyos sa konteksto.
- source_word: מְחוֹז
  choice: daungan
  rationale: Tumutukoy ang salita sa lugar na pinupuntahan o sinasadsaran, lalo na sa kontekstong pandagat. Ang “daungan” ay karaniwan, malinaw, at angkop sa tula.
- source_word: חֶפְצָם
  choice: minimithi nila
  rationale: Mula sa ugat na may diwang pagnanais o kasiyahan. Ang “minimithi nila” ay nagpapanatili sa ideya ng inaasam na hantungan nang natural sa Filipino.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng וַיַּנְחֵם
  choice: “niya,” na tumutukoy sa Diyos ayon sa konteksto
  alternative: Balintiyak na “dinala sila” nang walang tahasang gumagawa
  rationale: Nasa ikatlong panauhang panlalaking isahan ang pandiwa, at ang PANGINOON ang gumagawa sa nakapaligid na salaysay. Pinananatili ng “niya” ang personal na pagkilos nang hindi nagdaragdag ng pangalan sa mismong talata.
- issue: Hindi tahasang simuno ng יִשְׁתֹּקוּ
  choice: ang mga alon
  alternative: “tumahimik ang mga ito” o “tumahimik sila”
  rationale: Pangmaramihan ang pandiwa at walang nakasaad na simuno. Batay sa naunang talata, malamang na ang mga alon o tubig ang tinutukoy. Nananatili sa talababa ang pormal na kalabuan ng Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “daungan” para sa malinaw na larawang pandagat at “minimithi” upang mapanatili ang bahagyang patulang himig ng salmo.
