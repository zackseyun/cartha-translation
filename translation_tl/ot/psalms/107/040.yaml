  text: שֹׁפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: tl
  text: Ibinubuhos niya ang paghamak sa mga maharlika[a] at pinagagala niya sila sa isang tiwangwang na lugar na walang landas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinuno” o “mga prinsipe.” Ang salitang Hebreo ay maaaring tumukoy sa mga maharlika, prinsipe, o prominenteng lider.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa isang tiwangwang na lugar, walang daan.” Ang Hebreong salita ay maaari ring mangahulugang “kawalan” o “kapanglawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Ibinubuhos
  rationale: Pinananatili ang matingkad na metapora ng pagbuhos at ang aspektong naglalarawan sa karaniwang pagkilos ng Diyos sa konteksto.
- source_word: בּוּז
  choice: paghamak
  rationale: Likas na katumbas ng contempt o scorn sa modernong Filipino at angkop sa pampublikong pagpapahiya sa mga pinuno.
- source_word: נְדִיבִים
  choice: mga mararangal
  rationale: Tumutukoy rito sa mga taong mataas ang katayuan; hindi nito labis na nililimitahan ang salita sa mga prinsipeng maharlika lamang.
- source_word: וַיַּתְעֵם
  choice: hinahayaang maligaw sila
  rationale: Ipinahahayag ang causative na diwa ng Hiphil sa natural na Filipino, bagaman maaari rin itong unawaing mas tuwirang ‘pinagagala.’
- source_word: בְּתֹהוּ
  choice: sa ilang
  rationale: Sa konteksto, inilalarawan ng תֹהוּ ang isang tiwangwang at mapanglaw na lugar, hindi lamang abstraktong kaguluhan o kawalan.
- source_word: לֹא דָרֶךְ
  choice: na walang landas
  rationale: Malapit sa literal na ‘walang daan’ at natural na naglalarawan sa ilang na hindi matunton ang lalakaran.
theological_decisions:
- issue: Di-tahasang simuno
  choice: Ginamit ang ‘niya,’ na tumutukoy sa Diyos ayon sa daloy ng salmo.
  alternative: Isang di-tiyak o pangkalahatang gumagawa
  rationale: Sa nakapaligid na konteksto, ang mga pagbabagong ito ay iniuugnay sa PANGINOON; kailangan ding ipahayag ang simuno sa natural na Filipino.
- issue: Causative na kahulugan ng וַיַּתְעֵם
  choice: ‘hinahayaang maligaw sila’
  alternative: ‘pinagagala sila’ o ‘inililigaw sila’
  rationale: Pinananatili nito ang paghatol bilang kilos ng Diyos ngunit iniiwasang ipahiwatig nang higit sa Hebreo na nililinlang niya sila. Nananatili sa talababa ang mas tuwirang causative na posibilidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang poetikong metapora na ‘ibinubuhos ang paghamak’ at ang larawan ng isang tiwangwang na lugar na walang matutunton na landas.
