  naturalness: Natural at marangal sa modernong Filipino ang “Ibinubuhos niya ang paghamak” at “pinagagala niya sila sa isang tiwangwang na lugar na walang landas.” Mas malinaw ang “tiwangwang na lugar” kaysa “ilang” para sa malawak na saklaw ng תֹהוּ.
  terminology: Pinalitan ang “mga mararangal,” na maaari ring tumukoy sa marangal na pag-uugali, ng “mga maharlika,” na mas tuwirang tumutukoy sa mataas na katayuan ng נְדִיבִים sa kontekstong ito. Inilalahad ng talababa ang mga alternatibong “pinuno” at “prinsipe.”
