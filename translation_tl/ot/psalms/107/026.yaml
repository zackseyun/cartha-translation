translation:
  language: tl
  text: Umaakyat sila hanggang langit at bumababa hanggang sa kalaliman; ang kanilang kalooban ay natutunaw sa kagipitan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang buhay.” Ang נֶפֶשׁ (nefesh) ay maaaring mangahulugang “kalooban,” “buhay,” o “sarili,” at ang רָעָה (ra‘ah) ay maaaring tumukoy sa “kagipitan” o “kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: Umaakyat sila
  rationale: Ang Qal imperfect ng עלה ay naglalarawan ng paitaas na kilos. Ang pangkasalukuyang anyo ay angkop sa masiglang paglalarawan ng unos.
- source_word: שָׁמַיִם
  choice: hanggang langit
  rationale: Likas sa modernong Tagalog ang “hanggang langit” para sa sukdulang taas at pinananatili nito ang matinding larawang patula.
- source_word: יֵרְדוּ
  choice: bumababa
  rationale: Tuwirang katapat ito ng “umaakyat” at hindi nagdaragdag ng ideya ng paglubog na wala sa pandiwa.
- source_word: תְהוֹמוֹת
  choice: hanggang sa kalaliman
  rationale: Tumutukoy ang maramihang anyo ng תְּהוֹם sa napakalalalim na bahagi o mga uka ng dagat; ang “kalaliman” ay natural at marangal sa Tagalog.
- source_word: נַפְשָׁם
  choice: ang kanilang kalooban
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa panloob na pagkatao na bumibigay sa gitna ng panganib. Mas natural dito ang “kalooban” kaysa literal na “kaluluwa,” habang kinikilala sa talababa ang lawak ng kahulugan.
- source_word: בְּרָעָה
  choice: sa kagipitan
  rationale: Ang רָעָה ay tumutukoy rito sa matinding problema o kapahamakan, hindi sa moral na kasamaan. Pinananatili ng “sa kagipitan” ang pangyayari at damdaming dulot ng unos.
- source_word: תִּתְמוֹגָג
  choice: natutunaw
  rationale: Pinananatili ng “natutunaw” ang matingkad na metapora ng panloob na panghihina o pagguho sa halip na ipaliwanag lamang itong “nawawalan ng loob.”
