  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: tl
  text: Doon niya pinatira ang mga nagugutom, at nagtatag sila ng isang lungsod na matitirhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lungsod para panirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: pinatira niya
  rationale: 'Ang Hiphil ng ישׁב ay may diwang sanhi: pinanirahan o pinamalagi. Likas sa modernong Tagalog ang “pinatira niya” at malinaw na ipinapakitang may kumilos upang sila ay manirahan doon.'
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang katumbas na pang-abay na pook at natural sa konteksto.
- source_word: רְעֵבִים
  choice: ang mga nagugutom
  rationale: Ang pang-uri ay ginagamit bilang pangngalan para sa mga taong dumaranas ng gutom. Ang “mga nagugutom” ay malinaw, kasalukuyan, at hindi labis ang diin kumpara sa “mga naghihingalo sa gutom.”
- source_word: וַיְכוֹנְנוּ
  choice: nagtayo sila
  rationale: Sa konteksto ng lungsod, ipinahihiwatig ng כון ang pagtatatag o matatag na pagbuo. Mas natural sa karaniwang Filipino ang “nagtayo” kaysa “nagtatag,” habang taglay pa rin ang diwa ng pagbuo ng isang permanenteng pamayanan.
- source_word: עִיר
  choice: isang lungsod
  rationale: Karaniwang kahulugan ng עִיר ang lungsod. Pinananatili nito ang biblikal na katawagan nang hindi ito pinapaliit sa “nayon” o nilalabuan bilang “pamayanan.”
- source_word: מוֹשָׁב
  choice: na matitirhan
  rationale: Ang מוֹשָׁב ay tumutukoy sa paninirahan o lugar na tinitirhan. Ang pariralang “isang lungsod na matitirhan” ay natural at naipapahayag ang layunin o gamit ng lungsod.
theological_decisions:
- issue: Hindi tahasang pinangalanang simuno ng וַיּוֹשֶׁב
  choice: Isinalin bilang “niya,” na tumutukoy sa Diyos mula sa nakapaligid na konteksto.
  alternative: Gawing tahasan ang “Diyos” o gumamit ng di-tiyak na simuno.
  rationale: Ang salmo ay nagsasalaysay ng mga gawa ng PANGINOON, kaya likas na ipinagpapatuloy ng pandiwang pang-isahan ang simunong iyon. Pinananatili ng “niya” ang anyong panghalip ng Hebreo at iniiwasang magdagdag ng pangalang hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pinatira” at “nagtayo” para sa likas na daloy, habang pinanatili ang sanhi sa unang pandiwa at ang matatag na pagbuo ng lungsod sa ikalawa. Ang marker na [a] ay nakalagay mismo sa pangunahing teksto.
