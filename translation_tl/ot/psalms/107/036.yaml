  source_fidelity: Ang “Doon niya pinatira ang mga nagugutom” ay tapat sa causative na וַיּוֹשֶׁב at sa substantival na רְעֵבִים. Gayunman, ang “nagtayo sila” ay maaaring mangahulugang pisikal na pagtatayo lamang ng mga gusali, samantalang ang וַיְכוֹנְנוּ, kaugnay ng lungsod, ay mas tiyak na tumutukoy sa pagtatatag o pagpapatibay ng isang pamayanan.
  naturalness: Natural at malinaw ang unang sugnay. Mas angkop at karaniwan sa modernong Filipino ang “nagtatag sila ng isang lungsod” para sa pagtatayo ng isang lungsod bilang pamayanan. Ang “lungsod na matitirhan” ay likas sa pangunahing teksto.
  terminology: Pinananatili ang “lungsod” para sa עִיר at ang causative na “pinatira” para sa Hiphil ng ישׁב. Ginamit ang “nagtatag” upang maipakita ang diwa ng pagtatatag sa כון nang hindi ipinagpapalagay ang isang partikular na paraan ng konstruksiyon.
