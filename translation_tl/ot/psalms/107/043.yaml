base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: tl
  text: Sino ang marunong? Isaisip niya ang mga bagay na ito, at pagbulayan nila[a] ang tapat na pag-ibig ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Biglang lumilipat ang Hebreo mula sa isahan (“niya”) tungo sa maramihan (“nila”).
    reason: source_text_ambiguity
  - marker: b
    text: Sa Hebreo, maramihan ang “tapat na pag-ibig,” na maaaring tumukoy sa maraming pagpapamalas ng tapat na pag-ibig at awa ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Sino ang marunong?
  rationale: Pinananatili ang tuwirang retorikal na tanong ng Hebreo at gumagamit ng likas at marangal na pananalitang Tagalog.
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: Isaisip niya ang mga bagay na ito
  rationale: Sa kontekstong karunungan, ang שׁמר ay tumutukoy sa maingat na pag-iingat at pagbibigay-pansin sa mga bagay na isinalaysay. Mas malinaw sa karaniwang Tagalog ang “isaisip” kaysa sa literal na “ingatan,” na maaaring magpahiwatig ng pisikal na pagbabantay.
- source_word: וְיִתְבּוֹנְנוּ
  choice: at pagbulayan nila
  rationale: Ipinahahayag ng pandiwa ang masusi at mapagnilay na pag-unawa. Pinananatili ng “nila” ang biglang paglipat ng Hebreo mula sa isahan tungo sa maramihan.
- source_word: חַסְדֵי
  choice: ang tapat na pag-ibig
  rationale: Ang חֶסֶד ay pag-ibig na tapat at maaasahan. Ginawang kolektibong isahan sa pangunahing teksto para sa likas na Tagalog, habang inilalahad sa talababa ang anyong maramihan ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglipat mula sa panahunang isahan tungo sa maramihan
  choice: “niya” ... “nila”
  alternative: 'Gawing parehong isahan: “niya” ... “niya”'
  rationale: Sadyang pinananatili ang pagbabago sa bilang na nasa Hebreo sa halip na pakinisin o ipaliwanag ito sa pangunahing teksto.
- issue: Bilang ng חַסְדֵי
  choice: Kolektibong “ang tapat na pag-ibig,” na may talababa tungkol sa maramihan
  alternative: “ang mga gawa ng tapat na pag-ibig”
  rationale: Iniiwasang idagdag sa pangunahing teksto ang salitang “mga gawa,” na hindi tahasang naroon, ngunit hindi ikinukubli ang maramihang anyo at posibleng pagtukoy nito sa maraming pagpapamalas ng pag-ibig.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo, hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “isaisip” at “pagbulayan” upang ipahayag ang maingat na pakikinig at mapagnilay na pag-unawa nang hindi nagiging teknikal o makaluma.
