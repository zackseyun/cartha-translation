  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: tl
  text: Magpasalamat sila kay Yahweh dahil sa kanyang tapat na pag-ibig at sa kanyang mga kamangha-manghang ginawa para sa mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng tao,” isang karaniwang pananalitang Hebreo na tumutukoy sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Magpasalamat sila
  rationale: Ang Hiphil ng ידה sa paulit-ulit na koro ng Awit 107 ay tumutukoy sa pagpapasalamat o pagpupuri. Ang “Magpasalamat sila” ay natural na panawagan sa modernong Tagalog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagmamarka sa tatanggap ng pasasalamat, at ang pangalang tipan na יהוה ay tinumbasan bilang “Yahweh.”
- source_word: חַסְדּוֹ
  choice: kanyang tapat na pag-ibig
  rationale: Ang חֶסֶד ay pag-ibig at kabutihang nananatiling tapat. Pinananatili ng “tapat na pag-ibig” ang diin nito nang hindi ito nililimitahan sa awa lamang.
- source_word: וְנִפְלְאוֹתָיו
  choice: at sa kanyang mga kamangha-manghang ginawa
  rationale: Ang נִפְלָאוֹת ay mga pambihira at kahanga-hangang gawa. Nilinaw ng “ginawa” na mga kilos ng Diyos ang tinutukoy, at inulit ang “sa” upang maging malinaw at natural ang ugnayan nito sa pagpapasalamat.
- source_word: לִבְנֵי אָדָם
  choice: para sa mga tao
  rationale: Ang בְּנֵי אָדָם, literal na “mga anak ng tao,” ay karaniwang Hebreong pananalita para sa mga tao o sangkatauhan. Ang “para sa mga tao” ay naghahatid ng diwa at ng kapakinabangan ng kanyang mga gawa sa natural na Tagalog, habang inilalagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa בְּנֵי אָדָם
  choice: mga tao
  alternative: mga anak ng tao; sangkatauhan
  rationale: Bagaman literal na “mga anak ng tao,” ang parirala ay pangkalahatang tumutukoy sa mga tao. Iniiwasan ng saling “mga tao” ang posibleng maling pag-unawa na partikular na mga anak na lalaki ang tinutukoy, habang ang literal na anyo ay iniingatan sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kamangha-manghang ginawa” sa halip na mas teknikal o makalumang pananalita, at pinanatili ang pangalang Yahweh.
