  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: tl
  text: Gutom at uhaw sila; nanghina ang kanilang kalooban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang kaluluwa ay nanghina” o “ang kanilang buhay ay nanghina”; maaari rin itong tumukoy sa sila mismo. Ang Hebreong nephesh ay maaaring mangahulugang kaluluwa, buhay, sarili, o kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: Gutom
  rationale: Tuwirang katumbas ng pang-uring Hebreo; hindi ito pinalakas tungo sa “gutom na gutom” o “nagugutom nang matindi.”
- source_word: גַּם
  choice: at
  rationale: Ipinahahayag ng natural na tambalang “gutom at uhaw” ang pagdaragdag ng ikalawang kalagayan. Ang tahasang “gayundin” ay magiging asiwa sa Filipino.
- source_word: צְמֵאִים
  choice: uhaw
  rationale: Karaniwan at tuwirang katumbas ng pang-uring Hebreo.
- source_word: נַפְשָׁם
  choice: ang kanilang kaluluwa
  rationale: Pinananatili nito ang larawan ng Hebreo at ang lawak ng נֶפֶשׁ bilang kaluluwa, buhay, o sarili, sa halip na agad itong paliitin sa isa lamang sa mga kahulugang iyon.
- source_word: בָּהֶם
  choice: sa loob nila
  rationale: 'Natural na Filipino para sa panloob na lokasyon: sa kanilang kalooban nangyayari ang panghihina.'
- source_word: תִּתְעַטָּף
  choice: nanghina
  rationale: Ipinahahayag ang pagkapawi o pagbagsak ng lakas nang hindi dinaragdagan ang tindi o ipinapalagay na literal silang nawalan ng malay.
