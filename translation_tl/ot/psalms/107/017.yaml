  text: אֱ֭וִלִים מִ/דֶּ֣רֶךְ פִּשְׁעָ֑/ם וּֽ֝/מֵ/עֲוֺֽנֹתֵי/הֶ֗ם יִתְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: tl
  text: Ang mga hangal ay dumanas ng paghihirap dahil sa landas ng kanilang paghihimagsik at dahil sa kanilang mga kasamaan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang mga hangal, mula sa landas ng kanilang paghihimagsik at mula sa kanilang mga kasamaan, ay dumanas ng paghihirap.” Ang mga pang-ukol sa Hebreo ay literal na maaaring mangahulugang “mula sa,” ngunit malamang na nagpapahayag dito ng sanhi: “dahil sa.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “paghihimagsik” ay maaari ring isaling “pagsuway,” at ang “mga kasamaan” ay maaari ring isaling “mga kasalanan” o “mga pagkakasala.” Magkakaiba nang bahagya ang mga diwang saklaw ng dalawang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: mga hangal
  rationale: Tumutukoy ito sa mga taong may kahangalan sa asal at moralidad, hindi lamang sa mga kulang sa talino. Direkta at malinaw ang “mga hangal” sa makabagong Tagalog.
- source_word: מִדֶּרֶךְ
  choice: dahil sa landas ng
  rationale: Maaaring magpahiwatig ng sanhi ang pang-ukol na מִן sa kontekstong ito. Pinanatili ang larawan ng “landas” bilang takbo o paraan ng pamumuhay.
- source_word: פִּשְׁעָם
  choice: kanilang paghihimagsik
  rationale: Ang פֶּשַׁע ay may diwa ng kusang pagsuway o paghihimagsik laban sa nararapat na awtoridad. Pinananatili ng “paghihimagsik” ang moral na bigat ng salita.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: at dahil sa kanilang mga kasamaan
  rationale: Muling itinuring na sanhi ang מִן. Ang עָוֹן ay maaaring tumukoy sa kasamaan, kasalanan, pagkakasala, o bunga nito; malinaw at malawak ang “mga kasamaan” habang nananatiling naiiba sa “paghihimagsik.”
- source_word: יִתְעַנּוּ
  choice: dumanas ng paghihirap
  rationale: Ipinahihiwatig ng pandiwa ang pagkapighati o pagdurusa. Natural sa Tagalog ang “dumanas ng paghihirap” at hindi nito tahasang tinutukoy ang isang ahenteng nagpahirap, na hindi naman binanggit sa talata.
theological_decisions:
- issue: Ugnayang sanhi sa pagitan ng kasalanan at pagdurusa
  choice: Inilalahad ng talata na naghirap ang mga taong ito dahil sa kanilang mapaghimagsik na landas at mga kasamaan.
  alternative: Maaaring unawain ang mga pang-ukol bilang “mula sa,” na hindi gaanong tahasang nagpapahayag ng sanhi.
  rationale: Sa kontekstong patula, pinakamalamang na sanhi ang ipinahihiwatig ng dalawang מִן. Hindi pinalalawak ng salin ang pahayag upang sabihing lahat ng pagdurusa ay bunga ng personal na kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matalinghagang “landas” at ang pagkakaiba ng dalawang katawagang moral, habang ginawang natural ang pandiwang nagsasaad ng pagdurusa.
