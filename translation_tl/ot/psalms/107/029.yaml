  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: tl
  text: Pinatahimik niya ang bagyo[a], at tumahimik ang kanilang mga alon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginawa niyang payapa ang bagyo.” Literal na ipinahahayag ng Hebreo na pinangyari niyang mapunta ang bagyo sa katahimikan o kapanatagan.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga alon nito,” kung ang tinutukoy ng hulapi ay ang dagat o mga tubig sa halip na ang mga taong sakay ng barko.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֵם
  choice: Pinatahimik niya
  rationale: Ang Hiphil ng קום kasama ng לִדְמָמָה ay nagsasaad ng pagpapangyari sa isang kalagayan. Likas sa modernong Tagalog ang pandiwang sanhi na “pinatahimik,” at malinaw nitong ipinakikita ang pagkilos ng Diyos.
- source_word: סְעָרָה
  choice: ang bagyo
  rationale: Ang salita ay tumutukoy sa malakas na unos o bagyo, lalo na sa konteksto ng dagat. “Bagyo” ang pinakakaraniwan at malinaw na katumbas sa Tagalog.
- source_word: לִדְמָמָה
  choice: tahimik
  rationale: Ang לְ ay nagpapahayag ng ibinungang kalagayan, at ang דְּמָמָה ay katahimikan o kapanatagan. Isinama ito sa pandiwang “pinatahimik” upang maging natural habang napapanatili ang resultative na diwa.
- source_word: וַיֶּחֱשׁוּ
  choice: tumahimik
  rationale: Ipinahihiwatig ng pandiwa ang paglipat tungo sa katahimikan. Ang “tumahimik” ay natural para sa mga alon at hindi nagdaragdag ng diwang wala sa Hebreo.
- source_word: גַּלֵּיהֶם
  choice: ang kanilang mga alon
  rationale: Ang hulaping Hebreo ay ikatlong panauhang maramihan, literal na “kanilang.” Pinanatili ito sa pangunahing teksto upang hindi tahimik na lutasin ang di-tiyak na tinutukoy ng panghalip.
