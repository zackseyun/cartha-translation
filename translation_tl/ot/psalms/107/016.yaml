  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: tl
  text: Sapagkat winasak niya ang mga pintuang tanso at pinutol ang mga halang na bakal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tarangkahang tanso.” Mas tiyak na nangangahulugang “mga pintuan” ang salitang Hebreo, bagaman maaaring mga tarangkahan ang tinutukoy sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan na kaugnay ng naunang panawagang magpasalamat.
- source_word: שִׁבַּר
  choice: winasak
  rationale: Nagpapahayag ng marahas at lubusang pagdurog o pagsira; natural at matindi sa modernong Tagalog.
- source_word: דַּלְתוֹת
  choice: mga pintuan
  rationale: Ito ang tuwirang kahulugan ng pangngalan, bagaman maaaring mga pintuan ng isang pinatibay na tarangkahan ang tinutukoy sa konteksto.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Karaniwang katawagan sa Tagalog para sa bronze o copper alloy sa biblikal na kontekstong ito.
- source_word: בְרִיחֵי
  choice: mga rehas
  rationale: Tumutukoy sa mabibigat na pahalang na pangharang na nagsasara at nagpapatibay sa mga pintuan; malinaw at natural sa Tagalog.
- source_word: בַרְזֶל
  choice: bakal
  rationale: Tuwirang katumbas ng katawagan sa metal.
- source_word: גִּדֵּעַ
  choice: pinutol
  rationale: Pinananatili ang diwa ng pagtabas o pagputol sa mga harang na bakal nang hindi dinaragdagan ang teksto ng paraang hindi tahasang sinabi.
theological_decisions:
- issue: Pagtukoy sa banal na gumagawa
  choice: niya
  alternative: ng PANGINOON
  rationale: Walang tahasang paksa sa talatang Hebreo; ang mga pandiwa ay nasa ikatlong panauhang panlalaki at tumutukoy sa PANGINOON sa konteksto. Pinananatili ng “niya” ang daloy at di-tahasang pagtukoy ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pintuan” bilang mas tiyak na leksikal na katumbas at inilagay sa talababa ang kontekstuwal na “tarangkahan.”
