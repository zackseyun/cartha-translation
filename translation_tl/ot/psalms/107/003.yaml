translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang em dash upang malinaw na ipakitang inililista ng kasunod na mga parirala ang mga pinanggalingang lupain. Inilagay ang talababa sa “dagat,” ang mismong salitang may leksikal na kalabuan.
