  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: tl
  text: at tinipon niya sila mula sa mga lupain—mula sa silangan at mula sa kanluran, mula sa hilaga at mula sa dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa timog.” Sa Hebreo, “mula sa dagat.” Sa ilang konteksto, maaaring tumukoy ang “dagat” sa isang direksiyon, karaniwan ay sa kanluran; ngunit nabanggit na rito nang tahasan ang kanluran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: mula sa mga lupain
  rationale: Ang pangmaramihang אֲרָצוֹת ay tumutukoy sa iba't ibang lupain o rehiyon. Mas kongkreto at di-gaanong pampolitika ang “mga lupain” kaysa “mga bansa.”
- source_word: קִבְּצָם
  choice: tinipon niya sila
  rationale: Ang קבץ ay nangangahulugang tipunin o sama-samahin. Ang “tinipon” ay natural sa Filipino at angkop sa konteksto ng muling pagtitipon ng mga tinubos.
- source_word: מִמִּזְרָח וּמִמַּעֲרָב
  choice: mula sa silangan at sa kanluran
  rationale: Tuwirang inilalahad ang dalawang direksiyon habang pinananatili ang balanseng paralelismo ng Hebreo.
- source_word: מִצָּפוֹן
  choice: mula sa hilaga
  rationale: Karaniwang katawagan ito sa pangunahing direksiyong hilaga.
- source_word: וּמִיָּם
  choice: at sa dagat
  rationale: Ang יָם ay pangunahing nangangahulugang “dagat.” Bagaman maaari itong magsilbing katawagang panlunan para sa kanluran, tahasang nabanggit na sa talata ang kanluran, kaya pinananatili rito ang leksikal na kahulugan.
