  text: Nakita nila ang mga gawa ni Yahweh at ang kanyang mga kababalaghan sa kalaliman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa malalalim na tubig.” Ang salitang Hebreo ay tumutukoy sa kalaliman, lalo na sa malalim na tubig ng dagat, na angkop sa konteksto ng paglalayag sa awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: nila
  rationale: Ang malayang panghalip na panlalaking maramihan ay may diin. Sa natural na Tagalog, malinaw itong naipapahayag ng hulaping panghalip sa “Nakita nila,” nang hindi nagdaragdag ng artipisyal na pagdiriin.
- source_word: רָאוּ
  choice: Nakita
  rationale: Ang Qal perfect ay nagsasalaysay ng naranasan ng mga naglalayag; ang aspektong ganap na “nakita” ay natural sa salaysay na patula.
- source_word: מַעֲשֵׂי
  choice: mga gawa
  rationale: Pinananatili ng “mga gawa” ang malawak na kahulugan ng mga ginawa o makapangyarihang pagkilos ng Diyos at natural itong katambal ng “mga kababalaghan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וְנִפְלְאוֹתָיו
  choice: at ang kanyang mga kababalaghan
  rationale: Ipinahahayag ng “mga kababalaghan” ang pambihira at kagila-gilalas na mga gawa, habang malinaw na pinananatili ng “kanyang” ang hulaping panghalip na ikatlong panauhang isahan.
- source_word: בִּמְצוּלָה
  choice: sa kalaliman
  rationale: Ang pangngalan ay tumutukoy sa malalim na tubig o kailaliman ng dagat. Ang “sa kalaliman” ay maikli, matalinghaga, at angkop sa konteksto ng paglalayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang ginamit mismo sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang maikling paralelismo ng taludtod at ang larawang pandagat nang hindi labis na nililinaw ang Hebreo.
