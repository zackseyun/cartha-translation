  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: tl
  text: 'Ngunit iniaangat niya mula sa pagdurusa ang nangangailangan,


    a​t ginagawa niyang parang kawan ang kanilang mga pamilya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinataas ang mahirap mula sa paghihirap.” Lit. “mga pamilya”; maaari ring “mga angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: itinataas
  rationale: Ipinahihiwatig ng שׂגב ang paglalagay sa mataas at ligtas na kalagayan. Likas sa makabagong Tagalog ang “itinataas,” habang nananatili sa konteksto ang diwa ng pagliligtas at pag-iingat.
- source_word: אֶבְיוֹן
  choice: ang nangangailangan
  rationale: Tumutukoy ang אֶבְיוֹן sa taong salat o may matinding pangangailangan. Mas malawak at likas ang “nangangailangan” kaysa sa “mahirap,” nang hindi ito nililimitahan sa kakulangan sa salapi.
- source_word: מֵעֹנִי
  choice: malayo sa pagdurusa
  rationale: Maaaring tumukoy ang עֹנִי sa pagdurusa, paghihirap, o karalitaan. Ipinakikita ng “malayo sa” ang puwersang naghihiwalay ng מִן, at ang “pagdurusa” ay angkop sa mas malawak na tema ng pagliligtas sa Awit 107.
- source_word: וַיָּשֶׂם
  choice: ginagawa
  rationale: Malawak ang kahulugan ng שׂים—ilagay, itatag, o gawin. Sa paghahambing na kasunod, malinaw na ipinahahayag ng “ginagawa” ang pagbabagong idinudulot ng Diyos.
- source_word: כַּצֹּאן
  choice: tulad ng isang kawan
  rationale: Ang צֹאן ay pangngalang kolektibo para sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Pinananatili ng “isang kawan” ang pastoral na larawan at diwa ng pagdami.
- source_word: מִשְׁפָּחוֹת
  choice: ang kanilang mga pamilya
  rationale: Bagaman walang tahasang panghalip na paari sa Hebreo, natural sa Tagalog ang “kanilang” upang iugnay ang mga pamilya sa mga nangangailangan; madaling maunawaan ang “mga pamilya” kaysa sa mas teknikal na “mga angkan.”
theological_decisions:
- issue: Pagdaragdag ng ipinahihiwatig na panghalip na paari sa “mga pamilya”
  choice: ang kanilang mga pamilya
  alternative: mga pamilya / mga angkan
  rationale: Payak na “mga pamilya” ang nasa Hebreo, ngunit ipinahihiwatig ng konteksto ang kaugnayan ng mga ito sa taong nangangailangan. Nililinaw ng “kanilang” ang ugnayang iyon sa likas na Tagalog nang walang idinaragdag na bagong teolohikal na pahayag.
- issue: Larawan ng paglalagay sa mataas na kalagayan
  choice: itinataas ... malayo sa pagdurusa
  alternative: inilalagay sa mataas at ligtas na kalagayan / itinataas mula sa paghihirap
  rationale: Pinananatili ng salin ang larawan ng pag-angat at ang paghihiwalay mula sa pagdurusa, ngunit hindi nito ipinipilit kung literal na pag-angat, proteksiyon, o pagbabago ng kalagayan ang pangunahing diin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nangangailangan” upang mapanatili ang lawak ng אֶבְיוֹן, at “kawan” upang maingatan ang kolektibo at pastoral na larawan ng Hebreo.
