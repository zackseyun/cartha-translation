translation:
  language: tl
  text: Sabihin ito ng mga tinubos ni Yahweh, na tinubos niya mula sa kamay ng kaaway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kamay ng kalaban” o “mula sa kamay ng mang-aapi.” Ang salitang Hebreo ay maaaring tumukoy sa isang kaaway, kalaban, o mang-aapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Sabihin ito
  rationale: Ang anyong pandiwa ay may puwersang panghimok sa kontekstong ito. Ang “ito” ay likas na tumutukoy sa ipinahayag sa naunang talata nang hindi dinaragdagan ang nilalaman.
- source_word: גְּאוּלֵי
  choice: mga tinubos
  rationale: Ang anyong ito mula sa גאל ay tumutukoy sa mga taong iniligtas o tinubos. Pinananatili ng “mga tinubos” ang ugnayan nito sa kaparehong ugat ng kasunod na pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa transliterasyon ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: גְּאָלָם
  choice: kanyang tinubos
  rationale: Ipinahihiwatig ng ganap na pandiwa at hulaping panghalip ang natapos na pagkilos ng Diyos para sa kanila. Inuulit ang “tinubos” upang mapanatili ang pag-uulit ng ugat na גאל sa Hebreo.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang konkretong talinghagang Hebreo para sa pagliligtas mula sa kapangyarihan o kontrol ng isang kalaban, at malinaw pa rin ito sa Tagalog.
- source_word: צָר
  choice: kaaway
  rationale: Sa konteksto, ang pangngalan ay pinakamalamang na tumutukoy sa isang kalaban o mang-aapi. Ang “kaaway” ay natural, maikli, at angkop sa patulang rehistro.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton יהוה; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Diwa ng wikang tumutukoy sa pagtubos
  choice: tinubos
  alternative: iniligtas
  rationale: Dalawang beses ginagamit ang ugat na גאל, kaya pinananatili ang “tinubos” sa dalawang lugar upang maipakita ang pag-uulit at ang diwa ng mapagligtas na pagkilos ng Diyos nang hindi ito nililimitahan sa isang komersiyal na transaksiyon.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit, na may payak na pangungusap at bahagyang patulang himig. Pinananatili ang konkretong larawang “kamay” at ang pag-uulit ng “tinubos.”
