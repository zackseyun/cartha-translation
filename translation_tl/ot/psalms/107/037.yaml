translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong larawang pang-agrikultura; iniwasan ang mas teknikal o makalumang mga salita at ang pagdaragdag ng “masagana,” na hindi tahasang nasa Hebreo.
