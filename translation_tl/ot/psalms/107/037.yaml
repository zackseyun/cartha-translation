  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: tl
  text: Naghasik sila sa mga bukid at nagtanim ng mga ubasan, at nagkaroon sila ng ani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “at gumawa sila ng bunga ng ani.”'
    reason: Ipinakikita ang di-karaniwang kayarian ng Hebreong פְּרִי תְבוּאָה; ang “ani” ang likas na katumbas nito sa Filipino sa kontekstong pang-agrikultura.
lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: Naghasik sila sa mga bukid
  rationale: Ang זרע ay karaniwang pandiwa para sa paghahasik ng binhi, at ang שָׂדוֹת ay tumutukoy sa mga bukid. Ginamit ang “sa mga bukid” sapagkat ito ang likas na paraan ng pagpapahayag ng gawaing ito sa Filipino.
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: nagtanim ng mga ubasan
  rationale: Ang נטע ay “magtanim,” at ang כֶּרֶם ay isang ubasan, hindi lamang indibiduwal na puno o baging.
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: nagbunga ang mga iyon ng ani
  rationale: Literal na pinagsasama ng Hebreo ang “gumawa/nagluwal,” “bunga,” at “ani/ani ng lupain.” Ang saling ito ay likas sa modernong Filipino at inilalarawan ang bukid at mga ubasan bilang pinagmulan ng ani nang hindi nagdaragdag ng ideya ng kasaganaan na hindi tahasang nasa teksto.
