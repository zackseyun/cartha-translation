  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: tl
  text: Magpasalamat sila kay Yahweh dahil sa kanyang tapat na pag-ibig, at dahil sa kanyang mga kamangha-manghang ginawa para sa mga tao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga anak ng tao,” isang idyomang Hebreo na tumutukoy sa lahat ng tao o sa sangkatauhan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “at dahil sa kanyang mga kahanga-hangang gawa” o “at dahil sa kanyang mga kababalaghan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Magpasalamat sila
  rationale: Ang Hiphil ng ידה sa paulit-ulit na panawagan ng Awit 107 ay naghahayag ng tugon ng pasasalamat at papuri sa pagliligtas ng Diyos. Natural at tuwiran sa modernong Tagalog ang “Magpasalamat sila.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Minamarkahan ng ל ang pinag-uukulan ng pasasalamat. Pinanatili ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: חַסְדּוֹ
  choice: kanyang tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang matatag, tapat, at mapagkalingang pag-ibig. Naipahahayag ng “tapat na pag-ibig” ang katapatan nito nang hindi nililimitahan ang salita sa awa lamang.
- source_word: וְנִפְלְאוֹתָיו
  choice: at dahil sa kanyang mga kamangha-manghang ginawa
  rationale: Tumutukoy ang נִפְלָאוֹת sa pambihirang mga gawa na pumupukaw ng paghanga. Mas malinaw sa karaniwang Tagalog ang kongkretong “mga kamangha-manghang ginawa” kaysa sa abstraktong “mga kababalaghan.”
- source_word: לִבְנֵי אָדָם
  choice: para sa mga tao
  rationale: Literal itong “sa/para sa mga anak ng tao,” isang pangkalahatang idyomang Hebreo para sa sangkatauhan. Ang “para sa mga tao” ay likas sa Tagalog at pinananatili ang pakahulugang mga gawa ng Diyos na ukol sa sangkatauhan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinanatili ang pangalang tipan bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Pangkalahatang gamit ng אָדָם sa pariralang בְּנֵי אָדָם
  choice: mga tao
  alternative: mga anak ng tao; sangkatauhan
  rationale: Pangkalahatan ang tinutukoy ng idyoma, hindi lamang mga lalaki. Iniiwasan ng “mga tao” ang maling pagbasa habang nananatiling natural at kongkreto sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dahil sa” sa dalawang magkatugmang parirala upang malinaw na kapwa dahilan ng pasasalamat ang tapat na pag-ibig at mga pambihirang gawa ni Yahweh. Inilagay ang parehong panandang talababa sa hulihan ng talata, ayon sa mga alternatibong leksikal na saklaw ng huling sugnay.
