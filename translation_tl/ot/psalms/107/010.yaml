  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
translation:
  language: tl
  text: May mga nakaupo sa dilim at pusikit na kadiliman[a], mga bilanggo sa paghihirap at mga tanikalang bakal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lilim ng kamatayan,” ang tradisyonal na salin ng צַלְמָוֶת; malamang na mas malawak ang tinutukoy ng Hebreo—matinding dilim o karimlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: May mga nakaupo
  rationale: Ang participle ng ישב ay tumutukoy sa mga nakaupo o nananahan. Ang finite clause na “May mga nakaupo” ay natural sa makabagong Tagalog at umaayon sa paglalarawan ng salmo sa iba’t ibang pangkat na iniligtas ng Diyos.
- source_word: חֹשֶׁךְ
  choice: dilim
  rationale: Tuwirang katumbas ito ng salitang tumutukoy sa literal o matalinghagang kawalan ng liwanag.
- source_word: צַלְמָוֶת
  choice: pusikit na kadiliman
  rationale: Ipinahahayag nito ang napakalalim at nakatatakot na dilim nang hindi tahasang ipinapasok ang kamatayan, na maaaring higit na tiyak kaysa sa malamang na diwa ng Hebreo.
- source_word: אֲסִירֵי
  choice: mga bilanggo
  rationale: Malinaw at likas na Tagalog ito para sa mga taong nakagapos o nakakulong, at angkop sa kasunod na larawan ng mga tanikalang bakal.
- source_word: עֳנִי
  choice: paghihirap
  rationale: Saklaw nito ang kapighatian o kaabahan nang hindi nililimitahan ang kahulugan sa kahirapang pangkabuhayan.
- source_word: בַרְזֶל
  choice: mga tanikalang bakal
  rationale: Bagaman “bakal” ang literal na anyo, metonimiko itong tumutukoy sa mga panggapos na bakal. Nililinaw ng “mga tanikalang bakal” ang imahen ng pagkabilanggo sa natural na Tagalog.
