base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: tl
  text: Pinagpala niya sila, at lubha silang dumami; at hindi niya hinayaang kumaunti ang kanilang mga alagang hayop.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at hindi kumaunti ang kanilang mga alagang hayop.” Isahan ang pandiwang Hebreo at maaaring unawain na ang Diyos pa rin ang simuno (“hindi niya hinayaang…”), o na inilalahad lamang ng sugnay ang naging resulta.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Pinagpala niya sila
  rationale: Ang piel ng ברך na may hulaping pangatlong panauhang maramihan ay nagsasaad ng pagkakaloob ng pagpapala o kasaganaan. Nananatiling isahan ang simuno at tumutukoy sa Diyos ayon sa konteksto.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: lubha silang dumami
  rationale: Ang רבה ay nagsasaad ng pagdami, at pinatitindi ito ng מְאֹד. Ang “lubha silang dumami” ay natural, marangal, at malinaw sa makabagong Filipino.
- source_word: וּבְהֶמְתָּם
  choice: ang kanilang mga alagang hayop
  rationale: Ang בְּהֵמָה ay kolektibong tawag dito sa mga hayop na inaalagaan bilang kabuhayan. Mas malawak at mas tumpak ang “mga alagang hayop” kaysa “mga baka.”
- source_word: לֹא יַמְעִיט
  choice: hindi niya hinayaang kumaunti
  rationale: Ang hiphil ng מעט ay causative, “magpakaunti” o “magpabawas.” Ipinapahayag ng “hindi niya hinayaang kumaunti” ang diwang causative o mapag-ingat, habang pinananatili ang Diyos bilang posibleng nagpapatuloy na simuno.
theological_decisions:
- issue: Pagpapatuloy ng simuno sa huling sugnay
  choice: 'Ang Diyos pa rin ang simuno: “hindi niya hinayaang kumaunti ang kanilang mga alagang hayop.”'
  alternative: “Hindi kumaunti ang kanilang mga alagang hayop.”
  rationale: Isahan ang pandiwang Hebreo at likas na maaaring ipagpatuloy ang naunang isahang simuno, ang Diyos. Gayunman, posible ring unawain ang huling sugnay bilang pahayag ng naging resulta; kaya itinatala ang alternatibo sa talababa sa halip na itago ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lubha” upang mapanatili ang diin ng מְאֹד nang hindi nagiging kolokyal, at “mga alagang hayop” bilang malinaw na pangkalahatang tawag sa livestock.
