base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: tl
  text: Magpasalamat sila kay Yahweh[b] dahil sa kanyang tapat na pag-ibig at sa kanyang mga kahanga-hangang gawa niya para sa sangkatauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa mga anak ng tao”; maaari ring isaling “para sa lahat ng tao.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang YHWH, na karaniwan ding isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּ
  choice: Magpasalamat sila
  rationale: 'Ang Hiphil imperfect na ginagamit bilang panawagan sa paulit-ulit na refrain ng Awit 107 ay likas na isinasalin bilang isang paghihikayat: “Magpasalamat sila.”'
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagmamarka sa tumatanggap ng pasasalamat, at ang banal na pangalang יהוה ay tinumbasan ng “Yahweh.”
- source_word: חַסְדּוֹ
  choice: dahil sa kanyang tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig o kabutihang-loob; malinaw at marangal sa modernong Tagalog ang “tapat na pag-ibig.”
- source_word: וְנִפְלְאוֹתָיו
  choice: at sa kanyang mga kahanga-hangang ginawa
  rationale: Ang נִפְלָאוֹת ay mga pambihirang gawa na pumupukaw ng paghanga; natural sa Tagalog ang “mga kahanga-hangang ginawa.”
- source_word: לִבְנֵי אָדָם
  choice: para sa sangkatauhan
  rationale: Literal itong “sa mga anak ng tao,” ngunit ang parirala ay kolektibong tumutukoy sa mga tao sa pangkalahatan. Inihahatid ng “para sa sangkatauhan” ang kinauukulan o nakikinabang sa mga gawa nang hindi nililimitahan sa kasariang lalaki.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang taglay ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa pangunahing teksto, habang inilalahad sa talababa ang nakaugaliang katumbas.
- issue: Saklaw ng בְּנֵי אָדָם
  choice: sangkatauhan
  alternative: mga anak ng tao
  rationale: Bagaman literal na panlalaki ang anyo, idiomatikong kolektibo ang parirala at tumutukoy sa lahat ng tao. Hindi ito dapat gawing eksklusibong panlalaki.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong panawagan ng refrain, ginamit ang personal na pangalang “Yahweh,” at isinalin nang natural ang kolektibong Hebreong idyoma.
