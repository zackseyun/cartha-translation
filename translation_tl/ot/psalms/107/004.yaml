  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: tl
  text: Nagpagala-gala sila sa ilang[a], sa tiwangwang na landas; wala silang natagpuang lungsod na matitirhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpagala-gala sila sa ilang, sa isang tiwangwang na lupain; wala silang natagpuang lungsod na tinitirhan.”
    reason: leksikal na alternatibo
lexical_decisions:
- source_word: תָּעוּ
  choice: Nagpagala-gala sila
  rationale: Ipinahahayag ng pandiwa ang paglalagalag o pagkaligaw. Ang “nagpagala-gala” ay nagbibigay ng diwa ng pagkilos na walang tiyak na direksiyon nang hindi ito ginagawang tahasang moral na pagkaligaw.
- source_word: בַמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְּבָּר ay tumutukoy sa ilang o disyertong di-tinatahanan. Natural at marangal sa tulang Tagalog ang “sa ilang.”
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: sa tiwangwang na landas
  rationale: Ang יְשִׁימוֹן ay isang tiwangwang o wasak na pook, at ang דֶּרֶךְ ay landas o daan. Pinagsama ang mga ito bilang paglalarawan sa landas, alinsunod sa mas malamang na pagbasa ng masinsing pariralang Hebreo.
- source_word: עִיר מוֹשָׁב
  choice: lungsod na matitirhan
  rationale: Ipinahahayag ng parirala ang isang lungsod na maaaring tirhan o pamahayan. Ang “lungsod na matitirhan” ay malinaw at natural sa modernong Tagalog.
- source_word: לֹא מָצָאוּ
  choice: wala silang natagpuang
  rationale: Tuwirang ipinahahayag ng negatibong anyo na nabigo silang makahanap; maikli at natural ang saling ito.
