base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: tl
  text: At pinababa niya ang kanilang loob[b] sa pamamagitan ng mabigat na paggawa[a]; natisod sila[c], at walang tumulong sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng pagpapagal,” “sa pamamagitan ng hirap,” o “sa pamamagitan ng pagdurusa”; ang salitang Hebreo ay maaaring tumukoy sa mabigat na paggawa, pagpapagal, hirap, o pagdurusa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang kanilang puso”; isahan ang “puso” sa Hebreo ngunit kolektibo ang kahulugan nito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sila’y nabuwal”; maaaring tumukoy ang pandiwang Hebreo sa pagkatisod o pagbagsak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: ibinaba niya
  rationale: 'Ang Hiphil ng כנע ay causative: pinababa o ipinakumbaba. Likas sa modernong Tagalog ang “ibinaba niya ang kanilang kalooban” at hindi nito dinaragdagan ang ipinahihiwatig na simuno.'
- source_word: בֶּעָמָל
  choice: sa pamamagitan ng mabigat na pagpapagal
  rationale: Maaaring tumukoy ang עָמָל sa nakapapagod na paggawa, hirap, o pagdurusa. Ang pariralang ito ay nagpapanatili sa ideya ng mabigat na paggawa bilang paraan, habang kinikilala sa talababa ang mas malawak na saklaw.
- source_word: לִבָּם
  choice: ang kanilang kalooban
  rationale: Bagaman literal na “kanilang puso” at kolektibong isahan sa Hebreo, ang “kalooban” ay likas na naghahayag dito ng panloob na tapang o disposisyon ng pangkat.
- source_word: כָּשְׁלוּ
  choice: sila'y natisod
  rationale: Pinananatili ng “natisod” ang larawan ng כשל nang hindi tiyak na ipinapalagay na tuluyan silang bumagsak.
- source_word: וְאֵין עֹזֵר
  choice: at walang tumulong sa kanila
  rationale: Likas na Tagalog itong pagpapahayag ng kawalan ng sinumang tagatulong, at pinananatili ang diwa ng אֵין kasama ng participle.
theological_decisions:
- issue: Ipinahihiwatig na simuno ng וַיַּכְנַע
  choice: 'Ang Diyos ang ipinahihiwatig na simuno: “ibinaba niya”'
  alternative: “ibinaba ang kanilang kalooban” o “napakumbaba ang kanilang kalooban” na walang tahasang gumagawa
  rationale: Sa nakapaligid na konteksto, ang PANGINOON ang nagpaparusa at nagliligtas. Pinananatili ng aktibong pang-isahang pandiwa ang pananagutang ito nang hindi idinaragdag ang pangalang “PANGINOON,” na hindi inuulit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kalooban” sa halip na literal na “puso” upang natural na maipahayag ang kolektibong panloob na kalagayan; pinanatili ang tunay na kalabuan ng עָמָל at כשל sa mga talababa.
