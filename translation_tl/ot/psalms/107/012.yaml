  naturalness: Mas likas sa modernong Tagalog ang “pinababa niya ang kanilang loob” at “natisod sila” kaysa sa “ibinaba niya ang kanilang kalooban” at ang naka-enclitic na “sila’y natisod.” Ang payak na “At” ay angkop sa marangal ngunit madaling unawaing rehistro.
  terminology: Ginamit ang “loob” para sa לֵב bilang panloob na lakas o kalagayan, nang hindi ipinipilit ang literal na “puso” sa isang idyomang hindi natural. Pinanatili ang ipinahihiwatig na Diyos na simuno sa “niya,” alinsunod sa konteksto at sa aktibong Hiphil.
