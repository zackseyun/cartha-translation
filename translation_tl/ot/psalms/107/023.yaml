  text: 'Ang mga bumababa sa dagat sakay ng mga barko,

    na nagtatrabaho[a] sa malalawak na katubigan—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na nangangalakal.” Ang salitang Hebreo ay maaaring tumukoy sa gawain o hanapbuhay, kabilang ang pangangalakal, na isinasagawa sa laot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: Ang mga bumababa
  rationale: Ang Qal participle na maramihan ay ginagamit bilang pantukoy sa isang pangkat. Pinananatili ng “mga bumababa” ang kilos at ang makatang larawan, sa halip na gawing tahasang “mga mandaragat.”
- source_word: הַיָּם
  choice: sa dagat
  rationale: Karaniwang katawagan ito sa dagat, hindi kinakailangang pangalan ng isang tiyak na anyong-tubig.
- source_word: בָּאֳנִיּוֹת
  choice: sakay ng mga barko
  rationale: Likas sa modernong Tagalog ang “sakay ng” para sa paglalakbay sa barko at malinaw nitong ipinahahayag ang gamit ng pang-ukol na ב.
- source_word: עֹשֵׂי מְלָאכָה
  choice: na nagtatrabaho
  rationale: Ang parirala ay literal na tumutukoy sa paggawa ng gawain o hanapbuhay. Hindi ito nilimitahan sa pangangalakal, yamang maaaring mas malawak ang saklaw ng מְלָאכָה.
- source_word: בְּמַיִם רַבִּים
  choice: sa malawak na karagatan
  rationale: Ang literal na “sa maraming tubig” ay di-likas sa Tagalog. Ipinahahayag ng “malawak na karagatan” ang makatang larawan ng malalaking bukas na katubigan nang hindi ipinapalagay na tumutukoy ito sa isang tiyak na dagat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at bahagyang makatang himig. Pinanatili ang larawan ng “pagbaba” sa dagat at iniwasang tukuyin ang mga tao bilang “mga mandaragat,” na mas tiyak kaysa sa Hebreo. Inilagay ang panandang talababa pagkatapos ng buong pariralang may leksikal na kalabuan.
