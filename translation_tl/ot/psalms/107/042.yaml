  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: tl
  text: Makikita ng mga matuwid at magagalak sila, at isasara ng lahat ng kawalang-katarungan ang bibig nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pambabae ang “kawalang-katarungan,” at pambabae rin ang hulaping tumutukoy rito sa “bibig nito.” Inilalarawan nito ang kawalang-katarungan na parang personang nagsasara ng sariling bibig.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: Makikita ito
  rationale: Ang Qal imperfect na ראה ay maaaring tumukoy sa pangkalahatan o hinaharap na pagkakita. Idinagdag ang likas na layong “ito” sa Filipino upang maging malinaw ang diwa, na tumutukoy sa mga gawa ng Diyos sa konteksto.
- source_word: יְשָׁרִים
  choice: mga matuwid
  rationale: Substantivized plural adjective ito para sa mga taong matuwid ang asal. Ang “mga matuwid” ay natural at hindi ipinapalit ang mas tiyak na terminong karaniwang katumbas ng צדיק.
- source_word: וְיִשְׂמָחוּ
  choice: at magagalak sila
  rationale: Pinananatili ang aktibo at masayang tugon ng שמח, at ang aspektong maaaring unawain bilang pangkalahatan o hinaharap.
- source_word: וְכָל
  choice: at ang lahat ng
  rationale: Tuwirang pinananatili ang pang-ugnay at ang saklaw ng כָּל nang hindi ginagawang tahasang pasalungat ang waw.
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Abstraktong pangngalan ito na tumutukoy sa mali o di-makatarungang kasamaan. Pinananatili ng salin ang abstraktong paksa sa halip na palitan ito ng “masasama.”
- source_word: קָפְצָה פִּיהָ
  choice: mapapatahimik
  rationale: Literal na larawan nito ang pagsara ng bibig. Ang idyomatikong “mapapatahimik” ay malinaw sa modernong Filipino at pinananatili ang diwang hindi na makapagsasalita ang kawalang-katarungan.
theological_decisions:
- issue: Personipikasyon ng kawalang-katarungan
  choice: Panatilihin bilang abstraktong “kawalang-katarungan” na mapapatahimik.
  alternative: “Isasara ng lahat ng kawalang-katarungan ang bibig nito” o gawing personal na “mga masasama.”
  rationale: Ang Hebreo ay may abstraktong pambabaeng pangngalan, hindi tahasang katawagan sa mga taong masama. Hindi ito pinalitan ng personal na paksa; ang talababa ang nag-iingat sa literal na personipikasyon ng pagsara ng bibig.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mapapatahimik” bilang natural na katumbas ng idyomang Hebreo, habang inilagay sa talababa ang literal na larawan.
