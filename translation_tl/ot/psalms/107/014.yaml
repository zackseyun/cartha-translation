  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: tl
  text: Inilabas niya sila mula sa dilim at sa lilim ng kamatayan[a], at pinatid niya ang kanilang mga gapos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matinding dilim.” Ang salitang Hebreo ay maaaring tumukoy sa lilim ng kamatayan o sa napakatinding dilim.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Inilabas niya sila
  rationale: Ang Hiphil ng יצא ay nagpapahayag ng pagpapalabas o pagdadala palabas. Ang aspektong imperpektibo ay inuunawa rito bilang bahagi ng patulang pagsasalaysay ng mga ginawa ng Diyos, kaya natural sa Filipino ang nagdaang panahong “inilabas.”
- source_word: מֵחֹשֶׁךְ
  choice: mula sa dilim
  rationale: Ang חֹשֶׁךְ ay karaniwang salita para sa dilim, at tuwirang inililipat ng “mula sa” ang preposisyong מִן.
- source_word: וְצַלְמָוֶת
  choice: at sa lilim ng kamatayan
  rationale: Pinananatili nito ang tradisyonal at posibleng pagbasa sa צַלְמָוֶת bilang larawang tumutukoy sa panganib ng kamatayan, habang inilalagay sa talababa ang iba pang makatuwirang kahulugang “matinding dilim.”
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: ang kanilang mga gapos
  rationale: Ang מוֹסְרוֹת ay mga panali, panggapos, o tanikala. Ang “mga gapos” ay natural at sapat na malawak upang hindi ipagpalagay na metal na tanikala ang tinutukoy.
- source_word: יְנַתֵּק
  choice: nilagot niya
  rationale: Ang Piel ng נתק ay nagpapahiwatig ng marahas o puwersahang paghiwalay. Ang “nilagot” ay likas na katambal ng “mga gapos” at malinaw na nagpapahayag ng paglaya.
theological_decisions:
- issue: Kahulugan ng צַלְמָוֶת
  choice: lilim ng kamatayan
  alternative: matinding dilim
  rationale: Kapuwa suportado ng leksikon ang tradisyonal na larawang “lilim ng kamatayan” at ang kahulugang “matinding dilim.” Pinananatili sa pangunahing teksto ang una dahil akma ito sa panganib at pagkabilanggo sa konteksto, ngunit hindi itinatago ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga gapos” at “nilagot” bilang natural na tambalan, at iniwasan ang mas arkaikong pananalita. Isahan ang panghalip sa Diyos ayon sa tekstong Hebreo, bagaman hindi siya tahasang pinangalanan sa talata.
