  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: tl
  text: Pagkatapos, sila'y kumaunti at napayuko dahil sa pang-aapi, kapahamakan, at dalamhati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pagkatapos, sila''y nabawasan at yumuko dahil sa pagsikil, kasamaan, at pighati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: sila'y kumaunti
  rationale: Ang Qal wayyiqtol ng מעט ay nagsasaad na sila ay naging kaunti o nabawasan. Likas sa Filipino ang “kumaunti” at malinaw nitong pinananatili ang diwa ng pagbawas sa bilang nang hindi nililimitahan iyon sa katayuang panlipunan.
- source_word: וַיָּשֹׁחוּ
  choice: napayuko
  rationale: Ang pandiwa ay maaaring tumukoy sa pagyuko o pagiging aba dahil sa matinding kalagayan. Ang “napayuko” ay nagpapanatili sa kongkretong larawan at sa pahiwatig ng pagkadusta o paghina.
- source_word: מֵעֹצֶר
  choice: dahil sa pang-aapi
  rationale: Maaaring mangahulugan ang עֹצֶר ng pagpigil, pagsikil, o pang-aapi. Binabasa rito ang מִן bilang sanhi; ang “dahil sa pang-aapi” ay natural at malinaw, samantalang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: רָעָה
  choice: kapahamakan
  rationale: Sa konteksto, ang רָעָה ay higit na tumutukoy sa masamang pangyayari o sakuna kaysa sa moral na kasamaan. Ang “kapahamakan” ay angkop sa marangal na panulaan at hindi nagdaragdag ng moral na pakahulugan.
- source_word: וְיָגוֹן
  choice: at dalamhati
  rationale: Ang יָגוֹן ay matinding lungkot o pighati. Ang “dalamhati” ay natural, dignified, at nagpapanatili sa bigat ng emosyon sa hulihan ng tatluhang parirala.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at bahagyang makatang himig. Pinanatili ang pagkakasunod ng tatlong sanhi at ang konkretong larawan ng pagyuko. Ang “sila'y” ay ginamit para sa maayos na ritmo nang hindi nagiging lipas ang wika.
