  source_fidelity: 'Ang pangunahing diwa ay wastong naihatid: ang Diyos na ipinahihiwatig ng konteksto ay nagsalita, pinabangon ang mabagyong hangin, at ang hangin ang nagtaas ng mga alon. Gayunman, ang “hanging may dalang bagyo” ay mas nagpapahiwatig ng hanging nagdadala ng bagyo kaysa sa Hebreong “hangin ng bagyo/mabagyo na hangin.”'
