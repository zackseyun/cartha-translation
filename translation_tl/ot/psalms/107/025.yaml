  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: tl
  text: Sapagkat nagsalita siya at pinabangon niya ang hangin ng bagyo[a], at itinaas nito ang mga alon ng dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinabi niya at pinabangon niya ang hangin ng bagyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nagsalita siya
  rationale: Karaniwang nangangahulugang ‘magsabi/magsalita’ ang אמר. Pinananatili ng ‘nagsalita’ na bumangon ang bagyo sa salita ng Diyos nang hindi tahasang dinaragdagan ang diwa bilang isang utos.
- source_word: וַיַּעֲמֵד
  choice: pinabangon
  rationale: Ang Hiphil ng עמד ay causative, ‘pinatayo’ o ‘pinalitaw/pinabangon.’ Likas sa makatang Filipino ang ‘pinabangon’ para sa pagpapakilos sa hanging may dalang bagyo.
- source_word: רוּחַ סְעָרָה
  choice: hanging may dalang bagyo
  rationale: Tahasang pinananatili ang רוּחַ bilang ‘hangin’ at inilalarawan ito ng סְעָרָה bilang mabagyo. Mas natural ito sa modernong Filipino kaysa ‘hanging-bagyo.’
- source_word: וַתְּרוֹמֵם
  choice: itinaas nito
  rationale: Ang pambabaeng isahang pandiwa ay tumutukoy sa רוּחַ; kaya ang hangin ang tahasang paksa ng ‘itinaas.’
- source_word: גַּלָּיו
  choice: ang mga alon ng dagat
  rationale: May panlalaking isahang hulaping paari ang salita, na pinakamalamang na tumutukoy sa dagat sa konteksto. Nililinaw ng Filipino ang likas na kaugnayan nang hindi gumagamit ng malabong ‘mga alon nito.’
theological_decisions:
- issue: Di-tahasang banal na simuno
  choice: ‘siya,’ na tumutukoy sa PANGINOON sa konteksto
  alternative: Ulitin ang ‘PANGINOON’ sa mismong talata
  rationale: Nasa pandiwa ang simuno at ang naunang konteksto ang tumutukoy sa Diyos. Pinananatili ng panghalip ang daloy ng Hebreo at hindi nagdaragdag ng pangngalang wala rito.
translation_notes:
  register: 'Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makatang sanhi at kilos: nagsalita ang Diyos, pinabangon ang hangin, at ang hangin ang nagtaas sa mga alon.'
