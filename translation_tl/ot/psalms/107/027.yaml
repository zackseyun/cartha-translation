  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: tl
  text: Sila'y gumigiray-giray at pasuray-suray na parang lasing, at ang lahat nilang karunungan[a] ay nilamon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasanayan”; sa konteksto, tumutukoy ito sa kanilang praktikal na kaalaman o husay sa paglalayag na hindi na nila mapakinabangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: pagiray-giray
  rationale: Ipinahihiwatig ng pandiwa ang hindi matatag at pasuray-suray na pagkilos; likas at malinaw sa Filipino ang “pagiray-giray” at hindi nito ipinipilit ang posibleng literal na diwang “paikot-ikot.”
- source_word: וְיָנוּעוּ
  choice: at pasuray-suray
  rationale: Pinananatili nito ang ikalawang pandiwa ng pag-uga o pag-undayog at ang makatang paralelismo ng dalawang magkalapit na kilos.
- source_word: כַּשִּׁכּוֹר
  choice: na parang lasing
  rationale: Tuwirang pinananatili ang paghahambing sa isang taong lasing sa maikli at natural na Filipino.
- source_word: וְכָל חָכְמָתָם
  choice: at ang lahat nilang karunungan
  rationale: Ang “karunungan” ang pinakamalapit na tuwirang katumbas ng חָכְמָה, habang ipinapaliwanag sa talababa ang kontekstuwal na diwa nitong praktikal na kasanayan.
- source_word: תִּתְבַּלָּע
  choice: ay nilamon
  rationale: Pinananatili ang kongkretong talinghaga ng pagkaubos o pagkalupig sa halip na palitan ito ng mas interpretibong “nawalan ng saysay” o “nabigo.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may dignidad at makatang ritmo. Ginamit ang magkatambal na “pagiray-giray” at “pasuray-suray” upang mapanatili ang dalawang pandiwa ng tekstong Hebreo, at inilagay ang talababa sa “karunungan,” na siyang salitang aktuwal na nililinaw nito.
