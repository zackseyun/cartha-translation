  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: tl
  text: Ginagawa niyang tipunan ng tubig ang ilang[a], at mga bukal ng tubig ang tuyong lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lawa” o “latian.”
    reason: lexical_alternative
  - marker: b
    text: O “mga pinagmumulan ng tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: Ginagawa niya
  rationale: Ang שׂים ay maaaring mangahulugang ‘ilagay,’ ‘gawin,’ o, ayon sa konteksto, ‘gawing.’ Dito, malinaw na pagbabago ng kalagayan ang inilalarawan; natural sa Tagalog ang ‘ginagawa niyang … na …’ at hindi nito dinaragdagan ang diwa.
- source_word: מִדְבָּר
  choice: ang ilang
  rationale: Ang מִדְבָּר ay lupaing ilang o disyerto. Ang ‘ilang’ ay malawak at likas na salin sa makatang paghahambing, nang hindi ipinapalagay na mabuhanging disyerto lamang.
- source_word: לַאֲגַם מַיִם
  choice: na isang lawa ng tubig
  rationale: Ang אֲגַם ay maaaring tumukoy sa lawa, tipunan ng tubig, o latian. Ang ‘isang lawa ng tubig’ ay malinaw at pinananatili ang larawan ng nakatipong tubig bilang kabaligtaran ng ilang.
- source_word: וְאֶרֶץ צִיָּה
  choice: at ang tuyong lupain
  rationale: Tuwirang inilalarawan ng צִיָּה ang lupang tuyo o tigang. Ang ‘tuyong lupain’ ay payak, marangal, at nagpapanatili sa paghahambing sa tubig.
- source_word: לְמֹצָאֵי מָיִם
  choice: na mga bukal ng tubig
  rationale: Ang מוֹצָא ay pinagmumulan o labasan ng tubig. Ang pangmaramihang ‘mga bukal ng tubig’ ay natural sa Tagalog at tumutugma sa anyong maramihan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang magkatimbang na estruktura at ang pagbabagong mula sa tuyong lupain tungo sa masaganang tubig. Ginamit ang ‘Ginagawa niya’ sa halip na mas mabigat na ‘Binabago niya’ upang manatiling malapit sa malawak na saklaw ng pandiwang Hebreo.
