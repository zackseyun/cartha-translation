  naturalness: Kailangan ang rebisyon sa sintaksis. Ang estrukturang “Ginagawa niyang X ang Y” ang karaniwang modernong Tagalog para sa ‘turns/makes Y into X.’ Ang “tipunan ng tubig” ay mas malawak at mas angkop kaysa “lawa ng tubig” para sa אֲגַם, na maaari ring tumukoy sa lawa o latian.
  terminology: Pinanatili ang “ilang,” “tuyong lupain,” at “mga bukal ng tubig,” na angkop sa makata at marangal na rehistro. Hindi kailangan ng pagbabago sa anumang teolohikal na termino.
