translation:
  language: tl
  text: At dumaing sila kay Yahweh sa kanilang kagipitan[a]; iniligtas niya sila mula sa kanilang mga matitinding paghihirap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanilang kapighatian” o “sa kanilang kasalatan.” Isahan ang salitang Hebreo rito; ang kasunod na salitang Hebreo, na isinaling “mga matitinding paghihirap,” ay maramihan at nagbibigay-diin sa sari-saring anyo ng pagdurusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Kaya dumaing sila
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang “dumaing” ay likas at marangal na Filipino para sa apurahang paghingi ng tulong sa gitna ng panganib.
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang likas na panandang Filipino para sa direksiyon ng pagdaing sa isang personal na pinatutungkulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בַּצַּר לָהֶם
  choice: sa kanilang kagipitan
  rationale: Ang צַר ay tumutukoy sa kalagayan ng matinding hirap o pagkakapos. Ang “kagipitan” ay maikli, natural, at angkop sa kolektibong isahan ng Hebreo.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: mula sa kanilang mga paghihirap
  rationale: Pinananatili ng “mga paghihirap” ang maramihang anyo at ipinahihiwatig ang sari-saring anyo ng matinding dalamhati o panggigipit.
- source_word: יַצִּילֵם
  choice: iniligtas niya sila
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o sumagip. Ang pangnagdaan ay umaayon sa umuusad na salaysay at natural sa modernong Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang paralelismo sa pagitan ng isahang “kagipitan” at maramihang “mga paghihirap,” gayundin ang tahasang pangalang Yahweh.
