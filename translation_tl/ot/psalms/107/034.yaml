  terminology: Ang “mabungang lupain,” “kasamaan,” at “mga naninirahan dito” ay angkop. Pinalitan ang “maalat na ilang” ng “maalat na lupain” upang manatiling malapit sa literal na larawan ng Hebreo nang hindi nagdaragdag ng “ilang.”
