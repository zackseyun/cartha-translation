  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: tl
  text: 'Ginagawa niyang maalat na lupain ang mabungang lupain,

    dahil sa kasamaan ng mga naninirahan dito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: mabungang lupain
  rationale: Ang literal na pariralang “lupain ng bunga” ay idyomatikong tumutukoy sa lupaing sagana at produktibo; natural itong naipahahayag bilang “mabungang lupain.”
- source_word: לִמְלֵחָה
  choice: ginagawang maalat na ilang
  rationale: Ang לְ ay nagpapahiwatig ng kinalabasan ng pagbabago, at ang מְלֵחָה ay tumutukoy sa maalat o salinang kalagayan na nagbubunga ng pagkabaog ng lupa. Pinananatili ng “maalat na ilang” ang konkretong larawan ng asin at ang diwang hindi mapakinabangan ang lupain.
- source_word: מֵרָעַת
  choice: dahil sa kasamaan ng
  rationale: Sanhi ang ipinahahayag ng מִן sa kontekstong ito, at ang רָעָה ay tumutukoy sa kasamaan o masamang asal.
- source_word: יֹשְׁבֵי בָהּ
  choice: mga naninirahan doon
  rationale: Pinananatili nito ang pandiwang diwa ng participle na “mga naninirahan” at natural na itinuturo ng “doon” ang nabanggit na lupain.
theological_decisions:
- issue: Sanhi ng pagkatiwangwang ng lupain
  choice: Malinaw na iniuugnay ang pagbabago ng mabungang lupain sa kasamaan ng mga naninirahan dito.
  alternative: Basahin ang pagbabago bilang pangkapaligiran o pangkasaysayan lamang, na walang moral na sanhi.
  rationale: Tahasang ipinahahayag ng מֵרָעַת יֹשְׁבֵי בָהּ ang moral at sanhiang ugnayan; hindi ito dapat palabuin o alisin sa salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lupain” para sa rehiyon o kalupaan, “mabunga” para sa produktibong katangian nito, at “maalat na ilang” upang mapanatili kapwa ang literal na larawan at ang ipinahihiwatig na pagkabaog.
