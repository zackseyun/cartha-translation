    rationale: Ipinagpapatuloy ng talata ang pagkilos ng Diyos na hayag sa naunang talata. Ang “Ginagawa niyang” ay likas na Filipino at ipinapakita ang pagpapatuloy na ito nang walang pagbabago sa kahulugan.
