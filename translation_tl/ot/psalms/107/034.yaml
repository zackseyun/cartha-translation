  source_fidelity: 'Tumpak ang pangunahing diwa: ang mabungang lupain ay nagiging maalat dahil sa kasamaan ng mga naninirahan dito. Gayunman, ang “maalat na ilang” ay nagdaragdag ng larawang “ilang” na wala sa מְלֵחָה, na pangunahing tumutukoy sa kaalatang kalagayan o maalat na lupain. Ang pandiwang “ginagawang” ay maaari ring linawin sa pamamagitan ng ipinahihiwatig na tagaganap mula sa kalapit na konteksto.'
