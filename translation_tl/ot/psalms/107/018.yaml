translation:
  language: tl
  text: Suklam na suklam sila sa lahat ng pagkain[a], at lumapit sila sa mga pintuan ng kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na diwa ng Hebreo: “Ang kanilang nefesh ay nasusuklam sa lahat ng pagkain.” Ang nefesh ay maaaring tumukoy sa kanilang sarili, buhay, o gana; maaari rin itong isalin na “Suklam na suklam ang kanilang gana sa lahat ng pagkain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: lahat ng pagkain
  rationale: Likas sa modernong Tagalog at pinananatili ang kolektibong kabuuang diwa ng כָּל kasama ng אֹכֶל.
- source_word: תְּתַעֵב
  choice: nasusuklam
  rationale: Ipinahahayag ng Piel ng תעב ang matinding pagkamuhi o pagkasuklam; malinaw at kasalukuyang Tagalog ang “nasusuklam.”
- source_word: נַפְשָׁם
  choice: sila
  rationale: Sa kontekstong may pagkain, maaaring tumukoy ang נֶפֶשׁ sa sarili o gana. Ang “sila” ay natural na Tagalog at kumakatawan sa buong taong nakararanas ng pagkasuklam, habang inilalahad sa talababa ang literal na larawan at posibleng diwang “gana.”
- source_word: וַיַּגִּיעוּ עַד
  choice: lumapit sila sa
  rationale: Ang Hifil ng נגע kasama ng עַד ay nagpapahiwatig ng pagdating o paglapit hanggang sa isang hangganan. Pinananatili ng “lumapit ... sa” ang diwa ng nalalapit na kamatayan nang hindi ipinahihiwatig na nakatawid na sila sa hangganan.
- source_word: שַׁעֲרֵי מָוֶת
  choice: mga pintuan ng kamatayan
  rationale: Tuwirang pinananatili ang Hebreong metapora ng hangganan o bungad ng kamatayan, nang hindi ipinapasok ang Sheol na wala sa parirala.
theological_decisions:
- issue: Pagpapakahulugan sa נֶפֶשׁ sa konteksto ng malubhang karamdaman
  choice: sila
  alternative: ang kanilang kaluluwa / ang kanilang gana
  rationale: Malawak ang saklaw ng נֶפֶשׁ—sarili, buhay, o gana. Ang “sila” ay hindi naghihiwalay ng kaluluwa sa katawan at natural na naghahatid ng buong-taong karanasan; pinananatili ng talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “mga pintuan ng kamatayan” upang mapanatili ang patulang larawan, at iniwasan ang mas teknikal o denominasyonal na pagpapakahulugan sa נֶפֶשׁ.
