  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: tl
  text: Kaya dumaing sila kay Yahweh sa kanilang kagipitan[a]; iniligtas niya sila mula sa kanilang mga kahirapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH,” ang banal na pangalan ng Diyos, na tradisyonal na isinasaling “PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Kaya dumaing sila
  rationale: Ang waw-consecutive ay nagpapatuloy sa paulit-ulit na daloy ng salaysay; natural na ipinahahayag ito ng “Kaya.” Ang זעק ay isang apurahang pagdaing o paghingi ng saklolo.
- source_word: אֶל־יְהוָה
  choice: kay Yahweh
  rationale: Ang אֶל ay nagpapahayag ng patutunguhan ng pagdaing. Pinananatili ang personal na pangalang יהוה bilang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: בַּצַּר לָהֶם
  choice: sa gitna ng kanilang kagipitan
  rationale: Ang צַר ay tumutukoy sa kalagayan ng matinding hirap o kagipitan; isinasama ng “kanilang” ang diwang taglay ng לָהֶם sa likas na Tagalog.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: mula sa kanilang mga kahirapan
  rationale: Pinananatili ang maramihang anyo at ang pagkakaiba nito sa naunang צַר. Ang “mga kahirapan” ay malinaw at dignidad ang himig sa modernong Tagalog.
- source_word: יוֹשִׁיעֵם
  choice: iniligtas niya sila
  rationale: Ang Hiphil ng ישׁע ay nangangahulugang magligtas o magpalaya mula sa panganib; “iniligtas” ang tuwiran at natural na katumbas.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang banal at iniiwasang palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “dumaing” upang ipakita ang apurahang paghingi ng saklolo, at pinanatili ang bahagyang pagkakaiba ng “kagipitan” at “mga kahirapan” sa dalawang magkaugnay ngunit magkaibang salitang Hebreo.
