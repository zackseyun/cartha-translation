translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” upang manatiling pampamayanan at hindi labis na makodigong pansimbahan; ang “matatanda” ay tumutukoy sa kinikilalang mga pinuno ng pamayanan, hindi lamang sa mga lalaking may edad.
