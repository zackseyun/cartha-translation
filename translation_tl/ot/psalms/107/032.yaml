  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: tl
  text: Dakilain nila siya sa kapulungan ng bayan[a], at purihin siya sa konseho ng mga nakatatanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kongregasyon” sa halip na “kapulungan.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “upuan” o “pag-upo ng mga nakatatanda”; ang “konseho” ay naghahatid ng diwa ng kanilang nakaupong pagtitipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Dakilain nila siya
  rationale: Ang רומם ay tumutukoy sa hayagang pagtataas o pagbibigay ng mataas na karangalan. Likas at marangal sa Filipino ang “dakilain” at angkop ito sa panawagang pumuri.
- source_word: בִּקְהַל עָם
  choice: sa kapulungan ng bayan
  rationale: Ang קהל ay isang nagkakatipong pangkat o kapulungan, at ang עָם ay ang bayan bilang pamayanan. Hindi nito kailangang tukuyin ang isang bansang pampolitika.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: at sa konseho ng matatanda
  rationale: Ang מוֹשָׁב ay literal na kaugnay ng pag-upo o isang sesyon; kasama ng זְקֵנִים, ipinahihiwatig nito ang nakaupong kapulungan ng kinikilalang matatandang pinuno. Ipinahahayag ng “konseho” ang gamit ng pagtitipon nang hindi ginagawang literal na “upuan.”
- source_word: יְהַלְלוּהוּ
  choice: purihin siya
  rationale: Ang piel ng הלל ay karaniwang nangangahulugang pumuri; tuwiran at natural ang “purihin” sa kontekstong ito.
