translation:
  language: tl
  text: Ipinadala niya ang kanyang salita at pinagaling sila; iniligtas niya sila mula sa kanilang mga hukay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kanilang mga pagkawasak.” Ang salitang Hebrew ay maaaring tumukoy sa mga hukay, mga libingan, o mga kalagayan ng pagkawasak o kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Ipinadala niya
  rationale: Ang Qal imperfect na 3ms ay inuunawang pangnagdaan sa konteksto ng patulang pagsasalaysay ng mga pagliligtas ng Panginoon.
- source_word: דְּבָרוֹ
  choice: ang kanyang salita
  rationale: Pinananatili nito ang payak at siksik na diwa ng Hebrew na דָּבָר, pati ang pahiwatig ng mabisa at makapangyarihang pagsasalita ng Diyos, nang hindi ito nililimitahan sa ‘utos’ o ‘mensahe.’
- source_word: וְיִרְפָּאֵם
  choice: at pinagaling sila
  rationale: Ang Qal ng רפא ay tuwirang nangangahulugang ‘magpagaling’; ang hulaping panghalip ay tumutukoy sa mga taong nagdurusa sa naunang konteksto.
- source_word: וִימַלֵּט
  choice: iniligtas niya sila
  rationale: Ang Piel ng מלט ay nagpapahayag ng pagpapalaya o pagsagip sa panganib. Ang ‘iniligtas’ ay natural sa Filipino at angkop sa bokabularyo ng salmo.
- source_word: מִשְּׁחִיתוֹתָם
  choice: mula sa mga kapahamakang kinasadlakan nila
  rationale: Ipinahahayag ng ‘mga kapahamakan’ ang maramihang anyo at ang malawak na diwa ng pagkawasak o kapahamakang dulot ng bingit ng kamatayan. Ginagawang natural ng ‘kinasadlakan nila’ ang ugnayan ng hulaping 3mp sa Filipino, habang inilalagay sa talababa ang posibleng mas kongkretong pagbasa na ‘mga hukay.’
theological_decisions:
- issue: Posibleng labis na teolohikal na pagbasa sa ‘kanyang salita’
  choice: Panatilihin ang ‘kanyang salita’ bilang mabisang pahayag ng Diyos nang hindi tinutukoy bilang isang hiwalay o mesiyanikong persona.
  alternative: Isalin bilang ‘kanyang utos’ o tahasang tukuyin bilang isang personipikadong Salita.
  rationale: Sinasabi ng Hebrew na ipinadala ng Diyos ang kanyang salita upang magpagaling at magligtas. Maaaring magkaroon ito ng mas malawak na kanonikal na alingawngaw, ngunit hindi dapat idagdag sa salin ang isang pagkakakilanlang hindi tahasang sinasabi ng salmo.
- issue: Saklaw ng מִשְּׁחִיתוֹתָם
  choice: Gamitin sa pangunahing teksto ang malawak na ‘mga kapahamakan,’ at panatilihin sa talababa ang kongkretong ‘mga hukay’ at iba pang posibilidad.
  alternative: ‘mula sa kanilang mga hukay’
  rationale: 'Tunay na may leksikal na kalabuan ang salita: maaari itong tumukoy sa mga hukay, libingan, o mga kalagayan ng pagkawasak. Hindi dapat tahimik na alisin ang kalabuan.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang ‘kinasadlakan’ upang maipakita ang larawang mula sa panganib o pagkawasak nang hindi ginagawang lubhang literal ang taludtod.
