  naturalness: Natural at marangal ang “Ipinadala niya ang kanyang salita at pinagaling sila; iniligtas niya sila…”. Mas tuwiran at natural sa modernong Filipino ang “mula sa kanilang mga hukay” kaysa “mula sa mga kapahamakang kinasadlakan nila.”
  terminology: Ang “kanyang salita,” “pinagaling,” at “iniligtas” ay angkop at hindi nagpapasok ng teolohikal na pagpapakahulugang wala sa talata. Ang “mga hukay” ay isang malinaw na pangunahing salin para sa salitang Hebrew, at ang talababa ang mag-iingat sa saklaw na “pagkawasak/kapahamakan” at “mga libingan.”
