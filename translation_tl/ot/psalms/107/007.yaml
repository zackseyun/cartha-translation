  text: He led them by a straight way to go to a city to dwell in[a].
translation:
  language: tl
  text: Inakay niya sila sa isang tuwid na daan patungo sa isang lungsod na matitirhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Inakay niya sila sa isang tuwid na daan upang makarating sa isang lungsod na tirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Inakay niya sila
  rationale: Ang Hiphil ng דרך ay nangangahulugang umakay o gumabay sa isang landas. Likas sa modernong Tagalog ang “inakay” at napananatili nito ang diwang may aktibong gumagabay.
- source_word: בְּדֶרֶךְ
  choice: sa isang ... daan
  rationale: Ang דֶּרֶךְ ay daan, landas, o ruta. Ang “daan” ay angkop sa literal na paglalakbay sa konteksto.
- source_word: יְשָׁרָה
  choice: tuwid
  rationale: Maaaring mangahulugan ang salita ng tuwid, tama, o matuwid. Sa konteksto ng paglalakbay, pinananatili ng “tuwid” ang konkretong larawan ng direkta at wastong ruta.
- source_word: לָלֶכֶת אֶל
  choice: patungo sa
  rationale: Ang infinitive na לָלֶכֶת kasama ng אֶל ay nagpapahayag ng pagkilos at direksiyon. Ang “patungo sa” ay natural sa Tagalog matapos ang paglalarawan sa daan, bagaman hindi nito hiwalay na inuulit ang literal na “upang pumunta.”
- source_word: עִיר
  choice: isang lungsod
  rationale: Ang עִיר ay lungsod o bayan. Ang “lungsod” ang tuwirang katumbas at umaangkop sa larawan ng ligtas na pamayanang mararating.
- source_word: מוֹשָׁב
  choice: na matitirhan
  rationale: Ang מוֹשָׁב ay tirahan, paninirahan, o pook na tinitirhan. Sa construct phrase na עִיר מוֹשָׁב, malinaw at natural ang “lungsod na matitirhan,” habang ang mas pormal na anyo ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “inakay” sa halip na mas teknikal na “pinatnubayan,” at pinanatili ang konkretong “tuwid na daan.” Nasa pangunahing teksto ang marker na [a].
