  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: tl
  text: Magpasalamat kayo kay Yahweh[a], sapagkat siya ay mabuti, sapagkat magpakailanman ang kanyang tapat na pag-ibig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong יהוה (YHWH) ay personal na pangalan ng Diyos; isinalin dito bilang “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang kanyang katapatan sa tipan.” Ang Hebreong חֶסֶד ay tumutukoy sa tapat, matibay, at mapagmahal na debosyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Magpasalamat kayo
  rationale: Ang Hiphil na pautos na maramihan ng ידה ay panawagan sa buong pamayanan na magpasalamat o magpuri. Ang “Magpasalamat kayo” ang pinakanatural at tiyak sa kontekstong ito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay tumutukoy sa pinag-uukulan ng pasasalamat, at ang יהוה ay pinanatili bilang personal na pangalang “Yahweh.”
- source_word: כִּי
  choice: sapagkat
  rationale: Sa dalawang paglitaw nito, ipinakikilala ng כִּי ang mga dahilan ng panawagang magpasalamat. Pinananatili ng “sapagkat” ang magkapantay na hulma ng Hebreo.
- source_word: טוֹב
  choice: mabuti
  rationale: Malawak ang saklaw ng טוֹב at maaaring tumukoy sa likas na kabutihan at mapagkalingang paggawa ng Diyos; hindi ito kailangang paliitin sa “mabait” o “mapagbigay.”
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Tuwirang ipinapahayag nito ang walang-hanggang tagal. Ang ayos na “magpakailanman ang…” ay natural sa Filipino at hindi na nangangailangang magdagdag ng tahasang pandiwa.
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Sinasaklaw ng חֶסֶד ang pag-ibig, katapatan, awa, at matibay na debosyon sa ugnayan. Pinananatili ng “tapat na pag-ibig” ang pagsasanib ng pagmamahal at katapatan nang hindi ito nililimitahan sa isang aspekto lamang.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang יהוה sa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang kumakatawan rito kaysa palitan ito ng isang titulo.
- issue: Paglilipat ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; habag; wagas na pag-ibig
  rationale: Pinananatili ng “tapat na pag-ibig” ang teolohikal na lawak ng salita—pagmamahal na matibay at mapagkakatiwalaan—nang hindi ipinapalagay na ang salitang “tipan” ay tahasang nasa talata.
- issue: Pandiwa sa huling sugnay
  choice: magpakailanman ang kanyang tapat na pag-ibig
  alternative: nananatili magpakailanman ang kanyang tapat na pag-ibig
  rationale: Walang tahasang pandiwa sa Hebreong לְעוֹלָם חַסְדּוֹ. Ang sugnay na walang idinagdag na “nananatili” ay malinaw sa Filipino at mas malapit sa pormal na pagkakabuo ng pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pangmaramihang “kayo” upang ilantad ang bilang ng pautos sa Hebreo. Pinanatili ang dalawang “sapagkat” upang maipakita ang magkatulad na causal na sugnay ng orihinal, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
