  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: tl
  text: Ipaaalala ko ang pangalan mo sa bawat salinlahi[a]; kaya pupurihin ka ng mga bayan[b] magpakailan-kailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Babanggitin ko ang pangalan mo” o “Aalalahanin ko ang pangalan mo.” Ang pandiwang Hebreo ay nasa anyong nagpapahiwatig ng aktibong pagpapaalaala o pagpapanatili ng alaala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pasasalamatan ka ng mga bayan.” Ang pandiwang Hebreo ay maaaring mangahulugan ng pagpupuri o pasasalamat, lalo na sa konteksto ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Ipaaalala ko
  rationale: 'Ang Hiphil ng זכר ay may sanhi o aktibong diwa: kikilos ang nagsasalita upang manatiling naaalaala at binabanggit ang pangalan. Likas sa modernong Tagalog ang “ipaaalala ko” at hindi nito nililimitahan ang kilos sa pribadong pag-alala lamang.'
- source_word: שִׁמְךָ
  choice: ang pangalan mo
  rationale: Tuwirang katumbas na maaari ring sumaklaw sa dangal, katanyagan, at pagkakakilanlang iniiwan bilang alaala.
- source_word: בְּכָל דֹּר וָדֹר
  choice: sa bawat salinlahi
  rationale: Pinananatili nito ang distributibong diwa ng idyomang Hebreo—bawat sunod-sunod na salinlahi—sa natural at marangal na Tagalog.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at likas na ipinahahayag ang bunga o konklusyon ng naunang pangako.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ang maramihang anyo at ang pananaw sa maraming pangkat o bansa, nang hindi ito ginagawang iisang “bayan” lamang.
- source_word: יְהוֹדֻךָ
  choice: pupurihin ka
  rationale: Sa konteksto ng Mga Awit, ang ידה sa Hiphil ay karaniwang tumutukoy sa pampublikong pagpupuri o pasasalamat. “Pupurihin” ang pinakamalinaw sa pangunahing teksto, habang inilalagay sa talababa ang lehitimong diwa ng pasasalamat.
- source_word: לְעוֹלָם וָעֶד
  choice: magpakailan-kailanman
  rationale: Likas na idyomang Tagalog para sa mariing pagpapatuloy na walang hanggan, na tumutugma sa pinatinding pariralang Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip na nasa ikalawang panauhan sa awit tungkol sa maharlikang kasalan
  choice: Pinanatili ang tuwirang pakikipag-usap na “pangalan mo” at “ka” nang hindi tahasang kinikilala kung sino ang kinakausap.
  alternative: Maaaring unawain ang kausap bilang haring mula sa angkan ni David, o bilang may tipolohikal at mesiyanikong katuparan sa Mesiyas.
  rationale: Hindi nilulutas ng talata mismo ang buong usaping interpretatibo. Pinananatili ng salin ang pagiging bukás ng teksto at ang tensiyong teolohikal nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” at “magpakailan-kailanman” upang mapanatili ang matulaing himig nang hindi nagiging lipas o labis na pormal.
