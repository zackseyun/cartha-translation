base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: tl
  text: Aakayin sila nang may galak at pagsasaya; papasok sila sa palasyo[a] ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring mangahulugang “bulwagan,” o sa ibang konteksto ay “templo”; dito, “palasyo” ang pinakaangkop sa tagpo ng maharlikang kasalan.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: Aakayin sila
  rationale: Ang Hophal imperfect 3fp ng יבל ay nagsasaad na sila ay aakayin o dadalhin. Pinananatili ng “aakayin” ang larawan ng isang prusisyon at ang pambabaeng maramihang tinutukoy ng pandiwa nang hindi higit na tinutukoy kung sino sila.
- source_word: בִּשְׂמָחֹת
  choice: nang may galak
  rationale: Ang ב na kasama ng maramihang שְׂמָחוֹת ay nagpapahayag ng paraan o saliw. Natural sa modernong Tagalog ang “nang may galak,” habang kolektibong naipahahayag ang anyong maramihan.
- source_word: וָגִיל
  choice: at pagsasaya
  rationale: Ang גיל ay masigla at hayag na kagalakan. Ibinubukod ito sa “galak” sa pamamagitan ng “pagsasaya” upang mapanatili ang magkatambal na mga salitang pagdiriwang.
- source_word: תְּבֹאֶינָה
  choice: papasok sila
  rationale: Sa konteksto ng paglapit sa isang gusali, ang Qal imperfect 3fp ng בוא ay natural at tiyak na isinasaling “papasok sila.”
- source_word: בְּהֵיכַל
  choice: sa palasyo
  rationale: Maaaring mangahulugan ang הֵיכָל ng palasyo, bulwagan, o templo. Sa konteksto ng maharlikang kasalan sa Awit 45, “palasyo” ang pinakamalamang.
- source_word: מֶלֶךְ
  choice: ng hari
  rationale: Bagaman walang pantukoy ang Hebreo, tumutukoy ang pariralang construct sa tiyak na hari sa konteksto; natural sa Tagalog ang “ng hari.”
theological_decisions:
- issue: Ang tinutukoy ng mga pandiwang pambabaeng maramihan
  choice: Ginamit ang “sila” nang hindi higit na tinutukoy kung sino ang mga babae.
  alternative: Tahasang tukuyin sila bilang mga dalagang kasama ng babaeng ikakasal o bilang mga babae sa prusisyon.
  rationale: Ipinagpapatuloy ng talata ang larawan ng prusisyon sa kasalan mula sa naunang konteksto, ngunit hindi pinapangalanan ng mismong talata ang mga babae. Pinananatili ng “sila” ang saklaw at bahagyang kalabuan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkatambal na “galak at pagsasaya” upang mapanatili ang dalawang magkaugnay ngunit magkaibang salita sa Hebreo. Inilagay ang talababa kaagad pagkatapos ng “hari” upang malinaw na tumukoy sa salitang “palasyo.”
