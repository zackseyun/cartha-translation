  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: tl
  text: 'Para sa tagapanguna ng musika: ayon sa “Mga Liryo.”[a] Para sa mga anak ni Korah. Isang Maskil.[b] Isang awit ng mga pagsinta.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo, Shoshannim; literal na “mga liryo.” Karaniwang inuunawa ito bilang pangalan ng himig o kaayusang musikal.
    reason: lexical_alternative
  - marker: b
    text: Ang Maskil ay isang teknikal na katawagan sa mga pamagat ng Awit; maaaring tumukoy ito sa isang mapagnilay o nagtuturong komposisyon.
    reason: lexical_alternative
  - marker: c
    text: O “isang awit ng pag-ibig.” Literal sa Hebreo, “isang awit ng mga pag-ibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng awitan
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa namamahala sa pagtatanghal ng musika; malinaw sa modernong Tagalog nang hindi ipinapalagay na koro lamang ang pinamumunuan.
- source_word: עַל שֹׁשַׁנִּים
  choice: ayon sa “Mga Liryo”
  rationale: Ang עַל ay maaaring magpakilala ng himig, estilo, o kaayusang musikal, samantalang literal na “mga liryo” ang שֹׁשַׁנִּים. Pinananatili ng mga panipi ang posibilidad na pangalan ito ng himig o musikal na kaayusan.
- source_word: לִבְנֵי קֹרַח
  choice: Ukol sa mga anak ni Korah
  rationale: Maaaring magpahiwatig ang לְ ng pagkakaugnay, pag-akda, o pag-aalay. Ang “ukol sa” ay sadyang hindi tiyak at hindi agad nagpapasya sa ugnayan.
- source_word: מַשְׂכִּיל
  choice: Isang Maskil
  rationale: Teknikal na katawagan ito sa mga pamagat ng Awit at hindi tiyak ang eksaktong kahulugan; ang transliterasyon ay umiiwas sa labis na pagpapakahulugang “mapagnilay” o “nagtuturo.”
- source_word: שִׁיר יְדִידֹת
  choice: Isang awit ng mga pag-ibig
  rationale: Pinananatili nito ang di-pangkaraniwang anyong maramihan ng יְדִידֹת at ang ποιetikong kalabuan, sa halip na pakinisin agad bilang “awit ng pag-ibig.”
