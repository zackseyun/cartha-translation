    rationale: Bagaman nakatutulong ang mga panipi, ang isang talababa ay nagbibigay ng kinakailangang paglilinaw na literal itong “mga liryo” ngunit malamang ay pangalang musikal, nang hindi nagtatakda kung himig, estilo, o instrumento.
