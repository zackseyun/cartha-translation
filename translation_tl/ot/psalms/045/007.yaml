  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: tl
  text: Inibig mo ang katuwiran at kinamuhian mo ang kasamaan; kaya pinahiran ka ng Diyos, na iyong Diyos[a], ng langis ng kagalakan nang higit kaysa sa iyong mga kasama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kaya, O Diyos, pinahiran ka ng iyong Diyos ng langis ng kagalakan nang higit kaysa sa iyong mga kasama.” Maaaring unawain ang unang “Diyos” bilang pantawag sa halip na simuno ng pandiwa.'
    reason: alternative_reading
  - marker: b
    text: Sinipi sa Hebreo 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Inibig mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay tuwirang isinalin bilang natapos ngunit nananatiling makabuluhang pagkiling ng kinakausap.
- source_word: צֶּדֶק
  choice: katuwiran
  rationale: Saklaw nito ang moral na pagiging tama at makatarungan; pinananatili ng “katuwiran” ang bigat ng salitang Hebreo at ang pagtutol nito sa kasamaan.
- source_word: וַתִּשְׂנָא
  choice: at kinamuhian mo
  rationale: Pinananatili ang tahasang ikalawang panauhan at ang matinding moral na salungat sa “inibig.”
- source_word: רֶשַׁע
  choice: kasamaan
  rationale: Natural na modernong Tagalog para sa moral na kabuktutan o wickedness, at malinaw na katapat ng katuwiran.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Maikli at natural na panandang naghahayag ng bunga o dahilan sa makatang pananalita.
- source_word: מְשָׁחֲךָ
  choice: pinahiran ka
  rationale: Pinananatili ang konkretong larawan ng royal o seremonyal na pagpapahid at ang panlalaping tumutukoy sa kinakausap.
- source_word: אֱלֹהִים אֱלֹהֶיךָ
  choice: ng Diyos—ng iyong Diyos
  rationale: Sa pangunahing pagbasa, ang unang אֱלֹהִים ang simuno ng pandiwa at ang אֱלֹהֶיךָ ang nagpapakilala rito. Ginamit ang mga gitling upang malinaw ngunit hindi labis na ipaliwanag ang apposition.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: langis ng kagalakan
  rationale: Pinananatili ang construct phrase at ang makatang larawan ng langis na kaugnay ng galak, pagdiriwang, at karangalan.
- source_word: מֵחֲבֵרֶיךָ
  choice: nang higit sa iyong mga kasama
  rationale: Ipinapahayag ang paghahambing na dala ng מן nang hindi nililinaw nang higit sa teksto kung sino o ano ang eksaktong katayuan ng mga kasama.
theological_decisions:
- issue: Kung ang unang אֱלֹהִים ay simuno o pantawag
  choice: 'Binasa bilang simuno: “pinahiran ka ng Diyos—ng iyong Diyos.”'
  alternative: 'Basahin bilang pantawag: “kaya, O Diyos, pinahiran ka ng iyong Diyos.”'
  rationale: Kapwa posible sa balarila at sintaks ng Hebreo. Pinili sa pangunahing teksto ang pagbasa na tuwirang inuugnay ang אֱלֹהִים sa pandiwang “pinahiran,” ngunit inilagay sa talababa ang pantawag upang mapanatili ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal at makatang himig. Pinanatili ang tradisyonal ngunit malinaw na “katuwiran,” “pinahiran,” at “langis ng kagalakan.”
