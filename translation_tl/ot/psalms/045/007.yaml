  terminology: Ang “katuwiran,” “kasamaan,” “pinahiran,” at “langis ng kagalakan” ay angkop sa marangal at makatang rehistro at sapat na tumutugon sa Hebreong bokabularyo. Ang “O Diyos” sa talababa ay wastong pantawag at hindi dapat ilipat sa pangunahing teksto.
