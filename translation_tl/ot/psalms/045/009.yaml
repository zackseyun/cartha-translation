  terminology: Ang “mga anak na babae ng mga hari,” “reyna,” at “Ofir” ay angkop at pare-pareho sa pinagmulang teksto. Maayos na pinananatili ng talababa ang kawalang-katiyakan ng בְּיִקְּרוֹתֶיךָ at nagbibigay ang talababa sa Ofir ng sapat, di-mapagpalagay na paliwanag.
