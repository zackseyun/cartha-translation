  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: tl
  text: Ang mga anak na babae ng mga hari ay kabilang sa iyong mararangal na kababaihan[a]; sa iyong kanan ay nakatayo ang reyna, na napapalamutian ng gintong mula sa Ofir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabilang sa iyong mahahalagang kasama” o “kabilang sa iyong mararangal na ginang.” Mahirap tiyakin ang eksaktong kahulugan ng pariralang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “gintong mula sa Ofir” ay pinong ginto na iniuugnay sa Ofir, isang lugar na kilala sa Lumang Tipan dahil sa kayamanan at ginto nito.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: mga anak na babae ng mga hari
  rationale: Pinananatili ang tuwirang larawan ng Hebreong pariralang konstrukt kaysa paikliin ito bilang “mga prinsesa.”
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: kabilang sa iyong mararangal na kababaihan
  rationale: Mahirap at posibleng higit sa isa ang kahulugan ng anyo. Sa konteksto ng mga babaeng maharlika, natural itong tumukoy sa mga babaeng pinahahalagahan o pinararangalan ng kinakausap; inilalahad sa talababa ang ibang posibilidad.
- source_word: נִצְּבָה
  choice: nakatayo
  rationale: Ang anyong Niphal perfect ay naglalarawan ng nakapuwestong tindig sa tagpong makata; natural ang “nakatayo” sa Filipino.
- source_word: שֵׁגַל
  choice: reyna
  rationale: Tumutukoy sa babaeng maharlikang asawa o konsorte; “reyna” ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: לִימִינְךָ
  choice: sa iyong kanan
  rationale: Karaniwang idyomatikong salin na nagpapanatili sa larawan ng marangal na puwesto sa korte.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: napapalamutian ng gintong mula sa Ofir
  rationale: Ipinahihiwatig ng pang-ukol ang pananamit o palamuti; ang כֶּתֶם ay pinong ginto at ang Ofir ang pinagmulan nito. Nililinaw ang larawan nang hindi labis na nagpapaliwanag.
