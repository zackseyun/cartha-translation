  source_fidelity: 'Tapat ang salin sa pangunahing larawan at ugnayan ng Hebreo: ang mga anak na babae ng mga hari, ang mahirap na pariralang בְּיִקְּרוֹתֶיךָ, ang reyna sa kanan ng hari, at ang ginto ng Ofir. Ang “napapalamutian ng gintong mula sa Ofir” ay isang likas na pagpapahayag ng ipinahihiwatig na pagdadamit/pagpapalamuti sa בְּכֶתֶם אוֹפִיר, nang hindi nagdaragdag ng doktrinal o historikal na pahayag.'
