  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: tl
  text: Sa iyong karilagan, sumakay ka nang matagumpay alang-alang sa katotohanan, kaamuan, at katuwiran[a]; turuan ka nawa ng iyong kanang kamay ng mga kahanga-hangang bagay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “alang-alang sa katotohanan at mapagkumbabang katuwiran.” Siksik ang pariralang Hebreo at maaari ring basahin bilang tatlong magkakaugnay na katangian: katotohanan, kaamuan, at katuwiran.'
    reason: alternative_reading
  - marker: b
    text: 'O: “at tuturuan ka ng iyong kanang kamay ng mga bagay na kasindak-sindak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: Sa iyong karilagan
  rationale: Ang הָדָר ay tumutukoy sa karilagan, kamahalan, o dangal. Ang pariralang “Sa iyong karilagan” ay natural sa Tagalog at angkop na nag-uugnay sa maharlikang larawan at sa kasunod na mga pautos.
- source_word: צְלַח רְכַב
  choice: sumulong kang matagumpay na nakasakay
  rationale: Ang צלח ay maaaring mangahulugang magtagumpay o matagumpay na sumulong, at ang רכב ay “sumakay.” Pinananatili ng salin ang parehong matagumpay na pagsulong at ang larawan ng haring nakasakay.
- source_word: עַל דְּבַר אֱמֶת
  choice: alang-alang sa katotohanan
  rationale: Dito, ang דָּבָר ay maaaring tumukoy sa usapin o layunin. Ipinahihiwatig ng עַל דְּבַר na kumikilos ang hari para sa kapakanan o layunin ng katotohanan.
- source_word: וְעַנְוָה צֶדֶק
  choice: kaamuan, at katuwiran
  rationale: Ang עַנְוָה at צֶדֶק ay magkahiwalay na salitang nangangahulugang kaamuan/pagpapakumbaba at katuwiran. Ang koordinadong pagbasa ay malinaw at tapat sa posibleng serye, habang inilalagay sa talababa ang mas siksik na ugnayan ng dalawang salita.
- source_word: וְתוֹרְךָ
  choice: turuan ka nawa
  rationale: Ang anyo mula sa ירה ay nangangahulugang magturo o magpakita. Kasunod ng mga pautos, maaari itong unawain bilang paghiling o pag-uutos; pinananatili ng “nawa” ang himig na iyon nang hindi itinatanggi ang posibleng pagbasa bilang panghinaharap.
- source_word: נוֹרָאוֹת
  choice: mga gawang kasindak-sindak
  rationale: Ang salita ay tumutukoy sa mga bagay o gawa na pumupukaw ng takot at paghanga. Ang “kasindak-sindak” ay nagpapanatili sa matinding diwa nito nang hindi ito ginagawang simpleng masama o kakila-kilabot.
- source_word: יְמִינֶךָ
  choice: iyong kanang kamay
  rationale: Pinanatili nang literal ang karaniwang larawang patula para sa kapangyarihan, kasanayan, at matagumpay na pagkilos.
theological_decisions:
- issue: Maharlika at mandirigmang larawan ng hari sa awit na kalauna’y binasang mesiyaniko
  choice: Pinanatili ang tuwirang pakikipag-usap sa hari at ang larawan ng matagumpay na nakasakay, nang walang idinagdag na tahasang mesiyanikong pagtukoy.
  alternative: Isalin ang talata sa paraang tahasang tumutukoy sa Mesiyas.
  rationale: Ang talata mismo ay nasa anyo ng tulang maharlika. Pinananatili ng salin ang agarang historikal at pampanitikang diwa habang hinahayaang lumitaw ang mas malawak na teolohikal na aplikasyon mula sa konteksto at kanon.
- issue: Ugnayan ng עַנְוָה at צֶדֶק
  choice: 'Binasa bilang magkakaugnay na serye: “kaamuan, at katuwiran.”'
  alternative: “mapagpakumbabang katuwiran” o “katuwirang may kaamuan”
  rationale: Siksik at malabo ang sintaks ng Hebreo. Ang pangunahing salin ay hindi pinag-iisa ang dalawang katangian, ngunit iniingatan sa talababa ang lehitimong pagbasa na mas malapit ang kanilang ugnayan.
- issue: Himig ng וְתוֹרְךָ
  choice: 'Isinalin bilang paghiling: “turuan ka nawa.”'
  alternative: “at tuturuan ka”
  rationale: Kasunod ito ng mga pautos at maaaring magkaroon ng kusang-loob o panalanging himig, ngunit maaari ring basahin bilang panghinaharap. Pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabagong Filipino na marangal at patula, ngunit madaling maunawaan. Ginamit ang “karilagan,” “kaamuan,” at “katuwiran” bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na arkaikong ayos at ang pagpasok ng tiyak na denominasyonal na interpretasyon.
