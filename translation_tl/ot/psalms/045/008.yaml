  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: tl
  text: Mabango sa mira, kahoy na aloe[a], at kasia ang lahat ng damit mo; mula sa mga palasyong yari sa garing[b], pinasaya ka ng mga tugtugin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “aloe” rito ay mabangong kahoy na ginagamit na pabango, marahil ay agarwood, at hindi ang makatas na halamang aloe na karaniwang kilala ngayon.
    reason: lexical_alternative
  - marker: b
    text: Ang parirala ay maaari ring isaling “mula sa mga bulwagang yari sa garing,” “buhat sa mga palasyong yari sa garing,” o, ayon sa ibang pag-unawa, “dahil sa mga palasyong yari sa garing.”
    reason: alternative_reading
  - marker: c
    text: Hindi tahasang binanggit sa Hebreo kung sino o ano ang “nagpasaya” sa iyo. Maaaring tumukoy ito sa mga tugtugin, mga musikero, o—ayon sa tradisyonal na pagpapakahulugan—mga instrumentong de-kuwerdas.
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: mira
  rationale: Karaniwang tawag sa Tagalog sa mabangong dagta na kilala bilang myrrh; angkop sa kontekstong biblikal.
- source_word: וַאֲהָלוֹת
  choice: kahoy na aloe
  rationale: Tumutukoy sa mabangong kahoy o pabango, hindi sa makatas na halamang karaniwang tinatawag ngayong aloe. Nilinaw ito sa talababa.
- source_word: קְצִיעוֹת
  choice: kasia
  rationale: Mabangong balat ng punongkahoy o espesya; ang “kasia” ang maikli at tumpak na katumbas.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: ang lahat ng damit mo
  rationale: Walang tahasang pandiwa ang Hebreo. Ang “Mabango sa … ang lahat ng damit mo” ay natural sa Tagalog at malinaw na ipinahihiwatig na taglay ng mga damit ang mga halimuyak.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: mula sa mga palasyong yari sa garing
  rationale: Sa konteksto ng maharlikang kasalan, ang הֵיכָל ay angkop na unawaing “palasyo,” at ang שֵׁן ay idyomatikong tumutukoy sa garing.
- source_word: מִנִּי
  choice: mula sa
  rationale: Inunawa itong nagpapahayag ng pinagmulan, kasabay ng naunang מִן. Dahil pinagtatalunan ang eksaktong ugnayan nito sa pangungusap, inilagay sa talababa ang ibang posibilidad.
- source_word: שִׂמְּחוּךָ
  choice: pinasaya ka
  rationale: Tumpak at natural na salin ng Piel perfect na nangangahulugang “ginawa kang masaya” o “pinasaya ka.”
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: mga tugtugin
  rationale: Hindi binanggit sa tekstong Hebreo ang maramihang simuno. Ang “mga tugtugin” ay akma sa pagdiriwang sa palasyo ngunit hindi kasing-tiyak ng “mga instrumentong de-kuwerdas”; pinanatili sa talababa ang kawalang-katiyakan.
theological_decisions:
- issue: Maharlika at posibleng mesiyanikong konteksto ng Awit 45
  choice: Isinalin ang talata ayon sa agarang tagpo ng maharlikang kasalan at pagdiriwang.
  alternative: Gumamit ng pananalitang tahasang mesiyaniko batay sa mas huling pagbasa sa kabuuan ng Kasulatan.
  rationale: Inilalarawan mismo ng talata ang karangyaan at kasayahan ng hari. Hindi dapat idagdag sa mismong salin ang tipolohikal o mesiyanikong pagbasa na hindi tahasang sinasabi ng Hebreo sa talatang ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “damit” sa halip na mas makalumang “kasuotan,” at “mga tugtugin” upang maging natural habang kinikilala sa talababa na hindi tiyak ang simuno sa Hebreo.
