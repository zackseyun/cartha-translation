  yaml_path: translation/ot/psalms/045/013.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: tl
  text: Lubos na maringal ang anak na babae ng hari sa loob[a]; ang kanyang kasuotan ay yari sa hinabing ginto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maringal sa kalooban ang anak na babae ng hari,” o “Maringal ang anak na babae ng hari sa loob ng palasyo.” Maaaring tumukoy ang “sa loob” sa panloob niyang karilagan o sa kanyang pagiging nasa loob ng palasyo o silid.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang kanyang kasuotan ay napapalamutian ng mga palamuting ginto” o “binurdahan ng ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: lubos na maringal
  rationale: Ginagamit ang כָּל bilang panidhi sa ideya ng karilagan o kaluwalhatian. Likas sa makabagong Tagalog ang “lubos na maringal” at angkop ito sa tagpo ng maharlikang kasalan.
- source_word: בַת מֶלֶךְ
  choice: ang anak na babae ng hari
  rationale: Pinananatili ang tahasang pananalita ng Hebreo at ang maharlikang konteksto; hindi ito agad pinaiikli sa “prinsesa.”
- source_word: פְּנִימָה
  choice: sa loob
  rationale: Pinananatili ng “sa loob” ang tunay na kalabuan kung tumutukoy ito sa kinaroroonan niya sa loob ng palasyo o silid, o sa kanyang panloob na karilagan.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: yari sa hinabing ginto
  rationale: Ipinahihiwatig ng מִשְׁבְּצוֹת ang masining na pagkakahabi, pagbuburda, o pagkakalagay ng ginto. Ang parirala ay malinaw at marangal sa Tagalog habang may talababa para sa ibang posibleng diwa.
- source_word: לְבוּשָׁהּ
  choice: ang kanyang kasuotan
  rationale: Ang “kasuotan” ay natural na panlahatang katawagan sa isinusuot niya at hindi nagpapalagay na iisang balabal lamang iyon.
theological_decisions:
- issue: Kung ang “sa loob” ay tumutukoy sa panloob na kagandahan o sa lokasyon sa palasyo
  choice: Pinanatili sa pangunahing teksto ang malabong “sa loob.”
  alternative: “sa kalooban” o “sa loob ng silid/palasyo”
  rationale: Hindi tiyak sa Hebreo kung moral o panloob na katangian ang tinutukoy, o kung inilalarawan lamang na nasa panloob na bahagi ng palasyo ang anak ng hari. Hindi dapat tahasang lutasin ng salin ang pag-igting na ito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Pinanatili ang paralelismong patula at ang kalabuan ng פְּנִימָה. Ang “anak na babae ng hari” ay sadyang mas malapit sa anyong Hebreo kaysa “prinsesa.”
