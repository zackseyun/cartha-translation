    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת צֹר
  choice: At ang anak na babae ng Tiro
  rationale: Ipinagpapatuloy ng וּ ang paglalarawan. Ang pariralang “anak na babae ng Tiro” ay personipikasyon ng lungsod o ng mga mamamayan nito, kaya pinanatili ang larawang Hebreo sa halip na tahasang tukuyin kung sino ang kinakatawan nito.
- source_word: בְּמִנְחָה
  choice: na may dalang regalo
  rationale: Maaaring mangahulugan ang מִנְחָה ng regalo, handog, o tributo. Sa konteksto ng maharlikang pagdiriwang, natural ang “may dalang regalo” at hindi nito ipinapalagay na panrelihiyong handog o sapilitang tributo ang tinutukoy.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: hihingin ... ang iyong lingap
  rationale: Bagaman literal na “pamamanhikan nila ang iyong mukha,” ang konstruksiyong ito ay idyomang nangangahulugang pagsusumamo para sa pabor. Ang “hihingin ang iyong lingap” ay malinaw at dignified na Filipino at pinananatili ang pambabaeng isahang kausap sa konteksto.
- source_word: עֲשִׁירֵי עָם
  choice: ang mayayaman sa bayan
  rationale: Tumutukoy ang pariralang konstrakto sa mayayamang kabilang sa isang bayan o sambayanan. Ang “sa bayan” ay natural at hindi labis na nagtatakda ng isang partikular na pangkat-etniko.
