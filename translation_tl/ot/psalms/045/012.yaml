  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: tl
  text: At ang anak na babae ng Tiro ay may dalang kaloob[a]; hihingi ng iyong lingap[b] ang mayayaman ng bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog” o “tributo.” Ang salitang Hebreo ay maaaring tumukoy sa kaloob, handog, o tributong inihaharap, depende sa konteksto.
    reason: lexical_alternative
