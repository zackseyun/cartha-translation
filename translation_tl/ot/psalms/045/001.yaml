translation_notes:
  register: Makabago ngunit marangal na Filipino, na pinananatili ang masiglang metapora at paralelismo ng tulang Hebreo. Ginamit ang “akda” upang malinaw na maipahiwatig ang pampanitikang konteksto, at “eskriba” upang mapanatili ang sinaunang tagpuan.
