base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: tl
  text: Umaapaw ang puso ko sa isang mabuting salita[a]; sinasabi ko, “Ang aking akda ay para sa hari.”[b] Ang dila ko ay panulat ng isang bihasang eskriba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang kaaya-ayang paksa” o “isang marangal na bagay.” Maaaring tumukoy ang pariralang Hebreo sa mismong mga salita o sa paksang ipinahahayag.
    reason: lexical_alternative
  - marker: b
    text: O “tungkol sa hari” o “sa hari.” Maaaring ipahiwatig ng pang-ukol ang paghahandog, ang paksa, o ang tuwirang kinakausap.
    reason: lexical_alternative
  - marker: c
    text: O “panulat ng isang eskribang mabilis sumulat” o “panulat ng isang handang eskriba.” Maaaring idiin ng salitang Hebreo ang bilis o kahandaan, gayundin ang kasanayang bunga ng pagsasanay.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: Umaapaw
  rationale: Ipinahihiwatig ng pandiwa ang pagbulwak o pagkilos mula sa kalooban tungo sa pagsasalita; pinananatili ng “umaapaw” ang matalinghagang lakas nito.
- source_word: לִבִּי
  choice: sa puso ko
  rationale: Likas na katumbas sa Tagalog para sa puso bilang sentro ng isip, damdamin, at kalooban.
- source_word: דָּבָר טוֹב
  choice: isang magandang salita
  rationale: Pinananatili ang malawak na kahulugan ng דָּבָר bilang salita o paksa, habang ang “maganda” ay angkop sa papuri at tula; nasa talababa ang ibang posibleng diwa.
- source_word: אֹמֵר אֲנִי
  choice: sinasabi ko
  rationale: Tuwirang katumbas na hindi labis na nagtatakda kung ito ay pagbigkas, pagdedeklara, o pag-awit.
- source_word: מַעֲשַׂי
  choice: aking akda
  rationale: Sa konteksto ng tulang inihahandog sa hari, malamang na tumutukoy ito sa nilikha o komposisyon ng makata; mas malinaw sa modernong Tagalog kaysa “gawa” nang hindi nililimitahan sa isang partikular na anyong pampanitikan.
- source_word: לְמֶלֶךְ
  choice: para sa hari
  rationale: Likas na nagpapahayag ng paghahandog o pagtatalaga, ngunit nananatiling posible ang “tungkol sa hari” o “sa hari,” kaya itinala ang mga iyon sa talababa.
- source_word: לְשׁוֹנִי
  choice: Ang dila ko
  rationale: Pinananatili ang kongkretong metapora ng bahagi ng katawan sa halip na gawing abstraktong “pananalita.”
- source_word: עֵט
  choice: panulat
  rationale: Natural at marangal na modernong katumbas ng kasangkapang panulat, nang hindi nagtatakda kung ito ay pluma o estilong panulat noong sinaunang panahon.
- source_word: סוֹפֵר
  choice: eskriba
  rationale: Pinananatili ang sinaunang konteksto at propesyonal na diwa ng isang sinanay na tagasulat.
- source_word: מָהִיר
  choice: bihasang
  rationale: Sa konteksto, maaaring tumukoy sa bilis, kahandaan, o sanay na husay. Ang “bihasang” ay natural sa Tagalog at akma sa matatas na pagsusulat, habang nasa talababa ang ibang diin.
