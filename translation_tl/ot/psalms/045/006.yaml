  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: tl
  text: Ang iyong trono[a], O Diyos, ay mananatili magpakailanman at walang hanggan; ang setro ng iyong kaharian ay setro ng katuwiran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ang iyong trono ay Diyos magpakailanman at walang hanggan,” o “Ang iyong banal na trono ay mananatili magpakailanman at walang hanggan.” Pinagtatalunan ang sintaks ng Hebreo; sinusunod ng pangunahing teksto ang pagbasa sa אֱלֹהִים bilang tuwirang pagtawag.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring panatilihin ang ayos ng Hebreo: “Setro ng katuwiran ang setro ng iyong kaharian.”'
    reason: previous_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: ang iyong trono
  rationale: Ang כִּסֵּא ay luklukan ng isang hari o pinuno. Ang “trono” ang likas at tiyak na katumbas sa konteksto ng awit na ito tungkol sa hari.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: 'Pinakamadaling unawain ang אֱלֹהִים bilang tuwirang pagtawag: “O Diyos.” Kaayon ito ng tuwirang pakikipag-usap sa awit at pinananatili ang matinding teolohikal na pahayag ng Hebreo. Inilalahad sa talababa ang iba pang seryosong pagbasa sa sintaks.'
- source_word: עוֹלָם וָעֶד
  choice: magpakailanman at walang hanggan
  rationale: Ang tambalang parirala ay mariing nagpapahayag ng walang katapusang pananatili. Likas at marangal sa makabagong Tagalog ang “magpakailanman at walang hanggan.”
- source_word: שֵׁבֶט
  choice: setro
  rationale: Sa kontekstong maharlika, tumutukoy ang שֵׁבֶט sa sagisag ng kapangyarihan ng hari, kaya mas tiyak ang “setro” kaysa “pamalo” o “tungkod.”
- source_word: מִישֹׁר
  choice: katuwiran
  rationale: Ang מִישֹׁר ay literal na kaugnay ng pagiging tuwid at dito ay tumutukoy sa moral na pagkamatuwid o pagiging makatarungan. Pinananatili ng “katuwiran” ang malawak na saklaw nito nang hindi nililimitahan sa legal na katarungan lamang.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: ang setro ng iyong kaharian
  rationale: Pinananatili nito ang ugnayang construct ng Hebreo at malinaw na iniuugnay ang setro sa paghahari o kaharian ng kinakausap.
theological_decisions:
- issue: Ang sintaktiko at teolohikal na gamit ng אֱלֹהִים sa unang linya
  choice: 'Tuwirang pagtawag: “Ang iyong trono, O Diyos, ay mananatili magpakailanman at walang hanggan.”'
  alternative: 'Maaaring basahin bilang panaguri: “Ang Diyos ang iyong trono magpakailanman at walang hanggan,” o bilang paglalarawan sa trono bilang maka-Diyos o banal.'
  rationale: Bagaman pinagtatalunan ang sintaks ng Hebreo, natural sa konteksto ang pagbasa rito bilang tuwirang pagtawag. Nakikita rin ito sa sinaunang pagtanggap sa talata at sa Hebreo 1:8. Sa halip na alisin ang tunay na tensiyong teolohikal, inilalahad sa talababa ang mga alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog para sa panulaang maharlika. Ginamit ang “setro” at “trono” bilang karaniwang terminong maharlika, at ang “mananatili” upang maging likas sa Tagalog ang nominal na pangungusap ng Hebreo nang hindi binabago ang diwa.
