base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: tl
  text: Mas makisig ka kaysa sa ibang tao[a]; biyaya ang ibinuhos sa iyong mga labi[b]. Kaya pinagpala ka ng Diyos magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “kaysa sa mga anak ng tao,” isang patulang paraan ng paghahambing sa hari sa ibang mga tao.'
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin ang “biyaya” bilang “lingap,” “alindog,” o, ayon sa diwa sa kontekstong ito, “kaaya-ayang pananalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: Ikaw ang pinakamakisig
  rationale: Ang masidhing anyo mula sa יפה ay nagpapahayag ng nakahihigit na kagandahan. Dahil isang lalaking hari ang kinakausap, natural sa modernong Tagalog ang “pinakamakisig.”
- source_word: מִבְּנֵי אָדָם
  choice: sa lahat ng tao
  rationale: Literal itong “kaysa sa mga anak ng tao,” ngunit idyomatikong tumutukoy sa ibang mga tao. Ang “sa lahat ng tao” ay malinaw na naipapahayag ang paghahambing nang hindi nagiging banyaga ang tunog.
- source_word: הוּצַק
  choice: ang ibinuhos
  rationale: Pinananatili nito ang larawang mula sa יצק, “ibuhos,” at ang ganap na aspekto ng pandiwa.
- source_word: חֵן
  choice: kagandahang-loob
  rationale: Maaaring mangahulugan ang חֵן ng biyaya, lingap, alindog, o pagiging kaaya-aya. Kaugnay ng mga labi, malamang na tumutukoy ito sa kaaya-aya at mapagbiyayang pananalita; pinananatili ng “kagandahang-loob” ang lawak na ito.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: sa iyong mga labi
  rationale: Natural na Tagalog ito para sa metapora ng isang bagay na ibinuhos sa mga labi.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Malinaw at natural na ipinapahayag ang inferensiyal na ugnayan ng dalawang sugnay.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: pinagpala ka ng Diyos
  rationale: Pinakamatuwid na sintaktikong pagbasa na ang Diyos ang simuno ng pandiwang ganap at ang hari ang tuwirang layon.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, marangal, at tumpak na katumbas ng walang hanggang tagal.
theological_decisions:
- issue: Kung ang אֱלֹהִים ay simuno (“pinagpala ka ng Diyos”) o pantawag (“O Diyos”).
  choice: 'Simuno: “pinagpala ka ng Diyos magpakailanman.”'
  alternative: 'Pantawag: “kaya, O Diyos, pinagpala ka niya magpakailanman,” na karaniwang inuugnay sa kasunod na talata.'
  rationale: Sa sugnay na ito mismo, pinakanatural na basahin ang אֱלֹהִים bilang simuno ng בֵּרַכְךָ. Hindi idinaragdag ang mga salita ng kasunod na talata o ipinipilit ang isang teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “pinakamakisig” dahil lalaking hari ang kinakausap; iniwasan ang literal ngunit di-likas na “mga anak ng tao” sa pangunahing teksto at inilagay ito sa talababa.
