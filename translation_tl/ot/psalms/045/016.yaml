reference: Psalms 45:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: tl
  text: Ang mga anak mong lalaki ang papalit sa iyong mga ninuno; itatalaga mo silang mga prinsipe sa buong daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong lupain.” Ang salitang Hebreo ay maaaring tumukoy sa “daigdig” o sa isang “lupain,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: ang ... ang papalit sa
  rationale: Ipinahahayag dito ang paghalili o pagkuha ng lugar, hindi ang pisikal na pagiging nasa ilalim. Natural sa Tagalog ang balangkas na “ang papalit sa.”
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Literal itong “iyong mga ama,” ngunit sa kontekstong dinastiko tumutukoy ito sa mga naunang salinlahi. Mas malinaw at natural sa modernong Tagalog ang “mga ninuno.”
- source_word: יִהְיוּ
  choice: ang papalit
  rationale: Ang simpleng magiging kalagayan sa Hebreo ay natural na naipahahayag sa Tagalog bilang paghalili, ayon sa diwa ng תַּחַת sa pangungusap.
- source_word: בָנֶיךָ
  choice: mga anak mong lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo at tumutukoy sa mga tagapagmanang dinastiko; pinananatili ito ng “mga anak mong lalaki.”
- source_word: תְּשִׁיתֵמוֹ
  choice: itatalaga mo sila
  rationale: Bagaman literal na “ilalagay mo sila,” ang pandiwa sa konteksto ng pamamahala ay tumutukoy sa paghirang o pagtatalaga sa tungkulin.
- source_word: לְשָׂרִים
  choice: bilang mga prinsipe
  rationale: Ang שָׂרִים ay maaaring mangahulugang mga prinsipe, pinuno, o opisyal. Ang “mga prinsipe” ay angkop sa maharlikang tagpuan at nagpapanatili ng mataas na himig.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “daigdig” o “lupain.” Pinili ang mas malawak na “daigdig” dahil akma ito sa maringal at malawak na saklaw ng awit, habang inilalahad sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa maharlika at posibleng mesiyanikong konteksto
  choice: buong daigdig
  alternative: buong lupain
  rationale: Kapuwa posible sa Hebreo ang pandaigdigan at panlokal na saklaw. Pinili sa pangunahing teksto ang “daigdig” dahil umaayon ito sa malawak na maharlikang pananalita, ngunit hindi inalis ang “lupain” bilang lehitimong pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang natural na ayos na “ang papalit sa” upang malinaw na maipahayag ang paghaliling dinastiko, at pinanatili ang mataas na rehistrong maharlika sa “mga prinsipe.”
