  source_fidelity: 'Tapat ang salin sa Hebreo: ipinahahayag nito ang paghalili ng mga anak na lalaki sa mga naunang ama/ninuno, ang pagtatalaga sa kanila bilang mga prinsipe, at ang saklaw na “buong daigdig.” Ang hinaharap na diwa ng יִהְיוּ at תְּשִׁיתֵמוֹ ay natural na naipapahayag ng “papalit” at “itatalaga mo.”'
