translation:
  language: tl
  text: At nanaisin ng hari ang iyong kagandahan[a], sapagkat siya ang iyong panginoon; yumukod[b] ka sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nawa’y hangarin ng hari ang iyong kagandahan.” Ang anyong Hebreo ay maaaring unawain bilang pahayag tungkol sa hinaharap o bilang isang paghiling o panghihikayat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magbigay-galang ka sa kanya.” Ang pandiwa ay tumutukoy sa pagyukod bilang paggalang sa isang nakatataas, sa kontekstong maharlika man o panrelihiyon. Isinasalin din ito ng ilan na “sambahin mo siya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: At nanaisin
  rationale: Ang di-ganap na anyo ng pandiwa mula sa אוה ay maaaring magpahayag ng mangyayari o magkaroon ng himig na paghiling. Ginamit sa pangunahing teksto ang likas na Filipino na “nanaisin” upang katawanin ang payak na hinaharap, habang inilalagak sa talababa ang posibleng himig na paghiling.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Tuwirang salin ng tiyak na pangngalang “ang hari”; ginamit ang “ng” dahil ang hari ang tagaganap ng pandiwang nauuna sa kanya sa pangungusap na Filipino.
- source_word: יָפְיֵךְ
  choice: ang iyong kagandahan
  rationale: Tuwirang ipinapahayag ng pangngalan na may hulaping pambabaeng ikalawang panauhan ang kagandahan ng kinakausap.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang ugnayang sanhi o batayan sa marangal ngunit madaling maunawaang wikang patula.
- source_word: אֲדֹנַיִךְ
  choice: iyong panginoon
  rationale: Ang אָדוֹן na may hulaping pambabaeng ikalawang panauhan ay isang titulong pang-ugnayan para sa hari. Ginamit ang maliit na titik upang hindi ipalagay na ito ang banal na pangalan o tiyak na titulong tumutukoy sa Diyos.
- source_word: וְהִשְׁתַּחֲוִי לוֹ
  choice: yumukod ka sa kanya
  rationale: Pinananatili ng “yumukod” ang kilos ng pagpapatirapa o pagyukod nang hindi pa ipinapasya kung ito ay paggalang sa hari o pagsambang panrelihiyon.
theological_decisions:
- issue: Kung ang וְהִשְׁתַּחֲוִי לוֹ ay dapat isalin sa tahasang panrelihiyong pananalita
  choice: yumukod ka sa kanya
  alternative: magbigay-galang ka sa kanya; sambahin mo siya
  rationale: Maaaring tumukoy ang pandiwa sa pagyukod sa Diyos o sa isang taong nakatataas. Dahil awit sa maharlikang kasal ang konteksto, pinananatili ng pangunahing salin ang mismong kilos at ang teolohikal na tensiyon sa halip na agad itong tukuyin bilang pagsamba.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Ang “nanaisin” ay mas natural at hindi kasintindi ng “pagnanasaan,” samantalang ang “yumukod” ay nagpapanatili sa konkretong larawan at sa sadyang kalabuan ng Hebreo.
