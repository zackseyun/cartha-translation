revisions:
- from: Suot ang mga kasuotang may burda, inihahatid siya sa hari.[a] Ang mga birhen[b] na sumusunod sa likuran niya—ang mga kasama niya—ay dinadala sa iyo.[c]
  to: Suot ang mga kasuotang may burda, inihahatid siya sa hari.[a] Ang mga birhen[b] na sumusunod sa likuran niya—ang mga kasama niya—ay dinadala sa iyo.[c]
  rationale: Tanging talababa a ang binago upang alisin ang maling pahiwatig na ang nobya ay may dalang burdadong bagay. Pinananatili ng bagong anyo ang leksikal na alternatibo—burdadong gawa bilang kasuotan—at ang pasibong “dinadala.” Walang pagbabago sa kahulugan ng pangunahing talata o sa pag-iingat nito sa biglang pambabaeng ikalawang-panauhang kausap sa hulihan.
