  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: tl
  text: Suot ang mga kasuotang may burda, inihahatid siya sa hari.[a] Ang mga birhen[b] na sumusunod sa likuran niya—ang mga kasama niya—ay dinadala sa iyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nakasuot ng burdadong kasuotan, dinadala siya sa hari.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga birhen” ay maaari ring isaling “mga dalaga,” ngunit mas tiyak na tumutukoy ang salitang Hebreo sa mga babaeng birhen.
    reason: lexical_alternative
  - marker: c
    text: Ang “iyo” sa Hebreo ay pambabaeng isahan, kaya malamang na biglang tuwirang kinakausap dito ang nobya. Pinapakinis ito ng ilang salin upang tumukoy sa hari o upang sabihing “kasama niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: Suot ang mga kasuotang may burda
  rationale: Ang רְקָמוֹת ay tumutukoy sa burdado o sari-saring kulay na gawang tela. Ipinahihiwatig ng konteksto ng prusisyon sa kasal na mga kasuotan ang tinutukoy, kaya idinagdag ang “kasuotan” para sa likas at malinaw na Filipino.
- source_word: תּוּבַל
  choice: inihahatid siya
  rationale: Ang Hophal na anyo ng יבל ay pasibo, “dinadala/inaakay.” Ang “inihahatid” ay angkop sa marangal at seremonyal na kilos ng prusisyon at nananatiling pasibo ang diwa.
- source_word: לַמֶּלֶךְ
  choice: sa hari
  rationale: Ang ל ay nagpapahayag ng patutunguhan; natural sa Filipino ang “inihahatid ... sa hari.”
- source_word: בְּתוּלוֹת
  choice: mga birhen
  rationale: Mas tiyak na tumutukoy ang בְּתוּלוֹת sa mga babaeng hindi pa nakikipagtalik at, sa konteksto ng kasal, sa mga dalagang kasama ng nobya. Pinananatili ng “mga birhen” ang tiyak na leksikal na diwa.
- source_word: אַחֲרֶיהָ
  choice: sumusunod sa likuran niya
  rationale: Sa konteksto ng prusisyon, ipinahihiwatig nito ang pagsunod sa likuran. Nilinaw ng “sumusunod” ang kilos habang pinananatili ng “sa likuran niya” ang puwesto.
- source_word: רֵעוֹתֶיהָ
  choice: ang mga kasama niya
  rationale: Ang salita ay nangangahulugang mga kasama o kaibigan. Hindi tinutukoy nang higit sa Hebreo ang kanilang opisyal na papel, kaya hindi ginamit ang mas tiyak na “mga abay.”
- source_word: מוּבָאוֹת
  choice: ay dinadala
  rationale: Ang Hophal participle na pambabaeng maramihan ng בוא ay may pasibong diwang “dinadala.” Ito ang tuwirang katumbas at iniiwasan ding ulitin ang “inihahatid.”
- source_word: לָךְ
  choice: sa iyo
  rationale: Ikalawang panauhang pambabaeng isahan ang hulapi sa Hebreo. Bagaman walang kasariang gramatikal ang “iyo” sa Filipino, pinananatili nito ang biglang tuwirang pakikipag-usap sa nobya at hindi ito ginagawang “sa hari” o “sa kaniya.”
theological_decisions:
- issue: Paglipat ng kausap sa huling panghalip na לָךְ
  choice: Panatilihin ang ikalawang panauhan bilang “sa iyo,” na sa Hebreo ay pambabaeng isahan at tumutukoy sa nobya.
  alternative: Gawing “sa kaniya/sa hari” o pakinisin bilang “kasama niya.”
  rationale: Malinaw na ikalawang panauhang pambabaeng isahan ang tekstong Masoretiko. Pinananatili ng salin ang makatang paglipat mula sa paglalarawan sa nobya tungo sa tuwirang pakikipag-usap sa kaniya, sa halip na tahimik na ayusin ang tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inihahatid” upang maipakita ang seremonyal na prusisyon, at ang em dash upang malinaw na ipaliwanag na ang mga birheng sumusunod ay ang mga kasama ng nobya. Hindi pinakinis ang biglang paglipat sa ikalawang panauhan sa hulihan.
