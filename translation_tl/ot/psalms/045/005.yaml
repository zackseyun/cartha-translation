  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: tl
  text: Matalas ang iyong mga palaso[a]; bumabagsak sa ilalim mo ang mga bayan; nasa puso ng mga kaaway ng hari ang mga palaso mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Matalas ang iyong mga palaso—bumabagsak sa ilalim mo ang mga bayan—sa puso ng mga kaaway ng hari.” Lubhang siksik at patula ang Hebreo. Maaari ring unawain ang huling parirala bilang: “Tumatagos ang mga palaso sa puso ng mga kaaway ng hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: ang iyong mga palaso
  rationale: Tuwirang katumbas ng pangmaramihang חֵץ na may hulaping ikalawang panauhang panlalaki; natural sa makabagong Filipino ang “mga palaso.”
- source_word: שְׁנוּנִים
  choice: matalas
  rationale: Maaaring mangahulugang “matalas” o “pinatalas.” Ang payak na pang-uring “matalas” ay natural at tapat sa anyong patula.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ang pangmaramihang mga pangkat o sambayanan; ang “mga bayan” ay mas malapit kaysa gawing iisang kolektibong bansa.
- source_word: תַּחְתֶּיךָ
  choice: sa ilalim mo
  rationale: Tuwirang inilalarawan ang pagkabuwal at pagpapasakop sa ilalim ng kausap.
- source_word: יִפְּלוּ
  choice: bumabagsak
  rationale: Ang imperpektibo ay ginawang masiglang pangkasalukuyang paglalarawan, gaya ng kilos sa tulang Hebreo; maaari rin itong unawaing panghinaharap.
- source_word: בְּלֵב
  choice: nasa puso
  rationale: Pinananatili ang literal at siksik na pariralang “sa/nasa puso” nang hindi nagdaragdag ng pandiwang “tumatagos.”
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: ng mga kaaway ng hari
  rationale: Tapat sa construct chain na “mga kaaway ng hari,” sa halip na itugma sa ikalawang panauhan bilang “iyong mga kaaway.”
theological_decisions:
- issue: Ang tinutukoy ng “hari” sa isang awit na maharlika at binabasang mesiyaniko
  choice: Panatilihin ang tahasang salitang “hari” ng tekstong Hebreo.
  alternative: Tukuyin ang hari bilang Mesiyas o gawing “iyong mga kaaway.”
  rationale: Hindi tuwirang kinikilala ng talata ang hari bilang Mesiyas. Ang pagpapanatili sa “hari” ay nagbibigay-daan sa historikal, tipolohikal, o mesiyanikong pagbasa nang hindi ipinapasok ang interpretasyon sa salin.
- issue: Ugnayang sintaktiko ng huling parirala
  choice: Panatilihin ang literal na larawang ang mga palaso ay “nasa puso” ng mga kaaway.
  alternative: “Tumatagos ang mga iyon sa puso ng mga kaaway ng hari.”
  rationale: Lubhang siksik at patula ang Hebreo. Ang alternatibo ay malinaw ngunit nagdaragdag ng pandiwang wala sa teksto; inilagay ito sa talababa bilang posibleng pagpapaliwanag.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang maigsi at siksik na anyong patula, pati ang tunay na kalabuan ng huling parirala; walang idinagdag na tahasang mesiyanikong pagkakakilanlan.
