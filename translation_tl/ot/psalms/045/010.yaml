base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: tl
  text: Makinig ka, anak, at tumingin ka; ikiling mo ang tainga mo, at limutin mo ang iyong bayan at ang sambahayan ng iyong ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Pakinggan mo, anak, at tumingin ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Makinig ka
  rationale: Ang pautos na pambabaeng isahan ng שׁמע ay humihingi ng masusing pakikinig; natural at malinaw sa makabagong Tagalog ang “makinig ka.”
- source_word: בַת
  choice: anak na babae
  rationale: Tahasang tawag ito sa babaeng kinakausap. Pinananatili ng “anak na babae” ang ugnayang ipinahihiwatig ng bokatibo nang hindi gumagamit ng makalumang “O.”
- source_word: וּרְאִי
  choice: at tumingin
  rationale: Ang pautos ng ראה ay maaaring “tingnan” o “makita.” Sa ganitong direktang panawagan, natural ang aktibong “tumingin” at napapanatili ang sunod-sunod na pautos.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: ikiling mo ang iyong tainga
  rationale: Pinananatili nito ang konkretong larawang Hebreo ng pagkiling ng tainga bilang tanda ng matamang pakikinig, habang nananatiling mauunawaan sa Tagalog.
- source_word: וְשִׁכְחִי
  choice: at limutin mo
  rationale: Tuwirang katumbas ito ng pautos mula sa שכח. Hindi ito pinalalambot bilang “iwan” upang mapanatili ang matinding panawagan sa teksto.
- source_word: עַמֵּךְ
  choice: iyong bayan
  rationale: Sa konteksto, ang עם ay tumutukoy sa pangkat o bayang kinabibilangan ng babae. Mas angkop dito ang “bayan” kaysa “mga tao mo,” na maaaring maging malabo.
- source_word: וּבֵית אָבִיךְ
  choice: at ang sambahayan ng iyong ama
  rationale: Ang בֵּית אָב ay hindi lamang gusali kundi pamilya o angkan sa ilalim ng sambahayan ng ama. Iniiwasan ng “sambahayan” ang maling pagbasa na pisikal na bahay lamang, habang pinananatili ang pampamilyang diwa.
theological_decisions:
- issue: Lakas ng tagubilin sa babaeng ikakasal
  choice: Pinanatili bilang tuwirang panawagan na limutin ang dating bayan at sambahayan ng ama, na nagpapahiwatig ng mapagpasiyang pagbabago ng pangunahing katapatan sa konteksto ng kasal.
  alternative: Basahin bilang pangkalahatang karunungang panawagan lamang sa pakikinig, na hindi binibigyang-diin ang pagbabago ng pampamilyang katapatan.
  rationale: Ang pagkakasunod-sunod ng mga pautos ay humahantong sa “limutin mo ang iyong bayan at ang sambahayan ng iyong ama.” Sa konteksto ng awit pangkasal, ipinahihiwatig nito ang matinding pagbabagong-ugnayan, ngunit hindi dinaragdagan ng salin ang anumang doktrinang wala sa talata.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang serye ng mga pautos at ang larawang “ikiling ang tainga.” Ginamit ang “limutin” upang ihatid ang lakas ng Hebreo, at “sambahayan” upang malinaw na maipakita ang panlipunan at pampamilyang kahulugan ng בֵית אָב.
