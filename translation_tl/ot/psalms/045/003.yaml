  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: tl
  text: Ikabit mo ang iyong espada sa iyong hita, O makapangyarihang mandirigma, taglay ang iyong karilagan at kamahalan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲגוֹר
  choice: Ikabit mo
  rationale: Ang pautos na pandiwa ay nangangahulugang magbigkis o magkabit ng sandata. Natural sa modernong Filipino ang “ikabit” para sa pagsusuot ng espada nang hindi nawawala ang kongkretong larawan.
- source_word: חַרְבְּךָ
  choice: ang iyong espada
  rationale: Tuwirang layon na may hulaping ikalawang panauhang panlalaki; malinaw na tumutukoy sa espada ng kinakausap.
- source_word: עַל יָרֵךְ
  choice: sa iyong hita
  rationale: Pinananatili ang tiyak at kongkretong lokasyon sa Hebreo, sa halip na paluwagin bilang “sa iyong tagiliran.”
- source_word: גִּבּוֹר
  choice: O makapangyarihang mandirigma
  rationale: Ginamit bilang pantawag sa isang bayaning mandirigma. Nililinaw ng “mandirigma” ang kontekstong pandigma, samantalang ipinahihiwatig ng “O” ang tuwirang pagtawag sa marangal na paraan.
- source_word: הוֹדְךָ
  choice: iyong karilagan
  rationale: Ang הוֹד ay tumutukoy sa maningning na dangal o karilagan, lalo na sa maharlikang konteksto. Ang “karilagan” ay marangal at naipag-iiba sa kasunod na “kamahalan.”
- source_word: וַהֲדָרֶךָ
  choice: at kamahalan
  rationale: Ang הָדָר ay maaaring tumukoy sa kamahalan, karangalan, o kadakilaan. Ang “kamahalan” ay angkop sa mataas at maharlikang himig ng awit.
theological_decisions:
- issue: Maharlika o mesiyanikong pagkakakilanlan ng kinakausap sa Awit 45
  choice: Isinalin bilang tuwirang pananalita sa isang makapangyarihang maharlikang mandirigma nang hindi tahasang tinatawag na Mesiyas.
  alternative: Tahasan itong unawain at isalin bilang pananalita tungkol sa Mesiyas batay sa mas malawak na kanonikong pagbasa.
  rationale: Sa mismong talata, ang Hebreo ay patulang pananalita sa isang hari o mandirigma at hindi tahasang nagbibigay ng titulong Mesiyas. Pinananatili ng salin ang agarang kahulugan at hinahayaang manatiling bukas ang mas malawak na teolohikal na pagbasa.
- issue: Ugnayan ng הוֹדְךָ וַהֲדָרֶךָ sa utos
  choice: Iniugnay sa pagkilos sa pamamagitan ng “taglay ang iyong karilagan at kamahalan.”
  alternative: 'Basahin ang dalawang pangngalan bilang maluwag na pagtukoy o aposisyon: “ang iyong karilagan at ang iyong kamahalan.”'
  rationale: Walang tahasang pang-ukol sa Hebreo, kaya may sintaktikong pagkaluwag. Ang “taglay ang” ay natural na nag-uugnay sa huling parirala sa utos nang hindi ipinapakahulugang ang espada mismo ang karilagan at kamahalan.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang kongkretong larawang “sa iyong hita” at ang mataas na maharlikang pares na “karilagan at kamahalan.”
