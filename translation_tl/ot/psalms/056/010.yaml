  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: tl
  text: Sa Diyos ay pupurihin ko ang salita[a]; sa Yahweh ay pupurihin ko ang salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangako” sa dalawang linya. Ang Hebreong דָּבָר ay maaaring mangahulugang “salita,” “bagay,” o “pangako,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Sa Diyos
  rationale: Ang בְּ ay nagsasaad dito ng kaugnayan o batayan ng pagpupuri. Ang “Sa Diyos” ay likas sa modernong Tagalog at pinananatili ang pagkakatulad sa “kay Yahweh,” nang hindi ginagawang tahasang kasangkapan ang Diyos.
- source_word: אֲהַלֵּל
  choice: pupurihin ko
  rationale: Ang Piel imperfect na unang panauhang isahan ay angkop unawain bilang matibay na pasiya o pahayag na nakatuon sa hinaharap; natural itong ipinahahayag sa Tagalog bilang “pupurihin ko.”
- source_word: דָּבָר
  choice: ang salita
  rationale: Maaaring mangahulugan ang דָּבָר ng “salita,” “bagay,” o, ayon sa konteksto, “pangako.” Pinananatili ng “ang salita” ang pangunahing leksikal na anyo at ang eksaktong pag-uulit sa dalawang linya, habang inilalagay sa talababa ang posibleng kahulugang “pangako.”
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang pangalang tipan na יהוה bilang “Yahweh.” Ang “kay” ang natural na panandang Tagalog para sa personal na pangalan sa ganitong pahayag ng kaugnayan at pinananatili nito ang paralelismo sa “Sa Diyos.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kung ang דָּבָר ay “salita” o “pangako”
  choice: salita sa pangunahing teksto, na may “pangako” bilang alternatibo sa talababa
  alternative: pangako sa pangunahing teksto
  rationale: Maaaring tumukoy ang konteksto sa pangako ng Diyos, ngunit hindi iyon sapilitang nililinaw ng mismong salita. Pinananatili ng salin ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatugmang “Sa Diyos” at “kay Yahweh” upang maging natural sa Tagalog habang mapanatili ang paralelismo ng tulang Hebreo.
