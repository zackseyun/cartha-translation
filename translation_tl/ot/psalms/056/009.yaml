  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: tl
  text: 'Sa gayon, uurong ang aking mga kaaway sa araw na tatawag ako. Ito ang alam ko[a]: nasa panig ko ang Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dahil dito ay nalalaman kong nasa panig ko ang Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kung magkagayon
  rationale: Ipinahahayag ang bunga o kasunod na pangyayari; natural sa Filipino at pinananatili ang lohikal-temporal na ugnayan.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: uurong
  rationale: Ang pinagsamang pandiwa at pang-abay ay tumutukoy sa pagtalikod o pag-atras ng mga kaaway; malinaw at matipid ang “uurong.”
- source_word: אוֹיְבַי
  choice: aking mga kaaway
  rationale: Tuwirang katumbas ng pangngalang may unang panauhang panandang paari.
- source_word: בְּיוֹם אֶקְרָא
  choice: sa araw na tumawag ako
  rationale: Pinananatili ang kongkretong temporal na pariralang Hebreo sa halip na gawing simpleng “kapag tumawag ako.”
- source_word: זֶה יָדַעְתִּי
  choice: Ito ang alam ko
  rationale: Pinananatili ang pangunahing deiktikong pagbasa ng זֶה, habang inilalagay sa talababa ang posibleng instrumental na pagbasa.
- source_word: כִּי
  choice: na / ipinahihiwatig ng tutuldok
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ng salmista; sa natural na Filipino, malinaw itong naihahayag sa pamamagitan ng tutuldok.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Karaniwang tawag sa Diyos at isahan ang diwa sa kontekstong ito.
- source_word: לִי
  choice: panig sa akin
  rationale: Sa konteksto ng pag-urong ng mga kaaway, ipinahahayag ng parirala ang suporta o pabor ng Diyos, hindi pagmamay-ari.
theological_decisions:
- issue: Diwa ng אֱלֹהִים לִי
  choice: ang Diyos ay panig sa akin
  alternative: ang Diyos ay para sa akin / ang Diyos ay akin
  rationale: Ang sugnay ay eliptikal, ngunit ipinahihiwatig ng konteksto na sinusuportahan o kinakampihan ng Diyos ang salmista. Hindi pinili ang pagbasa ng pagmamay-ari dahil hindi iyon ang pinakamalinaw na diwa rito.
- issue: Ugnayan ng זֶה sa kasunod na pahayag
  choice: '“Ito ang alam ko”: ang kasunod na sugnay ang nilalaman ng kaalaman'
  alternative: “Sa pamamagitan nito ay nalalaman ko”
  rationale: Parehong posible sa Hebreo. Pinili sa teksto ang payak na deiktikong pagbasa at pinanatili sa talababa ang instrumental na pagbasa upang hindi mawala ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “uurong” bilang natural na katumbas ng idyomang Hebreo at “panig sa akin” upang malinaw na ipahayag ang banal na suporta nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
