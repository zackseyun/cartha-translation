- source_word: שָׁאֲפוּ
  choice: sabik na nilulusob
  rationale: Pinananatili ng “sabik” ang larawan ng sabik o humihingal na paghabol na taglay ng pandiwa, samantalang ipinakikita ng “nilulusob” ang malinaw na masamang layunin sa konteksto nang hindi tiyakang pinipili ang mas interpretatibong “niyuyurakan.”
- source_word: שׁוֹרְרַי
  choice: mga kaaway ko
