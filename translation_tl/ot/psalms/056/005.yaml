lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Buong araw
  rationale: Likas na pariralang Filipino para sa patuloy na pagkilos sa buong maghapon.
- source_word: דְּבָרַי
  choice: ang mga salita ko
  rationale: Bagaman maaari ring mangahulugang “mga bagay” o “mga usapin,” ang “mga salita” ang pinakamalinaw na katambal ng pandiwang tumutukoy sa mapanirang pagbaluktot.
- source_word: יְעַצֵּבוּ
  choice: binabaluktot
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa, na maaaring tumukoy sa pananakit, pagpapahirap, o pagbaluktot. Sa layong “mga salita ko,” ang “binabaluktot” ay malinaw na nagpapahayag ng masamang paglilihis sa sinabi ng salmista.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Ipinakikita ng konteksto ang pagkapoot, kaya mas angkop ang adversatibong “laban sa akin” kaysa sa literal na “sa akin” o “tungkol sa akin.”
- source_word: כָּל מַחְשְׁבֹתָם
  choice: lahat ng iniisip nila
  rationale: Pinananatili nito ang malawak na diwa ng מַחְשָׁבוֹת bilang mga iniisip, bagaman maaari rin itong tumukoy sa mga balak o pakana.
- source_word: לָרָע
  choice: naglalayong gumawa ng masama
  rationale: Ipinahahayag ang direksiyon o layunin ng pariralang Hebreo, habang pinananatili ang moral na diwa ng “masama” at hindi lamang ang bunga nitong pinsala.
