  text: Buong araw nilang binabaluktot ang mga salita ko[a]; lahat ng iniisip nila ay laban sa akin at para sa masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinipinsala nila ang mga salita ko.” Mahirap tiyakin ang diwa ng pandiwang Hebreo; maaari itong mangahulugang manakit, magdulot ng pighati, o bumaluktot. Sa kontekstong ito, malamang na tumutukoy ito sa masamang pagbaluktot sa mga sinabi ng salmista.
