translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang sunod-sunod at maigting na mga sugnay ng Hebreo. Ginamit ang “minamatyagan” upang ipakita ang mapanlabang pagsubaybay, at iniwasan ang “kaluluwa” sapagkat buhay ng salmista ang malinaw na nakataya.
