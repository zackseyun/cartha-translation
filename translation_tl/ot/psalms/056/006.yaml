base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: tl
  text: Nagsasama-sama sila; nagkukubli sila; minamatyagan nila ang mga hakbang ko,[a] habang inaabangan nila ang buhay ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ang mga sakong ko”; maaari ring isaling “ang mga yapak ko” o “ang mga galaw ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “habang hinihintay nila ang buhay ko” o “habang tinatambangan nila ako.” Karaniwang nangangahulugan ang pandiwang Hebreo na “maghintay” o “umasa,” ngunit mapanlaban ang gamit dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: Nagsasama-sama sila
  rationale: Sa mapanlabang konteksto, tumutukoy ito sa kanilang pagbubuklod laban sa salmista; pinananatili ng salin ang larawan nang hindi tahasang nagdaragdag ng marahas na pagkilos.
- source_word: יצפינו
  choice: nagkukubli sila
  rationale: Ipinahihiwatig ng Hiphil sa konteksto ang pagkukubli, marahil upang manambang; natural at malinaw sa modernong Tagalog ang “nagkukubli.”
- source_word: הֵמָּה
  choice: sila
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa gumagawa; sapat itong naipahahayag sa inuulit na “sila” sa mga sugnay.
- source_word: עֲקֵבַי
  choice: ang mga hakbang ko
  rationale: Literal itong “ang mga sakong ko,” ngunit idyomatikong tumutukoy sa mga yapak, hakbang, o galaw na sinusundan.
- source_word: יִשְׁמֹרוּ
  choice: minamatyagan nila
  rationale: Dito ang שמר ay mapanlabang pagbabantay o pagsubaybay, hindi pag-iingat para sa kapakanan ng isang tao.
- source_word: כַּאֲשֶׁר
  choice: habang
  rationale: Ang anyong Hebreo ay maaaring ihayag na “gaya ng” o “habang.” Sa Tagalog, ang “habang” ay natural na nag-uugnay sa pagmamatyag at mapanlabang paghihintay nang hindi ginagawang tahasang sanhi o layunin ang ugnayan.
- source_word: קִוּוּ
  choice: hinihintay nilang makuha
  rationale: Pinananatili ang pangunahing diwa ng paghihintay o pag-asam, habang ipinakikitang ang “buhay” ng salmista ang mapanlabang pakay. Ang “makuha” ay nililinaw ang di-likas na pariralang “hintayin ang buhay” sa Tagalog nang hindi tahasang isinasalin bilang “patayin.”
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa kontekstong ito, ang נפש ay ang buhay o mismong sarili ng salmista, hindi lamang “kaluluwa” sa makitid na diwa.
