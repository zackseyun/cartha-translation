  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֵּ/אלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥/וֹ בֵּ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: tl
  text: Sa Diyos ay pupurihin ko ang kanyang salita; sa Diyos ako nagtiwala; hindi ako matatakot. Ano ang magagawa[a] sa akin ng taong mortal[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Ano ang gagawin.” Ang tanong ay retorikal at nagpapahiwatig ng “Ano ang magagawa?”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “laman,” na tumutukoy rito sa mahina at may-kamatayang tao kung ihahambing sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: sa Diyos
  rationale: Pinananatili nito ang pagtuon sa Diyos bilang batayan at saklaw ng pagpupuri at pagtitiwala, at likas itong inuulit sa magkatulad na mga sugnay.
- source_word: אֲהַלֵּל
  choice: pupurihin ko
  rationale: 'Ang anyong imperpektibo ay angkop na nagpapahayag dito ng matatag na pasiya: “pupurihin ko.”'
- source_word: דְּבָרוֹ
  choice: ang kanyang salita
  rationale: Pinananatili ng “salita” ang lawak ng דָּבָר at hindi ito nililimitahan agad sa “pangako.”
- source_word: בָּטַחְתִּי
  choice: ako nagtiwala
  rationale: Ipinahahayag ng naganap na aspekto ang pagtitiwalang naitatag na at siyang pinagmumulan ng kasalukuyang katapangan.
- source_word: לֹא אִירָא
  choice: hindi ako matatakot
  rationale: Naipapakita nito kapuwa ang pagtangging matakot at ang matatag na pagtitiwala tungkol sa hinaharap.
- source_word: מַה יַּעֲשֶׂה
  choice: Ano ang magagawa
  rationale: Ang literal na anyo ay tumutukoy sa gagawin sa hinaharap, ngunit bilang retorikal na tanong ay ipinahahayag nito ang limitadong kakayahan ng tao.
- source_word: בָשָׂר
  choice: taong mortal
  rationale: Sa konteksto, ang literal na “laman” ay metonimiya para sa mahina at may-kamatayang tao. Ang “taong mortal” ay malinaw sa makabagong Tagalog habang pinananatili ang paghahambing sa Diyos; itinatala sa talababa ang literal na larawan.
- source_word: לִי
  choice: sa akin
  rationale: Ito ang tuwiran at likas na katumbas sa Tagalog kasunod ng “magagawa.”
theological_decisions:
- issue: Ang בָשָׂר bilang katawagan sa sangkatauhang inihahambing sa Diyos
  choice: taong mortal
  alternative: laman
  rationale: Ipinakikita ng konteksto ang kahinaan at pagiging may-kamatayan ng tao sa harap ng Diyos. Ang literal na “laman” ay maaaring unang maunawaan sa Tagalog bilang laman ng katawan o pagkain, kaya ginamit sa teksto ang malinaw na diwa at pinanatili sa talababa ang Hebreong larawan.
- issue: Ang retorikal na puwersa ng מַה יַּעֲשֶׂה
  choice: Ano ang magagawa
  alternative: Ano ang gagawin
  rationale: Hindi hinuhulaan ng tanong kung ano ang gagawin ng tao; ipinahahayag nito na limitado ang magagawa ng mortal laban sa taong nagtitiwala sa Diyos. Gayunman, itinatala sa talababa ang literal na anyong panghinaharap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang pag-uulit ng “sa Diyos” at ang magkakaugnay na mga tuldok-kuwit ay nagpapanatili sa paralelismo at pagtindi ng Hebreong tula.
