  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: tl
  text: Sapagkat iniligtas mo ang buhay ko sa kamatayan[a]; hindi ba’t iniligtas mo rin ang mga paa ko sa pagkatisod[b], upang makalakad ako sa harap ng Diyos, sa liwanag ng buhay?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kaluluwa ko” o “ako mismo.” Ang Hebreong nefesh ay maaaring tumukoy sa buhay, kaluluwa, o sa buong sarili.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pagkadapa” o “sa pagbagsak.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa liwanag ng mga buháy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagbibigay-dahilan sa naunang pahayag, at natural ito sa marangal na himig ng salmo.
- source_word: הִצַּלְתָּ
  choice: iniligtas mo
  rationale: Ang Hiphil perfect ng נצל ay tumutukoy sa pagliligtas o pagpapalaya mula sa panganib; ipinahahayag dito ang naganap nang pagliligtas na mahalaga pa rin sa kasalukuyan.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa kontekstong kasunod ang “sa kamatayan,” ang נֶפֶשׁ ay likas na tumutukoy sa buhay o sa buong pagkatao. Mas malinaw sa modernong Tagalog ang “buhay ko” at hindi nito ipinipilit ang isang teknikal na paghahati ng katawan at kaluluwa.
- source_word: מִמָּוֶת
  choice: sa kamatayan
  rationale: Tuwirang ipinahahayag ang pagliligtas mula sa banta o kapangyarihan ng kamatayan.
- source_word: הֲלֹא
  choice: hindi ba’t … rin
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot at ang paralelismo sa unang sugnay.
- source_word: רַגְלַי
  choice: ang mga paa ko
  rationale: Pinananatili ang kongkretong larawang Hebreo at inihahanda ang larawang “makalakad” sa kasunod na sugnay.
- source_word: מִדֶּחִי
  choice: sa pagkatisod
  rationale: Ipinahihiwatig ng דֶּחִי ang pagkabuwal, pagkadapa, o pagkatisod. Ang “pagkatisod” ay natural kasama ng “mga paa” at ng kasunod na paglakad.
- source_word: לְהִתְהַלֵּךְ
  choice: upang makalakad ako
  rationale: Nililinaw ang layunin o bunga na ipinahahayag ng infinitive na may לְ.
- source_word: לִפְנֵי אֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Malapit sa literal na “sa harap/presensiya ng Diyos” at natural sa kasalukuyang Tagalog.
- source_word: בְּאוֹר הַחַיִּים
  choice: sa liwanag ng buhay
  rationale: Pinananatili ang sadyang matulaing larawan at ang genitive na “ng buhay,” nang hindi nilulutas ang lawak ng kahulugan nito.
theological_decisions:
- issue: Saklaw ng kahulugan ng נַפְשִׁי
  choice: ang buhay ko
  alternative: ang kaluluwa ko; ako mismo
  rationale: Hindi hinihingi ng talata ang isang teknikal na antropolohiya. Sa pariralang “mula sa kamatayan,” ang “buhay ko” ang natural na salin, habang itinatala sa talababa ang mas literal at mas malawak na mga posibilidad.
- issue: Larawan ng בְּאוֹר הַחַיִּים
  choice: sa liwanag ng buhay
  alternative: sa liwanag ng mga buháy
  rationale: Ang teksto ay tuwirang may “liwanag ng buhay,” ngunit maaari ring maunawaan kaugnay ng kalagayan o daigdig ng mga nabubuhay. Pinananatili sa pangunahing teksto ang anyong Hebreo at ibinibigay ang alternatibo sa talababa.
- issue: Nawawalang pandiwa sa ikalawang sugnay
  choice: inulit ang “iniligtas mo” para sa malinaw na Tagalog
  alternative: 'panatilihin ang elipsis: “hindi ba’t pati ang mga paa ko sa pagkatisod?”'
  rationale: Walang hayag na pandiwa sa Hebreo sa ikalawang sugnay; nauunawaan ito mula sa unang sugnay. Kinakailangan ang pag-uulit sa natural at malinaw na Tagalog, nang hindi binabago ang diwa ng retorikal na tanong.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paralelismong patula, ang retorikal na tanong, at ang mga larawang “mga paa,” “paglakad,” at “liwanag.” Ginamit ang “hindi ba’t” bilang likas na anyo ng inaasahang positibong sagot.
