  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: tl
  text: Sa Diyos ako nagtiwala; hindi ako matatakot. Ano ang magagawa sa akin ng tao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ano ang magagawa sa akin ng isang tao?” Ang salitang Hebreo ay singular at ginagamit dito bilang kinatawan ng sinumang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Sa Diyos
  rationale: Ang בְּ sa pormulang ito ng pagtitiwala ay tumutukoy sa Diyos bilang pinaglalagakan ng tiwala; natural itong ipinapahayag sa Tagalog na “Sa Diyos.”
- source_word: בָּטַחְתִּי
  choice: ako nagtiwala
  rationale: Ang Qal perfect na unang panauhang isahan ay nagpapahayag ng naitatag o tiyak na pagtitiwala. Pinananatili ng “nagtiwala” ang aspektong ito nang natural sa Tagalog.
- source_word: לֹא אִירָא
  choice: hindi ako matatakot
  rationale: Ang imperfect pagkatapos ng לֹא ay angkop na nagpapahayag ng matatag na pasiya o pagtitiwala hinggil sa hinaharap.
- source_word: מַה יַּעֲשֶׂה
  choice: Ano ang magagawa
  rationale: Bagaman literal na “ano ang gagawin,” ang tanong ay retorikal at likas na ipinahahayag sa Tagalog sa pamamagitan ng “Ano ang magagawa.”
- source_word: אָדָם
  choice: tao
  rationale: Ang singular na אָדָם ay ginagamit dito bilang kinatawan ng sinumang tao, sa paghahambing sa Diyos. Ang “tao” ay likas, dignified, at nagpapanatili sa singular at pangkalahatang diwa.
- source_word: לִי
  choice: sa akin
  rationale: Direktang katumbas ito ng pang-ukol at hulaping unang panauhan; kasama ng “magagawa,” natural ang pariralang “magagawa sa akin.”
theological_decisions:
- issue: Pagpapakahulugan sa singular na אָדָם bilang kinatawan ng sangkatauhan
  choice: tao
  alternative: isang tao; mortal
  rationale: Pinananatili ng “tao” ang singular na anyo at ang retorikal na paghaharap ng Diyos at ng sinumang taong maaaring manakit, nang hindi nililimitahan ang salita sa lalaking kasarian o dinaragdagan ng tahasang ideya ng mortalidad.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “nagtiwala” upang katawanin ang Hebrew perfect at “matatakot” upang ihayag ang tiyak na pasiyang bunga ng pagtitiwala. Inilagay ang panandang [a] kaagad pagkatapos ng “tao,” ang salitang tinutukoy ng talababa.
