  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: tl
  text: Nakaatang sa akin ang mga panata mo[a], O Diyos; ibibigay ko sa iyo ang mga handog ng pasasalamat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas idyomatiko: “ang mga panata ko sa iyo.” Literal sa Hebreo: “ang mga panata mo,” na maaaring tumukoy sa mga panatang dapat tuparin sa Diyos.'
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga pasasalamat”; ang salitang Hebreo ay maaaring tumukoy sa mga pagpapahayag ng pasasalamat o sa mga handog ng pasasalamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: nakaatang sa akin
  rationale: Pinananatili nito ang larawang may bagay na nakapatong o obligasyong nakaatang sa nagsasalita, habang natural pa rin sa makabagong Tagalog.
- source_word: נְדָרֶיךָ
  choice: ang mga panata mo
  rationale: Tuwirang sinasalamin ang hulaping ikalawang panauhan sa Hebreo. Malamang na tumutukoy ito sa mga panatang dapat tuparin sa Diyos, ngunit hindi tahasang nilulutas sa pangunahing teksto bilang ‘mga panata ko sa iyo.’
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ang salita ay tuwirang pantawag dito; malinaw at marangal itong ipinahahayag ng ‘O Diyos.’
- source_word: אֲשַׁלֵּם
  choice: ihahandog ko
  rationale: Sa konteksto ng תּוֹדוֹת, natural nitong ipinapahayag ang pagbibigay sa Diyos ng nararapat na handog, bagaman ang pandiwang Hebreo ay may diwa rin ng pagbabayad o pagtupad sa obligasyon.
- source_word: תּוֹדוֹת
  choice: mga handog ng pasasalamat
  rationale: Maaaring tumukoy ang pangngalan sa mga pagpapahayag ng pasasalamat o sa mga handog ng pasasalamat. Dahil kaagapay ito ng mga panata at ng pandiwang may diwang pagtupad o pagbabayad, malamang ang pansakripisyong kahulugan.
- source_word: לָךְ
  choice: sa iyo
  rationale: Tuwirang ipinakikita ang Diyos bilang tumatanggap ng mga handog.
theological_decisions:
- issue: Kahulugan ng literal na ‘mga panata mo’ kaugnay ng Diyos
  choice: Pinanatili sa pangunahing teksto ang ‘mga panata mo.’
  alternative: ‘ang mga panata ko sa iyo’
  rationale: Ang anyong Hebreo ay literal na may hulaping ‘mo.’ Malamang na ang kahulugan ay mga panatang inutang o dapat tuparin sa Diyos, ngunit pinananatili ng salin ang tunay na anyo at tensiyon ng teksto sa halip na tahimik itong gawing mas tiyak.
- issue: Saklaw ng kahulugan ng תּוֹדוֹת
  choice: mga handog ng pasasalamat
  alternative: mga pasasalamat
  rationale: Iminumungkahi ng konteksto ng mga panata at pagtupad ng obligasyon ang pansakripisyong kahulugan, ngunit kinikilala sa talababa ang mas malawak na leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang ‘nakaatang’ ay nagpapanatili sa larawang Hebreo at sa diwa ng obligasyon; ang ‘ihahandog’ ay natural sa konteksto ng pagsamba nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
