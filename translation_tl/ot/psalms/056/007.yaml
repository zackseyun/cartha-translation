  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: tl
  text: Dahil sa kanilang kasamaan, huwag mo silang hayaang makatakas[a]; sa galit ay ibagsak mo ang mga bayan[b], O Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dahil sa kasamaan, huwag mo silang iligtas.” Mahirap unawain ang Hebreong sugnay; ang pandiwa ay maaari ring isalin nang mas tuwiran bilang “iligtas” o “sagipin.”
    reason: alternative_reading
  - marker: b
    text: O, “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: Dahil sa kanilang kasamaan
  rationale: Ang עַל ay nagpapahayag ng dahilan, at ang אָוֶן ay tumutukoy sa masamang gawa o kasamaan. Idinagdag ang “kanilang” upang maging likas sa Tagalog ang kaugnayan nito sa mga kalabang tinutukoy, bagaman hindi ito tahasang nakasulat sa Hebreo.
- source_word: פַּלֶּט לָמוֹ
  choice: huwag mo silang hayaang makatakas
  rationale: 'Karaniwang kaugnay ng pagtakas o pagliligtas ang פלט. Sa konteksto ng panalanging humihingi ng paghatol, malamang na negatibong pakiusap ang maikli at mahirap na sugnay: huwag pahintulutang makatakas ang mga masama. Inilalahad sa talababa ang mas tuwirang alternatibong “huwag mo silang iligtas.”'
- source_word: בְּאַף
  choice: sa galit
  rationale: Ang אַף ay idyomatikong tumutukoy sa galit. Hindi idinagdag ang “mo” dahil hindi ito tahasang nasa Hebreo, bagaman Diyos ang kinakausap.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Ang עַמִּים ay maramihang “mga bayan” o “mga bansa.” Pinili ang “mga bayan” upang mapanatili ang kolektibong diwa at hindi agad itumbas sa makabagong estadong bansa.
- source_word: הוֹרֵד
  choice: ibagsak mo
  rationale: Ang causative imperative ng ירד ay literal na “pababain” at sa konteksto ay nangangahulugang ibaba, hiyain, o gapiin. Ang “ibagsak” ay natural at nagpapanatili sa larawan ng pagbaba.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos; ang “O Diyos” ay marangal at malinaw na bokatibo sa Tagalog.
theological_decisions:
- issue: Panalangin para sa paghatol at ang ipinahiwatig na pagtanggi sa mahirap na unang sugnay
  choice: Isinalin bilang pakiusap na huwag hayaang makatakas ang masasama dahil sa kanilang kasamaan.
  alternative: “Dahil sa kasamaan, huwag mo silang iligtas”; maaari ring unawain ng ilan na isang pahayag tungkol sa pagtakas nila ang sugnay.
  rationale: Masalimuot at siksik ang Hebreong עַל אָוֶן פַּלֶּט לָמוֹ. Ang negatibong pakiusap ay hindi tahasang minarkahan ngunit malakas na ipinahihiwatig ng konteksto at kaagapay na panawagang ibagsak ng Diyos ang mga bayan. Hindi itinago ang ibang posibleng pagbasa; inilagay ito sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at angkop sa panulaan at panalangin. Ginamit ang “kasamaan,” “ibagsak,” at “mga bayan” bilang malinaw ngunit hindi kolokyal na mga salita. Napanatili ang tindi ng panalanging humihingi ng paghatol nang hindi dinaragdagan ang teksto ng denominasyonal na paliwanag.
