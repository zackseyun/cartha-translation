  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: tl
  text: Binilang mo ang aking mga paglalagalag; ilagay mo ang mga luha ko sa iyong sisidlang yari sa balat[a]—hindi ba nasa iyong aklat ang mga iyon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isang sisidlang gawa sa balat ng hayop, karaniwang ginagamit noon para sa alak o ibang likido. Magkatunog sa Hebreo ang salitang ito at ang salitang isinaling “mga paglalagalag.”
    reason: Nililinaw ang sinaunang bagay na tinutukoy ng נֹאד at ang di-ganap na maisasaling paglalaro sa magkatunog na mga salita.
lexical_decisions:
- source_word: נֹדִי
  choice: aking mga paglalagalag
  rationale: Ang נוּד ay tumutukoy sa pagala-gala o sapilitang pagpapalipat-lipat. Pinananatili ng “mga paglalagalag” ang konkretong larawan ng kalagayan ng salmista nang hindi ito nilalabnaw bilang pangkalahatang “paghihirap.”
- source_word: סָפַרְתָּה
  choice: binilang mo
  rationale: Pangunahing kahulugan ng ספר ang pagbilang o pagbibilang. Ang “binilang mo” ay natural sa Filipino at nagpapahiwatig na maingat na napapansin ng Diyos ang bawat paglalagalag.
- source_word: שִׂימָה
  choice: ilagay mo
  rationale: Tuwirang salin ng pautos na anyo ng שׂים at angkop sa panalanging pakiusap ng salmista.
- source_word: דִמְעָתִי
  choice: ang mga luha ko
  rationale: Ang maramihang pagpapahayag ay likas sa Filipino at malinaw na naghahatid ng kolektibong diwa ng Hebreong pangngalan.
- source_word: בְנֹאדֶךָ
  choice: sa iyong sisidlang yari sa balat
  rationale: Ang נֹאד ay isang sisidlang gawa sa balat ng hayop, karaniwang ginagamit para sa alak o ibang likido. Mas tiyak ito kaysa sa makabagong “bote” at nananatiling mauunawaan sa tulong ng talababa.
- source_word: הֲלֹא
  choice: hindi ba
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap, sa halip na gawin itong tahasang pahayag.
- source_word: בְסִפְרָתֶךָ
  choice: nasa iyong aklat
  rationale: Ang סִפְרָה rito ay tumutukoy sa aklat o nakasulat na talaan. Ang “aklat” ay natural at pinananatili ang konkretong larawan sa Hebreo.
theological_decisions:
- issue: Ang makataong paglalarawan sa Diyos na nag-iingat ng mga luha at may aklat
  choice: Panatilihin ang mga konkretong larawan ng sisidlan at aklat
  alternative: Ipaliwanag lamang bilang “inaalala mo ang lahat ng paghihirap ko”
  rationale: Ipinakikita ng mismong tula ang masusing malasakit ng Diyos sa pamamagitan ng matitingkad na larawan. Hindi dapat palitan ng salin ang mga ito ng abstraktong paliwanag.
- issue: Ang retorikal na tanong tungkol sa aklat ng Diyos
  choice: 'Panatilihin bilang tanong: “hindi ba nasa iyong aklat ang mga iyon?”'
  alternative: 'Gawing tuwirang katiyakan: “tiyak na nakatala ang mga iyon sa iyong aklat”'
  rationale: Inaasahan man ng הֲלֹא ang pagsang-ayon, mahalagang panatilihin ang anyong patanong at ang bahagyang tensiyon ng orihinal.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang tuwirang pakikipag-usap sa Diyos, ang pautos na pakiusap, ang konkretong imahen, at ang retorikal na tanong. Ginamit ang “sisidlang yari sa balat” sa halip na “bote” upang maiwasan ang makabagong larawang salamin o plastik.
