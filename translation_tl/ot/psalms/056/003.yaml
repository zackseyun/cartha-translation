  text: When I am afraid[a], I will trust in you.
translation:
  language: tl
  text: 'Kapag natatakot ako,[a]

    sa iyo ako magtitiwala.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Sa araw na ako''y matakot, ako—sa iyo magtitiwala.”'
    reason: Ipinapakita ang literal na temporal na parirala at ang diin ng hiwalay na panghalip na אֲנִי.
lexical_decisions:
- source_word: י֥וֹם
  choice: Kapag
  rationale: Bagaman literal na “araw,” ginagamit dito ang יוֹם upang ipakilala ang isang sugnay na panahunan. Likas na ipinahahayag ito sa modernong Tagalog sa pamamagitan ng “kapag.”
- source_word: אִירָ֑א
  choice: natatakot ako
  rationale: Ang Qal imperfect na unang panauhang isahan ng ירא ay tumutukoy rito sa pagkaranas ng takot, hindi sa mapitagang pagkatakot. Ang “natatakot ako” ay natural at malinaw sa Tagalog.
- source_word: אֲנִ֗י
  choice: ako
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa nagsasalita. Pinananatili ang diin sa ayos na “sa iyo ako magtitiwala,” nang hindi pinalalabis bilang “ako mismo.”
- source_word: אֵלֶ֥י/ךָ
  choice: sa iyo
  rationale: Sa pagkakaugnay nito sa בטח, ang אֶל ay nagpapahayag ng pagtutuon ng tiwala sa isang tao. Ang “sa iyo” ang likas na katumbas sa Tagalog.
- source_word: אֶבְטָֽח
  choice: magtitiwala
  rationale: 'Ang imperfect ng בטח ay nagpapahayag dito ng pasiya o tugon ng nagsasalita: “magtitiwala.” Ang anyong ito ay angkop sa sugnay na sinimulan ng “kapag.”'
theological_decisions:
- issue: Ugnayan ng takot at pagtitiwala
  choice: Inilalahad ng talata na sa gitna ng takot ay sadyang nagtitiwala ang nagsasalita sa Diyos.
  alternative: Maaaring ipakahulugan na lubusang pinapalitan o inaalis ng pagtitiwala ang takot.
  rationale: Magkatabing pinananatili ng Hebreo ang karanasan ng takot at ang pasiyang magtiwala. Hindi sinasabi ng teksto na walang takot ang nagsasalita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ang paghahati sa dalawang linya at ang ayos na “sa iyo ako” ay nagpapanatili ng diin sa Diyos bilang pinagtutuunan ng tiwala.
