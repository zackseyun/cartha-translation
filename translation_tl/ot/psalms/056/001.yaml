  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: tl
  text: 'Magpakita ka ng lingap sa akin, O Diyos,


    sapagkat may isang taong sabik na tumugis sa akin;[a]


    buong araw, habang nakikipaglaban, ginigipit niya ako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yumuyurak sa akin,” “sumasalakay sa akin,” o “ibig akong lamunin.” Ang pandiwang Hebreo ay naglalarawan ng mapoot na paghingal o masidhing pagtugis.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Mahabag ka sa akin
  rationale: Ang Piel imperative ng חנן na may hulaping unang panauhan ay pakiusap para sa lingap o kagandahang-loob ng Diyos. Likas at marangal sa panalanging Filipino ang “Mahabag ka sa akin,” bagaman hindi kailangang magpahiwatig dito ng pagsisising penitensiyal.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; pinananatili ng “O Diyos” ang puwersang bokatibo at ang marangal na himig ng panalangin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap at angkop sa dignidad ng salmong patula.
- source_word: שְׁאָפַנִי
  choice: sabik na tumugis sa akin
  rationale: Ang שׁאף ay naglalarawan ng paghingal o pagsinghot at, sa talinghagang gamit, ng masidhi at mapoot na paghahabol. Isinasalin ng “sabik na tumugis” ang masidhing paghabol nang hindi pinipili nang tahasan ang ibang posibleng diwa na “yurakan” o “lamunin.”
- source_word: אֱנוֹשׁ
  choice: may taong
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa mortal at marupok na tao. Ang pang-isahang “may taong” ay natural sa Filipino at hindi ginagawang sangkatauhan sa pangkalahatan ang partikular na kalaban.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Karaniwan at malinaw na salin ng pariralang temporal.
- source_word: לֹחֵם
  choice: nilalabanan niya ako
  rationale: Ang Qal participle ng לחם ay nagpapakita ng nagpapatuloy na pakikipaglaban. Sa Filipino, ang pandiwang sugnay ay mas natural kaysa literal na participial construction.
- source_word: יִלְחָצֵנִי
  choice: ginigipit
  rationale: Ang לחץ ay nangangahulugang idiin, gipitin, o apihin. Ang “ginigipit” ay malinaw na nagpapahayag ng patuloy na mapanupil na presyon at kasuwato ng pang-isahang gumagawa.
theological_decisions:
- issue: Paglalarawan sa אֱנוֹשׁ bilang pang-isahang kalabang tao
  choice: may taong
  alternative: isang mortal; sangkatauhan
  rationale: Pinananatili ang pang-isahang taong kalaban at ang kaibahan niya sa Diyos, nang hindi ginagawang pangkalahatang pahayag tungkol sa buong sangkatauhan. Hindi kinakailangang markahan ang kasarian sa Filipino dahil walang gramatikal na kasarian ang “tao.”
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Gumamit ng maiikling linyang patula at natural na pandiwang Filipino. Ang tandang [a] ay inilagay kaagad pagkatapos ng pariralang may leksikal na kalabuan.
