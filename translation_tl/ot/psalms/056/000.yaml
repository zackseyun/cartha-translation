  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: ayon sa “Ang Tahimik na Kalapati ng Malalayong Lugar.”[a] Ukol kay David. Isang miktam[b], nang dakpin siya ng mga Filisteo sa Gat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maaaring unawain bilang “Ang Kalapati ng Malayong Katahimikan.” Malabo ang parirala at malamang na pamagat ng isang himig; hindi tiyak ang eksaktong kahulugan nito.
    reason: alternative_reading
  - marker: b
    text: Ang miktam ay isang teknikal na katawagan sa mga pamagat ng Awit; hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ipinahihiwatig ng karaniwang pormula sa mga pamagat ng Awit ang taong nangangasiwa sa pagtatanghal ng musika. Malinaw at likas ito sa makabagong Filipino nang hindi nililimitahan sa isang tiyak na uri ng pangkat.
- source_word: עַל
  choice: ayon sa
  rationale: Sa mga pamagat ng Awit, maaari nitong ipakilala ang himig o musikal na pamagat na gagamitin.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: “Ang Tahimik na Kalapati ng Malalayong Lugar”
  rationale: Malabo ang parirala at malamang na pamagat ng isang himig. Pinanatili itong nakapanipi; ang “tahimik” ay nagpapakita ng diwa ng אֵלֶם at ang “malalayong lugar” ng רְחֹקִים, ngunit kinikilala sa talababa ang kawalang-katiyakan.
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Pinananatili nito ang lawak ng kaugnayang ipinahihiwatig ng le-David nang hindi tiyak na iginigiit kung ito ay isinulat ni David, para sa kaniya, o kaugnay niya.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Teknikal na katawagan ito sa mga pamagat ng Awit na hindi tiyak ang kahulugan, kaya mas ligtas ang transliterasyon kaysa haka-hakang salin.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: nang dakpin siya
  rationale: Ang infinitibong may בְּ ay nagsasaad ng pagkakataon, at ang “dakpin” ay likas na Filipino para sa marahas na paghawak o pagbihag sa kontekstong ito.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagang Filipino para sa pangkat-etnikong ito.
- source_word: בְּגַת
  choice: sa Gat
  rationale: Likas na locative na anyo sa Filipino para sa pangalang-lugar.
theological_decisions:
- issue: Kalikasan ng pamagat ng Awit
  choice: Isinalin ang pamagat bilang bahagi ng tekstong kanonikal at pinanatili ang mga pahiwatig na musikal at pangkasaysayan.
  alternative: Ituring itong editoryal na metadata lamang, o bigyan ang מִכְתָּם ng tiyak ngunit haka-hakang kahulugan.
  rationale: Bahagi ng tekstong Hebreo ang superskripsiyon. Ang transliterasyon at talababa ay umiiwas sa paglalagay ng doktrinal o pangkasaysayang katiyakan na wala sa pinagmulan.
- issue: Kaugnayan ni David sa Awit
  choice: “Ukol kay David”
  alternative: “Ni David” o “Para kay David”
  rationale: Maaaring magpahiwatig ang לְ ng pag-akda, pag-aalay, pag-uugnay, o ibang relasyon. Hindi tahasang nilulutas ng salin ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tagapangasiwa ng awitan” bilang malinaw na katawagang pangmusika; pinanatili ang “miktam” at ang nakapaniping pamagat upang hindi gawing tiyak ang mga salitang malabo sa Hebreo.
