  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: tl
  text: Natatakot ang mga naninirahan sa pinakamalayong mga dako dahil sa mga tanda mo[a]; pinahihiyaw mo sa galak ang bukang-liwayway at takipsilim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namamangha nang may pagpipitagan dahil sa mga tanda mo.” Ang pandiwang Hebreo ay maaaring magpahayag ng takot, pangamba, o mapitagang paghanga.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang mga paglabas ng umaga at gabi.” Makata itong tumutukoy sa paglitaw ng bukang-liwayway at takipsilim, o sa mga lugar o panahong pinagmumulan ng umaga at gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: Natatakot
  rationale: Ang ירא ay maaaring tumukoy sa takot, pangamba, o mapitagang paghanga. Pinananatili ng “natatakot” ang malawak na diwa nang hindi ito nililimitahan sa sindak lamang o sa pagpipitagan lamang.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: ang mga naninirahan sa pinakamalayong mga dako
  rationale: Ang parirala ay literal na tumutukoy sa mga naninirahan sa mga dulo o kadulu-duluhan at idyomatikong nangangahulugang mga tao sa pinakamalalayong rehiyon.
- source_word: מֵאוֹתֹתֶיךָ
  choice: dahil sa mga tanda mo
  rationale: Pagkatapos ng pandiwang tumutukoy sa pagkatakot, ang מִן ay maaaring magpahayag ng sanhi. Tuwirang ipinahahayag ng “dahil sa” na ang mga tanda ng Diyos ang dahilan ng tugon.
- source_word: אוֹתֹתֶיךָ
  choice: mga tanda mo
  rationale: Ang אוֹת ay pangunahing nangangahulugang “tanda” at maaaring tumukoy sa mga gawang naghahayag ng kapangyarihan ng Diyos. Hindi ito pinalitan ng mas interpretatibong “mga kababalaghan.”
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: ang pagsikat ng umaga at ang pagdating ng gabi
  rationale: Ang מוֹצָאֵי ay literal na “mga paglabas.” Ang salin ay nagpapanatili sa makatang larawan ng paglitaw ng umaga at gabi sa natural na modernong Tagalog.
- source_word: תַּרְנִין
  choice: pinapawit mo sa galak
  rationale: Ang anyong Hiphil ng רנן ay nangangahulugang sanhiing humiyaw o umawit sa galak. Ipinahahayag ng “pinapawit mo sa galak” ang causative na diwa at ang personipikasyon ng umaga at gabi.
theological_decisions:
- issue: Ang uri ng tugon sa mga tanda ng Diyos
  choice: “Natatakot” nang hindi tinutukoy kung ito ay sindak o mapitagang paghanga
  alternative: “Namamangha nang may pagpipitagan” o “nangingilabot”
  rationale: Saklaw ng Hebreong ירא ang takot, pangamba, at mapitagang paghanga. Pinananatili ng salin ang sadyang tensiyon at hindi ipinapataw ang isang mas makitid na teolohikal na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pinapawit” upang mapanatili ang masiglang personipikasyon at causative na anyo ng Hebreo; iniwasan ang labis na arkaikong pananalita.
