  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: tl
  text: 'Ang mga pastulan sa ilang ay saganang tumutulo[a],

    at nagbibigkis ng galak sa kanilang sarili[b] ang mga burol.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaapaw.” Ang pandiwang Hebreo ay maaaring maglarawan ng saganang tubig na pumapatak, dumadaloy, o bumubuhos.
    reason: lexical_alternative
  - marker: b
    text: O “nagsusuot ng galak ang mga burol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: tumutulo sa kasaganaan
  rationale: Pinananatili ang matingkad na larawan ng pagtulo o pagpatak, habang ipinahihiwatig ng “sa kasaganaan” na sagana ang tubig at hindi kakaunti lamang ang patak.
- source_word: נְאוֹת
  choice: mga pastulan
  rationale: Tumutukoy rito sa mga pook na pinanginginainan ng mga hayop; akma ito sa larawang nagiging luntian kahit ang ilang.
- source_word: מִדְבָּר
  choice: ilang
  rationale: Ang “ilang” ay likas at malawak na katumbas ng di-sinasakang lupain o kaparangan, nang hindi ipinapalagay na mabuhanging disyerto ito.
- source_word: גִיל
  choice: galak
  rationale: Maikli at marangal na salitang nagpapahayag ng masidhing tuwa at angkop sa personipikasyon ng mga burol.
- source_word: גְּבָעוֹת
  choice: mga burol
  rationale: Tuwirang katumbas na nagpapanatili sa larawang pangkalupaan ng tula.
- source_word: תַּחְגֹּרְנָה
  choice: nagbibigkis
  rationale: Pinananatili ang metapora ng pagbibigkis o pagsusuot sa baywang; sa tula, ang mga burol mismo ang inilalarawang nagbibigkis ng galak.
