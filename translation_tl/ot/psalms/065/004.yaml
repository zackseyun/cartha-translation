  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: tl
  text: Mapalad ang taong pinipili mo at inilalapit upang manirahan sa iyong mga patyo.[a] Masisiyahan kami sa kabutihan ng iyong bahay,[b] sa kabanalan ng iyong templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Napakamapalad ng taong pinipili mo at inilalapit, upang manirahan siya sa iyong mga patyo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “kabutihan” ay maaari ring isaling “mabubuting bagay” o “kasaganaan.” Ang “Masisiyahan kami” ay maaari ring unawaing “Masiyahan nawa kami.”
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad ang
  rationale: Naghahayag ito ng isang beatitud o mariing pagkilala sa mabuting kalagayang ipinagkaloob ng Diyos. Likas at marangal sa makabagong Tagalog ang “Mapalad ang,” at hindi nito nililimitahan ang diwa sa pansariling damdaming “masaya.”
- source_word: תִּבְחַר
  choice: pinipili mo
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagpili ng Diyos. Iniwasan ang terminong “hinirang” upang hindi magdagdag ng isang tiyak na sistemang teolohikal na higit sa sinasabi ng talata.
- source_word: וּתְקָרֵב
  choice: at inilalapit
  rationale: 'Ang Hiphil ay may sanhiang diwa: ang Diyos ang nagpapalapit sa tao. Malinaw itong naihahayag ng “inilalapit” sa natural na Tagalog.'
- source_word: יִשְׁכֹּן
  choice: upang manirahan
  rationale: Ang anyong imperfect ay maaaring unawaing bunga o layunin ng pagpili at pagpapalapit. Pinananatili ng “upang manirahan” ang ugnayang ito nang hindi ipinipilit ang isang mas makitid na pagbasa.
- source_word: חֲצֵרֶיךָ
  choice: iyong mga looban
  rationale: Tumutukoy ito sa mga court o bakuran ng santuwaryo. Ang “mga looban” ay kongkreto, madaling maunawaan, at angkop sa konteksto ng templo.
- source_word: נִשְׂבְּעָה
  choice: Masisiyahan kami
  rationale: Ang pandiwa ay literal na tumutukoy sa pagkabusog o ganap na kasiyahan. Ang anyong cohortative ay maaaring magpahayag ng hangarin o tiyak na pag-asam; ang “Masisiyahan kami” ay nagpapanatili ng tiwala sa hinaharap at natural sa Tagalog.
- source_word: בְּטוּב
  choice: sa kabutihan
  rationale: Maaaring tumukoy ang טוּב sa kabutihan, mabubuting bagay, o kasaganaan. Ang “kabutihan” ang pinakamalawak na katumbas at hindi labis na tumutukoy sa materyal na biyaya lamang.
- source_word: בֵּיתֶךָ
  choice: ng iyong bahay
  rationale: Sa paralelismo sa templo at mga looban, ang “bahay” ay tumutukoy sa bahay ng Diyos o santuwaryo. Pinananatili ang kongkretong larawang Hebreo.
- source_word: קְדֹשׁ
  choice: sa kabanalan
  rationale: Dito ang pangngalan ay tumutukoy sa banal na katangian o kabanalan na kaugnay ng templo. Pinananatili ng “kabanalan” ang nominal na anyo at paralelismo sa “kabutihan.”
- source_word: הֵיכָלֶךָ
  choice: ng iyong templo
  rationale: Bagaman maaari ring mangahulugang palasyo ang הֵיכָל, malinaw na templo ang tinutukoy sa konteksto ng pagsamba at sa paralelismo sa bahay at mga looban ng Diyos.
theological_decisions:
- issue: Ang pagpili ng Diyos at pagpapalapit sa pagsamba
  choice: 'Pinanatili ang tahasang pagkilos ng Diyos: siya ang pumipili at naglalapit sa tao.'
  alternative: Gumamit ng mas teknikal na pananalitang gaya ng “inihalal,” o limitahan ang pahayag sa rituwal na paghirang ng mga saserdote.
  rationale: Iniuukol ng Hebreo sa Diyos ang pagkukusa sa pagbibigay ng paglapit sa kanyang presensya, ngunit hindi nito tahasang nilulutas kung gaano kalawak o katiyak ang doktrinal na saklaw ng pagpiling iyon.
- issue: Kongkretong wika tungkol sa templo
  choice: Isinalin bilang “mga looban,” “bahay,” at “templo.”
  alternative: Gawing ganap na metaporikal ang mga ito bilang “presensya” o “tirahan” ng Diyos.
  rationale: Nakaugat ang talata sa aktuwal na pagsamba ng Israel. Ang kongkretong salin ang nagpapanatili sa orihinal na larawan at hindi inuunahan ang posibleng teolohikal na aplikasyon.
- issue: Diwa ng cohortative sa נִשְׂבְּעָה
  choice: “Masisiyahan kami,” bilang tiyak na pag-asam.
  alternative: “Masiyahan nawa kami,” bilang panalangin o hangarin.
  rationale: Maaaring magpahiwatig ang anyo ng hangarin o matibay na pagtitiwala. Ang konteksto ay angkop sa deklarasyon ng inaasahang kasiyahan, ngunit itinatala sa talababa ang posibleng volitibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog; pinanatili ang kongkretong bokabularyo ng pagsamba sa templo at iniwasan ang teknikal na wikang denominasyonal. Ang “taong” ay idinagdag bilang likas na Tagalog na pagpapahayag ng ipinahihiwatig na isahang tao sa Hebreo.
