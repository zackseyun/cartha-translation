  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: tl
  text: Dinadalaw mo ang lupa at dinidiligan ito; lubos mo itong pinayayaman. Ang ilog ng Diyos[a] ay punô ng tubig. Inihahanda mo ang kanilang butil[b], sapagkat ganito mo inihahanda ang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batis ng Diyos” o “daluyan ng Diyos.” Patula ang pananalitang Hebreo at maaaring magpahiwatig ng makalangit na pinagmumulan ng ulan at kasaganaan ng lupa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inilalaan mo ang kanilang butil” o “itinatatag mo ang kanilang butil.” Ang pandiwang Hebreo ay maaaring mangahulugang “ihanda,” “ilaan,” o “itatag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: Dinadalaw mo
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo na tumutukoy rito sa mapagpalang paglapit at pagkalinga ng Diyos sa lupa.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: at dinidiligan ito
  rationale: Malinaw at likas sa makabagong Filipino ang “dinidiligan” para sa pagbibigay ng tubig sa lupa sa kontekstong agrikultural.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: lubos mo itong pinayayaman
  rationale: Ipinahahayag ng “lubos” ang pagpapalakas na dala ng רַבַּת, at ng “pinayayaman” ang causative na diwa ng pandiwa.
- source_word: פֶּלֶג אֱלֹהִים
  choice: ang ilog ng Diyos
  rationale: Tuwirang pinananatili ang maringal at patulang construct phrase; ang posibleng mga kahulugang “batis” at “daluyan” ay inilagay sa talababa.
- source_word: מָלֵא מָיִם
  choice: ay punô ng tubig
  rationale: Likas at matingkad na katumbas ito ng payak na sugnay na Hebreo tungkol sa kasaganaan ng tubig.
- source_word: תָּכִין דְּגָנָם
  choice: Inihahanda mo ang kanilang butil
  rationale: Pinananatili ng “inihahanda” ang malawak na diwa ng Hiphil ng כון, at ng “kanilang” ang panlalaking maramihang hulapi na naiiba sa pambabaeng isahang “lupa.”
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: sapagkat ganito mo inihahanda ang lupa
  rationale: Inuulit ang “inihahanda” upang mapanatili ang leksikal na ugnayan ng dalawang anyo ng כון, samantalang nililinaw na ang pambabaeng isahang hulapi ay tumutukoy sa lupa.
theological_decisions:
- issue: Tinutukoy ng panlalaking maramihang hulapi sa דְּגָנָם
  choice: Pinanatili bilang “kanilang butil,” na malamang tumutukoy sa mga taong nakikinabang sa ani ng lupa.
  alternative: Isalin nang pangkalahatan bilang “ang butil na ani” nang walang hayag na pantukoy sa mga tao.
  rationale: Hindi katulad ng pambabaeng isahang anyo para sa “lupa” ang hulaping Hebreo. Ang pagpapanatili sa “kanilang” ay nag-iingat sa gramatikal na pagkakaiba at hindi ipinipilit nang higit sa teksto kung sino mismo ang tinutukoy.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang “dinadalaw” upang mapanatili ang larawang Hebreo, habang ang “dinidiligan” at “lubos na pinayayaman” ay madaling maunawaan sa karaniwang gamit. Pinanatili ang tunay na kalabuan ng “ilog ng Diyos” at ng “kanilang butil” sa teksto at mga talababa.
