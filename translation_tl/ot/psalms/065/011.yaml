  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: tl
  text: 'Pinuputungan mo ng iyong kabutihan ang taon,

    at ang iyong mga landas[a] ay tumitigis ng kasaganaan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bakas ng iyong pagdaan.” Maaaring inilalarawan ng Hebreo ang pagdaan ng Diyos na nag-iiwan ng kasaganaan at pagkamabunga.
    reason: lexical_alternative
  - marker: b
    text: Literal na “katabaan,” isang larawang Hebreo para sa matabang lupa, masaganang ani, at saganang panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Pinuputungan mo
  rationale: Pinananatili nito ang malinaw na talinghaga ng paglalagay ng putong o korona. Ang aspektong di-ganap ay natural sa Filipino para sa patuloy o karaniwang pagkilos ng Diyos sa konteksto ng awit.
- source_word: שְׁנַת
  choice: ang taon
  rationale: Ito ang tuwirang layon ng pandiwa sa pariralang konstruktong Hebreo at natural na tumutukoy sa taon ng pagpapala at ani.
- source_word: טוֹבָתֶךָ
  choice: ng iyong kabutihan
  rationale: Saklaw ng 'kabutihan' ang mapagkalingang kabutihan ng Diyos, habang ipinahihiwatig ng konteksto ang saganang biyaya at ani. Hindi ito nililimitahan agad sa materyal na kasaganaan lamang.
- source_word: וּמַעְגָּלֶיךָ
  choice: at ang mga landas mo
  rationale: Ang מַעְגָּל ay maaaring landas, bakas, o daang dinaraanan. Malinaw at marangal ang 'mga landas,' samantalang inilalagay sa talababa ang mas kongkretong larawang 'mga bakas ng iyong pagdaan.'
- source_word: יִרְעֲפוּן
  choice: ay tumutulo
  rationale: Pinananatili nito ang kongkretong larawang makata ng pagpatak o pagtulo, sa halip na gawing paliwanag lamang na 'umaapaw' o 'nagbibigay.'
- source_word: דָּשֶׁן
  choice: ng kasaganaan
  rationale: Literal itong 'katabaan' o 'kasaganaan ng taba,' isang larawang Hebreo para sa matabang lupa, masaganang ani, at saganang panustos. Ang 'kasaganaan' ang malinaw na pangunahing salin sa modernong Filipino.
theological_decisions:
- issue: Pagpapanatili sa larawan ng pagpapalang mula sa Diyos
  choice: Panatilihin ang mga talinghaga ng pagpuputong sa taon at pagtulo ng kasaganaan mula sa mga landas ng Diyos.
  alternative: Ipaliwanag nang tuwiran na saganang pinagpapala ng Diyos ang panahon ng ani.
  rationale: Iniuugnay ng talata sa kilos at kabutihan ng Diyos ang kasaganaan ng lupain. Ang pagpapanatili sa matitingkad na larawan ng Hebreo ay hindi nagpapaliit sa tula tungo sa isang denominasyonal o doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang paralelismo at matitingkad na larawang patula ng Hebreo; iniwasan ang teknikal, makaluma, o denominasyonal na pananalita.
