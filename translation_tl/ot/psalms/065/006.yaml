  text: מֵכִ֣ין הָרִ֣ים בְּ/כֹח֑/וֹ נֶ֝אְזָ֗ר בִּ/גְבוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/006.yaml
  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: tl
  text: na nagpapatatag sa mga bundok sa pamamagitan ng kanyang lakas[a], na nabibigkisan ng kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kanyang kapangyarihan … nabibigkisan ng lakas.”
    reason: Magkakalapit ang saklaw ng kahulugan ng כֹּחַ at גְּבוּרָה; kapwa maaaring isaling “lakas” o “kapangyarihan.”
lexical_decisions:
- source_word: מֵכִין
  choice: nagpapatatag
  rationale: Ang Hiphil participle ng כון ay nagpapahayag ng pagkilos na ginagawang matatag o pirmi ang isang bagay. Ang “nagpapatatag” ay likas sa modernong Filipino at hindi labis na nagpapahiwatig ng paglikha mula sa wala.
- source_word: הָרִים
  choice: sa mga bundok
  rationale: Tuwirang tumutukoy ang הָרִים sa mga bundok; ang “mga” ay natural na naghahatid ng maramihang anyo at pangkalahatang pagtukoy sa mga ito.
- source_word: בְּכֹחוֹ
  choice: sa pamamagitan ng kanyang lakas
  rationale: Maaaring mangahulugan ang כֹּחַ ng lakas o kapangyarihan. Ipinakikita ng “sa pamamagitan ng” ang instrumental na gamit ng בְּ, at pinananatili ng “lakas” ang kaibhan nito sa kasunod na גְּבוּרָה.
- source_word: נֶאְזָר
  choice: nabibigkisan
  rationale: Pinananatili nito ang metapora ng אזר—ang pagiging may bigkis o sinturon bilang larawan ng pagiging handa at nasasangkapan—sa halip na gawing abstraktong pahayag lamang.
- source_word: בִּגְבוּרָה
  choice: ng kapangyarihan
  rationale: Saklaw ng גְּבוּרָה ang makapangyarihang lakas. Ang “kapangyarihan” ay angkop sa metaporang “nabibigkisan” at umiiwas sa pag-uulit ng “lakas.”
theological_decisions:
- issue: Ugnayan ng dalawang participle
  choice: 'Panatilihing magkasunod na paglalarawan sa Diyos: “na nagpapatatag …, na nabibigkisan …”'
  alternative: 'Gawing ganap na pandiwa ang ikalawa: “na nagpapatatag … at nabibigkisan …”'
  rationale: Dalawang participle ang magkasunod sa Hebreo. Ang dalawang sugnay na may “na” ay nagpapanatili sa kanilang naglalarawang daloy nang hindi nagdaragdag ng mas tiyak na lohikal o temporal na relasyon.
- issue: Metapora ng banal na lakas
  choice: Panatilihin ang larawang “nabibigkisan ng kapangyarihan.”
  alternative: Ipaliwanag bilang “puspos ng kapangyarihan” o “nasasandatahan ng lakas.”
  rationale: Gumagamit ang teksto ng pisikal na metapora upang ilarawan ang kapangyarihan ng Diyos. Ang pagpapanatili nito ay nag-iingat sa ποιetikong diin at hindi nagpapataw ng abstraktong interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismong participial at ang metapora ng pagbibigkis. Ang panimulang “na” ay umaayon sa kaugnay na sugnay ng Hebreo at sa pagpapatuloy nito mula sa naunang konteksto.
