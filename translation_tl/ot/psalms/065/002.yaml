  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: tl
  text: 'Ikaw na nakikinig sa panalangin,

    sa iyo lalapit ang lahat ng tao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng laman,” isang patulang pananalita para sa lahat ng tao o sa buong sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: na nakikinig
  rationale: Ang Qal participle ay tumutukoy sa Diyos bilang siyang nakikinig o dumirinig. Ang sugnay na “na nakikinig” ay natural sa makabagong Tagalog at angkop sa tuwirang pagtawag sa Diyos.
- source_word: תְּפִלָּה
  choice: sa panalangin
  rationale: Ang pangngalang isahan ay ginagamit sa pangkalahatan o kolektibong diwa, kaya hindi nilagyan ng pantukoy na magpapahiwatig ng isang tiyak na panalangin.
- source_word: עָדֶיךָ
  choice: sa iyo
  rationale: Ipinahahayag ng parirala ang direksiyon ng paglapit patungo sa kinakausap; natural itong inilagay bago ang pandiwang “lalapit.”
- source_word: כָּל בָּשָׂר
  choice: ang lahat ng tao
  rationale: Literal itong “lahat ng laman,” isang Hebreong patulang idyoma para sa sangkatauhan sa kabuuan. Ang “lahat ng tao” ang malinaw at natural na katumbas sa Tagalog, habang iningatan sa talababa ang literal na larawan.
- source_word: יָבֹאוּ
  choice: lalapit
  rationale: Ang imperfect na maramihan ay nagpapahayag ng kilos na inaasahan o hinaharap. Sa konteksto ng pagpunta sa Diyos sa panalangin o pagsamba, mas natural ang “lalapit” kaysa sa payak na “darating.”
theological_decisions:
- issue: Saklaw ng כָּל בָּשָׂר
  choice: lahat ng tao
  alternative: lahat ng laman; buong sangkatauhan
  rationale: Malawak ang likas na saklaw ng parirala at tumutukoy sa sangkatauhan, hindi sa isang natatanging pangkat. Hindi ito pinaliit o nilagyan ng dagdag na paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang pagtawag sa Diyos at ang patulang ayos ng dalawang linya, ngunit isinalin ang Hebreong idyoma sa natural na Filipino.
