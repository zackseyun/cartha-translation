lexical_decisions:
- source_word: לָבְשׁוּ
  choice: Nabibihisan
  rationale: Pinananatili ang talinghaga ng pagsusuot o pagbibihis, habang likas sa Filipino ang anyong nagsasaad na natatakpan ang lupain.
- source_word: כָרִים
  choice: mga pastulan
  rationale: Sa paralelismo sa mga lambak at kaugnayan sa הַצֹּאן, tumutukoy ito sa lupaing pastulan o parang, hindi sa mga barakong tupa.
- source_word: הַצֹּאן
  choice: mga kawan
  rationale: Ang kolektibong pangngalan ay tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; ang “mga kawan” ay natural at hindi labis na nagpapakitid ng kahulugan.
- source_word: וַעֲמָקִים
  choice: at ... ang mga lambak
  rationale: Tuwirang katumbas na nagpapanatili sa tanawin at paralelismo ng tula.
- source_word: יַעַטְפוּ
  choice: nababalot
  rationale: Ipinapahayag ang larawan ng mga lambak na waring nagbabalot sa sarili, ngunit sa mas natural at maringal na anyong Filipino.
- source_word: בָר
  choice: butil
  rationale: Pangkalahatang katawagan sa aning butil; iniiwasang tukuyin bilang trigo lamang, na mas makitid kaysa sa Hebreo.
- source_word: יִתְרוֹעֲעוּ
  choice: humihiyaw sila sa galak
  rationale: Ipinahahayag ang masayang sigaw na hinihingi ng konteksto at ang masiglang personipikasyon ng lupain.
- source_word: אַף
  choice: oo
  rationale: Ginagawang malinaw ang mariing pagpapatuloy ng ikalawang sugnay, hindi lamang simpleng pagdaragdag.
- source_word: יָשִׁירוּ
  choice: umaawit sila
  rationale: Natural na salin ng pandiwang “umawit” at nagpapanatili sa kasukdulan ng paralelismo.
