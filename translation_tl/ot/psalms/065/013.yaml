  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: tl
  text: Ang mga pastulan ay nabibihisan ng mga kawan[a], at ang mga lambak ay ibinabalot sa sarili ang butil; sumisigaw sila sa galak, oo[b], umaawit sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga parang.” Sa kontekstong ito, ang salitang Hebreo ay maaaring tumukoy sa pastulan o parang.
    reason: lexical_alternative
