  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: tl
  text: 'Sa iyo, ang katahimikan ay papuri,

    O Diyos, sa Zion;

    at sa iyo ay tutuparin ang panata.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Tahimik na naghihintay sa iyo ang papuri, O Diyos, sa Zion,” o “Sa iyo nauukol ang tahimik na papuri, O Diyos, sa Zion.” Eliptiko ang pahayag sa Hebreo at maaari itong unawain sa higit sa isang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: katahimikan
  rationale: Tuwirang ipinapahayag nito ang karaniwang kahulugang ‘silence’ o ‘quietness’ at pinananatili ang kapansin-pansing talinghaga ng Hebreo.
- source_word: תְהִלָּה
  choice: papuri
  rationale: Ito ang karaniwan at natural na katumbas ng salitang Hebreo, at malinaw na naiuugnay sa ‘katahimikan’ sa sugnay na walang hayag na pandiwa.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Sa iyo, ang katahimikan ay papuri
  rationale: Pinananatili nito ang dalawang pangngalan at ang kabalintunaang lakas ng maikli at eliptikong Hebreo, nang hindi nagdaragdag ng pandiwang ‘naghihintay’ na wala sa teksto.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan sa Hebreo, malinaw na tumutukoy rito sa nag-iisang Diyos ng Israel.
- source_word: בְּצִיּוֹן
  choice: sa Zion
  rationale: Natural na lokatibong salin ng pang-ukol na בְּ; ang ‘Zion’ ay pinanatili bilang kinikilalang pangalang pantangi.
- source_word: יְשֻׁלַּם
  choice: tutuparin
  rationale: Sa ugnay nito sa ‘panata,’ ang ‘tutuparin’ ay natural sa Filipino at saklaw ang diwa ng pagbabayad o pagsasakatuparan ng ipinangako.
- source_word: נֶדֶר
  choice: panata
  rationale: Direkta at malawak na nauunawaang katumbas ng pangakong taimtim na ginawa sa Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa eliptikong pariralang לְךָ דֻמִיָּה תְהִלָּה
  choice: Ang katahimikan mismo ay inilalarawan bilang papuring inihahandog sa Diyos.
  alternative: Maaaring unawain na ang papuri ay tahimik na naghihintay sa Diyos, o na sa Diyos nauukol ang tahimik na papuri.
  rationale: Walang hayag na pandiwa ang Hebreo at tunay na bukás ito sa higit sa isang pag-unawa. Pinananatili ng pangunahing salin ang makatang tensiyon, habang inilalahad sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at matinding anyong patula ng Hebreo. Ginamit ang ‘tutuparin ang panata’ sa halip na literal na ‘babayaran ang panata’ dahil ito ang mas natural na kolokasyon sa Filipino nang hindi nawawala ang diwa ng pagsasakatuparan ng ipinangako.
