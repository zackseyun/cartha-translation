base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: tl
  text: Sumasagot ka sa amin sa pamamagitan ng mga kagila-gilalas na gawa, nang may katuwiran[a], O Diyos ng aming kaligtasan. Ikaw ang pinagtitiwalaan ng lahat, hanggang sa mga dulo ng lupa at sa malayong dagat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may katarungan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring gamitin dito ang isahang Hebreong “dagat” sa kolektibong diwa: “mga malalayong dagat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: mga kagila-gilalas na gawa
  rationale: Ang anyo mula sa ירא ay tumutukoy sa mga bagay na pumupukaw ng matinding pagkamangha at maaari ring ng takot. Ang “kagila-gilalas na gawa” ay likas sa makabagong Tagalog at angkop sa konteksto ng makapangyarihang pagliligtas ng Diyos; idinagdag ang “gawa” upang maipahayag ang eliptikong substantibong Hebreo.
- source_word: בְּצֶ֣דֶק
  choice: nang may katuwiran
  rationale: Ipinapahayag ng ב ang paraan ng pagsagot ng Diyos. Pinananatili ng “katuwiran” ang malawak na diwa ng צֶדֶק—matuwid, tapat, at wastong pagkilos—habang inilalagay sa talababa ang posibleng “katarungan.”
- source_word: תַּ֭עֲנֵנוּ
  choice: sinasagot mo kami
  rationale: Ang hulaping unang panauhang maramihan ay nangangahulugang “kami,” at ang ענה ay tuwirang “sumagot” sa konteksto ng panalangin.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: O Diyos ng aming kaligtasan
  rationale: Pinananatili nito ang construct na “Diyos ng aming kaligtasan” at ang tuwirang pagtawag sa Diyos.
- source_word: מִבְטָ֥ח
  choice: pinagtitiwalaan
  rationale: Ang מִבְטָח ay maaaring tumukoy sa bagay o persona na pinaglalagakan ng tiwala. Mas natural sa Tagalog ang predikatibong “ikaw ang pinagtitiwalaan” kaysa sa literal na “ang tiwala ng.”
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: lahat ng dulo ng lupa
  rationale: Ito ang natural at pamilyar na Tagalog para sa idyomang tumutukoy sa pinakamalalayong bahagi ng daigdig.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: at ng malayong dagat
  rationale: Pinananatili sa pangunahing teksto ang isahang יָם. Maaaring kolektibo ang pangngalan at tumukoy sa malalayong dagat, kaya inilalahad ang alternatibong iyon sa talababa.
theological_decisions:
- issue: Saklaw ng צֶדֶק sa paglalarawan sa pagsagot ng Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ay nagpapanatili sa mas malawak na moral at kaugnayang diwa ng salita, samantalang ang “katarungan” ay tunay ding posibleng pagbasa at hindi dapat itago.
- issue: Pagkilala sa Diyos bilang מִבְטָח ng buong daigdig
  choice: Ikaw ang pinagtitiwalaan
  alternative: Ikaw ang pag-asa
  rationale: Mas tuwirang ipinapahayag ng “pinagtitiwalaan” ang ugat at referensiya ng מִבְטָח nang hindi pinapaliit ito sa emosyonal na pag-asa o ginagawang “kanlungan,” na mas malayang pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “O” para sa malinaw na tuwirang pagtawag at hinati sa dalawang pangungusap upang maging natural ang mahabang Hebreong linya nang hindi binabago ang ugnayang gramatikal.
