  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: tl
  text: Dinidilig mong sagana ang mga tudling nito; pinapantay mo ang mga gulod nito. Sa pamamagitan ng mga buhos ng ulan, pinapalambot mo ito; pinagpapala mo ang pagtubo nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַוֵּה
  choice: Dinidilig mong sagana
  rationale: Ipinahahayag ng Piel imperative/infinitival form ang lubusang pagbasa o pagpapasagana sa tubig; natural sa Filipino ang aktibong paglalarawan sa patuloy na pagdidilig.
- source_word: תְּלָמֶיהָ
  choice: ang mga tudling nito
  rationale: Ang תְּלָמִים ay mga tudling sa binungkal na lupa; pinanatili ang panghalip na tumutukoy sa lupang binanggit sa konteksto.
- source_word: נַחֵת
  choice: pinapantay mo
  rationale: Ang bihirang anyo ay may diwang pagpapababa o pagpapahupa/pagpapatatag; sa kontekstong agrikultural, malinaw na inilalarawan ng 'pinapantay' ang epekto ng ulan sa nakaumbok na lupa nang hindi nagdaragdag ng bagong larawan.
- source_word: גְּדוּדֶיהָ
  choice: ang mga gulod nito
  rationale: Sa konteksto ng bukid, tumutukoy ito sa mga nakaumbok na hanay o bunton ng lupa na katapat ng mga tudling.
- source_word: בִּרְבִיבִים
  choice: sa mga ambon
  rationale: Ang רְבִיבִים ay masaganang patak o banayad na pag-ulan; ang 'mga ambon' ay likas at makatang katumbas sa Filipino.
- source_word: תְּמֹגְגֶנָּה
  choice: Pinalalambot mo ito
  rationale: Literal na ipinahihiwatig ng ugat ang pagkatunaw o paglambot; sa lupa dahil sa ulan, 'pinalalambot' ang natural at tumpak na kahulugan.
- source_word: צִמְחָהּ
  choice: ang mga usbong nito
  rationale: Tumutukoy sa tumutubong ani o pananim ng lupa; ang 'mga usbong' ay nagpapanatili sa larawan ng bagong pagtubo.
