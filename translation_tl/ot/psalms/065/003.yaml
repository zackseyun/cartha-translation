  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: tl
  text: 'Nanaig laban sa akin ang mga usapin ng kasamaan[a];

    ang aming mga pagsuway—ikaw ang magbabayad-sala para sa mga iyon.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Napakalakas para sa akin ng mga usapin ng kasamaan.” Siksik ang unang parirala sa Hebreo at maaari ring unawain bilang “mga salita ng kasamaan.”
    reason: lexical_alternative
  - marker: b
    text: O “tatakpan mo ang mga iyon” o “lilinisin mo ang mga iyon.” Ang pandiwang Hebreo ay nangangahulugang gumawa ng pagbabayad-sala para sa kasalanan; ang tiyak na himig nito ay nakasalalay sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: mga usapin ng kasamaan
  rationale: Ang pariralang Hebreo ay siksik at maaaring tumukoy sa mga salita o mga usaping nauukol sa kasamaan. Pinananatili ng “mga usapin ng kasamaan” ang lawak at tunay na kalabuan nito nang hindi nagiging di-likas sa Tagalog.
- source_word: גָּבְרוּ מֶנִּי
  choice: nanaig laban sa akin
  rationale: Ipinahahayag ng גבר ang pagiging malakas o pananaig, at ng מן na may hulaping unang panauhan ang pagdaig sa nagsasalita.
- source_word: פְּשָׁעֵינוּ
  choice: aming mga pagsuway
  rationale: Ang פֶּשַׁע ay paglabag na may diwa ng paghihimagsik. Malinaw at dignidadong naipahahayag ng “mga pagsuway” ang moral na bigat nito nang hindi labis na teknikal.
- source_word: אַתָּה
  choice: ikaw ang
  rationale: Tahasan at mariin ang panghalip sa Hebreo; ipinakikita ng “ikaw ang” ang diin nito sa natural na Tagalog.
- source_word: תְכַפְּרֵם
  choice: magbabayad-sala para sa mga iyon
  rationale: Ang Piel ng כפר ay tumutukoy sa paggawa ng pagtubos o pagbabayad-sala kaugnay ng mga kasalanan. Pinananatili ng salin ang teolohikal na bigat nang hindi itinatakda ang isang partikular na teorya ng pagbabayad-sala.
theological_decisions:
- issue: Pagbibigay-kahulugan sa כפר kaugnay ng pag-aalis ng kasalanan
  choice: magbabayad-sala para sa mga iyon
  alternative: tatakpan mo ang mga iyon; lilinisin mo ang mga iyon
  rationale: Maaaring magdala ang pandiwa ng diwa ng pagtatakip, paglilinis, o paggawa ng pagbabayad-sala. Ang “magbabayad-sala” ang pinakamahusay na nagpapanatili sa kultiko at teolohikal na bigat ng salita rito, ngunit inilalahad sa talababa ang mga posibleng larawang leksikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “usapin” upang mapanatili ang siksik at bahagyang malabong דִּבְרֵי, at ang mahabang anyong “magbabayad-sala” upang maging malinaw ang tinutukoy ng hulaping maramihan sa Hebreo.
