translation:
  language: tl
  text: Para sa tagapangasiwa ng musika.[a] Isang salmo ni David;[b] isang awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong tungkuling tinutukoy ng salitang Hebreo; maaari rin itong isaling “Para sa direktor ng musika.”
    reason: lexical_uncertainty
  - marker: b
    text: Ang Hebreong “kay/ni David” ay maaaring magpahiwatig na siya ang may-akda, na inialay ito sa kaniya, o na may iba itong kaugnayan sa kaniya.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, karaniwang tumutukoy ang salita sa taong nangangasiwa sa pagtatanghal ng musika. Likas sa modernong Filipino ang “tagapangasiwa ng awitan,” at ipinapahayag ng “Para sa” ang unlaping לְ.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ito ang karaniwang katawagan sa ganitong uri ng awiting panrelihiyon at ang nakasanayang katumbas sa Filipino.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas at maikli ang tradisyonal na pariralang “salmo ni David.” Hindi nito tahasang sinasabing “isinulat ni David,” kaya naipapaliwanag sa talababa ang mas malawak na saklaw ng Hebreong לְ.
- source_word: שִׁיר
  choice: isang awit
  rationale: Pinananatili ang hiwalay na katawagang שִׁיר sa halip na isama lamang ito sa “salmo,” sapagkat kapuwa nasa pamagat ang dalawang termino.
theological_decisions:
- issue: Kahulugan ng לְ sa לְדָוִד
  choice: ni David
  alternative: isinulat ni David / para kay David / ukol kay David
  rationale: Maaaring magpahiwatig ang Hebreong parirala ng pagkakatha, pag-aalay, pagmamay-ari, o kaugnayan. Pinananatili ng teksto at talababa ang kalabuan sa halip na magtakda ng isang tiyak na ugnayan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang karaniwang bokabularyong pangmusika at ang nakaugaliang “salmo ni David,” habang nililinaw sa talababa ang tunay na kalabuan ng Hebreo. Pinag-ugnay ng tuldok-kuwit ang “salmo ni David” at “isang awit” bilang magkaugnay na paglalarawan sa pamagat.
