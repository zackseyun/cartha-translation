  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: tl
  text: 'Para sa tagapanguna ng mga mang-aawit. Awit ni David.


    Sa PANGINOON ako nanganganlong. Paano ninyo masasabi sa akin, “Tumakas ka sa inyong bundok na gaya ng isang ibon”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring unawain ang huling bahagi ng Hebreo bilang: “Tumakas ka sa inyong bundok, ibon.” Sa Masoretikong Hebreo, ang utos na “tumakas” at ang “inyong” ay nasa maramihang anyo, samantalang ang “ibon” ay isahan.'
    reason: Ipinatatalastas ang posibleng pagtawag na “ibon” at ang di-karaniwang hindi pagtutugma ng bilang sa tekstong Hebreo, habang pinananatili sa pangunahing salin ang karaniwang pag-unawang paghahambing ang “ibon.”
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Ipinahihiwatig ng anyong ito ang isang tagapanguna o direktor sa kontekstong pangmusika; nilinaw ang tungkulin sa natural na Tagalog nang hindi labis na tinutukoy ang eksaktong sinaunang katungkulan.
- source_word: לְדָוִד
  choice: Awit ni David
  rationale: Natural na pamagat sa Tagalog para sa kaugnayan ng awit kay David, bagaman maaaring saklawin ng Hebreo ang ‘kay David,’ ‘para kay David,’ o ‘tungkol kay David.’
- source_word: בַיהוָה
  choice: Sa PANGINOON
  rationale: Isinasalin ang banal na pangalang YHWH ayon sa malawak na kinikilalang tradisyon ng pagsulat na PANGINOON, habang pinananatiling personal at tiyak ang tinutukoy.
- source_word: חָסִיתִי
  choice: ako nanganganlong
  rationale: Ipinapahayag ang pagtitiwala at paghahanap ng kaligtasan o proteksiyon; ang aspektong Hebreo ay likas na naihahatid sa Tagalog bilang kasalukuyang kalagayang bunga ng ginawang pagpapasya.
- source_word: לְנַפְשִׁי
  choice: sa akin
  rationale: Sa kontekstong ito, ang ‘aking nephesh’ ay idiomatikong tumutukoy sa mismong nagsasalita; ang ‘sa aking kaluluwa’ ay magiging di-likas at maaaring magpasok ng hindi nilalayong paghahati ng pagkatao.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Tumakas ka sa inyong bundok na gaya ng isang ibon
  rationale: Sinusundan ang malamang na diwa ng payong tumakas nang tulad ng ibon, habang pinananatili ang kapansin-pansing pagkakaiba ng isahang ‘ka’ at maramihang ‘inyong’ na makikita sa tradisyong Masoretiko.
theological_decisions:
- issue: Pagpapahayag ng pagtitiwala kay YHWH
  choice: Sa PANGINOON ako nanganganlong
  alternative: Sa PANGINOON ako nanganlong
  rationale: Ang kasalukuyang anyo ay natural na naghahatid ng patuloy na kalagayan ng pagtitiwala na bunga ng perpektong pandiwang Hebreo, nang hindi ginagawang isang minsanang kilos lamang.
- issue: Kahulugan ng נֶפֶשׁ
  choice: sa akin
  alternative: sa aking kaluluwa
  rationale: Hindi ginawang hiwalay na espirituwal na bahagi ang nephesh; dito ay tumutukoy ito sa buong sarili ng salmista.
- issue: Larawan ng ibon at utos na tumakas
  choice: na gaya ng isang ibon
  alternative: ‘Tumakas ka sa inyong bundok, ibon’
  rationale: Pinili ang karaniwang pag-unawa na paghahambing ang ‘ibon,’ ngunit inilalahad sa talababa ang posibleng pagbasa rito bilang tuwirang pagtawag.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘nanganganlong’ bilang natural na pananalita ng pagtitiwala at proteksiyon. Ang pamagat ay maikli at angkop sa anyong salmo; ang talababa lamang ang nagdadala ng kinakailangang paliwanag sa malabong hulihan ng Hebreo.
