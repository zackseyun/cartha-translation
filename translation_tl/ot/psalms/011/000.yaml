base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng musika. Kay David.[a]


    Kay Yahweh ako’y kumakanlong;

    paano ninyo masasabi sa akin,

    “Tumakas kayo sa inyong bundok, ibon”?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “kay David” ay maaari ring mangahulugang “ni David,” “para kay David,” o “tungkol kay David.”
    reason: source_ambiguity
  - marker: b
    text: 'Mahirap ang pagkakasabi sa Hebreo. Ganito ang anyo ng nakasulat na teksto: “Tumakas kayo sa inyong bundok, ibon.” Posible ring basahin: “Tumakas kang gaya ng ibon patungo sa iyong bundok.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ipinahahayag ang malamang na tungkulin ng taong namamahala sa pagtatanghal ng awit, sa paraang malinaw at likas sa modernong Filipino.
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ang maikli at hindi ganap na tiyak na ugnayang ipinahahayag ng le-, sa halip na ipirming isinulat mismo ni David.
- source_word: בַּיהוָה חָסִיתִי
  choice: Kay Yahweh ako nanganganlong
  rationale: Ang pandiwang חסה ay tumutukoy sa paghahanap ng proteksiyon o kanlungan; ang aspektong Tagalog na 'nanganganlong' ay natural na nagpapahayag ng kasalukuyang pagtitiwala na bunga ng kilos na nasa anyong perfect sa Hebreo.
- source_word: לְנַפְשִׁי
  choice: sa kaluluwa ko
  rationale: Pinananatili ang tahasang נפש sa teksto at ang Hebreong paraan ng pagtukoy sa mismong sarili, kahit mas karaniwang sabihin sa Filipino ang 'sa akin.'
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Tumakas kayo sa inyong bundok, ibon
  rationale: 'Malapit itong sumusunod sa mahirap na katinigang teksto: maramihang utos at panghalip, kasunod ng isahang ''ibon.'' Hindi tahimik na inayos ang di-pagkakatugma; inilalahad sa talababa ang posibleng pagbasa.'
theological_decisions:
- issue: Paglalahad sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalang kinakatawan ng apat na katinig sa tekstong Hebreo at iniiwasang palitan ito ng isang titulo.
- issue: Ugnayan ng לְדָוִד sa awit
  choice: Kay David
  alternative: Awit ni David
  rationale: Hindi tiyak kung ang superskripsiyon ay nagsasaad ng may-akda, pag-aalay, pag-aari, o kaugnayan; pinananatili ng 'Kay David' ang puwang na iyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikling anyo ng superskripsiyon, ang pangalang Yahweh, at ang kapansin-pansing hirap ng huling parirala sa Hebreo; ang mas likas na alternatibo ay inilagay sa talababa sa halip na ipalit nang walang paliwanag.
