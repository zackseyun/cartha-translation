base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: tl
  text: 'Sapagkat matuwid si Yahweh;

    iniibig niya ang mga gawang matuwid;

    makikita ng mga matuwid ang kanyang mukha[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, hindi gaanong malamang, “Ang kanyang mukha ay tumitingin sa matuwid.” Maaaring unawain sa higit sa isang paraan ang balangkas ng huling sugnay sa Hebreo.
    reason: alternative_reading
  - marker: b
    text: Literal na “kanyang mukha.” Maaari ring ipahiwatig ng parirala ang kanyang presensya o paglingap.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag at likas itong pakinggan sa marangal na makabagong Tagalog.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Tumutukoy ito sa matuwid na katangian ni Yahweh at pinananatili ang ugnayang leksikal sa צְדָקוֹת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalan ng Diyos sa Hebreo.
- source_word: צְדָקוֹת
  choice: mga gawang matuwid
  rationale: Ang anyong maramihan ay higit na tumutukoy sa mga kongkretong gawa ng katuwiran kaysa sa abstraktong katangian; inuulit din ng ‘matuwid’ ang salitang-ugat ng naunang pang-uri.
- source_word: אָהֵב
  choice: iniibig niya
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang palagian at katangiang saloobin ni Yahweh.
- source_word: יָשָׁר
  choice: mga matuwid
  rationale: Ginagamit ang pang-uri bilang pangngalan para sa mga taong matuwid; sinusuportahan ng pandiwang maramihan ang kolektibo o maramihang diwa.
- source_word: יֶחֱזוּ
  choice: makikita
  rationale: Naipahahayag nito ang pagtanaw o pagkakita nang hindi nagpapasok ng labis na interpretasyon; ang anyong panghinaharap ay angkop sa di-ganap na pandiwang Hebreo sa konteksto.
- source_word: פָנֵימוֹ
  choice: ang kanyang mukha
  rationale: Pinananatili ang kongkretong idyomang Hebreo; ang ‘presensya’ o ‘paglingap’ ay posibleng pahiwatig ngunit mas interpretatibo.
theological_decisions:
- issue: Paksa at layon ng huling sugnay
  choice: makikita ng mga matuwid ang kanyang mukha
  alternative: minamasdan ng kanyang mukha ang mga matuwid
  rationale: Ang יֶחֱזוּ ay maramihan, kaya natural na unawain ang יָשָׁר bilang kolektibong paksa at ang ‘kanyang mukha’ bilang layon. Gayunman, dahil maramihan ang pormang Hebreo ng ‘mukha,’ maaari rin itong unawain bilang paksa; pinananatili ang mas di-malamang na pagbasa sa talababa.
- issue: Kahulugan ng pagkakita sa mukha ng Diyos
  choice: mukha
  alternative: presensya o paglingap
  rationale: Hindi tahasang nilulutas ng salin kung literal, presensiyal, o tumutukoy sa paglingap ang idyoma; pinananatili ang larawan ng orihinal at inilalahad ang posibleng pahiwatig sa talababa.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinanatili ang pag-uulit ng ‘matuwid’ upang maipakita ang ugnayan ng mga salitang magkaugat sa Hebreo, at pinanatili ang ‘mukha’ sa pangunahing teksto upang hindi agad ipakahulugan ang idyoma.
