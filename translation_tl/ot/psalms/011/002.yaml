  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang larawan ng paghahanda ng mga masama sa pagpapana at ang layunin laban sa matuwid. Gayunman, ang “palihim na” ay nagdaragdag ng paraan ng pag-atake na hindi tahasang isinasaad ng Hebreo. Ang בְּמוֹ אֹפֶל ay sapat na isinalin bilang “sa dilim,” habang ang posibleng “mula sa dilim” ay maayos na inilalagay sa talababa.
  naturalness: Ang “mga matuwid ang puso” ay nauunawaan ngunit hindi ang pinakanatural na modernong Filipino. Ang “mga may pusong matuwid” ay mas likas at pinananatili ang diwa ng panloob na katapatan.
  terminology: Ang “masasama,” “pana,” “palaso,” at “bagting” ay angkop sa marangal ngunit makabagong rehistro ng Mga Awit. Ang “binabaluktot ... ang kanilang pana” ay malinaw na katumbas ng Hebreong idyoma para sa paghahanda ng pana.
  issues:
