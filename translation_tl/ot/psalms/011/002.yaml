  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: tl
  text: 'Sapagkat, masdan ninyo: binabaluktot ng masasama ang kanilang pana; inilalagay nila ang kanilang palaso sa bagting upang tirahin sa dilim[a] ang mga may pusong matuwid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa dilim.” Maaaring idiin ng pariralang Hebreo ang madilim na kalagayan ng pag-atake o ang taguang pinagmumulan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Sapagkat tingnan ninyo
  rationale: Pinananatili ng “Sapagkat” ang kaugnayang nagbibigay-katwiran sa naunang pahayag, samantalang ang “tingnan ninyo” ay likas na makabagong panawag-pansin para sa הִנֵּה.
- source_word: הָרְשָׁעִים
  choice: ang masasama
  rationale: Karaniwang tawag sa Mga Awit para sa mga taong tiwali sa asal, hindi lamang sa mga napatunayang nagkasala sa batas.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: iniuunat ... ang kanilang pana
  rationale: Ipinahahayag ang idyomatikong kilos ng pagbaluktot at paghahanda sa pana upang makapana; mas malinaw ito sa karaniwang Filipino kaysa sa literal na “tinatapakan.”
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: inilalagay nila sa bagting ang kanilang palaso
  rationale: Inilalarawan nang konkreto ang sinasadyang paglalagay ng palaso sa bagting bilang paghahanda sa pagpapakawala nito. Pinanatili ang isahang “palaso” ng Hebreo.
- source_word: לִירוֹת
  choice: upang ... tirahin
  rationale: Likas na Filipino para sa layuning magpakawala ng palaso laban sa isang target.
- source_word: בְּמוֹ אֹפֶל
  choice: palihim na ... sa dilim
  rationale: Ang parirala ay maaaring tumukoy sa madilim na kalagayan o sa pagkukubli ng pag-atake. Ipinahihiwatig ng “palihim” ang panlilinlang nang hindi isinasara ang lokatibong diwa ng “sa dilim”; nililinaw sa talababa ang posibleng “mula sa dilim.”
- source_word: לְיִשְׁרֵי לֵב
  choice: ang mga matuwid ang puso
  rationale: Pinananatili ang Hebreong larawan ng puso bilang sentro ng panloob na katapatan at moral na integridad.
