  - severity: low
    issue: Hindi gaanong likas ang “ang mga matuwid ang puso.”
    rationale: Mas natural sa modernong Filipino ang “ang mga may pusong matuwid,” nang hindi binabago ang kahulugang ‘upright in heart.’
