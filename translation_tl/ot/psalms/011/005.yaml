  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: tl
  text: Sinusubok ni Yahweh ang taong matuwid, ngunit ang taong masama at ang umiibig sa karahasan ay kinapopootan ng kaluluwa ni Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas natural na pananalita: “ngunit kinapopootan ni Yahweh ang taong masama at ang umiibig sa karahasan.” Mas literal sa Hebreo ang “kinapopootan ng kaluluwa ni Yahweh,” isang idyomang nagpapahayag ng matindi at personal na pagkasuklam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa anyong transliterado sa halip na palitan ito ng isang titulo.
- source_word: צַדִּיק
  choice: ang taong matuwid
  rationale: Ginagamit ang pang-uri bilang pangngalan para sa isang taong kinikilala sa pagiging matuwid; malinaw at natural ito sa modernong Tagalog.
- source_word: יִבְחָן
  choice: sinusubok
  rationale: Ipinahahayag ng pandiwa ang pagsubok o masusing pagsusuri; pinananatili ng “sinusubok” ang evaluative na diwa nang hindi nililimitahan ito sa pagmamasid lamang.
- source_word: וְרָשָׁע
  choice: ang taong masama
  rationale: Inihahatid nito ang moral na kategorya at ang pangkalahatang gamit ng isahang anyo sa natural na Tagalog.
- source_word: וְאֹהֵב חָמָס
  choice: ang umiibig sa karahasan
  rationale: Pinananatili ang participial na paglalarawan sa isang taong palagiang may pagkagusto sa karahasan.
- source_word: חָמָס
  choice: karahasan
  rationale: Ito ang tuwiran at angkop-sa-kontekstong salin ng salitang tumutukoy sa karahasan o marahas na paggawa ng mali.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: kinapopootan ng kanyang kaluluwa
  rationale: Pinananatili ang mariing Hebreong idyoma na literal na nag-uugnay ng pagkapoot sa mismong kaluluwa o kalooban ni Yahweh.
theological_decisions:
- issue: Ang tinutukoy at diin ng “kanyang kaluluwa” sa huling sugnay
  choice: Ang “kanyang kaluluwa” ay tumutukoy kay Yahweh mismo at nagpapahayag ng matindi at personal na pagkasuklam.
  alternative: “Kinapopootan niya,” na inaalis ang salitang “kaluluwa” upang maging mas madulas sa Tagalog.
  rationale: Maliwanag na iniuugnay ng tekstong Hebreo ang pagkapoot sa נֶפֶשׁ ni Yahweh. Ang pagpapanatili sa idyoma ay nag-iingat sa lakas at teolohikal na tensiyon ng pahayag nang hindi nagdaragdag ng paliwanag tungkol sa kalikasan ng damdamin ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “taong matuwid” at “taong masama” upang maging malinaw ang pangngalang gamit ng mga pang-uri, habang pinanatili sa pangunahing teksto ang mariing Hebreong idyoma na “kanyang kaluluwa.”
