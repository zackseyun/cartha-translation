  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: tl
  text: Pauulanan niya ng mga bitag ang masasama; apoy, asupre, at nakapapasong hangin ang magiging bahagi ng kanilang kopa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַמְטֵר
  choice: Pauulanan niya
  rationale: Pinananatili ang metapora ng pagpapaulan at ang anyong nagpapahayag ng gagawin niya.
- source_word: פַּחִים
  choice: mga bitag
  rationale: Karaniwang kahulugan ng pangmaramihang pangngalan; pinananatili rin ang matinding larawan ng mga bitag na ibinubuhos mula sa itaas.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Likas at malawak na salin para sa mga taong inilalarawang balakyot o masama.
- source_word: אֵשׁ וְגָפְרִית
  choice: apoy, asupre
  rationale: Tuwirang isinasalin ang dalawang sangkap ng paghatol.
- source_word: רוּחַ זִלְעָפוֹת
  choice: nakapapasong hangin
  rationale: Ipinahahayag ang mapanirang, matinding init ng parirala nang natural sa modernong Tagalog.
- source_word: מְנָת כּוֹסָם
  choice: ang magiging bahagi sa kanilang kopa
  rationale: Pinananatili ang Hebreong metapora ng kopa bilang takdang kapalaran o bahagi, nang hindi ito tahasang ipinapaliwanag sa teksto.
theological_decisions:
- issue: Ang kopa bilang larawan ng takdang kapalaran o paghatol
  choice: Pinanatili ang metaporang “bahagi sa kanilang kopa.”
  alternative: “ang nakatakdang kaparusahan sa kanila”
  rationale: Ang tahasang pagpapalit sa “kaparusahan” ay magpapaliwanag sa metapora ngunit mag-aalis sa orihinal na larawang pampanitikan at sa teolohikal na bigat nito.
- issue: Kalikasan ng mga ibinubuhos sa masasama
  choice: Isinalin nang tuwiran bilang “mga bitag,” kasama ng apoy, asupre, at hangin.
  alternative: Unawain o itama ang “mga bitag” bilang “mga baga.”
  rationale: Sinusunod ang tekstong Masoretiko na פַּחִים, kahit may mungkahing emendasyon batay sa magkakatulad na larawan ng paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang masinsing imahen ng pagpapaulan, bitag, at kopa; iniwasan ang labis na pagpapaliwanag sa mismong talata.
