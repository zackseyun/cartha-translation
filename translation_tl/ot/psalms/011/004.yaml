base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: tl
  text: Si Yahweh ay nasa banal niyang templo; si Yahweh—nasa langit ang kanyang trono. Nakikita ng kanyang mga mata; sinusuri ng kanyang mga talukap ang mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng tao”; maaari ring “sangkatauhan” o “mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: nasa banal niyang templo
  rationale: Ang הֵיכָל ay maaaring mangahulugang palasyo o templo; pinananatili ng “templo” ang sagradong tirahan nang hindi tiyak na nililimitahan ito sa gusaling panlupa.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: nasa langit ang kanyang trono
  rationale: Natural na salin ito sa Tagalog ng lokatibong parirala at pinananatili ang pagbibigay-diin ng Hebreo sa trono.
- source_word: עֵינָיו יֶחֱזוּ
  choice: Nakikita ng kanyang mga mata
  rationale: Ang חזה ay nangangahulugang makita o masdan; malinaw at tuwiran ang “nakikita” sa modernong Tagalog.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: sinusuri ng kanyang mga talukap
  rationale: Pinanatili ang antropomorpikong larawang “mga talukap” at isinalin ang בחן bilang masusing pagsusuri.
- source_word: בְּנֵי אָדָם
  choice: ang mga tao
  rationale: Bagaman literal na “mga anak ng tao,” kolektibo ang kahulugan ng idyomang Hebreo; likas at tumpak sa modernong Tagalog ang “mga tao,” habang inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Larawan ng banal na tirahan at makalangit na trono
  choice: Pinanatiling magkatabi ang pahayag na si Yahweh ay nasa banal niyang templo at na nasa langit ang kanyang trono.
  alternative: Ituring ang “banal na templo” bilang makalupang templo lamang o bilang simpleng kasingkahulugan ng langit.
  rationale: Magkatabing inihahayag ng Hebreo ang dalawang larawan; hindi dapat tahimik na pag-isahin o limitahan ang mga ito.
- issue: Kolektibong kahulugan ng בְּנֵי אָדָם
  choice: ang mga tao
  alternative: ang mga anak ng tao
  rationale: Tumutukoy ang parirala sa sangkatauhan sa pangkalahatan. Ang pangunahing teksto ay ginawang natural sa Tagalog, ngunit pinanatili sa talababa ang literal na Hebreong idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng pangalang Yahweh, ang biglang estruktura ng ikalawang sugnay, at ang makatang larawang “mga talukap.”
