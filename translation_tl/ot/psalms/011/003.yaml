  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: tl
  text: Kung ginigiba ang mga pundasyon,[a] ano ang magagawa ng taong matuwid?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat ginigiba ang mga pundasyon; ano ang ginawa ng taong matuwid?” Pinahihintulutan ng Hebreo ang mas pormal na pagsasaling tumutukoy sa nagdaang kilos sa huling pandiwa, bagaman karaniwang nauunawaan sa konteksto ang diwang “ano ang magagawa ng taong matuwid?”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Bagaman maaari itong mangahulugang “sapagkat,” likas dito ang kondisyunal na “kung” dahil sinusundan ito ng retorikal na tanong.
- source_word: הַשָּׁתוֹת
  choice: ang mga pundasyon
  rationale: Pinananatili ang kongkretong larawan ng Hebreo at hindi nililimitahan ang talinghaga sa kaayusang panlipunan, katarungan, o moral na kaayusan.
- source_word: יֵהָרֵסוּן
  choice: gibain
  rationale: Ipinahahayag ng anyong Niphal ang pagkawasak o paggiba; malinaw at natural sa kondisyunal na sugnay ang “gibain.”
- source_word: צַדִּיק
  choice: ang taong matuwid
  rationale: Kinakatawan ng pang-isahang anyo ang sinumang matuwid; natural ito sa Filipino at hindi nagtatakda ng kasarian.
- source_word: מַה פָּעָל
  choice: ano ang magagawa
  rationale: Bagaman pormal na qatal ang פָּעָל at maaaring isaling “ano ang ginawa,” mas angkop sa retorikal at kondisyunal na konteksto ang tanong tungkol sa maaaring gawin. Inilalahad sa talababa ang pormal na alternatibo.
theological_decisions:
- issue: Saklaw ng talinghagang “mga pundasyon”
  choice: Panatilihin ang talinghaga nang hindi tinutukoy kung ito ay kaayusang panlipunan, katarungan, o mga kaayusang kaugnay ng tipan.
  alternative: Ipaliwanag bilang mga pundasyon ng lipunan o ng moral na kaayusan.
  rationale: Malawak at sadyang mapahiwatig ang larawang Hebreo, kaya hindi ito dapat paliitin sa isang tiyak na pagpapakahulugan.
- issue: Panahunan at diwa ng פָּעָל
  choice: 'Isalin sa pangunahing teksto bilang kakayahan o praktikal na posibilidad: “ano ang magagawa.”'
  alternative: “Ano ang ginawa ng taong matuwid?”
  rationale: Mas umaayon ang modal na pagbasa sa kondisyunal na daloy ng talata, ngunit tunay na pinahihintulutan ng pormal na anyong Hebreo ang pagbasa sa nagdaang kilos, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “gibain” para sa malinaw na larawan ng pagwasak sa pundasyon at “taong matuwid” upang natural na maipahayag ang pang-isahang kinatawang gamit nang hindi nagtatakda ng kasarian.
