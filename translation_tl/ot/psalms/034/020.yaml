  source_fidelity: Tumpak ang pangunahing diwa at ang isahang reperente. Gayunman, ang “hindi nababali” ay mas karaniwang nagpapahiwatig ng paulit-ulit o pangkalahatang kakayahang mabali, samantalang ang Niphal perfect na נִשְׁבָּרָה ay mas tuwirang naipapahayag bilang “hindi nabali” sa makatang pahayag na ito.
  naturalness: Natural ang “Iniingatan niya ang lahat ng kanyang mga buto.” Mas likas at mariin ang “ni isa man sa mga ito ay hindi nabali” kaysa “ni isa sa mga iyon ay hindi nababali.”
  terminology: Ang “iniingatan,” “mga buto,” at “nabali” ay angkop na makabago at dignipikadong Tagalog. Napananatili ng “niya/kanyang” ang isahang panghalip ng Hebreo nang hindi ipinapasok sa pangunahing teksto ang kalaunang Kristolohikal na pagbasa.
