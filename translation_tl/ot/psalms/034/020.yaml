    rationale: Maaaring unawain ang “nababali” bilang ‘breaks/is liable to be broken’ o paulit-ulit na pangyayari. Ang “hindi nabali” ay mas tuwirang naghahatid ng resulta/katayuang ipinahahayag ng מקור, habang nananatiling natural bilang pahayag na pangkalahatan sa panulaan.
  - severity: low
    issue: Mas idiomatiko ang “ni isa man sa mga ito.”
    rationale: Idinaragdag ng “man” ang idiomatikong diin ng negated partitive, at ang “mga ito” ay mas maayos na tumutukoy sa malapit na nabanggit na “mga buto.”
