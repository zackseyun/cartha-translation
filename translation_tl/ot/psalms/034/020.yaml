  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: tl
  text: Iniingatan niya ang lahat ng kanyang mga buto[a]; ni isa man sa mga ito ay hindi nabali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binabantayan” o “pinangangalagaan” ang lahat ng kanyang mga buto.
    reason: lexical_alternative
  - marker: b
    text: Sinipi ang linyang ito sa Juan 19:36 kaugnay ng pagpapako kay Jesus sa krus.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: Iniingatan
  rationale: Ang participle ng שׁמר ay nagpapahayag ng patuloy na pagbabantay at pag-iingat. Natural sa modernong Tagalog ang “iniingatan” at taglay nito ang diwa ng mapangalagang pagpapanatili.
- source_word: כָּל עַצְמוֹתָיו
  choice: ang lahat ng kanyang mga buto
  rationale: Tuwirang ipinahahayag ang kabuuan ng mga buto at pinananatili ang panlalaking isahang panghalip ng Hebreo.
- source_word: אַחַת מֵהֵנָּה
  choice: ni isa sa mga iyon
  rationale: Ang pambabaeng “isa” ay tumutukoy sa isang buto mula sa kabuuang pangkat; ang “ni isa sa mga iyon” ang natural na negatibong partitive na pahayag sa Tagalog.
- source_word: לֹא נִשְׁבָּרָה
  choice: ay hindi nababali
  rationale: Ang Niphal perfect ng שׁבר ay nangangahulugang mabali o masira. Ang pangkasalukuyang “nababali” ay angkop sa pangkalahatan o kasalukuyang-bisang pahayag ng tulang Hebreo nang hindi ito nililimitahan sa nakaraan o hinaharap.
theological_decisions:
- issue: Tinutukoy ng isahang mga hulaping panghalip
  choice: Pinanatili ang “niya/kanyang,” na tumutukoy sa taong matuwid sa agarang konteksto ng awit.
  alternative: Gawing tahasang “matuwid” ang tinutukoy, o isalin nang tuwirang Kristolohikal dahil sa Juan 19:36.
  rationale: Isahan ang mga hulapi sa Hebreo, at ang agarang konteksto ay tungkol sa matuwid na naghihirap na inililigtas ng PANGINOON. Hindi ipinapasok sa pangunahing teksto ang mas huling Kristolohikal na gamit, ngunit itinatala ito sa talababa.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Tagalog. Ginamit ang “ni isa” upang likas na maipahayag ang mariing pagtanggi, at pinanatili ang isahang reperente at ang matalinghagang larawan ng mga buto.
