base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: tl
  text: 'Tikman ninyo at tingnan: mabuti si Yahweh; mapalad ang lalaking[a] kumakanlong sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang lalaki”; ang panlalaking isahan ay ginamit dito bilang kinatawang katawagan para sa sinumang kumakanlong kay Yahweh.
    reason: Nililinaw ang literal na panlalaking isahan ng Hebreo at ang pangkalahatang kinatawang gamit nito nang hindi binabago ang pangunahing teksto.
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Tikman ninyo
  rationale: Pinananatili ang kongkretong pandiwang pandama at ang maramihang pautos; mahalaga sa tula ang larawan ng aktuwal na pagtikim bilang talinghaga ng personal na karanasan.
- source_word: וּרְאוּ
  choice: at tingnan
  rationale: Pinananatili ang ikalawang pautos at ang pagtutugma ng dalawang pandama—pagtikim at pagtingin—nang hindi agad nilulutas ang talinghaga bilang simpleng ‘maranasan.’
- source_word: כִּי
  choice: ':'
  rationale: Ang tutuldok ay natural na nagpapakilala sa nilalaman ng dapat tikman at tingnan—‘mabuti si Yahweh’—at iniiwasan ang malabong pariralang Filipino na ‘tingnan na mabuti,’ na maaaring mangahulugang ‘tingnang mabuti.’
- source_word: טוֹב
  choice: mabuti
  rationale: Malawak at karaniwang katumbas na sumasaklaw kapwa sa mabuting likas at mapagpalang pagkilos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אַשְׁרֵי
  choice: mapalad
  rationale: Natural at marangal na pananalita para sa pormulang nagpapahayag na kahanga-hanga at kanais-nais ang kalagayan ng tinutukoy.
- source_word: הַגֶּבֶר
  choice: ang lalaking
  rationale: Pinananatili sa pangunahing teksto ang panlalaking isahan ng Hebreo; nililinaw sa talababa na maaari itong gumana bilang kinatawan ng sinumang nanganganlong kay Yahweh.
- source_word: יֶחֱסֶה
  choice: nanganganlong
  rationale: Pinananatili ang larawan ng paghingi ng kanlungan at proteksiyon, na mas tiyak kaysa sa pangkalahatang ‘nagtitiwala.’
- source_word: בּוֹ
  choice: sa kanya
  rationale: Natural na panghalip sa Filipino na malinaw na tumutukoy pabalik kay Yahweh nang hindi inuulit ang pangalan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang mismong nasa tekstong Hebreo; pinananatili ito upang huwag palitan ng titulong wala sa anyong ito ng pinagmulan.
- issue: Panlalaking isahan ng הַגֶּבֶר
  choice: ang lalaking
  alternative: ang taong / ang sinumang
  rationale: Pinananatili ang gramatikal na anyong panlalaki habang kinikilala sa talababa ang posibleng kinatawang saklaw nito; sa gayon ay hindi tahimik na binabago ang anyo o nililimitahan ang aplikasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maikli at masidhing ayos na may tutuldok upang mapanatili ang dalawang pautos at maiwasan ang likas na kalabuan ng ‘tingnan na mabuti.’ Napanatili rin ang larawan ng kanlungan at ang personal na pangalang Yahweh.
