source:
  edition: WLC
  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: tl
  text: 'Ukol kay David: Nang binago niya ang kanyang asal sa harap ni Abimelec[a], itinaboy siya nito, at umalis siya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa 1 Samuel 21:10–15, ang hari ay tinatawag na Aquis. Maaaring ibang pangalan ni Aquis o titulong maharlika ang “Abimelec” dito.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Pinananatili nito ang malawak na diwa ng לְ sa pamagat—maaaring tumukoy sa pagkakatha, pag-uukol, o kaugnayan kay David—nang hindi ito nililimitahan sa “ni David” o “para kay David.”
- source_word: בְּשַׁנּוֹתוֹ
  choice: Nang baguhin niya
  rationale: Ang בְּ na nakakabit sa infinitive construct ay may temporal na diwa rito; natural itong ipinahahayag sa Filipino sa pamamagitan ng “nang.”
- source_word: טַעְמוֹ
  choice: ang kanyang asal
  rationale: Bagaman maaaring tumukoy ang טַעַם sa panlasa, pag-unawa, o katinuan, ang idyoma sa kontekstong ito ay tumutukoy sa ipinakitang kilos o asal. Hindi ginamit ang mas tiyak na “katinuan” upang maiwasan ang labis na pagpapakahulugan.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: sa harap ni Abimelec
  rationale: Tuwiran at likas na salin ng pariralang nangangahulugang nasa presensiya ni Abimelec.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: itinaboy siya nito
  rationale: Ang pandiwa ay nangangahulugang itaboy o paalisin. Ang “nito” ay likas na tumutukoy kay Abimelec at nililinaw ang mga panghalip nang hindi nagdaragdag ng layunin o sanhi na wala sa Hebreo.
- source_word: וַיֵּלַךְ
  choice: at umalis siya
  rationale: Ipinapahayag ang payak na kasunod na kilos ni David matapos siyang itaboy; pinananatili ng “at” ang sunud-sunod na pagsasalaysay ng Hebreo.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Pinananatili sa pangunahing teksto ang pangalang nasa Hebreo; ang kaugnayan nito kay Aquis sa 1 Samuel 21 ay inilalagay sa talababa sa halip na ipalit sa teksto.
theological_decisions:
- issue: Pagkakakilanlan kay Abimelec sa salaysay tungkol kay David
  choice: Panatilihin ang “Abimelec” sa pangunahing teksto.
  alternative: Unawain ang “Abimelec” bilang ibang pangalan o titulong maharlika ni Aquis na hari ng Gat.
  rationale: Abimelec ang tahasang pangalan sa tekstong Hebreo. Ang posibleng pagtutugma kay Aquis ay mahalagang impormasyon ngunit hindi dapat ipalit sa orihinal na pagbasa o gamitin upang tahimik na pagtugmain ang dalawang teksto.
- issue: Saklaw ng לְדָוִד sa pamagat
  choice: “Ukol kay David”
  alternative: “Ni David” o “Para kay David”
  rationale: Hindi tiyak sa anyong Hebreo lamang kung ang parirala ay nagsasaad ng may-akda, pag-uukol, o mas malawak na kaugnayan. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “asal” sa halip na klinikal na “katinuan,” at inayos ang mga panghalip upang maging malinaw kung sino ang nagtaboy at kung sino ang umalis, habang pinananatili ang payak na pagkakasunod ng mga sugnay sa Hebreo.
