  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: tl
  text: Sino ang taong naghahangad ng buhay at nagnanais mabuhay nang matagal upang makakita ng mabuti?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makaranas ng mabuti.” Sa literal, “umiibig sa mga araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Sino ang taong
  rationale: Pinananatili ang retorikal na tanong. Ang “tao” ay likas na pangkalahatan sa Tagalog at hindi nililimitahan ang tinutukoy sa isang lalaking nasa hustong gulang.
- source_word: הֶחָפֵץ חַיִּים
  choice: naghahangad ng buhay
  rationale: Ipinahahayag ng חפץ ang masidhing pagnanais o pagkagusto. Ang “buhay” ang karaniwang diwang isahan ng anyong Hebreong חַיִּים.
- source_word: אֹהֵב יָמִים
  choice: nagnanais ng maraming araw
  rationale: Ang literal na “umiibig sa mga araw” ay hindi likas sa Tagalog. Ipinahahayag ng salin ang idyomatikong diwa ng pagnanais na humaba ang mga araw ng buhay, habang itinatala sa talababa ang mas literal na anyo.
- source_word: לִרְאוֹת טוֹב
  choice: upang makakita ng mabuti
  rationale: Pinananatili ang konkretong pandiwang “makakita” at ang malawak na kahulugan ng טוֹב, sa halip na paliitin ito sa kasaganaan o materyal na tagumpay.
theological_decisions:
- issue: Pangkalahatang panlalaking anyo
  choice: tao
  alternative: lalaki
  rationale: Bagaman panlalaking isahan ang הָאִישׁ, kumakatawan ito rito sa sinumang tao. Sa Tagalog, tumpak at likas na naipahahayag ng “tao” ang pangkalahatang saklaw nang hindi binabago ang diwa.
- issue: Kahulugan ng “makakita ng mabuti”
  choice: makakita ng mabuti
  alternative: makaranas ng mabuti
  rationale: Pinananatili ng pangunahing teksto ang Hebreong idyoma at ang malawak nitong kahulugan; ang mas interpretatibong “makaranas” ay ibinibigay lamang bilang paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniiwasan ang di-likas na literalismong “umiibig sa mga araw,” ngunit pinananatili sa talababa ang larawan ng Hebreo. Ang pangungusap ay nananatiling retorikal at may estilong karunungan.
