lexical_decisions:
- source_word: הִבִּיטוּ
  choice: Tumingin
  rationale: Tuwirang ipinapahayag ang pagbaling ng tingin sa isang tao nang hindi dinaragdagan ang tindi o tagal ng pagkilos.
- source_word: אֵלָי/ו
  choice: sa kanya
  rationale: Sinusunod sa pangunahing teksto ang tradisyong bumabasa nito bilang ikatlong panauhan, na ang tinutukoy sa konteksto ay ang PANGINOON; inilalahad sa talababa ang unang-panauhang alternatibo.
- source_word: וְנָהָרוּ
  choice: nagningning
  rationale: Sa kontekstong kaugnay ng mga mukha at kahihiyan, ipinahihiwatig ng pandiwa ang liwanag o ningning, hindi ang karaniwang diwa ng pag-agos.
- source_word: וּפְנֵיהֶם
  choice: ang kanilang mga mukha
  rationale: Pinananatili ang kongkretong larawang Hebreo sa halip na palitan lamang ito ng panghalip na “sila.”
- source_word: אַל יֶחְפָּרוּ
  choice: hindi mapahiya
  rationale: Pinananatili ang malakas na pagtanggi at ang diwa ng kahihiyan o pagkakalagay sa kahihiyan. Ang anyong Filipino ay maaari ring magpahiwatig ng hinihiling o tiyak na kalalabasan, gaya ng tensiyon sa Hebreo.
theological_decisions:
- issue: Pagkakaiba ng nakasulat at binabasang anyo sa אֵלָי/ו
  choice: sa kanya
  alternative: sa akin
  rationale: Ang ikatlong panauhan ang mas maayos na kaugnay ng mga taong tumitingin sa PANGINOON sa konteksto. Gayunman, hindi inaalis ang unang-panauhang anyo ng tradisyong tekstuwal at inilalagay ito sa talababa.
- issue: Lakas at tungkulin ng אַל kasama ng di-ganap na pandiwa
  choice: hindi mapahiya
  alternative: hindi napahiya / huwag mapahiya
  rationale: Ang Hebreo ay maaaring marinig bilang pagtanggi sa kalalabasan o bilang pakiusap/pagnanais. Pinili ang maikling anyong Filipino na hindi lubusang nagsasara sa dalawang himig.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang poetikong larawan ng pagningning at ng mga mukhang hindi napapahiya, pati ang tunay na pagkakaiba sa tradisyong tekstuwal.
