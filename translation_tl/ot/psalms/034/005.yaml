  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: tl
  text: Tumingin sila sa kanya[a] at nagningning[b]; at ang kanilang mga mukha ay hindi mapapahiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaiba ang nakasulat na anyo at ang tradisyunal na binabasang anyo sa Hebreo rito: “sa akin” o “sa kanya.” Sinusunod ng pangunahing teksto ang “sa kanya” ayon sa konteksto.'
    reason: textual_variant
  - marker: b
