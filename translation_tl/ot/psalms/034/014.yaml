  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: tl
  text: Lumayo ka sa kasamaan at gumawa ka ng mabuti; hanapin mo ang kapayapaan[a] at hangarin mo ito nang buong sikap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na shalom ay maaari ring tumukoy sa kabuuang kagalingan o maayos na kalagayan, hindi lamang sa kawalan ng alitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: Lumayo ka
  rationale: Ang pautos na pandiwa ay nangangahulugang lumihis o lumayo. Natural sa modernong Tagalog ang “lumayo ka” at malinaw nitong ipinapakita ang aktibong pagtalikod.
- source_word: מֵרָע
  choice: sa kasamaan
  rationale: Sa kontekstong ito ng karunungang moral, ang רַע ay tumutukoy sa kasamaan, at ang מִן ay nagpapahiwatig ng paglayo mula rito.
- source_word: וַעֲשֵׂה טוֹב
  choice: at gumawa ka ng mabuti
  rationale: Pinananatili nito ang tuwirang pagtutunggali ng kasamaan at mabuti at likas itong pakinggan sa Tagalog.
- source_word: בַּקֵּשׁ
  choice: hanapin mo
  rationale: Ang piel imperative ay nagsasaad ng masikap na paghahanap; malinaw at karaniwan sa modernong Tagalog ang “hanapin mo.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ang “kapayapaan” ang pinakanatural na pangunahing salin, bagaman maaari ring saklawin ng שָׁלוֹם ang kabuuang kagalingan at maayos na kalagayan; pinananatili sa talababa ang lawak na iyon.
- source_word: וְרָדְפֵהוּ
  choice: at pagsikapan mo itong makamit
  rationale: Literal na tumutukoy ang רדף sa paghabol o pagtugis. Sa etikang konteksto, ang pariralang ito ay naghahatid ng aktibo at matiyagang pagpupunyagi nang hindi nagiging alanganin sa Tagalog; ang “ito” ay tumutukoy sa kapayapaan.
