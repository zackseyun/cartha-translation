  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: tl
  text: 'Pagpapalain ko si Yahweh[a] sa lahat ng oras;

    ang papuri sa kanya ay laging nasa aking bibig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: YHWH; isinasatitik dito bilang “Yahweh.”'
    reason: Paglilinaw sa anyo at pagsasatitik ng banal na pangalan.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Pagpapalain ko
  rationale: Ang unang panauhang isahan na anyong may paragogic he ay nagpapahayag dito ng matatag na pasiya o pangako. Pinananatili ng “Pagpapalain ko” ang larawan ng Hebreong ברך kapag ang Diyos ang pinatutungkulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
- source_word: בְּכָל עֵת
  choice: sa lahat ng oras
  rationale: Likas na pariralang Filipino ito para sa komprehensibong diwang temporal na “sa bawat panahon o pagkakataon.”
- source_word: תָּמִיד
  choice: laging
  rationale: Ipinahahayag nito ang patuloy at di-napapatid na pagpupuri, habang iniiwasan ang mabigat na pag-uulit sa unang linya.
- source_word: תְּהִלָּתוֹ
  choice: ang papuri sa kanya
  rationale: Ang תהלה ay “papuri,” at ang hulaping ikatlong panauhang panlalaki ay natural na ipinahahayag sa Filipino bilang papuring nakatuon sa kanya.
- source_word: בְּפִי
  choice: nasa aking bibig
  rationale: Pinananatili nito ang kongkretong larawan ng bibig bilang pinagmumulan ng binibigkas na papuri.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay karaniwang rekonstruksiyon ng pagbigkas at pinananatili ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang dalawang magkatugmang pahayag at ang kongkretong larawang “nasa aking bibig.”
