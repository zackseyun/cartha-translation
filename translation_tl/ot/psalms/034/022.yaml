id: PSA.34.22
reference: Psalms 34:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: tl
  text: Tinutubos ni Yahweh ang buhay ng kanyang mga lingkod[a], at walang sinumang nanganganlong sa kanya ang ituturing na nagkasala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa.” Ang salitang Hebreo ay tumutukoy rito sa buhay o sa buong nabubuhay na sarili.
    reason: lexical_alternative
  - marker: b
    text: O “hahatulan” o “magkakaroon ng pananagutan.” Ang pandiwang Hebreo ay gumagamit ng wikang may kaugnayan sa pagkakasala at pananagutang hudisyal.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: tinutubos
  rationale: Ang pandiwaring Hebreo mula sa פדה ay nagsasaad ng pagtubos o pagliligtas. Pinananatili ng “tinutubos” ang larawan ng paglaya sa pamamagitan ng pagtubos at ang mas malawak na diwang mapagligtas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa kontekstong ito, tumutukoy ito sa buhay o sa buong nabubuhay na sarili, hindi lamang sa isang hiwalay na di-materyal na bahagi ng tao.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Ang “mga lingkod” ay natural at marangal sa konteksto ng salmo, samantalang ang “mga alipin” ay maaaring labis na idiin ang kalagayang panlipunan na hindi siyang pokus dito.
- source_word: יֶאְשְׁמוּ
  choice: ituturing na nagkasala
  rationale: Pinananatili nito ang hudisyal na diwa ng pagkakasala o pananagutan nang hindi sapilitang pinakikitid sa huling hatol o walang-hanggang kaparusahan.
- source_word: הַחֹסִים בּוֹ
  choice: nanganganlong sa kanya
  rationale: Tumpak na pinananatili ng “nanganganlong” ang larawan ng paghahanap ng kanlungan, sa halip na gawing pangkalahatang “nagtitiwala.”
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng pagliligtas
  choice: “Buhay,” na tumutukoy sa buhay o buong nabubuhay na sarili.
  alternative: “Kaluluwa,” na maaaring unawain bilang panloob o di-materyal na bahagi ng tao.
  rationale: Hindi hinihingi ng Hebreo ang teknikal o dualistikong antropolohiya; ang diin ay ang pagtubos ni Yahweh sa kanyang mga lingkod.
- issue: Lakas ng יֶאְשְׁמוּ
  choice: “Ituturing na nagkasala,” bilang wikang may hudisyal na diwa.
  alternative: “Hahatulan” o “magkakasala/magkakaroon ng pananagutan.”
  rationale: May malinaw na diwa ng pagkakasala at pananagutan ang pandiwa, ngunit iniiwasan ng napiling salin ang pagtakda rito bilang tiyak na pahayag tungkol sa huling paghuhukom.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nanganganlong” upang mapanatili ang matalinghagang larawan ng salmo, at “ituturing na nagkasala” upang maipahayag ang hudisyal na diwa nang hindi lumalabis sa sinasabi ng Hebreo.
