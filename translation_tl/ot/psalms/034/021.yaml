  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: tl
  text: Papatayin ng kasamaan ang masama[a], at mananagot ang mga napopoot sa matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapahamakan ang papatay sa masama.” Ang Hebreong רָעָה ay maaaring mangahulugang “kasamaan,” “pinsala,” o “kapahamakan/sakuna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: papatayin
  rationale: 'Pinananatili ang causative na diwa ng Hiphil: ang kasamaan ang inilalarawang sanhi ng pagkamatay ng masama.'
- source_word: רָשָׁע
  choice: ang masama
  rationale: Ang pang-isahang substantival adjective ay tumutukoy sa kinatawang taong masama; natural at hindi nakatali sa kasarian ang salin.
- source_word: רָעָה
  choice: kasamaan
  rationale: Pinananatili nito ang maikli at posibleng dobleng diwa ng Hebreo—moral na kasamaan at kapahamakang idinudulot nito—nang hindi agad nililimitahan sa sakuna.
- source_word: שֹׂנְאֵי
  choice: ang mga napopoot
  rationale: Likas na Filipino ang anyong ito at naipahahayag ang patuloy o katangiang diwa ng participle.
- source_word: צַדִּיק
  choice: sa matuwid
  rationale: Pinananatili ang pang-isahang substantival na anyo bilang isang kinatawang taong matuwid, nang hindi nagdaragdag ng kasarian.
- source_word: יֶאְשָׁמוּ
  choice: mananagot
  rationale: Ipinahahayag ang pagkakaroon ng sala at pananagutang bunga nito, nang hindi higit na tinutukoy ang paraan ng paghatol.
theological_decisions:
- issue: Kung ang רָעָה ay moral na “kasamaan” o pangyayaring “kapahamakan/sakuna”
  choice: kasamaan
  alternative: Kapahamakan ang papatay sa masama.
  rationale: Ang “kasamaan” ay nagpapanatili sa moral na kabalintunaan at personipikasyon ng Hebreo, habang ang kontekstuwal na kahulugang “kapahamakan” ay inilalahad sa talababa upang hindi patahimikin ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “napopoot” sa halip na mas kolokyal na “galit” upang tumbasan ang tahasang pagkapoot, at “mananagot” upang likas na maipahayag ang legal at moral na pananagutan.
