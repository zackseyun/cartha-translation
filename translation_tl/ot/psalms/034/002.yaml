  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: tl
  text: Sa Yahweh magmamalaki ang aking kaluluwa; maririnig ng mga mapagpakumbaba[a] at magagalak sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga api,” “mga maamo,” o “mga dukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: Kay Yahweh
  rationale: Ang בְּ ay nagpapahiwatig ng batayan o pinagmumulan ng pagmamalaki. Likas sa Filipino ang “kay Yahweh” para sa pagmamalaking nakasentro at nakabatay sa kaniya, at tuwirang pinananatili ang pangalang יהוה bilang “Yahweh.”
- source_word: תִּתְהַלֵּל
  choice: magmamalaki
  rationale: Ang Hitpael ng הלל dito ay nangangahulugang “magmalaki” o “magmapuri,” hindi pangunahin na “pumuri.” Pinananatili ng anyong panghinaharap ang di-ganap na aspekto ng pandiwang Hebreo sa kontekstong ito.
- source_word: נַפְשִׁי
  choice: ang aking kaluluwa
  rationale: Bagaman maaaring tumukoy ang נֶפֶשׁ sa buong sarili, pinananatili ng “aking kaluluwa” ang makatang pagpapahayag at antropolohikal na larawan ng Hebreo.
- source_word: יִשְׁמְעוּ
  choice: maririnig ito
  rationale: Ang qal imperfect ng שמע ay “makarinig.” Idinagdag ang “ito” bilang likas na layon sa Filipino, na tumutukoy sa pagmamalaki ng nagsasalita at hindi nagdaragdag ng bagong ideya.
- source_word: עֲנָוִים
  choice: mga mapagpakumbaba
  rationale: Saklaw ng עֲנָוִים ang mga mapagpakumbaba, maamo, o api. Ang “mga mapagpakumbaba” ay natural at pinananatili ang moral-espirituwal na diwa, habang inilalahad sa talababa ang tunay na leksikal na lawak.
- source_word: וְיִשְׂמָחוּ
  choice: at magagalak sila
  rationale: Ang שמח ay “magalak” o “matuwa.” Ang “magagalak” ay marangal ngunit karaniwan, at ang “sila” ay nilinaw ayon sa likas na balarila ng Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Uri ng pagmamalaki
  choice: Kay Yahweh magmamalaki
  alternative: Ipagmamalaki ng aking kaluluwa si Yahweh
  rationale: Pinananatili ang anyo ng Hebreo, kung saan si Yahweh ang saklaw o batayan ng pagmamalaki. Hindi tahasang nilulutas kung si Yahweh ang tuwirang ipinagmamalaki o kung ang pagmamalaki ay nakabatay sa kaniya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang makatang himig. Pinanatili ang “aking kaluluwa” at ang ayos na “Kay Yahweh” upang hindi patagin ang larawan at tunay na ambiguwidad ng Hebreo.
