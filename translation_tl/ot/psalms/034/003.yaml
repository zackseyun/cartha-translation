  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: tl
  text: 'Makisama kayo sa akin sa pagdakila kay Yahweh[a],


    at itanghal nating sama-sama ang kanyang pangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH,” ang banal na pangalan ng Diyos; isinalin dito bilang “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Dakilain ninyo
  rationale: Ang pangmaramihang pautos mula sa גדל ay panawagang kilalanin at ipahayag ang kadakilaan ni Yahweh. Likas sa makabagong Filipino ang “dakilain” at hindi ito nagpapahiwatig ng literal na pagpapalaki.
- source_word: לַיהוָה
  choice: si Yahweh
  rationale: Tuwirang tinutukoy ng Hebreo ang banal na pangalang YHWH; ang “si” ang likas na panandang Filipino para sa personal na pangalan.
- source_word: אִתִּי
  choice: kasama ko
  rationale: Pinananatili nito ang paanyaya ng nagsasalita na makibahagi ang marami sa pagpupuri.
- source_word: וּנְרוֹמְמָה
  choice: at … nating itanghal
  rationale: Ang cohortative na unang panauhang maramihan ay nagpapahayag ng sama-samang paanyaya. Ipinahihiwatig ng “nating” na kasama ang nagsasalita at ang mga kinakausap.
- source_word: שְׁמוֹ
  choice: ang kanyang pangalan
  rationale: Pinananatili ang kongkretong larawan ng Hebreo, kung saan ang pangalan ay kaugnay ng nahayag na pagkakakilanlan at reputasyon ng Diyos.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Malinaw at likas na ipinapahayag nito ang nagkakaisa o magkakasabay na pagkilos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyong malapit sa malawak na kinikilalang bigkas at hindi nito pinapalitan ang pangalan ng isang titulo.
- issue: Kahulugan ng pagdakila at pagtanghal sa Diyos
  choice: Panawagang kilalanin at ipahayag ang kanyang kadakilaan
  alternative: Literal na palakihin o pataasin ang Diyos
  rationale: Sa konteksto ng papuri, matalinghaga ang mga pandiwang גדל at רום. Hindi sinasabing nadaragdagan ang likas na kadakilaan ng Diyos, kundi sama-samang ipinahahayag at pinararangalan ito.
translation_notes:
  register: Makabago, dignificado, at angkop sa sama-samang pagsamba. Ginamit ang magkatugmang “dakilain” at “itanghal” upang mapanatili ang paralelismo ng Hebreo nang hindi maging mekanikal ang Filipino.
