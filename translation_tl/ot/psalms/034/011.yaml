  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: tl
  text: Halikayo, mga anak, at makinig sa akin; ituturo ko sa inyo ang pagkatakot kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagkatakot kay Yahweh” ay isang mahalagang pahayag sa panitikang karunungan. Saklaw nito ang mapitagang paghanga, pagsunod, at nararapat na pangamba sa harap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Halikayo
  rationale: Bagaman mula sa pandiwang nangangahulugang “pumunta/lumakad,” ginagamit ito rito bilang paanyaya sa mga tuturuan; natural sa modernong Tagalog ang “Halikayo.”
- source_word: בָנִים
  choice: mga anak
  rationale: Literal na “mga anak na lalaki,” ngunit karaniwang tawag ito sa mga mag-aaral sa panitikang karunungan at hindi kailangang limitahan sa mga lalaki.
- source_word: שִׁמְעוּ לִי
  choice: makinig sa akin
  rationale: Ipinahihiwatig ng parirala ang pagbibigay-pansin at pagsunod, hindi lamang pisikal na pagdinig.
- source_word: יִרְאַת יְהוָה
  choice: ang pagkatakot kay Yahweh
  rationale: Pinananatili ang “pagkatakot” upang hindi paliitin sa paggalang lamang ang saklaw nitong may kasamang pagpipitagan, pagsunod, at wastong pangamba sa harap ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh.”
- source_word: אֲלַמֶּדְכֶם
  choice: ituturo ko sa inyo
  rationale: Ang piel imperfect ay natural na nagpapahayag dito ng layunin o pangako ng nagsasalita na magturo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng יִרְאַת יְהוָה
  choice: ang pagkatakot kay Yahweh
  alternative: ang pagpipitagan kay Yahweh
  rationale: Pinananatili ng “pagkatakot” ang tunay na teolohikal na tensiyon at mas malawak na diwa ng Hebreo—mapitagang paghanga, pagsunod, at nararapat na pangamba—sa halip na lunurin ito sa “pagpipitagan” lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panitikang karunungan. Ginamit ang “Halikayo” bilang natural na paanyaya at “mga anak” bilang pedagogical na tawag sa mga mag-aaral sa pangkalahatan.
