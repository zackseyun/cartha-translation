  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: tl
  text: 'Ang mga batang leon ay dumaranas ng kakapusan at nagugutom,[a]

    ngunit ang mga naghahanap kay Yahweh

    ay hindi magkukulang ng anumang mabuti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang mga batang leon ay nagdarahop at nagugutom.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging salat o sa pagdarahop.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: mga batang leon
  rationale: Tumutukoy ang pangngalan sa mga bata ngunit malalakas na leon, hindi lamang sa mga leon sa pangkalahatan. Pinananatili nito ang larawan ng malalakas na mandaragit na maaari pa ring kapusin.
- source_word: רָשׁוּ
  choice: dumaranas ng kakapusan
  rationale: Maaaring ipahiwatig ng pandiwa ang pagiging salat o pagdarahop. Likas at malinaw sa makabagong Filipino ang pariralang ito, at hindi nito inuulit lamang ang kasunod na ideya ng pagkagutom.
- source_word: וְרָעֵבוּ
  choice: at nagugutom
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagkagutom; pinananatili ng salin ang pagkakaiba nito sa mas malawak na kakapusan sa unang pandiwa.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: ngunit ang mga naghahanap kay Yahweh
  rationale: Ang anyong participle ay tumutukoy sa mga taong kinikilalang patuloy na humahanap kay Yahweh. Natural sa Filipino ang 'mga naghahanap kay Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang 'Yahweh' sa halip na palitan ito ng isang titulo.
- source_word: לֹא יַחְסְרוּ
  choice: ay hindi magkukulang
  rationale: Ang imperfect ay angkop unawain bilang pangkalahatang katiyakan. Ang 'hindi magkukulang' ay natural at pinananatili ang diin sa kawalan ng kakulangan.
- source_word: כָל טוֹב
  choice: ng anumang mabuti
  rationale: Ang parirala ay may komprehensibong diwang 'anumang/all na mabuti.' Ang 'anumang mabuti' ay malinaw at hindi labis na nagpapaliwanag kung ano ang itinuturing na mabuti.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'Panginoon.'
- issue: Saklaw ng pangakong לֹא יַחְסְרוּ כָל טוֹב
  choice: hindi magkukulang ng anumang mabuti
  alternative: hindi magkukulang sa lahat ng mabuting bagay
  rationale: Pinananatili ang malawak na pahayag ng Hebreo nang hindi dinaragdagan ng paliwanag tungkol sa materyal o espirituwal na kabutihan; nananatili ang likas na teolohikal na tensiyon ng pangako.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may maikling mga linyang patula. Ginamit ang 'dumaranas ng kakapusan' upang maging madaling maunawaan habang pinananatili ang pagkakaiba ng dalawang pandiwang Hebreo.
