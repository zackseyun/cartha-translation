  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: tl
  text: Dumaing sila, at dininig sila ni Yahweh[a]; iniligtas niya sila sa lahat ng kanilang paghihirap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: צָעֲקוּ
  choice: Dumaing sila
  rationale: Ang Qal perfect na צעק ay tumutukoy sa apurahang pagdaing o paghingi ng tulong. Likas sa makabagong Tagalog ang “dumaing” at pinananatili nito ang bigat ng kanilang kagipitan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: שָׁמֵעַ
  choice: dininig sila
  rationale: Bagaman participle ang anyong Hebreo, gumaganap ito sa sunod-sunod na pangyayaring nasa nakaraan. Ang “dininig” ay angkop sa konteksto ng panalanging tinugon, habang ang “sila” ay likas na ipinahihiwatig ng pangungusap.
- source_word: מִכָּל
  choice: sa lahat ng
  rationale: Ipinapahayag ng מִן kasama ng כָּל ang pagliligtas mula sa kabuuan ng kanilang mga paghihirap. Ang “sa lahat ng” ang natural na pariralang Tagalog kasunod ng “iniligtas.”
- source_word: צָרוֹתָם
  choice: kanilang paghihirap
  rationale: Saklaw ng צָרוֹת ang mga kagipitan, problema, at pagdurusa. Malinaw at marangal ang “paghihirap” para sa karanasan ng mga nagsasalita sa salmo.
- source_word: הִצִּילָם
  choice: iniligtas niya sila
  rationale: Ang Hiphil ng נצל ay nangangahulugang sagipin o ilayo mula sa panganib. Pinananatili ng “iniligtas” ang malawak na diwa nito nang hindi nililimitahan sa isang partikular na uri ng pagliligtas.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo; inilalahad sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tatlong kilos ng talata—pagdaing, pagdinig, at pagliligtas—at iniwasang gawing mas tiyak kaysa sa Hebreo ang uri ng kanilang mga paghihirap.
