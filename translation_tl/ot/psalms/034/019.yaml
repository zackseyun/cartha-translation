  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: tl
  text: Marami ang mga paghihirap na sinasapit ng taong matuwid,[a][b] ngunit inililigtas siya ni Yahweh mula sa lahat ng iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Marami ang masasamang bagay, mga kaguluhan, o mga kapahamakang dumarating sa taong matuwid.” Malawak ang kahulugan ng Hebreong רָעוֹת; dito, tumutukoy ito sa mga paghihirap na sinasapit ng matuwid.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, panlalaking isahan ang “taong matuwid,” ngunit maaari itong kumatawan sa sinumang matuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Marami
  rationale: Pinananatili ang diin ng Hebreong panaguring pang-uri sa unahan habang natural pa rin sa modernong Tagalog.
- source_word: רָעוֹת
  choice: mga paghihirap na sinasapit
  rationale: Maaaring tumukoy ang salita sa masasamang bagay, kaguluhan, o kapahamakan. Sa konteksto, mga hirap na dumarating sa matuwid ang tinutukoy, hindi kasamaan ng kaniyang asal.
- source_word: צַדִּיק
  choice: taong matuwid
  rationale: Ang pang-uri ay ginamit bilang pangngalang panlalaking isahan. Ang saling ito ay nagpapanatili sa isahan at maaari pa ring kumatawan sa sinumang matuwid.
- source_word: וּמִכֻּלָּם
  choice: ngunit ... mula sa lahat ng iyon
  rationale: Ipinahahayag ng pang-ugnay ang pagsalungat sa konteksto, at pinananatili ng parirala ang saklaw ng כֻּלָּם—lahat ng nabanggit na paghihirap.
- source_word: יַצִּילֶנּוּ
  choice: inililigtas siya
  rationale: Ang Hiphil ng נצל ay karaniwang nangangahulugang iligtas o sagipin; malinaw at angkop sa konteksto ang “inililigtas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kinatawang panlalaking isahan sa צַדִּיק
  choice: taong matuwid
  alternative: ang mga matuwid; isang matuwid na tao
  rationale: Isahan at panlalaki sa balarilang Hebreo ang anyo, ngunit malamang na kumakatawan ito sa sinumang matuwid. Pinananatili ng salin ang isahan nang hindi nililimitahan ang pahayag sa isang tiyak na lalaki.
- issue: Kahulugan ng רָעוֹת kaugnay ng matuwid
  choice: mga paghihirap na sinasapit
  alternative: mga kasamaan; mga kaguluhan; mga kapahamakan
  rationale: Ipinakikita ng konteksto na ang tinutukoy ay masasakit na pangyayaring dumarating sa matuwid at pinagliligtasan sa kaniya, hindi moral na kasamaang ginagawa niya. Ipinaliliwanag sa talababa ang mas malawak na saklaw ng salita.
- issue: Pagsasalin ng יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga paghihirap na sinasapit” upang maging natural at malinaw, habang pinananatili sa mga talababa ang tunay na lawak ng kahulugan ng רָעוֹת at ang kinatawang isahan ng צַדִּיק.
