  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: tl
  text: Matakot kayo kay Yahweh, kayong mga banal niya[a], sapagkat walang anumang kakulangan ang mga natatakot sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banal na kabilang sa kanya” o, ayon sa tradisyonal na katawagan, “mga santo niya.” Sa Hebreo, “mga banal niya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi sila nagkukulang ng anuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרָאוּ
  choice: Matakot kayo
  rationale: Pautos na anyong panlalaking maramihan ng ירא. Pinananatili ng “matakot” ang tuwirang ugnayang leksikal sa huling pariralang “mga natatakot sa kanya,” pati ang debosyonal at mapitagang lakas ng salita.
- source_word: אֶת־יְהוָה
  choice: kay Yahweh
  rationale: Ang pantukoy sa tuwirang layon na אֶת ay likas na ipinahahayag sa Filipino sa pamamagitan ng “kay” kapag tiyak na pangalang pantangi ang kasunod. Isinalin ang banal na pangalan bilang “Yahweh.”
- source_word: קְדֹשָׁיו
  choice: mga banal niya
  rationale: Pangmaramihang pangngalang gamit ng pang-uring “banal,” na may hulaping nangangahulugang “niya.” Ang “mga banal niya” ay malinaw at hindi umaasa sa tradisyonal na katawagang “mga santo.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang utos. Ang “sapagkat” ay dignificado at malinaw na nagpapakita ng ugnayang nagpapaliwanag.
- source_word: אֵין מַחְסוֹר
  choice: hindi nagkukulang ng anuman
  rationale: Ipinahahayag ng Hebreong idyoma ang kawalan ng kakulangan. Natural sa modernong Filipino ang “hindi nagkukulang ng anuman” at hindi nito ipinahihiwatig na makukuha ang bawat nais.
- source_word: לִירֵאָיו
  choice: ang mga natatakot sa kanya
  rationale: Ginawang likas na pariralang pangngalan sa Filipino ang pang-ukol na לְ kasama ng pangmaramihang participle at hulaping ikatlong panauhang panlalaki. Inulit ang “matakot” upang mapanatili ang sadyang leksikal na ugnayan sa pambungad na utos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng pangakong אֵין מַחְסוֹר
  choice: hindi nagkukulang ng anuman
  alternative: nakukuha ang lahat ng kanilang nais
  rationale: Ang teksto ay nagsasaad ng kawalan ng kakulangan, hindi tahasang pangako na matutupad ang bawat pagnanais. Iniingatan ng salin ang lakas ng pahayag nang hindi ito pinalalawak.
translation_notes:
  register: Modernong Filipino na may marangal at debosyonal na himig. Ginamit ang tuwirang “matakot” sa halip na “igalang” upang mapanatili ang diin at pag-uulit ng Hebreo; malinaw naman sa kontekstong panawagan ito sa mapitagang takot kay Yahweh.
