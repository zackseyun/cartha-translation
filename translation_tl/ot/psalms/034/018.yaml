  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: tl
  text: Malapit si Yahweh sa mga pusong wasak, at inililigtas niya ang mga espiritung durog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga may mapagpakumbabang espiritu.” Maaaring ilarawan ng Hebreo ang mga lubhang nadurog sa loob o ang mga ibinaba at mapagpakumbaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: Malapit
  rationale: Likas na panaguring pang-uri sa Tagalog at pinananatili ang pahiwatig ng lapit kapwa sa ugnayan at sa pagtulong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong Yahweh, sa halip na palitan ito ng isang titulo.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: sa mga wasak ang puso
  rationale: Pinananatili ang Hebreong talinghaga ng pusong nabasag habang gumagamit ng natural at matinding pananalita sa modernong Tagalog.
- source_word: וְאֶת
  choice: at
  rationale: Ang אֵת ay pananda ng layon at hindi kailangang tumbasan nang hiwalay; ang prefixed conjunction ay natural na isinasaling “at.”
- source_word: דַּכְּאֵי רוּחַ
  choice: mga durog ang kalooban
  rationale: Ang “durog” ay nagpapanatili sa tindi ng דכא. Ang “kalooban” ay natural na Tagalog para sa panloob na diwa o espiritu sa kontekstong ito, nang hindi awtomatikong ipinakahulugang pagsisisi.
- source_word: יוֹשִׁיעַ
  choice: inililigtas niya
  rationale: Tumpak na ipinapahayag ang Hiphil ng ישׁע bilang aktibong pagliligtas at pinananatili ang kaugnayan nito sa mas malawak na bokabularyo ng kaligtasan sa Kasulatan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng דַּכְּאֵי רוּחַ
  choice: mga durog ang kalooban
  alternative: mga nagsisisi ang kalooban
  rationale: Maaaring tumukoy ang parirala sa mga lubhang nasaktan, ibinaba, o mapagpakumbaba. Hindi hinihingi ng konteksto na limitahan ito sa penitensiyal na pagsisisi, kaya pinanatili ang mas malawak na kahulugan at inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang magkatugmang talinghaga ng “wasak ang puso” at “durog ang kalooban,” ngunit iniiwasan ang masyadong teknikal o denominasyonal na pananalita.
