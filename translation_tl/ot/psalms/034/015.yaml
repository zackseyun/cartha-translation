  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: tl
  text: Ang mga mata ni Yahweh ay nakatuon sa mga matuwid, at ang mga tainga niya ay nakabaling sa kanilang daing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang panawagan para sa tulong.” Ang salitang Hebreo ay tumutukoy sa sigaw o pagsusumamong nagmumula sa kagipitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Ang mga mata ni
  rationale: Pinananatili ang tahasang pangmaramihang larawang “mga mata” at ang construct na kaugnay ng banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: nakatuon sa / nakikinig sa
  rationale: Ipinapahayag ng אֶל ang direksiyon ng masusing pansin. Sa unang taludtod, natural ang “nakatuon sa”; sa ikalawa, ang elipsis ng pandiwa ay likas na naipahahayag bilang “nakikinig sa” sa Filipino habang pinananatili ang paralelismo.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Likas na salin ng pangmaramihang pang-uri na ginamit bilang pangngalan, nang hindi dinaragdagan ang moral at tipanang diwa nito.
- source_word: וְאָזְנָיו
  choice: at ang mga tainga niya
  rationale: Pinananatili ang pangmaramihang antropomorpikong larawan at ang pagkakatugma nito sa “mga mata.”
- source_word: שַׁוְעָתָם
  choice: kanilang paghingi ng tulong
  rationale: Ipinahihiwatig ng salita ang daing o pagsusumamo mula sa kagipitan, hindi lamang isang karaniwang sigaw. Ang “paghingi ng tulong” ay malinaw at natural sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Antropomorpikong paglalarawan sa pansin ng Diyos
  choice: Panatilihin ang “mga mata” at “mga tainga”
  alternative: Ipaliwanag bilang “binabantayan” at “pinakikinggan” lamang
  rationale: Mahalaga sa tula ang konkretong larawang pandama. Hindi ito dapat lubusang ipaliwanag o alisin, bagaman idinagdag ang likas na pandiwang “nakikinig” sa ikalawang sugnay upang maging malinaw sa Filipino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang poetikong paralelismo at antropomorpikong larawan; ginamit ang “nakatuon” at “nakikinig” upang maging likas ang dalawang sugnay sa Tagalog.
