lexical_decisions:
- source_word: נְצֹר
  choice: Ingatan mo
  rationale: Ang pautos na anyo ng נצר ay nangangahulugang magbantay o mag-ingat. Likas sa modernong Tagalog ang “Ingatan mo” at pinananatili nito ang tuwirang panawagang kontrolin ang pananalita.
- source_word: לְשׁוֹנְךָ
  choice: ang iyong dila
  rationale: Pinananatili ang kongkretong larawang “dila,” na malinaw ding metonimiya para sa pananalita sa Tagalog.
- source_word: מֵרָע
  choice: sa masama
  rationale: Ang רַע ay tumutukoy sa masama o kasamaan. Ang “sa masama” ay nagpapanatili sa moral na diin at natural na kasunod ng “ingatan ... sa.”
- source_word: וּשְׂפָתֶיךָ
  choice: at ang iyong mga labi
  rationale: Pinananatili ang literal at patulang paralelismo ng “dila” at “mga labi.”
- source_word: מִדַּבֵּר
  choice: sa pagsasalita ng
  rationale: Ipinapahayag nito ang paglayo o pagpigil na dala ng pang-ukol מִן kasama ng infinitibo, at natural na kaugnay ng pandiwang “ingatan.”
- source_word: מִרְמָה
  choice: pandaraya
  rationale: Ang מִרְמָה ay panlilinlang o mapanlinlang na pananalita. Ang “pandaraya” ay malinaw, kasalukuyan, at may sapat na moral na bigat.
