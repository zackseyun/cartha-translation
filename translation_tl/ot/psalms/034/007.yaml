  text: חֹנֶ֤ה מַלְאַךְ יְהוָ֓ה סָ֘בִ֤יב לִֽ/ירֵאָ֗י/ו וַֽ/יְחַלְּצֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: tl
  text: Ang anghel[a] ni Yahweh ay nagkakampo sa palibot ng mga natatakot sa kanya, at inililigtas niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ni Yahweh.” Ang salitang Hebreo na מַלְאָךְ ay maaaring mangahulugang “mensahero” o “anghel,” bagaman mas malamang dito ang “anghel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: Nagkakampo
  rationale: Ang Qal participle ng חנה ay tumutukoy sa pagkakampo. Pinananatili ng “nagkakampo” ang larawan ng isang tagapagtanggol na nakahimpil malapit sa mga iniingatan niya.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng “mensahero” o “anghel,” ngunit sa pariralang ito ay mas malamang ang sobrenatural na diwa. Hindi tinutukoy nang higit pa ang pagkakakilanlan ng anghel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos upang direktang katawanin ang Tetragrammaton sa tekstong Hebreo.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Natural itong nagpapahayag ng nakapaligid na posisyon at pinananatili ang larawang nagbibigay-proteksiyon.
- source_word: לִירֵאָיו
  choice: mga may takot sa kanya
  rationale: Pinananatili nito ang biblikal na diwa ng pagkatakot kay Yahweh, na maaaring magsangkot ng pagpipitagan at masunuring paggalang, nang hindi pinapahina iyon tungo lamang sa “gumagalang.”
- source_word: וַיְחַלְּצֵם
  choice: at inililigtas niya sila
  rationale: Sa kontekstong ito, ang חלץ ay nangangahulugang hanguin sa panganib o iligtas. Malinaw at natural sa modernong Tagalog ang “inililigtas” at ang “niya” ay tumutukoy sa anghel bilang simuno.
theological_decisions:
- issue: Kung ang מַלְאַךְ יְהוָה ay isasaling “mensahero” o “anghel,” at kung dapat tukuyin bilang isang teopaniya o kristopaniya.
  choice: Isinalin bilang “anghel ni Yahweh” nang hindi nililinaw pa ang kaniyang pagkakakilanlan.
  alternative: “mensahero ni Yahweh”; o tahasang pagkilala sa kaniya bilang isang teopanikong/kristopanikong persona.
  rationale: Mas natural dito ang sobrenatural na diwa ng מַלְאַךְ, ngunit hindi sapat ang mismong talata upang tukuyin pa kung sino ang anghel. Sa gayon, pinananatili ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagkakampo” upang mapanatili ang kongkretong larawan ng proteksiyon, at “mga may takot sa kanya” upang mapanatili ang nakaugaliang biblikal na pananalita nang hindi nilulutas ang buong saklaw ng kahulugan nito.
