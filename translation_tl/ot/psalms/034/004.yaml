base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: tl
  text: 'Dumulog ako kay Yahweh, at sinagot niya ako;

    iniligtas niya ako mula sa lahat ng aking kinatatakutan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lahat ng aking mga takot” o “mula sa lahat ng bagay na nagdulot sa akin ng matinding takot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: Dumulog ako
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa paghahanap kay Yahweh sa panalangin at pagtitiwala. Mas likas sa modernong Tagalog ang “dumulog” kaysa “hinanap,” na maaaring magpahiwatig na hindi alam kung nasaan siya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְעָנָנִי
  choice: at sinagot niya ako
  rationale: Tuwirang ipinapahayag nito ang sagot ni Yahweh sa nagsasalita at pinananatili ang hulaping unang panauhan sa Hebreo.
- source_word: מִכָּל מְגוּרוֹתַי
  choice: mula sa lahat ng aking kinatatakutan
  rationale: Ang מְגוּרוֹתַי ay tumutukoy rito sa mga bagay o karanasang kinatatakutan. Ang pariralang ito ay natural sa Tagalog at hindi nililimitahan ang diwa sa panloob na damdamin lamang.
- source_word: הִצִּילָנִי
  choice: iniligtas niya ako
  rationale: 'Malawak ang saklaw ng pandiwang Hebreo: pag-agaw o pagliligtas mula sa panganib. Ang “iniligtas” ay malinaw at natural nang hindi tinutukoy kung pisikal o panloob lamang ang pagliligtas.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang יְהוָה sa talata, kaya transliterasyon ang ginamit sa halip na ipalit ang titulong “Panginoon.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dumulog” upang maipahiwatig ang paghahanap kay Yahweh sa panalangin, at ang “kinatatakutan” upang mapanatili ang posibilidad na ang tinutukoy ay mga sanhi ng takot, hindi lamang ang damdamin ng takot.
