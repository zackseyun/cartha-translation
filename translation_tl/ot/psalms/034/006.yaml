  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: tl
  text: Dumaing ang dukhang ito[a], at dininig siya ni Yahweh; iniligtas niya siya[b] sa lahat ng kanyang paghihirap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nagdurusang ito” o “ang abang ito.” Ang Hebreong עָנִי ay maaaring tumukoy sa karukhaan, paghihirap, o abang kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinagip niya siya.” Ang pandiwa ay tumutukoy sa pagliligtas mula sa panganib o kagipitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עָנִי
  choice: ang dukhang ito
  rationale: Pinananatili ang pantukoy na זֶה at ang substantibong gamit ng עָנִי. Likas sa Tagalog ang “ang dukhang ito,” samantalang ang “dukhang lalaking ito” ay magiging labis na tahasan dahil hindi karaniwang minamarkahan ng Tagalog ang kasarian sa ganitong parirala.
- source_word: קָרָא
  choice: dumaing
  rationale: Sa konteksto ng kagipitan at tugon ng Diyos, ipinahihiwatig ng pandiwa ang taimtim na pagtawag o paghingi ng saklolo. Ipinapahayag ng “dumaing” ang bigat ng kalagayan nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: יהוה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: שָׁמֵעַ
  choice: dininig siya
  rationale: Higit na angkop sa panalanging sinagot ang “dininig” kaysa sa payak na “narinig”; ang panghalip na “siya” ay nilinaw mula sa konteksto at sa kasunod na hulaping Hebreo.
- source_word: צָרוֹתָיו
  choice: kanyang paghihirap
  rationale: Saklaw ng pangngalan ang mga kagipitan, kapighatian, at suliranin. Ang “paghihirap” ay malinaw at likas sa modernong Tagalog.
- source_word: הוֹשִׁיעוֹ
  choice: iniligtas niya siya
  rationale: Ang Hiphil ng ישׁע ay tumutukoy sa pagliligtas mula sa panganib o kagipitan. Pinananatili ng “iniligtas” ang karaniwang bokabularyong biblikal at ang tuwirang layon na “siya.”
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa pagkakaiba nito mula sa karaniwang titulong “Panginoon.”
- issue: Masculinong anyo ng עָנִי
  choice: ang dukhang ito
  alternative: ang dukhang lalaking ito
  rationale: Masculinong isahan ang anyong Hebreo at tumutukoy sa mang-aawit, ngunit walang likas na kasariang gramatikal ang “dukha” sa Tagalog. Hindi kailangang idagdag ang “lalaki,” na wala bilang hiwalay na salita sa teksto; nananatiling tiyak at isahan ang tinutukoy.
- issue: Saklaw ng pagliligtas
  choice: sa lahat ng kanyang paghihirap
  alternative: mula sa bawat paghihirap niya
  rationale: Ang מִכָּל ay nagpapahayag ng pagliligtas mula sa kabuuan ng mga kagipitan. Hindi nilulutas ng salin kung sabay-sabay o paisa-isang naganap ang mga iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa patulang patotoo. Ginamit ang baligtad na ayos na “Dumaing ang dukhang ito” upang maging natural at madiin; pinanatili ang maikling paralelismo ng Hebreo sa pamamagitan ng kuwit at tuldok-kuwit.
