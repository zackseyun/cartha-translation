  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: tl
  text: Ang mukha ni Yahweh ay laban sa mga gumagawa ng masama, upang pawiin ang alaala nila mula sa daigdig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lupain,” kung mas lokal ang saklaw ng tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: Ang mukha ni
  rationale: Pinananatili ang kongkretong larawang Hebreo na “mukha,” na sa idyomang ito ay tumutukoy sa personal at aktibong pagharap ni Yahweh laban sa isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּעֹשֵׂי רָע
  choice: ay laban sa mga gumagawa ng masama
  rationale: Sa konteksto, ipinahihiwatig ng pang-ukol ang salungat o mapanlabang pagtutuon; pinananatili ng “mga gumagawa” ang participial na diwa.
- source_word: לְהַכְרִית
  choice: upang pawiin
  rationale: Ipinapahayag ng Hiphil infinitive ang layunin o bunga ng pagsalungat ni Yahweh. Natural sa Filipino ang “pawiin” kaugnay ng alaala at taglay nito ang diwa ng lubusang pag-aalis.
- source_word: מֵאֶרֶץ
  choice: sa daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupain” o “daigdig.” Mas angkop sa pangkalahatang pahayag ng karunungang awit ang mas malawak na “daigdig,” habang inilalagay sa talababa ang lokal na posibilidad.
- source_word: זִכְרָם
  choice: ang alaala nila
  rationale: Natural at malinaw na Filipino ito para sa pangngalang “alaala/pag-alaala” na may hulaping panghalip na tumutukoy sa kanila.
theological_decisions:
- issue: Ang idyomang “mukha ni YHWH” bilang pahayag ng banal na pagsalungat
  choice: Pinanatili ang kongkretong larawang “Ang mukha ni Yahweh ay laban...”
  alternative: “Ang presensiya ni Yahweh ay laban...” o “Si Yahweh ay laban...”
  rationale: Pinananatili nito ang antropomorpikong at makatang lakas ng Hebreo nang hindi ipinapalagay na literal na may katawang-taong mukha ang Diyos.
- issue: Saklaw ng אֶרֶץ
  choice: daigdig
  alternative: lupain
  rationale: Hindi tahasang nilulutas ng salmo kung pandaigdigan o mas lokal ang tinutukoy. Pinili sa teksto ang mas malawak na kahulugan ngunit tahasang pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong larawang “mukha” at ang banal na pangalang Yahweh; iniwasan ang sobrang literal na pariralang hindi natural sa Tagalog.
