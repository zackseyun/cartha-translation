  naturalness: Hindi likas sa makabagong Filipino ang “nag-aayuno ang aking kaluluwa”; nagmumungkahi ito na ang kaluluwa mismo ang nagsasagawa ng pag-aayuno. Ang “nag-ayuno nang buong pagkatao” ay natural, marangal, at ipinahihiwatig ang puwersa ng נַפְשִׁי nang hindi ipinipilit ang isang hindi likas na literalismo.
  terminology: Ang “paghamak” ay angkop para sa חֲרָפוֹת. Ang “nang buong pagkatao” ay isang maingat na idiomatikong pagsasalin ng “aking kaluluwa” sa kontekstong ito; ang mas literal at alternatibong pagbasa ay dapat manatili sa talababa.
