translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang “aking kaluluwa” dahil tahasan itong nasa Hebreo, habang inilagay sa talababa ang sintaktikong kalabuan. Ginamit ang natural na “ako’y hamakin” sa halip na ang mas literal ngunit matigas na “naging mga paghamak sa akin.”
