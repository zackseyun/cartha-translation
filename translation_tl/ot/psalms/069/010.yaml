  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: tl
  text: Nang umiyak ako at nag-ayuno nang buong pagkatao,[a] iyon ay naging sanhi ng paghamak sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit. “sa pag-aayuno, ang aking kaluluwa.” Maaari ring unawain: “Nang umiyak ako habang nag-aayuno,” o “Nang umiyak ako sa pag-aayuno ng aking kaluluwa.” Hindi ganap na tiyak ang sintaktikong kaugnayan ng “aking kaluluwa” sa pag-aayuno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Nang umiyak ako
  rationale: Ang בכה ay nangangahulugang “umiyak.” Ang temporal na “nang” ay likas sa Filipino at malinaw na inuugnay ang pagkilos sa naging resulta sa kasunod na sugnay.
- source_word: בַצּוֹם נַפְשִׁי
  choice: habang nag-aayuno ang aking kaluluwa
  rationale: Pinananatili nito ang tahasang נַפְשִׁי (“aking kaluluwa/sarili”) at ang צוֹם (“pag-aayuno”). Sinasalamin din nito ang posibleng pagkakaugnay ng “aking kaluluwa” sa pag-aayuno, bagaman nananatiling hindi ganap na tiyak ang sintaks.
- source_word: וַתְּהִי
  choice: naging dahilan iyon
  rationale: Ipinahahayag ng היה ang naging resulta ng naunang pag-iyak at pag-aayuno. Ang “iyon” ay tumutukoy sa buong naunang pangyayari.
- source_word: לַחֲרָפוֹת לִי
  choice: upang ako'y hamakin
  rationale: Ang חֲרָפוֹת ay tumutukoy sa paghamak, pag-alipusta, o kadustaan. Ang likas na pandiwang parirala sa Filipino ay naghahatid ng diwang ang ginawa ng salmista ay naging batayan ng paghamak sa kaniya.
