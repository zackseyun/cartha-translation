  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: tl
  text: Ngunit ako'y naghihirap at nasasaktan; O Diyos, nawa'y dalhin ako ng iyong pagliligtas sa mataas at ligtas na dako.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Dadalhin ako ng iyong pagliligtas, O Diyos, sa mataas at ligtas na dako.” Ang pandiwang Hebreo ay maaari ring unawain bilang pahayag sa hinaharap sa halip na isang kahilingan.'
    reason: alternative_reading
  - marker: b
    text: Ang pandiwang Hebreo ay literal na tumutukoy sa paglalagay sa isang mataas at hindi madaling maabot na lugar; kaya maaari rin itong isaling “ingatan ako” o “gawin akong ligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako'y
  rationale: Ipinahahayag ng pangatnig at tahasang panghalip ang mariing paghahambing sa naunang konteksto; natural itong naipapakita ng “Ngunit ako'y.”
- source_word: עָנִי
  choice: naghihirap
  rationale: Maaaring mangahulugang dukha o api ang salita, ngunit kasama ng “nasasaktan” ay mas malawak na kalagayan ng paghihirap ang tinutukoy.
- source_word: וְכוֹאֵב
  choice: at nasasaktan
  rationale: Pinananatili nito ang kasalukuyang kalagayan ng pagdanas ng sakit na ipinahahayag ng participle.
- source_word: יְשׁוּעָתְךָ
  choice: iyong pagliligtas
  rationale: Ang “pagliligtas” ay natural sa modernong Tagalog at pinananatili ang lawak ng kahulugang pagsagip o kaligtasan.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Malinaw na tuwirang pagtawag ito sa Diyos sa konteksto ng panalangin.
- source_word: תְּשַׂגְּבֵנִי
  choice: nawa'y dalhin ako ... sa mataas at ligtas na dako
  rationale: Ipinahahayag ng pandiwa ang paglalagay sa isang mataas at di-maabot na lugar, kaya may diwang pag-iingat at katiwasayan. Pinananatili ng salin ang larawan nang hindi nagiging pilit sa Tagalog.
theological_decisions:
- issue: Lakas ng imperfect na תְּשַׂגְּבֵנִי
  choice: 'Pakiusap: “nawa''y dalhin ako”'
  alternative: 'Pahayag sa hinaharap: “dadalhin ako”'
  rationale: Sa konteksto ng panaghoy at pagsusumamo, natural itong unawain bilang kahilingan. Gayunman, maaaring basahin ang anyo bilang pahayag sa hinaharap, kaya itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa panalangin. Ginamit ang “nawa'y” upang ipakita ang pagsusumamo, at ang “mataas at ligtas na dako” upang mapanatili ang matalinghagang larawan ng Hebreo habang nauunawaan ng karaniwang mambabasa.
