  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: tl
  text: Purihin siya[a] ng langit[b] at lupa, ng mga dagat, at ng lahat ng gumagalaw[c] sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Nawa’y purihin siya”; maaaring unawain ang pandiwang Hebreo bilang mapanghikayat na panawagan. Itinuturing naman ito ng ilan na higit na prediktibo: “Pupurihin siya.”'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga langit”; ginamit dito ang kolektibong “langit” sa karaniwang tambalang “langit at lupa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “gumagapang” o “nagsisiksikang kumikilos.” Maaaring tumukoy ang salitang Hebreo sa mga nilalang na kumikilos, gumagapang, o nagkakumpulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: Purihin siya
  rationale: Ang Piel imperfect na may hulaping tumutukoy sa ikatlong panauhang panlalaki ay nauunawaan dito bilang paanyaya o panawagan sa pagpupuri. Likas sa modernong Tagalog ang balangkas na “Purihin siya ng…” at malinaw nitong pinananatili ang layon na “siya.”
- source_word: שָׁמַיִם
  choice: langit
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang ginagamit sa Tagalog ang “langit” bilang kolektibong katawagan, lalo na sa tambalang “langit at lupa.”
- source_word: וָאָרֶץ
  choice: at lupa
  rationale: Ang “lupa” sa pariralang “langit at lupa” ay tumutukoy sa buong daigdig o nilikhang kaayusan, hindi sa isang tiyak na lupain.
- source_word: יַמִּים
  choice: mga dagat
  rationale: Tuwirang pinananatili ng “mga dagat” ang bilang na maramihan at ang saklaw ng larawan ng sangnilikha.
- source_word: וְכָל
  choice: at ng lahat
  rationale: Ipinahahayag ng “lahat” ang kabuuang saklaw ng כָל kasama ng kasunod na participle.
- source_word: רֹמֵשׂ
  choice: gumagalaw
  rationale: Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa mga nilalang na gumagapang, kumikilos, o nagkukuyog. Ang “gumagalaw” ay angkop sa konteksto ng mga nilalang sa dagat at hindi ito nililimitahan sa mga gumagapang lamang.
- source_word: בָּם
  choice: sa mga iyon
  rationale: Pinananatili nito ang panghalip na tumutukoy pabalik sa maramihang “mga dagat,” habang iniiwasan ang posibleng kalituhan ng “sa mga ito” sa mas malapit na parirala.
theological_decisions:
- issue: Lakas ng pandiwang imperfect bilang panawagan o pahayag
  choice: 'Isinalin bilang panawagan: “Purihin siya…”'
  alternative: “Nawa’y purihin siya…” o prediktibong “Pupurihin siya…”
  rationale: Sa konteksto ng awit, higit na pinapaboran ng anyo at gamit ang jussive o mapanghikayat na diwa. Inilalagay sa talababa ang maaaring pahintulot o prediktibong pagbasa upang mapanatili ang tunay na saklaw ng Hebreo.
- issue: Saklaw ng pagpupuri ng sangnilikha
  choice: Isang malawak na panawagan sa langit, lupa, mga dagat, at lahat ng nilalang na gumagalaw sa mga iyon
  alternative: Isang prediksiyon na pupurihin siya ng sangnilikha
  rationale: Ang pagkakahanay ng mga bahagi ng nilikha ay bumubuo ng kosmikong panawagan nang hindi nagdaragdag ng anumang doktrinang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang pamilyar na tambalang “langit at lupa” at ang likas na panawagang “Purihin siya ng…”. Ang “sa mga iyon” ay bahagyang pormal ngunit malinaw ang pagtukoy sa “mga dagat.”
