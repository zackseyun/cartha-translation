  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: tl
  text: Sapagkat inuusig nila ang iyong hinampas, at isinasalaysay nila ang sakit ng mga sinugatan mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang sakit ng mga pinatay mo” o “ang sakit ng mga inulos mo.” Ang salitang Hebreo na חֲלָלֶיךָ ay maaari ring tumukoy sa mga inulos o mga napatay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang panandang sanhi na nagbibigay ng dahilan para sa naunang panawagan sa paghatol.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: ang taong hinampas mo
  rationale: Ginagawang likas sa Tagalog ang ipinahihiwatig na isahang layon habang pinananatili ang tuwirang pagkilos ng Diyos sa pandiwang ‘hinampas.’
- source_word: רָדָפוּ
  choice: inuusig nila
  rationale: Ipinahahayag ng רדף ang mapaminsalang paghabol; ang ‘inuusig’ ay angkop sa konteksto ng panaghoy at higit na malinaw kaysa sa neutral na ‘hinahabol.’
- source_word: וְאֶל
  choice: at
  rationale: Idyomatiko ang gamit ng אֶל upang ipakilala ang paksang isinasalaysay; sapat na sa natural na Tagalog ang ‘at’ kasama ng tuwirang layon ng pandiwa.
- source_word: מַכְאוֹב
  choice: ang kirot
  rationale: Tuwirang ipinahahayag ang pisikal o matinding sakit at umaayon sa larawan ng paghampas at pagkasugat.
- source_word: חֲלָלֶיךָ
  choice: mga sinugatan mo
  rationale: Pinananatili ang Diyos bilang tagaganap na ipinahihiwatig ng hulaping panghalip at ang posibleng kahulugan na mga buhay pang sugatan; itinatala sa talababa ang tunay na alternatibong ‘mga pinatay’ o ‘mga inulos.’
- source_word: יְסַפֵּרוּ
  choice: isinasalaysay nila
  rationale: Tumutugma sa Piel ng ספר na ‘isalaysay’ o ‘ikuwento’ at hindi pinapawi ang maaaring mapanlibak o mapagsamantalang himig sa konteksto.
theological_decisions:
- issue: Kung ang חֲלָלֶיךָ ay tumutukoy sa mga sinugatan, mga inulos, o mga pinatay ng Diyos
  choice: mga sinugatan mo
  alternative: mga pinatay mo; mga inulos mo
  rationale: Ang ‘mga sinugatan mo’ ay mahusay na kaagapay ng ‘kirot’ at ng naunang taong ‘hinampas’ ng Diyos. Gayunman, maaari ring tumukoy ang salitang Hebreo sa mga inulos o napatay, kaya hindi inaalis ang tensiyong ito at inilalahad ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘inuusig’ at ‘isinasalaysay’ upang maipakita ang sadyang malupit na kilos nang hindi nagdaragdag ng paliwanag na wala sa Hebreo. Inilagay ang pananda ng talababa pagkatapos ng pariralang pinatutungkulan nito.
