base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: tl
  text: At huwag mong itago ang iyong mukha[a] sa iyong lingkod[b], sapagkat ako'y nasa kagipitan; sagutin mo ako agad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong presensiya.” Literal sa Hebreo ang “iyong mukha,” isang karaniwang idyomang tumutukoy sa pabor o mapagmatyag na presensiya.
    reason: lexical_alternative
  - marker: b
    text: O “alipin.” Ang salitang Hebreo ay maaaring tumukoy sa isang lingkod o alipin, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: At huwag
  rationale: Pinananatili ng “at” ang payak na pagkakaugnay nito sa mga nakapaligid na pakiusap, at ipinahahayag ng “huwag” ang negatibong pakiusap o utos.
- source_word: תַּסְתֵּר
  choice: ikubli
  rationale: Tuwirang ipinapahayag nito ang diwa ng סתר na “itago/ikubli” at pinananatili ang talinghaga ng pagkukubli ng mukha.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang literal at makatang larawang Hebreo sa halip na agad itong ipakahulugang “presensiya” o “paglingap.”
- source_word: מֵעַבְדֶּךָ
  choice: sa iyong lingkod
  rationale: Sa Filipino, likas ang “ikubli ang mukha sa” para sa Hebreong “mula sa iyong lingkod.” Ang “lingkod” ay angkop sa panalanging nagpapahayag ng mapagpakumbabang paglilingkod at pag-aari ng Diyos.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Malinaw nitong pinananatili ang ugnayang sanhi: ang kagipitan ng salmista ang dahilan ng kanyang pakiusap.'
- source_word: צַר לִי
  choice: ako'y nasa kagipitan
  rationale: Likas at maikli itong salin ng idyomang nagsasaad na ang nagsasalita ay nasa matinding hirap o panganib.
- source_word: מַהֵר
  choice: agad
  rationale: Ipinahahayag nito ang agarang tugon na hinihingi ng salmista at likas itong kasama ng pandiwang “sagutin.”
- source_word: עֲנֵנִי
  choice: sagutin mo ako
  rationale: Sa konteksto ng panalangin, ang ענה ay karaniwang tumutukoy sa pagsagot ng Diyos sa nagsusumamo.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pakikitungo ng Diyos
  choice: Panatilihin ang “iyong mukha” sa pangunahing teksto
  alternative: iyong presensiya; iyong paglingap
  rationale: Ang “mukha” ng Diyos ay nagpapahiwatig ng kanyang pansin, paglingap, at malapit na pakikitungo. Pinananatili ng literal na larawan ang makata at teolohikong lalim ng Hebreo nang hindi nilulutas ang talinghaga sa isang paliwanag lamang.
- issue: Kahulugan ng עבד kaugnay ng Diyos
  choice: lingkod
  alternative: alipin
  rationale: Maaaring mangahulugan ang salita ng lingkod o alipin, ngunit sa pormula ng panalangin dito, higit na itinatampok ang mapagpakumbabang paglilingkod at pag-aari ng Diyos kaysa sa legal na kalagayan ng pagkaalipin.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang paralelismong patula, ang larawang “mukha,” at ang kagyat na himig ng pakiusap. Ang “ikubli” at “sapagkat” ay bahagyang pormal ngunit malinaw pa rin sa karaniwang mambabasa.
