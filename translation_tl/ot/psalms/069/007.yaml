  text: 'Sapagkat, dahil sa iyo, pinasan ko ang pag-alipusta;

    tinakpan ng kahihiyan ang aking mukha.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan ng kalagayang inilalarawan sa konteksto. Pinananatili ng “Sapagkat” ang kaugnayan sa naunang pahayag.
- source_word: עָלֶיךָ
  choice: dahil sa iyo
  rationale: Ang עַל dito ay nagpapahayag ng sanhi o kaugnayan, hindi ng lokasyon. Likas at malinaw sa makabagong Tagalog ang “dahil sa iyo,” habang nananatiling bukas ang diwa kung ito ay dahil sa pagkakaugnay sa Diyos o alang-alang sa kanya.
- source_word: נָשָׂאתִי
  choice: pinasan ko
  rationale: Pinananatili ng “pinasan” ang kongkretong talinghaga ng pagdadala ng mabigat na pasanin at ang diwa ng pagtitiis sa pag-alipusta.
- source_word: חֶרְפָּה
  choice: pag-alipusta
  rationale: Saklaw nito ang pang-iinsulto, panunuya, at pampublikong paghamak na ipinahihiwatig ng salitang Hebreo.
- source_word: כִּסְּתָה
  choice: tinakpan
  rationale: Tuwirang pinananatili nito ang larawan ng pagtakip sa mukha at ang pambabaeng simuno sa Hebreo, כְלִמָּה.
- source_word: כְלִמָּה
  choice: kahihiyan
  rationale: Natural itong katumbas para sa kahihiyan, pagkawala ng dangal, o pagkapahiya; naihihiwalay rin nito ang ikalawang termino sa naunang “pag-alipusta.”
- source_word: פָנַי
  choice: aking mukha
  rationale: Ang literal na “mukha” ang malinaw na hinihingi ng larawan ng kahihiyang tumatakip dito.
theological_decisions:
- issue: Kung ang עָלֶיךָ ay nangangahulugang sanhi o layunin
  choice: dahil sa iyo
  alternative: alang-alang sa iyo
  rationale: Mas tuwirang ipinahahayag ng pangunahing salin ang sanhi o kaugnayan nang hindi ipinapalagay na kusang-loob o kapaki-pakinabang ang pagdurusa. Itinatala sa talababa ang posibleng pagbasa na nakatuon sa layunin o katapatan sa Diyos.
translation_notes:
  register: Makabago at marangal na Tagalog. Ang “pinasan” at “tinakpan” ay nagpapanatili sa dalawang kongkretong larawang Hebreo, samantalang ang “pag-alipusta” at “kahihiyan” ay malinaw sa karaniwang mambabasa.
