id: PSA.69.25
reference: Psalms 69:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תְּהִי טִֽירָתָ֥/ם נְשַׁמָּ֑ה בְּ֝/אָהֳלֵי/הֶ֗ם אַל יְהִ֥י יֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/025.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: tl
  text: Nawa’y maging tiwangwang ang kanilang kampamento[a]; huwag magkaroon ng sinumang naninirahan sa kanilang mga tolda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang kampo” o “kanilang tirahan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga tolda”; sa mas malawak na diwa, “mga tirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: Nawa’y maging
  rationale: Ipinahahayag nito ang kusang/pananalangin na puwersa ng jussive sa konteksto ng sumpang-pakiusap, sa halip na gawing payak na pahayag tungkol sa hinaharap.
- source_word: טִירָתָם
  choice: ang kanilang kampamento
  rationale: Maaaring tumukoy ang טִירָה sa isang kampamento o nakukulong na tirahan. Pinananatili ng “kampamento” ang kongkreto at kolektibong larawan at kaagapay ito ng “mga tolda.”
- source_word: נְשַׁמָּה
  choice: tiwangwang
  rationale: Likas at matimbang sa makabagong Tagalog ang “tiwangwang” para sa isang lugar na iniwan at walang naninirahan, at angkop ito sa diwa ng pagkawasak o pagkatiwangwang.
- source_word: בְּאָהֳלֵיהֶם
  choice: sa kanilang mga tolda
  rationale: Literal na “mga tolda” ang אֹהֶל; pinananatili rito ang kongkretong larawang Hebreo, bagaman maaari rin itong tumukoy nang mas malawak sa mga tirahan.
- source_word: אַל יְהִי
  choice: huwag magkaroon
  rationale: Ipinananatili nito ang negatibong jussive bilang pakiusap o hangarin, hindi bilang tiyak na prediksiyon.
- source_word: יֹשֵׁב
  choice: sinumang naninirahan
  rationale: Ang participle ng ישב ay tumutukoy sa taong naninirahan o namamalagi. Ang “sinumang naninirahan” ay natural sa Tagalog at nagpapanatili ng pandiwang diwa.
theological_decisions:
- issue: Mga jussive na sumpang-pakiusap sa isang awit ng panaghoy
  choice: 'Isinalin bilang mga pakiusap o hangarin: “Nawa’y…” at “huwag…”'
  alternative: “Magiging tiwangwang ang kanilang kampamento; walang maninirahan sa kanilang mga tolda.”
  rationale: Ang mga anyong Hebreo ay volitibo/jussive at gumaganap bilang sumpang-pakiusap sa harap ng Diyos, hindi lamang bilang prediksiyon. Pinananatili ng salin ang retorikal at teolohikal na tensiyon ng talata nang hindi ito pinapahina.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang kongkretong larawang “kampamento” at “mga tolda,” habang ang “Nawa’y” at “huwag” ay naghahatid ng pormal ngunit likas na puwersa ng sumpang-pakiusap.
