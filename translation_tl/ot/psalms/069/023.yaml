  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: tl
  text: 'Magdilim nawa ang kanilang mga mata nang hindi sila makakita,

    at patuloy mong panginigin ang kanilang mga baywang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: Magdilim nawa
  rationale: Ang anyong pandiwa sa konteksto ng sumpang panalangin ay nagpapahayag ng kahilingan; pinananatili ng “nawa” ang puwersang ito nang hindi ginagawang simpleng hula.
- source_word: עֵינֵיהֶם
  choice: ang kanilang mga mata
  rationale: Tuwirang salin na nagpapanatili sa larawang pangkatawan ng Hebreo.
- source_word: מֵרְאוֹת
  choice: upang hindi sila makakita
  rationale: Bagaman literal na “mula sa pagkakita,” ang מִן kasunod ng pandiwa rito ay likas na nagpapahiwatig ng pagpigil o kawalan ng kakayahang makakita; ito ang malinaw at natural na katumbas sa Tagalog.
- source_word: וּמָתְנֵיהֶם
  choice: ang kanilang mga balakang
  rationale: Ang מָתְנַיִם ay tumutukoy sa bahaging baywang/balakang; “mga balakang” ay natural at dignidad na larawang pangkatawan sa modernong Tagalog.
- source_word: תָּמִיד
  choice: patuloy
  rationale: Ipinahahayag nito ang walang tigil o nagpapatuloy na kalagayan.
- source_word: הַמְעַד
  choice: pangyarihin mong ... manginig
  rationale: Ang Hiphil ay may sanhiing diwa, “pangyarihing mayanig/matisod.” Ang “manginig” ay natural na naglalarawan ng patuloy na panghihina at kawalang-katatagan ng balakang, habang ang “pangyarihin mong” ay nagpapanatili sa causative force.
theological_decisions:
- issue: Puwersa ng sumpang panalangin
  choice: 'Isinalin bilang kahilingan sa Diyos: “Magdilim nawa ... at pangyarihin mong ...”'
  alternative: 'Isalin bilang hulang panghinaharap: “Magdidilim ...”'
  rationale: Sa konteksto, ang mga anyong pandiwa ay bahagi ng panalangin para sa paghatol, hindi lamang pahayag ng mangyayari. Pinananatili ng salin ang retorikal at teolohikal na tensiyon nang hindi ito pinalalambot.
translation_notes:
  register: Modernong Filipino Tagalog na patula at marangal ngunit madaling maunawaan. Ginamit ang “nawa” upang malinaw ang panalanging kahilingan, at iniwasan ang mas lumang “mga balakang nila’y...” na ayos. Walang footnote dahil maipahahayag nang malinaw sa pangunahing teksto ang diwa ng mga parirala.
