  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: tl
  text: Diyos, alam mo ang aking kahangalan, at ang aking mga kasalanan ay hindi lingid sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang pagtawag sa Diyos sa panalangin; natural at marangal sa modernong Tagalog nang hindi na nagdaragdag ng pantawag na “O.”
- source_word: אַתָּה יָדַעְתָּ
  choice: alam mo
  rationale: Ang tahasang panghalip at stative na pandiwa ay likas na naihahayag sa Tagalog na “alam mo,” na tumutukoy sa kasalukuyan at ganap na kaalaman ng Diyos.
- source_word: לְאִוַּלְתִּי
  choice: ang aking kahangalan
  rationale: Pinananatili ang diwa ng moral at may-salang kahangalan, hindi lamang kakulangan sa talino.
- source_word: וְאַשְׁמוֹתַי
  choice: ang aking mga kasalanan
  rationale: Ang pangngalan ay maramihan at sa konteksto ay tumutukoy sa mga pagkakasala o pananagutan ng nagsasalita; ang konkretong maramihang anyo ay likas sa Tagalog.
- source_word: מִמְּךָ לֹא נִכְחָדוּ
  choice: ay hindi lingid sa iyo
  rationale: Idyomatikong Tagalog para sa literal na diwang “hindi nakubli mula sa iyo,” habang pinananatili ang pagkakaila at ang kaalaman ng kausap.
theological_decisions:
- issue: Pag-amin ng nagsasalita sa kahangalan at mga kasalanan sa isang salmong kalauna'y iniugnay sa Mesiyas sa Bagong Tipan
  choice: Isinalin bilang tuwirang personal na pag-amin ng salmista.
  alternative: Ituring ang pag-amin bilang pansamahan o kinatawan lamang.
  rationale: Malinaw na nasa unang panauhan ang Hebreo. Pinananatili ng salin ang tunay na tinig at teolohikal na tensiyon ng salmo sa halip na lutasin ito sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalangin. Ginamit ang “lingid” bilang karaniwan at maikling idyoma; pinanatili ang paralelismo ng “kahangalan” at “mga kasalanan.”
