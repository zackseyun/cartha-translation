  source_fidelity: 'Tumpak ang salin sa Hebreo: ang direktang pagtawag na “Diyos,” ang mariing “alam mo,” ang personal na “aking kahangalan,” at ang diwang ang mga pagkakasala ng nagsasalita ay hindi nakukubli sa Diyos ay lahat naipahayag. Ang maramihang “mga kasalanan” ay isang likas na Tagalog na paraan upang isalin ang וְאַשְׁמוֹתַי, na tumutukoy rito sa mga pananagutang pagkakasala, hindi sa mga handog para sa kasalanan.'
