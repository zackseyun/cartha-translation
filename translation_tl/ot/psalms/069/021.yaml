  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: tl
  text: 'Lason[a] ang ibinigay nila sa akin bilang pagkain,

    at nang mauhaw ako, suka[b] ang ipinainom nila sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “napakapait na sangkap”; tradisyonal na “apdo.” Ang salitang Hebreo ay tumutukoy rito sa isang nakalalason o mapait na sangkap.
    reason: lexical_alternative
