lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ang ibinigay nila sa akin
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay.” Inayos ang ayos ng mga salita upang maging natural sa Tagalog habang nananatiling tampok ang “lason.”
- source_word: בְּבָרוּתִי
  choice: bilang pagkain
  rationale: Ang בָּרוּת ay pagkain o panustos. Ipinahihiwatig ng “bilang pagkain” na lason ang ibinigay na diumano’y panustos, nang hindi ipinapalagay na inihalo lamang ito sa pagkain.
- source_word: רֹאשׁ
  choice: lason
  rationale: Sa kontekstong patula, tumutukoy ang רֹאשׁ sa nakalalason o napakapait na sangkap. Mas malinaw sa kasalukuyang Tagalog ang “lason” kaysa sa tradisyonal na “apdo.”
- source_word: וְלִצְמָאִי
  choice: at nang mauhaw ako
  rationale: Natural na ipinapahayag nito sa Tagalog ang “para/sa aking uhaw” at pinananatili ang kalagayang tinutukoy ng ikalawang taludtod.
- source_word: יַשְׁקוּנִי
  choice: ang ipinainom nila sa akin
  rationale: Ang causative na anyo ng שׁקה ay “painumin” o “bigyan upang inumin.” Tumpak at likas sa Tagalog ang “ipinainom nila sa akin.”
- source_word: חֹמֶץ
  choice: suka
  rationale: Ang חֹמֶץ ay maaaring suka o umasim na alak. “Suka” ang tuwiran at kinaugaliang salin; inilagay sa talababa ang ibang posibilidad.
theological_decisions:
- issue: Pagkakaugnay sa mga salaysay ng paghihirap ni Jesus sa mga Ebanghelyo
  choice: Isinalin ayon sa sariling kahulugan ng mga salitang Hebreo sa Awit 69.
  alternative: Gamitin sa pangunahing teksto ang “apdo” at “maasim na alak” upang higit na umayon sa tradisyonal na pananalita sa mga Ebanghelyo.
  rationale: Hindi dapat ipasok sa salin ng Awit ang pananalita ng isang mas huling tekstong kaugnay nito. Gayunman, iniingatan sa mga talababa ang mga posibleng salin na mahalaga sa intertekstuwal na pagbasa.
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang magkatimbang na taludtod at ang matinding kabalintunaan: lason bilang pagkain at suka bilang inumin sa oras ng pagkauhaw.'
