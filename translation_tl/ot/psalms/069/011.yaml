  text: I made sackcloth my clothing[b][a], and I became a byword to them.
translation:
  language: tl
  text: Ginawa kong kasuotan ang telang sako, at naging bukambibig nila ako sa panlilibak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging kasabihan nila ako”; ang salitang Hebreo ay maaaring tumukoy sa isang kasabihan o sa taong ginagawang halimbawa at tampulan ng pangungutya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Ginawa kong
  rationale: Sa konstruksiyong kasama ang “aking damit” at “telang-sako,” ang נתן ay nagpapahayag ng paggawa o pagtatalaga sa isang bagay bilang kasuotan, hindi ng simpleng pagbibigay.
- source_word: לְבוּשִׁי
  choice: damit
  rationale: Natural at malinaw na salin para sa kasuotang isinusuot ng nagsasalita; naipahahayag ng hulaping “kong” ang pagmamay-ari.
- source_word: שָׂק
  choice: telang-sako
  rationale: Tumutukoy sa magaspang na telang isinusuot bilang tanda ng pagluluksa o pagpapakumbaba. Mas madaling maunawaan sa modernong Filipino kaysa sa literal na “sako” lamang.
- source_word: וָאֱהִי
  choice: naging
  rationale: Ipinahihiwatig ng היה ang pagpasok sa isang kalagayan bilang bunga ng ginawa at tugon ng mga tao.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Pinananatili ang kaugnayan ng nagsasalita sa mga taong ginawa siyang paksa ng mapanlibak na kasabihan.
- source_word: לְמָשָׁל
  choice: kasabihang panlibak
  rationale: Ang מָשָׁל ay maaaring mangahulugang kasabihan, kawikaan, o bansag na ginagamit sa pangungutya. Sa konteksto ng panlalait sa awit, malinaw na negatibo ang gamit, ngunit pinananatili ng “kasabihan” ang aspektong pasalita ng salita.
