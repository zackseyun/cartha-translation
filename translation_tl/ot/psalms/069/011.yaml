  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “telang-sako” upang linawin na materyal na panluksa ang tinutukoy, at “kasabihang panlibak” upang maipakita kapwa ang aspektong pasalita at ang mapangutyang diwa ng מָשָׁל.
