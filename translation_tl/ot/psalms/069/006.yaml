  terminology: 'Wasto at pare-pareho ang mahahalagang termino: “Yahweh” para sa יהוה, “mga hukbo” para sa צְבָאוֹת, at “Diyos ng Israel” para sa אֱלֹהֵי יִשְׂרָאֵל. Ang talababa a ay nagbibigay ng wastong leksikal na alternatibo para sa קֹוֶיךָ; ang talababa b ay kapaki-pakinabang na paglilinaw ng Hebreong banal na pangalan.'
