  source_fidelity: 'Tapat ang salin sa Hebreo. Naipahayag ang dalawang magkaparis na panalangin: ang mga umaasa sa Diyos ay huwag mapahiya dahil sa salmista, at ang mga humahanap sa Diyos ay huwag dumanas ng kahihiyan dahil sa kanya. Ang “dahil sa akin” ay angkop para sa pangsanhing diwa ng בִי, at pinananatili ng “Panginoong Yahweh ng mga hukbo” ang tambalang pantawag na אֲדֹנָי יְהוָה צְבָאוֹת nang hindi isinasara ang saklaw ng ‘mga hukbo.’'
