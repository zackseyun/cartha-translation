id: PSA.69.6
reference: Psalms 69:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: tl
  text: Huwag nawang mapahiya dahil sa akin ang mga umaasa sa iyo[a], Panginoong Yahweh ng mga hukbo[b]; huwag nawang dumanas ng kahihiyan dahil sa akin ang mga humahanap sa iyo, Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga naghihintay sa iyo.” Ang anyong Hebreo ay maaaring tumukoy sa paghihintay na may mapagtiwalang pag-asa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Adonai Yahweh ng mga hukbo.” Ang Yahweh ang banal na pangalang nakasulat na יהוה.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mapahiya
  rationale: Karaniwang ipinapahayag ng בוש ang pagdanas ng hiya o kasiraang-puri. Ang “mapahiya” ay likas sa makabagong Tagalog at angkop sa panalanging huwag mapahamak ang dangal ng iba dahil sa salmista.
- source_word: בִי
  choice: dahil sa akin
  rationale: 'Sa konteksto, ang בְּ na may panghalip ay may diwang sanhi: nangangamba ang salmista na siya ang maging dahilan ng kahihiyan ng iba.'
- source_word: קֹוֶיךָ
  choice: mga umaasa sa iyo
  rationale: Ang participle ng קוה ay maaaring mangahulugang maghintay o umasa nang may pananabik. Binibigyang-diin ng “umaasa sa iyo” ang mapagtiwalang paghihintay nang hindi inaalis ang alternatibong diwa.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Panginoong Yahweh ng mga hukbo
  rationale: Tuwirang kinikilala ng “Yahweh” ang banal na pangalan, samantalang pinananatili ng “ng mga hukbo” ang larawan ng צְבָאוֹת sa halip na gawin itong abstraktong titulong “Makapangyarihan sa lahat.”
- source_word: יִכָּלְמוּ
  choice: dumanas ng kahihiyan
  rationale: Ang כלם ay tumutukoy sa pagkahamak o matinding kahihiyan. Ang pariralang ito ay nagpapanatili ng bahagyang pagkakaiba nito sa unang pandiwang isinaling “mapahiya,” habang nananatili ang paralelismo.
- source_word: מְבַקְשֶׁיךָ
  choice: mga humahanap sa iyo
  rationale: Ipinahihiwatig ng participle ng בקש ang patuloy at aktibong paghahanap; malinaw at likas sa Tagalog ang “mga humahanap sa iyo.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Tuwirang salin ito ng pariralang construct at malinaw na pantawag sa konteksto, kaya hindi na kailangang dagdagan ng “O.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה sa tambalang pantawag na אֲדֹנָי יְהוָה
  choice: Panginoong Yahweh
  alternative: Panginoong Diyos; Panginoong PANGINOON
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang pangalan at iniiwasan ang nakalilitong pag-uulit na “Panginoong PANGINOON.”
- issue: Larawan ng titulong צְבָאוֹת
  choice: ng mga hukbo
  alternative: Makapangyarihan sa lahat
  rationale: Ang literal na larawang “mga hukbo” ay may malawak na posibleng saklaw at hindi dapat tahimik na ipakahulugan bilang isang abstraktong katangian lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “huwag nawa” upang mapanatili ang himig ng taimtim na panalangin. Iningatan ang paralelismo ng dalawang sugnay at ang bahagyang pagkakaiba ng dalawang salitang Hebreo para sa pagkapahiya o pagkahamak.
