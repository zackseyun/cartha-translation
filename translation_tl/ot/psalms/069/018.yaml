  text: קָרְבָ֣/ה אֶל נַפְשִׁ֣/י גְאָלָ֑/הּ לְמַ֖עַן אֹיְבַ֣/י פְּדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: tl
  text: 'Lumapit ka sa aking kaluluwa[a] at tubusin mo ito;

    dahil sa aking mga kaaway[b], palayain mo ako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salitang isinaling “kaluluwa” ay maaari ring mangahulugang “buhay” o “sarili.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “alang-alang sa aking mga kaaway.” Gayunman, sa konteksto, malamang na ang ibig sabihin ay “dahil sa” o “dulot ng” aking mga kaaway.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: Lumapit ka
  rationale: Tuwirang pakiusap sa Diyos ang Qal imperative; natural sa modernong Tagalog at pinananatili ang lakas ng pautos na pagsusumamo.
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, buhay, o buong sarili. Pinananatili rito ang larawang Hebreo at ang matinding personal na himig, habang nililinaw sa talababa ang mas malawak na saklaw.
- source_word: גְאָלָהּ
  choice: tubusin mo ito
  rationale: Ang גאל ay tumutukoy sa pagtubos o pagbawi bilang tagapagtubos. Ang “ito” ay tumutukoy sa “aking kaluluwa,” ayon sa pambabaeng hulapi sa Hebreo.
- source_word: לְמַעַן
  choice: dahil sa
  rationale: Sa konteksto, malamang na ipinakikilala nito ang mga kaaway bilang dahilan ng kahilingan, bagaman maaari rin itong unawaing “alang-alang sa.”
- source_word: אֹיְבַי
  choice: aking mga kaaway
  rationale: Tuwiran at malinaw na katumbas ng pangmaramihang anyong may hulaping unang panauhan.
- source_word: פְּדֵנִי
  choice: palayain mo ako
  rationale: Ang פדה ay pagliligtas o pagpapalaya sa pamamagitan ng pagtubos. Ang “palayain” ay natural sa Tagalog at naipakikita ang kaibhan nito sa naunang גאל nang hindi ipinapalagay ang isang tiyak na mekanismo ng kabayaran.
theological_decisions:
- issue: Pagkilala sa magkaugnay ngunit magkaibang pandiwa na גאל at פדה
  choice: Isalin ang גאל bilang “tubusin” at ang פדה bilang “palayain.”
  alternative: Isalin kapwa bilang “tubusin,” o ang ikalawa bilang “iligtas.”
  rationale: Pinananatili ng magkaibang salin ang poetikong pag-iigting at leksikal na pagkakaiba ng dalawang pandiwa. Hindi rin nito ipinapasok sa salmo ang isang mas pinaunlad na teorya tungkol sa pagtubos.
- issue: Kahulugan ng לְמַעַן bago ang “aking mga kaaway”
  choice: “dahil sa aking mga kaaway”
  alternative: “alang-alang sa aking mga kaaway”
  rationale: Mas angkop sa daloy ng panalangin na ang panganib mula sa mga kaaway ang dahilan ng hinihinging pagliligtas. Gayunman, tunay na posible sa anyong Hebreo ang mas literal na pagbasa, kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang personal at mapilit na himig ng panalangin, gayundin ang dalawang magkaugnay na salitang tumutukoy sa pagtubos at pagpapalaya.
