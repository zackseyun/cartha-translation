  source_fidelity: 'Tumpak na naihahatid ng salin ang dalawang pautos na pagsusumamo: ang paglapit sa נפשי at ang magkaibang pandiwang גאל at פדה. Ang “dahil sa aking mga kaaway” ay isang makatuwirang kontekstuwal na pagbasa ng לְמַעַן, habang pinananatili ng talababa ang posibleng alternatibong pagbasa.'
