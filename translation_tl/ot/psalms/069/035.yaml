  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: tl
  text: Sapagkat ililigtas ng Diyos ang Zion at itatayo niya ang mga lungsod ng Juda. Maninirahan sila roon at aangkinin nila ito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mamanahin nila ito” o “kukunin nila itong pag-aari.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagmamana o pag-angkin, lalo na ng lupain.
    reason: lexical_alternative
  - marker: b
    text: Ang “ito” ay pambabaeng isahan sa Hebreo at malamang na tumutukoy sa Zion o sa lupain na inilalarawan na parang isang babae.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan o katiyakan ng naunang panawagan sa pagpupuri; natural sa Filipino ang “Sapagkat” bilang paliwanag.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Isahan ang pandiwang kaugnay nito, kaya ang tinutukoy ay ang Diyos, hindi mga diyos.
- source_word: יוֹשִׁיעַ
  choice: ililigtas
  rationale: Ang Hiphil ng ישׁע ay nangangahulugang magligtas o magpalaya; ipinahahayag dito ang inaasahang pagkilos ng Diyos.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Pinanatili ang pangalang pantangi sa anyong karaniwang ginagamit sa modernong Filipino.
- source_word: וְיִבְנֶה
  choice: at itatayo niya
  rationale: Ang בנה ay literal na “magtayo.” Hindi ginawang “muling itatayo” sapagkat walang tahasang panandang pag-uulit sa Hebreo.
- source_word: עָרֵי יְהוּדָה
  choice: ang mga lungsod ng Juda
  rationale: Tuwirang salin ng pariralang konstruktong tumutukoy sa mga lungsod sa Juda.
- source_word: וְיָשְׁבוּ
  choice: Maninirahan
  rationale: Ang ישׁב ay maaaring mangahulugang manirahan, mamuhay, o tumira. Ang “maninirahan” ay malinaw at likas sa Filipino.
- source_word: וִירֵשׁוּהָ
  choice: at aangkinin nila ito
  rationale: Ang ירשׁ ay maaaring mangahulugang angkinin, manahin, o ariin. Ang “aangkinin” ay nagpapanatili sa diwa ng pagkuha at pananatiling may pag-aari sa lupain; ang “ito” ay natural na katumbas sa Filipino ng isahang hulapi.
theological_decisions:
- issue: Ang tinutukoy ng pambabaeng isahang hulapi sa וִירֵשׁוּהָ
  choice: Isinalin bilang “aangkinin nila ito,” at ipinaliwanag sa talababa na pambabaeng isahan ang hulapi sa Hebreo.
  alternative: “aangkinin nila ang Zion” o “aangkinin nila ang lupain”
  rationale: Hindi nagpapakita ng kasariang pambalarila ang panghalip na Filipino na “ito.” Ang talababa ang nagpapanatili sa anyong pambabaeng isahan at sa posibleng pagtukoy nito sa Zion o sa lupain nang hindi sapilitang nilulutas ang kalabuan.
- issue: Hindi tahasang nakasaad ang simuno ng maramihang “maninirahan” at “aangkinin”
  choice: Ginamit ang “kanyang bayan” upang maging malinaw at natural ang Filipino.
  alternative: “maninirahan sila”
  rationale: Walang hayag na pangngalang simuno sa Hebreo. Ipinahihiwatig ng konteksto na ang mga taong iniligtas o bayan ng Diyos ang maninirahan; hindi nito tinutukoy ang mga lungsod bilang simuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” at “maninirahan” bilang mga salitang madaling maunawaan, habang pinanatili ang pangalang Zion at ang poetikong kalabuan ng huling panghalip sa pamamagitan ng talababa.
