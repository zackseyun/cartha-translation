  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: tl
  text: Naging[a] estranghero ako sa aking mga kapatid na lalaki, at dayuhan sa mga anak na lalaki ng aking ina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Ako'y estranghero noon.” Maaaring ipahayag ng pandiwang Hebreo ang pagiging nasa kalagayang ito noon o ang pagpasok sa kalagayang ito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki ng aking ina,” isang patulang paraan ng pagtukoy sa mga kapatid na lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: isang estranghero
  rationale: Ipinapahayag ng salita ang pagiging banyaga o hiwalay sa sariling mga kamag-anak. Pinananatili ng “estranghero” ang kongkretong larawang panrelasyon at ang pagtutugma nito sa “dayuhan.”
- source_word: הָיִיתִי
  choice: Ako'y naging
  rationale: Maaaring tumukoy ang qatal ng היה sa isang kalagayang kinasadlakan o nagresulta. Likas sa Tagalog ang “naging,” habang inilalahad sa talababa ang posibleng simpleng nakaraang kalagayan.
- source_word: לְאֶחָי
  choice: sa aking mga kapatid
  rationale: Ang אחים ay panlalaking maramihan sa Hebreo, ngunit ang karaniwang salitang Tagalog na “mga kapatid” ay hindi nagtatakda ng kasarian. Ang kasunod na linyang “mga anak na lalaki ng aking ina” ang nagpapanatili sa tahasang panlalaking anyo ng paralelismo.
- source_word: וְנָכְרִי
  choice: at isang dayuhan
  rationale: Ang נָכְרִי ay tumutukoy sa isang banyaga o dayuhan. Malinaw at marangal ang “dayuhan” sa modernong Tagalog at pinatitindi nito ang larawang “estranghero.”
- source_word: לִבְנֵי אִמִּי
  choice: sa mga anak na lalaki ng aking ina
  rationale: Ito ang tuwirang kahulugan ng parirala at pinananatili ang patulang paralelismo at tahasang panlalaking katawagan ng Hebreo.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng mga katawagang pampamilya
  choice: Gamitin ang likas na “mga kapatid” sa unang linya at ang tahasang “mga anak na lalaki ng aking ina” sa ikalawa
  alternative: “mga kapatid na lalaki” sa unang linya, o gawing pangkalahatan ang dalawang parirala bilang “pamilya”
  rationale: Hindi minamarkahan ng karaniwang Tagalog na “kapatid” ang kasarian, kaya magiging mas mabigat kaysa sa likas na pananalita ang “mga kapatid na lalaki.” Gayunman, pinananatili ng ikalawang linya ang literal na panlalaking anyo at hindi pinalalawak ang teksto tungo sa buong pamilya.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “Ako'y” para sa maikli at patulang ritmo. Pinanatili ang dalawang magkatugmang larawan—“estranghero” at “dayuhan”—at ang literal na pariralang “mga anak na lalaki ng aking ina.”
