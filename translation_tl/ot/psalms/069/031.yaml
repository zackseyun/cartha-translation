  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: tl
  text: Mas malulugod si Yahweh rito kaysa sa isang baka—isang torong may sungay at biyak ang kuko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mas mabuti kaysa sa isang baka, isang toro.” Inihahambing ng Hebreo ang pagpupuri sa isang hayop na inilalarawang angkop bilang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִיטַב
  choice: At higit itong kalulugdan
  rationale: Ang Qal imperfect na 3fs ng יטב ay tumutukoy sa pagpupuri at pasasalamat sa naunang talata. Kasama ng מִן, ipinahahayag nitong mas kalugod-lugod iyon kay Yahweh kaysa sa handog na hayop.
- source_word: לַיהוָה
  choice: ni Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang “Yahweh.” Ang ayos na “kalulugdan ni Yahweh” ay natural sa modernong Tagalog at tapat sa diwang “magiging kalugod-lugod kay Yahweh.”
- source_word: מִשּׁוֹר
  choice: kaysa sa isang baka
  rationale: Ang מִן pagkatapos ng יטב ay naghuhudyat ng paghahambing. Ang שׁוֹר ay pangkalahatang katawagan sa bakahan; pinananatili ng “baka” ang kaibhan nito sa kasunod na mas tiyak na פָּר.
- source_word: פָּר
  choice: isang toro
  rationale: Tinutukoy ng פָּר ang lalaking baka o toro. Pinananatili ito bilang apposition sa שׁוֹר sa halip na pagsamahin ang dalawang katawagan.
- source_word: מַקְרִן
  choice: may mga sungay
  rationale: Ang anyong naglalarawan mula sa קרן ay nagsasaad na ang toro ay may sungay. Malinaw at likas sa Tagalog ang pariralang ito.
- source_word: מַפְרִיס
  choice: biyak ang mga kuko
  rationale: Mula sa פרס, inilalarawan nito ang hayop na hati o biyak ang kuko. Ang “biyak ang mga kuko” ay malinaw sa ordinaryong mambabasa at nagpapanatili sa paglalarawan ng hayop na karapat-dapat ihandog.
theological_decisions:
- issue: Paghahambing ng pagpupuri at handog na hayop
  choice: Mas kalulugdan ni Yahweh ang pagpupuri kaysa sa ganap na angkop na torong handog.
  alternative: “Ito ay magiging mas mabuti kay Yahweh kaysa sa isang baka.”
  rationale: Ang יטב kasama ng pahambing na מִן ay maaaring literal na unawaing “magiging mas mabuti,” ngunit sa konteksto ang diwa ay pagiging kalugod-lugod kay Yahweh. Hindi nito itinatanggi ang paghahandog; binibigyang-diin nito ang higit na kaluguran niya sa taos-pusong pagpupuri.
- issue: Paglalarawan sa baka at toro
  choice: Panatilihin ang “baka, isang toro” bilang magkaugnay na katawagan.
  alternative: Pagsamahin bilang “isang torong may mga sungay at biyak ang mga kuko.”
  rationale: Pinananatili ng salin ang dalawang Hebreong katawagang שׁוֹר at פָּר at ang posibleng diin ng apposition, habang ipinapaliwanag sa talababa ang alternatibong pagbasa.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa personal na pangalan sa tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kalulugdan” upang maging natural ang pahayag nang hindi inaalis ang paghahambing, at pinanatili ang konkretong paglalarawan sa torong may sungay at biyak ang mga kuko.
