  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: tl
  text: 'Sapagkat dinirinig ni Yahweh ang mga nangangailangan,

    at hindi niya hinahamak ang kanyang mga bilanggo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang mga bihag.” Ang salitang Hebreo ay maaaring tumukoy sa mga taong nakakulong, nabihag, o nakagapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang panawagan sa pagpuri at pinananatili ang malinaw na ugnayang sanhi.
- source_word: שֹׁמֵעַ אֶל
  choice: dinirinig
  rationale: Ang pandiwaring Hebreo ay nagpapahayag ng karaniwang pagkilos ni Yahweh; sa konteksto ng panalangin, ang “dinirinig” ay maaaring magpahiwatig hindi lamang ng pandinig kundi ng mapagmalasakit na pagtugon.
- source_word: אֶבְיוֹנִים
  choice: mga nangangailangan
  rationale: Saklaw nito ang mga dukha at kapos nang hindi nililimitahan ang salita sa kalagayang pinansiyal lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang banal na nasa tekstong Hebreo.
- source_word: אֲסִירָיו
  choice: kanyang mga bilanggo
  rationale: Pinananatili ang kahulugan ng mga taong nakakulong o nakagapos at ang panlalaking pang-isahang hulaping paari na “kanya.”
- source_word: לֹא בָזָה
  choice: hindi niya hinahamak
  rationale: Ang perpektong anyo ay nauunawaan dito bilang pangkalahatang katotohanan, kaagapay ng “dinirinig”; tumpak na ipinahahayag ng “hinahamak” ang pagtrato nang may paghamak.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang tiyak na personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Diwa ng pag-aari sa אֲסִירָיו
  choice: kanyang mga bilanggo
  alternative: mga bilanggo / kanyang mga bihag
  rationale: Pinananatili ang hulaping paari sa Hebreo. Hindi nito ipinapasiya kung bakit sila tinatawag na “kanya,” kaya hindi dinaragdagan ang teksto ng isang tiyak na paliwanag teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo ng dalawang sugnay at ang pangkalahatang-panahong diwa ng mga pandiwa.
