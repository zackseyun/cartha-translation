  naturalness: 'Likas at malinaw ang modernong Filipino: “Sapagkat dinirinig ni Yahweh ang mga nangangailangan, at hindi niya hinahamak ang kanyang mga bilanggo.” Ang register ay marangal ngunit madaling maunawaan, at maayos ang paralelismo ng talata.'
