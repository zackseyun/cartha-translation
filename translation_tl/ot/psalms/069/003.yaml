base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: tl
  text: 'Napagod na ako sa aking pagdaing;[a]

    natuyo na ang lalamunan ko;[b]

    nanghihina na ang mga mata ko

    habang hinihintay ko ang aking Diyos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa katatawag ko.” Ang tinutukoy ay paulit-ulit na pagtawag o paghingi ng saklolo.
    reason: lexical_alternative
  - marker: b
    text: O “namamaos na ang lalamunan ko.” Mas tuwirang ipinahihiwatig ng Hebreo ang pagkatuyo o paghapdi dahil sa matagal na pagtawag.
    reason: lexical_alternative
  - marker: c
    text: O “habang umaasa ako sa aking Diyos.” Ang pandiwang Hebreo ay maaaring tumukoy kapuwa sa paghihintay at sa may-pag-asang pananabik.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Nanghihina na ako
  rationale: Ipinahahayag ng pandiwa ang pagkapagod bilang kalagayang bunga ng matagal na pagkilos. Ang “nanghihina na” ay natural sa makabagong Tagalog at angkop sa matinding panaghoy.
- source_word: בְקָרְאִי
  choice: sa kakatawag
  rationale: Ang קרא ay pagtawag o paghingi ng saklolo. Ipinakikita ng hulmaing “sa kaka-” na ang paulit-ulit na pagtawag ang sanhi ng pagkapagod.
- source_word: נִחַר
  choice: natuyo na
  rationale: Ang pandiwa ay naglalarawan ng pagkatuyo, pagkapaso, o pamamaga dahil sa init. Kasama ng “lalamunan,” pinananatili ng “natuyo” ang pangunahing pisikal na larawan nang hindi ito agad binibigyang-kahulugang pamamaos.
- source_word: גְּרוֹנִי
  choice: ang lalamunan ko
  rationale: Tuwirang katumbas ito ng גרון at pinananatili ang pisikal na larawan ng panaghoy.
- source_word: כָּלוּ עֵינַי
  choice: nangangalabo na ang mga mata ko
  rationale: Ang כלה ay maaaring mangahulugang maubos o manghina. Sa mga mata, natural na ipinahahayag ng “nangangalabo” ang panlalabo o panghihina ng paningin dahil sa matagal na paghihintay.
- source_word: מְיַחֵל לֵאלֹהָי
  choice: sa paghihintay sa aking Diyos
  rationale: Ang יחל ay sumasaklaw sa paghihintay at pag-asang may inaasahan. Pinauuna ng “paghihintay” ang matagal na pagtitiis, samantalang inilalahad sa talababa ang tunay na alternatibong “pag-asa.”
