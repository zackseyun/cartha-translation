translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang maiikling linyang patula at ang “sa kaka-” upang natural na maipakita ang pagod mula sa paulit-ulit na pagtawag. Pinanatili sa talababa ang saklaw ng יחל sa pagitan ng paghihintay at pag-asa.
