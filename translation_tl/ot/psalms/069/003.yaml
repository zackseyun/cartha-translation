  - severity: low
    issue: Ang “Nanghihina na ako” ay hindi kasingtuon ng “Napagod na ako” para sa יָגַעְתִּי.
    rationale: Ang יגע ay pangunahing tumutukoy sa pagkapagod o pagkahapo. Ang “nanghihina” ay maaaring magpahiwatig ng mas malawak na pisikal na panghihina.
