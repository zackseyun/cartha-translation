  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: tl
  text: Pupurihin ko ang pangalan ng Diyos sa pamamagitan ng awit, at dadakilain ko siya nang may pasasalamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng handog ng pasasalamat.” Ang salitang Hebreo ay maaaring tumukoy sa pasasalamat o sa isang handog ng pasasalamat, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Pupurihin ko
  rationale: Ang cohortative na unang panauhang isahan ay nagpapahayag ng kusang pasiya; likas itong naihahayag sa modernong Tagalog sa anyong panghinaharap na “Pupurihin ko.”
- source_word: שֵׁם אֱלֹהִים
  choice: ang pangalan ng Diyos
  rationale: Pinananatili ang pormal at mapitagang pariralang Hebreo sa halip na paikliin bilang “pangalan ng Diyos” nang walang pantukoy.
- source_word: בְּשִׁיר
  choice: sa pamamagitan ng awit
  rationale: Ang בְּ ay nagpapahiwatig dito ng paraan o kasangkapan. Malinaw at natural sa Tagalog ang “sa pamamagitan ng awit.”
- source_word: וַאֲגַדְּלֶנּוּ
  choice: at dadakilain ko siya
  rationale: Ang piel ng גדל ay nangangahulugang kilalanin o ipahayag bilang dakila. Ang “dadakilain” ay natural sa wikang pagsamba at nagpapanatili ng pagtutulad sa “pupurihin.”
- source_word: בְתוֹדָה
  choice: nang may pasasalamat
  rationale: Maaaring tumukoy ang תּוֹדָה sa pasasalamat o sa handog ng pasasalamat. Sa paralelismong may pagpuri at awit, mas malamang ang pasasalamat bilang pasalita o paawit na gawain.
theological_decisions:
- issue: Kung ang תּוֹדָה ay tumutukoy sa pasasalamat o sa handog ng pasasalamat
  choice: pasasalamat
  alternative: handog ng pasasalamat
  rationale: Ang konteksto ay nakatuon sa mga gawaing pasalita at musikal—pagpuri, pag-awit, at pagdakila—kaya “pasasalamat” ang pinakamalamang, habang pinananatili sa talababa ang posibleng sakripisyal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyo ng pagpupuri nang hindi nag-aangkat ng natatanging paniniwalang denominasyonal. Inilagay ang talababa matapos ang “pasasalamat,” ang salitang tinutukoy nito.
