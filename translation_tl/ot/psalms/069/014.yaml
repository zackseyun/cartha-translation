  text: הַצִּילֵ֣/נִי מִ֭/טִּיט וְ/אַל אֶטְבָּ֑עָה אִנָּצְלָ֥ה מִ֝/שֹּֽׂנְאַ֗/י וּ/מִ/מַּֽעֲמַקֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: tl
  text: Sagipin mo ako mula sa putikan; huwag mo akong hayaang lumubog. Maligtas nawa ako mula sa mga napopoot sa akin at mula sa kailaliman ng tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Sagipin mo ako
  rationale: Ang Hiphil imperative na may hulaping unang panauhan ay masidhing pakiusap para sa aktibong pagliligtas; natural at malinaw ang “sagipin” sa larawan ng agarang panganib.
- source_word: מִטִּיט
  choice: mula sa putikan
  rationale: Ang טיט ay putik, lusak, o luwad; ipinahihiwatig dito ang malagkit na putik na maaaring paglubugan, kaya ang “putikan” ay natural sa modernong Filipino.
- source_word: וְאַל אֶטְבָּעָה
  choice: huwag mo akong hayaang lumubog
  rationale: Ang negatibong anyo na may imperfect ay isang pakiusap; malinaw na ipinapahayag ng salin ang panalanging huwag pahintulutang lumubog ang nagsasalita.
- source_word: אִנָּצְלָה
  choice: Maligtas nawa ako
  rationale: Ang Niphal cohortative ay muling pakiusap na maligtas. Pinananatili ng “nawa” ang volitional na diwa at ang makatang paralelismo sa unang sugnay.
- source_word: מִשֹּׂנְאַי
  choice: mula sa mga napopoot sa akin
  rationale: Tuwirang tinutukoy ng anyo ang mga taong namumuhi sa nagsasalita; hindi ito pinapakahulugang simpleng “mga kaaway.”
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: at mula sa kailaliman ng tubig
  rationale: Pinananatili nito ang konstruksiyong “mga kalaliman ng tubig” sa isang natural na makatang anyo sa Filipino at iniuugnay sa larawan ng pagkalubog.
theological_decisions: []
