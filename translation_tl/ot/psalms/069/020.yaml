base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: tl
  text: Dinurog ng paghamak ang puso ko, at ako'y lubhang nanghina. Naghanap ako ng pakikiramay[a], ngunit wala; at ng mga umaaliw, ngunit wala akong natagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maaawa sa akin.” Ang salitang Hebreo ay tumutukoy sa mahabaging pakikibahagi sa dalamhati ng isang nagdurusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  choice: paghamak
  rationale: Saklaw ng “paghamak” ang pagkutya at kahihiyang ipinapataw ng iba, at likas itong pakinggan sa isang panaghoy.
- source_word: שָׁבְרָה
  choice: dinurog
  rationale: Ipinahahayag ng pandiwa ang matinding pagkawasak ng kalooban. Mas natural sa Filipino ang “dinurog ang puso” kaysa literal na “binasag ang puso,” nang hindi kinakailangang palakasin ito hanggang sa ganap na pagwasak.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Ang “puso” ay tumutukoy sa panloob na pagkatao, damdamin, at tatag; natural at malinaw ang literal na larawan sa Filipino.
- source_word: וָאֲנוּשָׁה
  choice: at ako'y nanghina nang husto
  rationale: Ang anyo ay nagsasaad ng malubhang kalagayan o matinding panghihina. Pinananatili ng salin ang bigat nito nang hindi nililimitahan sa pisikal na karamdaman o ipinapalagay na wala nang lunas.
- source_word: וָאֲקַוֶּה
  choice: nag-abang ako
  rationale: Ipinahahayag nito ang paghihintay na may pag-asa o inaasahan. Ang “nag-abang” ay natural sa konteksto ng inaasahang tugon mula sa ibang tao.
- source_word: לָנוּד
  choice: ng makikiramay sa akin
  rationale: Tumutukoy ang salita sa mahabaging pakikibahagi sa dalamhati ng nagdurusa. Ang pandiwang parirala ay natural sa Filipino at hindi inuulit ang kasunod na diwa ng pag-aliw.
- source_word: וָאַיִן
  choice: ngunit wala
  rationale: Tahasang ipinakikita nito ang kawalan ng inaasahang tugon; inililitaw ng “ngunit” ang kabalintunaan sa konteksto.
- source_word: וְלַמְנַחֲמִים
  choice: mga aaliw
  rationale: Pinananatili nito ang maramihang personal na diwa—mga taong magbibigay sana ng kaaliwan.
- source_word: וְלֹא מָצָאתִי
  choice: ngunit wala akong natagpuan
  rationale: Malapit ito sa payak na pahayag ng Hebreo at pinananatili ang paralelismo ng kabiguang makakita ng sinumang tutugon.
theological_decisions:
- issue: Mesiyanikong paggamit sa interpretasyong Kristiyano
  choice: Isinalin muna ang talata ayon sa konteksto nito bilang pansariling panaghoy sa Awit.
  alternative: Gawing tahasang hula tungkol sa pagdurusa ng Mesiyas ang pangunahing teksto.
  rationale: Iniuugnay ng Bagong Tipan ang Awit 69 kay Jesus, ngunit ang talatang ito ay dapat munang katawanin ayon sa diwa ng Hebreo. Nananatiling angkop ang salin sa kalaunang mesiyanikong aplikasyon nang hindi iyon idinaragdag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding talinghaga ng wasak na puso at ang paralelismo ng kawalan ng makikiramay at mga aaliw; iniwasan ang sobrang teknikal, lumang, o denominasyonal na pananalita.
