  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: tl
  text: Sagutin mo ako, Yahweh, sapagkat mabuti ang iyong tapat na pag-ibig; ayon sa dami ng iyong habag, bumaling ka sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Sagutin mo ako
  rationale: Ang pautos na anyo ng ענה sa konteksto ng panalangin ay pakiusap na tumugon ang Diyos. Natural at tuwiran sa modernong Tagalog ang “Sagutin mo ako.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng pakiusap. Ang “sapagkat” ay angkop sa marangal na pananalita ng panalangin at malinaw ang puwersang sanhi.
- source_word: טוֹב
  choice: mabuti
  rationale: Pinananatili ang payak na kahulugan ng pang-uri at ang moral-teolohikal na paglalarawan sa pag-ibig ng Diyos.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ipinahahayag ng חֶסֶד ang pag-ibig na may katapatan at matibay na paninindigan. Ang “tapat na pag-ibig” ay natural, malinaw, at hindi nagdaragdag ng tiyak na interpretasyong denominasyonal.
- source_word: כְּרֹב
  choice: ayon sa sagana mong
  rationale: Ang כְּ kasama ng רֹב ay nagsasaad ng pamantayan o sukat. Pinananatili ng “ayon sa” ang ugnayang ito, habang natural sa Tagalog ang “sagana mong habag.”
- source_word: רַחֲמֶיךָ
  choice: habag
  rationale: Ang anyong Hebreo ay maramihan ngunit maaaring tumukoy sa masaganang magiliw na awa bilang isang kolektibong katangian. Mas natural sa Tagalog ang di-mabilang na “habag” kaysa “mga habag.”
- source_word: פְּנֵה אֵלַי
  choice: bumaling ka sa akin
  rationale: Ang pandiwang פנה na may אֶל ay nagpapahayag ng pagharap o pagbaling tungo sa isang tao. Ang “bumaling ka sa akin” ay natural at pinananatili ang relasyonal na kilos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: pag-ibig na ayon sa tipan
  rationale: Pinananatili ng “tapat na pag-ibig” ang diwa ng pagmamahal at katapatan nang hindi nililimitahan ang salita sa isang mas tahasang interpretasyong pangtipan.
- issue: Pagpapanatili sa maramihan ng רַחֲמִים
  choice: sagana mong habag
  alternative: napakarami mong habag
  rationale: Bagaman morpolohikal na maramihan ang Hebreo, karaniwan itong tumutukoy sa matinding o masaganang habag. Ang kolektibong isahan ay mas natural sa Tagalog, habang ipinahahayag ng “sagana” ang dami o kasidhian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pakiusap na “Sagutin mo ako” at ang likas na pariralang “bumaling ka sa akin.” Walang kuwit bago ang “Yahweh” sa simula dahil natural itong basahin bilang tahasang pagtawag matapos ang sugnay na pautos; nananatiling malinaw ang bokatibo.
