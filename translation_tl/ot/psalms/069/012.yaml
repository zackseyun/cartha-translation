  naturalness: Natural at angkop sa makabagong marangal na Filipino ang "Pinag-uusapan ako" at "pintuang-bayan." Mas malinaw at mas likas ang "paksa ng mga awit" upang ipahayag ang ipinahihiwatig na predikasyon. Ang "nakalalasing na inumin" ay mas malinaw sa Filipino kaysa "matapang na inumin," na maaaring mangahulugang matapang ang lasa at hindi kinakailangang nakalalasing.
