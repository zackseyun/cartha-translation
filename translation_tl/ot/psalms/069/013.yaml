  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: tl
  text: Ngunit ako, sa iyo ang panalangin ko, Yahweh, sa panahong kanais-nais[a]. O Diyos, sa kasaganaan ng iyong tapat na pag-ibig, sagutin mo ako ayon sa katotohanan ng iyong pagliligtas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa panahong kalugod-lugod.” Ang pariralang Hebreo ay tumutukoy sa kanais-nais na panahon para dinggin at kumilos ang Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa katapatan ng iyong pagliligtas.” Ang salitang Hebreo ay maaaring mangahulugang “katotohanan” o “katapatan/pagiging maaasahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Pinananatili nito ang paghahambing o pagsalungat at ang diin ng malayang panghalip sa Hebreo.
- source_word: תְפִלָּתִי לְךָ
  choice: ang panalangin ko ay sa iyo
  rationale: Ang לְךָ ay tumutukoy sa pinatutungkulan ng panalangin; natural at malinaw ito sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עֵת רָצוֹן
  choice: sa panahon ng lingap
  rationale: Ipinahahayag nito ang panahong kanais-nais para dinggin at tugunan ng Diyos ang panalangin, nang hindi nililimitahan ang רָצוֹן sa simpleng pagtanggap lamang.
- source_word: בְּרָב חַסְדֶּךָ
  choice: dahil sa kasaganaan ng iyong tapat na pag-ibig
  rationale: Ang pariralang may בְּ ay maaaring magpahayag ng batayan; ang חֶסֶד ay matibay at maaasahang pag-ibig, kaya ang 'tapat na pag-ibig' ay natural at may sapat na bigat.
- source_word: עֲנֵנִי
  choice: sagutin mo ako
  rationale: Tuwiran at karaniwang pananalita ito para sa pakiusap na tugunin ng Diyos ang nananalangin.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: ayon sa katotohanan ng iyong pagliligtas
  rationale: Pinananatili ng 'katotohanan' ang tuwirang diwa ng אֱמֶת, habang ang 'ayon sa' ay malinaw na naghahayag ng batayan ng pagsagot. Ang posibleng diwang 'katapatan' ay inilalagay sa talababa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi pinapalitan ng titulong 'Panginoon.'
- issue: Diwa ng אֱמֶת kaugnay ng pagliligtas
  choice: katotohanan
  alternative: katapatan o pagiging maaasahan
  rationale: Maaaring mangahulugan ang אֱמֶת ng katotohanan, katapatan, o pagiging maaasahan. Pinananatili sa pangunahing teksto ang 'katotohanan,' at inilalahad sa talababa ang tunay na posibleng alternatibo upang hindi tahimik na lutasin ang kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang em dash upang malinaw na maipakita ang diin sa “ako,” at iniwasan ang masyadong teknikal o denominasyonal na pananalita. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang tinatalakay ng kani-kanilang talababa.
