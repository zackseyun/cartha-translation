  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: tl
  text: "Lumubog ako sa malalim na putikan,\n    at wala akong matuntungan;\nnakarating ako sa kalaliman ng tubig,\n    at inapawan ako ng rumaragasang agos.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “tinangay ako ng agos,” o “nilamon ako ng rumaragasang agos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: Lumubog ako
  rationale: Ang Qal perfect na unang panauhan ay naglalarawan ng naranasang kalagayan ng salmista. Likas sa Filipino ang aspektong perpektibo na “lumubog” at nananatili rito ang malinaw na larawan.
- source_word: בִּיוֵן מְצוּלָה
  choice: sa malalim na putikan
  rationale: Pinagsasama ng parirala ang יוֵן, “putik/putikan,” at מְצוּלָה, “kalaliman o malalim na lugar.” Ang “malalim na putikan” ay natural at pinananatili ang dalawang sangkap ng larawan.
- source_word: וְאֵין מָעֳמָד
  choice: at wala akong matuntungan
  rationale: Ang מָעֳמָד ay lugar o saligang maaaring tayuan. Ang “walang matuntungan” ay karaniwang Filipino at angkop sa larawan ng paglubog sa putikan.
- source_word: בָּאתִי
  choice: napunta ako
  rationale: Ang literal na diwang “dumating/pumasok” ay ipinahahayag nang natural bilang pagkapunta sa isang mapanganib na kalagayan, kasabay ng kilos tungo sa malalim na tubig.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: sa malalim na tubig
  rationale: Ang parirala ay tumutukoy sa kalaliman ng tubig. Ang payak na “malalim na tubig” ay malinaw, natural, at tapat sa imahen.
- source_word: שִׁבֹּלֶת
  choice: rumaragasang agos
  rationale: Maaaring mangahulugan ang salita ng agos, batis, o rumaragasang tubig. Idinagdag ng “rumaragasang” ang mapaminsalang lakas na ipinahihiwatig ng kasunod na pandiwa nang hindi ito ginagawang tiyak na baha.
- source_word: שְׁטָפָתְנִי
  choice: tinabunan ako
  rationale: Ang שטף ay tumutukoy sa pag-apaw, pagragasa, o paglamon ng tubig. Ipinahahayag ng “tinabunan ako” ang pagiging lubusang nadaig ng tubig habang nananatiling konkreto ang larawang pantubig.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paralelismo at matinding larawang patula ng paglubog, kawalan ng matuntungan, at pagragasa ng tubig. Inilagay ang talababa sa hulíng sugnay, kung saan matatagpuan ang tunay na leksikal na pag-aalinlangan sa שִׁבֹּלֶת שְׁטָפָתְנִי.
