  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: tl
  text: Nakakita ang mga mapagpakumbaba[a] at nagagalak sila; kayong humahanap sa Diyos, mabuhay nawa ang inyong puso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga api” o “mga maamo.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong “mabuhay ang inyong puso” ay isang idyoma para sa panibagong tapang, sigla, o pag-asa.
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: Nakakita
  rationale: Ang Qal perfect na 3cp ng ראה ay isinaling aspektong naganap. Hindi nagdagdag ng tuwirang layon na wala sa Hebreo.
- source_word: עֲנָוִים
  choice: ang mga mapagpakumbaba
  rationale: Saklaw ng עֲנָוִים ang mga mapagpakumbaba o maamo at maaari ring tumukoy sa mga api o dukha. Pinananatili ng salin ang pangunahing moral at espirituwal na diwa habang inilalagay sa talababa ang mahalagang alternatibo.
- source_word: יִשְׂמָחוּ
  choice: nagagalak
  rationale: Ang imperfect na 3mp ng שמח ay maaaring magpahayag ng kasalukuyan o nalalapit na tugon. Ang aspektong nagaganap ay likas sa Filipino at hindi labis na nagtatakda ng panahunan.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: kayong humahanap sa Diyos
  rationale: Ang participial construct ay inuunawang panawagan dahil sinusundan ito ng panghalip na tumutukoy sa maramihang kausap. Ang tuwirang pagtawag ay malinaw at natural sa Filipino.
- source_word: וִיחִי לְבַבְכֶם
  choice: mabuhay nawa ang inyong puso
  rationale: Pinananatili ang jussive na himig at ang kolektibong isahang 'puso' na may maramihang nagmamay-ari. Ipinaliliwanag sa talababa ang idyomatikong kahulugan nito.
