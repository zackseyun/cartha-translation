translation_notes:
  register: Makabago at marangal na Filipino na angkop sa panulaang biblikal. Pinanatili ang kawalan ng tahasang layon ng “nakakita,” ang tuwirang panawagan sa mga humahanap sa Diyos, at ang larawang “mabuhay ang inyong puso” sa halip na palitan agad ng mas interpretibong “lakasan ninyo ang inyong loob.”
