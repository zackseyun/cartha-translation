base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: tl
  text: Sapagkat nilamon ako ng sigasig para sa iyong bahay[a], at ang mga panlalait ng mga nanlalait sa iyo ay bumagsak sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inubos ako ng sigasig para sa iyong bahay.” Sa literal, “kinain ako.”
    reason: lexical_alternative
  - marker: b
    text: Ang unang bahagi ng talatang ito ay sinipi sa Juan 2:17 tungkol kay Jesus. Tingnan din ang Roma 15:3 para sa ikalawang bahagi.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng kalagayan ng mang-aawit at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: קִנְאַת
  choice: malasakit
  rationale: Sa pariralang ito, tumutukoy ito sa marubdob na debosyon at pagmamalasakit, hindi sa inggit; natural ang “malasakit sa iyong bahay” sa makabagong Filipino.
- source_word: בֵּיתְךָ
  choice: iyong bahay
  rationale: Pinananatili ang literal na “bahay” at hindi nililimitahan sa “templo,” bagaman maaaring ang santuwaryo ang tinutukoy.
- source_word: אֲכָלָתְנִי
  choice: nilamon ako
  rationale: Malapit ito sa matinding larawan ng Hebreong “kinain ako” at likas ding matalinghaga sa Filipino para sa lubusang pagsakop o pag-ubos.
- source_word: וְחֶרְפּוֹת
  choice: at ... ang mga paghamak
  rationale: Sinasaklaw ng “paghamak” ang panlalait at pagdudulot ng kahihiyan, at naiuugnay ito sa kasunod na pandiwaring mula sa parehong ugat.
- source_word: חֹרְפֶיךָ
  choice: mga humahamak sa iyo
  rationale: Natural na tumutukoy sa mga taong paulit-ulit o kinagawiang humahamak sa Diyos, habang pinananatili ang pag-uulit ng salitang-ugat.
- source_word: נָפְלוּ עָלַי
  choice: sa akin bumagsak
  rationale: Pinananatili ang konkretong larawang ang paghamak na nakatuon sa Diyos ay bumagsak o napunta sa mang-aawit.
theological_decisions:
- issue: Mesiyanikong at kanonikal na kaugnayan ng talata
  choice: Isinalin ang talata ayon sa tuwirang tinig ng mang-aawit, nang hindi nagdaragdag ng tahasang kristolohikal na paliwanag sa pangunahing teksto.
  alternative: Isalin ang pangunahing teksto sa paraang tahasang tumutukoy kay Jesus batay sa paggamit nito sa Bagong Tipan.
  rationale: Ang tekstong Hebreo ay nagsasalita sa tinig ng mang-aawit. Ang aplikasyon kay Jesus sa Juan 2:17 ay mahalagang kanonikal na kaugnayan ngunit nararapat ilagay sa talababa, hindi ipasok sa mismong salin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang masinsing larawang “nilamon ako” upang mapanatili ang lakas ng Hebreo; ang ayos na “sa akin bumagsak” ay bahagyang patula ngunit malinaw. Ang “bahay” ay sadyang pinanatili sa halip na “templo” upang hindi labis na tukuyin ang saklaw ng בַּיִת.
