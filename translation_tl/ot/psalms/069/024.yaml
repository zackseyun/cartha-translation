base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: tl
  text: Ibuhos mo sa kanila ang iyong poot[a], at hayaang abutan sila ng nag-aalab mong galit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matinding galit.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang alab ng iyong ilong”; Hebreong idyoma ito para sa matinding galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  choice: Ibuhos mo
  rationale: Tuwirang pautos na nagpapanatili sa matingkad na larawan ng pagbubuhos ng galit bilang hatol.
- source_word: עֲלֵיהֶם
  choice: sa kanila
  rationale: Natural sa modernong Tagalog at malinaw na sila ang pinatutungkulan ng ibinubuhos na poot.
- source_word: זַעְמֶךָ
  choice: ang iyong poot
  rationale: Ang “poot” ay dignified at malinaw na salita para sa matinding galit na may bigat ng paghatol; iniiwasan din nitong ulitin lamang ang “galit” sa kasunod na parirala.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: ng nag-aalab mong galit
  rationale: Ipinananatili ng “nag-aalab” ang metapora ng init sa idyomang Hebreo, habang natural at madaling maunawaan sa Tagalog.
- source_word: יַשִּׂיגֵם
  choice: abutan sila
  rationale: Ipinahihiwatig ng pandiwa ang galit na humahabol at sumasapit sa mga pinatutungkulan nito; mas angkop dito ang “abutan” kaysa sa payak na “umabot.”
theological_decisions:
- issue: Tuwirang panalangin para sa paghatol sa mga kaaway
  choice: Pinanatili ang tahasang kahilingang ibuhos ng Diyos ang kanyang poot at abutan sila ng kanyang galit.
  alternative: Palambutin bilang “ipakita mo sa kanila ang iyong pagkayamot.”
  rationale: Tahasang humihiling ng banal na paghatol ang Hebreo. Hindi dapat pahupain ng salin ang lakas o alisin ang tensiyong teolohikal ng panalanging ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang matinding pananalita at ang metapora ng nag-aalab na galit nang hindi ginagawang arkaiko o denominasyonal ang salin.
