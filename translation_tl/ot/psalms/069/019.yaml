  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: tl
  text: Alam mo ang paghamak sa akin, ang aking kahihiyan at pagkapahiya; nasa harapan mo ang lahat ng aking mga kaaway.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Alam mo
  rationale: Ang Qal perfect na tumutukoy sa kausap na panlalaking isahan ay nakatuon sa Diyos. Bilang pandiwang nagsasaad ng kalagayan, likas na ipinapahayag sa kasalukuyang panahunan sa Filipino ang ganap at patuloy na kaalaman ng Diyos.
- source_word: חֶרְפָּתִי
  choice: ang paghamak sa akin
  rationale: Ang חֶרְפָּה ay tumutukoy sa paghamak, panlalait, o kasiraang-puring dinaranas ng isang tao. Mas malinaw sa karaniwang Filipino ang “paghamak sa akin” kaysa sa literal ngunit di-likas na “aking paghamak,” na maaaring mapagkamalang paghamak na siya mismo ang gumagawa.
- source_word: בָשְׁתִּי
  choice: ang aking kahihiyan
  rationale: Direktang ipinahahayag ng בֹּשֶׁת ang kahihiyan o kawalang-dangal. Ang “kahihiyan” ang pinakanatural at sapat na matibay na katumbas sa modernong Filipino.
- source_word: כְלִמָּתִי
  choice: pagkapahiya
  rationale: Ang כְּלִמָּה ay malapit sa kahihiyan ngunit maaaring magdiin sa hayag na paglapastangan o pagpapahiya. Pinananatili ng “pagkapahiya” ang sunod-sunod na magkakalapit ngunit hindi ganap na magkaparehong diwa ng taludtod.
- source_word: נֶגְדְּךָ
  choice: nasa harapan mo
  rationale: Ang נֶגֶד na may hulaping panghalip ay nangangahulugang nasa harap o lantad sa presensiya ng kausap. Likas at marangal sa Filipino ang “nasa harapan mo,” at ipinahihiwatig na nakikita at kilala ng Diyos ang mga kaaway.
- source_word: כָּל
  choice: lahat
  rationale: Malinaw na kolektibong panaklaw ang כָּל; “lahat” ang natural na katumbas bago ang pangmaramihang pangngalan.
- source_word: צוֹרְרָי
  choice: aking mga kaaway
  rationale: Mula sa ugat na צרר, tumutukoy ito sa mga taong kumakalaban o napopoot sa nagsasalita. Ang “mga kaaway” ay malinaw, natural, at nagpapanatili sa aktuwal na pagkapoot na ipinahihiwatig ng salita.
