translation_notes:
  register: Makabagong Filipino na marangal at angkop sa panalangin at tula. Pinanatili ang tatlong magkakalapit na larawan—paghamak, kahihiyan, at pagkapahiya—nang hindi lubusang pinagsasanib ang mga ito. Walang footnote dahil walang matibay na tekstuwal o leksikal na kalabuan sa taludtod na nangangailangan nito; ang footnote sa English consultation layer ay hindi tumutugma sa marker at hindi sinusuportahan ng anyo ng tekstong Hebreo.
