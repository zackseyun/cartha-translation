translation:
  language: tl
  text: 'Magdagdag ka ng kasamaan sa kanilang kasamaan,[a]

    at huwag mo silang hayaang makapasok sa iyong katuwiran.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring mangahulugang “kasamaan,” “sala,” o ang bunga o parusa ng sala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa iyong katarungan.” Maaaring tumukoy ang Hebreo sa katuwiran o katarungan ng Diyos, kabilang ang kanyang matuwid o nagliligtas na pagkilos.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Dagdagan mo
  rationale: Ang pautos na anyo ng נתן ay literal na “ibigay/ilagay,” ngunit sa pariralang עָוֺן עַל עֲוֺנָם ay likas na nagpapahayag ng pagdaragdag ng isang kasamaan sa nauna.
- source_word: עָוֺן עַל עֲוֺנָם
  choice: ng kasamaan ang kanilang kasamaan
  rationale: Pinananatili ang pag-uulit ng iisang salitang Hebreo at ang diwa ng naiipong kasamaan. Ang עָוֺן ay maaari ring tumukoy sa sala o sa bunga/parusa ng sala, kaya itinala ang saklaw na ito sa talababa.
- source_word: וְאַל יָבֹאוּ
  choice: at huwag mo silang hayaang makapasok
  rationale: Ang אַל na sinusundan ng imperfect ay negatibong pakiusap o hangarin na nakatuon sa Diyos. Likas sa Tagalog ang “huwag mo silang hayaang,” at pinananatili ng “makapasok” ang larawan ng pagpasok.
- source_word: בְּצִדְקָתֶךָ
  choice: sa iyong katuwiran
  rationale: Ang צְדָקָה ay may malawak na saklaw na kinabibilangan ng katuwiran, katarungan, at matuwid o mapagligtas na pagkilos ng Diyos. Hindi ito pinakipot sa iisang pakahulugan.
theological_decisions:
- issue: Kahulugan ng “iyong katuwiran” sa konteksto ng sumpang panalangin
  choice: iyong katuwiran
  alternative: iyong katarungan
  rationale: Pinananatili ng “katuwiran” ang malawak at teolohikal na tensiyon ng Hebreo nang hindi ito nililimitahan sa pagpapawalang-sala, pabor, o paghahatol lamang. Ibinibigay sa talababa ang posibleng diin sa katarungan o matuwid na pagkilos ng Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang tuwirang pananalangin sa Diyos, ang pag-uulit ng “kasamaan,” at ang hindi tiyak na saklaw ng “katuwiran.”
