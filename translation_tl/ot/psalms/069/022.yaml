  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: tl
  text: 'Maging bitag sa harap nila ang kanilang hapag,

    at maging silo ang kanilang katiwasayan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at maging silo ang kanilang mga handog pangkapayapaan.” Maaari ring tumukoy ang salitang Hebreo sa kapayapaan, katiwasayan, o mabuting kalagayan.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Maging
  rationale: Ang anyong jussive ng היה ay nagpapahayag ng isang sumpang kahilingan; likas at tuwirang naihahatid ito ng “Maging” sa Filipino.
- source_word: שֻׁלְחָנָם
  choice: ang kanilang hapag
  rationale: Pinananatili ang konkretong larawan ng שֻׁלְחָן bilang hapag, na maaaring kumatawan sa pagkain, kasaganaan, o pakikisalo.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Tuwirang inilalarawan ang bagay na nakahain sa kanilang harapan at, sa kabalintunaan, nagiging panganib sa kanila.
- source_word: לְפָח
  choice: bitag
  rationale: Ang פח ay bitag o silo. Ginamit ang “bitag” upang maiba nang bahagya sa katambal na מוֹקֵשׁ at mapanatili ang makatang paralelismo.
- source_word: וְלִשְׁלוֹמִים
  choice: ang kanilang katiwasayan
  rationale: Maaaring tumukoy ang mahirap na anyong שְׁלוֹמִים sa kalagayan ng kapayapaan, kaligtasan, o mabuting kalagayan. Ang “katiwasayan” ay natural sa Filipino at pinananatili ang ironiyang ang inaasahang ligtas na kalagayan ay nagiging panganib. Inilagay sa talababa ang posibleng sakripisyal na diwa.
- source_word: לְמוֹקֵשׁ
  choice: maging silo
  rationale: Karaniwang tumutukoy ang מוֹקֵשׁ sa silo. Ang pandiwang “maging” ay inuulit upang malinaw na dalhin sa ikalawang hanay ang puwersa ng jussive.
theological_decisions:
- issue: Kahulugan ng שְׁלוֹמִים sa konteksto ng sumpang kahilingan
  choice: Isinalin sa pangunahing teksto bilang “kanilang katiwasayan.”
  alternative: “kanilang mga handog pangkapayapaan”
  rationale: 'Pinahihintulutan ng konteksto ang abstraktong diwa ng kapayapaan, kaligtasan, o mabuting kalagayan, samantalang maaari ring marinig sa salita ang teknikal na diwa ng mga handog pangkapayapaan. Hindi tiyak ang pagbasa, kaya hindi tahimik na nilutas ang tensiyon: ginamit ang mas maayos na abstraktong pagbasa sa teksto at pinanatili ang sakripisyal na pagbasa sa talababa.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang konkretong “hapag,” ang maikli at matinding anyo ng sumpang kahilingan, at ang dalawang magkaugnay na larawang “bitag” at “silo.”
