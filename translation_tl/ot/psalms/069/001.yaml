  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: tl
  text: Iligtas mo ako, O Diyos, sapagkat umabot na sa aking leeg[a] ang tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hanggang sa aking nefesh.” Ang salitang Hebreo na nefesh ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa,” at sa ganitong larawan ng pagkalunod ay maaari ring tumukoy sa lalamunan o leeg.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Iligtas mo ako
  rationale: Ang Hiphil na pautos ng ישׁע na may hulaping unang panauhan ay isang tuwirang pagsusumamo para sa pagliligtas. Likas at malinaw sa makabagong Tagalog ang “Iligtas mo ako,” at angkop ito sa larawan ng nalalapit na pagkalunod.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ginagamit ito bilang tuwirang pagtawag sa Diyos. Pinananatili ng “O Diyos” ang marangal at apurahang himig ng panalangin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagsusumamo. Ang “sapagkat” ay malinaw at angkop sa marangal na estilong patula.
- source_word: בָאוּ
  choice: umabot na
  rationale: Literal na “dumating,” ngunit sa kasunod na larawan ng tubig at leeg, likas sa Tagalog ang “umabot na.” Ipinahihiwatig ng “na” na naroon na ang matinding panganib nang hindi nagdaragdag ng di-hayag na detalye.
- source_word: מַיִם
  choice: ang tubig
  rationale: Bagaman maramihan ang anyong Hebreo, karaniwang pangngalang di-mabilang ang “tubig” sa Tagalog. Hindi ginamit ang “baha” upang maiwasang magdagdag ng espesipikong kahulugang wala sa teksto.
- source_word: עַד נָפֶשׁ
  choice: sa aking leeg
  rationale: Malawak ang saklaw ng נֶפֶשׁ—kabilang ang buhay, sarili, at sa ganitong konteksto ang lalamunan o leeg. Sa larawan ng pagkalunod, malinaw na naihahatid ng “sa aking leeg” ang pisikal at agarang panganib; itinatala sa talababa ang mas literal at mas malawak na saklaw ng salita.
theological_decisions:
- issue: Pagpapakahulugan sa נֶפֶשׁ sa patulang larawan ng matinding panganib
  choice: Konkretong kahulugang “leeg” sa larawan ng pagkalunod
  alternative: “kaluluwa” o “buhay”
  rationale: Hindi pangunahing nagtuturo ang talata tungkol sa likas ng kaluluwa; inilalarawan nito ang isang taong halos lamunin ng tubig. Pinananatili ng talababa ang literal na anyo at lawak ng kahulugan upang hindi tuluyang isara ang eksistensiyal na diin ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panalangin at tula. Ginamit ang “sapagkat” at “O Diyos” upang mapanatili ang mataas ngunit madaling maunawaang rehistro; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
