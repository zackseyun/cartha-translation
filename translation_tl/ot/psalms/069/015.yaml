  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: tl
  text: 'Huwag akong tangayin ng rumaragasang tubig[a],

    at huwag akong lamunin ng kalaliman,

    at huwag magsara sa ibabaw ko ang bibig ng hukay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “agos ng tubig” o “daluyong ng tubig.”
    reason: lexical_alternative
  - marker: b
    text: O “balon.” Karaniwang maaaring mangahulugan ng “balon” ang salitang Hebreo, ngunit sa patulang larawang ito ay isang nakamamatay na hukay ang ipinahihiwatig.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: tangayin
  rationale: Ipinahihiwatig ng pandiwang שטף ang pag-apaw o rumaragasang tubig na ganap na dumadala sa isang tao; natural at matingkad sa modernong Tagalog ang “tangayin.”
- source_word: שִׁבֹּלֶת מַיִם
  choice: rumaragasang tubig
  rationale: Maaaring tumukoy ang שִׁבֹּלֶת sa agos, daluyong, o baha. Ipinapahayag ng “rumaragasang tubig” ang malakas at mapanganib na galaw nang hindi masyadong nililimitahan ang larawan.
- source_word: תִּבְלָעֵנִי
  choice: lamunin
  rationale: Tuwirang pinananatili ng “lamunin” ang personipikasyon at ang diwa ng ganap na paglubog o pagkapuksa.
- source_word: מְצוּלָה
  choice: kalaliman
  rationale: Ang salita ay tumutukoy sa kailaliman, lalo na ng malalim na tubig. Maikli, marangal, at patula ang “kalaliman,” at umaayon ito sa larawang lumalamon.
- source_word: תֶּאְטַר
  choice: magsara
  rationale: Ang pandiwa ay nangangahulugang magsara o magkulob. Natural na katambal ng “bibig” ang “magsara” at pinananatili nito ang larawan ng pagkakakulong sa ilalim.
- source_word: בְּאֵר
  choice: hukay
  rationale: Karaniwang nangangahulugang “balon” ang בְּאֵר, ngunit sa konteksto ng panganib at kamatayan, ipinahahayag ng “hukay” ang nagbabantang butas habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: פִּיהָ
  choice: bibig ng hukay
  rationale: Pinananatili ng “bibig” ang tahasang personipikasyon sa Hebreo; inuulit ang tinutukoy sa halip na gumamit ng malabong panghalip.
- source_word: עָלַי
  choice: sa ibabaw ko
  rationale: Ipinakikita nito na nagsasara ang bunganga ng hukay sa itaas ng nagsasalita, gaya ng ipinahihiwatig ng Hebreong pang-ukol.
