  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: tl
  text: Mas marami pa kaysa sa mga buhok sa aking ulo ang mga napopoot sa akin nang walang dahilan; makapangyarihan ang mga naglalayong puksain ako, ang mga kaaway kong sinungaling[a]. Ang hindi ko ninakaw, iyon pa ang kailangan kong isauli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga kaaway kong walang batayan” o “mga kaaway kong mapanlinlang.” Maaaring ilarawan ng Hebreo ang mga kaaway bilang sinungaling o mapanlinlang, o ipahiwatig na mali at walang batayan ang kanilang pagkapoot sa mang-aawit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “saka ko isinasauli.” Maaaring ang diwa ay pinipilit ang mang-aawit na isauli o bayaran ang hindi naman niya ninakaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Mas marami pa kaysa sa mga buhok sa aking ulo
  rationale: Ipinahahayag ng רַבּוּ at ng pahambing na מִן ang labis na dami; natural sa Filipino ang ganitong ayos at nananatili ang makatang pagmamalabis.
- source_word: שֹׂנְאַי חִנָּם
  choice: ang mga napopoot sa akin nang walang dahilan
  rationale: Ang חִנָּם ay tumutukoy sa kawalan ng dahilan o katuwiran, hindi lamang sa pagiging walang bayad.
- source_word: עָצְמוּ
  choice: makapangyarihan
  rationale: Ipinahihiwatig ng pandiwa ang pagiging malakas o makapangyarihan ng mga kaaway bilang tunay na banta.
- source_word: מַצְמִיתַי
  choice: ang mga nagnanais na lipulin ako
  rationale: Ang participle ay tumutukoy sa mga taong naglalayong wasakin o tuluyang ipahamak ang nagsasalita.
- source_word: אֹיְבַי שֶׁקֶר
  choice: ang mga kaaway kong sumasalungat sa akin sa kasinungalingan
  rationale: Pinananatili nito ang posibilidad na ang שֶׁקֶר ay tumutukoy sa huwad o walang-batayang pagkontra, sa halip na basta bansagang likas na sinungaling ang mga kaaway.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: Ang hindi ko ninakaw
  rationale: Bagaman maaaring tumukoy ang גזל sa sapilitang pag-agaw o pandarambong, ang “ninakaw” ang malinaw at karaniwang katumbas sa modernong Filipino.
- source_word: אָז אָשִׁיב
  choice: iyon pa ang kailangan kong isauli
  rationale: Literal na “saka/niyon ay isasauli ko”; ipinahihiwatig ng konteksto ang sapilitang pagbabayad-pinsala para sa bagay na hindi ninakaw. Nililinaw ng “kailangan” ang implikasyong ito habang itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Ang ugnayan ng שֶׁקֶר sa “mga kaaway”
  choice: mga kaaway kong sumasalungat sa akin sa kasinungalingan
  alternative: mga sinungaling kong kaaway; mga kaaway kong walang batayan
  rationale: Maaaring ilarawan ng parirala ang mga kaaway bilang mapanlinlang o ang kanilang pagkapoot bilang mali at walang batayan. Ang salin at talababa ay nagpapanatili sa tunay na kalabuan.
- issue: Ang huling sugnay bilang sapilitang pagsasauli sa kabila ng kawalang-sala
  choice: Ang hindi ko ninakaw, iyon pa ang kailangan kong isauli.
  alternative: Ang hindi ko ninakaw, saka ko isinasauli.
  rationale: Inilalarawan ng konteksto ang di-makatarungang pagdurusa at maling paratang. Ang “kailangan” ay nagpapahayag ng ipinahiwatig na pamimilit, ngunit hindi nagdaragdag ng natatanging doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at makata ngunit madaling maunawaan. Ginamit ang “napopoot,” “lipulin,” at “isauli” upang mapanatili ang tindi at himig ng panaghoy nang hindi nagiging lipas o teknikal.
