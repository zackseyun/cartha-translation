  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: tl
  text: Mamanahin ito ng salinlahi ng kanyang mga lingkod,[a][b] at maninirahan dito ang mga umiibig sa kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo” sa halip na “salinlahi.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ito” at “dito” ay malamang na tumutukoy sa Sion, ang muling itinayong lungsod sa naunang konteksto; maaari rin itong unawain nang mas malawak bilang lupain o Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: salinlahi
  rationale: Kolektibong tumutukoy sa mga inapo o susunod na henerasyon. Likas sa makabagong Filipino ang “salinlahi” at napapanatili nito ang kolektibong diwa ng Hebreo.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa kontekstong debosyonal at tipanan ng salmo, ang “mga lingkod” ang angkop at marangal na salin nang hindi labis na itinatampok ang institusyon ng pagkaalipin.
- source_word: יִנְחָלוּהָ
  choice: Mamanahin ito
  rationale: Pinananatili ng “mamanahin” ang kahulugan ng pagtanggap bilang mana at ang aspektong panghinaharap. Ang “ito” ay kumakatawan sa pambabaeng hulaping panghalip ng Hebreo.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: mga umiibig sa kanyang pangalan
  rationale: Pinananatili ang biblikal na idyoma ng pag-ibig sa pangalan ng Diyos sa halip na ipakahulugan lamang na pag-ibig sa kanya.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: maninirahan dito
  rationale: Ang “maninirahan” ay natural sa kasalukuyang Filipino at nagpapahayag ng matatag na paninirahan. Ang “dito” ay tumutukoy sa parehong lugar na tinutukoy ng pambabaeng hulaping panghalip.
theological_decisions:
- issue: Tinutukoy ng mga pambabaeng hulaping panghalip sa “mamanahin ito” at “maninirahan dito”
  choice: Ang Sion o ang muling itinayong lungsod sa naunang konteksto
  alternative: Ang lupain sa mas malawak na diwa, o ang Jerusalem
  rationale: Binabanggit sa agarang konteksto ang pagliligtas ng Diyos sa Sion at muling pagtatayo sa mga lungsod ng Juda. Gayunman, hindi tahasang inuulit ng talata ang pangngalan, kaya pinananatili sa pangunahing teksto ang panghalip at ipinaliliwanag ang posibleng tinutukoy nito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” para sa kolektibong זֶרַע at “maninirahan” para sa likas na pagpapahayag ng permanenteng paninirahan. Inilagay ang mga pananda ng talababa kaagad matapos ang pariralang may kaugnayan sa parehong leksikal na alternatibo at referent.
