  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: tl
  text: Mabura nawa sila mula sa aklat ng buhay[a], at huwag silang maisulat kasama ng mga matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat ng mga nabubuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: Pawiin sila
  rationale: Ang Nifal na anyong jussive ng מחה ay nagpapahayag dito ng pakiusap o sumpang panalangin sa balintiyak na diwa. Likas sa Filipino ang “pawiin sila,” at kaayon ito ng larawang may kinalaman sa nakasulat na talaan.
- source_word: מִסֵּפֶר
  choice: sa aklat
  rationale: Ang סֵפֶר ay maaaring aklat, balumbon, o nakasulat na tala. Ang “aklat” ang pinakanatural sa pariralang “aklat ng buhay”; ang מִן ay naipahihiwatig ng pandiwang “pawiin … sa.”
- source_word: חַיִּים
  choice: ng buhay
  rationale: Maaaring mangahulugan ang חַיִּים ng “buhay” o “mga nabubuhay.” Pinananatili ng “ng buhay” ang pamilyar ngunit hindi nililimitahang talinghaga; inilalagay sa talababa ang leksikal na alternatibo.
- source_word: וְעִם
  choice: at … kasama ng
  rationale: Ang עִם ay literal na “kasama ng.” Ang pagkakalagay ng “kasama ng” sa hulihan ng sugnay ay natural sa Filipino at pinananatili ang ugnayan sa mga matuwid.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Ang “mga matuwid” ay malinaw at karaniwang salin ng pangmaramihang substantibong צַדִּיקִים nang hindi nagdaragdag ng tiyak na doktrinal na pakahulugan.
- source_word: אַל יִכָּתֵבוּ
  choice: huwag silang itala
  rationale: Ang אַל kasama ng imperfect ay negatibong jussive. Ang “huwag silang itala” ay natural na pakiusap sa Filipino at ipinahahayag ang diwang maisama ang pangalan sa isang nakasulat na rehistro.
theological_decisions:
- issue: Kahulugan ng “aklat ng buhay” sa isang sumpang panalangin
  choice: Panatilihin ang talinghagang “aklat ng buhay” nang hindi tinutukoy kung ito ay talaan ng mga nabubuhay, pagiging kabilang sa bayan ng tipan, o pangwakas na kaligtasan.
  alternative: Isalin nang tuwiran bilang “talaan ng mga nabubuhay” o ipakahulugan bilang aklat ng pangwakas na kaligtasan.
  rationale: Hindi sapilitang nilulutas ng Hebreo ang saklaw ng talinghaga. Ang literal at natural na parirala ay nagpapanatili sa tunay na teolohikal na tensiyon.
- issue: Lakas ng sumpang panalangin
  choice: 'Isalin bilang pakiusap o hangarin: “Pawiin sila … huwag silang itala.”'
  alternative: 'Isalin bilang prediksiyon: “Papawiin sila … hindi sila itatala.”'
  rationale: Sa konteksto, jussive ang gamit ng mga pandiwa at bahagi ito ng magkakasunod na sumpang panalangin, hindi simpleng pahayag ng mangyayari.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pawiin” upang mapanatili ang matinding pakiusap at ang larawan ng pagbura sa isang aklat; ginamit ang “itala” sa ikalawang sugnay upang maging natural ang diwa ng pagsusulat ng pangalan sa isang rehistro.
