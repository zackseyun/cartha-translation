translation:
  language: tl
  text: 'Para sa tagapanguna ng mga mang-aawit: ayon sa “Mga Liryo”[a]. Kay David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa himig ng ‘Mga Liryo’”; malamang na pangalan ito ng isang himig o estilong pangmusika.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong “Kay David” ay maaaring magpahiwatig ng pagkatha, pag-aalay, o kaugnayan; hindi nito tiyak na nasasagot kung sino ang may-akda.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Sa mga pamagat ng Awit, ito ay tagubiling pangmusika o panliturhiya para sa namumuno sa pagtatanghal. Malinaw at likas sa modernong Filipino ang parirala nang hindi nililimitahan ang tungkulin sa mas teknikal na katawagan.
- source_word: עַל
  choice: ayon sa
  rationale: Sa kontekstong pangmusika, maaaring ipakilala ng עַל ang himig, estilo, o paraan ng pagtatanghal. Pinananatili ng “ayon sa” ang lawak na ito nang hindi tiyak na ipinapalagay na pangalan lamang ito ng himig.
- source_word: שׁוֹשַׁנִּים
  choice: “Mga Liryo”
  rationale: Literal itong nangangahulugang “mga liryo,” ngunit sa pamagat ay malamang na pamagat ng isang himig o estilong pangmusika. Ipinahihiwatig ng panipi ang ganitong gamit habang isinasalin pa rin ang salita.
- source_word: לְדָוִד
  choice: Kay David
  rationale: Malawak ang kahulugan ng לְ sa mga pamagat ng Awit at maaaring tumukoy sa pagkatha, pag-aalay, pag-uukol, o kaugnayan. Mas pinananatili ng “Kay David” ang kalabuan kaysa sa “Ni David,” na mas tuwirang nagpapahayag ng pagkatha.
theological_decisions:
- issue: Kaugnayan ni David sa awit
  choice: Kay David
  alternative: Ni David
  rationale: Hindi sapat ang pariralang Hebreo lamang upang tiyaking si David ang may-akda; pinananatili ng salin ang posibleng pagkatha, pag-uukol, o kaugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang panipi upang ipakitang malamang na pamagat pangmusika ang “Mga Liryo,” at iniwasan ang “Ni David” upang huwag alisin ang tunay na kalabuan ng Hebreo.
