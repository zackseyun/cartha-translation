  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: tl
  text: Nagpapatuloy sila, palakas nang palakas[a]; bawat isa ay humaharap sa Diyos sa Sion.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa pangkat tungo sa pangkat” o “mula sa tagumpay tungo sa tagumpay.” Ang salitang Hebreo para sa “lakas” ay maaari ring tumukoy sa tapang, puwersa, o hukbo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagpapakita sa Diyos.” Sa konteksto, malamang na nangangahulugan itong humaharap ang bawat isa sa Diyos sa pagsamba; maaari rin itong basahing “bawat isa ay nakikita ng Diyos sa Sion.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: Nagpapatuloy sila
  rationale: Ang Qal imperfect na maramihan ng הלך ay nagsasaad ng nagpapatuloy na pagkilos. Likas sa makabagong Tagalog ang “nagpapatuloy” sa konteksto ng paglalakbay at hindi nito labis na tinutukoy kung naglalakad o gumagamit ng ibang paraan.
- source_word: מֵחַיִל אֶל חָיִל
  choice: palakas nang palakas
  rationale: Malawak ang kahulugan ng חַיִל—kabilang ang lakas, tapang, hukbo, at tagumpay. Sa konteksto ng paglalakbay patungo sa pagsamba, natural na ipinahahayag ng “palakas nang palakas” ang patuloy o panibagong kalakasan habang sumusulong sila, habang inilalagay sa talababa ang tunay na mga alternatibong leksikal.
- source_word: יֵרָאֶה
  choice: humaharap
  rationale: Ang Niphal imperfect na isahan ng ראה ay maaaring tumukoy sa pagpapakita o pagharap ng isang tao sa konteksto ng pagsamba. Mas natural sa Tagalog ang “humaharap” kaysa sa literal ngunit alanganing “nagpapakita,” at hindi nito kailangang idagdag ang layunin ng pagsamba sa mismong talata.
- source_word: אֶל אֱלֹהִים
  choice: sa Diyos
  rationale: Bagaman literal na “tungo sa Diyos,” kasama ng pandiwang יֵרָאֶה ay ipinahahayag nito ang pagharap sa Diyos. Pinananatili ng “sa Diyos” ang direksiyon ng pariralang Hebreo sa natural na Tagalog.
- source_word: בְצִיּוֹן
  choice: sa Sion
  rationale: Ang pangalang pantangi ay isinalin sa nakaugaliang anyong Tagalog na “Sion.” Ang “sa” ay angkop para sa lokasyon ng santuwaryo.
- source_word: יֵרָאֶה (isahan sa kontekstong maramihan)
  choice: bawat isa ay humaharap
  rationale: Isahan ang pandiwa bagaman maramihan ang naunang simuno. Malinaw na pinananatili ng “bawat isa” ang distributibong bisa ng isahang pandiwa nang hindi ito pinapantay sa karaniwang maramihan.
theological_decisions:
- issue: Idyomatikong kahulugan ng pagharap sa Diyos
  choice: Inilalarawan ang bawat manlalakbay na humaharap sa Diyos sa Sion.
  alternative: Maaari itong unawain nang mas pasibo bilang “bawat isa ay nakikita ng Diyos sa Sion.”
  rationale: Sa mga konteksto ng peregrinasyon at pagsamba, ang Niphal ng ראה ay maaaring mangahulugang magpakita o humarap sa Diyos. Gayunman, dahil posible ang mas pasibong pagbasa, itinatala iyon sa talababa sa halip na ikubli ang tunay na tensiyong panggramatika.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “palakas nang palakas” ay mas natural kaysa sa mekanikal na “mula sa lakas tungo sa lakas,” samantalang pinananatili sa talababa ang lawak ng חַיִל. Ang “humaharap” ay angkop sa karaniwang wika ng pagharap sa Diyos ngunit hindi nagdaragdag ng denominasyonal na paliwanag.
