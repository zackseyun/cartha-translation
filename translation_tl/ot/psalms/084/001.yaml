  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: tl
  text: Kay kaibig-ibig ng iyong mga tahanan[a], O Yahweh ng mga hukbo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kay mahal ang iyong mga tahanan”; o “Kay kaaya-aya ng iyong mga tahanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Kay
  rationale: Ginamit ang “Kay” upang ipahayag ang padamdam na diwa ng מַה sa likas at makatang Filipino, sa halip na gawing tanong.
- source_word: יְּדִידוֹת
  choice: kaibig-ibig
  rationale: Saklaw ng “kaibig-ibig” ang ganda, pagiging kaaya-aya, at pagiging mahal sa nagsasalita; pinananatili nito ang masidhing damdamin ng salmo nang hindi nililimitahan sa panlabas na kagandahan.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: iyong mga tahanan
  rationale: Pinananatili ng “mga tahanan” ang anyong maramihan at ang pangunahing diwa ng lugar na tinitirhan. Hindi ginamit ang “tabernakulo” upang hindi ito ipakahulugan lamang bilang tolda ni Moises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalan sa tekstong Hebreo sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Ang “mga hukbo” ay malinaw at malawak na katumbas ng צְבָאוֹת sa titulong banal; hindi nito ipinapasya sa talata kung makalangit, panlupa, o kosmikong mga hukbo ang tinutukoy.
theological_decisions:
- issue: Paglalarawan sa mga tahanan ng Diyos
  choice: kaibig-ibig
  alternative: mahal; kaaya-aya
  rationale: Pinananatili ng salin ang puwang sa pagitan ng pagiging minamahal at pagiging kaaya-aya, sa halip na ipasiya na pisikal na kagandahan lamang ang ibig sabihin.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Dahil personal na pangalan ang nasa tekstong Hebreo, pinanatili ito bilang “Yahweh” at hindi pinalitan ng titulong “PANGINOON.”
- issue: Saklaw ng titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  alternative: Yahweh ng mga hukbong sandatahan
  rationale: Ang “mga hukbo” ay nagpapanatili sa malawak at bahagyang di-tiyak na saklaw ng Hebreo; ang mas tiyak na “hukbong sandatahan” ay maaaring magpakitid sa kahulugan.
translation_notes:
  register: Makatula ngunit madaling maunawaan ang “Kay kaibig-ibig,” at ang “O” ay nagpapanatili sa marangal na tuwirang pagtawag. Pinanatili ang maramihang “mga tahanan” at ang padamdam na anyo ng talata.
