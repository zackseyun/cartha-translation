id: PSA.84.2
reference: Psalms 84:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: tl
  text: 'Ang kaluluwa ko''y nananabik—oo, nanghihina pa nga—sa mga looban ni Yahweh;

    ang puso at laman ko ay humihiyaw[a] sa Diyos na buháy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumisigaw sa galak.” Ang pandiwang Hebreo ay karaniwang tumutukoy sa isang malakas at umaalingawngaw na sigaw ng kagalakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: nananabik
  rationale: Ipinapahayag ng pandiwa ang matindi at taimtim na pananabik; natural at marangal ang “nananabik” sa modernong Tagalog.
- source_word: וְגַם כָּלְתָה
  choice: oo, nanghihina pa nga
  rationale: Ginagawang kasukdulan ng וְגַם ang ikalawang pandiwa, habang ang כָּלְתָה ay naglalarawan ng pagkaubos o panghihina dahil sa matinding pananabik.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Pinananatili nito ang tuwirang larawan ng panloob na sarili at ang pagkakaiba nito sa kasunod na tambalang “puso at laman.”
- source_word: לְחַצְרוֹת
  choice: sa mga looban
  rationale: Tumutukoy ito sa mga looban ng santuwaryo o templo; malinaw at likas sa Tagalog ang “mga looban.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: לִבִּי וּבְשָׂרִי
  choice: ang puso at laman ko
  rationale: Pinananatili ang Hebreong tambalan ng panloob at panlabas na pagkatao; mas malapit sa larawan ng בָּשָׂר ang “laman” kaysa “katawan.”
- source_word: יְרַנְּנוּ
  choice: humihiyaw
  rationale: Ang pandiwa ay tumutukoy sa malakas at umaalingawngaw na sigaw, madalas na may galak. Hindi tahasang idinagdag sa pangunahing teksto ang “sa galak” upang mapanatili ang puwang para sa matinding paghiyaw ng pananabik sa kontekstong ito.
- source_word: אֶל אֵל חָי
  choice: sa Diyos na buháy
  rationale: Ang “sa” ay tuwirang tumutugma sa direksiyon ng אֶל, at malinaw na ipinakikilala ng parirala ang Diyos bilang buháy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa Hebreong teksto; pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulong “PANGINOON.”
- issue: Diwa ng יְרַנְּנוּ
  choice: humihiyaw
  alternative: sumisigaw sa galak
  rationale: Madalas na masaya o matagumpay ang sigaw na ipinahihiwatig ng pandiwa, ngunit maaaring idiin ng agarang konteksto ang matinding pananabik. Pinananatili sa pangunahing teksto ang bahagyang kalabuan at inilalahad sa talababa ang mas tahasang masayang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na patula ngunit madaling maunawaan. Ginamit ang pinaikling “ko’y” para sa likas na indayog ng salmo, at pinanatili ang paralelismong “kaluluwa,” “puso,” at “laman.”
