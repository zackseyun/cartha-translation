  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: tl
  text: Maging ang maya ay nakatagpo ng tahanan[a], at ang layang-layang ay nakahanap ng sariling pugad, kung saan niya mailalagay ang kanyang mga inakay—sa iyong mga altar, O Yahweh ng mga Hukbo[c][b], aking Hari at aking Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung saan niya inilagay ang kanyang mga inakay.” Maaaring unawain ang pandiwang Hebreo bilang isang kilos na natapos na, sa halip na paglalarawan sa karaniwang gamit ng pugad.
    reason: lexical_alternative
  - marker: b
    text: O, “malapit sa iyong mga altar” o “sa tabi ng iyong mga altar.” Siksik ang kayariang Hebreo at maaaring magpahayag ng pagiging malapit, hindi ng literal na pagkakalagay sa ibabaw ng mga altar.
    reason: lexical_alternative
  - marker: c
    text: 'Tradisyonal: “PANGINOON ng mga Hukbo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Maging
  rationale: 'Ipinahahayag nito ang diin ng paghahambing: maging ang maliliit na ibon ay nakatatagpo ng tahanan sa santuwaryo ng Diyos.'
- source_word: צִפּוֹר
  choice: maya
  rationale: Bagaman maaari itong tumukoy sa isang maliit na ibon sa pangkalahatan, ang “maya” ay tradisyonal, malinaw, at maaaring ipagtanggol sa kontekstong ito.
- source_word: מָצְאָה בַיִת
  choice: nakatagpo ng tahanan
  rationale: Ipinahihiwatig ng “tahanan” ang ligtas na tirahan, hindi lamang isang gusali; pinananatili ng aspektong naganap ang resulta ng pandiwang Hebreo.
- source_word: דְרוֹר
  choice: ibong layang-layang
  rationale: Karaniwang kinikilalang katumbas nito ang swallow; nilagyan ng “ibong” upang hindi mapagkamalang saranggola ang “layang-layang.”
- source_word: קֵן לָהּ
  choice: sariling pugad
  rationale: Likas na ipinapahayag sa Tagalog ang pakinabang o pag-aari na nasa Hebreong pariralang “pugad para sa kanya.”
- source_word: אֲשֶׁר שָׁתָה
  choice: kung saan niya mailalagay
  rationale: Ipinapakita nito ang gamit ng pugad at ang kahulugang “ilagay” ng pandiwa, habang inilalagay sa talababa ang posibleng pagbasa bilang kilos na natapos na.
- source_word: אֶפְרֹחֶיהָ
  choice: kanyang mga inakay
  rationale: Ang “mga inakay” ay natural at tumpak na tawag sa mga supling ng ibon.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: sa iyong mga altar
  rationale: Ang maikli at makatang kayarian ay inuunawang lokatibo. Pinananatili nito ang matingkad na larawan nang hindi iginigiit na nasa ibabaw mismo ng mga altar ang pugad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga Hukbo
  rationale: Mas malinaw sa makabagong mambabasa kaysa sa lumang “mga hukbo sa langit” o “hosts,” at pinananatili ang lakas at paghahari ng banal na titulo.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: aking Hari at aking Diyos
  rationale: Pinananatili ang tuwirang personal na pagtatapat at ang magkatambal na mga titulo.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Paglalarawan sa צְבָאוֹת bilang banal na titulo
  choice: Yahweh ng mga Hukbo
  alternative: Yahweh ng mga hukbo sa langit; PANGINOON ng mga Hukbo
  rationale: Ang “mga Hukbo” ay nagpapanatili sa maramihang anyo at sa diwang militar at maharlika ng titulo, nang hindi nililimitahan kung anong mga hukbo ang tinutukoy.
- issue: Ugnayan ng pugad at ng mga altar
  choice: sa iyong mga altar
  alternative: malapit sa iyong mga altar; sa tabi ng iyong mga altar
  rationale: Siksik at makata ang Hebreong kayarian. Pinananatili sa pangunahing teksto ang malapit na kaugnayan, ngunit hindi ipinapasya kung literal na nasa ibabaw o nasa paligid lamang ng mga altar ang pugad.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang makatang pag-uulit at tuwirang panawagan sa Diyos. Ginamit ang “ibong layang-layang” para luminaw ang uri ng ibon, at inilagay sa mga talababa ang tunay na mga alternatibong pagbasa ng aspektong pandiwa, lokasyon ng mga altar, at tradisyonal na banal na titulo.
