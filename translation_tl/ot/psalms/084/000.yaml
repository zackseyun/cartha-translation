translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang teknikal na katawagang “Gitit” dahil hindi tiyak ang kahulugan nito, at iniwasang gawing mas tiyak kaysa sa Hebreo ang kaugnayan ng salmo sa mga anak ni Kora.
