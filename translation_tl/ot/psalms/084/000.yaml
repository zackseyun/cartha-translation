translation:
  language: tl
  text: 'Para sa tagapanguna ng awitan: ayon sa Gitit.[a] Isang salmo ng mga anak ni Korah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Gitit. Malamang na isa itong katawagang musikal—marahil isang himig, paraan ng pagtugtog, o instrumento—ngunit hindi tiyak ang eksaktong kahulugan nito.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa mga anak ni Korah.” Ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng pagkatha, kaugnayan, pag-aari, o pag-aalay sa mga pamagat ng salmo.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang “tagapanguna ng awitan,” nang hindi nililimitahan ang tungkulin sa isang koro lamang.
- source_word: עַל
  choice: ayon sa
  rationale: Sa kontekstong musikal, maaaring ipakilala ng עַל ang isang himig, paraan ng pagtugtog, o instrumento. Pinananatili ng “ayon sa” ang kawalang-katiyakan nang hindi nagpapasiya kung alin dito ang tinutukoy.
- source_word: הַגִּתִּית
  choice: Gitit
  rationale: Hindi tiyak ang kahulugan ng terminong Hebreo—maaaring pangalan ng himig, paraan ng musika, o instrumento—kaya tinumbasan ito sa baybay-Filipino sa halip na bigyan ng mapagpasiyang pakahulugan.
- source_word: לִבְנֵי קֹרַח
  choice: ng mga anak ni Kora
  rationale: Maaaring ipahiwatig ng pang-ukol na ל ang pagkatha, kaugnayan, pag-aari, o pag-aalay. Ang maikling “ng mga anak ni Kora” ay likas sa Filipino at hindi tahasang nagpapasiya sa eksaktong ugnayan.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang מִזְמוֹר ay katawagan sa isang awit na musikal; “salmo” ang kinikilalang katawagang pang-uri ng akda sa kontekstong ito.
