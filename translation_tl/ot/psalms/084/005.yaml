  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: tl
  text: Mapalad ang taong ang lakas ay nasa iyo, na sa kanyang puso ay may mga lansangan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang hulapi sa “kanilang puso” ay maramihan, bagaman nagsisimula ang talata sa isahang “tao.” Isinahan ito sa pangunahing teksto upang umayon sa “taong.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ang “mga lansangan” sa mga daan ng paglalakbay patungo sa tahanan ng Diyos, ngunit hindi tahasang sinasabi sa talatang ito na patungo ang mga iyon sa Sion.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad ang
  rationale: Karaniwang anyo ng pagpapahayag ng pagpapala sa mga salmo at karunungang panitikan; natural at marangal sa modernong Tagalog.
- source_word: אָדָם
  choice: tao
  rationale: Ang pangngalan ay panlalaking isahan sa Hebreo ngunit ginagamit bilang pangkalahatang pagtukoy sa sinumang tao; ang 'tao' ang natural na katumbas sa Tagalog nang hindi nililimitahan ang saklaw sa lalaki.
- source_word: עֹז לוֹ בָךְ
  choice: sa iyo kumukuha ng lakas
  rationale: Ipinahahayag nito na nasa Diyos ang lakas ng tao. Bahagyang dinamiko ito ngunit likas sa Tagalog at pinananatili ang ugnayang ipinahihiwatig ng בָךְ.
- source_word: מְסִלּוֹת
  choice: mga lansangan
  rationale: Tumutukoy sa mga mataas o pangunahing daan. Hindi idinagdag ang 'patungong Zion' sapagkat hindi iyon tahasang nasa talata.
- source_word: בִּלְבָבָם
  choice: ang puso
  rationale: Pinakinis sa isahan upang umayon sa 'taong,' habang itinatala sa talababa ang tunay na paglipat ng Hebreo sa hulaping maramihan.
theological_decisions:
- issue: Pangkalahatang panlalaking אָדָם
  choice: tao
  alternative: lalaki
  rationale: Bagaman panlalaking isahan ang anyo sa Hebreo, pangkalahatan ang gamit. Sa Tagalog, tumpak at natural ang 'tao' para sa kinatawang diwa nito.
- issue: Kahulugan ng mga lansangan sa puso
  choice: nakatuon sa mga lansangan
  alternative: nasa puso ang mga lansangan
  rationale: Ang literal na larawan ay mga lansangang nasa puso. Ang 'nakatuon' ay nagpapalinaw na panloob na hangarin o pagkiling ang tinutukoy, ngunit pinananatili sa talababa ang mas literal na anyo at ang posibleng konteksto ng paglalakbay sa sambahan.
- issue: Ipinahihiwatig na hantungan ng מְסִלּוֹת
  choice: mga lansangan
  alternative: mga lansangang patungong Zion
  rationale: Malamang na mga daan ng paglalakbay patungo sa tahanan ng Diyos ang tinutukoy ayon sa konteksto, ngunit hindi tahasang binabanggit sa talata ang Zion.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'Mapalad' bilang tradisyonal ngunit buhay na pananalita ng beatitude. Iniwasan ang pagdaragdag ng Zion sa pangunahing teksto; ipinaliwanag lamang ito sa talababa.
