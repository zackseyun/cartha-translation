base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: tl
  text: Sapagkat ang isang araw sa iyong mga looban ay higit na mabuti kaysa sa isang libo.[a] Mas nanaisin kong mamalagi sa may pintuan ng bahay ng aking Diyos[b] kaysa manirahan sa mga tolda ng kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kaysa sa isang libo” lamang. Maaaring ipahiwatig ng konteksto ang “isang libong araw” o “isang libo sa ibang lugar,” ngunit hindi nakasulat ang mga iyon sa teksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin, “Pinili kong mamalagi sa may pintuan ng bahay ng aking Diyos”; ayon sa tradisyon, “Mas nanaisin kong maging bantay-pinto sa bahay ng aking Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: higit na mabuti
  rationale: Ipinahahayag ng טוֹב kasama ng מִן ang paghahambing; natural sa Filipino ang “higit na mabuti.”
- source_word: בַּחֲצֵרֶיךָ
  choice: sa iyong mga bulwagan
  rationale: Ang חָצֵר ay mga court o courtyard ng santuwaryo. Ang “mga bulwagan” ay dignified at karaniwang salin sa kontekstong ito, habang pinananatili ang maramihan.
- source_word: מֵאָלֶף
  choice: kaysa sa isang libo
  rationale: Walang tahasang pangngalan pagkatapos ng “isang libo” sa Hebreo. Hindi idinagdag sa teksto ang “araw” o “sa ibang lugar,” upang mapanatili ang poetikong elipsis.
- source_word: בָּחַרְתִּי
  choice: Mas pinili ko
  rationale: Ang perfect form ay tuwirang nagsasaad ng pagpili; sa konteksto, malinaw rin ang paghahambing na preference.
- source_word: הִסְתּוֹפֵף
  choice: manatili sa may pintuan
  rationale: Ipinahihiwatig ng bihirang pandiwa ang paglalagay ng sarili sa may threshold. Hindi ito tiyak na tumutukoy sa tungkulin ng isang bantay-pinto.
- source_word: בְּבֵית אֱלֹהַי
  choice: ng bahay ng aking Diyos
  rationale: Pinananatili ang konkretong “bahay” ng Hebreo sa halip na gawing mas tiyak na “templo.” Nakaugnay ito sa lokasyong “sa may pintuan.”
- source_word: מִדּוּר
  choice: kaysa manirahan
  rationale: Ang infinitive na דּוּר ay tumutukoy sa paninirahan; maayos na inihahayag ng “kaysa manirahan” ang paghahambing.
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: sa mga tolda ng kasamaan
  rationale: Pinananatili ang abstraktong רֶשַׁע bilang “kasamaan,” sa halip na ilipat ang diin sa mga taong masama.
theological_decisions:
- issue: Wika tungkol sa santuwaryo
  choice: iyong mga bulwagan / bahay ng aking Diyos
  alternative: iyong mga looban / templo ng aking Diyos
  rationale: Pinananatili ang dalawang konkretong larawan ng santuwaryo nang hindi labis na tinutukoy ang “bahay” bilang “templo.”
- issue: Katayuan sa may pintuan
  choice: manatili sa may pintuan
  alternative: maging bantay-pinto
  rationale: Hindi tiyak na pangalan ng isang opisyal na tungkulin ang הִסְתּוֹפֵף. Pinananatili ng salin ang larawan ng mapagpakumbabang pagkalapit sa bahay ng Diyos.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat,” “higit na mabuti,” at parallel na “kaysa” upang mapanatili ang poetikong paghahambing. Ang footnote [a] ay inilagay kaagad pagkatapos ng “isang libo,” at ang [b] pagkatapos ng pariralang may pintuan at bahay, ayon sa saklaw ng mga paliwanag.
