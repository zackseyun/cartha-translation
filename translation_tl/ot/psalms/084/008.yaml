  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: tl
  text: 'Yahweh, Diyos ng mga hukbo, dinggin mo ang aking panalangin;

    pakinggan mo, Diyos ni Jacob. Selah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Selah” ay isang terminong Hebreo sa pagsamba o musika na hindi tiyak ang kahulugan; maaaring tumukoy ito sa paghinto o interludyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ang banal na pangalan sa pamamagitan ng malapit na transliterasyon, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Diyos ng mga hukbo
  rationale: Pinananatili ang malawak na larawan ng mga hukbo o puwersang nasa ilalim ng kapangyarihan ng Diyos nang hindi nililimitahan ang mga ito sa isang tiyak na uri.
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: dinggin mo ang aking panalangin
  rationale: Ang “dinggin” ay likas at marangal na pananalita sa panalangin at malinaw na naghahayag ng tuwirang pakiusap.
- source_word: הַאֲזִינָה
  choice: pakinggan mo ako
  rationale: Likas ito sa modernong Filipino at ipinahihiwatig ang masinsing pakikinig; idinagdag ang “ako” na likas na nauunawaan mula sa nagsasalitang nananalangin.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Diyos ni Jacob
  rationale: Karaniwang anyong Filipino para sa construct phrase na tumutukoy sa Diyos na kinikilala at sinamba ni Jacob.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang kahulugan at gamit ng terminong liturhikal o musikal, kaya pinananatili ito sa transliterasyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalan ng Diyos; pinananatili ito sa transliterasyon sa halip na tahimik na palitan ng titulo.
- issue: Saklaw ng צְבָאוֹת sa banal na titulo
  choice: mga hukbo
  alternative: mga hukbo sa langit; mga puwersa
  rationale: Hindi nililinaw ng talata kung aling mga hukbo ang partikular na tinutukoy, kaya pinananatili ang sadyang malawak na saklaw ng Hebreo.
- issue: Kahulugan ng סֶלָה
  choice: Selah
  alternative: paghinto; interludyo
  rationale: Dahil pinagtatalunan ang eksaktong kahulugan nito, hindi ito isinasalin sa paraang magpapasya sa isang di-tiyak na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na wikang Filipino. Pinanatili ang maikling paralelismo ng panalangin at ang transliterasyong “Yahweh” at “Selah.”
