source:
  edition: WLC
  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: tl
  text: Masdan mo ang aming kalasag[a], O Diyos, at tunghayan mo ang mukha ng iyong pinahiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aming tagapagtanggol.” Sa Hebreo, “aming kalasag,” isang talinghagang patula na maaaring tumukoy sa Diyos bilang tagapagtanggol o sa hari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “iyong pinahiran.” Ang salitang ito ang pinagmulan ng titulong “Mesiyas”; dito, malamang na una itong tumutukoy sa Davidikong hari, bagaman maaari itong magkaroon ng mas malawak na mesiyanikong pahiwatig.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: aming kalasag
  rationale: Literal na nangangahulugang “aming kalasag.” Pinananatili ang kongkretong larawang patula at ang posibilidad na tumukoy ito sa Diyos bilang tagapagtanggol o sa hari.
- source_word: רְאֵה
  choice: Masdan mo
  rationale: Ang pautos na pandiwa ay isang pakiusap na pag-ukulan ng pansin, hindi lamang basta makita. Ang “masdan mo” ay likas at marangal sa panalanging patula.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; likas na ipinahihiwatig ng “O” ang bokatibong gamit.
- source_word: וְהַבֵּט
  choice: at tunghayan mo
  rationale: Ipinahihiwatig ng pandiwa ang nakatuon at masusing pagtingin. Bahagyang ipinag-iiba ng “tunghayan” ang ikalawang pandiwa habang pinananatili ang paralelismong patula.
- source_word: פְּנֵי
  choice: ang mukha ng
  rationale: Pinananatili ang literal at relasyonal na larawan ng Hebreong “mukha,” sa halip na palitan ito ng mas interpretatibong salita gaya ng “presensya.”
- source_word: מְשִׁיחֶךָ
  choice: iyong pinahiran
  rationale: Ang salita ay tumutukoy sa taong pinahiran, malamang ay ang Davidikong hari sa agarang konteksto. Hindi ito isinaling “Mesiyas” sa pangunahing teksto upang hindi gawing tiyak ang isang pagbasa na hindi ipinipilit ng Hebreo.
theological_decisions:
- issue: Tinutukoy ng “aming kalasag”
  choice: Pinanatili ang talinghagang “aming kalasag” nang hindi tinutukoy kung ito ay ang Diyos o ang hari.
  alternative: Maaaring unawain bilang Diyos na tagapagtanggol o bilang ang Davidikong hari na nagsisilbing kalasag ng bayan.
  rationale: Pinahihintulutan ng Hebreo ang dalawang pagbasa, at maaaring sinasadyang itambal ang “aming kalasag” sa “iyong pinahiran.” Pinananatili ng salin ang tunay na kalabuan at tensiyong patula.
- issue: Tinutukoy ng “iyong pinahiran”
  choice: Isinaling “iyong pinahiran” at hindi ginawang pantanging titulong “Mesiyas.”
  alternative: “iyong Mesiyas”
  rationale: Sa agarang konteksto, malamang na tumutukoy ito sa pinahirang Davidikong hari. Gayunman, ang salitang Hebreo rin ang pinagmulan ng titulong “Mesiyas,” kaya binabanggit ang ugnayang ito sa talababa nang hindi ipinipilit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Ginamit ang “masdan” at “tunghayan” upang mapanatili ang dalawang magkatulad ngunit bahagyang magkaibang pandiwa sa Hebreo. Iningatan ang mga larawang “kalasag” at “mukha” at hindi nilutas ang kalabuan ng kanilang teolohikal na pagtukoy.
