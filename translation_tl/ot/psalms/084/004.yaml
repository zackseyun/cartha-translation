  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: tl
  text: Mapalad ang mga nananahan sa iyong bahay[a]; patuloy ka nilang pupurihin. Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iyong bahay” ay malamang na tumutukoy sa santuwaryo o templo ng Diyos.
    reason: cultural_note
  - marker: b
    text: Ang “Selah” ay isang terminong liturhikal o musikal sa Hebreo na hindi tiyak ang kahulugan, kaya karaniwan itong hindi isinasalin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad ang
  rationale: Ipinahahayag ng anyong maramihan at padamdam ang mabuting kalagayan ng mga tinutukoy. Ang “mapalad” ay marangal at likas sa makabagong Filipino, at hindi ito nililimitahan sa pansariling damdaming saya.
- source_word: יוֹשְׁבֵי
  choice: mga nananahan
  rationale: Ang participle mula sa ישׁב ay tumutukoy rito sa patuloy na pananatili o pagtira, hindi lamang sa pag-upo.
- source_word: בֵיתֶךָ
  choice: iyong bahay
  rationale: Pinananatili ang literal at makatang larawang “bahay”; sa konteksto, malamang na tumutukoy ito sa santuwaryo o templo ng Diyos.
- source_word: עוֹד
  choice: patuloy
  rationale: Ipinahahayag nito ang pagpapatuloy ng pagpupuri. Likas sa Filipino ang pagkakaugnay nito sa pandiwang “pupurihin,” bagaman maaari ring unawain ang Hebreo bilang “muli” o “pa.”
- source_word: יְהַלְלוּךָ
  choice: ka nilang pupurihin
  rationale: Pinananatili ng aspektong kontemplatibo ang hindi pa ganap o nagpapatuloy na kilos at ang hulaping tumutukoy sa Diyos bilang layon.
- source_word: סֶּלָה
  choice: Selah
  rationale: Isinalin sa anyong transliterasyon sapagkat hindi tiyak ang kahulugan ng terminong liturhikal o musikal na Hebreo.
theological_decisions:
- issue: Tinutukoy ng “iyong bahay”
  choice: Pinanatili bilang “iyong bahay” sa pangunahing teksto.
  alternative: iyong templo / iyong santuwaryo
  rationale: Malamang na santuwaryo o templo ng Diyos ang tinutukoy, ngunit ang literal na larawan ng Hebreo ay mas malawak at hindi dapat paliitin nang walang pangangailangan.
- issue: Panahon o aspekto ng pagpupuri
  choice: patuloy ka nilang pupurihin
  alternative: patuloy ka nilang pinupuri
  rationale: Maaaring magpahayag ang imperfect ng panghinaharap o nakagawiang kilos. Ang “pupurihin” ay nagpapanatili ng panghinaharap na himig, samantalang ang “patuloy” ay naghahayag ng pagpapatuloy nang hindi itinatanggi ang aspektuwal na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nananahan” upang mapanatili ang makatang tono at tuloy-tuloy na diwa ng participle; iniwasan ang labis na teknikal o denominasyonal na pananalita.
