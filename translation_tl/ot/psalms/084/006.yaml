base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: tl
  text: Habang dumaraan sila sa Lambak ng Baca[a], ginagawa nila itong bukal; pati ang maagang ulan[b] ay bumabalot dito, na may dalang mga pagpapala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Baca ay maaaring kaugnay ng salitang Hebreo para sa “pagtangis”; kaya maaari itong maunawaan bilang “Lambak ng Pagtangis.”
    reason: alternative_reading
  - marker: b
    text: O “ulan sa taglagas.” Maaari ring mangahulugan ang salitang Hebreo na “guro,” ngunit sa kontekstong ito ay karaniwang inuunawa itong pana-panahong ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי בְּעֵמֶק
  choice: Sa pagdaan nila sa Lambak
  rationale: Ang pangmaramihang participle ng עבר ay tumutukoy sa mga manlalakbay sa konteksto. Likas sa modernong Tagalog ang temporal na pariralang “Sa pagdaan nila,” at ang “sa Lambak” ay nagpapahayag ng pagdaan sa isang lugar.
- source_word: הַבָּכָא
  choice: Baca
  rationale: Malamang na pangalan ito ng lugar, ngunit maaari rin itong umalingawngaw sa salitang Hebreo na kaugnay ng pagtangis. Pinananatili ng transliterasyon ang sadyang kalabuan.
- source_word: מַעְיָן
  choice: isang bukal
  rationale: Tumutukoy ang salita sa likas na bukal o pinagmumulan ng tubig. Karaniwan at malinaw sa Tagalog ang “bukal.”
- source_word: יְשִׁיתוּהוּ
  choice: ginagawa nila itong
  rationale: Ang pandiwang שׁית ay maaaring mangahulugang maglagay o gumawa. Ang hulaping panlalaki ay tumutukoy sa lambak, kaya ipinahahayag na ginagawa nila itong bukal.
- source_word: גַּם
  choice: maging
  rationale: Nagdaragdag ito ng isa pang matinding larawan sa tula; ipinahahayag ng “maging” ang ganitong diin.
- source_word: בְּרָכוֹת
  choice: mga pagpapala
  rationale: Ang anyong Hebreo ay tuwirang nangangahulugang “mga pagpapala,” habang ang konteksto ng tubig ay nagpapahiwatig ng nagbibigay-buhay na mga kaloob nang hindi kailangang isalin ito bilang “mga lawa.”
- source_word: יַעְטֶה
  choice: nagbabalot
  rationale: Ang pandiwa ay nangangahulugang tumakip, bumalot, o magdamit. Pinananatili ng “nagbabalot” ang masiglang metapora ng Hebreo.
- source_word: מוֹרֶה
  choice: unang ulan
  rationale: Sa kontekstong pang-agrikultura at sa mga larawan ng tubig, malamang na tumutukoy ito sa unang pana-panahong ulan, na dumarating sa taglagas. Ang posibleng kahulugang “guro” ay inilagay sa talababa.
theological_decisions:
- issue: Kung bibigyang-kahulugan o ituturing na pangalan ang הַבָּכָא
  choice: Pinanatili bilang pangalang “Baca” sa pangunahing teksto
  alternative: Lambak ng Pagtangis
  rationale: Likas na gumaganap ang salita bilang pangalan ng lugar, ngunit maaari itong magpahiwatig ng pagtangis. Iniiwasan ng transliterasyon na magtakda ng iisang interpretasyon, at pinananatili sa talababa ang posibleng paglalaro sa salita.
- issue: Kahulugan ng מוֹרֶה
  choice: unang ulan
  alternative: guro
  rationale: Higit na angkop sa mga larawan ng bukal, ulan, at pagpapala ang pana-panahong ulan. Gayunman, tunay na maaari ring mangahulugan ang anyong Hebreo na “guro,” kaya hindi inalis ang alternatibong ito.
- issue: Relasyon ng ulan, lambak, at mga pagpapala sa ikalawang linya
  choice: Ang unang ulan ang nagbabalot sa lambak ng mga pagpapala
  alternative: Binabalot ng unang ulan ang mga pagpapala
  rationale: Makatwiran sa konteksto na ang di-tahasang tinutukoy na bagay ng pandiwa ay ang lambak. Pinananatili ng pagkakasalin ang larawan ng ulan bilang daluyan ng pagpapala nang hindi ginagawang literal na mga lawa ang “mga pagpapala.”
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang paralelismo at larawang patula sa pamamagitan ng “bukal,” “unang ulan,” at “nagbabalot,” habang iniwasan ang arkaiko o labis na teknikal na pananalita.
