  to: 'Sapagkat si Yahweh na Diyos ay araw at kalasag;

    kagandahang-loob at dangal[a] ang ipinagkakaloob ni Yahweh.

    Hindi niya ipinagkakait ang mabuti

    sa mga namumuhay nang may integridad.[b]'
  rationale: Pinalitan ang "nang walang kapintasan" ng "nang may integridad" upang mas tuwirang maipahayag ang בְּתָמִים at maiwasan ang di-kinakailangang pahiwatig ng sinless perfection. Inilipat ang [a] upang malinaw na nakaangkla ito sa "dangal," na siyang may alternatibong "kaluwalhatian." Pinanatili ang makatang larawan, ang pangalang Yahweh, at ang pangkalahatang-katotohanang aspekto ng mga pandiwa.
