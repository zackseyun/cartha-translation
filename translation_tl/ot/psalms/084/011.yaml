  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: tl
  text: 'Sapagkat si Yahweh na Diyos ay araw at kalasag;

    kagandahang-loob at dangal[a] ang ipinagkakaloob ni Yahweh.

    Hindi niya ipinagkakait ang mabuti

    sa mga namumuhay nang may integridad.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “biyaya at kaluwalhatian.”
    reason: lexical_alternative
  - marker: b
    text: Ang “may integridad” dito ay tumutukoy sa buo at matuwid na pamumuhay, hindi sa ganap na kawalan ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag sa awit.
- source_word: שֶׁמֶשׁ
  choice: araw
  rationale: Pinananatili ang tuwirang makatang larawan sa Hebreo sa halip na ipaliwanag ito bilang liwanag.
- source_word: וּמָגֵן
  choice: at kalasag
  rationale: Pinananatili ang metapora ng proteksiyon ng Diyos.
- source_word: יְהוָה אֱלֹהִים
  choice: si Yahweh na Diyos
  rationale: Ginagamit ang pangalang Yahweh para sa Tetragrammaton, samantalang ang Diyos ay appositional na pagkakakilanlan.
- source_word: חֵן
  choice: kagandahang-loob
  rationale: Ipinahahayag nito ang mapagpalang pagtanggap o pabor nang hindi awtomatikong ikinakarga ang isang mas huling teknikal na kahulugang teolohikal.
- source_word: וְכָבוֹד
  choice: at dangal
  rationale: Sa konteksto ng bagay na ipinagkakaloob sa tao, natural na ipinahahayag ng dangal ang kaloob na karangalan; nananatiling lehitimong alternatibo ang kaluwalhatian.
- source_word: יִתֵּן
  choice: ipinagkakaloob
  rationale: Ang pangkasalukuyang anyo ay angkop sa pangkalahatan at palagiang katotohanang ipinahahayag ng di-ganap na pandiwa sa tulang Hebreo.
- source_word: לֹא יִמְנַע
  choice: Hindi niya ipinagkakait
  rationale: Natural na Filipino para sa hindi pagpigil o pagkakait ng isang mabuting bagay.
- source_word: טוֹב
  choice: ang anumang mabuti
  rationale: Ipinahahayag ang malawak at di-tiyak na saklaw ng substantibong 'mabuti' sa paraang natural sa Filipino.
- source_word: לַהֹלְכִים
  choice: sa mga namumuhay
  rationale: Ang 'paglakad' ay idyomang Hebreo para sa paraan ng pamumuhay; inililipat ito sa natural na modernong Filipino.
- source_word: בְּתָמִים
  choice: nang walang kapintasan
  rationale: Pinananatili ang malakas na etikal na diwa ng kabuuan, integridad, at katuwiran, habang nililinaw sa talababa na hindi ito nangangahulugan ng ganap na kawalan ng kasalanan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit sa talata ang Tetragrammaton; pinananatili ng Yahweh ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Posibleng unawain ang בְּתָמִים bilang ganap na kawalan ng kasalanan
  choice: nang walang kapintasan, na may paglilinaw sa talababa
  alternative: nang may integridad; nang matuwid
  rationale: Ang termino ay tumutukoy sa buo at matuwid na pamumuhay. Pinananatili ng salin ang lakas at tensiyon ng salita ngunit hindi ito ipinapakahulugang walang-kasalanang kasakdalan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkapares na metaporang “araw at kalasag,” samantalang ang idyomang Hebreo na “lumalakad” ay isinaling “namumuhay” para sa likas at malinaw na Filipino. Inihanay ang mga marker sa mismong pariralang ipinaliliwanag ng bawat talababa.
