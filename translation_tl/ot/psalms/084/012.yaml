  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: tl
  text: Yahweh ng mga hukbo, mapalad[a] ang taong nagtitiwala sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maligaya” o “pinagpala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili nito ang konkretong larawan ng mga hukbo sa Hebreo at ang nakaugaliang banal na titulong יְהוָה צְבָאוֹת, nang hindi ito ipinapakahulugang agad bilang “Makapangyarihan sa lahat.”
- source_word: אַשְׁרֵי
  choice: pinagpala
  rationale: Ang pormulang ito ng pagpapahayag ay nagsasaad ng mabuting kalagayan ng isang tao sa pananaw ng Diyos; mas malalim ito kaysa sa panandaliang damdaming maaaring ipahiwatig ng “masaya.”
- source_word: אָדָם
  choice: ang tao
  rationale: Ang pangngalang isahan ay tumutukoy sa sinumang tao bilang kinatawang indibidwal. Likas sa Filipino ang “tao” at hindi nito ipinapalagay na lalaki lamang ang tinutukoy.
- source_word: בֹּטֵחַ
  choice: nagtitiwala
  rationale: Ang participle ay nagpapahiwatig ng kinagawiang o patuloy na pagtitiwala, na natural na naipapahayag sa Filipino sa anyong “nagtitiwala.”
- source_word: בָּךְ
  choice: sa iyo
  rationale: Tuwirang pinananatili ang pang-ukol at ang ikalawang panauhang isahan na tumutukoy kay Yahweh.
theological_decisions:
- issue: Pagpapahayag sa titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  alternative: Yahweh na Makapangyarihan sa lahat
  rationale: Pinananatili ng piniling anyo ang personal na pangalan at ang larawan ng mga hukbo sa pinagmulang Hebreo. Ang kawalan ng pantawag na “O” ay natural sa modernong Filipino, kung saan sapat ang pangalan na sinusundan ng kuwit upang ipakita ang tuwirang pagtawag.
- issue: Saklaw ng אָדָם
  choice: ang tao
  alternative: ang lalaki
  rationale: Sa konteksto, ang isahang אָדָם ay pangkalahatan at tumutukoy sa sinumang nagtitiwala kay Yahweh; ang “tao” ang tumpak at likas na katumbas nang hindi nililimitahan ang pahayag sa kasariang lalaki.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “Yahweh” bilang personal na pangalan, “mga hukbo” upang mapanatili ang larawan ng Hebreo, at “tao” para sa pangkalahatang saklaw ng isahang אָדָם.
