translation:
  language: tl
  text: 'Huwag kang matakot kapag yumaman ang isang tao,

    kapag lumago ang karangalan ng kanyang sambahayan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng kanyang bahay.” Ang Hebreong salita para sa “bahay” ay maaari ring tumukoy sa sambahayan, pamilya, o ari-arian ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Ang אַל na sinusundan ng anyong di-ganap ay nagpapahayag ng pagbabawal; natural at tuwiran sa modernong Tagalog ang “Huwag kang matakot.”
- source_word: כִּי
  choice: kapag
  rationale: Sa dalawang paglitaw nito, ipinakikilala ng כִּי ang kalagayang maaaring pagmulan ng takot, kaya “kapag” ang malinaw na katumbas.
- source_word: יַעֲשִׁר אִישׁ
  choice: yumaman ang isang tao
  rationale: Ang Hiphil ng עשר dito ay may di-palipat na diwang “maging mayaman.” Ang “isang tao” ay likas sa Tagalog at naipapahayag ang pangkalahatang gamit ng אִישׁ nang hindi ginagawang tiyak ang kasarian sa target na wika.
- source_word: יִרְבֶּה
  choice: dumami
  rationale: Ang רבה ay nangangahulugang dumami o lumago; ang “dumami” ay malinaw na nagpapakita ng pagtaas.
- source_word: כְּבוֹד
  choice: karangyaan
  rationale: Sa konteksto ng pagyaman at ng sambahayan, tumutukoy ang כָּבוֹד sa nakikitang kasaganaan, maringal na katayuan, o karangyaan. Mas natural dito ang “karangyaan” kaysa literal na “kaluwalhatian,” nang hindi ito nililimitahan sa salapi lamang.
- source_word: בֵּיתוֹ
  choice: kanyang sambahayan
  rationale: Maaaring tumukoy ang בַּיִת sa pisikal na bahay, pamilya o sambahayan, at ari-arian. Ang “sambahayan” ay angkop sa paglawak ng karangyaan, habang pinananatili sa talababa ang tunay na lexical na saklaw.
