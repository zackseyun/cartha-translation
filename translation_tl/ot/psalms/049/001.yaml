  text: Hear this[a], all peoples; give ear, all inhabitants of the world,
translation:
  language: tl
  text: 'Pakinggan ninyo ito, kayong lahat, mga bayan;

    makinig kayo, lahat ng naninirahan sa daigdig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupa.” Ang Hebreong חָלֶד ay maaaring tumukoy sa daigdig na tinitirhan ng mga tao o sa makalupang larangan ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Pakinggan ninyo
  rationale: Ang maramihang pautos ng שׁמע ay panawagan sa masusing pakikinig. Likas sa modernong Tagalog ang “Pakinggan ninyo” at pinananatili nito ang tuwirang lakas ng Hebreo.
- source_word: זֹאת
  choice: ito
  rationale: Tuwirang panghalip na pamatlig na tumutukoy sa kasunod na pahayag o aral ng salmista.
- source_word: כָּל הָעַמִּים
  choice: kayong lahat ng mga bayan
  rationale: Ang עַמִּים ay tumutukoy nang malawak sa mga pangkat ng tao. Mas angkop ang “mga bayan” kaysa “mga bansa,” na maaaring magpahiwatig ng makabagong estadong pampolitika.
- source_word: הַאֲזִינוּ
  choice: makinig kayo
  rationale: Ang maramihang pautos ay panawagan sa matamang pakikinig. Ang “makinig kayo” ay natural at malinaw habang pinananatili ang paralelismo sa unang linya.
- source_word: כָּל יֹשְׁבֵי
  choice: kayong lahat na naninirahan sa
  rationale: Ang konstruksyong pandiwaring ito ay nangangahulugang lahat ng nananahan o namumuhay sa isang lugar. Natural sa Tagalog ang “lahat na naninirahan sa.”
- source_word: חָלֶד
  choice: daigdig
  rationale: Maaaring tumukoy ang חָלֶד sa mundo ng buhay ng tao o sa makalupang larangan. Sa pangkalahatang panawagan ng talata, malinaw at marangal ang “daigdig,” habang inilalahad sa talababa ang tunay na alternatibong “lupa.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkatugmang “Pakinggan ninyo” at “makinig kayo” upang maipakita ang paralelismong Hebreo nang hindi gumagamit ng lipas na idyoma.
