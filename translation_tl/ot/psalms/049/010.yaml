base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: tl
  text: Sapagkat nakikita niyang namamatay ang marurunong[a]; kapuwa napapawi ang hangal at ang taong walang unawa[b], at iniiwan nila sa iba ang kanilang kayamanan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, panlalaki ang anyo, ngunit maaari itong tumukoy sa mga marurunong bilang isang uri ng tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “taong walang unawa” ay tumutukoy sa taong mangmang o walang katinuan; maaari rin itong mangahulugang “taong malupit ang kamangmangan” o “brutish na tao.”
    reason: lexical_alternative
  - marker: c
    text: O “kanilang mga ari-arian” o “kanilang kabuhayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang pagninilay.
- source_word: יִרְאֶה
  choice: nakikita niya
  rationale: Pinananatili ang ikatlong panauhang isahan at ang pangkalahatang katotohanang ipinahahayag ng di-ganap na anyo.
- source_word: חֲכָמִים
  choice: ang marurunong
  rationale: Likas na kolektibong tawag sa modernong Tagalog para sa mga taong marunong; hindi kailangang gawing tahasang panlalaki sapagkat ang Hebreong panlalaking anyo ay kumakatawan sa isang uri ng tao.
- source_word: יָמוּתוּ
  choice: namamatay
  rationale: Tuwirang ipinahahayag ang kamatayan bilang pangkalahatang katotohanan.
- source_word: יַחַד
  choice: kapuwa
  rationale: Ipinakikita ang iisang kapalaran ng dalawang magkaibang uri; mas natural dito kaysa sa literal na 'magkasama,' na maaaring magpahiwatig ng sabayang oras.
- source_word: כְּסִיל
  choice: ang hangal
  rationale: Karaniwang terminong pangkarunungan para sa taong kapos sa wastong paghatol, na may moral at intelektuwal na diwa.
- source_word: בַעַר
  choice: ang taong walang unawa
  rationale: Natural at malinaw na Tagalog para sa taong mangmang o halos asal-hayop dahil sa kawalan ng pang-unawa, nang hindi gumagamit ng di-likas na 'malahayop na tao.'
- source_word: יֹאבֵדוּ
  choice: napapahamak
  rationale: Nagpapanatili ng mas malakas na diwa kaysa simpleng pagkamatay—pagkawala o kapahamakan.
- source_word: וְעָזְבוּ
  choice: at iniiwan nila
  rationale: Likas na paglalarawan sa pag-iiwan ng pag-aari pagkamatay.
- source_word: לַאֲחֵרִים
  choice: sa iba
  rationale: Pinananatili ang di-tiyak na 'iba' nang hindi dinaragdagan ng diwa ng mga estranghero.
- source_word: חֵילָם
  choice: ang kanilang kayamanan
  rationale: Sa konteksto, tumutukoy sa yaman o mga ari-ariang maiiwan sa ibang tao.
theological_decisions:
- issue: Kasarian at pagkatawan ng חֲכָמִים at בַעַר
  choice: ang marurunong ... ang taong walang unawa
  alternative: ang marurunong na lalaki ... ang lalaking malahayop
  rationale: Bagaman panlalaki ang gramatikal na mga anyo sa Hebreo, kinakatawan ng mga ito ang pangkalahatang mga uri ng tao. Sa Tagalog, ang natural na di-tiyak-sa-kasariang pananalita ang nagpapanatili ng saklaw nang hindi nagdaragdag ng eksklusibong pagtukoy sa mga lalaki.
- issue: Ugnayan ng kamatayan at kapahamakan
  choice: namamatay ... napapahamak
  alternative: namamatay ... namamatay rin
  rationale: 'Pinananatili ang pagkakaiba ng ימותו at יאבדו: ang una ay kamatayan, samantalang ang ikalawa ay may diwa ng pagkapawi o kapahamakan, nang hindi ito ginagawang pahayag tungkol sa walang-hanggang hantungan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'kapuwa' upang idiin ang magkatulad na kapalaran, at 'taong walang unawa' upang natural na maihatid ang matinding diwa ng בַעַר. Ang lahat ng panandang talababa [a]–[c] ay nasa pangunahing teksto.
