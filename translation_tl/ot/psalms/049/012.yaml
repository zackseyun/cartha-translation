  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: tl
  text: Ngunit ang taong[a] nasa karangalan ay hindi mananatili[b]; tulad siya ng mga hayop na namamatay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sangkatauhan.” Ang Hebreong אָדָם ay maaaring tumukoy sa “tao” o sa “sangkatauhan”; ang isahan dito ay kumakatawan sa lahat.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi tutuloy” o “hindi magpapalipas ng gabi.” Ipinahihiwatig ng pahayag na hindi magpapatuloy o magtatagal ang tao sa marangal na kalagayan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “na nalilipol.” Tradisyonal na inuunawa rito ang huling pandiwa bilang pagtukoy sa pagkamatay o pagkapahamak.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: tao
  rationale: Ang “tao” ay likas na panlahatang katawagan sa modernong Filipino at maaari ring kumatawan sa buong sangkatauhan, gaya ng isahang anyo sa Hebreo.
- source_word: בִּיקָר
  choice: nasa karangalan
  rationale: Saklaw ng יָקָר ang karangalan, halaga, at kaningningan. Ang “nasa karangalan” ay angkop sa konteksto ng katayuan at dangal ng tao, nang hindi ito nililimitahan sa kayamanan lamang.
- source_word: בַּל יָלִין
  choice: hindi mananatili
  rationale: Bagaman literal na tumutukoy ang יָלִין sa pagtuloy o pagpapalipas ng gabi, ipinahihiwatig dito na hindi nagtatagal ang tao sa marangal niyang kalagayan.
- source_word: נִמְשַׁל
  choice: tulad siya
  rationale: Ipinapahayag ng Niphal na anyo ang paghahambing; natural at malinaw sa Filipino ang “tulad siya.”
- source_word: כַּבְּהֵמוֹת
  choice: ng mga hayop
  rationale: Pangkalahatang tumutukoy ang בְּהֵמוֹת sa mga hayop. Ang “mga hayop” ay mas natural sa kasalukuyang Filipino kaysa “mga hayop na ganid,” na magiging mas makitid ang kahulugan.
- source_word: נִדְמוּ
  choice: na namamatay
  rationale: Sa kontekstong ito, tradisyonal at kontekstuwal na nauunawaan ang pandiwa bilang pagkapahamak o pagkamatay. Ang “namamatay” ay malinaw at tumutugma sa tema ng mortalidad sa salmo.
