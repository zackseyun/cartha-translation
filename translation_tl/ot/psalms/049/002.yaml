  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak ni Adan at mga anak ng lalaki.” Dito, idyomatikong tumutukoy ang magkatambal na pananalita sa mga taong mababa at mataas ang katayuan.
