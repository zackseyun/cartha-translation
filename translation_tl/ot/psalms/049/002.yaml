lexical_decisions:
- source_word: גַּם ... גַּם
  choice: maging ... o
  rationale: Ipinahahayag ng inuulit na גַּם ang pagsaklaw sa dalawang magkatapat na pangkat; natural itong naihahatid sa Tagalog sa hulma na “maging ... o.”
- source_word: בְּנֵי אָדָם
  choice: mga hamak
  rationale: Kapag ipinares sa בְּנֵי אִישׁ, idyomatiko itong tumutukoy sa mga taong mababa ang katayuan, hindi literal na ugnayang pampamilya.
- source_word: בְּנֵי אִישׁ
  choice: mga marangal
  rationale: Sa pagtutumbas nito sa בְּנֵי אָדָם, tumutukoy ito sa mga taong mataas ang katayuan; pinananatili ng “mga marangal” ang panlipunang paghahambing nang hindi nililimitahan sa maharlika lamang.
- source_word: יַחַד
  choice: magkakasama
  rationale: Ipinakikitang sama-samang kabilang at kinakausap ang lahat ng nabanggit na pangkat.
- source_word: עָשִׁיר
  choice: mayaman
  rationale: Karaniwan at tuwirang katumbas sa Tagalog sa paghahambing na panlipunan at pangkabuhayan.
- source_word: וְאֶבְיוֹן
  choice: at mahirap
  rationale: Sa katambal na “mayaman,” malinaw at natural ang “mahirap”; bagaman maaari ring mangahulugang nangangailangan ang אֶבְיוֹן.
