base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: tl
  text: Sapagkat mahal ang pantubos para sa kanilang buhay[a], at hindi iyon sasapat kailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buhay” ay maaari ring isaling “kaluluwa.” Ang Hebreong nephesh ay madalas tumukoy sa buhay o sa mismong taong nabubuhay, hindi lamang sa di-materyal na kaluluwa.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “at iyon ay titigil magpakailanman.” Masinsin at malabo ang sugnay sa Hebreo; maaari itong mangahulugang permanenteng nabibigo ang pagtatangkang tumubos o kailangan na itong tigilan magpakailanman.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: mahal
  rationale: Ipinahahayag ng יקר ang pagiging mahalaga o mataas ang halaga. Sa konteksto ng halagang pantubos, natural na ipinahihiwatig ng “mahal” ang malaking halaga nang hindi tahasang idinaragdag ang “napakamahal” o “hindi kayang bayaran.”
- source_word: פִּדְיוֹן
  choice: pantubos
  rationale: Tumutukoy ang pangngalan sa halagang ibinabayad upang mapalaya o matubos ang isang tao. Pinananatili ng “pantubos” ang transaksiyonal na larawan ng Hebreo.
- source_word: נַפְשָׁם
  choice: kanilang buhay
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o sa taong nabubuhay, hindi kinakailangang sa isang hiwalay na di-materyal na kaluluwa. Likas sa Filipino ang kolektibong “kanilang buhay.”
- source_word: וְחָדַל
  choice: hindi iyon sasapat
  rationale: 'Ang חָדַל ay pangunahing nangangahulugang huminto, magwakas, o mabigo. Dahil masinsin at eliptikal ang sugnay, ipinahahayag ng salin ang malamang na diwa sa konteksto: hindi makasasapat ang pantubos. Itinatala sa talababa ang mas literal na pagbasa.'
- source_word: לְעוֹלָם
  choice: kailanman
  rationale: Kasama ng negatibong diwa ng kabiguan o kakulangan, natural na naihahatid ng “kailanman” ang permanenteng kawalan ng kakayahan ng pantubos na sumapat.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng kamatayan at pagtubos
  choice: buhay
  alternative: kaluluwa
  rationale: Ang paksa ay ang kawalan ng kakayahan ng tao na tubusin ang buhay mula sa kamatayan. Ang “buhay” ang umaangkop sa konteksto at hindi nagdaragdag ng palagay tungkol sa di-materyal na kaluluwa na hindi hinihingi ng salitang Hebreo.
- issue: Pagpapakahulugan sa masinsing sugnay na וְחָדַל לְעוֹלָם
  choice: hindi iyon sasapat kailanman
  alternative: at iyon ay titigil magpakailanman
  rationale: Eliptikal at tunay na malabo ang Hebreo. Malinaw na naihahatid ng pangunahing salin ang argumento na hindi makasasapat ang pantubos ng tao, habang pinananatili sa talababa ang mas literal na posibilidad sa halip na ikubli ang tensiyon ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pantubos” upang mapanatili ang larawang pangkabayaran, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
