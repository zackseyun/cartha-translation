  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: tl
  text: Pupunta siya sa piling ng kanyang mga ninuno[a]; hindi na sila kailanman makakakita ng liwanag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, ang unang pandiwa ay anyong ikalawang panauhang panlalaking isahan (“paparoon ka”), ngunit ang kasunod na pandiwa ay maramihan: “makakakita sila.” Dahil sa konteksto, maraming salin ang gumagamit ng “siya” sa unang sugnay. Pinananatili rito ang paglipat mula sa isang tao tungo sa mga patay na kanyang sinasamahan.'
    reason: alternative_reading
  - marker: b
    text: Ang “makakita ng liwanag” ay idyomang Hebreo para sa pagdanas ng buhay; dito, nangangahulugan itong hindi na sila babalik sa buhay sa mundong ito.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: Darating siya
  rationale: Bagaman ang nakasulat na anyo ay ikalawang panauhang panlalaking isahan, inilalarawan ng konteksto ang taong mayaman sa naunang talata. Ang ikatlong panauhan sa pangunahing teksto ang pinakamalinaw sa daloy, habang itinatala sa talababa ang tunay na tensiyon sa anyong Hebreo.
- source_word: עַד דּוֹר אֲבוֹתָיו
  choice: sa salinlahi ng kanyang mga ninuno
  rationale: Ang עַד ay nagsasaad dito ng hantungan, at ang דּוֹר אֲבוֹתָיו ay tumutukoy sa pangkat o salinlahi ng mga yumaong ninuno. Mas natural sa makabagong Tagalog ang “mga ninuno” kaysa literal na “mga ama.”
- source_word: עַד נֵצַח לֹא
  choice: hindi na ... kailanman
  rationale: Sa pagkakaugnay nito sa negatibong pandiwa, ipinahahayag ng parirala ang permanenteng hindi na muling mangyayari.
- source_word: יִרְאוּ
  choice: sila ... makakakita
  rationale: Ang pandiwa ay ikatlong panauhang maramihan at tumutukoy sa mga patay na sinasamahan ng taong iyon. Pinananatili ang paglipat mula isahan tungo sa maramihan.
- source_word: אוֹר
  choice: liwanag
  rationale: Pinananatili ang larawang Hebreo; sa konteksto, ang pagkakita ng liwanag ay idyoma para sa pagdanas ng buhay.
theological_decisions:
- issue: Paglipat ng panauhan at bilang
  choice: Isahan sa unang sugnay (“siya”), pagkatapos ay maramihan sa ikalawa (“sila”).
  alternative: “Darating ka ... hindi na sila makakakita,” o pagpapakinis na isahan ang dalawang sugnay.
  rationale: Ang תָּבוֹא ay nakasulat bilang ikalawang panauhang panlalaking isahan, samantalang ang יִרְאוּ ay ikatlong panauhang panlalaking maramihan. Dahil ipinagpapatuloy ng konteksto ang paglalarawan sa taong mayaman, ginamit ang “siya” sa teksto ngunit ipinaliwanag sa talababa ang anyong “ikaw”; pinanatili ang maramihan sa hulihan upang huwag burahin ang paglipat sa Hebreo.
- issue: Kahulugan ng “makakita ng liwanag”
  choice: Pinanatili ang idyomang “makakakita ng liwanag” sa pangunahing teksto.
  alternative: “Hindi na sila muling mabubuhay sa mundong ito.”
  rationale: Ang literal na larawan ay malinaw at marangal sa Tagalog, samantalang ang talababa ay nagbibigay ng idyomatikong kahulugan nang hindi isinasara ang matalinghagang puwersa ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga ninuno” bilang natural na katumbas ng literal na “kanyang mga ama,” at pinanatili ang imahen ng liwanag. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
