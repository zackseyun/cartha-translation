  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: tl
  text: Sapagkat habang nabubuhay siya, ipinapalagay niyang pinagpala ang kanyang sarili,[a] at pinupuri ka ng mga tao kapag pinabubuti mo ang iyong kalagayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas malapit sa anyo ng Hebreo: “pinagpapala ng kanyang kaluluwa ang sarili nito habang nabubuhay siya.” Maaari ring isalin: “itinuturing niyang mapalad ang kanyang sarili habang nabubuhay siya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan na kaugnay ng naunang pahayag sa argumento ng salmo.
- source_word: נַפְשׁוֹ
  choice: ang kanyang sarili
  rationale: Bagaman literal na tumutukoy sa “kanyang kaluluwa,” ang נֶפֶשׁ ay maaari ring tumukoy sa buong sarili ng isang tao. Mas likas sa makabagong Tagalog ang “ang kanyang sarili,” habang pinananatili sa talababa ang mas literal na anyo.
- source_word: בְּחַיָּיו
  choice: habang nabubuhay siya
  rationale: Malinaw at likas na ipinahahayag nito ang panahong saklaw ng kilos.
- source_word: יְבָרֵךְ
  choice: ipinapalagay niyang pinagpala
  rationale: Sa konteksto, ang tao ay kumikilala o tumitingin sa sarili bilang pinagpala dahil sa kanyang kasaganaan. Iniiwasan nitong ipahiwatig na literal niyang iginagawad sa sarili ang pagpapala, ngunit itinatala sa talababa ang mas pormal na pagbasa.
- source_word: וְיוֹדֻךָ
  choice: at pinupuri ka ng mga tao
  rationale: Ang maramihang pandiwa ay may di-tiyak na simuno; nililinaw ng “mga tao” ang pangkalahatang papuri ng lipunan. Pinanatili ang biglang paglipat sa ikalawang panauhan ng Hebreo.
- source_word: כִּי
  choice: kapag
  rationale: Ipinahahayag dito ang kalagayan o pagkakataon kung kailan pinupuri ng mga tao ang kinakausap.
- source_word: תֵיטִיב לָךְ
  choice: napabubuti mo ang sarili mong kalagayan
  rationale: Ipinapakita nito ang causative at pansariling pakinabang ng parirala nang hindi ito binabasa bilang moral na “paggawa ng mabuti.” Nananatili rin ang diwa ng pag-unlad o pagtatagumpay sa konteksto.
theological_decisions:
- issue: Ang kahulugan ng pagpapala sa sarili
  choice: Ipinapalagay ng mayaman na pinagpala ang kanyang sarili.
  alternative: Literal niyang pinagpapala ang kanyang kaluluwa o sarili.
  rationale: Idyomatiko ang נַפְשׁוֹ at malamang na tumutukoy sa sariling pagkilala bilang pinagpala, ngunit hindi isinasara ang mas literal na pagbasa kaya inilagay iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pagbabago mula sa ikatlong panauhan (“siya”) tungo sa ikalawang panauhan (“ka/mo”), gaya ng nasa Hebreo. Iniwasan ang “gumagawa ka ng mabuti para sa sarili mo” dahil maaari itong mapagkamalang moral na kabutihan sa halip na pagbuti ng kalagayan o kasaganaan.
