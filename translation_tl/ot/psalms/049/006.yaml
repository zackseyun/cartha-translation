translation:
  language: tl
  text: ang mga nagtitiwala sa kanilang kayamanan at nagmamapuri sa dami ng kanilang yaman—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagmamapuri sa kasaganaan ng kanilang yaman.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong חַיִל ay maaari ring mangahulugang “lakas” o “mga ari-arian,” ngunit ipinahihiwatig ng katapat nitong “yaman” na materyal na kayamanan ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: ang mga nagtitiwala
  rationale: Ang Qal participle na may pantukoy ay ginagamit bilang pangngalan at tumutukoy sa mga taong palagiang nagtitiwala; natural ito sa makabagong Tagalog.
- source_word: עַל
  choice: sa
  rationale: Kasama ng בּטח, tinutukoy ng pang-ukol ang pinagtitiwalaan; ang “nagtitiwala sa” ang likas na katumbas sa Tagalog.
- source_word: חֵילָם
  choice: kanilang kayamanan
  rationale: Maaaring mangahulugan ang חַיִל ng lakas, hukbo, mga ari-arian, o kayamanan. Dahil kat parallel nito ang עֹשֶׁר, nangingibabaw rito ang diwang materyal na kayamanan.
- source_word: וּבְרֹב
  choice: at ... ang dami ng
  rationale: Ang רֹב ay nagsasaad ng kasaganaan o malaking dami. Ang “dami ng” ay malinaw at natural habang pinananatili ang paralelismong patula.
- source_word: עָשְׁרָם
  choice: kanilang yaman
  rationale: Ang עֹשֶׁר ay tuwirang tumutukoy sa yaman o kayamanan. Ginamit ang “yaman” upang mapanatili ang bahagyang pagkakaiba ng magkatugmang mga salita.
- source_word: יִתְהַלָּלוּ
  choice: ipinagmamalaki
  rationale: Ang Hitpael ng הלל sa kontekstong ito ay nangangahulugang magmalaki o magmayabang tungkol sa isang bagay. Ang “ipinagmamalaki” ay malinaw at akma sa karaniwang makabagong Tagalog.
