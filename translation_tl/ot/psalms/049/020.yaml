  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: tl
  text: Ang taong may dangal ngunit hindi nakauunawa ay tulad ng mga hayop na namamatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay inihalintulad sa mga hayop; naging katulad nila.”
    reason: Pinananatili ang posibleng pagbasa sa pangwakas na pandiwa bilang “naging katulad” sa halip na “namatay.”
lexical_decisions:
- source_word: אָדָם
  choice: ang tao
  rationale: Ginamit ang “tao” sa pangkalahatan, gaya ng kasabihan sa Hebreo; likas ito sa modernong Filipino at hindi nililimitahan ang tinutukoy sa isang partikular na lalaki.
- source_word: בִּיקָר
  choice: may dangal
  rationale: Ipinahahayag nito ang kalagayan ng pagiging marangal o mataas ang katayuan. Maikli, natural, at angkop sa tonong patula ang “may dangal.”
- source_word: וְלֹא יָבִין
  choice: ngunit hindi nakauunawa
  rationale: Pinananatili ang kilos ng pandiwang בין, na tumutukoy sa pagkaunawa o pagkilala nang may discernment, at ang “ngunit” ay malinaw na naghahayag ng pagsalungat sa taglay na dangal.
- source_word: נִמְשַׁל
  choice: ay tulad ng
  rationale: Ang Niphal ng משל ay nagpapahayag ng paghahalintulad. Ang “ay tulad ng” ang pinakanatural na katumbas sa Filipino nang hindi nagiging matigas ang pananalita.
- source_word: כַּבְּהֵמוֹת
  choice: mga hayop
  rationale: Malawak ang saklaw dito ng בְּהֵמוֹת at hindi lamang tumutukoy sa mga alagang hayop; malinaw at karaniwan sa modernong Filipino ang “mga hayop.”
- source_word: נִדְמוּ
  choice: na namamatay
  rationale: Pinili ang pagbasa na tumutukoy sa pagkapahamak o pagkamatay, na umaayon sa temang hindi naililigtas ng dangal ang tao mula sa kamatayan. Inilagay sa talababa ang posibleng pagbasa na tumutukoy sa pagkakatulad.
theological_decisions:
- issue: Kahulugan ng pangwakas na pandiwang נִדְמוּ
  choice: Binasa bilang “namamatay,” na naglalarawan sa mga hayop at nagbibigay-diin sa mortalidad.
  alternative: Maaaring basahin bilang “naging katulad nila” o “kahawig nila,” kaya ang huling bahagi ay paghahayag ng pagkakatulad sa mga hayop.
  rationale: Ang pagbasa tungkol sa kamatayan ay akma sa paulit-ulit na tema ng salmo na hindi mapipigil ng dangal o yaman ang kamatayan. Gayunman, tunay na posible ang pagbasa tungkol sa pagkakatulad, kaya hindi ito tahimik na inalis kundi pinanatili sa talababa.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal at patula. Ginamit ang pangkalahatang “tao,” ang likas na pariralang “may dangal,” at ang malinaw na “hindi nakauunawa.”
