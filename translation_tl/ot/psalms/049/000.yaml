  text: For the choirmaster[a]. Of the sons of Korah[b]. A psalm.
translation:
  language: tl
  text: Para sa tagapanguna ng mga mang-aawit.[a] Ukol sa mga anak ni Kora.[b] Isang salmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa tagapanguna ng mga mang-aawit.” Maaaring isalin sa alinman sa dalawang paraan ang pang-ukol na Hebreo sa mga pamagat ng salmo.
    reason: lexical_alternative
  - marker: b
    text: O “Para sa” o “Ng mga anak ni Kora.” Malamang na ipinahihiwatig ng pamagat ang kaugnayan sa pangkat ng mga Koraíta, ngunit hindi nito tiyak na sinasabi kung ang tinutukoy ay pag-akda, pagtatanghal, o pagkabilang sa isang koleksiyon.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Sa mga pamagat ng salmo, tumutukoy ang מְנַצֵּחַ sa taong namamahala sa pagtatanghal ng musika. Pinananatili ng “Para sa” ang karaniwang gamit ng pang-ukol na ל, habang malinaw at likas sa Filipino ang tungkuling musikal.
- source_word: לִבְנֵי
  choice: Ukol sa mga anak ni
  rationale: Maaaring magpahiwatig ang ל ng kaugnayan, pag-aalay, o atribusyon. Hindi tiyak na nilulutas ng “Ukol sa” kung sila ang may-akda, tagapagtanghal, o pangkat na kinauugnayan ng salmo.
- source_word: קֹרַח
  choice: Kora
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal na Korah.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ang מִזְמוֹר sa isang awit na may saliw na musika; ang “salmo” ang natural at kinikilalang panumbas sa Filipino.
