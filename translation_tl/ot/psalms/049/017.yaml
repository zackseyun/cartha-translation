lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag kaugnay ng naunang kaisipan sa salmo.
- source_word: בְמוֹתוֹ
  choice: sa kanyang kamatayan
  rationale: 'Ipinapahayag ng ב ang panahon: sa oras ng kanyang pagkamatay.'
- source_word: לֹא ... יִקַּח הַכֹּל
  choice: wala siyang madadalang anuman
  rationale: Literal na ‘hindi niya kukunin ang lahat/buo’; sa konteksto ng kamatayan, natural sa Filipino ang ‘walang madadalang anuman,’ habang ipinapaliwanag sa talababa ang anyong Hebreo.
- source_word: יֵרֵד אַחֲרָיו
  choice: hindi bababang kasunod niya
  rationale: Pinananatili ang konkretong larawan ng pagbaba at ang di-tahasang patutunguhan sa Hebreo.
- source_word: כְּבוֹדוֹ
  choice: ang kanyang karangalan
  rationale: Maaaring tumukoy ang כָּבוֹד sa karangalan, kaluwalhatian, kaningningan, o yaman at katayuan. Ang ‘karangalan’ ay natural sa konteksto ngunit hindi lubusang nililimitahan ang saklaw.
theological_decisions:
- issue: Ipinahihiwatig na pagbaba pagkamatay
  choice: Panatilihin ang ‘bababa’ nang hindi tinutukoy ang patutunguhan.
  alternative: Hindi siya susundan ng kanyang karangalan sa libingan o Sheol.
  rationale: Ipinahihiwatig ng Hebreo ang kamatayan, libingan, o Sheol, ngunit hindi nito tahasang binabanggit ang patutunguhan; hindi dapat gawing mas tiyak ang pahayag kaysa sa pinagmulan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang ‘madadalang’ upang natural na ihayag ang konteksto ng pagpanaw, habang pinanatili sa talababa ang literal na kayarian. Ang ‘bababang kasunod niya’ ay sadyang bahagyang makata upang maingatan ang larawan at tunay na kalabuan ng Hebreo.
