  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: tl
  text: Tunay na walang sinumang makatutubos sa isang kapatid[a], ni makapagbibigay sa Diyos ng pantubos para sa kanya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tunay na hindi matutubos ng isang tao ang kanyang kapatid, ni maibibigay sa Diyos ang halaga ng pantubos para sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: isang kapatid
  rationale: Ang אָח ay literal na “kapatid.” Sa konteksto, maaari itong tumukoy sa kapwa-tao at hindi lamang sa kapatid sa dugo. Pinananatili ng “isang kapatid” ang isahan at hindi nito ipinapalagay ang pagmamay-aring “kanyang.”
- source_word: פָדֹה יִפְדֶּה
  choice: makatutubos
  rationale: Ang infinitive absolute na kasama ng imperfect ay nagbibigay-diin sa pandiwa. Kasama ng pagtanggi, likas na ipinahahayag sa Filipino ng “walang sinumang makatutubos” ang lubos na kawalan ng kakayahang tumubos.
- source_word: אִישׁ
  choice: walang sinuman
  rationale: Bagaman panlalaking isahan ang אִישׁ, kumakatawan ito rito sa sinumang tao. Ang “walang sinuman” ay natural sa modernong Filipino at malinaw na saklaw ang sangkatauhan nang hindi binabago ang diwa.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Sa konteksto ng salmo, ang אֱלֹהִים ay tumutukoy sa iisang Diyos.
- source_word: כָּפְרוֹ
  choice: pantubos para sa kanya
  rationale: Ang כֹּפֶר ay halagang ibinabayad upang mapalaya o mailigtas ang isang tao. Ang “pantubos” ay nagpapanatili sa ekonomikong larawan nang hindi nagdaragdag ng di-kinakailangang sakripisyal na kahulugan.
- source_word: אָח לֹא
  choice: Tunay na walang sinumang makatutubos sa isang kapatid
  rationale: 'Mahirap ang ayos ng pambungad na Hebreo: maaaring unawain ang אָח bilang “kapatid” na layon, samantalang ang diin ay nagmumula sa negatibong pahayag at sa anyong פָדֹה יִפְדֶּה. Ang salin ay malinaw at natural habang pinananatili ang pangunahing leksikal na nilalaman.'
theological_decisions:
- issue: Kahulugan ng כֹּפֶר kaugnay ng Diyos
  choice: pantubos na ibinibigay sa Diyos para sa buhay ng isang tao
  alternative: halagang pantubos sa pangkalahatan, o kabayarang pampalubag-loob
  rationale: Itinuturo ng talata na hindi kayang bilhin ng tao mula sa Diyos ang kaligtasan ng kapwa mula sa kamatayan. Pinananatili ng “pantubos” ang larawan ng kabayaran nang hindi ipinapasok ang isang ganap na teolohiya ng paghahain na hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “makatutubos” at “makapagbibigay” bilang pormal ngunit pangkaraniwang mga anyo. Pinanatili ang em dash dahil nagpapatuloy ang pangungusap sa kasunod na talata.
