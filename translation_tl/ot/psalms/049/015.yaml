id: PSA.49.15
reference: Psalms 49:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: tl
  text: Ngunit tutubusin ng Diyos ang buhay ko mula sa kamay ng Sheol[a], sapagkat kukunin niya ako[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Sheol ay salitang Hebreo para sa dako ng mga patay; maaari ring isaling “libingan” o “dako ng mga patay.”
    reason: lexical_alternative
  - marker: b
    text: O “tatanggapin niya ako.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahahayag dito ang malinaw na pagsalungat sa sinapit ng mayayaman at ng lahat ng taong namamatay sa naunang konteksto.
- source_word: יִפְדֶּה
  choice: tutubusin
  rationale: Pinananatili nito ang diwa ng paglaya o pagsagip mula sa kapangyarihan ng kamatayan nang hindi nililimitahan ang paraan ng pagliligtas.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o buong sarili, hindi lamang sa isang kaluluwang hiwalay sa katawan.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang konkretong larawang Hebreo ng kamay bilang kapangyarihan o pagkakahawak; nauunawaan din ito sa natural na Filipino.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Ang transliterasyon ay hindi nagpapakitid sa kahulugan tungo lamang sa libingan at hindi rin nag-aangkat ng mas huling konsepto ng impiyerno; ipinaliliwanag ito sa talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita nitong ang kasunod na pahayag ang batayan o paliwanag ng pagtitiwala ng salmista.
- source_word: יִקָּחֵנִי
  choice: kukunin niya ako
  rationale: Malapit ito sa payak at sadyang malawak na kahulugan ng לָקַח, habang hindi ipinapasya kung ang diin ay pagtanggap ng Diyos, pagkuha tungo sa kaniyang piling, o ibang anyo ng pagliligtas.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinananatili ang tradisyonal na transliterasyon dahil hindi tiyak ang eksaktong kahulugan o gamit ng terminong ito.
theological_decisions:
- issue: Kahulugan ng נַפְשִׁי kaugnay ng kamatayan at pagliligtas
  choice: Isinaling “ang buhay ko.”
  alternative: “ang kaluluwa ko” o “ako”
  rationale: Mas angkop sa saklaw ng נֶפֶשׁ dito ang buhay o buong persona; iniiwasan nitong ipasok sa teksto ang mas makitid na paghihiwalay ng katawan at kaluluwa.
- issue: Saklaw ng pagtubos mula sa Sheol
  choice: Pinanatiling malawak ang pahayag na tutubusin ang buhay mula sa kamay ng Sheol at kukunin ng Diyos ang nagsasalita.
  alternative: Tahasang pagtukoy sa muling pagkabuhay, buhay pagkamatay, o pagsagip lamang mula sa maagang kamatayan
  rationale: Nagpapahayag ang Hebreo ng matibay na pagtitiwala sa pagliligtas ng Diyos ngunit hindi nito sistematikong tinutukoy ang eksaktong anyo o panahon nito.
- issue: Kahulugan ng יִקָּחֵנִי
  choice: “kukunin niya ako”
  alternative: “tatanggapin niya ako”
  rationale: Ang literal na “kukunin” ay nagpapanatili ng tunay na kaluwagan ng pandiwa; ang “tatanggapin” ay isang makatuwirang pagbasa ngunit mas interpretatibo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang matalinghagang “kamay ng Sheol,” ang terminong “Sheol,” at ang “Selah” upang huwag palabuin o labis na ipaliwanag ang tulang Hebreo. Ang mga pananda ng talababa na [a] at [b] ay kapuwa nasa pangunahing teksto.
