  text: I will incline my ear to a proverb[c][b][a]; I will open my riddle with the lyre.
translation:
  language: tl
  text: Ikiling ko ang aking tainga sa isang kawikaan[a]; bubuksan ko sa saliw ng lira[b] ang aking palaisipan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “talinghaga” o “kasabihang nagtuturo.” Malawak ang saklaw ng salitang Hebreo na מָשָׁל.
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng lira.” Ang Hebreong כִּנּוֹר ay isang instrumentong de-kuwerdas na kahawig ng lira; tradisyonal din itong isinasaling “alpa.”
    reason: lexical_alternative
  - marker: c
    text: O “bugtong,” “mahiwagang kasabihan,” o “hiwaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה
  choice: Ikiling ko
  rationale: Ang Hiphil ng נטה ay nagpapahayag ng sinasadyang pagkiling o pagbaling. Ang “ikiling ang tainga” ay likas at marangal na idyomang Filipino para sa masusing pakikinig.
- source_word: לְמָשָׁל
  choice: sa isang kawikaan
  rationale: Maaaring tumukoy ang מָשָׁל sa kawikaan, talinghaga, o kasabihang nagtuturo. Sa konteksto ng awit ng karunungan, ang “kawikaan” ang pinakamaikli at angkop, habang pinananatili sa talababa ang lehitimong alternatibo.
- source_word: אָזְנִי
  choice: ang aking tainga
  rationale: Isahan ang Hebreo at natural sa Filipino ang pariralang “ikiling ang aking tainga.”
- source_word: אֶפְתַּח
  choice: bubuksan ko
  rationale: Literal na “buksan” ang פתח. Pinananatili nito ang metapora ng paghahayag o paglalahad ng palaisipan nang hindi ito nililimitahan sa “ipapaliwanag.”
- source_word: בְּכִנּוֹר
  choice: sa saliw ng lira
  rationale: Ang כִּנּוֹר ay instrumentong de-kuwerdas na kahawig ng lira. Sa Filipino, malinaw at natural na ipinahahayag ng “sa saliw ng lira” ang instrumental o musikal na gamit ng pang-ukol ב.
- source_word: חִידָתִי
  choice: ang aking palaisipan
  rationale: Ang חִידָה ay palaisipan, bugtong, o mahiwagang kasabihan na nangangailangan ng pag-unawa. Mas angkop ang “palaisipan” sa marangal na konteksto ng karunungan kaysa sa karaniwang “bugtong.”
