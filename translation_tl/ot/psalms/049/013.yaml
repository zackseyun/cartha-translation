  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: tl
  text: Ganito ang landas nila—ang kanilang kahangalan[a]; gayunman, ang mga taong darating pagkaraan nila ay nalulugod sa kanilang sinasabi[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kanilang pagtitiwala.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “mga taong darating pagkaraan nila” sa kanilang mga inapo. Sa Hebreo, ang “kanilang sinasabi” ay literal na “kanilang bibig.”
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה דַרְכָּם
  choice: Ganito ang landas nila
  rationale: Ang זֶה ay nagpapakilala ng buod na paghatol sa naunang paglalarawan, at ang דֶּרֶךְ ay nagpapanatili sa larawan ng landas habang tumutukoy rin sa paraan ng pamumuhay.
- source_word: כֵּסֶל לָמוֹ
  choice: ang kanilang kahangalan
  rationale: Maaaring mangahulugan ang כֶּסֶל ng kahangalan o, sa ilang konteksto, pagtitiwala. Dito, ang appositional na parirala ay natural na naghahayag ng mapanuring hatol sa kanilang landas; ang לָמוֹ ay ipinahayag sa likas na Tagalog bilang pang-angking 'kanilang.'
- source_word: וְאַחֲרֵיהֶם
  choice: gayunman, ang mga sumusunod sa kanila
  rationale: Maaaring tumukoy ang parirala sa mga taong dumarating pagkaraan nila o sumusunod sa kanilang halimbawa, at hindi kailangang limitahan sa mga literal na inapo. Ipinapakita ng 'gayunman' ang kabalintunaan ng patuloy na pagsang-ayon.
- source_word: בְּפִיהֶם
  choice: sa kanilang sinasabi
  rationale: Literal itong 'sa kanilang bibig,' ngunit ang bibig ay metonimiya para sa sinasabi o mga pahayag. Ang salin ay natural sa modernong Tagalog habang pinananatili sa talababa ang literal na anyo.
- source_word: יִרְצוּ
  choice: nalulugod
  rationale: Ang Qal ng רצה ay maaaring mangahulugang malugod, sang-ayunan, o tanggapin. Ang 'nalulugod' ay nagpapanatili sa positibong tugon nang hindi ito nililimitahan sa pormal na pagsang-ayon.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili ang tradisyonal na transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan nito at malamang na isa itong panandang pangmusika o panliturhiya.
theological_decisions:
- issue: Tinutukoy ng וְאַחֲרֵיהֶם
  choice: mga taong sumusunod sa kanila o dumarating pagkaraan nila
  alternative: kanilang mga inapo
  rationale: Pinahihintulutan ng Hebreo ang dalawang pagkaunawa. Hindi nililimitahan ng pangunahing salin sa biyolohikal na mga inapo ang tinutukoy, ngunit itinatala sa talababa ang posibilidad na iyon.
- issue: Kahulugan ng כֶּסֶל
  choice: kahangalan
  alternative: pagtitiwala o kumpiyansa
  rationale: Sa konteksto ng Awit 49, mapanuri ang pagtingin sa seguridad na nakasalig sa kayamanan. Gayunman, tunay na leksikal na posibilidad ang 'pagtitiwala,' kaya hindi ito ikinukubli at inilalagay sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang talinghaga ng 'landas,' ginawang natural ang metonimiyang 'bibig,' at iniwasang tukuyin nang labis kung ang mga sumunod ay pangkalahatang tagasunod o mismong mga inapo.
