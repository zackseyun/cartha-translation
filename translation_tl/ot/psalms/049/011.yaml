  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: tl
  text: Iniisip nilang mananatili magpakailanman ang kanilang mga bahay[a], at ang kanilang mga tirahan sa sali’t salinlahi; pinangalanan nila ang mga lupain ayon sa kanilang sariling mga pangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ibang pagkaunawa sa tekstong Hebreo: “Ang kanilang mga libingan ang kanilang mga bahay magpakailanman, ang kanilang mga tirahan sa sali’t salinlahi.”'
    reason: textual_variant
  - marker: b
    text: Sa literal, “tinawag nila sa kanilang mga pangalan sa ibabaw ng mga lupain.” Ang diwa ay pinangalanan nila ang mga lupain o ari-ariang lupa ayon sa sarili nilang mga pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: Iniisip nila
  rationale: Ang Masoretikong pagbasa ay tumutukoy sa kalooban o panloob na pag-iisip nila. Ginawang likas sa modernong Tagalog ang eliptikong sugnay na Hebreo nang hindi inaalis ang alternatibong pagbasa na “mga libingan,” na inilagay sa talababa.
- source_word: בָּתֵּימוֹ
  choice: kanilang mga bahay
  rationale: Tuwirang kahulugan ng בַּיִת at kaagapay ng “mga tirahan” sa kasunod na linya.
- source_word: לְעוֹלָם
  choice: mananatili magpakailanman
  rationale: Ipinahahayag ang inaakalang walang-hanggang pananatili; idinagdag ang pandiwang “mananatili” upang maging natural ang sugnay na walang tahasang pandiwa sa Hebreo.
- source_word: מִשְׁכְּנֹתָם
  choice: kanilang mga tirahan
  rationale: Pangkalahatang tawag sa mga lugar na tinitirhan at angkop na katambal ng “mga bahay.”
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahing panahon
  rationale: Likas at marangal na idyomang Tagalog para sa pagpapatuloy sa sunod-sunod na mga salinlahi.
- source_word: קָרְאוּ בִשְׁמוֹתָם
  choice: ipinangalan nila sa kanilang sarili
  rationale: Sa konteksto, ang קרא ay nangangahulugang “pangalanan,” at ang parirala ay nagsasaad na ginamit nila ang sarili nilang mga pangalan.
- source_word: עֲלֵי אֲדָמוֹת
  choice: ang mga lupain
  rationale: Tumutukoy sa mga lupain o ari-ariang lupa. Ang “mga lupain” ay malinaw at hindi labis na nagpapakahulugan.
