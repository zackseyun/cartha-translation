  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: tl
  text: Ang bibig ko'y magsasalita ng karunungan[a], at ang pagmumuni-muni ng puso ko'y pagkaunawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga salitang Hebreo para sa “karunungan” at “pagkaunawa” ay nasa anyong maramihan, ngunit malamang na ginagamit bilang mga pangngalang abstrakto.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: ang bibig ko
  rationale: Pinananatili ang konkretong larawang Hebreo ng bibig bilang pinagmumulan ng pananalita; natural din ito sa Filipino.
- source_word: יְדַבֵּר
  choice: magsasalita
  rationale: Ang imperfect ay angkop na isalin bilang hinaharap sa konteksto ng ipinahahayag na layunin ng mang-aawit.
- source_word: חָכְמוֹת
  choice: karunungan
  rationale: Bagaman maramihan ang anyong Hebreo, malamang na abstraktong maramihan ito; ang isahang abstraktong 'karunungan' ang pinakanatural sa Filipino.
- source_word: הָגוּת
  choice: pagbubulay
  rationale: Ipinahahayag nito ang panloob na pagninilay o pagmumuni ng puso at pinananatili ang paralelismo sa pananalita ng bibig.
- source_word: לִבִּי
  choice: ng puso ko
  rationale: Tuwirang pinananatili ang ugnayang genitibo at ang biblikal na larawan ng puso bilang sentro ng pag-iisip at pagninilay.
- source_word: תְבוּנוֹת
  choice: pagkaunawa
  rationale: Tulad ng חָכְמוֹת, maramihan ang anyo ngunit malamang na abstrakto ang gamit; natural na katumbas sa Filipino ang 'pagkaunawa.'
