  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: tl
  text: Bakit ako matatakot sa masasamang araw, kapag pinaliligiran ako ng kasamaan ng mga nagtatangkang magpabagsak sa akin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kapag pinaliligiran ako ng kasamaan ng aking sakong.” Maaaring tumukoy ang Hebreong parirala sa kasamaang nasa aking sakong, sa sarili kong kasalanang sumusunod sa akin, o sa kasamaan ng mga taong tumutugis at nagtatangkang magpabagsak sa akin.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Bakit ako matatakot
  rationale: Pinananatili ang retorikal na tanong at ang diwang modal ng imperpektibo sa natural na Tagalog.
- source_word: בִּימֵי רָע
  choice: sa masasamang araw
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang malawak na saklaw ng רָע, na maaaring tumukoy sa kasamaan o kapahamakan.
- source_word: עָוֹן
  choice: kasamaan
  rationale: Ipinapahayag nito ang moral na bigat ng עָוֹן nang hindi nililimitahan ang salita sa pagkakasala, pananagutan, o kaparusahan lamang.
- source_word: עֲקֵבַי
  choice: mga nagtatangkang magpabagsak sa akin
  rationale: Ang literal na 'aking mga sakong' ay malabo sa Tagalog; ipinahihiwatig ng salitang kaugnay ng 'sakong' ang paninilo, pagpapadapa, o pag-atake mula sa likuran. Inilalagay sa talababa ang literal at iba pang posibleng pagbasa.
- source_word: יְסוּבֵּנִי
  choice: pinaliligiran ako
  rationale: Natural at malinaw na katumbas ng pandiwang nangangahulugang pumalibot o kumubkob.
theological_decisions:
- issue: Kahulugan ng mahirap na pariralang עֲוֹן עֲקֵבַי
  choice: Kasamaan ng mga taong nagtatangkang magpabagsak sa salmista
  alternative: Kasamaan na nasa kanyang mga sakong, sarili niyang kasalanang sumusunod sa kanya, o kasamaan ng mga tumutugis sa kanya
  rationale: Akma sa konteksto ang pagbasa tungkol sa mga kaaway, ngunit siksik at tunay na malabo ang Hebreo. Kaya ginawang malinaw ang pangunahing pagbasa habang pinananatili sa talababa ang literal na anyo at mga alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “magpabagsak” sa halip na ang mas literal ngunit malabong “mga sakong,” habang ang tunay na kalabuan ng Hebreo ay pinanatili sa talababa.
