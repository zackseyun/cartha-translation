translation:
  language: tl
  text: upang patuloy na mabuhay siya magpakailanman at hindi makita ang hukay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “pagkabulok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: upang ... mabuhay
  rationale: Sa konteksto, ipinagpapatuloy ng anyong pandiwa ang di-makakamit na layunin o bunga mula sa naunang linya. Likas na ipinahahayag ng “upang ... mabuhay” ang ugnayang ito sa Filipino.
- source_word: עוֹד
  choice: patuloy
  rationale: Ipinahihiwatig dito ang pagpapatuloy ng buhay; malinaw at natural itong naihahatid ng “patuloy.”
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Pinananatili nito ang diwa ng walang-hanggang tagal sa isang marangal at karaniwang anyo ng modernong Filipino.
- source_word: לֹא
  choice: hindi
  rationale: Tuwirang katumbas na pananggi sa kasunod na pandiwa.
- source_word: יִרְאֶה
  choice: makita
  rationale: Pinananatili nito ang Hebreong idyomang “makita,” habang hinahayaan ang konteksto na magpahiwatig ng kahulugang “maranasan.”
- source_word: הַשָּׁחַת
  choice: ang Hukay
  rationale: Pinananatili ng “Hukay” ang kongkretong larawang patula tungkol sa kamatayan nang hindi nililimitahan ang salita sa libingan o pagkabulok lamang.
theological_decisions:
- issue: Kahulugan ng שחת sa konteksto ng kamatayan
  choice: ang Hukay
  alternative: ang libingan; pagkabulok
  rationale: Saklaw ng Hebreong larawan ang hukay, libingan, pagkasira, o pagbaba sa kamatayan. Pinananatili ng “Hukay” ang lawak at tensiyong patula, samantalang inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “magpakailanman” bilang pamilyar na pananalitang patula, at nilagyan ng malaking titik ang “Hukay” upang ipakitang isa itong natatanging larawang patula para sa hantungan ng kamatayan.
