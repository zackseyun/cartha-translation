language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: tl
  text: Gaya ng mga tupa, itinakda sila para sa Sheol[a]; kamatayan ang magpapastol sa kanila. Maghahari sa kanila ang mga matuwid pagsapit ng umaga.[b] Ang kanilang anyo[c] ay mauubos sa Sheol, malayo sa maringal na tahanan nito.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Sheol ay ang daigdig o kalagayan ng mga patay; mas malawak ang kahulugan nito kaysa sa “libingan” lamang.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Mangingibabaw sa kanila ang mga matuwid sa umaga.”'
    reason: alternative_reading
  - marker: c
    text: 'Mahirap ang Hebreo. Maaari ring unawain ang salitang isinaling “anyo” bilang “bato” o “lakas”: “ang kanilang bato/lakas ay mauubos.”'
    reason: lexical_alternative
  - marker: d
    text: 'Mahirap at hindi tiyak ang huling pariralang Hebreo. Ang panghalip ay isahan at maaaring iba ang tinutukoy. Maaari ring isalin nang humigit-kumulang: “Uubusin sila ng Sheol mula sa maringal na tahanan nito,” o katulad nito.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Gaya ng mga tupa
  rationale: Pinananatili ang paghahambing sa isang kawan at ang larawan ng mga nilalang na pinapatnubayan ng pastol.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: itinakda sila para sa Sheol
  rationale: Ang שׁית ay nagpapahayag ng paglalagay o pagtatalaga, at ang ל ay tumutukoy sa kanilang hantungan. Hindi pinaliit ang Sheol sa pisikal na libingan lamang.
- source_word: מָוֶת יִרְעֵם
  choice: kamatayan ang magpapastol sa kanila
  rationale: Pinananatili ang personipikasyon ng kamatayan at ang mapait na pagpapatuloy ng larawan ng mga tupa; ang רעה ay karaniwang nangangahulugang magpastol o mangalaga ng kawan.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: Paghaharian sila ng mga matuwid
  rationale: Ang pagbasa na mula sa רדה, 'maghari o mamahala,' ang pinakaangkop dito. Ang יְשָׁרִים ay mas tiyak na 'mga matuwid' kaysa sa mas malawak na 'mga banal.'
- source_word: לַבֹּקֶר
  choice: pagsapit ng umaga
  rationale: Likas ito sa modernong Tagalog at hindi ipinapasiya kung literal, patula, o eskatolohikal ang umaga.
- source_word: וְצוּרָם
  choice: ang kanilang anyo
  rationale: Bagaman mahirap ang tekstong Hebreo at maaari ring unawain ang צּוּר bilang 'bato' o 'lakas,' ang 'anyo' ay nababagay sa kasunod na ideya ng pagkaubos. Inilalahad ang ibang posibilidad sa talababa.
- source_word: לְבַלּוֹת
  choice: ay mauubos
  rationale: Ipinahahayag ng בלה ang pagkasira, pagkabulok, o pagkaubos. Ang anyong pandiwa ay natural sa Tagalog.
- source_word: מִזְּבֻל לוֹ
  choice: malayo sa maringal nilang tahanan
  rationale: Ang זְבֻל ay maaaring tumukoy sa isang mataas o maringal na tirahan. Dahil napakahirap ng sintaks at reperensiya ng panghalip, pinili ang kontekstuwal na pagbasa at malinaw na minarkahan ang kawalang-katiyakan.
theological_decisions:
- issue: Kahulugan ng שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Ang Hebreong termino ay mas malawak kaysa sa isang hukay na libingan. Ang transliterasyon, na may maikling paliwanag, ay umiiwas sa pagpasok ng mas huling sistemang doktrinal.
- issue: Kahulugan ng 'umaga'
  choice: pagsapit ng umaga
  alternative: sa kinaumagahan; sa umaga ng muling pagbabangon o paghuhukom
  rationale: Hindi tahasang tinutukoy ng talata kung anong partikular na pangyayaring teolohikal ang sinasagisag ng umaga, kaya pinanatili ang talinghagang bukas sa konteksto.
- issue: Pamamahala ng mga matuwid
  choice: Paghaharian sila ng mga matuwid
  alternative: Mangingibabaw sa kanila ang mga matuwid; yuyurakan sila ng mga matuwid
  rationale: Pinananatili ang pagbabaligtad ng kalagayan nang hindi tinutukoy ang eksaktong paraan o panahon ng paghahari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matinding larawang patula—mga tupa na ang pastol ay kamatayan—at hindi nilutas sa pangunahing teksto ang mga tunay na kahirapan sa וְצוּרָם at מִזְּבֻל לוֹ. Ginamit ang “Sheol” upang mapanatili ang lawak ng konseptong Hebreo, na ipinaliwanag sa talababa.
