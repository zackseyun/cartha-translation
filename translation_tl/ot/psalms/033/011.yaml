  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: tl
  text: 'Ang payo ni Yahweh ay nananatili magpakailanman;

    ang mga balak ng kanyang puso, sa sali’t salinlahi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “layunin” o “panukala” para sa “payo,” at “mga iniisip” o “mga layunin” para sa “mga balak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: payo
  rationale: Saklaw ng salita ang payo, panukala, at layunin. Pinananatili ng “payo” ang aspektong mapagpasya at mapanukala nang hindi nililimitahan ang kahulugan sa isang natupad nang pasiya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na pahayag sa Filipino para sa walang-hanggang pananatili.
- source_word: תַּעֲמֹד
  choice: nananatili
  rationale: Ipinahahayag dito ng imperfect ang isang pangkalahatan at nagpapatuloy na katotohanan; malinaw itong naihahatid ng kasalukuyang aspektong “nananatili.”
- source_word: מַחְשְׁבוֹת
  choice: mga balak
  rationale: Maaaring tumukoy ang salita sa mga iniisip, balak, o layunin. Ang “mga balak” ay angkop sa paralelismo sa “payo” at nagpapahiwatig ng sinasadyang hangarin.
- source_word: לִבּוֹ
  choice: kanyang puso
  rationale: Pinananatili ang Hebreong larawan ng puso bilang sentro ng pag-iisip at pagpapasya, sa halip na paliitin ito sa “isip” lamang.
- source_word: לְדֹר וָדֹר
  choice: sa sali’t salinlahi
  rationale: Karaniwan at malinaw na idyomang Filipino para sa pagpapatuloy sa bawat sunod-sunod na salinlahi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ginagamit ng talata ang Tetragrammaton bilang personal na pangalan. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Ugnayan ng payo at mga balak ng Diyos
  choice: Pinanatili ang dalawang magkaugnay ngunit hindi lubusang magkaparehong termino
  alternative: Isalin kapwa bilang “layunin”
  rationale: Ang paralelismong Hebreo ay nag-uugnay sa עֲצָה at מַחֲשָׁבוֹת ngunit hindi nangangailangang gawing iisang kahulugan ang mga ito; iniiwasan nitong tahimik na alisin ang leksikal na lawak ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang semicolon upang maipakita ang balanseng paralelismo ng dalawang linya; pinanatili ang Hebreong larawang “puso” at ang pangalang “Yahweh.”
