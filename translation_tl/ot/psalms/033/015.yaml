  text: ang humuhubog sa mga puso nilang lahat[a] at nakauunawa sa lahat ng kanilang ginagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na humuhubog sa kanilang mga puso nang sama-sama.” Maaaring isalin ang Hebreong יַחַד bilang “nang sama-sama,” ngunit maaari rin nitong idiing hinuhubog niya ang mga puso ng bawat isa sa kanilang lahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: ang humuhubog
  rationale: Ang substantibong Qal participle ng יצר ay naglalarawan sa Diyos bilang siyang patuloy at katangi-tanging humuhubog; natural at marangal sa Filipino ang “ang humuhubog.”
- source_word: יַחַד לִבָּם
  choice: sa puso nilang lahat
  rationale: 'Ipinahahayag nito ang distributibong diwa: hinuhubog niya ang puso ng bawat isa sa kanilang lahat. Pinananatili sa talababa ang tunay na posibilidad na ang יַחַד ay nangangahulugang “nang sama-sama.”'
- source_word: לִבָּם
  choice: puso nilang lahat
  rationale: Bagaman isahan ang “puso” sa Hebreo na may pangmaramihang hulapi, natural sa Filipino ang distributibong isahan sa pariralang ito at hindi nito ipinahihiwatig na iisa lamang ang puso nila.
- source_word: הַמֵּבִין
  choice: nakauunawa
  rationale: Ang Hiphil participle ng בין ay tumutukoy sa pag-unawa o pagkilala nang may malalim na pagkaunawa; malinaw at kasalukuyan ang “nakauunawa.”
- source_word: אֶל כָּל מַעֲשֵׂיהֶם
  choice: sa lahat ng kanilang ginagawa
  rationale: Sa ugnayan nito sa בין, minamarkahan ng אֶל ang pinatutungkulan ng pag-unawa. Ang “lahat ng kanilang ginagawa” ay natural sa modernong Filipino at saklaw ang lahat ng kanilang mga gawa.
theological_decisions:
- issue: Saklaw ng tinutukoy sa talata
  choice: Hindi nililimitahan ang mga puso at gawa sa mga hari o bansa lamang; tumutukoy ang mga ito sa lahat ng tao sa naunang konteksto.
  alternative: Maaaring ipakahulugan nang mas makitid na tumutukoy lamang sa mga hari o mga bansa sa kalapit na konteksto.
  rationale: Sa mga talatang 13–15, ang saklaw ay “lahat ng mga anak ng tao” at “lahat ng naninirahan sa lupa.” Pinananatili ng salin ang malawak na saklaw nang hindi nagdaragdag ng paliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ginagawa” sa halip na mas pormal na “mga gawa” upang maging natural, habang nananatili ang kabuuang saklaw ng מַעֲשֵׂיהֶם. Inilagay ang panandang [a] sa pangunahing teksto.
