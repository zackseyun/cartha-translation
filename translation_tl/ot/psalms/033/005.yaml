id: PSA.33.5
reference: Psalms 33:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: tl
  text: Iniibig niya ang katuwiran at katarungan; ang lupa ay puspos ng tapat na pag-ibig[a] ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “di-nagmamaliw na pag-ibig.” Ang Hebreong חֶסֶד (hesed) ay nagpapahiwatig ng pag-ibig na matatag, maawain, at tapat sa ugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Iniibig niya
  rationale: Ang Qal participle ay naglalarawan sa palagian o likas na ginagawa ni Yahweh. Ang pandiwang “Iniibig niya” ay natural sa modernong Tagalog at nagpapanatili sa aspektong ito.
- source_word: צְדָקָה
  choice: katuwiran
  rationale: Sa tambalan nito sa מִשְׁפָּט, tumutukoy ito sa pagiging matuwid o sa kung ano ang tama, kaya naiiwasang ulitin lamang ang diwa ng “katarungan.”
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Dito ay tumutukoy ito sa makatarungang paghatol at kaayusang moral sa malawak na diwa.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag ng חֶסֶד ang pag-ibig na may katapatan, awa, at matibay na paninindigan sa ugnayan. Malinaw at likas sa Tagalog ang “tapat na pag-ibig” nang hindi gumagamit ng mabigat na terminong teolohikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מָלְאָה
  choice: ay puspos ng
  rationale: 'Bagaman anyong perfect sa Hebreo, statibo ang diwa nito rito: ang lupa ay nasa kalagayang punô. Ang “puspos” ay maikli, marangal, at angkop sa panulaan.'
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa malawak at kosmikong konteksto ng awit, tumutukoy ito sa buong daigdig, hindi lamang sa isang partikular na lupain. Natural na naihahayag ito sa Tagalog bilang “ang lupa.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: di-nagmamaliw na pag-ibig
  rationale: Pinagsasama ng napiling salin ang pag-ibig at katapatan nang hindi nililimitahan ang salita sa isang teknikal na konsepto lamang ng tipan. Inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “puspos” upang mapanatili ang maikli at makatang himig ng salmo; malinaw pa rin ito sa karaniwang mambabasa. Ang tandang-talababa [a] ay inilagay kaagad matapos ang pariralang tinutukoy nito.
