  source_fidelity: Tumpak ang salin sa Hebreong teksto. Ang “Iniibig niya” ay angkop sa habitual/descriptive na Qal participle; malinaw na naihihiwalay ng “katuwiran at katarungan” ang צְדָקָה at מִשְׁפָּט. Ang “ang lupa ay puspos ng” ay wastong stative na pagsasalin ng מָלְאָה, at ang “Yahweh” ay wastong paglilipat ng יהוה.
