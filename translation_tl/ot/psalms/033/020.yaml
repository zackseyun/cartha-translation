  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: tl
  text: 'Buong pagkatao natin ay naghihintay kay Yahweh[a];

    siya ang ating tulong at ating kalasag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Ang ating kaluluwa ay naghihintay kay Yahweh.” Ang “kaluluwa” rito ay tumutukoy sa buong sarili o buong kalooban ng pamayanan, hindi lamang sa isang di-materyal na bahagi ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Buong pagkatao natin
  rationale: Ang נֶפֶשׁ na may hulaping pangmaramihang unang panauhan ay tumutukoy rito sa sama-samang sarili o buong kalooban ng pamayanan. Iniiwasan ng saling ito ang di-likas at posibleng mapanlinlang na “ang ating kaluluwa,” na maaaring unawaing isang hiwalay lamang na di-materyal na bahagi.
- source_word: חִכְּתָה
  choice: ay naghihintay
  rationale: Ang חכה ay paghihintay na may inaasahan. Ang progresibong kasalukuyan ay likas sa Tagalog at angkop sa patuloy na tindig ng pamayanan sa tula, kahit perpektong anyo ang Hebreo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagpapakilala sa taong hinihintay; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kay.” Pinanatili ang personal na pangalang Yahweh.
- source_word: עֶזְרֵנוּ
  choice: ating tulong
  rationale: Pinananatili nito ang abstraktong pangngalang עֵזֶר at ang nominal na pahayag, sa halip na baguhin itong “tagatulong.”
- source_word: וּמָגִנֵּנוּ
  choice: at ating kalasag
  rationale: Ang מָגֵן ay literal na “kalasag.” Malinaw pa rin sa modernong Tagalog ang larawang metaporikal ng pag-iingat.
- source_word: הוּא
  choice: siya ang
  rationale: Ang malayang panghalip ay may diin sa sugnay na walang pandiwa. Likas na naipahahayag ito sa Tagalog sa hulma na “siya ang,” nang hindi idinaragdag ang ideya ng “siya lamang.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Saklaw ng נַפְשֵׁנוּ
  choice: Buong pagkatao natin
  alternative: Ang ating kaluluwa; Tayo
  rationale: Pinananatili ang kolektibo at panloob na diin ng Hebreo, ngunit hindi ito nililimitahan sa doktrinal na konsepto ng isang di-materyal na bahagi ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “buong pagkatao natin” upang likas na maipahayag ang kolektibong singular ng Hebreo; pinanatili naman ang konkretong metaporang “kalasag” at ang pangalang Yahweh.
