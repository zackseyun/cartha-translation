  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: tl
  text: 'Umawit kayo sa kanya ng bagong awit;

    tumugtog kayo nang mahusay, nang may sigaw ng kagalakan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring mangahulugang “nang may malakas na pagbubunyi” o, sa ilang konteksto, “nang may malakas na hudyat o bugso ng trumpeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Maramihang pautos ng שׁיר. Ang “umawit kayo” ang tuwiran, natural, at marangal na katumbas sa modernong Tagalog.
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang ל na may panlaping panghalip na panlalaking isahan ay tumutukoy sa pinag-uukulan ng awit. Pinananatili ng “sa kanya” ang direksiyon ng papuri nang hindi nagdaragdag sa teksto.
- source_word: שִׁיר חָדָשׁ
  choice: bagong awit
  rationale: Tuwirang pinananatili ang karaniwang pariralang pansalmo at ang liturhikal na dating nito.
- source_word: הֵיטִיבוּ
  choice: nang mahusay
  rationale: Ang Hiphil na pautos ng יטב ay ginagamit dito sa diwang “gawin nang mabuti” at inilalarawan ang pagtugtog. Ang “nang mahusay” ay natural na naghahatid ng panawagan sa mahusay na pagganap.
- source_word: נַגֵּן
  choice: tumugtog kayo
  rationale: Ang נגן ay karaniwang tumutukoy sa pagtugtog, lalo na ng instrumentong de-kuwerdas. Malinaw at likas sa Tagalog ang “tumugtog kayo.”
- source_word: בִּתְרוּעָה
  choice: nang may sigaw ng kagalakan
  rationale: Maaaring tumukoy ang תְּרוּעָה sa malakas na sigaw, masayang pagbubunyi, hudyat sa labanan, o tunog na tulad ng trumpeta. Sa konteksto ng papuri, ang “sigaw ng kagalakan” ang pinakaangkop habang pinananatili sa talababa ang saklaw ng kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng panlalaking panghalip na isahan sa לוֹ
  choice: Ang “kanya” ay tumutukoy sa PANGINOON, ang Diyos na pinupuri sa konteksto ng salmo.
  alternative: Panatilihin lamang ang panghalip nang hindi tahasang pinapangalanan sa mismong talata.
  rationale: Malinaw sa kalapit na mga talata ang tinutukoy, ngunit pinanatili sa pangunahing teksto ang panghalip ng Hebreo upang hindi magdagdag ng pangngalang wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang anyong maramihang pautos at ang dalawang magkatimbang na panawagan. Ang “nang may sigaw ng kagalakan” ay malinaw na kaugnay ng mahusay na pagtugtog, habang kinikilala sa talababa ang tunay na lawak ng kahulugan ng תְּרוּעָה.
