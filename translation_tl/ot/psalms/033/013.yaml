  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: tl
  text: Mula sa langit, tumitingin si Yahweh; nakikita niya ang lahat ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng mga anak ng tao,” isang patulang pananalita para sa buong sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Mula sa langit
  rationale: Ang מִן ay nagsasaad ng pinagmumulan o kinaroroonan ng pagtingin. Ang “mula sa langit” ang likas na parirala sa modernong Tagalog at malinaw na naghahatid ng makalangit na pananaw.
- source_word: הִבִּיט
  choice: tumitingin
  rationale: Ang Hiphil ng נבט ay tumutukoy sa nakatuon na pagtingin. Bagaman anyong perfect ang pandiwa, inilalarawan dito ng tula ang isang pangkalahatan at patuloy na katotohanan, kaya ang pangkasalukuyang “tumitingin” ang angkop.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: רָאָה
  choice: nakikita niya
  rationale: Ang ראה ay karaniwang nangangahulugang “makakita.” Gaya ng naunang pandiwa, ang anyong perfect ay nauunawaan dito bilang pangkalahatan at nagpapatuloy na katotohanan.
- source_word: כָּל
  choice: lahat
  rationale: Ang כָּל na sinusundan ng pariralang maramihan ay kolektibong tumutukoy sa kabuuan.
- source_word: בְּנֵי הָאָדָם
  choice: lahat ng tao
  rationale: Literal itong “mga anak ng tao,” isang Hebreong patulang idyoma para sa mga tao bilang kabuuan. Ang “lahat ng tao” ay natural at malinaw sa modernong Tagalog, habang inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kolektibong kahulugan ng בְּנֵי הָאָדָם
  choice: lahat ng tao
  alternative: lahat ng mga anak ng tao; buong sangkatauhan
  rationale: Ang parirala ay isang panlalaking Hebreong idyoma na kolektibong tumutukoy sa lahat ng tao, hindi lamang sa mga lalaking anak. Iniiwasan ng pangunahing salin ang posibleng maling pagkaunawa sa Tagalog, at pinananatili ng talababa ang literal na larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling paralelismo ng tulang Hebreo at ginamit ang pangkasalukuyang anyo upang ipahayag ang patuloy at pangkalahatang pagkilos ni Yahweh.
