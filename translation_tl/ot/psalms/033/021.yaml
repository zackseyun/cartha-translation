  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: tl
  text: Sapagkat nagagalak ang ating puso sa kanya[b][a], dahil nagtiwala tayo sa kanyang banal na pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat magagalak ang ating puso sa kanya,” kung uunawain ang Hebrew imperfect bilang hinaharap sa halip na kasalukuyan o nakagawiang kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang “ating puso”; isa itong kolektibong pagpapahayag para sa panloob na buhay ng buong bayan.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ng unang כִּי na ang talata ay nagbibigay ng dahilan para sa naunang pahayag; likas at marangal sa Filipino ang “Sapagkat.”
- source_word: בּוֹ
  choice: sa kanya
  rationale: Ang panlalaking isahang hulapi ay tumutukoy sa personal na tinutukoy sa konteksto, ang PANGINOON, nang hindi idinaragdag ang banal na pangalan na wala mismo sa talata.
- source_word: יִשְׂמַח
  choice: nagagalak
  rationale: Maaaring ipahayag ng Hebrew imperfect ang kasalukuyan o nakagawiang kalagayan, gayundin ang tiyak na hinaharap. Pinili ang kasalukuyang “nagagalak” ayon sa daloy ng pagpapahayag, habang inilalagay sa talababa ang alternatibong hinaharap.
- source_word: לִבֵּנוּ
  choice: ang ating puso
  rationale: Pinananatili ang isahang kolektibong “puso” ng Hebreo, na kumakatawan sa nagkakaisang kalooban at panloob na buhay ng bayan.
- source_word: כִּי
  choice: dahil
  rationale: Ang ikalawang כִּי ay tahasang nagbibigay ng batayan ng kanilang kagalakan.
- source_word: בְשֵׁם קָדְשׁוֹ
  choice: sa kanyang banal na pangalan
  rationale: Sa paggamit kasama ng בָטַח, ang pariralang may בְּ ay tumutukoy sa pinagtitiwalaan. Ang “banal na pangalan” ay malinaw at tumpak sa relihiyosong konteksto.
- source_word: בָטָחְנוּ
  choice: nagtiwala tayo
  rationale: Ang Hebrew perfect ay nagsasaad ng matatag at naganap nang pagtitiwala na may kabuluhan sa kasalukuyan. Sa natural na Filipino, naipahihiwatig ito ng “nagtiwala tayo” sa konteksto.
theological_decisions:
- issue: Tinutukoy ng mga panlalaking isahang panghalip sa בּוֹ at קָדְשׁוֹ
  choice: Tumutukoy ang mga panghalip sa PANGINOON sa agarang konteksto ng awit.
  alternative: Pangkalahatang pagtukoy sa Diyos nang walang tahasang kaugnayan sa pangalang tipan.
  rationale: Paulit-ulit na tinutukoy ng nakapaligid na konteksto ang PANGINOON, kaya likas na bumabalik sa kanya ang mga panghalip. Gayunman, hindi tahasang lumilitaw ang banal na pangalan sa talatang ito, kaya “kanya” ang ginamit sa halip na idagdag ang “PANGINOON.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang isahang kolektibong “ating puso” at ang pagkakasunod ng mga talababa gaya ng pagkakalagay sa tekstong sinusuri.
