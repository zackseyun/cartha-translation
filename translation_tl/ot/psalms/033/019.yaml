  text: to deliver their soul from death and to keep them alive in famine[a].
translation:
  language: tl
  text: upang iligtas sa kamatayan ang kanilang buhay[a] at panatilihin silang buhay sa panahon ng taggutom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang sarili” o “ang kanilang kaluluwa.” Ang salitang Hebreo na nefesh ay maaaring tumukoy sa buhay, sarili, o kaluluwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: upang iligtas
  rationale: Ang Hiphil infinitive ng נצל ay nagpapahayag ng pagliligtas o pagpapalaya mula sa panganib. Ang “upang iligtas” ay likas sa Filipino at pinananatili ang ugnayang layunin nito sa naunang talata.
- source_word: מִמָּוֶת
  choice: sa kamatayan
  rationale: Ang מן kasama ng מָוֶת ay naghahayag ng paglalayo o pagliligtas mula sa kamatayan. Sa pariralang Filipino na “iligtas sa kamatayan,” malinaw at natural na naihahatid ang diwang ito.
- source_word: נַפְשָׁם
  choice: ang kanilang buhay
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa buhay, sarili, o kaluluwa. Sa konteksto ng pisikal na pagliligtas mula sa kamatayan at pagpapanatiling buhay sa taggutom, “buhay” ang pinakanatural, habang inilalahad sa talababa ang tunay na lawak ng salita.
- source_word: וּלְחַיּוֹתָם
  choice: at panatilihin silang buhay
  rationale: Ang anyong ito ng חיה ay nangangahulugang panatilihing buhay o ingatan ang buhay. Ang salin ay malinaw, kasalukuyan, at pinananatili ang pagkakaiba nito sa unang sugnay.
- source_word: בָּרָעָב
  choice: sa panahon ng taggutom
  rationale: Karaniwang tumutukoy ang רָעָב dito sa malawakang taggutom, hindi lamang sa personal na pagkagutom. Nililinaw ng “sa panahon ng” ang pangyayaring kinalalagyan nang hindi dinaragdagan ang diwa.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “kanilang buhay” sa pangunahing teksto dahil ito ang pinakanatural sa konteksto, ngunit pinanatili sa talababa ang mas malawak na saklaw ng Hebreong נֶפֶשׁ.
