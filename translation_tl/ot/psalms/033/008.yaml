  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: tl
  text: 'Matakot kay Yahweh ang buong daigdig;

    manginig sa harap niya ang lahat ng naninirahan sa mundo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “matakot sa kanya nang may sindak.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng takot, sindak, o panginginig dahil sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: Matakot
  rationale: Ang Qal imperfect na 3mp ng ירא ay may puwersang panghihikayat sa kontekstong ito. Pinananatili ng “matakot” ang saklaw ng takot na may pagpipitagan, sa halip na pahinain ito bilang simpleng paggalang.
- source_word: מֵיְהוָה
  choice: kay Yahweh
  rationale: Kasunod ng ירא, ang מן ay likas na tumutukoy sa kinatatakutan. Ginamit ang “kay” upang maging natural sa Filipino, at isinalin ang banal na pangalang יְהוָה bilang “Yahweh.”
- source_word: כָּל הָאָרֶץ
  choice: ang buong daigdig
  rationale: Dahil katapat nito ang lahat ng naninirahan sa תֵבֵל, pandaigdig ang saklaw ng אֶרֶץ rito at hindi isang partikular na lupain.
- source_word: מִמֶּנּוּ
  choice: sa kanya
  rationale: Bagaman literal na maaaring “mula sa kanya,” minamarkahan dito ng מן ang pinagmumulan o layon ng pangilabot. Natural sa Filipino ang “mangilabot sa kanya.”
- source_word: יָגוּרוּ
  choice: mangilabot
  rationale: Ang גור ay nagpapahayag ng matinding takot o sindak. Ang “mangilabot” ay nagpapanatili sa masidhing puwersa nito at sa pagkakaiba nito sa ירא sa unang taludtod.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: ang lahat ng naninirahan sa mundo
  rationale: Ang participial construct na יֹשְׁבֵי ay tumutukoy sa mga naninirahan, at ang תֵבֵל ay ang mundong tinatahanan. Malinaw at natural ang pariralang Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Uri ng takot na hinihingi sa Diyos
  choice: Pinanatili ang parehong takot at pangilabot
  alternative: Paggalang o paghanga lamang
  rationale: Ang magkatulad na taludtod ay gumagamit ng ירא at גור, na parehong may tunay na sangkap ng takot habang maaari ring magpahiwatig ng pagpipitagan. Hindi pinahina ang tensiyong ito bilang payak na paggalang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang magkatugmang “Matakot” at “mangilabot” upang mapanatili ang paralelismo at ang magkaibang lakas ng dalawang pandiwang Hebreo. Ang “daigdig” at “mundo” ay natural na pagkakaiba-iba para sa magkatapat na אֶרֶץ at תֵבֵל.
