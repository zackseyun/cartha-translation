  text: כֹּנֵ֣ס כַּ֭/נֵּד מֵ֣י הַ/יָּ֑ם נֹתֵ֖ן בְּ/אֹצָר֣וֹת תְּהוֹמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: tl
  text: Tinitipon niya ang tubig ng dagat na parang bunton[a]; inilalagay niya sa mga kamalig ang malalalim na tubig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parang tambak”; inuunawa naman ito ng ilan bilang “parang pader,” batay sa kahawig na paglalarawan sa tubig sa ibang mga talata.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga kalaliman.” Maaaring tumukoy ang maramihang salitang Hebreo sa kailaliman ng karagatan o sa sinaunang malalalim na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: Tinitipon niya
  rationale: Ang Qal participle ng כנס ay naglalarawan ng pagtitipon o pag-iipon. Likas sa makabagong Filipino ang “tinitipon” at napananatili nito ang masiglang paglalarawan ng kilos.
- source_word: כַּנֵּד
  choice: na parang bunton
  rationale: Ang נֵד ay karaniwang tumutukoy sa bunton o masa na natipon, lalo na ng tubig. Pinananatili ng “parang bunton” ang tuwirang paghahambing at larawang patula.
- source_word: מֵי הַיָּם
  choice: ang tubig ng dagat
  rationale: Tuwirang katumbas ito ng pariralang konstruktong “mga tubig ng dagat,” ngunit ang pang-isahang kolektibong “tubig” ay mas natural sa Filipino.
- source_word: נֹתֵן
  choice: inilalagay niya
  rationale: Malawak ang saklaw ng נתן at dito ay nangangahulugang paglalagay. Malinaw at karaniwan ang “inilalagay niya,” at kaagapay ito ng “tinitipon niya.”
- source_word: בְּאֹצָרוֹת
  choice: sa mga kamalig
  rationale: Ang אֹצָר ay imbakan, kamalig, o kabang-yaman. Sa larawang kosmolohiko ng talata, malinaw na naipahihiwatig ng “mga kamalig” ang mga imbakan nang hindi ipinapasok ang di-kailangang ideya ng kayamanan.
- source_word: תְּהוֹמוֹת
  choice: ang malalalim na tubig
  rationale: Ang maramihang anyo ng תְּהוֹם ay tumutukoy sa malalalim na bahagi ng karagatan o sa malalalim na tubig. Mas nauunawaan sa modernong Filipino ang “malalalim na tubig” kaysa sa literal ngunit hindi likas na “mga kalaliman,” habang nananatili ang pangmaramihang diwa.
theological_decisions:
- issue: Larawang kosmolohiko ng paghahari ng Diyos sa dagat
  choice: Panatilihin ang kongkretong mga larawang “bunton” at “mga kamalig.”
  alternative: Ipaliwanag nang abstrakto bilang “kinokontrol niya ang dagat.”
  rationale: Ipinapahayag ng Hebreong tula ang kapangyarihan ng Diyos sa pamamagitan ng matingkad at sadyang patulang paglalarawan. Ang pag-aalis sa mga larawang ito ay magpapaplat sa teksto at tahimik na magpapakahulugan dito.
- issue: Saklaw ng תְּהוֹמוֹת
  choice: Isaling “malalalim na tubig” at ilahad sa talababa ang posibleng pagtukoy sa kailaliman ng karagatan o sinaunang malalim na tubig.
  alternative: Tiyak na tukuyin lamang ang modernong sahig o kailaliman ng karagatan.
  rationale: Maaaring taglay ng Hebreo ang karaniwang larawang pandagat at ang mas malawak na kosmolohikong pahiwatig. Hindi dapat piliting pumili ang salin kung nananatiling bukás ang pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bunton” upang mapanatili ang konkretong paghahambing at “mga kamalig” para sa patulang larawan ng mga imbakan. Inilagay ang [a] kasunod ng “bunton” at ang [b] kasunod ng “malalalim na tubig,” ayon sa mismong salitang ipinapaliwanag ng bawat talababa.
