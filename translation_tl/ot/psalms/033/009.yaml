translation:
  language: tl
  text: Sapagkat siya ay nagsalita, at naganap[a]; siya ay nag-utos, at iyon ay tumayong matatag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “iyon ay umiral.” Napakaikli ng Hebreo: “at nangyari/naganap” o “at umiral.”'
    reason: lexical_alternative
  - marker: b
    text: O “iyon ay tumayo” o “iyon ay naitatag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o batayan ng naunang panawagan; likas at marangal sa Filipino ang “Sapagkat.”
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang tahasang panghalip at ang bahagyang diin nito sa dalawang magkatulad na sugnay nang hindi nagdaragdag ng “mismo,” na maaaring maging labis.
- source_word: אָמַר
  choice: nagsalita
  rationale: Ang “nagsalita” ay angkop sa marangal na tulang wika at malinaw na tumutukoy sa makapangyarihang pagsasalita ng Diyos.
- source_word: וַיְהִי
  choice: iyon ay nagkaroon
  rationale: Maikli at resultative ang Hebreo. Ipinapahayag ng “nagkaroon” na ang tinutukoy ay umiral bunga ng pagsasalita, habang iniiwasan ang mas mahabang pagpapaliwanag na “nalikha.”
- source_word: צִוָּה
  choice: nag-utos
  rationale: Tuwirang katumbas ito ng pandiwang tumutukoy sa pagbibigay ng utos at pinananatili ang paralelismo sa “nagsalita.”
- source_word: וַיַּעֲמֹד
  choice: iyon ay nanatiling matatag
  rationale: Pinagsasama nito ang konkretong larawan ng pagtayo at ang kontekstuwal na diwa ng pagiging matibay o naitatag. Ang talababa ay nagpapanatili sa mas literal na mga posibilidad.
theological_decisions:
- issue: Wikang nagsasaad ng resulta ng salita at utos ng Diyos
  choice: “iyon ay nagkaroon” / “iyon ay nanatiling matatag”
  alternative: “iyon ay umiral” / “iyon ay tumayo”; o “iyon ay nalikha” / “iyon ay naitatag”
  rationale: Ipinakikita ng pares ang agaran at namamalaging bisa ng salita ng Diyos nang hindi nagdaragdag ng paliwanag na doktrinal na lampas sa maikli at matalinghagang Hebreo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at balanseng paralelismo ng tulang Hebreo, pati ang dalawang paglitaw ng tahasang “siya.”
