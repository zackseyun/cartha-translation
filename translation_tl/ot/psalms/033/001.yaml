  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: tl
  text: Magbunyi kayo sa Yahweh, kayong mga matuwid; ang pagpupuri ay nararapat sa mga matuwid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Umawit kayo nang may galak sa Yahweh,” o “ang pagpupuri ay nababagay sa mga matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: Magbunyi kayo
  rationale: Ang maramihang pautos ay tumutukoy sa hayag at masiglang pagpapahayag ng galak. Likas sa modernong Filipino ang “magbunyi” at napapanatili nito ang masayang tinig ng pandiwa nang hindi nililimitahan iyon sa pag-awit lamang.
- source_word: צַדִּיקִים
  choice: kayong mga matuwid
  rationale: Ginagawang malinaw ng “kayong” na tuwirang kinakausap ang mga taong inilalarawan bilang matuwid.
- source_word: בַּיהוָה
  choice: dahil kay Yahweh
  rationale: Ipinahahayag nito si Yahweh bilang saligan o dahilan ng pagbubunyi. Iniiwasan nito ang di-likas na “magbunyi kay Yahweh,” na madaling maunawaan sa Filipino bilang direksiyon lamang ng kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לַיְשָׁרִים
  choice: sa mga may pusong matuwid
  rationale: Ipinahahayag ang יְשָׁרִים bilang mga taong tuwid ang kalooban o asal, habang naiiwasan ang eksaktong pag-uulit sa salin ng צַדִּיקִים.
- source_word: נָאוָה
  choice: ay nararapat
  rationale: Saklaw nito ang diwa ng bagay na angkop, marapat, o kaaya-aya sa isang tao.
- source_word: תְהִלָּה
  choice: ang pagpupuri
  rationale: Natural na pangngalang Filipino ito para sa gawa o pagpapahayag ng papuri, nang hindi ipinapalagay na awit lamang ang anyo nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang ginamit ng tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magbunyi” upang mapanatili ang masigla at hayag na galak ng Hebreo; ang mga talababa ay nagpapanatili sa posibilidad ng pag-awit at sa saklaw ng נָאוָה bilang nararapat, maganda, o nababagay.
