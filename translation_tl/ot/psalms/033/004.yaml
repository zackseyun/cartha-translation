  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: tl
  text: 'Sapagkat matuwid ang salita ni Yahweh,

    at lahat ng ginagawa niya ay may katapatan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapakita ang sanhi o batayan ng naunang panawagan na magpuri, gaya ng causal na gamit ng כִּי.
- source_word: יָשָׁר
  choice: matuwid
  rationale: Natural na Filipino para sa pagiging tama at walang lihis, habang pinananatili ang moral na diwa ng salitang Hebreo.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Ang דָּבָר ay tumutukoy rito sa ipinahayag o sinabi ni Yahweh; ang 'salita' ang malinaw at karaniwang katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: at lahat ng ginagawa niya
  rationale: Bagaman pang-isahan ang מַעֲשֵׂהוּ, kolektibo ang saklaw nito. Likas sa modernong Filipino ang 'lahat ng ginagawa niya' at malinaw na tumutukoy sa kabuuan ng kanyang gawain.
- source_word: בֶּאֱמוּנָה
  choice: ay may katapatan
  rationale: Ipinahahayag ang pagiging maaasahan, matatag, at tapat ng lahat ng ginagawa ni Yahweh, habang pinananatili ang anyong pangngalan ng אֱמוּנָה.
theological_decisions:
- issue: Pagbibigay ng pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pang-isahang מַעֲשֵׂהוּ
  choice: lahat ng ginagawa niya
  alternative: lahat ng kanyang gawa
  rationale: Kolektibo ang pang-isahang anyo at tumutukoy sa kabuuan ng pagkilos ni Yahweh. Mas natural sa kasalukuyang Filipino ang napiling parirala nang hindi nililimitahan ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatimbang na dalawang linya ng tulang Hebreo at iniwasan ang artipisyal na pariralang 'nasa katapatan.'
