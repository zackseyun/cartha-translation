lexical_decisions:
- source_word: בִּדְבַר
  choice: Sa pamamagitan ng salita ni
  rationale: 'Ipinahahayag nito ang instrumental na gamit ng ב: ang salita ni Yahweh ang paraang ginamit sa paggawa sa kalangitan.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Likas at marangal na katumbas sa modernong Tagalog na tumutukoy sa mga langit o makalangit na nasasakupan, hindi lamang sa nakikitang langit.
- source_word: נַעֲשׂוּ
  choice: ginawa
  rationale: Tuwirang isinasalin ang malawak na pandiwang עשה bilang 'ginawa' at hindi pinatitindi tungo sa 'nilalang,' na mas karaniwang katumbas ng ibang pandiwa.
- source_word: וּבְרוּחַ
  choice: at sa pamamagitan ng hininga ng
  rationale: Sa paralelismo sa 'kanyang bibig,' ang 'hininga' ang pinakamalinaw na pangunahing diwa, habang pinananatili sa talababa ang posibleng 'Espiritu.'
- source_word: פִּיו
  choice: kanyang bibig
  rationale: Pinananatili ang makatang paglalarawan at ang paralelismo ng 'salita' at 'hininga ng kanyang bibig.'
- source_word: כָּל־צְבָאָם
  choice: ang lahat ng hukbo nito
  rationale: Ang צבא kaugnay ng kalangitan ay tumutukoy sa buong hukbo o hanay ng mga bagay sa langit. Ang panghalip na 'nito' ay tumutukoy sa kolektibong pangngalang 'kalangitan.'
theological_decisions:
- issue: Ang רוּחַ sa paglikha at ang posibleng pagtukoy sa Espiritu
  choice: hininga
  alternative: Espiritu
  rationale: Mas pinapaboran ng agarang paralelismong 'salita ni Yahweh' at 'hininga ng kanyang bibig' ang 'hininga.' Hindi nito ginagawang mas tiyak kaysa sa Hebreo ang personal na pagtukoy sa Espiritu, ngunit pinananatili sa talababa ang tunay at makabuluhang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinananatili ang maikli at balanseng paralelismo ng tulang Hebreo, pati ang larawang 'salita' at 'hininga ng kanyang bibig.'
