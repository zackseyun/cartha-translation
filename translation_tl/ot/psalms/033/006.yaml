  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: tl
  text: Sa pamamagitan ng salita ni Yahweh ay ginawa ang kalangitan, at sa pamamagitan ng hininga[a] ng kanyang bibig ay ginawa rin ang buong hukbo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu.” Ang salitang Hebreo ay maaaring mangahulugang “hininga,” “hangin,” o “espiritu.”
