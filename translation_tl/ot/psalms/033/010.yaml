  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: tl
  text: 'Binibigo ni Yahweh[a] ang balak ng mga bansa;

    hinahadlangan niya ang mga panukala ng mga bayan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring isalin bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הֵפִיר
  choice: binibigo
  rationale: Ipinahihiwatig ng Hiphil ng פרר na ginagawang hindi mabisa o hindi matagumpay ang isang balak; natural at aktibo ang “binibigo” sa Filipino.
- source_word: עֲצַת
  choice: ang balak
  rationale: Ang עֵצָה ay maaaring mangahulugang payo, pasiya, o balak. Sa konteksto ng mga bansa at sa paralelismo nito sa מַחְשְׁבוֹת, “balak” ang pinakanatural.
- source_word: גּוֹיִם
  choice: ng mga bansa
  rationale: Tumutukoy ito sa mga bansa sa pangkalahatan, hindi lamang sa mga di-Judio.
- source_word: הֵנִיא
  choice: hinahadlangan
  rationale: Ipinapahayag ng pandiwa ang pagpigil o paglihis sa isang nilalayon upang hindi ito maisakatuparan.
- source_word: מַחְשְׁבוֹת
  choice: ang mga panukala
  rationale: Bagaman maaari itong tumukoy sa mga kaisipan o hangarin, dito ay tumutukoy ito sa mga binalak na hakbang; pinananatili ng “mga panukala” ang pagkakaiba nito sa “balak” sa unang hati.
- source_word: עַמִּים
  choice: ng mga bayan
  rationale: Pinananatili ng “mga bayan” ang makatang pagkakaiba nito sa גּוֹיִם, “mga bansa,” habang inilalahad ang maramihang kolektibong diwa.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON,” habang inilalagay sa talababa ang isa pang nakagawiang anyo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang magkatulad ngunit hindi ganap na magkasingkahulugang hanay—“balak/mga panukala” at “mga bansa/mga bayan”—upang maipakita ang paralelismong Hebreo.
