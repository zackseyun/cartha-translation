  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: tl
  text: 'Hindi naliligtas ang hari sa pamamagitan ng malaking hukbo[a];

    ang mandirigma ay hindi nasasagip sa pamamagitan ng malaking lakas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking lakas” o “malaking puwersang militar.” Ang salitang Hebreo ay maaaring tumukoy sa hukbo, lakas, o mga yamang militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: hindi
  rationale: Ang אֵין ay nagkakaila sa kasunod na pahayag. Sa Filipino, likas at tuwiran ang “hindi inililigtas” sa halip na piliting panatilihin ang anyong eksistensiyal.
- source_word: הַמֶּלֶךְ
  choice: Ang hari
  rationale: Pinananatili nito ang tiyak na pantukoy ng Hebreo at ang pangkalahatang pahayag sa anyong tiyak na isahan.
- source_word: נוֹשָׁע
  choice: inililigtas
  rationale: Ang Nifal na participle ng ישׁע ay nagsasaad ng pagkaligtas o pagkakaligtas. Ang pasibong “inililigtas” ay tapat sa anyo at malinaw sa kontekstong militar.
- source_word: בְּרָב חָיִל
  choice: ng malaking hukbo
  rationale: Instrumental ang בְּ, at maaaring tumukoy ang חָיִל sa lakas, yaman, o puwersang militar. Sa konteksto ng hari at mandirigma, natural ang konkretong “malaking hukbo,” habang itinatala sa talababa ang mas malawak na kahulugan.
- source_word: גִּבּוֹר
  choice: ang mandirigma
  rationale: Tumutukoy ito sa isang malakas o magiting na taong nakikipaglaban. Ang “mandirigma” ay natural sa modernong Filipino at akma sa paralelismong militar.
- source_word: לֹא יִנָּצֵל
  choice: hindi nakaliligtas
  rationale: Ang Nifal ng נצל ay maaaring mangahulugang mailigtas, makaligtas, o makatakas. Pinili ang “nakaliligtas” upang maging natural at mapanatili ang bahagyang baryasyon mula sa unang taludtod.
- source_word: בְּרָב כֹּחַ
  choice: dahil sa matinding lakas
  rationale: Nagsasaad ang parirala ng paraan o saligan ng pagliligtas. Ang “matinding lakas” ay malinaw na naghahatid ng saganang pisikal na kapangyarihan; itinatala sa talababa ang mas literal na alternatibo.
