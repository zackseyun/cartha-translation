translation:
  language: tl
  text: Maling pag-asa ang kabayo para sa pagliligtas[a]; gaano man kalaki ang lakas nito, hindi ito makapagliligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Mapanlinlang ang kabayo bilang pag-asa sa pagliligtas.” Maikli ang Hebreo; ang diwa ay hindi maaasahan ang kabayo bilang paraan ng pagliligtas. Ang “pagliligtas” ay maaari ring isaling “kaligtasan” o “tagumpay,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Hindi maaasahan
  rationale: Ang שֶׁקֶר ay literal na tumutukoy sa kasinungalingan o panlilinlang. Sa pahayag na ito, ipinahihiwatig nitong mapanlinlang at walang saysay na sandigan ang kabayo; natural itong ipinahahayag sa modernong Tagalog bilang “hindi maaasahan.”
- source_word: הַסּוּס
  choice: ang kabayo
  rationale: Bagaman maaaring pangkalahatang uri ang tinutukoy, pinananatili ng “ang kabayo” ang tiyak na anyo ng Hebreo at natural pa rin itong basahin bilang pangkalahatang pahayag.
- source_word: לִתְשׁוּעָה
  choice: para sa pagliligtas
  rationale: Maaaring mangahulugan ang תְּשׁוּעָה ng kaligtasan, pagliligtas, o tagumpay. Dahil militar ang konteksto at kaagapay nito ang יְמַלֵּט, ang “pagliligtas” ang malinaw na pagpili nang hindi nililimitahan ang salita sa espirituwal na kaligtasan o sa tagumpay lamang.
- source_word: וּבְרֹב חֵילוֹ
  choice: kahit napakalakas nito
  rationale: Literal itong “at sa kasaganaan ng lakas nito.” Ipinakikita ng ikalawang sugnay na hindi nakapagliligtas ang kabayo sa kabila ng malaking lakas nito; malinaw at natural sa Tagalog ang konsesibong “kahit,” bagaman ipinapaliwanag nito ang ugnayang pahiwatig sa Hebreo.
- source_word: לֹא יְמַלֵּט
  choice: hindi ito makapagliligtas
  rationale: Ang Piel ng מלט ay nangangahulugang magligtas o magpalaya sa panganib. Ang “hindi makapagliligtas” ay nagpapahayag ng kawalan ng kakayahan ng kabayo bilang sandigan, ayon sa diwa ng konteksto.
