source:
  edition: WLC
  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: tl
  text: Masdan, ang mata ni Yahweh ay nakatuon sa mga may takot sa kanya, sa mga naghihintay[a] sa kanyang tapat na pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaasa sa kanyang tapat na pag-ibig.” Maaaring mangahulugan ang pandiwang Hebreo ng kapwa paghihintay at pag-asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Masdan
  rationale: Panawag-pansin ito na may diin at makatang lakas. Pinananatili ng “Masdan” ang tungkuling iyon sa marangal ngunit nauunawaang modernong Tagalog.
- source_word: עֵין
  choice: ang mata
  rationale: Pinananatili ang malinaw na antropomorpikong larawan ng Hebreo sa halip na ipaliwanag ito bilang “pagbabantay” o “tingin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: ay nakatuon sa
  rationale: Sa idyomang may “mata,” ipinahahayag nito ang mapagmatyag at maingat na pagbaling. Ang “nakatuon sa” ay natural sa Tagalog at hindi inaalis ang metapora.
- source_word: יְרֵאָיו
  choice: mga may takot sa kanya
  rationale: Pinananatili nito ang biblikal na diwa ng takot kay Yahweh, na may kasamang pagpipitagan at pagsunod, nang hindi ito pinahihina tungo lamang sa “gumagalang.”
- source_word: לַמְיַחֲלִים
  choice: mga naghihintay
  rationale: Maaaring saklawin ng pandiwang Hebreo ang parehong paghihintay at pag-asa. Pinili ang “naghihintay” upang mapanatili ang matiyaga at umaasang tindig; inilalahad sa talababa ang tunay na alternatibo.
- source_word: לְחַסְדּוֹ
  choice: sa kanyang tapat na pag-ibig
  rationale: Ang “tapat na pag-ibig” ay nagpapahayag sa חֶסֶד bilang matatag, mapagkalinga, at tapat na pagmamahal, nang hindi ito nililimitahan sa habag lamang.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; matapat na pagmamahal
  rationale: Pinananatili ng “tapat na pag-ibig” ang pagsasama ng kabutihan, katapatan, at matatag na pagmamahal nang hindi ipinapasok ang mas makitid na pakahulugan.
- issue: Ambiguwidad ng יחל
  choice: naghihintay
  alternative: umaasa
  rationale: Kapwa maaaring ipahiwatig ng pandiwa ang paghihintay at pag-asa. Hindi nilulutas nang tahimik ang tensiyong ito; pinili ang pangunahing salin at itinabi sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog na may katamtamang makatang himig. Pinanatili ang larawang “mata ni Yahweh” at ang biblikal na pariralang “may takot sa kanya,” habang iniwasan ang labis na arkaiko o denominasyonal na pananalita.
