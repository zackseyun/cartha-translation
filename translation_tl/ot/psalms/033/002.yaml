  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: tl
  text: Magpasalamat kayo kay Yahweh gamit ang lira; tumugtog kayo para sa kanya gamit ang sampung-kuwerdas na alpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “nebel na may sampung kuwerdas.” Hindi tiyak kung anong eksaktong sinaunang instrumento ito; isinasalin din itong “lira” o “instrumentong parang lute.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Magpasalamat kayo
  rationale: Ang Hiphil na pautos na maramihan ng ידה ay karaniwang nangangahulugang magpasalamat o magpuri. Pinananatili ng “Magpasalamat kayo” ang liturhikal na diwa at ang maramihang pautos.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” ayon sa ibinigay na patakaran, sa halip na palitan ito ng isang titulo.
- source_word: בְּכִנּוֹר
  choice: gamit ang lira
  rationale: Ang כִּנּוֹר ay isang sinaunang instrumentong de-kuwerdas na karaniwang kinikilalang lira. Ang “gamit ang” ay malinaw na nagpapahayag ng instrumental na gamit ng pang-ukol na בְּ.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: gamit ang sampung-kuwerdas na alpa
  rationale: Ang נֵבֶל ay isang sinaunang instrumentong de-kuwerdas na walang tiyak na modernong katumbas, at ang עָשׂוֹר ay tumutukoy sa sampung kuwerdas. Ang “alpa” ay natural na salin ngunit nililinaw sa talababa ang kawalang-katiyakan.
- source_word: זַמְּרוּ לוֹ
  choice: tumugtog kayo para sa kanya
  rationale: Sa kontekstong tahasang bumabanggit ng mga instrumento, ipinahihiwatig ng Piel ng זמר ang paggawa o pagtugtog ng musikang papuri. Pinananatili ng salin ang musikal na kilos nang hindi ito nililimitahan sa pag-awit.
theological_decisions:
- issue: Pagkasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang ginamit sa Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” upang katawanin ang dalawang pautos na maramihan sa Hebreo. Inilagay ang talababa sa “alpa,” sapagkat ang kawalang-katiyakang leksikal ay pangunahing nauukol sa נֵבֶל.
