  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: tl
  text: Mula sa kanyang tirahan, minamasdan niya[a] ang lahat ng naninirahan sa daigdig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinitingnan niya” o “binabantayan niya.” Ang pandiwang Hebreo ay may diwa ng masinsing pagmamasid.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lupain” kung panrehiyon ang kahulugan; pinili rito ang “daigdig” dahil pangkalahatan ang saklaw ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: Mula sa lugar
  rationale: Ang מָכוֹן ay tumutukoy sa isang matatag o nakatalagang lugar; natural sa modernong Tagalog ang “lugar” at hindi nito ipinapalagay na “pundasyon” ang diwa rito.
- source_word: שִׁבְתּוֹ
  choice: na kanyang tahanan
  rationale: Ang anyong mula sa ישׁב na may hulaping panghalip ay tumutukoy sa kanyang tirahan o kinaroroonan. Sa ugnayan nito sa מִמְּכוֹן, malinaw at natural ang “lugar na kanyang tahanan.”
- source_word: הִשְׁגִּיחַ
  choice: pinagmamasdan niya
  rationale: Ang Hiphil ng שׁגח ay nagpapahayag ng masinsin o mapagtuong pagtingin. Ang “pinagmamasdan” ay nagpapanatili sa diwa ng maingat na pagmamasid nang hindi dinaragdagan ang teksto ng tiyak na layuning teolohikal.
- source_word: אֶל
  choice: ang
  rationale: Sa Tagalog, tuwirang inuugnay ng pandiwang “pinagmamasdan” ang layon nito sa pamamagitan ng “ang”; hindi kailangang tumbasan nang hiwalay ang Hebreong pang-ukol upang mapanatili ang direksiyon ng pagtingin.
- source_word: כָּל
  choice: lahat ng
  rationale: Tuwirang ipinapahayag nito ang saklaw na sumasaklaw sa buong kasunod na pangkat.
- source_word: יֹשְׁבֵי
  choice: naninirahan
  rationale: Ang participle ng ישׁב ay substantibal, “mga naninirahan.” Ang pariralang “lahat ng naninirahan” ay natural at madaling maunawaan sa modernong Tagalog.
- source_word: הָאָרֶץ
  choice: mundo
  rationale: Bagaman maaari itong mangahulugang “lupain,” ipinahihiwatig ng kontekstong pansaklaw at ng “lahat ng naninirahan” ang buong daigdig. Mas natural sa ordinaryong Tagalog ang “mundo” para sa kahulugang ito.
theological_decisions:
- issue: Saklaw ng pagmamasid ng Diyos
  choice: 'Pandaigdig ang saklaw: pinagmamasdan niya ang lahat ng naninirahan sa mundo.'
  alternative: 'Panrehiyon ang saklaw: ang mga naninirahan sa lupain.'
  rationale: Sa konteksto ng awit, ang כָּל יֹשְׁבֵי הָאָרֶץ ay nagpapahiwatig ng pangkalahatang saklaw sa sangkatauhan. Gayunman, pinananatili sa talababa ang tunay na leksikal na posibilidad ng “lupain.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinagmamasdan” upang maipakita ang mapagtuong pagtingin ng Hebreo, at “mundo” upang natural na ihayag ang pandaigdig na saklaw. Ang ayos na “lugar na kanyang tahanan” ay bahagyang pormal ngunit madaling maunawaan at malapit sa estruktura ng pinagmulan.
