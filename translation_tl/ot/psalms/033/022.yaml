  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: tl
  text: 'Sumaatin nawa ang iyong tapat na pag-ibig, O PANGINOON,

    kung paanong umaasa kami sa iyo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד (ḥesed)
  choice: tapat na pag-ibig
  rationale: Ipinahahayag ang matatag at tapat na pag-ibig na nasa ugnayang tipan, nang hindi ito nililimitahan sa simpleng awa o kabaitan.
- source_word: יְהוָה (YHWH)
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong malalaking titik para katawanin ang banal na pangalang YHWH sa likas at marangal na Tagalog.
- source_word: כַּאֲשֶׁר (kaʾăšer)
  choice: gaya ng
  rationale: Pinananatili ang paghahambing o pagtutugma sa pagitan ng hinihiling na pag-ibig ng Diyos at ng pag-asa ng bayan sa kanya.
- source_word: יִחַלְנוּ (yiḥalnu)
  choice: pag-asa namin
  rationale: Ang pandiwa ay tumutukoy sa matiyagang paghihintay na may pag-asa; ang 'pag-asa namin' ay natural sa Tagalog at angkop sa parallelism ng talata.
theological_decisions:
- issue: Ugnayan ng tapat na pag-ibig ng Diyos at pag-asa ng bayan
  choice: gaya ng pag-asa namin sa iyo
  alternative: ayon sa laki ng pag-asa namin sa iyo
  rationale: Hindi ginagawang sukatan o kondisyon ng pag-ibig ng Diyos ang antas ng pag-asa ng tao. Pinananatili ng 'gaya ng' ang sadyang maluwag na ugnayan sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang 'Sumaatin nawa' ay panalanging pakiusap na natural sa salin ng isang salmo; pinanatili ang kolektibong tinig na 'namin.'
