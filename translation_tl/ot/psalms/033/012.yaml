base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: tl
  text: 'Mapalad[a] ang bansang si Yahweh ang Diyos nito,

    ang bayang pinili niya bilang kanyang mana.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Pinagpala.” Ang salitang Hebreo ay nagpapahayag ng magandang kalagayan o kapalaran, hindi lamang ng damdaming masaya.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “bayan” ay tumutukoy lalo na sa Israel, na pinili ni Yahweh para sa kanyang sarili, bagaman pinananatili ng tekstong Hebreo ang patulang salitang “bayan.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ang idyomatikong anyong ito ng pagpapahayag ng pagpapala ay tumutukoy sa mabuting kalagayan ng isang tao o pangkat, hindi lamang sa damdaming masaya. Likas at marangal sa Filipino ang “Mapalad.”
- source_word: הַגּוֹי
  choice: ang bansa
  rationale: Tuwirang tinutukoy ng גּוֹי ang isang bansa o pangkat na may sama-samang pagkakakilanlan; pinananatili rin nito ang pagtutumbas sa “bayan” sa ikalawang taludtod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: ang Diyos nito
  rationale: Taglay ng anyong Hebreo ang panlalaking pang-isahang hulapi na tumutukoy sa bansa. Ang “nito” ang malinaw na paraang Filipino upang maipahayag na si Yahweh ang Diyos ng bansang iyon.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עָם ay tumutukoy sa isang sambayanan na may pagkakakilanlang panlipunan at tipan. Ang “bayan” ay likas sa Filipino at maayos na kaagapay ng “bansa.”
- source_word: בָּחַר
  choice: pinili niya
  rationale: Ipinahahayag ng ganap na pandiwa ang natapos na pagpili. Sapat na naipakikita ng payak na nagdaang anyo sa Filipino ang kilos at nananatiling resulta nito.
- source_word: לְנַחֲלָה לוֹ
  choice: bilang kanyang mana
  rationale: Ang נַחֲלָה ay mana o minanang pag-aari. Pinananatili ng “bilang kanyang mana” ang larawang pangtipan at ang diwang ang bayan ay pinili upang maging natatanging pag-aari niya.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Tinutukoy ng “bansa” at “bayan”
  choice: Panatilihin ang pangkalahatang mga salitang “bansa” at “bayan” sa pangunahing teksto
  alternative: Tahasang ilagay ang “Israel”
  rationale: Malamang na Israel ang pangunahing tinutukoy, lalo na bilang bayang pinili ng Diyos na kanyang mana, ngunit hindi tahasang binabanggit ng Hebreo ang pangalang Israel. Pinananatili ng salin ang patulang pahayag at ang saklaw nito.
- issue: Kahulugan ng bayan bilang mana ng Diyos
  choice: bilang kanyang mana
  alternative: bilang kanyang pag-aari
  rationale: Pinananatili ng “mana” ang mismong metapora ng נַחֲלָה at ang teolohikal na tensiyong ang Diyos, na siyang nagbibigay ng mana, ay inilalarawan ding may bayang kanyang mana.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bansa” at “bayan” upang mapanatili ang patulang paralelismo, at ang “Diyos nito” upang tumpak na maipahayag ang kaugnayan ng Diyos sa bansang tinutukoy nang hindi nagdaragdag ng ideya ng pagkilala o pagsamba.
