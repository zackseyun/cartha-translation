base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: tl
  text: Nakalimutan na ba ng Diyos na maging mapagbiyaya? Isinara ba niya, sa galit, ang kanyang habag? Selah[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nakalimutan na ba ng Diyos na magpakita ng lingap? O ipinagkait ba niya, sa galit, ang kanyang mga awa?”
    reason: lexical_alternative
  - marker: b
    text: Ang “Selah” ay malamang na isang panandang liturhikal o musikal; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/שָׁכַח
  choice: Nakalimutan na ba
  rationale: Pinananatili ang retorikal na tanong at ang matinding dalamhati ng salmista; natural sa modernong Tagalog ang anyong ito.
- source_word: חַנּוֹת
  choice: magpakita ng biyaya
  rationale: Ang pandiwang חנן ay tumutukoy sa pagpapakita ng biyaya o lingap. Ang pariralang ito ay malinaw at pinananatili ang kaugnayan sa wika ng biyaya.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwan itong titulong pantukoy sa Diyos sa talata, kaya ang payak na “Diyos” ang malinaw at angkop.
- source_word: אִם
  choice: Sa ... ba
  rationale: Ipinakikilala nito ang ikalawang kaagapay na retorikal na tanong. Ang hiwalay na tanong ay natural sa Tagalog habang nananatili ang alternatibong diwa sa talababa.
- source_word: קָפַץ
  choice: isinara
  rationale: Pinananatili ang kongkretong larawan ng pagsasara, sa halip na agad itong ipaliwanag bilang pagpigil o pagkakait.
- source_word: בְּ/אַף
  choice: Sa galit
  rationale: Ang אַף ay literal na “ilong” ngunit idyomatikong tumutukoy sa galit; “sa galit” ang maikli at likas na katumbas.
- source_word: רַחֲמָיו
  choice: kanyang habag
  rationale: Bagaman maramihan ang anyong Hebreo, maaari itong gumana bilang kolektibo o abstraktong katawagan sa habag. Likas sa Tagalog ang pang-isahang “habag.”
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong liturhikal o musikal, kaya isinalin ito sa baybay sa halip na bigyan ng haka-hakang kahulugan.
theological_decisions:
- issue: Kung mga retorikal na tanong o mga tuwirang pahayag ang talata
  choice: Dalawang retorikal na tanong na nagpapahayag ng dalamhati ng salmista
  alternative: Mga pahayag gaya ng “Nakalimutan ng Diyos...”
  rationale: Ang pantanong na kataga at ang konteksto ng panaghoy ay pumapabor sa mga retorikal na tanong. Hindi nito ginagawang tahasang doktrinal na pahayag ang hinaing ng salmista.
- issue: Ang larawan ng pagsasara ng habag ng Diyos
  choice: Pinanatili ang metaporang “isinara ... ang kanyang habag”
  alternative: “ipinagkait/pinigil ang kanyang mga awa”
  rationale: Ang literal na larawan ng pandiwa ay mahalagang bahagi ng tula at hindi dapat tahimik na palitan ng interpretatibong paraphrase.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang retorikal na tanong, ang kongkretong metapora ng “pagsasara,” at ang hindi isinaling “Selah.” Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
