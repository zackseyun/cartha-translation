base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: tl
  text: Inaalaala ko ang aking awit sa gabi[a]; nagbubulay-bulay ako sa aking puso[b], at nagsasaliksik ang aking espiritu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking himig” o “aking tugtugin.”
    reason: lexical_alternative
  - marker: b
    text: O “nakikipag-usap ako sa aking puso”; maaari ring tumukoy ang pandiwang Hebreo sa tahimik na pagninilay o mapagnilay na pagsasalita.
    reason: lexical_alternative
  - marker: c
    text: O “aking kalooban” o “aking panloob na sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Inaalaala ko
  rationale: Ang Qal imperfect/cohortative na anyo ay maaaring tumukoy sa patuloy na pag-alaala, hinaharap, o kusang pagpapasiya. Sa daloy ng mapagnilay na tula, ang kasalukuyan at nagpapatuloy na “Inaalaala ko” ang pinakanatural nang hindi isinasara ang aspektuwal na saklaw.
- source_word: נְגִינָתִי
  choice: aking awit
  rationale: Ang נְגִינָה ay maaaring awit, himig, o tugtugin. Ang “awit” ay natural, patula, at angkop sa personal na paggunita ng salmista.
- source_word: בַּלָּיְלָה
  choice: sa gabi
  rationale: Tuwirang ipinapahayag ang panahong tinutukoy at pinananatili ang payak na himig ng Hebreo.
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: nagbubulay-bulay ako sa aking puso
  rationale: Maaaring ilarawan ng שׂיח ang tahimik na pagninilay o mapagnilay na pakikipag-usap. Ang “nagbubulay-bulay ako sa aking puso” ay natural sa modernong Tagalog at malinaw na panloob ang kilos, habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: וַיְחַפֵּשׂ
  choice: nagsasaliksik
  rationale: Ipinahihiwatig ng חפשׂ ang masusi at mapanuring paghahanap. Ang “nagsasaliksik” ay nagpapanatili sa di-tiyak na layon ng pandiwa at sa introspektibong diwa ng taludtod.
- source_word: רוּחִי
  choice: aking espiritu
  rationale: Dito ang רוּחַ ay tumutukoy sa panloob na sarili ng salmista, hindi sa hangin o hininga. Pinananatili ng “espiritu” ang malawak na saklaw ng salitang Hebreo nang hindi ito nililimitahan sa isip lamang.
theological_decisions:
- issue: Ang kahulugan ng “puso” at “espiritu” bilang mga sangkap ng panloob na pagkatao
  choice: Pinanatili ang magkaibang katawagang “puso” at “espiritu.”
  alternative: Pagsamahin o ipaliwanag ang mga ito bilang “isip” o “kalooban.”
  rationale: Magkaibang salita ang לֵבָב at רוּחַ, at hindi nililinaw ng taludtod kung teknikal na magkaibang bahagi ang mga ito. Ang salin ay hindi dapat magpasok ng isang tiyak na sistemang antropolohikal.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang “inaalaala,” “nagbubulay-bulay,” at “nagsasaliksik” upang maipakita ang sunod-sunod na panloob na pagkilos nang hindi nilalagyan ng tahasang layon ang huling pandiwa, gaya rin ng Hebreo.
