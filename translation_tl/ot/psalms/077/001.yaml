  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: tl
  text: 'Itinataas ko sa Diyos ang aking tinig, at humihiyaw ako;

    itinataas ko sa Diyos ang aking tinig, at pinakikinggan niya ako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at dininig niya ako” o “at pakikinggan niya ako.” Ipinahihiwatig ng pandiwang Hebreo ang masusing pakikinig o pagbibigay-pansin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: Itinataas ko sa Diyos ang aking tinig
  rationale: Literal na tumutukoy ang parirala sa “aking tinig” na nakatuon “sa Diyos.” Idinagdag ang ipinahihiwatig na kilos na “itinataas” upang maging natural sa Filipino, habang pinananatili ang pagtuon sa tinig at ang eksaktong pag-uulit ng parirala sa dalawang hati ng taludtod.
- source_word: וְאֶצְעָקָה
  choice: at humihiyaw ako
  rationale: Ang צעק ay isang malakas at apurahang paghingi ng tulong. Ang “humihiyaw” ay nagpapanatili ng tindi nito, at ang kasalukuyang anyo ay angkop sa masiglang pahayag ng tula.
- source_word: וְהַאֲזִין אֵלָי
  choice: at pinakikinggan niya ako
  rationale: Ang אזן ay hindi lamang pagkarinig kundi maingat na pakikinig. Natural sa Filipino ang “pinakikinggan niya ako” at malinaw nitong ipinahahayag ang pagtugon ng Diyos.
theological_decisions:
- issue: Ang anyo at diwa ng huling pandiwa
  choice: Isinalin sa pangunahing teksto bilang pahayag na pinakikinggan ng Diyos ang salmista.
  alternative: 'Maaari itong unawain bilang pakiusap o hangarin: “pakinggan niya sana ako.”'
  rationale: Sinusunod ng pangunahing salin ang daloy at sinaunang pagkaunawang deklaratibo, ngunit ang patinig at anyo ng Masoretikong teksto ay maaaring magmungkahi ng pautos o pakiusap. Inilalahad sa talababa ang tunay na gramatikal na tensiyon sa halip na itago ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang magkatulad na parirala upang madama ang pag-uulit at diin ng tulang Hebreo; ginamit ang natural na idyomang “itinataas ... ang aking tinig” sa halip na ang alanganing literal na “ang tinig ko ay sa Diyos.”
