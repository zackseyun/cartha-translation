base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: tl
  text: 'Sa dagat dumaan ang iyong daan[a],

    at sa maraming tubig ang iyong mga landas;

    ngunit hindi nabatid ang iyong mga bakas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nasa dagat ang iyong daan.” Maaari ring isalin ang pang-ukol na Hebreo na “sa loob ng,” ngunit sa kontekstong ito ay malamang na ipinahihiwatig nito ang pagdaan sa tubig.
    reason: lexical_alternative
  - marker: b
    text: O “mga yapak” o “mga hakbang.” Ang “hindi nabatid” ay maaari ring magpahiwatig na ang mga ito ay hindi nakita, nakilala, o natunton.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: sa dagat dumaan
  rationale: Maaaring mangahulugan ang בְּ ng “sa loob ng,” ngunit kasama ng “daan” ay inilalarawan nito ang rutang dumaraan sa dagat. Nililinaw ng “dumaan” ang galaw nang hindi tahasang pinapangalanan ang pangyayaring tinutukoy.
- source_word: דַּרְכֶּךָ
  choice: ang iyong daan
  rationale: Ang “daan” ay likas na katumbas ng דֶּרֶךְ at napapanatili nito kapuwa ang kongkreto at matalinghagang diwa.
- source_word: שביליך
  choice: ang iyong mga landas
  rationale: Ang “mga landas” ay nagpapanatili sa patulang paralelismo sa “daan” at likas na tumutumbas sa mga daan o bakas na maaaring lakaran.
- source_word: בְּמַיִם רַבִּים
  choice: sa malalawak na tubig
  rationale: Ang רַבִּים ay maaaring magpahiwatig ng marami, malawak, o makapangyarihang tubig. Ang “malalawak na tubig” ay natural sa Filipino at pinananatili ang malawak na larawang patula.
- source_word: עִקְּבוֹתֶיךָ
  choice: ang iyong mga bakas
  rationale: Ang salita ay maaaring tumukoy sa mga yapak, hakbang, o bakas. Masaklaw ang “mga bakas” at akma sa pahayag na hindi nabatid ang mga ito.
- source_word: לֹא נֹדָעוּ
  choice: hindi nabatid
  rationale: Pinananatili ng pasibong pahayag ang literal na diwang “hindi nalaman” habang hindi ipinapasiya kung ang mga bakas ay hindi nakita, hindi nakilala, o hindi matunton.
theological_decisions:
- issue: Antas ng pagiging tiyak ng larawan ng pagdaan sa dagat
  choice: Panatilihin ang patulang larawan ng daan ng Diyos sa dagat nang hindi tahasang binabanggit ang pagtawid sa Dagat na Pula.
  alternative: Tahasang tukuyin ang paglabas ng Israel at ang pagtawid sa Dagat na Pula.
  rationale: Malinaw na ipinapaalaala ng talata ang pagliligtas sa pamamagitan ng tubig, ngunit hindi pinapangalanan ng tekstong Hebreo ang pangyayari. Sa ganitong salin, nananatili ang tensiyon na tunay na kumikilos ang Diyos ngunit hindi kayang matunton ng tao ang kaniyang mga bakas.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nabatid” upang mapanatili ang malawak at pasibong kahulugan ng Hebreo; bahagya itong pampanitikan ngunit karaniwan pa ring nauunawaan. Pinanatili ang tatlong linyang paralelismo at ang misteryo ng pagkilos ng Diyos na walang naiwang matutunton na bakas.
