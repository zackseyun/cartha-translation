base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: tl
  text: 'Nakita ka ng mga tubig, O Diyos;

    nakita ka ng mga tubig at namilipit[a];

    maging ang mga kailaliman[b] ay nanginig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa matinding paghihirap,” “namilipit na parang nanganganak,” o “nanginig.” Ang pandiwang Hebreo ay maaaring tumukoy sa marahas na panginginig o pamimilipit na tulad ng hapdi ng panganganak.
    reason: lexical_alternative
  - marker: b
    text: O “malalalim na tubig.” Ang salitang Hebreo ay tumutukoy sa mga kailaliman o malalalim na tubig ng dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: Nakita ka
  rationale: Tuwirang isinasalin ang Qal perfect ng ראה na may hulaping ikalawang panauhang panlalaki na isahan. Pinanatili rin ang pag-uulit para sa diin at paralelismong patula.
- source_word: מַיִם
  choice: ang mga tubig
  rationale: Bagaman maaaring gamiting pangmaramihan o bilang di-mabilang na pangngalan ang מַיִם, ang “mga tubig” ay nagpapanatili sa malawak at personipikadong larawan ng mga tubig sa tula.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ang “O” ay likas na panandang pantawag sa marangal na tulang Filipino at nililinaw na tuwirang kinakausap ang Diyos.
- source_word: יָחִילוּ
  choice: namilipit
  rationale: Ang pandiwa mula sa חול/חיל ay maaaring maglarawan ng pamimilipit, matinding paghihirap, o panginginig na gaya ng hapdi ng panganganak. Ang “namilipit” ay nagpapanatili sa masidhing pisikal na larawan at iniiwasang ipareho sa kasunod na רגז.
- source_word: אַף
  choice: maging
  rationale: 'Ipinahihiwatig nito ang pagpapalakas ng kasunod na pahayag: hindi lamang ang mga tubig, kundi maging ang mga kalaliman.'
- source_word: יִרְגְּזוּ
  choice: nanginig
  rationale: Karaniwang ipinahihiwatig ng רגז ang panginginig o pagyanig. Ang “nanginig” ay malinaw at natural, at naihihiwalay sa mas matinding larawang “namilipit.”
- source_word: תְהֹמוֹת
  choice: ang mga kalaliman
  rationale: Ang maramihan ng תְּהוֹם ay tumutukoy sa malalalim na tubig o kailaliman ng dagat. Pinananatili ng “mga kalaliman” ang maramihang anyo at kosmikong larawan nang hindi ito nililimitahan sa isang tiyak na pangyayari.
theological_decisions:
- issue: Ang personipikasyon ng mga tubig sa harap ng Diyos
  choice: Pinanatili ang mga tubig at mga kalaliman bilang mga nilikhang tumutugon sa presensiya ng Diyos.
  alternative: Tahasang tukuyin ang eksena bilang pagtawid sa Dagat na Pula lamang, o bilang pakikipaglaban sa mga mitikong kapangyarihan ng dagat.
  rationale: Patulang inilalarawan ng talata ang mga tubig na namimilipit at ang mga kalaliman na nanginginig sa harap ng Diyos. Hindi ipinapasok sa salin ang isang partikular na paliwanag na hindi tahasang binabanggit sa mismong talata.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Pinanatili ang tatlong linyang paralelismo, ang pag-uulit ng “nakita ka ng mga tubig,” at ang personipikasyon. Ang “namilipit” at “nanginig” ay sadyang magkaiba upang maipakita ang dalawang magkaibang pandiwang Hebreo.
