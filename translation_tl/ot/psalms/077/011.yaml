  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: tl
  text: Aalalahanin ko[a] ang mga ginawa ni Yah, sapagkat aalalahanin ko ang mga kababalaghan mo mula pa noong unang panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Babanggitin ko” o “Isasalaysay ko ang mga ginawa ni Yah.” Maaaring tumukoy ang pandiwa sa pag-alaala, pagbanggit, o pagsasalaysay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “noong sinaunang panahon” o “noong unang panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Aalalahanin ko
  rationale: Ang Hiphil ng זכר ay maaaring mangahulugang alalahanin, banggitin, o isalaysay. Pinananatili ng “aalalahanin ko” ang sadyang pagbabalik-isip ng salmista at ang pag-uulit ng ugat na זכר sa kasunod na sugnay, nang hindi ipinapalagay na pampubliko ang pagsasalaysay.
- source_word: מַעַלְלֵי
  choice: ang mga ginawa
  rationale: Tumutukoy ang מַעֲלָלִים sa mga kilos o gawa. Ang “mga ginawa” ay natural sa modernong Tagalog at malinaw na tumutukoy sa makapangyarihang pagkilos ng Diyos.
- source_word: יָהּ
  choice: Yah
  rationale: Ito ang maikling anyong patula ng banal na pangalan, hindi ang buong tetragrammaton na יְהוָה. Pinananatili ang anyong “Yah” upang huwag burahin ang pagkakaibang nasa tekstong Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Maaaring magpaliwanag o magbigay-diin ang כִּי rito. Ipinapakita ng “sapagkat” ang ugnayan ng dalawang magkatulad na taludtod nang hindi inaalis ang posibilidad ng pagbibigay-diin.
- source_word: אֶזְכְּרָה
  choice: aalalahanin ko
  rationale: Ang anyo ay nagpapahayag ng matibay na pasiya o kusang loob na pagkilos. Natural na naihahayag ito sa Tagalog sa panghinaharap na “aalalahanin ko.”
- source_word: מִקֶּדֶם
  choice: noong unang panahon
  rationale: Tumutukoy ang parirala sa sinauna o matagal nang panahon. Hindi ipinahihiwatig ng salin na ito ang ganap na pasimula ng lahat ng bagay.
- source_word: פִּלְאֶךָ
  choice: ang mga kababalaghan mo
  rationale: Ang פֶּלֶא ay tumutukoy sa isang kamangha-manghang pangyayari o gawa at maaari itong gamiting may kolektibong diwa. Ang “mga kababalaghan mo” ay natural sa Tagalog at umaayon sa paralelismo sa “mga ginawa.”
theological_decisions:
- issue: Pagsasalin sa maikling anyong patula ng banal na pangalan na יָהּ
  choice: Yah
  alternative: ang PANGINOON
  rationale: Dahil יָהּ, hindi יְהוָה, ang aktuwal na anyo sa pinagmulan, pinananatili ang “Yah” upang maipakita ang leksikal at patulang pagkakaiba nang hindi ipinapasok ang karaniwang pamalit sa buong tetragrammaton.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig na angkop sa tula. Pinanatili ang pag-uulit ng “aalalahanin ko,” ang banal na pangalang “Yah,” at ang bahagyang paglipat mula sa ikatlong panauhan (“ni Yah”) tungo sa tuwirang pakikipag-usap (“mo”) na nasa Hebreo.
