  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: tl
  text: Sa araw ng aking paghihirap ay hinanap ko ang Panginoon; sa gabi ay nakaunat ang aking kamay at hindi lumaylay.[a] Tumanggi ang aking kaluluwa na maaliw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gabi ay umagos ang aking kamay at hindi lumaylay.” Mahirap ang larawang Hebreo; inuunawa ng pangunahing teksto na ang kamay ay patuloy na nakaunat sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Sa araw ng aking paghihirap
  rationale: Pinananatili ang temporal na larawan ng Hebreo at ang diwa ng צָרָה bilang matinding kagipitan o paghihirap.
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Ang anyo ay titulong אֲדֹנָי, hindi ang banal na pangalang YHWH; kaya isinalin ito bilang karaniwang titulong Filipino.
- source_word: דָּרָשְׁתִּי
  choice: hinanap ko
  rationale: Sa kaugnayan sa Diyos, ang דרשׁ ay tumutukoy sa taimtim na paghahanap o paglapit sa kanya.
- source_word: יָדִי
  choice: aking kamay
  rationale: Pinanatili ang isahang bilang ng tekstong Hebreo.
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: buong gabi ay nakaunat ang aking kamay at hindi nanghina
  rationale: Ang literal na larawan ng נגר ay 'umagos' o 'ibinuhos,' ngunit sa kamay ay malamang na inilalarawan ang patuloy na pag-uunat nito sa panalangin. Ang תָפוּג ay maaaring mangahulugang manghina, lumaylay, o tumigil.
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  choice: Tumanggi ang aking kaluluwa na maaliw
  rationale: Tuwirang pinananatili ang personipikasyon at makatang diin ng נֶפֶשׁ bilang kaluluwa o panloob na sarili.
theological_decisions:
- issue: Pagpapakahulugan sa אֲדֹנָי
  choice: ang Panginoon
  alternative: Adonai
  rationale: Dahil titulo ito at hindi personal na pangalan, natural itong isalin sa Filipino nang hindi ipinagkakamali sa YHWH.
- issue: Larawan ng kamay sa gabi
  choice: nakaunat ang aking kamay at hindi nanghina
  alternative: umagos ang aking kamay sa gabi at hindi tumigil
  rationale: Pinili sa pangunahing teksto ang malamang na larawan ng matiyagang panalangin, ngunit inilagay sa talababa ang tunay na hirap at alternatibong literal na pagbasa ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may bahagyang makatang himig. Pinanatili ang 'kaluluwa' at ang isahang 'kamay' upang huwag patagin ang larawan at tensiyon ng Hebreong tula.
