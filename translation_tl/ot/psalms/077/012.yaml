translation:
  language: tl
  text: 'Bubulay-bulayin ko ang lahat ng iyong gawa,

    at pag-iisipan ko ang iyong mga gawa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magsasalita ako tungkol sa iyong mga gawa.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagmumuni-muni o sa pagsasalita; mas angkop sa paralelismo rito ang diwa ng pagninilay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: Pagbubulay-bulayan ko
  rationale: Ang Qal 1cs ng הגה ay tumutukoy sa tahimik at masusing pagbubulay. Ang anyong hinaharap o kusang pagpapasiya ay angkop sa kasunod na anyong pandiwa at sa patulang konteksto.
- source_word: בְכָל
  choice: ang lahat ng
  rationale: Sa pandiwa ng pag-iisip, ang ב ay nagmamarka sa layon ng pagbubulay; natural itong ipinahahayag sa Tagalog bilang tuwirang layon.
- source_word: פָעֳלֶךָ
  choice: iyong gawa
  rationale: Ang pang-isahang פֹּעַל ay maaaring kolektibong tumukoy sa kabuuan ng gawain o mga gawa. Pinananatili ng “gawa” ang pang-isahan at ang pagkakaiba nito sa kasunod na pangmaramihan.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: iyong mga ginawa
  rationale: Ang עֲלִילָה ay nangangahulugang gawa o kilos. Ang “mga ginawa” ay malinaw at natural, at hindi nagdaragdag ng di-tahasang diwang “makapangyarihan.”
- source_word: אָשִׂיחָה
  choice: pag-iisipan ko
  rationale: Ang שיח ay maaaring mangahulugang magmuni-muni, magbulay, o magsalita. Pinili ang mapagnilay na diwa dahil sa paralelismo sa הגה, habang iniiwasan ang eksaktong pag-uulit ng unang parirala.
theological_decisions:
- issue: Kung panloob na pagninilay o panlabas na pagsasalita ang אָשִׂיחָה
  choice: pag-iisipan ko
  alternative: magsasalita ako tungkol sa
  rationale: Parehong saklaw ng Hebreong שיח ang pagninilay at pagsasalita. Mas akma sa paralelismo rito ang mapagnilay na diwa, ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagbubulay-bulayan” para sa masinsing pagninilay at “pag-iisipan” bilang natural na katumbas sa ikalawang hanay, habang pinananatili ang patulang paralelismo at leksikal na pagkakaiba.
