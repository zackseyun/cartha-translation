translation:
  language: tl
  text: O Diyos, ang iyong daan ay nasa kabanalan.[a] Sino ang dakilang diyos na tulad ng Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nasa santuwaryo.” Ang pariralang Hebreo ay maaaring tumukoy sa kabanalan bilang katangian o larangang kaugnay ng Diyos, o sa banal na lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Itinuring na tuwirang pagtawag dahil kasunod nito ang pangalawang panauhang hulapi sa דַּרְכֶּךָ, “iyong daan.”
- source_word: בַּקֹּדֶשׁ
  choice: nasa kabanalan
  rationale: Pinananatili ang abstraktong diwa ng קֹדֶשׁ bilang kabanalan, habang inilalagay sa talababa ang posible ring lokatibong kahulugang “nasa santuwaryo.”
- source_word: דַּרְכֶּךָ
  choice: ang iyong daan
  rationale: Likas na salin ng דֶּרֶךְ na maaaring tumukoy kapuwa sa pagkilos ng Diyos at sa paraan ng kanyang pagkilos.
- source_word: מִי אֵל גָּדוֹל
  choice: Sino ang dakilang diyos
  rationale: Pinananatili ang retorikal na tanong at ang אֵל bilang pangkalahatang pangngalan sa paghahambing.
- source_word: כֵּאלֹהִים
  choice: na gaya ng Diyos
  rationale: Ipinapahayag ang paghahambing na minamarkahan ng כְּ at inuunawa ang אֱלֹהִים bilang ang tunay na Diyos sa konteksto.
theological_decisions:
- issue: Kahulugan ng בַּקֹּדֶשׁ
  choice: Ang daan ng Diyos ay nasa kabanalan
  alternative: Ang daan ng Diyos ay nasa santuwaryo
  rationale: Kapuwa pinahihintulutan ng Hebreo ang abstraktong “kabanalan” at ang lokatibo o kultikong “santuwaryo.” Ginamit sa pangunahing teksto ang una ngunit pinanatili sa talababa ang ikalawa upang hindi mawala ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maliit na titik sa “diyos” sa retorikal na paghahambing, ngunit malaking titik sa pagtukoy sa tunay na Diyos.
