translation:
  language: tl
  text: Naaalala ko ang Diyos at dumadaing ako; nagbubulay-bulay ako[a], at nanghihina ang aking espiritu[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagrereklamo ako.” Ang pandiwang Hebreo ay maaaring tumukoy sa mapagnilay na pagbubulay-bulay o sa pagsasatinig ng panaghoy.
    reason: lexical_alternative
  - marker: b
    text: O “nalulupaypay ang aking espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Naaalala ko
  rationale: Ang anyong Qal na unang panauhan ay maaaring magpahiwatig ng kasalukuyan, hinaharap, o pagnanais. Sa konteksto ng agarang panaghoy, likas sa Filipino ang kasalukuyang “Naaalala ko.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Ang tinutukoy ay ang Diyos ng Israel; ang isahang “Diyos” ang angkop sa konteksto.
- source_word: וְאֶהֱמָיָה
  choice: at napapadaing ako
  rationale: Ang pandiwang המה ay nagpapahiwatig ng naririnig na pagkabalisa o panaghoy. Ipinahahayag ng “napapadaing” ang pagdaing na dulot ng matinding ligalig.
- source_word: אָשִׂיחָה
  choice: nagbubulay-bulay ako
  rationale: Sa panulaang panaghoy, ang שיח ay maaaring tumukoy sa pagbubulay, pagmumuni, o pagsasatinig ng reklamo. Pinananatili ng “nagbubulay-bulay” ang mapagnilay na diwa, habang inilalahad sa talababa ang lehitimong alternatibo.
- source_word: וְתִתְעַטֵּף
  choice: at nanghihina
  rationale: Ang Hitpael ng עטף ay maaaring mangahulugang manghina o madaig ng bigat ng damdamin. Ang “nanghihina” ay malinaw at likas sa Filipino.
- source_word: רוּחִי
  choice: ang aking espiritu
  rationale: Dito, ang רוּחַ ay tumutukoy sa panloob na buhay o kalooban ng mang-aawit, hindi lamang sa pisikal na hininga.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan at gamit ng terminong ito, kaya pinanatili itong transliterasyon sa halip na bigyan ng mapangahas na salin.
