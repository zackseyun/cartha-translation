  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: tl
  text: Tumigil na ba magpakailanman ang kanyang tapat na pag-ibig? Natapos na ba ang kanyang pangako para sa sali't salinlahi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Natapos na ba ang kanyang salita para sa sali't salinlahi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָפֵס
  choice: Naglaho na ba
  rationale: Ang pandiwang may panandang patanong ay nagtatanong kung tuluyan nang naubos o naglaho ang isang bagay. Likas sa Filipino ang “naglaho na ba” at angkop sa matinding panaghoy.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Ipinahahayag nito ang permanenteng tagal; pinananatili ng “magpakailanman” ang matalas na tanong ng salmista.
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Ang חֶסֶד ay pag-ibig na matapat at nananatili, kadalasang nasa konteksto ng pakikipagtipan. Malinaw at hindi makaluma ang pariralang ito.
- source_word: גָּמַר
  choice: Natapos na ba
  rationale: Ipinahihiwatig ng pandiwa ang pagkalubos o pagwawakas. Ang “natapos na ba” ay maikli, natural, at tumutugma sa parallel na tanong.
- source_word: אֹמֶר
  choice: ang kanyang pangako
  rationale: Literal itong “salita” o “pahayag,” ngunit sa konteksto ay malamang na tumutukoy sa ipinangakong salita ng Diyos. Isinama sa talababa ang mas pormal na salin upang mapanatili ang tunay na lawak ng kahulugan.
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahi
  rationale: Karaniwang idyomang Filipino ito para sa nagpapatuloy na panahon sa magkakasunod na henerasyon at pinananatili nito ang pag-uulit ng Hebreo.
theological_decisions:
- issue: Kung ang אֹמֶר ay isasaling mas pormal bilang “salita” o ayon sa konteksto bilang “pangako”
  choice: pangako
  alternative: salita
  rationale: Sa parallelismo sa tapat na pag-ibig ng Diyos, malamang na tumutukoy ito sa kanyang ipinangakong salita, hindi lamang sa anumang pananalita. Gayunman, dahil mas tiyak ang “pangako” kaysa sa leksikal na anyo, pinanatili sa talababa ang “salita.”
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “sali't salinlahi” bilang likas na idyoma; iniwasan ang labis na teknikal o denominasyonal na pananalita.
