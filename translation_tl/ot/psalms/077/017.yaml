translation:
  language: tl
  text: 'Bumuhos ng tubig ang mga ulap;


    nagbigay ng tinig ang kalangitan;


    tunay ngang nagparoo’t parito ang iyong mga palaso[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong mga kidlat ay nagparoo’t parito.” Sa Hebreo, “iyong mga palaso”; malamang na larawan ito ng kidlat sa konteksto ng pagpapakita ng Diyos sa bagyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ מַיִם עָבוֹת
  choice: Bumuhos ng tubig ang mga ulap
  rationale: Ipinahahayag ng זֹרְמוּ ang malakas na pag-agos o pagbuhos. Likas sa Filipino ang “bumuhos ng tubig,” at pinananatili ng “mga ulap” ang lantad na larawan ng Hebreo nang hindi idinaragdag sa pangunahing teksto ang ipinahihiwatig na kapal ng mga ito.
- source_word: קוֹל נָתְנוּ
  choice: nagbigay ng tinig
  rationale: Malapit ito sa idyomang Hebreo na literal na “nagbigay ng tinig/tunog.” Pinananatili nito ang personipikasyon at hindi agad nililimitahan ang tunog sa kulog, bagaman iyon ang malamang na ipinahihiwatig ng konteksto.
- source_word: שְׁחָקִים
  choice: ang kalangitan
  rationale: Maaaring tumukoy ang salita sa himpapawid, kalangitan, o mga ulap. Dahil ginamit na ang “mga ulap” para sa עָבוֹת, pinananatili ng “kalangitan” ang pagkakaiba at paralelismo ng dalawang patulang linya.
- source_word: אַף
  choice: tunay ngang
  rationale: Ipinahahayag nito ang pagdidiin at ang pasukdol na pag-usad ng taludtod. Ang “tunay ngang” ay malinaw at marangal sa makabagong Filipino.
- source_word: חֲצָצֶיךָ
  choice: iyong mga palaso
  rationale: Ang karaniwang kahulugan ng pangngalan ay “mga palaso.” Pinananatili ito sa pangunahing teksto upang huwag alisin ang larawang pandigma; inilalahad sa talababa ang malamang na metaporikong pagtukoy sa mga kidlat.
- source_word: יִתְהַלָּכוּ
  choice: nagliparan sa magkabi-kabila
  rationale: Ipinahihiwatig ng anyong Hebreo ang pagkilos o pagparoo't parito. Mas natural at masigla sa Filipino ang “nagliparan sa magkabi-kabila” para sa mga palaso, at maaari rin nitong ihatid ang paglaganap ng kidlat sa kalangitan.
theological_decisions:
- issue: 'Patulang pagpapakita ng Diyos sa bagyo: literal na mga palaso o metapora para sa kidlat'
  choice: Pinanatili sa pangunahing teksto ang “iyong mga palaso,” habang ipinaliliwanag sa talababa ang posibleng pagtukoy sa mga kidlat.
  alternative: Isalin nang tuwiran bilang “iyong mga kidlat.”
  rationale: “Mga palaso” ang tuwirang leksikal na larawan ng Hebreo. Malakas na ipinahihiwatig ng konteksto ng pagpapakita ng Diyos sa bagyo na kidlat ang tinutukoy, ngunit ang tuwirang pagsasaling “mga kidlat” ay magpapasya sa isang metaporikong pagbasa at mag-aalis sa larawang pandigma. Pinananatili ng pangunahing teksto at talababa ang dalawang antas ng kahulugan.
translation_notes:
  register: Makabago ngunit marangal at patula ang rehistro. Ginamit ang maiikling magkakatapat na linya upang mapanatili ang paralelismo ng Hebreo. Ang “nagbigay ng tinig” ay sadyang bahagyang matalinghaga upang mapanatili ang personipikasyon ng orihinal, samantalang ang “nagliparan sa magkabi-kabila” ay nagbibigay ng likas na galaw sa Filipino nang hindi inaalis ang dobleng larawan ng mga palaso at kidlat.
