  text: לַ/מְנַצֵּ֥חַ עַֽל ידיתון לְ/אָסָ֥ף מִזְמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan[a]: ayon kay Jedutun[b]. Isang salmo ni Asaf[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Para sa direktor ng musika” o “Para sa punong musikero.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ayon kay Jedutun” ay maaaring tumukoy sa isang estilo o himig, sa isang pangkat ng mga mang-aawit, o sa samahang kaugnay ni Jedutun.
    reason: cultural_note
  - marker: c
    text: Maaari ring “para kay Asaf” o “kaugnay ni Asaf”; maaaring ipahiwatig ng Hebreong pang-ukol ang pag-akda, kaugnayan, pag-aari, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang pariralang ito nang hindi gumagamit ng makalumang katawagan.
- source_word: עַל
  choice: ayon kay
  rationale: Sa ganitong pormulang pangmusika, maaaring ipakilala ng עַל ang estilo, himig, pangkat, o tradisyong kaugnay ng isang pangalan. Pinananatili ng “ayon kay” ang pagiging bukas ng kahulugan.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Pangalan ito ng isang tao o pangkat na kaugnay niya, kaya tinumbasan ito sa karaniwang anyong Filipino.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Maaaring ipahiwatig ng לְ ang may-akda, kaugnayan, pag-aari, o pag-aalay. Ang “ni Asaf” ay maikli at natural, ngunit nililinaw sa talababa na hindi tiyak na pag-akda lamang ang ibig sabihin.
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Ito ang kinikilalang katawagang Filipino para sa uring pampanitikan at pangmusikang מִזְמוֹר.
theological_decisions:
- issue: Kaugnayan ni Asaf sa salmo
  choice: Isang salmo ni Asaf
  alternative: Isang salmo para kay Asaf / kaugnay ni Asaf
  rationale: Hindi tiyak sa Hebreo kung ang לְ ay nagsasaad ng pag-akda, pag-aari, pag-aalay, o pagkakaugnay. Ginamit ang natural na pamagat sa Filipino at pinanatili sa talababa ang saklaw ng posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatiling maikli ang anyo bilang pamagat ng salmo, at inilagay sa mga talababa ang tunay na kalabuan ng mga teknikal na katawagang pangmusika at ng kaugnayan kay Asaf.
