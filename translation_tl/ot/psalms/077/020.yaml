  yaml_path: translation/ot/psalms/077/020.yaml
  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: tl
  text: 'Inakay mo ang iyong bayan na parang isang kawan,

    sa pamamagitan nina Moises at Aaron.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay nina Moises at Aaron,” isang idyomang nangangahulugang sa pamamagitan ng kanilang pagkilos o pamumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: Inakay mo
  rationale: Ang pandiwa ay tuwirang nakatuon sa Diyos at nangangahulugang manguna o gumabay. Ang “inakay” ay likas sa modernong Filipino at pinatitibay ang larawang pastoral ng kasunod na כַצֹּאן.
- source_word: כַצֹּאן
  choice: na parang isang kawan
  rationale: Ang כַּ ay naghahayag ng paghahambing, at ang צֹאן ay kolektibong tawag sa maliliit na hayop na inaalagaan, lalo na sa mga tupa at kambing. Pinananatili ng “isang kawan” ang kolektibong larawang pastoral.
- source_word: עַמֶּךָ
  choice: ang iyong bayan
  rationale: Ang עַם ay tumutukoy rito sa bayang pag-aari ng Diyos. Mas natural at marangal sa Filipino ang “iyong bayan” kaysa “iyong mga tao” sa kontekstong ito.
- source_word: בְּיַד
  choice: sa pamamagitan nina
  rationale: Literal itong “sa kamay nina,” ngunit ang parirala ay idyoma para sa pagkilos sa pamamagitan ng mga kinatawan o tagapanguna. Malinaw na ipinahahayag ng salin ang ahensiya nang hindi inililipat kina Moises at Aaron ang pangunahing pagkilos ng Diyos.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moises at Aaron
  rationale: Ginamit ang mga pangalang nakaugaliang anyo sa modernong saling Filipino.
theological_decisions:
- issue: Ang papel ng Diyos at nina Moises at Aaron sa pangunguna sa bayan
  choice: Ang Diyos ang pangunahing kumikilos at inakay niya ang bayan sa pamamagitan nina Moises at Aaron.
  alternative: Maaaring panatilihin nang literal ang “sa kamay nina Moises at Aaron,” ngunit maaaring hindi agad maunawaan ng karaniwang mambabasa ang idyoma ng ahensiya.
  rationale: Ang pandiwa ay nasa ikalawang panauhang isahan at tumutukoy sa Diyos; ang בְּיַד מֹשֶׁה וְאַהֲרֹן ay nagsasaad ng mga taong ginamit niya. Pinananatili ng salin kapwa ang banal na pagkilos at ang tunay na papel ng mga taong tagapanguna.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inakay” upang umayon sa larawan ng kawan, “bayan” para sa kolektibo at tipanang diwa ng עַם, at “sa pamamagitan nina” upang natural na maipahayag ang Hebreong idyoma.
