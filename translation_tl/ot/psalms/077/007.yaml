  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: tl
  text: Magtatakwil ba ang Panginoon magpakailanman, at hindi na ba siya muling magpapakita ng lingap?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Tatalikuran ba ng Panginoon magpakailanman, at hindi na ba siya muling magiging mapagpabor?”'
    reason: Ipinakikita ang mga leksikal na alternatibo ng יִזְנַח (“tatalikuran”) at לִרְצוֹת (“magiging mapagpabor”) habang pinananatili ang di-binanggit na layon.
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: ba magpakailanman
  rationale: Ang הַ ay nagpapakilala ng retorikal na tanong, at ang לְעוֹלָמִים ay likas na naipahahayag sa modernong Tagalog bilang “magpakailanman.”
- source_word: יִזְנַח
  choice: magtatakwil
  rationale: Ipinahahayag ng pandiwa ang pagtanggi o pagtataboy. Pinananatili ng “magtatakwil” ang bigat ng relasyonal na pagtanggi nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Titulong banal ang Adonai, kaya isinalin itong “ang Panginoon” sa halip na itransliterado o ituring na YHWH.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: at hindi na ba siya muling
  rationale: Magkakasamang ipinahahayag ng negasyon, יֹסִיף, at עוֹד ang ideyang hindi na muling gagawin ang kilos. Likas sa Tagalog ang “hindi na ... muling.”
- source_word: לִרְצוֹת
  choice: lilingap
  rationale: Sa kontekstong ito, ang רצה ay tumutukoy sa pagiging mapagfavor o mabuting-loob. Ang “lilingap” ay malinaw at dignidad na pagpapahayag ng pagpapakita ng pabor, at maaari ring iwanang di-tiyak ang layon gaya sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: ang Panginoon
  alternative: Adonai
  rationale: Titulo ang ginamit sa pinagmulan, hindi ang banal na pangalang YHWH. Isinasalin ang titulo upang maging malinaw sa karaniwang mambabasa nang hindi ito ipinagkakamali sa tipograpikong kumbensiyon para sa YHWH.
- issue: Di-binanggit na layon ng mga pandiwa
  choice: Hindi nagdagdag ng “kami” o “ako”
  alternative: Itatakwil ba kami ng Panginoon ... at hindi na ba niya kami muling lilingapin?
  rationale: Walang tahasang layon sa Hebreo. Bagaman ipinahihiwatig ng konteksto ang salmista o ang bayan, pinananatili ng salin ang tunay na gramatikal na pagkadi-tiyak.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “magtatakwil” at “lilingap” bilang mga salitang madaling maunawaan sa panaghoy; iniwasan ang pagdagdag ng layong “kami” upang mapanatili ang anyo at bahagyang kalabuan ng Hebreo.
