  yaml_path: translation/ot/psalms/077/015.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
translation:
  language: tl
  text: Tinubos mo[a] sa pamamagitan ng iyong bisig[b] ang iyong bayan—ang mga anak ni Jacob at ni Jose[c]. Selah[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “Tinubos” bilang “Pinalaya” o “Iniligtas.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bisig” ay larawang Hebreo para sa makapangyarihang pagkilos ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga anak ni Jacob at ni Jose” ay maaaring isang makatang tawag sa Israel; maaaring partikular na itinatampok ng “Jose” ang mga liping nagmula sa kanya.
    reason: alternative_reading
  - marker: d
    text: Ang “Selah” ay malamang na panandang liturhikal o musikal, ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: Tinubos mo
  rationale: Ang גאל ay tumutukoy sa pagtubos o pagliligtas, kadalasan sa papel ng isang kamag-anak na tagapagtubos. Pinananatili ng “tinubos” ang bigat ng konsepto nang hindi ito pinapaliit sa pangkalahatang “iniligtas.”
- source_word: בִּזְרוֹעַ
  choice: sa pamamagitan ng iyong bisig
  rationale: Literal na “bisig” ang זְרוֹעַ at larawan ito ng makapangyarihang pagkilos ng Diyos. Ang “sa pamamagitan ng” ay malinaw na naghahayag ng instrumental na gamit ng pang-ukol habang pinananatili ang larawang Hebreo.
- source_word: עַמֶּךָ
  choice: ang iyong bayan
  rationale: Ang עַם na may hulaping ikalawang panauhang panlalaki ay “iyong bayan.” Ang “bayan” ay natural at marangal na tawag sa sambayanang nakaugnay sa Diyos.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Bagaman literal na maaaring “mga anak na lalaki,” sa pambansa at genealogical na pariralang ito, natural na ipinahihiwatig ng “mga anak” ang mga supling o angkan nang hindi nililimita sa mga lalaking indibidwal.
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: Jacob at ni Jose
  rationale: Pinanatili ang dalawang personal na pangalan at ang kanilang pagkakaugnay, nang hindi ipinaliliwanag sa pangunahing teksto kung anong mga lipi ang kinakatawan ni Jose.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa titik ang terminong malamang na liturhikal o musikal sapagkat hindi tiyak ang eksaktong kahulugan nito.
theological_decisions:
- issue: Ang pambansang katawagan na “mga anak ni Jacob at ni Jose”
  choice: Pinanatili ang dalawang pangalan nang hindi nilulutas ang tiyak na kinakatawang saklaw ni Jose.
  alternative: Ipaliwanag si Jose bilang Efraim at Manases, ang hilagang kaharian, o bilang katawagan sa buong Israel.
  rationale: Hindi tahasang ipinapaliwanag ng Hebreo ang ugnayang representatibo. Pinananatili ng salin ang makata at makasaysayang tensiyon sa halip na magpasok ng mas makitid na interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang imaheng “bisig,” ang dalawang pangalang Jacob at Jose, at ang terminong “Selah.” Ginamit ang gitling-pahaba upang malinaw na ipakitang ang “mga anak ni Jacob at ni Jose” ay nasa aposisyon sa “iyong bayan,” nang hindi dinaragdagan ang interpretasyon.
