source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: tl
  text: Ikaw ang Diyos na gumagawa ng mga kamangha-manghang gawa; ipinakilala mo sa mga bayan[a] ang iyong lakas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga bansa” o “sa gitna ng mga bayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapangyarihan” o “matinding lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: ang Diyos
  rationale: Tinutukoy ng may artikulong parirala ang Diyos nang tiyak at mariin. Sa natural na Tagalog, sapat at marangal ang “ang Diyos”; hindi kailangan ang artipisyal na “ang Diyos na iyon.”
- source_word: עֹשֵׂה פֶלֶא
  choice: na gumagawa ng mga kamangha-manghang gawa
  rationale: Ang participle ay naglalarawan sa kinikilalang pagkilos ng Diyos. Bagaman isahan ang פֶלֶא, maaari itong kolektibo; malinaw na ipinahahayag ng pariralang ito ang pambihirang mga gawa nang hindi ito nililimitahan sa mas makitid na salitang “mga himala.”
- source_word: הוֹדַעְתָּ
  choice: ipinakilala mo
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil: ginawa ng Diyos na makilala o malaman ang kaniyang lakas. Natural din ito sa kasalukuyang Tagalog.'
- source_word: בָעַמִּים
  choice: sa mga bayan
  rationale: Maaaring tumukoy ang עַמִּים sa mga bayan o mga bansa. Ang “sa mga bayan” ay malawak at hindi nagdaragdag ng makabagong geopolitikal na diwa; ang “sa” ay natural na Tagalog para sa pagpapamalas na naganap sa gitna nila.
- source_word: עֻזֶּךָ
  choice: iyong lakas
  rationale: Tuwirang ipinahahayag ng “lakas” ang עֹז, habang nananatiling posible ang “kapangyarihan” o “kadakilaan ng lakas” ayon sa konteksto.
theological_decisions:
- issue: Saklaw ng pagpapakilala ng lakas ng Diyos sa בָעַמִּים
  choice: sa mga bayan
  alternative: sa mga bansa; sa gitna ng mga bayan
  rationale: Pinananatili ang malawak at pampublikong saklaw ng pagkilos ng Diyos nang hindi ito ginagawang isang tiyak na programang teolohikal o makabagong konseptong geopolitikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kamangha-manghang gawa” upang maging natural ang kolektibong diwa ng פֶלֶא at maiwasan ang mas makitid na interpretasyon ng “mga himala.” Ang lahat ng panandang talababa ay nasa pangunahing teksto.
