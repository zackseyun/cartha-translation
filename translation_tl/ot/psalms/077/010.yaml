lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Pinananatili nito ang sunod-sunod na daloy ng wayyiqtol at likas itong pakinggan sa marangal na makabagong Tagalog.
- source_word: חַלּוֹתִי
  choice: aking dalamhati
  rationale: Mahirap at pinagtatalunang anyo ito na maaaring tumukoy sa paghihirap, kahinaan, o karamdaman. Ang “dalamhati” ay angkop sa konteksto ng panaghoy nang hindi itinatago ang ibang posibilidad, na nasa talababa.
- source_word: הִיא
  choice: Ito ang
  rationale: Ginagawang malinaw ang pantukoy na panghalip na tumutukoy sa kalagayan o pagkaunawang binanggit ng mang-aawit.
- source_word: שְׁנוֹת
  choice: ang mga taon ng
  rationale: Ang karaniwang kahulugan ng anyo ay “mga taon ng.” Posible rin ang pagbasa na may diwang “pagbabago,” kaya inilalahad iyon sa talababa.
- source_word: יְמִין
  choice: kanang kamay ng
  rationale: Pinananatili ang larawang Hebreo na karaniwang nagpapahiwatig ng kapangyarihan o pagliligtas ng Diyos.
- source_word: עֶלְיוֹן
  choice: Kataas-taasan
  rationale: Likas at nakaugaliang salin sa Tagalog ng titulong banal na “Most High,” na nagpapanatili sa diwa ng kadakilaan.
theological_decisions:
- issue: Pagpapakahulugan sa lubhang mahirap na talata
  choice: Inilalarawan ng mang-aawit ang kaniyang kasalukuyang dalamhati kaugnay ng mga taon ng makapangyarihang pagkilos ng Kataas-taasan.
  alternative: '“Ito ang aking kahinaan: ang mga taon ng kanang kamay ng Kataas-taasan,” o “Ikinalulungkot ko na nagbago ang kanang kamay ng Kataas-taasan.”'
  rationale: Kapuwa pinahihintulutan ng mahirap na חַלּוֹתִי at ng malabong שְׁנוֹת ang higit sa isang pagbasa. Pinili sa pangunahing teksto ang isang malamang na pagbasa, habang pinananatili sa mga talababa ang tunay na leksikal at teolohikal na tensiyon.
translation_notes:
