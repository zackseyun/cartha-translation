  text: Pinanatili mong dilat ang aking mga mata[a]; balisa ako[b] at hindi makapagsalita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Hinawakan mo ang mga bantay ng aking mga mata.” Malamang na nangangahulugan ang idyomang Hebreo na hindi hinayaan ng Diyos na pumikit sa pagtulog ang salmista.'
    reason: lexical_alternative
  - marker: b
    text: O “nababalisa ako” o “naguguluhan ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Pinipigil mo
  rationale: 'Ang Qal perfect 2ms ng אחז ay tuwirang nakikipag-usap sa Diyos. Sa idyomang ito, natural na ipinahahayag ng “pinipigil mo” ang patuloy na bunga ng pagkilos ng Diyos: hindi makapikit at makatulog ang salmista.'
- source_word: שְׁמֻרוֹת עֵינָי
  choice: pumikit ang aking mga mata
  rationale: Literal na tumutukoy ang שְׁמֻרוֹת sa mga “pagbabantay” o “bantay” ng mga mata, isang mahirap at malamang na idyomatikong parirala. Ipinapahayag ng salin ang malamang na diwa—pinananatiling gising ang salmista—nang hindi gumagamit ng di-natural na “mga bantay ng aking mga mata.”
- source_word: נִפְעַמְתִּי
  choice: balisa ako
  rationale: Ang Niphal 1cs ng פעם ay nagpapahiwatig ng matinding panloob na pagkabagabag o pagkaligalig. Ang “balisa” ay likas sa modernong Tagalog at hindi labis na itinatakda kung takot, sindak, o pagkabalisa ang tiyak na sanhi.
- source_word: וְלֹא אֲדַבֵּר
  choice: at hindi makapagsalita
  rationale: Bagaman pormal na “at hindi ako nagsasalita,” ipinahihiwatig ng konteksto na ang pagkabagabag ang dahilan ng kawalan ng kakayahang magsalita, hindi basta kusang pananahimik.
theological_decisions:
- issue: Pagkilos ng Diyos sa hindi pagkakatulog ng salmista
  choice: 'Pinanatili ang malinaw na tuwirang pagkilos ng Diyos: “Pinipigil mong pumikit…”'
  alternative: Hindi ako makatulog
  rationale: Ang alternatibo ay natural ngunit inaalis nito ang tahasang banal na ahensiya na nasa ikalawang panauhang pandiwa ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “balisa” bilang pangkaraniwang salitang may sapat na bigat, at pinanatili sa pangunahing teksto ang banal na ahensiya at ang malamang na diwa ng idyoma.
