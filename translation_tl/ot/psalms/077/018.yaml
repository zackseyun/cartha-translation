lexical_decisions:
- source_word: ק֤וֹל
  choice: dagundong
  rationale: Sa pariralang may kulog, likas na ipinahahayag ng “dagundong” ang malakas na tunog, sa halip na ang mas literal ngunit di-likas na “tinig.”
- source_word: רַעַמְךָ
  choice: ng iyong kulog
  rationale: Pinananatili ang tahasang pakikipag-usap sa Diyos sa pamamagitan ng “iyong,” at ang pangngalan ay payak na isinaling “kulog.”
- source_word: בַּגַּלְגַּל
  choice: nasa ipuipo
  rationale: Bagaman literal na maaaring tumukoy ang גַּלְגַּל sa “gulong” o bagay na umiikot, sa konteksto ng kulog at kidlat ay malamang na inilalarawan nito ang umiikot na unos; pinananatili sa talababa ang leksikal na alternatibo.
- source_word: הֵאִירוּ
  choice: nilinawan
  rationale: Ipinahahayag nito ang causative na diwa ng Hiphil ng אור, na ang mga kidlat ang nagbigay-liwanag sa sanlibutan.
- source_word: בְרָקִים
  choice: mga kidlat
  rationale: Pinananatili ang maramihang anyo ng Hebreo sa natural na Tagalog.
- source_word: תֵּבֵל
  choice: ang sanlibutan
  rationale: Ang תֵּבֵל ay tumutukoy sa daigdig o mundong tinitirhan; ang “sanlibutan” ay maikli, marangal, at angkop sa tulang biblikal.
- source_word: רָגְזָה
  choice: nanginig
  rationale: Inilalarawan ang panginginig o pagkabagabag ng lupa at pinananatiling naiiba sa kasunod na pandiwa.
- source_word: וַתִּרְעַשׁ
  choice: at nayanig
  rationale: Pinananatili ang ikalawang pandiwa bilang pagpapatingkad sa unang kilos, sa halip na pagsamahin ang dalawang magkaibang pandiwang Hebreo.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa kosmikong paglalarawan ng pagpapakita ng Diyos, tumutukoy ito sa buong lupa, hindi lamang sa isang lupain.
