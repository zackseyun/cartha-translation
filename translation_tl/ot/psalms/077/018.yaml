  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: tl
  text: Ang dagundong ng iyong kulog ay nasa ipuipo[a]; nagbigay-liwanag sa daigdig ang mga kidlat; nanginig at nayanig ang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gulong”; malamang na inilalarawan ng Hebreo ang isang umiikot na unos, kaya “sa ipuipo.”
