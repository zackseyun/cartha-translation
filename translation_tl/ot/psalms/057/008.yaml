  text: ע֤וּרָ/ה כְבוֹדִ֗/י ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: tl
  text: Gumising ka, kaluwalhatian ko![a] Gumising kayo, alpa at lira![b] Gigisingin ko ang bukang-liwayway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa ko” o “buong pagkatao ko.” Ang “kaluwalhatian ko” ay maaaring isang patulang pagtukoy sa sarili.
    reason: lexical_alternative
  - marker: b
    text: Dalawang sinaunang instrumentong de-kuwerdas ang tinutukoy ng Hebreo; hindi tiyak ang eksaktong mga katumbas nito sa makabagong panahon.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Gumising ka / Gumising kayo
  rationale: Tuwirang pautos ang anyo. Ginamit ang isahan sa pagtawag sa “kaluwalhatian ko” at ang maramihan sa dalawang instrumentong kinakausap, ayon sa likas na balarila ng Tagalog.
- source_word: כְבוֹדִי
  choice: kaluwalhatian ko
  rationale: Pinananatili ang literal at matalinghagang pananalita ng Hebreo. Maaari itong maging patulang pagtukoy ng mang-aawit sa sarili, kaluluwa, o buong pagkatao, kaya inilagay ang mga alternatibo sa talababa.
- source_word: הַנֵּבֶל
  choice: alpa
  rationale: Sinaunang instrumentong de-kuwerdas na hindi tiyak ang eksaktong modernong katumbas. Pamilyar at malinaw sa Tagalog ang “alpa,” habang kinikilala sa talababa ang kawalang-katiyakan.
- source_word: כִנּוֹר
  choice: lira
  rationale: Sinaunang instrumentong de-kuwerdas na karaniwang tinutumbasan ng lyre. Pinag-iiba ito sa נבל sa pamamagitan ng “lira.”
- source_word: אָעִירָה
  choice: Gigisingin ko
  rationale: Ipinahahayag ng anyong causative ang matapang na layuning gisingin ang bukang-liwayway; natural din itong nag-iingat sa personipikasyon sa Tagalog.
- source_word: שָּׁחַר
  choice: ang bukang-liwayway
  rationale: Tumpak at maringal na katumbas ng madaling-araw o pagsikat ng araw, at mahusay na nagpapanatili sa matingkad na larawang patula.
theological_decisions:
- issue: Ang kahulugan ng “kaluwalhatian ko” bilang patulang pagtukoy sa sarili
  choice: Pinanatili sa pangunahing teksto ang “kaluwalhatian ko.”
  alternative: “kaluluwa ko” o “buong pagkatao ko”
  rationale: Hindi tiyak kung ang כְבוֹדִי ay literal na “aking kaluwalhatian” o idyomatikong tumutukoy sa panloob o buong sarili. Ang literal na anyo ay nag-iingat sa tunay na kalabuan at talinghaga; nasa talababa ang mga posibleng pakahulugan.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang matinding pag-uulit at personipikasyon ng Hebreong tula. Ang paglipat mula “Gumising ka” tungong “Gumising kayo” ay natural na Tagalog na pagtutugma sa bilang ng mga kinakausap.
