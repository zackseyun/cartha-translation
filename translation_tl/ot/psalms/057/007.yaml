  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: tl
  text: Matatag ang puso ko, O Diyos; matatag ang puso ko. Aawit ako at tutugtog ako ng mga himig ng papuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at aawit ako ng papuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: matatag
  rationale: Ipinahihiwatig ng salita ang pagiging matibay, panatag, o matatag na nakatalaga. Sa konteksto ng pagtitiwala at papuri, natural na ipinapahayag ng “matatag” ang katatagan at pagpapasya ng kalooban.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili nito ang larawang Hebreo ng puso bilang sentro ng kalooban, damdamin, at pagpapasya.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; ang “O Diyos” ay dignified at malinaw na bokatibo sa modernong Filipino.
- source_word: אָשִׁירָה
  choice: Aawit ako
  rationale: Ang anyong cohortative ay nagpapahayag ng matibay na pasya; natural itong naihahatid ng panghinaharap na “Aawit ako.”
- source_word: וַאֲזַמֵּרָה
  choice: at tutugtog ng papuri
  rationale: Ang pandiwa ay maaaring tumukoy sa paggawa ng musika o pag-awit ng papuri. Pinananatili ng “tutugtog ng papuri” ang musikal na diwa at iniiwasang maging payak na pag-uulit lamang ng “aawit.”
