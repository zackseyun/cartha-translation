  text: חָנֵּ֤/נִי אֱלֹהִ֨ים חָנֵּ֗/נִי כִּ֥י בְ/ךָ֮ חָסָ֪יָה נַ֫פְשִׁ֥/י וּ/בְ/צֵֽל כְּנָפֶ֥י/ךָ אֶחְסֶ֑ה עַ֝֗ד יַעֲבֹ֥ר הַוּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: tl
  text: 'Kaawaan mo ako, O Diyos, kaawaan mo ako,


    sapagkat sa iyo ako''y kumakanlong[a].


    At sa lilim ng iyong mga pakpak ako''y manganganlong


    hanggang sa lumipas ang mga kapahamakan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang aking nefesh ay kumakanlong sa iyo.” Ang נַפְשִׁי (nafshi, “aking nefesh”) ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa”; kaya maaari ring isalin na “sa iyo kumakanlong ang aking buhay” o “sa iyo ako kumakanlong.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pagkawasak” o “mga sakuna”; maramihan ang salitang Hebreo at tumutukoy sa mapanirang mga panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kaawaan mo ako
  rationale: Ang pautos na anyo ng חנן na may hulaping unang panauhan ay pakiusap na pagpakitaan ng pabor at habag. Likas at marangal sa makabagong Tagalog ang “Kaawaan mo ako,” bagaman maaari ring isalin na “Pagmagandahang-loob mo ako.”
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Karaniwang salin ng banal na titulong ginagamit dito bilang tuwirang pagtawag; idinagdag ang “O” upang maging natural ang panawagan sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap at malinaw na pinananatili ang ugnayang sanhi.
- source_word: בְךָ חָסָיָה נַפְשִׁי
  choice: sa iyo ako nanganganlong
  rationale: Ang בְּ kasama ng חסה ay tumutukoy sa kinikilalang kanlungan. Ang נַפְשִׁי ay maaaring mangahulugang “aking buhay,” “aking sarili,” o “aking kaluluwa”; ang paggamit ng “ako” ay natural sa Tagalog at iniiwasang ipakahulugan ang salita ayon sa isang tiyak na pilosopikal na antropolohiya.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: Sa lilim ng iyong mga pakpak
  rationale: Pinananatili ang matingkad na larawang patula ng proteksiyon sa halip na palitan ito ng paliwanag na “sa iyong pag-iingat.” Hindi kailangang tahasang isalin ang waw bilang “at” sa simula ng bagong linyang Tagalog upang maging maayos ang daloy.
- source_word: אֶחְסֶה
  choice: ako manganganlong
  rationale: Ang di-ganap na anyong unang panauhan ay angkop na nagpapahayag ng patuloy o hinaharap na pagtitiwala, kasunod ng naunang kalagayan ng pagkanlong.
- source_word: עַד יַעֲבֹר
  choice: hanggang sa lumipas
  rationale: Pinananatili ang panahong hangganan at ang larawan ng panganib na dumaraan at nawawala.
- source_word: הַוּוֹת
  choice: mga kapahamakan
  rationale: Ang pangngalan ay maramihan at tumutukoy sa mapanirang mga pangyayari o panganib. Pinananatili ng “mga kapahamakan” ang bilang at ang kolektibong diwa nang natural sa Tagalog.
theological_decisions:
- issue: Saklaw ng kahulugan ng נַפְשִׁי
  choice: sa iyo ako nanganganlong
  alternative: sa iyo nanganganlong ang aking kaluluwa / buhay
  rationale: Maaaring tukuyin ng נֶפֶשׁ ang buong sarili o buhay at hindi lamang ang isang di-materyal na bahagi ng tao. Inilalahad ng pangunahing teksto ang natural na kahulugan sa Tagalog, habang pinananatili sa talababa ang tunay na leksikal na lawak.
- issue: Larawan ng “lilim ng iyong mga pakpak”
  choice: panatilihin ang metaporang “Sa lilim ng iyong mga pakpak”
  alternative: sa iyong pag-iingat
  rationale: Hindi nilulutas o pinapaliwanag nang labis ang larawang antropomorpiko; hinahayaan itong magpahayag ng mapagkalingang proteksiyon ng Diyos ayon sa anyong patula ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na wikang panalangin. Ginamit ang “nanganganlong” upang mapanatili ang pag-uulit ng ugat na חסה sa dalawang hati ng talata, at pinanatili ang matulaing larawan ng mga pakpak. Ang paghahati sa maiikling linya ay umaayon sa paralelismo ng tulang Hebreo.
