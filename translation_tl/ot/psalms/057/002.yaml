  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: tl
  text: 'Tumatawag ako sa Kataas-taasang Diyos,

    sa Diyos na nagsasakatuparan ng kanyang layunin para sa akin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na nagdadala sa kaganapan ng nauukol sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: Tumatawag ako
  rationale: Ang Qal imperfect na unang panauhang isahan ng קרא ay maaaring magpahayag ng kasalukuyan, hinaharap, o kusang pasiya. Ang “Tumatawag ako” ay likas sa makabagong Filipino at hindi nagdaragdag ng tinding ipinahihiwatig ng “dumaraing.”
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: sa Kataas-taasang Diyos
  rationale: Ang עֶלְיוֹן ay titulong banal na nangangahulugang “Most High.” Ang “Kataas-taasang Diyos” ay malinaw, marangal, at karaniwang katumbas nito sa Filipino.
- source_word: לָאֵל
  choice: sa Diyos
  rationale: Ang אֵל ay karaniwang katawagan sa Diyos. Pinananatili ng “sa Diyos” ang magkatumbas na mga linya ng tula nang hindi ito ginagawang pangalang “El,” na maaaring hindi maunawaan ng karaniwang mambabasa.
- source_word: גֹמֵר
  choice: na tumutupad ng kanyang layunin
  rationale: Ang participle ng גמר ay tumutukoy sa pagtatapos o pagdadala sa kaganapan. Sa ugnayan nito sa עָלָי, ipinahahayag nitong dinadala ng Diyos sa katuparan ang nauukol sa nagsasalita.
- source_word: עָלָי
  choice: para sa akin
  rationale: Sa pariralang ito, ang עַל na may hulaping unang panauhan ay maaaring mangahulugang “para sa akin” o “tungkol sa akin.” Ang “para sa akin” ay natural at ipinapakita ang kapakinabangang tinatanggap ng salmista.
theological_decisions:
- issue: Kahulugan ng גֹמֵר עָלָי
  choice: Tinutupad ng Diyos ang kanyang layunin para sa salmista
  alternative: Tinatapos ng Diyos ang nauukol sa akin
  rationale: Ipinahihiwatig ng Hebreo na dinadala ng Diyos sa kaganapan ang nauukol sa nagsasalita. Ginagawang malinaw ng pangunahing salin ang idyoma, habang pinananatili sa talababa ang mas literal at tunay na posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkatulad na pariralang “sa … Diyos” upang maipakita ang paralelismo ng tulang Hebreo; ang paghahati sa dalawang linya ay tumutulong ding mapanatili ang anyong patula.
