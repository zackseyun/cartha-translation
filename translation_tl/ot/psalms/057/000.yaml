  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng musika: “Huwag Mong Wasakin.”[a] Kay David. Isang miktam[b], nang tumakas siya mula kay Saul, sa yungib.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring pamagat, pangalan ng himig, o koro ang “Huwag Mong Wasakin.”
    reason: alternative_reading
  - marker: b
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na isinalin-titik na “miktam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ipinahihiwatig ng katawagan sa mga pamagat ng Awit ang taong namamahala sa musikal na pagtatanghal. Likas sa modernong Tagalog ang pariralang ito at hindi nito nililimitahan ang tungkulin sa pag-awit lamang.
- source_word: אַל־תַּשְׁחֵת
  choice: “Huwag Mong Wasakin”
  rationale: Pinanatili bilang nakapaniping pamagat, pangalan ng himig, o koro sa halip na isama bilang utos sa katawan ng awit. Ginawang malaking titik ang mahahalagang salita upang ipakita ang tungkuling pamagat.
- source_word: לְדָוִד
  choice: Kay David
  rationale: Ang maikling anyong ito ay natural sa pamagat sa Tagalog at hindi tahasang nagpapasiya kung nangangahulugan itong isinulat ni David, para kay David, o nauugnay sa kanya.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Hindi tiyak ang kahulugan ng katawagang Hebreo, kaya isinalin-titik ito sa halip na bigyan ng haka-hakang kahulugang gaya ng “inskripsiyon” o “ginintuang awit.”
- source_word: בְּבָרְחוֹ
  choice: nang tumakas siya
  rationale: Ang infinitive construct na may בְּ ay temporal dito; malinaw at natural itong ipinahahayag ng “nang tumakas siya.”
- source_word: מִפְּנֵי שָׁאוּל
  choice: kay Saul
  rationale: Sa konteksto ng pagtakas, natural na ipinahahayag ng “tumakas kay Saul” ang Hebreong idyomang literal na “mula sa harap ni Saul,” nang hindi nagiging mabigat ang Tagalog.
- source_word: בַּמְּעָרָה
  choice: sa yungib
  rationale: Pinananatili ang lokatibong diwa ng pang-ukol at ang tiyak na anyo ng pangngalan. Ang “yungib” ay malinaw, marangal, at angkop sa salaysay.
theological_decisions:
- issue: Kalikasan ng buong teksto
  choice: Itinuring ang buong talata bilang pamagat ng awit.
  alternative: Ituring ang “Huwag Mong Wasakin” bilang utos na bahagi ng mismong tula.
  rationale: 'Binubuo ang Hebreo ng mga karaniwang sangkap ng pamagat: tagubiling musikal, posibleng pangalan ng himig o koro, kaugnayan kay David, katawagan sa uri, at kalagayang pangkasaysayan.'
- issue: Kahulugan ng לְדָוִד
  choice: Kay David
  alternative: Ni David / Para kay David
  rationale: Maaaring tumukoy ang לְ sa pag-akda, pag-uukol, o kaugnayan. Iniiwasan ng “Kay David” ang tiyak na pagpasya sa hindi nililinaw ng anyong Hebreo.
- issue: Kahulugan ng מִכְתָּם
  choice: Isinalin-titik bilang “miktam.”
  alternative: Inskripsiyon / ginintuang awit / lihim na awit
  rationale: Pinananatili ng transliterasyon ang tunay na kawalang-katiyakan ng katawagan at umiiwas sa pagpasok ng mapagtatalunang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal, angkop sa isang pamagat ng awit. Ginamit ang “tagapangasiwa ng awitan” para sa malinaw na tungkuling musikal at “yungib” bilang pamilyar ngunit dignified na katawagan. Pinanatili ang maiikling yunit at bantas ng superscription upang hindi ito magmukhang bahagi ng katawan ng tula.
