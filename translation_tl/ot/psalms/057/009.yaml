  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים אֲדֹנָ֑/י אֲ֝זַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: tl
  text: 'Magpapasalamat ako sa iyo sa gitna ng mga bayan[a], Panginoon;

    aawit ako ng papuri sa iyo sa gitna ng mga bansa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pupurihin kita sa gitna ng mga bayan.” Ang pandiwang Hebreo ay maaaring mangahulugang magpasalamat o magpuri; pinili ang “magpapasalamat” upang maipakita ang kaibahan nito sa “aawit ako ng papuri” sa kasunod na taludtod.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Magpapasalamat ako sa iyo
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpasalamat o magpuri. Pinili ang “magpapasalamat” upang mapanatili ang natatanging diwa nito kumpara sa “aawit ako ng papuri” sa kasunod na taludtod.
- source_word: בָעַמִּים
  choice: sa gitna ng mga bayan
  rationale: Ang עַמִּים ay maramihan at tumutukoy sa mga pangkat ng tao o mga bayan. Ang “sa gitna ng” ay likas na Filipino para sa pampook na diwang “among,” at pinananatili ng “mga bayan” ang kolektibong maramihan.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang banal na titulong אֲדֹנָי, hindi ang tetragrammaton. Kaya “Panginoon” ang ginamit, nang walang pagdaragdag ng pantawag na “O.”
- source_word: אֲזַמֶּרְךָ
  choice: aawit ako ng papuri sa iyo
  rationale: Sa konteksto ng mga awit, ang Piel ng זמר ay tumutukoy sa pag-awit ng papuri, na maaari ring may pahiwatig ng pagtugtog. Malinaw at likas sa modernong Filipino ang napiling parirala.
- source_word: בַּל
  choice: sa gitna ng
  rationale: Dito, ang בַּל ay makatang pang-ukol na kapantay ng ב sa unang taludtod at nagpapahayag ng pagiging “among” o nasa gitna ng isang pangkat.
- source_word: אֻמִּים
  choice: mga bansa
  rationale: Ang אֻמִּים ay maaaring tumukoy sa mga bansa o mga bayan. Ginamit ang “mga bansa” upang maipakita ang pagkakaiba nito sa naunang עַמִּים habang pinananatili ang magkatulad na estruktura ng tula.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: O Panginoon
  rationale: Titulong banal ang nasa Hebreo at hindi ang pangalang tipan na יְהוָה. Ang “Panginoon” ay tumpak at likas bilang tuwirang pagtawag, samantalang hindi kailangang idagdag ang “O,” na mas makaluma ang himig.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatulad na ayos ng dalawang taludtod at ang pagkakaiba ng “mga bayan” at “mga bansa,” pati ang aspektong panghinaharap ng dalawang pandiwa.
