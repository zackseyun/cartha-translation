  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: tl
  text: Maging mataas ka nawa higit sa mga langit, O Diyos; nawa’y mapasa buong lupa ang kaluwalhatian mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nasa buong lupa ang kaluwalhatian mo.” Walang pandiwa ang ikalawang taludtod sa Hebreo, kaya maaari itong unawain bilang panalangin o paghahangad, o bilang isang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Mataas ka nawa
  rationale: Ang anyong pautos o pakiusap mula sa רום ay isang doxolohikal na panawagan. Ang “Mataas ka nawa” ay likas sa makabagong Tagalog at naghahayag ng paghahangad na kilalanin ang kataasan ng Diyos, hindi lamang ng pisikal na pag-akyat.
- source_word: עַל הַשָּׁמַיִם
  choice: sa ibabaw ng kalangitan
  rationale: Pinananatili nito ang larawang pangkalawakan ng kataasan at pangingibabaw. Ang “kalangitan” ay angkop sa marangal na tulang panrelihiyon.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; malinaw at marangal sa Tagalog ang anyong bokatibong “O Diyos.”
- source_word: עַל כָּל הָאָרֶץ
  choice: sa buong lupa
  rationale: Ipinahahayag nito ang pandaigdig na saklaw ng kaluwalhatian. Sa ikalawang taludtod, mas natural sa Tagalog ang “sa buong lupa” kaysa sa pag-uulit ng “sa ibabaw ng.”
- source_word: כְּבוֹדֶךָ
  choice: ang kaluwalhatian mo
  rationale: Ang “kaluwalhatian” ang malinaw at karaniwang katumbas ng כבוד kapag tumutukoy sa hayag na karangalan, bigat, at kadakilaan ng Diyos.
theological_decisions:
- issue: Kung ang ikalawang taludtod na walang pandiwa ay isang panalangin/paghahangad o isang pahayag
  choice: mapasa buong lupa nawa ang kaluwalhatian mo
  alternative: nasa buong lupa ang kaluwalhatian mo
  rationale: Dahil kapantay ito ng panawagan sa unang taludtod, natural itong basahin bilang panalangin o paghahangad. Gayunman, tunay na walang pandiwa ang Hebreo, kaya inilalahad sa talababa ang posibleng deklaratibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog, na may payak na anyong patula. Ginamit ang “mapasa” upang maipahayag nang maikli ang hinihiling na presensiya o paghahari ng kaluwalhatian sa buong lupa; pinanatili sa talababa ang tunay na gramatikal na kalabuan ng Hebreo.
