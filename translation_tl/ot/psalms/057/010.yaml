  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: tl
  text: Sapagkat ang iyong tapat na pag-ibig ay dakila hanggang sa kalangitan,[a] at ang iyong katapatan ay hanggang sa mga ulap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat ang iyong tapat na pag-ibig ay dakila hanggang sa kalangitan, at ang iyong katotohanan ay hanggang sa mga ulap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang papuri, habang pinananatili ang likas na daloy ng tula.
- source_word: גָדֹל
  choice: dakila
  rationale: Likas at marangal na paglalarawan sa lawak at kadakilaan ng pag-ibig ng Diyos.
- source_word: עַד
  choice: hanggang sa
  rationale: Pinananatili ang larawang nagpapahayag ng abot o lawak patungo sa kalangitan at mga ulap.
- source_word: שָׁמַיִם
  choice: kalangitan
  rationale: Angkop sa matayog na pananalita ng tulang Hebreo at tumutukoy sa langit o himpapawid sa itaas.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Sinasaklaw nito ang pag-ibig, katapatan, at matibay na kagandahang-loob na ipinahihiwatig ng חֶסֶד nang hindi gumagamit ng teknikal na terminong pangdoktrina.
- source_word: וְעַד
  choice: at ... hanggang sa
  rationale: Pinananatili ang balanseng paralelismo at pag-uulit ng pang-ukol sa Hebreo.
- source_word: שְׁחָקִים
  choice: mga ulap
  rationale: Nagbibigay ng kongkretong larawang patula at umaayon sa paralelismo sa kalangitan.
- source_word: אֲמִתֶּךָ
  choice: iyong katapatan
  rationale: Sa pagkakatambal nito sa חֶסֶד, ipinahihiwatig nito ang pagiging maaasahan at tapat ng Diyos; maaari rin itong mangahulugang katotohanan.
theological_decisions:
- issue: Paglalarawan sa magkatuwang na mga katangian ng Diyos sa חֶסֶד at אֱמֶת
  choice: “tapat na pag-ibig” at “katapatan”
  alternative: “wagas na pag-ibig” at “katotohanan”
  rationale: Pinakamalinaw na naihahayag ng napiling pares ang matibay na pag-ibig at pagiging maaasahan ng Diyos sa konteksto, habang kinikilala sa talababa ang tunay na leksikal na posibilidad ng “katotohanan.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatugmang estruktura at matayog na larawan ng tulang Hebreo; iniwasan ang teknikal o denominasyonal na pananalita.
