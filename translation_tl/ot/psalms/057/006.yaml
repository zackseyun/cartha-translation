  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: tl
  text: Naghanda sila ng lambat para sa aking mga hakbang[a]; napayuko ang aking kaluluwa[b]; naghukay sila ng hukay sa harapan ko; nahulog sila sa gitna nito[c]. Selah[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bitag” sa halip na “lambat.”
    reason: lexical_alternative
  - marker: b
    text: Ang “aking kaluluwa” ay maaari ring mangahulugang “ako” o “aking buhay.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa gitna nito.”
    reason: lexical_alternative
  - marker: d
    text: Ang kahulugan ng “Selah” ay hindi tiyak; malamang na isa itong panandang pangmusika o panliturhiya.
    reason: translation_explanation
lexical_decisions:
- source_word: רֶשֶׁת
  choice: lambat
  rationale: Tuwirang tumutukoy ang salita sa lambat na ginagamit sa paghuli; pinananatili nito ang kongkretong larawan ng bitag.
- source_word: הֵכִינוּ
  choice: naghanda sila
  rationale: Ipinahahayag ng Hiphil ng כון ang sinadyang paghahanda o paggawa na handa na ang isang bagay.
- source_word: לִפְעָמַי
  choice: para sa aking mga hakbang
  rationale: Maaaring tumukoy ang פעם sa paa o hakbang; pinananatili ng salin ang maramihang anyo at larawan ng paglalakad patungo sa patibong.
- source_word: כָּפַף נַפְשִׁי
  choice: nakayuko ang aking kaluluwa
  rationale: Pinananatili ang larawang ‘yumuko/napayuko’ at ang patulang נֶפֶשׁ, nang hindi nililimitahan ito sa damdamin lamang.
- source_word: כָּרוּ
  choice: naghukay sila
  rationale: Ito ang tuwiran at likas na katumbas ng pandiwang nangangahulugang maghukay.
- source_word: לְפָנַי
  choice: sa harapan ko
  rationale: Pinananatili ang lokasyong ipinahahayag ng pariralang Hebreo.
- source_word: שִׁיחָה
  choice: hukay
  rationale: Ang pangngalan ay isang hukay na maaaring gamiting patibong; sapat na malinaw ang ‘hukay’ nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: nahulog sila sa gitna nito
  rationale: Pinananatili ang biglang pagbaligtad ng kanilang pakana at ang tiyak na diwang ‘sa gitna nito.’
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan nito, kaya tinumbasan ito sa pamamagitan ng transliterasyon bilang posibleng pananda sa musika o pagsamba.
theological_decisions:
- issue: Ang kahulugan ng נַפְשִׁי
  choice: aking kaluluwa
  alternative: ako / aking buhay
  rationale: Pinananatili ng ‘aking kaluluwa’ ang patulang antropolohikal na pananalita ng Hebreo, habang inilalahad sa talababa ang mas malawak na saklaw ng נֶפֶשׁ.
- issue: Ang kayarian ng כָּפַף נַפְשִׁי
  choice: nakayuko ang aking kaluluwa
  alternative: ibinaba niya ang aking buhay / napayuko ako
  rationale: Hindi ganap na malinaw ang ugnayang gramatikal ng pandiwa at ng ‘aking kaluluwa.’ Pinipili ng pangunahing teksto ang tradisyonal at natural na statibong pagbasa, ngunit hindi itinatago sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang magkapares na larawang ‘lambat/mga hakbang’ at ‘hukay/nahulog,’ gayundin ang patulang ‘aking kaluluwa.’ Iniwasan ang pagdaragdag ng tahasang pang-ugnay na tulad ng ‘ngunit’ upang manatili ang maigsi at matinding pagbaligtad sa Hebreo.
