source:
  edition: WLC
  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: tl
  text: 'Ang kaluluwa ko ay nasa gitna ng mga leon;


    nakahiga ako sa gitna ng mga naglalagablab[b]—


    mga anak ng tao[a] na ang mga ngipin ay mga sibat at palaso,


    at ang kanilang dila ay isang matalas na tabak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tao.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga naglalagablab” ay maaari ring isaling “mga nag-aalab” o “mga nagliliyab,” na naglalarawan sa mabangis na pagkapoot ng mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Ang kaluluwa ko
  rationale: Pinananatili ang ποιetikong larawan ng נֶפֶשׁ bilang sarili o buhay na nanganganib, sa halip na gawing payak na “ako.”
- source_word: בְּתוֹךְ לְבָאִם
  choice: nasa gitna ng mga leon
  rationale: Tuwirang pinananatili ang larawan ng pagkubkob ng mga leon, literal man o metaporikal.
- source_word: אֶשְׁכְּבָה
  choice: nakahiga ako
  rationale: Likas sa modernong Tagalog at pinananatili ang konkretong tindig ng pandiwang שׁכב; maaaring ipahiwatig ng anyong Hebreo ang kasalukuyang kalagayan o kusang paghiga.
- source_word: לֹהֲטִים
  choice: mga naglalagablab
  rationale: Pinananatili ang metapora ng pag-aalab at ang siksik na sintaks, nang hindi ito nililimitahan sa galit o pamumuksa lamang.
- source_word: בְּנֵי אָדָם
  choice: mga anak ng tao
  rationale: Pinananatili ang maskulino at ποιetikong anyo ng Hebreo habang nililinaw sa talababa ang idiomatikong kahulugan.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: ang mga ngipin ay mga sibat at palaso
  rationale: Pinananatili ang marahas na metapora; ginawang maramihan ang “sibat” sa Tagalog upang natural na tumugma sa maramihang ngipin at mga palaso.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: ang kanilang dila ay isang matalas na tabak
  rationale: Tuwirang pinananatili ang kolektibong isahan at ang metapora ng mapaminsalang pananalita.
theological_decisions:
- issue: Kung literal o metaporikal ang mga leon at sandata
  choice: Panatilihin ang mga larawan bilang ποιetikong paglalarawan nang hindi ipinapasiya kung literal o ganap na metaporikal.
  alternative: Ipaliwanag ang lahat bilang mararahas na taong kaaway, o ituring na magkahiwalay ang literal na mga leon at mga tao.
  rationale: Mula sa “mga leon” ay lumilipat ang talata sa “mga anak ng tao.” Dapat manatili ang sadyang pag-igting at pagpapatong ng mga larawan.
- issue: Saklaw ng בְּנֵי אָדָם
  choice: mga anak ng tao
  alternative: mga tao; mga lalaki; mga anak ni Adan
  rationale: Pinananatili nito ang anyong maskulino at ποιetiko ng orihinal, habang ipinapaliwanag sa talababa na tumutukoy ito sa mga taong kaaway.
- issue: Pagkakaugnay ng לֹהֲטִים sa mga taong kaaway
  choice: Iugnay ang “mga naglalagablab” sa “mga anak ng tao” ngunit panatilihin ang metaporikal na kalabuan.
  alternative: Isalin bilang “mga maninila” o tahasang “nag-aalab sa galit.”
  rationale: Ang salitang Hebreo ay nagpapahiwatig ng pagliyab o paglalagablab; ang mas tiyak na pagpapakahulugan ay mag-aalis ng tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at ποιetiko ngunit madaling maunawaan. Ginamit ang “nakahiga ako” sa halip na mas arkaikong “ako'y nahihimlay,” at pinanatili ang magkakaugnay na mga larawang leon, apoy, ngipin, sandata, at tabak.
