  text: 'Dakilain ka nawa sa ibabaw ng kalangitan, O Diyos;


    mangibabaw nawa sa buong daigdig ang kaluwalhatian mo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nangingibabaw sa buong daigdig ang kaluwalhatian mo.” Walang tahasang pandiwa ang ikalawang hati ng taludtod sa Hebreo, kaya kailangang unawain ito mula sa konteksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Dakilain ka nang higit
  rationale: Ang anyong pautos/pakiusap ng רום ay humihiling na mahayag ang kataasan at kadakilaan ng Diyos. Likas sa makabagong Filipino ang “Dakilain ka,” habang pinananatili ng “nang higit” ang larawang patayo na kasama ng עַל.
- source_word: עַל שָׁמַיִם
  choice: nang higit sa kalangitan
  rationale: Ipinapahayag ng עַל ang pagiging nasa itaas o nangingibabaw, at ang שָׁמַיִם ay ang kalangitan. Ang parirala ay parehong makata at malinaw sa karaniwang mambabasa.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; ang “O” ay angkop sa marangal at makatang panalangin.
- source_word: עַל כָּל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Dahil kaparis ito ng “kalangitan,” kosmiko ang saklaw ng הָאָרֶץ, kaya “daigdig” at hindi “lupain.” Natural sa Filipino ang “buong daigdig.”
- source_word: כְּבוֹדֶךָ
  choice: ang kaluwalhatian mo
  rationale: Ang כָּבוֹד kapag tumutukoy sa Diyos ay nagpapahiwatig ng nahahayag niyang kadakilaan at karangalan. “Kaluwalhatian” ang malinaw at kinikilalang katumbas sa ganitong konteksto.
theological_decisions:
- issue: Walang tahasang pandiwa ang ikalawang hati ng taludtod sa Hebreo.
  choice: angibabaw nawa sa buong daigdig ang kaluwalhatian mo
  alternative: nangingibabaw sa buong daigdig ang kaluwalhatian mo
  rationale: Ipinagpapatuloy ng “nawa” ang pakiusap ng unang hati at pinananatili ang paralelismong panalangin. Gayunman, maaari ring basahin ang sugnay bilang isang pahayag; inilalahad iyon sa talababa upang hindi alisin ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabago, marangal, at makatang Filipino. Ginamit ang “Dakilain ka” sa halip na ang mas literal ngunit hindi gaanong natural na “Itaas ka,” at ang “nangibabaw nawa” upang mapanatili ang tono ng panalangin at ang larawang kataasan.
