base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: tl
  text: Magpapadala siya mula sa langit at ililigtas ako[a]; lalaitin niya ang humahabol sa akin[b]. Selah. Ipapadala ng Diyos ang kanyang tapat na pag-ibig at ang kanyang katapatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “hinahamak ako ng humahabol sa akin,” kung ang kaaway ang simuno ng “humahamak”; o, “ililigtas ako mula sa panlalait ng humahabol sa akin.”'
    reason: alternative_reading
  - marker: b
    text: Ang “humahabol sa akin” ay literal na may larawang “humihingal sa paghabol sa akin,” at maaari ring unawaing “nagnanais lumamon sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Magsusugo siya / Isusugo ng Diyos
  rationale: Ang Qal imperfect ay ipinahayag bilang hinaharap na may pagtitiwala; ginawang tahasan ang Diyos bilang simuno sa ikalawang paglitaw, gaya ng Hebreo.
- source_word: מִשָּׁמַיִם
  choice: mula sa langit
  rationale: Likas na modernong Tagalog para sa pinagmumulan ng pagkilos ng Diyos, nang hindi ipinipilit ang literal na pangmaramihang anyo.
- source_word: וְיוֹשִׁיעֵנִי
  choice: at ililigtas ako
  rationale: Malawak at natural na katumbas ng Hiphil ng ישׁע sa konteksto ng panganib.
- source_word: חֵרֵף
  choice: hahamakin niya
  rationale: Pinananatili ang tuwirang diwa ng pandiwang 'manlait, humamak' at ang Diyos bilang posibleng simuno, sa halip na gawing interpretibong bunga na 'ipapahiya.'
- source_word: שֹׁאֲפִי
  choice: ang humahabol sa akin
  rationale: Ipinahahayag sa malinaw na Tagalog ang mapanlabang larawan ng sabik na pagtugis; inilalagay sa talababa ang mas literal na larawan.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili ang tradisyonal na transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan ng termino.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang katumbas ng banal na titulo, na malinaw na isahan sa konteksto.
- source_word: חַסְדּוֹ
  choice: kanyang tapat na pag-ibig
  rationale: Sinasaklaw ang pag-ibig, awa, at matatag na katapatan na taglay ng חֶסֶד.
- source_word: וַאֲמִתּוֹ
  choice: at ang kanyang katapatan
  rationale: Sa tambalan nito sa חֶסֶד, ang 'katapatan' ang pinakamalinaw na katumbas ng pagiging totoo at maaasahan.
theological_decisions:
- issue: Pagpapakahulugan sa חֵרֵף שֹׁאֲפִי
  choice: 'Ang Diyos ang simuno: “hahamakin niya ang humahabol sa akin.”'
  alternative: 'Maaaring ang humahabol ang simuno: “hinahamak ako ng humahabol sa akin”; maaari ring unawaing inililigtas siya mula sa panlalait ng humahabol.'
  rationale: Siksik at malabo ang sintaks ng Hebreo. Pinananatili sa pangunahing teksto ang pagkakaugnay ng mga kilos ng Diyos, habang malinaw na itinatala sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hahamakin” upang manatiling malapit sa pandiwang Hebreo, at “humahabol” upang maging natural ang mapanlabang idyoma; pinanatili sa mga talababa ang literal na larawan at sintaktikong kalabuan.
