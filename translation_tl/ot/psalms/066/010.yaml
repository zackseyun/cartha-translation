  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: tl
  text: Sapagkat sinubok mo kami[a], O Diyos; dinalisay mo kami gaya ng pagdadalisay ng pilak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinuri mo kami” o “pinatunayan mo kami”; maaaring idiin ng pandiwang Hebreo ang pagsubok upang mahayag ang tunay na uri o katangian.
    reason: lexical_alternative
  - marker: b
    text: 'Larawan ito mula sa pagdadalisay ng metal: inihahambing ang pagsubok ng Diyos sa pagdadalisay ng pilak sa apoy.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng papuri sa konteksto at likas na naghahatid ng paliwanag sa Filipino.
- source_word: בְחַנְתָּנוּ
  choice: sinubok mo kami
  rationale: Ang pandiwang בחן ay tumutukoy sa pagsusuri o pagsubok na maaaring magpatunay sa tunay na uri o katangian ng sinusubok.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Pinananatili ang tuwirang pagtawag sa Diyos at ang marangal na himig ng tula.
- source_word: צְרַפְתָּנוּ
  choice: dinalisay mo kami
  rationale: Ang צרף ay ginagamit sa pagdadalisay ng metal sa pamamagitan ng apoy; pinananatili ng “dinalisay” ang metaporang metalurhiko.
- source_word: כִּצְרָף
  choice: gaya ng pagdalisay sa
  rationale: Ang כ־ ay naghahayag ng paghahambing, at ang anyo ay naglalarawan sa pangkalahatang proseso ng pagdalisay.
- source_word: כָּסֶף
  choice: pilak
  rationale: Tuwirang tumutukoy sa mahalagang metal na ginagamit sa paghahambing.
theological_decisions:
- issue: Kaugnayan ng pagsubok at pagdadalisay
  choice: Pinanatiling magkaugnay ngunit hindi lubusang pinag-isa ang “sinubok” at “dinalisay.”
  alternative: Isalin ang una bilang “pinatunayan” o ang ikalawa bilang “nilinis” upang gawing mas tahasang espirituwal ang diwa.
  rationale: Ang Hebreo ay gumagamit ng dalawang magkaibang pandiwa at ng larawang metalurhiko. Ang salin ay hindi dapat magtakda nang higit sa teksto kung ang pagsubok ay parusa, pagpapatunay, o espirituwal na paglilinis lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” para sa paliwanag na ugnayan sa konteksto, at pinanatili ang patulang tuwirang pagtawag na “O Diyos.”
