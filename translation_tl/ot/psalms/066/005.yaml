  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: tl
  text: Halikayo at tingnan ninyo ang mga gawa ng Diyos; kagila-gilalas ang kanyang pagkilos sa sangkatauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga anak ng tao” o “sa mga anak ni Adan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Halikayo
  rationale: Maramihang pautos na ginagamit bilang paanyaya. Mas likas sa modernong Tagalog ang “Halikayo” kaysa literal na “Humayo kayo” sa pariralang nag-aanyayang tumingin.
- source_word: וּרְאוּ
  choice: at tingnan ninyo
  rationale: Pinananatili ang maramihang pautos at ang panawagang pagmasdan ang ginawa ng Diyos.
- source_word: מִפְעֲלוֹת
  choice: mga gawa
  rationale: Tumutukoy sa mga isinagawa ng Diyos at nagpapanatili ng malawak at marangal na kahulugan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang Diyos ng Israel ang malinaw na tinutukoy, kaya ang pang-isahang “Diyos” ang angkop.
- source_word: נוֹרָא
  choice: kagila-gilalas
  rationale: Ipinahahayag ang pagkamangha at pagpipitagan na likha ng kilos ng Diyos. Hindi ito ginawang “nakakatakot” lamang, sapagkat maaaring saklawin ng Hebreo ang sindak at paghanga.
- source_word: עֲלִילָה
  choice: ginawa
  rationale: Pang-isahan at kolektibong katawagan sa pagkilos ng Diyos. Ang “ginawa” ay natural sa Tagalog at bahagyang naiiba sa naunang “mga gawa.”
- source_word: עַל
  choice: sa
  rationale: Malawak na panandang tumutukoy sa pinag-uukulan o naaabot ng pagkilos ng Diyos, nang hindi ipinapalagay kung iyon ay pabor o paghatol.
- source_word: בְּנֵי אָדָם
  choice: sangkatauhan
  rationale: Karaniwang Hebreong idyoma para sa lahat ng tao. Ang “sangkatauhan” ang malinaw at likas na katumbas sa modernong Tagalog; inilagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Kahulugan ng נוֹרָא bilang paglalarawan sa pagkilos ng Diyos
  choice: kagila-gilalas
  alternative: kakila-kilabot
  rationale: Pinananatili ng “kagila-gilalas” ang pagkamangha at pagpipitagan nang hindi nililimitahan ang taludtod sa takot o masamang epekto. Gayunman, taglay ng salitang Hebreo ang masidhing pangingilabot na kaakibat ng banal na pagkamangha.
- issue: Paglalarawan sa בְּנֵי אָדָם
  choice: sangkatauhan
  alternative: mga anak ng tao / mga anak ni Adan
  rationale: Idyomatiko itong tumutukoy sa mga tao sa pangkalahatan. Iniiwasan ng pangunahing salin ang di-likas at posibleng malabong pariralang “mga anak ng tao,” habang pinananatili sa talababa ang literal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Halikayo” bilang likas na maramihang paanyaya at “sangkatauhan” para sa idyomatikong pangkalahatang pagtukoy sa lahat ng tao.
