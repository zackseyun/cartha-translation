  text: Papasok ako sa iyong bahay na may mga handog na sinusunog; tutuparin ko ang aking mga panata sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבוֹא
  choice: Papasok ako
  rationale: Ang Qal imperfect 1cs ng בוא ay nagsasaad ng nilalayon o darating na kilos. Sa Filipino, natural ang “papasok” kasunod ng “sa iyong bahay” at saklaw nito ang diwang “darating/papasok.”
- source_word: בֵיתְךָ
  choice: iyong bahay
  rationale: Literal itong “iyong bahay.” Bagaman tumutukoy sa santuwaryo o templo ng Diyos sa konteksto, pinananatili ng salin ang kongkretong larawan ng Hebreo nang hindi ito agad pinapaliit sa isang interpretasyon.
- source_word: בְעוֹלוֹת
  choice: na may dalang mga handog na sinusunog
  rationale: Ang עוֹלָה ay karaniwang terminong panghandog para sa handog na buong sinusunog. Ipinahihiwatig ng ב ang pagsama ng mga handog; natural sa Filipino ang “may dalang” sa konteksto ng pagpunta sa bahay ng Diyos.
- source_word: אֲשַׁלֵּם
  choice: tutuparin ko
  rationale: Sa Piel at sa idyoma tungkol sa mga panata, ang שלם ay nangangahulugang bayaran o tuparin ang ipinangako. Malinaw at likas sa modernong Filipino ang “tutuparin,” at hindi nito binibigyan ng labis na komersiyal na himig ang panata.
- source_word: לְךָ
  choice: sa iyo
  rationale: Tinutukoy ng ל ang Diyos bilang pinag-uukulan ng pagtupad sa mga panata. Ang “sa iyo” ang maikli at natural na katumbas.
- source_word: נְדָרָי
  choice: ang aking mga panata
  rationale: Pangmaramihang pangngalan ito na may hulaping unang panauhang isahan, kaya tuwirang nangangahulugang “aking mga panata.”
theological_decisions:
- issue: Kung isasalin ba ang “iyong bahay” bilang teknikal na katawagang “iyong templo” o “iyong santuwaryo” sa pangunahing teksto
  choice: Panatilihin ang “iyong bahay”
  alternative: iyong templo; iyong santuwaryo
  rationale: בֵיתְךָ ang mismong Hebreo, “iyong bahay.” Malamang na santuwaryo o templo ang tinutukoy dahil sa mga handog na sinusunog, ngunit hindi kailangang tahasang lutasin iyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “handog na sinusunog” bilang malinaw na katawagang pansakripisyo at ang “panata” para sa taimtim na pangakong ginawa sa Diyos. Walang talababa dahil walang kailangang marker upang maipaliwanag ang salin nang hindi pinabibigat ang isang talata.
