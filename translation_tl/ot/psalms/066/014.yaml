  text: which my lips uttered and my mouth spoke when I was in distress[a].
translation:
  language: tl
  text: na binigkas ng aking mga labi at sinabi ng aking bibig nang ako'y nasa kagipitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na binuksan ng aking mga labi.” Ang idyomang Hebreo ay nangangahulugang magsalita o bumigkas ng mga salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Ipinag-uugnay nito ang sugnay sa mga panata sa naunang talata; natural sa Filipino ang pang-ugnay na “na.”
- source_word: פָּצוּ
  choice: binigkas
  rationale: Literal itong “binuksan,” na tumutukoy sa pagbuka ng mga labi upang magsalita. Inihahatid ng “binigkas” ang idyomatikong diwa habang pinananatili ang kilos ng pagsasalita.
- source_word: שְׂפָתַי
  choice: aking mga labi
  rationale: Pinananatili ang larawang tumutukoy sa bahagi ng katawan at ang pagtutulad nito sa “aking bibig” sa kasunod na linya.
- source_word: וְדִבֶּר
  choice: at sinabi
  rationale: Natural na salin ng pandiwang “magsalita” sa konteksto ng mga panata at malinaw na kaagapay ng “binigkas.”
- source_word: פִּי
  choice: aking bibig
  rationale: Literal na salin na nagpapanatili sa makatang paralelismong “aking mga labi / aking bibig.”
- source_word: בַּצַּר לִי
  choice: nang ako'y nasa kagipitan
  rationale: Ipinahahayag ang panahong dumanas ng matinding suliranin ang nagsasalita; dignified at karaniwan sa makabagong Filipino ang “nasa kagipitan.”
