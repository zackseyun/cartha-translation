  text: For the choir director[a]. A song, a psalm. Shout joyfully to God[b], all the earth.
translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan.[a] Isang awit, isang salmo. Buong lupa, sumigaw kayo sa Diyos![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Para sa tagapangasiwa ng musika” o “Para sa pinuno ng mga mang-aawit.”
