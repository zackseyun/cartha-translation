  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: tl
  text: Kung kinimkim ko ang kasamaan sa puso ko[a], hindi sana ako pinakinggan ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung itinuring kong mabuti ang kasamaan sa puso ko.” Sa literal, “Kung nakita ko ang kasamaan sa puso ko.”
    reason: Pinananatili ang leksikal at idyomatikong alternatibo ng רָאִיתִי, na literal na “nakita ko” ngunit maaaring mangahulugang “itinuring” o “pinahalagahan” sa kontekstong ito.
lexical_decisions:
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa kontekstong moral, tumutukoy ito sa masamang gawa o kasalanan. Likas at malinaw sa modernong Tagalog ang “kasamaan” nang hindi ito nililimitahan sa isang partikular na uri ng kasalanan.
- source_word: אִם
  choice: kung
  rationale: Payak na panandang kondisyon ang אִם; ang “kung” ang tuwirang katumbas nito sa Tagalog.
- source_word: רָאִיתִי
  choice: kinimkim ko
  rationale: Bagaman literal na “nakita ko,” sa pariralang may “sa puso ko” ipinahihiwatig nito ang sadyang pagkilala, pagpapahalaga, o pagkukupkop sa kasamaan. Ipinahahayag ng “kinimkim” ang panloob at kusang pagpapanatili nito.
- source_word: בְלִבִּי
  choice: sa puso ko
  rationale: Pinananatili nito ang malinaw na larawang Hebreo ng puso bilang sentro ng kalooban at pag-iisip.
- source_word: לֹא יִשְׁמַע
  choice: hindi sana ako pinakinggan
  rationale: Sa konteksto ng panalangin, ang שׁמע ay higit sa pisikal na pagkarinig at tumutukoy sa mapagbigay-pansing pakikinig. Ang “sana” ay natural na nagpapahayag sa Tagalog ng bunga ng di-naganap na kondisyon, nang hindi pinapalawak tungo sa tahasang “sinagot.”
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Ito ang likas at marangal na salin ng nakapirming banal na titulong אֲדֹנָי sa Tagalog.
theological_decisions:
- issue: Kung literal bang isasalin ang idyomang “nakita ko ang kasamaan sa puso ko” o ipahahayag ang diwa nito
  choice: “kinimkim ko ang kasamaan sa puso ko”
  alternative: “itinuring ko ang kasamaan sa puso ko” o “nakita ko ang kasamaan sa puso ko”
  rationale: Hindi simpleng pagkabatid sa sariling kasalanan ang punto kundi ang kusang pagkukupkop o pagbibigay-pabor dito. Pinananatili ng “kinimkim” ang moral na bigat ng idyoma nang hindi inaalis ang larawan ng puso.
- issue: Kung ang שׁמע ay isasaling “narinig,” “pinakinggan,” o “sinagot”
  choice: “pinakinggan”
  alternative: “dininig” o “sinagot”
  rationale: Ipinahihiwatig ng “pinakinggan” ang mapagbigay-pansing pagtanggap sa panalangin ngunit hindi nito ipinapalagay ang tahasang pagsagot, na hindi direktang sinasabi ng pandiwang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kinimkim” upang natural na maipahayag ang idyomang Hebreo, at “hindi sana ako pinakinggan” upang malinaw ang kontrapaktuwal na kondisyon at ang diwa ng mapagbigay-pansing pakikinig sa panalangin.
