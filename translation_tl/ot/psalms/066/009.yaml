  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: tl
  text: Siya ang nagpapanatili sa atin na buháy[a][b] at hindi hinayaang madulas ang ating mga paa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Siya ang naglalagay sa atin sa gitna ng mga buháy.” Ang pangunahing kahulugan ng pandiwang Hebreo ay “ilagay,” ngunit dito ay ipinahihiwatig nito ang pagpapanatiling buháy.
    reason: lexical_alternative
  - marker: b
    text: Ang “atin” ay maaari ring isaling “ating buhay” o “ating kaluluwa.” Malawak ang saklaw ng salitang Hebreo na נֶפֶשׁ at kabilang dito ang buhay, sarili, at tao.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “hindi hinayaang matinag ang ating mga paa” o “hindi hinayaang mawalan ng katatagan ang ating mga paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: ang nagpapanatili
  rationale: Ang participle ng שׂוּם ay literal na “naglalagay” o “nagtatalaga,” ngunit sa pariralang ito ay tumutukoy sa patuloy na pag-iingat ng Diyos sa buhay. Likas sa modernong Tagalog ang “nagpapanatili” at napapanatili rin nito ang participial na paglalarawan sa Diyos.
- source_word: נַפְשֵׁנוּ
  choice: ating buhay
  rationale: Malawak ang saklaw ng נֶפֶשׁ at maaari itong mangahulugang kaluluwa, buhay, sarili, o mismong tao. Sa kontekstong בַּחַיִּים, pinakamalinaw ang “ating buhay” nang hindi ipinapalagay ang mas makitid na antropolohikal na diwa ng “kaluluwa.”
- source_word: בַּחַיִּים
  choice: sa buhay
  rationale: Ang literal na anyo ay “sa buhay” o “sa gitna ng mga buháy.” Kasama ng הַשָּׂם, ipinahihiwatig nito na iniingatan ang buhay. Ang “sa ating buhay” sa buong parirala ay natural sa Tagalog, samantalang inilalahad sa talababa ang mas literal na pagbasa.
- source_word: וְלֹא נָתַן
  choice: at hindi hinayaang
  rationale: Ang נָתַן na sinusundan ng infinitive ay may idyomatikong kahulugang “pahintulutan” o “hayaan.” Ang “hindi hinayaang” ay malinaw at natural na Tagalog.
- source_word: לַמּוֹט
  choice: madulas
  rationale: Ang מוֹט ay nagpapahiwatig ng pagkawala ng katatagan—pag-uga, pag-indayog, o pagkadulas. Dahil mga paa ang paksa, natural at matingkad ang “madulas,” habang pinananatili ang konkretong larawan.
- source_word: רַגְלֵנוּ
  choice: ang ating mga paa
  rationale: Tuwirang salin ito ng pangmaramihang “aming mga paa.” Pinananatili ang konkretong talinghaga ng katatagan sa halip na palitan ito ng abstraktong paliwanag.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto
  choice: ating buhay
  alternative: ating kaluluwa; tayo
  rationale: Hindi nililimitahan ang נֶפֶשׁ sa isang hiwalay na espirituwal na bahagi ng tao. Sa kontekstong ito, pangunahing diwa nito ang buhay o ang taong pinananatiling buháy; nakatala ang ibang lehitimong pagbasa sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Siya ang” upang natural na maipahayag ang substantival participle na tumutukoy sa Diyos. Pinanatili ang larawan ng mga paang hindi nadudulas at iniwasan ang denominasyonal o labis na sistematikong pagpapakahulugan.
