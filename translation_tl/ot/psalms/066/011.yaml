  text: Dinala mo kami sa bitag[a]; ipinataw mo sa aming mga balakang ang kagipitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lambat,” “sa tanggulan,” o “sa lugar na pinagkukulungan.” Maaaring tumukoy ang salitang Hebreo sa kagamitan o lugar ng paghuli at pagkakulong.
    reason: lexical_alternative
