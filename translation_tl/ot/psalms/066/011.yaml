    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Dinala mo kami
  rationale: Ang Hiphil ng בוא na may hulaping unang panauhang maramihan ay nangangahulugang ‘dinala mo kami’ o ‘ipinasok mo kami’; pinananatili nito ang tuwirang pagkilos ng Diyos.
- source_word: בַמְּצוּדָה
  choice: sa bitag
  rationale: Maaaring tumukoy ang מְצוּדָה sa lambat, bitag, o tanggulang lugar. Sa konteksto ng pagkakahuli at pagkakakulong, natural at malinaw ang ‘bitag,’ habang inilalahad sa talababa ang tunay na saklaw ng salita.
- source_word: שַׂמְתָּ
  choice: pinasan mo
  rationale: Literal na ‘inilagay mo’; sa kasunod na larawang nasa mga balakang ang mabigat na pasakit, ang ‘pinasan mo’ ay natural na Filipino at pinananatili ang diwa ng isang ipinataw na pasan.
- source_word: מוּעָקָה
  choice: mabigat na pasakit
  rationale: Ang salita ay nagpapahiwatig ng kagipitan, presyon, pagkakasakal, o mabigat na pasan. Ipinahahayag ng ‘mabigat na pasakit’ ang kapwa paghihirap at pasaning ipinataw.
- source_word: בְמָתְנֵינוּ
  choice: sa aming mga balakang
  rationale: Ang מָתְנַיִם ay literal na tumutukoy sa mga balakang o baywang. Ang ‘mga balakang’ ay kasalukuyan at madaling maunawaan habang pinananatili ang larawang pangkatawan.
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa larawan ng pagdurusa
  choice: 'Pinanatili ang Diyos bilang tahasang gumagawa: ‘Dinala mo’ at ‘pinasan mo.’'
  alternative: Palabuin ang pagkilos ng Diyos, gaya ng ‘napunta kami sa bitag’ o ‘dumating sa amin ang pasakit.’
  rationale: Dalawang pandiwang ikalawang panauhan ang tahasang kumakausap sa Diyos at nag-uugnay sa kaniya ng pagsubok. Hindi dapat pahinain ng salin ang teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang konkretong larawan ng bitag at mga balakang, gayundin ang tuwirang pananagutan ng Diyos sa pagsubok. Ang ‘pinasan mo sa’ ay bahagyang dinamikong pagbuo upang maging likas sa Filipino nang hindi binabago ang ipinataw na pasakit.
