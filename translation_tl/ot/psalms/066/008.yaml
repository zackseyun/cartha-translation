translation:
  language: tl
  text: 'Purihin ninyo ang aming Diyos, kayong mga bayan,

    at iparinig ninyo ang tinig ng kanyang papuri.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at iparinig ninyo ang tinig ng papuri sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרְכוּ
  choice: Purihin ninyo
  rationale: Ang pautos na anyo ng ברך, kapag ang Diyos ang layon, ay likas na naipahahayag sa modernong Tagalog bilang “purihin.” Ang “pagpalain” ay maaaring magbigay ng di-likas o maling pahiwatig sa karaniwang mambabasa na ang mga tao ang nagbibigay ng pagpapala sa Diyos.
- source_word: עַמִּים
  choice: kayong mga bayan
  rationale: Pinananatili nito ang maramihang tuwirang panawagan sa mga pangkat ng mga tao; mas malapit ang “mga bayan” kaysa “mga bansa,” na maaaring unawain bilang mga estadong pampolitika.
- source_word: אֱלֹהֵינוּ
  choice: ang ating Diyos
  rationale: 'Tuwirang ipinapahayag ang unang panauhang maramihang hulapi: “ating Diyos,” habang kinakausap ang mga bayan.'
- source_word: וְהַשְׁמִיעוּ
  choice: at iparinig ninyo
  rationale: 'Ang Hiphil na pautos ng שמע ay sanhi: “gawing marinig” o “iparinig.” Likas at tuwiran sa Tagalog ang “iparinig ninyo.”'
- source_word: קוֹל
  choice: ang tinig
  rationale: Maaaring mangahulugang “tinig” o “tunog” ang קוֹל. Sa pariralang tumutukoy sa papuri, ang “tinig” ay natural na tumutukoy sa naririnig na pagpapahayag.
- source_word: תְּהִלָּתוֹ
  choice: ng papuri sa kanya
  rationale: Bagaman pormal na maihahayag na “kanyang papuri,” maaaring tukuyin ng hulapi ang Diyos bilang pinatutungkulan ng papuri. Ang “papuri sa kanya” ay malinaw at natural sa Tagalog, habang inilalagay sa talababa ang mas pormal na alternatibo.
theological_decisions:
- issue: Ugnayan ng hulapi sa תְּהִלָּתוֹ
  choice: papuri sa kanya
  alternative: kanyang papuri
  rationale: Maaaring ipakahulugan ang hulaping ikatlong panauhan bilang papuring nauukol o nakatuon sa Diyos, o mas pormal bilang “kanyang papuri.” Hindi pinapasan ng salin ang isang natatanging doktrinal na paliwanag; pinananatili sa talababa ang alternatibong ugnayan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kayong mga bayan” bilang malinaw na panawagan at ang “iparinig” upang mapanatili ang sanhi at pautos na lakas ng pandiwang Hebreo.
