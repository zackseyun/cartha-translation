  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: tl
  text: 'Sa kanyang kapangyarihan ay naghahari siya magpakailanman;

    ang kanyang mga mata ay nagmamasid sa mga bansa.

    Huwag magmataas ang mga suwail[a].

    Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Huwag nilang itaas ang kanilang sarili” o “Huwag bumangon ang mga suwail.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtataas, pagbangon, o pagpapakataas ng sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Naghahari siya
  rationale: Ang Qal participle ay may patuloy na pandiwang diwa; natural na ipinahahayag ito sa Filipino bilang nagpapatuloy na paghahari.
- source_word: בִּגְבוּרָתוֹ
  choice: sa pamamagitan ng kanyang lakas
  rationale: Ang גְּבוּרָה ay tumutukoy sa lakas o kapangyarihan, at ang בְּ ay maaaring instrumental; malinaw na ipinahahayag ng parirala na ginagamit niya ang kanyang lakas sa paghahari.
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Sa posisyong adberbyal, ipinahahayag nito ang walang-hanggang tagal ng paghahari.
- source_word: עֵינָיו
  choice: ng kanyang mga mata
  rationale: Pinanatili ang tahasang larawang antropomorpiko ng Hebreo sa halip na paikliin lamang sa 'siya.'
- source_word: בַּגּוֹיִם
  choice: ang mga bansa
  rationale: Tumutukoy ang גּוֹיִם sa mga bansa o mga bayan sa pangkalahatan, hindi kinakailangang sa teknikal na kahulugang 'mga Hentil.'
- source_word: תִּצְפֶּינָה
  choice: minamasdan
  rationale: Ang צפה ay nangangahulugang tumingin, magmasid, o magbantay. Ang 'minamasdan' ay natural at pinananatili ang diwa ng patuloy na pagbabantay.
- source_word: הַסּוֹרְרִים
  choice: ang mga suwail
  rationale: Ang participle mula sa סרר ay naglalarawan sa mga taong matigas na lumalaban o naghihimagsik; maikli, natural, at marangal ang 'mga suwail.'
- source_word: אַל יָרִימוּ לָמוֹ
  choice: Huwag magmataas
  rationale: Ang אַל na may imperfect ay pagbabawal. Maaaring tumukoy ang רום sa pagtataas, pagbangon, o pagmamataas; sa kontekstong ito, natural na ipinahahayag ng 'magmataas' ang malamang na pansariling pagtataas, habang inilalahad sa talababa ang tunay na leksikal na saklaw.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili bilang transliterasyon sapagkat hindi tiyak ang eksaktong tungkuling panliturhiya o pangmusika nito.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagmamasid ng Diyos
  choice: minamasdan ng kanyang mga mata ang mga bansa
  alternative: minamasdan niya ang mga bansa
  rationale: Tahasan sa Hebreo ang 'kanyang mga mata.' Pinananatili nito ang matulaing larawan nang hindi ipinapalagay na may limitasyong nilalang ang Diyos.
- issue: Kahulugan ng pagbabawal sa mga suwail
  choice: Huwag magmataas ang mga suwail
  alternative: Huwag bumangon ang mga suwail / Huwag nilang itaas ang kanilang sarili
  rationale: Malamang na pansariling pagtataas o pagmamataas ang diwa ng יָרִימוּ לָמוֹ, ngunit maaari ring pahiwatig ng pandiwa ang literal na pagtataas o pagbangon. Hindi ipinapasok ang pasibong ideyang sila ay 'huwag itaas' ng iba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang paralelismong patula, ang larawang 'kanyang mga mata,' at ang tradisyonal na 'Selah.' Ginamit ang 'kanyang' ayon sa karaniwang modernong baybay.
