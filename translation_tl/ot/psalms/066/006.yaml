base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: tl
  text: Ginawa niyang tuyong lupa ang dagat; tumawid sila sa ilog[b] nang naglalakad. Doon tayo magalak sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Doon ay nagalak tayo sa kanya.” Maaaring unawain ang anyong Hebreo bilang paghimok o bilang pahayag na nagbabalik-tanaw.
    reason: alternative_reading
  - marker: b
    text: Malamang na ginugunita ng talata kapuwa ang pagtawid sa dagat sa paglabas mula sa Ehipto at ang pagtawid sa Ilog Jordan papasok sa lupain.
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  choice: ginawa niyang
  rationale: Ipinapahayag ng pandiwa ang pagbabago ng kalagayan; natural sa Tagalog ang “ginawa niyang tuyong lupa” habang nananatiling kongkreto ang larawan.
- source_word: יָם
  choice: dagat
  rationale: Karaniwang katumbas ng salitang Hebreo at hindi tinutukoy sa mismong salin kung aling dagat iyon.
- source_word: לְיַבָּשָׁה
  choice: tuyong lupa
  rationale: Tuwirang ipinahahayag ang lupa o lupang tuyo na naging kalagayan ng dagat.
- source_word: בַּנָּהָר
  choice: sa ilog
  rationale: Pinananatili ang payak na kahulugang “sa/loob ng ilog”; kasama ng “tumawid,” malinaw sa Tagalog ang pagdaan sa ilog.
- source_word: יַעַבְרוּ
  choice: tumawid sila
  rationale: Natural at malinaw na katumbas ng pagdaan o pagtawid, at ang anyong Hebreo ay maaaring ilarawan ang nakaraang pangyayari nang buhay na buhay.
- source_word: בְרָגֶל
  choice: nang naglalakad
  rationale: Likas na pariralang Tagalog para sa pagtawid gamit ang mga paa, hindi sakay ng sasakyan o bangka.
- source_word: שָׁם
  choice: doon
  rationale: Pinananatili ang pagiging bukas kung tumutukoy ito sa lugar ng pagliligtas o sa mismong pangyayari.
- source_word: נִשְׂמְחָה
  choice: magalak tayo
  rationale: Ang anyo ay cohortative na unang panauhang maramihan at pinakanatural na naihahayag bilang paanyaya o paghimok; ang posibleng pagbasa bilang pagbabalik-tanaw ay inilagay sa talababa.
- source_word: בּוֹ
  choice: sa kanya
  rationale: Ang panlalaking isahang hulapi ay malamang na tumutukoy sa Diyos; natural sa Filipino ang “magalak sa kanya.”
theological_decisions:
- issue: Anyo at panahon ng נִשְׂמְחָה
  choice: “magalak tayo,” bilang pangkomunidad na paghimok
  alternative: “nagalak tayo,” bilang pagbabalik-tanaw at pakikiisa ng kasalukuyang bayan sa karanasan ng Israel
  rationale: Ang anyong Hebreo ay likas na maaaring basahing cohortative, ngunit pinahihintulutan ng konteksto ang retrospektibong pagkaunawa. Pinananatili sa talababa ang tunay na kalabuan.
- issue: Makasaysayang pahiwatig ng dagat at ilog
  choice: Panatilihin lamang sa teksto ang “dagat” at “ilog”
  alternative: Tahasang tukuyin ang paglabas mula sa Ehipto at ang pagtawid sa Jordan
  rationale: Malakas ang pahiwatig sa dalawang pagliligtas, ngunit hindi pinapangalanan ng talata ang mga anyong-tubig; ang paliwanag ay mas angkop sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magalak” upang mapanatili ang dignidad ng awit, at iniwasang pangalanan sa pangunahing teksto ang Dagat na Pula/Dagat ng Mga Tambo at Jordan dahil pangkontekstong pahiwatig lamang ang mga iyon.
