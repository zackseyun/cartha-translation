  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: tl
  text: 'Purihin ang Diyos,

    na hindi tumanggi sa aking panalangin

    ni nagkait sa akin ng kanyang tapat na pag-ibig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong חֶסֶד, na maaari ring tumukoy sa matibay na pag-ibig o katapatan sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Ang pasibong participle ay ginagamit bilang pormula ng papuri. Ang “Purihin ang Diyos” ay likas, marangal, at doxological sa modernong Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel na tuwirang pinupuri.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ipinakikilala nito ang sugnay na naglalarawan sa Diyos at likas itong isalin bilang “na” sa Tagalog.
- source_word: לֹא הֵסִיר
  choice: hindi tumanggi … ni nagkait
  rationale: Ang Hiphil ng סור ay may diwang alisin o ilayo. Dahil dalawang magkaibang layon ang kasunod, hinati ang iisang pandiwa sa dalawang likas na pandiwang Tagalog upang ipahayag ang hindi pagtanggi sa panalangin at hindi pagkakait ng pag-ibig, nang hindi binabago ang saklaw ng negasyon.
- source_word: תְּפִלָּתִי
  choice: aking panalangin
  rationale: Tuwirang tumutukoy sa panalanging inihaharap ng nagsasalita sa Diyos.
- source_word: וְחַסְדּוֹ
  choice: ni … kanyang tapat na pag-ibig
  rationale: Pagkatapos ng negatibong unang sugnay, ipinapahayag ng “ni” ang natural na koordinasyong negatibo sa Tagalog. Ang חֶסֶד ay pag-ibig na matatag, tapat, at may diwa ng katapatan sa tipan.
- source_word: מֵאִתִּי
  choice: sa akin
  rationale: Kasama ng “nagkait,” natural na ipinahahayag ng “sa akin” ang taong hindi pinagkaitan ng tapat na pag-ibig ng Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa חֶסֶד
  choice: kanyang tapat na pag-ibig
  alternative: kanyang katapatan sa tipan; kanyang matibay na pag-ibig; kanyang awa
  rationale: Pinananatili ng “tapat na pag-ibig” ang parehong pag-ibig at matatag na katapatan ng Diyos, nang hindi nililimitahan ang salita sa damdamin lamang o ginagawang tahasang teknikal ang diwa ng tipan.
- issue: Ugnayan ng iisang pandiwa sa dalawang layon
  choice: hindi tumanggi sa aking panalangin ni nagkait sa akin
  alternative: hindi inalis sa akin ang aking panalangin at ang kanyang tapat na pag-ibig
  rationale: Sa Hebreo, iisang pandiwa ang namamahala sa “aking panalangin” at “kanyang חֶסֶד,” na lumilikha ng siksik na pahayag. Gumagamit ang salin ng dalawang pandiwang idiomatiko sa Tagalog ngunit pinananatili ang iisang negasyon at kapwa bagay na hindi inilayo ng Diyos.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang estilong patula sa tatlong linya. Iniwasan ang literal ngunit di-likas na “inalis ang aking panalangin,” habang pinanatili ang saklaw ng negatibong pahayag at ang mayamang kahulugan ng חֶסֶד.
