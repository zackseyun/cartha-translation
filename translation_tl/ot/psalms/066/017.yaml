lexical_decisions:
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinananatili ang panghalip na panlalaking isahan ng Hebreo; malinaw sa konteksto na tumutukoy ito sa Diyos nang hindi ipinapalit ang tahasang pangalang wala sa talata.
- source_word: פִּי
  choice: aking bibig
  rationale: Tuwirang pinananatili ang konkretong larawan ng Hebreong פֶּה, ‘bibig,’ sa halip na gawing ‘mga labi’ o ‘pananalita.’
- source_word: קָרָאתִי
  choice: dumaing ako
  rationale: Sa konteksto ng panalangin, ipinahihiwatig ng קרא ang taimtim na pagtawag o paghingi ng tulong; natural na naihahatid ito ng ‘dumaing’ sa Filipino.
- source_word: וְרוֹמַם
  choice: at pagdakila
  rationale: Itinuturing ang anyo bilang pangngalang kaugnay ng רום, na may diwang ‘pagdakila’ o pasalitang papuri. Pinananatili ng ‘pagdakila’ ang ugnayang leksikal sa pagiging mataas o dinakila.
- source_word: תַּחַת
  choice: nasa ilalim
  rationale: Pinananatili ang literal at makatang larawang ‘sa ilalim,’ na nagpapahiwatig ng papuring nakahandang bigkasin.
- source_word: לְשׁוֹנִי
  choice: ng aking dila
  rationale: Pinananatili ang tahasang larawang pandama ng Hebreo sa halip na gawing abstraktong ‘pananalita.’
