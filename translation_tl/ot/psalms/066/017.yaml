translation_notes:
  register: Makabago at marangal na Filipino na nagpapanatili sa paralelismo at mga konkretong larawan ng Hebreong tula. Ang ‘sa pamamagitan ng aking bibig’ ay bahagyang pormal ngunit malinaw at tapat sa tahasang pagkabanggit sa bibig; ang ‘nasa ilalim ng aking dila’ ay sadyang pinanatiling makata at hindi ipinaliwanag sa mismong teksto.
