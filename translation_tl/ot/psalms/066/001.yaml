base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: tl
  text: Para sa tagapanguna ng mga mang-aawit[a]. Isang awit, isang salmo. Sumigaw kayo sa Diyos, buong daigdig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Para sa tagapangasiwa ng musika.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Buong daigdig, magbunyi kayo nang malakas sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Ipinahihiwatig ng terminong Hebreo ang taong nangangasiwa sa pagtatanghal ng musika. Malinaw at likas sa modernong Filipino ang saling ito, habang kinikilala sa talababa ang mas malawak na posibleng tungkuling musikal.
- source_word: שִׁיר
  choice: Isang awit
  rationale: Tuwirang salin ng katawagang pang-uri ng komposisyon.
- source_word: מִזְמוֹר
  choice: isang salmo
  rationale: Pinananatili ang teknikal na katawagang 'salmo' at ang pagkakapares nito sa 'awit' sa Hebreo sa halip na pagsamahin ang dalawa.
- source_word: הָרִיעוּ
  choice: sumigaw kayo
  rationale: Inihahatid nito ang maramihang pautos na magtaas ng malakas na sigaw. Hindi idinagdag sa pangunahing teksto ang 'may kagalakan' sapagkat bagaman madalas masaya o matagumpay ang sigaw sa ganitong konteksto, hindi tahasang binanggit ng pandiwa ang kagalakan.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Likas na Filipino para sa Diyos bilang pinatutungkulan ng sigaw o pagpupugay.
- source_word: כָּל הָאָרֶץ
  choice: Buong lupa
  rationale: Ang 'lupa' ay maaaring tumukoy sa buong daigdig o sa lupain; sa konteksto ng pangkalahatang panawagan ng salmo, likas itong mabasa bilang buong mundo nang hindi labis na nililinaw ang saklaw.
theological_decisions:
- issue: Saklaw ng כָּל הָאָרֶץ
  choice: pangkalahatang panawagan sa buong lupa
  alternative: panawagan sa buong lupain o makalupang nasasakupan
  rationale: Sinusuportahan ng konteksto ng papuri ang pandaigdig na saklaw, ngunit pinananatili ng salitang 'lupa' ang likas na lawak ng kahulugan ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong pamagat na 'Isang awit, isang salmo' at ginawang unang pantawag ang 'Buong lupa' upang maging likas ang maramihang pautos sa Filipino.
