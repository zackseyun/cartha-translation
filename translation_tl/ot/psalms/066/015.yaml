base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: tl
  text: 'Maghahandog ako sa iyo ng mga pinatabang hayop bilang mga handog na sinusunog,

    kasama ng usok ng mga lalaking tupa.[a]

    Maghahandog ako ng mga baka at mga lalaking kambing.

    Selah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ng halimuyak ng mga lalaking tupa.” Ang salitang Hebreo ay maaaring tumukoy sa usok o amoy na nalilikha sa pagsunog ng handog.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang kahulugan ng “Selah.” Malamang na isa itong panandang pangmusika o panliturhiya.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת מֵחִים
  choice: mga pinatabang hayop bilang mga handog na sinusunog
  rationale: Ang עֹלוֹת ay teknikal na katawagan sa mga handog na lubusang sinusunog sa altar, at ang מֵחִים ay tumutukoy sa matataba o pinatabang hayop na angkop sa mamahaling paghahandog. Malinaw at natural sa modernong Tagalog ang pinagsamang parirala.
- source_word: אַעֲלֶה לָךְ
  choice: Maghahandog ako sa iyo
  rationale: Sa konteksto ng paghahain, ang Hiphil ng עלה ay nangangahulugang maghandog o magpaakyat bilang handog. Pinananatili ng salin ang tuwirang pagtukoy sa Diyos.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: kasama ng usok ng mga lalaking tupa
  rationale: Maaaring tumukoy ang קְטֹרֶת sa usok o mabangong singaw mula sa sinusunog na handog. Ang 'usok' ay malinaw na umaangkop sa mga tupang sinusunog at hindi nagpapahiwatig na insenso ang mga ito. Isinaad din ang kasariang taglay ng אֵילִים.
- source_word: אֶעֱשֶׂה
  choice: Maghahandog ako
  rationale: Bagaman literal na 'gagawin ko,' idiomatiko itong tumutukoy sa pagsasagawa ng paghahandog. Ang 'maghahandog' ay mas malinaw kaysa 'maghahanda,' na maaaring mapagkamalang karaniwang paghahanda ng pagkain o hayop.
- source_word: בָקָר
  choice: mga baka
  rationale: Ang pangngalang kolektibo ay tumutukoy sa mga hayop na bovine sa pangkalahatan. Hindi ito nilimitahan sa mga toro dahil hindi tahasang gayon ang anyong Hebreo.
- source_word: עַתּוּדִים
  choice: mga lalaking kambing
  rationale: Tiyak na tumutukoy ang salita sa mga kambing na lalaki; likas at malinaw itong maipapahayag sa pangunahing teksto.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan at gamit ng salita, kaya pinanatili itong transliterado sa halip na bigyan ng mapagpalagay na salin.
