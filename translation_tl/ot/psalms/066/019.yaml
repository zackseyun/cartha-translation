  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: tl
  text: Tunay ngang narinig ng Diyos; pinakinggan niya ang tinig ng aking panalangin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: Tunay nga
  rationale: Nagpapahayag ito ng mariing pagpapatunay o katiyakan; likas sa makabagong Filipino ang “Tunay nga” at napapanatili ang diin ng Hebreo.
- source_word: שָׁמַע
  choice: dininig
  rationale: Ang ganap na pandiwa ay naglalarawan ng naganap nang pakikinig. Sa konteksto ng panalangin, ang “dininig” ay natural at maaaring magpahiwatig na ang Diyos ay tumugon nang may pansin, nang hindi tahasang sinasabing ipinagkaloob ang kahilingan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang kaugnay na pandiwa at tumutukoy ito rito sa Diyos.
- source_word: הִקְשִׁיב
  choice: pinakinggan niya
  rationale: Ang Hiphil ng קשׁב ay tumutukoy sa maingat o sadyang pakikinig. Ang “pinakinggan niya” ay malinaw, natural, at nagpapanatili sa ideya ng pagbibigay-pansin.
- source_word: בְּקוֹל
  choice: ang tinig ng
  rationale: Ang קוֹל ay literal na “tinig” o “tunog.” Ang “tinig ng aking panalangin” ay nauunawaan sa Filipino at pinananatili ang kongkretong pananalita ng Hebreo.
- source_word: תְּפִלָּתִי
  choice: aking panalangin
  rationale: Tuwirang isinasalin ang pangngalan at panlaping paari bilang “aking panalangin.”
theological_decisions:
- issue: Kung ang שָׁמַע ay nangangahulugang narinig lamang o dininig nang may pagtugon
  choice: dininig
  alternative: narinig
  rationale: Sa konteksto ng panalangin at kasunod na kahanay na pahayag tungkol sa maingat na pakikinig, ang “dininig” ang mas likas na salin. Gayunman, hindi nito tahasang nilulutas kung paano tumugon ang Diyos o kung ipinagkaloob ang partikular na kahilingan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang paralelismo ng dalawang pandiwa ng pakikinig at ang konkretong pariralang “tinig ng aking panalangin.”
