  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: tl
  text: Halikayo at makinig, kayong lahat na may takot sa Diyos; isasalaysay ko ang ginawa niya para sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa aking buhay” o “para sa aking kaluluwa.” Ang salitang Hebreo na נֶפֶשׁ (nefesh) ay maaaring mangahulugang sarili, buhay, o kaluluwa ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Halikayo
  rationale: Bagaman ang pandiwa ay literal na may diwang “humayo” o “lumakad,” ginagamit ito rito bilang paanyaya. Ang “Halikayo” ang likas na panawagan sa modernong Tagalog.
- source_word: שִׁמְעוּ
  choice: makinig
  rationale: Ipinapahayag nito ang pautos na masusing pakikinig, hindi lamang ang di-sinasadyang pagkarinig.
- source_word: וַאֲסַפְּרָה
  choice: isasalaysay ko
  rationale: Ang anyo mula sa ספר ay nagsasaad ng hangarin ng nagsasalita na ikuwento o isa-isang ipahayag ang ginawa ng Diyos. Dignified at natural ang “isasalaysay ko.”
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: kayong lahat na may takot sa Diyos
  rationale: Pinananatili ng “takot” ang saklaw ng Hebreo—pagpipitagan at mapitagang pangamba—nang hindi ito pinapahina tungo sa simpleng paggalang o nililimitahan sa sindak.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Pangkalahatang titulong אֱלֹהִים ang ginamit, hindi ang banal na pangalang YHWH.
- source_word: אֲשֶׁר עָשָׂה
  choice: ang ginawa niya
  rationale: Likas nitong isinasalin ang sugnay na tumutukoy sa natapos na pagkilos ng Diyos na isinasalaysay bilang patotoo.
- source_word: לְנַפְשִׁי
  choice: para sa akin
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa sarili, buhay, o kaluluwa. Sa Tagalog, malinaw at natural na kumakatawan ang “para sa akin” sa Hebreong gamit para sa buong pagkatao, habang inilalahad sa talababa ang mas literal na mga alternatibo.
theological_decisions:
- issue: Kahulugan ng “may takot sa Diyos”
  choice: mapitagang takot sa Diyos
  alternative: sindak lamang sa Diyos; karaniwang paggalang lamang sa isang diyos
  rationale: Pinananatili ng salin ang tensiyon ng biblikal na “takot,” na may kasamang pagpipitagan at pagkilala sa Diyos, nang hindi ito tahimik na ginagawang sindak lamang o payak na paggalang.
- issue: Pagpapakahulugan sa נֶפֶשׁ
  choice: ang mismong sarili o buong pagkatao (“para sa akin”)
  alternative: buhay; kaluluwa
  rationale: Malawak ang saklaw ng salitang Hebreo. Iniiwasan ng pangunahing salin ang pagpasok ng mas makitid na paghahating katawan-kaluluwa, ngunit pinananatili sa talababa ang tunay na posibilidad ng “buhay” at “kaluluwa.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Halikayo” bilang likas na maramihang paanyaya at ang “may takot sa Diyos” upang mapanatili ang biblikal na diwa nang hindi tunog-luma o sektaryan.
