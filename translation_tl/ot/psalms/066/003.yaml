  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: tl
  text: 'Sabihin ninyo sa Diyos,


    “Kay kasindak-sindak ng iyong mga gawa!


    Dahil sa tindi ng iyong lakas,


    ang mga kaaway mo ay nagpapanggap na nagpapasakop sa iyo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napipilitang magpasakop sa iyo” o “nag-aatubiling sumusuko sa iyo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pakunwari, mapanlinlang, o sapilitang pagpapasakop.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ לֵאלֹהִים
  choice: Sabihin ninyo sa Diyos
  rationale: Ang maramihang pautos na אִמְרוּ ay likas na ipinahahayag sa modernong Tagalog bilang “Sabihin ninyo,” at ang לְ ay tumutukoy sa Diyos bilang kinakausap.
- source_word: מַה נּוֹרָא
  choice: Kay kakila-kilabot
  rationale: Ang מַה ay ginagamit bilang padamdam, at ang נוֹרָא ay nagpapahiwatig ng pagkamangha na may kasamang takot. Pinananatili ng “kakila-kilabot” ang matinding puwersa ng salita, hindi lamang ang pagiging kahanga-hanga.
- source_word: מַעֲשֶׂיךָ
  choice: ng mga gawa mo
  rationale: Karaniwang tumutukoy ang מַעֲשֶׂה sa mga gawa o ginawa. Ang “mga gawa mo” ay malinaw, natural, at angkop sa panulaang papuri.
- source_word: בְּרֹב עֻזֶּךָ
  choice: Dahil sa tindi ng iyong lakas
  rationale: Ipinahahayag ng בְּ ang batayan o dahilan; ang רֹב ay kasaganaan o kadakilaan, at ang עֹז ay lakas o kapangyarihan. Natural na naihahatid ng parirala ang nangingibabaw na lakas ng Diyos.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: napipilitang magpasakop sa iyo
  rationale: Sa Piel at may לְ, maaaring tumukoy ang כחש sa sapilitan, at maaari ring pakunwari o mapanlinlang, na pagpapasakop. Ang pangunahing salin ay malinaw na nagpapakita ng pamimilit, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: אֹיְבֶיךָ
  choice: ang mga kaaway mo
  rationale: Direkta at natural na salin ng pangmaramihang אֹיֵב na may hulaping tumutukoy sa ikalawang panauhang isahan.
theological_decisions:
- issue: Ang uri ng pagpapasakop ng mga kaaway sa Diyos
  choice: Sapilitang pagpapasakop dahil sa matinding lakas ng Diyos
  alternative: Pakunwari o mapanlinlang na pagpapasakop
  rationale: Maaaring saklawin ng pandiwang כחש ang sapilitan o di-taos-pusong pagsuko. Hindi ito inilalarawan bilang tapat na pagsamba; pinananatili ng pangunahing teksto at talababa ang tensiyon at kalabuan ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang padamdam at paralelismong patula, gayundin ang nakapanghihilakbot na puwersa ng נוֹרָא at ang kalabuan ng tugon ng mga kaaway.
