translation:
  language: tl
  text: Awitin ninyo ang kaluwalhatian ng kanyang pangalan; gawin ninyong maringal ang kanyang papuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Itakda ninyo ang kaluwalhatian ng kanyang papuri.” Idyomang Hebreo ito na maaari ring isaling “Gawing maluwalhati ang kanyang papuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Awitin ninyo
  rationale: Pautos na maramihan mula sa זמר, na tumatawag sa bayan upang umawit bilang pagpupuri. Likas at tuwiran sa modernong Filipino ang “Awitin ninyo.”
- source_word: כְבוֹד שְׁמוֹ
  choice: ang kaluwalhatian ng kanyang pangalan
  rationale: Pinananatili ang ugnayang konstruktong Hebreo at ang diin sa kaluwalhatiang nauukol sa kanyang pangalan, sa halip na gawing simpleng pang-uri lamang na “maluwalhating pangalan.”
- source_word: שִׂימוּ
  choice: gawin ninyong
  rationale: Literal itong “ilagay” o “itakda,” ngunit sa idyomang ito ay natural na ipinahahayag ng “gawin ninyong” ang panawagang ihayag ang papuri bilang maringal.
- source_word: כָבוֹד
  choice: maringal
  rationale: Bagaman pangngalang “kaluwalhatian” ang anyong Hebreo, kailangan ng pang-uring panaguri sa natural na Filipino pagkatapos ng “gawin ninyong.” Ang “maringal” ay naghahatid ng dangal at kadakilaan nang hindi nagiging asiwa ang pangungusap.
- source_word: תְּהִלָּתוֹ
  choice: ang papuri sa kanya
  rationale: Ang pangngalan ay “papuri” na may hulaping panlalaking isahan. Sa konteksto, ang “papuri sa kanya” ay mas malinaw at natural kaysa sa posibleng ngunit malabong “kanyang papuri,” habang kinikilalang ang papuri ay iniuukol sa Diyos.
