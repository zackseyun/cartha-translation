  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: tl
  text: Pinasakay mo ang isang tao sa ibabaw ng aming mga ulo; dumaan kami sa apoy at sa tubig, ngunit inilabas mo kami tungo sa kasaganaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: isang tao
  rationale: Pinananatili ang anyong isahan at ang di-tiyak na pagtukoy ng Hebreo; ang salita ay tumutukoy sa mortal na tao, ngunit hindi kailangang dagdagan ng paliwanag sa pangunahing teksto.
- source_word: לְרֹאשֵׁנוּ
  choice: sa ibabaw ng aming mga ulo
  rationale: Tuwirang inilalarawan ang pagdaan o paghahari sa ibabaw nila nang hindi nilalabnaw ang matinding larawang Hebreo.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: dumaan kami sa apoy at sa tubig
  rationale: Ang literal na 'pumasok kami sa' ay likas na ipinahahayag sa Filipino bilang 'dumaan kami sa,' habang pinananatili ang magkatambal na larawan ng matinding pagsubok.
- source_word: לָרְוָיָה
  choice: tungo sa kasaganaan
  rationale: Ang pangngalan ay maaaring magpahiwatig ng saganang lugar o kalagayan ng lubos na kasapatan; 'kasaganaan' ang maikli at likas na salin na hindi labis na nagpapakitid sa larawan.
theological_decisions:
- issue: Ang Diyos bilang nagpapahintulot o nagtakda ng pagpapahirap
  choice: Pinasakay mo
  alternative: Hinayaan mong sumakay
  rationale: Ang causative na anyo ng pandiwa ay tuwirang nagsasabing ang Diyos ang nagpangyari nito; hindi ito pinalambot tungo sa pahintulot lamang, kaya nananatili ang teolohikal na tensiyon ng talata.
- issue: Pagkakakilanlan ng אֱנוֹשׁ
  choice: isang tao
  alternative: mga tao
  rationale: Pinananatili ang gramatikal na isahan at hindi ipinapalagay kung ito ay isang tiyak na manlulupig, kolektibong katauhan, o pangkalahatang sangkatauhan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang matitinding larawan ng pagpapasakay sa ibabaw ng mga ulo, apoy, at tubig, pati ang paglipat mula sa pagdurusa tungo sa kasaganaan.
