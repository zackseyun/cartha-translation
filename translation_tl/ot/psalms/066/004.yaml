lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Ang buong daigdig
  rationale: Ipinahahayag ng כָּל kasama ng הָאָרֶץ ang pangkalahatang saklaw. Mas angkop ang “daigdig” kaysa “lupain,” na maaaring magmukhang lokal lamang.
- source_word: יִשְׁתַּחֲווּ
  choice: ay yuyukod
  rationale: Pinananatili nito ang kongkretong larawan ng pagyukod o pagpapatirapa sa harap ng Diyos, habang ipinahihiwatig pa rin ang pagsamba nang hindi ginagawang tahasang abstrakto ang pandiwa.
- source_word: לְךָ
  choice: sa iyo
  rationale: Likas at tuwirang ipinapakita nito ang patutunguhan ng pagyukod at pag-awit.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: aawit ng papuri
  rationale: Sa kontekstong ito, ang זמר ay tumutukoy sa musikal na pagpupuri. Pinanatili rin ang pag-uulit ng parirala sa Hebreo.
- source_word: שִׁמְךָ
  choice: iyong pangalan
  rationale: Pinananatili ang mahalagang biblikal na pahayag na “pangalan,” na maaaring sumaklaw sa ipinahayag na pagkakakilanlan at reputasyon ng Diyos.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng katawagan, kaya mas tapat na panatilihin ito kaysa palitan ng isang mapaghakang paliwanag.
theological_decisions:
- issue: Kung isasalin ang יִשְׁתַּחֲווּ bilang tahasang “sasamba” o bilang pisikal na kilos ng pagyukod
  choice: yuyukod
  alternative: sasamba
  rationale: Saklaw ng pandiwa ang pagsamba sa pamamagitan ng pagpapatirapa, ngunit pinananatili ng “yuyukod” ang katawang larawan at ang likas na lawak ng kahulugan ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong daigdig” para sa pandaigdigang saklaw at inulit ang “aawit ng papuri” upang mapanatili ang paralelismo ng Hebreo.
