  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: tl
  text: Ikaw ang nagtakda[a] ng lahat ng hangganan ng daigdig; tag-araw at taglamig—ikaw ang humubog sa mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay” o “itinatag.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga ito” ay tumutukoy sa tag-araw at taglamig. Maaari ring isalin ang pandiwa na “bumuo.”
    reason: referent_clarification_and_lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: nagtakda
  rationale: Ang Hiphil ng נצב ay tumutukoy sa pagpapalagay o pagpapatatag ng isang bagay sa kinalalagyan nito. Likas sa modernong Tagalog ang “nagtakda” para sa pagtatakda ng mga hangganan, habang naipahihiwatig din nito ang kaayusang itinatag ng Diyos.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: lahat ng hangganan ng daigdig
  rationale: Pinananatili ng “lahat” ang כָּל at ng “hangganan” ang maramihang saklaw ng גְּבוּלוֹת sa paraang natural sa Tagalog. Dahil kaayusan ng sangnilikha ang konteksto, “daigdig” ang pinili sa halip na “lupain.”
- source_word: קַיִץ וָחֹרֶף
  choice: tag-araw at taglamig
  rationale: Ito ang karaniwan at malinaw na katumbas ng magkatambal na mga panahon, at pinananatili ang saklaw ng taunang kaayusan na ipinahihiwatig ng Hebreo.
- source_word: יְצַרְתָּם
  choice: humubog sa mga ito
  rationale: Karaniwang ipinahihiwatig ng יצר ang paghubog o pag-anyo. Hindi nito labis na pinapalawak ang kahulugan tungo sa pangkalahatang “lumikha,” at ang hulaping maramihan ay tinutukoy bilang tag-araw at taglamig.
- source_word: אַתָּה ... אַתָּה
  choice: Ikaw ... ikaw
  rationale: Pinananatili ang inuulit at mariing panghalip sa Hebreo upang idiin ang tuwirang pagkilos ng Diyos sa dalawang sugnay.
theological_decisions:
- issue: Saklaw ng “mga hangganan ng daigdig” sa pananalita tungkol sa paglikha
  choice: Pahayag tungkol sa pag-aayos ng Diyos sa daigdig
  alternative: Pagtukoy sa mga hangganang panteritoryo ng mga lupain o bansa
  rationale: Ang kasunod na pagtukoy sa tag-araw at taglamig ay naglalagay sa talata sa konteksto ng kaayusan ng sangnilikha, hindi pangunahin sa heograpiyang pampolitika.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “daigdig” para sa kosmikong konteksto at pinanatili ang pag-uulit ng “Ikaw” upang madama ang diin ng Hebreo.
