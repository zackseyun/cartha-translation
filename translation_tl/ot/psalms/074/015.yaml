  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: tl
  text: Ikaw ang nagbukas ng mga bukal at batis[a]; ikaw ang nagpatuyo ng mga ilog na laging umaagos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa sapa o sa isang lambak na dinadaluyan ng tubig sa ilang panahon.
    reason: Pinananatili nito ang mas malawak na kahulugan ng נַחַל, na hindi ganap na naipapakita ng ‘batis.’
  - marker: b
    text: 'O: malalakas na ilog.'
    reason: Ang אֵיתָן ay maaaring mangahulugang palagian o matatag, at maaari ring unawain bilang malakas.
lexical_decisions:
- source_word: בָקַעְתָּ (baqaʿta)
  choice: nagbukas
  rationale: Ang pandiwa ay literal na ‘bumiyak’ o ‘magbukas sa pamamagitan ng paghiwa.’ Sa kaugnayan nito sa bukal at batis, mas natural sa modernong Tagalog ang ‘nagbukas,’ habang pinananatili ang larawan ng pagpapalabas ng tubig.
- source_word: מַעְיָן (maʿyan)
  choice: mga bukal
  rationale: Tuwirang katumbas ng bukal o pinagmumulan ng tubig; ginawang maramihan ayon sa kolektibong diwa ng taludtod.
- source_word: נַחַל (naḥal)
  choice: batis
  rationale: Maaaring tumukoy sa batis, sapa, o daluyang pana-panahong may tubig. ‘Batis’ ang pinakanatural at maikli sa pangunahing teksto, at inilalahad sa talababa ang lawak ng kahulugan.
- source_word: נַהֲרוֹת אֵיתָן (naharot ʾetan)
  choice: mga ilog na laging umaagos
  rationale: Sa kontekstong pantubig, ang אֵיתָן ay malamang na tumutukoy sa tuluy-tuloy o permanenteng pag-agos. Pinananatili sa talababa ang maaari ring kahulugang ‘malalakas.’
theological_decisions:
- issue: Ang larawan ng kapangyarihan ng Diyos sa mga tubig
  choice: Pinanatili ang magkatapat na kilos ng pagbubukas ng mga daluyan ng tubig at pagpapatuyo ng mga ilog.
  alternative: Ipaliwanag ito bilang tiyak na pagtukoy sa isang partikular na pangyayaring pangkasaysayan, gaya ng Exodo.
  rationale: Hindi tuwirang tinutukoy ng taludtod ang isang pangyayari; ang salin ay hindi dapat magpasok ng interpretasyong hindi hayag sa tekstong Hebreo.
translation_notes:
  register: Makabagong Filipino Tagalog na payak ngunit marangal. Ginamit ang magkatulad na ayos ng dalawang sugnay upang maipakita ang paralelismo ng tulang Hebreo.
