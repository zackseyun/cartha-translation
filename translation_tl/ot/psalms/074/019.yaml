  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: tl
  text: Huwag mong ipagkaloob sa hayop na mandaragit ang buhay ng iyong kalapati[a]; huwag mong kalimutan magpakailanman ang buhay ng iyong mga api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, tôr, isang uri ng kalapati (turtledove).
    reason: Nililinaw ang mas tiyak na ibon na tinutukoy ng Hebreong salita nang hindi isinasara ang natural na pangunahing salin na “kalapati.”
lexical_decisions:
- source_word: חַיַּת
  choice: mabangis na hayop / buhay
  rationale: 'Magkaiba ang kahulugan ayon sa dalawang konteksto: sa unang parirala, tumutukoy ito sa isang mabangis na hayop; sa ikalawa, sa buhay ng mga api.'
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa pariralang נֶפֶשׁ תּוֹרֶךָ, ang diwa ay ang buhay ng ibong inilalarawang nanganganib, hindi lamang ang abstraktong 'kaluluwa.'
- source_word: תּוֹרֶךָ
  choice: iyong kalapati
  rationale: Ang תּוֹר ay mas tiyak na batubato o turtledove, ngunit ang 'kalapati' ay mas natural at madaling maunawaan sa modernong Filipino; nilinaw ang espesipikong ibon sa talababa.
- source_word: עֲנִיֶּיךָ
  choice: iyong mga api
  rationale: Ipinahahayag nito ang mga taong pinahihirapan o sinisiil, at pinananatili ang maramihang anyo.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Pinananatili ang tahasang temporal na diin ng Hebreo sa halip na paikliin ito bilang 'kailanman.'
theological_decisions:
- issue: Ang 'kalapati' bilang larawan ng bayan ng Diyos
  choice: Pinanatili ang larawan nang hindi tahasang tinukoy kung sino ang sinasagisag nito.
  alternative: Isalin ito nang tuwiran bilang 'iyong bayan.'
  rationale: Metaporikal ang Hebreo at hindi nito ipinapaliwanag sa mismong talata ang larawan; ang pagpapanatili rito ay umiiwas sa tahimik na pagresolba sa talinghaga.
- issue: Singular na 'buhay' kasama ng maramihang 'mga api'
  choice: Pinanatili ang 'buhay ng iyong mga api.'
  alternative: Gamitin ang 'mga buhay ng iyong mga api.'
  rationale: Singular ang חַיַּת sa tekstong Masoretiko at maaaring kolektibo ang gamit; pinananatili ng salin ang anyo at posibleng kolektibong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo at ang matinding pakiusap ng talata, pati ang metapora ng kalapati at ang kolektibong singular na 'buhay.'
