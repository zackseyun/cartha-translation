  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: tl
  text: Bakit mo pinipigil ang iyong kamay, ang iyong kanang kamay? Ilabas mo ito mula sa tiklop ng iyong kasuotan at lipulin sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, walang tahasang layon ang “lipulin.” Ang “sila” ay idinagdag mula sa konteksto at tumutukoy sa mga kaaway sa salmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Karaniwang pananong sa dahilan; pinananatili ang himig ng panaghoy.
- source_word: תָשִׁיב
  choice: mo binabawi
  rationale: Ang Hiphil ng שוב na may ‘kamay’ bilang layon ay tumutukoy rito sa pag-urong o pagpigil ng kamay sa pagkilos.
- source_word: יָדְךָ
  choice: ang iyong kamay
  rationale: Tuwirang salin na nagpapanatili sa kongkretong larawan at paralelismo.
- source_word: וִימִינֶךָ
  choice: ang iyong kanang kamay
  rationale: Pinananatili ang literal na larawan ng lakas at tiyak na pagkilos.
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: mula sa iyong dibdib
  rationale: Ang parirala ay tumutukoy sa loob o tiklop sa may dibdib kung saan nakatago at hindi kumikilos ang kamay; natural sa Filipino ang ‘mula sa iyong dibdib.’
- source_word: כַלֵּה
  choice: lipulin sila
  rationale: Ang Piel imperative ng כלה ay maaaring mangahulugang ubusin, wakasan, o lipulin. Ang ‘lipulin’ ay angkop sa panawagang kumilos laban sa mga kaaway; ang ‘sila’ ay kontekstuwal na dinagdag sapagkat walang tahasang layon sa Hebreo.
theological_decisions:
- issue: Hindi tahasang layon ng panghuling pautos
  choice: ‘lipulin sila,’ na ang ‘sila’ ay tumutukoy sa mga kaaway sa konteksto
  alternative: Iwanang walang layon ang ‘lipulin,’ o unawain itong tumutukoy nang mas pangkalahatan sa banta o paglapastangan
  rationale: Walang tahasang layon ang pandiwang Hebreo, ngunit ang konteksto ng salmo ay panawagan sa Diyos na kumilos laban sa mga kaaway. Nililinaw ito sa pangunahing teksto habang itinatala sa talababa ang tunay na pagkukulang ng layon sa orihinal.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang makatang pag-uulit ng ‘kamay’ at ‘kanang kamay.’ Ginamit ang ‘dibdib’ sa halip na mas lipas na ‘sinapupunan’ o teknikal na ‘tiklop ng damit,’ at nilinaw ng pandiwang ‘ilabas’ ang larawan ng kamay na nakatago at hindi kumikilos.
