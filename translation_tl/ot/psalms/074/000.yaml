  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: tl
  text: 'Isang Maskil[a] ni Asaf.


    Bakit mo kami itinakwil magpakailanman, O Diyos? Bakit umuusok ang galit mo laban sa mga tupa ng iyong pastulan?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Maskil” ay isang teknikal na pamagat ng awit; maaaring tumukoy ito sa isang awit na mapagnilay o nagtuturo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Pinanatili ang teknikal at hindi tiyak na katawagan sa pamagat ng awit; ipinaliwanag sa talababa ang mga posibleng kahulugan nito.
- source_word: זָנַחְתָּ
  choice: mo kami itinakwil
  rationale: Ang pandiwa ay nagpapahiwatig ng pagtanggi o pagtataboy; natural at marubdob sa Tagalog ang “itinakwil.” Ang “kami” ay ipinahihiwatig ng konteksto at malinaw sa kasunod na larawan ng bayan bilang kawan.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: nag-aalab ang galit mo
  rationale: Literal na “umuusok ang iyong ilong/galit”; ang “nag-aalab” ay natural na idyomang Tagalog na nagpapanatili sa larawan ng matinding galit, bagaman hindi sa eksaktong usok.
- source_word: צֹאן מַרְעִיתֶךָ
  choice: mga tupa ng iyong pastulan
  rationale: Pinanatili ang pastoral na metapora ng Hebreo at ang ugnayan ng Diyos bilang pastol ng kanyang bayan.
theological_decisions:
- issue: Ang saklaw ng pagtakwil ng Diyos
  choice: “magpakailanman?” bilang panaghoy at tanong
  alternative: Isalin bilang tiyak na pahayag na tuluyan nang itinakwil ng Diyos ang bayan
  rationale: Ang לָמָה at anyong patanong ay nagpapahayag ng naranasang pagtalikod sa panaghoy, hindi kinakailangang isang dogmatikong pahayag na permanente na ang pagtakwil.
- issue: Ang larawan ng galit ng Diyos
  choice: Pinanatili ang matinding metaporang “nag-aalab” laban sa kawan
  alternative: Palambutin bilang “bakit ka galit”
  rationale: Mahalagang mapanatili ang bigat at pisikal na larawan ng Hebreong יֶעְשַׁן אַפְּךָ nang hindi ipinapaliwanag o pinapahina ang teolohikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “Maskil” at “Asaf” bilang mga anyong karaniwang nauunawaan sa tradisyong biblikal, at ginamit ang “O Diyos” upang maging natural at taimtim ang tuwirang panawagan.
