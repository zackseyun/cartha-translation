translation:
  language: tl
  text: At ngayo'y dinudurog nila ang lahat ng ukit nito gamit ang palakol at mga maso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gamit ang palakol at mga martilyo.” Tiyak na mga kasangkapang pamutol at pamukpok ang tinutukoy sa Hebreo, ngunit hindi tiyak ang eksaktong modernong katumbas ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: At ngayo'y
  rationale: Pinananatili ang pang-ugnay at ang paglipat sa kasalukuyang tagpo ng pagwasak.
- source_word: פִּתּוּחֶיהָ
  choice: mga ukit nito
  rationale: Tumutukoy sa inukit na palamuti bilang kabuuang gawa; natural at malinaw ang “mga ukit” sa modernong Filipino.
- source_word: יַחַד
  choice: lahat ng
  rationale: Sa kontekstong ito, ipinahahayag ang kolektibo o lubusang saklaw ng pagwasak nang hindi lumilikha ng malabong pariralang “kasama ng” bago banggitin ang mga kagamitan.
- source_word: בְּכַשִּׁיל
  choice: gamit ang palakol
  rationale: Ang salita ay tumutukoy sa kasangkapang pamutol na kahawig ng palakol; pinananatili ang isahang anyo.
- source_word: וְכֵילַפּוֹת
  choice: at mga maso
  rationale: Tumutukoy sa maramihang kasangkapang pamukpok; ang “maso” ay dignificado, madaling maunawaan, at angkop sa marahas na pagdurog.
- source_word: יַהֲלֹמוּן
  choice: dinudurog nila
  rationale: Ipinahahayag ang paulit-ulit at mapanirang paghampas sa mga inukit na bahagi, hindi lamang ang simpleng pagtama.
