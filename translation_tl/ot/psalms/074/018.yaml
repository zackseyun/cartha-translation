base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: tl
  text: 'Alalahanin mo ito: nilait ka ng kaaway, Yahweh; at hinamak ng isang bayang hangal ang iyong pangalan.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inalipusta ka” o “tinuya ka.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hangal” dito ay may diwang moral at espirituwal, hindi lamang kakulangan sa talino; ihambing ang Awit 14:1.
    reason: cross_reference
  - marker: c
    text: Maaari ring “nilapastangan ang iyong pangalan” o “trinato nang may paghamak ang iyong pangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: Alalahanin mo ito
  rationale: Ang Qal imperative na זְכָר ay tuwirang pakiusap sa Diyos. Likas sa makabagong Tagalog ang “Alalahanin mo ito” at pinananatili nito ang diin ng panawagan.
- source_word: אוֹיֵב
  choice: ang kaaway
  rationale: Bagaman isahan at walang artikulo sa Hebreo, gumaganap itong pangkalahatan o kolektibong katawagan sa kalaban; natural dito ang “ang kaaway.”
- source_word: חֵרֵף
  choice: nilait ka
  rationale: Ang חרף ay tumutukoy sa mapanlait na paghamak o panunuya. Dahil direktang kasunod ang pangalang Yahweh bilang layon, malinaw at natural sa Tagalog ang “nilait ka, Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְעַם נָבָל
  choice: at ... isang bayang hangal
  rationale: Ang עם ay kolektibong “bayan,” at ang kawalan ng katiyakan ng parirala ay natural na naipahahayag ng “isang.” Ang נָבָל ay moral at espirituwal na kahangalan, ngunit hindi ito pinalalakas sa pangunahing teksto bilang “masama” o “walang Diyos.”
- source_word: נִאֲצוּ
  choice: hinamak
  rationale: Ang נאץ ay nagpapahayag ng pagtrato nang may paghamak o paglapastangan. Malawak ngunit matindi ang “hinamak,” kaya hindi nito labis na nilulutas ang posibleng diwang “nilapastangan.”
- source_word: שְׁמֶךָ
  choice: ang iyong pangalan
  rationale: Pinananatili ang literal na “pangalan,” na sa Hebreo ay maaari ring sumaklaw sa pagkakakilanlan, dangal, at nahayag na karakter ng Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Moral na diwa ng נָבָל
  choice: hangal
  alternative: masama; walang Diyos; napakasama
  rationale: May moral at espirituwal na bigat ang salita, ngunit hindi tahasang tinutukoy ng talata ang buong uri ng kasamaan. Pinananatili ng “hangal” ang tensiyong ito, at nililinaw sa talababa ang diwa.
- issue: Layon ng pandiwang חֵרֵף
  choice: nilait ka ng kaaway, Yahweh
  alternative: nilait ng kaaway si Yahweh
  rationale: Sa Hebreo, ang nagsasalita ay nakikiusap sa Diyos sa ikalawang panauhan ngunit ginagamit ang pangalang Yahweh bilang layon. Ang bokatibong ayos sa Tagalog ay nagpapanatili sa tuwirang panalangin at sa banal na pangalan nang hindi ginagawang salaysay sa ikatlong panauhan.
translation_notes:
  register: Makabago, marangal, at panalanging Tagalog. Ginamit ang “bayan” para sa kolektibong עם at pinanatili ang paralelismo ng dalawang sugnay. Inilagay ang mga alternatibong mas matindi o mas interpretibo sa mga talababa upang mapanatili ang tunay na lawak ng mga salitang Hebreo.
