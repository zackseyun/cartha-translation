base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: tl
  text: Bigyang-pansin mo ang tipan[a], sapagkat ang madidilim na dako ng lupain[c] ay punô ng mga tahanan ng karahasan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang iyong tipan.” Ang Hebreo ay literal na “ang tipan,” ngunit tumutukoy ito sa konteksto sa tipan ng Diyos sa kaniyang bayan.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga pinamumugaran ng karahasan” o “mga tirahan ng karahasan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ng lupa.” Ang salitang Hebreo ay maaaring mangahulugang “lupain” o “lupa,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Bigyang-pansin mo
  rationale: Ang pautos na anyo ng נבט ay humihiling sa Diyos na ituon ang kaniyang pansin sa tipan. Mas natural ito sa makabagong Tagalog kaysa sa literal na “Tingnan mo,” nang hindi idinaragdag ang ideya ng pag-alaala.
- source_word: לַבְּרִית
  choice: ang tipan
  rationale: May tiyak na pantukoy ang Hebreo ngunit walang tahasang panghalip na paari. Pinananatili ng “ang tipan” ang porma at tunay na pahiwatig ng teksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagsusumamo at angkop sa marangal na pananalangin.
- source_word: מָלְאוּ
  choice: punô
  rationale: Ang ganap na pandiwa ay naglalarawan ng umiiral na kalagayan; natural itong ipahayag sa Tagalog sa pamamagitan ng “punô.”
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: ang madidilim na dako ng lupain
  rationale: Pinananatili ang kongkretong larawan ng mga madilim o natatagong lugar. Ang “lupain” ay naaayon sa konteksto ng panaghoy tungkol sa Sion, bagaman maaari ring tumukoy ang אֶרֶץ sa buong lupa.
- source_word: נְאוֹת
  choice: mga tirahan
  rationale: Maaaring mangahulugan ang נָוֶה ng tirahan o pastulan. Sa pagkakaugnay nito sa karahasan, ang “mga tirahan” ang neutral at locative na salin na hindi labis na nagpapakahulugan.
- source_word: חָמָס
  choice: karahasan
  rationale: Tuwirang ipinapahayag nito ang karahasan o marahas na kawalang-katarungan na saklaw ng salitang Hebreo.
theological_decisions:
- issue: Kung gagawing tahasang paari ang tipan
  choice: ang tipan
  alternative: ang iyong tipan
  rationale: “Ang tipan” ang tahasang nasa Hebreo. Bagaman malinaw sa konteksto na tipan ito ng Diyos sa kaniyang bayan, hindi inilalagay sa pangunahing teksto ang panghalip na wala sa pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog na angkop sa panalanging panaghoy. Ginamit ang “Bigyang-pansin” upang maging natural ang pagsusumamo, at pinanatili ang “ang tipan” upang huwag gawing tahasan ang pahiwatig lamang na pagmamay-ari.
