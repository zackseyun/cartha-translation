  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: tl
  text: Sa iyong lakas, biniyak mo ang dagat[b]; dinurog mo ang mga ulo ng mga dambuhalang nilalang[a] sa ibabaw ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dragon” o “malalaking nilalang sa dagat.” Ang Hebreong tanninim ay maaaring tumukoy sa dambuhala at mala-serpiyenteng mga nilalang na kaugnay ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Maaaring alingawngaw ng talatang ito kapwa ang tagumpay ng Diyos laban sa magulong dagat sa makatang larawan at ang makasaysayan niyang pagliligtas sa dagat noong Exodo.
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: biniyak
  rationale: Ang pandiwa ay nagpapahayag ng pagbasag o paghahati. Ang “biniyak” ay malinaw, masidhi, at angkop sa makatang larawan ng paghahati sa dagat.
- source_word: בְעָזְּךָ
  choice: sa pamamagitan ng iyong lakas
  rationale: Pinananatili nito ang instrumental na gamit ng pang-ukol at ang karaniwang kahulugan ng עֹז bilang lakas o kapangyarihan.
- source_word: יָם
  choice: ang dagat
  rationale: Likas sa Filipino ang tiyak na anyong “ang dagat” para sa dagat na nasa makata at makasaysayang larawan ng talata.
- source_word: שִׁבַּרְתָּ
  choice: dinurog
  rationale: Ang “dinurog” ay naghahatid ng marahas at masidhing pagbasag na hinihingi ng paralelismo, nang hindi pinapahina ang larawan.
- source_word: רָאשֵׁי
  choice: ang mga ulo ng
  rationale: Tuwirang pinananatili ang anatomikal at makatang larawan ng Hebreong pariralang konstruktibo.
- source_word: תַנִּינִים
  choice: mga dambuhalang nilalang sa dagat
  rationale: Ipinahihiwatig ng תַנִּינִים ang malalaki, nakatatakot, at kung minsan ay mala-serpiyenteng nilalang na kaugnay ng tubig. Nauunawaan ito ng modernong mambabasa at hindi nito ipinipilit ang mas tradisyonal na “mga dragon.”
- source_word: עַל הַמָּיִם
  choice: sa ibabaw ng tubig
  rationale: Pinananatili nito ang pinakadirektang kahulugan ng עַל at ang kakaibang makatang larawan, sa halip na pakinisin ito bilang “sa tubig.”
theological_decisions:
- issue: Ang katangian ng larawan ng dagat at ng תַנִּינִים
  choice: Pinanatili sa pangunahing teksto ang makata at kosmikong larawan habang hinahayaang marinig din ang posibleng alusyon sa pagliligtas sa panahon ng exodo.
  alternative: Ituring lamang itong paglalarawan sa pagtawid sa dagat at sa Ehipto/Faraon, o ituring lamang itong wika tungkol sa pakikipaglaban sa mga puwersa ng kaguluhan.
  rationale: Maaaring pagsanibin ng Awit 74 ang larawan ng kapangyarihan ng Diyos laban sa magulong dagat at ang alaala ng makasaysayang pagliligtas sa exodo. Hindi dapat lutasin ng salin ang tensiyong hindi nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang makatang “biniyak” at masidhing “dinurog” upang mapanatili ang paralelismo at lakas ng Hebreo. Ang bahagyang di-karaniwang “sa ibabaw ng tubig” ay sadyang pinanatili upang huwag burahin ang larawan ng orihinal.
