  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: tl
  text: Sinilaban nila ang iyong santuwaryo[a]; ibinuwal nila sa lupa ang tahanan ng iyong pangalan at nilapastangan ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Nagpadala sila ng apoy sa iyong santuwaryo.” Ang idyomang Hebreo ay nangangahulugang sinunog nila ito.'
    reason: lexical_alternative
  - marker: c
    text: O, “Nilapastangan nila hanggang sa lupa ang tahanan ng iyong pangalan.” Ang pariralang Hebreo ay maaaring magpahiwatig ng paglapastangan sa tahanan sa pamamagitan ng pagpapababa o pagwasak dito hanggang sa lupa.
    reason: previous_rendering
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: sinilaban
  rationale: Ang literal na larawan ay ‘nagpadala/naglagay ng apoy,’ ngunit sa konteksto ito ay idyomatikong tumutukoy sa pagsunog. Ang ‘sinilaban’ ay likas at tuwirang Filipino.
- source_word: מִקְדָּשֶׁךָ
  choice: ang iyong santuwaryo
  rationale: Pinananatili ng ‘santuwaryo’ ang diwa ng isang banal na lugar at hindi ito agad nililimitahan sa teknikal na katawagang ‘templo.’
- source_word: חִלְּלוּ
  choice: nilapastangan nila
  rationale: Ipinapahayag nito ang paglapastangan sa isang banal na bagay at pinananatili ang salungatan sa kabanalan ng lugar.
- source_word: לָאָרֶץ
  choice: hanggang sa lupa
  rationale: Ipinakikita nito ang lubos na pagpapababa o pagwasak na kalakip ng paglapastangan, habang pinananatili ang konkretong larawan ng lupa.
- source_word: מִשְׁכַּן
  choice: ang tahanan
  rationale: Pinananatili nito ang larawan ng isang tirahan at iniiwasan ang ‘tabernakulo,’ na maaaring maling magpahiwatig ng naunang toldang santuwaryo.
- source_word: שְׁמֶךָ
  choice: ng iyong pangalan
  rationale: Pinananatili ang mahalagang biblikal na idyoma tungkol sa lugar kung saan nananahan o ipinakikilala ang pangalan ng Diyos.
theological_decisions:
- issue: Pagpapahayag sa magkaugnay na מִקְדָּשׁ at מִשְׁכַּן
  choice: magkaibang katawagang ‘santuwaryo’ at ‘tahanan’
  alternative: ‘templo’ at ‘santuwaryo’
  rationale: 'Magkaiba ngunit magkaugnay ang dalawang salitang Hebreo. Pinananatili ng salin ang poetikong pagtutumbas at ang dalawang diin: banal ang lugar at tahanan ito ng pangalan ng Diyos.'
- issue: Pagpapanatili sa idyomang ‘tahanan ng iyong pangalan’
  choice: ang tahanan ng iyong pangalan
  alternative: ang lugar kung saan nananahan ang iyong pangalan / ang iyong tahanan
  rationale: Hindi tahasang sinasabi ng teksto na ang Diyos ay nakapaloob sa gusali. Pinananatili ng literal na idyoma ang teolohikal na tensiyon tungkol sa pangalan at presensiya ng Diyos.
- issue: Ugnayan ng לָאָרֶץ sa ikalawang sugnay
  choice: inilagay ang ‘hanggang sa lupa’ pagkatapos ng buong pariralang layon
  alternative: ‘Sa lupa ay nilapastangan nila ang tahanan ng iyong pangalan’
  rationale: Ginagawang mas natural sa Filipino ang ayos ngunit hindi lubos na nilulutas kung ang parirala ay pangunahing naglalarawan sa paglapastangan, pagpapababa, o pagkawasak ng tahanan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘sinilaban’ para sa likas na pagpapahayag ng pagsunog, samantalang pinanatili ang mas pormal na ‘nilapastangan’ at ang biblikal na idyomang ‘tahanan ng iyong pangalan.’
