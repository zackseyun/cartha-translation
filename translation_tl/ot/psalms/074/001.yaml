  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: tl
  text: 'Isang Maskil[a] ni Asaf.


    Bakit, O Diyos, itinakwil mo kami magpakailanman? Bakit umuusok ang iyong galit laban sa mga tupa ng iyong pastulan?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Maskil” ay isang teknikal na pamagat ng salmo; maaaring tumukoy ito sa isang mapagnilay o nagtuturong komposisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan ng teknikal na pamagat na ito sa mga salmo. Pinanatili ang transliterasyon upang hindi ito labis na bigyang-kahulugan; ipinaliwanag sa talababa ang mga pangunahing posibilidad.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Natural itong anyo ng pamagat sa modernong Tagalog. Maaaring magpahiwatig ang לְ ng pag-akda, kaugnayan, o pag-aalay, kaya hindi pinalawak ang salin upang tukuyin ang isang posibilidad lamang.
- source_word: לָמָה
  choice: Bakit
  rationale: Direkta at natural na tanong ito sa isang panaghoy.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Malinaw na tuwirang kinakausap ang Diyos; ang “O Diyos” ay natural at marangal na anyong pantawag.
- source_word: זָנַחְתָּ
  choice: itinakwil mo kami
  rationale: Ipinahahayag ng pandiwa ang pagtatakwil o pagtataboy. Malinaw at matindi ang “itinakwil” nang hindi nagiging lipas ang wika.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Pinananatili nito ang mariing diwa ng walang katapusang tagal sa wika ng panaghoy, nang hindi nilulutas kung literal o tila walang katapusan ang karanasan ng nagsasalita.
- source_word: יֶעְשַׁן
  choice: umuusok
  rationale: Pinanatili ang tahasang larawan ng usok sa Hebreo sa halip na palitan ito ng mas pangkalahatang “nag-aalab” o “nagngangalit.”
- source_word: אַפְּךָ
  choice: iyong galit
  rationale: Bagaman literal na kaugnay ng ilong o butas ng ilong, ang salita ay idyomatikong tumutukoy sa galit. Naipagpapatuloy ng “umuusok” ang pisikal na larawan.
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: laban sa mga tupa ng iyong pastulan
  rationale: Pinananatili ang pastoral na metapora at ang direksiyon ng galit laban sa kawan na pag-aari at inaalagaan ng Diyos.
theological_decisions:
- issue: Ang unang panauhang maramihang layon ay hindi hiwalay na nakikita sa ibinigay na pagkakahati ng mga salita ngunit taglay ng tradisyonal na pagbasa ng anyong pandiwa at hinihingi ng konteksto.
  choice: itinakwil mo kami
  alternative: itinakwil mo [ang iyong bayan]
  rationale: Ang salmo ay panaghoy ng pamayanan. Ang “kami” ay naghahayag ng layon ng pandiwa nang hindi nagdaragdag ng mas tiyak na katawagang teolohikal gaya ng “iyong bayan.”
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Pinanatili ang matingkad na larawang “umuusok ang iyong galit” at ang pastoral na “mga tupa ng iyong pastulan.” Inilipat ang talababa sa “Maskil[a],” ang salitang talagang ipinaliliwanag nito.
