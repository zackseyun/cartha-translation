  naturalness: Natural at marangal ang modernong Tagalog. Ang dalawang tanong ay malinaw at angkop sa panaghoy. Ang “umuusok ang iyong galit” ay bahagyang matalinghaga ngunit sadyang tapat at madaling maunawaan sa konteksto.
