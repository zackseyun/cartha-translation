id: PSA.74.9
reference: Psalms 74:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: tl
  text: Hindi namin nakikita ang aming mga tanda[a]; wala nang propeta, at walang sinuman sa amin ang nakaaalam kung hanggang kailan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aming mga sagisag” o “aming mga palatandaan.” Ang salitang Hebreo ay maaaring tumukoy sa nakikitang mga tanda o sagisag, ngunit hindi tahasang sinasabi rito kung ano ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: aming mga tanda
  rationale: Ang אוֹת ay karaniwang nangangahulugang tanda o palatandaan. Pinananatili ng “mga tanda” ang lawak at di-tiyak na tinutukoy ng Hebreo, sa halip na tukuyin agad ang mga ito bilang mga sagisag, watawat, o tanda ng presensiya ng Diyos.
- source_word: לֹא רָאִינוּ
  choice: Hindi namin nakikita
  rationale: Bagaman anyong perfect ang pandiwa, ipinahahayag nito sa panaghoy ang nagpapatuloy na kalagayan ng kawalan; likas at tuwiran sa Filipino ang pangkasalukuyang “hindi namin nakikita.”
- source_word: אֵין עוֹד
  choice: wala nang
  rationale: Malinaw na ipinahahayag ng maikling pariralang Filipino ang paghinto o patuloy na pagkawala ng isang bagay na dating naroon.
- source_word: נָבִיא
  choice: propeta
  rationale: Ito ang karaniwan at malinaw na salin ng נָבִיא; ang isahan ay ginagamit sa pangkalahatang diwa na wala nang sinumang propeta.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: at walang sinuman sa amin ang nakaaalam
  rationale: 'Likas nitong ipinahahayag sa Filipino ang eliptikong Hebreo: walang kasama sa pamayanan na nakaaalam.'
- source_word: עַד מָה
  choice: kung hanggang kailan
  rationale: Sa konteksto ng panaghoy, ang עַד מָה ay idyomang nagtatanong sa tagal. Ang “kung hanggang kailan” ay umaangkop bilang layon ng “nakaaalam.”
theological_decisions:
- issue: Ang tinutukoy ng “aming mga tanda”
  choice: Pinanatiling malawak at di-tiyak bilang “aming mga tanda.”
  alternative: “aming mga sagisag,” “aming mga watawat,” o “mga tanda ng presensiya ng Diyos sa amin”
  rationale: Hindi tahasang tinutukoy ng Hebreo kung ano ang mga tanda. Iniiwasan ng malawak na salin ang pagpasok ng isang tiyak na rekonstruksiyong pangkasaysayan o teolohikal na hindi sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “wala nang” para sa likas na daloy at “nakaaalam” bilang pamantayang anyo. Inilagay ang talababa pagkatapos ng “mga tanda,” ang salitang aktuwal na tinatalakay nito.
