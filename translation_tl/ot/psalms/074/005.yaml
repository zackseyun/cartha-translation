  text: He was known like one who lifts up axes in a thicket of trees[a][b][c].
translation:
  language: tl
  text: Siya ay nakilala, gaya ng isang nagtataas ng mga palakol sa masukal na gubat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Siya ay nakilala gaya ng isang nagdadala ng mga palakol paitaas sa masukal na kahoy.” Siksik at medyo mahirap unawain ang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang pariralang ito na “sa kakahuyan” o “laban sa masukal na gubat.”
    reason: textual_ambiguity
lexical_decisions:
- source_word: יִוָּדַע
  choice: Nakilala siya
  rationale: 'Ang Niphal imperfect na panlalaking isahan ng ידע ay maaaring ilarawan dito bilang pangyayaring nakaraan: “nakilala siya.” Pinananatili ang panlalaking isahan, bagaman hindi tiyak ang tinutukoy sa masinsing tulang Hebreo.'
- source_word: כְּמֵבִיא
  choice: gaya ng isang nagtataas
  rationale: Ang כְּ ay naghuhudyat ng paghahambing, at ang Hiphil participle ng בוא ay literal na “nagdadala/nagpapaakyat.” Sa larawan ng paggamit ng palakol, natural sa Tagalog ang “nagtataas,” ngunit hindi nito ganap na inaalis ang kahulugang “nagdadala.”
- source_word: לְמָעְלָה
  choice: nagtataas
  rationale: Ang diwang “paitaas” ay isinama sa pandiwang “nagtataas” upang maging natural at maiwasan ang mabigat na “nagtataas paitaas.”
- source_word: בִּסֲבָךְ עֵץ
  choice: sa masukal na mga punongkahoy
  rationale: Ang סבך ay masukal o makapal na pagtubo, at ang עץ ay maaaring “puno” o “kahoy.” Ang parirala ay isinaling bilang likas na larawang gubat sa Tagalog, habang inilalagay sa talababa ang mas pormal na alternatibo.
- source_word: קַרְדֻּמּוֹת
  choice: mga palakol
  rationale: Tumutukoy ang pangngalang maramihan sa mga kasangkapang pamutol; “mga palakol” ang pinakakaraniwan at madaling maunawaang katumbas.
