base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: tl
  text: Sinabi nila sa kanilang puso, “Lipulin natin silang lahat!”[a] Sinunog nila ang lahat ng mga lugar ng pagtitipon para sa Diyos sa lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang Hebreong נִינָם. Maaari rin itong mangahulugang “apihin natin sila,” “supilin natin sila,” o ibang pahayag ng mapanirang hangarin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng mga lugar na itinakda para sa Diyos”; sa ilang tradisyonal na salin, “lahat ng mga sinagoga ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  choice: Sinabi nila
  rationale: Ang Qal perfect 3cp ng אמר ay nagsasaad ng pasiya ng mga kaaway sa daloy ng salaysay; natural dito ang payak na nakaraang aspekto.
- source_word: בְלִבָּם
  choice: sa kanilang puso
  rationale: Pinananatili nito ang Hebreong larawan para sa panloob na pagsasalita o lihim na hangarin.
- source_word: נִינָם
  choice: natin silang lipulin
  rationale: Napakahirap at hindi tiyak ang anyong Hebreo. Sa konteksto, nagpapahayag ito ng mapanirang hangarin; ang “lipulin” ay malinaw at natural ngunit ang kawalang-katiyakan ay inilalahad sa talababa.
- source_word: יָחַד
  choice: sabay-sabay
  rationale: Ipinahahayag ang ideya ng pagkilos nang magkakasama; sa konteksto maaari ring magpahiwatig ng ganap o malawakang paglipol.
- source_word: שָׂרְפוּ
  choice: Sinunog nila
  rationale: Tuwirang katumbas ng Qal perfect 3cp ng שרף at likas sa makabagong Tagalog.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili ang kabuuang saklaw ng Hebreo.
- source_word: מוֹעֲדֵי אֵל
  choice: mga dakong tipanan ng Diyos
  rationale: Maaaring tumukoy ang מוֹעֵד sa takdang panahon o dako ng pagtitipon. Dahil sinusunog ang mga ito at nasa lupain, higit na malamang ang panlugar na diwa. Iniiwasan din nito ang anakronistikong “mga sinagoga.”
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Sa konteksto, malamang na tumutukoy sa lupain ng Israel, hindi sa buong daigdig.
theological_decisions:
- issue: Kahulugan ng מוֹעֲדֵי אֵל sa konteksto ng pagsunog
  choice: mga dakong tipanan ng Diyos
  alternative: mga takdang panahon ng Diyos; mga sinagoga ng Diyos
  rationale: Sinusuportahan ng pandiwang “sinunog” at ng pariralang “sa lupain” ang panlugar na pakahulugan, ngunit pinananatili sa talababa ang tunay na leksikal na kalabuan.
- issue: Pakakahulugan sa mahirap na anyong נִינָם
  choice: 'isang pahayag ng mapanirang hangarin: “natin silang lipulin”'
  alternative: apihin natin sila; supilin natin sila; isang pagbasa na pangngalan at may ibang sintaks
  rationale: Hindi tiyak ang anyo. Ang pangunahing salin ay sumusunod sa malinaw na tunguhin ng konteksto nang hindi ikinukubli ang ibang posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang idyomang “sa kanilang puso” at gumamit ng “mga dakong tipanan” upang maipahayag ang panlugar na diwa nang hindi nag-aangkat ng mas huling institusyong panrelihiyon.
