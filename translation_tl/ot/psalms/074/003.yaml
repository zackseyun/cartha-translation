base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
translation:
  language: tl
  text: Ihakbang mo ang iyong mga paa tungo sa mga guhong nananatili magpakailanman[a]; winasak ng kaaway ang lahat ng nasa santuwaryo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungo sa matagal nang mga guho.” Maaari ring ipahiwatig ng Hebreo ang pagkawasak na patuloy o waring permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִימָה פְעָמֶיךָ
  choice: Ihakbang mo ang iyong mga paa
  rationale: Ang utos ay nakatuon sa Diyos at naglalarawan sa kaniya na kumikilos patungo sa wasak na santuwaryo. Pinananatili ng parirala ang kongkretong larawan ng mga paa at paglapit, ngunit inihahayag ito sa likas na modernong Tagalog.
- source_word: לְמַשֻּׁאוֹת נֶצַח
  choice: tungo sa mga guhong nananatili magpakailanman
  rationale: Ang מַשֻּׁאוֹת ay tumutukoy sa mga guho o bunga ng pagkawasak, at ang נֶצַח ay maaaring magpahiwatig ng nagpapatuloy, matagal na, o waring permanenteng kalagayan. Pinananatili ng salin ang tindi at tagal ng pagkawasak.
- source_word: כָּל הֵרַע אוֹיֵב
  choice: winasak ng kaaway ang lahat
  rationale: Sa konteksto ng pagkawasak sa banal na lugar, ang Hiphil na הֵרַע ay natural na nangangahulugang gumawa ng matinding pinsala o nagwasak. Ang כָּל ay isinaling komprehensibo bilang “ang lahat.”
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Dito ang קֹדֶשׁ ay tumutukoy sa banal na pook o sagradong nasasakupan, malamang sa santuwaryo ng templo. Ang “santuwaryo” ay malinaw at angkop sa konteksto.
theological_decisions:
- issue: Antropomorpikong panawagan sa Diyos sa pambungad na utos
  choice: Pinanatili ang larawan ng Diyos na inihahakbang ang kaniyang mga paa patungo sa mga guho.
  alternative: Lumapit ka sa mga guho; Halika at tingnan mo ang mga guho.
  rationale: Hindi nilulutas ng salin ang makatang larawan sa isang paliwanag lamang gaya ng “lumapit ka” o “halika.” Sa gayon, nananatili ang kongkreto at matinding panawagan ng Hebreo nang walang idinaragdag na bilis o layuning hindi tahasang sinabi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ihakbang mo ang iyong mga paa” upang mapanatili ang matingkad na larawan ng Diyos na kumikilos, habang iniiwasan ang di-likas na literalismong “itaas mo ang iyong mga hakbang.”
