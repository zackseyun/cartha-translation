  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: tl
  text: Huwag mong hayaang bumalik na napahiya ang api[a][b]; purihin nawa ng dukha at nangangailangan ang iyong pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang dinurog,” “ang niyurakan,” o “ang sinisiil” para sa “ang api.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na inilagay sa kahihiyan” o “na hinamak.” Maaaring kasama sa Hebreo ang diwa ng hayagang paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָשֹׁב
  choice: Huwag mong hayaang umalis
  rationale: Ang אַל kasama ng di-ganap na anyo ay nagpapahayag ng pakiusap na huwag mangyari ang kilos. Ang יָשֹׁב ay literal na “bumalik/tumalikod,” ngunit sa konteksto ay natural na tumutukoy sa pag-alis mula sa paglapit sa Diyos nang hindi napagbigyan; pinananatili ng “umalis” ang diwa nang hindi dinaragdagan ang sanhi.
- source_word: דַּךְ
  choice: ang api
  rationale: Tumutukoy sa taong dinurog, hinamak, o sinikil. Ang “api” ay maikli, natural, at malinaw sa modernong Filipino, habang ang mas literal na mga larawan ay inilalagay sa talababa.
- source_word: נִכְלָם
  choice: na kahiya-hiya
  rationale: Ang pasibong anyo mula sa כלם ay maaaring mangahulugang napahiya o nalagay sa kahihiyan. Ipinahahayag ng “na kahiya-hiya” ang kalagayan ng pampublikong pagkapahiya, hindi lamang ang panloob na damdamin ng hiya.
- source_word: עָנִי
  choice: dukha
  rationale: Sa pagkakaparis nito sa אֶבְיוֹן, nangingibabaw ang diwang panlipunan at pangkabuhayan. Ang “dukha” ay dignified at karaniwang salitang biblikal na nauunawaan pa rin sa modernong Filipino.
- source_word: אֶבְיוֹן
  choice: nangangailangan
  rationale: Tumutukoy sa kapos o salat na nangangailangan ng tulong. Naiiba ito sa עָנִי habang pinananatili ang tambalang diwa ng “dukha at nangangailangan.”
- source_word: יְהַלְלוּ
  choice: purihin nawa
  rationale: Ang Piel na di-ganap/jussive ay isang mapanalanging kahilingan. Ang “nawa” ay natural na nagpapahayag ng hangad at kaayon ng unang sugnay.
- source_word: שְׁמֶךָ
  choice: ang iyong pangalan
  rationale: Pinananatili ang Hebreong pahayag tungkol sa nahayag na pagkakakilanlan, dangal, at reputasyon ng Diyos nang hindi ito ipinapaliwanag nang labis.
theological_decisions:
- issue: Kaugnayan ng huling sugnay sa unang pakiusap
  choice: 'Inilalahad ang dalawang sugnay bilang magkaugnay na mga pakiusap: huwag umalis na napahiya ang api; purihin nawa ng dukha at nangangailangan ang Diyos.'
  alternative: Maaaring unawain ang ikalawang sugnay bilang bunga ng pagliligtas ng Diyos, o bilang mas pangkalahatang hangad na patuloy silang magpuri.
  rationale: Walang tahasang panandang nagsasaad ng sanhi o resulta sa Hebreo. Kaya hindi idinagdag ang “upang” o “sa gayon,” at pinananatili ang ugnayang maaaring nagpapahiwatig ng bunga ngunit hindi ito nilulutas.
translation_notes:
  register: Modernong Filipino na may marangal at mapanalanging himig. Pinili ang “api” at “nangangailangan” para sa malinaw na pang-araw-araw na pag-unawa; ginamit ang “dukha” at “nawa” bilang pormal ngunit buhay pa ring mga salitang angkop sa salmo. Ang pagkakasunod ng mga marker na [a][b] ay tumutugma sa mismong mga salitang tinutukoy ng bawat talababa.
