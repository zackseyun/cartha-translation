  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: tl
  text: 'Bumangon ka, O Diyos; ipagtanggol mo ang iyong usapin.[a]


    Alalahanin mo ang paghamak sa iyo ng hangal[b] sa buong maghapon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipaglaban mo ang iyong usapin.” Gumagamit ang Hebreo ng pananalita tungkol sa isang legal na usapin o pagtatalo.
    reason: lexical_alternative
  - marker: b
    text: Dito, ang “hangal” ay taong tiwali at walang takot sa Diyos, hindi lamang taong kulang sa talino.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Ang pautos na anyo ng קום, na may paragogic ה, ay isang mariing panawagan sa Diyos na kumilos. Likas at malinaw sa makabagong Filipino ang “Bumangon ka.”
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag sa Diyos; pinananatili ng “O Diyos” ang marangal at mapanalanging himig.
- source_word: רִיבָה רִיבֶךָ
  choice: ipaglaban mo ang iyong usapin
  rationale: Magkaugnay na pandiwa at pangngalan mula sa ריב ang gumagamit ng wika ng legal na pagtatalo. Naipahihiwatig ng “ipaglaban … ang iyong usapin” kapwa ang pagtatanggol at ang pagharap sa sariling kaso nang hindi ginagawang teknikal o lipas ang Filipino.
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pautos na humihiling sa Diyos na kilalanin at tugunan ang kalagayan, nang hindi dinaragdagan ang salin ng ipinahihiwatig na pagkilos.
- source_word: חֶרְפָּתְךָ
  choice: ang paghamak sa iyo
  rationale: Ang חֶרְפָּה ay panlalait, paghamak, o pagdudulot ng kahihiyan. Mas natural sa Filipino ang “paghamak sa iyo” kaysa sa literal ngunit malabong “iyong paghamak,” at tumutugma ito sa malamang na diwang ang Diyos ang hinahamak.
- source_word: מִנִּי
  choice: ng
  rationale: Sa pariralang Filipino na “paghamak sa iyo ng hangal,” ang “ng” ang natural na nagmamarka sa pinagmumulan o gumagawa ng paghamak na ipinapahayag ng Hebrew מן.
- source_word: נָבָל
  choice: hangal
  rationale: Pinananatili ang maikli at tradisyonal na katawagan, samantalang nililinaw sa talababa na ang tinutukoy ay katiwaliang moral at kawalang-galang sa Diyos, hindi lamang kakulangan sa talino.
- source_word: כָּל הַיּוֹם
  choice: sa buong maghapon
  rationale: Natural at marangal na ekspresyon para sa patuloy na paghamak sa kabuuan ng araw.
theological_decisions:
- issue: Tinutukoy ng “iyong paghamak” o “paghamak sa iyo”
  choice: Paghamak na tuwirang nakatuon sa Diyos
  alternative: Paghamak na dinaranas ng bayan ng Diyos at itinuturing na paghamak din sa kanya
  rationale: Pinakamadaling unawain ang hulaping panghalip bilang tumutukoy sa paghamak laban sa Diyos, lalo na kasunod ng panawagang ipaglaban niya ang kanyang usapin. Gayunman, hindi pinalalawak ng salin ang pahayag upang ibukod ang mas malawak na ugnayang tipan sa kanyang bayan at santuwaryo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong panalangin at ang legal na talinghaga, habang iniwasan ang sobrang teknikal na bokabularyo.
