  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: tl
  text: Alalahanin mo ang iyong kapulungan, na ginawa mong iyo[a] noong unang panahon, na tinubos mo bilang lipi[b] ng iyong mana—ang Bundok Zion na ito[c], na iyong tinahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tinamo mo,” “binili mo,” o, sa ibang konteksto, “nilikha mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “lipi” ay maaari ring mangahulugang “setro” o “pamalo.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ito”; tumutukoy sa Bundok Zion.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pautos at pakiusap sa Diyos; natural ito sa makabagong Tagalog para sa panalanging nananawagang kumilos ang Diyos ayon sa kanyang kaugnayan sa bayan.
- source_word: עֲדָתְךָ
  choice: iyong kapulungan
  rationale: Ipinahahayag ang sama-samang bayan o pamayanan nang hindi nililimitahan sa isang pagtitipon lamang.
- source_word: קָנִיתָ
  choice: ginawa mong iyo
  rationale: Sinasaklaw ang diwa ng pagtatamo at pag-aari nang hindi ipinapalagay na literal na pagbili o paglikha ang tinutukoy.
- source_word: קֶדֶם
  choice: noong unang panahon
  rationale: Malinaw at marangal na pagpapahayag ng isang pangyayaring naganap noong sinaunang panahon.
- source_word: גָּאַלְתָּ
  choice: tinubos mo
  rationale: Pinananatili ang mahalagang diwa ng pagliligtas at pagtubos ng Diyos sa kanyang bayan.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: ang lipi na iyong mana
  rationale: Ang 'lipi' ang pinakamalamang na kahulugan sa konteksto ng kapulungang tinubos; ang pariralang 'iyong mana' ay nagpapanatili sa larawan ng bayang pag-aari ng Diyos.
- source_word: הַר צִיּוֹן
  choice: Bundok Zion
  rationale: Karaniwan at madaling makilalang anyo ng pangalan ng lugar sa Tagalog.
- source_word: זֶה
  choice: na ito
  rationale: Pinananatili ang tahasang demonstratibo ng Hebreo at iniuugnay ito sa Bundok Zion.
- source_word: שָׁכַנְתָּ בוֹ
  choice: na iyong tinahanan
  rationale: Likas na Tagalog na nagsasaad na doon nanahan ang Diyos, habang pinananatili ang aspektong nakaraan ng pandiwang Hebreo.
theological_decisions:
- issue: Kung ang קָנִיתָ ay tumutukoy sa paglikha o sa pagtatamo sa Israel bilang sariling bayan ng Diyos
  choice: Pagtatamo o pag-angkin sa Israel bilang sariling bayan ng Diyos
  alternative: Paglikha o literal na pagbili
  rationale: Ang kasunod na 'tinubos mo' at ang bagay na 'iyong kapulungan' ay higit na umaayon sa makasaysayang paggawa ng Diyos sa Israel bilang kanyang sariling bayan. Ang 'ginawa mong iyo' ay hindi nagdaragdag ng komersiyal o kosmolohikal na kahulugan.
- issue: Kung ang שֵׁבֶט ay 'lipi,' 'setro,' o 'pamalo'
  choice: lipi
  alternative: setro o pamalo
  rationale: Ang paralelismo sa kapulungan at sa bayang tinubos ay malakas na sumusuporta sa kahulugang isang pangkat ng mga tao, bagaman tunay na kahulugang leksikal din ng salita ang 'setro' at 'pamalo'.
- issue: Kung dapat ipaliwanag ang ugnayan ng Bundok Zion sa tinubos na bayan
  choice: Panatilihin ang masinsin at bahagyang bukas na apposisyon ng Hebreo
  alternative: Tahasan itong gawing hiwalay na kahilingan o sabihing ang Zion ay metonimiya para sa bayan
  rationale: Magkakasunod ang 'kapulungan,' 'lipi,' at 'Bundok Zion' sa Hebreo. Hindi nilulutas ng salin kung ang Zion ay apposisyon, metonimiya para sa bayan, o ikalawang bagay na dapat alalahanin.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang 'kapulungan,' 'tinubos,' at 'mana' upang mapanatili ang panalanging tono at mahahalagang larawang tipan, ngunit iniwasan ang labis na teknikal o denominasyonal na pananalita. Pinanatili ang siksik na apposisyon ng Hebreo sa halip na ipaliwanag nang higit sa sinasabi ng teksto.
