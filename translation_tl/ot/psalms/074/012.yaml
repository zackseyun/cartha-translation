  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: tl
  text: Ngunit ang Diyos ang aking Hari mula pa noong unang panahon, na nagsasagawa ng mga gawang pagliligtas sa gitna ng daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupain.” Maaaring tumukoy ang salitang Hebreo sa buong daigdig o sa isang partikular na lupain o rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Ngunit ang Diyos
  rationale: 'Sa konteksto, ang pang-ugnay ay may diwang pasalungat: sa kabila ng kasalukuyang pagkawasak, nananatili ang pagtitiwala sa Diyos. Likas itong ipinahahayag ng “Ngunit.”'
- source_word: מַלְכִּי
  choice: aking Hari
  rationale: Tuwirang pinananatili ang pangngalang may panlaping unang panauhang isahan, “aking hari”; ang malaking titik ay nagpapakitang titulo ito para sa Diyos.
- source_word: מִקֶּדֶם
  choice: mula pa noong unang panahon
  rationale: Ipinahahayag nito ang sinaunang panahon o matagal nang kalagayan nang hindi ipinapalagay na tiyak na tumutukoy ito sa pasimula ng lahat.
- source_word: פֹּעֵל
  choice: gumagawa
  rationale: Ang participle ay naglalarawan sa Diyos bilang patuloy o likas na kumikilos; ang “gumagawa” ay simple at natural sa makabagong Tagalog.
- source_word: יְשׁוּעוֹת
  choice: mga pagliligtas
  rationale: Pinananatili ng anyong maramihan ang diwa ng paulit-ulit o maraming gawang nagliligtas, sa halip na gawing abstraktong isahan.
- source_word: בְּקֶרֶב
  choice: sa gitna ng
  rationale: Pinananatili nito ang spatial at makatang diwa ng pagiging nasa kalagitnaan o loob.
- source_word: הָאָרֶץ
  choice: daigdig
  rationale: Maaaring tumukoy ang אֶרֶץ sa buong daigdig o sa isang lupain. Ang “daigdig” ang pinili dahil ang malawak na pahayag tungkol sa paghahari at pagliligtas ng Diyos ay umaayon dito, habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Saklaw ng mga pagliligtas ng Diyos
  choice: daigdig
  alternative: lupain
  rationale: Likas na malabo ang אֶרֶץ kung tumutukoy sa buong mundo o sa isang partikular na lupain. Pinili ang mas malawak na kahulugan dahil sa malawak na saklaw ng mga makapangyarihang gawa ng Diyos sa konteksto, ngunit hindi inalis ang lokal na posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang makatang ayos at ang maramihang “mga pagliligtas,” gayundin ang leksikal na kalabuan ng אֶרֶץ sa pamamagitan ng talababa.
