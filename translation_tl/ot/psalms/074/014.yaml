  text: אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן תִּתְּנֶ֥/נּוּ מַ֝אֲכָ֗ל לְ/עָ֣ם לְ/צִיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: tl
  text: Ikaw ang dumurog sa mga ulo ng Leviatan; ibinigay mo siya bilang pagkain sa mga nilalang sa disyerto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga naninirahan sa disyerto” o “sa maiilap na hayop sa disyerto.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo; maaari itong tumukoy sa mga naninirahan o sa mga nilalang sa tuyong lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: dumurog
  rationale: Ipinahahayag ng pandiwa ang marahas na pagbasag o pagdurog; likas at matindi sa modernong Tagalog ang “dumurog.”
- source_word: רָאשֵׁי
  choice: mga ulo ng
  rationale: Maramihan ang anyong Hebreo, kaya pinanatili ang “mga ulo” sa halip na gawing isahan.
- source_word: לִוְיָתָן
  choice: Leviatan
  rationale: Isinalin sa baybay-Tagalog ang pangalang poetiko upang mapanatili ang kaugnayan nito sa iba pang pagbanggit sa Kasulatang Hebreo, nang hindi ipinapasiya kung literal o sagisag ang tinutukoy.
- source_word: תִּתְּנֶנּוּ
  choice: ibinigay mo siya
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay,” at ang panlalaking isahang hulapi ay tumutukoy pabalik kay Leviatan.
- source_word: מַאֲכָל
  choice: bilang pagkain
  rationale: Tuwirang ipinapahayag ang pagiging pagkain ni Leviatan at likas ang parirala matapos ang “ibinigay mo siya.”
- source_word: לְעָם לְצִיִּים
  choice: sa mga nilalang sa disyerto
  rationale: Ang mahirap na parirala ay maaaring tumukoy sa mga naninirahan o sa maiilap na nilalang ng tuyong lupain. Ang “mga nilalang” ay natural sa Tagalog at hindi lubusang isinasara ang saklaw, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
theological_decisions:
- issue: Ang kalikasan ng larawan ni Leviatan
  choice: Pinanatili ang “Leviatan” bilang poetiko at kosmikong larawan nang hindi tinutukoy kung literal na nilalang, mitopoetikong sagisag, o makasaysayang kaaway ito.
  alternative: Isalin ito nang tiyak bilang “halimaw sa dagat,” o ipakahulugan nang tahasan bilang Ehipto o mga kapangyarihan ng kaguluhan.
  rationale: Hindi nilulutas ng talata ang eksaktong tinutukoy ng larawan; dapat panatilihin ng salin ang gayong teolohikal at poetikong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at matinding paralelismong poetiko ng Hebreo; inilagay ang pananda ng talababa sa mismong pariralang pinagmumulan ng kalabuan.
