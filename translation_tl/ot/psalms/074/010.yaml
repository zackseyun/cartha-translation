  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: tl
  text: Hanggang kailan, O Diyos, ka lalaitin ng kaaway? Hamakin ba ng kalaban ang pangalan mo[a] magpakailanman?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalapastanganin ba ng kalaban ang pangalan mo magpakailanman?”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Likas na pananalitang Filipino para sa tanong ng panaghoy tungkol sa tila matagal nang pagdurusa.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Pinananatili ang tuwirang pagtawag sa Diyos sa konteksto ng panalangin at panaghoy.
- source_word: יְחָרֶף
  choice: manlalait
  rationale: Ipinahahayag ang mapanuyang paghamak o pang-iinsulto na saklaw ng Piel ng חרף.
- source_word: צָר
  choice: ang kaaway
  rationale: Natural at malinaw na katumbas ng adversary sa modernong Filipino; ang pagkakaiba nito sa אוֹיֵב ay ipinahihiwatig sa pamamagitan ng ‘kalaban’ sa kasunod na linya.
- source_word: יְנָאֵץ
  choice: lalapastanganin
  rationale: Nagpapahayag ng matinding paghamak na nakatuon sa pangalan ng Diyos, nang hindi kinakailangang gawing teknikal ang salita.
- source_word: אוֹיֵב
  choice: ang kalaban
  rationale: Pinananatili ang magkatulad ngunit bahagyang magkaibang katawagan sa Hebreong paralelismo.
- source_word: שִׁמְךָ
  choice: ang pangalan mo
  rationale: Tahasang pinananatili ang ‘pangalan,’ na sumasaklaw sa karangalan, reputasyon, at nahayag na pagkakakilanlan ng Diyos.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Karaniwang marangal na katumbas ng temporal na pahayag at angkop sa panaghoy ng salmo.
theological_decisions:
- issue: Kung gagawing tahasan na ang paglapastangan sa pangalan ng Diyos ay paglapastangan sa Diyos mismo
  choice: Panatilihin sa pangunahing teksto ang ‘pangalan mo.’
  alternative: ‘Lalapastanganin ka ba ng kalaban magpakailanman?’
  rationale: Tahasang binabanggit ng Hebreo ang pangalan ng Diyos. Pinananatili nito ang mayamang kahulugan ng kaniyang karangalan at nahayag na pagkakakilanlan nang hindi ito pinapaliit sa isang pagpapakahulugan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pares na ‘kaaway/kalaban’ upang bahagyang maipakita ang dalawang magkaibang salitang Hebreo habang pinananatili ang kasingkahulugang paralelismo. Hindi isinama ang ibinigay na Ingles na talababa dahil mali ang pagkakalagay nito sa marker na kasunod ng ‘How long’; ang alternatibong ‘blaspheme’ ay tumutukoy sa יְנָאֵץ, hindi sa עַד מָתַי.
