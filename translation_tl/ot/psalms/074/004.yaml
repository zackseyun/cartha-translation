translation:
  language: tl
  text: Umungal ang mga kaaway mo sa gitna ng iyong itinakdang dakong tipanan[a]; inilagay nila ang kanilang mga sagisag bilang mga tanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa loob ng iyong dakong pulungan.” Ang salitang Hebreo ay maaaring tumukoy sa takdang panahon, kapulungan, o takdang pook; dito, malamang na banal na dakong pinagtitipunan ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, inuulit ang salitang “mga tanda”: literal, “inilagay nila ang kanilang mga tanda bilang mga tanda.” Malamang na tumutukoy ito sa pagtatanghal ng sarili nilang mga sagisag o watawat bilang tanda ng pag-angkin o tagumpay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: Umungal
  rationale: Pinananatili nito ang marahas at tila-hayop na lakas ng pandiwang karaniwang ginagamit sa pag-ungal ng leon, sa halip na payak na “sumigaw.”
- source_word: צֹרְרֶיךָ
  choice: ang mga kaaway mo
  rationale: Natural at malinaw sa modernong Tagalog para sa mga kumakalaban o mapanupil na kaaway sa konteksto ng paglapastangan sa banal na pook.
- source_word: בְּקֶרֶב
  choice: sa gitna ng
  rationale: Tuwirang ipinahahayag ang kinalalagyan sa loob o kalagitnaan ng pook.
- source_word: מוֹעֲדֶךָ
  choice: iyong takdang dakong tipanan
  rationale: Pinagsasama ang diwa ng itinakda at ng pook ng pagtitipon, na angkop sa konteksto ng santuwaryo habang hindi ito nililimitahan sa isang tiyak na gusali.
- source_word: שָׂמוּ
  choice: itinayo nila roon
  rationale: Ipinahihiwatig ang paglalagay o pagtatanghal ng mga sagisag sa sinakop na banal na pook; ang “roon” ay likas na tumutukoy sa naunang lokasyon.
- source_word: אוֹתֹתָם
  choice: ang sarili nilang mga sagisag
  rationale: Malinaw na ipinakikita ang pag-aari ng mga kaaway at natural na inilalarawan ang kanilang mga simbolo o watawat.
- source_word: אֹתוֹת
  choice: bilang mga tanda
  rationale: Pinananatili ang ikalawang paggamit ng Hebreong salita bilang panaguring nagsasaad na ang kanilang mga sagisag ay inilagay bilang mga tandang naghahayag ng pag-angkin o tagumpay.
theological_decisions:
- issue: Kahulugan ng מוֹעֵד sa panaghoy tungkol sa paglapastangan sa templo
  choice: 'panlunan at pangkultong diwa: “takdang dakong tipanan”'
  alternative: takdang panahon, kapulungan, o kapistahan
  rationale: Ang nakapaligid na konteksto ay tungkol sa pagpasok ng mga kaaway sa banal na lugar. Gayunman, pinananatili ng “takdang dakong tipanan” ang ugnayan ng salita sa itinakdang pagtitipon at hindi ito tahasang pinapakahulugang templo lamang.
- issue: Pag-uulit ng אוֹת sa hulihan ng talata
  choice: “mga sagisag bilang mga tanda”
  alternative: literal na “mga tanda nila bilang mga tanda”
  rationale: 'Iniiwasan ang malamya at nakalilitong pag-uulit sa Tagalog ngunit pinananatili ang diin at tensiyon ng Hebreo: ang mga simbolo ng kaaway ay itinanghal bilang mga tanda sa banal na pook.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “umungal” upang mapanatili ang matinding larawang Hebreo, at “dakong tipanan” upang maipakita ang pangkultong diwa nang hindi labis na nililinaw ang likas na ambiguwidad.
