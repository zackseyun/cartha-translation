  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: tl
  text: Iyo ang araw; iyo rin ang gabi.[a] Ikaw ang nagtakda ng liwanag at ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanglaw”; inuunawa ito ng ilan bilang tumutukoy sa buwan dahil sa pagkakatambal ng araw at gabi, ngunit hindi tahasang sinasabi ng Hebreo ang “buwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Iyo
  rationale: Ang ל na may hulaping pangalawang panauhang panlalaki ay nagpapahayag ng pag-aari. Likas at mariing naipapahayag ito sa Filipino sa sugnay na “Iyo ang…”
- source_word: יוֹם
  choice: araw
  rationale: Karaniwang katumbas ng יוֹם at malinaw na katambal ng “gabi.”
- source_word: אַף
  choice: rin
  rationale: 'Idinaragdag nito nang may diin ang ikalawang sugnay: hindi lamang ang araw kundi pati ang gabi. Natural sa kasalukuyang Filipino ang “rin” sa ayos na ito.'
- source_word: לָיְלָה
  choice: gabi
  rationale: Karaniwang salin at tuwirang kasalungat ng “araw.”
- source_word: אַתָּה
  choice: Ikaw
  rationale: Pinananatili ang tahasang panghalip upang maihatid ang diin ng Hebreo bago ang pandiwa.
- source_word: הֲכִינוֹתָ
  choice: nagtatag
  rationale: Ang Hiphil ng כון ay tumutukoy sa pagtatakda, pagpapatatag, o paglalagay sa kaayusan. Ang “nagtatag” ay angkop sa konteksto ng pag-aayos ng sangnilikha.
- source_word: מָאוֹר
  choice: liwanag
  rationale: Maaaring tumukoy ang מָאוֹר sa liwanag o sa isang bagay na nagbibigay-liwanag. Ang “liwanag” ay nagpapanatili sa leksikal na saklaw nang hindi ipinapalagay na tahasang tinutukoy ang buwan.
- source_word: וָשָׁמֶשׁ
  choice: at ng araw
  rationale: Tuwirang isinasalin ang pangatnig at ang pangngalang שֶׁמֶשׁ. Ang “ng” ay inuulit upang malinaw na kapuwa layon ng “nagtatag” ang liwanag at ang araw.
theological_decisions:
- issue: Kahulugan ng מָאוֹר kaugnay ng שֶׁמֶשׁ
  choice: Isalin ang מָאוֹר bilang “liwanag” at panatilihin itong naiiba sa “araw.”
  alternative: Isalin bilang “buwan” batay sa pagkakatambal ng araw at gabi, o bilang “tanglaw.”
  rationale: Hindi tahasang sinasabi ng tekstong Hebreo ang “buwan.” Pinananatili ng “liwanag” ang tunay na leksikal na posibilidad at ang matulaing larawan nang hindi nilulutas sa salin ang ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad na ayos ng unang dalawang sugnay at ang diin sa “Ikaw.” Walang talababa sapagkat walang marker na kailangan sa pangunahing teksto; ang “liwanag” ang maingat na saling hindi labis na nagpapakahulugan.
