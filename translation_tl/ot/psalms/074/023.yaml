  text: Huwag mong kalimutan ang tinig ng iyong mga kaaway[a]; ang ingay ng mga bumabangon laban sa iyo ay patuloy na tumataas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunog ng iyong mga kaaway.” Ang Hebreong qol ay maaaring mangahulugang “tinig” o “tunog/ingay,” depende sa konteksto.
