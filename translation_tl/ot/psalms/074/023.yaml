lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: Huwag mong kalimutan
  rationale: 'Tuwirang pinananatili ang pakiusap na nasa anyong pagbabawal: huwag kalimutan o pabayaan sa pag-alaala.'
- source_word: קוֹל
  choice: tinig
  rationale: Karaniwang kahulugan ng קוֹל ang “tinig,” bagaman maaari rin itong tumukoy sa tunog o ingay; pinananatili ng “tinig” ang konkretong larawan at ang kaibahan nito sa kasunod na שְׁאוֹן.
- source_word: צֹרְרֶיךָ
  choice: iyong mga kaaway
  rationale: Natural at tuwirang salin ng pangmaramihang katawagan sa mga kumakalaban sa Diyos.
- source_word: שְׁאוֹן
  choice: ingay
  rationale: Tumutukoy ito sa malakas at magulong tunog o kaguluhan. Ang “ingay” ay malinaw sa karaniwang Filipino at likas na kaugnay ng pandiwang “pumapailanlang.”
- source_word: קָמֶיךָ
  choice: mga bumabangon laban sa iyo
  rationale: Pinananatili ang pandiwang larawan mula sa קום sa halip na payak na tawaging mga kalaban.
- source_word: עֹלֶה תָמִיד
  choice: ay patuloy na pumapailanlang
  rationale: Inihahatid ang larawan ng ingay na umaakyat o tumataas at ang tuloy-tuloy na diwa ng תָמִיד sa natural at marangal na Filipino.
