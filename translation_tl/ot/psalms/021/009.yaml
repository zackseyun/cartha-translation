source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: tl
  text: Gagawin mo silang tulad ng nagliliyab na pugon sa panahon ng iyong presensya[a]; lalamunin sila ni Yahweh sa kanyang galit, at tutupukin sila ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa panahon ng iyong pagpapakita”; literal, “sa panahon ng iyong mukha.”
    reason: Ipinapakita ang posibleng kahulugan ng פָּנֶיךָ at pinananatili ang literal na antropomorpikong larawan.
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Gagawin mo sila
  rationale: Ang שׁית ay maaaring mangahulugang ‘ilagay’ o ‘gawin.’ Dahil sinusundan ito ng paghahambing na כְּתַנּוּר אֵשׁ, likas sa Tagalog ang ‘gagawin mo sila’ upang ipahayag ang kalagayang sasapitin nila.
- source_word: כְּתַנּוּר אֵשׁ
  choice: tulad ng nagliliyab na pugon
  rationale: Ang תַּנּוּר ay pugon o hurnong matindi ang init. Pinananatili ng ‘nagliliyab na pugon’ ang larawan ng mapaminsalang apoy sa natural na Tagalog.
- source_word: לְעֵת פָּנֶיךָ
  choice: sa panahon ng iyong presensya
  rationale: Literal itong ‘sa panahon ng iyong mukha,’ ngunit ang פָּנִים dito ay maaaring tumukoy sa presensya o pagpapakita. Pinananatili ng ‘presensya’ ang kaugnayan sa banal na pagharap nang hindi ito nililimitahan sa isang teknikal na eskatolohikal na kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: בְּאַפּוֹ
  choice: sa kanyang galit
  rationale: Bagaman literal na nauugnay ang אַף sa ilong, karaniwan itong idyoma para sa galit. Malinaw at natural sa Tagalog ang ‘sa kanyang galit.’
- source_word: יְבַלְּעֵם
  choice: lalamunin sila
  rationale: Pinananatili ng ‘lalamunin’ ang matingkad na metapora ng בלע at inihihiwalay ito sa kasunod na pagkilos ng apoy.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: at tutupukin sila ng apoy
  rationale: Ang ‘tutupukin’ ay likas na paglalarawan sa ganap na pagwasak ng apoy at maayos na nagpapahayag sa idiomatikong diwa ng אכל.
theological_decisions:
- issue: Antropomorpikong pahayag na ‘sa panahon ng iyong mukha’
  choice: sa panahon ng iyong presensya
  alternative: sa panahon ng iyong pagpapakita; literal, sa panahon ng iyong mukha
  rationale: Ipinahihiwatig ng Hebreo ang presensya o pagpapakita, ngunit hindi tiyak kung alin ang dapat idiin. Pinananatili sa talababa ang tunay na saklaw at literal na larawan.
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton at hindi ito pinapalitan ng titulo.
- issue: Pagbabago ng tinutukoy na gumagawa sa talata
  choice: Pinanatili ang ‘mo’ sa unang sugnay at tahasang ‘Yahweh’ sa ikalawa
  alternative: Ipagpalagay na iisa ang tuwirang simuno sa buong talata
  rationale: 'Ganito ang sintaks ng tekstong Hebreo: ang unang kilos ay nasa ikalawang panauhan, samantalang tahasang pinangalanan si Yahweh bilang gumagawa sa kasunod na sugnay. Hindi nilulutas nang lampas sa teksto ang kaugnayan ng dalawa.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘pugon,’ ‘lalamunin,’ at ‘tutupukin’ upang mapanatili ang matitingkad na larawan ng Hebreo nang hindi nagiging lipas o labis na literal.
