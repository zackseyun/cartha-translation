reference: Psalms 21:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: tl
  text: 'Sapagkat nagtitiwala ang hari kay Yahweh,

    at dahil sa tapat na pag-ibig ng Kataas-taasan[a], hindi siya matitinag.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tapat na pag-ibig ng Kataas-taasan.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang paraan o ang kalagayang kinaroroonan; ang “tapat na pag-ibig” ay maaari ring isaling “katapatan sa tipan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi siya mauuga” o “hindi siya susuray.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang nagbibigay ng batayan o paliwanag sa naunang pahayag.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang katumbas ng tiyak na pangngalang tumutukoy sa maharlikang tauhan sa salmo.
- source_word: בֹּטֵחַ
  choice: nagtitiwala
  rationale: Ang Qal participle ay nagpapahayag ng patuloy o kinagawiang pagtitiwala; natural itong sabihin sa makabagong Tagalog.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay tumutukoy sa pinag-uukulan ng pagtitiwala, at pinananatili ang personal na banal na pangalang יהוה bilang Yahweh.
- source_word: וּבְחֶסֶד
  choice: at dahil sa tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig; ang בְּ ay inuunawang instrumental o sanhi sa kaugnayan nito sa kasunod na sugnay.
- source_word: עֶלְיוֹן
  choice: ng Kataas-taasan
  rationale: Likas at marangal na katumbas sa Tagalog ng banal na titulong 'Most High.'
- source_word: בַּל יִמּוֹט
  choice: hindi siya matitinag
  rationale: Pinananatili nito ang metapora ng katatagan at malinaw na ipinahahayag ang negasyon sa natural na Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng וּבְחֶסֶד עֶלְיוֹן
  choice: dahil sa tapat na pag-ibig ng Kataas-taasan
  alternative: sa tapat na pag-ibig ng Kataas-taasan
  rationale: Malamang na instrumental o sanhi ang pang-ukol, ngunit maaari rin itong unawaing lokatibo; pinananatili sa talababa ang tunay na gramatikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'matitinag' upang mapanatili ang matalinghagang larawan ng katatagan, at 'tapat na pag-ibig' bilang madaling maunawaang salin ng חֶסֶד nang hindi inaalis ang dimensiyon ng katapatan sa tipan.
