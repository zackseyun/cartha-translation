lexical_decisions:
- source_word: גָּדוֹל
  choice: Dakila
  rationale: Nasa unahan ang panaguring pang-uri upang bigyang-diin ang kadakilaan; natural at marangal ang “Dakila” sa tulang Filipino.
- source_word: כְּבוֹדוֹ
  choice: ang kanyang kaluwalhatian
  rationale: Ang כָּבוֹד ay maaaring tumukoy sa kaluwalhatian o karangalan; ang “kaluwalhatian” ay angkop sa maharlikang konteksto at pinananatili ang mataas na himig.
- source_word: בִּישׁוּעָתֶךָ
  choice: sa pamamagitan ng pagliligtas mo
  rationale: Ipinahahayag nito ang pagliligtas ng Diyos bilang paraan o sanhi ng kadakilaan ng hari, habang hindi inaalis ang posibilidad na saklaw nito ang tagumpay.
- source_word: הוֹד
  choice: karilagan
  rationale: Tumutukoy ang הוֹד sa maringal na ningning o kagandahang-hari; naiiba ito sa kasunod na “kamahalan.”
- source_word: וְהָדָר
  choice: at kamahalan
  rationale: Sa tambalan nito sa הוֹד, ang הָדָר ay nagpapahayag ng maharlikang dangal at maringal na anyo.
- source_word: תְּשַׁוֶּה
  choice: ipinagkakaloob mo
  rationale: Bagaman literal na maaaring “inilalagay mo,” natural na ipinahahayag ng “ipinagkakaloob” ang pagbibigay o paggawad ng karangalang maharlika.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Natural na katumbas sa Filipino sa konstruksiyong “ipinagkakaloob mo sa kanya.”
theological_decisions:
- issue: Kahulugan ng יְשׁוּעָה sa isang maharlikang awit
  choice: pagliligtas
