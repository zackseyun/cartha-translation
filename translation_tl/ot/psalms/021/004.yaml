    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: buhay
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwan itong abstraktong pangngalang isahan na nangangahulugang “buhay.” Hindi isinama rito ang diwang “mahaba” sapagkat ipinapahayag iyon sa kasunod na parirala.
- source_word: שָׁאַל מִמְּךָ
  choice: humingi siya sa iyo
  rationale: Likas sa modernong Tagalog ang “humingi … sa iyo” para sa paghiling na ang hinihingi ay magmumula sa Diyos.
- source_word: נָתַתָּה לּוֹ
  choice: ibinigay mo iyon sa kanya
  rationale: Tumutukoy ang “iyon” sa buhay na hiniling at ginagawang malinaw sa Tagalog ang ipinagkaloob.
- source_word: אֹרֶךְ יָמִים
  choice: haba ng mga araw
  rationale: Pinananatili nito ang matalinghagang Hebreong parirala at ang pagkakaiba nito sa naunang “buhay,” sa halip na pagsamahin ang dalawa bilang “mahabang buhay.”
- source_word: עוֹלָם וָעֶד
  choice: magpakailanman at walang hanggan
  rationale: Ipinahahayag nito ang pinatinding, walang takdang tagal ng magkatambal na pananalita sa Hebreo.
theological_decisions:
- issue: Saklaw ng ipinangakong buhay ng hari sa isang maharlikang awit
  choice: Panatilihin sa pangunahing teksto ang tuwirang diwa ng walang hanggang tagal.
  alternative: Unawain ito bilang maharlikang pagmamalabis tungkol sa mahabang buhay at paghahari, o bilang pananalitang lubos na natutupad sa Mesiyas.
  rationale: Hindi nilulutas ng salin kung ang pahayag ay pagmamalabis na patula tungkol sa haring mula kay David o may ganap na katuparan sa Mesiyas; pinananatili nito ang teolohikal na tensiyon ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikli at patulang pagkakahanay ng dalawang sugnay, pati ang Hebreong larawang “haba ng mga araw.”
