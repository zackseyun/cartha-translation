translation:
  language: tl
  text: Humingi siya sa iyo ng buhay; ibinigay mo ito sa kanya—haba ng mga araw, magpakailanman at magpasawalang hanggan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahabang buhay”; literal na “haba ng mga araw.”
    reason: lexical_alternative
  - marker: b
