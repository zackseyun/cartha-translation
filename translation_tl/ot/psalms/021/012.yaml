translation:
  language: tl
  text: Sapagkat patatalikurin mo sila;[a] sa pamamagitan ng iyong mga bagting, tututukan mo ang kanilang mga mukha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ilalagay mo sila bilang balikat.” Malamang na ibig sabihin ng idyomang Hebreo ay patatalikurin sila sa pag-urong, bagaman maaari rin itong maglarawan sa paghaharap ng kanilang balikat bilang tudlaan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Sa iyong mga pisi ay maghahanda ka laban sa kanilang mga mukha.” Masinsin at pinaikli ang larawang Hebreo; ipinahihiwatig ng konteksto ang mga bagting ng pana at ang pagtutok dito.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang batayan ng naunang pahayag; natural sa daloy ng salmo ang “Sapagkat.”
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: patatalikurin mo sila
  rationale: Literal na larawan nito ang paglalagay sa kanila bilang “balikat,” ngunit malamang na idyoma ito ng pagtalikod o pag-urong. Inihahatid ng salin ang diwa nang hindi nawawala ang larawang militar.
- source_word: בְּמֵיתָרֶיךָ
  choice: ang iyong mga bagting
  rationale: Ang מֵיתָר ay lubid o pisi; sa kontekstong pandigma, tumutukoy ito sa mga bagting ng pana. Ang “bagting” ay maikli, dignified, at malinaw sa Filipino.
- source_word: תְּכוֹנֵן
  choice: itututok mo
  rationale: Ang pandiwa ay maaaring mangahulugang ihanda o itatag; sa konteksto ng bagting at mukha ng mga kaaway, ang paghahanda ay ang pagtutok. Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: עַל־פְּנֵיהֶם
  choice: sa kanilang mga mukha
  rationale: Pinananatili ang matingkad at tuwirang larawan ng Hebrew na nakatuon laban sa kanilang mga mukha.
