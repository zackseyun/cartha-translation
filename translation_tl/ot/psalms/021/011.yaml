  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: tl
  text: Sapagkat nagbalak sila ng masama laban sa iyo[a]; bumuo sila ng isang pakana[b], ngunit hindi nila iyon maisagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iniunat” o “itinuon nila ang masama laban sa iyo.” Ipinahihiwatig ng idyomang Hebreo na naglayon sila ng masama laban sa iyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “nag-isip sila ng isang balak, ngunit hindi nila ito maisagawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng dahilan para sa naunang pahayag sa awit.
- source_word: נָטוּ
  choice: nagbalak
  rationale: Bagaman literal itong nangangahulugang “iniunat” o “itinuon,” kasama ng רָעָה at עַל ay ipinahihiwatig nito ang masamang layuning nakatuon laban sa isang tao.
- source_word: עָלֶיךָ
  choice: laban sa iyo
  rationale: Sa konteksto ng masamang hangarin, malinaw at natural na ipinapahayag ng “laban sa” ang mapanlabang diwa ng pang-ukol.
- source_word: רָעָה
  choice: masama
  rationale: Tumutukoy ito rito sa masamang layunin, hindi lamang sa pinsala o sakuna, kaya napapanatili ang moral na bigat ng salita.
- source_word: חָשְׁבוּ
  choice: bumuo
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa sinadyang pag-iisip o pagdidisenyo ng isang plano; natural sa Filipino ang “bumuo ng isang pakana.”
- source_word: מְזִמָּה
  choice: isang pakana
  rationale: Ang salita ay maaaring mangahulugang plano o balak, at sa kontekstong ito ay may negatibong diwa ng tusong pagpaplano.
- source_word: בַּל
  choice: ngunit hindi
  rationale: Ang patulang katagang pananggi ay isinalin kasama ng “ngunit” upang maipakita ang kaibahan sa pagitan ng kanilang pakana at ng kabiguan nilang maisagawa iyon.
- source_word: יוּכָלוּ
  choice: nila iyon maisagawa
  rationale: Pangunahing ipinahihiwatig ng pandiwa ang kawalan ng kakayahan. Ang “iyon” ay tumutukoy sa naunang pakana at likas na nililinaw sa Filipino ang di-tahasang layon.
