translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakana” upang mapanatili ang negatibo at tusong diwa ng מְזִמָּה, habang iniiwasan ang labis na teknikal o lipas na pananalita.
