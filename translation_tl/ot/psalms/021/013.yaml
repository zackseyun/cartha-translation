  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: tl
  text: Magpakataas ka[a], Yahweh, sa iyong lakas! Aawit kami at tutugtog bilang papuri sa iyong kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bumangon ka, Yahweh, sa iyong lakas.” Maaaring unawain ang pandiwang Hebreo bilang panawagan sa Diyos na bumangon o magpakataas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Itaas mo ang iyong sarili
  rationale: Ang anyo mula sa רום ay isang pakiusap o panawagan sa Diyos na magpakitang mataas at dakila. Pinananatili ng salin ang aktibong anyo at ang maaaring kahulugang “bumangon,” na inilalagay sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang banal, hindi pinapalitan ng titulong “PANGINOON.”
- source_word: בְּעֻזֶּךָ
  choice: sa iyong lakas
  rationale: Ang בְּ ay maaaring tumukoy sa saklaw o paraan; ang “sa iyong lakas” ay malapit sa Hebreo at likas sa konteksto ng pagpupuri.
- source_word: נָשִׁירָה
  choice: Aawit kami
  rationale: Ang cohortative na unang panauhang maramihan ay nagpapahayag ng kusang pagpapasya o paanyaya; dito ay natural itong pahayag ng determinasyong sumamba.
- source_word: וּנְזַמְּרָה
  choice: at tutugtog bilang papuri
  rationale: Ang זמר ay tumutukoy sa paggawa ng musika o pag-awit ng papuri. Ipinakikita ng “tutugtog bilang papuri” ang musikal na diwa nang hindi inuulit lamang ang “aawit.”
- source_word: גְּבוּרָתֶךָ
  choice: iyong kapangyarihan
  rationale: Ang גְּבוּרָה ay lakas, kapangyarihan, o makapangyarihang gawa. Ginamit ang “kapangyarihan” upang mapanatili ang bahagyang pagkakaiba nito sa עֹז na isinaling “lakas.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng utos na רוּמָה
  choice: Itaas mo ang iyong sarili
  alternative: Bumangon ka
  rationale: Maaaring magpahiwatig ang pandiwa ng pagbangon o pagdakila. Pinipili ng pangunahing teksto ang diwa ng pagpapakitang dakila sa konteksto ng papuri, habang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang tuwirang pakikipag-usap sa Diyos at malinaw na paralelismong patula. Ang “bilang papuri sa” ay likas na Filipino para ipahayag na ang kapangyarihan ng Diyos ang paksa ng awit at tugtog, habang hindi ipinapalagay na ang abstraktong “kapangyarihan” ang tumatanggap ng musika.
