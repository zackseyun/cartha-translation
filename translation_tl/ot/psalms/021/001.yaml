  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: tl
  text: Yahweh, nagagalak ang hari sa iyong lakas; labis siyang nagbubunyi sa iyong pagliligtas![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “kaligtasan” o “tagumpay” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalan ng Diyos; gamit ito rito bilang pantawag kaya natural na inilalagay sa simula na may kuwit.
- source_word: בְּעָזְּךָ
  choice: sa iyong lakas
  rationale: Pinananatili ang larawan ng lakas ng Diyos bilang saligan o saklaw ng kagalakan ng hari; natural ito sa makabagong Tagalog.
- source_word: יִשְׂמַח
  choice: nagagalak
  rationale: Maaaring kasalukuyan o pangkalahatang diwa ang poetic yiqtol; hindi ito sapilitang nililimitahan sa hinaharap.
- source_word: מֶלֶךְ
  choice: ang hari
  rationale: Bagaman walang artikulo sa Hebreo, tiyak ang tinutukoy na hari ayon sa konteksto.
- source_word: וּבִישׁוּעָתְךָ
  choice: sa iyong pagliligtas
  rationale: Ang יְשׁוּעָה ay maaaring tumukoy sa kaligtasan, pagliligtas, o tagumpay. Pinili ang 'pagliligtas' bilang malinaw at likas na paglalarawan ng gawa ng Diyos, habang inilalahad sa talababa ang saklaw ng salita.
- source_word: מַה ... מְאֹד
  choice: labis
  rationale: Magkasamang nagbibigay ang mga ito ng mariing padamdam; natural na naihahatid ng 'labis' ang antas nang hindi mabigat ang pahayag.
- source_word: יגיל
  choice: nagbubunyi
  rationale: Ipinakikita ang mas masiglang uri ng kagalakan at pinananatili ang pagkakaiba nito sa naunang שׂמח.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang sariling pangalan. Pinananatili ang 'Yahweh' nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng יְשׁוּעָה
  choice: pagliligtas
  alternative: kaligtasan; tagumpay
  rationale: Hindi nililimitahan ng konteksto ang salita sa isang sistematikong teolohikal na kahulugan; maaaring kabilang dito ang pagliligtas at tagumpay. Kaya pinili ang natural na pangunahing salin at pinanatili sa talababa ang mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang dalawang magkatulad ngunit hindi magkaparehong pandiwa ng kagalakan sa pamamagitan ng “nagagalak” at “nagbubunyi.”
