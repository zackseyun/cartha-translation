    Selah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pakiusap ng kanyang mga labi.” Ang bihirang salitang Hebreo na וַאֲרֶשֶׁת ay malamang na tumutukoy sa isang binigkas na kahilingan, na kaagapay ng “hangarin ng kanyang puso.”
    reason: lexical_alternative
  - marker: b
