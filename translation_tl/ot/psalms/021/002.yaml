lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: ang hangarin ng kanyang puso
  rationale: Tuwirang ipinapahayag nito ang panloob na pagnanais na tinutukoy ng pariralang Hebreo, sa natural at marangal na modernong Tagalog.
- source_word: נָתַתָּה לּוֹ
  choice: Ibinigay mo sa kanya
  rationale: Ang ganap na pandiwa ay angkop isalin bilang natapos na kilos sa konteksto ng awit ng pasasalamat.
- source_word: וַאֲרֶשֶׁת
  choice: ang kahilingan
  rationale: Ang bihirang pangngalang Hebreo ay malamang na tumutukoy sa isang binigkas na hiling o pakiusap, na kapantay ng panloob na hangarin sa unang taludtod.
- source_word: שְׂפָתָיו
  choice: ng kanyang mga labi
  rationale: Pinananatili nito ang konkretong larawang Hebreo ng kahilingang binibigkas ng mga labi.
- source_word: בַּל מָנַעְתָּ
  choice: hindi mo ipinagkait
  rationale: Natural at eksaktong ipinapahayag ng parirala ang hindi pagpigil o pagkakait sa hiniling.
- source_word: סֶּלָה
  choice: Selah
  rationale: Pinanatili bilang transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan o tungkulin nito.
