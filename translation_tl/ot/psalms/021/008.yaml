  text: Aabutin ng iyong kamay ang lahat ng iyong mga kaaway[a]; aabutin ng iyong kanang kamay ang mga napopoot sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “makasusumpong” o “makatatagpo.” Ang Hebreong pandiwa ay karaniwang nangangahulugang “makasusumpong” o “makatatagpo,” ngunit sa kontekstong ito ay maaaring magpahiwatig ng matagumpay na pag-abot o pagdakip sa mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: aabutin
  rationale: Karaniwang nangangahulugang “masusumpungan” ang מצא, ngunit sa kontekstong pandigmaan ay ipinahihiwatig nito ang matagumpay na pag-abot o pagdakip sa mga kaaway. Ang “aabutin” ay natural sa modernong Tagalog at pinananatili ang pahiwatig na hindi sila makatatakas.
- source_word: יָדְךָ
  choice: iyong kamay
  rationale: Pinananatili ang kongkretong larawan ng kamay bilang instrumento ng kapangyarihan at pagkilos ng haring tuwirang kinakausap.
- source_word: לְכָל
  choice: ang lahat ng
  rationale: Inihahayag nito ang komprehensibong saklaw ng כֹּל sa natural na Tagalog.
- source_word: אֹיְבֶיךָ
  choice: iyong mga kaaway
  rationale: Tuwirang salin ng pangngalan at ng hulaping ikalawang panauhang panlalaki na isahan.
- source_word: יְמִינְךָ
  choice: iyong kanang kamay
  rationale: Pinananatili ang paralelismo at ang tradisyonal na larawan ng lakas at matagumpay na pagkilos na kaugnay ng kanang kamay.
- source_word: שֹׂנְאֶיךָ
  choice: ang mga napopoot sa iyo
  rationale: Pinananatili ang pandiwang diwa ng Hebreong participle sa halip na gawin lamang itong isa pang katawagan para sa “mga kaaway.”
theological_decisions:
- issue: Antropomorpikong larawan ng kapangyarihan ng Diyos o ng hari sa isang maharlikang salmo
  choice: Pinanatili ang “kamay” at “kanang kamay.”
  alternative: Ang iyong kapangyarihan ay aabot sa lahat ng iyong mga kaaway.
  rationale: Mahalaga sa tula at teolohiya ang kongkretong larawan ng Hebreo. Hindi ito ginawang abstraktong “kapangyarihan” upang mapanatili ang paralelismo at hindi paunang pagpasiyahan kung paano iuugnay ang pagkilos ng hari at ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “aabutin” upang maging natural ang larawang pandigmaan, habang ipinaliliwanag sa talababa ang literal na diwang “masusumpungan.”
