lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng Mga Awit, tumutukoy ang salita sa taong namumuno o nangangasiwa sa pagtatanghal ng musika. Ipinahihiwatig ng “Para sa” ang gamit ng unlaping ל bilang patutunguhan o paglalaan.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang tawag ito sa isang awit na may kaugnayan sa musika; ang “salmo” ang malinaw at kinikilalang katumbas sa ganitong pamagat.
- source_word: לְדָוִד
  choice: ni David
  rationale: Maaaring magpahiwatig ang ל ng pagkatha, kaugnayan, pagmamay-ari, o pag-aalay. Likas sa Filipino ang “ni David” at hindi nito tahasang nililimitahan ang parirala sa iisang posibilidad.
theological_decisions:
- issue: Kahulugan ng pamagat na nag-uugnay kay David
  choice: ni David
  alternative: akda ni David; para kay David
  rationale: Malawak ang gamit ng Hebreong לְדָוִד. Pinananatili ng salin at talababa ang posibilidad ng pagkatha, kaugnayan, o pag-aalay sa halip na igiit ang isa lamang.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “tagapangasiwa ng musika” ay madaling maunawaan at hindi ipinapalagay na koro lamang ang pinamumunuan. Inilagay ang [a] pagkaraan ng “David” sapagkat doon tumutukoy ang talababa.
