translation:
  language: tl
  text: Para sa tagapangasiwa ng musika. Isang salmo ni David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “akda ni David” o “para kay David”; maaaring tumukoy ang Hebreong pamagat sa pagkatha, kaugnayan, o pag-aalay.
