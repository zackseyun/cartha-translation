  source_fidelity: 'Tapat ang salin sa tatlong bahagi ng Hebreong pamagat: ang לַמְנַצֵּחַ ay wastong isinaling “Para sa tagapangasiwa ng musika,” ang מִזְמוֹר bilang “Isang salmo,” at ang לְדָוִד bilang “ni David.” Hindi nito ipinipilit na si David ang tiyak na may-akda, at ang talababa ay naaangkop na nagpapaliwanag ng lawak ng kahulugan ng Hebreong parirala.'
