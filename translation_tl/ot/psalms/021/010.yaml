translation:
  language: tl
  text: 'Lilipulin mo mula sa lupa ang kanilang bunga,

    at ang kanilang mga supling mula sa sangkatauhan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa mga anak ng tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: kanilang bunga
  rationale: Pinananatili ng “bunga” ang kongkretong talinghaga ng Hebreong פְּרִי, na sa kontekstong ito ay tumutukoy sa mga inapo at kaagapay ng “kanilang lahi” sa ikalawang linya.
- source_word: מֵאֶרֶץ
  choice: sa lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ na “lupa” o “lupain.” Ang “sa lupa” ay natural sa Filipino at nagpapanatili ng malawak na saklaw ng hatol, nang hindi ito nililimitahan sa isang tiyak na teritoryo.
- source_word: תְּאַבֵּד
  choice: lilipulin mo
  rationale: Ang Piel ng אבד ay nagsasaad ng aktibong pagwasak o pagpuksa. Ang “lilipulin mo” ay tuwiran, marangal, at angkop sa matinding hatol ng taludtod.
- source_word: וְזַרְעָם
  choice: at ang kanilang lahi
  rationale: Ang זֶרַע ay literal na “binhi” ngunit karaniwang tumutukoy sa supling o mga inapo. Ang “lahi” rito ay likas na katumbas sa Filipino at saklaw ang salinlahing nagmumula sa kanila.
- source_word: מִבְּנֵי אָדָם
  choice: mula sa sangkatauhan
  rationale: Ang בְּנֵי אָדָם ay isang Hebreong idyoma para sa mga tao o sangkatauhan. Isinasalin ito ayon sa tunay na generic na kahulugan nito sa natural na modernong Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa בְּנֵי אָדָם
  choice: sangkatauhan
  alternative: mga anak ng tao
  rationale: Bagaman literal na “mga anak ng tao,” generic ang parirala para sa kabuuan ng mga tao. Ang “sangkatauhan” ay tumpak at malinaw sa Filipino, samantalang inilalagay sa talababa ang literal na anyo upang mapanatili ang Hebreong larawang pampanitikan.
translation_notes:
  register: Makabago at marangal na Filipino na may anyong patula. Pinanatili ang talinghagang “bunga,” habang ginawang malinaw ang idyomang Hebreo sa ikalawang linya. Ang “lilipulin” ay nagpapahayag ng buong tindi ng pandiwang Piel.
