  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: tl
  text: Sapagkat ginagawa mo siyang puspos ng mga pagpapala magpakailanman[a]; pinupuno mo siya ng kagalakan sa iyong presensya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “ipinapatong mo sa kanya ang mga pagpapala magpakailanman,” o “ginagawa mo siyang pagpapala magpakailanman.” Maikli at maaaring magkaroon ng higit sa isang diwa ang pananalitang Hebreo: maaaring tumukoy ito sa mga pagpapalang ipinagkaloob sa hari o sa pagiging bukal ng pagpapala niya mismo.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o batayan ng naunang papuri; likas at marangal itong panandang sanhi sa Filipino.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: ginagawa mo siyang puspos ng mga pagpapala
  rationale: Ang literal na anyong “ginagawa mo siyang mga pagpapala” ay hindi likas sa Filipino. Napananatili ng “puspos ng mga pagpapala” ang maramihan at ang diwa ng saganang pagpapala, habang inilalahad sa talababa ang tunay na ambiguwidad kung ang mga pagpapala ay ipinagkakaloob sa hari o siya mismo ay ginagawang pagpapala.
- source_word: לָעַד
  choice: magpakailanman
  rationale: Karaniwan, malinaw, at marangal na katumbas ng walang hanggang tagal.
- source_word: תְּחַדֵּהוּ
  choice: pinupuno mo siya ng kagalakan
  rationale: Likas na Filipino para sa causative na diwang “pinagagalak mo siya”; kasabay nitong naipahahayag ang tahasang pangngalang שִׂמְחָה.
- source_word: בְשִׂמְחָה
  choice: ng kagalakan
  rationale: Pinananatili ang tahasang ideya ng galak sa isang natural na pariralang Filipino.
- source_word: אֶת־פָּנֶיךָ
  choice: sa iyong presensya
  rationale: Ang literal na “kasama/sa iyong mukha” ay idyoma para sa pagiging nasa harapan ng Diyos; “sa iyong presensya” ang malinaw at likas na katumbas.
theological_decisions:
- issue: Kahulugan ng תְשִׁיתֵהוּ בְרָכוֹת (“ginagawa mo siyang mga pagpapala”)
  choice: Inilalarawan ang hari bilang puspos ng saganang pagpapala, habang pinananatili sa talababa ang posibilidad na siya mismo ay ginagawang pagpapala.
  alternative: “Ipinapatong mo sa kanya ang mga pagpapala magpakailanman” o “ginagawa mo siyang pagpapala magpakailanman.”
  rationale: Maikli at di-pangkaraniwan ang Hebreong pananalita. Maaaring tumukoy ito sa mga pagpapalang ipinagkaloob sa hari o sa pagiging bukal o sagisag niya ng pagpapala. Hindi ito nililimitahan sa materyal lamang o sa isang tiyak na denominasyonal na pagbasa.
translation_notes:
  register: Makabago at dignified na Filipino, na mauunawaan ng karaniwang mambabasa. Iniwasan ang di-likas na literalismong “ginagawa mo siyang mga pagpapala,” ngunit pinanatili sa talababa ang mahalagang ambiguwidad ng Hebreo.
