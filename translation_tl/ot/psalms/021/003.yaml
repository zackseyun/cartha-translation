  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: tl
  text: Sapagkat sinasalubong mo siya[a] nang may mga mabubuting pagpapala; ipinapatong mo sa ulo niya ang koronang dalisay na ginto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nauuna ka sa kanya” o “pumaparoon ka upang salubungin siya.” Maaaring tumukoy ang pandiwang Hebreo sa pagsalubong o sa pag-una sa isang tao.
    reason: lexical_alternative
  - marker: b
