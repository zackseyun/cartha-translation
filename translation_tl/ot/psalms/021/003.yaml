    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag sa daloy ng awit.
- source_word: תְקַדְּמֶנּוּ
  choice: sinasalubong mo siya
  rationale: Ang Piel ng קדם ay maaaring mangahulugang humarap o sumalubong, na may pahiwatig ng pagkilos nang una. Likas sa Tagalog ang “sinasalubong” at pinananatili nito ang pagkukusa ng Diyos.
- source_word: בִּרְכוֹת טוֹב
  choice: ng mabubuting pagpapala
  rationale: Pinananatili ang maramihang “mga pagpapala” at ang malawak na diwa ng טוֹב nang hindi nililimitahan ang mga ito sa materyal na kasaganaan o sa isang tiyak na uri ng pagpapala.
- source_word: תָּשִׁית
  choice: ipinapatong mo
  rationale: Ang pandiwa ay nangangahulugang maglagay o magtakda; sa konteksto ng korona at ulo, “ipinapatong” ang pinakanatural na katumbas sa Tagalog.
- source_word: לְרֹאשׁוֹ
  choice: sa ulo niya
  rationale: 'Bagaman ל ang pang-ukol, sa pandiwa ng paglalagay ay natural itong tumutukoy sa kinalalagyan: “sa ulo niya.”'
- source_word: עֲטֶרֶת
  choice: ang korona
  rationale: Sa konteksto ng awit tungkol sa hari, malinaw na naihahatid ng “korona” ang maharlikang diwa ng salita.
- source_word: פָּז
  choice: dalisay na ginto
  rationale: Tumutukoy ang פָּז sa mataas na uri o pinong ginto. Dignified at madaling maunawaan ang “dalisay na ginto,” habang ang talababa ay nagpapanatili ng iba pang posibleng paglalarawan.
theological_decisions:
- issue: Uri ng mga pagpapalang ipinagkakaloob sa hari
  choice: Panatilihing malawak ang pariralang “mabubuting pagpapala” bilang pagpapala at kagandahang-loob ng Diyos.
  alternative: Tukuyin ang mga ito bilang materyal na kasaganaan lamang o bilang natatanging espirituwal/pangtipang mga pagpapala.
  rationale: Hindi nililinaw ng Hebreo kung materyal, espirituwal, o pangtipan ang tinutukoy. Hindi dapat paliitin ng salin ang sadyang malawak na diwa.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang natural na “mabubuting pagpapala” sa halip na literal ngunit alanganing “mga pagpapala ng kabutihan,” at pinanatili sa talababa ang leksikal na lawak ng pangunahing mga salita.
