base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: tl
  text: Ikaw ay babangon at mahahabag sa Sion, sapagkat panahon na upang pagpakitaan siya ng lingap[a], sapagkat dumating na ang takdang panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang pagpakitaan siya ng pabor” o “upang maging mapagbiyaya sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “sumapit na ang panahong itinakda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקוּם
  choice: babangon
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki ay nagsasaad dito ng inaasahang pagkilos ng Diyos. Pinananatili ng “babangon” ang matingkad na larawang antropomorpiko.
- source_word: תְּרַחֵם
  choice: mahahabag
  rationale: Ang Piel imperfect ng רחם ay nangangahulugang magpakita ng habag o awa. Ang “mahahabag” ay natural at marangal sa modernong Tagalog.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Pinananatili ang pangalang pantangi sa halip na ipakahulugang Jerusalem o bayan ng Diyos, upang huwag paliitin ang saklaw ng teksto.
- source_word: כִּי
  choice: sapagkat; [implicit punctuation in second clause]
  rationale: Sa unang gamit, ipinakikita ng “sapagkat” ang batayan ng naunang pahayag. Sa ikalawa, ang tuldok-kuwit at tuwirang kasunod na sugnay ay natural na naghahayag ng karagdagang dahilan sa Tagalog nang hindi inuulit nang alanganin ang pangatnig.
- source_word: עֵת
  choice: panahon na
  rationale: Likas sa Tagalog ang pariralang ito para sa pagdating ng isang tiyak at mahalagang sandali.
- source_word: לְחֶנְנָהּ
  choice: upang kahabagan siya
  rationale: Ang infinitive construct ng חנן na may hulaping 3fs ay tumutukoy sa Sion. Dito, ang “kahabagan” ay malinaw at umaayon sa paralelismo, bagaman maaaring mas tiyak na isalin itong “pagpakitaan siya ng biyaya.”
- source_word: בָא
  choice: dumating na
  rationale: Ang perfect ng בוא ay nagpapahayag na ang takdang panahon ay sumapit na at may kasalukuyang kabuluhan.
- source_word: מוֹעֵד
  choice: takdang panahon
  rationale: Ipinahihiwatig ng מוֹעֵד ang panahong itinakda o itinalaga. Ang “takdang panahon” ay malinaw at karaniwan sa modernong Tagalog.
theological_decisions:
- issue: Kung isasalin nang konkreto o interpretatibo ang Sion
  choice: Panatilihin ang “Sion” bilang tahasang layon ng habag ng Diyos.
  alternative: Jerusalem; bayan ng Diyos
  rationale: Sion mismo ang pinangalanan sa Hebreo. Hinahayaan nitong manggaling sa konteksto ang mas malawak na kahulugang teolohikal sa halip na ipasok iyon sa salin.
- issue: Ugnayan ng רחם at חנן
  choice: Gamitin ang “mahahabag” at “kahabagan” sa pangunahing teksto, ngunit itala ang leksikal na kaibhan sa talababa.
  alternative: “mahahabag ... pagpakitaan siya ng biyaya”
  rationale: 'Magkaugnay ang dalawang konsepto ngunit hindi ganap na magkapareho: רחם ay habag, samantalang חנן ay mapagbiyayang paglingap o pagpapakita ng pabor. Pinananatili ng talababa ang kaibhang ito nang hindi ginagawang mabigat ang pangunahing linya.'
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at panalanging himig. Ginamit ang “Sion,” ang nakaugaliang anyong Tagalog ng pangalan. Ang ayos ng pangungusap ay malapit sa Hebreo ngunit nananatiling natural basahin; pinananatili rin ang dalawang magkaugnay na pahayag tungkol sa panahon.
