  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: tl
  text: 'Dahil sa iyong matinding galit at poot,

    sapagkat itinaas mo ako at itinapon mo ako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at inihagis mo ako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: Dahil sa
  rationale: Ang pariralang מִפְּנֵי ay ginagamit dito bilang panandang sanhi, hindi bilang paglalarawan ng kinalalagyan.
- source_word: זַעַמְךָ
  choice: iyong matinding galit
  rationale: Ipinahahayag ng זַעַם ang matindi at nag-aalab na galit; nilinaw ng “matinding” ang lakas nito habang nananatiling natural sa makabagong Filipino.
- source_word: וְקִצְפֶּךָ
  choice: at poot
  rationale: Pinananatili ng “poot” ang ikalawang salita para sa galit bilang hiwalay ngunit kaugnay na kataga, sa halip na pagsamahin ang dalawang terminong Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang paliwanag o batayan ng kalagayang inilalarawan ng mang-aawit.
- source_word: נְשָׂאתַנִי
  choice: itinaas mo ako
  rationale: Bagaman maaaring mangahulugang ‘buhatin’ o ‘dalhin’ ang נשׂא, ang “itinaas” ay malinaw na kaagapay ng kasunod na larawan ng pagtatapon.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: at itinapon
  rationale: Ang שלך ay nangangahulugang ihagis o itapon. Ang “itinapon” ay likas sa Filipino at naipahihiwatig kapuwa ang marahas na kilos at ang pagtatakwil.
theological_decisions:
- issue: Paglalarawan sa galit ng Diyos
  choice: Pinanatili ang dalawang magkaugnay ngunit magkaibang katawagan bilang “matinding galit at poot.”
  alternative: Pagsamahin ang dalawa sa iisang salitang “galit,” o hinaan ang tindi ng pahayag.
  rationale: Dalawang magkahiwalay na terminong Hebreo ang ginamit, kaya pinananatili ang tindi at paralelismong patula nang hindi nagdaragdag ng paliwanag na teolohikal.
- issue: Larawan ng pagtataas at pagtatapon
  choice: Pinanatili ang tuwirang pahayag na ang Diyos ang nagtaas at nagtapon sa mang-aawit.
  alternative: Ipaliwanag ito bilang isang tiyak na doktrina tungkol sa paghatol o pagtalikod ng Diyos.
  rationale: Matalim at hindi lubusang ipinaliliwanag ng talata ang larawang ito; dapat panatilihin ng salin ang tensiyon nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang maigsi at matinding paralelismong patula ng Hebreo. Ang “itinapon” ay mas natural sa karaniwang mambabasa, samantalang inilagay sa talababa ang mas literal at marahas na alternatibong “inihagis.”
