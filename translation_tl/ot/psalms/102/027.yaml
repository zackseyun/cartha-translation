  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: tl
  text: Ngunit ikaw ay hindi nagbabago[a], at ang iyong mga taon ay hindi magwawakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ikaw ay siya,” isang idyomang maaari ring mangahulugang “ikaw pa rin” o “hindi ka nagbabago.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ang pang-ugnay at tahasang panghalip ay nagpapakita ng pagsalungat sa naunang paglalarawan na lilipas at magbabago ang nilikha.
- source_word: הוּא
  choice: ay hindi nagbabago
  rationale: Literal na “ikaw ay siya”; sa konteksto, isa itong idyomang nagpapahayag na nananatili ang pagkakakilanlan ng Diyos. Natural itong naipahahayag sa modernong Tagalog bilang “hindi nagbabago,” habang nililinaw sa talababa ang literal at alternatibong pagbasa.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: at ang iyong mga taon
  rationale: Tuwirang inilalarawan ng שָׁנָה na may hulaping ikalawang panauhang panlalaki ang temporal na “iyong mga taon.”
- source_word: לֹא
  choice: hindi
  rationale: Itinatanggi nito ang kasunod na di-ganap na pandiwa.
- source_word: יִתָּמּוּ
  choice: magwawakas
  rationale: Ang Qal ng תמם dito ay nangangahulugang matapos o sumapit sa wakas; malinaw at natural ang “magwawakas” sa pahayag tungkol sa walang-hanggang pag-iral.
theological_decisions:
- issue: Paglilipat sa idyomang “ikaw ay siya” kaugnay ng hindi nagbabagong pagkakakilanlan ng Diyos
  choice: ikaw ay hindi nagbabago
  alternative: ikaw pa rin; ikaw ay siya
  rationale: Ipinapahayag ng Hebreong idyoma ang patuloy na pagkakakilanlan ng Diyos bilang pagsalungat sa pagbabago at paglipas ng nilikha. Inihahatid ng “hindi nagbabago” ang puwersa nito nang hindi nagdaragdag ng teknikal na pilosopikal na termino; pinananatili ng talababa ang literal na anyo at tunay na saklaw ng idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “magwawakas” sa halip na mas mabigat na “sasapit sa katapusan,” at pinanatili ang patulang paralelismo ng dalawang sugnay.
