translation:
  language: tl
  text: Sapagkat kinalulugdan ng iyong mga lingkod ang kanyang mga bato, at nahahabag sila sa kanyang alabok[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sapagkat nalulugod ang iyong mga lingkod sa kanyang mga bato at may malasakit sa kanyang alabok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang ugnayang sanhi sa naunang pahayag at likas itong pakinggan sa marangal na tulang Filipino.
- source_word: רָצוּ
  choice: kinalulugdan
  rationale: Ipinahahayag ang masidhing pagkagiliw at magandang pagtingin ng mga lingkod sa mga bato ng Zion, nang hindi nililimitahan ang salita sa isang malamig na diwa ng pagsang-ayon.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa konteksto ng pakikipag-usap sa Diyos sa Mga Awit, malinaw at likas ang “mga lingkod” at hindi nito labis na itinatampok ang kalagayang alipin.
- source_word: אֶת אֲבָנֶיהָ
  choice: ang mga bato niya
  rationale: Pinananatili ang pambabaeng pagtukoy sa Zion/Jerusalem at ang kongkretong larawan ng mga bato ng nawasak na lungsod.
- source_word: וְאֶת עֲפָרָהּ
  choice: at ... ang alabok niya
  rationale: Pinananatili ang literal at makatang larawan ng עָפָר, na sa konteksto ay maaari ring magpahiwatig ng alabok o guho ng lungsod.
- source_word: יְחֹנֵנוּ
  choice: kinahahabagan nila
  rationale: Ipinahahayag ang mahabaging paglingap o pabor sa alabok ng Zion. Pinananatili rin nito ang kapansin-pansing tensiyon ng pagkahabag sa isang bagay na walang buhay.
theological_decisions:
- issue: Pagsasatao sa Zion/Jerusalem sa pamamagitan ng mga pambabaeng hulapi
  choice: Ginamit ang “niya” bilang pagtukoy sa Zion na isinatao bilang babae.
  alternative: Gamitin ang “nito” at ituring ang lungsod bilang isang bagay lamang.
  rationale: Pambabae ang mga hulapi sa Hebreo at ang pagpapanatili sa pagsasatao ay nagbibigay-diin sa makata at tipanang himig ng awit nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pagsasatao sa Zion at ang kongkretong larawan ng kanyang mga bato at alabok; iniwasan ang pagpapalit ng “alabok” sa mas tiyak na “mga guho” upang huwag paliitin ang saklaw ng larawan sa Hebreo.
