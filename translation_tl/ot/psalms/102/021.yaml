  source_fidelity: Tumpak na naipapahayag ng salin ang layuning infinitive na לְסַפֵּר bilang “upang ipahayag,” pati ang magkatambal na pook na Zion at Jerusalem. Ang “ang pangalan ni Yahweh” ay tuwirang katumbas ng שֵׁם יְהוָה. Ang “ang papuri sa kanya” ay isang likas na Filipino na paglalapat ng וּתְהִלָּתוֹ at pinananatili ang saklaw ng Hebreong possessive suffix sa konteksto.
