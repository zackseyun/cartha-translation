  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: tl
  text: 'upang ipahayag sa Zion ang pangalan ni Yahweh,

    at sa Jerusalem ang papuri sa kanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסַפֵּר
  choice: upang ipahayag
  rationale: Ang ל na kasama ng infinitive construct ay nagsasaad ng layunin o bunga. Sa kontekstong ito, ang Piel ng ספר ay tumutukoy sa hayagang pagpapahayag, hindi lamang sa pagkukuwento.
- source_word: בְּצִיּוֹן
  choice: sa Zion
  rationale: Ang ב na kasama ng pangalan ng lugar ay likas na isinasalin sa Filipino bilang “sa.” Pinanatili ang kinikilalang anyong “Zion.”
- source_word: שֵׁם יְהוָה
  choice: ang pangalan ni Yahweh
  rationale: Tuwirang pinananatili ng “pangalan” ang kahulugan ng שֵׁם, kasama ang pahiwatig nito sa nahayag na pagkakakilanlan at reputasyon ng Diyos. Isinalin ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: וּתְהִלָּתוֹ
  choice: at ang papuri sa kanya
  rationale: Ang תְּהִלָּה ay “papuri,” at ang hulaping pangatlong panauhang panlalaki ay tumutukoy kay Yahweh. Ang “papuri sa kanya” ay natural sa Filipino at pinananatili ang di-tahasang ugnayan ng Hebreo—papuring iniuukol sa kanya o nagpapahayag tungkol sa kanya.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang ב na kasama ng pangalan ng lungsod ay natural na “sa” sa Filipino. Ginamit ang karaniwang anyong “Jerusalem.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- issue: Kahulugan ng “kanyang papuri” (תְהִלָּתוֹ)
  choice: ang papuri sa kanya
  alternative: ang kanyang papuri; ang kanyang kabantugan
  rationale: Maaaring tumukoy ang parirala sa papuring iniuukol kay Yahweh o sa papuring nagpapahayag ng kanyang kapuri-puring katangian. Ang saling pinili ay hindi ito ginagawang “kabantugan” lamang at pinananatili ang teolohikal na lawak ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong layunin ng talata bilang pagpapatuloy ng naunang pangungusap. Inihanay ang “sa Jerusalem” sa ikalawang linya upang malinaw ang paralelismo sa “sa Zion,” nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
