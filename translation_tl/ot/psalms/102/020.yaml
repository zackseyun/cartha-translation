  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: tl
  text: 'upang pakinggan ang daing ng bilanggo,

    upang palayain ang mga anak ng kamatayan[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nakatakdang mamatay” o “mga hinatulan ng kamatayan.” Literal sa Hebreo, “mga anak ng kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: upang pakinggan
  rationale: Ang infinitibong may לְ ay nagpapahayag ng layunin o resulta sa mas malaking pangungusap. Likas sa Filipino ang “upang pakinggan” at pinananatili nito ang paralelismo sa kasunod na “upang palayain.”
- source_word: אֶנְקַת
  choice: ang daing ng
  rationale: Ang אֲנָקָה ay tumutukoy sa pagdaing o paghibik dahil sa matinding paghihirap. Ang “daing” ay maikli, mabigat, at natural sa makabagong Filipino.
- source_word: אָסִיר
  choice: bilanggo
  rationale: Tumutukoy ito sa isang taong nakagapos o nakapiit. Ang “bilanggo” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: לְפַתֵּחַ
  choice: upang palayain
  rationale: Bagaman literal na “buksan,” idiomatiko rito ang pagbubukas ng daan palabas mula sa pagkakagapos o hatol; kaya malinaw at natural ang “palayain.”
- source_word: בְּנֵי תְמוּתָה
  choice: mga anak ng kamatayan
  rationale: Pinananatili sa pangunahing teksto ang matinding larawang Hebreo na “mga anak ng kamatayan,” habang nililinaw sa talababa ang malamang na idiomatikong kahulugan nito.
theological_decisions:
- issue: Kahulugan ng idyomang בְּנֵי תְמוּתָה
  choice: Panatilihin sa teksto ang “mga anak ng kamatayan.”
  alternative: “mga nakatakdang mamatay” o “mga hinatulan ng kamatayan”
  rationale: Hindi tiyak kung pangunahing tinutukoy ng parirala ang mga tiyak nang mamamatay o yaong nasa ilalim ng hatol na kamatayan. Ang literal na larawan sa teksto at mga alternatibo sa talababa ay nagpapanatili sa tunay na saklaw ng kahulugan nang hindi nagpapasya nang higit sa ebidensiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatulad na hulma na “upang pakinggan … upang palayain” upang tularan ang paralelismong sintaktiko ng Hebreo. Ang di-karaniwang larawang “mga anak ng kamatayan” ay sadyang pinanatili at ipinaliwanag sa talababa.
