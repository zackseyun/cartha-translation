translation:
  language: tl
  text: Maghapon akong nilalait ng mga kaaway ko; ginagamit ako ng mga kumukutya sa akin sa kanilang mga panunumpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang ekspresyong Hebreo. Maaari ring isalin, “nanunumpa sa pamamagitan ko ang mga kumukutya sa akin,” “nanunumpa laban sa akin ang mga kumukutya sa akin,” o “ginagamit nila ako bilang sumpa sa kanilang mga panunumpa.” Maaaring ipinahihiwatig nito na ang pangalan o kalagayan ng salmista ay ginagamit sa mapanlibak na pananalita ng panunumpa o pagsumpa.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Maghapon
  rationale: Likas na ekspresyon sa modernong Tagalog para sa patuloy na pangyayari sa buong araw.
- source_word: חֵרְפוּנִי
  choice: akong nilalait
  rationale: Ipinahahayag ng pandiwang Hebreo ang mapanghamak na pag-alipusta o pag-insulto; malinaw at marangal sa Tagalog ang “nilalait.”
- source_word: אֹיְבַי
  choice: ng mga kaaway ko
  rationale: Tuwirang salin ng pangngalang may unang panauhang pang-angkin.
- source_word: מְהוֹלָלַי
  choice: ng mga kumukutya sa akin
  rationale: Mahirap ang anyong Hebreo, ngunit sa konteksto ay tumutukoy sa mga taong nangungutya o nanlilibak sa salmista.
- source_word: בִּי נִשְׁבָּעוּ
  choice: ginagamit ako sa panunumpa
  rationale: Pinananatili ang pangunahing diwa ng panunumpa at ang salmista bilang bagay o pormulang ginagamit dito, nang hindi tiyakang nilulutas kung ito ay panunumpa “sa pamamagitan niya” o paggamit sa kaniya bilang sumpa.
