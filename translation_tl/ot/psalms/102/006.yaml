  text: דָּ֭מִיתִי לִ/קְאַ֣ת מִדְבָּ֑ר הָ֝יִ֗יתִי כְּ/כ֣וֹס חֳרָבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/006.yaml
  text: I am like a desert owl[b][a]; I have become like an owl among the ruins.
translation:
  language: tl
  text: Para akong kuwago sa ilang[a]; naging tulad ako ng kuwago sa gitna ng mga guho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pelikano sa ilang.” Hindi tiyak kung anong ibon ang tinutukoy ng Hebreong קָאַת; “pelikano” ang karaniwang salin ayon sa tradisyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “munting kuwago sa mga guho.” Hindi tiyak ang eksaktong uri ng ibong tinutukoy ng Hebreong כּוֹס.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: Para akong
  rationale: Ang qal perfect ng דמה ay naghahayag dito ng paghahambing o pagkakatulad. Ang kasalukuyang anyong “Para akong” ay natural sa tulang Tagalog at maaaring magpahiwatig ng umiiral na kalagayan.
- source_word: לִקְאַת
  choice: kuwago
  rationale: Hindi tiyak ang ibong tinutukoy ng קָאַת. Ang “kuwago” ay angkop sa larawan ng pag-iisa at kapanglawan sa ilang, habang inilalahad sa talababa ang tradisyonal na alternatibong “pelikano.”
- source_word: מִדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa di-sinasakang, liblib, o tigang na lupain. Mas natural at marangal sa kontekstong patula ang “ilang” kaysa sa mas tiyak na “disyerto.”
- source_word: הָיִיתִי
  choice: naging tulad ako
  rationale: Maaaring ipahiwatig ng perfect ng היה ang kinalabasan o kalagayang kinasadlakan. Pinananatili ng “naging tulad ako” ang bahagyang resultative na diwa at ang pagkakaiba nito sa unang linya.
- source_word: כְּכוֹס
  choice: ng kuwago
  rationale: Pangalan ito ng isang ibon, hindi ang karaniwang pangngalang “kopa.” Hindi tiyak ang eksaktong uri, kaya pangkalahatang “kuwago” ang ginamit at ipinaliwanag ang kawalang-katiyakan sa talababa.
- source_word: חֳרָבוֹת
  choice: sa gitna ng mga guho
  rationale: Ang maramihang anyo ay tumutukoy sa mga guho o wasak at tiwangwang na mga lugar. Likas sa Tagalog ang “sa gitna ng mga guho” at malinaw nitong naihahatid ang tagpuan.
