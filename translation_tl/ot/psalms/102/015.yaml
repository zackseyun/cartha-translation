  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: tl
  text: 'Kaya magpipitagan ang mga bansa sa pangalan ni Yahweh[a],


    at magpipitagan ang lahat ng hari sa lupa sa kaluwalhatian mo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaya katatakutan ng mga bansa ang pangalan ni Yahweh.” Maaari ring isalin ang unang salita bilang “At” sa halip na “Kaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Kaya igagalang
  rationale: Ang Qal imperfect ng ירא ay maaaring mangahulugang matakot o magpitagan. Dito, ang paggalang na may banal na pagpipitagan ang likas na diwa; ipinahahayag ng “Kaya” ang kontekstuwal na bunga ng naunang talata, bagaman maaari ring payak na “At.”
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Tumutukoy ito sa mga bansa o mga bayan; iniiwasan ng saling ito ang posibleng mas huling relihiyosong kahulugan ng “mga Hentil.”
- source_word: אֶת שֵׁם יְהוָה
  choice: ang pangalan ni Yahweh
  rationale: Pinananatili ang Hebreong konsepto ng “pangalan,” na maaaring sumaklaw sa pagkakakilanlan at reputasyon nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: at ng lahat ng hari sa lupa
  rationale: Natural na salin ito ng כָל na kasama ng pangmaramihang construct; pinananatili rin ang “sa lupa.”
- source_word: אֶת כְּבוֹדֶךָ
  choice: ang kaluwalhatian mo
  rationale: Ang כָּבוֹד ay maaaring kaluwalhatian, karangalan, o kaningningan. Ang “kaluwalhatian” ang angkop sa patula at teolohikal na rehistro, at pinananatili ang tuwirang ikalawang panauhang pananalita sa Diyos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Diwa ng ירא
  choice: igagalang
  alternative: katatakutan / pagpipitaganan
  rationale: Saklaw ng pandiwa ang takot at mapitagang paghanga. Ang “igagalang” ay natural sa modernong Tagalog at nagpapahiwatig ng pagpipitagan, habang itinatala sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Ginamit ang ellipsis sa ikalawang sugnay—“at ng lahat ng hari ...”—upang tapat na katawanin ang magkatulad na kayariang Hebreo, kung saan inuunawa mula sa unang sugnay ang pandiwang “igagalang.”
