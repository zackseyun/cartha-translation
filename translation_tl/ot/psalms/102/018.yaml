  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: tl
  text: Isusulat ito para sa darating na salinlahi, at si Yah[a] ay pupurihin ng isang bayang lilikhain pa lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Yah,” ang maikling anyong patula ng banal na pangalan; isinasalin ito ng maraming salin bilang “ang PANGINOON.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: Isusulat
  rationale: Ang Nifal imperfect ng כתב ay likas na pasibong panghinaharap; malinaw at natural sa Filipino ang “Isusulat.”
- source_word: זֹאת
  choice: ito
  rationale: Tumutukoy ang demonstratibo sa naunang patotoo o panalangin nang hindi nagdaragdag ng interpretatibong pangngalan.
- source_word: לְדוֹר אַחֲרוֹן
  choice: para sa darating na salinlahi
  rationale: Ang אַחֲרוֹן ay temporal dito—isang salinlahing darating—sa halip na tiyak na eskatolohikal na “huling salinlahi.”
- source_word: וְעַם נִבְרָא
  choice: at ... ng isang bayang lilikhain pa lamang
  rationale: Karaniwang nangangahulugang “bayan” ang עַם, at ipinahihiwatig ng pasibong participle na נִבְרָא, kasabay ng darating na salinlahi, ang isang bayang wala pa at lilikhain pa lamang.
- source_word: יְהַלֶּל
  choice: pupurihin
  rationale: Ang Piel imperfect ng הלל ay ipinahayag bilang panghinaharap, kasuwato ng dalawang sugnay na nakatingin sa hinaharap.
- source_word: יָהּ
  choice: Yah
  rationale: Ito ang maikling anyong patula ng banal na pangalan, hindi ang buong anyong יהוה; pinananatili ng “Yah” ang leksikal at patulang pagkakaiba.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יָהּ
  choice: Yah
  alternative: ang PANGINOON
  rationale: Maikling anyo ng banal na pangalan ang nasa Hebreo. Ang “ang PANGINOON” ay pamilyar ngunit binubura nito ang tunay na pagkakaiba ng יָהּ at יהוה.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “salinlahi” para sa dignidad na angkop sa Awit at “bayan” para sa kolektibong עַם. Inayos ang hulihan bilang “pupurihin ni Yah ... ng isang bayan” upang maging natural sa Filipino habang nananatiling malinaw na si Yah ang pinupuri.
