  yaml_path: translation/ot/psalms/102/005.yaml
  text: From the sound of my groaning[b][a], my bones cling to my flesh.
translation:
  language: tl
  text: 'Dahil sa aking pagdaing[a],

    dumikit ang mga buto ko sa aking laman.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula sa tunog ng aking pagdaing.” Maaaring ipahayag ng pang-ukol na Hebreo ang sanhi o ang pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: O “sa aking balat.” Sa kontekstong ito ng matinding pangangayayat, maaaring tumukoy ang salitang Hebreo sa balat.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Dahil sa
  rationale: Sa pariralang מִן + קוֹל, maaaring ipahiwatig ng pang-ukol ang sanhi o pinagmulan. Ang “Dahil sa” ay natural sa Filipino at malinaw na iniuugnay ang paghihirap ng katawan sa naririnig na pagdaing, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: אַנְחָתִי
  choice: aking pagdaing
  rationale: Ang salita ay tumutukoy sa daing o buntong-hiningang bunga ng matinding dalamhati. Mas nababagay ang “pagdaing” sa tindi at tono ng panaghoy.
- source_word: דָּבְקָה
  choice: dumikit
  rationale: Pinananatili nito ang kongkretong larawan ng mahigpit na pagkapit o pagdikit. Ang aspektong naganap ng pandiwang Hebreo ay likas na naipahahayag ng “dumikit.”
- source_word: עַצְמִי
  choice: mga buto ko
  rationale: Bagaman anyong isahan ang salitang Hebreo, maaari itong gamitin nang kolektibo. Ang maramihang “mga buto” ang natural na pagpapahayag sa Filipino para sa balangkas ng katawan.
- source_word: לִבְשָׂרִי
  choice: sa aking laman
  rationale: Ang pangunahing kongkretong kahulugan ng בָּשָׂר ay “laman.” Pinananatili nito ang matinding pisikal na larawan nang hindi tahasang pinapalitan ng kontekstuwal na pagpapakahulugang “balat.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at tuwiran. Pinanatili ang matinding larawang patula ng mga butong dumidikit sa laman, at inilagay sa mga talababa ang tunay na leksikal na kalabuan tungkol sa sanhi/pinagmulan at laman/balat.
