  source_fidelity: Tapat ang salin sa Hebreong מִקּוֹל אַנְחָתִי ... דָּבְקָה עַצְמִי לִבְשָׂרִי. Ang “Dahil sa aking pagdaing” ay isang wastong pagbasa ng מִן + קוֹל bilang sanhi, habang maayos na pinananatili ng talababa ang mas literal na pagbasa na tumutukoy sa tunog ng pagdaing. Ang “dumikit ang mga buto ko sa aking laman” ay naghahatid ng kolektibong “buto” at ng kongkretong larawan ng pagkapayat nang walang labis na pagpapaliwanag.
  naturalness: Natural at marangal ang makabagong Filipino. Ang ayos na “Dahil sa aking pagdaing, dumikit ang mga buto ko sa aking laman” ay malinaw at angkop sa panaghoy na patula. Bahagyang matindi at di-karaniwan ang larawan, ngunit sinasadya ito ng orihinal at hindi dapat pakinisin sa paraang mawawala ang bisa nito.
  terminology: Ang “pagdaing,” “mga buto,” at “laman” ay angkop at pare-pareho ang rehistro. Wasto ring inilalagay ang “balat” bilang kontekstuwal na alternatibo sa talababa, hindi bilang sapilitang kapalit ng pangunahing kahulugan ng בָּשָׂר.
