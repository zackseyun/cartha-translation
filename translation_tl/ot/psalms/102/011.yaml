  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: tl
  text: Ang mga araw ko'y parang aninong humahaba[a], at ako'y nalalanta gaya ng damo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aninong nakaunat.” Malamang na inilalarawan ng Hebreo ang aninong humahaba sa dapithapon, isang larawan ng paghina at paglipas ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Ang mga araw ko
  rationale: Pinananatili ang literal na pangmaramihang anyo at ang Hebreong larawang tumutukoy sa nalalabing panahon ng buhay ng mang-aawit.
- source_word: כְּצֵל
  choice: parang anino
  rationale: Likas na Filipino para sa paghahambing na ipinahihiwatig ng כְּ, habang pinananatili ang biblikal na larawan ng panandaliang buhay.
- source_word: נָטוּי
  choice: humahaba
  rationale: Ang salita ay maaaring mangahulugang nakaunat o pinahaba; kaugnay ng anino, likas nitong ipinahihiwatig ang aninong humahaba sa dapithapon.
- source_word: וַאֲנִי
  choice: at ako'y
  rationale: Pinananatili ang payak na pangatnig at panghalip nang hindi dinaragdagan ang antas ng pagsalungat.
- source_word: כָּעֵשֶׂב
  choice: gaya ng damo
  rationale: Ang 'damo' ang karaniwan at malinaw na katumbas ng עֵשֶׂב sa kontekstong patula tungkol sa panghihina at paglipas.
- source_word: אִיבָשׁ
  choice: nalalanta
  rationale: Ipinahahayag ang patuloy na pagkatuyo at paghina ng nagsasalita, at natural itong ipares sa larawan ng damo sa modernong Filipino.
