translation:
  language: tl
  text: Sapagkat dumungaw siya mula sa kaniyang banal na kaitaasan; mula sa langit ay tumingin si Yahweh sa lupa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: dumungaw
  rationale: Ipinahahayag ang pagtingin mula sa isang mataas na dako pababa, gaya ng hinihingi ng konteksto.
- source_word: מְרוֹם קָדְשׁוֹ
  choice: kaniyang banal na kaitaasan
  rationale: Pinananatili ang konkretong larawan ng mataas at banal na kinaroroonan nang hindi ito ginagawang tiyak na katawagan gaya ng templo.
- source_word: הִבִּיט
  choice: tumingin
  rationale: Natural at tuwirang katumbas; pinananatili rin ang estilistikong pag-uulit ng dalawang pandiwa ng pagtingin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang pangalan, sa halip na palitan ng titulong Panginoon.
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: mula sa langit ... sa lupa
  rationale: Tapat na pinananatili ang direksiyon ng pagtingin mula sa langit patungo sa lupa.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasagawa ng unang pandiwa
  choice: Pinanatili ang panghalip na “siya,” at saka tahasang pinangalanan si Yahweh sa ikalawang sugnay.
  alternative: Gawing “si Yahweh” agad ang simuno ng unang sugnay.
  rationale: Sinusunod nito ang ayos at paralelismo ng Hebreo nang hindi nagdaragdag ng paglilinaw na wala sa unang sugnay.
- issue: Kahulugan ng “banal na kaitaasan”
  choice: Hindi tinukoy kung ito ay langit, templo, o ibang banal na tirahan.
  alternative: Isalin bilang “kaniyang banal na tahanan sa kaitaasan.”
  rationale: Pinananatili ang lawak at bahagyang kawalang-tiyak ng מְרוֹם קָדְשׁוֹ.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “kaitaasan” upang mapanatili ang matayog na himig ng salmo, at “dumungaw” upang malinaw ang pagtingin mula sa itaas pababa.
