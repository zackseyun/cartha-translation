  text: לְ֭/פָנִים הָ/אָ֣רֶץ יָסַ֑דְתָּ וּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: tl
  text: Noong unang panahon, itinatag mo ang lupa[a], at ang kalangitan ay gawa ng iyong mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay mo ang pundasyon ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: Noong unang panahon
  rationale: Ipinapahayag nito ang temporal na diwang “noong una/matagal nang panahon” sa natural at marangal na makabagong Tagalog.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Dahil katapat nito ang “kalangitan,” kosmikong kahulugan ang tinutukoy, hindi isang partikular na lupain.
- source_word: יָסַדְתָּ
  choice: itinatag mo
  rationale: Ang יסד ay tumutukoy sa pagtatatag o paglalagay ng pundasyon. Pinananatili ng “itinatag” ang larawan ng matibay na pagkakalagay nang hindi pinalalawak ang teksto.
- source_word: וּמַעֲשֵׂה
  choice: ay gawa
  rationale: Natural na isinasalin ang pariralang nominal bilang “ay gawa,” kasama ang kasunod na “ng iyong mga kamay.”
- source_word: יָדֶיךָ
  choice: ng iyong mga kamay
  rationale: Pinananatili nito ang konkretong antropomorpikong larawan ng banal na paggawa sa Hebreo.
- source_word: שָׁמָיִם
  choice: ang kalangitan
  rationale: Ang “kalangitan” ay natural, marangal, at angkop na kosmikong katapat ng “lupa.”
theological_decisions:
- issue: Ang wika ng paglikha ay tuwirang iniuukol sa Diyos
  choice: 'Panatilihin ang tuwirang pangalawang panauhan: itinatag ng Diyos ang lupa at ang kalangitan ay gawa ng kanyang mga kamay.'
  alternative: Gawing di-tuwiran ang pagtukoy o alisin ang larawan ng mga kamay.
  rationale: Tuwirang iniuukol ng panalanging patula ang paglikha sa kinakausap. Pinananatili ng salin ang pahayag at ang antropomorpikong larawan nang hindi ito pinapahina o dinaragdagan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog; pinananatili ang paralelismong kosmiko at ang matalinghagang “mga kamay.”
