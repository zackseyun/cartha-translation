  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: tl
  text: Sapagkat itinayo ni Yahweh ang Zion; nagpakita siya sa kanyang kaluwalhatian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nakikita siya sa kanyang kaluwalhatian” o “siya ay nakita sa kanyang kaluwalhatian.” Ang pandiwang Hebreo ay maaaring mangahulugang nagpakita siya o siya ay nakita.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang dahilan o batayan ng mga pahayag sa konteksto, at likas sa makabagong Tagalog ang “Sapagkat.”
- source_word: בָנָה
  choice: itinayo
  rationale: Ang qatal ay inilalarawan bilang ganap na kilos. Hindi idinagdag ang di-tahasang diwa ng “muling-” o “binuo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Pinananatili ang tiyak na pangalang nasa Hebreo sa halip na gawing Jerusalem o bayan ng Diyos.
- source_word: נִרְאָה
  choice: nagpakita
  rationale: Maaaring mangahulugan ang Niphal ng ראה na “nagpakita” o “nakita.” Ang “nagpakita” ay natural na nagsasaad ng pagpapahayag ng Diyos, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: בִּכְבוֹדוֹ
  choice: sa kanyang kaluwalhatian
  rationale: Tuwirang ipinahahayag ang paraan o kalagayan ng kanyang pagpapakita at pinananatili ang bigat ng כָּבוֹד bilang kaluwalhatian.
theological_decisions:
- issue: Kahulugan ng נִרְאָה בִּכְבוֹדוֹ bilang pagpapakita o pagiging nakita
  choice: nagpakita siya sa kanyang kaluwalhatian
  alternative: nakita siya sa kanyang kaluwalhatian / siya ay nakita sa kanyang kaluwalhatian
  rationale: Pinili sa pangunahing teksto ang idiomatikong kahulugan ng banal na pagpapakita, ngunit hindi inalis ang pasibong posibilidad ng Hebreo; malinaw itong inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “itinayo” nang walang idinagdag na “muli,” at pinanatili ang pangalang Yahweh at Zion.
