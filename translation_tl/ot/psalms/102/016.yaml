    issue: Hindi idiomatiko at hindi malinaw ang huling pangungusap ng talababa.
    rationale: Ang “sa pagiging nakita niya” ay maaaring magmukhang si Yahweh ang nakakakita, samantalang ang pasibong posibilidad ng Hebreo ay na si Yahweh ang nakikita. Kailangang sabihin nang tuwiran na “siya ay nakita” o “siya ay nakikita.”
  - severity: low
    issue: Hindi ganap na naipapakita ng talababa ang aspektuwal na saklaw ng alternatibong pasibong pagbasa.
    rationale: Ang audit trail ay nagbibigay ng mga pagbasa na “is seen” at “has been seen.” Ang “nakikita” at “siya ay nakita” ay mas malinaw na kumakatawan sa mga ito sa Tagalog.
