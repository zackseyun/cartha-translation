  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: tl
  text: 'Ngunit ikaw, Yahweh, ay nakaluklok magpakailanman[a],

    at ang alaala mo ay sa sali''t salinlahi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakaupo magpakailanman” o “nananatili magpakailanman.” Literal na nangangahulugang “umupo” ang pandiwang Hebreo, ngunit maaari rin itong tumukoy sa pananatili o sa maharlikang pagkaluklok.
    reason: lexical_alternative
  - marker: b
    text: O “ang pag-alaala sa iyo” o “ang kabantugan mo.” Maaaring tumukoy ang salitang Hebreo sa alaala, alaalang-gunita, o namamalaging kabantugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ngunit ikaw
  rationale: Sa konteksto, itinatampok ng pangatnig at hiwalay na panghalip ang kaibahan ng panandaliang buhay ng tao sa walang hanggang pananatili ni Yahweh. Likas na ipinahahayag ito ng “Ngunit ikaw” sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na katumbas ito ng walang hanggang tagal na ipinahihiwatig ng עוֹלָם.
- source_word: תֵּשֵׁב
  choice: nakaluklok
  rationale: Ang pandiwang ישב ay literal na “umupo” at maaari ring mangahulugang manatili o manahan. Kapag Diyos ang paksa sa ganitong makatang konteksto, maaaring ipahiwatig nito ang maharlikang pagkaluklok; natural na naihahatid iyon ng “nakaluklok.”
- source_word: וְזִכְרְךָ
  choice: at ang alaala mo
  rationale: Pinananatili ng “alaala” ang saklaw ng Hebreong זֵכֶר—pag-alaala, alaalang-gunita, o namamalaging kabantugan—nang hindi agad nililimitahan sa “katanyagan.”
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahi
  rationale: Karaniwang idyomang Filipino ito para sa pagpapatuloy sa magkakasunod na mga salinlahi at angkop sa makatang rehistro ng salmo.
theological_decisions:
- issue: Ang kahulugan ng maharlikang paghahari sa תֵּשֵׁב
  choice: nakaluklok magpakailanman
  alternative: nakaupo magpakailanman; nananatili magpakailanman
  rationale: Ipinahihiwatig ng konteksto ang walang hanggang paghahari o pananatili ng Diyos, ngunit hindi tahasang ginagamit sa Hebreo ang salitang “trono.” Pinili ang “nakaluklok” bilang natural na pagpapahayag ng maharlikang diwa, habang inilalahad sa talababa ang mas literal na mga posibilidad.
- issue: Ang saklaw ng זִכְרְךָ
  choice: ang alaala mo
  alternative: ang pag-alaala sa iyo; ang kabantugan mo
  rationale: Hindi tiyak kung ang diin ay nasa paggunita, alaalang-gunita, o namamalaging kabantugan. Pinananatili ng “alaala mo” ang lawak at bahagyang kalabuan ng orihinal.
translation_notes:
  register: Makabago ngunit marangal at bahagyang patula ang rehistro. Ginamit ang “sali't salinlahi” bilang likas na idyomang Filipino. Inilagay ang bawat panandang talababa sa mismong pariralang tinutukoy nito.
