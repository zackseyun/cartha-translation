  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matingkad at bahagyang di-karaniwang larawang “hinaluan ... ng pag-iyak” upang hindi mawala ang pananalita ng Hebreo; inilagay sa talababa ang mas kongkretong “mga luha.”
