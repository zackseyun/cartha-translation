  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: tl
  text: 'Sapagkat kumain ako ng abo na parang tinapay,

    at hinaluan ko ng pag-iyak ang aking inumin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at hinaluan ko ng mga luha ang aking inumin.” Ang literal na nasa Hebreo ay “pag-iyak,” na maaari ring ipahayag nang mas kongkreto bilang “mga luha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala ang dahilan o batayan ng panaghoy at pinananatili ang ugnayang sanhi sa konteksto.
- source_word: אֵפֶר
  choice: abo
  rationale: Tuwirang katumbas sa makabagong Tagalog at angkop sa larawan ng pagdadalamhati at pagpapakumbaba.
- source_word: כַּלֶּחֶם
  choice: na parang tinapay
  rationale: Malinaw na pinananatili ang paghahambing na ipinahihiwatig ng prefiks na כ.
- source_word: אָכָלְתִּי
  choice: kumain ako
  rationale: Likas na salin ng unang panauhang qatal sa konteksto ng salaysay-panaghoy; hindi kinakailangang gawing ganap na aspekto sa Tagalog.
- source_word: שִׁקֻּוַי
  choice: aking inumin
  rationale: Tumutukoy rito sa karaniwang iniinom, hindi sa handog na inumin; pormal ngunit natural sa patulang Tagalog.
- source_word: בִּבְכִי
  choice: ng pag-iyak
  rationale: Pinananatili ang abstraktong pangngalang 'pag-iyak' sa Hebreo sa halip na tahimik na gawing mas kongkretong 'mga luha.'
- source_word: מָסָכְתִּי
  choice: hinaluan ko
  rationale: Natural na Tagalog para sa paghahalo ng isang bagay sa likido at malinaw na inilalarawan ang inuming nahaluan ng pag-iyak.
