translation:
  language: tl
  text: 'Sapagkat ang mga araw ko’y naglalaho gaya ng usok,

    at ang mga buto ko’y nasusunog na parang apuyan[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling parirala na “ang mga buto ko’y naliliyab na parang isang nagbabagang kahoy,” “parang pugon,” o “parang brasero.” Bihira ang salitang Hebreo para sa bagay o lugar na nag-aapoy, kaya hindi tiyak ang eksaktong larawan, bagaman malinaw ang diwa ng matinding init.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang ugnayang sanhi o batayan ng panaghoy at likas sa marangal na makabagong Tagalog.
- source_word: כָלוּ בְעָשָׁן יָמָי
  choice: naglalaho na parang usok ang aking mga araw
  rationale: Ang כָלוּ ay maaaring mangahulugang nauubos o nagwawakas; kasama ng usok, malinaw na inilalarawan nito ang mga araw na mabilis na naglalaho. Isinalin ang בְ bilang paghahambing ayon sa gamit at konteksto.
- source_word: וְעַצְמוֹתַי
  choice: at ... ang aking mga buto
  rationale: Tuwirang pinananatili ang masidhing larawang pangkatawan ng Hebreong tula.
- source_word: קֵד
  choice: apuyan
  rationale: Bihira at hindi tiyak ang eksaktong tinutukoy ng salita, ngunit nagpapahiwatig ito ng bagay o lugar na matindi ang init. Ang “apuyan” ay natural na larawang Tagalog at hindi labis na nagpapakipot sa kahulugan; inilalahad sa talababa ang ibang posibilidad.
- source_word: נִחָרוּ
  choice: nagbabaga
  rationale: Ipinahahayag ang pagiging matinding mainit o tila nasusunog nang hindi ipinapalagay na lubusang natupok o nauling ang mga buto.
