  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: tl
  text: Sa daan[b] ay pinahina niya ang lakas niya[a]; pinaikli niya ang mga araw ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang lakas niya.” Dahil unang panauhan ang nakapaligid na konteksto, marami ang umuunawa rito bilang “ang lakas ko.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa takbo ng buhay”; literal na “sa daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: pinahina
  rationale: Ang Piel ng ענה ay maaaring mangahulugang pahirapan, ibaba, o pahinain. Dahil “lakas” ang layon, natural at tumpak sa modernong Tagalog ang “pinahina.”
- source_word: בַדֶּרֶךְ
  choice: sa daan
  rationale: Pinananatili nito ang tuwirang larawan ng Hebreo, habang inilalagay sa talababa ang posibleng metaporikal na kahulugang tumutukoy sa takbo ng buhay.
- source_word: כחו
  choice: ang lakas niya
  rationale: 'Ang nakasulat na anyo ay may hulaping ikatlong panauhang panlalaki: “ang lakas niya.” Pinananatili ito sa pangunahing teksto sa halip na iayon agad sa unang panauhan ng kasunod na parirala.'
- source_word: קִצַּר
  choice: pinaikli
  rationale: Tuwirang katumbas ito ng pandiwang nangangahulugang paikliin o putulin nang maaga.
- source_word: יָמָי
  choice: ang mga araw ko
  rationale: Tuwirang inilalarawan ng unang-panauhang hulapi ang mga araw ng salmista, na sa konteksto ay tumutukoy sa haba ng kanyang buhay.
theological_decisions:
- issue: Paglipat mula sa ikatlong panauhan sa “lakas niya” tungo sa unang panauhan sa “mga araw ko”
  choice: Pinanatili ang “lakas niya” sa unang linya at “mga araw ko” sa ikalawa.
  alternative: 'Basahin ang dalawang linya sa unang panauhan: “pinahina niya ang lakas ko … pinaikli niya ang mga araw ko.”'
  rationale: 'May tunay na tensiyon sa anyong Hebreo: ikatlong panauhan ang hulapi sa “lakas,” ngunit unang panauhan ang hulapi sa “mga araw.” Hindi ito tahimik na pinag-iisa; inilalagay sa talababa ang pagbasa na mas umaayon sa konteksto.'
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinili ang natural na “pinahina” sa halip na ang mas matigas na “pinahirapan ang lakas.” Pinanatili ang maikli at patulang paralelismo, pati ang di-pangkaraniwang paglipat ng panauhan sa tekstong Hebreo.
