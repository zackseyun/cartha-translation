  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: tl
  text: Ang mga anak ng iyong mga lingkod ay mananahan, at ang kanilang mga supling ay matatatag sa iyong harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga anak na lalaki ng iyong mga lingkod ay mananahan, at ang kanilang binhi ay matatatag sa iyong harapan.”
    reason: Ipinakikita ang mas pormal na mga katumbas ng בְּנֵי at זַרְעָם.
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ng
  rationale: Ang construct plural ng בֵּן ay maaaring tumukoy sa mga anak o inapo; ang “mga anak” ay natural sa modernong Filipino at hindi nililimitahan sa mga lalaki.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa pananalangin sa Diyos sa salmo, ang “mga lingkod” ang likas at marangal na katumbas; hindi pangunahing diin dito ang legal na kalagayan ng isang alipin.
- source_word: יִשְׁכּוֹנוּ
  choice: mananahan
  rationale: Ang שכן ay nangangahulugang manahan, tumira, o mamalagi. Hindi idinagdag ang “nang ligtas” sapagkat walang tahasang salita para sa seguridad sa Hebreo.
- source_word: וְזַרְעָם
  choice: at ang kanilang mga supling
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga anak o inapo. Ang “mga supling” ay natural at pinananatili ang ugnayang salinlahi.
- source_word: לְפָנֶיךָ
  choice: sa iyong harapan
  rationale: Tapat itong kumakatawan sa literal na diwang “sa harap mo” at maaari ring magpahiwatig ng presensiya ng Diyos nang hindi nilulutas ang saklaw nito.
- source_word: יִכּוֹן
  choice: matatatag
  rationale: Ang Niphal ng כון ay nagpapahayag ng pagiging matatag, naitatag, o nananatiling matibay. Ang “matatatag” ay maikli, natural, at nagpapanatili sa resultative/passive na diwa.
theological_decisions:
- issue: Kung gagawing tahasang tipan o eskatolohikal ang pangako
  choice: Panatilihin itong pangako na ang mga inapo ng mga lingkod ay mananahan at matatatag sa harapan ng Diyos.
  alternative: Tahasang tukuyin itong pangako ng tipan sa Israel o pangako ng pangwakas na kaligtasan.
  rationale: Binabanggit ng Hebreo ang paninirahan at pagiging matatag ng mga inapo sa harapan ng Diyos ngunit hindi nito tahasang tinutukoy ang mas tiyak na doktrinal na balangkas o panahon.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panulaan. Ginamit ang “mananahan” at “matatatag” para sa maikli at balanseng paralelismo. Inilagay ang talababa pagkatapos ng buong talata upang katawanin ang mga leksikal na alternatibo.
