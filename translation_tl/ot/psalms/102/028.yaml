  source_fidelity: Tapat ang salin sa Hebreo. Ang “mga anak ng iyong mga lingkod” ay angkop para sa בְּנֵי עֲבָדֶיךָ; ang “mananahan” ay hindi nagdaragdag ng diwang seguridad sa יִשְׁכּוֹנוּ; at ang “mga supling ay matatatag sa iyong harapan” ay maayos na naghahatid ng kolektibong זַרְעָם, ng katatagan sa יִכּוֹן, at ng לְפָנֶיךָ. Hindi nito ipinipilit ang isang tipan o eskatolohikal na pagbasa.
  naturalness: Natural at marangal ang modernong Filipino, na angkop sa panulaang panalangin. Maikli at balanseng magkaparis ang “mananahan” at “matatatag.” Ang “sa iyong harapan” ay malinaw at hindi artipisyal.
  terminology: Ang “mga lingkod” ay angkop na pantawag sa mga lingkod ng Diyos sa kontekstong ito. Ang “mga anak” at “mga supling” ay natural na mga katumbas na hindi walang-kailangang naglilimita sa kasarian. Ang talababa ay wastong nagtatala ng mas pormal na “mga anak na lalaki” at “binhi.”
