  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang panawagang huwag ikubli ang mukha, ang dalawang inuulit na panandang panahon na “sa araw,” ang pagyukod/pagkiling ng tainga tungo sa nagsasalita, at ang apurahang kahilingang sumagot. Ang “sa araw na ako’y tumawag” ay katanggap-tanggap na makatang Filipino para sa temporal na diwa ng imperfect na אֶקְרָא, nang hindi ipinipilit ang isang tiyak na panahon.'
