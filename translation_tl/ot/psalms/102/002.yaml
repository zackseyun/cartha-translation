  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ בְּ/י֪וֹם צַ֫ר לִ֥/י הַטֵּֽה אֵלַ֥/י אָזְנֶ֑/ךָ בְּ/י֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: tl
  text: Huwag mong ikubli sa akin ang iyong mukha[a] sa araw ng aking kagipitan[b]; ikiling mo sa akin ang iyong tainga. Sa araw na ako'y tumawag, sagutin mo ako agad.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong presensiya.” Ang “mukha” sa Hebreo ay maaari ring tumukoy sa mapaglingap na presensiya ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “sa araw na may kagipitan ako”; literal sa Hebreo, “sa araw na ang kagipitan ay sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “magmadali kang sagutin ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Huwag mong ikubli
  rationale: Ipinapahayag ng אַל kasama ng pandiwa ang isang mariing pakiusap na huwag gawin ang kilos. Ang “ikubli” ay likas at marangal na katumbas ng סתר.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang konkretong larawang Hebreo sa halip na agad itong ipakahulugang “presensiya” o “paglingap.”
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Sa pariralang Filipino na “ikubli sa akin,” malinaw nitong ipinahihiwatig na inilalayo o ipinagkakait sa nagsasalita ang mukha ng Diyos.
- source_word: בְּיוֹם צַר לִי
  choice: sa araw ng aking kagipitan
  rationale: Pinananatili ang temporal na “sa araw” at likas na ipinapahayag ng “aking kagipitan” ang kapighatiang sumasapit sa nagsasalita.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: ikiling mo sa akin ang iyong tainga
  rationale: Pinananatili ang larawang pagkliling ng tainga bilang tanda ng masusing pakikinig, pati ang direksiyong “sa akin.”
- source_word: בְּיוֹם אֶקְרָא
  choice: Sa araw na ako'y tumawag
  rationale: Pinananatili ang pag-uulit ng בְּיוֹם at ang payak na diwa ng קרא bilang pagtawag sa Diyos.
- source_word: מַהֵר עֲנֵנִי
  choice: sagutin mo ako agad
  rationale: Malinaw at kasalukuyang Filipino ang “agad” para sa pagkaapurahan ng מַהֵר, samantalang ang ענה ay tuwirang “sagutin.”
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos (“mukha” at “tainga”)
  choice: Panatilihin ang mga konkretong larawan sa pangunahing teksto
  alternative: Isalin bilang “presensiya” at “pakinggan mo ako”
  rationale: Ang mga larawang ito ay makatang paraan ng Hebreo upang ipahayag ang lingap at pakikinig ng Diyos. Ang pagpapanatili sa mga ito ay hindi nangangahulugang ipinapahayag na may katawang pisikal ang Diyos.
- issue: Pag-uulit ng temporal na pariralang בְּיוֹם
  choice: Panatilihin ang “sa araw” sa dalawang sugnay
  alternative: Gawing “kapag nasa kagipitan ako” at “kapag tumawag ako”
  rationale: Bahagi ng estrukturang patula at ng diin ng talata ang pag-uulit, at nananatili naman itong malinaw sa Filipino.
- issue: Ugnayan ng מַהֵר sa pakiusap na sumagot
  choice: 'Ipakahulugang pang-abay: “sagutin mo ako agad”'
  alternative: 'Ipakahulugang pandiwang utos: “magmadali kang sagutin ako”'
  rationale: Kapwa posible sa diwa, ngunit mas natural sa modernong Filipino ang pang-abay habang pinananatili ang pagkaapurahan ng pakiusap.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang paralelismong patula, ang pag-uulit ng “sa araw,” at ang konkretong mga larawang “mukha” at “tainga.” Ang pinaikling “ako’y” ay angkop sa himig ng panalangin nang hindi nagiging lipas o mahirap unawain.
