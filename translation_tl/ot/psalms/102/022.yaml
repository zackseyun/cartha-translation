lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: kapag ... nagtipon
  rationale: 'Ang ב na sinusundan ng infinitive construct ay temporal: “kapag/sa pagtitipon.” Bagaman Niphal ang anyo at maaaring isaling pasibo, mas natural sa modernong Tagalog ang “nagtipon,” habang pinananatili sa talababa ang posibleng pasibong diwa.'
- source_word: עַמִּים
  choice: mga bayan
  rationale: Tumutukoy ito sa maraming pangkat o sambayanan, hindi lamang sa mga makabagong estadong pampolitika. Likas at marangal sa Tagalog ang “mga bayan” sa kontekstong patula.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Ipinahahayag ng adverbio ang magkakasamang pagtitipon; “sama-sama” ang malinaw at natural na katumbas sa Tagalog.
- source_word: וּ/מַמְלָכוֹת
  choice: at mga kaharian
  rationale: Tuwirang pinananatili nito ang pang-ugnay at ang kahulugan ng מַמְלָכוֹת bilang mga kaharian o nasasakupan.
- source_word: לַ/עֲבֹד
  choice: upang maglingkod
  rationale: Ang עבד ay pangunahing nangangahulugang maglingkod, ngunit kapag Diyos ang layon maaari rin itong magpahiwatig ng pagsamba. Pinananatili sa pangunahing teksto ang mas malawak na kahulugan at inilalagay sa talababa ang alternatibo.
- source_word: אֶת יְהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang banal na pangalang יהוה bilang “Yahweh.” Ginagamit ang “kay” bilang natural na pananda sa Tagalog para sa personal na layon ng pandiwang “maglingkod.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kung lilimitahan ang עבד sa kahulugang “sumamba”
  choice: maglingkod
  alternative: sumamba
  rationale: Maaaring saklawin ng paglilingkod kay Yahweh ang pagsamba, ngunit mas malawak ang pandiwang Hebreo. Hindi dapat paliitin sa pangunahing teksto ang saklaw nito.
- issue: Ugnayang sintaktiko ng “mga kaharian” sa pagtitipon
  choice: Itinuturing na kasama ng “mga bayan” sa nagtitipong tambalang simuno
  alternative: Maaaring basahin ang “mga kaharian” bilang mas tuwirang kaugnay ng pariralang “upang maglingkod”
  rationale: Pinakamalinaw sa konteksto na kapwa nagtitipon ang mga bayan at mga kaharian upang maglingkod kay Yahweh. Gayunman, dahil sa ayos at paghahating patula ng Hebreo, itinatala sa talababa ang mas mahigpit na alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na patula ngunit madaling maunawaan. Pinili ang “mga bayan” kaysa mas mabigat na “mga sambayanan,” at ang “sama-samang nagtipon” para sa likas na daloy. Ang gitling sa dulo ay pinananatili sapagkat nagpapatuloy ang pangungusap mula sa naunang taludtod o patungo sa mas malawak na konteksto.
