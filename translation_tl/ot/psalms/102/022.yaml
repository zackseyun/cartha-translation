  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “kapag sama-samang nagtipon ang mga bayan at mga kaharian upang maglingkod kay Yahweh.” Mas natural ang “natipon” kaysa “tinipon” para sa pasibong/di-transitibong alternatibo, dahil ang “tinipon” ay karaniwang nagpapahiwatig ng isang tahasang tagatipon.
