  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: tl
  text: O Yahweh[a], dinggin mo ang aking panalangin; makarating nawa sa iyo ang aking paghingi ng saklolo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasalin na “ang PANGINOON.” Kabilang sa ibang anyo ang “Yahweh” at “Jehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שִׁמְעָה
  choice: dinggin mo
  rationale: Tuwirang pakiusap ito sa anyong pautos; natural at marangal sa Filipino ang “dinggin mo” para sa panalangin.
- source_word: תְפִלָּתִי
  choice: ang aking panalangin
  rationale: Tuwirang katumbas ng pangngalang tumutukoy sa panalangin, kasama ang hulaping unang panauhan.
- source_word: וְשַׁוְעָתִי
  choice: ang aking paghingi ng saklolo
  rationale: Ang שַׁוְעָה ay hindi lamang malakas na sigaw kundi karaniwang sigaw para humingi ng tulong; malinaw at natural itong naipahahayag sa Filipino bilang “paghingi ng saklolo.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Pinananatili ang direksiyon ng Hebreong pang-ukol patungo sa kinakausap.
- source_word: תָבֹוא
  choice: makarating nawa
  rationale: Ipinahahayag ang jussive o mapakiusap na diwa ng imperfect at ang larawang ang daing ay dumarating sa Diyos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan, habang ipinababatid sa talababa ang tradisyonal at ibang anyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dinggin” bilang likas na pananalitang panalangin at “makarating nawa” upang mapanatili ang mapakiusap na himig at larawan ng orihinal.
