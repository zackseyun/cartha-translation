  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: tl
  text: Panalangin ng isang taong nagdurusa kapag nanghihina siya[a] at ibinubuhos niya sa harap ni Yahweh ang kanyang hinaing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag siya ay lubos na nalulupig.”
    reason: lexical_alternative
  - marker: b
    text: O “kanyang pagbubulay” o “kanyang panaghoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Panalangin
  rationale: Ang payak na pangngalan ay angkop sa estilo ng pamagat ng awit at natural sa Filipino nang walang pantukoy.
- source_word: לְעָנִי
  choice: ng isang taong nagdurusa
  rationale: Ipinahihiwatig ng lamed ang kaugnayan ng panalangin sa taong tinutukoy. Saklaw ng עָנִי ang naghihirap, inaapi, o dukha; inilalahad ng 'taong nagdurusa' ang mas malawak na diwa nang hindi nililimitahan sa kahirapang pangkabuhayan o di-kinakailangang itinatangi ang kasarian.
- source_word: כִּי
  choice: kapag
  rationale: Ipinakikilala rito ang kalagayan o pagkakataon ng pag-aalay ng panalangin, kaya mas natural ang temporal na 'kapag' kaysa sanhi na 'sapagkat.'
- source_word: יַעֲטֹף
  choice: nanghihina siya
  rationale: Maaaring tumukoy ang pandiwa sa panghihina o pagiging lubos na nalulupig. Ang 'nanghihina' ay malinaw at likas sa makabagong Filipino habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: וְלִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ng 'sa harap' ang relasyonal na diwa ng לִפְנֵי, at isinasalin ang banal na pangalan bilang 'Yahweh.'
- source_word: יִשְׁפֹּךְ
  choice: ibinubuhos niya
  rationale: Pinananatili nito ang metapora ng pagbubuhos ng niloloob sa panalangin at natural itong pakinggan sa Filipino.
- source_word: שִׂיחוֹ
  choice: ang kanyang hinaing
  rationale: Maaaring mangahulugan ang שִׂיחַ ng pagbubulay, daing, o reklamong ipinahahayag. Sa konteksto ng pagdurusa at panalangin, malinaw na naipapahayag ng 'hinaing' ang diwa ng panaghoy nang hindi nagmumukhang mapanghamak na pagrereklamo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang natatanging pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa isang pamagat ng awit. Ginamit ang 'isang taong nagdurusa' upang maging natural at hindi magdagdag ng di-kinakailangang pagtukoy sa kasarian, habang pinananatili ang indibiduwal na isahan. Ang mga tunay na alternatibong diwa ng יַעֲטֹף at שִׂיחוֹ ay inilagay sa mga talababa.
