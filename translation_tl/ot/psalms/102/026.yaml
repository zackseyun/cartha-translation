id: PSA.102.26
reference: Psalms 102:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: tl
  text: Mawawala sila, ngunit ikaw ay mananatili; silang lahat ay maluluma gaya ng isang kasuotan. Gaya ng damit, papalitan mo sila[a], at lilipas sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaguhin mo sila.” Maaaring mangahulugan ang salitang Hebreo na baguhin o palitan, bilang pagpapatuloy ng larawan ng kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹאבֵדוּ
  choice: Mawawala sila
  rationale: Ang אבד ay tumutukoy sa pagkapahamak o pagkawala. Ang “mawawala” ay natural sa makatang Tagalog at hindi labis na nagpapahiwatig ng ganap na pagkalipol.
- source_word: וְאַתָּה תַעֲמֹד
  choice: ngunit ikaw ay mananatili
  rationale: Bagaman literal na “tatayo” ang עמד, ipinahihiwatig nito rito ang patuloy at matatag na pag-iral, na tahasang inihahambing sa pagkawala ng nilikha.
- source_word: וְכֻלָּם כַּבֶּגֶד יִבְלוּ
  choice: silang lahat ay maluluma gaya ng isang kasuotan
  rationale: Ang בלה ay karaniwang tumutukoy sa pagkaluma ng damit. Pinananatili ng “maluluma” at “kasuotan” ang talinghaga.
- source_word: כַּלְּבוּשׁ תַּחֲלִיפֵם
  choice: Gaya ng damit, papalitan mo sila
  rationale: Maaaring mangahulugan ang Hiphil ng חלף na baguhin, palitan, o ipagpalit. Sa talinghaga ng damit, natural ang “papalitan” at pinananatili nito ang posibilidad ng pagpapalit ng kasuotan.
- source_word: וְיַחֲלֹפוּ
  choice: at lilipas sila
  rationale: Ang Qal ng חלף ay maaaring magpahiwatig ng paglipas o pagbabago. Ang “lilipas” ay akma sa konteksto ng pansamantalang nilikha nang hindi nilulutas ang lahat ng detalye ng larawan.
theological_decisions:
- issue: Ang pananatili ng Diyos laban sa paglipas ng nilikha
  choice: “ngunit ikaw ay mananatili”
  alternative: “ngunit ikaw ay tatayo”
  rationale: Ipinahahayag ng konteksto ang namamalaging pag-iral ng Diyos kumpara sa pagkapawi at pagkaluma ng nilikha. Hindi nagdaragdag ang salin ng kalaunang terminong doktrinal.
- issue: Pagbabago o pagpapalit sa nilikha
  choice: “papalitan mo sila” na may talababa
  alternative: “babaguhin mo sila”
  rationale: Kapuwa posible sa תַּחֲלִיפֵם ang pagbabago at pagpapalit. Pinakamalinaw sa talinghaga ng pagpapalit ng damit ang “papalitan,” habang itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang paralelismo at talinghaga ng kasuotang naluluma at pinapalitan. Iniwasan ang lubhang teknikal o denominasyonal na pananalita.
