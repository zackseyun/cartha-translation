translation_notes:
  register: Modernong Filipino na may marangal at makatang himig. Ginamit ang pinaikling “ko'y” para sa maayos na daloy; iniwasan ang labis na teknikal o makalumang mga salita. Pinanatili ang bahagyang kalabuan kung ang paghahambing sa damo ay pangunahing kaugnay ng pagkakahampas o ng kabuuang kalagayang hinampas at natuyo.
