lexical_decisions:
- source_word: הוּכָּה
  choice: hinampas
  rationale: Pinananatili nito ang pasibong diwa ng נכה at ang larawan ng matinding kapighatian nang hindi gumagamit ng makalumang pananalita.
- source_word: כָעֵשֶׂב
  choice: gaya ng damo
  rationale: Likas at tuwirang katumbas ito ng עֵשֶׂב at pinananatili ang paghahambing sa halamang madaling matuyo.
- source_word: וַיִּבַשׁ
  choice: at natuyo
  rationale: Ang יבש ay nangangahulugang matuyo o malanta; ang “natuyo” ay natural sa Filipino at malinaw na kaugnay ng larawan ng damo.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili ang karaniwang makatang katawagan sa panloob na pagkatao, kaisipan, at damdamin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kalagayan ng nagsasalita sa isang marangal ngunit madaling maunawaang paraan.
- source_word: שָׁכַחְתִּי
  choice: nalilimutan ko
  rationale: Bagaman perpekto ang anyong Hebreo, maaaring ilarawan nito ang nagpapatuloy na kalagayan ng pagdurusa; pinananatili ng kasalukuyang anyo ang ganitong posibilidad.
- source_word: מֵאֲכֹל
  choice: kainin
  rationale: Ang literal na “mula sa pagkain” ay likas na ipinahahayag sa Filipino bilang “nalilimutan kong kainin.”
- source_word: לַחְמִי
  choice: ang aking tinapay
  rationale: Pinananatili ang kongkretong salitang “tinapay,” bagaman maaari rin itong tumukoy sa pagkain sa pangkalahatan.
