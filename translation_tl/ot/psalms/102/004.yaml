  language: tl
  text: Ang puso ko'y parang damong hinampas at natuyo,[a] sapagkat nalilimutan kong kainin ang aking tinapay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ang puso ko''y hinampas gaya ng damo at natuyo.”'
    reason: previous_rendering
  - marker: b
    text: 'Maaari ring: “sapagkat nalimutan kong kainin ang aking pagkain.” Ang pandiwang Hebreo ay maaaring tumukoy sa nagpapatuloy na kalagayan o sa isang naganap na kilos na may bunga sa kasalukuyan; ang “tinapay” ay maaari ring mangahulugang pagkain sa pangkalahatan.'
