  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: tl
  text: Bumaling siya sa panalangin ng dukha at hindi hinamak ang kanilang panalangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga salat,” “mga walang-wala,” o “mga walang-kakampi.” Sa ibang konteksto, ang salitang Hebreo ay maaari ring tumukoy sa isang halamang tumutubo sa ilang; maaaring nasa likod nito rito ang larawan ng isang taong halos wala nang natira o nag-iisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: bumaling siya sa
  rationale: Pinananatili ng “bumaling” ang kongkretong larawan ng Hebreong pandiwa—ang pagharap o pagbaling tungo sa isang bagay—at sa kontekstong ito ay likas na nagpapahiwatig ng pagbibigay-pansin sa panalangin.
- source_word: תְּפִלַּת
  choice: panalangin ng
  rationale: Tuwirang inililipat ang anyong construct na “panalangin ng” at pinananatili ang pag-uulit ng salitang “panalangin” sa dalawang hati ng talata.
- source_word: הָעַרְעָר
  choice: dukha
  rationale: Sa konteksto, tumutukoy ito sa taong salat, walang-wala, o nag-iisa, hindi sa literal na halamang tumutubo sa ilang. Ang “dukha” ay maikli, marangal, at madaling maunawaan; maaari rin itong gamitin bilang kolektibong pagtukoy sa mga taong nasa gayong kalagayan.
- source_word: בָזָה
  choice: hinamak
  rationale: Ang “hinamak” ay nagpapanatili sa diwa ng paghamak o pagturing na walang halaga, sa halip na pahinain ito bilang simpleng pagtanggi.
- source_word: תְּפִלָּתָם
  choice: kanilang panalangin
  rationale: Pinananatili ang pangmaramihang hulaping “kanila” at ang isahang pangngalang “panalangin,” gayundin ang sinadyang pag-uulit ng salita sa Hebreo.
theological_decisions:
- issue: Kahulugang pantao ng עַרְעָר
  choice: dukha bilang kolektibong pagtukoy sa mga taong salat o walang-wala
  alternative: isang taong nag-iisa o isang larawang hinango sa halamang tumutubo sa ilang
  rationale: Ang kasunod na pangmaramihang “kanilang panalangin” ay nagpapakitang mga tao ang tinutukoy. Gayunman, hindi isinasara ng salin ang pahiwatig ng pagiging hubad sa yaman, walang-kakampi, o nakahiwalay, kaya inilalahad ang lawak ng salita sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bumaling” upang mapanatili ang kongkretong larawan ng Hebreo, at ang “dukha” bilang payak at kolektibong katawagan. Pinanatili rin ang pag-uulit ng “panalangin” at ang paglipat mula sa anyong isahan na “dukha” tungo sa pangmaramihang “kanilang,” gaya ng tensiyon sa tekstong Hebreo.
