base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/007.yaml
  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: tl
  text: Hindi ako makatulog, at para akong ibong nag-iisa sa bubungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parang isang mayang nag-iisa sa bubong.” Ang Hebreong צִפּוֹר ay pangkalahatang salita para sa ibon, bagaman ang “maya” ay isang tradisyonal at mas tiyak na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Hindi ako makatulog
  rationale: Sa konteksto ng panaghoy, ipinahihiwatig ng pandiwa ang patuloy na pagiging gising o walang tulog, hindi ang aktibong pagbabantay. Natural at malinaw ito sa modernong Tagalog.
- source_word: וָאֶהְיֶה
  choice: at para akong
  rationale: Ipinagpapatuloy nito ang kasalukuyang paglalarawan ng kalagayan ng nagsasalita at maayos na inuugnay sa kasunod na paghahambing.
- source_word: כְּצִפּוֹר
  choice: parang ibon
  rationale: Ang צִפּוֹר ay pangkalahatang katawagan sa ibon at hindi kinakailangang tumukoy sa maya; pinananatili ng 'ibon' ang lawak ng kahulugan.
- source_word: בּוֹדֵד
  choice: nag-iisa
  rationale: Tumpak nitong ipinahahayag ang pagiging mag-isa o nakahiwalay nang hindi idinaragdag ang mas tiyak na damdaming ipinahihiwatig ng 'malungkot.'
- source_word: עַל גָּג
  choice: sa bubungan
  rationale: Ang parirala ay literal na tumutukoy sa ibabaw ng bubong. Ang 'sa bubungan' ay natural at makatang paglalarawan sa Tagalog.
