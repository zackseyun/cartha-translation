base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: tl
  text: Sinasabi ko, “Diyos ko, huwag mo akong kunin[a] sa kalagitnaan ng aking mga araw; ang iyong mga taon ay sa sali't salinlahi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “huwag mo akong iahon sa kalagitnaan ng aking mga araw.” Maaaring mangahulugan ang pandiwang Hebreo na “iahon” o “paakyatin,” ngunit dito ay malamang na tumutukoy ito sa pagkuha sa isang tao sa buhay nang maaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Sinasabi ko
  rationale: Ang Qal imperfect na unang panauhang isahan ay maaaring magpahayag ng kasalukuyan o magpakilala ng sinabi sa masiglang estilong patula. Ang “Sinasabi ko” ay natural na nagpapakilala sa kasunod na pagsusumamo.
- source_word: אֵלִי
  choice: Diyos ko
  rationale: Ang anyong may hulaping unang panauhang isahan ay nangangahulugang “aking Diyos”; sa Filipino, natural at marangal ang bokatibong “Diyos ko.”
- source_word: אַל תַּעֲלֵנִי
  choice: huwag mo akong kunin
  rationale: Bagaman ang Hiphil ng עלה ay literal na maaaring “iahon” o “paakyatin,” ipinahihiwatig ng konteksto ng pinaikling buhay ang pagkuha o pag-aalis sa buhay nang maaga.
- source_word: בַּחֲצִי יָמָי
  choice: sa kalagitnaan ng aking mga araw
  rationale: Pinananatili nito ang Hebreong talinghaga ng mga “araw” bilang haba ng buhay at ang larawan ng buhay na napuputol sa gitna.
- source_word: בְּדוֹר דּוֹרִים
  choice: sa lahat ng salinlahi
  rationale: Ito ay natural na Filipino para sa Hebreong idyoma ng pagpapatuloy sa sunod-sunod na mga salinlahi, bagaman maaari rin itong ilarawan bilang “sa sali't salinlahi.”
- source_word: שְׁנוֹתֶיךָ
  choice: ang iyong mga taon
  rationale: Tuwirang pinananatili ang kaibahan ng maikling buhay ng salmista at ng walang-hanggang pag-iral ng Diyos.
theological_decisions:
- issue: Idyomatikong pananalita tungkol sa maagang kamatayan sa panalangin
  choice: huwag mo akong kunin
  alternative: huwag mo akong iahon / huwag mo akong alisin
  rationale: Sa agarang konteksto, nakikiusap ang salmista na huwag maputol nang maaga ang kanyang buhay. Inihahayag ng “kunin” ang malamang na diwa nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag, habang itinatala sa talababa ang literal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang “aking mga araw” at “iyong mga taon” upang maipakita ang sadyang paghahambing sa Hebreo. Iniwasan ang mas kolokyal na “sa kalagitnaan ng buhay ko” dahil binubura nito ang talinghaga ng mga araw.
