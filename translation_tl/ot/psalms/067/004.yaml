    issue: «hinahatulan mo» para sa תִשְׁפֹּט
    rationale: Sa modernong Filipino, ang «hatulan» ay madalas na nangangahulugang magpataw ng hatol laban sa isang nasasakdal o magparusa. Ang שׁפט dito ay tumutukoy sa makatarungang paghatol/paghuhukom sa mga bayan; «humahatol ka» ang mas neutral at tumpak na salin.
  - severity: medium
    issue: Hindi magkatugmang aspekto sa «Magalak ... at umawit»
    rationale: Ang «Magalak» ay panawagan/jussive, ngunit ang «umaawit» ay progresibong anyo. Ang «umawit» ay nagpapanatili sa magkatugmang panawagang anyo ng dalawang pandiwa.
  - severity: low
    issue: «sa buong lupa» ay mas malakas kaysa sa בָּאָרֶץ
    rationale: Bagaman sinusuportahan ng konteksto ang pandaigdig na pag-unawa, ang «buong» ay karagdagang panlahat na diin. Ang «sa lupa» ay sapat na nagpapahayag ng global na pagbasa at mas malapit sa pinagmulan.
