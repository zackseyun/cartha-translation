source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: tl
  text: Magalak ang mga bansa at umawit nang may galak[a], sapagkat humahatol ka sa mga bayan nang may katarungan at ginagabayan mo ang mga bansa sa lupa[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magalak ang mga bansa at humiyaw sa galak.” Ang pandiwa ay maaaring tumukoy sa masiglang pag-awit o sa malakas na sigaw ng galak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa lupain” kung mas lokal ang kahulugan ng אֶרֶץ. Isinalin itong “sa lupa” dahil pandaigdig ang saklaw ng salmo.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Magalak
  rationale: Ang Qal imperfect ay ginagamit dito bilang panawagan o hangarin. Ang “magalak” ay likas at marangal na salin na hindi inuulit ang tinig na diwa ng kasunod na pandiwa.
- source_word: וִירַנְּנוּ
  choice: at umawit sa tuwa
  rationale: Ang Piel ng רנן ay tumutukoy sa masiglang pag-awit o malakas na sigaw ng galak. Pinili ang “umawit sa tuwa” bilang malinaw at likas na pariralang patula; pinanatili sa talababa ang maaaring saling “humiyaw sa galak.”
- source_word: לְאֻמִּים
  choice: ang mga bansa
  rationale: Tumutukoy ito sa mga bansa o sambayanan. Ang “mga bansa” ay angkop sa pandaigdig na saklaw ng salmo at ginamit din nang pareho sa ikalawang paglitaw.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kagalakan ng mga bansa. Ang “sapagkat” ay malinaw at angkop sa marangal na tulang panrelihiyon.
- source_word: תִשְׁפֹּט
  choice: hinahatulan mo
  rationale: Ang imperfect ay maaaring tumukoy sa hinaharap o sa palagiang pagkilos. Dito, inilalarawan nito ang katangiang pagkilos ng Diyos bilang batayan ng pagpupuri, nang hindi pinapalawak ang pandiwa tungo sa mas pangkalahatang “pinamamahalaan.”
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinili ang “mga bayan” upang maipakita ang bahagyang pagkakaiba nito sa לְאֻמִּים na isinaling “mga bansa,” habang pinananatili ang malawak na pagtukoy sa mga pangkat ng tao.
- source_word: מִישׁוֹר
  choice: nang makatarungan
  rationale: Ang pangngalan ay may diwa ng pagiging tuwid, pantay, at makatarungan. Sa konteksto ng paghatol, ang “nang makatarungan” ang pinakanatural at malinaw.
- source_word: וּלְאֻמִּים
  choice: at ... ang mga bansa
  rationale: Ang inulit na לְאֻמִּים ay isinaling pareho bilang “mga bansa” at nagsisilbing layon ng pandiwang “ginagabayan.”
- source_word: תַּנְחֵם
  choice: ginagabayan mo
  rationale: Ang Hiphil ng נחה ay nangangahulugang umakay o gumabay. Ipinahahayag ng “ginagabayan” ang matalinong pangunguna ng Diyos nang hindi nililimitahan ito sa pisikal na pag-akay.
- source_word: בָּאָרֶץ
  choice: sa buong lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupain” o “lupa.” Dahil pandaigdig ang saklaw ng salmo, ipinahahayag ng “sa buong lupa” ang malawak na kahulugan nang natural sa Filipino.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili bilang transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan o tungkulin nito.
theological_decisions:
- issue: Saklaw ng אֶרֶץ
  choice: Pandaigdig na “buong lupa”
  alternative: Lokal na “lupain”
  rationale: Paulit-ulit na tinutukoy ng Salmo 67 ang lahat ng mga bayan at bansa. Kaya mas umaayon sa konteksto ang pandaigdig na saklaw, bagaman pinanatili sa talababa ang lokal na posibilidad.
- issue: Aspekto ng mga pandiwang imperfect
  choice: Panawagan sa unang dalawang pandiwa at kasalukuyan o palagiang pagkilos sa mga kasunod
  alternative: 'Pawang hinaharap: “magagalak ... hahatulan ... gagabayan”'
  rationale: Sa kontekstong liturhikal, likas basahin ang unang mga pandiwa bilang hangarin o panawagan, at ang kasunod bilang paglalarawan sa patuloy na pagkilos ng Diyos. Gayunman, hindi ipinagkakaila ng anyong Hebreo ang posibleng pagtanaw sa hinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may banayad na himig patula. Ginamit ang “mga bansa” at “mga bayan” upang mapanatili ang leksikal na pagkakaiba ng dalawang salitang Hebreo, at iniwasan ang terminolohiyang nakatali sa isang denominasyon.
