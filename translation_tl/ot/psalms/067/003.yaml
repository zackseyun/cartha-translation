  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: tl
  text: 'Purihin ka nawa ng mga bayan, O Diyos;

    purihin ka nawa ng lahat ng mga bayan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Pupurihin ka ng mga bayan.” Ang anyo ng pandiwang Hebreo ay maaaring magpahayag ng hangarin o panalangin, o—bagaman hindi gaanong malamang dito—ng kilos sa hinaharap.'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: purihin ka nawa
  rationale: Ang Hiphil ng ידה sa konteksto ng mga awit ay karaniwang nangangahulugang pagpuri o pasasalamat. Dito, ang “purihin ka nawa” ay natural na panalanging Filipino at pinananatili ang volitional na himig ng paulit-ulit na linya.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Tumutukoy ang pangmaramihang anyo sa sari-saring pangkat ng mga tao. Mas tuwirang naipapakita ng “mga bayan” ang konkretong plural kaysa sa “mga bansa,” na maaaring magkaroon ng mas politikal na dating.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang tinatawag ang Diyos; ipinahahayag ng “O Diyos” ang vocative at ang marangal na himig ng panalangin.
- source_word: כֻּלָּם
  choice: lahat ng bayan
  rationale: Ipinahahayag nito ang kabuuang saklaw ng כֻּלָּם habang pinananatiling malinaw at matula ang pag-uulit.
theological_decisions:
- issue: Volitional na puwersa ng inuulit na pandiwa sa refrain ng pagpuri
  choice: 'Isinalin bilang panalangin o hangarin: “Purihin ka nawa”'
  alternative: “Pupurihin ka” o “Purihin ka”
  rationale: Ang anyong Hebreo ay imperfect na maaaring unawain bilang hangarin/panalangin o bilang hinaharap. Sa liturhikal na kontekstong ito, higit na malamang ang panalanging pagbasa, ngunit itinatala sa talababa ang tunay na gramatikal na posibilidad ng hinaharap.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa tulang panalangin. Ginamit ang “mga bayan” para sa magkakaibang pangkat ng mga tao, hindi lamang sa mga estadong politikal. Isang talababa lamang ang kailangan; hindi na minarkahan nang hiwalay ang “mga bayan” dahil malinaw ito sa natural na Filipino.
