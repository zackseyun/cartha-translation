  source_fidelity: 'Tumpak ang salin sa Hebreo: ang אֶרֶץ ay “lupa,” ang נָתְנָה יְבוּלָהּ ay natural na “Nagbigay na ng ani ang lupa,” at ang pag-uulit na “Diyos, ng ating Diyos” ay pinananatili. Ang “pinagpapala tayo” ay isang katanggap-tanggap na pangkasalukuyang pagbasa ng di-ganap na יְבָרְכֵנוּ.'
