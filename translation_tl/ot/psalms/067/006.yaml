  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: tl
  text: Nagbigay na ng ani ang lupa[a]; pinagpapala tayo ng Diyos, ng ating Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupain.” Ang Hebreong אֶרֶץ ay maaaring mangahulugang “lupa” o “lupain.”
    reason: lexical_alternative
  - marker: b
    text: O “pagpalain nawa tayo ng Diyos, ng ating Diyos,” o “pagpapalain tayo ng Diyos, ng ating Diyos.” Sa kontekstong ito, ang pandiwang Hebreo ay maaaring basahin bilang pangkasalukuyan, isang pakiusap, o panghinaharap.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: lupa
  rationale: Ang “lupa” ay natural sa kontekstong agrikultural at maaari ring tumukoy nang malawak sa daigdig, gaya ng hinihingi ng pandaigdigang saklaw ng awit. Maaari rin itong unawain bilang “lupain.”
- source_word: נָתְנָה
  choice: nagbigay na
  rationale: Pinananatili nito ang payak na diwa ng pandiwang “nagbigay” at ipinahihiwatig na naganap na ang pagbibigay ng ani.
- source_word: יְבוּלָהּ
  choice: ng ani
  rationale: Ang “ani” ay malinaw at likas na salin para sa bungang agrikultural ng lupa, nang hindi labis na tinutukoy ang paraan o panahon ng pag-aani.
- source_word: יְבָרְכֵנוּ
  choice: pinagpapala tayo
  rationale: Ginamit ang pangkasalukuyang pasalaysay na pagbasa bilang pagpapahayag ng tiwala matapos banggitin ang naibigay nang ani. Nananatiling posible sa Hebreo ang panalangin o hinaharap na pagbasa, kaya inilagay ang mga iyon sa talababa.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ito ang karaniwang salin ng banal na katawagan dito.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang isinasalin ang hulaping unang panauhang maramihan at pinananatili ang pag-uulit na “Diyos, ating Diyos” para sa diin ng Hebreo.
theological_decisions:
- issue: Lakas o paraan ng pandiwang יְבָרְכֵנוּ
  choice: 'Pangkasalukuyang pasalaysay: “pinagpapala tayo”'
  alternative: “pagpalain nawa tayo” o “pagpapalain tayo”
  rationale: Maaaring ipakahulugan ang imperfect na Hebreo bilang kasalukuyang pahayag, pakiusap/panalangin, o hinaharap. Ang pangunahing teksto ay nagpapahayag ng tiwala, ngunit inilalahad sa talababa ang tunay na kalabuan sa gramatika.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling paralelismo at ang madiing pag-uulit na “Diyos, ating Diyos,” habang iniwasan ang masyadong teknikal o makalumang pananalita.
