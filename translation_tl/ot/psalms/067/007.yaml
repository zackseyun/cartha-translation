translation:
  language: tl
  text: Pagpapalain tayo ng Diyos, at matatakot sa kanya ang lahat hanggang sa mga dulo ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpipitagan sa kanya” o “mangilag sa kanya nang may pagpipitagan.” Maaaring saklawin ng pandiwang Hebreo ang takot at mapitagang pagkamangha sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: Pagpapalain tayo
  rationale: Ang Piel imperfect na may hulaping unang panauhang maramihan ay nangangahulugang ‘pagpapalain tayo.’ Ginamit ang hinaharap bilang tiyak at may pagtitiwalang pahayag, habang kinikilalang maaari rin itong unawain bilang kahilingan sa mas malawak na konteksto.
- source_word: אֱלֹהִים
  choice: ng Diyos
  rationale: Bagaman anyong maramihan ang salita, ang tinutukoy dito ay ang iisang Diyos; natural sa Tagalog ang ‘ng Diyos’ bilang tagaganap sa balintiyak na pangungusap.
- source_word: וְיִירְאוּ
  choice: at matatakot
  rationale: Pinananatili ng ‘matatakot’ ang lawak ng ירא bilang takot na may kasamang pagpipitagan at paghanga sa harap ng Diyos, sa halip na paliitin ito sa simpleng paggalang.
- source_word: אֹתוֹ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy pabalik sa Diyos bilang personal at isahang tinutukoy; hinihingi ng pandiwang ‘matakot’ sa Tagalog ang pariralang ‘sa kanya.’
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: ang lahat ng nasa pinakamalayong dako ng lupa
  rationale: Ang parirala ay idyoma para sa mga tao o bayan sa pinakadulong mga rehiyon ng daigdig. Nilinaw ng ‘nasa’ ang metonimikong pagtukoy sa mga naninirahan doon, yamang sila ang maaaring matakot sa Diyos.
theological_decisions:
- issue: Kahulugan ng ירא kaugnay ng Diyos
  choice: matatakot sa kanya
  alternative: magpipitagan sa kanya / mamamangha sa kanya
  rationale: Ang ‘matatakot’ ay tuwirang katumbas at pinananatili ang tensiyon ng takot, pagpipitagan, paghanga, at pagpapasakop. Inilalahad sa talababa ang iba pang posibleng diin nang hindi pinapahina ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang balintiyak na ‘Pagpapalain tayo ng Diyos’ bilang natural na katumbas ng ayos at diin ng Hebreo. Ang ‘pinakamalayong dako ng lupa’ ay mas malinaw sa karaniwang mambabasa kaysa sa literal ngunit maaaring malabong ‘mga dulo ng lupa.’
