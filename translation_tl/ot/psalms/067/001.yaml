  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: tl
  text: Nawa’y pagpakitaan tayo ng Diyos ng kagandahang-loob at pagpalain niya tayo; nawa’y pasikatin niya ang kanyang mukha sa atin.[a][b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, ang huling parirala ay “kasama natin,” ngunit sa idyomang ito ay natural na ipinahahayag bilang “sa atin.”
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw sa linyang ito ang basbas na ipinahayag ng mga pari sa Bilang 6:24–26, lalo na ang “pasikatin sa iyo ng PANGINOON ang kanyang mukha.”
    reason: cross_reference
  - marker: c
    text: Ang “Selah” ay malamang na palatandaang liturhikal o pangmusika; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang gamit nito rito at tumutukoy sa nag-iisang Diyos ng Israel.
- source_word: יְחָנֵּנוּ
  choice: pagpakitaan tayo ... ng kagandahang-loob
  rationale: Ipinahahayag ng חנן ang mapagbiyayang paglingap o pabor. Pinananatili ng pariralang ito ang diwa nang hindi ito nililimitahan sa awa lamang.
- source_word: וִיבָרְכֵנוּ
  choice: at pagpalain niya tayo
  rationale: Ang ברך ang karaniwang pandiwa para sa pagpapala; tuwiran, natural, at angkop sa panalangin ang salin.
- source_word: יָאֵר
  choice: nawa’y magliwanag
  rationale: Bagaman causative ang anyong Hebreo, natural sa Filipino ang ‘magliwanag ang kanyang mukha’ at napapanatili nito ang larawan at alusyon sa basbas ng mga pari.
- source_word: פָּנָיו
  choice: ang kanyang mukha
  rationale: Pinananatili ang kongkretong larawang ‘mukha’ sa halip na ipakahulugang ‘presensya’ o ‘paglingap,’ lalo na dahil umaalingawngaw dito ang Bilang 6:24–26.
- source_word: אִתָּנוּ
  choice: sa atin
  rationale: Literal itong ‘kasama natin,’ ngunit sa pariralang tungkol sa pagliliwanag ng mukha, ipinahahayag ng ‘sa atin’ ang paglingap na nakatuon sa bayan at mas natural sa Filipino.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan nito at malamang na palatandaang liturhikal o pangmusika, kaya pinanatili ito bilang transliterasyon.
theological_decisions:
- issue: Puwersang volitibo ng magkakasunod na pandiwa
  choice: Isinalin bilang panalangin o kahilingan sa pamamagitan ng ‘nawa.’
  alternative: Isalin bilang pangungusap na pasalaysay, gaya ng ‘Pinagpapakitaan tayo ng Diyos ng kagandahang-loob.’
  rationale: Sa konteksto ng basbas sa awit, ang mga anyong pandiwa ay likas na nagpapahayag ng pakiusap o hangarin, hindi simpleng paglalarawan.
- issue: Alusyon sa basbas ng mga pari
  choice: Pinanatili ang larawan ng mukha ng Diyos na nagliliwanag.
  alternative: Ipaliwanag agad bilang ‘lingapin tayo nang may pabor.’
  rationale: Malinaw na umaalingawngaw ang Bilang 6:24–26. Ang pagpapanatili sa larawan ay nag-iingat sa ugnayang pampanitikan at teolohikal nang hindi ito labis na ipinapaliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘pagpakitaan ... ng kagandahang-loob’ upang maiba sa kasunod na ‘pagpalain’ at mapanatili ang saklaw ng חנן. Pinanatili ang biblikal na larawan ng mukha ngunit inayos ang pandiwa bilang natural na ‘magliwanag sa atin.’
