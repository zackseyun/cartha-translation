lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa pagtatanghal ng musika. Likas at malinaw sa modernong Filipino ang pariralang ito, at ipinahihiwatig ng “para sa” ang pang-ukol na לְ.
- source_word: בִּנְגִינֹת
  choice: may saliw ng mga instrumentong de-kuwerdas
  rationale: Tumutukoy ang salita sa musikang tinutugtog sa mga instrumentong de-kuwerdas. Ang “may saliw” ay natural sa Filipino at pinananatili ang gamit na instrumental nang hindi nililimitahan kung paano eksaktong isinasagawa ang tugtog.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ito sa isang salmo o komposisyong musikal sa mga pamagat. Pinananatili ng “salmo” ang kinikilalang katawagan sa genre.
- source_word: שִׁיר
  choice: Isang awit
  rationale: 'Tuwirang katawagan ito sa isang awit. Isinalin ito nang hiwalay upang mapanatili ang dobleng pagtukoy ng Hebreo: “salmo” at “awit.”'
