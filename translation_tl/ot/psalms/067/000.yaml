  text: 'For the choirmaster: with stringed instruments[a]. A psalm. A song.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: may saliw ng mga instrumentong de-kuwerdas.[a] Isang salmo. Isang awit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na tinutugtog sa mga instrumentong de-kuwerdas.”
