translation:
  language: tl
  text: 'upang makilala sa daigdig[a] ang iyong daan,

    sa lahat ng bansa ang iyong pagliligtas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lupain,” kung lokal ang tinutukoy; ngunit ang katapat na “sa lahat ng bansa” ay pumapabor sa mas malawak na diwang “sa daigdig.”
    reason: lexical_alternative
  - marker: b
    text: O “kaligtasan.” Ang salitang Hebreo ay maaaring tumukoy sa pagsagip o sa pagliligtas sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: upang makilala
  rationale: Ang infinitibong may לְ ay nagpapahayag ng layunin at nagpapatuloy sa panalangin ng naunang talata. Likas sa Filipino ang “upang makilala” at pinananatili nito ang diwang layunin.
- source_word: בָּאָרֶץ
  choice: sa buong daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupain” o “daigdig.” Dahil katapat nito ang “sa lahat ng bansa,” ang pandaigdig na diwa ang higit na angkop. Idinagdag ang “buong” bilang likas na Filipino na pagpapahayag ng saklaw, hindi bilang bagong ideya.
- source_word: דַּרְכֶּךָ
  choice: ang iyong daan
  rationale: Pinananatili ng “daan” ang metapora ng Hebreo at maaari itong tumukoy kapwa sa landas ng Diyos at sa paraan ng kanyang pagkilos.
- source_word: בְּכָל גּוֹיִם
  choice: sa lahat ng bansa
  rationale: Ang גּוֹיִם ay karaniwang tumutukoy sa mga bansa bilang pandaigdig na mga pangkat. Ang “sa lahat ng bansa” ay malinaw at natural sa modernong Filipino.
- source_word: יְשׁוּעָתֶךָ
  choice: ang iyong pagliligtas
  rationale: Maaaring tumukoy ang יְשׁוּעָה sa pagliligtas, kaligtasan, o tagumpay. Mas malinaw sa Filipino ang “iyong pagliligtas” bilang gawa ng Diyos; ang “iyong kaligtasan” ay maaaring mapagkamalang kaligtasan na tinatanggap o tinatamasa mismo ng Diyos.
theological_decisions:
- issue: Saklaw ng אֶרֶץ sa isang awit tungkol sa lahat ng bansa
  choice: pandaigdig na “daigdig”
  alternative: lokal na “lupain”
  rationale: Ang pagkakatulad nito sa “sa lahat ng bansa” ay nagpapahiwatig ng pandaigdig na saklaw. Hindi nito ipinapasok ang anumang mas huling doktrina.
- issue: Paglalarawan sa יְשׁוּעָה nang hindi pinakikitid ang kahulugan
  choice: “pagliligtas”
  alternative: “kaligtasan” o “tagumpay”
  rationale: Sinasaklaw ng “pagliligtas” ang kongkretong pagsagip at ang mas malawak na nagliligtas na pagkilos ng Diyos, nang hindi ito ikinukulong sa isang sistematikong pakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang paralelismong patula at ang metaporang “daan.” Hindi dinagdagan ng tahasang pandiwa ang ikalawang linya upang mapanatili ang maigsi at balanseng anyo ng Hebreo.
