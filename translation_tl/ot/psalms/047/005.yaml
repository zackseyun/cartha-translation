  text: עָלָ֣ה אֱ֭לֹהִים בִּ/תְרוּעָ֑ה יְ֝הֹוָ֗ה בְּ/ק֣וֹל שׁוֹפָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: tl
  text: Umakyat ang Diyos kasabay ng hiyaw[a]; si Yahweh, sa tunog ng shofar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na may sigaw.”'
    reason: lexical_alternative
  - marker: b
    text: Ang shofar ay trumpetang yari sa sungay, ayon sa tradisyon ay sungay ng lalaking tupa.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: Umakyat
  rationale: Tuwirang ipinapahayag ang pag-akyat nang hindi ipinapasok ang mas tiyak na implikasyong teolohikal ng ilang posibleng katawagan. Ang aspektong naganap ay angkop sa anyong perpekto ng Hebreo at sa patulang pagpapahayag.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel at katumbas ni Yahweh sa ikalawang hati ng taludtod, kaya isahan ang salin.
- source_word: בִּתְרוּעָה
  choice: sa gitna ng sigawan
  rationale: Ang תְּרוּעָה ay malakas na sigaw o paghiyaw ng pagbubunyi, pagsamba, o pagtatagumpay. Pinananatili ng 'sigawan' ang lawak nito nang hindi ipinapalagay na masaya o pandigma lamang ang sigaw.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בְּקוֹל
  choice: sa tunog ng
  rationale: Sa kaugnayan ng instrumentong שׁוֹפָר, natural sa modernong Tagalog ang 'tunog ng' at malinaw nitong naihahatid ang pandinig na larawan.
- source_word: שׁוֹפָר
  choice: shofar
  rationale: Pinananatili ang tiyak na katawagan sa instrumentong sungay upang hindi ito mapagkamalang modernong metal na trumpeta; ipinaliliwanag ito sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Posibleng Kristolohikal na pagbasa sa wikang tumutukoy sa pag-akyat
  choice: Umakyat ang Diyos
  alternative: Pumanhik ang Diyos
  rationale: Inilalarawan ng salmo ang maharlikang pag-akyat o pagluklok ng Diyos. Ang payak na 'umakyat' ay tapat sa Hebreo at hindi sapilitang naglalagay ng mas huling Kristolohikal na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'sa gitna ng sigawan' upang maging natural ang larawan ng pag-akyat na sinasabayan ng malakas na pagbubunyi. Pinanatili ang 'shofar' bilang tiyak na pangkulturang instrumento at ipinaliwanag sa talababa.
