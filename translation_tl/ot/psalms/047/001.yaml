base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: tl
  text: Pumalakpak kayo, lahat ng mga bayan[a]; sumigaw kayo sa Diyos nang may tinig ng kagalakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga bansa.” Ang Hebreong עַמִּים ay maaaring tumukoy sa mga pangkat ng mga tao sa kolektibo o etnikong diwa, o, sa mas malawak na diwa, sa mga bansa.
    reason: lexical_alternative
  - marker: b
    text: O “sa tunog ng pagbubunyi” o “sa masayang tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: lahat ng mga bayan
  rationale: Tinutukoy ng maramihang עַמִּים ang lahat ng pangkat ng mga tao sa kolektibo o etnikong diwa. Pinananatili ng “mga bayan” ang maramihang saklaw nito nang hindi ito nililimitahan sa makabagong estadong pampolitika.
- source_word: תִּקְעוּ כָף
  choice: Pumalakpak kayo
  rationale: Ang idyomang Hebreo ay literal na tumutukoy sa paghampas ng palad. “Pumalakpak kayo” ang natural at malinaw na katumbas sa modernong Tagalog.
- source_word: הָרִיעוּ
  choice: sumigaw kayo
  rationale: Ang pandiwa ay utos na magtaas ng malakas na sigaw, karaniwang bilang masayang pagbubunyi o pagpupugay. Ang “sumigaw” ay maikli, natural, at kaagapay ng pagpalakpak.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Ipinakikita ng ל ang pinatutungkulan ng pagbubunyi; tuwirang ipinahahayag ito ng “sa Diyos.”
- source_word: בְּקוֹל רִנָּה
  choice: nang may galak
  rationale: Ang parirala ay literal na may diwang “sa tinig/tunog ng masayang pagbubunyi.” Pinili ang natural na “nang may galak,” samantalang inilalahad sa talababa ang mas literal na mga posibilidad upang mapanatili ang saklaw ng רִנָּה.
theological_decisions:
- issue: Saklaw ng panawagan sa mga bayan
  choice: Ang lahat ng mga bayan ay pangkalahatang tinatawag na magpuri sa Diyos.
  alternative: Maaaring unawain ang panawagan bilang retorikal na nakatuon lamang sa mga bansang nakapaligid sa Israel.
  rationale: Malinaw na sinasabi ng Hebreo na “lahat ng mga bayan,” at kaayon ito ng pandaigdigang panawagan ng salmo na kilalanin ang paghahari ng Diyos; hindi kailangang paliitin ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga bayan” upang mapanatili ang maramihang kolektibo ng Hebreo, at ang “nang may galak” upang maging natural sa karaniwang mambabasa habang ang mas literal na imaheng pandinig ay pinananatili sa talababa.
