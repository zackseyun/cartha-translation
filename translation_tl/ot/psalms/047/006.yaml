base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: tl
  text: Umawit kayo ng papuri sa Diyos[a], umawit kayo ng papuri; umawit kayo ng papuri sa ating Hari, umawit kayo ng papuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tumugtog kayo para sa Diyos ... tumugtog kayo para sa ating Hari.” Maaaring tumukoy ang pandiwang Hebreo sa musikal na pagpupuri sa mas malawak na diwa, hindi lamang sa pag-awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: umawit kayo ng papuri
  rationale: Sa kontekstong liturhiko, ang maramihang pautos ng זמר ay panawagan sa musikal at tinig na pagpupuri. Pinananatili ang apat na ulit na pag-uulit sa Hebreo upang maipakita ang diin at ritmo ng talata.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel bilang tuwirang pinag-uukulan ng papuri; likas at malinaw ang saling “Diyos.”
- source_word: לְמַלְכֵּנוּ
  choice: sa ating Hari
  rationale: Ipinahihiwatig ng לְ ang pinag-uukulan ng papuri. Ang “ating” ay tumpak na kumakatawan sa hulaping unang panauhang maramihan, at ang “Hari” ay pamagat para sa Diyos sa konteksto.
theological_decisions:
- issue: Ang banal na titulong pagkahari
  choice: ating Hari
  alternative: ating hari
  rationale: Ipinagdiriwang ng nakapaligid na konteksto ang paghahari ng Diyos, kaya ang “Hari” ay ginagamit bilang banal na titulo nang walang idinaragdag na doktrinang wala sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang apat na magkakatulad na panawagan sa Hebreo para sa diin at estilong patula; ginamit ang “kayo” upang malinaw na maipahayag ang maramihang pautos.
