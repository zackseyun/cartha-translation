translation:
  language: tl
  text: Naghahari ang Diyos sa ibabaw ng mga bansa[a]; nakaupo ang Diyos sa kanyang banal na trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Naging hari na ang Diyos sa ibabaw ng mga bansa; lumuklok na ang Diyos sa kanyang banal na trono.” Maaaring unawain ang mga pandiwang perfect sa Hebreo bilang pagdidiin sa pagtatatag ng kanyang paghahari.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: Naghahari
  rationale: Ang qatal sa patulang pagpapahayag ay maaaring magpahiwatig ng kasalukuyan at namamalaging paghahari. Likas sa modernong Tagalog ang “naghahari” at hindi nito isinasara ang posibleng resultative o ingressive na diwa.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, malinaw na tumutukoy ito rito sa iisang Diyos. Pinanatili ang pag-uulit sa dalawang linya bilang diin ng Hebreo.
- source_word: עַל
  choice: sa
  rationale: Kasunod ng “naghahari,” natural na ipinapahayag ng “sa mga bansa” ang saklaw ng pamamahala sa Tagalog; hindi ito simpleng lokasyong pisikal.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansang sama-samang nasa ilalim ng paghahari ng Diyos. Iniiwasan ng saling ito ang mga konotasyong maaaring maidagdag ng “mga Hentil.”
- source_word: יָשַׁב
  choice: nakaupo
  rationale: Pinananatili nito ang konkretong larawan ng pag-upo at, dahil trono ang kasunod, likas din nitong ipinahihiwatig ang pagkaluklok bilang hari.
- source_word: כִּסֵּא
  choice: trono
  rationale: Sa maharlika at banal na kontekstong ito, “trono” ang tiyak at likas na katumbas, hindi lamang “upuan.”
- source_word: קָדְשׁוֹ
  choice: kanyang banal
  rationale: Ang literal na “trono ng kanyang kabanalan” ay gumaganap na panuring; ang “kanyang banal na trono” ang natural at tumpak na anyo sa Tagalog.
theological_decisions:
- issue: Ang paghahari ng Diyos na ipinahayag sa pamamagitan ng mga pandiwang perfect sa tulang Hebreo
  choice: 'Kasalukuyang pagpapahayag: “Naghahari ang Diyos … nakaupo ang Diyos sa kanyang banal na trono.”'
  alternative: 'Ingressive/perfective: “Naging Hari na ang Diyos … lumuklok na ang Diyos sa kanyang banal na trono.”'
  rationale: Ipinagdiriwang ng salmo ang kasalukuyan at pangkalahatang paghahari ng Diyos. Pinakamalinaw itong naihahayag sa Tagalog sa kasalukuyang anyo, habang inilalahad sa talababa ang posibleng diin sa pagtatatag o pagsisimula ng paghahari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang pagbanggit sa “ang Diyos” upang tumbasan ang patulang diin at paralelismo ng Hebreo; iniwasan ang mas denominasyonal na “mga Hentil” at ang sobrang paliwanag na “nakaluklok.”
