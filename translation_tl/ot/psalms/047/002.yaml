  text: Sapagkat si Yahweh, ang Kataas-taasan, ay dapat katakutan[a], at dakilang Hari ng buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasindak-sindak” o “kagila-gilalas.” Inilalarawan ng Hebreo si Yahweh bilang siyang pumupukaw ng mapitagang pagkatakot at paghanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng panawagan sa pagpupuri sa nakapaligid na konteksto at pinananatili ang ugnayang sanhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Pinananatili nito ang superlatibong lakas ng salita bilang banal na titulo at likas itong pakinggan sa Tagalog.
- source_word: נוֹרָא
  choice: ay dapat katakutan
  rationale: Ipinahahayag nito na si Yahweh ay pumupukaw ng taimtim na pagkatakot at paghanga, nang hindi nililimitahan ang diwa sa sindak lamang.
- source_word: מֶלֶךְ גָּדוֹל
  choice: dakilang Hari
  rationale: Pinananatili nito ang tuwirang larawan ng paghahari at ang diin sa kadakilaan at kamahalan.
- source_word: עַל כָּל הָאָרֶץ
  choice: sa buong lupa
  rationale: Sa konteksto ng paghahari ng Diyos, tumutukoy ang אֶרֶץ sa buong daigdig, hindi lamang sa isang lupain.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Diwa ng נוֹרָא kapag tumutukoy sa Diyos
  choice: dapat katakutan
  alternative: kasindak-sindak; kagila-gilalas
  rationale: Pinananatili ng pangunahing salin ang tensiyon ng pagkatakot at mapitagang paghanga. Ang “kasindak-sindak” ay maaaring magdiin nang labis sa sindak, samantalang ang “kagila-gilalas” ay maaaring magpalabo sa elemento ng pagkatakot.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang tuldok-kuwit upang malinaw na maipakita ang dalawang magkaugnay na sugnay ng maikling tulang Hebreo, habang ang idinagdag na “siya ay” ay nagbibigay ng likas na daloy sa Tagalog nang hindi binabago ang diwa.
