  terminology: Ang “Yahweh,” “Kataas-taasan,” at “dakilang Hari” ay angkop at pare-pareho sa mga terminong nasa pinagmulan. Ang “dapat katakutan” ay angkop sa mapitagang pagkatakot na saklaw ng נוֹרָא. Pinananatili ng talababa ang lehitimong mga alternatibong diwa nang hindi inaalis ang pangunahing diwa ng pagkatakot at pagkamangha.
