  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: tl
  text: Sapagkat ang Diyos ang Hari ng buong daigdig; umawit kayo nang may kaunawaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umawit kayo nang may husay,” o marahil “umawit kayo ng isang Maskil,” isang katawagang musikal o pampanitikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang panawagan sa pagpupuri.
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: ang Hari ng buong daigdig
  rationale: Pinananatili ang tuwirang pahayag ng pangkalahatang paghahari ng Diyos. Ang “daigdig” ay malinaw na tumutukoy sa buong mundo sa kontekstong ito.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan sa Hebreo, isahan ang kahulugan at tumutukoy sa Diyos ng Israel.
- source_word: זַמְּרוּ
  choice: umawit kayo
  rationale: Maramihang pautos na tumatawag sa bayan na umawit bilang papuri.
- source_word: מַשְׂכִּיל
  choice: nang may pagkaunawa
  rationale: Natural na Filipino para sa posibleng pang-abay na diwang may unawa o pananaw, habang inilalahad sa talababa ang iba pang posibleng kahulugang musikal o pampanitikan.
theological_decisions:
- issue: Saklaw ng paghahari ng Diyos
  choice: Inilalarawan ang Diyos bilang Hari ng buong daigdig.
  alternative: Maaaring literal na isalin ang הָאָרֶץ bilang “buong lupa,” ngunit maaari itong hindi gaanong malinaw na magpahayag ng pandaigdigang saklaw sa Filipino.
  rationale: Ang parirala sa konteksto ay likas na nagpapahayag ng pangkalahatang paghahari at hindi dapat paliitin sa isang lupain lamang.
- issue: Kahulugan ng מַשְׂכִּיל
  choice: nang may pagkaunawa
  alternative: “nang mahusay” o “isang Maskil”
  rationale: Hindi tiyak kung ang salita ay nagsasaad ng paraan ng pag-awit o isang katawagang musikal/pampanitikan; pinananatili ang hindi katiyakang ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang sanhi, at ang maramihang “kayo” upang katawanin ang pautos sa Hebreo.
