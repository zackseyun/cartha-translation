  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: tl
  text: Pinipili niya para sa atin ang ating mana[a]—ang karangalan ni Jacob, na minamahal niya.[b] Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pipiliin niya para sa atin ang ating mana—ang kaluwalhatian ni Jacob, na minamahal niya.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “na minamahal niya” ay maaari ring unawaing tumutukoy sa mana o lupain, sa halip na kay Jacob.
    reason: alternative_reading
  - marker: c
    text: Ang “Selah” ay isang terminong Hebreo sa pagsamba o musika na hindi tiyak ang kahulugan, kaya karaniwang hindi ito isinasalin.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: Pinipili niya
  rationale: Ang Qal imperfect ay maaaring magpahayag ng kasalukuyan o nagpapatuloy na kilos, gayundin ng kilos sa hinaharap. Ang “Pinipili niya” ay likas sa modernong Filipino at umaayon sa paglalarawan ng salmo sa patuloy na paghahari at pagkilos ng Diyos; inilalahad sa talababa ang posibleng hinaharap na diwa.
- source_word: לָנוּ
  choice: para sa atin
  rationale: 'Ipinahahayag ng ל na may hulaping unang panauhang maramihan ang kapakinabangan o pagtukoy: para sa atin o alang-alang sa atin. “Para sa atin” ang pinakanatural at malinaw.'
- source_word: נַחֲלָתֵנוּ
  choice: ating mana
  rationale: Ang נַחֲלָה ay mana, pamanang lupain, o bahaging ipinagkaloob. Pinananatili ng “mana” ang diwa ng isang kaloob o bahaging inilaan, lalo na ang lupain, nang hindi ito nililimitahan sa materyal na pag-aari lamang.
- source_word: אֶת ... אֶת
  choice: hindi isinalin nang hiwalay; ipinakita ang apposisyon sa pamamagitan ng gitling
  rationale: Ang dalawang אֶת ay pananda ng tuwirang layon. Ang ikalawa ay nagpapaliwanag o higit na tumutukoy sa “ating mana” bilang “ang karangalan ng Jacob.” Hindi nangangailangan ang Filipino ng katumbas na hiwalay na salita.
- source_word: גְּאוֹן
  choice: karangalan
  rationale: Maaaring mangahulugan ang גְּאוֹן ng kapalaluan, kadakilaan, kamahalan, o kaluwalhatian. Positibo ang gamit dito at tumutukoy sa ipinagmamalaki o marangal na bahagi ni Jacob, malamang sa mana o lupain. Iniiwasan ng “karangalan” ang karaniwang negatibong dating ng “kapalaluan” sa Filipino.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pangalan ang nasa tekstong Hebreo at may kolektibong pagtukoy sa bayang nagmula kay Jacob. Pinananatili ang “Jacob” sa halip na ipakahulugang “Israel.”
- source_word: אֲשֶׁר אָהֵב
  choice: na minamahal niya
  rationale: Pinakamadaling iugnay ang sugnay sa personal na tinutukoy na si Jacob. Ang perfect na אָהֵב ay maaaring magpahayag ng nananatiling kalagayan, kaya natural ang kasalukuyang “minamahal niya.” Nananatiling posible na ang mana o lupain ang tinutukoy, kaya itinala iyon sa talababa.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan o tungkulin ng terminong liturhikal o pangmusika. Isinalin ito sa baybay na “Selah” sa halip na bigyan ng haka-hakang kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng “na minamahal niya”
  choice: Pangunahing iniugnay ang sugnay kay Jacob.
  alternative: 'Maaari ring tumukoy ang sugnay sa mana o lupain: “ang karangalan ng Jacob, na minamahal niya.”'
  rationale: Si Jacob ang pinakamalapit na personal at panlalaking isahan na tinutukoy, at karaniwan sa Kasulatan ang wika tungkol sa pag-ibig ng Diyos kay Jacob o Israel. Gayunman, dahil maaari ring umugnay ang sugnay sa mana o lupain sa daloy ng Hebreo, hindi inalis ang tunay na kalabuan at ipinaliwanag ito sa talababa.
- issue: Panahon o aspekto ng pagpili ng Diyos
  choice: 'Kasalukuyan o nagpapatuloy: “Pinipili niya.”'
  alternative: 'Hinaharap: “Pipiliin niya.”'
  rationale: Hindi sapilitang tinutukoy ng Hebrew imperfect kung kasalukuyan o hinaharap ang kilos. Ang pangunahing salin ay umaayon sa nagpapatuloy na paghahari ng Diyos sa konteksto, habang pinananatili sa talababa ang lehitimong pagbasa sa hinaharap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mana” para sa covenantal at nakalaang bahagi, at “karangalan” para sa positibong diwa ng גְּאוֹן. Ang gitling ay nagpapakita na ang “karangalan ng Jacob” ay nagpapaliwanag sa “ating mana.” Lahat ng panandang talababa ay nasa pangunahing teksto at tugma sa mga talababa.
