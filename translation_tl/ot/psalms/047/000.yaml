lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ang salita sa taong namamahala sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang “tagapangasiwa ng awitan,” at pinananatili ng “para sa” ang malamang na gamit ng pang-ukol na ל, habang kinikilala sa talababa na maaari rin itong unawaing “sa.”
- source_word: לִבְנֵי
  choice: Sa mga anak ni
  rationale: Maaaring magpahiwatig ang ל ng kaugnayan, pagtatalaga, o pagkatha. Ang payak na “sa mga anak ni Kora” ay hindi tahasang nagpapasya kung ang salmo ay para sa kanila o likha nila; inilalahad sa talababa ang mga pangunahing posibilidad.
- source_word: קֹרַח
  choice: Kora
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal na Korah.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang מִזְמוֹר ay karaniwang katawagan sa uring pampanitikan at pangmusikang “salmo”; natural sa Filipino ang “Isang salmo” bilang hiwalay na bahagi ng pamagat.
