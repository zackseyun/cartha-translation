source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: tl
  text: Nagtipon ang mga maharlika ng mga bayan bilang bayan ng Diyos ni Abraham[a], sapagkat pag-aari ng Diyos ang mga kalasag ng lupa[b]; siya ay lubhang itinanghal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ng bayan ng Diyos ni Abraham.” Maaaring magpahayag ang pariralang Hebreo ng malapit na pakikisama o ng pagkakakilanlan.
    reason: alternative_reading
  - marker: b
    text: Maaaring ang ibig sabihin ng “mga kalasag ng lupa” ay “mga pinuno ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: mga maharlika
  rationale: Tumutukoy ang salita sa mga taong may mataas na katayuan, gaya ng mga maharlika o prinsipe. Pinananatili ng “mga maharlika” ang diwa ng ranggo nang hindi agad ipinapakahulugang sila ay mga namumuno.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Ipinahihiwatig ng maramihan ang sari-saring pangkat ng tao. Likas sa makabagong Filipino ang “mga bayan” at hindi nito labis na binibigyang-diin ang makabagong ideya ng bansang-estado.
- source_word: נֶאֱסָפוּ
  choice: nagtipon
  rationale: Ang anyong Niphal dito ay likas na nagpapahayag na sila ay nagkatipon o nagtipon, hindi na may tahasang ibang gumawa ng kilos sa kanila.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: bilang bayan ng Diyos ni Abraham
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang pariralang Hebreo. Ipinahahayag ng “bilang” ang posibleng pagkakakilanlan ng mga nagtipon sa bayan ng Diyos ni Abraham, habang inilalagay sa talababa ang pagbasa na sila ay nagtipong kasama ng bayang iyon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan o paliwanag ng naunang pahayag.
- source_word: לֵאלֹהִים
  choice: pag-aari ng Diyos
  rationale: Ang pang-ukol na לְ ay nagpapahayag rito ng pag-aari o pagkapabilang sa Diyos; malinaw at natural ito sa Filipino.
- source_word: מָגִנֵּי אֶרֶץ
  choice: mga kalasag ng lupa
  rationale: Ito ang tuwirang larawan sa Hebreo. Malamang na sagisag ito ng mga pinuno o tagapagtanggol, ngunit pinananatili sa teksto ang matitingkad na salitang patalinghaga at nililinaw ang posibleng kahulugan sa talababa.
- source_word: מְאֹד נַעֲלָה
  choice: lubha siyang mataas
  rationale: Ang panlalaking isahang anyo ay natural na tumutukoy sa Diyos sa agarang konteksto. Ipinahahayag ng “lubha siyang mataas” ang kaniyang sukdulang kataasan nang hindi ginagawang literal na pag-akyat ang pandiwa.
theological_decisions:
- issue: Kaugnayan ng mga maharlika ng mga bayan sa bayan ng Diyos ni Abraham
  choice: Nagtipon sila bilang bayan ng Diyos ni Abraham.
  alternative: Nagtipon sila kasama ng bayan ng Diyos ni Abraham.
  rationale: Maaaring magpahiwatig ang siksik na pariralang Hebreo ng pagkakakilanlan o ng malapit na pakikisama. Ang “bilang” ay umaayon sa konteksto ng paghahari ng Diyos sa mga bayan, ngunit pinananatili sa talababa ang alternatibong pagbasa upang hindi tuluyang lutasin ang tunay na kalabuan.
- issue: Kahulugan ng “mga kalasag ng lupa”
  choice: Pinanatili ang larawan ng mga kalasag sa pangunahing teksto.
  alternative: Isalin nang tuwiran bilang “mga pinuno ng lupa.”
  rationale: Maaaring tawag ang “mga kalasag” sa mga pinuno o tagapagtanggol, ngunit mahalaga ang orihinal na larawan. Iniiwasan ng pangunahing teksto na gawing tiyak ang isang posibleng pagpapakahulugan lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang larawang “mga kalasag ng lupa” at ang kalabuan ng kaugnayan ng mga bayan sa bayan ng Diyos ni Abraham sa pamamagitan ng maikli at malinaw na mga talababa.
