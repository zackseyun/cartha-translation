  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: tl
  text: 'Ipinaiilalim niya sa amin ang mga bayan[a],

    at ang mga bansa sa ilalim ng aming mga paa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Pinasusuko niya sa amin ang mga bayan.” Ang pandiwang Hebreo rito ay nangangahulugang pasukuin o ipailalim, hindi magsalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: Pinasusuko niya
  rationale: Sa kontekstong may tuwirang layong “mga bayan” at kaagapay na larawang “sa ilalim ng aming mga paa,” ang pandiwa ay nangangahulugang pasukuin o ipailalim, hindi magsalita.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Ang “mga bayan” ay tumutukoy sa mga pangkat ng tao at pinananatili ang bahagyang pagkakaiba nito sa לְאֻמִּים, na isinaling “mga bansa.”
- source_word: תַּחְתֵּינוּ
  choice: sa amin
  rationale: Sa pariralang “pinasusuko ... sa amin,” likas sa modernong Tagalog ang diwang pagpapailalim, bagaman hindi inuulit nang tahasan ang salitang “ilalim.”
- source_word: וּלְאֻמִּים
  choice: at ... ang mga bansa
  rationale: Ang “mga bansa” ay natural na katumbas at tumutulong mapanatili ang pagkakaiba sa “mga bayan” sa unang taludtod.
- source_word: תַּחַת רַגְלֵינוּ
  choice: sa ilalim ng aming mga paa
  rationale: Pinananatili nito ang kongkretong larawan at ang idyoma ng pananakop o pagpapasakop.
theological_decisions:
- issue: Sama-samang tinig at ang Diyos bilang kumikilos sa pananakop
  choice: Ang Diyos ang nagpapasuko sa ibang mga bayan para sa kapakanan ng nagsasalitang pangkat, gaya ng ipinahihiwatig ng “sa amin” at “aming.”
  alternative: Isang pangkalahatang pahayag tungkol sa tagumpay-militar ng Israel o ng hari.
  rationale: Ang agarang konteksto ay nag-uukol sa Diyos ng paghahari at tagumpay. Pinananatili ng salin ang pangmaramihang tinig at ang matinding larawan ng pagpapasakop nang hindi ito pinahihina o binibigyan ng mas huling teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinasusuko” upang natural na maipahayag ang causative na diwa, habang pinanatili sa ikalawang taludtod ang literal at makapangyarihang larawang “sa ilalim ng aming mga paa.”
