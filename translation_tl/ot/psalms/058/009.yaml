  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: tl
  text: Bago pa maramdaman ng inyong mga palayok ang matinik na palumpong[a]—sariwa man o nagliliyab—tatangayin niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang Hebreo. Mas literal: “Bago mapansin ng inyong mga palayok ang matinik na palumpong, gaya ng sariwa, gaya ng nagliliyab/matinding galit, tatangayin niya ito/siya.” Malamang na ang larawan ay biglaang pagtangay bago pa mapainit ng apoy ang mga palayok. Maaari ring unawain ang huling bahagi na “tatangayin niya sila sa matinding galit.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Bago pa
  rationale: Malinaw na panandang temporal na nagpapanatili sa diwa ng biglaang pangyayari bago maganap ang inaasahang resulta.
- source_word: יָבִינוּ
  choice: maramdaman
  rationale: Karaniwan itong nangangahulugang “maunawaan” o “mapansin,” ngunit dahil mga palayok ang simuno, ang “maramdaman” ang likas na paraan upang ipahiwatig ang pagkadama sa init nang hindi lubusang nilulutas ang mahirap na larawan.
- source_word: סִּירֹתֵיכֶם
  choice: inyong mga palayok
  rationale: Tumutukoy sa mga sisidlang panluto; karaniwan at malinaw sa modernong Tagalog ang “mga palayok.”
- source_word: אָטָד
  choice: matinik na palumpong
  rationale: Pinananatili ang kongkretong larawan ng halamang matinik na maaaring gamiting mabilis masunog na panggatong.
- source_word: כְּמוֹ חַי
  choice: sariwa man
  rationale: Sa konteksto ng panggatong, ang literal na “buhay” ay malamang na tumutukoy sa sariwa o luntiang kahoy; natural sa Tagalog ang “sariwa” at hindi nangangahulugang literal na may buhay.
- source_word: כְּמוֹ חָרוֹן
  choice: o nagliliyab
  rationale: Maaaring tumukoy ang חָרוֹן sa matinding galit, ngunit sa larawan ng apoy ay maaari ring magpahiwatig ng paglalagablab; pinananatili ng “nagliliyab” ang agarang larawang thermal.
- source_word: יִשְׂעָרֶנּוּ
  choice: tatangayin niya ang mga iyon
  rationale: Ipinahihiwatig ng pandiwa ang marahas na pagpapaikot o pagtangay na gaya ng bagyo. Ang “tatangayin” ay natural at nagpapanatili sa biglaan at marahas na pag-aalis; ang panghalip ay iniangkop sa mga palayok sa pangunahing pagbasa, habang itinatala sa talababa ang kalabuan ng Hebreo.
theological_decisions:
- issue: Kahulugan ng napakahirap na larawang patula at ng חָרוֹן sa Awit 58:9
  choice: Inilalarawan ang biglaang pagtangay bago pa mapainit ng matinik na panggatong ang mga palayok, sariwa man ang panggatong o nagliliyab na.
  alternative: Maaaring unawain ang huling bahagi bilang pagtangay “sa matinding galit,” at malabo rin kung ano o sino ang tinutukoy ng isahang layon sa Hebreo.
  rationale: Pinananatili ng pangunahing salin ang kongkretong larawan ng apoy at ang diwa ng biglaang paghatol, ngunit hindi ikinukubli ng talababa ang sintaktikong kalabuan o ang posibleng kahulugang “matinding galit.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “matinik na palumpong” sa halip na mas teknikal o makalumang katawagan, at pinanatili sa talababa ang tunay na kalabuan ng Hebreo.
