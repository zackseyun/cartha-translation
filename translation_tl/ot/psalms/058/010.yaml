  terminology: Ang “matuwid,” “pagganti,” “dugo,” at “masama” ay angkop at pare-pareho sa rehistrong biblikal na modernong Filipino. Hindi pinalalambot ng “pagganti” ang lakas ng נָקָם, at hindi rin nito ipinapasok ang hindi sinasabing doktrinal na pagpapakahulugan.
