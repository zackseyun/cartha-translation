  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: tl
  text: Magsasaya ang matuwid kapag nakita niya ang pagganti[a]; huhugasan niya ang kanyang mga paa sa dugo ng masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dahil nakita niya ang pagganti.” Maaari ring unawain ang salitang Hebreo bilang nagsasaad ng sanhi (“dahil/sapagkat”) sa halip na panahon (“kapag”).
    reason: lexical_alternative
  - marker: b
    text: Ang larawang “huhugasan niya ang kanyang mga paa sa dugo ng masama” ay patulang paglalarawan sa lubos na paglalapat ng hatol, hindi isang utos na gumawa ng personal na karahasan.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: Magsasaya
  rationale: Ang Qal imperfect ay may hinaharap na diwa sa kontekstong patula; natural at malinaw ang “magsasaya” sa modernong Filipino.
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Pang-uring isahan na ginamit bilang pangngalan. Pinananatili ng “ang matuwid” ang isahang anyo at maaari ring kumatawan sa uri ng taong matuwid.
- source_word: כִּי
  choice: kapag
  rationale: Ipinakikita rito ang pangyayaring kasabay o sanhi ng pagsasaya. Natural na naihahatid ng “kapag” ang temporal na diwa, habang inilalahad sa talababa ang posibleng sanhiing pagbasa.
- source_word: חָזָה
  choice: nakita niya
  rationale: Bagaman perfect ang anyong Hebreo, natural sa Filipino ang aspektong naganap sa sugnay na pinangungunahan ng “kapag” sa loob ng pahayag na nakatuon sa hinaharap.
- source_word: נָקָם
  choice: pagganti
  rationale: Tuwirang katumbas ito ng paghihiganti o paggawad ng ganti at hindi nito pinahihina ang bigat ng hatol bilang simpleng “pagbibigay-katarungan.”
- source_word: פְּעָמָיו
  choice: ang kanyang mga paa
  rationale: Bagaman maaaring tumukoy ang salita sa mga hakbang o yapak, hinihingi ng larawang paghuhugas sa dugo ang kongkretong kahulugang “mga paa.”
- source_word: יִרְחַץ
  choice: huhugasan niya
  rationale: Pinananatili nito ang hinaharap na diwa ng Qal imperfect at ang tuwirang kilos ng paghuhugas.
- source_word: בְּדַם
  choice: sa dugo
  rationale: Likas na ipinapahayag ng “sa” ang lokatibong larawan ng paghuhugas ng mga paa sa dugo at pinananatili ang matinding talinghaga.
- source_word: הָרָשָׁע
  choice: ng masama
  rationale: Ang isahang pang-uri na ginamit bilang pangngalan ay natural na maisasalin bilang “ang masama,” na maaaring tumukoy sa isang kinatawang tao o sa masasama bilang uri.
theological_decisions:
- issue: Kung personal na paghihiganti ba ang inilalarawan o pagsasaya sa makatarungang hatol
  choice: Pinanatili ang pagsasaya sa pagkakita ng pagganti at ang marahas na larawan nang hindi tinutukoy sa pangunahing teksto kung sino ang nagsasagawa nito.
  alternative: Linawin ito bilang personal na paghihiganti o tahasang tawaging pagganti ng Diyos.
  rationale: Hindi tahasang sinasabi sa talata ang tagapagsagawa ng pagganti. Ang salin ay hindi nagdaragdag ng “ng Diyos” at hindi rin ginagawang utos para sa personal na karahasan, kaya nananatili ang tunay na teolohikal na tensiyon ng imprekatoryong pananalita.
translation_notes:
  register: Modernong Filipino na dignificado ngunit madaling maunawaan. Pinanatili ang matinding larawang patula at iniwasan ang arkaykong pananalita, pagpapalabnaw sa “pagganti,” at pagdaragdag ng denominasyonal na paliwanag.
