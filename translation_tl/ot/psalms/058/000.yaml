  text: 'Para sa tagapangasiwa ng musika: “Huwag Mong Wasakin.”[a] Kay David. Isang miktam.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “ayon sa ‘Huwag Mong Wasakin,’” kung ang parirala ay mas tahasang tumutukoy sa himig o ayos sa musika.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo na miktam ay isang katawagan sa awit na hindi tiyak ang kahulugan; maaaring tumukoy ito sa isang uri ng komposisyon o ayos sa musika.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Karaniwang pormula ito sa mga pamagat ng Awit para sa taong nangangasiwa sa musikang panambahan. Likas sa modernong Filipino ang parirala at hindi nito nililimitahan ang tungkulin sa koro lamang.
- source_word: אַל תַּשְׁחֵת
  choice: “Huwag Mong Wasakin”
  rationale: Pinanatili ang anyong pautos ng Hebreo habang ipinakikita ng panipi at malalaking titik na malamang na pamagat ito ng himig o ayos sa musika. Ipinaliliwanag sa talababa ang posibleng mas tahasang ugnayang musikal.
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Maaaring tumukoy ang לְ sa pagkakatha, pag-aalay, o kaugnayan kay David. Hindi tulad ng “ni David,” hindi tiyak na iginigiit ng “ukol kay David” ang pagkakatha niya.
- source_word: מִכְתָּם
  choice: Isang miktam
  rationale: Hindi tiyak ang kahulugan ng teknikal na katawagang ito. Ang transliterasyon ang umiiwas sa haka-hakang salin at nagpapanatili rito bilang katawagang pampanitikan o pangmusika.
theological_decisions:
- issue: Kalikasan ng mga katawagan sa pamagat ng Awit
  choice: Ituring ang linya bilang pamagat na bahagi ng teksto at panatilihing bukas ang kahulugan ng mga katawagang pangmusika at pampanitikan.
  alternative: Basahin ang “Huwag Mong Wasakin” bilang tuwirang utos sa nilalaman ng awit at isalin ang לְדָוִד bilang tahasang “ni David.”
  rationale: Hindi tahasang tinutukoy ng Hebreo kung himig ang parirala o kung pagkakatha ang saklaw ng לְדָוִד. Iniiwasan ng salin ang pagtiyak sa mga bagay na nananatiling malabo sa pinagmulan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tagapangasiwa ng awitan” para sa liturhikal na tungkulin, “ukol kay David” upang mapanatili ang lawak ng Hebreong לְ, at transliterasyong “miktam” dahil hindi tiyak ang kahulugan nito.
