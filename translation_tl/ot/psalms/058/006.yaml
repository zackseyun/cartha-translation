  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: tl
  text: O Diyos, baliin mo ang kanilang mga ngipin sa kanilang mga bibig; durugin mo ang mga pangil[a] ng mga batang leon, O Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ngiping pandurog” o “mga ngipin sa panga.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; karaniwan din itong isinasalin na “ang PANGINOON.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos; natural at marangal sa makabagong Tagalog ang “O Diyos.”
- source_word: הֲרָס
  choice: baliin mo
  rationale: Ang pautos na anyo ng הרס ay nangangahulugang gibain o wasakin; kapag mga ngipin ang layon, malinaw at matindi ang “baliin.”
- source_word: שִׁנֵּימוֹ
  choice: ang kanilang mga ngipin
  rationale: Tuwirang inililipat ang pangngalang maramihan na may hulaping tumutukoy sa ikatlong panauhang maramihan.
- source_word: בְּפִימוֹ
  choice: sa loob ng kanilang bibig
  rationale: Pinananatili ang lokatibong diwa ng ב at ang kongkretong larawan ng mga ngiping nasa bibig, sa halip na ipakahulugang inaalis mula rito.
- source_word: מַלְתְּעוֹת
  choice: mga pangil
  rationale: Tumutukoy ang salita sa malalakas na ngiping pandurog o mga ngipin sa panga; sa larawan ng mga leon, likas at mabisa ang “mga pangil,” habang itinatala sa talababa ang mas tiyak na alternatibo.
- source_word: כְּפִירִים
  choice: mga batang leon
  rationale: Karaniwang tumutukoy sa malalakas na leon na bata pa, hindi lamang sa maliliit na anak ng leon; pinananatili nito ang mapanganib na larawang mandaragit.
- source_word: נְתֹץ
  choice: durugin mo
  rationale: Ang pautos mula sa נתץ ay maaaring mangahulugang gibain, basagin, o wasakin. Ang “durugin” ay angkop sa mga ngipin at nagpapanatili sa marahas na puwersa ng paralelismo nang ipalagay na binunot ang mga ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” at hindi pinapalitan ng titulong “PANGINOON.”
- issue: Marahas na larawan ng sumpang panalangin
  choice: Panatilihin ang literal na kahilingang baliin at durugin ang mga ngipin o pangil
  alternative: Palambutin bilang “alisin mo ang kanilang kapangyarihan”
  rationale: Kongkreto at sadyang marahas ang larawan sa Hebreo. Hindi ito dapat gawing abstraktong pahayag, sapagkat mababago ang tindi at tensiyong teolohikal ng panalangin.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang tuwirang panawagan, matinding pautos, konkretong larawang pisikal, at paralelismo ng dalawang taludtod. Inilagay ang mga tanda ng talababa sa mismong salitang nililinaw ng bawat tala.
