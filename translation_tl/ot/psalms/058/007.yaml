  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: tl
  text: Matunaw nawa sila gaya ng tubig na umaagos palayo[a]; kapag itinutok niya ang kaniyang palaso[b], maging parang naputol sila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na umaagos at nawawala.” Inilalarawan ng Hebreo ang tubig na lumalayo hanggang maglaho.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kaniyang palaso” (isahan); maaari rin itong unawain bilang kolektibong “kaniyang mga palaso.”
    reason: lexical_alternative
  - marker: c
    text: Mahirap tiyakin ang teksto at kahulugan ng huling parirala. Kabilang sa ibang posibleng salin ang “maging mapurol sila” at “malanta sila.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: Matunaw nawa sila
  rationale: Sa larawan ng tubig at sa kontekstong panawagan, ipinahihiwatig ng anyo ng pandiwa ang pagkatunaw o paglaho; pinananatili ng “nawa” ang diwang pakiusap o sumpa.
- source_word: כְמוֹ מַיִם
  choice: gaya ng tubig
  rationale: Tuwirang pinananatili ang paghahambing at likas itong pakinggan sa modernong Tagalog.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: na umaagos palayo
  rationale: Inilalarawan nito ang tubig na patuloy na gumagalaw, lumalayo, at nawawala; hindi isinama sa pangunahing teksto ang malabong pronominal na לָמוֹ dahil hindi tiyak ang tungkulin nito rito.
- source_word: יִדְרֹךְ
  choice: kapag itinutok niya
  rationale: Sa larangan ng pana, tumutukoy ang pandiwa sa paghahanda o pagbanat upang ipana; ang “itinutok” ay natural sa Tagalog at nakaugnay sa tahasang layon na palaso.
- source_word: חצ/ו
  choice: ang kaniyang palaso
  rationale: Pinananatili ang anyong isahan ng tekstong Hebreo, bagaman maaari itong unawain bilang kolektibo.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: maging para itong naputol
  rationale: Mahirap at pinagtatalunan ang huling pandiwa. Ang saling ito ay nagpapanatili sa ideya ng pagkaputol at pagkawala ng bisa nang hindi ipinipilit ang mas tiyak na “mapurol” o “malanta.”
