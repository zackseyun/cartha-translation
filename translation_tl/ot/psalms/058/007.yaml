  register: Makata, marangal, at malinaw na modernong Tagalog. Ginamit ang “nawa” upang maipahayag ang imprecatory/jussive na himig. Ang mga panghalip sa ikalawang hati ay pinanatiling isahan ayon sa anyo ng “palaso,” habang inilalahad sa talababa ang kolektibong pagbasa.
