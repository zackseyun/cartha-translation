  yaml_path: translation/ot/psalms/058/004.yaml
  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: tl
  text: 'Ang kanilang kamandag ay tulad ng kamandag ng ahas,

    tulad ng ulupong[a] na bingi at nagtatakip ng tainga nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asp” o “kobra”; ang Hebreong פֶתֶן ay tumutukoy sa isang makamandag na ahas at tradisyonal na isinasaling “asp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: kamandag
  rationale: Sa pagkakaugnay nito sa ahas, ang salita ay natural na tumutukoy sa lason ng hayop; ang “kamandag” ang tiyak at karaniwang salitang Filipino para rito.
- source_word: לָמוֹ
  choice: kanilang
  rationale: 'Sa idyomang ito, ang panghalip ay gumaganap bilang paari kaugnay ng kasunod na pangngalan: “ang kanilang kamandag.”'
- source_word: כִּדְמוּת
  choice: ay tulad ng
  rationale: Ipinakikilala ng konstruksiyon ang isang tahasang paghahambing; natural itong ipinapahayag sa Filipino bilang “ay tulad ng.”
- source_word: נָחָשׁ
  choice: ahas
  rationale: Ito ang malinaw at pangkalahatang tawag sa serpent o snake sa modernong Filipino, at naihihiwalay sa mas tiyak na uri sa kasunod na taludtod.
- source_word: כְּמוֹ
  choice: tulad ng
  rationale: Direkta at natural na panandang paghahambing sa Filipino.
- source_word: פֶתֶן
  choice: ulupong
  rationale: Tumutukoy ang Hebreo sa isang makamandag na ahas na tradisyonal na isinasaling asp. Ang “ulupong” ay isang pamilyar at marangal na katawagang Filipino sa makamandag na ahas, nang hindi naggigiit ng tiyak na makabagong pagkakakilanlang zoolohikal.
- source_word: חֵרֵשׁ
  choice: bingi
  rationale: Ang larawan ay ahas na hindi nakikinig; “bingi,” hindi “pipi,” ang wastong diwa.
- source_word: יַאְטֵם
  choice: nagtatakip
  rationale: Ipinahihiwatig ng pandiwa ang pagsasara o pagtatakip. Ang “nagtatakip ng tainga” ay malinaw at nagpapanatili sa matingkad na larawan.
- source_word: אָזְנוֹ
  choice: tainga nito
  rationale: Tumutukoy ang panlalaking hulapi sa ahas; sa natural na Filipino, “nito” ang angkop na pagtukoy sa hayop.
