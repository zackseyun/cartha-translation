translation_notes:
  register: Makabagong Filipino na may dignidad at bahagyang makatang himig. Pinanatili ang pag-uulit ng “kamandag” at ang paralelismong Hebreo. Ginamit ang “ulupong” sa pangunahing teksto upang maiwasan ang sobrang tiyak na pagkilala sa uri ng ahas, habang inilagay sa talababa ang mga tradisyonal at modernong alternatibo.
