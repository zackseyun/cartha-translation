  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: tl
  text: Talaga bang nagsasalita kayo ng katuwiran sa katahimikan?[a] Humahatol ba kayo nang matuwid, kayong mga anak ng tao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap unawain ang Hebreong אֵלֶם. Binibigkas ito ng Masoretic Text bilang “katahimikan” o “pagkawalang-kibo.” Marami naman ang bumabasa rito bilang “mga makapangyarihan,” o maging “mga diyos,” kaya maaaring isalin: “Talaga bang nagsasalita kayo ng katuwiran, kayong mga makapangyarihan?”'
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mga anak ng tao”; maaari ring unawain bilang “mga tao” o “mga mortal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: Talaga bang
  rationale: Pinananatili nito ang mariing puwersa ng retorikal na tanong at ang mapanuyang hamon ng salmista.
- source_word: אֵלֶם
  choice: sa katahimikan
  rationale: Sinusunod ng pangunahing teksto ang pagbigkas ng Masoretic Text na tumutukoy sa katahimikan o pagkawalang-kibo. Bagaman sadyang palaisipan ang parirala, hindi ito tahimik na pinapalitan ng isang mas madaling alternatibong pagbasa.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Saklaw nito ang moral at panghukom na diwa ng pangngalan at likas itong naiuugnay sa sinasabi ng mga kinakausap.
- source_word: תְּדַבֵּרוּן
  choice: nagsasalita kayo
  rationale: Tuwirang katumbas ito ng pandiwa at malinaw na nagpapakita ng pangmaramihang kausap.
- source_word: מֵישָׁרִים
  choice: nang matuwid
  rationale: Ipinahahayag nito ang pagiging matapat, patas, at tama sa paghatol habang pinananatili ang larawan ng 'tuwid' na nasa Hebreo.
- source_word: תִּשְׁפְּטוּ
  choice: humahatol kayo
  rationale: Pinananatili nito ang malinaw na panghukom na gamit ng pandiwa.
- source_word: בְּנֵי אָדָם
  choice: kayong mga anak ng tao
  rationale: Pinananatili ang literal na anyo at mortal na diin ng pariralang Hebreo. Idinagdag ang 'kayong' upang maging malinaw at natural ang panawagan sa dulo ng pangungusap sa Tagalog.
theological_decisions:
- issue: Kahulugan ng mahirap na salitang אֵלֶם
  choice: Sinunod sa pangunahing teksto ang Masoretic na pagbasa na 'katahimikan.'
  alternative: Basahin bilang tuwirang tawag sa 'mga makapangyarihan' o 'mga diyos.'
  rationale: Mahirap ang anyo ng tekstong Hebreo, at malaki ang epekto ng alternatibong pagbasa sa kahulugan ng talata. Kaya pinanatili sa pangunahing teksto ang natanggap na pagbigkas ngunit malinaw na inilagay sa talababa ang matagal nang kinikilalang ibang posibilidad.
- issue: Saklaw ng panawagang בְּנֵי אָדָם
  choice: Inilagay sa hulihan bilang panawagan sa mga taong siyang paksa ng dalawang retorikal na tanong.
  alternative: Ilipat sa unahan upang gawing tahasang saklaw nito ang dalawang tanong.
  rationale: Ang hulihang puwesto ay sumusunod sa ayos ng Hebreo; ang 'kayong' ay tumutulong upang malinaw na panawagan ito sa mga kausap at hindi lamang bahagi ng ikalawang sugnay.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang sadyang palaisipang 'sa katahimikan' dahil iyon ang pangunahing patotoo ng Masoretic Text, at ginamit ang natural na retorikal na 'Talaga bang ...?' Ang 'kayong' sa hulihang panawagan ay nagpapalinaw sa sintaks nang hindi binabago ang ayos at tensiyon ng Hebreo.
