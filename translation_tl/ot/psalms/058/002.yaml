  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: tl
  text: Maging sa puso ninyo ay gumagawa kayo ng kawalang-katarungan; sa lupa[b], tinitimbang[a] ng inyong mga kamay ang karahasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinusukat.” Maaaring tumukoy ang pandiwang Hebreo sa pagtimbang o pagsukat.
