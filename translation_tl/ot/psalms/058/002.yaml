  - marker: b
    text: O, “sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: nga
  rationale: Ginamit bilang panandang nagbibigay-diin sa paratang; likas sa modernong Tagalog ang “nga” sa ganitong gamit.
- source_word: בְּלֵב
  choice: sa inyong puso
  rationale: Pinananatili ang lokatibong diwa at ang “puso” bilang kaloob-loobang pinagmumulan ng layunin; idinagdag ang panghalip ayon sa maramihang kausap na malinaw sa mga pandiwa.
- source_word: עוֹלֹת
  choice: kawalang-katarungan
  rationale: Tumutukoy sa moral na kamalian o inhustisya at umaangkop sa kontekstong may kinalaman sa baluktot na paghatol.
- source_word: תִּפְעָלוּן
  choice: gumagawa kayo
  rationale: Tuwirang inilalarawan ang sinasadya at aktibong paggawa ng masama.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Pinananatili ang malawak na kahulugang “earth,” habang inilalagay sa talababa ang posibleng “lupain.”
- source_word: חֲמַס
  choice: karahasan
  rationale: Ito ang tuwiran at karaniwang kahulugan ng salitang tumutukoy rin sa marahas na kasamaan.
- source_word: יְדֵיכֶם
  choice: inyong mga kamay
  rationale: Pinananatili ang kongkretong larawan ng mga kamay bilang tagagawa at tagapamahagi ng karahasan.
- source_word: תְּפַלֵּסוּן
  choice: tinitimbang
  rationale: Pinananatili ang metapora ng pagtimbang o pagsukat at ang kabalintunaan na karahasan, sa halip na katarungan, ang kanilang ibinabahagi.
theological_decisions:
- issue: Metaporikong puwersa ng huling pandiwa sa konteksto ng paghatol
  choice: “tinitimbang” upang mapanatili ang larawan ng maingat na pagsukat o pamamahagi
  alternative: “sinusukat” o “ipinamamahagi”
  rationale: Pinananatili ng “tinitimbang” ang ironiyang ang mga dapat humatol nang matuwid ay karahasan ang kanilang sinusukat. Pampanitikan at leksikal ang pasyang ito, hindi pagtatakda ng isang natatanging doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang parallelism sa pagitan ng panloob na paggawa ng kawalang-katarungan at ng hayagang karahasang ginagawa ng mga kamay, pati ang metapora ng pagtimbang.
