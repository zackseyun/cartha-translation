translation:
  language: tl
  text: na hindi nakikinig sa tinig ng mga bumubulong[a], ng bihasang tagapagbigkas ng mga salamangka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tunog ng mga bumubulong.” Ang salitang Hebreo ay kaugnay ng pagbulong o pagbigkas ng inkantasyon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isang nagbibigkis ng mga salamangka, dalubhasa.” Isa itong idyoma para sa isang ekspertong gumagamit o tagapagbigkas ng mga pormulang mahiwaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pang-ugnay na nagpapatuloy sa paglalarawan sa bingíng ulupong sa naunang talata.
- source_word: לֹא יִשְׁמַע
  choice: hindi nakikinig
  rationale: Ipinahihiwatig ng di-ganap na pandiwa ang palagian o likas na hindi pagtugon; mas angkop ang “nakikinig” kaysa simpleng “nakakarinig” sa larawan ng ahas na hindi tumatalima.
- source_word: לְקוֹל
  choice: sa tinig
  rationale: Maaaring mangahulugang “tinig” o “tunog” ang קוֹל; ang “tinig” ay angkop dahil mga taong bumibigkas ng orasyon ang kasunod.
- source_word: מְלַחֲשִׁים
  choice: mga bumubulong ng orasyon
  rationale: Nagmula ang salita sa ugat na kaugnay ng pagbulong at inkantasyon. Pinananatili ng salin ang paraan ng pagbigkas at ang mahiwagang konteksto nang hindi lamang gumagamit ng malabong katawagang “manggagaway.”
- source_word: חוֹבֵר חֲבָרִים
  choice: bumibigkas ng engkanto
  rationale: Ang literal na idyoma ay may diwang “nagbibigkis ng mga engkanto/orasyon.” Ang natural na pariralang Filipino ay naghahatid ng tungkulin ng isang tagapagbigkas ng mahiwagang pormula.
- source_word: מְחֻכָּם
  choice: bihasang
  rationale: Tumutukoy ito rito sa husay o kadalubhasaan, hindi sa moral na karunungan.
