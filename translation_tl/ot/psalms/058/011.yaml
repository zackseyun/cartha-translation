  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: tl
  text: At sasabihin ng mga tao, “Tunay na may bunga para sa matuwid; tunay na may Diyos na humahatol[a] sa lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “humahatol” ay nasa anyong pangmaramihan. Maaari itong unawain na tumutukoy sa iisang Diyos sa kabila ng plural na anyo; ang mas di-malamang na pagbasa ay “may mga diyos na humahatol sa lupa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: At sasabihin ng mga tao
  rationale: Ang Qal imperfect na יֹאמַר ay angkop na unawaing panghinaharap o bunga ng naunang tagpo ng paghatol. Ang singular na אָדָם ay generic at likas na naipahahayag sa makabagong Filipino bilang “mga tao.”
- source_word: אַךְ
  choice: Tunay na
  rationale: Sa dalawang paglitaw nito, nagpapahayag ang kataga ng mariing pagpapatibay, hindi ng pagtatakda o paglilimita.
- source_word: פְּרִי לַצַּדִּיק
  choice: may bunga para sa matuwid
  rationale: Pinananatili ng “bunga” ang konkretong talinghagang Hebreo para sa kinalabasan o gantimpala; ang “para sa matuwid” ay tumutukoy sa kapakinabangang matatanggap niya.
- source_word: יֵשׁ אֱלֹהִים
  choice: may Diyos
  rationale: Ang יֵשׁ ay eksistensiyal. Sa Filipino, natural at malinaw ang “may Diyos,” na nagpapahayag na talagang umiiral at kumikilos ang Diyos.
- source_word: שֹׁפְטִים בָּאָרֶץ
  choice: na humahatol sa lupa
  rationale: Bagaman plural ang anyo ng participle, pinakamalamang na ang tinutukoy ay ang iisang Diyos; ang “humahatol” ay natural na singular na sugnay. Ang בָּאָרֶץ ay tumutukoy sa daigdig bilang larangan ng kanyang paghatol.
theological_decisions:
- issue: Kung singular o plural ang אֱלֹהִים שֹׁפְטִים
  choice: “may Diyos na humahatol”
  alternative: “may mga diyos na humahatol” o mas literal na anyong nagpapakita ng plural na participle
  rationale: Ang konteksto ay humahantong sa pagkilala sa katarungan ng iisang tunay na Diyos. Gayunman, tunay na plural ang morpolohiya ng שֹׁפְטִים, kaya itinatala sa talababa ang pormal na tensiyon sa halip na itago ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghagang “bunga” at ang dalawang mariing “Tunay na.” Inilagay ang footnote marker sa dulo ng sugnay na nangangailangan ng paliwanag.
