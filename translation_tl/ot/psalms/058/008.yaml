  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: tl
  text: 'Gaya ng susô na natutunaw habang gumagapang,

    gaya ng batang patay nang isilang na hindi nakakita ng araw.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang sintaks ng Hebreo sa ikalawang paghahambing. Sa mas literal na anyo: “ang nalaglag na supling ng isang babae—hindi nila nakita ang araw.” Maramihan ang pandiwang “nakita,” bagaman pang-isahan ang “nalaglag na supling”; tumutukoy ang diwa sa mga supling na hindi nabuhay upang makita ang araw.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: Gaya ng
  rationale: Likas na panandang Filipino para sa paghahambing at inuulit sa ikalawang larawang patula.
- source_word: שַׁבְּלוּל
  choice: susô
  rationale: Tradisyonal at pinakakilalang kahulugan ng pangngalan; ang larawang natutunaw sa pag-usad ay tumutukoy sa susô.
- source_word: תֶּמֶס
  choice: na natutunaw
  rationale: Ipinahahayag ang diwa ng pagkatunaw o pagkalusaw sa malinaw at likas na anyong pandiwa sa Filipino.
- source_word: יַהֲלֹךְ
  choice: habang gumagapang
  rationale: Ang literal na 'habang lumalakad/pumaparoon' ay iniangkop sa natural na kilos ng susô nang hindi binabago ang larawan ng pag-usad nito.
- source_word: נֵפֶל
  choice: batang patay nang isilang
  rationale: Malinaw na tumutukoy sa supling na hindi nabuhay upang makita ang araw; mas natural ito sa Filipino kaysa sa abstraktong 'pagkalaglag' sa loob ng pagtutulad.
- source_word: אֵשֶׁת
  choice: (ipinahiwatig sa pariralang “batang patay nang isilang”)
  rationale: Literal itong 'ng isang babae,' ngunit hindi kailangang tahasang ulitin sa natural na Filipino kapag ang tinutukoy ay batang isinilang; ipinaliliwanag sa talababa ang mahirap na sintaks.
- source_word: בַּל
  choice: na hindi
  rationale: Direktang ipinananegatibo ang kasunod na pandiwa at malinaw na iniuugnay sa bata, hindi sa babae.
- source_word: חָזוּ
  choice: nakakita
  rationale: Pinananatili ang payak na diwa ng 'makakita.' Ang maramihang anyong Hebreo ay hindi natural na matutularan sa Filipino sa pang-isahang pinakinis na parirala at itinatala sa talababa.
- source_word: שָׁמֶשׁ
  choice: araw
  rationale: Tuwirang katumbas at likas na ekspresyon para sa hindi pagdanas ng buhay sa ilalim ng araw.
