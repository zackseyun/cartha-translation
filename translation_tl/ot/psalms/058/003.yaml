  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: tl
  text: Ang masasama ay nahiwalay na mula pa sa sinapupunan; naliligaw sila mula nang isilang[a], at nagsasalita sila ng kasinungalingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa sinapupunan” ... “mula sa tiyan/sinapupunan.” Gumagamit ang talata ng matinding pananalitang patula upang ilarawan ang masasama bilang naliligaw mula pa sa pinakamaagang bahagi ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: nalalayo
  rationale: Ipinahihiwatig ng Qal perfect plural ng זור ang pagkalayo o pagkahiwalay. Ang “nalalayo” ay natural sa modernong Tagalog at kaagapay ng “naliligaw,” nang hindi nililimitahan ang diwa sa moral na kabulukan lamang.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwan at malinaw na katawagan sa isang uri ng mga taong gumagawa ng masama.
- source_word: מֵרָחֶם
  choice: mula pa sa sinapupunan
  rationale: Tuwirang pinananatili ang larawan ng רֶחֶם at ang diin na mula sa pinakamaagang yugto ng buhay.
- source_word: תָּעוּ
  choice: naliligaw sila
  rationale: Ang תעה ay tumutukoy sa paglihis o pagkaligaw. Ginamit ang aspektong naglalarawan ng kanilang katangiang patuloy, alinsunod sa pangkalahatang pahayag ng tula.
- source_word: מִבֶּטֶן
  choice: mula nang isilang
  rationale: Bagaman literal na “mula sa tiyan/sinapupunan,” natural na naihahayag ng “mula nang isilang” ang diwa sa ikalawang magkatugmang linya, habang nananatili sa unang linya ang literal na larawan ng sinapupunan.
- source_word: דֹּבְרֵי כָזָב
  choice: nagsasalita ng mga kasinungalingan
  rationale: Malinaw at natural na inilalarawan ang patuloy na katangian ng mga masama bilang mga nagsasalita ng kabulaanan.
- source_word: כָזָב
  choice: mga kasinungalingan
  rationale: Ito ang pinakakaraniwan at malinaw na modernong katumbas sa konteksto ng pananalita.
theological_decisions:
- issue: Kung dapat bang ipahayag ang talata bilang literal na doktrina ng moral na pagkakasala bago ipanganak o ng minanang kasalanan
  choice: Panatilihin ang matinding ποιetikong paglalarawan na ang masasama ay lihis mula pa sa pinakamaagang buhay, nang hindi ito ginagawang teknikal na pahayag ng doktrina.
  alternative: Maaaring basahin ito bilang tahasang pagtuturo ng ganap na kasamaan mula sa paglilihi, o bilang retorikang walang anumang pahiwatig tungkol sa kalagayan ng tao.
  rationale: Gumagamit ang Hebreo ng ποιetikong paralelismo—“mula pa sa sinapupunan” at “mula nang isilang”—sa isang awit ng pagtuligsa. Dapat mapanatili ang lakas at tensiyon ng larawan nang hindi nagpapasok ng sistematikong konklusyong hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paralelismo at matinding larawang patula; ginawang natural ang ikalawang parirala bilang “mula nang isilang.”
