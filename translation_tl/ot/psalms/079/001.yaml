base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: tl
  text: 'Awit ni Asaf.


    O Diyos, pumasok ang mga bansa sa iyong mana;

    dinungisan nila ang iyong banal na templo;

    ginawa nilang guho ang Jerusalem.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, ginawa nilang mga bunton ng guho ang Jerusalem.
    reason: Pinananatili ng alternatibo ang maramihang anyo ng Hebreong עִיִּים, na maaaring tumukoy sa mga bunton ng mga guho.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan sa pamagat ng isang salmo; natural at pamilyar sa makabagong Tagalog.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Ipinahahayag ang kaugnayan kay Asaf nang hindi ipinapaliwanag kung siya ang may-akda, pinag-ukulan, o pinagmulan ng awit.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos; malinaw at marangal sa Tagalog ang bokatibong “O.”
- source_word: בָּאוּ גוֹיִם
  choice: pumasok ang mga bansa
  rationale: Ipinahahayag ang natapos na pagpasok ng mga dayuhang bansa; hindi dinaragdagan ng tiyak na ideya ng pagsalakay na wala sa mismong pandiwa.
- source_word: בְּנַחֲלָתֶךָ
  choice: sa iyong mana
  rationale: Pinananatili ang malawak at tipanang diwa ng pag-aaring ibinigay bilang mana, nang hindi nililimitahan sa lupain o bayan lamang.
- source_word: טִמְּאוּ
  choice: dinungisan
  rationale: Ipinahahayag ang pagpaparumi o paglapastangan sa isang banal na bagay, habang nananatiling likas sa Tagalog.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: iyong banal na templo
  rationale: Direkta at natural na katumbas ng templong nauukol sa kabanalan ng Diyos.
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: ginawa nilang guho ang Jerusalem
  rationale: Natural na resultative construction sa Tagalog; inilalahad ang pagkawasak nang hindi nagpapasok ng dagdag na detalye.
theological_decisions:
- issue: Saklaw ng “iyong mana”
  choice: Panatilihin ang “iyong mana”
  alternative: “iyong lupain” o “iyong bayan”
  rationale: Hindi tahasang nililimitahan ng Hebreo ang mana sa lupain lamang o sa bayan lamang; pinananatili ng salin ang malawak na tipanang pahiwatig.
- issue: Kaugnayan ni Asaf sa awit
  choice: “ni Asaf” bilang payak na pormula ng pamagat
  alternative: “para kay Asaf”
  rationale: Ang לְ sa mga pamagat ng Awit ay maaaring magpahiwatig ng pag-aari, pagkakaugnay, o pag-uukol; ang “ni Asaf” ang karaniwang natural na anyo ngunit hindi dapat gawing tahasang pahayag tungkol sa eksaktong uri ng pagkakaugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maiikling sugnay at bokatibong “O Diyos” upang mapanatili ang himig ng panaghoy. Iniwasan ang mas tiyak na “sinalakay” at ang pagpapakahulugang nililimitahan ang “mana” sa lupain o bayan.
