base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: tl
  text: Ibinuhos nila ang dugo ng mga iyon na parang tubig sa palibot ng Jerusalem, at walang maglibing sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: Ibinuhos nila
  rationale: Ang Qal perfect 3cp ng שׁפך ay tumutukoy sa natapos na pagbubuhos o pagdanak. Pinananatili ng “ibinuhos” ang matingkad na larawang kaugnay ng kasunod na paghahambing sa tubig.
- source_word: דָמָם
  choice: ang dugo ng mga ito
  rationale: Literal itong “kanilang dugo.” Ginamit ang “ng mga ito” upang malinaw na ang dugo ay sa mga bangkay na binanggit sa konteksto, habang iniiwasan ang posibleng maling pagbasa na ang “nila” ay tumutukoy sa mga pumatay.
- source_word: כמים
  choice: na parang tubig
  rationale: Ang prefixed כ ay naghahayag ng paghahambing. Ang “parang tubig” ay natural sa modernong Tagalog at pinananatili ang simile.
- source_word: סביבות ירושלים
  choice: sa buong palibot ng Jerusalem
  rationale: Ipinahihiwatig ng סביבות ang nakapalibot na lugar; ipinapahayag ng “sa buong palibot” ang malawakang pagdanak sa paligid ng lungsod.
- source_word: וְאֵין
  choice: at walang
  rationale: Ang existential negative na אֵין ay natural na isinasalin bilang “walang,” kasunod ng natapos na kilos sa unang sugnay.
- source_word: קוֹבֵר
  choice: maglibing sa kanila
  rationale: Ang participle ay nangangahulugang isang taong naglilibing o maglilibing. Likas sa Tagalog ang “walang maglibing,” at ang “sa kanila” ay ginagawang hayag ang bagay na ipinahihiwatig ng konteksto.
