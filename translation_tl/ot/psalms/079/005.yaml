  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: tl
  text: Hanggang kailan, Yahweh? Magagalit ka ba magpakailanman? Maglalagablab bang parang apoy ang iyong paninibugho[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sigasig.” Ang salitang Hebreo ay maaaring mangahulugang “paninibugho” o “sigasig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: Hanggang kailan
  rationale: Likas na pormula ng panaghoy sa Tagalog na nagtatanong kung gaano pa katagal ang kalagayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa Hebreo sa pamamagitan ng transliterasyon, sa halip na palitan ito ng isang titulo.
- source_word: תֶּאֱנַף
  choice: magagalit
  rationale: Malinaw at karaniwang salita para sa galit na ipinahihiwatig ng pandiwang Hebreo, nang hindi pinatitindi ang kahulugan.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Ang tanong sa panaghoy ay kung ang galit ng Diyos ay magpapatuloy nang walang hanggan.
- source_word: תִּבְעַר
  choice: maglalagablab
  rationale: Ang pandiwa ay nangangahulugang magningas o magsunog; ang 'maglalagablab' ay natural na kaakibat ng paghahambing sa apoy at pinananatili ang masidhing larawan.
- source_word: כְּמוֹ אֵשׁ
  choice: parang apoy
  rationale: Natural na Tagalog na nagpapanatili sa tahasang paghahambing ng Hebreo.
- source_word: קִנְאָתֶךָ
  choice: iyong paninibugho
  rationale: Pinananatili ng 'paninibugho' ang matalas at relasyonal na diwa ng קִנְאָה sa konteksto ng galit ng Diyos; ang alternatibong 'alab ng malasakit' o 'sigasig' ay inilalagay sa talababa.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit sa halip na isang titulong gaya ng 'Panginoon.'
- issue: Pagtutumbas sa קִנְאָה bilang katangian ng Diyos
  choice: paninibugho
  alternative: sigasig
  rationale: Maaaring tumukoy ang salitang Hebreo sa paninibugho o masidhing sigasig. Ang konteksto ng galit at tipanang ugnayan ay umaayon sa 'paninibugho,' ngunit pinananatili sa talababa ang tunay na alternatibong kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang anyong panaghoy at ang sunod-sunod na mga tanong, pati ang semantikong tensiyon sa salitang קִנְאָה.
