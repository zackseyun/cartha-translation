  source_fidelity: 'Tumpak ang pangunahing diwa at parallelismong Hebreo: ang bayan ay naging kahihiyan sa mga kapit-bayan at pinagtatawanan/inuuyam ng mga nasa paligid. Gayunman, ang "kalapit-bayan" ay maaaring mas maunawaang mga pamayanang katabi kaysa mga kapit-bansang/karatig na bayan; ang "mga kapitbahay" ay mas tuwirang katumbas ng שְׁכֵנֵינוּ at hindi nagsasara sa saklaw na pampamayanan.'
  naturalness: Natural at marangal ang daloy, ngunit mas idiomatiko at mas malinaw ang "sa aming mga kapitbahay" kaysa "sa aming mga kalapit-bayan." Ang "tampulan ng pangungutya" ay natural, ngunit ang "katatawanan at tampulan" ay bahagyang hindi pantay sa anyo; ang "pinagtatawanan at inuuyam" ay likas at pinananatili ang dalawang magkaibang katawagan ng paglibak.
  terminology: Ang "kadustaan" ay angkop para sa חֶרְפָּה. Ang "mga kapitbahay" para sa שְׁכֵנֵינוּ at "mga nasa paligid namin" para sa סְבִיבוֹתֵינוּ ay nagpapapanatili ng magkaugnay ngunit hindi lubos na magkatulad na saklaw. Walang kinakailangang talang-paanan; ang alternatibong pagbasa sa English audit trail ay hindi isang textual o semantikong usaping kailangang iangkla sa Tagalog.
  issues:
