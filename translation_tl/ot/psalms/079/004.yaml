  text: 'Naging kadustaan kami sa aming mga kapitbahay,


    pinagtatawanan at inuuyam ng mga nasa paligid namin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: Naging
  rationale: Ang Qal perfect na unang panauhang maramihan ay nagpapahayag ng kalagayang ibinunga ng nagdaang pangyayari; likas na ipinahihiwatig ng “naging” ang pagbabagong iyon at ang kasalukuyang bunga nito.
- source_word: חֶרְפָּה
  choice: kadustaan
  rationale: Ipinahahayag ng pangngalan ang pampublikong kahihiyan at pagiging tudlaan ng paghamak. Ang “kadustaan” ay marangal ngunit malinaw na salitang angkop sa panaghoy.
- source_word: לִשְׁכֵנֵינוּ
  choice: sa aming mga kalapit-bayan
  rationale: Ang ל ay nagsasaad ng kaugnayan sa mga kapit-bansang humahamak sa Israel. Nililinaw ng “mga kalapit-bayan” na mga nakapaligid na pangkat o bayan ang tinutukoy, hindi lamang mga indibidwal na kapitbahay.
- source_word: לַעַג
  choice: katatawanan
  rationale: Tumutukoy ito sa pagiging bagay na pinagtatawanan nang mapanlibak; natural ang “katatawanan” sa modernong Filipino at napapanatili ang anyong pangngalan.
- source_word: קֶלֶס
  choice: tampulan ng pangungutya
  rationale: Ipinakikita nito ang mapanuyang pagtuya. Ang parirala ay nagtatangi rito mula sa לַעַג habang pinananatili ang magkakapatong na mga salita ng kahihiyan sa Hebreo.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: ng mga nakapaligid sa amin
  rationale: Natural nitong isinasalin ang literal na “sa mga nasa paligid namin” at pinananatili ang mas malawak na saklaw kaysa sa naunang mga kalapit-bayan.
