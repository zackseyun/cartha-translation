base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: tl
  text: Ibinigay nila ang mga bangkay ng iyong mga lingkod bilang pagkain sa mga ibon sa langit,[a] at ang laman ng mga tapat sa iyo[b] sa mga hayop sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ibon sa himpapawid.”
    reason: lexical_alternative
  - marker: b
    text: O “mga banal mo” o “mga matapat mo.” Ang salitang Hebreo ay maaaring tumukoy sa mga taong nakatalaga sa Diyos at tapat sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Ibinigay nila
  rationale: Ang Qal perfect na 3cp ay nagsasaad ng natapos na gawa; natural sa Tagalog ang payak na aspektong naganap sa masidhing panaghoy.
- source_word: נִבְלַת עֲבָדֶיךָ
  choice: ang mga bangkay ng iyong mga lingkod
  rationale: Malinaw na ipinahihiwatig ng נִבְלָה ang mga patay na katawang iniwang walang libing; ang 'mga lingkod' ay angkop sa kaugnayan nila sa Diyos sa Mga Awit.
- source_word: מַאֲכָל
  choice: bilang pagkain
  rationale: Likas sa Tagalog at pinananatili ang diwang ang mga bangkay ay ibinigay upang maging pagkain.
- source_word: לְעוֹף הַשָּׁמָיִם
  choice: sa mga ibon sa langit
  rationale: Ang עוֹף ay kolektibong tumutukoy sa mga lumilipad na nilalang, at ang karaniwang katumbas dito ay 'mga ibon'; pinananatili ng 'sa langit' ang makatang parirala.
- source_word: בְּשַׂר
  choice: ang laman
  rationale: Pinananatili ng literal na 'laman' ang matindi at pisikal na larawan at ang pagkakatugma nito sa 'mga bangkay.'
- source_word: חֲסִידֶיךָ
  choice: mga tapat sa iyo
  rationale: Ipinahahayag nito ang mga taong nakatalaga sa Diyos at may katapatan sa tipan, nang hindi ipinapasok ang mas teknikal na kahulugan ng 'mga banal.'
- source_word: לְחַיְתוֹ אָרֶץ
  choice: sa mababangis na hayop sa lupa
  rationale: Sa konteksto, ang חַיְתוֹ־אָרֶץ ay tumutukoy sa mga hayop sa lupa, malamang mga hayop na kumakain ng bangkay; malinaw at natural ang 'mababangis na hayop.'
theological_decisions:
- issue: Pagpapakahulugan sa katawagang חֲסִידֶיךָ na may kaugnayan sa katapatan sa tipan
  choice: mga tapat sa iyo
  alternative: mga banal mo; mga matapat mo
  rationale: Pinananatili ng 'mga tapat sa iyo' ang ugnayan at debosyon sa Diyos na maaaring saklawin ng חָסִיד, habang iniiwasang gawing tiyak na teknikal na kategorya ang katawagan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang marahas na larawang 'mga bangkay' at 'laman,' pati ang makatang pagtutulad ng mga ibon sa langit at mga hayop sa lupa. Ang bawat talababa ay may katugmang pananda sa pangunahing teksto.
