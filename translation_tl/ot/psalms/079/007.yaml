  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: tl
  text: 'Sapagkat nilamon nila si Jacob,

    At ginawang tiwangwang ang kanyang tirahan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat kinain nila si Jacob at winasak ang kanyang tirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng naunang pagsusumamo sa konteksto at likas itong pakinggan sa makabagong Tagalog.
- source_word: אָכַל
  choice: nilamon
  rationale: Bagaman literal na “kinain,” inilalarawan dito ang marahas na pagwasak sa isang bayan; pinananatili ng “nilamon” ang matinding talinghaga.
- source_word: אֶת יַעֲקֹב
  choice: si Jacob
  rationale: Pinanatili ang makatang pangalang tipan sa Hebreo sa halip na ipaliwanag bilang “Israel” o “mga inapo ni Jacob.”
- source_word: נָוֵהוּ
  choice: ang kanyang tahanan
  rationale: Ang salita ay maaaring tumukoy sa tirahan, tahanan, o pastulan. Malinaw at hindi labis na tiyak ang “tahanan,” kaya hindi ito awtomatikong nililimitahan sa templo.
- source_word: הֵשַׁמּוּ
  choice: winasak
  rationale: Ipinahahayag ng Hiphil ang pagdudulot ng pagkatiwangwang. Ang “winasak” ay natural, matindi, at angkop sa makatang konteksto.
theological_decisions:
- issue: Ang tinutukoy ng “kanyang tahanan”
  choice: Pinanatiling malawak bilang tahanan o tirahan ni Jacob/Israel.
  alternative: Ang templo o santuwaryo lamang; o ang buong lupain.
  rationale: Pinakamalapit na tinutukoy ng hulaping “kanya” si Jacob. Maaaring kasama ang templo ayon sa mas malawak na konteksto ng salmo, ngunit hindi iyon tahasang hinihingi ng pariralang ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang marahas na talinghagang “nilamon” at ang sadyang malawak na kahulugan ng tirahan.
