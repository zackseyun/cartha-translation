  verdict: revise
  source_fidelity: Ang “ibalik mo,” “aming mga karatig,” at ang tuwirang panawagan sa Panginoon ay tapat sa Hebreo. Gayunman, ang “paghamak nila sa iyo” ay pinagsasama ang pangngalang “reproach” at ang kasunod na sugnay sa paraang hindi gaanong naipapakita ang bagay na ibinabalik—ang kadustaang ipinukol nila sa Diyos. Ang “makapitong ulit” ay hindi rin ang pinakanatural na modernong Filipino para sa שבעתים.
  naturalness: Nauunawaan ang draft, ngunit mas matatag at mas natural ang ayos na inuuna ang “sa kandungan ng aming mga karatig” at inilalagay ang “nang pitong ulit” bilang pang-abay ng pagbabalik. Ang “kadustaang ipinukol nila sa iyo” ay mas malinaw at mas matalinghaga nang hindi nagiging di-Filipino ang tunog.
  terminology: Ginamit ang “kadustaan” para sa חרפה, na tumutukoy sa insulto, pag-alipusta, o kahihiyang ipinukol sa isang tao. Pinanatili ang “kandungan” para sa חיק at ang “Panginoon” para sa אדני. Hindi tinukoy kung ang mga karatig ay mga indibidwal o mga kalapit na bayan.
  issues:
