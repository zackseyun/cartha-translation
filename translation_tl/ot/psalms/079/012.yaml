  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: tl
  text: At ibalik mo sa kandungan ng aming mga karatig, nang pitong ulit, ang kadustaang ipinukol nila sa iyo, O Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Ibalik mo sa aming mga karatig nang pitong ulit ang kadustaang ipinukol nila sa iyo.” Ang “sa kandungan” ay idyomang Hebreo na naglalarawan ng pagbabalik ng kadustaan sa mga gumawa nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: At ibalik mo
  rationale: Ang Hifil na pautos ng שׁוב ay literal na nagpapahiwatig ng pagpapabalik ng isang bagay sa pinagmulan nito. Pinananatili ng “ibalik mo” ang larawan ng Hebreo at, sa kontekstong ito, ang diwang pagganti.
- source_word: לִשְׁכֵנֵינוּ
  choice: sa aming mga karatig
  rationale: Ang שָׁכֵן ay tumutukoy sa mga nakatira sa paligid. Maaaring mga kalapit na tao o mga bansang nakapaligid ang tinutukoy; hindi ito labis na tinutukoy ng “mga karatig.”
- source_word: שִׁבְעָתַיִם
  choice: nang makapitong ulit
  rationale: Tuwirang ipinahahayag nito ang “seven times/sevenfold” at natural itong pakinggan sa makabagong Filipino habang pinananatili ang diin ng panalangin.
- source_word: אֶל חֵיקָם
  choice: sa kandungan ng aming mga karatig
  rationale: Ang חֵיק ay kandungan o dibdib. Pinananatili ng “sa kandungan” ang konkretong idyoma na naglalarawang bumabalik sa kanila ang kanilang ginawa.
- source_word: חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ
  choice: ang paghamak nila sa iyo
  rationale: Ang pangngalan at pandiwa sa Hebreo ay magkaugnay. Ang maikling pariralang Filipino ay malinaw na naghahayag na ang paghamak ng mga karatig ay nakatuon sa Diyos, nang hindi nagiging mabigat ang pag-uulit.
- source_word: אֲדֹנָי
  choice: O Panginoon
  rationale: Ang אֲדֹנָי ay titulong pantawag sa Diyos. Ang “O Panginoon” ay marangal at angkop sa tuwirang panalangin ng salmo.
theological_decisions:
- issue: Panalangin para sa makapitong pagganti
  choice: Pinanatili ang tuwirang pakiusap na ibalik ng Diyos nang makapitong ulit ang paghamak ng mga kaaway.
  alternative: Palambutin ito bilang pangkalahatang kahilingan para sa katarungan.
  rationale: Ang talata ay isang tahasang panalanging humihingi ng banal na pagganti. Hindi dapat alisin ng salin ang tindi o teolohikal na tensiyon nito.
- issue: Paghamak na nakatuon sa Diyos
  choice: Isinalin bilang “ang paghamak nila sa iyo.”
  alternative: Unawain ang paghamak bilang nakatuon lamang sa Israel.
  rationale: Malinaw na ang hulaping ikalawang panauhan sa חֵרְפוּךָ ay tumutukoy sa Panginoon; kaya pinananatili na siya ang tuwirang hinamak.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino para sa panalangin. Pinanatili ang matalinghagang “sa kandungan” at ang matinding pakiusap na “makapitong ulit,” habang iniwasang tukuyin nang higit sa Hebreo kung mga indibidwal o mga kalapit na bansa ang “mga karatig.”
