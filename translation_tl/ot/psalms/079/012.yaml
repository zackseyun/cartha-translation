    issue: Hindi sapat na naihihiwalay ng “ang paghamak nila sa iyo” ang “kanilang kadustaan/reproach” mula sa kasunod na “na ipinukol nila sa iyo.”
    rationale: Ang Hebreo ay humihiling na ibalik sa mga karatig ang mismong kadustaang ginawa nila laban sa Diyos. Ang rebisyon ay mas malinaw na ginagawang bagay ng “ibalik” ang kadustaan at pinananatili ang kaugnay na sugnay.
  - severity: low
    issue: Ang “nang makapitong ulit” ay medyo alanganin sa makabagong Filipino.
    rationale: Ang “nang pitong ulit” ay mas karaniwan, malinaw, at sapat na naghahayag ng “sevenfold/seven times.”
  - severity: low
