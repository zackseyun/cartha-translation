    rationale: Dapat ipaliwanag ng talababa na ang “kandungan” ay idyomang Hebreo para sa pagbabalik ng kadustaan sa gumawa nito.
  revised_text: At ibalik mo sa kandungan ng aming mga karatig, nang pitong ulit, ang kadustaang ipinukol nila sa iyo, O Panginoon.[a]
