  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: tl
  text: Huwag mong alalahanin laban sa amin ang mga pagkakasala noon.[a] Agad nawa kaming salubungin ng iyong mga habag, sapagkat lubha na kaming nanghina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga pagkakasala ng aming mga ninuno”; o “ang mga dati naming pagkakasala.” Hindi malinaw sa Hebreo kung alin ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Huwag mong alalahanin laban sa amin
  rationale: Pinananatili ang diwa ng ‘pag-alaala’ sa isang mapanagot o maparusang konteksto, sa halip na lubusang ipakahulugang ‘isumbat’ o ‘iparatang.’
- source_word: עֲוֺנֹת
  choice: mga kasamaan
  rationale: Ipinahahayag ang moral na bigat ng עון sa natural at dignified na modernong Tagalog; maaari rin itong tumukoy sa kasalanan at kaakibat na pagkakasala.
- source_word: רִאשֹׁנִים
  choice: noong una
  rationale: Temporal at hindi tiyak ang parirala; hindi nito sapilitang tinutukoy kung kasamaan ng mga ninuno o mga naunang kasamaan ng mismong bayan.
- source_word: מַהֵר יְקַדְּמוּנוּ
  choice: Agad nawa kaming salubungin
  rationale: Inilalarawan ng קדם ang pagdating sa unahan o pagsalubong; ang ‘agad’ ay nagpapanatili sa apurahang pakiusap.
- source_word: רַחֲמֶיךָ
  choice: iyong mga habag
  rationale: Pinananatili ang maramihang anyo at ang diwa ng mahabaging pagkilos ng Diyos.
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: sapagkat lubha na kaming nanghina
  rationale: Ang דלל ay nagpapahiwatig ng pagiging lubhang mahina, kapos, o lugmok; ang ‘nanghina’ ay malinaw at natural, habang ang ‘lubha na’ ay nagsasaad ng matinding kasalukuyang kalagayan.
theological_decisions:
- issue: Tinutukoy ng ‘mga kasamaan noong una’
  choice: Pinanatiling temporal at hindi tinukoy kung kaninong mga kasamaan ang tinutukoy.
  alternative: ‘mga kasamaan ng aming mga ninuno’ o ‘mga nauna naming kasamaan’
  rationale: Maaaring tumukoy ang Hebreo sa kasamaan ng mga naunang salinlahi o sa mga dating kasamaan ng bayan. Hindi nilulutas ng pangunahing salin ang tunay na kalabuan.
translation_notes:
  register: 'Makabagong Filipino Tagalog na angkop sa panalangin: natural at malinaw ngunit marangal. Iniwasan ang labis na arkaikong pananalita at pinanatili ang larawan ng mga habag ng Diyos na ‘sumasalubong’ sa bayan.'
