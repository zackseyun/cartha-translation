    issue: Hindi sapat at redundant ang “pawiin ang sala ng aming mga kasalanan” para sa וְכַפֵּר עַל חַטֹּאתֵינוּ.
    rationale: Ang Hebreo ay humihiling ng pagkilos ng pagbabayad-sala kaugnay ng mga kasalanan. Ang kasalukuyang parirala ay gumagamit ng dalawang magkalapit na katawagan (“sala” at “kasalanan”) at inililihis ang diin mula sa atonement tungo sa simpleng pag-alis ng guilt.
