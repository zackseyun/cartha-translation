  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: tl
  text: 'Tulungan mo kami, Diyos ng aming kaligtasan,


    alang-alang sa kaluwalhatian ng iyong pangalan;


    iligtas mo kami at magbayad-sala ka para sa aming mga kasalanan[a],


    alang-alang sa iyong pangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pawiin mo ang aming mga kasalanan.” Ang pandiwang Hebreo ay may diwa ng pagbabayad-sala, hindi lamang ng pagpapatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Tulungan mo kami
  rationale: Tuwiran at likas na pakiusap sa makabagong Tagalog; pinananatili ang agarang lakas ng pautos na may hulaping unang panauhang maramihan.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Diyos ng aming kaligtasan
  rationale: Pinananatili ang anyong construct ng Hebreo at itinatanghal ang Diyos bilang pinagmumulan ng kaligtasan, nang hindi ito ginagawang titulong mas interpretatibo.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: alang-alang sa kaluwalhatian ng iyong pangalan
  rationale: Ipinahahayag ang batayan o layunin ng pakiusap at pinananatiling magkahiwalay ang ‘kaluwalhatian’ at ‘pangalan.’
- source_word: וְהַצִּילֵנוּ
  choice: iligtas mo kami
  rationale: Likas na katumbas ng Hiphil ng נצל sa kontekstong humihingi ng pagliligtas mula sa panganib.
- source_word: וְכַפֵּר עַל
  choice: pawiin ang sala ng
  rationale: Ipinapahayag ang epekto ng כפר—ang pag-aalis ng sala—sa malinaw na Tagalog, habang inilalagay sa talababa ang mas teknikal na wika ng pagtubos upang hindi ito mapantay lamang sa karaniwang pagpapatawad.
- source_word: חַטֹּאתֵינוּ
  choice: aming mga kasalanan
  rationale: Tuwirang inililipat ang pangngalang maramihan na may hulaping unang panauhang maramihan.
- source_word: לְמַעַן שְׁמֶךָ
  choice: alang-alang sa iyong pangalan
  rationale: Likas na Tagalog para sa idyomang umaapela sa pangalan—karakter at karangalan—ng Diyos bilang dahilan ng pagkilos.
theological_decisions:
- issue: Paglilipat ng כפר sa isang panalanging nagsisisi
  choice: pawiin ang sala ng aming mga kasalanan
  alternative: gumawa ka ng pagtubos para sa aming mga kasalanan; patawarin mo ang aming mga kasalanan
  rationale: Ang כפר ay mas mabigat kaysa sa payak na ‘magpatawad’ at tumutukoy sa pagharap sa sala sa pamamagitan ng pagtubos. Ang pangunahing salin ay malinaw at likas sa Tagalog, samantalang pinananatili ng talababa ang wikang pagtubos nang hindi nagpapasok ng isang tiyak na mekanismong doktrinal.
- issue: Dalawang pag-apela sa pangalan ng Diyos
  choice: alang-alang sa kaluwalhatian ng iyong pangalan ... alang-alang sa iyong pangalan
  alternative: dahil maluwalhati ang iyong pangalan
  rationale: Pinananatili ang dalawang magkahiwalay na parirala at ang diin na ang hinihinging pagkilos ay nakabatay sa karangalan ng Diyos, hindi sa karapatan o kabutihan ng bayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Diyos ng aming kaligtasan’ upang mapanatili ang anyo at diin ng Hebreo. Ang pag-uulit ng ‘alang-alang sa ... pangalan’ ay sinadya upang tularan ang dobleng pag-apela ng talata.
