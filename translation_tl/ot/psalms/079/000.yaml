id: PSA.79.0
reference: Psalms 79:0
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: tl
  text: 'Awit ni Asaf.[a]


    O Diyos, pumasok ang mga bansa sa iyong mana;

    dinungisan nila ang banal mong templo;

    ginawa nilang bunton ng mga guho ang Jerusalem.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Awit para kay Asaf.”
    reason: Hindi lubos na tiyak kung ang pang-ukol na Hebreo ay tumutukoy sa may-akda o sa pinag-ukulan ng awit.
  - marker: b
    text: Maaari ring “ginawa nilang mga guho ang Jerusalem.”
    reason: Ang salitang Hebreo ay maaaring ilarawan bilang mga guho o mga bunton ng guho.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Awit ni Asaf
  rationale: Likas at maikli sa Filipino bilang pamagat ng salmo; pinananatili sa talababa ang posibilidad na ang לְ ay nangangahulugang “para kay” sa halip na tuwirang pagtukoy sa may-akda.
- source_word: גוֹיִם
  choice: mga bansa
  rationale: Tuwirang katumbas ng maramihang pangngalan; hindi idinagdag ang “dayuhan” o “kaaway,” na maaaring ipahiwatig ng konteksto ngunit wala sa mismong salita.
- source_word: נַחֲלָתֶךָ
  choice: iyong mana
  rationale: Pinananatili ang larawan ng pag-aaring minana o ibinigay bilang bahagi; hindi nililimitahan kung tumutukoy ito sa lupain, bayan, o kabuuang pag-aari ng Diyos.
- source_word: טִמְּאוּ
  choice: dinungisan
  rationale: Ipinahahayag ang ritwal at moral na paglapastangan, hindi lamang karaniwang pagpaparumi.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: banal mong templo
  rationale: Natural na Filipino na malinaw na tumutukoy sa templong itinalaga bilang banal sa Diyos.
- source_word: לְעִיִּים
  choice: bunton ng mga guho
  rationale: Inihahatid ang maramihang larawan ng עִיִּים bilang mga bunton o tumpok ng guho; nasa talababa ang mas maikling alternatibo.
theological_decisions:
- issue: Ang saklaw ng “iyong mana”
  choice: Pinanatili ang malawak na “iyong mana.”
  alternative: “lupaing mana mo” o “bayang pag-aari mo”
  rationale: Maaaring ipahiwatig ng konteksto ang lupain, Jerusalem, templo, o bayan ng Diyos. Ang pagpili ng isa lamang ay magsasara sa sadyang malawak na larawan ng Hebreo.
- issue: Kaugnayan ni Asaf sa awit
  choice: “Awit ni Asaf” sa teksto, na may talababa tungkol sa alternatibo.
  alternative: “Awit para kay Asaf”
  rationale: Ang pang-ukol na לְ sa pamagat ay maaaring magpahiwatig ng pag-akda, pag-uugnay, o pag-aalay; hindi dapat gawing tiyak ang hindi tiyak sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang tuwirang panawagang “O Diyos” at magkakatugmang mga sugnay upang mapanatili ang panaghoy at paralelismo ng Hebreong tula.
