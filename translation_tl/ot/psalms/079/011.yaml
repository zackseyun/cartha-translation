  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang mapanatili ang panalanging himig, at “bisig” upang huwag patagin ang metapora ng kapangyarihan ng Diyos. Ang panandang [a] ay inilagay pagkatapos ng buong idyomatikong parirala na ipinaliliwanag nito.
