translation:
  language: tl
  text: Dumating nawa sa iyong harapan ang daing ng bilanggo; ayon sa kadakilaan ng iyong bisig, iligtas mo sa kamatayan ang mga nakatakdang mamatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga anak ng kamatayan,” isang idyomang Hebreo para sa mga nakatakdang mamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּב֣וֹא
  choice: Dumating nawa
  rationale: Ang Qal imperfect ay ginagamit dito bilang pakiusap; ipinahahayag ng “nawa” ang jussive o panalanging himig.
- source_word: לְפָנֶיךָ
  choice: sa iyong harapan
  rationale: Natural na katumbas ng idyomang Hebreo para sa paglapit sa presensiya ng Diyos, habang pinananatili ang larawang panlunan.
- source_word: אֶנְקַת
  choice: ang daing
  rationale: Tumutukoy sa naririnig na pagdaing o pagbuntong-hininga dahil sa matinding paghihirap; malinaw at marangal ang “daing” sa konteksto ng panaghoy.
- source_word: אָסִיר
  choice: ng bilanggo
  rationale: Malinaw na tumutukoy sa taong nakakulong o ginapos; hindi nito nililimitahan ang kahulugan sa bihag sa digmaan.
- source_word: כְּגֹדֶל
  choice: ayon sa kadakilaan ng
  rationale: Pinananatili ang diwa ng כ bilang pamantayan o sukat ng hinihiling na pagkilos ng Diyos.
- source_word: זְרוֹעֲךָ
  choice: iyong bisig
  rationale: Pinananatili ang kongkretong metapora ng Hebreo para sa lakas o kapangyarihan ng Diyos.
- source_word: הוֹתֵר
  choice: iligtas mo sa kamatayan
  rationale: Ang Hiphil imperative ng יתר ay humihiling na hayaang manatiling buhay ang mga nanganganib mamatay. Natural na ipinahahayag sa Filipino ang resulta, nang hindi ipinahihiwatig na kaligtasang espirituwal ang tanging paksa.
- source_word: בְּנֵי תְמוּתָה
  choice: ang mga hinatulang mamatay
  rationale: Ang literal na “mga anak ng kamatayan” ay isang idyomang Hebreo para sa mga nasa ilalim ng hatol o nakatakdang mamatay. Inilalagay sa talababa ang literal na anyo upang mapanatili ang larawan at tunay na lawak ng kahulugan.
