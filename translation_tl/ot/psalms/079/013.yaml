  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: tl
  text: Ngunit kami, ang iyong bayan at mga tupa ng iyong pastulan, ay magpapasalamat sa iyo magpakailanman; sa sali't salinlahi ay isasalaysay namin ang papuri sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Ngunit kami
  rationale: Ang pangatnig na may tahasang panghalip ay nagpapahiwatig ng pagsalungat sa mga bansang binanggit at sa naunang pagkawasak; likas itong naipahahayag sa Tagalog bilang “Ngunit kami.”
- source_word: עַמְּךָ
  choice: ang iyong bayan
  rationale: Ang “bayan” ay likas at marangal na katumbas ng katawagang pangtipan para sa Israel bilang bayang pag-aari ng Diyos.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: at ang mga tupa sa iyong pastulan
  rationale: 'Pinananatili nito ang tahasang larawang pastoral: ang bayan ay mga tupang kinakalinga ng Diyos sa kaniyang pastulan.'
- source_word: נוֹדֶה לְּךָ
  choice: ay magpapasalamat sa iyo
  rationale: Ang Hiphil ng ידה ay karaniwang nangangahulugang magpasalamat o pumuri. Pinili ang “magpapasalamat” upang mapanatili ang pagkakaiba nito sa תְּהִלָּתֶךָ sa kasunod na sugnay.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, malinaw, at marangal na pagpapahayag ng patuloy at walang-hanggang panahon sa Tagalog.
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahi
  rationale: Likas na idyomang Tagalog para sa pagpapatuloy sa magkakasunod na mga salinlahi.
- source_word: נְסַפֵּר
  choice: isasalaysay namin
  rationale: Ang Piel ng ספר ay tumutukoy sa pagkukuwento o masusing pagsasabi. Ang “isasalaysay” ay angkop sa paulit-ulit na pagpapahayag sa bawat salinlahi.
- source_word: תְּהִלָּתֶךָ
  choice: ang papuri sa iyo
  rationale: Pinananatili nito ang pangunahing diwa ng papuring nakatuon sa Diyos, habang nagiging malinaw at natural sa modernong Tagalog.
theological_decisions:
- issue: Larawang pastoral para sa bayang nakikipagtipan sa Diyos
  choice: 'Panatilihin nang tahasan ang metapora: “ang mga tupa sa iyong pastulan.”'
  alternative: ang iyong kawan
  rationale: Tinutukoy ng talata ang sumasambang pamayanan bilang bayan ng Diyos at bilang mga tupang nasa kaniyang pangangalaga. Pinananatili nito ang larawang pangpastol nang hindi nagdaragdag ng mga doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “bayan,” “pastulan,” at “sali't salinlahi” upang mapanatili ang matulaing himig ng awit nang hindi nagiging lipas o labis na pormal.
