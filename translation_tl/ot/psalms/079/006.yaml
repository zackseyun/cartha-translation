base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: tl
  text: Ibuhos mo ang iyong poot sa mga bansang hindi nakakakilala sa iyo[a], at sa mga kahariang hindi tumatawag sa iyong pangalan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kumikilala sa iyo.” Ang Hebreong “makilala” ay maaaring tumukoy sa relasyonal na pagkilala, hindi lamang sa kaalamang pangkaisipan.
    reason: lexical_alternative
  - marker: b
    text: O “hindi nananawagan sa iyong pangalan.” Ang Hebreong idyomang “tumawag sa pangalan” ay tumutukoy sa mapanalanging paglapit o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Ibuhos mo
  rationale: Tuwirang pautos na pinananatili ang matingkad na larawan ng poot na ibinubuhos.
- source_word: חֲמָתְךָ
  choice: ang iyong poot
  rationale: Ang חֵמָה ay matinding nag-aalab na galit; ang “poot” ay marangal, malinaw, at angkop sa panalangin para sa paghatol.
- source_word: אֶל הַגּוֹיִם
  choice: sa mga bansa
  rationale: Tinutukoy ng גּוֹיִם ang mga dayuhang bayan o bansa; iniiwasan ng “mga bansa” ang mga asosasyong maaaring idulot ng “mga Hentil.”
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: na hindi kumikilala sa iyo
  rationale: Kapag Diyos ang layon, ang יָדַע ay maaaring mangahulugan ng relasyonal na pagkilala, hindi lamang pagkakaroon ng kaalaman. Likas sa Filipino ang “kumikilala sa iyo” at pinananatili nito ang gayong diwa.
- source_word: וְעַל מַמְלָכוֹת
  choice: at sa mga kaharian
  rationale: Pinananatili ang koordinasyon at makatang paralelismo ng “mga bansa” at “mga kaharian.”
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: na hindi tumatawag sa iyong pangalan
  rationale: Pinananatili ang idyomang קרא בשם, na tumutukoy sa mapanalanging pagtawag, paghingi ng tulong, o pagsamba.
theological_decisions:
- issue: Ang kahulugan ng “pagkilala/pagkaalam” sa Diyos ng mga bansa
  choice: hindi kumikilala sa iyo
  alternative: hindi nakakakilala sa iyo / hindi ka kinikilala
  rationale: Ipinahihiwatig ng Hebreong יָדַע ang relasyonal na pagkilala ngunit hindi ito dapat paliitin tungo lamang sa pagsamba. Ang talababa ay nagpapanatili sa literal na posibilidad na “hindi nakakakilala.”
- issue: Ang diwa ng pagtawag sa pangalan ng Diyos
  choice: tumatawag sa iyong pangalan
  alternative: dumadalangin sa iyo / nananawagan sa iyong pangalan
  rationale: Pinananatili ng salin ang biblikal na idyoma at ang lawak nitong maaaring sumaklaw sa panalangin, paghingi ng tulong, at pagsamba nang hindi pumipili ng iisang pakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Ibuhos mo” upang mapanatili ang lakas ng pautos at ang metapora; pinanatili rin ang paralelismo ng “mga bansa” at “mga kaharian.”
