base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: tl
  text: Bakit sasabihin ng mga bansa, “Nasaan ang kanilang Diyos?” Nawa’y maihayag sa mga bansa, sa harap ng aming mga mata, ang paghihiganti dahil sa dugong dumanak ng iyong mga lingkod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Nawa’y maihayag sa mga bansa, sa harap ng aming mga mata: ang paghihiganti dahil sa dugong dumanak ng iyong mga lingkod.”'
    reason: Ipinakikita ng alternatibo na maaaring ituring ang “paghihiganti dahil sa dugong dumanak ng iyong mga lingkod” bilang nilalaman ng dapat maihayag; pinananatili nito ang kaluwagan ng sintaks ng Hebreo.
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Naghahayag ito ng retorikal na pagtutol; likas at tuwiran ang “Bakit” sa makabagong Tagalog.
- source_word: יֹאמְרוּ
  choice: sasabihin
  rationale: Ang anyong di-ganap ay angkop na ipinapahayag sa hinaharap o potensiyal na “sasabihin” sa retorikal na tanong.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga banyagang bansa o bayan; iniiwasan ng “mga bansa” ang mas makitid na relihiyosong diwa ng “mga Hentil.”
- source_word: אַיֵּה
  choice: Nasaan
  rationale: Tuwirang tanong ito tungkol sa kinaroroonan at nagpapanatili sa mapanuyang hamon.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: Ang tinutukoy ay ang Diyos ng Israel ayon sa pananalita ng mga bansa.
- source_word: יִוָּדַע
  choice: Mahayag nawa
  rationale: Pinananatili nito ang balintiyak na diwa ng Niphal at ang himig ng panalangin, nang hindi tahasang nagdaragdag ng simuno.
- source_word: בַגּוֹיִם
  choice: sa mga bansa
  rationale: Ipinahihiwatig ng pang-ukol ang larangan o pangkat na pagmumulan ng hayag na pagkilala.
- source_word: לְעֵינֵינוּ
  choice: sa harap ng aming mga mata
  rationale: Pinananatili ang matingkad na idyoma para sa isang pangyayaring hayag at personal nilang masasaksihan.
- source_word: נִקְמַת
  choice: ang paghihiganti
  rationale: Tahasang tumutukoy ang salita sa pagganti o paghihiganti, hindi lamang sa pangkalahatang katarungan.
- source_word: דַּם
  choice: dugo
  rationale: Pinananatili ang literal na larawan ng dugo, na nagpapahiwatig ng marahas na kamatayan at pananagutan dito.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa panalanging nakatuon sa Diyos, ang “mga lingkod” ang natural at angkop na tawag sa kaniyang bayan.
- source_word: הַשָּׁפוּךְ
  choice: ibinuhos
  rationale: Inilalarawan ng balintiyak na pandiwaring ito ang dugong marahas na pinadanak; likas sa Tagalog ang “ibinuhos na dugo.”
theological_decisions:
- issue: Panalangin para sa paghihiganti ng Diyos
  choice: Pinanatili ang “paghihiganti” at hindi pinalambot bilang pangkalahatang “katarungan.”
  alternative: “Mahayag ang katarungan para sa dugo ng iyong mga lingkod.”
  rationale: Hayagang ginagamit ng Hebreo ang נְקָמָה, at hinihiling ng salmo ang nakikitang pagganti at pagbibigay-katuwiran ng Diyos.
- issue: Kaugnayan ng “sa harap ng aming mga mata”
  choice: Iniugnay ito sa hayag na pagpapakita ng paghihiganti sa mga bansa.
  alternative: Iugnay ito nang mas mahigpit sa mismong “paghihiganti.”
  rationale: May kaunting kaluwagan ang ayos ng Hebreo, ngunit malinaw sa salin na hinihiling ng mga nananalangin na personal nilang masaksihan ang hayag na pagganti.
- issue: Balintiyak na anyo ng יִוָּדַע
  choice: “Mahayag nawa,” nang walang tahasang idinagdag na gumagawa.
  alternative: “Ihayag mo,” na tahasang ginagawang Diyos ang simuno.
  rationale: Bagaman malinaw sa konteksto na pagkilos ng Diyos ang hinihiling, pinananatili ng balintiyak na salin ang gramatikal na anyo at bahagyang di-tahasang pahayag ng pinagmulang teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Mahayag nawa” upang mapanatili ang balintiyak at panalanging himig ng Hebreo; pinanatili rin ang matinding salitang “paghihiganti” at ang larawang “ibinuhos na dugo.”
