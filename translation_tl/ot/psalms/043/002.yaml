  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: tl
  text: Sapagkat ikaw ang Diyos na aking kanlungan[a]; bakit mo ako itinakwil? Bakit ako naglalakad-lakad na nagdadalamhati sa ilalim ng pang-aapi ng kaaway?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Diyos na aking tanggulan” o “ang Diyos na aking lakas.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, maaari ring isalin: “Bakit ako naglalakad-lakad na nadidiliman sa ilalim ng pang-aapi ng kaaway?” Ang salitang literal na may diwang “nadidiliman” ay ginagamit dito bilang idyoma ng pagdadalamhati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapakita nito ang dahilan ng panawagan ng salmista at pinananatili ang ugnayang sanhi sa konteksto.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: ang Diyos na aking kanlungan
  rationale: Ang מָעוֹז ay maaaring tumukoy sa kanlungan, tanggulan, o lakas. Natural sa modernong Tagalog ang “Diyos na aking kanlungan” at malinaw nitong pinananatili ang larawan ng pag-iingat.
- source_word: לָמָה
  choice: bakit
  rationale: Tuwirang pananong ito na inulit upang mapanatili ang lakas ng panaghoy.
- source_word: זְנַחְתָּנִי
  choice: itinakwil
  rationale: Ipinahahayag ng זנח ang pagtatakwil o pagtataboy. Malinaw at matindi ang “itinakwil” ngunit hindi nito ipinapasok ang mas ganap na diwa ng tuluyang pag-abandona.
- source_word: קֹדֵר
  choice: nagdadalamhati
  rationale: Literal itong may diwang nadidiliman o nanlulumo, ngunit sa konteksto ay idyoma para sa pagluluksa o pagdadalamhati.
- source_word: אֶתְהַלֵּךְ
  choice: nag­lalakad-lakad
  rationale: Ipinahihiwatig ng anyong hitpael/imperfect ang nagpapatuloy na pagkilos o kalagayan; ang “naglalakad-lakad” ay malapit sa larawan ng Hebreo at natural sa Tagalog.
- source_word: בְּלַחַץ
  choice: dahil sa pang-aapi
  rationale: Ang לַחַץ ay tumutukoy sa paninikil, kagipitan, o pang-aapi. Dito, maaaring ipahayag ng בְּ ang sanhi o kalagayang kinasasadlakan.
- source_word: אוֹיֵב
  choice: ng kaaway
  rationale: Ang isahang pangngalan ay maaaring tumukoy sa isang kilalang kaaway o kumatawan sa mga kalaban; pinananatili ng salin ang isahan.
theological_decisions:
- issue: Pananalita tungkol sa pagtatakwil ng Diyos sa isang panaghoy
  choice: bakit mo ako itinakwil?
  alternative: bakit mo ako pinabayaan?
  rationale: Pinananatili ang tuwirang reklamo at teolohikal na tensiyon ng salmista. Hindi ito pinalalambot bilang damdamin lamang at hindi rin pinalalakas tungo sa tiyak na ganap na pag-abandona.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang dalawang magkasunod na tanong at ang tuwirang panaghoy. Ang pangunahing teksto ay gumagamit ng malinaw na idyomatikong “nagdadalamhati,” habang inilalagay sa talababa ang mas literal na larawang “nanlulumo/madilim.”
