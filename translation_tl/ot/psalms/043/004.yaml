  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: tl
  text: Sa gayon ay pupunta ako sa altar ng Diyos, sa Diyos, ang kagalakan ng aking pagsasaya[a]. Pupurihin kita sa saliw ng lira[b], O Diyos, Diyos ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na pagpapahayag, “aking sukdulang kagalakan.” Literal na sinasabi ng Hebreo, “kagalakan ng aking pagsasaya,” na gumagamit ng dalawang magkaugnay na salita para sa galak upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: O “harpa.” Ang Hebreong kinnor ay isang sinaunang instrumentong de-kuwerdas, na malamang ay mas kahawig ng lira.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: Sa gayon ay pupunta ako
  rationale: Ang anyong cohortative ng בוא ay nagpapahayag ng pasiya o nilalayong bunga kasunod ng mga kahilingan sa naunang talata. Likas sa Filipino ang “Sa gayon ay pupunta ako” at naipakikita nito ang ugnayang iyon.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: sa altar ng Diyos
  rationale: Tuwirang inililipat ang construct chain habang pinananatili ang marangal at malinaw na pananalita.
- source_word: אֶל אֵל
  choice: sa Diyos
  rationale: Dito, ang אֵל ay titulong tumutukoy sa Diyos at kaagapay ng אֱלֹהִים. Hindi kailangang piliting pag-ibahin ang dalawang katawagan.
- source_word: שִׂמְחַת גִּילִי
  choice: kagalakan ng aking pagsasaya
  rationale: Pinananatili ang magkaugnay at inuulit na mga salitang Hebreo para sa galak, na nagbibigay-diin sa tindi ng kagalakan.
- source_word: וְאוֹדְךָ
  choice: Pupurihin kita
  rationale: Maaaring mangahulugan ang ידה sa Hiphil na “magpasalamat” o “magpuri.” Ang konteksto ng pagsamba na may instrumentong pangmusika ay pumapabor sa “pupurihin.”
- source_word: בְכִנּוֹר
  choice: sa saliw ng lira
  rationale: Ang כִּנּוֹר ay sinaunang instrumentong de-kuwerdas na mas malapit sa lyre kaysa sa makabagong harpa. Likas sa Filipino ang “sa saliw ng lira” para sa papuring may kasamang pagtugtog.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: O Diyos, Diyos ko
  rationale: Ipinahihiwatig ng “O” ang tuwirang pagtawag, at pinananatili ng “Diyos ko” ang personal na ugnayang nasa Hebreo.
theological_decisions:
- issue: Paglilipat sa magkaibang titulong אֱלֹהִים at אֵל
  choice: Parehong isinalin na “Diyos,” habang pinananatili ang pag-uulit.
  alternative: Isalin ang אֵל bilang “Makapangyarihang Diyos” o baybayin itong “El.”
  rationale: Ang dalawang katawagan ay patulang tumutukoy sa iisang Diyos sa talata; walang malinaw na layuning gumawa rito ng doktrinal na pagkakaiba.
- issue: Diin ng dobleng pananalita tungkol sa galak
  choice: “kagalakan ng aking pagsasaya”
  alternative: “aking sukdulang kagalakan”
  rationale: Pinananatili ng napiling anyo ang kapansin-pansing pag-uulit sa Hebreo at hindi nito tahimik na pinapalitan ang parirala ng isang pagpapakahulugang pang-uri.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang pag-uulit ng mga salitang tumutukoy sa Diyos at sa galak, habang ginawang likas ang daloy sa Filipino.
