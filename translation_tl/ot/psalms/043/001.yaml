  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: tl
  text: Ipagtanggol mo ako[a], O Diyos, at ipaglaban mo ang usapin ko laban sa bansang hindi tapat; iligtas mo ako mula sa taong mapanlinlang at di-makatarungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bigyan mo ako ng makatarungang hatol.” Ang “bansang hindi tapat” ay maaari ring isalin na “bansang hindi makadiyos”; sa Hebreo, “isang bansang hindi tapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Ipagtanggol mo ako
  rationale: Sa konteksto ng panalanging legal, hinihiling ng salmista na humatol ang Diyos para sa kaniya at patunayang matuwid ang kaniyang panig. Ang “ipagtanggol” ay natural sa Filipino at naghahatid ng ganitong diwang forensic.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos sa loob ng panalangin; pinananatili ng “O Diyos” ang marangal na anyong bokatibo.
- source_word: וְרִיבָה רִיבִי
  choice: at ipaglaban mo ang usapin ko
  rationale: Ang pandiwa at kaugnay na pangngalang mula sa ריב ay isang legal na idyoma para sa pagharap o pagtatanggol sa kaso ng isang tao. Pinananatili ng salin ang larawang panghukuman sa natural na Filipino.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: laban sa bansang hindi tapat
  rationale: Sa legal na idyoma, ang pang-ukol ay tumutukoy sa katunggaling panig. Ang לֹא חָסִיד ay nagsasaad ng kawalan ng katapatan o matapat na debosyon, kaya “hindi tapat” ang pinili nang hindi nililimitahan sa isang sektaryong pakahulugan.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: mula sa taong mapanlinlang at di-makatarungan
  rationale: Ang isahan na אִישׁ at mga abstraktong katangiang kasunod nito ay tumutukoy sa isang taong likas na mapanlinlang at gumagawa ng kawalang-katarungan. Pinananatili ang isahang pokus at legal-etikal na diwa.
- source_word: תְפַלְּטֵנִי
  choice: iligtas mo ako
  rationale: Ang anyong piel ng פלט ay humihiling na mailabas sa panganib at madala sa kaligtasan. Ang “iligtas” ay malinaw, karaniwan, at marangal sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng חָסִיד kapag may pagtanggi
  choice: hindi tapat
  alternative: hindi maka-Diyos; walang tapat na debosyon
  rationale: Kaugnay ang salita sa katapatan at matapat na debosyon. Ang “hindi tapat” ay nagpapanatili sa relasyonal at etikal na diin, samantalang inilalahad sa talababa ang mas tradisyonal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Pinanatili ang legal na larawan ng talata sa “ipagtanggol” at “usapin,” habang iniwasan ang labis na teknikal o makalumang pananalita.
