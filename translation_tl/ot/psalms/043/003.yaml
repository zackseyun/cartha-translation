base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: tl
  text: Ipadala mo ang iyong liwanag at ang iyong katotohanan[a]; sila nawa ang gumabay sa akin at magdala sa akin sa iyong banal na bundok at sa mga tahanan mo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong katapatan.” Ang salitang Hebreo ay maaaring mangahulugang katotohanan, pagiging maaasahan, o katapatan.
    reason: lexical_alternative
  - marker: b
    text: Maramihan ang anyong Hebreo na isinaling “mga tahanan”; sa tradisyonal na pananalita, “mga tabernakulo mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Ipadala mo
  rationale: Ang pautos na anyo ay tuwirang isinalin at ipinahihiwatig ang pagpapayaon sa liwanag at katotohanan bilang mga patnubay.
- source_word: אוֹרְךָ
  choice: iyong liwanag
  rationale: Pinananatili ang kongkretong larawang “liwanag” sa halip na ipaliwanag agad bilang paggabay o pagliligtas.
- source_word: אֲמִתְּךָ
  choice: iyong katotohanan
  rationale: Ang “katotohanan” ang pinakatuwirang katumbas, habang kinikilala sa talababa na maaari ring tumukoy ang salitang Hebreo sa katapatan o pagiging maaasahan.
- source_word: הֵמָּה יַנְחוּנִי
  choice: sila nawa ang gumabay sa akin
  rationale: Pinananatili ng “sila” ang tahasang maramihang panghalip at ang pagsasatao sa liwanag at katotohanan; ipinahahayag ng “nawa” ang pakiusap na diwa ng pandiwa.
- source_word: יְבִיאוּנִי
  choice: at magdala sa akin
  rationale: Ipinagpapatuloy nito ang maramihang simuno at ang kilos patungo sa presensiya ng Diyos nang hindi nagpapabigat sa taludtod.
- source_word: הַר קָדְשְׁךָ
  choice: iyong banal na bundok
  rationale: Likas na salin ito ng pariralang “bundok ng iyong kabanalan” at hindi nito tahasang idinaragdag ang pangalang Zion.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: mga tahanan mo
  rationale: Pinananatili ang maramihang anyo ng Hebreo sa malinaw at kasalukuyang Tagalog, nang hindi gumagamit ng mas teknikal o makalumang “mga tabernakulo.”
theological_decisions:
- issue: Kung ituturing ang “liwanag” at “katotohanan” bilang mga katangiang abstrakto lamang o bilang mga isinataong tagapatnubay
  choice: Pinanatili ang pagsasatao sa pamamagitan ng maramihang “sila” at ng mga pandiwang “gumabay” at “magdala.”
  alternative: Ipaliwanag ang mga ito bilang paraan lamang ng paggabay at pagliligtas ng Diyos.
  rationale: Tahasan sa Hebreo ang maramihang panghalip at mga pandiwa na bumabalik sa “liwanag” at “katotohanan”; pinananatili nito ang tula at tunay na larawan ng teksto.
- issue: Kung tutukuyin nang tahasan ang Zion o ang templo
  choice: “iyong banal na bundok” at “mga tahanan mo”
  alternative: “Zion” at “iyong templo/santuwaryo”
  rationale: Bagaman malamang na Zion at ang santuwaryo ang tinutukoy, mas malawak ang mismong mga salitang Hebreo; hindi dapat higitan ng salin ang espesipikong sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang panalanging patula, ang pagsasatao sa liwanag at katotohanan, at ang maramihang “mga tahanan,” habang iniwasan ang makaluma o labis na teknikal na pananalita.
