  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: tl
  text: 'Bakit ka nanlulumo, kaluluwa ko,

    at bakit ka nababagabag sa loob ko?

    Umasa ka sa Diyos,

    sapagkat pupurihin ko pa siya—

    siya ang kaligtasan ng aking mukha[a] at ang aking Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pagliligtas ng aking mukha.” Maaari ring tumukoy ito sa Diyos bilang siyang nagpapanauli ng sigla sa mukha ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: nanlulumo
  rationale: Ipinahihiwatig ng pandiwa ang pagyuko o panlulupaypay. Likas sa makabagong Tagalog ang “nanlulumo” para sa matinding panghihina ng loob habang pinananatili ang larawan ng bagsak na kalooban.
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Tumutukoy rito sa panloob na sarili na kinakausap ng salmista. Pinananatili ng “kaluluwa ko” ang anyong patula at ang tuwirang pakikipag-usap sa sarili.
- source_word: תֶּהֱמִי
  choice: nababagabag
  rationale: Inilalarawan ng salita ang pagkabalisa o pag-aalimpuyo sa loob. Ang “nababagabag” ay malinaw, natural, at marangal sa kasalukuyang Tagalog.
- source_word: עָלָי
  choice: sa loob ko
  rationale: Literal itong “sa ibabaw ko” o “laban sa akin,” ngunit sa konteksto ng panloob na pagkabagabag, natural na ipinahahayag sa Tagalog bilang “sa loob ko.”
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Umasa ka sa Diyos
  rationale: Ang pautos ay tumatawag sa matiising paghihintay na may pagtitiwala sa Diyos. Maikli at natural ang “umasa ka sa Diyos.”
- source_word: עוֹד אוֹדֶנּוּ
  choice: muli ko pa siyang pupurihin
  rationale: Ipinahihiwatig ng עוֹד ang papuring darating pa sa kabila ng kasalukuyang dalamhati. Ipinapahayag ito ng “muli ko pa” nang natural sa Tagalog.
- source_word: יְשׁוּעוֹת פָּנַי
  choice: ang kaligtasan ng aking mukha
  rationale: Pinananatili ang di-pangkaraniwang konkretong larawan ng Hebreo, na literal na “mga pagliligtas ng aking mukha.” Ang pang-isahang “kaligtasan” ay kumakatawan sa abstrakto o masidhing gamit ng pangmaramihan.
- source_word: וֵאלֹהָי
  choice: at ang aking Diyos
  rationale: Pinananatili ang tuwirang pangwakas na parirala at ang kaugnayan nito sa naunang paglalarawan sa Diyos.
theological_decisions:
- issue: Kahulugan at sintaks ng יְשׁוּעוֹת פָּנַי
  choice: siya ang kaligtasan ng aking mukha at ang aking Diyos
  alternative: siya ang nagpapasigla sa aking mukha at ang aking Diyos
  rationale: Hindi ganap na nililinaw ng Hebreo kung paano dapat unawain ang “kaligtasan ng aking mukha.” Pinananatili sa pangunahing teksto ang kakaibang larawan sa halip na tahimik na ipakahulugang pagbuti ng damdamin o ekspresyon; ibinibigay sa talababa ang mas malinaw na posibleng diwa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may bahagyang patulang ayos para sa salmo. Ginamit ang “kaluluwa ko” dahil malinaw at pamilyar ito sa pakikipag-usap ng salmista sa kanyang panloob na sarili. Sadyang pinanatili ang konkretong “mukha” at ipinaliwanag ang posibleng diwa sa talababa.
