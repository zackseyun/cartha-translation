  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: tl
  text: Ipakita mo sa iyong mga lingkod ang iyong gawa, at ang iyong karilagan sa kanilang mga anak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: Ipakita mo
  rationale: Ang anyong jussive na literal na ‘nawa’y makita’ ay likas na naipahahayag sa Tagalog bilang pakiusap na ‘Ipakita mo,’ habang pinananatiling Diyos ang nagpapahayag ng kanyang gawa.
- source_word: פָעֳלֶךָ
  choice: ang iyong gawa
  rationale: Pinananatili ang kolektibo at malawak na kahulugan ng singular na ‘gawa’—ang pagkilos o ginawa ng Diyos—nang hindi nililimitahan sa isang tiyak na gawa.
- source_word: הֲדָרְךָ
  choice: ang iyong karilagan
  rationale: Ang ‘karilagan’ ay dignified at malinaw na katumbas ng hadar, na maaaring tumukoy sa kadakilaan, ningning, o maringal na kagandahan.
- source_word: עַל־בְּנֵיהֶם
  choice: sa kanilang mga anak
  rationale: Natural na Tagalog para sa ‘upon their children’; hindi ipinipilit ang pisikal na diwa ng עַל, na rito ay nagsasaad ng pagpapakita o paglagak ng karilagan sa susunod na salinlahi.
theological_decisions:
- issue: Ugnayan ng ‘gawa’ at ‘karilagan’ sa dalawang salinlahi
  choice: 'Panatilihin ang magkatulad ngunit magkahiwalay na pakiusap: gawa sa mga lingkod, karilagan sa kanilang mga anak.'
  alternative: Ipaliwanag na iisang pagliligtas na gawa ang kapuwa nila makikita.
  rationale: Hindi tahasang pinapantay o nililimitahan ng Hebreo ang dalawang parirala; pinananatili ng salin ang paralelismo at bukas na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘mga lingkod’ at ‘karilagan’ upang mapanatili ang panalanging tono at poetikong paralelismo.
