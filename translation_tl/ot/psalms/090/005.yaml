translation_notes:
  register: Modernong Filipino Tagalog na patula ngunit madaling maunawaan. Ginamit ang “tinatangay,” “panaginip,” at “muling sumisibol” upang maging likas ang daloy, habang inilalantad sa mga talababa ang literal at alternatibong pagbasa ng masinsing Hebreo.
