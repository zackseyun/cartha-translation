  text: זְ֭רַמְתָּ/ם שֵׁנָ֣ה יִהְי֑וּ בַּ֝/בֹּ֗קֶר כֶּ/חָצִ֥יר יַחֲלֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: tl
  text: Tinatangay mo sila[a]; para silang panaginip[b]. Sa umaga, para silang damong muling sumisibol[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Inaagos mo sila palayo.”
    reason: Pinananatili nito ang posibleng tahasang larawan ng rumaragasang tubig sa pandiwang Hebreo.
  - marker: b
    text: Sa literal, “para silang tulog.”
    reason: Ang salitang Hebreo ay “tulog”; “panaginip” ang natural na pagpapahayag ng larawan sa pangunahing teksto.
  - marker: c
    text: 'Maaari ring unawain: “Sa umaga, gaya sila ng damong nagbabago.” Napakasiksik ng Hebreo, at pang-isahan ang huling pandiwa, na pormal na tumutugma sa “damo.”'
    reason: Ipinakikita ang saklaw ng kahulugan ng יַחֲלֹף at ang di-tiyak na sintaks nang hindi binabago ang pangunahing pagbasa ayon sa konteksto.
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Tinatangay mo sila
  rationale: Ipinahihiwatig ng pandiwa ang marahas at biglang pagdadala ng rumaragasang agos. Likas sa modernong Tagalog ang “tinatangay” at hindi nito kailangang tahasang idagdag ang salitang “baha.”
- source_word: שֵׁנָה יִהְיוּ
  choice: para silang panaginip
  rationale: Literal na “tulog” ang שֵׁנָה, ngunit sa siksik na taludtod ang larawan ay nagpapahayag ng panandalian at tila di-matibay na buhay. Mas natural sa Tagalog ang “parang panaginip”; pinananatili sa talababa ang mas literal na “parang tulog.”
- source_word: בַּבֹּקֶר
  choice: Sa umaga
  rationale: Tuwirang pinananatili ang panandang pangpanahon at ang paghahanda nito sa paghahambing sa damo.
- source_word: כֶּחָצִיר
  choice: parang damo
  rationale: Karaniwang tumutukoy ang חָצִיר sa damo o luntiang halaman; malinaw at natural ang “damo” sa larawang patula.
- source_word: יַחֲלֹף
  choice: muling sumisibol
  rationale: Sa konteksto ng kasunod na taludtod, inilalarawan ang damong sariwang sumusulpot at namumukadkad sa umaga bago matuyo sa gabi. Ang pang-isahang pandiwa ay pormal na tumutugma sa “damo,” kaya inilagay ito sa sugnay na naglalarawan sa damo.
