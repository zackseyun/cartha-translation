base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: tl
  text: Bago pa isilang ang mga bundok at bago mo iluwal[a] ang lupa at ang daigdig, mula sa walang hanggan hanggang sa walang hanggan, ikaw ay Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isilang mo”; ang pandiwang Hebreo ay may larawan ng paghihirap sa panganganak at pagluwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Bago pa
  rationale: Likas na pahayag ng panahong nauuna sa paglikha; ang “pa” ay nagbibigay-diin na umiiral na ang Diyos bago ang mga inilalarawang pangyayari.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Pinananatili ang tiyak na maramihang pangngalan at ang makatang larawan ng sinaunang paglikha.
- source_word: יֻלָּדוּ
  choice: isilang
  rationale: Tuwirang pinananatili ang talinghaga ng kapanganakan na inilalapat sa mga bundok.
- source_word: וַתְּחוֹלֵל
  choice: iluwal
  rationale: Ipinahahayag ang paggawa o paglalabas sa pamamagitan ng talinghaga ng panganganak, gaya ng lakas ng pandiwang Hebreo, nang hindi ito pinapantay lamang sa “likhain.”
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Sa kosmikong konteksto at kaagapay ng תֵבֵל, tumutukoy ito sa lupa o earth, hindi sa isang natatanging lupain.
- source_word: וְתֵבֵל
  choice: ang daigdig
  rationale: Natural at marangal na katumbas ng mundong maayos o pinaninirahan; napapanatili rin ang pagkakaiba nito sa “lupa.”
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Pinananatili ang idyomang Hebreo para sa walang takdang pag-iral sa magkabilang direksiyon ng panahon.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinananatili ang tahasang panghalip at ang diin nito sa Diyos bilang paksa.
- source_word: אֵל
  choice: Diyos
  rationale: Malinaw at karaniwang salin ng banal na katawagan sa kontekstong ito nang hindi nagdaragdag ng kahulugang hindi hinihingi ng talata.
theological_decisions:
- issue: Talinghaga ng pagsilang at panganganak sa paglalarawan ng paglikha
  choice: Pinanatili ang “isilang” para sa mga bundok at “iluwal” para sa lupa at daigdig.
  alternative: Palabuin ang larawan sa pamamagitan ng “likhain,” “gawin,” o “hubugin.”
  rationale: Kapwa pandiwa sa Hebreo ay gumagamit ng larawan ng kapanganakan o paghihirap sa panganganak. Mahalaga ang larawang ito sa tula at ipinakikitang nauuna ang Diyos sa sangnilikha, nang hindi nagpapasok ng karagdagang paliwanag tungkol sa paraan ng paglikha.
- issue: Walang hanggang pag-iral ng Diyos
  choice: mula sa walang hanggan hanggang sa walang hanggan, ikaw ay Diyos
  alternative: mula sa kawalang-hanggan hanggang sa kawalang-hanggan, ikaw ay Diyos
  rationale: Pinananatili ng napiling anyo ang idyomang Hebreo at ang pahayag na ang Diyos ay umiiral bago at lampas sa sangnilikha, nang hindi pilosopikal na nililimitahan ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “bago” sa ikalawang sugnay upang maging malinaw at natural sa Tagalog na kapwa nauuna sa pagsilang ng mga bundok at pagluwal sa lupa at daigdig ang pag-iral ng Diyos. Pinanatili ang matapang na talinghaga ng kapanganakan sa halip na pakinisin ito bilang simpleng “paglikha.”
