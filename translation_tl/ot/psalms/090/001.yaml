source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: tl
  text: 'Panalangin ni Moises[a], ang tao ng Diyos.


    Panginoon, ikaw ang naging tahanan[b] namin sa sali’t salinlahi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘mula kay Moises’ o ‘para kay Moises.’ Sa pamagat, ang Hebreong pang-ukol ay maaaring tumukoy sa may-akda, kaugnayan, o pag-aalay.
    reason: alternative_reading
  - marker: b
    text: Maaari ring ‘tirahan’ o ‘kanlungan.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Panalangin
  rationale: Likas at tuwirang katawagan ito sa uri ng awit sa pamagat.
- source_word: לְמֹשֶׁה
  choice: ni Moises
  rationale: Karaniwang anyo ito sa mga pamagat sa Filipino at maaari pa ring magpahiwatig ng kaugnayan kay Moises; ipinaliliwanag sa talababa ang lawak ng Hebreong pang-ukol.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  rationale: Pinananatili nito ang tiyak at pormal na titulong Hebreo para kay Moises nang hindi ito binibigyang-kahulugang ‘lingkod.’
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang likas at kinikilalang salin sa Filipino ng banal na titulong ginagamit bilang tuwirang pagtawag sa Diyos.
- source_word: מָעוֹן
  choice: tahanan
  rationale: Pinananatili ng ‘tahanan’ ang larawan ng Diyos bilang matatag na dakong tinitirhan at kinabibilangan; hindi nito agad nililimitahan ang larawan sa proteksiyon lamang.
- source_word: הָיִיתָ לָּנוּ
  choice: ikaw ang naging ... namin
  rationale: Ipinahahayag nito na sa patuloy na karanasan ng bayan, ang Diyos ay naging kanilang tahanan; ang pangungusap ay pinanatiling natural sa Filipino.
- source_word: בְּדֹר וָדֹר
  choice: sa sali’t salinlahi
  rationale: Likas na idyomang Filipino ito para sa pagpapatuloy sa magkakasunod na henerasyon.
theological_decisions:
- issue: Saklaw ng לְ sa pamagat na לְמֹשֶׁה
  choice: Isinalin bilang ‘ni Moises,’ na may talababa tungkol sa posibleng kaugnayan o pag-aalay.
  alternative: ‘mula kay Moises’ o ‘para kay Moises’
  rationale: Maaaring tumukoy ang pang-ukol sa may-akda, kaugnayan, o pag-aalay. Hindi dapat ipasiya ng salin lamang ang tanong tungkol sa pagkakasulat.
- issue: Larawan ng Diyos bilang מָעוֹן
  choice: tahanan
  alternative: kanlungan o tirahan
  rationale: Ang ‘tahanan’ ay nagpapanatili sa malawak na metapora ng pananahan at katiwasayan; ang ‘kanlungan’ ay mas tahasang nagpapakahulugan bilang proteksiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘tao ng Diyos’ upang mapanatili ang pormal na titulong Hebreo, at ang ‘sali’t salinlahi’ bilang malinaw at pamilyar na idyoma.
