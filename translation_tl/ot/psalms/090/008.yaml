  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: tl
  text: Inilagay mo sa harap mo ang aming mga pagkakasala, ang aming mga lihim na kasalanan[a] sa liwanag ng iyong mukha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aming mga lihim” o “ang aming mga bagay na nakatago.” Ang salitang Hebreo ay tumutukoy sa nakatago o inililihim; dahil kaagapay ito ng “aming mga pagkakasala,” maaaring tumukoy ito sa mga lihim na kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa liwanag ng iyong mukha” ay larawang nagpapahiwatig na ganap na nalalantad ang mga lihim na bagay sa presensya at paningin ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת
  choice: Inilagay mo
  rationale: Ang perpektong anyo ng pandiwa ay tumutukoy sa tiyak at ganap na pagkilos ng Diyos; natural sa Tagalog ang payak na aspektong perpektibo.
- source_word: עֲוֺנֹתֵינוּ
  choice: aming mga kasamaan
  rationale: Pinananatili nito ang moral na bigat at maramihang diwa ng עָוֹן, na tumutukoy sa masasamang gawa o kasalanan.
- source_word: לְנֶגְדֶּךָ
  choice: sa harap mo
  rationale: Tuwirang ipinahahayag ang larawan ng paglalantad ng mga kasamaan sa paningin ng Diyos.
- source_word: עֲלֻמֵנוּ
  choice: aming mga lihim na kasalanan
  rationale: Ang salita ay tumutukoy sa mga bagay na ikinubli; dahil kaagapay ito ng 'aming mga kasamaan,' ipinahihiwatig ng konteksto na mga nakatagong kasalanan ang tinutukoy.
- source_word: לִמְאוֹר
  choice: sa liwanag ng
  rationale: Natural na inilalarawan sa Tagalog ang ganap na pagkakalantad sa ilalim ng liwanag.
- source_word: פָּנֶיךָ
  choice: iyong mukha
  rationale: Pinananatili ang kongkretong Hebreong larawan ng mukha ng Diyos sa halip na palitan ito ng mas interpretatibong 'presensya.'
theological_decisions:
- issue: Kung gagawing tahasan ang ipinahihiwatig na kasalanan sa עֲלֻמֵנוּ
  choice: aming mga lihim na kasalanan
  alternative: aming mga lihim; aming mga bagay na ikinubli
  rationale: Malakas na ipinahihiwatig ng parallelismo sa 'aming mga kasamaan' na nakatagong pagkakasala ang tinutukoy, ngunit itinatala sa talababa ang mas literal na saklaw ng salita.
- issue: Pagpapanatili sa larawan ng mukha ng Diyos
  choice: sa liwanag ng iyong mukha
  alternative: sa liwanag ng iyong presensya
  rationale: Ang 'mukha' ay tapat sa konkretong larawan ng Hebreo at nagpapahiwatig ng lubos na pagkakalantad sa harap ng Diyos nang hindi pinapawi ang poetikong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang poetikong larawang 'liwanag ng iyong mukha,' habang ginawang tahasan ang ipinahihiwatig na 'kasalanan' para sa likas na pagkaunawa sa Tagalog.
