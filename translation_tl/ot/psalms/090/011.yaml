lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Tuwirang pananong na may retorikal na diin; hindi na kailangang dagdagan ng mga salitang wala sa Hebreo.
- source_word: יוֹדֵעַ
  choice: nakaaalam
  rationale: Tuwirang katumbas ng participle mula sa ידע at likas sa retorikal na tanong.
- source_word: עֹז
  choice: tindi
  rationale: Ipinahahayag ang lakas o bagsik ng galit sa natural na Filipino; mas angkop sa kolokasyong “tindi ng galit” kaysa sa literal na “lakas.”
- source_word: אַפֶּךָ
  choice: iyong galit
  rationale: Sa idyomang ito, ang אַף ay tumutukoy sa galit, hindi sa literal na ilong o butas ng ilong.
- source_word: וּכְיִרְאָתְךָ
  choice: at … ayon sa pagkatakot na nararapat sa iyo
  rationale: Pinananatili ang pang-ugnay at ang paghahambing o pagtutugma ng כְּ, habang nililinaw sa natural na Filipino na ang tinutukoy ay pagkatakot na nauukol sa Diyos.
- source_word: עֶבְרָתֶךָ
  choice: iyong poot
  rationale: Naghahatid ng matinding galit at nagpapanatili ng leksikal na kaibhan mula sa naunang אַף.
theological_decisions:
- issue: Ugnayan ng poot ng Diyos at pagkatakot sa וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: at sa iyong poot ayon sa pagkatakot na nararapat sa iyo
  alternative: at ang iyong poot ay ayon sa pagkatakot sa iyo; kung paano ang pagkatakot sa iyo, gayon din ang iyong poot
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang Hebreo. Pinananatili ng pangunahing salin ang ugnayang ipinahihiwatig ng כְּ nang hindi tiyakang nilulutas kung paghahambing ng antas o pagtutugma ang ibig sabihin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nakaaalam,” “galit,” at “poot” upang mapanatili ang maikling retorikal na tanong at ang bahagyang pagkakaiba ng dalawang salitang Hebreo para sa matinding galit.
