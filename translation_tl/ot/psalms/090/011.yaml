  text: Sino ang nakaaalam sa lakas ng iyong galit[a], at sa iyong poot ayon sa takot na nararapat sa iyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At ang iyong poot ay ayon sa takot sa iyo,” o “Kung paano ang takot sa iyo, gayon din ang iyong poot.” Siksik ang pahayag sa Hebreo at maaaring unawain sa higit sa isang paraan.'
