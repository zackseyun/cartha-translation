  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: tl
  text: Sa umaga, sumisibol ito at yumayabong[a]; pagdating ng gabi, nalalanta[b] at natutuyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namumulaklak at lumilipas”; ang unang pandiwang Hebreo ay maaari ring tumukoy sa pamumulaklak, at ang ikalawa ay maaaring mangahulugang lumipas o magbago.
    reason: lexical_alternative
  - marker: b
    text: O “pinuputol”; ang pandiwang Hebreo ay maaaring tumukoy sa pagkalanta o sa pagkaputol.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Sa umaga
  rationale: Likas na pariralang temporal sa Filipino at malinaw na ipinapakita ang simula ng maikling siklo ng damo.
- source_word: יָצִיץ
  choice: ito'y sumisibol
  rationale: Ipinahahayag ang pag-usbong ng halaman; maaari rin itong tumukoy sa pamumulaklak, kaya inilalahad ang alternatibo sa talababa.
- source_word: וְחָלָף
  choice: at lumalago
  rationale: Sa talinghaga ng halaman, ipinahahayag nito ang masiglang pagdaan o pag-unlad ng damo sa maghapon. Pinananatili sa talababa ang mas literal ngunit hindi gaanong tiyak na diwang 'dumaraan.'
- source_word: לָעֶרֶב
  choice: pagsapit ng gabi
  rationale: Malinaw na itinatapat sa 'sa umaga' at ipinadarama ang mabilis na pagbabagong nagaganap sa loob lamang ng isang araw.
- source_word: יְמוֹלֵל
  choice: ito'y nalalanta
  rationale: Ang pandiwa ay maaaring maglarawan ng pagkalanta o pagkaputol. Ang 'nalalanta' ay angkop sa kaagapay na 'natutuyo' nang hindi nagpapalagay ng tahasang panlabas na gumawa.
- source_word: וְיָבֵשׁ
  choice: at natutuyo
  rationale: Tuwirang inilalarawan ang huling kalagayan ng halaman at natural ang pagkakasabi sa makabagong Filipino.
