  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: tl
  text: Busugin mo kami sa umaga ng iyong tapat na pag-ibig[a], upang kami'y humiyaw sa galak at magsaya sa buong buhay namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong pag-ibig na tapat sa tipan” o “iyong awa.” Ang Hebreong חֶסֶד ay nagpapahiwatig ng tapat, nananatili, at mapagkalingang pag-ibig.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Bigyang-kasiyahan mo kami
  rationale: Ang Piel imperative na may hulaping unang panauhang maramihan ay humihiling na lubos silang masiyahan o mapuspos. Likas sa modernong Filipino ang “bigyang-kasiyahan” at naipahahayag nito ang kasapatan at kasaganaan.
- source_word: בַבֹּקֶר
  choice: sa umaga
  rationale: Pinananatili ang tuwirang temporal na diwa nang hindi ito ginagawang paulit-ulit na “tuwing umaga” o takdang “pagsapit ng umaga.”
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag, tapat, at mapagkalingang pag-ibig. Ang pariralang ito ay malinaw sa karaniwang mambabasa at hindi nililimitahan ang salita sa awa lamang.
- source_word: וּנְרַנְּנָה
  choice: upang humiyaw kami sa galak
  rationale: Ang רנן ay nagsasaad ng malakas at masayang sigaw o awit. Ang cohortative kasunod ng pakiusap ay natural na ipinapahayag bilang layunin o bunga sa pamamagitan ng “upang.”
- source_word: וְנִשְׂמְחָה
  choice: at magsaya
  rationale: Ang שמח ay nangangahulugang magalak o magsaya. Pinananatili nito ang kahanay na ikalawang pagpapahayag ng kagalakan.
- source_word: בְּכָל יָמֵינוּ
  choice: sa lahat ng aming araw
  rationale: Tapat nitong pinananatili ang temporal na saklaw ng buong buhay ng mga nagsasalita at ang anyong “mga araw” ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa חֶסֶד sa panalangin para sa pabor ng Diyos
  choice: iyong tapat na pag-ibig
  alternative: iyong pag-ibig na tumutupad sa tipan; iyong awa
  rationale: Ipinahahayag nito ang nananatili at matapat na pag-ibig ng Diyos nang hindi nagpapasok ng mas makitid na doktrinal na pagbasa. Inilalahad sa talababa ang tunay na lawak ng salitang Hebreo.
- issue: Ugnayan ng mga cohortative sa pambungad na pautos
  choice: upang humiyaw kami sa galak at magsaya
  alternative: at hihiyaw kami sa galak at magsasaya
  rationale: Maaaring magpahiwatig ang mga cohortative ng ninanais na bunga o layunin ng pakiusap. Pinipili ang “upang” bilang natural na Filipino habang hindi itinuturing na tiyak na pangako ang tugon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang panalanging tono, ang temporal na “sa umaga,” at ang dalawang magkatugmang pagpapahayag ng kagalakan.
