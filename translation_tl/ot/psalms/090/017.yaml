base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: tl
  text: Nawa’y sumaamin ang kagandahang-loob[a] ng Panginoon naming Diyos. Patatagin mo para sa amin[b] ang gawa ng aming mga kamay; oo, patatagin mo ang gawa ng aming mga kamay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pabor,” “kagandahan,” o “pagiging kaaya-aya.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa ibabaw namin.” Maaaring idiomatikong mangahulugang “para sa amin” o “sa aming kapakinabangan.”
    reason: source_ambiguity
  - marker: c
    text: Inuulit sa Hebreo ang kahilingang “patatagin mo ang gawa ng aming mga kamay” upang bigyang-diin ito.
    reason: literary_feature
lexical_decisions:
- source_word: וִיהִי
  choice: Nawa’y sumaatin
  rationale: Ang anyong jussive ay nagpapahayag ng panalangin o kahilingan. Likas sa makabagong Tagalog ang “nawa’y,” at malinaw na naihahayag ng “sumaatin” ang larawan ng isang pagpapalang nananatili sa bayan.
- source_word: נֹעַם
  choice: kagandahang-loob
  rationale: Saklaw ng salita ang kaaya-ayang katangian, kagandahan, at pabor. Sa panalanging ito, ipinahihiwatig ng “kagandahang-loob” ang mabuting paglingap ng Diyos nang hindi lubusang inaalis ang diwa ng kagandahan at pagiging kaaya-aya.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Panginoon na aming Diyos
  rationale: Pinananatili nito ang dalawang banal na titulo at nililinaw sa natural na Tagalog na ang Panginoon ang Diyos ng sambayanan.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: ang gawa ng aming mga kamay
  rationale: Pinananatili ang konkretong larawang Hebreo para sa gawain, paggawa, at mga pinagsisikapan ng tao.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: Patatagin mo / patatagin mo
  rationale: Ang ugat na כון ay tumutukoy sa pagpapatibay o pagbibigay-katatagan. Ang “patatagin” ay hindi nagpapakitid sa kahulugan tungo lamang sa pagpapasagana, at ang pag-uulit ay nagpapanatili sa diin ng Hebreo.
- source_word: עָלֵינוּ
  choice: para sa amin
  rationale: Sa ikalawang paglitaw, ang literal na “sa ibabaw namin” ay malabo sa Tagalog. Ang “para sa amin” ay natural na nagpapahayag ng kapakinabangan o kaugnayan sa sambayanan habang minamarkahan sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Ang kahulugan ng נֹעַם bilang katangian o kaloob ng Diyos
  choice: kagandahang-loob
  alternative: pabor; kagandahan; pagiging kaaya-aya
  rationale: Iniiwasang limitahan ang salita sa materyal na tagumpay. Ang salin ay angkop sa panalangin para sa mabuting paglingap ng Diyos, habang pinananatili sa talababa ang tunay na lawak ng salitang Hebreo.
- issue: Ang hinihiling tungkol sa gawain ng tao
  choice: patatagin
  alternative: pagtagumpayin; pasaganain
  rationale: Ang talata ay humihiling na bigyan ng Diyos ng katatagan at pananatili ang gawa ng tao. Hindi tahasang nangangako ang Hebreo ng kasaganaan o tagumpay, kaya hindi iyon idinagdag.
translation_notes:
  register: Makabago ngunit marangal na wikang panalangin. Ginamit ang “nawa’y” at ang konkretong “gawa ng aming mga kamay” upang mapanatili ang himig at larawang patula, habang ginawang natural sa Tagalog ang ikalawang עָלֵינוּ bilang “para sa amin.”
