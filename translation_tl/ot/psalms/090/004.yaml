  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: tl
  text: Sapagkat ang isang libong taon sa iyong paningin ay tulad ng kahapon nang ito’y lumipas[a], o tulad ng isang yugto ng pagbabantay sa gabi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “habang dumaraan ito.” Maaaring magpahiwatig ang pariralang Hebreo ng bahagyang naiibang ugnayang temporal.
    reason: lexical_alternative
  - marker: b
    text: Ang “yugto ng pagbabantay” ay isang takdang bahagi ng gabi na itinalaga para sa pagbabantay.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag; likas sa konteksto ang panandang sanhi na “Sapagkat.”
- source_word: אֶלֶף שָׁנִים
  choice: isang libong taon
  rationale: Tuwirang pinananatili ang bilang at ang paghahambing ng panahon ng Diyos at ng tao.
- source_word: בְּעֵינֶיךָ
  choice: sa iyong paningin
  rationale: Pinananatili ang metapora ng Hebreo para sa pananaw o pagtataya, sa isang likas at marangal na pariralang Tagalog.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: tulad lamang ng kahapon
  rationale: Ang “kahapon” ay natural na katumbas sa Tagalog; ang “lamang” ay malinaw na naghuhudyat ng paghahambing nang hindi dinaragdagan ang diwa.
- source_word: כִּי יַעֲבֹר
  choice: kapag lumipas na ito
  rationale: Iniuugnay ang sugnay sa “kahapon” bilang araw na nagdaan na, habang pinananatili ang temporal na puwersa at ang bahagyang kaluwagan ng כִּי.
- source_word: וְאַשְׁמוּרָה
  choice: o tulad ng isang pagbabantay
  rationale: Ang pangatnig ay nagdaragdag ng ikalawang paghahambing; “o” ang pinakanatural na paraan upang ipakita ang magkatambal na larawan sa Tagalog.
- source_word: אַשְׁמוּרָה בַלָּיְלָה
  choice: isang pagbabantay sa gabi
  rationale: Tumutukoy ito sa takdang bahagi ng gabi na ginugugol sa pagbabantay; ang literal na larawan ay pinananatili at nililinaw sa talababa.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pananaw ng Diyos sa panahon
  choice: Panatilihin ang “sa iyong paningin” at ang dalawang paghahambing sa panahon.
  alternative: Ipaliwanag na ang isang libong taon ay walang halaga sa Diyos o na wari’y napakaikli nito para sa kaniya.
  rationale: Makatang inihahambing ng talata ang panahon sa pananaw ng Diyos at ng tao. Hindi ito pinalalawak tungo sa isang sistematikong pahayag tungkol sa kawalang-hanggan o pagiging wala sa panahon ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matulaing “sa iyong paningin” at iniwasan ang teknikal o makalumang katawagang “puyat” o “pagpupuyat,” na maaaring hindi malinaw bilang yunit ng gabi.
