  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: tl
  text: Sapagkat nauubos kami[a] dahil sa iyong galit; sa iyong matinding poot ay nasisindak kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasapit kami sa wakas dahil sa iyong galit.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkaubos, pagkamatapos, o pagsapit sa wakas.
    reason: lexical_alternative
  - marker: b
    text: O “nababagabag kami” o “naliligalig kami.” Ang pandiwang Hebreo ay nagpapahayag ng pagkasindak, pagkabalisa, o matinding takot.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng naunang pahayag at likas ang daloy nito sa makabagong Tagalog.
- source_word: כָלִינוּ
  choice: nauubos kami
  rationale: Ang pandiwang כלה ay maaaring mangahulugang maubos, matapos, o sumapit sa wakas. Pinananatili ng “nauubos” ang matinding epekto at ang resultang ipinahihiwatig ng anyo sa konteksto.
- source_word: בְאַפֶּךָ
  choice: dahil sa iyong galit
  rationale: 'Ang ב ay nauunawaan dito bilang sanhi o paraan: ang galit ng Diyos ang dahilan ng pagkaubos ng mga nagsasalita.'
- source_word: חֲמָתְךָ
  choice: iyong matinding poot
  rationale: Ang חֵמָה ay tumutukoy sa nag-aalab o matinding poot. Ang “matinding poot” ay natural sa Tagalog at naipakikita ang pagtindi kumpara sa אַף.
- source_word: נִבְהָלְנוּ
  choice: nasisindak kami
  rationale: Ang בהל ay nagsasaad ng pagkabigla, pagkabalisa, o matinding takot. Ang “nasisindak” ay dignified at natural, at pinananatili ang lakas ng tugon sa poot ng Diyos.
theological_decisions:
- issue: Paglalarawan sa dalawang magkaugnay na salita para sa galit ng Diyos
  choice: “galit” at “matinding poot”
  alternative: Gamitin ang iisang salitang “galit” sa dalawang parirala, o “galit” at “ngitngit”
  rationale: Magkaiba ngunit magkaugnay ang אַף at חֵמָה. Pinananatili ng dalawang salin ang paralelismo at pagtindi nang hindi nagdaragdag ng natatanging doktrinal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nauubos” upang mapanatili ang lawak ng Hebreong כלה, at “nasisindak” para sa matinding ngunit hindi labis na espesipikong tugon ng בהל. Ang mga footnote marker ay inilagay kaagad pagkatapos ng kaugnay na salita o sugnay.
