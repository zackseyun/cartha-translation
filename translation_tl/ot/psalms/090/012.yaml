  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: tl
  text: Ituro mo sa amin kung paano bilangin ang aming mga araw,[a] upang magtamo kami ng pusong may karunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Ipaalam mo sa amin na bilangin nang gayon ang aming mga araw, at magdadala kami ng pusong may karunungan.” Mahirap unawain ang Hebreo sa huling sugnay; marami ang nagpapakahulugan dito na “upang magtamo kami ng pusong may karunungan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: bilangin
  rationale: Tuwirang pinananatili ang konkretong talinghaga ng pagbibilang o pagtataya sa maikling haba ng buhay.
- source_word: יָמֵינוּ
  choice: aming mga araw
  rationale: Likas na salin ng pangngalang maramihan na may hulaping unang panauhang maramihan; sa konteksto, tumutukoy ito sa hangganang haba ng buhay ng tao.
- source_word: כֵּן
  choice: kung paano
  rationale: Ang כֵּן ay nangangahulugang ‘gayon’ o ‘sa ganitong paraan.’ Sa pangungusap na Filipino, ang ‘kung paano’ ay natural na nagpapahayag na hinihiling sa Diyos na ipaalam ang wastong paraan ng pagbilang sa mga araw, nang hindi idinaragdag ang tahasang salitang ‘wasto.’
- source_word: הוֹדַע
  choice: Ituro mo sa amin
  rationale: Ang Hiphil imperative ng ידע ay literal na ‘ipaalam’ o ‘pangyarihing malaman.’ Ang ‘Ituro mo sa amin’ ay likas at marangal na pananalita sa isang panalangin at pinananatili ang diwang ang Diyos ang nagbibigay ng pagkaunawa.
- source_word: וְנָבִא
  choice: upang magtamo kami
  rationale: Mahirap ang anyong Hebreo at maaari itong basahing mas literal bilang ‘at magdadala kami.’ Ang ‘magtamo’ ay nagpapahayag ng karaniwang pag-unawa na ang karunungan ang bunga o layunin ng pagtuturo ng Diyos, habang inilalahad sa talababa ang mas literal na posibilidad.
- source_word: לְבַב חָכְמָה
  choice: pusong may karunungan
  rationale: Pinananatili nito ang Hebreong larawan ng puso bilang kaloob-looban ng pag-iisip at pagpapasiya, at mas natural sa modernong Filipino kaysa sa literal na ‘puso ng karunungan.’
theological_decisions:
- issue: Pagpapakahulugan sa layunin o bunga sa huling sugnay
  choice: Ang panalangin ay humihiling na ipaunawa ng Diyos ang pagbilang sa maiikling araw ng tao upang magtamo ang mga nananalangin ng pusong hinubog ng karunungan.
  alternative: Maaaring mas literal na unawain ang huling bahagi bilang ‘at magdadala kami ng pusong may karunungan.’
  rationale: Siksik at mahirap ang sintaks ng Hebreo. Ang napiling salin ay natural at angkop sa pagninilay ng salmo tungkol sa mortalidad, ngunit hindi itinatago ang alternatibong mas literal na pagbasa; kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino para sa panalangin. Ang ‘kung paano bilangin’ ay mas likas kaysa sa matigas na literal na ‘bilangin nang gayon,’ samantalang pinananatili ng talababa ang tunay na kalabuan ng Hebreo.
