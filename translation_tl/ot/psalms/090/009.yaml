base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: tl
  text: Sapagkat ang lahat ng aming araw ay lumilipas sa iyong poot; inuubos namin ang aming mga taon na parang isang buntong-hininga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang mahinang bulong” o “isang daing.” Ang salitang Hebreo ay tumutukoy sa isang mahinang tunog; ginamit sa pangunahing teksto ang “buntong-hininga” upang ipahiwatig sa konteksto ang mabilis na paglipas ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o pagbibigay-dahilan na kaugnay ng naunang taludtod.
- source_word: כָל יָמֵינוּ
  choice: ang lahat ng aming araw
  rationale: Tuwirang pinananatili ang maramihang larawan ng mga araw at ang kaagapay nitong “mga taon.”
- source_word: פָּנוּ
  choice: lumilipas
  rationale: Sa konteksto ng panahon, ang pandiwa ay tumutukoy sa pagdaan o pagpanaw ng mga araw; natural sa modernong Tagalog ang “lumilipas.”
- source_word: בְעֶבְרָתֶךָ
  choice: sa iyong poot
  rationale: Pinananatili ng “poot” ang tindi ng עֶבְרָה, habang ang “sa” ay naghahayag ng kalagayan o saklaw kung saan lumilipas ang mga araw.
- source_word: כִּלִּינוּ
  choice: inuubos namin
  rationale: Naipapahayag ang Piel na diwa ng pag-ubos o pagdadala sa wakas ng mga taon, at natural itong kaagapay ng larawan ng maikling buhay.
- source_word: שָׁנֵינוּ
  choice: ang aming mga taon
  rationale: Pinananatili ang maramihan at ang paralelismo sa “lahat ng aming araw.”
- source_word: כְמוֹ
  choice: na parang
  rationale: Natural na panandang paghahambing sa modernong Tagalog.
- source_word: הֶגֶה
  choice: isang buntong-hininga
  rationale: Maaaring tumukoy ang salita sa mahinang tunog gaya ng bulong, daing, o buntong-hininga. Ang “buntong-hininga” ay angkop sa konteksto ng paglipas at kaiklian ng buhay, habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
theological_decisions:
- issue: Paglalarawan sa galit ng Diyos
  choice: iyong poot
  alternative: iyong galit; iyong matinding galit
  rationale: Malakas ang salitang Hebreo at tahasang iniuugnay ng taludtod ang paglipas ng buhay ng tao sa poot ng Diyos. Hindi ito pinalalambot o ipinapaliwanag nang lampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang paralelismo ng “mga araw” at “mga taon.” Inilagay ang pananda ng talababa pagkatapos ng “buntong-hininga,” ang salitang aktuwal na may leksikal na alternatibo.
