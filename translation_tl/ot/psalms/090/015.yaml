  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: tl
  text: Pasayahin mo kami ayon sa dami ng mga araw na pinahirapan mo kami, ayon sa dami ng mga taon na nakaranas kami ng kapahamakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kasawian,” “paghihirap,” o “kasamaan.” Malawak ang saklaw ng salitang Hebreo at maaari itong tumukoy sa kapahamakan, kahirapan, o moral na kasamaan ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Pasayahin mo kami
  rationale: Ang Piel imperative na may hulaping unang panauhang maramihan ay isang pakiusap na siya ang magdulot ng galak. Natural at malinaw sa modernong Tagalog ang “Pasayahin mo kami.”
- source_word: כִּימוֹת
  choice: nang kasindami ng mga araw na
  rationale: 'Ipinahahayag ng כ kasama ng “mga araw” ang pagtutumbas o proporsiyon: hinihiling ang galak na katumbas ng haba ng panahong nagdusa sila.'
- source_word: עִנִּיתָנוּ
  choice: pinahirapan mo kami
  rationale: Ang Piel ng ענה ay maaaring mangahulugang pahirapan o ibaba. Sa konteksto ng panaghoy at katambal ng רָעָה, ang “pinahirapan” ang pinakamalinaw nang hindi nililimitahan ito sa pang-aapi lamang.
- source_word: שְׁנוֹת
  choice: nang kasindami ng mga taong
  rationale: Ang maramihang anyong construct ay katumbas ng “mga araw” sa unang linya. Inulit ang proporsiyonal na parirala upang mapanatili ang paralelismo.
- source_word: רָאִינוּ
  choice: dumanas kami
  rationale: Literal itong “nakakita kami,” ngunit ang idyomang “makakita ng kapahamakan” ay tumutukoy sa pagdanas nito. Mas natural sa modernong Tagalog ang “dumanas kami” habang pinananatili ang diwa.
- source_word: רָעָה
  choice: kapahamakan
  rationale: Maaaring tumukoy ang רָעָה sa kasamaan, kasawian, o kapahamakan. Dito ay tumutukoy ito sa dinanas na matinding paghihirap, hindi sa moral na kasamaang ginawa ng mga nagsasalita.
theological_decisions:
- issue: Kahulugan ng רָעָה kaugnay ng pagkilos ng Diyos
  choice: kapahamakan bilang dinanas na kasawian o matinding paghihirap
  alternative: kasamaan; kasawian; paghihirap
  rationale: Itinatambal ng talata ang pagpapahirap at ang kapahamakang dinanas ng sambayanan. Hindi nito sinasabing gumawa sila ng moral na kasamaan; gayunman, hindi rin dapat palambutin ang tahasang pag-uugnay ng panalangin sa pagpapahirap ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nang kasindami” upang malinaw na ipahayag ang proporsiyonal na paghahambing ng mga araw at mga taon, at pinanatili ang tuwirang pakiusap sa Diyos.
