  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: tl
  text: Manumbalik ka, Yahweh—hanggang kailan? Mahabag ka[a] sa iyong mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magbago ka ng pasiya tungkol sa iyong mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Manumbalik ka
  rationale: Ang pautos na anyo ng שוב ay tuwirang nakatuon kay Yahweh. Pinananatili ng “manumbalik” ang diwang ugnayan ng panawagan sa panaghoy, nang hindi agad ipinapasok ang posibleng kahulugang “magbago ng pasiya.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עַד מָתָי
  choice: hanggang kailan?
  rationale: Ito ang natural na katumbas sa modernong Tagalog ng karaniwang pormula ng agarang panaghoy sa Hebreo.
- source_word: וְהִנָּחֵם
  choice: Mahabag ka
  rationale: Ang Niphal imperative ng נחם ay maaaring magpahiwatig ng pagkahabag o pagbabago ng pasiya. Natural sa Tagalog ang “mahabag ka” at hindi nito ipinahihiwatig na may moral na kasalanang kailangang pagsisihan ng Diyos.
- source_word: עַל
  choice: sa
  rationale: Kasama ng נחם, tinutukoy nito ang mga taong pinag-uukulan ng habag; likas sa Tagalog ang pariralang “mahabag sa.”
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa panalanging nakatuon sa Diyos, ang “mga lingkod” ang natural at marangal na salin, habang nananatili ang diwa ng pagpapasakop at paglilingkod.
theological_decisions:
- issue: Pagpapakahulugan sa נחם kapag ang Diyos ang paksa
  choice: Mahabag ka
  alternative: Magbago ka ng pasiya tungkol sa iyong mga lingkod
  rationale: Saklaw ng Hebreo kapwa ang pagkahabag at ang pagtalikod sa isang ipinapanukalang pagkilos. Pinili sa pangunahing teksto ang natural na “mahabag ka,” ngunit inilagay sa talababa ang pagbabago-ng-pasiya na kahulugan upang mapanatili ang tunay na lawak at tensiyong teolohikal ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “manumbalik” upang maging malinaw na si Yahweh ang tinatawagan na muling lumapit sa ugnayang ipinahihiwatig ng panaghoy; ang gitling na mahaba ay nagpapanatili sa bigla at mariing tanong.
