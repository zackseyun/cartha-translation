  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: tl
  text: Panalangin ni Moises[a], ang tao ng Diyos. Panginoon, ikaw ang naging tahanan[b] namin sa bawat sali’t salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay Moises” o “kaugnay ni Moises” sa pamagat; ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng may-akda, kaugnayan, o pag-aalay.
    reason: alternative_reading
  - marker: b
    text: Ang “tahanan” ay maaari ring isaling “tirahan” o “kanlungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Panalangin
  rationale: Tuwirang katumbas ng Hebreong pangngalan at angkop sa pamagat ng awit.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Bagaman literal na 'tao ng Diyos,' ang parirala ay isang kinikilalang titulo para sa taong itinalaga at naglilingkod sa Diyos; mas likas at malinaw ito sa modernong Tagalog.
- source_word: מָעוֹן
  choice: tahanan
  rationale: Pinananatili ang pangunahing larawang tumutukoy sa tirahan o dakong pinananahanan, nang hindi ito tahasang ginagawang 'kanlungan.'
- source_word: בְּדֹר וָדֹר
  choice: sa sali't salinlahing lumipas
  rationale: Likas na idyomang Tagalog para sa bawat sunod-sunod na salinlahi; idinagdag ang 'lumipas' upang tumugma sa aspektong perpektibo ng הָיִיתָ.
theological_decisions:
- issue: Ugnayan ni Moises sa panalangin sa superskripsiyon
  choice: ni Moises
  alternative: para kay Moises / kaugnay ni Moises
  rationale: Sa kontekstong ito, natural na nauunawaan ang לְ bilang pagpapakilala sa may-akda, ngunit tunay na malawak ang gamit ng pang-ukol kaya pinananatili sa talababa ang ibang posibilidad.
- issue: Larawan ng Diyos bilang מָעוֹן
  choice: tahanan
  alternative: tirahan / kanlungan
  rationale: Pinananatili ang metapora ng Diyos bilang tahanan ng kanyang bayan at hindi tahasang nilulutas ito bilang proteksiyon lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Panginoon” para sa אֲדֹנָי at ang inklusibong anyong “namin” ayon sa unang panauhang maramihan ng Hebreo.
