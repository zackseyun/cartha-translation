  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: tl
  text: Ibinabalik mo ang taong mortal sa alabok[a], at sinasabi mo, “Bumalik kayo, mga anak ng tao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagkadurog” o “sa kalagayang durog.” Ang salitang Hebreo ay tumutukoy sa bagay na dinurog o pinulbos; ipinahahayag ng “alabok” ang diwa nito sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak ng tao”; maaari ring unawaing “mga anak ni Adan” o, sa pangkalahatan, “mga tao.”
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: Ibinabalik mo
  rationale: 'Ang Hiphil ng שׁוב ay may sanhiang diwa: pinababalik o ibinabalik ng Diyos ang tao. Ang aspektong di-ganap na “ibinabalik” ay angkop sa pangkalahatang pahayag ng salmo.'
- source_word: אֱנוֹשׁ
  choice: ang taong mortal
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa tao, na madalas idiin ang kanyang kahinaan at kamatayan. Nililinaw ng “taong mortal” ang diwang ito nang hindi ginagawang tiyak na indibidwal ang kolektibong pangngalan.
- source_word: עַד דַּכָּא
  choice: sa alabok[a]
  rationale: Ang דַּכָּא ay kaugnay ng pagkadurog o bagay na pinulbos. Sa konteksto ng kamatayan ng tao, likas sa Tagalog ang “sa alabok,” habang inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: וַתֹּאמֶר
  choice: at sinasabi mo
  rationale: Pinananatili nito ang Diyos bilang ikalawang panauhang paksa at ang sunod na kilos sa patulang pahayag.
- source_word: שׁוּבוּ
  choice: Bumalik kayo
  rationale: Maramihang pautos ito ng שׁוב. Pinananatili ng “bumalik” ang ugnayang pandiwa sa naunang “ibinabalik.”
- source_word: בְנֵי אָדָם
  choice: mga anak ng tao[b]
  rationale: Literal nitong pinananatili ang larawang “mga anak ng tao/Adan” at ang patulang kaugnayan sa naunang אֱנוֹשׁ, sa halip na payakin agad bilang “mga tao.”
theological_decisions:
- issue: Kung ang אָדָם ay pangkalahatang “tao” o pangalang “Adan”
  choice: mga anak ng tao
  alternative: mga anak ni Adan; sangkatauhan
  rationale: Maaaring tumukoy ang parirala sa mga tao sa pangkalahatan at maaari ring magpahiwatig ng kaugnayan kay Adan. Hindi tiyak na pangalang pantangi ang gamit dito, kaya pinanatili sa teksto ang karaniwang diwang “tao” at inilagay sa talababa ang alternatibo.
- issue: Pagbabalik sa alabok bilang larawan ng kamatayan
  choice: sa alabok
  alternative: sa pagkadurog; sa kalagayang durog
  rationale: Malakas ang kontekstuwal na diwa ng pagiging mortal at pagbabalik sa lupa, ngunit hindi ginawang tahasang sanggunian sa isang partikular na doktrina o talata. Itinatala ng talababa ang mas tuwirang leksikal na diwa ng דַּכָּא.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “taong mortal” upang maipakita ang kahinaang ipinahihiwatig ng אֱנוֹשׁ, at pinanatili ang patulang pag-uulit ng “ibinabalik/Bumalik.”
