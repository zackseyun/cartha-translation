base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: tl
  text: 'Ang haba ng aming buhay ay pitumpung taon,


    o, kung dahil sa kalakasan, walumpung taon;


    gayunman, ang ipinagmamalaki sa mga taong iyon[a] ay hirap at dusa,


    sapagkat mabilis itong naglalaho[b],


    at lumilipad kami palayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang pinakamainam sa mga taong iyon.” Ang salitang Hebreo ay maaaring tumukoy sa ipinagmamalaki, pinakakahanga-hanga, o pinakamalakas na bahagi ng mga taong iyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mabilis itong lumilipas” o “mabilis itong pinuputol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: Ang mga araw ng aming buhay
  rationale: Pinananatili ang Hebreong larawang “mga araw” habang likas na ipinahahayag sa Tagalog na ang tinutukoy ay ang haba ng buhay.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: ay pitumpung taon
  rationale: Ang בָהֶם ay gumaganap nang idyomatiko sa pagtukoy sa kabuuang haba ng buhay; sapat at natural dito ang pang-angkop na “ay.”
- source_word: וְאִם בִּגְבוּרֹת
  choice: o walumpu kung dahil sa kalakasan
  rationale: 'Pinananatili ang kondisyonal at instrumental na diwa: ang walumpung taon ay pambihirang naaabot dahil sa lakas o sigla.'
- source_word: וְרָהְבָּם
  choice: ang maipagmamalaki sa mga iyon
  rationale: Ipinahihiwatig ng רֹהַב ang ipinagmamalaki, kahanga-hanga, o pinakamainam na bahagi ng mga taon. Ang salin ay nagpapanatili sa kabalintunaan nang hindi ito nilulutas nang labis.
- source_word: עָמָל וָאָוֶן
  choice: hirap at dusa
  rationale: Sa konteksto ng maikling buhay, tumutukoy ang tambalan sa mabigat na pagpapagal at paghihirap, hindi pangunahing sa kasamaan. Likas at malinaw sa modernong Tagalog ang “hirap at dusa.”
- source_word: כִּי גָז חִישׁ
  choice: sapagkat mabilis itong naglalaho
  rationale: Ipinapahayag ang mabilis na paglipas o pagkawala, habang iniiwan sa talababa ang posibleng mas matinding diwang “mabilis na pinuputol.”
- source_word: וַנָּעֻפָה
  choice: at kami ay lumilipad palayo
  rationale: Pinananatili ang matingkad na larawang Hebreo ng paglipad palayo at ang unang panauhang maramihan.
