translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panulaan. Ginamit ang “aming” at “kami” ayon sa unang panauhang maramihan ng Hebreo. Pinanatili ang larawan ng paglipad at ang ambiguwidad ng רָהְבָּם at גָז sa pamamagitan ng mga talababa.
