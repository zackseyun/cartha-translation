  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: tl
  text: Ngunit ikaw ay nasa kaitaasan magpakailanman, O Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; karaniwang isinasalin din itong “PANGINOON.”'
    reason: Nililinaw ang anyo at tradisyonal na salin ng banal na pangalan.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Sa konteksto, ipinakikita ng pangatnig at tahasang panghalip ang matinding kaibahan sa masasamang mapapahamak na binanggit sa naunang talata.
- source_word: מָרוֹם
  choice: nasa kaitaasan
  rationale: Pinananatili nito ang diwang pangkalawakan at metaporikal ng pagiging nasa mataas o dakilang kalagayan, nang hindi ito ginagawang titulong “Kataas-taasan.”
- source_word: לְ/עֹלָם
  choice: magpakailanman
  rationale: Likas at marangal itong pagpapahayag sa Tagalog ng walang-hanggang pagpapatuloy.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH at ang “O” upang malinaw na ipahayag ang tuwirang pagtawag sa Diyos.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה sa tuwirang pagtawag
  choice: O Yahweh
  alternative: Panginoon; Jehovah; Yahweh
  rationale: Nasa tekstong Hebreo ang personal na pangalang YHWH. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng isang titulo; ipinakikita ng “O” na tuwirang kinakausap siya.
- issue: Kahulugan ng מָרוֹם
  choice: nasa kaitaasan
  alternative: dakila; ang Kataas-taasan
  rationale: Pinananatili ang tunay na lawak ng larawang Hebreo—mataas na dako o kalagayang marangal—nang hindi tiyak na ginagawa itong banal na titulo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ang “nasa kaitaasan” ay malinaw sa karaniwang mambabasa at nagpapanatili ng matulaing larawan; ang “O” ay angkop sa taimtim na tuwirang pagtawag sa isang awit.
