  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: tl
  text: Ngunit itinaas mo ang aking sungay gaya ng sungay ng isang mailap na toro[a]; pinahiran ako ng sariwang langis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na re’em ay tumutukoy sa isang malakas na mailap na hayop na kahawig ng baka. Karaniwan itong isinasaling “mailap na toro”; sa ilang matatandang salin ay “unicorn.”
    reason: cultural_note
  - marker: b
    text: O, mas literal, “binasa ako” o “hinaluan ako ng sariwang langis.” Di-karaniwan ang pandiwang Hebreo rito, at pinagtatalunan ang eksaktong diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: itinaas mo
  rationale: Ang anyong pandiwa mula sa רום ay tuwirang tumutukoy sa Diyos bilang gumagawa. Natural sa Tagalog ang “itinaas mo” at pinananatili nito ang larawan ng pagdakila at pagpapalakas.
- source_word: כִּרְאֵים
  choice: na gaya ng sa isang mailap na baka
  rationale: Ang רְאֵם ay isang malakas na mailap na hayop na kabilang sa mga bovine, hindi ang kathang-isip na unicorn. Nilinaw ng “gaya ng sa” na ang sungay ng nagsasalita ang inihahambing sa sungay nito.
- source_word: קַרְנִי
  choice: ang aking sungay
  rationale: Pinanatili ang literal na metaporang “sungay,” na sa tulang Hebreo ay maaaring kumatawan sa lakas, dangal, o kapangyarihan.
- source_word: בַּלֹּתִי
  choice: pinahiran ako
  rationale: Ang di-karaniwang anyo mula sa בלל ay maaaring tumukoy sa paghalo o pagbasa. Sa pagkakaugnay nito sa langis, ang “pinahiran ako” ang natural na pagpapahayag ng malamang na diwa, habang inilalagay sa talababa ang tunay na kawalang-katiyakan.
- source_word: בְּשֶׁמֶן
  choice: ng langis
  rationale: Sa pariralang Tagalog na “pinahiran ... ng langis,” natural na ipinahahayag nito ang kasangkapang ginamit.
- source_word: רַעֲנָן
  choice: sariwang
  rationale: Ang רַעֲנָן ay nagpapahiwatig ng kasariwaan, kasaganaan, at sigla; “sariwang langis” ang malinaw at natural na katumbas sa kontekstong ito.
theological_decisions:
- issue: Metapora ng “sungay”
  choice: Pinanatili ang “aking sungay” bilang larawan ng lakas at pagdakila.
  alternative: aking lakas; aking kapangyarihan
  rationale: Mahalaga sa tula ang kongkretong larawan, at nauunawaan ang pahiwatig nito sa konteksto nang hindi ito pinapaliit sa iisang interpretasyon.
- issue: Diwa ng בַּלֹּתִי kaugnay ng langis
  choice: pinahiran ako
  alternative: binasa ako; hinaluan ako
  rationale: Ang “pinahiran” ay natural sa Tagalog at angkop sa larawan ng langis, ngunit hindi tiyak ang eksaktong diwa ng pandiwang Hebreo; kaya tahasang pinanatili sa talababa ang mga mas literal na posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na sintaks at pinanatiling matalinghaga ang “sungay.” Ginamit ang “mailap na baka” bilang madaling maunawaang katawagan sa re’em, kalakip ang paliwanag upang maiwasan ang maling larawang “unicorn.”
