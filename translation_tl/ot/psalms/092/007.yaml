  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: tl
  text: Kapag sumisibol na parang damo ang masasama, at yumayabong ang lahat ng gumagawa ng kasamaan,[a] ito ay upang malipol sila magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at namumukadkad ang lahat ng gumagawa ng kasamaan.” Sa Hebreo, literal na “at namumukadkad ang lahat ng gumagawa ng kasamaan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa kanilang pagkalipol magpakailanman” o “upang malipol lamang sila magpakailanman.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: Kapag sumisibol
  rationale: Ang ב na kasunod ng infinitive construct ay nagpapahayag dito ng panahong pangyayari, kaya natural na isinalin na “Kapag.” Pinananatili ng “sumisibol” ang larawang-halaman na pinalalakas ng kasunod na “damo.”
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Ang pangmaramihang pang-uri ay ginagamit bilang pangngalan para sa mga taong masama. Likas at malinaw sa modernong Tagalog ang “ang masasama.”
- source_word: כְּמוֹ עֵשֶׂב
  choice: na parang damo
  rationale: Karaniwang tumutukoy ang עֵשֶׂב sa damo o luntiang halaman. Ang “parang damo” ay payak at pinananatili ang larawan ng mabilis ngunit pansamantalang paglago.
- source_word: וַיָּצִיצוּ
  choice: namumukadkad
  rationale: Ang צוץ ay tumutukoy sa pagsibol o pamumukadkad. Ang “namumukadkad” ay nagpapanatili sa metaporang halaman at nagpapahiwatig ng hayag na pag-unlad.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: ang lahat ng gumagawa ng kasamaan
  rationale: Pinananatili nito ang tahasang diwa ng “lahat ng mga gumagawa ng kasamaan” habang nananatiling natural sa Tagalog; hindi nito pinaiikli ang parirala bilang “mga makasalanan” o “mga gumagawa ng masama.”
- source_word: לְהִשָּׁמְדָם
  choice: iyon ay upang malipol sila
  rationale: Ang Niphal infinitive construct na may hulaping pangmaramihan ay may pasibong diwang “upang/para malipol sila.” Ipinahahayag ng “iyon ay upang” ang maaaring layunin o resulta nang hindi nagdaragdag ng tahasang gumagawa ng paglipol.
- source_word: עֲדֵי עַד
  choice: magpakailanman
  rationale: Ang idyomang Hebreo ay nagpapahayag ng walang hanggang pananatili; ang “magpakailanman” ang malinaw at marangal na katumbas sa Tagalog.
theological_decisions:
- issue: Kung ang pag-unlad ng masasama ay isa lamang pansamantalang obserbasyon o kaugnay sa kanilang pangwakas na paghatol
  choice: “iyon ay upang malipol sila magpakailanman”
  alternative: “para sa kanilang pagkalipol magpakailanman” o “ngunit malilipol din sila magpakailanman”
  rationale: Iniuugnay ng לְהִשָּׁמְדָם ang kanilang pamumukadkad sa pangwakas na pagkalipol. Pinananatili ng salin ang tensiyon ng layunin o resulta, ngunit hindi nagdaragdag ng tahasang banal na gumagawa sapagkat wala itong tahasang paksa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang magkatugmang larawang “sumisibol” at “namumukadkad,” at iniwasan ang pagdaragdag ng tahasang banal na paksa sa huling sugnay.
