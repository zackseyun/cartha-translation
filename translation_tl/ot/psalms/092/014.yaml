  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: tl
  text: Namumunga pa rin sila sa katandaan; hitik sila sa dagta at luntian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mamumunga pa rin sila sa katandaan; magiging hitik sila sa dagta at luntian.” Maaari ring ipahayag ng mga pandiwang Hebreo ang panghinaharap.'
    reason: alternative_reading
  - marker: b
    text: Sa literal, “matataba at luntian.” Sa larawan ng punongkahoy, ang “hitik sa dagta” ay nagpapahayag ng masagana at malusog na kasiglahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: pa rin
  rationale: Ipinahahayag ang pagpapatuloy ng kanilang kasiglahan hanggang sa katandaan.
- source_word: יְנוּבוּן
  choice: namumunga
  rationale: Tumutukoy sa pamumunga at nagpapatuloy sa larawan ng mga punongkahoy sa naunang mga talata.
- source_word: בְּשֵׂיבָה
  choice: sa katandaan
  rationale: Bagaman kaugnay ng literal na 'uban,' ang parirala ay likas na tumutukoy sa panahon ng pagtanda.
- source_word: דְּשֵׁנִים
  choice: hitik sa dagta
  rationale: Ang literal na diwa ay 'mataba' o 'mayaman'; sa larawang botanikal, inilalarawan nito ang punô at masaganang sigla ng halaman.
- source_word: רַעֲנַנִּים
  choice: luntian
  rationale: Tumpak at marangal na salitang Filipino para sa sariwa at luntiang kalagayan ng halaman.
- source_word: יִהְיוּ
  choice: sila
  rationale: Nakapaloob ang pandiwang 'maging' sa natural na panaguring Filipino na 'hitik sila ... at luntian'; ipinapahayag ito bilang pangkalahatan at nagpapatuloy na kalagayan.
theological_decisions:
- issue: Aspekto/panahon ng mga pandiwang imperfect sa tulang Hebreo
  choice: 'Kasalukuyan o pangkalahatang paglalarawan: “Namumunga ... hitik sila”'
  alternative: 'Panghinaharap: “Mamumunga pa rin sila ... magiging hitik ...”'
  rationale: Sa konteksto, inilalarawan ng talata ang karaniwang kalagayan ng mga matuwid sa pamamagitan ng larawan ng punongkahoy. Gayunman, maaari ring unawain ang mga anyong Hebreo bilang panghinaharap, kaya itinala ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawan ng punongkahoy at ang magkatimbang na mga katangiang “hitik sa dagta” at “luntian,” nang hindi ginagawang katawa-tawa o pisikal na katabaan ang Hebreong דְּשֵׁנִים.
