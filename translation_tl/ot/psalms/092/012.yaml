  text: צַ֭דִּיק כַּ/תָּמָ֣ר יִפְרָ֑ח כְּ/אֶ֖רֶז בַּ/לְּבָנ֣וֹן יִשְׂגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: tl
  text: Ang matuwid ay mamumukadkad na gaya ng puno ng palma; lalagong gaya ng sedro sa Lebanon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang matuwid ay mamumukadkad na gaya ng puno ng palma; gaya ng sedro sa Lebanon, siya ay lalago.” Ang pang-isahang anyo sa Hebreo ay maaaring kumatawan sa lahat ng matuwid. Ang “lalago” ay maaari ring unawaing “yayabong” o “magiging dakila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Ang pang-isahang panlalaking pang-uri ay ginagamit bilang pangngalan. Likas sa Tagalog ang “ang matuwid,” at maaari itong tumukoy sa isang kinatawang tao nang hindi kinakailangang idagdag ang salitang “lalaki.”
- source_word: כַּתָּמָר
  choice: na gaya ng puno ng palma
  rationale: Pinananatili ang paghahambing at ang malinaw na larawan ng isang puno; mas madaling maunawaan ang “puno ng palma” kaysa “palma” lamang.
- source_word: יִפְרָח
  choice: mamumukadkad
  rationale: Ang pandiwang פרח ay pangunahing nagpapahiwatig ng pagsibol o pamumukadkad at, sa talinghaga, ng masaganang pag-unlad. Pinananatili ng “mamumukadkad” ang larawang halaman at ang matalinghagang diwa.
- source_word: כְּאֶרֶז
  choice: gaya ng sedro
  rationale: Tuwirang pinananatili ang paghahambing sa punong sedro; ang “sedro” ay dignificado at karaniwang katawagan sa Bibliyang Filipino.
- source_word: בַּלְּבָנוֹן
  choice: sa Lebanon
  rationale: Ang pang-ukol na בְּ ay likas na isinasaling “sa,” kaya ang sedro ay inilalarawang nasa Lebanon, alinsunod sa anyong Hebreo.
- source_word: יִשְׂגֶּה
  choice: lalago
  rationale: Ang pandiwa ay maaaring mangahulugang lumago, dumami, o maging dakila. Ang “lalago” ay natural sa konteksto ng sedro at hindi ipinipilit ang mas tiyak na ideya ng pagtangkad.
theological_decisions:
- issue: Kinatawang gamit ng pang-isahang צַדִּיק
  choice: Panatilihin ang pang-isahang “ang matuwid” na maaaring kumatawan sa sinumang matuwid.
  alternative: “Ang taong matuwid” o maramihang “ang mga matuwid.”
  rationale: Hindi kailangang idagdag ang “tao” o gawing tahasang maramihan; sapat at natural sa Tagalog ang substantibong “ang matuwid,” habang nananatili ang kinatawang puwersa ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismong patula at ang dalawang larawang punongkahoy. Ginamit ang “mamumukadkad” upang mapanatili ang tiyak na imahen ng פרח, at “lalago” upang huwag gawing labis na tiyak ang malawak na kahulugan ng יִשְׂגֶּה.
