reference: Psalms 92:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: tl
  text: 'Sapagkat masdan, ang mga kaaway mo, O Yahweh—

    sapagkat masdan, ang mga kaaway mo ay mapapahamak;

    magkakawatak-watak ang lahat ng gumagawa ng kasamaan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mangangalat ang lahat ng gumagawa ng kasamaan.” Ang pariralang Hebreo ay literal na “lahat ng mga gumagawa ng kasamaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan sa naunang talata habang natural ang daloy sa makabagong Tagalog.
- source_word: הִנֵּה
  choice: masdan
  rationale: Ipinahahayag ang demonstratibo at mariing puwersa ng Hebreo sa isang marangal at patulang anyo.
- source_word: אֹיְבֶיךָ
  choice: ang mga kaaway mo
  rationale: Tuwirang isinasalin ang pangmaramihang pangngalan at ang hulaping tumutukoy sa ikalawang panauhang panlalaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na tahasang nasa tekstong Hebreo.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: Sapagkat masdan ... sapagkat masdan
  rationale: Pinananatili ang kapansin-pansing pag-uulit na nagbibigay-diin at katiyakan sa patulaing Hebreo.
- source_word: יֹאבֵדוּ
  choice: mapapahamak
  rationale: Likas na Tagalog para sa pagkawala o pagkapuksa, nang hindi tiyak na ipinapahayag ang paraan ng hatol.
- source_word: יִתְפָּרְדוּ
  choice: magkakawatak-watak
  rationale: Ipinahahayag ang reflexive o distributibong diwa ng pagkakahiwa-hiwalay at akma sa pagbagsak ng pangkat ng masasama.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili ang saklaw na sumasaklaw sa kabuuan.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ang lahat ng gumagawa ng kasamaan
  rationale: Malinaw at likas na salin ng literal na pariralang 'mga gumagawa ng kasamaan,' sa halip na paikliin bilang 'masasama.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Pinanatili ang dobleng “sapagkat masdan” bilang sadyang pag-uulit ng Hebreo; ginamit ang “O Yahweh” upang malinaw na ipakita ang tuwirang pagtawag sa Diyos.
