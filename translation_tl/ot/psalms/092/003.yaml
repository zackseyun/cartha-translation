translation:
  language: tl
  text: Sa instrumentong may sampung kuwerdas at sa alpa[a], sa himig ng lira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga instrumentong de-kuwerdas sa Hebreo. Ang נָבֶל ay maaari ring isaling “lira” o “lute,” at ang כִּנּוֹר ay isinasalin kung minsan na “alpa.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa pagbubulay sa lira.” Ang Hebreong הִגָּיוֹן ay maaaring tumukoy sa pagbubulay, mahinang pagbulong, o umaalingawngaw na tunog ng musika; sa kontekstong ito, higit na angkop ang musikal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי
  choice: sa saliw ng
  rationale: Sa kontekstong musikal, ipinahihiwatig ng עַל/עֲלֵי ang instrumental na pagsaliw. Natural sa makabagong Tagalog ang “sa saliw ng,” bagaman hindi nito inuulit nang mekanikal ang preposisyon.
- source_word: עָשׂוֹר
  choice: instrumentong may sampung kuwerdas
  rationale: Tumutukoy ito sa isang instrumentong may sampung kuwerdas; iniiwasan ng salin na tukuyin ang eksaktong uri nito nang higit sa ipinahihintulot ng Hebreo.
- source_word: וַעֲלֵי
  choice: at ng
  rationale: Pinananatili ang pag-uugnay sa ikalawang instrumento sa loob ng natural na pariralang Tagalog na “sa saliw ng … at ng …”.
- source_word: נָבֶל
  choice: alpa
  rationale: Isa itong instrumentong de-kuwerdas na hindi tiyak ang eksaktong anyo. Pamilyar at marangal ang “alpa,” habang inilalahad sa talababa ang ibang posibleng katawagan.
- source_word: הִגָּיוֹן
  choice: himig
  rationale: Sa kontekstong instrumental, malamang na tumutukoy ito sa umaalingawngaw o mapagnilay na tunog ng musika. Ang “himig” ay natural ngunit pinananatili sa talababa ang posibilidad na “pagbubulay.”
- source_word: בְּכִנּוֹר
  choice: ng lira
  rationale: Ang כִּנּוֹר ay instrumentong de-kuwerdas na karaniwang tinatawag na lira. Ang prefiks na בְּ ay nauunawaan dito bilang instrumental, at ang “ng lira” ay umaasa sa naunang “sa himig.”
