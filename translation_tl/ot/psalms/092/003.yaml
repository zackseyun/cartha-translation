  naturalness: Natural at marangal ang "instrumentong may sampung kuwerdas," "alpa," "himig," at "lira." Ang binagong paralelismo ay mas angkop sa maikling patulang linya sa Tagalog. Iniiwasan din nito ang bahagyang dagdag na diwa ng "saliw."
