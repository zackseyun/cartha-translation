  source_fidelity: 'Tapat ang salin sa Hebreo: ang impersonal na טוֹב ay natural na naipahayag sa “Mabuting,” ang לְהוֹדוֹת sa “magpasalamat,” at ang dalawang magkatambal na infinitive ay napanatili. Wasto ang “kay Yahweh” para sa לַיהוָה at “sa iyong pangalan” para sa לְשִׁמְךָ. Ang “O Kataas-taasan” ay angkop na pagtawag para sa עֶלְיוֹן.'
