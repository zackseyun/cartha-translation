  text: ט֗וֹב לְ/הֹד֥וֹת לַ/יהוָ֑ה וּ/לְ/זַמֵּ֖ר לְ/שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: tl
  text: Mabuting magpasalamat kay Yahweh[a] at umawit ng papuri sa iyong pangalan, O Kataas-taasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Yahweh,” ang personal na pangalan ng Diyos na kinakatawan ng apat na katinig na YHWH.'
    reason: Nililinaw ang pinagmulan at kahulugan ng anyong ginamit para sa banal na pangalan.
lexical_decisions:
- source_word: טוֹב
  choice: Mabuti
  rationale: Pinananatili ang malawak na positibong pagpapahalaga ng Hebreo; kasunod ng mga pawatas, natural sa Tagalog ang konstruksiyong “Mabuting…”.
- source_word: לְהֹדוֹת
  choice: magpasalamat
  rationale: Sa konteksto ng pagsamba, ang Hiphil ng ידה ay tumutukoy sa pagpapasalamat o pagpupuri. “Magpasalamat” ang mas tiyak dito at naihihiwalay ito sa musikal na pagpupuri sa kasunod na parirala.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang יהוה, habang ang “kay” ang natural na panandang Tagalog para sa personal na pinag-uukulan ng pasasalamat.
- source_word: וּלְזַמֵּר
  choice: at umawit ng papuri
  rationale: Ang Piel ng זמר ay paggawa ng musikang papuri, karaniwang sa pag-awit. Malinaw at natural ang “umawit ng papuri” nang hindi nagpapalagay ng partikular na instrumento.
- source_word: לְשִׁמְךָ
  choice: sa iyong pangalan
  rationale: Pinananatili ang biblikal na idyomang “sa iyong pangalan,” na may kahulugang kaugnay ng pagkakakilanlan at karangalan ng Diyos, sa halip na payak na gawing “sa iyo.”
- source_word: עֶלְיוֹן
  choice: O Kataas-taasan
  rationale: Ang עֶלְיוֹן ay titulong nangangahulugang “Kataas-taasan.” Ipinahahayag ng “O” ang tuwirang pagtawag na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo; nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatimbang na “magpasalamat” at “umawit ng papuri” upang mapanatili ang paralelismo at pagkakaiba ng dalawang gawaing pagsamba.
