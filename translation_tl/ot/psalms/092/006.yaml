  text: 'Ang taong walang-unawang gaya ng hayop ay hindi nakaaalam, at hindi nauunawaan ng hangal ang bagay na ito:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: tao
  rationale: Bagaman panlalaking isahan ang anyo sa Hebreo, ginagamit ito rito bilang kinatawang katawagan sa isang tao; natural sa modernong Tagalog ang “tao” at hindi nito binabago ang diwa.
- source_word: בַּעַר
  choice: asal-hayop
  rationale: Ipinahihiwatig ng salita ang taong mapurol at walang-unawa na gaya ng hayop, hindi lamang kulang sa impormasyon. Pinananatili ng “asal-hayop” ang talinghagang lakas nito.
- source_word: יֵדָע
  choice: walang nalalaman
  rationale: Tuwirang ipinapahayag ang kawalan ng kaalaman o pagkabatid at maayos na katapat ng unang linya ng paralelismo.
- source_word: כְסִיל
  choice: mangmang
  rationale: Karaniwang terminong pangkarunungan ito para sa taong hangal sa pag-iisip at asal. Ang “mangmang” ay dignido at madaling maunawaan, nang hindi nililimitahan ang diwa sa kakulangan ng edukasyon.
- source_word: יָבִין
  choice: hindi nauunawaan
  rationale: Pinananatili nito ang diin sa pag-unawa o pagk discern sa kaibahan ng simpleng pagkaalam sa naunang linya.
- source_word: אֶת זֹאת
  choice: ang bagay na ito
  rationale: Malinaw na itinuturo nito ang usaping tinatalakay sa konteksto; ang tutuldok ay nagpapahiwatig na ipaliliwanag ito ng kasunod na talata.
