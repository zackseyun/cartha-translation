    issue: Ang “asal-hayop” para sa בַּעַר ay semantically misleading.
    rationale: Sa modernong Filipino, karaniwan itong nangangahulugang marahas, bastos, o mala-hayop ang kilos. Ang Hebreo rito ay tumutukoy sa taong walang unawa, mapurol ang isip, at inihahambing sa hayop.
