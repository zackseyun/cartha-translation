    issue: Ang “mangmang” ay hindi ang pinakamalinaw na katapat ng כְסִיל.
    rationale: Bagaman maaari itong tumukoy sa kakulangan ng unawa, madalas itong nauunawaan bilang pagiging ignorante. Ang “hangal” ay mas mahusay na pinananatili ang wisdom-literature sense ng isang taong kulang sa matalinong paghatol.
