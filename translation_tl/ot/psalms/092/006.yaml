  naturalness: Hindi ganap na natural ang “taong asal-hayop.” Mas malinaw at mas idiomatiko ang “taong walang-unawang gaya ng hayop,” na pinananatili ang metapora nang hindi inililihis ang diwa. Mas tuwiran din ang ayos na “hindi nauunawaan ng hangal ang bagay na ito.”
  terminology: Ang “hangal” ay mas angkop para sa כְסִיל, isang terminong pangkarunungan na nagsasaad ng kapalpakan sa paghatol at asal, samantalang ang “mangmang” ay madaling mabasa bilang kakulangan lamang sa kaalaman o edukasyon.
  issues:
