  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: tl
  text: upang ipahayag na matuwid si Yahweh; siya ang aking bato, at walang kawalang-katarungan sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַגִּיד
  choice: upang ipahayag
  rationale: Ipinahahayag ng infinitive construct ang layunin o bunga ng naunang konteksto; natural at may pampublikong diwa ang “ipahayag.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng ipinapahayag, hindi pangangatwirang sanhi.
- source_word: יָשָׁר
  choice: matuwid
  rationale: Ang “matuwid” ay likas na salin para sa malawak na moral na katuwiran ng Diyos at hindi ito nililimitahan sa hudisyal na katarungan lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: צוּרִי
  choice: aking bato
  rationale: Pinananatili ang kongkretong talinghaga ng Diyos bilang matatag na bato sa halip na ipaliwanag agad bilang “kanlungan.”
- source_word: וְלֹא עַוְלָתָה בּוֹ
  choice: at walang kawalang-katarungan sa kanya
  rationale: Natural na Filipino ang sugnay at inilalarawan ang lubos na kawalan ng mali o kawalang-katarungan kay Yahweh.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng עַוְלָתָה
  choice: kawalang-katarungan
  alternative: kasamaan
  rationale: Maaaring tumukoy ang salita sa mali, kalikuan, o kawalang-katarungan. Ang “kawalang-katarungan” ay malinaw sa modernong Filipino at pinananatili ang moral at hudisyal na saklaw nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang maikli at patulang ayos, ang banal na pangalang Yahweh, at ang talinghagang “aking bato.”
