  yaml_path: translation/ot/psalms/092/002.yaml
  text: to declare your steadfast love in the morning[a], and your faithfulness in the nights,
translation:
  language: tl
  text: upang ipahayag sa umaga ang iyong tapat na pag-ibig, at ang iyong katapatan gabi-gabi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga gabi.” Maramihan sa Hebreo ang salitang “gabi,” na maaaring magpahiwatig ng pagpupuri gabi-gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: upang ipahayag
  rationale: Ang infinitibong may לְ ay nagpapahayag ng layunin o pagpapatuloy mula sa naunang talata. Ang “ipahayag” ay natural at marangal, at pinananatili ang hayag na diwa ng paghahayag.
- source_word: בַּבֹּקֶר
  choice: sa umaga
  rationale: Ang בְּ na kasama ng tiyak na pangngalan ay tumutukoy sa panahon. Ang “sa umaga” ang natural na katumbas sa modernong Tagalog.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay nagsasama ng pag-ibig, matatag na kabutihan, at katapatan sa ugnayan. Ang “tapat na pag-ibig” ay malinaw at hindi makitid sa isang denominasyonal na pagbasa.
- source_word: וֶאֱמוּנָתְךָ
  choice: at ang iyong katapatan
  rationale: Ang אֱמוּנָה rito ay tumutukoy sa pagiging maaasahan at matatag ng Diyos. “Katapatan” ang pinakanatural na katumbas at mahusay na kaagapay ng “tapat na pag-ibig.”
- source_word: בַּלֵּילוֹת
  choice: gabi-gabi
  rationale: Literal na maramihan ang Hebreo, “sa mga gabi.” Sa Tagalog, ang “gabi-gabi” ay mas natural at ipinahihiwatig ang paulit-ulit na pagpupuri, habang inilalahad sa talababa ang mas pormal na anyo.
