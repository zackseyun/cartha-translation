base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: tl
  text: Nakatanim sila sa bahay ni Yahweh; yayabong sila sa mga patyo[a] ng ating Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga looban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Nakatanim
  rationale: Ang pasibong participle ay nangangahulugang ‘nakatanim’ o ‘itinanim.’ Pinananatili ng ‘nakatanim’ ang larawang halaman at natural ito sa makabagong Tagalog.
- source_word: בְּבֵית
  choice: sa bahay ni
  rationale: Literal na ‘sa bahay ng.’ Sa konteksto, maaari itong tumukoy sa templo, ngunit pinananatili ng ‘bahay’ ang Hebreong larawan at ang pagtutugma nito sa mga patyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: בְּחַצְרוֹת
  choice: sa mga patyo
  rationale: Ang חָצֵר ay tumutukoy sa mga bukás na patyo ng templo. Ang ‘mga patyo’ ay malinaw at likas sa Tagalog.
- source_word: אֱלֹהֵינוּ
  choice: ng ating Diyos
  rationale: Tuwirang salin ng pangngalang may hulaping unang panauhang maramihan.
- source_word: יַפְרִיחוּ
  choice: mamumukadkad sila
  rationale: Ang pandiwa ay maaaring mangahulugang sumibol, mamulaklak, o yumabong. Ang ‘mamumukadkad’ ay nagpapanatili sa larawang halaman at ipinahihiwatig ang masiglang paglago.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili rito ang personal na pangalan sa halip na palitan ito ng titulong ‘PANGINOON.’
- issue: Tukoy ng ‘bahay ni Yahweh’
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Bagaman tumutukoy ito sa templo sa konteksto, pinananatili ng salin ang literal at makatang larawang ‘bahay’ nang hindi nilulutas nang higit sa kailangan ang saklaw ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang ‘mamumukadkad’ upang mapanatili ang metaporang halaman; hindi idinagdag ang salitang ‘muli’ o ibang diin na wala sa Hebreo.
