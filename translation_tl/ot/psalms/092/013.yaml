  terminology: Ang “Yahweh” ay wastong pagpapanatili ng Tetragrammaton ayon sa ibinigay na patakaran. Ang “bahay” ay maingat na literal na salin at hindi nito labis na ipinapakahulugan bilang “templo.” Ang “mga patyo” ay angkop para sa חַצְרוֹת; katanggap-tanggap ang “mga looban” bilang alternatibo, bagaman mas tuwiran ang “mga patyo.”
