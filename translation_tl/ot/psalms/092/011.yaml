lexical_decisions:
- source_word: וַתַּבֵּט עֵינִי
  choice: Nakita ng aking mata
  rationale: Pinananatili ang isahang “mata” at ang tuwirang diwa ng נבט na tumingin o makakita. Ang ganap na kilos ay natural na ipinahayag sa Filipino sa aspektong naganap.
- source_word: בְּשׁוּרָי
  choice: ang mga kaaway ko
  rationale: Maaaring tumukoy ang anyo sa mga nagmamasid o nag-aabang nang may masamang hangarin; ipinahahayag ng “mga kaaway” ang malinaw na diwang mapanlaban sa konteksto, habang inilalagay sa talababa ang mas literal na posibilidad.
- source_word: בַּקָּמִים עָלַי
  choice: bumabangon laban sa akin
  rationale: Malapit ito sa larawang Hebreo ng pagtindig o pagbangon laban sa isang tao at natural pa rin sa makatang Filipino.
- source_word: מְרֵעִים
  choice: masasama
  rationale: Tumutukoy ang participle sa mga gumagawa ng masama o nananakit. Ang “masasama” ay maikli at natural, bagaman maaari ring isaling “mga gumagawa ng masama.”
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: narinig ng aking mga tainga
  rationale: Pinananatili ang makatang pagbanggit sa mga tainga at ang pambabaeng maramihang pagtutugma ng pandiwa sa אָזְנָי. Ang aspektong naganap ay angkop sa pagkakaparis nito sa unang sugnay, ngunit hindi ito ang tanging posibleng pagbasa.
