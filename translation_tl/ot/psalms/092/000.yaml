  text: A psalm[a], a song for the Sabbath day.
translation:
  language: tl
  text: Isang salmo, isang awit para sa araw ng Sabat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Karaniwang katawagan sa Filipino para sa ganitong uri ng awit sa Aklat ng mga Salmo; pinananatili rin nito ang kaugnayang musikal ng salitang Hebreo.
- source_word: שִׁיר
  choice: awit
  rationale: Likas at karaniwang katumbas sa modernong Filipino, at pinananatiling hiwalay sa מִזְמוֹר upang makita ang magkatambal na katawagan sa pamagat.
- source_word: לְיוֹם
  choice: para sa araw
  rationale: Ipinahahayag ng לְ ang layunin o pagkakaugnay; ang 'para sa araw' ay natural sa Filipino at hindi nagdaragdag ng tiyak na gamit na hindi tahasang sinasabi sa Hebreo.
- source_word: הַשַּׁבָּת
  choice: Sabbath
  rationale: Tumutukoy sa tiyak na araw ng Sabbath. Ginamit ang kinikilalang terminong 'Sabbath' upang mapanatili ang natatanging reperensiya nito, sa halip na gawing pangkalahatang 'araw ng pamamahinga.'
theological_decisions:
- issue: Ang katangian ng talata bilang pamagat sa halip na unang taludtod ng tula
  choice: 'Isinalin bilang pamagat: “Isang salmo, isang awit para sa araw ng Sabbath.”'
  alternative: Ituring na unang taludtod ng tula nang walang bantas o ayos na nagpapakitang pamagat.
  rationale: Binubuo ang Hebreo ng mga pariralang pangngalan at walang pandiwang may takdang anyo. Ang anyong pamagat ang pinakamahusay na kumakatawan sa tungkulin nito sa Aklat ng mga Salmo nang hindi nagdaragdag ng sugnay na wala sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa isang pamagat. Pinanatili ang dalawang magkatambal na pangngalang “salmo” at “awit,” pati ang bahagyang pormal na anyong “araw ng Sabbath.”
