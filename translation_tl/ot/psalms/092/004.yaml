base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: tl
  text: 'Sapagkat pinasaya mo ako, Yahweh, sa iyong ginawa;

    sa mga gawa ng iyong mga kamay ay umaawit ako nang may galak.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumisigaw ako sa galak.” Maaari ring tumukoy ang pandiwang Hebreo sa isang malakas at masayang sigaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng papuri sa konteksto at malinaw na pinananatili ang ugnayang sanhi.
- source_word: שִׂמַּחְתַּנִי
  choice: pinasaya mo ako
  rationale: Ang Piel perfect na may hulaping unang panauhan ay nagpapahayag na ang kausap ang naging sanhi ng kagalakan ng salmista. Natural at tuwiran ito sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּפָעֳלֶךָ
  choice: sa iyong ginawa
  rationale: Ang פֹּעַל ay tumutukoy sa gawa o ginawa. Sa Tagalog, ang pariralang ito ay natural na nagpapahiwatig na ang ginawa ni Yahweh ang dahilan ng kagalakan.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: dahil sa mga gawa ng iyong mga kamay
  rationale: Pinananatili ang kongkretong larawang Hebreo na “mga gawa ng iyong mga kamay,” habang nililinaw ng “dahil sa” na ang mga ito ang sanhi o okasyon ng masayang pagpuri.
- source_word: אֲרַנֵּן
  choice: umaawit ako sa galak
  rationale: Ang רנן ay maaaring tumukoy sa masayang pag-awit o malakas na sigaw ng galak. Ang pag-awit ay angkop sa konteksto ng salmo, samantalang inilalagay sa talababa ang tunay na alternatibong kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit sa halip na palitan ito ng titulong “Panginoon.”
- issue: Uri ng masayang pagpapahayag sa אֲרַנֵּן
  choice: umaawit ako sa galak
  alternative: sumisigaw ako sa galak
  rationale: Kapuwa posible sa pandiwang Hebreo ang masayang pag-awit at umaalingawngaw na sigaw. Pinili ang pag-awit dahil sa konteksto ng salmo, ngunit hindi inalis ang leksikal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo ng “iyong ginawa” at “mga gawa ng iyong mga kamay,” gayundin ang kongkretong idyomang Hebreo. Ginamit ang kasalukuyang “umaawit ako” bilang resulta ng naunang pagkilos, nang hindi ginagawang mabigat o hindi natural ang taludtod.
