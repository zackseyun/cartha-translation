translation:
  language: tl
  text: Kay dakila ng iyong mga gawa, Yahweh! Napakalalim ng iyong mga kaisipan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga plano mo” o “mga layunin mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: Kay dakila
  rationale: Ang מַה ay padamdam dito, hindi tanong, at ang statibong גָּדְלוּ ay likas na naipapahayag sa Filipino bilang “Kay dakila.”
- source_word: מַעֲשֶׂיךָ
  choice: mga gawa mo
  rationale: Malawak ang saklaw ng מַעֲשֶׂה at maaaring tumukoy sa mga gawa o pagkilos ng Diyos; pinananatili ng “mga gawa” ang lawak na ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: מְאֹד עָמְקוּ
  choice: Napakalalim
  rationale: Ang מְאֹד ay nagpapasidhi sa statibong עָמְקוּ; natural at mariing ipinahahayag ito ng “Napakalalim.”
- source_word: מַחְשְׁבֹתֶיךָ
  choice: mga kaisipan mo
  rationale: Ang “mga kaisipan” ang pinakatapat na malawak na katumbas at hindi nito nililimitahan ang salita sa mga plano o layunin lamang.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang personal na banal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng מַחְשְׁבֹתֶיךָ
  choice: mga kaisipan mo
  alternative: mga plano mo / mga layunin mo
  rationale: Maaaring saklawin ng salitang Hebreo ang iniisip, binabalak, o nilalayon. Pinananatili ng pangunahing salin ang mas malawak na kahulugan, habang inilalahad sa talababa ang ibang lehitimong pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang padamdam na “Kay dakila” at ang masidhing “Napakalalim” upang mapanatili ang magkatugmang paghanga ng tulang Hebreo.
