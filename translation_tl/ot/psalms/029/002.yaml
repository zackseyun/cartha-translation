  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: tl
  text: Iukol ninyo kay Yahweh ang kaluwalhatiang nararapat sa kanyang pangalan; sambahin ninyo si Yahweh sa banal na karilagan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa karilagan ng kabanalan”; o “na suot ang banal na kasuotan.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָבוּ
  choice: Iukol ninyo
  rationale: Ang pautos na maramihan ay hindi tumutukoy sa literal na pagbibigay ng isang bagay kundi sa pagkilala at pag-uukol ng karangalan kay Yahweh. Natural sa modernong Tagalog ang “iukol” sa ganitong konteksto.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Minamarkahan ng ל ang pinag-uukulan ng pautos. Pinanatili ang pangalang tipan na Yahweh.
- source_word: כְּבוֹד שְׁמוֹ
  choice: ang kaluwalhatiang nararapat sa kanyang pangalan
  rationale: Ang כָּבוֹד ay “kaluwalhatian” o “karangalan.” Ipinahahayag ng “nararapat” ang idyomatikong diwa ng karangalang dapat iukol sa kanyang pangalan, bagaman hindi ito hiwalay na salita sa Hebreo.
- source_word: הִשְׁתַּחֲווּ
  choice: sambahin ninyo
  rationale: Literal itong tumutukoy sa pagyukod o pagpapatirapa bilang pagpipitagan; sa tuwirang pagharap kay Yahweh, malinaw at natural na ipinahahayag ng “sambahin” ang layunin ng kilos.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: sa banal na karilagan
  rationale: Pinananatili ng “banal na karilagan” ang maikli at makatang anyo at ang kalabuan kung ito ay karilagan ng kabanalan, banal na kasuotan, o banal na kaayusan ng pagsamba.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng בְּהַדְרַת קֹדֶשׁ
  choice: sa banal na karilagan
  alternative: sa karilagan ng kabanalan; na suot ang banal na kasuotan
  rationale: Mahirap at maraming posibleng pakahulugan ang parirala. Hindi nililimitahan ng pangunahing salin ang tinutukoy nito sa isang abstraktong katangian o sa kasuotang panritwal lamang.
translation_notes:
  register: Makabago, marangal, at angkop sa tulang panambahan. Ginamit ang maramihang pautos na “ninyo” ayon sa mga pandiwang Hebreo. Pinili ang “karilagan” kaysa sa mas pangkaraniwang “ganda” upang mapanatili ang diwa ng kadakilaan at banal na ningning.
