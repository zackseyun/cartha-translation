base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: tl
  text: 'Ang tinig ni Yahweh[a] ay binabali ang mga sedro;

    binabasag[b] ni Yahweh ang mga sedro ng Lebanon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tunog ni Yahweh.” Ang salitang Hebreo na qol ay maaaring mangahulugang “tinig” o “tunog”; pinili rito ang “tinig” upang mapanatili ang paulit-ulit na paglalarawan sa makapangyarihan at dumadagundong na kapahayagan ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Iisang ugat ng pandiwa na nangangahulugang “baliin” ang inuulit ng Hebreo sa dalawang sugnay. Ginamit ang “binabasag” sa ikalawang sugnay upang maipahayag sa natural na Filipino ang pagtindi ng paralelismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: Ang tinig ni Yahweh
  rationale: Ang קוֹל ay maaaring mangahulugang “tinig” o “tunog.” Pinili ang “tinig” upang mapanatili ang personal at makapangyarihang paglalarawan sa kapahayagan ni Yahweh na inuulit sa awit.
- source_word: שֹׁבֵר
  choice: bumabali
  rationale: Ang Qal participle ay ginawang masiglang pangkasalukuyang kilos. Ang “bumabali” ay natural sa Filipino para sa pagputol o pagpira-piraso sa matitibay na punong sedro.
- source_word: אֲרָזִים
  choice: mga sedro
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mga punong cedar; ang “mga sedro” ang maikli at kinikilalang katawagang Filipino.
- source_word: וַיְשַׁבֵּר
  choice: binabasag
  rationale: Pareho ang ugat nitong שבר at ng pandiwa sa unang sugnay. Ang “binabasag” ay nagpapanatili sa tuloy-tuloy na kilos at nagpapatingkad sa ikalawang linya nang hindi ginagawang nakalipas na pangyayari.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: ang mga sedro ng Lebanon
  rationale: Pinananatili ng parirala ang marangal at heograpikong pagtukoy sa tanyag na mga sedro na kaugnay ng Lebanon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang ipinahayag sa Israel at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kung “tinig” o “tunog” ang קוֹל
  choice: tinig
  alternative: tunog
  rationale: Kapuwa posible sa konteksto ng unos, ngunit mas pinananatili ng “tinig” ang personal at teopanikong puwersa ng paulit-ulit na parirala sa awit, habang kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Hinati sa dalawang linyang patula upang ilantad ang paralelismo. Ang “bumabali … binabasag” ay nagpapanatili sa pag-uulit ng diwa ng ugat na שבר habang nagbibigay ng natural na pagtindi sa Filipino.
