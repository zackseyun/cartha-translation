base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: tl
  text: Ang tinig ni Yahweh ay nasa ibabaw ng mga katubigan; kumukulog ang Diyos ng kaluwalhatian[a]; si Yahweh ay nasa ibabaw ng malalawak na katubigan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “ang maluwalhating Diyos.” Literal sa Hebreo: “Diyos ng kaluwalhatian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, walang hayag na pandiwa sa huling sugnay: “si Yahweh sa ibabaw ng malalawak na katubigan.”'
    reason: source_form
lexical_decisions:
- source_word: ק֥וֹל
  choice: tinig
  rationale: Pinananatili ng “tinig” ang personal at makatang paglalarawan sa kulog bilang makapangyarihang pagsasalita ni Yahweh; mas angkop ito kaysa sa impersonal na “tunog.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: עַל הַמָּיִם
  choice: nasa ibabaw ng mga tubig
  rationale: Likas na ipinahihiwatig ng עַל ang kinalalagyan sa ibabaw ng tubig, at pinananatili ng maramihang “mga tubig” ang makatang larawan ng Hebreo.
- source_word: אֵל הַכָּבוֹד
  choice: ang Diyos ng kaluwalhatian
  rationale: Malapit itong sumusunod sa anyong construct ng Hebreo at iniiwasang gawing simpleng pang-uri lamang ang “kaluwalhatian.”
- source_word: הִרְעִים
  choice: kumukulog
  rationale: Ang pandiwa ay mula sa רעם, “kumulog.” Ang pangkasalukuyang anyo ay malinaw at masigla sa paglalarawan ng bagyo sa salmo.
- source_word: מַיִם רַבִּים
  choice: malalawak na tubig
  rationale: Sa kontekstong patula, ipinahihiwatig ng parirala ang napakalawak o makapangyarihang kalipunan ng tubig. Mas natural sa modernong Tagalog ang “malalawak na tubig” kaysa sa literal ngunit alanganing “maraming tubig.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” at hindi pinapalitan ng titulo.
- issue: Ang kulog bilang tinig ng Diyos
  choice: Panatilihing magkaugnay ang “tinig” at “kumukulog” nang hindi ipinapaliwanag ang mekanismo
  alternative: Isalin nang tuwiran bilang “ang kulog ni Yahweh”
  rationale: Sadyang pinagsasanib ng tula ang tinig ni Yahweh at ang kulog. Ang pagpapanatili sa dalawang larawan ay hindi nagpapaliit dito bilang karaniwang paglalarawan lamang ng panahon.
- issue: Sugnay na walang hayag na pandiwa sa hulihan
  choice: Idagdag ang “ay nasa” para sa malinaw at likas na Tagalog
  alternative: “si Yahweh sa ibabaw ng malalawak na tubig”
  rationale: Walang hayag na pandiwa sa Hebreo, ngunit likas na ipinahihiwatig ang kinalalagyan. Nililinaw ito sa Tagalog nang hindi nagdaragdag ng bagong teolohikal na diwa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may malinaw na tatlong magkakatulad na sugnay. Pinanatili ang makatang larawan ng tinig, kulog, at malalawak na tubig nang hindi ito pinapaliwanag nang labis.
