  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: tl
  text: Niyayanig ng tinig ni Yahweh ang ilang[a]; niyayanig ni Yahweh ang ilang ng Kades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinamimilipit ang ilang” o “pinanginginig ang ilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: tinig
  rationale: Pinananatili ng “tinig” ang personal at makatang lakas ng paulit-ulit na pariralang קוֹל יְהוָה sa Awit 29, sa halip na ang mas impersonal na “tunog.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: יָחִיל
  choice: niyayanig
  rationale: Ang anyong Hiphil ng חול ay maaaring mangahulugang nagpapamilipit, nagpapanginig, o yumayanig. Ang “niyayanig” ay malinaw, masigla, at likas sa modernong Tagalog kapag ang ilang ang layon.
- source_word: מִדְבָּר
  choice: ilang
  rationale: Ang “ilang” ay tumutukoy sa di-nilinang at tiwangwang na lupain at hindi nililimitahan ang kahulugan sa tigang na disyerto lamang.
- source_word: מִדְבַּר קָדֵשׁ
  choice: ang ilang ng Kades
  rationale: Pinananatili nito ang ugnayang construct ng Hebreo at ang Kades bilang tiyak na pangalan ng lugar.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Inuna ang pandiwa upang mapanatili ang masiglang kilos at makatang diin ng Hebreo; inulit ang “niyayanig” upang sundan ang paralelismo ng orihinal.
