source:
  edition: WLC
  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: tl
  text: Makapangyarihan ang tinig ni Yahweh[a][b]; marilag ang tinig ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “Ang tinig ni Yahweh ay may kapangyarihan; ang tinig ni Yahweh ay may karilagan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: tinig
  rationale: Karaniwang nangangahulugang “tinig” o “tunog” ang קוֹל. Sa paulit-ulit na pormula ng awit, pinananatili ng “tinig” ang personal at aktibong pagbigkas ni Yahweh, na inilalarawan sa konteksto bilang dumadagundong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan na “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בַּכֹּחַ
  choice: makapangyarihan
  rationale: Maaaring ipakahulugan ang pariralang may pang-ukol na ב bilang “may/taglay ang kapangyarihan” o bilang paglalarawang “makapangyarihan.” Mas natural at matatag sa modernong Tagalog ang pang-uri, habang inilalahad sa talababa ang mas pormal na alternatibo.
- source_word: הָדָר
  choice: marilag
  rationale: Ang הָדָר ay tumutukoy sa kamahalan, karilagan, o marangal na ningning. Ang “marilag” ay natural na katapat sa Tagalog at angkop sa maharlika at teopanikong himig ng awit.
theological_decisions:
- issue: Paglalarawan sa “tinig ni Yahweh” sa pamamagitan ng mga pariralang בַּכֹּחַ at בֶּהָדָר
  choice: “Makapangyarihan … marilag”
  alternative: “Ang tinig ni Yahweh ay may kapangyarihan; ang tinig ni Yahweh ay may karilagan.”
  rationale: Maaaring basahin ang mga pariralang may ב bilang paglalarawan o bilang “may/taglay ang.” Pinili sa pangunahing teksto ang likas na pang-uring Tagalog, ngunit pinanatili sa talababa ang tunay na gramatikal na alternatibo.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan; kinikilala sa talababa ang tradisyonal na salin bilang titulo.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang baligtad na ayos (“Makapangyarihan ang tinig…”) upang maging likas at masigla ang tulang Tagalog habang pinananatili ang magkatulad na estruktura ng dalawang hati.
