revisions:
- from: Ang tinig ni Yahweh ay nagpapahilab sa mga usang babae[a] at naghuhubad sa mga gubat. Sa kanyang templo[b], ang lahat ay nagsasabi, “Kaluwalhatian!”
  to: Ang tinig ni Yahweh ay pinapahilab ang mga babaeng usa[a] at hinuhubaran ang mga kagubatan. Sa kanyang templo[b], lahat ng naroon ay nagsasabi, “Kaluwalhatian!”
  rationale: Inayos ang mga parirala upang maging mas likas at di-malabo sa modernong Filipino, habang pinananatili ang sanhi ng tinig ni Yahweh, ang imahen ng unos na naglalantad sa kagubatan, ang sama-samang pagpapahayag sa templo, at ang mga leksikal na kalabuan sa mga talababa.
