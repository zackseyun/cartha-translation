  text: ק֤וֹל יְהוָ֨ה יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽ/יֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּ/בְ/הֵיכָל֑/וֹ כֻּ֝לּ֗/וֹ אֹמֵ֥ר כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: tl
  text: Ang tinig ni Yahweh ay pinapahilab ang mga babaeng usa[a] at hinuhubaran ang mga kagubatan. Sa kanyang templo[b], lahat ng naroon ay nagsasabi, “Kaluwalhatian!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinapanganak ang mga babaeng usa,” o “pinapamilipit ang mga babaeng usa sa paghilab.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring mangahulugang “templo” o “palasyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: Ang tinig ni Yahweh
  rationale: Tuwirang isinasalin ang pariralang Hebreo at pinananatili ang personal na pangalan ng Diyos na יהוה bilang “Yahweh.”
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת֮
  choice: nagpapahilab sa mga usang babae
  rationale: Ang חול ay maaaring tumukoy sa pamimilipit o paghilab sa panganganak. Ang “nagpapahilab” ay likas sa modernong Filipino at pinananatili ang marahas na epekto ng tinig ni Yahweh; tinutukoy rin ng אַיָּלוֹת ang mga babaeng usa.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: at naghuhubad sa mga gubat
  rationale: Ang חשׂף ay nangangahulugang maghubad, maglantad, o mag-iwang walang takip. Ang masidhing larawang “naghuhubad sa mga gubat” ay angkop sa unos na inilalarawan sa salmo.
- source_word: וּבְהֵיכָלוֹ
  choice: Sa kanyang templo
  rationale: Maaaring mangahulugan ang הֵיכָל ng templo o palasyo. Pinili ang “templo” dahil sa tagpo ng pagsamba at sa pagbubunyi ng kaluwalhatian, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: כֻּלּוֹ אֹמֵר
  choice: ang lahat ay nagsasabi
  rationale: Bagaman isahan ang anyo ng participle na אֹמֵר, kolektibo o distributibo ang gamit nito kasama ng כֻּלּוֹ. Ang “ang lahat ay nagsasabi” ay malinaw at malapit sa anyo ng Hebreo.
- source_word: כָּבֽוֹד
  choice: Kaluwalhatian!
  rationale: Ang “Kaluwalhatian!” ay likas na iisang-salitang pagbubunyi at pinananatili ang bigat ng כָּבוֹד sa konteksto ng pagsamba.
theological_decisions:
- issue: Kahulugan ng הֵיכָל bilang tahanan ni Yahweh
  choice: templo
  alternative: palasyo
  rationale: Pinapaboran ng tagpo ng pagsamba at ng sigaw na “Kaluwalhatian!” ang “templo.” Gayunman, maaari ring tumukoy ang salita sa maharlikang palasyo, na angkop sa paglalarawan kay Yahweh bilang Hari; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matingkad na personipikasyon na ang tinig ang “naghuhubad” sa mga gubat, at hindi pinawi ang leksikal na kalabuan tungkol sa paghilab/panganganak at templo/palasyo.
