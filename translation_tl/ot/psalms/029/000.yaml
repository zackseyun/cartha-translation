  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: tl
  text: 'Awit ni David.


    Iukol ninyo kay Yahweh, kayong mga anak ng mga diyos[a];

    iukol ninyo kay Yahweh ang kaluwalhatian at lakas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak ng Diyos,” “mga anak ng makapangyarihan,” o “mga makalangit na nilalang.” Malamang na tumutukoy ang pariralang Hebreo sa mga kabilang sa makalangit na kapulungan.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Awit ni David
  rationale: Likas at maikling salin ng pamagat; pinananatili ng “ni David” ang posibleng lawak ng ugnayang ipinahihiwatig ng לְ.
- source_word: הָבוּ לַיהוָה
  choice: Iukol ninyo kay Yahweh
  rationale: Ipinahahayag ang idyomatikong diwa ng pag-uukol o pagkilala sa nararapat kay Yahweh, habang pinananatili ang pautos na anyo at pag-uulit.
- source_word: בְּנֵי אֵלִים
  choice: mga anak ng mga diyos
  rationale: Pinananatili ang literal at sadyang matensiyong pananalita ng Hebreo nang hindi agad ipinapakahulugan bilang mga tao o anghel; nililinaw sa talababa ang malamang na reperensiya.
- source_word: כָּבוֹד וָעֹז
  choice: kaluwalhatian at lakas
  rationale: Tuwirang katumbas ng dalawang pangngalan at angkop sa marangal na rehistro ng salmo.
theological_decisions:
- issue: Pagkakakilanlan ng בְּנֵי אֵלִים
  choice: mga anak ng mga diyos
  alternative: mga anak ng Diyos; mga makalangit na nilalang; mga anak ng makapangyarihan
  rationale: Hindi tahasang nilulutas ng pangunahing teksto kung ang parirala ay katawagan sa mga kabilang sa makalangit na kapulungan; pinananatili ang leksikal na anyo at inilalahad ang mga posibleng pakahulugan sa talababa.
- issue: Paglalahad ng banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalan upang malinaw na katawanin ang tetragrammaton sa pinagmulang Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang patulang pag-uulit at ang hindi pangkaraniwang katawagang “mga anak ng mga diyos,” na may paliwanag sa talababa upang hindi ikubli ang tunay na kalabuan ng Hebreo.
