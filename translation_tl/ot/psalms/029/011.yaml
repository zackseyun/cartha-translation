base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: tl
  text: Nagbibigay si Yahweh ng lakas sa kanyang bayan[a]; pinagpapala ni Yahweh ang kanyang bayan ng kapayapaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magbibigay si Yahweh ng lakas sa kanyang bayan; pagpapalain ni Yahweh ang kanyang bayan ng kapayapaan.” Maaari ring magkaroon ng panghinaharap na diwa ang mga pandiwang Hebreo.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo na isinaling “kapayapaan” ay shalom, na maaari ring tumukoy sa kabuuan, kagalingan, at mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עֹז
  choice: lakas
  rationale: Ang pangngalan ay tumutukoy sa lakas o kapangyarihan; natural sa Filipino ang pariralang “nagbibigay ng lakas.”
- source_word: לְעַמּוֹ
  choice: sa kanyang bayan
  rationale: 'Ang לְ ay nagmamarka rito ng di-tuwirang layon: ibinibigay ang lakas sa bayan niya.'
- source_word: יִתֵּן
  choice: nagbibigay
  rationale: Maaaring ipahayag ng imperfect sa tulang Hebreo ang palagian o katangiang kilos; ang pangkasalukuyang anyo ay naghahayag ng may-tiwalang katiyakan.
- source_word: יְבָרֵךְ
  choice: pinagpapala
  rationale: Kaagapay ng unang pandiwa, binabasa ito bilang deklarasyon ng ginagawa ni Yahweh, habang kinikilala sa talababa ang posibleng hinaharap na diwa.
- source_word: אֶת עַמּוֹ
  choice: ang kanyang bayan
  rationale: Tuwirang layon ito; pinananatili ang pag-uulit upang maingatan ang paralelismo ng Hebreo.
- source_word: בַשָּׁלוֹם
  choice: ng kapayapaan
  rationale: Natural sa Filipino ang “pinagpapala ... ng kapayapaan”; ang שָׁלוֹם ay may mas malawak ding saklaw na kinabibilangan ng kabuuan at mabuting kalagayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, hindi bilang titulo.
- issue: Aspekto ng יִתֵּן at יְבָרֵךְ
  choice: 'Pangkasalukuyang deklarasyon: “nagbibigay ... pinagpapala”'
  alternative: 'Panghinaharap: “magbibigay ... pagpapalain”; maaari ring basahin bilang hiling'
  rationale: Sa pangwakas na pahayag ng awit, maaaring ipahayag ng mga imperfect ang patuloy o katangiang pagkilos ni Yahweh. Gayunman, tunay na posible ang panghinaharap na pagbasa kaya inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עַם at pinanatili ang paralelismo at pag-uulit ng orihinal.
