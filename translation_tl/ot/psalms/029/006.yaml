translation_notes:
  register: Makabagong Filipino na may marangal at masiglang himig. Ginawang tahasan ang dalawang magkatulad na sugnay para sa natural na pagbasa, habang inilagay sa talababa ang mas literal na ayos at ang sintaktikong posibilidad nito.
