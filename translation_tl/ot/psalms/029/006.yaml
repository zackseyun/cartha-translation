base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: tl
  text: Pinapalundag niya ang Lebanon na parang guya[c], at ang Sirion[a] na parang batang mailap na toro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Sirion ay isa pang pangalan ng Bundok Hermon.
    reason: cross_reference
  - marker: b
    text: Maaari ring “batang toro.” Sa literal, “anak ng mga mailap na toro” ang Hebreo—isang idyoma para sa batang mailap na toro.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring: “Pinapalundag niya sila na parang guya—ang Lebanon at Sirion na parang batang mailap na toro.” Nauuna sa Hebreo ang panghalip na “sila” bago tahasang banggitin ang Lebanon at Sirion.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Pinalulundag niya
  rationale: 'Ang Hiphil ng רקד ay causative: ‘pinagagawa niyang lumundag.’ Ang “pinalulundag” ay malinaw, masigla, at angkop sa larawan ng guya at batang mailap na toro. Bagaman may hulaping maramihan na ‘sila’ sa Hebreo, tahasang pinangalanan sa kasunod na paralelismo ang Lebanon at Sirion.'
- source_word: כְּמוֹ עֵגֶל
  choice: na parang guya
  rationale: Karaniwang tumutukoy ang עֵגֶל sa guya o batang baka; pinananatili ng “guya” ang larawan ng masiglang paglundag.
- source_word: לְבָנוֹן
  choice: ang Lebanon
  rationale: Pangalan ng lugar na pinanatili sa karaniwang transliterasyon.
- source_word: וְשִׂרְיֹן
  choice: at ang Sirion
  rationale: Pinanatili ang pangalang ginamit sa tekstong Hebreo sa halip na palitan ito ng Hermon; ipinaliwanag sa talababa ang pagkakakilanlan nito.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: na parang batang mailap na toro
  rationale: Idyomatiko rito ang בֶן bilang supling o batang hayop. Ang רְאֵם ay pinakamalamang na isang mailap na uring bovine, kaya iniwasan ang tradisyonal ngunit di-tumpak na ‘unicorn.’
