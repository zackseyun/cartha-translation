  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pamagat, ang dalawang ulit na pautos na הָבוּ, ang pagtawag sa Yahweh, at ang magkatambal na “kaluwalhatian at lakas.” Ang “mga anak ng Diyos” ay isang katanggap-tanggap na pangunahing salin ng בְּנֵי אֵלִים at sinusuportahan ng audit trail; itinatala rin ng talababa ang mahahalagang alternatibo at ang malamang na kontekstong makalangit na kapulungan.'
