id: PSA.29.1
reference: Psalms 29:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: tl
  text: 'Awit ni David.


    Iukol ninyo kay Yahweh, kayong mga anak ng Diyos[a];

    iukol ninyo kay Yahweh ang kaluwalhatian at lakas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak ng mga diyos” o “mga makalangit na nilalang.” Malamang na tumutukoy ang pariralang Hebreo sa mga kabilang sa makalangit na kapulungan.
    reason: Pinananatili ang kalabuan ng בְּנֵי אֵלִים habang nililinaw ang malamang na konteksto nito.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan sa ganitong pamagat ng isang salmo; natural at malinaw ito sa makabagong Filipino.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang לְ sa mga pamagat ng salmo ay maaaring tumukoy sa may-akda, kaugnayan, pag-aari, o pinag-alayan. Hindi lubos na nilulutas ng karaniwang pariralang “ni David” ang lawak na iyon.
- source_word: הָבוּ
  choice: Iukol ninyo
  rationale: Sa kontekstong ito, ang utos ay kilalanin at ipahayag na kay Yahweh nauukol ang kaluwalhatian at lakas, hindi literal na mag-abot ng mga ito. Pinananatili rin ng “iukol” ang paulit-ulit na anyo ng Hebreo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּנֵי אֵלִים
  choice: mga anak ng Diyos
  rationale: Malapit ito sa konkretong larawang “mga anak” sa Hebreo at hindi nito lubos na pinapalitan ang parirala ng interpretasyong “mga nilalang sa langit.” Inilalahad sa talababa ang tunay na leksikal at kontekstuwal na kalabuan.
- source_word: כָּבוֹד
  choice: kaluwalhatian
  rationale: Ito ang natural at kinikilalang katumbas sa konteksto ng banal na kadakilaan at karangalan.
- source_word: וָעֹז
  choice: at lakas
  rationale: Tumpak at pangkaraniwang katumbas ng עֹז, at maayos na kapareha ng “kaluwalhatian” sa paralelismong patula.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang nasa Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan sa halip na gawing titulong “PANGINOON.”
- issue: Pag-unawa sa בְּנֵי אֵלִים
  choice: mga anak ng Diyos
  alternative: mga anak ng mga diyos; mga makalangit na nilalang
  rationale: Maaaring tukuyin ng parirala ang mga kabilang sa makalangit na kapulungan, ngunit pinagtatalunan ang eksaktong diwa ng אֵלִים. Pinananatili sa pangunahing teksto ang imahen ng Hebreo at inilalagay sa talababa ang mas tahasang mga posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikling pamagat, ang tuwirang panawagan, ang pag-uulit ng utos, at ang patulang paralelismo ng Hebreo.
