  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: tl
  text: Ang tinig ni Yahweh ay humihiwa ng mga liyab ng apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kislap ng apoy,” na malamang ay tumutukoy sa kidlat sa larawan ng bagyo sa salmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: tinig
  rationale: Pinananatili ng “tinig” ang karaniwang kahulugan at ang makatang paglalarawan sa dagundong ng bagyo bilang makapangyarihang pagsasalita ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: חֹצֵב
  choice: hinahati
  rationale: Ang pandiwang חצב ay tumutukoy sa pagtabas o pag-ukit. Sa taludtod na ito, likas at matingkad sa Tagalog ang “hinahati,” at pinananatili nito ang larawan ng tinig na bumibiyak o naghahati sa nagliliyab na mga kislap.
- source_word: לַהֲבוֹת
  choice: mga liyab
  rationale: Ang “mga liyab” ang tuwirang katumbas ng maramihang anyo at pinananatili ang konkretong larawan ng apoy; ang posibleng pagtukoy sa kidlat ay inilalagay sa talababa.
- source_word: אֵשׁ
  choice: apoy
  rationale: Tuwirang isinasalin ang אֵשׁ bilang “apoy,” kaya napapanatili ang mariing pariralang Hebreo na “mga liyab ng apoy.”
theological_decisions:
- issue: Paglalarawan sa bagyo na nagpapanatili sa pagkilos ng Diyos nang hindi ito ginagawang tahasang makabagong paliwanag sa panahon
  choice: Hinahati ng tinig ni Yahweh ang mga liyab ng apoy.
  alternative: Pinakikislap ng tinig ni Yahweh ang mga kidlat.
  rationale: Pinananatili sa pangunahing teksto ang kongkreto at bahagyang palaisipang talinghaga ng Hebreo. Hindi tahasang tinutumbasan ng “kidlat” ang mga liyab, bagaman malamang na iyon ang larawang tinutukoy sa konteksto ng bagyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “hinahati” ay mas madaling maunawaan kaysa sa mas arkaikong “tinatabas,” habang nananatili ang matinding kilos ng pandiwang Hebreo. Ang “mga liyab ng apoy” ay sadyang makata at bahagyang mariin, gaya ng orihinal.
