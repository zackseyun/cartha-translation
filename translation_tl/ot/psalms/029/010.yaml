  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ng “nakaluklok” ang imaheng paghahari/enthronement ng יָשַׁב at וַיֵּשֶׁב, at ng “sa ibabaw ng baha” ang ugnayan ni Yahweh sa מַבּוּל nang hindi ipinapasya kung ito ay ang Baha ni Noe o pangkalahatang baha/delubyo. Ang “magpakailanman” ay wastong katumbas ng לְעוֹלָם. Ang pag-uulit ng pangalan at pandiwa ay angkop na sumasalamin sa paralelismo ng talata.'
