  text: יְ֭הוָה לַ/מַּבּ֣וּל יָשָׁ֑ב וַ/יֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: tl
  text: 'Nakaluklok si Yahweh sa ibabaw ng baha[a];

    nakaluklok si Yahweh bilang Hari magpakailanman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa ibabaw ng Baha,” na partikular na nagpapahiwatig sa baha noong panahon ni Noe.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh upang tuwirang katawanin ang tetragramang YHWH at mapanatili ang pagkakaiba nito sa titulong “Panginoon.”
- source_word: לַמַּבּוּל
  choice: sa ibabaw ng baha
  rationale: Ang מַבּוּל ay baha o delubyo at maaari ring tumukoy sa malaking Baha. Ipinahahayag ng “sa ibabaw ng baha” ang lokatibong gamit ng ל at ang paghahari ni Yahweh sa magulong tubig nang hindi nililimitahan ang salita sa isang tiyak na pangyayari.
- source_word: יָשָׁב
  choice: nakaluklok
  rationale: Bagaman pangunahing nangangahulugang “umupo” o “nanahan,” ang salita sa kontekstong maharlika ay may diwang nakaupo sa trono. Likas at marangal sa Filipino ang “nakaluklok.”
- source_word: וַיֵּשֶׁב
  choice: nakaluklok
  rationale: Pinananatili ang paralelismo ng dalawang pandiwa. Sa ikalawang linya, nililinaw ng “magpakailanman” na nagpapatuloy ang paghahari, kahit hindi tahasang ipinapasok sa pandiwa ang aspektong iyon.
- source_word: מֶלֶךְ
  choice: bilang Hari
  rationale: Malinaw na ipinahahayag ang predikatibong katayuang maharlika ni Yahweh; ang malaking titik ay tanda ng natatanging titulo sa kontekstong ito.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, malinaw, at marangal na salin para sa walang-hanggang tagal.
theological_decisions:
- issue: Kung ang מַבּוּל ay partikular na tumutukoy sa Baha noong panahon ni Noe o sa baha/magulong tubig sa mas pangkalahatang diwa
  choice: baha
  alternative: ang Baha, bilang pahiwatig sa baha noong panahon ni Noe
  rationale: Maaaring pumukaw ang pambihirang salitang מַבּוּל ng salaysay tungkol kay Noe, ngunit hindi tahasang binabanggit ng talata si Noe at ang agarang konteksto ay isang makapangyarihang bagyo. Pinananatili ng maliit na titik sa “baha” ang dalawang posibleng alingawngaw nang hindi ipinapasya ang alinman.
- issue: Aspekto ng וַיֵּשֶׁב kaugnay ng walang-hanggang paghahari
  choice: nakaluklok ... magpakailanman
  alternative: patuloy na nakaluklok ... magpakailanman
  rationale: Hinahayaan ang pariralang “magpakailanman” na magpahayag ng nagpapatuloy na paghahari, habang pinananatili ang anyo at paralelismo ng Hebreo at iniiwasang dagdagan nang labis ang pandiwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ang “nakaluklok” ay angkop sa larawang maharlika at mas natural kaysa sa literal na “umupo sa trono.” Pinanatili ang dalawang magkatulad na sugnay upang katawanin ang retorikal na paralelismo ng Hebreo.
