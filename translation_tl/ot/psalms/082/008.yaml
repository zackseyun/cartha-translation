  source_fidelity: 'Tumpak ang salin sa mga pangunahing elemento ng Hebreo: dalawang pautos na panawagan sa Diyos (קוּמָה; שָׁפְטָה), ang pandaigdig na saklaw ng “lupa,” at ang batayang “sapagkat” para sa kaniyang pagmamana/pag-angkin sa lahat ng bansa. Ang “buong lupa” ay isang katanggap-tanggap na pagpapalinaw ng pandaigdig na saklaw sa konteksto ng “lahat ng bansa.”'
