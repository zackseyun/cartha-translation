  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: tl
  text: Bumangon ka, O Diyos, at hatulan mo ang buong lupa, sapagkat mamanahin mo ang lahat ng bansa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sapagkat aangkinin mo ang lahat ng bansa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Ang pautos na anyo ng קום ay isang apurahang panawagan sa Diyos na kumilos. Natural sa modernong Filipino ang “Bumangon ka” at hindi makaluma.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Malinaw sa mga pandiwang isahan at sa panghalip na iisa ang kinakausap. Pinananatili ng “O Diyos” ang tuwirang panawagan ng panalangin.
- source_word: שָׁפְטָה
  choice: hatulan mo
  rationale: Pinananatili nito ang hudisyal at maharlikang saklaw ng שׁפט nang hindi ito nililimitahan sa pamamahala lamang o sa pagpapawalang-sala.
- source_word: הָאָרֶץ
  choice: ang buong lupa
  rationale: Dahil kaagapay nito ang “lahat ng bansa,” pandaigdig ang saklaw. Nililinaw ng “buong lupa” ang kahulugang ito sa natural na Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng pakiusap. Ang “sapagkat” ay marangal at malinaw sa ganitong panalanging patula.
- source_word: אַתָּה
  choice: mo
  rationale: Sa Filipino, likas na nakapaloob ang ikalawang panauhan sa “mo.” Hindi kailangang idagdag ang hiwalay na “ikaw,” na magiging mabigat sa pangungusap.
- source_word: תִנְחַל
  choice: mamanahin mo
  rationale: Pinananatili ng “mamanahin” ang diwa ng pagtanggap o pag-angkin bilang mana, kasama ang maharlika at tipanang pahiwatig, sa halip na gawing pangkalahatang pagmamay-ari lamang.
- source_word: בְּכָל הַגּוֹיִם
  choice: ang lahat ng bansa
  rationale: 'Sa pagkakaugnay nito sa נחל, likas itong unawain bilang kabuuang layon o saklaw ng mamanahin: lahat ng mga bansa.'
theological_decisions:
- issue: Ang kaugnayan ng Diyos sa mga bansa sa תִנְחַל בְּכָל הַגּוֹיִם
  choice: mamanahin mo ang lahat ng bansa
  alternative: aangkinin mo ang lahat ng bansa
  rationale: Ibinabatay ng talata ang panawagang hatulan ng Diyos ang lupa sa kaniyang pandaigdig na karapatan sa mga bansa. Pinananatili ng “mamanahin” ang larawan ng mana at marapat na pag-aangkin nang hindi ito pinapantay sa payak na pahayag ng pagmamay-ari.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin at tula. Ginamit ang “Bumangon” sa halip na mas makalumang “Magbangon,” at “buong lupa” upang malinaw ang pandaigdig na saklaw. Ang tandang [a] ay inilagay matapos ang sugnay na tinutukoy nito.
