  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: tl
  text: Ngunit mamamatay kayong gaya ng tao[a], at babagsak kayo gaya ng isa sa mga pinuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ni Adan,” kung ang parirala ay tumutukoy sa unang tao sa halip na sa sangkatauhan sa pangkalahatan.
    reason: alternative_reading
  - marker: b
    text: O “mga prinsipe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Ngunit
  rationale: Ipinakikita ang mariing pagsalungat sa naunang pahayag tungkol sa mataas nilang katayuan; likas at malinaw ang “Ngunit” sa modernong Tagalog.
- source_word: כְּאָדָם
  choice: gaya ng tao
  rationale: Pinananatili ang anyong isahan at pangkalahatang diwa ng אָדָם bilang taong kumakatawan sa sangkatauhan, habang hindi itinatago ang posibleng pagtukoy kay Adan.
- source_word: תְּמוּתוּן
  choice: mamamatay kayo
  rationale: Tuwirang hinaharap na pahayag sa ikalawang panauhang maramihan, na angkop sa hatol sa konteksto.
- source_word: וּכְאַחַד
  choice: at ... na gaya ng isa sa
  rationale: Likas na Tagalog para sa paghahambing sa isang kabilang sa isang pangkat.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Saklaw ng שׂרים ang mga prinsipe o namumuno; mas karaniwan at malawak na nauunawaan sa modernong Tagalog ang “mga pinuno.”
- source_word: תִּפֹּלוּ
  choice: babagsak
  rationale: Pinananatili ang metapora ng נפל para sa pagbagsak o kapahamakan sa ilalim ng hatol.
theological_decisions:
- issue: Kahulugan ng אָדָם sa כְּאָדָם
  choice: tao bilang kinatawan ng karaniwang sangkatauhan
  alternative: Adan bilang pangalan ng unang tao
  rationale: Sa agarang konteksto, itinatapat ang ipinahayag na mataas na katayuan ng mga kinakausap sa kanilang mortalidad bilang tao. Gayunman, tunay na posible sa anyong Hebreo ang pagbasa na tumutukoy kay Adan, kaya inilagay ito sa talababa.
- issue: Kahulugan ng שׂרים
  choice: mga pinuno
  alternative: mga prinsipe
  rationale: Hindi tiyak na maharlikang anak ang tinutukoy; maaaring tumukoy ang salita sa mataas na mga tagapamahala. Pinananatili sa talababa ang mas tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang maramihang “kayo” ayon sa Hebreo, pinanatili ang metaporang “babagsak,” at inilagay ang mga tunay na alternatibong pagbasa sa mga talababa.
