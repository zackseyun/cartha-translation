  text: Sinabi ko, “Kayo ay mga diyos, at kayong lahat ay mga anak ng Kataas-taasan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: Sinabi ko
  rationale: Likas at tuwirang salin ng may-diin na pahayag; hindi na kailangang gawing tahasang “Ako ang nagsabi” sa kontekstong ito.
- source_word: אֱלֹהִים אַתֶּם
  choice: Kayo ay mga diyos
  rationale: Pinananatili ang literal at sadyang matinding katawagan ng Hebreo nang hindi ito ipinapaliwanag o pinapahina sa mismong teksto.
- source_word: וּבְנֵי עֶלְיוֹן
  choice: at ... mga anak ng Kataas-taasan
  rationale: Ang וּ ay isinaling “at,” ang בְנֵי bilang “mga anak,” at ang עֶלְיוֹן sa nakaugaliang marangal na titulong “Kataas-taasan.”
- source_word: כֻּלְּכֶם
  choice: kayong lahat
  rationale: Malinaw na pinananatili ang pangmaramihang ikalawang panauhan at ang saklaw na “lahat.”
theological_decisions:
- issue: Pagkakakilanlan ng tinatawag na אֱלֹהִים
  choice: mga diyos
  alternative: mga hukom / mga makapangyarihan
  rationale: Hindi tinutukoy ng talata lamang kung ang tinutukoy ay mga makalangit na nilalang o mga taong may awtoridad. Pinananatili ng “mga diyos” ang leksikal na anyo at teolohikal na tensiyon ng Hebreo.
- issue: Kahulugan ng “mga anak ng Kataas-taasan”
  choice: Pinanatili bilang tuwirang katawagan
  alternative: Ipaliwanag bilang mga nilalang o kinatawan ng Kataas-taasan
  rationale: Hindi dapat ipasok sa teksto ang isang tiyak na doktrinal na paliwanag na hindi tahasang ibinibigay ng talata.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinanatili ang parallelism ng dalawang katawagan at ang tunay na kalabuan ng salitang אֱלֹהִים.
