source:
  edition: WLC
  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: tl
  text: Hindi nila alam, at hindi nila nauunawaan; naglalakad sila sa kadiliman. Nayayanig[a] ang lahat ng pundasyon ng daigdig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natitinag” o “bumibigay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pundasyon ng lupain,” kung ang אָרֶץ ay inuunawa sa mas lokal na diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: Hindi nila alam
  rationale: Ang Qal ng ידע ay karaniwang nangangahulugang “malaman.” Bagaman anyong perfect ang pandiwa, inilalarawan dito ang kasalukuyang kalagayan ng kawalang-kaalaman, kaagapay ng sumusunod na sugnay.
- source_word: וְלֹא יָבִינוּ
  choice: at hindi nila nauunawaan
  rationale: Ang Hiphil ng בין ay maaaring mangahulugang “umunawa” o “kumilala nang may discernment.” Pinananatili ng “nauunawaan” ang tuwirang paralelismo sa “alam” sa natural na modernong Tagalog.
- source_word: בַּחֲשֵׁכָה
  choice: sa kadiliman
  rationale: Tuwirang inilalarawan ng parirala ang kinalalagyan o kalagayan ng kanilang pagkilos. Natural at marangal sa Tagalog ang “sa kadiliman.”
- source_word: יִתְהַלָּכוּ
  choice: naglalakad sila
  rationale: Ang Hitpael ng הלך ay nagsasaad ng patuloy o nakagawiang pagkilos. Sapat na ipinahihiwatig ng aspektong Tagalog na “naglalakad” ang nagpapatuloy na kilos nang hindi idinaragdag ang ideya ng walang-tiyak na paggala.
- source_word: יִמּוֹטוּ
  choice: Nayayanig
  rationale: Ang Niphal ng מוט ay tumutukoy sa pag-uga, pagkatinag, o pagkawala ng katatagan. Malinaw na ipinahahayag ng “nayayanig” ang destabilization nang hindi ipinapalagay na ganap nang gumuho ang mga pundasyon.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: ang lahat ng pundasyon ng daigdig
  rationale: Ang מוֹסְדֵי ay mga pundasyon o saligan, at ang אָרֶץ ay maaaring “lupain” o “daigdig.” Sa malawak at kosmikong larawang patula ng talata, malinaw na naihahatid ng “daigdig” ang saklaw habang iniiwan sa talababa ang lokal na posibilidad.
theological_decisions:
- issue: Saklaw ng אָרֶץ at ang larawan ng pagyanig sa kaayusan ng sanlibutan
  choice: daigdig
  alternative: lupain
  rationale: Ang awit ay tumutuligsa sa di-makatarungang pamamahala at inilalarawan ang epekto nito sa mga pundasyon ng buong kaayusan. Pinananatili ng “daigdig” ang malawak na lakas ng larawang patula nang hindi nagdaragdag ng paliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang paralelismong “alam / nauunawaan,” ang larawan ng paglakad sa kadiliman, at ang patulang pagyanig ng mga pundasyon. Inilagay ang mga pananda ng talababa sa mismong salitang tinutukoy ng bawat tala.
