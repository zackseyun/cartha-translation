  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: tl
  text: 'Awit ni Asaf.


    Ang Diyos ay nakatindig sa kapulungan ng Diyos;

    sa gitna ng mga diyos[a] siya humahatol.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga makalangit na nilalang.” Itinuturing naman ng ilan na ang “mga diyos” dito ay mga taong hukom o pinuno.
    reason: Pinananatili ang leksikal na ambiguwidad ng אֱלֹהִים at itinatala ang pangunahing alternatibong pagpapakahulugan.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan sa Filipino para sa isang salmo at natural na pamagat ng ganitong uri ng tula o awiting panrelihiyon.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Likas na paraan sa Filipino upang ipahayag ang kaugnayan o pag-uukol kay Asaf nang hindi tiyakang ipinapasiya kung siya ang may-akda, pinag-alayan, o pinagmulan ng awit.
- source_word: אֱלֹהִים (unang gamit)
  choice: Ang Diyos
  rationale: Ang kasunod na anyong pang-isahan na נִצָּב at ang pang-isahang pandiwa sa hulihan ay nagpapakitang ang Diyos ng Israel ang paksa.
- source_word: נִצָּב
  choice: nakatindig
  rationale: Pinananatili ang larawan ng Diyos na nakatayo sa isang tagpong panghukuman; marangal ngunit malinaw sa modernong Filipino.
- source_word: בַּעֲדַת אֵל
  choice: sa kapulungan ng Diyos
  rationale: Malapit sa anyong Hebreo at iniiwasang gawing tiyak ang kahulugan bilang makalangit na konseho, bagaman iyon ang malamang na tagpuan. Pinananatili rin nito ang ugnayan ng עֲדַת at אֵל.
- source_word: בְּקֶרֶב
  choice: sa gitna ng
  rationale: Direktang pinananatili ang larawang pook ng pagiging nasa gitna ng pangkat.
- source_word: אֱלֹהִים (ikalawang gamit)
  choice: mga diyos
  rationale: Ang ikalawang gamit ay tumutukoy sa pangkat na kinaroroonan at hinahatulan ng Diyos. Ang maramihang anyo ay tahasang pinananatili sa pangunahing teksto, habang inilalahad sa talababa ang posibleng kahulugang ‘mga makalangit na nilalang’ at ang pagpapakahulugang mga taong hukom o pinuno.
- source_word: יִשְׁפֹּט
  choice: siya humahatol
  rationale: Ipinahahayag ang kilos na panghukuman sa paraang maikli at natural, at naaayon sa tagpo ng kapulungan.
theological_decisions:
- issue: Ang tinutukoy ng ikalawang אֱלֹהִים
  choice: mga diyos
  alternative: mga makalangit na nilalang; o, ayon sa ilan, mga taong hukom o pinuno
  rationale: Pinag-iiba ng balarila at tagpo ang unang אֱלֹהִים, na pang-isahang Diyos, sa ikalawang אֱלֹהִים, na isang pangkat. Pinananatili ng pangunahing teksto ang tuwirang leksikal na lakas at teolohikal na tensiyon ng ‘mga diyos,’ samantalang ipinapakita ng talababa ang mahahalagang alternatibong pagkaunawa nang hindi palihim na nilulutas ang usapin.
- issue: Kahulugan ng עֲדַת אֵל
  choice: kapulungan ng Diyos
  alternative: banal na kapulungan; makalangit na konseho
  rationale: Ang ‘kapulungan ng Diyos’ ay pormal na malapit sa Hebreo at hindi labis na nagpapaliwanag. Ang mga alternatibo ay maaaring magpahiwatig nang mas tahasan ng makalangit na tagpuan ngunit mas interpretibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nakatindig” upang mapanatili ang solemneng tagpong panghukuman, at “kapulungan” bilang malinaw ngunit hindi labis na interpretibong tawag sa nagkakatipong pangkat. Ang talababa ay inilagay pagkatapos ng “mga diyos,” ang salitang aktuwal nitong nililinaw.
