  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: tl
  text: 'Awit ni Asaf.


    Ang Diyos ay nakatayo sa kapulungan ng Diyos;

    sa gitna ng mga diyos[a] ay humahatol siya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga makalangit na nilalang.” Itinuturing naman ito ng ilan na tumutukoy sa mga taong hukom o pinuno.
