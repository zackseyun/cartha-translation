lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Awit ni Asaf
  rationale: Natural at tradisyonal na salin ng pamagat; ang לְ ay maaaring magpahiwatig ng kaugnayan o pag-akda, kaya hindi pinalawak nang higit sa sinasabi ng Hebreo.
- source_word: בַּעֲדַת אֵל
  choice: sa kapulungan ng Diyos
  rationale: Pinananatili ang larawan ng isang kapulungang pinangungunahan ng Diyos at ang tuwirang kahulugan ng אֵל.
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Pinananatili ang sadyang pag-uulit at tensiyon ng salitang אֱלֹהִים sa talata; inilagay sa talababa ang mahahalagang alternatibong pagkaunawa.
- source_word: יִשְׁפֹּט
  choice: humahatol siya
  rationale: Tuwirang ipinapahayag ang gawain ng paghatol; ang panghalip ay tumutukoy sa Diyos na paksa ng naunang sugnay.
theological_decisions:
- issue: Pagkakakilanlan ng tinatawag na אֱלֹהִים sa ikalawang sugnay
  choice: mga diyos
  alternative: mga makalangit na nilalang; mga taong hukom o pinuno
  rationale: Hindi nilulutas ng pangunahing teksto ang tunay na interpretatibong tensiyon. Ang literal na anyo ay pinanatili, habang inilalahad sa talababa ang pangunahing mga alternatibo nang hindi kumakampi sa isang partikular na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyong patula at ang pag-uulit ng “Diyos/mga diyos” sa Hebreo.
