  source_fidelity: 'Tumpak ang salin sa Hebreo. Ang שִׁפְטוּ ay angkop na naipahayag bilang “Ipagtanggol ninyo” sa kontekstong panghukuman at panlipunan, samantalang ang הַצְדִּיקוּ ay wastong naipahayag bilang “bigyang-katarungan,” na pinananatili ang diwang legal na pagtiyak o pagbibigay ng makatarungang hatol para sa mga api. Napananatili rin ang dalawang pares: mahina/ulila at dukha/maralita.'
