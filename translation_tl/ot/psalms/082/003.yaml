  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: tl
  text: Ipagtanggol ninyo ang mahina at ang ulila; bigyang-katarungan ang dukha at ang maralita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: Ipagtanggol ninyo
  rationale: Ang pandiwa ay literal na tumutukoy sa paghatol o paggawad ng katarungan; sa konteksto, hinihingi nito ang aktibong pagtatanggol sa karapatan ng mahina.
- source_word: דַל
  choice: mahina
  rationale: Tumutukoy sa taong mahina o walang kapangyarihan, hindi lamang sa taong salat sa salapi.
- source_word: יָתוֹם
  choice: ulila
  rationale: Karaniwang katumbas ng taong walang ama o magulang; pinananatili ng “ulila” ang maikli at pamilyar na anyo.
- source_word: הַצְדִּיקוּ
  choice: bigyang-katarungan
  rationale: 'Hifil na anyo ng צדק: kilalaning nasa tama o igawad ang makatarungang pasiya; ang parirala ay natural sa Filipino at hindi nagpapahiwatig na gagawing likas na matuwid ang tao.'
- source_word: עָנִי
  choice: dukha
  rationale: Maaaring tumukoy sa naghihirap, api, o aba; “dukha” ay angkop sa kontekstong panlipunan at legal.
- source_word: רָשׁ
  choice: maralita
  rationale: Tumutukoy sa taong salat o mahirap; naiiba nang bahagya sa “dukha” habang pinananatili ang magkatulad na pares sa Hebreo.
theological_decisions:
- issue: Kahulugan ng הַצְדִּיקוּ sa kontekstong hudisyal
  choice: bigyang-katarungan
  alternative: pawalang-sala / ariing matuwid
  rationale: Ang talata ay utos sa mga humahatol na ipagtanggol ang karapatan ng mga api at mahihirap. Ang salin ay nagpapanatili sa hudisyal na diwa nang hindi nag-aangkat ng sistematikong doktrina tungkol sa pag-aaring-matuwid.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang magalang/pangmaramihang “ninyo” upang malinaw na maramihan ang mga utos sa Hebreo.
