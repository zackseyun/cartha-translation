  text: עַד מָתַ֥י תִּשְׁפְּטוּ עָ֑וֶל וּ/פְנֵ֥י רְ֝שָׁעִ֗ים תִּשְׂאוּ סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/002.yaml
  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: tl
  text: Hanggang kailan kayo hahatol nang di-makatarungan at kikilingan ang masasama? Selah[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Selah” ay isang terminong Hebreo na hindi tiyak ang kahulugan; maaaring isa itong panandang musikal o liturhikal.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Natural na temporal na tanong sa Filipino na nagpapanatili sa lakas ng pagsaway.
- source_word: תִּשְׁפְּטוּ
  choice: kayo hahatol
  rationale: Ang imperfect na ikalawang panauhang maramihan ay nasa retorikal na tanong tungkol sa nagpapatuloy na gawain; ang anyong ito ay natural sa Filipino at hindi nililimitahan sa isang kilos sa hinaharap.
- source_word: עָוֶל
  choice: nang di-makatarungan
  rationale: Ang pangngalan ay gumaganap na pang-abay kaugnay ng paghatol; malinaw nitong ipinapahayag ang likong paraan ng paghatol.
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: at kikilingan ang masasama
  rationale: Ang literal na idyomang 'itaas ang mukha' ay nangangahulugang magpakita ng pabor o pagkiling; sa kontekstong panghukuman, 'kikilingan' ang pinakanatural at tuwirang katumbas.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwan at dignified na katawagan para sa mga taong may moral na kasamaan, nang hindi labis na nililimitahan sa legal na pagkakasala.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili ang transliterasyon dahil hindi tiyak ang eksaktong kahulugan at tungkulin ng termino.
theological_decisions:
- issue: Idyomang panghukuman tungkol sa pagkiling sa masasama
  choice: kikilingan ang masasama
  alternative: papaboran ang masasama
  rationale: Malinaw na tinutuligsa ng talata ang tiwaling paghatol. Ipinapakita ng 'kikilingan' ang kawalan ng patas na paghatol nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang maramihang 'kayo' ayon sa Hebreong 2mp. Pinanatili ang 'Selah' upang huwag tiyaking isalin ang isang salitang hindi tiyak ang kahulugan.
