translation:
  language: tl
  text: Iligtas ninyo ang mga dukha at nangangailangan[a]; sagipin ninyo sila mula sa kamay ng mga masasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mahihina at nangangailangan.” Ang salitang Hebreo na דַּל ay maaaring mangahulugang “dukha” o “mahina,” at itinatampok nito kapuwa ang kahirapan at pagiging walang kalaban-laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Iligtas ninyo
  rationale: Pautos na maramihan mula sa פלט, na nananawagan ng aktibong pag-akay tungo sa kaligtasan; natural at mariin ang “iligtas” sa Filipino.
- source_word: דַל
  choice: ang dukha
  rationale: Maaaring tumukoy sa mahirap, mahina, o walang kapangyarihan. Sa konteksto ng katarungan at kaparis ng אֶבְיוֹן, malinaw na ipinahihiwatig ng “dukha” ang kahirapan at pagiging bulnerable.
- source_word: אֶבְיוֹן
  choice: nangangailangan
  rationale: Tumutukoy sa taong kapos o salat. Pinananatili ng “nangangailangan” ang kaibhan nito sa “dukha” at natural ang tambalan sa Filipino.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang malinaw na larawang Hebreo ng pagliligtas mula sa kapangyarihan o kontrol ng iba.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Pangngalang pangmaramihan para sa mga taong may sala at nang-aapi; likas sa Filipino at hindi nagdaragdag ng kasariang hindi tahasang nasa teksto.
- source_word: הַצִּילוּ
  choice: sagipin ninyo
  rationale: Pautos na maramihan mula sa נצל, para sa pag-agaw o pagliligtas mula sa panganib o mapaniil na kapangyarihan. Pinananatili ng “sagipin” ang ikalawang, kaugnay ngunit bukod na utos.
theological_decisions:
- issue: Pagpapanatili sa magkatulad na pautos ng tulang Hebreo
  choice: 'Dalawang magkaugnay na utos: “Iligtas ...; sagipin ...”'
  alternative: 'Pagsamahin sa iisang utos: “Iligtas ninyo ang dukha at nangangailangan mula sa kamay ng masasama.”'
  rationale: Dalawang pautos ang nasa Hebreo. Ang pagpapanatili sa dalawa ay naghahayag ng diin, ritmo, at kagyat na panawagang ipagtanggol ang mga bulnerable.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyo” upang malinaw na maipakita ang maramihang pautos, at pinanatili ang idyomang “mula sa kamay” dahil malinaw ito sa Filipino at tapat sa larawan ng pinagmulang teksto.
