  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: tl
  text: Sa mga kapulungan, purihin ninyo ang Diyos—si Yahweh—mula sa bukal ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eliptikal ang Hebreo: “mula sa bukal ng Israel.” Maaaring tumukoy ito sa mga sumasamba (o, “kayong nagmula sa bukal/pinagmulan ng Israel”); maaari rin itong iugnay sa naunang utos o sa Diyos na si Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: Sa mga kapulungan
  rationale: Ang pangngalan ay maramihan at tumutukoy sa mga pangkat na nagkakatipon. Pinananatili ng “mga kapulungan” ang bilang at hindi nito nililimitahan ang kahulugan sa isang institusyonal na kongregasyon.
- source_word: בָּרְכוּ
  choice: purihin ninyo
  rationale: Ito ay pautos na maramihan. Kapag Diyos ang layon ng ברך, ang likas na diwa sa makabagong Tagalog ay pagpupuri sa pagsamba; ang literal na “pagpalain ninyo ang Diyos” ay maaaring mapagkamalang paghiling na tumanggap siya ng biyaya.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Isahan ang tinutukoy rito, at kaagapay nito ang pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: מִמְּקוֹר
  choice: nagmula sa bukal
  rationale: Ang מָקוֹר ay “bukal” o “pinagmulan.” Pinananatili ng “bukal” ang larawang patula, habang ipinahihiwatig ng “nagmula” ang pinanggalingan ng mga sinasabihan; ipinapaliwanag sa talababa ang elipsis ng Hebreo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo sa Tagalog ng pangalang pantangi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang taglay ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan, samantalang kinikilala sa talababa ang tradisyonal na salin.
- issue: Ugnayan ng pariralang מִמְּקוֹר יִשְׂרָאֵל
  choice: 'Tumutukoy sa pinagmulan ng mga sumasamba: “kayong nagmula sa bukal ng Israel”'
  alternative: Isang nakabitin na pariralang “mula sa bukal ng Israel,” na maaaring iugnay sa naunang utos o sa Diyos/Yahweh
  rationale: Eliptikal ang Hebreo. Ang piniling pagbasa ay nagbibigay ng likas na Tagalog at umaayon sa karaniwang pag-unawa na ang mga sumasamba ay nagmula sa angkan o sambayanan ng Israel, ngunit hindi itinatago ang ibang posibleng pagkakaugnay.
translation_notes:
  register: Makabago, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “purihin” bilang likas na Tagalog kapag Diyos ang layon ng ברך. Ang mga gitling ay nagpapakitang ang “si Yahweh” ay kaagapay ng “ang Diyos,” at ang patulang “bukal ng Israel” ay pinanatili sa halip na gawing tahasang “angkan” sa pangunahing teksto.
