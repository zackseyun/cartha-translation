  text: For the choir director[a]. Of David. A psalm[b]. A song.
translation:
  language: tl
  text: Para sa tagapamahala ng musika.[a] Ukol kay David.[b] Isang salmo. Isang awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Para sa pinuno ng mga mang-aawit” o “Para sa tagapangasiwa ng awitan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ni David,” “Para kay David,” o “Nauukol kay David”; ang pang-ukol sa Hebreo sa mga pamagat ng salmo ay maaaring magpahiwatig ng pag-akda, pag-aalay, layunin, o kaugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapamahala ng musika
  rationale: Sa mga pamagat ng salmo, karaniwang tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Likas at malinaw ito sa makabagong Filipino nang hindi ipinapalagay na koro lamang ang pinamamahalaan.
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Malawak ang gamit ng pang-ukol na ל sa mga pamagat ng salmo. Pinananatili ng “Ukol kay David” ang maaaring kahulugang isinulat niya, inialay sa kaniya, para sa kaniya, o kaugnay niya.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang “salmo” ang karaniwan at natural na katawagan sa ganitong awiting panrelihiyon na may kaugnayan sa saliw ng musika.
- source_word: שִׁיר
  choice: Isang awit
  rationale: Tuwirang salin ito ng שִׁיר. Pinananatili ang parehong katawagang “salmo” at “awit” sa halip na pagsamahin ang mga ito.
theological_decisions:
- issue: Kaugnayan ni David sa salmo
  choice: Ukol kay David
  alternative: Ni David
  rationale: Hindi tiyak na pag-aakda lamang ang ipinahihiwatig ng Hebreong לְדָוִד; pinananatili ng salin ang tunay na lawak ng kahulugan nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tagapamahala ng musika” bilang malinaw at hindi labis na espesipikong katawagan; pinanatili ang maikli at pira-pirasong anyo ng pamagat sa Hebreo.
