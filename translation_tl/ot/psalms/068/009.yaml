lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: ulan nang sagana
  rationale: Ang גֶּשֶׁם ay ulan, at ang נְדָבוֹת sa tambalang ito ay nagpapahiwatig ng bukas-palad at masaganang kaloob. Likas sa modernong Tagalog ang pariralang “ulan nang sagana.”
- source_word: תָּנִיף
  choice: nagpaulan ka
  rationale: Ang hiphil ng נוּף ay may diwang pagpaypay o pagpapabagsak; kaugnay ng ulan, ipinahahayag nito na ang Diyos ang nagpadala o nagpaulan.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Pinananatili ang tuwirang pagtawag at marangal na himig ng tula.
- source_word: נַחֲלָתְךָ
  choice: iyong mana
  rationale: Ang “mana” ay tuwirang katumbas na hindi nagpapasya kung ang tinutukoy ay ang bayan, lupain, o kapwa nito.
- source_word: וְנִלְאָה
  choice: nang manghina
  rationale: Ipinahahayag ang kalagayan ng pagod, panghihina, o pagkaubos ng lakas. Ang “nang” ay likas na naghahayag ng ugnayang temporal sa Tagalog.
- source_word: כּוֹנַנְתָּהּ
  choice: pinatatag mo ito
  rationale: Ang כּון ay nangangahulugang magtatag, magpatibay, o mag-ayos. Ang “pinatatag” ay akma kapwa sa lupain at sa bayan at hindi nagpapakitid sa kahulugan.
theological_decisions:
- issue: Tinutukoy ng “iyong mana”
  choice: Pinanatiling “iyong mana” nang hindi tinutukoy kung bayan o lupain
  alternative: ang lupain ng Israel; ang bayan ng Israel; ang kabuuang pag-aari ng Diyos
  rationale: Maaaring saklawin ng Hebreong patula ang bayan, ang lupain, o kapwa nito. Pinananatili ng salin ang sadyang lawak at tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang patulang tuwirang pagtawag na “O Diyos” at ang malawak na kahulugan ng “mana.”
