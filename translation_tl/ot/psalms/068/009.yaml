  naturalness: Marangal at malinaw ang himig, ngunit mas likas at mas malinaw sa modernong Tagalog ang “Nagpadala ka ng masaganang ulan.” Ang tahasang “nang ang iyong mana ay nanghina” ay pinananatili ang temporal na ugnayan at iniiwasang magmukhang simpleng pagsisimula ng panghihina.
