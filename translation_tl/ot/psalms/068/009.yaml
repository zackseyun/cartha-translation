  text: Nagpadala ka ng masaganang ulan[a], O Diyos; nang ang iyong mana[b] ay nanghina, pinatatag mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ulan ng kagandahang-loob” o “ulan ng bukas-palad na kaloob.” Ang pariralang Hebreo ay idiomatiko at nagbibigay-diin sa bukas-palad na paglalaan ng Diyos.
