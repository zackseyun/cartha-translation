base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: tl
  text: Kung paanong tinatangay ang usok, gayon mo sila itinataboy[a]; kung paanong natutunaw ang pagkit sa harap ng apoy[b][c], gayon napapahamak ang masasama sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ikinakalat” o “itinataboy”; ang pandiwang Hebreo ay maaaring tumukoy sa pagtataboy, pagkakalat, o pagtangay.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa harap ng apoy” at “mula sa harap ng Diyos”; idyoma ito na maaaring tumukoy sa sanhi o sa presensiya ng isang bagay o persona.
    reason: lexical_alternative
  - marker: c
    text: Ang mga pandiwang Hebreo ay maaari ring unawaing panghinaharap (“itataboy ... mapapahamak”) o bilang paghiling sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Kung paanong tinatangay ang usok
  rationale: Ang כ plus infinitive construct ay nagpapakilala ng paghahambing. Likas sa Tagalog ang finite clause na “kung paanong tinatangay ang usok,” at napapanatili nito ang larawang ang usok ay itinataboy o ikinakalat.
- source_word: תִּנְדֹּף
  choice: gayon mo sila itinataboy
  rationale: Ang pandiwa ay Qal imperfect 2ms at tuwirang tumutukoy sa Diyos. Ang “sila” ay likas na ipinahihiwatig ng kasunod na “masasama,” samantalang pinananatili ng “itinataboy” ang ugnayang leksikal sa unang larawan.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: kung paanong natutunaw ang pagkit
  rationale: Muling naghahayag ng paghahambing ang כ plus infinitive construct. Ang “pagkit” ang karaniwang modernong Tagalog para sa wax, at natural ang “natutunaw” sa larawang ito.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: sa harap ng apoy
  rationale: Ang מִפְּנֵי ay literal na “mula sa harap/presensiya ng.” Pinananatili ng “sa harap ng apoy” ang pagkakatulad nito sa kasunod na pariralang tumutukoy sa Diyos, bagaman sa konteksto ay maaari rin itong mangahulugang dahil sa pagkakalantad sa apoy.
- source_word: יֹאבְדוּ
  choice: napapahamak
  rationale: Ang אבד ay maaaring mangahulugang mapahamak, mamatay, o maglaho. Ang “napapahamak” ay angkop sa makatang paghahambing at hindi labis na tinutukoy ang paraan ng kanilang wakas.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Ang substantibong pang-uri ay tumutukoy sa mga taong masama. Ang “ang masasama” ay maikli, malinaw, at karaniwan sa dignified na biblikal na Tagalog.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Pinananatili nito ang diwa ng pagkapahamak sa harap o presensiya ng Diyos at ang makatang pag-uulit ng מִפְּנֵי.
theological_decisions:
- issue: Lakas at panahon ng mga imperfect na pandiwa sa makatang konteksto
  choice: 'Kasalukuyang pangkalahatan: “itinataboy ... napapahamak”'
  alternative: Maaaring unawaing panghinaharap (“itataboy ... mapapahamak”) o paghiling (“itaboy mo sana ... mapahamak sana”).
  rationale: Maaaring magpahayag ang mga Hebrew imperfect ng hinaharap, nakagawiang/pangkalahatang kilos, o modal na paghiling. Pinananatili ng kasalukuyang pangkalahatan ang matingkad na paghahambing nang hindi ipinipilit na ito ay hula o sumpang panalangin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may bahagyang makatang ritmo. Ginamit ang “pagkit,” “itinataboy,” at “napapahamak” bilang pangkaraniwan ngunit dignified na mga salita. Pinanatili ang magkatulad na “sa harap ng” upang maaninag ang paralelismo ng Hebreo.
