base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: tl
  text: Kilalanin ninyo ang lakas ng Diyos[a]; ang kanyang kadakilaan ay nasa ibabaw ng Israel, at ang kanyang lakas ay nasa kalangitan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Ibigay ninyo sa Diyos ang lakas”; dito, ang “ibigay” ay isang patulang panawagan na kilalanin o ipahayag ang lakas ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa papawirin” o “sa mga ulap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Kilalanin ninyo
  rationale: Literal itong nangangahulugang “ibigay ninyo,” ngunit sa panawagang patula ay hinihimok ang mga sumasamba na kilalanin o ipahayag ang lakas ng Diyos, hindi na dagdagan ang lakas niya.
- source_word: עֹז
  choice: lakas
  rationale: Tuwirang ipinahahayag nito ang kapangyarihan o kalakasan at pinananatili ang pag-uulit sa dalawang bahagi ng talata.
- source_word: לֵאלֹהִים
  choice: ng Diyos
  rationale: Dahil sa likas na balangkas ng pandiwang “kilalanin” sa Filipino, ang Diyos ang maytaglay ng lakas na kinikilala; natural itong katumbas ng Hebreong pariralang tumutukoy sa Diyos bilang pinag-uukulan ng utos.
- source_word: עַל יִשְׂרָאֵל
  choice: nasa ibabaw ng Israel
  rationale: Pinananatili nito ang larawang spatial at ang posibleng diwa ng paghahari o pag-iral ng kadakilaan ng Diyos sa ibabaw ng Israel, nang hindi nilulutas nang labis ang saklaw ng pang-ukol.
- source_word: גַּאֲוָתוֹ
  choice: ang kanyang kadakilaan
  rationale: Sa konteksto ng pagpupuri sa Diyos, positibo itong tumutukoy sa kanyang maringal na kataasan, hindi sa mapanirang pagmamataas.
- source_word: וְעֻזּוֹ
  choice: at ang kanyang lakas
  rationale: Inuulit ang “lakas” upang mapanatili ang malinaw na ugnayang patula sa unang sugnay.
- source_word: בַּשְּׁחָקִים
  choice: nasa kalangitan
  rationale: Ang patulang salita ay maaaring tumukoy sa papawirin, mga ulap, o kalangitan. Natural at maringal ang “kalangitan” sa modernong Filipino habang pinananatili ang larawang kosmiko.
theological_decisions:
- issue: Kung ang utos ay nangangahulugang literal na nagbibigay ang tao ng lakas sa Diyos
  choice: Isinalin bilang “Kilalanin ninyo ang lakas ng Diyos”
  alternative: “Ibigay ninyo ang lakas sa Diyos”
  rationale: Ang literal na “ibigay” ay maaaring magpahiwatig sa Filipino na kulang ang Diyos at ang tao ang nagdaragdag ng lakas sa kanya. Sa kontekstong patula, ito ay panawagang kilalanin at ipahayag ang lakas na taglay na niya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kilalanin ninyo” bilang natural na pagpapahayag ng Hebreong idyoma, at pinanatili ang pag-uulit ng “lakas” at ang mataas na larawang patula ng talata.
