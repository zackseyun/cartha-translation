base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: tl
  text: 'Umakyat ka sa kaitaasan;


    Nagbihag ka ng mga bihag.


    Tumanggap ka ng mga kaloob sa gitna ng mga tao[a],


    maging sa mga mapaghimagsik,


    upang manahan doon ang Diyos na si Yah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga tao.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang kinaroroonan o ang pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: O “upang manahan ang Diyos na si Yah sa gitna nila”; o “bilang tahanan ng Diyos na si Yah.” Siksik ang pangwakas na sugnay sa Hebreo at maaaring unawain sa higit sa isang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ
  choice: Umakyat ka
  rationale: Tuwirang isinasalin ang Qal perfect 2ms ng עלה at pinananatili ang larawang patayong pag-akyat sa matagumpay na konteksto.
- source_word: לַמָּרוֹם
  choice: sa kaitaasan
  rationale: Ang מָרוֹם ay taas o mataas na dako. Likas at marangal sa makabagong Tagalog ang “sa kaitaasan” nang hindi labis na tinutukoy ang lokasyon.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: nagdala ka ng mga bihag
  rationale: Ipinahihiwatig ng magkaugnay na pandiwa at layon ang ganap na tagumpay at pagdadala ng mga nabihag. Mas natural ito sa Tagalog kaysa sa literal ngunit malabong “binihag mo ang pagkabihag.”
- source_word: לָקַחְתָּ
  choice: Tumanggap ka
  rationale: Bagaman karaniwang nangangahulugang “kumuha,” ang pandiwa kasama ng “mga kaloob” ay likas na maunawaan bilang pagtanggap ng handog o parangal ng matagumpay na hari.
- source_word: מַתָּנוֹת
  choice: mga kaloob
  rationale: Tuwirang katumbas ng mga regalo o handog; hindi nito ipinapasok sa pangunahing teksto ang mas interpretibong diwang “buwis” o “tributo.”
- source_word: בָּאָדָם
  choice: sa gitna ng mga tao
  rationale: Maaaring tukuyin ng ב ang saklaw o kapaligiran, samantalang ang אָדָם ay sangkatauhan o mga tao. Inilalagay sa talababa ang posibleng diwang pinagmulan na “mula sa mga tao.”
- source_word: וְאַף סוֹרְרִים
  choice: maging sa mga mapaghimagsik
  rationale: Ipinapanatili ng “maging” ang diin ng וְאַף, at ng “mga mapaghimagsik” ang patuloy na paglaban na ipinahihiwatig ng participle.
- source_word: לִשְׁכֹּן
  choice: upang manahan
  rationale: Ipinapakita ang malamang na layunin o bunga ng infinitive na may ל, habang pinananatiling maikli ang sugnay.
- source_word: יָהּ אֱלֹהִים
  choice: ang Diyos na si Yah
  rationale: Pinananatili ng “Yah” ang maikling anyo ng banal na pangalan, at malinaw na isinasalin ng “Diyos” ang אֱלֹהִים sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Direksiyon at kahulugan ng בָּאָדָם sa sugnay tungkol sa mga kaloob
  choice: sa gitna ng mga tao
  alternative: mula sa mga tao
  rationale: Mahirap tiyakin kung ang pang-ukol ay tumutukoy sa saklaw o sa pinagmulan. Pinipili ng pangunahing teksto ang hindi gaanong interpretibong pagbasa, ngunit tahasang pinananatili sa talababa ang mahalagang alternatibo.
- issue: Sintaks at tinutukoy ng pangwakas na לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: upang manahan doon ang Diyos na si Yah
  alternative: upang manahan ang Diyos na si Yah sa gitna nila; o bilang tahanan ng Diyos na si Yah
  rationale: Siksik at eliptikal ang Hebreo. Ang “doon” ay nagbibigay ng maayos na Tagalog nang hindi tiyakang ipinapasiya kung lugar o pangkat ng mga tao ang tinutukoy. Pinananatili sa talababa ang iba pang makatuwirang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na wikang patula. Gumagamit ng maiikling linyang angkop sa awit, karaniwang bokabularyo, at natural na ayos ng Tagalog. Pinananatili ang pangalang “Yah” bilang maikling anyo ng banal na pangalan at hindi nilulutas nang tahimik ang mga sintaktikong kalabuan.
