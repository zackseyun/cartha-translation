  naturalness: Likas at marangal ang karamihan ng salin. Mas natural at mas tumpak ang “sa bundok” kasunod ng “tumitingin nang may inggit” kaysa “sa harap ng bundok,” na maaaring magpahiwatig lamang ng pisikal na posisyon.
  terminology: Tama ang “Diyos,” “Yahweh,” “hinangad,” at “magpakailanman.” Ang “bilang tahanan niya” ay malinaw na pagpapahayag ng layuning nasa לְשִׁבְתּוֹ nang hindi nagdaragdag ng pangalan ng bundok.
