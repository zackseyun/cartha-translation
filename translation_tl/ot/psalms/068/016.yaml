base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: tl
  text: Bakit kayo tumitingin nang may inggit, kayong mga bundok na maraming taluktok, sa bundok na hinangad ng Diyos bilang tahanan niya? Tunay ngang mananahan doon si Yahweh magpakailanman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: naglulundag
  rationale: Bihira at hindi tiyak ang pandiwa. Pinananatili ng “naglulundag” ang posibleng larawang-kilos ng Hebreo at ang retorikal na personipikasyon ng mga bundok; inilalahad sa talababa ang posibleng diwang pagtingin nang may inggit o pagalit.
- source_word: הָרִים גַּבְנֻנִּים
  choice: mga bundok na maraming taluktok
  rationale: Ipinahihiwatig ng parirala ang mga bundok na maraming nakausling gulod o taluktok. Malinaw at likas ito sa makabagong Filipino nang hindi pinapantay lamang sa “matataas na bundok.”
- source_word: הָהָר
  choice: ang bundok
  rationale: Tiyak ang tinutukoy na bundok sa konteksto, ngunit hindi ito tahasang pinangalanang Zion sa talata, kaya hindi idinagdag ang pangalang iyon.
- source_word: חָמַד
  choice: hinangad
  rationale: Malapit ito sa diwa ng pagnanais o pagkagiliw sa Hebreo at hindi nito tahasang pinapalitan ang pandiwa ng mas interpretatibong “pinili.”
- source_word: לְשִׁבְתּוֹ
  choice: na maging tahanan niya
  rationale: 'Natural na ipinapahayag sa Filipino ang layunin: ang bundok ay hinangad ng Diyos bilang lugar ng kanyang pananahan.'
- source_word: אַף
  choice: Tunay nga
  rationale: Ipinahahayag nito ang mariing pagpapatibay ng kasunod na pahayag, sa halip na ang simpleng diwang pandagdag na “din.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: mananahan doon ... magpakailanman
  rationale: Ang שׁכן ay tumutukoy sa paninirahan o pananahan; ang “doon” ay likas na ipinahihiwatig ng konteksto, at ang לָנֶצַח ay nangangahulugang walang hanggan o magpakailanman.
theological_decisions:
- issue: Kung tahasang tatawaging Zion ang bundok
  choice: Panatilihin ang “ang bundok” sa pangunahing teksto
  alternative: “Bundok Zion”
  rationale: Bagaman itinuturo ng mas malawak na konteksto ang Zion, karaniwang pangngalang may pantukoy lamang ang ginamit sa talatang ito. Pinananatili ng salin ang antas ng katiyakan ng Hebreo.
- issue: Kung paano ihahayag ang kilos o saloobin ng mga karibal na bundok
  choice: Gamitin ang larawang-kilos na “naglulundag” at itala ang ibang posibilidad sa talababa
  alternative: “tumitingin nang may inggit” o “tumitingin nang masama”
  rationale: Hindi tiyak ang bihirang pandiwa. Pinananatili sa pangunahing teksto ang posibleng kongkretong larawan habang hindi ikinukubli sa talababa ang posibleng adversatibong kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang tuwirang pakikipag-usap sa mga bundok at pinanatili ang matulaing personipikasyon. Ang “sa harap ng” ay nagpapahayag ng pagharap o pagtutol sa piniling bundok nang hindi ipinapalagay na literal na pagtalon papunta rito.
