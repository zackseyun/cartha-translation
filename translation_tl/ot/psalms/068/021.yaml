id: PSA.68.21
reference: Psalms 68:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: tl
  text: Tiyak na dudurugin ng Diyos ang ulo ng kanyang mga kaaway, ang mabuhok na tuktok ng ulo ng taong patuloy na lumalakad sa kanyang pagkakasala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang mabuhok na bungo ng taong patuloy sa kanyang mga pagsalangsang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ginamit bilang mariing pagpapatunay, hindi bilang pan限定 na “lamang”; natural na ipinahahayag ng “Tiyak na” ang katiyakan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo ng pangngalan, isahan ang pandiwa at ang tinutukoy ay ang Diyos ng Israel.
- source_word: יִמְחַץ
  choice: dudurugin
  rationale: Pinananatili ang marahas at malinaw na larawan ng pagdurog bilang hatol.
- source_word: רֹאשׁ אֹיְבָיו
  choice: ang ulo ng kanyang mga kaaway
  rationale: Pinananatili ang konkretong larawang “ulo” at ang maramihang “mga kaaway”; pinakamalapit na tumutukoy sa Diyos ang hulaping panghalip.
- source_word: קָדְקֹד שֵׂעָר
  choice: ang mabuhok na tuktok ng ulo
  rationale: Ang קָדְקֹד ay tuktok o korona ng ulo, at inilalarawan ito ng שֵׂעָר bilang mabuhok. Mas malinaw sa karaniwang Filipino ang “tuktok ng ulo” kaysa “korona.”
- source_word: מִתְהַלֵּךְ
  choice: patuloy na lumalakad
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy o nakaugaliang asal; pinananatili rin ang biblikal na metapora ng paglakad.
- source_word: בַּאֲשָׁמָיו
  choice: sa kanyang pagkakasala
  rationale: Maaaring tumukoy sa pananagutan, kasalanan, o mga salang nagawa. Pinananatili ng isahang “pagkakasala” ang leksikal na lawak nang hindi sapilitang ginagawang maramihang gawa.
theological_decisions:
- issue: Tinutukoy ng panghalip sa “kanyang mga kaaway”
  choice: Ang “kanyang” ay tumutukoy sa Diyos.
  alternative: Maaaring unawain nang mas pangkalahatan bilang mga kaaway ng banal na hari o ng bayan ng Diyos.
  rationale: Ang Diyos ang agarang simuno ng pandiwang isahan, kaya siya ang pinakanatural na pinagmumulan ng panghalip, nang hindi nagpapasok ng mas makitid na pambansa o mesiyanikong pagtukoy.
- issue: Kahulugan ng בַּאֲשָׁמָיו
  choice: “sa kanyang pagkakasala,” na kaakibat ng nagpapatuloy na pamumuhay
  alternative: “sa kanyang mga pagsalangsang” o “sa kanyang mga gawang may sala”
  rationale: Pinananatili ang posibilidad na ito ay kalagayan ng pagkakasala o mga salang kinagawian, habang ipinahihiwatig ng “patuloy na lumalakad” ang nagpapatuloy na asal.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang matingkad na paralelismo ng “ulo” at “tuktok ng ulo,” pati ang metaporang moral ng paglakad. Inilagay ang talababa matapos ang buong magkasingkahulugang ikalawang parirala upang malinaw na saklaw nito ang mga alternatibo sa קָדְקֹד at בַּאֲשָׁמָיו.
