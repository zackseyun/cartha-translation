  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: tl
  text: Nang ikalat ng Makapangyarihan sa Lahat ang mga hari roon[a], umulan ng niyebe sa Zalmon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kaniya/sa loob niyon”; hindi tiyak ang tinutukoy.
    reason: Pinananatili ang tunay na kalabuan ng pambabaeng panghalip בָּהּ.
  - marker: b
    text: 'O maaaring: “Naging maputi na parang niyebe ang Zalmon.”'
    reason: Itinatala ang posibleng matalinghagang pagbasa ng pambihirang pahayag nang hindi pinapalitan ang literal na salin sa pangunahing teksto.
lexical_decisions:
- source_word: בְּפָרֵשׂ
  choice: Nang pangalatin
  rationale: Ipinahahayag ng infinitibong may בְּ ang panahong kasabay ng pagkilos; ang פָרֵשׂ ay likas na isinasaling “pangalatin” sa konteksto ng pagpapaalis o pagkakawatak-watak sa mga hari.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan
  rationale: Karaniwang marangal at madaling maunawaang salin ng banal na titulong Shaddai, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: בָּהּ
  choice: roon
  rationale: Pinananatili ang deiktikong diwa ng “doon/sa loob niyon” at iniiwasang piliting tukuyin ang malabong pambabaeng reperente.
- source_word: תַּשְׁלֵג
  choice: umulan ng niyebe
  rationale: Natural na impersonal na Filipino para sa pandiwang tumutukoy sa pag-ulan o paglitaw ng niyebe; ang posibleng matalinghagang pagbasa ay inilagay sa talababa.
- source_word: בְּצַלְמוֹן
  choice: sa Zalmon
  rationale: Transliterasyon ng pangalang-pook; pinananatili ang pang-ukol na “sa.”
theological_decisions:
- issue: Ang reperente ng pambabaeng panghalip sa בָּהּ
  choice: Isinalin bilang “roon” at nilagyan ng talababa.
  alternative: “sa lupain” o “sa kaniya/rito”
  rationale: Hindi malinaw sa mismong talata kung ano ang tiyak na tinutukoy; hindi dapat tahimik na magpasok ng isang reperente.
- issue: Literal o matalinghagang kahulugan ng pagniyebe
  choice: Pinanatili sa pangunahing teksto ang literal na “umulan ng niyebe.”
  alternative: “naging maputi na parang niyebe”
  rationale: Ang literal na kahulugan ang pinakasimple at kapantay ng anyong Hebreo, ngunit kinikilala sa talababa ang posibleng matalinghagang larawan nang hindi ito ipinipilit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pangalatin” at “umulan ng niyebe” bilang natural na pananalita, habang pinanatili sa mga talababa ang dalawang mahalagang kalabuan ng Hebreo.
