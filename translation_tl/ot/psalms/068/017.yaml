  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: tl
  text: 'Ang mga karwahe ng Diyos ay sampu-sampung libo,

    libu-libong libo[a];

    ang Panginoon ay kasama nila—

    Sinai, sa kabanalan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “libu-libo ng shin'an.” Bihira at hindi tiyak ang salitang shin'an; malamang na ipinahihiwatig nito ang pag-uulit o napakaraming bilang.
    reason: lexical_alternative
  - marker: b
    text: 'Napakaikli at mahirap unawain ng Hebreo. Maaari ring isalin: “ang Panginoon ay kasama nila gaya sa Sinai, sa banal na lugar,” o “ang Panginoon ay dumating mula sa Sinai patungo sa santuwaryo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: ang mga karwahe ng Diyos
  rationale: Ang רֶכֶב ay maaaring tumukoy nang kolektibo sa mga karwahe o hukbo ng mga karwahe. Pinananatili ng salin ang konkretong larawang patula at ang likas na ugnayang paari sa אֱלֹהִים.
- source_word: רִבֹּתַיִם
  choice: sampu-sampung libo
  rationale: Bagaman maaaring unawain ang anyong dual bilang dalawang laksa, gumaganap ito rito bilang matayog na pahayag ng napakalaking bilang. Mas madaling maunawaan sa makabagong Filipino ang “sampu-sampung libo” kaysa “laksa-laksa.”
- source_word: אַלְפֵי שִׁנְאָן
  choice: libu-libong di-mabilang
  rationale: Bihira at hindi tiyak ang שִׁנְאָן. Malamang na ipinahihiwatig nito ang pag-uulit o pagdami; ipinapahayag ng “di-mabilang” ang malamang na diwa nang hindi ginagawang eksaktong bilang ang parirala.
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Karaniwang makabagong salin sa Filipino ng banal na titulong אֲדֹנָי, na nagpapanatili sa diwa ng kapamahalaan.
- source_word: בָם
  choice: kasama nila
  rationale: Maaaring mangahulugan ang בָם na “nasa kanila,” “kasama nila,” o “sa gitna nila.” Likas sa Filipino ang “kasama nila” at hindi nito labis na tinutukoy ang eksaktong spatial na ugnayan.
- source_word: סִינַי
  choice: Sinai
  rationale: Pinananatili ang nakaugaliang anyo ng pangalan ng lugar sa Filipino.
- source_word: בַּקֹּדֶשׁ
  choice: sa kabanalan
  rationale: Maaaring tumukoy ang קֹדֶשׁ sa kabanalan bilang katangian o sa banal na lugar/santuwaryo. Pinananatili ng “sa kabanalan” ang abstraktong posibilidad at iniiwasang tahasang gawing lokasyon ang salita.
theological_decisions:
- issue: Pag-unawa sa pinaikli at mahirap na sugnay na אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: ang Panginoon ay kasama nila—Sinai, sa kabanalan
  alternative: ang Panginoon ay kasama nila gaya sa Sinai, sa banal na lugar; o, ang Panginoon ay dumating mula sa Sinai patungo sa santuwaryo
  rationale: Walang katumbas sa Hebreo ang tahasang “gaya” o pandiwang “dumating.” Kaya pinananatili sa pangunahing teksto ang maigsi at patulang pagkakadugtong ng mga salita, habang inilalahad sa talababa ang mga pangunahing posibleng pagbasa. Hindi nito tahimik na nilulutas ang tunay na sintaktiko at teolohikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may patulang paghahati ng mga linya. Ginamit ang “sampu-sampung libo” sa halip na “laksa-laksa” para sa mas malawak na pagkaunawa. Sadyang pinanatiling maigsi ang huling linya upang hindi ikubli ang tunay na kalabuan ng Hebreo; nililinaw ng talababa ang mga posibleng pagbasa.
