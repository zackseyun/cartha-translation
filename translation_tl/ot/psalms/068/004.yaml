  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: tl
  text: Umawit kayo sa Diyos; umawit kayo ng papuri sa kanyang pangalan. Ihanda ninyo ang daan[a] para sa nakasakay sa mga kapatagan ng ilang[b]. Yah ang kanyang pangalan; magbunyi kayo sa harap niya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pandiwa ay maaaring mangahulugang “tambakan” o “ihanda” ang isang lansangan. Maaaring ipinahihiwatig nito ang paghahanda ng daan para sa Diyos.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa mga ulap.” Ang salitang Hebreo ay karaniwang tumutukoy sa mga tigang na kapatagan o ilang, ngunit maaari itong unawain dito bilang larawan ng Diyos na nakasakay sa mga ulap.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Umawit kayo sa Diyos
  rationale: Pinananatili ang tuwirang maramihang pautos at malinaw na tumutukoy ang אֱלֹהִים sa Diyos ng Israel sa kontekstong ito.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: umawit kayo ng papuri sa kanyang pangalan
  rationale: Ang זמר sa ganitong konteksto ay pag-awit o pagtugtog bilang papuri; natural sa Filipino ang 'umawit ng papuri' at napananatili ang 'kanyang pangalan.'
- source_word: סֹלּוּ
  choice: Ihanda ninyo ang daan
  rationale: Karaniwang ipinahihiwatig ng סלל ang paggawa, pagtataas, o paghahanda ng lansangan. Ipinahayag ang di-binanggit na 'daan' upang maging malinaw sa Filipino, habang inilalagay sa talababa ang literal na larawan at posibleng alternatibong pagbasa.
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: para sa kanya na nakasakay sa mga kapatagan ng ilang
  rationale: Pinananatili ang participyal na larawan ng banal na nakasakay. Ang עֲרָבוֹת ay pangunahing binasa bilang tigang at malalawak na kapatagan, nang hindi isinasara ang kilalang alternatibong 'mga ulap.'
- source_word: בְּיָהּ שְׁמוֹ
  choice: Yah ang kanyang pangalan
  rationale: Ang יָהּ ay maikling anyo ng banal na pangalan, kaya isinalin ito bilang transliteradong pangalang 'Yah' sa halip na palitan ng isang titulo.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: magbunyi kayo sa harap niya
  rationale: Ipinahahayag ng עלז ang masigla at matagumpay na kagalakan; likas at marangal sa Filipino ang 'magbunyi.'
theological_decisions:
- issue: Paglilipat ng maikling banal na pangalang יָהּ
  choice: Yah
  alternative: ang PANGINOON
  rationale: Tiyak na maikling anyo ng personal na banal na pangalan ang nasa tekstong Hebreo, hindi ang buong tetragrammaton; pinananatili ng 'Yah' ang pagkakaibang ito nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Larawan ng banal na nakasakay sa עֲרָבוֹת
  choice: nakasakay sa mga kapatagan ng ilang
  alternative: nakasakay sa mga ulap
  rationale: Mas tuwiran ang leksikal na kahulugang tigang na kapatagan o ilang at umaangkop ito sa motibo ng paglalakbay sa ilang sa salmo. Gayunman, tunay na makabuluhan ang teopanikong pagbasa na 'mga ulap,' kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa panambahan ngunit madaling maunawaan. Ginamit ang maramihang 'kayo' para sa mga pautos, ang natural na 'magbunyi' para sa masidhing kagalakan, at ang 'Yah' upang mapanatili ang natatanging anyo ng banal na pangalan. Ang mga talababa ay inilagay kaagad sa mga salitang tunay na tinutukoy ng mga ito.
