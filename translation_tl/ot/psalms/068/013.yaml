  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: tl
  text: Kahit mahiga kayo sa gitna ng mga kulungan ng tupa,[a] ang mga pakpak ng isang kalapati ay nababalutan ng pilak, at ang mga balahibo sa pakpak nito ay nababalutan ng dilaw na ginto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagitan ng mga sisidlan sa magkabilang tagiliran ng hayop” o “sa pagitan ng mga batong apuyan”; hindi tiyak ang kahulugan ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na salin, “ng berdeng-dilaw na ginto” o “na may berdeng-dilaw na kintab ng ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kahit
  rationale: Sa patulang konteksto, maaaring may diwang pasubali o konsesibo ang אִם. Pinananatili ng “Kahit” ang malamang na konsesibong diwa nang hindi dinaragdagan ang larawan.
- source_word: תִּשְׁכְּבוּן
  choice: mahiga kayo
  rationale: Ang pandiwang שׁכב ay tumutukoy sa paghiga. Ang “mahiga kayo” ay likas sa modernong Tagalog pagkatapos ng “Kahit” at pinananatili ang pisikal na larawan.
- source_word: בֵּין שְׁפַתָּיִם
  choice: sa gitna ng mga kulungan ng tupa
  rationale: Lubhang pinagtatalunan ang kahulugan ng שְׁפַתָּיִם. Ginamit sa pangunahing teksto ang tradisyonal na “mga kulungan ng tupa,” habang inilalahad sa talababa ang mahahalagang alternatibo upang hindi maitago ang katiyakan ng Hebreo.
- source_word: כַּנְפֵי יוֹנָה
  choice: ang mga pakpak ng isang kalapati
  rationale: Tuwirang isinasalin ang construct chain at malinaw na pinananatili ang larawang patula.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: ay nababalutan ng pilak
  rationale: Ipinahihiwatig ng חפה ang pagkatakip o pagkabalot. Likas at malinaw ang “nababalutan ng pilak” sa Tagalog.
- source_word: אֶבְרוֹתֶיהָ
  choice: ang mga balahibo ng mga pakpak nito
  rationale: Mas tiyak ang אברה kaysa sa pangkalahatang “mga balahibo”; malinaw sa karaniwang mambabasa ang pariralang “mga balahibo ng mga pakpak.” Ginamit ang “nito” upang maiwasan ang di-likas na paglalapat ng kasariang pambalarila sa kalapati.
- source_word: בִּירַקְרַק חָרוּץ
  choice: ng manilaw-nilaw na ginto
  rationale: Ang חָרוּץ ay maaaring tumukoy sa ginto, at ang יְרַקְרַק ay may kulay na nasa dilaw-berdeng hanay. Ipinahahayag ng “manilaw-nilaw na ginto” ang pangunahing kulay sa likas na Tagalog; pinananatili sa talababa ang mas literal na berdeng-dilaw na nuance.
