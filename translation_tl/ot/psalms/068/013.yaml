  naturalness: Likas ang karamihan ng salin, ngunit hindi ganap na maayos ang “ang mga balahibo ng mga pakpak nito ay ng ...” bilang pangungusap sa modernong Tagalog. Ang pag-uulit ng pandiwang “nababalutan” ay nililinaw ang paralelismo nang hindi dinaragdagan ang kahulugan.
  terminology: Ang “mga kulungan ng tupa” ay katanggap-tanggap na tradisyonal na pangunahing pagbasa, basta nananatili ang talababa. Ang “mga balahibo sa pakpak” ay mas likas na modernong Tagalog para sa pinions/wing-feathers. “Dilaw na ginto” ang tuwirang katumbas ng pangunahing pagbasa; pinananatili ng talababa ang berdeng-dilaw na nuwansa.
