revisions:
- from: Kahit mahiga kayo sa gitna ng mga kulungan ng tupa,[a] ang mga pakpak ng isang kalapati ay nababalutan ng pilak, at ang mga balahibo ng mga pakpak nito ay ng manilaw-nilaw na ginto.[b]
  to: Kahit mahiga kayo sa gitna ng mga kulungan ng tupa,[a] ang mga pakpak ng isang kalapati ay nababalutan ng pilak, at ang mga balahibo sa pakpak nito ay nababalutan ng dilaw na ginto.[b]
  rationale: Inayos ang ikalawang sugnay upang maging ganap at idiomatiko sa modernong Filipino Tagalog, habang pinananatili ang Hebreong paralelismo sa pamamagitan ng pag-uulit ng ipinahihiwatig na pandiwang “nababalutan.” Pinalitan ang “manilaw-nilaw na ginto” ng “dilaw na ginto” upang tumugma sa pangunahing pagbasa, nang hindi inaalis ang mas literal at pinagtatalunang kulay sa talababa.
