    text: O, “sa ibabaw ng Jerusalem.”
    reason: syntactical_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: Dahil sa iyong templo
  rationale: Maaaring magpahiwatig ang מִן ng pinagmulan o sanhi. Sa ugnayan ng buong pangungusap, natural sa Filipino ang panlahing “Dahil sa,” habang inilalagay sa talababa ang mas literal na diwang “Mula sa.”
- source_word: עַל יְרוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Bagaman karaniwang may diwang “sa ibabaw ng” ang עַל, maaari rin itong magsaad ng kinalalagyan. Ang “sa Jerusalem” ay malinaw at natural, samantalang pinananatili sa talababa ang mas tahasang panlugar na pagbasa.
- source_word: לְךָ
  choice: sa iyo
  rationale: Tinutukoy ng panghalip na datibo ang tatanggap ng handog.
- source_word: יוֹבִילוּ
  choice: magdadala
  rationale: Ang Hiphil ng יבל ay nangangahulugang magdala o maghatid; “magdadala” ang pinakanatural kasama ng handog.
- source_word: מְלָכִים
  choice: mga hari
  rationale: Tuwirang pinananatili nito ang maharlikang larawan ng tekstong Hebreo.
- source_word: שַׁי
  choice: handog
  rationale: Ang שַׁי ay kaloob o handog na maaaring ibigay bilang tributo sa isang nakatataas. Mas karaniwan at malinaw sa modernong Filipino ang “handog,” habang nasa talababa ang “tributo.”
theological_decisions:
- issue: Ugnayang sintaktiko ng templo, Jerusalem, at pagdadala ng mga hari
  choice: Binasa ang מִן bilang sanhi (“Dahil sa”) at ang עַל bilang pananda ng kinalalagyan (“sa Jerusalem”).
  alternative: “Mula sa iyong templo sa ibabaw ng Jerusalem”
  rationale: Kapwa posible sa Hebreo ang sanhi at panlahing pagbasa ng מִן, gayundin ang “sa” at “sa ibabaw ng” para sa עַל. Pinili sa pangunahing teksto ang natural na Filipino nang hindi itinatago ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “templo,” “mga hari,” at “handog” bilang mga salitang madaling maunawaan ngunit angkop sa panulaan ng Mga Awit. Inilagay kaagad pagkatapos ng kaugnay na parirala ang lahat ng pananda ng talababa.
