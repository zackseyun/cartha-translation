  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: tl
  text: Dahil sa iyong templo sa Jerusalem[a][c], magdadala sa iyo ang mga hari ng handog[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mula sa iyong templo sa Jerusalem, magdadala sa iyo ang mga hari ng mga kaloob.”
    reason: alternative_reading
  - marker: b
    text: Ang “handog” ay maaari ding isaling “kaloob” o “tributo.”
