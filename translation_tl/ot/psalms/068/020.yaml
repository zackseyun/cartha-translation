  text: הָ֤/אֵ֣ל לָ/נוּ֮ אֵ֤ל לְֽ/מוֹשָׁ֫ע֥וֹת וְ/לֵ/יהוִ֥ה אֲדֹנָ֑/י לַ֝/מָּ֗וֶת תּוֹצָאֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/020.yaml
  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: tl
  text: Ang Diyos ay para sa atin—isang Diyos ng mga pagliligtas[a]; at sa Panginoong Yahweh nagmumula ang mga daan upang makatakas sa kamatayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang Diyos ng mga pagligtas.” Ang maramihang anyo sa Hebreo ay maaaring magdiin sa paulit-ulit o sari-saring gawa ng pagliligtas.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga labasan mula sa kamatayan.” Tumutukoy ito sa mga daan o paraan upang makatakas sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Ang Diyos
  rationale: Tinutukoy ng may-tiyak na anyong Hebreo ang Diyos mismo; likas at malinaw sa Tagalog ang “Ang Diyos.”
- source_word: לָנוּ
  choice: para sa atin
  rationale: Ipinahihiwatig ng ל ang kaugnayan at kabutihang ukol sa bayan; mas likas sa modernong Tagalog ang “para sa atin” kaysa “sa atin” sa pangungusap na ito.
- source_word: אֵל לְמוֹשָׁעוֹת
  choice: isang Diyos ng mga pagliligtas
  rationale: Pinananatili ang pag-uulit ng “Diyos” at ang maramihang anyo ng מוֹשָׁעוֹת, na maaaring tumukoy sa paulit-ulit o sari-saring gawa ng pagliligtas.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: at sa Panginoong Yahweh
  rationale: Kapuwa pinananatili ang titulong אֲדֹנָי at ang pangalang יהוה. Likas sa Tagalog ang pagkakaugnay na “Panginoong Yahweh.”
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: ang mga daan upang makatakas sa kamatayan
  rationale: Ang תּוֹצָאוֹת ay literal na mga labasan o paglabas; sa kaugnayan nito sa kamatayan, malinaw na ipinahahayag ng parirala ang mga paraan ng pagtakas mula rito habang pinananatili ang maramihang diwa.
theological_decisions:
- issue: Paglalahad sa יהוה kapag kasama ang אֲדֹנָי
  choice: Panginoong Yahweh
  alternative: Panginoong DIOS
  rationale: Inilalahad ang personal na pangalang יהוה bilang “Yahweh” at ang אֲדֹנָי bilang “Panginoon,” kaya hindi napapawi ang alinmang elemento ng tekstong Hebreo.
- issue: Maramihang anyo ng מוֹשָׁעוֹת
  choice: mga pagliligtas
  alternative: kaligtasan
  rationale: Hindi ginagawang isahan o abstraktong doktrinal na termino ang sadyang maramihang anyo; maaari itong magpahiwatig ng paulit-ulit o sari-saring pagliligtas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang pag-uulit at mga maramihang anyo ng Hebreo, ngunit ginawang likas ang huling parirala sa Tagalog.
