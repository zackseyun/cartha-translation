  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: tl
  text: Nayanig ang lupa; pati ang langit ay pumatak sa harap ng Diyos—itong Sinai—sa harap ng Diyos, ang Diyos ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: nayanig
  rationale: Tuwirang inilalarawan ang malakas na paggalaw ng lupa at natural sa makabagong Tagalog.
- source_word: נָטְפוּ
  choice: pumatak
  rationale: Pinananatili ang konkretong larawang ‘tumulo/pumatak’ ng Hebreo nang hindi agad ipinapakahulugang ulan.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Pinananatili ang literal at marangal na pahayag ng presensiya ng Diyos na sanhi ng pagyanig at pagpapatak.
- source_word: זֶה סִינַי
  choice: itong Sinai
  rationale: Pinananatili ang maikli at bahagyang di-tiyak na pariralang Hebreo, sa halip na dagdagan ng paliwanag gaya ng ‘ang Sinai mismo.’
theological_decisions:
- issue: Ugnayan ng pariralang זֶה סִינַי sa nakapaligid na pangungusap
  choice: —itong Sinai—
  alternative: —ang Sinai mismo— / maging ang Sinai
  rationale: Hindi tahasang nilulutas kung ang Sinai ang tinutukoy na nanginginig, isang deiktikong pagtukoy, o bahagi ng makatang paggunita; pinananatili ang tensiyon at kaiklian ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog; pinanatili ang matitingkad at konkretong larawang patula ng Hebreo at ang inuulit na ‘sa harap ng Diyos.’
