  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: tl
  text: Ngunit magagalak ang mga matuwid[a]; magbubunyi sila sa harap ng Diyos[b], at magsasaya sila nang buong galak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At magagalak ang mga matuwid.” Maaari ring isalin ang pang-ugnay sa Hebreo bilang payak na “at”; ipinahahayag ng “ngunit” sa pangunahing teksto ang pagsalungat sa naunang talata.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “sa harap ng Diyos,” ibig sabihin, sa presensiya ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: Ngunit … ang mga matuwid
  rationale: Ang צַדִּיקִים ay tumutukoy sa mga taong matuwid. Ipinahahayag ng “ngunit” ang pagsalungat sa sinapit ng masasama sa naunang talata, bagaman maaari ring payak na “at” ang וְ.
- source_word: יִשְׂמְחוּ
  choice: magagalak
  rationale: Ang שׂמח ay nagpapahayag ng galak. Pinananatili ng “magagalak” ang pagkakaiba nito sa dalawa pang pandiwa ng pagsasaya sa talata.
- source_word: יַעַלְצוּ
  choice: magbubunyi
  rationale: Ang עלץ ay tumutukoy sa masigla at matinding pagsasaya; likas na naihahayag ito ng “magbubunyi” sa makatang Filipino.
- source_word: לִפְנֵי אֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Tuwirang pinananatili nito ang diwang “sa harap/presensiya ng Diyos” nang malinaw at natural sa Filipino.
- source_word: וְיָשִׂישׂוּ
  choice: at magsasaya sila
  rationale: Ang שׂוש ay nangangahulugang magsaya o magalak. Ang “magsasaya” ay malinaw at naihihiwalay sa “magagalak” at “magbubunyi.”
- source_word: בְשִׂמְחָה
  choice: nang buong galak
  rationale: Ipinakikita nito ang paraan at tindi ng pagsasaya. Natural sa Filipino ang “nang buong galak” at napapanatili nito ang mariing pagtitipon ng mga salitang tumutukoy sa kagalakan.
