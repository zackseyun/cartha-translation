  text: אָמַ֣ר אֲ֭דֹנָ/י מִ/בָּשָׁ֣ן אָשִׁ֑יב אָ֝שִׁ֗יב מִֽ/מְּצֻל֥וֹת יָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: tl
  text: Sinabi ng Panginoon[a], “Ibabalik ko sila mula sa Bashan; ibabalik ko sila mula sa kailaliman ng dagat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “Ibabalik ko mula sa Bashan; ibabalik ko mula sa kailaliman ng dagat.” Walang tahasang layon ang pandiwa sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Isinalin bilang titulong “Panginoon.” Hindi ito ang pangalang YHWH sa talatang ito.
- source_word: אָמַר
  choice: Sinabi
  rationale: Tuwirang isinasalin ang qatal na nagpapakilala sa sinabi ng Diyos.
- source_word: מִבָּשָׁן
  choice: mula sa Bashan
  rationale: Ang Bashan ay pangalang-pook at pinanatili sa transliterasyon; natural na katumbas ng מִן ang “mula sa.”
- source_word: אָשִׁיב ... אָשִׁיב
  choice: Ibabalik ko sila ... ibabalik ko sila
  rationale: Ang Hiphil ng שוב ay transitive at nangangahulugang “ibalik/dalhing pabalik.” Inulit ang pandiwa upang mapanatili ang diin. Idinagdag ang “sila” ayon sa konteksto, bagaman walang tahasang layon sa Hebreo.
- source_word: מִמְּצֻלוֹת יָם
  choice: mula sa kailaliman ng dagat
  rationale: Ang מְצֻלוֹת ay tumutukoy sa malalalim na bahagi ng tubig; natural at malinaw sa Filipino ang “kailaliman ng dagat.”
theological_decisions:
- issue: Hindi tahasang layon ng inuulit na pandiwang אָשִׁיב
  choice: 'Idagdag ang “sila”: “Ibabalik ko sila”'
  alternative: 'Panatilihing walang tahasang layon: “Magbabalik ako mula sa Bashan; magbabalik ako mula sa kailaliman ng dagat”'
  rationale: Maaaring hindi banggitin sa Hebreo ang layong nauunawaan sa konteksto. Sa Filipino, ang “ibabalik ko sila” ang mas natural na transitive na pahayag, ngunit ipinapaliwanag sa talababa na walang tahasang layon sa orihinal upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit at ang larawang “kailaliman ng dagat,” habang nililinaw sa talababa ang hindi tahasang layon sa Hebreo.
