  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: tl
  text: Kakila-kilabot ang Diyos mula sa iyong mga santuwaryo[a]; ang Diyos ng Israel—siya ang nagbibigay ng lakas at dakilang kapangyarihan sa bayan. Purihin nawa ang Diyos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa iyong santuwaryo” o “sa iyong santuwaryo.” Sa Hebreo, literal na “mula sa iyong mga santuwaryo”; ang anyong maramihan ay maaaring tumukoy sa banal na tahanan ng Diyos sa maringal o kolektibong diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: Kahila-hilakbot
  rationale: Ipinahahayag nito na ang Diyos ay pumupukaw ng matinding pagkamangha at banal na takot; marangal at likas ang parirala sa makabagong Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salitang Hebreo, tumutukoy ito rito sa nag-iisang Diyos ng Israel.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: mula sa iyong mga santuwaryo
  rationale: Pinananatili ang pang-ukol na מִן bilang “mula sa” at ang morpolohikal na maramihan, kasama ang panlalaking pang-isahang hulaping “iyong.”
- source_word: אֵל יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Nominal na apposition ito na nagpapakilala sa Diyos na nabanggit; likas sa Tagalog ang paglalagay ng “ang.”
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang tahasang panghalip at ang diin nito.
- source_word: נֹתֵן
  choice: nagbibigay
  rationale: Ang participle ay nagpapahayag ng palagian o likas na pagkilos.
- source_word: עֹז
  choice: lakas
  rationale: Karaniwang kahulugan nito ang lakas o kalakasan, at naihihiwalay ito sa kasunod na salita.
- source_word: וְתַעֲצֻמוֹת
  choice: at dakilang kapangyarihan
  rationale: Ipinakikita ng “dakilang kapangyarihan” ang pinatinding diwa ng makapangyarihang lakas at hindi ito isinasanib lamang sa עֹז.
- source_word: לָעָם
  choice: sa bayan
  rationale: Walang tahasang panghalip na “kanyang” sa Hebreo; pinananatili ang simpleng “sa bayan.”
- source_word: בָּרוּךְ אֱלֹהִים
  choice: Purihin ang Diyos!
  rationale: Likas at marangal na doxological na pahayag sa Tagalog na naghahatid ng diwa ng pagpapala at pagpupuri sa Diyos.
theological_decisions:
- issue: Bilang at diwa ng “mga santuwaryo”
  choice: mula sa iyong mga santuwaryo
  alternative: mula sa iyong santuwaryo; sa iyong santuwaryo
  rationale: Morpolohikal na maramihan ang Hebreo, kaya pinananatili iyon sa pangunahing teksto. Gayunman, maaaring majestic o collective singular ang diwa, at maaari ring unawain nang mas maluwag ang pang-ukol; inilalahad ang mga ito sa talababa nang hindi nilulutas ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang Hebreong maramihan at ang pagkakaiba ng “lakas” at “dakilang kapangyarihan,” habang gumamit ng malinaw na doxological na pangwakas.
