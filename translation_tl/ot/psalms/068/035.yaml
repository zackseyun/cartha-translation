  terminology: Ang “Diyos,” “mga santuwaryo,” “lakas,” “dakilang kapangyarihan,” at “bayan” ay angkop. Pinananatili ng talababa ang tunay na kalabuan ng bilang at ng kaugnayan ng pang-ukol nang hindi ito nilulutas sa pangunahing teksto.
