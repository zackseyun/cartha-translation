  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: tl
  text: sa kanya na sumasakay sa pinakamataas na mga langit[a], na mula pa noong unang panahon—narito, inilalabas niya ang kanyang tinig[b], isang makapangyarihang tinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga langit ng mga langit ng sinauna.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinapahayag niya ang kanyang tinig, isang tinig ng lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: sa kanya na sumasakay
  rationale: Ang ל ay nagpapatuloy sa diwa ng utos sa naunang talata, kaya ipinahahayag ito bilang di-tuwirang layon; ang participle na רֹכֵב ay tumutukoy sa Diyos bilang siyang sumasakay.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: sa kataas-taasang kalangitan
  rationale: Ang literal na pariralang 'mga langit ng mga langit' ay superlatibong Hebreo para sa pinakamataas na kalangitan; natural at marangal sa modernong Tagalog ang 'kataas-taasang kalangitan.'
- source_word: קֶדֶם
  choice: mula pa noong unang panahon
  rationale: Temporal ang kahulugan dito, hindi heograpikal na 'silangan'; ipinahahayag nito ang napakatandang pag-iral ng kalangitan.
- source_word: הֵן
  choice: masdan
  rationale: Pinananatili nito ang pansin-tawag at matayog na puwersang patula ng Hebreo nang hindi nagdaragdag ng kahulugan.
- source_word: יִתֵּן
  choice: pinakakawalan niya
  rationale: Bagaman literal na 'nagbibigay,' kapag tinig ang kaugnay na layon ay nangangahulugan itong pagpapalabas o pagbigkas ng tinig; pinananatili ng 'pinakakawalan' ang masiglang larawan.
- source_word: בְּ/קוֹל/וֹ
  choice: ang kanyang tinig
  rationale: Idyomatiko ang pang-ukol sa pariralang Hebreo; hindi ito kailangang tumbasan nang hiwalay sa natural na Tagalog.
- source_word: קוֹל עֹז
  choice: isang makapangyarihang tinig
  rationale: Likas na salin ito ng literal na 'tinig ng lakas' at pinananatili ang diin sa kapangyarihan.
theological_decisions:
- issue: Ang tinutukoy na sumasakay
  choice: Ang Diyos ng Israel ang tinutukoy ayon sa agarang konteksto.
  alternative: Maaaring basahin ang larawan sa paraang tipolohikal at iugnay sa kalaunang mesiyanikong aplikasyon.
  rationale: Tuwirang inilalarawan ng tekstong Hebreo ang Diyos sa matayog na larawang patula; hindi dapat magpasok ang salin ng mas makitid na kristolohikal o anghelikong pagkakakilanlan.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Pinanatili ang ugnayan sa naunang utos sa pamamagitan ng 'sa kanya,' gayundin ang pansin-tawag na 'masdan.' Ang mga talababa ay nag-iingat sa literal na anyo at leksikal na alternatibo ng Hebreo.
