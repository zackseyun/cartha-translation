  naturalness: Marangal at malinaw ang kabuuang rehistro. Ang “inilalabas niya ang kanyang tinig” ay mas natural na Filipino para sa Hebreong idyomang “nagbibigay ng kanyang tinig,” habang pinananatili ang imahen ng pagpapalabas nito. Ang “narito” ay isang likas ngunit matayog na pansin-tawag para sa הֵן.
