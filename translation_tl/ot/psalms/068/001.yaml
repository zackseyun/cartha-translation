  source_fidelity: Tapat ang salin sa Hebreo. Ang “Bumabangon ang Diyos” ay wastong deklaratibong pagdinig sa imperfect na יָקוּם, habang ang talababa ay maayos na pinananatili ang posibleng optative na pagbasa. Ang “nangangalat ang mga kaaway niya” at “tumatakas ... ang mga napopoot sa kanya” ay tumutugon sa magkatulad na imperfect na mga pandiwa at sa paralelismo ng talata. Napananatili rin ng “mula sa harap niya” ang מִפָּנָיו, kabilang ang diwa ng paglayo mula sa presensiya ng Diyos.
