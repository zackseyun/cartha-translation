  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: tl
  text: Bumabangon ang Diyos; nangangalat ang mga kaaway niya[a], at tumatakas mula sa harap niya ang mga napopoot sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa tradisyonal na pagbasa bilang kahilingan: “Bumangon nawa ang Diyos; mangalat nawa ang mga kaaway niya, at tumakas nawa mula sa harap niya ang mga napopoot sa kanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: Bumabangon
  rationale: Ang Qal imperfect na 3ms ng קום ay maaaring maging masiglang pahayag o kahilingang tulad-jussive sa tulang ito. Pinananatili ng “bumabangon” ang larawan ng pagkilos ng Diyos nang hindi agad ipinapasyang optative ang anyo.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman plural ang anyong morpolohikal, singular ang pandiwa at malinaw na tumutukoy ito sa Diyos ng Israel.
- source_word: יָפוּצוּ
  choice: nangangalat
  rationale: Ang Qal imperfect plural ng פוץ ay nagsasaad ng pagkalat o pagkawatak-watak. Likas sa modernong Tagalog ang “nangangalat” at napapanatili nito ang masiglang pangkasalukuyang paglalarawan.
- source_word: אֹיְבָיו
  choice: ang mga kaaway niya
  rationale: Tuwirang ipinapahayag ang construct na may hulaping 3ms bilang pag-aari o kaugnayan.
- source_word: וְיָנוּסוּ
  choice: at tumatakas
  rationale: Ang Qal imperfect plural ng נוס ay likas na naipahahayag ng “tumatakas,” na angkop sa marangal at makatang rehistro.
- source_word: מְשַׂנְאָיו
  choice: ang mga napopoot sa kanya
  rationale: Participle itong ginagamit bilang pangngalan. Pinananatili ng “mga napopoot sa kanya” ang aktibong diwa ng pagkapoot sa halip na gawing mas pangkalahatang “mga kalaban.”
- source_word: מִפָּנָיו
  choice: mula sa harap niya
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo na “mula sa kanyang mukha/harap” at ang larawan ng pag-urong sa presensiya ng Diyos.
theological_decisions:
- issue: Lakas ng mga imperfect na pandiwa sa kontekstong makata at militar-teopaniya
  choice: 'Masiglang deklaratibong pagbasa: “Bumabangon ang Diyos; nangangalat ang mga kaaway niya...”'
  alternative: 'Optative o panalanging pagbasa: “Bumangon nawa ang Diyos; mangalat nawa ang mga kaaway niya...”'
  rationale: Maaaring marinig ang mga imperfect sa Hebreo bilang masiglang pahayag o bilang kahilingan/panalangin. Ginamit sa pangunahing teksto ang deklaratibong anyo, ngunit pinanatili sa talababa ang tradisyonal na optative na pagbasa upang hindi alisin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at makata ngunit madaling maunawaan. Ginamit ang “niya/kanya” sa halip na mas arkaikong anyo, at pinanatili ang konkretong “mula sa harap niya” upang katawanin ang idyomang Hebreo.
