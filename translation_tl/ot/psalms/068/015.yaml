  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: tl
  text: Ang bundok ng Diyos ay ang bundok ng Basan[a]; ang bundok na maraming taluktok[b] ay ang bundok ng Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makapangyarihang bundok” o “maringal na bundok.” Ang Hebreong “bundok ng Diyos” ay maaari ring maging idyomatikong pasukdol.
    reason: alternative_reading
  - marker: b
    text: Ang bihirang salitang Hebreo na isinaling “maraming taluktok” ay maaari ring magpahiwatig ng isang baku-bako o umbok-umbok na bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: bundok
  rationale: Karaniwang kahulugan ng salita at angkop sa heograpiya ng Basan; pinanatili ang tatlong pag-uulit upang maipakita ang diin at anyong patula ng Hebreo.
- source_word: אֱלֹהִים
  choice: ng Diyos
  rationale: Pinakamalapit sa anyong konstruktong הַר אֱלֹהִים at pinananatili ang teolohikal at patulang puwersa nito, habang inilalagay sa talababa ang posibleng gamit bilang pasukdol.
- source_word: בָּשָׁן
  choice: Basan
  rationale: Pangalan ng pook; ginamit ang nakaugaliang anyong Filipino.
- source_word: גַּבְנֻנִּים
  choice: maraming taluktok
  rationale: Ang bihirang pangmaramihang salita ay malamang na naglalarawan sa maraming taluktok o baku-bakong anyo ng bundok; malinaw at likas ito sa modernong Filipino.
theological_decisions:
- issue: Kung ang הַר אֱלֹהִים ay literal na 'bundok ng Diyos' o idyomatikong pasukdol
  choice: bundok ng Diyos
  alternative: makapangyarihang bundok; maringal na bundok
  rationale: Likas na mababasa ang konstruktong Hebreo bilang 'bundok ng Diyos.' Hindi inalis ang posibilidad na isa itong idyomatikong pasukdol; inilagay iyon sa talababa upang mapanatili ang tunay na kalabuan at teolohikal na puwersa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paulit-ulit na estruktura ng Hebreong tula at ang literal na pariralang “bundok ng Diyos”; ginamit ang “taluktok” bilang likas na terminong heograpiko.
