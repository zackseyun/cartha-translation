  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: tl
  text: Nakita nila ang mga prusisyon mo[a], O Diyos—ang mga prusisyon ng aking Diyos, ng aking Hari, patungo sa santuwaryo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Nakita nila ang mga paglakad mo, O Diyos—ang mga paglakad ng aking Diyos, ng aking Hari, sa kabanalan.”'
    reason: Pinananatili ang posibleng mas literal na kahulugan ng הֲלִיכוֹת bilang “mga paglakad” at ng בַקֹּדֶשׁ bilang “sa kabanalan,” sa halip na ang kontekstuwal na pagbasa na prusisyon patungo sa santuwaryo.
lexical_decisions:
- source_word: רָאוּ
  choice: Nakita nila
  rationale: Ang Qal perfect na ikatlong panauhang maramihan ng ראה ay tumutukoy sa natapos na pagkakita o pagsaksi; likas itong ipinahahayag sa Filipino bilang “Nakita nila.”
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: ang mga prusisyon mo / ang mga prusisyon
  rationale: Ang pangngalang maramihan mula sa הלך ay maaaring tumukoy sa mga paglakad, pagkilos, o seremonyal na pagparada. Sa kontekstong panliturhiya at pagdiriwang, malinaw at natural ang “mga prusisyon,” habang pinananatili ng pag-uulit ang paralelismo ng Hebreo.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ipinahihiwatig ng konteksto na tuwirang kinakausap ang Diyos; ang “O Diyos” ay angkop sa marangal at patulang pananalita.
- source_word: אֵלִי
  choice: aking Diyos
  rationale: 'Ang hulaping unang panauhang isahan ay tuwirang nagpapahayag ng pag-aari o kaugnayan: “aking Diyos.”'
- source_word: מַלְכִּי
  choice: aking Hari
  rationale: Tuwirang isinasalin ang banal na titulong hari na may hulaping unang panauhang isahan.
- source_word: בַקֹּדֶשׁ
  choice: patungo sa santuwaryo
  rationale: Maaaring literal na mangahulugang “sa kabanalan” o “sa banal na dako,” ngunit sa konteksto ng prusisyon ay malamang na tumutukoy ito sa paglapit sa sagradong lugar. Ang “patungo sa santuwaryo” ay natural sa Filipino at hindi nagdaragdag ng tiyak na detalyeng pangkasaysayan.
theological_decisions:
- issue: Ang tinutukoy ng mga prusisyon
  choice: Inilalarawan ang seremonyal na pagkilos ng Diyos patungo sa santuwaryo.
  alternative: Maaaring mas malawak itong tumukoy sa mga pagkilos o mga daan ng Diyos na nakita, o sa kanyang paglakad “sa kabanalan.”
  rationale: Ang pag-uulit ng הֲלִיכוֹת at ang pangwakas na בַקֹּדֶשׁ ay pumapabor sa larawang panliturhiya at prusisyon, ngunit inilalahad sa talababa ang tunay na leksikal na alternatibo upang hindi tuluyang alisin ang ambiguwidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “aking” sa mga titulong patula at ang “prusisyon” upang maipakita ang pampubliko at seremonyal na kilos; iniwasan ang anumang denominasyonal na pagpapakahulugan.
