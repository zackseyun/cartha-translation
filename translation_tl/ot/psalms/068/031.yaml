  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: tl
  text: Darating mula sa Ehipto ang mga maharlika[a]; magmamadaling iuunat ng Cus ang mga kamay nito patungo sa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sugo” o “mga pinuno.” Bihira ang salitang Hebreo at malamang na tumutukoy sa mga kilalang taong mataas ang katayuan mula sa Ehipto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mamadaling iuunat ni Cus ang kaniyang mga kamay patungo sa Diyos.” Isahan ang hulaping Hebreo; ang Cus ay inilalarawan bilang isang persona.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: darating
  rationale: Ang Qal imperfect na 3mp ng אתה/אתי ay pinakanatural na tumutukoy sa pagdating. Hindi idinagdag ang ideya ng pagdadala ng handog, sapagkat hindi iyon tahasang sinasabi ng pandiwa.
- source_word: חַשְׁמַנִּים
  choice: mga maharlika
  rationale: Bihira ang salitang Hebreo at malamang na tumutukoy sa mga taong mataas ang katayuan. Ang “mga maharlika” ay maikli at likas sa Filipino, habang kinikilala sa talababa ang posibleng “mga sugo” o “mga pinuno.”
- source_word: מִנִּי מִצְרָיִם
  choice: mula sa Ehipto
  rationale: Tuwirang ipinapahayag ng parirala ang pinagmulan; natural sa modernong Filipino ang “mula sa Ehipto.”
- source_word: כּוּשׁ
  choice: Cus
  rationale: Pinanatili ang sinaunang pangalang pantanging Hebreo sa halip na ipalit ang isang mas huling katawagang heograpiko gaya ng Etiopia.
- source_word: תָּרִיץ
  choice: magmamadaling iunat
  rationale: Ang Hiphil ng רוץ ay may diwa ng pagpapabilis o pagmamadali. Kasama ng “mga kamay,” natural itong tumutukoy sa agarang pag-uunat ng mga kamay.
- source_word: יָדָיו
  choice: ang mga kamay nito
  rationale: Ang hulaping panghalip ay isahan at tumutukoy sa bansang Cus na inilalarawan na parang isang persona. Ang “nito” ay nagpapanatili sa isahang pagtukoy nang hindi ginagawang literal na lalaki ang bansa.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Ipinahihiwatig ng pang-ukol ang direksiyon ng kilos patungo sa Diyos. Likas sa Filipino ang “iunat … sa Diyos.”
theological_decisions:
- issue: Kahulugan ng pag-uunat ng Cus ng mga kamay sa Diyos
  choice: Pinanatili itong isang kilos na nakatuon sa Diyos nang hindi tinutukoy kung ito ay panalangin, pagsamba, pagsusumamo, o pagpapasakop.
  alternative: Ipaliwanag ito bilang tiyak na pag-aalay ng tributo, pagbabagong-loob, o pampolitikang pagpapasakop.
  rationale: Maaaring magpahiwatig ang idyoma ng panalangin, pagsusumamo, pagsamba, o pagpapasakop. Hindi nililinaw ng talata ang eksaktong uri ng kilos, kaya hindi ito pinakitid ng salin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Ehipto,” “Cus,” at “Diyos” bilang malinaw at karaniwang anyo ng mga pangalan. Pinanatili ang matalinghagang pagpersonipika sa bansa at ang hindi tiyak na kahulugan ng kilos ng mga kamay.
