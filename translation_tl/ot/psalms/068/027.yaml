base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: tl
  text: Naroon ang munting Benjamin[a], na nangunguna sa kanila; ang mga pinuno ng Juda kasama ng kanilang pulutong[b]; ang mga pinuno ng Zebulun; ang mga pinuno ng Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na namamahala sa kanila” o “na naghahari sa kanila.” Maaaring magpahiwatig ang participle sa Hebreo ng pamamahala o pagiging una; sa kontekstong ito, isinalin itong pangunguna sa prusisyon.
    reason: lexical_alternative
  - marker: b
    text: O “kanilang pangkat,” “kanilang karamihan,” o “kanilang kumpol.” Bihira ang salitang Hebreo at hindi tiyak ang eksaktong diwa nito, ngunit tumutukoy ito sa nagkakatipong grupong kasama ng Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Naroon
  rationale: Pinananatili ang lokatibo at panturong diwa ng salitang Hebreo habang likas na ipinakikilala sa Tagalog ang mga kalahok sa prusisyon.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Ginamit ang karaniwang anyo ng pangalang pantribo sa Filipino.
- source_word: צָעִיר
  choice: munting
  rationale: Maaaring mangahulugang maliit, bata, o pinakamaliit; sa konteksto, malamang na tumutukoy ito sa maliit na laki o katayuan ng tribo ng Benjamin, at pinananatili ng “munting” ang maikli at matulaing himig.
- source_word: רֹדֵם
  choice: na nangunguna sa kanila
  rationale: Ang participle na may hulaping pangmaramihan ay karaniwang may diwang namamahala o naghahari, ngunit sa konteksto ng prusisyon ay maaaring tumukoy sa pangunguna; inilagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Tumutukoy sa mga opisyal, prinsipe, o pinunong may ranggo. Mas natural sa modernong Filipino ang “mga pinuno” at hindi nito ipinapalagay na mga anak sila ng hari.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo ng pangalang pantribo sa Filipino.
- source_word: רִגְמָתָם
  choice: kasama ng kanilang pulutong
  rationale: Bihira at di-tiyak ang eksaktong kahulugan ng salitang Hebreo, ngunit malamang na tumutukoy ito sa isang nagkakatipong grupo o karamihan na kasama ng Juda.
- source_word: זְבֻלוּן
  choice: Zebulun
  rationale: Karaniwang transliterasyon ng pangalang pantribo sa Filipino.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Karaniwang anyo ng pangalang pantribo sa Filipino.
theological_decisions:
- issue: Diwa ng רֹדֵם sa paglalarawan sa Benjamin
  choice: na nangunguna sa kanila
  alternative: na namamahala sa kanila / na naghahari sa kanila
  rationale: Hindi tiyak kung literal na pamamahala o posisyon sa unahan ang tinutukoy. Pinapaboran ng tagpo ng prusisyon ang “nangunguna,” ngunit pinananatili sa talababa ang diwa ng pamamahala upang hindi maalis ang tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal at matula ngunit madaling maunawaan. Ginamit ang “mga pinuno” sa halip na “mga prinsipe” para sa likas na Tagalog at upang hindi magdagdag ng mahigpit na kahulugang monarkikal. Napanatili ang paralelismong pantribo at ang mga leksikal na kalabuan sa mga talababa.
