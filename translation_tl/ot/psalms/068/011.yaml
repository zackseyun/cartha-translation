  text: אֲדֹנָ֥/י יִתֶּן אֹ֑מֶר הַֽ֝/מְבַשְּׂר֗וֹת צָבָ֥א רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: tl
  text: Ang Panginoon ang nagbibigay ng salita[a]; ang mga babaeng naghahayag ng mabuting balita[b] ay isang malaking hukbo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahe” o “utos.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang Hebreo ay may pambabaeng maramihang participle: “ang mga babaeng nagdadala ng mabuting balita” o “ang mga babaeng tagapagbalita.”'
    reason: lexical_alternative
  - marker: c
    text: O “isang napakalaking pangkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Ginamit bilang banal na titulo; natural at marangal itong katumbas sa makabagong Filipino nang hindi ito ipinapantay sa natatanging salin ng pangalang יהוה.
- source_word: יִתֶּן
  choice: ang nagbibigay
  rationale: Maaaring magpahiwatig ang yiqtol ng kasalukuyan, hinaharap, o modal na diwa. Pinananatili rito ang presentibo o pangkalahatang kasalukuyan na angkop sa patulang pahayag.
- source_word: אֹמֶר
  choice: salita
  rationale: Saklaw ng אֹמֶר ang salita, pahayag, mensahe, o utos. Maikli at sadyang malawak ang “salita,” kaya hindi nito nilulutas ang tunay na leksikal na kalabuan.
- source_word: הַמְבַשְּׂרוֹת
  choice: ang mga babaeng naghahayag ng mabuting balita
  rationale: Ang participle ay tahasang pambabae at maramihan, mula sa pandiwang nangangahulugang maghatid o maghayag ng mabuting balita. Pinananatili ng salin ang kasariang minarkahan sa Hebreo.
- source_word: צָבָא רָב
  choice: isang malaking hukbo
  rationale: Ang צָבָא ay maaaring hukbo o malaking pangkat, at ang רָב ay nagpapahiwatig ng laki o dami. Pinananatili ng “malaking hukbo” ang posibleng imaheng militar sa konteksto.
theological_decisions:
- issue: Tahasan ang pambabaeng anyo ng הַמְבַשְּׂרוֹת
  choice: ang mga babaeng naghahayag ng mabuting balita
  alternative: ang mga tagapaghayag ng mabuting balita
  rationale: Hindi ginagawang neutral ang pambabaeng maramihang participle. Katangiang pangwika at pampanitikan ito ng teksto, hindi dagdag na doktrinal na pagpapakahulugan.
- issue: Diwa ng אֹמֶר
  choice: salita
  alternative: mensahe o utos
  rationale: Pinananatili sa pangunahing teksto ang malawak na kahulugan ng salita, habang inilalahad sa talababa ang mga lehitimong alternatibo upang hindi sapilitang piliin kung pahayag o utos ang tinutukoy.
- issue: Imahe ng צָבָא
  choice: hukbo
  alternative: malaking pangkat
  rationale: Maaaring literal o matalinghagang militar ang kolektibong termino. Pinananatili sa teksto ang matibay na imaheng militar, ngunit kinikilala sa talababa ang di-militar na kolektibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang Panginoon ang nagbibigay” upang maging natural ang diin ng patulang sugnay. Tahasang pinanatili ang mga babae bilang tagapaghayag at ang posibleng imaheng militar ng “hukbo”; nasa mga talababa ang mahahalagang leksikal na alternatibo.
