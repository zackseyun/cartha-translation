  source_fidelity: 'Tapat ang salin sa Hebreo: ang Diyos ay tuwirang kinakausap, lumalabas na nangunguna sa kanyang bayan at humahakbang sa ilang. Ang “sa ilang” ay wastong pagsasalin ng lokatibong parirala at hindi ipinipilit ang direksiyong “sa pamamagitan ng,” na maaaring ipahiwatig ng konteksto ngunit hindi tahasang minamarka ng Hebreo.'
