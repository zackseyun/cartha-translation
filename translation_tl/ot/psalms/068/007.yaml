  text: אֱֽלֹהִ֗ים בְּ֭/צֵאתְ/ךָ לִ/פְנֵ֣י עַמֶּ֑/ךָ בְּ/צַעְדְּ/ךָ֖ בִֽ/ישִׁימ֣וֹן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: tl
  text: Diyos, nang lumabas ka sa unahan ng iyong bayan, nang humakbang ka sa ilang[a]—Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa disyerto” o “sa tiwangwang na lupain.” Ang salitang Hebreo ay tumutukoy sa isang tigang at tiwangwang na rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Pinanatili bilang tuwirang pagtawag sa Diyos sa simula ng pangungusap; hindi kailangan ang pantawag na “O” sapagkat walang hiwalay na katumbas nito sa Hebreo.
- source_word: בְּצֵאתְךָ
  choice: nang lumabas ka
  rationale: Ang ב na kasama ng infinitive construct at hulaping pangalawang panauhan ay temporal; likas itong ipinapahayag sa Tagalog sa pamamagitan ng “nang.”
- source_word: לִפְנֵי עַמֶּךָ
  choice: sa unahan ng iyong bayan
  rationale: Malinaw na ipinapakita ang Diyos na nangunguna sa kanyang bayan habang pinananatili ang literal na larawang nasa לִפְנֵי.
- source_word: בְּצַעְדְּךָ
  choice: nang humakbang ka
  rationale: Ang צעד ay tumutukoy sa paghakbang o pagmamartsa. Pinili ang “humakbang” upang mapanatili ang konkretong larawan ng pagkilos nang hindi nagpapasok ng labis na militar na himig.
- source_word: בִישִׁימוֹן
  choice: sa ilang
  rationale: Ang יְשִׁימוֹן ay isang tiwangwang at tigang na ilang. Ang “sa ilang” ay natural sa Tagalog at pinananatili ang lokatibong ב; maaari ring maunawaan ang kilos bilang pagdaan dito.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinatinig lamang sapagkat hindi tiyak ang eksaktong kahulugan at tungkulin nito, na marahil ay panandang pangmusika o panliturhiya.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa paglalakbay ng kanyang bayan sa ilang
  choice: Isinalin bilang tuwirang pakikipag-usap sa Diyos na ginugunita ang kanyang pangunguna sa kanyang bayan.
  alternative: Basahin ito bilang paglalarawan tungkol sa Diyos sa halip na tuwirang pagtawag sa kanya.
  rationale: Ang mga hulaping pangalawang panauhan at ang konteksto ng salmo ay sumusuporta sa tuwirang pakikipag-usap. Hindi dinagdagan ang talata ng mga detalyeng teolohikal na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “bayan” para sa kolektibong עַם at pinanatili ang “Selah” upang hindi magpanggap ng katiyakan tungkol sa kahulugan nito.
