  text: בָּ֤ר֣וּךְ אֲדֹנָ/י֮ י֤וֹם י֥וֹם יַֽעֲמָס לָ֗/נוּ הָ֘/אֵ֤ל יְֽשׁוּעָתֵ֬/נוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: tl
  text: Purihin ang Panginoon, na araw-araw ay pumapasan para sa atin[a]—ang Diyos ang ating kaligtasan. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “araw-araw ay inaalalayan tayo”; ayon sa tradisyon, “araw-araw tayong pinagkakalooban ng mga biyaya.” Ang pandiwang Hebreo ay tumutukoy sa pagkakarga o pagpasan, ngunit hindi tahasang binanggit kung ano ang pinapasan.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Doxological blessing formula ito. Ang “Purihin” ay likas at marangal na katumbas sa modernong Tagalog, at malinaw na pagpapahayag ng papuri sa Diyos.
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Karaniwang salin ng banal na titulong Adonai at natural sa isang pormula ng pagpupuri.
- source_word: יוֹם יוֹם
  choice: araw-araw
  rationale: Ipinahihiwatig ng pag-uulit sa Hebreo ang patuloy at distribütibong kilos; natural itong naipapahayag ng “araw-araw” sa Tagalog.
- source_word: יַעֲמָס לָנוּ
  choice: pumapasan para sa atin
  rationale: Ang pandiwa ay tumutukoy sa pagkakarga o pagpasan, samantalang walang tahasang layon ang pangungusap. Pinananatili ng salin ang larawan at ang kakulangan ng tinukoy na pasan nang hindi nagdaragdag ng “mga biyaya” o “ating pasanin.”
- source_word: הָאֵל
  choice: ang Diyos
  rationale: Likas na salin ng karaniwang katawagan sa Diyos; hindi kailangang dagdagan ng ibang paglalarawan.
- source_word: יְשׁוּעָתֵנוּ
  choice: ating kaligtasan
  rationale: Saklaw ng salita ang pagliligtas at kaligtasan. Pinananatili ng “kaligtasan” ang malawak na diwa nito.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili ang tradisyonal na transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan o gamit ng termino.
theological_decisions:
- issue: Ang pinaikling pariralang יַעֲמָס לָנוּ
  choice: Inilalarawan ang Diyos bilang patuloy na pumapasan para sa kanyang bayan, nang hindi tinutukoy kung ano ang pinapasan.
  alternative: “araw-araw ay inaalalayan tayo” o ang tradisyonal na “araw-araw tayong pinagkakalooban ng mga biyaya”
  rationale: Ang pangunahing diwa ng pandiwa ay pagkakarga o pagpasan, ngunit walang tahasang layon sa Hebreo. Iniiwasan ng pangunahing salin ang pagdaragdag ng “pasanin” o “mga biyaya,” habang kinikilala sa talababa ang tunay na kalabuan.
- issue: Ugnayan ng הָאֵל at יְשׁוּעָתֵנוּ
  choice: ang Diyos ang ating kaligtasan
  alternative: ang Diyos ng ating kaligtasan
  rationale: 'Maaaring unawain ang maikling nominal na pahayag bilang pagkakakilanlan: ang Diyos mismo ang kaligtasan ng kanyang bayan. Pinananatili nito ang matinding pahayag nang hindi nililimitahan sa “Tagapagligtas.”'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pumapasan para sa atin” upang mapanatili ang siksik at sadyang hindi ganap na tinukoy na larawan sa Hebreo; inilagay ang talababa kaagad pagkatapos ng pariralang tinutukoy nito.
