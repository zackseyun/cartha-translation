source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: tl
  text: Sawayin mo ang mabangis na hayop sa mga tambo[a], ang kawan ng mga toro sa gitna ng mga guya ng mga bayan, na yumuyurak sa mga piraso ng pilak[b]. Ikalat mo ang mga bayang nalulugod sa mga digmaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hayop sa mga tambo.” Maaaring matalinghagang tumukoy ito sa Ehipto o sa ibang kapangyarihang kaaway.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang Hebreo ng pariralang ito. Maaari rin itong mangahulugang “nagpapasakop na may mga piraso ng pilak” o “nagpapatirapa na may mga bara ng pilak,” samakatuwid ay naghahandog ng tributo.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: Sawayin mo
  rationale: Ang pautos na anyo ay humihiling ng makapangyarihang pagsaway ng Diyos laban sa kaaway; pinananatili ng “sawayin” ang lakas ng salita nang hindi ito pinalalabis tungo sa “lipulin.”
- source_word: חַיַּת קָנֶה
  choice: ang mabangis na hayop sa mga tambo
  rationale: Pinananatili ang larawang Hebreo ng isang mapanganib na hayop na naninirahan sa matambong lugar, nang hindi tahasang kinikilalang Ehipto o isang tiyak na hayop.
- source_word: עֲדַת אַבִּירִים
  choice: ang kawan ng mga toro
  rationale: Sa nagpapatuloy na paglalarawan sa pamamagitan ng mga hayop, ang אַבִּירִים ay natural na nauunawaang “mga toro,” at ang עֲדָה bilang kanilang pangkat o kawan.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: sa gitna ng mga guya ng mga bayan
  rationale: Ang בְּ ay kinuha sa panlunan o pakikisamang diwa, at ang עֶגְלֵי bilang “mga guya,” habang pinananatili ang “mga bayan” para sa עַמִּים.
- source_word: מִתְרַפֵּס
  choice: na yumuyurak
  rationale: Mahirap at pinagtatalunan ang anyo. Ang “yumuyurak” ay umaayon sa marahas na larawan at sa kasunod na pagbanggit sa mga bayang mahilig sa digmaan; inilagay sa talababa ang mahalagang alternatibong diwa ng pagpapasakop o pagpapatirapa.
- source_word: בְּרַצֵּי כָסֶף
  choice: sa mga piraso ng pilak
  rationale: Malabo ang רַצֵּי at maaaring tumukoy sa mga piraso o bara ng pilak. Ang “mga piraso” ay maingat at hindi labis na tiyak.
- source_word: בִּזַּר
  choice: Ikalat mo
  rationale: Bagaman nasa anyong ganap ayon sa pagbigkas ng tekstong Masoretiko, sa tulang konteksto ay natural itong basahin bilang pagpapatuloy ng pakiusap na nagsimula sa pautos na “Sawayin mo.”
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: nasisisiyahan sa digmaan
  rationale: Ipinahahayag nito ang pagkagusto o pagkakaroon ng lugod sa pakikipagdigma; natural sa makabagong Filipino ang pariralang ito habang nananatili ang moral na bigat.
theological_decisions:
- issue: Kung tahasang kikilalanin bilang Ehipto ang “mabangis na hayop sa mga tambo”
  choice: Panatilihin ang metapora nang walang tiyak na pagkakakilanlan sa pangunahing teksto.
  alternative: Tukuyin ito bilang Ehipto o bilang isang pangkalahatang mapang-aping kapangyarihan.
  rationale: Maaaring ipinahihiwatig ng matambong kapaligiran at ng konteksto ng Awit 68 ang Ehipto, ngunit hindi ito tahasang pinangalanan ng Hebreo sa talatang ito.
- issue: Kung ang מִתְרַפֵּס ay tumutukoy sa marahas na pagyurak o sa pagpapakumbaba at pagbibigay ng pilak bilang tributo
  choice: Gamitin sa pangunahing teksto ang marahas na pagbasa na “yumuyurak,” at panatilihin sa talababa ang pagbasa tungkol sa pagpapasakop o tributo.
  alternative: “Nagpapasakop na may mga piraso ng pilak” o “nagpapatirapa na may mga barak na pilak.”
  rationale: Parehong may suporta ang mga pagbasa dahil mahirap ang Hebreo. Pinili ang una dahil umaayon ito sa larawan ng mababangis na kaaway at sa huling pakiusap laban sa mga bayang nasisiyahan sa digmaan, ngunit hindi inalis ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkakaugnay na larawan ng mabangis na hayop, mga toro, at mga guya. Ginamit ang “mga bayan” sa halip na “mga bansa” upang mas malapit sa עַמִּים at maiwasan ang labis na pampolitikang pagpapakahulugan.
