  naturalness: Marangal at higit na natural ang daloy sa modernong Filipino. Ang “mga bayang nalulugod sa mga digmaan” ay mas tuwirang tumutugma sa plural na “wars” kaysa sa singular na “digmaan.”
  terminology: Ang “mabangis na hayop,” “kawan ng mga toro,” “mga guya,” at “mga bayan” ay angkop. Pinanatili ang “tributo” bilang malinaw na katawagan para sa handog na pilak sa alternatibong pagbasa.
