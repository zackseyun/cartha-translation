  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: tl
  text: Iniutos ng iyong Diyos ang iyong kalakasan. Magpakita ka ng lakas[a], O Diyos, ikaw na kumilos para sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreong עוּזָה. Maaari rin itong isalin na “Maging malakas ka, O Diyos,” o, kung iuugnay sa kasunod na talata, “Palakasin mo, O Diyos, ang ginawa mo para sa amin.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: Iniutos
  rationale: Ang ganap na pandiwa ay nagpapahayag ng isang makapangyarihang utos na naibigay na at may bisa pa rin sa kasalukuyan.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, karaniwan itong tumutukoy nang isahan sa Diyos ng Israel; ang hulaping ikalawang panauhang panlalaki ay nangangahulugang ‘iyong.’
- source_word: עֻזֶּךָ
  choice: iyong kalakasan
  rationale: Tuwirang pinananatili ang pangngalang tumutukoy sa lakas o kapangyarihan at ang hulaping ‘iyong.’
- source_word: עוּזָה
  choice: Ipakita mo ang lakas mo
  rationale: Mahirap at di-pangkaraniwan ang anyo. Bilang pakiusap sa Diyos, natural sa Tagalog ang panawagang ipamalas niya ang kanyang lakas, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ginamit bilang pantawag sa tuwirang panalangin; ang ‘O Diyos’ ay marangal at natural sa ganitong rehistro.
- source_word: זוּ
  choice: ikaw na
  rationale: Ang katagang pang-ugnay ay nagpapakilala sa sugnay na naglalarawan sa Diyos na tuwirang kinakausap.
- source_word: פָּעַלְתָּ
  choice: kumilos
  rationale: Ipinahahayag ang mabisa at aktibong pagkilos ng Diyos nang hindi nililimitahan sa pisikal na paggawa.
- source_word: לָּנוּ
  choice: para sa amin
  rationale: 'Pinananatili ang benefaktibong diwa: ang Diyos ay kumilos alang-alang sa kanyang bayan.'
theological_decisions:
- issue: Malabong anyo at gamit ng עוּזָה
  choice: 'Pakiusap na ipamalas ng Diyos ang kanyang lakas: “Ipakita mo ang lakas mo, O Diyos.”'
  alternative: Maaari ring unawain na “Magpakalakas ka, O Diyos,” o, kaugnay ng kasunod na talata, “Palakasin mo, O Diyos, ang ginawa mo para sa amin.”
  rationale: Hindi tiyak ang sintaks ng Hebreo. Pinananatili ng pangunahing salin ang diwa ng panalangin sa loob ng talata, samantalang ang talababa ay hayagang nag-iingat sa tunay na kalabuan at hindi nagpapasya nang lampas sa ebidensiya.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tuwirang panalangin at ang pag-uulit ng konsepto ng lakas, ngunit gumamit ng natural na pandiwang “kumilos” para sa gawa ng Diyos.
