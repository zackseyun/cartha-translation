  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: tl
  text: Doon nanirahan ang iyong mga nilalang[a]; sa iyong kabutihan, O Diyos, naglaan ka para sa dukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng Hebreong חַיָּתְךָ rito. Maaari din itong isaling “ang iyong mga nabubuhay na nilalang,” “ang iyong pangkat,” o “ang iyong kapulungan.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: ang iyong mga nilalang
  rationale: Ang חַיָּה ay karaniwang tumutukoy sa isang nabubuhay na nilalang o hayop, ngunit maaari itong gamiting kolektibo rito. Pinananatili ng “mga nilalang” ang malawak at konkretong kahulugan nang hindi agad nililimitahan sa kawan o kapulungan.
- source_word: יָשְׁבוּ בָהּ
  choice: Doon nanirahan
  rationale: Ang יָשַׁב ay maaaring mangahulugang umupo, manirahan, o tumahan. Ang “nanirahan” ay likas sa Filipino at ang “doon” ay tumutukoy sa lupa o pook na binanggit sa naunang konteksto.
- source_word: תָּכִין
  choice: naglaan ka
  rationale: Ang Hiphil ng כּוּן ay nangangahulugang ihanda, itatag, o gawing handa. Sa pariralang para sa dukha, malinaw na ipinahihiwatig ang paglalaan.
- source_word: בְּטוֹבָתְךָ
  choice: sa iyong kabutihan
  rationale: Maaaring tumukoy ang טוֹבָה sa kabutihan, kagandahang-loob, o kasaganaan. Pinananatili ng salin ang anyo ng parirala at ipinahahayag na mula sa kabutihan ng Diyos ang paglalaan.
- source_word: לֶעָנִי
  choice: para sa dukha
  rationale: Ang עָנִי ay maaaring mangahulugang dukha, nangangailangan, o api. Ang “dukha” ay maikli, marangal, at angkop sa konteksto ng paglalaan.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos sa hulihan ng linyang Hebreo; ipinakikita ng “O Diyos” ang bokatibong gamit.
theological_decisions:
- issue: Ang kahulugan ng חַיָּתְךָ sa mahirap na linyang patula
  choice: Isinaling malawak bilang “ang iyong mga nilalang.”
  alternative: Maaaring unawain bilang “ang iyong mga nabubuhay na nilalang,” “ang iyong pangkat,” o “ang iyong kapulungan.”
  rationale: Bagaman maaaring literal na tumukoy sa mga hayop o iba pang nabubuhay na nilalang, maaari rin itong kolektibong tumukoy sa mga taong sa Diyos. Hindi tahasang nilulutas ng pangunahing salin ang kalabuan, at inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling paralelismong patula at ang tuwirang pagtawag na “O Diyos,” habang iniwasang gawing tiyak ang isang likas na malabong salitang Hebreo.
