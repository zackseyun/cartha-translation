  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: tl
  text: "Ang mga hari ng mga hukbo ay tumatakas,\n\n    tumatakas sila;\n\nat ang babaeng nasa tahanan\n\n    ay naghahati ng nasamsam.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang babaeng naninirahan sa bahay ay naghahati ng nasamsam.” Pambabaeng isahan ang pariralang Hebreo at malamang na inilalarawan ang babaeng nasa tahanan na tumatanggap at namamahagi ng nasamsam sa digmaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: mga hari ng mga hukbo
  rationale: Pinananatili nito ang ugnayang construct ng maramihang “mga hari” at “mga hukbo,” pati ang malinaw na kontekstong militar.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: tumatakas, tumatakas sila
  rationale: Tuwirang pinananatili ang pag-uulit ng pandiwa mula sa נדד upang maipahayag ang diin at puwersang patula.
- source_word: וּנְוַת בַּיִת
  choice: ang babaeng naiwan sa bahay
  rationale: Ipinakikita ang pambabaeng isahan at ang larawan ng isang babaeng nananatili sa tahanan habang nasa digmaan ang iba; hindi gumagamit ng katawagang maaaring magpasok ng makabagong papel panlipunan.
- source_word: תְּחַלֵּק
  choice: naghahati
  rationale: Ipinahahayag ang Piel na kilos ng paghahati o pamamahagi nang natural sa modernong Tagalog.
- source_word: שָׁלָל
  choice: nasamsam
  rationale: Karaniwang salitang Tagalog ito para sa mga ari-ariang nakuha sa digmaan at malinaw sa ordinaryong mambabasa.
