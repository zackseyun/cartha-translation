  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: tl
  text: Ama ng mga walang ama[a] at hukom ng mga balo[b] ang Diyos sa kanyang banal na tahanan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ulila.” Ang Hebreo ay partikular na tumutukoy sa mga batang walang ama.
    reason: lexical_alternative
  - marker: b
    text: O “tagapagtanggol ng mga balo”; mas literal na tumutukoy ang salitang Hebreo sa isang humahatol o nangangasiwa ng katarungan.
    reason: lexical_alternative
  - marker: c
    text: O “mula sa kanyang banal na tahanan.” Ganito inuunawa ng ilang salin ang lugar na pinagmumulan ng pagkilos ng Diyos, bagaman literal na “sa” ang pang-ukol sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: Ama ng
  rationale: Ang anyong construct ng אָב ay tuwirang nagpapahayag ng kaugnayang “ama ng.” Sa sugnay na walang hayag na pandiwa, nagsisilbi itong panaguring tumutukoy sa Diyos.
- source_word: יְתוֹמִים
  choice: mga walang ama
  rationale: Sa kontekstong Hebreo, tumutukoy ito sa mga batang nawalan o walang ama. Mas tiyak ito kaysa sa pangkalahatang “mga ulila,” na sa Filipino ay maaaring mangahulugang nawalan ng isa o kapuwa magulang.
- source_word: דַיַּן
  choice: hukom ng
  rationale: Ang pangngalan ay tumutukoy sa isang humahatol o nangangasiwa ng katarungan. Pinananatili ng “hukom” ang legal na larawan ng Hebreo sa halip na agad itong ipakahulugang “tagapagtanggol.”
- source_word: אַלְמָנוֹת
  choice: mga balo
  rationale: Ito ang karaniwan at tuwirang katumbas ng pangmaramihang pangngalang tumutukoy sa mga babaeng namatayan ng asawa.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang diwa rito at ito ang simuno ng sugnay na walang hayag na pandiwa.
- source_word: בִּמְעוֹן
  choice: sa ... tahanan
  rationale: Ang מָעוֹן ay tirahan o tahanan, at ang pang-ukol na בְּ ay likas na locative, “sa” o “nasa.” Ang “tahanan” ay natural at malinaw sa modernong Filipino.
- source_word: קָדְשׁוֹ
  choice: kanyang banal
  rationale: Ang literal na anyo ay maaaring unawaing “kanyang kabanalan,” ngunit sa kaugnayan nito sa “tahanan,” natural itong isalin bilang “kanyang banal na tahanan.”
theological_decisions:
- issue: Kung bibigyang-kahulugang mapagtanggol ang דַיַּן
  choice: hukom ng mga balo
  alternative: tagapagtanggol ng mga balo
  rationale: Ipinahihiwatig ng talata na binibigyan ng Diyos ng katarungan ang mga mahina, ngunit ang tuwirang diwang leksikal ay panghukuman. Pinananatili ng “hukom” ang legal na larawan at hindi nilulutas nang tahasan ang ipinahihiwatig nitong proteksiyon.
- issue: Kung ang בִּמְעוֹן קָדְשׁוֹ ay lugar o pinagmumulan ng pagkilos
  choice: sa kanyang banal na tahanan
  alternative: mula sa kanyang banal na tahanan
  rationale: Karaniwang nangangahulugang “sa” ang pang-ukol na בְּ. Posible sa konteksto ang diwang kumikilos ang Diyos “mula sa” kanyang tahanan, ngunit hindi iyon ang pinakatuwirang anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga walang ama” upang mapanatili ang espesipikong kahulugan ng יְתוֹמִים, at “hukom” upang mapanatili ang legal na larawan at teolohikal na tensiyon ng orihinal.
