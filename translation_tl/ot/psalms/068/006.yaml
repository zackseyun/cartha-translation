  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: tl
  text: Pinatitira ng Diyos sa isang tahanan ang mga nag-iisa; inilalabas niya ang mga bilanggo tungo sa kaunlaran[a], ngunit ang mga mapaghimagsik ay naninirahan sa tigang na lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungo sa kasaganaan.” Bihira at hindi tiyak ang salitang Hebreo; inuunawa rin ito ng ilan na “nang may awitan” o bilang ibang pahayag ng masayang paglaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang katawagan sa Diyos ng Israel; isahan ang diwa ayon sa kasunod na mga pandiwa.
- source_word: מוֹשִׁיב
  choice: Inilalagay ... sa isang tahanan
  rationale: Ang Hiphil ng ישׁב ay nagpapahayag ng pagsasanhing manirahan o magkaroon ng matatag na tirahan; likas sa Filipino ang pariralang ito at napapanatili ang sanhiang diwa.
- source_word: יְחִידִים
  choice: ang mga nag-iisa
  rationale: Tumutukoy sa mga taong walang kasama o nakahiwalay; hindi nito nililimitahan ang kahulugan sa damdamin lamang ng kalungkutan.
- source_word: בַּיְתָה
  choice: sa isang tahanan
  rationale: Ang בַּיִת ay maaaring bahay o sambahayan; ang 'tahanan' ay naghahatid ng tirahan at pagkabilang nang hindi ipinapalit ang mas tiyak na 'pamilya.'
- source_word: מוֹצִיא
  choice: inilalabas
  rationale: Ang Hiphil ng יצא ay nangangahulugang pinapalis o pinapalabas; tuwiran at angkop sa paralelismo.
- source_word: אֲסִירִים
  choice: mga bilanggo
  rationale: Malinaw na modernong katumbas para sa mga nakagapos o nakakulong.
- source_word: בַּכּוֹשָׁרוֹת
  choice: tungo sa kasaganaan
  rationale: Bihira at di-tiyak ang salitang Hebreo. Ang 'kasaganaan' ay kumakatawan sa posibleng diwa ng mabuting kalagayan o pag-unlad, habang inilalahad sa talababa ang ibang pagbasa.
- source_word: אַךְ
  choice: ngunit
  rationale: Ipinahahayag dito ang matinding pagsalungat sa mabuting gawa ng Diyos para sa mga mahina.
- source_word: סוֹרֲרִים
  choice: ang mga mapaghimagsik
  rationale: Tumutukoy sa mga matigas na lumalaban o naghihimagsik; malinaw at marangal na Filipino.
- source_word: שָׁכְנוּ
  choice: naninirahan
  rationale: Bagaman ganap ang anyong Hebreo, ginagamit ito nang pangkalahatan sa tula; ang pangkasalukuyang Filipino ay angkop sa salawikaing paghahambing.
- source_word: צְחִיחָה
  choice: tigang na lupain
  rationale: Ipinahahayag ang tuyot at salat-sa-tubig na pook, na kasalungat ng tahanan at kasaganaan.
theological_decisions:
- issue: Diwa ng pagkilos ng Diyos para sa mga nag-iisa
  choice: Binibigyan sila ng Diyos ng matatag na lugar sa isang tahanan.
  alternative: Inilalagay ng Diyos ang mga malungkot sa mga pamilya.
  rationale: Tuwirang binabanggit ng Hebreo ang 'mga nag-iisa' at ang 'bahay/tahanan.' Pinananatili ng salin ang larawang ito at hindi ito nililimitahan sa biyolohikal na pamilya.
- issue: Kahulugan ng בַּכּוֹשָׁרוֹת
  choice: tungo sa kasaganaan
  alternative: nang may awitan; tungo sa kasaganaan o mabuting kalagayan
  rationale: Hindi tiyak ang ugat at kahulugan ng pambihirang anyong ito. Pinili sa teksto ang isang malamang na positibong diwa, ngunit hindi ikinubli ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang balanseng paralelismo at ang pag-iiba ng 'tahanan/kasaganaan' at 'tigang na lupain.'
