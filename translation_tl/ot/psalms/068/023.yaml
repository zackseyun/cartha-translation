lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas na nagpapahayag ng layunin o bunga sa Filipino at pinananatili ang puwersa ng pariralang Hebreo.
- source_word: תִּמְחַץ
  choice: durugin
  rationale: Mula sa מחץ, na nangangahulugang humampas o dumurog. Pinananatili nito ang marahas at kongkretong larawan ng talata.
- source_word: רַגְלְךָ
  choice: ng paa mo
  rationale: Isahan ang anyong Hebreo. Ginawang tagaganap ang “paa mo,” gaya ng pinahihintulutan ng anyo ng pandiwa at ng konteksto.
- source_word: בְּדָם
  choice: sa dugo
  rationale: Pinananatiling malapit sa malawak na gamit ng pang-ukol na ב at sa matingkad na larawan ng paa na dumudurog sa gitna ng dugo.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: ang dila ng iyong mga aso
  rationale: Pinananatili ang kolektibong isahang “dila” kasama ng maramihang “mga aso,” nang hindi ginagawang mas tiyak kaysa sa Hebreo.
- source_word: מֵאֹיְבִים
  choice: mula sa mga kaaway
  rationale: Ang מן ay nagsasaad ng pinagmulan; ang matatanggap ng mga aso ay mula sa mga natalong kaaway.
- source_word: מִנֵּהוּ
  choice: magkaroon ng bahagi
  rationale: Napakahirap at eliptikal ng pangwakas na anyo. Ang kontekstuwal na “magkaroon ng bahagi” ay nagbibigay ng mauunawaang Filipino, habang inilalahad sa talababa ang mas literal na anyong “mula sa kanya.”
theological_decisions:
- issue: Marahas na larawan ng paghatol at tagumpay
  choice: Panatilihin ang konkretong larawan ng paa, dugo, at mga asong kumukuha mula sa mga kaaway
  alternative: Palambutin ito bilang pangkalahatang pahayag lamang ng tagumpay
  rationale: Tahasang marahas ang larawang Hebreo. Hindi ito dapat pahinain o gawing abstrakto dahil lamang sa pagiging mabigat nito sa makabagong mambabasa.
- issue: Hindi tiyak na sintaks at elipsis sa huling linya
  choice: Gumamit ng malinaw ngunit maingat na kontekstuwal na salin at ilahad ang literal na kahirapan sa talababa
  alternative: Ipilit ang “mula sa kanya” sa pangunahing teksto o tukuyin nang walang pasubali kung ano ang kinakain ng mga aso
  rationale: Pinananatili nito ang tunay na kalabuan ng Hebreo nang hindi ginagawang halos hindi mauunawaan ang pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal at tuwiran. Pinanatili ang matinding imahen ng Hebreo, ang isahang “paa” at “dila,” at ang kalabuan ng pangwakas na parirala sa pamamagitan ng talababa.
