  text: Kayong mga kaharian ng daigdig, umawit kayo sa Diyos; umawit kayo ng papuri sa Panginoon[a]—Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tumugtog kayo para sa Panginoon.”
    reason: Maaaring saklawin ng זַמְּרוּ ang pag-awit ng papuri o ang pagtugtog bilang musikal na papuri.
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: mga kaharian sa buong lupa
  rationale: Ang parirala ay tumutukoy sa mga sakop na pampolitika sa buong daigdig. Idinagdag ang “buong” upang likas na maipahayag sa Filipino ang pangkalahatang saklaw ng panawagan.
- source_word: שִׁירוּ
  choice: umawit kayo
  rationale: Pautos na maramihan ito at tuwirang nananawagan sa mga kaharian na umawit.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Tinutukoy ng ל ang pinatutungkulan ng awit; natural itong ipahayag bilang “sa Diyos.”
- source_word: זַמְּרוּ
  choice: umawit kayo ng papuri
  rationale: Ang pandiwa ay tumutukoy sa musikal na pagpupuri. Pinananatili ng saling ito ang diwa ng pagsamba habang nananatiling natural sa modernong Filipino.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang titulong Adonai, hindi ang banal na pangalang YHWH; kaya isinalin bilang “Panginoon,” hindi “PANGINOON.”
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong tungkuling liturhikal o musikal ng salita, kaya pinanatili itong transliterado sa halip na bigyan ng mapagpasiyang interpretasyon.
theological_decisions:
- issue: Paglalarawan sa mga kaharian bilang kinakausap nang tuwiran
  choice: Kayong mga kaharian sa buong lupa
  alternative: Mga kaharian sa buong lupa
  rationale: Ang “kayong” ay likas na panandang pantawag sa Filipino at nililinaw ang direktang panawagan nang hindi binabago ang kahulugan.
- issue: Pagsasalin sa titulong אֲדֹנָי
  choice: Panginoon
  alternative: Aking Panginoon
  rationale: Bagaman makikita sa anyo ng salita ang historikal na hulaping unang panauhan, ginagamit dito ang אֲדֹנָי bilang kinikilalang banal na titulo. Ang “Panginoon” ang natural at hindi sektaryong salin.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ginamit ang “kayong” para sa natural na pantawag at pinanatili ang “Selah” dahil hindi tiyak ang kahulugan nito.
