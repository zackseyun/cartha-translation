  source_fidelity: 'Ang unang dalawang sugnay ay tapat sa Hebreo: ang mga mang-aawit ay nasa unahan at ang mga manunugtog ay kasunod. Gayunman, ang “sa gitna nila” ay nagdaragdag ng isang panghalip na maaaring magpahiwatig na nasa pagitan ng dalawang naunang pangkat ang mga kabataang babae. Mas malapit sa בְּתוֹךְ עֲלָמוֹת ang “sa gitna ng mga kabataang babae,” na pinananatili rin ang masiksik at bahagyang eliptikong larawan ng prusisyon.'
  naturalness: Likas at angkop ang “mga mang-aawit” at “mga manunugtog.” Ang “pumapalo ng mga tamburin” ay mas tiyak na naglalarawan sa perkusibong kilos ng תּוֹפֵפוֹת kaysa “tumutugtog ng tamburin,” at natural pa rin sa makabagong Filipino.
  terminology: Ang “mga kabataang babae” ay wastong katapat ng עֲלָמוֹת at hindi nagdaragdag ng kahulugang “birhen.” Iniaayos ang talababa upang ang alternatibong leksikal ay tumukoy talaga sa Hebreong עֲלָמוֹת, sa halip na malabong iugnay ang buong parirala sa isang salita.
  issues:
