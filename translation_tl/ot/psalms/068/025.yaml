lexical_decisions:
- source_word: קִדְּמוּ
  choice: Nauna
  rationale: Ang Piel perfect na anyo ng קדם ay naglalarawan sa mga nasa unahan ng prusisyon. Likas at maikli sa Filipino ang “nauna.”
- source_word: שָׁרִים
  choice: mga mang-aawit
  rationale: Mula ito sa ugat na שׁיר, “umawit,” at kaagapay ng mga manunugtog sa larawan ng prusisyon; hindi ito ang salitang nangangahulugang “mga pinuno.”
- source_word: אַחַר
  choice: sumunod
  rationale: Ipinapahayag nito ang ayos o puwesto ng kasunod na pangkat sa prusisyon. Ginawang pandiwa sa Filipino upang maging malinaw at natural ang putol na patulang sugnay sa Hebreo.
- source_word: נֹגְנִים
  choice: mga manunugtog
  rationale: Tumutukoy sa mga tumutugtog ng instrumentong pangmusika. Mas tiyak ito kaysa sa pangkalahatang “mga musikero” at mahusay na katapat ng “mga mang-aawit.”
- source_word: בְּתוֹךְ
  choice: sa gitna nila
  rationale: Pinananatili nito ang larawang pangkalagayan sa loob ng prusisyon. Ang “nila” ay likas na pantukoy sa mga nabanggit na pangkat, bagaman hindi tahasang nakasaad ang panghalip sa Hebreo.
- source_word: עֲלָמוֹת
  choice: mga kabataang babae
  rationale: Tumutukoy sa mga babaeng nasa kabataan o edad na maaaring mag-asawa. Hindi ginamit ang “mga birhen” sapagkat maaaring magdagdag iyon ng katiyakang hindi hinihingi ng salita rito.
- source_word: תּוֹפֵפוֹת
  choice: tumutugtog ng tamburin
  rationale: Ang anyo ay tumutukoy sa pagpatunog o pagpalo ng תֹּף. Ang “tumutugtog ng tamburin” ay malinaw at likas sa kasalukuyang Filipino habang taglay ang kilos na musikal.
