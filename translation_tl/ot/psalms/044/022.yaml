  - marker: b
    text: Maaari ring isalin na “ibinibilang kaming mga tupang kakatayin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang hinaing at likas na nag-uugnay sa daloy ng salmo.
- source_word: עָלֶיךָ
  choice: alang-alang sa iyo
  rationale: Ipinahahayag nito na ang pagdurusa ay dinaranas kaugnay ng Diyos o dahil sa katapatan sa kanya, nang hindi tahasang ginagawang Diyos ang sanhi ng pagpatay.
- source_word: הֹרַגְנוּ
  choice: kaming pinapatay
  rationale: Bagaman nasa anyong perfect ang Hebreo, ang panaghoy at ang pariralang כָל הַיּוֹם ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na karanasan.
- source_word: כָל הַיּוֹם
  choice: buong maghapon
  rationale: Natural na makabagong Tagalog ito para sa patuloy na tagal sa buong araw.
- source_word: נֶחְשַׁבְנוּ
  choice: itinuturing kaming
  rationale: Malinaw nitong ipinapahayag ang pasibong diwa ng pagtingin o pagkilala sa kanila bilang isang bagay.
- source_word: כְּצֹאן טִבְחָה
  choice: mga tupang kakatayin
  rationale: Natural at marangal na salin ito ng paghahambing sa mga tupang nakalaan sa pagkatay.
theological_decisions:
- issue: Kung ipinahihiwatig ng talata na ang Diyos ang sanhi ng pagdurusa o na dinaranas ito dahil sa kaugnayan at katapatan sa Diyos
  choice: alang-alang sa iyo
  alternative: dahil sa iyo; dahil sa aming kaugnayan sa iyo
  rationale: Pinananatili ng pangunahing salin ang ugnayan ng pagdurusa sa Diyos nang hindi nilulutas ang tensiyon sa pamamagitan ng tahasang pagsisi sa Diyos o labis na pagpapaliwanag sa motibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong maghapon” at “mga tupang kakatayin” upang maging natural sa karaniwang mambabasa habang pinananatili ang matinding larawang patula at ang teolohikal na tensiyon ng Hebreo.
