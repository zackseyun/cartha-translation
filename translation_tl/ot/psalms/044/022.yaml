  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: tl
  text: Sapagkat alang-alang sa iyo[a], buong maghapon kaming pinapatay; itinuturing[b] kaming mga tupang kakatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dahil sa iyo” o “dahil sa aming kaugnayan sa iyo.”
