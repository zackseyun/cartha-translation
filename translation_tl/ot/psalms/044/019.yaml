  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: tl
  text: Gayunman, dinurog mo kami sa lugar ng mga tsakal[b] at tinakpan mo kami ng matinding kadiliman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng lilim ng kamatayan.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na “mga tsakal” ang kahulugan dito bilang larawan ng isang tiwangwang na lugar; “mga dragon” ang mababasa sa ilang matatandang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Gayunman
  rationale: 'Sa ugnayan nito sa naunang pahayag na hindi tumalikod ang bayan, gumaganap dito ang כִּי bilang panandang pasalungat o concessive: sa kabila niyon, dinurog sila ng Diyos.'
- source_word: דִכִּיתָנוּ
  choice: dinurog mo kami
  rationale: Pinananatili ng “dinurog” ang marahas at matinding larawan ng pandiwang דכה, pati ang tahasang pagtukoy sa Diyos bilang gumagawa.
- source_word: בִּמְקוֹם תַּנִּים
  choice: sa lugar ng mga tsakal
  rationale: Malamang na tumutukoy ang תַּנִּים sa mga tsakal bilang larawan ng isang tiwangwang na lugar. Pinananatili ng payak na parirala ang anyong patula ng Hebreo.
- source_word: וַתְּכַס עָלֵינוּ
  choice: at tinakpan mo kami
  rationale: Pinananatili nito ang konkretong talinghaga ng pagtatakip at ang pagpapatuloy ng tuwirang pakikipag-usap sa Diyos.
- source_word: בְצַלְמָוֶת
  choice: ng matinding kadiliman
  rationale: Maaaring tumukoy ang צַלְמָוֶת sa napakalalim na dilim o sa “lilim ng kamatayan.” Malinaw at natural ang pangunahing salin, samantalang nasa talababa ang tradisyonal na alternatibo.
theological_decisions:
- issue: Ang Diyos ang tahasang gumagawa ng pagdurog at pagtatakip
  choice: Pinanatili ang ikalawang panauhang “dinurog mo” at “tinakpan mo.”
  alternative: Gumamit ng di-tahasang pananalita na hindi pinapangalanan ang gumagawa.
  rationale: Tahasang kinakausap ng salmista ang Diyos sa Hebreo. Hindi dapat pahupain ang teolohikal na tensiyon ng panaghoy.
- issue: Kahulugan ng בְצַלְמָוֶת
  choice: matinding kadiliman
  alternative: lilim ng kamatayan
  rationale: Maaaring leksikalisadong pahayag ito para sa napakalalim na dilim, ngunit tunay ding alternatibo ang tradisyonal na pagbasa. Inilagay ang alternatibo sa talababa upang hindi alisin ang ambiguwidad.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “tsakal” bilang tiyak na pangalan ng hayop, na nilinaw sa talababa; iniwasang gawing mas banayad ang matinding panaghoy ng Hebreo.
