  text: Ginawa mo kaming kasiraan sa aming mga kapitbahay, katatawanan at panlilibak sa mga nakapaligid sa amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Ginawa mo kami
  rationale: 'Ang שׂים ay nangangahulugang ‘ilagay’ o ‘gawin.’ Sa konteksto ng panaghoy at sa anyong Hebreong perfect, malinaw at natural sa Tagalog ang resulta: ‘Ginawa mo kami.’'
- source_word: חֶרְפָּה
  choice: kahiya-hiya
  rationale: Ipinahihiwatig ng חֶרְפָּה ang kahihiyan, paghamak, o pag-alipusta sa paningin ng iba. Ang ‘kahiya-hiya’ ay likas sa modernong Tagalog at naipapakita ang kalagayan nilang hinahamak ng mga kalapit-bayan.
- source_word: לִשְׁכֵנֵינוּ
  choice: sa aming mga kalapit-bayan
  rationale: Ang ל ay tumutukoy sa mga taong tumitingin sa Israel nang may paghamak, at ang שְׁכֵנִים dito ay ang mga karatig na pamayanan o bayan. Nililinaw ng ‘mga kalapit-bayan’ ang kolektibong sanggunian.
- source_word: לַעַג
  choice: pinagtatawanan
  rationale: Ang לַעַג ay mapanlibak na pagtawa o panunuya. Ang ‘pinagtatawanan’ ay natural na Tagalog at malinaw na naghahayag ng pampublikong pangungutya.
- source_word: קֶלֶס
  choice: nililibak
  rationale: Ang קֶלֶס ay paglibak o mapanghamak na panunuya. Pinananatili ng ‘nililibak’ ang kaibhan ngunit pagkakatulad nito sa naunang לַעַג.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: ng mga nakapaligid sa amin
  rationale: Literal itong tumutukoy sa mga nasa palibot, malamang ay mga nakapaligid na bayan o bansa. Pinananatiling malawak ng salin ang sanggunian gaya ng Hebreo.
theological_decisions:
- issue: Ang Diyos ang tuwirang paksa ng pagkilos
  choice: Pinanatili ang ‘Ginawa mo,’ na tuwirang kumakausap sa Diyos.
  alternative: Gawin itong di-tuwiran, gaya ng ‘Naging kahiya-hiya kami.’
  rationale: Malinaw sa pandiwang Hebreo ang ikalawang panauhang panlalaking isahan bilang paksa. Mahalaga sa tensiyon ng panaghoy na ang salmista ay nag-uukol ng pangyayaring ito sa Diyos, kaya hindi ito dapat palabuin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkatambal na ‘pinagtatawanan at nililibak’ upang tularan ang dalawang magkalapit ngunit hindi ganap na magkaparehong salitang Hebreo. Walang talababa dahil sapat na nailalahad sa teksto ang pampublikong pangungutya.
