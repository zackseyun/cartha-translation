  text: מִ֭/קּוֹל מְחָרֵ֣ף וּ/מְגַדֵּ֑ף מִ/פְּנֵ֥י א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/016.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: tl
  text: Dahil sa tinig ng nanlalait at lumalapastangan,[a] dahil sa kaaway at naghihiganti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanlalait at nang-aalipusta.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mula sa harap ng kaaway at naghihiganti,” isang idyomang nangangahulugang “dahil sa” o “dulot ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: dahil sa tinig ng
  rationale: Ipinahahayag ng מִן dito ang sanhi, habang pinananatili ng “tinig” ang kongkretong larawan ng Hebreo.
- source_word: מְחָרֵף
  choice: nanlalait
  rationale: Likas at kasalukuyang salitang Filipino para sa taong nagsasalita nang may paghamak; pinananatili rin nito ang anyong pangkasalukuyang participle.
- source_word: וּמְגַדֵּף
  choice: at lumalapastangan
  rationale: Naipahihiwatig ng “lumalapastangan” kapuwa ang mapang-abusong pananalita at ang posibleng paglapastangan sa Diyos, nang hindi nililimitahan ang diwa sa isa lamang.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Bagaman literal na tumutukoy sa mukha o presensiya, idyomatiko itong nagpapahayag ng sanhi o dahilan sa kontekstong ito.
- source_word: אֹיֵב
  choice: kaaway
  rationale: Direkta at natural na katumbas na nagpapanatili sa isahang anyo ng Hebreo.
- source_word: וּמִתְנַקֵּם
  choice: at naghihiganti
  rationale: 'Pinananatili ang personal at aktibong diwa ng Hitpael participle: isang taong gumaganti o naghihiganti.'
theological_decisions:
- issue: Kung ang גדף ay tumutukoy lamang sa pang-aalipusta sa tao o maaari ring magpahiwatig ng paglapastangan sa Diyos
  choice: lumalapastangan
  alternative: nang-aalipusta
  rationale: Ang “lumalapastangan” ay nagpapanatili sa mas mabigat at posibleng panrelihiyong diwa ng salita, ngunit maaari pa ring tumukoy sa matinding paghamak; hindi nito tahasang nilulutas kung sino ang tuwirang nilalapastangan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “dahil sa” at ang kongkretong “tinig” upang masalamin ang paralelismo at larawan ng Hebreo.
