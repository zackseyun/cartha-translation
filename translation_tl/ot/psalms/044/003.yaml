  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: tl
  text: Sapagkat hindi nila naangkin ang lupain sa pamamagitan ng kanilang tabak, at hindi sila iniligtas ng kanilang bisig. Ngunit naangkin nila iyon at naligtas sila dahil sa iyong kanang kamay, sa iyong bisig, at sa liwanag ng iyong mukha[a], sapagkat kinalugdan mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “liwanag ng iyong presensya.” Literal sa Hebreo ang “liwanag ng iyong mukha,” isang larawan ng paglingap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: naangkin
  rationale: Maaaring mangahulugang magmana, magtaboy upang angkinin, o magmay-ari ang ירשׁ. Sa konteksto ng pagsakop sa lupain, malinaw at likas ang “naangkin” nang hindi ipinahihiwatig na pasibo lamang itong minana.
- source_word: אָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa tiyak na lupaing inangkin, hindi sa buong daigdig; ang “lupain” ay angkop sa makasaysayang konteksto.
- source_word: זְרוֹעָם
  choice: kanilang bisig
  rationale: Pinananatili ang larawang pangkatawan at ang pagtutulad nito sa bisig ng Diyos, sa halip na gawing payak na “lakas.”
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: hindi sila iniligtas
  rationale: Pinananatili ang pangunahing diwa ng pagliligtas ng ישׁע, habang nananatiling angkop sa kontekstong militar.
- source_word: יְמִינְךָ
  choice: iyong kanang kamay
  rationale: Pinananatili ang Hebreong larawan para sa makapangyarihang pagkilos ng Diyos.
- source_word: זְרוֹעֲךָ
  choice: iyong bisig
  rationale: Pinananatili ang matalinghagang larawan at ang tuwirang kaibahan sa “kanilang bisig.”
- source_word: אוֹר פָּנֶיךָ
  choice: liwanag ng iyong mukha
  rationale: Literal na pinananatili ang mayamang larawan ng banal na paglingap; ang “presensya” ay inilagay bilang posibleng pagpapakahulugan sa talababa.
- source_word: רְצִיתָם
  choice: kinalugdan mo sila
  rationale: Ipinahahayag nito ang personal na pagkalugod at paglingap ng Diyos nang hindi dinaragdagan ang teksto ng mas tiyak na doktrinal na paliwanag.
- source_word: כִּי ... כִּי
  choice: Sapagkat ... sapagkat
  rationale: Ang una ay nagpapaliwanag sa naunang pahayag, at ang huli ay nagbibigay ng dahilan ng pagkilos ng Diyos. Likas sa marangal na tulang Filipino ang pag-uulit dito.
theological_decisions:
- issue: Pagkilos ng Diyos laban sa kapangyarihang militar ng tao
  choice: Malinaw na iniuukol sa kanang kamay, bisig, at paglingap ng Diyos ang pag-angkin sa lupain at pagliligtas, hindi sa sandata o lakas ng Israel.
  alternative: Isang pangkalahatang pahayag lamang tungkol sa pag-asa sa Diyos.
  rationale: Tahasang pinaghahambing ng Hebreo ang “kanilang tabak/kanilang bisig” at “iyong kanang kamay/iyong bisig/liwanag ng iyong mukha.” Hindi pinalalawak ang pahayag lampas sa sinasabi ng talata.
- issue: Ang אוֹר פָּנֶיךָ bilang larawan ng paglingap o presensya
  choice: Pinanatili sa pangunahing teksto ang “liwanag ng iyong mukha.”
  alternative: liwanag ng iyong presensya; iyong paglingap
  rationale: Ipinahihiwatig ng parirala ang banal na paglingap at presensya, ngunit mahalagang huwag alisin ang mismong larawang Hebreo o ikulong ito sa iisang pagpapakahulugan.
- issue: Walang tahasang pandiwa sa positibong sugnay
  choice: Inulit nang maikli ang dalawang kinalabasan—“naangkin nila iyon at naligtas sila”—upang maging buo at natural sa Filipino.
  alternative: 'Panatilihin ang elipsis: “kundi ang iyong kanang kamay, ang iyong bisig, at ang liwanag ng iyong mukha.”'
  rationale: Sa Hebreo, nauunawaan mula sa naunang sugnay ang mga kilos. Ang maikling pag-uulit sa Filipino ay nagpapalinaw sa parehong kinalabasan nang hindi nagdaragdag ng bagong teolohikal na pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang poetikong mga larawang “tabak,” “bisig,” “kanang kamay,” at “liwanag ng iyong mukha,” habang bahagyang nilinaw ang elipsis ng Hebreo upang maging natural ang pangungusap.
