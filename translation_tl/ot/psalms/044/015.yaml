  text: 'Buong araw, nasa harap ko ang aking kahihiyan,


    at binalot ako ng kahihiyan sa aking mukha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at binalot ako ng kahihiyan sa aking mukha.” Mas literal sa Hebreo: “at binalot ako ng kahihiyan ng aking mukha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Buong araw
  rationale: Likas na pariralang Filipino na nagpapahayag na nagpapatuloy ito sa kabuuan ng araw.
- source_word: כְּלִמָּתִי
  choice: ang aking kahihiyan
  rationale: Tumutukoy ito sa pagkapahiya o pampublikong pagkadusta; pinananatili ng “kahihiyan” ang panlipunang bigat ng salita.
- source_word: נֶגְדִּי
  choice: nasa harap ko
  rationale: Tuwirang inilalarawan ang isang bagay na laging kaharap o nasa kamalayan ng nagsasalita.
- source_word: וּבֹשֶׁת פָּנַי
  choice: at hiya sa aking mukha
  rationale: Pinananatili ang konkretong larawan ng mukha at ang posibleng diwa na nakikita o nadarama roon ang hiya, habang iniiwasang gawing lubhang di-likas ang literal na “hiya ng aking mukha.”
- source_word: כִּסָּתְנִי
  choice: nilukob ako
  rationale: Ang ugat ay nangangahulugang “takpan.” Ang “nilukob” ay natural sa Filipino at pinananatili ang metapora ng hiyang bumabalot sa nagsasalita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang paralelismong “kahihiyan/hiya” upang katawanin ang magkaugnay ngunit magkaibang salitang Hebreo, at pinanatili sa talababa ang mas literal at sadyang αmbiguong ugnayan ng “hiya” at “mukha.”
