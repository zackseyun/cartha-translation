  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: tl
  text: 'Kung nakalimutan namin ang pangalan ng aming Diyos,


    at iniunat namin ang aming mga kamay sa isang diyos na banyaga—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang diyos na dayuhan.” Ang pang-uri sa Hebreo ay maaaring mangahulugang “banyaga,” “dayuhan,” o “iba,” sa diwa ng diyos na hindi kabilang sa tipanang pagsamba ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Likas na panandang kondisyon sa Tagalog at pinananatili ang hipotetikal na pahayag.
- source_word: שָׁכַחְנוּ
  choice: nilimot namin
  rationale: Ang Qal perfect na unang panauhang maramihan ay nagpapahayag ng ipinapalagay na nagawang paglimot; malinaw ito sa kontekstong kondisyonal.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: ang pangalan ng aming Diyos
  rationale: Pinananatili ang konkretong Hebreong pananalita, kung saan ang pangalan ay kumakatawan sa kinikilalang pagkakakilanlan ng Diyos, nang hindi ito ipinapaliwanag sa mismong talata.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: at iniunat ang aming mga kamay
  rationale: Ang פרשׂ kasama ng כַּף ay tumutukoy sa pag-uunat o pagbubukas ng mga kamay bilang kilos ng panalangin o pagsamo. Natural sa modernong Tagalog ang 'iniunat ang aming mga kamay' at hindi nito tahasang pinapalitan ang larawan ng salitang 'sumamba.'
- source_word: לְאֵל זָר
  choice: sa isang diyos na banyaga
  rationale: Ang לְ ay nagsasaad ng pinatutunguhan ng kilos, at ang זָר ay tumutukoy sa diyos na hindi kabilang sa pagsambang tipan ng Israel. Malinaw ang 'banyaga' habang pinananatili ang leksikal na saklaw.
theological_decisions:
- issue: Kilos na kaugnay ng idolatriya
  choice: iniunat ang aming mga kamay sa isang diyos na banyaga
  alternative: sumamba kami sa ibang diyos
  rationale: Pinananatili ng salin ang konkretong kilos ng panalangin o pagsamo sa Hebreo at hindi tahasang nilulutas iyon sa mas malawak na pandiwang 'sumamba.'
- issue: Kahulugan ng זָר
  choice: diyos na banyaga
  alternative: ibang diyos
  rationale: Ang 'banyaga' ay nagpapanatili sa diwa ng pagiging dayuhan o hindi kabilang sa tipanang pagsamba, samantalang ang 'ibang diyos' ay mas interpretatibo at maaaring mawala ang partikular na kulay ng זָר.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'nilimot' at 'iniunat' para sa natural na daloy at patulang anyo; pinanatili ang konkretong larawan at ang gitling sa dulo dahil nagpapatuloy ang kondisyonal na pangungusap sa kasunod na talata.
