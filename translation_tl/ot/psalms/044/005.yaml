  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: tl
  text: Sa pamamagitan mo ay itataboy namin ang aming mga kaaway[a]; sa pamamagitan ng iyong pangalan[b] ay yuyurakan namin ang mga bumabangon laban sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay literal na “susuwagin namin,” gaya ng pagsuwag ng hayop gamit ang mga sungay; dito, larawan ito ng malakas na pagtataboy sa mga kaaway.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa iyong pangalan.” Ang “pangalan” dito ay tumutukoy sa nahayag na pagkakakilanlan, awtoridad, at kapangyarihan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Sa pamamagitan mo
  rationale: 'Ipinahahayag ng בְּ dito ang paraan o ahensiya: ang Diyos ang pinagmumulan ng tagumpay, habang kumikilos pa rin sa labanan ang bayan.'
- source_word: צָרֵינוּ
  choice: ang aming mga kaaway
  rationale: Likas at malinaw na salin para sa mga aktibong kalaban o katunggali.
- source_word: נְנַגֵּחַ
  choice: maitataboy namin
  rationale: Ang pandiwa ay literal na tumutukoy sa pagsuwag gamit ang sungay, ngunit metaporikal dito para sa marahas na pagpapa退 o pagtataboy sa kalaban. Pinananatili ng 'maitataboy' ang puwersa at direksiyon ng larawan nang natural sa Filipino.
- source_word: בְּשִׁמְךָ
  choice: sa pamamagitan ng iyong pangalan
  rationale: Pinananatili nito ang pagkakapantay sa unang parirala at ipinakikitang ang tagumpay ay sa kapangyarihan at awtoridad na kinakatawan ng pangalan ng Diyos, hindi sa isang tunog o pormula lamang.
- source_word: נָבוּס
  choice: yuyurakan namin
  rationale: Tuwirang inilalarawan ng בוס ang pagtapak o pagyurak; matingkad at angkop ito sa larawang pandigma.
- source_word: קָמֵינוּ
  choice: mga bumabangon laban sa amin
  rationale: Pinananatili ang pandiwang diwa ng participle mula sa קום sa halip na gawing pangkalahatang 'mga kaaway' lamang.
theological_decisions:
- issue: Ang ahensiya ng tagumpay sa larawang pandigma
  choice: Iniuugnay ang tagumpay sa Diyos bilang paraan at mapagpasyang pinagmumulan—'sa pamamagitan mo' at 'sa pamamagitan ng iyong pangalan'—habang ang bayan ang inilalarawang nagtataboy at yumuyurak.
  alternative: Maaaring idiin lamang ang kilos-militar ng bayan, o unawain ang 'pangalan' bilang isang pormulang binibigkas.
  rationale: Inilalagay ng magkatulad na pariralang may בְּ ang Diyos bilang pinagmumulan ng tagumpay, ngunit hindi inaalis ang aktuwal na pakikibahagi ng bayan. Pinananatili nito ang tensiyon ng banal na ahensiya at pagkilos ng tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang makatang himig. Ginamit ang 'kaaway,' 'maitataboy,' at 'yuyurakan' bilang karaniwang salitang nauunawaan, habang pinanatili ang paralelismo at matinding larawang pandigma ng Hebreo.
