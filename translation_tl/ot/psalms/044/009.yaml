  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: tl
  text: Ngunit itinakwil mo kami at ipinahiya mo kami, at hindi ka lumalabas kasama ng aming mga hukbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “hindi ka lumalabas sa aming mga hukbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ngunit
  rationale: Ipinahihiwatig ng pantukoy ang matalim na pagsalungat sa naunang paggunita sa pagtulong ng Diyos; natural at malinaw itong naipapahayag ng “Ngunit.”
- source_word: זָנַחְתָּ
  choice: itinakwil mo
  rationale: Ang pandiwa ay nangangahulugang tumanggi o magtaboy. Pinananatili ng “itinakwil” ang matinding ugnayang-damdamin ng hinaing.
- source_word: וַתַּכְלִימֵנוּ
  choice: at inilagay sa kahihiyan
  rationale: 'Ang Hiphil ng כלם ay causative: ang sanhi ng pagkapahiya. Malapit dito ang dignidad at anyo ng “inilagay sa kahihiyan” nang hindi dinaragdagan ang diwa.'
- source_word: וְלֹא תֵצֵא
  choice: at hindi ka lumalabas
  rationale: Pinananatili ang karaniwang kahulugan ng יצא na “lumabas,” pati ang larawan ng paglabas patungo sa labanan, sa halip na tahasang ipakahulugang “nakikipagdigma.”
- source_word: בְּצִבְאוֹתֵינוּ
  choice: na kasama ng aming mga hukbo
  rationale: Sa kontekstong militar, ang צבאות ay mga hukbo. Ang “kasama ng” ay natural na salin ng ugnayang ipinahihiwatig ng ב, habang ang higit na literal na posibilidad ay inilalagay sa talababa.
theological_decisions:
- issue: Paglalarawan sa hindi pagsama ng Diyos sa labanan
  choice: Isinalin bilang hinaing na hindi na lumalabas ang Diyos kasama ng mga hukbo ng bayan.
  alternative: “Hindi ka lumalabas sa gitna ng aming mga hukbo.”
  rationale: Pinananatili nito ang tensiyon ng salmo tungkol sa naranasang pagtatakwil at pagkawala ng tulong ng Diyos, nang hindi nagpapasya kung paano ito dapat ipaliwanag sa mas malawak na doktrina.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hukbo” para sa malinaw na kontekstong militar at pinanatili ang konkretong larawan ng Diyos na “lumalabas” kasama ng bayan sa labanan.
