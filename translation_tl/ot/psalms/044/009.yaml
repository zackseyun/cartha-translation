  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: adversative ang אַף, ang זנח ay pagtatakwil, ang Hiphil ng כלם ay pagpapahiya, at ang Diyos ay hindi lumalabas kasama ng mga hukbo ng bayan. Gayunman, kulang ang pandiwang "inilagay sa kahihiyan" sa tahasang pagmamarka sa Diyos bilang gumaganap, samantalang malinaw ang ikalawang panauhan at unang panauhang panghalip na layon sa Hebreo.'
  naturalness: Ang "ipinahiya mo kami" ay mas natural at tuwirang modernong Filipino kaysa "inilagay sa kahihiyan." Ang "hindi ka lumalabas kasama ng aming mga hukbo" ay nananatiling malinaw at marangal.
  terminology: Ang "itinakwil," "ipinahiya," at "mga hukbo" ay angkop sa panaghoy ng salmo at sa kontekstong militar. Inayos ang talababa dahil ang "sa gitna ng" ay nagpapasok ng kahulugang hindi tahasang nasa Hebreong בְּ; ang mas literal na "sa aming mga hukbo" ay sapat na nagmamarka sa preposisyong "sa/in."
