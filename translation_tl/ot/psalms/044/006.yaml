  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: tl
  text: Sapagkat hindi ako nagtitiwala sa aking pana,[a] at hindi ako inililigtas[b] ng aking espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat hindi ako magtitiwala sa aking pana, at hindi ako ililigtas ng aking espada.” Maaaring magkaroon ng diwang panghinaharap ang mga pandiwang imperfect sa Hebreo.'
    reason: lexical_alternative
  - marker: b
    text: Ang “inililigtas ako” ay maaari ring isaling “binibigyan ako ng tagumpay” o “sinasagip ako” sa kontekstong ito ng digmaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng pahayag sa konteksto at likas ang daloy sa makatang Filipino.
- source_word: בְקַשְׁתִּי
  choice: sa aking pana
  rationale: Ang קֶשֶׁת ay panang sandata; ang pang-ukol na ב ay kaugnay ng pandiwang בטח, kaya ang diwa ay pagtitiwala sa pana.
- source_word: אֶבְטָח
  choice: hindi ako nagtitiwala
  rationale: Ang Qal ng בטח ay nangangahulugang magtiwala o umasa. Ang aspektong imperfect dito ay maaaring magpahayag ng pangkalahatan o patuloy na saloobin, bagaman posible rin ang hinaharap na diwa.
- source_word: וְחַרְבִּי
  choice: at ... ang aking espada
  rationale: Pinananatili ang pangatnig at ang paralelismo ng dalawang sandata. Ang 'espada' ay karaniwan at malinaw na modernong katumbas ng חֶרֶב.
- source_word: תוֹשִׁיעֵנִי
  choice: hindi ako inililigtas
  rationale: Ang Hiphil ng ישׁע ay maaaring mangahulugang magligtas, magpalaya, o magbigay ng tagumpay. Pinananatili ng 'inililigtas' ang mas malawak na saklaw ng salita at ang pangkalahatang diwa ng linya.
theological_decisions:
- issue: Saklaw ng wikang tumutukoy sa pagliligtas sa konteksto ng digmaan
  choice: inililigtas ako
  alternative: binibigyan ako ng tagumpay; sinasagip ako
  rationale: Bagaman ang tagumpay sa labanan ay angkop sa konteksto, hindi ito lamang ang maaaring diwa ng ישׁע. Pinananatili ng 'inililigtas' ang mas malawak na teolohikal at makatang saklaw nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
- issue: Panahunan o modal na diwa ng mga pandiwang imperfect
  choice: pangkasalukuyan o pangkalahatang pahayag
  alternative: 'hinaharap: ''hindi ako magtitiwala ... hindi ako ililigtas'''
  rationale: Maaaring basahin ang mga imperfect bilang pangkalahatang saloobin sa konteksto, ngunit tunay ding posible ang hinaharap na diwa; inilalahad ito sa talababa sa halip na tahimik na lutasin ang ambiguwidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'pana' at 'espada' bilang natural na tawag sa mga sandata, at pinanatili ang maikli at balanseng paralelismo ng tulang Hebreo.
