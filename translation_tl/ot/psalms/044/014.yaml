translation:
  language: tl
  text: 'Ginagawa mo kaming kasabihan sa gitna ng mga bansa[a],


    at paksa ng pag-iling ng ulo sa gitna ng mga bayan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bansag na mapanlibak sa gitna ng mga bansa.” Ang salitang Hebreo ay maaaring tumukoy sa isang kasabihan o sa katawagang ginagamit sa panunuya.
    reason: lexical_alternative
  - marker: b
    text: Literal, “pag-iling ng ulo,” isang kilos ng panunuya o paghamak.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Ginagawa mo kaming
  rationale: Ang שׂים ay maaaring mangahulugang “ilagay” o “gawin.” Sa panaghoy na ito, malinaw at natural na ipinahahayag ng “ginagawa mo kaming” ang resultang idinudulot ng Diyos sa kanila, habang pinananatili ang tuwirang pakikipag-usap sa kaniya.
- source_word: מָשָׁל
  choice: kasabihan
  rationale: Maaaring tumukoy ang מָשָׁל sa kawikaan, kasabihan, o bansag na mapanlibak. Ang “kasabihan” ay likas sa modernong Filipino at pinananatili ang lawak ng salitang Hebreo; nililinaw ng kasunod na taludtod ang mapanlait na diwa.
- source_word: בַּגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa mga bansa o mga banyagang bayan sa pangkalahatan, hindi sa isang teknikal na katawagang panrelihiyon.
- source_word: מְנוֹד רֹאשׁ
  choice: iniiling-ilingan kami
  rationale: Ang parirala ay literal na larawan ng pag-iling ng ulo bilang kilos ng panunuya o paghamak. Ginawang pandiwang Filipino upang maging natural habang nananatili ang kongkretong kilos.
- source_word: בַּל אֻמִּים
  choice: ng mga bayan
  rationale: Ang אֻמִּים ay kahilera ng “mga bansa.” Ang “mga bayan” ay nagpapanatili sa poetikong pagkakaiba ng dalawang magkasingkahulugang katawagan; nauunawaan ang ugnayang “sa gitna/ng” sa natural na ayos ng Filipino.
