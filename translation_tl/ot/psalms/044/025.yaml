translation:
  language: tl
  text: Sapagkat ang aming kaluluwa ay yumukod sa alabok[a]; ang aming tiyan ay nakadikit sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakalugmok sa alabok.” Ang “aming kaluluwa” ay maaari ring isaling “aming buhay” o “kami mismo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang sanhi o batayan ng pakiusap sa konteksto at natural sa marangal na makabagong Tagalog.
- source_word: שָׁחָה
  choice: ay yumuko
  rationale: Pinananatili ang larawang pagyukod o pagkalugmok nang napakababa; maaari rin itong unawaing 'lumubog,' kaya inilagay ang alternatibo sa talababa.
- source_word: לֶעָפָר
  choice: hanggang sa alabok
  rationale: Ipinahahayag ang direksiyon tungo sa pinakamababang kalagayan at pinananatili ang imahen ng alabok, kahihiyan, at pagiging mortal.
- source_word: נַפְשֵׁנוּ
  choice: ang aming kaluluwa
  rationale: Pinananatili ang matulaing saklaw ng נֶפֶשׁ nang hindi ito nililimitahan sa di-materyal na bahagi lamang; maaari rin itong tumukoy sa buhay o sa buong sarili.
- source_word: דָּבְקָה
  choice: ay dumidikit
  rationale: Tuwirang inilalarawan ang mahigpit na pagkakadikit sa lupa at malinaw sa karaniwang mambabasa.
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Sa paralelismo sa 'alabok,' ang 'lupa' ay natural at pinananatili ang konkretong larawan ng pagkadapa.
- source_word: בִּטְנֵנוּ
  choice: ang aming tiyan
  rationale: Tuwirang katumbas na nagpapanatili sa pisikal na larawan ng katawan na nakadapa at nakadikit sa lupa.
theological_decisions:
- issue: Saklaw ng kahulugan ng נַפְשֵׁנוּ
  choice: ang aming kaluluwa
  alternative: ang aming buhay; kami mismo
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa kaluluwa, buhay, o buong sarili. Pinananatili ng 'kaluluwa' ang matulaing at teolohikal na lalim, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang paralelismong 'alabok/lupa' at ang matinding larawan ng pagkalugmok. Ginamit ang 'aming' dahil ito ang karaniwang anyo bago ang pangngalan sa pormal na salin.
