  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: tl
  text: Dumating sa amin ang lahat ng ito, gayunman ay hindi ka namin kinalimutan, at hindi kami naging taksil sa iyong tipan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi kami naging maraya sa pakikitungo sa iyong tipan.”
    reason: Pinananatili ang posibleng mas literal na diwa ng שִׁקַּרְנוּ, na maaaring tumukoy sa pagkilos nang may kabulaanan o pandaraya kaugnay ng tipan, samantalang ipinahahayag ng pangunahing salin ang kawalang-katapatan sa tipan.
lexical_decisions:
- source_word: כָּל זֹאת
  choice: ang lahat ng ito
  rationale: Likas na pariralang Filipino na sama-samang tumutukoy sa lahat ng kapahamakang naunang inilarawan at pinananatili ang saklaw ng כָּל.
- source_word: בָּאַתְנוּ
  choice: dumating sa amin
  rationale: Pinananatili ang larawan ng Hebreong בוא, na para bang dumating o sumapit sa kanila ang mga paghihirap.
- source_word: וְלֹא
  choice: gayunman ay hindi
  rationale: 'Ipinahahayag ang malinaw na pagsalungat sa konteksto: sa kabila ng sinapit nilang paghihirap, itinatanggi nilang tinalikuran nila ang Diyos.'
- source_word: שְׁכַחֲנוּךָ
  choice: hindi ka namin kinalimutan
  rationale: Tuwirang pinananatili ang ikalawang panauhang layon at ang payak ngunit makabuluhang diwa ng pagkalimot sa Diyos.
- source_word: שִׁקַּרְנוּ
  choice: hindi kami nagtaksil
  rationale: Sa konteksto ng tipan, ipinahahayag ng pandiwa ang pagkilos nang may kabulaanan o kawalang-katapatan; ang “nagtaksil” ay natural at malinaw sa modernong Filipino nang hindi nililimitahan ang kahulugan sa pagsasabi lamang ng kasinungalingan.
- source_word: בִּבְרִיתֶךָ
  choice: sa iyong tipan
  rationale: Ang pang-ukol ay kaugnay ng larangan o bagay na pinakikitunguhan nang may kabulaanan. Likas sa Filipino ang “nagtaksil sa iyong tipan,” at pinananatili nito ang tuwirang pagtukoy sa tipan ng Diyos.
theological_decisions:
- issue: Saklaw ng pahayag ng katapatan sa gitna ng pagdurusa
  choice: Inihaharap ang talata bilang pagtutol na hindi nila kinalimutan ang Diyos o pinagtaksilan ang kanyang tipan.
  alternative: Unawain ito bilang pag-aangkin ng lubos na kawalang-sala sa harap ng Diyos.
  rationale: Dalawang tiyak na bagay lamang ang itinatanggi ng Hebreo—ang paglimot sa Diyos at ang maling pakikitungo sa kanyang tipan. Hindi pinalalawak ng salin ang pahayag tungo sa ganap na kawalang-sala.
translation_notes:
  register: Modernong Filipino na dignificado ngunit madaling maunawaan. Ginamit ang “gayunman” upang malinaw na ipakita ang pagsalungat, at ang “nagtaksil” upang natural na maipahayag ang kontekstuwal na diwa ng kawalang-katapatan sa tipan.
