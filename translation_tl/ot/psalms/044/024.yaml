  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: tl
  text: Bakit mo ikinukubli ang iyong mukha[a] at nililimot ang aming pagdurusa at pagkaapi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang iyong presensiya.” Literal na “iyong mukha” ang nasa Hebreo, isang karaniwang pahayag ng paglingap o presensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas at tuwirang tanong sa dahilan sa modernong Tagalog; pinananatili nito ang matapang na himig ng panaghoy.
- source_word: פָנֶיךָ
  choice: ang iyong mukha
  rationale: Tuwirang pinananatili ang larawang Hebreo. Maaari itong tumukoy sa presensiya, paglingap, o mabuting pagtanggap ng Diyos, ngunit hindi nilulutas sa pangunahing teksto ang talinghaga.
- source_word: תַסְתִּיר
  choice: ikinukubli
  rationale: Ang Hiphil ng סתר ay nangangahulugang itago o ikubli. Ang “ikinukubli ang iyong mukha” ay dignified at natural na ekspresyon sa panulaang Tagalog.
- source_word: תִּשְׁכַּח
  choice: nililimot
  rationale: Pinananatili ang literal at matapang na wikang “limot” sa halip na pahinain bilang “hindi pinapansin.” Ang aspektong nagaganap ay angkop sa reklamo ng nagsasalita.
- source_word: עָנְיֵנוּ
  choice: aming pagdurusa
  rationale: Saklaw nito ang kahirapan, kapighatian, at pagdurusang ipinahihiwatig ng עֳנִי nang hindi nililimitahan ang uri ng dinaranas.
- source_word: וְלַחֲצֵנוּ
  choice: at pagkaapi
  rationale: Ang לַחַץ ay maaaring tumukoy sa paninikil, matinding pressure, o kagipitang dulot ng kalaban. Ang “pagkaapi” ay maikli at malinaw na naghahayag ng panlabas na mapaniil na kalagayan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos sa “iyong mukha”
  choice: Panatilihin ang literal na “ang iyong mukha.”
  alternative: ang iyong presensiya; ang iyong paglingap
  rationale: Ginagamit ng Hebreo ang larawang may katawan upang ipahayag ang presensiya, paglingap, o mabuting pagtanggap ng Diyos. Pinananatili nito ang lakas ng tula at ang tensiyon ng panaghoy sa halip na gawing abstrakto ang pahayag.
- issue: Ang pahayag na nililimot ng Diyos ang pagdurusa ng bayan
  choice: Panatilihin ang “nililimot” bilang tuwirang wika ng panaghoy.
  alternative: hindi pinapansin; pinababayaan
  rationale: Hindi dapat pahinain o ipaliwanag palayo ang mapangahas na tanong ng salmista. Ang talata ay hinaing na nakatuon sa naranasang kawalan ng tugon, hindi isang sistematikong pahayag tungkol sa kaalaman ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at panulaang himig. Ginamit ang magkatugmang aspektong “ikinukubli” at “nililimot” upang ihayag ang patuloy na karanasan ng sambayanang nananaghoy. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
