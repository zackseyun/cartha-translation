translation:
  language: tl
  text: Para sa tagapanguna ng mga mang-aawit[a]. Sa mga anak ni Korah[b]. Isang Maskil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa tagapanguna ng mga mang-aawit.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Para sa mga anak ni Korah” o “Likha ng mga anak ni Korah”; ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng iba’t ibang uri ng kaugnayan sa mga pamagat ng Awit.
    reason: alternative_reading
  - marker: c
    text: Ang Maskil ay terminong Hebreo na ginagamit sa ilang pamagat ng mga Awit, at maaaring tumukoy sa isang komposisyong mapagturo o mapagnilay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong namumuno sa pag-awit o pagtatanghal. Likas sa Filipino ang “para sa,” samantalang pinananatili ng “tagapanguna ng mga mang-aawit” ang liturhikal at musikal na tungkulin nang hindi ito pinalalawak sa lahat ng uri ng musika.
- source_word: לִבְנֵי
  choice: Ukol sa mga anak ni
  rationale: Maaaring magpahiwatig ang pang-ukol na ל ng kaugnayan, pag-aalay, o pagkatha. Hindi tiyak na ipinapasiya ng “ukol sa” kung ang mga anak ni Korah ang kumatha, pinag-ukulan, o gumanap nito.
- source_word: קֹרַח
  choice: Korah
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalang Hebreo.
- source_word: מַשְׂכִּיל
  choice: Isang Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong ito sa mga pamagat ng Awit; maaaring uri ito ng komposisyong mapagturo o mapagnilay. Pinanatili ang transliterasyon upang hindi magtakda ng kahulugang hindi tiyak.
