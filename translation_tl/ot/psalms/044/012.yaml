  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: tl
  text: 'Ipinagbibili mo ang iyong bayan nang walang pakinabang,[a]

    at hindi ka kumita mula sa halagang ibinayad para sa kanila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ipinagbili mo ang iyong bayan nang walang kapalit, at hindi ka kumita mula sa halaga nila.”
    reason: Ipinapakita ang posibleng nagdaang aspekto ng תִּמְכֹּר at ang alternatibong mas tuwirang pagpapahayag ng בְלֹא הוֹן at רִבִּיתָ.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: Ipinagbibili mo
  rationale: Ang Qal imperfect na nakatuon sa Diyos ay isinalin sa kasalukuyan upang mapanatili ang agarang himig ng daing; maaari rin itong tumukoy sa nagdaang kilos ayon sa konteksto.
- source_word: עַמְּךָ
  choice: ang iyong bayan
  rationale: Ang “bayan” ay natural sa makabagong Tagalog para sa isang sambayanang may pambansa at tipanang ugnayan, at pinananatili ng “iyong” ang kaugnayan nila sa Diyos.
- source_word: בְלֹא הוֹן
  choice: nang walang pakinabang
  rationale: Bagaman ang הוֹן ay literal na yaman o ari-arian, ipinahihiwatig ng parirala rito na walang mahalagang napala sa pagbebenta. Mas malinaw at natural sa Tagalog ang “walang pakinabang.”
- source_word: רִבִּיתָ
  choice: hindi ka yumaman
  rationale: Ang Piel ng רבה ay may diwang dumami o magparami. Sa konteksto ng halaga ng pagbebenta, ang “yumaman” ay likas na Tagalog na nagpapanatili sa larawang hindi nadagdagan ang yaman.
- source_word: בִּמְחִירֵיהֶם
  choice: sa halagang ibinayad para sa kanila
  rationale: Ang מְחִיר ay halaga o presyo. Nililinaw ng pariralang ito ang presyong ibinayad kapalit ng bayan nang hindi binabago ang diwa ng preposisyong ב.
theological_decisions:
- issue: Ang pananalita na para bang ipinagbili ng Diyos ang kanyang bayan
  choice: Pinanatili bilang tuwirang hinaing sa Diyos
  alternative: Palambutin bilang pagpapahintulot lamang ng Diyos na sila ay maipagbili
  rationale: Tuwirang iniuukol ng tekstong Hebreo sa Diyos ang kilos. Hindi dapat alisin ng salin ang matinding pananalita at teolohikal na tensiyon ng panaghoy.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “bayan” sa halip na “mga tao” upang ipahayag ang sama-samang identidad ng Israel. Ang hati ng mga linya ay sumusunod sa dalawang magkatugmang sugnay ng tulang Hebreo.
