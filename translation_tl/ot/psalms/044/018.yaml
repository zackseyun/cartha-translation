  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: tl
  text: 'Hindi tumalikod ang aming puso,

    ni lumihis ang aming mga hakbang sa iyong landas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi umurong ang aming puso, ni lumihis ang aming mga yapak sa iyong daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: tumalikod
  rationale: Ang parirala ay nagsasaad ng pag-urong o pagtalikod. Likas sa modernong Filipino ang “tumalikod” at pinananatili nito ang larawan ng pagtalikod sa katapatan nang hindi nagpapaliwanag nang lampas sa teksto.
- source_word: לִבֵּנוּ
  choice: ang aming puso
  rationale: Pinananatili ang “puso” bilang kolektibong isahan at bilang larawan ng panloob na pagkatao, kalooban, at katapatan.
- source_word: וַתֵּט
  choice: lumihis
  rationale: Sa konteksto ng landas, natural na ipinahahayag ng “lumihis” ang pagkiling o paglayo mula sa tamang daan.
- source_word: אֲשֻׁרֵינוּ
  choice: ang aming mga hakbang
  rationale: Tumutukoy ang salita sa mga hakbang o paglakad, hindi lamang sa mga paa. Pinananatili ng “mga hakbang” ang metapora ng paglalakbay at pamumuhay.
- source_word: מִנִּי
  choice: sa
  rationale: Kasama ng pandiwang “lumihis,” natural na ipinahahayag ng “sa” ang paglayo mula sa isang landas sa Filipino.
- source_word: אָרְחֶךָ
  choice: iyong landas
  rationale: Pinananatili ng “landas” ang kongkretong larawang patula at ang diwang tumutukoy sa paraang itinakda ng Diyos.
theological_decisions:
- issue: Metaporang antropolohikal ng “puso”
  choice: Panatilihin ang literal na “ang aming puso.”
  alternative: “Ang aming kalooban” o “ang aming katapatan.”
  rationale: Mas malawak ang saklaw ng Hebreong “puso” kaysa isip, damdamin, o katapatan lamang. Ang literal na larawan ay nagpapanatili ng teolohikal at pampanitikang lalim nang hindi pinakikitid ang kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang balanseng anyong patula at pinanatili ang mga larawang “puso,” “mga hakbang,” at “landas.”
