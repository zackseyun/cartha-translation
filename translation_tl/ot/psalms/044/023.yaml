base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: tl
  text: Gumising ka! Bakit ka natutulog, Panginoon? Bumangon ka; huwag mo kaming itakwil[a] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “huwag mo kaming itaboy magpakailanman.”
    reason: leksikal na alternatibo para sa “itakwil” (תִּזְנַח), na maaari ring mangahulugang itaboy o itakwil nang tuluyan
lexical_decisions:
- source_word: ע֤וּרָה
  choice: Gumising ka!
  rationale: Tuwirang pautos mula sa עור. Pinananatili nito ang matapang na panawagan sa Diyos at natural itong pakinggan sa makabagong Tagalog.
- source_word: לָמָּה
  choice: Bakit
  rationale: Karaniwang salitang pananong na malinaw na nagpapahayag ng hinaing.
- source_word: תִישַׁן
  choice: ka natutulog
  rationale: Pinananatili ang metapora ng pagtulog sa retorikal na tanong, sa halip na ipaliwanag ito bilang kawalan ng pagkilos.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Likas at marangal na salin ng titulong pantawag sa Diyos.
- source_word: הָקִיצָה
  choice: Bumangon ka
  rationale: Ikalawang pautos na may diwang paggising. Ang 'Bumangon ka' ay natural at nagpapanatili sa pagpapaigting ng magkatulad na mga panawagan nang hindi inuulit nang kahoy ang 'Gumising ka.'
- source_word: אַל
  choice: huwag
  rationale: Karaniwang pananggi sa isang pautos o pakiusap.
- source_word: תִּזְנַח
  choice: itakwil
  rationale: Tumpak na naghahatid ng diwang tanggihan o itaboy; ang anyong 'itakwil' ay malinaw, dignified, at karaniwan sa konteksto ng panaghoy.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Likas na Tagalog para sa walang hanggan o permanenteng tagal.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos bilang natutulog at kailangang gumising
  choice: Panatilihin nang tuwiran ang larawan ng pagtulog at paggising/pagbangon.
  alternative: Palambutin bilang 'Bakit tila hindi ka kumikilos?'
  rationale: Matapang na ginagamit ng Hebreong panaghoy ang larawang ito. Dapat mapanatili ang teolohikal na tensiyon at hindi ito tahimik na ipaliwanag o gawing literal na doktrina tungkol sa Diyos.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Tuwiran ang himig ng panaghoy at pinananatili ang matapang na pakikipag-usap sa Diyos. Walang footnote dahil ang ibinigay na English footnote ay tila hindi tumutugma sa marker nito: ang alternatibong ''cast us off forever'' ay tumutukoy sa huling parirala, hindi sa ''sleep.'''
