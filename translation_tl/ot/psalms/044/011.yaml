  source_fidelity: Ang “Ibinibigay mo kami” ay tumutugon sa Hebreong תִּתְּנֵנוּ at ang “ikinalat mo kami” sa זֵרִיתָנוּ. Gayunman, ang “sa mga bansa” ay mas malapit sa ‘in/among the nations’ kaysa sa ipinahihiwatig na pagkakalat sa gitna ng mga bansa; kailangan ang “sa gitna ng mga bansa.” Ang “mga tupang makakain” ay maaaring mangahulugang mga tupang puwedeng kainin, hindi ang mas tiyak na larawan ng mga tupang nakatalaga bilang pagkain.
  naturalness: Hindi likas at medyo alanganin ang pariralang “mga tupang makakain.” Ang “mga tupang kakainin” ay likas na modernong Filipino at pinananatili ang larawang sila’y ibinibigay bilang pagkain, nang hindi idinadagdag ang ‘pagkatay.’
  terminology: Ang “mga tupa,” “mga bansa,” at “ikinalat” ay angkop. Walang kinakailangang terminong teknikal o talababa. Ang “sa gitna ng mga bansa” ay mas tumpak para sa בַּגּוֹיִם sa kontekstong ito.
