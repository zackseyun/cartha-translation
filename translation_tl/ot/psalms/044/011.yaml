translation:
  language: tl
  text: Ibinibigay mo kami na parang mga tupang kakainin, at ikinalat mo kami sa gitna ng mga bansa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Ibinibigay mo kami
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay.” Sa panaghoy na ito, ipinahihiwatig ng kasunod na parirala na ibinibigay sila sa kapahamakan; pinananatili ng salin ang tuwirang kahulugan nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: כְּצֹאן
  choice: na parang mga tupa
  rationale: Ang כְּ ay naghuhudyat ng paghahambing, at ang “parang mga tupa” ay likas at malinaw sa makabagong Filipino.
- source_word: מַאֲכָל
  choice: makakain
  rationale: Ang pangngalan ay tumutukoy sa pagkain o bagay na kinakain, hindi tahasang sa pagkatay. Inihahatid ng “makakain” ang larawan ng mga tupang ibinigay bilang pagkain nang hindi pinatitindi iyon bilang “kakatayin.”
- source_word: וּבַגּוֹיִם
  choice: at sa mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa mga bansa o banyagang bayan. Ang “mga bansa” ay malinaw at hindi nagdadala ng di-kailangang konotasyong mula sa Bagong Tipan.
- source_word: זֵרִיתָנוּ
  choice: ikinalat mo kami
  rationale: Ang זרה ay nangangahulugang ikalat o ipangalat, at maaari ring tumukoy sa pagtahip. Sa konteksto ng pagkakawatak-watak sa gitna ng mga bansa, “ikinalat” ang malinaw at natural na katumbas.
theological_decisions:
- issue: Larawan ng bayan bilang mga tupang ibinibigay upang kainin
  choice: Pinanatili ang matinding larawan bilang “parang mga tupang makakain.”
  alternative: parang mga tupang kakatayin; parang mga tupang lalamunin
  rationale: Ang talata ay naglalarawan sa bayan ng Diyos bilang lantad na biktima. Hindi ginawang “kakatayin” ang מַאֲכָל sapagkat pagkain, hindi tahasang pagkatay, ang tinutukoy ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang tuwirang pakikipag-usap sa Diyos at pinanatili ang mabigat na tono ng panaghoy.
