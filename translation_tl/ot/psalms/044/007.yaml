  text: Sapagkat iniligtas mo kami mula sa aming mga kaaway, at pinahiya mo ang mga napopoot sa amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o batayan ng naunang pagpupuri; natural sa Filipino ang “Sapagkat” habang pinananatili ang ugnayang nagpapaliwanag.
- source_word: הוֹשַׁעְתָּנוּ
  choice: iniligtas mo kami
  rationale: Ang Hiphil ng יָשַׁע ay tumutukoy sa pagliligtas o pagpapalaya. Pinananatili ng salin ang Diyos bilang tuwirang gumagawa at ang kilos bilang naganap na.
- source_word: מִצָּרֵינוּ
  choice: mula sa aming mga kaaway
  rationale: Ang צַר ay tumutukoy sa mga kalaban o kaaway na nagdudulot ng panganib o kagipitan. Ang “mga kaaway” ay malinaw, natural, at angkop sa marangal na wikang patula.
- source_word: וּמְשַׂנְאֵינוּ
  choice: ang mga napopoot sa amin
  rationale: Ang participle ng שָׂנֵא ay literal na “mga napopoot sa amin.” Pinananatili nito ang patuloy at personal na pagkapoot nang hindi ito ipinapantay lamang sa pangkalahatang “mga kaaway.”
- source_word: הֱבִישׁוֹתָ
  choice: inilagay mo sa kahihiyan
  rationale: 'Ang Hiphil ay causative: ang Diyos ang nagdulot na sila ay mapahiya. Ang parirala ay malinaw at pinananatili ang causative force ng Hebreo.'
