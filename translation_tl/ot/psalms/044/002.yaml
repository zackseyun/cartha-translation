  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: tl
  text: Ikaw, sa pamamagitan ng iyong kamay, ang nagtaboy sa mga bansa at itinanim sila; pinahirapan mo ang mga bayan at pinaalis sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinahirapan mo ang mga bayan at pinalaganap mo sila,” kung ang huling “sila” ay tumutukoy sa mga ninuno ng Israel at hindi sa mga bayan.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: sa pamamagitan ng iyong kamay
  rationale: Ipinahahayag ang gamit na instrumental—ang kapangyarihan at pagkilos ng Diyos—habang pinananatili ang kongkretong larawan ng “kamay.”
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga pangkat-bansang dating naninirahan sa lupain; mas angkop dito ang “mga bansa” kaysa sa terminong may mas huling relihiyosong kahulugan na “mga Hentil.”
- source_word: הוֹרַשְׁתָּ
  choice: nagtaboy
  rationale: Ang Hiphil ng ירשׁ ay nagpapahiwatig ng pagpapaalis o pag-aalis sa pagmamay-ari sa konteksto ng pananakop. Natural at malinaw sa Filipino ang “nagtaboy.”
- source_word: וַתִּטָּעֵם
  choice: at nagtanim sa kanila
  rationale: Pinananatili ang talinghagang agrikultural ng pagtatatag ng isang bayan sa lupain. Hindi tahasang pinapangalanan ang tinutukoy ng hulaping panghalip, gaya rin ng Hebreo.
- source_word: תָּרַע
  choice: pinahirapan mo
  rationale: Ang Hiphil ng רעע ay maaaring mangahulugang gumawa ng masama laban sa, manakit, o magdulot ng kapighatian. Ipinahahayag ng “pinahirapan” ang mapaminsalang paghatol nang hindi tinutukoy ang eksaktong paraan.
- source_word: לְאֻמִּים
  choice: mga bayan
  rationale: Pinananatili nito ang makatang pagkakaiba mula sa גּוֹיִם na isinaling “mga bansa,” nang hindi itinatanggi ang pagkakatulad ng kahulugan.
- source_word: וַתְּשַׁלְּחֵם
  choice: at pinaalis sila
  rationale: Mas tuwirang sinasalamin ng “pinaalis” ang βασikong diwa ng שלח na “paalisin/ipadala,” habang umaangkop sa konteksto ng pagpapaalis sa mga bayan at iniiwasan ang labis na pagpapakahulugang “ikalat.”
theological_decisions:
- issue: Ang tinutukoy ng mga hulaping panghalip sa “nagtanim sa kanila” at “pinaalis sila”
  choice: Ang una ay tumutukoy sa mga ninuno ng Israel, at ang huli ay sa mga bayan o bansang pinalayas.
  alternative: Maaaring ang huling panghalip ay tumukoy rin sa mga ninuno ng Israel, na pinalaganap ng Diyos.
  rationale: Siksik at hindi tahasan ang Hebreong tula tungkol sa pinatutungkulan ng mga panghalip. Sa mas malawak na konteksto, itinaboy ng Diyos ang mga bansa at itinatag ang Israel, kaya natural na ang “nagtanim” ay tumukoy sa mga ninuno ng Israel. Ang huling sugnay ay karaniwang inuunawang pagpapaalis sa mga bayan matapos silang pahirapan, ngunit pinananatili sa talababa ang tunay na posibleng alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismong patula at ang larawan ng pagtatanim, habang iniwasan ang katawagang sobrang teknikal o denominasyonal.
