  yaml_path: translation/ot/psalms/044/010.yaml
  text: You make us turn back from the foe[b][a], and those who hate us plunder for themselves.
translation:
  language: tl
  text: Pinapaurong mo kami sa harap ng kaaway,[a] at nagsamsam para sa kanilang sarili ang mga napopoot sa amin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinapaurong mo kami mula sa kaaway.”
    reason: lexical_alternative
  - marker: b
    text: O “at kumuha ng samsam para sa kanilang sarili ang mga napopoot sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיבֵנוּ
  choice: Pinapaurong mo kami
  rationale: Ang Hiphil ng שוב ay nagsasaad ng pagsasanhi. Sa konteksto ng labanan, natural na ipinahihiwatig ng “pinapaurong” na dahil sa pagkilos ng Diyos ay napipilitang umurong ang bayan.
- source_word: אָחוֹר
  choice: paurong
  rationale: Ang diwang “pabalik” o “paatras” ay likas nang nakapaloob sa pandiwang Filipino na “paurungin,” kaya hindi na kailangang ulitin bilang hiwalay na pang-abay.
- source_word: מִנִּי צָר
  choice: sa harap ng kaaway
  rationale: Maaaring ipakahulugan ang parirala bilang pag-urong mula sa kaaway o sa harap nito. Pinili ang “sa harap ng kaaway” dahil malinaw at natural ito sa paglalarawan ng pagkatalo sa labanan, habang inilalagay sa talababa ang alternatibong anyo.
- source_word: מְשַׂנְאֵינוּ
  choice: mga napopoot sa amin
  rationale: Pinananatili nito ang aktibong diwa ng participle—mga taong napopoot—sa halip na gawing pangkalahatang “mga kaaway,” at napapanatili rin ang pagkakaiba sa צָר.
- source_word: שָׁסוּ
  choice: sinamsam ... ang aming mga pag-aari
  rationale: Ang pandiwa ay tumutukoy sa pagkuha ng samsam. Ginawang tahasan ang bagay na sinamsam upang maging natural sa Filipino, ngunit hindi nililimitahan kung anong uri ng ari-arian ang kinuha.
- source_word: לָמוֹ
  choice: para sa kanilang sarili
  rationale: 'Ipinahahayag nito ang datibong pakinabang: kinuha ng mga napopoot ang samsam para sa sarili nilang kapakinabangan.'
theological_decisions:
- issue: Ang Diyos bilang sanhi ng pag-urong ng Israel
  choice: Pinapaurong mo kami
  alternative: Umurong kami
  rationale: 'Pinananatili ang tahasang causative na anyo at ang tensiyong teolohikal ng panaghoy: iniuugnay ng salmista sa Diyos ang pagkatalo, sa halip na pahinain o alisin ang pananagutan na ipinahahayag ng Hebreo.'
translation_notes:
  register: Makabago at marangal na Filipino, na may bahagyang makatang himig. Ginamit ang “napopoot” upang mapanatili ang matinding aktibong poot ng Hebreo, at “pinapaurong” upang malinaw ang larawang militar at ang causative na diwa.
