base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: tl
  text: Diyos, narinig namin sa sarili naming mga tainga; isinalaysay sa amin ng aming mga ninuno[a] ang ginawa mo noong panahon nila, noong unang panahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “aming mga ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang panawag ito sa Diyos. Malinaw ang bokatibo sa Filipino kahit walang idagdag na “O.”
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: narinig namin mismo
  rationale: Ang literal na “narinig namin sa pamamagitan ng aming mga tainga” ay hindi likas sa modernong Filipino. Ipinahihiwatig ng “mismo” ang mariing personal na pagkarinig na nasa idyomang Hebreo.
- source_word: אֲבוֹתֵינוּ
  choice: aming mga ninuno
  rationale: Bagaman literal na “aming mga ama,” tumutukoy rito ang salita sa mga naunang salinlahi na nagpanatili at nagsalaysay ng tradisyon; “mga ninuno” ang likas at malinaw na katumbas sa konteksto.
- source_word: סִפְּרוּ לָנוּ
  choice: isinalaysay sa amin
  rationale: Ipinapakita ng pandiwa ang pagkukuwento o masusing paghahatid ng mga ginawa ng Diyos mula sa isang salinlahi tungo sa kasunod.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: ang ginawa mo
  rationale: Pinagsasama sa natural na Filipino ang magkaugnay na pangngalan at pandiwa ng Hebreo, na literal na tumutukoy sa gawa o gawang isinagawa ng Diyos.
- source_word: בִּימֵיהֶם
  choice: noong panahon nila
  rationale: Likas na temporal na pahayag sa Filipino para sa literal na “sa kanilang mga araw.”
- source_word: בִּימֵי קֶדֶם
  choice: noong unang panahon
  rationale: Karaniwang marangal at patulang Filipino na nagpapahayag ng malayong nakaraan.
theological_decisions:
- issue: Kung lalagyan ng pantawag na “O” ang pambungad
  choice: Diyos, narinig namin mismo
  alternative: O Diyos, narinig namin mismo
  rationale: Walang hiwalay na pantawag na kataga sa Hebreo. Sapat at natural sa modernong Filipino ang kuwit upang ipakita ang tuwirang pakikipag-usap sa Diyos.
- issue: Kung isasalin ang אֲבוֹתֵינוּ bilang “mga ama” o “mga ninuno”
  choice: aming mga ninuno
  alternative: aming mga ama
  rationale: Ang konteksto ay paghahatid ng salaysay mula sa mga naunang salinlahi. Hindi nilulutas nito ang anumang doktrinal na usapin; inililinaw lamang ang referensiyang pangkasaysayan sa natural na Filipino, habang itinatala sa talababa ang literal na anyo.
translation_notes:
  register: Modernong Filipino na marangal at bahagyang patula. Iniwasan ang salitang-sa-salitang “narinig ng aming mga tainga,” na asiwa sa Filipino, ngunit pinanatili ang diin sa aktuwal na pagkarinig sa pamamagitan ng “mismo.”
