  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: tl
  text: Sa Diyos kami nagmamalaki buong araw[a], at magpapasalamat kami sa iyong pangalan magpakailanman[b]. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Diyos kami nagpupuri buong araw” o “sa Diyos kami nagmamapuri buong araw.” Ang pandiwang Hebreo ay maaaring mangahulugang pagpuri o masayang pagmamalaki, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang iyong pangalan”—isang biblikal na paraan ng pagtukoy sa ipinahayag na katangian at reputasyon ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Sa Diyos
  rationale: 'Ipinahahayag ng ב ang batayan o pinagtutuunan ng pagmamapuri: ang Diyos mismo, hindi ang sariling lakas.'
- source_word: הִלַּלְנוּ
  choice: kami nagmamalaki
  rationale: Sa pagkakaugnay nito sa בֵּאלֹהִים, ang piel ng הלל ay may diwang ‘magmapuri/magmalaki sa.’ Sa Filipino, nililinaw ng ‘Sa Diyos’ na hindi ito hambog na pagmamalaki sa sarili.
- source_word: כָל הַיּוֹם
  choice: buong araw
  rationale: Natural at tuwirang katumbas ng patuloy na tagal sa kabuuan ng araw.
- source_word: וְשִׁמְךָ
  choice: sa iyong pangalan
  rationale: Pinananatili ang biblikal na pagtukoy sa pangalan ng Diyos bilang pagpapahayag ng kanyang ipinakilalang pagkatao at reputasyon.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na salin ng walang hanggang tagal.
- source_word: נוֹדֶה
  choice: magpasalamat kami
  rationale: Ang hiphil ng ידה ay nagpapahayag ng pasasalamat o mapagpasalamat na pagkilala. Pinananatili ng anyong ito ang di-ganap na aspektong maaaring magpahayag ng patuloy o mapagpasiyang pagkilos, nang hindi ito sapilitang nililimitahan sa payak na hinaharap.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng liturhikong terminong Hebreo, kaya tinumbasan ito sa baybay sa halip na bigyan ng haka-hakang salin.
theological_decisions:
- issue: Ang katuturan ng pagmamalaki sa Diyos
  choice: Pinanatili ang ‘Sa Diyos kami nagmamalaki,’ na ginagawang Diyos ang batayan at pinagtutuunan ng pagmamapuri.
  alternative: ‘Pinupuri namin ang Diyos’
  rationale: Ang Hebreong idyoma ay maaaring mangahulugang pumuri o magmapuri sa Diyos. Pinananatili ng pangunahing salin ang mas matinding diwa ng masayang pagmamapuri, habang kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kami’ dahil ang nagsasalita ay isang pangkat at ang Diyos ang kinakausap; iniingatan nito ang eksklusibong unang panauhang maramihan. Pinanatili ang ‘Selah’ bilang di-tiyak na terminong liturhiko.
