  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: tl
  text: Hindi ba ito sisiyasatin ng Diyos? Sapagkat alam niya ang mga nakatagong bagay sa puso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lihim ng puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Nananatili ang anyong retorikal na tanong na umaasang sang-ayon ang sagot, at natural ito sa modernong Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo, ginagamit ito rito bilang pang-isahang titulong tumutukoy sa Diyos ng Israel.
- source_word: יַחֲקָר
  choice: sisiyasatin
  rationale: Ipinahihiwatig ng pandiwa ang masusing paghahanap o pagsusuri; malinaw na naihahatid ng “sisiyasatin” ang ganitong diwa.
- source_word: זֹאת
  choice: ito
  rationale: Tumutukoy ang panghalip pabalik sa bagay na pinag-uusapan nang hindi dinaragdagan ang tahasang sinabi ng Hebreo.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan na sumusuporta sa retorikal na tanong at nagpapanatili ng marangal na himig.
- source_word: יֹדֵעַ
  choice: alam niya
  rationale: Ang participle ay nagpapahayag ng palagian at likas na kaalaman ng Diyos; natural itong ipahayag sa payak na kasalukuyan sa Tagalog.
- source_word: תַּעֲלֻמוֹת
  choice: mga nakatagong bagay
  rationale: Malapit ito sa leksikal na kahulugan ng mga bagay na lingid o nakakubli, habang ang “mga lihim” ay pinananatiling alternatibo sa talababa.
- source_word: לֵב
  choice: puso
  rationale: Pinananatili nito ang biblikal na larawan ng kaloob-looban ng tao, kabilang ang isip, layunin, at damdamin, nang hindi pinakikitid ang saklaw.
theological_decisions:
- issue: Antropolohikal na pahayag na לֵב
  choice: puso
  alternative: isip; kaloob-looban
  rationale: Masaklaw ang Hebreong salita at tumutukoy sa pag-iisip, kalooban, at damdamin. Pinananatili ng “puso” ang larawan at teolohikal na lawak ng teksto nang hindi ito nilulutas bilang isang bahagi lamang ng panloob na buhay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sisiyasatin” upang mapanatili ang masusing diwa ng pandiwa at ang bahagyang hudisyal na himig; iniwasan ang sobrang kolokyal na pananalita.
