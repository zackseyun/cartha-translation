  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: tl
  text: Bumangon ka upang tulungan kami[a], at tubusin mo kami[b] alang-alang sa iyong tapat na pag-ibig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bumangon ka bilang tulong para sa amin.” Sa literal na Hebreo, “Bumangon ka, tulong para sa amin,” na gumagamit ng pangngalang “tulong” sa halip na pandiwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “palayain mo kami” o “iligtas mo kami.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapalaya sa pamamagitan ng pantubos o ng mapagpasyang pagkilos.
    reason: lexical_alternative
  - marker: c
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na madalas tumutukoy sa matatag at tapat na pag-ibig ng Diyos sa loob ng kanyang pakikipagtipan.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Ang Qal imperative na ito ay isang apurahang panawagan sa Diyos na kumilos. Pinananatili ng “Bumangon ka” ang kongkretong larawan at puwersa ng utos.
- source_word: עֶזְרָתָה לָנוּ
  choice: bilang tulong namin
  rationale: Pinananatili nito ang pangngalang עֶזְרָה (“tulong”) at ang ugnayang ipinahahayag ng לָנוּ, sa halip na agad itong gawing pandiwang “tulungan mo kami.”
- source_word: וּפְדֵנוּ
  choice: at tubusin mo kami
  rationale: Ang פדה ay maaaring tumukoy sa pagpapalaya sa pamamagitan ng pantubos o mapagpasyang pagliligtas. Ang “tubusin” ay nagpapanatili sa natatanging saklaw ng salita nang hindi nililimitahan sa komersiyal na pagbabayad.
- source_word: לְמַעַן
  choice: alang-alang sa
  rationale: Ipinahahayag nito na ang hinihiling na pagliligtas ay nakabatay sa kasunod na dahilan o kapakanan—ang tapat na pag-ibig ng Diyos.
- source_word: חַסְדֶּךָ
  choice: iyong tapat na pag-ibig
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang pagmamahal, katapatan, at matibay na katapatan sa pakikipagtipan na maaaring taglayin ng חֶסֶד.
theological_decisions:
- issue: Kung gagamit ng salitang may natatanging teolohikal na diwa para sa פדה
  choice: tubusin mo kami
  alternative: iligtas mo kami; palayain mo kami
  rationale: Pinananatili ng “tubusin” ang diwa ng mapagpalayang pagkilos ng Diyos at posibleng pantubos, ngunit hindi idinaragdag ang mga detalyeng doktrinal na wala sa talata.
- issue: Kung paano pananatilihin ang lawak ng חֶסֶד
  choice: iyong tapat na pag-ibig
  alternative: iyong wagas na pag-ibig; iyong pag-ibig na tapat sa tipan; iyong awa
  rationale: Hindi lamang awa ang tinutukoy ng חֶסֶד; kasama rito ang pag-ibig at matatag na katapatan. Ang piniling parirala ay natural sa modernong Filipino at hindi labis na nagpapaliwanag sa mismong teksto.
- issue: Kung gagawing pandiwa ang nominal na עֶזְרָתָה
  choice: bilang tulong namin
  alternative: upang tulungan kami
  rationale: Pinananatili ng pangunahing teksto ang kapansin-pansing anyong pangngalan ng Hebreo, habang inilalagay sa talababa ang mas natural ngunit mas interpretibong pandiwang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang apurahang panawagan at ang nominal na anyo ng “tulong,” kahit bahagyang mas minarkahan ito kaysa sa karaniwang pananalita; nilinaw ang mas idiomatikong alternatibo sa talababa.
