  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: tl
  text: Ikaw ang aking Hari, O Diyos; iutos mo ang mga tagumpay para kay Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iutos mo ang mga pagliligtas para kay Jacob” o “itakda mo ang mga kaligtasan para kay Jacob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Ikaw ang
  rationale: Ang tambalang panghalip ay may diin. Likas na naipahahayag ito sa Tagalog sa hulma na “Ikaw ang,” nang hindi pinabibigat ang taludtod.
- source_word: מַלְכִּי
  choice: aking Hari
  rationale: Ang pangngalan na may hulaping unang panauhang isahan ay nangangahulugang “aking hari.” Ginamit ang malaking titik bilang titulong tuwirang iniuukol sa Diyos.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos kasunod ng “aking Hari”; pinananatili ng “O Diyos” ang anyong panalangin at lakas ng tula.
- source_word: צַוֵּה
  choice: iutos mo
  rationale: Ang piel imperative ng צוה ay tuwirang nangangahulugang mag-utos o magtakda. Ang “iutos mo” ang pinakamalinaw na katumbas at pinananatili ang matapang na larawan na ang Diyos ang nag-uutos ng pagliligtas.
- source_word: יְשׁוּעוֹת
  choice: mga tagumpay
  rationale: Ang pangmaramihang pangngalan ay tumutukoy sa mga gawa ng pagliligtas. Dahil ang konteksto ay labanan ng bayan laban sa mga kaaway, malinaw na naihahatid ng “mga tagumpay” ang kongkretong diwa rito.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinanatili ang pangalang “Jacob,” ang makatang pangalang tumutukoy sa bayang tipan, sa halip na palitan ito ng interpretatibong “Israel.”
theological_decisions:
- issue: Diwa ng יְשׁוּעוֹת sa konteksto ng digmaan
  choice: mga tagumpay
  alternative: mga pagliligtas; mga kaligtasan
  rationale: Ang nakapaligid na konteksto ay tungkol sa mga kaaway at pakikipaglaban, kaya ang tinutukoy ay kongkretong pagliligtas sa bayan. Hindi naman ikinakaila ng “mga tagumpay” ang mas malawak na saklaw ng salitang Hebreo, kaya inilagay ang mga alternatibo sa talababa.
- issue: Kayarian ng tuwirang pagtawag
  choice: aking Hari, O Diyos
  alternative: aking Haring Diyos; ang aking Hari ay Diyos
  rationale: Pinakanatural na basahin ang אֱלֹהִים bilang bokatibo sa isang panalangin. Iniiwasan nito ang pagresolba sa linya bilang tambalang titulo o hiwalay na pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikling anyong patula, ang tuwirang pagtawag sa Diyos, at ang mariing pakiusap. Ang marker na [a] ay inilagay matapos ang buong sugnay na tinatalabaan.
