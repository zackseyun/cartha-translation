  source_fidelity: Tumpak na naihahatid ng salin ang mariing “Ikaw” (אַתָּה הוּא), ang tuwirang pagtawag na “aking Hari, O Diyos,” ang pautos na צַוֵּה, at ang pangmaramihang יְשׁוּעוֹת. Ang “mga tagumpay” ay angkop sa kontekstong pandigma, habang pinangangalagaan ng talababa ang mas malawak na diwang “mga pagliligtas/mga kaligtasan.” Pinanatili rin ang “Jacob,” gaya ng Hebreo.
