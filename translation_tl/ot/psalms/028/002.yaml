base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: tl
  text: Dinggin mo ang aking mga pagsusumamo para sa awa kapag dumaraing ako sa iyo, kapag itinataas ko ang aking mga kamay tungo sa iyong pinakaloob na santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iyong banal na santuwaryo.” Ang salitang Hebreo ay maaaring tumukoy nang mas tiyak sa pinakaloob na banal na silid.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dinggin mo
  rationale: Ang pautos na Qal ay isang tuwirang pakiusap sa Diyos. Likas sa marangal na wikang panalangin ang “Dinggin mo” at taglay nito ang pagkaapurahan ng Hebreo.
- source_word: קוֹל
  choice: ang tinig
  rationale: Maaaring mangahulugang “tinig” o “tunog” ang קוֹל. Mas personal at natural dito ang “tinig” dahil kaugnay ito ng pagsusumamo ng nagsasalita.
- source_word: תַּחֲנוּנַי
  choice: ng aking pagsusumamo para sa awa
  rationale: Tumutukoy ang salita sa taimtim na paghingi ng lingap o awa. Malinaw sa karaniwang mambabasa ang “pagsusumamo para sa awa,” samantalang nananatili ang bigat ng pakiusap.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: kapag dumaraing ako sa iyo
  rationale: Ginamit nang temporal ang pang-ukol na may infinitive construct. Ipinahihiwatig ng “dumaraing” ang matindi at apurahang pagtawag na nasa שׁוע.
- source_word: בְּנָשְׂאִי יָדַי
  choice: kapag itinataas ko ang aking mga kamay
  rationale: Pinananatili ang temporal na kayarian at ang kongkretong kilos ng pananalangin.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: tungo sa iyong banal na santuwaryo sa kaloob-looban
  rationale: Ang דְּבִיר ay mas tiyak kaysa sa pangkalahatang templo o santuwaryo at tumutukoy sa panloob, o pinakaloob, na banal na dako. Ipinahahayag ng salin ang espasyal na katiyakan nito sa malinaw na modernong Filipino.
theological_decisions:
- issue: Ang kultikong tinutukoy ng דְּבִיר קָדְשֶׁךָ
  choice: iyong banal na santuwaryo sa kaloob-looban
  alternative: iyong banal na santuwaryo; ang pinakaloob na silid ng iyong kabanalan
  rationale: Tinutukoy ng parirala ang sagradong panloob na silid na kaugnay ng presensiya ng Diyos, hindi lamang ang buong templo. Pinananatili ng salin ang larawang kultiko nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino para sa panalangin. Ginamit ang “Dinggin,” “pagsusumamo,” at “dumaraing” upang mapanatili ang taimtim at apurahang himig, habang ang “santuwaryo sa kaloob-looban” ay nagpapalinaw sa arkitektural na kahulugan ng דְּבִיר.
