  rationale: Pinahusay ang likas na daloy ng Filipino sa pamamagitan ng “aking mga pagsusumamo para sa awa,” habang pinananatili ang taimtim at apurahang panalanging himig. Pinalitan ang “banal na santuwaryo sa kaloob-looban” ng “pinakaloob na santuwaryo” upang mas malinaw na maipahayag ang espasyal na pagtitiyak ng Hebreong דְּבִיר. Ang footnote ay pinanatili upang ilahad ang mas pangkalahatang alternatibong salin nang hindi pinawawalang-bisa ang pangunahing salin.
