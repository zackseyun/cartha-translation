    issue: Medyo hindi likas ang “tinig ng aking pagsusumamo.”
    rationale: Ang Hebreong pangngalan ay maramihan (“aking mga pagsusumamo”), at ang literal na pagsasama ng “tinig” at “pagsusumamo” ay mabigat sa modernong Filipino. Maaaring alisin ang tahasang katumbas ng קוֹל upang maging natural, nang hindi nawawala ang semantikong diwa ng naririnig na pagsusumamo.
  - severity: medium
    issue: Hindi pinakamalinaw ang “iyong banal na santuwaryo sa kaloob-looban.”
    rationale: Ang pariralang ito ay maaaring mabasa bilang isang santuwaryong nasa loob ng ibang lugar. Ang “iyong pinakaloob na santuwaryo” ay mas tuwirang naghahayag ng espesipikong panloob na silid na tinutukoy ng דְּבִיר.
  revised_text: Dinggin mo ang aking mga pagsusumamo para sa awa kapag dumaraing ako sa iyo, kapag itinataas ko ang aking mga kamay tungo sa iyong pinakaloob na santuwaryo.[a]
