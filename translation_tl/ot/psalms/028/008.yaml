base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: tl
  text: Si Yahweh ang lakas nila, at siya ang matibay na kanlungan ng kaligtasan[a] para sa kanyang pinahiran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanlungan ng mga pagliligtas” o “moog ng mga gawang nagliligtas.” Maramihan ang pangngalang Hebreo—sa literal, “mga kaligtasan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang pinahiran” ay maaari ring isaling “kanyang Mesiyas.” Sa konteksto, malamang na una itong tumutukoy sa haring pinahiran ni Yahweh, habang nananatiling posible ang mas malawak na mesiyanikong pahiwatig.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: עֹז
  choice: lakas
  rationale: Tuwirang ipinahahayag ng pangngalan ang lakas o kapangyarihan at nananatiling naiiba sa kasunod na מָעוֹז.
- source_word: לָמוֹ
  choice: nila
  rationale: Ang anyo ay pangatlong panauhang maramihan. Ang “lakas nila” ay likas na Filipino at hindi dinaragdagan ng tahasang “kanyang bayan” ang teksto.
- source_word: מָעוֹז
  choice: matibay na kanlungan
  rationale: Ipinapahayag nito ang isang ligtas at matatag na lugar o pinagmumulan ng proteksiyon; mas madaling maunawaan sa modernong Filipino kaysa sa “moog” lamang.
- source_word: יְשׁוּעוֹת
  choice: kaligtasan
  rationale: Ginamit ang likas na kolektibong pangngalan sa Filipino sa pangunahing teksto; ipinaliliwanag sa talababa ang tahasang maramihang anyo ng Hebreo at ang diwa ng paulit-ulit o sari-saring pagliligtas.
- source_word: מְשִׁיחוֹ
  choice: kanyang pinahiran
  rationale: Tuwirang isinasalin ang taong pinahiran ng Diyos, malamang ang hari sa agarang konteksto, nang hindi agad ginagawang nakapirming titulong “Mesiyas.”
- source_word: הוּא
  choice: siya ang
  rationale: Pinananatili ang diin ng malayang panghalip na Hebreo at bumubuo ng natural na sugnay sa Filipino.
theological_decisions:
- issue: Kung ang מְשִׁיחוֹ ay isasaling nakapirming titulo na “kanyang Mesiyas” o paglalarawang “kanyang pinahiran”
  choice: kanyang pinahiran
  alternative: kanyang Mesiyas
  rationale: Sa agarang konteksto, maaaring tumukoy ang salita sa haring pinahiran ni Yahweh. Pinananatili ng “kanyang pinahiran” ang kahulugang iyon at hindi isinasara ang mas malawak na mesiyanikong pag-unawa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “matibay na kanlungan” upang mapanatili ang larawang proteksiyon ng מָעוֹז nang hindi umasa sa mas di-pamilyar na “moog.”
