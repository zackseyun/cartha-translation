  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: tl
  text: Iligtas mo ang iyong bayan at pagpalain mo ang iyong mana; alagaan mo sila[a] at dalhin mo sila magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pastulan mo sila” o “pakainin mo sila.” Ang pandiwang Hebreo ay tumutukoy sa pag-aalaga ng pastol, kabilang ang pagpapakain.
