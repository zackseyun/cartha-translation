  source_fidelity: 'Ang pangunahing mga pandiwa at mga layon ay wastong naipapakita: panawagan na iligtas at pagpalain ang bayan ng Diyos, na tinawag na kanyang mana, kasunod ng larawan ng pangangalagang pastoral at pagdadala magpakailanman. Gayunman, ang “pastulan mo sila” ay mas madaling unawaing “pagpastulan/pakainin sila” kaysa sa mas malawak na “shepherd/tend them” ng רְעֵם. Ang “dalhin mo sila” ay mas malawak at mas natural na katumbas ng נַשְּׂאֵם kaysa “kalungin,” na nagdaragdag ng tiyak na larawan ng pagkarga sa balikat/leeg.'
  naturalness: Marangal at malinaw ang kabuuang himig. Mas idiomatiko sa modernong Filipino ang “alagaan mo sila” para sa malawak na gawaing pastoral, at ang “dalhin mo sila” para sa matalinghagang pagdadala ng Diyos sa kanyang bayan. Nananatiling natural ang “iyong bayan,” “iyong mana,” at “magpakailanman.”
  terminology: Ang “bayan,” “pagpalain,” at “mana” ay angkop at pinananatili ang panalanging tipanan at ang metapora ng נחלה. Ang “alagaan” ay hindi naglilimita sa pagpapakain at hindi nagdadagdag ng denominasyonal na pagpapakahulugan. Ang talababa sa “dalhin” ay nagpapanatili ng mga leksikal na posibilidad na “itaas” at “buhatin/pasanin.”
