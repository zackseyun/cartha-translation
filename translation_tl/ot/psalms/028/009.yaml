lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Iligtas mo
  rationale: Tuwirang pakiusap sa Diyos; natural sa makabagong Tagalog at pinananatili ang diwa ng pagliligtas.
- source_word: עַמֶּךָ
  choice: ang iyong bayan
  rationale: Tumutukoy sa bayang pag-aari ng Diyos; ang “bayan” ay angkop sa kolektibo at tipanang diwa.
- source_word: בָרֵךְ
  choice: pagpalain mo
  rationale: Karaniwang katumbas sa panalanging humihingi ng pagpapala at nagpapanatili ng marangal na himig.
- source_word: נַחֲלָתֶךָ
  choice: ang iyong mana
  rationale: Pinananatili ang talinghagang ang bayan ay mana o minanang pag-aari ng Diyos, sa halip na gawing payak na “pag-aari.”
- source_word: רְעֵם
  choice: pastulan mo sila
  rationale: Saklaw nito ang pag-aalaga ng pastol, kabilang ang pagpapakain, at natural na pandiwa sa Tagalog para sa larawang pastoral.
- source_word: נַשְּׂאֵם
  choice: kalungin mo sila
  rationale: Ipinahahayag ang pagkarga at mapagkalingang pagdadala na naaayon sa larawan ng pastol, habang kinikilala sa talababa ang mas literal na mga posibilidad.
- source_word: עַד הָעוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na katumbas para sa walang hanggang tagal.
theological_decisions:
- issue: Lawak ng larawang pastoral sa רְעֵם
  choice: pastulan mo sila
  alternative: pakainin mo sila
  rationale: Hindi lamang pagpapakain ang maaaring ipahiwatig ng pandiwa kundi ang kabuuang pag-aalaga ng pastol; pinananatili ng salin ang mas malawak na larawan.
- issue: Pagkakakilanlang tipanan sa נַחֲלָתֶךָ
  choice: ang iyong mana
  alternative: ang iyong pag-aari
  rationale: Pinananatili ng “mana” ang matalinghaga at tipanang paglalarawan sa bayan bilang bahaging nauukol sa Diyos.
- issue: Ambiguwidad ng נַשְּׂאֵם
  choice: kalungin mo sila
  alternative: buhatin mo sila / itaas mo sila / pasanin mo sila
  rationale: Ang “kalungin” ay natural sa konteksto ng mapagkalingang pastol ngunit hindi lamang ito ang posibleng diwa; inilalahad sa talababa ang tunay na leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panalangin. Ginamit ang “bayan” at “mana” upang mapanatili ang kolektibo at tipanang larawan, at ang “pastulan” upang maipahayag ang buong saklaw ng pag-aalaga ng pastol.
