base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: tl
  text: Bigyan mo sila ayon sa kanilang mga gawa at ayon sa kasamaan ng kanilang mga ginawa; ayon sa gawa ng kanilang mga kamay, bigyan mo sila; ibigay mo sa kanila ang kanilang kabayaran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן
  choice: Ibigay mo
  rationale: Tuwirang pautos na nakatuon sa Diyos; pinananatili ng “Ibigay mo” ang lakas ng pakiusap at ang pag-uulit sa talata.
- source_word: כְּפָעֳלָם
  choice: ang ayon sa kanilang gawa
  rationale: Ang פעל ay tumutukoy sa gawa o ginawa. Likas sa Tagalog ang pariralang ito at pinananatili nito ang diwa ng pagganti ayon sa ginawa.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: at ayon sa kasamaan ng kanilang mga ginawa
  rationale: Malinaw na inilalahad ng רֹעַ ang moral na kasamaan, habang ang מַעַלְלִים ay mga gawa o kilos.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: ang ayon sa ginawa ng kanilang mga kamay
  rationale: Pinananatili ang Hebreong larawan ng “kanilang mga kamay,” na nagbibigay-diin sa sarili nilang ginawa.
- source_word: הָשֵׁב
  choice: iganti mo
  rationale: Sa hiphil, ipinahihiwatig ng שוב dito ang pagpapabalik sa kanila ng bunga ng kanilang ginawa; ang “iganti” ay natural at may malinaw na hudisyal na diwa sa konteksto.
- source_word: גְּמוּלָם
  choice: ang nararapat sa kanila
  rationale: Ang גְּמוּל ay kabayaran o ganti na nauukol sa isang tao. Malinaw at makabagong Tagalog ang “ang nararapat sa kanila” nang hindi dinaragdagan ang tindi ng Hebreo.
theological_decisions:
- issue: Mapanumpang panalangin at pagganti ng Diyos
  choice: Isinalin ang talata bilang pakiusap sa Diyos na gantihan sila nang naaayon sa kanilang mga gawa.
  alternative: Palambutin ito bilang paglalarawan lamang sa magiging bunga ng kanilang mga gawa.
  rationale: Ang tatlong pautos—dalawang תֶּן at isang הָשֵׁב—ay malinaw na bumubuo ng pakiusap para sa makatarungang pagganti ng Diyos, hindi lamang ng neutral na paglalarawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paulit-ulit na estruktura at ang larawang “ginawa ng kanilang mga kamay,” habang iniwasan ang labis na teknikal na salitang gaya ng “kabayaran” o “gantimpala,” na maaaring magpahiwatig ng mas positibong diwa.
