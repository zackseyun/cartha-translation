  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: tl
  text: Huwag mo akong hilahin kasama ng masasama[a] at ng mga gumagawa ng kasamaan, na nagsasalita nang mapayapa sa kanilang kapwa[b], ngunit may kasamaan sa kanilang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag mo akong hataking kasama ng masasama.”
    reason: lexical_alternative
  - marker: b
    text: O, “kanilang mga kaibigan” o “kanilang mga kapitbahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: kaladkarin mo ako
  rationale: Ipinahihiwatig ng משׁך ang sapilitang paghila o pagdadala kasama ng iba. Pinananatili ng “kaladkarin” ang lakas ng pakiusap at hindi nililinaw nang higit sa Hebreo kung ito ay patungo sa kaparusahan o ibang kapalaran.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Karaniwan at malinaw na tawag sa mga taong namumuhay sa kasamaan, hindi lamang sa mga napatunayang nagkasala sa hukuman.
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Pinananatili nito ang aktibong diwa ng participle פֹּעֲלֵי at gumagamit ng likas at madaling maunawaang Filipino.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: nagsasalita sila ng kapayapaan
  rationale: Pinananatili ang matalinghagang Hebreong pananalita at ang matinding kaibahan ng panlabas na mapayapang salita at panloob na kasamaan.
- source_word: רֵעֵיהֶם
  choice: kanilang kapwa
  rationale: Ang רֵעַ ay maaaring tumukoy sa kapwa, kasamahan, kapitbahay, o kaibigan. Ang “kapwa” ay natural at hindi nagpapahiwatig na tunay ang pagkakaibigan.
- source_word: רָעָה
  choice: kasamaan
  rationale: Sa konteksto, tumutukoy ito sa masamang hangarin o disposisyon sa kalooban; pinananatili ng “kasamaan” ang kaugnayan nito sa naunang אָוֶן.
- source_word: בִּלְבָבָם
  choice: nasa puso nila
  rationale: Natural na Filipino ito na pinananatili ang biblikal na larawan ng puso bilang sentro ng isip, hangarin, at layunin.
theological_decisions:
- issue: Ang uri ng pakiusap ng salmista tungkol sa masasama
  choice: Pakiusap na huwag siyang isamang tangayin sa samahan o kapalaran ng masasama
  alternative: Pakiusap lamang na huwag niyang tularan ang masasama
  rationale: Ang “huwag mo akong kaladkarin kasama” ay higit na tumutukoy sa hindi pagsama sa kanila, malamang sa kanilang sasapiting hatol. Gayunman, hindi tahasang binanggit sa salin ang hatol upang mapanatili ang hindi ganap na tinukoy ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kaladkarin” upang mapanatili ang puwersa ng pandiwa, at “kapwa” upang hindi limitahan ang malawak na kahulugan ng רֵעַ. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy nang hindi binabago ang ugnayan ng mga sugnay.
