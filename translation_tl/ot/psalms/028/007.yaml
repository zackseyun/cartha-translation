  text: יְהוָ֤ה עֻזִּ֥/י וּ/מָגִנִּ/י֮ בּ֤/וֹ בָטַ֥ח לִבִּ֗/י וְֽ/נֶ֫עֱזָ֥רְתִּי וַ/יַּעֲלֹ֥ז לִבִּ֑/י וּֽ/מִ/שִּׁירִ֥/י אֲהוֹדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: tl
  text: 'Si Yahweh ang aking lakas at aking kalasag;

    sa kanya nagtiwala ang puso ko, at ako ay natulungan.

    Kaya nagbunyi ang puso ko,

    at sa aking awit ay pupurihin ko siya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa aking awit ay magpapasalamat ako sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עֻזִּי
  choice: aking lakas
  rationale: Tuwirang ipinahahayag ng עֹז ang lakas o kapangyarihan; natural din itong katambal ng “aking kalasag.”
- source_word: מָגִנִּי
  choice: aking kalasag
  rationale: Ang מָגֵן ay literal na kalasag, at malinaw sa Tagalog ang larawang tumutukoy sa proteksiyon.
- source_word: בּוֹ בָטַח לִבִּי
  choice: sa kanya nagtiwala ang puso ko
  rationale: Ang בְּ kasunod ng בטח ay nagpapahayag ng pag-asa o pagtitiwala sa isang tao. Pinanatili ang “puso” bilang larawan ng panloob na pagkatao, at ang naganap na aspekto ng בָטַח.
- source_word: נֶעֱזָרְתִּי
  choice: ako ay natulungan
  rationale: Pinanatili ang anyong pasibo ng Niphal at hindi tahasang idinagdag ang gumagawa, bagaman malinaw sa konteksto na si Yahweh ang pinagmulan ng tulong.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: nagbunyi ang puso ko
  rationale: Ang עלז ay masidhi at masiglang kagalakan; ipinahahayag ng “nagbunyi” ang higit sa payak na pagkagalak at tumutugma sa sunod-sunod na kilos sa Hebreo.
- source_word: וּמִשִּׁירִי
  choice: at sa aking awit
  rationale: 'Ang מִן dito ay natural na mauunawaan bilang paraan o kasabay na kalagayan: ang pagpupuri ay ipinahahayag sa pamamagitan ng awit.'
- source_word: אֲהוֹדֶנּוּ
  choice: pupurihin ko siya
  rationale: Maaaring mangahulugan ang Hiphil ng ידה ng pagpuri o pagpapasalamat. Ang “pupurihin” ay akma sa konteksto ng awit, habang inilalahad sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan, hindi titulo, ang nasa tekstong Hebreo; pinananatili ito sa anyong “Yahweh” nang hindi pinapalitan ng “Panginoon.”
- issue: Di-tahasang tagagawa sa נֶעֱזָרְתִּי
  choice: ako ay natulungan
  alternative: tinulungan niya ako
  rationale: Hindi tahasang binabanggit ng anyong pasibo ang tagagawa. Pinananatili ng salin ang estruktura at hindi ginagawang lantad ang ipinahihiwatig lamang ng konteksto.
- issue: Saklaw ng אֲהוֹדֶנּוּ
  choice: pupurihin ko siya
  alternative: magpapasalamat ako sa kanya
  rationale: Parehong nakapaloob sa ידה ang pagpuri at pagpapasalamat. Mas natural ang “pupurihin” kasabay ng awit, ngunit hindi inaalis ang kahulugang pasasalamat.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Pinanatili ang parallelism, ang metapora ng kalasag, at ang pag-uulit ng “puso ko.” Ginamit ang “ako ay” sa halip na pinaikling “ako’y” upang maging malinaw at madaling basahin.
