  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili ang banal na pangalang Yahweh, ang mga metaporang “lakas” at “kalasag,” ang pagtitiwala ng puso, ang di-tahasang pasibong “ako ay natulungan,” ang pagbubunyi ng puso, at ang pagpuring inihahayag sa pamamagitan ng awit. Ang naganap na aspekto ng mga pandiwa ay isang lehitimong pagbasa ng Hebreong anyo at magkakaugnay ang daloy ng Tagalog.'
