  terminology: Ang “Yahweh,” “aking lakas,” “aking kalasag,” “nagtiwala,” “natulungan,” “nagbunyi,” at “pupurihin” ay angkop, malinaw, at hindi nagpapataw ng interpretasyong doktrinal. Wasto ring iniiwan ng “ako ay natulungan” na di-tahasang pinangalanan ang tagagawa, gaya ng Hebreo.
