  to: 'Kay David.[a]


    Sa iyo ako tumatawag, Yahweh;

    aking bato, huwag kang maging bingi sa akin.[b]


    Baka manahimik ka sa akin,

    at matulad ako sa mga bumababa sa hukay.[c]'
  rationale: Pinalitan lamang ang “magbingi-bingihan” ng “maging bingi.” Inaalis nito ang di-sinusuportahang pahiwatig ng sinasadyang pagwawalang-bahala, samantalang pinananatili ang posibleng pagkakaiba sa pagitan ng unang pandiwa (hindi pagdinig/pagiging bingi) at ng kasunod na חשה (“manahimik”). Walang binagong kahulugan ng talata o saklaw ng mga talababa.
