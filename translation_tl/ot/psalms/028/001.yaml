  naturalness: Ang patulang paghahati ng linya at ang register ay angkop sa modernong Filipino Tagalog. Ang “huwag kang maging bingi sa akin” ay mas tuwiran at mas ligtas kaysa “magbingi-bingihan,” habang nananatiling natural sa panalanging patula. Ang “manahimik ka sa akin” ay katanggap-tanggap sa ganitong register at pinananatili ang relasyunal na puwersa ng מִמֶּנִּי.
  terminology: Ang “Yahweh,” “aking bato,” at “hukay” ay angkop at tapat sa pinagmulan. Ang “Kay David” ay maaaring panatilihin bilang maigsi at hindi labis na nagpapasya sa malawak na gamit ng לְ; nililinaw ng talababa ang mga posibleng pagbasa.
