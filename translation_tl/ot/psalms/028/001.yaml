language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: tl
  text: 'Kay David.[a]


    Sa iyo ako tumatawag, Yahweh;

    aking bato, huwag kang maging bingi sa akin.[b]


    Baka manahimik ka sa akin,

    at matulad ako sa mga bumababa sa hukay.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kay David” ay maaari ring unawain bilang “ni David” o “para kay David.”
    reason: Pinananatili ang kalabuan ng לְ sa pamagat ng awit tungkol sa pagkatha, pag-uukol, o kaugnayan.
  - marker: b
    text: 'Maaari ring isalin: “huwag kang manahimik sa akin.”'
    reason: Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging bingi o sa pananahimik; pinili sa pangunahing teksto ang diwa ng hindi pagdinig upang maipakitang naiiba ito sa kasunod na “manahimik.”
  - marker: c
    text: Ang “hukay” ay maaaring tumukoy sa libingan o sa daigdig ng mga patay.
    reason: May mas malawak na kaugnayang semantiko ang בּוֹר kaysa sa isang karaniwang hukay, ngunit hindi ito kailangang tukuyin nang mas makitid sa pangunahing teksto.
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ng maikling pamagat ang lawak ng gamit ng לְ, na maaaring magpahiwatig ng may-akda, pag-uukol, o kaugnayan, nang hindi tahasang dinaragdagan ng “Awit ni.”
- source_word: אֵלֶיךָ ... אֶקְרָא
  choice: Sa iyo ako tumatawag
  rationale: Likas sa makabagong Tagalog at pinananatili ang tuwirang paglapit ng nananalangin kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צוּרִי
  choice: aking bato
  rationale: Pinananatili ang kongkretong talinghaga ng matatag na kanlungan at tagapagtanggol, sa halip na ipaliwanag ito sa mismong teksto.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: huwag kang magbingi-bingihan sa akin
  rationale: Ipinahahayag ang posibleng diwa ng חרשׁ na hindi pagdinig at naihihiwalay ito sa kasunod na pandiwang tahasang tumutukoy sa pananahimik. Ang idyomang Tagalog ay natural, bagaman maaari rin itong magpahiwatig ng sinasadyang hindi pakikinig; kaya may talababa.
- source_word: פֶּן תֶּחֱשֶׁה מִמֶּנִּי
  choice: Baka manahimik ka sa akin
  rationale: Ang “baka” ay natural na nagpapakilala sa kinatatakutang mangyari; ang “manahimik” ay pinananatiling naiiba sa naunang larawan ng pagkabingi.
- source_word: וְנִמְשַׁלְתִּי
  choice: at matulad ako
  rationale: Malinaw at likas na Tagalog para sa Niphal na may diwang maging gaya o maihambing.
- source_word: עִם יֹרְדֵי בוֹר
  choice: sa mga bumababa sa hukay
  rationale: Pinananatili ang aktuwal na larawang “hukay” at ang kilos ng pagbaba, nang hindi nililimitahan ang kahulugan sa libingan o daigdig ng mga patay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa salin sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng “hukay”
  choice: hukay
  alternative: libingan / daigdig ng mga patay
  rationale: Maaaring tumukoy ang larawan sa libingan o sa kalagayan/daigdig ng mga patay. Hindi nilulutas ng pangunahing teksto ang saklaw na ito, at ipinaliliwanag ito sa talababa.
- issue: Ugnayan ng dalawang pahayag tungkol sa di-pagtugon ng Diyos
  choice: magbingi-bingihan ... manahimik
  alternative: manahimik ... manahimik
  rationale: Pinananatili ang posibleng pagkakaiba ng חרשׁ at חשה—hindi pagdinig at hindi pagsagot—habang kinikilala sa talababa na maaari ring tumukoy sa pananahimik ang unang pandiwa.
translation_notes:
  register: Makabago, marangal, at patulang Tagalog. Gumamit ng maiikling linyang angkop sa panalangin at iniwasan ang luma o lubhang teknikal na pananalita. Ang “magbingi-bingihan” ay karaniwang idyoma ngunit may bahagyang pahiwatig ng sinasadyang hindi pakikinig; nililinaw ng talababa ang saklaw ng Hebreo.
