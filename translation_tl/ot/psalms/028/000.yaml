  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: tl
  text: 'Kay David.


    Sa iyo, Yahweh, tumatawag ako; Bato ko, huwag kang maging bingi sa akin[a], baka, kung mananahimik ka sa akin, matulad ako sa mga bumababa sa hukay[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Huwag kang manahimik sa akin.” Ang unang pandiwang Hebreo ay maaaring magpahiwatig ng pagiging bingi o pananahimik; ang pangunahing teksto ay pinananatili ang pagkakaiba nito sa kasunod na pandiwa, na malinaw na tumutukoy sa pananahimik.
    reason: lexical_alternative
  - marker: b
    text: Ang “hukay” ay maaaring tumukoy sa libingan o sa dako ng mga patay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: 'Pinananatili ang maikli at sadyang malabong ugnayan ng pang-ukol: maaaring tumukoy sa pagiging akda, pag-aalay, o pagkakaugnay kay David.'
- source_word: צוּרִי
  choice: ikaw ang aking bato
  rationale: Pinananatili ang konkretong metapora ng Diyos bilang matatag na kanlungan at sandigan.
- source_word: אַל־תֶּחֱרַשׁ ... תֶּחֱשֶׁה
  choice: Huwag kang manahimik ... kung hindi mo ako sasagutin
  rationale: Magkaugnay ang dalawang pandiwa sa ideya ng pananahimik o hindi pagtugon. Ang salin ay natural sa Filipino at nagpapakita ng pag-usad mula sa pakiusap tungo sa kinatatakutang kawalan ng sagot.
- source_word: בוֹר
  choice: hukay
  rationale: Pinananatili ang literal na larawan, habang ipinapaliwanag sa talababa ang posibleng pagtukoy sa libingan o dako ng mga patay.
theological_decisions:
- issue: Paglalahad sa tetragrammaton יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Gumagamit ng transliterasyon upang malinaw na katawanin ang personal na banal na pangalan sa tekstong Hebreo.
- issue: Kahulugan ng pananahimik ng Diyos
  choice: Hindi tahasang tinukoy kung ito ay hindi pakikinig o hindi pagsagot
  alternative: Huwag mo akong pakinggan / huwag mo akong pansinin
  rationale: Pinananatili ang saklaw at tensiyon ng mga pandiwang Hebreo nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
- issue: Kahulugan ng hukay
  choice: hukay, na may talababa
  alternative: libingan o daigdig ng mga patay sa pangunahing teksto
  rationale: Hindi nilulutas nang tahasan ang maaaring literal at metaporikal na saklaw ng בור.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikling superskripsiyon, ang pangalang Yahweh, at ang konkretong metaporang “aking bato.” Gumamit ng “sa akin” sa pakiusap upang ipakita ang direksiyon ng Hebreong parirala nang hindi maging labis na teknikal.
