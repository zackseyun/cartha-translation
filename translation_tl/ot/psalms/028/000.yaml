  source_fidelity: Kailangang panatilihin sa pangunahing teksto ang pagkakaiba ng unang pandiwang Hebreo (pagiging bingi/hindi pagdinig) at ng kasunod na pandiwa (pananahimik). Ang draft ay ginawang “manahimik” ang una at “hindi ... sasagutin” ang ikalawa, kaya nababawasan ang sinadyang pag-uulit na may pagkakaiba ng mga pandiwa sa Hebreo.
  naturalness: Mas natural at marangal sa modernong Filipino ang “tumatawag ako” kaysa “ako ay tumatawag.” Ang “Bato ko” ay maaaring gumana bilang tuwirang pagtawag sa Diyos at mas malapit sa anyong Hebreo kaysa sa buong pangungusap na “ikaw ang aking bato.”
  terminology: Ang “Yahweh,” “Bato ko,” at “hukay” ay angkop. Pinananatili ng “hukay” ang konkretong larawan ng בּוֹר, habang ang talababa ay wastong nagsasaad ng mas malawak na posibleng sanggunian.
  issues:
