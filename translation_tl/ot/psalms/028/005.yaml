  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: tl
  text: Sapagkat hindi nila nauunawaan ang mga gawa ni Yahweh ni ang gawa ng kaniyang mga kamay; gigibain niya sila at hindi niya sila itatayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang panalangin o hatol, at natural itong panimula sa marangal na Filipino.
- source_word: יָבִינוּ אֶל
  choice: nauunawaan ... ang
  rationale: Ang בין ay tumutukoy sa pag-unawa o pagkilala nang may pagkaunawa; hindi kailangang isalin nang hiwalay ang אֶל sa natural na Filipino.
- source_word: פְּעֻלֹּת יְהוָה
  choice: mga gawa ni Yahweh
  rationale: Pinananatili ang maramihang anyo ng פְּעֻלֹּת at ang personal na pangalang יהוה.
- source_word: מַעֲשֵׂה יָדָיו
  choice: ang ginawa ng kanyang mga kamay
  rationale: Natural na Filipino para sa Hebreong idyoma habang pinananatili ang larawan ng mga kamay bilang gumagawa.
- source_word: יֶהֶרְסֵם
  choice: gigibain niya sila
  rationale: Ang הרס ay karaniwang tumutukoy sa paggiba; pinananatili nito ang metaporang panggusali.
- source_word: וְלֹא יִבְנֵם
  choice: at hindi itatayo
  rationale: Pinananatili ang tuwirang pagsalungat ng בנה sa 'gigibain' nang hindi ipinapasok ang mas tiyak na ideya ng muling pagtatayo.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Bagay ng mga pandiwang 'gigibain' at 'itatayo'
  choice: Ang 'sila' ay tahasang nasa unang pandiwa at ipinahihiwatig sa ikalawa
  alternative: Ulitin ang 'sila' sa parehong pandiwa
  rationale: Kapwa may hulaping panghalip na maramihan ang mga pandiwa sa Hebreo, ngunit sa Filipino ay mas natural na huwag ulitin ang layon sa magkaugnay na sugnay; nananatiling malinaw na ang parehong mga tao ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo at metaporang paggiba/pagtatayo. Hindi naglagay ng talababa sapagkat ang alternatibong 'pinapansin' o 'isinasaalang-alang' para sa יָבִינוּ אֶל ay hindi kailangan upang maunawaan ang talata at mas mahina kaysa sa pangunahing kahulugang 'nauunawaan.'
