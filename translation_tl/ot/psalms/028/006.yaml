  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: tl
  text: Purihin si Yahweh, sapagkat dininig niya ang tinig ng aking pagsusumamo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang tinig ng mga paghingi ko ng awa.” Sa literal, nasa Hebreo ang “tinig/tunog ng aking mga pagsusumamo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Ang anyong Hebreo ay isang pasibong participle na ginagamit bilang pormulang papuri. Ang “Purihin” ang natural at marangal na katumbas sa modernong Tagalog, sa halip na ang di-likas na “Pagpalain si Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng titulong “Panginoon.”
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang sumunod na pahayag ang dahilan ng papuri.
- source_word: שָׁמַע
  choice: dininig niya
  rationale: Ang ganap na pandiwang Hebreo ay tumutukoy sa natupad na pakikinig ng Diyos. Sa konteksto ng panalangin, mas angkop ang “dininig” kaysa sa payak na “narinig,” sapagkat ipinahihiwatig nito ang mapagtuong pakikinig nang hindi tahasang nagdaragdag na ipinagkaloob na ang kahilingan.
- source_word: קוֹל
  choice: ang tinig ng
  rationale: Ang קוֹל ay maaaring mangahulugang “tinig” o “tunog.” Pinananatili ng “tinig” ang konkretong larawan sa Hebreo at mas natural ito sa konteksto ng personal na panalangin.
- source_word: תַּחֲנוּנָי
  choice: aking pagsusumamo
  rationale: Tumutukoy ito sa taimtim na paghingi ng lingap o awa. Ang “pagsusumamo” ay maikli, marangal, at malinaw sa modernong Tagalog; maaari ring ipaliwanag bilang “mga paghingi ko ng awa.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehova
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Lakas ng pandiwang שָׁמַע sa panalangin
  choice: dininig niya
  alternative: narinig niya; pinakinggan niya
  rationale: Ipinahahayag ng talata na ang Diyos ay nakinig sa pagsusumamo. Hindi idinaragdag ng salin na naibigay na ang mismong kahilingan, kaya napapanatili ang saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panulaang panrelihiyon. Ginamit ang likas na pormulang “Purihin si Yahweh” para sa Hebreong pagpapahayag ng papuri, at pinanatili ang konkretong “tinig” habang nililinaw sa talababa ang posibleng mas eksplisitong kahulugang paghingi ng awa.
