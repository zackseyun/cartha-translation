  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: tl
  text: upang ang aking kaluwalhatian ay umawit ng papuri sa iyo at hindi manahimik. O Yahweh, aking Diyos,[a] magpapasalamat ako sa iyo magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ang aking buong pagkatao ay umawit ng papuri sa iyo.” Sa Hebreo, “aking kaluwalhatian,” isang patulang pananalitang maaaring tumukoy sa kaloob-looban o sa dila ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o bunga sa makabagong Tagalog.
- source_word: יְזַמֶּרְךָ
  choice: umawit ng papuri sa iyo
  rationale: Sinasaklaw ang musikal at mapagpuring diwa ng Piel na anyo ng זמר.
- source_word: כָבוֹד
  choice: ang aking kaluwalhatian
  rationale: Pinananatili ang literal at matalinghagang pananalita ng Hebreo; ipinahihiwatig ng konteksto ang unang panauhang pag-aari, habang inilalagay sa talababa ang mas interpretatibong pagbasa.
- source_word: וְלֹא יִדֹּם
  choice: at hindi manahimik
  rationale: Sa pagtutunggali nito sa pag-awit, ang katahimikan ang pinakamalinaw na diwa ng דמם dito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: Tuwirang anyong paari na ginagamit dito bilang pantawag.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, marangal, at likas na Tagalog para sa walang-hanggang tagal sa konteksto ng pagpupuri.
- source_word: אוֹדֶךָּ
  choice: magpapasalamat ako sa iyo
  rationale: Ang Hiphil ng ידה sa awit ng pasasalamat ay likas na tumutukoy sa hayagang pagpapasalamat o pagpupuri.
theological_decisions:
- issue: Ang kahulugan ng כָבוֹד bilang siyang umaawit
  choice: Pinanatili sa pangunahing teksto ang literal na talinghagang “aking kaluwalhatian.”
  alternative: “aking buong pagkatao” o “aking dila”
  rationale: Hindi tiyak kung ang patulang katawagan ay tumutukoy sa kaloob-looban, buong pagkatao, o dila ng mang-aawit. Pinananatili ng pangunahing teksto ang anyo ng Hebreo, at inilalahad sa talababa ang interpretatibong mga posibilidad.
- issue: Ang pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan na nasa tekstong Hebreo at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang di-karaniwang talinghagang “aking kaluwalhatian” upang hindi mapawi ang tunay na kalabuan ng tulang Hebreo; ipinaliwanag ito sa talababa.
