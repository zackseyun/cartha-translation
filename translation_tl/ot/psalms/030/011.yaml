  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: tl
  text: Ginawa mong sayaw ang aking pagdadalamhati; kinalagan mo ang damit-sako ko at binigkisan mo ako ng kagalakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: ang pagdadalamhati ko
  rationale: Tumutukoy sa pagdadalamhati o panaghoy ng nagsasalita; pinili ang karaniwang makabagong anyo na angkop sa marangal na pananalita.
- source_word: לְמָחוֹל לִי
  choice: sayaw para sa akin
  rationale: Pinananatili ang larawan ng sayaw at ang tahasang לִי, “para sa akin,” nang hindi inaalis ang personal na diin ng Hebreo.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: kinalagan mo ang aking damit-sako
  rationale: Ang פִּתַּחְתָּ ay literal na ‘kinalagan/binuksan,’ at ang שַׂקִּי ay damit-sakong isinusuot sa pagluluksa. Pinananatili ng salin ang konkretong kilos at larawan.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: at binihisan mo ako ng kagalakan
  rationale: Ang pandiwa ay may diwang ‘bigkisan’ o ‘damitan.’ Ang ‘binihisan’ ay natural sa Tagalog at pinananatili ang metapora ng kagalakang isinuot sa tao.
theological_decisions:
- issue: Ang pagbabago mula pagluluksa tungo sa kagalakan
  choice: Inilarawan bilang direktang ginawa ng kausap na Diyos sa nagsasalita.
  alternative: Gawing pangkalahatang pahayag tungkol sa pagbuti ng kalagayan.
  rationale: Ang mga pandiwa sa ikalawang panauhan at ang mga hulaping unang panauhan sa Hebreo ay personal at tuwirang nagsasaad ng pagkilos ng Diyos, nang hindi ipinapaliwanag ang paraan o saklaw nito.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatugmang larawang Hebreo: ang pagdadalamhati ay naging sayaw, inalis ang damit-sako ng pagluluksa, at ipinalit ang kagalakan bilang kasuotan.'
