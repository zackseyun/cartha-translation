  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: tl
  text: Dinggin mo ako, Yahweh, at kahabagan[a] mo ako; Yahweh, maging tagatulong ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpakita ka ng kagandahang-loob sa akin.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng mapagbiyayang paglingap o awa sa pagsusumamo para sa tulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dinggin mo ako
  rationale: Ang pautos na anyo ng שׁמע ay isang tuwirang pakiusap sa panalangin. Bagaman walang tahasang layon sa Hebreo, natural sa Tagalog na idagdag ang “ako” upang ipahayag ang ipinahihiwatig na layon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְחָנֵּנִי
  choice: at kahabagan mo ako
  rationale: Ang חנן ay humihiling ng mapagbiyayang paglingap o awa. Sa konteksto ng agarang paghingi ng tulong, likas at marangal sa Tagalog ang “kahabagan mo ako,” habang pinananatili sa talababa ang alternatibong diin sa biyaya.
- source_word: הֱיֵה עֹזֵר לִי
  choice: ikaw ang tumulong sa akin
  rationale: Ang הֱיֵה ay pautos na “maging,” at ang participle na עֹזֵר ay tumutukoy sa isang tumutulong. Ang “ikaw ang tumulong sa akin” ay natural na pakiusap sa modernong Tagalog at pinananatili ang personal na diwa ng tagapagbigay ng tulong.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng חנן
  choice: kahabagan mo ako
  alternative: pagpalain mo ako ng iyong kagandahang-loob
  rationale: Maaaring magpahayag ang pandiwa ng awa o mapagbiyayang paglingap. Ang pangunahing salin ay gumagamit ng natural na wika ng pagsusumamo, ngunit hindi itinatanggi ang diin sa biyaya.
translation_notes:
  register: Makabago, marangal, at tuwirang wikang panalangin. Ginamit ang “dinggin” sa halip na karaniwang “pakinggan” upang mapanatili ang taimtim na rehistro ng salmo nang hindi nagiging lipas. Walang talababa sa pangunahing teksto dahil ang “kahabagan” ay sapat na kumakatawan sa kontekstuwal na diwa; ang alternatibong leksikal ay itinala sa mga pasiya.
