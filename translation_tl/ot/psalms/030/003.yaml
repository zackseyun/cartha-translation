base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: tl
  text: Yahweh, iniahon mo ang buhay ko mula sa Sheol[a][b]; iningatan mo akong buhay mula sa piling ng mga bumababa sa hukay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Sheol ay salitang Hebreo para sa daigdig o kinaroroonan ng mga patay; maaari ring isalin na “libingan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ang kaluluwa ko”; maaari rin itong mangahulugang “ako.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “binuhay mo akong muli mula sa piling ng mga bumababa sa hukay,” o, ayon sa ibang pagkakaunawa sa pangungusap, “pinanatili mo akong buhay upang hindi ako bumaba sa hukay.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: הֶעֱלִיתָ
  choice: iniahon mo
  rationale: Likas sa Filipino ang “iniahon” para sa pagpapataas mula sa isang malalim o mapanganib na kalagayan, at pinananatili nito ang patayong larawan ng tekstong Hebreo.
- source_word: מִן שְׁאוֹל
  choice: mula sa Sheol
  rationale: Pinanatili ang “Sheol” sapagkat maaari itong tumukoy sa daigdig o kinaroroonan ng mga patay at hindi lamang sa isang pisikal na libingan; ipinaliwanag ito sa talababa.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa kontekstong ito ng pagliligtas mula sa kamatayan, natural na ipinahahayag ng “buhay ko” ang saklaw ng נֶפֶשׁ nang hindi ipinipilit ang isang teknikal na paghahati ng tao sa katawan at kaluluwa. Nasa talababa ang mga alternatibo.
- source_word: חִיִּיתַנִי
  choice: pinanatili mo akong buhay
  rationale: Ipinahahayag nito ang pag-iingat o pagpapanumbalik ng buhay nang hindi ginagawang tahasang pahayag tungkol sa muling pagkabuhay ang talata.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: mula sa piling ng mga bumababa sa hukay
  rationale: Pinananatili nito ang larawan ng pagkahiwalay sa pangkat ng mga bumababa sa hukay, habang ang ibang posibleng pagbasa sa sintaks ay inilagay sa talababa.
- source_word: בּוֹר
  choice: hukay
  rationale: Ang “hukay” ay tuwirang katumbas na nagpapanatili sa makatang larawan ng libingan o kamatayan.
theological_decisions:
- issue: Kung dapat bang ipahiwatig ng salin ang isang ganap na nabuo nang doktrina tungkol sa kabilang buhay o muling pagkabuhay
  choice: Panatilihin ang mga larawang “Sheol” at “hukay” at isalin ang חִיִּיתַנִי bilang “pinanatili mo akong buhay.”
  alternative: Isalin ang Sheol bilang “impiyerno” o gawing tahasan ang pahayag na “binuhay mo akong muli mula sa mga patay.”
  rationale: Inilalarawan ng salmo ang pagliligtas mula sa kamatayan o sa bingit nito. Hindi nililinaw ng talata kung ito ay literal na muling pagkabuhay, kaya hindi iyon ipinilit ng salin.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “iniahon” at “hukay” ay malinaw sa karaniwang mambabasa at nagpapanatili sa patayong imahen ng tulang Hebreo. Hindi isinalin ang Sheol bilang “impiyerno” upang maiwasan ang pagpasok ng mas tiyak na doktrinang hindi tahasang sinasabi ng talata.
