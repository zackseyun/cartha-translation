  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: tl
  text: 'Itataas kita, Yahweh,


    sapagkat iniahon mo ako[a]


    at hindi mo hinayaang magalak ang mga kaaway ko laban sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinila mo ako paitaas”; ang pandiwang Hebreo ay literal na naglalarawan ng paghila ng isang bagay paitaas, gaya ng mula sa balon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Itataas kita
  rationale: Ang anyo ng רום ay nagpapahayag ng pagtataas o pagdakila sa papuri. Likas at marangal sa Tagalog ang “Itataas kita,” at napananatili nito ang patayong talinghaga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng papuri; malinaw at angkop sa marangal na makabagong Tagalog ang “sapagkat.”
- source_word: דִלִּיתָנִי
  choice: iniahon mo ako
  rationale: Ang דלה ay naglalarawan ng paghila o pagsalok paitaas, gaya ng pag-ahon mula sa balon o hukay. Likas sa Tagalog ang “iniahon” at napananatili ang konkretong larawan.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: at hindi mo hinayaang magalak
  rationale: Bagaman literal na causative ang pandiwa, sa konteksto ay natural itong nagsasaad na hindi pinahintulutan ng Diyos ang mga kaaway na magdiwang sa kapahamakan ng salmista.
- source_word: אֹיְבַי
  choice: ang aking mga kaaway
  rationale: Tuwiran at likas na salin ng pangngalang maramihan na may hulaping unang panauhang paari.
- source_word: לִי
  choice: dahil sa sinapit ko
  rationale: Ang לִי rito ay maaaring magpahiwatig ng pagdiriwang ng mga kaaway kaugnay ng salmista o sa kanyang kapinsalaan. Nililinaw ng parirala ang diwang iyon nang hindi ipinapalagay na literal silang namamahala “sa ibabaw” niya.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang personal na pangalang “Yahweh” at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Diwa ng pagalak ng mga kaaway
  choice: magalak ... dahil sa sinapit ko
  alternative: magalak laban sa akin / magtagumpay sa akin
  rationale: Pinananatili nitong bukas kung ang kagalakan ay dahil sa kapahamakan ng salmista o sa inaakalang tagumpay ng mga kaaway, nang hindi nagdaragdag ng tiyak na pangyayaring wala sa teksto.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino. Ginamit ang “iniahon” upang maging natural sa karaniwang mambabasa habang pinananatili ang larawan ng pagliligtas mula sa isang mababang lugar. Ang ayos sa tatlong linya ay sumusunod sa daloy ng papuri at sa dalawang dahilan nito.
