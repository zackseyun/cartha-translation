  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: tl
  text: Umawit kayo ng papuri kay Yahweh, kayong mga tapat sa kanya, at magpasalamat kayo sa paggunita sa kanyang kabanalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at magpasalamat kayo sa pagbanggit ng kanyang kabanalan.” Sa ibang salin, “banal niyang pangalan,” bagaman walang tahasang salitang “pangalan” sa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Umawit kayo ng papuri
  rationale: Ang Piel imperative na maramihan ay tumutukoy sa pag-awit o pagtugtog bilang papuri; malinaw at natural sa Tagalog ang “umawit ng papuri.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang יהוה bilang “Yahweh,” alinsunod sa anyong personal na pangalan sa tekstong Hebreo.
- source_word: חֲסִידָיו
  choice: kayong mga tapat sa kanya
  rationale: Ang חָסִיד ay tumutukoy sa mga taong may katapatan at debosyon sa Diyos. Ginagawang hayag ng “kayong” ang bokatibong gamit nang hindi ito nililimitahan sa eklesiastikong diwa ng “mga banal.”
- source_word: וְהוֹדוּ
  choice: at magpasalamat kayo
  rationale: Sa kontekstong pagsamba, ang Hiphil imperative ng ידה ay karaniwang nangangahulugang magpasalamat o magpahayag ng papuri.
- source_word: לְזֵכֶר
  choice: sa pag-alaala sa
  rationale: Pinananatili nito ang diwa ng זֵכֶר bilang pag-alaala, habang ang talababa ay nagtatala ng posibleng kahulugang “pagbanggit.”
- source_word: קָדְשׁוֹ
  choice: kanyang kabanalan
  rationale: Tuwirang ipinapahayag ng קֹדֶשׁ na may hulaping panghalip ang “kanyang kabanalan”; hindi idinaragdag sa pangunahing teksto ang salitang “pangalan,” na wala rito nang tahasan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ng “Yahweh” ang tahasang anyo nito sa halip na palitan ng titulo.
- issue: Saklaw ng חֲסִידָיו
  choice: mga tapat sa kanya
  alternative: mga banal niya / mga maka-Diyos
  rationale: Ipinapakita ng pinili ang ugnayang katapatan at debosyon nang hindi nagpapasok ng mas makitid na denominasyonal na kahulugan.
- issue: Kahulugan ng לְזֵכֶר קָדְשׁוֹ
  choice: sa pag-alaala sa kanyang kabanalan
  alternative: sa pagbanggit ng kanyang kabanalan / banal na pangalan
  rationale: Pinananatili ang kakaiba at medyo bukas na pahayag ng Hebreo. Hindi tahasang nilulutas ang זֵכֶר bilang “pangalan,” bagaman maaaring tumukoy ang parirala sa liturhikong pagbanggit o paggunita.
translation_notes:
  register: Makabago ngunit marangal na Filipino; tuwiran ang mga pautos na maramihan. Ginamit ang “sa kanya” sa bokatibo upang maging malinaw ang kaugnayan ng katapatan, at pinanatili ang bahagyang di-pangkaraniwang “pag-alaala sa kanyang kabanalan” dahil gayon din ang tensiyon ng Hebreo.
