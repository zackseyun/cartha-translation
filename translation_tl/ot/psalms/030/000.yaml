  text: מִזְמ֡וֹר שִׁיר חֲנֻכַּ֖ת הַ/בַּ֣יִת לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/000.yaml
  text: A psalm[a]. A song for the dedication of the house[b]. Of David.
translation:
  language: tl
  text: Isang salmo. Awit para sa pagtatalaga ng bahay[a]. Kay David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo” o “palasyo”; “bahay” lamang ang nasa Hebreo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Ni David” o “Para kay David.” Hindi tiyak ng pariralang Hebreo ang eksaktong ugnayan ni David sa awit.
    reason: source_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang “salmo” ang karaniwan at likas na katawagan sa ganitong uri ng awit at pinananatili nito ang pagkakaiba sa kasunod na שִׁיר.
- source_word: שִׁיר
  choice: Awit
  rationale: 'Isinalin nang hiwalay upang mapanatili ang magkatambal na katawagang pang-uri sa Hebreo: מִזְמוֹר at שִׁיר.'
- source_word: חֲנֻכַּת
  choice: para sa pagtatalaga
  rationale: Ang pangngalan ay tumutukoy sa seremonyal na pagtatalaga; ang “para sa” ay natural na nagpapahayag ng okasyon o layon ng awit.
- source_word: הַבַּיִת
  choice: ng bahay
  rationale: Ang literal at hindi tiyak na kahulugan ay “bahay.” Hindi tinukoy ng Hebreo kung templo, palasyo, o ibang bahay ang tinutukoy.
- source_word: לְדָוִד
  choice: Kay David
  rationale: Mas naipakikita ng “Kay David” kaysa “ni David” ang lawak ng לְ—maaaring tumukoy sa pagkakaugnay, pag-aari, pag-aalay, o pagkakatha—nang hindi agad ipinapasiya ang eksaktong ugnayan.
theological_decisions:
- issue: Ang tinutukoy ng “bahay” sa pamagat
  choice: bahay
  alternative: templo o palasyo ni David
  rationale: Malawak ang kahulugan ng בַּיִת at hindi nililinaw ng pamagat ang tinutukoy nito. Pinananatili ng salin ang tunay na kalabuan sa halip na magpasok ng isang tiyak na historikal na paliwanag.
- issue: Ang ugnayan ni David sa salmo
  choice: Kay David
  alternative: Ni David; Para kay David
  rationale: Maaaring magpahiwatig ang לְדָוִד ng pagkakatha, pag-aari, pag-aalay, o kaugnayan. Ang “Kay David” ay hindi gaanong tiyak kaysa “Ni David” at kaya ay mas nakapag-iingat sa kalabuan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling parirala bilang pamagat upang likas na maipakita ang magkakahiwalay na paglalarawan sa superskripsiyon. Pinanatili ang terminong “salmo,” na pamilyar sa karaniwang mambabasang Filipino, at ang payak na “bahay” upang huwag lutasin ang hindi tinukoy ng teksto.
