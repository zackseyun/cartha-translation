lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהָי
  choice: aking Diyos
  rationale: Ang anyong may hulaping unang panauhang isahan ay nangangahulugang “aking Diyos” at bahagi ng tuwirang pagtawag.
- source_word: שִׁוַּעְתִּי
  choice: dumaing ako para humingi ng tulong
  rationale: Ipinahahayag ng pandiwa ang isang apurahang pagdaing o pagsigaw para sa tulong; natural ito sa makabagong Tagalog at malinaw na naihahatid ang tindi ng Hebreo.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Likas na Tagalog na panumbas sa direksiyon ng pagdaing patungo sa kinakausap.
- source_word: וַתִּרְפָּאֵנִי
  choice: at pinagaling mo ako
  rationale: Direktang ipinapahayag ang diwa ng רפא habang pinananatiling bukas kung pisikal na pagpapagaling o mas malawak na pagpapanumbalik ang tinutukoy.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang malinaw na pagkakaiba nito sa isang titulo.
- issue: Saklaw ng kahulugan ng רפא
  choice: pinagaling mo ako
  alternative: ibinalik mo ako sa mabuting kalagayan; iniligtas mo ako
  rationale: Ang “pinagaling” ang pinakamalapit na panumbas at hindi tahasang nagpapasiya kung sakit sa katawan o mas pangkalahatang pagpapanumbalik ang nasa konteksto.
translation_notes:
  register: Makabago, dignidadong Filipino na angkop sa panalangin. Ginamit ang “O” upang panatilihin ang marubdob na tuwirang pagtawag; iniwasan ang mga salitang lipas gaya ng “sa iyo'y.”
