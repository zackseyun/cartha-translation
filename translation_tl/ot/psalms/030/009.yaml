base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: tl
  text: 'Ano ang mapapala sa pagkabuhos ng aking dugo[a],

    sa pagbaba ko sa hukay[b]?


    Pupurihin ka ba ng alabok?

    Ipahahayag ba nito ang iyong katapatan[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ano ang pakinabang sa aking kamatayan?” Literal sa Hebreo, “Ano ang pakinabang sa aking dugo?”
    reason: lexical_alternative
  - marker: b
    text: O “libingan.”
    reason: lexical_alternative
  - marker: c
    text: O “katotohanan.” Ang salitang Hebreo ay maaaring mangahulugang “katotohanan” o “katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Ano ang pakinabang
  rationale: Likas na naihahayag sa Filipino ang retorikal na tanong tungkol sa anumang pakinabang o kapakinabangang maidudulot.
- source_word: בְּדָמִי
  choice: sa aking dugo
  rationale: Pinananatili ang kongkretong larawan ng Hebreong ‘aking dugo’ sa halip na agad itong ipakahulugang ‘aking kamatayan.’
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: sa pagbaba ko sa hukay
  rationale: Pinananatili ang larawan ng pagbaba tungo sa kamatayan at ang pagkakatulad ng kayarian ng dalawang parirala sa Hebreo.
- source_word: שָׁחַת
  choice: hukay
  rationale: Direktang inililipat ang makatang larawan ng pit o hukay; ang ‘libingan’ ay isang posibleng mas interpretibong salin.
- source_word: הֲיוֹדְךָ עָפָר
  choice: Pupurihin ka ba ng alabok
  rationale: Sa konteksto ng pagsamba sa Mga Awit, ang ידה ay angkop na isaling ‘purihin,’ samantalang pinananatili ng ‘alabok’ ang larawan ng mortalidad.
- source_word: הֲיַגִּיד
  choice: Ipahahayag ba nito
  rationale: Ang ‘ipahayag’ ay malinaw, marangal, at angkop sa makatang diwa ng hayagang pagsasabi ng mga gawa o katangian ng Diyos.
- source_word: אֲמִתֶּךָ
  choice: iyong katapatan
  rationale: Maaaring mangahulugan ang אֱמֶת ng katotohanan o katapatan; sa panalanging umaapela sa mapagkakatiwalaang katangian ng Diyos, natural ang ‘katapatan’ nang hindi inaalis ang alternatibo sa talababa.
theological_decisions:
- issue: Kung tuwirang ipaliliwanag ang mga larawan ng kamatayan o pananatilihin ang makatang kongkreto ng Hebreo
  choice: Panatilihin sa pangunahing teksto ang ‘dugo,’ ‘hukay,’ at ‘alabok.’
  alternative: Isalin nang mas interpretibo bilang ‘kamatayan,’ ‘libingan,’ at ‘mga patay.’
  rationale: Ipinangangatwiran ng talata na kapag namatay ang salmista ay hindi na siya hayagang makapagpupuri, ngunit ipinahahayag ito ng Hebreo sa pamamagitan ng masisidhing larawan. Ang pagpapanatili sa mga iyon ay umiiwas sa tahimik na paglutas sa tula.
- issue: Saklaw ng kahulugan ng אֱמֶת
  choice: katapatan
  alternative: katotohanan
  rationale: Ang ‘katapatan’ ay umaangkop sa panawagan sa mapagkakatiwalaang pagkilos at katangian ng Diyos, ngunit tunay na posible rin ang ‘katotohanan’ at kaya ay inilagay sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa panalangin at tula. Pinanatili ang maiikli at magkatugmang retorikal na tanong, gayundin ang kongkretong larawan ng dugo, hukay, at alabok.
