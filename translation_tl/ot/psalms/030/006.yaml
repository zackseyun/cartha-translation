translation:
  language: tl
  text: Ako naman ay nagsabi nang panatag ang kalagayan ko[a], “Hindi ako matitinag kailanman.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa kaginhawahan ako,” “ligtas ang kalagayan ko,” o “maunlad ako.” Ang salitang Hebreo ay tumutukoy sa tahimik at ligtas na mabuting kalagayan, hindi lamang sa materyal na kasaganaan.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “Hindi ako matitinag magpakailanman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ... ako
  rationale: Ang pangatnig at tahasang panghalip ay nagbibigay-diin sa nagsasalita at, sa konteksto, nagpapahiwatig ng paglipat o pagsalungat sa naunang kalagayan. Likas sa Tagalog ang “Ngunit sinabi ko” kaysa sa literal na “At ako, sinabi ko.”
- source_word: אָמַרְתִּי
  choice: sinabi ko
  rationale: Ang qatal ay angkop na isalin sa payak na naganap; hindi nito sapilitang hinihingi ang anyong katumbas ng pluperfect.
- source_word: בְשַׁלְוִי
  choice: noong panatag ako
  rationale: Ang שַׁלְוָה ay tumutukoy sa kapanatagan, kaginhawahan, o ligtas na mabuting kalagayan. Pinananatili ng “panatag” ang lawak ng kahulugan nang hindi ito nililimitahan sa materyal na kasaganaan.
- source_word: בַּל ... לְעוֹלָם
  choice: hindi ... kailanman
  rationale: Pinagsasama ng saling ito ang patulang pagtanggi at ang temporal na diwa ng לְעוֹלָם sa likas at mariing Tagalog.
- source_word: אֶמּוֹט
  choice: matitinag
  rationale: Mula sa מוט, inilalarawan nito ang pagiging mayayanig o mawawalan ng katatagan. Ang “matitinag” ay natural at marangal na Tagalog na nagpapanatili sa metapora.
theological_decisions:
- issue: Ang uri ng kapanatagan ng salmista
  choice: panatag
  alternative: maunlad / sagana
  rationale: Hindi tahasang nililimitahan ng Hebreo ang שַׁלְוָה sa materyal na kasaganaan; maaaring saklaw nito ang kaginhawahan, katahimikan, at pakiramdam ng seguridad. Iniingatan ng salin ang saklaw na ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “panatag” upang mapanatili ang lawak ng Hebreong שַׁלְוָה, at “matitinag” upang maingatan ang metapora ng katatagan.
