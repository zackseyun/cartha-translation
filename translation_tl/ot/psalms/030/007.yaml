  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: tl
  text: 'Yahweh, dahil sa iyong kagandahang-loob,

    ginawa mong matatag ang aking bundok.[a]

    Nang ikubli mo ang iyong mukha,

    nasindak ako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinatag mo ang lakas para sa aking bundok.” Siksik ang pananalita sa Hebreo at maaari ring tumukoy ang larawan sa ligtas na kasaganaan o matatag na kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos ayon sa mismong Hebreo; ipinahihiwatig na ng tuwirang pagtawag ang bokatibo kaya hindi na kailangan ang artipisyal na “O.”
- source_word: בִּרְצוֹנְךָ
  choice: dahil sa iyong kagandahang-loob
  rationale: Ang רָצוֹן ay tumutukoy sa pabor, mabuting kalooban, o pagtanggap. Ipinahahayag ng parirala na ang katatagan ng nagsasalita ay bunga ng mabuting kalooban ng Diyos.
- source_word: הֶעֱמַדְתָּה
  choice: ginawa mong matatag
  rationale: Ang Hiphil ng עמד ay sanhiang anyo, “pinatayo” o “ginawang manatiling nakatayo.” Ang saling ito ay natural sa Tagalog at naiuugnay ang pandiwa sa kasunod na עֹז.
- source_word: לְהַרְרִי
  choice: ang aking bundok
  rationale: Pinanatili ang tahasang larawang “aking bundok” sa halip na ipakahulugan agad bilang kasaganaan, tanggulan, o katayuan.
- source_word: עֹז
  choice: matatag
  rationale: Ang עֹז ay “lakas.” Ginamit itong panuring na “matatag” upang maipahayag sa likas na Tagalog ang siksik na pariralang Hebreo nang hindi inaalis ang larawan ng bundok.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: ikubli mo ang iyong mukha
  rationale: Pinanatili ang mahalagang idyomang Hebreo tungkol sa pagkakait o pag-urong ng presensiya at pabor ng Diyos.
- source_word: נִבְהָל
  choice: nasindak
  rationale: Saklaw ng Niphal ng בהל ang pagkabigla, pagkabalisa, at pagkatakot. Ang “nasindak” ay nagpapahayag ng bigla at matinding ligalig nang hindi kinakailangang tumukoy sa sukdulang takot.
theological_decisions:
- issue: Pagsasalin sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng talata ang tetragramang יְהוָה. Pinanatili ang pangalang Yahweh nang walang pagpapalit sa isang titulo.
- issue: Kahulugan ng “aking bundok”
  choice: Pinanatili ang larawang “aking bundok” sa pangunahing teksto
  alternative: aking kasaganaan; aking tanggulan; aking matatag na kalagayan
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang Hebreo. Ang pagpapanatili sa bundok ay umiiwas sa tahimik na paglutas sa talinghaga bilang kasaganaan o seguridad lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang paralelismong patula at ang konkretong larawan ng bundok at pagkukubli ng mukha. Inilagay ang talababa sa “aking bundok,” ang mismong pariralang may tunay na kahirapang leksikal at sintaktiko.
