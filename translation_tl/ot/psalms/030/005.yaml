base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: tl
  text: 'Sapagkat sandali lamang ang kanyang galit;

    sa kanyang lingap ay may buhay.

    Sa gabi’y mamamalagi ang pag-iyak[a],

    ngunit sa umaga nama’y kagalakan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magpalipas ng gabi” o “manuluyang magdamag”; inilalarawan ang pag-iyak na parang pansamantalang panauhin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sigaw ng galak” o “masayang pag-awit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag at likas ang daloy nito sa makatang konteksto.
- source_word: רֶגַע בְּאַפּוֹ
  choice: sandali lamang ang kanyang galit
  rationale: Ang רֶגַע ay napakaikling panahon, at ang אַף ay idyomatikong tumutukoy sa galit. Ang “lamang” ay malinaw na naghahayag ng kaiklian nang hindi dinaragdagan ang diwa.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: ang kanyang kagandahang-loob ay nagbibigay-buhay
  rationale: Ang חַיִּים ay “buhay,” samantalang ang רָצוֹן dito ay pabor o mabuting kalooban. Inihahayag ng salin sa likas na Tagalog ang kaugnayan ng buhay sa pabor ng Diyos, nang hindi ito ginagawang “habambuhay,” na hindi tahasang nakasulat.
- source_word: בָּעֶרֶב
  choice: Sa gabi’y
  rationale: Pinananatili ang temporal na larawan at ang tuwirang pagtutunggali ng gabi at umaga.
- source_word: יָלִין בֶּכִי
  choice: maaaring mamalagi ang pag-iyak
  rationale: Ang pandiwa ay tumutukoy sa pagpapalipas ng gabi o pansamantalang panunuluyan. Pinananatili ng “mamalagi” ang personipikasyon ng pag-iyak at ipinahihiwatig ng “maaaring” na pansamantala ito.
- source_word: וְלַבֹּקֶר
  choice: ngunit sa umaga nama’y
  rationale: Bagaman karaniwang pang-ugnay ang וְ, kontrastibo ang tungkulin nito rito dahil pinagtatapat ang gabi at umaga, kaya ang “ngunit” ay angkop.
- source_word: רִנָּה
  choice: kagalakan
  rationale: Malawak at likas na katumbas ito na kaagapay ng “pag-iyak.” Ang mas tiyak na tinig ng masayang pagsigaw o pag-awit ay inilagay sa talababa.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip sa “kanyang galit” at “kanyang kagandahang-loob”
  choice: Tumutukoy ang mga ito sa Diyos, ayon sa konteksto ng salmo.
  alternative: Iwanang walang tinutukoy na tahasang referent sa mismong talata.
  rationale: 'Ang naunang konteksto ay tumutukoy sa PANGINOON. Pinananatili ng salin ang tunay na pagtutunggali: totoo ngunit sandali ang galit ng Diyos, samantalang nagbibigay-buhay ang kanyang kagandahang-loob.'
- issue: Kaugnayan ng “buhay” at “kagandahang-loob”
  choice: ang kanyang kagandahang-loob ay nagbibigay-buhay
  alternative: sa kanyang kagandahang-loob ay may buhay
  rationale: Hindi tahasang nilulutas ng salin ang elipsis bilang “panghabambuhay ang kanyang pabor.” Sa halip, pinananatili nito ang buhay bilang bunga o saklaw ng pabor, alinsunod sa malawak na gamit ng pang-ukol na בְּ.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang maikling paralelismo at personipikasyon ng tulang Hebreo. Ang pinaikling huling linya na “kagalakan” ay sadyang makata at tumutugma sa kawalan ng tahasang pandiwa sa Hebreo.
