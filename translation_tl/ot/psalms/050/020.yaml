  text: You sit and speak against your brother[a]; you slander your own mother's son.
translation:
  language: tl
  text: Nakaupo ka at nagsasalita laban sa iyong kapatid; sinisiraan mo ang anak ng sarili mong ina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nilalait mo ang anak ng sarili mong ina.” Literal sa Hebreo, “nagbibigay ka ng דֹּפִי,” isang idyomang nangangahulugang maglagay ng kahihiyan, sisi, o mapanirang paratang sa isang tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Nauupo ka
  rationale: Pinananatili ang konkretong larawan ng Hebreong pandiwang ישׁב (“umupo/manatili”) at ang mapanumbat na puwersa nito, sa halip na gawing simpleng pang-abay.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: nagsasalita laban sa iyong kapatid
  rationale: Sa kontekstong ito, ang ב kasabay ng דבר ay may diwang salungat o mapanirang pagsasalita; likas sa modernong Tagalog ang “magsalita laban sa.”
- source_word: בְּבֶן אִמְּךָ
  choice: ang anak ng sarili mong ina
  rationale: Malapit ito sa anyo ng Hebreo at itinatampok ang napakalapit na ugnayang pampamilya, nang hindi basta pinapalitan ng pangkalahatang “kamag-anak.”
- source_word: תִּתֶּן דֹּפִי
  choice: sinisiraan mo
  rationale: Ang literal na “nagbibigay ka ng דֹּפִי” ay isang idyomang tumutukoy sa paglalagay ng kahihiyan, paratang, o mapanirang pananalita sa iba. Ang “sinisiraan” ay natural at malinaw sa kasalukuyang Tagalog.
