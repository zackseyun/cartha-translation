translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang paralelismo at matinding pagbanggit sa kapatid sa ina; ginamit ang “sinisiraan” upang natural na maipahayag ang Hebreong idyoma.
