  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: tl
  text: 'Ngunit sinasabi ng Diyos sa masama,


    “Anong karapatan mong bigkasin ang aking mga tuntunin


    at sambitin ang aking tipan?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: Ngunit sa masama
  rationale: Ipinahihiwatig ng וְ ang pagsalungat sa naunang pananalita, at ang רָשָׁע ay tumutukoy sa taong masama bilang moral na uri, hindi lamang sa isang napatunayang nagkasala.
- source_word: אָמַר אֱלֹהִים
  choice: ay sinasabi ng Diyos
  rationale: Bagaman perfect ang anyong Hebreo, gumaganap ito bilang matingkad na pambungad sa tuwirang pananalita; natural sa Filipino ang pangkasalukuyang “sinasabi.”
- source_word: מַה לְּךָ
  choice: Ano ang karapatan mong
  rationale: Ang idyoma ay isang hamon sa karapatan o nararapat na katayuan ng kausap, hindi simpleng tanong kung ano ang kaugnayan niya rito.
- source_word: לְסַפֵּר חֻקָּי
  choice: bigkasin ang aking mga tuntunin
  rationale: Ang סָפַר ay tumutukoy rito sa pagbigkas o pagsasalaysay, samantalang ang חֻקִּים ay mga itinakdang kautusan; malinaw at likas sa modernong Filipino ang “mga tuntunin.”
- source_word: וַתִּשָּׂא בְרִיתִי
  choice: at banggitin ang aking tipan
  rationale: Literal na “dalhin/itaas ang aking tipan,” ngunit sa konteksto ng bibig ay nangangahulugang ilagay ito sa pananalita. Pinananatili ng “banggitin” ang diwa nang hindi maging alanganin sa Filipino.
- source_word: עֲלֵי פִיךָ
  choice: '[nakapaloob sa] banggitin ... [sa iyong bibig]'
  rationale: Literal itong “sa ibabaw ng iyong bibig.” Isinama sa pandiwang “banggitin” ang idiomatikong kahulugan sa pangunahing teksto, at inilalahad sa talababa ang kongkretong larawan.
theological_decisions:
- issue: Likas ng pagsaway sa masama
  choice: Hinahamon ang moral na karapatan ng masama na bumigkas ng mga tuntunin at tipan ng Diyos habang namumuhay nang salungat dito.
  alternative: Ganap na pagbabawal sa masama na banggitin ang tipan ng Diyos sa anumang kalagayan.
  rationale: Ang מַה לְּךָ ay humahamon sa katayuan at pagiging nararapat ng kausap. Sa konteksto, ang diin ay pagkukunwari at pagsuway sa tipan, hindi isang pangkalahatang pagbabawal sa lahat ng pagbanggit sa Diyos.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tipan” para sa sentral na terminong pangkasunduan sa Kasulatan, at “mga tuntunin” bilang malinaw na katumbas ng mga itinakdang kautusan. Ang taludtod ay inayos bilang patula at tuwirang pagsaway.
