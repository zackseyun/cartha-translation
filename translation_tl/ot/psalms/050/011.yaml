  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: tl
  text: Kilala ko ang bawat ibon sa mga bundok, at ang mga nilalang sa kaparangan[a] ay kasama ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga gumagalaw sa kaparangan” o “ang mababangis na hayop sa kaparangan.” Mahirap tiyakin ang eksaktong kahulugan ng salitang Hebreo na זִיז.
    reason: lexical_alternative
  - marker: b
    text: O “ay akin.” Mas literal na sinasabi ng Hebreo, “ay kasama ko.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Kilala ko
  rationale: Ang Qal perfect na may estadong kahulugan ay likas na maisasalin sa kasalukuyan. Ang “Kilala ko” ay malinaw na nagpapahayag ng ganap at patuloy na pagkakilala ng Diyos sa mga nilalang.
- source_word: כָּל עוֹף
  choice: bawat ibon
  rationale: Ang “bawat” ay maayos na naghahayag ng distributibong puwersa ng כָּל kasama ng kolektibong pangngalang עוֹף, at ang “ibon” ang pinakanatural na katumbas sa konteksto.
- source_word: הָרִים
  choice: sa mga bundok
  rationale: Pinananatili ng “mga bundok” ang maramihang anyo at ang larawan ng mataas at mailap na lupain.
- source_word: זִיז
  choice: mga nilalang
  rationale: Mahirap at hindi tiyak ang eksaktong saklaw ng זִיז. Sapat na malawak ang “mga nilalang” upang hindi tukuyin nang labis kung gumagalaw na mga bagay, hayop, o mababangis na hayop ang tinutukoy.
- source_word: שָׂדַי
  choice: sa kaparangan
  rationale: Ang “kaparangan” ay natural na tumutukoy sa bukás na lupain at mas angkop sa mga mailap na nilalang kaysa sa posibleng agrikultural na dating ng “bukid.”
- source_word: עִמָּדִי
  choice: ay kasama ko
  rationale: Ito ang tuwirang katumbas ng “with me.” Pinananatili nito ang pahayag ng Hebreo nang hindi tahasang ginagawang “akin,” bagaman maaaring ipinahihiwatig ng konteksto ang pagmamay-ari.
theological_decisions:
- issue: Pahiwatig ng pagmamay-ari ng Diyos sa עִמָּדִי
  choice: ay kasama ko
  alternative: ay akin
  rationale: Bagaman maaaring magpahiwatig ng pagmamay-ari o pagiging nasa kapangyarihan ng Diyos ang parirala, literal na “kasama ko” ang sinasabi ng Hebreo. Pinananatili ng salin ang tunay na pananalita at hindi ginagawang tahasan ang ipinahihiwatig lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kaparangan” upang ihatid ang bukás at mailap na tagpuan, at pinanatili ang “kasama ko” upang huwag lampasan ang sinasabi ng Hebreo.
