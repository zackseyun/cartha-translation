  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: tl
  text: 'Tipunin ninyo para sa akin ang aking mga tapat,

    yaong mga nakipagtipan sa akin sa pamamagitan ng hain.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “yaong mga pumuputol ng aking tipan sa ibabaw ng hain.” Ang “pagputol ng tipan” ay idyoma para sa paggawa ng tipan; ang pariralang “sa ibabaw ng hain” ay maaaring tumukoy sa pagkakaugnay ng hain sa ritwal ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: Tipunin ninyo
  rationale: Pinananatili ang pautos na anyong maramihan ng Qal imperative at natural itong pakinggan sa makabagong Filipino.
- source_word: לִי
  choice: sa harap ko
  rationale: Sa konteksto ng banal na pagtitipon at paghatol, malinaw nitong ipinahihiwatig ang paglapit at pagharap sa Diyos; maaari ring literal na unawain bilang “sa akin” o “para sa akin.”
- source_word: חֲסִידָי
  choice: ang mga tapat sa akin
  rationale: Ipinahahayag nito ang katapatan at debosyon sa loob ng ugnayang tipan, nang hindi ipinapasok ang mas huling teknikal na kahulugan ng “mga santo.”
- source_word: כֹּרְתֵי בְרִיתִי
  choice: ang mga nakikipagtipan sa akin
  rationale: Ang Hebreong idyoma ay literal na “mga pumuputol ng aking tipan.” Ang “nakikipagtipan sa akin” ay natural sa Filipino at pinananatili ang ugnayang tinutukoy ng unang panauhang hulapi, bagaman maaari ring isalin na “gumagawa ng aking tipan.”
- source_word: עֲלֵי זָבַח
  choice: sa pamamagitan ng hain
  rationale: Ipinakikita ang ritwal o instrumental na kaugnayan ng hain sa pakikipagtipan, habang iniiwasan ang malabo at di-natural na literal na “sa ibabaw ng hain.”
theological_decisions:
- issue: Kahulugan ng חֲסִידָי sa konteksto ng tipan
  choice: ang mga tapat sa akin
  alternative: ang aking mga banal; ang mga maka-Diyos sa akin
  rationale: Itinatampok ng parirala ang katapatan sa Diyos sa loob ng tipan at iniiwasan ang posibleng pagpasok ng mas huling eklesiastikal na kahulugan ng “mga santo.”
- issue: Ang idyoma ng “pagputol” ng tipan
  choice: ang mga nakikipagtipan sa akin sa pamamagitan ng hain
  alternative: ang mga pumuputol ng aking tipan sa ibabaw ng hain
  rationale: Ginagawang malinaw at natural ang idyoma sa pangunahing teksto, habang pinananatili sa talababa ang literal na larawan at ang saklaw ng pang-ukol.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hain” at “tipan” bilang malinaw at kinikilalang bokabularyong biblikal; iniwasan ang arkaikong “mga banal” bilang salin ng חֲסִידָי.
