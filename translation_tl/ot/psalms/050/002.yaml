  text: Mula sa Zion[a]—ang kasukdulan ng kagandahan—nagniningning ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Mula sa Zion—ang kasukdulan ng kagandahan—nagningning ang Diyos,” o “Mula sa Zion, sa ganap na kagandahan, nagniningning ang Diyos.”'
    reason: Maaaring ipahiwatig ng anyong Hebreo ang naganap na aspekto ng pandiwa. Posible ring iugnay ang pariralang “kasukdulan ng kagandahan” sa paraan ng pagpapakita ng Diyos sa halip na bilang paglalarawan sa Zion.
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: Mula sa Zion
  rationale: Ipinahahayag ng pang-ukol na מִן ang pinagmulan; natural at malinaw sa modernong Filipino ang “mula sa Zion.”
- source_word: מִכְלַל
  choice: ang kaganapan ng
  rationale: Sa pagkakaugnay nito sa יֹפִי, tumutukoy ito sa kabuuan o ganap na kapahayagan ng isang katangian; pinananatili ng “kaganapan ng” ang matayog na diwang patula.
- source_word: יֹפִי
  choice: kagandahan
  rationale: Tuwirang ipinahahayag nito ang ganda o kariktan nang hindi inililipat ang diin sa ningning lamang.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Isahan ang diwa rito dahil isahan ang pandiwang הוֹפִיעַ.
- source_word: הוֹפִיעַ
  choice: nagniningning
  rationale: Inihahatid nito ang larawan ng Diyos na lumilitaw nang maningning. Ang pangkasalukuyang anyo ay angkop sa masiglang paglalarawang patula, bagaman maaaring unawain ang Hebreo bilang naganap na pagkilos.
theological_decisions:
- issue: Ang kaugnayan ng “kaganapan ng kagandahan” sa Zion o sa Diyos
  choice: 'Ituring itong pariralang panuring sa Zion: “Mula sa Zion, ang kaganapan ng kagandahan, nagniningning ang Diyos.”'
  alternative: 'Maaaring iugnay ito sa paraan ng pagpapakita ng Diyos: “Mula sa Zion, sa ganap na kagandahan, nagniningning ang Diyos.”'
  rationale: Pinakanatural sa ayos ng Hebreo na ang מִכְלַל־יֹפִי ay tumutukoy bilang panuring sa Zion, ngunit tunay na posible ang alternatibong ugnayan kaya itinala ito sa talababa.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Pinanatili ang pangalang “Zion” at ang maikli ngunit matayog na estruktura ng Hebreo; ipinaliliwanag sa talababa ang tunay na aspektuwal at sintaktikong kalabuan.
