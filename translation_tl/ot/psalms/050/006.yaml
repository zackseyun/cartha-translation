  text: וַ/יַּגִּ֣ידוּ שָׁמַ֣יִם צִדְק֑/וֹ כִּֽי אֱלֹהִ֓ים שֹׁפֵ֖ט ה֣וּא סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/006.yaml
  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: tl
  text: Ipinahahayag ng kalangitan ang kanyang katuwiran[a], sapagkat ang Diyos mismo ang hukom. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: Ipinahahayag
  rationale: Ang Hiphil ng נגד ay tumutukoy sa hayagang pagpapakilala o pagpapahayag; natural sa makabagong Filipino ang “ipinahayag” habang pinananatili ang pampublikong diwa.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Ang kolektibong anyo ay angkop na isalin bilang “kalangitan,” na natural at marangal sa panulaang Filipino.
- source_word: צִדְקוֹ
  choice: ang kanyang katuwiran
  rationale: Saklaw ng צדק ang moral na katuwiran at makatarungang paghatol. Pinananatili ng “katuwiran” ang mas malawak na diwa; inilalagay sa talababa ang “katarungan” bilang tunay na alternatibo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpapahayag ng kalangitan; malinaw at marangal na panumbas ang “sapagkat.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maramihan ang anyo sa morpolohiya, malinaw na isahan ang kahulugan ayon sa sintaks.
- source_word: שֹׁפֵט
  choice: ang hukom
  rationale: Pinananatili nito ang nominal na lakas ng participle sa kontekstong panghukuman, sa halip na gawing pandiwang “humahatol.”
- source_word: הוּא
  choice: mismo
  rationale: Ipinahihiwatig ng hiwalay na panghalip ang diin; natural itong naipapahayag sa Filipino sa pamamagitan ng “mismo.”
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong tungkulin ng terminong liturhikal, kaya higit na tapat na panatilihin ito sa transliterasyon.
theological_decisions:
- issue: Ang kahulugan ng צדק kaugnay ng paghatol ng Diyos
  choice: kanyang katuwiran
  alternative: kanyang katarungan
  rationale: Hindi nililimitahan ng “katuwiran” ang salita sa aspektong panghukuman lamang, ngunit nananatiling posible sa konteksto ang “katarungan”; kaya pinanatili ang alternatibo sa talababa.
- issue: Ang diin sa Diyos bilang hukom
  choice: ang Diyos mismo ang hukom
  alternative: ang Diyos ang humahatol
  rationale: Pinananatili ng napiling salin kapwa ang nominal na pahayag ng שֹׁפֵט at ang diin ng הוּא, nang hindi nagpapasok ng karagdagang pagtukoy gaya ng “tanging hukom.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa panulaang biblikal. Ginamit ang “kalangitan” at “sapagkat” upang mapanatili ang mataas ngunit madaling maunawaang rehistro; hindi isinalin ang “Selah” dahil hindi tiyak ang kahulugan nito.
