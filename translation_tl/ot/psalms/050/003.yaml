  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: tl
  text: Dumarating ang ating Diyos at hindi nananahimik[a]; may apoy na tumutupok sa harap niya, at sa palibot niya ay bumabagyo nang matindi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Darating ang ating Diyos at hindi mananahimik.” Sa kontekstong patula, ang mga pandiwang Hebreo ay maaaring magkaroon ng diwang hinaharap.'
    reason: alternative_reading
  - marker: b
    text: 'O: “at isang bagyo ang nagngangalit sa palibot niya,” o “at lubhang mabagyo sa palibot niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: Dumarating
  rationale: Ang Qal imperfect ay maaaring magkaroon ng kasalukuyan o hinaharap na diwa sa tulang Hebreo. Pinananatili ng kasalukuyang anyo ang masiglang paglalarawan ng pagdating ng Diyos; inilalahad sa talababa ang posibleng hinaharap.
- source_word: אֱלֹהֵינוּ
  choice: ang ating Diyos
  rationale: Tuwirang salin ng pangngalang may panlaping unang panauhang maramihan; natural at marangal sa modernong Tagalog.
- source_word: וְאַל יֶחֱרַשׁ
  choice: at hindi nananatiling tahimik
  rationale: Ipinapahayag sa kontekstong patula na hindi tahimik ang Diyos sa kaniyang pagdating. Ang “nananatiling tahimik” ay nagpapanatili sa diwa ng חרשׁ nang hindi nilulutas nang labis ang anyong maaaring basahing jussive.
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: sa harap niya ay may apoy na tumutupok
  rationale: Pinananatili ang puwestong larawan ng apoy sa unahan ng Diyos at ang masidhing kilos ng אכל bilang “tumutupok.”
- source_word: וּסְבִיבָיו
  choice: at sa palibot niya
  rationale: Tuwirang salin na malinaw at natural sa Tagalog.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: nagngangalit ang napakalakas na bagyo
  rationale: Ang Nifal ng שער ay naglalarawan ng matinding pagbagyo o pag-ikot ng unos, at pinatitingkad ito ng מְאֹד. Ginagawang tahasang simuno ang “bagyo” para sa natural na Tagalog, habang itinatala sa talababa ang mas pormal na pandiwang pagbasa.
theological_decisions:
- issue: Ang talata ay naglalarawan ng teopaniya ng Diyos sa konteksto ng paghatol nang hindi tahasang nagbibigay ng kristolohikal o denominasyonal na balangkas.
  choice: Panatilihin itong tuwirang paglalarawan sa pagdating ng Diyos, na may apoy at bagyo.
  alternative: Basahin ito bilang tahasang tipolohiya ng pangwakas na paghuhukom.
  rationale: Ang Hebreong teksto mismo ay nagsasaad ng pagdating ng Diyos at ng kasamang apoy at bagyo. Hindi dapat idagdag sa salin ang mga doktrinang hindi tahasang binabanggit rito.
- issue: Ang aspektong patula ng יָבֹא at יֶחֱרַשׁ ay maaaring unawaing kasalukuyan o hinaharap.
  choice: Gamitin sa pangunahing teksto ang masiglang kasalukuyang paglalarawan.
  alternative: “Darating ang ating Diyos at hindi mananahimik.”
  rationale: Kapuwa posible sa Hebreo. Pinananatili ng pangunahing salin ang agarang bisa ng eksena, at pinangangalagaan ng talababa ang tunay na temporal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Dumarating” upang mapanatili ang buhay na paglalarawang patula, “tumutupok” para sa matinding larawan ng apoy, at “nagngangalit ang napakalakas na bagyo” para sa natural na pagpapahayag ng impersonal na pandiwang Hebreo. Lumilitaw sa pangunahing teksto ang lahat ng marker na [a] at [b].
