  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: tl
  text: Tumawag ka sa akin sa araw ng kagipitan; ililigtas kita, at pararangalan mo ako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luluwalhatiin mo ako.” Ang pandiwang Hebreo ay maaaring mangahulugang “parangalan” o “luwalhatiin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: Tumawag ka sa akin
  rationale: Ang קרא na may hulaping tuwirang layon ay nangangahulugang tumawag sa Diyos upang humingi ng tulong. Likas at malinaw sa modernong Tagalog ang “tumawag ka sa akin.”
- source_word: בְּיוֹם צָרָה
  choice: sa araw ng kagipitan
  rationale: Pinananatili ng “sa araw ng” ang Hebreong anyong patula, samantalang ipinahahayag ng “kagipitan” ang matinding kalagayan ng hirap o panganib na saklaw ng צָרָה.
- source_word: אֲחַלֶּצְךָ
  choice: ililigtas kita
  rationale: Ang Piel ng חלץ dito ay tumutukoy sa pagliligtas o pagsagip mula sa panganib. Karaniwan, tuwiran, at marangal ang “ililigtas kita.”
- source_word: וּתְכַבְּדֵנִי
  choice: at pararangalan mo ako
  rationale: Ang Piel ng כבד ay maaaring mangahulugang parangalan o luwalhatiin. Ang “pararangalan” ang mas malawak at likas na katumbas sa kontekstong ito, nang hindi nililimitahan ang tugon sa isang tiyak na gawaing liturhiko.
theological_decisions:
- issue: Tugon ng tao matapos ang pagliligtas ng Diyos
  choice: at pararangalan mo ako
  alternative: at luluwalhatiin mo ako
  rationale: Inilalarawan ng Hebreo ang pagbibigay ng nararapat na karangalan sa Diyos bilang tugon ng taong iniligtas. Pinananatili ng “pararangalan” ang malawak na diwa, habang kinikilala sa talababa na maaari ring isalin ang pandiwa bilang “luluwalhatiin.”
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikli at patulang ayos ng Hebreo at ang direktang pagkakasunod ng utos, pangako, at tugon.
