base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: tl
  text: Maghandog ka sa Diyos ng haing pasasalamat[a], at tuparin mo sa Kataas-taasan ang iyong mga panata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghandog ka ng pasasalamat sa Diyos.” Ang Hebreong תּוֹדָה (todah) ay maaaring mangahulugang “pasasalamat” o, sa kontekstong ito ng paghahain, “handog bilang pasasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: Maghandog ka
  rationale: Ang pautos na pandiwa ay tumutukoy sa paghahandog ng hain. Likas sa modernong Tagalog ang “maghandog” at napananatili nito ang kontekstong pansamba.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Ang ל ay nagmamarka sa Diyos bilang tatanggap ng handog; “sa Diyos” ang natural na katumbas sa Tagalog.
- source_word: תּוֹדָה
  choice: handog ng pasasalamat
  rationale: Maaaring mangahulugan ang תּוֹדָה ng pasasalamat o ng isang handog bilang pasasalamat. Pinananatili ng pariralang ito ang kapuwa sakripisyal at mapagpasalamat na diwa nang hindi labis na nililimitahan sa isang teknikal na uri ng ritwal.
- source_word: וְשַׁלֵּם
  choice: at tuparin mo
  rationale: Sa kaugnayan ng mga panata, ang שלם ay nangangahulugang bayaran o ganapin ang ipinangako. Ang “tuparin” ang pinakanatural at malinaw na salin sa Tagalog.
- source_word: לְעֶלְיוֹן
  choice: sa Kataas-taasan
  rationale: Ang עֶלְיוֹן ay titulong banal na nangangahulugang “Kataas-taasan.” Isinalin ang titulo sa halip na baybayin bilang Elyon.
- source_word: נְדָרֶיךָ
  choice: ang iyong mga panata
  rationale: Pinananatili nito ang maramihang anyo at ang ikalawang panauhang panlalaking isahan ng Hebreo; hindi kailangang ipakita ang kasarian sa natural na Tagalog.
theological_decisions:
- issue: Ang pagsasama ng זבח at תודה sa kontekstong pansakripisyo
  choice: “handog ng pasasalamat”
  alternative: “pasasalamat bilang handog” o “handog na pasasalamat”
  rationale: Hinahayaan ng salin na manatili ang posibilidad na tumukoy ito kapuwa sa pasasalamat na inihahandog at sa handog bilang pasasalamat. Ipinaliliwanag sa talababa ang tunay na leksikal na kalabuan.
- issue: Ang banal na titulong עֶלְיוֹן
  choice: “Kataas-taasan”
  alternative: “Elyon”
  rationale: Isinasalin ang kahulugan ng titulo upang agad itong maunawaan ng karaniwang mambabasa, nang walang pag-aangkat ng partikular na doktrinal na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang isahang pautos na “Maghandog ka” at “tuparin mo” upang mapanatili ang tuwirang panawagan ng tekstong Hebreo. Ang “panata” ay pormal ngunit karaniwang salitang angkop sa kontekstong panrelihiyon.
