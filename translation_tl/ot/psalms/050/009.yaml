  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: tl
  text: 'Hindi ako kukuha ng toro mula sa iyong bahay,

    ni ng mga lalaking kambing[a] mula sa iyong mga kulungan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga barakong kambing.” Partikular na tumutukoy ang Hebreo sa mga kambing na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֶקַּח
  choice: Hindi ako kukuha
  rationale: Ang Qal imperfect na unang panauhang isahan, na pinawawalang-bisa ng לֹא, ay likas na ipinahahayag sa Filipino bilang isang tiyak na pagtanggi sa gagawing kilos.
- source_word: מִבֵּיתְךָ
  choice: mula sa iyong bahay
  rationale: Pinananatili nito ang konkretong larawan ng bahay o pag-aari ng sumasamba, sa halip na ipakahulugang mga kasambahay.
- source_word: פָר
  choice: toro
  rationale: Tumutukoy ang salita sa lalaking baka, lalo na sa hayop na maaaring ihandog; “toro” ang tuwiran at karaniwang katumbas.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: mula sa iyong mga kulungan
  rationale: Ang מִכְלָאָה ay bakod o kulungan ng mga hayop. Malinaw at likas sa modernong Filipino ang “mga kulungan” sa kontekstong ito.
- source_word: עַתּוּדִים
  choice: mga lalaking kambing
  rationale: Partikular na tumutukoy ang pangmaramihang salita sa mga kambing na lalaki; tahasang pinananatili ng salin ang kasarian ng hayop.
