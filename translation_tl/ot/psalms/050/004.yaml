  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: tl
  text: 'Tumatawag siya sa langit sa itaas at sa lupa[a], upang hatulan ang kanyang bayan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tinatawag niya ang langit sa itaas at ang lupa.” Maaaring mangahulugan ang pandiwa ng pagpapatawag, lalo na sa isang tagpong panghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: Tumatawag siya
  rationale: Ang Qal imperfect na קרא ay maaaring mangahulugang “tumawag” o “ipatawag.” Pinananatili ng “tumatawag” ang karaniwang diwa at ang kasalukuyang sigla ng patulang tagpo nang hindi labis na itinatakda na isang pormal na pagpapatawag ang tinutukoy.
- source_word: אֶל
  choice: sa
  rationale: Likas na panandang Filipino para sa pinatutungkulan ng pagtawag.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Sa kaagapay nitong “lupa,” tumutukoy ito sa malawak na kosmikong saklaw; ang “langit” ang natural at marangal na katumbas sa modernong Tagalog.
- source_word: מֵעָל
  choice: sa itaas
  rationale: Gumaganap itong pang-abay na naglalarawan sa langit; hindi nito kailangang ipahiwatig ang paggalaw mula sa itaas.
- source_word: וְאֶל
  choice: at sa
  rationale: Tuwirang nag-uugnay sa ikalawang kosmikong pinatutungkulan.
- source_word: הָאָרֶץ
  choice: lupa
  rationale: Dahil katambal ng “langit,” ang tinutukoy ay ang daigdig o lupa sa kosmikong diwa, hindi lamang isang lupain.
- source_word: לָדִין
  choice: upang hatulan
  rationale: Ang ל na kasama ng infinitive construct ay nagpapahayag ng layunin; malinaw at natural itong naihahayag ng “upang hatulan.”
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Pinananatili ng “kanyang bayan” ang panlipunan at tipanang ugnayan ng עם nang hindi ito ginagawang makabagong politikal na “bansa.”
theological_decisions:
- issue: Pagkakakilanlan ng di-hayag na simuno
  choice: Pinanatili ang panghalip na “siya,” na sa konteksto ay tumutukoy sa Diyos.
  alternative: Tahasang ilagay ang “Diyos” bilang simuno.
  rationale: Ikatlong panauhang panlalaki na isahan ang pandiwa, ngunit walang tahasang simuno sa talatang ito. Ang “siya” ay mas malapit sa daloy ng Hebreo at umiiwas sa pagdaragdag ng pangngalang wala mismo sa bersikulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang patulang tambalan ng langit at lupa, pati ang ambiguwidad kung karaniwang pagtawag o panghukumang pagpapatawag ang diin ng pandiwa.
