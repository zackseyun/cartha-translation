  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: tl
  text: Kumakain ba ako ng laman ng mga toro, o umiinom ng dugo ng mga kambing[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga lalaking kambing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאוֹכַל
  choice: Kumakain ba ako
  rationale: Ang pantanong na הֲ kasama ng unang panauhang anyong di-ganap ng אכל ay bumubuo ng retorikal na tanong. Likas sa modernong Tagalog ang hulma na pandiwa + ba + ako.
- source_word: בְּשַׂר
  choice: laman ng
  rationale: Ang בשר ay konkretong tumutukoy sa laman. Pinananatili ng “laman” ang larawan ng hayop na inihahandog at mas tuwiran ito kaysa sa “karne” sa marangal na kontekstong ito.
- source_word: אַבִּירִים
  choice: mga toro
  rationale: Bagaman maaari itong mangahulugang “malalakas” o “makapangyarihan,” ipinakikita ng konteksto ng paghahandog, laman, dugo, at mga kambing na malalakas na bakang lalaki ang tinutukoy. Ang “mga toro” ang malinaw at likas na katumbas.
- source_word: וְדַם
  choice: o ... ng dugo
  rationale: Karaniwang “at” ang וְ, ngunit pinag-uugnay rito ang dalawang magkatambal na bahagi ng iisang retorikal na tanong. Mas likas sa Tagalog ang “o” nang hindi binabago ang diwa ng paralelismo.
- source_word: עַתּוּדִים
  choice: mga kambing[a]
  rationale: Partikular na tumutukoy ang salita sa mga lalaking kambing. Ginamit sa pangunahing teksto ang natural na “mga kambing,” habang inilagay sa talababa ang espesipikong kasarian.
- source_word: אֶשְׁתֶּה
  choice: umiinom
  rationale: Ang unang panauhang anyong di-ganap ng שתה ay nagpapatuloy sa retorikal na tanong. Ang aspektong “umiinom” ay likas na kaagapay ng “kumakain” sa Tagalog.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pagkain at pag-inom ng Diyos mula sa mga handog
  choice: Tuwirang pinanatili ang konkretong retorikal na tanong
  alternative: Ipaliwanag bilang “Kailangan ko ba ang inyong mga handog?”
  rationale: Itinatanggi ng talata na umaasa ang Diyos sa mga handog bilang pagkain o inumin. Pinananatili ng salin ang matinding larawan at teolohikal na tensiyon ng Hebreo sa halip na palitan ito ng abstraktong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang natural na hulma ng retorikal na tanong at pinanatili ang konkretong wikang panghandog. Inilipat ang talababa sa “mga kambing,” ang salitang talagang nililinaw nito sa tekstong Hebreo.
