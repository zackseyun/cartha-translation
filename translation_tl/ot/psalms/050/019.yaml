lexical_decisions:
- source_word: פִּיךָ
  choice: ang iyong bibig
  rationale: Pinananatili ang konkretong larawang Hebreo at ang pagtutulad nito sa “iyong dila”; tumutukoy ito sa pananalita.
- source_word: שָׁלַחְתָּ
  choice: pinakawalan mo
  rationale: Ipinahahayag ang diwang literal na pagpapalabas o pagpapakawala, na sa kontekstong ito ay malayang paggamit ng bibig sa masama.
- source_word: בְרָעָה
  choice: sa kasamaan
  rationale: Pinananatili ang malawak na moral na diwa ng רָעָה at ang maaaring kahulugang direksiyon o larangan ng pagkilos.
- source_word: וּלְשׁוֹנְךָ
  choice: at ang iyong dila
  rationale: Literal na salin na nagpapanatili sa paralelismo ng tula sa “iyong bibig.”
- source_word: תַּצְמִיד
  choice: ikinakabit mo
  rationale: Ang Hiphil ng צמד ay nagsasaad ng pagpapadikit, pag-uugnay, o pagtatambal; ipinakikita rito na aktibong iniuugnay ng tao ang kanyang dila sa panlilinlang.
- source_word: מִרְמָה
  choice: panlilinlang
  rationale: Likas at malawak na katumbas sa modernong Filipino para sa mapanlinlang na pananalita o pandaraya.
