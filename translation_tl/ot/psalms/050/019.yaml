translation:
  language: tl
  text: Hinayaan mong magsalita ng kasamaan ang iyong bibig[a], at ikinakabit mo ang iyong dila sa panlilinlang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binibigyan mo ng malayang daan ang iyong bibig para sa kasamaan.”
    reason: lexical_alternative
