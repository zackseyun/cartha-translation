translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mga larawang “bibig” at “dila,” pati ang bahagyang di-karaniwang larawan ng pagkakabit sa panlilinlang, upang hindi mapawi ang talinghaga at tunay na saklaw ng Hebreo.
