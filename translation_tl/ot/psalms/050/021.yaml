base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: tl
  text: Ginawa mo ang mga bagay na ito, at nanatili akong tahimik. Inakala mong ako ay katulad mo.[a] Sasawayin kita at ilalatag ko sa harap ng iyong mga mata ang usapin laban sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ako ay magiging katulad mo.” Pinahihintulutan ng anyong Hebreo ang bahagyang magkaibang pagpapahayag ng maling palagay.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “at ilalatag ko ito sa harap ng iyong mga mata.” Ang pandiwang Hebreo ay maaaring mangahulugang “ayusin” o “ilatag,” at ipinahihiwatig lamang ang layon nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Ginawa mo ang mga bagay na ito
  rationale: Tumutukoy ang pangmaramihang demonstratibo sa mga kasalanang kababanggit lamang; malinaw at natural sa modernong Tagalog ang “mga bagay na ito.”
- source_word: וְהֶחֱרַשְׁתִּי
  choice: at nanatili akong tahimik
  rationale: Ipinahihiwatig ng pandiwa ang pananahimik sa loob ng isang panahon, hindi lamang ang panandaliang hindi pagsasalita.
- source_word: דִּמִּיתָ
  choice: Inakala mo
  rationale: Ipinapahayag ng pandiwa rito ang maling palagay o pag-aakala.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: ako ay talagang katulad mo
  rationale: Ipinananatili ng “talagang” ang mariing anyo ng Hebreo, samantalang ang talababa ay nagtatala ng posibleng temporal na pagbasa.
- source_word: אוֹכִיחֲךָ
  choice: sasawayin kita
  rationale: Ang “sasawayin” ay natural ngunit mabigat na katumbas sa kontekstong moral at panghukuman, nang hindi labis na nililimitahan ang kahulugan sa pormal na paghatol.
- source_word: וְאֶעֶרְכָה
  choice: ilalatag ko … ang usapin laban sa iyo
  rationale: Literal na nangangahulugang mag-ayos o maglatag ang pandiwa. Walang tahasang layon sa Hebreo; ginagawang malinaw ng salin ang ipinahihiwatig na paratang o usaping inilalahad.
- source_word: לְעֵינֶיךָ
  choice: sa harap ng iyong mga mata
  rationale: Pinananatili ang matingkad na idyomang Hebreo na nagsasaad ng hayagan at di-maikakailang paghaharap.
theological_decisions:
- issue: Ang pananahimik ng Diyos at ang kasunod na pagsaway
  choice: Inilalarawan ang pananahimik bilang pansamantalang pagpipigil na sinusundan ng pagsaway at paglalahad ng usapin.
  alternative: Maaaring mas neutral na isalin ang huling parirala bilang “at aayusin ko ito sa harap ng iyong mga mata.”
  rationale: Ipinakikita ng konteksto ang isang moral at panghukumang sakdal. Gayunman, hindi sinasabing pagsang-ayon ang pananahimik, at pinananatili sa talababa ang mas literal na posibilidad para sa pandiwang “mag-ayos/maglatag.”
- issue: Ang maling palagay na katulad ng tao ang Diyos
  choice: “ako ay talagang katulad mo”
  alternative: “ako ay magiging katulad mo”
  rationale: Maaaring ipahayag ng Hebreong konstruksyon ang mariing pagkakatulad o isang inaakalang kalagayan sa hinaharap. Pinili sa teksto ang natural na mariing pagbasa at itinabi sa talababa ang temporal na alternatibo, nang hindi nilulutas nang sapilitan ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nanatili akong tahimik” para sa patuloy na pananahimik at ang “ilalatag … ang usapin laban sa iyo” upang maging natural ang pahayag habang minamarkahan sa talababa na ipinahihiwatig lamang sa Hebreo ang layon.
