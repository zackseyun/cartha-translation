  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: tl
  text: Sapagkat kinamumuhian mo ang pagtutuwid[a][b], at itinatapon mo sa likuran mo ang aking mga salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit kinamumuhian mo ang pagtutuwid.” Ang pang-ugnay ay maaaring magpahayag ng pagsalungat o magbigay ng paliwanag.'
    reason: lexical_alternative
  - marker: b
    text: Ang “pagtutuwid” ay maaari ring isaling “pagtuturo,” “disiplina,” o “pagsaway.” Saklaw ng Hebreong musar ang nagtutuwid at humuhubog na pagtuturo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Sapagkat … mo
  rationale: Ang וְ ay maaaring magpatuloy, magpaliwanag, o magpakita ng pagsalungat. Sa konteksto, natural na ipinakikilala ng “Sapagkat” ang dahilan ng pagsaway sa naunang talata; naipahihiwatig naman ng pandiwang may “mo” ang tahasang panghalip na אַתָּה.
- source_word: שָׂנֵאתָ
  choice: kinamumuhian mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay naglalarawan dito ng palagian o kinaugaliang saloobin, kaya ang pangkasalukuyang “kinamumuhian mo” ay angkop sa paratang.
- source_word: מוּסָר
  choice: pagtutuwid
  rationale: Saklaw ng מוּסָר ang pagtuturo, pagsaway, at disiplinang naglalayong humubog. Pinananatili ng “pagtutuwid” ang mapagwastong diwa nang hindi ito nililimitahan sa pagpaparusa.
- source_word: וַתַּשְׁלֵךְ
  choice: at itinatapon mo
  rationale: Pinananatili ng “itinatapon” ang malinaw at kongkretong larawan ng שלך at ipinahahayag ang patuloy o kinaugaliang pagkilos sa paratang.
- source_word: דְּבָרַי
  choice: ang aking mga salita
  rationale: Tuwirang katumbas ito ng pangmaramihang pangngalang may hulaping unang panauhan; hindi ito dinaragdagan ng interpretasyong gaya ng “mga utos” o “mga turo.”
- source_word: אַחֲרֶיךָ
  choice: sa likuran mo
  rationale: Pinananatili nito ang literal na larawang itinapon ang mga salita sa likuran bilang tanda ng pagtanggi o pagwawalang-bahala.
