  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
translation:
  language: tl
  text: Kapag nakakakita ka ng magnanakaw, nalulugod ka sa kaniya[a]; at ang bahagi mo ay kasama ng mga mangangalunya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinasang-ayunan mo siya” o “tinatanggap mo siya.” Ang pandiwang Hebreo ay maaaring magpahayag ng pagkalugod, pagsang-ayon, o pagtanggap.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahagi mo ay kasama ng mga mangangalunya” ay isang idyoma ng pakikiisa o pakikibahagi sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kapag
  rationale: Bagaman maaaring mangahulugang “kung,” inilalahad dito ng אִם ang paulit-ulit o kinikilalang asal sa isang retorikal na paratang; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kapag.”
- source_word: רָאִיתָ
  choice: nakakita ka
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay tuwirang isinalin bilang naganap na pagkakita, na angkop sa sugnay na pinangungunahan ng “kapag.”
- source_word: גַנָּב
  choice: magnanakaw
  rationale: Tuwirang tumutukoy sa taong nagnanakaw; ito ang karaniwan at malinaw na salitang Tagalog.
- source_word: וַתִּרֶץ
  choice: nalulugod ka sa kaniya
  rationale: Mula sa רצה, na may diwang malugod, sang-ayunan, o tanggapin. Pinananatili ng “nalulugod” ang pangunahing diwa ng pagkagusto o pagsang-ayon nang hindi nililimitahan sa pakikisama lamang.
- source_word: עִמּוֹ
  choice: sa kaniya
  rationale: Natural na kabit ng “nalulugod” sa Tagalog habang pinananatili ang pagtukoy sa magnanakaw.
- source_word: מְנָאֲפִים
  choice: mga mangangalunya
  rationale: Ang participle na ginamit bilang pangngalan ay tumutukoy sa mga taong gumagawa ng pangangalunya.
- source_word: חֶלְקֶךָ
  choice: nakikisama ka
  rationale: Ang literal na “ang bahagi mo” ay isang metapora ng pakikiisa, pakikibahagi, o pakikisama. Ipinahahayag ng “nakikisama ka” ang idyomatikong diwa sa natural na Tagalog, habang itinatala sa talababa ang literal na larawan.
