translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinili ang “kaniya” at ang malinaw na “mga mangangalunya.” Ang unang sugnay ay nagpapanatili sa leksikal na tensiyon ng pagkalugod at pagsang-ayon; ang ikalawa ay ginawang natural sa Tagalog, habang pinananatili sa talababa ang metaporang Hebreo ng “bahagi.”
