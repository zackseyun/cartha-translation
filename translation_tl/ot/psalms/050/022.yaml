  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: tl
  text: Unawain ninyo ito, pakiusap, kayong mga lumilimot sa Diyos, kung hindi ay lalapain ko kayo, at walang magliligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “baka ako''y lumapa, at walang magliligtas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּֽינוּ
  choice: Unawain ninyo
  rationale: Ang maramihang pautos ng בין ay nananawagan ng pag-unawa at pagkilala sa babala; tuwiran at natural sa makabagong Filipino ang “Unawain ninyo.”
- source_word: נָא
  choice: pakiusap
  rationale: Nagdaragdag ang partikula ng mariing pakiusap o panghihimok, hindi lamang ng panandang temporal. Ang “pakiusap” ay nagpapanatili ng bigat nang hindi nagiging lipas ang tunog.
- source_word: זֹאת
  choice: ito
  rationale: Ang demonstratibo ay tumutukoy sa naunang babala ng Diyos; hindi ito pinalawak bilang “babala” upang maiwasan ang labis na pagpapakahulugan.
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: kayong mga lumilimot sa Diyos
  rationale: Pinananatili ng pariralang ito ang bokatibong gamit at patuloy o kinagawiang diwa ng participle sa natural na Filipino.
- source_word: פֶּן
  choice: kung hindi ay
  rationale: Ipinakikilala nito ang bantang kahihinatnan. Mas natural sa kasalukuyang Filipino ang “kung hindi ay” kaysa sa mas pormal na “baka,” na maaari ring magpahiwatig ng kawalang-katiyakan.
- source_word: אֶ֝טְרֹ֗ף
  choice: lalapain ko kayo
  rationale: Ang טרף ay matingkad na larawan ng paglalapa o pagpunit ng mandaragit. Ang “lalapain” ay nagpapanatili sa metapora, at ang “kayo” ay tahasang idinagdag mula sa malinaw na kausap sa konteksto.
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: at walang magliligtas
  rationale: Ang negatibong eksistensiyal at Hiphil participle ay nagsasaad na walang sinumang tagapagligtas. Maikli, natural, at tapat dito ang salin.
theological_decisions:
- issue: Matingkad na larawan ng paghatol ng Diyos sa אֶטְרֹף
  choice: Panatilihin ang metapora ng mandaragit sa “lalapain ko kayo.”
  alternative: Palambutin bilang “wawasakin ko kayo” o “parurusahan ko kayo.”
  rationale: Tahasang gumagamit ang Hebreo ng larawan ng paglapang ginagawa sa biktima. Ang pagpapalambot dito ay mag-aalis sa tindi at teolohikal na tensiyon ng babala.
- issue: Tahasan o pahiwatig na layon ng אֶטְרֹף
  choice: Isama sa teksto ang “kayo” para sa likas na daloy sa Filipino.
  alternative: Mas literal na “lalapa ako, at walang magliligtas.”
  rationale: Walang nakasulat na layon sa Hebreo, ngunit malinaw mula sa tuwirang kinakausap kung sino ang tatamaan. Itinatala sa talababa ang mas literal na kayarian upang mapanatili ang pormal na ambiguwidad.
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Ginamit ang “lalapain” upang mapanatili ang marahas na metapora ng Hebreo; iniwasan ang mas lumang “lalapangin” at ang pagpapalambot na “wawasakin.”
