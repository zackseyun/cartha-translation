  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: tl
  text: Kung magutom man ako, hindi ko sasabihin sa iyo, sapagkat akin ang daigdig at lahat ng nilalaman nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang daigdig at ang kapuspusan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Kung magutom man ako
  rationale: Pinananatili ng “kung” ang pasubaling diwa, at ipinahihiwatig ng “man” na ito ay isang retorikal na kalagayan, hindi pahayag na talagang nagugutom ang Diyos.
- source_word: לֹא אֹמַר לָךְ
  choice: hindi ko sasabihin sa iyo
  rationale: Tuwirang inililipat ang pandiwang אמר at ang pariralang “sa iyo,” habang nananatiling natural sa makabagong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan ng naunang pahayag; ang “sapagkat” ay malinaw, marangal, at angkop sa tulang biblikal.
- source_word: לִי
  choice: akin
  rationale: Malinaw na ipinahahayag ang pag-aari nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: תֵבֵל
  choice: ang daigdig
  rationale: Ang תֵבֵל ay tumutukoy sa daigdig, lalo na bilang tinatahanang mundo; natural at dignidad ang “daigdig” sa Tagalog.
- source_word: וּמְלֹאָהּ
  choice: at lahat ng naririto
  rationale: Ipinahahayag sa natural na Tagalog ang literal na “kapuspusan nito,” ibig sabihin, ang lahat ng pumupuno o nilalaman ng daigdig. Inilalagay sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Ang kasarinlan ng Diyos sa konteksto ng mga handog
  choice: 'Inihahayag ang pangungusap bilang retorikal na pagpapalagay: “Kung magutom man ako.”'
  alternative: “Kung magutom ako” o “Kung ako ay nagugutom.”
  rationale: Sa konteksto, itinatanggi ng Diyos na umaasa siya sa pagkaing maibibigay ng tao. Pinananatili ng salin ang retorikal na tensiyon nang hindi ginagawang tahasang doktrinal na pahayag ang talata.
translation_notes:
  register: Makabago at madaling maunawaang Filipino Tagalog na may dignidad na angkop sa awit. Ginamit ang “daigdig” sa halip na mas kolokyal na “mundo,” at ang “lahat ng naririto” upang natural na maipahayag ang Hebreong idyomang “kapuspusan nito.”
