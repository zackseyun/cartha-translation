lexical_decisions:
- source_word: לֹא
  choice: Hindi
  rationale: Karaniwang panggag‑alanggi na natural na nagbubukas sa pahayag ng Diyos sa Filipino.
- source_word: עַל
  choice: dahil sa
  rationale: Kasama ng pandiwang יכח, itinuturo nito ang sanhi o batayan ng pagsaway.
- source_word: זְבָחֶיךָ
  choice: iyong mga handog na hain
  rationale: Ipinahahayag ang pangkalahatang diwa ng זֶבַח bilang handog na inihahain, karaniwang hayop, nang hindi labis na nililimitahan ang kahulugan.
- source_word: אוֹכִיחֶךָ
  choice: kita sinasaway
  rationale: Ang Hiphil ng יכח dito ay tumutukoy sa pagsaway o pagpuna, hindi kinakailangang sa isang makitid na legal na paratang.
- source_word: וְעוֹלֹתֶיךָ
  choice: ang iyong mga handog na sinusunog
  rationale: Tumpak at madaling maunawaang salin ng teknikal na katawagang עוֹלָה para sa handog na buong sinusunog.
- source_word: לְנֶגְדִּי
  choice: nasa harapan ko
  rationale: Pinananatili ang diwa ng pagiging nasa presensiya o paningin ng Diyos sa natural na Filipino.
- source_word: תָמִיד
  choice: laging
  rationale: Likas na Filipino para sa patuloy o palagiang pagharap ng mga handog sa Diyos.
theological_decisions:
- issue: Kaugnayan ng pagsaway ng Diyos sa sistemang paghahandog ng Israel
  choice: Hindi sinasaway ng Diyos ang bayan dahil kulang o wala silang mga handog.
  alternative: Lubusang itinatakwil ng talata ang paghahandog.
  rationale: Ipinahahayag ng ikalawang sugnay na ang mga handog na sinusunog ay laging nasa harapan ng Diyos; kaya hindi kawalan ng ritwal ang puntong pinupuna, bagkus isang mas malalim na suliraning nililinaw ng konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “handog na hain” upang maiba ang pangkalahatang זֶבַח sa teknikal na “handog na sinusunog” ng עוֹלָה, habang pinananatili ang tuwirang pakikipag-usap ng Diyos sa isahan.
