base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: tl
  text: Ang naghahandog ng haing pasasalamat ay nagpaparangal sa akin; at sa taong nag-aayos ng kanyang landas[a], ipakikita ko sa kanya ang pagliligtas ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsasaayos ng kanyang pamumuhay,” o “naghahanda ng daan.” Siksik ang Hebreong parirala at maaaring unawain bilang wastong pagsasaayos ng sariling buhay.
    reason: alternative_reading
  - marker: b
    text: O “kaligtasan ng Diyos” o “tagumpay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  choice: naghahandog ng handog ng pasasalamat
  rationale: Ang pandiwaring זֹבֵחַ ay tumutukoy sa taong naghahandog, at ang תּוֹדָה sa kontekstong pansakripisyo ay pasasalamat na ipinahahayag sa pamamagitan ng isang handog. Pinananatili ng salin ang dalawang diwa nang hindi ito ginagawang pasalitang pasasalamat lamang.
- source_word: יְכַבְּדָנְנִי
  choice: nagpaparangal sa akin
  rationale: Ang Piel ng כבד ay nangangahulugang magparangal o magbigay-luwalhati. Ang “nagpaparangal” ay malinaw at likas sa makabagong Filipino.
- source_word: וְשָׂם דֶּרֶךְ
  choice: at sa taong inaayos ang kanyang landas
  rationale: Siksik at bahagyang malabo ang pariralang Hebreo. Pinananatili ng “landas” ang talinghaga ng דֶּרֶךְ, habang ipinahihiwatig ng “inaayos” ang malamang na diwa ng wastong pagsasaayos ng pamumuhay.
- source_word: אַרְאֶנּוּ
  choice: ipakikita ko
  rationale: Ang Hiphil ng ראה na may hulaping pangatlong panauhang panlalaki ay “ipakikita ko sa kanya.” Hindi na inuulit ang di-tuwirang layon sa Filipino dahil malinaw na ito sa “sa taong.”
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: ang pagliligtas ng Diyos
  rationale: Ang יֵשַׁע ay maaaring tumukoy sa pagliligtas, kaligtasan, o tagumpay. Ang “pagliligtas” ay natural dito at naipakikita ang kilos ng Diyos nang hindi nilulutas nang labis ang saklaw ng salita.
theological_decisions:
- issue: Kahulugan ng וְשָׂם דֶּרֶךְ
  choice: Pangako ito sa taong inaayos ang kanyang landas o pamumuhay.
  alternative: Maaari rin itong unawain bilang “sa naghahanda ng daan.”
  rationale: Malamang na etikal na pagsasaayos ng pamumuhay ang tinutukoy sa konteksto, ngunit pinananatili ng literal na talinghagang “landas” ang pagiging siksik at ang bahagyang kalabuan ng Hebreo.
- issue: Saklaw ng יֵשַׁע אֱלֹהִים
  choice: pagliligtas ng Diyos
  alternative: kaligtasan ng Diyos; tagumpay na mula sa Diyos
  rationale: Hindi nililinaw ng talata kung isang tiyak na uri ng pagliligtas o tagumpay ang tinutukoy, kaya iniingatan ang malawak na diwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “handog ng pasasalamat” upang mapanatili ang sakripisyal at mapagpasalamat na diwa, at ang “landas” upang mapanatili ang talinghagang Hebreo.
