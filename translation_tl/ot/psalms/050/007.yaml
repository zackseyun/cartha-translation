base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: tl
  text: “Makinig ka, bayan ko, at magsasalita ako; Israel, magpapatotoo[a] ako laban sa iyo. Ako ang Diyos, ang Diyos mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magbibigay ako ng patotoo laban sa iyo.” May legal o panghukumang diwa ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Makinig ka
  rationale: Isang pautos na humihingi ng masusing pakikinig. Likas ito sa modernong Tagalog at napananatili ang taimtim na tono ng panawagang tipan at panghukuman.
- source_word: עַמִּי
  choice: bayan ko
  rationale: Ipinahahayag ng hulaping unang panauhan ang kaugnayan ng Diyos sa Israel bilang bayang kanya. Mas likas at marangal dito ang “bayan ko” kaysa “mga tao ko.”
- source_word: וַאֲדַבֵּרָה
  choice: at magsasalita ako
  rationale: Ang cohortative na unang panauhan kasunod ng pautos ay nagpapahayag ng taimtim na layuning magsalita; malinaw itong naihahatid ng anyong panghinaharap sa Tagalog.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalang pantangi at ang gamit nito bilang tuwirang pagtawag sa bayang kausap.
- source_word: וְאָעִידָה בָּךְ
  choice: magpapatotoo ako laban sa iyo
  rationale: 'Ang Hiphil ng עוד kasama ng בְּ ay may puwersang legal o panghukuman: ang Diyos ay tatayong saksi at magbibigay ng patotoong laban sa Israel. Hindi sapat ang “babalaan kita” sapagkat nawawala rito ang larawang panghukuman.'
- source_word: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: Ako ang Diyos, ang Diyos mo
  rationale: Inilalapit ng ayos na ito ang diin ng malayang panghalip אָנֹכִי habang malinaw at natural na ipinapahayag ang pagkakakilanlan ng nagsasalita at ang kaugnayan niya sa Israel.
theological_decisions:
- issue: Ang mariing pagpapakilala ng Diyos sa pariralang אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: Ako ang Diyos, ang Diyos mo
  alternative: Ang Diyos, ang Diyos mo, ay ako
  rationale: Ang Hebreo ay isang sugnay na walang tahasang pandiwang panugnay at may mariing panghalip. Ang napiling salin ay natural sa modernong Tagalog, pinananatili ang diin sa “Ako,” at hindi dinaragdagan ang pahayag ng anumang paliwanag na teolohikal.
- issue: Ang legal na puwersa ng patotoo laban sa Israel
  choice: magpapatotoo ako laban sa iyo
  alternative: magbibigay ako ng patotoo laban sa iyo
  rationale: Parehong pinananatili ang larawang panghukuman. Pinili ang mas maikli at natural na “magpapatotoo” nang hindi pinahihina ito tungo sa “babalaan.”
translation_notes:
  register: Modernong Filipino Tagalog na taimtim ngunit madaling maunawaan. Ginamit ang isahang “ka/iyo/mo” dahil isahan ang anyong Hebreo at ang Israel ay kinakausap bilang isang bayang kolektibo. Hindi dinagdagan ng “O” ang “Israel,” sapagkat sapat na sa natural na Tagalog ang pangalan bilang tuwirang tawag.
