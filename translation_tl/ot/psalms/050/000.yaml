base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: tl
  text: Awit ni Asaf. Diyos[a], Diyos, si Yahweh, ay nagsalita at tinawag ang lupa, mula sa sikatan ng araw hanggang sa paglubog nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Diyos, Diyos, ang PANGINOON”; nauunawaan naman ng ilan ang mga unang katawagan bilang “Ang Diyos ng mga diyos, si Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Awit ni Asaf
  rationale: Natural at maikli sa modernong Tagalog; pinananatili ng “ni Asaf” ang karaniwang pagkaunawa sa kaugnayan ng awit kay Asaf nang hindi dinaragdagan ang pamagat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיִּקְרָא אָרֶץ
  choice: at tinawag ang lupa
  rationale: Malapit sa anyo at kahulugan ng Hebreo; hindi nilalagyan ng tahasang layon o dahilan ang pagtawag.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: mula sa sikatan ng araw hanggang sa paglubog nito
  rationale: Likas na katumbas sa Tagalog ng saklaw mula silangan hanggang kanluran habang pinananatili ang larawang ginagamit ng Hebreo.
theological_decisions:
- issue: Pag-uugnay ng magkakasunod na banal na katawagang אֵל אֱלֹהִים יְהוָה
  choice: Ang Diyos, ang Diyos, si Yahweh
  alternative: Ang Diyos ng mga diyos, si Yahweh; o “Diyos, Diyos, ang PANGINOON”
  rationale: Pinananatili sa pangunahing teksto ang tatlong sunod na katawagan at ang retorikal na diin, habang kinikilala sa talababa na maaaring unawain ang unang dalawa bilang isang pariralang construct.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Yahweh” bilang personal na pangalan at iniwasang lutasin nang tahasan ang sintaktikong kalabuan ng pambungad na mga banal na katawagan.
