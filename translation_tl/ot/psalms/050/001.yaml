  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: tl
  text: 'Awit ni Asaf.


    Ang Makapangyarihan[a]—ang Diyos, si Yahweh—ay nagsalita at tinawag ang daigdig, mula sa pagsikat ng araw hanggang sa paglubog nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang Diyos, Diyos, si Yahweh”; inuunawa naman ng ilan ang mga unang katawagan bilang “Ang Diyos ng mga diyos, si Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan sa pamagat ng mga salmo; natural at matatag na salin sa modernong Tagalog.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Maikli at natural, habang hinahayaan ang לְ na tumukoy sa pagkakatha, kaugnayan, o koleksiyon ni Asaf nang hindi ito higit na tinutukoy.
- source_word: אֵל
  choice: Ang Makapangyarihan
  rationale: Pinananatiling naiiba sa אֱלֹהִים at ipinahahayag ang lakas na kalakip ng katawagang El.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Isahan ang tinutukoy ayon sa kasunod na pangalang Yahweh at sa mga pandiwang isahan.
- source_word: יְהוָה
  choice: si Yahweh
  rationale: Direktang transliterasyon ng personal na pangalan ng Diyos; ang pantukoy na 'si' ay likas sa Tagalog para sa personal na pangalan.
- source_word: דִּבֶּר
  choice: ay nagsalita
  rationale: Ipinapakita ang ganap na kilos sa marangal at tuwirang pananalita.
- source_word: וַיִּקְרָא
  choice: at tinawag
  rationale: Pinananatili ang pagkakasunod ng pagsasalita at pagtawag o pagpapatawag nang hindi labis na nililinaw ang hudisyal na pahiwatig.
- source_word: אָרֶץ
  choice: ang buong daigdig
  rationale: Ang saklaw mula silangan hanggang kanluran ay pandaigdigan; idinagdag ang 'buong' upang natural na maipahayag sa Tagalog ang kabuuang saklaw ng merismo.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: mula sa pagsikat ng araw
  rationale: Pinananatili ang konkretong makatang larawan sa halip na paikliin bilang 'mula sa silangan.'
- source_word: עַד מְבֹאוֹ
  choice: hanggang sa paglubog nito
  rationale: Ang hulaping panghalip ay tumutukoy sa araw; natural at maikli ang parirala sa Tagalog.
theological_decisions:
- issue: 'Ang tatlong sunod-sunod na katawagan sa Diyos: אֵל אֱלֹהִים יְהוָה'
  choice: Ang Makapangyarihan—ang Diyos, si Yahweh
  alternative: Ang Diyos, Diyos, si Yahweh; o Ang Diyos ng mga diyos, si Yahweh
  rationale: Itinuturing ang tatlo bilang magkakahanay na katawagan at pinananatiling naiiba ang אֵל bilang 'Ang Makapangyarihan.' Gayunman, tunay na may sintaktikong kalabuan kung magkakahiwalay na katawagan ba ang mga ito o kung ang unang dalawa ay bubuo sa 'Diyos ng mga diyos,' kaya inilagay ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga gitling sa palibot ng magkatabing katawagan upang malinaw na ang 'ang Diyos, si Yahweh' ay karagdagang pagkakakilanlan sa 'Ang Makapangyarihan,' habang pinananatili sa talababa ang tunay na kalabuan ng Hebreo.
