  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: tl
  text: 'Sapagkat akin ang bawat mailap na hayop sa gubat,

    ang mga hayop sa sanlibong bundok.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salita para sa “mga hayop” ay maaari ring tumukoy sa malalaking hayop o mga alagang hayop. Ang “mga bundok” ay maaari ring isaling “mga burol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang pahayag at likas na nag-uugnay sa konteksto.
- source_word: לִי
  choice: akin
  rationale: Tuwirang ipinapahayag ng pariralang Hebreo ang pagmamay-ari; maikli at natural ang “akin” sa Filipino.
- source_word: כָל חַיְתוֹ יָעַר
  choice: bawat mailap na hayop sa gubat
  rationale: Ang חַיְתוֹ יָעַר ay tumutukoy sa mga hayop na nasa gubat, lalo na sa maiilap na hayop; inilalabas ng “bawat” ang distributibong puwersa ng כָל.
- source_word: בְּהֵמוֹת
  choice: mga hayop
  rationale: Maaaring tumukoy ang salita sa malalaking hayop o mga alagang hayop, ngunit hindi tiyak na mga baka lamang. Pinananatili ng pangkalahatang “mga hayop” ang lawak ng salita.
- source_word: בְּהַרְרֵי אָלֶף
  choice: sa sanlibong bundok
  rationale: Pinananatili nito ang tahasang bilang na isang libo at ang larawang heograpiko ng Hebreo; maaari ring unawain ang הַרְרֵי bilang mga burol.
theological_decisions:
- issue: Lawak ng larawan ng pagmamay-ari ng Diyos
  choice: Pinananatili ang “sanlibong bundok” bilang makatang larawan ng napakalawak na pagmamay-ari ng Diyos.
  alternative: Unawain ito bilang eksaktong bilang na isang libong bundok, o isalin nang paliwanag bilang lahat ng hayop sa lahat ng dako.
  rationale: Tahasan ang bilang sa Hebreo, ngunit makata ang konteksto. Hindi ito dapat gawing prosaikong imbentaryo o palitan ng isang pagpapakahulugang nawawala ang orihinal na larawan.
- issue: Ugnayan ng dalawang kalahati ng taludtod
  choice: Walang idinagdag na “at”; pinanatili ang magkatabing makatang mga parirala ng Hebreo.
  alternative: Idagdag ang “at” o “pati” upang hayagang gawing dalawang magkaugnay na pangkat ang maiilap at alagang hayop.
  rationale: Walang pangatnig sa tekstong Hebreo. Ang pagkakatabi ng dalawang parirala ay maaaring marinig bilang paralelismo o pagpapalawak, kaya hindi tahasang nilutas ng salin ang sintaktikong ugnayan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maikli at makatang ayos na “akin ang” at pinanatili ang paralelismo nang walang idinagdag na pangatnig.
