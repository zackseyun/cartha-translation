base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: tl
  text: Sabay-sabay nawa silang mapahiya at mapahiya nang lubos, silang mga naghahangad na kitilin ang buhay ko[a][b]; umurong nawa at mawalan ng dangal ang mga natutuwa sa kapahamakang sinasapit ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pawiin,” “ubusin,” o “wasakin”; maaaring tumukoy ang pandiwang Hebreo sa pagkitil sa buhay ng salmista.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang kaluluwa/buhay ko”; dito, ang tinutukoy ay ang buhay o mismong sarili ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: Sabay-sabay nawang mapahiya at malagay sa kahihiyan
  rationale: Pinananatili ang dalawang magkatulad ngunit nagpapatingkad na pahayag tungkol sa kahihiyan, gayundin ang יַחַד bilang “sabay-sabay.” Ipinahahayag ng “nawa” ang panalanging may jussive o imprecatory na lakas.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ang mga naghahangad ... ang buhay ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong sarili ng salmista, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: לִסְפּוֹתָהּ
  choice: na lipulin
  rationale: Ang pandiwa ay maaaring mangahulugang pawiin, ubusin, o wasakin. Ang “lipulin” ay natural at malinaw na nagpapahiwatig ng pagkitil o ganap na pagwasak sa buhay.
- source_word: יִסֹּגוּ אָחוֹר
  choice: umurong nawa
  rationale: Natural na katumbas ito ng pag-atras o pagtalikod, at pinananatili ang anyong panalangin o kahilingan.
- source_word: וְיִכָּלְמוּ
  choice: at mawalan ng dangal
  rationale: Inilalarawan ng כּלם ang pagkadusta o pagkahamak. Iniiwasan ng pariralang ito ang mekanikal na pag-uulit sa “mapahiya” habang pinananatili ang paralelismo.
- source_word: חֲפֵצֵי רָעָתִי
  choice: ang mga natutuwa sa kapahamakang sinasapit ko
  rationale: Ang חפץ ay may diwang pagnanais o pagkatuwa, at ang רָעָה rito ay kapahamakan o pinsalang dumarating sa salmista, hindi ang sarili niyang kasamaan.
theological_decisions:
- issue: Lakas ng sumpa o panalangin laban sa mga kaaway
  choice: Ginamit ang “nawa” upang malinaw na ihayag ang panalangin o kahilingan ng salmista.
  alternative: 'Isalin bilang payak na panghinaharap: “Mapapahiya sila...”'
  rationale: Ang mga anyong pandiwa sa konteksto ay angkop unawain bilang jussive o imprecatory. Hindi ito ginawang tiyak na prediksiyon o pinalambot bilang pangkalahatang hangarin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sabay-sabay nawa” at “umurong nawa” upang mapanatili ang panalanging patula. Ang “kapahamakang sinasapit ko” ay mas malinaw sa karaniwang mambabasa kaysa sa literal ngunit malabong “aking kasamaan.”
