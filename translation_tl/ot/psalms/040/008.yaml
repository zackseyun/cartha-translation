  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: tl
  text: 'Kinalulugdan kong gawin ang kalooban mo, Diyos ko;

    at ang kautusan mo[a] ay nasa kaibuturan ko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “turo mo.” Maaaring tumukoy ang Hebreong torah sa turo ng Diyos sa mas malawak na diwa, hindi lamang sa mga batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: gawin
  rationale: 'Tuwirang ipinapahayag ng pawatas na may ל ang gawaing kinalulugdan ng nagsasalita: ang pagsasagawa ng kalooban ng Diyos.'
- source_word: רְצוֹנְךָ
  choice: ang kalooban mo
  rationale: Sa pagkakaugnay nito sa pandiwang 'gawin,' likas na katumbas ang 'kalooban,' na nagpapanatili sa diwa ng nais o layunin ng Diyos.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang tinutumbasan ang panghalip na unang panauhang isahan at pinananatili ang personal na pagtawag.
- source_word: חָפָצְתִּי
  choice: Kinalulugdan ko
  rationale: Ipinahihiwatig ng חפץ ang pagkagusto, kasiyahan, o galak. Ang 'kinalulugdan' ay natural at marangal na Filipino para sa kusang-loob at masayang disposisyon, hindi lamang simpleng pagnanais.
- source_word: וְתוֹרָתְךָ
  choice: at ang kautusan mo
  rationale: Pinananatili ng 'kautusan' ang tipanang at kasulatang bigat ng תּוֹרָה, habang inilalahad sa talababa ang mas malawak nitong kahulugang 'turo.'
- source_word: בְּתוֹךְ
  choice: nasa
  rationale: Kasama ng 'kaibuturan,' natural na ipinapahayag ng 'nasa' ang panloob na kinaroroonan na tinutukoy ng pariralang Hebreo.
- source_word: מֵעָי
  choice: kaibuturan ko
  rationale: Bagaman literal na tumutukoy sa mga lamang-loob, ginagamit dito ang salita para sa pinakamalalim na panloob na pagkatao. Pinananatili ng 'kaibuturan ko' ang larawang ito nang hindi nagiging anatomikal o labis na mapagpaliwanag.
theological_decisions:
- issue: Pagsasalin sa תּוֹרָה sa kontekstong debosyonal
  choice: kautusan
  alternative: turo
  rationale: Pinananatili ng 'kautusan' ang tipanan at kasulatang kaugnayan ng salita sa Mga Awit. Gayunman, hindi lamang mga batas ang maaaring saklawin ng תּוֹרָה, kaya inilalagay sa talababa ang 'turo' bilang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kinalulugdan' upang ipahayag ang masayang kusang-loob na disposisyon, at 'kaibuturan' upang ilarawan ang panloob na pagkatao nang hindi gumagamit ng lipas o anatomikal na pananalita. Inilagay ang [a] pagkaraan ng 'kautusan mo,' ang salitang aktuwal na nililinaw ng talababa.
