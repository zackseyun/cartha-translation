  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: tl
  text: Hindi ko itinago sa kaibuturan ng aking puso ang iyong katuwiran[a]; ipinahayag ko ang iyong katapatan at pagliligtas[b]. Hindi ko ikinubli mula sa malaking kapulungan ang iyong tapat na pag-ibig[c] at katotohanan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.” Ang Hebreong צדקה ay maaaring tumukoy sa katuwirang moral o sa makatarungang pagkilos at pagbibigay-katuwiran, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kaligtasan” o “pagsagip.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pag-ibig na ayon sa iyong tipan.” Ang Hebreong חסד ay tumutukoy sa pag-ibig na matatag at tapat.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “sa harap ng malaking kapulungan.” Maaaring idiin ng Hebreong pagkakabuo ang mga taong hindi pinagkublihan o ang madlang pinaghayagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: ang iyong katuwiran
  rationale: Pinananatili ng “katuwiran” ang pangunahing diwang moral at tipanan ng צדקה sa hanay ng mga katangian at gawa ng Diyos; inilalahad sa talababa ang posibleng diwang “katarungan.”
- source_word: כִסִּיתִי
  choice: Hindi ko itinago
  rationale: Bagaman literal na “tinakpan,” ang pandiwa sa pariralang ito ay tumutukoy sa pagkukubli o pagpapanatiling hindi ipinahahayag; natural sa Filipino ang “itinago.”
- source_word: בְּתוֹךְ לִבִּי
  choice: sa kaibuturan ng aking puso
  rationale: Pinananatili nito ang larawang Hebreo ng isang bagay na kinikimkim sa loob, sa dignified at likas na Filipino.
- source_word: אֱמוּנָתְךָ
  choice: ang iyong katapatan
  rationale: Ang אֱמוּנָה rito ay pagiging maaasahan at tapat ng Diyos, hindi pansariling paniniwala.
- source_word: וּתְשׁוּעָתְךָ
  choice: at pagliligtas
  rationale: Ang “pagliligtas” ay natural at malawak na katumbas ng תשועה bilang gawa ng Diyos na pagsagip; maaaring “kaligtasan” ayon sa talababa.
- source_word: אָמָרְתִּי
  choice: ipinahayag ko
  rationale: Bagaman karaniwang “sinabi ko,” hinihingi ng mga tuwirang layon at ng konteksto ng pampublikong patotoo ang natural na “ipinahayag ko.”
- source_word: כִחַדְתִּי
  choice: Hindi ko ikinubli
  rationale: Ipinahahayag ng כחד ang hindi pagtatago o pagkakait. Ang “ikinubli” ay nagpapanatili ng bahagyang estilistikong pagkakaiba sa naunang “itinago.”
- source_word: חַסְדְּךָ
  choice: ang iyong tapat na pag-ibig
  rationale: Ipinakikita nito kapwa ang pag-ibig at matatag na katapatan ng חסד nang hindi gumagamit ng makaluma o sektaryong pananalita.
- source_word: וַאֲמִתְּךָ
  choice: at katotohanan
  rationale: Pinananatili ng “katotohanan” ang leksikal na pagkakaiba sa naunang אֱמוּנָה, habang maaari pa ring magpahiwatig ng pagiging maaasahan.
- source_word: לְקָהָל רָב
  choice: sa malaking kapulungan
  rationale: Kasunod ng pandiwa ng pagkukubli, maaaring tukuyin ng לְ ang mga taong hindi pinagkublihan; natural itong “sa” sa Filipino, habang ang posibleng diin na “sa harap ng” ay nasa talababa.
theological_decisions:
- issue: Pagkakaiba ng magkaugnay na terminong tipanan na אֱמוּנָה at אֱמֶת
  choice: Isalin bilang “katapatan” at “katotohanan.”
  alternative: Gamitin ang magkapareho o magkasanib na salitang “katapatan” para sa dalawa, o pagpalitin ang mga katumbas.
  rationale: Pinananatili nito ang retorikal na pag-iipon ng magkakaugnay ngunit hindi lubos na magkaparehong katangian ng Diyos, nang hindi pinapawi ang kanilang semantikong pagsasanib.
- issue: Panahunan at aspekto ng mga Hebreong perfect
  choice: 'Gumamit ng pangnagdaang aspektong Filipino: “itinago,” “ipinahayag,” at “ikinubli.”'
  alternative: Gumamit ng mga pariralang may “hindi ko kailanman” o “naipahayag ko na” upang idiin ang patuloy na bisa.
  rationale: Hindi kailangang piliting tumbasan sa Filipino ang English present perfect. Ang karaniwang pangnagdaang anyo ay malinaw na nagsasalaysay ng natapos na patotoo, habang pinananatili ng konteksto ang kasalukuyang kabuluhan nito.
- issue: Saklaw ng חסד
  choice: “tapat na pag-ibig”
  alternative: “pag-ibig na ayon sa tipan” o “matibay na pag-ibig”
  rationale: Ang “tapat na pag-ibig” ay nagpapahayag ng pagmamahal at matatag na katapatan nang hindi ipinapasok sa pangunahing teksto ang mas teknikal na salitang “tipan,” bagaman posible ang gayong diin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaibuturan ng aking puso” upang mapanatili ang Hebreong larawan nang natural, at “kapulungan” para sa pampubliko at panlahatang pagtitipon. Iniwasan ang makalumang “kagandahang-loob” at ang teknikal o denominasyonal na pananalita.
