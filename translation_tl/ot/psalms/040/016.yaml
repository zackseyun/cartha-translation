  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: tl
  text: Magalak at magsaya nawa sa iyo ang lahat ng humahanap sa iyo; lagi nawang sabihin ng mga umiibig sa pagliligtas mo[a], “Dakilain nawa si Yahweh!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaligtasan mo.” Ang Hebreong תְּשׁוּעָה ay maaaring mangahulugang “kaligtasan” o “pagliligtas.”
    reason: lexical_alternative
  - marker: b
    text: Isang pagbubunyi na nagpapahayag ng hangaring hayagang kilalanin ang kadakilaan ni Yahweh. Maaari ring isalin, “Maging dakila nawa si Yahweh!”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: Magalak at magsaya nawa
  rationale: Ang dalawang di-ganap na pandiwa ay nagpapahayag dito ng isang panalangin o hangarin. Pinananatili ng “magalak at magsaya nawa” ang magkatugmang ngunit bahagyang magkaibang mga salitang Hebreo sa likas at marangal na Tagalog.
- source_word: בְּךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng בְּ ang pinagmumulan o saklaw ng kanilang kagalakan; ang “sa iyo” ay maikli, likas, at nananatiling bukas sa parehong diwang ‘nasa iyo’ at ‘dahil sa iyo.’
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: ang lahat ng humahanap sa iyo
  rationale: Ang participle ay tumutukoy sa mga taong kinikilalang patuloy na humahanap sa Diyos. Likas sa modernong Tagalog ang pariralang ito.
- source_word: יֹאמְרוּ תָמִיד
  choice: lagi nawang sabihin
  rationale: Ang תָמִיד ay nagsasaad ng palagian o paulit-ulit na pagpapahayag, samantalang ang “nawa” ay nagpapanatili sa himig ng panalangin o hangarin.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: mga umiibig sa pagliligtas mo
  rationale: Ang תְּשׁוּעָה ay maaaring tumukoy sa kaligtasan, pagliligtas, o tagumpay. Pinili ang “pagliligtas” upang malinaw na ipakita ang gawa ng Diyos nang hindi nililimitahan kung ito ay agarang pagsagip o mas malawak na kaligtasan.
- source_word: יִגְדַּל יְהוָה
  choice: Dakilain nawa si Yahweh!
  rationale: Ang anyo ay pinakamahusay na inuunawa bilang isang hangarin o pagbubunyi, hindi lamang pahayag na dakila si Yahweh. Ang “Dakilain nawa” ay likas na panawagan na hayagang kilalanin ang kanyang kadakilaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng תְּשׁוּעָה
  choice: pagliligtas
  alternative: kaligtasan
  rationale: Saklaw ng salitang Hebreo ang kongkretong pagsagip at mas malawak na kaligtasan. Ang “pagliligtas” ay nagpapanatili sa aktibong gawa ng Diyos, habang inilalahad sa talababa ang lehitimong alternatibo.
- issue: Paghahayag ng יִגְדַּל יְהוָה
  choice: Dakilain nawa si Yahweh!
  alternative: Dakila si Yahweh!
  rationale: Pinananatili ng napiling salin ang jussive o paghahangad na hayagang kilalanin ang kadakilaan ni Yahweh; ang alternatibo ay gagawin itong payak na pahayag.
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nawa” upang mapanatili ang himig ng panalangin at paghahangad. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili rin ang pangalan na “Yahweh.”
