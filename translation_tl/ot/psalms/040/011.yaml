base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: tl
  text: Ikaw, Yahweh, ay hindi magkakait sa akin ng iyong habag[a]; ang iyong tapat na pag-ibig at katapatan ay lagi akong iingatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag mong ipagkait sa akin ang iyong habag,” kung uunawain ang pandiwa bilang pakiusap sa halip na pahayag ng pananalig.'
    reason: alternative_reading
  - marker: b
    text: Ang “katapatan” ay maaari ring isaling “katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH upang mapanatili ang personal at tipanang pangalan ng Diyos.
- source_word: תִכְלָא
  choice: ay hindi magkakait
  rationale: Ang כלא ay nangangahulugang pigilin o ipagkait. Ang anyong yiqtol ay likas basahin dito bilang pahayag ng pananalig, bagaman maaari rin itong unawain bilang pakiusap.
- source_word: רַחֲמֶיךָ
  choice: iyong habag
  rationale: Ipinahahayag ng maramihang Hebreo ang mahabaging awa; natural at marangal sa modernong Tagalog ang 'habag.'
- source_word: חַסְדְּךָ
  choice: iyong tapat na pag-ibig
  rationale: Sinasaklaw nito ang kabutihan, katapatan, at matibay na pagtatalaga na ipinahihiwatig ng חֶסֶד.
- source_word: אֲמִתְּךָ
  choice: katapatan
  rationale: Sa pagtambal nito sa חֶסֶד at bilang kumikilos na tagapag-ingat, nangingibabaw dito ang diwang pagiging maaasahan o tapat; nananatiling posible ang 'katotohanan.'
- source_word: תָּמִיד
  choice: lagi
  rationale: Likas at malinaw na katumbas sa Tagalog ng patuloy o palagiang pagkilos.
- source_word: יִצְּרוּנִי
  choice: ako'y iingatan
  rationale: Ang נצר ay tumutukoy sa pag-iingat, pagbabantay, o pagpapanatiling ligtas; ipinananatili ng 'iingatan' ang proteksiyon nitong diwa.
theological_decisions:
- issue: Pagpapakahulugan sa תִכְלָא bilang pahayag o pakiusap
  choice: 'pahayag ng pananalig: ''ay hindi magkakait'''
  alternative: 'pakiusap: ''huwag mong ipagkait'''
  rationale: Ang pandiwa ay 2ms yiqtol at maaaring magpahayag ng inaasahang kilos, ngunit sa konteksto ng panalangin posible rin ang jussive-like na pakiusap; itinatala ang alternatibo upang hindi alisin ang tunay na kalabuan.
- issue: Kahulugan ng אֱמֶת sa pagtambal sa חֶסֶד
  choice: katapatan
  alternative: katotohanan
  rationale: Ang 'katapatan' ay angkop sa tipanang pagtambal at sa mapag-ingat na pagkilos, ngunit leksikal na tunay ang 'katotohanan' at pinananatili sa talababa.
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ng 'Yahweh' ang personal na pangalang nasa tekstong Hebreo nang hindi ito ginagawang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'O Yahweh' upang mapanatili ang tuwirang pagtawag; pinanatiling magkatambal ang 'tapat na pag-ibig at katapatan.'
