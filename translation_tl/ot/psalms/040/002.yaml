id: PSA.40.2
reference: Psalms 40:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: tl
  text: Iniahon niya ako mula sa hukay ng ugong[a], mula sa putikang lusak; itinuntong niya sa bato ang aking mga paa at pinatatag ang aking mga hakbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukay ng dagundong/ingay.” Isinasalin ito ng ilan nang mas interpretibo bilang “mapanglaw na hukay” o “hukay ng pagkawasak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Iniahon niya ako
  rationale: Ang Hiphil ng עלה ay nangangahulugang ‘paakyatin’ o ‘iahon.’ Likas sa Tagalog ang ‘iniahon’ at malinaw na pinananatili ang larawan ng pagliligtas mula sa isang hukay.
- source_word: מִבּוֹר
  choice: mula sa hukay
  rationale: Ang בּוֹר ay maaaring hukay, balon, o sisidlang-hukay. Ang ‘hukay’ ang pinakamalawak at pinakanatural sa makatang kontekstong ito.
- source_word: שָׁאוֹן
  choice: ng ugong
  rationale: Pangunahing tumutukoy ang שָׁאוֹן sa malakas na ingay, dagundong, o kaguluhan. Pinananatili ng ‘ugong’ ang pandinig na larawan nang hindi ito binibigyang-kahulugang ‘pagkawasak.’
- source_word: מִטִּיט הַיָּוֵן
  choice: mula sa putikang lusak
  rationale: Magkasamang inilalarawan ng טִיט at יָוֵן ang malagkit at di-matatagang putik. Natural sa modernong Tagalog ang ‘putikang lusak’ at naipahahayag nito ang pinatinding konkretong larawan.
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: itinuntong niya sa bato ang aking mga paa
  rationale: Ang Hiphil ng קום ay ‘patayuin’ o ‘itindig.’ Sa Tagalog, malinaw at natural ang ‘itinuntong ... ang aking mga paa,’ habang nananatili ang konkretong larawan ng katatagan sa bato.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: pinatatag ang aking mga hakbang
  rationale: Ipinahihiwatig ng Polel ng כון ang pagpapatatag o pagtitibay, at ang אֲשֻׁרָי ay ‘aking mga hakbang.’ Ang salin ay maikli, natural, at tapat sa resulta ng kilos.
theological_decisions:
- issue: Kung pananatilihin ang konkretong larawan ng pagliligtas o gagawing tahasang espirituwal o moral ang mga talinghaga
  choice: Panatilihin sa pangunahing teksto ang konkretong larawan ng hukay, lusak, mga paa, bato, at mga hakbang.
  alternative: Isalin nang interpretibo bilang pagliligtas mula sa pagkawasak o espirituwal na kapahamakan.
  rationale: Matingkad at konkretong makatang larawan ang nasa Hebreo. Hindi tinutukoy ng talata mismo ang eksaktong uri ng pagliligtas, kaya hindi dapat paliitin ng salin ang posibleng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘iniahon,’ ‘putikang lusak,’ at ‘pinatatag’ upang mapanatili ang kongkretong tula nang hindi nagiging lipas o labis na teknikal.
