  text: For the choirmaster. Of David[a]. A psalm.
translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan. Isang salmo ni David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula kay David” o “para kay David.” Ang Hebreong pamagat ay maaaring magpahiwatig ng pagkatha, kaugnayan, pag-aari sa isang koleksiyon, o paghahandog.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ang terminong ito sa mga pamagat ng salmo ay tumutukoy sa taong nangangasiwa sa pagtatanghal ng musika. Pinananatili ng “Para sa” ang karaniwang diwang patungkol o paghahandog ng unlaping לַ־.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas at marangal sa modernong Tagalog ang “ni David” sa pamagat. Maaari itong magpahiwatig ng pagkatha, kaugnayan, pag-aari sa isang koleksiyon, o paghahandog; nililinaw ng talababa ang saklaw ng Hebreo nang hindi ipinipilit ang iisang pakahulugan.
- source_word: מִזְמוֹר
  choice: isang salmo
  rationale: Ito ang karaniwang katawagan sa uring pampanitikan at pangmusikang tinutukoy ng salitang Hebreo, at malinaw ito sa ordinaryong mambabasa.
theological_decisions:
- issue: Kahulugan ng Davidikong pamagat na לְדָוִד
  choice: ni David
  alternative: mula kay David; para kay David; kaugnay ni David
  rationale: Hindi sapilitang nagpapasya ang Hebreong לְדָוִד kung tuwirang pagkatha ni David ang tinutukoy. Pinananatili sa talababa ang posibleng pagkatha, kaugnayan, o paghahandog upang hindi gawing higit na tiyak ang pahayag kaysa sa orihinal.
translation_notes:
  register: Gumamit ng maikli, dignidad, at likas na anyo ng pamagat sa modernong Filipino. Ang “tagapangasiwa ng awitan” ay mas madaling maunawaan kaysa sa teknikal o lipas na katawagan, habang nananatili ang kontekstong pangmusika.
