base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: tl
  text: 'Ipinahayag ko ang katuwiran sa malaking kapulungan.[a]


    Narito, hindi ko pinigil ang aking mga labi;


    Yahweh, alam mo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring taglayin ng Hebreong צֶדֶק ang parehong diwang moral at hudisyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: Ipinahayag ko
  rationale: Ipinapanatili nito ang diwa ng hayagang pagbabalita ng Piel na בּשׂר nang hindi nililimitahan ang parirala sa teknikal na pananalitang pang-ebanghelyo.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Saklaw ng צֶדֶק ang moral na katuwiran at maaari ring magpahiwatig ng katarungan; likas sa kontekstong pang-awit ang “katuwiran,” habang inilalahad sa talababa ang lehitimong alternatibo.
- source_word: בְּקָהָל רָב
  choice: sa malaking kapulungan
  rationale: Ang קָהָל ay nagkakatipong pamayanan o kapulungan, at ang רָב ay tumutukoy sa laki o dami nito.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Natural at kasalukuyang Tagalog na panawag-pansin ito na nagpapanatili sa mariing puwersa ng הִנֵּה.
- source_word: שְׂפָתַי
  choice: ang aking mga labi
  rationale: Pinananatili ang kongkretong larawang ποιetiko ng Hebreo sa halip na gawing “bibig” o tahasang “pananalita.”
- source_word: לֹא אֶכְלָא
  choice: hindi ko pinigil
  rationale: Ipinahahayag ng pandiwa rito ang hindi pagpipigil o hindi pagkakait sa pagsasalita, at natural itong itambal sa “mga labi” sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh, hindi pinapalitan ng titulong “PANGINOON.”
- source_word: יָדָעְתָּ
  choice: alam mo ito
  rationale: Ang anyong perfect ay natural na nagpapahayag dito ng kasalukuyang kaalaman; ang “ito” ay nilinaw bilang implicit na layon ngunit minarkahan sa talababa dahil wala itong tahasang katumbas sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng צֶדֶק
  choice: katuwiran
  alternative: katarungan
  rationale: Hindi nilulutas nang sapilitan ang tensiyon sa pagitan ng moral at hudisyal na diwa; ginagamit sa teksto ang mas malawak na tradisyonal na “katuwiran” at pinananatili sa talababa ang “katarungan.”
translation_notes:
  register: Makabago ngunit marangal na Tagalog, may payak na estrukturang patula. Ginamit ang “kapulungan” para sa pampubliko at panlahatang pagtitipon, at pinanatili ang larawan ng “mga labi.”
