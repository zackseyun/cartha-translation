  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: tl
  text: Mapalad[a] ang lalaking[b] naglagak ng kanyang tiwala kay Yahweh at hindi bumaling sa mga palalo[c] at sa mga lumilihis tungo sa kasinungalingan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maligaya.” Saklaw ng Hebreong אַשְׁרֵי ang kaligayahan at ang pagiging mapalad.
    reason: lexical_alternative
  - marker: b
    text: Panlalaking isahan ang salita sa Hebreo, ngunit maaari itong kumatawan sa sinumang may ganitong asal.
    reason: cultural_note
  - marker: c
    text: Maaari ring “mga mapagmataas.” Sa kontekstong ito, malamang na hindi ito ang pangalang pantanging Rahab.
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring “kabulaanan” o “panlilinlang.” Posible ring unawain ang hulíng mga salita bilang paglalarawan sa mga palalo: “sa mga palalong lumilihis tungo sa kasinungalingan.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ang Hebreong pormula ay nagpapahayag kapwa ng kaligayahan at ng kalagayang karapat-dapat hangaan dahil sa pagpapala. Likas at marangal sa Tagalog ang “Mapalad” at napapanatili nito ang himig ng karunungan sa awit.
- source_word: הַגֶּבֶר
  choice: ang lalaking
  rationale: Tumutukoy ang גֶּבֶר sa isang lalaking nasa hustong gulang. Isahan at panlalaki ang anyo sa Hebreo, bagaman may kinatawang bisa sa kasabihang pangkarunungan.
- source_word: שָׂם יְהוָה מִבְטַחוֹ
  choice: naglagak ng kanyang tiwala kay Yahweh
  rationale: Literal na inilalagay o ginagawa ng lalaki si Yahweh bilang kanyang pagtitiwala. Ang “naglagak ng kanyang tiwala kay Yahweh” ang natural na katumbas sa Tagalog at pinananatili ang natapos na kilos ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ang Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: פָנָה אֶל
  choice: bumaling sa
  rationale: Pinananatili ng “bumaling sa” ang larawan ng pagharap o paglapit sa isang tao upang doon umasa o kumampi.
- source_word: רְהָבִים
  choice: mga palalo
  rationale: Sa maramihang anyo at kontekstong ito, pinakamalamang na karaniwang pangngalan ito para sa mga taong mapagmataas o palalo, hindi ang pangalang pantanging Rahab.
- source_word: שָׂטֵי כָזָב
  choice: mga lumilihis tungo sa kasinungalingan
  rationale: Ang participle ay tumutukoy sa mga lumilihis o sumasala sa landas, at ang כָזָב ay kasinungalingan, kabulaanan, o panlilinlang. Hindi pinalalakas ang parirala tungo sa mas tiyak na teolohikal na katawagang gaya ng “mga tumalikod sa pananampalataya.”
theological_decisions:
- issue: Kinatawang panlalaking isahan sa kasabihang pangkarunungan
  choice: ang lalaking
  alternative: ang taong / ang sinumang
  rationale: Pinananatili ng pangunahing teksto ang panlalaking isahan ng גֶּבֶר, habang ipinapaliwanag sa talababa na maaari itong magkaroon ng pangkalahatang bisa.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalang personal ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Ugnayan ng “mga palalo” at “mga lumilihis tungo sa kasinungalingan”
  choice: dalawang pariralang pinag-ugnay ng “at”
  alternative: mga palalong lumilihis tungo sa kasinungalingan
  rationale: Maaaring basahin ang dalawang parirala bilang magkaugnay na mga tinutukoy o bilang ikalawang paglalarawan sa iisang pangkat. Pinananatili ng saling may “at” ang anyong koordinado ng Hebreo nang hindi ganap na isinasara ang ugnayan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “naglagak ng kanyang tiwala” ay pamilyar na pananalitang panrelihiyon ngunit malinaw pa rin sa karaniwang mambabasa; iniwasan ang mas mabigat o denominasyonal na mga katawagan.
