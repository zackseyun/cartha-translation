  source_fidelity: Ang draft ay wastong naghahatid sa pangkalahatan ng pagkubkob ng di-mabilang na masasamang pangyayari, pag-abot ng sariling pagkakasala, kawalang-kakayahang makakita, paghahambing sa buhok sa ulo, at panghihina ng puso. Gayunman, ang “sarili kong mga kasamaan” ay hindi sapat na malinaw na naiiba sa unang “kasamaan” at maaaring magmukhang mga kapahamakan kaysa sa moral na עֲוֹנֹת. Ang “kaya” ay mas malinaw na naghihinuha ng resulta kaysa sa simpleng pang-ugnay ng Hebreo.
  naturalness: Ang “di-mabilang na kasamaan” ay medyo hindi likas bilang pangmaramihang sakuna, at ang “pinabayaan na ako ng aking puso” ay sobrang literal at hindi karaniwang Filipino. Ang “napakaraming kapahamakan,” “mga kasalanan ko,” at “nanghina ang aking loob” ay mas natural habang pinananatili ang saklaw at talinghaga ng teksto.
  terminology: Ginawang “mga kasalanan ko” ang עֲוֹנֹתַי upang malinaw ang moral na pananagutan at hindi ito mapaghalo sa רָעוֹת na isinaling “mga kapahamakan.” Nililinaw ng talababa na maaari rin itong tumukoy sa pagkakasala/guilt at sa bigat nitong pananagutan. Ang “loob” ay likas na katumbas ng Hebreong “puso” sa idyoma ng pagkawala ng lakas o tapang; itinatala ng talababa ang literal na larawan.
  issues:
