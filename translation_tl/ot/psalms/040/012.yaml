  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: tl
  text: Sapagkat pinalibutan ako ng napakaraming kapahamakan[a]; inabutan ako ng mga kasalanan ko[b], at hindi ako makakita. Mas marami ang mga ito kaysa sa mga buhok sa aking ulo, at nanghina ang aking loob[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “napakaraming kapahamakan” ay maaari ring isaling “mga kasamaan na di-mabilang” o “napakaraming suliranin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kasalanan ko” ay maaari ring isaling “aking pagkakasala” o “aking pagkaguilty.” Maaaring saklawin ng salitang Hebreo ang maling gawa at ang bigat ng pananagutang dulot nito.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “iniwan ako ng aking puso.” Ipinahihiwatig nito na naubos ang lakas o loob ng nagsasalita.
    reason: idiom_clarification
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng pagsusumamo sa naunang konteksto.
- source_word: אָפְפוּ עָלַי
  choice: pinalibutan ako
  rationale: Pinananatili ang larawan ng taong kinukubkob sa lahat ng panig.
- source_word: רָעוֹת
  choice: mga kasamaan
  rationale: 'Malawak ang saklaw ng Hebreo: maaaring tumukoy sa masasamang bagay, kapahamakan, o mga suliranin; hindi ito makitid na nilutas sa isa lamang sa mga iyon.'
- source_word: עַד אֵין מִסְפָּר
  choice: di-mabilang
  rationale: Likas at maikli itong salin ng idyomang nagsasaad ng napakaraming hindi kayang bilangin.
- source_word: הִשִּׂיגוּנִי
  choice: inabutan ako
  rationale: Pinananatili ang larawan ng paghabol at pag-abot nang hindi ipinapalagay na simpleng pagdaig lamang.
- source_word: עֲוֹנֹתַי
  choice: sarili kong mga kasamaan
  rationale: Ipinahahayag ang personal na pananagutan, samantalang kinikilala sa talababa na maaaring saklawin ng עָוֹן ang kasalanan at bigat ng pagkakasala.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: kaya hindi na ako makakita
  rationale: Natural sa Filipino at ipinakikita ang kaugnayan nito sa pagkapuspos ng mga kasamaan; hindi tinutukoy kung literal o matalinghaga ang hindi pagkakita.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Higit pa ang mga ito kaysa sa mga buhok sa aking ulo
  rationale: Malinaw na naihahatid ang paghahambing sa dami na nasa Hebreo.
- source_word: לִבִּי עֲזָבָנִי
  choice: pinabayaan na ako ng aking puso
  rationale: Pinananatili ang kapansin-pansing literal na metapora at ang maaaring saklaw nitong pagkawala ng lakas, loob, o katatagan.
theological_decisions:
- issue: Kung ang עֲוֹנֹתַי ay tumutukoy sa sariling mga kasalanan ng salmista, sa kanyang pagkakasala, o sa mga bunga nito
  choice: sarili kong mga kasamaan
  alternative: aking mga kasalanan; aking pagkakasala; mga bunga ng aking mga kasalanan
  rationale: Pinakanatural na tumutukoy ang anyong may unang panauhang panaguri sa moral na kasamaan ng nagsasalita. Gayunman, hindi lubusang pinaghihiwalay ng salitang Hebreo ang maling gawa at ang bigat o pananagutang kalakip nito, kaya pinananatili sa talababa ang saklaw na iyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mga larawang “pinalibutan,” “inabutan,” mga buhok sa ulo, at pusong nagpabaya, habang inilagay sa mga talababa ang mahahalagang alternatibong kahulugan.
