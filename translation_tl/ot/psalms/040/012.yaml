revisions:
- from: Sapagkat pinalibutan ako ng di-mabilang na kasamaan[a]; inabutan ako ng sarili kong mga kasamaan[b], kaya hindi na ako makakita. Higit pa ang mga ito kaysa sa mga buhok sa aking ulo, at pinabayaan na ako ng aking puso[c].
  to: Sapagkat pinalibutan ako ng napakaraming kapahamakan[a]; inabutan ako ng mga kasalanan ko[b], at hindi ako makakita. Mas marami ang mga ito kaysa sa mga buhok sa aking ulo, at nanghina ang aking loob[c].
  rationale: Pinag-iba ang salin ng רָעוֹת at עֲוֹנֹתַי upang mapanatili ang mahalagang paglipat mula sa mga panlabas na kapahamakan tungo sa sariling moral na pagkakasala. Pinalitan ang labis na pangsanhing “kaya” ng “at,” at isinalin ang idyoma tungkol sa puso sa likas na modernong Filipino, na may literal na anyo sa talababa. Pinanatili ang hindi tinutukoy na dahilan ng kawalang-kakayahang makakita at ang “mga ito,” na maaaring tumukoy sa mga kasalanang kalalabing binanggit.
