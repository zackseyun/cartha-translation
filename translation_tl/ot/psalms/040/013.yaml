  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: tl
  text: Loobin mong[a] iligtas ako, Yahweh; Yahweh, magmadali kang[b] tulungan ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Malugod mong iligtas ako” o “Maging handa kang iligtas ako.”
    reason: lexical_alternative
  - marker: b
    text: O “kumilos ka agad upang tulungan ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: Loobin mo
  rationale: Ang pautos na anyo ng רצה ay humihiling ng kusang pagsang-ayon o mabuting kalooban ni Yahweh. Likas sa makabagong Tagalog ang “Loobin mo” at hindi nito ipinahihiwatig na nasisiyahan ang Diyos sa panganib ng nananalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לְהַצִּילֵנִי
  choice: na iligtas ako
  rationale: Ang Hiphil infinitive ng נצל na may hulaping unang panauhan ay nangangahulugang sagipin o iligtas mula sa panganib. Ang “iligtas ako” ay malinaw, natural, at angkop sa panalangin.
- source_word: לְעֶזְרָתִי
  choice: na tulungan ako
  rationale: Bagaman literal na “para sa tulong sa akin,” ang pandiwang “tulungan ako” ang natural na katumbas sa Tagalog at pinananatili ang diwa ng hinihinging saklolo.
- source_word: חוּשָׁה
  choice: magmadali ka
  rationale: Ang pautos na anyo ng חושׁ ay nagpapahayag ng agarang pagkilos. Tuwiran at makabago ang “magmadali ka,” habang pinananatili ang matinding pangangailangan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Dalawang ulit na tuwirang ginagamit ng Hebreong talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugang רְצֵה
  choice: Loobin mo
  alternative: Malugod kang; Maging handa kang
  rationale: Pinananatili ng “Loobin mo” ang pakiusap para sa mabuting kalooban at kusang pagsang-ayon ng Diyos nang hindi ipinapakahulugang nalulugod siya sa pagdurusa ng nagsasalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang dalawang pagtawag kay Yahweh at ang agarang tono ng panalangin; iniwasan ang masyadong makalumang “magmadali ka sa aking saklolo.”
