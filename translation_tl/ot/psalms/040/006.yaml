id: PSA.40.6
reference: Psalms 40:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: tl
  text: 'Hain at handog[b] ay hindi mo kinalugdan;

    mga tainga’y hinukay mo para sa akin[a];

    handog na sinusunog at handog para sa kasalanan

    ay hindi mo hiningi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga tainga’y hinukay mo para sa akin,” na malamang ay isang idyoma para sa pagbibigay ng kakayahang makinig o sumunod; ihambing ang “binuksan mo ang aking mga tainga.” Sa Septuagint, na sinundan sa Hebreo 10:5, mababasa ang “isang katawan ang inihanda mo para sa akin.”
    reason: alternative_reading
  - marker: b
    text: O mas tiyak, “handog na butil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: hain
  rationale: Likas at karaniwang salitang Filipino para sa handog na hayop sa kontekstong pansamba.
- source_word: מִנְחָה
  choice: handog
  rationale: Pinananatili ang malawak na kahulugan sa pangunahing teksto, habang inilalagay sa talababa ang mas tiyak na posibilidad na handog na butil.
- source_word: חָפַצְתָּ
  choice: kinalugdan
  rationale: Ipinahahayag ang pagkagusto o pagkalugod nang hindi pinalalakas ang diwa nang higit sa Hebreo.
- source_word: אָזְנַיִם
  choice: mga tainga
  rationale: Tuwirang salin ng pangngalang dalawahan at pinananatili ang kongkretong larawan ng Hebreo.
- source_word: כָּרִיתָ לִּי
  choice: hinukay mo para sa akin
  rationale: Pinananatili ang literal at kapansin-pansing larawan ng pandiwang כרה, samantalang ipinaliliwanag sa talababa ang malamang na idyomatikong diwa.
- source_word: עוֹלָה
  choice: handog na sinusunog
  rationale: Malinaw at tumpak na katawagan sa haing lubusang sinusunog.
- source_word: חֲטָאָה
  choice: handog para sa kasalanan
  rationale: Ipinakikita ng paralelismong pansakripisyo na isang uri ng handog ang tinutukoy, hindi ang abstraktong kasalanan.
- source_word: שָׁאָלְתָּ
  choice: hiningi
  rationale: Natural na Filipino para sa tuwirang diwa ng 'humingi,' nang hindi gumagamit ng mas mapagpasyang 'hiningi bilang kahilingan' o 'iniutos.'
theological_decisions:
- issue: Ugnayan ng Hebreong “mga tainga’y hinukay mo para sa akin” sa anyong Griyego na sinipi sa Hebreo 10:5
  choice: 'Panatilihin sa pangunahing teksto ang larawan ng Hebreo: “mga tainga’y hinukay mo para sa akin.”'
  alternative: “binuksan mo ang aking mga tainga” o “isang katawan ang inihanda mo para sa akin”
  rationale: Inuuna ng salin ang tekstong Hebreo ng Awit at hindi ito ipinapantay nang tahimik sa Septuagint o sa sipi sa Hebreo. Gayunman, itinatala sa talababa ang idyomatikong pakahulugan at ang mahalagang alternatibong tradisyong Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maikli at maindayog na mga parirala upang mapanatili ang paralelismo ng tula. Sadyang pinanatili ang di-pangkaraniwang larawang “hinukay” dahil mahalaga ito sa Hebreo, at nilinaw ang posibleng idyomatikong diwa sa talababa.
