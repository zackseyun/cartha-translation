id: PSA.40.3
reference: Psalms 40:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: tl
  text: Naglagay siya sa aking bibig ng isang bagong awit, isang awit ng papuri sa ating Diyos. Marami ang makakakita at matatakot[a], at magtitiwala kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring magpahiwatig ng pagpipitagan o pagkamangha, bukod sa takot.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; karaniwang binibigkas na “Yahweh.”'
    reason: source_clarification
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Naglagay siya
  rationale: Bagaman karaniwang nangangahulugang “nagbigay” ang נתן, ang “naglagay” ang likas na salin sa idyomang may “sa aking bibig” at pinananatili nito ang kongkretong larawan ng Hebreo.
- source_word: בְּפִי
  choice: sa aking bibig
  rationale: Tuwirang pinananatili ang masiglang larawang pangkatawan ng tekstong Hebreo.
- source_word: שִׁיר חָדָשׁ
  choice: isang bagong awit
  rationale: Malinaw at likas na salin; tuwirang inilalarawan ng “bago” ang “awit.”
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: isang awit ng papuri sa ating Diyos
  rationale: Ang parirala ay appositional sa “bagong awit.” Ginagawang malinaw at natural sa Filipino ang uri o nilalaman ng awit nang hindi binabago ang diwa.
- source_word: יִרְאוּ רַבִּים
  choice: Marami ang makakakita
  rationale: 'Ang imperpektibo ay angkop na nagpapahayag ng magiging bunga: masasaksihan ng marami ang ginawa ng Diyos na nahahayag sa awit ng salmista.'
- source_word: וְיִירָאוּ
  choice: at matatakot
  rationale: Pinananatili ng “matatakot” ang bigat at tunay na lawak ng ירא, na maaaring tumukoy sa takot, pagpipitagan, o paghanga.
- source_word: וְיִבְטְחוּ
  choice: at magtitiwala
  rationale: Likas na katumbas ng בטח at malinaw na kasunod na tugon matapos makakita at matakot.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pangalang “Yahweh” para sa יהוה; likas sa Filipino ang “magtiwala kay” kapag isang persona ang tinutukoy.
theological_decisions:
- issue: Saklaw ng kahulugan ng וְיִירָאוּ
  choice: matatakot
  alternative: mamamangha nang may pagpipitagan / magpipitagan
  rationale: Hindi pinalalambot ang salita tungo lamang sa paghanga o pagpipitagan. Pinananatili ng “matatakot” ang teolohikal na tensiyon, habang nililinaw sa talababa ang mas malawak na saklaw nito.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa talata; pinananatili itong pangalan sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong larawang “sa aking bibig,” ang appositional na ugnayan ng bagong awit at papuri, at ang tensiyon sa pagitan ng takot at pagpipitagan.
