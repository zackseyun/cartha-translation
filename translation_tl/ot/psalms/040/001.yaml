base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: tl
  text: Buong tiyaga akong naghintay kay Yahweh[a]; bumaling siya sa akin at dininig ang paghingi ko ng tulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Sa paghihintay ay naghintay ako kay Yahweh,” isang mariing pahayag na maaari ring mangahulugang “matiyaga akong naghintay” o “buong pananabik akong naghintay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: Buong tiyaga akong naghintay
  rationale: Ang infinitive absolute na kasunod ng pandiwang may iisang ugat ay nagbibigay-diin sa patuloy at taimtim na paghihintay. Likas sa modernong Tagalog ang “buong tiyaga akong naghintay,” habang ipinapaliwanag sa talababa ang anyong Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּט אֵלַי
  choice: bumaling siya sa akin
  rationale: Ang נטה kasama ng אֵלַי ay nagsasaad ng pagkiling o pagbaling patungo sa nagsasalita. Malinaw at natural sa Tagalog ang “bumaling siya sa akin.”
- source_word: וַיִּשְׁמַע
  choice: dininig
  rationale: Sa konteksto ng panalangin, ipinahihiwatig ng שׁמע ang pakikinig sa pakiusap. Ang “dininig” ay marangal at karaniwang gamit sa Tagalog para sa pagtugon ng Diyos sa daing.
- source_word: שַׁוְעָתִי
  choice: ang paghingi ko ng tulong
  rationale: Ang שַׁוְעָה ay hindi lamang sigaw kundi daing o paghingi ng saklolo. Tuwirang ipinahahayag ng salin ang layunin ng sigaw.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang diin ng Hebreo sa pamamagitan ng “buong tiyaga,” at ginamit ang “dininig” bilang pamilyar na pananalitang angkop sa panalangin.
