translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikling anyong patula at ang mapanuyang pag-uulit ng interjection. Ang “masindak” ay sadyang hindi lubos na nag-aalis sa semantikong tensiyon sa pagitan ng matinding pagkagulat at kapahamakang ipinahihiwatig ng Hebreo.
