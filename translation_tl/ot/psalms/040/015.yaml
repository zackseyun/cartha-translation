translation:
  language: tl
  text: 'Mangilabot[a] dahil sa[b] kanilang kahihiyan

    ang mga nagsasabi sa akin, “Aha! Aha!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mawasak” o “matulala”; ang pandiwang Hebreo ay maaaring tumukoy sa pagkatiwangwang/pagkasira o sa natitigilang panghihilakbot.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “sa ibabaw ng sakong ng kanilang kahihiyan”; isang idyomang nagpapahiwatig ng sanhi o bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: Masindak
  rationale: Ang Qal imperfect ng שׁמם ay maaaring tumukoy sa pagkawasak o sa matinding pagkagulat. Ang “masindak” ay likas sa modernong Tagalog at nagpapanatili sa diwa ng nakagigimbal na kahihinatnan nang hindi labis na nililinaw kung pagkagulat o pagkawasak ang nangingibabaw.
- source_word: עַל עֵקֶב
  choice: dahil sa
  rationale: Bagaman literal na may larawan ng “sa ibabaw/kasunod ng sakong,” gumaganap itong pariralang sanhi o bunga sa konteksto. Ang “dahil sa” ang pinakanatural at malinaw na katumbas sa Tagalog.
- source_word: בָּשְׁתָּם
  choice: sarili nilang kahihiyan
  rationale: Tuwirang ipinapahayag ng salita ang kahihiyan o pagkadusta nila. Idinagdag ang “sarili” upang maging malinaw at natural sa Tagalog ang panghalip na hulapi nang hindi binabago ang diwa.
- source_word: הָאֹמְרִים לִי
  choice: ang mga nagsasabi sa akin
  rationale: 'Ang artikulo at participle ay substantibo: “ang mga nagsasabi.” Ito ang tuwiran at likas na anyo sa Tagalog.'
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Isang sambit ng mapanlibak at masamang pagkatuwa. Pinananatili ng “Aha! Aha!” ang inuulit na panunuya at madaling maunawaan sa modernong Tagalog.
