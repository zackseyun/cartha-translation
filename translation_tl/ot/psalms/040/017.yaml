  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: tl
  text: Ngunit ako'y dukha at nangangailangan; iniisip ako ng Panginoon.[a] Ikaw ang aking tulong at tagapagligtas; Diyos ko, huwag kang magtagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinasaalang-alang ako ng Panginoon” o “iisipin ako ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako'y
  rationale: Ipinahihiwatig ng pangatnig at hayag na panghalip ang pagsalungat sa naunang konteksto; natural itong naipapahayag sa Tagalog sa pamamagitan ng “Ngunit ako'y.”
- source_word: עָנִי וְאֶבְיוֹן
  choice: dukha at nangangailangan
  rationale: Pinananatili ang magkaugnay ngunit hindi lubos na magkaparehong diwa ng pagiging mababa o salat at ng pagkakaroon ng matinding pangangailangan.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang banal na titulong Adonai, hindi ang pangalang YHWH; “Panginoon” ang natural at marangal na katumbas sa Tagalog.
- source_word: יַחֲשָׁב לִי
  choice: iniisip ako
  rationale: Maaaring tumukoy ang parirala sa pag-iisip, pagsasaalang-alang, o pagmamalasakit sa nagsasalita. Pinananatili ng “iniisip ako” ang payak at personal na diwa nang hindi nagdaragdag ng ideya ng tiyak na pagpaplano.
- source_word: עֶזְרָתִי
  choice: aking tulong
  rationale: Ang pangngalan ay tumutukoy sa tulong o saklolo, hindi kinakailangang sa katawagang “katulong”; pinananatili rin nito ang maikling paralelismong patula.
- source_word: וּמְפַלְטִי
  choice: at tagapagligtas
  rationale: Ang anyong participle mula sa פלט ay tumutukoy sa isang nagliligtas o naghahatid sa kaligtasan; malinaw at marangal ang “tagapagligtas.”
- source_word: אֱלֹהַי אַל תְּאַחַר
  choice: Diyos ko, huwag kang magtagal
  rationale: Pinananatili ang tuwirang panawagan at ang apurahang kahilingang kumilos agad; likas sa modernong Tagalog ang “huwag kang magtagal.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: aking Panginoon
  rationale: Ang teksto ay gumagamit ng Adonai bilang banal na titulo at hindi ng YHWH. Hindi idinaragdag ang “aking” sapagkat wala rito ang hulaping paari.
- issue: Diwa at panahon ng יַחֲשָׁב לִי
  choice: iniisip ako ng Panginoon
  alternative: isinasaalang-alang ako ng Panginoon; iisipin ako ng Panginoon
  rationale: Ang di-ganap na pandiwang Hebreo ay maaaring unawain bilang kasalukuyan o hinaharap, at maaari ring magpahiwatig ng malasakit o pagsasaalang-alang. Ang pangunahing salin ay nagpapanatili ng personal na diwa, samantalang inilalahad sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ako'y” para sa maikli at patulang daloy; iniwasan ang mas sinaunang “maralita” at “magluwat.” Ang panandang [a] ay inilagay kaagad pagkatapos ng sugnay na tinutukoy nito.
