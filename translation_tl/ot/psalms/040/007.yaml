  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: tl
  text: Nang magkagayon ay sinabi ko, “Narito, dumating ako; sa balumbon ng aklat ay nakasulat tungkol sa akin[a].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa akin” o “itinakda para sa akin.” Maaaring tumukoy ang pariralang Hebreo sa nakasulat tungkol sa nagsasalita o sa itinakda para sa kaniya.
    reason: alternative_reading
  - marker: b
    text: Sinipi sa Hebreo 10:7 kaugnay ng Mesiyas.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: Nang magkagayon
  rationale: Ipinahahayag ang sunod na tugon ng nagsasalita kaugnay ng naunang konteksto; natural ito sa makabagong Filipino at angkop sa marangal na panulaan.
- source_word: אָמַרְתִּי
  choice: sinabi ko
  rationale: Payak at tuwirang katumbas ng unang panauhang ganap na anyo ng אמר, na nagpapakilala sa kasunod na tuwirang pananalita.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pansin at diin ng deiktikong kataga nang hindi nagiging labis na kolokyal.
- source_word: בָאתִי
  choice: dumating ako
  rationale: Ipinapahayag ang pagdating o paghaharap ng sarili ng nagsasalita; natural ang anyong naganap sa Filipino habang nananatili ang kasalukuyang bunga ng pagdating.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: sa balumbon ng aklat
  rationale: Pinananatili ang kongkretong larawan ng isang nakarolyong kasulatang dokumento sa halip na gawing simpleng ‘aklat’ lamang.
- source_word: כָּתוּב
  choice: ay nakasulat
  rationale: Malinaw na ipinahahayag ang pasibong kalagayan ng participle sa likas na ayos ng Filipino.
- source_word: עָלָי
  choice: tungkol sa akin
  rationale: Ito ang pinakadirektang kahulugan sa konteksto ng nilalaman ng isang balumbon, ngunit hindi nito ikinakaila ang posibleng diwang ‘para sa akin’ o ‘itinakda para sa akin,’ na inilagay sa talababa.
theological_decisions:
- issue: Kahulugan ng עָלָי sa talatang sinipi kalaunan sa Hebreo 10
  choice: tungkol sa akin
  alternative: para sa akin; itinakda para sa akin
  rationale: Pinananatili ng pangunahing teksto ang tuwirang diwa ng nakasulat hinggil sa nagsasalita, samantalang kinikilala sa talababa ang lehitimong kahulugang maaaring tumukoy sa iniatas o itinakda para sa kaniya. Hindi ipinapasok sa salin mismo ang kalaunang kristolohikal na paggamit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “balumbon” upang mapanatili ang sinaunang larawan ng scroll, at ang “Narito” upang maipahayag ang mariing paghaharap ng sarili nang hindi nagiging lipas o kolokyal.
