  source_fidelity: Tumpak na naipapahayag ang sunod na pahayag (אָז אָמַרְתִּי), ang mariing “Narito” (הִנֵּה), ang pagdating ng nagsasalita, ang larawan ng balumbon, at ang pangunahing diwa ng כָּתוּב עָלָי bilang “nakasulat tungkol sa akin.” Hindi nito ipinapasok sa pangunahing teksto ang kalaunang pagbasa sa Hebreo 10.
  naturalness: Marangal ngunit malinaw ang modernong Filipino. Ang “Nang magkagayon,” “Narito,” at “balumbon ng aklat” ay angkop sa matulaing rehistro ng Mga Awit; ang ayos ng pangungusap ay likas at madaling unawain.
  terminology: Ang “balumbon ng aklat” ay maingat na nagpapanatili sa larawang-scroll ng מְגִלַּת סֵפֶר. Ang “tungkol sa akin” ay ang pinakadirektang salin ng עָלָי sa kontekstong ito, at wastong pinangangalagaan ng talababa ang posibleng “para sa akin/itinakda para sa akin.” Ang “Mesiyas” sa talababa ay angkop at hindi nagpapataw ng interpretasyon sa teksto.
