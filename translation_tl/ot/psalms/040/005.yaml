base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: tl
  text: Napakarami ng ginawa mo, Yahweh, aking Diyos—ang mga kamangha-manghang gawa mo at ang mga balak mo para sa amin.[a] Walang maihahambing sa iyo. Kung ipahahayag ko at isasalaysay ang mga iyon, napakarami ng mga iyon para isa-isahin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga iniisip mo tungkol sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: Napakarami ng ginawa mo
  rationale: Ipinahahayag ng רַבּוֹת ang kasaganaan o dami ng mga ginawa ng Diyos; natural sa Tagalog ang paglalagay ng ipinahiwatig na bagay sa pariralang “ng ginawa mo.”
- source_word: יְהוָה אֱלֹהַי
  choice: Yahweh na aking Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tuwirang kaugnayang ipinahahayag ng “aking Diyos.”
- source_word: נִפְלְאֹתֶיךָ
  choice: ang mga kamangha-mangha mong gawa
  rationale: Ang pangngalan ay tumutukoy sa mga kahanga-hangang pagkilos ng Diyos; nilinaw ng “mga ... gawa” ang diwa sa natural na Tagalog.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: at ang mga balak mo para sa amin
  rationale: Maaaring mangahulugan ang מַחְשְׁבוֹת ng mga kaisipan, balak, o layunin. Ipinahahayag ng “mga balak” ang sadyang intensiyon nang hindi nagdaragdag ng sistematikong doktrina; nasa talababa ang mas literal na alternatibo.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Walang maihahambing sa iyo
  rationale: Natural na idyomang Tagalog para sa kawalan ng sinumang o anumang kapantay ng Diyos.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Kung ipahahayag ko at isasalaysay ang mga iyon
  rationale: Binabasa ang mga cohortative bilang protasis na humahantong sa pahayag na hindi kayang isa-isahin ang napakaraming gawa at balak.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: napakarami ng mga iyon para isa-isahin
  rationale: Sa konteksto, ang עָצְמוּ ay tumutukoy sa pagdami at ang מִסַּפֵּר sa pagiging lampas sa kayang bilangin o isalaysay nang paisa-isa.
theological_decisions:
- issue: Kahulugan ng mga מַחְשְׁבוֹת ng Diyos para sa bayan
  choice: mga balak mo para sa amin
  alternative: mga iniisip mo tungkol sa amin
  rationale: Pinananatili ng salin ang diwa ng sinadyang layunin ng Diyos, ngunit hindi nito ipinapasok ang isang tiyak na sistemang teolohikal tungkol sa probidensiya o predestinasyon.
- issue: Saklaw ng paghahambing sa אֵין עֲרֹךְ אֵלֶיךָ
  choice: Walang maihahambing sa iyo
  alternative: Walang maihahanay sa iyo
  rationale: Pinananatili ang pahayag ng walang kapantay na kalagayan ng Diyos nang hindi nililimitahan ang paghahambing sa mga gawa lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Yahweh” bilang transliterasyon ng banal na pangalan; pinanatili ang kondisyunal na daloy ng huling pangungusap at ang leksikal na posibilidad ng “mga iniisip” sa talababa.
