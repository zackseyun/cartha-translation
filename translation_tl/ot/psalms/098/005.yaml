  naturalness: Ang “Umawit kayo ng papuri kay Yahweh” ay malinaw at marangal sa makabagong Filipino. Ang “sa saliw ng lira” ay natural na paraan upang ipahayag ang kasamang instrumento. Bahagyang matalinghaga ngunit nauunawaan ang “tunog ng awit,” at ang ganitong pagkapit sa imahe ng Hebreo ay angkop sa tula.
