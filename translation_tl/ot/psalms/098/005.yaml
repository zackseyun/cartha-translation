  text: זַמְּר֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ֝/כִנּ֗וֹר וְ/ק֣וֹל זִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/005.yaml
  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: tl
  text: Umawit kayo ng papuri kay Yahweh sa saliw ng lira[a], sa saliw ng lira at ng tunog ng awit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo kinnor, isang sinaunang instrumentong de-kuwerdas; ayon sa tradisyon, “alpa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at ng tinig ng himig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Umawit kayo ng papuri
  rationale: Ang Piel na pautos na maramihan ng זמר ay panawagan sa sama-samang musikal na pagpupuri. Likas sa modernong Tagalog ang “umawit ng papuri” at pinananatili nito ang diwa ng pag-awit at pagpupuri.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay tumutukoy sa pinag-uukulan ng papuri, at ang pangalang יהוה ay isinalin bilang “Yahweh” upang mapanatili ang personal na banal na pangalan sa tekstong Hebreo.
- source_word: בְּכִנּוֹר
  choice: sa saliw ng lira
  rationale: Ang כִּנּוֹר ay isang sinaunang instrumentong de-kuwerdas na karaniwang tinatawag na “lyre.” Mas natural sa Tagalog ang “sa saliw ng lira” kaysa literal na “gamit ang lira” sa konteksto ng pag-awit.
- source_word: בְּכִנּוֹר
  choice: sa saliw ng lira
  rationale: Pinanatili ang pag-uulit upang maipakita ang paralelismo at maindayog na pagdidiin ng tekstong Hebreo.
- source_word: וְקוֹל זִמְרָה
  choice: at ng tunog ng awit
  rationale: Ang קוֹל ay “tunog” o “tinig,” at ang זִמְרָה ay “awit,” “himig,” o “musika.” Pinananatili ng “tunog ng awit” ang kongkretong larawang pandinig at ang ugnayan ng dalawang salita nang hindi nagiging labis na literal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton na יהוה. Ang “Yahweh” ay nagpapanatili sa banal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa saliw ng” bilang natural na pagpapahayag ng instrumental na ב, habang pinanatili ang pag-uulit at ang bahagyang di-karaniwang larawang “tunog ng awit” mula sa Hebreo.
