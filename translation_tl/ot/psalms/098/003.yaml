id: PSA.98.3
reference: Psalms 98:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: tl
  text: Inalala niya ang kanyang tapat na pag-ibig at katapatan sa sambahayan ng Israel; nakita ng lahat ng dulo ng daigdig ang pagliligtas ng ating Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pagliligtas na ginawa ng ating Diyos”; sa konteksto ng awit, maaari ring magpahiwatig ang salitang Hebreo ng matagumpay na pagkilos upang magligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: Inalala niya
  rationale: Ang Qal perfect ay nagsasaad ng ganap na kilos. Pinananatili ng “inalala” ang payak na diwa ng pag-alaala, na sa konteksto ay nahahayag sa pagkilos ng Diyos ayon sa kanyang pangako.
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Ipinahahayag ng חֶסֶד ang matibay at mapagkakatiwalaang pag-ibig, na may kaugnayan sa tipan; malinaw at likas sa makabagong Filipino ang “tapat na pag-ibig.”
- source_word: וֶאֱמוּנָתוֹ
  choice: at katapatan
  rationale: Sa pagkakatambal nito sa חֶסֶד, ang אֱמוּנָה ay tumutukoy sa pagiging maaasahan at tapat ng Diyos, hindi lamang sa abstraktong katotohanan.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: sa sambahayan ng Israel
  rationale: Pinananatili ng “sambahayan ng Israel” ang kolektibo at pampamilyang larawan ng בֵּית, samantalang hinahayaan ng “sa” na manatili ang bahagyang lawak ng gamit ng לְ bilang kaugnayan o pagtutok.
- source_word: רָאוּ
  choice: nakita
  rationale: 'Ang Qal perfect ay likas na isinasalin sa aspektong naganap sa Filipino: ang buong daigdig ay naging saksi sa naganap na pagliligtas.'
- source_word: כָל אַפְסֵי אָרֶץ
  choice: lahat ng dulo ng daigdig
  rationale: Isa itong Hebreong idyoma para sa pinakamalalayong bahagi ng mundo. Ang “mga dulo ng daigdig” ay pamilyar, marangal, at hindi labis na nagpapaliwanag.
- source_word: אֵת
  choice: '[pananda ng tuwirang layon; hindi isinalin]'
  rationale: Walang hiwalay na katumbas sa Filipino ang Hebreong pananda ng tiyak na tuwirang layon; ipinakikita ang tungkulin nito sa ayos ng pangungusap.
- source_word: יְשׁוּעַת
  choice: ang pagliligtas
  rationale: Saklaw ng יְשׁוּעָה ang pagliligtas at kaligtasan, at maaari rin itong magkaroon ng himig ng tagumpay. Mas malinaw na tumutukoy sa ginawang pagliligtas ng Diyos ang anyong “pagliligtas” sa talatang ito.
- source_word: אֱלֹהֵינוּ
  choice: ng ating Diyos
  rationale: Pinananatili nito ang construct chain na “pagliligtas ng ating Diyos” nang hindi ipinapasya kung ang genitive ay pangunahing pagmamay-ari o pagkilos ng Diyos.
theological_decisions:
- issue: Ang tipanang himig ng חֶסֶד at אֱמוּנָה
  choice: “tapat na pag-ibig” at “katapatan”
  alternative: “awa” at “katotohanan”
  rationale: Pinananatili ng piniling tambalan ang matibay at mapagkakatiwalaang pakikitungo ng Diyos sa Israel nang hindi nililimitahan ang חֶסֶד sa habag lamang o ang אֱמוּנָה sa abstraktong katotohanan.
- issue: Lawak ng kahulugan ng יְשׁוּעַת אֱלֹהֵינוּ
  choice: “ang pagliligtas ng ating Diyos”
  alternative: “ang tagumpay ng ating Diyos” o “ang kaligtasang mula sa ating Diyos”
  rationale: Maaaring magtaglay ng matagumpay na himig ang Hebreo, ngunit hindi nito hinihinging limitahan ang kahulugan sa tagumpay sa digmaan. Pinananatili rin ng “ng ating Diyos” ang ugnayang gramatikal nang hindi labis na tinutukoy kung ito ay pag-aari o pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo at malawak na saklaw ng mga salitang teolohikal, habang iniwasan ang arkaikong pananalita at ang paglalagay ng denominasyonal na pagpapakahulugan.
