  text: 'Umugong nawa ang dagat at ang lahat ng laman nito,

    ang daigdig at ang mga naninirahan dito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: Umugong
  rationale: Ang pandiwang רעם ay tumutukoy sa malakas at dumadagundong na tunog. Ang anyong pautos na “Umugong” ay likas sa tulang papuri at naipapahayag ang volitional na gamit ng imperfect.
- source_word: הַיָּם
  choice: ang dagat
  rationale: Karaniwan at tuwirang katumbas ng יָם, at angkop sa marangal na panulaan.
- source_word: וּמְלֹאוֹ
  choice: at ang lahat ng naroon
  rationale: Literal itong “at ang kapuspusan nito,” na ang tinutukoy ay lahat ng nasa dagat. Mas natural sa modernong Tagalog ang “lahat ng naroon” habang pinananatili ang kahulugan.
- source_word: תֵּבֵל
  choice: ang daigdig
  rationale: Ang תֵּבֵל ay tumutukoy sa maayos at pinaninirahang mundo. Ang “daigdig” ay maikli, dignified, at malinaw sa konteksto.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: at ang mga naninirahan dito
  rationale: Pinananatili ng “mga naninirahan” ang verbal na diwa ng participle na “mga tumatahan,” samantalang natural ang “dito” bilang pagtukoy sa daigdig na kababanggit lamang.
