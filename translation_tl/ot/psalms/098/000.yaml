base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: tl
  text: 'Isang salmo.


    Umawit kayo kay Yahweh ng bagong awit,

    sapagkat gumawa siya ng mga kamangha-manghang bagay;

    ang kanyang kanang kamay at banal na bisig

    ang naghatid sa kanya ng kaligtasan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nagligtas sa kanya” o “nagkamit ng tagumpay para sa kanya.” Ipinahihiwatig ng Hebreong pahayag na ang sariling kapangyarihan ni Yahweh ang nagsakatuparan ng pagliligtas o tagumpay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Tuwirang salin ng pamagat na tumutukoy sa isang awiting panrelihiyon na sinasaliwan ng musika.
- source_word: שִׁיר חָדָשׁ
  choice: bagong awit
  rationale: Pinananatili ang payak at matulaing parirala ng Hebreo.
- source_word: נִפְלָאוֹת
  choice: mga kamangha-manghang bagay
  rationale: Saklaw nito ang pambihira at makapangyarihang mga gawa nang hindi nililimitahan ang salita sa teknikal na diwa ng ‘mga himala.’
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: kanyang kanang kamay at banal na bisig
  rationale: Pinananatili ang magkatugmang larawang patula para sa sariling kapangyarihan ng Diyos.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: naghatid sa kanya ng kaligtasan
  rationale: Inilalapit sa anyong Hebreo na nagsasabing ang sariling kapangyarihan ni Yahweh ang nagsakatuparan ng pagliligtas para sa kanya, habang iniiwasang bawasan ito sa ‘tagumpay’ lamang.
theological_decisions:
- issue: Ang Diyos ang tumatanggap ng ‘kaligtasan’ na isinakatuparan ng sarili niyang kamay at bisig
  choice: naghatid sa kanya ng kaligtasan
  alternative: nagkamit ng tagumpay para sa kanya / nagligtas sa kanya
  rationale: Sadyang pinananatili ang di-pangkaraniwang pahayag at teolohikal na tensiyon ng Hebreo sa halip na ipakahulugan agad bilang tagumpay lamang o ipahiwatig na may ibang nagligtas kay Yahweh.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalan ayon sa tekstong Hebreo at sa audited consultation layer, nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang parallelism at mga larawan ng tulang Hebreo, at inilagay ang talababa sa mismong pariralang tinatalakay nito.
