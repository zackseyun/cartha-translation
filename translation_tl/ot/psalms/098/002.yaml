id: PSA.98.2
reference: Psalms 98:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: tl
  text: Ipinaalam ni Yahweh ang kanyang pagliligtas; sa harap ng mga mata ng mga bansa[a] ay inihayag niya ang kanyang katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa paningin ng mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang katarungan.” Maaaring tumukoy ang salitang Hebreo sa katuwiran, katarungan, o sa pagiging nasa tama na pinatutunayan ng kanyang pagkilos, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הוֹדִיעַ
  choice: ipinaalam
  rationale: Likas na katumbas sa modernong Tagalog ng Hiphil na nangangahulugang ‘ginawang malaman’ o ‘ipinaalam.’
- source_word: יְשׁוּעָתוֹ
  choice: ang kanyang pagliligtas
  rationale: Sinasaklaw ng ‘pagliligtas’ ang kongkretong gawa ng pagpapalaya; maaari ring magpahiwatig ang Hebreo ng kaligtasan o tagumpay.
- source_word: לְעֵינֵי
  choice: sa harap ng mga mata ng
  rationale: Pinananatili ang matingkad na idyomang Hebreo, habang ibinibigay sa talababa ang mas karaniwang alternatibo.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy sa mga bansang nakasaksi sa ginawa ni Yahweh; mas angkop dito kaysa ‘mga Hentil.’
- source_word: גִּלָּה
  choice: inihayag
  rationale: Natural at marangal na katumbas ng Piel na ‘ibunyag’ o ‘ilantad,’ at kaagapay ng ‘ipinaalam.’
- source_word: צִדְקָתוֹ
  choice: ang kanyang katuwiran
  rationale: Pinananatili ang malawak na diwa ng צְדָקָה—matuwid na pagkilos, katarungan, at pagiging nasa tama—nang hindi ito nililimitahan sa isang aspekto lamang.
theological_decisions:
- issue: Paglalarawan sa banal na צְדָקָה sa konteksto ng pagliligtas
  choice: ang kanyang katuwiran
  alternative: ang kanyang katarungan
  rationale: Ang ‘katuwiran’ ay nagpapanatili sa malawak na moral at kaugnayang diwa ng salita, samantalang ang ‘katarungan’ ay tunay na posibleng pagbasa at kaya inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang paralelismo at matingkad na larawan ng Hebreo, gayundin ang pagkakaiba ng ‘ipinaalam’ at ‘inihayag.’
