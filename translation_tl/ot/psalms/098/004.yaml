  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: tl
  text: Humiyaw kayo sa galak kay Yahweh[a], buong daigdig; bumulalas kayo, umawit sa galak, at tumugtog kayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magbunyi kayo nang malakas kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “bumulalas kayo, humiyaw sa galak, at umawit ng papuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Humiyaw kayo sa galak
  rationale: Ang pautos na anyong Hiphil ng רוע sa konteksto ng pagpupuri ay tumutukoy sa malakas at masayang sigaw. Likas sa makabagong Filipino ang “humiyaw sa galak” at malinaw nitong pinananatili ang diwa ng pautos.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pinatutungkulan ng masayang sigaw. Isinalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: כָּל הָאָרֶץ
  choice: buong daigdig
  rationale: Sa pangkalahatang panawagan ng awit, ang אָרֶץ ay tumutukoy sa buong mundo, hindi lamang sa isang lupain. Ang “buong daigdig” ay malinaw at natural bilang tuwirang kinakausap.
- source_word: פִּצְחוּ
  choice: biglang umawit
  rationale: Ang פצח ay naglalarawan ng pagbulalas o biglang pagsisimula ng masayang tinig. Sa Filipino, natural na naipapahayag ang larawang ito sa “biglang umawit,” kasabay ng kasunod na pandiwa.
- source_word: וְרַנְּנוּ
  choice: umawit sa galak
  rationale: Ang רנן sa anyong Piel ay maaaring tumukoy sa mataginting na sigaw o awit ng kagalakan. Ang “umawit sa galak” ay angkop sa musikal na daloy ng talata at naiiba sa unang paghiyaw.
- source_word: וְזַמֵּרוּ
  choice: tumugtog
  rationale: Ang זמר sa pagpupuri ay maaaring tumukoy sa paggawa ng musika, kabilang ang pagtugtog at pag-awit. Dahil naipahayag na ang pag-awit sa naunang pandiwa, pinananatili ng “tumugtog” ang natatanging musikal na diin nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton יהוה. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang pautos na “kayo” upang malinaw na ihatid ang anyong Hebreo at ang “buong daigdig” bilang kinakausap. Pinanatili ang masigla at patulang pag-igting mula sa paghiyaw tungo sa awit at musika.
