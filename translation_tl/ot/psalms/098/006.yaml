base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: tl
  text: 'Sa mga trumpeta at sa tunog ng tambuli[a],

    sumigaw kayo sa harap ng Hari, si Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sungay ng lalaking tupa.” Ang Hebreong שׁוֹפָר ay madalas tumutukoy sa instrumentong yari sa sungay ng lalaking tupa, na naiiba sa mga trumpetang binanggit sa unahan ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: Sa tunog ng mga trumpeta
  rationale: Ang חֲצֹצְרוֹת ay mga trumpeta, malamang na tuwid na instrumentong metal na naiiba sa שׁוֹפָר. Ipinahihiwatig ng instrumental na בְּ na kasabay o sa pamamagitan ng mga ito ang pagsigaw; natural itong ipinahayag sa Filipino bilang “sa tunog ng.” Hindi idinagdag ang “pilak” sapagkat wala ito sa Hebreo.
- source_word: וְקוֹל שׁוֹפָר
  choice: at ng tambuli
  rationale: Ang קוֹל ay “tunog,” at ang שׁוֹפָר ay instrumentong sungay, na madalas gawin mula sa sungay ng lalaking tupa. Ang “tambuli” ay likas na salitang Filipino para sa hinihipang sungay at pinananatili ang kaibhan nito sa mga trumpetang naunang binanggit. Saklaw ng iisang “tunog” sa parirala ang dalawang instrumento.
- source_word: הָרִיעוּ
  choice: sumigaw kayo
  rationale: Ang Hiphil imperative plural ng רוע ay nag-uutos ng malakas na sigaw o pagbubunyi. Ang “sumigaw kayo” ay tuwiran at hindi nagdaragdag ng salitang “galak,” bagaman masayang pagbubunyi ang ipinahihiwatig ng konteksto.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Likas na katumbas ito ng “sa harap ng” o “sa presensiya ng”; pinili ang una dahil maikli at malinaw.
- source_word: הַמֶּלֶךְ
  choice: Hari
  rationale: Tiyak ang pangngalan at tumutukoy kay Yahweh bilang Hari. Ang malaking titik ay nagpapakitang banal na titulo ito nang hindi binabago ang kahulugang leksikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Ugnayan ng הַמֶּלֶךְ at יְהוָה
  choice: ang Hari, si Yahweh
  alternative: si Yahweh na Hari / sa harap ni Yahweh, ang Hari
  rationale: 'Likas na basahin ang magkasunod na mga salita bilang apposition: kinikilala si Yahweh bilang Hari. Nililinaw ng “si” ang ugnayang ito sa natural na Filipino nang hindi binabaligtad ang ayos ng Hebreo.'
- issue: Diwa ng הָרִיעוּ
  choice: sumigaw kayo
  alternative: magbunyi kayo / sumigaw kayo sa galak
  rationale: Pinananatili ng salin ang malawak na kahulugan ng malakas na sigaw o pagpupugay at hindi tahasang idinaragdag ang “galak,” na kontekstuwal ngunit wala sa mismong pandiwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pagkakaiba ng “mga trumpeta” at “tambuli,” at ginamit ang dalawang linyang patula upang maging malinaw ang instrumental na parirala at ang pangunahing utos.
