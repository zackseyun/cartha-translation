base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: tl
  text: Isang salmo. Umawit kayo kay Yahweh ng isang bagong awit, sapagkat gumawa siya ng mga kamangha-manghang bagay; ang kanyang kanang kamay at banal na bisig ang nagdulot sa kanya ng kaligtasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nagligtas sa kanya” o “nagkamit ng kaligtasan para sa kanya.” Ang pananalitang Hebreo ay maaaring isalin nang higit na literal, ngunit ipinahihiwatig nito na ang sariling kapangyarihan ni Yahweh ang nagsagawa ng pagliligtas o nagkamit ng tagumpay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Isang awit
  rationale: Pamagat o katawagang pangmusika para sa isang salmo; natural at malinaw ang “awit” sa modernong Filipino.
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Pinananatili ang pangmaramihang pautos ng pandiwang Hebreo nang hindi idinaragdag ang di-tahasang ideya ng pagpupuri.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay tumutukoy sa pinag-uukulan ng awit, at pinananatili ang pangalang banal bilang Yahweh.
- source_word: שִׁיר חָדָשׁ
  choice: isang bagong awit
  rationale: Tuwirang salin na likas ding pakinggan sa Filipino at nagpapanatili sa karaniwang pananalita ng mga salmo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos na umawit at angkop sa marangal na estilong patula.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: gumawa siya ng mga kamangha-manghang bagay
  rationale: Inihahayag ang mga gawang pumupukaw ng paghanga nang malinaw at hindi lipas ang pananalita.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: nagkamit ng kaligtasan para sa kanya
  rationale: Malapit sa anyo at diwa ng Hebreo habang pinananatili ang kakaibang pahayag na ang sariling kapangyarihan ni Yahweh ang nagsagawa ng pagliligtas o pagtatagumpay para sa kanya.
- source_word: יְמִינוֹ
  choice: ang kanyang kanang kamay
  rationale: Pinananatili ang larawang antropomorpiko ng kapangyarihan at pagkilos.
- source_word: וּזְרֹעַ קָדְשׁוֹ
  choice: at banal na bisig
  rationale: Natural na salin ng pariralang konstrakto at pinananatili ang patulang parallelismo sa “kanang kamay.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang kinakatawan ang tetragrammaton at naaayon sa ibinigay na patakaran ng proyekto.
- issue: Diwa ng הוֹשִׁיעָה לּוֹ kaugnay ng sariling kamay at bisig ng Diyos
  choice: nagkamit ng kaligtasan para sa kanya
  alternative: nagligtas sa kanya; nagkamit ng tagumpay para sa kanya
  rationale: 'Pinananatili ang tunay na tensiyon ng Hebreo: maaaring literal na tumukoy sa pagliligtas para sa kanya, ngunit sa konteksto ay ipinahihiwatig na sariling kapangyarihan ni Yahweh ang nagkamit ng pagliligtas o tagumpay.'
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang pangmaramihang “kayo” upang malinaw na maipakita ang anyo ng utos sa Hebreo; pinanatili ang mga larawang “kanang kamay” at “banal na bisig.”
