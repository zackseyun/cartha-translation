lexical_decisions:
- source_word: נְהָרוֹת
  choice: mga ilog
  rationale: Tuwirang katumbas ng pangmaramihang pangngalan at angkop sa larawang makata ng buong nilikha na nagpupuri.
- source_word: יִמְחֲאוּ כָף
  choice: pumalakpak
  rationale: Ang pariralang Hebreo ay idyomang nangangahulugang pumalakpak. Hindi na kailangang idagdag ang “mga kamay” sa Filipino sapagkat likas na itong ipinahihiwatig ng pandiwa.
- source_word: יַחַד
  choice: sama-sama
  rationale: Pinananatili ang diwa ng nagkakaisang pagpupuri at natural ang pagkakalagay nito sa pangungusap na Filipino.
- source_word: הָרִים
  choice: mga bundok
  rationale: Tuwirang salin na nagpapanatili sa lawak at kadakilaan ng larawan.
- source_word: יְרַנֵּנוּ
  choice: umawit sa galak
  rationale: Ipinahahayag ang masiglang kagalakan ng pandiwa habang pinananatili ang posibilidad na tumukoy ito sa masayang sigaw, na inilalahad sa talababa.
theological_decisions:
- issue: Makatang pagsasatao sa nilikha bilang nagpupuri
  choice: Panatilihin nang tuwiran ang mga ilog na pumapalakpak at mga bundok na umaawit
  alternative: Ipaliwanag ito bilang metapora lamang ng pagpupuri ng tao na pinupukaw ng kalikasan
  rationale: Tuwirang inilalarawan ng Hebreo ang mga ilog at bundok bilang nakikibahagi sa pagpupuri. Pinananatili nito ang lakas ng tula nang hindi nagdaragdag ng tiyak na interpretasyong teolohikal.
- issue: Lakas ng mga pandiwang Hebreo
  choice: 'Gamitin ang anyong pautos o paanyaya: “Pumalakpak … umawit”'
  alternative: 'Gamitin ang panghinaharap: “Papalakpak … aawit”'
  rationale: Sa kontekstong makata, likas basahin ang mga anyong Hebreo bilang panawagan sa nilikha. Ang Filipino na anyong pautos ay malinaw at hindi nangangailangan ng paulit-ulit na “nawa.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang masiglang pagsasatao at paralelismo ng tulang Hebreo. Inilagay ang panandang talababa sa pandiwang saklaw ng leksikal na alternatibo. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
