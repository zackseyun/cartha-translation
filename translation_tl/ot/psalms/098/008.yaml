translation:
  language: tl
  text: Pumalakpak nawa ang mga ilog; sabay-sabay na umawit nang may galak[a] ang mga bundok,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sabay-sabay na humiyaw sa galak.” Ang pandiwang Hebreo ay maaaring tumukoy sa masayang sigaw gayundin sa masayang pag-awit.
