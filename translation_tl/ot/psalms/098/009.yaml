  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: tl
  text: sa harap ni Yahweh[a], sapagkat dumarating siya upang hatulan ang lupa; hahatulan niya ang sanlibutan[b] nang may katuwiran, at ang mga bayan nang patas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay YHWH, ang personal na pangalan ng Diyos; maaari ring isalin ang parirala na “sa presensiya ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “ang daigdig na tinitirhan.”
    reason: lexical_alternative
  - marker: c
    text: O “nang may pagiging matuwid” o “nang may katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Likas na katumbas sa Filipino ng idyomang nangangahulugang “before/in the presence of,” at angkop bago ang personal na pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: כִּי בָא
  choice: sapagkat dumarating siya
  rationale: Ipinakikita ng כִּי ang dahilan ng naunang pagpupuri, samantalang pinananatili ng kasalukuyang progresibong anyo ang nalalapit at tiyak na dating ng ποιetikong qatal בָא.
- source_word: לִשְׁפֹּט
  choice: upang hatulan
  rationale: Pinananatili ng “hatulan” ang saklaw na hudisyal nang hindi ito nililimitahan sa pagpaparusa lamang o sa pamamahala lamang.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa paralelismo sa sanlibutan at mga bayan, tumutukoy ito sa buong lupa, hindi lamang sa isang partikular na lupain.
- source_word: יִשְׁפֹּט
  choice: hahatulan niya
  rationale: Ang anyong di-ganap ay tumutukoy sa nalalapit na kilos ng paghatol na ipinahayag ng kaniyang pagdating.
- source_word: תֵּבֵל
  choice: ang sanlibutan
  rationale: Dignidad at likas na salitang Filipino para sa daigdig na tinitirhan ng sangkatauhan; pinananatili nito ang pandaigdig na saklaw.
- source_word: בְּצֶדֶק
  choice: nang may katuwiran
  rationale: Ipinahahayag ang paraan at moral na katangian ng kaniyang paghatol, habang pinananatili ang kaugnayan sa צֶדֶק.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ang maramihang sangguni sa magkakaibang pangkat ng mga tao at ang paralelismo ng tula.
- source_word: בְּמֵישָׁרִים
  choice: nang may pagkakapantay-pantay
  rationale: Sa kontekstong hudisyal, ipinahahayag nito ang patas at walang-kinikilingang paraan ng paghatol; hindi nito ipinapalagay na pantay ang magiging hatol sa lahat.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng banal na paghatol sa שׁפט
  choice: hatulan
  alternative: pamahalaan; ipagtanggol at bigyang-katarungan
  rationale: Ang “hatulan” ay nagpapanatili sa tensiyon ng pananagutan, pagbibigay-katarungan, at matuwid na pagsasaayos nang hindi pinipili ang isa lamang na aspekto.
- issue: Panahunan at aspekto ng בָא
  choice: dumarating siya
  alternative: dumating siya; darating siya
  rationale: Ang ποιetikong qatal ay maaaring maglarawan ng pagkilos bilang nalalapit o tiyak. Ang “dumarating” ay nagpapanatili sa masiglang paglalarawan nang hindi ito ginagawang payak na nakaraan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sapagkat” at “sanlibutan” upang mapanatili ang himig ng salmo nang manatiling malinaw sa karaniwang mambabasa. Ang dalawang pariralang “nang may…” ay nagpapanatili sa balanseng paralelismo ng Hebreo.
