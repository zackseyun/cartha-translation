  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: tl
  text: Ilayo mo ang iyong tingin sa akin[a], upang muli akong sumigla bago ako lumisan at hindi na ako naririto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilingon mo palayo ang iyong tingin sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע מִמֶּנִּי
  choice: Lumayo ka ng tingin sa akin
  rationale: Ang pautos na pandiwa kasama ng pariralang nagsasaad ng paglayo ay humihiling sa Diyos na alisin ang kaniyang nakatuong tingin sa salmista. Pinananatili nito ang larawan ng pagtingin nang hindi ginagawang tahasang pahayag tungkol sa pagpaparusa.
- source_word: וְאַבְלִיגָה
  choice: upang muli akong sumigla
  rationale: Ang pandiwang בלג ay maaaring tumukoy sa panunumbalik ng sigla, ginhawa, o ningning ng mukha. Likas sa modernong Tagalog ang “muling sumigla” at hindi nito nililimitahan ang kahulugan sa literal na pagngiti.
- source_word: בְּטֶרֶם
  choice: bago
  rationale: Karaniwang panandang temporal na malinaw na tumutumbas sa “before.”
- source_word: אֵלֵךְ
  choice: ako pumanaw
  rationale: Literal itong “ako'y yumaon,” ngunit sa konteksto ay mahinahong idyoma para sa pag-alis sa buhay. Ang “pumanaw” ay natural at marangal sa Tagalog habang pinananatili ang di-tuwirang pagtukoy sa kamatayan.
- source_word: וְאֵינֶנִּי
  choice: at mawala na
  rationale: Ipinahahayag nito ang hindi na pag-iral o pagkanaririto. Ang “mawala na” ay nagpapanatili sa payak at taimtim na kawakasan ng Hebreo.
theological_decisions:
- issue: Kung gagawing tahasan ang pagtukoy sa kamatayan sa אֵלֵךְ וְאֵינֶנִּי
  choice: Gumamit ng “bago ako pumanaw at mawala na,” na malinaw ngunit nananatiling eupemistiko.
  alternative: “bago ako yumaon at hindi na ako naririto” o “bago ako mamatay at mawala na”
  rationale: Malinaw na kamatayan ang tinutukoy, ngunit hindi gumagamit ang Hebreo ng tuwirang pandiwa para sa “mamatay.” Ang “pumanaw” ay nagpapanatili sa patulang pagpipigil at hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Iniwasan ang arkaikong “yumaon” sa pangunahing teksto at ang labis na kolokyal na “ngumiti muli.”
