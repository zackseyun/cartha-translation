  naturalness: Kailangan ng rebisyon dahil hindi idiomatiko ang “Lumayo ka ng tingin sa akin.” Ang “Ilayo mo ang iyong tingin sa akin” ay malinaw, marangal, at natural sa modernong Filipino Tagalog. Ang binagong huling parirala ay nananatiling patula ngunit mas tumpak at hindi malabo.
  terminology: Walang problemang doktrinal o terminolohikal. Ang “sumigla” ay angkop na malawak na salin para sa וְאַבְלִיגָה at pinananatili ang saklaw na ginhawa, panunumbalik, o pagliwanag. Ang “lumisan” at “hindi na ako naririto” ay hindi tahasang nagpapaliwanag nang lampas sa mahinahong pahiwatig ng Hebreo tungkol sa kamatayan.
