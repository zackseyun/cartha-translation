  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: tl
  text: Narito, ginawa mong ilang lapad ng palad lamang ang mga araw ko, at ang haba ng buhay ko ay waring wala sa harap mo. Tunay nga, ang bawat tao, kahit waring matatag, ay walang iba kundi singaw lamang.[a] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hininga lamang” o “panandaliang singaw.” Ang Hebreong הֶבֶל ay tumutukoy sa isang bagay na panandalian at madaling maglaho; maaari rin itong magpahiwatig ng kawalang-kabuluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang mariing panawag-pansin at ang marangal na himig ng tula.
- source_word: טְפָחוֹת
  choice: ilang dangkal lamang
  rationale: Ang טפח ay maliit na sukat na nakabatay sa lapad ng kamay; likas sa Filipino ang “dangkal,” at ipinahihiwatig ng “lamang” ang ikli ng buhay.
- source_word: נָתַתָּה יָמַי
  choice: ginawa mong ... ang mga araw ko
  rationale: Sa konteksto, itinakda o ginawang maikli ng Diyos ang mga araw ng nagsasalita; pinananatili rin ang Hebreong idyoma para sa haba ng buhay.
- source_word: וְחֶלְדִּי
  choice: ang haba ng buhay ko
  rationale: Malinaw na tumutukoy sa taning o tagal ng buhay sa daigdig at natural na kaagapay ng “mga araw ko.”
- source_word: כְאַיִן נֶגְדֶּךָ
  choice: parang wala sa harap mo
  rationale: Pinananatili ang paghahambing sa kawalang-halaga ng buhay ng tao kapag inihambing sa Diyos.
- source_word: אַךְ
  choice: Tunay nga
  rationale: Ipinahahayag ang mariing pangkalahatang kongklusyon ng salmista.
- source_word: כָּל אָדָם
  choice: ang bawat tao
  rationale: Ang אָדָם ay generic singular na sumasaklaw sa sangkatauhan; ang “bawat tao” ay tumpak at natural sa modernong Filipino.
- source_word: נִצָּב
  choice: kahit matatag siyang nakatayo
  rationale: 'Pinananatili ang literal na larawan ng pagtayo at ipinahihiwatig ang posibleng konsesibong diwa: kahit ang taong waring matatag o panatag.'
- source_word: כָּל הֶבֶל
  choice: pawang singaw lamang
  rationale: Ang הֶבֶל ay hininga, singaw, o ulop—isang larawang nagpapahiwatig ng pagiging panandalian at walang-kapitan. Pinananatili ng “singaw” ang kongkretong metapora, at ng “pawang ... lamang” ang totalizing force.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili ang tradisyonal na transliterasyon sapagkat hindi tiyak ang eksaktong tungkulin ng salita.
theological_decisions:
- issue: Saklaw ng generic singular na אָדָם
  choice: bawat tao
  alternative: bawat lalaki / buong sangkatauhan
  rationale: Pangkalahatan ang pahayag tungkol sa lahat ng tao, hindi lamang sa kalalakihan. Ang “bawat tao” ay nagpapanatili sa singular na anyo at inclusive na saklaw nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Diwa ng נִצָּב
  choice: kahit matatag siyang nakatayo
  alternative: habang nakatayo / sa kanyang pinakamabuting kalagayan
  rationale: Maaaring literal na “nakatayo” o may diwang “matatag/nakatatag.” Pinananatili ng salin ang larawan at ang tensiyong kahit ang waring matatag na tao ay panandalian.
- issue: Metapora ng הֶבֶל
  choice: singaw
  alternative: hininga / kawalang-kabuluhan
  rationale: Iniiwasang paliitin ang kahulugan tungo lamang sa moral o pilosopikal na “kawalang-kabuluhan.” Ang “singaw” ay nagpapanatili sa pangunahing larawan ng isang bagay na panandalian at walang-kapitan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Pinanatili ang kongkretong larawang “dangkal,” “nakatayo,” at “singaw,” gayundin ang hindi isinaling “Selah.”
