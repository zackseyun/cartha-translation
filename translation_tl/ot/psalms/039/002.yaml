  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: tl
  text: Hindi ako umimik at nanatiling tahimik; hindi ako nagsalita, maging ng mabuti[a], at sumidhi ang aking sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanahimik ako at lumayo sa mabuti.” Maaaring tumukoy ang Hebreo sa hindi pagsasalita kahit ng mabuti, o sa pagpigil sa sarili mula sa anumang mabuti.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Hindi ako umimik
  rationale: Ipinahahayag ng Niphal na anyo ang pagiging hindi makapagsalita o hindi pagbigkas, nang hindi ipinapasiya kung kusang-loob o sapilitan ang pananahimik.
- source_word: דּוּמִיָּה
  choice: nanatiling tahimik
  rationale: Ang pangngalan ay tumutukoy sa katahimikan o kawalang-kilos; ginawang likas na pariralang pang-abay sa Filipino habang pinananatili ang diin ng paralelismo.
- source_word: הֶחֱשֵׁיתִי
  choice: hindi ako nagsalita
  rationale: Ang Hiphil ng חשׁה ay nangangahulugang manahimik o hindi magsalita. Bahagyang iniiba ang pananalita mula sa unang sugnay upang manatili ang paralelismo nang hindi tunog-paulit-ulit lamang.
- source_word: מִטּוֹב
  choice: maging ng mabuti
  rationale: Siksik at malabo ang pariralang מן + טוֹב. Ang saling ito ay likas na tumutukoy sa pagpigil maging ng mabuting sasabihin, ngunit inilalagay sa talababa ang alternatibong mas malawak na kahulugang paglayo sa mabuti.
- source_word: וּכְאֵבִי
  choice: ang aking sakit
  rationale: Maaaring pisikal o emosyonal ang כְּאֵב; sapat na malawak ang “sakit” upang hindi paliitin ang kahulugan.
- source_word: נֶעְכָּר
  choice: sumidhi
  rationale: Ang Niphal ng עכר ay maaaring mangahulugang nagulo, nabagabag, o napukaw. Likas na inilalarawan ng “sumidhi” ang paglakas ng sakit bunga ng pinipigilang pananalita.
