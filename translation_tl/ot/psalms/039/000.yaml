base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/000.yaml
  text: For the choir director; according to Jeduthun[a]. A psalm of David[b].
translation:
  language: tl
  text: Para sa tagapamahala ng awitan; ayon kay Jedutun[a]. Isang salmo ni David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay Jedutun” o “kay Jedutun”; maaaring magpahiwatig ang pang-ukol sa Hebreo ng iba't ibang uri ng kaugnayan sa mga pamagat ng salmo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mula kay David,” “para kay David,” o “ukol kay David”; hindi tiyak sa anyong Hebreo kung pag-akda, pag-aari, o kaugnayan ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapamahala ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang “tagapamahala ng awitan.”
- source_word: לִידוּתוּן
  choice: ayon kay Jedutun
  rationale: Maaaring magpahiwatig ang pang-ukol na ל ng iba't ibang uri ng kaugnayan. Pinananatili ng “ayon kay” ang posibleng kaugnayan sa paraan, tradisyon, o pangkat ni Jedutun nang hindi nag-aangkin ng katiyakan.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang “salmo” ang kinikilalang katawagan sa uring musikal na komposisyong tinutukoy ng מִזְמוֹר.
- source_word: לְדָוִד
  choice: ni David
  rationale: Karaniwan at marangal ang “ni David” sa Filipino, habang hindi nito kailangang tiyaking si David mismo ang may-akda; maaari rin itong magpahiwatig ng pag-aari o kaugnayan.
theological_decisions:
- issue: Saklaw ng pang-ukol ל sa mga pamagat ng salmo
  choice: Gumamit ng “ayon kay Jedutun” at “ni David,” na may mga talababa tungkol sa ibang posibleng ugnayan.
  alternative: Isalin nang tiyak bilang “para kay Jedutun” at “isinulat ni David.”
  rationale: Malawak ang gamit ng Hebreong ל at hindi nito sa sarili lamang nilulutas kung ang kahulugan ay direksiyon, pag-aari, pag-uugnay, o pag-akda.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapamahala ng awitan” sa halip na mas teknikal o makalumang katawagan. Inilagay ang mga pananda ng talababa agad pagkatapos ng mga pariralang binibigyang-linaw.
