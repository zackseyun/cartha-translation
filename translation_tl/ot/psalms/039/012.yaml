source:
  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: tl
  text: Dinggin mo ang panalangin ko, Yahweh, at pakinggan mo ang aking pagdaing; huwag kang maging bingi sa aking mga luha.[a] Sapagkat ako ay dayuhang nakikipamayan sa piling mo, isang pansamantalang naninirahan, gaya ng lahat ng aking mga ninuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwag kang manahimik sa aking mga luha.” Ang pandiwang Hebreo ay maaaring mangahulugang “manahimik,” ngunit ang naunang mga pakiusap na dinggin at pakinggan ay sumusuporta sa pandinig na diwang “maging bingi” sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: Literal, “gaya ng lahat ng aking mga ama,” isang Hebreong paraan ng pagtukoy sa mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Dinggin mo
  rationale: Ang pautos na Qal ng שׁמע ay tuwirang pakiusap kay Yahweh. Ang “dinggin mo” ay likas at marangal na pananalita sa panalangin.
- source_word: תְפִלָּתִי
  choice: ang panalangin ko
  rationale: Karaniwang kahulugan ng pangngalan at malinaw sa makabagong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וְשַׁוְעָתִי
  choice: ang aking pagdaing
  rationale: Ang שַׁוְעָה ay isang marubdob na daing, karaniwang paghingi ng tulong. Ipinapahayag ng “pagdaing” ang emosyonal na bigat nang hindi nagpapalabis.
- source_word: הַאֲזִינָה
  choice: pakinggan mo
  rationale: Ang Hiphil na pautos ng אזן ay literal na may diwang “ikiling ang tainga.” Ang “pakinggan mo” ay natural sa Filipino at pinananatili ang paralelismo sa “dinggin mo.”
- source_word: אֶל דִּמְעָתִי
  choice: sa aking mga luha
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong gamitin nang kolektibo. Mas natural sa Filipino ang maramihang “mga luha” habang pinananatili ang larawan.
- source_word: אַל תֶּחֱרַשׁ
  choice: huwag kang manahimik
  rationale: Maaaring tumukoy ang חרשׁ sa pananahimik o pagkabingi. Pinipili sa pangunahing teksto ang mas tuwirang “manahimik,” habang inilalagay sa talababa ang pandinig na pagbasa na umaangkop sa naunang mga pakiusap.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng pakiusap at angkop sa marangal na estilong patula.
- source_word: גֵר
  choice: dayuhang nakikipamayan
  rationale: Tumutukoy ang גֵר sa isang hindi katutubo na naninirahan sa gitna ng isang bayan nang walang ganap na katayuan o pag-aari roon. Naipahihiwatig ito ng “dayuhang nakikipamayan” sa natural na Filipino.
- source_word: עִמָּךְ
  choice: sa piling mo
  rationale: Karaniwang nangangahulugang “kasama mo” ang עם. Sa kontekstong ito, natural na ipinapahayag ng “sa piling mo” ang paninirahan sa presensiya o nasasakupan ng Diyos nang hindi labis na nagpapakahulugan.
- source_word: תּוֹשָׁב
  choice: isang pansamantalang naninirahan
  rationale: Tumutukoy ito sa isang naninirahan na walang ganap na katutubong katayuan. Pinananatili ng salin ang kaibhan nito sa גֵר nang hindi gumagamit ng teknikal o di-likas na parirala.
- source_word: כְּכָל אֲבוֹתָי
  choice: gaya ng lahat ng aking mga ninuno
  rationale: Bagaman literal na “mga ama,” ang אבות sa ganitong konteksto ay karaniwang tumutukoy sa mga naunang salinlahi. Ang “mga ninuno” ang malinaw at likas na katumbas sa Filipino; itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglalarawan sa katayuan ng tao sa harap ng Diyos sa pamamagitan ng גֵר at תּוֹשָׁב
  choice: Panatilihing magkaiba bilang “dayuhang nakikipamayan” at “pansamantalang naninirahan.”
  alternative: Pagsamahin o gawing halos magkapareho bilang “dayuhan at estranghero.”
  rationale: Gumagamit ang Hebreo ng dalawang magkaugnay ngunit magkaibang katawagang panlipunan. Ang salin ay nagpapanatili sa pares at sa diwa ng pansamantala at walang pag-aangking paninirahan sa piling ng Diyos.
- issue: Saklaw ng אֲבוֹתָי
  choice: “aking mga ninuno” sa pangunahing teksto
  alternative: “aking mga ama”
  rationale: Sa kontekstong tumutukoy sa magkakasunod na salinlahi, idiomatikong nangangahulugan ang Hebreong “mga ama” ng mga ninuno. Iniiwasan ng pangunahing salin ang maling pahiwatig sa Filipino na maraming agarang ama ang tinutukoy, habang pinananatili sa talababa ang literal na anyo.
- issue: Kahulugan ng אַל תֶּחֱרַשׁ
  choice: “huwag kang manahimik” sa pangunahing teksto
  alternative: “huwag kang maging bingi” o “huwag kang magbingi-bingihan”
  rationale: Tunay na saklaw ng pandiwa ang pananahimik at, sa ilang pagbasa, ang di-pakikinig. Pinananatili ng pangunahing teksto ang tuwirang kahulugan, ngunit hindi itinatago ng talababa ang pandinig na pagbasa na sinusuportahan ng “dinggin” at “pakinggan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa panalanging patula. Ginamit ang “ako ay” sa halip na pinaikling anyo upang mapanatili ang taimtim na himig. Sadyang pinag-iba ang dalawang katawagang panlipunan sa Hebreo, at pinanatili sa talababa ang tunay na leksikal na mga alternatibo.
