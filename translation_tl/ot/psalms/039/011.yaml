  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: tl
  text: Sa mga pagsaway dahil sa kasamaan, dinidisiplina mo ang isang tao; inuubos mong gaya ng gamugamo ang mahalaga sa kanya.[a] Tunay na ang bawat tao ay singaw lamang.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pinangangalumata mo, gaya ng gamugamo, ang kanyang kagandahan” o “ang kanyang mga kayamanan.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa kagandahan o sa anumang bagay na minimithi at pinahahalagahan niya.'
    reason: lexical_alternative
  - marker: b
    text: Ang “singaw” ay salin ng Hebreong hebel, na naglalarawan ng hininga o singaw—panandalian at walang katatagan; tradisyonal ding isinasalin na “walang kabuluhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: sa pamamagitan ng mga pagsaway
  rationale: Pinananatili ang instrumental na gamit ng בְּ at ang diwa ng paulit-ulit o sari-saring pagtutuwid na nasa pangmaramihang תוֹכָחוֹת.
- source_word: עַל עָוֺן
  choice: dahil sa kasamaan
  rationale: Ipinahahayag ang dahilan ng pagsaway at pagdidisiplina; ang “kasamaan” ay nagpapanatili sa moral na bigat ng עָוֺן nang hindi nililimitahan ito sa legal na pagkakasala lamang.
- source_word: יִסַּרְתָּ
  choice: dinidisiplina mo
  rationale: Natural sa modernong Filipino at pinananatili ang mapagtuwid na diwa ng pandiwang יסר.
- source_word: אִישׁ
  choice: isang tao
  rationale: Bagaman panlalaking pangngalan ang אִישׁ, kinakatawan nito rito ang isang indibiduwal na tao sa pangkalahatan; ang “isang tao” ay likas at tumpak sa Filipino, na hindi nangangailangan ng panlalaking anyo para mapanatili ang gramatikal na kasarian.
- source_word: וַתֶּמֶס
  choice: inuubos mo
  rationale: Ipinahahayag ang pagkalusaw o unti-unting pagkaubos na dulot ng Diyos at angkop sa larawang inihahambing sa gamugamo.
- source_word: כָּעָשׁ
  choice: gaya ng gamugamo
  rationale: Ang “gamugamo” ang karaniwang salitang Filipino para sa moth at malinaw na pinananatili ang paghahambing.
- source_word: חֲמוּדוֹ
  choice: ang mahalaga sa kanya
  rationale: Sinasaklaw ang maaaring tumukoy sa kagandahan, kayamanan, o anumang minimithi at pinahahalagahan ng tao, nang hindi pinipili nang di-tiyak ang isa lamang.
- source_word: אַךְ
  choice: tunay na
  rationale: Nagbibigay ng mariing pangwakas na pahayag na likas at marangal sa Filipino.
- source_word: הֶבֶל
  choice: singaw lamang
  rationale: Pinananatili ang konkretong larawan ng isang bagay na panandalian at walang matibay na sustansiya; ang “lamang” ay naghahatid ng mariing puwersa ng אַךְ sa kabuuang sugnay.
- source_word: כָּל אָדָם
  choice: ang bawat tao
  rationale: Tumutukoy ang אָדָם sa sangkatauhan sa paraang distributibo; natural na ipinahahayag ito sa Filipino bilang “bawat tao.”
- source_word: סֶלָה
  choice: Selah
  rationale: Tinititik lamang ang liturhikal o musikal na katawagan sapagkat hindi tiyak ang eksaktong kahulugan nito.
theological_decisions:
- issue: Pangkalahatang pagtukoy ng אִישׁ at אָדָם sa tao
  choice: “isang tao” at “bawat tao”
  alternative: “isang lalaki” at “bawat lalaki”
  rationale: Ang mga pangngalan ay nasa anyong panlalaki sa Hebreo ngunit kumakatawan dito sa tao sa pangkalahatan. Walang gramatikal na kasarian ang mga katumbas na pangngalang Filipino, kaya ang “tao” ay nagpapanatili ng pangkalahatang saklaw nang hindi nagdaragdag o nag-aalis ng kasarian sa target na wika.
- issue: Saklaw ng חֲמוּדוֹ
  choice: “ang mahalaga sa kanya”
  alternative: “ang kanyang kagandahan” o “ang kanyang mga kayamanan”
  rationale: Malawak ang leksikal na saklaw ng salita at hindi tiyak sa konteksto kung kagandahan, pag-aari, o ibang minimithing bagay ang tinutukoy. Pinananatili ng salin ang tunay na kalabuan.
- issue: Larawan ng הֶבֶל
  choice: “singaw”
  alternative: “walang kabuluhan”
  rationale: Pinananatili ang pisikal na larawan ng panandalian at di-matibay na singaw sa halip na lutasin ito bilang isang purong abstraktong hatol tungkol sa kabuluhan ng tao.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pagsaway” at “dinidisiplina” upang mapanatili ang mapagtuwid na tono; iniwasan ang labis na arkaikong pananalita. Ang “gamugamo,” “singaw,” at “Selah” ay nagpapanatili sa matitingkad at hindi ganap na nalulutas na larawan ng Hebreo.
