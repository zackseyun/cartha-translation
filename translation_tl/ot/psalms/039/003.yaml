translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang pag-uulit ng panloob na lokasyon at ang konkretong larawan ng puso, apoy, at dila. Ginamit ang 'nagbubulay-bulay' sa halip na mas teknikal o mas relihiyosong 'nagmemeditasyon.'
