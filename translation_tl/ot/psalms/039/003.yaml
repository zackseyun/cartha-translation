  source_fidelity: 'Tapat ang salin sa pagkakasunod at mga larawan ng Hebreo: ang pag-init ng puso sa kalooban, ang apoy na nagliliyab habang nagbubulay-bulay ang nagsasalita, at ang kasunod na pagsasalita gamit ang dila. Ang ‘nag-init’ ay isang katanggap-tanggap na kontekstuwal na pagkuha sa חַם at pinananatili nitong hiwalay ang unang init mula sa kasunod na apoy.'
