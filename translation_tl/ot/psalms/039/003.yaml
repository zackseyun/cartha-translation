  yaml_path: translation/ot/psalms/039/003.yaml
  text: 'My heart grew hot within me[a]; as I meditated, the fire burned[b]; then I spoke with my tongue:'
translation:
  language: tl
  text: 'Nag-init ang puso ko sa loob ko; habang nagbubulay-bulay ako[a], nagliyab ang apoy[b]. Saka ako nagsalita sa pamamagitan ng aking dila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang ako'y nagmumuni-muni” o “sa aking pagbubulay.” Ang salitang Hebreo ay maaaring tumukoy sa panloob na pagbubulay o pagninilay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “may apoy na nagliyab” o “nag-alab ang apoy.” Tumitindi ang larawang Hebreo mula sa init sa kalooban tungo sa nagliliyab na apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַם לִבִּי בְּקִרְבִּי
  choice: Nag-init ang puso ko sa loob ko
  rationale: Pinananatili ang larawan ng puso bilang kalooban at ang paglala ng panloob na init, nang hindi agad ito ipinapantay sa tahasang apoy sa kasunod na parirala.
- source_word: בַּהֲגִיגִי
  choice: habang nagbubulay-bulay ako
  rationale: Maaaring tumukoy ang הֲגִיג sa panloob na pagninilay, pagbubulay, o mahinang pagbigkas. Ang temporal na 'habang' ay likas sa Filipino at ang 'nagbubulay-bulay' ay nagpapanatili sa mapagnilay na diwa.
- source_word: תִבְעַר אֵשׁ
  choice: nagliyab ang apoy
  rationale: Malinaw at masidhing inilalarawan nito ang pag-usad mula sa panloob na init tungo sa nag-aapoy na damdamin, habang nananatili ang tahasang larawan ng apoy.
- source_word: דִּבַּרְתִּי
  choice: Saka ako nagsalita
  rationale: Ang 'saka' ay nagpapakita ng pagkakasunod-sunod mula sa pagbubulay at pagliyab tungo sa pagsasalita, bagaman hindi ito hiwalay na salita sa Hebreo.
- source_word: בִּלְשׁוֹנִי
  choice: sa pamamagitan ng aking dila
  rationale: Pinananatili ang pisikal na larawan ng dila bilang kasangkapan ng aktuwal na pagsasalita at hindi ito pinapalitan ng mas malayang 'bibig.'
