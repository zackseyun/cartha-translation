translation:
  language: tl
  text: Alisin mo sa akin ang iyong salot[a]; sa hagupit ng iyong kamay, nauubos ako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong hagupit” o “iyong kapighatian.”
    reason: lexical_alternative
  - marker: b
    text: O “Sa paglusob ng iyong kamay, nauubos ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Alisin mo
  rationale: Ang Hiphil imperative ay isang tuwirang pakiusap na alisin ang isang bagay; likas at malinaw sa Tagalog ang “Alisin mo.”
- source_word: מֵעָלַי
  choice: sa akin
  rationale: Bagaman literal na may diwang “mula sa ibabaw ko,” mas natural sa Tagalog ang “sa akin,” at naipahihiwatig na ng salot na ito ay nakapatong o dumadagan sa nagsasalita.
- source_word: נִגְעֶךָ
  choice: iyong salot
  rationale: Maaaring tumukoy ang נגע sa salot, hagupit, o kapighatian. Pinananatili ng “salot” ang bigat at lawak ng salita nang hindi ito nililimitahan sa isang tiyak na sakit.
- source_word: מִתִּגְרַת
  choice: sa hagupit ng
  rationale: Ang תגרה ay nagpapahiwatig ng marahas o mapanlabang pagdaluhong. Sa pariralang kasama ang “kamay,” natural na ipinahahayag ng “hagupit” ang mapaminsalang pagkilos, habang itinatala sa talababa ang alternatibong “paglusob.”
- source_word: יָדְךָ
  choice: iyong kamay
  rationale: Pinananatili ang konkretong larawang Hebreo ng kamay bilang pagpapahayag ng pagkilos o kapangyarihan ng Diyos.
- source_word: אֲנִי כָלִיתִי
  choice: nalilipol ako
  rationale: Ang perfect ng כלה ay maaaring mangahulugang nauubos, nalilipol, o sumasapit sa wakas. Ipinahahayag ng “nalilipol ako” ang matinding pagkaubos ng salmista nang hindi ipinipilit na ganap na siyang patay.
theological_decisions:
- issue: Uri ng paghihirap na ipinahihiwatig ng נִגְעֶךָ
  choice: “iyong salot,” bilang kapighatiang tuwirang iniuugnay sa Diyos ngunit hindi tinutukoy kung sakit, parusa, o ibang uri ng paghihirap
  alternative: “iyong hagupit” o “iyong kapighatian”
  rationale: Malinaw sa talata na kinikilala ng salmista ang kamay ng Diyos sa kanyang paghihirap, ngunit hindi nililinaw ng Hebreo ang eksaktong anyo o layunin nito. Pinananatili ng salin ang tensiyong iyon.
- issue: Lakas ng מִתִּגְרַת יָדְךָ
  choice: “sa hagupit ng iyong kamay”
  alternative: “sa paglusob ng iyong kamay” o “dahil sa pakikipagtunggali ng iyong kamay”
  rationale: Ipinakikita ng parirala ang kamay ng Diyos bilang matinding puwersang dumadagan sa salmista. Ang “hagupit” ay natural at marangal sa Tagalog, ngunit hindi itinatanggi ang mas mapanlabang himig ng salitang Hebreo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang payak na pakiusap na “Alisin mo” at pinanatili ang larawang “iyong kamay.” Ang “nalilipol ako” ay may bigat na angkop sa panaghoy ngunit hindi nangangahulugang patay na ang nagsasalita.
