  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: tl
  text: Iligtas mo ako sa lahat ng aking mga pagsuway; huwag mo akong gawing tampulan ng paghamak ng hangal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag mo akong gawing kahihiyan ng isang hangal.” Maaaring tumukoy ang Hebreo sa pagiging tampulan ng paghamak ng hangal o sa pagiging isang kahihiyang nauugnay sa kahangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: sa lahat ng aking mga pagsuway
  rationale: Ang מִן kasama ng כָּל ay nagsasaad ng pagliligtas mula sa kabuuan ng mga pagkakasala ng nagsasalita. Ang “mga pagsuway” ay likas sa makabagong Tagalog at pinananatili ang diwa ng paglabag o paghihimagsik na nasa פֶּשַׁע.
- source_word: הַצִּילֵנִי
  choice: Iligtas mo ako
  rationale: Ang Hiphil imperative ng נצל ay humihiling na sagipin o ilayo ang nagsasalita mula sa kapahamakan; ang “iligtas” ay malinaw, marangal, at angkop sa panalangin.
- source_word: חֶרְפַּת
  choice: tampulan ng paghamak
  rationale: Ang חֶרְפָּה ay maaaring tumukoy sa paghamak, kahihiyan, o kadustaan. Sa pariralang ito, ang “tampulan ng paghamak” ay natural na naghahayag na ang salmista ang magiging objeto ng paghamak.
- source_word: נָבָל
  choice: hangal
  rationale: Ang נָבָל ay hindi lamang kulang sa talino kundi maaari ring magpahiwatig ng moral at espirituwal na kahangalan. Hindi na pinalawak ang salin upang hindi magdagdag ng interpretasyon sa pangunahing teksto.
- source_word: אַל תְּשִׂימֵנִי
  choice: huwag mo akong gawing
  rationale: Ang שׂים na may personal na layon ay maaaring mangahulugang ‘gawin’ o ‘ilagay bilang.’ Ang pariralang ito ang pinakanatural sa Tagalog sa kontekstong ang tao ay nagiging objeto ng paghamak.
theological_decisions:
- issue: Kahulugan ng pakiusap tungkol sa kahihiyan sa harap ng hangal
  choice: Humihiling ang salmista na huwag siyang hayaang maging tampulan ng paghamak ng isang taong hangal sa moral na diwa.
  alternative: Maaaring unawain ang parirala bilang paghiling na huwag siyang maging isang kahihiyang iniuugnay sa kahangalan o sa isang hangal.
  rationale: Ang construct phrase na חֶרְפַּת נָבָל ay tunay na maaaring magpahiwatig ng paghamak na nagmumula sa hangal o ng kahihiyang nauugnay sa hangal. Pinili sa pangunahing teksto ang mas natural na pagbasa na ang salmista ang objeto ng paghamak, habang pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “pagsuway” ay mas madaling maunawaan kaysa sa mas teknikal na “paglabag,” samantalang ang “tampulan ng paghamak” ay natural na ipinapakita ang relasyong honor-shame ng Hebreo. Inilagay ang [a] sa mismong teksto at pinanatili ang tunay na kalabuan sa talababa.
