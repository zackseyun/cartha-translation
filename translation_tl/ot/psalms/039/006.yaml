  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: tl
  text: Tunay ngang ang tao ay naglalakad-lakad na parang anino[a]; tunay ngang nagkakagulo sila nang walang kabuluhan[b]. Nag-iipon siya ng kayamanan, at hindi niya alam kung sino ang magtitipon ng mga iyon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na parang isang larawan,” “mistulang anyo lamang,” o “parang multo.” Literal na “larawan” ang salitang Hebreo; dito ay maaari itong tumukoy sa di-matatag at panandaliang pag-iral ng tao.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na maramihan ang pandiwang Hebreo: “sila ay nagkakagulo” o “sila ay balisang kumikilos.” Malamang na tumutukoy ito sa mga tao sa pangkalahatan matapos banggitin ang “tao” sa isahan.'
    reason: lexical_alternative
  - marker: c
    text: Literal na “kung sino ang magtitipon sa mga iyon,” na tumutukoy sa mga ari-ariang kanyang naipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: tunay ngang
  rationale: Inuulit ang katagang Hebreo upang idiin ang dalawang obserbasyon. Pinananatili ng “tunay ngang” ang diin at pag-uulit nang natural sa makabagong Tagalog.
- source_word: בְּצֶלֶם
  choice: na parang anino
  rationale: Literal na “sa isang larawan,” ngunit sa konteksto ay tumutukoy sa anyong walang katatagan o sustansiya. Malinaw na naihahatid ng “parang anino” ang larawan ng panandalian at hindi matibay na pag-iral, habang inilalahad sa talababa ang literal at iba pang posibleng pakahulugan.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: ang tao ay nagpaparoo't parito
  rationale: Ang anyong pandiwa ay nagpapahiwatig ng paglakad o pagkilos sa iba't ibang dako. Ang “nagpaparoo't parito” ay natural at masining, at ang “ang tao” ay maaaring kumatawan sa sangkatauhan nang hindi nawawala ang isahang anyo.
- source_word: הֶבֶל
  choice: nang walang kabuluhan
  rationale: Bagaman maaari itong mangahulugang “hininga,” “singaw,” o “kawalang-kabuluhan,” ginagamit ito rito upang ilarawan ang pagiging walang saysay ng kanilang balisang pagkilos.
- source_word: יֶהֱמָיוּן
  choice: abalang-abala sila
  rationale: Ang pandiwa ay maaaring tumukoy sa maingay, balisa, o magulong pagkilos. Ang “abalang-abala sila” ay natural sa Tagalog at angkop sa konteksto ng walang saysay na pag-iipon, habang pinananatili ang maramihang pandiwa ng Hebreo.
- source_word: יִצְבֹּר
  choice: nag-iipon siya ng kayamanan
  rationale: Ang pandiwa ay nangangahulugang magbunton o magtipon. Idinagdag ang “kayamanan” bilang ipinahihiwatig na layon mula sa konteksto at sa kasunod na hulaping maramihan.
- source_word: וְלֹא יֵדַע
  choice: ngunit hindi niya alam
  rationale: Ang “ngunit” ay malinaw na naghahayag ng kaibahan sa pagitan ng masikap na pag-iipon at kawalan niya ng kaalaman tungkol sa kahihinatnan nito.
- source_word: מִי אֹסְפָם
  choice: kung sino ang magtitipon ng mga iyon
  rationale: Pinananatili ang diwa ng pandiwang “magtipon” at ang maramihang hulaping “mga iyon,” na tumutukoy sa mga ari-ariang naipon.
theological_decisions:
- issue: Pangkalahatang pagtukoy ng אִישׁ sa sangkatauhan
  choice: ang tao
  alternative: isang lalaki
  rationale: Bagaman panlalaki at isahan ang anyong Hebreo, ginagamit ito rito bilang kinatawan ng karaniwang kalagayan ng tao. Ang “ang tao” ay natural sa Tagalog, isahan pa rin, at hindi nagdaragdag ng partikular na doktrinal na pagbasa.
- issue: Paglipat mula isahan tungo sa maramihan sa יֶהֱמָיוּן
  choice: siya … sila
  alternative: panatilihing isahan sa buong talata
  rationale: Pinananatili ang tunay na pagbabago ng bilang sa tekstong Hebreo sa halip na tahimik itong gawing pare-pareho. Maaaring tumukoy ang maramihan sa mga tao sa pangkalahatan matapos ilarawan ang kinatawang “tao” sa isahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang patulang pag-uulit ng “tunay ngang,” ang larawan ng panandaliang buhay, at ang kapansin-pansing paglipat ng Hebreo mula isahan tungo sa maramihan. Ginamit ang “nagpaparoo't parito” at “abalang-abala” bilang likas na mga pahayag sa Tagalog nang hindi pinapawi ang ambiguwidad ng pinagmulan.
