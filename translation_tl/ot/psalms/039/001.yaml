base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: tl
  text: Sinabi ko, “Babantayan ko ang aking mga gawi upang hindi ako magkasala sa pamamagitan ng aking dila; lalagyan ko ng busal ang aking bibig habang nasa harapan ko ang masama[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang masamang tao.” Panlalaking isahan ang anyong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Sinabi ko
  rationale: Tuwirang salin ng Qal perfect, unang panauhang isahan, na nagpapakilala sa naunang pasiya ng mang-aawit nang hindi dinaragdagan ng interpretasyong ‘nagpasya ako.’
- source_word: אֶשְׁמְרָה
  choice: Babantayan ko / pananatilihin ko
  rationale: Nagpapahayag ang anyong ito ng matibay na hangarin. Ang ‘babantayan’ ay angkop sa mga gawi; ang ‘pananatilihin’ naman ay likas sa Filipino kasama ng larawang busal, habang pinananatili ang diwa ng maingat na pagpipigil.
- source_word: דְרָכַי
  choice: ang aking mga gawi
  rationale: Ang pangmaramihang ‘mga daan’ ay idyoma para sa asal o paraan ng pamumuhay. Mas malinaw sa karaniwang mambabasa ang ‘mga gawi’ kaysa sa literal na ‘mga daan’ o ‘mga lakad.’
- source_word: מֵחֲטוֹא
  choice: upang hindi ako magkasala
  rationale: Ipinahihiwatig ng מן kasama ng infinitive construct ang pag-iwas o pagpigil sa pagkakasala.
- source_word: בִלְשׁוֹנִי
  choice: sa pamamagitan ng aking dila
  rationale: Pinananatili nito ang ‘dila’ bilang kasangkapan ng posibleng pagkakasala at hindi ito agad pinapalitan ng mas abstraktong ‘pananalita.’
- source_word: מַחְסוֹם
  choice: busal
  rationale: Kongkretong kagamitang pampigil ang tinutukoy; pinananatili ng ‘busal’ ang matingkad na larawan ng Hebreo.
- source_word: בְּעוֹד
  choice: habang
  rationale: Likas na ipinahahayag sa Filipino ang magkasabay na panahon.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Substantibong panlalaking isahan ang anyong Hebreo. Ang ‘ang masama’ ay likas at marangal sa Filipino at hindi nagdaragdag ng pangngalang wala sa teksto.
- source_word: לְנֶגְדִּי
  choice: nasa harapan ko
  rationale: Tumpak na ipinahahayag ang presensiya ng masama sa harap ng mang-aawit at dinaragdagan lamang ng kopulang kailangan sa natural na Filipino.
theological_decisions:
- issue: Kasarian at bilang ng רָשָׁע
  choice: ang masama
  alternative: ang masamang tao / ang masamang lalaki
  rationale: Panlalaking isahan ang anyong Hebreo, ngunit walang gramatikal na kasarian ang katumbas na substantibong Filipino na ‘ang masama.’ Hindi idinaragdag ang ‘lalaki,’ sapagkat walang hiwalay na pangngalang ‘lalaki’ sa Hebreo; ipinapaliwanag sa talababa ang tunay na anyo at posibleng salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kongkretong larawan ng dila at busal, ngunit isinalin ang idyomang ‘aking mga daan’ bilang ‘aking mga gawi’ upang malinaw na tumukoy sa asal o pamumuhay.
