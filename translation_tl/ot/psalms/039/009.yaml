  text: I am mute[a]; I do not open my mouth[b], because you have done it.
translation:
  language: tl
  text: Nananahimik ako[a]; hindi ko binubuka ang bibig ko, sapagkat ikaw ang gumawa nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Napatahimik ako” o “Tahimik ako.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “sapagkat ikaw ang gumawa,” na walang tahasang binanggit na layon.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Hindi ako umiimik
  rationale: Ang Niphal ng אלם ay maaaring magpahiwatig ng pagiging tahimik o napatahimik. Likas sa modernong Tagalog ang “hindi ako umiimik” at pinananatili nito ang resultang kalagayan nang hindi tahasang nagdaragdag ng isang ahenteng nagpatahimik.
- source_word: לֹא אֶפְתַּח פִּי
  choice: hindi ko ibinubuka ang aking bibig
  rationale: Pinananatili ang Hebreong idyoma na פתח + “aking bibig” para sa pagsasalita. Ang aspektong di-ganap ay isinalin bilang kasalukuyang kilos o paninindigan ayon sa konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita ang ugnayang sanhi habang nananatiling marangal at natural ang himig.
- source_word: אַתָּה
  choice: ikaw ang
  rationale: Tahas at binibigyang-diin sa Hebreo ang panghalip. Ang ayos na “ikaw ang” ay likas na paraan sa Tagalog upang mapanatili ang diin.
- source_word: עָשִׂיתָ
  choice: gumawa nito
  rationale: Malawak ang kahulugan ng עשה, “gumawa” o “kumilos.” Idinagdag ang “nito” bilang likas na layon sa Tagalog, ngunit ipinaliliwanag sa talababa na walang tahasang layon sa Hebreo.
theological_decisions:
- issue: Di-tahas na layon ng עָשִׂיתָ at ang pagkilos ng Diyos
  choice: sapagkat ikaw ang gumawa nito
  alternative: sapagkat ikaw ay kumilos
  rationale: Kinikilala ng salin ang pagkilos ng Diyos sa kalagayang tinutukoy ng salmista ngunit hindi nito nililinaw nang higit sa sinasabi ng Hebreo kung ano mismo ang ginawa. Sa gayon, nananatili ang tensiyon ng teksto tungkol sa pagkilos ng Diyos.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Pinanatili ang pag-uulit tungkol sa pananahimik at hindi pagbubuka ng bibig, gayundin ang diin sa “ikaw,” nang hindi labis na ipinapaliwanag ang sanhi ng paghihirap.
