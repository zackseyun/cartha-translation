translation:
  language: tl
  text: At ngayon, Panginoon, ano ang hinihintay ko?[a] Nasa iyo ang pag-asa ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas pormal: “At ngayon, Panginoon, ano ang aking inasahan?” Ang pandiwang Hebreo na קוה ay maaaring tumukoy kapwa sa paghihintay at sa pag-asa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang temporal na עַתָּה, habang likas ang daloy sa modernong Tagalog.
- source_word: מַה
  choice: ano pa
  rationale: Ang מַה ay interrogatibong panghalip. Idinagdag ang “pa” upang natural na maipahayag sa Tagalog ang retorikal na tanong tungkol sa anumang nalalabi pang hinihintay, nang hindi binabago ang diwa.
- source_word: קִוִּיתִי
  choice: hinihintay ko
  rationale: Ang קוה ay maaaring mangahulugang maghintay nang may pananabik o umasa. Ang “hinihintay ko” ay nagpapanatili sa larawan ng paghihintay, samantalang nililinaw ng kasunod na “pag-asa ko” ang kaugnay na diwa ng pag-asa.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Karaniwang marangal at malinaw na salin sa Tagalog ng banal na titulong אֲדֹנָי.
- source_word: תּוֹחַלְתִּי
  choice: ang pag-asa ko
  rationale: Likas na salin ng pangngalang tumutukoy sa pag-asa o inaasahan, at angkop sa personal na pagtitiwala ng salmista.
- source_word: לְךָ הִיא
  choice: Nasa iyo
  rationale: Ipinahahayag nang natural sa Tagalog ang direksiyon at pinagtutuunan ng pag-asa. Ang hiwalay na panghalip na הִיא ay gumaganap bilang pagpapatibay o panumbalik sa pambabaeng pangngalan na תּוֹחַלְתִּי; hindi kailangang tumbasan nang hiwalay sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: Panginoon ko
  rationale: Bagaman may makasaysayang anyong unang panauhang hulapi, ang אֲדֹנָי ay ginagamit dito bilang karaniwang mapitagang titulo para sa Diyos. Pinananatili ng “Panginoon” ang titularyong gamit nang hindi ipinipilit ang “ko.”
- issue: Ugnayan ng paghihintay at pag-asa sa קוה
  choice: hinihintay ko
  alternative: inaasahan ko
  rationale: Pinananatili sa pangunahing teksto ang konkretong diwa ng paghihintay, habang ang kasunod na תּוֹחַלְתִּי ay isinasaling “pag-asa ko.” Sa ganitong paraan, nananatili ang makahulugang tensiyon at pag-uugnay ng dalawang konsepto sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Ginamit ang payak at madaling maunawaang ayos na “ano pa ang hinihintay ko?” at ang nakaugaliang banal na titulong “Panginoon.”
