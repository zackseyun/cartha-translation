  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: tl
  text: 'Ipaalam mo sa akin, Yahweh, ang aking wakas

    at kung ano ang sukat ng aking mga araw;

    upang malaman ko kung gaano ako kabilis maglaho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung gaano ako karupok” o “kung gaano ako kapansamantala.” Maikli at maraming posibleng diin ang pananalitang Hebreo; maaari nitong bigyang-diin ang karupukan ng tao o ang ikling tagal ng kanyang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: Ipaalam mo sa akin
  rationale: Ang Hiphil imperative ng ידע na may hulaping unang panauhan ay sanhiin ang pagk知alam. Pinananatili ng “Ipaalam mo sa akin” ang ganitong puwersa at natural ito sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ng isang titulo.
- source_word: קִצִּי
  choice: ang aking wakas
  rationale: Ang קֵץ ay tumutukoy sa wakas o hangganan. Ang “aking wakas” ay nagpapanatili sa tuwirang pahayag tungkol sa katapusan ng buhay nang hindi dinaragdagan ng ideya ng itinakdang kapalaran.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: at kung ano ang sukat ng aking mga araw
  rationale: Pinananatili ng “sukat” ang larawan ng מִדָּה; ipinahihiwatig nito ang haba o hangganan ng buhay nang hindi ito pinapaliit sa bilang lamang ng mga araw.
- source_word: אֵדְעָה
  choice: nang malaman ko
  rationale: Ipinapahayag ng cohortative ang layunin o ninanais na bunga ng naunang pakiusap. Likas sa Tagalog ang sugnay na “nang malaman ko.”
- source_word: מֶה חָדֵל אָֽנִי
  choice: kung gaano ako kadaling lumipas
  rationale: Maikli at hindi ganap na tiyak ang pariralang Hebreo. Sa konteksto, ang salin ay nagpapahayag ng pagiging panandalian ng tao, habang inilalahad sa talababa ang posibleng diin sa karupukan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang larawang “sukat ng aking mga araw” at ang pag-uulit ng ideya ng pagkaalam sa Hebreo. Inilagay ang talababa sa mismong pariralang may leksikal na kalabuan.
