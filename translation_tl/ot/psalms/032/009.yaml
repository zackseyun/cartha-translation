base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: tl
  text: Huwag kayong maging gaya ng kabayo o mula, na walang pang-unawa, na ang bokado at renda ay ginagamit upang pigilan ito; kung hindi, hindi ito lalapit sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang hindi ito lumapit sa iyo.” Mahirap unawain ang huling sugnay sa Hebreo. Maaaring ang ibig sabihin ay ayaw lumapit ng hayop malibang pigilan, o kailangan itong pigilan upang hindi ito sumugod o lumapit.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Huwag kayong maging
  rationale: Ang אַל na sinusundan ng imperfect/jussive ng היה ay nagpapahayag ng pagbabawal. Pinananatili ng maramihang “kayong” ang anyong Hebreo.
- source_word: כְּסוּס כְּפֶרֶד
  choice: gaya ng kabayo o mola
  rationale: Tuwirang pinananatili ang dalawang paghahambing; ang “mola” ang karaniwang makabagong tawag sa פֶרֶד.
- source_word: אֵין הָבִין
  choice: na walang pang-unawa
  rationale: Natural sa Filipino at pinananatili ang diwang kakulangan sa pag-unawa o pagkilala.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: sa pamamagitan ng bokado at renda
  rationale: Ang מֶתֶג ay kagamitang inilalagay sa bibig upang kontrolin ang hayop, at ang רֶסֶן ay renda o panali na ginagamit sa pagpipigil. Ang pares ay malinaw sa kontekstong Filipino.
- source_word: עֶדְיוֹ לִבְלֹם
  choice: Kailangang pigilan ito
  rationale: Bagaman ang עֶדְיוֹ ay literal na maaaring mangahulugang palamuti o kasangkapang isinusuot, sa konteksto tumutukoy ito sa kagamitang panupil. Isinaayos ang pangungusap upang maging natural nang hindi inaalis ang larawan ng bokado at renda.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: kung hindi, hindi ito lalapit sa iyo
  rationale: 'Ito ang pangunahing pagbasa sa mahirap na sugnay: hindi lalapit ang hayop malibang supilin. Pinananatili ang isahang “ito” at isahang “iyo” ng Hebreo.'
theological_decisions:
- issue: Kawalang-linaw ng huling sugnay
  choice: kung hindi, hindi ito lalapit sa iyo
  alternative: upang hindi ito lumapit sa iyo
  rationale: Maaaring ipakahulugan ang Hebreo na tumatangging lumapit ang hayop kung hindi pipigilin, o na kailangan itong pigilin upang hindi ito sumugod o lumapit. Hindi tiyak ang sintaks, kaya inilagay ang alternatibo sa talababa sa halip na lutasin ito nang tahimik.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bokado” bilang tiyak na katawagan sa bit ng kabayo at “renda” para sa bridle/reins; iniiwasan ang sobrang teknikal o makalumang ayos. Ang maramihang kausap at isahang larawan ng hayop ay kapwa pinanatili.
