  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: tl
  text: Ikaw ang aking taguan; iniingatan mo ako mula sa kapighatian; pinalilibutan mo ako ng mga sigaw ng pagliligtas.[a] Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga awit ng pagliligtas” o “matitining na sigaw ng pagsagip.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Selah” ay malamang na isang tandang pangmusika o panliturhiya; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: taguan
  rationale: Tumutukoy sa isang lugar na mapagtataguan at mapoprotektahan; natural sa Filipino at pinananatili ang kongkretong larawan ng kanlungan.
- source_word: מִצַּר
  choice: sa kapighatian
  rationale: Ang צַר ay maaaring tumukoy sa kagipitan, kapighatian, o makitid na kalagayan. Ang 'sa kapighatian' ay hindi labis na tumutukoy sa isang personal na kaaway.
- source_word: תִּצְּרֵנִי
  choice: iniingatan mo ako
  rationale: Ang נצר ay nangangahulugang ingatan, bantayan, o panatilihing ligtas. Malinaw at likas ang 'iniingatan' sa modernong Filipino.
- source_word: רָנֵּי
  choice: mga sigaw
  rationale: Ang anyo ay tumutukoy sa matitining o masayang hiyaw. Pinananatili ng 'mga sigaw' ang lakas ng tunog nang hindi ipinapalagay na pormal na mga awit ang tinutukoy.
- source_word: פַלֵּט
  choice: pagliligtas
  rationale: Nagpapahayag ito ng paglaya o pagsagip mula sa panganib. Ang 'pagliligtas' ay natural sa pariralang Filipino at hindi nililimitahan ang uri ng pagsagip.
- source_word: תְּסוֹבְבֵנִי
  choice: pinalilibutan mo ako
  rationale: Direktang pinananatili ang larawang ang nagsasalita ay napapaligiran ng mga sigaw ng pagliligtas.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong ito, kaya tinumbasan ito sa baybay sa halip na bigyan ng mapangahas na interpretasyon.
theological_decisions:
- issue: Kalikasan at pinagmumulan ng “mga sigaw ng pagliligtas”
  choice: Isinalin bilang “mga sigaw ng pagliligtas” nang hindi tinutukoy kung sino ang sumisigaw.
  alternative: mga awit ng pagliligtas; masasayang hiyaw ng pagsagip
  rationale: Siksik at malabo ang tambalang רָנֵּי פַלֵּט. Pinananatili ng salin ang posibilidad ng masayang mga sigaw o awit at hindi ipinapalagay kung ang Diyos, ang mananamba, o ang ibang tao ang pinagmumulan ng mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'taguan' upang mapanatili ang kongkretong talinghaga, at ang 'kapighatian' upang ihayag ang panganib nang hindi ito labis na tinutukoy. Ang ayos ng mga sugnay ay malapit sa Hebreo ngunit likas pa ring basahin sa Filipino.
