  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: tl
  text: Magalak kayo kay Yahweh at magsaya, kayong mga matuwid; sumigaw kayo sa tuwa[a], kayong lahat na may matuwid na puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umaawit kayo sa tuwa.” Ang pandiwang Hebreo ay maaaring tumukoy sa matunog na sigaw o awit ng kagalakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Magalak kayo
  rationale: Pautos na maramihan mula sa שׂמח. Ang “magalak” ay likas at marangal sa Filipino at naihihiwalay sa kasunod na גיל.
- source_word: בַיהוָה
  choice: kay Yahweh
  rationale: Ang ב ay tumutukoy sa Diyos bilang pinagtutuunan o pinagmumulan ng kagalakan. Sa Filipino, mas natural ang “kay Yahweh” kaysa literal na “sa loob ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang YHWH ayon sa Hebreong teksto, sa halip na palitan ito ng isang titulo.
- source_word: וְגִילוּ
  choice: at magsaya
  rationale: Ang גיל ay nagpapahayag ng masiglang kagalakan. Malinaw at natural ang “magsaya” habang pinananatiling iba ang salita sa שׂמח.
- source_word: צַדִּיקִים
  choice: kayong mga matuwid
  rationale: Ginagamit bilang tuwirang pagtawag sa mga tumatanggap ng mga utos; malinaw itong naipahahayag ng “kayong mga matuwid.”
- source_word: וְהַרְנִינוּ
  choice: sumigaw kayo sa tuwa
  rationale: Ang Hiphil na pautos mula sa רנן ay tumutukoy sa matunog na pagpapahayag ng tuwa, na maaaring isigaw o awitin. Hindi ipinapalagay ng pangunahing salin na ito ay tiyak na pag-awit.
- source_word: כָּל
  choice: lahat
  rationale: Saklaw nito ang buong pangkat na tinutukoy.
- source_word: יִשְׁרֵי לֵב
  choice: may matuwid na puso
  rationale: Pinananatili ang larawang Hebreo tungkol sa panloob na katapatan at moral na integridad, sa paraang natural sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang nasa Hebreong teksto. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON,” nang hindi nagdaragdag ng sektaryong pagpapakahulugan.
- issue: Saklaw ng katuwiran sa יִשְׁרֵי לֵב
  choice: may matuwid na puso
  alternative: mga tapat; mga taos-puso
  rationale: Pinananatili ang tahasang banggit sa puso at ang moral na diwa ng “matuwid,” sa halip na paliitin ito sa katapatan o sinseridad lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatugmang pautos na “Magalak,” “magsaya,” at “sumigaw” upang mapanatili ang pag-unlad at tindi ng tatlong pandiwang Hebreo. Ang personal na pangalang “Yahweh” ay pinanatili.
