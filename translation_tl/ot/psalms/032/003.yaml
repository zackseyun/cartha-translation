  text: Nang manahimik ako, nanghina ang aking mga buto sa aking pagdaing[a] buong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa aking pag-ungal.” Ang salitang Hebreo ay maaaring tumukoy sa malakas na sigaw na gaya ng ungol ng leon; dito, malamang na inilalarawan nito ang matinding pagdaing.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat nang
  rationale: Pinagsasama nito ang paliwanag na diwa ng כִּי at ang pangyayaring ipinahihiwatig ng kasunod na ganap na pandiwa, sa likas na ayos ng Tagalog.
- source_word: הֶחֱרַשְׁתִּי
  choice: manahimik ako
  rationale: Ipinahahayag ang patuloy na pananahimik ng salmista nang hindi idinaragdag sa talata kung ano ang hindi niya ipinagtapat.
- source_word: בָּלוּ
  choice: nanghina
  rationale: Sa kaugnayan ng mga buto, natural nitong naihahatid ang pagkaubos ng lakas o pagkapanghina, bagaman maaari ring unawain ang Hebreo bilang pagkasira o pagkaluma.
- source_word: עֲצָמָי
  choice: ang aking mga buto
  rationale: Pinananatili ang kongkretong larawang pangkatawan ng Hebreong tula.
- source_word: בְּשַׁאֲגָתִי
  choice: dahil sa pagdaing ko
  rationale: Ang pang-ukol ay nagpapakita ng kasabay na sanhi o paraan, at ang שׁאגה ay tumutukoy rito sa malakas at matinding pagdaing.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Likas at makabagong Tagalog para sa tuloy-tuloy na tagal sa maghapon.
theological_decisions:
- issue: Kung tahasang sasabihing ang pananahimik ay tungkol sa kasalanang hindi ipinagtapat
  choice: Hindi tinukoy sa pangunahing teksto ang layon ng pananahimik.
  alternative: Nang manahimik ako tungkol sa aking kasalanan
  rationale: Ipinahihiwatig ito ng konteksto, ngunit walang tahasang layon ang pandiwa sa Hebreong talata; pinananatili ang pagkakabitin at hinahayaang ang konteksto ang magpaliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang “mga buto” at ang hindi tahasang pagbanggit sa kasalanan. Inilagay ang talababa pagkatapos ng buong talata dahil nililinaw nito ang pariralang “pagdaing ko.”
