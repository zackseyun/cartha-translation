  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: tl
  text: 'Sapagkat araw at gabi,

    mabigat na nakadagan sa akin ang iyong kamay;

    ang aking sigla[a] ay natuyo

    sa matinding init ng tag-araw.[b]

    Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katas ng aking katawan” o “lakas-buhay ko.” Hindi tiyak ang kahulugan ng bihirang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga tagtuyot ng tag-araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikitang ang talata ay nagbibigay ng dahilan o paliwanag sa naunang pahayag, nang hindi dinaragdagan ang diwa.
- source_word: יוֹמָם וָלַיְלָה
  choice: araw at gabi
  rationale: Pinananatili ang Hebreong merismo na nagpapahiwatig ng walang tigil o tuloy-tuloy na tagal.
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: mabigat sa akin ang iyong kamay
  rationale: Pinananatili ang kongkretong larawan ng kamay ng Diyos na mabigat na nakadagan sa mang-aawit.
- source_word: נֶהְפַּךְ
  choice: ay natuyo
  rationale: Bagaman literal na nangangahulugang ‘nabago’ o ‘naging iba,’ ipinahihiwatig ng kasunod na larawan ng tag-araw ang pagkaubos o pagkatuyo; natural itong naipahahayag sa Filipino bilang ‘natuyo.’
- source_word: לְשַׁדִּי
  choice: ang aking sigla
  rationale: Ang bihirang salita ay maaaring tumukoy sa katas o likido ng katawan at, sa talinghaga, sa lakas-buhay. Ang ‘sigla’ ay malinaw at natural habang inilalahad sa talababa ang literal na alternatibo.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: sa matinding init ng tag-araw
  rationale: Ipinahahayag ang nakapapasong init at pagkatuyot na kaugnay ng חַרְבוֹן; ang mas literal na ‘mga tagtuyot ng tag-araw’ ay pinananatili sa talababa.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinananatiling hindi isinalin dahil hindi tiyak ang eksaktong kahulugan nito bilang panandang pangmusika o panliturhiya.
theological_decisions:
- issue: Pagkilos ng Diyos sa paghihirap ng mang-aawit
  choice: Tahasang pinananatili na mabigat sa mang-aawit ang kamay ng Diyos.
  alternative: Pangkalahatang paghihirap na walang malinaw na pagkilos ng Diyos, o isang mas tiyak na doktrina ng tuwirang kaparusahang banal.
  rationale: Malinaw na binabanggit ng Hebreo ang kamay ng Diyos, ngunit hindi ipinaliliwanag ng talata ang buong paraan o layunin ng paghihirap. Kaya pinananatili ang banal na pagkilos nang hindi nagdaragdag ng sistematikong paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang patulang ayos, ang metapora ng mabigat na kamay, at ang salitang “Selah.”
