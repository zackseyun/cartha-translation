  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: tl
  text: Kaya manalangin sa iyo ang bawat taong tapat sa panahong maaari kang matagpuan[a]; tunay na sa pagragasa ng maraming tubig[b], hindi siya maaabot ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang maaari kang matagpuan.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa baha ng maraming tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Kaya
  rationale: Likas na ipinapahayag ang ugnayang bunga o hinuha mula sa naunang pagtatapat at kapatawaran.
- source_word: יִתְפַּלֵּל
  choice: manalangin
  rationale: Ginamit na may himig ng paghikayat, alinsunod sa jussive/exhortative na puwersa ng imperfect sa konteksto.
- source_word: כָּל חָסִיד
  choice: ang bawat tapat
  rationale: Ipinahihiwatig ng חָסִיד ang taong may katapatan at debosyon sa Diyos; ang “tapat” ay maikli, kasalukuyan, at hindi eklesiyastikal.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Pinananatili ang tuwirang patutunguhan ng panalangin nang hindi idinaragdag ang pangalang hindi lantad sa Hebreo.
- source_word: לְעֵת מְצֹא
  choice: sa panahong matatagpuan ka
  rationale: Pinananatili ang karaniwang pasibong pagkaunawa sa parirala at ang posibilidad ng panahong bukás ang paglapit sa Diyos.
- source_word: רַק
  choice: tunay na
  rationale: Ipinapahayag ang nagpapatibay na puwersa ng particle sa halip na ang literal ngunit di-angkop na “lamang.”
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: sa pagragasa ng maraming tubig
  rationale: Malapit sa anyo at matinding larawang patula ng Hebreo, nang hindi tahasang nilulutas kung literal o metaporikal ang mga tubig.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinananatili ang pang-isahang reperensiya sa taong tapat, na siyang pinakamalapit na sintaktikong tinutukoy.
- source_word: לֹא יַגִּיעוּ
  choice: hindi iyon aabot
  rationale: Ang “aabot” ay tuwirang naghahatid ng ideya ng pagdating o pagdikit; ang “iyon” ay tumutukoy sa kolektibong pagragasa ng maraming tubig.
theological_decisions:
- issue: Tinutukoy ng pangakong pag-iingat
  choice: Pinanatiling patulang larawan ang pagragasa ng maraming tubig na hindi aabot sa taong nananalangin.
  alternative: Tahasang tukuyin ito bilang literal na baha o bilang simbolo lamang ng kapighatian o paghuhukom.
  rationale: Ang אֵלָיו ay sintaktikong tumutukoy sa taong tapat, ngunit hindi nililinaw ng talata kung literal o metaporikal ang mga tubig; kaya hindi ito nilutas sa salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pang-isahang kinatawang “bawat tapat” at ang matinding larawang patula ng baha, habang iniwasan ang denominasyonal na terminong “banal” o “santo.”
