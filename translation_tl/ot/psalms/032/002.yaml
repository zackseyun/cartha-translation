base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: tl
  text: Mapalad ang taong[a] hindi ibinibilang ni Yahweh ang kasamaan[b] laban sa kaniya, at walang pandaraya sa kanyang espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “tao” ay isahan ngunit pangkalahatan ang kahulugan: sinumang tao, hindi lalaki lamang.'
    reason: paglilinaw_sa_pangkalahatang_reperensiya
  - marker: b
    text: Maaari ring isalin na “kasalanan” o “sala.” Maaaring saklawin ng salitang Hebreo ang masamang gawa at ang pananagutang dulot nito.
    reason: leksikal_na_alternatibo
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ang anyong maramihan sa Hebreo ay isang idyomatikong pahayag ng beatitud. Ang “Mapalad” ay likas, marangal, at higit na angkop kaysa sa “Masaya,” na maaaring tumukoy lamang sa damdamin.
- source_word: אָדָם
  choice: ang tao
  rationale: Bagaman panlalaking isahan ang anyo, pangkalahatan ang puwersa nito at tumutukoy sa isang indibidwal na kumakatawan sa sinumang tao. Likas sa modernong Tagalog ang “tao” at hindi nito ginagawang lalaki lamang ang tinutukoy.
- source_word: יַחְשֹׁב ... לּוֹ
  choice: ibinibilang ... sa kaniya
  rationale: Pinananatili nito ang metapora ng pagtutuos o pagtatala habang nananatiling malinaw at karaniwan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עָוֹן
  choice: kasamaan
  rationale: Maaaring tumukoy ang salita sa baluktot na gawa, kasalanan, o pananagutang bunga nito. Ang “kasamaan” ay nagpapanatili ng moral na bigat nang hindi ganap na nilulutas kung ang diin ay nasa gawa o sa sala.
- source_word: בְּרוּחוֹ
  choice: sa espiritu niya
  rationale: Pinananatili ang panloob at disposisyonal na diwa ng רוּחַ at ang kaugnayan nito sa taong binanggit sa unang sugnay.
- source_word: רְמִיָּה
  choice: pandaraya
  rationale: Malinaw at kasalukuyang Tagalog ito para sa panlilinlang o pagiging mapanlinlang; iniiwasan nito ang labis na makaluma o teknikal na pananalita.
theological_decisions:
- issue: Pangkalahatang gamit ng panlalaking isahan na אָדָם
  choice: ang tao
  alternative: ang lalaki
  rationale: Pangkalahatan ang reperensiya sa konteksto. Ang “tao” ay tumpak sa kahulugan at natural sa Tagalog nang hindi nililimitahan ang pangako sa mga lalaki.
- issue: Metapora ng hindi pagbibilang ng Diyos
  choice: hindi ibinibilang ni Yahweh sa kaniya ang kasamaan
  alternative: hindi siya pinararatangan ni Yahweh dahil sa kasalanan
  rationale: Pinananatili ng napiling salin ang metapora ng pagtutuos sa Hebreo at hindi ito pinapasan ng mas huling sistematikong terminolohiya.
- issue: Saklaw ng עָוֹן
  choice: kasamaan
  alternative: kasalanan; sala
  rationale: Hindi tiyak kung ang diin ay nasa masamang gawa, kasalanan, o pananagutan. Inilalagay sa talababa ang mga lehitimong alternatibo upang hindi tahimik na lutasin ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Mapalad” bilang likas na anyo ng beatitud, “Yahweh” para sa banal na pangalan, at tuwirang ayos ng pangungusap upang mapanatili ang paralelismo at teolohikal na tensiyon ng Hebreo.
