  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: tl
  text: 'Kay David.[a] Isang Maskil.[b]


    Mapalad ang taong ang kanyang pagsuway ay pinatawad,[c]

    at ang kanyang kasalanan ay tinakpan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pariralang isinaling “Kay David” ay maaaring mangahulugang ni David, para kay David, o kaugnay ni David.
    reason: textual_ambiguity
  - marker: b
    text: 'Hebreo: Maskil, isang katawagan sa pamagat ng awit na hindi tiyak ang eksaktong kahulugan; maaaring tumukoy sa isang akdang nagtuturo o mapagnilay.'
    reason: cultural_note
  - marker: c
    text: Sa literal, “ibinuhat” o “dinala palayo,” bilang larawan ng pagpapatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Ang לְ sa pamagat ng awit ay maaaring magpahiwatig ng may-akda, kaugnayan, o pag-aalay. Ang “Kay David” ay maikli at hindi tahasang nagpapasiya kung alin dito ang ibig sabihin.
- source_word: מַשְׂכִּיל
  choice: Isang Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan at gamit ng terminong ito sa pamagat. Pinanatili ang transliterasyon upang maiwasan ang pagbibigay ng di-tiyak na pakahulugan bilang tiyak.
- source_word: אַשְׁרֵי
  choice: Mapalad ang taong
  rationale: Ang anyo ay isang pahayag ng mabuting kalagayan o pagpapala. Likas sa makabagong Tagalog ang “Mapalad,” at pinananatili ng “ang taong” ang pangkalahatang isahan nang hindi nililimitahan sa lalaki.
- source_word: נְשׂוּי
  choice: pinatawad
  rationale: Mula ito sa pandiwang nangangahulugang “buhatin” o “dalhin.” Kapag kasalanan o pagsuway ang layon, idiomatiko itong tumutukoy sa pagpapatawad; inilagay sa talababa ang literal na larawan.
- source_word: פֶּשַׁע
  choice: pagsuway
  rationale: Ipinahihiwatig nito ang kusang paglabag o paghihimagsik. Ang “pagsuway” ay malinaw at natural, at angkop sa paralelismo sa “kasalanan.”
- source_word: כְּסוּי
  choice: tinakpan
  rationale: Pinananatili ng “tinakpan” ang konkretong talinghaga ng Hebreo at ang paralelismo nito sa “pinatawad.”
- source_word: חֲטָאָה
  choice: kasalanan
  rationale: Sa paralelismo nito sa פֶּשַׁע, malinaw na moral na kasalanan ang tinutukoy, hindi handog para sa kasalanan.
theological_decisions:
- issue: Pangkalahatang isahan sa pahayag ng pagkamapalad
  choice: Mapalad ang taong...
  alternative: Mapalad ang mga taong... / Mapalad ang lalaki...
  rationale: Pinananatili nito ang kinatawang isahan ng Hebreo nang hindi ginagawang panlalaki ang pangkalahatang tinutukoy.
- issue: Hindi tiyak na kahulugan ng מַשְׂכִּיל
  choice: Panatilihin bilang “Maskil” sa pangunahing teksto
  alternative: Awit na nagtuturo / awit na mapagnilay
  rationale: Hindi tiyak kung genre, panuto, o katawagang musikal-liturgical ang termino. Ang transliterasyon at talababa ay nagpapanatili sa tunay na kawalang-katiyakan.
- issue: Talinghaga ng pagtakip sa kasalanan
  choice: ang kanyang kasalanan ay tinakpan
  alternative: ang kanyang kasalanan ay pinatawad / inilihim
  rationale: Pinananatili ang sariling talinghaga ng ikalawang hanay at hindi ito ipinapantay nang lubos sa naunang “pinatawad.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mapalad” bilang likas na anyo ng beatitude, at pinanatili ang maikling estilong patula at ang paralelismo ng dalawang hanay.
