  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: tl
  text: 'Ipinaalam ko sa iyo ang aking kasalanan,

    at hindi ko ikinubli ang aking kasamaan.

    Sinabi ko, “Ipagtatapat ko kay Yahweh ang aking mga pagsuway,”

    at pinatawad mo ang sala ng aking kasalanan.[a]

    Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iniangat mo” o “pinasan mo” ang sala ng aking kasalanan; inilalarawan ng pandiwa ang pag-aalis ng isang pasanin at sa ganitong gamit ay nangangahulugang “pinatawad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: aking kasalanan
  rationale: Ang חטאת ay karaniwang tumutukoy sa kasalanan o pagkakasala. Ang “kasalanan” ang pinakadirekta at natural na katumbas sa modernong Tagalog.
- source_word: אוֹדִיעֲךָ
  choice: Ipinaalam ko sa iyo
  rationale: Ang Hiphil ng ידע ay nangangahulugang “ipaalam” o “ipakilala.” Pinananatili ng salin ang causative na diwa ng Hebreo.
- source_word: עֲוֺנִי
  choice: aking kasamaan
  rationale: Maaaring tukuyin ng עון ang kasamaan, sala, o bigat ng pananagutan. Dito, ang “kasamaan” ay nagpapanatili ng pagkakaiba nito sa חטאת (“kasalanan”) at פשע (“pagsuway”).
- source_word: כִסִּיתִי
  choice: hindi ko ikinubli
  rationale: Literal na “tinakpan” ang כסה, ngunit ang “ikinubli” ay natural na Tagalog para sa talinghagang hindi pagtatago ng kasalanan.
- source_word: אוֹדֶה
  choice: Ipagtatapat ko
  rationale: Sa kontekstong ang tinutukoy ay mga pagsuway, ang Hiphil ng ידה ay nangangahulugang magtapat, hindi magpasalamat.
- source_word: עֲלֵי פְשָׁעַי
  choice: ang aking mga pagsuway
  rationale: Sa ganitong pahayag ng pagtatapat, minamarkahan ng על ang bagay na ipinagtatapat. Ang “mga pagsuway” ay nagpapanatili sa diwa ng sadyang paglabag ng פשע.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinalin ang personal na pangalang יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: נָשָׂאתָ
  choice: pinatawad mo
  rationale: Ang נשא ay literal na “iangat” o “pasanin,” ngunit kapag kasalanan o sala ang layon, karaniwan nitong ipinahahayag ang pagpapatawad. Inilagay sa talababa ang literal na larawan.
- source_word: עֲוֺן חַטָּאתִי
  choice: ang sala ng aking kasalanan
  rationale: 'Pinananatili ang patong-patong na pananalita ng construct chain: ang עון bilang sala o pananagutang kaugnay ng חטאת, sa halip na lubusang pagsamahin ang dalawang termino.'
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan at gamit ng termino, kaya tinumbasan ito sa baybay sa halip na bigyan ng mapagpasyang interpretasyon.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kung literal o idyomatiko ang נשא עון
  choice: pinatawad mo
  alternative: inalis mo; pinasan mo ang sala
  rationale: Malinaw sa konteksto na pagpapatawad ang idyomatikong diwa. Gayunman, pinananatili sa talababa ang tunay na larawan ng pag-angat o pagpasan upang hindi mawala ang saklaw ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang tatlong magkakaugnay ngunit magkakaibang salita—“kasalanan,” “kasamaan,” at “mga pagsuway”—gayundin ang “Selah.” Inilagay ang [a] pagkatapos ng “kasalanan” sa sugnay ng pagpapatawad, sapagkat doon nauukol ang talababa.
