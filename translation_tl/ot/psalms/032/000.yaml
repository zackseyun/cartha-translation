    rationale: Hindi kailangan ng Hebreo ang tahasang panghalip; ang “ang pagsuway” at “ang kasalanan” sa loob ng kamag-anak na sugnay ay malinaw nang tumutukoy sa taong mapalad at mas siksik ang paralelismo.
