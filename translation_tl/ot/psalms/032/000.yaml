    issue: “Awit ni David” para sa לְדָוִד
    rationale: Bagaman karaniwan sa mga pamagat ng Salmo, ang Hebreong preposisyon ay hindi tiyak sa uri ng kaugnayan kay David. Ang “Kay David” ay mas maigsi at hindi nagpapasya kung siya ang may-akda, paksa, o pinag-alayan.
