  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: tl
  text: 'Kay David. Isang maskil[a].


    Mapalad ang taong ang pagsuway ay pinatawad[b],

    na ang kasalanan ay natatakpan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong maskil ay isang katawagan sa pamagat ng ilang awit. Hindi tiyak ang eksaktong kahulugan nito; maaaring tumukoy sa isang awit na nagtuturo o nagbubulay.
    reason: cultural_note
  - marker: b
    text: Sa literal, “itinaas” o “inalis” ang pagsuway—isang larawan ng pagpapatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Awit ni David
  rationale: Sa pamagat ng isang awit, natural sa Tagalog ang “Awit ni David.” Maaaring ipahiwatig ng Hebreong parirala ang pagkakatha, pag-aalay, o kaugnayan kay David, kaya hindi pinalawak ang pahayag.
- source_word: מַשְׂכִּיל
  choice: maskil
  rationale: Isinalin sa baybay na malapit sa Hebreo sapagkat hindi tiyak ang teknikal na kahulugan ng katawagan; ipinaliwanag ang posibleng diwa sa talababa.
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Karaniwang katumbas sa Tagalog para sa pormulang nagpapahayag ng mabuting kalagayan o kapalaran ng isang tao.
- source_word: נְשׂוּי פֶּשַׁע
  choice: pinatawad sa kanyang pagsuway
  rationale: Ipinahahayag nang natural ang idyomatikong diwa ng kasalanang “itinaas” o “inalis,” habang pinananatili sa talababa ang literal na larawan.
- source_word: כְּסוּי חֲטָאָה
  choice: pinagtakpan ang kanyang kasalanan
  rationale: Pinananatili ang metaporang “tinakpan” sa Hebreo at ang parallelismo nito sa kapatawaran.
theological_decisions:
- issue: Saklaw ng kapatawaran at pagtatakip
  choice: 'Pinanatili ang dalawang magkatabing larawan: pinatawad ang pagsuway at pinagtakpan ang kasalanan.'
  alternative: Pagsamahin ang dalawang parirala bilang iisang tuwirang pahayag tungkol sa kapatawaran.
  rationale: Magkaiba ngunit magkaugnay ang mga larawang ginamit ng Hebreo; hindi dapat burahin ang poetikong tensiyon o gawing sistematikong paliwanag ang taludtod.
- issue: Kaugnayan ng awit kay David
  choice: “Awit ni David” nang walang karagdagang paliwanag sa pangunahing teksto.
  alternative: “Isinulat ni David” o “Para kay David.”
  rationale: May tunay na lawak ng kahulugan ang לְדָוִד; ang karaniwang pamagat sa Tagalog ay malinaw ngunit hindi tahasang nagtatakda ng eksaktong uri ng kaugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng pamagat at ang parallelismong patula. Ginamit ang “pagsuway” para sa פֶּשַׁע upang maipakita ang diwa ng paghihimagsik o paglabag, at “kasalanan” para sa חֲטָאָה.
