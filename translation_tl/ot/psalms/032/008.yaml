  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: tl
  text: Bibigyan kita ng pang-unawa at tuturuan kita sa daang dapat mong lakaran.[a][c] Papayuhan kita habang nakatuon sa iyo ang aking mata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa daang lalakaran mo” o “sa daang ito ay lalakad ka.” Pinahihintulutan ng Hebreo ang mas literal na diwang panghinaharap, ngunit sinusuportahan ng konteksto ng pagtuturo ang “sa daang dapat mong lakaran.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang aking mata ay nakatuon sa iyo.” Maaaring ipahayag nito ang mapagmasid na paggabay o maingat na pagkalinga.
    reason: lexical_alternative
  - marker: c
    text: Maaaring unawain ang nagsasalita bilang ang PANGINOON o bilang ang mang-aawit; hindi siya tahasang kinikilala ng Hebreo sa mismong talata.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: Bibigyan kita ng pang-unawa
  rationale: Ang Hiphil ng שׂכל ay nagpapahiwatig ng pagbibigay o pagpapalalim ng unawa. Pinananatili ng salin ang causative na diwa at ang tono ng karunungan.
- source_word: וְאוֹרְךָ
  choice: at tuturuan kita
  rationale: Ang Hiphil ng ירה ay maaaring mangahulugang magturo, magturo ng direksiyon, o gumabay. Ang “tuturuan” ay likas sa Filipino at kaagapay ng unang pandiwa, samantalang ang kasunod na “sa daan” ang nagdadala ng diwa ng paggabay.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: sa daang dapat mong lakaran
  rationale: Bagaman mas literal na maaaring unawain bilang “sa daang lalakaran mo” o “sa daang ito ay lalakad ka,” ipinahihiwatig ng konteksto ng pagtuturo ang landas na nararapat tahakin. Inilalahad sa talababa ang tunay na kalabuan.
- source_word: אִיעֲצָה
  choice: Papayuhan kita
  rationale: Ang יעץ ay nangangahulugang magpayo o magbigay ng payo. Ang “papayuhan” ay malinaw, natural, at angkop sa marangal na tono ng salmo.
- source_word: עָלֶיךָ עֵינִי
  choice: habang nakatuon sa iyo ang aking mata
  rationale: Pinananatili nito ang literal na talinghaga ng mata at ang posibleng diwa ng mapagmasid na paggabay o maingat na pagkalinga, nang hindi ito nilulutas sa mas abstraktong pagpapahayag.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa Awit 32:8
  choice: Panatilihin ang unang panauhan nang hindi tahasang tinutukoy kung sino ang nagsasalita.
  alternative: Maaaring unawain ang nagsasalita bilang ang PANGINOON o bilang ang mang-aawit na nakikipag-usap sa tagapakinig.
  rationale: Hindi tahasang kinikilala ng Hebreo sa mismong talata ang nagsasalita. Pinananatili ng salin ang pagiging bukas ng teksto sa dalawang pagbasa.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Pinanatili ang talinghaga ng mata at ang kalabuan tungkol sa nagsasalita at sa anyo ng pariralang tumutukoy sa daan.
