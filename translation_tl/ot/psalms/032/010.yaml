base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: tl
  text: Maraming pasakit[a] ang para sa masama, ngunit ang nagtitiwala kay Yahweh ay napapaligiran ng tapat na pag-ibig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Maraming kirot” o “Maraming dalamhati.” Ang salitang Hebreo ay maaaring tumukoy sa mga kirot, dalamhati, o pagdurusa.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong חֶסֶד ay maaari ring isalin na “awa,” “matapat na kagandahang-loob,” o “pag-ibig na ayon sa tipan,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Maraming
  rationale: Pinananatili ang diin ng pangungusap sa dami at ang pagkakalagay nito sa unahan.
- source_word: מַכְאוֹבִים
  choice: pasakit
  rationale: Saklaw nito ang pisikal na kirot, dalamhati, at iba pang pagdurusa nang hindi nililimitahan ang salita sa emosyonal na kalungkutan lamang.
- source_word: לָרָשָׁע
  choice: ang dinaranas ng taong masama
  rationale: Likas na ipinahahayag sa Filipino ang ugnayang minamarkahan ng ל. Hindi nito tahasang sinasabing sanhi o parusa ang mga pasakit. Ang isahang רָשָׁע ay kinatawan o panlahat, kaya ang 'taong masama' ay hindi tumutukoy lamang sa isang partikular na lalaki.
- source_word: וְהַבּוֹטֵחַ
  choice: ngunit ang nagtitiwala
  rationale: Ang pandiwaring Hebreo ay ginagamit bilang pangngalan, 'ang nagtitiwala.' Isinalin ang pang-ugnay na 'ngunit' dahil malinaw ang paghahambing sa dalawang uri ng tao.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang ב kasama ng בטח ay likas na 'magtitiwala kay' sa Filipino. Pinanatili ang personal na pangalang tipan na Yahweh.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matibay, maaasahan, at mapagkalingang pag-ibig; hindi ito nililimitahan sa awa lamang.
- source_word: יְסוֹבְבֶנּוּ
  choice: ay napapaligiran
  rationale: Malinaw at likas na katumbas ng larawang 'palibutan' o 'pumalibot,' na ang tinutukoy ng hulaping panghalip ay ang taong nagtitiwala.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; wagas na pag-ibig; pag-ibig na ayon sa tipan
  rationale: Pinananatili ng salin ang katapatan at init ng pag-ibig nang hindi ginagawang tahasang teknikal ang pariralang 'pag-ibig na ayon sa tipan,' na maaaring higit sa mismong ipinapahayag ng salita sa kontekstong ito.
- issue: Panlahat na isahang רָשָׁע
  choice: taong masama
  alternative: masamang lalaki; masasama
  rationale: Ang isahan ay panlahat o kinatawan at hindi nakatuon sa kasariang lalaki; pinananatili rin ng salin ang kaibahan sa isahang 'ang nagtitiwala.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pasakit' upang mapanatili ang lawak ng salitang Hebreo, at ang 'napapaligiran' upang manatili ang matingkad na larawan ng proteksiyon at pagkalinga. Ang mga pananda ng talababa ay inilagay kaagad sa mga salitang tinutukoy ng mga ito.
