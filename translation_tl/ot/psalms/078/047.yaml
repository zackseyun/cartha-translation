translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘punong ubas’ at ‘punong sikomoro’ upang malinaw na mga halaman mismo ang tinutukoy. Ang pag-uulit ng ‘sa pamamagitan ng’ ay nagpapanatili sa magkatulad na balangkas ng dalawang pariralang instrumental sa Hebreo.
