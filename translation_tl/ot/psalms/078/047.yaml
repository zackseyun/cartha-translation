    issue: Ang “nagyeyelong ulan” ay hindi katumbas ng “frost.”
    rationale: Ang freezing rain ay ulan na nagyeyelo sa pagdapo, samantalang ang frost ay hamog o nagyelong-singaw na namumuo. Dahil “frost” ang napiling pangunahing pagbasa sa English POB audit trail, dapat ipakita ito ng Tagalog na teksto; ang mga pagbasa tulad ng sleet ay dapat manatili bilang alternatibo sa talababa.
  - severity: low
    issue: Medyo di-idiomatiko ang “mga punong ubas.”
    rationale: Ang גַּפְנָם ay tumutukoy sa mga vine/grapevine. Sa Filipino, ang “mga halamang ubas” ay hindi nagpapahiwatig na ang ubas ay isang puno at mas tapat sa tinutukoy na halaman.
  revised_text: Winasak niya sa graniso ang kanilang mga halamang ubas, at sa hamog na nagyelo[a] ang kanilang mga puno ng sikomoro.
