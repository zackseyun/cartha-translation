  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: tl
  text: Winasak niya sa graniso ang kanilang mga halamang ubas, at sa hamog na nagyelo[a] ang kanilang mga puno ng sikomoro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga balang,” “mga tipak ng graniso,” o “ulan na may yelo”; bihira ang salitang Hebreo at hindi tiyak ang kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: Winasak niya
  rationale: Literal na nangangahulugang ‘pumatay’ ang pandiwa, ngunit mga halaman ang layon nito; natural sa modernong Tagalog ang ‘winasak’ para sa lubos na pinsalang idinulot.
- source_word: בַּבָּרָד
  choice: sa pamamagitan ng graniso
  rationale: 'Instrumental ang בְּ: graniso ang ginamit na paraan sa pagwasak. Malinaw na ipinahahayag ng parirala ang ugnayang ito.'
- source_word: גַּפְנָם
  choice: ang kanilang mga punong ubas
  rationale: Kolektibo ang pangngalan at tumutukoy sa mga halamang ubas, hindi tahasan sa ubasan bilang lupang tinataniman.
- source_word: וְשִׁקְמוֹתָם
  choice: at ... ang kanilang mga punong sikomoro
  rationale: Ang שִׁקְמָה ay sycamore fig o fig-mulberry. Pinananatili ng ‘punong sikomoro’ ang tiyak na uri ng puno nang hindi ito ipinagkakamali sa karaniwang igos.
- source_word: בַּחֲנָמַל
  choice: sa pamamagitan ng nagyeyelong ulan
  rationale: Bihira at hindi tiyak ang salitang Hebreo. Ang ‘nagyeyelong ulan’ ay isang makatuwirang pagbasa sa kaparis nitong graniso at sa konteksto ng pagkasira ng pananim; inilalahad sa talababa ang ibang posibleng kahulugan.
