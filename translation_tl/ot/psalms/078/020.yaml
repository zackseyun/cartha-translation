  text: הֵ֤ן הִכָּה צ֨וּר וַ/יָּז֣וּבוּ מַיִם֮ וּ/נְחָלִ֪ים יִ֫שְׁטֹ֥פוּ הֲ/גַם לֶ֭חֶם י֣וּכַל תֵּ֑ת אִם יָכִ֖ין שְׁאֵ֣ר לְ/עַמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: tl
  text: Narito, hinampas niya ang bato, at bumulwak ang tubig, at umapaw ang mga batis. Makapagbibigay din ba siya ng tinapay, o makapaglalaan ng karne[a] para sa kanyang bayan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “laman”; dito ay malamang na tumutukoy sa karneng makakain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Nagpapakilala ito ng mariing pagtukoy sa isang hayag na pangyayari. Ang “Narito” ay marangal ngunit nauunawaan pa rin sa makabagong Filipino.
- source_word: הִכָּה
  choice: hinampas
  rationale: Ipinahihiwatig ng pandiwa ang malakas na paghampas sa bato; mas tiyak at masigla ito kaysa sa pangkalahatang “tinamaan.”
- source_word: צוּר
  choice: ang bato
  rationale: Tumutukoy ito sa tiyak na batong kaugnay ng pangyayari sa ilang, kaya angkop ang tiyak na pantukoy na “ang.”
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: bumulwak ang tubig
  rationale: Inilalarawan ng parirala ang sagana at kapansin-pansing paglabas ng tubig. Likas sa Filipino ang “bumulwak” para sa ganitong larawan.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: at umapaw ang mga batis
  rationale: Maaaring tumukoy ang נְחָלִים sa mga batis o rumaragasang daluyan, at ang pandiwa ay nagpapakita ng masaganang pag-agos. Pinananatili ng salin ang larawang nasa teksto nang hindi labis na tinutukoy ang heograpiya.
- source_word: הֲגַם
  choice: Makapagbibigay din ba siya
  rationale: Pinananatili ng “din ba” ang pagpapalawak ng mapagdudang tanong mula sa pagbibigay ng tubig tungo sa pagbibigay ng pagkain.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Kongkretong “tinapay” ang nasa Hebreo, hindi lamang pangkalahatang pagkain, at mahalaga ito sa pagkakatambal sa karne.
- source_word: אִם
  choice: o
  rationale: Sa ikalawang bahagi ng retorikal na tanong, ginagamit ang אִם bilang pang-ugnay na naglalahad ng isa pang posibilidad; natural itong isalin na “o.”
- source_word: יָכִין
  choice: makapaghahanda
  rationale: Ang Hiphil ay may diwang maghanda o maglaan. Ang “makapaghahanda” ay nagpapanatili sa ugnayan nito sa naunang tanong tungkol sa kakayahan.
- source_word: שְׁאֵר
  choice: karne
  rationale: Literal itong tumutukoy sa laman, ngunit sa konteksto ay nakakain na karne ang ibig sabihin. Mas malinaw ang “karne” sa ordinaryong Filipino, habang inilalagay sa talababa ang literal na katumbas.
- source_word: לְעַמּוֹ
  choice: para sa kanyang bayan
  rationale: Ang עַם ay tumutukoy sa Israel bilang bayan ng Diyos. Ang “bayan” ay natural at marangal na katumbas sa kontekstong pangkasaysayan at tipan.
theological_decisions:
- issue: Retorikal na bisa ng pag-aalinlangan ng Israel
  choice: Isinalin ang huling dalawang sugnay bilang mapagdudang tanong tungkol sa kakayahan niyang magbigay ng pagkain bukod sa tubig.
  alternative: Isalin ang mga ito bilang payak na mga pahayag o gawing tanong lamang tungkol sa pagkukusa, hindi sa kakayahan.
  rationale: Ang pantanong na kataga, ang pandiwang may diwang “makakaya,” at ang konteksto ng kawalan ng pananampalataya ay nagpapakitang retorikal at mapagduda ang tanong. Pinananatili nito ang tensiyon nang hindi ipinapasok sa salin ang sagot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang masiglang “bumulwak” upang mapanatili ang larawan ng Hebreo, at ang tanong ay sadyang nananatiling mapagduda. Inilagay ang talababa sa “karne,” ang salitang aktuwal na nangangailangan ng leksikal na paglilinaw.
