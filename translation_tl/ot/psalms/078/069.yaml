  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: tl
  text: At itinayo niya ang kanyang santuwaryo tulad ng matatayog na dako,[a] tulad ng lupang itinatag niya magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tulad ng matataas na langit” o “tulad ng matatayog na kaitaasan.” Makatula ang Hebreong pananalita at maaaring maglarawan ng maringal na langit o kabundukan.
    reason: lexical_alternative
  - marker: b
    text: O “na kanyang pinagtibay magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: At itinayo niya
  rationale: Ang wayyiqtol ng בנה ay nagpapatuloy sa salaysay. Pinananatili ng “At itinayo niya” ang payak na kahulugan at daloy ng tula.
- source_word: כְּמוֹ
  choice: na tulad ng
  rationale: Naghahayag ito ng paghahambing; natural sa modernong Tagalog ang “tulad ng.”
- source_word: רָמִים
  choice: matatayog na dako
  rationale: Ang רָמִים ay tumutukoy sa mga bagay o dakong mataas at maringal. Pinananatili ng salin ang malawak na makatang larawan nang hindi ito nililimitahan sa langit o sa kabundukan.
- source_word: מִקְדָּשׁוֹ
  choice: kanyang santuwaryo
  rationale: Ang מִקְדָּשׁ ay banal na dako o santuwaryo. Mas malawak ang “santuwaryo” kaysa “templo” at hindi nito labis na nililimitahan ang tinutukoy na tahanan ng Diyos.
- source_word: כְּאֶרֶץ
  choice: tulad ng lupa
  rationale: Ang אֶרֶץ dito ay ang lupa bilang matatag na bahagi ng kosmikong paghahambing, hindi lamang isang lupain o teritoryo.
- source_word: יְסָדָהּ
  choice: na itinatag niya
  rationale: Ang יסד ay nangangahulugang magtatag o maglagay ng pundasyon. Ang hulaping pambabae ay tumutukoy pabalik sa “lupa.”
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag nito ang namamalaging katatagan; ang “magpakailanman” ay likas at marangal na katumbas sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy at larawan sa paghahambing sa santuwaryo
  choice: Inihahambing ang santuwaryo ng Diyos sa matatayog na dako at sa lupang matatag na itinatag magpakailanman.
  alternative: Maaaring partikular na tumukoy ang larawan sa matataas na langit o sa matatayog na kabundukan.
  rationale: Makatula at siksik ang Hebreong larawan. Pinananatili ng “matatayog na dako” ang tunay na kalabuan at hindi ipinipilit ang isang tiyak na kosmolohikal o heograpikong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “santuwaryo” upang mapanatili ang lawak ng מִקְדָּשׁ, at ang “matatayog na dako” upang hindi tahimik na lutasin ang malabong makatang larawan ng רָמִים.
