  yaml_path: translation/ot/psalms/078/027.yaml
  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
translation:
  language: tl
  text: Pinaulanan niya sila ng karneng kasindami ng alabok, at ng mga ibong may pakpak na kasindami ng buhangin ng mga dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “buhangin ng mga dagat.” Maaari ring isalin nang mas maluwag na “buhangin sa dalampasigan,” ngunit maramihan ang “mga dagat” sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Pinaulanan niya
  rationale: Ang Hiphil ng מטר ay nangangahulugang magpaulan o magpaulan pababa. Likas sa modernong Tagalog ang “pinaulanan niya” at pinananatili nito ang sanhiang diwa.
- source_word: עֲלֵיהֶם
  choice: sila
  rationale: Sa pandiwang “pinaulanan,” likas na ipinahahayag ng tuwirang layong “sila” ang Hebreong diwang “sa kanila,” nang hindi nagiging mabigat ang pangungusap.
- source_word: כֶּעָפָר
  choice: kasindami ng alabok
  rationale: Ang כְּ ay naghahayag ng paghahambing. Ginawang hayag ang dami sapagkat ang larawan ay tumutukoy sa napakaraming ipinadalang karne, hindi sa katangian o anyo nitong tulad ng alabok.
- source_word: שְׁאֵר
  choice: karne
  rationale: Maaaring mangahulugan ang שְׁאֵר ng laman o karneng kinakain. Sa konteksto ng pagkaing ibinigay sa ilang, “karne” ang natural at malinaw na salin.
- source_word: וּכְחוֹל יַמִּים
  choice: na kasindami ng buhangin sa mga dagat
  rationale: Pinananatili ang paghahambing sa napakaraming buhangin at ang maramihang anyo ng יַמִּים, “mga dagat.”
- source_word: עוֹף כָּנָף
  choice: mga ibong may pakpak
  rationale: Ang parirala ay literal na “ibon ng pakpak,” isang Hebreong paglalarawan sa mga ibong lumilipad. Ang “mga ibong may pakpak” ay malinaw at pinananatili ang larawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matulaing paralelismo at ang maramihang “mga dagat,” habang ginawang malinaw sa Tagalog na dami ang punto ng dalawang paghahambing.
