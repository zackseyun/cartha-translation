base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: tl
  text: Ipinadala niya laban sa kanila ang nag-aalab niyang galit, poot, matinding pagkagalit, at kapighatian—isang pangkat ng mga mensaherong nagdadala ng kapahamakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “isang ipinadalang pangkat ng mga anghel ng kapahamakan”; ayon sa tradisyon, “masasamang anghel.” Maaaring tumukoy ang Hebreo sa mga mensaherong nagdadala ng mapaminsalang sakuna sa halip na sa mga nilalang na masama sa moral.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Ipinadala niya
  rationale: Ang Piel ng שלח ay nagsasaad ng tuwirang pagkilos ng Diyos laban sa kanila; ang aspektong Hebreo ay natural na isinasalaysay sa nagdaang panahon sa kontekstong ito.
- source_word: בָּם
  choice: laban sa kanila
  rationale: Sa mapanlabang konteksto, ipinapakita ng ב ang pinatutunguhan ng hatol, hindi lamang ang kinalalagyan nito.
- source_word: חֲרוֹן אַפּוֹ
  choice: ang nag-aalab niyang galit
  rationale: Pinananatili nito ang larawan ng matinding init sa idyomang Hebreo habang natural at malinaw sa makabagong Tagalog.
- source_word: עֶבְרָה
  choice: poot
  rationale: Ipinahahayag ng salita ang matindi at rumaragasang galit; ibinubukod ito sa naunang חֲרוֹן אַפּוֹ nang hindi pinahihina ang lakas ng magkakahanay na salita.
- source_word: וָזַעַם
  choice: matinding pagkagalit
  rationale: Madalas itong tumukoy sa galit na humahatol o tumutuligsa. Ang salin ay nagpapanatili ng tindi at naiiwasang lubusang pag-isahin ang magkakalapit na termino.
- source_word: וְצָרָה
  choice: at kapighatian
  rationale: Tumutukoy ito sa kagipitan o pagdurusang sumapit sa mga hinahatulan; ang 'kapighatian' ay marangal at malinaw sa konteksto.
- source_word: מִשְׁלַחַת
  choice: isang pangkat
  rationale: Ang pangngalan ay tumutukoy sa isang ipinadalang pangkat o pangkat na inatasan; ang 'isang pangkat' ay natural sa Tagalog.
- source_word: מַלְאֲכֵי
  choice: mga mensahero
  rationale: Maaaring tumukoy ang מַלְאָך sa mensaherong tao o makalangit. Pinananatili ng 'mga mensahero' ang lawak at pagiging di-tiyak ng salitang Hebreo.
- source_word: רָעִים
  choice: nagdadala ng kapahamakan
  rationale: Sa kontekstong ito ng hatol, maaaring ilarawan ng רָעִים ang mapaminsalang bunga o kapahamakang dala ng mga mensahero, hindi kinakailangang ang kanilang moral na kasamaan.
theological_decisions:
- issue: Kung ang מַלְאֲכֵי רָעִים ay nangangahulugang mga anghel na masama sa moral o mga mensaherong tagapagdala ng mapaminsalang hatol
  choice: mga mensaherong nagdadala ng kapahamakan
  alternative: masasamang anghel; mga anghel ng kapahamakan
  rationale: Hindi ipinipilit ng Hebreo ang ontolohiya ng mga sugo o ang moral na kahulugan ng רָעִים. Inilalagay ng pangunahing salin ang diin sa kapahamakang dala nila, habang pinananatili sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang patulang pag-iipon ng magkakalapit na salita para sa galit at ang tunay na kalabuan ng pariralang מַלְאֲכֵי רָעִים. Ginamit ang gitling na em upang malinaw na ipakita na ang huling parirala ay inilalarawan o binubuod ang paraan ng ipinadalang hatol.
