  source_fidelity: Tumpak na naihahatid ng salin ang Piel na pagkilos ng Diyos na nakatuon laban sa kanila, ang patulang pagtitipon ng apat na katawagan ng galit/pagdurusa, at ang pangwakas na pariralang מִשְׁלַחַת מַלְאֲכֵי רָעִים. Ang “isang pangkat ng mga mensaherong nagdadala ng kapahamakan” ay isang katanggap-tanggap na idyomatikong paraan upang ihatid ang ipinadalang pangkat/kapulungan ng mapaminsalang mga sugo, nang hindi ipinagpapalagay na moral na masama sila.
