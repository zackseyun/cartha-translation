  terminology: Ang “gumawa ng pagbabayad-sala para sa kasamaan” ay malinaw na katumbas ng כפר + עון at hindi tumutukoy sa mekanismong hindi isinasaad. Ang “kasamaan” ay angkop para sa malawak na saklaw ng עָוֹן; pinananatili ng talababa ang “pinatawad” bilang leksikal na alternatibo.
