base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: tl
  text: Ngunit siya, palibhasa’y mahabagin, ay gumawa ng pagbabayad-sala para sa kasamaan[a] at hindi niya sila nilipol; madalas niyang pinaurong ang kanyang galit at hindi niya pinukaw ang kanyang buong poot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinatawad ang kasamaan.” Ang pandiwang Hebreo ay karaniwang tumutukoy sa paggawa ng pagbabayad-sala, kaya pinananatili iyon sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: mahabagin
  rationale: Likas at marangal na salitang Filipino para sa katangiang nagpapakita ng maawaing malasakit.
- source_word: יְכַפֵּר
  choice: pinawi
  rationale: Sa tuwirang layong עָוֹן, ipinahihiwatig ng pandiwa ang pag-aalis o pagpapatawad ng sala. Pinananatili ng “pinawi” ang bigat ng pagbabayad-sala nang hindi nagpapasok ng paraang hindi binanggit sa talata.
- source_word: עָוֺן
  choice: sala
  rationale: Maaaring tumukoy ang salita sa kasamaan at sa pananagutang dulot nito. Ang “sala” ay malinaw sa karaniwang Filipino at angkop na katambal ng “pinawi.”
- source_word: יַשְׁחִית
  choice: nilipol
  rationale: Ipinapahayag nito ang mapangwasak na paghatol; malinaw at makapangyarihan ang “nilipol” sa konteksto.
- source_word: וְהִרְבָּה
  choice: madalas
  rationale: Ang הִרְבָּה na sinusundan ng pawatas ay nagpapahayag ng paulit-ulit o madalas na pagkilos.
- source_word: לְהָשִׁיב אַפּוֹ
  choice: pinabalik ang kanyang galit
  rationale: Pinananatili nito ang larawan ng pagbabalik o pagpapaurong sa galit, sa halip na gawing mas interpretatibong “pinigilan.”
- source_word: יָעִיר
  choice: pinukaw
  rationale: Tuwirang inilalarawan ang pagpupukaw o paggising ng poot.
- source_word: כָּל חֲמָתוֹ
  choice: ang buo niyang poot
  rationale: Likas sa Filipino at malinaw na ipinapahayag ang kabuuan o ganap na tindi ng poot.
theological_decisions:
- issue: Kahulugan ng כפר sa isang salmong nagsasalaysay ng kasaysayan
  choice: pinawi ang sala
  alternative: pinatawad ang sala; gumawa ng pagbabayad-sala para sa kasamaan
  rationale: Ang כפר ang karaniwang salitang kaugnay ng pagbabayad-sala, ngunit sa konstruksyong ito maaari rin nitong ipahayag ang pagpapatawad o pag-aalis ng sala. Ang “pinawi ang sala” ay nagpapanatili ng teolohikal na bigat at ng saklaw ng kahulugan nang hindi tinutukoy ang mekanismong hindi naman sinasabi ng talata.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “palibhasa’y” upang likas na maipahayag ang pang-abay na paglalarawan sa Diyos, habang pinanatili ang matulaing larawan ng pagpapabalik ng galit at hindi pagpukaw sa buong poot.
