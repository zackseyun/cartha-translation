  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף הַאֲזִ֣ינָ/ה עַ֭מִּ/י תּוֹרָתִ֑/י הַטּ֥וּ אָ֝זְנְ/כֶ֗ם לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: tl
  text: 'Isang Maskil[a] ni Asaf.


    Makinig kayo, bayan ko, sa aking turo;

    ikiling ninyo ang inyong mga tainga sa mga salita ng aking bibig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Maskil” ay isang teknikal na katawagan sa mga pamagat ng ilang awit; maaaring tumukoy ito sa isang awiting panturo o mapagnilay.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan ng teknikal na katawagan sa pamagat ng awit; pinanatili ang transliterasyon upang hindi pumili nang tiyak sa pagitan ng awiting panturo, mapagnilay, o masining.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Likas itong anyo ng pamagat sa Filipino at sapat na maluwag upang katawanin ang kaugnayan kay Asaf, bagaman ang לְ ay maaari ring magpahiwatig ng paglalaan o pag-aari.
- source_word: הַאֲזִינָה
  choice: Makinig kayo
  rationale: Ipinahahayag nito ang utos na makinig nang buong pansin. Mas natural ito sa modernong Filipino kaysa sa literal na idyomang tumutukoy sa tainga.
- source_word: עַמִּי
  choice: bayan ko
  rationale: Pinananatili ang tahasang panghalip na paari. Ang “bayan” ay marangal at angkop sa kolektibong sambayanang kinakausap.
- source_word: תּוֹרָתִי
  choice: aking turo
  rationale: Sa kontekstong ito, ang תּוֹרָה ay pagtuturo o tagubilin, hindi lamang kodigong legal; iniiwasan ng “turo” ang sobrang makitid na kahulugang “kautusan.”
- source_word: הַטּוּ
  choice: ikiling ninyo
  rationale: Pinananatili ang kongkretong metapora ng pagkiling ng tainga bilang tanda ng masusing pakikinig.
- source_word: אָזְנְכֶם
  choice: ang inyong mga tainga
  rationale: Pinananatili ang maramihang anyo at ang paralelismong pandinig ng Hebreo.
- source_word: לְאִמְרֵי
  choice: sa mga salita
  rationale: Malinaw at natural na katumbas ito ng maramihang אִמְרֵי, nang hindi dinaragdagan ang diwang “mga kasabihan.”
- source_word: פִי
  choice: ng aking bibig
  rationale: Pinananatili ang kongkreto at makatang larawan ng orihinal, pati ang paralelismo ng “mga tainga” at “bibig.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at makata ngunit madaling maunawaan. Ginamit ang “kayo/ninyo” dahil maramihan ang sambayanang kinakausap. Pinanatili ang konkretong larawan sa ikalawang taludtod, samantalang ginawang natural na “Makinig kayo” ang unang utos.
