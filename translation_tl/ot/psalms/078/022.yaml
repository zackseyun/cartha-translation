  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: tl
  text: 'Sapagkat hindi sila sumampalataya sa Diyos,

    at hindi sila nagtiwala sa pagliligtas niya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: sumampalataya sa Diyos
  rationale: Ang konstruksyong Hebreo na may בְּ ay likas na tumutukoy sa pananampalataya o pagtitiwala na nakatuon sa Diyos; pinananatili ng “sumampalataya sa Diyos” ang relihiyosong bigat at ang tahasang “sa.”
- source_word: בָטְחוּ
  choice: nagtiwala
  rationale: Direktang ipinapahayag ang pananalig o pagtitiwala at pinananatili ang paralelismo sa naunang pandiwa.
- source_word: בִּישׁוּעָתוֹ
  choice: sa pagliligtas niya
  rationale: Ang יְשׁוּעָה ay maaaring tumukoy sa kaligtasan, pagliligtas, o tagumpay; sa konteksto ng salmo, ang “pagliligtas niya” ay malinaw at hindi labis na nagsasapinal sa kahulugan bilang isang abstraktong doktrina.
theological_decisions:
- issue: Kung ang unang sugnay ay “hindi naniwala sa Diyos” o “hindi naniwala sa sinabi ng Diyos”
  choice: hindi sila sumampalataya sa Diyos
  alternative: hindi sila naniwala sa Diyos
  rationale: Ang preposisyong בְּ ay tahasang naroon at inilalarawan ang Diyos bilang pinagtutuunan ng pananampalataya o tiwala. Hindi ito isinalin na para bang isang partikular na pahayag lamang ng Diyos ang hindi nila pinaniwalaan.
- issue: Saklaw ng “kaligtasan/pagliligtas”
  choice: pagliligtas niya
  alternative: kaligtasan niya
  rationale: Pinananatili ang konkretong diwa ng gawa ng Diyos sa makasaysayang konteksto, habang hindi isinasara ang mas malawak na teolohikal na saysay ng salita.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “sumampalataya” at “nagtiwala” upang mapanatili ang magkaugnay ngunit hindi ganap na magkaparehong mga pandiwa sa paralelismong Hebreo.
