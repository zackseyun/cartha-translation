  source_fidelity: 'Tumpak na naihahatid ng salin ang dalawang magkakatimbang na bahagi ng Hebreo: ang nakamamatay na pagkilos laban sa bawat panganay sa Ehipto at ang makatang paglalarawan sa kanila bilang unang bunga ng lakas sa mga tolda ni Ham. Hindi nagdaragdag ng kasariang wala sa mismong teksto.'
