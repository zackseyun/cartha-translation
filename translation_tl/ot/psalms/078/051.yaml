  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/מִצְרָ֑יִם רֵאשִׁ֥ית א֝וֹנִ֗ים בְּ/אָהֳלֵי חָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: tl
  text: 'Pinuksa niya ang bawat panganay sa Ehipto,

    ang unang bunga ng kanilang lakas sa mga tolda ni Ham.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: Pinuksa niya
  rationale: Ang pandiwang נכה ay nagsasalaysay dito ng nakamamatay na paghampas sa konteksto ng pagkamatay ng mga panganay. Likas sa Filipino ang “pinuksa” at malinaw nitong ipinahihiwatig ang kamatayan nang hindi gumagamit ng lipas na pananalita.
- source_word: כָּל בְּכוֹר
  choice: ang bawat panganay
  rationale: Pinananatili ng “bawat” ang distributibong lakas ng כָּל. Hindi idinagdag ang “lalaki” sapagkat wala itong tahasang katumbas sa parirala.
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Ang בְּ ay lokatibo rito; ang tuwirang heograpikong kahulugan ay “sa Ehipto.”
- source_word: רֵאשִׁית אֹנִים
  choice: ang unang bunga ng kanilang lakas
  rationale: Ang idyoma ay tumutukoy sa unang bunga ng kakayahang magkaanak. Pinananatili ng “unang bunga” ang larawang nasa רֵאשִׁית, samantalang ang “lakas” ay dignified at sadyang hindi labis na nililinaw ang seksuwal na pahiwatig.
- source_word: בְּאָהֳלֵי חָם
  choice: sa mga tolda ni Ham
  rationale: Pinananatili ang makatang katawagan sa Ehipto at ang heneyalohikal na pangalang Ham, pati ang konkretong larawan ng mga tolda.
theological_decisions:
- issue: Ang “Ham” bilang makatang katawagan sa Ehipto
  choice: Panatilihin ang “Ham” sa pangunahing teksto.
  alternative: “sa mga tahanan ng mga Ehipsiyo” o “sa mga tahanan ng Ehipto”
  rationale: Tahasan nang binanggit ang Ehipto sa unang taludtod; ang “mga tolda ni Ham” sa ikalawa ay makatang pag-uulit at pagpapatingkad. Ang pagpapanatili rito ay nag-iingat sa tekstuwal at heneyalohikal na himig nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Saklaw ng “panganay”
  choice: Huwag idagdag ang “lalaki.”
  alternative: “bawat panganay na lalaki”
  rationale: Bagaman may kontekstuwal na kaugnayan sa salot sa Ehipto, hindi tahasang nakasaad sa pariralang Hebreo ng talatang ito ang kasarian; kaya pinananatili ang saklaw at tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at bahagyang makata. Ang dalawang magkatimbang na taludtod ay pinanatili. Walang talababa sapagkat ang alternatibong diwa ng רֵאשִׁית אֹנִים ay sapat na naipahahayag ng “unang bunga ng kanilang lakas” at hindi kailangan para maunawaan ang talata.
