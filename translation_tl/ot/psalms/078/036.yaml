  text: וַ/יְפַתּ֥וּ/הוּ בְּ/פִי/הֶ֑ם וּ֝/בִ/לְשׁוֹנָ֗/ם יְכַזְּבוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: tl
  text: 'Ngunit binola nila siya sa pamamagitan ng kanilang bibig[a];

    sa pamamagitan ng kanilang dila, nagsinungaling sila sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilinlang nila siya” o “inakit nila siya.” Maaaring taglayin ng pandiwang Hebreo ang mga kahulugang ito, ngunit dito ay malamang na tumutukoy ito sa pambobola at hindi tapat na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: binola nila siya
  rationale: Ang piel ng פתה ay maaaring mangahulugang mang-akit, manlinlang, o manghikayat. Sa pagkakapares nito sa pagsisinungaling, ang “binola” ay likas na Filipino para sa papuri o pananalitang pakitang-tao na naglalayong suhulan ang loob, nang hindi ipinahihiwatig na talagang nalinlang ang Diyos.
- source_word: בְּפִיהֶם
  choice: sa pamamagitan ng kanilang bibig
  rationale: Ang בְּ ay nagpapahayag ng kasangkapan o paraan. Pinananatili ng “bibig” ang kongkretong larawan at ang kolektibong isahan ng Hebreo.
- source_word: וּבִלְשׁוֹנָם
  choice: sa pamamagitan ng kanilang dila
  rationale: Literal na “dila” ang לָשׁוֹן at metaporikal itong tumutukoy sa pananalita. Pinananatili ito upang maingatan ang paralelismo sa “bibig.”
- source_word: יְכַזְּבוּ
  choice: nagsinungaling sila
  rationale: Ang piel ng כזב ay tuwirang tumutukoy sa pagsisinungaling o pagsasalita nang huwad. Ang “nagsinungaling” ang malinaw at natural na katumbas sa modernong Filipino.
- source_word: לוֹ
  choice: sa kanya
  rationale: 'Ang lamed na may panghalip na hulapi ay likas na tumutukoy sa pinag-ukulan ng huwad na pananalita: nagsinungaling sila sa Diyos.'
theological_decisions:
- issue: Kung ipinahihiwatig ba ng talata na matagumpay na nalinlang ng mga tao ang Diyos o na mapanlinlang lamang ang kanilang pakikipag-usap sa kanya.
  choice: Inilalarawan ang pakitang-tao at mapanlinlang na pananalitang iniharap sa Diyos, nang hindi sinasabing talagang nalinlang siya.
  alternative: “Nilinlang nila siya” o “inakit nila siya.”
  rationale: Pinahihintulutan ng pandiwang Hebreo ang mga alternatibong ito, ngunit ang pagkakapares nito sa pagsisinungaling at ang konteksto ng hindi tapat na pagtugon ng Israel ay pumapabor sa pananalitang pambobola. Hindi nito binubura ang saklaw ng salitang Hebreo, kaya inilalahad ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino. Pinili ang “binola” dahil malinaw at karaniwan itong tumutukoy sa hindi tapat na papuri o pananalitang pampalubag-loob; ang mas pormal na paliwanag at mga posibleng kahulugan ay inilagay sa talababa. Ang paghahanay ng “bibig” at “dila” ay pinanatili upang maingatan ang paralelismong patula.
