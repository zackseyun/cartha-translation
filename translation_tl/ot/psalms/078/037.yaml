  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: tl
  text: Hindi matatag ang kanilang puso sa kanya,[a] at hindi sila naging tapat sa kanyang tipan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi matibay ang kanilang puso sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi sila naging tapat sa loob ng kanyang tipan”; mas natural sa Filipino ang “tapat sa kanyang tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  choice: ang puso nila
  rationale: Kolektibong isahan ang Hebreo at tumutukoy sa kalooban o panloob na pagkatao ng sambayanan; natural din sa Filipino ang “ang puso nila.”
- source_word: נָכוֹן
  choice: matatag
  rationale: Sa konteksto, inilalarawan nito ang kawalan ng katatagan ng kanilang panloob na disposisyon sa Diyos; pinananatili rin nito ang posibilidad ng diwang “matibay” o “nakatatag.”
- source_word: עִמּוֹ
  choice: sa kanya
  rationale: Bagaman karaniwang “kasama niya” ang literal na anyo, mas natural sa Filipino ang “matatag sa kanya” upang ipahayag ang relasyonal na paninindigan nang hindi gawing direksiyon lamang ang kahulugan.
- source_word: נֶאֶמְנוּ
  choice: naging tapat
  rationale: Ang Niphal ng אמן dito ay nagpapahayag ng pagiging maaasahan o tapat, lalo na kaugnay ng tipan.
- source_word: בִּבְרִיתוֹ
  choice: sa kanyang tipan
  rationale: Literal na may pang-ukol na ב (“sa/loob ng”), ngunit ang idyomatikong Filipino ay “tapat sa kanyang tipan”; iniiwasan nitong maging alanganin ang literal na “sa loob ng kanyang tipan.”
theological_decisions:
- issue: Katapatan sa tipan
  choice: Inilalarawan ang kawalan ng katapatan ng Israel sa tipan, kasabay ng hindi matatag na puso.
  alternative: Maaaring isalin nang mas literal bilang “hindi sila naging matatag sa kanyang tipan.”
  rationale: Ipinapakita ng paralelismo na relasyonal at moral na katapatan ang usapin, hindi lamang paniniwalang intelektuwal. Hindi nito ipinapasok ang anumang mas huling sistemang doktrinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tipan” bilang malinaw at karaniwang katawagan sa covenant, at pinanatili ang kolektibong “puso” ng Hebreo.
