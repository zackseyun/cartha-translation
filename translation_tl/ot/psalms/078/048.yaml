translation:
  language: tl
  text: Ibinigay niya sa graniso ang kanilang mga hayop, at sa mga kidlat[a] ang kanilang mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga liyab” o “mga nagliliyab na palaso”; maaaring tumukoy ang salitang Hebreo sa nagliliyab o kumikislap na mapaminsalang puwersa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Ibinigay niya
  rationale: Ang סגר ay maaaring mangahulugang isara o ibigay sa kapangyarihan ng iba. Sa konteksto ng salot, natural na ipinahahayag ng “ibinigay niya” na hinayaan ng Diyos na mapailalim ang mga hayop sa mapaminsalang puwersa.
- source_word: לַבָּרָד
  choice: sa graniso
  rationale: Tuwirang katumbas ng בָּרָד ang “graniso,” at ipinakikita ng “sa” ang puwersang pinagbigyan sa mga hayop.
- source_word: בְּעִירָם
  choice: ang kanilang mga hayop
  rationale: Ang בְּעִיר ay karaniwang tumutukoy sa mga hayop, lalo na sa mga hayop na ginagamit sa bukid o pasan. Ang pangkalahatang “mga hayop” ay malinaw at hindi labis na nagpapakipot sa saklaw.
- source_word: וּמִקְנֵיהֶם
  choice: at ang kanilang mga alagang hayop
  rationale: Ang מִקְנֶה ay tumutukoy sa mga hayop na pag-aari o inaalagaan bilang kabuhayan. Pinananatili ng “mga alagang hayop” ang bahagyang pagkakaiba nito sa naunang בְּעִיר habang kinikilala ang patulang paralelismo.
- source_word: לָרְשָׁפִים
  choice: sa mga liyab
  rationale: Maaaring tumukoy ang רְשָׁפִים sa mga liyab, nagliliyab na βala, o kumikislap na mapaminsalang puwersa. Ang “mga liyab” ay pinananatili ang tahasang apoy na diwa nang hindi tiyak na ginagawang kidlat ang salitang Hebreo.
