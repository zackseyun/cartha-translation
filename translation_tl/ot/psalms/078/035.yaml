  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: tl
  text: Pagkatapos ay naalaala nila na ang Diyos ang kanilang bato, at ang Diyos na Kataas-taasan[a] ang kanilang manunubos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at ang Kataas-taasang Diyos ang kanilang manunubos.” Ang literal na ayos ng Hebreo ay “at Diyos Kataas-taasan ang kanilang manunubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Pagkatapos ay naalaala nila
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay; ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod, at pinananatili ng “naalaala nila” ang kahulugan ng זכר.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng kanilang naalaala, hindi ang dahilan nito.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, tumutukoy ito rito sa iisang Diyos ng Israel.
- source_word: צוּרָם
  choice: ang kanilang bato
  rationale: Tuwirang pinananatili ang metapora ng צוּר para sa Diyos bilang matatag na kanlungan at lakas.
- source_word: וְאֵל עֶלְיוֹן
  choice: at ang Diyos na Kataas-taasan
  rationale: Isinasalin ang אֵל bilang “Diyos” at ang עֶלְיוֹן bilang banal na titulong “Kataas-taasan,” habang malapit na pinananatili ang ayos ng Hebreo.
- source_word: גֹּאֲלָם
  choice: ang kanilang manunubos
  rationale: Pinananatili ng “manunubos” ang nominal na diwa ng participle mula sa גאל nang hindi ipinapasok ang mas tiyak na legal na kahulugang “kamag-anak na manunubos.”
theological_decisions:
- issue: Ang magkatambal na katawagang אֱלֹהִים ... וְאֵל עֶלְיוֹן
  choice: 'Gamitin ang “Diyos” sa dalawang magkatulad na sugnay: “ang Diyos ang kanilang bato, at ang Diyos na Kataas-taasan ang kanilang manunubos.”'
  alternative: “Ang Diyos ang kanilang bato, at ang Kataas-taasang Diyos ang kanilang manunubos.”
  rationale: Ang dalawang katawagan ay tumutukoy sa iisang Diyos sa paralelismong patula. Ang pag-uulit ng “Diyos” ay nagpapanatili sa paralelismo at umiiwas sa pahiwatig na dalawang magkaibang persona o nilalang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “bato” at ang teolohikal na katawagang “manunubos,” habang ginawang natural ang pangungusap sa Tagalog.
