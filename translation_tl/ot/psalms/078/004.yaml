  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: tl
  text: Hindi natin ikukubli ang mga ito sa kanilang mga anak; isasalaysay natin sa darating na salinlahi ang mga kapuri-puring gawa ni Yahweh[a], ang kanyang lakas, at ang mga kababalaghang ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga papuri kay Yahweh.” Ang salitang Hebreo ay maaaring tumukoy sa papuring inihahandog kay Yahweh o sa kanyang mga kapuri-puring gawa; mas pinapaboran ng konteksto rito ang huling diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: ikukubli
  rationale: Ang Piel ng כחד ay tumutukoy sa pagtatago o pagkakait ng kaalaman. Likas at marangal sa Filipino ang “ikukubli” at pinananatili nito ang kusang pasiya ng nagsasalita.
- source_word: מִבְּנֵיהֶם
  choice: sa kanilang mga anak
  rationale: Maaaring tumukoy ang בנים sa mga anak o mga inapo. Ang “mga anak” ang pinakanatural sa konteksto ng pagpapasa ng salaysay sa bawat salinlahi at hindi ito nililimitahan sa mga lalaki.
- source_word: לְדוֹר אַחֲרוֹן
  choice: sa darating na salinlahi
  rationale: Tinutukoy ng parirala ang salinlahing kasunod o darating. Pinananatili ng “darating na salinlahi” ang pananaw na nakatuon sa hinaharap.
- source_word: מְסַפְּרִים
  choice: isasalaysay natin
  rationale: Ang participle ay nagpapaliwanag kung paano hindi ikukubli ang mga bagay na ito—sa pamamagitan ng pagkukuwento o pagsasalaysay. Ginawang sugnay na may pandiwa upang maging malinaw at natural sa Filipino.
- source_word: תְּהִלּוֹת יְהוָה
  choice: ang mga kapuri-puring gawa ni Yahweh
  rationale: Maaaring mangahulugan ang תהלות ng mga papuring inihahandog kay Yahweh o ng kanyang mga kapuri-puring gawa at katangian. Dahil katambal ito ng “kanyang lakas” at “mga kababalaghang ginawa niya,” mas malamang dito ang ikalawang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: עֱזוּזוֹ
  choice: ang kanyang lakas
  rationale: Ang עֱזוּז ay lakas o kapangyarihan. Direkta, malinaw, at angkop sa karaniwang modernong Filipino ang “lakas.”
- source_word: נִפְלְאוֹתָיו
  choice: ang mga kababalaghan
  rationale: Tumutukoy ang salita sa pambihirang mga gawa na pumupukaw ng paghanga. Maikli, natural, at may dignidad ang “mga kababalaghan.”
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Ang sugnay na ito ay tuwirang naglalarawan sa mga kababalaghan bilang mga gawang isinagawa ni Yahweh.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Personal na pangalan ang hayagang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
- issue: Diwa ng תְּהִלּוֹת יְהוָה
  choice: mga kapuri-puring gawa ni Yahweh
  alternative: mga papuri kay Yahweh
  rationale: Ang pagkakatabi nito sa lakas ni Yahweh at sa mga kababalaghang ginawa niya ay pumapabor sa kahulugang tumutukoy sa kanyang mga gawang karapat-dapat purihin. Inilalahad sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “salinlahi” dahil karaniwan ito sa kontekstong intergenerasyonal at mas eksakto kaysa “henerasyon.” Ang tuldok-kuwit ay malinaw na nag-uugnay sa hindi pagkukubli at sa aktibong pagsasalaysay, kahit na participial ang anyo ng Hebreo.
