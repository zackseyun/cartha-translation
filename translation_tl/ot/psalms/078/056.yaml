  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: tl
  text: Gayunman, sinubok[a] nila ang Kataas-taasang Diyos at naghimagsik sila laban sa kanya; hindi nila sinunod ang kanyang mga patotoo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay nila ang Kataas-taasang Diyos sa pagsubok.”
    reason: lexical_alternative
  - marker: b
    text: O “mga tuntunin” o “mga batas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: sinubok nila
  rationale: Ang pandiwang נסה ay nangangahulugang subukin o ilagay sa pagsubok. Ang “sinubok” ay tuwiran, natural, at nagpapanatili ng mapanuring diwa sa kontekstong ito.
- source_word: וַיַּמְרוּ
  choice: naghimagsik sila laban sa kanya
  rationale: Ang מרה ay tumutukoy sa sadyang pagsuway o paghihimagsik. Nilinaw ng “laban sa kanya” ang kaugnayan sa Diyos nang hindi binabago ang kahulugan.
- source_word: אֱלֹהִים עֶלְיוֹן
  choice: ang Kataas-taasang Diyos
  rationale: Ito ang natural at kinikilalang anyo sa modernong Tagalog para sa titulong nagbibigay-diin sa kataas-taasang kalagayan ng Diyos.
- source_word: וְעֵדוֹתָיו
  choice: ang kanyang mga patotoo
  rationale: Pinananatili ng “mga patotoo” ang saligang diwa ng עֵדוֹת bilang mga pahayag o kautusang nagsisilbing saksi sa tipan, sa halip na gawing pangkalahatan lamang na mga batas.
- source_word: לֹא שָׁמָרוּ
  choice: hindi nila sinunod
  rationale: Kapag mga kautusan o patotoo ng Diyos ang layon, ang שׁמר ay nangangahulugang tuparin o sundin. Mas natural sa kasalukuyang Tagalog ang “sinunod” kaysa sa literal na “iningatan.”
- source_word: וַ
  choice: Gayunman
  rationale: Bagaman ipinagpapatuloy ng waw ang salaysay, malinaw na kabaligtaran ang tugon ng bayan sa naunang mga gawa ng Diyos; natural na ipinahahayag ito ng “Gayunman.”
theological_decisions:
- issue: Ang titulong אֱלֹהִים עֶלְיוֹן
  choice: ang Kataas-taasang Diyos
  alternative: Diyos na Kataas-taasan
  rationale: Pinananatili ng napiling anyo ang dalawang sangkap ng titulong Hebreo at natural itong mababasa sa Tagalog nang walang idinaragdag na doktrinal na pakahulugan.
- issue: Ang legal at tipanang diwa ng עֵדוֹתָיו
  choice: ang kanyang mga patotoo
  alternative: ang kanyang mga tuntunin / mga batas
  rationale: Ang “mga patotoo” ang higit na nagpapanatili sa katangian ng salitang Hebreo bilang mga kautusang nagpapatotoo sa tipan, habang inilalahad sa talababa ang mas malinaw ngunit mas malawak na mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Gayunman” upang ipakita ang pagsalungat sa konteksto, at inulit ang “sila” sa ikalawang sugnay para sa natural na balarila. Pinanatili ang teknikal ngunit biblikal na “mga patotoo,” na may mas karaniwang mga alternatibo sa talababa.
