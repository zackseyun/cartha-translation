translation:
  language: tl
  text: Naalala niyang sila’y laman[a]—isang hangin na lumilipas at hindi bumabalik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang רוּחַ bilang “hininga.” Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “hangin,” “hininga,” o “espiritu”; dito, malamang na itinatampok nito ang pagiging panandalian at marupok ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Naalala niya
  rationale: Qal wayyiqtol ng זכר, na ang ipinahihiwatig na simuno ay ang Diyos ayon sa konteksto. Ang payak na pangnagdaan ay natural sa modernong Tagalog.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala nito ang nilalaman ng naalala. Ang pang-angkop sa “Naalala niyang” ang likas na katumbas sa Tagalog.
- source_word: בָשָׂר הֵמָּה
  choice: sila'y laman lamang
  rationale: Pinananatili ng “laman” ang kongkretong larawan ng Hebreo para sa kahinaan at mortalidad ng tao. Idinagdag ang “lamang” upang natural na maipahayag ang diin sa pagiging marupok, nang hindi ito ginagawang teknikal na pahayag tungkol sa pagkatao.
- source_word: רוּחַ
  choice: isang hangin
  rationale: Maaaring mangahulugang “hangin,” “hininga,” o “espiritu.” Sa paralelismong ito, ang larawan ay yaong lumilipas at hindi bumabalik; “hangin” ang natural na nagpapanatili sa diwa ng panandalian at marupok na buhay.
- source_word: הוֹלֵךְ
  choice: lumilipas
  rationale: Ang participle ay naglalarawan ng patuloy na pagyaon. Ang “lumilipas” ay likas sa tulang Tagalog at malinaw na naghahatid ng pagiging panandalian.
- source_word: וְלֹא יָשׁוּב
  choice: at hindi na bumabalik
  rationale: Ipinahahayag ng imperfect ang hindi pagbabalik sa pangkalahatang makatang paglalarawan. Ang “hindi na bumabalik” ay natural at hindi labis na nagtatakda ng aspektong panghinaharap.
theological_decisions:
- issue: Larawang antropolohikal ng kahinaan ng tao
  choice: Inilalarawan ang mga tao bilang marupok at panandalian—“laman lamang” at “isang hanging lumilipas.”
  alternative: Basahin ang רוּחַ bilang “espiritu” at ituring ang taludtod na pahayag tungkol sa pag-alis ng espiritu ng tao.
  rationale: Binibigyang-diin ng agarang paralelismo ang mortalidad at pagiging panandalian. Ang “hangin” ay umiiwas sa pagpasok ng isang teknikal na doktrina tungkol sa kaluluwa o espiritu na hindi hinihingi ng taludtod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang konkretong “laman” at ang makatang larawan ng “hangin,” habang ang gitling ay nagpapakita ng ikalawang larawan na nagpapalawak sa una.
