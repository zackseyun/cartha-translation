base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/019.yaml
  text: They spoke against God; they said[a], “Can God prepare a table in the wilderness?”
translation:
  language: tl
  text: Nagsalita sila laban sa Diyos; sinabi nila[a], “Makapaghahanda ba ang Diyos ng isang hapag sa ilang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsalita tungkol sa Diyos.” Maaaring isalin nang mas neutral ang pagkakabuo sa Hebreo, ngunit sa kontekstong ito, mas angkop ang diwang pagsasalita laban sa kanya dahil reklamo at paghamon ito ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Nagsalita sila
  rationale: Tuwirang salaysay ng kilos sa nakaraan; natural at marangal sa makabagong Filipino.
- source_word: בֵּאלֹהִים
  choice: laban sa Diyos
  rationale: Maaaring maging mas neutral ang pang-ukol, ngunit dahil mapanghamon ang kasunod na tanong at inilalarawan ng konteksto ang paghihimagsik ng Israel, pinakamalinaw dito ang diwang pagsasalita laban sa Diyos.
- source_word: אָמְרוּ
  choice: sinabi nila
  rationale: Pinananatili ang hiwalay na pandiwang panipi ng Hebreo sa natural na Filipino.
- source_word: הֲיוּכַל
  choice: Makapaghahanda ba
  rationale: Ipinapahayag ng tanong ang kakayahan at pinananatili ang mapanghamong puwersa nito.
- source_word: אֵל
  choice: ang Diyos
  rationale: Gumaganap itong katawagan sa Diyos na kaagapay ng אֱלֹהִים; hindi kailangang dagdagan ng interpretatibong titulong “Makapangyarihan.”
- source_word: לַעֲרֹךְ
  choice: maghanda
  rationale: Sa kasama ng שֻׁלְחָן, tumutukoy ito sa paghahanda o pag-aayos ng hapag.
- source_word: שֻׁלְחָן
  choice: isang hapag
  rationale: Pinananatili ang kongkretong larawan ng mesa o hapag sa halip na ipakahulugang “pagkain.”
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignificado, at tumutukoy sa ilang na lugar ng paglalakbay ng Israel nang hindi nililimitahan sa mabuhanging disyerto.
theological_decisions:
- issue: Tono ng pananalita ng Israel tungkol sa Diyos
  choice: Isinalin ang בֵּאלֹהִים bilang “laban sa Diyos.”
  alternative: “tungkol sa Diyos” o “sa Diyos”
  rationale: Itinatampok ng konteksto ang di-paniniwala at paghihimagsik ng Israel. Pinananatili ng “laban sa Diyos” ang mapanuligsa at mapanghamong tono nang walang idinaragdag na doktrina.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hapag” upang mapanatili ang konkretong biblikal na larawan, at “sa ilang” bilang natural at hindi labis na makitid na katumbas ng מִדְבָּר.
