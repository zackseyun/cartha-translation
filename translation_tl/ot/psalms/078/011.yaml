translation:
  language: tl
  text: Kinalimutan nila ang kanyang mga gawa[a] at ang kanyang mga kababalaghan[b] na ipinakita niya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kilos.”
    reason: lexical_alternative
  - marker: b
    text: O “mga kamangha-manghang gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Kinalimutan nila
  rationale: Ang Qal wayyiqtol na pangmaramihan ay nagsasalaysay ng naganap na kilos. Tuwirang ipinahahayag ng “Kinalimutan nila” ang diwa nang hindi dinaragdagan ng interpretasyong “pinabayaan.”
- source_word: עֲלִילוֹתָיו
  choice: ang kanyang mga gawa
  rationale: Malawak at natural na katumbas ang “mga gawa” para sa mga kilos na ginawa ng Diyos; hindi nito ipinahihiwatig ang dagdag na diwa ng kabayanihan.
- source_word: וְנִפְלְאוֹתָיו
  choice: at ang kanyang mga kamangha-manghang ginawa
  rationale: Tumutukoy ang salita sa pambihira at kahanga-hangang mga gawa. Iniiwasan ng saling ito ang mas makitid na “mga himala” habang malinaw na mga ginawa, hindi lamang mga bagay, ang tinutukoy.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Filipino para sa sugnay na naglalarawan sa mga kamangha-manghang ginawa.
- source_word: הֶרְאָם
  choice: ipinakita niya sa kanila
  rationale: Ang Hiphil perfect ng ראה na may hulaping 3mp ay literal na “pinakita/ipinakita niya sa kanila” o “pinangyari niyang makita nila.” Natural at tumpak sa Filipino ang “ipinakita niya sa kanila”; malinaw na nauna ang pagpapakita sa pagkalimot mula sa daloy ng pangungusap.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip
  choice: Tumutukoy sa Diyos ang “kanyang” sa “kanyang mga gawa” at “kanyang mga kamangha-manghang ginawa.”
  alternative: Gawing tahasan ang pangalan ng Diyos sa halip na panghalip.
  rationale: Sa konteksto ng Awit, mga gawa ng Diyos ang kinalimutan ng Israel. Pinananatili ng panghalip ang anyo ng Hebreo at ang teolohikal na paghaharap ng mga gawa ng Diyos at ng pagkalimot ng bayan, nang walang idinaragdag sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kamangha-manghang ginawa” upang panatilihin ang lawak ng נִפְלָאוֹת bilang mga pambihirang gawa at hindi ito paliitin sa teknikal na kategoryang “mga himala.” Lahat ng pananda ng talababa ay nasa pangunahing teksto.
