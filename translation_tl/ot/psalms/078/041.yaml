  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: tl
  text: 'Muli silang tumalikod at sinubok ang Diyos;


    nilimitahan nila ang Banal ng Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “minarkahan.” Bihira at mahirap tiyakin ang pandiwang Hebreo; maaari rin itong magpahiwatig ng paghamon o pagpukaw.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: Muli silang tumalikod
  rationale: Ipinapakita ng שׁוב ang pagbabalik nila sa dati nilang paghihimagsik; likas sa modernong Tagalog ang “muli” upang ipahayag ang pag-uulit.
- source_word: וַיְנַסּוּ
  choice: sinubok
  rationale: Karaniwang kahulugan ng נסה ang subukin o ilagay sa pagsubok. Ang “sinubok” ay malinaw at angkop sa paratang ng salmo.
- source_word: אֵל
  choice: ang Diyos
  rationale: Dito, ang אֵל ay katawagan sa Diyos ng Israel; hindi kailangang dagdagan ng “makapangyarihan,” na higit na tiyak kaysa sa hinihingi ng konteksto.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: ang Banal ng Israel
  rationale: Pinananatili nito ang mahalagang pamagat sa Biblia at ang kaugnayan ng banal na Diyos sa Israel.
- source_word: הִתְווּ
  choice: ginalit
  rationale: Bihira at mahirap tiyakin ang pandiwa. Sa paralelismo sa “sinubok,” ang “ginalit” ay likas na Tagalog para sa malamang na diwa ng paghamon o paglapastangan, nang hindi ipinapakahulugang tunay nilang nabawasan ang kapangyarihan ng Diyos.
theological_decisions:
- issue: Kahulugan ng bihira at hindi tiyak na הִתְווּ
  choice: ginalit
  alternative: nilimitahan; minarkahan; pinighati
  rationale: Ang “ginalit” ay umaangkop sa konteksto ng paulit-ulit na paghihimagsik at sa paralelismo sa pagsubok sa Diyos. Gayunman, dahil hindi tiyak ang pandiwang Hebreo at mahalaga sa kasaysayan ng pagsasalin ang “nilimitahan,” inilalahad sa talababa ang ibang posibilidad sa halip na lutasin nang tahimik ang kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maikling paralelismong patula at ang pamagat na “ang Banal ng Israel.” Inilagay ang tandang [a] pagkatapos mismo ng sugnay na nagsasalin sa hindi tiyak na pandiwa.
