translation:
  language: tl
  text: Hinampas niya ang kanyang mga kaaway paurong[a]; ipinataw niya sa kanila ang walang hanggang kahihiyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hinampas niya sa likod ang kanyang mga kaaway.” Maaaring unawain ang Hebreong אָחוֹר bilang nagsasaad ng direksiyon (“paurong”) o ng bahaging hinampas (“sa likod”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Hinampas niya
  rationale: Ang anyong mula sa נכה ay nagsasalaysay ng nakaraang pagkilos. Ang “hinampas” ay natural sa modernong Filipino, may sapat na lakas, at hindi nagdaragdag ng ideyang napatay sila.
- source_word: צָרָיו
  choice: ang kanyang mga kaaway
  rationale: Malinaw at karaniwang katumbas ito ng צָרָיו sa diwang mga kalaban o mapanupil, at angkop sa marangal na wikang patula.
- source_word: אָחוֹר
  choice: paurong
  rationale: Pinananatili nito ang adverbiyal na diwa ng direksiyon—paatras o patungo sa likuran—nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
- source_word: חֶרְפַּת עוֹלָם
  choice: kahihiyang walang hanggan
  rationale: Ipinahahayag nito ang matagal at namamalaging pampublikong kahihiyan. Ang “walang hanggan” ay karaniwang biblikal na salin ng עוֹלָם ngunit sa kontekstong ito ay maaaring tumukoy sa kahihiyang nagpapatuloy o nananatili.
- source_word: נָתַן לָמוֹ
  choice: nilagyan niya sila
  rationale: Ang נתן na may ל ay maaaring mangahulugang maglagay o magpataw sa isang tao. Natural sa Filipino ang “nilagyan niya sila ng” at hindi kasing-literal ngunit alanganin ng “ibinigay niya sa kanila.”
