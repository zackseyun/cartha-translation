translation:
  language: tl
  text: Narinig ng Diyos at nag-alab ang kanyang galit[a]; lubos niyang itinakwil ang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “labis siyang nagalit.” Ang pandiwang Hebreo ay maaaring magpahayag ng pagiging galit o pagkakapukaw sa galit.
    reason: lexical_alternative
  - marker: b
    text: O, “hinamak” o “tinanggihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: Narinig ito
  rationale: Ang Qal perfect ay payak na “narinig.” Idinagdag ang “ito” bilang likas na pantukoy sa naunang isinalaysay sa konteksto, nang hindi tinutukoy nang higit sa sinasabi ng teksto kung ano mismo ang narinig.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan sa Hebreo, isahan ang diwa nito rito at malinaw na tumutukoy sa Diyos ng Israel.
- source_word: וַיִּתְעַבָּר
  choice: nag-alab ang kanyang galit
  rationale: Ang Hitpael ng עבר ay naghahayag ng matindi at nag-aalab na galit. Ang pariralang ito ay natural at marangal sa Filipino at pinananatili ang lakas ng pahayag.
- source_word: וַיִּמְאַס
  choice: itinakwil
  rationale: Ang מאס ay maaaring mangahulugang tumanggi, magtakwil, o humamak. Ang “itinakwil” ay angkop sa konteksto ng tipan at paghatol at mas malakas kaysa sa payak na “tinanggihan.”
- source_word: מְאֹד
  choice: lubos
  rationale: Pinatitindi ng pang-abay ang pagtatakwil; likas na ipinahahayag ito sa Filipino sa pariralang “lubos na itinakwil.”
- source_word: בְּיִשְׂרָאֵל
  choice: ang Israel
  rationale: Kasama ng מאס, itinuturo ng pang-ukol ang layon ng pagtatakwil. Sa Filipino, natural itong isalin bilang tuwirang layon.
theological_decisions:
- issue: Makataong pananalita tungkol sa galit at pagtatakwil ng Diyos
  choice: 'Panatilihin ang matinding personal na pananalita: “nag-alab ang kanyang galit” at “lubos niyang itinakwil.”'
  alternative: Palambutin bilang “hindi siya nasiyahan” at “inalis niya ang kanyang pagsang-ayon.”
  rationale: Matindi ang wikang Hebreo tungkol sa paghatol sa loob ng tipan. Pinananatili ng salin ang teolohikal na tensiyon at hindi pinahihina ang tindi ng pahayag ng salmo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nag-alab ang kanyang galit” upang ihatid ang matinding puwersa ng Hebreo nang hindi nagiging lipas o labis na kolokyal; ginamit ang “itinakwil” para sa matibay na diwa ng covenantal na pagtanggi.
