  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: tl
  text: 'Ibinigay niya sa pagkabihag ang kanyang lakas[a],


    at ang kanyang karilagan sa kamay ng kaaway.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Ipinailalim niya sa pagkabihag ang kanyang lakas.” Maaaring tumutukoy ang “kanyang lakas” sa kaban bilang tanda ng kapangyarihan ng Diyos sa gitna ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kamay ng kaaway” ay nangangahulugang nasa kapangyarihan ng kaaway. Ang “karilagan” ay maaari ring isaling “kaluwalhatian” o “kagandahan.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ibinigay niya
  rationale: Ang waw-consecutive na may נתן ay nagsasaad ng kasunod na pangyayaring naganap. Pinananatili ng “ibinigay” ang maikli at tuwirang pahayag ng Hebreo, habang ipinahihiwatig ng konteksto ang pagpapasakamay.
- source_word: לַשְּׁבִי
  choice: sa pagkabihag
  rationale: Ang שְׁבִי ay tumutukoy sa pagkabihag o kalagayan ng pagiging bihag. Ang “sa pagkabihag” ay malapit sa anyong Hebreo at likas sa makatang pahayag sa Filipino.
- source_word: עֻזּוֹ
  choice: ang kanyang lakas
  rationale: Ang עֹז ay “lakas” o “kapangyarihan.” Hindi tuwirang tinutukoy sa salin kung ito ay kaban, santuwaryo, o tanda ng presensya ng Diyos, kaya nananatili ang metonimiya at pahiwatig ng tula.
- source_word: וְתִפְאַרְתּוֹ
  choice: at ang kanyang karangyaan
  rationale: Ang תִּפְאֶרֶת ay maaaring mangahulugang karangyaan, kaluwalhatian, o kagandahan. Ang “karangyaan” ay naghahatid ng kadakilaan at kariktan nang hindi agad nagbibigay rito ng mas tiyak na teolohikal na kahulugan.
- source_word: בְיַד
  choice: sa kamay ng
  rationale: Pinananatili ng “sa kamay ng” ang larawang Hebreo at ang karaniwang idyoma para sa pagkakapailalim sa kapangyarihan ng iba.
- source_word: צָר
  choice: kaaway
  rationale: Ang צַר ay kaaway, kalaban, o maniniil. Ang “kaaway” ay malinaw, dignified, at likas sa modernong Filipino.
theological_decisions:
- issue: Kung tahasang kikilalanin ang “kanyang lakas” at “kanyang karangyaan” bilang kaban, santuwaryo, o nahayag na presensya ng Diyos
  choice: Panatilihin sa pangunahing teksto ang matalinghagang “kanyang lakas” at “kanyang karangyaan.”
  alternative: Tukuyin ang “lakas” bilang kaban ng tipan, o ipaliwanag ang dalawang parirala bilang santuwaryo o presensya ng Diyos.
  rationale: Malamang na ipinahihiwatig ng konteksto ang pagkabihag sa kaban, ngunit hindi iyon tuwirang pinangalanan ng Hebreo. Ang hindi tahasang pagtukoy rito ay nagpapanatili sa tunay na kalabuan at teolohikal na tensiyon ng tula.
translation_notes:
  register: Modernong Filipino na marangal at makata ngunit madaling maunawaan. Pinanatili ang maikling paralelismo at ang idyomang “sa kamay ng,” habang inilagay sa talababa ang posibleng pagtukoy sa kaban at ang saklaw ng kahulugan ng תִּפְאֶרֶת.
