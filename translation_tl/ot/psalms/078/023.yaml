translation:
  language: tl
  text: 'Gayunman, nag-utos siya sa mga ulap sa itaas[a],

    at binuksan niya ang mga pinto ng langit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kalangitan sa itaas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga tarangkahan ng langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: nag-utos siya
  rationale: Ang צוה ay karaniwang nangangahulugang “mag-utos.” Pinananatili ng salin ang personal at makapangyarihang pagkilos ng Diyos, at ang anyong pasalaysay ay likas na ipinahayag sa nagdaang panahunan sa Filipino.
- source_word: שְׁחָקִים
  choice: mga ulap
  rationale: Maaaring tumukoy ang שׁחקים sa mga ulap o sa kalangitan. Ang “mga ulap” ay kongkreto at akma sa larawan ng pagbibigay ng pagkain mula sa langit, habang ang leksikal na alternatibo ay inilagay sa talababa.
- source_word: מִמָּעַל
  choice: sa itaas
  rationale: Ipinahihiwatig nito ang kinalalagyan sa itaas. Ang “mga ulap sa itaas” ay natural sa modernong Filipino at hindi ipinapalagay na ang Diyos, sa halip na ang mga ulap, ang tinutukoy na nasa itaas.
- source_word: דַלְתֵי
  choice: mga pinto ng
  rationale: Ang דלת ay tuwirang nangangahulugang “pinto.” Pinananatili ng maramihang “mga pinto” ang makatang larawan ng tekstong Hebreo; ang “mga tarangkahan” ay posibleng alternatibo.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Sa pariralang ito, ang “langit” ay natural at marangal na katumbas ng שמים at pinananatili ang makatang larawang “mga pinto ng langit.”
- source_word: פָּתָח
  choice: binuksan niya
  rationale: Tuwirang nangangahulugan ang פתח na “buksan.” Hindi dinagdagan ng salin ang tindi ng kilos na wala naman sa Hebreo.
- source_word: וַ
  choice: Gayunman
  rationale: 'Bagaman malawak ang gamit ng waw at maaari itong isaling “at,” ipinakikita ng konteksto ang pagsalungat: sa kabila ng kawalan ng tiwala ng Israel, kumilos pa rin ang Diyos upang maglaan.'
theological_decisions:
- issue: Puwersang pandiskurso ng panimulang waw sa konteksto ng kawalan ng pananampalataya ng Israel at paglalaan ng Diyos
  choice: Isinaling pasalungat bilang “Gayunman”
  alternative: “At” o “Pagkatapos”
  rationale: Hindi likas na pasalungat ang pangatnig lamang, ngunit ang mas malawak na konteksto ng Awit 78 ay naghahambing sa kawalan ng tiwala ng Israel at sa patuloy na paglalaan ng Diyos. Pinananatili ng “Gayunman” ang tensiyong ito nang hindi nagdaragdag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang parallelism at makatang larawan ng mga ulap at mga pinto ng langit. Ginamit ang “Gayunman” upang ihayag ang kontekstuwal na pagsalungat nang hindi binabago ang payak na awtoridad ng pandiwang “nag-utos.”
