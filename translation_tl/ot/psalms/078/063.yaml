  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: tl
  text: 'Nilamon ng apoy ang kanyang mga binata,

    at ang kanyang mga dalaga ay hindi pinuri sa awit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi ipinagdiwang ang kanyang mga dalaga.” Malamang na tumutukoy ito sa kawalan ng mga awit sa kasal para sa mga dalaga dahil sa kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: kanyang mga binata
  rationale: Ang בָּחוּר ay tumutukoy sa mga lalaking nasa kasibulan ng buhay, kadalasa'y nasa edad ng pakikipagdigma o pag-aasawa. Likas sa modernong Tagalog ang “mga binata” at kaagapay ito ng “mga dalaga” sa ikalawang linya.
- source_word: אָכְלָה אֵשׁ
  choice: Nilamon ng apoy
  rationale: Bagaman literal na “kumain” ang אָכַל, kapag apoy ang simuno ay nangangahulugan itong lumamon o tumupok. Pinananatili ng “nilamon” ang matinding larawang Hebreo.
- source_word: וּבְתוּלֹתָיו
  choice: ang kanyang mga dalaga
  rationale: Ang בְּתוּלָה ay dalagang hindi pa nakikipagtalik, ngunit sa kontekstong ito ay pinakamalinaw at pinakanatural ang “mga dalaga”; ipinahihiwatig din nito ang kaagapay na pangkat na nasa edad ng pag-aasawa nang hindi gumagamit ng mas klinikal na pananalita.
- source_word: לֹא הוּלָּלוּ
  choice: hindi ipinagdiwang sa awitan
  rationale: Ang Pual ng הלל ay maaaring mangahulugang pinuri o ipinagdiwang. Malamang na mga awit sa kasal ang nasa likod ng pahayag, ngunit hindi ito tahasang sinabi sa Hebreo; kaya pinananatili ang awitan nang hindi isinasama ang “kasal” sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang magkatugmang “mga binata” at “mga dalaga” upang ihayag ang paralelismo. Ang “ipinagdiwang sa awitan” ay nagpapanatili sa posibleng kahulugan ng pandiwa at sa pahiwatig ng awit-pangkasal nang hindi ginagawang tahasan ang hindi tahasang sinabi ng Hebreo.
