  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: tl
  text: "Pinili niya si David na kanyang lingkod,\n    at kinuha niya siya mula sa mga kulungan ng mga tupa.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga kural” o “mula sa mga bakuran ng kawan.”
    reason: Ipinapakita ang mga posibleng salin ng מִמִּכְלְאֹת צֹאן. Ang צֹאן ay maaaring tumukoy sa kawan ng maliliit na alagang hayop, kabilang ang mga tupa at kambing.
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Pinili niya
  rationale: Ang Qal wayyiqtol ng בחר ay nagsasaad ng sunod na kilos sa salaysay. Likas at tuwiran sa Filipino ang “Pinili niya,” at hindi na kailangang isalin nang hiwalay ang panimulang waw bilang “at.”
- source_word: בְּדָוִד
  choice: si David
  rationale: Ginamit ang karaniwang anyo ng pangalang David at ang pantukoy na “si” para sa likas na balarilang Filipino.
- source_word: עַבְדּוֹ
  choice: na kanyang lingkod
  rationale: Maaaring mangahulugan ang עבד ng lingkod o alipin. Dito, marangal na paglalarawan ito sa kaugnayan ni David sa Diyos, kaya mas angkop sa konteksto ang “lingkod” kaysa “alipin.”
- source_word: וַיִּקָּחֵהוּ
  choice: at kinuha niya ito
  rationale: Pinananatili ng “kinuha” ang tuwirang kahulugan ng לקח. Ang “ito” ay natural na panghalip na tumutukoy kay David sa kasunod na sugnay.
- source_word: מִמִּכְלְאֹת
  choice: mula sa mga kulungan
  rationale: Ang מִכְלְאֹת ay mga nakabakod o nakasarang lugar para sa mga hayop. Ang “mga kulungan” ay malinaw at kasalukuyang Filipino, habang ang kasunod na “ng kawan” ang tumutukoy sa uri ng hayop.
- source_word: צֹאן
  choice: ng kawan
  rationale: Ang צאן ay tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Pinananatili ng “kawan” ang lawak ng salitang Hebreo at iniiwasang paliitin ito sa mga tupa lamang.
theological_decisions:
- issue: Paglalarawan kay David bilang עבד ng Diyos
  choice: kanyang lingkod
  alternative: kanyang alipin
  rationale: Ipinahihiwatig ng talata ang pagiging pag-aari at tagapaglingkod ni David sa Diyos, ngunit hindi nito binibigyang-diin ang sapilitang kalagayan ng isang alipin. Ang “lingkod” ang mas angkop na marangal at kontekstuwal na tawag nang hindi nagdaragdag ng natatanging doktrina.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kawan” upang mapanatili ang mas malawak na saklaw ng צאן, at inilagay sa talababa ang mas tiyak na “mga tupa” at ang mga leksikal na alternatibo para sa mga kulungan.
