id: PSA.78.34
reference: Psalms 78:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: tl
  text: 'Kapag[a] pinapatay niya sila, hinahanap nila siya;

    bumabalik sila[b] at buong-sikap na hinahanap ang Diyos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung.”
    reason: lexical_alternative
  - marker: b
    text: O “nanunumbalik sila”; maaaring magpahiwatig ng pagsisisi ang pandiwa, ngunit literal itong nangangahulugang “bumalik.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “maagang hinahanap,” isang idyoma para sa masikap o taimtim na paghahanap.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kapag
  rationale: Sa salaysay na patula, ipinakikita ng אִם ang paulit-ulit na pangyayari, kaya mas angkop ang “kapag” kaysa sa karaniwang kondisyunal na “kung.”
- source_word: הֲרָגָם
  choice: pinapatay niya sila
  rationale: Tuwirang nangangahulugan ang הרג na pumatay. Ang aspektong Filipino na “pinapatay” ay angkop sa paulit-ulit na kalagayang ipinahihiwatig ng “kapag”; ang di-binanggit na simuno ay ang Diyos ayon sa konteksto.
- source_word: וּדְרָשׁוּהוּ
  choice: hinahanap nila siya
  rationale: Ang דרש na may taong layon ay karaniwang nangangahulugang hanapin o lumapit sa taong iyon. Pinananatili ng salin ang tuwirang layong “siya.”
- source_word: וְשָׁבוּ
  choice: bumabalik sila
  rationale: Ang pangunahing kahulugan ng שוב ay bumalik o manumbalik. Hindi ginamit sa pangunahing teksto ang mas tahasang teolohikal na “nagsisisi” upang hindi higitan ang sinasabi ng Hebreo.
- source_word: וְשִׁחֲרוּ
  choice: buong-sikap na hinahanap
  rationale: Sa Piel, ang שחר ay literal na maiuugnay sa maagang paghahanap at idyomatikong nagpapahayag ng masikap o taimtim na paghahanap. Natural na ipinahahayag ito ng “buong-sikap” sa modernong Filipino.
- source_word: אֵל
  choice: Diyos
  rationale: Ang אֵל dito ay karaniwang titulong tumutukoy sa Diyos; hindi kailangan ang mas pinalawak na saling magdaragdag ng interpretasyon.
theological_decisions:
- issue: Kung isasalin ang וְשָׁבוּ sa tahasang wika ng pagsisisi
  choice: bumabalik sila
  alternative: nagsisisi sila; nanunumbalik sila
  rationale: Maaaring magpahiwatig ng pagsisisi ang שוב sa konteksto, ngunit ang saligang kahulugan nito ay bumalik. Pinananatili ng “bumabalik” ang posibleng teolohikal na pahiwatig nang hindi ito ginagawang tahasang pahayag.
- issue: Kung kikilalaning kondisyunal o temporal ang אִם
  choice: Kapag
  alternative: Kung
  rationale: Sa kontekstong nagsasalaysay ng paulit-ulit na asal ng bayan, mas malamang na temporal o circumstantial ang gamit. Gayunman, itinatala sa talababa ang literal na alternatibong “Kung.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatugmang aspektong “pinapatay” at “hinahanap” upang maipakita ang paulit-ulit na pangyayari. Hindi tahasang ginawang “nagsisisi” ang שוב, at pinanatiling maliit ang panghalip na “siya” ayon sa karaniwang estilo sa Filipino.
