base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/012.yaml
  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: tl
  text: Sa harap ng kanilang mga ninuno ay gumawa siya ng mga kababalaghan sa lupain ng Ehipto, sa mga bukid ng Zoan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bukid ng Zoan,” na malamang ay tumutukoy sa mga bukirin o rehiyong nakapaligid sa Zoan.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגֶד
  choice: Sa harap ng
  rationale: Ipinahahayag nito na ginawa ang mga kababalaghan sa presensiya at paningin ng kanilang mga ninuno, habang pinananatili ang payak na anyo ng Hebreo.
- source_word: אֲבוֹתָם
  choice: kanilang mga ninuno
  rationale: Bagaman literal na 'kanilang mga ama,' tumutukoy rito ang salita sa mga naunang salinlahi ng Israel na nakasaksi sa mga pangyayari sa Ehipto; mas malinaw at natural sa makabagong Tagalog ang 'mga ninuno.'
- source_word: עָשָׂה פֶלֶא
  choice: gumawa siya ng mga kababalaghan
  rationale: Pinananatili ng 'gumawa' ang karaniwang pandiwang Hebreo, at ang maramihang 'mga kababalaghan' ay likas sa Tagalog at angkop sa kolektibong diwa ng pangngalang isahan sa konteksto ng Exodo.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Tahasan nitong pinananatili ang heograpikong salitang 'lupain' sa Hebreo.
- source_word: שְׂדֵה צֹעַן
  choice: sa mga bukid ng Zoan
  rationale: Malapit ito sa literal na 'bukid ng Zoan'; ang maramihan ay natural sa Tagalog kapag tumutukoy sa mga bukirin o nakapalibot na pook.
