  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: tl
  text: Saka nagising ang Panginoon na para bang mula sa pagkakatulog[a], gaya ng mandirigmang sumisigaw dahil sa alak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng mandirigmang nagbubunyi dahil sa alak,” o “gaya ng makapangyarihang lalaking sumisigaw dahil sa alak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: nagising
  rationale: Ang pandiwang יקץ ay nangangahulugang magising o mapukaw mula sa pagkakatulog. Likas sa Filipino ang “nagising” at pinananatili nito ang matapang na larawang patula.
- source_word: כְּיָשֵׁן
  choice: na parang mula sa pagkakatulog
  rationale: Ang כְּ ay naghuhudyat ng paghahambing. Nililinaw ng “parang” na tayutay ito nang hindi pinahihina ang antropomorpikong larawan.
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Ito ay titulong banal na אֲדֹנָי, hindi ang Tetragrammaton; ang karaniwang marangal na katumbas sa Filipino ay “ang Panginoon.”
- source_word: כְּגִבּוֹר
  choice: gaya ng mandirigma
  rationale: Ang גִּבּוֹר ay maaaring tumukoy sa makapangyarihang lalaki o mandirigma. Ang “mandirigma” ay malinaw at angkop sa larawang pandigmaan.
- source_word: מִתְרוֹנֵן
  choice: sumisigaw
  rationale: Ang anyo ay nagpapahiwatig ng malakas na sigaw, na maaari ring may diwang pagbubunyi. Pinananatili ng “sumisigaw” ang lakas ng larawan nang hindi ipinipilit ang emosyon ng pagbubunyi.
- source_word: מִיָּיִן
  choice: dahil sa alak
  rationale: 'Malamang na sanhi o udyok ang ipinahihiwatig ng מִן dito: sumisigaw ang mandirigma sa epekto ng alak. Natural sa modernong Filipino ang “dahil sa alak.”'
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos na nagigising at inihahambing sa mandirigmang napukaw ng alak
  choice: Panatilihin ang paghahambing bilang matapang na larawang patula nang hindi ito pinapalambot.
  alternative: Ipaliwanag ang diwa bilang pagkilos ng Diyos matapos ang waring pananahimik, o alisin ang larawan ng pagkakatulog at alak.
  rationale: Inilalarawan ng salmo ang biglang mapagpasiyang pagkilos ng Panginoon matapos ang waring hindi pagkilos. Dapat manatili ang tunay na tensiyong teolohikal at lakas pampanitikan sa halip na ipaliwanag ito sa mismong teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Pagkatapos” bilang natural na panandang pasalaysay para sa וַ, at pinanatili ang masidhing simile ng Hebreo.
