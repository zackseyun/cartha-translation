  text: The sons of Ephraim[a], armed with bows, turned back on the day of battle.
translation:
  language: tl
  text: Ang mga anak ni Efraim[a]—mga armadong mamamana—ay umurong sa araw ng labanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga Efraimita—armado at nagpapana—ay umurong sa araw ng labanan.” Siksik ang pagkakabuo ng mga participle sa Hebreo, kaya maaari itong likas na isalin sa higit sa isang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili nito ang literal na idyomang Hebreo at ang diwang ang tinutukoy ay ang tribo o mga inapo ni Efraim; nililinaw sa talababa ang natural na alternatibong “mga Efraimita.”
- source_word: נוֹשְׁקֵי רוֹמֵי קָשֶׁת
  choice: mga nasasandatahang mamamana
  rationale: Ang dalawang siksik na participle ay naglalarawan sa kanila bilang mga mandirigmang may sandata at nagpapana. Ang pariralang Filipino ay maikli, natural, at pinananatili ang dalawang ideya nang hindi nagiging mabigat.
- source_word: הָפְכוּ
  choice: umurong
  rationale: Sa konteksto ng labanan, ipinahihiwatig ng pandiwa ang pagtalikod o pag-atras. Ang “umurong” ay natural sa Filipino at hindi nagdaragdag ng dahilan o uri ng pagkatalo.
- source_word: בְּיוֹם קְרָב
  choice: sa araw ng labanan
  rationale: Tuwirang katumbas ito ng temporal na parirala at nagpapanatili ng marangal at makatang himig.
