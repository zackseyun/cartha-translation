  register: Makabago at marangal na Filipino. Ginamit ang mga gitling na em upang malinaw na maipakita na ang “mga nasasandatahang mamamana” ay paglalarawan sa mga anak ni Efraim, habang pinananatili ang maikli at makatang ayos ng talata.
