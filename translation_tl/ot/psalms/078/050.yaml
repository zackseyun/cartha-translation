base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: tl
  text: Pinatag niya ang isang landas para sa kanyang galit[a]; hindi niya iniligtas ang kanilang buhay mula sa kamatayan[b], at ipinaubaya niya ang kanilang buhay sa salot[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naghanda siya ng daan para sa kanyang poot.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kanilang kaluluwa”; dito, ang kahulugan ay “kanilang buhay.”
    reason: lexical_alternative
  - marker: c
    text: O “pestilensiya,” isang nakamamatay na laganap na sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס
  choice: Pinatag niya
  rationale: Ang Piel ng פלס ay nagpapahiwatig ng pagpapatag o paghahanda ng daraanan. Pinananatili ng “pinatag” ang kongkretong larawang patula.
- source_word: נָתִיב
  choice: isang landas
  rationale: Ang נָתִיב ay landas o daanan. Likas itong katambal ng “pinatag” at malinaw sa makabagong Tagalog.
- source_word: לְאַפּוֹ
  choice: para sa kanyang galit
  rationale: Idyomatikong tumutukoy ang אַף sa galit, bagaman literal itong “ilong.” Pinananatili ng “para sa” ang layon o kapakinabangan ng landas nang hindi pinapawi ang talinghaga.
- source_word: לֹא חָשַׂךְ מִמָּוֶת
  choice: hindi niya iniligtas sa kamatayan
  rationale: Sa kontekstong ito, ang חשׂך na may מן ay nangangahulugang hindi pag-iwas o hindi pagliligtas mula sa kamatayan. Natural ito sa Tagalog habang tapat sa resulta ng parirala.
- source_word: נַפְשָׁם
  choice: ang kanilang buhay
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa mortal na buhay, hindi kinakailangang sa di-materyal na kaluluwa.
- source_word: וְחַיָּתָם
  choice: at ... ang kanilang buhay
  rationale: Ang חַיָּה rito ay ang kanilang buhay o nabubuhay na pag-iral at kahanay ng נַפְשָׁם. Pinanatili ang payak na pang-ugnay na “at” upang huwag gawing tahasang pasalungat ang Hebrew וְ.
- source_word: לַדֶּבֶר
  choice: sa salot
  rationale: Ang דֶּבֶר ay epidemikong salot o pestilensiya, lalo na bilang kaparusahan. Ang “salot” ay maikli, malinaw, at dignified sa Tagalog.
- source_word: הִסְגִּיר
  choice: ibinigay niya
  rationale: Ang Hiphil ng סגר ay maaaring mangahulugang ibigay o ipaubaya sa kapangyarihan ng iba. Sa pariralang ito, malinaw ang aktibong pagbibigay sa salot.
theological_decisions:
- issue: Antropomorpikong larawan ng galit ng Diyos
  choice: Panatilihin ang larawang “pinatag ... ang isang landas para sa kanyang galit.”
  alternative: “Binigyang-laya niya ang kanyang galit” o “ibinuhos niya ang kanyang poot.”
  rationale: May matingkad na talinghaga ang Hebrew na para bang may daraanang landas ang galit. Hindi ito dapat gawing abstraktong pahayag o dagdagan ng paliwanag na wala sa teksto.
- issue: Kahulugan ng נֶפֶשׁ
  choice: Isalin bilang “buhay.”
  alternative: “kaluluwa”
  rationale: Sa konteksto ng kamatayan at salot, ang tinutukoy ay ang mortal nilang buhay. Iniiwasan nitong ipasok ang isang partikular na doktrina tungkol sa kaluluwa na hindi hinihingi ng talata.
- issue: Ugnayan ng dalawang huling sugnay
  choice: Gamitin ang “at” para sa וְ.
  alternative: “kundi” o “subalit”
  rationale: Maaaring maunawaan ang ikalawang sugnay bilang pagpapaliwanag o pagtutuloy, ngunit hindi tiyak na pasalungat ang וְ. Pinananatili ng “at” ang sintaktikong kaluwagan ng Hebrew.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang konkretong talinghaga ng landas at galit, ginamit ang “buhay” ayon sa konteksto ng נֶפֶשׁ, at iniwasan ang mas teknikal o lumang salitang hindi kailangan. Lahat ng pananda ng talababa ay nasa pangunahing teksto.
