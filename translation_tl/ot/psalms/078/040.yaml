  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: tl
  text: 'Kay dalas nilang maghimagsik laban sa kanya sa ilang,

    at pighatiin siya sa tigang na lupain![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilang ulit silang naghimagsik laban sa kanya sa ilang.” Maaaring idiin ng pambungad na pananalita ang paulit-ulit na paghihimagsik.
    reason: lexical_alternative
  - marker: b
    text: O “at saktan siya” o “at inisin siya” sa tigang na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Kay dalas
  rationale: Sa padamdam na gamit na ito, binibigyang-diin ang paulit-ulit na pangyayari, hindi ang literal na paghingi ng bilang. Likas sa makabagong Tagalog ang “Kay dalas” at angkop sa himig ng panaghoy.
- source_word: יַמְרוּהוּ
  choice: maghimagsik laban sa kanya
  rationale: Ang pandiwang מרה ay nagpapahayag ng pagsuway o paghihimagsik laban sa Diyos. Malinaw na naihahatid ng “maghimagsik laban sa kanya” ang tahasang pagsalungat.
- source_word: בַמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa rehiyong ilang na pinaglagalag ng Israel. Ang “ilang” ay maikli, marangal, at may pamilyar na heograpikong diwa sa wikang biblikal na Tagalog.
- source_word: יַעֲצִיבוּהוּ
  choice: dulutan siya ng dalamhati
  rationale: Ang Hiphil ng עצב ay maaaring mangahulugang magdulot ng sakit, dalamhati, o pagkayamot. Pinananatili ng parirala ang personal at emosyonal na puwersa ng Hebreo nang hindi ito ginagawang malamig o di-personal.
- source_word: בִּישִׁימוֹן
  choice: sa tigang na lupain
  rationale: Ang יְשִׁימוֹן ay isang tiwangwang, tigang, o ilang na lugar. Naiiba ang “tigang na lupain” sa “ilang” habang pinananatili ang magkatulad ngunit hindi ganap na magkaparehong mga larawan sa paralelismo.
theological_decisions:
- issue: Antropopatikong paglalarawan sa Diyos sa יַעֲצִיבוּהוּ
  choice: Panatilihin ang personal at pandamdaming pahayag na “dulutan siya ng dalamhati.”
  alternative: “saktan siya” o “yamutin siya”
  rationale: Tahasang inilalarawan ng Hebreo na ang paghihimagsik ng Israel ay nagdudulot ng dalamhati sa Diyos. Pinananatili ng salin ang teolohikal na tensiyon sa halip na gawing impersonal ang pagkakasala laban sa kanya.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Ginamit ang maikli at pamilyar na “ilang” para sa מִדְבָּר at ang mas deskriptibong “tigang na lupain” para sa יְשִׁימוֹן upang mapanatili ang pagkakaiba ng dalawang magkaugnay na terminong patula. Ang “Kay dalas” ay nagpapanatili sa padamdam at mapanaghoy na tono.
