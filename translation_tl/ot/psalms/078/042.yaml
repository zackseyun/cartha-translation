  - marker: b
    text: O “kalaban” o “mang-aapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: inalala
  rationale: Ang Qal na זכר ay karaniwang nangangahulugang alalahanin o tandaan. Kasama ng לֹא, malinaw at likas sa Filipino ang “hindi nila inalala,” at hindi nito pinatitindi ang diwa gaya ng maaaring gawin ng “lubusan nilang kinalimutan.”
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Pinananatili ang kongkretong larawang Hebreo. Sa konteksto, ang “kamay” ay talinghaga para sa kapangyarihan o ginawa ng Diyos, ngunit nauunawaan pa rin ang larawang ito sa Filipino.
- source_word: יוֹם אֲשֶׁר
  choice: ang araw nang
  rationale: Pinananatili nito ang tahasang pagbanggit sa “araw” at ang temporal na ugnayan ng Hebreo, sa halip na paikliin lamang bilang “noong.”
- source_word: פָּדָם
  choice: tubusin niya sila
  rationale: Ang פדה ay may diwa ng pagtubos o pagpapalaya mula sa pagkaalipin o panganib. Ang “tubusin” ay nagpapanatili sa tiyak na bigat ng salita sa konteksto ng Exodo nang hindi nagdaragdag ng doktrinang wala sa talata.
- source_word: מִנִּי צָר
  choice: mula sa kaaway
  rationale: Ang צָר ay maaaring tumukoy sa kaaway, kalaban, o mang-aapi. Ang “kaaway” ay maikli, natural, at angkop sa marangal na panulaan ng salmo.
theological_decisions:
- issue: Talinghagang “kanyang kamay”
  choice: Panatilihin sa pangunahing teksto ang “kanyang kamay.”
  alternative: “kanyang kapangyarihan” o “ang ginawa ng kanyang kamay”
  rationale: Ang Hebreo ay gumagamit ng kongkretong larawan ng kamay para sa kapangyarihan at pagkilos. Ang pagpapanatili rito ay umiiwas sa tahimik na pagpapaliwanag o paglilimita sa saklaw ng talinghaga.
- issue: Kahulugan ng פדה sa konteksto ng Exodo
  choice: Isalin bilang “tubusin.”
  alternative: “palayain” o “iligtas”
  rationale: Ipinahihiwatig ng pandiwa ang mapagligtas na pagkuha sa Israel mula sa pang-aapi. Pinananatili ng “tubusin” ang leksikal at teolohikal na bigat nito nang hindi ipinapasok ang mga susunod na pormulasyong doktrinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikli at siksik na estruktura ng tulang Hebreo, pati ang kongkretong talinghaga ng “kamay.” Ginamit ang “kanyang” bilang karaniwang modernong baybay; hindi nilagyan ng malaking titik ang panghalip sapagkat wala itong katumbas na pagtatangi sa tekstong Hebreo.
