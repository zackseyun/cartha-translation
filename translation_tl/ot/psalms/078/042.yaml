  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: tl
  text: Hindi nila inalala ang kanyang kamay[a] noong araw na tinubos niya sila mula sa kaaway[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang kapangyarihan” o “ang ginawa ng kanyang kamay.” Literal sa Hebreo ang “kanyang kamay.”
