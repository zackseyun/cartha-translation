  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: tl
  text: Mula sa pagsunod sa mga inahing tupang nagpapasuso[a], dinala niya siya upang maging pastol ng Jacob, na kanyang bayan, at ng Israel, na kanyang mana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa likuran ng mga inahing tupang may mga anak.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mana” ay maaari ring isaling “pamana,” “pamanang pag-aari,” o “pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: Mula sa pagsunod sa
  rationale: Pinananatili nito ang larawang si David ay nasa likuran at sumusunod sa kawan, sa halip na gawing mas malawak na “mula sa pag-aalaga.”
- source_word: עָלוֹת
  choice: mga tupang nagpapasuso
  rationale: Tumutukoy ang anyong pambabaeng maramihan sa mga inahing tupang nagpapasuso ng kanilang mga anak; malinaw ito sa modernong Filipino nang hindi inaalis ang tiyak na tagpong pastoral.
- source_word: הֱבִיאוֹ
  choice: dinala niya siya
  rationale: Tuwirang isinasalin ang Hiphil ng בוא bilang “dinala”; ang Diyos ang ipinahihiwatig na simuno at si David ang layon ayon sa naunang konteksto.
- source_word: לִרְעוֹת
  choice: upang pastulan
  rationale: Ang “pastulan” ay natural na pandiwang Filipino para sa pagganap bilang pastol at pinananatili ang ugnayan ng literal na pagpapastol ni David at ng kanyang pamumuno sa bayan.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: ang Jacob na kanyang bayan
  rationale: 'Ipinakikita nito ang ugnayang appositional: ang Jacob ay ang kanyang bayan, habang pinananatili ang patulang pangalan at paralelismo.'
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: at ang Israel na kanyang mana
  rationale: Ang “mana” ang tuwirang katumbas ng נַחֲלָה at pinananatili ang tipanang pahiwatig; maaari rin itong unawain bilang minanang pag-aari.
theological_decisions:
- issue: Ang maharlika at pastoral na talinghaga ng pagkatawag kay David
  choice: Pinanatili ang tahasang larawan ng pagpapastol sa “upang pastulan.”
  alternative: upang pamunuan / upang alagaan
  rationale: Sadyang pinag-uugnay ng talata ang dating literal na gawain ni David sa mga tupa at ang kanyang tungkulin sa Israel. Hindi ito pinapadalisay tungo sa pangkalahatang pamumuno o pag-aaruga.
- issue: Pagkakakilanlan ng ipinahihiwatig na simuno at layon
  choice: Pinanatili ang “dinala niya siya,” na umaasa sa konteksto para sa Diyos at kay David.
  alternative: dinala ng Diyos si David
  rationale: Mas malinaw ang alternatibo ngunit tahasang idinaragdag nito ang mga pangalang hindi inuulit sa talatang Hebreo; ang napiling anyo ay nagpapanatili ng pagkakaugnay sa naunang talata.
translation_notes:
  register: Modernong Filipino na marangal at patula. Ginamit ang “tupang nagpapasuso” para sa tiyak na larawang pastoral at “pastulan” upang mapanatili ang mahalagang pag-uugnay sa literal at maharlikang tungkulin ni David. Ang bahagyang pormal na “ang Jacob na kanyang bayan” ay nagpapanatili sa apposisyon at paralelismo ng Hebreo.
