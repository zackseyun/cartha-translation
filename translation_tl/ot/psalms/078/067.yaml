  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: tl
  text: At itinakwil niya ang tolda ni Jose[a], at hindi niya pinili ang lipi ni Efraim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinamak niya ang tolda ni Jose.”
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy ay ang Efraim bilang pangunahing lipi sa mga liping nagmula kay Jose; inihahanda ng talata ang pagpili sa Juda at Sion sa kasunod na konteksto.
