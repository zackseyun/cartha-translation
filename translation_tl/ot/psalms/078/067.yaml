lexical_decisions:
- source_word: וַיִּמְאַס
  choice: Kaya itinakwil niya
  rationale: Ang מָאַס ay nangangahulugang itakwil, tanggihan, o hamakin. Ang “itinakwil” ay malinaw at marangal, at naipapahayag ang mariing pagtanggi nang hindi kinakailangang magdagdag ng tahasang damdaming paghamak. Ang “Kaya” ay nag-uugnay sa daloy at bunga ng naunang salaysay.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: ang tolda ni Jose
  rationale: Literal na “tolda” ang אֹהֶל. Pinananatili nito ang matalinghagang larawan ng tirahan o pook na kaugnay ni Jose, sa halip na agad itong ipakahulugang sambahayan o santuwaryo.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: ang lipi ni Efraim
  rationale: Bagaman maaaring mangahulugan ang שֵׁבֶט ng tungkod o setro, ang “lipi” ang natural na kahulugan dito dahil pangalan ng tribo ang Efraim at kapantay ito ng “tolda ni Jose.”
- source_word: לֹא בָחָר
  choice: hindi niya pinili
  rationale: Tuwirang salin ito ng בָּחַר at pinananatili ang wika ng pagpili nang hindi ipinapasok ang mas teknikal na terminong teolohikal.
theological_decisions:
- issue: Ang makasaysayan at teolohikal na diwa ng pagtatakwil at pagpili ng Diyos sa mga sentrong pantribo ng Israel
  choice: Panatilihin ang kongkretong pagtukoy sa tolda ni Jose at lipi ni Efraim bilang hindi piniling sentrong pantribo o santuwaryo.
  alternative: Unawain ang Jose at Efraim bilang tahasang sagisag ng buong kaharian sa hilaga.
  rationale: Isinasalaysay ng Awit 78 ang paglipat ng katanyagan ng sentrong santuwaryo mula sa nasasakupan ng Efraim tungo sa Juda at Zion sa mga kasunod na talata. Hindi dapat palitan ng salin ang kongkretong wikang pantribo ng Hebreo ng isang mas malawak na interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tolda,” “lipi,” at “pinili” upang mapanatili ang konkretong larawang Hebreo at maiwasan ang labis na pagpapakahulugan. Inilagay ang mga pananda ng talababa sa mismong tekstong pangunahing salin.
