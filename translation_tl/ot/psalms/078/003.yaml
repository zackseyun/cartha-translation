  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pinananatili ang pang-ugnay na tumutukoy sa mga bagay na binanggit sa naunang talata, nang hindi nagdaragdag ng tahasang pangngalan.
- source_word: וַנֵּדָעֵם
  choice: at nalaman
  rationale: Ang pandiwa ay nangangahulugang ‘nalaman’ o ‘nakilala’; likas sa Tagalog na hindi na ulitin ang layon sapagkat malinaw ito mula sa konteksto.
- source_word: וַאֲבוֹתֵינוּ
  choice: aming mga ninuno
  rationale: Sa kontekstong salinlahi at pagpapasa ng tradisyon, mas malinaw at natural ang ‘mga ninuno’ kaysa literal na ‘mga ama.’
- source_word: סִפְּרוּ־לָנוּ
  choice: isinalaysay sa amin
  rationale: Ipinapahayag ang masinsing pagkukuwento o pagsasalaysay, hindi lamang payak na pagsasabi.
