  text: He made it fall in the midst of their camp[a], all around their dwellings.
translation:
  language: tl
  text: Ibinagsak niya ang mga iyon sa gitna ng kanilang kampo[a], sa palibot ng kanilang mga tirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kaniyang kampo” at “kaniyang mga tirahan.” Malamang na kolektibong tumutukoy kay Israel ang mga hulaping isahan sa Hebreo, kaya “kanilang” ang ginamit sa salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: Ibinagsak niya
  rationale: 'Ang Hiphil ng נפל ay may diwang sanhi: pinangyari niyang bumagsak ang bagay na tinutukoy. Sa Filipino, natural na ipinahihiwatig ng pandiwang “ibinagsak” ang layong iyon.'
- source_word: בְּקֶרֶב
  choice: sa gitna ng
  rationale: Tumutukoy ito sa kinalalagyan sa loob o kalagitnaan, hindi lamang sa pagiging malapit.
- source_word: מַחֲנֵהוּ
  choice: kanilang kampo
  rationale: Bagaman isahan ang hulaping Hebreo (“kaniyang”), kolektibo ang tinutukoy nitong Israel; ang maramihang “kanilang” ang natural sa Filipino at kaayon ng sumunod na maramihang “mga tirahan.”
- source_word: סָבִיב
  choice: sa palibot ng
  rationale: Ipinahahayag nito na ang pagbagsak ay nakapaligid o nakakalat sa buong paligid.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: kanilang mga tirahan
  rationale: Ang מִשְׁכָּן dito ay malawak na tumutukoy sa mga dakong tinitirhan; mas tumpak ang “mga tirahan” kaysa sa mas tiyak na “mga tolda.”
- source_word: implied object from context
  choice: ang mga iyon
  rationale: Maramihan ang mga pugo sa konteksto ng naunang talata. Ginagawang malinaw ng “ang mga iyon” ang ipinahihiwatig na layon nang hindi inuulit ang pangngalan.
