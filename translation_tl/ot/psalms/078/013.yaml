  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: tl
  text: Biniyak[a] niya ang dagat at pinaraan[b] niya sila; pinatindig niya ang tubig na parang bunton.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hinati.”
    reason: lexical_alternative
  - marker: b
    text: O, “pinatawid.”
    reason: lexical_alternative
  - marker: c
    text: O, “parang pader.” Sa Hebreo, “parang bunton,” na nagdidiin sa larawang naipon o nakatambak ang tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: biniyak
  rationale: Ipinahihiwatig ng pandiwa ang paghati o pagbitak upang mabuksan. Ang “biniyak” ay matingkad at likas sa makabagong Filipino.
- source_word: יָם
  choice: ang dagat
  rationale: Tumutukoy ito sa dagat na dinaanan sa salaysay ng paglabas, ngunit hindi espesipikong pinangalanan sa talata.
- source_word: וַיַּעֲבִירֵם
  choice: pinaraan niya sila
  rationale: 'Napananatili nito ang causative na diwa ng Hiphil: siya ang nagpadaan sa kanila.'
- source_word: וַיַּצֶּב
  choice: pinatindig niya
  rationale: Ipinapahayag nito ang causative na diwa ng pagtatayo o pagpapanatiling nakatayo, habang iniingatan ang matingkad na larawang patula.
- source_word: מַיִם
  choice: ang tubig
  rationale: Ang “tubig” ang likas na pangngalang di-mabilang sa Filipino at malinaw na tumutukoy sa tubig ng dagat.
- source_word: כְּמוֹ
  choice: na parang
  rationale: Likas na naghahayag ng paghahambing sa Filipino.
- source_word: נֵד
  choice: bunton
  rationale: Tumutukoy ang salita sa naipong o nakatambak na masa. Pinananatili ng “bunton” ang konkretong larawan ng Hebreo nang hindi ito pinapalitan ng mas interpretatibong “pader.”
theological_decisions:
- issue: Ang larawan ng himala sa dagat
  choice: Pinanatili ang konkretong larawan na pinatindig ang tubig na parang bunton, nang hindi ipinaliliwanag ang mekanismo.
  alternative: Isalin nang mas malaya bilang “pinigil niya ang tubig” o unawain lamang bilang pagmamalabis na patula.
  rationale: Inilalahad ng talata ang gawa ng Diyos sa pamamagitan ng matingkad na larawan ng paglabas. Pinananatili ng salin ang lakas at tensiyong teolohikal ng teksto nang hindi nagpapasiya sa mga debateng hindi nilulutas ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biniyak” at “pinatindig” upang mapanatili ang matingkad na tula at mga causative na kilos ng Diyos, samantalang ang “bunton” ay tuwirang kumakatawan sa larawang Hebreo.
