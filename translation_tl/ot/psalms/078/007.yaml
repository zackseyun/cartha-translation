id: PSA.78.7
reference: Psalms 78:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: tl
  text: upang ilagak nila sa Diyos ang kanilang pag-asa[a], at huwag nilang kalimutan ang mga gawa ng Diyos[b], kundi tuparin ang kanyang mga utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang pagtitiwala” o “kanilang kumpiyansa.”
    reason: lexical_alternative
  - marker: b
    text: O “mga ginawa ng Diyos” o “mga kilos ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: upang ilagak nila
  rationale: 'Ang Qal imperfect ng שׂים ay nangangahulugang ‘ilagay’ o ‘ilagak.’ Sa daloy mula sa naunang talata, likas sa Filipino ang sugnay na nagsasaad ng layunin: ‘upang ilagak nila.’'
- source_word: בֵאלֹהִים
  choice: sa Diyos
  rationale: Ang ב ay tumutukoy sa Diyos bilang pinaglalagakan ng pag-asa o pagtitiwala; natural sa Filipino ang ‘ilagak sa Diyos.’
- source_word: כִּסְלָם
  choice: ang kanilang pag-asa
  rationale: Ang כֶּסֶל ay maaaring tumukoy sa pag-asa, pagtitiwala, o kumpiyansa. Ang ‘pag-asa’ ay malinaw at natural, habang ang talababa ay nagpapanatili sa iba pang tunay na posibilidad.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: at huwag nilang kalimutan
  rationale: Pinananatili nito ang negatibong layunin o inaasahang bunga ng pandiwang imperfect sa isang natural na anyong Filipino.
- source_word: מַעַלְלֵי אֵל
  choice: ang mga gawa ng Diyos
  rationale: Ang מַעֲלָלִים ay mga gawa o kilos. Ang ‘mga gawa’ ay dignified at madaling maunawaan; itinatala sa talababa ang ‘mga ginawa’ bilang alternatibo.
- source_word: וּמִצְוֺתָיו
  choice: ang kanyang mga utos
  rationale: Ang מִצְוֹת ay mga utos o kautusan. Ang ‘mga utos’ ay natural sa modernong Filipino at nananatili ang diwang tipan at pagsunod.
- source_word: יִנְצֹרוּ
  choice: tuparin
  rationale: Ang נצר ay literal na ‘ingatan’ o ‘bantayan’; kapag mga utos ang layon, ang ‘tuparin’ ay natural na nagpapahayag ng maingat na pagsunod, bagaman maaaring isalin ding ‘ingatan.’
theological_decisions:
- issue: Pagbibigay-kahulugan sa magkatulad na katawagang אֱלֹהִים at אֵל
  choice: Parehong isinalin na ‘Diyos’
  alternative: Isalin ang אֵל bilang ‘Makapangyarihan’
  rationale: Karaniwang katawagan sa Diyos ang dalawang salitang Hebreo at ginagamit dito sa paralelismong patula. Ang parehong ‘Diyos’ ay hindi nagpapasok ng pagkakaibang teolohikal na hindi binibigyang-diin ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘ilagak’ dahil natural itong kasama ng ‘pag-asa’ at pinananatili ang konkretong diwa ng ‘set/place.’ Ginamit ang ‘kundi’ upang luminaw ang pagtutol sa pagkalimot at ang positibong panawagan na sundin ang mga utos.
