translation:
  language: tl
  text: 'Ibinigay niya ang kanilang ani sa balang na lumalamon[a],

    at ang bunga ng kanilang pagpapagal sa balang na nagkukumpulan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “uod na sumisira sa pananim.” Malamang na mas malawak ang tinutukoy ng salitang Hebreo: insektong umuubos ng pananim, na madalas inuunawang isang uri ng balang sa mga tekstong nagsasalaysay ng mga salot.'
    reason: lexical_alternative
  - marker: b
    text: O “ang kanilang pagpapagal.” Ang salitang Hebreo ay maaaring tumukoy sa mismong pagpapagal o sa bungang napala rito.
