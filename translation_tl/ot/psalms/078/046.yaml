lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ibinigay niya
  rationale: Tuwirang ipinapahayag ang kahulugan ng נתן at pinananatili ang Hebreong idyoma; ipinahihiwatig na ng konteksto na ito ay pagsuko ng ani bilang hatol.
- source_word: לֶחָסִיל
  choice: sa manlalamong balang
  rationale: Ang חָסִיל ay isang insektong sumisira at umuubos ng pananim, na karaniwang inuunawang uri ng balang sa mga salaysay ng salot. Ipinakikita ng “manlalamon” ang mapaminsalang katangian nito nang hindi nag-aangkin ng tiyak na uring zoolohikal.
- source_word: יְבוּלָם
  choice: ang kanilang ani
  rationale: Ang יְבוּל ay ani o bunga ng lupa. Likas at malinaw sa modernong Tagalog ang “ani” sa kontekstong agrikultural.
- source_word: וִיגִיעָם
  choice: ang bunga ng kanilang pagpapagal
  rationale: Maaaring tumukoy ang יְגִיעַ sa mismong pagpapagal o sa napala mula rito. Dahil inihahandog ito sa balang at kapantay ng “ani,” malinaw na naipapahayag ng pariralang ito ang malamang na metonimikong diwa habang itinatala sa talababa ang literal na alternatibo.
- source_word: לָאַרְבֶּה
  choice: sa nagkukumpulang balang
  rationale: Ang אַרְבֶּה ang karaniwang salita para sa balang. Ang “nagkukumpulang” ay tumutulong maiba ito sa חָסִיל at inilalarawan ang karaniwang pagdating ng mga balang nang maramihan, nang hindi labis na tinutukoy ang eksaktong uri.
