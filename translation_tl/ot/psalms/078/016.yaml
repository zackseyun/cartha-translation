  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: tl
  text: 'Nagpalabas siya ng mga batis mula sa bato,

    at pinaagos niyang pababa ang tubig na parang mga ilog.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpalabas siya ng umaagos na tubig mula sa bato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Nagpalabas siya
  rationale: 'Ang Hiphil ng יצא ay nagpapahayag ng sanhi: ang Diyos ang nagpangyaring lumabas ang mga batis. Likas sa makabagong Tagalog ang “nagpalabas” at malinaw nitong pinananatili ang diwang causative.'
- source_word: נוֹזְלִים
  choice: mga batis
  rationale: Ang participle mula sa נזל ay tumutukoy sa umaagos na bagay o tubig. Sa konteksto, ang “mga batis” ay malinaw, natural, at angkop sa larawang patula.
- source_word: מִסָּלַע
  choice: mula sa bato
  rationale: Ang סלע ay bato o malaking batuhan. Pinananatili ng “mula sa bato” ang payak na larawan at ang pahiwatig sa himala sa ilang nang hindi nagdaragdag ng paliwanag.
- source_word: וַיּוֹרֶד
  choice: pinadaloy niya
  rationale: Ang Hiphil ng ירד ay causative, ‘pinababa’ o ‘pinangyaring bumaba.’ Para sa tubig, natural sa Tagalog ang “pinadaloy,” habang nananatili ang ideya na siya ang sanhi ng pag-agos nito.
- source_word: כַּנְּהָרוֹת
  choice: na parang mga ilog
  rationale: Ang prefixed כ ay naghuhudyat ng paghahambing, at ang נהרות ay maramihang ‘mga ilog.’ Ang “parang mga ilog” ay tuwirang nagpapanatili sa simile.
- source_word: מָיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang mass noun ang מָיִם. Ang “tubig” ang likas na katumbas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang patulang ayos. Pinanatili ang dalawang causative na pandiwa at ang paghahambing sa mga ilog. Ang “siya” ay hindi pinalitan ng tahasang “Diyos” upang hindi magdagdag sa tekstong Hebreo.
