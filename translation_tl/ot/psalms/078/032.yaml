  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: tl
  text: Sa kabila ng lahat ng ito, nagkasala pa rin sila at hindi naniwala sa kanyang mga kamangha-manghang gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nagtiwala sa kanyang mga kamangha-manghang gawa” o “hindi pinaniwalaan ang kanyang mga kamangha-manghang gawa.” Ang pandiwang Hebreo ay maaaring mangahulugang maniwala o magtiwala, at ang kaugnayan nito sa mga kamangha-manghang gawa ng Diyos ay maaaring ipahayag sa bahagyang magkakaibang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: Sa kabila ng lahat ng ito
  rationale: 'Concessive ang parirala sa konteksto: sa kabila ng mga naunang paghatol at paglalaan ng Diyos, nagpatuloy ang bayan sa pagkakasala.'
- source_word: חָטְאוּ עוֹד
  choice: patuloy pa rin silang nagkasala
  rationale: Ang חָטְאוּ ay tuwirang 'nagkasala,' at ang עוֹד ay nagpapahiwatig ng nagpapatuloy na pagkilos. Natural sa Filipino ang 'patuloy pa rin' upang idiin ang kanilang matigas na pagpapatuloy.
- source_word: וְ/לֹא הֶאֱמִינוּ
  choice: at hindi naniwala
  rationale: Pinananatili ng 'at' ang payak na koordinasyon ng Hebreo. Maaaring mangahulugan ang הֶאֱמִינוּ ng paniniwala o pagtitiwala; 'naniwala' ang pangunahing salin dito nang hindi inaalis ang alternatibong diwa.
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: sa kanyang mga kamangha-manghang gawa
  rationale: Tumutukoy ang נִפְלָאוֹת sa pambihira at kahanga-hangang mga gawa ng Diyos. Nililinaw ng 'mga ... gawa' na mga kilos ang tinutukoy, hindi lamang mga bagay na nakapagtataka.
theological_decisions:
- issue: Ang uri ng kabiguan ng Israel bilang tugon sa mga gawa ng Diyos
  choice: hindi naniwala sa kanyang mga kamangha-manghang gawa
  alternative: hindi nagtiwala dahil sa kanyang mga kamangha-manghang gawa / hindi pinaniwalaan ang kanyang mga kamangha-manghang gawa
  rationale: Pinananatili ng salin ang tensiyon sa Hebreo sa pagitan ng hindi paniniwala at hindi pagtitiwala, nang hindi nagdaragdag ng mas malawak na paliwanag tungkol sa pananampalataya o katigasan ng puso.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang 'Sa kabila ng lahat ng ito' bilang malinaw na concessive expression at 'patuloy pa rin' upang maipakita ang continuative force ng עוֹד. Nasa pangunahing teksto ang marker na [a].
