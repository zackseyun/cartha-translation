  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: tl
  text: Kumain ang tao ng tinapay ng mga makapangyarihan[a]; nagpadala siya sa kanila ng mga panustos hanggang sa sila'y mabusog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “tinapay ng mga anghel.” Mas literal sa Hebreo: “tinapay ng mga makapangyarihan” o “tinapay ng mga makapangyarihang nilalang.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: tinapay
  rationale: Pinananatili ang kongkretong larawan at pangunahing kahulugan ng salitang Hebreo sa halip na gawing pangkalahatang “pagkain.”
- source_word: אַבִּירִים
  choice: mga makapangyarihan
  rationale: Ito ang tuwirang leksikal na diwa ng Hebreo at hindi nito agad nilulutas ang tinutukoy bilang mga anghel; inilalahad ang tradisyonal na pagbasa sa talababa.
- source_word: אָכַל
  choice: kumain
  rationale: Ang qatal ay angkop na isinalin bilang payak na naganap na kilos sa salaysay na patula.
- source_word: אִישׁ
  choice: ang tao
  rationale: Kinakatawan nito ang tao o sangkatauhan sa pangkalahatan habang pinananatili ang anyong isahan ng Hebreo.
- source_word: צֵידָה
  choice: pagkain
  rationale: Sa kontekstong ito, tumutukoy ito sa panustos na pagkain; mas natural sa makabagong Tagalog ang “pagkain” kaysa “mga panustos,” at naiiba pa rin ito sa “tinapay” sa unang sugnay.
- source_word: שָׁלַח
  choice: pinadalhan
  rationale: Likas nitong ipinahahayag sa Tagalog ang pagpapadala sa kanila ng pagkain, kasama ang di-tuwirang layon na לָהֶם.
- source_word: לָשֹׂבַע
  choice: sagana hanggang sa mabusog
  rationale: Ipinapahayag nito kapwa ang kasapatan o kasaganaan at ang bungang pagkabusog na nasa pariralang Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa אַבִּירִים sa pariralang “tinapay ng mga makapangyarihan”
  choice: Isinalin sa pangunahing teksto bilang “mga makapangyarihan.”
  alternative: “mga anghel”
  rationale: Bagaman matagal nang inuunawa ang parirala bilang “tinapay ng mga anghel” dahil sa konteksto ng manna, hindi tiyak na “mga anghel” ang tuwirang kahulugan ng salitang Hebreo. Pinananatili ng pangunahing teksto ang leksikal na diwa at ng talababa ang tradisyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang parallelism ng dalawang sugnay at ang kongkretong larawang “tinapay,” habang ang “sagana hanggang sa mabusog” ay natural na nagpapahayag ng ganap na kasapatan.
