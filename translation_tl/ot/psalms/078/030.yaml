  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: tl
  text: Hindi pa nila tinalikuran ang kanilang pagnanasa[a]; nasa bibig pa nila ang kanilang pagkain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi pa sila nahiwalay sa kanilang pagnanasa.” Mas pormal itong pagsasalin ng pandiwang Hebreo; sa konteksto, malamang na ang diwa ay hindi pa nila ito tinalikuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: tumatalikod
  rationale: Ang pandiwa ay maaaring mangahulugang lumihis, lumayo, o mawalay. Sa konteksto, ipinahihiwatig nito na hindi pa nila iniiwan o tinatalikuran ang kanilang labis na paghahangad.
- source_word: מִתַּאֲוָתָם
  choice: sa kanilang matinding pagnanasa
  rationale: Ang תַּאֲוָה ay pagnanasa o matinding paghahangad. Idinagdag ang “matinding” upang malinaw ang labis at sakim na paghahangad sa pagkain sa konteksto, nang hindi ito awtomatikong ipakahulugang seksuwal.
- source_word: עוֹד
  choice: pa
  rationale: Ipinahihiwatig nito ang kalagayang nagpapatuloy sa mismong sandaling iyon; natural itong ipinapahayag sa Tagalog sa hulmaing “nasa ... pa.”
- source_word: אָכְלָם
  choice: ang kanilang pagkain
  rationale: Tuwirang katumbas ito ng pangngalang tumutukoy sa kanilang pagkain at malinaw sa makabagong Tagalog.
- source_word: בְּפִיהֶם
  choice: nasa bibig nila
  rationale: Natural sa Tagalog ang kolektibong “bibig nila,” kahit maramihan ang tinutukoy ng hulaping Hebreo.
