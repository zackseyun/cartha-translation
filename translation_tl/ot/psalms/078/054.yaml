  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: tl
  text: Kaya dinala niya sila sa kanyang banal na lupain[a]—ang bundok na ito[b] na tinamo[c] ng kanyang kanang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang banal na hangganan” o “hangganan ng kanyang kabanalan.” Ang salitang Hebreo ay maaaring mangahulugang “hangganan,” “sakop,” o “teritoryo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “burol na ito.” Maaaring tumukoy ang parirala sa bulubunduking lupaing ibinigay ng Diyos sa Israel at maaari ring magpahiwatig ng Sion sa mas malawak na konteksto.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “inangkin,” “nakuha,” o “binili.” Dito, inilalarawan ng pandiwa ang lugar na natamo sa pamamagitan ng kapangyarihan ng kanang kamay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: Kaya dinala niya sila
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “papuntahin.” Ipinapakita ng “Kaya” ang pagpapatuloy ng salaysay sa konteksto ng awit.
- source_word: גְּבוּל קָדְשׁוֹ
  choice: kanyang banal na lupain
  rationale: Maaaring tumukoy ang גְּבוּל sa hangganan o sa teritoryong saklaw nito. Sa konteksto ng pagdadala sa Israel sa lupaing itinakda ng Diyos, likas sa Tagalog ang “banal na lupain,” habang itinatala sa talababa ang literal na alternatibo.
- source_word: הַר זֶה
  choice: ang bundok na ito
  rationale: Pinananatili nito ang tiyak ngunit hindi tahasang kinilalang tinutukoy ng pariralang Hebreo, nang hindi ito awtomatikong ipinapakahulugang Sion o buong bulubundukin ng Canaan.
- source_word: קָנְתָה
  choice: tinamo
  rationale: Saklaw ng קנה ang pagtatamo, pag-angkin, pagbili, o pagkakaroon. Ang “tinamo” ay angkop sa makatang larawan ng kapangyarihan ng Diyos at hindi nagpapahiwatig ng komersiyal na pagbili.
- source_word: יְמִינוֹ
  choice: kanyang kanang kamay
  rationale: Pinananatili ang tahasang larawang antropomorpiko ng Hebreo para sa kapangyarihan at pagtatagumpay ng Diyos.
theological_decisions:
- issue: Ang tinutukoy ng “bundok na ito”
  choice: Panatilihin ang literal na “ang bundok na ito” sa pangunahing teksto.
  alternative: Sion; ang bulubundukin ng Canaan; ang lupaing-bundok na ibinigay sa Israel
  rationale: Hindi tahasang pinangalanan ng talata ang bundok. Maaaring umugnay ang konteksto sa lupaing minana ng Israel at sa Sion, kaya hindi nilulutas ng salin ang sadyang hindi tiyak na pagtukoy.
- issue: Ang “banal na lupain” bilang saklaw o hangganan
  choice: Gamitin ang “banal na lupain” upang ipahayag ang teritoryong pinagdalan sa Israel.
  alternative: kanyang banal na hangganan; hangganan ng kanyang kabanalan
  rationale: Pinahihintulutan ng גְּבוּל ang kahulugang “hangganan” at “teritoryo.” Mas malinaw sa konteksto ng pagpasok sa lupain ang teritoryal na diwa, ngunit pinananatili sa talababa ang leksikal na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang em dash upang malinaw na ipakitang ang “bundok na ito” ay kapantay na paglalarawan sa “kanyang banal na lupain,” hindi hiwalay na patutunguhan.
