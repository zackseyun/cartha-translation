base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: tl
  text: upang malaman ng susunod na salinlahi—mga anak na isisilang pa—at bumangon sila at isalaysay sa kanilang mga anak,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at tuwirang naghahayag ng layunin o nilalayong resulta sa Filipino.
- source_word: יֵדְעוּ
  choice: malaman ito
  rationale: Ang anyong di-ganap kasunod ng לְמַעַן ay nagpapahayag ng nilalayong resulta. Ang “ito” ay tumutukoy sa naunang nilalaman at ginagawang natural sa Filipino ang ipinahiwatig na layon.
- source_word: דּוֹר אַחֲרוֹן
  choice: susunod na salinlahi
  rationale: Tumutukoy sa salinlahing darating pagkatapos, hindi kinakailangang sa pangwakas na salinlahi sa kasaysayan.
- source_word: בָּנִים יִוָּלֵדוּ
  choice: mga anak na isisilang pa
  rationale: Pinananatili ang hinaharap at balintiyak na diwa ng pandiwa. Sa konteksto, ang panlalaking pangmaramihang בָּנִים ay tumutukoy sa mga anak o inapo sa pangkalahatan.
- source_word: יָקֻמוּ
  choice: bumangon
  rationale: Pinananatili ang matingkad na larawan ng pagbangon upang kumilos at ipagpatuloy ang paghahatid sa susunod na salinlahi.
- source_word: וִיסַפְּרוּ
  choice: at isalaysay ito
  rationale: Ang ספר dito ay tumutukoy sa pasalitang pagsasalaysay o paghahatid ng nalalaman; ang “ito” ay likas na tumutukoy sa paksang minana mula sa naunang salinlahi.
- source_word: לִבְנֵיהֶם
  choice: sa kanilang mga anak
  rationale: Ipinahahayag ang sunod-sunod na paghahatid sa loob ng mga salinlahi; ang panlalaking anyo sa Hebreo ay ginagamit dito para sa mga anak sa pangkalahatan.
theological_decisions:
- issue: Panlalaking katawagan sa mga inapo (בָּנִים / לִבְנֵיהֶם)
  choice: Isinalin bilang “mga anak” at “kanilang mga anak.”
  alternative: “mga anak na lalaki” at “kanilang mga anak na lalaki”
  rationale: Ang usapin ng talata ay ang paghahatid sa mga susunod na salinlahi, hindi ang pagtatangi sa mga lalaking anak lamang. Ang salin ay kumakatawan sa pangkalahatang gamit ng panlalaking pangmaramihan habang ipinababatid sa talababa ang literal na anyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang mga gatlang upang malinaw na ipakitang ang “mga anak na isisilang pa” ay pagpapaliwanag sa “susunod na salinlahi.” Ang “sila naman” ay likas na naghahayag ng pagpapatuloy mula sa isang salinlahi tungo sa kasunod nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
