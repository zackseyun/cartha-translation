  terminology: Ang “Diyos,” “sinubok,” at “puso” ay angkop sa modernong Filipino Tagalog at sa marangal na rehistro ng Awit. Maayos ang pag-iwas sa “tinukso,” na maaaring magpahiwatig ng pag-aakit sa pagkakasala. Dapat manatiling hindi-doktrinal ang paliwanag sa nefesh at kilalanin ang kontekstuwal na diwa ng gana/pagnanasa.
