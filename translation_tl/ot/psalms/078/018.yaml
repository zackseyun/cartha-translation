  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: tl
  text: Sinubok nila ang Diyos sa kanilang puso sa pamamagitan ng paghingi ng pagkain para sa kanilang sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinubok nila ang Diyos sa kanilang puso sa pamamagitan ng paghingi ng pagkain upang bigyang-kasiyahan ang kanilang gana.” Literal na “para sa kanilang nefesh.” Ang nefesh ay maaaring mangahulugang “sarili,” “buhay,” “pagnanasa,” o “gana”; sa kontekstong ito, maaari itong tumukoy sa kanilang gana o paghahangad ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: Sinubok nila
  rationale: Ang piel ng נסה ay nangangahulugang ‘subukin’ o ‘ilagay sa pagsubok.’ Likas at tumpak sa modernong Tagalog ang ‘sinubok’ at hindi nito ipinahihiwatig na inakit nila ang Diyos na magkasala.
- source_word: אֵל
  choice: ang Diyos
  rationale: Karaniwang titulong pantukoy sa Diyos ang אֵל; malinaw at natural sa Tagalog ang ‘Diyos.’
- source_word: בִּלְבָבָם
  choice: sa kanilang puso
  rationale: Pinananatili nito ang isahang kolektibong anyo ng Hebreo at ang diwa ng kanilang panloob na saloobin bilang isang bayan.
- source_word: לִשְׁאָל
  choice: nang humingi sila
  rationale: Ipinakikita ng parirala ang paraan kung paano nila sinubok ang Diyos. Mas natural sa Tagalog ang ‘nang humingi sila’ kaysa sa isang tahasang infinitibong konstruksyon.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Pangkalahatang salita para sa pagkain ang אֹכֶל; hindi ito dapat paliitin sa ‘tinapay.’
- source_word: לְנַפְשָׁם
  choice: para sa kanilang sarili
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa sarili, buhay, pagnanasa, o gana. Ang ‘kanilang sarili’ ay malapit sa anyo ng Hebreo at pinananatili ang lawak nito, habang inilalahad sa talababa ang kontekstuwal na posibilidad na ‘gana’ o ‘pagnanasa.’
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng paghahangad ng pagkain
  choice: para sa kanilang sarili
  alternative: para sa kanilang gana / upang bigyang-kasiyahan ang kanilang pagnanasa
  rationale: Hindi ipinipilit ng pangunahing teksto na ang נֶפֶשׁ ay ‘kaluluwa’ sa diwang antropolohikal. Pinananatili ng ‘sarili’ ang leksikal na kaluwagan, samantalang kinikilala ng talababa na maaaring nangingibabaw sa konteksto ang gana o pagnanasa.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Pinanatili ang kolektibong isahan na ‘kanilang puso’ at iniwasan ang mas lumang ‘tinukso ang Diyos,’ na maaaring maling magpahiwatig ng pag-aakit sa kasalanan.
