  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: tl
  text: Pinaulanan niya sila ng manna upang kainin nila, at ibinigay niya sa kanila ang butil ng langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “butil ng mga langit.” Makatang paglalarawan ito sa manna; sa mga kaugnay na konteksto, isinasalin din itong mas interpretatibo bilang “pagkain mula sa langit” o “tinapay mula sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Pinaulanan niya
  rationale: Ang Hiphil ng מטר ay causative, “nagpaulan.” Likas sa Filipino ang “pinaulanan niya” at napapanatili nito ang matalinghagang larawan ng saganang pagbuhos mula sa itaas.
- source_word: עֲלֵיהֶם
  choice: sila
  rationale: Ang layon ng “pinaulanan” ay likas na ipinahahayag sa Filipino bilang “sila,” na katumbas ng diwang “sa kanila/sa ibabaw nila.”
- source_word: מָן
  choice: manna
  rationale: Ang “manna” ang kinikilalang katawagan sa pagkaing ibinigay sa Israel sa ilang; malinaw ito at naaayon sa karaniwang gamit sa Bibliyang Filipino.
- source_word: לֶאֱכֹל
  choice: upang kainin
  rationale: Ang infinitive na may ל ay nagsasaad ng layunin. Ang “upang kainin” ay tuwiran at nagpapanatili ng anyo ng Hebreo nang hindi dinaragdagan ang tahasang simuno.
- source_word: דְגַן
  choice: butil
  rationale: Ang דגן ay tumutukoy sa butil o ani ng cereal. Mas natural at makata sa pariralang ito ang “butil” kaysa sa mas teknikal na “butil ng pananim.”
- source_word: שָׁמַיִם
  choice: langit
  rationale: Sa construct phrase, ang “langit” ay natural na katumbas sa Filipino at nagpapanatili sa maringal at makatang larawan.
- source_word: נָתַן
  choice: ibinigay niya
  rationale: Tuwirang isinasalin ng “ibinigay” ang karaniwang pandiwang נתן at pinananatili ang payak na kilos ng Diyos.
- source_word: לָמוֹ
  choice: sa kanila
  rationale: Ang makatang panghalip ay nangangahulugang “sa kanila”; tahasan at natural itong ipinahayag bilang di-tuwirang layon sa Filipino.
theological_decisions:
- issue: Matalinghagang paglalarawan sa manna bilang “butil ng langit”
  choice: Panatilihin ang “butil ng langit.”
  alternative: pagkain mula sa langit; tinapay mula sa langit
  rationale: Tahasang gumagamit ang Hebreo ng דגן (“butil”) bilang makatang parallel sa manna. Ang pagpapanatili sa metapora ay hindi ipinapalit ang mas interpretatibong pananalita mula sa kaugnay na mga talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang metapora at parallelism ng Hebreo; hindi ginawang mas interpretatibo ang “butil ng langit.”
