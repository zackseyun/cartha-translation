  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: tl
  text: 'Hindi nila tinupad ang tipan ng Diyos,

    at tumanggi silang lumakad ayon sa kanyang kautusan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtuturo” o “tagubilin.” Ang Hebreong torah ay maaaring tumukoy sa kautusan, pagtuturo, o tagubilin ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: tinupad
  rationale: Sa kaugnayan ng tipan, ang שׁמר ay nangangahulugang ingatan o sundin ang mga pananagutan nito. Likas sa modernong Filipino ang “tinupad ang tipan” at malinaw nitong ipinahihiwatig ang pagsunod nang hindi nagiging sobrang literal.
- source_word: בְּרִית אֱלֹהִים
  choice: ang tipan ng Diyos
  rationale: Pinananatili nito ang pormal at marangal na anyo ng pariralang Hebreo at malinaw na tumutukoy sa tipang itinatag ng Diyos.
- source_word: וּבְתוֹרָתוֹ
  choice: ayon sa kanyang kautusan
  rationale: Ang תּוֹרָה ay maaaring tumukoy sa kautusan, pagtuturo, o tagubilin. Sa konteksto ng tipan, pinananatili ng “kautusan” ang normatibong diin; natural namang ipinahahayag ng “ayon sa” ang pamumuhay na naaayon dito.
- source_word: מֵאֲנוּ
  choice: tumanggi sila
  rationale: Malinaw at tuwirang ipinapahayag ng “tumanggi” ang sinadyang pagtutol o ayaw na nakapaloob sa מאן.
- source_word: לָלֶכֶת
  choice: lumakad
  rationale: Pinananatili ng “lumakad” ang biblikal na talinghaga para sa asal at paraan ng pamumuhay, samantalang nililinaw ng “ayon sa” ang ugnayan nito sa kautusan.
- source_word: לֹא
  choice: Hindi
  rationale: Tuwirang inililipat ang payak na pagtanggi sa natural na ayos ng pangungusap sa Filipino.
theological_decisions:
- issue: Paglilipat ng תּוֹרָה sa konteksto ng tipan
  choice: kautusan
  alternative: pagtuturo o tagubilin
  rationale: Ang pagkakahanay ng pagtupad sa tipan at paglakad sa תּוֹרָה ay nagbibigay rito ng normatibo at pangtipang puwersa. Gayunman, mas malawak ang saklaw ng salitang Hebreo kaysa sa mga batas lamang, kaya pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na idyomang “lumakad,” ngunit ginamit ang natural na “ayon sa kanyang kautusan.” Inilagay ang panandang [a] pagkatapos ng “kautusan,” ang salitang aktuwal na tinutukoy ng talababa.
