  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: tl
  text: Ngunit pinili niya ang lipi ni Juda at ang Bundok Zion na kanyang minahal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, iisang pandiwa ang sinusundan ng dalawang tuwirang layon: “ang lipi ni Juda, ang Bundok Zion na kanyang minahal.”'
    reason: Ipinapakita ang pormal na kayarian ng Hebreo at ang posibilidad na panatilihin ang dalawang parirala nang walang idinagdag na “at.”
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Ngunit pinili niya
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa konteksto ay may malinaw na pagsalungat sa pagtatakwil sa lipi ni Jose at sa Efraim sa naunang talata. Kaya likas sa Tagalog ang “Ngunit,” habang pinananatili ng “pinili” ang diwa ng בחר.
- source_word: שֵׁבֶט יְהוּדָה
  choice: ang lipi ni Juda
  rationale: Sa kontekstong ito, ang שֵׁבֶט ay tumutukoy sa isang lipi ng Israel. Ang “lipi ni Juda” ay malinaw at karaniwang anyo sa makabagong Tagalog.
- source_word: הַר צִיּוֹן
  choice: ang Bundok Zion
  rationale: Ang “Bundok Zion” ay maikli, likas, at pinananatili ang heograpikong pangalang Zion.
- source_word: אֲשֶׁר אָהֵב
  choice: na kanyang minahal
  rationale: Ang sugnay na may אֲשֶׁר ay pinakamalapit na tumutukoy sa Bundok Zion. Ang “minahal” ay tuwirang nagpapahayag sa aspektong ganap ng אָהֵב nang hindi dinaragdagan ang teolohikong kahulugan.
- source_word: אֶת ... אֶת
  choice: ang lipi ni Juda at ang Bundok Zion
  rationale: Dalawang tuwirang layon ang minamarkahan ng inuulit na אֶת sa ilalim ng iisang pandiwa. Idinagdag ang “at” upang maging malinaw at likas sa Tagalog na kapuwa layon ng pagpili ang Juda at Zion; inilalahad sa talababa ang mas pormal na ayos ng Hebreo.
theological_decisions:
- issue: Ugnayan ng pagpili ng Diyos sa Juda at Zion
  choice: Ituring ang lipi ni Juda at Bundok Zion bilang dalawang tuwirang layon ng iisang pandiwang “pinili.”
  alternative: Panatilihin silang magkatabi nang walang “at,” na maaaring magmukhang ang Bundok Zion ay paliwanag o apposition sa lipi ni Juda.
  rationale: Ang pag-uulit ng panandang אֶת ay sumusuporta sa dalawang layon ng pagpili. Hindi pinalalawak ng salin ang pahayag tungo sa isang sistematikong doktrina ng paghirang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “lipi” sa halip na mas teknikal o makalumang salita, at “Bundok Zion” bilang likas na anyo ng pangalan ng pook.
