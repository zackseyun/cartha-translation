  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: tl
  text: 'Kaya winakasan niya ang kanilang mga araw sa kawalang-saysay,[a]

    at ang kanilang mga taon sa sindak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kahungkagan”; maaari ring isalin ang kasunod na parirala na “sa biglang sindak.”
    reason: Pinananatili ang saklaw ng הֶבֶל bilang kahungkagan/kawalang-saysay at ng בֶּהָלָה bilang sindak na maaaring may diwa ng biglaan.
lexical_decisions:
- source_word: וַיְכַל
  choice: winakasan niya
  rationale: Ang pandiwang כלה ay maaaring mangahulugang tapusin, ubusin, o dalhin sa wakas. Ang “winakasan niya” ay natural sa makabagong Filipino at malinaw na nagpapanatili sa Diyos bilang ipinahihiwatig na gumagawa.
- source_word: בַּהֶבֶל
  choice: sa kawalang-saysay
  rationale: Ang הֶבֶל ay literal na singaw o hininga at metaporikal na tumutukoy sa panandalian, hungkag, o walang saysay. Sa kontekstong ito, ang “kawalang-saysay” ay malinaw na naglalarawan sa nauwi sa wala nilang mga araw.
- source_word: יְמֵיהֶם
  choice: ang kanilang mga araw
  rationale: Pinananatili ang konkretong larawang temporal at ang paralelismo ng Hebreo sa “kanilang mga taon.”
- source_word: וּשְׁנוֹתָם
  choice: at ang kanilang mga taon
  rationale: Tuwirang salin na nagpapanatili sa poetikong paralelismo ng “mga araw” at “mga taon.”
- source_word: בַּבֶּהָלָה
  choice: sa sindak
  rationale: Ang בֶּהָלָה ay maaaring tumukoy sa matinding takot, biglang pagkagulat, pagkataranta, o pagmamadali. Ang “sindak” ay maikli, dignipikado, at angkop sa konteksto ng paghuhukom.
theological_decisions:
- issue: Ipinahihiwatig na simuno ng pandiwa
  choice: 'Ginawang lantad ang Diyos sa panghalip na “niya”: “winakasan niya.”'
  alternative: Impersonal na “nagwakas ang kanilang mga araw.”
  rationale: Ang konteksto ay nag-uukol ng pagkilos sa Diyos bilang paghatol, at ang panlalaking isahang anyo ng pandiwa sa Hebreo ay sumusuporta sa tahasang ahensiya.
- issue: Kahulugan ng בַּבֶּהָלָה
  choice: “sa sindak” bilang kalagayan ng kanilang mga taon sa ilalim ng paghatol
  alternative: “sa biglang sindak,” “sa pagkataranta,” o “sa pagmamadali”
  rationale: Hindi tahasang nilulutas ng salin kung ang diin ay matinding takot o biglaang pangyayari; inilalagay sa talababa ang lehitimong alternatibong “biglang sindak.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikling paralelismo ng tulang Hebreo at iniwasan ang mas teknikal o makalumang “kabulaanan.”
