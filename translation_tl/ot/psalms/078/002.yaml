lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: Ibubuka ko
  rationale: Ang anyong Qal na first-person singular ay may volitional-future na diwa. Ang “ibubuka” ay likas na katambal ng “aking bibig” at pinananatili ang kongkretong larawan ng Hebreo.
- source_word: בְמָשָׁל
  choice: sa isang talinghaga
  rationale: Maaaring tumukoy ang מָשָׁל sa kawikaan, talinghaga, o matalinghagang pahayag. Sa pagkakatulad nito sa “mga palaisipan,” ang “talinghaga” ay angkop sa matalinghaga at mapagturong pananalita habang pinananatili sa talababa ang ibang posibilidad.
- source_word: פִּי
  choice: ang aking bibig
  rationale: Tuwirang pinananatili nito ang kongkreto at natural na idyoma ng Hebreo sa halip na gawing abstraktong “pananalita.”
- source_word: אַבִּיעָה
  choice: bibigkasin ko
  rationale: Ang Hiphil ng נבע ay maaaring maglarawan ng pagpapadaloy o pagbubulalas ng pananalita. Ang “bibigkasin ko” ay malinaw, marangal, at natural sa kasalukuyang Filipino.
- source_word: חִידוֹת
  choice: mga palaisipan
  rationale: Ang חִידָה ay isang bugtong o palaisipan, at maaari ring tumukoy sa malalalim o mahiwagang pahayag. Ang “mga palaisipan” ay tuwiran at nauunawaan nang hindi ipinapalagay na sadyang madilim ang kahulugan.
- source_word: מִנִּי קֶדֶם
  choice: mula pa noong unang panahon
  rationale: Tumutukoy ang parirala sa sinaunang panahon o matagal nang nakalipas. Hindi nito labis na ipinahihiwatig ang pasimula ng paglikha gaya ng maaaring gawin ng “mula sa simula.”
theological_decisions:
- issue: Ugnayan ng talata sa Mateo 13:35 at ang kahulugan ng מָשָׁל / חִידוֹת
  choice: Isinalin ang Hebreo ayon sa sarili nitong saklaw bilang “talinghaga” at “mga palaisipan,” nang hindi ito ipinantay sa tradisyonal na “mga bagay na nakatago” ng sipi sa Mateo.
  alternative: “Ibubuka ko ang aking bibig sa isang kawikaan; sasambitin ko ang malalalim na pahayag mula noong unang panahon.”
  rationale: Pinananatili nito ang pangunahing patotoo ng tekstong Hebreo at ang tunay na lawak ng kahulugan nito. Mahalaga ang sipi sa Mateo bilang intertekstuwal na kaugnayan, ngunit hindi nito dapat tahimik na baguhin ang kahulugan ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang patulang kongkretong larawan ng pagbubuka ng bibig at gumamit ng karaniwang salitang “palaisipan” upang maging malinaw sa ordinaryong mambabasa. Inilagay ang mga panandang talababa kaagad sa kaugnay na mga salita, hindi sa baligtad na pagkakasunod ng consultation text.
