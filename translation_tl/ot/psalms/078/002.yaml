  text: Ibubuka ko ang aking bibig upang magsalita sa talinghaga[a][d]; bibigkasin ko ang mga palaisipan[b] mula pa noong unang panahon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang kawikaan” o “sa isang matalinghagang pahayag.” Maaaring tumukoy ang salitang Hebreo sa kawikaan, talinghaga, o matalinghagang pananalita.
    reason: lexical_alternative
  - marker: b
