  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: tl
  text: Pagkatapos, inilabas niya ang kanyang bayan na parang mga tupa, at pinatnubayan sila na parang isang kawan sa ilang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: inilabas niya
  rationale: Ang Hiphil ng נסע ay nagpapahayag ng pagsasanhi sa paglalakbay o pagpapaalis mula sa isang lugar. Sa konteksto ng paglabas mula sa Ehipto, natural na ipinahahayag ng “inilabas niya” ang kaukulang diwang sanhi nang hindi nagiging mekanikal o marahas.
- source_word: כַּצֹּאן
  choice: na parang mga tupa
  rationale: Ang צאן ay tumutukoy sa maliliit na hayop na inaalagaan, lalo na sa mga tupa at kambing. Dahil sa larawang pastoral at sa kasunod na “kawan,” malinaw at natural sa Filipino ang “mga tupa.”
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ang עם ay tumutukoy sa isang sambayanan o bayan. Ang “kanyang bayan” ay nagpapanatili sa ugnayan ng Diyos at ng Israel nang hindi nagdaragdag ng paliwanag.
- source_word: וַיְנַהֲגֵם
  choice: pinatnubayan sila
  rationale: Ang נהג ay maaaring mangahulugang umakay, gumabay, o magdala gaya ng ginagawa sa isang kawan. Ang “pinatnubayan” ay nagpapahiwatig ng maingat na paggabay at umiiwas sa di-kailangang pag-uulit ng unang pandiwa.
- source_word: כָּעֵדֶר
  choice: na parang isang kawan
  rationale: Ang עדר ay kawan ng mga hayop. Ang “isang kawan” ay umaayon sa naunang larawan ng mga tupa at likas pakinggan sa Filipino.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay lupang ilang o kaparangan at hindi laging mabuhanging disyerto. Ang “sa ilang” ay maikli, dignificado, at angkop sa konteksto ng Exodo.
theological_decisions:
- issue: Larawan ng Diyos bilang pastol ng Israel sa konteksto ng Exodo
  choice: 'Tuwirang pinanatili ang dalawang paghahambing: ang bayan ay gaya ng mga tupa at ginabayan gaya ng isang kawan.'
  alternative: Palawakin ang talinghaga sa pamamagitan ng tahasang pagtawag sa Diyos na “Pastol.”
  rationale: Ipinahihiwatig ng tekstong Hebreo ang papel ng pastol sa pamamagitan ng mga pandiwa at paghahambing ngunit hindi tahasang ginagamit dito ang pangngalang “pastol.” Pinananatili ng salin ang larawan nang walang idinagdag na doktrinal na pagpapaliwanag.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “bayan,” “pinatnubayan,” “kawan,” at “ilang” upang mapanatili ang tono ng salmo at ang pastoral na larawan nang hindi nagiging lipas o labis na teknikal.
