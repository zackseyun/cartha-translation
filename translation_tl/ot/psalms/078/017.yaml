translation:
  language: tl
  text: Ngunit nagpatuloy pa rin silang magkasala laban sa kanya at maghimagsik laban sa Kataas-taasan sa tigang na lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ilang” o “sa tuyot na lupain.” Ang salitang Hebreo ay partikular na tumutukoy sa isang tuyo at tigang na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Ngunit nagpatuloy pa rin sila
  rationale: Ang Hiphil ng יסף na may infinitive ay nagsasaad ng pagpapatuloy o pag-uulit; pinagsasama ng “nagpatuloy pa rin” ang puwersa ng וַיּוֹסִיפוּ at עוֹד, habang ipinahihiwatig ng “Ngunit” ang pagsalungat sa naunang konteksto.
- source_word: לַחֲטֹא לוֹ
  choice: magkasala laban sa kanya
  rationale: Ang חטא na may ל ay maaaring mangahulugang magkasala laban sa isang tao; ang panghalip ay likas na tumutukoy sa Diyos ayon sa konteksto.
- source_word: לַמְרוֹת
  choice: na naghimagsik laban sa
  rationale: Ang מרה ay tumutukoy sa mapanghimagsik na pagsuway. Iniuugnay ng pariralang ito ang paghihimagsik bilang paglalarawan o karagdagang pagtukoy sa kanilang pagkakasala.
- source_word: עֶלְיוֹן
  choice: Kataas-taasan
  rationale: Pinananatili nito ang bigat ng banal na titulong “Most High” sa isang kinikilala at marangal na anyong Tagalog.
- source_word: בַּצִּיָּה
  choice: sa tigang na lupain
  rationale: Ang צִיָּה ay partikular na tumutukoy sa tuyot o tigang na lugar; mas tiyak ito kaysa sa pangkalahatang “ilang,” bagaman iyon ang konteksto.
theological_decisions:
- issue: Paglilipat ng banal na titulong עֶלְיוֹן
  choice: Kataas-taasan
  alternative: Pinakamataas
  rationale: Ang “Kataas-taasan” ay natural at marangal na banal na titulo sa Tagalog at pinananatili ang diwang nakahihigit sa lahat nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpatuloy pa rin” upang likas na maipahayag ang pagpapatuloy at pag-uulit, at “tigang na lupain” upang mapanatili ang tiyak na larawang ibinibigay ng Hebreo.
