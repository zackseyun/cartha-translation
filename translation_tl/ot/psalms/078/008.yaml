language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: tl
  text: upang hindi sila maging tulad ng kanilang mga ninuno—isang salinlahing matigas ang ulo at mapaghimagsik, isang salinlahing hindi pinatatag ang puso nito[a] at ang espiritu nito ay hindi naging tapat sa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi inihanda ang puso nito” o “hindi itinatag ang puso nito.”
    reason: lexical_alternative
  - marker: b
    text: O “ang espiritu nito ay hindi naging matatag sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: upang hindi sila maging
  rationale: Ipinagpapatuloy nito ang layunin mula sa naunang talata; natural na ipinahahayag ng “upang” ang ugnayang iyon sa Tagalog.
- source_word: כַאֲבוֹתָם
  choice: tulad ng kanilang mga ninuno
  rationale: Ang literal na “kanilang mga ama” ay maaari, ngunit ang “mga ninuno” ang mas malinaw na tumutukoy sa naunang salinlahi sa modernong Tagalog.
- source_word: דּוֹר
  choice: salinlahi
  rationale: Karaniwang salin para sa isang magkakapanahong pangkat at pinananatili ang pag-uulit sa tula.
- source_word: סוֹרֵר וּמֹרֶה
  choice: matigas ang ulo at mapaghimagsik
  rationale: Ipinahahayag ng dalawang salita kapwa ang sadyang pagmamatigas at aktibong paghihimagsik.
- source_word: הֵכִין לִבּוֹ
  choice: hindi pinatatag ang puso nito
  rationale: Pinananatili ang metapora ng panloob na katatagan; maaaring mangahulugan din ang pandiwa na ihanda, itatag, o ituon nang tama.
- source_word: לִבּוֹ
  choice: puso nito
  rationale: Pinananatili ang Hebreong idyoma para sa kalooban at panloob na disposisyon, pati ang isahang anyo na tumutukoy sa kolektibong “salinlahi.”
- source_word: נֶאֶמְנָה אֶת אֵל רוּחוֹ
  choice: ang espiritu nito ay hindi naging tapat sa Diyos
  rationale: Ang “tapat” ay malinaw na naghahatid ng pagiging maaasahan o matatag sa kaugnayan sa Diyos, habang pinananatili ang “espiritu” bilang hiwalay sa “puso.”
theological_decisions:
- issue: Pagpapares ng “puso” at “espiritu”
  choice: Panatilihin bilang dalawang magkaugnay ngunit magkahiwalay na katawagan.
  alternative: Pagsamahin ang mga ito bilang “kalooban” o “panloob na pagkatao.”
  rationale: Magkaibang salita ang ginamit ng Hebreo, kaya hindi dapat patagin ang makatang at teolohikal na pagkakaiba ng mga ito.
- issue: Isahang mga panghalip para sa kolektibong “salinlahi”
  choice: Gamitin ang “puso nito” at “espiritu nito.”
  alternative: Gamitin ang maramihang “kanilang mga puso” at “kanilang mga espiritu.”
  rationale: Isahan ang mga hulapi sa Hebreo at tumutukoy sa isahang kolektibong pangngalang “salinlahi”; malinaw rin ito sa Tagalog.
- issue: Ugnayan ng espiritu sa Diyos
  choice: “hindi naging tapat sa Diyos”
  alternative: “hindi naging matatag sa Diyos” o “hindi naging matatag na kasama ng Diyos”
  rationale: Pinananatili ng “tapat” ang relasyonal na diwa nang hindi nilulutas nang labis ang maaaring kahulugang katatagan ng נֶאֶמְנָה.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” para sa malinaw na intergenerational na diwa. Inilagay ang mga talababa sa mismong mga pariralang may leksikal na alternatibo.
