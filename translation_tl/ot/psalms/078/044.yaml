  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: tl
  text: 'Ginawa niyang dugo ang kanilang mga ilog[a],

    at hindi nila mainom ang kanilang umaagos na tubig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga daluyan ng Nilo.” Sa konteksto ng Ehipto, ang salitang Hebreo ay maaaring tumukoy sa Ilog Nilo o sa mga kanal nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Ginawa niyang
  rationale: Ipinahihiwatig ng pandiwang הפך ang pagbabago ng isang bagay tungo sa ibang kalagayan. Likas sa Filipino ang hulma na “ginawa niyang dugo” at malinaw nitong ipinakikita ang pagbabagong nangyari.
- source_word: לְדָם
  choice: dugo
  rationale: Ang לְ ay tumutukoy sa kinalabasang kalagayan; sa hulma ng pangungusap sa Filipino, sapat at natural ang “ginawa niyang dugo.”
- source_word: יְאֹרֵיהֶם
  choice: kanilang mga ilog
  rationale: Ang יְאֹר ay madalas tumukoy sa Nilo o sa mga kanal nito kapag Ehipto ang konteksto. Malinaw sa karaniwang mambabasa ang “mga ilog,” habang inilalahad sa talababa ang mas tiyak na posibilidad.
- source_word: וְנֹזְלֵיהֶם
  choice: kanilang umaagos na tubig
  rationale: Nagmula ito sa ugat na נזל, “umagos,” at tumutukoy sa mga tubig na umaagos. Pinananatili ng salin ang larawan ng pag-agos nang hindi inuulit lamang ang “mga ilog.”
- source_word: בַּל יִשְׁתָּיוּן
  choice: hindi nila mainom
  rationale: Ang ποιetikong negatibong בַּל kasama ng di-ganap na pandiwa ay nagpapahayag dito ng kawalan ng kakayahang uminom. Ang “hindi nila mainom” ay tuwiran at likas na Filipino.
theological_decisions: []
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang linyang ποιetiko at isinalin ang ikalawang sugnay ayon sa natural na pagbasa sa Hebreo: ang “umaagos na tubig” ang hindi nila mainom.'
