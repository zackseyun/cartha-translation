  terminology: Ang “mga ilog” ay sapat na pangunahing salin para sa יְאֹרֵיהֶם sa makatang buod ng mga salot sa Ehipto. Ang talababa hinggil sa Nilo at mga kanal nito ay tumpak at kapaki-pakinabang. Ang “umaagos na tubig” ay maayos na katumbas ng נֹזְלֵיהֶם at pinananatili ang larawan ng pagdaloy nang hindi labis na pinagtitibay ang isang partikular na uri ng daluyan.
