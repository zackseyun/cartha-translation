  source_fidelity: 'Tapat ang salin sa Hebreo: ang mga ilog ay ginawang dugo, at dahil dito ay hindi nila mainom ang kanilang umaagos na tubig. Ang “Ginawa niyang dugo” ay wastong naghahayag ng pagbabagong isinasaad ng וַיַּהֲפֹךְ לְדָם, at ang “hindi nila mainom” ay natural na pagpapahayag ng resultang nasa בַּל יִשְׁתָּיוּן.'
