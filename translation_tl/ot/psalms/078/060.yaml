  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: tl
  text: 'Kaya pinabayaan niya ang tabernakulo sa Shilo—

    ang toldang inilagay niya sa gitna ng mga tao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang toldang pinanahanan niya sa gitna ng mga tao.”'
    reason: Pinananatili ang posibleng pagbasa na ang parirala ay tumutukoy sa pananahan ng Diyos sa santuwaryo, sa halip na sa paglalagay niya ng tolda roon.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: pinabayaan
  rationale: Ipinahahayag nito ang matinding pag-iwan o pagpapabaya sa santuwaryo, nang hindi nagdaragdag ng ideya ng ganap na pagtatakwil.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Pinananatili nito ang makasaysayan at panrelihiyong kahulugan ng tirahan ng Diyos, at naihihiwalay ito sa kasunod na אֹהֶל, “tolda.”
- source_word: שִׁלֹה
  choice: Shilo
  rationale: Karaniwang makabagong Tagalog na transliterasyon ng pangalan ng lugar.
- source_word: אֹהֶל
  choice: tolda
  rationale: Natural na katumbas sa Tagalog at pinananatili ang patulang pagkakatulad ngunit hindi ganap na pag-uulit ng “tabernakulo.”
- source_word: שִׁכֵּן
  choice: inilagay
  rationale: Ang anyong Piel ay literal na maaaring mangahulugang “pinatira” o “inilagay.” Sa konteksto, ang “inilagay” ay malinaw na tumutukoy sa tolda at hindi tahimik na nagpapasiya na ang pandiwa ay nangangahulugang nanirahan ang Diyos.
- source_word: בָּאָדָם
  choice: sa gitna ng mga tao
  rationale: Ang אָדָם ay kolektibo at tumutukoy sa sangkatauhan; ang pariralang ito ay natural, malinaw, at hindi limitado sa kalalakihan.
theological_decisions:
- issue: Ang tinutukoy ng שִׁכֵּן
  choice: Ang tolda ang inilagay niya sa gitna ng mga tao.
  alternative: Ang tolda ang lugar kung saan siya nanirahan sa gitna ng mga tao.
  rationale: Ang Piel ng שׁכן ay karaniwang causative, kaya mas tuwirang sinasalamin ng “inilagay” ang anyo ng Hebreo. Gayunman, maaari ring maunawaan ang linya bilang paglalarawan sa presensiya ng Diyos na nananahan sa tolda; pinanatili ang pagbasa na iyon sa talababa.
- issue: Kolektibong kahulugan ng אָדָם
  choice: mga tao
  alternative: sangkatauhan
  rationale: Tumutukoy ang salita sa mga tao sa pangkalahatan. Mas natural sa kasalukuyang Tagalog ang “mga tao,” samantalang kapantay din sa diwa ang “sangkatauhan.”
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “tabernakulo” dahil pamilyar ito sa kontekstong biblikal, habang ang “tolda” ay nagpapanatili sa magkaibang salitang Hebreo at sa paralelismo ng tula.
