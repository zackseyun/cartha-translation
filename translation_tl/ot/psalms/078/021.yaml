  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: tl
  text: Kaya, narinig ni Yahweh at nagngitngit siya[a]; at[b] nagliyab ang apoy laban kay Jacob[c], at umakyat din ang poot laban sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nag-alab ang kanyang galit” o “napukaw siya sa galit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “at” ay maaari ring unawaing “sapagkat,” kung ang sumunod na apoy ay paliwanag kung paano nahayag ang galit ni Yahweh.
    reason: source_ambiguity
  - marker: c
    text: Literal na “sa Jacob” at, sa hulihan ng talata, “sa Israel”; isinalin ditong “laban” dahil sa konteksto ng galit at paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na ipinahahayag sa modernong Tagalog ang bunga o kinahinatnan ng naunang reklamo.
- source_word: שָׁמַע
  choice: narinig ito
  rationale: Pinananatili ang tuwirang diwa ng pandiwa; idinagdag ang “ito” bilang likas na layon sa Tagalog, na tumutukoy sa naunang sinabi ng Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתְעַבָּר
  choice: nag-alab ang kanyang galit
  rationale: Inilalarawan ang matinding pagkagalit nang hindi pinahihina ang lakas ng anyong Hebreo; natural din itong kaagapay ng larawang apoy sa kasunod na linya.
- source_word: אֵשׁ נִשְּׂקָה
  choice: may apoy na nagningas
  rationale: Pinananatili ang apoy at ang pasibong/resultatibong ideya ng pagkaliyab, nang hindi ipinapasiya kung literal o matalinghaga ang larawan.
- source_word: בְיַעֲקֹב
  choice: laban kay Jacob
  rationale: Bagaman literal na may pang-ukol na “sa,” hinihingi ng konteksto ng poot at paghatol ang idiomatikong “laban kay.”
- source_word: וְגַם אַף עָלָה
  choice: at umakyat din ang poot
  rationale: Pinananatili ang dagdag na diin ng וְגַם at ang patayong larawan ng עָלָה, kahit bahagyang makatang ang “umakyat ang poot.”
- source_word: בְיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Kaagapay ng “laban kay Jacob” at angkop sa diwa ng paghatol na nakatuon sa Israel.
theological_decisions:
- issue: Lakas ng paglalarawan sa galit ng Diyos
  choice: “nag-alab ang kanyang galit” at “umakyat din ang poot”
  alternative: Mas mahinang “hindi siya nasiyahan” o “sumama ang loob niya”
  rationale: Malakas ang wika ng Hebreo tungkol sa banal na poot; hindi ito dapat pahinain o alisin ang antropomorpikong larawan.
- issue: Kalikasan ng apoy
  choice: Panatilihin ang “may apoy na nagningas” nang walang paliwanag kung literal o matalinghaga
  alternative: Tukuying tahasan na literal na apoy o sagisag lamang ng paghatol
  rationale: Hindi nilulutas ng talata ang tanong; pinananatili ng salin ang tunay na kalabuan at bigat ng larawan.
- issue: Ugnayan ng sugnay tungkol sa apoy sa naunang pagkagalit
  choice: 'Pangunahing teksto: “at”'
  alternative: “sapagkat,” na inuunawang paliwanag kung paano nahayag ang galit
  rationale: Ang וְ ay pinakadirektang isang pang-ugnay at pinananatili nito ang paralelismo, ngunit posible rin ang paliwanag na gamit kaya itinalla sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan, habang pinananatili ang makatang paralelismo at mga larawan ng apoy, pag-alab, at pag-akyat ng poot. Ginamit ang “Yahweh” para sa יהוה.
