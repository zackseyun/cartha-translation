  naturalness: Marangal at maiintindihan ang rehistro. Mas likas at mas maigsi ang “Narinig ni Yahweh” kaysa “narinig ito ni Yahweh.” Ang “nagngitngit siya” ay tuwiran, matindi, at natural na katapat ng pandiwang Hebreo; pinananatili rin nito ang tahasang paksa ng unang sugnay.
  terminology: Ang “Yahweh,” “Jacob,” at “Israel” ay wasto at pare-pareho. Ang “poot” ay angkop para sa אַף. Ang “laban” para sa בְ sa kontekstong ito ay isang makatuwiran at idiomatikong pagpapalinaw, na dapat manatiling may talababa.
