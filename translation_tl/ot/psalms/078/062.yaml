  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: tl
  text: Ibinigay niya ang kanyang bayan sa tabak[a], at matindi ang galit niya sa kanyang mana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinaubaya niya ang kanyang bayan sa tabak.”
