    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Ibinigay niya
  rationale: Ang Hiphil ng סגר sa kontekstong ito ay nangangahulugang ibinigay o ipinaubaya sa kapangyarihan ng iba, hindi lamang ikinulong.
- source_word: לַחֶרֶב
  choice: sa tabak
  rationale: Pinananatili ang literal na larawan ng tabak, na dito ay metonimiya para sa marahas na kamatayan sa labanan.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Tuwirang katumbas ito ng ‘kanyang bayan’ at tumutukoy sa bayang kinikilala ng Diyos bilang kanya.
- source_word: וּבְנַחֲלָתוֹ
  choice: laban sa kanyang mana
  rationale: Ang נַחֲלָה ay ‘mana’ o ‘pamanang pag-aari,’ isang mahalagang katawagan sa Israel bilang bayang pag-aari ng Diyos. Sa idyoma ng pagkagalit, likas sa Filipino ang ‘laban sa.’
- source_word: הִתְעַבָּר
  choice: nagngalit siya
  rationale: Ang Hitpael na anyo sa idyomang ito ay nagpapahayag ng matinding galit. Ang ‘nagngalit’ ay marangal at malakas nang hindi nagpapahaba ng diwa.
theological_decisions:
- issue: Mga katawagang tipan para sa Israel
  choice: kanyang bayan ... kanyang mana
  alternative: kanyang sambayanan ... kanyang pamanang pag-aari
  rationale: Pinananatili ang dalawang magkaibang katawagan upang maipakita ang tensiyon na ang hinatulan ng Diyos ay ang bayang kinikilala pa ring kanya at kanyang mana.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang matalinghagang ‘tabak’ at ang teolohikal na katawagang ‘mana’; ginamit ang ‘nagngalit’ upang katawanin ang tindi ng pandiwang Hebreo.
