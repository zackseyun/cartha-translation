  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: tl
  text: Ang kanyang mga pari ay nabuwal sa tabak, at ang kanyang mga balo ay hindi tumangis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nakatangis.” Literal na “hindi tumangis” ang Hebreo; maaaring payak itong pagsasaad ng nangyari, o maaaring ipahiwatig na dahil sa tindi ng kapahamakan ay wala nang pagkakataon para sa nakaugaliang pagluluksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: kanyang mga pari
  rationale: Ang כֹּהֵן ay karaniwang tumutukoy sa pari, lalo na sa konteksto ng paglilingkod sa Israel; pinananatili rin ng “kanyang” ang pang-isahang hulaping panag‑ari sa Hebreo.
- source_word: בַּחֶרֶב
  choice: sa tabak
  rationale: Ang בְּ dito ay nagpapahayag ng kasangkapang ginamit sa marahas na kamatayan. Ang “sa tabak” ay likas na idyomang Filipino at tumutugma sa larawang Hebreo.
- source_word: נָפָלוּ
  choice: nabuwal
  rationale: Pinananatili ng “nabuwal” ang larawan ng נפל, “bumagsak,” habang malinaw sa pariralang “sa tabak” na tumutukoy ito sa pagkamatay sa karahasan.
- source_word: וְאַלְמְנֹתָיו
  choice: at ang kanyang mga balo
  rationale: Pang-isahang panlalaki ang hulaping panag‑ari sa Hebreo. Hindi ito ginawang “kanilang” upang hindi matakpan ang anyong pang-isahan ng pinagmulan, kahit maaaring isipin ng mambabasa na mga balo ito ng mga paring nabanggit.
- source_word: לֹא תִבְכֶּינָה
  choice: hindi tumangis
  rationale: Ito ang tuwirang kahulugan ng negatibong pandiwa. Hindi isiningit sa pangunahing teksto ang pagpapakahulugang wala silang pagkakataon o kakayahang magluksa; inilalahad iyon bilang posibleng diwa sa talababa.
theological_decisions:
- issue: Kahulugan ng hindi pagtangis ng mga balo sa gitna ng hatol
  choice: Pinanatili sa pangunahing teksto ang payak na pahayag na “hindi tumangis.”
  alternative: “Hindi nakatangis,” na nagpapahiwatig na dahil sa tindi ng kapahamakan ay wala silang pagkakataon o kakayahang magsagawa ng pagluluksa.
  rationale: Hindi tahasang ipinapahayag ng Hebreo ang kawalan ng kakayahan. Maaaring payak na salaysay ito o matinding paglalarawan ng pagkawasak na pumigil sa nakaugaliang pagluluksa, kaya hindi dapat tahimik na paglutasin ang tensiyong iyon.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “nabuwal sa tabak” upang mapanatili ang patulang larawan nang hindi nagiging malabo, at inilagay ang talababa pagkatapos ng sugnay na tinutukoy nito.
