lexical_decisions:
- source_word: אֲשֶׁר
  choice: nang
  rationale: Sa konteksto ng pag-alaala sa mga ginawa ng Diyos, likas na ipinakikilala ng pang-ugnay ang panahong naganap ang mga sumusunod na gawa.
- source_word: שָׂם
  choice: ilagay
  rationale: Pinananatili nito ang karaniwang diwang ‘maglagay’ o ‘magtakda’ nang hindi dinaragdagan ng interpretasyong ‘gumawa’ o ‘magpakita.’
- source_word: בְּמִצְרַיִם
  choice: sa Ehipto
  rationale: Ang pang-ukol ay nagsasaad dito ng lokasyon, hindi tahasang pagsalungat laban sa Ehipto.
- source_word: אֹתוֹתָיו
  choice: ang kanyang mga tanda
  rationale: Pinananatili ng ‘mga tanda’ ang leksikal na pagkakaiba nito sa kasunod na ‘mga kababalaghan.’
- source_word: וּמוֹפְתָיו
  choice: at ang kanyang mga kababalaghan
  rationale: Natural at malinaw itong katumbas ng mga pambihirang gawang pumupukaw ng paghanga, habang naiiba pa rin sa ‘mga tanda.’
- source_word: בִּשְׂדֵה
  choice: sa mga bukirin ng
  rationale: Bagaman anyong isahan ang Hebreo, tumutukoy ang parirala sa kapatagan o lupaing nakapaligid sa isang lugar; natural sa Filipino ang maramihang ‘mga bukirin.’
- source_word: צֹעַן
  choice: Zoan
  rationale: Isinalin sa baybay ang pangalang Hebreo sa halip na palitan ng kinikilalang katumbas nitong Tanis.
