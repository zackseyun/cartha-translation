  text: וַ/יְגָ֤רֶשׁ מִ/פְּנֵי/הֶ֨ם גּוֹיִ֗ם וַֽ֭/יַּפִּילֵ/ם בְּ/חֶ֣בֶל נַחֲלָ֑ה וַ/יַּשְׁכֵּ֥ן בְּ֝/אָהֳלֵי/הֶ֗ם שִׁבְטֵ֥י יִשְׂרָאֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: tl
  text: Pinalayas niya ang mga bansa sa harap nila at itinalaga niya para sa kanila ang mana sa pamamagitan ng panukat na lubid[a]; pinatira niya ang mga lipi ng Israel sa kanilang mga tolda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinalaga niya sa kanila ang mana sa pamamagitan ng lubid.” Pinagsasama ng idyomang Hebreo ang mga diwa ng pagtatakda at pagsukat sa paghahati ng lupa.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kanilang mga tolda”; maaari ring “sa kanilang mga tirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: Pinalayas niya
  rationale: Tuwirang ipinapahayag ang malakas na diwa ng גרש na pagtataboy o pagpapaalis, at pinananatili ang Diyos bilang gumagawa.
- source_word: מִפְּנֵיהֶם
  choice: sa harap nila
  rationale: Malapit sa literal na 'mula sa harap nila' at likas sa Filipino bilang paglalarawan sa pag-aalis ng mga bansang nakaharap sa Israel.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Ang גּוֹיִם dito ay tumutukoy sa mga bayang naninirahan sa Canaan; hindi ginamit ang 'mga Hentil' upang maiwasan ang di-kinakailangang panrelihiyong kulay.
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: hinati-hati sa kanila ang lupain bilang mana sa pamamagitan ng panukat na lubid
  rationale: Inilalahad ang idyoma ng pagpapatakda ng minanang lupain sa pamamagitan ng חבל, isang lubid o pising panukat; ang 'hinati-hati' ay nagpapanatili sa distributibong diwa ng konteksto.
- source_word: וַיַּשְׁכֵּן
  choice: pinanirahan niya
  rationale: 'Ipinapakita ang causative na anyo ng שכן: ang Diyos ang naglagay o nagpatira sa mga lipi roon.'
- source_word: בְּאָהֳלֵיהֶם
  choice: sa mga tolda ng mga bansang iyon
  rationale: Pinananatili ang kongkretong larawan ng אהל, 'tolda,' at nililinaw na ang panghalip na 'kanila' ay bumabalik sa mga bansang pinalayas, hindi sa Israel.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ang mga lipi ng Israel
  rationale: '''Mga lipi'' ang natural at karaniwang katumbas ng שִׁבְטֵי sa konteksto ng labindalawang pangkat ng Israel.'
theological_decisions:
- issue: Ang gumagawa sa pananakop at paninirahan
  choice: Pinanatiling Diyos ang simuno ng pagpapaalis, paghahati ng lupain, at pagpapanirahan.
  alternative: Gawing di-tiyak o passive ang gumagawa.
  rationale: Sa daloy ng salmo, ang lahat ng pandiwang pang-isahan ay tumutukoy sa Diyos at nagsasalaysay ng kanyang mga ginawa para sa Israel.
- issue: Tinutukoy ng panghalip sa בְּאָהֳלֵיהֶם
  choice: Ang mga tolda ay yaong sa mga bansang pinalayas.
  alternative: Unawaing 'kanilang mga tolda' bilang mga tolda ng Israel.
  rationale: Ang pinakamalapit na malinaw na antecedent ng hulaping panghalip ay גּוֹיִם, at ang larawan ay ang paglalagay sa Israel sa mga tirahan ng dating mga naninirahan. Dahil maaaring mapagkamalan sa Filipino ang payak na 'kanilang,' nilinaw ito sa teksto at itinabi sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago at marangal na Filipino para sa karaniwang mambabasa. Ginamit ang 'lupain bilang mana' upang maging malinaw ang minanang teritoryo, at 'panukat na lubid' upang mapanatili ang konkretong larawan ng tekstong Hebreo.
