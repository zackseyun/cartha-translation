  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: tl
  text: Kaya't kumain sila at lubos na nabusog, at dinala niya sa kanila ang kanilang kinasasabikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang pagnanasa” o “ang kanilang matinding paghahangad.” Ang pangngalang Hebreo ay maaaring tumukoy sa pagnanasa mismo o sa bagay na ninanasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: kumain sila
  rationale: Ang Qal wayyiqtol ng אכל ay karaniwang pandiwa para sa pagkain; natural at tuwiran sa modernong Tagalog ang “kumain sila.”
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: lubos na nabusog
  rationale: Ang שׂבע ay tumutukoy sa pagkabusog o ganap na pagkasapat, at pinatitindi ito ng מְאֹד. Pinananatili ng “lubos na nabusog” ang kongkretong larawan ng saganang pagkain.
- source_word: תַאֲוָתָם
  choice: ang kanilang kinasasabikan
  rationale: Ang תַּאֲוָה ay maaaring tumukoy sa pagnanasa mismo o sa bagay na ninanasa. Sa konteksto ng pagkaing ipinagkaloob sa ilang, natural na ipinahihiwatig ng “kanilang kinasasabikan” ang bagay na matindi nilang ninanais nang hindi labis na minamoralisa ang salita.
- source_word: יָבִא לָהֶם
  choice: ibinigay niya sa kanila
  rationale: Ang Hiphil ng בוא ay may diwang “dalhin” o “papuntahin.” Sa natural na Tagalog at sa konteksto ng paglalaan ng Diyos, malinaw na naihahatid ng “ibinigay niya sa kanila” ang causative na pagkakaloob, bagaman mas literal ang “dinala niya sa kanila.”
theological_decisions:
- issue: Di-hayag na simuno ng יָבִא
  choice: Ginamit ang “niya,” na tumutukoy sa Diyos ayon sa daloy ng salaysay.
  alternative: Isang impersonal na salin gaya ng “dumating sa kanila ang kanilang kinasasabikan.”
  rationale: Sa salaysay ng awit, ang Diyos ang kumikilos at naglalaan ng pagkain. Sinusuportahan ng Hiphil na anyo ng בוא ang causative na diwang pagdadala o pagkakaloob, sa halip na simpleng pagdating.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “lubos na nabusog” upang mapanatili ang konkretong larawan, at “kinasas sabikan” sa diwang bagay na matinding ninanais. Ang marker na [a] ay inilagay mismo sa pangunahing teksto.
