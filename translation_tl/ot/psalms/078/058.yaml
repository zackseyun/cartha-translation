  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: tl
  text: Ginalit nila siya sa kanilang mga pook sambahan sa matataas na lugar,[a] at pinukaw nila ang kanyang paninibugho sa kanilang mga inukit na larawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pook sambahan sa matataas na lugar” ay mga lokal na pook ng pagsamba na madalas iugnay sa ipinagbabawal na pagsamba at pagsamba sa mga diyus-diyosan.
    reason: cultural_note
  - marker: b
    text: O “mga inukit na diyus-diyosan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Ginalit nila siya
  rationale: Ang Hiphil ng כעס ay causative, kaya malinaw na ipinapahayag ng salin na sila ang naging dahilan ng kanyang galit.
- source_word: בְּבָמוֹתָם
  choice: sa pamamagitan ng kanilang mga sambahan sa matataas na lugar
  rationale: Ang בָּמוֹת ay mga lokal na pook ng pagsamba na karaniwang nasa mataas na lugar at, sa kontekstong ito, kaugnay ng pagsambang labag sa Diyos. Mas malinaw ito sa makabagong mambabasa kaysa sa literal ngunit malabong “matataas na dako.”
- source_word: וּבִפְסִילֵיהֶם
  choice: sa pamamagitan ng kanilang mga inukit na larawan
  rationale: Ang פְּסִילִים ay mga larawang inukit bilang mga bagay na sinasamba. Pinananatili ng “mga inukit na larawan” ang kongkretong diwa ng ginawang rebulto o imahen nang hindi nawawala ang anyo ng orihinal.
- source_word: יַקְנִיאוּהוּ
  choice: pinukaw nila ang kanyang paninibugho
  rationale: Ang Hiphil ng קנא ay nangangahulugang magdulot o pumukaw ng paninibugho. Ang pariralang ito ay likas at marangal sa Filipino at pinananatili ang natatanging diwa ng salitang Hebreo sa halip na tunawin ito sa pangkalahatang galit.
theological_decisions:
- issue: Paninibugho ng Diyos
  choice: pinukaw nila ang kanyang paninibugho
  alternative: lalo nila siyang ginalit
  rationale: Tahasang gumagamit ang Hebreo ng קנא, na sa konteksto ng pagsamba sa mga diyus-diyosan ay nagpapahayag ng paninibughong kaugnay ng tanging katapatan na hinihingi ng Diyos. Pinananatili ng salin ang biblikal na tensiyon sa halip na palitan ito ng mas pangkalahatang damdamin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang lipas at hindi madaling maunawaang “matataas na dako,” ngunit pinanatili ang konsepto ng kultikong matataas na lugar. Ginamit ang “paninibugho” sa halip na mas kolokyal na “selos” upang maging angkop sa banal at tipanang konteksto.
