  yaml_path: translation/ot/psalms/078/072.yaml
  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: tl
  text: Kaya pinastol niya sila nang may pusong tapat[a], at pinatnubayan sila sa pamamagitan ng husay ng kanyang mga kamay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa katapatan ng kanyang puso.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “sa pamamagitan ng pag-unawa ng kanyang mga kamay,” samakatuwid, ng praktikal na kaunawaan at husay sa kanyang pamumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: pinastol niya sila
  rationale: Mula sa רעה, na tumutukoy sa pagpapastol o pag-aalaga bilang pastol. Pinananatili ng “pinastol” ang mahalagang larawan ni David bilang pastol-hari sa konteksto.
- source_word: כְּתֹם לְבָבוֹ
  choice: nang may pusong tapat
  rationale: Ang תֹם ay integridad, kabuuan, o kawalang-kapintasan. Ang “pusong tapat” ay natural at marangal sa modernong Tagalog at naghahayag ng etikal na katapatan ng kalooban.
- source_word: לְבָבוֹ
  choice: puso
  rationale: Ang לֵבָב ay tumutukoy sa panloob na pagkatao, kasama ang kalooban at pag-unawa. Ang “puso” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: וּבִתְבוּנוֹת
  choice: sa pamamagitan ng husay
  rationale: Ang תְּבוּנָה ay pag-unawa, pagk discern, o praktikal na karunungan. Kasama ng “mga kamay,” ipinahihiwatig nito ang mahusay at may-kakayahang pamumuno.
- source_word: כַּפָּיו
  choice: ng kanyang mga kamay
  rationale: Literal na tumutukoy sa kanyang mga palad o kamay. Pinananatili nito ang kongkretong larawan ng praktikal na kakayahan.
- source_word: יַנְחֵם
  choice: pinatnubayan sila
  rationale: Ang Hiphil ng נחה ay “umakay” o “pumatnubay.” Ang “pinatnubayan” ay angkop sa larawan ng pastol at nagpapahiwatig ng mahusay na paggabay.
theological_decisions:
- issue: Larawan ni David bilang maharlikang pastol
  choice: Panatilihin ang tahasang wikang pagpapastol sa pangunahing teksto.
  alternative: Gumamit ng mas pangkalahatang pananalita gaya ng “inalagaan niya sila” o “pinamunuan niya sila.”
  rationale: Inilalarawan ng hulihan ng salmo si David bilang piniling pastol-hari ng PANGINOON. Pinananatili ng “pinastol” ang teolohikal na larawan ng pamumuno bilang mapagkalingang pagpapastol nang hindi nagdaragdag ng mesiyanikong pakahulugang hindi tahasang nasa talata.
- issue: Gamit ng כְּ sa כְּתֹם
  choice: Isalin bilang paraang “nang may pusong tapat.”
  alternative: Isalin bilang “ayon sa katapatan ng kanyang puso.”
  rationale: Maaaring ipahayag ng pang-ukol ang paraan o pamantayan. Pinili ang natural na paraang Tagalog sa teksto, habang inilalagay sa talababa ang tunay na alternatibo.
- issue: Kahulugan ng תְּבוּנוֹת na kaugnay ng mga kamay
  choice: Isalin bilang praktikal na “husay.”
  alternative: Isalin nang mas literal bilang “pag-unawa” o “pagkamaunawain ng kanyang mga kamay.”
  rationale: Ang pagkakaugnay nito sa “mga kamay” ay nagpapahiwatig ng praktikal at mahusay na pamamahala. Gayunman, pinananatili sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metaporang pastol at mga kamay; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
