  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: tl
  text: Biniyak niya ang mga bato sa ilang at pinainom niya sila nang sagana, na tila mula sa malalawak na kailaliman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at pinainom niya sila mula sa malawak na kalaliman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּע
  choice: biniyak
  rationale: Ang Piel ng בקע ay nagpapahayag ng marahas o mariing pagbiyak/pagbukas. Likas at malinaw sa modernong Tagalog ang “biniyak.”
- source_word: צֻרִים
  choice: mga bato
  rationale: Pinananatili ang pangmaramihang anyo at ang karaniwang kahulugan ng malalaki o mabatong masa nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, marangal, at angkop sa ilang o disyertong pinaglakbayang lugar ng Israel, nang hindi labis na tinutukoy ang uri ng lupain.
- source_word: וַיַּשְׁקְ
  choice: pinainom sila
  rationale: Ang Hiphil ng שׁקה ay “magpainom” o “magbigay ng maiinom.” Likas na ipinahihiwatig ng konteksto na ang Israel ang tumatanggap, kaya ginamit ang “sila.”
- source_word: כִּתְהֹמוֹת
  choice: na para bang mula sa malalalim na kailaliman
  rationale: Pinananatili ng “para bang” ang paghahambing na minamarkahan ng כ, habang ipinahihiwatig ng “malalalim na kailaliman” ang malawak at napakalalim na tubig ng תְּהֹמוֹת.
- source_word: רַבָּה
  choice: nang sagana
  rationale: Ginamit bilang pang-abay upang ihayag ang kasaganaan ng ipinainom, isang makatuwirang pagbasa sa anyong ito sa pangungusap. Hindi nito inaalis ang alternatibong pag-uugnay ng salita sa “kalaliman,” na inilalahad sa talababa.
theological_decisions:
- issue: Kalikasan ng larawan ng tubig
  choice: Pinanatili ang paghahambing—“na para bang mula sa malalalim na kailaliman”—sa halip na sabihing literal na nagmula ang tubig sa mga imbakan sa ilalim ng lupa.
  alternative: at pinainom sila mula sa makapangyarihang kalaliman
  rationale: Ang כ ay natural na nagpapahiwatig ng paghahambing. Pinananatili ng salin ang makatang larawan at hindi ito ginagawang tiyak na pahayag tungkol sa sinaunang kosmolohiya.
- issue: Pagkakaugnay ng רַבָּה
  choice: Iniugnay sa dami ng ipinainom sa pamamagitan ng “nang sagana.”
  alternative: Iugnay sa תְהֹמוֹת at isalin bilang “makapangyarihang kalaliman” o “malawak na kalaliman.”
  rationale: May tensiyong panggramatika at pangtula sa parirala. Ang pangunahing teksto ay malinaw at natural sa Tagalog, habang pinananatili sa talababa ang ibang posibleng pagkakaugnay.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at makatang himig. Ginamit ang “ilang” at “kailaliman” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
