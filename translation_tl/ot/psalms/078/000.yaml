  yaml_path: translation/ot/psalms/078/000.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: tl
  text: 'Isang Maskil[a] ni Asaf.


    Pakinggan mo, bayan ko, ang aking turo;

    ikiling ninyo ang inyong mga tainga sa mga salita ng aking bibig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Maskil” ay isang teknikal na termino sa mga pamagat ng mga awit; maaaring tumukoy ito sa isang awit na nagtuturo o para sa malalim na pagninilay.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Pinanatili ang teknikal na terminong Hebreo sa pamagat dahil hindi tiyak ang eksaktong kahulugan nito; ipinaliwanag ang posibleng diwa sa talababa.
- source_word: תּוֹרָתִי
  choice: aking turo
  rationale: Sa kontekstong ito, tumutukoy ang torah sa itinuturo o tagubilin ng mang-aawit, hindi kinakailangang sa Kautusan bilang isang tiyak na kalipunan.
- source_word: הַאֲזִינָה
  choice: Dinggin mo
  rationale: Inihahayag ang masidhing panawagang makinig at pinananatili ang anyong pang-isahan na tumutukoy sa bayan bilang isang kabuuan.
- source_word: הַטּוּ אָזְנְכֶם
  choice: ikiling ninyo ang inyong mga tainga
  rationale: Pinanatili ang larawang Hebreo at ang paglipat sa pangmaramihang pautos.
theological_decisions:
- issue: Kaugnayan ni Asaf sa awit sa pariralang לְאָסָף
  choice: ni Asaf
  alternative: para kay Asaf / ukol kay Asaf
  rationale: Ang לְ sa mga pamagat ng awit ay maaaring magpahiwatig ng pagkakaugnay, pag-aari, pag-akda, o pag-aalay. Ang karaniwang natural na saling “ni Asaf” ay hindi nagdaragdag ng mas tiyak na pahayag kaysa sa kinakailangan ng pamagat.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Dinggin” upang mapanatili ang taimtim na himig, at sadyang pinanatili ang paglipat mula sa pang-isahang “mo” tungo sa pangmaramihang “ninyo” sa tekstong Hebreo.
