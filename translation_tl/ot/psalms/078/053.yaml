  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: tl
  text: Inakay niya sila nang ligtas, at hindi sila natakot; at tinakpan ng dagat[a] ang kanilang mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang dagat.” Ipinahihiwatig ng talata ang pagtawid ng Israel noong Exodo. Maaari itong ipaliwanag bilang “Pulang Dagat” o “Dagat ng mga Tambo,” ngunit hindi mas tiyak ang katawagan sa tekstong Hebreo rito.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Inakay niya sila
  rationale: Ang Hiphil ng נחה na may hulaping 3mp ay nangangahulugang pinatnubayan o inakay niya sila. Natural sa makabagong Tagalog ang “inakay” at pinananatili nito ang larawan ng aktuwal na paglalakbay.
- source_word: לָבֶטַח
  choice: nang ligtas
  rationale: Ang בֶּטַח ay tumutukoy sa kaligtasan o katiwasayan; adberbiyal ang gamit ng לָ dito. Ang “nang ligtas” ay malinaw at natural na paglalarawan sa paraan ng pag-akay.
- source_word: וְלֹא פָחָדוּ
  choice: at hindi sila natakot
  rationale: Tuwirang pinananatili ang payak na koordinasyong וְ at ang kahulugan ng פחד, nang hindi ipinipilit na tahasang sanhi o bunga ang ugnayan ng mga sugnay.
- source_word: אֹיְבֵיהֶם
  choice: kanilang mga kaaway
  rationale: Karaniwan at malinaw na katumbas ng אֹיֵב sa modernong Tagalog.
- source_word: כִּסָּה
  choice: tinakpan
  rationale: Literal na kahulugan ng כסה ang “takpan.” Pinananatili nito ang kongkretong larawan sa salaysay sa halip na palawakin bilang “nilunod” o “nilamon.”
- source_word: הַיָּם
  choice: ang dagat
  rationale: 'Tiyak ngunit pangkalahatang pangngalan ang nasa Hebreo: “ang dagat.” Hindi tinutukoy rito sa pangalan kung Pulang Dagat o Dagat ng mga Tambo.'
theological_decisions:
- issue: Pahiwatig sa pagtawid sa dagat noong Exodo
  choice: Panatilihin sa pangunahing teksto ang pangkalahatang katawagang “ang dagat.”
  alternative: “ang Pulang Dagat” o “ang Dagat ng mga Tambo”
  rationale: Malinaw ang pahiwatig sa pangyayari sa Exodo, ngunit הַיָּם lamang ang nakasulat. Hindi dapat magdagdag sa pangunahing teksto ng mas tiyak na pagkakakilanlang wala sa talata.
- issue: Ugnayan ng ligtas na pag-akay at hindi pagkatakot
  choice: Gamitin ang “at,” ayon sa payak na Hebreong pang-ugnay.
  alternative: “kaya hindi sila natakot” o “upang hindi sila matakot”
  rationale: Maaaring maunawaan ang ikalawang sugnay bilang bunga ng una, ngunit hindi ito tahasang minarkahan sa Hebreo. Pinananatili ng “at” ang tunay na kaluwagan ng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “Inakay” sa halip na mas pormal na “pinatnubayan,” at pinanatili ang magkakasunod na “at” upang maipakita ang payak na koordinasyon ng Hebreo.
