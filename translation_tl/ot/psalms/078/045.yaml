translation:
  language: tl
  text: Nagpadala siya sa gitna nila ng kuyog ng mga langaw[a], na lumamon sa kanila, at ng mga palaka, na pumuksa sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuyog ng mga kulisap”; ang Hebreong עָרֹב ay maaaring tumukoy sa kuyog ng mga kulisap sa pangkalahatan, na tradisyonal na inuunawang mga langaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Nagpadala siya
  rationale: Ang Piel ng שׁלח ay nagpapahayag ng pagpapakawala o pagpapadala ng salot; natural at sapat ang lakas ng “nagpadala” sa modernong Tagalog.
- source_word: בָּהֶם
  choice: sa gitna nila
  rationale: Pinananatili nito ang lokatibong diwa ng בְּ at malinaw na inilalarawan ang pagpasok ng salot sa kanilang kinaroroonan.
- source_word: עָרֹב
  choice: mga kawan ng langaw
  rationale: Ang עָרֹב ay maaaring tumukoy nang mas malawak sa kuyog ng mga kulisap, ngunit ayon sa tradisyon ay mga langaw; malinaw sa karaniwang mambabasa ang pangunahing salin habang itinatala sa talababa ang tunay na leksikal na kalabuan.
- source_word: וַיֹּאכְלֵם
  choice: na lumamon sa kanila
  rationale: Matingkad na inilalarawan ng “lumamon” ang mapaminsalang diwa ng אכל. Ang sugnay na may “na” ay natural sa Tagalog at malinaw na tumutukoy sa kolektibong salot.
- source_word: וּצְפַרְדֵּעַ
  choice: at ng mga palaka
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito; natural sa Tagalog ang maramihang “mga palaka.” Inuugnay ng “ng” ang ikalawang bagay sa pandiwang “nagpadala.”
- source_word: וַתַּשְׁחִיתֵם
  choice: na pumuksa sa kanila
  rationale: Ang “pumuksa” ay nagpapanatili sa malakas na diwa ng mapanirang שׁחת at angkop sa paglalarawan ng salot.
