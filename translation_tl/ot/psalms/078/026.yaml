  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: tl
  text: Pinakilos niya sa kalangitan ang hanging silangan[a], at sa pamamagitan ng kanyang lakas ay pinatnubayan niya ang hanging timog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinaalis niya sa kalangitan ang hanging silangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: pinakilos
  rationale: Ang Hiphil ng נסע ay literal na ‘pinayaong umalis’ o ‘pinaglakbay.’ Kapag hangin ang layon, natural na ipinahihiwatig nito na pinakilos o pinasimulang umihip ng Diyos ang hangin. Pinananatili ng ‘pinakilos’ ang tahasang banal na pagkilos nang hindi labis na nagpapakahulugan.
- source_word: קָדִים
  choice: hanging silangan
  rationale: Karaniwang tumutukoy ang קָדִים sa hanging nagmumula sa silangan, hindi lamang sa direksiyong silangan. Ang pararelismo nito sa תֵימָן ay sumusuporta sa tahasang pagbanggit ng hangin.
- source_word: בַּשָּׁמַיִם
  choice: sa kalangitan
  rationale: Ang שָׁמַיִם ay tumutukoy rito sa himpapawid o langit na kinaroroonan ng hangin. Ang ‘kalangitan’ ay likas, marangal, at makatang salin na hindi nagpapahiwatig na ang tinutukoy ay ang tirahan ng Diyos lamang.
- source_word: וַיְנַהֵג
  choice: pinatnubayan
  rationale: Ang נהג ay maaaring mangahulugang ‘pangunahan,’ ‘patnubayan,’ o ‘itaboy.’ Ang ‘pinatnubayan’ ay nagpapahayag ng sinadyang pag-akay o pagdirekta ng Diyos sa hangin at umaangkop sa makatang rehistro.
- source_word: בְּעֻזּוֹ
  choice: sa pamamagitan ng kanyang lakas
  rationale: Ang עֹז ay ‘lakas,’ ‘kapangyarihan,’ o ‘tibay.’ Ang pariralang ito ay malinaw na nagpapahayag ng paraan o kapangyarihang ginamit niya.
- source_word: תֵימָן
  choice: hanging timog
  rationale: Literal itong ‘timog’ o ‘dakong timog,’ ngunit dahil kapantay ito ng ‘hanging silangan’ at hangin ang ipinagpapatuloy na layon ng pandiwa, makatuwirang gawing hayag ang ‘hangin’ sa Tagalog.
theological_decisions:
- issue: Pagkilos ng Diyos sa mga puwersa ng kalikasan
  choice: Ipinakikita ng salin na ang Diyos mismo ang nagpapakilos at pumapatnubay sa mga hangin.
  alternative: Isang di-tahasang salin na nagsasabing basta bumangon o umihip ang mga hangin.
  rationale: Ang Diyos ang paksa ng dalawang pandiwang Hebreo. Pinananatili ng salin ang kanyang aktibong pagkilos at pamamahala nang walang idinaragdag na doktrinang lampas sa teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at makata ngunit madaling maunawaan. Ginamit ang ‘kalangitan’ para sa שָׁמַיִם at ang magkapares na ‘hanging silangan/hanging timog’ upang mapanatili ang pararelismo. Ang panghalip na ‘kanyang’ ay hindi nilagyan ng malaking titik, alinsunod sa karaniwang modernong gamit at upang hindi magdagdag ng estilong wala sa Hebreo.
