  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: tl
  text: Sapagkat nagtatag siya ng isang patotoo sa Jacob at nagtakda ng kautusan sa Israel,[a] na iniutos niya sa ating mga ama[b] na ipaalam sa kanilang mga anak ang mga ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “turo” sa halip na “kautusan” (Hebreo: torah).'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ating mga ama”; pinanatili ang tahasang panlalaking katawagan ng pinagmulang teksto.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “kanilang mga anak na lalaki”; dito ay malamang na tumutukoy ito sa kanilang mga anak sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: nagtatag
  rationale: Ang Hiphil ng קום ay may diwang 'magpatayo' o 'magtatag.' Ang “nagtatag” ay natural sa Filipino at angkop sa kontekstong tipanan at institusyonal.
- source_word: עֵדוּת
  choice: isang patotoo
  rationale: Pinananatili ng “patotoo” ang pangunahing diwa ng saksi o patunay at hindi ito nililimitahan sa kahulugang legal na atas lamang.
- source_word: בְּיַעֲקֹב
  choice: sa Jacob
  rationale: Pinananatili ang anyong patula kung saan ang Jacob ay tumutukoy sa bayang nakipagtipan sa Diyos, kahanay ng Israel.
- source_word: וְתוֹרָה
  choice: at naglagay ng kautusan
  rationale: Ang תּוֹרָה ay maaaring mangahulugang kautusan o turo. Sa pagkakahanay nito sa עֵדוּת at sa utos na ipasa ito sa susunod na salinlahi, malinaw ang normatibong diwa; gayunman, inilalahad sa talababa ang leksikal na alternatibo.
- source_word: שָׂם
  choice: naglagay
  rationale: Karaniwang kahulugan ng שׂים ang maglagay o magtakda. Ang “naglagay” ay payak at tapat sa Hebreo.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tumutugma ito sa “sa Jacob” at pinananatili ang paralelismong patula.
- source_word: אֲשֶׁר צִוָּה
  choice: na iniutos niya
  rationale: Tuwirang ipinapahayag ang utos ng Diyos nang hindi nagdaragdag ng interpretasyon.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: sa ating mga ama
  rationale: Ang Hebreo ay tahasang panlalaking pangmaramihan. Pinananatili ang “mga ama,” na sa konteksto ay tumutukoy sa mga ama ng naunang salinlahi.
- source_word: לְהוֹדִיעָם
  choice: na ipaalam
  rationale: Ang Hiphil ng ידע ay 'ipabatid' o 'ipaalam.' Natural ang “ipaalam” at hindi nito pinakikitid ang paraan ng pagpapabatid sa pormal na pagtuturo lamang.
- source_word: לִבְנֵיהֶם
  choice: sa kanilang mga anak
  rationale: Bagaman literal na 'mga anak na lalaki,' madalas gamitin ang בנים para sa mga anak o inapo sa pangkalahatan. Ang intergenerasyonal na konteksto ay sumusuporta sa “mga anak.”
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa kontekstong tipanan
  choice: kautusan
  alternative: turo
  rationale: Pinananatili ng “kautusan” ang normatibong lakas ng salita sa talata, samantalang kinikilala sa talababa na maaari rin itong isaling “turo.”
- issue: Kasarian sa אֲבוֹתֵינוּ at לִבְנֵיהֶם
  choice: ating mga ama … kanilang mga anak
  alternative: ating mga ninuno … kanilang mga anak na lalaki
  rationale: Tahasan ang panlalaking anyo ng “mga ama,” kaya pinanatili ito. Ang “mga anak” naman ay angkop sa pangkalahatang intergenerasyonal na gamit ng בנים, nang hindi ipinapalagay na lalaki lamang ang tinutukoy.
- issue: Referent ng panghalip sa לְהוֹדִיעָם
  choice: ang patotoo at kautusan na ipaalam
  alternative: isang pangkalahatang utos na magturo
  rationale: Ang panlalaking pangmaramihang hulapi ay pinakamalamang na tumutukoy sa dalawang naunang bagay—ang patotoo at kautusan. Sa Filipino, likas na naiiwan ang layon bilang nauunawaan mula sa konteksto, kaya hindi sapilitang nilulutas sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paralelismong “sa Jacob … sa Israel,” ang tradisyonal ngunit malinaw na “patotoo” at “kautusan,” at ang tahasang “mga ama.” Ang pagkakasunod ng mga talababa ay inayos ayon sa paglitaw ng mga marker sa tekstong Tagalog.
