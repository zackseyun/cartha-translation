  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: tl
  text: Ginabayan niya sila sa pamamagitan ng ulap sa araw[a], at buong magdamag sa pamamagitan ng liwanag ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinangunahan niya sila sa pamamagitan ng ulap sa araw, at buong magdamag sa pamamagitan ng liwanag ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ginabayan niya sila
  rationale: Ang Hiphil ng נחה na may hulaping 3mp ay nangangahulugang manguna o gumabay. Ang “ginabayan” ay natural sa modernong Tagalog at malinaw na naghahayag ng aktuwal na paggabay sa ilang.
- source_word: בֶּעָנָן
  choice: sa pamamagitan ng ulap
  rationale: 'Instrumental ang gamit ng ב sa konteksto: ang ulap ang paraang ginamit sa paggabay. Nililinaw ito ng “sa pamamagitan ng” nang hindi dinaragdagan ang larawan ng Hebreo.'
- source_word: יוֹמָם
  choice: sa araw
  rationale: Adberbiyal itong tumutukoy sa panahon ng araw. Ang “sa araw” ay maikli, natural, at mahusay na katambal ng “buong magdamag.”
- source_word: וְכָל הַלַּיְלָה
  choice: at buong magdamag
  rationale: Pinananatili ng “buong magdamag” ang diin ng כָל sa kabuuan ng gabi habang natural ang daloy sa Tagalog.
- source_word: בְּאוֹר אֵשׁ
  choice: sa pamamagitan ng liwanag ng apoy
  rationale: Pinananatili nito ang dalawang pangngalan—liwanag at apoy—at ipinapakitang ang liwanag ng apoy ang paraan ng paggabay sa gabi.
theological_decisions:
- issue: Larawan ng paggabay sa ilang
  choice: Isinalin bilang makasaysayang paggabay sa Israel sa pamamagitan ng ulap at liwanag ng apoy, nang walang idinagdag na pagpapakahulugang tipolohikal.
  alternative: Tahasan itong ipakahulugan sa pangunahing teksto bilang sagisag ng ibang doktrina o pangyayari.
  rationale: Ang talata mismo ay nagsasalaysay ng paggabay sa panahon ng Exodo. Hindi dapat idagdag sa salin ang teolohikal na interpretasyong hindi tahasang sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ginabayan” bilang pangkaraniwang katumbas ng נחה; ang “pinangunahan” ay inilagay bilang leksikal na alternatibo sa talababa. Pinanatili ang parallel na larawan ng ulap sa araw at liwanag ng apoy sa buong gabi.
