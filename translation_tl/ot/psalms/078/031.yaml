  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: tl
  text: At sumiklab laban sa kanila ang galit ng Diyos, at pinatay niya ang pinakamatitipuno sa kanila[a]; ibinuwal niya ang mga kabataang lalaki ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kanilang matataba”; malamang na tumutukoy sa mga pinakamatitipuno o pinakamalalakas sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: Kaya ... ang galit ng Diyos
  rationale: Ang אַף ay literal na “ilong” ngunit idyomatikong tumutukoy sa galit. Ipinahahayag ng “Kaya” ang pagsulong ng salaysay na dala ng waw, at malinaw na tinutukoy ng אֱלֹהִים ang Diyos ng Israel.
- source_word: עָלָה בָהֶם
  choice: nag-alab laban sa kanila
  rationale: Ipinahihiwatig ng עָלָה na tumindi o bumangon ang galit laban sa kanila. Ang “nag-alab laban” ay likas at malinaw sa modernong Tagalog, bagaman gumagamit ito ng karaniwang metapora ng apoy upang maipahayag ang pagtaas at pagtindi ng galit.
- source_word: וַיַּהֲרֹג
  choice: pinatay niya
  rationale: Tuwiran at makabagong salin ng הרג, na hindi pinahihina ang bigat ng hatol.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: ang pinakamalulusog sa kanila
  rationale: Mula ito sa salitang may diwang “mataba.” Sa konteksto, tumutukoy ito sa malalakas, matitipunong-loob, o piling kasapi ng bayan. Pinananatili ng “pinakamalulusog” ang pisikal na kulay ng salita nang hindi nagiging mapanlinlang o katawa-tawa; nasa talababa ang literal na anyo.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: ang mga kabataang lalaki ng Israel
  rationale: Karaniwang tumutukoy ang בָּחוּר sa mga lalaking nasa kasibulan ng lakas, kung minsan ay may pahiwatig na pandigma. Ang saling ito ay malinaw at hindi nagdaragdag ng di-tiyak na kahulugan.
- source_word: הִכְרִיעַ
  choice: ibinuwal niya
  rationale: Ang Hiphil ng כרע ay nangangahulugang sanhiing yumuko o bumagsak. Ang “ibinuwal” ay natural na katumbas at angkop sa paralelismo sa “pinatay.”
theological_decisions:
- issue: Antropopatikong paglalarawan sa galit ng Diyos
  choice: nag-alab laban sa kanila ang galit ng Diyos
  alternative: nagalit sa kanila ang Diyos; dumating sa kanila ang poot ng Diyos
  rationale: Pinananatili ang galit bilang paksa ng makulay na pahayag sa Hebreo sa halip na gawing payak na “nagalit ang Diyos.” Hindi rin ito binibigyang-kahulugan ayon sa isang partikular na doktrina tungkol sa damdamin ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Tuwiran ang mga pandiwa ng paghatol, at pinanatili ang paralelismong patula ng dalawang sugnay.
