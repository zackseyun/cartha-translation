  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: tl
  text: Ngunit tumalikod sila at nagtaksil gaya ng kanilang mga ama; lumihis sila gaya ng isang mapanlinlang na busog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng isang maluwag na busog” o “gaya ng isang sirang busog”—samakatuwid, isang busog na hindi maaasahang tumudla nang tuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: tumalikod sila
  rationale: Ipinapahayag ng סוּג ang pag-urong o pagtalikod mula sa dating landas. Likas sa modernong Tagalog ang “tumalikod” at hindi ito nagdaragdag ng teknikal na katawagang teolohikal.
- source_word: וַיִּבְגְּדוּ
  choice: nagtaksil
  rationale: Taglay ng בגד ang diwa ng kataksilan at pagsira ng tiwala. Pinananatili ng “nagtaksil” ang bigat na moral at relasyonal nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: כַּאֲבוֹתָם
  choice: gaya ng kanilang mga ama
  rationale: Tahasang “kanilang mga ama” ang nasa Hebreo. Pinanatili ang panlalaking katawagang pampamilya sa halip na gawing mas pangkalahatang “mga ninuno.”
- source_word: נֶהְפְּכוּ
  choice: lumihis sila
  rationale: Sa talinghaga ng busog, inilalarawan ng הפך ang paglihis o pagbaluktot mula sa wastong direksiyon. Natural sa Tagalog ang “lumihis” at malinaw nitong naiuugnay ang bayan sa palyadong pagtudla ng busog.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: gaya ng isang mapanlinlang na busog
  rationale: Ang רְמִיָּה ay maaaring magpahiwatig ng panlilinlang, kaluwagan, o pagiging di-maaasahan. Pinananatili ng “mapanlinlang na busog” ang matalinghagang anyo at ang personipikasyon ng Hebreo; inilalahad sa talababa ang ibang posibleng pakahulugan.
theological_decisions:
- issue: Pahiwatig ng pagtataksil ng Israel sa tipan
  choice: Gamitin ang salitang may bigat na moral na “nagtaksil” nang hindi tahasang idinaragdag ang Diyos o ang tipan bilang layon.
  alternative: “Hindi sila naging tapat” o “sinira nila ang tipan sa Diyos.”
  rationale: Ipinahihiwatig ng mas malawak na konteksto ang kataksilan sa tipan, ngunit hindi tahasang binabanggit sa talata ang layon ng pagtataksil. Pinananatili ng salin ang puwersa ng Hebreo nang walang dagdag na pagpapaliwanag na doktrinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikling paralelismo ng tulang Hebreo at ang talinghaga ng busog. Inilagay ang pananda ng talababa pagkatapos ng “busog,” ang salitang aktuwal na tinutukoy ng paliwanag.
