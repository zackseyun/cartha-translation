  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: tl
  text: Ngunit gigibain ka rin ng Diyos magpakailanman; dudukutin ka niya at hihilahin palabas ng iyong tolda,[a] at bubunutin ang iyong ugat mula sa lupain ng mga buháy.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa iyong tahanan.” Sa literal, “mula sa iyong tolda.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang iyong ugat mula sa lupain ng mga buháy”; ipinahihiwatig ng patulang pahayag ang pagbunot sa ugat.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Ngunit ... rin
  rationale: Pinananatili ng “rin” ang diwang pandagdag ng גַּם, habang ipinahihiwatig ng “Ngunit” ang pagsalungat sa pagmamapuri ng masama sa naunang konteksto.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwan at natural na salin para sa katawagan sa Diyos sa kontekstong ito.
- source_word: יִתָּצְךָ
  choice: gigibain ka
  rationale: Ang נתץ ay tumutukoy sa marahas na paggiba o pagbuwag, na angkop sa larawang sinusundan ng pagbunot.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Pinakamalinaw na ipinahahayag ang pangmatagalang at ganap na bisa ng hatol nang hindi dinaragdagan ang sinasabi ng teksto.
- source_word: יַחְתְּךָ
  choice: dadamputin ka
  rationale: Ang bihirang pandiwa ay nagpapahiwatig ng pagkuha o pagdaklot; pinili ang “dadamputin” upang mapanatili ang konkretong pagkilos, habang ang kasunod na “hahatakin” ang nagpapakita ng puwersahang pag-aalis.
- source_word: וְיִסָּחֲךָ
  choice: at hahatakin
  rationale: Mula sa נסח, na nangangahulugang humila, magtanggal, o bumunot; natural itong iniuugnay sa pag-aalis mula sa tolda.
- source_word: מֵאֹהֶל
  choice: mula sa iyong tolda
  rationale: Pinananatili ang literal at kongkretong larawan ng אֹהֶל sa halip na agad itong gawing “tahanan.”
- source_word: וְשֵׁרֶשְׁךָ
  choice: at bubunutin ang iyong ugat
  rationale: Nominal ang anyong Hebreo, “ang iyong ugat,” sa isang eliptikong konstruksiyong patula. Pinananatili ng salin ang mismong ugat bilang larawan sa halip na gawing “bubunutin ka.”
- source_word: מֵאֶרֶץ חַיִּים
  choice: mula sa lupain ng mga buháy
  rationale: Tumpak na pinananatili ang Hebreong idyoma para sa dako o kalagayan ng mga nabubuhay, na kasalungat ng kamatayan.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang kahulugan at tungkulin ng termino, kaya tinumbasan ito sa baybay sa halip na bigyan ng mapagpalagay na salin.
theological_decisions:
- issue: Saklaw ng hatol na ipinahahayag ng לָנֶצַח
  choice: magpakailanman
  alternative: lubusan; minsanan at pangwakas
  rationale: Ang karaniwang diwa ay walang-hanggang pananatili. Pinananatili nito ang bigat ng hatol ng Diyos ngunit hindi nagpapasya nang higit sa sinasabi ng talata tungkol sa eksaktong teolohikal na kalikasan nito.
- issue: Larawan ng pag-aalis mula sa lupain ng mga buháy
  choice: bubunutin ang iyong ugat mula sa lupain ng mga buháy
  alternative: bubunutin ka mula sa lupain ng mga buháy
  rationale: Pinananatili ang tahasang imahen ng “iyong ugat” sa Hebreo at ang matinding pahiwatig ng lubos na pag-aalis, nang hindi ipinapaliwanag pa ang uri o kalagayan ng kamatayang tinutukoy.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “gigibain,” “hahatakin,” at “bubunutin” upang mapanatili ang sunod-sunod na mararahas at kongkretong larawan ng Hebreong tula. Nilagyan ng tuldik ang “buháy” upang maiwasan ang maling pagbasa.
