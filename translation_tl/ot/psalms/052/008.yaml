id: PSA.52.8
reference: Psalms 52:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: tl
  text: Tingnan ninyo—ito ang lalaking hindi ginawang kanlungan[a] ang Diyos, kundi nagtiwala sa kasaganaan ng kanyang kayamanan at nagpakalakas sa kanyang kapahamakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muog” o “matibay na tanggulan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “pagkawasak,” “masamang hangarin,” o “mapaminsalang mga pakana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Isang pantawag-pansin na naghaharap sa lalaki bilang malinaw na halimbawa. Likas ito sa makabagong Filipino at pinananatili ang mariing puwersa ng Hebreo.
- source_word: הַגֶּבֶר
  choice: ang lalaki
  rationale: Tiyak na panlalaking pangngalang isahan ang Hebreo; ang 'lalaki' ay tuwiran at hindi pinapawi ang gramatikal na kasarian.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: hindi ginawang kanlungan ang Diyos
  rationale: Ang שׂים ay 'gawing/italagang,' at ang מָעוֹז ay pinagmumulan o lugar ng kaligtasan at lakas. Malinaw at natural sa Filipino ang 'kanlungan.'
- source_word: וַיִּבְטַח
  choice: kundi nagtiwala
  rationale: Bagaman maaaring simpleng 'at,' ang waw dito ay may malinaw na paghahambing sa hindi niya pagkilala sa Diyos bilang kanlungan.
- source_word: בְּרֹב עָשְׁרוֹ
  choice: sa kasaganaan ng kanyang kayamanan
  rationale: Pinananatili ng 'kasaganaan' ang diwa ng רֹב at ng 'kayamanan' ang עֹשֶׁר nang hindi pinaiikli ang dalawang sangkap.
- source_word: יָעֹז
  choice: nagpakalakas
  rationale: Ipinahahayag ng pandiwa ang pagiging o pagpapalakas. Ang 'nagpakalakas' ay natural at hindi gaanong nagpapasok ng layuning 'humanap' na hindi tahasang nasa anyo.
- source_word: בְּהַוָּתוֹ
  choice: sa kanyang kapahamakan
  rationale: Malawak ang הַוָּה at maaaring tumukoy sa kapahamakan, pagkawasak, masamang hangarin, o mapaminsalang pakana. Ang 'kapahamakan' ay nagpapanatili sa ironiyang ang inaasahan niyang lakas ay nauuwi sa pagkasira.
theological_decisions:
- issue: Kasariang ipinahahayag ng הַגֶּבֶר
  choice: ang lalaki
  alternative: ang tao
  rationale: Panlalaking isahan ang anyong Hebreo at inilalarawan ang isang kinatawang masamang lalaki; hindi ito ginawang neutral nang walang pangangailangan.
- issue: Kahulugan ng הַוָּה
  choice: kapahamakan
  alternative: pagkawasak; masamang hangarin; mapaminsalang mga pakana
  rationale: Hindi tiyak ang saklaw ng salita. Pinili ang 'kapahamakan' bilang angkop sa kabalintunaan ng maling pagtitiwala, habang inilalahad sa talababa ang tunay na mga alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'Tingnan ninyo' bilang malinaw na pantawag-pansin, at ang gitling na em dash upang idiin ang kasunod na paglalarawan. Inilagay ang bawat talababa sa mismong salitang tinutukoy nito.
