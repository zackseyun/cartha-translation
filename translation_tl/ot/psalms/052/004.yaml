  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: tl
  text: 'Inibig mo ang masama kaysa sa mabuti,

    ang kasinungalingan kaysa sa pagsasabi ng matuwid. Selah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Inibig mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay tuwirang paratang. Likas sa dignidad ng tulang Filipino ang “Inibig mo,” at naipahihiwatig ng konteksto ang nagpapatuloy na kabuluhan nito.
- source_word: רָּע
  choice: ang masama
  rationale: Kabaligtaran ito ng “mabuti” at tumutukoy sa masama sa aspektong moral.
- source_word: מִטּוֹב
  choice: kaysa sa mabuti
  rationale: Ang מִן sa paghahambing ay nagpapahayag ng pagpili o pagkiling sa masama higit sa mabuti; natural itong ihayag sa Filipino sa pamamagitan ng “kaysa sa.”
- source_word: שֶׁקֶר
  choice: ang kasinungalingan
  rationale: Saklaw ng pangngalan ang kabulaanan o pagsisinungaling sa pangkalahatan, hindi lamang ang magkakahiwalay na mga kasinungalingan.
- source_word: מִדַּבֵּר
  choice: kaysa sa pagsasalita
  rationale: Pinananatili ng pariralang ito ang ikalawang paghahambing at ang pandiwang diwa ng pinagmulang Hebreo.
- source_word: צֶדֶק
  choice: ng matuwid
  rationale: Sa konteksto ng pananalita, tumutukoy ito sa bagay na tama at matuwid. Ang “pagsasalita ng matuwid” ay nagpapanatili sa etikong bigat nang hindi ipinipilit ang mas makitid na kahulugang legal na “katarungan.”
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa titik ang terminong liturhikal o musikal sapagkat hindi tiyak ang eksaktong kahulugan nito.
theological_decisions:
- issue: Pagpapakahulugan sa צֶדֶק sa konteksto ng pananalita
  choice: matuwid
  alternative: tama; katarungan; katuwiran
  rationale: Tahasang ikinokontra rito ang kasinungalingan sa matuwid na pananalita. Pinananatili ng “matuwid” ang moral na bigat ng salita at likas itong kaugnay ng “pagsasalita,” samantalang ang “katarungan” ay maaaring magpahiwatig ng legal o panlipunang kontekstong hindi tahasang narito.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang dalawang magkatimbang na paghahambing at ang terminong “Selah.” Hindi kailangan ng talababa sapagkat malinaw na naipahahayag sa pangunahing teksto ang leksikal na saklaw.
