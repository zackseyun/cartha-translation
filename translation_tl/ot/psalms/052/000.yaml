lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong nangangasiwa sa musikal na pagtatanghal. Likas sa modernong Tagalog ang parirala at hindi nito nililimitahan ang tungkulin sa koro lamang.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Hindi tiyak ang kahulugan ng terminong ito sa mga pamagat ng Awit; malamang na katawagan ito sa isang uri ng akda o pagtatanghal. Pinanatili ang salitang Hebreo upang hindi ipilit ang kahulugang “mapagturo” o “mapagnilay.”
- source_word: לְדָוִד
  choice: ni David
  rationale: Ito ang maikli at karaniwang anyo sa pamagat sa Tagalog. Maaaring ipahiwatig ng Hebreong pang-ukol ang pagkatha, pag-aalay, pag-aari, o kaugnayan; nililinaw sa talababa ang saklaw ng posibilidad.
theological_decisions:
- issue: Pagkatha o kaugnayang ipinahihiwatig ng לְדָוִד
  choice: ni David
  alternative: akda ni David; para kay David; kaugnay ni David
  rationale: Hindi tahasang itinatakda ng Hebreo na si David ang may-akda. Pinanatili sa maikling pangunahing teksto ang tradisyonal at likas na anyo, habang inilalahad sa talababa ang tunay na kalabuan nito.
translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal, angkop sa anyo ng pamagat ng isang Awit. Ginamit ang “tagapangasiwa ng awitan” sa halip na mas teknikal o makitid na “pinuno ng koro,” at pinanatili ang “Maskil” bilang transliteradong terminong Hebreo.
