base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: tl
  text: nang dumating si Doeg na Edomita at nag-ulat kay Saul, at sinabi sa kanya, “Dumating si David sa bahay ni Ahimelec.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹוא
  choice: nang dumating
  rationale: Ang ב na may infinitive construct ng בוא ay nagpapakilala ng sugnay na panahunan; natural itong isalin sa modernong Filipino bilang “nang dumating.”
- source_word: דּוֹאֵג הָאֲדֹמִי
  choice: si Doeg na Edomita
  rationale: Pinananatili ang pangalang pantangi at isinasalin ang katawagang nagpapahiwatig ng lahi o pinagmulan bilang “Edomita.”
- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: at nag-ulat kay Saul
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat; ang “nag-ulat” ay angkop sa konteksto ng paghahatid ng impormasyon kay Saul.
- source_word: וַיֹּאמֶר לוֹ
  choice: na sinasabi sa kanya
  rationale: Pinananatili nito ang hiwalay na panimulang pormula bago ang mismong nilalaman ng ulat at ang tahasang panghalip ng Hebreo.
- source_word: בָּא דָוִד
  choice: Dumating si David
  rationale: Ang Qal perfect na בָּא ay tumutukoy sa natapos na pagdating. Hindi likas sa Filipino ang eksaktong pagkakaiba ng English simple past at present perfect, kaya ang “dumating” ay sadyang hindi nagpapasya sa aspektuwal na pagbasa.
- source_word: אֶל בֵּית אֲחִימֶלֶךְ
  choice: sa bahay ni Ahimelec
  rationale: Sa Filipino, likas na ipinapahayag ng “sa bahay ni” ang pagpunta sa tahanan o gusaling nauugnay kay Ahimelec; mas pinapaboran ng konteksto ang lugar kaysa sambahayan.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang anyong Tagalog ng mga pangalan: Doeg, Saul, David, at Ahimelec. Ang pagkakasunod-sunod ng mga sugnay ay malapit sa Hebreo, sapagkat bahagi ito ng pamagat o superskripsiyon ng awit.'
