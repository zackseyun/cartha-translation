id: PSA.52.9
reference: Psalms 52:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: tl
  text: Ngunit ako naman ay tulad ng isang malagong[a] punong olibo sa bahay ng Diyos; nagtitiwala ako sa tapat na pag-ibig[b] ng Diyos magpakailanman at walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “luntiang” o “sariwang.” Binibigyang-diin ng salitang Hebreo ang masigla at malusog na paglago.
    reason: lexical_alternative
  - marker: b
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na madalas tumutukoy sa matibay at mapagkakatiwalaang pag-ibig ng Diyos; maaari ring isaling “pag-ibig na di-nagmamaliw” o, sa ilang konteksto, “awa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako naman
  rationale: Ipinahahayag ng pangatnig at hiwalay na panghalip ang malinaw na pagkakaiba ng salmista sa masamang taong binanggit sa naunang konteksto.
- source_word: כְּזַיִת
  choice: tulad ng isang ... punong olibo
  rationale: Ang unlaping כְּ ay naghuhudyat ng paghahambing, at ang זַיִת dito ay tumutukoy sa puno, hindi lamang sa bunga nito.
- source_word: רַעֲנָן
  choice: malago
  rationale: Ipinahihiwatig ng salita ang luntian, sariwa, at masiglang paglago; likas na naipahahayag ito ng “malago” sa modernong Filipino.
- source_word: בְּבֵית אֱלֹהִים
  choice: sa bahay ng Diyos
  rationale: Tuwirang pinananatili nito ang larawan ng santuwaryo o tahanan ng Diyos at ang pamilyar na biblikal na pananalita.
- source_word: בָּטַחְתִּי
  choice: nagtitiwala ako
  rationale: Bagaman anyong perfect ang pandiwang Hebreo, maaari nitong ipahayag ang isang matatag at nagpapatuloy na kalagayan ng pagtitiwala, lalo na sa kaugnayan ng kasunod na pahayag na walang hanggan.
- source_word: בְחֶסֶד
  choice: sa tapat na pag-ibig
  rationale: Sinasaklaw ng parirala ang pag-ibig na matibay, mapagkakatiwalaan, at matapat, nang hindi nililimitahan ang חֶסֶד sa awa lamang o ipinapasok ang isang makitid na doktrinal na pakahulugan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ito ang karaniwan at tuwirang salin ng titulong Hebreo para sa Diyos ng Israel sa talatang ito.
- source_word: עוֹלָם וָעֶד
  choice: magpakailanman at walang hanggan
  rationale: Pinananatili ng tambalang parirala ang pinaigting na diwa ng walang katapusang tagal sa malinaw at kasalukuyang Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa חֶסֶד sa kontekstong may katapatan ng Diyos
  choice: tapat na pag-ibig
  alternative: wagas na pag-ibig; pag-ibig na di-nagmamaliw; awa
  rationale: Ibinabatay ng salmista ang kanyang pagtitiwala sa matibay at patuloy na kagandahang-loob ng Diyos. Pinananatili ng “tapat na pag-ibig” ang parehong pag-ibig at katapatan ng termino nang hindi ipinipilit ang isang partikular na sistemang teolohikal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ako naman” upang maging natural ang matinding paghahambing, at pinanatili ang larawang “bahay ng Diyos” at “punong olibo” nang walang dagdag na paliwanag sa pangunahing teksto.
