  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: tl
  text: 'Magpapasalamat ako sa iyo magpakailanman,

    sapagkat ginawa mo ito.

    Aasa ako sa iyong pangalan[a], sapagkat mabuti ito[b],

    sa harap ng iyong mga tapat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hihintayin ko ang iyong pangalan.”
    reason: lexical_alternative
  - marker: b
    text: O, “sapagkat mabuti ang iyong pangalan.”
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Magpapasalamat ako sa iyo
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpasalamat o magpuri. Ang “magpapasalamat” ay likas sa modernong Tagalog at angkop na tugon sa ginawa ng Diyos.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinapahayag nito ang walang-hanggang pagpapatuloy at angkop sa marangal na rehistro ng Mga Awit.
- source_word: כִּי עָשִׂיתָ
  choice: sapagkat ikaw ang gumawa nito
  rationale: Causal ang כִּי, at malawak ang עשה. Ang “nito” ay tumutukoy sa mapagpasyang pagkilos ng Diyos na inilalarawan sa konteksto nang hindi dinaragdagan ang uri ng pagkilos.
- source_word: וַאֲקַוֶּה שִׁמְךָ
  choice: Aasa ako sa iyong pangalan
  rationale: Saklaw ng קוה ang paghihintay at pag-asa. Mas malinaw at likas sa Tagalog ang “aasa” kasama ng “sa iyong pangalan,” samantalang pinananatili sa talababa ang mas literal na diwa ng paghihintay.
- source_word: כִּי טוֹב
  choice: sapagkat mabuti ito
  rationale: Pinananatili ng panghalip ang maikli at bahagyang pahiwatig na pahayag ng Hebreo. Natural na maiuugnay ito sa “pangalan,” ngunit hindi iyon lubusang ginagawang tahasan sa pangunahing teksto.
- source_word: נֶגֶד חֲסִידֶיךָ
  choice: sa harap ng mga tapat sa iyo
  rationale: Ang נֶגֶד ay tumutukoy sa harapan o presensiya ng iba. Ang חֲסִידֶיךָ ay mga taong may matapat na debosyon at katapatan sa Diyos; iniiwasan ng saling ito ang mas teknikal na dating ng “mga banal.”
theological_decisions:
- issue: Kahulugan ng חֲסִידֶיךָ bilang katawagan sa pamayanang nakatalaga sa Diyos
  choice: mga tapat sa iyo
  alternative: iyong mga banal; iyong mga matapat
  rationale: Itinatampok nito ang katapatan at debosyon sa Diyos nang hindi ipinapasok ang mas huling teknikal o denominasyonal na kahulugan ng “mga banal.”
- issue: Kung tahasang tutukuyin na ang pangalan ng Diyos ang mabuti
  choice: sapagkat mabuti ito
  alternative: sapagkat mabuti ang iyong pangalan
  rationale: Maikli at eliptikal ang Hebreo. Pinananatili ng pangunahing teksto ang bahagyang kalabuan, habang ibinibigay sa talababa ang mas tahasang pagbasa.
- issue: Pagpili sa pagitan ng paghihintay at pag-asa sa קוה
  choice: Aasa ako sa iyong pangalan
  alternative: Hihintayin ko ang iyong pangalan
  rationale: Parehong nasa saklaw ng pandiwa ang paghihintay at umaasang pagtitiwala. Ang pangunahing salin ay natural at malinaw sa Tagalog, samantalang pinananatili ng talababa ang mas literal ngunit di-karaniwang pagkakaugnay ng pandiwa at “pangalan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “magpakailanman” para sa tonong patula, at pinanatili ang biblikal na idyomang “iyong pangalan.”
