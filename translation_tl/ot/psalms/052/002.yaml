  text: מַה תִּתְהַלֵּ֣ל בְּ֭/רָעָה הַ/גִּבּ֑וֹר חֶ֥סֶד אֵ֝֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: tl
  text: Bakit mo ipinagyayabang ang kasamaan, makapangyarihang tao? Ang tapat na pag-ibig ng Diyos ay nananatili buong maghapon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: ipinagyayabang ang kasamaan
  rationale: Ang hitpael ng הלל ay tumutukoy sa pagyayabang, at ang בְּרָעָה ay likas na maisasalin sa Filipino bilang tuwirang layon nang hindi binabago ang diwa.
- source_word: הַגִּבּוֹר
  choice: makapangyarihang tao
  rationale: Pinananatili nito ang pagtukoy sa isang lalaking kinikilalang malakas o makapangyarihan; mas malinaw ito sa karaniwang Filipino kaysa sa literal na “makapangyarihan” lamang.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matatag at mapagkakatiwalaang pag-ibig na saklaw ng Hebrew na חֶסֶד.
- source_word: כָּל־הַיּוֹם
  choice: buong maghapon
  rationale: Natural na Filipino ito para sa “buong araw” at nagpapahiwatig ng walang patid na tagal.
theological_decisions:
- issue: Walang hayag na pandiwa sa sugnay na חֶסֶד אֵל כָּל־הַיּוֹם
  choice: ay nananatili
  alternative: ay buong maghapon
  rationale: Nagdaragdag ng minimally supplied copular/durative sense upang maging malinaw at natural sa Filipino, habang hindi nililimitahan kung paano kumikilos ang tapat na pag-ibig ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalim na retorikal na tanong at ang kaibahan ng pagyayabang sa kasamaan at ng namamalaging tapat na pag-ibig ng Diyos.
