  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: tl
  text: 'Kapahamakan ang binabalak mo[a];

    ang dila mo ay gaya ng labahang hinasa,

    gumagawa ng pandaraya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maramihan ang salitang isinaling “kapahamakan,” ngunit ginagamit ito rito para sa mapanirang pinsala sa kabuuan. Maaari ring isalin: “pagkawasak.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “gumagawa ng pandaraya” ay maaaring tumukoy sa dila mismo o sa taong kinakausap bilang isang mandaraya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: kapahamakan
  rationale: Ang pangngalang maramihan sa Hebreo ay tumutukoy nang idyomatiko sa mapanirang pinsala. Ang “kapahamakan” ay likas sa makabagong Filipino at saklaw ang ideya ng kapinsalaan o pagkawasak.
- source_word: תַּחְשֹׁב
  choice: binabalak mo
  rationale: Ang pandiwa ay ikalawang panauhang panlalaki at nagpapahayag dito ng sinasadyang pagbuo ng masamang balak, hindi lamang pag-iisip.
- source_word: לְשׁוֹנֶךָ
  choice: ang dila mo
  rationale: Pinanatili ang kongkretong talinghaga ng dila bilang kasangkapan ng mapaminsalang pananalita.
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: gaya ng labahang hinasa
  rationale: Ipinahahayag ng parirala ang paghahambing sa isang talim na inihandang pumutol. Ang “hinasa” ay mas angkop sa talinghaga kaysa sa literal ngunit mahinang “pinakintab.”
- source_word: עֹשֵׂה רְמִיָּה
  choice: gumagawa ng pandaraya
  rationale: Pinananatili ng parirala ang aktibong diwa at ang maigsi, patulang anyo. Hindi tahasang tinutukoy sa salin kung ang gumagawa ng pandaraya ay ang dila o ang taong kinakausap.
theological_decisions:
- issue: Paksa ng תַּחְשֹׁב (“binabalak”)
  choice: 'Ang ipinahihiwatig na “ikaw” ang paksa: “binabalak mo.”'
  alternative: “Ang dila mo ang nagbabalak ng kapahamakan.”
  rationale: Ang pandiwa ay nasa ikalawang panauhang isahan, at ang pangunahing hati ng tula ay naghihiwalay sa “binabalak mo” mula sa kasunod na sugnay tungkol sa dila. Kaya hindi ginawang paksa ng pandiwa ang “dila mo.”
- issue: Tinutukoy ng עֹשֵׂה רְמִיָּה
  choice: Pinanatiling di-tiyak kung ang parirala ay naglalarawan sa dila o sa taong kinakausap.
  alternative: Tahasan itong iugnay alinman sa “dila” o sa “ikaw.”
  rationale: Pinahihintulutan ng balangkas ng Hebreo ang dalawang pag-uugnay; hindi nararapat lutasin sa salin ang tunay na kalabuan.
translation_notes:
  register: Makabago at marangal na Filipino, na may maikling mga linya upang mapanatili ang anyong patula. Ginamit ang payak na “ay” sa halip na pinaikling “mo’y” para sa malinaw at malawak na pagbasa.
