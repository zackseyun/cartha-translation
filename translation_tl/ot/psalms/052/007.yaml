lexical_decisions:
- source_word: וְיִרְאוּ
  choice: Makikita ito
  rationale: Ang Qal imperfect na ראה ay tuwirang tumutukoy sa pagkakita. Idinagdag ang “ito” bilang likas na layon sa Filipino, na tumutukoy sa hatol na inilalarawan sa konteksto.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Ang pangmaramihang pang-uri ay ginamit bilang pangngalan; “mga matuwid” ang natural at marangal na katumbas sa modernong Filipino.
- source_word: וְיִירָאוּ
  choice: matatakot sila
  rationale: Pinananatili ng “matatakot” ang lawak ng ירא, na maaaring magpahiwatig ng pangamba o takot na may paggalang sa harap ng hatol ng Diyos.
- source_word: וְעָלָיו
  choice: siya
  rationale: Sa pagsasama ng על at שׂחק, ang panghalip ang pinatutungkulan ng pagtawa; sa Filipino, likas itong ipahayag bilang “pagtatawanan ... siya.”
- source_word: יִשְׂחָקוּ
  choice: pagtatawanan nila
  rationale: Pinananatili nito ang saligang diwang “tumawa,” habang likas na ipinahihiwatig ng anyong Filipino at ng konteksto ang mapanuyang pagtawa nang hindi tahasang pinapalitan ng “kukutyain.”
theological_decisions:
- issue: Kahulugan ng takot bilang tugon sa hatol
  choice: matatakot sila
  alternative: mangingilabot sila; mamamangha sila nang may paggalang
  rationale: Hindi nilulutas ng salin kung ang tugon ay pangunahing pangamba o mapitagang takot. Sa gayon, napapanatili ang teolohikal na tensiyon ng Hebreo sa harap ng makatarungang paghatol ng Diyos.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang malinaw na ayos na paksa-pandiwa at pinanatili ang maikli at matinding paralelismo ng tulang Hebreo.
