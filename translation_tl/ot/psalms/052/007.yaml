  text: 'Makikita ng mga matuwid at matatakot sila[a]; tatawa sila sa kanya[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mangingilabot”; ang salitang Hebreo ay maaaring tumukoy sa pangamba, ngunit sa kontekstong ito maaari rin itong magpahiwatig ng mapitagang takot sa harap ng hatol ng Diyos.
