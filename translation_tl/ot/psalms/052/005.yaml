translation:
  language: tl
  text: Mahal mo ang lahat ng salitang lumalamon, mapanlinlang na dila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga salitang mapangwasak.”
    reason: Ipinakikita ang interpretibong kahulugan ng בָלַע habang pinananatili sa pangunahing teksto ang literal at matingkad na larawan ng paglamon.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Iniibig mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay literal na maaaring isaling “inibig mo,” ngunit sa tuwirang patulang paratang ay ipinahihiwatig nito ang namamayaning pagkahilig; kaya natural sa modernong Tagalog ang pangkasalukuyang “iniibig mo.”
- source_word: כָל דִּבְרֵי
  choice: ang lahat ng salitang
  rationale: Pinananatili nito ang kabuuang saklaw ng כָל at ang maramihang construct ng דָּבָר bilang mga salita o pahayag.
- source_word: בָלַע
  choice: lumalamon
  rationale: Pinananatili ang matingkad na metapora ng ugat na nangangahulugang lumulon o lumalamon, sa halip na agad itong ipaliwanag lamang bilang “mapanira” o “mapangwasak.”
- source_word: לְשׁוֹן
  choice: dila
  rationale: Ang literal na bahagi ng katawan ay patulang metapora para sa pananalita at natural ding nauunawaan sa Tagalog.
- source_word: מִרְמָה
  choice: mapanlinlang
  rationale: Isinasalin ang pangngalang “panlilinlang/pandaraya” bilang likas na panuring sa “dila,” nang hindi inaalis ang diwa ng mapanlinlang na pananalita.
