  naturalness: Mas natural at marangal sa modernong Filipino ang “Mahal mo” kaysa “Iniibig mo.” Hindi rin kailangang panatilihin ang Ingles na “O”; sapat at likas ang bokatibong “mapanlinlang na dila.”
