  text: עֵ֤דוּת בִּֽ/יה֘וֹסֵ֤ף שָׂמ֗/וֹ בְּ֭/צֵאת/וֹ עַל אֶ֣רֶץ מִצְרָ֑יִם שְׂפַ֖ת לֹא יָדַ֣עְתִּי אֶשְׁמָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: tl
  text: Itinakda niya ito bilang patotoo sa Jose nang lumabas siya laban sa lupain ng Ehipto.[a][b] Narinig ko ang isang wikang hindi ko nakilala:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw ng lupain ng Ehipto.” Ang pang-ukol na Hebreo ay maaari ring magpahiwatig ng pagkilos sa ibabaw o sa buong saklaw ng lupain.
    reason: lexical_alternative
  - marker: b
    text: Malamang na kumakatawan dito si Jose sa bayang Israel, lalo na sa konteksto ng paglabas mula sa Ehipto; pinanatili sa salin ang pangalang nasa Hebreo. Hindi rin tahasang tinutukoy ng Hebreo kung ang “siya” ay Diyos o Jose/Israel.
    reason: cross_reference
  - marker: c
    text: O “Naririnig ko ang isang wikang hindi ko nakilala.” Maaaring unawain ang pandiwang Hebreo bilang kasalukuyan o nakaraan sa patulang konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: patotoo
  rationale: Pinananatili ng “patotoo” ang pangunahing legal at panrelihiyong diwa ng pangngalan; maaari rin itong tumukoy sa isang itinakdang tuntunin, ngunit hindi iyon tahasang nililinaw sa salin.
- source_word: בִּיהוֹסֵף
  choice: kay Jose
  rationale: Likas sa Filipino ang “kay Jose” para sa kaugnayan sa isang taong pinangalanan. Pinananatili ang Jose sa halip na palitan ng Israel, upang hindi alisin ang metonimikong pag-igting ng Hebreo.
- source_word: שָׂמוֹ
  choice: Itinatag niya ito
  rationale: Ang שׂים ay nangangahulugang maglagay o magtakda. Ang “itinatag” ay natural na katambal ng “bilang patotoo” at ipinahihiwatig ang makapangyarihang pagtatakda nang hindi nagpapasok ng dagdag na paliwanag.
- source_word: בְּצֵאתוֹ
  choice: nang lumabas siya
  rationale: Inihahayag ng anyong may ב ang panahong kasabay ng paglabas. Ang “siya” ay sadyang hindi tinukoy upang mapanatili ang kalabuan ng reperente.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Sa Filipino, ang “sa” ay natural na makapaghahatid ng kilos na naganap sa o tumawid sa lupain. Dahil maaari ring mangahulugan ang עַל ng “laban sa,” inilagay ang alternatibo sa talababa.
- source_word: שְׂפַת
  choice: isang wika
  rationale: Bagaman literal na “labi,” idyomatiko itong tumutukoy sa wika o pananalita; “wika” ang malinaw at natural na katumbas.
- source_word: לֹא יָדַעְתִּי
  choice: hindi ko nakilala
  rationale: Ipinahahayag nito ang dati at personal na kawalan ng pagkakilala sa wikang narinig, habang nananatiling natural sa modernong Filipino.
- source_word: אֶשְׁמָע
  choice: Narinig ko
  rationale: Maaaring unawain ang imperfect bilang nakaraang pangyayari sa patulang pagsasalaysay. Ang kasalukuyang “Naririnig ko” ay tunay na alternatibo at itinala sa talababa.
theological_decisions:
- issue: Reperente ng “Jose”
  choice: Pinanatili ang pangalang Jose, na maaaring kumatawan sa bayang Israel sa konteksto ng paglabas mula sa Ehipto.
  alternative: Tahasang isalin bilang “Israel,” o unawain nang mas makitid bilang Efraim at mga lipi sa hilaga.
  rationale: Jose ang tahasang pangalan sa Hebreo. Ang pagpapanatili rito ay umiiwas sa pagpapalit ng teksto ng isang interpretasyon.
- issue: Reperente ng “siya” sa “nang lumabas siya”
  choice: Pinanatili ang panghalip na walang tahasang tinutukoy.
  alternative: Tukuyin itong Diyos na kumilos sa buong Ehipto, o Jose/Israel na lumabas mula roon.
  rationale: Hindi tahasang nilulutas ng anyong Hebreo ang reperente; dapat panatilihin ng salin ang tunay na kalabuan.
- issue: Paglipat ng nagsasalita sa ikalawang linya
  choice: Pinanatili ang unang panauhan nang hindi dinaragdagan ng pangalan ng nagsasalita.
  alternative: Tukuyin ang nagsasalita bilang Diyos o bilang mang-aawit.
  rationale: Ang konteksto ay humahantong sa pananalita ng Diyos, ngunit hindi tahasang pinangalanan ng talata ang nagsasalita sa linyang ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ehipto” at “Jose,” na karaniwang anyo sa Bibliyang Filipino. Iniwasan ang labis na teknikal na “ordinansa” at pinanatili ang mga tunay na kalabuan tungkol sa reperente ng panghalip, kinakatawan ni Jose, at panahon ng pandiwang “marinig.”
