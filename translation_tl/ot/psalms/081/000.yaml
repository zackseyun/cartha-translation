  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: ayon sa Gitit[a]. Kay Asaf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Gitit. Malamang na tumutukoy ito sa isang paraang musikal, instrumento, o pangalan ng himig, ngunit hindi tiyak ang eksaktong kahulugan nito. Maaaring may kaugnayan ito sa Gat o pangalan ng isang himig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Malinaw at likas sa modernong Filipino ang pariralang ito nang hindi nililimitahan ang tungkulin sa koro lamang.
- source_word: עַל
  choice: ayon sa
  rationale: Sa kontekstong musikal ng pamagat, malamang na ipinakikilala nito ang isang himig, instrumento, o paraan ng pagtugtog, hindi ang literal na kahulugang panlunan na “sa ibabaw ng.”
- source_word: הַגִּתִּית
  choice: Gitit
  rationale: Hindi tiyak kung ito ay isang instrumentong musikal, pangalan ng himig, o katawagang may kaugnayan sa Gat. Pinananatili ng transliterasyon ang kawalang-katiyakan ng Hebreo.
- source_word: לְאָסָף
  choice: Kay Asaf
  rationale: Maaaring ipahiwatig ng לְ ang pagkakatha, kaugnayan, pag-aari sa koleksiyon, o pag-aalay. Ang “Kay Asaf” ay maikli at hindi tahasang nagpapasiya kung “ni Asaf” o “para kay Asaf.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa ng awitan” bilang likas na katawagan sa namumuno sa musikang panliturhiya, habang pinanatili ang Gitit bilang hindi tiyak na terminong musikal. Ang “Kay Asaf” ay sadyang nagpapanatili sa malawak na saklaw ng Hebreong לְ.
