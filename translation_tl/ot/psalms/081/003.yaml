  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: tl
  text: Hipan ninyo ang trumpeta sa bagong buwan, sa kabilugan ng buwan[a], sa araw ng ating kapistahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa natatakpang buwan” o “sa takdang panahon.” Pinagtatalunan ang kahulugan ng salitang Hebreo na כֵּסֶה. Ginamit dito ang “kabilugan ng buwan” dahil angkop ito sa paralelismong pangkalendaryo kasama ng “bagong buwan” at sa konteksto ng kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Hipan ninyo
  rationale: Ang Qal imperative plural ng תקע, kapag שׁוֹפָר ang layon, ay utos na hipan o patunugin ito. Likas sa modernong Tagalog ang “hipan ninyo” at malinaw nitong pinananatili ang maramihang pautos.
- source_word: בַחֹדֶשׁ
  choice: sa bagong buwan
  rationale: Maaaring mangahulugan ang חֹדֶשׁ ng “buwan” o “bagong buwan.” Sa kontekstong pangkalendaryo at pangkapistahan, at bilang katambal ng כֵּסֶה, ang “bagong buwan” ang pinakamalamang.
- source_word: שׁוֹפָר
  choice: trumpeta
  rationale: Tumutukoy ang שׁוֹפָר sa sungay na hinihipan bilang hudyat, lalo na sa pagsamba. Malinaw at karaniwan sa Tagalog ang “trumpeta”; ang mas tiyak na “sungay ng lalaking tupa” ay posibleng salin ngunit mas mabigat at maaaring magbigay ng espesipikong materyal na hindi kailangang idiin dito.
- source_word: בַכֵּסֶה
  choice: sa kabilugan ng buwan
  rationale: Pinagtatalunan ang kahulugan ng כֵּסֶה. Ang “kabilugan ng buwan” ay angkop sa paralelismong pangkalendaryo kasama ng “bagong buwan” at sa konteksto ng kapistahan, ngunit inilalahad sa talababa ang ibang tunay na posibilidad.
- source_word: לְיוֹם
  choice: sa araw ng
  rationale: Ang לְ dito ay nag-uugnay sa pagtunog ng trumpeta sa araw ng kapistahan. Natural sa Tagalog ang temporal na pariralang “sa araw ng.”
- source_word: חַגֵּנוּ
  choice: ating kapistahan
  rationale: Ang חַג ay kapistahan o pistang panrelihiyon, kadalasa’y may kaugnayan sa paglalakbay para sumamba. Pinananatili ng “ating kapistahan” ang kolektibong hulaping “aming/atin” at ang marangal na kontekstong panrelihiyon.
theological_decisions:
- issue: Kahulugan ng בַכֵּסֶה sa pagtukoy sa kalendaryo ng kapistahan
  choice: sa kabilugan ng buwan
  alternative: sa natatakpang buwan; sa takdang panahon
  rationale: Pangunahin itong usaping leksikal at kontekstuwal, hindi doktrinal. Ang “kabilugan ng buwan” ang nagbibigay ng malinaw na paralelismo sa “bagong buwan” at akma sa araw ng kapistahan. Gayunman, dahil hindi tiyak ang bihirang terminong Hebreo, hindi dapat itago ang ibang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tulang pangsamba. Ginamit ang “ninyo” upang ipakita ang maramihang utos at “ating” upang mapanatili ang sama-samang tinig ng חַגֵּנוּ. Nasa mismong teksto ang marker na [a].
