  text: I removed the burden from his shoulder[c][b][a]; his hands passed away from the basket.
translation:
  language: tl
  text: Inalis ko ang pasan sa kanyang balikat; napalaya ang kanyang mga kamay mula sa basket.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palayok” o “kaldero” sa halip na “basket”; bihira ang salitang Hebreo at hindi tiyak ang eksaktong tinutukoy nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: Inalis ko
  rationale: Ang Hiphil perfect na unang panauhang isahan ay nagpapahayag ng sanhi o aktibong pag-aalis; ang unang panauhan ay angkop sa pagsasalita ng Diyos sa konteksto.
- source_word: מִסֵּבֶל
  choice: ang pasan
  rationale: Ang סֵבֶל ay tumutukoy sa mabigat na dalahin o pasan. Likas itong itambal sa balikat sa Filipino.
- source_word: שִׁכְמוֹ
  choice: sa kanyang balikat
  rationale: 'Ang שׁכם ay literal na “balikat,” at pinanatili ang isahang anyo ng Hebreo. Isinaayos ang sintaks upang maging natural sa Filipino: ang pasan ang inalis sa balikat.'
- source_word: כַּפָּיו
  choice: ang kanyang mga kamay
  rationale: Bagaman maaaring literal na “mga palad,” mas natural ang “mga kamay” sa konteksto ng sapilitang paggawa.
- source_word: מִדּוּד
  choice: sa basket
  rationale: Bihira at di-tiyak ang eksaktong tinutukoy ng דּוּד. Ang “basket” ay umaangkop sa larawan ng mabigat na paggawa, ngunit inilalahad sa talababa ang ibang posibleng kahulugan.
- source_word: תַּעֲבֹרְנָה
  choice: ay napalaya
  rationale: Literal na may diwang “lumipas/umalis,” ngunit sa konteksto ang mga kamay ay hindi na kailangang humawak o gumawa gamit ang bagay na ito. Ang “napalaya” ay natural at malinaw na naghahatid ng resulta nang hindi nagpapahiwatig ng kamatayan.
