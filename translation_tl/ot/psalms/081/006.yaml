  source_fidelity: 'Tumpak ang unang sugnay: ang הֲסִירוֹתִי ay “Inalis ko,” at ang pasan ay inalis “sa kanyang balikat,” habang pinananatili ang isahang balikat. Ang “napalaya” ay isang ligtas at malinaw na pagpapahayag ng resulta ng תַּעֲבֹרְנָה sa konteksto ng paglaya mula sa mabigat na paggawa. Gayunman, ang pang-ukol na “sa basket” ay maaaring mangahulugang napalaya ang mga kamay habang nasa loob o nasa basket; kailangan ang “mula sa basket” upang maipakita ang מִן (‘mula sa’).'
