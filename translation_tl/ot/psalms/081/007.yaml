  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: tl
  text: Sa kagipitan ay tumawag ka, at iniligtas kita; sinagot kita sa lihim na dako ng kulog[a]; sinubok kita sa tubig ng Meriba[b]. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa lihim na dako ng kulog.” Malamang na inilalarawan nito ang natatagong presensiya ng Diyos sa gitna ng unos.
    reason: lexical_alternative
  - marker: b
    text: Ang Meriba ay nagpapaalala sa mga pangyayari sa ilang na may alitan tungkol sa tubig (Exodo 17:1–7; Mga Bilang 20:1–13). Sa talatang ito, sinabi ng Diyos na sinubok niya ang Israel sa Meriba.
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: Sa kagipitan
  rationale: Likas at marangal na salin ng kalagayang ipinahihiwatig ng צָרָה—matinding hirap o panganib—nang hindi tinutukoy kung anong uri ng kagipitan.
- source_word: קָרָאתָ
  choice: tumawag ka
  rationale: Pinananatili ang payak na pandiwa at ang di-binanggit na layon gaya sa Hebreo; sa konteksto, ito ay pagtawag para humingi ng tulong.
- source_word: וָאֲחַלְּצֶךָּ
  choice: at iniligtas kita
  rationale: Ang Hiphil ng חלץ ay nangangahulugang hanguin o iligtas; malinaw at natural sa modernong Tagalog ang “iniligtas.”
- source_word: אֶעֶנְךָ
  choice: sinagot kita
  rationale: Tuwirang katumbas ng karaniwang kahulugan ng ענה bilang pagsagot o pagtugon.
- source_word: בְּסֵתֶר רַעַם
  choice: sa lihim na dako ng kulog
  rationale: Pinananatili ang preposisyong בְּ at ang mahiwagang larawan ng natatagong presensiya ng Diyos sa unos, sa halip na tahasang gawing “mula sa” o tukuying Sinai.
- source_word: אֶבְחָנְךָ
  choice: sinubok kita
  rationale: Tumpak na ipinapahayag ang בחן bilang pagsubok o pagsusuri nang hindi ipinapalagay na parusa lamang ang layunin.
- source_word: עַל מֵי מְרִיבָה
  choice: sa tubig ng Meriba
  rationale: Natural na lokatibong salin sa Tagalog at pinananatili ang Meriba bilang pangalang pantangi.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa transliterasyon sapagkat hindi tiyak ang eksaktong gamit at kahulugan ng liturhikong tanda.
theological_decisions:
- issue: Ang tinutukoy ng “lihim na dako ng kulog”
  choice: Pinanatili ang larawang Hebreo bilang “sa lihim na dako ng kulog.”
  alternative: “Mula sa lihim na dako ng kulog,” o tahasang pag-uugnay nito sa Sinai.
  rationale: Maaaring tumukoy ang larawan sa pagpapakita ng Diyos sa bagyo, sa Sinai, o sa kanyang natatagong presensiya. Hindi nilulutas ng salin ang tunay na kalabuan.
- issue: Kalikasan ng pagsubok sa Meriba
  choice: “Sinubok kita,” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Ipakahulugan ang pagsubok bilang parusa lamang.
  rationale: Maaaring saklawin ng בחן ang pagsusuri at pagpapatunay; hindi hinihingi ng Hebreo na ituring itong eksklusibong maparusang kilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matalinghagang “lihim na dako ng kulog,” ang pangalang Meriba, at ang liturhikong “Selah” upang hindi mawala ang ambiguwidad at anyo ng Hebreo.
