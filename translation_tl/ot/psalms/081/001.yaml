  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: tl
  text: 'Umawit kayo nang may galak sa Diyos na ating lakas;

    sumigaw kayo nang malakas[a] sa Diyos ni Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magbunyi kayo sa Diyos ni Jacob.” Ang pandiwa ay maaaring tumukoy sa isang malakas na sigaw ng pagbubunyi o pagkilala, na maaari ring maging gaya ng tunog ng trumpeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Umawit kayo nang may galak
  rationale: Ang maramihang pautos mula sa רנן ay tumutukoy sa masigla at nagagalak na tinig ng papuri. Likas sa modernong Tagalog ang “umawit nang may galak” at pinananatili nito ang musikal at masayang diwa.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Ang ל ay nagmamarka sa Diyos bilang pinatutungkulan ng papuri. Bagaman anyong maramihan ang אֱלֹהִים, malinaw sa konteksto at sa katumbas na linyang “Diyos ni Jacob” na iisang Diyos ang tinutukoy.
- source_word: עוּזֵּנוּ
  choice: na ating lakas
  rationale: Ang עֹז/עוֹז ay nangangahulugang lakas o kapangyarihan. Ang pariralang “Diyos na ating lakas” ay tuwiran at natural, at pinananatili ang pagkakakilanlan sa Diyos bilang lakas ng bayan.
- source_word: הָרִיעוּ
  choice: sumigaw kayo nang malakas
  rationale: Ang maramihang pautos na Hiphil mula sa רוע/ריע ay tumutukoy sa malakas na sigaw ng pagbubunyi o pagkilala. Ang salin ay malinaw sa karaniwang mambabasa, habang inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: לֵאלֹהֵי
  choice: sa Diyos ni
  rationale: Ang anyong construct na אֱלֹהֵי kasama ng ל ay likas na isinasalin sa Tagalog bilang “sa Diyos ni” bago ang pangalang Jacob.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinanatili ang kinaugaliang transliterasyon ng pangalang pantangi sa modernong saling Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa magkatulad na mga linya
  choice: Diyos / Diyos ni Jacob
  alternative: mga diyos
  rationale: Bagaman maaaring magmukhang maramihan sa anyo ang אֱלֹהִים, ang Diyos ng Israel ang nag-iisang tinutukoy sa awit. Pinagtitibay ito ng katumbas na pariralang “Diyos ni Jacob.”
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkatulad na pautos at ang patulang pagkakapantay ng mga linya, nang hindi dinaragdagan ang tekstong Hebreo ng denominasyonal na pagpapakahulugan.
