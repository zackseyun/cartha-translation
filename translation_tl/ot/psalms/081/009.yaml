  text: לֹֽא יִהְיֶ֣ה בְ֭/ךָ אֵ֣ל זָ֑ר וְ/לֹ֥א תִ֝שְׁתַּחֲוֶ֗ה לְ/אֵ֣ל נֵכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: tl
  text: Huwag kayong magkaroon ng banyagang diyos sa gitna ninyo, at huwag kayong yumukod sa isang dayuhang diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang magkalapit na salita ang ginamit sa Hebreo para sa diyos na wala sa itinakdang pagsamba ng Israel: “banyaga” at “dayuhan.” Ang pagkakaibang ito ay bahagi ng paralelismong patula.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה בְךָ
  choice: Huwag kayong magkaroon ... sa gitna ninyo
  rationale: Ang negatibong imperfect sa konteksto ng tipan ay utos na nagbabawal, hindi hula. Ginamit ang maramihang “kayo/ninyo” upang malinaw sa likas na Filipino na ang Israel bilang buong pamayanan ang kinakausap.
- source_word: אֵל זָר
  choice: banyagang diyos
  rationale: Ang אֵל ay tumutukoy sa isang diyos na sinasamba, at ang זָר ay naglalarawan dito bilang nasa labas ng itinakdang pagsamba ng Israel.
- source_word: תִשְׁתַּחֲוֶה
  choice: yumukod
  rationale: Pinananatili nito ang kongkretong larawan ng pagpapatirapa o pagyukod bilang gawa ng pagsamba, nang hindi ginagawang mas abstrakto ang pahayag.
- source_word: לְאֵל נֵכָר
  choice: sa isang dayuhang diyos
  rationale: Likas sa Filipino ang “yumukod sa.” Ang “dayuhan” ay malapit na kasingkahulugan ng “banyaga” at pinananatili ang bahagyang pagkakaiba ng mga salitang Hebreo sa magkatugmang mga linya.
theological_decisions:
- issue: Ang kausap ay isahan sa gramatikang Hebreo ngunit tumutukoy sa Israel bilang isang buong bayan
  choice: Gamitin ang maramihang “kayo/ninyo” sa Filipino upang ihayag ang kolektibong kausap
  alternative: Gamitin ang isahang “ka/mo” upang tumbasan nang pormal ang bilang sa Hebreo
  rationale: Sa modernong Filipino, ang isahang anyo ay madaling maunawaan bilang utos lamang sa isang indibidwal. Ang maramihang anyo ay naghahatid ng kolektibong diwa ng Hebreo nang hindi itinatanggi na ang Israel ay kinakausap bilang isang kabuuan.
- issue: Ugnayan ng זָר at נֵכָר
  choice: Panatilihin ang magkalapit ngunit magkaibang salitang “banyaga” at “dayuhan”
  alternative: Isalin kapwa bilang “banyaga”
  rationale: Hindi ipinahihiwatig ng teksto na dalawang natatanging uri ng diyos ang tinutukoy; ang pagkakaiba ay bahagi ng paralelismong patula at dapat manatiling kapansin-pansin.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “yumukod” upang mapanatili ang pisikal na larawan ng Hebreo, at ang “sa gitna ninyo” upang ihayag ang pagbabawal sa loob ng pamayanan.
