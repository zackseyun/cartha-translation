source:
  edition: WLC
  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: tl
  text: Sapagkat ito ay tuntunin para sa Israel, isang utos ng Diyos ni Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang dahilan ng naunang panawagang magdiwang at tumugtog.
- source_word: חֹק
  choice: tuntunin
  rationale: Tumutukoy ito sa isang itinakdang alituntunin na may awtoridad; natural at marangal sa makabagong Filipino ang “tuntunin.”
- source_word: לְיִשְׂרָאֵל
  choice: para sa Israel
  rationale: 'Ipinahihiwatig ng ל ang kaugnayan o saklaw: ang tuntunin ay itinakda para sa Israel.'
- source_word: הוּא
  choice: ito ay
  rationale: Bumabalik ang panghalip sa ipinag-uutos na pagdiriwang sa konteksto.
- source_word: מִשְׁפָּט
  choice: utos
  rationale: Sa legal at tipanang paralelismo nito sa חֹק, tumutukoy ito sa isang may-awtoridad na itinakda, hindi sa hatol na nagpaparusa.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: ng Diyos ni Jacob
  rationale: 'Natural nitong ipinahahayag sa Filipino ang kaugnayang pinagmulan o awtoridad: ang utos ay mula sa Diyos ni Jacob.'
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Ugnayan ng חֹק at מִשְׁפָּט
  choice: Panatilihing magkahiwalay bilang “tuntunin” at “utos.”
  alternative: Pagsamahin ang dalawa sa iisang pangkalahatang salitang “kautusan.”
  rationale: Gumagamit ang Hebreo ng dalawang magkaugnay ngunit magkaibang legal na salita sa paralelismong patula; pinananatili ng salin ang dalawang termino nang hindi naggigiit ng labis na teknikal na pagkakaiba.
- issue: Diwa ng ל sa לֵאלֹהֵי יַעֲקֹב
  choice: 'Isalin bilang kaugnayang pinagmulan o awtoridad: “ng Diyos ni Jacob.”'
  alternative: “para sa Diyos ni Jacob”
  rationale: Maaaring pormal na mangahulugan ang ל ng “para sa,” ngunit dito ay mas malamang na ipinahahayag nito na ang utos ay nagmula sa o itinakda ng Diyos ni Jacob. Hindi kailangan ng talababa sa Filipino dahil madaling mapagkamalang benepisyaryo ang Diyos sa alternatibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling paralelismong legal ng Hebreo at iniwasan ang labis na teknikal o denominasyonal na pananalita.
