  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: tl
  text: Ang mga napopoot kay Yahweh ay magpapanggap na nagpapasakop sa kanya[a], at ang kanilang panahon ay magiging magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapipilitang yumukod sa kanya,” “magkukunwaring sumusunod sa kanya,” o “mangingimi sa harap niya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang kanilang panahon magpakailanman.” Maaaring tumukoy ito sa kanilang takdang panahon, kapalaran, o parusang magpapatuloy nang walang takdang wakas.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: ang mga napopoot
  rationale: Ang participle ay ginagamit bilang pangngalan para sa isang pangkat. Likas sa modernong Tagalog ang “mga napopoot” at naipahihiwatig nito ang patuloy na saloobin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalan sa anyong Yahweh.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: magkukunwaring nagpapasakop sa kanya
  rationale: Sa piel na may ל, ang כחשׁ ay maaaring tumukoy sa pakunwaring pagsuko o napilitang pagpapasakop. Malinaw na ipinahahayag ng salin ang hindi taos-pusong pagsunod nang hindi ito ginagawang tunay na pananampalataya o pagtalima.
- source_word: וִיהִי
  choice: at magiging
  rationale: Inihahatid nito ang modal o hinaharap na diwa ng anyong pandiwa sa natural na Tagalog.
- source_word: עִתָּם
  choice: ang kanilang panahon
  rationale: Ang pangunahing kahulugan ng עֵת ay “panahon” o “takdang panahon.” Pinananatili ng salin ang kaiklian at kalabuan ng Hebreo sa halip na tukuyin agad ito bilang kapalaran o parusa.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, maikli, at marangal na katumbas sa Tagalog para sa diwang walang hanggan o nagpapatuloy nang walang takdang wakas.
theological_decisions:
- issue: Kahulugan ng huling pariralang וִיהִי עִתָּם לְעוֹלָם
  choice: magiging magpakailanman ang kanilang panahon
  alternative: mananatili magpakailanman ang kanilang kapalaran o parusa
  rationale: Maikli at malabo ang Hebreo. Bagaman maaaring magpahiwatig ang konteksto ng patuloy na kapalaran o parusa ng mga kaaway, “panahon” lamang ang tahasang sinasabi ng pangngalan. Pinananatili sa pangunahing teksto ang teolohikal na tensiyon at inilalagay sa talababa ang mas tiyak na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magkukunwaring nagpapasakop” upang maipakita ang sapilitan at hindi taos-pusong pagsuko; pinanatiling literal at sadyang malabo ang “kanilang panahon” ayon sa Hebreo.
