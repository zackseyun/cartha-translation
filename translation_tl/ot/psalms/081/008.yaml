  yaml_path: translation/ot/psalms/081/008.yaml
  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: tl
  text: Makinig ka, bayan ko, at magpapatotoo ako laban sa iyo[a]; Israel, kung makikinig ka sana sa akin![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at babalaan kita” o “at magpapatotoo ako sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring ipahayag nang mas tahasan bilang isang hangarin: “Makinig ka sana sa akin!”'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Makinig ka
  rationale: Tuwirang pautos sa ikalawang panauhang isahan. Ang “makinig” ay likas sa modernong Tagalog at naiuugnay sa pag-uulit ng ugat na שׁמע sa hulihan ng talata.
- source_word: עַמִּי
  choice: bayan ko
  rationale: Pinananatili ang relasyonal at tipanang diwa ng tawag ng Diyos sa Israel; mas natural at marangal sa kontekstong patula kaysa “nasyon ko.”
- source_word: וְאָעִידָה בָּךְ
  choice: at magpapatotoo ako laban sa iyo
  rationale: Ang Hiphil ng עוד kasama ng בְּ ay maaaring tumukoy sa taimtim na pagbababala o pagpapatotoo, at sa kontekstong ito ay may posibleng hudisyal na diwang laban sa kinakausap. Inilalagay sa talababa ang tunay na leksikal na mga alternatibo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginagamit bilang tuwirang panawag; sapat na sa natural na Tagalog ang pangalan nang hindi kailangang idagdag ang “O.”
- source_word: אִם תִּשְׁמַע לִי
  choice: kung makikinig ka sana sa akin
  rationale: Pinananatili ng “kung” ang anyo ng אִם, habang ipinahahayag ng “sana” ang maaaring mapanabik o mapagnasang puwersa nito. Ang “makinig sa akin” ay likas na salin ng שׁמע na may ל at nagpapahiwatig ng pagbibigay-pansin o pagtalima.
theological_decisions:
- issue: Puwersa ng אִם תִּשְׁמַע לִי
  choice: kung makikinig ka sana sa akin!
  alternative: makinig ka sana sa akin! / kung makikinig ka sa akin
  rationale: Maaaring magsaad ang אִם dito ng kondisyon o ng masidhing hangarin. Pinananatili ng salin ang kondisyunal na anyo at kasabay na ipinadarama ang mapagnasang pakiusap, nang hindi ganap na nilulutas ang tensiyon.
- issue: Puwersa ng וְאָעִידָה בָּךְ
  choice: magpapatotoo ako laban sa iyo
  alternative: babalaan kita / magpapatotoo ako sa iyo
  rationale: May hudisyal na posibilidad ang pandiwa at pang-ukol sa konteksto ng banal na pagsaway, ngunit hindi iisa lamang ang posibleng kahulugan; kaya hayag na pinananatili sa talababa ang ibang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw, na may bahagyang patulang himig. Pinanatili ang isahang tuwirang panawag sa buong talata at iniwasang gawing sobrang pormal o makaluma ang pananalita.
