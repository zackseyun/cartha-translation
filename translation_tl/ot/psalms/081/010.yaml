  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: tl
  text: Ako si Yahweh, ang iyong Diyos, na nag-ahon sa iyo mula sa lupain ng Ehipto. Ibuka mo nang maluwang ang iyong bibig, at pupunuin ko iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ibuka mo nang maluwang ang iyong bibig upang punuin ko iyon.”'
    reason: Pinananatili ang posibleng pagbasa sa וַאֲמַלְאֵהוּ bilang layunin, hindi lamang bilang kasunod na pangako o bunga.
lexical_decisions:
- source_word: אָנֹכִי יְהוָה אֱלֹהֶיךָ
  choice: Ako si Yahweh, ang iyong Diyos
  rationale: Pinananatili ng “Ako” ang diin ng malayang panghalip na אָנֹכִי, at natural sa Tagalog ang “Ako si Yahweh” sa sugnay na walang tahasang pandiwa sa Hebreo. Isinalin ang banal na pangalang יְהוָה bilang “Yahweh,” hindi bilang isang titulo.
- source_word: הַמַּעַלְךָ
  choice: na nag-ahon sa iyo
  rationale: Ang Hiphil na anyo ng עלה ay tumutukoy sa pagkilos ng Diyos na paahunin ang Israel mula sa Ehipto. Ang “nag-ahon” ay nagpapanatili sa larawang paitaas at natural sa makabagong Tagalog.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwirang inilalarawan ang pinagmulan ng pag-ahon at pinananatili ang karaniwang pormula ng Exodo.
- source_word: הַרְחֶב פִּיךָ
  choice: Ibuka mo nang maluwang ang iyong bibig
  rationale: Ang Hiphil imperative ng רחב kasama ng “bibig” ay idiomatikong nangangahulugang ibuka ito nang maluwang. Pinananatili ang isahang kausap.
- source_word: וַאֲמַלְאֵהוּ
  choice: at pupunuin ko iyon
  rationale: Ang hulaping panlalaking isahan ay tumutukoy pabalik sa “bibig.” Ang panghinaharap ay natural na naghahayag ng ipinangakong bunga ng pagsunod sa utos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng utos at ng pagpuno ng Diyos
  choice: at pupunuin ko iyon
  alternative: upang punuin ko iyon
  rationale: Maaaring ipahiwatig ng וַ ang kasunod na pangako o ang layunin ng utos. Ginamit sa pangunahing teksto ang natural na pangakong bunga, habang itinala sa talababa ang posibleng pagbasa bilang layunin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nag-ahon” upang mapanatili ang larawang kaugnay ng Exodo, at “ibuka mo nang maluwang” bilang natural ngunit malapit na katumbas ng utos sa Hebreo.
