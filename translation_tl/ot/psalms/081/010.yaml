  naturalness: Natural, malinaw, at marangal ang makabagong Tagalog. Ang “nag-ahon” ay bahagyang mas matingkad kaysa sa karaniwang “naglabas,” ngunit idiomatiko ito at mahusay na pinananatili ang imaheng paitaas ng pandiwang Hebreo.
  terminology: Wastong pinanatili ang “Yahweh” bilang banal na pangalan at “Diyos” para sa אֱלֹהֶיךָ. Ang “lupain ng Ehipto” at “ibuka ... nang maluwang” ay angkop sa rehistro at kahulugan ng talata.
