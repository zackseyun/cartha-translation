  yaml_path: translation/ot/psalms/081/013.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: tl
  text: 'Sana''y makinig sa akin ang aking bayan,

    at lumakad ang Israel sa aking mga daan![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kung makikinig lamang sana sa akin ang aking bayan, kung lalakad lamang sana ang Israel sa aking mga daan!”'
    reason: alternative_reading
lexical_decisions:
- source_word: לוּ
  choice: Sana'y
  rationale: Ipinahahayag dito ang marubdob na paghahangad o panaghoy, hindi lamang isang payak na kondisyon. Likas sa modernong Tagalog ang “Sana'y” para sa ganitong optatibong diwa.
- source_word: עַמִּי
  choice: ang aking bayan
  rationale: Tuwirang pinananatili ang pagmamay-ari at ang ugnayang nakapaloob sa “aking bayan.”
- source_word: שֹׁמֵעַ לִי
  choice: makinig sa akin
  rationale: Ang pandiwang שׁמע na may ל ay tumutukoy sa pakikinig na may pagbibigay-pansin at pagsunod, hindi lamang sa pisikal na pagkarinig.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang nakaugaliang anyo ng pangalang pantangi sa Tagalog.
- source_word: בִּדְרָכַי
  choice: sa aking mga daan
  rationale: Pinananatili ang talinghaga ng mga “daan” bilang paraan o takbo ng pamumuhay.
- source_word: יְהַלֵּכוּ
  choice: lumakad
  rationale: Pinananatili ang talinghaga ng paglakad para sa patuloy na asal o pamumuhay; saklaw ng “Sana'y” ang optatibong diwa ng dalawang sugnay.
theological_decisions:
- issue: Paghahangad na optatibo o pangungusap na may kondisyon
  choice: 'Isinalin bilang marubdob na paghahangad: “Sana''y …”'
  alternative: “Kung makikinig lamang sa akin ang aking bayan, kung lalakad ang Israel sa aking mga daan.”
  rationale: Sa konteksto, ang לוּ ay pinakamainam unawain bilang panaghoy o paghahangad ng Diyos tungkol sa pagsunod ng Israel. Gayunman, tunay na posible ang kondisyunal na himig kaya inilagay ito sa talababa sa halip na alisin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pinaikling “Sana'y” para sa likas at madamdaming pagpapahayag, at pinanatili ang biblikal na talinghaga ng paglakad sa mga daan.
