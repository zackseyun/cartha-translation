translation:
  language: tl
  text: Kaya hinayaan ko silang mamuhay ayon sa katigasan ng kanilang puso[a]; lumakad sila ayon sa sarili nilang mga balak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hinayaan ko siya,” na ang isahang panghalip ay tumutukoy sa Israel bilang isang buong sambayanan. Maaari ring isalin ang “katigasan” bilang “pagmamatigas” o “mapilit na sariling kalooban.”
    reason: lexical_alternative
  - marker: b
    text: O “lumakad sila ayon sa sarili nilang mga pasiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: Kaya hinayaan ko sila
  rationale: Ang Hiphil ng שלח na may panghalip na 3ms ay idyomatikong nagpapahayag ng pagpapabaya o pagpapakawala, hindi lamang literal na pagsusugo. Ang isahang hulapi ay tumutukoy sa Israel bilang isang sambayanan; ginamit ang maramihang “sila” sa Filipino upang maging natural at upang umayon sa kasunod na maramihang mga anyo, habang itinatala sa talababa ang anyong Hebreo.
- source_word: בִּשְׁרִירוּת לִבָּם
  choice: sundin ang katigasan ng kanilang puso
  rationale: Ang שְׁרִירוּת ay katigasan, pagmamatigas, o mapilit na sariling kalooban. Ang “katigasan ng kanilang puso” ay malinaw at marangal na Filipino; ipinahihiwatig ng “hinayaang sundin” na ipinagkatiwala sila sa sarili nilang matigas na disposisyon.
- source_word: יֵלְכוּ
  choice: namuhay sila
  rationale: Bagaman literal na “lumakad,” madalas na tumutukoy ang הלך sa asal o paraan ng pamumuhay. Mas natural sa modernong Filipino ang “namuhay” sa etikal na kontekstong ito.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: ayon sa sarili nilang mga balak
  rationale: Ang מוֹעֵצָה ay maaaring tumukoy sa payo, pasiya, plano, o balak. Ang “ayon sa sarili nilang mga balak” ay natural at pinananatili ang pagsalungat sa kalooban ng Diyos.
theological_decisions:
- issue: Paglipat mula sa isahang hulapi tungo sa maramihang pagtukoy sa Israel
  choice: Gumamit ng maramihang “sila” sa pangunahing teksto at ipaliwanag ang kolektibong isahan sa talababa
  alternative: Panatilihin ang “siya” sa unang sugnay at lumipat sa “sila” sa ikalawa
  rationale: Ang Hebreo ay may 3ms na hulapi na tumutukoy sa Israel bilang kolektibong bayan, pagkatapos ay gumagamit ng maramihang pandiwa at panghalip. Sa Filipino, ang literal na paglipat ay madaling mapagkamalang pagbabago ng tinutukoy; kaya pinananatili ang ebidensiyang pormal sa talababa nang hindi nilalabo ang teksto.
- issue: Ang pagkilos ng Diyos bilang paghatol
  choice: “hinayaan ko silang sundin”
  alternative: “ibinigay ko sila sa” o “pinabayaan ko sila sa”
  rationale: Ipinakikita ng konteksto na bilang hatol ay hinayaan ng Diyos ang bayan sa sarili nilang pagmamatigas. Pinananatili ng salin ang bigat ng banal na pagkilos nang hindi nagdaragdag ng sistematikong doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang lubhang literal na “lumakad sa kanilang mga payo,” na hindi natural sa kasalukuyang gamit, ngunit pinanatili ang etikal na kahulugan at ang diin sa sariling balak ng bayan.
