  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: tl
  text: Simulan ninyo ang awit[a] at patunugin ang tamburin[b]; tugtugin ang kaaya-ayang lira kasama ng alpa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Itaas ang himig” o “Simulan ang isang awit.” Sa kontekstong ito, maaari rin itong idiomatikong unawain bilang panawagang umawit.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa instrumentong de-pukpok, malamang isang uri ng frame drum; tradisyonal itong tinatawag na “timbrel.”
    reason: cultural_note
  - marker: c
    text: Hindi tiyak ang eksaktong pagkakaiba ng mga sinaunang instrumentong de-kuwerdas na tinawag ditong “lira” (כִּנּוֹר) at “alpa” (נָבֶל). Iminumungkahi rin ang ibang katawagang gaya ng “alpa” at “lute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Simulan
  rationale: Ang maramihang pautos ng נשׂא ay literal na ‘itaas/buhatin,’ ngunit sa pagsama sa awit ay tumutukoy sa pagsisimula o pag-angat ng awitan. Natural sa makabagong Filipino ang ‘simulan’ habang ipinapaliwanag sa talababa ang literal na larawan.
- source_word: זִמְרָה
  choice: ang awitan
  rationale: Tumutukoy sa awit o musikang papuri. Ang ‘awitan’ ay natural sa konteksto ng sama-samang panawagan at hindi ito nililimitahan sa isang partikular na uri ng salmo.
- source_word: וּתְנוּ
  choice: patunugin
  rationale: Literal na ‘ibigay,’ ngunit kapag kasama ang תֹף, ang diwa ay lumikha ng tunog mula sa instrumento. Ang ‘patunugin’ ay malinaw at hindi labis na nagtatakda kung paano ito tinutugtog.
- source_word: תֹף
  choice: tamburin
  rationale: Isang instrumentong de-pukpok na malamang ay frame drum o tambourine-type instrument. Ang ‘tamburin’ ang malinaw at karaniwang makabagong katumbas; iniiwasan ang arkaikong ‘timbrel.’
- source_word: כִּנּוֹר
  choice: lira
  rationale: Sinaunang instrumentong de-kuwerdas na karaniwang itinuturing na lyre-like. Ang ‘lira’ ang kinikilalang katumbas sa Filipino, bagaman hindi tiyak ang eksaktong anyo nito.
- source_word: נָעִים
  choice: kaaya-ayang
  rationale: Nangangahulugang kaaya-aya o nakalulugod. Pinananatili ng ‘kaaya-ayang’ ang malawak na diwa nang hindi tiyakang nagpapasyang ang tinutukoy ay tunog lamang.
- source_word: עִם
  choice: kasabay ng
  rationale: Ipinahihiwatig ang pagsabay o pag-akompaña ng dalawang instrumentong de-kuwerdas; mas natural dito kaysa sa payak na ‘kasama ng.’
- source_word: נָבֶל
  choice: alpa
  rationale: Isang instrumentong de-kuwerdas na naiiba sa כִּנּוֹר. Ang ‘alpa’ ay natural na naiibang katawagan, habang kinikilala sa talababa ang kawalang-katiyakan sa eksaktong klasipikasyon.
