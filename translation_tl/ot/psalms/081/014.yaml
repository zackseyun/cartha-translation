translation:
  language: tl
  text: Agad ko sanang susupilin ang kanilang mga kaaway[a], at ibabaling ko sana ang aking kamay laban sa kanilang mga kalaban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Sa maikling panahon ay susupilin ko sana ang kanilang mga kaaway.” Ang Hebreong כִּמְעַט ay maaaring tumukoy sa madaling panahon o, bagaman hindi gaanong malamang dito, sa “halos.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ibabalik ko ang aking kamay sa kanilang mga kalaban,” isang pahayag tungkol sa pagbaling ng kapangyarihan laban sa kanila bilang paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Agad
  rationale: Sa konteksto, ipinahihiwatig nito ang maikling pagitan ng panahon o pagiging nalalapit ng pagkilos. Natural sa modernong Tagalog ang “agad,” habang inilalagay sa talababa ang tunay na alternatibong “sa maikling panahon” at ang di-gaanong malamang na “halos.”
- source_word: אוֹיְבֵיהֶם
  choice: ang kanilang mga kaaway
  rationale: Karaniwan at malinaw na katumbas ng salitang tumutukoy sa mga kaaway sa konteksto ng tunggalian.
- source_word: אַכְנִיעַ
  choice: susupilin
  rationale: Ipinahahayag ng Hiphil ng כנע ang pagpapasuko o pagpapailalim. Ang “susupilin” ay nagsasaad ng paggapi nang hindi dinaragdagan ang teksto ng tiyak na paraan nito.
- source_word: צָרֵיהֶם
  choice: kanilang mga kalaban
  rationale: Pinananatili ng “mga kalaban” ang bahagyang pagkakaiba sa naunang “mga kaaway,” ngunit hindi pinalalabis ang posibleng diwa bilang “mga mang-aapi.”
- source_word: אָשִׁיב יָדִי
  choice: ibabaling ko ang aking kamay laban
  rationale: Pinananatili nito ang metapora ng pagbaling ng kamay at malinaw na ipinahihiwatig ang paggamit ng kapangyarihan sa paghatol laban sa mga kalaban.
theological_decisions:
- issue: Kondisyonal na modalidad ng pagkilos ng Diyos
  choice: “Agad ko sanang susupilin … at ibabaling ko …”
  alternative: “Agad kong susupilin … at ibabaling ko …”
  rationale: Bagaman maaaring basahin bilang payak na hinaharap ang mga pandiwang Hebreo, inilalarawan ng naunang konteksto ang gagawin sana ng Diyos kung nakinig ang Israel. Ipinakikita ng “sana” ang kondisyong ito nang hindi ginagawang tiyak na naganap na ang pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng “kamay” at ang bahagyang pagkakaiba ng “mga kaaway” at “mga kalaban.” Ang ayos ng “sana” ay nagpapahayag ng kondisyong nakabatay sa naunang talata nang hindi nagiging mabigat o lipas ang pananalita.
