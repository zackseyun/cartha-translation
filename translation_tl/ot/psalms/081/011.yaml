translation:
  language: tl
  text: 'Ngunit hindi nakinig ang aking bayan sa aking tinig,

    at hindi sumang-ayon sa akin ang Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ayaw sumunod sa akin ang Israel” o “at tinanggihan ako ng Israel.” Ang pandiwang Hebreo ay tumutukoy sa pagkukusa o pagsang-ayon at maaari ring magpahiwatig ng pagtanggi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Ngunit hindi
  rationale: Ipinahahayag ng pangatnig at pagsalungat ang kaibahan sa naunang panawagan at pangako ng Diyos; likas sa Filipino ang “Ngunit hindi.”
- source_word: שָׁמַע
  choice: nakinig
  rationale: Sa pariralang “sa aking tinig,” ang pandiwa ay tumutukoy sa pakikinig o pagbibigay-pansin. Pinananatili ng “nakinig” ang larawan ng tinig nang hindi agad nililimitahan ang kahulugan sa pagsunod.
- source_word: עַמִּי
  choice: ang aking bayan
  rationale: Tuwirang pinananatili ang unang panauhang panlapi at ang tipanang pagkakakilanlan ng Israel bilang bayan ng Diyos.
- source_word: לְקוֹלִי
  choice: sa aking tinig
  rationale: Ang קוֹל ay literal na “tinig.” Pinananatili nito ang personal at ugnayang lakas ng pahayag.
- source_word: וְיִשְׂרָאֵל
  choice: at ... ng Israel
  rationale: Pinananatili ang Israel bilang kaagapay na katawagan sa “aking bayan” at ang pangatnig na nag-uugnay sa dalawang hanay ng tula. Inayos lamang ang pagkakasunod ayon sa likas na sintaks ng Filipino.
- source_word: לֹא אָבָה לִי
  choice: ayaw pumayag sa akin
  rationale: Ang אָבָה ay tumutukoy sa pagkukusa, pagnanais, o pagsang-ayon. Ang “ayaw pumayag sa akin” ay natural sa Filipino at pinananatili ang pagiging bahagyang eliptiko ng לִי, sa halip na tahasang idagdag ang “sumunod,” na wala sa anyong Hebreo.
theological_decisions:
- issue: Ang tipanang pagkakakilanlan ng Israel bilang bayan ng Diyos
  choice: Panatilihing magkahiwalay ngunit magkatulad sa tula ang “aking bayan” at “Israel.”
  alternative: “Ang aking bayang Israel ay hindi nakinig sa aking tinig.”
  rationale: Dalawang magkatugmang katawagan ang nasa Hebreo. Ang pagpapanatili sa dalawang hanay ay nag-iingat sa estruktura ng tula at sa tipanang diin.
- issue: Ugnayan ng kawalan ng pagkukusa at pagsunod
  choice: Isalin ang ikalawang hanay bilang “ayaw pumayag sa akin.”
  alternative: “ayaw sumunod sa akin” o “tinanggihan ako.”
  rationale: Pinananatili nito ang leksikal na diwa ng pagkukusa o pagsang-ayon at ang elipsis ng Hebreo, nang hindi tahasang ginagawang “pagsunod” o “pagtanggi” lamang ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עַם at “tinig” upang mapanatili ang personal na larawan ng Hebreo. Ang pagkakahati sa dalawang linya ay nagpapanatili sa paralelismo ng tula.
