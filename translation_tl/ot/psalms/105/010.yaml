base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: tl
  text: 'Pinagtibay[a] niya iyon kay Jacob bilang isang tuntunin,

    kay Israel bilang isang tipang panghabang-panahon.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Itinatag.” Ang pandiwang Hebreo ay maaaring mangahulugang pinatayo o pinanatiling matatag ang isang bagay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “walang-hanggang tipan” o “tipang mananatili magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Pinagtibay niya iyon
  rationale: Ang Hiphil ng עמד ay may diwang “patayuing matatag,” kaya sa konteksto ng tipan ay likas itong isaling “pinagtibay.” Pinananatili ng “iyon” ang pagtukoy sa naunang pangako, panunumpa, o tipan nang hindi labis na nililinaw ang sadyang malawak na reperensiya.
- source_word: לְיַעֲקֹב
  choice: kay Jacob
  rationale: Ipinahihiwatig ng לְ ang pinag-uukulan; ang “kay Jacob” ang tuwiran at likas na katumbas sa Filipino.
- source_word: לְחֹק
  choice: bilang isang tuntunin
  rationale: Ang חֹק ay isang itinakda o ipinirming kautusan. Ang “tuntunin” ay makabago at madaling maunawaan habang taglay pa rin ang legal at tipanang diwa.
- source_word: לְיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili nito ang paralelismo sa “kay Jacob.” Ginamit ang “sa” upang maging natural ang pariralang Filipino sa ikalawang taludtod.
- source_word: בְּרִית עוֹלָם
  choice: bilang isang tipang panghabang-panahon
  rationale: Ang “tipan” ang pamantayang katumbas ng בְּרִית. Ang “panghabang-panahon” ay natural na nagpapahayag ng matagal, nagpapatuloy, o walang-taning na bisa ng עוֹלָם nang sapilitang lutasin kung ito ay dapat unawaing metapisikal na walang hanggan.
theological_decisions:
- issue: Tinutukoy ng pambabaeng hulapi sa וַיַּעֲמִידֶהָ
  choice: Isinalin bilang “iyon,” na tumutukoy sa naunang tipanang pangako o panunumpa.
  alternative: Tukuyin ito nang tahasan bilang “pangako,” “panunumpa,” o “tipan.”
  rationale: Binabanggit sa konteksto ang tipan, ipinangakong salita, at panunumpa ng Diyos. Pinananatili ng “iyon” ang anaporikong pagtukoy at ang tunay na kalabuan ng teksto.
- issue: Saklaw ng עוֹלָם sa pariralang בְּרִית עוֹלָם
  choice: tipang panghabang-panahon
  alternative: walang-hanggang tipan; tipang mananatili magpakailanman
  rationale: Ang pangunahing salin ay marangal at likas sa Filipino, at naipahahayag ang nagpapatuloy o walang-taning na bisa nang hindi nagdaragdag ng isang partikular na sistematikong pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Napanatili ang makatang paralelismo ng “Jacob” at “Israel,” gayundin ang pormal na diwa ng batas at tipan, nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
