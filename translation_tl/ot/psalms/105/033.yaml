  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: tl
  text: 'Hinampas niya ang kanilang mga puno ng ubas at mga puno ng igos,

    at pinagbali-bali ang mga punongkahoy sa kanilang lupain.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga punongkahoy sa loob ng kanilang mga hangganan.”
    reason: Ang גְּבוּלָם ay maaaring tumukoy sa teritoryo o sa mga hangganan nito.
lexical_decisions:
- source_word: וַיַּךְ
  choice: Hinampas niya
  rationale: Ang נכה ay tumutukoy sa malakas na paghampas o pananakit. Ang “hinampas” ay tuwiran at natural sa modernong Tagalog, at hindi nito pinalalabo ang marahas na pagkilos.
- source_word: גַּפְנָם
  choice: ang kanilang mga ubasan
  rationale: Ang גֶּפֶן ay puno ng ubas o ubasan. Ginamit ang kolektibong “mga ubasan” upang natural na tukuyin ang mga halamang ubas na pag-aari nila.
- source_word: וּתְאֵנָתָם
  choice: at mga puno ng igos
  rationale: Ang תְּאֵנָה ay puno ng igos. Bagaman isahan ang anyo sa Hebreo, kolektibo ang gamit nito rito at katambal ng mga ubasan.
- source_word: וַיְשַׁבֵּר
  choice: at binali
  rationale: Ang Piel ng שׁבר ay nagpapahiwatig ng marahas at mapanirang pagbasag o pagbali. Para sa mga puno, mas natural at tiyak sa Tagalog ang “binali” kaysa “binasag.”
- source_word: עֵץ
  choice: ang mga punongkahoy
  rationale: Maaaring mangahulugan ang עֵץ ng puno o kahoy. Mga nakatayong puno ang tinutukoy sa konteksto, at natural sa Tagalog ang kolektibong maramihan.
- source_word: גְּבוּלָם
  choice: sa kanilang nasasakupan
  rationale: Ang גְּבוּל ay maaaring tumukoy sa hangganan o sa teritoryong saklaw nito. Ang “nasasakupan” ay natural at pinananatili ang diwang panteritoryo; inilalahad sa talababa ang mas literal na alternatibo tungkol sa mga hangganan.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng mga pandiwa
  choice: “niya,” na tumutukoy sa Diyos ayon sa konteksto
  alternative: Ulitin nang tahasan ang “Diyos” o “Panginoon”
  rationale: Pangatlong panauhang panlalaki ang mga pandiwa sa Hebreo at ipinagpapatuloy nila ang salaysay ng mga ginawa ng Diyos. Kailangan ng Tagalog ang panghalip upang maging malinaw, ngunit hindi na dinagdagan ng isang pangalang wala sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang magkatugmang kilos—paghampas at pagbali—at iniwasan ang mga salitang lipas o labis na teknikal.
