  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: tl
  text: Nagsalita siya, at dumating ang mga balang—di-mabilang na mga batang balang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Dumating ang mga balang, at ang di-mabilang na mga insektong maninila.” Ang salitang Hebreo na יֶלֶק ay tumutukoy sa insektong naninira ng pananim, malamang isang yugto o uri ng balang; sa ilang matatandang salin, isinalin itong “uod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Nagsalita siya
  rationale: Karaniwang nangangahulugang ‘magsabi/magsalita’ ang pandiwa. Pinananatili ng ‘Nagsalita siya’ ang diwang naganap ang salot sa salita ng Diyos nang hindi idinaragdag ang mas tiyak na kahulugang ‘nag-utos.’
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Isinasalaysay ng anyong ito ang pagdating ng salot; natural at tuwiran sa modernong Tagalog ang ‘dumating.’
- source_word: אַרְבֶּה
  choice: mga balang
  rationale: Bagaman isahan ang anyo sa Hebreo, ginagamit ito bilang pangngalang kolektibo. Malinaw na ipinahihiwatig ng ‘mga balang’ ang maramihang salot.
- source_word: יֶלֶק
  choice: mga batang balang
  rationale: Tumutukoy ang יֶלֶק sa insektong naninira ng pananim, malamang sa isang yugto o uri ng balang. Iniiwasan ng ‘mga batang balang’ ang mapanlinlang na ‘uod’ at ang sobrang teknikal na ‘larva ng balang,’ habang kinikilala sa talababa ang tunay na leksikal na kawalang-katiyakan.
- source_word: וְאֵין מִסְפָּר
  choice: di-mabilang
  rationale: Ang idyoma ay nagsasaad na napakarami nila upang mabilang. Maikli, natural, at patula sa Tagalog ang ‘di-mabilang.’
