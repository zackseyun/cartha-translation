  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: tl
  text: Magpasalamat kayo kay Yahweh[a]; manawagan kayo sa kanyang pangalan; ipaalam ninyo sa gitna ng mga bansa ang kanyang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Yahweh,” ang personal na pangalang isinusulat na יהוה; sa maraming salin, isinasalin itong “PANGINOON.”'
    reason: divine_name
lexical_decisions:
- source_word: הוֹדוּ
  choice: Magpasalamat kayo
  rationale: Ang Hiphil imperative plural ng ידה sa konteksto ng awit ay karaniwang panawagang magpasalamat o magpuri. Ang “magpasalamat” ay likas sa modernong Tagalog at angkop sa kasunod na pariralang tumutukoy kay Yahweh.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Minamarkahan ng ל ang pinatutungkulan ng pasasalamat. Ginamit ang “kay” dahil pangalan ang kasunod, at pinanatili ang pangalang Yahweh para sa יהוה.
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: tumawag kayo sa kanyang pangalan
  rationale: Ang קרא na may בְּשֵׁם ay maaaring mangahulugang tumawag o dumulog sa pangalan ng isang tao. Pinananatili ng salin ang idyoma at ang posibilidad na tumukoy ito sa panalangin o pagsamba.
- source_word: הוֹדִיעוּ
  choice: ipaalam ninyo
  rationale: Ang Hiphil imperative plural ng ידע ay literal na “pangyarihing malaman.” Ang “ipaalam ninyo” ay malinaw at natural na nagpapahayag ng causative na diwa.
- source_word: בָעַמִּים
  choice: sa mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa mga sambayanan o pangkat ng mga tao. Ang “sa mga bayan” ay natural at hindi nililimitahan ang kahulugan sa makabagong mga estadong politikal; sa konteksto ng pagpapahayag, saklaw nito ang ideyang ‘sa gitna ng’ o ‘sa piling ng.’
- source_word: עֲלִילוֹתָיו
  choice: ang kanyang mga ginawa
  rationale: Ang עֲלִילוֹת ay mga gawa o kilos, madalas mga kapansin-pansing gawa. Ang “mga ginawa” ay payak at tapat, at hindi nagdaragdag ng salitang “makapangyarihan” na wala namang tahasang katumbas sa salita.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulong “PANGINOON”; inilalagay ang paliwanag sa talababa para sa mga mambabasang sanay sa tradisyonal na anyo.
- issue: Kahulugan ng קִרְאוּ בִשְׁמוֹ
  choice: tumawag kayo sa kanyang pangalan
  alternative: ipahayag ninyo ang kanyang pangalan
  rationale: Maaaring magpahiwatig ang parirala ng pagtawag o pagdalangin kay Yahweh, bagaman maaari rin itong magtaglay ng diwang pampublikong pagpapahayag. Pinili ang mas tuwirang idyomatikong kahulugan nang hindi tahasang isinasara ang mas malawak na gamit nito.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang tatlong magkakatulad na pautos at ang maikli, patulang ayos ng talata. Ginamit ang “ninyo” sa ikatlong sugnay para sa natural na daloy, habang malinaw pa ring maramihan ang lahat ng pautos.
