base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: tl
  text: 'Ibinigay niya sa kanila ang mga lupain ng mga bansa,

    at minana nila ang pinaghirapan ng mga bayan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inangkin nila ang pagpapagal ng mga bayan” o “ang bunga ng pagpapagal ng mga bayan.” Ang salitang Hebreo ay maaaring tumukoy sa pagpapagal mismo o sa napala mula rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ibinigay niya
  rationale: Ang Qal wayyiqtol ng נתן ay tuwirang nagsasaad ng pagbibigay sa nakaraang salaysay. Hindi na isinama ang panimulang pang-ugnay upang maging likas sa modernong Tagalog.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Ang hulaping panghalip na ikatlong panauhang panlalaking maramihan ay tumutukoy sa di-tuwirang layon.
- source_word: אַרְצוֹת גּוֹיִם
  choice: ang mga lupain ng mga bansa
  rationale: Pinananatili ng “mga lupain” ang anyong maramihan ng אַרְצוֹת, at ang “mga bansa” ay angkop sa teritoryal at pampolitikang diwa ng גּוֹיִם.
- source_word: וַעֲמַל לְאֻמִּים
  choice: ang pinaghirapan ng mga bayan
  rationale: Ang עָמָל ay maaaring tumukoy sa pagpapagal mismo o sa nakamit sa pamamagitan nito. Likas na naipahihiwatig ng “pinaghirapan” sa Tagalog ang bagay na bunga ng paggawa habang nananatili ang kaugnayan nito sa pagpapagal. Ginamit ang “mga bayan” para sa לְאֻמִּים upang mapanatili ang kolektibong diwa at maiwasan ang αwkward na pag-uulit ng “mga bansa.”
- source_word: יִירָשׁוּ
  choice: minana nila
  rationale: Ang Qal imperfect ng ירש sa kontekstong salaysay ay tumutukoy sa pag-angkin o pagtanggap bilang mana. Ang “minana nila” ay nagpapanatili sa diwang ang pag-aari ay natanggap sa kaloob ng Diyos.
theological_decisions:
- issue: Diwang tipan ng ירש
  choice: minana nila
  alternative: inangkin nila / sinakop nila
  rationale: Ipinakikita ng konteksto na ang mga lupain ay kaloob ng Diyos. Pinananatili ng “minana nila” ang diwa ng pagtanggap ayon sa banal na pagkakaloob nang hindi itinatanggi na ang pandiwa ay maaari ring mangahulugang pag-angkin o pag-aari.
- issue: Saklaw ng kahulugan ng עָמָל
  choice: ang pinaghirapan ng mga bayan
  alternative: ang pagpapagal ng mga bayan / ang bunga ng pagpapagal ng mga bayan
  rationale: Hindi tahasang nilulutas ng Hebreo kung ang tinutukoy ay ang paggawa o ang napala mula rito. Ang pangunahing salin ay likas sa Tagalog at pinananatili hangga't maaari ang dalawang kaugnay na diwa; nililinaw sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong patula sa dalawang magkatimbang na linya at ang pagkakaiba ng “mga bansa” at “mga bayan.”
