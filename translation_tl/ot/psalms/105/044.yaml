  source_fidelity: 'Tapat ang salin sa Hebreo: ang Diyos ang nagbibigay ng mga lupain sa kanila, at sila ay tumatanggap/nagmamana ng pinaghirapan ng mga ibang pangkat. Napananatili ng “mga lupain” ang maramihang anyo ng אַרְצוֹת, at ang “minana nila” ay katanggap-tanggap na salin ng יִירָשׁוּ sa kontekstong ito.'
