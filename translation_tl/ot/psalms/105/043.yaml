  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: tl
  text: 'Inilabas niya ang kanyang bayan nang may kagalakan,

    ang may awitan[a] ang mga pinili niya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may masayang hiyawan.” Ang salitang Hebreo ay maaaring tumukoy sa masiglang sigaw ng galak, gayundin sa pag-awit.
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang mga hinirang.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: inilabas niya
  rationale: Ang Hiphil ng יצא ay may diwang sanhi, “pinangyaring lumabas.” Ang “inilabas niya” ay natural sa Filipino at malinaw na tumutukoy sa paglabas mula sa Egipto.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ang עַם ay tumutukoy sa isang sambayanan, at sa kontekstong ito ay sa bayang kabilang sa Diyos. Dignified at karaniwan sa biblikal na Filipino ang “kanyang bayan.”
- source_word: בְשָׂשׂוֹן
  choice: nang may kagalakan
  rationale: Ang שָׂשׂוֹן ay kagalakan o galak. Ipinapahayag ng “nang may kagalakan” ang pang-abay na gamit ng parirala nang hindi tinutukoy kung kanino lamang nagmumula ang galak.
- source_word: בְּרִנָּה
  choice: nang may awitan
  rationale: Maaaring tumukoy ang רִנָּה sa masayang pag-awit o sa malakas na sigaw ng galak. Ang “awitan” ay natural sa konteksto ng pagdiriwang, habang inilalahad sa talababa ang tunay na alternatibong kahulugan.
- source_word: אֶת
  choice: '[hindi isinalin bilang hiwalay na salita]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino; naipapakita ang tungkulin nito sa ayos ng pangungusap.
- source_word: בְּחִירָיו
  choice: ang mga pinili niya
  rationale: Mula sa בחר, literal itong tumutukoy sa mga taong pinili niya. Malinaw ang “mga pinili niya” at hindi nito dinaragdagan ang talata ng mga doktrinal na pahiwatig na wala sa mismong salita.
theological_decisions:
- issue: Paglalarawan sa בְּחִירָיו
  choice: ang mga pinili niya
  alternative: ang kanyang mga hinirang
  rationale: Kapantay ito ng “kanyang bayan” at tumutukoy sa mga pinili ng Diyos sa konteksto ng paglabas mula sa Egipto. Pinananatili ng salin ang ideya ng banal na pagpili nang hindi ipinapasok ang mas huling sistematikong pakahulugan sa terminong “hinirang.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang balanseng paralelismo ng “kanyang bayan” at “mga pinili niya,” gayundin ang magkatapat na pariralang “nang may kagalakan” at “nang may awitan.”
