  naturalness: Ang “mga pangaw” ay hindi karaniwang salita sa modernong Filipino at ang “Pinahirapan nila ang kanyang mga paa sa mga pangaw” ay mabigat pakinggan. Ang “mga tanikala” ay mas natural, malinaw, at marangal para sa patulang rehistro.
