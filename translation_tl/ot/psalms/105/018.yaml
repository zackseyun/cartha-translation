  text: Pinahirapan nila ang kanyang mga paa sa mga tanikala; pumasok ang bakal sa kanyang kaluluwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang pariralang Hebreo. Ang “kaluluwa” ay maaari ring tumukoy sa buhay o buong pagkatao. Dahil sa konteksto ng pagkagapos, inuunawa ng ilan ang larawan bilang bakal na kuwelyo o tanikala sa kanyang leeg.
