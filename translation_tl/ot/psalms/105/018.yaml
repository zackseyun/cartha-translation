lexical_decisions:
- source_word: עִנּוּ
  choice: Pinahirapan nila
  rationale: Ang Piel ng ענה ay nangangahulugang pahirapan, apihin, o hamakin. Ang di-tiyak na pangmaramihang simuno ay likas na naipapahayag sa Tagalog bilang “nila,” at hindi tinutukoy kung sino ang mga gumawa nito.
- source_word: בַכֶּבֶל
  choice: sa mga pangaw
  rationale: Ang כבל ay tanikala o pangaw na ginagamit sa pagkakagapos. Ang “pangaw” ay malinaw at angkop sa mga paa sa konteksto ng pagkabilanggo.
- source_word: רַגְלָיו
  choice: ang kanyang mga paa
  rationale: Tuwirang tinutukoy ng anyong may hulaping panghalip ang mga paa ni Jose.
- source_word: בַּרְזֶל
  choice: sa bakal
  rationale: Literal na “bakal” ang בַּרְזֶל. Hindi tahasang sinasabi ng Hebreo kung ito ay kuwelyo, tanikala, o ibang kagamitang bakal, kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: בָּאָה
  choice: napasailalim
  rationale: Ang pambabaeng pandiwang בָּאָה ay umaayon sa נַפְשׁוֹ bilang simuno. Ang “napasailalim” ay natural na Filipino para sa pagpasok ng buong pagkatao sa gapos na bakal, nang hindi ginagawang simuno ang “bakal.”
- source_word: נַפְשׁוֹ
  choice: ang kanyang sarili
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa kaluluwa, buhay, sarili, o buong pagkatao. Sa kontekstong ito, pinananatili ng “sarili” ang malawak na kahulugan at ang wastong ugnayang pambalarila, nang hindi ipinapalagay sa pangunahing teksto na “leeg” ang tiyak na ibig sabihin.
