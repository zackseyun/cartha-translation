  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: tl
  text: Hanggang sa panahong natupad ang kanyang salita,[a] sinubok siya ng salita ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang salita” ay maaaring tumukoy sa salita o pahayag ni Jose na natupad nang dumating ang panahon; maaari rin itong unawain bilang salita ng Diyos tungkol kay Jose.
    reason: alternative_reading
  - marker: b
    text: O “dinalisay siya ng salita ni Yahweh.” Ang pandiwa ay ginagamit sa pagdadalisay ng metal, kaya maaari itong mangahulugang “sinubok” o “pinatunayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: Hanggang sa panahon
  rationale: Likas na pariralang temporal sa Filipino na nagsasaad ng tagal hanggang sa isang takdang punto, nang hindi ipinapalagay na ang עֵת ay tahasang nangangahulugang ‘takdang panahon.’
- source_word: בֹּא
  choice: natupad
  rationale: Literal na ‘dumating,’ ngunit kapag ang simuno ay דְבָרוֹ, malinaw at natural sa Filipino ang idiomatikong diwang ang sinabi ay naganap o natupad.
- source_word: דְבָרוֹ
  choice: ang kanyang salita
  rationale: Pinananatili ang leksikal na anyong ‘salita’ at ang ambiguwidad ng panghalip; sa konteksto, malamang na tumutukoy ito sa salita o pahayag ni Jose, ngunit maaari ring unawain bilang salita ng Diyos tungkol sa kanya.
- source_word: אִמְרַת יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ang paralelismo ng dalawang salitang Hebreo para sa ‘salita’ at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: צְרָפָתְהוּ
  choice: sinubok siya
  rationale: Ang pandiwa ay literal na naglalarawan ng pagdalisay ng metal sa apoy at metaporikal na pagsubok o pagpapatunay; ‘sinubok’ ang pinakamalinaw na pangunahing salin sa modernong Filipino.
theological_decisions:
- issue: Tinutukoy ng ‘kanyang salita’
  choice: Iniwan itong may ambiguwidad sa pangunahing teksto; sa konteksto, malamang na salita o pahayag ni Jose
  alternative: Salita ng Diyos tungkol kay Jose
  rationale: Hindi tiyak sa Hebreo ang tinutukoy ng hulaping panghalip. Hindi dapat dogmatikong lutasin sa salin ang tunay na ambiguwidad, kaya ipinaliliwanag ang mga pagbasa sa talababa.
- issue: Larawan ng pagdadalisay sa צְרָפָתְהוּ
  choice: sinubok siya
  alternative: dinalisay siya
  rationale: Ipinahahayag ng ‘sinubok’ ang metaporikal na diwa sa konteksto, samantalang pinananatili sa talababa ang larawan ng metal na dinadalisay.
translation_notes:
  register: Modernong Filipino na natural, maikli, at marangal. Ginamit ang ‘natupad’ sa halip na literal na ‘dumating’ upang maging malinaw ang idyoma, ngunit pinanatili ang ambiguwidad ng ‘kanyang salita.’ Ang ‘Yahweh’ ay ginagamit para sa יְהוָה.
