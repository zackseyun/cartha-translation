    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: mga supling
  rationale: Kolektibong tumutukoy sa mga nagmula kay Abraham. Ang “mga supling” ay likas sa Filipino at hindi nagpapahiwatig ng literal na binhi.
- source_word: עַבְדּוֹ
  choice: lingkod niya
  rationale: 'Ang panghalip ay tumutukoy sa Diyos: si Abraham ay lingkod ng Diyos. Pinananatili ng “lingkod” ang marangal na katawagan nang hindi labis na itinatampok ang diwang pagkaalipin.'
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Tahasang panlalaking maramihan ang Hebreo. Pinananatili ito upang katawanin ang anyo ng pinagmulan, habang ang parirala sa konteksto ay maaaring kumatawan sa sambayanan mula kay Jacob.
- source_word: בְּחִירָיו
  choice: mga pinili niya
  rationale: Malinaw at likas na modernong Filipino ito para sa mga taong pinili ng Diyos, nang hindi nag-aangkat ng mas huling teknikal na bigat ng terminong “hinirang.”
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: mga supling ni Abraham // mga anak na lalaki ni Jacob
  rationale: Pinananatili ang magkatumbas na mga linyang naglalarawan sa sambayanan ayon sa kanilang pinagmulan sa mga patriyarka.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip sa “lingkod niya” at “mga pinili niya”
  choice: 'Parehong tumutukoy sa Diyos: si Abraham ang lingkod ng Diyos, at ang mga anak ni Jacob ang mga pinili ng Diyos.'
  alternative: Maaaring iugnay nang mekanikal ang bawat panghalip sa pinakamalapit na patriyarkang nabanggit, ngunit hindi ito ang malamang na kahulugan sa konteksto.
  rationale: Sa konteksto ng tipan sa awit, si Abraham ay lingkod ng Diyos at ang lahi ni Jacob ay pinili ng Diyos. Hindi tahasang pinapangalanan ng talata ang Diyos sa mga pariralang ito, kaya nananatili ang anyong “niya.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Idinagdag ang “Kayong” upang natural na katawanin ang tahasang panawagan na nagsimula sa naunang talata; hindi nito binabago ang kinakausap. Ang paghahati sa dalawang linya ay nagpapanatili sa paralelismo ng Hebreo.
