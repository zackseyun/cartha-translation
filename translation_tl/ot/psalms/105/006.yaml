  text: 'Kayong mga supling ni Abraham[a], kanyang lingkod,

    mga anak na lalaki ni Jacob[b], kanyang mga pinili[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binhi ni Abraham.” Ang pang-isahang salitang Hebreo ay ginagamit dito sa kolektibong diwa para sa mga inapo ni Abraham.
    reason: lexical_alternative
  - marker: b
    text: O “mga anak ni Jacob.” Ang Hebreo ay literal na “mga anak na lalaki ni Jacob,” ngunit maaari itong tumukoy sa mas malawak na sambayanang nagmula sa kanya.
    reason: lexical_alternative
  - marker: c
