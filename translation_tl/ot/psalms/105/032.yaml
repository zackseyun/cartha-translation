  source_fidelity: 'Tumpak ang pangunahing kahulugan ng salin: ang Diyos ang nagbibigay ng graniso kapalit ng ulan at ng apoy na nagliliyab sa kanilang lupain. Gayunman, mas malinaw na ipakita sa Tagalog na ang pandiwang “binigyan” ay saklaw kapwa ng graniso at ng apoy, gaya ng Hebreo.'
  naturalness: Ang “Bilang ulan ay binigyan niya sila ng graniso” ay nauunawaan ngunit may bahagyang di-karaniwang ayos. Mas natural at malinaw ang “Binigyan niya sila ng graniso bilang ulan.” Ang pag-uulit ng “ng” bago sa ikalawang bagay ay nag-aalis ng ellipsis na maaaring maging malabo sa modernong Filipino.
  terminology: Ang “graniso,” “nagliliyab na apoy,” at “lupain” ay angkop. Hindi angkop ang “mga lintik” bilang katumbas ng “fiery bolts,” sapagkat ang lintik sa modernong Tagalog ay karaniwang mura o sumpa, hindi isang neutral na katawagan para sa kidlat. Ang “mga nagliliyab na kidlat” ay ligtas na kontekstuwal na alternatibo sa talababa.
