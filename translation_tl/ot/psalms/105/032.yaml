translation:
  language: tl
  text: Binigyan niya sila ng graniso bilang ulan, at ng nagliliyab na apoy[a] sa kanilang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kidlat” o “mga nagliliyab na kidlat”; literal na “apoy ng mga liyab” o “nagliliyab na apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: binigyan niya
  rationale: Pinananatili ang karaniwang kahulugang “magbigay” at ang Hebreong idyoma ng tuwirang pagkilos ng Diyos; hindi kailangang paliitin sa “ipinadala.”
- source_word: גִּשְׁמֵיהֶם בָּרָד
  choice: Bilang ulan ay binigyan niya sila ng graniso
  rationale: Ipinahahayag na graniso ang ibinigay kapalit o bilang kanilang ulan. Ang “bilang ulan” ay natural sa Filipino at nananatiling malapit sa ugnayan ng mga salita sa Hebreo.
- source_word: בָּרָד
  choice: graniso
  rationale: Ito ang karaniwan at tiyak na katumbas sa modernong Filipino para sa hail, at malinaw na umaalingawngaw sa salot sa Ehipto.
- source_word: אֵשׁ לֶהָבוֹת
  choice: nagliliyab na apoy
  rationale: Pinananatili ang pinatinding larawang “apoy” at “mga liyab” sa natural na Filipino, nang hindi agad tinutukoy ito bilang kidlat.
- source_word: בְּאַרְצָם
  choice: sa kanilang lupain
  rationale: Tuwirang katumbas ng pariralang tumutukoy, ayon sa konteksto, sa lupain ng Ehipto.
theological_decisions:
- issue: Kalikasan ng אֵשׁ לֶהָבוֹת sa salaysay ng salot
  choice: nagliliyab na apoy
  alternative: kidlat; nag-aapoy na mga lintik
  rationale: Maaaring tumukoy ang konteksto ng salot sa kidlat, ngunit literal na “apoy” at “mga liyab” ang Hebreo. Pinananatili ng pangunahing teksto ang mas malawak na larawan at inilalagay sa talababa ang posibleng kontekstuwal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “graniso” bilang pangkaraniwang katawagan at pinanatili ang masinsing, patulang larawan ng Hebreo. Ang panandang [a] ay nakalagay agad pagkatapos ng pariralang tinutukoy nito.
