  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: tl
  text: Iniladlad niya ang ulap bilang pantakip[a], at ang apoy upang magbigay-liwanag sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang tabing,” “bilang panangga,” o “bilang kanopi.” Ang salitang Hebreo ay maaaring tumukoy sa pantakip o tabing na nagsisilbing proteksiyon o harang.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: inilatag
  rationale: Ipinahihiwatig ng pandiwa ang pag-uunat o paglalatag. Likas sa Filipino ang “inilatag” para sa larawan ng ulap na ibinuka sa ibabaw ng bayan.
- source_word: עָנָן
  choice: ulap
  rationale: Tuwirang katumbas ng salita at pinananatili ang larawan ng ulap sa salaysay ng ilang.
- source_word: לְמָסָךְ
  choice: bilang pantabing
  rationale: Maaaring tumukoy ang מָסָךְ sa pantakip, pantabing, tabing, o kanopi. Ang “pantabing” ay malinaw at hindi labis na nagtatakda kung proteksiyon, lilim, o harang ang tiyak na diin.
- source_word: וְאֵשׁ
  choice: at ang apoy
  rationale: Pinananatili ang literal na larawan at ang pagtut parallel ng ulap at apoy.
- source_word: לְהָאִיר
  choice: upang magbigay-liwanag
  rationale: Ang infinitive na may לְ ay nagpapahayag dito ng layunin; natural na ipinahahayag iyon ng “upang magbigay-liwanag.”
- source_word: לָיְלָה
  choice: sa gabi
  rationale: Karaniwan at malinaw na pang-abay na panahong katumbas sa modernong Filipino.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng pandiwa
  choice: niya, na tumutukoy sa Diyos
  alternative: tahasang gamitin ang “Panginoon” o “Diyos”
  rationale: Nasa anyong ikatlong panauhang panlalaki ang pandiwa at ang simuno ay dinadala mula sa konteksto. Pinananatili ng “niya” ang daloy at hindi nagdaragdag ng pangalang wala sa mismong talata.
- issue: Larawan ng pagpapakita ng Diyos sa ilang
  choice: panatilihin ang literal na ulap at apoy nang walang paliwanag sa pangunahing teksto
  alternative: tukuyin ang mga ito bilang haliging ulap at haliging apoy
  rationale: Umaalingawngaw ang talata sa salaysay ng Exodo, ngunit ulap at apoy lamang ang tahasang binabanggit. Hindi dapat idagdag sa teksto ang paliwanag na ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pantabing” upang mapanatili ang saklaw ng Hebreong מָסָךְ, habang ipinaliliwanag sa talababa ang iba pang posibleng larawan.
