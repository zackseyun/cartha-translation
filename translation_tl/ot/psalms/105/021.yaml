translation:
  language: tl
  text: Ginawa niya siyang panginoon ng kanyang sambahayan[a], at tagapamahala ng lahat ng kanyang ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itinalaga niya siyang panginoon sa kanyang sambahayan at tagapamahala sa lahat ng kanyang pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמוֹ
  choice: Ginawa niya ito
  rationale: Ang Qal perfect na may 3ms object suffix ay literal na ‘inilagay/itinalaga niya siya.’ Sa kasunod na mga titulong panaguri, likas sa Tagalog ang ‘ginawa niya itong,’ na naghahayag ng pagtatalaga sa tungkulin.
- source_word: אָדוֹן
  choice: panginoon
  rationale: Tumutukoy ito sa isang may kapangyarihan sa sambahayan. Pinananatili ng ‘panginoon’ ang marangal at patulang rehistro at kaagapay ng ‘pinuno.’
- source_word: לְבֵיתוֹ
  choice: ng kanyang sambahayan
  rationale: Ang לְ ay nag-uugnay sa itinalagang tungkulin sa saklaw ng sambahayan. Mas malinaw rito ang ‘sambahayan’ kaysa ‘bahay’ sapagkat saklaw ang buong pamamahala ng tahanan at mga tauhan.
- source_word: וּמֹשֵׁל
  choice: at pinuno
  rationale: Ang participle mula sa משל ay tumutukoy sa isang namamahala. Ang ‘pinuno’ ay natural at nagpapanatili ng paralelismo sa ‘panginoon.’
- source_word: בְּכָל
  choice: sa lahat ng
  rationale: Kasama ng משל, itinatakda ng בְּ ang saklaw ng pamamahala; natural itong ipinahahayag sa Tagalog bilang ‘sa lahat ng.’
- source_word: קִנְיָנוֹ
  choice: kanyang ari-arian
  rationale: Ang קִנְיָן ay mga pag-aari o ari-arian. Ang ‘ari-arian’ ay malinaw, malawak, at angkop sa konteksto ng pamamahala sa buong pag-aari.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at patulang Filipino. Ginamit ang ‘sambahayan’ upang malinaw na ipahiwatig ang household o estate, hindi lamang ang gusaling bahay; pinanatili sa talababa ang alternatibong ‘itinalaga’ at ‘pag-aari.’
