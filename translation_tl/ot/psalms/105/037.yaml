base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: tl
  text: Inilabas niya sila na may pilak at ginto, at sa mga lipi niya ay walang sinumang natitisod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “walang sinumang nanghihina sa mga lipi niya.” Ang participle sa Hebreo ay maaaring tumukoy sa pagkatisod, pagkakandirit, o panghihina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Inilabas niya sila
  rationale: Ang Hiphil ng יצא ay nagpapahayag ng pagpapalabas o pag-akay palabas. Pinananatili ng “Inilabas niya sila” ang pagkilos ng Diyos at natural ito sa konteksto ng pag-alis mula sa Egipto.
- source_word: בְּכֶסֶף וְזָהָב
  choice: may dalang pilak at ginto
  rationale: Ipinahihiwatig ng ב na lumabas ang bayan na taglay ang pilak at ginto. Ang “may dalang” ay malinaw at natural, ngunit hindi nito pinalalabis ang dami o bigat ng kanilang dala.
- source_word: וְאֵין
  choice: at ... ay walang sinuman
  rationale: Ang eksistensiyal na אֵין ay natural na naipahahayag sa Filipino bilang “walang sinuman” kapag tao ang tinutukoy.
- source_word: בִּשְׁבָטָיו
  choice: sa mga lipi niya
  rationale: Ang שֵׁבֶט ay nangangahulugang “lipi” sa kontekstong ito. Pinananatili ng “niya” ang pang-isahang hulaping panlalaki sa Hebreo, na tumutukoy sa Israel bilang isang kolektibong bayan.
- source_word: כּוֹשֵׁל
  choice: natitisod
  rationale: Ang participle mula sa כשל ay maaaring tumukoy sa pagkatisod, panghihina, o pagkabigo sa paglakad. Pinananatili ng “natitisod” ang konkretong larawan ng salitang Hebreo habang bukas pa rin sa ipinahihiwatig na kahinaan.
theological_decisions:
- issue: Tinutukoy ng pang-isahang hulapi sa “mga lipi niya”
  choice: Pinanatili ang pang-isahang “niya,” na tumutukoy sa Israel/Jacob bilang isang kolektibong persona.
  alternative: “sa kanilang mga lipi,” na tahasang tumutukoy sa maraming taong inilabas
  rationale: May hulaping ikatlong panauhang pang-isahan ang Hebreo. Ang pagpapanatili sa pang-isahan ay gumagalang sa paraan ng salmo na ituring ang Israel bilang isang kolektibong persona nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Saklaw ng kahulugan ng כּוֹשֵׁל
  choice: Ginamit sa pangunahing teksto ang konkretong “natitisod.”
  alternative: “nanghihina” o “mahina,” na itinatampok ang pisikal na kalagayan
  rationale: Maaaring ilarawan ng salitang Hebreo ang literal na pagkatisod o ang panghihina. Hindi nilulutas ng pangunahing teksto ang tunay na leksikal na tensiyon; inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “may dalang” upang likas na ipahayag na taglay ng bayan ang pilak at ginto, at pinanatili ang payak na larawang “natitisod” sa pangunahing teksto.
