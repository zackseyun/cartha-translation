  yaml_path: translation/ot/psalms/105/005.yaml
  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: tl
  text: 'Alalahanin ninyo ang kanyang mga kamangha-manghang gawa[a],

    ang kanyang mga tanda[b], at ang mga hatol ng kanyang bibig[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga kahanga-hangang bagay na ginawa niya.”
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang mga kababalaghan” o “mga himala.”
    reason: lexical_alternative
  - marker: c
    text: O “ang mga hatol na kanyang ipinahayag” o “ang mga kautusang nagmula sa kanyang bibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Alalahanin ninyo
  rationale: Tuwirang maramihang pautos ito mula sa זכר. Likas sa modernong Filipino ang “Alalahanin ninyo” at ipinapahayag nito ang aktibong pagbabalik sa isip.
- source_word: נִפְלְאוֹתָיו
  choice: ang mga kamangha-manghang ginawa niya
  rationale: Tumutukoy ang נִפְלָאוֹת sa pambihirang mga gawa na pumupukaw ng paghanga. Pinananatili ng parirala ang diwa ng mga kahanga-hangang gawa nang hindi nililimitahan ang mga ito sa isang teknikal na uri ng himala.
- source_word: אֲשֶׁר עָשָׂה
  choice: ginawa niya
  rationale: Isinasama ang sugnay na naglalarawan sa mga kamangha-manghang bagay at malinaw na itinatanghal ang Diyos bilang gumawa.
- source_word: מֹפְתָיו
  choice: ang kanyang mga tanda
  rationale: Maaaring tumukoy ang מוֹפֵת sa tanda, kababalaghan, o pambihirang pangyayaring nagpapatunay sa pagkilos ng Diyos. Malawak at malinaw ang “mga tanda,” at hindi nito ipinapalagay na himala lamang ang tinutukoy.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: at ang mga hatol ng kanyang bibig
  rationale: Pinananatili nito ang Hebreong larawan ng mga hatol o pasyang nagmumula sa bibig ng Diyos, habang iniiwang bukas kung ang diin ay nasa mga hatol, kapasyahan, o kautusang ipinahayag.
- source_word: פִיו
  choice: kanyang bibig
  rationale: Ang literal na larawan ay makata at antropomorpiko; hindi ito pinapalitan ng mas interpretatibong “sinabi niya.”
theological_decisions:
- issue: Ugnayan ng נִפְלְאוֹת at מֹפְתִים bilang magkatulad ngunit hindi ganap na magkaparehong paglalarawan sa mga gawa ng Diyos
  choice: “mga kamangha-manghang ginawa niya” at “mga tanda”
  alternative: “mga kahanga-hangang gawa” at “mga himala” o “mga kababalaghan”
  rationale: Nagtatambak ang talata ng magkakaugnay na katawagan para sa makapangyarihang pagkilos ng Diyos ngunit hindi humihingi ng mahigpit na teknikal na pagkakaiba. Pinananatili ng dalawang magkaibang salin ang paralelismo nang hindi nag-aangkat ng sistematikong pag-uuri.
- issue: Kahulugan ng מִשְׁפְּטֵי פִיו
  choice: “mga hatol ng kanyang bibig”
  alternative: “mga hatol na kanyang ipinahayag” o “mga kautusang nagmula sa kanyang bibig”
  rationale: Maaaring tumukoy ang parirala sa mga hatol, pasya, o kautusan ng Diyos. Pinananatili ng literal na larawan ang makatang anyo at ang tunay na lawak ng kahulugan sa halip na pumili agad ng iisang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” para sa Hebreong pautos. Pinanatili ang makatang imahen na “mga hatol ng kanyang bibig,” samantalang inilagay sa talababa ang mas likas ngunit mas interpretatibong mga salin.
