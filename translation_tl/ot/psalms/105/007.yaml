  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: tl
  text: Siya ang Yahweh, ang ating Diyos[a]; ang kanyang mga hatol[b] ay umaabot sa buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isalin na “Jehova.”'
    reason: alternative_reading
  - marker: b
    text: O “mga tuntunin” o “katarungan.” Ang salitang Hebreo ay maaaring tumukoy sa mga pasiyang panghukuman, mga itinakdang tuntunin, o katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Siya si
  rationale: Binibigyang-diin ng malayang panghalip ang pagkakakilanlan ng Diyos; natural sa Tagalog ang sugnay na “Siya si Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Ang anyong may hulaping unang panauhang maramihan ay nangangahulugang “ating Diyos.”
- source_word: בְּכָל הָאָרֶץ
  choice: nasa buong daigdig
  rationale: Ang lokatibong parirala ay tumutukoy sa saklaw sa buong mundo; mas malinaw rito ang “daigdig” kaysa sa posibleng mas lokal na “lupain.”
- source_word: מִשְׁפָּטָיו
  choice: kanyang mga hatol
  rationale: Maaaring tumukoy ang מִשְׁפָּטָיו sa mga pasiya, tuntunin, o katarungan ng Diyos. Pinananatili ng “mga hatol” ang hudisyal na diwa nang hindi labis na nililimitahan ang kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong pangalan at hindi pinalitan ng titulong “Panginoon.”
- issue: Saklaw ng מִשְׁפָּטָיו
  choice: mga hatol
  alternative: mga tuntunin; katarungan
  rationale: Hindi tiyak sa salita lamang kung ang diin ay nasa mga pasiyang hudisyal, mga itinakdang tuntunin, o katarungang isinasagawa; inilalahad sa talababa ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Siya si” bilang natural na pangungusap na may diin, at “buong daigdig” upang ipakita ang pangkalahatang saklaw ng talata.
