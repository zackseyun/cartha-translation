  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: tl
  text: Isinagawa nila sa gitna nila ang mga bagay na nauukol sa kaniyang mga tanda[a] at mga kababalaghan sa lupain ni Ham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang mga salita ng kaniyang mga tanda.” Maaari rin itong mangahulugang “ang mga bagay” o “ang mga pangyayari” na nauukol sa kaniyang mga tanda.
    reason: lexical_alternative
  - marker: b
    text: Ang “lupain ni Ham” ay isang patulang tawag sa Ehipto.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: Isinagawa nila
  rationale: Bagaman ang pangunahing diwa ng שׂוּם ay “ilagay” o “italaga,” sa pagsasamang ito ng mga tanda at kababalaghan ay tumutukoy ito sa aktuwal na pagsasagawa o pagpapakita ng mga iyon.
- source_word: בָם
  choice: sa gitna ng mga ito
  rationale: Ipinahihiwatig ng ב na naganap ang mga tanda sa gitna ng mga taong tinutukoy sa konteksto, samakatuwid ay sa mga Ehipsiyo.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: ang kaniyang mga tanda[a]
  rationale: Ang literal na “mga salita/mga bagay ng kaniyang mga tanda” ay hindi likas at malabo sa modernong Tagalog. Inihahatid ng pangunahing teksto ang idyomatikong diwa, habang pinananatili sa talababa ang di-pangkaraniwang anyo ng Hebreo.
- source_word: וּמֹפְתִים
  choice: at mga kababalaghan
  rationale: Ang “mga kababalaghan” ay malinaw na katumbas ng מֹפְתִים at pinananatili ang karaniwang tambalang “mga tanda at mga kababalaghan.”
- source_word: בְּאֶרֶץ חָם
  choice: sa lupain ni Ham
  rationale: Pinananatili ang patulang katawagan ng Hebreo sa halip na tahasang palitan ito ng “Ehipto.”
theological_decisions:
- issue: Di-pangkaraniwang pariralang דִּבְרֵי אֹתוֹתָיו
  choice: Isalin sa pangunahing teksto bilang “ang kaniyang mga tanda,” na may talababa sa literal na anyo.
  alternative: “ang mga salita ng kaniyang mga tanda” o “ang mga bagay ng kaniyang mga tanda”
  rationale: Hindi tiyak kung ang דִּבְרֵי ay dapat unawain bilang “mga salita,” “mga bagay,” o bilang idyomatikong pantulong sa pagtukoy sa mga tandang isinagawa. Hindi ipinapasok sa teksto ang isang teolohikal na paliwanag tungkol sa ugnayan ng salita at himala; inilalahad sa talababa ang tunay na anyo at kalabuan ng Hebreo.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “mga ito” upang mapanatili ang panghalip ng Hebreo nang hindi tahasang ipinapalit ang “mga Ehipsiyo,” at inilagay ang paliwanag tungkol kay Ham sa talababa.
