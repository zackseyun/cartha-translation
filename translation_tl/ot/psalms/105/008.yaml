  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: tl
  text: 'Magpakailanman niyang inaalala ang kanyang tipan,

    ang salitang[a] iniutos niya para sa isang libong salinlahi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, pangako.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: Inaalala niya
  rationale: Ang Qal perfect ay maaaring tumukoy sa naganap na pag-alaala, ngunit sa kontekstong patula ay ipinahahayag nito ang patuloy na katapatan ng Diyos. Ang kasalukuyang anyo sa Filipino ay likas at hindi naglilimita sa kilos sa isang sandali lamang sa nakaraan.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Tuwirang ipinahahayag nito ang walang hanggang tagal at ang pananatili ng tipan.
- source_word: בְּרִיתוֹ
  choice: ang kanyang tipan
  rationale: Ang “tipan” ang kinikilalang salin sa kontekstong biblikal at pinananatili ang teolohikal at pangkasaysayang bigat ng salita.
- source_word: דָּבָר
  choice: ang salita
  rationale: Malawak ang saklaw ng דָּבָר. Dito ay tumutukoy ito sa ipinahayag na salita kaugnay ng tipan. Pinananatili ng “salita” ang leksikal na lawak at paralelismo; inilalagay sa talababa ang mas interpretibong “pangako.”
- source_word: צִוָּה
  choice: iniutos niya
  rationale: Ang Piel perfect ng צוה ay karaniwang nangangahulugang “nag-utos.” Pinananatili ng saling ito ang lakas ng banal na pagtatakda nang hindi ito pinapakahulugan nang higit sa teksto.
- source_word: לְאֶלֶף דּוֹר
  choice: sa isang libong salinlahi
  rationale: Ipinahahayag ng parirala ang lawak ng bisa sa isang libong henerasyon. Ang “salinlahi” ay dignified at likas sa makabagong saling biblikal.
theological_decisions:
- issue: Aspekto ng pag-alaala ng Diyos
  choice: Kasalukuyang anyong “Inaalala niya” bilang pagpapahayag ng patuloy na katapatan
  alternative: “Inalala niya” o “Inalala na niya”
  rationale: Sa konteksto, hindi lamang isang nakaraang kilos ng paggunita ang pinupuri kundi ang namamalaging katapatan ng Diyos sa kanyang tipan. Gayunman, hindi dinaragdagan ng salin ang konsepto ng pag-alaala ng isang tahasang paliwanag.
- issue: Kahulugan ng דָּבָר sa paralelismo ng tipan
  choice: Panatilihin ang “salita” sa pangunahing teksto
  alternative: “pangako”
  rationale: Maaaring tumukoy ang salita sa pangakong ipinahayag ng Diyos, ngunit mas malawak ang Hebreo. Pinananatili ng pangunahing salin ang tunay na leksikal na lawak, habang ang “pangako” ay ibinibigay bilang makabuluhang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” upang mapanatili ang patulang himig, at inayos ang mga sugnay ayon sa paralelismo ng Hebreo.
