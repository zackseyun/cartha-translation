  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: tl
  text: Nagsalita siya, at dumating ang kuyog ng mga langaw[a] at ang mga niknik[b] sa buong lupain nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuyog” lamang. Sa mga salaysay tungkol sa mga salot, ang Hebreong עָרֹב ay tradisyonal na inuunawang kuyog ng mga langaw, ngunit hindi tiyak ang eksaktong uri ng insekto.
    reason: lexical_alternative
  - marker: b
