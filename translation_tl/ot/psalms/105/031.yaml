  terminology: Ang “kuyog ng mga langaw” at “mga niknik” ay angkop at hindi labis na tiyak. Pinananatili ng mga talababa ang leksikal na pag-iingat. Walang kailangang pagbabago sa mga pangalang teolohikal o rehistro.
