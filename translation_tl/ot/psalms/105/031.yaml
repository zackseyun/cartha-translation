lexical_decisions:
- source_word: אָמַר
  choice: Nagsalita siya
  rationale: Karaniwang kahulugan ng אָמַר ang pagsasalita o pagsasabi. Pinananatili ng “Nagsalita siya” ang maikli at makapangyarihang pormula ng banal na pananalita nang hindi ito pinalalawak bilang tahasang utos.
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Inilalarawan ng anyong pasalaysay ng בוא ang pagdating ng salot; natural at hindi labis na espesipiko ang “dumating.”
- source_word: עָרֹב
  choice: kuyog ng mga langaw
  rationale: Sa salaysay ng mga salot, karaniwang inuunawa ang עָרֹב bilang kuyog ng mga insektong madalas tukuying mga langaw. Malinaw at natural sa Filipino ang “kuyog ng mga langaw,” habang pinananatili sa talababa ang kawalan ng katiyakan sa eksaktong uri.
- source_word: כִּנִּים
  choice: mga niknik
  rationale: Tumutukoy ang salita sa maliliit na insektong nangangagat, ngunit hindi tiyak ang eksaktong uri. Ang “niknik” ay natural na makabagong salin; inilalahad sa talababa ang iba pang posibleng pagkakakilanlan.
- source_word: בְּכָל
  choice: sa buong
  rationale: Ipinahihiwatig ng בְּכָל ang paglaganap sa kabuuan ng lugar; tuwirang ipinapahayag ito ng “sa buong.”
- source_word: גְּבוּלָם
  choice: nasasakupan nila
  rationale: Sa kontekstong ito, ang גְּבוּל ay tumutukoy sa buong teritoryo o sakop, hindi lamang sa hangganang guhit. Natural at malawak ang diwa ng “nasasakupan nila.”
