  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: tl
  text: “Huwag ninyong galawin ang mga pinahiran ko[a]; huwag ninyong gawan ng masama ang mga propeta ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga pinahiran ko.” Kaugnay ng salitang “Mesiyas” ang salitang ginamit dito, ngunit maramihan ito at tumutukoy sa mga taong ibinukod ng Diyos, hindi partikular sa natatanging Mesiyas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: galawin
  rationale: Karaniwang nangangahulugan ang נגע ng ‘humipo’ o ‘gumalaw,’ at maaari ring magpahiwatig ng pananakit ayon sa konteksto. Pinananatili ng ‘galawin’ ang maikli at idyomatikong pagbabawal nang hindi ito nililimitahan sa pisikal na karahasan.
- source_word: בִמְשִׁיחָי
  choice: ang mga pinahiran ko
  rationale: Ang מָשִׁיחַ ay ‘taong pinahiran.’ Ang anyo rito ay maramihan at may hulaping unang panauhang isahan, kaya ‘mga pinahiran ko.’ Hindi ginamit ang ‘mga Mesiyas’ sapagkat maaari itong magbigay ng maling impresyong tumutukoy ang talata sa natatanging Mesiyas.
- source_word: לִנְבִיאַי
  choice: ang mga propeta ko
  rationale: Ang נָבִיא ay ‘propeta’; ang anyong maramihan na may hulaping unang panauhang isahan ay tuwirang isinaling ‘mga propeta ko.’
- source_word: תָּרֵעוּ
  choice: gawan ng masama
  rationale: Ang Hiphil ng רעע sa pagbabawal na ito ay nangangahulugang gumawa ng masama laban sa isang tao o magdulot sa kaniya ng pinsala. Likas sa modernong Filipino ang ‘gawan ng masama’ at pinananatili nito ang lawak ng kahulugan.
- source_word: אַל
  choice: Huwag
  rationale: Ang אַל na sinusundan ng di-ganap na pandiwa ay nagpapahayag ng pagbabawal; ‘huwag’ ang natural at maikling katumbas sa Filipino.
theological_decisions:
- issue: Pagpapahayag sa מְשִׁיחַ sa maramihang kontekstong hindi tuwirang mesyaniko
  choice: mga pinahiran ko
  alternative: mga Mesiyas ko
  rationale: Maramihan ang salitang Hebreo at tumutukoy sa mga taong ibinukod ng Diyos sa salaysay, hindi tuwiran sa natatanging Mesiyas. Isinasalin ang kahulugan ng titulo upang mapanatili ang gramatika at maiwasan ang pagpasok ng espesipikong kristolohikal na pakahulugan na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘galawin’ upang mapanatili ang idyomatikong lakas ng unang pagbabawal, at ‘gawan ng masama’ upang maipahayag ang malawak na saklaw ng ikalawang pandiwa.
