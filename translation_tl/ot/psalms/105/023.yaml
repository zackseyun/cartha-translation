id: PSA.105.23
reference: Psalms 105:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: tl
  text: Pagkatapos, dumating ang Israel sa Ehipto, at nanirahan si Jacob bilang dayuhan[a] sa lupain ni Ham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakipamayan” o “nanirahan bilang isang hindi katutubo”; binibigyang-diin ng pandiwang Hebreo ang paninirahan sa isang lugar bilang dayuhan.
    reason: lexical_alternative
  - marker: b
    text: Ang “lupain ni Ham” ay isang patulang tawag sa Ehipto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, dumating
  rationale: Ang Qal wayyiqtol ng בוא ay nagsusulong sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, dumating” at napananatili nito ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinanatili ang pangalang Israel at ang patulang pagtutumbas nito kay Jacob; sa konteksto, kinakatawan ng patriyarka ang bayang nagmula sa kanya.
- source_word: מִצְרָיִם
  choice: sa Ehipto
  rationale: Ito ang karaniwang anyo ng pangalang heograpiko sa Tagalog.
- source_word: וְיַעֲקֹב
  choice: at ... si Jacob
  rationale: Pinanatili ang pangalang Jacob sa halip na palitan ng panghalip upang maipakita ang sinadyang paralelismong Israel–Jacob.
- source_word: גָּר
  choice: nanirahan ... bilang dayuhan
  rationale: Ang גור ay tumutukoy sa paninirahan ng isang hindi katutubo o walang permanenteng katayuan sa lugar. Malinaw at natural itong ipinahahayag ng “nanirahan bilang dayuhan.”
- source_word: בְּאֶרֶץ
  choice: sa lupain ni
  rationale: Ang אֶרֶץ ay “lupain” o “bayan.” Ang “lupain ni Ham” ay likas na Tagalog para sa lupaing iniuugnay sa isang taong pinagmulan o pangalan.
- source_word: חָם
  choice: Ham
  rationale: Pinanatili ang pangalang pantangi at ang patulang katawagang “lupain ni Ham” sa halip na tahasang palitan ito ng “Ehipto.”
theological_decisions:
- issue: Kung pag-iisahin ang patulang paralelismong “Israel // Jacob” bilang iisang pangalan lamang
  choice: Pinanatili ang parehong pangalang Israel at Jacob sa pangunahing teksto.
  alternative: Gawing “Pagkatapos, dumating si Jacob sa Ehipto at nanirahan bilang dayuhan sa lupain ni Ham,” o gamitin lamang ang “Israel.”
  rationale: Sadyang ginagamit ng Hebreo ang dalawang pangalan sa magkatugmang mga linya. Ang pagpapanatili sa dalawa ay gumagalang sa anyong patula at sa ugnayan ng patriyarka at ng bayang kinakatawan niya nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paralelismong Israel–Jacob at ang patulang katawagang “lupain ni Ham.” Inilagay ang panandang [a] kaagad pagkatapos ng pariralang nililinaw nito at ang [b] pagkatapos ng “lupain ni Ham.”
