lexical_decisions:
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikitang ipinagpapatuloy ng talata ang tuwirang pangako mula sa naunang talata, gaya ng gamit ng infinitive construct sa Hebreo.
- source_word: לְךָ
  choice: Sa iyo
