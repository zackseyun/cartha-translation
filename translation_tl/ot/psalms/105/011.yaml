- source_word: אֶתֵּן
  choice: ko ibibigay
  rationale: Ipinahahayag ng imperfect ang pangakong gagawin sa hinaharap; natural sa Filipino ang ayos na “Sa iyo ko ibibigay.”
- source_word: אֶרֶץ כְּנָעַן
  choice: ang lupain ng Canaan
  rationale: Malinaw at likas na tumutukoy sa teritoryong Canaan.
- source_word: חֶבֶל
  choice: bahagi
  rationale: Bagaman literal na lubid o panukat na pisi, sa paghahati ng lupain ay tumutukoy ito sa bahaging itinakda o inilaan.
- source_word: נַחֲלַתְכֶם
  choice: inyong mana
  rationale: Pinananatili ang diwa ng minanang pag-aari at ang pangmaramihang hulapi ng Hebreo.
theological_decisions:
- issue: Paglipat mula sa isahang kausap tungo sa pangmaramihang panghalip sa pangako
  choice: Panatilihin ang “Sa iyo” at “inyong mana”
  alternative: “Sa iyo ... iyong mana” o “Sa iyo ... mana ng iyong mga inapo”
  rationale: Sadyang pinananatili ang paglipat ng Hebreo mula sa isahang לְךָ tungo sa pangmaramihang נַחֲלַתְכֶם, nang hindi ipinapaliwanag o pinapantay sa mismong teksto ang ugnayan ni Abraham at ng kaniyang mga inapo.
