translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Diyos bilang paksa ng dalawang kilos at ang causative na puwersa ng ikalawang pandiwa. Walang talababa dahil walang mahalagang ambiguwidad na nangangailangang ilahad; ang “ginawang dugo” ang natural na katumbas ng Hebreong הָפַךְ ... לְדָם.
