translation:
  language: tl
  text: Ginawa niyang dugo ang kanilang tubig, at pinatay niya ang kanilang mga isda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: Ginawa
  rationale: Ang pandiwa ay nangangahulugang bumaling, magbago, o gawing iba. Sa Filipino, ang konstruksiyong “ginawang dugo” ay natural at malinaw na nagpapahayag ng pagbabago ng kalagayan.
- source_word: מֵימֵיהֶם
  choice: ang kanilang mga tubig
  rationale: Pinananatili nito ang maramihang anyo ng Hebreo at sama-samang tumutukoy sa mga anyong-tubig ng mga Ehipcio.
- source_word: לְדָם
  choice: dugo
  rationale: Ipinapakita ng לְ ang kinalabasang kalagayan; sa pariralang Filipino na “ginawang dugo,” hindi na kailangan ang hiwalay na katumbas na pang-ukol.
- source_word: וַיָּמֶת
  choice: at pinatay niya
  rationale: 'Ang Hiphil ay tahasang sanhi: siya ang nagpamatay o naging dahilan ng pagkamatay. Ang “pinatay niya” ay likas at tuwirang Filipino na nagpapanatili sa causative na diwa.'
- source_word: דְּגָתָם
  choice: ang kanilang mga isda
  rationale: Ang pangngalan ay kolektibong tumutukoy sa mga isda; malinaw at karaniwan sa Filipino ang “kanilang mga isda.”
