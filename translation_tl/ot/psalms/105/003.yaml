base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: tl
  text: Ipagmalaki ninyo ang kanyang banal na pangalan[a]; magalak ang puso ng mga humahanap kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Magbunyi kayo sa kanyang banal na pangalan.” Ang pandiwang Hebreo ay maaaring mangahulugan ng pagbubunyi o pagmamalaki dahil sa isang tao o bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Ipagmalaki ninyo
  rationale: Ang hitpael na pautos ng הלל ay nagpapahiwatig ng pagmamapuri o pagbubunyi dahil sa isang tao o bagay. Likas sa makabagong Tagalog ang “ipagmalaki,” at malinaw nitong iniuugnay ang pagmamapuri sa banal na pangalan ng Diyos.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: ang kanyang banal na pangalan
  rationale: Pinananatili ang tahasang “pangalan” at “banal.” Sa pandiwang “ipagmalaki,” hindi na kailangang isalin nang hiwalay ang pang-ukol na ב dahil likas na tuwirang layon sa Tagalog ang pariralang ito.
- source_word: יִשְׂמַח
  choice: magalak
  rationale: Bagaman anyong imperfect na ikatlong panauhan, gumaganap ito bilang hangarin o paghihikayat sa kontekstong patula. Ang “magalak” ay likas at marangal na katumbas ng “let ... rejoice.”
- source_word: לֵב
  choice: ang puso
  rationale: Pinananatili ang kolektibong isahan ng Hebreo. Tumutukoy ang “puso” sa panloob na pagkatao, hindi lamang sa damdamin.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: mga humahanap kay Yahweh
  rationale: Ipinahihiwatig ng participle ang mga taong palagiang naghahangad at lumalapit kay Yahweh. Ang “mga humahanap” ay nauunawaan sa modernong Tagalog at pinananatili ang larawan ng paghahanap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng titulong “Panginoon.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Panginoon o Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng “puso” sa ikalawang linya
  choice: 'Kolektibong isahan: “ang puso ng mga humahanap”'
  alternative: 'Maramihan: “ang mga puso ng mga humahanap”'
  rationale: Pinananatili ng kolektibong isahan ang anyo at idyoma ng Hebreo habang malinaw pa ring tumutukoy sa panloob na pagkatao ng lahat ng humahanap kay Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipagmalaki” bilang natural na katumbas ng pagmamapuri sa pangalan ng Diyos, habang inilagay sa talababa ang alternatibong “magbunyi” upang mapanatili ang lawak ng pandiwang Hebreo.
