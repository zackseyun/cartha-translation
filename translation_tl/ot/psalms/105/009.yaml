  text: אֲשֶׁ֣ר כָּ֭רַת אֶת אַבְרָהָ֑ם וּ/שְׁב֖וּעָת֣/וֹ לְ/יִשְׂחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/009.yaml
  text: which he made with Abraham[a], and his oath to Isaac,
translation:
  language: tl
  text: na ginawa niya kay Abraham[a], at ang kanyang panunumpa kay Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “na pinutol niya kay Abraham,” isang idyoma para sa paggawa ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pang-ugnay na panghalip na nagdurugtong sa tipan na binanggit sa naunang talata; natural sa Filipino ang “na” sa pagpapatuloy ng pangungusap.
- source_word: כָּרַת
  choice: ginawa
  rationale: Sa konteksto ng tipan, bahagi ito ng idyomang Hebreo na literal na “pumutol [ng tipan].” Ipinahahayag ng “ginawa” ang kahulugan ng pagtatatag ng tipan nang hindi nagiging salitang-salitang salin.
- source_word: אֶת אַבְרָהָם
  choice: kay Abraham
  rationale: Bagaman minamarkahan ng אֶת si Abraham bilang layon, sa Filipino natural na ipinahahayag ng “kay Abraham” ang taong kaugnay ng paggawa ng tipan.
- source_word: וּשְׁבוּעָתוֹ
  choice: at ang kanyang panunumpa
  rationale: Pinananatili ang anyong pangngalan ng שְׁבוּעָה at ang panlalaking panghalip na hulapi bilang “kanyang.”
- source_word: לְיִשְׂחָק
  choice: kay Isaac
  rationale: Ang לְ ay tumutukoy sa taong pinatungkulan ng panunumpa; “kay Isaac” ang natural na katumbas sa Filipino.
theological_decisions:
- issue: Hindi inuulit sa Hebreo ang salitang “tipan,” na ipinagpapatuloy mula sa naunang talata.
  choice: “na ginawa niya kay Abraham”
  alternative: “na pinagtibay niya kay Abraham” o literal na “na pinutol niya kay Abraham”
  rationale: Hinahayaan ng salin na ang “tipan” sa talata 8 ang maging nauunang tinutukoy, gaya ng Hebreo. Hindi idinaragdag ang salitang “tipan” sa mismong talata, at hindi rin ginagamit ang di-natural na literal na idyomang “pinutol.”
translation_notes:
  register: Modernong Filipino na maikli, marangal, at angkop bilang pagpapatuloy ng naunang talata. Ginamit ang “panunumpa” upang panatilihin ang bigat at anyong pangngalan ng orihinal.
