translation:
  language: tl
  text: upang gapusin ang kanyang mga pinuno ayon sa kanyang kalooban[a], at turuan ng karunungan ang kanyang mga nakatatanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa/pamamagitan ng kanyang kaluluwa”; maaari ring isalin na “ayon sa kanyang nais.”
