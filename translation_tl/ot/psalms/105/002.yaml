base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: tl
  text: Umawit kayo sa kanya; umawit kayo ng mga papuri sa kanya; isalaysay ninyo ang lahat ng kanyang mga kamangha-manghang gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bulay-bulayin ninyo ang lahat ng kanyang mga kamangha-manghang gawa.” Ang pandiwang Hebreo ay maaaring tumukoy sa mapagnilay na pagbubulay o sa pasalitang pagsasalaysay; sa kontekstong ito ng pagpupuri, pinili ang diwa ng pampublikong pagsasalaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Pautos na maramihan ng שׁיר. Ang “umawit kayo” ay tuwiran, natural, at nagpapanatili sa panawagan sa buong sambayanan.
- source_word: ל֭וֹ
  choice: sa kanya
  rationale: Ang ל na may panghalip na hulapi ay tumutukoy sa pinag-uukulan ng awit at papuri; natural itong isalin na “sa kanya.”
- source_word: זַמְּרוּ
  choice: umawit kayo ng mga papuri
  rationale: Sa konteksto ng pagsamba, ang זמר ay tumutukoy sa pag-awit o pagtugtog bilang papuri. Pinananatili ng salin ang diwa ng papuri nang hindi ipinapalagay na may partikular na instrumentong ginagamit.
- source_word: שִׂיחוּ
  choice: ipahayag ninyo
  rationale: Maaaring mangahulugan ang שׂיח ng pagbubulay o pagsasalaysay. Sa magkakasunod na pampublikong utos ng pagpupuri rito, mas angkop ang komunikatibong diwang “ipahayag,” habang itinatala sa talababa ang tunay na lexical na posibilidad.
- source_word: בְּ/כָל
  choice: ang lahat ng
  rationale: Pagkatapos ng pandiwang nagpapahiwatig ng pagsasalaysay, likas sa Filipino na gawing tuwirang layon ang parirala. Pinananatili ng “lahat” ang saklaw ng כָל.
- source_word: נִפְלְאוֹתָיו
  choice: kanyang mga kamangha-manghang gawa
  rationale: Ang נִפְלָאוֹת ay tumutukoy sa pambihirang mga gawa na pumupukaw ng paghanga. Nililinaw ng “mga gawa” na mga ginawa ng Diyos ang tinutukoy, hindi lamang mga bagay na kahanga-hanga.
theological_decisions:
- issue: Kung ang שִׂיחוּ ay pampublikong pagsasalaysay o tahimik na pagbubulay
  choice: ipahayag ninyo
  alternative: bulay-bulayin ninyo; isalaysay ninyo
  rationale: Pinapaboran ng konteksto ng magkakasunod na utos sa sama-samang pagpupuri ang pampublikong pagpapahayag, ngunit hindi tuluyang inaalis ng Hebreo ang diwa ng mapagnilay na pagbubulay; kaya pinananatili ang mga posibilidad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang “kayo/ninyo” upang hayagang katawanin ang mga pautos na maramihan sa Hebreo. Ang pag-uulit ng “sa kanya” ay pinanatili upang maipakita ang paralelismo ng orihinal.
