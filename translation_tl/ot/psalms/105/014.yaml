  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: tl
  text: 'Hindi niya pinahintulutang apihin sila ng sinuman;

    sinaway niya ang mga hari alang-alang sa kanila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanila.”
