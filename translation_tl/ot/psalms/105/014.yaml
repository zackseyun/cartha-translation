  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang kilos ng Diyos sa Hebreo: hindi niya pinayagang apihin ang mga patriarka ng sinuman, at sinaway niya ang mga hari dahil sa/alang-alang sa kanila. Ang generic na אָדָם ay natural na naisalin bilang “sinuman,” at ang “mga hari” ay tiyak na katumbas ng מְלָכִים.'
