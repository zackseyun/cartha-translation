lexical_decisions:
- source_word: הִנִּיחַ
  choice: pinahintulutan
  rationale: Sa anyong causative, ipinahihiwatig ng pandiwa na hindi hinayaan o pinahintulutan ng Diyos na mangyari ang pang-aapi; natural at malinaw sa modernong Filipino ang “pinahintulutan.”
- source_word: אָדָם
  choice: sinuman
  rationale: Bagaman pang-isahang generic ang Hebreo, ang “sinuman” ang likas na paraan sa Filipino upang ipahayag na walang sinumang tao ang pinayagang gumawa nito.
- source_word: לְעָשְׁקָם
  choice: apihin sila
  rationale: Saklaw ng עשק ang pang-aapi, pagsasamantala, at maling pag-agaw; pinananatili ng “apihin” ang malawak at matinding diwa sa kontekstong ito.
- source_word: וַיּוֹכַח
  choice: sinaway niya
  rationale: Ang יכח dito ay tumutukoy sa matinding pagsita o pagsaway; dignified at karaniwang maunawaan ang “sinaway.”
- source_word: עֲלֵיהֶם
  choice: alang-alang sa kanila
  rationale: Ang parirala ay nagsasaad na kumilos ang Diyos dahil sa kanila o para sa kanilang kapakanan; natural sa Filipino ang “alang-alang sa kanila,” habang ang posibleng kaugnay na kahulugan ay itinatala sa talababa.
- source_word: מְלָכִים
  choice: mga hari
  rationale: Tuwirang katumbas ito ng pangngalang Hebreo at hindi kailangang palawakin bilang “mga pinuno.”
