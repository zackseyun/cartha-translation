  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: tl
  text: Pinarami niya nang lubha[a] ang kanyang bayan at ginawa silang mas malakas kaysa sa kanilang mga kaaway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ginawa niyang lubhang mabunga ang kanyang bayan.” Ang pandiwang Hebreo ay maaaring magdiin sa pagiging mabunga o sa pagdami.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ginawa niya itong mas malakas kaysa sa mga kaaway nito.” Isahan ang mga panghalip sa Hebreo dahil ang “kanyang bayan” ay isang kolektibong pangngalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: pinarami
  rationale: Ang Hiphil ng פרה ay nangangahulugang ‘gawing mabunga’ o ‘paramihin.’ Sa konteksto ng mabilis na pagdami ng Israel sa Ehipto, malinaw at natural sa modernong Tagalog ang ‘pinarami,’ habang inilalahad sa talababa ang larawan ng pagiging mabunga.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Ang עַם ay kolektibong tumutukoy sa isang bayan o sambayanan. Ang ‘kanyang bayan’ ay natural sa Tagalog at angkop sa salmong nagsasalaysay ng mga ginawa ng Diyos para sa Israel.
- source_word: מְאֹד
  choice: lubha
  rationale: Isa itong pang-abay na nagpapalakas sa antas. Ang ‘lubha’ ay maikli, marangal, at malinaw na naghahayag ng napakalaking pagdami.
- source_word: וַיַּעֲצִמֵהוּ
  choice: ginawa silang mas malakas
  rationale: Ang Hiphil ng עצם ay nangangahulugang ‘palakasin’ o ‘gawing makapangyarihan.’ Ipinahihiwatig ng kasunod na pariralang may מִן ang paghahambing, kaya ang ‘mas malakas’ ay tumpak at natural.
- source_word: מִצָּרָיו
  choice: kaysa sa kanilang mga kaaway
  rationale: Ang צַר ay maaaring tumukoy sa kaaway, kalaban, o umaapi. Sapat ang lawak ng ‘mga kaaway’ upang tukuyin ang mga Ehipsiyong umapi nang hindi nagdaragdag ng hindi tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Kolektibong pangngalan na may panghalip na isahan
  choice: Ginamit ang maramihang ‘sila/kanilang’ bilang pagtukoy sa kolektibong ‘kanyang bayan.’
  alternative: 'Panatilihin ang anyong isahan: ‘ginawa itong mas malakas kaysa sa mga kaaway nito.’'
  rationale: Isahan ang hulaping panghalip sa Hebreo dahil kolektibong isahan ang עַם, ngunit mas likas at malinaw sa Tagalog ang maramihang panghalip kapag ang tinutukoy ay mga taong bumubuo sa bayan. Pagpapasyang pangwika ito at hindi pagbago sa teolohikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang ‘pinarami’ para sa likas na pagpapahayag ng paglago ng populasyon; pinanatili sa talababa ang larawang ‘mabunga.’ Ginamit ang ‘bayan’ sa kolektibo at pambansang diwa, at maramihang mga panghalip para sa natural na pagtukoy sa mga taong bumubuo rito.
