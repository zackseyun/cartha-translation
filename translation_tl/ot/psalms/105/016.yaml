translation:
  language: tl
  text: Nagpasapit siya ng taggutom sa lupain; winasak niya ang buong suplay ng pagkain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “binali niya ang bawat tungkod ng tinapay,” isang Hebreong idyoma para sa suplay ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Nagpatawag siya ng
  rationale: Ang קרא na may רָעָב bilang layon ay nangangahulugang ipatawag o pasapitin ang taggutom. Likas sa Filipino ang “nagpatawag” at pinananatili nito ang tahasang pagkilos ng Diyos.
- source_word: רָעָב
  choice: taggutom
  rationale: Tumutukoy rito sa malawakang kakulangan ng pagkain sa lupain, hindi lamang sa personal na gutom.
- source_word: עַל הָאָרֶץ
  choice: sa lupain
  rationale: Ang “lupain” ay angkop sa kontekstong heograpiko at hindi nagpapahiwatig na buong daigdig ang saklaw.
- source_word: כָּל
  choice: lahat ng
  rationale: Malinaw nitong ipinahahayag ang kabuuang saklaw ng parirala.
- source_word: מַטֵּה לֶחֶם
  choice: panustos na pagkain
  rationale: Literal itong “tungkod ng tinapay,” isang Hebreong talinghaga para sa pagkaing sumusuporta o bumubuhay. Ang idiomatikong salin ay higit na malinaw sa karaniwang mambabasang Filipino, habang pinananatili sa talababa ang literal na larawan.
- source_word: שָׁבָר
  choice: sinira niya
  rationale: Ang pangunahing diwa ay “binali/sinira.” Dahil idiomatikong isinalin ang layon bilang panustos na pagkain, mas natural ang “sinira” kaysa “binali.”
theological_decisions:
- issue: Ang pagkilos ng Diyos sa taggutom
  choice: 'Pinanatiling Diyos ang di-tahasang simuno ng dalawang pandiwa: “Nagpatawag siya… sinira niya…”'
  alternative: Ilarawan ang taggutom bilang pangyayaring walang tahasang banal na tagapagpasimula.
  rationale: Sa nakapaligid na konteksto, ang PANGINOON ang simuno ng salaysay, at ang dalawang pandiwang panlalaking isahan ay natural na nagpapatuloy sa simunong iyon. Hindi dinaragdagan ng salin ang layunin o moral na paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “taggutom” at “lupain” bilang pamilyar na bokabularyong biblikal. Isinalin sa diwa ang Hebreong idyoma sa pangunahing teksto at inilagay sa talababa ang literal na talinghaga.
