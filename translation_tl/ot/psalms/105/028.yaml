  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: tl
  text: Nagpadala siya ng kadiliman at pinadilim niya; at hindi sila naghimagsik laban sa kanyang mga salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling bahagi, “at hindi sila naghimagsik laban sa kanyang salita [o utos].” Hindi tahasang sinasabi sa Hebreo kung sino ang “sila”; maaaring tumukoy ito sa mga Ehipsiyo o kina Moises at Aaron.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלַח
  choice: nagpadala
  rationale: Karaniwang katumbas ng pandiwang Hebreo para sa pagpapadala; likas at malinaw sa salaysay tungkol sa mga salot.
- source_word: חֹשֶׁךְ
  choice: kadiliman
  rationale: Tuwirang ipinapahayag ang matinding kawalan ng liwanag at ang kaugnayan nito sa salot ng kadiliman.
- source_word: וַיַּחְשִׁךְ
  choice: pinadilim niya ang lahat
  rationale: Pinananatili ang diwang sanhi ng anyong Hebreo—siya ang nagpangyaring dumilim—habang nagbibigay ng likas na pangungusap sa Tagalog nang hindi tahasang idinaragdag ang ‘lupain,’ na wala sa Hebreo.
- source_word: וְלֹא
  choice: at hindi
  rationale: Pinananatili ang payak na pag-uugnay at pagtanggi sa Hebreo, nang hindi nagdaragdag ng mas matinding pagsalungat.
- source_word: מָרוּ
  choice: naghimagsik
  rationale: Ipinahahayag ang diwa ng pagrerebelde o pagsuway na taglay ng pandiwang Hebreo.
- source_word: אֶת־דבריו
  choice: laban sa kanyang mga salita
  rationale: Pinananatili ang anyong maramihan ng tekstong Hebreo at ang diwa ng pagrerebelde laban sa sinabi ng Diyos.
theological_decisions:
- issue: Hindi tiyak ang tinutukoy ng nakatagong simuno sa ‘hindi sila naghimagsik.’
  choice: Panatilihin ang ‘sila’ nang hindi tinutukoy kung sino ang mga ito.
  alternative: Tukuyin sila bilang mga Ehipsiyo, o bilang sina Moises at Aaron.
  rationale: Hindi tahasang pinangalanan sa Hebreo ang simuno ng pandiwang maramihan. Maaaring tumukoy ito sa mga Ehipsiyo o kina Moises at Aaron; hindi nilulutas ng salin ang tunay na kalabuan ng teksto.
- issue: Maramihan o isahan ang diwa ng דבריו.
  choice: kanyang mga salita
  alternative: kanyang salita / kanyang utos
  rationale: Maramihan ang nakasulat na anyong Hebreo, kaya iyon ang pinananatili sa pangunahing teksto; inilalahad sa talababa ang posibleng pagkaunawang isahan o bilang utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘naghimagsik’ upang mapanatili ang bigat ng Hebreong pandiwa, at iniwasang tukuyin ang hindi hayag na simuno.
