  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: tl
  text: 'Nagsugo ang hari at pinalaya siya[a];

    ang pinuno ng mga bayan ay pinalaya siya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kinalagan siya” o “pinakawalan siya.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “binuksan siya” o “nagbukas para sa kanya”; ang idyoma ay nangangahulugang pinalaya siya mula sa pagkakakulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: nagpasugo
  rationale: Ang Qal perfect ay karaniwang nangangahulugang ‘nagsugo.’ Dahil walang tahasang layon sa Hebreo, likas sa Filipino ang ‘nagpasugo,’ na nagpapahiwatig na nagpadala ang hari ng utos o sugo nang hindi nagdaragdag ng tiyak na layon.
- source_word: מֶלֶךְ
  choice: ang hari
  rationale: Bagaman walang artikulo sa Hebreong patula, tiyak sa konteksto ang tinutukoy—ang hari ng Ehipto na nagpalaya kay Jose—kaya ang ‘ang hari’ ang likas na salin.
- source_word: וַיַּתִּירֵהוּ
  choice: pinalaya siya
  rationale: Ang pandiwa ay may diwang pagkalag o pagpapalaya mula sa pagkakatali. Ang ‘pinalaya siya’ ay malinaw at angkop sa konteksto ng pagkabilanggo.
- source_word: מֹשֵׁל עַמִּים
  choice: ang pinuno ng mga bayan
  rationale: Ang participle na מֹשֵׁל ay titulong ‘pinuno’ o ‘namamahala,’ at ang maramihang עַמִּים ay ‘mga bayan.’ Pinananatili ng salin ang maramihang kolektibong diwa at ang paralelismo sa ‘ang hari.’
- source_word: וַיְפַתְּחֵהוּ
  choice: nagpalaya sa kanya
  rationale: Literal na kaugnay ng ‘pagbukas’ ang פתח, ngunit sa kontekstong ito ang idyoma ay tumutukoy sa pagbubukas ng piitan o pag-alis sa pagkakakulong. Natural na ipinahahayag ito sa Filipino bilang ‘nagpalaya sa kanya.’
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatulad na ‘pinalaya’ sa dalawang hanay upang malinaw na maipahayag ang magkaparis na mga pandiwang Hebreo, habang inilagay sa talababa ang natatanging literal na larawan ng ikalawang pandiwa.
