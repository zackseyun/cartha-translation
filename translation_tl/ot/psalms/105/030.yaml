  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: tl
  text: 'Naglipana ang mga palaka sa kanilang lupain,


    maging sa mga silid ng kanilang mga hari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanilang mga hari.” Isahan ang “kanilang hari” sa salaysay ng salot sa Exodo (hal., Exodo 8), ngunit maramihan ang ginamit dito ng salmista, marahil bilang poetiko o panlahatang pagpapahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: naglipana
  rationale: Ipinahahayag ng pandiwa ang pagdami at pagkalat nang napakarami. Likas at malinaw sa makabagong Tagalog ang “naglipana” para sa isang matinding pagsalakay ng mga palaka.
- source_word: אַרְצָם
  choice: sa kanilang lupain
  rationale: Tuwirang ipinapahayag ng parirala ang lupaing pag-aari o tinitirhan nila, na sa konteksto ay Ehipto. Isinaayos ang pangungusap upang maging natural sa Tagalog nang hindi binabago ang diwa.
- source_word: צְפַרְדְּעִים
  choice: ang mga palaka
  rationale: Ito ang karaniwan at tiyak na kahulugan ng pangngalan sa salaysay ng salot.
- source_word: בְּחַדְרֵי
  choice: sa mga silid ng
  rationale: Ang pang-ukol at pangngalang maramihan ay tumutukoy sa kinaroroonan. Ang “mga silid” ay natural, malinaw, at angkop sa marangal na himig ng awit.
- source_word: מַלְכֵיהֶם
  choice: kanilang mga hari
  rationale: Tahasan itong anyong maramihan na may hulaping nangangahulugang “kanila.” Pinanatili ang maramihan sa halip na iayon sa isahang “hari” sa salaysay ng Exodo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naglipana” upang mapanatili ang masiglang larawan ng napakaraming palakang kumalat, at ang “maging” upang idiin na umabot sila kahit sa mga silid ng mga hari.
