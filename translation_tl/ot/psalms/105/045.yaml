  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: tl
  text: upang sundin nila ang kanyang mga tuntunin at tuparin ang kanyang mga tagubilin. Purihin si Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Purihin si Yah!” Ang Yah ay pinaikling anyo ng banal na pangalan; madalas ding isalin ang buong pananalita bilang “Aleluya” o “Purihin ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: upang
  rationale: Likas at maikli itong nagpapahayag ng layunin o nilalayong bunga sa makabagong Tagalog.
- source_word: יִשְׁמְרוּ חֻקָּיו
  choice: sundin nila ang kanyang mga tuntunin
  rationale: Sa kontekstong tipan at kautusan, ipinahahayag ng “sundin” ang aktuwal na pag-iingat at pagsasagawa; pinananatili ng “mga tuntunin” ang legal na diwa ng חֻקִּים.
- source_word: וְתוֹרֹתָיו יִנְצֹרוּ
  choice: at tuparin ang kanyang mga tagubilin
  rationale: Maaaring tumukoy ang maramihang תּוֹרוֹת sa mga tagubilin o kautusan. Ang “tuparin” ay natural na kaparis ng “sundin” at naghahatid ng maingat na pagsasagawa na taglay ng נצר nang hindi inuulit ang parehong pandiwa.
- source_word: הַלְלוּ יָהּ
  choice: Purihin si Yah!
  rationale: Isinasalin ang pautos na הַלְלוּ at pinananatili ang pinaikling banal na pangalang יָהּ bilang “Yah,” sa halip na ipagkamali ito sa buong anyong YHWH.
theological_decisions:
- issue: Paglalahad sa pinaikling banal na pangalan sa pangwakas na papuri
  choice: Purihin si Yah!
  alternative: Aleluya!; Purihin ang PANGINOON!
  rationale: Tahasang ginagamit ng Hebreo ang יָהּ, ang pinaikling anyo ng banal na pangalan. Pinananatili ng “Yah” ang pagkakaibang ito, samantalang malinaw na isinasalin ng “Purihin” ang pautos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinili ang “mga tuntunin” at “mga tagubilin” upang mapanatili ang pagkakaiba ng חֻקִּים at תּוֹרוֹת, habang ang magkatambal na “sundin” at “tuparin” ay natural sa Filipino at nagpapakita ng paralelismo ng Hebreo.
