  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: tl
  text: Binuksan niya ang bato, at bumulwak ang tubig; umagos ito sa mga tuyong lugar na parang ilog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “umagos ito sa mga tuyong lugar—isang ilog.” Walang tahasang salitang “parang” sa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: Binuksan
  rationale: Karaniwang kahulugan nito ang “buksan.” Hindi na idinagdag ang mas tiyak na larawang “biniyak,” sapagkat hindi iyon tahasang hinihingi ng Hebreo.
- source_word: צוּר
  choice: ang bato
  rationale: 'Bagaman walang pantukoy sa Hebreo, tiyak ang tinutukoy ayon sa konteksto: ang batong kaugnay ng pagbibigay ng tubig sa ilang.'
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: bumulwak ang tubig
  rationale: Ipinahihiwatig ng pandiwa ang pag-agos o paglabas ng tubig; likas sa Tagalog ang “bumulwak” para sa biglaan at masaganang paglabas nito mula sa bato.
- source_word: הָלְכוּ
  choice: umagos ito
  rationale: Literal na “nagpunta ang mga iyon,” na ang tinutukoy ay ang tubig. Ang “umagos ito” ang natural na paglalarawan sa Tagalog at gumagamit ng pang-isahang panghalip para sa pangngalang di-mabilang na “tubig.”
- source_word: בַּצִּיּוֹת
  choice: sa mga tuyong lugar
  rationale: Tumutukoy ito sa mga tigang o tuyong pook. Pinananatili ng salin ang malawak na diwa at hindi ito nililimitahan sa “mga disyerto.”
- source_word: נָהָר
  choice: na parang ilog
  rationale: Walang tahasang katumbas ng “parang” sa Hebreo, ngunit malamang na inilalarawan ng pangngalan ang anyo o paraan ng pag-agos. Natural at malinaw sa Tagalog ang paghahambing na “parang ilog.”
theological_decisions:
- issue: Pagtukoy sa pagkakaloob ng Diyos ng tubig sa Israel sa ilang
  choice: Isinalin bilang makasaysayan at patulang paglalarawan sa pagpapalabas ng Diyos ng tubig mula sa bato.
  alternative: Basahin bilang pangkalahatang talinghaga lamang ng pagkakaloob ng Diyos.
  rationale: Isinasalaysay ng Awit 105 ang kasaysayan ng Israel, kaya pangunahing tumutukoy ang talata sa pangyayari sa ilang. Hindi dinagdagan ang salin ng paliwanag na teolohikal upang manatiling pahiwatig ang mas malawak na kabuluhan nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang payak na paralelismo at matingkad na larawang patula ng Hebreo.
