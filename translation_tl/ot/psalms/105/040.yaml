  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: tl
  text: Humingi sila[a], at nagdala siya ng mga pugo; binusog niya sila ng tinapay ng langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isahan ang pandiwa sa Hebreo, sa literal ay “humingi siya”; malamang na kolektibo ang diwa at tumutukoy sa bayang Israel.
    reason: alternative_reading
  - marker: b
    text: O “tinapay mula sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאַל
  choice: Humingi sila
  rationale: Bagaman isahan ang anyong Hebreo, ang diwa sa konteksto ay malamang na kolektibo at tumutukoy sa bayang Israel. Pinananatili sa talababa ang literal na isahang anyo.
- source_word: וַיָּבֵא
  choice: at nagdala siya
  rationale: Ang Hiphil ng בוא ay may diwang ‘magdala’ o ‘paparatingin.’ Ang ‘nagdala siya’ ay natural sa Tagalog at malinaw na ang Diyos ang ipinahihiwatig na simuno.
- source_word: שְׂלָו
  choice: mga pugo
  rationale: Ito ang karaniwang kahulugan ng salitang Hebreo at tumutukoy sa ibong inilaan ng Diyos sa ilang.
- source_word: לֶחֶם שָׁמַיִם
  choice: tinapay ng langit
  rationale: Malapit ito sa literal na konstruksiyong Hebreo at pinananatili ang matulaing pananalita. Posible rin ang ‘tinapay mula sa langit,’ kaya inilagay iyon sa talababa.
- source_word: יַשְׂבִּיעֵם
  choice: binusog niya sila
  rationale: Ang Hiphil ng שׂבע ay nangangahulugang magbigay hanggang mabusog o masiyahan. Ang ‘binusog’ ay likas at malinaw sa modernong Tagalog.
theological_decisions:
- issue: Simuno ng pambungad na pandiwang שָׁאַל
  choice: 'Inunawa ang simuno bilang kolektibong Israel: “Humingi sila.”'
  alternative: Mas literal na “Humingi siya,” na maaaring tumukoy sa Israel bilang isang kolektibong persona o sa isang kinatawan.
  rationale: Isinasalaysay ng konteksto ang mga ginawa ng Diyos para sa Israel sa ilang, at sinusuportahan ng pangmaramihang hulaping layon sa “binusog niya sila” ang kolektibong pagbasa. Gayunman, hindi itinatago ang isahang anyo ng Hebreo at inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal at matulaing angkop sa Mga Awit. Ginamit ang “binusog” sa halip na mas abstraktong “bနigyang-kasiyahan” upang malinaw na maipahayag ang kasapatan ng pagkaing ipinagkaloob.
