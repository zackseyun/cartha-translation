  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: tl
  text: Natuwa ang Ehipto nang umalis ang Israel, sapagkat binalot ng takot sa Israel ang mga taga-Ehipto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: Natuwa
  rationale: Ang Qal perfect ay nagsasaad ng natapos na reaksiyon o kalagayan ng kagalakan. Ang “natuwa” ay natural at malinaw sa makabagong Filipino.
- source_word: מִצְרַיִם
  choice: ang Ehipto
  rationale: Ginamit ang pangalan ng bansa bilang kolektibong tawag sa mga mamamayan nito, gaya ng metonimiya sa Hebreo.
- source_word: בְּצֵאתָם
  choice: nang umalis ang Israel
  rationale: 'Ang בְּ na kasunod ng infinitive construct ay temporal: “nang umalis.” Nilinaw ang tinutukoy ng hulaping pangmaramihan bilang Israel upang maiwasan ang nakalilitong sunod-sunod na panghalip sa Filipino.'
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagkatuwa ng Ehipto. Ang “sapagkat” ay angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: נָפַל פַּחְדָּם עֲלֵיהֶם
  choice: binalot ng takot sa Israel ang mga taga-Ehipto
  rationale: Ang literal na larawan ay takot na “nahulog/dumating sa” kanila. Ang “binalot ng takot” ay natural na idyomang Filipino para sa takot na sumapit at nanaig sa kanila. Nilinaw na ang kinatatakutan ay ang Israel at ang natakot ay ang mga taga-Ehipto.
