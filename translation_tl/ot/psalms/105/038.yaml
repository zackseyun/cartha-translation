  register: Makabago, malinaw, at marangal na Filipino. Nilinaw ang magkaibang tinutukoy ng mga hulaping panghalip sa Hebreo—Israel sa “paglabas nila” at mga taga-Ehipto sa “sa kanila”—nang hindi dinaragdagan ang teolohikal na diwa.
