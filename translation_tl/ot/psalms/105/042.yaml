lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag sa naunang ginawa ng Diyos; natural at marangal na katumbas ang “Sapagkat” sa daloy ng salmo.
- source_word: זָכַר
  choice: inalala
  rationale: Pinananatili nito ang biblikal na idyoma ng pag-alaala, na sa konteksto ay hindi lamang paggunita sa isip kundi pagkilos ayon sa naunang sinabi.
- source_word: דְּבַר קָדְשׁוֹ
  choice: ang kanyang banal na salita
  rationale: Tuwirang pinananatili ang דָּבָר bilang “salita” at ang קֹדֶשׁ bilang “banal,” habang ipinapaliwanag sa talababa ang kahulugang pangako sa konteksto.
- source_word: אֶת אַבְרָהָם עַבְדּוֹ
  choice: at si Abraham na kanyang lingkod
  rationale: Ang ikalawang אֶת ay likas na mababasa bilang pananda sa isa pang tuwirang layon ng “inalala.” Idinagdag ang “at” bilang kinakailangang likas na pag-uugnay sa Filipino, hindi bilang bagong nilalaman.
theological_decisions:
- issue: Tipanang diwa ng “inalala”
  choice: Panatilihin ang “inalala” sa pangunahing teksto.
  alternative: “tinupad ang kanyang pangako”
  rationale: May tipanang puwersa ang pandiwa sa konteksto, ngunit hindi tahasang sinasabi ng Hebreo na “tinupad”; iniiwasan ng salin ang labis na pagpapakahulugan.
- issue: Ugnayan ng banal na salita at ni Abraham
  choice: 'Ipakita bilang dalawang layon ng pag-alaala: ang banal na salita at si Abraham.'
  alternative: “ang banal niyang salita kay Abraham na kanyang lingkod”
  rationale: Dalawang ulit na ginagamit ng tekstong Hebreo ang אֶת, at may pangunahing hinto pagkatapos ng קָדְשׁוֹ, kaya malakas ang pagbasa na kapuwa inalala ang salita at si Abraham. Gayunman, posible ring iugnay si Abraham sa salitang ipinahayag sa kanya; itinatala ito sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang “lingkod” sa halip na “alipin” dahil iyon ang angkop na katawagan kay Abraham sa kanyang kaugnayan sa Diyos. Pinanatili ang maikli at patulang ayos ng talata.
