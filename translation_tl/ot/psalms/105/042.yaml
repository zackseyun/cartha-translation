translation:
  language: tl
  text: Sapagkat inalala niya ang banal niyang salita,[a] at si Abraham na kanyang lingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “salita” rito ay maaari ring unawain sa diwa ng isang pangakong binitiwan ng Diyos.
    reason: lexical_alternative
  - marker: b
