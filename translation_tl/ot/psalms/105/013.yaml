translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “nagpalipat-lipat” upang ipakita ang paulit-ulit na paggalaw; inilagay sa talababa ang mas pormal at mas malapit-sa-anyo na “naglakbay-lakbay.”
