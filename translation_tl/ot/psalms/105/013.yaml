translation:
  language: tl
  text: Naglakbay-lakbay sila mula sa isang bansa tungo sa iba, mula sa isang kaharian tungo sa ibang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpalipat-lipat sila mula sa isang bansa tungo sa iba, mula sa isang kaharian tungo sa ibang bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: Nagpalipat-lipat sila
  rationale: Ang hitpael ng הלך ay nagpapahiwatig dito ng paulit-ulit na paggalaw sa iba't ibang lugar, hindi ng iisang tuwirang paglalakbay. Likas sa modernong Filipino ang “nagpalipat-lipat” at angkop sa paglalakbay ng mga patriyarka sa konteksto.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: sa iba't ibang bansa
  rationale: Ipinahahayag nito ang paggalaw mula sa isang bansa tungo sa iba. Mas natural sa Filipino ang “sa iba't ibang bansa” kasunod ng “nagpalipat-lipat,” bagaman hindi nito ginagaya nang salita-sa-salita ang Hebreong pag-uulit.
- source_word: מִמַּמְלָכָה
  choice: mula sa isang kaharian
  rationale: Ang “isang” ay likas na idinagdag sa pares na “mula sa isang… tungo sa ibang…” upang malinaw na maipahayag ang distributibong diwa ng Hebreo.
- source_word: אֶל עַם אַחֵר
  choice: tungo sa ibang bayan
  rationale: Pinananatili ng “bayan” ang pagkakaiba ng עַם, isang pangkat ng mga tao, sa מַמְלָכָה, “kaharian.” Ang “ibang” ay tuwirang kumakatawan sa אַחֵר.
