  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: tl
  text: Kinain nito ang lahat ng halaman[a] sa kanilang lupain, at kinain nito ang bunga[b] ng kanilang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “damo.” Maaaring tumukoy ang Hebreong עֵשֶׂב sa damo mismo o, sa mas malawak na diwa, sa mga tumutubong halaman.
    reason: lexical_alternative
  - marker: b
    text: O “ani.” Sa kontekstong pansakahan, ang “bunga” ay maaari ring mangahulugang ani o anumang ibinubunga ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: nilamon nito
  rationale: Ang pandiwa ay ikatlong panauhang panlalaking isahan at tumutukoy sa kolektibong salot sa naunang konteksto. Pinananatili ng “nito” ang anyong isahan nang hindi ito ginagawang personal na lalaki, at ipinahihiwatig ng “nilamon” ang ganap at mapaminsalang pagkain.
- source_word: כָּל
  choice: lahat ng
  rationale: Tuwirang ipinahahayag ng salita ang kabuuan o total na saklaw.
- source_word: עֵשֶׂב
  choice: halaman
  rationale: Maaaring tumukoy ang Hebreo sa damo o, sa mas malawak na diwa, sa luntiang tumutubo. Ang “halaman” ay natural at sapat na malawak para sa konteksto ng salot.
- source_word: בְּאַרְצָם
  choice: sa kanilang lupain
  rationale: Ipinakikita ng pang-ukol ang kinaroroonan, at pinananatili ng “lupain” ang teritoryal na diwa ng אֶרֶץ.
- source_word: פְּרִי
  choice: bunga
  rationale: Ang pangunahing kahulugan ay “bunga,” ngunit maaari rin itong tumukoy sa ani o produkto ng lupa. Pinananatili ng “bunga” ang kongkretong larawan ng Hebreo.
- source_word: אַדְמָתָם
  choice: kanilang lupa
  rationale: Tumutukoy ang אֲדָמָה sa lupa o lupang tinataniman. Ang “lupa” ay natural sa Filipino at nagpapanatili ng bahagyang pagkakaiba sa naunang “lupain.”
