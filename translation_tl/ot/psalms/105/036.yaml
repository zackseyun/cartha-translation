translation:
  language: tl
  text: Pinatay niya ang bawat panganay sa kanilang lupain—ang unang bunga ng lahat nilang lakas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang unang supling ng lahat nilang sigla.” Ang pananalitang Hebreo ay tumutukoy sa mga panganay bilang unang pagpapahayag ng lakas o kakayahang magkaanak.
