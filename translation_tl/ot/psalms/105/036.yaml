lexical_decisions:
- source_word: וַיַּךְ
  choice: Pinatay niya
  rationale: Ang Hiphil ng נכה ay nangangahulugang humampas o manakit; sa konteksto ng salot sa mga panganay, malinaw na nakamamatay ang pagkilos, kaya natural at tumpak ang “pinatay.”
- source_word: כָּל־בְּכוֹר
  choice: ang bawat panganay
  rationale: Pinananatili ng “bawat” ang distributibong diwa ng כָּל kasama ng pang-isahang בְּכוֹר.
- source_word: בְּאַרְצָם
  choice: sa kanilang lupain
  rationale: Tuwirang ipinapahayag ang heograpikong diwa ng אֶרֶץ at ang panlalaking maramihang hulaping paari.
- source_word: רֵאשִׁית
  choice: ang unang bunga
  rationale: Ang רֵאשִׁית ay tumutukoy sa una o pasimulang bahagi; ang “unang bunga” ay likas sa Filipino at pinananatili ang talinghagang tumutukoy sa mga unang supling.
- source_word: לְכָל־אוֹנָם
  choice: ng lahat nilang lakas
  rationale: Dito, ang לְ ay nagpapakita ng kaugnayang maihahayag sa Filipino sa pamamagitan ng “ng.” Ang אוֹן ay lakas o sigla at maaari ring magpahiwatig ng kakayahang magkaanak.
theological_decisions:
- issue: Di-binanggit na simuno ng pandiwa
  choice: “niya,” na tumutukoy sa Diyos
  alternative: Ulitin ang “Diyos” bilang tahasang simuno
  rationale: Pangatlong panauhang panlalaking pang-isahan ang simuno sa Hebreo at mula sa naunang konteksto ay tumutukoy sa Diyos. Pinananatili ng panghalip ang pagkakaugnay ng salaysay nang hindi nagdaragdag ng pangngalang wala sa talata.
- issue: Kahulugan ng “unang bunga ng lahat nilang lakas”
  choice: Panatilihin ang matalinghagang pananalita
  alternative: “ang unang supling ng kanilang sigla”
  rationale: Ang Hebreo ay may sadyang masinsing idyoma na nag-uugnay sa panganay sa unang pagpapahayag ng lakas o kakayahang magkaanak. Hindi ito dapat paliitin sa isang tiyak na interpretasyon sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pinatay” upang malinaw na maipahayag ang nakamamatay na bunga sa konteksto, samantalang pinanatili ang talinghagang “unang bunga ng lahat nilang lakas” at ipinaliwanag ang saklaw nito sa talababa.
