  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: tl
  text: Isinugo niya si Moises na kanyang lingkod, si Aaron na kanyang pinili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na dati na niyang pinili,” kung itinatampok na nauna ang pagpili kay Aaron bago siya isinugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Isinugo niya
  rationale: Ang Qal perfect na 3ms ng שלח ay likas na isinasaling “isinugo niya.” Ang di-binanggit na simuno ay tumutukoy sa Diyos ayon sa konteksto.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Ang עֶבֶד na may hulaping 3ms ay maaaring mangahulugang alipin o lingkod; sa marangal na paglalarawan kay Moises bilang naglilingkod sa Diyos, “lingkod” ang angkop at likas.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na pang-ugnay sa Tagalog para sa sugnay na naglalarawan kay Aaron.
- source_word: בָּחַר בּוֹ
  choice: kanyang pinili
  rationale: Ang בחר na may ב ay nagsasaad ng pagpili sa isang tao, at ang hulapi sa בּוֹ ay tumutukoy kay Aaron. Hindi minamarkahan ng pandiwang Hebreo kung ang pagpili ay ipinapakitang nauna sa pagsusugo.
theological_decisions:
- issue: Di-binanggit na simuno ng pandiwa
  choice: “niya,” na tumutukoy sa Diyos
  alternative: Tahasang sabihing “Isinugo ng PANGINOON”
  rationale: May implicit na ikatlong panauhang panlalaking simuno ang Hebreo, na malinaw sa konteksto. Pinananatili ng “niya” ang daloy nang hindi nagdaragdag ng pangngalang wala sa talata.
- issue: Ugnayang pamanahon ng pagpili kay Aaron at ng pagsusugo
  choice: “kanyang pinili,” na hindi tahasang nagtatakda ng pluperfect
  alternative: “kanyang pinili noon” o “na dati na niyang pinili”
  rationale: Simple perfect ang בָּחַר. Bagaman lohikal na maaaring nauna ang pagpili sa pagsusugo, hindi kailangang gawing tahasan iyon sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “isinugo” upang mapanatili ang biblikal na diwa ng pagpapadala na may atas, at “lingkod” bilang marangal na katawagan kay Moises.
