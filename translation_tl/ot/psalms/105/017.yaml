  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: tl
  text: Nagsugo siya ng isang lalaki na mauna sa kanila—si Jose, na ipinagbili bilang alipin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: Nagsugo siya
  rationale: Ang Qal perfect na pandiwa ay payak na nagsasaad na nagsugo ang Diyos, na siyang ipinahihiwatig na simuno ayon sa konteksto.
- source_word: לִפְנֵיהֶם
  choice: na mauna sa kanila
  rationale: Ipinapahayag nito sa likas na modernong Tagalog ang pagpapadala kay Jose nang mas maaga kaysa sa kanila; pinananatili ang diwa ng literal na 'sa unahan nila.'
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang tiyak na panlalaking pangngalan sa Hebreo at ang pagkakakilanlan nito kay Jose.
- source_word: לְעֶבֶד
  choice: bilang alipin
  rationale: Sa konteksto ng pagkakapagbili kay Jose, malinaw na sapilitang pagkaalipin ang kalagayan, hindi karaniwang paglilingkod.
- source_word: נִמְכַּר
  choice: ipinagbili
  rationale: Tuwirang ipinapahayag ang pasibong anyo at ang salaysay tungkol sa pagbebenta kay Jose.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa modernong Bibliyang Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa עֶבֶד sa konteksto ng pagkakapagbili kay Jose
  choice: alipin
  alternative: lingkod
  rationale: Bagaman maaaring mangahulugan ng 'lingkod' ang salita sa ibang konteksto, ang pandiwang 'ipinagbili' rito ay malinaw na tumutukoy sa kalagayan ng pagkaalipin.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Tagalog. Ang gitling na em ay nag-uugnay sa 'isang lalaki' at kay Jose nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
