  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: tl
  text: Hanapin ninyo si Yahweh at ang kanyang lakas; hanapin ninyo palagi ang kanyang mukha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanapin ninyo palagi ang kanyang presensiya.” Literal sa Hebreo, “hanapin ninyo palagi ang kanyang mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Hanapin ninyo
  rationale: Ang maramihang pautos ng דרשׁ ay tumutukoy rito sa taimtim na paglapit at paghahanap kay Yahweh, hindi lamang sa pagtatanong. Likas at malinaw sa modernong Filipino ang “hanapin ninyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וְעֻזּוֹ
  choice: at ang kanyang lakas
  rationale: Ang עֹז ay nangangahulugang lakas, kapangyarihan, o kalakasan. Ang “lakas” ang pinakadirekta at natural na katumbas, at pinananatili ang panghalip na tumutukoy kay Yahweh.
- source_word: בַּקְּשׁוּ
  choice: hanapin ninyo
  rationale: Ang maramihang pautos ng בקשׁ ay nagpapahiwatig ng aktibong paghahanap. Ang pag-uulit ng “hanapin ninyo” ay nagpapanatili sa maikli at mariing paralelismo ng Hebreo.
- source_word: פָנָיו
  choice: ang kanyang mukha
  rationale: Literal itong “kanyang mukha.” Bagaman maaaring tumukoy ang idyoma sa presensiya, pinananatili ng salin ang kongkreto at relasyonal na larawan ng Hebreo.
- source_word: תָּמִיד
  choice: palagi
  rationale: Ipinahahayag ng תָּמִיד ang patuloy o regular na pagkilos. Natural sa kasalukuyang Filipino ang “palagi” at hindi nito kinakailangang ipakahulugan na walang anumang sandaling paghinto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kung isasalin ang פָנָיו bilang “kanyang mukha” o “kanyang presensiya”
  choice: ang kanyang mukha
  alternative: ang kanyang presensiya
  rationale: Maaaring mangahulugan ang idyoma ng presensiya, ngunit pinananatili ng “kanyang mukha” ang tunay na antropomorpiko at relasyonal na larawan ng Hebreo nang hindi agad nilulutas ang saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” upang katawanin ang mga pautos na plural, at pinanatili ang maikli at patulang paralelismo ng orihinal.
