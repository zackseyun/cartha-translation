  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: tl
  text: Ibinaling niya ang puso nila[a] upang kamuhian ang kanyang bayan at pakitunguhan nang may panlilinlang ang kanyang mga lingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang puso nila” ay nasa anyong isahan at kolektibong tumutukoy sa buong pangkat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “magpakana laban sa kanyang mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַךְ
  choice: ibinaling
  rationale: Ang pandiwa ay maaaring mangahulugang ‘ibaling,’ ‘baguhin,’ o ‘baligtarin.’ Sa pariralang may ‘puso,’ malinaw at natural ang ‘ibinaling’ at napananatili nito ang tuwirang pagkilos ng Diyos.
- source_word: לִבָּם
  choice: ang puso nila
  rationale: Isahan ang ‘puso’ sa Hebreo ngunit maramihan ang nagmamay-ari. Pinananatili ng salin ang kolektibong paglalarawan sa panloob na disposisyon ng buong pangkat.
- source_word: לִשְׂנֹא
  choice: upang kamuhian
  rationale: Tuwirang ipinapahayag ng pawatas ang layunin o bunga ng pagbaling sa kanilang puso. Ang ‘upang’ ay likas sa Filipino habang hindi nilulutas kung layunin o bunga ang diin.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ang עַם ay tumutukoy rito sa Israel bilang bayang pag-aari ng Diyos; ang ‘bayan’ ang natural at marangal na katumbas.
- source_word: לְהִתְנַכֵּל
  choice: magpakana laban
  rationale: Ipinahihiwatig ng anyong ito ang tuso, mapanlinlang, at masamang pagkilos. Ang ‘magpakana laban’ ay maikli at natural, at malinaw na ipinapakita ang pagkapoot na nakatuon sa mga lingkod ng Diyos.
- source_word: בַּעֲבָדָיו
  choice: laban sa kanyang mga lingkod
  rationale: Sa kasunod ng pandiwang nagsasaad ng mapanlinlang na pakana, ang pang-ukol ay natural na isinasaling ‘laban sa.’ Ang ‘mga lingkod’ ay angkop sa Israel sa kaugnayang ito at hindi labis na nagdidiin sa kalagayang pagkaalipin.
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa pagbaling sa disposisyon ng mga Ehipsiyo
  choice: Ibinaling niya ang puso nila
  alternative: Hinayaan niyang mabaling ang puso nila
  rationale: Tuwiran ang pandiwang Hebreo at ang Diyos ang ipinahihiwatig na simuno ayon sa konteksto. Hindi pinalalambot ng salin ang pagkilos ng Diyos, kaya nananatili ang tensiyon sa pagitan ng kanyang soberanya at ng mapoot na pagkilos ng mga tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kanyang’ ayon sa karaniwang modernong baybay. Pinanatili ang kolektibong isahan na ‘puso’ at ang tuwirang pagkilos ng Diyos; nilagyan ng talababa ang parehong Hebreong anyo at ang leksikal na alternatibo sa mapanlinlang na pagkilos.
