translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Pinanatili ang talata bilang sugnay na nagpapatuloy sa kasunod na talata, kaya nagtatapos ito sa kuwit. Ang mga gitling ay nagpapalinaw sa pag-uulit na nagbibigay-diin sa napakaliit nilang bilang.
