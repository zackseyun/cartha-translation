  text: בִּֽ֭/הְיוֹתָ/ם מְתֵ֣י מִסְפָּ֑ר כִּ֝/מְעַ֗ט וְ/גָרִ֥ים בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: tl
  text: Noong kakaunti pa sila—napakakaunti lamang—at mga dayuhang naninirahan doon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dayuhan o pansamantalang naninirahan doon.” Ang salitang Hebreo ay tumutukoy sa mga taong naninirahan bilang dayuhan sa lupaing hindi kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: Noong … pa sila
  rationale: Ang ב na sinusundan ng infinitive construct ng היה at hulaping 3mp ay bumubuo ng sugnay na temporal. Likas sa modernong Tagalog ang “Noong … pa sila” at ipinahihiwatig din nito ang kalagayan nila noong panahong iyon.
- source_word: מְתֵי מִסְפָּר
  choice: kakaunti
  rationale: Ang idyoma ay tumutukoy sa maliit at madaling bilangin na pangkat. Sapat at natural sa Tagalog ang “kakaunti,” samantalang magiging pilit ang literal na “mga taong may bilang.”
- source_word: כִּמְעַט
  choice: napakakaunti lamang
  rationale: Sa konteksto, pinatitindi nito ang naunang ideya ng kakaunting bilang. Ipinapahayag ng “napakakaunti lamang” ang diin nang hindi ito ginagawang “halos wala,” na maaaring lumabis sa kahulugan.
- source_word: וְגָרִים
  choice: at mga dayuhang naninirahan
  rationale: Ang גרים ay mga taong naninirahan bilang dayuhan sa lupaing hindi kanila. Pinagsasama ng parirala ang pagiging banyaga at ang aktuwal na paninirahan, na mas tiyak kaysa sa “mga estranghero” lamang.
- source_word: בָּהּ
  choice: doon
  rationale: Ang hulaping pambabaeng isahan ay tumutukoy sa lupaing binanggit sa konteksto. Natural sa Tagalog ang “doon” at hindi na kailangang ulitin ang salitang “lupain,” na wala mismo sa talata.
