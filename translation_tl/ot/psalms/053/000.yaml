  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: ayon sa Mahalat[a]. Isang Maskil[b] ni David[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring pangalan ito ng isang himig o isang terminong musikal o liturhiko; hindi tiyak ang kahulugan ng “Mahalat.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Maskil” ay isang teknikal na katawagan sa mga pamagat ng salmo, na maaaring tumukoy sa isang akdang mapagturo o mapagnilay.
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreong pariralang isinaling “ni David” ay maaaring magpahiwatig ng pagkakatha, kaugnayan, pag-aalay, o pagkabilang sa isang koleksiyong nauugnay kay David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa musikal na pagtatanghal. Likas at malinaw sa makabagong Filipino ang “tagapangasiwa ng awitan,” at hindi nito nililimitahan ang tungkulin sa koro lamang.
- source_word: עַל
  choice: ayon sa
  rationale: Sa kontekstong musikal, maaari nitong ipakilala ang himig, estilo, o tagubilin sa pag-awit. Pinananatiling bukas ng “ayon sa” ang tiyak na teknikal na kahulugan.
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Hindi tiyak kung pangalan ito ng himig o isang terminong musikal o liturhiko. Mas ligtas ang transliterasyon kaysa sa haka-hakang pagsasaling “karamdaman.”
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Teknikal itong katawagan sa mga pamagat ng salmo at hindi tiyak ang eksaktong diwa. Iniiwasan ng transliterasyon ang labis na pagtutukoy bilang “mapagturo” o “mapagnilay.”
- source_word: לְדָוִד
  choice: ni David
  rationale: Ito ang pinakanatural at maikling anyo sa pamagat ng isang akda sa Filipino. Dahil maaaring magpahiwatig ang Hebreong לְ ng pagkakatha, kaugnayan, pag-aalay, o pagkabilang sa isang koleksiyon, nililinaw sa talababa ang lawak ng posibilidad.
theological_decisions:
- issue: Katayuan ng pamagat at kaugnayan nito kay David
  choice: Isinalin ang pamagat bilang bahagi ng tekstong Hebreo at ginamit ang “ni David” na may talababa tungkol sa saklaw ng לְדָוִד.
  alternative: Tahasang “isinulat ni David,” “para kay David,” o ituring ang pamagat bilang editoryal na materyal na hindi isinasalin.
  rationale: Bahagi ng tekstong Masoretiko ang pamagat. Hindi dapat gawing tahasang pahayag ng pagkakatha ang pariralang Hebreo, kaya iniwasan ang “isinulat ni David” at pinanatili sa talababa ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Mahalat” at “Maskil” bilang mga teknikal na terminong hindi tiyak ang kahulugan, habang inilagay ang paliwanag sa mga talababa. Ang bantas at ayos ay nagpapakitang magkakahiwalay ang tagubilin sa tagapangasiwa, ang terminong Mahalat, ang uri ng akda, at ang kaugnayan kay David.
