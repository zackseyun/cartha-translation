  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: tl
  text: O, kung magmumula sana sa Zion ang kaligtasan ng Israel! Kapag ipinanumbalik ng Diyos ang kapakanan ng kanyang bayan[a], magalak nawa si Jacob; magsaya nawa ang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapag ibinabalik ng Diyos ang kanyang bayang nasa pagkabihag.” Ang Hebreong idyoma ay maaaring tumukoy sa pangkalahatang pagpapanumbalik mula sa kapighatian, na madalas na kabilang ang pagbabalik mula sa pagkabihag.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: O, kung ... sana
  rationale: Ang Hebreong idyoma ay nagpapahayag ng marubdob na paghahangad, hindi literal na tanong. Likas sa modernong Tagalog ang “O, kung ... sana” para sa ganitong panalanging pagnanais.
- source_word: מִצִּיּוֹן
  choice: manggagaling sa Zion
  rationale: Ipinapakita ng מִן ang pinagmulan; malinaw at natural sa Tagalog ang pandiwang “manggagaling sa.”
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: ang kaligtasan ng Israel
  rationale: Bagaman anyong maramihan ang יְשֻׁעוֹת, maaari itong gumana bilang abstrakto o masidhing pangngalan. Ang isahang “kaligtasan” ang natural na katumbas sa Tagalog.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: Kapag ipinanumbalik ng Diyos ang mabuting kalagayan ng kanyang bayan
  rationale: Ang בְּ plus infinitive ay temporal, at ang tambalang שׁוּב שְׁבוּת ay karaniwang tumutukoy sa pagbabaligtad ng paghihirap at pagpapanumbalik, hindi lamang sa literal na pagbabalik mula sa pagkabihag.
- source_word: יָגֵל יַעֲקֹב
  choice: magalak nawa ang Jacob
  rationale: Pinananatili ng “nawa” ang mapanalangin at optatibong himig ng talata, habang ang “magalak” ay angkop sa יָגֵל.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: magsaya nawa ang Israel
  rationale: Ang “magsaya” ay natural at bahagyang naiiba sa “magalak,” kaya napapanatili ang leksikal na pagkakaiba sa paralelismong patula.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang שׁוּב שְׁבוּת
  choice: ipinanumbalik ... ang mabuting kalagayan ng kanyang bayan
  alternative: ibinalik ... mula sa pagkabihag ang kanyang bayan / ibinalik ang mga bihag ng kanyang bayan
  rationale: Masaklaw ang Hebreong idyoma at maaaring tumukoy sa pangkalahatang pagbabaligtad ng kapighatian, bagaman maaari rin itong magsangkot ng literal na pagbabalik mula sa pagkabihag. Ginamit sa pangunahing teksto ang mas malawak na diwa at inilagay sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “O, kung ... sana” at “nawa” upang mapanatili ang masidhing pagnanais at mapanalanging himig. Pinanatili ang Zion, Jacob, at Israel bilang mga pangalang biblikal at ang patulang paralelismo ng huling dalawang sugnay.
