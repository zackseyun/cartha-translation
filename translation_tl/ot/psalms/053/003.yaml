base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: tl
  text: Lahat sila ay lumihis; sama-sama silang naging tiwali[a]. Walang gumagawa ng mabuti, wala kahit isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging marumi.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging tiwali, marumi, o bahid ng kasamaan sa moral na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: Lahat sila
  rationale: Likas na Filipino para sa kolektibong saklaw ng buong pangkat.
- source_word: סָג
  choice: ay lumihis
  rationale: Ipinahahayag ang paglihis mula sa tamang daan nang hindi dinaragdagan ng mas tiyak na doktrinal na kahulugan.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Pinananatili ang kolektibong diin ng pang-abay at natural sa makabagong Filipino.
- source_word: נֶאֱלָחוּ
  choice: naging tiwali
  rationale: Malinaw na naghahatid ng moral na pagkasira; maaari ring tumukoy ang Hebreo sa pagiging marumi o karima-rimarim, kaya inilakip ang alternatibo sa talababa.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Walang gumagawa ng mabuti
  rationale: Direkta at natural na ipinapahayag ang ganap na pagtanggi sa pagkakaroon ng taong gumagawa ng mabuti.
- source_word: גַּם אֶחָד
  choice: wala kahit isa
  rationale: Pinananatili ang mariing pagpapalakas sa naunang pagtanggi.
theological_decisions:
- issue: Saklaw ng moral na paghatol sa talata
  choice: 'Panatilihin ang pangkalahatang pananalita: “Lahat sila… Walang… wala kahit isa.”'
  alternative: Limitahan ang pahayag sa isang mas makitid na pangkat lamang ng masasamang tao.
  rationale: Komprehensibo ang mismong pananalita ng Hebreo. Pinananatili ng salin ang saklaw nito sa kontekstong patula nang hindi nagdaragdag ng isang mas malawak na sistemang doktrinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tiwali” upang malinaw na ipahiwatig ang moral na kabulukan, habang pinananatili sa talababa ang mas kongkretong larawan ng pagiging marumi.
