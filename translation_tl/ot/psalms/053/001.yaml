base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: tl
  text: Sinasabi ng hangal sa kanyang puso, “Walang Diyos.” Sila ay tiwali at gumawa ng kasuklam-suklam na kawalang-katarungan.[a] Walang sinumang gumagawa ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “gumawa sila ng kasuklam-suklam na kasamaan” o “ginawa nilang kasuklam-suklam ang kanilang mga gawa.” Pinagsasama ng Hebreo ang pandiwang tumutukoy sa pagiging kasuklam-suklam at ang pangngalang nangangahulugang mali o kawalang-katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: hangal
  rationale: Tumutukoy ito hindi lamang sa kakulangan sa talino kundi sa taong salat sa wastong paghatol at masama ang asal sa harap ng Diyos. Ang “hangal” ang likas at nakaugaliang katumbas sa wikang biblikal.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Pinananatili nito ang larawang Hebreo ng puso bilang kaloob-looban ng pag-iisip, pagpapasya, at disposisyon, sa halip na paliitin ito sa tahimik na pagsasalita lamang.
- source_word: אֵין אֱלֹהִים
  choice: Walang Diyos
  rationale: Tuwirang pinananatili ang maikli at mariing pahayag ng Hebreo. Ginamit ang malaking titik dahil ang Diyos ng Israel ang tinutukoy sa konteksto.
- source_word: הִשְׁחִיתוּ
  choice: Nagpakasama sila
  rationale: Ipinahahayag nito ang naging tiwaling kalagayan at kilos ng maramihang paksa. Pinananatili rin nito ang paglipat ng Hebreo mula sa isang kinatawang hangal tungo sa marami.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: at gumawa ng kasuklam-suklam na kawalang-katarungan
  rationale: Pinagsasama ng pariralang Hebreo ang pandiwang nagsasaad ng pagiging kasuklam-suklam at ang pangngalang tumutukoy sa mali o kawalang-katarungan. Ang salin ay malinaw sa modernong Tagalog habang pinananatili ang dalawang sangkap.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Walang sinumang gumagawa ng mabuti
  rationale: Likas sa Tagalog at malapit sa Hebreong konstruksyong nagsasaad na walang umiiral na gumagawa ng mabuti.
theological_decisions:
- issue: Paglipat mula sa isahang “hangal” tungo sa maramihang mga pandiwa
  choice: 'Pinanatili ang isahan sa unang pangungusap at ang maramihan sa sumunod: “hangal … sila.”'
  alternative: Gawing isahan ang lahat (“Nagpakasama siya”) o gawing maramihan ang lahat (“Sinabi ng mga hangal”).
  rationale: 'Ang pagbabago ng bilang ay nasa tekstong Hebreo mismo: mula sa isang kinatawang hangal ay lumalawak ang paglalarawan sa buong uri ng gayong mga tao. Hindi ito dapat pakinisin sa paraang nawawala ang retorikal na paglipat.'
- issue: Pagtukoy sa Diyos sa אֵין אֱלֹהִים
  choice: “Walang Diyos”
  alternative: “Walang diyos” o “Hindi umiiral ang Diyos.”
  rationale: Pinananatili ng maikli at tuwirang salin ang lakas at posibleng saklaw ng pahayag nang hindi nagdaragdag ng paliwanag. Ang malaking titik ay angkop sa konteksto ng awit tungkol sa Diyos ng Israel.
- issue: Kasariang gramatikal ng kinatawang isahan
  choice: “sa kanyang puso”
  alternative: “sa puso nila” o “sa puso.”
  rationale: Ang “kanyang” ay tumutugma sa isahang hulapi ng Hebreo at likas na hindi nagtatakda ng kasarian sa Tagalog, kaya napapanatili ang bilang nang walang hindi kinakailangang dagdag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matipid at mariing himig ng tulang Hebreo, pati ang paglipat mula sa kinatawang isahan tungo sa maramihan. Inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
