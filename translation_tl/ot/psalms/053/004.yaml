base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: tl
  text: Hindi ba alam ng mga gumagawa ng kasamaan[a]—silang lumalamon sa aking bayan gaya ng pagkain nila ng tinapay?[b][c] Hindi sila tumatawag sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga gumagawa ng masama.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “silang kumakain ng aking bayan; kumakain sila ng tinapay.” Ipinahihiwatig ng magkatabing parirala na nilalamon nila ang bayan na gaya ng karaniwan nilang pagkain ng tinapay.'
    reason: lexical_alternative
  - marker: c
    text: Maaaring marinig ang “aking bayan” bilang salita ng Diyos o ng mang-aawit; hindi tahasang tinutukoy sa Hebreo kung sino ang nagsasalita rito.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Hindi ba nakaaalam
  rationale: Pinananatili ang retorikal na tanong na umaasang sang-ayunan at ang diwa ng pagkilala o pagkaalam; ang pangkasalukuyang anyo ay angkop sa pangkalahatang paglalarawan.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ang mga gumagawa ng kasamaan
  rationale: Pinananatili ang anyo ng pariralang Hebreo—mga gumagawa ng masama—sa malinaw at marangal na modernong Tagalog.
- source_word: אֹכְלֵי עַמִּי
  choice: silang lumalamon sa aking bayan
  rationale: Ipinahahayag ng “lumalamon” ang talinghaga ng pagkain at ang mapang-abusong pagsalakay sa bayan, nang hindi ito ginagawang literal na pagkain.
- source_word: אָכְלוּ לֶחֶם
  choice: na para bang kumakain ng tinapay
  rationale: 'Nililinaw sa natural na Tagalog ang paghahambing na ipinahihiwatig ng magkatabing parirala: nilalamon nila ang bayan nang kasindali at kasindalas ng pagkain ng karaniwang tinapay.'
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salitang Hebreo, malinaw na tumutukoy ito rito sa iisang Diyos.
- source_word: לֹא קָרָאוּ
  choice: Hindi sila tumatawag sa
  rationale: Sa pagkakaugnay nito sa Diyos, ang קרא ay tumutukoy sa pagtawag o paghingi sa Diyos; ang pangkasalukuyang anyo ay angkop sa patuloy na pagkakakilanlan ng masasama.
theological_decisions:
- issue: Ang tinutukoy ng “aking bayan”
  choice: Panatilihin ang “aking bayan” nang hindi tahasang pinapangalanan ang nagsasalita
  alternative: Unawain ito bilang tuwirang salita ng Diyos, o bilang salita ng mang-aawit tungkol sa bayang kinabibilangan niya
  rationale: Unang panauhang isahan ang hulapi sa Hebreo, ngunit hindi tahasang tinutukoy sa mismong taludtod kung Diyos o ang mang-aawit ang nagsasalita. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong, ang talinghaga ng pagkain, at ang kalabuan kung sino ang nagsasabi ng “aking bayan.”
