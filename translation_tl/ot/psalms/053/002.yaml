  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: tl
  text: 'Mula sa langit ay tumingin ang Diyos sa mga anak ng tao[a],

    upang tingnan kung may sinumang may unawa,

    na naghahanap sa Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sangkatauhan.” Ang “mga anak ng tao” sa Hebreo ay kolektibong katawagan para sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salitang Hebreo, tumutukoy ito rito sa iisang Diyos; likas at wastong isinasalin ito sa Filipino bilang “ang Diyos.”
- source_word: מִשָּׁמַיִם
  choice: mula sa langit
  rationale: Ang anyong maramihan sa Hebreo ay karaniwang idyoma; ang “mula sa langit” ang natural na katumbas sa makabagong Filipino.
- source_word: הִשְׁקִיף
  choice: dumungaw
  rationale: Ipinahihiwatig ng pandiwa ang pagtingin mula sa mataas na dako pababa. Pinananatili ng “dumungaw” ang larawan nang hindi na kailangang idagdag ang “pababa.”
- source_word: בְּנֵי אָדָם
  choice: mga anak ng tao
  rationale: Pinananatili nito ang konkretong kolektibong idyoma ng Hebreo para sa mga tao, habang nililinaw sa talababa ang mas malayang katumbas.
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Ipinapahayag ng infinitibo ang layunin ng pagdungaw ng Diyos.
- source_word: הֲיֵשׁ
  choice: kung may sinuman
  rationale: Natural nitong inilalahad sa Filipino ang tanong kung umiiral ang gayong tao.
- source_word: מַשְׂכִּיל
  choice: nakauunawa
  rationale: Sinasaklaw nito ang pagkakaroon ng unawa o kabatiran at hindi ito nililimitahan sa talino lamang.
- source_word: דֹּרֵשׁ
  choice: humahanap
  rationale: Ipinahahayag nito ang patuloy na disposisyon ng paghahanap sa Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי אָדָם bilang kolektibong katawagan
  choice: mga anak ng tao
  alternative: sangkatauhan
  rationale: Pinananatili sa pangunahing teksto ang anyo at larawang nasa Hebreo, ngunit ang talababa ay nagpapakitang tumutukoy ito sa mga tao sa kabuuan at hindi sa isang natatanging pangkat.
- issue: Ugnayan ng מַשְׂכִּיל at דֹּרֵשׁ
  choice: “may sinumang nakauunawa, na humahanap sa Diyos”
  alternative: “may nakauunawa o humahanap sa Diyos”
  rationale: Magkakasunod at magkakaugnay ang dalawang participle sa Hebreo. Pinananatili ng salin ang posibilidad na ang naghahanap sa Diyos ang siyang inilalarawan bilang nakauunawa, nang hindi ginagawang dalawang magkahiwalay na uri ng tao.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino. Ginamit ang “dumungaw” upang mapanatili ang makatang larawan ng Diyos na tumitingin mula sa langit; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
