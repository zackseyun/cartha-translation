  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: tl
  text: Doon ay labis silang natakot[a], gayong wala namang dapat katakutan; sapagkat ikinalat ng Diyos ang mga buto ng nagkakampo laban sa iyo[b]. Pinahiya mo sila[c], sapagkat itinakwil sila ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “natakot sila ng takot.” Gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang kumukubkob sa iyo” o “ang nagkakampo sa palibot mo.” Ang anyong Hebreo ay mula sa pandiwang “magkampo”; sa kontekstong ito, pagalit ang diwa nito.
    reason: lexical_alternative
  - marker: c
    text: Mula sa pagsasalita tungkol sa Diyos—“ikinalat ng Diyos”—biglang lumilipat ang talata sa tuwirang pakikipag-usap sa kaniya—“Pinahiya mo sila.” Pinanatili rito ang makatang pagbabagong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: Payak na panandang pook na nagpapanatili sa bigla at makatang pagbubukas ng Hebreo.
- source_word: פָּחֲדוּ פַחַד
  choice: labis silang natakot
  rationale: Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay nagbibigay-diin sa tindi ng takot; likas sa modernong Tagalog ang 'labis silang natakot.'
- source_word: לֹא הָיָה פַחַד
  choice: gayong wala namang dapat katakutan
  rationale: Ipinahahayag na walang tunay na dahilan o bagay na dapat katakutan. Inilalahad ng 'gayong' ang tensiyon nang hindi binabago ang diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag sa isang marangal ngunit madaling unawaing paraan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin para sa pangmaramihang anyong Hebreo na tumutukoy nang isahan sa Diyos ng Israel.
- source_word: פִּזַּר
  choice: ikinalat
  rationale: Nananatili ang larawan ng sapilitang pagkakawatak-watak ng mga buto ng natalong kaaway.
- source_word: עַצְמוֹת
  choice: ang mga buto
  rationale: Tuwiran at likas na katumbas ng pangmaramihang pangngalan sa kontekstong ito.
- source_word: חֹנָךְ
  choice: ang nagkakampo laban sa iyo
  rationale: Mula sa pandiwang 'magkampo.' Ipinahihiwatig ng mga nakakalat na buto at kahihiyan ang isang kaaway na nagkampo laban sa kinakausap, ngunit hindi ginawang mas tiyak kaysa sa Hebreo ang paraan ng paglusob.
- source_word: הֱבִשֹׁתָה
  choice: Pinahiya mo sila
  rationale: Ang Hiphil ng בוש ay nangangahulugang magdulot ng kahihiyan. Pinananatili ang ikalawang panauhang panlalaki na biglang direktang kinakausap sa tula.
- source_word: מְאָסָם
  choice: itinakwil sila
  rationale: Ipinapahayag ang matinding pagtanggi ng מאס nang hindi nagdaragdag ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Pagbabago ng panauhan at kinakausap sa loob ng talata
  choice: 'Pinanatili ang paglipat mula sa pagsasalita tungkol sa Diyos tungo sa tuwirang pakikipag-usap sa kaniya: ''Pinahiya mo sila.'''
  alternative: 'Gawing pawang ikatlong panauhan: ''Pinahiya sila ng Diyos''; o ituring na ang Zion/Jerusalem ang kinakausap.'
  rationale: Biglaan ang tula sa Hebreo at pinahihintulutan nito ang paglipat mula sa pagsasalaysay tungkol sa Diyos patungo sa tuwirang pagtawag sa kaniya. Hindi ito pinakinis upang hindi mawala ang tunay na tensiyon ng teksto.
- issue: Diwa ng חֹנָךְ bilang paglalarawan sa kaaway
  choice: ang nagkakampo laban sa iyo
  alternative: ang kumukubkob sa iyo; ang nagkakampo sa palibot mo
  rationale: Malinaw na salungat ang konteksto dahil ikinalat ang mga buto at pinahiya ang tinutukoy. Gayunman, pinanatili sa pangunahing teksto ang larawan ng pagkakampo sa halip na gawing tiyak na pagkubkob.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'sapagkat' para sa mataas ngunit hindi makalumang himig, at pinanatili ang biglaang pagbabago ng panauhan sa tulang Hebreo.
