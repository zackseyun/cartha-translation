base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: tl
  text: Itaas ninyo ang inyong mga ulo, O mga pintuang-bayan; magsitaas kayo, O mga sinaunang pintuan,[a] upang makapasok ang Hari ng kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pintuang walang hanggan.” Ang pariralang Hebreo ay maaaring tumukoy sa mga pintuang napakatanda na o matagal nang umiiral.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Itaas ninyo
  rationale: Pautos na maramihan na tuwirang nakalaan sa mga pintuang binibigyang-katauhan; pinananatili rin nito ang matingkad na larawan ng Hebreo.
- source_word: שְׁעָרִים
  choice: mga pintuang-bayan
  rationale: Tumutukoy sa malalaking tarangkahan ng isang lungsod o banal na pook. Mas tiyak ang “pintuang-bayan” kaysa sa karaniwang “pinto” at angkop sa maringal na tagpo.
- source_word: רָאשֵׁיכֶם
  choice: ang inyong mga ulo
  rationale: Literal na “ang inyong mga ulo.” Pinananatili ang sadyang pagbibigay-katauhan at metapora sa halip na gawing paliwanag na “bumukas nang maluwang.”
- source_word: וּשְׂאוּ
  choice: magtaas kayo
  rationale: Inuulit ang pautos na נשׂא at pinananatili ang aktibo at personipikadong panawagan sa mga pinto. Hindi dinaragdagan ng tahasang layon ang Hebreo, kaya nananatili ang bahagyang pambalarilang pagkabitin ng tula.
- source_word: פִּתְחֵי עוֹלָם
  choice: mga pintuang mula pa noong unang panahon
  rationale: Ang עוֹלָם ay maaaring tumukoy sa napakahabang panahon, sinaunang panahon, o walang hanggang tagal. Ang pariralang ito ay natural sa Filipino at malinaw na naghahatid ng diwa ng matandang pinagmulan nang hindi ipinapalagay na literal na walang hanggan ang mga pinto.
- source_word: וְיָבֹא
  choice: upang makapasok
  rationale: 'Ang pandiwang kasunod ng mga pautos ay natural na nauunawaan bilang layunin o bunga: itaas ang mga pintuan upang makapasok ang Hari.'
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: ang Hari ng kaluwalhatian
  rationale: Pinananatili ang anyong construct at ang maringal na titulo, sa halip na gawing “maluwalhating Hari.”
theological_decisions:
- issue: Kung pananatilihin ang pagbibigay-katauhan sa mga pintuan at ang larawan ng pagkakaroon nila ng “mga ulo”
  choice: Pinanatili sa pangunahing teksto ang “Itaas ninyo ang inyong mga ulo, O mga pintuang-bayan.”
  alternative: “Bumukas kayo nang maluwang, O mga pintuang-bayan.”
  rationale: Tahasang gumagamit ang Hebreo ng “mga ulo” at kinakausap ang mga pintuan. Mahalaga ang larawang ito sa puwersang patula at liturhikal ng salmo, kaya hindi ito pinatag sa isang paliwanag na pang-arkitektura.
- issue: Kahulugan ng עוֹלָם sa פִּתְחֵי עוֹלָם
  choice: “mga pintuang mula pa noong unang panahon” sa pangunahing teksto
  alternative: “mga pintuang walang hanggan”
  rationale: Saklaw ng עוֹלָם ang sinaunang panahon, mahabang tagal, at kung minsan ay kawalang-hanggan. Sa kontekstong pang-arkitektura at patula, malinaw at natural ang napakatandang pinagmulan, ngunit inilalagay sa talababa ang isa pang tunay na posibilidad.
translation_notes:
  register: Makabago ngunit maringal na Filipino. Ginamit ang “O” upang mapanatili ang tuwirang patulang pagtawag. Pinili ang “pintuang-bayan” para sa city/temple gates at pinanatili ang kakaibang personipikasyon ng Hebreo. Ang ikalawang pautos na “magtaas kayo” ay sadyang hindi nilagyan ng tahasang layon upang hindi higit na ipaliwanag ang ambiguwidad ng pinagmulan.
