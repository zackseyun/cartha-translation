  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: tl
  text: Ang may malinis na kamay at dalisay na puso, na hindi nag-uukol ng aking sarili sa kabulaanan[a] ni nanunumpa nang may pandaraya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa tekstong Hebreo: “ang aking sarili” (literal, “ang aking kaluluwa”). Dahil ikatlong panauhan ang paglalarawan sa buong talata, maraming salin ang sumusunod sa alternatibong pagbasa na “ang kanyang sarili.” Ang “kabulaanan” ay maaari ring isaling “kawalang-kabuluhan” o “walang-halaga”; inuunawa rin ito ng ilan bilang pagtukoy sa isang diyus-diyosan.'
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: נְקִי כַּפַּיִם
  choice: may malinis na mga kamay
  rationale: Pinananatili ang konkretong larawang Hebreo tungkol sa malinis at matuwid na panlabas na gawain; natural din sa Filipino ang pariralang “malinis na mga kamay.”
- source_word: בַר לֵבָב
  choice: dalisay na puso
  rationale: Ipinahahayag nito ang panloob na kalinisan at pinananatili ang pagtutulad sa panlabas na “mga kamay.” Mas marangal at natural dito ang “dalisay” kaysa paulit-ulit na “malinis.”
- source_word: נָשָׂא ... נַפְשִׁי
  choice: itinaas ang kanyang sarili
  rationale: Ang literal na “itinaas ang kaluluwa” ay di-karaniwang idyoma sa Filipino. Isinasalin ang נֶפֶשׁ bilang “sarili” upang maipahayag ang buong pagkataong ibinabaling o iniuukol sa isang bagay. Ang panghalip na “kanyang” ang kontekstuwal na pagbasa na umaayon sa ikatlong panauhan ng talata; itinatala sa talababa ang anyong Masoretiko.
- source_word: לַשָּׁוְא
  choice: sa kabulaanan
  rationale: Saklaw ng שָׁוְא ang kabulaanan, kawalang-kabuluhan, at walang-halaga. Ang “kabulaanan” ay angkop sa etikong konteksto at kaugnay ng kasunod na pandarayang panunumpa, habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: nanumpa nang may pandaraya
  rationale: Natural itong Filipino para sa panunumpang ginagawa nang mapanlinlang o may layuning mandaya, nang hindi nililimitahan ang kahulugan sa pawang maling pahayag lamang.
theological_decisions:
- issue: Panghalip sa נַפְשִׁי (“aking sarili/kaluluwa”) laban sa kontekstuwal na “kanyang sarili”
  choice: Ginamit sa pangunahing teksto ang “kanyang sarili,” kasunod ng ikatlong panauhang paglalarawan sa buong talata.
  alternative: “aking sarili” o, nang higit na literal, “aking kaluluwa”
  rationale: 'Ang nakasulat at binibigkas na anyo sa WLC ay may hulaping unang panauhan, ngunit nagdudulot ito ng biglang paglipat mula sa ikatlong panauhan. Malawak na kinikilalang kontekstuwal na pagbasa ang ikatlong panauhan. Hindi itinatago ang tensiyong tekstuwal: malinaw na inilalahad sa talababa ang anyong Masoretiko.'
- issue: Saklaw ng שָׁוְא
  choice: kabulaanan
  alternative: kawalang-kabuluhan, walang-halaga, o isang diyus-diyosan
  rationale: Hindi tiyak na tumutukoy ito sa idolatriya; kaya hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong “diyus-diyosan.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pares na panlabas na asal (“malinis na mga kamay”) at panloob na pagkatao (“dalisay na puso”). Iniwasan ang labis na literal na “itinaas ang kaluluwa,” na malabo sa karaniwang Filipino, ngunit itinabi sa talababa ang mahalagang usaping tekstuwal.
