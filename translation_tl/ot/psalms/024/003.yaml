  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: tl
  text: Sino ang maaaring umakyat sa bundok ni Yahweh? At sino ang maaaring tumayo sa kanyang banal na dako?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “burol ni Yahweh.” Ang Hebreong הַר ay maaaring mangahulugang “bundok” o “burol”; pinanatili rito ang “bundok” bilang mas karaniwang salin sa awit na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Likas at maikling katumbas ng panghalip na pananong; pinananatili ang retorikal na tanong tungkol sa taong karapat-dapat.
- source_word: יַעֲלֶה
  choice: maaaring umakyat
  rationale: Ang Qal imperfect ng עלה ay nangangahulugang ‘umakyat.’ Ipinahihiwatig ng ‘maaaring’ ang pahintulot o pagiging karapat-dapat sa kontekstong liturhikal, hindi lamang kilos sa hinaharap.
- source_word: בְהַר
  choice: sa bundok
  rationale: Maaaring tumukoy ang הַר sa bundok o burol. Ang ‘bundok’ ay angkop sa mataas na banal na pook at hindi nagpapahina sa larawang patula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng ‘Yahweh’ ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וּמִי
  choice: At sino
  rationale: Pinananatili ang pangatnig at ang magkatulad na kayarian ng dalawang taludtod.
- source_word: יָקוּם
  choice: maaaring tumayo
  rationale: Ang קום ay ‘tumindig/tumayo.’ Sa konteksto ng paglapit sa banal na pook, ang ‘tumayo’ ay maaaring tumukoy sa pagharap o pananatili sa presensiya ng Diyos, habang hindi nilulutas nang labis ang saklaw nito.
- source_word: בִּמְקוֹם
  choice: sa ... dako
  rationale: Ang מָקוֹם ay pangkalahatang ‘lugar/dako.’ Ang ‘dako’ ay dignificado at natural sa pananalitang panrelihiyon nang hindi ito ginagawang tahasang ‘santuwaryo.’
- source_word: קָדְשׁוֹ
  choice: kanyang banal
  rationale: 'Ang anyo ay may hulaping ikatlong panauhang panlalaki: ‘kanyang banal [na dako].’ Malinaw na pinananatili ng salin ang kabanalan at pag-aari ng dako.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na halinhan ito ng titulo.
- issue: Puwersa ng mga imperfect na pandiwa sa mga retorikal na tanong
  choice: maaaring umakyat / maaaring tumayo
  alternative: aakyat / tatayo; kayang umakyat / kayang tumayo
  rationale: Ang tanong ay nakatuon sa pagiging karapat-dapat o pinahihintulutang lumapit, hindi lamang sa mangyayari sa hinaharap o sa pisikal na kakayahan. Pinananatili ng ‘maaaring’ ang liturhikal at moral na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘banal na dako’ upang maging natural at patula nang hindi nililimitahan ang מָקוֹם sa teknikal na kahulugang ‘santuwaryo.’
