base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: tl
  text: 'Awit ni David.[a]


    Kay Yahweh ang daigdig at ang lahat ng nilalaman nito,

    ang sanlibutan at ang mga naninirahan dito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ni David” ay maaari ring mangahulugang “para kay David,” “ukol kay David,” o “nauugnay kay David.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang לְ ay maaaring magpahiwatig ng pagkatha, kaugnayan, o pag-aalay. Ang karaniwang pamagat na “ni David” ay natural sa Filipino at hindi tahasang nagsasabing siya lamang ang may-akda; inilalagay sa talababa ang likas na kalabuan.
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan ito sa isang awit na panrelihiyon sa mga pamagat ng Mga Awit; malinaw at natural ito sa modernong Filipino.
- source_word: לַיהוָה
  choice: Kay Yahweh
  rationale: Ipinahahayag ng walang-pandiwang sugnay sa Hebreo ang pagmamay-ari. Ang “Kay Yahweh” ay maikli, natural, at tuwirang nagpapanatili sa banal na pangalan.
- source_word: הָאָרֶץ
  choice: ang daigdig
  rationale: Bagaman maaari ring mangahulugang “lupain,” ipinapakita ng paralelismo sa תֵּבֵל at ng pangkalahatang saklaw na ang buong daigdig ang tinutukoy.
- source_word: וּמְלוֹאָהּ
  choice: at ang lahat ng naroon
  rationale: Dinamikong ipinahahayag nito ang literal na “kapuspusan nito,” ibig sabihin, ang buong nilalaman ng daigdig, sa natural at madaling maunawaang Filipino.
- source_word: תֵּבֵל
  choice: ang sanlibutan
  rationale: Tumutukoy ito sa daigdig bilang maayos at tinatahanang mundo. Ang “sanlibutan” ay dignified at malinaw, at ang sumunod na parirala ay naglilinaw sa aspektong tinatahanan.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: at ang mga naninirahan dito
  rationale: Pinananatili nito ang pandiwang lakas ng participle na “mga tumatahan” sa natural na modernong Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng pagmamay-ari ni Yahweh
  choice: “Kay Yahweh” ang daigdig, lahat ng naroon, sanlibutan, at mga naninirahan dito
  alternative: Iugnay lamang ang pagmamay-ari sa “daigdig” at ituring na hiwalay na pahayag ang kasunod
  rationale: Ang dalawang magkatimbang na linya ay kapwa nagpapahayag ng malawak na pagmamay-ari ni Yahweh; pinananatili ng salin ang paralelismo nang hindi nagdaragdag ng paliwanag tungkol sa paraan o batayan ng pagmamay-ari.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “daigdig” at “sanlibutan” upang mapanatili ang dalawang magkatulad ngunit di-ganap na magkaparehong salitang Hebreo. Ang “lahat ng naroon” ay mas natural kaysa sa literal na “kapuspusan nito.”
