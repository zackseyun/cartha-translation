  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang dalawang pautos, ang personipikasyon ng mga tarangkahan at pintuan na may mga ''ulo,'' ang paralelismo, at ang pagdating ng Hari ng kaluwalhatian. Ang ''Magtaas kayo'' ay katanggap-tanggap na makatang paraan upang ipahayag ang Niphal na anyo nang hindi inaalis ang bahagyang pasibo/pansariling dating nito.'
  naturalness: Natural at marangal ang modernong Filipino. Ang 'mga pintuang mula pa noong unang panahon' ay bahagyang mahaba ngunit malinaw, patula, at angkop sa kahulugang 'ancient doors.' Ang paghahati sa tatlong taludtod ay mahusay na naglilinaw sa paralelismo.
