  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: tl
  text: 'Itaas ninyo ang inyong mga ulo, kayong mga tarangkahan!

    Magtaas kayo, kayong mga pintuang mula pa noong unang panahon[a],

    upang makapasok ang Hari ng kaluwalhatian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pintuang walang hanggan.” Ang salitang Hebreo ay maaaring tumukoy sa mga pintuang mula pa sa malayong sinaunang panahon o sa mga pintuang nananatili magpakailanman.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Itaas ninyo
  rationale: Tuwirang pautos na nagpapanatili sa masigla at matayog na larawan ng Hebreo.
- source_word: שְׁעָרִים
  choice: mga tarangkahan
  rationale: Natural na tawag sa malalaking pintuang-daan ng isang lungsod o banal na pook, at malinaw na naiiba sa kasunod na פִּתְחֵי.
- source_word: רָאשֵׁיכֶם
  choice: ang inyong mga ulo
  rationale: Pinananatili ang literal na personipikasyon ng mga tarangkahan sa halip na gawing paliwanag na pang-arkitektura ang talinghaga.
- source_word: וְהִנָּשְׂאוּ
  choice: Magtaas kayo
  rationale: Natural na makatang pautos sa modernong Filipino na naghahatid ng pasibo o pansariling diwa ng Niphal at umaalingawngaw sa unang utos.
- source_word: פִּתְחֵי עוֹלָם
  choice: mga pintuang mula pa noong unang panahon
  rationale: Ang פִּתְחֵי ay angkop na 'mga pintuan' sa paralelismo, at ang עוֹלָם ay maaaring tumukoy sa malayong sinaunang panahon; pinananatili sa talababa ang alternatibong diwa ng walang hanggang pag-iral.
- source_word: וְיָבֹא
  choice: upang makapasok
  rationale: Ipinapahayag nang natural ang layunin o bunga ng mga naunang pautos nang hindi ginagawang tiyak na panghinaharap ang imperfect.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: ang Hari ng kaluwalhatian
  rationale: Pinananatili ang anyong construct bilang matayog na titulo at hindi ito pinapaliit sa simpleng 'maluwalhating Hari.'
theological_decisions:
- issue: Kung pananatilihin ang personipikasyon at larawan ng maharlikang pagpasok nang walang makitid na interpretasyon
  choice: Tuwirang kinakausap ang mga tarangkahan at pintuan at pinananatili ang kanilang 'mga ulo.'
  alternative: Isalin nang mas dinamiko bilang isang simpleng utos na buksan ang mga tarangkahan.
  rationale: Ang Hebreo mismo ay patulang kumakausap sa mga tarangkahan at pintuan. Ang pagpapanatili rito ay nag-iingat sa liturhikal at maharlikang lakas ng taludtod nang hindi nagtatakda ng isang partikular na historikal o mesiyanikong katuparan.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang 'kayong' sa tuwirang pagtawag upang maging malinaw ang personipikasyon; iniwasan ang lipas na 'O' at ang sobrang paliwanag na 'buksan.'
