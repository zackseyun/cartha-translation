  text: זֶ֭ה דּ֣וֹר דרש/ו מְבַקְשֵׁ֨י פָנֶ֖י/ךָ יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/006.yaml
  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: tl
  text: 'Ito ang salinlahi ng mga humahanap sa kanya,

    na humahanap sa iyong mukha, O Jacob.[a]

    Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “O Jacob.” May ilang sinaunang salin at makabagong salin na nauunawaan ito bilang “O Diyos ni Jacob” o “na humahanap sa Diyos ni Jacob.”
    reason: Ipinababatid ang tunay na kahirapan sa gramatika at tekstuwal na tradisyon nang hindi binabago ang salitang nasa tekstong Masoretiko.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: Ito ang salinlahi
  rationale: Pinananatili ang demonstratibong “ito” at ang kolektibong diwa ng דּוֹר bilang isang salinlahing inilalarawan ng kanilang paghahanap sa Diyos.
- source_word: דֹּרְשָׁיו
  choice: ng mga humahanap sa kanya
  rationale: Isinasalin ang pandiwang דרש ayon sa konteksto bilang masikap na paghahanap, habang pinananatili ang panlalaking isahang hulaping “kanya.”
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: na humahanap sa iyong mukha
  rationale: Pinananatili ang konkretong idyomang Hebreo na “hanapin ang iyong mukha,” na tumutukoy sa paghahangad na lumapit at mapasa presensya ng Diyos.
- source_word: סֶלָה
  choice: Selah
  rationale: Tinumbasan sa pamamagitan ng transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan o tungkuling pangmusika ng termino.
theological_decisions:
- issue: Ang ugnayan ng יַעֲקֹב sa pariralang “iyong mukha”
  choice: O Jacob
  alternative: O Diyos ni Jacob / kay Jacob
  rationale: Ang tekstong Masoretiko ay tahasang may יַעֲקֹב (“Jacob”) nang walang salitang “Diyos.” Pinananatili ng bokatibong salin ang anyo at tensiyon ng tekstong Hebreo sa halip na idagdag ang isang hindi nakasulat na salita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “salinlahi” para sa biblikal na kolektibong diwa ng דּוֹר, at pinanatili ang idyomang “iyong mukha” at ang terminong “Selah.”
