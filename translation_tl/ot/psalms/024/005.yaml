  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: tl
  text: Tatanggap siya ng pagpapala mula kay Yahweh, at ng katuwiran[a] mula sa Diyos ng kanyang kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagpapawalang-sala” o “katarungan.” Ang salitang Hebreo ay maaaring tumukoy sa katuwirang moral, ngunit maaari rin itong magpahiwatig ng paborableng hatol o ng katarungang nagliligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: Tatanggap
  rationale: Bagaman karaniwang nangangahulugang “magbuhat” o “magdala” ang pandiwa, ang idyomatikong diwa nito kapag “pagpapala” ang layon ay tumanggap o magkamit.
- source_word: בְרָכָה
  choice: pagpapala
  rationale: Karaniwan at natural na katumbas sa Tagalog; pinananatili ang isahan ng Hebreo.
- source_word: מֵאֵת יְהוָה
  choice: mula kay Yahweh
  rationale: Ipinahahayag ng pariralang may pang-ukol ang pinagmulan, at tuwirang inililipat ang pangalang tipan na יְהוָה bilang “Yahweh.”
- source_word: וּצְדָקָה
  choice: at ng katuwiran
  rationale: Pinananatili ng “katuwiran” ang malawak na saklaw ng salita, na maaari ring magkaroon ng hudisyal at nagliligtas na diwa; inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: mula sa Diyos ng kanyang kaligtasan
  rationale: Malapit ito sa kayariang construct ng Hebreo at hindi nililimitahan kung ang Diyos ang pinagmumulan ng kaligtasan o ang Diyos na kumikilos upang magligtas.
- source_word: יִשְׁעוֹ
  choice: kanyang kaligtasan
  rationale: Ang “kaligtasan” ay angkop sa teolohikal na rehistro ng awit at maaari ring sumaklaw sa pagliligtas mula sa panganib.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng צְדָקָה sa kontekstong ito
  choice: katuwiran
  alternative: pagpapawalang-sala; katarungan
  rationale: Pinananatili ng “katuwiran” ang moral, pangtipan, hudisyal, at nagliligtas na mga posibilidad nang hindi agad nilulutas ang tunay na kalabuan; nakatala sa talababa ang mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kay Yahweh” ayon sa natural na tuntunin ng Tagalog para sa personal na pangalan, at pinanatili ang bahagyang pormal na “Diyos ng kanyang kaligtasan” upang masalamin ang kayarian at teolohikal na lawak ng Hebreo.
