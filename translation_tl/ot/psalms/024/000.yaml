base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: tl
  text: 'Awit ni David.[a]


    Kay Yahweh ang lupa at ang lahat ng nilalaman nito,[b]

    ang daigdig at ang mga naninirahan dito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Awit para kay David” o “Awit tungkol kay David.”'
    reason: Pinananatili ang posibleng iba’t ibang ugnayang ipinahihiwatig ng Hebreong לְדָוִד.
  - marker: b
    text: 'Sa literal: “at ang kapunuan nito,” ibig sabihin, ang lahat ng pumupuno rito.'
    reason: Ibinibigay ang mas literal na anyo ng מְלוֹאָהּ at nililinaw ang saklaw nito.
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: Awit ni David
  rationale: Likas at marangal na salin ng pamagat; pinananatili ng “ni David” ang maaaring saklaw ng לְ bilang pag-aari, pagkakaugnay, o paglalaan kay David nang hindi ito labis na nililinaw.
- source_word: לַיהוָה
  choice: Kay Yahweh
  rationale: Tuwirang ipinapahayag ang pag-aari at isinasalin ang personal na pangalang יהוה bilang Yahweh.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: ang lupa at ang lahat ng naroon
  rationale: Ang מְלוֹאָהּ ay literal na kapunuan o lahat ng pumupuno rito; mas natural sa modernong Tagalog ang “lahat ng naroon” habang pinananatili ang malawak na saklaw.
- source_word: תֵּבֵל
  choice: ang daigdig
  rationale: Ipinakikita ang kaibhan nito sa הָאָרֶץ at tumutukoy sa mundong tinatahanan.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: at ang mga naninirahan dito
  rationale: Tapat sa participial na diwa ng “mga naninirahan” at natural ang “dito” bilang pagtukoy sa daigdig.
theological_decisions:
- issue: Ugnayan ni David sa awit
  choice: Awit ni David
  alternative: Awit para kay David
  rationale: Hindi tiyak na laging nangangahulugang awtor ang לְדָוִד; pinananatili ng karaniwang Tagalog na pamagat ang kaugnayan kay David nang hindi nagdaragdag ng tahasang pahayag tungkol sa pagkakaakda.
- issue: Paglalahad ng pag-aari ni Yahweh
  choice: Kay Yahweh ang lupa at ang lahat ng naroon
  alternative: Ang lupa at ang lahat ng naroon ay kay Yahweh
  rationale: Pinananatili ang diin ng Hebreo sa לַיהוָה sa unahan at malinaw na itinatanghal ang lubos na pag-aari ng Diyos nang walang dagdag na paliwanag.
translation_notes:
  register: 'Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang pangalang “Yahweh” ayon sa Hebreong יהוה. Ang hati ng mga linya ay sumusunod sa paralelismong patula: “lupa/lahat ng naroon” at “daigdig/mga naninirahan dito.”'
