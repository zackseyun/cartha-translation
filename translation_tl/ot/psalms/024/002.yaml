  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: tl
  text: 'Sapagkat siya ang nagtatag nito sa ibabaw ng mga dagat,

    at pinatatag niya ito sa ibabaw ng mga ilog.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng pahayag sa naunang talata at likas itong pakinggan sa marangal na tulang Filipino.
- source_word: הוּא
  choice: siya ang
  rationale: Pinananatili ng hulmang ito ang hayag at bahagyang mariing panghalip sa Hebreo.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Tuwirang pinananatili nito ang larawang ang lupa ay itinatag sa ibabaw ng mga tubig, nang hindi ginagawang makabagong paliwanag ang sinaunang tulang kosmolohikal.
- source_word: יַמִּים
  choice: mga dagat
  rationale: Ito ang karaniwang kahulugan ng pangmaramihang anyo ng יָם at pinananatili ang kongkretong larawan ng teksto.
- source_word: יְסָדָהּ
  choice: nagtatag nito
  rationale: Ipinahahayag nito ang paglalagay ng saligan; ang hulaping pambabae ay tumutukoy sa lupa sa talata 1.
- source_word: וְעַל
  choice: at ... sa ibabaw ng
  rationale: Pinananatili ang magkatulad na balangkas ng dalawang taludtod.
- source_word: נְהָרוֹת
  choice: mga ilog
  rationale: Ito ang malinaw at karaniwang katumbas, habang hinahayaang manatili ang mas malawak na pahiwatig ng mga daluyan o kalaliman ng tubig sa konteksto.
- source_word: יְכוֹנְנֶהָ
  choice: pinatatag niya ito
  rationale: Ipinakikita ang diwa ng paggawa nitong matatag at inihihiwalay sa naunang pandiwang tumutukoy sa pagtatatag ng saligan.
theological_decisions:
- issue: Larawang kosmolohikal ng lupa sa ibabaw ng mga dagat at ilog
  choice: Panatilihin nang tuwiran ang makatang larawan.
  alternative: Ipaliwanag ito bilang pawang tayutay tungkol sa katatagan o gawing kaayon ng makabagong paglalarawang pang-agham.
  rationale: Inilalarawan ng Hebreong tula ang paghahari at pag-aayos ng Diyos sa sangnilikha sa pamamagitan ng sinaunang larawang kosmolohikal. Hindi ito dapat palabuin o ipakahulugan nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sapagkat” upang malinaw na iugnay ang talata sa dahilan ng pahayag sa talata 1; pinanatili ang balanseng paralelismo ng “sa ibabaw ng mga dagat ... sa ibabaw ng mga ilog.”
