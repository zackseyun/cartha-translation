  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: tl
  text: Sino itong Hari ng kaluwalhatian? Si Yahweh ng mga hukbo[a]—siya ang Hari ng kaluwalhatian. Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Yahweh ng mga hukbong makalangit.” Malawak ang saklaw ng titulong Hebreo at maaaring tumukoy sa mga hukbong makalangit o sa iba pang organisadong kapangyarihan sa ilalim ng kanyang pamamahala.
    reason: lexical_alternative
  - marker: b
    text: Ang “Selah” ay malamang na isang panandang pangmusika o panliturhiya; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Sino ito
  rationale: Pinananatili nito ang mariing retorikal na tanong ng Hebreo sa natural na anyong Tagalog; sa pangungusap, nagiging “Sino itong Hari…” dahil idinurugtong ang demonstratibo sa kasunod na titulo.
- source_word: מֶלֶךְ
  choice: Hari
  rationale: Karaniwang katumbas ng מֶלֶךְ at dito ay ginagamit bilang banal na titulo.
- source_word: הַכָּבוֹד
  choice: ng kaluwalhatian
  rationale: Pinananatili ang anyong genitibo ng מֶלֶךְ הַכָּבוֹד at ang diwa ng כבוד bilang kaluwalhatian, dangal, at bigat o kadakilaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Ang “mga hukbo” ay malinaw at malawak na katumbas sa modernong Tagalog; hindi nito nililimitahan ang tinutukoy sa hukbong panlupa lamang.
- source_word: הוּא
  choice: siya ang
  rationale: Pinananatili ang tahasang panghalip at mariing pagkilala sa Hebreo nang hindi idinaragdag ang diwang “siya lamang.”
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan nito, kaya pinananatili ang transliterasyon upang maiwasan ang labis na pagpapakahulugan.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang kumakatawan rito kaysa sa pagpapalit nito ng titulong “PANGINOON.”
- issue: Paglalarawan sa titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  alternative: Yahweh ng mga hukbong langit; PANGINOON ng mga hukbo
  rationale: Pinananatili ng “mga hukbo” ang lawak at posibleng saklaw ng צְבָאוֹת, kabilang ang mga hukbong makalangit o iba pang kapangyarihang nasa ilalim ng pamamahala ng Diyos, nang hindi nilulutas ang tunay na kalabuan ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Sino itong…” bilang natural na retorikal na tanong, at inulit ang “siya ang Hari” upang mapanatili ang diin ng Hebreo. Ang mga pantanging banal na titulo ay sinimulan sa malaking titik.
