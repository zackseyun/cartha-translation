  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: tl
  text: Sino itong Hari ng kaluwalhatian? Si Yahweh, malakas at makapangyarihan; si Yahweh, makapangyarihan sa digmaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “makapangyarihan sa pakikipagdigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Sino ito
  rationale: Likas na tanong sa modernong Tagalog na pinananatili ang tuwirang anyong tanong at sagot ng salmo; nagiging “Sino itong” bago ang pariralang pangngalan.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Hari ng kaluwalhatian
  rationale: Pinananatili ang ugnayang construct ng Hebreo at ang titulong inuulit sa salmo, sa halip na gawing pang-uri lamang ang כָּבוֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: עִזּוּז
  choice: malakas
  rationale: Ipinahahayag ang lakas habang naiiwasang ulitin agad ang salitang “makapangyarihan” para sa kasunod na גִבּוֹר.
- source_word: וְגִבּוֹר
  choice: at makapangyarihan
  rationale: Saklaw ng גִבּוֹר ang pagiging makapangyarihan o magiting; ang “makapangyarihan” ay natural dito at pinananatili ang pag-igting patungo sa tahasang konteksto ng digmaan sa kasunod na parirala.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: makapangyarihan sa digmaan
  rationale: Malapit sa anyong pang-uri at pangngalan ng Hebreo, malinaw ang diwang pandigma, at hindi nagdaragdag ng pangngalang “mandirigma” na wala sa teksto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Diwang pandigma ng גִּבּוֹר מִלְחָמָה
  choice: makapangyarihan sa digmaan
  alternative: makapangyarihan sa pakikipagdigma; makapangyarihang mandirigma
  rationale: Pinananatili ang tahasang paglalarawan kay Yahweh kaugnay ng digmaan at hindi pinapahina o pinalalawak ang teolohikal na tensiyon ng taludtod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Si Yahweh” upang maging natural ang pagkakakilanlan sa sagot, at pinanatili ang maikli at masiglang estruktura ng liturhikal na tanong at sagot.
