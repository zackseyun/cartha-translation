translation:
  language: tl
  text: 'Ilabas mo ako sa lambat na ikinubli nila para sa akin[a],

    sapagkat ikaw ang aking tanggulan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa lambat na ito na ikinubli nila para sa akin.” Maaaring unawain ang Hebreo bilang panuro (“ito”) o bilang pang-ugnay (“na”).
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Ilabas mo ako
  rationale: Ang Hiphil ng יצא ay may diwang ‘papalabasin’ o ‘ilalabas.’ Pinananatili ng “Ilabas mo ako” ang tahasang pakiusap at ang causative na diwa nang hindi nagdaragdag ng ibang paliwanag.
- source_word: מֵרֶשֶׁת
  choice: mula sa lambat
  rationale: Ang רֶשֶׁת ay literal na lambat at maaari ring magsilbing larawan ng isang bitag. Pinananatili ng “lambat” ang kongkretong larawan ng Hebreo.
- source_word: זוּ
  choice: na
  rationale: Maaaring gumana ang זוּ bilang panuro o panghalip na relative sa kontekstong ito. Sa natural na Tagalog, maayos itong naiuugnay sa kasunod na sugnay sa pamamagitan ng “na,” nang hindi pilit na nilalagyan ng “itong.”
- source_word: טָמְנוּ לִי
  choice: ikinubli nila para sa akin
  rationale: Ang טמן ay ‘itago’ o ‘ikubli.’ Pinananatili ng salin ang pagkakakubli ng lambat at ang לִי bilang “para sa akin,” bagaman malinaw sa konteksto na masama ang kanilang layunin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan ng pakiusap. Ang “sapagkat” ay malinaw, marangal, at angkop sa panulaan.
- source_word: מָעוּזִּי
  choice: aking muog
  rationale: Ang מָעוֹז ay tumutukoy sa matibay na lugar o pinagmumulan ng lakas at proteksiyon. Ang “muog” ay maikli at nagpapanatili sa larawang pangdepensa.
theological_decisions:
- issue: Ang Diyos bilang larawan ng mapagkalingang lakas at kanlungan
  choice: ikaw ang aking muog
  alternative: ikaw ang aking kanlungan / ikaw ang aking tanggulan
  rationale: Pinananatili ng “muog” ang metapora ng matibay na proteksiyon at ang personal na pagtitiwala ng nagsasalita, nang hindi ito ginagawang mas makitid na pahayag na doktrinal.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “muog” upang mapanatili ang maikli at matibay na larawang patula; ang “ikinubli” ay sadyang nagpapanatili sa literal na kilos ng Hebreong pandiwa, kahit mas karaniwang sabihin sa Tagalog na ‘naghanda ng bitag.’
