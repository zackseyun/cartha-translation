  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: tl
  text: Sa iyong kamay ay ipinagkakatiwala ko ang aking espiritu; tinubos mo ako, Yahweh, Diyos ng katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tapat na Diyos.” Ang salitang Hebreo ay maaaring tumukoy sa katotohanan, pagiging maaasahan, o katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יָדְ/ךָ
  choice: Sa iyong kamay
  rationale: Sa pariralang may pandiwang ‘ipinagkakatiwala,’ likas sa Filipino ang ‘sa iyong kamay’ at malinaw nitong ipinahihiwatig ang paglalagak sa pangangalaga at kapangyarihan ng Diyos.
- source_word: אַפְקִיד
  choice: ipinagkakatiwala ko
  rationale: Ang Hiphil ng פקד dito ay tumutukoy sa pagtitiwala o paglalagak sa pangangalaga ng iba. Ang ‘ipinagkakatiwala ko’ ay natural, marangal, at angkop sa panalangin.
- source_word: רוּחִי
  choice: ang aking espiritu
  rationale: Bagaman maaaring mangahulugan ang רוּחַ na espiritu o hininga, sa konteksto ng panalanging ito, ang ‘aking espiritu’ ang pinakamahusay na nagpapahayag sa buhay o sarili na ipinauubaya sa Diyos.
- source_word: פָּדִיתָה
  choice: tinubos mo
  rationale: Ang perfect na anyo ng פדה ay nagsasaad ng natapos na pagtubos na mahalaga pa rin sa kasalukuyan. Natural sa Filipino ang simpleng aspektong ganap na ‘tinubos mo.’
- source_word: אוֹתִי
  choice: ako
  rationale: Tuwirang salin ng panghalip na layon, ayon sa likas na ayos ng Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֵל
  choice: Diyos
  rationale: Gumaganap itong kaagapay na katawagan sa pangalang Yahweh; ‘Diyos’ ang malinaw at tuwirang katumbas.
- source_word: אֱמֶת
  choice: katotohanan
  rationale: Tuwirang pinananatili ng ‘Diyos ng katotohanan’ ang anyong construct na אֵל אֱמֶת. Dahil maaari ring tumukoy ang salita sa pagiging maaasahan o tapat, inilalahad ang alternatibo sa talababa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng Hebreong teksto ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng אֱמֶת sa אֵל אֱמֶת
  choice: Diyos ng katotohanan
  alternative: tapat na Diyos; Diyos na maaasahan
  rationale: Maaaring tumukoy ang אֱמֶת sa katotohanan, katapatan, at pagiging maaasahan. Pinananatili sa pangunahing teksto ang tuwirang anyo, habang inilalagay sa talababa ang mahalagang alternatibong diwa upang hindi alisin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang ‘ipinagkakatiwala’ upang maging natural ang panalangin at mapanatili ang diwa ng kusang paglalagak sa pangangalaga ng Diyos. Ginamit ang ‘espiritu’ at ‘tinubos’ dahil malinaw ang mga ito sa karaniwang mambabasa at pinananatili ang bigat ng orihinal.
