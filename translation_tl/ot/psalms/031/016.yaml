  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: tl
  text: Paliwanagin mo ang iyong mukha sa iyong lingkod; iligtas mo ako sa iyong tapat na pag-ibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa iyong tapat na pag-ibig,” “sa pamamagitan ng iyong tapat na pag-ibig,” o “ayon sa iyong tapat na pag-ibig.” Maaaring maunawaan sa ilang magkakalapit na paraan ang pang-ukol sa Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: Paliwanagin mo
  rationale: 'Ang Hiphil imperative ng אור ay may sanhiing diwa: hinihiling sa Diyos na paliwanagin niya ang kanyang mukha. Likas sa Filipino ang pandiwang ito at napananatili ang pautos na anyo.'
- source_word: פָנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang kongkretong larawang Hebreo ng mukha ng Diyos bilang tanda ng kanyang mabuting pagtingin at pagsang-ayon, sa halip na gawing abstraktong 'presensya.'
- source_word: עַל
  choice: sa
  rationale: Ipinapahayag ng עַל ang pagtutok ng mabuting pagtingin ng Diyos sa lingkod; natural na katumbas sa Filipino ang 'sa' sa idyomang ito.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Sa panalangin sa Diyos, ang 'lingkod' ang natural at marangal na salin ng עבד at hindi nito ipinapasok ang mga konotasyong hindi pangunahing diwa rito.
- source_word: הוֹשִׁיעֵנִי
  choice: iligtas mo ako
  rationale: Ang pautos na anyo ng ישׁע na may panlaping unang panauhan ay malawak na tumutukoy sa pagliligtas mula sa panganib; malinaw at likas ito sa modernong Filipino.
- source_word: בְחַסְדֶּךָ
  choice: dahil sa iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig ng Diyos. Sa kontekstong ito, natural na ipinapahayag ng 'dahil sa' na ang pag-ibig na iyon ang batayan o dahilan ng hinihinging pagliligtas, habang inilalahad sa talababa ang iba pang posibleng ugnayan ng בְּ.
theological_decisions:
- issue: Pagpapahayag ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; walang-maliw na pag-ibig
  rationale: Ang 'tapat na pag-ibig' ay madaling maunawaan at pinananatili ang diwa ng matatag na katapatan ng Diyos sa kanyang pakikipag-ugnayan, hindi lamang damdamin o habag.
- issue: Ugnayan ng בְּ sa בְחַסְדֶּךָ
  choice: dahil sa
  alternative: sa pamamagitan ng; ayon sa
  rationale: Maaaring ipahiwatig ng pang-ukol ang batayan, paraan, o pamantayan ng pagliligtas. Pinili ang natural na 'dahil sa' sa pangunahing teksto ngunit hindi ipinipilit na iyon lamang ang posibleng pagbasa.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang biblikal na larawang “paliwanagin ang iyong mukha,” ngunit ginawang natural ang ikalawang sugnay. Inilagay ang pananda ng talababa pagkatapos ng pariralang tinutukoy nito.
