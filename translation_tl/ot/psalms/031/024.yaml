  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: tl
  text: Magpakatatag kayo, at tumapang nawa ang inyong loob, kayong lahat na naghihintay kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaasa kay Yahweh.” Ang pandiwang Hebreo ay maaaring mangahulugang “maghintay” o “umasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Magpakatatag kayo
  rationale: Ang Qal imperative plural ay tuwirang panawagan sa lahat ng kinakausap na maging matatag; natural at marangal ito sa makabagong Filipino.
- source_word: וְיַאֲמֵץ לְבַבְכֶם
  choice: at lakasan ninyo ang inyong loob
  rationale: Ang Hiphil imperfect ay may puwersang panghikayat kasunod ng pautos. Ang idyomang “lakasan ang loob” ay likas sa Filipino at malinaw na naghahatid ng tapang at panloob na katatagan na kaugnay ng לֵבָב.
- source_word: כָּל
  choice: kayong lahat
  rationale: Tuwirang tinutukoy ng pangkalahatang pananda ang buong pangkat ng mga kinakausap.
- source_word: הַמְיַחֲלִים
  choice: na naghihintay
  rationale: Ang participle ng יחל ay nagpapahayag ng patuloy at may pagtitiwalang paghihintay; pinananatili ng “naghihintay” ang pandiwang larawan nang hindi inaalis ang diwa ng pag-asa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay tumutukoy sa hinihintay o inaasahan, at ang personal na pangalang יהוה ay isinaling “Yahweh.”
theological_decisions:
- issue: Paglalarawan sa kilos ng puso/loob sa וְיַאֲמֵץ לְבַבְכֶם
  choice: lakasan ninyo ang inyong loob
  alternative: at magpakatapang ang inyong puso
  rationale: Maaaring unawain ang anyong Hebreo bilang jussive (“nawa’y lumakas ang inyong puso”) o bilang kasunod na panghikayat. Ang piniling natural na idyomang Filipino ay nagpapanatili sa panawagan sa panloob na tapang nang hindi nagdaragdag ng tiyak na tagaganap.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na idyomang “lakasan ang loob” upang ihatid ang semantikong saklaw ng לֵבָב sa konteksto ng tapang. Inilagay ang pananda ng talababa sa mismong pangunahing teksto.
