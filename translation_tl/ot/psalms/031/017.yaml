id: PSA.31.17
reference: Psalms 31:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: tl
  text: Yahweh, huwag akong mapahiya, sapagkat tumatawag ako sa iyo. Nawa'y mapahiya ang masasama; manahimik sila sa Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manatili silang walang kibo sa Sheol” o “bumaba silang tahimik sa Sheol.” Ang pandiwang Hebreo ay maaaring tumukoy sa pananahimik o pananatiling hindi kumikilos. Ang “Sheol” ay tumutukoy sa daigdig ng mga patay at hindi kinakailangang nangangahulugang “impiyerno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang banal na pangalan; likas na naipahihiwatig sa Tagalog ang panawagan kahit walang pantawag na katumbas ng “O.”
- source_word: אַל אֵבוֹשָׁה
  choice: huwag mo akong hayaang mapahiya
  rationale: Ipinapahayag nito ang pakiusap na huwag sapitin ng nagsasalita ang kahihiyan; natural sa modernong Tagalog at pinananatili ang diwang resulta ng בושׁ.
- source_word: כִּי קְרָאתִיךָ
  choice: sapagkat tumatawag ako sa iyo
  rationale: Ang כִּי ay nagbibigay ng batayan ng pakiusap, at ang “tumatawag ako sa iyo” ay naghahayag ng patuloy o kasalukuyang pagdalangin nang hindi labis na nililimitahan ang aspekto ng Hebreong perfect.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: Ang masasama sana ang mapahiya
  rationale: Pinananatili ang panalangin o hangaring jussive at ang leksikal na pagkakatulad ng dalawang anyo ng בושׁ.
- source_word: יִדְּמוּ
  choice: manahimik sila
  rationale: Sinasalamin ang pangunahing diwang “maging tahimik/manahimik” nang hindi ipinapasok ang causative na “patahimikin” o ang mas tiyak na “mamatay.”
- source_word: לִשְׁאוֹל
  choice: sa Sheol
  rationale: Pinananatili ang natatanging katawagang Hebreo sa daigdig o dako ng mga patay; ang “sa” ay sadyang maluwag upang hindi piliting pagpasyahan kung lokasyon o tunguhin ang diin ng ל.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang nasa Hebreo sa halip na palitan ito ng titulo o ibang tradisyonal na anyo.
- issue: Kahulugan ng שְׁאוֹל
  choice: Sheol
  alternative: libingan / daigdig ng mga patay / impiyerno
  rationale: Hindi ito tinumbasan ng “impiyerno,” sapagkat iyon ay maaaring magpasok ng mas huling konseptong teolohikal; pinananatili ng transliterasyon ang lawak at tensiyon ng katawagang Hebreo.
- issue: Ugnayan ng katahimikan at Sheol
  choice: manahimik sila sa Sheol
  alternative: tumahimik sila sa Sheol / bumaba silang tahimik sa Sheol
  rationale: Pinananatili sa pangunahing teksto ang payak na diwa ng katahimikan, habang inilalahad sa talababa ang posibleng diwa ng pagiging hindi kumikilos o tahimik na pagbaba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “masasama” bilang pangngalang pangmaramihan at pinanatili ang “Sheol” upang huwag paliitin o gawing denominasyonal ang kahulugan.
