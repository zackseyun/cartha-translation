  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: tl
  text: Ang mga panahon ng aking buhay ay nasa iyong kamay[a]; iligtas mo ako mula sa kamay ng aking mga kaaway at ng mga humahabol sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang aking mga takdang panahon” o “ang aking mga kalagayan.” Ang Hebreong parirala ay maaaring tumukoy nang malawakan sa mga yugto at pangyayari sa buhay ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: nasa iyong kamay
  rationale: Pinananatili ang Hebreong talinghaga ng kamay bilang kapangyarihan o pamamahala, at ang makatang pagtutugma nito sa “mula sa kamay” sa ikalawang hati.
- source_word: עִתֹּתָי
  choice: ang aking mga panahon
  rationale: 'Pinananatili ang malawak at makatang diwa ng pangmaramihang עֵת: mga yugto, takdang pagkakataon, at mga pangyayari sa buhay ng salmista, nang hindi ito nililimitahan sa “kapalaran” o “mga kalagayan.”'
- source_word: הַצִּילֵנִי
  choice: iligtas mo ako
  rationale: Natural at tuwirang Filipino para sa konkretong pagliligtas mula sa agarang panganib.
- source_word: מִיַּד
  choice: mula sa kamay
  rationale: 'Pinananatili ang talinghaga ng Hebreo at ang mahalagang paghahambing: ang mga panahon ng salmista ay nasa kamay ng Diyos, ngunit hinihiling niyang agawin siya mula sa kamay ng mga kaaway.'
- source_word: אֹיְבַי
  choice: aking mga kaaway
  rationale: Karaniwan at tuwirang katumbas para sa mga taong laban sa salmista.
- source_word: וּמֵרֹדְפָי
  choice: at ng mga humahabol sa akin
  rationale: Malinaw at likas sa modernong Filipino; pinananatili nito ang konkretong larawan ng mga taong tumutugis sa salmista nang hindi inililihis sa mas abstraktong “mga mang-uusig.”
theological_decisions:
- issue: Saklaw ng kahulugang “ang aking mga panahon”
  choice: Malawak na pagtukoy sa mga yugto at pangyayari sa buhay ng salmista na nasa kamay ng Diyos
  alternative: “ang aking kapalaran” o “ang aking mga takdang panahon” lamang
  rationale: Makatang malawak ang Hebreo. Pinananatili ng salin ang saklaw at tensiyon nito sa halip na paliitin ito sa isang tiyak na doktrina ng kapalaran o sa mga nakatakdang sandali lamang.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal at patula. Sadyang pinanatili ang “kamay” sa magkabilang hati upang marinig ang paralelismo at paghahambing ng orihinal. Ang “aking mga panahon” ay bahagyang matalinghaga ngunit nauunawaan sa konteksto at pinananatili ang tunay na lawak ng Hebreo.
