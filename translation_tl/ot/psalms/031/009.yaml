  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: tl
  text: Magpakita ka sa akin ng kagandahang-loob, Yahweh, sapagkat ako'y nasa kagipitan. Nanghina sa dalamhati ang aking mata[a]—pati ang aking kaluluwa[b] at tiyan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nangulimlim ang aking mata sa hinagpis” o “Nanghihina ang aking mata sa pagkayamot.” Ang salitang isinaling “dalamhati” ay maaari ring mangahulugang galit o pagkayamot.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kaluluwa” ay maaari ring isaling “buhay” o “sarili.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “tiyan”; maaari rin itong tumukoy nang mas malawak sa mga panloob na bahagi ng katawan o sa kaloob-looban.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Magpakita ka sa akin ng kagandahang-loob
  rationale: Ang pautos na anyo ng חנן ay isang pakiusap para sa pabor o kagandahang-loob. Pinananatili ng salin ang diwa ng biyaya nang hindi ito nililimitahan sa awa lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: כִּי צַר לִי
  choice: sapagkat ako'y nasa kagipitan
  rationale: Ipinahihiwatig ng parirala ang personal na kalagayan ng matinding hirap o pagkasakal; natural at malinaw sa Filipino ang “nasa kagipitan.”
- source_word: עָשְׁשָׁה
  choice: Nanghina
  rationale: Maaaring tumukoy ang pandiwa sa panghihina, pagkupas, o pagkapinsala. Ang “nanghina” ay likas na kaugnay ng mata at maaari ring umabot sa kasunod na kaluluwa at tiyan.
- source_word: בְכַעַס
  choice: sa dalamhati
  rationale: Bagaman maaaring mangahulugan ang כעס ng galit o pagkayamot, sa konteksto ng panaghoy ay angkop ang panloob na dalamhati; itinatala sa talababa ang tunay na saklaw nito.
- source_word: עֵינִי
  choice: ang aking mata
  rationale: Pinanatili ang isahang bilang ng Hebreo at ang matalinghagang paglalarawan sa paghina ng paningin o buong pagkatao.
- source_word: נַפְשִׁי
  choice: ang aking kaluluwa
  rationale: Pinananatili ng “kaluluwa” ang malawak na antropolohikal na diwa ng נֶפֶשׁ, habang nililinaw sa talababa na maaari rin itong tumukoy sa buhay o sarili.
- source_word: וּבִטְנִי
  choice: at tiyan
  rationale: Ang בטן ay literal na tiyan at maaari ring tumukoy sa mga panloob na bahagi ng katawan. Pinanatili sa teksto ang kongkretong larawan at inilagay sa talababa ang mas malawak na kahulugan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng נַפְשִׁי sa paglalarawan sa tao
  choice: aking kaluluwa
  alternative: aking buhay o aking sarili
  rationale: Hindi nilulutas nang makitid ang salita bilang purong di-materyal na bahagi o bilang biyolohikal na buhay lamang; pinananatili ang matalinghagang tensiyon at binabanggit ang ibang posibilidad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ako'y” upang mapanatili ang panalangin at panulaang himig nang hindi nagiging lipas. Ang gitling na em ay nagpapakita na ang panghihina ay umaabot mula sa mata hanggang sa kaluluwa at tiyan.
