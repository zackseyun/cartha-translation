  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: tl
  text: 'Kay sagana ng iyong kabutihan,

    na itinabi mo para sa mga may takot sa iyo,

    na ginawa mo para sa mga nanganganlong sa iyo

    sa harap ng sangkatauhan![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa harap ng mga anak ng tao,” isang Hebreong katawagan sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַב
  choice: Kay sagana
  rationale: Ang padamdam na מָה kasama ng רַב ay nagpapahayag ng paghanga sa lubos na kasaganaan; natural itong naipapahayag sa Tagalog bilang “Kay sagana.”
- source_word: טוּבְךָ
  choice: iyong kabutihan
  rationale: Saklaw ng טוּב ang kabutihan at mabubuting kaloob; pinananatili ng “kabutihan” ang malawak na moral at mapagpalang diwa nito.
- source_word: צָפַנְתָּ
  choice: inilalaan mo
  rationale: Ipinahihiwatig ng pandiwa ang pagtatabi o pag-iimbak para sa hinaharap. Ang “inilalaan” ay natural sa Tagalog at pinananatili ang diwang nakahandang kabutihan nang hindi labis na idinidiin ang pagtatago.
- source_word: לִירֵאֶיךָ
  choice: para sa mga may takot sa iyo
  rationale: Tumutukoy ito sa mga taong kinikilala at iginagalang ang Diyos nang may banal na takot; ang parirala ay malinaw at pinananatili ang salitang “takot” sa halip na paliitin ito sa paggalang lamang.
- source_word: פָּעַלְתָּ
  choice: ipinagkakaloob mo
  rationale: Ang פעל ay tumutukoy sa pagsasagawa o pagpapangyari. Sa konteksto ng kabutihan ng Diyos, natural na ipinapahayag ng “ipinagkakaloob” ang kabutihang aktuwal niyang ginagawa para sa kanila.
- source_word: לַחֹסִים בָּךְ
  choice: sa mga nanganganlong sa iyo
  rationale: Pinananatili ng “nanganganlong” ang konkretong larawan ng paghahanap ng kanlungan na taglay ng חסה, habang ipinahihiwatig din ang pagtitiwala.
- source_word: נֶגֶד
  choice: sa harap ng
  rationale: Ipinahihiwatig ng נגד ang hayag na pagkilos sa paningin o harapan ng iba; tuwirang naipapahayag ito ng “sa harap ng.”
- source_word: בְּנֵי אָדָם
  choice: sangkatauhan
  rationale: Ang literal na “mga anak ng tao” ay isang kolektibong Hebreong katawagan sa mga tao sa pangkalahatan. Ang “sangkatauhan” ay malinaw, marangal, at hindi napagkakamalang tumutukoy lamang sa mga anak o mga lalaki.
theological_decisions:
- issue: Saklaw ng בְּנֵי אָדָם
  choice: sangkatauhan
  alternative: mga anak ng tao
  rationale: Ang parirala ay kumakatawan sa lahat ng tao, hindi lamang sa mga lalaking anak. Ginamit sa pangunahing teksto ang natural na kolektibong kahulugan, at inilagay sa talababa ang literal na anyo upang mapanatili ang Hebreong larawan.
- issue: Kahulugan ng pagkatakot sa Diyos sa לִירֵאֶיךָ
  choice: mga may takot sa iyo
  alternative: mga gumagalang sa iyo
  rationale: Pinananatili ang teolohikal na tensiyon ng “takot” na maaaring magsaklaw ng pagpipitagan at pangamba, sa halip na tahimik itong paliitin sa paggalang lamang.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang anyong patula at ang padamdam na “Kay sagana” upang mapanatili ang paghanga ng Hebreo. Pinanatili ang konkretong larawang “nanganganlong” at ang teolohikal na salitang “takot,” samantalang ginawang natural na “sangkatauhan” ang kolektibong idyomang Hebreo.
