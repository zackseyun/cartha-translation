  yaml_path: translation/ot/psalms/031/000.yaml
  text: For the choirmaster. A psalm of David[a].
translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan. Awit ni David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay David” o “kaugnay ni David.” Sa Hebreo, maaaring tumukoy ang pamagat sa pagkakatha, kaugnayan, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ang termino ay tumutukoy sa taong nangangasiwa sa pagtatanghal ng musika. Likas sa modernong Tagalog ang “tagapangasiwa ng awitan,” at ipinahahayag ng “Para sa” ang unlaping ל sa pamagat.
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan ito sa isang awiting panrelihiyon na maaaring may saliw ng musika. Mas natural at madaling maunawaan sa Tagalog ang “awit” kaysa sa teknikal na panghihiram.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang לְ sa mga pamagat ng Mga Awit ay maaaring magpahiwatig ng pagkakatha, kaugnayan, pag-aalay, o pagiging bahagi ng isang koleksiyon. Ang karaniwang pariralang “ni David” ay maikli at hindi tahasang nililimitahan ang ugnayan sa pagkakatha lamang.
theological_decisions:
- issue: Saklaw ng kahulugan ng Davidikong pamagat
  choice: ni David
  alternative: para kay David; kaugnay ni David
  rationale: Hindi tiyak na itinatakda ng Hebreo kung si David ang may-akda, pinag-alayan, o pangunahing kaugnay ng awit. Pinananatili sa pangunahing teksto ang tradisyonal at likas na anyo, habang nililinaw sa talababa ang tunay na lawak ng posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na “awit” at ang liturhikal ngunit madaling maunawaang “tagapangasiwa ng awitan.”
