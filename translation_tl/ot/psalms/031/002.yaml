translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang patulang paralelismo, ang konkretong larawan ng tainga, bato, at bahay, at ang dalawang magkaugnay ngunit hindi lubos na magkaparehong pandiwa para sa pagliligtas.
