base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: tl
  text: 'Ikiling mo ang iyong tainga sa akin;

    agad mo akong sagipin.

    Maging batong kanlungan ka para sa akin[a],

    isang bahay na tanggulan upang ako’y iligtas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matibay na bato.” Pinagsasama ng pariralang Hebreo ang “bato” at isang salitang tumutukoy sa matibay na kanlungan o tanggulan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang kuta” o “isang bahay ng mga tanggulan.” Pinananatili ng Hebreo ang larawan ng bahay habang inilalarawan itong lubhang pinatibay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: Ikiling mo sa akin ang iyong tainga
  rationale: Pinananatili ang konkretong talinghaga ng Hebreong idyoma—ang pagkiling ng tainga bilang masusing pakikinig—sa paraang malinaw at marangal sa modernong Tagalog.
- source_word: מְהֵרָה
  choice: agad
  rationale: Tuwirang ipinahahayag ang pagmamadali at apurahang tono ng panalangin.
- source_word: הַצִּילֵנִי
  choice: sagipin ako
  rationale: Ang נצל ay tumutukoy sa pag-agaw o pagliligtas mula sa panganib; ipinahihiwatig ng “sagipin” ang agarang pagliligtas at naihihiwalay ito sa kasunod na ישׁע.
- source_word: הֱיֵה לִי
  choice: Maging … ka para sa akin
  rationale: Pinananatili ang pautos at personal na ugnayang ipinahahayag ng pandiwa at ng panghalip na may לְ.
- source_word: לְצוּר מָעוֹז
  choice: batong kanlungan
  rationale: Pinagsasama nito ang larawan ng matibay na bato at ang kahulugan ng מָעוֹז bilang ligtas na dako o tanggulan.
- source_word: לְבֵית מְצוּדוֹת
  choice: isang bahay na tanggulan
  rationale: Pinananatili ang larawan ng בַּיִת (“bahay”) habang ipinahahayag ang מְצוּדוֹת bilang matibay na depensa o tanggulan.
- source_word: לְהוֹשִׁיעֵנִי
  choice: upang iligtas ako
  rationale: Isinasalin ang pawatas bilang layunin at ginagamit ang “iligtas” upang mapanatili ang bahagyang pagkakaiba nito sa naunang נצל, na isinaling “sagipin.”
