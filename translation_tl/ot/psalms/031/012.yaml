  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: tl
  text: Nalimutan na ako, gaya ng isang patay; wala na ako sa alaala[a]. Naging gaya ako ng isang nawalang sisidlan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa puso.” Sa idyomang Hebreo, tumutukoy ito sa pagkawala sa isip o alaala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang nasirang sisidlan.” Ang salitang Hebreo ay maaaring tumukoy sa bagay na nawala, napahamak, o nasira.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Nalimutan na ako
  rationale: Ang Niphal perfect ay nagsasaad ng kalagayan ng nagsasalita bilang isang nalimutan na; likas sa Filipino ang paggamit ng “na” upang ipahayag ang resultang kalagayan.
- source_word: כְּמֵת
  choice: gaya ng isang patay
  rationale: Pinananatili nito ang tahasang paghahambing at ang isahang anyo ng מֵת nang hindi dinaragdagan ang kasarian na hindi kailangang bigyang-diin sa Filipino.
- source_word: מִלֵּב
  choice: wala na ako sa alaala
  rationale: Bagaman literal na “mula sa puso,” ang לֵב dito ay tumutukoy sa isip o pag-alaala. Ang pariralang Filipino ay malinaw at likas, at pinananatili ang ideya ng pagkawala sa gunita.
- source_word: הָיִיתִי
  choice: Naging gaya ako
  rationale: Ipinahahayag ng anyong perfect ng היה ang pagdating sa isang kalagayang nananatiling totoo sa inilalarawang karanasan.
- source_word: כִּכְלִי
  choice: gaya ng isang ... sisidlan
  rationale: Malawak ang saklaw ng כְּלִי bilang gamit, kasangkapan, o sisidlan. Ang “sisidlan” ay akma sa larawang patula at hindi labis na tumutukoy sa isang partikular na bagay.
- source_word: אֹבֵד
  choice: nawalang
  rationale: Maaaring mangahulugan ang participle ng אבד na nawala, napahamak, o nasira. Pinipili ng pangunahing teksto ang natural na “nawalang,” habang inilalahad sa talababa ang tunay na alternatibong “nasirang.”
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino; malinaw sa karaniwang mambabasa at nananatiling patula. Iniwasan ang sobrang literal na “mula sa puso” sa pangunahing teksto dahil maliligaw nito ang kahulugan ng idyoma, ngunit pinanatili ito sa talababa. Ang pag-uulit ng “gaya” ay sumasalamin sa dalawang paghahambing ng Hebreo.
