translation:
  language: tl
  text: Sapagkat[a] ikaw ang aking bato at aking tanggulan[b]; alang-alang sa iyong pangalan, pangungunahan mo ako at papatnubayan mo ako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dahil ikaw ang aking bato at aking tanggulan.” Ang Hebreong כִּי ay maaaring magpakilala ng dahilan o ng paliwanag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aking moog.”
    reason: lexical_alternative
  - marker: c
    text: 'Magkalapit ang kahulugan ng dalawang pandiwa sa Hebreong tula: “pangungunahan” at “papatnubayan.” Maaari rin silang unawain bilang pakiusap: “pangunahan mo ako at patnubayan mo ako.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng panalangin sa konteksto. Likas sa makabagong Filipino ang “sapagkat,” bagaman maaari rin itong magpakilala ng paliwanag.
- source_word: סַלְעִי
  choice: aking bato
  rationale: Ang סֶלַע ay malaking bato, batuhan, o matarik na batong kanlungan. Pinananatili ng “bato” ang malinaw at matatag na talinghaga ng katiwasayan.
- source_word: מְצוּדָתִי
  choice: aking tanggulan
  rationale: Tumutukoy ito sa isang pinatibay at ligtas na lugar. Ang “tanggulan” ay natural, marangal, at malinaw sa karaniwang mambabasa.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: alang-alang sa iyong pangalan
  rationale: Pinananatili nito ang idyomang Hebreo na nag-uugnay sa pagkilos ng Diyos sa kanyang pangalan—sa kanyang ipinahayag na pagkatao, karangalan, at katapatan—nang hindi ito pinalalawak sa salin.
- source_word: תַּנְחֵנִי
  choice: pangungunahan mo ako
  rationale: Ang Hiphil ng נחה ay nangangahulugang manguna o gumabay. Ang anyong panghinaharap ay angkop sa tiyak na pagtitiwala ng salmista.
- source_word: וּתְנַהֲלֵנִי
  choice: at papatnubayan
  rationale: Nagsasaad ito ng maingat na pag-akay o pamamahala sa daraanan. Inihihiwalay ng “papatnubayan” ang pandiwang ito sa nauna habang pinananatili ang magkatulad na diwa ng paralelismong Hebreo.
theological_decisions:
- issue: Kahulugan ng “alang-alang sa iyong pangalan”
  choice: Ang pagkilos ng Diyos ay hinihiling at inaasahan batay sa kanyang sariling pangalan—sa kanyang ipinahayag na pagkatao, karangalan, at katapatan.
  alternative: Unawain lamang ito bilang pag-iingat ng Diyos sa kanyang reputasyon sa harap ng ibang tao.
  rationale: Mas malawak ang saklaw ng Hebreong idyoma kaysa reputasyon lamang, ngunit hindi dapat dagdagan sa pangunahing teksto ang paliwanag na wala roon.
- issue: Lakas ng mga pandiwang imperfect
  choice: 'Tiyak na inaasahan: “pangungunahan mo ako at papatnubayan.”'
  alternative: 'Pakiusap: “pangunahan mo ako at patnubayan”; maaari ring basahing pangkasalukuyan ayon sa daloy ng tula.'
  rationale: Kasunod ng pagpapahayag na ang Diyos ang bato at tanggulan ng salmista, maaaring ipahayag ng mga imperfect ang may-tiwalang pag-asa. Gayunman, dahil nasa konteksto ito ng panalangin, nananatiling tunay na posibilidad ang pagbasa bilang pakiusap at itinatala iyon sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang payak na talinghagang “bato” at ang idyomang “alang-alang sa iyong pangalan.” Ang “tanggulan” at “papatnubayan” ay bahagyang mataas ang register ngunit karaniwan pa ring nauunawaan at angkop sa panulaang panalangin.
