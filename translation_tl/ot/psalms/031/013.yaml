  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: tl
  text: Sapagkat narinig ko ang mga bulung-bulungan ng marami[a]—lagim sa buong paligid!—habang sama-sama silang nagsasabwatan laban sa akin at nagbabalak na kitilin ang buhay ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paninirang-puri ng marami.” Ang salitang Hebreo ay maaaring tumukoy sa bulung-bulungan, kumakalat na balita, o mapanirang pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pagpapahayag ng pagdurusa.
- source_word: שָׁמַעְתִּי
  choice: narinig ko
  rationale: Likas na anyo sa modernong Tagalog para sa natapos na pagkarinig na patuloy na mahalaga sa kasalukuyang kalagayan ng nagsasalita.
- source_word: דִּבַּת רַבִּים
  choice: ang mga bulung-bulungan ng marami
  rationale: Sinasaklaw ng “bulung-bulungan” ang palihim na usapan at kumakalat na masamang balita nang hindi agad nililimitahan ang salita sa tahasang paninirang-puri; inilalahad sa talababa ang mahalagang alternatibo.
- source_word: מָגוֹר מִסָּבִיב
  choice: lagim sa buong paligid
  rationale: Pinananatili ang maikli at matinding larawan ng nakapalibot na takot o panganib.
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: habang sama-sama silang nagsasabwatan laban sa akin
  rationale: Ipinahahayag ang kasabay na pagkilos, sama-samang pagpapayo, at malinaw na masamang hangarin laban sa salmista.
- source_word: לָקַחַת נַפְשִׁי זָמָמוּ
  choice: nagbabalak na kitilin ang buhay ko
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa buhay ng tao, hindi lamang sa di-materyal na kaluluwa; ang “kitilin” ay malinaw na naghahatid ng banta ng pagpatay.
