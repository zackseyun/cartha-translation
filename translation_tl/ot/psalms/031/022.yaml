  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: tl
  text: Ngunit sinabi ko sa aking pagkataranta[a], “Nawalay na ako mula sa iyong paningin[b].” Gayunman, dininig mo ang tinig ng aking mga pagsusumamo nang dumaing ako sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa aking pagmamadali.” Ang salitang Hebreo ay maaaring tumukoy sa pagmamadali, pagkabalisa, o pagkataranta.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa harap ng iyong mga mata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: sa aking pagkataranta
  rationale: Maaaring tumukoy ang חפז sa pagmamadali, pagkabalisa, o pagkataranta. Sa konteksto ng panaghoy, natural na ipinahahayag ng “pagkataranta” ang matinding ligalig, habang inilalagay sa talababa ang posibleng “pagmamadali.”
- source_word: נִגְרַזְתִּי
  choice: Nawalay na ako
  rationale: Ang Niphal ng גזר ay nagpapahayag ng pagkaputol o pagkahiwalay. Ang “nawalay na ako” ay natural sa modernong Tagalog at nagpapanatili sa agarang pakiramdam ng nagsasalita nang hindi tahasang ginagawang doktrinal na pagtatakwil.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: sa iyong paningin
  rationale: Literal itong “mula sa harap ng iyong mga mata.” Ang “sa iyong paningin” ay malinaw at idiomatiko sa Tagalog; ang mas literal na larawan ay pinanatili sa talababa.
- source_word: אָכֵן
  choice: Gayunman
  rationale: Dito ay naghuhudyat ang אָכֵן ng matinding pagsalungat sa inakala ng salmista at sa aktuwal na pagtugon ng Diyos.
- source_word: קוֹל תַּחֲנוּנַי
  choice: ang tinig ng aking mga pagsusumamo
  rationale: Pinananatili ng “tinig” ang קוֹל at ipinahahayag ng “mga pagsusumamo” ang taimtim na paghingi ng lingap o awa, sa marangal ngunit nauunawaang pananalita.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: nang humingi ako ng tulong sa iyo
  rationale: Ang שׁוע ay isang pagdaing o pagsigaw para sa tulong. Ang saling ito ay natural sa Tagalog at malinaw na inilalahad ang kahulugang nakapaloob sa pandiwa.
theological_decisions:
- issue: Ang pakiramdam na pinabayaan ng Diyos laban sa katotohanang dininig niya ang salmista
  choice: Pinanatili ang pansariling pakiramdam na “Nawalay na ako sa iyong paningin,” na sinusundan ng salungat na katotohanang dininig ng Diyos ang pagsusumamo.
  alternative: Isaling mas interpretibo bilang “Akala ko'y itinakwil mo ako.”
  rationale: Hindi tahasang sinasabi ng Hebreo na itinakwil ng Diyos ang salmista. Pinananatili ng salin ang tensiyon sa pagitan ng takot ng tao at ng aktuwal na pagtugon ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at natural. Ginamit ang “pagkataranta” para sa emosyonal na konteksto ng panaghoy, at “nawalay” upang mapanatili ang larawan ng pagkahiwalay nang hindi nagpapasok ng mas matinding ideya ng tahasang pagtatakwil.
