base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: tl
  text: Itinatago mo sila sa kublihan ng iyong presensya, mula sa mga pakana ng tao[a]; ikinukubli mo sila sa isang kanlungan, mula sa alitan ng mga dila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagsasabwatan ng tao” o “mga balak ng tao.” Bihira at hindi tiyak ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “alitan ng mga dila,” na tumutukoy sa palaaway, mapanirang-puri, o iba pang mapanlabang pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: Itinatago mo sila
  rationale: Ang Hiphil ng סתר ay nagpapahayag ng pagkilos na itago o ikubli ang isang tao; natural sa makabagong Tagalog ang “itinatago mo sila” at malinaw ang aktibong pag-iingat ng Diyos.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: sa kublihan ng iyong presensya
  rationale: Ang סֵתֶר ay kublihan o lihim na lugar, samantalang ang פָּנִים ay literal na “mukha” ngunit maaari ring tumukoy sa presensya. Pinananatili ng parirala ang diwa ng proteksiyon at pagiging malapit sa Diyos.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: malayo sa mga pakana ng tao
  rationale: Bihira at mahirap tiyakin ang רֻכְסֵי; sa konteksto, malamang na tumutukoy ito sa masasamang balak, pagsasabwatan, o pakana. Pinananatili ng “tao” ang panlahatang isahang אִישׁ.
- source_word: תִּצְפְּנֵם
  choice: ikinukubli mo sila
  rationale: Ang צפן ay nangangahulugang itago, iligpit, o ingatan. Ang “ikinukubli” ay malapit sa pangunahing diwa at angkop sa paralelismo ng tula.
- source_word: בְּסֻכָּה
  choice: sa isang kanlungan
  rationale: Ang סֻכָּה ay maaaring kubol o silungan; dito, nangingibabaw ang diwa ng lugar na nagbibigay-proteksiyon, kaya natural ang “kanlungan.”
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: malayo sa labanan ng mga dila
  rationale: Ang רִיב ay alitan, pagtatalo, o labanan, at ang לְשֹׁנוֹת ay literal na “mga dila,” isang matingkad na larawan para sa mapanirang pananalita. Pinananatili ang metapora at makatang puwersa ng Hebreo.
theological_decisions:
- issue: Panlahatang kasarian at bilang ng אִישׁ
  choice: tao
  alternative: mga tao / lalaki
  rationale: Isahang panlalaki ang anyong Hebreo ngunit ginagamit bilang kinatawan ng sangkatauhan. Ang “tao” ay tumpak sa bilang at likas sa Tagalog nang hindi nililimitahan ang diwa sa mga lalaki lamang.
- issue: פָּנִים bilang mukha o presensya
  choice: presensya
  alternative: mukha
  rationale: Bagaman literal na “mukha,” sa ugnayang konteksto ang salita ay maaari ring mangahulugang presensya. Iniiwasan ng “presensya” ang hindi likas na “kublihan ng iyong mukha” habang pinananatili ang teolohikal na larawan ng pag-iingat sa piling ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo at ang metaporang “mga dila,” habang gumamit ng “presensya” at “kanlungan” upang maging natural ang protektibong larawan sa Tagalog.
