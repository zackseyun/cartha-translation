  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: tl
  text: Ngunit ako, sa iyo ako nagtitiwala, Yahweh; sinasabi ko, “Ikaw ang Diyos ko.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit ako ay nagtiwala sa iyo, Yahweh; sinabi ko, ‘Ikaw ang Diyos ko.’” Ang mga pandiwang Hebreo ay maaaring tumukoy sa nakaraan o sa isang pagtitiwala at pagpapahayag na nananatili hanggang sa kasalukuyan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ipinahahayag ng pang-ugnay at hiwalay na panghalip ang pagsalungat at pagdidiin; natural itong naihahatid ng “Ngunit ako” sa makabagong Filipino.
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: sa iyo ako nagtitiwala
  rationale: Kapag kasama ng בטח, ang על ay tumutukoy sa pinagtutuunan ng pagtitiwala. Ang ayos na ito ay natural sa Filipino at pinananatili ang diin sa “sa iyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אָמַרְתִּי
  choice: sinasabi ko
  rationale: Bagaman qatal ang anyo, sa konteksto ng kasalukuyang panalangin at kaagapay ng pagpapahayag ng pagtitiwala, naihahatid ng aspektong imperpektibo ang nagpapatuloy na pagpapahayag.
- source_word: אֱלֹהַי אָתָּה
  choice: Ikaw ang Diyos ko
  rationale: Pinananatili ng tahasang “Ikaw” ang diin ng independent pronoun, samantalang ang “Diyos ko” ay likas na salin ng pangngalang may hulaping unang panauhan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa pinagmulan sa halip na palitan ito ng titulo.
- issue: Panahunan/aspekto ng בָטַחְתִּי at אָמַרְתִּי
  choice: 'Kasalukuyan at nagpapatuloy: “nagtitiwala” at “sinasabi”'
  alternative: 'Naganap o perpektibo: “nagtiwala/umasa” at “sinabi” o “nagtiwala na” at “nasabi na”'
  rationale: Maaaring tumukoy sa nakaraan o sa isang kalagayang nananatili hanggang kasalukuyan ang mga qatal form. Sa daloy ng panalangin, ang kasalukuyang pagpapahayag ng tiwala at pagkilala ay natural, ngunit itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pag-uulit na “ako” sa “sa iyo ako nagtitiwala” upang natural na mapanatili ang diin ng Hebreo. Inilagay ang talababa pagkatapos ng buong pangungusap upang saklawin nito ang dalawang pandiwang may alternatibong aspektuwal na pagbasa.
