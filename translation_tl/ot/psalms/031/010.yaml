  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: tl
  text: 'Sapagkat nauubos sa dalamhati ang buhay ko,

    at sa pagbubuntong-hininga ang aking mga taon;

    bumigay ang aking lakas[b] dahil sa aking kasamaan[a],

    at nanghina ang aking mga buto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa aking pagkakasala” o “dahil sa bunga ng aking kasamaan.” Maaaring tumukoy ang salitang Hebreo sa kasamaan, pananagutan, o bunga nito.
    reason: lexical_alternative
  - marker: b
    text: O “natitisod” o “umaika ang aking lakas.” Ang pandiwang Hebreo ay literal na tumutukoy sa pagkatisod o pag-ika at ginagamit dito nang metaporikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o sanhi na ipinakikilala ng Hebreo at natural itong kaugnay ng naunang panaghoy.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: nauubos sa dalamhati ang buhay ko
  rationale: Ang כָלוּ ay nagpapahiwatig ng pagkaubos o pagdating sa wakas; ang progresibong “nauubos” ay natural sa Filipino at ipinadarama ang patuloy na pagkaigsi ng buhay sa dalamhati.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: at sa pagbubuntong-hininga ang aking mga taon
  rationale: Pinananatili ang maikling paralelismo ng Hebreo. Ang “pagbubuntong-hininga” ay malinaw at kasalukuyang katumbas ng אֲנָחָה.
- source_word: כָּשַׁל ... כֹחִי
  choice: bumigay ang aking lakas
  rationale: Ang כָּשַׁל ay literal na tumutukoy sa pagkatisod o pag-ika at maaari ring mangahulugang pagkabigo. Ang “bumigay” ay natural na metaporang Filipino para sa lakas na hindi na nakatagal.
- source_word: בַּעֲוֺנִי
  choice: dahil sa aking kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala, pananagutan, o bunga nito. Ang “kasamaan” ay nagpapanatili sa moral na diwa nang hindi tiyakang ipinapakahulugan bilang kaparusahan.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: at nanghihina ang aking mga buto
  rationale: Pinananatili ang kongkretong larawan ng mga buto. Ang “nanghihina” ay natural na naghahatid ng pagkalanta o pagkaubos na ipinahihiwatig ng עָשֵׁשׁוּ.
theological_decisions:
- issue: Saklaw ng kahulugan ng עָוֹן sa paglalarawan ng mang-aawit sa sarili
  choice: kasamaan
  alternative: pagkakasala; pananagutan; bunga ng aking kasamaan
  rationale: Maaaring tukuyin ng salitang Hebreo ang maling gawa, ang pananagutang dulot nito, o ang bunga nito. Pinananatili ng pangunahing salin ang moral na sangkap ngunit hindi ipinipilit na ang paghina ay tuwirang kaparusahan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dalamhati” dahil angkop ito sa panulaan at pamilyar pa rin, samantalang ang “bumigay ang aking lakas” ay natural na naghahatid ng metapora ng Hebreo. Iningatan ang paralelismo at mga larawang pandama ng talata.
