base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: tl
  text: Mahalin ninyo si Yahweh, kayong lahat na tapat sa kanya![a] Iniingatan ni Yahweh ang mga tapat, ngunit lubos niyang sinusuklian[b] ang taong kumikilos nang may pagmamataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng kanyang mga banal” o “lahat ng kanyang mga tapat.” Ang salitang Hebreo ay tumutukoy sa mga taong kinakikitaan ng matibay na katapatan sa ugnayan nila kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinusuklian nang buo” o “sinusuklian nang sagana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Ibigin ninyo
  rationale: Tuwirang pangmaramihang pautos ang Qal imperative ng אהב. Ang “Ibigin ninyo” ay malinaw, marangal, at angkop sa panawagan sa buong sambayanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na banal na pangalan bilang “Yahweh” upang malinaw na katawanin ang יהוה sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: כָּל־חֲסִידָיו
  choice: kayong lahat na mga tapat sa kanya
  rationale: Ang חָסִיד ay tumutukoy sa mga taong may katapatan at matibay na debosyon sa ugnayang tipan. Iniiwasan ng “mga tapat sa kanya” ang posibleng makitid na kahulugan ng tradisyonal na “mga banal,” habang pinananatili ang relasyonal na diwa at ang hulaping tumutukoy sa kanya.
- source_word: אֱמוּנִים
  choice: ang mga tapat
  rationale: Pangngalang gamit ng pangmaramihang anyo mula sa אמן, na tumutukoy sa mga taong maaasahan o tapat. Ang “mga tapat” ay maikli at natural sa Filipino.
- source_word: נֹצֵר
  choice: Iniingatan
  rationale: Ang נצר ay nangangahulugang maingat na pagbabantay, pag-iingat, o pagpapanatiling ligtas. Ang “Iniingatan” ay likas sa Filipino at umaayon sa tema ng banal na proteksiyon.
- source_word: וּמְשַׁלֵּם
  choice: ngunit ... sinusuklian
  rationale: Ang Piel participle ng שלם ay may diwang pagbabayad o pagganti ayon sa ginawa. Ang “sinusuklian” ay nagpapanatili ng pangkalahatan at nagpapatuloy na kilos; ginamit ang “ngunit” upang ihayag ang kontekstuwal na pagsalungat sa pag-iingat sa mga tapat.
- source_word: עַל־יֶתֶר
  choice: lubos
  rationale: Ang parirala ay nagpapalakas sa diwa ng pagsusukli at maaaring mangahulugang lubos o sagana. Ang “lubos” ay malinaw nang hindi pinalalabis ang kahulugan.
- source_word: עֹשֵׂה גַאֲוָה
  choice: ang taong kumikilos nang may pagmamataas
  rationale: Literal itong “gumagawa ng pagmamataas.” Ang salin ay natural sa Filipino at pinananatili ang aktibong asal ng mayabang na tao, hindi lamang ang panloob na damdamin.
theological_decisions:
- issue: Paglalarawan sa חֲסִידָיו bilang bayan na tapat kay Yahweh
  choice: kayong lahat na mga tapat sa kanya
  alternative: kayong lahat na kanyang mga banal
  rationale: Ipinapakita ng piniling salin ang katapatan at debosyon sa ugnayan kay Yahweh nang hindi ipinapasok ang mas huling teknikal o eklesiyastikong pakahulugan ng “mga banal.”
- issue: Pagpapanatili sa magkatabing banal na pag-iingat at pagganti
  choice: Iniingatan ni Yahweh ang mga tapat, ngunit lubos niyang sinusuklian ang taong kumikilos nang may pagmamataas
  alternative: Iniingatan ni Yahweh ang mga tapat at sagana niyang ginagantihan ang taong palalo
  rationale: Pinananatili ang tensiyon sa Hebreo sa pagitan ng proteksiyon sa mga tapat at ganap na pagsusukli sa mapagmataas. Hindi nilalambutan o pinalalawak ang paghatol nang lampas sa sinasabi ng talata.
translation_notes:
  register: Makabago at dignidad na Filipino, na gumagamit ng tuwirang panawagan at pangkaraniwang bokabularyo. Pinanatili ang personal na pangalang “Yahweh,” ang pangmaramihang pakikipag-usap, at ang matinding paghahambing ng pag-iingat at pagsusukli.
