  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: tl
  text: Magagalak ako at magsasaya sa iyong tapat na pag-ibig, sapagkat nakita mo ang aking paghihirap; batid mo ang mga kagipitan ng aking kaluluwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kagipitan sa aking buhay” o “mga kagipitan ng aking sarili.” Ang salitang Hebreo na nefesh ay maaaring mangahulugang “kaluluwa,” “buhay,” o “sarili,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: Magagalak ako
  rationale: Ang Qal cohortative na unang panauhan ng גיל ay nagpapahayag ng masidhing galak bilang pasiya o hangarin. Likas sa modernong Tagalog ang “Magagalak ako” at napananatili nito ang inaasam o ipinapasiyang pagkilos.
- source_word: וְאֶשְׂמְחָה
  choice: at magsasaya
  rationale: Ang שמח, na itinambal sa גיל, ay nagpapatingkad sa galak. Pinananatili ng “magagalak ... at magsasaya” ang makatang pagtutugma nang hindi inuulit ang parehong salita.
- source_word: בְחַסְדֶּךָ
  choice: sa iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig, kadalasa’y may kaugnayan sa katapatan sa tipan. Ang “tapat na pag-ibig” ay malinaw, marangal, at hindi labis na nagpapakitid sa kahulugan.
- source_word: אֲשֶׁר
  choice: sapagkat
  rationale: Bagaman karaniwang pantukoy na pang-ugnay, dito ay ipinakikita nito ang dahilan ng pagsasaya. Ang “sapagkat” ay likas at angkop sa marangal na himig ng salmo.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: nakita mo ang aking paghihirap
  rationale: Ang עֳנִי ay maaaring tumukoy sa pagdurusa, kaapihan, o abang kalagayan. Malawak at natural ang “paghihirap,” habang pinananatili ng “nakita mo” ang tuwirang larawan ng Hebreo.
- source_word: יָדַעְתָּ
  choice: batid mo
  rationale: Saklaw ng ידע ang pagkakilala at malalim na pagkaalam. Pinananatili ng “batid mo” ang lawak nito at ang marangal na tonong patula, nang hindi ito tahasang ginagawang “pinansin” o “inalagaan.”
- source_word: בְצָרוֹת נַפְשִׁי
  choice: ang mga dalamhati ng aking kaluluwa
  rationale: Ang צָרוֹת ay maramihang kapighatian o kagipitan, at ang נֶפֶשׁ ay maaaring mangahulugang kaluluwa, buhay, o buong sarili. Ipinahahayag ng “mga dalamhati” ang maramihang matinding kabagabagan, at pinananatili ng “kaluluwa” ang sadyang kalabuan at lalim ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa נֶפֶשׁ sa isang salmo ng panaghoy
  choice: kaluluwa
  alternative: buhay; sarili; buong pagkatao
  rationale: Maaaring tukuyin ng נֶפֶשׁ ang buhay o buong sarili, hindi lamang isang hiwalay na di-materyal na bahagi ng tao. Pinananatili ng “kaluluwa” ang tradisyonal at patulang lalim ng salita, samantalang nililinaw ng talababa ang mga lehitimong alternatibo upang hindi ipilit ang isang teknikal na dualismong katawan-kaluluwa.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at patulang himig. Ginamit ang karaniwang mauunawaang mga salita, habang pinanatili ang dobleng pahayag ng galak, ang katapatan sa חֶסֶד, at ang semantikong lawak ng נֶפֶשׁ.
