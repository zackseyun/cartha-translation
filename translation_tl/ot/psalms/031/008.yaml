  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: tl
  text: At hindi mo ako ibinigay sa kamay ng kaaway[a]; inilagay mo ang aking mga paa sa maluwang na lugar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi mo ako ibinigay sa kapangyarihan ng kaaway.”
    reason: lexical_alternative
  - marker: b
    text: Ang “maluwang na lugar” ay larawan ng kalayaan, kaligtasan, at ginhawa mula sa pagkakakulong o kagipitan.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: ibinigay mo ako
  rationale: Ang Hiphil ng סגר sa kontekstong ito ay tumutukoy sa pagbibigay ng isang tao sa kapangyarihan ng iba. Likas sa Filipino ang pariralang ito at naiiwasan ang mapanlinlang na sobrang literal na diwang 'ikinulong.'
- source_word: בְּיַד
  choice: sa kamay ng
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na tumutukoy sa pagkasailalim sa kapangyarihan o kontrol ng iba.
- source_word: אוֹיֵב
  choice: kaaway
  rationale: Ang pang-isahang anyo ay maaaring tumukoy sa isang kaaway o sa kaaway bilang pangkalahatang larawan ng kalaban; hindi ito nilinaw nang higit sa hinihingi ng Hebreo.
- source_word: הֶעֱמַדְתָּ
  choice: inilagay mo
  rationale: Ipinahihiwatig ng Hiphil ng עמד ang pagpapapatayo o paglalagay nang matatag. Natural ang 'inilagay mo' sa Filipino habang ang mga paa at maluwang na lugar ay nagpapahiwatig ng ligtas na pagtayo.
- source_word: בַמֶּרְחָב
  choice: sa maluwang na lugar
  rationale: Pinananatili ang larawan ng kaluwagan at pagiging bukás bilang kabaligtaran ng pagkakakulong o kagipitan.
- source_word: רַגְלָי
  choice: ang aking mga paa
  rationale: Tapat na isinasalin ang pangmaramihang anyo at pinananatili ang larawan ng matatag at malayang pagtayo.
- source_word: וְלֹא
  choice: At hindi
  rationale: Pinananatili ang payak na pag-uugnay ng sugnay sa naunang taludtod nang hindi nagdaragdag ng mas mariing pagsalungat.
