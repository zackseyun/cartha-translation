  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: tl
  text: 'Mapatahimik nawa ang mga sinungaling na labi,

    na nagsasalita nang may kapalaluan laban sa matuwid,

    may pagmamalaki at paghamak.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: Mapatahimik nawa
  rationale: Ang Nifal imperfect na may puwersang jussive ay nagpapahayag ng hiling o panawagan na patahimikin o manahimik ang tinutukoy; likas sa marangal na Tagalog ang “Mapatahimik nawa.”
- source_word: שִׂפְתֵי שָׁקֶר
  choice: ang mga labing sinungaling
  rationale: Ang literal na “mga labi ng kasinungalingan” ay likas na naipahahayag bilang “mga labing sinungaling,” habang pinananatili ang metonimiya ng mga labi para sa mapanlinlang na pananalita.
- source_word: הַדֹּבְרוֹת
  choice: na nagsasalita
  rationale: Ang pambabaeng pangmaramihang participle ay umaayon sa “mga labi” at gumaganap bilang panuring; malinaw itong naipapahayag ng sugnay na “na nagsasalita.”
- source_word: עַל צַדִּיק
  choice: laban sa matuwid
  rationale: Pinananatili ng “matuwid” ang substantival at kinatawang isahan ng Hebreo nang hindi nagdaragdag ng kasarian; ipinahihiwatig ng konteksto na siya ang tudlaan ng mapanlait na pananalita.
- source_word: עָתָק
  choice: nang may kapalaluan
  rationale: Ang pangngalan ay tumutukoy sa hambog, walang-galang, o mapangahas na pananalita. Ang “may kapalaluan” ay naglalarawan sa paraan ng pagsasalita at nananatiling marangal at madaling maunawaan.
- source_word: בְּגַאֲוָה
  choice: may pagmamalaki
  rationale: Ang בְּ kasama ng pangngalan ay nagsasaad ng paraan o saloobin; “may pagmamalaki” ang likas na katumbas na pinananatili ang diwa ng pagmamataas.
- source_word: וָבוּז
  choice: at paghamak
  rationale: Ang בּוּז ay paghamak o pag-alipusta; ang “paghamak” ay tuwiran, kasalukuyan, at angkop na kapareha ng “pagmamalaki.”
theological_decisions:
- issue: Saklaw ng צַדִּיק bilang isahang substantibo
  choice: matuwid
  alternative: isang taong matuwid
  rationale: Ang walang artikulong isahan ay maaaring tumukoy sa isang tiyak na taong matuwid o gumana bilang kinatawang katawagan. Hindi nilulutas ng “matuwid” ang tunay na kalabuan at hindi rin nagtatakda ng kasarian.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong patula sa tatlong linya at ang matinding pag-uulit ng magkakalapit na konsepto—kapalaluan, pagmamalaki, at paghamak—sapagkat bahagi ito ng retorika ng Hebreo. Walang footnote dahil naipapahayag sa pangunahing teksto ang diwa nang hindi kinakailangang pasanin ang talata ng mga alternatibong salin.
