  to: 'Dahil sa lahat ng aking mga kaaway,

    naging kasiraan ako,

    lalo na sa aking mga kapitbahay,

    at kinatatakutan ng aking mga kakilala;

    ang mga nakakakita sa akin sa lansangan,[b]

    lumalayo sa akin.[c]'
  rationale: 'Pinalitan ang “kahiya-hiya” ng “kasiraan” upang maipakita na ang nagsasalita ay naging layon ng paghamak. Inayos ang huling dalawang linya upang maging wastong Tagalog at malinaw ang tinutukoy ng pandiwang “lumalayo.” Idinagdag ang talababa para sa pinagtatalunang saklaw ng pambungad na parirala. Tandaan: ang marker [a] ay dapat ilagay pagkatapos ng “mga kaaway” sa unang linya sa naka-typeset na teksto: “Dahil sa lahat ng aking mga kaaway,[a]”.'
