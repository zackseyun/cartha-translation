base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: tl
  text: 'Dahil sa lahat ng aking mga kaaway,

    naging kasiraan ako,

    lalo na sa aking mga kapitbahay,

    at kinatatakutan ng aking mga kakilala;

    ang mga nakakakita sa akin sa lansangan,[b]

    lumalayo sa akin.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Literal na “sa labas”; tumutukoy ito sa pagkakita sa kanya sa pampublikong lugar.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “tumatakas palayo sa akin” o “gumagala palayo sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: Dahil sa lahat ng aking mga kaaway
  rationale: Ipinapahayag ang malamang na sanhi o dahilan ng kanyang kahihiyan. Maaari ring unawain ang מִן bilang pinagmulan o paghahambing, ngunit mas natural sa konteksto ang sanhi.
- source_word: הָיִיתִי חֶרְפָּה
  choice: ako'y naging kahiya-hiya
  rationale: Pinananatili ng “naging” ang naganap na pagbabago at ang kasalukuyang kalagayan; ipinahihiwatig ng חֶרְפָּה na siya ay naging tampulan ng kahihiyan o paghamak.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: lalo na sa aking mga kapitbahay
  rationale: Natural na ipinahahayag sa Tagalog ang matinding epekto nito sa mga taong malapit sa kanya, bagaman literal na may diwang “at lubha sa aking mga kapitbahay.”
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: at kinatatakutan ng mga kakilala ko
  rationale: Ipinapakita na siya mismo ay naging dahilan o bagay ng takot sa mga nakakakilala sa kanya; ang מְיֻדָּעַי ay mga kakilala, hindi kinakailangang matatalik na kaibigan.
- source_word: רֹאַי בַּחוּץ
  choice: nang makita nila ako sa lansangan
  rationale: Ang בַּחוּץ ay literal na “sa labas,” ngunit tumutukoy rito sa pampublikong lugar; malinaw at likas sa modernong Tagalog ang “sa lansangan.”
- source_word: נָדְדוּ מִמֶּנִּי
  choice: lumayo sila sa akin
  rationale: Ang נָדַד ay maaaring mangahulugang lumayo, gumala palayo, o tumakas. Pinananatili ng “lumayo” ang saklaw ng pandiwa nang hindi labis na pinatitindi ang reaksiyon.
