id: PSA.31.6
reference: Psalms 31:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: tl
  text: Napopoot ako sa mga kumakapit sa mga walang-kabuluhang diyus-diyosan[a], ngunit ako, kay Yahweh ako nagtitiwala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nag-iingat o nagpapahalaga sa mga walang-saysay na diyus-diyosan,” o “mga kumakapit sa mga hungkag na kabulaanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Napopoot ako
  rationale: Ang Qal perfect na unang panauhang isahan ay nagpapahayag dito ng matatag at nagpapatuloy na saloobin; natural itong isalin sa kasalukuyang panahunan sa Tagalog.
- source_word: הַשֹּׁמְרִים
  choice: mga kumakapit sa
  rationale: Bagaman ang pangunahing diwa ng שמר ay mag-ingat, magbantay, o magpanatili, ipinahihiwatig ng gamit nito rito ang tapat na pagkapit o debosyon sa mga bagay na pinagkakatiwalaan.
- source_word: הַבְלֵי שָׁוְא
  choice: mga walang-kabuluhang diyus-diyosan
  rationale: Pinagsasama ng parirala ang mga diwa ng kahungkagan, kawalang-saysay, at kabulaanan. Nililinaw ng “diyus-diyosan” ang malamang na tinutukoy sa konteksto ng pagsamba at pagtitiwala, habang pinananatili ng “walang-kabuluhan” ang mapanuring lakas ng Hebreo.
- source_word: וַאֲנִי
  choice: ngunit ako
  rationale: Ang pangatnig at tahasang panghalip ay nagbibigay-diin sa paghahambing ng salmista sa mga naunang binanggit.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: kay Yahweh ako nagtitiwala
  rationale: Ang אֶל ay literal na “tungo sa,” ngunit kasama ng בטח, likas sa Tagalog ang “magtiwala kay.” Pinananatili ng ayos ng salita ang diin kay Yahweh at ang kasalukuyang matatag na pagtitiwala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Tinutukoy ng הַבְלֵי שָׁוְא
  choice: mga walang-kabuluhang diyus-diyosan
  alternative: mga hungkag na kabulaanan; mga bagay na walang saysay
  rationale: Maaaring unawain nang mas abstrakto ang Hebreong parirala, ngunit malamang na tumutukoy ito sa huwad na mga bagay ng pagsamba o pagtitiwala. Nililinaw ito sa pangunahing teksto, habang inilalagay sa talababa ang tunay na leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “Napopoot ako” ay tuwiran ngunit hindi kolokyal; ang pag-uulit ng “ako” sa ikalawang sugnay ay sadyang nagpapanatili sa mariing paghahambing ng Hebreo.
