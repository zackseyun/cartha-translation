base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: tl
  text: Purihin si Yahweh, sapagkat kamangha-mangha niyang ipinakita sa akin ang kanyang tapat na pag-ibig sa isang lunsod na kinubkob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang lunsod na may matibay na tanggulan.” Maaaring tumukoy ang pariralang Hebreo sa isang lunsod na kinubkob o sa isang lunsod na may matibay na mga kuta.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Isang pasibong participle na ginagamit bilang doxological na pahayag. Ang “Purihin” ay natural at marangal sa makabagong Tagalog at naghahayag ng papuring iniuukol sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na tahasang nasa tekstong Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit dapat purihin si Yahweh; ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: הִפְלִיא
  choice: kamangha-mangha niyang ipinakita
  rationale: Ang Hiphil ng פלא ay nagpapahayag ng paggawa o pagpapamalas ng isang bagay na pambihira o kahanga-hanga. Sa חַסְדּוֹ bilang layon, likas sa Tagalog ang “kamangha-mangha niyang ipinakita.”
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang matatag, matapat, at mapagtipang pag-ibig. Ang “tapat na pag-ibig” ay malinaw sa karaniwang mambabasa nang hindi labis na nagpapaliit sa kahulugan tungo lamang sa awa.
- source_word: לִי
  choice: sa akin
  rationale: Tinutukoy ang personal na tumanggap ng ipinamalas na pag-ibig at natural na kaugnay ng pandiwang “ipinakita.”
- source_word: בְּעִיר מָצוֹר
  choice: sa isang lunsod na kinubkob
  rationale: Maaaring tumukoy ang מָצוֹר sa pagkubkob o sa isang nakukutaang lugar. Pinipili ng pangunahing teksto ang diwang “kinubkob,” na umaangkop sa konteksto ng panganib at pagliligtas, habang inilalahad sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay gumagamit mismo ng Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng בְּעִיר מָצוֹר
  choice: sa isang lunsod na kinubkob
  alternative: sa isang nakukutaang lunsod
  rationale: 'Tunay na malabo ang parirala: maaaring ilarawan nito ang isang lunsod na nasa ilalim ng pagkubkob o isang lunsod na may mga kuta. Hindi itinatago ang alternatibong pagbasa; inilalagay ito sa talababa.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lunsod” upang maging angkop sa salmong rehistro, at “Purihin” bilang natural na doxological na panawagan. Inilagay ang talababa pagkatapos mismo ng pariralang pinaglilinaw nito.
