  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: tl
  text: 'Sa iyo, Yahweh, ako’y nagkanlong;

    huwag nawa akong mapahiya kailanman.

    Sa iyong katuwiran[a], iligtas mo ako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Sa iyong katarungan, iligtas mo ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Sa iyo
  rationale: Pinananatili ang metaporang ang Diyos ang kanlungan, sa halip na gawing mas abstraktong “nagtitiwala ako sa iyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: חָסִיתִי
  choice: ako nanganlong
  rationale: Ipinapahayag ang natatag o naganap nang pagkanlong at pinananatili ang konkretong larawan ng paghahanap ng kaligtasan sa isang kanlungan.
- source_word: אַל־אֵבוֹשָׁה לְעוֹלָם
  choice: huwag nawa akong mapahiya kailanman
  rationale: Ang “huwag nawa” ay angkop sa mapanalanging pakiusap; ang “mapahiya” ay nagpapahiwatig ng kahihiyang bunga ng nabigong pag-asa, at ang “kailanman” ay nagpapanatili sa ganap na diin ng לְעוֹלָם sa negatibong pangungusap.
- source_word: בְּצִדְקָתְךָ
  choice: Sa iyong katuwiran
  rationale: Pinananatili ang malawak na kahulugan ng matuwid na pagkatao at pagkilos ng Diyos, habang hindi lubusang nilulutas kung ang ב ay tumutukoy sa batayan, kalagayan, o paraan ng pagliligtas.
- source_word: פַלְּטֵנִי
  choice: iligtas mo ako
  rationale: Likas at tuwirang ipinapahayag ang masidhing utos-pakiusap para sa aktibong pagsagip.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa halip na halinhan ng titulong “PANGINOON.”
- issue: Kahulugan ng צְדָקָה kaugnay ng pagliligtas ng Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Mas malawak ang “katuwiran” at maaaring saklawin ang matuwid at tapat na pagkilos ng Diyos; tunay ding posibleng diin sa konteksto ang “katarungan,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabagong Filipino na may marangal at panalanging himig. Ginamit ang “nanganlong” upang mapanatili ang larawan ng kanlungan, at “huwag nawa” upang ipahayag ang pakiusap nang hindi nagiging lipas o labis na pormal.
