id: PSA.54.4
reference: Psalms 54:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: tl
  text: 'Sapagkat ang mga estranghero[a] ay nagbangon laban sa akin,

    at hinahangad ng mga malulupit na tao[b] ang buhay ko[c];

    hindi nila inilalagay ang Diyos sa harapan nila.

    Selah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banyaga.” Ang Hebreong זָרִים ay maaaring tumukoy sa mga taong banyaga, hindi kabilang, o hiwalay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga marahas na tao.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ang kaluluwa ko.” Dito, ang “kaluluwa” ay tumutukoy sa buhay ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang panandang sanhi na nag-uugnay sa talata sa naunang pagsusumamo.
- source_word: זָרִים
  choice: mga estranghero
  rationale: Sinasalamin ang mga taong banyaga, hindi kabilang, o hiwalay sa nagsasalita, nang hindi tiyak na nililimitahan sa ibang lahi o bansa.
- source_word: קָמוּ עָלַי
  choice: nagbangon laban sa akin
  rationale: Pinananatili ang larawan ng pagbangon bilang tahasang pagkontra o paglusob.
- source_word: עָרִיצִים
  choice: mga malulupit na tao
  rationale: Likas sa modernong Tagalog at ipinapahayag ang marahas at mapaniil na katangian ng mga kalaban.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: hinahangad ... ang buhay ko
  rationale: Sa konteksto ng banta, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong sarili ng salmista; pinananatili rin ng 'hinahangad' ang kilos ng paghahanap o pagsisikap na makuha.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: hindi nila inilalagay ang Diyos sa harapan nila
  rationale: 'Pinananatili ang kongkretong metapora ng Hebreo: hindi nila itinuturing ang Diyos na nasa kanilang harapan o saklaw ng kanilang pagpapasya.'
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi isinalin dahil hindi tiyak ang eksaktong tungkuling musikal o liturhikal nito.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng banta
  choice: buhay ko
  alternative: kaluluwa ko
  rationale: Ang mga kalaban ay nagtatangka laban sa buhay ng salmista; ang 'buhay' ay naghahatid ng kongkretong diwa nang hindi nagpapasok ng di-binibigyang-diin na paghihiwalay ng katawan at kaluluwa.
- issue: Metapora ng paglalagay sa Diyos sa harapan
  choice: Pinanatili bilang 'inilalagay ang Diyos sa harapan nila'
  alternative: hindi nila isinasaalang-alang ang Diyos
  rationale: Ang mas literal na larawan ay nauunawaan sa Tagalog at iniiwasang paliitin ang maaaring saklaw nito sa isang paliwanag lamang.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at angkop sa tulang panalangin. Pinanatili ang paralelismo, metapora, at ang di-tiyak na liturhikal na salitang “Selah”; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
