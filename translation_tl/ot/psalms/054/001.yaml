translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang anyo ng retorikal na tanong at ang estilo ng isang pangungusap na bahagi ng pamagat ng awit. Ginamit ang “mga taga-Zif” sa halip na isang di-pamilyar na gentilicio.
