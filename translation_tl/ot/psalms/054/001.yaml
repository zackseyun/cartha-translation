base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/001.yaml
  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: tl
  text: Nang dumating ang mga taga-Zif at sinabi nila kay Saul, “Hindi ba nagtatago si David sa gitna namin[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama namin.” Literal na “kasama namin” ang Hebreo, ngunit ipinahihiwatig dito ng “sa gitna namin” na nagtatago si David sa kanilang lugar o pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: Nang dumating
  rationale: Ang ב na sinusundan ng infinitive construct ng בוא ay nagpapakilala ng sugnay na temporal; natural itong ipahayag sa Tagalog bilang “Nang dumating.”
- source_word: הַזִּיפִים
  choice: ang mga taga-Zif
  rationale: Gentilic plural ito para sa mga naninirahan sa Zif; ang “mga taga-Zif” ay mas natural at madaling maunawaan sa modernong Tagalog kaysa sa transliterasyong pangkat-etniko.
- source_word: וַיֹּאמְרוּ
  choice: at sabihin nila
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay. Kasunod ng “Nang dumating,” ang anyong “at sabihin nila” ay natural sa nakapailalim na sugnay na temporal at malinaw na tinutukoy ang mga taga-Zif.
- source_word: לְשָׁאוּל
  choice: kay Saul
  rationale: Ang ל ay nagmamarka sa di-tuwirang layon; “kay Saul” ang karaniwang anyo sa Tagalog para sa pangalang pantangi.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili nito ang retorikal na tanong na umaasa ng pagsang-ayon, sa halip na gawin itong tahasang pahayag.
- source_word: דָוִד
  choice: David
  rationale: Ito ang nakasanayang anyo ng pangalan sa Tagalog na Bibliya at sa pangkalahatang gamit.
- source_word: מִסְתַּתֵּר
  choice: nagtatago
  rationale: Ang Hitpael participle ng סתר ay nagpapahiwatig ng nagpapatuloy na pagkukubli ng sarili; malinaw at natural ang “nagtatago.”
- source_word: עִמָּנוּ
  choice: sa gitna namin
  rationale: Literal itong “kasama namin,” ngunit sa konteksto ay tumutukoy sa pagtatago sa loob ng kanilang lugar o pamayanan. Ipinahahayag ng “sa gitna namin” ang kontekstuwal na diwa habang itinatala sa talababa ang literal na alternatibo.
