translation:
  language: tl
  text: Masdan, ang Diyos ay tumutulong sa akin; ang Panginoon ay kasama ng mga umaalalay sa buhay ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang Panginoon ang umaalalay sa buhay ko.” Mahirap ang kayarian ng pariralang Hebreo. Pinananatili ng pangunahing salin ang maramihang “mga umaalalay,” ngunit maaari rin itong unawain na ang Panginoon mismo ang tuwirang umaalalay. Ang salitang isinaling “buhay” ay maaari ring mangahulugang “sarili” o “buong pagkatao.”'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tunay nga
  rationale: Ang pantawag-pansing kataga ay nagpapakilala rito ng mariing katiyakan. Mas natural sa makabagong tulang Tagalog ang “Tunay nga” kaysa sa literal ngunit lipas na “Narito.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos bilang simuno ng unang sugnay.
- source_word: עֹזֵר לִי
  choice: ang tumutulong sa akin
  rationale: Ang Qal participle ay naglalarawan sa Diyos bilang personal at patuloy na tumutulong; pinananatili ng pariralang ito ang pandiwang lakas ng Hebreo.
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: Banal na titulo ito sa konteksto, kaya isinalin sa karaniwang dignified na katawagang Tagalog.
- source_word: בְּסֹמְכֵי
  choice: ay kasama ng mga umaalalay
  rationale: Ang בְּ na kasunod ng maramihang participle ay mahirap sa sintaks. Ang pag-unawang nagpapahayag ng pakikisama o pagiging kabilang ay nagpapanatili sa maramihang anyo nang hindi pinapakinis ang tunay na kalabuan.
- source_word: נַפְשִׁי
  choice: sa buhay ko
  rationale: Sa konteksto ng pag-iingat laban sa mga kaaway, ang נֶפֶשׁ ay tumutukoy sa buhay o buong pagkatao, hindi lamang sa di-materyal na “kaluluwa.”
theological_decisions:
- issue: Pagpapakahulugan sa mahirap na pariralang אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי
  choice: ang Panginoon ay kasama ng mga umaalalay sa buhay ko
  alternative: ang Panginoon ang umaalalay sa buhay ko
  rationale: Pinananatili ng pangunahing salin ang pang-ukol at maramihang participle ng tekstong Masoretiko. Inilalagay sa talababa ang makatuwirang alternatibong sintaktikong pagbasa na ang Panginoon mismo ang tuwirang umaalalay.
- issue: Kahulugan ng נַפְשִׁי
  choice: sa buhay ko
  alternative: sa kaluluwa ko / sa buong pagkatao ko
  rationale: Ang panganib sa buhay ng salmista ang agarang konteksto. Iniiwasan ng “buhay” ang hindi kinakailangang pagpapasok ng mahigpit na paghahati sa katawan at kaluluwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang patulang diin. Ginamit ang “Tunay nga” bilang natural na mariing pambungad at pinanatili sa pangunahing teksto ang sintaktikong tensiyon ng ikalawang sugnay.
