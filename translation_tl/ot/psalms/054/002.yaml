base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: tl
  text: 'Diyos, iligtas mo ako sa iyong pangalan,

    at sa iyong kapangyarihan ay bigyan mo ako ng katarungan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hatulan mo ako” o “ipagtanggol mo ang aking usapin.” Ang pandiwang Hebreo ay maaaring tumukoy sa paghatol sa hukuman, ngunit dito ay malamang na nangangahulugang pagkakaloob ng katarungan o pagpapatunay na nasa matuwid ang nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang panawag ito sa Diyos sa konteksto ng panalangin. Hindi na dinagdagan ng “O” sapagkat walang hiwalay na katumbas nito sa Hebreo at likas na tuwiran ang “Diyos” sa makabagong Tagalog.
- source_word: בְּשִׁמְךָ
  choice: sa iyong pangalan
  rationale: Pinananatili ang maikli at matalinghagang pahayag ng Hebreo. Maaaring ipahiwatig ng “pangalan” ang nahayag na pagkatao, reputasyon, at pagkakakilanlan ng Diyos, habang ang “sa” ay likas na makapagpapahayag ng paraang ginagamit sa pagliligtas.
- source_word: הוֹשִׁיעֵנִי
  choice: iligtas mo ako
  rationale: Tuwiran at malawak na katumbas ng pakiusap na iligtas o sagipin ang nagsasalita.
- source_word: וּבִגְבוּרָתְךָ
  choice: at sa iyong kapangyarihan
  rationale: Ang גְּבוּרָה ay tumutukoy sa lakas o makapangyarihang kakayahan. Likas at marangal sa Tagalog ang “kapangyarihan” at pinananatili ng “sa” ang instrumental na ugnayan.
- source_word: תְדִינֵנִי
  choice: bigyan mo ako ng katarungan
  rationale: Ang pandiwa ay maaaring mangahulugang humatol o magpasya sa isang usapin. Sa panalanging ito laban sa mga kaaway, hinihiling ng salmista ang makatarungang pagpapasya para sa kaniya. Iniiwasan ng salin ang posibleng maling dating na hinihiling lamang niyang siya ay kondenahin, ngunit inilalahad sa talababa ang tunay na leksikal na mga alternatibo.
theological_decisions:
- issue: Kahulugan ng pakiusap na תְדִינֵנִי kaugnay ng katarungan ng Diyos
  choice: bigyan mo ako ng katarungan
  alternative: hatulan mo ako; ipagtanggol mo ang aking usapin
  rationale: Ang konteksto ay isang panawagan sa Diyos na kumilos bilang makatarungang hukom laban sa mga kaaway. Ipinahahayag ng pangunahing salin ang hinihinging katarungan nang hindi nagdaragdag ng isang natatanging doktrinal na pagbasa; pinananatili naman sa talababa ang higit na literal at iba pang posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang patulang ayos. Pinanatili ang magkatugmang “sa iyong pangalan” at “sa iyong kapangyarihan,” pati ang tuwirang panawag na “Diyos.”
