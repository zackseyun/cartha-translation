  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: tl
  text: Bumalik nawa ang masama sa mga kalaban ko[a]; sa iyong katapatan[b], lipulin mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Babalik ang masama sa mga kalaban ko; sa iyong katapatan ay lilipulin mo sila.” Maaaring basahin ang unang pandiwa bilang pahayag sa halip na kahilingan.
    reason: alternative_reading
  - marker: b
    text: O, “sa iyong katotohanan.” Ang salitang Hebreo ay maaaring mangahulugang katotohanan, pagiging maaasahan, o katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: Bumalik nawa
  rationale: Ang Qal imperfect na ישוב ay maaaring pahiwatig na panghinaharap o kahilingang volitibo. Dahil panalangin ang konteksto at sinusundan ito ng pautos, pinananatili ng “nawa” ang diwang kahilingan.
- source_word: הָרַע
  choice: ang masama
  rationale: Maaaring tumukoy ang רַע sa kasamaan, kapahamakan, o pinsala. Ang “ang masama” ay maikli at sadyang hindi nilulutas kung moral na kasamaan o masamang bunga ang pangunahing diin.
- source_word: לְשֹׁרְרָי
  choice: sa mga kalaban ko
  rationale: Tumutukoy ito sa mga taong kumakalaban sa nagsasalita. Natural at malinaw sa modernong Filipino ang “mga kalaban ko” nang hindi ipinapalagay na mga kaaway sa digmaan lamang.
- source_word: בַּאֲמִתְּךָ
  choice: sa iyong katapatan
  rationale: Saklaw ng אֱמֶת ang katotohanan, pagiging maaasahan, at katapatan. Sa tuwirang panawagan sa Diyos, natural na ipinahahayag ng “katapatan” ang kanyang pagiging maaasahan, habang inilalahad sa talababa ang “katotohanan.”
- source_word: הַצְמִיתֵם
  choice: lipulin mo sila
  rationale: Ang Hiphil imperative ng צמת ay malakas na utos na wasakin o wakasan sila. Direktang pinananatili ng “lipulin” ang puwersa ng pandiwa at ng mapanumpang panalangin.
theological_decisions:
- issue: Lakas ng panalangin para sa paghatol
  choice: Isinalin bilang kahilingang ibalik sa mga kalaban ang masama at bilang tuwirang pakiusap sa Diyos na lipulin sila.
  alternative: 'Basahin ang unang pandiwa bilang pahayag: “Babalik ang masama sa mga kalaban ko; sa iyong katapatan, lilipulin mo sila.”'
  rationale: Maaaring indicative o jussive ang unang pandiwa, ngunit ang kasunod na imperative at ang konteksto ng panalangin ay pumapabor sa volitibong pagbasa. Hindi pinalalambot ang tensiyon ng panawagan para sa banal na paghatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” upang likas na ipahayag ang kahilingan, at ang “lipulin” upang mapanatili ang matinding puwersa ng tekstong Hebreo nang hindi dinaragdagan o pinahihina ito.
