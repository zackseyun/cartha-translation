  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: tl
  text: Sapagkat iniligtas niya ako mula sa bawat kapighatian, at nakita ng aking mata ang mga kaaway ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ipahiwatig ng “nakita ng aking mata ang mga kaaway ko” na nasaksihan niya ang kanilang pagbagsak o ang kanyang pagbabangong-puri.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang batayan ng naunang panata o pagpupuri; natural sa Filipino ang “Sapagkat” para sa ganitong paliwanag.
- source_word: מִכָּל צָרָה
  choice: sa bawat kaguluhan
  rationale: Pinananatili ng “bawat” ang distributibong puwersa ng כָּל, at malawak ang “kaguluhan” upang masaklaw ang hirap o kapighatiang tinutukoy ng צָרָה nang hindi ito labis na tinutukoy.
- source_word: הִצִּילָנִי
  choice: iniligtas niya ako
  rationale: Ang Hiphil ng נצל ay nangangahulugang iligtas o sagipin. Ang aspektong ganap ay likas na naihahayag sa Filipino sa payak na naganap na anyo.
- source_word: וּבְאֹיְבַי
  choice: at ... ang aking mga kaaway
  rationale: Sa pagsasama nito sa ראה, ang ב ay tumutukoy sa mga kaaway bilang bagay na nakita. Hindi na kailangang piliting isalin ang pang-ukol sa Filipino.
- source_word: רָאֲתָה עֵינִי
  choice: nakita ng aking mata
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo na ang “mata” ang simuno, habang malinaw at marangal pa rin sa modernong Filipino.
theological_decisions:
- issue: Ang ipinahihiwatig ng pagkakita ng mang-aawit sa kanyang mga kaaway
  choice: Sabihin lamang na nakita ng kanyang mata ang kanyang mga kaaway.
  alternative: Nakita niya ang pagbagsak ng kanyang mga kaaway; nakita niya nang may pagtatagumpay ang kanyang mga kaaway.
  rationale: Hindi tahasang binabanggit ng Hebreo ang pagkatalo, pagbagsak, paghihiganti, o pagtatagumpay. Maaaring ipinahihiwatig iyon ng konteksto, ngunit pinananatili ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Pinanatili ang Hebreong larawang “aking mata” at iniwasang idagdag sa pangunahing teksto ang di-tahasang pagkatalo ng mga kaaway.
