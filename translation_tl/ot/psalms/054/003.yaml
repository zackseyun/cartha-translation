  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: tl
  text: 'Diyos, dinggin mo ang aking panalangin;

    pakinggan mo ang mga salita ng aking bibig.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ginagamit bilang tuwirang pagtawag sa Diyos. Hindi na kailangan ang “O,” na maaaring maging masyadong makaluma sa modernong Filipino.
- source_word: שְׁמַע
  choice: dinggin mo
  rationale: Ang pautos na anyo ay humihiling hindi lamang ng pisikal na pagkarinig kundi ng mapagtuong pagtanggap. Ang “dinggin” ay likas sa wika ng panalangin at marangal nang hindi lipas.
- source_word: תְּפִלָּתִי
  choice: ang aking panalangin
  rationale: Tuwirang ipinapahayag ang karaniwang kahulugan ng תְּפִלָּה at ang hulaping unang panauhan na “aking.”
- source_word: הַאֲזִינָה
  choice: pakinggan mo
  rationale: Ipinahahayag ang masusing pakikinig na hinihingi ng Hiphil imperative. Mas natural ito sa kasalukuyang Filipino kaysa sa literal na “ikiling mo ang iyong tainga.”
- source_word: לְאִמְרֵי
  choice: ang mga salita
  rationale: Ang construct plural ng אֵמֶר ay tumutukoy sa mga salitang binibigkas; sa Filipino, ang layon ng “pakinggan” ay hindi nangangailangan ng katumbas na pang-ukol na לְ.
- source_word: פִי
  choice: ng aking bibig
  rationale: Pinananatili ang kongkreto at makatang Hebreong pananalitang “mga salita ng aking bibig” sa halip na gawing parapraseng “mga salitang sinasabi ko.”
