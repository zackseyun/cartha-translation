  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: sa saliw ng mga instrumentong de-kuwerdas. Isang Maskil[b] ni David.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “akda ni David,” “para kay David,” o “kaugnay ni David.” Maaaring magpahiwatig ang Hebreong pamagat ng pag-akda, pag-uukol, o pagkakaugnay.
    reason: alternative_reading
  - marker: b
    text: Ang “Maskil” ay isang teknikal na terminong Hebreo sa mga pamagat ng Awit. Malamang na tumutukoy ito sa isang uri ng komposisyon o pagtatanghal, ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong nangangasiwa sa musikal na pagtatanghal. Likas sa makabagong Filipino ang parirala at hindi nito ipinapalagay na koro lamang ang pinamumunuan.
- source_word: בִּנְגִינֹת
  choice: sa saliw ng mga instrumentong de-kuwerdas
  rationale: Tinutukoy ng anyo sa pamagat ang paggamit ng mga instrumentong may kuwerdas bilang saliw; malinaw at natural ito sa Filipino.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan ng teknikal na terminong ito sa mga pamagat ng Awit. Pinanatili ang transliterasyon upang hindi ito labis na bigyang-kahulugan bilang awit na mapagnilay, panturo, o mahusay na pagkakatha.
- source_word: לְדָוִד
  choice: ni David
  rationale: Karaniwang paraan ito sa Filipino upang ipahayag ang kaugnayan kay David, ngunit hindi nito lubos na tinutukoy kung siya ang may-akda, pinag-ukulan, o pinagmulan ng tradisyon; nililinaw sa talababa ang saklaw ng Hebreo.
theological_decisions:
- issue: Kahulugan ng superskripsiyong לְדָוִד
  choice: ni David
  alternative: akda ni David; para kay David; kaugnay ni David
  rationale: Maaaring magpahiwatig ang Hebreong pang-ukol ng pag-akda, pag-uukol, pag-aari, o pagkakaugnay. Hindi tahasang nilutas sa salin ang hindi tiyak sa pamagat.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tagapangasiwa ng awitan” sa halip na mas makitid na “tagapanguna ng koro,” at pinanatili ang “Maskil” bilang terminong teknikal. Ang mga panandang [b] at [a] ay ikinabit mismo sa mga salitang ipinaliliwanag ng mga talababa.
