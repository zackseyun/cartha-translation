  source_fidelity: 'Tapat ang salin sa apat na bahagi ng Hebreong superskripsiyon: ang tagapangasiwa/direktor ng musikang pagsamba, ang paggamit ng mga instrumentong de-kuwerdas, ang teknikal na katawagang “Maskil,” at ang kaugnayan kay David. Ang “ni David” ay isang katanggap-tanggap na pangunahing salin para sa לְדָוִד, at hindi nito sapilitang nilulutas ang saklaw ng pang-ukol dahil maayos itong nililinaw ng talababa.'
