base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: tl
  text: Maghahain ako sa iyo ng kusang-loob na handog[a]; pasasalamatan ko ang iyong pangalan, O Yahweh[b], sapagkat mabuti ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “kusang-loob na handog.” Maaari ring unawain ang parirala sa paraang pang-abay: “maghahain ako nang kusang-loob.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH, na tradisyonal na isinasaling “ANG PANGINOON”; isinasatitik din na “Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo: “sapagkat mabuti.” Malamang na tumutukoy ito sa “iyong pangalan,” ngunit maaari ring unawain na “sapagkat mabuti siya,” na tuwirang tumutukoy kay Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: ng kusang-loob na handog
  rationale: Ang נְדָבָה ay tumutukoy sa handog na kusang-loob, hindi lamang sa kusang paraan ng pagkilos. Pinananatili ng salin ang kahulugang panghandog sa konteksto ng paghahain.
- source_word: אֶזְבְּחָה
  choice: Maghahain ako
  rationale: Ang pandiwang זבח ay nangangahulugang maghain o maghandog ng hain. Ang “maghahain” ay tuwiran, natural, at nagpapanatili sa kontekstong sakripisyal.
- source_word: לָּךְ
  choice: sa iyo
  rationale: Tinutukoy ng ל ang pinag-uukulan ng hain; natural itong isalin na “sa iyo.”
- source_word: אוֹדֶה
  choice: pasasalamatan ko
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpasalamat o magpuri. Ang “pasasalamatan ko” ay angkop sa tuwirang layon na “iyong pangalan” at nagpapanatili sa diwa ng pasasalamat.
- source_word: שִׁמְךָ
  choice: ang iyong pangalan
  rationale: Tahasan sa Hebreo ang “iyong pangalan,” kaya pinananatili ito bilang pahayag tungkol sa nahayag na pagkakakilanlan at reputasyon ng Diyos.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” at ginamit ang “O” upang malinaw na ipakita ang tuwirang pagtawag.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan ng pasasalamat; malinaw at marangal na katumbas ang “sapagkat.”
- source_word: טוֹב
  choice: mabuti ito
  rationale: Walang tahasang simuno ang pang-uri sa Hebreo. Ang “ito” ay malamang na tumutukoy sa pinakamalapit na “iyong pangalan,” habang pinananatili sa talababa ang posibleng pagtukoy kay Yahweh mismo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: O Yahweh
  alternative: O PANGINOON; Jehova
  rationale: Personal na pangalang YHWH ang nasa teksto, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Tinutukoy ng טוֹב sa כִּי טוֹב
  choice: sapagkat mabuti ito, na malamang na tumutukoy sa pangalan ni Yahweh
  alternative: sapagkat mabuti siya, na tuwirang tumutukoy kay Yahweh
  rationale: Walang nakasaad na simuno sa Hebreo. Pinahihintulutan ng pinakamalapit na antecedent ang pagtukoy sa “iyong pangalan,” ngunit tunay ding posible ang tradisyonal na pag-unawang si Yahweh ang tinutukoy; kaya hindi inalis ang alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “maghahain” upang mapanatili ang sakripisyal na diwa, at “pasasalamatan ko” para sa natural na tuwirang layon. Pinanatili ang bahagyang pormal na pantawag na “O Yahweh” bilang panalanging patula.
