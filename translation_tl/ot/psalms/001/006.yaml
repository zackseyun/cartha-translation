id: PSA.1.6
reference: Psalms 1:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: tl
  text: Sapagkat alam ni Yahweh ang daan ng mga matuwid[a], ngunit ang daan ng mga masasama ay mapapahamak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binabantayan.” Ang Hebreong “alam” ay maaaring magpahiwatig ng personal na pagkalinga o pagsang-ayon, hindi lamang ng kabatiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o batayan ng naunang paghahambing at likas pakinggan sa makabagong Tagalog.
- source_word: יֹדֵעַ
  choice: alam
  rationale: Pinananatili ang tuwirang kahulugan ng Hebreong ידע habang hinahayaang manatili ang pahiwatig ng personal na pagkilala, pagkalinga, o pagsang-ayon; nililinaw sa talababa ang mas malawak na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: דֶּרֶךְ
  choice: daan
  rationale: Saklaw nito kapwa ang paraan ng pamumuhay at ang tinatahak o kahihinatnan nito, at napapanatili ang pag-uulit sa magkatapat na mga sugnay.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Natural na katawagan sa Tagalog para sa pangmaramihang pang-uri na ginagamit bilang pangngalan, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- source_word: וְ
  choice: ngunit
  rationale: Bagaman karaniwang nangangahulugang “at,” malinaw na pasalungat ang tungkulin nito sa paralelismong patula.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Karaniwan at malinaw na katumbas sa makabagong Tagalog ng moral na kategoryang tinutukoy sa panitikang karunungan.
- source_word: תֹּאבֵד
  choice: ay hahantong sa kapahamakan
  rationale: Ipinahahayag ang diwang ang landas o takbo ng masasama ay mauuwi sa pagkawasak; mas natural itong iugnay sa “daan” sa Tagalog kaysa sa literal na “mamamatay” o “mapapahamak ang daan.”
theological_decisions:
- issue: Diwa ng ‘pagkaalam’ ni Yahweh
  choice: Pinanatili sa pangunahing teksto ang tuwirang “alam,” na may posibleng pahiwatig ng personal na pagkilala, pagkalinga, at pagsang-ayon.
  alternative: “binabantayan ni Yahweh” o “kinikilala ni Yahweh”
  rationale: Maaaring higit sa payak na kabatiran ang ידע sa kontekstong ito, ngunit ang paglalagay ng “binabantayan” sa pangunahing teksto ay magpapasya sa isang implikasyong hindi tahasang sinasabi ng payak na anyong Hebreo.
- issue: Kahihinatnan ng daan ng masasama
  choice: “hahantong sa kapahamakan”
  alternative: “mawawala” o “mapapahamak”
  rationale: Ang אבד ay maaaring mangahulugang mapahamak o mawala. Dahil “daan” ang simuno, ipinapakita ng salin ang pagwawakas ng kanilang paraan at takbo ng buhay nang hindi tinutukoy nang labis ang eksaktong anyo ng kapahamakan.
translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Pinanatili ang paralelismo ng dalawang “daan,” ang pangalang Yahweh, at ang tunay na lawak ng kahulugan ng Hebreong “alam.”
