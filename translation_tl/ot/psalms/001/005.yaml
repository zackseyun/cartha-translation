  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: tl
  text: Kaya hindi makatatayo ang masasama sa paghuhukom[a], ni ang mga makasalanan sa kapulungan ng mga matuwid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa paghatol.” Maaaring malawak na tumukoy ang Hebreo sa pagsusuring hukuman, sa kasalukuyang kaayusan man o sa pangwakas na paghuhukom.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kongregasyon ng mga matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at tuwirang ipinahahayag nito ang lohikal na bunga ng paglalarawan sa masasama sa naunang mga talata.
- source_word: יָקֻמוּ
  choice: makatatayo
  rationale: Pinananatili ang larawang Hebreo ng pagtayo at ang pahiwatig na hindi sila makapananatili o makapapasa sa pagsusuri.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwang katawagan sa panitikang pangkarunungan para sa mga taong kinikilala sa kanilang kasamaan, hindi lamang sa legal na pagkakasala.
- source_word: בַּמִּשְׁפָּט
  choice: sa paghuhukom
  rationale: Saklaw ng מִשְׁפָּט ang paghatol, katarungan, o pasyang legal. Ang 'sa paghuhukom' ay likas sa Filipino at hindi nagtatakda kung ito ay kasalukuyan o pangwakas na paghatol.
- source_word: חַטָּאִים
  choice: ang mga makasalanan
  rationale: Tuwiran at natural na katumbas para sa mga taong inilalarawang namumuhay sa kasalanan; pinananatili rin ang paralelismo sa 'masasama.'
- source_word: בַּעֲדַת
  choice: sa kapulungan ng
  rationale: Ang 'kapulungan' ay tumutukoy sa nagkakatipong pamayanan at pinananatili ang kolektibong diwa ng עֵדָה.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Karaniwang salin na nagpapanatili sa moral at tipanang kategorya ng salitang Hebreo.
theological_decisions:
- issue: Saklaw ng 'paghuhukom'
  choice: Isinalin nang pangkalahatan bilang 'sa paghuhukom.'
  alternative: Isang pansamantalang legal na paghatol lamang, o ang pangwakas na paghuhukom lamang.
  rationale: Maaaring tumukoy ang Hebreo sa paghatol sa kasalukuyang kaayusan, sa pangwakas na paghuhukom, o sa kapuwa; hindi nilulutas ng salin ang tunay na kalabuan.
- issue: Kahulugan ng 'makatatayo'
  choice: Pinanatili ang metapora ng pagtayo sa harap ng paghatol.
  alternative: Hindi makapapasa o hindi makapananatili.
  rationale: Ang literal na larawan ay may legal at moral na pahiwatig ngunit hindi kailangang paliitin sa iisang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'makatatayo' upang mapanatili ang larawang Hebreo, at 'kapulungan' bilang natural ngunit dignified na katawagan sa nagkakatipong pamayanan.
