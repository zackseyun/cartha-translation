  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: tl
  text: Hindi gayon ang masasama; sa halip, para silang ipa na ipinapadpad ng hangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tinatangay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Hindi gayon
  rationale: Pinananatili nito ang maikli at mariing pagtanggi ng Hebreo at ang tuwirang pagsalungat sa kalagayan ng matuwid sa naunang talata.
- source_word: הָרְשָׁעִים
  choice: ang masasama
  rationale: Karaniwan at malinaw itong tawag sa mga taong namumuhay nang salungat sa katuwiran sa panitikang karunungan; hindi nito nililimitahan ang diwa sa legal na pagkakasala lamang.
- source_word: כִּי אִם
  choice: sa halip
  rationale: 'Ipinahahayag nito ang mariing pagwawasto at pagsalungat: hindi tulad ng matatag na puno ang masasama, kundi tulad sila ng ipa.'
- source_word: כַּמֹּץ
  choice: para silang ipa
  rationale: Ang ipa ay magaan na balat o latak ng butil na nahihiwalay sa paggiik; tumpak at pamilyar itong larawang pansakahan sa Filipino.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay ito sa Filipino para sa sugnay na naglalarawan sa ipa.
- source_word: תִּדְּפֶנּוּ
  choice: ipinapadpad
  rationale: Ipinakikita nito na ang magaan na ipa ay itinutulak at inililipat ng hangin, habang pinananatili ang aktibong puwersa ng pandiwang Hebreo.
- source_word: רוּחַ
  choice: ang hangin
  rationale: Sa larawang paggiik, malinaw na pisikal na hangin ang tinutukoy, hindi espiritu o hininga.
