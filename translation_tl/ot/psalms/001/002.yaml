base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: tl
  text: Sa halip, ang kinalulugdan niya ay ang kautusan ni Yahweh[a], at binubulay-bulay[b] niya ang kautusan ni Yahweh araw at gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “turo ni Yahweh” sa halip na “kautusan ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay maaari ring magpahiwatig ng pagbigkas o pag-usal nang mahina habang nagbubulay-bulay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Kasunod ng magkakasunod na pagtanggi sa talata 1, ang parirala ay nagpapahayag ng malinaw na pagsalungat at pagpili, hindi ng dahilan.
- source_word: בְּתוֹרַת
  choice: nasa kautusan ni
  rationale: Ang תּוֹרָה ay maaaring tumukoy sa turo o tagubilin, ngunit ang “kautusan” ay nagpapanatili sa bigat ng nahayag na kalooban at pagtuturo ni Yahweh; inilalahad sa talababa ang mas malawak na kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: חֶפְצוֹ
  choice: ang kanyang kagalakan
  rationale: Ipinahahayag nito ang bagay na kinalulugdan at pinananabikan ng matuwid, at natural ang pariralang ito sa makabagong Filipino.
- source_word: וּבְתוֹרָתוֹ
  choice: ang kautusan nito
  rationale: Ang hulaping panghalip ay likas na tumutukoy kay Yahweh. Ang “nito” ay nagpapanatili sa reperensiyang iyon at umiiwas sa maling pagkaunawang sariling kautusan iyon ng taong tinutukoy.
- source_word: יֶהְגֶּה
  choice: binubulay-bulay
  rationale: Saklaw ng pandiwa ang taimtim at patuloy na pagninilay, bagaman maaari rin itong magpahiwatig ng mahinang pagbigkas; pinananatili ang huling diwa sa talababa.
- source_word: יוֹמָם וָלָיְלָה
  choice: araw at gabi
  rationale: Tuwirang pinananatili ang Hebreong tambalang tumutukoy sa palagian o tuloy-tuloy na gawain at ang maindayog na anyo ng tula.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa isang awit ng karunungan
  choice: kautusan
  alternative: turo o tagubilin
  rationale: Pinananatili ng “kautusan” ang kaugnayan sa nahayag at tipanang pagtuturo ni Yahweh, habang kinikilala sa talababa na mas malawak kaysa batas lamang ang maaaring saklaw ng salita.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling paralelismo ng tulang Hebreo at iniwasan ang labis na teknikal o makalumang pananalita.
