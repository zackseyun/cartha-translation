  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: tl
  text: Siya ay magiging tulad ng isang punong nakatanim sa tabi ng mga daluyan ng tubig, na namumunga sa tamang panahon; hindi nalalanta ang mga dahon nito. Sa lahat ng ginagawa niya, umuunlad siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang lahat ng ginagawa niya ay umuunlad.” Maaari ring unawain ang Hebreo na ang “lahat ng ginagawa niya” ang paksa ng huling pandiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Siya ay magiging
  rationale: Ang anyong pandiwa na may pang-ugnay ay may resultative o panghinaharap na diwa mula sa paglalarawan sa taong pinagpala; pinananatili ng “magiging” ang daloy tungo sa paghahambing.
- source_word: כְעֵץ
  choice: tulad ng isang puno
  rationale: Tuwirang ipinahahayag ng כְּ ang paghahambing; natural at malinaw ito sa modernong Tagalog.
- source_word: שָׁתוּל
  choice: nakatanim
  rationale: Ang passive participle ay naglalarawan sa punong sadyang inilagay o itinanim sa isang lugar. Hindi kailangang gawing “inilipat at itinanim,” bagaman posible ang gayong diin.
- source_word: עַל פַלְגֵי מָיִם
  choice: sa tabi ng mga daluyan ng tubig
  rationale: Ang פַלְגֵי ay maaaring tumukoy sa mga sapa o mga kanal/daluyan. Ang “mga daluyan ng tubig” ay nagpapanatili sa maramihan at sa larawang may tuloy-tuloy o nakalaang suplay ng tubig.
- source_word: פִּרְיוֹ יִתֵּן
  choice: namumunga
  rationale: Literal na “nagbibigay ng bunga nito,” ngunit “namumunga” ang pinakanatural na Tagalog para sa produksiyon ng bunga ng puno.
- source_word: בְּעִתּוֹ
  choice: sa tamang panahon
  rationale: Ipinahihiwatig ang angkop o itinakdang panahon ng pamumunga; malinaw ito sa karaniwang mambabasa nang hindi dinaragdagan ang diwa.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: hindi nalalanta ang mga dahon nito
  rationale: Bagaman isahan ang עָלֵהוּ, kolektibo ang gamit nito. Mas natural sa Tagalog ang maramihang “mga dahon,” at tuwirang tinutumbasan ng “nalalanta” ang pandiwa.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: Sa lahat ng ginagawa niya, umuunlad siya
  rationale: Pinananatili nito ang personal na pokus sa taong inilalarawan, habang kinikilala sa talababa ang posibleng pagbasa na ang lahat ng kanyang ginagawa ang paksa ng huling pandiwa.
theological_decisions:
- issue: Paksa ng huling pandiwang יַצְלִיחַ
  choice: “Sa lahat ng ginagawa niya, umuunlad siya.”
  alternative: “Ang lahat ng ginagawa niya ay umuunlad.”
  rationale: Maaaring unawain ang Hebreo na bumabalik ang paksa sa taong pinagpala, o na “lahat ng ginagawa niya” mismo ang paksa. Pinili sa teksto ang personal na pagbasa upang mapanatili ang pokus ng salmo, ngunit inilagay sa talababa ang tunay at matagal nang kinikilalang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mga daluyan ng tubig” upang mapanatili ang larawang Hebreo ng maramihang water channels, at iniwasan ang pagpapakahulugang awtomatikong nangangako ng materyal na kasaganaan.
