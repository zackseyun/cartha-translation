id: PSA.1.1
reference: Psalms 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: tl
  text: 'Mapalad ang taong hindi lumalakad ayon sa payo ng masasama,

    hindi tumatayo sa landas ng mga makasalanan,

    at hindi umuupo sa upuan ng mga manunuya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “upuan” ay maaari ring mangahulugang kapulungan o samahan ng mga manunuya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ipinahahayag ng anyong ito ang mabuti at kanais-nais na kalagayan ng taong inilalarawan, hindi lamang isang pansamantalang damdamin ng saya.
- source_word: הָאִישׁ
  choice: ang tao
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, ginagamit ito rito bilang huwarang tao sa panitikang karunungan; natural sa Filipino ang generic na “tao” nang hindi nililimitahan sa mga lalaki.
- source_word: הָלַךְ
  choice: lumalakad
  rationale: Pinananatili ang konkretong talinghaga at ang makatang pagkakasunod na lumalakad–tumatayo–umuupo.
- source_word: בַּעֲצַת
  choice: ayon sa payo ng
  rationale: Ipinapahayag ng pariralang ito ang pagkilos na ginagabayan ng payo o pananaw ng iba, at mas natural ito sa modernong Filipino kaysa “sa payo ng” lamang.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Tuwirang tumutukoy sa mga taong masama; iniiwasan ng salin ang mas makitid na relihiyosong diwa ng “mga hindi maka-Diyos.”
- source_word: דֶרֶךְ
  choice: landas
  rationale: Pinananatili ang larawang tumutukoy kapuwa sa dinaraanan at sa paraan ng pamumuhay.
- source_word: חַטָּאִים
  choice: mga makasalanan
  rationale: Tuwiran, karaniwan, at malinaw na katumbas ng pangngalang maramihan.
- source_word: עָמָד
  choice: tumatayo
  rationale: Pinananatili ang ikalawang bahagi ng makatang pag-unlad mula sa paglakad tungo sa pagtayo at pag-upo.
- source_word: מוֹשַׁב
  choice: upuan
  rationale: Pinananatili ang kongkretong larawan at paralelismo, habang kinikilala sa talababa na maaari rin itong tumukoy sa kapulungan o samahan.
- source_word: לֵצִים
  choice: mga manunuya
  rationale: Natural na modernong Filipino para sa mga taong nangungutya o nanlilibak.
- source_word: יָשָׁב
  choice: umuupo
  rationale: Kinukumpleto ang konkretong pagkakasunod na lumalakad–tumatayo–umuupo nang hindi agad binibigyang-kahulugang “naninirahan” o “namamalagi.”
theological_decisions:
- issue: Ang generic na panlalaking isahan sa panitikang karunungan
  choice: ang tao
  alternative: ang lalaki
  rationale: Panlalaking isahan ang הָאִישׁ, ngunit huwarang tao sa pangkalahatan ang tinutukoy sa konteksto. Sa Filipino, ang “tao” ang natural at tumpak na generic na katumbas at hindi nagdaragdag ng limitasyong para lamang sa lalaki.
- issue: Ang ugnayan ng “landas” at “pagtayo”
  choice: hindi tumatayo sa landas ng mga makasalanan
  alternative: hindi nakikisama sa pamumuhay ng mga makasalanan
  rationale: Pinananatili ng piniling salin ang tunay na talinghaga at ang posibilidad na ang “landas” ay kapuwa literal na daan at paraan ng pamumuhay, sa halip na tahasang lutasin ang larawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatluhang makatang kilos—lumalakad, tumatayo, umuupo—at ang mga larawang “landas” at “upuan,” habang ginawang natural ang pariralang “ayon sa payo.”
