  source_fidelity: 'Tapat ang salin sa Hebreong doksolohiya: ang בָּרוּךְ יְהוָה ay naipahayag nang angkop bilang panawagang papuri na “Purihin si Yahweh,” ang לְעוֹלָם bilang “magpakailanman,” at ang mariing אָמֵן וְאָמֵן bilang “Amen at amen.” Bagaman ang “Purihin” ay pautos samantalang ang Hebreo ay participial na pormula ng pagpapala, ito ay ligtas at likas na Tagalog na katumbas ng liturhikal na puwersa ng “Blessed be.”'
