  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: tl
  text: Purihin si Yahweh magpakailanman! Amen at amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Ang pasibong participle ay bahagi ng isang pormulang doksolohikal. Sa makabagong Tagalog, ang “Purihin” ang natural at marangal na katumbas na malinaw na nagpapahayag ng pagpupuri sa Diyos; ang literal na “Pagpalain” ay maaaring magpahiwatig na may nagbibigay ng pagpapala sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Natural na katumbas sa Tagalog ng temporal na diwang “habang panahon” o “forever,” at angkop sa marangal na wikang panliturhiya.
- source_word: אָמֵן וְאָמֵן
  choice: Amen at amen
  rationale: Pinananatili ang kinaugaliang liturhikal na salitang “Amen,” pati ang mariing pag-uulit at ang pang-ugnay ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa doksolohikal na בָּרוּךְ para sa Diyos
  choice: Purihin
  alternative: Pagpalain
  rationale: Hindi binabago ang Diyos bilang tumatanggap umano ng pagpapalang ipinagkakaloob ng tao. Sa kontekstong ito, ang pormula ay isang pagpapahayag ng pagpupuri, kaya “Purihin” ang pinakamalinaw na likas na Tagalog.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Maikli, marangal, at panliturhiya ang himig. Ginamit ang tandang padamdam upang maipakita ang puwersa ng doksolohikal na pahayag, habang pinanatili ang payak at mariing pangwakas na “Amen at amen.”
