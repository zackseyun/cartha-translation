  text: הִשְׁבַּ֥תָּ מִ/טְּהָר֑/וֹ וְ֝/כִסְא֗/וֹ לָ/אָ֥רֶץ מִגַּֽרְתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: tl
  text: 'Winakasan mo ang kanyang karilagan,

    at ibinagsak sa lupa ang kanyang trono.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinawi mo ang kanyang ningning/kadalisayan.” Maaaring mangahulugan ang salitang Hebreo ng ningning, kadalisayan, o karilagan; ang “karilagan” ang higit na angkop sa kontekstong maharlika rito.
    reason: lexical_alternative
  - marker: b
    text: O “ibinagsak sa daigdig ang kanyang trono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Winakasan mo
  rationale: Ang Hiphil ng שׁבת ay nagpapahiwatig ng pagpapahinto o pagwawakas. Ang “winakasan mo” ay likas, tuwiran, at nagpapanatili sa pananagutang ipinahahayag ng pandiwa.
- source_word: מִטְּהָרוֹ
  choice: ang kanyang karilagan
  rationale: Maaaring tumukoy ang טֹהַר sa ningning, kadalisayan, o karilagan. Sa kontekstong maharlika, pinakamalinaw na ipinahihiwatig ng “karilagan” ang nawalang ningning at dangal ng hari nang hindi ito ginagawang pahayag tungkol sa moral na kadalisayan.
- source_word: וְכִסְאוֹ
  choice: at ... ang kanyang trono
  rationale: Tuwirang katumbas ng כִּסֵּא ang “trono,” at pinanatili ang pang-ugnay.
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Ang אֶרֶץ ay maaaring “lupa” o “daigdig.” Sa larawang ibinabagsak ang trono, natural sa Filipino ang “sa lupa” at malinaw nitong ipinahahayag ang pagpapahiya at pagbagsak.
- source_word: מִגַּרְתָּה
  choice: ibinagsak
  rationale: Ipinahihiwatig ng pandiwa ang marahas na paghagis o pagpapababa. Ang “ibinagsak” ay natural sa modernong Filipino at angkop sa patulang larawan ng tronong inihahagis pababa.
theological_decisions:
- issue: Tinutukoy ng mga hulaping pangatlong panauhan
  choice: Isinalin bilang “kanyang,” nang hindi tahasang pinangalanan ang tinutukoy.
  alternative: Tukuyin siya bilang haring mula kay David o bilang pinahiran sa tipan.
  rationale: Mga hulaping pangatlong panauhang panlalaki lamang ang nasa Hebreo, at hindi inuulit sa talatang ito ang antecedent. Pinananatili ng “kanyang” ang daloy at ang likas na di-tiyak na pagtukoy ng talata.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang “karilagan” upang maipahayag ang maharlikang ningning; pinanatili ang “kanyang” upang hindi tukuyin nang higit sa sinasabi ng Hebreo ang taong tinutukoy.
