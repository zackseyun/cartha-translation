translation:
  language: tl
  text: Kung lalapastanganin nila ang aking mga tuntunin at hindi susundin ang aking mga utos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalabagin nila ang aking mga tuntunin.” Ang pandiwang Hebreo ay maaaring mangahulugang lapastanganin o ituring na marumi o pangkaraniwan; pinananatili ng “lalapastanganin” ang mas matinding diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ang אִם ay nagpapakilala ng kondisyong sugnay. Pinananatili ng “Kung” ang tuwirang kondisyong diwa nang hindi ipinapalagay na tiyak na mangyayari ang kilos.
- source_word: חֻקֹּתַי
  choice: ang aking mga tuntunin
  rationale: Ang חֻקָּה ay tumutukoy sa mga itinakdang batas o alituntunin. Ang “mga tuntunin” ay natural sa modernong Filipino at nananatiling naiiba sa kasunod na “mga utos.”
- source_word: יְחַלֵּלוּ
  choice: lalapastanganin nila
  rationale: Ang piel ng חלל ay may malakas na diwang lapastanganin o tratuhing hindi banal. Pinananatili ng “lalapastanganin” ang bigat ng salitang Hebreo kaysa sa mas pangkalahatang “lalabagin.”
- source_word: וּמִצְוֺתַי
  choice: at ang aking mga utos
  rationale: Ang מִצְוָה ay karaniwang tumutukoy sa isang utos. Ang “mga utos” ay malinaw at natural, at pinananatili ang pagkakaiba nito sa חֻקּוֹת, “mga tuntunin.”
- source_word: לֹא יִשְׁמֹרוּ
  choice: hindi susundin
  rationale: Sa kontekstong legal at tipan, ang שׁמר ay nangangahulugang tuparin o sundin ang ipinag-uutos. Ang “hindi susundin” ang pinakanatural na pahayag sa Filipino, habang malinaw na naihahatid ang diwa ng hindi pag-iingat o pagtupad sa mga utos.
theological_decisions:
- issue: Lakas ng wikang tumutukoy sa paglabag sa tipan sa יְחַלֵּלוּ
  choice: “lalapastanganin” sa halip na ang mas pangkalahatang “lalabagin”
  alternative: “lalabagin ang aking mga tuntunin”
  rationale: Ang pandiwang Hebreo sa piel ay nagpapahiwatig ng paglapastangan o pagtrato sa banal na bagay na para bang karaniwan. Inililipat ng “lalapastanganin” ang bigat na ito nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tuntunin” at “mga utos” upang mapanatili ang paralelismo at pagkakaiba ng dalawang terminong legal, at ang “lalapastanganin” upang maipahayag ang matinding puwersa ng pandiwang Hebreo.
