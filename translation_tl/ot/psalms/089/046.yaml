  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: tl
  text: Hanggang kailan, O Yahweh[a]? Magkukubli ka ba magpakailanman? Magliliyab ba ang iyong poot na parang apoy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa nakaugalian, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָה
  choice: Hanggang kailan
  rationale: Likas na pormula ng panaghoy sa Tagalog na nagpapahayag ng matinding pagtatanong kung gaano pa katagal ang pagdurusa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: תִּסָּתֵר
  choice: magkukubli ka
  rationale: Ipinapahayag ng anyong Niphal na waring ikinukubli ng Diyos ang kanyang sarili; natural at marangal ang 'magkukubli ka' sa modernong Tagalog.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Pinananatili ang diwa ng walang takdang tagal at ang mataas ngunit madaling maunawaang himig ng salmo.
- source_word: תִּבְעַר
  choice: magliliyab
  rationale: Pinananatili ang aktibong larawan ng nag-aapoy na poot nang hindi idinaragdag ang ideya ng paglamon o pagwasak.
- source_word: כְּמוֹ אֵשׁ
  choice: parang apoy
  rationale: Direkta at likas na Tagalog na paghahambing.
- source_word: חֲמָתֶךָ
  choice: iyong poot
  rationale: Ang 'poot' ay malinaw, marangal, at angkop sa matinding banal na galit na tinutukoy ng salmo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang יְהוָה sa tuwirang panawagan; pinananatili ng 'Yahweh' ang pagkakakilanlang iyon nang hindi ito pinapalitan ng titulo.
- issue: Tanong tungkol sa pagtatago ng Diyos
  choice: Magkukubli ka ba magpakailanman?
  alternative: Mananatili ka bang nakatago magpakailanman?
  rationale: Pinananatili ang tuwirang panaghoy at ang posibleng reflexive na diwa ng pandiwa, nang hindi nilulutas ang tensiyon ng waring paglayo ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig-panaghoy. Ginamit ang payak at tuwirang mga tanong; iniwasan ang sobrang arkaikong bokabularyo habang pinanatili ang metapora ng apoy at ang teolohikal na tensiyon ng tila pagtatago ng Diyos.
