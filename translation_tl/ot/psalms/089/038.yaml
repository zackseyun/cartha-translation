source:
  edition: WLC
  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: tl
  text: Ngunit itinakwil mo at tinanggihan[a]; nag-alab ang galit mo sa iyong pinahiran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong pinahiran” o “iyong Mesiyas.” Ito rin ang salitang isinasaling “Mesiyas,” ngunit dito ay tuwirang tumutukoy sa haring mula sa angkan ni David sa ilalim ng tipan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ... mo
  rationale: Ang pangatnig at tahasang panghalip ay naghuhudyat ng matinding pagsalungat sa naunang mga pahayag tungkol sa katapatan ng Diyos sa tipan.
- source_word: זָנַחְתָּ
  choice: itinakwil mo
  rationale: Ipinahahayag ng זנח ang pagtatakwil o pagtataboy; likas at mariin ang “itinakwil” sa konteksto ng panaghoy.
- source_word: וַ/תִּמְאָס
  choice: at tinanggihan
  rationale: May pagkakapatong ang מאס at זנח, ngunit nagdaragdag ito ng diwa ng mariing pagtanggi. Pinananatili ng tambalang “itinakwil ... at tinanggihan” ang pagpapatindi sa Hebreo.
- source_word: הִתְעַבַּרְתָּ
  choice: nag-alab ang galit mo
  rationale: Ang hitpael ng עבר ay isang idyomang nagsasaad ng matinding pagkapoot o pag-apaw ng galit. Malinaw at marangal sa modernong Tagalog ang “nag-alab ang galit mo.”
- source_word: עִם
  choice: sa
  rationale: Bagaman literal na “kasama/kay,” sa Tagalog ay likas ipahayag ang tuon ng galit sa pamamagitan ng “sa,” nang hindi kinakailangang palalimin pa bilang tahasang pagkilos laban sa kanya.
- source_word: מְשִׁיחֶךָ
  choice: iyong pinahiran
  rationale: Literal itong “iyong pinahiran.” Tumutukoy ito kaagad sa haring mula sa angkan ni David, habang pinananatili ang leksikal na kaugnayan nito sa titulong Mesiyas sa talababa.
theological_decisions:
- issue: Paglalarawan sa מְשִׁיחֶךָ sa isang maharlikang panaghoy na may mesiyanikong alingawngaw
  choice: iyong pinahiran
  alternative: iyong Mesiyas
  rationale: Ang salitang Hebreo ang pinagmulan ng “Mesiyas,” ngunit sa agarang konteksto ay tumutukoy ito sa haring Davidiko bilang pinahiran ng Diyos. Hindi ginagawang tahasan ng salin ang isang pagkakakilanlang higit sa sinasabi ng talata, ngunit pinananatili sa talababa ang mahalagang ugnayang leksikal at teolohikal.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panaghoy. Ginamit ang dalawang magkalapit na pandiwa upang mapanatili ang pagpapatindi ng Hebreo, at ang “nag-alab ang galit” upang ihatid ang matinding damdamin nang natural.
