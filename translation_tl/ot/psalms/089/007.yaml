  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: tl
  text: Ang Diyos ay lubos na kinatatakutan sa kapulungan[a] ng mga banal[b], at kasindak-sindak higit sa lahat ng nakapaligid sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “konseho”; ang salitang Hebreo ay maaaring tumukoy sa isang malapit na lupon o kapulungang nagsasanggunian.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga banal” dito ay malamang na tumutukoy sa mga nilalang sa langit, hindi sa mga banal na tao.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: Ang Diyos
  rationale: Tumutukoy sa Diyos ng Israel sa kontekstong ito; ito ang likas at malinaw na salin sa modernong Tagalog.
- source_word: נַעֲרָץ ... רַבָּה
  choice: lubos na kinatatakutan
  rationale: Ipinahahayag ng Niphal participle at ng pang-abay na pampasidhi ang matinding pagpipitagan na may takot; pinananatili ng salin ang lakas ng Hebreo nang hindi nagpapahiwatig ng kasamaan.
- source_word: בְּסוֹד
  choice: sa kapulungan
  rationale: Maaaring tumukoy ang סוֹד sa isang malapit na konseho o kapulungang nagsasanggunian. Natural ang “kapulungan” sa Tagalog at hindi nito labis na tinutukoy ang anyo ng pagtitipon.
- source_word: קְדֹשִׁים
  choice: ng mga banal
  rationale: Literal at sadyang hindi ganap na tinutukoy ang pagkakakilanlan ng mga tinutukoy; sa konteksto, malamang na mga nilalang sa langit ang mga ito.
- source_word: וְנוֹרָא
  choice: at kasindak-sindak
  rationale: Ipinapahayag ang pagkamangha at takot na dulot ng presensiya ng Diyos, alinsunod sa kaagapay na pariralang “lubos na kinatatakutan.”
- source_word: עַל כָּל סְבִיבָיו
  choice: higit sa lahat ng nakapaligid sa kanya
  rationale: 'Binabasa ang עַל bilang paghahambing o pangingibabaw: ang Diyos ay higit na kasindak-sindak kaysa sa lahat ng nasa paligid niya.'
theological_decisions:
- issue: Pagkakakilanlan ng “mga banal” at ng mga nakapaligid sa Diyos
  choice: Pinanatili sa pangunahing teksto ang malawak na katawagang “mga banal,” habang ipinaliliwanag sa talababa na malamang na mga nilalang sa langit ang tinutukoy.
  alternative: Mga banal na tao, o isang halo-halong kapulungan ng mga sumasamba.
  rationale: Ang kalapit na konteksto ng Awit 89 ay tumutukoy sa kalangitan at sa kapulungan sa langit. Gayunman, hindi tahasang sinasabi ng mismong parirala ang uri ng mga nilalang, kaya hindi ito labis na tinukoy sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “kapulungan” sa halip na mas teknikal na “konseho” sa pangunahing teksto, at “kasindak-sindak” upang mapanatili ang banal na pagkamangha at takot ng Hebreo.
