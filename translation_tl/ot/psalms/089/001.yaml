  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: tl
  text: Ang tapat na pag-ibig ni Yahweh ay aawitin ko magpakailanman[a]; sa sali't salinlahi ay ipababatid ko sa pamamagitan ng aking bibig ang iyong katapatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga awa” o “mga gawa ng tapat na pag-ibig.” Ang Hebreong חַסְדֵי ay maaaring tumukoy sa tipanang pag-ibig ni Yahweh na nahahayag sa paulit-ulit na mga gawa ng awa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: mga gawa ng tapat na pag-ibig
  rationale: Ang maramihang anyong חַסְדֵי ay maaaring tumukoy sa paulit-ulit na pagpapahayag ng matatag at tipanang pag-ibig ni Yahweh. Pinananatili ng saling ito ang plural at ang diwa ng pag-ibig na nahahayag sa mga gawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Ginagamit dito bilang pang-abay na nagsasaad ng patuloy at walang takdang pag-awit.
- source_word: אָשִׁירָה
  choice: aawitin ko
  rationale: Ang cohortative ay nagpapahayag ng matibay na pasiya o intensiyon; natural itong naipahahayag sa Filipino sa anyong panghinaharap.
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahi
  rationale: Likas na idyomang Filipino para sa pagpapatuloy sa magkakasunod na henerasyon.
- source_word: אוֹדִיעַ
  choice: ipababatid ko
  rationale: Inilalarawan ng Hiphil ng ידע ang pagpapakilala o pagpapabatid sa iba.
- source_word: אֱמוּנָתְךָ
  choice: ang iyong katapatan
  rationale: Tumutukoy sa pagiging mapagkakatiwalaan at tapat ng Diyos, kaagapay ng חֶסֶד.
- source_word: בְּפִי
  choice: sa pamamagitan ng aking bibig
  rationale: Pinananatili ang kongkretong larawan ng bibig bilang kasangkapan ng hayagang pagpapahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh nang hindi pinapalitan ng titulo.
- issue: Saklaw ng kahulugan ng חַסְדֵי
  choice: mga gawa ng tapat na pag-ibig
  alternative: mga awa; tapat na pag-ibig
  rationale: Sa konteksto ng tipan sa salmo, maaaring saklawin ng salita kapwa ang matatag na pag-ibig at ang maraming kongkretong pagkilos na nagpapahayag nito. Hindi ito nililimitahan sa damdamin lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sali't salinlahi” bilang pamilyar na idyoma at pinanatili ang konkretong larawang “aking bibig.”
