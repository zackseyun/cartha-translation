  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: tl
  text: Ang lahi niya ay mananatili magpakailanman,[a] at ang kanyang trono ay magiging gaya ng araw sa harap ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang kanyang binhi ay mananatili magpakailanman.” Ang “lahi” ay nagpapahayag ng kolektibong diwa ng salitang Hebreo sa mas likas na Filipino.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa aking presensya.” Literal na sinasabi ng Hebreo, “sa harap ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: ang lahi niya
  rationale: Ang זֶרַע ay maaaring literal na “binhi” o kolektibong tumukoy sa supling at mga inapo. Sa konteksto ng tipan sa hari, ang “lahi niya” ay natural sa makabagong Filipino at naipapahayag ang dinastikong pagpapatuloy nang hindi ginagawang tahasang maramihan ang kolektibong anyo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag dito ng עוֹלָם ang walang-hanggang pananatili sa kontekstong patula at pangtipan; ang “magpakailanman” ay malinaw, marangal, at karaniwan sa Filipino.
- source_word: יִהְיֶה
  choice: ay mananatili
  rationale: Literal na “ay magiging/ay iiral” ang pandiwa, ngunit ang “ang lahi niya ay magiging magpakailanman” ay hindi likas sa Filipino. Ipinahahayag ng “mananatili” ang patuloy na pag-iral na hinihingi ng konteksto nang hindi nagdaragdag ng bagong ideya.
- source_word: וְכִסְאוֹ
  choice: at ang kanyang trono
  rationale: Pinananatili ang kongkretong larawang “trono,” na sa kontekstong maharlika ay kumakatawan din sa paghahari, sa halip na palitan ito ng abstraktong “kaharian” o “pamamahala.”
- source_word: כַשֶּׁמֶשׁ
  choice: gaya ng araw
  rationale: Tuwirang pinananatili ng “gaya ng araw” ang paghahambing na minamarkahan ng כְּ.
- source_word: נֶגְדִּי
  choice: sa harap ko
  rationale: Ang נֶגֶד na may hulaping unang panauhan ay “sa harap ko” o “sa aking presensya.” Pinananatili ng “sa harap ko” ang tuwiran at bahagyang kongkretong pahayag ng Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng unang panauhan sa נֶגְדִּי
  choice: Panatilihin ang “sa harap ko” bilang tuwirang pananalita ng Diyos
  alternative: “sa aking presensya”
  rationale: Ang bahaging ito ng awit ay nakabalangkas bilang pagsasalita ng PANGINOON tungkol kay David at sa kanyang lahi. Pinananatili ng unang panauhan ang puwersang pangtipan nang hindi ito pinapaliwanag nang higit sa teksto.
- issue: Ang ipinahihiwatig na pandiwa sa ikalawang sugnay
  choice: Gamitin ang “ay magiging” sa “ang kanyang trono ay magiging gaya ng araw”
  alternative: “at ang kanyang trono, gaya ng araw” o “mananatiling gaya ng araw”
  rationale: Walang tahasang pandiwa sa ikalawang sugnay ng Hebreo. Ang “ay magiging” ay likas sa Filipino at maaaring unawain bilang pandiwang ipinahihiwatig mula sa unang sugnay, samantalang iniiwasan nitong tiyaking “tatagal” ang tiyak na punto ng paghahambing.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may pinanatiling paralelismo at larawang patula. Ginamit ang “lahi” sa dinastikong kahulugan at “sa harap ko” upang mapanatili ang tuwirang pananalita at tunay na saklaw ng Hebreo.
