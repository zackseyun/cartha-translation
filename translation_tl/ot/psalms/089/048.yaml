source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: tl
  text: Sinong lalaki ang mabubuhay at hindi makakakita ng kamatayan?[a] Maililigtas ba niya ang kanyang buhay[b] mula sa kamay ng Sheol? Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “makararanas ng kamatayan.” Literal: “makakakita ng kamatayan.”'
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang kaluluwa” o “ang kanyang sarili.”
    reason: lexical_alternative
  - marker: c
    text: Ang Sheol ay katawagang Hebreo para sa daigdig ng mga patay; maaari ring isalin na “libingan.” Hindi tiyak ang kahulugan ng “Selah.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Sinong lalaki
  rationale: Naglulunsad ito ng retorikal na tanong. Tiyak na panlalaki ang גֶבֶר, kaya pinanatili ang ‘lalaki’ sa halip na gawing neutral na ‘tao,’ bagaman kumakatawan ang tanong sa kalagayan ng sangkatauhan.
- source_word: יִחְיֶה
  choice: ang mabubuhay
  rationale: 'Sa retorikal na tanong, ipinahihiwatig ng imperfect ang posibilidad: sino ang maaaring patuloy na mabuhay?'
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: at hindi makakakita ng kamatayan
  rationale: Pinananatili ang literal at makatang larawang ‘makakita ng kamatayan’; inilalagay sa talababa ang mas idiomatikong kahulugang ‘makaranas ng kamatayan.’
- source_word: יְמַלֵּט
  choice: Maililigtas ba niya
  rationale: Ang Piel ay nagpapahayag ng pagpapalaya o pagliligtas mula sa kapangyarihan o pagkakahawak ng iba.
- source_word: נַפְשׁוֹ
  choice: ang kanyang buhay
  rationale: Sa konteksto ng kamatayan at Sheol, natural na tumutukoy ang נֶפֶשׁ sa buhay o sarili ng tao. Iniiwasan ng ‘buhay’ ang di-kinakailangang makitid na pagpapakahulugan sa ‘kaluluwa,’ habang itinatala ang mga alternatibo.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang malinaw na Hebreong metapora ng kamay bilang kapangyarihan o pagkakahawak.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang katawagang Hebreo upang hindi ito agad ipakahulugan bilang ‘impiyerno’ o limitahan sa pisikal na libingan lamang.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa nakaugaliang transliterasyon dahil hindi tiyak ang eksaktong kahulugan o tungkulin nito sa awit.
theological_decisions:
- issue: Kahulugan ng שְׁאוֹל sa kontekstong patula
  choice: Pinanatili ang ‘Sheol’ bilang transliterasyon.
  alternative: ‘daigdig ng mga patay’ o ‘libingan’
  rationale: Tinutukoy ng talata ang di-maiiwasang kamatayan at kawalan ng kakayahan ng tao na makatakas sa Sheol. Pinananatili ng transliterasyon ang lawak at tensiyon ng konseptong Hebreo nang hindi nag-aangkat ng mas huling doktrina tungkol sa impiyerno.
- issue: Panlalaking katawagan sa גֶבֶר
  choice: lalaki
  alternative: tao
  rationale: Tiyak na panlalaki ang salitang Hebreo, kaya isinalin itong ayon sa anyo nito. Gayunman, ang retorikal na tanong ay may malawak na kabuluhan tungkol sa mortalidad ng tao.
- issue: Saklaw ng נַפְשׁוֹ
  choice: kanyang buhay
  alternative: kanyang kaluluwa o kanyang sarili
  rationale: Sa paralelismo ng kamatayan at Sheol, maaaring tumukoy ang נֶפֶשׁ sa buhay, sarili, o kaluluwa. Pinili ang natural na ‘buhay’ sa pangunahing teksto at pinanatili sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may pinanatiling Hebreong imahen at katawagang patula. Ginamit ang ‘Sinong lalaki’ para sa natural na takbo ng retorikal na tanong at ang ‘maililigtas ba niya’ upang malinaw na ipakita ang ikalawang tanong. Ang mga talababa ay tuwirang nakamarka sa pangunahing teksto.
