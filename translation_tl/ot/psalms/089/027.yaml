  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: tl
  text: Gagawin ko nga siyang panganay[a], ang pinakamataas sa mga hari sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nangunguna sa lahat.” Ang “panganay” dito ay tumutukoy sa pinakamataas na ranggo at pribilehiyo, hindi kinakailangang sa literal na pagkakasunod ng kapanganakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אָ֭נִי
  choice: Gagawin ko nga
  rationale: Ipinahahayag ng “ko” ang nagsasalitang Diyos, at ng “nga” ang pagbibigay-diin ng אַף kasabay ng tahasang אָ֭נִי. Mas natural ito sa modernong Tagalog kaysa sa pilit na pagtutumbas na “Ako nga ay.”
- source_word: בְּכ֣וֹר
  choice: panganay
  rationale: Pinananatili ang konkretong katawagang Hebreo, na sa kontekstong maharlika ay tumutukoy sa pinakamataas na katayuan at pribilehiyo, hindi kinakailangang sa literal na pagkakasunod ng kapanganakan.
- source_word: אֶתְּנֵ֑הוּ
  choice: Gagawin ko siyang
  rationale: Ang נתן na may panaguring layon ay may diwang gawing o italaga ang isang tao sa isang katayuan. Likas sa Tagalog ang “gagawin ko siyang” at napapanatili nito ang resultang ipinahahayag ng pandiwa.
- source_word: עֶ֝לְי֗וֹן
  choice: ang pinakamataas
  rationale: Inilalarawan dito ang ranggo ng hari kung ihahambing sa ibang mga hari. Iniiwasan ng “pinakamataas” ang anyong “Kataas-taasan,” na karaniwang nauunawaan bilang titulo ng Diyos.
- source_word: לְ/מַלְכֵי אָֽרֶץ
  choice: sa mga hari sa lupa
  rationale: Ang לְ pagkatapos ng עֶלְיוֹן ay nagpapahayag ng ugnayan o paghahambing. Likas na ipinahahayag ito sa Tagalog bilang “ang pinakamataas sa mga hari sa lupa,” na nagpapahiwatig ng pangingibabaw sa kanila.
theological_decisions:
- issue: Maharlika at maaaring mesiyanikong diwa ng “panganay”
  choice: Panatilihin ang “panganay” bilang katawagang nagpapahiwatig ng kataas-taasang ranggo at pribilehiyo, nang hindi tahasang idinaragdag sa salin ang mesiyanikong pagbasa.
  alternative: Isalin nang interpretatibo bilang “tagapagmana” o “pinakadakila.”
  rationale: Sa konteksto, tumutukoy ito sa haring mula sa sambahayan ni David at maaaring magkaroon ng mas malawak na mesiyanikong kabuluhan sa kanonikal na pagbasa. Gayunman, “panganay” mismo ang larawang ginamit ng Hebreo, kaya dapat itong panatilihin upang hindi maalis ang teolohikal na lalim o malutas sa salin ang isang kahulugang sadyang hindi tahasang ipinaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nga” upang natural na maipahayag ang pagbibigay-diin, at pinanatili ang “panganay” bilang mahalagang larawang maharlika sa Hebreo.
