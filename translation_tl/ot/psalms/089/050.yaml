  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: tl
  text: Alalahanin mo, Panginoon, ang paghamak sa iyong mga lingkod, na dinadala ko sa aking dibdib[b] mula sa maraming bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “dinadala ko sa aking dibdib ang paghamak ng lahat ng maraming bayan.” Siksik ang sintaks ng Hebreo pagkatapos ng “sa aking dibdib”; maaaring unawain ang mga bayan bilang pinagmumulan ng paghamak (“mula sa maraming bayan”) o bilang kaugnay na nilalaman o lawak ng pinapasan (“ng lahat ng maraming bayan”).'
    reason: alternative_reading
  - marker: b
    text: Ang “sa aking dibdib” ay katumbas ng larawang Hebreo na maaari ring tumukoy sa kandungan. Ipinahihiwatig nito ang pagdadala ng isang bagay nang personal at malapit sa sarili, hindi lamang sa literal na pisikal na paraan.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pakiusap sa Diyos sa anyong pautos. Likas sa makabagong Tagalog ang “alalahanin mo” at pinananatili nito ang diwa ng panalangin at panaghoy.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang nakaugaliang banal na titulo sa tuwirang pagtawag sa Diyos; hindi kailangang gawing “Panginoon ko,” sapagkat nakapirming titulo ang gamit dito.
- source_word: חֶרְפַּת
  choice: ang paghamak
  rationale: Saklaw nito ang kahihiyan, panlalait, at paghamak. Ang “paghamak” ay marangal at natural sa Tagalog at hindi nililimitahan ang salita sa pasalitang panunuya lamang.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa panalangin tungkol sa bayan ng Diyos, ang “mga lingkod” ang natural at angkop na salin kaysa “mga alipin.”
- source_word: שְׂאֵתִי
  choice: na pasan ko
  rationale: Mula sa pandiwang nangangahulugang magbuhat o magdala. Ipinahahayag ng “pasan ko” ang personal na pagtitiis sa paghamak at maayos itong nag-uugnay sa naunang parirala.
- source_word: בְּחֵיקִי
  choice: sa aking kandungan
  rationale: Ang חֵיק ay tumutukoy sa kandungan o dakong malapit sa dibdib. Pinananatili ng “sa aking kandungan” ang kongkretong larawang Hebreo ng pagdadala ng isang bagay nang malapit at personal.
- source_word: כָּל רַבִּים עַמִּים
  choice: mula sa maraming bayan
  rationale: Siksik at mahirap ang sintaks. Binabasa rito ang mga bayan bilang pinagmumulan ng paghamak. Ang “mga bayan” ay nagpapanatili sa maramihang עַמִּים at maaaring tumukoy sa mga bansa o pangkat ng mga tao.
theological_decisions:
- issue: Pagbibigay-salin sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: Panginoon ko
  rationale: Sa konteksto, ito ang nakaugaliang banal na titulo sa tuwirang pagtawag sa Diyos. Hindi idinaragdag ang tahasang pagmamay-ari na maaaring magpahiwatig ng pagbasa na hindi itinatampok ng gamit dito.
- issue: Ugnayan ng כָּל רַבִּים עַמִּים sa naunang sugnay
  choice: Ang paghamak ay nagmumula sa maraming bayan
  alternative: Pasan ng salmista ang paghamak ng lahat ng maraming bayan
  rationale: Malabo at siksik ang sintaks ng Hebreo. Pinili sa pangunahing teksto ang natural na pagbasa ng pinagmulan, ngunit pinananatili sa talababa ang tunay na alternatibong pagbasa sa halip na lutasin nang tahimik ang tensiyon.
translation_notes:
  register: Makabago ngunit marangal na wikang Tagalog para sa panalangin at panaghoy. Ginamit ang “pasan” upang maging natural ang idyoma habang pinananatili ang kongkretong larawan ng “kandungan.” Inilagay ang mga pananda ng talababa sa mismong pariralang nililinaw ng bawat tala.
