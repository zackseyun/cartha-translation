  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: tl
  text: 'Sapagkat kay Yahweh ang aming kalasag[a],

    at sa Banal ng Israel ang aming hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Sapagkat ang aming kalasag ay pag-aari ni Yahweh, at ang aming hari ay pag-aari ng Banal ng Israel.” Eliptiko at mahigpit na magkapareho ang estruktura ng dalawang sugnay sa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahihiwatig nito ang batayan o paliwanag sa naunang papuri at pagtitiwala, nang hindi pinalalabis ang diin.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay nagpapahayag dito ng pag-aari o kaugnayan. Pinananatili ng maikling pariralang ito ang eliptikong anyo at ang posibilidad na unawaing ang kalasag ay pag-aari o nasa ilalim ng kapamahalaan ni Yahweh.
- source_word: מָגִנֵּנוּ
  choice: ang aming kalasag
  rationale: Pinananatili ang kongkretong larawang patula ng kalasag sa halip na gawing tahasang 'tagapagtanggol.'
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: at ... ay sa Banal ng Israel
  rationale: Inihahanay nito ang ikalawang ל-parirala sa una at pinananatili ang eliptikong ugnayan ng pag-aari o pagkakaugnay.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: ang Banal ng Israel
  rationale: Isinasalin bilang kinikilalang banal na titulo habang pinananatili ang marangal at madaling makilalang anyo nito.
- source_word: מַלְכֵּנוּ
  choice: ang aming hari
  rationale: Tuwirang kahulugan ng pangngalan ang 'hari'; pinananatili nito ang maharlikang larawan at hindi ipinapasya sa salin kung sino mismo ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng “aming kalasag” at “aming hari”
  choice: 'Pinanatiling eliptiko at magkatugma ang dalawang sugnay: ang aming kalasag ay kay Yahweh, at ang aming hari ay sa Banal ng Israel.'
  alternative: Tahasang tukuyin ang “kalasag” bilang Diyos, o ipaliwanag na kapwa tumutukoy ang “kalasag” at “hari” sa taong hari ng Israel.
  rationale: Magkatulad ang dalawang ל-prepositional construction sa Hebreo. Maaaring tumukoy ang “kalasag” sa haring tagapagtanggol, ngunit hindi ito dapat ipilit sa pangunahing teksto; pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at patula. Ginamit ang “Yahweh” upang katawanin nang tahasan ang pangalang יהוה. Ang “ay sa” sa ikalawang linya ay bahagyang mataas ang rehistro ngunit natural na nagpapanatili sa elipsis at paralelismo ng Hebreo.
