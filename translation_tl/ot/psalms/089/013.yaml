  source_fidelity: 'Tumpak na naipapahayag ng salin ang tatlong magkakatulad na larawan sa Hebreo: bisig na may gĕburah (kapangyarihan/lakas), malakas na kamay, at mataas na kanang kamay. Napananatili ang kongkretong antropomorpikong wika at ang bukás na saklaw ng תָּרוּם bilang pagiging mataas o nakataas.'
  naturalness: Natural at marangal ang daloy sa makabagong Filipino. Ang pambungad na “Sa iyo ang” ay katanggap-tanggap na matulaing paraan ng pagpapahayag ng pag-aari at diin. Ang “mataas ang iyong kanang kamay” ay bahagyang literal ngunit angkop sa tula at sinasadyang hindi nagpapasya kung pisikal o matalinghagang pagtaas ang diin.
  terminology: Ang “bisig,” “kamay,” at “kanang kamay” ay wasto at magkakaparis na katumbas ng זְרוֹעַ, יָד, at יָמִין. Ang “kapangyarihan” para sa גְּבוּרָה at “malakas” para sa תָּעֹז ay malinaw at hindi nagbubura sa paralelismo. Ang talababa ay may wastong angkla at nagbibigay ng lehitimong leksikal/sintaktikong alternatibo.
