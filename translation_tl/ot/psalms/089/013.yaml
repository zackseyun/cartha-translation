  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: tl
  text: Sa iyo ang bisig na may kapangyarihan; malakas ang iyong kamay; mataas ang iyong kanang kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Mayroon kang bisig na makapangyarihan; nagpapakita ng lakas ang iyong kamay; nakataas ang iyong kanang kamay.”'
    reason: Mga leksikal at sintaktikong alternatibo para sa לְךָ, תָּעֹז, at תָּרוּם.
lexical_decisions:
- source_word: לְךָ
  choice: Sa iyo ang
  rationale: 'Nasa unahan ang pariralang nagpapahayag ng pag-aari at nagbibigay-diin: sa Diyos nauukol ang bisig. Likas ito sa Filipino at hindi kailangang dagdagan ng pandiwang “mayroon.”'
- source_word: זְרוֹעַ
  choice: bisig
  rationale: Pinananatili ang kongkretong larawang Hebreo ng bisig bilang sagisag ng kapangyarihan.
- source_word: עִם גְּבוּרָה
  choice: na may kapangyarihan
  rationale: Ipinapahayag ng עִם ang katangiang kaakibat ng bisig. Ang “may kapangyarihan” ay malinaw at natural, habang pinananatili ang pagkakaiba nito sa kasunod na “malakas.”
- source_word: תָּעֹז
  choice: malakas
  rationale: Ang pandiwa ay nagsasaad ng pagiging malakas. Sa Filipino, natural itong gawing panaguri sa “iyong kamay.”
- source_word: יָדְךָ
  choice: iyong kamay
  rationale: Tuwirang pinananatili ang antropomorpikong larawan ng kamay bilang aktibong kapangyarihan.
- source_word: תָּרוּם
  choice: mataas
  rationale: Maaaring mangahulugang “mataas,” “itinaas,” o “dakila.” Pinananatili ng “mataas” ang payak na kalabuan kung ito ay kalagayan, karangalan, o matagumpay na pagtaas.
- source_word: יְמִינֶךָ
  choice: iyong kanang kamay
  rationale: Pinananatili ang parallelismo at ang biblikal na larawan ng kanang kamay bilang lakas at tagumpay.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa kapangyarihan ng Diyos
  choice: Panatilihin ang “bisig,” “kamay,” at “kanang kamay.”
  alternative: Gawing abstrakto ang mga ito bilang “lakas” o “kapangyarihan.”
  rationale: Sadyang gumagamit ang Hebreong tula ng mga bahagi ng katawan bilang larawan ng kapangyarihan ng Diyos; ang pagpapanatili nito ay nag-iingat sa anyo at puwersa ng orihinal.
- issue: Kahulugan ng pagtaas ng kanang kamay
  choice: “mataas ang iyong kanang kamay”
  alternative: “itinaas ang iyong kanang kamay” o “dakila ang iyong kanang kamay”
  rationale: Hindi tahasang nilulutas ng anyong Hebreo kung pisikal na pagtaas, mataas na katayuan, o kadakilaan ang pangunahing diin. Ang “mataas” ay nagpapanatili ng lawak na ito.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “bisig” upang mapanatili ang matulaing larawan at ang “kapangyarihan” bilang karaniwang salitang biblikal na malinaw sa malawak na mambabasa.
