  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: tl
  text: Mapalad ang bayang nakaaalam ng sigaw ng kagalakan[a]; Yahweh, lumalakad sila sa liwanag ng iyong mukha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sigaw sa kapistahan”; maaaring kasama rito ang tunog ng trumpeta bilang pagbubunyi sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong mukha” ay maaari ring tumukoy sa iyong presensya o lingap.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ang anyong padamdam na ito ay nagpapahayag ng pinagpalang kalagayan. Likas at marangal sa modernong Tagalog ang “Mapalad,” at hindi nito nililimitahan ang diwa sa pansariling saya lamang.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa isang sambayanan, hindi pangunahing sa isang estadong pampolitika. Pinananatili ng “bayan” ang kolektibong diwa ng salitang Hebreo.
- source_word: יוֹדְעֵי
  choice: nakaaalam
  rationale: Ipinakikita ng participle ang katangiang palagian ng bayan. Ang “nakaaalam” ay malapit sa tahasang kahulugan at hindi muna ipinapakahulugang simpleng pagdinig o paggawa.
- source_word: תְרוּעָה
  choice: sigaw ng kagalakan
  rationale: Maaaring tumukoy ang salita sa malakas na sigaw ng pagbubunyi, sigaw sa kapistahan, o tunog ng trumpeta. Ang kontekstong masaya at panliturhiya ay sumusuporta sa “sigaw ng kagalakan,” habang inilalagay sa talababa ang mas tiyak na posibleng diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בְּאוֹר
  choice: sa liwanag
  rationale: Ipinahahayag nito ang kalagayan o saklaw kung saan sila lumalakad, kaya natural ang “sa liwanag.”
- source_word: פָּנֶיךָ
  choice: ng iyong mukha
  rationale: Pinananatili nito ang kongkretong larawang Hebreo. Ang mga diwang “presensya” at “lingap” ay tunay na ipinahihiwatig ngunit hindi ipinapalit sa larawan sa pangunahing teksto.
- source_word: יְהַלֵּכוּן
  choice: lumalakad sila
  rationale: Pinananatili ng “lumalakad” ang karaniwang metapora ng pamumuhay sa harap ng Diyos at ang nagpapatuloy na kilos ng pandiwa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kung gagawing tahasang “presensya” o “lingap” ang פָּנֶיךָ
  choice: iyong mukha
  alternative: iyong presensya; iyong lingap
  rationale: Literal na “iyong mukha” ang Hebreo, ngunit maaari itong magpahiwatig ng presensya o lingap ng Diyos. Pinananatili sa teksto ang larawan at sa talababa ang mga ipinahihiwatig nito upang hindi paliitin ang teolohikal na saklaw.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang kolektibong “bayan,” ang metaporang “lumalakad,” at ang larawang “liwanag ng iyong mukha.” Inilagay ang mga marker na [a] at [b] sa mismong mga pariralang nililinaw ng kani-kanilang talababa.
