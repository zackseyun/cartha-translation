  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: tl
  text: Sapagkat sinabi ko, “Ang tapat na pag-ibig ay itatayo[a] magpakailanman; sa kalangitan ay itatatag mo ang iyong katapatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang tapat na pag-ibig ay itatatag magpakailanman.” Ang pandiwang Hebreo ay maaaring isaling “itatayo” o, sa mas pangkalahatang diwa, “itatatag”; pinananatili sa salin ang makatang larawan ng pagtatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o pagbibigay-dahilan na ipinahihiwatig ng pangatnig sa daloy ng salmo.
- source_word: אָמַרְתִּי
  choice: sinabi ko
  rationale: Tuwirang katumbas ng Qal perfect na unang panauhang isahan, nang hindi ito ginagawang mas mariing ‘ipinapahayag ko.’
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Likas at marangal na salin sa Filipino para sa walang-hanggang tagal na tinutukoy rito.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Pinagsasama nito ang diwa ng pag-ibig at matibay na katapatan, nang hindi nililimitahan ang salita sa awa lamang o nilalagyan ng tahasang terminong pangtipan na wala mismo sa salita.
- source_word: יִבָּנֶה
  choice: ay itatayo
  rationale: Pinananatili ang pasibong anyo at ang makatang talinghaga ng pagtatayo mula sa pandiwang בנה.
- source_word: שָׁמַיִם
  choice: kalangitan
  rationale: Ang ‘kalangitan’ ay likas na kolektibong salitang Filipino na angkop sa makatang rehistro ng Hebreong שָׁמַיִם.
- source_word: תָּכִן
  choice: itatatag mo
  rationale: Ipinahahayag ang Hiphil na diwang ‘gawing matatag’ at pinananatili ang ikalawang panauhang panlalaki na tuwirang tumutukoy sa Diyos.
- source_word: אֱמוּנָתְךָ
  choice: ang iyong katapatan
  rationale: Ang ‘katapatan’ ay natural na katumbas ng katatagan, pagkamaaasahan, at pagiging tapat na saklaw ng אֱמוּנָה sa kontekstong ito.
- source_word: בָהֶם
  choice: sa kalangitan
  rationale: Ginagawang tahasan ang tinutukoy ng panghalip—ang naunang ‘kalangitan’—upang maging malinaw at natural sa Filipino.
theological_decisions:
- issue: Saklaw ng חֶסֶד sa makatang kontekstong may kaugnayan sa tipan
  choice: tapat na pag-ibig
  alternative: pag-ibig na pangtipan; awa
  rationale: Pinananatili ang magkasamang diwa ng pag-ibig at matibay na katapatan nang hindi pinakikitid ang salita sa isang doktrinal na paliwanag o sa habag lamang.
- issue: Kung tuwirang kinakausap ang Diyos sa ikalawang hati ng talata
  choice: 'Tuwirang pakikipag-usap: ‘itatatag mo ang iyong katapatan’'
  alternative: Di-tiyak na pahayag na ang katapatan ay itinatatag sa kalangitan
  rationale: Malinaw na sinusuportahan ng pandiwang nasa ikalawang panauhang panlalaki at ng hulaping nangangahulugang ‘iyong’ ang tuwirang pakikipag-usap sa Diyos.
- issue: Kung pananatilihin ang talinghaga ng pagtatayo sa יִבָּנֶה
  choice: itatayo
  alternative: itatatag
  rationale: Ang literal na larawan ng pagtatayo ay tunay na bahagi ng Hebreong tula at hindi salungat sa kahulugan ng pagpapatibay; inilalagay sa talababa ang mas pangkalahatang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo ng ‘tapat na pag-ibig’ at ‘katapatan,’ gayundin ang makatang larawan ng pagtatayo. Ginamit ang ‘kalangitan’ bilang natural na kolektibong katumbas ng Hebreong anyong maramihan.
