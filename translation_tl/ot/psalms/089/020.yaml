  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: tl
  text: Natagpuan ko si David, ang aking lingkod; pinahiran ko siya ng aking banal na langis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי
  choice: Natagpuan ko
  rationale: Ang Qal perfect na unang panauhang isahan ng מצא ay likas na isinasalin sa Filipino bilang payak na naganap. Sa konteksto ng patulang pahayag ng Diyos, ipinahahayag nito ang isang natapos na pagpili na nananatiling mahalaga sa tipan.
- source_word: דָּוִד
  choice: David
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyo nito sa modernong Filipino.
- source_word: עַבְדִּי
  choice: aking lingkod
  rationale: Maaaring mangahulugan ang עבד ng alipin o lingkod, ngunit dito ay marangal na katawagan ito kay David bilang naglilingkod sa Diyos at bilang hari sa loob ng tipan. Kaya mas angkop ang “lingkod.”
- source_word: בְּשֶׁמֶן
  choice: ng ... langis
  rationale: Sa pariralang Filipino na “pinahiran ... ng langis,” natural na ipinahahayag ng “ng” ang sangkap o instrumentong ginamit sa pagpapahid, katumbas ng gamit ng ב sa Hebreo.
- source_word: קָדְשִׁי
  choice: aking banal
  rationale: Ang קֹדֶשׁ ay tumutukoy sa kabanalan o pagiging itinalaga. Ang “banal” ang karaniwan at angkop na salin sa konteksto ng langis na inilaan para sa paghirang.
- source_word: מְשַׁחְתִּיו
  choice: pinahiran ko siya
  rationale: Ang Qal perfect na unang panauhang isahan na may hulaping ikatlong panauhang panlalaki ay nagsasaad ng natapos na pagpapahid o paghirang. Ang payak na naganap ay pinakanatural sa Filipino at kaagapay ng “Natagpuan ko.”
theological_decisions:
- issue: Wika ng pagpapahid sa hari at posibleng mesiyanikong pahiwatig
  choice: Pinanatili ang tuwirang makasaysayang pagtukoy kay David at ang literal na gawa ng pagpapahid sa kanya.
  alternative: Gumamit ng mas interpretatibong salin na tahasang naglalantad sa tipolohiya ng Mesiyas o “Pinahiran.”
  rationale: Tuwirang pinapangalanan ng Hebreo si David at sinasabing pinahiran siya ng Diyos. Bagaman maaaring magkaroon ng mesiyanikong kabuluhan ang mas malawak na salmo, hindi iyon dapat idagdag sa mismong salin ng talatang ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Natagpuan” sa halip na mas makalumang “Nasumpungan” sa pangunahing teksto, at pinanatili ang pormal na “aking” upang bumagay sa banal at patulang pahayag.
