  - severity: low
    issue: Hindi kapaki-pakinabang ang kasalukuyang talababa para sa modernong Filipino.
    rationale: Ang alternatibong “Nasumpungan” ay makaluma, at ang pagkakaibang present perfect/simple past sa Ingles ay walang tuwirang katumbas na kailangang ipaliwanag sa Filipino. Hindi rin kinakailangan ang talababa upang maipreserba ang diwa ng Hebreo.
