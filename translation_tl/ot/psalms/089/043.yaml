  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: tl
  text: 'Maging ang talim ng kanyang tabak ay pinababalik mo,[a]

    at hindi mo siya pinatayo sa labanan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinupurol mo.” Sa literal, “pinababalik mo ang talim ng kanyang tabak”; inilalarawan nito ang pagpapawalang-bisa sa pagiging mabisa nito.
    reason: lexical_alternative
  - marker: b
    text: O “hindi mo siya pinananatiling nakatayo sa labanan” o “hindi mo siya binibigyang-kakayahang manindigan sa labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Maging
  rationale: Ipinahahayag ang dagdag at mariing puwersa ng partikula sa sunod-sunod na paratang ng panaghoy.
- source_word: תָּשִׁיב
  choice: pinauurong mo
  rationale: Pinananatili ang larawang mula sa Hiphil ng שוב, ‘pinababalik/pinauurong,’ sa halip na tahasang gawing ‘pinupurol.’
- source_word: צוּר חַרְבּוֹ
  choice: ang talim ng kanyang tabak
  rationale: Sa ugnayang ito, ang צוּר ay tumutukoy sa talim o talas ng tabak, hindi sa karaniwang kahulugang ‘bato.’
- source_word: וְלֹא הֲקֵימֹתוֹ
  choice: at hindi mo siya pinatatatag
  rationale: Inihahatid ang causative na diwa ng קום—ang pagpapatayo o pagpapanatiling nakatayo—sa natural na Filipino na angkop sa pakikipaglaban.
- source_word: בַּמִּלְחָמָה
  choice: sa labanan
  rationale: Natural at tuwirang katumbas sa Filipino para sa kontekstong militar.
theological_decisions:
- issue: Tuwirang inilalarawan ang Diyos na kumikilos laban sa haring mula sa angkan ni David
  choice: 'Pinanatili ang tuwirang ikalawang panauhan: ‘pinauurong mo’ at ‘hindi mo siya pinatatatag.’'
  alternative: Gumamit ng di-tuwirang pananalita upang mapahina ang pagkilos ng Diyos.
  rationale: Tahasang iniuugnay ng panaghoy sa Diyos ang pagkabigo ng hari sa digmaan; kailangang manatili ang tensiyong teolohikal na ito.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Pinanatili ang kongkretong larawang militar ng Hebreo, habang ipinaliliwanag sa talababa ang mas idiomatikong mga kahulugan.
