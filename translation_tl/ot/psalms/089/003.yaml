  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: tl
  text: “Nakipagtipan ako sa aking hinirang[a]; sumumpa ako kay David, na aking lingkod:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ako ng tipan sa aking hinirang,” isang idyoma na nangangahulugang “nakipagtipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: Nakipagtipan ako
  rationale: Ang כּרת ברית ay idyomang Hebreo na literal na ‘pumutol ng tipan’ ngunit ang likas at dignified na katumbas sa modernong Tagalog ay ‘nakipagtipan.’ Ang aspektong ganap ng pandiwa ay naipahahayag nang natural sa Filipino sa anyong pangnagdaan.
- source_word: בְּרִית
  choice: tipan
  rationale: Pinananatili ng ‘tipan’ ang bigat ng kasunduang may taimtim at teolohikal na katangian, sa halip na payak na ‘kasunduan.’ Isinama ito sa likas na pandiwang ‘nakipagtipan.’
- source_word: לִבְחִירִי
  choice: sa aking hinirang
  rationale: Sa konstruksiyon ng pakikipagtipan, ang ל ay natural na isinasaling ‘sa.’ Ang ‘aking hinirang’ ay malinaw, personal, at hindi nagdaragdag ng interpretasyong wala sa teksto.
- source_word: נִשְׁבַּעְתִּי
  choice: sumumpa ako
  rationale: Tuwirang ipinahahayag ng ‘sumumpa’ ang taimtim na panunumpa at ang parallel na ganap na kilos ng unang sugnay.
- source_word: לְדָוִד
  choice: kay David
  rationale: Ang ל pagkatapos ng pandiwa ng panunumpa ay tumutukoy sa taong pinatutungkulan ng sumpa; ‘kay David’ ang natural na anyo sa Tagalog.
- source_word: עַבְדִּי
  choice: aking lingkod
  rationale: Sa konteksto ng maharlika at tipan, ang ‘lingkod’ ang angkop na salin ng עבד; hindi itinatampok rito ang kahulugang ‘alipin.’
theological_decisions:
- issue: Pagkakakilanlan ng “aking hinirang”
  choice: Panatilihin ang agarang tinutukoy bilang si David ayon sa paralelismo at konteksto ng tipang Davidiko.
  alternative: Basahin ito bilang tuwirang pagtukoy sa Mesiyas o bilang tipolohikal na tumutukoy lampas kay David.
  rationale: Pinagtatabi mismo ng talata ang ‘aking hinirang’ at ‘David na aking lingkod.’ Hindi dapat idagdag sa salin ang mas malawak na mesiyanikong pagbasa, bagaman maaari itong talakayin sa interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘nakipagtipan’ upang maipahayag ang Hebreong idyoma nang malinaw; pinanatili sa talababa ang literal na larawan. Ang tutuldok ay pinanatili dahil nagpapatuloy ang siniping panunumpa sa kasunod na talata.
