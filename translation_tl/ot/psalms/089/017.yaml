base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: tl
  text: Sapagkat ikaw ang kaluwalhatian ng kanilang lakas[a], at sa iyong paglingap ay itinataas mo ang aming sungay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kagandahan/karingalan ng kanilang lakas.”
    reason: lexical_alternative
  - marker: b
    text: Sa tulang Hebreo, ang “sungay” ay talinghaga para sa lakas, kapangyarihan, dangal, o mataas na kalagayan.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o batayan para sa naunang pahayag at angkop sa paliwanag na daloy ng salmo.
- source_word: תִפְאֶרֶת
  choice: kaluwalhatian
  rationale: Saklaw ng salita ang kagandahan, karingalan, at kaluwalhatian. Ipinahihiwatig dito na ang Diyos ang marangal na pinagmumulan at ipinagmamalaki ng kanilang lakas.
- source_word: עֻזָּמוֹ
  choice: kanilang lakas
  rationale: Ang panghalip na hulapi ay ikatlong panauhang maramihan. Pinananatili ng salin ang anyong “kanilang” at hindi ito pinapantay sa “aming” sa kasunod na parirala.
- source_word: אָתָּה
  choice: ikaw
  rationale: Mariin ang nagsasariling panghalip sa Hebreo. Sa Filipino, likas nang nauunawaan ang panaguring “ikaw ang kaluwalhatian” nang walang pandiwang katumbas ng “are.”
- source_word: וּבִרְצֹנְךָ
  choice: at sa iyong paglingap
  rationale: Ang רָצוֹן ay maaaring tumukoy sa lingap, mabuting kalooban, o pagsang-ayon. Ang “paglingap” ay natural at nagpapahayag ng mapagpalang pabor ng Diyos.
- source_word: תרים
  choice: itinataas mo
  rationale: Ang causative na anyo ng רוּם ay nangangahulugang itaas o dakilain. Pinananatili ng “itinataas” ang kilos at ang kaugnayan nito sa talinghagang sungay.
- source_word: קַרְנֵנוּ
  choice: aming sungay
  rationale: Literal itong “aming sungay.” Sa tulang Hebreo, ang sungay ay larawan ng lakas, kapangyarihan, dangal, o mataas na kalagayan; pinananatili ang larawan sa pangunahing teksto.
theological_decisions:
- issue: Talinghagang “sungay”
  choice: Pinanatili bilang “aming sungay” sa pangunahing teksto.
  alternative: aming lakas; aming kapangyarihan; aming karangalan
  rationale: Matingkad at mahalaga ang larawang Hebreo. Ipinaliliwanag ito sa talababa sa halip na palitan ng isang interpretasyong maglilimita sa posibleng saklaw nito.
- issue: Paglipat mula “kanilang” tungo sa “aming”
  choice: 'Pinanatili ang eksaktong paglipat ng mga panghalip: “kanilang lakas” at “aming sungay.”'
  alternative: Ipantay ang dalawa bilang “aming” upang maging mas makinis ang daloy.
  rationale: Tunay na nasa tekstong Hebreo ang paglipat mula ikatlong panauhang maramihan tungo sa unang panauhang maramihan. Hindi ito dapat tahimik na pakinisin o lutasin.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang anyong patula at ang talinghagang “sungay,” habang iniwasan ang sobrang teknikal o makalumang pananalita.
