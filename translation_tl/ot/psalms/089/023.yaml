  text: וְ/כַתּוֹתִ֣י מִ/פָּנָ֣י/ו צָרָ֑י/ו וּ/מְשַׂנְאָ֥י/ו אֶגּֽוֹף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: tl
  text: Dudurugin ko ang kanyang mga kalaban sa harap niya[a], at hahampasin ko[b] ang mga napopoot sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa harap niya,” na mas literal na nagpapanatili sa idyomang Hebreo tungkol sa pag-aalis ng mga kaaway mula sa kanyang presensya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pababagsakin” o “sasalantain”; ang pandiwang Hebreo ay maaaring tumukoy sa malakas na paghampas sa paghatol o labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: Dudurugin ko
  rationale: Ang pandiwang כתת ay nagpapahayag ng marahas at ganap na paggapi. Ang anyong may pang-ugnay ay may diwang panghinaharap sa sunod-sunod na pangako ng Diyos.
- source_word: מִפָּנָיו
  choice: sa harap niya
  rationale: Ang literal na diwa ay “mula sa harap/presensya niya.” Likas sa modernong Tagalog ang “sa harap niya,” samantalang itinatala sa talababa ang mas literal na pahiwatig ng pag-aalis ng mga kaaway mula sa kanyang harapan.
- source_word: צָרָיו
  choice: ang kanyang mga kalaban
  rationale: Tumutukoy ang צָרָיו sa mga taong aktibong sumasalungat o nakikipag-away sa kanya. Ang “mga kalaban” ay malinaw, natural, at naiiba pa rin sa “mga napopoot sa kanya” sa ikalawang hanay.
- source_word: וּמְשַׂנְאָיו
  choice: ang mga napopoot sa kanya
  rationale: Pinananatili nito ang pandiwang lakas ng participle mula sa שׂנא, na tumutukoy sa mga taong palagian o tahasang namumuhi sa kanya.
- source_word: אֶגּוֹף
  choice: hahampasin ko
  rationale: Ang נגף ay maaaring mangahulugang humampas, manalanta, o magpabagsak sa paghatol o labanan. Pinananatili ng “hahampasin” ang konkretong marahas na larawan nang hindi nililimitahan ang paraan ng paggapi.
theological_decisions:
- issue: Larawan ng Diyos bilang mandirigma sa pangakong tipan para sa haring mula kay David
  choice: Pinanatili ang tuwirang pagkilos ng Diyos at ang matinding larawang pandigma sa “dudurugin” at “hahampasin.”
  alternative: Gawing mas pangkalahatan bilang “tatalunin” o “dadaigin.”
  rationale: Malalakas ang dalawang pandiwang Hebreo at inilalarawan ang aktibong paggapi ng Diyos sa mga kaaway ng hari. Hindi dapat palambutin ang tensiyong teolohikal o dagdagan ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismong patula at ang matinding larawang pandigma, habang iniwasan ang mga salitang lipas gaya ng “sasaktan” sa diwang arkaiko o ang mas makitid na pagbasa na “sasalutin.”
