  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: tl
  text: Walang kaaway ang magpapataw sa kanya ng tributo[a], at walang sinumang masama[b] ang magpapahirap sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dadayain siya,” “magsasamantala sa kanya,” o “magpapataw sa kanya ng pabigat.” May ilang magkakaugnay na diwa ang pandiwang Hebreo; dito ay isinalin ito ayon sa konteksto ng mapaniil na pagpapataw o paniningil ng kaaway.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anak ng kasamaan,” isang idyoma para sa masamang tao o gumagawa ng masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: sisingil ng buwis
  rationale: Ang Hiphil ng נשׁא rito ay maaaring tumukoy sa paniningil o pagpapataw ng tributo. Kaayon ito ng parallel na “magpapahirap” at ng konteksto ng pag-iingat sa hari laban sa mapaniil na kaaway, habang kinikilala sa talababa ang iba pang posibleng diwa.
- source_word: אוֹיֵב
  choice: kaaway
  rationale: Karaniwan, malinaw, at natural na katumbas ng pangngalang Hebreo sa kontekstong maharlika at militar.
- source_word: בּוֹ
  choice: sa kanya
  rationale: Sa pariralang “sisingil ng buwis sa kanya,” natural sa Filipino ang “sa kanya” para sa taong hinihingan o sinisingil.
- source_word: בֶן עַוְלָה
  choice: taong masama
  rationale: Ang literal na “anak ng kasamaan” ay idyomang Hebreo para sa isang masamang tao. Ang natural na saling Filipino ay naghahatid ng kahulugan nang hindi nagmumukhang tumutukoy sa literal na angkan.
- source_word: עַוְלָה
  choice: masama
  rationale: Sa loob ng idyoma, ipinahahayag nito ang moral na kasamaan, kawalang-katarungan, o paggawa ng mali.
- source_word: יְעַנֶּנּוּ
  choice: magpapahirap sa kanya
  rationale: Ang Piel ng ענה ay nangangahulugang pahirapan, apihin, o ibaba. Ang “magpapahirap” ay malawak, malinaw, at angkop sa pangakong hindi siya sasaktan o susupilin ng masasama.
theological_decisions:
- issue: Ang tinutukoy ng isahang panghalip
  choice: Panatilihin ang “kanya” nang walang dagdag na pagkakakilanlan.
  alternative: Tahasang tukuyin siya bilang si David, ang haring mula kay David, o ang Mesiyas.
  rationale: Isahang lalaking maharlika ang tinutukoy ng Hebreo sa konteksto ng tipan, ngunit hindi dapat lutasin ng salin ang mas tiyak o tipolohikal na pagkakakilanlan nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang balanseng paralelismo ng dalawang linya at ang isahang panghalip. Isinalin nang natural ang idyomang Hebreo, habang inilagay sa talababa ang literal na anyo at ang tunay na leksikal na kalabuan ng unang pandiwa.
