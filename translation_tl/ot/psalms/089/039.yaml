  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: tl
  text: Itinakwil mo ang tipan sa iyong lingkod[a]; nilapastangan mo sa lupa ang kanyang putong[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinanggihan” o “itinaboy” ang tipan sa iyong lingkod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nilapastangan mo hanggang sa lupa ang kanyang diadema.” Ang salitang Hebreo para sa “putong” ay maaari ring magpahiwatig ng banal na pagtatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: Itinakwil mo
  rationale: Ang Piel ng נאר ay nagpapahayag ng aktibong pagtanggi o pagtataboy, hindi lamang ng pagkamuhi. Likas sa modernong Tagalog ang “itinakwil” at angkop ito sa konteksto ng tipan.
- source_word: בְּרִית
  choice: tipan
  rationale: Karaniwang salin ng בְּרִית sa kontekstong biblikal at maharlika; pinananatili nito ang pormal at teolohikal na bigat ng ugnayan.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Tumutukoy sa haring mula sa angkan ni David bilang lingkod at kinatawan ng Diyos. Mas angkop dito ang “lingkod” kaysa “alipin.”
- source_word: חִלַּלְתָּ
  choice: nilapastangan mo
  rationale: Ang Piel ng חלל ay nangangahulugang gawing di-banal, lapastanganin, o yurakan ang dangal. Naipahihiwatig ng “nilapastangan” kapwa ang paglapastangan sa banal na katayuan at ang matinding paghamak.
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Malapit ito sa literal na larawan ng pagdadala sa putong tungo sa lupa, na nagpapahiwatig ng pagbagsak at kahihiyan, nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
- source_word: נִזְרוֹ
  choice: kanyang putong
  rationale: Sa kontekstong maharlika, ang נֵזֶר ay putong o diadema. Ang “putong” ay dignidad ngunit madaling maunawaan, at ang kaugnayan ng salita sa pagtatalaga bilang banal ay ipinapaliwanag sa talababa.
theological_decisions:
- issue: Larawang maharlika at pangtipan tungkol sa lingkod mula sa angkan ni David
  choice: Pinanatili ang matinding pahayag na itinakwil ang tipan at nilapastangan sa lupa ang putong.
  alternative: Ipaliwanag ang talata bilang tuwirang mesiyanikong katuparan, o pahinain ito bilang karaniwang pagkatalong pampolitika lamang.
  rationale: Ang talata ay panaghoy tungkol sa waring pagbagsak ng tipan sa angkan ni David. Dapat manatili ang teolohikal na tensiyon sa mismong pananalita, nang hindi ito nilulutas sa pamamagitan ng isang kalaunang pagbasa o binabawasan sa sekular na politika.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “tipan,” “lingkod,” at “putong” bilang mga salitang madaling maunawaan ngunit angkop sa panulaang maharlika. Sadyang pinanatili ang tuwirang pagsumbat sa Diyos at ang mahirap na larawang “sa lupa” upang hindi pahinain ang panaghoy o magdagdag ng kilos na hindi tahasang nasa Hebreo.
