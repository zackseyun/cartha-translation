  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: tl
  text: Iingatan ko magpakailanman ang aking tapat na pag-ibig para sa kanya, at ang tipan ko ay mananatiling matatag para sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at ang tipan ko ay mananatiling tapat para sa kanya” o “at ang tipan ko ay mananatiling tiyak para sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Magpakailanman
  rationale: Ipinahahayag ng לְעוֹלָם ang walang-hanggang pananatili; natural at marangal sa modernong Filipino ang “magpakailanman.”
- source_word: אֶשְׁמֹר
  choice: iingatan ko
  rationale: Ang שׁמר ay may diwang mag-ingat, magpanatili, o magpanatiling buo. Ang “iingatan ko” ay nagpapanatili sa aktibong larawan ng pandiwang Hebreo.
- source_word: לוֹ
  choice: para sa kanya
  rationale: Maaaring magpahiwatig ang ל ng kapakinabangan o kaugnayan. Ang “para sa kanya” ay natural sa Filipino at angkop sa pangakong tipan.
- source_word: חַסְדִּי
  choice: ang aking tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang pag-ibig, katapatan, at matibay na paninindigan sa isang ugnayan. Pinananatili ng “tapat na pag-ibig” ang mga pangunahing diwang ito nang hindi nagiging teknikal o makaluma.
- source_word: וּבְרִיתִי
  choice: at ang tipan ko
  rationale: Ang בְּרִית ay karaniwang salitang Hebreo para sa tipan; “tipan” ang tiyak at nakaugaliang katumbas sa kontekstong Davidiko.
- source_word: נֶאֱמֶנֶת
  choice: ay mananatiling matatag
  rationale: Ang anyong Niphal ng אמן ay nagpapahayag ng pagiging matibay, maaasahan, o tiyak. Ipinahahayag ng “mananatiling matatag” ang patuloy na bisa at katiyakan ng tipan.
theological_decisions:
- issue: Wika ng tipan nang hindi labis na tinutukoy ang mesiyanikong katuparan
  choice: Pinanatili ang tuwirang pangako ng Diyos “para sa kanya,” na tumutukoy sa haring mula kay David sa agarang konteksto.
  alternative: Tahasang tukuyin sa talata ang Mesiyas o si Cristo.
  rationale: Ang Hebreo ay nagsasalita lamang tungkol sa “kanya.” Pinananatili ng salin ang agarang reperente at hindi ipinapasok sa mismong teksto ang isang interpretasyong mula sa mas malawak na kanon.
- issue: Kung ang נֶאֱמֶנֶת ay tumutukoy sa katapatan o katiyakan ng tipan
  choice: mananatiling matatag
  alternative: magiging tapat; magiging tiyak
  rationale: Taglay ng salita ang magkakaugnay na diwa ng katatagan, pagiging maaasahan, at katiyakan. Ang pangunahing salin ay natural sa Filipino, habang inilalahad sa talababa ang lehitimong ibang pagbasa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tapat na pag-ibig” upang maipahayag ang mayamang diwa ng חֶסֶד, at “tipan” bilang tiyak na terminong biblikal. Iniwasan ang makalumang ayos at ang pagdaragdag ng tahasang mesiyanikong katawagan na wala sa Hebreo.
