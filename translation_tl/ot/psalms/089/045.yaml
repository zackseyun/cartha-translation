  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: tl
  text: 'Pinaikli mo ang mga araw ng kanyang kabataan;

    binalot mo siya ng kahihiyan.[a]

    Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dinamtan mo siya ng kahihiyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: Pinaikli mo
  rationale: Ang Hiphil ng קצר ay nangangahulugang gawing maikli o paikliin. Likas at tuwiran sa Tagalog ang “pinaikli mo,” at naipahihiwatig ng konteksto ang nananatiling bunga ng kilos.
- source_word: יְמֵי
  choice: ang mga araw ng
  rationale: Ang anyong construct na maramihan ng “araw” ay maaaring tumukoy sa haba o yugto ng buhay. Pinananatili ng “ang mga araw ng” ang matalinghagang pananalita ng Hebreo.
- source_word: עֲלוּמָיו
  choice: kanyang kabataan
  rationale: Tumutukoy ang pangngalan sa panahon ng pagiging bata o kabataan. Ang “kanyang kabataan” ang pinakadirekta at natural na katumbas.
- source_word: הֶעֱטִיתָ
  choice: binalot mo
  rationale: Ang Hiphil ng עטה ay maaaring mangahulugang balutin, damtan, o takpan. Sa pagsama sa “kahihiyan,” malinaw at makata ang “binalot mo.”
- source_word: עָלָיו
  choice: siya
  rationale: Literal itong “sa ibabaw niya” o “sa kanya,” ngunit likas sa Tagalog na ilakip ang diwa nito sa pariralang “binalot mo siya ng kahihiyan.”
- source_word: בּוּשָׁה
  choice: kahihiyan
  rationale: Ang salita ay tumutukoy sa hiya, kahihiyan, o kasiraang-puri. Ang “kahihiyan” ay karaniwan, malinaw, at angkop sa marangal na tonong patula.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong gamit ng terminong panliturhiya o pangmusika, kaya pinanatili itong transliterasyon upang hindi ito bigyan ng labis na tiyak na pakahulugan.
theological_decisions:
- issue: Ang tinutukoy ng mga panlalaking panghalip sa “kanyang kabataan” at “siya”
  choice: Pinanatili ang panghalip na pangatlong panauhang isahan nang hindi tinutukoy kung sino siya.
  alternative: Tahasang tukuyin siya bilang haring mula kay David, ang dinastiya ni David, o ang personipikadong pinahiran.
  rationale: Itinuturo ng konteksto ang ipinahiyang pinahirang hari o dinastiya, ngunit hindi pinapangalanan ng talata ang tinutukoy. Pinananatili ng salin ang makata at teolohikal na puwang ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang paralelismong patula, ang panlalaking isahang reperente nang hindi ito tahasang kinilala, at ang hindi isinaling terminong “Selah.”
