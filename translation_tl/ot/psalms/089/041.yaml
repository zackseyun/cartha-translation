  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: tl
  text: Sinamsaman siya ng lahat ng dumaraan sa daan; naging tampulan siya ng paghamak ng kanyang mga kapitbahay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: Sinamsaman siya
  rationale: Ang pandiwa ay tumutukoy sa pagdarambong o sapilitang pagkuha ng ari-arian. Likas at kongkreto sa modernong Tagalog ang “sinamsaman,” at pinananatili nito ang ganap na kilos ng anyong Hebreo.
- source_word: כָּל
  choice: lahat ng
  rationale: Ipinahahayag nito ang saklaw na walang itinatangi at natural na inuugnay sa pariralang “dumaraan sa daan.”
- source_word: עֹבְרֵי דָרֶךְ
  choice: dumaraan sa daan
  rationale: Malapit ito sa literal na “mga dumaraan sa daan” at pinananatili ang larawan ng mga nagdaraan, nang hindi nililimitahan ang mga ito sa mga manlalakbay lamang.
- source_word: הָיָה
  choice: naging
  rationale: Ipinakikita ng “naging” ang kalagayang ibinunga ng naunang pagpapahiya, alinsunod sa gamit ng qatal sa konteksto.
- source_word: חֶרְפָּה
  choice: tampulan ng paghamak
  rationale: Ang חֶרְפָּה ay maaaring tumukoy sa kahihiyan, paghamak, o panunuya. Ang pariralang ito ay natural sa Tagalog at malinaw na nagpapahayag na siya ang pinagtutuunan ng paghamak.
- source_word: לִשְׁכֵנָיו
  choice: ng kanyang mga kapitbahay
  rationale: Ang שָׁכֵן ay taong naninirahan sa malapit. Sa pariralang Tagalog na “tampulan ... ng,” natural na ipinapahayag ng “ng kanyang mga kapitbahay” kung kanino nagmumula ang paghamak, bagaman ל ang pang-ukol sa Hebreo.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na ikatlong panauhang isahan
  choice: Panatilihin ang “siya/kanyang” nang hindi tahasang pinapangalanan ang tinutukoy.
  alternative: Tukuyin siya bilang haring mula kay David, ang pinahiran, o ang bayang kinakatawan ng hari.
  rationale: Sa agarang konteksto, malamang na ang pinahirang haring mula kay David ang nasa tanaw, ngunit mga hulaping panghalip lamang ang ginamit sa mismong talata. Hindi dapat lutasin sa salin ang sadyang hindi tinukoy ng talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikling paralelismong patula at ang kongkretong larawan ng pagdaan sa daan. Walang talababa sapagkat hindi kailangan upang maipakita ang isang mahalagang tekstuwal o leksikal na kalabuan.
