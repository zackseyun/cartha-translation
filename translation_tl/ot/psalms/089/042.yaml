  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: tl
  text: Itinaas mo ang kanang kamay ng kanyang mga kalaban[a]; pinagalak mo ang lahat ng kanyang mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Iniangat mo ang kanang kamay ng kanyang mga kalaban.”
    reason: Alternatibong leksikal na salin ng הֲרִימוֹתָ; maaaring ipahayag bilang “itinaas” o “iniangat.”
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: Itinaas mo
  rationale: Ang Hifil na ganap, ikalawang panauhang panlalaki na isahan, ng רום ay nagsasaad ng pagpapataas o pag-aangat. Pinananatili ng “itinaas mo” ang larawan ng Hebreo at ipinahihiwatig sa konteksto ang pagbibigay ng lakas o bentaha.
- source_word: יְמִין
  choice: ang kanang kamay
  rationale: Karaniwang tumutukoy ang ימין sa kanang kamay at madalas itong sagisag ng lakas o kapangyarihan. Pinananatili rito ang idyomang Hebreo.
- source_word: צָרָיו
  choice: ng kanyang mga kalaban
  rationale: Ang צָרָיו ay tumutukoy sa mga mapanlabang katunggali. Natural sa modernong Tagalog ang “mga kalaban” at naipakikita rin nito ang paggamit ng ibang salitang Hebreo kaysa sa אוֹיְבָיו sa ikalawang sugnay.
- source_word: הִשְׂמַחְתָּ
  choice: pinagalak mo
  rationale: 'Ang Hifil ng שׂמח ay may diwang sanhi: ang Diyos ang naging dahilan ng kanilang kagalakan. Maikli, malinaw, at marangal ang “pinagalak mo.”'
- source_word: כָּל
  choice: lahat ng
  rationale: Tuwirang ipinahahayag nito ang kabuuang saklaw ng pangmaramihang pangngalan.
- source_word: אוֹיְבָיו
  choice: kanyang mga kaaway
  rationale: Ang אוֹיְבָיו ay karaniwang salita para sa mga kaaway. Ang “mga kaaway” ang pinakadirekta at natural na salin, habang naiiba sa “mga kalaban” sa unang sugnay.
theological_decisions:
- issue: Tinutukoy ng mga hulaping ikatlong panauhang panlalaki na isahan
  choice: Isinalin bilang “kanyang,” na tumutukoy sa haring mula sa angkan ni David o sa pinahiran sa agarang konteksto ng awit.
  alternative: Gawing mas pangkalahatan ang salin nang hindi tinutukoy ang referent.
  rationale: Parehong ikatlong panauhang panlalaki na isahan ang mga hulapi. Ang panaghoy sa Awit 89 ay tungkol sa waring pagbaligtad ng Diyos sa mga pangako niya sa pinahirang hari mula kay David. Pinananatili ng “kanyang” ang gramatikal na pagtukoy nang hindi nilulutas ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyomang “kanang kamay” bilang sagisag ng lakas, at ginamit ang magkaibang “mga kalaban” at “mga kaaway” upang bahagyang masalamin ang dalawang magkalapit ngunit magkaibang salitang Hebreo.
