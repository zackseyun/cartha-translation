  text: A Maskil of Ethan the Ezrahite[a][b].
translation:
  language: tl
  text: Isang Maskil ni Etan na Ezrahita[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Maskil” ay isang terminong Hebreo sa pamagat ng ilang awit. Hindi tiyak ang eksaktong kahulugan nito; maaaring tumukoy ito sa isang awit na mapagnilay o nagtuturo.
    reason: lexical_alternative
  - marker: b
    text: O “na Zerahita,” kung ang pamagat ay tumutukoy sa pagiging inapo ni Zerah.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong Hebreo sa pamagat ng awit. Pinanatili ang transliterasyon upang huwag ipilit ang isang pinagtatalunang pakahulugan; ipinaliwanag ito sa talababa.
- source_word: לְ
  choice: ni
  rationale: Sa mga pamagat ng Awit, maaari itong magpahiwatig ng pag-akda, pag-uugnay, o pag-aalay. Likas at maikli sa Filipino ang “ni,” ngunit hindi nito kailangang lubusang tiyakin ang eksaktong uri ng kaugnayan.
- source_word: אֵיתָן
  choice: Etan
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Hebreo.
- source_word: הָאֶזְרָחִי
  choice: na Ezrahita
  rationale: Ipinapahayag nito ang angkan o pangkat na kinabibilangan ni Etan. Sinusunod ng “Ezrahita” ang anyong nasa tekstong Masoretiko; inilagay sa talababa ang posibleng “Zerahita.”
