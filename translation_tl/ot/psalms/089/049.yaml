id: PSA.89.49
reference: Psalms 89:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: tl
  text: Nasaan na, Panginoon, ang mga dati mong gawa ng tapat na pag-ibig[a], na ipinangako mo kay David nang may panunumpa sa iyong katapatan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ang dati mong mga awa” o “ang dati mong mga kagandahang-loob.” Maramihan ang anyong Hebreo: literal, “ang dati mong mga tapat na pag-ibig.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil sa iyong katapatan” o “nang may katapatan.” Maaaring ipahayag ng parirala ang paraan o ang batayan ng panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Nasaan na
  rationale: Ang tanong ay tungkol sa kinaroroonan o kasalukuyang kawalan ng mga dating gawa ng Diyos. Ipinahihiwatig ng “na” ang paghahanap sa mga dating hayag na pagpapakita ng pag-ibig sa gitna ng kasalukuyang paghihirap.
- source_word: חֲסָדֶיךָ הָרִאשֹׁנִים
  choice: ang mga dati mong gawa ng tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig, lalo na sa konteksto ng tipan. Dahil maramihan ang anyong Hebreo, ginamit ang “mga ... gawa” upang maging natural sa Tagalog at mapanatili ang diwa ng maraming dating pagpapakita nito.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang karaniwang marangal na salin ng titulong banal na אֲדֹנָי sa tuwirang pagtawag sa Diyos.
- source_word: נִשְׁבַּעְתָּ לְדָוִד
  choice: ipinangako mo kay David nang may panunumpa
  rationale: Malinaw na ipinahahayag ng pandiwang Hebreo ang isang panunumpa. Iniiwasan ng pariralang ito ang posibleng maling pakahulugan ng “isinumpa” sa modernong Tagalog bilang pagsumpa o paglapastangan.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: sa iyong katapatan
  rationale: Ang אֱמוּנָה ay katapatan, pagiging maaasahan, o katatagan. Pinananatili ng “sa iyong katapatan” ang posibilidad na ang katapatan ng Diyos ang paraan, kalagayan, o batayan ng kanyang panunumpa.
theological_decisions:
- issue: Pagpapahayag sa חֶסֶד sa konteksto ng tipan at panaghoy
  choice: tapat na pag-ibig
  alternative: awa; kagandahang-loob
  rationale: Binibigyang-diin ng konteksto ang matatag na katapatan ng Diyos sa kanyang tipan kay David. Ang “tapat na pag-ibig” ay sapat na malawak upang saklawin ang pag-ibig, kabutihan, at katapatan nang hindi nililimitahan ito sa damdamin lamang.
- issue: Pagpapanatili sa maramihang anyo ng חֲסָדֶיךָ
  choice: mga ... gawa ng tapat na pag-ibig
  alternative: tapat mong pag-ibig
  rationale: Ang maramihan ay maaaring tumukoy sa mga kongkretong pagpapakita ng tapat na pag-ibig. Ang “mga gawa” ay isang natural na paglilinaw sa Tagalog at hindi ginagawang isahan ang anyong Hebreo.
- issue: Ugnayan ng panunumpa at katapatan sa בֶּאֱמוּנָתֶךָ
  choice: sa iyong katapatan
  alternative: dahil sa iyong katapatan; nang may katapatan
  rationale: Hindi tiyak kung ang בְּ ay pangunahing nagpapahayag ng paraan, kalagayan, o batayan. Pinananatili ng pangunahing salin at talababa ang tunay na saklaw ng kahulugan sa halip na pumili nang tahasan ng iisang paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipinangako ... nang may panunumpa” upang maipahayag ang Hebreong pandiwa para sa panunumpa nang hindi magkaroon ng di-nais na kahulugan ang “isinumpa.”
