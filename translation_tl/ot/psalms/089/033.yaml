  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: tl
  text: Ngunit hindi ko aalisin sa kanya ang aking tapat na pag-ibig[a], ni magtataksil ako sa aking katapatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking matatag na pag-ibig” o “aking pag-ibig na tapat sa tipan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ni kikilos ako nang may kabulaanan tungkol sa aking katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Ngunit
  rationale: Sa konteksto, ipinakikita ng pang-ugnay ang pagsalungat sa naunang pahayag tungkol sa pagdidisiplina; kaya mas angkop ang “Ngunit” kaysa simpleng “At.”
- source_word: חַסְדִּי
  choice: aking tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at matapat na pag-ibig, lalo na sa ugnayang tipan. Ipinahahayag ng “tapat na pag-ibig” ang pagmamahal at pananatiling tapat nang hindi gumagamit ng makaluma o sektaryong pananalita.
- source_word: אָפִיר
  choice: hindi ko aalisin
  rationale: Ang Hiphil ng פור dito ay nagpapahiwatig ng pag-aalis o pagbawi ng isang bagay mula sa isang tao. Natural sa Filipino ang “aalisin sa kanya” at malinaw nitong ipinahahayag ang hindi pagbawi ng pag-ibig.
- source_word: מֵעִמּוֹ
  choice: sa kanya
  rationale: Kasama ng pandiwang “aalisin,” likas na ipinahahayag ng “sa kanya” ang paghihiwalay o pagbawi mula sa taong tinutukoy.
- source_word: אֲשַׁקֵּר
  choice: kikilos man ako nang may kabulaanan
  rationale: Ang Piel ng שׁקר ay maaaring tumukoy sa pagkilos nang hindi totoo o mapanlinlang, hindi lamang sa pagsasabi ng kasinungalingan. Pinananatili ng salin ang lawak ng kilos habang iniiwasang palitan ito ng konseptong “sirain.”
- source_word: בֶּאֱמוּנָתִי
  choice: sa aking katapatan
  rationale: Ang אֱמוּנָה rito ay katapatan o pagiging maaasahan. Ang “sa aking katapatan” ay nagpapanatili sa medyo idyomatikong ugnayan ng pang-ukol at hindi tahasang nilulutas ang posibleng diwa bilang pagiging bulaan hinggil sa sariling katapatan.
theological_decisions:
- issue: Wika tungkol sa katapatan ng Diyos sa tipan kaugnay ng haring mula kay David
  choice: Gamitin ang “tapat na pag-ibig” at “katapatan,” habang panatilihin ang kaibahan ng pagdidisiplina at hindi pagbawi ng tipang pag-ibig.
  alternative: Gamitin ang “awa” at “katotohanan” sa mas tradisyonal na estilo.
  rationale: Binibigyang-diin ng talata na hindi pinawawalang-bisa ng pagdidisiplina ang matatag na katapatan ng Diyos. Iniiwasan ng salin ang pagpasok ng mga kategoryang teolohikal na wala mismo sa teksto.
- issue: Ugnayan ng pagkilos nang bulaan at ng katapatan ng Diyos
  choice: Isalin bilang “kikilos ... nang may kabulaanan sa aking katapatan,” na pinananatili ang di-karaniwang tensiyon ng Hebreo.
  alternative: “Magiging di-tapat ako sa aking katapatan” o “sisira ako sa aking katapatan.”
  rationale: Hindi nililimitahan ng napiling anyo ang שׁקר sa pasalitang pagsisinungaling at hindi rin nito ginagawang “pagsira” ang pandiwa. Pinananatili nito ang pahayag na ang Diyos ay hindi kikilos nang salungat o bulaan hinggil sa kanyang sariling katapatan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang tuwirang “aalisin sa kanya” at ang pamilyar na “tapat na pag-ibig”; bahagyang pormal ang “kabulaanan” upang maipahayag ang mas malawak na diwa ng huwad o mapanlinlang na pagkilos nang hindi ito nililimitahan sa berbal na pagsisinungaling.
