base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: tl
  text: 'Yahweh, Diyos ng mga hukbo,


    sino ang makapangyarihan gaya mo, Yah[a]?


    Ang katapatan mo ay nakapalibot sa iyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yah” ay maikling anyo ng pangalang “Yahweh.” Maraming salin ang isinasalin ito bilang “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Diyos ng mga hukbo
  rationale: Tuwirang inilalarawan ng pariralang konstrukto ang Diyos bilang Diyos ng mga hukbo; hindi nilimitahan kung panlupa o makalangit ang tinutukoy.
- source_word: מִי כָמוֹךָ
  choice: sino ang tulad mo
  rationale: Pinananatili ang payak at mariing retorikal na tanong tungkol sa kawalang-kapantay ng Diyos.
- source_word: חֲסִין
  choice: makapangyarihan
  rationale: Ipinahahayag ang lakas o kapangyarihan sa natural at marangal na modernong Tagalog.
- source_word: יָהּ
  choice: Yah
  rationale: Pinanatili ang maikling anyo ng banal na pangalan at ang pagkakaiba nito sa יְהוָה na nauna sa talata.
- source_word: וֶאֱמוּנָתְךָ
  choice: Ang katapatan mo
  rationale: Ang אֱמוּנָה rito ay tumutukoy sa pagiging maaasahan at tapat ng Diyos; ginawang hiwalay na sugnay para sa natural na daloy sa Tagalog.
- source_word: סְבִיבוֹתֶיךָ
  choice: ay nakapalibot sa iyo
  rationale: Isinasalin ang lokatibong diwa na “sa buong paligid mo” habang pinananatili ang larawang pumapalibot ang katapatan sa Diyos.
theological_decisions:
- issue: Pagkakaiba ng יְהוָה at ng maikling anyong יָהּ sa iisang talata
  choice: Isalin bilang “Yahweh” at “Yah” ayon sa pagkakasunod
  alternative: Gawing “PANGINOON” ang dalawa, o gawing “Yahweh” ang dalawa
  rationale: Pinananatili nito ang dalawang magkaibang anyo ng banal na pangalan na sadyang makikita sa tekstong Hebreo.
- issue: Ugnayang sintaktiko ng חֲסִין at יָהּ
  choice: “makapangyarihang Yah” bilang tuwirang pagtawag
  alternative: “sino ang makapangyarihang tulad mo, O Yah?”
  rationale: Maaaring unawain ang masinsing pariralang Hebreo bilang epiteto sa banal na pangalan o bilang bahagi ng tanong. Pinili sa pangunahing teksto ang natural na bokatibong epiteto at itinala ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino, na may maikling mga linyang patula. Iniwasan ang lipas na bokatibong “O” sa pangunahing teksto; pinanatili ang mga banal na pangalang “Yahweh” at “Yah.”
