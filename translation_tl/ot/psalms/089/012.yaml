  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: tl
  text: 'Ang hilaga at ang timog—ikaw ang lumikha sa mga ito.[a]


    Ang Tabor at Hermon ay umaawit nang may galak sa iyong pangalan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang hilaga at ang kanang panig—ikaw ang lumikha sa mga ito.” Malamang na heograpikong idyoma rito ang “kanang panig” para sa “timog.”
    reason: lexical_alternative
  - marker: b
    text: O “sumisigaw nang may galak sa iyong pangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: ang hilaga
  rationale: Karaniwang tumutukoy sa hilaga o hilagang rehiyon; katambal ng יָמִין bilang magkasalungat na direksiyon na sumasaklaw sa kabuuan.
- source_word: יָמִין
  choice: ang timog
  rationale: Literal na 'kanang kamay/kanang panig,' ngunit bilang heograpikong idyoma, kapag nakatambal sa 'hilaga,' tumutukoy ito sa timog.
- source_word: בְרָאתָם
  choice: ikaw ang lumikha sa mga ito
  rationale: Qal perfect, ikalawang panauhang panlalaki na isahan, na may ikatlong panauhang pangmaramihang hulapi; malinaw at natural itong nagpapahayag ng paglikha ng Diyos.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Pangalan ng pook/bundok; tinumbasan sa kinagawiang anyong Tagalog.
- source_word: חֶרְמוֹן
  choice: Hermon
  rationale: Pangalan ng pook/bundok; tinumbasan sa kinagawiang anyong Tagalog.
- source_word: בְּשִׁמְךָ
  choice: dahil sa iyong pangalan
  rationale: Maaaring ipahayag ng בְּ ang saklaw, batayan, o dahilan. Ang 'dahil sa iyong pangalan' ay natural sa Tagalog at pinananatili ang diwang ang galak ay tugon sa pagkakakilanlan at karangalan ng Diyos.
- source_word: יְרַנֵּנוּ
  choice: umaawit sa galak
  rationale: Ang Piel ng רנן ay tumutukoy sa umaalingawngaw na sigaw o awit ng galak. Ang 'umaawit sa galak' ay angkop sa personipikasyon ng mga bundok, habang nananatiling posible ang 'sumisigaw sa galak.'
theological_decisions:
- issue: Kahulugan ng יָמִין kapag katambal ng צָפוֹן
  choice: 'Heograpikong tambalan: ''ang hilaga at ang timog'''
  alternative: 'Literal na katawagan: ''ang hilaga at ang kanang panig'''
  rationale: Ipinagdiriwang ng talata ang paglikha ng Diyos sa malawak na saklaw. Ang heograpikong pagbasa ay nagpapanatili sa poetikong tambalan at iniiwasang ikubli ng sobrang literal na salin ang kahulugan.
- issue: Personipikasyon ng Tabor at Hermon
  choice: Ang mga bundok mismo ay poetikong inilalarawang umaawit sa galak
  alternative: Ang mga naninirahan sa mga lugar na iyon ang umaawit sa galak
  rationale: Karaniwan sa mga Awit ang personipikasyon ng sangnilikha sa pagpupuri. Pinananatili ng salin ang larawang iyon sa halip na gawing tuwirang paliwanag tungkol sa mga tao.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang poetikong personipikasyon at ang paghinto sa unang taludtod sa pamamagitan ng em dash. Ang mga pangalang Tabor at Hermon ay nasa karaniwang anyong ginagamit sa Filipino.
