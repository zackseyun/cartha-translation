base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: tl
  text: Patatatagin ko ang iyong lahi magpakailanman[a], at itatayo ko ang iyong trono sa sali't salinlahi. Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong binhi”; ang isahang salita sa Hebreo ay maaaring gamitin bilang kolektibong tawag sa mga inapo.
    reason: lexical_alternative
  - marker: b
    text: Ang “Selah” ay malamang na isang tanda sa musika o pagsamba; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Likas at marangal na katumbas sa Filipino para sa patuloy at walang takdang panahong ipinahihiwatig ng parirala.
- source_word: אָכִין
  choice: Patatatagin ko
  rationale: Ang Hiphil ng כון ay nangangahulugang gawing matatag o matibay; pinananatili ng “patatatagin” ang diwa ng pagpapatibay sa konteksto ng tipan at paghahari.
- source_word: זַרְעֶךָ
  choice: ang iyong lahi
  rationale: Maaaring kolektibong tumukoy ang isahang זֶרַע sa mga inapo. Natural sa modernong Filipino ang “lahi” at hindi nito nililimitahan ang pangako sa iisang agarang anak.
- source_word: וּבָנִיתִי
  choice: at itatayo ko
  rationale: Bagaman anyong perfect ang pandiwa, futurum ang gamit nito kasabay ng naunang imperfect. Pinananatili ng “itatayo” ang metaporang panggusali na inilalapat sa trono.
- source_word: לְדֹר וָדֹר
  choice: sa sali't salinlahi
  rationale: Karaniwang idyomang Filipino ito para sa sunod-sunod na mga salinlahi at maayos na naghahatid ng paulit-ulit na puwersa ng Hebreong parirala.
- source_word: כִּסְאֲךָ
  choice: ang iyong trono
  rationale: Tuwirang katumbas sa kontekstong maharlika; ipinahihiwatig nito ang patuloy na paghahari ng dinastiya, hindi lamang isang pisikal na upuan.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng termino, kaya pinakamalinaw at hindi mapanghimasok sa pagpapakahulugan ang transliterasyon.
theological_decisions:
- issue: Pangako tungkol sa dinastiya sa konteksto ng tipan sa hari
  choice: Panatilihin ang tuwirang pagtukoy sa “iyong lahi” at “iyong trono” nang hindi ginagawang tahasan sa talata ang kalaunang katuparang mesiyaniko.
  alternative: Tahasan ang mesiyanikong katuparan, o gawing pangkalahatang pangako lamang tungkol sa mga inapo.
  rationale: Maharlika at dinastiko ang mismong pananalita ng Hebreo. Pinananatili nito ang historikal at kanonikal na tensiyon nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi sa talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tradisyonal ngunit buhay na idyomang “sali't salinlahi”; pinanatili ang “Selah” upang hindi lutasin ang tunay na kawalang-katiyakan ng termino.
