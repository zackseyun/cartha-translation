  source_fidelity: 'Tapat ang salin sa Hebreo: ang אָכִין ay naihayag bilang pangakong magtatatag, ang זַרְעֶךָ bilang kolektibong “iyong lahi,” at ang וּבָנִיתִי ay pinanatiling metaporang panggusali sa “itatayo ko.” Ang “magpakailanman” at “sali''t salinlahi” ay maayos na tumutugon sa dalawang panandang pangtagal. Nananatiling tuwirang kausap ang hari, gaya ng pinagmulan.'
