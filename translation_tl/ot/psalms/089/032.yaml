  text: וּ/פָקַדְתִּ֣י בְ/שֵׁ֣בֶט פִּשְׁעָ֑/ם וּ/בִ/נְגָעִ֥ים עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: tl
  text: Kung magkagayon, parurusahan ko ng pamalo ang kanilang pagsuway[a], at ng mga hampas ang kanilang kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dadalawin ko ng pamalo ang kanilang pagsuway.” Ang pandiwang Hebreo ay maaaring mangahulugang “dalawin” sa diwang pagtuunan ng pansin o parusahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Kung magkagayon, parurusahan ko
  rationale: Sa konteksto ng pagdidisiplina, ang פקד ay may diwang pagpaparusa. Ipinahihiwatig ng “Kung magkagayon” ang kasunod na bunga ng kondisyong nasa naunang talata, samantalang pinananatili ng “parurusahan” ang tahasang bigat ng pahayag.
- source_word: בְשֵׁבֶט
  choice: ng pamalo
  rationale: Ang שֵׁבֶט ay maaaring pamalo, tungkod, o setro. Dito, kasangkapan ito ng pagdidisiplina, kaya natural at angkop ang “pamalo.”
- source_word: פִּשְׁעָם
  choice: ang kanilang pagsuway
  rationale: Ang פֶּשַׁע ay paglabag o paghihimagsik. Ang “pagsuway” ay malinaw sa modernong Tagalog at hindi labis na nililimitahan ang kahulugan sa politikal na paghihimagsik.
- source_word: וּבִנְגָעִים
  choice: at ng mga hampas
  rationale: Ang נֶגַע ay maaaring salot, dagok, kapighatian, o hampas. Dahil kahanay ito ng “pamalo,” ang “mga hampas” ang pinakanatural na larawan ng ipinataw na disiplina nang hindi ito nililimitahan sa sakit.
- source_word: עֲוֹנָם
  choice: ang kanilang kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala, pananagutan, o bunga ng kasalanan. Ang “kasamaan” ay nagpapanatili sa moral na bigat at maayos na kaagapay ng “pagsuway.”
theological_decisions:
- issue: Likas ng tugon ng Diyos sa kasalanan ng mga kabilang sa tipan
  choice: Inilalarawan ang tunay na pagpaparusa at pagdidisiplina sa pamamagitan ng konkretong larawan ng pamalo at mga hampas.
  alternative: Palambutin ang pahayag bilang simpleng pagdalaw o pagtutuwid.
  rationale: Ang agarang Hebreong teksto ay gumagamit ng mga larawan ng pagpaparusa, kaya hindi ito dapat gawing malabo. Gayunman, hindi rin idinaragdag sa talata ang anumang konklusyon tungkol sa ganap o pangwakas na pagtatakwil.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinili ang “pamalo,” “pagsuway,” “mga hampas,” at “kasamaan” bilang natural na mga salitang nagpapanatili sa paralelismo at bigat ng tulang Hebreo.
