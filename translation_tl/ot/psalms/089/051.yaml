base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: tl
  text: na siyang nilait ng iyong mga kaaway, O Yahweh—nilait nila ang mga yapak ng iyong pinahiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga yapak” ay maaari ring isaling “mga sakong,” “mga hakbang,” o “mga bakas.” Maaaring metaporikong tumukoy ito sa mga kilos, paglakad, o pagdating ng iyong pinahiran. Ang “iyong pinahiran” (מְשִׁיחֶךָ) ay maaari ring isaling “iyong Mesiyas”; sa konteksto, malamang na tumutukoy ito sa haring Davidiko, bagaman may mesiyanikong alingawngaw din ang salita.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: חֵרְפוּ
  choice: ipinantutuya
  rationale: Ipinahahayag nito ang mapanlait at mapanghamak na panunuya ng pandiwa, at natural ito sa makabagong Filipino. Ang pag-uulit sa Hebreo ay pinanatili.
- source_word: אוֹיְבֶיךָ
  choice: iyong mga kaaway
  rationale: Tuwirang salin ng pangngalan na may hulaping tumutukoy sa ikalawang panauhang panlalaki na isahan.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong Yahweh; ipinahahayag ng “O” ang tuwirang pagtawag.
- source_word: אֲשֶׁר
  choice: na siyang / ipinantutuya nila
  rationale: Ang unang אֲשֶׁר ay iniuugnay sa naunang nilalaman ng panunuya; sa ikalawang paglitaw, natural na ipinahahayag sa Filipino sa pag-uulit ng pandiwa.
- source_word: עִקְּבוֹת
  choice: mga yapak
  rationale: Pinananatili ang kongkretong larawan ng mga bakas o hakbang ng paa, na maaaring tumukoy sa mga pagkilos o pagdating ng pinahiran.
- source_word: מְשִׁיחֶךָ
  choice: iyong pinahiran
  rationale: Tumutukoy sa taong pinahiran ng Yahweh, malamang sa haring mula sa angkan ni David sa agarang konteksto, nang hindi agad ginagawang pantanging titulong “Mesiyas.”
theological_decisions:
- issue: Ang kahulugan ng מְשִׁיחֶךָ sa isang maharlikang awit na may mesiyanikong alingawngaw
  choice: iyong pinahiran
  alternative: iyong Mesiyas
  rationale: Sa agarang konteksto, ang tinutukoy ay malamang ang pinahirang haring Davidiko. Gayunman, iisang salitang Hebreo rin ito na pinagmulan ng titulong “Mesiyas,” kaya pinananatili sa talababa ang lehitimong mesiyanikong pagbasa.
- issue: Ang metaporikong tinutukoy ng עִקְּבוֹת
  choice: mga yapak
  alternative: mga sakong; mga hakbang; mga bakas
  rationale: Hindi nilulutas ng teksto kung ang larawan ay tumutukoy sa pagdating, paglakad, mga kilos, o mga bakas ng pinahiran; kaya pinananatili ang kongkretong larawan at inilalahad ang saklaw sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ipinantutuya” upang maging natural at mapanatili ang mapanlait na puwersa ng Hebreo; pinanatili rin ang pag-uulit at ang larawan ng “mga yapak.”
