  text: 'Minsan akong nanumpa sa aking kabanalan[a]: Hindi ako magsisinungaling kay David.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Minsan at magpakailanman akong nanumpa sa aking kabanalan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “kung magsisinungaling ako kay David,” isang pormula ng panunumpa na nangangahulugang “hindi ako magsisinungaling kay David” o “tiyak na hindi ako magiging di-tapat kay David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Minsan
  rationale: 'Ginamit bilang pang-abay sa konteksto ng panunumpa: isang minsanan at tiyak na panunumpa, hindi lamang ang bilang na “isa.”'
- source_word: נִשְׁבַּעְתִּי
  choice: akong sumumpa
  rationale: Ang Niphal ng שׁבע ay nangangahulugang manumpa. Natural sa Filipino ang aspektong perpektibo upang tukuyin ang natapos na panunumpang nananatiling may bisa.
- source_word: בְּקָדְשִׁי
  choice: sa pamamagitan ng aking kabanalan
  rationale: Ang בְּ ay nagpapahayag ng batayan o garantiyang tinatawag sa panunumpa, at ang קֹדֶשׁ na may hulaping unang panauhan ay “aking kabanalan.”
- source_word: אִם
  choice: Hindi ako
  rationale: 'Sa kasunod ng panunumpa, ang אִם ay bahagi ng pinaikling pormula ng sumpa na literal na “kung…,” ngunit ang kahulugan ay mariing pagtanggi: “hindi nga ako…”'
- source_word: לְדָוִד
  choice: kay David
  rationale: Ang לְ ay tumutukoy sa taong pinatutungkulan ng posibleng kasinungalingan; “kay David” ang natural na anyo sa Filipino.
- source_word: אֲכַזֵּב
  choice: magsisinungaling
  rationale: Ang Piel ng כזב ay maaaring mangahulugang magsinungaling o maging di-tapat sa isang pangako. Pinananatili ng “magsisinungaling” ang tuwiran at personal na lakas ng salita.
theological_decisions:
- issue: Paglalahad ng pinaikling Hebreong pormula ng panunumpa
  choice: Hindi ako magsisinungaling kay David.
  alternative: Kung magsisinungaling ako kay David…
  rationale: Ipinahihiwatig ng Hebreong אִם pagkatapos ng panunumpa ang sumpang kalakip ng isang imposibleng kondisyon. Ginawang tahasan ang ipinahihiwatig na pagtanggi upang maging buo at natural sa Filipino, nang hindi dinaragdagan ang teolohikal na nilalaman.
- issue: Ang batayan ng banal na panunumpa
  choice: sa pamamagitan ng aking kabanalan
  alternative: sa aking banal na dako
  rationale: Pinakamalamang na ang Diyos ay nanunumpa sa sarili niyang kabanalan. Hindi pinalawak ang parirala tungo sa paliwanag tungkol sa tipan o sa banal na katangian ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding personal na wika ng banal na panunumpa at ipinaliwanag sa talababa ang idyomatikong Hebreong pormula.
