  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: tl
  text: Alalahanin mo kung gaano kaikli ang buhay ko! Para sa anong kawalang-kabuluhan mo nilikha ang lahat ng anak ng tao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “buong sangkatauhan” o “lahat ng tao.” Literal sa Hebreo: “lahat ng anak ng tao.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “Sa kawalang-kabuluhan mo nilikha ang lahat ng anak ng tao.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: זְכָר
  choice: Alalahanin mo
  rationale: Ang pautos na pandiwang isahan ay tuwirang pakiusap sa Diyos; natural at malinaw ito sa makabagong Tagalog.
- source_word: אֲנִי מֶה חָלֶד
  choice: kung gaano kaikli ang buhay ko
  rationale: Bagaman literal na may anyong “ako” at “ano ang haba ng buhay,” ipinahihiwatig ng panaghoy ang ikli at paglipas ng buhay. Pinananatili ng salin ang unang panauhan at ang padamdam na diin.
- source_word: עַל מַה
  choice: Para sa anong
  rationale: Pinananatili nito ang tanong tungkol sa layunin o hantungan, sa halip na gawing payak na “bakit.”
- source_word: שָּׁוְא
  choice: kawalang-kabuluhan
  rationale: Saklaw nito ang diwa ng kahungkagan at pagkawalang-saysay, at angkop sa marangal na pananalita ng awit.
- source_word: בָּרָאתָ
  choice: mo nilikha
  rationale: Tuwirang kinikilala ang Diyos bilang ikalawang panauhang gumagawa; natural sa Tagalog ang aspektong perpektibo rito.
- source_word: כָל בְּנֵי אָדָם
  choice: lahat ng anak ng tao
  rationale: Malapit ito sa Hebreong idyomang “lahat ng mga anak ng tao,” habang nauunawaan sa konteksto bilang pangkalahatang pagtukoy sa sangkatauhan.
theological_decisions:
- issue: Pangkalahatang pagtukoy sa tao sa בְּנֵי אָדָם
  choice: lahat ng anak ng tao
  alternative: buong sangkatauhan / lahat ng tao
  rationale: Pinananatili sa pangunahing teksto ang larawang Hebreo nang hindi nililimitahan ang saklaw sa mga lalaki lamang; inilalagay sa talababa ang mas tahasang pangkalahatang katumbas.
- issue: Tanong o pahayag sa עַל מַה שָּׁוְא
  choice: Para sa anong kawalang-kabuluhan mo nilikha…?
  alternative: Sa kawalang-kabuluhan mo nilikha…
  rationale: Ang עַל מַה ay pinakamalinaw na nauunawaan bilang retorikal na tanong tungkol sa layunin, ngunit ang mas pahayag na pagkakabuo ay itinatala bilang posibleng pagbasa upang hindi itago ang anyong patula.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Ginamit ang “kawalang-kabuluhan” upang mapanatili ang bigat ng panaghoy, at ang retorikal na tanong upang malinaw na maipahayag ang tensiyon ng talata nang hindi ito nilulutas.
