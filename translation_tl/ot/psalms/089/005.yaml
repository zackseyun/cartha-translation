  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: tl
  text: Ipupuri ng kalangitan ang mga kababalaghan mo, Yahweh—maging ang katapatan mo sa kapulungan ng mga banal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga banal na nilalang”; sa konteksto, malamang na tumutukoy ito sa mga nilalang sa langit.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: Pupurihin
  rationale: Ang Hiphil ng ידה ay maaaring mangahulugang magpuri o magpasalamat. Dahil ang mga kababalaghan ng Diyos ang tuwirang layon sa makatang pahayag, natural dito ang “pupurihin.” Pinananatili rin ng anyong panghinaharap ang diwa ng Hebreong imperfect.
- source_word: שָׁמַיִם
  choice: ng kalangitan
  rationale: Ang “kalangitan” ay natural at marangal na katumbas ng Hebreong pangmaramihang שָׁמַיִם, at higit na angkop sa tula kaysa “mga langit” o “himpapawid.”
- source_word: פִּלְאֲךָ
  choice: ang mga kababalaghan mo
  rationale: Ang פלא ay tumutukoy sa bagay o gawang kahanga-hanga at pambihira. Ipinahahayag ng “mga kababalaghan” ang kolektibong diwa ng mga kamangha-manghang gawa ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אַף
  choice: gayundin
  rationale: Dito, ang אַף ay nagdaragdag at nagbibigay-diin sa ikalawang parirala. Malinaw at natural itong naipahahayag ng “gayundin.”
- source_word: אֱמוּנָתְךָ
  choice: ang katapatan mo
  rationale: Sa kontekstong ito, ang אֱמוּנָה ay tumutukoy sa pagiging maaasahan at tapat ng Diyos; tuwirang naihahatid iyon ng “katapatan.”
- source_word: בִּקְהַל
  choice: sa kapulungan ng
  rationale: Ang קהל ay isang nagkakatipong pangkat o kapulungan. Pinananatili ng “sa kapulungan ng” ang kongkretong larawan ng isang pagtitipon.
- source_word: קְדֹשִׁים
  choice: mga banal
  rationale: Maaaring tumukoy ang קְדֹשִׁים sa mga banal na nilalang o sa mga taong ibinukod bilang banal. Pinananatili ng “mga banal” ang lawak ng salita, habang ipinahihiwatig ng konteksto ng makalangit na kapulungan na malamang na mga nilalang sa langit ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng קְדֹשִׁים (“mga banal”)
  choice: Isinalin nang hindi labis na tinutukoy bilang “mga banal,” na sa konteksto ay malamang na mga nilalang sa langit.
  alternative: “mga anghel” o “mga banal na tao”
  rationale: Binibigyang-diin ng kalapit na konteksto sa Awit 89 ang kalangitan at makalangit na kapulungan, kaya malamang na mga nilalang sa langit ang tinutukoy. Gayunman, hindi tahasang nangangahulugang “mga anghel” ang salitang Hebreo, kaya pinanatili ang tunay na lawak at tensiyon nito.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang natural na ayos na pandiwa muna at pinanatili ang pag-uulit ng ikalawang panauhan (“mo”) upang malinaw na kapwa ang mga kababalaghan at katapatan ni Yahweh ang pinupuri. Inilagay ang talababa sa “mga banal,” ang salitang aktuwal na nangangailangan ng paliwanag.
