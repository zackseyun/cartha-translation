  text: Sapagkat sino sa kalangitan ang maihahambing sa PANGINOON? Sino sa mga anak ng Diyos ang tulad ng PANGINOON?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa mga nilalang sa langit,” “sa mga nilalang na banal,” o “sa mga anak ng mga makapangyarihan.” Literal sa Hebreo: “sa mga anak ng Diyos/mga diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pagpupuri at likas na nagdurugtong sa retorikal na tanong.
- source_word: בַשַּׁחַק
  choice: sa kalangitan
  rationale: Ang שׁחק ay maaaring tumukoy sa langit, himpapawid, o mga ulap; pinananatili ng “kalangitan” ang makalangit na tagpuan nang hindi labis na nililimitahan ang kahulugan.
- source_word: יַעֲרֹךְ
  choice: maihahambing
  rationale: Sa kontekstong ito, ang ערך ay may diwang pagtabihin upang paghambingin; malinaw at natural sa Filipino ang “maihahambing.”
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginamit ang tradisyonal na pamalit na “PANGINOON” para sa banal na pangalang יהוה.
- source_word: יִדְמֶה
  choice: ang tulad
  rationale: Pinananatili ang payak na diwa ng pagkakatulad at ang paralelismo ng dalawang tanong.
- source_word: בִּבְנֵי אֵלִים
  choice: sa mga anak ng Diyos
  rationale: Malapit ito sa literal na larawang Hebreo at hindi nito pinapawi ang posibleng pagtukoy sa mga makalangit na nilalang; inilalahad sa talababa ang ibang maaaring salin.
theological_decisions:
- issue: Pagsasalin ng יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Sinusunod ang nakaugaliang magalang na pagpapalit sa banal na pangalan habang ipinakikita sa malalaking titik na יהוה ang pinagmulan.
- issue: Pagpapakahulugan sa בִּבְנֵי אֵלִים
  choice: mga anak ng Diyos
  alternative: mga nilalang sa langit; mga makadiyos na nilalang; mga anak ng mga makapangyarihan
  rationale: Pinananatili ng pangunahing salin ang talinghaga at tunay na kalabuan ng Hebreo sa halip na agad tukuyin ang eksaktong uri ng mga nilalang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kalangitan” para sa makalangit na tagpuan at pinanatili ang “mga anak ng Diyos” upang huwag pataagin ang sadyang malawak na pahiwatig ng Hebreo.
