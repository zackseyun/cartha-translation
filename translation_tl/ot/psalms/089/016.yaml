  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: tl
  text: 'Sa iyong pangalan ay nagagalak sila buong araw,

    at sa iyong katuwiran ay itinataas sila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa iyong katarungan ay itinataas sila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: Sa iyong pangalan
  rationale: Likas na ipinapahayag sa Filipino ang saklaw o batayan ng kanilang kagalakan; ang “pangalan” ay tumutukoy rin sa nahayag na pagkatao at reputasyon ng Diyos.
- source_word: יְגִילוּן
  choice: nagagalak sila
  rationale: Pinananatili nito ang diwa ng masiglang kagalakan ng גיל sa malinaw at dignidad na makabagong Tagalog.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Natural na katumbas ito ng idyomang Hebreo na nagsasaad ng patuloy na tagal sa maghapon.
- source_word: וּבְצִדְקָתְךָ
  choice: at sa iyong katuwiran
  rationale: Saklaw ng צְדָקָה ang katuwiran at katarungan. Ang “katuwiran” ang mas malawak na termino sa konteksto ng pagpupuri, habang pinananatili sa talababa ang “katarungan.”
- source_word: יָרוּמוּ
  choice: itinataas sila
  rationale: Ipinahihiwatig ng רום na sila ay itinataas o dinadakila; malinaw na naihahayag ng anyong ito na ang katuwiran ng Diyos ang batayan o sanhi, hindi ang sariling pagpapataas nila.
theological_decisions:
- issue: Kahulugan ng katuwiran ng Diyos sa konteksto ng pagpupuri
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring tumukoy ang צְדָקָה kapuwa sa matuwid na likas at sa makatarungang pagkilos. Mas malawak dito ang “katuwiran,” ngunit tunay na posibilidad ang “katarungan” at kaya'y pinanatili sa talababa.
- issue: Paraan ng pagkakaugnay ng katuwiran ng Diyos sa kanilang pagtaas
  choice: sa iyong katuwiran ay itinataas sila
  alternative: dahil sa iyong katuwiran ay itinataas sila
  rationale: Pinananatili ng “sa” ang lawak ng Hebreong בְּ at hindi tiyakang nilulutas kung ito ay saklaw, batayan, o sanhi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagagalak” sa halip na mas arkaikong pananalita, at pinanatili ang paralelismo ng dalawang linya.
