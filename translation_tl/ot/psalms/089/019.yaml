base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: tl
  text: Noon ay nagsalita ka sa isang pangitain sa iyong mga tapat[a] at sinabi mo, “Ipinagkaloob ko ang tulong sa isang makapangyarihang tao[b]; itinaas ko ang isang hinirang[c] mula sa bayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ayon sa ibang pagbasa na masasalamin sa ilang salin: “sa iyong tapat.”'
    reason: textual_variant
  - marker: b
    text: 'Ang “makapangyarihang tao” ay maaari ring isaling “mandirigma” o “bayani.” Mas literal ang parirala: “inilagay ko ang tulong sa isang makapangyarihang tao.”'
    reason: lexical_alternative
  - marker: c
    text: Ang salitang isinaling “hinirang” ay maaari ring mangahulugang “binata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Noon
  rationale: Likas na panandang temporal sa makatang pagsasalaysay at tumutukoy sa naunang pagkilos ng Diyos.
- source_word: דִּבַּרְתָּ
  choice: nagsalita ka
  rationale: Pinananatili ang pagkakaiba nito sa kasunod na וַתֹּאמֶר, na isinaling “sinabi.”
- source_word: בְחָזוֹן
  choice: sa isang pangitain
  rationale: Ipinapahayag ang paraan o tagpuan ng paghahayag nang malinaw at natural sa modernong Tagalog.
- source_word: לַחֲסִידֶיךָ
  choice: sa iyong mga tapat
  rationale: Sinusunod ang anyong maramihan sa ibinigay na WLC at inilalarawan ang mga taong may katapatan sa Diyos nang hindi nag-aangkat ng mas huling katawagang panrelihiyon.
- source_word: וַתֹּאמֶר
  choice: at sinabi
  rationale: Natural na pagpapatuloy ng pagsasalita; hindi na kailangang ulitin ang panghalip na “mo” dahil malinaw ang simuno.
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: Ipinagkaloob ko ang tulong sa
  rationale: Natural na Tagalog para sa paglalagay o pagkakaloob ng tulong sa isang tao, habang pinananatili ang “tulong” bilang tuwirang diwa ng עֵזֶר.
- source_word: גִּבּוֹר
  choice: isang makapangyarihan
  rationale: Pinananatili ang malawak na diwa ng isang malakas o makapangyarihang tao nang hindi ito nililimitahan sa pagiging mandirigma.
- source_word: הֲרִימוֹתִי
  choice: itinaas ko
  rationale: Tuwirang inilalarawan ang pagtataas o pagbibigay ng mataas na katayuan sa kontekstong maharlika.
- source_word: בָחוּר
  choice: isang hinirang
  rationale: Bagaman maaari itong mangahulugang “binata,” ang diwa ng pagpili ang higit na angkop sa paralelismo at sa pagpili kay David sa konteksto.
- source_word: מֵעָם
  choice: mula sa bayan
  rationale: Malinaw na ipinahahayag ang pinagmulan ng hinirang mula sa kabuuan ng bayan.
theological_decisions:
- issue: Ang tinutukoy ng talata sa konteksto ng tipan kay David
  choice: Nanatili ang salin sa agarang pagtukoy kay David nang hindi tahasang dinaragdagan ng mesiyanikong pagpapakahulugan.
  alternative: Gawing tahasan sa salin ang tipolohikal o mesiyanikong pagtukoy lampas kay David.
  rationale: Ang talata mismo ay nagsasalaysay ng pagpili at pagtataas ng Diyos kay David. Maaaring makita ng mga mambabasa ang mas malawak na tipolohikal na katuparan, ngunit hindi iyon dapat idagdag sa mismong salin.
- issue: Bilang ng לַחֲסִידֶיךָ
  choice: Maramihang “sa iyong mga tapat,” ayon sa ibinigay na tekstong WLC.
  alternative: Isahang “sa iyong tapat,” ayon sa ibang pagbasa na masasalamin sa ilang salin.
  rationale: Ang ibinigay na anyo ay maramihan; pinananatili sa talababa ang ibang pagbasa sa halip na tahimik itong ipalit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang paralelismong patula ng dalawang pahayag ng Diyos, ngunit iniwasan ang salitang-salitang pariralang hindi natural sa Tagalog.
