  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: tl
  text: 'Ang katuwiran at katarungan ang saligan ng iyong trono;

    ang tapat na pag-ibig at katapatan ay nauuna sa iyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iyong mukha”; maaari ring unawain na “iyong presensiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Pinananatili ng “katuwiran” ang diwa ng moral na pagiging matuwid at inihihiwalay ito sa hudisyal na diin ng kasunod na מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa tambalang ito, likas na ipinahahayag ng “katarungan” ang makatarungang pamamahala at paghatol ng Diyos.
- source_word: מְכוֹן
  choice: saligan
  rationale: Tumutukoy ang salita sa matatag na kinalalagyan o pundasyon; ang “saligan” ay malinaw at marangal sa larawan ng trono.
- source_word: כִּסְאֶךָ
  choice: iyong trono
  rationale: Tuwirang pinananatili ang maharlikang talinghaga at ang panghalip na ikalawang panauhan.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matibay, nananatili, at mapagkakatiwalaang pag-ibig nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: אֱמֶת
  choice: katapatan
  rationale: Sa pagkakapares nito sa חֶסֶד, higit na angkop ang relasyonal na diwa ng pagiging mapagkakatiwalaan kaysa sa abstraktong “katotohanan.”
- source_word: יְקַדְּמוּ
  choice: nauuna
  rationale: Pinananatili ang makatang larawan ng dalawang katangiang nauuna o pumapasok sa unahan ng Diyos.
- source_word: פָנֶיךָ
  choice: iyong harapan
  rationale: Ang literal na “iyong mukha” ay maaaring tumukoy sa presensiya. Ang “iyong harapan” ay natural sa Filipino at nananatiling malapit sa kongkretong larawan.
theological_decisions:
- issue: Pagpapahayag sa tambalang חֶסֶד וֶאֱמֶת
  choice: tapat na pag-ibig at katapatan
  alternative: wagas na pag-ibig at katotohanan
  rationale: Pinananatili ng pinili ang relasyonal na lakas ng dalawang salita—matatag na pag-ibig at mapagkakatiwalaang katapatan—nang hindi ginagawang pawang abstraktong mga katangian.
- issue: Kung literal na “mukha” o idyomatikong “presensiya” ang פָנֶיךָ
  choice: iyong harapan
  alternative: iyong mukha / iyong presensiya
  rationale: Ang “harapan” ay nagpapanatili ng pisikal at makatang larawan habang natural na naipahihiwatig ang presensiya; inilalahad sa talababa ang mas literal at idyomatikong mga posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang magkatimbang na mga pariralang “katuwiran at katarungan” at “tapat na pag-ibig at katapatan” upang mapanatili ang parallelism at teolohikal na tensiyon ng tulang Hebreo.
