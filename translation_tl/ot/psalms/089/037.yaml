  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: tl
  text: Gaya ng buwan[a], ito’y mananatiling matatag magpakailanman; at tapat ang saksi sa kalangitan[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung paanong ang buwan.”
    reason: lexical_alternative
  - marker: b
    text: Madalas unawain na ang “saksi sa kalangitan” ay ang buwan, na nagsisilbing maaasahang makalangit na saksi sa pananatili ng tipan.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Gaya ng buwan
  rationale: Ang unlaping כְּ ay naghahayag ng paghahambing, at ang יָרֵחַ ay “buwan.” Likas at malinaw sa makabagong Tagalog ang “gaya ng buwan” habang pinananatili ang pagtutulad.
- source_word: יִכּוֹן
  choice: ito’y mananatiling matatag
  rationale: Ang Niphal imperfect ng כון ay nagpapahiwatig ng pagiging matatag o pagkakatatag. Ipinapahayag ng “mananatiling matatag” ang namamalaging bunga nito nang hindi tahasang pinapangalanan ang paksang ipinagpapatuloy mula sa naunang talata.
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Sa kontekstong patula at tipanan, tumutukoy ito sa walang-hanggang pananatili; ang “magpakailanman” ay natural at marangal na katumbas.
- source_word: וְעֵד
  choice: at … ang saksi
  rationale: Ang עֵד ay “saksi.” Pinananatili ang hiwalay ngunit hindi tiyak na pagkakakilanlan ng makalangit na saksi.
- source_word: בַּשַּׁחַק
  choice: sa kalangitan
  rationale: Ang שַׁחַק ay maaaring tumukoy sa langit, himpapawid, o mga ulap sa panulaan. Sapat na malawak at marangal ang “kalangitan” nang hindi ito nililimitahan sa mga ulap.
- source_word: נֶאֱמָן
  choice: tapat
  rationale: Ipinahahayag ng salita ang pagiging mapagkakatiwalaan, matibay, o maaasahan. Pinananatili ng “tapat” kapuwa ang diwa ng pagkamaaasahan at ang himig ng tipanan.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan o tungkulin ng termino, kaya isinalin ito sa baybay na “Selah” sa halip na bigyan ng haka-hakang kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng di-hayag na paksa ng יִכּוֹן
  choice: Ginamit ang “ito” at hindi tahasang pinangalanan ang tinutukoy.
  alternative: Tahasang sabihing “ang kanyang trono” o “ang kanyang lahi.”
  rationale: Walang hayag na paksa ang pandiwa sa talatang ito; ipinagpapatuloy iyon mula sa naunang konteksto tungkol sa lahi at trono ni David. Pinananatili ng “ito” ang kaiklian at hindi pumipili nang higit sa sinasabi ng teksto.
- issue: Pagkakakilanlan ng “saksi sa kalangitan”
  choice: Iniwan itong “ang saksi sa kalangitan” nang hindi pinangalanan sa pangunahing teksto.
  alternative: Tukuyin ito bilang buwan, bahaghari, o ibang makalangit na tanda.
  rationale: Hindi tahasang kinikilala ng Hebreo ang saksi. Pinananatili ng salin ang tunay na kalabuan, habang inilalahad sa talababa ang karaniwang pag-unawa na maaaring ang buwan ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panulaan. Pinanatili ang “Selah” at ang kalabuan tungkol sa tinutukoy ng “ito” at sa pagkakakilanlan ng makalangit na saksi.
