  text: 'Itatatag ko magpakailanman ang kanyang angkan,

    at ang kanyang trono ay gaya ng mga araw ng langit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idyomatikong pananalita, “at ang kanyang trono ay mananatili hangga’t nananatili ang langit.”
