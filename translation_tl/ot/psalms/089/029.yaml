lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Pananatilihin ko
  rationale: Bagaman ang salitang-ugat ay literal na “ilagay” o “italaga,” sa pangakong tipan tungkol sa lahi at trono ay ipinahihiwatig nito ang matatag at patuloy na pag-iral. Ang “pananatilihin” ay likas sa Filipino at malinaw na naghahatid ng diwang ito.
- source_word: לָעַד
  choice: magpakailanman
  rationale: Tuwirang ipinahahayag nito ang walang-hanggang tagal na mariing ipinangako sa talata.
- source_word: זַרְעוֹ
  choice: ang kanyang lahi
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa supling o mga inapo. Pinananatili ng “lahi” ang diwa ng nagpapatuloy na angkan nang hindi gumagamit ng di-likas na literal na “binhi.”
- source_word: וְכִסְאוֹ
  choice: at ang kanyang trono
  rationale: Tuwirang katumbas ito ng salitang Hebreo at pinananatili ang larawan ng paghahari.
- source_word: כִּימֵי
  choice: ay gaya ng mga araw ng
  rationale: Pinananatili nito ang tahasang paghahambing at ang poetikong idyomang “mga araw ng,” sa halip na agad itong gawing paliwanag tungkol sa tagal.
- source_word: שָׁמָיִם
  choice: langit
  rationale: Bagaman anyong maramihan ang salitang Hebreo, karaniwang kolektibong “langit” ang likas na katumbas nito sa modernong Filipino.
theological_decisions:
- issue: Ang tagal ng pangako sa tipan kay David
  choice: Panatilihin ang mariing “magpakailanman” at ang poetikong “gaya ng mga araw ng langit.”
  alternative: Ipaliwanag ang ikalawang parirala bilang “hangga’t nananatili ang langit” o limitahan ito sa sunod-sunod na mga salinlahi.
  rationale: Malakas na wikang tumutukoy sa patuloy na pag-iral ang ginamit ng talata. Hindi dapat bawasan ang lakas nito o ipasok sa salin ang isang partikular na paliwanag tungkol sa dinastiya o sa katuparan nito.
translation_notes:
  register: Makabago at marangal na Filipino. Sadyang pinanatili ang poetikong “mga araw ng langit,” habang inilagay sa talababa ang mas idyomatikong pagpapahayag.
