base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: tl
  text: 'Sa iyo ang kalangitan;

    sa iyo rin ang lupa.

    Ang daigdig at lahat ng naroon[a]—

    ikaw ang nagtatag ng mga ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kapuspusan nito”; ibig sabihin, lahat ng nasa daigdig.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: sa iyo
  rationale: Tuwirang ipinahahayag ng ל na may hulaping ikalawang panauhang panlalaki ang pag-aari. Likas sa Filipino ang sugnay na “Sa iyo ang…” at hindi nito dinaragdagan ang diwa.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Ang “kalangitan” ay natural at marangal na katumbas ng Hebreong anyong maramihan na tumutukoy sa buong dako ng langit.
- source_word: אַף
  choice: rin
  rationale: 'Ipinagpapatuloy nito ang paralelismo: hindi lamang ang kalangitan kundi pati ang lupa ay sa Diyos.'
- source_word: אָרֶץ
  choice: ang lupa
  rationale: Dahil katapat ito ng kalangitan at sinusundan ng “daigdig,” ang kosmikong kahulugang “lupa” ang angkop, hindi ang isang partikular na lupain.
- source_word: תֵּבֵל
  choice: ang daigdig
  rationale: Tumutukoy ito sa maayos o tinatahanang mundo. Malinaw at makatang katumbas sa modernong Filipino ang “daigdig.”
- source_word: מְלֹאָהּ
  choice: lahat ng naroon
  rationale: Literal itong “kapuspusan nito,” ibig sabihin, lahat ng nilalaman ng daigdig. Ang “lahat ng naroon” ay malinaw at natural habang pinananatili ang saklaw ng parirala.
- source_word: יְסַדְתָּם
  choice: ikaw ang nagtatag sa mga ito
  rationale: Pinananatili ng “nagtatag” ang larawan ng paglalagay ng pundasyon. Ang “mga ito” ay sumasalamin sa hulaping maramihan at tumutukoy sa daigdig at lahat ng naroon.
theological_decisions:
- issue: Pagmamay-ari ng Diyos at ang kaniyang gawang paglikha
  choice: Panatilihin kapwa ang pahayag na sa Diyos ang kalangitan at lupa at na siya ang nagtatag sa daigdig at lahat ng naroon.
  alternative: Palawakin ito bilang tahasang pahayag tungkol sa paglikha mula sa wala, o paliitin bilang pahayag lamang tungkol sa paghahari.
  rationale: Malinaw na pinagsasama ng Hebreo ang pag-aari (לְךָ) at ang gawa ng pagtatatag (יְסַדְתָּם), ngunit hindi nito tahasang nililinaw rito ang mas malawak na mekanismo ng paglikha.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maikling mga linyang patula upang mapanatili ang paralelismo ng Hebreo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
