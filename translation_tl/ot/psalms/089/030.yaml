lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang ipinapahayag ang kondisyong ipinakikilala ng אִם nang hindi ipinapalagay na tiyak na mangyayari ito.
- source_word: יַעַזְבוּ
  choice: tatalikuran
  rationale: Ipinahihiwatig ng עזב ang pag-iwan o pagpapabaya; ang “tatalikuran” ay natural sa makabagong Tagalog at angkop sa diwa ng pagtataksil sa tipan.
- source_word: בָנָיו
  choice: kanyang mga anak
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo at maaaring isaling “mga anak na lalaki,” natural na ginagamit sa Tagalog ang “mga anak” para sa mga supling ng isang lalaki; sa konteksto, tumutukoy ito sa mga inapo ni David.
- source_word: תּוֹרָתִי
  choice: aking kautusan
  rationale: Maaaring mangahulugan ang תּוֹרָה ng aral o tagubilin, ngunit dahil katambal ito ng מִשְׁפָּטַי, litaw rito ang legal at pangtipang diwa.
- source_word: וּבְמִשְׁפָּטַי
  choice: ayon sa aking mga tuntunin
  rationale: Ang מִשְׁפָּטִים ay maaaring tumukoy sa mga hatol, ordinansa, o itinakdang tuntunin. Ginagawang malinaw ng “ayon sa” ang diwa ng pamumuhay na sumusunod sa mga ito.
- source_word: לֹא יֵלֵכוּן
  choice: hindi sila lalakad
  rationale: Pinananatili ang Hebreong talinghaga ng paglakad bilang paraan ng pamumuhay o paggawi, habang nililinaw ng kasunod na “ayon sa” ang kahulugan.
theological_decisions:
- issue: Pagpapakahulugan sa תּוֹרָה sa kontekstong legal at pangtipan
  choice: aking kautusan
  alternative: aking aral; aking tagubilin
  rationale: Pinananatili ng “kautusan” ang legal at pangtipang himig na nalilikha ng paralelismo nito sa “aking mga tuntunin,” nang hindi itinatanggi ang mas malawak na saklaw ng salitang Hebreo.
- issue: Paglalarawan sa בָנָיו
  choice: kanyang mga anak
  alternative: kanyang mga anak na lalaki
  rationale: Ang “mga anak” ang likas na panumbas sa modernong Tagalog para sa mga supling at hindi nito binabago ang reperensiya sa mga inapo ni David. Itinatala sa talababa ang tahasang panlalaking anyo ng Hebreo.
- issue: Talinghaga ng paglakad sa לֹא יֵלֵכוּן
  choice: hindi sila lalakad ayon sa
  alternative: hindi sila mamumuhay ayon sa; hindi nila susundin
  rationale: Pinananatili ang biblikal na talinghaga ng paglakad at ang pangtipang diin sa gawi, ngunit ginagamit ang “ayon sa” upang maging malinaw at natural sa Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang kondisyong “Kung,” ang legal-pangtipang paralelismo ng “kautusan” at “mga tuntunin,” at ang talinghaga ng paglakad. Ang kuwit sa hulihan ay nagpapakitang nagpapatuloy ang kondisyong pangungusap sa susunod na talata.
