base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: tl
  text: Makakasama niya ang aking katapatan at tapat na pag-ibig, at sa aking pangalan ay maitataas ang kanyang sungay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sungay” ay larawang Hebreo para sa lakas, dangal, o kapangyarihang maharlika.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: aking katapatan
  rationale: Tumutukoy dito sa pagiging maaasahan at tapat ng Diyos, hindi sa gawa ng pananampalataya; kaagapay ito ng חַסְדִּי.
- source_word: חַסְדִּי
  choice: aking tapat na pag-ibig
  rationale: Inihahayag ang pag-ibig na matatag at tapat sa tipan sa natural at madaling maunawaang modernong Tagalog.
- source_word: עִמּוֹ
  choice: sasakanya
  rationale: Likas na salin ng 'kasama niya' sa kontekstong ang katapatan at pag-ibig ng Diyos ay patuloy na sumusuporta sa hari.
- source_word: בִּשְׁמִי
  choice: sa aking pangalan
  rationale: Pinananatili ang Hebreong idyoma at ang posibilidad na tumukoy ito sa kapangyarihan, pahintulot, o katayuang nagmumula sa Diyos.
- source_word: תָּרוּם
  choice: maitataas
  rationale: Ipinapakita ang pag-angat o pagdakila habang pinananatili ang konkretong talinghaga ng sungay.
- source_word: קַרְנוֹ
  choice: kanyang sungay
  rationale: Pinananatili ang literal at makatang larawan ng Hebreo sa halip na palitan agad ng abstraktong 'lakas' o 'kapangyarihan.'
theological_decisions:
- issue: Pagpapanatili sa maharlikang talinghaga ng sungay
  choice: maitataas ang kanyang sungay
  alternative: madaragdagan ang kanyang kapangyarihan
  rationale: Ang 'sungay' ay mahalagang makatang larawan ng lakas, dangal, at kapangyarihang maharlika; ang pagpapanatili rito ay umiiwas sa labis na pagpapaliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula. Ginamit ang “sasakanya” para sa likas na daloy at “maitataas” upang mapanatili ang larawan ng sungay nang hindi tunog mekanikal.
