translation:
  language: tl
  text: Ilalagay ko ang kanyang kamay sa dagat[a], at ang kanyang kanang kamay sa mga ilog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw ng dagat, at ang kanyang kanang kamay sa ibabaw ng mga ilog.” Maaaring ipinahihiwatig ng larawang ito ang lawak ng kanyang paghahari o kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ilalagay ko
  rationale: Ang Qal perfect na unang panauhang isahan na may pang-ugnay ay ginagamit sa kontekstong pangako, kaya ang likas na salin sa Filipino ay nasa aspektong magaganap. Pinananatili ng “ilalagay” ang kongkretong larawan.
- source_word: בַיָּם
  choice: sa ibabaw ng dagat
  rationale: Ang בְּ sa larawang ito ng paghahari o saklaw ay maaaring tumukoy sa paglalagay ng kamay sa o ibabaw ng isang nasasakupan. Ang “sa ibabaw ng dagat” ay natural sa Filipino at hindi tahasang pinapalitan ang larawan ng paliwanag na “mamamahala sa.”
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Pinananatili ang literal na bahagi ng katawan at ang metaporikal na larawan ng kapangyarihan o abot.
- source_word: וּבַנְּהָרוֹת
  choice: at ... sa ibabaw ng mga ilog
  rationale: Ang נְהָרוֹת ay pangmaramihan ng “ilog.” Inuulit ang pariralang “sa ibabaw ng” upang mapanatili ang malinaw na paralelismo.
- source_word: יְמִינוֹ
  choice: ang kanyang kanang kamay
  rationale: Pinananatili nito ang paralelismo sa Hebreo at ang kaugnay na pahiwatig ng lakas at awtoridad.
theological_decisions:
- issue: Larawan ng maharlikang kapangyarihan o paghahari
  choice: Panatilihin ang kongkretong larawan ng kamay at kanang kamay na inilalagay sa ibabaw ng dagat at mga ilog.
  alternative: Palalawakin ko ang kanyang kapangyarihan sa dagat at ang kanyang pamamahala sa mga ilog.
  rationale: Malamang na ipinahihiwatig ng tula ang malawak na paghaharing ipinagkaloob ng Diyos sa hari, ngunit hindi ito tahasang sinasabi. Pinananatili ng salin ang metapora at ang teolohikal na pahiwatig nang hindi ginagawang paliwanag ang pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na paralelismo. Ginamit ang “sa ibabaw ng” upang maging natural ang larawan sa Filipino habang inilalahad sa talababa ang mas literal na alternatibong “sa dagat.”
