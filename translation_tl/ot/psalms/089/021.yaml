  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: tl
  text: Sa piling niya, mananatiling matatag ang aking kamay[a]; tunay ngang palalakasin siya ng aking bisig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kasama niya, ang aking kamay ay mapagtitibay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bisig” ay larawang patula para sa lakas at kapangyarihan.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: Sa piling niya
  rationale: Ipinahahayag nito sa likas na Filipino ang kaugnayang ‘kasama niya’ sa sugnay na tumutukoy sa piniling hari sa naunang talata, nang hindi dinaragdagan ang kahulugan.
- source_word: יָדִי
  choice: aking kamay
  rationale: Pinananatili ang kongkretong larawang patula para sa aktibong kapangyarihan at pagtangkilik ng Diyos.
- source_word: תִּכּוֹן
  choice: mananatiling matatag
  rationale: Ang Niphal ng כון ay maaaring mangahulugang maging matatag o matibay. Ang ‘mananatiling matatag’ ay natural sa Filipino at naipahahayag ang ipinangakong patuloy na katatagan.
- source_word: אַף
  choice: tunay ngang
  rationale: Ipinakikita ang pagbibigay-diin at pagpapatuloy sa magkatulad na ikalawang linya.
- source_word: זְרוֹעִי
  choice: aking bisig
  rationale: Pinananatili ang larawang Hebreo ng bisig bilang sagisag ng lakas at kapangyarihan.
- source_word: תְאַמְּצֶנּוּ
  choice: palalakasin siya
  rationale: Tumpak at likas na salin ng Piel na nagsasaad na gagawin siyang malakas o patatatagin.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pagkilos ng Diyos
  choice: Pinanatili ang ‘aking kamay’ at ‘aking bisig.’
  alternative: Isalin nang tahasan bilang ‘aking kapangyarihan’ at ‘aking lakas.’
  rationale: Sadyang gumagamit ang tulang Hebreo ng mga bahagi ng katawan bilang larawan ng makapangyarihang pagtangkilik ng Diyos sa hari; hindi ito dapat gawing abstrakto nang walang pangangailangan.
- issue: Ipinangakong pagkilos kumpara sa pangkalahatang katotohanan sa kasalukuyan
  choice: Ginamit ang panghinaharap na ‘mananatili’ at ‘palalakasin.’
  alternative: Gamitin ang pangkasalukuyang ‘nananatili’ at ‘pinalalakas.’
  rationale: Sa konteksto ng tipan, ang mga pandiwang imperfect ay likas na nagpapahayag ng ipinangako at nagpapatuloy na pagkilos ng Diyos.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismong patula at ang mga larawang ‘kamay’ at ‘bisig’; ginamit ang ‘sa piling niya’ upang maging likas ang עִמּוֹ sa Filipino.
