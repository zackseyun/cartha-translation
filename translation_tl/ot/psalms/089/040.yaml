  text: Sinira mo ang lahat ng kanyang mga pader[a]; ginawa mong guho[c] ang kanyang mga tanggulan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kanyang mga bakod” o “lahat ng kanyang mga harang.” Ang salitang Hebreo ay maaari ring tumukoy sa mga pananggalang na nakapaligid.
