lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: Winasak mo
  rationale: Ang pandiwang פרץ ay nagsasaad ng pagbutas, pagwasak, o pagdaan sa isang harang. Sa konteksto ng mga pananggalang, natural sa makabagong Tagalog ang “winasak mo” at malinaw nitong ipinahihiwatig ang pagkawala ng depensa.
- source_word: כָל
  choice: lahat
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng pagkawasak.
- source_word: גְּדֵרֹתָיו
  choice: kanyang mga pader
  rationale: Ang גְּדֵרָה ay maaaring pader, bakod, o harang. Dahil katapat nito sa taludtod ang mga tanggulan, ang “mga pader” ang pinakaangkop sa konteksto ng depensa.
- source_word: שַׂמְתָּ
  choice: ginawa mong
  rationale: Malawak ang saklaw ng שׂים, kabilang ang paglalagay at paggawa sa isang kalagayan. Ang “ginawa mong” ay natural sa konstruksiyong nagsasaad na naging guho ang mga tanggulan.
- source_word: מִבְצָרָיו
  choice: kanyang mga tanggulan
  rationale: Ang מִבְצָר ay isang pinatibay na lugar. Ang “mga tanggulan” ay dignified at madaling maunawaan, habang hindi labis na tinutukoy ang eksaktong uri ng kuta.
- source_word: מְחִתָּה
  choice: guho
  rationale: Sa kontekstong ito, tumutukoy ang pangngalan sa pagkawasak o kalagayang wasak. Ang “guho” ay akma sa pisikal na larawan at sa paralelismo ng nawasak na mga depensa; maaari rin itong mangahulugang pagkawasak o pagkasindak sa ibang konteksto.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaking isahan sa “kanyang” sa panaghoy tungkol sa Davidikong hari at tipan
  choice: Pinanatili ang “kanyang” nang hindi tahasang pinangalanan ang tinutukoy.
  alternative: Isalin bilang “ng hari” o ipakahulugan sa pangkalahatan bilang mga depensa ng Zion/Jerusalem.
  rationale: Panlalaking isahan ang mga hulapi sa Hebreo, at ang malapit na konteksto ay tungkol sa pagbagsak ng pinahirang Davidikong hari. Pinananatili ng panghalip ang makatang kalabuan at hindi ipinapasok sa pangunahing teksto ang isang tiyak na pagpapakahulugan.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinili ang “pader” at “tanggulan” upang mapanatili ang larawang militar at ang paralelismo, habang ang “kanyang” ay nagpapanatili sa kalabuan ng reperente sa Hebreo.
