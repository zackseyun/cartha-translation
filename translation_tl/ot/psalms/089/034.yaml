  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: tl
  text: Hindi ko lalabagin ang aking tipan[a], ni babaguhin ang lumabas sa aking mga labi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “lalapastanganin ang aking tipan” o “sisirain ang aking tipan.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “ang lumabas mula sa aking mga labi”; ibig sabihin, ang aking binigkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: lalabagin
  rationale: Ang Piel ng חלל sa kontekstong ito ay tumutukoy sa paglapastangan o pagsira sa bisa ng tipan. Ang “lalabagin” ay natural sa modernong Filipino para sa paglabag sa tipan at pinananatili ang bigat ng pahayag.
- source_word: בְּרִיתִי
  choice: ang aking tipan
  rationale: Ang בְּרִית ay karaniwang katawagan sa isang taimtim at may-bisang tipan; malinaw ring pinananatili ang hulaping unang panauhan.
- source_word: מוֹצָא שְׂפָתַי
  choice: ang lumabas sa aking mga labi
  rationale: Pinananatili nito ang konkretong larawang Hebreo, “ang paglabas ng aking mga labi,” habang nauunawaan sa Filipino bilang mga salitang binigkas.
- source_word: אֲשַׁנֶּה
  choice: babaguhin
  rationale: Ang Piel ng שנה ay nangangahulugang baguhin. Ang “babaguhin” ay tuwiran at angkop sa binigkas na salita o pangako.
- source_word: לֹא ... לֹא
  choice: Hindi ko ... ni babaguhin ...
  rationale: Ang “hindi ... ni ...” ay natural na Filipino na nagpapanatili sa magkatimbang na dalawang pagtanggi ng Hebreo.
theological_decisions:
- issue: Kalikasan ng pangako ng Diyos
  choice: Panatilihin ang tiyak na wika tungkol sa tipan at sa salitang lumabas sa kanyang mga labi.
  alternative: Palawakin ito bilang pangkalahatang pahayag na hindi nagbabago ang Diyos, o gawing payak na “Hindi ko sisirain ang aking pangako.”
  rationale: Partikular na binabanggit ng talata ang tipan at ang binigkas na salita. Hindi dapat dagdagan ng saling teolohikal na mas malawak kaysa sa tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan” bilang kinikilalang terminong biblikal, at pinanatili ang larawan ng mga salitang lumalabas sa mga labi nang hindi nagiging di-likas ang pangungusap.
