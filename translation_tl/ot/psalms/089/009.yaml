  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: tl
  text: Ikaw ang naghahari sa pag-alon ng dagat[a]; kapag tumataas ang mga alon nito, pinatatahimik mo ang mga ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapalaluan” o “sa karilagan ng dagat.” Ang salitang Hebreo ay maaaring tumukoy sa kataasan, karilagan, o pagtaas ng tubig; sa kontekstong ito, malamang na inilalarawan nito ang pag-alon ng dagat.
    reason: lexical_alternative
  - marker: b
    text: O “pinahuhupa mo ang mga ito” o “sinusupil mo ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: naghahari
  rationale: Ipinahahayag ng participle ang patuloy at makapangyarihang pamamahala. Likas at marangal sa Filipino ang “naghahari” at malinaw na ipinakikita ang kapangyarihan ng Diyos sa dagat.
- source_word: בְּגֵאוּת הַיָּם
  choice: sa pag-alon ng dagat
  rationale: Maaaring tumukoy ang גֵּאוּת sa kapalaluan, karangalan, o pagtaas/pagbulusok ng tubig. Sa konteksto ng dagat at tumataas na mga alon, pinananatili ng “pag-alon” ang kongkretong larawang-dagat; ang בְּ pagkatapos ng מוֹשֵׁל ay likas na isinaling “sa.”
- source_word: בְּשׂוֹא
  choice: kapag tumataas
  rationale: Ang infinitive construct ay naglalahad ng kalagayang kasabay ng pagkilos. Ang “kapag tumataas” ay malinaw at natural na temporal na pagpapahayag.
- source_word: גַלָּיו
  choice: mga alon nito
  rationale: Ang hulaping panghalip ay tumutukoy pabalik sa dagat. Ang “nito” ang natural na Filipino para sa walang-buhay na tinutukoy.
- source_word: תְשַׁבְּחֵם
  choice: pinatatahimik mo ang mga iyon
  rationale: Sa Piel, ang שׁבח dito ay nangangahulugang pahupain, patahimikin, o supilin. Inilalarawan ng “pinatatahimik” ang aktibong pagpapahupa sa nagngangalit na mga alon nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Kapangyarihan ng Diyos sa magulong tubig
  choice: Tuwirang ipinahahayag na naghahari ang Diyos sa dagat at pinatatahimik niya ang mga alon nito.
  alternative: Maaaring mabasa ang larawan bilang patulang pahiwatig sa tagumpay ng Diyos laban sa kosmikong kaguluhan.
  rationale: Hayagang inilalarawan ng talata ang kapangyarihan ng Diyos sa dagat. Pinananatili ng salin ang kongkretong larawan at hindi ipinapasok sa pangunahing teksto ang mas malawak na mitopoetikong balangkas na hindi tahasang binabanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pag-alon” upang maging natural sa ordinaryong mambabasa habang pinananatili sa talababa ang tunay na lawak ng kahulugan ng גֵּאוּת. Ang “mga iyon” ay umiiwas sa malabong pagtukoy at nagpapanatili sa mga alon bilang layon ng pandiwa.
