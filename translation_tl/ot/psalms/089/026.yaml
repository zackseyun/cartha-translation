base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: tl
  text: Tatawag siya sa akin[a], “Ikaw ang aking Ama, ang aking Diyos, at ang bato ng aking kaligtasan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tatawagin niya ako” o “Dadaing siya sa akin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtawag nang malakas, lalo na sa pananalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: siya
  rationale: Ang hiwalay na panghalip na panlalaking isahan ay pinanatili upang maipakita ang tahasang paksa at diin ng Hebreo.
- source_word: יִקְרָאֵנִי
  choice: Tatawag siya sa akin
  rationale: Ang קרא ay maaaring mangahulugang tumawag o dumaing. Sa konteksto ng pananalangin o pagtawag sa Diyos, natural sa Filipino ang “tumawag sa akin,” habang pinananatili sa talababa ang tunay na saklaw ng kahulugan.
- source_word: אָבִי
  choice: aking Ama
  rationale: Pangngalang may hulaping unang panauhang isahan; ang “aking Ama” ay natural at marangal na tuwirang pagtawag sa Diyos.
- source_word: אָתָּה
  choice: Ikaw ang
  rationale: Tahasang nakasaad ang panghalip sa Hebreo. Ang “Ikaw ang” ang natural na Filipino na naghahayag ng pagkakakilanlan sa kasunod na mga panaguri.
- source_word: אֵלִי
  choice: aking Diyos
  rationale: Bagaman maaaring tumukoy ang אֵל sa isang makapangyarihan, malinaw sa parallelismo na Diyos ang tinutukoy.
- source_word: וְצוּר
  choice: at ang batong
  rationale: Pinanatili ang literal na metaporang “bato” para sa Diyos bilang katatagan at kanlungan, pati ang kawalan ng tahasang panghalip na paari sa צוּר.
- source_word: יְשׁוּעָתִי
  choice: aking kaligtasan
  rationale: Pinananatili ng “kaligtasan” ang ugnayang konstruktong “bato ng/aking kaligtasan” at ang malawak na teolohikal na diwa ng יְשׁוּעָה, na maaari ring mangahulugang pagliligtas.
theological_decisions:
- issue: Pagtawag sa Diyos bilang Ama sa kontekstong maharlika at mesiyaniko
  choice: 'Isinalin nang tuwiran ang pananalita bilang pagtawag sa Diyos: “Ikaw ang aking Ama, ang aking Diyos, at ang batong aking kaligtasan.”'
  alternative: Ipaliwanag ito bilang eksaheradong wikang maharlika lamang, o gumamit ng anyong nagpapahina sa “Ama” bilang relasyonal na tawag.
  rationale: Tungkol ang Awit 89 sa hari mula sa angkan ni David at sa tipan, ngunit ang mismong talata ay tuwirang tumatawag sa Diyos sa wikang relasyonal at pangtipan. Pinananatili ito nang hindi nagdaragdag ng mga konklusyon mula sa kalaunang doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matibay na metaporang “bato” at ang direktang pananalita. Ginamit ang “aking” upang maging dignified at angkop sa estilo ng Mga Awit.
