  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: tl
  text: Gaya ng isang napatay, dinurog mo si Rahab[a]; sa iyong makapangyarihang bisig, pinangalat mo ang iyong mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Rahab ay makatang pangalan na maaaring tumukoy sa Ehipto o pumukaw sa larawan ng isang halimaw o kapangyarihan ng kaguluhan na nilupig ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: דִכִּאתָ
  choice: Dinurog mo
  rationale: Ipinahahayag ng pandiwa ang marahas na pagdurog o pagwasak; malinaw at matindi ang “dinurog” sa makatang larawang pandigma.
- source_word: כֶחָלָל
  choice: na gaya ng isang napatay
  rationale: Pinananatili ng “gaya ng” ang paghahambing na minamarkahan ng כ, at ang “isang napatay” ay natural na tumutukoy sa nasawi sa labanan nang hindi dinaragdagan ang kasarian.
- source_word: רָהַב
  choice: Rahab
  rationale: Pinananatili ang makatang pangalang Hebreo upang huwag agad pagpasyahan kung tumutukoy ito sa Ehipto o sa isang halimaw/kapangyarihan ng kaguluhan.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: sa pamamagitan ng iyong makapangyarihang bisig
  rationale: Ipinapakita ang gamit o instrumento ng pagkilos at pinananatili ang larawang antropomorpiko ng bisig bilang kapangyarihan.
- source_word: פִּזַּרְתָּ
  choice: pinangalat mo
  rationale: Tuwirang ipinapahayag ang pagpapawatak-watak nang hindi nagdaragdag ng mas tiyak na ideya ng pagpapaurong sa hukbo.
- source_word: אוֹיְבֶיךָ
  choice: iyong mga kaaway
  rationale: Likas at tuwirang salin ng pangngalang maramihan na may panghalip na paari.
theological_decisions:
- issue: Pagkakakilanlan ni רָהַב sa makatang konteksto
  choice: Panatilihin ang “Rahab” sa pangunahing teksto bilang makatang pangalan ng kaaway na nilupig.
  alternative: Isalin bilang “Ehipto” o bilang isang halimaw/kapangyarihan ng kaguluhan.
  rationale: Maaaring maging makatang pangalan ng Ehipto ang רָהַב at maaari rin itong pumukaw sa larawan ng kapangyarihan ng kaguluhan. Ang transliterasyon ay nagpapanatili sa tunay na kalabuan at sa masaganang larawang patula.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawang pandigma at ang makatang kalabuan ng “Rahab”; ginamit ang “bisig” upang mapanatili ang konkretong larawan ng Hebreo.
