  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: tl
  text: Magtalaga ka ng isang masamang tao upang mamahala sa kanya, at tumayo nawa ang isang tagapagparatang sa kanan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at tumayo nawa si Satanas sa kanan niya.” Ang salitang Hebreo ay maaaring mangahulugang “tagapagparatang,” “kalaban,” o, sa ilang konteksto, ang pantanging pangalang “Satanas.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Magtalaga ka
  rationale: Ang Hiphil imperative ng פקד ay nananawagang maglagay o magtalaga ng isang tao sa isang tungkulin; pinananatili ng “Magtalaga ka” ang pautos na anyo nang hindi nililimitahan ang uri ng katungkulan.
- source_word: עָלָיו
  choice: upang mamuno sa kanya
  rationale: Kasama ng פקד, ipinahihiwatig ng עַל na ang itinalaga ay inilalagay sa kapangyarihan sa ibabaw ng tinutukoy na tao. Natural sa Filipino ang “upang mamuno sa kanya” at malinaw nitong naihahatid ang ugnayang iyon.
- source_word: רָשָׁע
  choice: isang taong masama
  rationale: Tumutukoy ang salita sa isang masamang tao. Likas at malinaw sa makabagong Filipino ang “isang taong masama,” nang hindi dinaragdagan ang kahulugan.
- source_word: שָׂטָן
  choice: isang tagapagparatang
  rationale: Sa kontekstong panghukuman, gumaganap ito bilang karaniwang pangngalan na nangangahulugang tagapagparatang o kalaban, at hindi kinakailangang pantanging pangalang Satanas.
- source_word: יַעֲמֹד
  choice: hayaang tumayo
  rationale: Ang imperfect kasunod ng imperative ay may jussive na diwa. Inihahatid ng “hayaang tumayo” ang ipinapanalangin o hinihiling na pangyayari.
- source_word: עַל יְמִינוֹ
  choice: sa kanan niya
  rationale: Pinananatili nito ang Hebreong idyoma ng pagpuwesto sa kanang bahagi, na maaaring may kontekstong panghukuman o mapanlaban.
theological_decisions:
- issue: Kung ang שָׂטָן ay pantanging pangalang “Satanas” o karaniwang pangngalan
  choice: 'karaniwang pangngalan: “isang tagapagparatang”'
  alternative: “Satanas” o “isang kalaban”
  rationale: Hindi hinihingi ng anyong Hebreo ang pagbasa rito bilang pantanging pangalan, at ang agarang konteksto ay tila panghukuman. Pinananatili sa talababa ang ibang lehitimong pagbasa upang hindi alisin ang tunay na leksikal at teolohikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taong masama” sa halip na mas arkaikong katawagan, habang pinanatili ang pautos na tono, ang larawang panghukuman, at ang idyomang “sa kanan niya.”
