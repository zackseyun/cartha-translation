  text: יַ֗עַן אֲשֶׁ֤ר לֹ֥א זָכַר֮ עֲשׂ֪וֹת חָ֥סֶד וַ/יִּרְדֹּ֡ף אִישׁ עָנִ֣י וְ֭/אֶבְיוֹן וְ/נִכְאֵ֨ה לֵבָ֬ב לְ/מוֹתֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/016.yaml
  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: tl
  text: sapagkat hindi niya inalaalang magpakita ng kagandahang-loob[a], kundi hinabol niya ang taong dukha at nangangailangan, at ang may pusong wasak[b], upang patayin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpakita ng awa.” Ang salitang Hebreo ay maaari ring mangahulugang tapat na pag-ibig o katapatan sa tipan, ngunit dito ay tumutukoy ito sa aktuwal na kabutihang ipinakikita sa mga mahihina.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang taong dukha at nangangailangan, at ang wasak sa puso.” Isahan ang anyo sa Hebreo, ngunit malamang na kumakatawan ito sa uri ng mga taong kanyang tinutugis.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi ito, na nag-uugnay sa asal na inilalarawan sa hatol ng konteksto.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: hindi niya inisip na magpakita ng kagandahang-loob
  rationale: Ang זָכַר na may pawatas ay tumutukoy sa pagsasaisip na humahantong sa pagkilos. Saklaw ng חָסֶד ang awa, tapat na pag-ibig, at katapatan, ngunit sa kontekstong pakikitungo sa mahihina, likas ang 'magpakita ng kagandahang-loob' nang hindi labis na nililimitahan ang diwa.
- source_word: וַיִּרְדֹּף
  choice: kundi hinabol niya
  rationale: Pinatingkad ng 'kundi' ang pagsalungat sa hindi pagpapakita ng kagandahang-loob; pinananatili ng 'hinabol' ang kongkretong larawan ng pandiwang Hebreo.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: ang dukha at nangangailangan
  rationale: Likas sa Filipino ang tambalang paglalarawan. Hindi na kailangang ulitin ang 'lalaki' upang katawanin ang isahang אִישׁ, ngunit ipinapaliwanag sa talababa ang kinatawang isahan ng Hebreo.
- source_word: וְנִכְאֵה לֵבָב
  choice: pati ang pusong wasak
  rationale: Ang 'pusong wasak' ay natural at matindi sa modernong Filipino, at malapit sa larawang 'wasak sa puso' ng Hebreo.
- source_word: לְמוֹתֵת
  choice: upang patayin sila
  rationale: Ipinahahayag ng parirala ang layunin o kinahinatnan ng paghabol. Ang 'sila' ay natural na tumutukoy sa mga kinatawang taong mahihina na naunang binanggit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang sanhi, ang matinding pagsalungat ng kawalan ng kabutihan at aktibong paghabol, at ang nakamamatay na layunin. Ginamit ang mga talababa upang mapanatili ang lawak ng חָסֶד at ang kinatawang isahan ng Hebreo.
