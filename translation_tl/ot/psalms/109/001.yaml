base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan. Kay David.[a] Isang salmo.


    O Diyos ng aking papuri, huwag kang manahimik.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ni David,” “Para kay David,” o “Ukol kay David”; hindi tiyak ang saklaw ng pariralang Hebreo.
    reason: alternative_reading
  - marker: b
    text: O “huwag kang manatiling tahimik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ang salita sa mga pamagat ng salmo ay tumutukoy sa namumuno sa pagtatanghal ng musika. Malinaw at likas sa modernong Filipino ang pariralang ito nang hindi gumagamit ng makalumang katawagan.
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Maaaring tumukoy ang לְ sa may-akda, pinag-alayan, o kaugnayan. Pinananatili ng “Ukol kay David” ang lawak na ito at hindi ipinipilit na si David mismo ang sumulat.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwan at tumpak na katawagan sa Filipino para sa uring pampanitikan at musikal na tinutukoy.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: O Diyos na aking pinupuri
  rationale: Ang literal na anyong “Diyos ng aking papuri” ay maaaring maging malabo o hindi likas sa modernong Filipino. Ipinahahayag ng napiling salin ang malamang na ugnayan—ang Diyos ang pinatutungkulan ng papuri—habang pinananatili ang tuwirang panawagan.
- source_word: אַל תֶּחֱרַשׁ
  choice: huwag kang manahimik
  rationale: Tuwirang pakiusap na huwag manatiling tahimik o hindi tumugon ang Diyos. Natural at marangal ang “huwag kang manahimik” sa Filipino.
theological_decisions:
- issue: Kahulugan ng לְדָוִד sa pamagat
  choice: Ukol kay David
  alternative: Ni David; Para kay David; Kay David
  rationale: Hindi tiyak kung ang parirala ay nagpapahayag ng pagkatha, pag-aalay, o kaugnayan. Hindi ipinapasya ng salin ang higit sa ipinahihintulot ng Hebreo.
- issue: Ugnayan sa pariralang אֱלֹהֵי תְהִלָּתִי
  choice: O Diyos na aking pinupuri
  alternative: O Diyos ng aking papuri
  rationale: Pinipili ang natural na Filipino na nagpapahayag na ang Diyos ang pinatutungkulan ng papuri. Ang mas literal na anyo ay maaaring magpanatili ng pormal na kayarian ngunit hindi malinaw sa karaniwang mambabasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tagapangasiwa ng awitan” bilang malinaw na katawagan sa pinunong musikal, at “Ukol kay David” upang mapanatili ang tunay na kalabuan ng pamagat. Ang mga marker na [a] at [b] ay parehong nasa pangunahing teksto.
