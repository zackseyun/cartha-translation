  yaml_path: translation/ot/psalms/109/013.yaml
  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: tl
  text: Malipol nawa ang kanyang angkan[a]; sa susunod na salinlahi, mabura nawa ang kanilang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mauwi nawa sa pagkalipol ang kanyang wakas.” Ang אַחֲרִית ay maaaring mangahulugang “wakas” o “hinaharap,” ngunit sa kontekstong ito ay mas malamang na tumutukoy sa kanyang angkan o mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: nawa
  rationale: Ipinahahayag ng Qal jussive ng היה ang isang hangarin o sumpang panalangin; likas na naihahatid ito ng “nawa” sa marangal na modernong Tagalog.
- source_word: אַחֲרִיתוֹ
  choice: ang kanyang angkan
  rationale: Maaaring mangahulugan ang אַחֲרִית ng “wakas” o “hinaharap,” ngunit dahil sinusundan ito ng pagkapuksa at ng pagpawi sa pangalan sa susunod na salinlahi, tumutukoy ito rito sa nagpapatuloy na lahi o mga inapo ng taong tinutukoy.
- source_word: לְהַכְרִית
  choice: malipol
  rationale: Ang infinitive construct ng כרת na may ל ay nagpapahiwatig ng layon o kinalabasan. Ang “malipol” ay malinaw at likas na nagsasaad na lubusang maputol ang pagpapatuloy ng angkan.
- source_word: בְּדוֹר אַחֵר
  choice: sa susunod na salinlahi
  rationale: Sa konteksto, ang parirala ay tumutukoy sa salinlahing kasunod; mas malinaw ito kaysa sa literal na “sa ibang salinlahi.”
- source_word: יִמַּח
  choice: mapawi nawa
  rationale: Ang Nifal ng מחה ay nangangahulugang mabura o mapawi. Sa kaugnayan ng “pangalan,” pinananatili ng “mapawi” ang ideya ng pagkawala sa pagkakakilanlan at alaala.
- source_word: שְׁמָם
  choice: ang kanilang pangalan
  rationale: Ang hulaping maramihan ay tumutukoy sa mga bumubuo sa angkan. Pinananatili ang kolektibong isahan na “pangalan,” gaya ng Hebreo, kasabay ng panghalip na maramihang “kanilang.”
theological_decisions:
- issue: Puwersa ng sumpang panalangin sa talata
  choice: Panatilihin ang anyong panalangin o hangaring humihiling ng paghatol sa angkan ng masamang tao
  alternative: Gawing payak na hula tungkol sa kanyang hinaharap
  rationale: Ang mga jussive at ang nakapaligid na konteksto ng Awit 109 ay nagpapahayag ng mga kahilingan para sa paghatol, hindi lamang neutral na mga hula. Pinananatili ng “nawa” ang bigat at tensiyong ito nang hindi pinahihina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “angkan” upang likas na maipahayag ang kolektibong diwa ng mga inapo, at ang “salinlahi” upang mapanatili ang mataas ngunit karaniwang biblikal na rehistro.
