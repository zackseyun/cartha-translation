  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: tl
  text: Isinuot niya ang pagsumpa na parang kanyang kasuotan; pumasok iyon na parang tubig sa kanyang kaloob-looban, at parang langis sa kanyang mga buto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: Isinuot niya
  rationale: Pinananatili ang larawan ng aktibong pagsusuot nang hindi dinaragdagan ang ipinahihiwatig ng Hebreo.
- source_word: קְלָלָה
  choice: ang pagsumpa
  rationale: Maaaring tumukoy sa sumpa o sa gawaing pagsumpa; dito, ang 'pagsumpa' ay angkop sa larawan ng bagay na kusang isinusuot at kalauna'y tumatagos sa kanya.
- source_word: כְּמַדּוֹ
  choice: na parang kanyang kasuotan
  rationale: Ang מַד ay kasuotan o balabal. Ang 'kasuotan' ay natural, marangal, at hindi labis na tiyak.
- source_word: וַתָּבֹא
  choice: pumasok iyon
  rationale: Ang pambabaeng pandiwa ay tumutukoy pabalik sa קְלָלָה. Nililinaw ng 'iyon' ang sanggunian nang hindi nagdaragdag ng sanhi.
- source_word: כַמַּיִם
  choice: na parang tubig
  rationale: Tuwirang pinananatili ang paghahambing at ang larawan ng malalim na pagtagos.
- source_word: בְּקִרְבּוֹ
  choice: sa kanyang kaloob-looban
  rationale: Ang קֶרֶב ay maaaring mangahulugang panloob na bahagi o panloob na pagkatao. Ang 'kaloob-looban' ay nagpapanatili ng sadyang lawak habang umaangkop sa paralelismo ng katawan.
- source_word: וְכַשֶּׁמֶן
  choice: at parang langis
  rationale: Pinananatili nang tuwiran ang pang-ugnay at paghahambing; ipinahihiwatig ng larawan ang lubos na pagtagos.
- source_word: בְּעַצְמוֹתָיו
  choice: sa kanyang mga buto
  rationale: Natural sa Filipino ang 'pumasok ... sa kanyang mga buto' at pinananatili nito ang larawang tumatagos hanggang sa kaloob-looban.
theological_decisions:
- issue: Larawan ng pagsumpa at kung sino ang kumikilos
  choice: Inilalarawan ang taong nagsuot ng pagsumpa at ang pagpasok nito sa kanya, nang hindi tahasang sinasabing ang Diyos ang direktang nagpataw nito.
  alternative: Tahasan itong ilarawan bilang sumpang direktang ipinataw ng Diyos, o bilang sikolohikal na bunga lamang.
  rationale: 'Nakatuon ang Hebreo sa relasyon ng tao sa pagsumpa: isinuot niya ito, at pumasok ito sa kanya. Hindi tinutukoy sa talata ang tiyak na mekanismo, kaya pinananatili ang teolohikal na tensiyon.'
translation_notes:
  register: Makabagong Filipino na may dignidad at malinaw na tulang larawan. Ginamit ang 'kasuotan' at 'kaloob-looban' upang maging natural ngunit mapanatili ang malawak at matinding imahen ng Hebreo.
