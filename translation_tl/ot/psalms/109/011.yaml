  text: יְנַקֵּ֣שׁ נ֭וֹשֶׁה לְ/כָל אֲשֶׁר ל֑/וֹ וְ/יָבֹ֖זּוּ זָרִ֣ים יְגִיעֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/011.yaml
  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: tl
  text: Kamkamin nawa ng pinagkakautangan niya ang lahat ng kanyang pag-aari,[a] at dambungin nawa ng mga estranghero ang bunga ng kanyang pagpapagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siluin.” Ang pandiwang Hebreo ay maaaring mangahulugang maglagay ng silo o manghuli; dito, malamang na tumutukoy ito sa pag-angkin at pagkamkam ng pinagkakautangan sa kanyang mga ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: kamkamin
  rationale: Ipinahihiwatig ng Piel ng נקש ang pagsilo o paghuli. Sa konteksto ng isang pinagkakautangan at ng lahat ng ari-arian ng may utang, natural na ipinapahayag ng “kamkamin” ang marahas na pag-angkin o pagsamsam, habang inilalagay sa talababa ang mas literal na larawang “siluin.”
- source_word: נ֭וֹשֶׁה
  choice: pinagkakautangan niya
  rationale: Tumutukoy ito sa taong nagpautang at naniningil. Ang “pinagkakautangan niya” ay malinaw at likas sa modernong Filipino, at ipinakikita ang kaugnayan nito sa taong pinatutungkulan.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: ang lahat ng kanyang pag-aari
  rationale: Pinananatili nito ang malawak na saklaw ng parirala—lahat ng bagay na sa kanya—sa natural na Filipino.
- source_word: וְיָבֹזּוּ
  choice: dambungin
  rationale: Ang בזז ay pagkuha ng samsam sa pamamagitan ng puwersa; pinananatili ng “dambungin” ang marahas at mapang-aping diwa.
- source_word: זָרִים
  choice: mga estranghero
  rationale: Tumutukoy ito sa mga taong hindi kabilang sa sariling pamilya o pamayanan. Hindi nito nililimitahan ang kahulugan sa ibang lahi o bansa.
- source_word: יְגִיעוֹ
  choice: ang bunga ng kanyang pagpapagal
  rationale: Ang יְגִיעַ ay maaaring tumukoy sa napala o nalikha sa pagpapagal, hindi lamang sa mismong paggawa. Nililinaw ng salin na ang dinarambong ay ang pinaghirapan niyang makamit.
theological_decisions:
- issue: Puwersang panalangin o sumpa ng mga pandiwang yiqtol
  choice: Gamitin ang “nawa” upang ipahayag ang mga pandiwa bilang kahilingan o sumpa.
  alternative: 'Isalin bilang payak na panghinaharap: “Kakamkamin ... at dadambungin ...”'
  rationale: Sa konteksto ng mga sumpa sa Awit 109, mas malamang na jussive o pagpapahayag ng hangarin ang mga anyong yiqtol kaysa tuwirang hula. Pinananatili ng “nawa” ang puwersa ng panalangin o sumpa nang hindi ito ginagawang simpleng pagsasalaysay ng hinaharap.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang “kamkamin” at “dambungin” upang mapanatili ang marahas na larawan ng talata, at ang “nawa” upang malinaw ang anyong sumpa o kahilingan.
