base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: tl
  text: 'Gustung-gusto niya ang pagsumpa[a], at dumating ito sa kanya;

    hindi niya kinalugdan ang pagpapala[b], at lumayo ito sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gustung-gusto niya ang isang sumpa, at dumating iyon sa kanya.” Maaaring tumukoy ang pangngalang Hebreo sa pagsumpa bilang gawain o sa isang tiyak na sumpa.
    reason: lexical_alternative
  - marker: b
    text: O “hindi siya nasiyahan sa pagpapala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Gustung-gusto niya
  rationale: Ang Qal wayyiqtol ng אהב ay nagpapahayag ng pag-ibig, pagkagusto, o matinding pagnanais. Natural sa makabagong Tagalog ang “gustung-gusto” at pinananatili nito ang mariing kusang pagkiling ng taong tinutukoy.
- source_word: קְלָלָה
  choice: ang pagsumpa
  rationale: Maaaring tumukoy ang pangngalan sa gawain o kalagayan ng pagsumpa, o sa isang tiyak na sumpa. Pinili ang kategorikal na “pagsumpa” upang tumugma sa katapat nitong “pagpapala,” habang inilalahad sa talababa ang kongkretong pagbasa.
- source_word: וַתְּבוֹאֵהוּ
  choice: at dumating ito sa kanya
  rationale: Ang pambabaeng simuno ay tumutukoy pabalik sa קְלָלָה. Ang payak na “dumating ito sa kanya” ay tapat sa בוא at hindi nagdaragdag ng paraang hindi tahasang sinasabi ng Hebreo.
- source_word: וְלֹא חָפֵץ
  choice: hindi niya kinalugdan
  rationale: Saklaw ng חפץ ang pagkalugod, pagkasiya, at pagnanais. Ang “kinalugdan” ay natural at marangal, at pinananatili ang damdaming kaagapay ng naunang אהב.
- source_word: בִּבְרָכָה
  choice: ang pagpapala
  rationale: Ang pangngalan ay kasalungat ng קְלָלָה at pinakamainam na unawain dito bilang pangkalahatang kategoryang “pagpapala,” hindi kinakailangang isang partikular na pagpapala.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: at lumayo ito sa kanya
  rationale: Ang רחק ay nangangahulugang maging o maging lalong malayo. Ipinahahayag ng “lumayo” ang dinamikong anyo ng pandiwa at malinaw na ang pagpapala ang simuno.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may anyong patula. Pinanatili ang magkatapat na “pagsumpa” at “pagpapala,” gayundin ang sunod-sunod na mga sugnay na pinag-uugnay ng “at,” upang hindi gawing tahasang sanhi at bunga ang ugnayang ipinahihiwatig lamang ng Hebreo.
