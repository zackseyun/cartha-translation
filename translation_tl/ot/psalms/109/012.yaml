  to: Huwag sanang may magpaabot sa kanya ng kabutihang-loob,[a] ni may magpakita ng awa sa kanyang mga anak na ulila.[b]
  rationale: Pinalitan ang hindi natural na “magpatuloy ng tapat na pagmamahal” ng “magpaabot sa kanya ng kabutihang-loob” upang maipahayag ang idiomatikong gamit ng מֹשֵׁךְ חָסֶד at ang tatanggap na minarkahan ng לּוֹ. Pinanatili ang mapanumpang/jussive na lakas ng אַל יְהִי sa “Huwag sanang may ...,” pati ang parallel na negatibong kahilingan sa ikalawang sugnay.
