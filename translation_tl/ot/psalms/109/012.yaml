  naturalness: Hindi natural sa modernong Filipino ang “magpatuloy ng tapat na pagmamahal.” Mas malinaw at idiomatiko ang “magpaabot sa kanya ng kabutihang-loob.” Ang “ni may magpakita ng awa” ay nagpapanatili ng parallelismo at marangal na rehistro.
