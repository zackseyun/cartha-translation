  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: tl
  text: Huwag sanang may magpaabot sa kanya ng kabutihang-loob,[a] ni may magpakita ng awa sa kanyang mga anak na ulila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpatuloy sa pagpapakita sa kanya ng kabutihang-loob.” Literal na nagsasalita ang idyomang Hebreo tungkol sa “pag-uunat” o “pagpapahaba” ng kabutihang-loob.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak na ulila” ay maaari ring isaling “mga anak niyang nawalan ng ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: magpatuloy
  rationale: Literal itong tumutukoy sa ‘humihila’ o ‘nag-uunat,’ ngunit kasama ng חֶסֶד ay idyomatikong nangangahulugang patuloy na magpakita o magpaabot ng kabutihang-loob.
- source_word: חָסֶד
  choice: tapat na pagmamahal
  rationale: Saklaw nito ang kabutihang-loob, awa, at matapat na pag-ibig. Pinananatili ng ‘tapat na pagmamahal’ ang relational na diwa nang hindi nililimitahan iyon sa isang denominasyonal na pagbasa.
- source_word: חוֹנֵן
  choice: maawa
  rationale: Ang חנן ay pagpapakita ng biyaya, pabor, o habag. Sa konteksto ng mga ulilang anak, natural at malinaw sa modernong Filipino ang ‘maawa.’
- source_word: יְתוֹמָיו
  choice: kanyang mga anak na ulila
  rationale: Ang יָתוֹם ay ulila, at madalas ay partikular na batang walang ama. Nililinaw ng hulaping ‘kanya’ na sila ang mga anak niyang maiiwang walang ama.
- source_word: אַל יְהִי
  choice: Huwag sanang magkaroon
  rationale: Ipinahahayag ng negatibong jussive ang isang matinding kahilingan o sumpang panalangin, hindi lamang isang paglalarawan sa mangyayari.
theological_decisions:
- issue: Pagpapanatili sa tindi ng mapanumpang kahilingan
  choice: 'Isinalin bilang tuwirang kahilingan: ‘Huwag sanang magkaroon...’'
  alternative: 'Gawing pahayag tungkol sa hinaharap: ‘Walang magkakaroon...’'
  rationale: Jussive ang mga pandiwa sa Hebreo. Ang ‘huwag sana’ ay nagpapanatili sa retorikal at teolohikal na tensiyon ng imprecatoryong salmo sa halip na palambutin ito bilang simpleng prediksiyon.
- issue: Saklaw ng חֶסֶד sa gawa ng isang taong tumutulong
  choice: ‘tapat na pagmamahal’
  alternative: ‘awa’ o ‘kabutihang-loob’
  rationale: Maaaring tumukoy ang salita sa matapat na pag-ibig, awa, o kabutihang-loob. Pinili ang isang saling nagpapanatili sa katapatan at relasyonal na kulay nito, habang inilalahad sa talababa ang mas idyomatikong alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘huwag sana’ upang ipakita ang anyong kahilingan, at ang ‘ni’ upang mapanatili ang magkatimbang na dalawang sugnay.
