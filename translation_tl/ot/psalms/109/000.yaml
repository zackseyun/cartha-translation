  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: tl
  text: 'Para sa tagapanguna ng awitan. Kay David.[a] Isang salmo.


    O Diyos na aking pinupuri, huwag kang manahimik.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ni David” o “Para kay David”; hindi tiyak ang kaugnayang ipinahihiwatig ng superskripsiyon sa Hebreo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “huwag kang manatiling tahimik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng awitan
  rationale: Ipinahihiwatig ng parirala ang taong nangangasiwa sa pag-awit o pagtatanghal; natural ito sa modernong Tagalog nang hindi labis na tinutukoy ang eksaktong tungkulin.
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ang maikli at malawak na ugnayang ipinapahayag ng Hebrew לְ, na maaaring tumukoy sa akda ni David, para sa kanya, o kaugnay niya.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: O Diyos na aking pinupuri
  rationale: Natural na panawagan sa Tagalog na nagpapahayag na ang Diyos ang pinatutungkulan ng papuri ng salmista, habang iniiwasan ang mas malabong literal na 'Diyos ng aking papuri.'
- source_word: אַל־תֶּחֱרַשׁ
  choice: huwag kang manahimik
  rationale: Tuwirang inilalarawan ang pakiusap na huwag manatiling tahimik ang Diyos; ang anyong may 'kang' ay likas sa direktang panawagan sa Tagalog.
theological_decisions:
- issue: Ugnayan ni David sa salmo sa superskripsiyon
  choice: Kay David
  alternative: Ni David / Para kay David
  rationale: Hindi tiyak sa Hebrew kung ang לְדָוִד ay tahasang pagbanggit sa may-akda, pinag-ukulan, o ibang kaugnayan; pinananatili ng salin at talababa ang ambiguwidad.
- issue: Kahulugan ng pagtawag sa Diyos bilang אֱלֹהֵי תְהִלָּתִי
  choice: Diyos na aking pinupuri
  alternative: Diyos ng aking papuri
  rationale: Ang piniling anyo ay malinaw at natural, ngunit hindi nagdaragdag ng partikular na doktrinal na pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyo ng superskripsiyon at gumamit ng payak na panawagan sa Diyos. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
