  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: tl
  text: Bilang ganti sa pag-ibig ko, inaakusahan nila ako; ngunit ako ay panalangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, nang mas tahasan, “ngunit nananalangin ako” o “ngunit ako ay taong mapanalanginin.” Literal sa Hebreo, “ngunit ako ay panalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Kapalit ng
  rationale: Ipinahahayag dito ang masamang iginanti sa pag-ibig, hindi ang literal na kahulugang panlugar na “sa ilalim ng.”
- source_word: אַהֲבָתִי
  choice: pag-ibig ko
  rationale: Tuwirang isinasalin ang pangngalang tumutukoy sa pag-ibig o pagmamahal at pinananatili ang karaniwang biblikal na salita.
- source_word: יִשְׂטְנוּנִי
  choice: inaakusahan nila ako
  rationale: Ang pandiwa ay nangangahulugang kumilos bilang kalaban o mag-akusa; ang “inaakusahan” ay nagpapanatili sa posibleng mapanumbat o panghukuman nitong diwa.
- source_word: וַאֲנִי
  choice: ngunit ako
  rationale: Bagaman pormal na “at ako,” malinaw na naghuhudyat dito ang pang-ugnay ng pagsalungat sa ginagawa ng mga kaaway.
- source_word: תְפִלָּה
  choice: panalangin
  rationale: Pinananatili ang matindi at siksik na nominal na pahayag ng Hebreo—literal na “ako ay panalangin”—sa halip na agad itong gawing pandiwang “nananalangin ako.”
theological_decisions:
- issue: Diwa ng sugnay na walang pandiwa na וַאֲנִי תְפִלָּה
  choice: ngunit ako ay panalangin
  alternative: ngunit nananalangin ako; ngunit ako ay taong mapanalanginin
  rationale: Pinananatili ng pangunahing teksto ang kapansin-pansing literal na tayutay at hindi nilulutas ang siksik na diwa nito. Inilalagay sa talababa ang mas malinaw ngunit mas interpretibong mga posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino. Pinili ang “Kapalit ng” upang maging likas ang diwa ng masamang pagganti, habang sadyang pinanatili ang pambihirang pahayag na “ako ay panalangin” at ipinaliwanag ito sa talababa.
