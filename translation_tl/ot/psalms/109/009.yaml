base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: tl
  text: Maging ulila sa ama[a] ang kanyang mga anak na lalaki, at maging balo ang kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ulila.” Maaaring tumukoy ang salitang Hebreo sa mga anak na nawalan ng ama; dito, ang “ulila sa ama” ay angkop sa pagkakatapat nito sa “maging balo ang kanyang asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Maging
  rationale: Ipinahahayag nito ang yusibo o panalanging sumpa sa konteksto, sa halip na isang payak na hula sa hinaharap.
- source_word: בָנָיו
  choice: kanyang mga anak na lalaki
  rationale: Ang pangngalang בֵּן sa anyong panlalaking maramihan na may hulaping ikatlong panauhang panlalaki ay partikular na tumutukoy sa mga anak na lalaki.
- source_word: יְתוֹמִים
  choice: ulila sa ama
  rationale: Maaaring mangahulugan ang salita ng mga ulila, ngunit ang pagkakatapat nito sa asawang magiging balo ay partikular na nagpapahiwatig ng pagkawala ng ama.
- source_word: וְאִשְׁתּוֹ
  choice: at ... ang kanyang asawa
  rationale: Sa kontekstong ito, malinaw na nangangahulugang asawa ang אִשָּׁה na may hulaping panghalip; pinanatili rin ang pangatnig.
- source_word: אַלְמָנָה
  choice: balo
  rationale: Tuwirang tumutukoy ang pangngalan sa isang babaeng namatayan ng asawa; natural sa Tagalog ang panaguring 'maging balo.'
theological_decisions:
- issue: Pananalangin ng sumpa sa salmo
  choice: 'Isinalin bilang hangarin o panalangin: “Maging ...”'
  alternative: 'Panghinaharap na pahayag: “Magiging ulila ... at magiging balo ...”'
  rationale: Pinapaboran ng anyong pandiwa at kontekstong pampanitikan ng Awit 109 ang yusibo o pananalangin ng sumpa, hindi ang simpleng paghula. Pinananatili nito ang matinding retorika ng salmo nang hindi pinapalambot.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ulila sa ama” upang maging tiyak sa kahulugan, at “mga anak na lalaki” upang mapanatili ang kasariang tahasang nasa Hebreo.
