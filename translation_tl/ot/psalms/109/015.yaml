  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: tl
  text: Nawa’y palagi silang nasa harap ni Yahweh, at nawa’y pawiin niya mula sa lupa[a] ang alaala nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lupain.” Maaaring mangahulugan ang Hebreong אֶרֶץ ng “lupa” o “lupain,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: nawa silang nasa
  rationale: Ang Qal imperfect na 3mp ay may diwang jussive sa konteksto ng panalanging humihiling ng hatol; ipinahahayag ito ng “nawa.”
- source_word: נֶגֶד
  choice: sa harap ni
  rationale: Likas na pariralang Filipino para sa pagiging nasa harapan o presensiya ng isang tao, habang pinananatili ang posibleng hudisyal na himig.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: תָּמִיד
  choice: palagi
  rationale: Malinaw at natural na modernong Tagalog para sa patuloy o walang humpay na kalagayan.
- source_word: וְיַכְרֵת
  choice: at pawiin nawa niya
  rationale: Ang Hiphil imperfect ay inunawang jussive kasunod ng unang sugnay. Ang “pawiin” ay likas sa Filipino para sa lubusang pag-aalis ng alaala o pag-alaala.
- source_word: מֵאֶרֶץ
  choice: sa lupa
  rationale: Maaaring tumukoy ang אֶרֶץ sa buong lupa o sa isang lupain. Ang “lupa” ay nagpapanatili ng lawak at bahagyang kalabuan ng Hebreo.
- source_word: זִכְרָם
  choice: ang alaala nila
  rationale: Tumutukoy ito sa nananatiling pag-alaala o gunita tungkol sa kanila; natural at malinaw ang “alaala nila” sa modernong Tagalog.
theological_decisions:
- issue: Puwersang imprekatoryo/jussive ng dalawang pandiwa
  choice: 'Isinalin ang dalawang sugnay bilang mga kahilingan: “nawa silang nasa” at “pawiin nawa niya.”'
  alternative: 'Maaaring basahin bilang payak na mga pahayag sa hinaharap: “Palagi silang mapapasa harap ni Yahweh, at papawiin niya...”'
  rationale: Sa konteksto ng panalanging humihiling ng hatol, likas na may jussive o panalanging puwersa ang mga imperfect na pandiwa. Pinananatili nito ang matinding retorika at teolohikal na tensiyon ng salmo nang hindi ito pinapalambot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palagi” sa halip na mas mabigat na “patuloy,” at “pawiin” upang natural na maipahayag ang ganap na pag-aalis sa alaala. Inilagay ang talababa pagkatapos ng “lupa,” ang salitang may tunay na leksikal na alternatibo.
