  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: tl
  text: Sapagkat bumuka laban sa akin ang bibig ng masama at ang bibig ng pandaraya[a]; nagsalita sila sa akin sa pamamagitan ng dila ng kasinungalingan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang mapanlinlang na bibig.” Literal na inuulit sa Hebreo ang “bibig,” na maaaring unawaing “bibig ng pandaraya” o, sa mas karaniwang pananalita, “mapanlinlang na bibig.”
    reason: lexical_alternative
  - marker: b
    text: O “nagsalita silang kasama ko sa pamamagitan ng dila ng kasinungalingan.” Malamang na ang tinutukoy ay mapanlabang pananalitang iniuukol sa salmista, kaya “sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng panawagan ng salmista sa konteksto at pinananatili ang puwersang sanhi.
- source_word: פִי רָשָׁע
  choice: ang bibig ng masama
  rationale: Pinananatili ang konkretong larawang Hebreo; ang substantibong pang-uri ay maaaring tumukoy sa masamang tao nang hindi kinakailangang tukuyin ang kasarian.
- source_word: וּפִי מִרְמָה
  choice: at ang bibig ng pandaraya
  rationale: Pinananatili ang pag-uulit ng “bibig” at ang paralelismo. Ang מִרְמָה ay tumutukoy sa panlilinlang o pandaraya.
- source_word: עָלַי פָּתָחוּ
  choice: ibinuka laban sa akin
  rationale: Sa konteksto ng mapanlabang pananalita, ang עָלַי ay natural na “laban sa akin,” habang ang pagbuka ng bibig ay pinanatili bilang larawan.
- source_word: דִּבְּרוּ אִתִּי
  choice: nagsalita sila sa akin
  rationale: Ang אִתִּי ay literal na maaaring “kasama ko,” ngunit sa kontekstong ito ay malamang na tumutukoy sa pananalitang tuwirang ipinatutungkol sa salmista.
- source_word: לְשׁוֹן שָׁקֶר
  choice: gamit ang sinungaling na dila
  rationale: Pinananatili ang konkretong idyomang “dila” sa halip na gawing simpleng pang-abay ang parirala.
