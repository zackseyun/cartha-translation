lexical_decisions:
- source_word: דִבְרֵי
  choice: mga salita ng
  rationale: Ang pangmaramihang anyong construct ng דָּבָר ay tumutukoy rito sa mga binigkas na salita; pinananatili ng “mga salita ng” ang kaugnayan nito sa kasunod na pangngalan.
- source_word: שִׂנְאָה
  choice: poot
  rationale: Tuwirang ipinahahayag ng “poot” ang matinding pagkamuhi o pagkapoot at angkop ito sa marangal na wikang patula.
- source_word: סְבָבוּנִי
  choice: Pinalibutan ako
  rationale: Pinananatili nito ang larawan ng nagsasalitang napaliligiran ng mapoot na pananalita. Ginamit ang aspektong naganap upang katawanin ang perfect na Hebreo nang hindi inaalis ang masiglang puwersa ng tula.
- source_word: וַיִּלָּחֲמוּנִי
  choice: nilabanan nila ako
  rationale: Ipinahahayag nito ang pakikipaglaban laban sa nagsasalita, habang hindi awtomatikong nililimitahan ang larawan sa literal na digmaang militar.
- source_word: חִנָּם
  choice: nang walang dahilan
  rationale: Natural itong parirala sa modernong Filipino para sa kilos na ginawa nang walang makatarungan o wastong sanhi.
