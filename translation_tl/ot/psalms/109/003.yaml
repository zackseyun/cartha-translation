  text: Words of hatred surround me[a], and they fight against me without cause.
translation:
  language: tl
  text: Pinalibutan ako ng mga salita ng poot, at nilabanan[a] nila ako nang walang dahilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakipagdigma sila laban sa akin.” Maaaring magpahiwatig ang pandiwang Hebreo ng mas matinding larawan ng pakikipagdigma kaysa sa karaniwang “paglaban.”
