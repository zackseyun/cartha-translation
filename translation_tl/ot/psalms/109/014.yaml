  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: tl
  text: Nawa’y alalahanin ni Yahweh ang pagkakasala ng kanyang mga ninuno[a], at huwag nawang burahin ang kasalanan ng kanyang ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga ama.” Maaari ring isalin ang salitang “pagkakasala” bilang “kasamaan” o “pananagutang dulot nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: Alalahanin nawa
  rationale: Ang Niphal imperfect ay ginagamit bilang paghiling sa konteksto ng sumpa. Bagaman pasibo ang anyong Hebreo, likas sa modernong Tagalog ang aktibong 'Alalahanin nawa ni Yahweh' at malinaw nitong pinananatili ang diwa ng pag-alaala sa harap ng Diyos.
- source_word: עֲוֺן
  choice: kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutang bunga nito. Pinananatili ng 'kasamaan' ang gawaing moral na kahulugan, habang ang posibleng diwang 'guilt/pananagutan' ay kinikilala sa talababa.
- source_word: אֲבֹתָיו
  choice: kanyang mga ninuno
  rationale: Literal itong 'kanyang mga ama,' ngunit sa konteksto ay tumutukoy sa mga lalaking nauna sa angkan. Ang 'mga ninuno' ay malinaw at natural sa kasalukuyang Tagalog.
- source_word: אֶל יְהוָה
  choice: ni Yahweh
  rationale: Kasama ng זכר, ipinahihiwatig ng אֶל ang pag-alaala sa harap o presensiya ni Yahweh. Ang aktibong ayos sa Tagalog ay natural na nagpapahayag kay Yahweh bilang siyang umaalaala.
- source_word: וְחַטַּאת
  choice: at ... ang kasalanan
  rationale: Ang חַטָּאת dito ay kasalanan, hindi handog para sa kasalanan, at kahilera ito ng עָוֹן.
- source_word: אִמּוֹ
  choice: kanyang ina
  rationale: Tuwirang katumbas ng pangngalang may ikatlong panauhang panlalaking panghalip.
- source_word: אַל תִּמָּח
  choice: huwag nawang burahin
  rationale: Ang anyo ay negatibong paghiling. Ang 'burahin' ay natural sa Tagalog at pinananatili ang larawan ng pag-aalis ng isang nakatalang kasalanan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Ang 'Yahweh' ay nagpapanatili rito bilang personal at tipanang pangalan sa halip na palitan ng titulo.
- issue: Kasamaan ng mga ninuno at pananagutan ng kaaway
  choice: Hindi nilinaw kung ang inaalala ay mismong kasamaan o ang pananagutang dulot nito
  alternative: Alalahanin ang pagkakasala/pananagutan ng kanyang mga ninuno
  rationale: Saklaw ng עָוֹן ang kasamaan at ang pananagutang bunga nito. Pinananatili ng salin at talababa ang tensiyong leksikal sa halip na magtakda ng isang doktrinal na paliwanag tungkol sa minanang pananagutan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang aktibong ayos para maging likas ang pangungusap, habang pinanatili ang anyong paghiling ng imprekasyon sa mga katagang 'nawa' at 'huwag nawa.'
