  naturalness: Likas at matalinghaga sa modernong Filipino ang “Ginantihan nila ako ng masama kapalit ng mabuti.” Ang pag-uulit ng “kapalit ng” ay malinaw na naghahatid ng kahulugang pagpapalit/pagsukli ng תַּחַת at pinananatili ang paralelismo.
