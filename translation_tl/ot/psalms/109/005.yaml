translation:
  language: tl
  text: 'Ginantihan nila ako ng masama kapalit ng mabuti[a],

    at ng pagkamuhi kapalit ng aking pag-ibig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinataw nila sa akin ang masama kapalit ng mabuti.” Literal na “inilagay/ipinataw” ang pandiwang Hebreo, ngunit sa kontekstong ito ay malamang na tumutukoy sa pagganti o pagsukli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Ginantihan
  rationale: Ang שׂוּם ay literal na “maglagay/magtakda,” ngunit sa kayariang עָלַי at sa magkatumbas na mga pariralang may תַּחַת, ipinahihiwatig nito ang pagganti o pagsukli. Likas na ipinahahayag ng “ginantihan” ang diwang ito sa Tagalog.
- source_word: עָלַי
  choice: ako
  rationale: Literal itong “sa ibabaw ko/sa akin,” ngunit ang panghalip na “ako” ang likas na layon ng pandiwang “ginantihan” sa Tagalog.
- source_word: רָעָה
  choice: masama
  rationale: Pinananatili ng “masama” ang malawak na moral at mapaminsalang diwa ng רָעָה nang hindi ito nililimitahan sa pisikal na pinsala.
- source_word: תַּחַת
  choice: sa
  rationale: Sa pariralang “masama sa mabuti,” malinaw at maikli nitong ipinapahayag ang pagpapalit o pagganti—masama bilang kapalit ng mabuti.
- source_word: טוֹבָה
  choice: mabuti
  rationale: Tuwirang katumbas ito ng malawak na טוֹבָה at pinananatili ang matinding pagtutunggali ng “masama” at “mabuti.”
- source_word: וְשִׂנְאָה
  choice: at ng poot
  rationale: Ang “poot” ay isang dignificado at karaniwang pangngalang tumutukoy sa matinding pagkamuhi, at maayos itong tumutugma sa pangngalang “pag-ibig.”
- source_word: אַהֲבָתִי
  choice: aking pag-ibig
  rationale: Tuwirang pinananatili nito ang pangngalang “pag-ibig” at ang panlaping unang panauhan, nang hindi dinaragdagan ng paliwanag na “ipinakita ko.”
