translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nawa” upang mapanatili ang diwang imprekatoryo, at iniwasang idagdag ang “pagkain” sapagkat walang tahasang layon ang pandiwang “maghanap” sa Hebreo.
