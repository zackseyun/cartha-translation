translation:
  language: tl
  text: Nawa’y patuloy na magpagala-gala at mamalimos ang kanyang mga anak; maghanap nawa sila mula sa kanilang mga guho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghanap nawa sila palayo sa kanilang mga guho,” kung ang pang-ukol ay nagpapahiwatig ng paglayo sa halip na pinagmumulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנ֤וֹעַ יָנ֣וּעוּ
  choice: Nawa'y patuloy na magpagala-gala
  rationale: Ang infinitive absolute na kasunod ng imperfect mula sa נוע ay nagpapatingkad sa kilos. Ipinahahayag ng “patuloy na magpagala-gala” ang mariin o paulit-ulit na paglalagalag at ang diwang panalangin o sumpa ng konteksto.
- source_word: בָנָיו
  choice: ang kanyang mga anak
  rationale: Maaaring tumukoy ang בנים sa mga anak na lalaki o, sa mas malawak na gamit, sa mga anak. Likas at hindi labis na makitid sa modernong Filipino ang “mga anak.”
- source_word: וְשִׁאֵלוּ
  choice: at mamalimos
  rationale: Bagaman karaniwang nangangahulugang “humingi” ang שאל, ipinahihiwatig ng paglalagalag at pagkawasak sa konteksto ang paghingi ng limos. Malinaw at natural dito ang “mamalimos.”
- source_word: וְדָרְשׁוּ
  choice: maghanap nawa sila
  rationale: Tuwirang pinananatili ng “maghanap” ang kahulugan ng דרש nang hindi nagdaragdag ng di-tahasang layon gaya ng pagkain.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: sa gitna ng kanilang mga guho
  rationale: Ang חָרְבוֹת ay mga guho o wasak na lugar. Maaaring ipahiwatig ng מִן ang pinagmumulan o paglayo; ang pangunahing salin ay nagpapahayag ng paghahanap mula o sa loob ng kanilang mga guho, habang inilalahad sa talababa ang alternatibong pagbasa.
