  text: בְּ֭/הִשָּׁ֣פְט/וֹ יֵצֵ֣א רָשָׁ֑ע וּ֝/תְפִלָּת֗/וֹ תִּהְיֶ֥ה לַֽ/חֲטָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: tl
  text: Kapag nilitis siya[a], mahatulan sana siyang may sala, at maging kasalanan sana ang kanyang panalangin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapag humarap siya sa paglilitis.”
    reason: lexical_alternative
  - marker: b
    text: O “at ibilang sana na kasalanan ang kanyang panalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Kapag nilitis siya
  rationale: 'Ang ב na kasama ng Niphal infinitive construct ng שׁפט at hulaping 3ms ay temporal at pasibo: ‘kapag siya ay nilitis’ o ‘kapag humarap siya sa paglilitis.’ Natural sa modernong Filipino ang ‘Kapag nilitis siya’ at napapanatili nito ang kontekstong panghukuman.'
- source_word: יֵצֵא
  choice: lumabas sana siyang
  rationale: Ang יצא ay literal na ‘lumabas,’ ngunit sa kontekstong panghukuman ay tumutukoy sa kinahinatnan ng paglilitis. Ipinahihiwatig ng ‘sana’ ang diwang pakiusap o sumpang panalangin ng anyong jussive sa halip na simpleng panghinaharap.
- source_word: רָשָׁע
  choice: may sala
  rationale: Bagaman maaari itong mangahulugang ‘masama,’ sa kontekstong panghukuman ang רָשָׁע ay tumutukoy sa hatol na nagkasala o guilty. Ang ‘may sala’ ay malinaw, natural, at hudisyal sa Filipino.
- source_word: וּתְפִלָּתוֹ
  choice: at ... ang kanyang panalangin
  rationale: Ang תְּפִלָּה ay ‘panalangin.’ Pinagdurugtong ng ו ang ikalawang kahilingan sa una; ang ‘sana’ sa pandiwa ay nagpapakita ng kaparehong diwang imprekatoryo.
- source_word: תִּהְיֶה
  choice: maging ... sana
  rationale: Ang היה na may ל ay maaaring magpahayag ng pagiging o kinahinatnan. Ang ‘maging ... sana’ ay natural na naghahatid kapwa ng resultang diwa at ng jussive na kahilingan.
- source_word: לַחֲטָאָה
  choice: kasalanan
  rationale: Ang חֲטָאָה ay karaniwang ‘kasalanan.’ Kinakatawan ng kayariang ‘maging kasalanan’ ang ל nang hindi tahasang nilulutas kung ang panalangin mismo ay nagiging kasalanan o ibinibilang na kasalanan.
theological_decisions:
- issue: Lakas ng mga pandiwa sa konteksto ng sumpang panalangin
  choice: 'Isinalin bilang kahilingan o hangarin gamit ang ‘sana’: ‘lumabas sana ... maging ... sana.’'
  alternative: 'Isalin bilang tiyak na panghinaharap: ‘lalabas siyang ... magiging kasalanan ang kanyang panalangin.’'
  rationale: Ang konteksto ng Awit 109 at ang pagkakasunod ng mga anyong pandiwa ay pabor sa jussive o imprekatoryong diwa. Pinananatili ng ‘sana’ ang pakiusap o hangarin nang hindi ito ginagawang simpleng prediksiyon.
- issue: Ugnayan ng panalangin at kasalanan
  choice: ‘maging kasalanan ... ang kanyang panalangin’
  alternative: ‘ibilang na kasalanan ang kanyang panalangin’
  rationale: 'Pinananatili ng mas tuwirang salin ang tunay na kalabuan ng Hebrew לַחֲטָאָה: maaaring ang panalangin ay maging makasalanan o ituring na kasalanan. Hindi tahasang idinaragdag sa pangunahing teksto ang konsepto ng pagbibilang.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘nilitis,’ ‘may sala,’ at ‘panalangin’ upang mapanatili ang larawang panghukuman at panrelihiyon. Ang dalawang ‘sana’ ay natural na naghahatid ng imprekatoryong lakas nang magtunog na utos sa hukom.
