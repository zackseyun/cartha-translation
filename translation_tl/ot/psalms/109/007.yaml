  rationale: Pinalitan lamang ang literal ngunit hindi gaanong likas na ‘lumabas sana siyang may sala’ ng idiomatikong legal na ‘mahatulan sana siyang may sala.’ Pinananatili nito ang pasibong kontekstong panghukuman, ang diwang kahilingan ng teksto, at ang kahulugang ‘guilty.’ Hindi binago ang ikalawang sugnay upang mapanatili ang kalabuan kung ang panalangin ay nagiging kasalanan o itinuturing na kasalanan.
