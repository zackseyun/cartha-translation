  terminology: Panatilihin ang ‘nilitis,’ ‘mahatulang may sala,’ ‘panalangin,’ at ‘kasalanan.’ Ang mga ito ay malinaw, angkop sa rehistrong panghukuman at panrelihiyon, at walang idinagdag na interpretasyong pangdoktrina.
