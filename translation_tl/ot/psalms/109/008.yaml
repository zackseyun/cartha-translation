source:
  edition: WLC
  text: יִֽהְיֽוּ יָמָ֥י/ו מְעַטִּ֑ים פְּ֝קֻדָּת֗/וֹ יִקַּ֥ח אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/008.yaml
  text: May his days be few[a]; may another take his office.
translation:
  language: tl
  text: Nawa’y maging kakaunti ang kanyang mga araw; kunin nawa ng iba ang kanyang katungkulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamamahala,” “pananagutan,” o “posisyon.” Ang salitang Hebreo ay tumutukoy sa isang ipinagkatiwalang pananagutan o hinirang na gampanin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Nawa’y maging
  rationale: Ipinapahayag nito ang kontekstuwal na puwersang paghiling o panawagan ng anyong pandiwa, sa halip na isang payak na pahayag tungkol sa hinaharap.
- source_word: יָמָיו
  choice: ang kanyang mga araw
  rationale: Tuwirang katumbas ito ng pangngalang maramihan na may hulaping panghalip; sa konteksto, tumutukoy ito sa haba ng kanyang buhay.
- source_word: מְעַטִּים
  choice: kakaunti
  rationale: Pinananatili nito ang tuwirang diwa na kaunti sa bilang ang kanyang mga araw, na nagpapahiwatig ng maikling buhay nang hindi pinapalitan ang larawan ng Hebreo.
- source_word: פְּקֻדָּתוֹ
  choice: ang kanyang katungkulan
  rationale: Maaaring tumukoy ang salita sa ipinagkatiwalang pananagutan, pamamahala, o hinirang na tungkulin. Ang “katungkulan” ay natural sa Filipino at hindi kinakailangang magtakda ng teknikal na katungkulan sa iglesya.
- source_word: יִקַּח
  choice: kunin nawa
  rationale: Bagaman anyong imperfect ang pandiwa, kaagapay ito ng unang sugnay sa kontekstong mapanawagan; naipahahayag ng “nawa” ang puwersang jussive.
- source_word: אַחֵר
  choice: ng iba
  rationale: Natural at tuwirang katumbas ito ng isang ibang tao na kukuha sa katungkulan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa פְּקֻדָּתוֹ, na sinipi kalaunan sa Mga Gawa 1:20
  choice: katungkulan
  alternative: pamamahala, pananagutan, o posisyon
  rationale: Ipinahihiwatig ng Hebreo ang isang ipinagkatiwala o hinirang na gampanin. Pinananatili ng “katungkulan” ang diwang iyon at akma rin sa kalaunang pagsipi, ngunit hindi nito ipinapasok sa salmo ang isang tiyak na teknikal na kahulugan hinggil sa pamunuan ng iglesya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatugmang “nawa” upang mapanatili ang mapanawagang puwersa ng dalawang sugnay, at inilagay ang talababa sa “katungkulan,” ang salitang aktuwal na tinutukoy nito.
