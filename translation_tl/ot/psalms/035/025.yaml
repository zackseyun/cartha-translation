  source_fidelity: Tumpak na naipahahayag ng salin ang dalawang negatibong pakiusap na nakaatang sa Diyos (אַל + imperfect), ang lihim na pagsasalita/pag-iisip ng mga kaaway, ang mapanuyang «Aha», ang idiomatikong diwa ng נַפְשֵׁנוּ bilang pagkakamit ng kanilang ninanais, at ang metapora ng בלע bilang ‘nilamon.’ Ang idinagdag na ‘mong’ sa ‘Huwag mong hayaang’ ay ligtas na paglilinaw ng kausap na Diyos sa konteksto ng panalangin at hindi nagdaragdag ng ibang kahulugan.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang ‘Huwag mong hayaang sabihin nila’ ay angkop na panalanging pakiusap, at ang ‘nakuha natin ang gusto natin’ ay likas na katumbas ng matagumpay na sigaw. Maayos ang daloy at bantas.
  terminology: Ang ‘puso’ ay angkop para sa לֵב bilang kalooban/panloob na pag-iisip. Ang ‘Aha’ ay napapanatili ang mapanuyang pagbubunyi. Ang ‘Nilamon na natin siya’ ay tapat at matingkad na pagsasalin ng בִּלַּעֲנוּהוּ. Sapat at wasto ang talababa sa kolektibong isahan ng ‘puso.’
