  text: אַל יֹאמְר֣וּ בְ֭/לִבָּ/ם הֶאָ֣ח נַפְשֵׁ֑/נוּ אַל יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: tl
  text: Huwag mong hayaang sabihin nila sa kanilang puso[a], “Aha, nakuha natin ang gusto natin!” Huwag mong hayaang sabihin nila, “Nilamon na natin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanilang mga puso” o “sa kanilang sarili.” Kolektibong isahan ang “puso” sa Hebreo at tumutukoy sa kanilang panloob na pag-iisip.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Huwag mong hayaang sabihin nila
  rationale: Ang אַל na may imperfect/jussive ay nagpapahayag ng negatibong pakiusap sa Diyos. Ginagawang lantad ng likas na pariralang Filipino ang ipinahihiwatig na kausap nang hindi binabago ang diwa.
- source_word: בְלִבָּם
  choice: sa kanilang puso
  rationale: Pinananatili ang kolektibong isahan ng Hebreo at ang idyoma para sa lihim o panloob na pag-iisip.
- source_word: הֶאָח
  choice: Aha
  rationale: Ang padamdam ay nagpapahayag ng mapanuyang pagbubunyi; ang “Aha” ay maikli at tuwirang katumbas sa Filipino.
- source_word: נַפְשֵׁנוּ
  choice: nakuha natin ang gusto natin
  rationale: Bagaman literal na “ating nephesh,” sa kontekstong ito ay malamang na tumutukoy ang נֶפֶשׁ sa pagnanasa o kasiyahan sa pagkamit ng minimithi. Ang parirala ay natural na sigaw ng tagumpay sa Filipino.
- source_word: בִּלַּעֲנוּהוּ
  choice: Nilamon na natin siya
  rationale: Pinananatili ng “nilamon” ang matingkad na metapora ng בלע para sa ganap na pagdaig o pagwasak; ipinahihiwatig ng “na” ang ipinagmamalaking natapos na tagumpay.
