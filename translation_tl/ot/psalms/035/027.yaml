  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: tl
  text: Humiyaw nawa sa tuwa at magalak ang mga nalulugod sa pagpapatunay na nasa tama ako[a]. Lagi nawa nilang sabihin, “Dakilain nawa si Yahweh, na nalulugod sa kapayapaan[b] ng kanyang lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aking katuwiran” o “sa aking katarungan.” Ang salitang Hebreo ay maaaring tumukoy sa katuwiran sa moral o legal na diwa; dito, malamang na tumutukoy ito sa pagpapatunay na nasa tama ang mang-aawit.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapayapaan” ay maaari ring mangahulugang “kagalingan” o “mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: Humiyaw nawa sa tuwa
  rationale: Ang רנן ay tumutukoy sa malakas at masiglang sigaw ng kagalakan; natural itong ipinapahayag sa modernong Filipino bilang “humiyaw sa tuwa.”
- source_word: וְיִשְׂמְחוּ
  choice: at magalak
  rationale: Pinananatili nito ang ikalawang, kaagapay na tugon ng kagalakan sa Hebreong paralelismo.
- source_word: חֲפֵצֵי
  choice: ang mga nalulugod sa
  rationale: Ipinahahayag ng participle mula sa חפץ ang pagkagiliw o kasiyahan, hindi lamang simpleng pagnanais.
- source_word: צִדְקִי
  choice: pagkakatuwid sa akin
  rationale: Sa konteksto ng usaping legal at ng mga nag-aakusa sa awit, tumutukoy ito sa pagpapakitang nasa katuwiran ang mang-aawit. Mas malinaw ito kaysa “aking katuwiran,” na maaaring unawaing likas na moral na katangian.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: Lagi nawa nilang sabihin
  rationale: Pinananatili ng “nawa” ang jussive o hangaring diwa, at ng “lagi” ang nagpapatuloy na papuri ng תָמִיד.
- source_word: יִגְדַּל יְהוָה
  choice: Dakilain nawa si Yahweh
  rationale: Ang anyo ay isang pormula ng paghahangad sa papuri. Ang “dakilain nawa” ay natural sa Filipino at nagpapanatili sa pandiwang diwa ng גדל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: הֶחָפֵץ
  choice: na nalulugod
  rationale: Pinananatili nito ang leksikal na ugnayan sa naunang חֲפֵצֵי at ang diwa ng aktibong kasiyahan.
- source_word: שְׁלוֹם
  choice: kapayapaan
  rationale: Ito ang tuwirang salin, habang kinikilala sa talababa ang mas malawak na diwa ng kagalingan at mabuting kalagayan.
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Sa Awit, ang “lingkod” ang natural at angkop na katawagan sa kaugnayan ng mang-aawit sa Diyos.
theological_decisions:
- issue: Kahulugan ng צִדְקִי tungkol sa mang-aawit
  choice: pagkakatuwid sa akin
  alternative: aking katuwiran; katarungan para sa akin
  rationale: Ipinahihiwatig ng konteksto ng pag-uusig at mga paratang ang isang paborableng paghatol o pagpapatunay na nasa tama ang mang-aawit. Hindi nito ipinapalagay na inaangkin niya ang ganap na moral na kasakdalan; pinananatili sa talababa ang tunay na lawak ng terminong Hebreo.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang akademikong transliterasyong “Yahweh.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang ihayag ang jussive o hangaring tono ng Hebreo, at pinanatili ang paralelismo at pag-uulit ng diwa ng “nalulugod.”
