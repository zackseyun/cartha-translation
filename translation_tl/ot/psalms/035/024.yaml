  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: tl
  text: Hatulan mo akong nasa tama ayon sa iyong katuwiran[a], Yahweh, aking Diyos, at huwag mong hayaang magalak sila dahil sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa iyong katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Hatulan mo ako
  rationale: Pinananatili nito ang tuwirang hudisyal na larawan ng pandiwang שׁפט. Sa konteksto ng pagsusumamo, ang hinihingi ay isang makatarungang hatol na magpapatunay na nasa tama ang salmista, hindi simpleng neutral na pagsusuri.
- source_word: כְצִדְקְךָ
  choice: ayon sa iyong katuwiran
  rationale: Ang צֶדֶק ay tumutukoy sa matuwid at makatarungang pamantayan o katangian ng Diyos. Ang “katuwiran” ay nagpapanatili sa lawak at teolohikal na bigat ng salita; ang “katarungan” ay lehitimong alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָי
  choice: aking Diyos
  rationale: Malinaw na pinananatili ang panlaping unang panauhang isahan sa natural at marangal na Tagalog.
- source_word: וְאַל יִשְׂמְחוּ
  choice: at huwag mong hayaang magalak sila
  rationale: Ang אַל na sinusundan ng imperfect ay nagpapahayag ng negatibong pakiusap. Nililinaw ng “huwag mong hayaang” na sa Diyos nakatuon ang pagsusumamo tungkol sa kilos ng mga kaaway.
- source_word: לִי
  choice: dahil sa akin
  rationale: Sa kontekstong laban sa salmista, tumutukoy ito sa galak ng mga kaaway sa kanyang sinapit. Hindi dinaragdagan ng salin ang mas matinding ideya ng pangungutya, at pinananatili ang bahagyang lawak ng ugnayang ipinahihiwatig ng לְ.
theological_decisions:
- issue: Paglalarawan sa hinihinging hatol ng Diyos
  choice: Hatulan mo ako
  alternative: Ipagtanggol mo ang aking katuwiran
  rationale: 'Ang mas pormal na “Hatulan mo ako” ay nagpapanatili sa hudisyal na puwersa at sa tensiyong taglay ng Hebreo: inihaharap ng salmista ang sarili sa hatol ng Diyos habang umaasang mapatutunayang nasa tama siya. Ang alternatibo ay mas malinaw sa inaasahang mabuting resulta ngunit mas makitid.'
- issue: Pagpapakahulugan sa צִדְקְךָ
  choice: iyong katuwiran
  alternative: iyong katarungan
  rationale: Saklaw ng Hebreo kapwa ang matuwid na katangian at makatarungang pagkilos ng Diyos. Pinananatili ng “katuwiran” ang mas malawak na saklaw; inilalagay sa talababa ang tunay na alternatibo.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na gawing titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “Hatulan mo ako” upang mapanatili ang hudisyal na larawan ng Hebreo, habang ipinababatid ng konteksto na ang hinihingi ay pagpapatunay na nasa tama ang salmista. Ang pangalang Yahweh ay hindi pinalitan ng titulo.
