  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
translation:
  language: tl
  text: Ibinuka nila nang malaki ang kanilang mga bibig laban sa akin; sinabi nila, “Aha! Aha! Nakita na ng aming mga mata!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal sa Hebreo: “Nakita ng aming mata [ito].” Isahan ang pandiwa at ang “mata,” ngunit kolektibo ang gamit ng “mata” sa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְחִיבוּ
  choice: Ibinuka ... nang malaki
  rationale: Ang Hiphil ng רחב ay literal na “pinaluwang.” Kapag bibig ang tinutukoy, likas sa modernong Tagalog ang “ibinuka nang malaki,” at napapanatili nito ang larawan ng mapanuyang pagyayabang.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng mapanirang pananalita, ang עַל ay nagpapahayag ng pagkontra o pagkapoot, hindi lamang ng lokasyon.
- source_word: פִּיהֶם
  choice: kanilang mga bibig
  rationale: Bagaman maaaring kolektibong isahan ang “bibig” sa Hebreo, mas malinaw at natural sa Tagalog ang pamamahaging maramihan para sa maramihang simuno.
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Pinananatili ang inuulit na padamdam ng mapanuyang tuwa o pagwawagi.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Nakita ng aming mga mata!
  rationale: Pinananatili ang konkretong pagtukoy sa mga mata at hindi dinaragdagan ng tahasang layon, sapagkat walang nakasaad na layon sa Hebreo at ipinauubaya ito sa konteksto.
