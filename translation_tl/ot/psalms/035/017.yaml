  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: tl
  text: Panginoon, hanggang kailan ka manonood lamang? Iligtas mo ang buhay ko mula sa kanilang pananalanta, ang nag-iisa kong buhay mula sa mga batang leon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang aking kaisa-isa.” Isa itong patulang pahayag na malamang ay tumutukoy sa buhay ng nagsasalita; pinananatili ng salin ang diing ito bilang “ang nag-iisa kong buhay.”
    reason: Nililinaw ang literal na anyo ng יְחִידָתִי at ang patulang, bahagyang malabong kaugnayan nito sa “buhay ko,” nang hindi iniiwasan ang pangunahing diwa ng paralelismo.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Karaniwang marangal na katumbas sa modernong Tagalog para sa titulong Hebreo na Adonai.
- source_word: כַּמָּה תִרְאֶה
  choice: hanggang kailan ka manonood lamang?
  rationale: Ipinahahayag ang retorikal na hinaing na ang Panginoon ay tila nakatingin nang hindi kumikilos; ang “lamang” ay likas sa Tagalog at ipinahihiwatig ng konteksto, bagaman hindi hiwalay na salita sa Hebreo.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: Sagipin mo ang buhay ko
  rationale: Ang hifil imperative ng שוב ay maaaring mangahulugang ibalik o bawiin mula sa panganib, at ang נפשׁ dito ay tumutukoy sa buhay o sarili ng nagsasalita, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: מִשֹּׁאֵיהֶם
  choice: mula sa kanilang pananalanta
  rationale: Pinananatili ang diwa ng mapaminsalang pagsalakay o pagkawasak na dulot nila nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: מִכְּפִירִים
  choice: mula sa mga batang leon
  rationale: Tuwirang pinananatili ang larawang Hebreo ng malalakas at mapanganib na batang leon.
- source_word: יְחִידָתִי
  choice: ang kaisa-isa kong buhay
  rationale: Literal itong “ang kaisa-isa ko” sa anyong pambabae at ginagamit bilang patulang pagtukoy sa natatangi at mahalagang buhay ng nagsasalita.
theological_decisions:
- issue: Kahulugan ng נַפְשִׁי at יְחִידָתִי
  choice: Parehong isinalin bilang pagtukoy sa buhay ng salmista.
  alternative: “kaluluwa ko” at “aking kaisa-isa”
  rationale: Sa konteksto ng pagsagip mula sa marahas na kamatayan, pisikal na buhay o buong sarili ang pangunahing diwa. Hindi ipinapasok ang isang partikular na doktrina tungkol sa kaluluwa, habang pinananatili sa talababa ang kakaibang literal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan, na may patulang paralelismo. Ginamit ang “manonood lamang” upang natural na maipahayag ang hinaing na tila hindi kumikilos ang Panginoon, at “buhay” sa halip na “kaluluwa” upang tumugma sa banta ng kamatayan sa konteksto.
