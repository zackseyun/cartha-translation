  yaml_path: translation/ot/psalms/035/018.yaml
  text: I will give thanks to you in the great assembly[b][a]; among a mighty people I will praise you.
translation:
  language: tl
  text: Magpapasalamat ako sa iyo sa malaking kapulungan; sa gitna ng napakaraming tao[a], pupurihin kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gitna ng makapangyarihang bayan” o “sa gitna ng malalakas na tao.”
    reason: Maaaring tumukoy ang עָצוּם sa dami o sa lakas/kapangyarihan; hindi tiyak sa parirala kung alin ang pangunahing diin.
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Magpapasalamat ako sa iyo
  rationale: Ang Hiphil ng ידה ay karaniwang nangangahulugang magpasalamat o magpuri sa konteksto ng pagsamba. Pinili ang “magpapasalamat” upang mapanatili ang pagkakaiba nito sa אֲהַלְלֶךָ sa ikalawang hati.
- source_word: בְּקָהָל רָב
  choice: sa malaking kapulungan
  rationale: Ang קהל ay isang nagkakatipong kapulungan, at ang רב ay tumutukoy rito sa laki o dami. Ang “malaking kapulungan” ay likas at marangal na salin sa modernong Tagalog.
- source_word: בְּעַם עָצוּם
  choice: sa gitna ng napakaraming tao
  rationale: Ang עם ay “bayan/mga tao,” samantalang ang עצום ay maaaring mangahulugang makapangyarihan, malakas, o napakarami. Sa paralelismo sa “malaking kapulungan,” malamang na diin ang dami, ngunit inilalagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: אֲהַלְלֶךָ
  choice: pupurihin kita
  rationale: Ang Piel ng הלל ay tuwirang nangangahulugang pumuri. Ang “pupurihin kita” ay natural at pinananatili ang pampublikong pagpuri sa ikalawang hati.
theological_decisions: []
