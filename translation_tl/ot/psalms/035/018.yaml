  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapulungan” para sa pampublikong pagtitipon at pinag-iba ang “magpasalamat” at “pumuri” upang mapanatili ang paralelismo at leksikal na pagkakaiba ng dalawang pandiwang Hebreo.
