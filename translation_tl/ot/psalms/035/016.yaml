translation:
  language: tl
  text: Sa piling ng mga lapastangang manunuya sa handaan[a], nagngangalit ang kanilang mga ngipin laban sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa piling ng mga lapastangang manunuya para sa isang kakanin/subo.” Bihira at hindi tiyak ang salitang Hebreo na isinaling “sa handaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: Kasama ng mga lapastangan
  rationale: Ang חנף ay maaaring tumukoy sa mga lapastangan, masasama, o mapagkunwari. Ang “lapastangan” ay nagpapahayag ng kanilang moral at panrelihiyong kasamaan nang hindi nililimitahan ang diwa sa pagkukunwari; ang בְּ ay inuunawang panlipunan o pangkaugnayan, “kasama ng.”
- source_word: לַעֲגֵי
  choice: mga manunuya
  rationale: Ang anyo mula sa לעג ay tumutukoy sa mga nangungutya o nanlilibak. Ang “mga manunuya” ay natural at malinaw sa makabagong Filipino.
- source_word: מָעוֹג
  choice: sa handaan
  rationale: Bihira at hindi tiyak ang salitang ito. Maaaring kaugnay ito ng handaan, bibingka/tinapay, o isang subo. Sa konteksto, ang “sa handaan” ay maayos na naghahatid ng posibleng tagpong panlipunan, habang inilalahad sa talababa ang ibang pagbasa.
- source_word: חָרֹק
  choice: nagngangalit
  rationale: Ang חרק ay pagngangalit o paggiling ng mga ngipin bilang tanda ng matinding poot. Ang pandiwang “nagngangalit” ay idiomatiko sa Filipino at umaangkop sa tahasang sugnay.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng mapoot na pagngangalit, malinaw na ipinahahayag ng “laban sa akin” ang masamang pagharap na tinutukoy ng עַל.
- source_word: שִׁנֵּימוֹ
  choice: kanilang mga ngipin
  rationale: Tuwirang salin ng pangmaramihang pangngalan na may hulaping pangatlong panauhang panlalaking maramihan.
