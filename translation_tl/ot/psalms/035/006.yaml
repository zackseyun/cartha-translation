  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: tl
  text: Maging madilim at madulas nawa ang kanilang daan, habang[a] hinahabol sila ng anghel ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at hinahabol sila ng anghel ni Yahweh.” Maaaring unawain ang pang-ugnay sa Hebreo bilang payak na “at”; ipinahihiwatig naman ng “habang” na kasabay itong nangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Maging ... nawa
  rationale: Ang anyong jussive ng היה ay nagpapahayag ng sumpa o matinding kahilingan. Likas sa makabagong Tagalog ang “maging ... nawa” at napapanatili nito ang puwersang bolitibo.
- source_word: דַרְכָּם
  choice: ang kanilang daan
  rationale: Ang דֶּרֶךְ ay maaaring tumukoy sa literal na daan at sa matalinghagang landas o kalagayan; napapanatili ng “daan” ang dalawang posibilidad.
- source_word: חֹשֶׁךְ
  choice: madilim
  rationale: Bagaman pangngalan ang Hebreo na literal na “kadiliman,” mas natural sa Tagalog ang panaguring pang-uri na “madilim” habang pinananatili ang larawan ng panganib at kawalan ng makita.
- source_word: וַחֲלַקְלַקּוֹת
  choice: at madulas
  rationale: Ang pangmaramihang pangngalan ay tumutukoy sa madudulas o makikinis na lugar. Ang “madulas” ay malinaw at likas na kaagapay ng “madilim” nang hindi labis na ipinapaliwanag ang larawan.
- source_word: וּמַלְאַךְ יְהוָה
  choice: habang ... ang anghel ni Yahweh
  rationale: Maaaring payak na koordinasyon ang waw (“at”), ngunit maaari rin itong magpahayag ng kasabay na kalagayan. Ginamit ang “habang” para sa likas na Tagalog, at nilagyan ng talababa ang alternatibong “at.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: רֹדְפָם
  choice: hinahabol sila
  rationale: Ang רדף ay nangangahulugang humabol o tumugis. Ang “hinahabol sila” ay karaniwan at malinaw, at nananatili ang aktibo at mapanganib na diwa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang nasa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng huling sugnay sa naunang sumpa
  choice: habang hinahabol sila
  alternative: at hinahabol sila
  rationale: Maaaring ipakahulugan ang waw bilang kasabay na kalagayan o bilang payak na pag-uugnay. Pinili ang mas natural na “habang” sa pangunahing teksto at pinanatili sa talababa ang tunay na alternatibong “at.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masidhing panalangin sa anyong “nawa,” ang larawang madilim at madulas na daan, at ang personal na pangalang Yahweh.
