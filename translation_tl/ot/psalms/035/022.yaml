  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: tl
  text: Nakita mo, Yahweh; huwag kang manahimik.[a] Panginoon, huwag kang lumayo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “huwag kang patuloy na manahimik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: Nakita mo ito
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki at isahan ng ראה ay nagsasaad na nakita na ng Diyos ang nangyayari. Idinagdag ang “ito” bilang likas na layon sa Filipino, na tumutukoy sa kawalang-katarungang nasa konteksto, nang hindi nililinaw pa kung ano mismo iyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang titulong “Panginoon,” upang mapanatili ang pagkakaiba nito sa אֲדֹנָי sa kasunod na linya.
- source_word: אַל תֶּחֱרַשׁ
  choice: huwag kang manahimik
  rationale: Ang חרשׁ dito ay nangangahulugang manatiling tahimik o hindi tumugon. Likas sa modernong Filipino ang “huwag kang manahimik” at pinananatili nito ang pakiusap na kumilos o tumugon ang Diyos.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ginamit bilang banal na titulong “Panginoon.” Hindi ito ginawang “aking Panginoon” sapagkat karaniwan itong gumaganap bilang nakapirming banal na titulo sa ganitong gamit.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: huwag kang lumayo sa akin
  rationale: Pinananatili ng “lumayo sa akin” ang relasyonal at panlugar na talinghaga ng רחק na may מן at hulaping unang panauhan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Personal na pangalan ang יְהוָה sa unang panawagan, samantalang אֲדֹנָי ang titulong “Panginoon” sa ikalawa. Pinananatili ng salin ang sinadyang pagkakaibang ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang tuwirang panawagan at magkatulad na pakiusap upang mapanatili ang paralelismo ng tulang Hebreo.
