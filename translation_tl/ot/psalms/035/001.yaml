base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: tl
  text: 'Kay David.[a]


    Yahweh, makipagtunggali ka sa mga kumakalaban sa akin;

    makipaglaban ka sa mga nakikipaglaban sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Ni David” o “Para kay David.” Hindi tiyak kung ang Hebreong pamagat ay nagsasaad ng may-akda, kaugnayan, o pag-aalay. Ang “Makipagtunggali ka” sa kasunod na linya ay maaari ring unawain sa legal na diwa: “Ipaglaban mo ang usapin ko laban sa mga kumakalaban sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Ang לְ na sinusundan ng pangalan sa pamagat ng isang awit ay maaaring magpahiwatig ng pagkakatha, kaugnayan, o pag-aalay. Likas sa Filipino ang “Kay David” at hindi nito nililimitahan ang diwa sa “Isinulat ni David.”
- source_word: רִיבָה
  choice: labanan mo
  rationale: Ang pautos na anyo ng ריב ay maaaring tumukoy sa pakikipagtalo o paglilitis, at mas malawak sa pakikipaglaban o pagsalungat. Pinananatili ng “labanan mo” ang malawak na puwersa nito at ang pagkakatugma sa kasunod na linyang militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֶת יְרִיבַי
  choice: ang mga lumalaban sa akin
  rationale: Ang anyong mula sa ריב na may hulaping unang panauhan ay tumutukoy sa mga nakikipagtunggali sa salmista. Ang sugnay na ito ay natural sa modernong Filipino at inuulit ang ugat na diwa ng unang pandiwa.
- source_word: לְחַם
  choice: makipaglaban ka
  rationale: 'Ang pautos mula sa לחם ay may malinaw na diwang militar: lumaban o makidigma. Ang “makipaglaban ka” ay tuwiran, marangal, at karaniwan sa Filipino.'
- source_word: אֶת לֹחֲמָי
  choice: sa mga nakikipaglaban sa akin
  rationale: Ang aktibong anyo mula sa לחם na may hulaping unang panauhan ay tumutukoy sa mga aktuwal na nakikipaglaban sa salmista. Pinananatili ng salin ang pag-uulit ng pandiwang nasa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang personal na pangalan na יְהוָה. Pinananatili itong pangalan, hindi pinapalitan ng titulong “PANGINOON.”
- issue: Legal o pangkalahatang diwa ng ריב
  choice: labanan mo
  alternative: ipaglaban mo ang usapin ko
  rationale: May legal na gamit ang ריב ngunit maaari rin itong mangahulugan ng mas malawak na pakikipagtunggali. Hindi tahasang binabanggit sa Hebreo ang “usapin ko,” kaya pinili sa pangunahing teksto ang mas malawak na salin at inilagay sa talababa ang legal na posibilidad.
translation_notes:
  register: Modernong Filipino na tuwiran ngunit marangal. Ginamit ang “Kay David” upang mapanatili ang kalabuan ng pamagat, at inulit ang “laban” upang maipakita ang magkatugmang pandiwa at mga kalaban sa dalawang hati ng taludtod.
