  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: tl
  text: Naglakad-lakad ako na para bang kaibigan ko siya, para bang kapatid ko siya[a]; yumuko akong nanlulumo[b], gaya ng isang nagluluksa para sa kanyang ina[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Gaya ng isang kaibigan, gaya ng isang kapatid sa akin, naglakad-lakad ako.” Maaaring ilarawan ng Hebreo ang matalik niyang pakikitungo sa taong iyon, o ihambing ang taong iyon sa isang kaibigan at kapatid niya.'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay literal na may diwang “nagdilim” at tumutukoy rito sa lugmok at madilim na anyo ng isang nagdadalamhati.
    reason: lexical_alternative
  - marker: c
    text: O “gaya ng isang nagluluksa para sa isang ina.” Walang panghalip na “kanyang” sa Hebreo, ngunit likas itong ipinahihiwatig sa paghahambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רֵעַ
  choice: na para bang kaibigan siya
  rationale: Ang רֵעַ ay “kaibigan” o “kasamahan,” at ang כְּ ay naghahayag ng paghahambing. Idinagdag ang “siya” ayon sa konteksto upang maging likas sa Tagalog, habang inilalagay sa talababa ang mas literal at hindi tiyak na kayarian.
- source_word: כְּ/אָח לִ/י
  choice: na para bang sarili ko siyang kapatid
  rationale: Ang אָח ay literal na “kapatid,” at ang לִי ay “sa akin/para sa akin.” Ipinahahayag ng “sarili ko siyang kapatid” ang matalik na ugnayang nilalaman ng parirala nang hindi ginagawang biyolohikal na kapatid ang tinutukoy.
- source_word: הִתְהַלָּכְתִּי
  choice: Naglakad-lakad ako
  rationale: Ang Hitpael ng הלך ay maaaring tumukoy sa paglalakad-lakad o sa paraan ng pagkilos/pamumuhay. Pinananatili ng salin ang kongkretong larawan, habang ipinahihiwatig ng buong parirala ang pakikitungo niya sa taong iyon.
- source_word: כַּ/אֲבֶל אֵם
  choice: gaya ng isang nagluluksa para sa kanyang ina
  rationale: Ang אֲבֵל ay isang nagluluksa, at ang אֵם ay “ina.” Pinananatili itong hiwalay na paghahambing, sa halip na ihalo sa kahulugan ng קֹדֵר.
- source_word: קֹדֵר
  choice: nanlulumo
  rationale: Ang קֹדֵר ay literal na may diwang “madilim” at naglalarawan ng madilim o lugmok na anyo ng nagdadalamhati. Ang “nanlulumo” ay malinaw at likas na katumbas sa makabagong Tagalog.
- source_word: שַׁחֽוֹתִי
  choice: yumuko ako
  rationale: Ang pandiwa ay nangangahulugang yumuko o mabaluktot pababa. Pinananatili ng “yumuko” ang pisikal na larawan ng tindig na pinabigat ng dalamhati.
