translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “naglakad-lakad” upang panatilihin ang kongkretong larawang Hebreo, “nanlulumo” para sa idyomang may diwang pagdidilim, at malinaw na pinaghiwalay ang pagkalugmok sa paghahambing sa nagluluksa para sa ina. Ang mga talababa ay nagpapanatili sa sintaktikong at referensiyal na kalabuan ng unang hati at sa kawalan ng tahasang panghalip sa “ina.”
