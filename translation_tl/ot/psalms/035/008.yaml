base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: tl
  text: Dumating nawa sa kanya ang kapahamakan nang hindi niya namamalayan[a]; mahuli nawa siya ng lambat na itinago niya. Sa kapahamakan ding iyon[b] ay mahulog nawa siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na: “Dumating nawa sa kanya ang kapahamakan; hindi niya alam.” Maaari ring isalin: “Dumating nawa sa kanya nang di-inaasahan ang pagkawasak.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ang huling panghalip sa Hebreo ay maaaring tumukoy sa kapahamakan o sa lambat. Kung sa lambat: “at mahulog nawa siya roon,” na nagbibigay-diin na siya ang nasilo ng sarili niyang bitag.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: Dumating nawa sa kanya
  rationale: Pinananatili ang pandiwang בוא, “dumating,” at ang panalanging/jussive na diwa ng konteksto sa pamamagitan ng “nawa.”
- source_word: שׁוֹאָה
  choice: kapahamakan
  rationale: Saklaw nito ang mapaminsalang pagkawasak o pagbagsak at likas itong pakinggan sa makabagong Tagalog sa dalawang paglitaw ng salita.
- source_word: לֹא יֵדָע
  choice: nang hindi niya namamalayan
  rationale: Natural na ipinahahayag ang literal na “hindi niya alam” bilang kawalan ng kamalayan sa pagdating ng kapahamakan.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: ang lambat na itinago niya
  rationale: Ang רשת ay lambat, at ang טמן ay magtago o magkubli; malinaw sa sugnay na siya mismo ang nagtago nito.
- source_word: תִּלְכְּדוֹ
  choice: mahuli nawa siya
  rationale: Ang לכד ay “humuli/dakpin”; sa larawan ng lambat, “mahuli” ang pinakanatural na katumbas.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: Sa kapahamakan ding iyon ay mahulog nawa siya
  rationale: Itinuturing ang hulíng pambabaeng panghalip bilang resumptive na tumutukoy sa שׁוֹאָה at ipinahahayag ang diin sa “ding iyon,” habang inilalagay sa talababa ang tunay na alternatibong pagtukoy nito sa lambat.
theological_decisions:
- issue: Sumpang panalangin laban sa kaaway
  choice: Pinanatili ang panalanging “nawa” sa tatlong kilos.
  alternative: Isalin bilang tiyak na hula na “darating” at “mahuhulog.”
  rationale: Ang mga anyong pandiwa at konteksto ay angkop sa paghiling o panalangin; hindi dapat pahupain o gawing tiyak na hula ang tensiyon ng imprekatoryong salmo.
- issue: Tinutukoy ng hulíng בָּהּ
  choice: Kapahamakan ang tinutukoy sa pangunahing teksto.
  alternative: 'Maaaring lambat ang tinutukoy: “mahulog nawa siya roon.”'
  rationale: Parehong pambabae sa Hebreo ang “lambat” at “kapahamakan.” Ang inuulit na בְּשׁוֹאָה at resumptive na בָּהּ ay maaaring magbigay-diin sa kapahamakan, ngunit tunay na posible ang pagtukoy sa lambat kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago at marangal na Tagalog; ginamit ang “nawa” upang malinaw ang panalanging diwa. Iniwasan ang sobrang literal ngunit alanganing pag-uulit na “sa kapahamakan…dito,” at iningatan sa talababa ang gramatikal na kalabuan ng hulíng pambabaeng panghalip.
