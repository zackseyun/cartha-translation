id: PSA.35.15
reference: Psalms 35:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: tl
  text: Ngunit sa pagkatisod ko[a], nagsaya sila at nagtipon; nagtipon sila laban sa akin—mga nananakit[b] na hindi ko kilala.[c] Niluray nila ako at hindi sila tumigil.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagkapilay ko” o “nang ako'y madapa.” Maaaring tumukoy ang Hebreo sa pisikal na pagkapilay o, sa mas malawak na diwa, sa sandali ng panghihina o pagbagsak.
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang salitang Hebreo. Maaari rin itong mangahulugang “mga humahampas,” o marahil ay tumukoy sa “mga naghihirap” o “mga pilay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagtipon sila laban sa akin nang hindi ko nalalaman.”
    reason: syntactic_alternative
  - marker: d
    text: Maaari ring “niluray nila ako at hindi sila tumahimik,” kung ang larawan ay tumutukoy sa walang tigil na panlalait sa halip na tuloy-tuloy na pisikal na pag-atake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: sa pagkatisod ko
  rationale: Sinasaklaw ng “pagkatisod” ang sandali ng panghihina o pagbagsak, habang nananatiling posible ang literal na diwa ng pagkapilay.
- source_word: שָׂמְחוּ
  choice: nagsaya sila
  rationale: Likas at tuwirang katumbas ito ng pandiwang nagsasaad ng tuwa, dito ay masamang tuwa sa sinapit ng salmista.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: at nagtipon; nagtipon sila
  rationale: Pinanatili ang pag-uulit ng pandiwa sa Hebreo upang maipahayag ang diin at sunod-sunod na pagkilos.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Ipinahahayag nito nang natural sa Filipino ang mapanlabang gamit ng literal na “sa ibabaw/ukol sa akin.”
- source_word: נֵכִים
  choice: mga nananakit
  rationale: Bihira at hindi tiyak ang salitang Hebreo. Ang kahulugang kaugnay ng paghampas o pananakit ang higit na umaangkop sa agarang konteksto, ngunit inilalahad sa talababa ang ibang posibilidad.
- source_word: וְלֹא יָדַעְתִּי
  choice: na hindi ko kilala
  rationale: Binabasa ang parirala bilang panuring sa mga nananakit. Posible ring tumukoy ito sa kawalan ng kaalaman ng salmista tungkol sa kanilang pagtitipon, kaya binanggit ang alternatibo sa talababa.
- source_word: קָרְעוּ
  choice: niluray nila ako
  rationale: Pinananatili ng “niluray” ang marahas na larawan ng pagpunit o paglapastangan nang hindi tiyakang nagpapasya kung pisikal o pasalita ang pag-atake.
- source_word: וְלֹא דָמּוּ
  choice: at hindi sila tumigil
  rationale: Ang ugat ay maaaring mangahulugang tumigil o tumahimik. Ang “hindi tumigil” ay natural sa konteksto, samantalang inilalagay sa talababa ang posibleng “hindi tumahimik.”
theological_decisions:
- issue: Ang kaugnayan ng וְלֹא יָדַעְתִּי sa נֵכִים
  choice: 'Itinuring itong panuring: “mga nananakit na hindi ko kilala.”'
  alternative: “Nagtipon sila laban sa akin nang hindi ko nalalaman.”
  rationale: Parehong posible sa sintaks. Pinili sa pangunahing teksto ang maayos na pagbasa bilang panuring, ngunit hindi inalis ang alternatibong nagsasaad na lingid sa salmista ang kanilang pagkilos.
- issue: Kung pisikal o pasalita ang pagpunit
  choice: Pinanatili ang matalinghagang larawang “niluray.”
  alternative: Maaaring tumukoy sa walang tigil na panlalait o paninira.
  rationale: Hindi nililinaw ng talata kung literal na pananakit o marahas na pananalita ang tinutukoy, kaya iniwasang lutasin nang tahasan ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pag-uulit ng “nagtipon” at ang marahas na larawan ng Hebreo. Ginamit ang “mga nananakit” bilang madaling maunawaang salin ng isang bihira at pinagtatalunang salita, kalakip ang mga alternatibo sa talababa.
