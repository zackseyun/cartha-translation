  text: Tumitindig ang mga saksing marahas[a]; tinatanong nila ako tungkol sa mga bagay na hindi ko alam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bulaang saksi” o “mga saksing may masamang hangarin”; literal sa Hebreo, “mga saksi ng karahasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: Bumangon
  rationale: Mula sa קום; inilalarawan dito ang pagharap o pagtindig ng mga saksing salungat sa nagsasalita. Pinananatili ng “bumangon” ang masiglang larawan ng Hebreo nang hindi labis na ipinapaliwanag ang legal na tagpo.
- source_word: עֵדֵי חָמָס
  choice: mga saksing mapanakit
  rationale: Literal na “mga saksi ng karahasan/pang-aapi.” Ang “mapanakit” ay likas sa modernong Tagalog at sumasaklaw sa mapaminsala at di-makatarungang katangian ng kanilang pagsaksi, nang hindi ito pinakikitid agad sa “mga bulaang saksi.”
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: mga bagay na hindi ko alam
  rationale: Walang tahasang layon ang sugnay sa Hebreo. Minimal na idinagdag ang “mga bagay” para maging malinaw at natural sa Tagalog habang pinananatili ang pahayag ng kawalang-alam ng nagsasalita.
- source_word: יִשְׁאָלוּנִי
  choice: tinatanong nila ako tungkol sa
  rationale: Ang שׁאל ay maaaring mangahulugang magtanong, sumangguni, o humingi. Sa mapanlabang konteksto, malinaw ngunit hindi labis ang “tinatanong nila ako tungkol sa”; ang “iniimbestigahan” o “iniinteroga” ay mas tiyak kaysa sa mismong pandiwa.
