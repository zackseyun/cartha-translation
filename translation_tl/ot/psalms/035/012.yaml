  text: 'Ginagantihan nila ako ng masama kapalit ng mabuti;

    naulila ang aking buhay.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pagkawalan/pangungulila para sa aking nefesh.” Ang nefesh ay maaaring mangahulugang “buhay,” “sarili,” “kaluluwa,” o panloob na pagkatao. Maaari ring isalin ang parirala bilang “pagkawalan sa akin” o “pangungulila ng aking kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: Ginagantihan nila ako
  rationale: Ang Piel ng שׁלם ay tumutukoy rito sa pagganti o paggawad ng kapalit. Likas sa modernong Tagalog ang “ginagantihan nila ako” at malinaw na ipinahihiwatig ang masamang sukli.
- source_word: רָעָה
  choice: ng masama
  rationale: Saklaw ng salita ang kasamaan at kapinsalaan. Pinananatili ng “masama” ang moral at mapanakit na bigat nito nang hindi nagdaragdag ng detalye.
- source_word: תַּחַת טוֹבָה
  choice: sa kabutihang ginawa ko
  rationale: Ang תַּחַת ay naghahayag ng kapalit o sukli. Nililinaw ng “kabutihang ginawa ko” ang likas na diwa ng parirala sa Tagalog, samantalang nananatili ang pagtutunggali ng masama at mabuti.
- source_word: שְׁכוֹל
  choice: nagdadalamhating parang namatayan
  rationale: Karaniwang tumutukoy ang שְׁכוֹל sa pangungulila dahil sa pagkamatay, madalas ng anak. Ipinahahayag ng salin ang tindi ng pagdadalamhati ngunit hindi ipinapalagay na literal na may namatay.
- source_word: לְנַפְשִׁי
  choice: ang kalooban ko
  rationale: Maaaring mangahulugan ang נֶפֶשׁ ng buhay, sarili, kaluluwa, o panloob na pagkatao. Ang “kalooban ko” ay natural na Tagalog para sa emosyonal na kalagayan dito, habang inilalahad sa talababa ang iba pang maaaring diwa.
theological_decisions:
- issue: Ugnayan ng pariralang שְׁכוֹל לְנַפְשִׁי sa unang sugnay
  choice: Isinalin bilang kasunod na sugnay na naglalarawan sa kalagayan ng nagsasalita
  alternative: “pangungulila sa aking kaluluwa” bilang pariralang walang pandiwa
  rationale: Walang tahasang pandiwa ang Hebreo, kaya maaaring basahin ang parirala bilang resulta o paglalarawan ng sinapit ng nagsasalita. Ang buong sugnay ay mas malinaw sa Tagalog, ngunit pinananatili sa talababa ang literal at likas na malabong anyo.
translation_notes:
  register: Makabagong Filipino Tagalog na patula at marangal. Ginamit ang “parang namatayan” upang maipahayag nang natural ang matinding larawan ng שְׁכוֹל, at inilagay sa talababa ang mas literal at sadyang malabong anyo ng Hebreo.
