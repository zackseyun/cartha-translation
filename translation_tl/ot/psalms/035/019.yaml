  source_fidelity: Kailangan ng maliit ngunit mahalagang rebisyon. Ang “sa aking kapahamakan” ay nagdaragdag ng tiyak na pagbagsak o kapahamakan na hindi tahasang nasa Hebreo; ang לִי ay mas maingat na maisasalin bilang “laban sa akin” sa kontekstong ito. Ang pangunahing salin ay dapat ding magpanatili, hangga’t maaari, sa siksik na kalabuan ng אֹיְבַי שֶׁקֶר.
  naturalness: Mas natural at marangal sa makabagong Filipino ang “magalak laban sa akin” kaysa “matuwa sa aking kapahamakan.” Ang “magkindat” ay nauunawaan at pinananatili ang kongkretong idyoma; ang masamang layon nito ay sapat na naipapaliwanag sa talababa.
  terminology: Ang “kabulaanan” ay angkop na katapat ng שֶׁקֶר at iniiwasang ipagkamali ito sa “nang walang dahilan” (חִנָּם). Ang “nang walang dahilan” ay tapat at likas para sa חִנָּם.
