lexical_decisions:
- source_word: אַל יִשְׂמְחוּ לִי
  choice: Huwag mong hayaang matuwa sa aking kapahamakan
  rationale: Ang אַל kasama ng imperfect ay panalanging pagbabawal; likas sa Tagalog ang “Huwag mong hayaang.” Ang לִי ay literal na “sa/para sa akin,” ngunit sa konteksto ay mas malinaw na pagtuwa sa sinapit o kapahamakan ng salmista.
- source_word: אֹיְבַי שֶׁקֶר
  choice: ang mga kaaway kong nagsisinungaling
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang pariralang Hebreo. Pinananatili ng salin ang ugnayan sa שֶׁקֶר, “kasinungalingan,” nang hindi ito ipinagkakamaling “walang dahilan,” na katumbas ng חִנָּם sa kasunod na linya.
- source_word: שֹׂנְאַי חִנָּם
  choice: ang mga napopoot sa akin nang walang dahilan
  rationale: Ang participle ay tumutukoy sa mga patuloy na napopoot, at ang חִנָּם ay nagpapahayag na walang batayan o dahilan ang kanilang poot.
- source_word: יִקְרְצוּ עָיִן
  choice: magkindat nang may masamang pakahulugan
  rationale: Pinananatili ang konkretong larawan ng pagkindat, habang nililinaw na isa itong mapanlibak o lihim na masamang senyas at hindi karaniwang magiliw na kindat.
