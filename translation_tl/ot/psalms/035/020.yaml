  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: tl
  text: 'Sapagkat hindi kapayapaan ang kanilang sinasalita;

    sa halip, laban sa mga namumuhay nang tahimik sa lupain[a]

    ay nagpapakana sila ng mga salitang mapanlinlang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga mapayapa sa lupain” o “mga panatag sa lupain.” Malamang na tumutukoy ang pariralang Hebreo sa mga taong namumuhay nang tahimik at mapayapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang pagsusumamo o reklamo at likas ang daloy sa konteksto ng salmo.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: hindi sila nagsasalita ng kapayapaan
  rationale: Pinananatili ang 'kapayapaan' bilang layon ng pagsasalita, sa halip na gawing pang-abay, upang manatili ang diwa na hindi nakatuon sa kapayapaan o pakikipagkasundo ang kanilang sinasabi.
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ito ang karaniwan at malawak na katumbas na maaari ring magpahiwatig ng kagalingan at maayos na kalagayan.
- source_word: וְעַל
  choice: kundi laban sa
  rationale: Malinaw na ipinahahayag ang pagsalungat sa pagitan ng hindi nila ginagawa at ng aktuwal nilang binabalak.
- source_word: רִגְעֵי אֶרֶץ
  choice: mga namumuhay nang tahimik sa lupain
  rationale: Likas sa modernong Tagalog at ipinahahayag ang malamang na pagtukoy sa mga taong payapa at hindi nanggugulo, habang kinikilala sa talababa ang ibang posibleng pagbasa.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: mga salitang mapanlinlang
  rationale: Natural na Tagalog para sa Hebreong pariralang tumutukoy sa mga salitang may panlilinlang.
- source_word: יַחֲשֹׁבוּן
  choice: nagpapakana sila
  rationale: Ipinahahayag ang sinasadya at masamang pagbabalak, hindi lamang ang simpleng pag-iisip.
