  text: At magsasalita ang aking dila tungkol sa iyong katuwiran[a] at sa papuri sa iyo buong araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong katarungan.” Maaaring tumukoy ang salitang Hebreo kapwa sa katuwiran at sa katarungan, lalo na rito sa konteksto ng pagbibigay-katarungan.
