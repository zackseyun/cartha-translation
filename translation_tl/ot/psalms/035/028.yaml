    text: Ang pandiwang Hebreo ay maaari ring mangahulugang “magbulay-bulay,” “bumigkas nang mahina,” o “bumigkas.” Dahil ang “dila” ang simuno at papuri ang konteksto, malamang na pagsasalita ang diwa. Iisang pandiwa ang sumasaklaw sa “iyong katuwiran” at “papuri sa iyo.”
