lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: At magsasalita ang aking dila
  rationale: Pinananatili ang literal na larawang “aking dila” bilang metonimiya para sa pagsasalita, pati ang pangatnig na nag-uugnay sa naunang talata.
- source_word: תֶּהְגֶּה
  choice: magsasalita
  rationale: Maaaring tumukoy ang pandiwa sa mahinang pagbigkas, pagbulay-bulay, o pagsasalita. Dahil “dila” ang simuno at papuri ang konteksto, mas malamang na tinig na pagpapahayag ang tinutukoy; hindi tinutukoy ng salin ang lakas o paraan ng pagsasalita.
- source_word: צִדְקֶךָ
  choice: iyong katuwiran
  rationale: Saklaw ng salitang Hebreo kapwa ang pagiging matuwid ng Diyos at ang makatarungan niyang pagkilos sa pagbibigay-katarungan. Pinananatili ng “katuwiran” ang mas malawak na diwa.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Natural na makabagong Tagalog para sa idyomang nangangahulugang sa kahabaan ng buong araw.
- source_word: תְּהִלָּתֶךָ
  choice: magpupuri sa iyo
  rationale: Ginawang likas na pandiwang Tagalog ang literal na “iyong papuri.” Ipinahihiwatig nito ang papuring iniuukol sa Diyos nang hindi nagpapasok ng ibang ideya gaya ng pag-awit.
theological_decisions:
- issue: Kahulugan ng צִדְקֶךָ sa konteksto ng pagbibigay-katarungan ng Diyos
  choice: iyong katuwiran
  alternative: iyong katarungan
  rationale: Maaaring tukuyin ng Hebreo kapwa ang likas na katuwiran ng Diyos at ang kanyang makatarungang pagtatanggol sa salmista. Ang “katuwiran” ang pinili sa teksto upang mapanatili ang lawak ng kahulugan, habang inilalagay sa talababa ang kontekstuwal na alternatibo.
- issue: Pag-uugnay ng iisang pandiwang Hebreo sa “katuwiran” at “papuri”
  choice: magsasalita … at magpupuri
  alternative: magsasalita tungkol sa iyong katuwiran at sa papuri sa iyo
  rationale: Iisa lamang ang tahasang pandiwa sa Hebreo, ngunit ang tuwirang pag-uulit ng estruktura ay magiging alanganin at maaaring magpahiwatig na pinag-uusapan lamang ang papuri. Ang dalawang likas na pandiwang Tagalog ay nagpapahayag ng gapped parallelism nang hindi binabago ang pangunahing diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang poetikong larawang “aking dila,” ngunit ginawang likas sa Tagalog ang ikalawang hati sa pamamagitan ng “magpupuri sa iyo.”
