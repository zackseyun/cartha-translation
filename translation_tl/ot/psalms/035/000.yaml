  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: tl
  text: 'Kay David.


    Makipagtalo ka, Yahweh, sa mga nakikipagtalo sa akin;

    makipaglaban ka sa mga nakikipaglaban sa akin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ang maikli at likas na pamagat na maaaring magpahiwatig ng pag-akda, pag-uukol, o kaugnayan kay David nang hindi nilulutas ang likas na lawak ng parirala.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: Makipagtalo ka ... sa mga nakikipagtalo sa akin
  rationale: Ang ריב ay maaaring tumukoy sa pakikipagtalo o paglilitis ng usapin; pinananatili ng 'makipagtalo' ang legal at mas malawak na diwa, pati ang pag-uulit ng ugat sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulong 'PANGINOON.'
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: makipaglaban ka sa mga nakikipaglaban sa akin
  rationale: Likas na Filipino ito at pinananatili ang malinaw na paralelismo at pag-uulit ng ugat na nasa Hebreo.
theological_decisions:
- issue: Ang banal na pangalan יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang transliterasyon ay nagpapanatili sa pagkakakilanlan nito bilang personal na pangalan at sumusunod sa ibinigay na source-grounded English consultation layer.
- issue: Legal o pangkalahatang diwa ng ריב
  choice: makipagtalo
  alternative: ipagtanggol mo ang aking usapin
  rationale: Hindi nililimitahan ng 'makipagtalo' ang pahayag sa isang eksenang hukuman at pinananatili ang sinadyang pagtutumbas sa mga kalaban ng nagsasalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at masinsing paralelismo ng Hebreong tula, gayundin ang superskripsiyong hiwalay sa pangunahing taludtod.
