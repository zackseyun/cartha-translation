- source_word: שַׁחַת רִשְׁתָּם
  choice: ang hukay na may lambat nila
  rationale: Pinananatili ang dalawang konkretong larawan—hukay at lambat—habang nagbibigay ng mauunawaang pangunahing pagbasa; inilalahad sa talababa ang hindi tiyak na relasyon ng dalawang pangngalan.
- source_word: חָפְרוּ
  choice: naghukay
  rationale: Tuwirang katumbas na nagpapanatili sa konkretong larawan ng paghahanda ng patibong.
- source_word: לְנַפְשִׁי
  choice: laban sa buhay ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o sarili ng mang-aawit, hindi lamang sa ‘kaluluwa’ sa makitid na teolohikal na diwa.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto
  choice: buhay ko
  alternative: kaluluwa ko / laban sa akin
  rationale: Ang banta ay nakatuon sa mismong buhay at pagkatao ng mang-aawit; iniiwasan nitong ipasok ang mas huling dikotomiya ng katawan at kaluluwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pag-uulit ng “walang dahilan” at ang konkretong larawan ng hukay at lambat. Hindi lubusang nilutas sa pangunahing teksto ang malabong ugnayan ng “hukay” at “lambat”; ipinaliwanag ang mga posibleng pagbasa sa talababa.
