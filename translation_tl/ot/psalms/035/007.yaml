lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng panawagan ng mang-aawit sa konteksto at pinananatili ang ugnayang sanhi.
- source_word: חִנָּם
  choice: walang dahilan
  rationale: Ipinahahayag nitong walang makatarungang dahilan ang kanilang paglusob; inulit sa dalawang sugnay gaya ng Hebreo.
- source_word: טָמְנוּ
  choice: ikinubli
  rationale: Pinananatili ang diwa ng pagtatago o pagkukubli ng isang bitag.
- source_word: לִי
  choice: para sa akin
