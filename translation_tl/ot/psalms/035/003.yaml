  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: tl
  text: Ilabas mo ang sibat at harangan mo ang daan ng mga humahabol sa akin.[a] Sabihin mo sa aking kaluluwa, “Ako ang iyong kaligtasan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilabas mo ang sibat at ang palakol-pandigma laban sa mga humahabol sa akin,” kung ang וּסְגֹר ay inuunawang pangalan ng sandata sa halip na pandiwang nangangahulugang “harangan” o “isara ang daan.”
    reason: alternative_reading
  - marker: b
    text: O “Ako ang iyong pagliligtas.” Maaaring tumukoy ang salitang Hebreo sa pagsagip mula sa isang tiyak na panganib at sa kaligtasan sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Bunutin mo
  rationale: Ang Hiphil imperative ng ריק ay tumutukoy rito sa paglalabas o pagbunot ng sandata; natural sa Filipino ang “bunutin” para sa paghahandang gumamit nito.
- source_word: חֲנִית
  choice: ang sibat
  rationale: Karaniwang katumbas ng חֲנִית ang “sibat,” at akma ito sa larawang pandigma.
- source_word: וּסְגֹר
  choice: harangan
  rationale: Bilang pandiwa, nangangahulugan itong magsara o pumigil. Sa konteksto, ang likas na diwa ay hadlangan ang mga humahabol, bagaman posible ring pangalan ito ng isang sandata.
- source_word: לִקְרַאת רֹדְפָי
  choice: ang mga humahabol sa akin
  rationale: Ipinahihiwatig ng לִקְרַאת ang pagharap laban sa kanila; sa Filipino, sapat nang naipapahayag ng “harangan” ang paghaharap, habang malinaw na isinasalin ang participle at hulaping unang panauhan.
- source_word: אֱמֹר לְנַפְשִׁי
  choice: Sabihin mo sa aking kaluluwa
  rationale: Pinananatili ng “kaluluwa” ang patula at personal na lakas ng נֶפֶשׁ sa halip na gawing payak na “sa akin.”
- source_word: יְשֻׁעָתֵךְ אָֽנִי
  choice: Ako ang iyong kaligtasan
  rationale: Nauuna at mariing binibigyang-diin ng malayang panghalip na אָֽנִי ang Diyos bilang mismong kaligtasan ng nagsasalita.
theological_decisions:
- issue: Kahulugan ng יְשׁוּעָה sa panalangin para sa agarang pagsagip
  choice: kaligtasan
  alternative: pagliligtas
  rationale: Kasama sa salita ang konkretong pagsagip sa panganib at ang mas malawak na diwa ng kaligtasan. Pinananatili ng “kaligtasan” ang lawak na iyon nang hindi ipinapasok ang isang mas huling sistemang doktrinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang tuwirang mga pautos na “Bunutin,” “harangan,” at “Sabihin,” at pinanatili ang patulang “aking kaluluwa.” Inilagay ang mga pananda ng talababa sa mismong tekstong pangunahing salin.
