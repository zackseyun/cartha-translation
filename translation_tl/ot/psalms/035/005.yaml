  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: tl
  text: Maging gaya sana sila ng ipa sa harap ng hangin, at itinataboy sila ng anghel ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang itinataboy sila ng anghel ni Yahweh.” Ang pang-ugnay na Hebreo ay maaari ring unawain bilang nagpapahiwatig ng kasabay na kilos, at ang pandiwa ay maaari ring mangahulugang “itinutulak palayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Maging ... sana sila
  rationale: Ipinahahayag nito ang diwang paghiling o panalangin ng anyong pandiwa sa konteksto, hindi isang payak na pahayag tungkol sa hinaharap.
- source_word: כְּמֹץ
  choice: gaya ... ng ipa
  rationale: Ang מֹץ ay tumutukoy sa magaan na ipa o dayaming tinatangay sa paggiik; pinananatili ng salin ang paghahambing.
- source_word: לִפְנֵי רוּחַ
  choice: sa harap ng hangin
  rationale: Malapit ito sa literal na larawan ng Hebreo at nagpapahiwatig na ang ipa ay lantad sa pagtangay ng hangin.
- source_word: וּמַלְאַךְ יְהוָה
  choice: habang ... ang anghel ni Yahweh
  rationale: Ginagamit ang “habang” upang likas na iugnay sa Filipino ang kasabay na kilos, samantalang kinikilala sa talababa na maaari ring payak na “at” ang pang-ugnay. Ang מַלְאָךְ sa pariralang ito ay isinaling “anghel,” at pinanatili ang pangalang Yahweh.
- source_word: דּוֹחֶה
  choice: itinataboy sila
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy at marahas na pagtataboy o pagtulak. Idinagdag ang layong “sila,” na malinaw na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ na “sugo” o “anghel,” ngunit sa nakaugaliang pariralang ito ay malamang ang makalangit na mensahero. Hindi nililinaw ng salin ang higit pa sa sinasabi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “Maging ... sana” ay natural na naghahatid ng panalanging maparusahan ang mga kaaway; ang “ipa sa harap ng hangin” ay sadyang nagpapanatili sa matalinghagang larawan ng Hebreo.
