base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: tl
  text: Sasabihin ng lahat ng aking buto, “O PANGINOON, sino ang tulad mo? Inililigtas mo ang dukha mula sa mas malakas kaysa sa kanya, at ang dukha at nangangailangan mula sa nagnanakaw sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: lahat ng aking buto
  rationale: Pinananatili ang matingkad na idyomang Hebreo na tumutukoy sa buong pagkatao ng nagsasalita, sa halip na palitan ito ng paliwanag lamang.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Gumagamit ng nakaugaliang salin sa Tagalog para sa banal na pangalan, na nasa malalaking titik upang maiba sa karaniwang titulong Panginoon.
- source_word: עָנִי
  choice: dukha
  rationale: Ang salita ay maaaring tumukoy sa mahirap, api, o naghihirap; ang “dukha” ay maikli at natural, at angkop sa kontekstong may makapangyarihang nananamantala.
- source_word: אֶבְיוֹן
  choice: nangangailangan
  rationale: Ipinahahayag ang kalagayan ng taong kapos at nangangailangan nang hindi inuulit lamang ang “dukha.”
- source_word: גֹּזְלוֹ
  choice: nagnanakaw sa kanya
  rationale: Tuwirang inilalarawan ang taong kumukuha o nang-aagaw ng pag-aari ng mahina.
theological_decisions:
- issue: Pahayag na walang katulad ang Diyos
  choice: sino ang tulad mo?
  alternative: walang tulad mo
  rationale: Pinananatili ang retorikal na tanong ng Hebreo at ang lakas ng papuri nito nang hindi ginagawang tahasang deklarasyon.
- issue: Pagkakakilanlan ng inililigtas
  choice: dukha ... dukha at nangangailangan
  alternative: api ... api at nangangailangan
  rationale: Pinanatili ang pangunahing kahulugan ng karalitaan habang hindi isinasara ang posibilidad na kasama rito ang pang-aapi at paghihirap.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang konkretong larawang “lahat ng aking buto” at ang parallelismong Hebreo; gumamit ng “PANGINOON” bilang tradisyonal na representasyon ng YHWH.
