base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: tl
  text: Gumising ka at bumangon para sa katarungang ukol sa akin[a], Diyos ko at Panginoon ko, para sa aking usapin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa hatol na ukol sa akin” o “upang bigyan ako ng katarungan.” Ang salitang Hebreo ay maaaring tumukoy sa hatol, katarungan, o legal na pagpapatunay na tama ang isang panig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa aking kaso” o “para sa aking alitan.” Legal na pagtatalo o usaping pinagtatalunan ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: Gumising ka
  rationale: Isang mariing pakiusap sa Diyos na kumilos; pinananatili ng “gumising” ang talinghaga ng tila hindi pagkilos ng Diyos.
- source_word: וְהָקִיצָה
  choice: at bumangon
  rationale: Ikalawang pandiwa ng paggising na nagpapatindi sa pakiusap. Ginawang “bumangon” upang maging natural sa Tagalog at mapanatili ang dalawang magkaugnay na utos.
- source_word: לְמִשְׁפָּטִי
  choice: para sa hatol na nauukol sa akin
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa hatol, katarungan, o pagpapawalang-sala. Pinananatili ng salin ang legal na diwa at ang kaugnayan nito sa salmista nang hindi tiyak na ipinapakahulugang pabor sa kaniya ang magiging hatol.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang salin ng anyong may unang panauhang panaguri at pinanatili bilang pagtawag.
- source_word: וַאדֹנָי
  choice: at Panginoon ko
  rationale: Banal na titulong ginagamit sa tuwirang pagtawag sa Diyos; “Panginoon” ang likas at marangal na katumbas sa Tagalog.
- source_word: לְרִיבִי
  choice: para sa aking usapin
  rationale: Ang רִיב ay legal na alitan, kaso, o usaping pinagtatalunan. Ang “usapin” ay natural at hindi kasing-kitid ng “demanda.”
theological_decisions:
- issue: Ang magkatambal na pantawag na אֱלֹהַי וַאדֹנָי
  choice: Diyos ko at Panginoon ko
  alternative: Diyos ko at Amo ko
  rationale: Kapuwa pantawag sa Diyos ang mga titulo. Ang “Panginoon” ay angkop sa panalangin at hindi nagdaragdag ng anumang partikular na kristolohikal na pahayag sa salmo.
- issue: Kung ang מִשְׁפָּטִי ay dapat tahasang isaling pagpapawalang-sala
  choice: hatol na nauukol sa akin
  alternative: pagbibigay-katarungan sa akin
  rationale: Hindi tahasang nilulutas ng salin ang posibleng kahulugan bilang hatol, katarungan, o legal na pagpapatunay na nasa panig ng salmista.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Pinanatili ang agarang pag-uutos at ang legal na larawan ng talata, habang ipinaliliwanag sa talababa ang tunay na lawak ng kahulugan ng mga salitang Hebreo.
