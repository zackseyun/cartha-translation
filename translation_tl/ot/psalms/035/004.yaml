  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: tl
  text: Mapahiya at malagay sa kahihiyan ang mga naghahangad ng buhay ko[a]; umurong at madusta ang mga nagbabalak na ipahamak ako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga naghahanap sa aking kaluluwa”; sa idyomang Hebreo rito, ang ibig sabihin ay mga naghahangad na kitilin ang buhay ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga nagbabalak ng masama laban sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mapahiya
  rationale: Likas at tuwirang ipinahahayag nito ang pagdanas ng kahihiyan; ang anyong pakiusap o sumpa sa konteksto ay naipakikita sa pangungusap na nagsisimula sa pandiwa.
- source_word: וְיִכָּלְמוּ
  choice: at malagay sa kahihiyan
  rationale: Pinananatili nito ang pasibo o resultang diwa ng Niphal at ang pagpapaigting sa unang pandiwa, kahit may sinadyang pag-uulit sa larangan ng kahihiyan.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ang mga naghahangad ng buhay ko
  rationale: Sa mapanlabang kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay ng salmista, hindi lamang sa panloob na sarili o 'kaluluwa.'
- source_word: יִסֹּגוּ אָחוֹר
  choice: umurong
  rationale: Natural na Filipino ito para sa pag-atras o pagkabigo na ipinahahayag ng pandiwa kasama ng אָחוֹר, nang hindi inuulit ang ideya ng 'paatras.'
- source_word: וְיַחְפְּרוּ
  choice: at madusta
  rationale: Sa konteksto, tumutukoy ito sa pagkapahiya o pagkadusta, hindi sa literal na paghuhukay; bahagya rin itong naihihiwalay sa naunang mga salitang ukol sa kahihiyan.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: ang mga nagbabalak na ipahamak ako
  rationale: Ipinahahayag ng חֹשְׁבֵי ang sadyang pagpaplano, at ang רָעָתִי ay pinsala o kasamaang nilalayon laban sa nagsasalita.
theological_decisions:
- issue: Puwersang panalangin o sumpa ng mga imperfect na pandiwa
  choice: 'Isinalin bilang hangarin o pakiusap: ''Mapahiya... umurong...'''
  alternative: 'Pahayag na panghinaharap: ''Mapapahiya sila... uurong sila...'''
  rationale: Sa konteksto ng panalangin, ang mga anyo ay likas na gumaganap bilang kahilingan para sa paghatol, hindi lamang bilang hula; hindi nito tinutukoy kung paano isasagawa ng Diyos ang paghatol.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding pananalita ng panalanging mapanumbat at ang magkakatulad ngunit hindi ganap na magkasingkahulugang mga salita para sa kahihiyan.
