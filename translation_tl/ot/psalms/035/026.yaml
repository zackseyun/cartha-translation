  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong panalangin sa pamamagitan ng “nawa,” ang paralelismong patula, at ang metapora ng pagbibihis. Inilagay ang talababa sa pariralang הַמַּגְדִּילִים עָלָי na siyang aktuwal na tinutukoy ng alternatibong leksikal.
