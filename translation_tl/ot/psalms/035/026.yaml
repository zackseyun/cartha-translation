base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: tl
  text: "Sabay-sabay nawa silang mapahiya at malagay sa kahihiyan,\n    silang natutuwa sa aking kapahamakan;\nmabihisan nawa ng kahihiyan at kadustaan\n    ang mga nagmamataas laban sa akin.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga nag-aangat ng kanilang sarili laban sa akin” o “mga nagmamapuri laban sa akin.” Sa Hebreo, literal itong tumutukoy sa mga nagpapalaki sa kanilang sarili sa ibabaw ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mapahiya
  rationale: Ang Qal imperfect na nasa konteksto ng panalangin o kahilingan ay ipinahayag sa “nawa.” Ang “mapahiya” ay likas sa modernong Tagalog at nagpapanatili sa diwang mapabulaanan at mawalan ng dangal.
- source_word: וְיַחְפְּרוּ
  choice: at hamakin
  rationale: Sa kontekstong ito, ang חפר ay tumutukoy sa pagdanas ng kahihiyan o paghamak. Pinili ang “hamakin” upang maipakita ang ikalawang, magkaugnay ngunit hindi ganap na magkaparehong pahayag ng kahihiyan.
- source_word: יַחְדָּו
  choice: sabay-sabay
  rationale: Ipinahahayag nito na iisa at magkakasabay ang sasapiting kalagayan ng buong pangkat.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: silang natutuwa sa aking kapahamakan
  rationale: Ang רָעָתִי rito ay ang pinsala o masamang sinapit ng salmista, hindi ang sarili niyang moral na kasamaan. Ang “kapahamakan” ay malinaw at natural sa Tagalog.
- source_word: יִלְבְּשׁוּ
  choice: mabihisan nawa
  rationale: Pinananatili nito ang metaporang Hebreo na ang isang kalagayan ay parang damit na isinusuot.
- source_word: בֹשֶׁת
  choice: kahihiyan
  rationale: Karaniwang katumbas ito ng pangngalan at nagpapatuloy sa pangunahing tema ng talata.
- source_word: וּכְלִמָּה
  choice: at kadustaan
  rationale: Ang “kadustaan” ay natural na katuwang ng “kahihiyan” at nagpapahiwatig ng pampublikong pagkawala ng dangal.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: ang mga nagmamataas laban sa akin
  rationale: Ipinahahayag ng Hiphil participle ng גדל kasama ng עַל ang mapagmataas na pagpapalaki sa sarili laban sa o sa ibabaw ng iba. Natural ang “nagmamataas laban sa akin” habang pinananatili ang diwa ng pag-aangat sa sarili.
