  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: tl
  text: At ang aking kaluluwa ay magagalak kay Yahweh; lubos itong magsasaya sa kanyang pagliligtas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: At ang aking kaluluwa
  rationale: Pinananatili ng “kaluluwa” ang makatang pagtukoy sa buong panloob at personal na sarili. Ang וְ ay likas na isinalin na “At,” na nag-uugnay sa talata sa naunang pakiusap nang hindi ipinipilit ang temporal na “Pagkatapos.”
- source_word: תָּגִיל
  choice: ay magagalak
  rationale: Ang pandiwang גיל ay nagpapahayag ng kagalakan; malinaw at marangal sa modernong Tagalog ang “magagalak.”
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ipinahahayag ng ב ang pinagtutuunan o pinagmumulan ng kagalakan. Likas sa Tagalog ang “kay” para sa personal na pangalang Yahweh.
- source_word: תָּשִׂישׂ
  choice: lubos itong magsasaya
  rationale: Ang שׂישׂ ay masiglang kagalakan. Idinagdag ang “lubos” upang maipakita ang pag-igting ng ikalawang kaagapay na linya nang hindi inuulit lamang ang “magagalak.”
- source_word: בִּישׁוּעָתוֹ
  choice: sa kanyang pagliligtas
  rationale: Sa konteksto ng pagliligtas mula sa mga kaaway, kongkreto at natural ang “pagliligtas,” habang saklaw pa rin nito ang diwang soteriolohikal ng יְשׁוּעָה. Pinananatili ng “sa” ang kaagapay na anyo ng dalawang parirala.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng יְשׁוּעָה
  choice: pagliligtas
  alternative: kaligtasan
  rationale: Ang konteksto ng Awit 35 ay kongkretong pagsagip mula sa mga kaaway, kaya ang “pagliligtas” ang mas agarang kahulugan. Hindi nito nililimita ang mas malawak na saklaw ng salita sa ibang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na patula ngunit madaling maunawaan. Ginamit ang “kaluluwa” upang mapanatili ang imahen ng Hebreong tula, at “lubos itong magsasaya” upang maipakita ang tumitinding paralelismo.
