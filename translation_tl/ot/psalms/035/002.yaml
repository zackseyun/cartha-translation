translation:
  language: tl
  text: Hawakan mo ang kalasag at ang malaking kalasag[a], at bumangon ka upang tulungan ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalawang magkaibang salita para sa kalasag ang ginamit sa Hebreo; ang ikalawa ay malamang na tumutukoy sa mas malaking pananggalang sa katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Humawak ka
  rationale: Ang pautos na anyo ng חזק ay tumutukoy rito sa aktuwal na paghawak o pagkuha ng sandata bilang paghahanda. Pinananatili ng “Humawak ka” ang kongkretong larawang pandigma at natural ito sa makabagong Filipino.
- source_word: מָגֵן
  choice: kalasag
  rationale: Karaniwang salita ito para sa kalasag. Ang payak na “kalasag” ang pinakanatural na katumbas sa Filipino.
- source_word: צִנָּה
  choice: malaking kalasag
  rationale: Tumutukoy ito sa mas malaking pananggalang sa katawan at naiiba sa מָגֵן. Nililinaw ng “malaking kalasag” ang pagkakaiba ng dalawang terminong Hebreo nang hindi gumagamit ng luma o di-pamilyar na katawagan.
- source_word: וְקוּמָה
  choice: at bumangon ka
  rationale: Ang pautos na anyo ng קום na may paragogic he ay naghahayag ng marubdob na pakiusap na kumilos. Ang “bumangon ka” ay natural at nagpapanatili sa larawan ng agarang pagkilos.
- source_word: בְּעֶזְרָתִי
  choice: upang tulungan ako
  rationale: Bagaman pangngalan ang עֶזְרָה, ang parirala ay idyomatikong humihiling ng pagkilos alang-alang sa salmista. Mas natural sa Filipino ang “upang tulungan ako” kaysa sa literal na “para sa aking tulong.”
theological_decisions:
- issue: Paglalarawan sa Diyos sa pamamagitan ng larawang pandigma
  choice: Panatilihin ang literal na larawan ng paghawak sa dalawang uri ng kalasag at pagbangon upang tumulong.
  alternative: Palambutin bilang pangkalahatang kahilingan para sa proteksiyon.
  rationale: Tahasang pandigma at metaporikal ang Hebreo, na inilalarawan ang Diyos bilang mandirigmang tagapagtanggol. Hindi dapat gawing abstraktong kahilingan lamang ang malinaw na larawan ng pinagmulang teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang inulit ang “kalasag” na may panuring na “malaking” upang mapanatili ang pagkakaiba ng dalawang terminong Hebreo nang hindi gumagamit ng teknikal o lipas na salita.
