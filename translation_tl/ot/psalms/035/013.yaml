  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: tl
  text: Ngunit ako, nang sila ay magkasakit, sako ang aking kasuotan[b]. Nagpakumbaba ako sa pamamagitan ng pag-aayuno[c], at ang aking panalangin ay bumalik sa aking sariling dibdib[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring ipakahulugan: “bumalik sa akin ang aking panalangin nang walang sagot,” o “bumalik sa akin ang pakinabang ng aking panalangin.” Malabo ang idyomang Hebreo at maaaring mangahulugang hindi nabago ng kanyang pananalangin ang kanilang pagkapoot, o na sa kanya bumalik ang pakinabang nito.'
    reason: alternative_reading
  - marker: b
    text: Ang sako ay magaspang na kasuotang isinusuot bilang tanda ng pagluluksa, matinding dalamhati, o pagsisisi.
    reason: cultural_note
  - marker: c
    text: Sa literal, “pinahirapan ko ang aking sarili sa pag-aayuno,” isang idyomang Hebreo para sa pagpapakumbaba at pagkakait sa sarili sa pamamagitan ng pag-aayuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: nang sila ay magkasakit
  rationale: Ipinahahayag ng ב na temporal kasama ng anyong mula sa חלה at hulaping pangmaramihan ang panahon ng kanilang pagkakasakit. Likas sa makabagong Tagalog ang “nang sila ay magkasakit.”
- source_word: לְבוּשִׁי שָׂק
  choice: sako ang aking kasuotan
  rationale: Pinananatili nito ang walang-pandiwang sugnay na literal na “ang aking kasuotan [ay] sako” at ang diin sa kalagayan ng nagdadalamhati.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: nagpakumbaba ako sa pamamagitan ng pag-aayuno
  rationale: Sa kontekstong ito, ang piel ng ענה kasama ng נֶפֶשׁ at pag-aayuno ay idyoma para sa pagpapakumbaba o pagkakait sa sarili. Inihahatid ng salin ang diwang reflexive nang hindi gumagamit ng di-likas na “pinahirapan ko ang aking kaluluwa.”
- source_word: וּתְפִלָּתִי
  choice: at ang aking panalangin
  rationale: Tuwirang salin ng pangngalan; ipinagdurugtong ng pangatnig ang kanyang pag-aayuno at pananalangin para sa kanila.
- source_word: עַל חֵיקִי
  choice: sa aking sariling dibdib
  rationale: Ang חֵיק ay maaaring tumukoy sa dibdib, kandungan, o tupi ng damit sa may dibdib. Pinananatili ng “dibdib” ang larawang Hebreo, at ipinakikita ng “sariling” na sa kanya bumalik ang panalangin.
- source_word: תָשׁוּב
  choice: bumalik
  rationale: Ang שוב ay nangangahulugang bumalik o magbalik. Ang nagdaang anyong Tagalog ay umaayon sa pagsasalaysay, samantalang hindi nito nilulutas ang kahulugan ng idyoma.
theological_decisions:
- issue: Kahulugan ng “ang aking panalangin ay bumalik sa aking sariling dibdib”
  choice: Pinanatili sa pangunahing teksto ang larawang Hebreo nang hindi tiyakang ipinapakahulugang hindi sinagot ang panalangin o na ang pakinabang nito ay bumalik sa salmista.
  alternative: “bumalik sa akin ang aking panalangin nang walang sagot” o “bumalik sa akin ang pakinabang ng aking panalangin”
  rationale: Tunay na malabo ang idyomang Hebreo. Ang pagpapanatili sa metapora ay umiiwas sa pagpasok ng isang tiyak na pagpapakahulugang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at makatang ayos ng talata, pati ang di-tiyak na larawan ng panalanging bumabalik sa dibdib. Ginamit ang “sako” bilang pamilyar na terminong biblikal, na nilinaw sa talababa.
