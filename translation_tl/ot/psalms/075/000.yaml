  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: “Huwag Mong Wasakin.”[a] Isang salmo ni Asaf.[b] Isang awit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring ito ang pamagat ng isang himig o isang tagubiling musikal: “Huwag Mong Wasakin.”'
    reason: cultural_note
  - marker: b
    text: Ang “ni Asaf” ay maaaring magpahiwatig na siya ang may-akda, na may kaugnayan sa kaniya ang salmo, o na kabilang ito sa kalipunang inuugnay kay Asaf.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Tumutukoy ang salita sa nangangasiwa sa musikal na pagtatanghal. Likas sa modernong Filipino ang pariralang ito at hindi nito nililimitahan ang tungkulin sa koro lamang.
- source_word: אַל תַּשְׁחֵת
  choice: “Huwag Mong Wasakin”
  rationale: Pinananatili ang payak na kahulugan ng pandiwa at itinuturing ang parirala bilang pamagat, himig, o tagubiling musikal, gaya ng ipinahihiwatig ng konteksto ng pamagat ng salmo.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ito sa ganitong uri ng komposisyong patula at musikal sa Mga Salmo.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Natural itong anyo sa Filipino, ngunit maaaring tumukoy ang Hebreong pang-ukol sa pagkatha, kaugnayan, o pagkabilang sa kalipunang inuugnay kay Asaf; nililinaw ang saklaw na ito sa talababa.
- source_word: שִׁיר
  choice: Isang awit
  rationale: Pinananatili bilang hiwalay na katawagan ang ikalawang paglalarawan sa genre sa halip na isama lamang sa ‘salmo.’
