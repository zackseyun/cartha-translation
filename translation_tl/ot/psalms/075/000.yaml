translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa ng awitan” upang ipahayag ang musikal na tungkulin nang hindi ipinapalagay na koro lamang ang pinamumunuan. Pinanatiling magkahiwalay ang “salmo” at “awit,” at inilagay kaagad ang bawat pananda ng talababa pagkatapos ng pariralang ipinaliliwanag nito.
