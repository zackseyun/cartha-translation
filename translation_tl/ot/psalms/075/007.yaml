  text: כִּֽי אֱלֹהִ֥ים שֹׁפֵ֑ט זֶ֥ה יַ֝שְׁפִּ֗יל וְ/זֶ֣ה יָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/007.yaml
  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: tl
  text: Sapagkat ang Diyos ang hukom:[a] ibinababa niya ang isa, at itinataas naman ang iba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Sapagkat humahatol ang Diyos.” Ang participle sa Hebreo ay maaaring unawain bilang pandiwa o bilang panaguring tila pangngalan.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “ang isang ito ay ibinababa niya, at ang isang ito ay itinataas niya”—isang paraan ng pagsasabing “ang isa ... ang iba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag sa naunang pahayag; likas sa makabagong Tagalog ang “Sapagkat” sa ganitong ugnayan.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Isahan ang diwa ayon sa panaguri at konteksto; “ang Diyos” ang malinaw at karaniwang salin.
- source_word: שֹׁפֵט
  choice: ang hukom
  rationale: Maaaring gamitin ang participle bilang panaguring tila pangngalan. Pinananatili ng “ang hukom” ang diin sa tungkulin ng Diyos, habang inilalahad sa talababa ang posibleng pandiwang pagbasa.
- source_word: זֶה ... וְזֶה
  choice: ang isa ... naman ang iba
  rationale: 'Distributibo ang inuulit na demonstrative: literal na “ang isang ito ... at ang isang ito.” Ang “ang isa ... ang iba” ay likas sa Tagalog, at ipinahihiwatig ng “naman” ang pagtutulad na may pagsalungat.'
- source_word: יַשְׁפִּיל
  choice: ibinababa niya
  rationale: Ang Hiphil ng שׁפל ay sanhiang pagpapababa o pagpapakumbaba. Pinananatili ng “ibinababa” ang larawang patayo at ang kaagapay nitong “itinataas.”
- source_word: יָרִים
  choice: itinataas
  rationale: Ang Hiphil ng רום ay nangangahulugang magtaas o magpadakila. Ang “itinataas” ay malinaw, natural, at nagpapanatili sa metaporang katapat ng “ibinababa.”
theological_decisions:
- issue: Ang papel ng Diyos bilang hukom sa pariralang אֱלֹהִים שֹׁפֵט
  choice: ang Diyos ang hukom
  alternative: humahatol ang Diyos
  rationale: Pinahihintulutan ng Hebreo ang nominal at pandiwang diwa. Pinananatili sa pangunahing teksto ang nominal na diin sa papel ng Diyos bilang hukom, ngunit hindi inaalis ang pandiwang posibilidad, na inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ibinababa ... itinataas” upang mapanatili ang magkatapat na larawang patayo sa Hebreo. Inilagay ang mga pananda ng talababa kaagad sa mga bahaging nililinaw ng mga ito.
