  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: tl
  text: Natutunaw ang lupa at ang lahat ng naninirahan dito[a]; ako mismo ang nagpatibay sa mga haligi nito.[b] Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nalulusaw,” “natitinag,” o “nagigiba.” Ang larawang Hebreo ay nagpapahiwatig ng kawalang-katatagan o pagbagsak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itinatag ko ang mga haligi nito” o “ginawa kong matibay ang mga haligi nito.”
    reason: lexical_alternative
  - marker: c
    text: Karaniwang isinusulat bilang “Selah” ang salitang ito; hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: natutunaw
  rationale: Pinananatili nito ang matingkad na larawang Hebreo ng pagkatunaw o pagkawasak na nagpapahiwatig ng kawalang-katatagan at nalalapit na pagbagsak.
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Ang pagbanggit sa lahat ng naninirahan dito at sa mga haligi nito ay pumapabor sa malawak at kosmikong diwa kaysa sa isang tiyak na lupain.
- source_word: יֹשְׁבֶיהָ
  choice: ang lahat ng naninirahan dito
  rationale: Likas ito sa modernong Filipino at pinananatili ang pandiwang diwa ng Hebreong participle.
- source_word: אָנֹכִי
  choice: ako mismo
  rationale: Ipinahahayag nito ang diin ng hiwalay na panghalip nang hindi nagdaragdag ng ideyang eksklusibo na wala sa teksto.
- source_word: תִכַּנְתִּי
  choice: nagpatatag
  rationale: Sa kaugnayan ng mga haligi, malinaw nitong ipinahahayag ang pagtatayo o pagpapanatiling matibay na saklaw ng pandiwa.
- source_word: עַמּוּדֶיהָ
  choice: mga haligi nito
  rationale: Pinananatili ang kongkreto at makatang larawang kosmolohikal ng pinagmulang teksto.
- source_word: סֶּלָה
  choice: Selah
  rationale: Isinalin sa baybay sa halip na bigyan ng tiyak na kahulugan, sapagkat hindi tiyak ang eksaktong gamit ng salita.
theological_decisions:
- issue: Makatang larawan ng mga haligi ng lupa
  choice: Panatilihin nang tuwiran ang “mga haligi nito.”
  alternative: mga pundasyon nito; mga suhay nito
  rationale: Ipinahahayag ng sinaunang makatang larawan ang nagpapatatag na paghahari ng Diyos. Hindi ito dapat baguhin upang umayon sa makabagong paliwanag na siyentipiko o gawing abstraktong paraphrase.
- issue: Pagkakakilanlan ng nagsasalitang “ako”
  choice: Panatilihin lamang ang diin bilang “ako mismo.”
  alternative: ako lamang
  rationale: May diin ang panghalip sa Hebreo, ngunit hindi nito kinakailangang ipahayag ang eksklusibong “ako lamang”; iniiwasan ng salin ang teolohikal na labis na pagpapaliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “natutunaw” ay sadyang nagpapanatili sa matapang na metapora ng Hebreo, samantalang nililinaw ng talababa ang saklaw nito. Ginamit ang tuldok-kuwit upang maipakita ang pagtutol sa pagitan ng pagguho ng sanlibutan at ng nagpapatatag na kilos ng nagsasalita.
