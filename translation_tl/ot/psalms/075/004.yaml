  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: tl
  text: Sinabi ko sa mga hambog, “Huwag kayong maghambog,” at sa masasama, “Huwag ninyong itaas ang sungay[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sungay” ay talinghagang Hebreo para sa lakas, kapangyarihan, o mapagmataas na pagdakila sa sarili. Maaari ring isalin ang parirala na “Huwag ninyong itaas ang inyong lakas” o “Huwag kayong magmataas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Sinabi ko
  rationale: 'Ang Qal perfect na unang panauhang isahan ay likas na ipinapahayag sa Filipino bilang naganap na kilos: “Sinabi ko.”'
- source_word: הוֹלְלִים
  choice: mga hambog
  rationale: Tinutukoy rito ang mga taong nagyayabang o nagmamataas. Pinananatili ng “mga hambog” ang ugnayang leksikal nito sa kasunod na pandiwang תָּהֹלּוּ.
- source_word: אַל תָּהֹלּוּ
  choice: Huwag kayong maghambog
  rationale: Tuwirang ipinapahayag ang negatibong utos at pinananatili ang paglalaro sa salitang kaugnay ng “mga hambog.”
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Karaniwan at malinaw na katumbas sa modernong Tagalog para sa moral na kategoryang tinutukoy ng salita sa Mga Awit.
- source_word: אַל תָּרִימוּ
  choice: Huwag ninyong itaas
  rationale: Tuwirang isinasalin ang Hiphil na anyo ng רום at pinananatili ang larawan ng pagtataas.
- source_word: קָרֶן
  choice: ang sungay
  rationale: Pinananatili ang kongkretong metaporang Hebreo sa halip na agad itong ipakahulugan bilang lakas, kapangyarihan, o pagmamataas. Walang tahasang panghalip na paari sa Hebreo, kaya “ang sungay” ang mas pormal na katumbas.
theological_decisions:
- issue: Metaporikal na kahulugan ng “sungay”
  choice: Panatilihin sa pangunahing teksto ang “ang sungay.”
  alternative: “Huwag ninyong itaas ang inyong lakas” o “Huwag kayong magmataas.”
  rationale: Ang “sungay” ay larawang patula para sa lakas, kapangyarihan, katayuan, o mapagmataas na pagdakila sa sarili. Ang pagpapanatili sa larawan ay umiiwas sa labis na paglilimita sa tunay na saklaw ng metapora; nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maghambog” upang mapanatili ang pag-uulit sa Hebreo, at ang “sungay” upang mapanatili ang matapang na larawang patula ng orihinal.
