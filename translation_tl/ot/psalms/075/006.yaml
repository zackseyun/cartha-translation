  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: tl
  text: Sapagkat hindi mula sa silangan o mula sa kanluran, at hindi mula sa ilang, nagmumula ang pagtataas.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “pagdakila” o, ayon sa diwa, “pag-angat sa katayuan.” Eliptiko at mahirap ang pahayag sa Hebreo; nililinaw ito ng kasunod na talata, kung saan itinataas ng Diyos ang isa at ibinababa ang iba.
    reason: lexical_alternative
  - marker: b
    text: Ang huling salitang Hebreo ay maaari ring unawaing “mga bundok,” kaya maaaring mabasa ang hulihan bilang “at hindi mula sa ilang ng mga bundok.” Gayunman, higit na umaangkop sa konteksto ang “pagtataas.”
    reason: alternative_reading
  - marker: c
    text: 'Mas literal ang pagkakaugnay ng mga parirala: “hindi mula sa silangan at mula sa kanluran, at hindi mula sa ilang.” Ginamit ang “o” sa unang pares upang maging natural ang magkakaugnay na pagtanggi sa Tagalog.'
    reason: coordination
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa naunang pahayag ng awit at likas na ipinahihiwatig ang ugnayang sanhi o batayan.
- source_word: מִמּוֹצָא
  choice: mula sa silangan
  rationale: Ang מוֹצָא ay maaaring tumukoy sa pagsikat o pinanggagalingan ng araw; malinaw at natural sa makabagong Tagalog ang direksiyonal na ‘silangan.’
- source_word: וּמִמַּעֲרָב
  choice: o sa kanluran
  rationale: Ang מַעֲרָב ay tumutukoy sa paglubog ng araw at, bilang direksiyon, sa kanluran. Ang ‘o’ ay natural sa seryeng saklaw ng pagtanggi.
- source_word: מִמִּדְבַּר
  choice: mula sa ilang
  rationale: Ang מִדְבָּר ay ilang o disyerto. Pinili ang ‘ilang’ bilang maikli, malawak ang saklaw, at angkop sa marangal na biblikal na pananalita.
- source_word: הָרִים
  choice: ang pagtataas
  rationale: Maaaring unawain ang anyo bilang kaugnay ng pandiwang רום, ‘itaas,’ at tugma ito sa kasunod na talata kung saan ibinababa ng Diyos ang isa at itinataas ang iba. Ginawang pangngalan sa Tagalog upang maipahayag ang eliptikong sugnay nang hindi nawawala ang larawan ng pagtataas.
theological_decisions:
- issue: Ang kahulugan ng huling salitang הָרִים sa mahirap at eliptikong sugnay
  choice: Itinanggi ng talata na ang pagtataas ay nagmumula sa alinmang makalupang direksiyon.
  alternative: Basahin ang הָרִים bilang ‘mga bundok,’ na magbubunga ng pariralang gaya ng ‘mula sa ilang ng mga bundok.’
  rationale: 'Sinusuportahan ng agarang konteksto ang diwa ng pagtataas: sa kasunod na talata, ang Diyos ang humahatol, nagpapababa sa isa, at nagtataas sa iba. Gayunman, inilalahad sa talababa ang tunay na alternatibong pagbasa.'
- issue: Kung isasalin ang ideya bilang ‘promosyon’ o bilang ‘pagtataas’
  choice: pagtataas
  alternative: promosyon o pagdakila
  rationale: Mas malapit ang ‘pagtataas’ sa konkretong larawan ng ugat na רום at pinananatili nito ang leksikal na ugnayan sa kasunod na talata nang hindi nililimitahan ang diwa sa katungkulan o ranggo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang baligtad na ayos—nauuna ang mga direksiyong pinagtatanggihan bago ang ‘pagtataas’—upang maingatan ang diin at elipsis ng Hebreo, ngunit nilagyan ng mga kuwit para madaling maunawaan.
