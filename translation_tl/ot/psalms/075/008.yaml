  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: tl
  text: May kopa sa kamay ni Yahweh; bumubula ang alak, punô ng halo, at nagbubuhos siya mula rito. Ngunit ang latak nito ay sasairin at iinumin ng lahat ng masasama sa lupa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “punô ng timpla” o “lubos na hinalo.” Tumutukoy ang Hebreo sa alak na inihanda sa pamamagitan ng paghahalo, ngunit hindi nito tinutukoy kung ano ang inihalo.
    reason: lexical_alternative
  - marker: b
    text: Ang “latak” ay ang namuong deposito sa ilalim ng kopa. Ipinakikita ng larawan na kailangang ubusin ng masasama ang laman nito hanggang sa pinakahuling bahagi.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag sa awit.
- source_word: כּוֹס
  choice: kopa
  rationale: Pinananatili ang konkretong larawan ng sisidlang hawak ng Diyos; likas at marangal ang “kopa” sa makatang Filipino.
- source_word: בְּיַד יְהוָה
  choice: sa kamay ni Yahweh
  rationale: Pinananatili ang Hebreong larawan ng kapangyarihan at pamamahala, pati ang personal na pangalan ng Diyos.
- source_word: יַיִן חָמַר
  choice: Bumubula ang alak
  rationale: Ipinahihiwatig ng pandiwa ang bumubula o aktibong nagbuburang alak, hindi lamang ang kulay nito.
- source_word: מָלֵא מֶסֶךְ
  choice: punô ito ng timpla
  rationale: Ang מֶסֶךְ ay inihandang halo ng alak; hindi tiyak sa teksto kung espesya, tubig, o ibang sangkap ang inihalo.
- source_word: וַיַּגֵּר מִזֶּה
  choice: nagbubuhos siya mula rito
  rationale: Tuwirang inilalarawan ang pagbubuhos mula sa kopang nabanggit.
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ipinahahayag dito ang diin at katiyakan ng hatol.
- source_word: שְׁמָרֶיהָ
  choice: ang latak nito
  rationale: Ang salita ay tumutukoy sa namuong deposito sa ilalim ng alak; malinaw at pangkaraniwan ang “latak” sa Filipino.
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: sisipsipin at iinumin
  rationale: Pinananatili ang dalawang pandiwa at ang marahas na larawang inuubos ang laman hanggang sa latak.
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: lahat ng masasama sa lupa
  rationale: Tuwirang katumbas na malinaw sa modernong Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang tekstong Hebreo ay may tetragrammaton; pinananatili ng transliterasyong “Yahweh” ang personal at tipanang sanggunian nang hindi nagpapasok ng isang pamagat bilang kapalit.
- issue: Larawan ng kopa
  choice: Panatilihin ang kopa at alak bilang larawan nang hindi tahasang idagdag ang “poot” o “hatol” sa pangunahing teksto.
  alternative: kopa ng poot ng Diyos
  rationale: Malinaw sa konteksto na larawan ito ng hatol, ngunit hindi tahasang nasa talata ang mga salitang “poot” o “hatol.”
- issue: Timpla ng alak
  choice: timpla
  alternative: hinaluan ng mga espesya
  rationale: Hindi tinutukoy ng Hebreo kung ano mismo ang inihalo, kaya pinananatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makatang larawan at ang pag-uulit ng mga kilos sa Hebreo. Hinati sa maiikling pangungusap para sa malinaw na pagbasa, nang hindi binabago ang lohikal na ugnayan ng mga sugnay.
