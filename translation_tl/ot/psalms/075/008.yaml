  terminology: Ang “Yahweh,” “kopa,” “alak,” at “latak” ay angkop. Ang “halo” ay mas tuwiran at natural kaysa “timpla” para sa di-tiyak na מֶסֶךְ, nang hindi ipinapasok ang espesya o anumang partikular na sangkap.
