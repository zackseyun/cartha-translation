  - severity: low
    issue: Ang “may isang kopa” ay may di-kailangang bilang at bahagyang di-likas na himig.
    rationale: Walang diin sa bilang na “isa” sa כּוֹס; sapat at mas idiomatiko ang “May kopa sa kamay ni Yahweh.”
  - severity: low
    issue: Ang “punô ito ng timpla” ay hindi kasinglinaw ng “punô ng halo.”
    rationale: Ang מֶסֶךְ ay isang halo o inihandang pinaghalo, ngunit hindi tinutukoy ang sangkap. Ang “halo” ay pinananatili ang kalabuang ito at mas tuwirang ikinakabit sa “punô.”
