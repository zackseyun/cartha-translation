  text: ה֘וֹדִ֤ינוּ לְּ/ךָ֨ אֱֽלֹהִ֗ים ה֭וֹדִינוּ וְ/קָר֣וֹב שְׁמֶ֑/ךָ סִ֝פְּר֗וּ נִפְלְאוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: tl
  text: Nagpapasalamat kami sa iyo, O Diyos; nagpapasalamat kami, at malapit ang iyong pangalan[a]; isinasalaysay nila[b] ang iyong mga kamangha-manghang gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “malapit ang iyong pangalan” ay maaaring tumukoy sa pagiging malapit ng Diyos, sa hayag niyang presensya, o sa pagkakilala sa kanyang pagkatao at mga gawa. Pinanatili rito ang idyoma ng Hebreo.
    reason: lexical_alternative
  - marker: b
    text: 'Walang tahasang tinutukoy ang “nila” sa Hebreo; literal itong pandiwang nasa ikatlong panauhang maramihan: “isinasalaysay nila.” Maaari ring isalin, “isinasalaysay ang iyong mga kamangha-manghang gawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: nagpapasalamat kami
  rationale: Ang Hiphil ng ידה sa kontekstong ito ng awit ay nagpapahayag ng pasasalamat o papuri sa Diyos. Pinananatili ang pag-uulit sa Hebreo.
- source_word: לְּךָ אֱלֹהִים
  choice: sa iyo, O Diyos
  rationale: Tuwirang pinananatili ang pariralang 'sa iyo,' at ginagawang pantawag ang אֱלֹהִים. Ang 'O Diyos' ay angkop sa marangal na panalangin at tula.
- source_word: וְקָרוֹב
  choice: at malapit
  rationale: Isinasalin ang pangatnig bilang 'at' upang hindi sapilitang gawing sanhi ang kaugnayan ng mga sugnay, bagaman maaari itong maunawaang nagpapaliwanag sa pasasalamat.
- source_word: שְׁמֶךָ
  choice: ang iyong pangalan
  rationale: Pinananatili ang idyomang Hebreo sa halip na paliitin ito sa 'presensya' o 'karangalan,' kaya nananatili ang lawak ng kahulugan nito.
- source_word: סִפְּרוּ
  choice: isinasalaysay nila
  rationale: Ang pandiwa ay ikatlong panauhang maramihan na walang tiyak na tinutukoy na simuno. Ang 'nila' ay nagpapanatili sa anyong maramihan nang hindi tinutukoy kung sino sila; ang aspektong pangkasalukuyan ay natural sa pangkalahatang pahayag ng awit.
- source_word: נִפְלְאוֹתֶיךָ
  choice: ang iyong mga kamangha-manghang gawa
  rationale: Tumutukoy ito sa pambihirang mga gawa ng Diyos, hindi lamang sa abstraktong pagkamangha. Natural at malinaw ang parirala sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng 'malapit ang iyong pangalan'
  choice: Pinanatili ang mismong idyomang 'malapit ang iyong pangalan.'
  alternative: malapit ang iyong presensya; hayag o kilala ang iyong kadakilaan
  rationale: Maaaring saklawin ng 'pangalan' ang nahayag na pagkatao, reputasyon, o presensya ng Diyos. Hindi nililimitahan ng Hebreo ang parirala sa iisang paliwanag, kaya pinananatili ang teolohikal na lalim at kalabuan nito.
- issue: Di-tiyak na simuno ng סִפְּרוּ
  choice: Isinalin bilang 'isinasalaysay nila,' na hindi pinapangalanan ang mga gumagawa.
  alternative: isinasalaysay ang iyong mga kamangha-manghang gawa; isinasalaysay ng mga tao
  rationale: Nasa ikatlong panauhang maramihan ang Hebreo ngunit walang tahasang simuno. Ang salin ay hindi nagdaragdag ng isang partikular na grupo o ng sangkatauhan sa pangkalahatan.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa tulang panalangin. Pinanatili ang pag-uulit, ang tuwirang pantawag na 'O Diyos,' at ang tunay na kalabuan ng dalawang parirala. Ginamit ang semicolon upang ipakita ang mga pangunahing yunit ng taludtod nang hindi pinahihina ang daloy.
