  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: tl
  text: 'At puputulin ko ang lahat ng sungay[a] ng masasama,

    ngunit itataas ang mga sungay ng matuwid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sungay” ay larawan ng lakas, kapangyarihan, o mataas na kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: At ... lahat
  rationale: Pinananatili ng “At” ang payak na pang-ugnay na וְ at ang kaugnayan nito sa naunang taludtod; tuwirang isinasalin ng “lahat” ang כָּל.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: sungay / mga sungay
  rationale: Pinananatili ang kongkretong larawang “sungay,” na metapora para sa lakas, kapangyarihan, o mataas na kalagayan, sa halip na paliitin ito sa iisang abstraktong kahulugan.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Likas sa modernong Tagalog ang pangmaramihang pangngalang “masasama” para sa kolektibong pagtukoy sa mga taong namumuhay nang masama.
- source_word: אֲגַדֵּעַ
  choice: puputulin ko
  rationale: Tumpak na ipinahahayag ang unaang panauhan at ang tiyak na pag-aalis na inilalarawan ng גדע; ang “puputulin” ay angkop din sa larawan ng mga sungay.
- source_word: תְּרוֹמַמְנָה
  choice: itataas
  rationale: Ipinahahayag ang pag-angat o pagtataas ng mga sungay nang hindi tinutukoy sa sugnay kung sino ang gagawa nito; natural ito sa Tagalog at pinananatili ang resultang diwa ng anyo.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Bagaman isahan ang anyong Hebreo, ginagamit ito bilang pangkalahatang uri na katapat ng “masasama”; ang “matuwid” ay nagpapanatili sa isahang kolektibo o kinatawang diwa.
theological_decisions:
- issue: Ang “mga sungay” bilang larawan ng kapangyarihan at karangalan
  choice: Panatilihin ang “sungay” sa pangunahing teksto.
  alternative: Isalin nang tuwiran bilang “lakas” o “kapangyarihan.”
  rationale: Ang sungay ay isang mahalagang larawang patula sa Kasulatan para sa lakas, kapangyarihan, at mataas na katayuan. Ang pagpapanatili rito ay umiiwas sa sobrang pagpapakahulugan.
- issue: Pagkakaiba ng kapalaran ng masasama at ng matuwid
  choice: Gamitin ang “ngunit” sa ikalawang sugnay.
  alternative: 'Walang tahasang pang-ugnay: “itataas naman...”'
  rationale: Bagaman walang hiwalay na pang-ugnay sa Hebreo bago ang ikalawang sugnay, malinaw ang patulang pagsalungat. Natural na ipinahahayag ito ng “ngunit” nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at magkatapat na estruktura ng tulang Hebreo, gayundin ang metaporang “sungay.”
