  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: tl
  text: Ngunit ako naman[a], magpapahayag ako magpakailanman; aawit ako ng papuri sa Diyos ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At ako ay magpapahayag magpakailanman.” Ang pangatnig sa Hebreo ay maaaring isaling “at” o, ayon sa konteksto, “ngunit” upang magpahayag ng pagsalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako naman
  rationale: Ipinahahayag ng pangatnig kasama ng tahasang panghalip ang pagbibigay-diin at malamang na pagsalungat sa konteksto. Likas sa modernong Tagalog ang “ngunit ako naman” para sa ganitong diin.
- source_word: אַגִּיד
  choice: magpapahayag ako
  rationale: Ang Hiphil ng נגד ay nangangahulugang magpahayag o magpaalam. Pinananatili ng “magpapahayag” ang malawak na kahulugan nang hindi nagdaragdag ng layon na wala sa Hebreo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Tumutukoy ito sa walang-hanggang o patuloy na tagal; ang “magpakailanman” ay marangal at karaniwang pananalita sa kontekstong patula.
- source_word: אֲזַמְּרָה
  choice: aawit ako ng papuri
  rationale: Ang Piel ng זמר ay tumutukoy sa pag-awit o pagtugtog bilang papuri. Malinaw na naihahatid ng parirala ang musikal at debosyonal na diwa.
- source_word: לֵאלֹהֵי
  choice: sa Diyos ni
  rationale: Ang ל ay tumutukoy sa pinag-uukulan ng papuri; “sa Diyos ni” ang likas na katumbas sa Tagalog.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Pinananatili ang karaniwang anyo ng pangalan at ang tipanang katawagang “Diyos ni Jacob.”
theological_decisions:
- issue: Pagbibigay-diin at pagsalungat ng nagsasalita sa nakapaligid na konteksto
  choice: Ngunit ako naman
  alternative: At ako
  rationale: Malamang na inihahambing ng talata ang patuloy na pagpapahayag at pagpupuri ng mang-aawit sa kapalaran ng masasama sa konteksto. Gayunman, hindi tiyak sa pangatnig lamang ang adversatibong diwa, kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal at angkop sa panulaan. Pinanatiling walang tahasang layon ang “magpapahayag” dahil wala ring binanggit na layon sa tekstong Hebreo; hindi rin nilutas nang palihim ang maaaring kahulugan ng pambungad na pangatnig.
