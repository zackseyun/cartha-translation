  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: tl
  text: Sapagkat kapag pinili ko ang takdang panahon[a][b], ako mismo ang hahatol nang may katarungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sapagkat kapag kinuha ko ang takdang panahon, hahatol ako nang may katuwiran.” Literal na “kunin” ang pandiwang Hebreo; maaari ring isalin ang “katarungan” bilang “katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapag itinakda ko ang panahon.”
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pahayag ay nagbibigay ng batayan o paliwanag sa naunang taludtod, sa halip na gawing temporal ang pang-ugnay.
- source_word: אֶקַּח
  choice: pinili ko
  rationale: Ang literal na kahulugan ng לקח ay “kunin,” ngunit kasama ng מוֹעֵד ipinahihiwatig nito ang pagpili o pagtatakda ng isang panahon. Natural sa modernong Tagalog ang “pinili ko,” habang inilalagay sa talababa ang mas literal at isa pang posibleng salin.
- source_word: מוֹעֵד
  choice: ang takdang panahon
  rationale: Tumutukoy ang salita sa isang itinakda o tiyak na panahon. Pinananatili ng “takdang panahon” ang diwa nang malinaw at maikli.
- source_word: אֲנִי
  choice: ako mismo
  rationale: May hiwalay na panghalip sa Hebreo bukod sa unang panauhang nakapaloob na sa pandiwa, kaya may diin sa gumagawa ng paghatol.
- source_word: מֵישָׁרִים
  choice: nang may katuwiran
  rationale: Saklaw ng pangngalan ang katuwiran, pagkamakatarungan, at pagiging patas sa paghatol. Ang “nang may katuwiran” ay natural, marangal, at nananatiling malapit sa nominal na anyo.
- source_word: אֶשְׁפֹּט
  choice: ang hahatol
  rationale: Judisyal ang gamit ng שׁפט sa konteksto. Ang anyong “hahatol” ay angkop sa pahayag tungkol sa darating na pagkilos.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita at ang pag-angkin niyang humatol
  choice: Pinanatili ang tuwirang pahayag sa unang panauhan nang hindi idinaragdag ang pangalang “Diyos.”
  alternative: Tahasang tukuyin ang nagsasalita bilang Diyos.
  rationale: Ipinakikita ng konteksto ng awit na ang pahayag ay nauunawaan bilang salita ng Diyos, ngunit hindi Siya tahasang pinapangalanan sa mismong taludtod. Kaya pinananatili ng salin ang diin at kapangyarihan ng nagsasalita nang hindi nilulutas sa teksto ang isang pagkakakilanlang ibinibigay ng mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ako mismo” upang mapanatili ang diin ng malayang panghalip sa Hebreo, at hindi tahasang pinangalanan ang nagsasalita upang hindi magdagdag sa mismong taludtod.
