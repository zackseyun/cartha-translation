base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/005.yaml
  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: tl
  text: Huwag ninyong itaas nang mataas ang inyong sungay[a]; huwag kayong magsalita nang may mapagmataas na leeg.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sungay” sa Hebreo ay metapora para sa lakas, kapangyarihan, o pag-aangat ng sarili.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “huwag kayong magsalita nang may mapangahas na leeg” o “huwag kayong magsalita nang matigas ang leeg.” Pinananatili ng Hebreo ang pisikal na larawan ng mapagmataas na pagsuway.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Huwag
  rationale: Karaniwang pananggi sa isang utos o pagbabawal; natural itong isalin bilang “Huwag” sa Filipino.
- source_word: תָּרִימוּ
  choice: itaas
  rationale: Pinananatili ang konkretong kilos ng pag-aangat at ang metapora ng tekstong Hebreo.
- source_word: לַמָּרוֹם
  choice: nang napakataas
  rationale: Ipinahahayag ang pag-angat tungo sa mataas na kalagayan sa paraang natural sa Filipino, nang hindi tahasang pinapalitan ang larawang spatial ng interpretasyong “magmataas.”
- source_word: קַרְנְכֶם
  choice: ang inyong sungay
  rationale: Pinananatili ang literal na larawang “sungay,” na sa konteksto ay maaaring kumatawan sa lakas, kapangyarihan, o mapagmataas na pagpaparangal sa sarili.
- source_word: תְּדַבְּרוּ
  choice: magsalita
  rationale: Payak at marangal na katumbas ng karaniwang pandiwang Hebreo para sa pagsasalita.
- source_word: בְצַוָּאר
  choice: nang may ... leeg
  rationale: Pinananatili ang pisikal na metapora ng leeg at ipinakikitang inilalarawan nito ang paraan ng pagsasalita.
- source_word: עָתָק
  choice: palalong
  rationale: Ipinahahayag ang kapalaluan, pagmamataas, o mapanghamong kawalang-galang na saklaw ng salitang Hebreo.
theological_decisions:
- issue: Kahulugan ng “sungay” bilang metapora
  choice: Panatilihin sa pangunahing teksto ang “sungay” at ipaliwanag sa talababa.
  alternative: Isalin nang tuwiran bilang “lakas,” “kapangyarihan,” o “pagmamataas.”
  rationale: Hindi tiyak sa iisang konsepto lamang ang metapora; ang pagpapanatili nito ay umiiwas sa makitid na interpretasyon.
- issue: Larawan ng palalong leeg
  choice: Panatilihin ang di-pangkaraniwang metaporang “may palalong leeg.”
  alternative: Isalin bilang “nang may pagmamataas,” “nang may katigasan ng ulo,” o “nang taas-noo.”
  rationale: Pinananatili nito ang sadyang pisikal at mapanghamong larawan ng Hebreo nang hindi ipinapalit ang ibang bahagi ng katawan o ganap na nilulutas ang metapora.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Sadyang pinanatili ang mga larawang “sungay” at “leeg,” kahit bahagyang di-pangkaraniwan sa Filipino, upang mapangalagaan ang metapora at tensiyon ng Hebreo; nililinaw ang mga ito sa mga talababa.
