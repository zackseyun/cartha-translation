  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: tl
  text: 'Magalak at magsaya sa iyo ang lahat ng humahanap sa iyo;

    at lagi nilang sabihin, ng mga umiibig sa iyong pagliligtas[a],


    “Dakilain nawa ang Diyos!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaligtasan” o “pagsagip.” Maaaring tumukoy ang salitang Hebreo sa pagliligtas mula sa kagipitan o sa kaligtasan sa mas malawak na diwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Maging dakila nawa ang Diyos” o “Kilalaning dakila ang Diyos.” Nagpapahayag ang Hebreo ng hangarin o pagbubunyi tungkol sa kadakilaan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ
  choice: magalak
  rationale: Ang pandiwang שׂוּשׂ ay nagpapahayag ng masidhing kagalakan. Ang “magalak” ay natural at marangal sa modernong Tagalog.
- source_word: וְיִשְׂמְחוּ
  choice: at magsaya
  rationale: Ang שׂמח ay tumutukoy sa pagiging masaya o nagagalak. Pinananatili ng “magsaya” ang pagkakaiba at paralelismo ng dalawang pandiwa.
- source_word: בְּךָ
  choice: sa iyo
  rationale: Maaaring tukuyin ng בְּ ang saklaw o batayan ng kagalakan. Ang “sa iyo” ay nagpapanatili sa Diyos bilang sentro ng kanilang kagalakan nang hindi nililimitahan ito sa “dahil sa iyo.”
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: ang lahat ng humahanap sa iyo
  rationale: Ang participial na parirala ay tumutukoy sa lahat ng taong patuloy na naghahanap sa Diyos. Likas at malinaw ito sa Tagalog.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: laging sabihin
  rationale: Ipinahihiwatig ng imperfect kasama ng תָמִיד ang paulit-ulit o patuloy na pagsasabi. Ang “laging sabihin” ay maikli at natural.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: mga umiibig sa iyong pagliligtas
  rationale: Ang יְשׁוּעָה ay maaaring tumukoy sa kongkretong pagsagip o sa kaligtasan sa mas malawak na diwa. Ang “pagliligtas” ay nagpapanatili sa kilos ng Diyos at sa lawak ng kahulugan.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Dakilain nawa ang Diyos
  rationale: Ang imperfect ay may lakas ng isang hangarin o pagbubunyi. Ipinahahayag ng “Dakilain nawa” ang panawagang kilalanin at ipahayag ang kadakilaan ng Diyos, sa halip na gawin itong payak na pahayag lamang.
theological_decisions:
- issue: Kahulugan ng יְשׁוּעָה
  choice: pagliligtas
  alternative: kaligtasan; pagsagip
  rationale: Maaaring tumukoy ang salitang Hebreo sa pagsagip mula sa kagipitan at sa kaligtasan sa mas malawak na diwa. Hindi nililimitahan ng “pagliligtas” ang teksto sa isa lamang sa mga ito.
- issue: Lakas ng יִגְדַּל אֱלֹהִים
  choice: Dakilain nawa ang Diyos
  alternative: Maging dakila nawa ang Diyos; Kilalaning dakila ang Diyos
  rationale: Binabasa ang sugnay bilang patuloy na pagbubunyi o hangarin, hindi lamang bilang pahayag na “Dakila ang Diyos.” Pinananatili ng salin ang volitibong himig habang nililinaw sa talababa ang ibang posibleng pagpapahayag.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal at panalanging himig. Ginamit ang “magalak at magsaya” upang mapanatili ang paralelismong patula, at ang “na wa” upang ipahayag ang hangarin o pagbubunyi ng Hebreo.
