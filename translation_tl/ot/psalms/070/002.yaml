  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: tl
  text: Mapahiya at malito[a] ang mga naghahangad na kitlin ang buhay ko; umurong at malagay sa kahihiyan ang mga natutuwa sa kapahamakan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapahiya” o “malugmok sa kahihiyan.” Ang salitang Hebreo ay tumutukoy sa pagkalito o pagkapahiya sa harap ng pagkabigo o kahihiyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Mapahiya
  rationale: Ipinahahayag ng בוש ang pagdanas ng hiya o pagkapahiya; ang anyong pakiusap o sumpa sa panalangin ay likas na naipapahayag sa Filipino sa pamamagitan ng pandiwang nasa anyong ma-.
- source_word: וְיַחְפְּרוּ
  choice: at malito
  rationale: Ang חפר ay maaaring tumukoy sa pagkalito o pagkapahiya. Pinili ang “malito” upang mapanatili ang hiwalay na diin ng dalawang magkatabing pandiwa sa halip na pagsamahin ang mga ito bilang iisang ideya.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ang mga naghahangad na kitlin ang buhay ko
  rationale: Sa mapanganib na kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o sarili ng nagsasalita, at ang בקש ay may diwang paghanap o paghahangad laban dito. Nililinaw ng “kitlin ang buhay ko” ang nakamamatay na layunin nang hindi isinasalin ang idyoma nang literal bilang “kaluluwa.”
- source_word: יִסֹּגוּ אָחוֹר
  choice: umurong
  rationale: Ang pariralang סוג אחור ay nangangahulugang bumalik o umatras. Ang “umurong” ay maikli, natural, at angkop sa konteksto ng pagkabigo ng mga kaaway.
- source_word: וְיִכָּלְמוּ
  choice: at malagay sa kahihiyan
  rationale: Ang כלם ay tumutukoy sa pagkapahiya o pagkadusta. Pinananatili ng “malagay sa kahihiyan” ang dimensiyong panlipunan at pampublikong dungis habang iniiwasan ang eksaktong pag-uulit ng “mapahiya.”
- source_word: חֲפֵצֵי רָעָתִי
  choice: ang mga natutuwa sa kapahamakan ko
  rationale: Ang חפץ ay maaaring mangahulugang magnasa o malugod, at ang רעה rito ay kapinsalaan o kapahamakan ng salmista, hindi ang kaniyang moral na kasamaan. Ang “natutuwa sa kapahamakan ko” ay nagpapanatili sa malisyosong kasiyahang ipinahahayag ng parirala.
theological_decisions:
- issue: Puwersang jussive o sumpang-panalangin ng sunud-sunod na pandiwa
  choice: 'Isinalin bilang mga kahilingan sa panalangin: “Mapahiya… malito… umurong… malagay…”'
  alternative: 'Isalin bilang payak na panghinaharap: “Mapapahiya sila… uurong sila…”'
  rationale: Sa konteksto ng panalangin sa salmo, ang mga imperfect na pandiwa ay nagpapahayag ng kahilingan o mithiing hatol, hindi lamang prediksiyon. Likas sa Filipino na maipahayag ito sa mga anyong “mapahiya,” “malito,” at “umurong” nang hindi kailangang idagdag ang “nawa” sa bawat sugnay.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may maikli at balanseng paralelismo. Ginamit ang “kitlin ang buhay ko” upang ihayag nang natural ang banta sa buhay, at “kapahamakan” upang iwasang mapagkamalang moral na kasamaan ng salmista ang רעה.
