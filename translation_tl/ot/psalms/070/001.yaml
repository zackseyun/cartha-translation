  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang magkaibang panawagan sa Hebreo: “Diyos” para sa אֱלֹהִים at “Yahweh” para sa יְהוָה. Ang “iligtas mo ako” ay angkop para sa Hiphil na לְהַצִּילֵנִי, at ang “magmadali kang tulungan ako” ay wasto para sa apurahang pakiusap na לְעֶזְרָתִי חוּשָׁה. Hindi nito isinasara ang saklaw ng pagliligtas sa espirituwal na kaligtasan lamang.'
