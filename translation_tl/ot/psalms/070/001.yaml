  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: tl
  text: O Diyos, iligtas mo ako; O Yahweh[a], magmadali kang tulungan ako!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; tradisyonal ding isinasalin na “PANGINOON.”'
    reason: Ipinaliliwanag ang paglilipat ng banal na pangalan at ang karaniwang alternatibong salin.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos. Pinananatili ng “O” ang anyong panawag at ang marangal na himig ng panalangin.
- source_word: לְהַצִּילֵנִי
  choice: iligtas mo ako
  rationale: Ang Hiphil ng נצל ay humihiling na mailayo ang nagsasalita sa panganib. Karaniwan at malinaw sa modernong Tagalog ang “iligtas mo ako,” nang hindi nililimitahan ang diwa sa espirituwal o walang-hanggang kaligtasan.
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Personal na pangalan ng Diyos ang Tetragrammaton sa tekstong Hebreo. Ginamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: לְעֶזְרָתִי
  choice: tulungan ako
  rationale: Ang pangngalang עֶזְרָה na may לְ ay nagpapahayag ng paglapit o pagkilos upang magbigay ng tulong. Likas sa Tagalog ang pandiwang anyong “tulungan ako.”
- source_word: חוּשָׁה
  choice: magmadali ka
  rationale: Apurahang pakiusap ang anyong ito ng חושׁ. Malinaw at kasalukuyang Tagalog ang “magmadali ka,” at pinananatili nito ang diin sa agarang pagkilos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang personal na pangalang יְהוָה. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon,” habang ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli, apurahan, at makatang anyo ng panalangin; hindi dinagdagan ng “ko” ang “Diyos” dahil walang katumbas na panghalip na paari sa Hebreo.
