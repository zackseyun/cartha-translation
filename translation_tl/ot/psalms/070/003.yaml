  text: Let them turn back because of their shame[a], those who say, “Aha, aha!”
translation:
  language: tl
  text: Umatras nawa dahil sa kanilang kahihiyan[a] ang mga nagsasabing, “Aha, aha!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bumalik nawa sila dahil sa kanilang kahihiyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Magsibalik nawa
  rationale: Ang Qal imperfect na 3mp ay may pakiusap/panumpang diwa sa konteksto. Pinananatili ng “nawa” ang volitional force, at ipinahihiwatig ng “magsibalik” ang pag-atras nang hindi ginagawang tahasang pasibo ang pandiwa.
- source_word: עַל עֵקֶב
  choice: dahil sa
  rationale: Ang pariralang עַל עֵקֶב ay idyomatikong nagsasaad ng sanhi o batayan. Likas at malinaw sa modernong Tagalog ang “dahil sa,” samantalang malilito ang mambabasa sa literal na pagtukoy sa “sakong.”
- source_word: בָּשְׁתָּם
  choice: kanilang kahihiyan
  rationale: Tuwirang ipinapahayag ng “kahihiyan” ang saklaw na semantiko ng shame/disgrace at ang imprecatoryong tono ng talata.
- source_word: הָאֹמְרִים
  choice: ang mga nagsasabi
  rationale: Isinasalin nito nang natural ang substantival participle at pinananatili ang pagkakakilanlan ng pangkat ayon sa kanilang mapanuyang pananalita.
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Pinananatili ng interheksiyong ito ang paulit-ulit na mapanlibak at mapagmalaking sigaw ng Hebreo; nauunawaan din ito sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “magsibalik nawa” upang panatilihin ang panalanging/imprecatoryong puwersa at ang pangmaramihang anyo; iniwasan ang tahasang pasibong salin dahil aktibo ang anyong Hebreo. Ang footnote ay nagtatala ng mas karaniwang ayos ng pangungusap nang hindi binabago ang kahulugan.
