lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Karaniwang tumutukoy ang salita sa namumuno o nangangasiwa sa musika sa pagsamba. Pinananatili ng “Para sa” ang gamit ng prefixed ל sa pamagat, at malinaw sa karaniwang mambabasa ang “tagapangasiwa ng awitan.”
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Maaaring magpahiwatig ang ל ng pagkakatha, kaugnayan, pag-aalay, o pag-aari sa isang koleksiyon. Hindi nililimitahan ng “Ukol kay David” ang kahulugan sa tiyak na “Sinulat ni David.”
- source_word: לְהַזְכִּיר
  choice: Upang ipaalaala
  rationale: Ang Hiphil infinitive ng זכר ay may diwang “magpaalaala” o “maghatid sa pag-alaala.” Pinananatili ng salin ang layuning ipinahihiwatig ng ל nang hindi tinutukoy kung sino ang dapat makaalaala.
theological_decisions:
- issue: Gampanin ng לְהַזְכִּיר sa pamagat
  choice: 'Isang neutral na pahayag ng layunin: “Upang ipaalaala”'
  alternative: Bilang pag-alaala; bilang pang-alaalang handog; upang ipaalaala sa Diyos; upang makaalaala ang sumasamba
  rationale: Hindi sinasabi ng Hebreo kung sino ang pinag-uukulan ng pagpapaalaala o kung ito ay teknikal na katawagan para sa isang ritwal. Kaya hindi nilulutas ng salin ang sadyang kalabuan.
translation_notes:
  register: Maikli at marangal ang anyo upang tumugma sa estilo ng pamagat ng awit. Ginamit ang kasalukuyang Filipino na madaling maunawaan, habang iniingatan ang kalabuan ng mga pariralang Hebreo.
