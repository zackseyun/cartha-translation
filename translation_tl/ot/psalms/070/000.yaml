translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan. Ukol kay David. Bilang pag-alaala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Upang ipaalaala,” “Bilang paalaala,” o posibleng isang liturhikal na katawagang may kaugnayan sa pag-alaala.
