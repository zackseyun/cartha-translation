base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: tl
  text: Ngunit ako ay mahirap at nangangailangan; O Diyos, magmadali kang lumapit sa akin[a]. Ikaw ang aking saklolo at tagapagligtas; O Yahweh[b], huwag kang magtagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “magmadali ka sa akin”; maaari rin itong unawain bilang “magmadali ka para sa akin.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; ayon sa tradisyon, madalas itong isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ipinakikita ng pang-ugnay at panghalip ang paglipat na may pagtutulad o pagsalungat tungo sa kalagayan ng salmista; natural at tuwiran sa modernong Tagalog ang “Ngunit ako.”
- source_word: עָנִי וְאֶבְיוֹן
  choice: dukha at nangangailangan
  rationale: Pinananatili ang magkaugnay ngunit hindi lubusang magkaparehong diwa ng kahirapan, kababaan, at matinding pangangailangan.
- source_word: אֱלֹהִים חוּשָׁה לִי
  choice: O Diyos, magmadali kang lumapit sa akin
  rationale: Vocative ang אֱלֹהִים at apurahang pautos ang חוּשָׁה. Ang “lumapit sa akin” ay natural na pagsasalin ng לִי bilang tunguhin, habang kinikilala sa talababa ang posibleng “para sa akin.”
- source_word: עֶזְרִי
  choice: aking saklolo
  rationale: Ang עֵזֶר ay tulong o saklolo, hindi kinakailangang ang taong tumutulong. Ang “saklolo” ay angkop sa apurahang panalangin.
- source_word: וּמְפַלְטִי
  choice: at tagapagligtas
  rationale: Ang anyong participle mula sa פלט ay tumutukoy sa nagliligtas o nagpapalaya mula sa panganib; malinaw at marangal ang “tagapagligtas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang YHWH sa pamamagitan ng karaniwang rekonstruksiyong “Yahweh,” habang inilalahad sa talababa ang tradisyonal na pamalit na titulo.
- source_word: אַל־תְּאַחַר
  choice: huwag kang magtagal
  rationale: Pinananatili ang apurahang pakiusap na huwag ipagpaliban ng Diyos ang pagkilos; likas sa Tagalog ang “huwag kang magtagal.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh.” Gayunman, kinikilala sa talababa ang matagal nang tradisyon ng pagbasa at pagsasalin dito bilang “ang PANGINOON,” nang hindi ginagawang doktrinal na pasiya ang isang opsiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dukha,” “saklolo,” at “tagapagligtas” upang mapanatili ang tono ng panalangin nang hindi maging lipas o labis na kolokyal. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
