lexical_decisions:
- source_word: מַחְסֶה
  choice: kanlungan
  rationale: Likas at marangal na salin ng isang lugar ng proteksiyon o kublihan.
- source_word: מִגְדַּל עֹז
  choice: matibay na tore
  rationale: Ipinapahayag ang larawang Hebreo ng isang toreng nagbibigay ng lakas at seguridad nang natural sa makabagong Tagalog.
- source_word: מִפְּנֵי אוֹיֵב
  choice: laban sa kaaway
  rationale: Sa kontekstong ito, ang מִפְּנֵי ay tumutukoy sa proteksiyon sa harap ng banta ng kaaway; pinananatili ng 'laban sa' ang tungkuling depensibo ng tore.
theological_decisions:
- issue: Ang Diyos bilang kanlungan at matibay na tore
  choice: Pinanatili ang dalawang magkatugmang larawan nang walang dagdag na paliwanag.
  alternative: Pagsamahin ang mga larawan bilang pangkalahatang pahayag na ang Diyos ay tagapagtanggol.
  rationale: Mahalaga sa tula ang kongkretong larawan ng kanlungan at tore, at walang dahilan upang paliitin ang kahulugan sa isang abstraktong pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog; pinanatili ang poetikong paghahanay sa dalawang linya.
