base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: tl
  text: Mula sa dulo ng daigdig, tumatawag ako sa iyo kapag nanghihina ang puso ko[a]; akayin mo ako sa batong mas mataas kaysa sa akin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapag nanlulupaypay ang puso ko.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa batong masyadong mataas para sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: Mula sa dulo ng daigdig
  rationale: Ang קָצֶה ay tumutukoy sa dulo o hangganan. Sa patulang konteksto, pinananatili ng “dulo ng daigdig” ang diwa ng matinding kalayuan nang hindi nililimitahan ang הָאָרֶץ sa isang partikular na lupain.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: tumatawag ako sa iyo
  rationale: Ang קרא ay maaaring mangahulugang tumawag o dumaing. Likas sa makabagong Tagalog ang “tumatawag ako sa iyo” at naipahihiwatig pa rin nito ang taimtim na panalangin.
- source_word: בַּעֲטֹף לִבִּי
  choice: kapag nanghihina ang puso ko
  rationale: Ipinahihiwatig ng עטף sa pariralang ito ang panghihina o panlulupaypay ng kalooban. Malinaw at natural ang “nanghihina ang puso ko,” habang inilalaan sa talababa ang posibleng diwang “nalulupig.”
- source_word: בְּצוּר
  choice: sa batong
  rationale: Ang צוּר ay konkretong “bato” na may patulang pahiwatig ng katatagan at kanlungan. Pinananatili ang larawan sa halip na palitan ito ng paliwanag na “ligtas na lugar.”
- source_word: יָרוּם מִמֶּנִּי
  choice: mas mataas kaysa sa akin
  rationale: Ang רוּם ay nangangahulugang maging mataas o matayog, at ang מִמֶּנִּי ay nagpapahayag ng paghahambing. Pinananatili ng salin ang payak na paghahambing; nasa talababa ang posibleng diwang hindi ito kayang marating ng nagsasalita.
- source_word: תַנְחֵנִי
  choice: akayin mo ako
  rationale: Ang Hiphil ng נחה ay “umakay” o “pumatnubay.” Ang “akayin mo ako” ay natural na pakiusap at malinaw na nagpapahayag ng pag-asa sa patnubay ng Diyos.
theological_decisions:
- issue: Metaporikal na bisa ng “bato”
  choice: Panatilihin ang “bato” bilang konkretong larawan ng matatag na kanlungan nang hindi tahasang ipinapaliwanag sa pangunahing teksto na ito ay tumutukoy sa Diyos.
  alternative: akayin mo ako sa isang ligtas na lugar / kanlungan
  rationale: Tahasang gumagamit ang Hebreo ng צוּר. Ang pagpapanatili sa larawan ay nag-iingat sa tula at sa teolohikal na pahiwatig nito nang hindi nilulutas o pinapaliit ang metapora.
- issue: Kahulugan ng יָרוּם מִמֶּנִּי
  choice: 'Isalin bilang paghahambing: “mas mataas kaysa sa akin.”'
  alternative: “masyadong mataas para sa akin,” na nagpapahiwatig na hindi ito kayang marating ng nagsasalita sa sariling lakas
  rationale: Pinahihintulutan ng Hebreo ang dalawang pagbasa. Ang pangunahing teksto ay nagpapanatili ng mas tuwirang paghahambing, at inilalagay sa talababa ang mas malakas na diwa ng kawalan ng kakayahang marating ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang larawan ng “dulo ng daigdig,” “puso,” at “bato,” habang iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
