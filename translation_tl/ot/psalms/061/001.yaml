translation:
  language: tl
  text: 'Dinggin mo ang daing ko[a], O Diyos;

    pakinggan mo ang panalangin ko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking malakas na sigaw” o “aking pagsusumamo.” Ang salitang Hebreo ay maaaring tumukoy sa malakas na sigaw at, sa ilang konteksto, sa masayang sigaw o awit; ngunit dahil panalangin ang konteksto rito, mas angkop ang “daing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Dinggin mo
  rationale: Ang Qal imperative ng שׁמע ay tuwirang pakiusap sa Diyos na dinggin ang nagsasalita. Ang “dinggin mo” ay natural at marangal sa panalanging Filipino at higit na angkop sa layon na “daing” kaysa sa simpleng “makinig.”
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ginagamit ito bilang tuwirang pagtawag sa Diyos. Pinananatili ng “O Diyos” ang malinaw at panalanging himig ng bokatibo.
- source_word: רִנָּתִי
  choice: ang daing ko
  rationale: Ang רִנָּה ay maaaring tumukoy sa malakas o umaalingawngaw na sigaw, at sa ibang konteksto ay sigaw o awit ng kagalakan. Dahil nakahanay rito sa “panalangin ko” at humihingi ng pansin ng Diyos, ang “daing ko” ay natural na nagpapahayag ng marubdob na pagsusumamo nang hindi ito ginagawang awit ng papuri.
- source_word: הַקְשִׁיבָה
  choice: pakinggan mo
  rationale: Ang Hiphil imperative ng קשׁב ay humihiling ng masusing pakikinig o pagbibigay-pansin. Ang “pakinggan mo” ay malinaw at kasalukuyang Filipino, at pinananatili ang paralelismo nang hindi gumagamit ng lipas na pananalita.
- source_word: תְּפִלָּתִי
  choice: ang panalangin ko
  rationale: Ito ang karaniwang salita para sa panalangin. Ang tuwirang salin ay nagpapanatili sa paralelismo sa “daing ko” at umiiwas sa hindi kailangang pag-uulit ng ideya ng pagsusumamo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at angkop sa panalangin. Ginamit ang magkatugmang “Dinggin mo” at “pakinggan mo” upang maipakita ang dalawang Hebreong pautos at ang bahagyang diin ng ikalawa. Hindi nilagyan ng talababa sapagkat sapat na naihahatid ng “daing” ang kahulugang hinihingi ng konteksto nang hindi kailangang lutasin ang mas malawak na saklaw ng רִנָּה.
