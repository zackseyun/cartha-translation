  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: tl
  text: Manatili nawa siyang nakaluklok sa harap ng Diyos magpakailanman[a]; italaga mo ang tapat na pag-ibig at katotohanan[b] upang ingatan siya ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Manirahan nawa siya sa harap ng Diyos magpakailanman.” Ang pandiwa ay maaaring mangahulugang “umupo,” “manatili,” o “manirahan”; sa maharlikang kontekstong ito, malamang na may diwa ito ng pananatiling nakaluklok bilang hari.
    reason: lexical_alternative
  - marker: b
    text: Ang “katotohanan” ay maaari ring isaling “katapatan” dito. Ang Hebreong pares na “tapat na pag-ibig at katotohanan/katapatan” ay karaniwang nagpapahayag ng matapat na pag-ibig at pagiging maaasahan ng Diyos sa kanyang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Manatili nawa siyang nakaluklok
  rationale: Ang Qal imperfect ng ישׁב ay maaaring mangahulugang umupo, manirahan, o manatili. Dahil maharlika ang konteksto at panalangin ang talata, ipinahahayag ng “manatili nawa siyang nakaluklok” ang hinihiling na patuloy na paghahari nang hindi lubusang ikinukubli ang diwa ng pananatili.
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Likas at marangal itong katumbas sa Filipino para sa walang hanggang pagpapatuloy na ipinahahayag ng עוֹלָם.
- source_word: לִפְנֵי אֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Pinananatili nito ang tuwirang larawan ng Hebreo at maaari ring maunawaan bilang nasa presensiya at ilalim ng paningin ng Diyos.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito kapwa ang pag-ibig at ang matatag na katapatang nakapaloob sa חֶסֶד, lalo na sa ugnayang tipan.
- source_word: אֱמֶת
  choice: katotohanan
  rationale: Ito ang tuwirang leksikal na katumbas at pinananatili ang pamilyar na pares na “tapat na pag-ibig at katotohanan”; inilalahad sa talababa ang malakas na kontekstuwal na alternatibong “katapatan.”
- source_word: מַן
  choice: italaga mo
  rationale: 'Itinuturing ang anyo bilang pautos mula sa מנה: isang pakiusap sa Diyos na italaga ang mga katangiang kasunod bilang mga tagapag-ingat ng hari.'
- source_word: יִנְצְרֻהוּ
  choice: upang ingatan siya
  rationale: Malinaw nitong ipinahahayag ang pag-iingat o pagprotekta. Ang tapat na pag-ibig at katotohanan ay inihaharap na tila mga gumaganap na tagapag-ingat.
theological_decisions:
- issue: Lakas ng imperfect/jussive sa isang maharlikang panalangin
  choice: 'Isinalin bilang hiling: “Manatili nawa siyang nakaluklok”'
  alternative: 'Maaaring basahin bilang payak na panghinaharap: “Mananatili siyang nakaluklok.”'
  rationale: Petisyon ang nakapaligid na konteksto, at pautos sa Diyos ang ikalawang hati. Ang anyong hiling ay nagpapanatili sa pagkakaugnay ng talata bilang panalangin, habang kinikilala sa talababa ang leksikal na lawak ng pandiwa.
- issue: Kahulugan ng pares na חֶסֶד וֶאֱמֶת
  choice: “tapat na pag-ibig at katotohanan” bilang isinataong mga katangiang mula sa Diyos
  alternative: “tapat na pag-ibig at katapatan” o “awa at katotohanan”
  rationale: Madalas tukuyin ng pares ang matapat na pag-ibig at pagiging maaasahan ng Diyos sa tipan. Pinananatili ng pangunahing teksto ang tuwirang diwa ng אֱמֶת, samantalang itinatala sa talababa ang kontekstuwal na “katapatan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakaluklok” upang madama ang maharlikang konteksto, ngunit iniwasang gawing tahasang “trono” ang teksto sapagkat wala itong hiwalay na katumbas sa Hebreo. Ang “italaga mo” ay tuwirang pakikiusap sa Diyos, gaya ng pautos sa pinagmulang teksto.
