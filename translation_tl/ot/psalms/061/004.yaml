translation:
  language: tl
  text: Manirahan nawa ako sa iyong tolda magpakailanman[a]; magkanlong nawa ako sa kanlungan ng iyong mga pakpak[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maninirahan ako sa iyong tolda magpakailanman.” Ang anyong Hebreo ay maaaring magpahayag ng matinding hangarin o matibay na pasiya.
    reason: lexical_alternative
