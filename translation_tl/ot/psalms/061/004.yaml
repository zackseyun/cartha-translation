lexical_decisions:
- source_word: אָג֣וּרָה
  choice: Manirahan nawa ako
  rationale: Ang Qal cohortative na unang panauhang isahan ng גור ay nagpapahayag ng matinding hangarin o pakiusap. Likas sa makabagong Tagalog ang “manirahan nawa ako” at pinananatili nito ang bolitibong diwa.
- source_word: בְ֭/אָהָלְ/ךָ
  choice: sa iyong tolda
  rationale: Ang אָהֶל ay konkretong “tolda.” Maaari nitong ipahiwatig ang santuwaryo o tahanan ng Diyos, ngunit pinananatili ng saling ito ang mismong talinghaga nang hindi ito labis na tinutukoy.
- source_word: עוֹלָמִ֑ים
  choice: magpakailanman
  rationale: Ang maramihang anyo ng עוֹלָם ay idyomatikong nagpapatingkad ng walang-hanggang tagal; malinaw at marangal sa Tagalog ang “magpakailanman.”
- source_word: אֶֽחֱסֶ֨ה
  choice: manganlong nawa ako
  rationale: Ang חסה ay nangangahulugang humanap o tumanggap ng kanlungan. Dahil kaagapay ito ng cohortative sa unang linya, ang “nawa” ay nagpapanatili sa mapanalanging hangarin sa halip na gawin itong payak na pahayag tungkol sa hinaharap.
- source_word: בְ/סֵ֖תֶר
  choice: sa kublihan
  rationale: Ang סֵתֶר ay isang tago at mapagtanggol na lugar. Ang “kublihan” ay likas na naghahatid ng parehong pagkukubli at proteksiyon.
- source_word: כְּנָפֶ֣י/ךָ
  choice: ng iyong mga pakpak
  rationale: Tuwirang pinananatili ang larawan ng “iyong mga pakpak”; ang lokatibong ideya ay dala na ng “sa kublihan.”
- source_word: סֶּֽלָה
  choice: Selah
  rationale: Hindi tiyak ang eksaktong kahulugan ng terminong liturhikal o musikal na ito, kaya tinumbasan ito sa pamamagitan ng transliterasyon sa halip na hulaan ang kahulugan.
theological_decisions:
- issue: Larawan ng santuwaryo sa “iyong tolda”
  choice: Panatilihin ang konkretong talinghagang “iyong tolda.”
  alternative: “iyong santuwaryo” o “iyong tabernakulo”
  rationale: Malamang na ipinahihiwatig ng larawan ang presensiya at santuwaryo ng Diyos, ngunit “tolda” ang aktuwal na pangngalan sa Hebreo. Iniiwasan nitong gawing mas tiyak ang interpretasyong kultiko o teolohikal kaysa sa teksto.
- issue: Bolitibong diwa ng dalawang pandiwa
  choice: Isalin kapwa bilang mapanalanging hangarin gamit ang “nawa.”
  alternative: “Maninirahan ako … manganganlong ako” bilang matibay na pasiya o pangako.
  rationale: Malinaw na cohortative ang unang pandiwa, samantalang imperfect ang ikalawa at maaaring basahing pasiya o hangarin. Dahil magkatugma ang dalawang linya, ang bolitibong pagbasa sa ikalawa ay malamang, ngunit dapat kilalanin ang tunay na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tolda” upang mapanatili ang konkretong larawan, “kublihan” para sa proteksiyon at pagkakatago, at “nawa” upang ihayag ang mapanalanging tono. Pinanatili ang “Selah” dahil hindi tiyak ang kahulugan nito.
