  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: tl
  text: 'Sapagkat ikaw, O Diyos, ay nakinig sa aking mga panata;

    ibinigay mo[a] ang mana ng mga may takot sa iyong pangalan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “ibinigay mo sa akin ang mana ng mga may takot sa iyong pangalan.” Walang tahasang “sa akin” sa Hebreo, bagaman maaari itong ipahiwatig ng konteksto.'
    reason: alternative_reading
  - marker: b
    text: Ang “mga may takot sa iyong pangalan” ay mga taong namumuhay nang may mapitagang pagkatakot at pagpipitagan sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng batayan para sa naunang pakiusap o katiyakan.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Ang mga pandiwa at panghalip na nasa ikalawang panauhan ay nagpapakitang tuwirang kinakausap ang Diyos; ang “O Diyos” ay natural at marangal sa panalangin.
- source_word: שָׁמַעְתָּ
  choice: ay nakinig
  rationale: 'Higit sa basta pagkarinig ang ipinahihiwatig nito sa konteksto ng panalangin: binigyang-pansin ng Diyos ang mga panata. Ang aspektong naganap na ay angkop sa Hebreong perfect.'
- source_word: לִנְדָרָי
  choice: sa aking mga panata
  rationale: Ang נדר ay karaniwang tumutukoy sa taimtim na pangako o panata, hindi lamang sa handog na maaaring kaugnay nito.
- source_word: נָתַתָּ
  choice: ibinigay mo
  rationale: Pinananatili nito ang naganap na pagkilos ng Hebreong perfect nang hindi dinaragdagan ang hindi hayag na tumanggap.
- source_word: יְרֻשַּׁת
  choice: ang mana
  rationale: Ang salita ay tumutukoy sa minanang pag-aari o pamanang ipinagkaloob; “mana” ang pinakadirekta at natural na katumbas sa Filipino.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: mga may takot sa iyong pangalan
  rationale: Pinananatili ng “may takot” ang bigat ng ירא bilang mapitagang pagkatakot, at ang “iyong pangalan” ay kumakatawan sa Diyos ayon sa karaniwang gamit sa Kasulatan.
theological_decisions:
- issue: Kung may di-hayag na tumatanggap sa pariralang נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ
  choice: ibinigay mo ang mana ng mga may takot sa iyong pangalan
  alternative: ibinigay mo sa akin ang mana ng mga may takot sa iyong pangalan
  rationale: Walang tahasang katumbas ng “sa akin” sa Hebreo. Kaya hindi ito idinagdag sa pangunahing teksto, ngunit inilalahad sa talababa bilang isang posibleng unawa mula sa konteksto.
- issue: Kahulugan ng “mga may takot sa iyong pangalan”
  choice: Pinanatili ang matalinghagang pahayag
  alternative: mga namumuhay nang may pagpipitagan sa iyo
  rationale: Ang literal na larawan ay mahalagang bahagi ng wikang teolohikal ng salmo. Nililinaw ng talababa na hindi simpleng sindak ang tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na angkop sa panalangin at madaling maunawaan. Pinanatili ang maikling paralelismo ng tulang Hebreo at iniwasang idagdag sa pangunahing teksto ang di-hayag na “sa akin.”
