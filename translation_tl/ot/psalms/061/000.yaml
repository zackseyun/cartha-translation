  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan; na may saliw ng mga instrumentong de-kuwerdas. Kay David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ni David” o “Para kay David”; ang konstruksyon sa Hebreo ay maaaring magpahiwatig ng pagkatha, kaugnayan, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Likas at malinaw sa makabagong Filipino ang pariralang ito nang hindi nililimitahan ang tungkulin sa koro lamang.
- source_word: עַל נְגִינַת
  choice: saliw ng mga instrumentong de-kuwerdas
  rationale: Sa ganitong pamagat, ang עַל ay malamang na nagpapakilala ng musikal na saliw, at ang נְגִינַת ay tumutukoy sa musikang tinutugtog sa mga kuwerdas. Ipinahahayag ng salin ang malamang na gamit nito sa isang maikli at natural na paraan.
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Maaaring ipahiwatig ng lemed ang pagkatha, pag-uugnay, o pag-aalay. Hindi tiyak na ipinapahayag ng “Ukol kay David” ang may-akda, kaya napapanatili nito ang lawak ng Hebreong konstruksyon.
theological_decisions:
- issue: Ang lemed sa superskripsiyong Davidiko
  choice: Ukol kay David
  alternative: Ni David; Para kay David
  rationale: Hindi sapilitang nangangahulugan ang Hebreo na si David mismo ang may-akda. Pinananatili ng napiling salin at talababa ang tunay na kalabuan sa halip na lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa ng awitan” bilang madaling maunawaang katawagan sa tagapanguna ng musikal na pagtatanghal, at “instrumentong de-kuwerdas” bilang karaniwang modernong termino. Ang marker na [a] ay nakalagay kaagad pagkatapos ng “David,” na siyang ipinaliliwanag nito.
