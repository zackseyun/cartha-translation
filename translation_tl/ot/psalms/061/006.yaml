lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: ang mga araw ng hari
  rationale: Pinananatili ang Hebreong larawan ng pagdaragdag ng mga araw bilang pagpapahaba ng buhay, sa likas na ayos ng modernong Tagalog.
- source_word: תּוֹסִיף
  choice: Dagdagan mo pa
  rationale: Ang Hiphil imperfect na ikalawang panauhan ay inuunawa bilang pakiusap sa Diyos ayon sa konteksto ng panalangin; ipinapaliwanag sa talababa ang maaari ring pagbasa bilang pahayag sa hinaharap.
- source_word: שְׁנוֹתָיו
  choice: ang kanyang mga taon
  rationale: Ang panlalaking isahang hulapi ay tumutukoy sa hari at pinananatili ang paralelismo ng mga araw at mga taon.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: sa sali't salinlahing darating
  rationale: Likas na idyomang Filipino ito para sa sunod-sunod na mga salinlahi at ipinahahayag ang diwa ng matagal na pagpapatuloy.
theological_decisions:
- issue: Kung ang talata ay panalangin para sa mahabang buhay ng hari o isang pahayag tungkol sa hinaharap
  choice: 'Isinalin bilang pakiusap: “Dagdagan mo pa…” at “magpatuloy nawa…”'
  alternative: “Daragdagan mo pa…; magpapatuloy ang kanyang mga taon…”
  rationale: Maaaring ipakahulugan ang anyong pandiwa bilang hinaharap, ngunit higit na angkop sa konteksto ng panalangin ang pakiusap. Pinananatili sa talababa ang tunay na kalabuan.
- issue: Ang saklaw ng hangad na pagpapatuloy ng mga taon ng hari
  choice: “sa sali't salinlahing darating”
  alternative: “gaya ng salinlahi at salinlahi”
  rationale: Hindi tahasang nilulutas kung literal na haba ng buhay, pagpapatuloy ng paghahari, o dinastikong pag-iral ang nasa isip; pinananatili ang matayog at bukas na pananalita ng tula.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at makatang himig. Ginamit ang “sali't salinlahi” bilang karaniwang idyoma, habang iniwasang gawing tahasan ang isang partikular na doktrinal na paliwanag sa napakahabang mga taon ng hari.
