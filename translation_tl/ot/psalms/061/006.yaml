  text: 'Dagdagan mo ang mga araw ng hari[a];


    nawa’y magtagal ang kanyang mga taon, gaya ng sali’t salinlahi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Daragdagan mo ang mga araw ng hari; ang kanyang mga taon ay magiging gaya ng sali’t salinlahi.” Ang anyo ng pandiwa sa Hebreo ay maaaring basahin bilang pahayag tungkol sa hinaharap sa halip na isang pakiusap.'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “gaya ng salinlahi at salinlahi,” isang idyoma para sa patuloy na pag-iral sa magkakasunod na salinlahi.
