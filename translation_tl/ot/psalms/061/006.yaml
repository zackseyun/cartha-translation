  naturalness: Mas natural at malinaw sa modernong Tagalog ang “Nawa’y magtagal ang kanyang mga taon, gaya ng sali’t salinlahi” kaysa “magpatuloy nawa ang kanyang mga taon sa sali't salinlahing darating.” Ang “nawa’y” ay malinaw ring nagmamarka ng panalangin o kahilingan.
  terminology: Ang “hari,” “mga araw,” “mga taon,” at “sali’t salinlahi” ay angkop at marangal na mga katumbas. Pinananatili ng “sali’t salinlahi” ang idyomatikong pag-uulit ng דֹר וָדֹר nang walang doktrinal na pagpapaliit.
