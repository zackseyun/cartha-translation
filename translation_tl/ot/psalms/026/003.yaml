base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/003.yaml
  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: tl
  text: Sapagkat ang iyong tapat na pag-ibig[a] ay nasa harap ng aking mga mata, at namuhay ako ayon sa iyong katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong katapatan sa tipan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iyong katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng dahilan o batayan para sa pahayag ng salmista sa konteksto.
- source_word: חַסְדְּךָ
  choice: iyong tapat na pag-ibig
  rationale: Pinagsasama ng חֶסֶד ang pag-ibig, kabutihan, at matatag na katapatan, lalo na sa konteksto ng tipan. Likas at malinaw sa makabagong Filipino ang “tapat na pag-ibig” nang hindi nililimitahan ang salita sa damdamin lamang.
- source_word: לְנֶגֶד עֵינַי
  choice: nasa harap ng aking mga mata
  rationale: Pinananatili nito ang larawang Hebreo ng isang bagay na laging isinasaalang-alang o pinananatiling tanaw, habang nananatiling nauunawaan sa Filipino.
- source_word: וְהִתְהַלַּכְתִּי
  choice: at namuhay ako
  rationale: Ang anyo ng הלך ay tumutukoy rito sa paraan ng pamumuhay o asal. Inihahatid ng “namuhay ako” ang kahulugan ng metapora sa natural na Filipino at ang kilos na umaabot hanggang sa kasalukuyang pahayag.
- source_word: בַּאֲמִתֶּךָ
  choice: ayon sa iyong katotohanan
  rationale: Maaaring tumukoy ang אֱמֶת sa katotohanan, katapatan, o pagiging mapagkakatiwalaan. Pinananatili ng “katotohanan” ang malawak na saklaw nito, at ipinahahayag ng “ayon sa” kung paano nito ginagabayan ang pamumuhay ng salmista.
theological_decisions:
- issue: Saklaw ng kahulugan ng mga salitang חֶסֶד at אֱמֶת tungkol sa Diyos
  choice: Isinalin ang חֶסֶד bilang “tapat na pag-ibig” at ang אֱמֶת bilang “katotohanan,” habang inilalagay sa talababa ang mahahalagang alternatibo.
  alternative: Maaaring isalin ang חֶסֶד bilang “katapatan sa tipan” at ang אֱמֶת bilang “katapatan.”
  rationale: Pinananatili nito ang ugnayan ng pag-ibig, katapatan, katotohanan, at pagiging mapagkakatiwalaan ng Diyos nang hindi ipinipilit ang iisang doktrinal na pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang “nasa harap ng aking mga mata,” ngunit ginawang natural ang idyomang paglakad bilang “namuhay ako ayon sa.”
