translation:
  language: tl
  text: 'Hindi ako nakisama sa mga taong mapanlinlang,

    at hindi ako sasama sa mga nagkukubli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ako papasok kasama ng mga nakatago.” Maaaring tumukoy ang Hebreo sa mga taong nagtatago ng kanilang tunay na pagkatao, gaya ng mga mapagkunwari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: nakisama
  rationale: Ang literal na diwang “umupo” kasama ng iba ay idyomatikong tumutukoy rito sa pakikisama o pakikipag-ugnayan; natural itong ipinahahayag sa makabagong Tagalog bilang “nakisama.”
- source_word: מְתֵי שָׁוְא
  choice: mga taong mapanlinlang
  rationale: Ang שָׁוְא ay maaaring mangahulugang kabulaanan, kawalang-kabuluhan, o panlilinlang. Sa kontekstong moral at panlipunan ng talata, malinaw at natural ang “mga taong mapanlinlang” nang hindi nililimitahan ang salita sa pagsisinungaling lamang.
- source_word: נַעֲלָמִים
  choice: mga nagkukubli ng tunay nilang pagkatao
  rationale: Mula ito sa ugat na עלם, “magkubli.” Ipinahahayag ng salin ang malamang na diwa ng mga taong nagtatago ng kanilang tunay na pagkatao, habang iniiwasan ang mas tiyak at teolohikal na terminong “mga mapagkunwari.”
- source_word: אָבוֹא
  choice: sumasama
  rationale: Ang בוא ay literal na “pumarito, pumunta, o pumasok,” ngunit kasama ng עִם at kapantay ng unang sugnay, malamang na tumutukoy ito sa pagsama sa kanilang pangkat o pakikisalamuha sa kanila.
- source_word: וְעִם
  choice: at ... sa mga
  rationale: Pinananatili ng payak na koordinasyon ang parallelismo ng dalawang sugnay at natural itong pakinggan sa Tagalog.
theological_decisions:
- issue: Saklaw ng pahayag ng salmista tungkol sa pakikisama
  choice: Inilarawan bilang pagtanggi sa pakikisama sa mga mapanlinlang, hindi bilang lubos na pag-iwas sa anumang pakikipag-ugnayan sa makasalanan.
  alternative: Ipakahulugan bilang ganap na pagbabawal sa anumang pakikipag-ugnayan sa kanila.
  rationale: Ang mga pandiwang ginamit sa parallel na mga sugnay ay tumutukoy sa pakikisama o pag-anib sa kanilang samahan; hindi hinihingi ng Hebreo ang mas malawak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakisama/sumasama” upang ihatid nang natural ang idyomatikong diwa ng mga larawang “umupo” at “pumasok,” habang pinanatili sa talababa ang mas literal na alternatibo at ang tunay na antas ng kalabuan ng Hebreo.
