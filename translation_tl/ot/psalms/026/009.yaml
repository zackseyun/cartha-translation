  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: tl
  text: 'Huwag mo akong isama sa mga makasalanan[a],

    ni ang buhay ko sa mga taong marahas at may-sala sa pagbububo ng dugo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag mong tipunin ang kaluluwa ko kasama ng mga makasalanan.” Maaaring ipahiwatig ng pandiwa ang pagkuha sa isang tao kasama ng masasama sa panahon ng paghatol.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mga taong ng mga dugo,” isang idyoma para sa mararahas o may-sala sa pagbububo ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: isama
  rationale: Ang אָסַף ay karaniwang nangangahulugang “tipunin,” ngunit sa konteksto ng paghatol ay tumutukoy sa pagkuha o pagsama sa kapalaran ng iba. Likas sa Filipino ang “isama” at pinananatili nito ang pakiusap na huwag ibilang ang salmista sa masasama.
- source_word: נַפְשִׁי
  choice: ako
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa kaluluwa, buhay, o mismong tao. Sa Filipino, ang “ako” ang pinakanatural dito at hindi nagpapasok ng teknikal na paghahati ng katawan at kaluluwa; nananatili naman ang kaagapay na “buhay ko” sa ikalawang linya.
- source_word: חַטָּאִים
  choice: mga makasalanan
  rationale: Tuwirang tumutukoy ang pangngalan sa mga taong kinikilala sa kasalanan. Ang “mga makasalanan” ay maikli, malinaw, at dignified sa modernong Tagalog.
- source_word: אַנְשֵׁי דָמִים
  choice: mga taong marahas at mamamatay-tao
  rationale: Literal itong “mga taong [may] mga dugo,” isang idyoma para sa mararahas o may-sala sa pagbububo ng dugo. Ipinapahayag ng salin ang saklaw ng idyoma nang hindi ito nililimitahan lamang sa pagnanasa sa dugo.
- source_word: חַיָּי
  choice: ang buhay ko
  rationale: Sa paralelismo sa נַפְשִׁי, natural itong tumutukoy sa buhay ng salmista. Pinananatili ng “ang buhay ko” ang ikalawang poetic na pahayag.
- source_word: אַל
  choice: Huwag mo
  rationale: Kasama ng imperfect, nagpapahayag ito ng mariing negatibong pakiusap. Ang “Huwag mo” ay natural na pananalita sa panalangin sa Filipino.
theological_decisions:
- issue: Antropolohikal na diwa ng נַפְשִׁי at חַיָּי
  choice: Isalin ang una bilang “ako” at panatilihin ang ikalawa bilang “ang buhay ko.”
  alternative: “ang kaluluwa ko” at “ang buhay ko”
  rationale: Maaaring mangahulugan ang נֶפֶשׁ ng buong sarili, hindi kinakailangang hiwalay na espirituwal na sangkap. Iniiwasan ng “ako” ang pagpapataw ng teknikal na dualismo, habang pinananatili ng “buhay ko” ang poetic na paralelismo at diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isama” sa halip na literal na “tipunin” upang maging natural ang pakiusap, habang inilagay sa talababa ang literal na larawan at pahiwatig ng paghatol.
