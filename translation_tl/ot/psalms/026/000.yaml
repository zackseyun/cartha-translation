  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: tl
  text: 'Ni David.


    Hatulan mo ako[a], Yahweh,


    sapagkat namuhay ako nang may integridad[b].


    Nagtiwala ako kay Yahweh;


    hindi ako matitinag[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bigyan mo ako ng katarungan” o “Patunayan mong nasa matuwid ako.” Ang pandiwang Hebreo ay nangangahulugang “humatol,” ngunit dito maaaring tumukoy sa pagbibigay ng paborableng hatol.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nang may katapatan” o “nang walang kapintasan.” Ang salitang Hebreo ay nagpapahiwatig ng kabuuan, integridad, at matuwid na asal.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hindi ako madudulas” o “hindi ako mag-uurong-sulong.” Ang larawan sa Hebreo ay pagkawala ng tuntungan o katatagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Awit ni David
  rationale: Ang maikling pamagat ay literal na “Ni David”; idinagdag ang “Awit” upang maging malinaw at natural bilang pamagat ng salmo nang hindi tinutukoy kung ito ay akda niya, para sa kaniya, o tungkol sa kaniya.
- source_word: שָׁפְטֵנִי
  choice: Hatulan mo ako
  rationale: Pinananatili ang pangunahing diwa ng pandiwang “humatol,” habang ipinapaliwanag sa talababa na sa kontekstong ito maaari itong mangahulugang pagpapatunay na matuwid ang nagsasalita.
- source_word: בְּתֻמִּי
  choice: nang may katapatan
  rationale: Natural na ipinahahayag sa Filipino ang integridad o kabuuan ng matuwid na asal, nang hindi ito ginagawang pag-aangkin ng ganap na kawalang-kasalanan.
- source_word: לֹא אֶמְעָד
  choice: hindi ako matitinag
  rationale: Inilalarawan ang hindi pagkawala ng paninindigan o tuntungan; pinananatili ang maikli at tiyak na pahayag ng Hebreo.
theological_decisions:
- issue: Ang paghingi ng paghatol batay sa sariling integridad
  choice: Pinanatili ang tahasang pakiusap at pag-angkin ng katapatan.
  alternative: Isalin bilang “Ipagtanggol mo ako” at paliitin ang saklaw sa isang hatol na pabor sa nagsasalita.
  rationale: Hindi tahasang nilulutas ng Hebreo ang tensiyon sa pagitan ng banal na paghatol at ng pag-angkin ng salmista sa integridad; ang talababa lamang ang nagbibigay ng posibleng kontekstuwal na diwa.
- issue: Ugnayan ng pagtitiwala at hindi pagkatinag
  choice: Pinanatiling magkahiwalay na magkasunod na sugnay.
  alternative: Lagyan ng “kaya” upang gawing hayag na bunga ng pagtitiwala ang hindi pagkatinag.
  rationale: Maaaring ipahiwatig ng konteksto ang bunga, ngunit walang tahasang panandang sanhi o resulta sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na may maiikling linyang angkop sa tula. Ginamit ang “Yahweh” bilang personal na pangalan sa tetragrammaton. Iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto at inilagay sa mga talababa ang mahahalagang alternatibong leksikal.
