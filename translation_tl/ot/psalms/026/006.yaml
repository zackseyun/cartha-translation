base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/006.yaml
  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: tl
  text: 'Hinuhugasan ko ang aking mga kamay sa kawalang-sala[a],


    at umiikot ako sa palibot ng iyong altar, Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kadalisayan” o “sa kalinisan.” Ang salitang Hebreo ay maaaring tumukoy kapuwa sa moral na kawalang-sala at sa ritwal na kalinisan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at iikot ako sa palibot ng iyong altar, Yahweh.”'
    reason: verbal_aspect_alternative
lexical_decisions:
- source_word: אֶרְחַץ
  choice: Hinuhugasan ko
  rationale: Ang Qal imperfect na unang panauhan ay maaaring magpahayag ng nakagawian o matingkad na kasalukuyang kilos sa kontekstong patula. Likas sa modernong Tagalog ang aspektong imperpektibo rito, habang hindi ito nililimitahan sa tahasang panghinaharap.
- source_word: בְּנִקָּיוֹן
  choice: sa kawalang-sala
  rationale: Ang נִקָּיוֹן ay may saklaw na kalinisan, kadalisayan, at kawalang-sala. Pinananatili ng “kawalang-sala” ang moral na diin ng konteksto, samantalang inilalahad sa talababa ang posibleng pahiwatig ng ritwal na kalinisan.
- source_word: כַּפָּי
  choice: ang aking mga kamay
  rationale: Bagaman maaaring literal na tumukoy ang כף sa mga palad, “mga kamay” ang natural na katawagan sa Tagalog sa konteksto ng paghuhugas.
- source_word: וַאֲסֹבְבָה
  choice: at lumilibot ako
  rationale: Ang סבב ay nangangahulugang lumibot o pumalibot. Ang anyong may cohortative ending ay maaaring magpahiwatig ng pasiya o layunin, ngunit natural na basahin ito bilang kasunod na kilos sa unang pandiwa; itinatala sa talababa ang posibleng panghinaharap na pagbasa.
- source_word: מִזְבַּחֲךָ
  choice: iyong altar
  rationale: Ito ang tuwiran at karaniwang salin ng מִזְבֵּחַ na may hulaping ikalawang panauhang panlalaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: 'Saklaw ng נִקָּיוֹן: moral na kawalang-sala o ritwal na kalinisan'
  choice: kawalang-sala
  alternative: kalinisan; kadalisayan
  rationale: Mas nangingibabaw sa buong salmo ang pag-aangkin ng matuwid na pamumuhay, ngunit maaaring umalingawngaw rin ang ritwal na paghuhugas dahil binabanggit ang altar. Hindi inaalis ang tensiyong ito; inilalahad ang ibang pagbasa sa talababa.
- issue: Paglalarawan sa paglibot sa altar
  choice: at lumilibot ako
  alternative: at lilibot ako; upang makalibot ako
  rationale: Hindi tinutukoy ng teksto ang eksaktong ritwal o teolohikal na kahulugan ng paglibot. Isinalin lamang ang kongkretong kilos at pinanatili sa talababa ang aspektong maaaring panghinaharap o nagpapahayag ng pasiya.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreong teksto, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na gawing titulo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Hinuhugasan ko” at “lumilibot ako” upang maging natural ang aspektong patula at kasalukuyan o nakagawian, habang pinananatili sa mga talababa ang leksikal at aspektuwal na kalabuan ng Hebreo.
