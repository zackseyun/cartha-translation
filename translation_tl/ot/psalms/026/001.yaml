id: PSA.26.1
reference: Psalms 26:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: tl
  text: 'Kay David.[a]


    Bigyan mo ako ng katarungan, Yahweh,[b]


    sapagkat namuhay ako nang may integridad,[c]


    at nagtiwala ako kay Yahweh;


    hindi ako madudulas.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kay David” ay maaari ring mangahulugang “Ni David,” “Para kay David,” o tumukoy sa isang awit na kaugnay niya.
    reason: superscription_ambiguity
  - marker: b
    text: Sa literal, “Hatulan mo ako, Yahweh.” Dito, ang paghatol ay malamang na tumutukoy sa pagbibigay ng pasyang pabor sa nagsasalita o sa pagpapawalang-sala sa kanya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “nang may katapatan” o “sa aking kawalang-kapintasan.” Ang salitang Hebreo ay nagpapahiwatig ng integridad, kabuuan, at matuwid na asal, hindi kinakailangang ganap na kawalang-kasalanan.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring isalin na “hindi ako matitisod” o “hindi ako matitinag.” Ang larawan sa Hebreo ay pagdulas o pagkawala ng matatag na tuntungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili ng karaniwang pamagat na “Kay David” ang malawak na ugnayang maaaring ipahiwatig ng לְ—pagkakatha, pagkakaugnay, o pag-aalay—nang hindi pumipili ng isa lamang.
- source_word: שָׁפְטֵנִי
  choice: Bigyan mo ako ng katarungan
  rationale: Ang pandiwang שׁפט ay literal na tumutukoy sa paghatol, ngunit sa panalanging ito humihiling ang nagsasalita ng pasyang magpapatunay na nasa panig niya ang katarungan. Likas sa modernong Tagalog ang napiling pahayag at nananatili ang legal na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: בְתֻמִּי הָלַכְתִּי
  choice: namuhay ako nang may katapatan
  rationale: Ang literal na “lumakad” ay talinghaga para sa paraan ng pamumuhay. Ang תֹּם/תֻּמָּה ay kabuuang moral o integridad; ipinahahayag ito rito bilang katapatan nang hindi nagpapahiwatig ng ganap na kawalang-kasalanan.
- source_word: וּבַיהוָה בָּטַחְתִּי
  choice: at nagtiwala ako kay Yahweh
  rationale: Tuwirang ipinapahayag ng בטח ang pananalig at maaasahang pagsandig sa Diyos.
- source_word: לֹא אֶמְעָד
  choice: hindi ako madudulas
  rationale: Pinananatili nito ang kongkretong larawan ng pandiwang מעד—pagdulas o pagkawala ng matatag na tuntungan—at ang anyong nagpapahayag ng tiwala hinggil sa hinaharap.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Lakas ng pag-aangkin ng mang-aawit sa תֻם
  choice: katapatan o integridad, hindi ganap na kawalang-kasalanan
  alternative: kawalang-kapintasan
  rationale: Inaangkin ng nagsasalita ang matuwid at buo niyang asal bilang batayan ng apela, ngunit hindi tahasang sinasabi ng talata na wala siyang anumang kasalanan.
- issue: Ugnayan ng pagtitiwala at ng hindi pagdulas
  choice: Pinanatiling magkahiwalay ngunit magkaugnay na mga pahayag
  alternative: “nagtiwala ako kay Yahweh nang hindi nag-aalinlangan”
  rationale: Ang לֹא אֶמְעָד ay may sariling pandiwa at konkretong larawan. Hindi ito ginawang pang-abay lamang na naglalarawan sa paraan ng pagtitiwala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namuhay” sa halip na literal na “lumakad” upang maging likas sa karaniwang mambabasa, habang pinanatili sa talababa ang mahahalagang leksikal na posibilidad at ang legal at matalinghagang mga larawan ng Hebreo.
