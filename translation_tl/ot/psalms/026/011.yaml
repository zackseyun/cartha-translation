id: PSA.26.11
reference: Psalms 26:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: tl
  text: Ngunit ako naman ay lalakad nang may integridad[a]; tubusin mo ako at pagpakitaan mo ako ng kagandahang-loob[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang walang kapintasan,” o “nang walang sala.”
    reason: lexical_alternative
  - marker: b
    text: O, “kaawaan mo ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako naman
  rationale: Ipinahahayag ng pangatnig at hiwalay na panghalip ang pagsalungat at pagdidiin. Likas sa modernong Tagalog ang “Ngunit ako naman” at malinaw nitong naihihiwalay ang salmista sa masasamang binanggit sa konteksto.
- source_word: בְּתֻמִּי
  choice: nang may integridad
  rationale: Ang תֻּם ay tumutukoy sa kabuuan, pagiging walang kapintasan, o matuwid na asal. Ang “integridad” ay malinaw na tumutukoy sa matatag na katapatan sa pamumuhay nang hindi ipinahihiwatig ang ganap na kawalang-kasalanan.
- source_word: אֵלֵךְ
  choice: lalakad
  rationale: Pinananatili ang metaporang Hebreo ng paglakad bilang paraan ng pamumuhay. Ang anyong panghinaharap ay angkop sa אֵלֵךְ at maaari ring magpahayag ng nagpapatuloy na paninindigan.
- source_word: פְּדֵנִי
  choice: tubusin mo ako
  rationale: Ang פדה ay may diwa ng pagtubos o pagpapalaya kapalit ng pantubos. Pinananatili ng “tubusin” ang tiyak at mayamang diwa ng salita kaysa sa mas pangkalahatang “iligtas.”
- source_word: וְחָנֵּנִי
  choice: at pagpakitaan mo ako ng kagandahang-loob
  rationale: Ang חנן ay paglalaan ng biyaya o pabor. Natural at malinaw sa Tagalog ang “pagpakitaan ng kagandahang-loob,” at hindi nito nililimitahan ang kahulugan sa habag lamang.
theological_decisions:
- issue: Ang kahulugan ng pag-angkin ng salmista sa תֻּם
  choice: Integridad o matuwid na pamumuhay sa harap ng Diyos, hindi pag-angkin ng ganap na kawalang-kasalanan
  alternative: Mas matinding pag-angkin na walang kapintasan o walang sala
  rationale: Sa konteksto, inihahambing ng salmista ang kanyang landas sa landas ng masasama, ngunit humihingi pa rin siya ng pagtubos at kagandahang-loob. Pinananatili ng “integridad” ang positibong moral na pahayag at ang tensiyon nito sa paghingi niya ng biyaya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong metapora ng “paglakad,” at ginamit ang “integridad” bilang karaniwang modernong salitang hindi nagpapahiwatig ng ganap na kawalang-kasalanan. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
