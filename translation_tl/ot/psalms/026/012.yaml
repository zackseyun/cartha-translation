  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: tl
  text: Nakatayo ang paa ko sa patag na lugar[a]; sa mga kapulungan ay pupurihin ko si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pantay na lugar”; ang Hebreo ay maaari ring magpahiwatig ng katuwiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: ang paa ko
  rationale: Pangngalang isahan na may hulaping unang panauhan; natural sa Filipino ang isahang larawan at pinananatili nito ang personal na katatagan.
- source_word: עָמְדָה
  choice: Nakatayo
  rationale: Ang Qal perfect ay maaaring magpahayag ng kasalukuyang kalagayang bunga ng pagkakatatag; malinaw at natural itong ipinahahayag ng “nakatayo.”
- source_word: בְּמִישׁוֹר
  choice: sa patag na lugar
  rationale: Pinananatili ang konkretong larawan ng pantay o patag na lupain nang hindi inaalis ang posibleng pahiwatig ng katuwiran.
- source_word: בְּמַקְהֵלִים
  choice: sa mga kapulungan
  rationale: Ipinapakita ng “mga” ang plural ng Hebreo; ang “kapulungan” ay dignificado ngunit nauunawaan at hindi kinakailangang tumukoy sa isang denominasyonal na pagtitipon.
- source_word: אֲבָרֵךְ
  choice: pupurihin ko
  rationale: Bagaman literal na “pagpapalain ko,” kapag ang Diyos ang layon, natural sa Filipino ang “pupurihin ko” para sa pagpapahayag ng pagpupuri; pinananatili ang hinaharap/deklaratibong diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapakahulugan sa מִישׁוֹר
  choice: sa patag na lugar
  alternative: sa tuwid na landas / sa katuwiran
  rationale: Pinananatili ang pangunahing konkretong larawan at inilalagay sa talababa ang posibleng moral na pahiwatig upang hindi tahimik na lutasin ang ambiguwidad.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit ng teksto ang personal na pangalan; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Pagpapahayag ng ברך kapag ang Diyos ang layon
  choice: pupurihin ko
  alternative: pagpapalain ko
  rationale: Sa kontekstong ito, ang Hebreong “pagpalain” na nakatuon sa Diyos ay tumutukoy sa pagpuri o pagpapahayag ng papuri. Ang “pupurihin” ang natural na modernong Filipino nang hindi nagmumungkahing nagkakaloob ang tao ng pagpapala sa Diyos.
translation_notes:
  register: Modernong Filipino na may dignifikadong himig. Pinanatili ang isahang “paa,” ang plural na “mga kapulungan,” at ang konkretong larawan ng patag na lugar; iniwasan ang labis na eklesyastikal o denominasyonal na pananalita.
