  text: 'upang iparinig ang tinig ng pasasalamat[a]

    at isalaysay ang lahat ng kamangha-mangha mong mga gawa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “upang maipahayag nang malakas ang pasasalamat.” Causative ang pandiwang Hebreo: “upang iparinig” o “upang marinig ng iba.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng iyong mga kababalaghan” o “lahat ng kahanga-hanga mong mga gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: upang iparinig
  rationale: Ang Hiphil infinitive ng שׁמע ay literal na “magparinig” o “gawing marinig.” Likas sa Filipino ang “iparinig” at pinananatili nito ang causative na diwa ng Hebreo.
- source_word: בְּקוֹל
  choice: ang tinig
  rationale: Tuwirang inilalarawan ng parirala ang tinig na nagpapahayag ng pasasalamat. Ang “tinig” ay marangal at angkop sa tulang panrelihiyon.
- source_word: תּוֹדָה
  choice: pasasalamat
  rationale: Dito ay tumutukoy ito sa hayag na pagpapahayag ng pasasalamat, hindi lamang sa pangkalahatang papuri o sa isang handog.
- source_word: וּלְסַפֵּר
  choice: at isalaysay
  rationale: Ang Piel ng ספר ay maaaring mangahulugang maglahad o magsalaysay. Ang “isalaysay” ay natural at nagpapahiwatig ng pagkukuwento tungkol sa mga ginawa ng Diyos.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili ang saklaw na komprehensibo ng Hebreo.
- source_word: נִפְלְאוֹתֶיךָ
  choice: ang lahat ng kamangha-mangha mong gawa
  rationale: Ang pangngalan ay tumutukoy sa mga kahanga-hanga o pambihirang gawa ng Diyos. Nililinaw ng “gawa” ang pahiwatig na mga kilos ang tinutukoy, habang pinananatili ng “kamangha-mangha” ang diwa ng kababalaghan.
