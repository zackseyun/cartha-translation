  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: tl
  text: Kinamumuhian ko ang pagtitipon ng mga gumagawa ng masama[a], at hindi ako uupong kasama ng masasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kinamuhian ko ang samahan ng mga gumagawa ng masama.” Maaaring ipahayag ng anyong Hebreo ang pagkilos na nakatuon sa nakaraan, bagaman dito ay malamang na tumutukoy ito sa matatag na saloobin ng mang-aawit.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Kinamumuhian ko
  rationale: Ang Qal perfect na unang panauhang isahan ay maaaring tumukoy sa nakaraang pagkilos, ngunit sa kontekstong patula ay malamang na nagpapahayag ng matatag at nagpapatuloy na saloobin; natural itong ipinahahayag sa kasalukuyang panahunan sa Tagalog.
- source_word: קְהַל
  choice: pagtitipon
  rationale: Tumutukoy ito sa isang nagkakatipong pangkat. Ang “pagtitipon” ay malinaw at hindi nagdaragdag ng natatanging relihiyosong pahiwatig na maaaring dalhin ng “kapulungan.”
- source_word: מְרֵעִים
  choice: mga gumagawa ng masama
  rationale: Ang participle ay ginagamit bilang pangngalan para sa mga taong kakikitaan ng paggawa ng masama. Mas natural at malinaw sa modernong Tagalog ang pariralang ito kaysa sa mas siksik na “mga manggagawa ng kasamaan.”
- source_word: וְעִם
  choice: at ... kasama ng
  rationale: Pinag-uugnay ng waw at ng pang-ukol ang ikalawang linya sa una. Sa Tagalog, likas na isinasama ang diwa nito sa pariralang “uupong kasama ng.”
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Ang pang-uring ginamit bilang pangngalan ay tumutukoy sa mga taong masama sa asal. Ang “masasama” ay maikli, likas, at kaagapay ng “mga gumagawa ng masama.”
- source_word: לֹא אֵשֵׁב
  choice: hindi ako uupo
  rationale: Pinananatili nito ang larawang “umupo” at naipahahayag ang pasiya o matatag na pagtangging makisama, nang hindi ito pinalalakas tungo sa “manirahan.”
