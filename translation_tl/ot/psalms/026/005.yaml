translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Pinanatili ang paralelismo at ang kongkretong larawan ng pag-upo bilang pakikisama; iniwasan ang mga salitang may di-kinakailangang denominasyonal o liturhikal na pahiwatig.
