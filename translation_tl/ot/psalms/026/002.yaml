base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: tl
  text: Siyasatin mo ako, Yahweh, at subukin mo ako; dalisayin mo ang aking mga bato[a] at ang aking puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “mga bato” ay isang sinaunang larawan para sa pinakaloob na damdamin at kalooban.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Siyasatin mo ako
  rationale: Ipinahahayag ng pandiwang בחן ang masusing pagsusuri o pagpapatunay. Ang “siyasatin” ay natural at marangal sa modernong Tagalog at naipag-iiba ito sa kasunod na נסה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וְנַסֵּנִי
  choice: at subukin mo ako
  rationale: Ang נסה ay tumutukoy sa pagsubok upang mapatunayan ang tunay na kalagayan; pinananatili ng “subukin” ang paralelismo nang hindi inuulit ang “siyasatin.”
- source_word: צרופה
  choice: dalisayin mo
  rationale: Ang צרף ay salitang kaugnay ng pagdadalisay ng metal. Ang “dalisayin” ay malinaw at natural habang pinananatili ang larawang metalurhiko at ang ideya ng pagsusuri sa pamamagitan ng pagdadalisay.
- source_word: כִלְיוֹתַי
  choice: ang aking kaloob-looban
  rationale: Literal itong “aking mga bato,” ngunit sa sinaunang Hebreong antropolohiya ay sagisag ito ng pinakaloob na isip, damdamin, at mga motibo. Inihahatid ng “kaloob-looban” ang idyomatikong kahulugan sa natural na Tagalog; inilalahad sa talababa ang kongkretong larawan ng pinagmulan.
- source_word: וְלִבִּי
  choice: at ang aking puso
  rationale: Ang לֵב ay tumutukoy sa panloob na pagkatao, kabilang ang pag-iisip at pagpapasiya. Ang “puso” ang natural na katumbas at pinananatili ang poetic parallelism.
theological_decisions:
- issue: Larawang antropolohiko ng “mga bato” at “puso”
  choice: Isalin ang כִלְיוֹתַי bilang “aking kaloob-looban,” na may talababa tungkol sa literal na larawan.
  alternative: “aking mga bato at aking puso”
  rationale: Sa modernong Tagalog, ang literal na “mga bato” ay karaniwang mauunawaan lamang bilang mga organo at maaaring ikubli ang layong tukuyin ang pinakaloob na isip, damdamin, at motibo. Pinananatili ng talababa ang transparency sa Hebreong larawan nang hindi isinasakripisyo ang pagkaunawa sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin at tula. Ginamit ang tuwirang mga pautos na “siyasatin,” “subukin,” at “dalisayin,” at pinanatili ang pangalang Yahweh.
