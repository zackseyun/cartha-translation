base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: tl
  text: 'Yahweh, iniibig[a] ko ang tahanan sa iyong bahay,

    at ang lugar na tahanan ng iyong kaluwalhatian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “minahal ko” o “inibig ko.”'
    reason: Ipinakikita ng anyong perfect ng pandiwang Hebreo ang posibilidad ng nakaraang kilos, bagaman sa kontekstong patula ay maaari itong magpahayag ng matatag na kasalukuyang saloobin.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אָהַבְתִּי
  choice: iniibig ko
  rationale: Bagaman anyong perfect ang pandiwang Hebreo, maaari itong magpahayag sa tula ng matatag at nagpapatuloy na saloobin; natural itong naipahahayag sa kasalukuyang panahunan sa Tagalog.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: ang tahanan mong bahay
  rationale: Pinananatili nito ang dalawang larawang “tahanan” at “bahay” nang hindi tahasang pinapalitan ang בֵּיתֶךָ ng “templo.”
- source_word: וּמְקוֹם
  choice: at ang lugar
  rationale: Pinanatili ang pangatnig na וּ at ang karaniwang kahulugan ng מָקוֹם.
- source_word: מִשְׁכַּן כְּבוֹדֶךָ
  choice: pinananahanan ng iyong kaluwalhatian
  rationale: Ginawang likas na sugnay sa Tagalog ang nominal na pariralang Hebreo, habang pinananatili ang larawan ng kaluwalhatian ng Diyos na nananahan sa lugar.
theological_decisions:
- issue: Paglalarawan sa santuwaryo nang hindi labis na tinutukoy ang referensiya
  choice: ang tahanan mong bahay
  alternative: ang iyong templo
  rationale: “Bahay” ang tahasang salita sa Hebreo. Bagaman santuwaryo ang tinutukoy sa konteksto, hindi ito pinalitan ng mas tiyak na “templo.”
- issue: Kalikasan ng kaluwalhatian ng Diyos sa ikalawang linya
  choice: ang lugar na pinananahanan ng iyong kaluwalhatian
  alternative: ang lugar kung saan nakaluklok ang iyong kaluwalhatian
  rationale: Ang teksto ay nagsasalita tungkol sa pananahan, hindi tahasang tungkol sa pagkaluklok; kaya pinanatili ang tensiyon at larawan ng pinagmulang wika.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “iniibig” bilang likas ngunit mataas na rehistrong salita para sa pananalitang panrelihiyon; iniwasan ang arkaikong ayos at ang labis na pagpapakahulugang “templo.”
