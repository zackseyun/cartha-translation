  text: na sa kanilang mga kamay ay kasamaan[a], at ang kanilang kanang kamay ay punô ng mga suhol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “krimen,” “kabuktutan,” o “masamang balak” para sa “kasamaan” (זִמָּה).
