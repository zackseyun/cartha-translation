lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: na sa kanilang mga kamay
  rationale: Ipinagpapatuloy ng pariralang pang-ugnay ang paglalarawan sa mga taong binanggit sa naunang talata at pinananatili ang larawan ng kasamaan na nasa kanilang mga kamay.
- source_word: זִמָּה
  choice: kasamaan
  rationale: Malawak ang saklaw ng salita—maaaring tumukoy sa masamang balak, krimen, o kahalayan. Sa pagkakapantay nito sa panunuhol, ang pangkalahatang 'kasamaan' ang pinakaangkop nang hindi ito nililimitahan sa seksuwal na kasalanan.
- source_word: וִימִינָם
  choice: at ang kanilang kanang kamay
  rationale: Pinananatili ang kolektibong pang-isahang 'kanang kamay' at ang Hebreong larawan ng kamay bilang kasangkapan ng pagkilos at kapangyarihan.
- source_word: מָלְאָה
  choice: ay punô ng
  rationale: Likas na ipinahahayag sa Filipino ang kalagayang inilalarawan ng pandiwa.
- source_word: שֹׁחַד
  choice: mga suhol
  rationale: Bagaman pang-isahan ang anyong Hebreo, maaari itong gamitin sa pangkalahatang diwa; natural sa Filipino ang maramihang 'mga suhol' para sa nakagawiang katiwalian.
