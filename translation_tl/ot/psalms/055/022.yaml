  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: tl
  text: Ipagkatiwala mo kay Yahweh ang iyong pasanin[a], at aalalayan ka niya; hindi niya kailanman hahayaang matinag ang matuwid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang iyong kapalaran,” “ang iyong alalahanin,” o marahil “ang ibinigay sa iyo.” Bihira ang pangngalang Hebreo at maaaring tumukoy nang mas malawak sa anumang nakaatang sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Pang-isahang panlalaki ang anyong Hebreo, ngunit malamang na ginagamit ito bilang kinatawan ng sinumang matuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Ipagkatiwala mo
  rationale: Ang literal na larawan ay paghahagis o paglalagak ng isang bagay sa iba. Sa makabagong Tagalog, natural na ipinahihiwatig ng “ipagkatiwala” ang sadyang paglalagak ng pasanin kay Yahweh, bagaman bahagyang hindi nito lantad ang pisikal na metapora.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: יְהָבְךָ
  choice: iyong pasanin
  rationale: Bihira ang pangngalang Hebreo at maaaring tumukoy sa pasan, alalahanin, kapalaran, o anumang nakaatang sa isang tao. Ang “pasanin” ang pinakanatural sa konteksto ng kasunod na pangakong aalalayan siya ng Diyos; inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: יְכַלְכְּלֶךָ
  choice: aalalayan ka niya
  rationale: Saklaw ng pandiwa ang pagsuporta, pagpapanatili, at paglalaan. Ang “aalalayan” ay likas at marangal sa Tagalog at angkop sa larawan ng taong may pasanin.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: hindi niya kailanman hahayaang
  rationale: Natural na ipinapahayag sa Tagalog ang idyomatikong diwa ng pangmatagalang pagtangging magpahintulot.
- source_word: מוֹט
  choice: matinag
  rationale: Ipinahihiwatig nito ang pag-uga, pagkadulas, o pagkawala ng katatagan. Pinananatili ng “matinag” ang metapora nang hindi ipinapalagay ang ganap na pagkawasak.
- source_word: לַצַּדִּיק
  choice: ang matuwid
  rationale: Ang pang-isahang panlalaking anyo ay substantibo at malamang na kumakatawan sa sinumang matuwid. Ang “ang matuwid” ay natural sa Tagalog at hindi nagdaragdag ng kasariang hindi kailangang tahasang ulitin sa salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nag-aangkat ng isang denominasyonal na katawagan.
- issue: Saklaw ng pangakong hindi matitinag ang matuwid
  choice: hindi niya kailanman hahayaang matinag ang matuwid
  alternative: hindi niya hahayaang dumanas ng anumang paghihirap ang matuwid
  rationale: Pinananatili ang metapora ng kawalang-katatagan. Hindi ito pinalawak tungo sa pangakong walang paghihirap, sapagkat hindi iyon tahasang sinasabi ng talata.
- issue: Kasarian at bilang ng לַצַּדִּיק
  choice: ang matuwid
  alternative: ang matuwid na lalaki; ang mga matuwid
  rationale: Pang-isahan at panlalaki ang anyong Hebreo, ngunit maaari itong magkaroon ng kinatawang diwa. Pinananatili ng “ang matuwid” ang pang-isahan at ang likas na ambiguwidad ng saklaw nang hindi dinaragdagan ng tahasang “lalaki” o ginagawang tahasang maramihan.
translation_notes:
  register: Makabago, dignidadong Filipino na madaling maunawaan. Ginamit ang “ipagkatiwala” para sa natural na paanyaya at “aalalayan” para sa malawak na diwa ng pagsuporta at pagpapanatili. Inilagay ang [b] pagkatapos ng buong pariralang “ang matuwid” upang malinaw na ito ang tinutukoy ng tala.
