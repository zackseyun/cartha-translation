translation:
  language: tl
  text: 'Para sa tagapangasiwa ng musika: sa saliw ng mga instrumentong de-kuwerdas. Isang Maskil[a] ni David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang awit na nagbibigay-aral” o “isang mapagnilaying awit.” Hindi tiyak ang eksaktong kahulugan ng Maskil sa mga pamagat ng Awit.
    reason: lexical_alternative
  - marker: b
    text: Ang “ni David” ay maaari ring mangahulugang “gawa ni David,” “para kay David,” o isang awit na may kaugnayan kay David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong namumuno o nangangasiwa sa pagtatanghal ng musika. Mas malawak at mas tiyak sa tungkulin ang “tagapangasiwa ng musika” kaysa “pinuno ng koro,” sapagkat hindi tahasang binabanggit sa Hebreo ang isang koro.
- source_word: בִּנְגִינֹת
  choice: saliw ng mga instrumentong de-kuwerdas
  rationale: Ipinahihiwatig ng termino ang musikang tinutugtog sa mga instrumentong may kuwerdas. Ang “saliw” ay natural sa Filipino at angkop sa isang tagubiling pangmusika.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Teknikal na katawagan ito sa mga pamagat ng ilang Awit, at hindi tiyak ang eksaktong kahulugan. Pinanatili ang transliterasyon upang hindi ipilit ang isang pagpapakahulugan; inilagay sa talababa ang mga pangunahing posibilidad.
- source_word: לְדָוִד
  choice: ni David
  rationale: Karaniwang anyo ito sa Filipino para sa kaugnayan kay David sa pamagat, ngunit hindi nito lubos na matutukoy kung may-akda siya, para sa kaniya ang awit, o kabilang ito sa koleksiyong iniuugnay sa kaniya. Nililinaw sa talababa ang saklaw ng Hebreong parirala.
theological_decisions:
- issue: Ang uri ng kaugnayan kay David na ipinahihiwatig ng לְדָוִד
  choice: ni David
  alternative: “gawa ni David,” “para kay David,” o “may kaugnayan kay David”
  rationale: Maaaring magpahiwatig ang pang-ukol na Hebreo ng pag-akda, pag-aalay, pag-uukol, pagmamay-ari, o kaugnayan. Iniwasan ang “gawa ni David,” na magpapasya agad na tuwirang pag-akda ang ibig sabihin, at pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa ng musika” upang hindi ipalagay na koro lamang ang pinamumunuan, at pinanatili ang teknikal na katawagang “Maskil” dahil hindi tiyak ang kahulugan nito.
