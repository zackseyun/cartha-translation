  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: tl
  text: Makinig ka, O Diyos, sa aking panalangin, at huwag mong ikubli ang iyong sarili sa aking pagsusumamo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag mong ipagwalang-bahala ang aking pagsusumamo.” Literal na “huwag mong ikubli ang iyong sarili”; ipinahihiwatig nito ang pagtangging dinggin ang panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Makinig ka
  rationale: Ang pautos na anyo ng אזן ay humihiling ng maingat na pakikinig. Likas at malinaw sa modernong Filipino ang “Makinig ka,” habang napananatili ang tuwirang panawagan.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos. Ang “O” ay nagpapanatili ng marangal at panalanging himig nang hindi ipinapalit ang pangalang tipan na wala sa Hebreo.
- source_word: תְּפִלָּתִי
  choice: aking panalangin
  rationale: Karaniwang salita ang תְּפִלָּה para sa panalangin; tuwiran at natural ang katumbas na Filipino.
- source_word: וְאַל
  choice: at huwag
  rationale: Pinananatili nito ang koordinasyon ng ikalawang kahilingan sa una at ang negatibong pautos.
- source_word: תִּתְעַלַּם
  choice: ikubli ang iyong sarili
  rationale: Ang reflexive na anyo ay literal na naglalarawan sa pagkukubli ng sarili o pagiging hindi mapuntahan. Pinananatili ng salin ang matalinghagang at relasyonal na puwersa sa halip na agad itong gawing “ipagwalang-bahala.”
- source_word: מִתְּחִנָּתִי
  choice: sa aking pagsusumamo
  rationale: Ang תְּחִנָּה ay taimtim na pakiusap para sa awa o lingap. Ang “pagsusumamo” ay marangal, nauunawaan, at nagpapahayag ng tindi ng pakiusap; natural sa Filipino ang “magkubli sa” bilang katumbas ng Hebreong may מִן sa kontekstong ito.
