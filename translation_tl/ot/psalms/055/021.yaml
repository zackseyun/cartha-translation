  source_fidelity: 'Tapat ang pangunahing salin sa Hebreo: naipapahayag ng “madulas” ang makinis/mapanlinlang na katangian ng pananalita; pinananatili ng “digmaan ang nasa puso niya” ang maigting na metapora ng וּקֲרָב לִבּוֹ; at wasto ang paghahambing na mas banayad kaysa langis at ang larawan ng mga tabak na nabunot sa kaluban. Ang pagdaragdag ng “mga tabak” ay isang ligtas na pagpapalinaw sa פְתִחוֹת batay sa konteksto at sa kinikilalang idyoma.'
  naturalness: 'Natural at marangal ang daloy ng pangunahing teksto sa modernong Filipino. Mas natural ang “nabunot sa kaluban” kaysa “hinugot na sa kaluban” para sa mga tabak, bagaman kapwa nauunawaan. Kailangang iwasto ang “mapamuri” sa talababa: karaniwan itong nangangahulugang mapanuri o kritikal, hindi mapagbigay-puri o mapambola.'
  terminology: Ang “digmaan,” “langis,” at “tabak” ay malinaw at angkop. Pinanatili ang pandamang larawan ng “madulas” at “banayad” nang hindi isinasara ang leksikal na kahirapan ng unang parirala. Sa lexical-alternative footnote, “mapagbigay-puring mga salita” ang mas tumpak na katumbas ng flattering words kaysa “mapamuring mga salita.”
