    rationale: Sa modernong Filipino, ang “mapamuri” ay karaniwang ‘mapanuri’ o ‘kritikal,’ samantalang ang Hebreo at English audit trail ay tumutukoy sa makinis, parang-mantikilya, o mapagbigay-puring/mapambolang pananalita.
  - severity: low
