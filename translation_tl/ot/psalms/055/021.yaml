  to: Madulas ang mga salitang lumalabas sa kanyang bibig[a], ngunit digmaan ang nasa puso niya; mas banayad pa sa langis ang kanyang mga salita, ngunit ang mga iyon ay mga tabak na nabunot sa kaluban.[b]
