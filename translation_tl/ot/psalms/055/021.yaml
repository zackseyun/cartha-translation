  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: tl
  text: Madulas ang mga salitang lumalabas sa kanyang bibig[a], ngunit digmaan ang nasa puso niya; mas banayad pa sa langis ang kanyang mga salita, ngunit ang mga iyon ay mga tabak na nabunot sa kaluban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mapagbigay-puring mga salita ang lumalabas sa kanyang bibig.” Pambihira ang ekspresyong Hebreo at maaari itong mas tiyak na tumukoy sa pananalitang makinis na parang mantikilya o mapagbigay-puri.
    reason: lexical_alternative
  - marker: b
    text: O, “mga tabak na nakalabas sa kaluban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: Madulas ang mga salitang lumalabas sa kanyang bibig
  rationale: Ang pambihirang parirala ay tumutukoy sa makinis, madulas, o mapamuring pananalita. Ginamit ang “madulas” upang mapanatili ang larawang pandama at ang pahiwatig ng mapanlinlang na pananalita nang hindi pinipili nang tahasan ang iisang diwa ng mahirap na ekspresyon.
- source_word: וּקֲרָב לִבּוֹ
  choice: ngunit digmaan ang nasa puso niya
  rationale: Ang קְרָב ay pangngalang “digmaan/labanan.” Pinanatili ang matinding metapora at ang salungatan sa pagitan ng panlabas na pananalita at panloob na hangarin.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: mas banayad pa sa langis ang kanyang mga salita
  rationale: Ipinahahayag ng רַכּוּ ang pagiging malambot o banayad, at ang מִן ay naghahambing. Natural sa Filipino ang “mas banayad pa sa langis” habang pinananatili ang paghahambing ng Hebreo.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: ngunit ang mga iyon ay mga tabak na hinugot na sa kaluban
  rationale: Ang פְתִחוֹת ay literal na may diwang “mga nabuksan” ngunit nauunawaan dito bilang mga sandatang inilabas o hinugot. Nilinaw ang ipinahihiwatig na “mga tabak” ayon sa konteksto at pinanatili ang matinding paghahambing sa nakatagong karahasan.
