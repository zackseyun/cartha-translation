lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Pakinggan mo akong mabuti
  rationale: Ang pautos na anyo ng קשׁב ay humihiling ng maingat at masusing pakikinig; natural sa makabagong Filipino ang pariralang ito at naipapakita nito ang tindi ng pagsusumamo.
- source_word: לִּי
  choice: ako
  rationale: Ang unang panauhang isahan na layon ay likas na isinama sa pariralang “Pakinggan mo akong mabuti.”
- source_word: וַעֲנֵנִי
  choice: at sagutin mo ako
  rationale: Tuwirang ipinapahayag nito ang kahilingan sa Diyos na tumugon sa panalangin.
- source_word: אָרִיד
  choice: Hindi ako mapalagay
  rationale: Ipinahihiwatig ng pandiwa ang balisa at hindi mapakaling kalagayan, at posibleng pati ang balisang paggala; pinananatili ng salin ang pangunahing diwa nang hindi ipinapalagay na literal na paglalakad ang tinutukoy.
- source_word: בְּשִׂיחִי
  choice: habang inihahayag ko ang aking hinaing
  rationale: Maaaring tumukoy ang שׂיח sa pagbubulay, pagninilay, o paghihinagpis. Sa konteksto ng panaghoy, ang “hinaing” ay angkop, samantalang ang “inihahayag” ay malinaw na nag-uugnay nito sa naririnig na pagdaing.
- source_word: וְאָהִימָה
  choice: at napapadaing ako
  rationale: Ang המה ay nagsasaad ng paglikha ng tunog gaya ng pag-ungol o pagdaing. Ang “napapadaing” ay natural at nagpapahiwatig ng kusang paglabas ng matinding dalamhati.
