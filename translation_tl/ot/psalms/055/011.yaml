translation:
  language: tl
  text: Nasa gitna niya ang mga kapahamakan[a]; ang pang-aapi at pandaraya ay hindi lumilisan sa kaniyang liwasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nasa gitna niya ang mapaminsalang kasamaan.” Maaaring tumukoy ang pangmaramihang salita sa Hebreo sa sari-saring kapahamakan o mapaminsalang gawa.
    reason: lexical_alternative
  - marker: b
    text: O “sa kaniyang mga lansangan.” Ang salitang Hebreo ay karaniwang tumutukoy sa bukás na pampublikong lugar o liwasan sa loob ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: mga kapahamakan
  rationale: Ang pangngalan sa Hebreo ay maramihan at maaaring tumukoy sa mga mapaminsalang kasamaan, kapinsalaan, o kapahamakan. Pinananatili ng “mga kapahamakan” ang bilang at malawak na diwa ng salita nang hindi nililimitahan ito sa pisikal na pagkawasak lamang.
- source_word: בְּקִרְבָּהּ
  choice: nasa loob niya
  rationale: Tumutugma ito sa literal na “sa kaniyang kalooban/gitna” at pinananatili ang pambabaeng personipikasyon ng lungsod sa pamamagitan ng “niya.”
- source_word: יָמִישׁ
  choice: hindi nawawala
  rationale: Ipinahahayag nito ang patuloy na pananatili ng pang-aapi at pandaraya. Bagaman isahan ang anyo ng pandiwa sa Hebreo, natural sa Tagalog ang iisang panaguri para sa tambalang paksa.
- source_word: מֵרְחֹבָהּ
  choice: sa kaniyang liwasan
  rationale: Ang רְחוֹב ay karaniwang bukás na pampublikong lugar o plasa sa lungsod. Ang “liwasan” ay natural at mas tiyak kaysa pangkalahatang “mga lansangan.”
- source_word: תֹּךְ
  choice: pang-aapi
  rationale: Maaaring tumukoy ang salita sa pang-aapi, pangingikil, o pandaraya. Ang “pang-aapi” ay malinaw at angkop sa konteksto ng karahasang panlipunan sa lungsod.
- source_word: וּמִרְמָה
  choice: at pandaraya
  rationale: Karaniwang tumutukoy ang מִרְמָה sa panlilinlang, pandaraya, o pagtataksil. Ang “pandaraya” ay malinaw sa modernong Tagalog at mahusay na kaagapay ng “pang-aapi.”
