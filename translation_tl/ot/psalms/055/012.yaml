  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: tl
  text: Sapagkat hindi isang kaaway ang lumalait sa akin—kung gayon, matitiis ko sana[a]; hindi isang napopoot sa akin ang nagmamataas laban sa akin[b]—kung gayon, makapagtatago sana ako mula sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inaalipusta ako.” Ang pandiwang Hebreo ay tumutukoy sa mapanghamak na pananalita.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagpakadakila laban sa akin,” ibig sabihin, kumilos nang may pagmamataas laban sa akin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa naunang panaghoy at likas ang daloy nito sa makatang Filipino.
- source_word: אוֹיֵב
  choice: kaaway
  rationale: Karaniwan, malinaw, at tumpak na katumbas ng taong kalaban.
- source_word: יְחָרְפֵנִי
  choice: lumalait sa akin
  rationale: Ipinahahayag ng חרף ang mapanghamak na pananalita o pag-alipusta; natural at marangal sa modernong Filipino ang “lumalait.”
- source_word: וְאֶשָּׂא
  choice: kung gayon, matitiis ko sana
  rationale: Ang נשׂא ay idyomatikong nangangahulugang magtiis o magbata rito. Ipinakikita ng “sana” ang di-tunay na kalagayang ipinahihiwatig ng konteksto.
- source_word: מְשַׂנְאִי
  choice: isang napopoot sa akin
  rationale: Pinananatili nito ang personal at patuloy na diwa ng participle nang hindi gumagamit ng di-likas na “tagapoot ko.”
- source_word: עָלַי הִגְדִּיל
  choice: nagmamataas laban sa akin
  rationale: Ang literal na “nagpakadakila laban sa akin” ay tumutukoy sa mapagmataas at mapanghamong pagkilos; malinaw itong naipahahayag ng “nagmamataas.”
- source_word: וְאֶסָּתֵר
  choice: kung gayon, makapagtatago sana ako
  rationale: Ang Niphal ay nagsasaad ng pagtatago ng sarili; pinananatili ng “sana” ang kontrapaktuwal na diwa.
- source_word: מִמֶּנּוּ
  choice: sa kaniya
  rationale: Sa pandiwang “magtago,” natural sa Filipino ang “magtago sa kaniya,” na may kahulugang umiwas o magkubli mula sa taong iyon.
