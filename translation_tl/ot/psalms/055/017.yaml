  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: tl
  text: Gabi, umaga, at tanghali, ako’y dumaraing at humihibik[a], at dinirinig niya ang tinig ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagninilay at humihibik” o “nagsasalita at humihibik.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagninilay, pagsasalita, o paghahayag ng hinaing; sa konteksto ng panaghoy, malamang na hinaing ang diwa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “at dinirinig niya ang tinig ko.” Hindi tahasang binanggit ang simuno; ayon sa konteksto, Diyos ang tinutukoy. Maaari ring unawain ang pandiwa bilang “at diringgin niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: Gabi, umaga, at tanghali
  rationale: Pinananatili ang magkakatimbang na talaan ng tatlong bahagi ng araw at ang maindayog na anyo ng Hebreo.
- source_word: אָשִׂיחָה
  choice: ako'y dumaraing
  rationale: Maaaring mangahulugan ang שׂיח ng pagninilay, pagsasalita, o paghahayag ng hinaing. Sa konteksto ng panaghoy at sa pagkakatambal nito sa אֶהֱמֶה, ang 'dumaraing' ang pinakamalamang ngunit hindi itinatago ang ibang posibilidad sa talababa.
- source_word: וְאֶהֱמֶה
  choice: at humihibik
  rationale: Ipinahihiwatig ng המה ang naririnig na pagkabalisa o pagdaing. Ang 'humihibik' ay natural at dignified na paglalarawan ng tinig na puno ng dalamhati.
- source_word: וַיִּשְׁמַע
  choice: at dinirinig niya
  rationale: Bagaman anyong waw-consecutive imperfect ang pandiwa, sa tulang kontekstong ito maaari itong magpahayag ng tiyak o nakaugaliang pagdinig. Ang pangkasalukuyang 'dinirinig' ay umaayon sa tuloy-tuloy na panalangin ng nagsasalita.
- source_word: קוֹלִי
  choice: ang tinig ko
  rationale: Tuwirang katumbas ng קוֹלִי at pinananatili ang personal at naririnig na katangian ng panalangin.
theological_decisions:
- issue: Di-binanggit na simuno ng וַיִּשְׁמַע
  choice: Pinanatili ang panghalip na 'niya,' na tumutukoy sa Diyos ayon sa konteksto.
  alternative: Dinirinig ng PANGINOON ang tinig ko.
  rationale: Hindi tahasang binabanggit sa talata ang pangalan ng Diyos. Iniiwasang magdagdag ng salitang wala sa Hebreo habang nananatiling malinaw sa nakapaligid na konteksto ang tinutukoy.
- issue: Aspekto/panahon ng וַיִּשְׁמַע
  choice: dinirinig niya
  alternative: diringgin niya / at narinig niya
  rationale: Pinananatili ang posibilidad ng tiyak at paulit-ulit na tugon ng Diyos sa loob ng patulang diskurso, sa halip na ipako ito sa isang nakaraang pangyayari.
translation_notes:
  register: Makabago at dignified na Filipino. Ginamit ang maikling parallel na 'Gabi, umaga, at tanghali' upang mapanatili ang ritmo. Ang 'dumaraing at humihibik' ay malinaw sa karaniwang mambabasa at angkop sa panaghoy; ipinaliwanag sa talababa ang tunay na luwang ng kahulugan ng unang pandiwa.
