translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “matalik na kasama” at “kaibigang lubos na kakilala” upang mapanatili ang pag-igting at pagkakalapit ng dalawang katawagang Hebreo, habang inilalagay sa talababa ang tunay na leksikal na alternatibo para sa אַלּוּף.
