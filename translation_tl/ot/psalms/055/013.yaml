lexical_decisions:
- source_word: וְאַתָּה
  choice: Ngunit ikaw
  rationale: Ang pangatnig at tahasang panghalip ay nagpapakita ng matinding pagsalungat sa naunang konteksto; likas itong ipinahahayag ng “Ngunit ikaw” sa Filipino.
- source_word: אֱנוֹשׁ
  choice: isang lalaki
  rationale: Tumutukoy ito sa isang taong lalaki; sa konteksto, binibigyang-diin ang nakakagulat na pagtataksil ng isang kapuwa tao, hindi ang pagiging mortal o marupok.
- source_word: כְּעֶרְכִּי
  choice: kapantay ko
  rationale: Ang parirala mula sa עֵרֶךְ ay nagpapahiwatig ng pagkakapantay o magkatulad na katayuan. Maikli at natural sa Filipino ang “kapantay ko.”
- source_word: אַלּוּפִי
  choice: aking matalik na kasama
  rationale: Maaaring mangahulugan ang salita ng malapit na kasamahan o ng pinuno/gabay. Sa pagkakaparis nito sa kasunod na malapit na kaibigan, nangingibabaw rito ang diwang ugnayan; pinananatili sa talababa ang alternatibong “gabay.”
- source_word: וּמְיֻדָּעִי
  choice: at aking kaibigang lubos na kakilala
  rationale: Ang anyong mula sa ידע na may hulaping paari ay tumutukoy sa isang taong kilalang-kilala o malapit sa nagsasalita. Ang parirala ay nagpapahayag ng personal na pagkakakilala at lapit nang hindi pinahihina sa simpleng “kakilala.”
