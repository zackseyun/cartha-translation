  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: tl
  text: Ngunit ikaw—isang lalaking kapantay ko, aking matalik na kasama[a] at aking matalik na kaibigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking gabay”; ang salitang Hebreo ay maaaring tumukoy sa isang malapit na kasamahan o sa isang taong namumuno o gumagabay.
