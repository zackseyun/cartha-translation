  source_fidelity: Tumpak na naihahayag ng draft ang mariing pagsalungat sa “Ngunit ikaw,” ang lalaking kapantay ng nagsasalita, at ang malapit na ugnayang ipinahihiwatig ng dalawang huling katawagang Hebreo. Ang talababa para sa אַלּוּפִי ay angkop at hindi labis na nagtatakda ng kahulugan.
  naturalness: Hindi likas sa makabagong Filipino ang “aking kaibigang lubos na kakilala.” Ang “kakilala” ay karaniwang mas mahina kaysa “kaibigan,” at ang parirala ay tunog paulit-ulit o salungat sa nilalayong matalik na ugnayan. Mas natural at malinaw ang “aking matalik na kaibigan.”
