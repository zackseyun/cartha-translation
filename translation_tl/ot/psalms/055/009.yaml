  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: tl
  text: Lituhin mo sila[a], Panginoon; paghiwa-hiwalayin mo ang kanilang wika[b], sapagkat nakita ko ang karahasan at alitan sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Lamonin mo sila, Panginoon” o “Lipulin mo sila, Panginoon.” Ang pandiwang Hebreo ay maaaring magkaroon ng literal na diwang mapanira, ngunit dito ay maaari itong tumukoy sa paggulo at pagbigo sa kanilang mga balak.
    reason: alternative_reading
  - marker: b
    text: Literal na “paghiwa-hiwalayin mo ang kanilang dila”; ibig sabihin, guluhin ang kakayahan nilang magsalita o magkaunawaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: Lituhin mo sila
  rationale: Karaniwang nangangahulugan ang pandiwa na “lumamon” o “lum吞on,” ngunit ang pagkakatambal nito sa utos na paghiwa-hiwalayin ang kanilang wika ay nagpapahiwatig dito ng paggulo at pagbigo sa kanilang pagkakaisa o mga balak. Nasa talababa ang mas literal at mapanirang mga posibilidad.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Titulong banal ito, hindi ang pangalang YHWH; kaya isinalin bilang “Panginoon.”
- source_word: פַּלַּג
  choice: paghiwa-hiwalayin
  rationale: Ang pandiwang pautos ay nangangahulugang “hatiin” o “paghiwa-hiwalayin.” Pinili ang anyong natural sa Filipino habang pinananatili ang diwa ng pagkasira ng nagkakaisang komunikasyon.
- source_word: לְשׁוֹנָם
  choice: kanilang wika
  rationale: Literal itong “kanilang dila,” ngunit ang “dila” rito ay tumutukoy sa wika o pananalita. Ang “wika” ay malinaw at natural at maaaring magpahiwatig ng tagpong kahawig ng Babel nang hindi ipinipilit na iyon lamang ang sanggunian.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng pangatnig ang dahilan ng naunang pakiusap.
- source_word: רָאִיתִי
  choice: nakita ko
  rationale: Tapat na inilalarawan ng pangnagdaan ang naobserbahang kalagayang ginawang batayan ng salmista sa kanyang pakiusap.
- source_word: חָמָס
  choice: karahasan
  rationale: Malinaw nitong ipinahahayag ang marahas na kasamaan o kalupitang tinutukoy ng salitang Hebreo.
- source_word: וְרִיב
  choice: at alitan
  rationale: Maaaring tumukoy sa pagtatalo, hidwaan, o tunggalian. Natural na katambal ng “karahasan” ang “alitan” sa Filipino.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwirang salin ng pariralang panlunan.
theological_decisions:
- issue: Kahulugan ng pambungad na pautos na בַּלַּע kaugnay ng kasunod na “paghiwa-hiwalayin ang kanilang wika”
  choice: Isinalin bilang pakiusap na lituhin sila.
  alternative: “Lamonin mo sila, Panginoon” o “Lipulin mo sila, Panginoon.”
  rationale: Sinusuportahan ng kaagapay na pahayag tungkol sa paghahati ng wika ang diwa ng paggulo sa kanilang komunikasyon at pagkakaisa. Gayunman, tunay na posible ang mas literal o mapanirang kahulugan, kaya hindi ito inalis kundi inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Panginoon” para sa אֲדֹנָי, “lungsod” sa karaniwang modernong baybay, at malinaw na mga salitang “karahasan” at “alitan.” Ang dalawang talababa ay nagpapanatili sa tunay na leksikal na kalabuan ng talata.
