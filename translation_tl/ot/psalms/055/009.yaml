  source_fidelity: Tapat ang pangunahing salin sa Hebreo at sa maingat na pagpiling nasa English POB audit trail. Ang “Lituhin mo sila” ay isang lehitimong kontekstuwal na pagsasalin ng בַּלַּע sa pagkakatambal nito sa paghahati ng kanilang wika; maayos ding pinananatili ng talababa ang mas literal at mapanirang pagbasa. Ang “paghiwa-hiwalayin mo ang kanilang wika,” “sapagkat nakita ko,” “karahasan,” “alitan,” at “sa lungsod” ay wastong kumakatawan sa mga pariralang Hebreo.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang mga pautos na “Lituhin mo” at “paghiwa-hiwalayin mo” ay magkakaugnay at angkop sa panalanging patula. Ang “kanilang wika” ay natural na idyoma para sa לְשׁוֹנָם sa kontekstong ito, habang ipinaliliwanag ng talababa ang literal na “dila.”
