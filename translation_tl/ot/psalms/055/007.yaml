  text: Narito[a], lalayo sana ako, gagala-gala; magpapalipas ako ng gabi sa ilang.[b] Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalayo ako upang tumakas” o “tatakas ako nang malayo.” Pinagsasama ng Hebreo ang isang pandiwa ng paglayo at isang pawatas mula sa salitang-ugat na maaaring mangahulugang gumala o tumakas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tutuloy ako sa ilang.” Ang pandiwang Hebreo ay karaniwang tumutukoy sa pananatili o pagtuloy nang magdamag.
    reason: lexical_alternative
  - marker: c
    text: Ang “Selah” ay tradisyonal na hindi isinasalin. Hindi tiyak ang eksaktong kahulugan nito; maaaring isa itong panandang pangmusika o panliturhiya.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang puwersang pantawag-pansin ng Hebreo sa isang maikli at marangal na anyong pamilyar sa makabagong mambabasa.
- source_word: אַרְחִיק נְדֹד
  choice: lalayo sana ako at magpapagala-gala
  rationale: Pinagsasama ng parirala ang pandiwang nagsasaad ng paglayo at ang pawatas na maaaring mangahulugang paggala o pagtakas. Ipinahihiwatig ng “sana” ang hangaring ipinapahayag sa konteksto, habang pinananatili ng “magpapagala-gala” ang larawan ng di-panatag na paglayo nang hindi nililimitahan ito sa tahasang pagtakas.
- source_word: אָלִין
  choice: magpapalipas ako ng gabi
  rationale: Tuwirang ipinahahayag ang karaniwang kahulugan ng pandiwa na manatili o tumuloy nang magdamag; mas natural ito sa kasalukuyang Tagalog kaysa sa “tutuloy ako” lamang.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay sumasaklaw sa ilang na lupain o kaparangan at hindi nagpapalagay na isa lamang itong mabuhanging disyerto.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa baybay-Latin sa halip na bigyan ng tiyak na kahulugan, sapagkat hindi tiyak kung ito ay panandang pangmusika, panliturhiya, o iba pa.
