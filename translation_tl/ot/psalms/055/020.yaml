  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: tl
  text: Iniunat niya ang kanyang mga kamay laban sa mga taong may mapayapang ugnayan sa kanya[a]; nilapastangan niya ang kanyang tipan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laban sa kanyang mga kaibigan” o “laban sa kanyang mga kakampi.” Ang Hebreong pananalita ay tumutukoy sa mga taong may mapayapang ugnayan sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nilabag niya ang kanyang tipan.” Mas literal na nangangahulugan ang pandiwang Hebreo na “nilapastangan” o “itinuring na marumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: iniunat
  rationale: Kasama ng יָדָיו (“kanyang mga kamay”), ipinahihiwatig ng pandiwa ang pag-abot o pag-unat ng kamay, na sa konteksto ay may layuning manakit. Pinananatili ng “iniunat” ang kongkretong larawan ng Hebreo nang hindi ito agad pinapalitan ng mas interpretatibong “sinalakay.”
- source_word: יָדָיו
  choice: kanyang mga kamay
  rationale: Ang anyo ay maramihan at may hulaping panlalaking ikatlong panauhan; kaya pinanatili ang “mga kamay” sa halip na isahan.
- source_word: בִּשְׁלֹמָיו
  choice: laban sa mga taong namumuhay nang payapa sa kanya
  rationale: Ang שָׁלוֹם dito ay tumutukoy sa mapayapang ugnayan. Ipinahahayag ng salin ang mga taong walang alitan at may mabuting pakikitungo sa kanya, habang ang “laban sa” ay umaayon sa mapanlabang diwa ng buong parirala.
- source_word: חִלֵּל
  choice: nilapastangan
  rationale: Ang piel ng חלל ay nangangahulugang lapastanganin, dungisan, o ituring na hindi banal. Ang “nilapastangan” ay nagpapanatili sa matinding moral at panrelihiyong bigat ng pandiwa; maaaring “nilabag” ayon sa konteksto.
- source_word: בְּרִיתוֹ
  choice: kanyang tipan
  rationale: Ang בְּרִית ay karaniwang “tipan.” Pinananatili ng “kanyang tipan” ang maikling pagkakasabi ng Hebreo at hindi tinutukoy nang higit sa teksto kung kanino ginawa ang tipan.
theological_decisions:
- issue: Likas at saklaw ng wikang tumutukoy sa tipan
  choice: “kanyang tipan” at “nilapastangan”
  alternative: “kanyang kasunduan” at “nilabag”
  rationale: Pinananatili nito ang bigat ng wikang tipan at ang moral na tindi ng pagkakanulo, ngunit hindi ipinapalagay na ang tinutukoy ay partikular na tipan ng Diyos; sa konteksto, maaaring personal o panlipunang tipan ito.
translation_notes:
  register: Makabago at marangal na Filipino, na madaling maunawaan ngunit pinananatili ang kongkretong larawan ng mga kamay, ang relasyonal na diwa ng kapayapaan, at ang matinding wikang kaugnay ng tipan.
