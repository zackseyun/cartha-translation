  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: tl
  text: Araw at gabi, umiikot sila sa ibabaw ng mga pader niya[a]; kasamaan at paghihirap ay nasa loob niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalilibutan nila siya sa ibabaw ng mga pader niya.” Ang pandiwang Hebreo ay maaaring magdiin kapwa sa pag-ikot at sa pagpalibot.
    reason: lexical_alternative
  - marker: b
    text: Ang “kasamaan at paghihirap” ay maaari ding isaling “kabuktutan at pang-aapi” o “kapahamakan at hirap,” sapagkat maaaring tumukoy ang mga salitang Hebreo kapwa sa masamang gawa at sa pagdurusang dulot nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Araw at gabi
  rationale: Likas na pariralang Filipino para sa patuloy o walang-tigil na pagkilos, at tuwirang katumbas ng temporal na pares sa Hebreo.
- source_word: יְסוֹבְבֻהָ
  choice: umiikot sila sa palibot niya
  rationale: Pinananatili ang kilos ng סבב at ang di-tiyak na pangmaramihang simuno; maaari rin itong mangahulugang pinaliligiran nila siya.
- source_word: עַל חוֹמֹתֶיהָ
  choice: sa ibabaw ng mga pader niya
  rationale: Tuwirang inilalarawan ng עַל ang pagkilos sa ibabaw ng mga pader ng lungsod, sa halip na gawing simpleng pag-ikot lamang sa labas ng mga iyon.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Maaaring tumukoy sa moral na kasamaan at sa kapahamakang dulot nito. Sa konteksto ng lungsod na puno ng karahasan at alitan, pinananatili ng 'kasamaan' ang moral na diin.
- source_word: עָמָל
  choice: paghihirap
  rationale: Sinasaklaw nito ang hirap, pagdurusa, at mapaniil na gawang maaaring ipahiwatig ng salita, habang nananatiling naiiba sa אָוֶן.
- source_word: בְּקִרְבָּהּ
  choice: nasa loob niya
  rationale: Natural na Filipino para sa literal na 'nasa gitna niya' at pinananatili ang pambabaeng personipikasyon ng lungsod sa pamamagitan ng 'niya.'
