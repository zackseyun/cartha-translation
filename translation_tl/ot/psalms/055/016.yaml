  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: tl
  text: Ako naman ay tatawag sa Diyos, at ililigtas ako ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong יהוה (YHWH) ay ang banal na pangalan ng Diyos, na isinalin dito bilang “Yahweh.”
    reason: Ipinaliliwanag ang paglilipat ng Tetragrammaton.
lexical_decisions:
- source_word: אֲנִי
  choice: Ako naman
  rationale: Ang hayag at nasa unahang panghalip ay may diin at nagpapahiwatig ng paghahambing o pagsalungat. Likas na ipinapahayag ito sa modernong Tagalog ng “Ako naman.”
- source_word: אֶל־אֱלֹהִים אֶקְרָא
  choice: ay tatawag sa Diyos
  rationale: Ang אֶל ay nagsasaad ng patutunguhan ng pagtawag, at ang Qal imperfect na אֶקְרָא ay maaaring magpahayag ng kasalukuyan, nakagawian, o hinaharap na kilos. Pinananatili ng “tatawag” ang inaasahang pagkilos at umaayon sa kasunod na katiyakang ililigtas siya.
- source_word: וַיהוָה
  choice: at … ni Yahweh
  rationale: Ang waw ay isinaling “at.” Ginamit ang “ni” dahil si Yahweh ang tagaganap ng pandiwang pokus-sa-layon na “ililigtas,” habang pinanatili ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: יוֹשִׁיעֵנִי
  choice: ililigtas ako
  rationale: Ang Hiphil imperfect ng ישׁע ay nangangahulugang magligtas o maghatid sa kaligtasan. Ipinahahayag ng “ililigtas ako” ang tiwala ng salmista sa gagawin ng Diyos nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Panahunan ng dalawang pandiwang imperfect
  choice: “tatawag” at “ililigtas” bilang nakatuon sa hinaharap
  alternative: “tumatawag” at “inililigtas” bilang kasalukuyan o nakagawiang kilos
  rationale: Maaaring magtaglay ng higit sa isang aspektuwal na halaga ang Hebreong imperfect. Sa konteksto, likas na mabasa ang una bilang pasiya ng salmista at ang ikalawa bilang tiyak na inaasahang tugon, ngunit hindi nito itinatanggi ang posibleng kasalukuyan o nakagawiang diwa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ang “Ako naman” ay natural na naghahatid ng diin at pagsalungat; iniwasan ang mas arkaikong “ako'y” at ang mas interpretibong “dumaing.”
