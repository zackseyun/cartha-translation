  yaml_path: translation/ot/psalms/055/005.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: tl
  text: Dumarating sa akin ang takot at panginginig, at binabalot ako ng sindak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lagim” o “pangingilabot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאָה
  choice: takot
  rationale: Tuwirang katumbas ito ng pangngalang tumutukoy sa takot o pangamba at natural na ipinaparis sa “panginginig.”
- source_word: וָרַעַד
  choice: at panginginig
  rationale: Pinananatili nito kapwa ang pisikal na pagyanig at ang damdaming dulot ng matinding takot.
- source_word: יָבֹא בִי
  choice: dumarating sa akin
  rationale: Ang Hebreo ay literal na “dumarating sa loob/sa akin”; ang saling ito ay natural sa Filipino at pinananatili ang larawan ng karanasang sumasapit sa nagsasalita.
- source_word: וַתְכַסֵּנִי
  choice: at binabalot ako
  rationale: Pinananatili ng “binabalot” ang konkretong metapora ng pandiwang “takpan,” habang mas natural itong kaakibat ng damdamin sa Filipino.
- source_word: פַּלָּצוּת
  choice: sindak
  rationale: Ipinahahayag ng “sindak” ang matinding lagim, takot, o pangingilabot na tinutukoy ng bihirang pangngalang Hebreo nang hindi inuulit lamang ang “takot” sa unang sugnay.
