  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: tl
  text: 'Namimilipit ang puso ko sa loob ko[a],

    at ang mga sindak ng kamatayan ay bumagsak sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nanginginig ang puso ko sa loob ko.” Ang pandiwang Hebreo ay maaaring tumukoy sa pamimilipit, panginginig, o matinding paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Ang לֵב ay tumutukoy sa puso bilang kaloob-loobang sentro ng isip at damdamin; pinananatili ng “puso ko” ang karaniwan at makapangyarihang larawang pangkatawan sa panaghoy.
- source_word: יָחִיל
  choice: namimilipit
  rationale: Ang pandiwa mula sa חול/חיל ay maaaring magpahiwatig ng pamimilipit, panginginig, o matinding paghihirap. Ipinahahayag ng “namimilipit” ang marahas na pagkabalisa sa kalooban, habang inilalagay sa talababa ang tunay na alternatibong “nanginginig.”
- source_word: בְּקִרְבִּי
  choice: sa loob ko
  rationale: Ang קֶרֶב na may hulaping unang panauhan ay tumutukoy sa kaloob-looban ng nagsasalita; natural at malinaw sa Filipino ang “sa loob ko.”
- source_word: אֵימוֹת
  choice: ang mga sindak
  rationale: Pinananatili ng “mga sindak” ang maramihang anyo at ang bigat ng nakapanghihilakbot at nananaig na takot.
- source_word: מָוֶת
  choice: ng kamatayan
  rationale: Pinananatili nito ang ugnayang genitibo nang hindi tiyakang ipinapasiya kung ang kamatayan ang pinagmumulan o layon ng sindak, o kung ito ay isinakatauhan.
- source_word: נָפְלוּ
  choice: ay bumagsak
  rationale: Tuwirang pinananatili ng “bumagsak” ang larawan ng natapos na pagkahulog na ang epekto ay nararanasan pa ng nagsasalita.
- source_word: עָלָי
  choice: sa akin
  rationale: Ito ang natural na katumbas ng עַל na may hulaping unang panauhan sa pariralang “bumagsak sa akin.”
