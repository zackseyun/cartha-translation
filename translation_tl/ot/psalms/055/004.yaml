  register: Makabagong Filipino na may marangal na himig ng tula. Pinanatili ang matitingkad na larawang “namimilipit,” “mga sindak ng kamatayan,” at “bumagsak sa akin,” nang hindi pinapawi ang leksikal na kalabuan ng pandiwang Hebreo.
