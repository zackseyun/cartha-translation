  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: tl
  text: Ngunit ikaw, O Diyos, ang magpapababa sa kanila sa hukay ng pagkawasak.[a] Ang mga taong nagpapadanak ng dugo at mapanlinlang ay hindi aabot sa kalahati ng kanilang mga araw.[b] Ngunit ako, magtitiwala ako sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukay ng kabulukan,” “hukay ng libingan,” o “hukay.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi nila hahatiin sa dalawa ang kanilang mga araw”; isang idyomang nangangahulugang maagang mapuputol ang kanilang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: ang magpapababa sa kanila
  rationale: Ang Hiphil ng ירד ay causative, kaya pinananatili ng “magpapababa” ang diwang ang Diyos ang sanhi ng kanilang pagbaba nang hindi dinaragdagan ang paraan ng paghatol.
- source_word: לִבְאֵר שַׁחַת
  choice: sa hukay ng pagkawasak
  rationale: Ang בְּאֵר ay hukay o balon, at ang שַׁחַת ay maaaring tumukoy sa hukay, pagkawasak, o kabulukan. Pinananatili ng parirala ang matingkad na larawan ng kamatayan at paghatol nang hindi ito ginagawang teknikal na katawagan sa kabilang buhay.
- source_word: אַנְשֵׁי דָמִים
  choice: mga taong mapagpadanak ng dugo
  rationale: Ang literal na “mga taong may mga dugo” ay idyomang tumutukoy sa mararahas at may-salang nagpapadanak ng dugo. Ang salin ay nagpapanatili sa konkretong larawan ng dugo.
- source_word: וּמִרְמָה
  choice: at mapanlinlang
  rationale: Ang מִרְמָה ay panlilinlang o pagtataksil. Ang “mapanlinlang” ay likas na paglalarawan sa mga taong tinutukoy at maayos na kaagapay ng “mapagpadanak ng dugo.”
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: ay hindi aabot sa kalahati ng kanilang mga araw
  rationale: Ang חצה ay “hatiin sa dalawa.” Pinananatili ng salin ang Hebreong idyoma at ipinahihiwatig na maagang mapuputol ang kanilang buhay; nililinaw ito sa talababa.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: Ngunit ako, sa iyo ako magtitiwala
  rationale: Ipinakikita ng inuulit na “ako” at ng inuunang “sa iyo” ang diin at ang malinaw na pagtutol sa sasapitin ng masasama.
theological_decisions:
- issue: Kalikasan ng paghatol sa larawang “hukay ng pagkawasak”
  choice: Pinanatili bilang larawan ng paghatol ng Diyos na humahantong sa kamatayan o pagkawasak.
  alternative: Libingan, Sheol, kabulukan, o isang tiyak na konsepto ng impiyerno.
  rationale: Malakas ang larawan sa Hebreo ngunit hindi sapat ang katiyakan nito upang gawing teknikal na termino para sa isang partikular na doktrina tungkol sa kabilang buhay.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang konkretong larawan ng dugo at hukay, ang idyomang tungkol sa kalahati ng mga araw, at ang mariing paghahambing sa pangwakas na pahayag ng salmista.
