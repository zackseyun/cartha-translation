  language: tl
  text: At sinabi ko[a], “Sino ang magbibigay sa akin ng mga pakpak na tulad ng sa kalapati? Lilipad ako at mananahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas idyomatikong pagpapahayag: “Sana’y magkaroon ako ng mga pakpak na tulad ng sa kalapati! Lilipad ako at magpapahinga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Pinananatili ang payak na pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol ng אמר, nang hindi dinaragdagan ang ugnayan.
- source_word: מִי יִתֶּן לִּי
  choice: Sino ang magbibigay sa akin
  rationale: Pinananatili ang anyong tanong ng Hebreong idyoma, habang ang kahulugang pananabik o paghahangad ay nililinaw sa talababa.
- source_word: אֵבֶר
  choice: mga pakpak
  rationale: Bagaman isahan ang anyo sa Hebreo, kolektibo ang gamit nito rito; likas sa Tagalog ang maramihang “mga pakpak” para sa paglipad ng ibon.
- source_word: כַּיּוֹנָה
  choice: na gaya ng sa kalapati
  rationale: Malinaw na pinananatili ang paghahambing at ipinahihiwatig na ang mga pakpak ang gaya ng mga pakpak ng kalapati.
- source_word: אָעוּפָה
  choice: Lilipad ako
  rationale: Ang cohortative ay nagpapahayag ng nais o hangarin; sa Tagalog, ang konteksto at naunang tanong ang nagbibigay sa anyong panghinaharap ng ganitong himig.
- source_word: וְאֶשְׁכֹּנָה
  choice: at mananahan
  rationale: Ang “mananahan” ay tuwirang tumutugma sa שכן na ‘tumahan/manirahan’ at nagpapanatili sa leksikal na kahulugan nang hindi tahasang ginagawang “magpapahinga.”
