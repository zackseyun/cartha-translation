id: PSA.55.15
reference: Psalms 55:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ישימות עָלֵ֗י/מוֹ יֵרְד֣וּ שְׁא֣וֹל חַיִּ֑ים כִּֽי רָע֖וֹת בִּ/מְגוּרָ֣/ם בְּ/קִרְבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: tl
  text: Dumating nawa sa kanila ang kamatayan[a]; bumaba nawa silang buháy sa Sheol[b], sapagkat kasamaan ang nasa kanilang tahanan[c], sa gitna nila[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang unang salitang Hebreo. Maaari ring isalin na “Dumating nawa sa kanila ang pagkawasak,” “Biglain nawa sila ng kamatayan,” o katulad nito.
    reason: textual_variant
  - marker: b
    text: Ang Sheol ay katawagang Hebreo para sa daigdig ng mga patay; maaari ring isalin na “libingan.”
    reason: lexical_alternative
  - marker: c
    text: O “sa kanilang tirahan” o “sa kanilang paninirahan.”
    reason: lexical_alternative
  - marker: d
    text: O “sa loob nila” o “sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: Dumating nawa ... ang kamatayan
  rationale: Mahirap at hindi tiyak ang anyong Hebreo. Pinananatili ng salin ang malinaw na panawagang may kaugnayan sa kamatayan at ang pagkakatugma nito sa kasunod na pagbaba sa Sheol, nang hindi ipinipilit sa pangunahing teksto kung biglaan, mapanlinlang, o mapangwasak ang tiyak na diwa.
- source_word: עָלֵימוֹ
  choice: sa kanila
  rationale: Likas na katumbas sa modernong Tagalog ng Hebreong pang-ukol na may hulaping pangmaramihan; sa pariralang “dumating ... sa kanila,” naipahahayag nito ang pagkilos laban sa kanila.
- source_word: יֵרְדוּ
  choice: bumaba nawa sila
  rationale: Ipinahahayag ng “nawa” ang jussive o panawagang diwa ng sumpa, habang pinananatili ng “bumaba” ang larawang patungo sa daigdig ng mga patay.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang katawagang Hebreo upang hindi ito agad ipakahulugang “impiyerno” o paliitin lamang sa “libingan.” Ipinaliliwanag sa talababa ang lawak ng kahulugan nito.
- source_word: חַיִּים
  choice: buháy
  rationale: Nagsasaad na bababa sila sa Sheol habang nabubuhay pa; malinaw at likas ito sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang panawagan at angkop sa marangal na estilong patula.
- source_word: רָעוֹת
  choice: kasamaan
  rationale: Bagaman maramihan ang anyong Hebreo, ang kolektibong “kasamaan” ay likas sa Tagalog at tumutukoy rito sa laganap na moral na kasamaan, hindi lamang sa mga kapahamakan.
- source_word: בִּמְגוּרָם
  choice: nasa kanilang tahanan
  rationale: Sa konteksto, malamang na tumutukoy sa kanilang tirahan o tahanan. Pinananatili sa talababa ang maaaring diwang “pinananahanan” o “paninirahan bilang dayuhan.”
- source_word: בְּקִרְבָּם
  choice: sa gitna nila
  rationale: Pinananatili nito ang pangkomunidad na larawan at hindi ganap na inaalis ang posibilidad na ang kasamaan ay “nasa loob nila” o “nasa kanila.”
theological_decisions:
- issue: Kahulugan ng שְׁאוֹל
  choice: Panatilihin ang “Sheol” sa pangunahing teksto
  alternative: “daigdig ng mga patay” o “libingan”
  rationale: Masasalamin nito ang saklaw ng katawagang Hebreo nang hindi nag-aangkat ng mas huling doktrinal na konsepto gaya ng impiyerno.
- issue: Diwa ng panawagan laban sa mga kaaway
  choice: Panatilihin ang tuwirang panawagang “Dumating nawa ... ang kamatayan”
  alternative: “Biglain nawa sila ng kamatayan” o “Dumating nawa sa kanila ang pagkawasak”
  rationale: Mahirap ang unang salitang Hebreo. Ang pangunahing salin ay nagpapanatili ng imprecatoryong lakas ngunit iniiwan sa talababa ang tunay na kawalang-katiyakan ng eksaktong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Ginamit ang “nawa” upang ihatid ang panawagan o sumpang diwa ng Hebreo. Nilagyan ng tuldik ang “buháy” para luminaw ang pagbasa. Pinanatili ang “Sheol” bilang teknikal na katawagang Hebreo at ipinaliwanag ito sa talababa.
