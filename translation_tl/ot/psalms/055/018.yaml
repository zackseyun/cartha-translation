  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: tl
  text: Tinubos niya ang aking kaluluwa sa kapayapaan mula sa labanan laban sa akin, sapagkat marami ang kasama ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat marami ang laban sa akin.” Literal na mababasa sa Hebreo, “sapagkat marami ang kasama ko,” ngunit maaaring unawain ito sa konteksto bilang pagtukoy sa maraming kalaban.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: Tinubos niya
  rationale: Ang pandiwa ay karaniwang tumutukoy sa pagtubos o pagliligtas sa pamamagitan ng pagpapalaya. Pinananatili ng “tinubos” ang matibay na larawan ng pagtubos at ang ganap na kilos ng Hebreo.
- source_word: בְשָׁלוֹם
  choice: sa kapayapaan
  rationale: Tuwirang sinasalamin nito ang שָׁלוֹם at pinananatili ang lawak ng kahulugang kapayapaan, kabuuan, at mabuting kalagayan, sa halip na paliitin ito sa “ligtas.”
- source_word: נַפְשִׁי
  choice: ang aking kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, buhay, o sarili. Ang “aking kaluluwa” ay nagpapanatili sa Hebreong idyoma at makatang himig.
- source_word: מִקֲּרָב לִי
  choice: mula sa pakikipaglaban sa akin
  rationale: Ang קְרָב ay labanan o sagupaan, at ang לִי ay nauunawaan dito ayon sa konteksto bilang laban sa nagsasalita. Ang parirala ay nagpapanatili sa larawang militar nang hindi nagiging labis na teknikal.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag sa naunang pahayag; natural at marangal sa modernong Tagalog ang “sapagkat.”
- source_word: בְרַבִּים
  choice: marami
  rationale: Ipinahahayag ng parirala ang karamihan o malaking bilang. Ang “marami” ay maikli at natural.
- source_word: עִמָּדִי
  choice: ang kasama ko
  rationale: Ang עִמָּדִי ay pinakatuwirang nangangahulugang “kasama ko.” Pinananatili ito sa pangunahing teksto upang huwag tahimik na lutasin ang tensiyon ng konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa huling sugnay na בְרַבִּים הָיוּ עִמָּדִי
  choice: sapagkat marami ang kasama ko
  alternative: sapagkat marami ang laban sa akin
  rationale: Pinakatuwirang nangangahulugang “kasama ko” ang עִמָּדִי, bagaman maaaring unawain ang buong sugnay ayon sa konteksto bilang pagtukoy sa maraming kalaban. Pinananatili sa teksto ang literal na tensiyon at inilalagay sa talababa ang posibleng adversatibong pagbasa.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino Tagalog. Pinanatili ang “kaluluwa,” “kapayapaan,” at “kasama ko” upang maingatan ang Hebreong larawan at tunay na kalabuan ng huling sugnay.
