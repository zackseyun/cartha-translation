    rationale: Sa Tagalog, maaari itong basahin bilang pakikipaglaban ng nagsasalita (“my fighting”), hindi bilang labanan na nakatuon laban sa kanya. Ang “mula sa labanan laban sa akin” ay mas tapat sa מִקֲּרָב לִי ayon sa kontekstuwal na adversatibong gamit na sinusundan din ng English audit trail.
