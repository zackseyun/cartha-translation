  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: tl
  text: Dahil sa tinig ng kaaway, dahil sa panggigipit ng masama; sapagkat ipinapasan nila sa akin ang kapinsalaan[a], at sa galit ay napopoot sila sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapahamakan” o “kasamaan.” Maaaring tumukoy ang Hebreong אָוֶן sa kapinsalaan, hirap, kasamaan, o kalikuan, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Dahil sa tinig ng
  rationale: Maaaring tumukoy ang מִן sa sanhi, at kaagapay ito ng מִפְּנֵי sa panaghoy. Pinananatili ng “tinig” ang kongkretong larawan ng Hebreo.
- source_word: אוֹיֵב
  choice: kaaway
  rationale: Pinananatili ang pang-isahang anyo ng Hebreo, na maaaring kumatawan sa isang kaaway o sa mga kaaway bilang isang pangkat.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Sa kontekstong ito, ang idyoma ay nagpapahayag ng sanhi o dahilan, hindi lamang pisikal na pagharap o presensiya.
- source_word: עָקַת
  choice: panggigipit
  rationale: Ipinahihiwatig ng salita ang matinding pagdiin, kapighatian, o pang-aapi. Ang “panggigipit” ay natural sa modernong Tagalog at malinaw na nagsasaad ng mapanupil na pagtrato.
- source_word: רָשָׁע
  choice: masama
  rationale: Pinananatili ang pang-isahang katawagang moral ng Hebreo nang hindi nagdaragdag ng kasarian.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag at angkop sa marangal na himig ng tula.
- source_word: יָמִיטוּ
  choice: ibinabagsak nila
  rationale: Ang Hiphil ng מוט ay nagpapahiwatig ng pagpapabagsak o pagpapasapit ng isang bagay sa isang tao. Pinananatili ng salin ang masiglang larawang ito.
- source_word: עָלַי
  choice: sa akin
  rationale: Likas na katumbas ito sa Tagalog sa larawang may ibinabagsak na kaguluhan sa nagsasalita.
- source_word: אָוֶן
  choice: kaguluhan
  rationale: Sa konteksto, tumutukoy ito sa pinsala o ligalig na ipinapasan ng mga kaaway sa mang-aawit. Gayunman, maaari rin itong mangahulugang kasamaan, kaya inilakip ang alternatibo sa talababa.
- source_word: וּבְאַף
  choice: at sa galit
  rationale: Ang אַף ay literal na “ilong” ngunit idyomatikong nangangahulugang galit; ang pariralang Tagalog ay likas at tuwiran.
- source_word: יִשְׂטְמוּנִי
  choice: kinapopootan nila ako
  rationale: Ipinapahayag ng pandiwa ang matinding pagkamuhi o pagkapoot. Ang “kinapopootan” ay dignificado at angkop sa patulang panaghoy.
theological_decisions:
- issue: Paglipat mula sa pang-isahang “kaaway/masama” tungo sa pangmaramihang pandiwa
  choice: Pinanatili ang “kaaway” at “masama” na pang-isahan, ngunit “nila” sa kasunod na sugnay.
  alternative: Gawing “mga kaaway” at “masasama” ang mga katawagan.
  rationale: Pang-isahan ang mga katawagan sa tekstong Hebreo ngunit pangmaramihan ang pandiwang יָמִיטוּ at יִשְׂטְמוּנִי. Pinananatili ng salin ang tunay na pagbabago sa bilang sa halip na pakinisin ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Pinanatili ang pag-uulit na “dahil sa” at ang kongkretong larawan ng pagbagsak upang maipakita ang paralelismo at tindi ng panaghoy.
