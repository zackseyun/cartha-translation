source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: tl
  text: Diringgin sila ng Diyos at ibababa niya sila—siya na nakaluklok mula pa noong unang panahon (Selah)—sapagkat hindi nagbabago ang kanilang kalagayan,[a] at hindi sila natatakot sa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat wala silang nararanasang pagbabago” o “wala silang mga pagbabaligtad ng kalagayan.” Mahirap ang pariralang Hebreo at maaari ring ipahiwatig ang kawalan nila ng pagbabago ng asal.
    reason: lexical_alternative
  - marker: b
    text: O “Diringgin sila ng Diyos at sasagutin niya sila.” Ang pandiwang Hebreo ay maaaring unawaing “sasagutin,” ngunit sa konteksto maaari rin itong mangahulugang ibababa o pahihirapan sila bilang paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁמַע
  choice: Dinggin
  rationale: Ang Qal imperfect ng שׁמע ay nagpapahayag rito ng tiyak na pagkilos ng Diyos sa konteksto ng panalangin; natural sa Tagalog ang aspektong kontemplatibo na “dinggin.”
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang makatang katawagan ito sa Diyos; ang “Diyos” ang malinaw at likas na katumbas nang hindi nagdaragdag ng kahulugang wala sa teksto.
- source_word: וְיַעֲנֵם
  choice: ibababa niya sila
  rationale: Maaaring iugnay ang anyo sa ענה sa diwang sagutin o sa diwang hiyain/pahirapan. Sa konteksto ng paghatol sa masasama, pinili ang “ibababa” upang ihayag ang mapaghatol na pagpapakumbaba nang hindi kasing-tindi ng “pahirapan”; inilagay sa talababa ang tunay na alternatibong “sasagutin.”
- source_word: וְיֹשֵׁב קֶדֶם
  choice: siya na nakaluklok mula pa noong unang panahon
  rationale: Ang ישׁב kapag tumutukoy sa Diyos ay maaaring magpahiwatig ng paghahari o pagkaluklok, at ang קדם ay tumutukoy sa sinaunang panahon. Pinananatili ng salin ang maharlikang himig.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili ang tradisyonal na transliterasyon dahil hindi tiyak ang eksaktong kahulugan at gamit ng salita.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: Sapagkat hindi nagbabago ang kanilang kalagayan
  rationale: Ang חֲלִיפוֹת ay maaaring tumukoy sa mga pagbabago o pagbabaligtad ng kalagayan. Nilinaw sa natural na Tagalog na ang tinutukoy ay kawalan ng pagbabago sa kanilang sitwasyon, habang pinananatili sa talababa ang ibang posibleng pagbasa.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: at hindi sila natatakot sa Diyos
  rationale: Ipinahahayag ng sugnay ang palagian at matigas nilang saloobin. Ang “natatakot sa Diyos” ay likas sa Tagalog at hindi nililimitahan ang takot sa simpleng pangamba lamang.
theological_decisions:
- issue: Kahulugan ng ענה sa ikalawang pandiwa
  choice: Mapaghatol na pagpapababa ng Diyos sa kanila
  alternative: Sasagutin sila ng Diyos
  rationale: Ang kalapit na konteksto ay tungkol sa masasamang kaaway at sa paghatol ng Diyos, kaya malamang ang maparusang diwa. Gayunman, tunay na posible sa anyong Hebreo ang “sasagutin,” kaya hindi ito ikinubli at inilagay sa talababa.
- issue: Dahilan ng kawalan ng takot sa Diyos
  choice: Ang di-nagbabagong kalagayan nila ay inilalahad bilang kaugnay ng kanilang kawalan ng takot sa Diyos
  alternative: Ang parirala ay maaaring mangahulugang wala silang mga pagbabalik-loob o pagbabago ng asal
  rationale: Mahirap ang Hebreong sugnay at hindi dapat piliting magtakda ng iisang tiyak na ugnayang teolohikal. Pinili ang pinakadirektang kahulugang pangkalagayan at iniulat ang alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Tagalog na angkop sa panulaang panalangin. Ginamit ang “nakaluklok” upang mapanatili ang maharlikang larawan, at “Selah” ay hindi isinalin. Maikli ang mga sugnay upang maging malinaw sa karaniwang mambabasa habang pinananatili ang hirap at ambiguwidad ng Hebreo sa mga talababa.
