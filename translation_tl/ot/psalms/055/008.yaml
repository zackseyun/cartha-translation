translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “kanlungan” bilang pamilyar na salitang angkop sa panulaang salmo, at “humahagibis” upang malinaw na ilarawan ang marahas na hangin. Inilagay ang talababa pagkatapos ng buong talata upang hindi mapagkamalang tumutukoy lamang ito sa “hangin.”
