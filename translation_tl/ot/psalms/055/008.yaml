translation:
  language: tl
  text: Magmamadali akong patungo sa isang kanlungan para sa akin[a], mula sa humahagibis na hangin, mula sa bagyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Magmamadali akong makatakas” o “Hayaan akong magmadali patungo sa kanlungan.” Ang anyong Hebreo ay nagpapahayag ng apurahang personal na pasiya o hangarin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִישָׁה
  choice: Magmamadali ako
  rationale: Ang cohortative na anyo mula sa חוּשׁ ay nagpapahayag ng apurahang personal na hangarin o pasiya. Likas sa modernong Tagalog ang “Magmamadali ako” at hindi ito ginagawang payak na paglalarawan lamang sa hinaharap.
- source_word: מִפְלָט לִי
  choice: pumunta sa kanlungan para makaligtas
  rationale: Ang מִפְלָט ay maaaring tumukoy sa kanlungan o paraan ng pagtakas, at ang לִי ay nagpapakita ng personal na pakinabang. Pinagsasama ng pariralang ito ang ideya ng ligtas na mapupuntahan at personal na pagliligtas nang hindi idinaragdag ang konsepto ng ‘paghahanap.’
- source_word: מֵרוּחַ סֹעָה
  choice: sa humahagibis na hangin
  rationale: Dahil katambal ito ng סַעַר, meteorolohikal na ‘hangin’ ang kahulugan ng רוּחַ. Ipinahihiwatig ng סֹעָה ang marahas at mabilis na pag-ihip; malinaw at masigla sa Tagalog ang “humahagibis.”
- source_word: מִסָּעַר
  choice: sa bagyo
  rationale: Ang סַעַר ay bagyo o malakas na unos. Ang “bagyo” ang pinakakaraniwan at malinaw na katumbas, at pinanatili ang inuulit na “sa” upang maipakita ang paralelismo ng Hebreo.
