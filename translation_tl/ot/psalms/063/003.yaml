translation:
  language: tl
  text: Sapagkat ang tapat mong pag-ibig[a] ay mas mabuti kaysa sa buhay; pupurihin ka ng aking mga labi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matatag na pag-ibig” o “tapat na pag-ibig na kaugnay ng tipan.” Ang Hebreong חֶסֶד ay tumutukoy sa tapat at matatag na pag-ibig, na madalas ay nasa konteksto ng ugnayang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng papuring kasunod at pinananatili ang ugnayang sanhi sa natural na Tagalog.
- source_word: טוֹב ... מֵחַיִּים
  choice: higit na mabuti kaysa buhay
  rationale: Ang טוֹב na may pahambing na מִן ay nangangahulugang “mas mabuti kaysa”; ang חַיִּים, bagaman anyong maramihan, ay idiomatikong tumutukoy sa buhay.
- source_word: חַסְדְּךָ
  choice: ang tapat mong pag-ibig
  rationale: Sinasaklaw nito ang pag-ibig na may katapatan, pananatili, at malasakit, nang hindi nililimitahan ang salita sa isang makitid na doktrinal na pakahulugan.
- source_word: שְׂפָתַי
  choice: aking mga labi
  rationale: Pinananatili ang kongkretong larawang patula ng Hebreo sa halip na gawing abstraktong “pananalita.”
- source_word: יְשַׁבְּחוּנְךָ
  choice: pupurihin ka
  rationale: Malinaw at natural na salin ng piel na anyo ng שׁבח, na nagpapahayag ng papuring ibibigay sa Diyos.
theological_decisions:
- issue: Pagpapahayag ng חֶסֶד sa konteksto ng pagsamba
  choice: tapat na pag-ibig
  alternative: wagas na pag-ibig; pag-ibig na tipan; awa
  rationale: Pinananatili ng “tapat na pag-ibig” ang ideya ng mapagmahal at matatag na katapatan ng Diyos, pati ang maaaring kaugnayan nito sa tipan, nang hindi nagdaragdag ng mas makitid na doktrinal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang patulang larawan ng “mga labi” at ang paghahambing sa buhay.
