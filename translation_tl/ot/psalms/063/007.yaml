translation:
  language: tl
  text: 'Sapagkat ikaw ay naging saklolo ko,


    at sa lilim ng iyong mga pakpak ay umaawit ako sa galak.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumisigaw ako sa galak.” Ang pandiwang Hebreo ay maaaring tumukoy sa matunog na sigaw ng galak gayundin sa masayang pag-awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang ugnayang sanhi sa naunang pahayag ng salmista at natural itong panimula sa marangal na makabagong Tagalog.
- source_word: הָיִיתָ עֶזְרָתָה לִּי
  choice: ikaw ang naging saklolo ko
  rationale: Pinananatili ang nominal na larawan ng Diyos bilang tulong ng salmista. Ang “saklolo” ay natural at marangal, at iniiwasan ang di-likas na “naging tulong ko.” Ipinahihiwatig ng “naging” ang napatunayan nang tulong na mahalaga pa rin sa kasalukuyan.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: at sa lilim ng iyong mga pakpak
  rationale: Tapat na pinananatili ang kongkretong talinghaga ng proteksiyon sa halip na palitan ito ng tahasang pagpapaliwanag.
- source_word: אֲרַנֵּן
  choice: umaawit ako sa galak
  rationale: Inihahayag ang masayang tinig na maaaring tumukoy sa pag-awit o masiglang pagsigaw. Ang pangunahing salin ay natural sa kontekstong patula, habang nasa talababa ang tunay na alternatibong leksikal.
theological_decisions:
- issue: Talinghaga ng proteksiyon ng Diyos
  choice: Panatilihin ang “sa lilim ng iyong mga pakpak.”
  alternative: “sa ilalim ng iyong proteksiyon”
  rationale: Ang larawan ng mga pakpak ay mahalagang bahagi ng panulaan at teolohiya ng talata. Hindi ito dapat gawing abstraktong paliwanag o itali sa isang mas makitid na interpretasyon.
- issue: Saklaw ng masayang tinig sa אֲרַנֵּן
  choice: “umaawit ako sa galak” na may talababa
  alternative: “sumisigaw ako sa galak”
  rationale: Parehong pinahihintulutan ng pandiwang Hebreo ang masayang pag-awit at matunog na sigaw. Pinananatili ng talababa ang leksikal na kalabuan nang hindi pinagsasama ang dalawang larawan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang parallelism at kongkretong larawan ng tulong, lilim, at mga pakpak; ginamit ang “saklolo” bilang madaling maunawaang salitang patula nang hindi nagiging lipas o sektaryan.
