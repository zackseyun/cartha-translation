  text: Kapag naaalala kita sa aking higaan, pinagbubulay-bulayan kita sa mga pagbabantay sa gabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם זְכַרְתִּיךָ
  choice: Kapag naaalala kita
  rationale: Bagaman karaniwang kondisyunal ang אִם, sa kontekstong ito maaari itong magpahayag ng paulit-ulit na kalagayang temporal; natural itong isinasalin na “Kapag,” ayon din sa takbo ng salmo.
- source_word: עַל־יְצוּעָי
  choice: habang nakahiga ako
  rationale: Ang יְצוּעַ ay higaan o lugar na hinihigaan. Ang pariralang ito ay natural sa modernong Tagalog at pinananatili ang larawan ng pag-alaala sa higaan.
- source_word: אֶהְגֶּה בָּךְ
  choice: pinagbubulay-bulayan kita
  rationale: Ang הגה ay tumutukoy sa tahimik o masinsing pagninilay; ang “pinagbubulay-bulayan” ay dignidad at saklaw na angkop sa konteksto.
- source_word: בְּאַשְׁמֻרוֹת
  choice: sa mga pagbabantay sa gabi
  rationale: Tumutukoy ito sa mga yugto o oras ng pagbabantay sa gabi, hindi lamang sa gabi sa pangkalahatan.
