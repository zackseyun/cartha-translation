lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: Ibibigay sila
  rationale: Ang pandiwa ay literal na may larawang “ibubuhos nila siya,” ngunit lumilipat ang Hebreo mula sa isahang layon na “siya” tungo sa maramihang paksa na “sila” sa ikalawang sugnay. Ginamit ang pasibong maramihan upang maging malinaw sa natural na Tagalog na ang mga kaaway sa konteksto ang sasapit sa kapahamakang ito, habang inilalahad sa talababa ang mas literal at malabong anyo.
- source_word: עַל יְדֵי חָרֶב
  choice: sa kapangyarihan ng tabak
  rationale: Ipinahahayag nito ang ahensiya o kapangyarihan ng tabak, hindi literal na mga kamay. Pinananatili rin nito ang marahas at patulang larawan nang hindi nagiging asiwa sa Tagalog.
- source_word: מְנָת
  choice: bahaging laan
  rationale: Ang salita ay tumutukoy sa isang bahagi o takdang kaparte. Nililinaw ng “laan” na ang mga bangkay ang mapupunta sa mga hayop, nang hindi lubusang pinapalitan ng interpretatibong “pagkain.”
- source_word: שֻׁעָלִים
  choice: mga soro
  rationale: Karaniwang tumutukoy ang salitang Hebreo sa mga soro, bagaman maaari itong unawain bilang mga chakal o mas malawak na uri ng ligaw na canid sa konteksto ng kamatayan at pagkawasak.
- source_word: יִהְיוּ
  choice: magiging
  rationale: Ipinakikita ng “magiging” ang kalagayang kahihinatnan nila matapos silang mamatay sa tabak.
theological_decisions:
- issue: Paglipat mula sa isahang layon tungo sa maramihang paksa
  choice: 'Pasibong maramihan sa pangunahing teksto: “Ibibigay sila”'
  alternative: “Ibubuhos nila siya”
  rationale: Hindi ipinapalagay kung sino ang mga tagagawa ng kilos, at malinaw na inuugnay ang kapalaran sa maramihang mga kaaway sa konteksto. Pinananatili sa talababa ang tunay na gramatikal na tensiyon at mas literal na pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Pinili ang “bahaging laan” upang mapanatili ang patulang diwa ng takdang bahagi nang hindi magmukhang kabilang ang mga tao sa pangkat ng mga soro. Ang ayos ng mga pananda ay [a] at saka [b] ayon sa pagkakasunod sa teksto.
