  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: tl
  text: Diyos, ikaw ang aking Diyos; hinahanap kita sa bukang-liwayway.[a] Nauuhaw sa iyo ang kaluluwa ko, nananabik sa iyo ang laman ko,[b] sa tuyot at pagod na lupain, na walang tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinahanap kita nang maaga,” “masigasig kitang hinahanap,” o, sa mas interpretibong salin, “taimtim kitang hinahanap.” Ang pandiwang Hebreo ay literal na nagpapahiwatig ng paghahanap sa bukang-liwayway.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring hatiin ang pangungusap nang ganito: “Nauuhaw sa iyo ang kaluluwa ko; nananabik sa iyo ang laman ko sa tuyot at pagod na lupain, na walang tubig.” Sa pagbasa ring ito, ang paglalarawan sa lupain ay mas tuwirang kaugnay ng ikalawang pahayag.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang anyong maramihan sa Hebreo ay ginagamit dito bilang pantukoy sa iisang Diyos. Hindi idinagdag ang “O” sapagkat tuwirang panawagan na ang kasunod na pahayag at walang katumbas na padamdam sa Hebreo.
- source_word: אֵלִי אַתָּה
  choice: ikaw ang aking Diyos
  rationale: Pinananatili ang tahasan at mariing personal na pagpapahayag ng Hebreo sa likas na ayos ng Tagalog.
- source_word: אֲשַׁחֲרֶךָּ
  choice: hinahanap kita sa bukang-liwayway
  rationale: Pinananatili ang konkretong larawan ng paghahanap sa pagsapit ng umaga, sa halip na palitan agad ng mas interpretibong “taimtim” o “masigasig.”
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Nauuhaw sa iyo ang kaluluwa ko
  rationale: Ang pandiwa ay literal na tumutukoy sa pagkauhaw, at ang “kaluluwa” ay nagpapanatili sa ποιetikong pagtutugma nito sa “laman.”
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: nananabik sa iyo ang laman ko
  rationale: Ang “nananabik” ay nagpapahayag ng matinding pananabik nang hindi nagpapahiwatig ng pisikal na pagbagsak; pinananatili ng “laman” ang kongkretong katawanyang larawan ng Hebreo.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: sa lupaing tigang at lupaypay
  rationale: Ang “tigang” ay malinaw na nagpapahayag ng kawalan ng halumigmig, samantalang pinananatili ng “lupaypay” ang ποιetikong pagsasatao sa lupa bilang pagod o nanghihina.
- source_word: בְּלִי מָיִם
  choice: na walang tubig
  rationale: Direkta, malinaw, at likas na salin ng pariralang nagsasaad ng lubos na kawalan ng tubig.
theological_decisions:
- issue: Antropolohikong wika sa pagtutugma ng נֶפֶשׁ at בָּשָׂר
  choice: Panatilihin ang “kaluluwa ko” at “laman ko” bilang magkatugmang larawan ng buong personal at katawang pananabik.
  alternative: Isalin bilang “buong pagkatao ko” at “katawan ko” para sa mas tuwirang makabagong pagpapahayag.
  rationale: Sadyang pinagtatapat ng tulang Hebreo ang panloob na buhay at pisikal na katawan. Pinananatili ng salin ang dalawang larawan nang hindi iginigiit ang isang mahigpit na doktrina ng paghihiwalay ng katawan at kaluluwa.
- issue: Saklaw ng pariralang “sa lupaing tigang at lupaypay, na walang tubig”
  choice: Gamitin ang bantas upang natural na maiugnay ang kalagayan ng lupain sa kabuuang pagkauhaw at pananabik.
  alternative: Iugnay lamang ang parirala sa pananabik ng “laman ko.”
  rationale: Maaaring basahin ang Hebreong ayos sa higit sa isang paraan; hindi dapat itago ang posibleng mas makitid na pagkakaugnay, kaya itinakda ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal at ποιetiko ang rehistro. Ginamit ang karaniwang “kaluluwa” at literal na “laman” upang mapanatili ang magkatugmang larawan ng Hebreo. Ang “bukang-liwayway” ay bahagyang mataas ang antas ngunit malinaw at angkop sa salmo; ang “tigang at lupaypay” ay nagpapanatili sa personipikasyon ng lupa.
