  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: tl
  text: Kaya pagpapalain kita habang ako'y nabubuhay[a]; sa iyong pangalan ay itataas ko ang aking mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pupurihin kita.” Mas literal sa Hebreo ang “pagpapalain kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang pahayag at likas na nagpapahayag ng bunga o tugon sa modernong Tagalog.
- source_word: אֲבָרֶכְךָ
  choice: pagpapalain kita
  rationale: Pinananatili ang tahasang kahulugan ng ugat na ברך kapag ang pagsamba ay nakatuon sa Diyos, sa halip na agad itong ipakahulugang 'pupurihin.'
- source_word: בְחַיָּי
  choice: habang ako'y nabubuhay
  rationale: 'Natural na ipinapahayag ang duratibong diwa: sa buong panahon ng buhay ng salmista.'
- source_word: בְּשִׁמְךָ
  choice: sa iyong pangalan
  rationale: Pinananatili ang maaaring diwa ng saklaw, batayan, o pagtawag sa pangalan ng Diyos nang hindi pumipili nang labis sa isa lamang.
- source_word: אֶשָּׂא
  choice: itataas ko
  rationale: Tuwirang inilalarawan ang karaniwang kilos ng panalangin o pagpupuri.
- source_word: כַפָּי
  choice: aking mga kamay
  rationale: Bagaman maaaring tumukoy ang כף sa palad, 'mga kamay' ang natural na Tagalog sa idyomang ito.
theological_decisions:
- issue: Wikang pagsamba na nakatuon sa Diyos sa pandiwang ברך
  choice: Panatilihin sa pangunahing teksto ang 'pagpapalain kita.'
  alternative: Pupurihin kita.
  rationale: Ang Hebreo ay tahasang gumagamit ng ברך. Pinananatili ng salin ang leksikal at teolohikal na tensiyon, habang inilalagay sa talababa ang mas interpretatibong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'ako'y' upang mapanatili ang maayos at bahagyang patulang indayog nang hindi nagiging makaluma.
