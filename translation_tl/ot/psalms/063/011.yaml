  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: tl
  text: Ngunit ang hari ay magagalak sa Diyos; magmamalaki[a] ang bawat nanunumpa sa pangalan niya[b], sapagkat masasarhan ang mga bibig ng mga nagsasalita ng kasinungalingan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbubunyi” o “magmamapuri.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagmamalaki o pagbubunying may karangalan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nanunumpa sa pamamagitan niya.” Pinakanatural na tumutukoy ang “niya” sa Diyos, bagaman maaari rin itong unawaing tumutukoy sa hari.
    reason: referential_ambiguity
  - marker: c
    text: Sa literal, “masasarhan ang bibig ng mga nagsasalita ng kasinungalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Ngunit ang hari
  rationale: Maaaring simpleng “at” ang waw, ngunit natural na ipinahihiwatig rito ang pagsalungat sa sinapit ng masasama sa naunang talata.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: ay magagalak sa Diyos
  rationale: Ipinapahayag ng imperfect ng שׂמח ang inaasahang kagalakan, at ang בְּ ay tumutukoy sa Diyos bilang saligan o layon nito.
- source_word: יִתְהַלֵּל
  choice: magmamalaki
  rationale: Ang Hitpael ng הלל ay maaaring mangahulugang magmalaki o magbunyi nang may karangalan. Ang “magmamalaki” ay malinaw sa modernong Tagalog nang hindi inaalis ang posibleng positibong diwa.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: ang bawat nanunumpa sa pangalan niya
  rationale: Ang parirala ay tumutukoy sa bawat taong nanunumpa na ang Diyos ang tinatawagan bilang saksi. Natural sa Tagalog ang “manumpa sa pangalan” at iniiwasan nito ang di-likas na “manumpa sa pamamagitan niya.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang katiyakan at kagalakan.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: patatahimikin ang mga bibig ng mga nagsasalita ng kasinungalingan
  rationale: Ang Niphal ng סכר ay literal na “masasarhan,” ngunit ang idyomatikong epekto ay ang pagpigil sa kanilang pagsasalita. Pinananatili ng “mga bibig” ang larawang Hebreo habang natural na tumutugma sa maramihang nagsasalita.
theological_decisions:
- issue: Pagkakakilanlan ng “hari”
  choice: Pinanatili ang “hari” nang walang dagdag na pagpapakilala.
  alternative: Tahasang tukuyin bilang si David o bilang Mesiyas.
  rationale: Hindi tahasang kinikilala ng mismong talata ang hari. Ang simpleng katawagan ay nagpapanatili sa saklaw at teolohikal na tensiyon ng tekstong Hebreo.
- issue: Tinutukoy ng panghalip sa בּוֹ
  choice: Ang “niya” ay tumutukoy sa Diyos.
  alternative: Ang panghalip ay tumutukoy sa hari.
  rationale: Ang Diyos ang pinakamalapit at pinakanatural na tinutukoy, at karaniwang biblikal na pahayag ang panunumpa sa pangalan ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa pangalan niya” bilang natural na pananalita sa panunumpa; inilagay sa talababa ang mas literal na anyo at ang di-gaanong malamang na alternatibong pagtukoy ng panghalip.
