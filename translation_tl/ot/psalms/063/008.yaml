  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: tl
  text: Ang kaluluwa ko'y kumakapit sa iyo[a]; inaalalayan ako ng iyong kanang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit na sumusunod sa iyo.” Literal na “kasunod mo” o “sa likuran mo” ang Hebreo; maaari itong magpahiwatig ng malapit na pagsunod o pagkapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: kumakapit
  rationale: Ang pandiwang דבק ay nagpapahayag ng mahigpit na pagdikit o pananatiling nakaugnay. Ang “kumakapit” ay natural sa Filipino at naipahahayag ang patuloy na matibay na ugnayan sa kontekstong patula.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa sarili, buhay, o buong pagkatao. Pinananatili ng “kaluluwa ko” ang personal at debosyonal na bigat ng tula nang hindi ito ginagawang teknikal na pahayag tungkol sa likas na pagkatao.
- source_word: אַחֲרֶיךָ
  choice: sa iyo
  rationale: Literal itong “sa likuran mo” o “kasunod mo,” ngunit kasama ng דבק ay nagsasaad ito ng mahigpit na pagkapit o malapit na pagsunod. Ang “sa iyo” ang likas na katuwang ng “kumakapit” sa Filipino; inilalahad sa talababa ang kongkretong larawan ng Hebreo.
- source_word: בִּי תָּמְכָה
  choice: inaalalayan ako
  rationale: Ang תמך ay nangangahulugang sumuporta, umalalay, o humawak upang hindi mabuwal. Ang “inaalalayan ako” ay malinaw at natural habang pinananatili ang aktibong pagsuporta ng Diyos.
- source_word: יְמִינֶךָ
  choice: iyong kanang kamay
  rationale: Tuwirang pinananatili ang kongkretong larawang Hebreo ng kanang kamay, sa halip na ipakahulugan ito bilang kapangyarihan o lakas.
theological_decisions:
- issue: Saklaw ng נַפְשִׁי
  choice: ang kaluluwa ko
  alternative: ako / ang buo kong pagkatao
  rationale: Pinananatili ang tradisyonal at patulang larawan, ngunit hindi ipinapalagay na teknikal na doktrina tungkol sa hiwalay na sangkap ng tao ang tinutukoy.
- issue: Larawan ng kanang kamay ng Diyos
  choice: iyong kanang kamay
  alternative: iyong kapangyarihan / iyong lakas
  rationale: Pinananatili ang antropomorpikong larawan ng orihinal at hindi ito pinapalitan ng abstraktong pagpapakahulugan.
- issue: Ugnayan ng דבק at אחר
  choice: kumakapit sa iyo
  alternative: mahigpit na sumusunod sa iyo / kumakapit na kasunod mo
  rationale: Natural sa modernong Filipino ang pangunahing salin, habang ang talababa ay nagpapanatili sa tunay na posibilidad ng larawang malapit na pagsunod na nasa Hebreo.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang pinaikling “ko'y” upang mapanatili ang maindayog na himig ng salmo. Hindi inalis ang kongkretong larawan ng “kanang kamay.”
