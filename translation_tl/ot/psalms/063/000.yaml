base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/000.yaml
  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: tl
  text: Awit ni David[a], nang siya ay nasa ilang[b] ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinulat ni David” o “para kay David.” Sa Hebreo, maaaring tumukoy ang pamagat sa pagkatha, paghahandog, pag-aari, o kaugnayan kay David.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “disyerto” o “kaparangan.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa tuyot at di-tinitirhang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Ang “awit” ang natural at kinikilalang terminong Filipino para sa teknikal na pamagat na mizmor sa Aklat ng mga Awit.
- source_word: לְדָוִד
  choice: ni David
  rationale: Pinananatili ng “ni David” ang lawak ng ugnayang ipinahihiwatig ng Hebreong לְ—maaaring akda, pag-aari, paghahandog, o pagkakaugnay—nang hindi ito nililimitahan sa “isinulat ni David.”
- source_word: בִּהְיוֹתוֹ
  choice: nang siya ay nasa
  rationale: Likas na temporal na parirala sa Filipino na naghahatid ng diwang “nang/ noong siya ay naroon.”
- source_word: בְּמִדְבַּר
  choice: nasa ilang
  rationale: Ang “ilang” ay sumasaklaw sa ilang, kaparangan, o disyertong lupain at hindi nagpapalagay na purong buhanginan ang lugar.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon at lipi.
theological_decisions:
- issue: Kahulugan ng pamagat na Davidiko
  choice: ni David
  alternative: isinulat ni David; para kay David
  rationale: Hindi tiyak na nilulutas ng Hebreong לְדָוִד kung ito ay tumutukoy sa pagkatha, pag-aari, paghahandog, o kaugnayan. Ang “ni David” ang pinakamaikling likas na saling nagpapanatili sa kalabuan.
translation_notes:
  register: Maikli at marangal na pamagat sa modernong Filipino. Ginamit ang “ilang” bilang tradisyonal ngunit nauunawaang terminong biblikal; nilinaw sa talababa ang mas malawak na heograpikong saklaw nito.
