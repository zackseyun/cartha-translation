base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: tl
  text: Ang kaluluwa ko'y nabubusog gaya ng sa taba at masaganang pagkain[a]; at pinupuri ka ng aking bibig sa pamamagitan ng mga labing humihiyaw sa galak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Ang kaluluwa ko'y mabubusog gaya ng sa taba at masaganang pagkain.” Literal na “taba at kasaganaan”; ang mga salita ay larawan ng masarap at masaganang pagkain.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga labi ng mga hiyaw ng kagalakan.” Maaari ring, “sa mga labing sumisigaw sa galak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: para bang sa
  rationale: Ipinakikilala nito ang paghahambing. Likas sa modernong Tagalog ang “para bang sa” kasunod ng larawang tumutukoy sa pagkain.
- source_word: חֵלֶב וָדֶשֶׁן
  choice: taba at masaganang pagkain
  rationale: Pinananatili ng “taba” ang kongkretong larawan ng Hebreo, samantalang ipinahahayag ng “masaganang pagkain” ang yaman at kasaganaan ng דֶּשֶׁן nang hindi gumagamit ng alanganing pag-uulit na “taba at katabaan.”
- source_word: תִּשְׂבַּע
  choice: nabubusog
  rationale: Ang pandiwa ay literal na nagsasaad ng pagkabusog o lubos na kasiyahan. Ang aspektong di-ganap sa tulang Hebreo ay maaaring tumukoy sa kasalukuyan, nakagawian, o hinaharap; dito, ang kasalukuyang “nabubusog” ay natural sa daloy ng papuri.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Maaaring mangahulugan ang נֶפֶשׁ ng kaluluwa, sarili, buhay, o buong pagkatao. Pinananatili ng “kaluluwa ko” ang panloob at makatang diwa at ang ugnayan nito sa pananabik sa Diyos sa konteksto.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: sa mga labing umaawit nang may galak
  rationale: Literal itong “mga labi ng mga hiyaw ng kagalakan.” Ang salin ay nagpapanatili sa larawan ng mga labi at malinaw na naghahatid ng masayang tinig ng papuri sa natural na Tagalog.
- source_word: יְהַלֶּל פִּי
  choice: pinupuri ka ng bibig ko
  rationale: Ang “bibig ko” ang simuno ng pandiwa. Bagaman walang tahasang layon sa Hebreo, malinaw sa tuwirang pakikipag-usap ng salmo sa Diyos na siya ang pinupuri; kaya likas na idinagdag ang “ka.”
theological_decisions:
- issue: Hindi tahasang layon ng pandiwang “pumuri”
  choice: 'Idinagdag ang “ka”: “pinupuri ka ng bibig ko.”'
  alternative: “pumupuri ang bibig ko”
  rationale: Hindi binabanggit sa sugnay ang layon, ngunit malinaw sa konteksto ng salmo na ang Diyos ang kausap at pinupuri. Ginagawang likas ng “ka” ang Tagalog nang hindi nagdaragdag ng bagong teolohikal na pahayag.
- issue: Aspekto/panahon ng mga pandiwang di-ganap sa tulang Hebreo
  choice: 'Kasalukuyang pagbasa: “nabubusog” at “pinupuri.”'
  alternative: 'Hinaharap na pagbasa: “mabubusog” at “pupurihin.”'
  rationale: Maaaring magpahayag ang anyong Hebreo ng nagpapatuloy, nakagawian, buhay na kasalukuyan, o hinaharap. Ang kasalukuyang pagbasa ay umaangkop sa karanasan ng makata, habang kinikilala sa talababa ang tunay na posibilidad ng hinaharap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang mga larawang “kaluluwa,” “taba,” “bibig,” at “mga labi,” ngunit ginawang likas ang sintaks. Inilagay ang mga marker na [a] at [b] sa mismong teksto.
