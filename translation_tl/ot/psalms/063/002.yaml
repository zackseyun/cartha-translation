  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: tl
  text: Gayon, minasdan kita sa santuwaryo[a], upang makita ang iyong kapangyarihan at kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gayon, sa banal na dako ay minasdan kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Gayon
  rationale: Pinananatili ang pang-abay na diwa na “gayon/sa gayong paraan” at ang ugnayan nito sa naunang pananabik ng salmista, nang hindi labis na nililinaw ang lohika.
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Sa konteksto ng pagsamba, ang קֹדֶשׁ na may pang-ukol ay pinakamalamang na tumutukoy sa banal na dako o santuwaryo, bagaman posible rin ang mas literal na “sa banal na dako.”
- source_word: חֲזִיתִיךָ
  choice: kita nakita
  rationale: Ang חזה ay tumutukoy sa masinsin o mapagmuning pagkakita. Sa modernong Tagalog, natural ang “kita nakita” at pinananatili nito ang tuwirang layon na “ikaw,” bagaman hindi nito lubos na naihahayag ang contemplative nuance.
- source_word: לִרְאוֹת
  choice: upang makita
  rationale: Malinaw na ipinahahayag ang layunin ng infinitive nang hindi binabago ang pag-uulit ng semantikong larangan ng pagkakita.
- source_word: עֻזְּךָ
  choice: iyong kapangyarihan
  rationale: Ang עֹז ay maaaring lakas, kapangyarihan, o makapangyarihang lakas; “kapangyarihan” ang malinaw at likas na katambal ng “kaluwalhatian.”
- source_word: וּכְבוֹדֶךָ
  choice: at kaluwalhatian
  rationale: Ang “kaluwalhatian” ang karaniwan at angkop na katumbas ng כָּבוֹד kapag tumutukoy sa Diyos, at naghahatid ng kaniyang hayag na kadakilaan.
theological_decisions:
- issue: Ang uri ng pagkakita sa Diyos sa santuwaryo
  choice: Pinanatili ang tuwirang pahayag na nakita ng salmista ang Diyos sa santuwaryo upang makita ang kaniyang kapangyarihan at kaluwalhatian.
  alternative: Unawain ito bilang mistiko o pangitaing pagkakita sa mismong banal na kalikasan ng Diyos.
  rationale: Hindi ipinapaliwanag ng Hebreo kung literal, liturhikal, o pangitain ang pagkakita. Kaya hindi nilulutas ng salin ang tensiyong ito at hindi rin ipinahihiwatig na nakita ang mismong diwa ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “santuwaryo” bilang pamilyar na terminong panrelihiyon; inilagay sa talababa ang “banal na dako” at “minasdan” upang maipakita ang leksikal na saklaw at ang mas mapagmuning diwa ng pandiwa.
