  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: tl
  text: Ngunit ang mga naghahangad na ipahamak ang buhay ko[b] ay mapupunta sa kailaliman ng lupa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “sa mga mababang bahagi ng lupa.”
    reason: lexical_alternative
  - marker: b
    text: O, “naghahangad ng buhay ko upang ipahamak ito.”
    reason: previous_rendering
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Ngunit ang mga
  rationale: Ang panghalip ay may diin, at ang וְ ay nauunawaang panalungat dahil ipinapakita nito ang kaibahan sa pagtitiwala ng salmista sa naunang talata. Ang pariralang ito ay likas sa Filipino habang tinutukoy ang mga kaaway.
- source_word: לְשׁוֹאָה
  choice: na ipahamak
  rationale: Ang שׁוֹאָה ay tumutukoy sa kapahamakan, pagkawasak, o pagkasira. Ginawang layuning parirala upang malinaw at natural na maipahayag sa Filipino ang masamang hangarin, habang inilalagay sa talababa ang mas pormal na alternatibo.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: naghahangad na ipahamak ang buhay ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay buhay ng salmista, hindi isang hiwalay at di-materyal na 'kaluluwa.' Ipinahahayag ng salin ang paghahangad ng mga kaaway na kitilin o wasakin ang kanyang buhay.
- source_word: יָבֹאוּ
  choice: ay mapupunta
  rationale: Bagaman pangunahing nangangahulugang 'darating' ang pandiwa, mas natural sa Filipino ang 'mapupunta' kapag ang tinutukoy na hantungan ay ang kailaliman ng lupa.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: sa kailaliman ng lupa
  rationale: Pinananatili nito ang larawang patula ng pagbaba sa malalalim o mabababang bahagi ng lupa nang hindi tiyak na ginagawa itong teknikal na tawag sa daigdig ng mga patay.
theological_decisions:
- issue: Kahulugan ng pagpunta sa 'kailaliman ng lupa'
  choice: Pinanatili bilang larawang patula na maaaring tumukoy sa kamatayan, libingan, o pagbagsak sa paghatol.
  alternative: Maaaring unawain bilang literal na 'mga mababang bahagi ng lupa' o bilang pagtukoy sa Sheol/daigdig ng mga patay.
  rationale: Hindi ganap na nililinaw ng pariralang Hebreo kung ito ay heograpikong larawan, libingan, o daigdig ng mga patay. Kaya hindi nilutas ng salin ang tunay na ambiguwidad sa pamamagitan ng pagpasok ng isang tiyak na doktrina tungkol sa kabilang-buhay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “buhay” sa halip na “kaluluwa” dahil iyon ang diwa ng נֶפֶשׁ sa konteksto. Ang “kailaliman ng lupa” ay nagpapanatili sa patulang larawan at sa teolohikal na ambiguwidad nito.
