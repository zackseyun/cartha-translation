  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: tl
  text: Aalalayan siya ni Yahweh sa higaan ng karamdaman; sa kaniyang karamdaman, ibinabalik mo sa ayos ang buong higaan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binabaligtad mo ang buong higaan niya sa kaniyang karamdaman.” Ang pandiwang Hebreo ay literal na nangangahulugang “baligtarin” o “ibaling”; malamang na idyomatikong tumutukoy ito rito sa mapagkalingang pag-aalaga o pagpapanumbalik sa maysakit habang siya ay nakaratay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יִסְעָדֶנּוּ
  choice: Aalalayan siya
  rationale: Ang סעד ay nangangahulugang umalalay o sumuporta sa isang nanghihina. Likas sa modernong Tagalog ang “aalalayan” at angkop ito sa kalagayan ng maysakit.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: sa higaan ng karamdaman
  rationale: Pinananatili nito ang larawan ng isang taong nakaratay dahil sa sakit nang hindi gumagamit ng labis na kolokyal na pananalita.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: ang buo niyang higaan
  rationale: Isinasalin ng “buo” ang totalizing force ng כָּל, at inuulit ang larawan ng higaan na nasa paralelismo ng Hebreo.
- source_word: הָפַכְתָּ
  choice: pinapanumbalik mo
  rationale: Literal na “binaligtad/binago” ang pandiwa, ngunit sa konteksto ay malamang na idyoma para sa mapagkalingang pagpapanumbalik sa kalagayan ng maysakit. Pinananatili sa talababa ang literal na posibilidad.
- source_word: בְחָלְיוֹ
  choice: sa kanyang pagkakasakit
  rationale: Malinaw na ipinapahayag ang kalagayan o panahong kinapapalooban ng pagkilos.
theological_decisions:
- issue: Paglipat ng pagtukoy mula ikatlong panauhan tungo sa tuwirang pakikipag-usap sa Diyos
  choice: Pinanatili ang “ni Yahweh” at pagkatapos ay “mo.”
  alternative: 'Gawing ikatlong panauhan ang buong talata: “Aalalayan siya ni Yahweh… papanumbalikin niya…”'
  rationale: Biglang lumilipat ang Hebreo mula sa pagsasalita tungkol kay Yahweh tungo sa tuwirang pagtawag sa kanya. Pinananatili nito ang anyong patula at panalangin ng salmo at hindi pinapakinis ang tunay na tensiyon ng teksto.
- issue: Kahulugan ng הָפַכְתָּ sa konteksto ng karamdaman
  choice: “pinapanumbalik mo,” na may literal na alternatibo sa talababa
  alternative: “binabaligtad mo” o “inaayos mo” ang kanyang buong higaan
  rationale: Ang konteksto ay nagpapahiwatig ng mapagkalingang pagkilos, ngunit hindi tiyak ang eksaktong idyoma. Kaya ginamit sa teksto ang malamang na diwa habang hayagang pinanatili sa talababa ang leksikal na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong paralelismo, ang personal na pangalang Yahweh, at ang biglang paglipat sa ikalawang panauhan. Inilagay ang pananda ng talababa sa pangunahing teksto.
