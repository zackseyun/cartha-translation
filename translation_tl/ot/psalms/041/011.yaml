  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: tl
  text: 'Sa ganito ko nalalaman na nalulugod ka sa akin[a]: sapagkat hindi nagbubunyi sa tagumpay laban sa akin ang kaaway ko.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasisiyahan ka sa akin” o “kinikilingan mo ako.” Ang pandiwang Hebreo ay tumutukoy sa pagkakaroon ng lugod o kasiyahan.
    reason: lexical_alternative
  - marker: b
    text: O “hindi nagtatagumpay laban sa akin ang kaaway ko.” Mas literal na tumutukoy ang pandiwang Hebreo sa pagsigaw, malamang ay sigaw ng tagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Dito
  rationale: Ipinakikilala ng pariralang Hebreo ang ebidensiya o batayan ng pagkaalam. Likas sa Filipino ang “Dito ko nalalaman” at napapanatili nito ang diwang “sa pamamagitan nito.”
- source_word: יָדַעְתִּי
  choice: ko nalalaman
  rationale: Bagaman nasa anyong perfect ang pandiwang Hebreo, ipinahahayag nito sa konteksto ang kasalukuyang kaalamang nakabatay sa nakikitang katibayan.
- source_word: חָפַצְתָּ בִּי
  choice: nalulugod ka sa akin
  rationale: Ang חפץ ay tumutukoy sa pagkakaroon ng lugod o kasiyahan sa isang tao. Hindi nito pinalalawak ang pahayag tungo sa isang tiyak na doktrina ng merito o pag-aaring matuwid.
- source_word: יָרִיעַ
  choice: nagbubunyi sa tagumpay
  rationale: Ang Hiphil ng רוע ay naglalarawan ng malakas na sigaw, lalo na ng sigaw ng tagumpay. Ang “nagbubunyi sa tagumpay” ay natural sa Filipino at pinananatili ang pandinig na larawan ng Hebreo.
- source_word: אֹיְבִי
  choice: ang kaaway ko
  rationale: Pinananatili ang isahang bilang at ang panlaping paari ng unang panauhan sa Hebreo.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng pagbubunyi ng kaaway, malinaw at natural sa Filipino ang “laban sa akin”; ipinahihiwatig nito ang pagdiriwang ng kaaway dahil sa inaakalang pagkatalo ng salmista.
theological_decisions:
- issue: Kung ang pagkabigo ng kaaway ay patunay ng pagsang-ayon ng Diyos sa salmista
  choice: Inilalahad na itinuturing ng salmista ang hindi pagbubunyi ng kaaway bilang katibayan na nalulugod sa kanya ang Diyos.
  alternative: Maaaring unawain ito bilang mas malakas na pahayag ng pagpapawalang-sala o pagiging matuwid ng salmista sa harap ng Diyos.
  rationale: Pinag-uugnay ng Hebreo ang lugod ng Diyos at ang hindi pagtatagumpay ng kaaway, ngunit hindi nito sinasabi kung ano ang batayan ng lugod na iyon. Kaya hindi nagdaragdag ang salin ng doktrina tungkol sa merito o pagpapawalang-sala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagbubunyi sa tagumpay” upang mapanatili ang larawan ng sigaw ng tagumpay nang hindi nagiging pilit ang pangungusap.
