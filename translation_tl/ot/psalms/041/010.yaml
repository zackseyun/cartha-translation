  - severity: low
    issue: Ang 'kahabagan mo ako' ay mas makitid kaysa sa חָנֵּנִי.
    rationale: Maaaring ipahiwatig ng 'kahabagan' ang awa, ngunit ang חנן ay pagsusumamo para sa mapagbiyayang pabor. Ang 'lingapin mo ako' ay mas malawak at natural na katumbas sa rehistrong panalangin.
