  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: tl
  text: Ngunit ikaw, Yahweh, lingapin mo ako at ibangon mo ako, upang makaganti ako sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at gaganti ako sa kanila.” Maaaring unawain ang cohortative sa Hebreo bilang layunin o bunga (“upang makaganti ako”) o bilang isang pagpapasyang kasunod ng mga pakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ang pangatnig na kasama ng tahasang panghalip ay nagpapakita ng pagsalungat sa mga kaaway at dating kaibigang binanggit sa naunang konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: חָנֵּנִי
  choice: kahabagan mo ako
  rationale: Likas at marangal na pakiusap ito sa modernong Filipino para sa mapagbiyayang awa o pabor, nang hindi ito nililimitahan sa simpleng pagkahabag lamang.
- source_word: וַהֲקִימֵנִי
  choice: at ibangon
  rationale: Pinananatili ang konkretong larawan ng Hiphil ng קום, ‘pangyaring bumangon o tumayo,’ na sa konteksto ay maaari ring tumukoy sa pagpapanumbalik.
- source_word: וַאֲשַׁלְּמָה
  choice: upang makaganti ako
  rationale: Ang Piel ng שלם ay tumutukoy sa pagganti o pagbabayad ng nararapat. Ang cohortative pagkatapos ng mga pakiusap ay maaaring ipakahulugang layunin o bunga.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Tinutukoy ng pariralang may ל ang mga taong tatanggap ng pagganti; natural sa Filipino ang ‘makaganti sa kanila.’
theological_decisions:
- issue: Kung palalambutin ang pagganti ng salmista upang alisin ang imprecatoryong diwa
  choice: Panatilihin ang ‘makaganti ako sa kanila’
  alternative: ‘maipagtanggol mo ako laban sa kanila’ o ‘mapakitunguhan ko sila ayon sa nararapat’
  rationale: Tuwirang nagpapahayag ang שלם ng pagganti o pagbabayad. Ang pagpapalambot nito ay mag-aangkat ng interpretasyon at mag-aalis sa hudisyal at imprecatoryong tensiyon ng talata.
- issue: Kung ang cohortative ay layunin/bunga o kasunod na pagpapasya
  choice: 'Ilahad sa pangunahing teksto bilang layunin: ‘upang makaganti ako’'
  alternative: ‘at gaganti ako sa kanila’
  rationale: Parehong posible sa gramatika. Ang pangunahing salin ay natural na nag-uugnay sa pagganti sa mga naunang pakiusap, habang itinatala sa talababa ang alternatibong pagbasa bilang pagpapasya.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘kahabagan’ bilang likas na pakiusap para sa mapagbiyayang awa, ‘ibangon’ upang mapanatili ang konkretong talinghaga, at ‘makaganti’ upang huwag pahupain ang tensiyong hudisyal ng orihinal.
