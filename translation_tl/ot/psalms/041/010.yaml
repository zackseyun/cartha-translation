  source_fidelity: Ang 'makaganti ako sa kanila' ay wastong sumasaklaw sa Piel ng שלם sa kontekstong ito at pinananatili ang imprecatoryong/judicial na bigat. Ang 'upang' ay isang katanggap-tanggap na paglalapat ng cohortative, habang ang alternatibong pagbasa ay nararapat manatili sa talababa. Gayunman, ang 'kahabagan' ay higit na nakatuon sa awa at hindi gaanong malinaw na naipapahayag ang malawak na diwa ng mapagbiyayang pabor ng חנן.
  naturalness: May kulang na tahasang pandiwa at layon sa 'at ibangon.' Bagaman maaaring mahinuha ang mga ito, mas malinaw, ganap, at natural sa modernong Filipino ang 'at ibangon mo ako.' Ang 'Lingapin mo ako' ay marangal ngunit buhay na Filipino at angkop sa panalanging salmiko.
  terminology: Panatilihin ang 'Yahweh.' Gamitin ang 'lingapin' para sa hiling na maging mapagbiyaya, at 'makaganti' para sa hindi pinalalambot na diwa ng pagbabayad/pagganti. Ginawang 'Hebreo' ang pangalan ng wika sa talababa.
