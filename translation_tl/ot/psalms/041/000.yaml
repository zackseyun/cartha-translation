  text: For the choir director. A psalm of David[a].
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika. Isang salmo ni David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinulat ni David” o “para kay David.” Sa Hebreo, maaaring magpahiwatig ang pamagat ng pagkatha, kaugnayan, pag-aari, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa pagtatanghal ng musika. Malinaw at likas sa makabagong Filipino ang “tagapangasiwa ng musika,” at hindi nito ipinapalagay na koro lamang ang pinamumunuan.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ito ang karaniwang terminong pang-uri ng ganitong awiting panrelihiyon sa mga pamagat ng Mga Salmo. Pinananatili ng “salmo” ang tiyak na anyong pampanitikan at pamilyar ito sa mga mambabasa ng Bibliya.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang pariralang “salmo ni David” ay natural at tradisyonal sa Filipino, ngunit sapat na malawak upang magpahiwatig ng pagkatha, kaugnayan, pag-aari, o pag-aalay; inilalahad sa talababa ang mga pangunahing posibilidad.
theological_decisions:
- issue: Kahulugan ng Davidikong pamagat
  choice: ni David
  alternative: isinulat ni David; para kay David
  rationale: Maaaring tumukoy ang Hebreong לְ sa may-akda, kaugnayan, pag-aari, o pinag-alayan. Hindi tiyak na nilulutas ng pangunahing salin ang tunay na kalabuan; nililinaw sa talababa ang posibleng mga pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa ng musika” sa halip na “tagapanguna ng koro” upang hindi paliitin sa koro ang tungkuling ipinahihiwatig ng Hebreo. Nasa “ni David” ang marker [a], sapagkat iyon ang pariralang ipinaliliwanag ng talababa.
