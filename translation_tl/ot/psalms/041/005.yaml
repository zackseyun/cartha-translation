  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: tl
  text: Nagsasabi ng masama laban sa akin ang mga kaaway ko:[a] “Kailan siya mamamatay at maglalaho ang pangalan niya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagsasabi ng mga bagay na makapipinsala sa akin.” Literal na binabanggit ng pariralang Hebreo ang pagsasabi ng “masama” laban sa mang-aawit.
    reason: lexical_alternative
  - marker: b
    text: Ang “maglalaho ang pangalan niya” ay maaari ring tumukoy sa pagkawala ng kanyang reputasyon o ng alaala tungkol sa kanya, hindi lamang sa pagkawala ng binibigkas na pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: ang mga kaaway ko
  rationale: Ang pangmaramihang pangngalan na may hulaping unang panauhang isahan ay tuwirang nangangahulugang “mga kaaway ko.” Natural ito sa makabagong Tagalog at pinananatili ang puwersa ng pagkapoot.
- source_word: יֹאמְרוּ
  choice: Nagsasabi
  rationale: Ang imperfect na anyo ng אמר ay maaaring tumukoy sa kasalukuyan o karaniwang ginagawa sa kontekstong patula. Ang “nagsasabi” ay natural para sa patuloy o paulit-ulit na mapanirang pananalita.
- source_word: רַע לִי
  choice: ng masama laban sa akin
  rationale: Pinananatili ng “masama” ang malawak na kahulugan ng רַע, samantalang ipinahahayag ng “laban sa akin” ang mapanlabang direksiyon ng לִי nang hindi nililimitahan ito sa paninirang-puri lamang.
- source_word: מָתַי
  choice: Kailan
  rationale: Tuwirang katumbas ito ng pang-abay na pananong at hindi dinaragdagan ang kahulugan ng Hebreo.
- source_word: יָמוּת
  choice: siya mamamatay
  rationale: Sa kasunod ng “Kailan,” natural na ipinahahayag sa Tagalog ang inaasahang pangyayari bilang “mamamatay.” Ipinahihiwatig ng konteksto ang masamang hangarin ng mga kaaway nang hindi ginagawang tahasang sumpa o utos ang anyo.
- source_word: וְאָבַד שְׁמוֹ
  choice: at maglalaho ang pangalan niya
  rationale: Ang “maglalaho” ay natural na salin ng pagkawala o pagkapawi, at pinananatili ang literal na “pangalan” sa pangunahing teksto upang hindi agad ipalit ang interpretasyong “alaala” o “karangalan.”
