  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: tl
  text: Sama-samang nagbubulungan laban sa akin[a] ang lahat ng napopoot sa akin; laban sa akin ay nagbabalak sila ng masama para sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungkol sa akin.” Ang salitang Hebreo ay maaaring tumukoy sa salungat na direksiyon o sa paksa ng kanilang pagbubulungan; mas angkop sa konteksto ang “laban sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “nagbabalak sila ng masama laban sa akin.” Literal na “nag-iisip sila ng masama para sa akin”; ipinahihiwatig ng parirala ang masamang balak na nakatuon sa nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Sama-samang
  rationale: Ipinapahayag ang sabayang pagkilos ng mga napopoot sa salmista sa natural at maikling paraan.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng pagkapoot, pabulong na usapan, at masamang balak, higit na angkop ang diwang pasalungat kaysa sa simpleng ‘tungkol sa akin,’ habang kinikilala sa talababa ang tunay na kalabuan.
- source_word: יִתְלַחֲשׁוּ
  choice: nagbubulungan
  rationale: Inilalarawan ng anyong Hebreo ang pabulong na pag-uusap nila sa isa’t isa; hindi nito labis na ipinapasok ang mas tiyak na ideya ng pormal na sabwatan.
- source_word: כָּל שֹׂנְאָי
  choice: ang lahat ng napopoot sa akin
  rationale: Pinananatili ang pandiwang diwa ng participle at mas natural kaysa sa literal na ‘mga tagapoot ko.’
- source_word: יַחְשְׁבוּ
  choice: nagpaplano
  rationale: Sa kasamang רָעָה, ang pandiwa ay tumutukoy sa sinasadyang pag-iisip o pagbuo ng masamang balak.
- source_word: רָעָה
  choice: masama
  rationale: Pinananatili ang malawak na saklaw ng salitang Hebreo, na maaaring tumukoy sa kasamaan o kapahamakan, nang hindi agad nililimitahan sa pisikal na pinsala.
- source_word: לִי
  choice: laban sa akin
  rationale: Bagaman literal na ‘para/sa akin,’ ang idiomatikong Tagalog na ‘nagpaplano ng masama laban sa akin’ ay malinaw na naghahatid ng masamang layunin; ipinaliliwanag sa talababa ang posibleng mas literal na anyo.
