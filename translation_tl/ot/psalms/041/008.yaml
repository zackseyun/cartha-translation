  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: tl
  text: Isang masamang bagay ang ibinuhos sa kanya[a]; ngayong nakahiga na siya, hindi na siya muling babangon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “May karumal-dumal na bagay na kumapit sa kanya,” o “Isang masamang paratang ang ipinataw sa kanya.” Mahirap unawain ang pariralang Hebreo at maaaring tumukoy sa isang mapaminsalang karamdaman o sa isang mapanirang paratang.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: masamang bagay
  rationale: 'Pinananatili ng parirala ang siksik na kalabuan ng Hebreo: maaari itong tumukoy sa nakapipinsalang karamdaman o sa masamang paratang, nang hindi ipinipilit ang alinman.'
- source_word: יָצוּק
  choice: ibinuhos
  rationale: Inililipat nito ang pangunahing larawang Hebreo ng pagbubuhos o pagbubuhos sa ibabaw ng isang tao; hindi ito ginawang tahasang 'kumapit' o 'ipinaratang.'
- source_word: בּוֹ
  choice: sa kanya
  rationale: Natural itong katumbas sa Filipino sa konstruksiyong pasibo at maaari pa ring magpahiwatig ng bagay na dumating o inilapat sa taong tinutukoy.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: ngayong nakahiga na siya
  rationale: Natural na inuugnay nito ang kasalukuyang kalagayan sa kasunod na pahayag, habang pinananatili ang literal na larawan ng paghiga at hindi tuwirang ipinakahulugang pagkakasakit o pagkamatay.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: hindi na siya muling babangon
  rationale: Tapat ito sa idyomang nagsasaad na hindi na siya makakabangon o makakapanumbalik, at pinananatili ang mabigat na himig ng taludtod.
theological_decisions:
- issue: Kahulugan ng masamang bagay na sinasabing nasa kanya
  choice: Pinanatiling malabo kung ito ay mapaminsalang karamdaman o masamang paratang.
  alternative: Tahasang isalin bilang 'malubhang sakit' o 'masamang paratang.'
  rationale: Mahirap at siksik ang pariralang Hebreo; hindi sapat ang konteksto upang tiyak na piliin lamang ang pisikal na kapahamakan o ang mapanirang paratang.
- issue: Kahulugan ng hindi na muling pagbangon
  choice: Pinanatili ang larawang 'hindi na muling babangon.'
  alternative: Ipaliwanag bilang hindi na gagaling o tiyak nang mamamatay.
  rationale: Maaaring tumukoy ang pahayag sa hindi paggaling o sa kamatayan, kaya hindi dapat paliitin ng salin ang saklaw nito.
translation_notes:
  register: Makabago at dignified na Filipino, na may payak na bokabularyo. Ginamit ang “masamang bagay” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang tunay na kalabuan ng Hebreo.
