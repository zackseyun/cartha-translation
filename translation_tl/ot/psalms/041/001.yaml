  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: tl
  text: Mapalad ang taong nagsasaalang-alang sa dukha[a][b]; sa araw ng kapahamakan[c], ililigtas siya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kumikilos nang may karunungan para sa dukha.” Ang pandiwang Hebreo ay maaaring mangahulugan ng maingat at matalinong pagmamalasakit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mahina” o “nangangailangan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa araw ng kasamaan.” Dito, ang “kasamaan” ay tumutukoy sa kapahamakan o kaguluhan, hindi sa moral na kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Karaniwang pormula ito ng karunungang Hebreo para sa kalagayang mabuti at kanais-nais. Ang “Mapalad” ay likas at marangal sa Filipino at hindi nililimitahan ang diwa sa pansariling saya.
- source_word: מַשְׂכִּיל אֶל
  choice: nagsasaalang-alang sa
  rationale: Ang Hiphil ng שׂכל kasama ng אֶל ay nagpapahiwatig ng maingat at may-unawang pagtingin o pagkilos tungo sa isang tao. Pinananatili ng “nagsasaalang-alang sa” ang mapagnilay na diwa nang hindi nagdaragdag ng tiyak na gawaing hindi tahasang binanggit.
- source_word: דָּל
  choice: dukha
  rationale: Maaaring tumukoy ang salita sa mahirap, mahina, o kapos at maralita. Ang “dukha” ay maikli, dignified, at malawak ang saklaw sa kasalukuyang Filipino.
- source_word: בְּיוֹם רָעָה
  choice: sa araw ng kapahamakan
  rationale: Sa pariralang ito, ang רָעָה ay tumutukoy sa masamang pangyayari o kalamidad, hindi pangunahing sa moral na kasamaan. Malinaw itong ipinahahayag ng “kapahamakan” habang pinananatili ang larawang “araw.”
- source_word: יְמַלְּטֵהוּ
  choice: ililigtas siya
  rationale: Ang Piel ng מלט ay nangangahulugang sagipin o iligtas mula sa panganib. Likas at sapat ang bigat ng “ililigtas” sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pang-isahang kinatawang tao at panlalaking hulapi sa pangako
  choice: Panatilihin ang pang-isahang anyo sa “ang taong … siya.”
  alternative: 'Gawing maramihan: “ang mga taong … sila.”'
  rationale: Pang-isahan ang Hebreo. Ang “taong” at “siya” ay natural na generic sa Filipino at pinananatili ang anyo ng pangako nang hindi iginigiit na lalaki lamang ang tinutukoy.
- issue: Ang pahayag bilang karunungang pagpapala at pangako
  choice: Tuwirang isalin ang pahayag nang walang paliwanag sa pangunahing teksto.
  alternative: Palambutin bilang posibilidad o palawakin bilang ganap na garantiya sa lahat ng pagkakataon.
  rationale: Mariing ipinapahayag ng talata ang pagliligtas ni Yahweh sa anyong salmo ng karunungan. Hindi dapat bawasan ang lakas nito o dagdagan ng sistematikong interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Mapalad” bilang likas na pormula ng pagpapala, “dukha” para sa maikli ngunit malawak na katawagan sa taong kapos o mahina, at “Yahweh” upang panatilihin ang banal na pangalan.
