id: PSA.41.2
reference: Psalms 41:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: tl
  text: Babantayan siya ni Yahweh at iingatan ang kanyang buhay[a]; tatawagin siyang pinagpala sa lupain[b], at huwag mo nawa siyang ibigay sa kagustuhan ng kanyang mga kaaway[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pananatilihin siyang buhay.”
    reason: lexical_alternative
  - marker: b
    text: O “pagpapalain siya sa lupain” o “magiging pinagpala siya sa lupain.” Ang pandiwang Hebreo ay maaaring mangahulugang tatawagin o ituturing na pinagpala, o mas pangkalahatang magiging pinagpala.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa pagnanasa ng kanyang mga kaaway”; maaari ring isalin na “sa kalooban ng kanyang mga kaaway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: יִשְׁמְרֵהוּ
  choice: Babantayan siya
  rationale: Ang שׁמר ay nangangahulugang mag-ingat, magbantay, o mangalaga; natural sa modernong Tagalog ang “babantayan” at hindi nito inuulit ang diwa ng kasunod na pandiwa.
- source_word: וִיחַיֵּהוּ
  choice: at iingatan ang kanyang buhay
  rationale: 'Ang piel ng חיה rito ay causative/preservative: panatilihing buhay o ingatan ang buhay, hindi kinakailangang muling buhayin.'
- source_word: יאשר
  choice: tatawagin siyang pinagpala
  rationale: 'Pinananatili ang maaaring deklaratibong diwa ng אשר: ituturing o tatawaging pinagpala. Ang pagbasa na simpleng “pagpapalain” ay inilagay bilang alternatibo sa talababa.'
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang אֶרֶץ ay maaaring lupain, bansa, o lupa; “sa lupain” ang angkop at hindi labis na nagpapasaklaw sa buong daigdig.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: at huwag mo nawa siyang ibigay
  rationale: Ang ikalawang panauhang jussive ay isang pakiusap na tuwirang iniuukol kay Yahweh. Ipinakikita ng “huwag mo nawa” ang paglipat mula sa paglalarawan tungo sa panalangin.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: sa kagustuhan ng kanyang mga kaaway
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa pagnanasa, kalooban, o kagustuhan, hindi sa “kaluluwa” sa karaniwang modernong pakahulugan.
theological_decisions:
- issue: Paglipat mula sa pahayag tungkol kay Yahweh tungo sa tuwirang pakiusap sa kanya
  choice: 'Pinanatili ang ikatlong panauhan sa unang mga sugnay at ang ikalawang panauhan sa hulihan: “at huwag mo nawa...”'
  alternative: 'Gawing tuloy-tuloy na ikatlong panauhan: “at hindi niya siya ibibigay...”'
  rationale: Ang תִּתְּנֵהוּ ay ikalawang panauhang panlalaki na isahan. Hindi pinapantay ang mga panauhan, upang mapanatili ang biglang paglipat ng Hebreo at ang lakas ng panalangin.
- issue: Diwa ng יאשר
  choice: “tatawagin siyang pinagpala”
  alternative: “pagpapalain siya” o “magiging pinagpala siya”
  rationale: Maaaring ipahayag ng anyo ang pagkilala o pagtawag sa isang tao bilang pinagpala. Pinananatili ng salin ang nuance na ito nang hindi itinatanggi ang mas pangkalahatang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Yahweh” bilang pangalan, “lupain” para sa kontekstuwal na אֶרֶץ, at “huwag mo nawa” upang likas na maipahayag ang jussive na panalangin. Lahat ng marker ng talababa ay nasa pangunahing teksto.
