  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: tl
  text: Ako naman ay nagsabi, “Yahweh, kahabagan mo ako; pagalingin mo ang aking kaluluwa[a], sapagkat nagkasala ako laban sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang aking buhay” o “ako.” Ang Hebreong salita para sa “kaluluwa” (nefesh) ay maaari ring tumukoy sa buhay o sa buong sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ako nama'y
  rationale: Ang hiwalay at tahasang panghalip ay may bahagyang diin; likas na ipinahahayag ito sa Tagalog sa pamamagitan ng “Ako nama'y.”
- source_word: אָמַרְתִּי
  choice: nagsabi
  rationale: Ang Qal perfect na unang panauhan ay tumutukoy rito sa iniulat na sinabi ng mang-aawit, kaya ang payak na aspektong naganap ay angkop.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: חָנֵּנִי
  choice: kahabagan mo ako
  rationale: Ang pandiwa ay humihingi ng mapagbiyayang lingap o awa. Ang “kahabagan” ay natural sa panalangin at hindi lamang tumutukoy sa pagliligtas mula sa parusa.
- source_word: רְפָאָה
  choice: pagalingin mo
  rationale: Tuwirang pinananatili ang larawang pagpapagaling nang hindi tinutukoy kung pisikal, panloob, o kapwa ang saklaw.
- source_word: נַפְשִׁי
  choice: ang aking kaluluwa
  rationale: Pinananatili nito ang kongkretong anyo ng Hebreo at ang panloob na himig ng panalangin, habang nililinaw sa talababa na maaari rin itong tumukoy sa buhay o buong sarili.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap sa isang marangal at malinaw na paraan.
- source_word: חָטָאתִי
  choice: nagkasala ako
  rationale: Ang naganap na aspekto ay natural sa Tagalog at nagpapahayag ng pagtatapat na batayan ng pakiusap.
- source_word: לָךְ
  choice: sa iyo
  rationale: Kasama ng pandiwang “nagkasala,” natural na ipinahahayag ng “sa iyo” ang Diyos bilang pinagkasalahan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na halinhan ito ng titulo.
- issue: Saklaw ng “pagalingin mo ang aking kaluluwa”
  choice: pagalingin mo ang aking kaluluwa
  alternative: pagalingin mo ako / pagalingin mo ang aking buhay
  rationale: Malawak ang saklaw ng Hebreong נֶפֶשׁ at maaaring tumukoy sa kaluluwa, buhay, sarili, o buong tao. Pinananatili ng pangunahing teksto ang anyo ng Hebreo, at inilalahad ng talababa ang tunay na leksikal na lawak nito nang hindi nililimitahan ang pagpapagaling sa pisikal o espirituwal lamang.
translation_notes:
  register: Makabago ngunit marangal na wikang Filipino para sa panalangin. Ginamit ang pinaikling “nama'y” upang mapanatili ang banayad na diin sa tahasang panghalip nang hindi nagiging mabigat; nananatiling malinaw at madaling maunawaan ang kabuuang pangungusap.
