base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: tl
  text: Purihin si Yahweh, ang Diyos ng Israel, mula sa kawalang-hanggan hanggang sa kawalang-hanggan.[a] Amen at Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mula sa kapanahunan hanggang sa kapanahunan.” Ang Hebreong pahayag ay tumutukoy sa panahong walang hangganan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Sa pormulang ito ng pagpupuri, likas at marangal sa makabagong Tagalog ang pautos na “Purihin,” at naipapahayag nito ang liturhikal na diwa ng Hebreong passive participle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang isinasalin ang construct phrase; kailangan ang “ang” para sa natural na daloy sa Tagalog.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Pinananatili nito ang dalawang dulo ng Hebreong pahayag at ang diwa ng panahong walang hangganan, nang hindi ito pinaiikli sa simpleng “magpakailanman.”
- source_word: אָמֵן וְאָמֵן
  choice: Amen at amen
  rationale: Pinananatili ang inuulit na liturhikal na pagpapatibay at ang diin nito bilang pangwakas na pahayag.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; ang “Yahweh” ay nagpapanatili sa banal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  alternative: mula sa kapanahunan hanggang sa kapanahunan; magpakailanman
  rationale: Hindi nilulutas nang labis kung ang עוֹלָם ay dapat unawain bilang “eternity” o bilang walang takdang kapanahunan; ang napiling parirala ay nagpapanatili sa diwa ng walang hangganang tagal at sa pormang “mula…hanggang….”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa isang doksolohiya. Pinanatili ang pangalang Yahweh at ang dalawang ulit na “amen.”
