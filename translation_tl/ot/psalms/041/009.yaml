  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: tl
  text: Maging ang matalik kong kaibigan[a] na pinagtiwalaan ko, na kumakain ng tinapay ko[b]—itinaas niya ang kanyang sakong laban sa akin.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang tao ng aking kapayapaan,” isang idyoma para sa taong may mapayapa at mapagkakatiwalaang ugnayan sa akin—isang matalik na kaibigan o pinagkakatiwalaang kakampi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na nakikisalo sa tinapay ko.” Sa literal, “na kumakain ng tinapay ko,” na naglalarawan ng pakikisalo sa hapag at pagtitiwala.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “pinalaki niya ang sakong laban sa akin,” isang idyomang Hebreo na nagpapahiwatig ng pagtataksil o pagalit na pagkilos.
    reason: lexical_alternative
  - marker: d
    text: Sinipi ito sa Juan 13:18 kaugnay ng pagtataksil ni Judas kay Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Maging ang
  rationale: 'Nagpapahayag ng mariing pagdaragdag: hindi lamang ang ibang kaaway, kundi pati ang isang taong lubhang malapit sa salmista.'
- source_word: אִישׁ שְׁלוֹמִי
  choice: matalik kong kaibigan
  rationale: Ang literal na ‘tao ng aking kapayapaan’ ay idyoma para sa taong may mapayapa at mapagkakatiwalaang ugnayan sa nagsasalita; natural itong ipinahahayag sa Filipino bilang ‘matalik kong kaibigan.’
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: na pinagtiwalaan ko
  rationale: Ipinahahayag ang personal na pagtitiwala o pananalig na inilagak sa taong iyon.
- source_word: אוֹכֵל לַחְמִי
  choice: na kumakain ng tinapay ko
  rationale: Pinananatili ang kongkretong larawan ng pakikisalo at pagtitiwala; ang participle sa Hebreo ay isinasaad sa paraang likas sa Filipino.
- source_word: הִגְדִּיל ... עָקֵב
  choice: itinaas niya ang kanyang sakong
  rationale: Pinananatili ang matalinghagang larawan ng Hebreo sa halip na palitan ito ng abstraktong ‘pinagtaksilan ako.’
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa kontekstong ito, malinaw na pasalungat at mapanlaban ang diwa ng parirala.
theological_decisions:
- issue: Pagkakaugnay ng pananalita tungkol sa pagtataksil sa Juan 13:18
  choice: Isinalin ang talata ayon muna sa agarang konteksto ng salmo, nang hindi tahasang ginagawang mesiyanikong pahayag ang pangunahing teksto.
  alternative: Hubugin ang pangunahing teksto ayon sa tradisyonal na anyo ng sipi sa Bagong Tipan.
  rationale: Ang tekstong Hebreo ay unang tumutukoy sa pagtataksil sa salmista ng isang pinagkakatiwalaang kasamahan. Mahalaga ang paggamit nito sa Juan 13:18, ngunit mas angkop itong itala sa talababa kaysa ipasok bilang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Pinanatili ang kongkretong larawan ng tinapay at sakong upang huwag mapawi ang talinghaga at ang kaugnayan nito sa Juan 13:18.
