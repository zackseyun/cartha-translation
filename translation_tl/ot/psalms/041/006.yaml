translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matalinghagang “puso” at ang kondisyunal na daloy. Iniwasang gawing tahasang “lansangan” ang לַחוּץ at iniwan ang לוֹ na hindi labis na nililinaw, upang mapanatili ang tunay na kalabuan ng Hebreo.
