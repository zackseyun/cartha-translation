base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: tl
  text: At kung dumating siya upang makita ako[a], kasinungalingan ang sinasabi niya; ang puso niya ay nag-iipon ng kasamaan sa loob niya. Paglabas niya, nagsasalita siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “upang makita”; ipinahihiwatig ng konteksto ang layong “ako.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lalabas siya sa labas, nagsasalita siya.” Walang hayag na layon ang huling pandiwa; maaaring tumukoy ito sa kasamaan o kabulaanang naipon sa kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם בָּא
  choice: At kung pumaparito siya
  rationale: Pinananatili ng “At kung” ang pang-ugnay at pasubaling diwa; ang “pumaparito” ay likas na nagsasaad ng paglapit sa nagsasalita.
- source_word: לִרְאוֹת
  choice: upang makita ako
  rationale: Ang Hebreo ay literal na “upang makita”; ipinahihiwatig ng konteksto na ang salmista ang layon, kaya idinagdag ang “ako” para sa likas na Tagalog at minarkahan sa talababa.
- source_word: שָׁוְא יְדַבֵּר
  choice: kasinungalingan ang sinasabi niya
  rationale: Maaaring tumukoy ang שָׁוְא sa kabulaanan, pandaraya, o kawalang-kabuluhan. Sa konteksto ng mapagkunwaring pagdalaw at masamang pagsasalita, malinaw at natural ang “kasinungalingan.”
- source_word: לִבּוֹ יִקְבָּץ אָוֶן לוֹ
  choice: nag-iipon ang puso niya ng kasamaan para sa kanya
  rationale: Pinananatili ang “puso” bilang sentro ng isip at layunin, at ang larawang pag-iipon ng אָוֶן. Ang “para sa kanya” ay nagpapanatili sa malabong reperensiya ng לוֹ sa halip na tiyakang gawing reflexive ang puso.
- source_word: יֵצֵא לַחוּץ
  choice: Paglabas niya
  rationale: Tuwirang isinasalin ang paglabas; hindi ginagawang “sa lansangan” sapagkat ang Hebreo ay nagsasaad lamang ng pagpunta sa labas.
- source_word: יְדַבֵּר
  choice: ikinakalat niya iyon
  rationale: Sa huling sugnay, ang pagsasalita sa labas ay likas na nagpapahiwatig ng pagpapasa o pagkakalat ng naipong masamang bagay. Ginawang hayag ang ipinahihiwatig na layon na “iyon,” habang ipinapaliwanag sa talababa ang mas literal na anyo.
