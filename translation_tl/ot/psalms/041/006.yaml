  naturalness: Mas natural ang “dumating” kaysa “pumaparito” para sa isang kondisyunal na pagdalaw, at ang “sa loob niya” ay malinaw na Filipino para sa panloob na pag-iipon ng masama. Ang “nagsasalita siya” ay nananatiling natural sa konteksto nang hindi idinadagdag ang ideya ng pagpapakalat.
  terminology: Ang “kasinungalingan,” “puso,” at “kasamaan” ay angkop na modernong Filipino at sapat na sumasaklaw sa שָׁוְא at אָוֶן sa kontekstong ito. Pinanatili ang “puso” bilang mahalagang terminong Hebreo para sa panloob na pag-iisip at layunin.
