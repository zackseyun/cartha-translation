base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: tl
  text: Ngunit ako—sa aking katapatan[a]—ay inalalayan mo ako, at inilagay mo ako sa iyong harapan[b] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa aking katapatan” o “sa aking pagiging walang kapintasan.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa harap ng iyong mukha”; ibig sabihin, “nasa iyong presensiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ang pangatnig at tahasang panghalip ay naghahayag ng paghahambing o pagsalungat sa naunang konteksto; likas itong naihahayag ng “Ngunit ako.”
- source_word: בְּתֻמִּי
  choice: sa aking katapatan
  rationale: Ang תֹּם/תֻּם ay tumutukoy sa integridad, pagiging buo, o kawalang-kapintasan sa asal. Ipinapanatili ng “katapatan” ang moral na pahayag nang hindi ipinahihiwatig ang ganap na kawalan ng kasalanan; pinananatili rin ng “sa” ang posibleng instrumental o sanhiing diwa ng בְּ.
- source_word: תָּמַכְתָּ בִּי
  choice: inalalayan mo ako
  rationale: Ang תמך na may בְּ ay nangangahulugang sumuporta, humawak, o magpanatiling matatag. Ang “inalalayan” ay natural sa Filipino at naghahatid ng patuloy na pagsuporta.
- source_word: וַתַּצִּיבֵנִי
  choice: at inilagay mo ako
  rationale: Ang Hiphil ng נצב ay nangangahulugang maglagay, magpatayo, o magtatag. Ang “inilagay” ang pinakadirekta at hindi gaanong mapagpaliwanag na salin.
- source_word: לְפָנֶיךָ
  choice: sa iyong harapan
  rationale: Literal itong tumutukoy sa pagiging “sa harap ng iyong mukha,” isang Hebreong pahayag para sa pagiging nasa presensiya ng isang tao. Ang “sa iyong harapan” ay nagpapanatili ng larawan at natural sa Filipino.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinahihiwatig dito ng עוֹלָם ang walang hanggang tagal; ang “magpakailanman” ay natural at marangal sa pananalita ng mga Awit.
theological_decisions:
- issue: Ang kahulugan ng pahayag ng mang-aawit tungkol sa תֻּם
  choice: Tinutukoy ng talata ang katapatan o matuwid na pamumuhay ng mang-aawit, hindi ang ganap na kawalan ng kasalanan o sariling katuwirang nagkakamit ng pabor ng Diyos.
  alternative: Maaaring unawain ito bilang pag-aangkin ng lubos na kawalang-sala o bilang pagtuturo na natatamo ang pabor ng Diyos sa pamamagitan ng moral na kasakdalan.
  rationale: Ang salitang Hebreo ay maaaring tumukoy sa integridad o kawalang-kapintasan sa asal. Pinananatili ng “katapatan” ang tunay na moral na pahayag ng teksto nang hindi nilulutas o dinaragdagan ang teolohikong tensiyon nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang gitling na em ay nagpapalinaw sa contrastive topic na “Ngunit ako,” habang ang “sa iyong harapan” ay nagpapanatili ng kongkretong larawang Hebreo nang nananatiling madaling maunawaan.
