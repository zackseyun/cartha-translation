base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: tl
  text: Nawa'y padalhan ka niya ng tulong mula sa santuwaryo[b], at alalayan ka mula sa Sion[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “suportahan ka” o “patatagin ka” mula sa Sion.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kabanalan” o “mula sa banal na lugar”; malamang na tumutukoy rito sa santuwaryo ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Nawa'y padalhan ka niya
  rationale: Ang Qal imperfect na 3ms ay ginawang panalanging hangarin dahil sa konteksto ng pagpapala sa salmo, hindi payak na pahayag tungkol sa hinaharap.
- source_word: עֶזְרְךָ
  choice: ng tulong
  rationale: Ang עֵזֶר na may hulaping 2ms ay tulong para sa kausap; natural sa Filipino ang pariralang “padalhan ka ... ng tulong.”
- source_word: מִקֹּדֶשׁ
  choice: mula sa santuwaryo
  rationale: Bagaman maaaring tumukoy ang קֹדֶשׁ sa kabanalan o banal na lugar, ang lokatibong gamit na katapat ng “mula sa Sion” ay malamang na tumutukoy sa banal na tahanan ng Diyos.
- source_word: וּמִצִּיּוֹן
  choice: at ... mula sa Sion
  rationale: Pinananatili ang pangalang Sion at ang pang-ugnay na nagdurugtong sa magkatumbas na mga sugnay.
- source_word: יִסְעָדֶךָּ
  choice: alalayan ka
  rationale: Ang סעד ay maaaring mangahulugang alalayan, suportahan, o patatagin. Ang “alalayan” ay natural, marangal, at angkop sa tulang panalangin; gaya ng unang pandiwa, ipinahahayag ito bilang hangarin.
theological_decisions:
- issue: Tinutukoy ng di-hayag na simuno
  choice: Pinanatili ang panghalip na “niya,” na nauunawaang tumutukoy sa PANGINOON ayon sa konteksto.
  alternative: Tahasang idagdag ang “PANGINOON.”
  rationale: Walang tahasang simuno sa mismong taludtod sa Hebreo. Iniiwasang magdagdag ng banal na pangalan na wala rito habang pinananatili ang kontekstuwal na reperente.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Nawa’y” upang ihayag ang panalanging hangarin at ang “Sion” bilang karaniwang anyong Filipino ng pangalang Zion. Inilagay ang bawat talababa kaagad pagkatapos ng salitang tinutukoy nito.
