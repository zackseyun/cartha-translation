  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: tl
  text: Ipagkaloob nawa niya ang nais ng iyong puso, at tuparin ang lahat ng iyong balak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng iyong layunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: Ipagkaloob nawa niya
  rationale: Karaniwang nangangahulugang “magbigay” ang נתן, ngunit sa konteksto ng panalangin at pagpapala, likas na ipinahahayag ng “ipagkaloob nawa” ang hinihiling na pagkakaloob at ang jussive na puwersa ng yiqtol.
- source_word: לְךָ
  choice: ang nais ng iyong puso
  rationale: Hindi hiwalay na isinalin ang di-tuwirang layon na “sa iyo” sapagkat sa Filipino, likas nang nakapaloob sa “ipagkaloob ... ang nais ng iyong puso” kung sino ang tumatanggap; ang pagdaragdag ng “sa iyo” ay magiging mabigat at paulit-ulit.
- source_word: כִלְבָבֶךָ
  choice: ang nais ng iyong puso
  rationale: Inilalarawan nito sa natural na Filipino ang literal na “ayon sa iyong puso,” habang pinananatili ang “puso” bilang sagisag ng panloob na hangarin o layunin.
- source_word: וְכָל
  choice: at lahat ng
  rationale: Tuwirang katumbas ng pang-ugnay at ng כֹּל, at natural itong kaugnay ng pangngalang kolektibo na “balak.”
- source_word: עֲצָתְךָ
  choice: iyong balak
  rationale: Maaaring tumukoy ang עֵצָה sa payo, panukala, layunin, o plano. Sa konteksto ng panalangin para sa tagumpay ng hari, malinaw at natural ang “balak,” habang pinananatili sa talababa ang alternatibong “layunin.”
- source_word: יְמַלֵּא
  choice: tuparin
  rationale: Ang Piel ng מלא rito ay tumutukoy sa ganap na pagsasakatuparan. Ang “tuparin” ang pinakanatural na katumbas sa konteksto ng panalangin para magtagumpay ang mga balak.
theological_decisions:
- issue: Puwersa ng mga pandiwa sa konteksto ng pagpapala o panalangin
  choice: 'Isinalin bilang kahilingan: “Ipagkaloob nawa niya ... at tuparin ...”'
  alternative: 'Isalin bilang payak na hinaharap: “Ipagkakaloob niya ... at tutuparin ...”'
  rationale: Bagaman mga anyong yiqtol ang mga pandiwa, gumaganap ang mga ito bilang mga kahilingan sa sunod-sunod na panalangin ng Awit 20. Pinananatili ng “nawa” ang liturhikal at mapanalanging himig sa halip na gawing tiyak na hula ang talata.
- issue: Kahulugan ng “puso”
  choice: Pinanatili ang “puso” bilang luklukan ng hangarin at layunin
  alternative: Isalin lamang bilang “hangarin,” “isip,” o “kalooban”
  rationale: Ginagamit ng Hebreo ang “puso” para sa panloob na pagkatao, kabilang ang pagnanais at pagpapasya. Ang “nais ng iyong puso” ay natural sa Filipino at hindi nililimitahan ang larawan sa damdamin lamang.
translation_notes:
  register: Modernong Filipino na natural, marangal, at angkop sa panalangin. Ginamit ang “ipagkaloob nawa” upang mapanatili ang himig ng pagpapala, at ang “nais ng iyong puso” upang maging malinaw nang hindi inaalis ang biblikal na metapora ng puso. Inilagay ang talababa pagkatapos ng “balak,” ang salitang talagang tinutukoy ng alternatibo.
