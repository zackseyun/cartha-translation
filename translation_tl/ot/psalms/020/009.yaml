  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: tl
  text: O Yahweh, magligtas ka! Nawa’y sagutin kami ng hari sa araw ng pagtawag namin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “O Yahweh, iligtas mo ang hari! Sagutin mo kami sa araw ng pagtawag namin,” o marahil, “O Yahweh, magligtas ka! Sasagutin kami ng Hari sa araw ng pagtawag namin.” Masiksik ang pagkakabuo ng Hebreo at mahigit sa isang pagbasa ang maaaring iugnay sa “ang hari.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הוֹשִׁיעָה
  choice: iligtas mo kami!
  rationale: Ang pautos na anyo ng ישׁע ay isang tuwirang pagsusumamo. Likas sa Filipino ang paglalagay ng ipinahihiwatig na layon na “kami,” na malinaw mula sa konteksto ng panalanging pangmaramihan; saklaw ng “iligtas” ang pagliligtas at pagtatagumpay nang hindi labis na nililimitahan ang kahulugan.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Karaniwang pangngalan itong may pantukoy, kaya “ang hari” ang tuwirang katumbas. Hindi ginamitan ng malaking titik upang huwag paunang pagpasyahan kung ang tinutukoy ay ang Diyos o ang taong hari.
- source_word: יַעֲנֵנוּ
  choice: Sagutin nawa kami
  rationale: Maaaring magpahayag ang imperfect ng isang kahilingan o hangarin. Ang “nawa” ay likas at marangal na paraan upang mapanatili ang panalanging himig.
- source_word: בְיוֹם
  choice: sa araw
  rationale: Pinananatili ang temporal na idyomang Hebreo at ang makatang anyo, sa halip na gawing simpleng “kapag.”
- source_word: קָרְאֵנוּ
  choice: na tumawag kami
  rationale: Ang “tumawag” ang batayang kahulugan ng קרא at angkop sa pananalangin; hindi nito idinaragdag ang tinding ipinahihiwatig ng “dumaing.”
theological_decisions:
- issue: Ang kaugnayan at tinutukoy ng “ang hari” sa masiksik na sintaks ng Hebreo
  choice: Sa pangunahing teksto, ang hari ang simuno ng “sagutin nawa kami,” na maaaring tumukoy sa taong hari sa kontekstong maharlika ng salmo.
  alternative: 'Maaari ring hatiin ang pangungusap bilang “O Yahweh, iligtas mo ang hari! Sagutin mo kami sa araw na tumawag kami,” o unawain ang Hari bilang Diyos: “O Yahweh, iligtas mo kami! Sinasagot kami ng Hari sa araw na tumawag kami.”'
  rationale: Masiksik at tunay na malabo ang sintaks ng Hebreo. Ang pangunahing pagbasa ay nagpapatuloy sa temang maharlika ng salmo, ngunit hindi dapat alisin ang iba pang posibleng pagbasa; kaya inilalahad ang mga ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang mapanatili ang panalanging himig, at “sa araw na” upang maipakita ang makatang temporal na idyoma. Inilagay ang talababa sa dulo ng buong talata upang saklawin nito ang sintaktikong kalabuan ng pangungusap.
