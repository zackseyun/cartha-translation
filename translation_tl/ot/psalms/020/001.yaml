  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: tl
  text: Sagutin ka nawa ni Yahweh sa araw ng kagipitan; ilagay ka nawa ng pangalan ng Diyos ni Jacob sa isang mataas at ligtas na lugar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ingatan ka.” Ang pandiwang Hebreo ay naglalarawan ng paglalagay sa isang mataas at di-maabot na lugar, kaya ligtas sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: Sagutin ka nawa
  rationale: Ang pandiwang ענה ay nangangahulugang “sumagot” o “tumugon.” Ipinahahayag ng “nawa” ang diwang panalangin o paghiling ng anyong pandiwa sa kontekstong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּיוֹם צָרָה
  choice: sa araw ng kagipitan
  rationale: Pinananatili nito ang temporal na larawan ng Hebreong parirala, habang likas na ipinahahayag sa Filipino ang panahon ng matinding pangangailangan o panganib.
- source_word: יְשַׂגֶּבְךָ
  choice: ilagay ka nawa sa ligtas na kaitaasan
  rationale: Ang Piel ng שׂגב ay naglalarawan ng paglalagay sa isang mataas at di-maabot na lugar, kaya ipinahihiwatig ang pag-iingat sa panganib. Pinananatili ng salin ang kongkretong talinghaga sa halip na paikliin lamang bilang “ingatan.”
- source_word: שֵׁם
  choice: pangalan
  rationale: Bagaman maaaring magpahiwatig ng reputasyon, kapangyarihan, o presensiya, mahalaga sa tula at teolohiya ang tahasang “pangalan,” kaya pinananatili ito.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Diyos ni Jacob
  rationale: Likas itong katumbas sa Filipino ng Hebreong construct phrase at pinananatili ang makasaysayan at tipanang ugnayan kay Jacob.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na maghalili ng titulo.
- issue: Lakas ng mga anyong pandiwa sa konteksto ng pagpapala o panalangin
  choice: Paghiling na ipinahahayag sa “nawa”
  alternative: 'Payak na panghinaharap: “Sasagutin ka ... iingatan ka”'
  rationale: Sa liturhikal na konteksto ng salmo, mas malamang na mga kahilingan o pagpapala ang mga imperfect form kaysa tahasang mga prediksiyon.
- issue: Proteksiyon sa pamamagitan ng “pangalan” ng Diyos
  choice: Pinanatiling simuno ang “pangalan ng Diyos ni Jacob”
  alternative: 'Gawing tuwirang simuno ang Diyos: “ingatan ka ng Diyos ni Jacob”'
  rationale: Pinananatili nito ang makabuluhang personipikasyon at teolohikal na diin ng Hebreo nang hindi ipinapaliwanag o nilulutas ang saklaw ng “pangalan.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kagipitan” upang ihatid ang צָרָה nang natural, at pinanatili ang kongkretong larawan ng mataas at ligtas na lugar. Ang ayos na “ng pangalan ng Diyos ni Jacob” ay bahagyang mataas ang rehistro ngunit malinaw at tumutugma sa patulang paralelismo.
