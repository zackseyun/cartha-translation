  source_fidelity: Kailangan ng maliit ngunit makabuluhang paglilinaw sa בִּישׁוּעָתֶךָ. Ang “dahil sa pagliligtas mo” ay maaaring mangahulugang pagliligtas na ikaw ang gumawa, samantalang ang panlaping “mo” sa Hebreo ay tumutukoy sa pagliligtas/tagumpay na nauukol sa kausap. Ang “sa iyong pagliligtas” ay mas malapit sa Hebreo at pinananatili ang malawak na saklaw nito.
  naturalness: Natural at angkop sa modernong Filipino ang “Magbubunyi kami sa iyong pagliligtas.” Ang “magsisigawan kami sa galak” ay maiintindihan, ngunit ang “magbubunyi” ay mas marangal at mas likas para sa makatang panalanging ito, nang hindi ipinipilit na pag-awit ang tinutukoy.
  terminology: Ang “Yahweh,” “Diyos,” “watawat,” at “kahilingan” ay pare-pareho, malinaw, at angkop. Pinananatili ng “watawat” ang kongkretong larawan ng Hebreong pandiwa.
