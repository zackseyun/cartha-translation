base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: tl
  text: Magbubunyi kami sa iyong pagliligtas[a], at sa pangalan ng aming Diyos ay itataas namin ang aming mga watawat[b]. Nawa'y tuparin ni Yahweh ang lahat ng kahilingan mo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong tagumpay” o “sa pagliligtas sa iyo.” Maaaring tumukoy ang salitang Hebreo sa kaligtasan, pagliligtas, o tagumpay, kabilang ang tagumpay sa digmaan.
    reason: lexical_alternative
  - marker: b
    text: O “itataas namin ang aming watawat” o “iwawagayway namin ang mga watawat.” Malamang na inilalarawan ng pandiwang Hebreo ang pagtataas o pagpapakita ng watawat sa pagdiriwang.
    reason: lexical_alternative
  - marker: c
    text: O “Tutuparin ni Yahweh ang lahat ng kahilingan mo.” Maaaring unawain ang anyong Hebreo bilang isang panalangin o bilang pahayag sa hinaharap, bagaman mas angkop sa konteksto ang diwang panalangin.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: Magsisigawan kami sa galak
  rationale: Ang pandiwa ay nagpapahayag ng malakas at masayang pagbubunyi; hindi nito kinakailangang tukuyin ang pag-awit.
- source_word: בִּישׁוּעָתֶךָ
  choice: dahil sa pagliligtas mo
  rationale: Saklaw ng יְשׁוּעָה ang pagliligtas, kaligtasan, at tagumpay. Natural sa Filipino ang 'dahil sa' para sa dahilan ng pagbubunyi, habang pinananatili ng 'pagliligtas' ang malawak na diwa.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: at sa pangalan ng aming Diyos
  rationale: Pinananatili nito ang idyoma ng pagkilos at pagbubunyi sa ilalim ng pagkakakilanlan at kapangyarihan ng Diyos.
- source_word: נִדְגֹּל
  choice: itataas namin ang aming mga watawat
  rationale: Malamang na tumutukoy ang pandiwa sa pagtataas o pagpapakita ng watawat bilang tanda ng masayang tagumpay.
- source_word: יְמַלֵּא
  choice: Nawa'y tuparin
  rationale: 'Bagaman anyong imperfect, pinakaangkop sa konteksto ang puwersang jussive: isang panalangin o hangarin, hindi lamang payak na prediksiyon.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang יהוה sa halip na palitan ng isang titulo.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: ang lahat ng kahilingan mo
  rationale: Malinaw at natural na tumutukoy sa lahat ng bagay na hinihiling ng kausap.
theological_decisions:
- issue: Diwa ng יְשׁוּעָה sa isang salmong maharlika at pandigmaan
  choice: pagliligtas
  alternative: tagumpay; kaligtasan
  rationale: Malinaw na posible ang 'tagumpay' sa agarang konteksto, ngunit hindi dapat paliitin ang mas malawak na saklaw ng salitang Hebreo. Ang 'pagliligtas' ay likas sa konteksto at hindi naglilimita rito sa tagumpay sa digmaan lamang.
- issue: Puwersa ng pangwakas na imperfect na יְמַלֵּא
  choice: 'panalanging hangarin: “Nawa’y tuparin”'
  alternative: 'pahayag sa hinaharap: “Tutuparin”'
  rationale: Mas bumabagay sa liturhikal at mapanalanging konteksto ang basbas o kahilingan, ngunit tunay na posible rin sa anyong Hebreo ang pagbasa bilang pahayag sa hinaharap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'watawat' para sa kongkretong larawang pandigmaan at pagdiriwang; iniwasan ang sobrang pormal na 'mga petisyon.' Inayos ang mga pananda ng talababa ayon sa mismong pariralang tinutukoy.
