lexical_decisions:
- source_word: יִזְכֹּר
  choice: Alalahanin niya
  rationale: Ang Qal imperfect na 3ms ay gumaganap dito bilang kahilingan o hangarin sa konteksto ng panalangin; likas sa Filipino ang “Alalahanin niya” bilang pormulang pagpapala.
- source_word: כָּל
  choice: lahat ng
  rationale: Pinananatili nito ang saklaw ng Hebreong pantukoy nang walang dagdag na pagpapakahulugan.
- source_word: מִנְחֹתֶךָ
  choice: iyong mga handog
  rationale: Maaaring tumukoy ang מִנְחָה sa handog sa pangkalahatan o, sa teknikal na gamit, sa handog na butil. Ang malawak na salin sa pangunahing teksto ay nagpapanatili sa leksikal na posibilidad; nasa talababa ang mas tiyak na kahulugan.
- source_word: וְעוֹלָתְךָ
  choice: at ang iyong handog na sinusunog
  rationale: Ang עוֹלָה ay karaniwang terminong pangkulto para sa handog na sinusunog nang buo. Ang pariralang ito ay malinaw at dignified sa modernong Filipino.
- source_word: יְדַשְּׁנֶה
  choice: tanggapin niya
  rationale: Ang Piel ng דשן ay literal na may kaugnayan sa pagiging mataba o sagana, ngunit sa konteksto ng paghahandog ay idyoma para sa kanais-nais na pagtanggap sa hain. Inilalagay sa talababa ang literal na larawan.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinananatili ang tradisyonal na transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan o tungkulin ng salita.
theological_decisions:
- issue: Ang tinutukoy ng mga pandiwang nasa ikatlong panauhang panlalaki
  choice: Ang ipinahihiwatig na simuno ay ang Diyos, ngunit “niya” lamang ang ginamit sa talata.
  alternative: Iwanang lubos na di-binanggit ang simuno.
  rationale: Sa konteksto ng Awit 20, hinihiling ng bayan ang pagpapala ng Diyos para sa hari. Walang tahasang simuno sa Hebreo, kaya pinananatili ng panghalip ang kontekstuwal na pagtukoy nang hindi isiningit ang pangalang wala sa talata.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “handog na sinusunog” bilang malinaw na terminong pangsakripisyo; pinanatili ang “Selah” dahil hindi tiyak ang kahulugan nito. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
