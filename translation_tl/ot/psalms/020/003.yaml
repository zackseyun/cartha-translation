  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: tl
  text: Nawa’y alalahanin niya ang lahat ng iyong mga handog[a], at tanggapin niya[b] ang iyong handog na sinusunog nang buo. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog na butil.” Ang Hebreong minḥah ay maaaring tumukoy sa isang handog o kaloob sa pangkalahatan, o partikular sa handog na butil.
    reason: lexical_alternative
