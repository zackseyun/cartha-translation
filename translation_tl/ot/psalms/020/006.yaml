  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: tl
  text: Ngayon ay alam ko na inililigtas ng PANGINOON ang kanyang pinahiran; sinasagot niya siya mula sa kanyang banal na langit sa pamamagitan ng makapangyarihang mga gawa ng pagliligtas ng kanyang kanang kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tuwirang isinasalin ang tahasang panandang temporal sa Hebreo.
- source_word: הוֹשִׁיעַ
  choice: inililigtas
  rationale: Ang anyong perfect ay nagpapahayag dito ng tiyak na pagkilos ng Diyos; ang pangkasalukuyang Filipino ay likas na naghahatid ng matatag na katiyakang inilalarawan sa konteksto.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Gumagamit ng kinaugaliang salin sa Filipino para sa banal na pangalan, na ipinakikita sa malalaking titik upang maiba sa karaniwang titulong 'Panginoon'.
- source_word: מְשִׁיחוֹ
  choice: ang kanyang pinahiran
  rationale: Pinananatili ang literal at kontekstuwal na kahulugan ng hari na itinalaga sa pamamagitan ng pagpapahid, nang hindi agad ginagawang natatanging titulo.
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: mula sa kanyang banal na langit
  rationale: Ang maramihang Hebreong 'mga langit' ay likas na idyomatikong isinasalin bilang 'langit' sa Filipino.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: sa pamamagitan ng makapangyarihang mga gawa ng pagliligtas ng kanyang kanang kamay
  rationale: Pinananatili ang maramihang diwa ng גבורות bilang makapangyarihang mga gawa at ang larawang 'kanang kamay' bilang sagisag ng kapangyarihang nagliligtas.
theological_decisions:
- issue: Pagkakakilanlan ng מְשִׁיחוֹ
  choice: kanyang pinahiran
  alternative: kanyang Mesiyas
  rationale: Sa agarang konteksto ng awit, tumutukoy ito sa pinahirang hari; pinananatili ng salin ang lawak ng termino at hindi ipinipilit ang isang mas espesipikong kristolohikal na titulo.
- issue: Aspekto ng הוֹשִׁיעַ
  choice: inililigtas
  alternative: iniligtas / ililigtas
  rationale: Ang pahayag ay isang katiyakan sa pagliligtas ng PANGINOON. Ang 'inililigtas' ay natural sa Filipino at hindi nililimitahan ang pagkilos sa isang natapos na pangyayari lamang o sa hinaharap lamang.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo at mga pangunahing larawan ng Hebreo, lalo na ang 'pinahiran,' 'banal na langit,' at 'kanang kamay.'
