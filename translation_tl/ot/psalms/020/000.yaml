  text: For the choirmaster. A psalm of David[a].
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika. Salmo ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay David.” Maaaring ipahiwatig ng pamagat sa Hebreo na si David ang kumatha nito, na nauugnay ito sa kaniya, o na inihandog ito para sa kaniya.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa musikal na pagtatanghal. Likas at malinaw sa modernong Filipino ang pariralang ito nang hindi ipinapalagay na koro lamang ang pinamumunuan.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Ito ang kinikilalang katawagan sa ganitong uri ng awiting panrelihiyon at angkop sa konteksto ng Aklat ng mga Salmo.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ito ang pinakamaikli at pinakanatural na anyo sa isang pamagat sa Filipino. Hindi nito ganap na nilulutas kung si David ang may-akda, kung nauugnay ito sa kaniya, o kung inihandog ito para sa kaniya; nililinaw sa talababa ang saklaw ng Hebreo.
theological_decisions:
- issue: Kahulugan ng Davidikong pamagat
  choice: ni David
  alternative: para kay David
  rationale: Maaaring ipahiwatig ng Hebreong לְ ang pagkakatha, kaugnayan, pag-aari, o paghahandog. Pinananatili sa teksto ang likas na anyong Filipino at inilalahad sa talababa ang tunay na kalabuan sa pinagmulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tagapangasiwa ng musika” sa halip na “tagapamahala ng koro” upang hindi paliitin ang tungkulin sa pamamahala lamang ng isang koro. Inilagay ang [a] kaagad pagkatapos ng “David,” na siyang tinatalakay ng talababa.
