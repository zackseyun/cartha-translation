  text: אֵ֣לֶּה בָ֭/רֶכֶב וְ/אֵ֣לֶּה בַ/סּוּסִ֑ים וַ/אֲנַ֓חְנוּ בְּ/שֵׁם יְהוָ֖ה אֱלֹהֵ֣י/נוּ נַזְכִּֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/007.yaml
  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: tl
  text: Ang iba ay nagtitiwala sa mga karwahe at ang iba naman sa mga kabayo, ngunit kami ay tumatawag sa pangalan ni Yahweh na aming Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binabanggit” o “inaalaala namin ang pangalan ni Yahweh.”
    reason: May lawak ng kahulugan ang Hebreong pandiwang נזכיר; maaari itong tumukoy sa pagbanggit, pag-alaala, o pagtawag sa pangalan.
lexical_decisions:
- source_word: בָרֶכֶב ... בַסּוּסִים
  choice: nagtitiwala sa mga karwahe ... sa mga kabayo
  rationale: Walang tahasang pandiwa sa unang dalawang sugnay. Idinagdag ang “nagtitiwala” ayon sa paghahambing ng mga sandatang inaasahan ng iba sa pagtawag ng Israel sa pangalan ng Diyos.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Pinananatili ang pang-ukol na “sa” at isinasalin ang banal na pangalang יהוה bilang “Yahweh,” hindi bilang isang titulo.
- source_word: נַזְכִּיר
  choice: tumatawag
  rationale: Ang Hiphil ng זכר ay maaaring mangahulugang bumanggit o magpaalaala; sa pariralang may pangalan ni Yahweh, natural nitong ipinahihiwatig ang pagtawag o pagdalangin sa kanyang pangalan.
theological_decisions:
- issue: 'Batayan ng pagtitiwala: lakas-militar o pangalan ng Diyos'
  choice: Inihambing ang pagtitiwala sa mga karwahe at kabayo sa pagtawag sa pangalan ni Yahweh.
  alternative: “Ipinagmamalaki namin ang pangalan ni Yahweh” o “aalalahanin namin ang pangalan ni Yahweh.”
  rationale: Hindi ginawang tahasang “pagyayabang” ang נזכיר. Pinili ang “tumatawag” dahil ang pagbanggit sa banal na pangalan sa kontekstong ito ay pagkilala at paghingi ng tulong sa Diyos, habang itinatala sa talababa ang saklaw ng pandiwa.
translation_notes:
  register: Makabago at dignidad na Filipino. Ginamit ang payak na “karwahe” at “kabayo,” at pinanatili ang pangalang “Yahweh.”
