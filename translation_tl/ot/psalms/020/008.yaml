  source_fidelity: 'Ang pangunahing diwa at paghahambing ay wastong naihahatid: ang “sila” ay bumagsak samantalang ang “kami” ay bumangon. Gayunman, ang “nangayupapa” ay may mas malakas na diwa ng pagyukod nang lubos o pagpapakumbaba at hindi pinakasimple o pinakalikas na katumbas ng כָּרְעוּ sa paralelismong ito. Ang “lumuhod” ay mas tuwiran para sa pisikal na pagluhod/pagkakabuwal. Ang huling pandiwa ay bihira at may saklaw na pagtindig, pagpapanumbalik, o pagpapatatag; dapat panatilihin ng pangunahing teksto ang imahen ng pagtindig at ng talababa ang mga leksikal na posibilidad.'
  naturalness: Mas natural sa makabagong Filipino ang “Sila’y lumuhod at nabuwal, ngunit kami’y bumangon at tumayong tuwid.” Patula ngunit malinaw ang daloy nito at naiiwasan ang mas markado at bahagyang di-karaniwang “nangayupapa.”
  terminology: Walang problemang teolohikal o pangalang pantangi. Ang “tumayong tuwid” ay tumutugma sa imaheng pisikal ng Ingles na audit trail na “stand upright,” samantalang ang talababa ay nagpapanatili ng mga alternatibong diwa ng pagpapatatag o pagbawi ng lakas nang hindi pumipili ng isang makitid na pakahulugan.
