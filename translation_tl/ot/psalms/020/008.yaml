  register: Makabago ngunit marangal na Filipino, na may banayad na himig patula. Ginamit ang “nangayupapa” upang mapanatili ang pisikal na larawan ng pagyuko o pagluhod, at ang “tumayong matatag” upang ihatid ang malawak na diwa ng pambihirang huling pandiwang Hebreo. Nasa pangunahing teksto ang panandang talababa [a].
