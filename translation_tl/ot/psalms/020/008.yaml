  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: tl
  text: 'Sila’y lumuhod at nabuwal,

    ngunit kami’y bumangon at tumayong tuwid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napatatag,” “nanumbalik ang lakas,” o “tumayong matatag” para sa huling pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Sila
  rationale: Pinananatili ang tahasang paghahambing sa kasunod na “kami” nang hindi labis na isinasalin ang diin ng hiwalay na panghalip.
- source_word: כָּרְעוּ
  choice: nangayupapa
  rationale: Ipinahahayag ang pisikal na pagyuko o pagluhod at mahusay na kaagapay ng “nabuwal” sa paralelismong patula.
- source_word: וְנָפָלוּ
  choice: at nabuwal
  rationale: Tuwirang inilalarawan ang pagbagsak at pinananatili ang payak na pagkakaugnay ng dalawang pandiwa.
- source_word: וַאֲנַחְנוּ
  choice: ngunit kami
  rationale: Bagaman maaaring literal na “at kami,” malinaw na pasalungat ang ugnayan sa sinapit nila, kaya natural sa Filipino ang “ngunit.”
- source_word: קַּמְנוּ
  choice: bumangon
  rationale: Pinananatili ang malinaw na kabaligtaran ng kanilang pagbuwal at ang kilos ng muling pagtayo.
- source_word: וַנִּתְעוֹדָד
  choice: at tumayong matatag
  rationale: Inihahatid ang diwa ng muling pagtindig, pagpapatatag, o pagtayong tuwid; ang “matatag” ay nagpapakita ng naibalik na katatagan nang hindi nilulutas nang labis ang saklaw ng pambihirang pandiwa.
