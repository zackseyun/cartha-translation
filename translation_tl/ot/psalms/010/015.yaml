  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: tl
  text: Baliin mo ang bisig ng taong balakyot at masama[a]; hanapin mo ang kanyang kasamaan hanggang wala ka nang matagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Baliin mo ang bisig ng masama at ng gumagawa ng kasamaan.” Pinahihintulutan ng Hebreo na basahin ang ikalawang paglalarawan bilang hiwalay na katawagan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: Baliin mo
  rationale: Tuwirang pautos at pakiusap sa Diyos; pinananatili ang matinding puwersa ng pandiwang שבר nang hindi dinaragdagan ang larawan.
- source_word: זְרוֹעַ
  choice: bisig
  rationale: Pinananatili ang kongkretong larawang Hebreo ng bisig bilang sagisag ng lakas o kapangyarihang manakit.
- source_word: רָשָׁע
  choice: taong balakyot
  rationale: Isang pang-uring ginamit bilang pangngalan para sa masamang tao; malinaw at marangal sa makabagong Tagalog.
- source_word: וָרָע
  choice: at masama
  rationale: Pinananatili bilang ikalawang paglalarawan sa tao, habang inilalagay sa talababa ang posibleng pagbasa rito bilang hiwalay na ‘gumagawa ng kasamaan.’
- source_word: תִּדְרוֹשׁ
  choice: hanapin mo
  rationale: Tuwirang inilalarawan ang masusing paghahanap o pag-usisa na ipinahihiwatig ng דרש, at pinananatili ang sadyang tensiyon ng kasunod na sugnay.
- source_word: רִשְׁעוֹ
  choice: ang kanyang kasamaan
  rationale: Tumutugma sa leksikal na ugat at hindi nililimitahan ang kahulugan sa legal na pagkakasala lamang.
- source_word: בַל תִּמְצָא
  choice: hanggang wala ka nang matagpuan
  rationale: Pinananatili ang inaasam na kinalabasan ng paghahanap ng Diyos—na wala nang kasamaan na matatagpuan—nang hindi tahasang ipinapaliwanag kung paano ito mawawala.
theological_decisions:
- issue: Ang metapora ng ‘bisig’ ng taong balakyot
  choice: Panatilihin ang kongkretong larawang ‘bisig’
  alternative: Isalin bilang ‘lakas’ o ‘kapangyarihan’
  rationale: Ang larawan ay humihiling na alisin ng Diyos ang kakayahan ng mapang-api na gumawa ng pinsala; hindi kailangang palitan ng abstraktong paliwanag ang tula.
- issue: Ang ugnayan ng רָשָׁע at וָרָע
  choice: Ituring na magkaugnay na paglalarawan sa isang taong balakyot at masama
  alternative: 'Ituring bilang dalawang katawagan: ‘ang masama at ang gumagawa ng kasamaan’'
  rationale: Parehong posible sa Hebreo. Ang pangunahing salin ay natural sa Tagalog, at itinatala sa talababa ang mas literal na paralelismong maaaring tumukoy sa dalawang katawagan.
- issue: Ang kahulugan ng pangwakas na בַל תִּמְצָא
  choice: ‘hanggang wala ka nang matagpuan’
  alternative: ‘upang wala kang matagpuan’ o ‘at hindi mo na ito matatagpuan’
  rationale: Pinananatili nito ang layunin ng panalangin na lubusang harapin ng Diyos ang kasamaan hanggang wala nang natitira, ngunit hindi ipinapasok sa teksto ang isang tiyak na paliwanag hinggil sa paglipol o kaparusahan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang matapang na larawang ‘baliin ang bisig’ at ang sadyang di-tiyak na lohika ng paghahanap hanggang wala nang matagpuan; iniwasan ang labis na legal o denominasyonal na pagpapakahulugan.
