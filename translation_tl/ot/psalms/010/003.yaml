  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: tl
  text: Sapagkat ipinagmamalaki ng masama ang sarili niyang pagnanasa; pinagpapala ng sakim ang kanyang sarili[a] at hinahamak ang PANGINOON.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang sakim ay nagpapala ngunit hinahamak ang PANGINOON.” Hindi tahasang binabanggit sa Hebreo ang layon ng “pinagpapala,” at pinagtatalunan ang eksaktong ugnayan ng mga pandiwa sa sugnay na ito.
    reason: Ipinahihiwatig ng pangunahing salin ang posibleng reflexive na pagbasa nang hindi itinatanggi ang sintaktikong ambigwidad ng Hebreo.
lexical_decisions:
- source_word: הִלֵּל
  choice: ipinagmamalaki
  rationale: Ipinahahayag ang diwang reflexive/pronominal ng pagyayabang ng masama tungkol sa sarili niyang pagnanasa.
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: ang pagnanasa ng kanyang puso
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa panloob na sarili; mas likas sa modernong Tagalog ang 'puso' sa kontekstong ito kaysa literal na 'kaluluwa'.
- source_word: בֹצֵעַ
  choice: sakim
  rationale: Sa konteksto, tumutukoy sa taong ganid sa pakinabang o mapang-angkin; pinananatiling maikli at tuwiran ang paglalarawan.
- source_word: בֵּרֵךְ
  choice: pinagpapala ... ang kanyang sarili
  rationale: Bagaman maaaring literal na 'nagpapala,' ang reflexive na pagbasa ay angkop sa sintaks at sa magkatulad na kilos ng pagmamapuri sa unang sugnay.
- source_word: נִאֵץ
  choice: hinahamak
  rationale: Ipinapakita ang matinding paglapastangan o paghamak, hindi lamang simpleng hindi paggalang.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong maliit na kapital bilang representasyon ng banal na pangalang YHWH sa saling Tagalog.
theological_decisions:
- issue: Ugnayan ng בֵּרֵךְ at נִאֵץ
  choice: 'Dalawang magkaugnay na kilos ng sakim: pinagpapala niya ang sarili at hinahamak ang PANGINOON.'
  alternative: Maaaring unawain ang בֵּרֵךְ sa eupemistikong diwang 'sumpain,' o ang parirala bilang 'ang sakim ay nagpapala ngunit humahamak sa PANGINOON.'
  rationale: Pinananatili ng napiling salin ang karaniwang positibong kahulugan ng בֵּרֵךְ at ang posibleng reflexive na gamit nito, kasuwato ng parallelism sa pagmamapuri ng masama, nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Gumamit ng 'Sapagkat' para sa כִּי at semicolon upang malinaw na maipakita ang magkatulad na mga sugnay. Walang footnote marker dahil walang inilakip na footnote.
