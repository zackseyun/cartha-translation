  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: tl
  text: Nakaupo siyang nakaabang sa mga nayon[a]; sa mga taguang lugar ay pinapaslang niya ang walang sala. Ang kanyang mga mata ay palihim na nagmamatyag sa walang kalaban-laban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga nayon” ay maaari ring isaling “mga pamayanan” o, bagaman hindi gaanong malamang dito, “mga looban.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang idyomang Hebreo sa huling pangungusap. Mas literal na may kaugnayan sa pagtatago o pag-aabang ang pandiwa, ngunit dahil “mga mata” ang paksa, ipinahihiwatig nito ang palihim na pagmamatyag sa isang madaling biktimahin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב בְּמַאְרַב
  choice: Nakaupo siyang nakaabang
  rationale: Pinananatili ng “nakaupo” ang kongkretong larawan ng pandiwa, habang malinaw na ipinahahayag ng “nakaabang” ang mapanlinlang at marahas na diwa ng pananambang.
- source_word: חֲצֵרִים
  choice: sa mga nayon
  rationale: Sa kontekstong ito, malamang na tumutukoy ang salita sa maliliit na nayon o pamayanan. Pinananatili ng “sa” ang lokasyong ipinahihiwatig ng pang-ukol sa Hebreo nang hindi dinaragdagan ng ideyang “malapit sa.”
- source_word: בַּמִּסְתָּרִים
  choice: sa mga taguang lugar
  rationale: Pinananatili nito ang kongkreto at maramihang larawan ng mga lihim o nakatagong pook.
- source_word: יַהֲרֹג נָקִי
  choice: pinapaslang niya ang walang sala
  rationale: Ang “pinapaslang” ay likas at marangal na salitang Filipino para sa sinasadyang marahas na pagpatay, at ang “walang sala” ay tumpak na nagpapahayag sa taong hindi nagkasala.
- source_word: עֵינָיו
  choice: Ang kanyang mga mata
  rationale: Pinananatili ang matingkad na larawan ng orihinal sa halip na gawing simpleng “siya.”
- source_word: לְחֵלְכָה
  choice: sa walang kalaban-laban
  rationale: Mahirap tiyakin ang eksaktong saklaw ng salita, ngunit sa konteksto ay tumutukoy ito sa mahina, kaawa-awa, o madaling biktimahin. Ang “walang kalaban-laban” ay natural at malinaw nang hindi nililimitahan ito sa kahirapan lamang.
- source_word: יִצְפֹּנוּ
  choice: palihim na nagmamatyag
  rationale: Ang anyo ay kaugnay ng pagtatago o pagkukubli, ngunit dahil mga mata ang paksa, ang diwa ay palihim na pagbabantay o pagmamatyag sa isang biktima. Pinananatili sa talababa ang leksikal na hirap.
