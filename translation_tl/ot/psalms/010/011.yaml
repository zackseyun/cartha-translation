  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: tl
  text: Sinasabi niya sa kanyang puso[a], “Nakalimot ang Diyos; itinago niya ang kanyang mukha; hindi siya makakakita kailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sinabi niya sa kanyang puso, ‘Nakakalimot ang Diyos; itinatago niya ang kanyang mukha; hindi siya makakakita magpakailanman.’” Sa tulang Hebreo, ang mga pandiwang nasa anyong ganap ay maaaring unawain bilang kasalukuyan, nakaraan, o naganap na may bisa pa sa kasalukuyan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Sinasabi niya
  rationale: Ang Qal perfect sa tulang Hebreo ay maaaring maglarawan ng kasalukuyan o paulit-ulit na panloob na pananalita. Ang aspektong kasalukuyan ay akma sa nagpapatuloy na paglalarawan sa masama.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Pinananatili ang konkretong idyomang Hebreo para sa lihim o panloob na pag-iisip; nauunawaan din ito sa makabagong Filipino.
- source_word: שָׁכַח
  choice: Nakalimot
  rationale: Ang salitang Hebreo ay tuwirang nangangahulugang “lumimot.” Ipinahihiwatig ng anyong ganap na iniisip ng masama na hindi na papansinin o kikilos ang Diyos.
- source_word: אֵל
  choice: ang Diyos
  rationale: Karaniwang pangngalang pantukoy sa Diyos sa kontekstong ito; hindi kailangang dagdagan ng interpretatibong katawagan.
- source_word: הִסְתִּיר פָּנָיו
  choice: ikinubli niya ang kanyang mukha
  rationale: Pinananatili ang antropomorpikong larawan ng Hebreo sa halip na paliitin ito sa “hindi pumapansin” o “tumalikod.”
- source_word: בַּל ... לָנֶצַח
  choice: hindi ... kailanman
  rationale: 'Ang negasyon kasama ng lamed plus נֶצַח ay nagpapahayag ng nagpapatuloy at ganap na pagkakait: “hindi kailanman.”'
- source_word: רָאָה
  choice: makikita
  rationale: Pinananatili ang pangunahing diwang “makakita,” habang hinahayaan ang konteksto na ipahiwatig ang pagpansin at paghatol. Ang “ito” ay likas na layong ipinahihiwatig ng Filipino ngunit hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pagkukubli ng Diyos ng kanyang mukha
  choice: Panatilihin ang “ikinubli niya ang kanyang mukha” sa pangunahing teksto
  alternative: “tumalikod siya” o “hindi na siya pumapansin”
  rationale: Konkretong larawan ang gamit ng Hebreo. Ang pagpapanatili nito ay nag-iingat sa teolohikal at makatang bisa ng talata nang hindi ipinipirmi ang kahulugan sa iisang paliwanag.
- issue: Panahon o aspekto ng mga pandiwa sa tulang Hebreo
  choice: Kasalukuyan sa pambungad at aspektong ganap sa siniping kaisipan
  alternative: Lahat ay isalin sa nakaraan o sa pangkalahatang kasalukuyan
  rationale: Pinahihintulutan ng mga perfect verb sa tulang Hebreo ang higit sa isang temporal na pagbasa. Ang pangunahing salin ay nagpapakita ng nagpapatuloy na pag-iisip ng masama at ng inaakala niyang naganap nang paglimot at pagkukubli ng Diyos, habang inilalahad sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino, na pinananatili ang biblikal na larawang “sa kanyang puso” at “ikinubli ang kanyang mukha.” Ginamit ang “kailanman” para sa likas at malinaw na pagpapahayag ng בַּל ... לָנֶצַח.
