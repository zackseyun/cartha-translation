base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: tl
  text: Laging nagtatagumpay ang kanyang mga lakad[a]; napakataas ang mga hatol mo, hindi niya abot-tanaw ang mga ito. Sinisinghalan niya ang lahat ng kanyang mga kaaway[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Laging matatag ang kanyang mga lakad.” Mahirap tiyakin ang pandiwang Hebreo at iniuugnay rin ito sa diwa ng pamimilipit o pagdaramdam, ngunit mas angkop sa konteksto ang patuloy na tagumpay o kapanatagan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hinihipan” o “sinisinghalan niya sila”—isang matingkad na larawan ng paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: nagtatagumpay
  rationale: Mahirap tiyakin ang diwa ng pandiwa rito. Sa konteksto ng hinaing tungkol sa tila tuloy-tuloy na tagumpay at kapanatagan ng masama, ang “nagtatagumpay” ang pinakamalinaw na pangunahing salin, habang inilalahad sa talababa ang tunay na leksikal na pag-aalinlangan.
- source_word: דְּרָכָיו
  choice: kanyang mga lakad
  rationale: Pinananatili nito ang Hebreong talinghaga para sa takbo ng buhay, asal, at mga gawain ng isang tao, at likas itong pakinggan sa marangal na Filipino.
- source_word: בְּכָל־עֵת
  choice: Laging
  rationale: Likas at tuwirang ipinahahayag nito ang patuloy na kalagayang tinutukoy ng pariralang Hebreo.
- source_word: מָרוֹם
  choice: napakataas
  rationale: Pinananatili ang larawang pangkalawakan ng mga hatol ng Diyos na nasa itaas at hindi naaabot ng pananaw o pagsasaalang-alang ng masama.
- source_word: מִשְׁפָּטֶיךָ
  choice: mga hatol mo
  rationale: Maaaring tumukoy ang salita sa mga pasiya o gawa ng Diyos bilang Hukom. Ang “mga hatol” ay tumpak at hindi nililimitahan ang kahulugan sa mga kautusan lamang.
- source_word: מִנֶּגְדּוֹ
  choice: hindi niya abot-tanaw
  rationale: Kasama ng “napakataas,” ipinahahayag nito ang pagiging malayo sa kanyang paningin o pagpapahalaga nang hindi ganap na inaalis ang spatial na talinghaga.
- source_word: כָּל־צוֹרְרָיו
  choice: lahat ng kanyang mga kaaway
  rationale: Ang צֹרֵר ay kalaban o kaaway. Ang “mga kaaway” ay malinaw, natural, at angkop sa tulang Filipino.
- source_word: יָפִיחַ בָּהֶם
  choice: Sinisinghalan niya nang may paghamak
  rationale: Pinananatili ng “sinisinghalan” ang matingkad na larawan ng mapanghamak na pagbuga ng hangin, samantalang nililinaw ng “nang may paghamak” ang puwersa nito sa konteksto.
theological_decisions:
- issue: Ang kahulugan ng יָחִילוּ kaugnay ng kalagayan ng masama
  choice: Inilalarawan ang mga lakad ng masama bilang laging nagtatagumpay.
  alternative: Maaaring sabihing ang kanyang mga lakad ay laging matatag o panatag; maaari ring panatilihin ang mas literal ngunit di-likas sa konteksto na diwang “namimilipit” o “nagdaramdam.”
  rationale: Inirereklamo ng salmo ang nakikitang tagumpay at kapalaluan ng masama. Pinakamalapit sa daloy ng talata ang patuloy na pagtatagumpay, ngunit hindi ikinukubli sa talababa ang hirap at ibang posibilidad ng salitang Hebreo.
- issue: Ang pagiging “mataas” ng mga hatol ng Diyos
  choice: Pinanatili ang larawan na ang mga hatol ay napakataas at hindi abot-tanaw ng masama.
  alternative: Maaaring unawain itong tuwirang pagsasabing hindi pinapansin o hindi isinasaalang-alang ng masama ang mga hatol ng Diyos.
  rationale: 'Pinananatili ng salin ang sadyang spatial at moral na tensiyon: ang mga hatol ng Diyos ay mataas, at sa pananaw ng masama ay tila malayo o wala sa kanyang harapan, nang hindi ipinapasiyang kawalang-alam lamang o kusang pagwawalang-bahala lamang ang ibig sabihin.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matulaing “mga lakad,” “napakataas,” at “sinisinghalan,” ngunit nilinaw ang huling larawan sa pamamagitan ng “nang may paghamak.” Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
