  text: יֶאֱרֹ֬ב בַּ/מִּסְתָּ֨ר כְּ/אַרְיֵ֬ה בְ/סֻכֹּ֗/ה יֶ֭אֱרֹב לַ/חֲט֣וֹף עָנִ֑י יַחְטֹ֥ף עָ֝נִ֗י בְּ/מָשְׁכ֥/וֹ בְ/רִשְׁתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: tl
  text: Nag-aabang siya sa taguan[a], gaya ng leon sa kublihan nito[b]; nag-aabang siya upang sunggaban ang dukha; sinasunggaban niya ang dukha habang hinihila niya ito papasok sa kaniyang lambat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang palihim.”
    reason: lexical_alternative
  - marker: b
    text: O “sa kaniyang lungga”; ang salitang Hebreo ay maaaring tumukoy sa silungan, kublihan, o masukal na taguan.
    reason: lexical_alternative
  - marker: c
    text: O “sinasunggaban niya ang dukha sa pamamagitan ng kaniyang lambat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: nag-aabang
  rationale: Ang pandiwang ארב ay tumutukoy sa sadyang paghihintay nang palihim upang sumalakay. Likas sa makabagong Filipino ang “nag-aabang,” at pinanatili ang pag-uulit para sa diin ng tula.
- source_word: בַּמִּסְתָּר
  choice: sa taguan
  rationale: Ang מִסְתָּר ay maaaring tumukoy sa nakatagong lugar o sa pagiging lihim. Ang “sa taguan” ay malinaw at akma sa larawan ng pananambang.
- source_word: כְּאַרְיֵה
  choice: gaya ng leon
  rationale: Tuwirang pinananatili ang paghahambing at ang larawan ng mapanganib na maninila.
- source_word: בְסֻכֹּה
  choice: sa kublihan nito
  rationale: Sa konteksto, ang סֻכָּה ay isang masisilungan o natatagong lugar ng maninila. Sapat na malawak ang “kublihan” upang hindi limitahan ang kahulugan sa lungga lamang.
- source_word: לַחֲטוֹף
  choice: upang sunggaban
  rationale: Ang חטף ay nagpapahiwatig ng biglaan at marahas na pagdakip. Ang “sunggaban” ay natural at malakas ang dating sa Filipino.
- source_word: עָנִי
  choice: ang dukha
  rationale: Maaaring mangahulugan ang עָנִי ng mahirap, api, o naghihirap. Ang “dukha” ay maikli, marangal, at akma sa konteksto ng panlipunang pang-aapi, habang nananatili ang pahiwatig ng kahinaan.
- source_word: יַחְטֹף
  choice: sinasunggaban niya
  rationale: Ginamit ang parehong salitang-ugat gaya ng naunang חטף upang mapanatili ang pag-uulit at diin ng Hebreo.
- source_word: בְּמָשְׁכוֹ
  choice: sa paghila rito
  rationale: Ang infinitive construct na may ב ay maaaring magpahayag ng paraan o kasabay na pangyayari. Pinananatili ng “sa paghila rito” ang kilos at ang kaunting kalabuan ng ugnayan nito sa pagsunggab.
- source_word: בְּרִשְׁתּוֹ
  choice: sa kaniyang lambat
  rationale: Ang רֶשֶׁת ay lambat. Ang pang-ukol ay maaaring unawaing “sa” o “sa pamamagitan ng”; iniwasang gawing tahasang “papasok sa” sa pangunahing teksto upang hindi lampasan ang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang predatoryong larawan, ang pag-uulit ng mga pandiwa, at ang posibleng instrumental o pangyayaring pagbasa sa huling parirala. Ginamit ang “nito/rito” para malinaw na ang leon at ang dukha ang tinutukoy, samantalang ang “kaniyang” ay tumutukoy sa masamang tao.
