theological_decisions:
- issue: Sino ang kinakausap sa pahayag na לֹא תִּדְרֹשׁ
  choice: 'Tuwirang pahayag sa Diyos: “Hindi mo ako pananagutin.”'
  alternative: Hindi siya mananagot / Hindi hihingi ng pagsusulit ang Diyos.
