  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: tl
  text: Si Yahweh ay Hari magpakailanman at walang hanggan; naglaho na ang mga bansa mula sa kaniyang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa kaniyang daigdig.” Ang salitang Hebreo ay maaaring mangahulugang “lupain” o “daigdig,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מֶלֶךְ
  choice: Hari
  rationale: Pinananatili nito ang nominal na anyo ng Hebreo at natural itong gumaganap bilang panaguri sa Filipino.
- source_word: עוֹלָם וָעֶד
  choice: magpakailanman at magpakailanman
  rationale: Ang pag-uulit ay nagpapanatili sa mariing diwa ng walang-hanggang paghahari.
- source_word: אָבְדוּ
  choice: naglaho na
  rationale: Ipinahahayag nito ang ganap nang pangyayari nang hindi nagdaragdag ng tahasang tagaganap na wala sa pandiwang Hebreo.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansa at hindi kinakailangang sa isang teolohikal na kategorya ng mga di-Judio.
- source_word: מֵאַרְצוֹ
  choice: mula sa kaniyang lupain
  rationale: Ang 'lupain' ang mas kongkretong kahulugan sa konteksto, samantalang pinananatili sa talababa ang posibleng mas malawak na kahulugang 'daigdig.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Saklaw ng אַרְצוֹ
  choice: kaniyang lupain
  alternative: kaniyang daigdig
  rationale: Mas angkop sa agarang konteksto ang kongkretong 'lupain,' ngunit hindi nilulutas nang tahimik ang tunay na leksikal at teolohikal na kalabuan; inilalahad sa talababa ang mas malawak na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at mariing pahayag ng Hebreong tula, pati ang inuulit na pariralang nagpapatingkad sa walang-hanggang paghahari.
