  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: tl
  text: Nakalugmok siya; yumuyuko siya, at ang mga walang kalaban-laban ay nabubuwal sa kanyang kapangyarihan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreo sa unang bahagi ng talatang ito. Maaari rin itong isalin na “Siya ay yumuyuko at bumababa.”
    reason: textual_and_lexical_difficulty
  - marker: b
    text: Maaari ring unawain ang Hebreo bilang “sa pamamagitan ng kanyang malalakas” o, bilang talinghaga, “sa kanyang malalakas na kuko.” Itinuturing naman ng ibang salin na ang masama ang “nabubuwal,” sa halip na ang mga walang kalaban-laban.
    reason: lexical_and_syntactic_alternatives
lexical_decisions:
- source_word: ו/דכה
  choice: Yumuyuko siya
  rationale: Mahirap ang anyong Hebreo, ngunit sa konteksto ng mandaragit na masamang tao, pinakamalamang na inilalarawan nito ang kanyang mababang tindig habang nag-aabang. Ang “yumuyuko” ay likas sa modernong Tagalog at hindi labis na nagpapaliwanag.
- source_word: יָשֹׁחַ
  choice: at nakalugmok
  rationale: Ipinahihiwatig ng pandiwa ang pagyuko o pagbaba ng katawan. Pinananatili ng “nakalugmok” ang magkatulad na pisikal na larawan habang iniiwasan ang paulit-ulit na “yumuyuko.”
- source_word: וְ/נָפַל ... חלכאים
  choice: at ang mga walang kalaban-laban ay nabubuwal
  rationale: Bagaman pangatlong panauhang panlalaking isahan ang pandiwa, siksik at mahirap ang sintaks. Ang pag-unawa sa חלכאים bilang simuno ay malinaw na umaayon sa konteksto, kung saan binibiktima ng masama ang mahihina.
- source_word: בַּ/עֲצוּמָי/ו
  choice: sa kanyang kapangyarihan
  rationale: Maaaring literal na tumukoy ang anyong maramihan sa “kanyang malalakas,” ngunit maaari rin itong gumana bilang matinding o abstraktong pahayag ng lakas. Ang “sa kanyang kapangyarihan” ay natural at malinaw, habang itinatala sa talababa ang tunay na kalabuan.
- source_word: חלכאים
  choice: mga walang kalaban-laban
  rationale: Tumutukoy ito sa mahihina, kapus-palad, o madaling mabiktima. Malinaw na ipinahahayag ng “mga walang kalaban-laban” ang kanilang pagiging bulnerable sa kasalukuyang konteksto.
