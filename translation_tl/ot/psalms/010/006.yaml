lexical_decisions:
- source_word: אָמַר
  choice: Sinasabi niya
  rationale: Maaaring gumana ang Hebreong perfect sa tula bilang matingkad na paglalarawan sa kasalukuyan; likas sa Tagalog ang aspektong imperpektibo rito.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Pinananatili nito ang Hebreong metapora para sa lihim na pag-iisip o pakikipag-usap sa sarili, at malinaw pa rin sa modernong Tagalog.
- source_word: בַּל אֶמּוֹט
  choice: Hindi ako matitinag
  rationale: Ang pandiwang מוט sa Niphal ay tumutukoy sa pagyanig, pagkilos mula sa kinalalagyan, o pagkawala ng katatagan. Ang “matitinag” ay natural at pinananatili ang larawang metaporikal.
- source_word: לְדֹר וָדֹר
  choice: sa sali’t saling lahi
  rationale: Ipinahahayag ng parirala ang pagpapatuloy sa sunod-sunod na mga salinlahi; ang karaniwang idyomang Tagalog na ito ay angkop sa makatang pahayag.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: hindi ako daranas ng kapahamakan
  rationale: Putol o eliptikal ang Hebreo. Ginagawang tahasan ng salin ang ipinagpapalagay na unang panauhan at inuunawa ang רָע bilang masamang pangyayari o kapahamakan, hindi bilang abstraktong kasamaan.
theological_decisions:
- issue: Eliptikal na huling sugnay at pananaw ng nagsasalita
  choice: 'Ipinagpatuloy bilang pagyayabang ng masama sa unang panauhan: “hindi ako daranas ng kapahamakan.”'
  alternative: 'Maaaring unawain bilang kaugnay na paglalarawan: “na hindi dumaranas ng kapahamakan,” o mas maluwag na “hindi ako kailanman sasapitan ng kapahamakan.”'
  rationale: Pinakamalinaw sa konteksto ang tuloy-tuloy na panloob na pagsasalita ng masama, ngunit tunay na malabo at eliptikal ang gramatika kaya inilalahad ang ibang pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng puso at ang makatang pahayag na “sali’t saling lahi”; iniwasan ang labis na pormal na “karalitaan” o “kasawian” bilang salin ng רָע.
