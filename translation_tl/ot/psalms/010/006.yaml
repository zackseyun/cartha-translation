  text: Sinasabi niya sa kanyang puso, “Hindi ako matitinag[a]; sa sali’t saling lahi, hindi ako daranas ng kapahamakan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hindi ako mauuga” o “Hindi ako maaalis sa aking kinalalagyan”; ang pandiwang Hebreo ay maaaring mangahulugang mayayanig, matitinag, o maaalis sa kinalalagyan.
