  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: tl
  text: Bakit ka nakatayo sa malayo, Yahweh? Bakit ka nagkukubli sa mga panahon ng kagipitan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: Bakit
  rationale: Tuwirang tanong ito na nagpapahayag ng matinding hinaing; likas at malinaw sa modernong Tagalog ang “Bakit.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: תַּעֲמֹד
  choice: nakatayo ka
  rationale: Pinananatili ang konkretong larawang spatial ng pandiwang עמד, hindi lamang ang ipinahihiwatig na kawalan ng pagkilos.
- source_word: בְּרָחוֹק
  choice: sa malayo
  rationale: Natural na Tagalog ito para sa nadaramang distansiya ng Diyos at pinananatili ang spatial na metapora.
- source_word: תַּעְלִים
  choice: nagkukubli
  rationale: Ipinahahayag nito ang pagiging lingid o hindi nagpapakita, nang hindi labis na nililinaw kung ano ang dahilan.
- source_word: לְעִתּוֹת
  choice: sa mga panahon ng
  rationale: Sinasalamin ang pangmaramihang anyo ng עֵת at ang temporal na gamit ng parirala.
- source_word: בַּצָּרָה
  choice: kagipitan
  rationale: Saklaw nito ang diwa ng matinding hirap, panganib, o distress at angkop sa marangal ngunit madaling maunawaang rehistro.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Direktang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pag-uulit ng tanong sa ikalawang linya
  choice: Inulit nang tahasan ang “Bakit”
  alternative: 'Iwan bilang pahayag: “Nagkukubli ka sa mga panahon ng kagipitan”'
  rationale: Bagaman hindi inuulit sa Hebreo ang לָמָה, ipinahihiwatig ng paralelismo na saklaw ng tanong ang ikalawang sugnay; pinananatili ng pag-uulit ang lakas ng hinaing.
- issue: Pagpapanatili sa spatial na larawan ng pagtayo sa malayo
  choice: “nakatayo ka sa malayo”
  alternative: “nanatili kang malayo” o “hindi ka kumikilos”
  rationale: Hindi tahasang sinasabi ng teksto na walang ginagawa ang Diyos; ang literal na larawan ng pagtayo at distansiya ay nagpapanatili sa tensiyon at hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: 'Modernong Filipino Tagalog na tuwiran, marangal, at makata. Pinanatili ang dalawang retorikal na tanong at ang mga larawang “nakatayo sa malayo” at “nagkukubli.” Walang footnote dahil ang ibinigay na English footnote ay tila hindi tugma sa marker nito: ang alternatibo ay tumutukoy sa ikalawang sugnay, samantalang ang [a] ay inilagay pagkatapos ng unang “Why.”'
