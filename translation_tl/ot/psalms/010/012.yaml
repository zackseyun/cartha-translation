base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: tl
  text: Tumindig ka, Yahweh! O Diyos, itaas mo ang iyong kamay. Huwag mong kalimutan ang mga api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dukha,” “mga mapagpakumbaba,” o “mga pinahihirapan.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa mga taong nasa mababang kalagayan at madaling pagsamantalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Tuwirang pautos na nakatuon sa Diyos. Likas ito sa modernong Tagalog at pinananatili ang apurahang panawagan na kumilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalan ng Diyos sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֵל
  choice: O Diyos
  rationale: Tuwirang panawag na kaagapay ng “Yahweh”; pinananatili ng “O” ang marangal at makatang himig ng panalangin.
- source_word: נְשָׂא
  choice: itaas mo
  rationale: Pautos na may “kamay” bilang layon. Pinananatili nito ang konkretong larawan ng paghahandang kumilos nang hindi ipinapaliwanag kung paghatol o pagliligtas ang tiyak na tinutukoy.
- source_word: יָדֶךָ
  choice: ang iyong kamay
  rationale: Pinanatili ang antropomorpikong larawan ng Hebreo at ang puwersang makata nito.
- source_word: אַל תִּשְׁכַּח
  choice: Huwag mong kalimutan
  rationale: Tuwirang ipinapahayag ang negatibong pakiusap o utos; hindi ito pinalitan ng mas mapagpaliwanag na “huwag pabayaan” o “huwag ipagwalang-bahala.”
- source_word: עניים
  choice: ang mga pinahihirapan
  rationale: Sa konteksto ng Awit 10, tumutukoy ito sa mga taong ibinaba, ginipit, at ginawang mahina ng masasama. Sapat ang lawak ng “mga pinahihirapan” upang hindi ito limitahan sa kahirapang pangkabuhayan lamang.
theological_decisions:
- issue: Paglalarawan sa pagkilos ng Diyos sa pariralang “itaas mo ang iyong kamay”
  choice: Pinanatili ang konkretong larawan nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag bilang “kumilos ka upang humatol” o “iligtas mo sila.”
  rationale: Maaaring magpahiwatig ang larawan ng paghatol, pagliligtas, o pangkalahatang makapangyarihang pagkilos. Hindi nilulutas ng Hebreo ang lahat ng aspektong ito, kaya pinanatili ang tensiyon at lawak ng larawan.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Gumamit ng tuwirang pautos at pinanatili ang maigsi, masidhing anyo ng panalangin at ang paralelismong patula.
