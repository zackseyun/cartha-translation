id: PSA.10.17
reference: Psalms 10:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: tl
  text: Yahweh, narinig mo ang hangarin ng mga mapagpakumbaba[a]; patatatagin mo ang kanilang puso[b]; makikinig ang iyong tainga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga api” o “mga maamo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ihahanda mo” o “itatatag mo” ang kanilang puso.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: hangarin
  rationale: Maaaring tumukoy sa pagnanais o pananabik; ang “hangarin” ay natural sa makabagong Filipino at angkop sa konteksto ng panalangin.
- source_word: עֲנָוִים
  choice: mga mapagpakumbaba
  rationale: Saklaw ng salita ang mga mapagpakumbaba, maaamo, o api. Pinananatili ng salin ang pangunahing diwa ng kababaan nang hindi itinatanggi ang kontekstong tumutukoy sa mga inaapi.
- source_word: שָׁמַעְתָּ
  choice: narinig mo
  rationale: Tuwirang inilalarawan ng perpektong pandiwa ang ginawa na ng Diyos; natural sa Filipino ang payak na aspektong naganap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: תָּכִין
  choice: patatatagin mo
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, itatag, o gawing matatag. Sa pusong layon nito, malinaw at natural ang “patatatagin,” habang inilalahad sa talababa ang tunay na saklaw ng kahulugan.
- source_word: לִבָּם
  choice: kanilang puso
  rationale: Pinananatili ang kongkretong biblikal na larawan ng “puso” bilang panloob na pagkatao sa halip na paliitin ito sa isip o damdamin lamang.
- source_word: תַּקְשִׁיב אָזְנֶךָ
  choice: makikinig ang iyong tainga
  rationale: Pinananatili ang makatang larawang ang tainga ng Diyos ay nakikinig at ang diwa ng masusing pagbibigay-pansin, sa halip na gawing payak lamang na “pakikinggan mo.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang titulo.
- issue: Diwa ng עֲנָוִים sa konteksto
  choice: mga mapagpakumbaba
  alternative: mga api; mga maamo
  rationale: Tungkol sa mga sinisiil ang konteksto ng awit, ngunit taglay rin ng salita ang diwa ng kababaan o kaamuan. Pinananatili ng pangunahing salin at talababa ang tensiyong ito.
- issue: Diwa ng תָּכִין kaugnay ng puso
  choice: patatatagin mo
  alternative: ihahanda mo; itatatag mo
  rationale: Hindi nilulutas nang labis ang malawak na diwa ng ugat na כון. Pinipili ang angkop na pagbasa sa konteksto at inilalahad ang iba pang tunay na posibilidad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang paralelismong patula, ang larawang “puso,” at ang antropomorpikong “iyong tainga.”
