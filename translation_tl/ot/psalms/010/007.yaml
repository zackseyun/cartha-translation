  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: tl
  text: Ang bibig niya ay punô ng sumpa[a], pandaraya, at pang-aapi; sa ilalim ng kanyang dila ay kapinsalaan at kasamaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagsumpa.” Sa ibang konteksto, ang salitang Hebreo ay maaaring tumukoy sa isang panunumpa, ngunit dito ay mas malamang na pagsumpa ang diwa dahil sa mapaminsalang pananalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapahamakan at kasamaan” o “kapinsalaan at kasamaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: sumpa
  rationale: Sa konteksto ng mapaminsalang pananalita, tumutukoy ito sa pagsumpa o sumpang binibigkas, hindi sa neutral na panunumpa.
- source_word: פִּיהוּ
  choice: ang bibig niya
  rationale: Pinananatili ang tuwirang larawang Hebreo tungkol sa pananalitang lumalabas sa bibig.
- source_word: מָלֵא
  choice: ay punô ng
  rationale: Likas at malinaw na katumbas sa modernong Tagalog na nagpapanatili sa larawan ng kasaganaan.
- source_word: מִרְמוֹת
  choice: pandaraya
  rationale: Ipinahihiwatig ng salita ang panlilinlang o mapanlinlang na gawain; natural itong kaagapay ng sumpa at pang-aapi.
- source_word: תֹךְ
  choice: pang-aapi
  rationale: Sa pagkakaugnay na ito, ipinapahayag nito ang mapaminsala at mapagsamantalang kawalang-katarungan.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: sa ilalim ng kanyang dila
  rationale: Pinananatili ang matingkad at sadyang di-ganap na ipinaliliwanag na talinghaga ng nakatagong masamang pananalita o layunin.
- source_word: עָמָל
  choice: kaguluhan
  rationale: Dito ay hindi ito karaniwang paggawa kundi pinsala o suliraning dulot ng masama; ang 'kaguluhan' ay natural at nananatiling malawak ang saklaw.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Ipinapahayag nito ang masamang gawain o moral na kabulukan nang malinaw at dignificado.
