source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: tl
  text: Nakita mo, sapagkat minamasdan mo ang hirap at dalamhati upang akuin mo ang usapin.[a] Sa iyo ipinagkakatiwala ng taong walang kalaban-laban ang kanyang sarili;[b] ikaw ang naging tagatulong ng mga walang ama.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “upang ilagay sa iyong kamay.” Maaari rin itong unawain na hahawakan ng Diyos ang usapin upang kumilos.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari rin: “Sa iyo ipinauubaya ng taong kapus-palad ang kanyang usapin.” Maaaring ang tao mismo o ang kanyang usapin ang ipinagkakatiwala sa Diyos.'
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “mga ulila.” Ang salitang Hebreo ay pangunahing tumutukoy sa mga walang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Nakita mo nga ito
  rationale: Ang Qal perfect na tuwirang nakatalaga sa Diyos ay ipinahayag bilang naganap nang pagkakita na nananatiling batayan ng panawagan. Idinagdag ang “ito” bilang likas na layon sa Filipino ayon sa konteksto.
- source_word: עָמָל וָכַעַס
  choice: hirap at dalamhati
  rationale: Sa panaghoy ng Awit, ang tambalan ay tumutukoy sa mapanakit na kaguluhan o pagdurusa at sa dalamhating dulot nito. Iniiwasan ng salin na gawing emosyon ng Diyos ang כַעַס.
- source_word: תַּבִּיט
  choice: pinagmamasdan mo
  rationale: Ipinahihiwatig ng Hiphil ng נבט ang masusing pagtingin o pagbibigay-pansin, hindi lamang isang saglit na pagkakita.
- source_word: לָתֵת בְּיָדֶךָ
  choice: upang akuin mo ang usapin
  rationale: Literal itong “upang ilagay sa iyong kamay,” ngunit sa konteksto ay idyoma ng paghawak sa usapin upang kumilos. Pinananatili sa talababa ang literal na larawan.
- source_word: חֵלֶכָה
  choice: taong walang kalaban-laban
  rationale: Ang bihirang katawagan ay tumutukoy sa taong mahina, kapus-palad, o walang magawa. Ipinapahayag ng parirala ang kanyang kahinaan nang hindi siya tiyakang tinatawag na mahirap o api.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: Sa iyo ipinagkakatiwala ... ang kanyang sarili
  rationale: Sa kontekstong ito, ang עזב na may עַל ay nagpapahiwatig ng pagtitiwala o pagpapaubaya sa Diyos, hindi ng negatibong pag-abandona.
- source_word: יָתוֹם
  choice: ulila
  rationale: Ang “ulila” ay natural at marangal sa modernong Filipino. Maaaring mas tiyak na tumukoy ang Hebreo sa isang nawalan ng ama, kaya nililinaw ito sa talababa.
- source_word: עוֹזֵר
  choice: tagatulong
  rationale: Ang participle ay ginagamit bilang personal na katawagan sa Diyos bilang isang tumutulong; pinananatili ng “tagatulong” ang ganitong personal na diwa.
theological_decisions:
- issue: Kung ang pagkakita ng Diyos ay simpleng pagmamasid lamang o humahantong sa pagkilos
  choice: Nakikita at masusing pinagmamasdan ng Diyos ang pagdurusa upang akuin ang usapin at kumilos tungkol dito.
  alternative: Nakikita ng Diyos ang hirap at dalamhati upang ilagay ang mga iyon sa kanyang kamay.
  rationale: Ang pariralang לָתֵת בְּיָדֶךָ ay malamang na nagpapahiwatig ng paghawak ng Diyos sa usapin, ngunit hindi tinutukoy ng salin kung anong uri ng pagkilos o paghatol ang gagawin niya.
- issue: Kung sarili ng taong mahina o ang kanyang usapin ang ipinagkakatiwala sa Diyos
  choice: Ipinagkakatiwala ng taong walang kalaban-laban ang kanyang sarili sa Diyos.
  alternative: Ipinauubaya ng taong walang kalaban-laban sa Diyos ang kanyang usapin.
  rationale: Maaaring tumukoy ang pahayag sa tao mismo o sa kanyang kapakanan/usapin. Pinili sa pangunahing teksto ang personal na pagtitiwala, habang pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “pinagmamasdan,” “akuin ang usapin,” at “ipinagkakatiwala” ay malinaw sa karaniwang mambabasa habang pinananatili ang masusing pagkakita, nalalapit na pagkilos, at pagtitiwala sa Diyos. Iniwasan ang labis na teknikal, arkaiko, o denominasyonal na pananalita.
