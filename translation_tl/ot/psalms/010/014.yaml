  to: Nakita mo, sapagkat minamasdan mo ang hirap at dalamhati upang akuin mo ang usapin.[a] Sa iyo ipinagkakatiwala ng taong walang kalaban-laban ang kanyang sarili;[b] ikaw ang naging tagatulong ng mga walang ama.[c]
