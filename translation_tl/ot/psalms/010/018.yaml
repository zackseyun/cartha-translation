  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: tl
  text: upang bigyan ng katarungan ang ulila[a] at ang api[b], upang ang taong mula sa lupa[c] ay hindi na muling manakot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang walang ama.”
    reason: lexical_alternative
  - marker: b
    text: O “ang dinurog” o “ang pinahirapan.”
