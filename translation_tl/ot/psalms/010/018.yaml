lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: upang bigyan ng katarungan
  rationale: Ipinahahayag ng infinitive ang layunin o bunga ng pakikinig ng Diyos sa naunang konteksto. Pinananatili ng parirala ang hudisyal na diwa at likas itong pakinggan sa makabagong Filipino.
- source_word: יָתוֹם
  choice: ang ulila
  rationale: Ang “ulila” ang karaniwan at malinaw na tawag sa taong nawalan ng magulang o ama; hindi nito nililimitahan nang higit sa kailangan ang saklaw ng salitang Hebreo.
- source_word: דַּךְ
  choice: ang api
  rationale: Tumutukoy ito sa taong dinurog, pinahirapan, o ibinaba ng iba. Maikli at natural na naihahatid ng “api” ang panlipunan at personal na bigat nito.
- source_word: בַּל ... יוֹסִיף עוֹד
  choice: upang ... hindi na muling
  rationale: 'Magkasamang ipinahahayag ng mga salitang ito ang negatibong layunin o bunga: hindi na magpapatuloy o mauulit ang pananakot.'
- source_word: לַעֲרֹץ
  choice: manakot
  rationale: Ang pandiwa ay nangangahulugang magdulot ng sindak o takot. Mas tiyak ang “manakot” kaysa sa mas malawak na “mang-api.”
- source_word: אֱנוֹשׁ
  choice: ang tao
  rationale: Ang pangngalan ay tumutukoy sa mortal at marupok na tao. Ang payak na “tao” ay natural sa Filipino, habang ipinapaliwanag sa talababa ang pahiwatig ng pagiging mortal.
- source_word: מִן הָאָרֶץ
  choice: mula sa lupa
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo at ang kaibahan ng makalupang mortal sa Diyos na nagbibigay ng katarungan.
theological_decisions:
- issue: Ang panlalaking anyong pangkalahatan sa אֱנוֹשׁ
  choice: ang taong mula sa lupa
  alternative: ang mga mortal na taga-lupa
  rationale: Isahan ang Hebreo at kumakatawan sa sinumang mortal na mapaniil. Ang “tao” sa Filipino ay likas na pangkalahatan at hindi kailangang tukuyin ang kasarian, samantalang pinananatili ng isahang anyo ang retorika ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang legal na diwa ng paghatol, ang larawan ng taong mula sa lupa, at ang layuning wakasan ang pananakot nang hindi nilulutas ang posibleng layunin/bungang ugnayan nang higit sa ipinahihiwatig ng Hebreo.
