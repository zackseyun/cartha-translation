base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: tl
  text: Sa kapalaluan ng masama, mahigpit niyang tinutugis ang dukha.[a] Mahuli sana sila sa mga pakanang kanilang binalak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sa kapalaluan ng masama, ang dukha ay mahigpit na tinutugis.” Siksik ang ayos ng Hebreo; maaaring unawain na ang masama ang tumutugis at ang dukha ang tinutugis.
    reason: lexical_alternative
  - marker: b
    text: O, “Nahuhuli sila sa mga pakanang kanilang binalak.” Maaaring basahin ang anyong Hebreo bilang pahayag sa halip na isang hiling o panalangin.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: Sa kapalaluan ng
  rationale: Ipinahihiwatig ng בְּ ang kalagayan o motibong pinagmumulan ng pagkilos. Ang “sa kapalaluan ng” ay likas sa Filipino at pinananatili ang maikli at siksik na anyo ng Hebreo.
- source_word: רָשָׁע
  choice: masama
  rationale: Isang pang-uring ginamit bilang pangngalan at kumakatawan sa uri ng taong masama. Ang “masama” ay tuwiran at hindi nagdaragdag ng kasarian na hindi kailangang idiin sa Filipino.
- source_word: יִדְלַק
  choice: buong lupit niyang tinutugis
  rationale: Ang דלק ay maaaring tumukoy sa pagliyab o sa mahigpit na paghabol. Sa konteksto, malinaw ang mapanakit na pagtugis; ipinahahayag ng “buong lupit” ang tindi nang hindi literal na ipinapasok ang larawan ng apoy.
- source_word: עָנִי
  choice: ang dukha
  rationale: Maaaring mangahulugang mahirap, api, o nagdurusa. Ang “dukha” ay dignipikado at sapat na malawak upang magpahiwatig kapuwa ng karukhaan at kahinaan sa harap ng mapang-api.
- source_word: יִתָּפְשׂוּ
  choice: Mahuli sana sila
  rationale: Ang Nifal imperfect ay binasa bilang hiling o panalangin laban sa masasama. Likas na ipinahahayag ng “sana” ang jussive na puwersa sa Filipino.
- source_word: בִּמְזִמּוֹת
  choice: sa mga pakana
  rationale: Ang מְזִמּוֹת ay mga plano o balak na may masamang layunin. Ang “pakana” ay malinaw na nagpapahiwatig ng tuso at mapaminsalang pagpaplano.
- source_word: זוּ
  choice: -ng
  rationale: Ang relative particle ay likas na ipinapahayag sa Filipino sa pamamagitan ng pang-angkop sa “mga pakanang,” sa halip na piliting gumamit ng hiwalay na panghalip na panumbalik.
- source_word: חָשָׁבוּ
  choice: sila rin ang nagbalak
  rationale: 'Sa kontekstong ito, ang חשב ay sinadyang pagpaplano. Idiniriin ng “sila rin” ang moral na pagbabalik: ang sarili nilang pakana ang huhuli sa kanila.'
theological_decisions:
- issue: Sintaktikong ayos ng unang linya
  choice: Ang masama ang tumutugis at ang dukha ang tinutugis.
  alternative: Maaaring unawain sa mas siksik na paraan bilang “Sa kapalaluan ng masama, ang dukha ay tinutugis.”
  rationale: Ang aktibong ayos ay pinakanatural sa Filipino at naaayon sa malamang na ugnayan ng mga salita, ngunit inilalahad sa talababa ang siksik at bahagyang malabong sintaks ng Hebreo.
- issue: Puwersa ng ikalawang linya
  choice: 'Isang hiling o panalangin: “Mahuli sana sila.”'
  alternative: 'Isang paglalarawan o pahayag: “Nahuhuli sila.”'
  rationale: Pinakamainam sa panalanging retorika ng salmo ang jussive na pagbasa at ang temang bumabalik sa masasama ang sarili nilang pakana. Gayunman, maaaring basahin ang anyong Hebreo bilang isang pahayag, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dukha” at “pakana” bilang malinaw at dignipikadong mga salitang madaling maunawaan. Pinanatili ang paglipat mula sa isahang “masama” tungo sa maramihang “sila,” gaya ng Hebreo, upang tumukoy sa masama bilang kinatawan ng buong pangkat.
