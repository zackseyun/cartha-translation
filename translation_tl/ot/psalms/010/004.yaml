  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: tl
  text: 'Sa kanyang mapagmataas na anyo[a], hindi naghahanap ang taong masama; ganito ang lahat ng kanyang iniisip: “Walang Diyos.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kataasan ng kanyang ilong/mukha”—isang larawang tumutukoy sa mapagmataas na tindig o hambog na anyo.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring unawain: “Wala ang Diyos sa alinman sa kanyang mga iniisip.” Maaaring ilarawan ng Hebreo ang lubos na pagkawala ng Diyos sa kanyang pag-iisip sa halip na sipiin nang tuwiran ang kanyang iniisip.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: ang taong masama
  rationale: Ang pang-isahang panlalaking pang-uri ay ginagamit bilang pangngalan. Nilinaw ng “taong masama” ang indibiduwal na inilalarawan habang nananatili ang kinatawang diwa nito.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: Sa kanyang mapagmataas na anyo
  rationale: Ang גֹבַהּ ay tumutukoy sa kataasan at ang אַף ay literal na ilong o mukha. Sa konteksto, inilalarawan ng parirala ang hambog na tindig o anyo; natural itong ipinahayag sa Filipino nang hindi ito ginawang pagtukoy sa galit.
- source_word: בַּל יִדְרֹשׁ
  choice: hindi naghahanap
  rationale: Ang ποιetikong negatibong בַּל kasama ng di-ganap na pandiwa ay naglalarawan ng palagiang asal o pagtanggi. Hindi dinagdagan ng tahasang layon sapagkat wala nito sa mismong sugnay sa Hebreo.
- source_word: אֵין אֱלֹהִים
  choice: Walang Diyos
  rationale: Tuwirang ipinapahayag nito ang eksistensiyal na pagtanggi sa Diyos at likas itong pakinggan bilang nilalaman ng pag-iisip ng taong masama.
- source_word: כָּל מְזִמּוֹתָיו
  choice: ganito ang lahat ng kanyang iniisip
  rationale: Maaaring tumukoy ang מְזִמּוֹת sa mga balak, pakana, o iniisip. Dito, ang kabuuang takbo ng kanyang pag-iisip ang diin, kaya “iniisip” ang pinakamalawak at pinakanatural na katumbas.
theological_decisions:
- issue: Ugnayang sintaktiko ng huling sugnay
  choice: Itinuring ang “Walang Diyos” bilang nilalaman ng lahat ng iniisip ng taong masama.
  alternative: Maaaring unawain na wala ang Diyos sa alinman sa kanyang mga iniisip.
  rationale: Pinahihintulutan ng Hebreo ang dalawang pagbasa. Mas malapit sa ayos at matalim na puwersa ng mga salita ang tuwirang nilalaman na “Walang Diyos,” ngunit pinanatili sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pang-isahang larawan ng taong masama, iniwasan ang tahasang pagdaragdag ng layon sa “hindi naghahanap,” at minarkahan nang wasto ang parehong talababa sa pangunahing teksto.
