base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: tl
  text: 'Nagsalita ang Diyos sa kanyang kabanalan[a]: “Magbubunyi ako[b]; hahatiin ko ang Shekem, at susukatin ko ang Lambak ng Sucot.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang banal na dako,” o “sa pamamagitan ng kanyang kabanalan.” Maaaring tumukoy ang pariralang Hebreo sa kabanalan mismo ng Diyos o sa saklaw ng kanyang banal na presensya.
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain na ang salmista, hindi ang Diyos, ang nagsasabing “Magbubunyi ako” bilang tugon sa sinabi ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maramihan ang anyo ng pangngalan, isahan ang pandiwang דִּבֶּר, kaya tumutukoy ito sa iisang Diyos ng Israel.
- source_word: דִּבֶּר
  choice: Nagsalita
  rationale: Ipinahahayag ng ganap na pandiwa ang isang natapos na pagsasalita; natural at tuwiran sa modernong Tagalog ang “Nagsalita.”
- source_word: בְּקָדְשׁוֹ
  choice: sa kanyang kabanalan
  rationale: Pinananatili nito ang maikli at sadyang malawak na pahayag ng Hebreo, na maaaring tumukoy sa kabanalan ng Diyos o sa saklaw ng kanyang banal na presensya.
- source_word: אֶעְלֹזָה
  choice: Magbubunyi ako
  rationale: Ipinahahayag ng pandiwa ang masigla at matagumpay na kagalakan; ang “magbubunyi” ay marangal ngunit nauunawaan sa makabagong Tagalog.
- source_word: אֲחַלְּקָה
  choice: hahatiin ko
  rationale: Sa konteksto ng lupain, nangangahulugan itong hatiin o italaga ang teritoryo; pinananatili ng “hahatiin” ang tuwirang larawan ng Hebreo.
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Pangalan ito ng lugar; ang “Shekem” ay transliterasyong angkop sa bigkas at baybay ng Tagalog.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: ang Lambak ng Sucot
  rationale: Tinutukoy ng parirala ang heograpikong lambak na kaugnay ng Sucot; isinalin ang karaniwang pangngalan at itin translitera ang pangalan ng lugar.
- source_word: אֲמַדֵּד
  choice: susukatin ko
  rationale: Pinananatili nito ang literal na larawan ng pagsukat ng lupain, kalakip ang pahiwatig ng pagtatakda o pag-aari ng teritoryo.
theological_decisions:
- issue: Saklaw ng tuwirang pananalita at pagkakakilanlan ng nagsasalita
  choice: Itinuring na bahagi ng pahayag ng Diyos ang “Magbubunyi ako” at ang kasunod na mga pandiwa.
  alternative: Maaaring ang salmista ang nagsasabing “Magbubunyi ako” bilang tugon sa sinabi ng Diyos, at sa kasunod lamang nagsisimula o nagpapatuloy ang pahayag ng Diyos.
  rationale: Pinakamadaling basahin ang sunod-sunod na unang panauhang pandiwa bilang iisang banal na pahayag, lalo na dahil ang paghahati at pagsukat sa lupain ay nagpapahayag ng paghahari at pag-aari ng Diyos. Gayunman, hindi ganap na tiyak sa Hebreo ang hangganan ng sipi, kaya itinala ang alternatibo.
- issue: Kahulugan ng בְּקָדְשׁוֹ
  choice: “sa kanyang kabanalan”
  alternative: “sa kanyang banal na dako” o “sa pamamagitan ng kanyang kabanalan”
  rationale: Hindi nililinaw ng maikling pariralang Hebreo kung pangunahing tinutukoy ang banal na katangian ng Diyos, ang kanyang banal na presensya o dako, o ang kabanalan bilang batayan ng pagsasalita. Pinananatili ng pangunahing salin ang lawak na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magbubunyi” upang maipahayag ang masidhing matagumpay na kagalakan, at pinanatiling payak ang mga pandiwang teritoryal. Ang mga pangalang Shekem at Sucot ay binaybay ayon sa natural na transliterasyong Filipino.
