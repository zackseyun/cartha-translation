  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עָ֝לַ֗/י פְּלֶ֣שֶׁת הִתְרֹעָֽעִֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: tl
  text: Ang Moab ay palanggana ko sa paghuhugas; sa Edom ay ihahagis ko ang aking sandalyas; ikaw, Filistia, sumigaw ka para sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang Hebreo. Maaari rin itong isalin ayon sa tradisyonal na pagbasa: “Sa ibabaw ng Filistia ay sisigaw ako sa tagumpay.” Gayunman, ang nakasulat na anyo ay mas tuwirang mauunawaan bilang isang utos na nakatuon sa Filistia.'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: palanggana kong hugasan
  rationale: Tumutukoy ang סִיר sa isang sisidlan o palanggana, at nililinaw ng רַחְצִי na ginagamit ito sa paghuhugas. Natural ito sa modernong Filipino at pinananatili ang larawang nagpapahiwatig ng pagpapababa at pagpapasakop.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: ihahagis ko ang aking sandalyas
  rationale: Ang Hiphil ng שלך ay nangangahulugang maghagis, at ang נַעַל ay kasuotang-paa. Ang “sandalyas” ay angkop sa sinaunang konteksto at pinananatili ang larawan ng paghahari o pananakop.
- source_word: עַל אֱדוֹם
  choice: sa Edom
  rationale: Sa Filipino, natural na ipinahihiwatig ng “sa Edom ay ihahagis” ang paghagis ng sandalyas doon o sa ibabaw nito, nang hindi pinipilit ang eksaktong simbolikong kahulugan ng kilos.
- source_word: עָלַי פְּלֶשֶׁת
  choice: ikaw, Filistia ... para sa akin
  rationale: Mahirap ang pariralang may pang-ukol at unang panauhang hulapi. Iniuugnay ng salin ang hulapi sa utos na sumigaw “para sa akin,” habang malinaw na kinakausap ang Filistia.
- source_word: הִתְרֹעָעִי
  choice: sumigaw ka
  rationale: Ang anyo ay pambabaeng isahan na pautos mula sa רוע at tumutukoy sa malakas na sigaw, maaaring sigaw ng tagumpay o pakikidigma. Ang payak na “sumigaw” ay nagpapanatili sa tunay na kalabuan nang hindi labis na tinutukoy ang uri ng sigaw.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Moab / Edom / Filistia
  rationale: Pinananatili bilang mga pangalan ng lugar o bansa; ang “Filistia” ay tumutukoy sa lupain o bansang nasa anyong pambabae sa Hebreo.
theological_decisions:
- issue: Lakas at tinutukoy ng pautos na הִתְרֹעָעִי sa Filistia
  choice: 'Pinanatili bilang pautos sa Filistia: “ikaw, Filistia, sumigaw ka para sa akin.”'
  alternative: “Sa Filistia ay sisigaw ako sa tagumpay.”
  rationale: Ang Masoretic Text ay may pambabaeng isahang pautos, na angkop sa Filistia bilang bansang kinakausap. Maaaring mapanuyang utos ito na nagpapakita ng pagpapasakop, ngunit hindi iyon tahasang idinagdag sa teksto. Inilalahad sa talababa ang tradisyonal na unang-panauhang pagbasa dahil mahirap ang anyong Hebreo.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang “palanggana kong hugasan” sa halip na mas luma o di-natural na katumbas, at pinanatiling payak ang “sumigaw” upang hindi ikubli ang kalabuan ng Hebreo.
