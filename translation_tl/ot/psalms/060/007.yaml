  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: tl
  text: 'Akin ang Gilead, at akin ang Manases;

    ang Efraim ang muog ng aking ulo;

    ang Juda ang aking setro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking tagapagbigay ng batas” o “aking tungkod ng pamamahala.” Ang salitang Hebreo ay maaaring tumukoy sa isang nagtatakda ng batas o sa tungkod o setrong sagisag ng pamamahala.
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: akin
  rationale: Tuwirang ipinahahayag ng pariralang Hebreo ang pag-aari; natural at maigsi sa Tagalog ang “akin.”
- source_word: גִלְעָד
  choice: Gilead
  rationale: Pangalan ng pook; ginamit ang karaniwang anyong Tagalog.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Pangalan ng lipi at rehiyon; ginamit ang nakaugaliang anyong Tagalog.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Pangalan ng lipi; ginamit ang nakaugaliang anyong Tagalog.
- source_word: מָעוֹז
  choice: muog
  rationale: Pinananatili nito ang larawang militar ng isang matibay na tanggulan o pinagmumulan ng proteksiyon.
- source_word: רֹאשִׁי
  choice: aking ulo
  rationale: Tuwirang pinananatili ang metapora ng Hebreo sa halip na ipaliwanag o lutasin ang eksaktong kahulugan nito.
- source_word: מְחֹקְקִי
  choice: aking setro
  rationale: Sa kontekstong maharlika, malinaw na naihahatid ng “setro” ang sagisag ng pamamahala, habang ang iba pang posibleng kahulugan ay inilalahad sa talababa.
theological_decisions:
- issue: Kahulugan ng מְחֹקְקִי sa larawang maharlika
  choice: aking setro
  alternative: aking tagapagbigay ng batas; tungkod ng aking pinuno
  rationale: Ang “setro” ay nagpapanatili sa larawan ng paghahari at kapangyarihan nang hindi ipinipilit na tao ang tinutukoy. Gayunman, tunay na posible sa Hebreo ang kahulugang isang nag-uutos o ang tungkod na sagisag ng pamamahala, kaya inilakip ang mga ito sa talababa.
- issue: Ugnayan ng “muog” at “aking ulo”
  choice: ang muog ng aking ulo
  alternative: muog para sa aking ulo; lakas ng aking ulo
  rationale: Pinananatili ang masinsing konstruksiyon at kakaibang metapora ng Hebreo. Hindi tahasang tinutukoy ng teksto kung proteksiyon, dangal, o lakas ang pangunahing diwa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang maikli at patulang paralelismo, pati ang sadyang di-pangkaraniwang larawang “muog ng aking ulo.”
