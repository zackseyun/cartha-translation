  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: tl
  text: O Diyos, itinakwil mo kami; binasag mo kami; nagalit ka. Ipanumbalik mo kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Bumalik ka sa amin.” Maaaring tumukoy ang Hebreo sa pagpapanumbalik ng bayan o sa pagbabalik ng Diyos sa kanila.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos. Ang “O Diyos” ay malinaw at marangal na anyong pantawag sa Tagalog.
- source_word: זְנַחְתָּנוּ
  choice: itinakwil mo kami
  rationale: Ang זנח ay nangangahulugang itakwil o tanggihan. Ipinahahayag ng “itinakwil” ang matinding pagtalikod na nadarama sa panaghoy.
- source_word: פְרַצְתָּנוּ
  choice: biniyak mo ang aming hanay
  rationale: Ang פרץ ay naglalarawan ng pagbutas o paglikha ng puwang sa isang depensa. Ang “biniyak mo ang aming hanay” ay natural sa Tagalog at pinananatili ang marahas na larawang pandigma, bagaman ang “hanay” ay ipinahiwatig ng konteksto.
- source_word: אָנַפְתָּ
  choice: nagalit ka
  rationale: Payak at tuwirang katumbas ito ng pandiwang nagpapahayag ng galit ng Diyos, nang hindi pinalalabis bilang pagngangalit.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Ipanumbalik mo kami
  rationale: Ang pakiusap ay maaaring tumukoy sa pagpapanumbalik sa bayan matapos ang paghatol. Pinananatili sa talababa ang tunay na posibilidad na ang hinihiling ay ang pagbabalik ng Diyos sa kanila.
theological_decisions:
- issue: Kahulugan ng pangwakas na pakiusap na תְּשׁוֹבֵב לָנוּ
  choice: Pakiusap na ipanumbalik ng Diyos ang kanyang bayan
  alternative: Pakiusap na bumalik ang Diyos sa kanyang bayan
  rationale: Maaaring tumukoy ang Hebreo sa pagpapanumbalik sa bayan o sa muling paglapit ng Diyos sa kanila. Pinili sa pangunahing teksto ang una dahil sumusunod ito sa daloy mula sa pagkakatakwil at pagkabiyak tungo sa paghilom, ngunit hindi inaalis ang ikalawang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang malinaw na panawagang “O Diyos” at ang larawang “biniyak mo ang aming hanay” upang maipahayag ang ideya ng isang puwang na ginawa sa bayan nang hindi gumagamit ng salitang teknikal o di-likas na parirala.
