translation:
  language: tl
  text: Bigyan mo kami ng tulong laban sa kaaway[a], sapagkat walang kabuluhan ang saklolong mula sa tao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kagipitan.” Ang salitang Hebreo ay maaaring mangahulugang “kaaway” o “kagipitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo para sa “saklolo” ay maaari ring isaling “pagliligtas” o “tagumpay”; ang “tao” ay tumutukoy sa sangkatauhan sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Bigyan mo
  rationale: Isang tuwirang pakiusap sa Diyos na magkaloob; natural sa makabagong Tagalog ang “Bigyan mo kami.”
- source_word: לָּנוּ
  choice: kami
  rationale: Unang panauhang maramihan bilang tumatanggap ng hinihinging tulong.
- source_word: עֶזְרַת
  choice: tulong
  rationale: Karaniwan, malinaw, at marangal na katumbas ng tulong o saklolo sa konteksto ng panalangin.
- source_word: מִצָּר
  choice: laban sa kaaway
  rationale: Maaaring tumukoy ang צַר sa kaaway o kagipitan. Pinakamalapit sa kontekstong militar ng salmo ang personal na “kaaway,” at likas sa Tagalog ang “tulong laban sa kaaway.”
- source_word: וְשָׁוְא
  choice: sapagkat walang kabuluhan
  rationale: Ipinahahayag ng שָׁוְא ang kawalang-saysay o kabuluhan. Ginamit ang “sapagkat” upang ilantad sa natural na Tagalog ang lohikal na ugnayan ng dalawang linya.
- source_word: תְּשׁוּעַת
  choice: pagliligtas
  rationale: Saklaw nito ang pagliligtas, pagsaklolo, o tagumpay; ang “pagliligtas” ay malinaw at angkop sa agarang konteksto.
- source_word: אָדָם
  choice: tao
  rationale: Tumutukoy dito sa sangkatauhan o tulong na nagmumula sa tao sa pangkalahatan, hindi lamang sa isang lalaking indibidwal.
theological_decisions:
- issue: Paghahambing ng tulong ng Diyos at pagliligtas ng tao
  choice: Inilalarawan ang pagliligtas ng tao bilang walang kabuluhan sa harap ng hinihinging tulong mula sa Diyos.
  alternative: Unawain bilang pangkalahatang pahayag na walang saysay ang lahat ng pagsisikap ng tao.
  rationale: Pinananatili ng salin ang tuwirang paghahambing sa konteksto ng salmo nang hindi pinalalawak ito bilang ganap na pahayag tungkol sa lahat ng gawain ng tao.
translation_notes:
  register: Makabago at natural na Filipino na may marangal na himig ng panalangin. Pinanatili ang maikli at magkatimbang na anyong patula, at inilagay ang mga tunay na leksikal na alternatibo sa mga talababa.
