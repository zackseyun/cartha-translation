  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: tl
  text: Binigyan mo ng watawat ang mga may takot sa iyo, upang maitaas ito[a] dahil sa katotohanan[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang iwagayway,” “upang magtipon sa ilalim nito,” o marahil “upang tumakas.” Mahirap at pinagtatalunan ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong qoshet ay malamang na nangangahulugang “katotohanan” o “pagiging tapat.” Iba ang pagkaunawa ng ilang sinaunang salin at tagapagpaliwanag sa linyang ito, kaya lumilitaw ang mga saling gaya ng “dahil sa pana.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Binigyan mo
  rationale: Qal perfect, ikalawang panauhang panlalaki na isahan, na tumutukoy sa Diyos. Likas sa Tagalog ang aspektong naganap na “binigyan mo” at malinaw nitong pinananatili ang natapos na pagkilos.
- source_word: לִירֵאֶיךָ
  choice: ang mga may takot sa iyo
  rationale: Ipinahahayag nito ang mapitagang pagkatakot sa Diyos, hindi lamang sindak. Mas natural ito sa modernong Tagalog kaysa sa literal na “mga natatakot sa iyo” sa kontekstong ito.
- source_word: נֵס
  choice: watawat
  rationale: Tumutukoy ang salita sa isang nakataas na sagisag o pamantayang nakikita ng mga tao. Ang “watawat” ay malinaw, natural, at nagpapanatili sa pampubliko o panghukbong larawan.
- source_word: לְהִתְנוֹסֵס
  choice: upang maitaas ito
  rationale: Mahirap at pinagtatalunan ang pandiwang Hebreo. Ang pasibong diwang “maitaas” ay umaangkop sa larawan ng watawat, habang ang panghalip na “ito” ay kailangan para sa natural at malinaw na Tagalog.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Bagaman literal na maaaring tumukoy sa pagiging “sa harap ng” o “mula sa harap ng,” ang gamit dito ay pinakamainam na maipahayag bilang sanhi.
- source_word: קֹשֶׁט
  choice: katotohanan
  rationale: Ang bihirang poetikong anyo ay malamang na nangangahulugang “katotohanan” o “pagiging tapat.” Hindi nilagyan ng “ang” upang mapanatili ang kawalan ng tiyak na pantukoy sa Hebreo at maging natural pa rin sa parirala.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili sa transliterasyon bilang panandang liturhikal o musikal na hindi tiyak ang eksaktong kahulugan.
theological_decisions:
- issue: Diwa ng pagkatakot sa Diyos
  choice: mga may takot sa iyo
  alternative: mga natatakot sa iyo
  rationale: Pinananatili ng pinili ang posibilidad ng tunay na takot habang natural ding nagpapahiwatig ng pagpipitagan, nang hindi ito ginagawang isang natatanging doktrinal na termino.
- issue: Ugnayan ng watawat at katotohanan
  choice: dahil sa katotohanan
  alternative: dahil sa pana
  rationale: Ang “katotohanan” ang pinakamalamang na leksikal na kahulugan ng קֹשֶׁט, ngunit hindi inalis ang sinaunang alternatibong pagbasa; inilagay ito sa talababa upang mapanatili ang tekstuwal at interpretatibong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “watawat” sa halip na mas teknikal na “estandarte,” at “mga may takot sa iyo” upang maipahayag ang mapitagang pagkatakot. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng mga salitang saklaw ng mga ito.
