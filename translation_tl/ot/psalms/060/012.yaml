  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: tl
  text: Sa tulong ng Diyos[a], kikilos tayo nang buong tapang, at siya ang yuyurak sa ating mga kaaway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kasama ang Diyos.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng paraan o ng malapit na pakikisama.
    reason: lexical_alternative
  - marker: b
    text: O “tatapak sa ating mga kalaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Sa tulong ng Diyos
  rationale: Ang בְּ ay maaaring magpahayag ng paraan o ng malapit na pakikisama. Likas sa modernong Tagalog ang “sa tulong ng Diyos” at malinaw nitong ipinapakitang nakasalalay sa Diyos ang pagkilos ng bayan, habang inilalahad sa talababa ang alternatibong “Kasama ang Diyos.”
- source_word: נַעֲשֶׂה
  choice: kikilos tayo
  rationale: Malawak ang kahulugan ng עשה na ‘gumawa’ o ‘kumilos.’ Sa idyomang עשה חיל, mas natural sa Tagalog ang “kikilos tayo nang buong tapang” kaysa sa literal ngunit alanganing “gagawa tayo ng kagitingan.”
- source_word: חָיִל
  choice: nang buong tapang
  rationale: Sa kontekstong pandigma, ang חַיִל ay tumutukoy sa lakas o kagitingan. Ang pariralang ito ay nagpapanatili sa diwang may tapang at lakas ang pagkilos nang hindi awtomatikong ginagawang ‘tagumpay’ ang salita.
- source_word: וְהוּא
  choice: at siya ang
  rationale: 'Pinananatili nito ang pang-ugnay at ang diin ng tahasang panghalip: kikilos ang bayan sa tulong ng Diyos, ngunit siya ang gagawa ng mapagpasyang pagyurak sa mga kalaban.'
- source_word: יָבוּס
  choice: yuyurak
  rationale: Ang בוס ay matingkad na larawang nangangahulugang yurakan o tapakan. Ang “yuyurak” ay marangal at angkop sa tulang pandigma, at hindi nito pinapalitan ang larawan ng mas interpretatibong “dudurog.”
- source_word: צָרֵינוּ
  choice: ating mga kaaway
  rationale: Ang צָר ay tumutukoy sa kalaban o kaaway. Ang “mga kaaway” ay malinaw, natural, at angkop sa kontekstong militar ng awit.
theological_decisions:
- issue: Pagkilos ng tao at pagkilos ng Diyos sa tagumpay
  choice: Parehong pinananatili ang matapang na pagkilos ng bayan at ang mapagpasyang pagkilos ng Diyos.
  alternative: Bigyang-diin lamang ang pagkilos ng tao, o ilarawang walang tunay na pagkilos ang bayan at Diyos lamang ang kumikilos.
  rationale: 'Tahasan sa Hebreo ang dalawang aspekto: kikilos ang bayan sa kaugnayan o sa tulong ng Diyos, at ang Diyos mismo ang yuyurak sa kanilang mga kaaway. Hindi pinag-iisa o inaalis ng salin ang tensiyong ito.'
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at patulang himig. Ginamit ang “kikilos tayo nang buong tapang” upang maipahayag nang natural ang idyomang Hebreo, at “yuyurak” upang mapanatili ang matingkad na larawang pandigma.
