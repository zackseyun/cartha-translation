  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: tl
  text: Sino ang maghahatid sa akin sa lunsod na may kuta? Sino ang papatnubay sa akin hanggang sa Edom?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sino ang papatnubay sa akin patungo sa lunsod na may kuta? Sino ang pumatnubay sa akin hanggang sa Edom?” Maaaring magpahiwatig ng bahagyang magkakaibang aspekto ng kilos ang mga pandiwang Hebreo, ngunit pinananatili sa pangunahing salin ang paralelismo bilang dalawang tanong na nakatuon sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip na nagpapakilala ng retorikal na tanong; tuwirang katumbas nito ang “Sino.”
- source_word: יֹבִלֵנִי
  choice: maghahatid sa akin
  rationale: Ang Hiphil ng יבל ay nangangahulugang magdala o umakay. Ang “maghahatid” ay natural sa Filipino at binibigyang-diin ang pagdating sa kasunod na patutunguhan.
- source_word: עִיר מָצוֹר
  choice: lunsod na may kuta
  rationale: Tumutukoy ang pariralang konstruktibo sa isang lunsod na pinatibay o may matibay na tanggulan. Iniiwasan nito ang posibleng maling pakahulugan ng “kinukubkob na lunsod.”
- source_word: נָחַנִי
  choice: papatnubay sa akin
  rationale: Mula sa נחה, “umakay/pumatnubay.” Bagaman maaaring unawain ang anyo bilang perpektibo, pinananatili rito ang pasulong na diwa ng magkatulad na retorikal na mga tanong.
- source_word: עַד אֱדוֹם
  choice: hanggang sa Edom
  rationale: Ang עַד ay nagmamarka ng lawak o hantungan; malinaw at natural itong naipahahayag ng “hanggang sa.”
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pangngalang pantangi na pinanatili sa karaniwang anyong Filipino.
