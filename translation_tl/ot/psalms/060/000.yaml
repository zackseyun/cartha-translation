  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: ayon sa “Liryo ng Patotoo.”[a] Isang miktam[b] ni David,[c] para sa pagtuturo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa himig ng ‘Liryo ng Patotoo.’” Malamang na iniingatan ng Hebreo ang isang musikal o liturhikal na pamagat, ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “miktam” ay katawagang Hebreo para sa isang uri ng awit, ngunit hindi tiyak ang kahulugan nito; maaaring isa itong musikal o pampanitikang katawagan.
    reason: lexical_alternative
  - marker: c
    text: Ang “ni David” ay maaari ring mangahulugang “isinulat ni David” o “para kay David”; maaaring tumukoy ang Hebreong anyo sa pagkakatha, kaugnayan, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong namamahala sa musikal na pagganap. Ang “tagapangasiwa ng awitan” ay natural at hindi nililimitahan ang tungkulin sa pamumuno lamang ng koro.
- source_word: עַל
  choice: ayon sa
  rationale: Maaari itong magpakilala ng himig o musikal na kaayusan, ngunit hindi tiyak ang teknikal na gamit dito. Pinananatili ng “ayon sa” ang pagiging bukas ng kahulugan.
- source_word: שׁוּשַׁן עֵדוּת
  choice: “Liryo ng Patotoo”
  rationale: Malamang na pamagat ito ng isang himig o liturhikal na piraso. Isinalin ang mga salita ngunit ginamitan ng panipi upang ipakitang pamagat ang parirala.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Hindi tiyak ang kahulugan ng katawagang Hebreo para sa uri ng awit; mas tapat na panatilihin ito bilang transliterasyon kaysa pumili ng haka-hakang salin.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang Hebreong parirala ay maaaring magpahiwatig ng pagkakatha, kaugnayan, o pag-aalay. Ang karaniwang pariralang “ni David” ay maikli at hindi tahasang nagpapasiya sa iisang ugnayan.
- source_word: לְלַמֵּד
  choice: para sa pagtuturo
  rationale: Ipinahahayag ng anyong pawatas ang layunin; malinaw at natural itong naihahatid ng “para sa pagtuturo.”
theological_decisions:
- issue: Ugnayan ni David sa awit
  choice: ni David
  alternative: isinulat ni David / para kay David
  rationale: Hindi tahasang nilulutas ang malawak na gamit ng Hebreong pang-ukol bilang tiyak na pahayag tungkol sa pagkakatha o pag-aalay.
