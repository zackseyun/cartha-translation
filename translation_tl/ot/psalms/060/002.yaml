translation:
  language: tl
  text: Niyanig mo ang lupa at biniyak ito. Pagalingin mo ang mga bitak nito[a], sapagkat ito'y tumatagilid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lupa” ay maaari ring unawain bilang “lupain.” Ang Hebreong אֶרֶץ ay maaaring tumukoy sa buong lupa o sa isang partikular na lupain; kapwa pinahihintulutan ng kontekstong patula.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: Niyanig mo
  rationale: Ang Hiphil ng רָעַשׁ ay nagpapahayag ng pagpapayanig o pagpapalindol. Likas at matindi sa makabagong Filipino ang “niyanig mo.”
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Maaaring tumukoy ang אֶרֶץ sa buong daigdig o sa isang partikular na lupain. Pinananatili ng “lupa” ang parehong posibilidad sa kontekstong patula.
- source_word: פְּצַמְתָּהּ
  choice: biniyak ito
  rationale: Ipinahihiwatig ng pandiwa ang pagbasag o paghahati na lumilikha ng siwang; malinaw na kaugnay ito ng kasunod na larawan ng mga bitak.
- source_word: רְפָה
  choice: Pagalingin mo
  rationale: Ang pautos mula sa רָפָא ay karaniwang nangangahulugang “pagalingin.” Pinananatili nito ang matingkad na personipikasyon ng lupa sa tula.
- source_word: שְׁבָרֶיהָ
  choice: ang mga bitak nito
  rationale: Ang שֶׁבֶר ay maaaring tumukoy sa pagkabasag, lamat, o siwang. Ang “mga bitak” ay natural sa Filipino at akma sa larawang dulot ng pagyanig.
- source_word: כִי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagsusumamo at ang “sapagkat” ay angkop sa marangal na rehistrong patula.
- source_word: מָטָה
  choice: ito'y umuuga
  rationale: Ang pandiwa ay naglalarawan ng pagtagilid, pag-uga, o pagkawala ng katatagan. Ang “umuuga” ay nagpapakita ng nagpapatuloy na kawalang-tatag, hindi ng ganap nang pagbagsak.
