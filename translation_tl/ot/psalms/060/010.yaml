  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: tl
  text: Hindi ba ikaw, O Diyos, ang nagtakwil[a] sa amin, at hindi ka ba lumalabas, O Diyos, na kasama ng aming mga hukbo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinaboy” o “tinalikuran.”
