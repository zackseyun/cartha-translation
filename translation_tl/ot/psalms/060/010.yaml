  - marker: b
    text: Ang “lumalabas” ay pananalitang militar dito, ibig sabihin, lumalabas upang makipaglaban na kasama ng aming mga hukbo.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Naghaharap ito ng retorikal na tanong na umaasang sasang-ayon ang nakikinig; likas at malinaw sa modernong Tagalog ang “Hindi ba.”
- source_word: זְנַחְתָּנוּ
  choice: nagtakwil sa amin
  rationale: Tuwirang ipinahahayag ng זנח ang pagtatakwil o pag-ayaw. Pinananatili ng “nagtakwil” ang bigat ng panaghoy nang hindi ito pinahihina bilang pakiramdam lamang.
- source_word: תֵצֵא
  choice: lumalabas
  rationale: Pinananatili nito ang literal na larawan ng paglabas, na sa kontekstong militar ay tumutukoy sa paglabas upang makipaglaban; nililinaw ito sa talababa.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: kasama ng aming mga hukbo
  rationale: Sa konteksto, ang צבאות ay mga puwersang militar. Ang “kasama ng aming mga hukbo” ay natural na nagpapahayag ng pakikisama ng Diyos sa labanan.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos. Inuulit ang “O Diyos” gaya ng pag-uulit sa Hebreo.
theological_decisions:
- issue: Ang pagtatakwil ng Diyos at ang hindi niya pagsama sa labanan
  choice: Panatilihin bilang tuwirang pahayag sa loob ng isang retorikal na tanong
  alternative: Palambutin bilang “hinayaan mo kaming maitakwil” o “tila itinakwil mo kami”
  rationale: Tuwirang iniuugnay ng Hebreo sa Diyos ang pagtatakwil at hindi paglabas kasama ng mga hukbo. Bilang panaghoy, dapat manatili ang teolohikal na tensiyon sa halip na ipaliwanag o palambutin ito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang anyo ng retorikal na tanong, ang dalawang pagtawag na “O Diyos,” at ang matapang na pananalita ng panaghoy.
