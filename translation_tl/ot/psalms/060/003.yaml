  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: tl
  text: 'Ipinaranas mo sa iyong bayan ang matinding hirap;

    pinainom mo kami ng alak na nagpapasuray-suray sa amin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alak ng pagsuray-suray,” “alak na nagpapahilo,” o “alak ng pagkalito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: Ipinaranas mo
  rationale: Ang Hiphil ng ראה ay literal na ‘ipakita’ o ‘pangyaring makita,’ ngunit sa kontekstong ito ay tumutukoy sa pagpaparanas. Mas natural ito sa modernong Tagalog nang hindi inaalis ang pananagutan ng kumikilos.
- source_word: עַמְּךָ
  choice: sa iyong bayan
  rationale: Ang עַם ay tumutukoy sa sambayanang kinikilala bilang bayan ng Diyos. Ang ‘iyong bayan’ ay natural at marangal sa kontekstong ito.
- source_word: קָשָׁה
  choice: ang matinding hirap
  rationale: Ginamit ang pang-uri bilang substantibo para sa isang mabigat o malupit na karanasan. Iniiwasan ng ‘matinding hirap’ ang di-natural na literalismong ‘mahihirap na bagay’ habang pinananatili ang tindi.
- source_word: הִשְׁקִיתָנוּ
  choice: pinainom mo kami
  rationale: Ang Hiphil ng שקה ay ‘painumin’ o ‘bigyan ng maiinom.’ Tuwirang naipapahayag ng ‘pinainom mo kami’ ang causative at ipinataw na karanasan.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwang kahulugan nito ang alak na mula sa ubas, ngunit dito ay gumaganap bilang metapora. Ang pangkalahatang salitang ‘alak’ ang pinakanatural sa Tagalog.
- source_word: תַּרְעֵלָה
  choice: na nagpapasuray-suray sa amin
  rationale: Ang pangngalan ay nagpapahiwatig ng pagkahilo, pagsuray, o pagkalito na gaya ng pagkalasing. Ginawang sugnay upang maging malinaw at natural sa Tagalog, habang pinananatili ang larawan ng alak.
theological_decisions:
- issue: Metaporikal na diwa ng alak
  choice: Pinanatili ang larawan ng Diyos na nagpapainom sa kanyang bayan ng alak na nagpapasuray-suray, bilang metapora ng ipinataw na matinding hirap at pagkabalisa.
  alternative: Tahasang palitan ang larawan ng alak ng ‘pagdurusa,’ o unawain ito bilang literal na pag-inom ng alak.
  rationale: Iniuugnay ng paralelismo ang alak sa matinding hirap, ngunit hindi dapat alisin sa salin ang mismong metapora o paliitin ang kahulugan nito sa isang ganap na paliwanag lamang.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘ipinaranas’ sa halip na literal na ‘ipinakita’ upang natural na maipahayag ang Hebreong idyoma; pinanatili naman ang matinding metapora ng alak at pagsuray.
