  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: tl
  text: Upang mailigtas ang mga minamahal mo, iligtas mo sa pamamagitan ng iyong kanang kamay, at sagutin mo kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ayon sa nakasulat na anyo ng tekstong Hebreo: “at sagutin mo ako”; ayon sa tradisyonal na binabasang anyo: “at sagutin mo kami.”'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: Upang
  rationale: Likas at tuwirang nagpapahayag ng layunin sa makabagong Filipino.
- source_word: יֵחָלְצוּן
  choice: mailigtas
  rationale: Ang Niphal ng חלץ ay tumutukoy sa pagkalas o pagkasagip mula sa panganib; ang “mailigtas” ay malinaw at angkop sa panalangin.
- source_word: יְדִידֶיךָ
  choice: ang mga minamahal mo
  rationale: Pinananatili ang maramihan at ang diwa ng matalik na pagmamahal nang natural sa Filipino.
- source_word: הוֹשִׁיעָה
  choice: iligtas mo kami
  rationale: Ang pautos na anyo ng ישׁע ay isang tuwirang pakiusap para sa pagliligtas. Idinagdag ang layong “kami” ayon sa mga minamahal na inilalarawan sa unang sugnay, gaya ng hinihingi ng likas na Filipino.
- source_word: יְמִינְךָ
  choice: sa pamamagitan ng iyong kanang kamay
  rationale: Ipinapakita ang paraan ng pagliligtas at pinananatili ang mahalagang larawang Hebreo ng makapangyarihang kanang kamay ng Diyos.
- source_word: ועננו
  choice: at sagutin mo kami
  rationale: Sinusunod ang Qere וַעֲנֵנוּ, na may unang panauhang maramihang layon; inilalahad sa talababa ang Ketiv na maaaring basahing “ako.”
theological_decisions:
- issue: Larawan ng kanang kamay ng Diyos
  choice: Pinanatili ang “sa pamamagitan ng iyong kanang kamay.”
  alternative: “sa pamamagitan ng iyong kapangyarihan”
  rationale: Mahalaga sa tula at teolohiya ang antropomorpikong larawan; hindi ito dapat patagin bilang abstraktong kapangyarihan lamang.
- issue: Layon ng huling pandiwa
  choice: “sagutin mo kami” ayon sa Masoretic Qere
  alternative: “sagutin mo ako” ayon sa Ketiv
  rationale: 'Ang tradisyong Masoretic ay may pagkakaiba ng nakasulat at binabasa: ang Qere ay maramihan at umaayon sa panlahatang pakiusap, samantalang ang Ketiv ay isahan. Pinanatili ang tunay na tekstuwal na tensiyon sa talababa.'
translation_notes:
  register: Makabago, malinaw, at marangal na wikang panalangin. Ginamit ang “mga minamahal mo” upang mapanatili ang maramihan at malasakit ng Hebreo; iniwasan ang labis na arkaikong pananalita.
