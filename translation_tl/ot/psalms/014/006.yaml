id: PSA.14.6
reference: Psalms 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: tl
  text: Ipinapahiya ninyo ang payo ng dukha[a], sapagkat si Yahweh ang kanyang kanlungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinapahiya ninyo ang balak ng dukha,” kung ang עֲצַת עָנִי ay inuunawang “ang payo o balak ng taong dukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: ang payo ng
  rationale: Ang construct na עֲצַת ay maaaring tumukoy sa payo, balak, o layunin. Pinananatili ng “payo” ang malawak na diwa nang hindi tiyak na nililimitahan ito sa isang panloob na balak.
- source_word: עָנִי
  choice: dukha
  rationale: Ang עָנִי ay tumutukoy sa taong mahirap, api, o naghihirap. Ang “dukha” ay maikli, marangal, at angkop sa salmiko at panlipunang konteksto.
- source_word: תָבִישׁוּ
  choice: Ipinapahiya ninyo
  rationale: Ito ay Hiphil, ikalawang panauhang maramihan, ng בוש, na nangangahulugang magdulot ng kahihiyan o ilagay sa kahihiyan. Malinaw na pinananatili ng “ipinapahiya ninyo” ang sanhi at maramihang kausap.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ng “sapagkat” ang tahasang ugnayang sanhi na ipinahihiwatig ng כִּי, kahit may tensiyon sa lohikal na relasyon ng dalawang sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: מַחְסֵהוּ
  choice: ang kanyang kanlungan
  rationale: Ang מַחְסֶה ay kanlungan o silungan, at ang hulaping 3ms ay tumutukoy sa dukha. Likas at malinaw sa Tagalog ang “kanyang kanlungan.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng כִּי sa dalawang sugnay
  choice: sapagkat
  alternative: ngunit
  rationale: Ang כִּי ay karaniwang sanhi o paliwanag. Bagaman maaaring tila mas malinaw sa konteksto ang isang pagsalungat, hindi iyon tahasang minarkahan ng Hebreo; kaya pinananatili ang tunay na tensiyon sa pamamagitan ng “sapagkat.”
translation_notes:
  register: Modernong Filipino na may marangal at salmikong himig. Ginamit ang “dukha” at “kanlungan” bilang mga salitang madaling maunawaan ngunit angkop sa panulaang panrelihiyon. Pinanatili ang ikalawang panauhang maramihan sa “ninyo” at ang sanhi sa “sapagkat,” nang hindi nilulutas ang tensiyon ng Hebreong pangungusap.
