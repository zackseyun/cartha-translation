base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng musika.[a] Ni David.[b]


    Sinasabi ng hangal sa kanyang puso,


    “Walang Diyos.”


    Sila''y naging tiwali; gumawa sila ng kasuklam-suklam na bagay.[c]


    Walang sinumang gumagawa ng mabuti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Para sa direktor ng musika” o “Para sa pinuno ng mga mang-aawit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Ni David” sa pamagat ay maaari ring mangahulugang “mula kay David,” “para kay David,” o “tungkol kay David.”
    reason: lexical_alternative
  - marker: c
    text: Mula sa isahang “ang hangal,” biglang lumilipat ang Hebreo sa maramihang “sila,” kaya maaaring kumatawan ang isang hangal sa buong pangkat na katulad niya.
    reason: grammatical_shift
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Ipinahihiwatig ng anyo ang isang taong namamahala sa pagtatanghal ng musika; natural ito sa modernong Filipino nang hindi nililimitahan sa koro lamang.
- source_word: נָבָל
  choice: hangal
  rationale: Tumutukoy ito hindi lamang sa kakulangan ng talino kundi sa taong may moral at espirituwal na kahangalan; pinananatili ng “hangal” ang lawak na iyon.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Pinananatili ang Hebreong larawan ng puso bilang sentro ng panloob na pag-iisip at pagpapasiya.
- source_word: הִשְׁחִיתוּ
  choice: Tiwali sila
  rationale: Malinaw at natural na inilalarawan ang kanilang nasirang kalagayang moral, habang pinananatili ang biglang paglipat sa maramihan.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: kasuklam-suklam ang kanilang mga gawa
  rationale: Ipinapahayag sa natural na Filipino ang ideya ng paggawa ng mga karima-rimarim o kasuklam-suklam na kilos nang hindi dinaragdagan ang uri ng kasalanan.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Walang sinumang gumagawa ng mabuti
  rationale: Tapat na pinananatili ang ganap na negatibong pahayag at malinaw na ipinapahayag ang di-tiyak na gumagawa.
theological_decisions:
- issue: Ang pahayag na “Walang Diyos”
  choice: Walang Diyos
  alternative: Walang umiiral na Diyos
  rationale: Pinananatili ang maikli at matinding pahayag ng Hebreo at hindi tinutukoy kung ito ay pilosopikal na pagtanggi o praktikal na pamumuhay na parang walang Diyos.
- issue: Paglipat mula sa iisang hangal tungo sa maramihan
  choice: Sinabi ng hangal … Tiwali sila
  alternative: Sinasabi ng mga hangal … Tiwali sila
  rationale: Pinananatili ang tunay na gramatikal na paglipat ng Hebreo at ang tensiyon sa pagitan ng kinatawang indibidwal at ng pangkat na kinakatawan niya.
- issue: Saklaw ng “walang sinumang gumagawa ng mabuti”
  choice: Walang sinumang gumagawa ng mabuti
  alternative: Wala sa kanila ang gumagawa ng mabuti
  rationale: Hindi nililimitahan nang tahasan ang saklaw sa naunang pangkat, sapagkat hindi iyon tahasang sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tagapangasiwa ng musika” sa halip na mas teknikal o makalumang katawagan. Pinanatili ang maikling mga linya, ang larawang “sa kanyang puso,” at ang biglang paglipat mula isahan tungo sa maramihan.
