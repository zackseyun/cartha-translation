    issue: '"Sinabi" ay pangnagdaang aspekto sa isang pangkalahatan o kawikaang pahayag.'
    rationale: Bagaman posible ang perpektong Hebreo, ang gamit nito rito ay karaniwang isinasaling "says"; mas natural at mas tapat sa gampaning ito ang "Sinasabi."
  - severity: low
    issue: '"Tiwali sila at kasuklam-suklam ang kanilang mga gawa" ay bahagyang nagpapalabo sa pandiwang Hebreo na tumutukoy sa kanilang masamang pagkilos.'
    rationale: Ang "Sila'y naging tiwali; gumawa sila ng kasuklam-suklam na bagay" ay malinaw na pinananatili ang dalawang pandiwang maramihan at ang isahang "deed" nang natural sa Filipino.
