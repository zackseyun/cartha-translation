  naturalness: Natural at marangal ang Filipino. Ang rebisyon ay nagpapakinis sa aspekto ng pandiwa at ginagawang mas tuwiran ang "gumawa sila ng kasuklam-suklam na bagay."
  terminology: Ang "hangal," "Diyos," "puso," at "mabuti" ay angkop. Pinanatili ang "tagapangasiwa ng musika" bilang malawak na salin ng terminong pang-pamagat at ang "Ni David" bilang maikling pamagat na may talababa para sa saklaw nito.
  issues:
