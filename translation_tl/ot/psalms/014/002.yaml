base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: tl
  text: 'Dumudungaw si Yahweh mula sa langit

    sa mga anak ng tao[a],

    upang tingnan kung may nakauunawa,

    na humahanap sa Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng tao,” isang kinatawang pananalita na tumutukoy sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מִשָּׁמַיִם הִשְׁקִיף
  choice: Dumudungaw ... mula sa langit
  rationale: Likas na ipinahahayag ng “dumudungaw” ang pagtingin mula sa isang mataas na dako; ang “langit” ay natural na katumbas sa Filipino sa kontekstong ito.
- source_word: בְּנֵי אָדָם
  choice: mga anak ng tao
  rationale: Pinananatili ang larawan ng idyomang Hebreo habang ipinapaliwanag sa talababa na tumutukoy ito sa sangkatauhan sa pangkalahatan.
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: upang tingnan kung may
  rationale: Tuwirang pinananatili ang layunin ng pagdungaw at ang di-tiyak na tanong kung mayroon.
- source_word: מַשְׂכִּיל
  choice: nakauunawa
  rationale: Ipinahahayag ang pag-unawa o kabatirang tinutukoy ng ugat na שכל nang hindi ito nililimitahan sa teknikal na katawagang pangkarunungan.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: humahanap sa Diyos
  rationale: Natural at tuwirang salin ng aktibong paghahanap sa Diyos.
theological_decisions:
- issue: Ang ugnayan ng מַשְׂכִּיל at דֹּרֵשׁ
  choice: “may nakauunawa, na humahanap sa Diyos” bilang magkaugnay na paglalarawan
  alternative: “may nakauunawa—may humahanap sa Diyos” bilang dalawang magkatulad na sugnay
  rationale: Walang pangatnig sa Hebreo, kaya maaaring basahin ang ikalawang participle bilang karagdagang paglalarawan sa taong nakauunawa. Pinananatili ng kuwit at “na” ang malapit na ugnayan nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ang kinatawang pananalitang בְּנֵי אָדָם
  choice: mga anak ng tao
  alternative: sangkatauhan / mga tao
  rationale: Pinananatili sa pangunahing teksto ang kongkretong idyomang Hebreo, habang nililinaw sa talababa ang pangkalahatang saklaw nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dumudungaw” upang mapanatili ang larawang pagtingin mula sa itaas, at inayos ang mga linya ayon sa paralelismong patula.
