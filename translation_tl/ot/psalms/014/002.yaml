  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili ang pangalang Yahweh, ang pagtingin mula sa langit, ang saklaw na “mga anak ng tao,” at ang layuning siyasatin kung mayroon bang taong nakauunawa at humahanap sa Diyos. Ang “na humahanap sa Diyos” ay makatwirang pagbasa sa ikalawang participle bilang kaugnay na paglalarawan ng taong nakauunawa.'
