base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: tl
  text: 'Para sa tagapanguna ng mga mang-aawit.[a] Ukol kay David.[b]


    Sinasabi ng hangal sa kanyang puso,


    “Walang Diyos.”


    Sila ay tiwali; kasuklam-suklam ang kanilang mga gawa.[c]


    Walang sinumang gumagawa ng mabuti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Para sa tagapangasiwa ng musika.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Ukol kay David” ay maaari ring mangahulugang “ni David” o “para kay David” sa pamagat ng salmo.
    reason: lexical_alternative
  - marker: c
    text: Mula sa isahang “ang hangal,” lumilipat ang Hebreo sa maramihang “sila,” mula sa isang kinatawang tao tungo sa pangkat na kanyang kinakatawan.
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Ipinahihiwatig ng katawagan sa pamagat ang taong namamahala sa pagtatanghal ng awit. Malinaw ito sa karaniwang mambabasa habang pinananatili ang tungkulin ng tinutukoy.
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Maaaring tumukoy ang לְ sa may-akda, kaugnayan, o pinag-ukulan. Hindi nilulutas ng “Ukol kay David” ang tunay na kalabuan ng Hebreo.
- source_word: נָבָל
  choice: ang hangal
  rationale: Hindi lamang kakulangan sa talino ang tinutukoy kundi moral at espirituwal na kahangalan. Pinananatili rin nito ang kinatawang isahan.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Sa Hebreong pananaw, saklaw ng “puso” ang panloob na pag-iisip at pagpapasya; natural at mahalaga ring panatilihin ang larawan.
- source_word: אֵין אֱלֹהִים
  choice: Walang Diyos
  rationale: Ito ang tuwiran at maikling pahayag ng pag-iral na nasa Hebreo, nang hindi ito ginagawang paliwanag lamang tungkol sa paghatol o kabuluhan ng Diyos.
- source_word: הִשְׁחִיתוּ
  choice: Masasama sila
  rationale: Ipinapahayag ng pandiwa ang pagiging tiwali o napasama. Ang “masasama” ay natural na Filipino at malinaw na naghahatid ng kalagayang moral.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: kasuklam-suklam ang kanilang mga gawa
  rationale: Pinagsasama ng parirala ang pagkilos nang kasuklam-suklam at ang “gawa/pag-uugali.” Idiomatiko ito sa Filipino at hindi nagdaragdag ng tiyak na uri ng kasamaan.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Walang sinumang gumagawa ng mabuti
  rationale: Malapit ito sa balangkas ng Hebreo at malinaw na ipinahahayag ang kawalan ng gumagawa ng mabuti.
theological_decisions:
- issue: Saklaw ng pagtanggi sa אֵין אֱלֹהִים
  choice: “Walang Diyos”—isang tuwirang pagtanggi sa pag-iral ng Diyos
  alternative: “Hindi mahalaga ang Diyos” o “Walang paghatol” bilang praktikal na ateismo
  rationale: Pinakamalapit sa tahasang anyo ng Hebreo ang “Walang Diyos.” Maaaring kasama sa konteksto ang praktikal na pamumuhay na walang pagkilala sa Diyos, ngunit hindi iyon dapat ipalit sa mismong pahayag.
- issue: Paglipat mula sa isahang נָבָל tungo sa maramihang mga pandiwa
  choice: Panatilihin ang “ang hangal” at pagkatapos ay “sila”
  alternative: Gawing isahan ang lahat o gawing maramihan ang pambungad
  rationale: Sadyang pinananatili nito ang paglipat ng Hebreo mula sa isang kinatawang hangal tungo sa pangkat na kanyang kinakatawan, sa halip na pakinisin ang tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tagapanguna ng mga mang-aawit” sa halip na mas teknikal na katawagan, at pinanatili ang maikli at matinding himig ng talata. Lahat ng panandang talababa ay nasa pangunahing teksto.
