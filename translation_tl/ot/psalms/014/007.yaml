base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: tl
  text: Sana’y magmula sa Zion ang kaligtasan ng Israel! Kapag ipinanumbalik ni Yahweh ang kapakanan ng kanyang bayan[a], magagalak si Jacob; magsasaya ang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “kapag ibinalik ni Yahweh ang pagkabihag ng kanyang bayan.” Ang idyomang Hebreo ay madalas na nangangahulugang ipanumbalik ang kapakanan ng isang bayan o baligtarin ang kanilang kasawian.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Sana’y dumating
  rationale: Ang idyomang Hebreo ay nagpapahayag ng matinding pagnanais, hindi karaniwang literal na tanong. Likas itong naipahahayag sa modernong Tagalog sa pamamagitan ng “Sana’y,” habang ang “dumating” ay nagbibigay ng pandiwang hinihingi ng pangungusap.
- source_word: מִצִּיּוֹן
  choice: mula sa Zion
  rationale: Ang מִן ay tumutukoy sa pinagmulan; pinanatili ang kinagawiang anyo ng pangalang “Zion.”
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: ang kaligtasan ng Israel
  rationale: Pinananatili ng “kaligtasan” ang malawak na saklaw ng יְשׁוּעָה—kabilang ang pagliligtas at pagpapalaya—at malinaw na naihahayag ng pariralang “ng Israel” ang ugnayang construct sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: Kapag ibinalik ni Yahweh sa mabuting kalagayan ang kanyang bayan
  rationale: Ang kombinasyong שׁוּב שְׁבוּת ay isang idyomang karaniwang tumutukoy sa pagpapanumbalik ng kalagayan o pagbabaligtad ng kasawian, hindi lamang sa literal na pagbabalik mula sa pagkabihag.
- source_word: יָגֵל
  choice: magagalak
  rationale: Ipinahahayag nito ang masiglang kagalakan at ang aspektong panghinaharap o kasunod ng pagpapanumbalik.
- source_word: יַעֲקֹב
  choice: ang Jacob
  rationale: Ang pangalang Jacob ay ginagamit dito bilang patulang katawagan sa buong bayan; ang pantukoy ay tumutulong na ipakita ang kolektibong gamit nito sa Tagalog.
- source_word: יִשְׂמַח
  choice: magsasaya
  rationale: Pinananatili nito ang parallelism ng dalawang salitang tumutukoy sa kagalakan, habang iniiwasang ulitin lamang ang “magagalak.”
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinanatili ang pangalang Israel bilang kolektibong katawagan sa bayan, kapantay ng “Jacob” sa naunang linya.
theological_decisions:
- issue: Kahulugan ng idyomang שׁוּב שְׁבוּת
  choice: ibinalik ... sa mabuting kalagayan ang kanyang bayan
  alternative: ibinalik ang mga bihag ng kanyang bayan / ibinalik mula sa pagkabihag ang kanyang bayan
  rationale: Hindi tahasang inilalagay ng salmo ang pangyayari sa isang partikular na panahon ng pagkatapon. Kaya pinananatili sa pangunahing teksto ang mas malawak na idyomatikong kahulugan, samantalang inilalahad sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang patulang parallelism ng “Jacob” at “Israel,” gayundin ang dalawang magkaibang pandiwa ng kagalakan. Ang “Sana’y” ay natural na optatibong pahayag sa Tagalog at tumutugma sa pananabik ng Hebreo.
