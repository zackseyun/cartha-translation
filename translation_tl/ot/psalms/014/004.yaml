base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: tl
  text: Hindi ba alam ng lahat ng gumagawa ng kasamaan—silang lumalamon sa aking bayan na parang kumakain ng tinapay[a], at hindi tumatawag kay Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “kumakain sa aking bayan; kumakain sila ng tinapay”—isang idyomang naghahambing sa paglamon nila sa aking bayan sa karaniwang pagkain ng tinapay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Hindi ba nakaaalam
  rationale: Pinananatili ang retorikal na tanong na umaasang oo ang sagot. Ang “nakaaalam” ay likas sa Filipino at maaaring tumukoy sa pagkaalam o pagkilala nang hindi nilulutas ang saklaw nito.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: ang lahat ng gumagawa ng kasamaan
  rationale: Pinananatili ang participyal na diwa ng mga taong patuloy na gumagawa ng masama, sa malinaw at makabagong pananalita.
- source_word: אֹכְלֵי עַמִּי
  choice: silang lumalamon sa aking bayan
  rationale: Ang “lumalamon” ay nagpapanatili sa marahas at matalinghagang larawan ng pagkain sa bayan, habang natural sa Filipino.
- source_word: אָכְלוּ לֶחֶם
  choice: na parang kumakain ng tinapay
  rationale: Ginagawang malinaw ang ipinahihiwatig na paghahambing sa Hebreo nang hindi inaalis ang larawan ng karaniwang pagkain ng tinapay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לֹא קָרָאוּ
  choice: hindi tumatawag kay Yahweh
  rationale: Sa ganitong konteksto, ang קרא na may banal na pangalan ay tumutukoy sa pagtawag sa Diyos sa panalangin o pagsamba; pinananatiling maikli ang salin upang huwag paliitin ang kahulugan.
theological_decisions:
- issue: Paglalarawan sa kaugnayan ng mga gumagawa ng kasamaan sa bayan ng Diyos
  choice: lumalamon sa aking bayan
  alternative: inaapi ang aking bayan
  rationale: Pinananatili ang tahasang talinghaga ng Hebreo at ang bigat nito, sa halip na ipaliwanag lamang ito bilang pang-aapi.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil personal na pangalan ang nasa tekstong Hebreo, pinananatili itong pangalan at hindi ginagawang titulo.
- issue: Kahulugan ng לֹא קָרָאוּ
  choice: hindi tumatawag kay Yahweh
  alternative: hindi nananalangin kay Yahweh
  rationale: Ang mas malawak na “tumatawag” ay maaaring sumaklaw sa panalangin, pagsamba, at paghingi ng tulong, kaya hindi nililimitahan ang teolohikal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עַמִּי at “lumalamon” upang mapanatili ang matinding talinghaga. Nasa pangunahing teksto ang panandang [a].
