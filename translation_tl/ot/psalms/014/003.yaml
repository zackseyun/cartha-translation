  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: tl
  text: Lahat ay lumihis; sama-sama silang naging tiwali.[a] Walang gumagawa ng mabuti, ni isa man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naging marumi” o “naging bulok.” Ipinahihiwatig ng pandiwang Hebreo ang pagiging sira o tiwali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Lahat
  rationale: Komprehensibong tumutukoy sa mga tao sa konteksto at pinananatili ang pangkalahatang saklaw ng pahayag.
- source_word: סָר
  choice: lumihis
  rationale: Likas na katumbas ng pandiwang nangangahulugang lumihis o lumayo. Bagaman isahan ang anyong Hebreo kasunod ng kolektibong simuno, ang “Lahat ay lumihis” ay natural sa Tagalog.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Pinananatili ang kolektibong diwa ng kilos nang hindi nagdaragdag ng pagpapakahulugan.
- source_word: נֶאֱלָחוּ
  choice: naging tiwali
  rationale: Ipinahahayag ng anyong Niphal ang pagdating sa kalagayang sira o corrupt. Ang “naging tiwali” ay natural, marangal, at angkop sa moral na konteksto, habang ang ibang posibleng kulay ng kahulugan ay inilalagay sa talababa.
- source_word: אֵין
  choice: Walang
  rationale: Natural na Tagalog para sa mariing pagtanggi sa pag-iral ng sinumang gumagawa ng mabuti.
- source_word: עֹשֵׂה טוֹב
  choice: gumagawa ng mabuti
  rationale: Tapat at idiomatikong paglalarawan sa patuloy o kinaugaliang paggawa ng mabuti.
- source_word: גַּם אֶחָד
  choice: kahit isa
  rationale: 'Malinaw na pinananatili ang mariing puwersa ng negasyon: wala ni isang eksepsiyon.'
theological_decisions:
- issue: Saklaw ng pangkalahatang pahayag tungkol sa katiwalian ng tao
  choice: Panatilihin ang ganap na saklaw sa “Lahat,” “Walang,” at “kahit isa.”
  alternative: Gawing pangkalahatang paglalarawan lamang sa maraming tao
  rationale: Komprehensibo at mariin ang mismong wikang Hebreo. Hindi ito dapat palambutin o paliitin, ngunit hindi rin dinaragdagan ng mga doktrinal na pormulasyong wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikli at mariing pagkakabuo upang mapanatili ang paralelismo at ganap na saklaw ng Hebreong tula. Inilagay ang talababa pagkatapos ng “tiwali,” ang salitang aktuwal nitong ipinapaliwanag.
