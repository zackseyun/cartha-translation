  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: tl
  text: Doon ay labis silang nasindak[a], sapagkat ang Diyos ay kasama ng salinlahi ng mga matuwid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “natakot sila ng takot,” isang mariing pahayag na nangangahulugang sinakmal sila ng matinding sindak.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ang Diyos ay nasa gitna ng salinlahi ng mga matuwid.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: Pinananatili ang maikli at matalinghagang pagtukoy ng Hebreo sa tagpo kung saan sumapit ang matinding takot.
- source_word: פָּחֲדוּ פָחַד
  choice: labis silang nasindak
  rationale: Ang pandiwa at kauring pangngalan ay bumubuo ng mariing pahayag, literal na ‘natakot sila ng takot.’ Likas sa makabagong Filipino ang ‘labis silang nasindak’ at naipahahayag nito ang tindi nang hindi nagiging kahoy ang salin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang pagkasindak at angkop sa marangal na himig ng tula.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maramihan ang anyo ng salitang Hebreo, tumutukoy ito rito sa Diyos ng Israel bilang iisang Diyos.
- source_word: בְּדוֹר
  choice: kasama ng salinlahi
  rationale: Maaaring ipahiwatig ng pang-ukol na ב ang pagiging nasa gitna o kasama. Malinaw na ipinahahayag ng ‘kasama ng’ ang presensiya ng Diyos sa piling ng mga matuwid, habang inilalahad sa talababa ang malapit na alternatibo.
- source_word: צַדִּיק
  choice: ng mga matuwid
  rationale: Isahan ang anyong Hebreo ngunit kolektibo ang gamit kaugnay ng ‘salinlahi’; kaya likas sa Filipino ang maramihang ‘mga matuwid.’
theological_decisions:
- issue: Kaugnayan ng Diyos sa mga matuwid sa בְּדוֹר צַדִּיק
  choice: ang Diyos ay kasama ng salinlahi ng mga matuwid
  alternative: ang Diyos ay nasa gitna ng salinlahi ng mga matuwid
  rationale: Pinananatili ng pangunahing salin ang diwa ng presensiya at pakikiisa ng Diyos nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag. Dahil saklaw rin ng pang-ukol na Hebreo ang ‘nasa gitna,’ inilalahad iyon sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang maikli at makatang daloy. Ginamit ang ‘salinlahi’ para sa kolektibong דּוֹר at ‘nasindak’ upang maihatid ang mariing takot ng Hebreo.
