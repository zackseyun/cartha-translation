  text: שִׁגָּי֗וֹן לְ/דָ֫וִ֥ד אֲשֶׁר שָׁ֥ר לַ/יהוָ֑ה עַל דִּבְרֵי כ֝֗וּשׁ בֶּן יְמִינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/000.yaml
  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: tl
  text: Isang Shigayon ni David[a], na inawit niya kay Yahweh tungkol sa mga salita ni Cush, isang Benjaminita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isa itong teknikal na katawagang pangmusika o patula, gaya ng “panaghoy” o “masidhing awit”; bihira ang salitang Hebreong Shigayon at hindi tiyak ang kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Shigayon
  rationale: Bihira at hindi tiyak ang kahulugan ng terminong Hebreo. Pinanatili ito bilang teknikal na katawagang patula o pangmusika, ngunit iniangkop ang baybay sa makabagong Filipino; nasa talababa ang mga posibleng kahulugan.
- source_word: לְדָוִד
  choice: ni David
  rationale: Sa mga pamagat ng salmo, maaaring tumukoy ang ל sa may-akda, kaugnayan, o pinag-alayan. Ang “ni David” ay maikli at likas sa Filipino at hindi tahasang naglilimita sa kahulugan sa “isinulat ni David.”
- source_word: אֲשֶׁר שָׁר
  choice: na inawit niya
  rationale: Tuwirang ipinapahayag nito ang nakaraang kilos ng pandiwang שׁיר at malinaw na inuugnay ang panghalip kay David.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginamit ang “kay” bilang likas na pananda sa Filipino para sa personal na pangalan ng pinatutungkulan ng awit.
- source_word: עַל
  choice: tungkol sa
  rationale: Maaaring tumukoy ang עַל sa paksa o okasyon. Pinananatili ng “tungkol sa” ang malawak na saklaw nito nang hindi ito ipinapakahulugang tiyak na sanhi.
- source_word: דִּבְרֵי
  choice: mga salita ni
  rationale: Ito ang pinakapormal at tuwirang katumbas ng pangmaramihang anyo ng דָּבָר. Hindi ipinilit ang mas tiyak ngunit interpretibong “mga paratang” o “usapin.”
- source_word: כּוּשׁ
  choice: Cush
  rationale: Pangalang pantangi ito at pinanatili sa transliterasyong madaling makilala mula sa tekstong Hebreo.
- source_word: בֶּן יְמִינִי
  choice: isang Benjaminita
  rationale: Idyomatikong tumutukoy ang parirala sa isang taong mula sa lipi ni Benjamin. Malinaw at likas sa Filipino ang “isang Benjaminita.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalang tipan na יְהוָה ang tuwirang nasa tekstong Hebreo. Pinanatili ang “Yahweh” bilang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at pormulang anyo ng pamagat ng salmo, pati ang mga tunay na kalabuan sa שִׁגָּיוֹן, לְדָוִד, עַל, at דִּבְרֵי.
