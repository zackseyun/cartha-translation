  source_fidelity: 'Tapat ang salin sa Hebreong superskripsiyon: napapanatili ang teknikal at di-tiyak na terminong “Shigayon,” ang malawak na ugnayan ng “ni David,” ang nakaraang kilos sa “na inawit niya,” ang pangalang Yahweh, at ang hindi masyadong interpretibong “tungkol sa mga salita ni Cush.” Ang “isang Benjaminita” ay wastong idiomatikong pagtukoy sa בֶּן־יְמִינִי bilang taong mula sa Benjamin.'
