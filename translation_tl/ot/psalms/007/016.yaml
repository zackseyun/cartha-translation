  naturalness: Natural at marangal sa makabagong Filipino ang binagong paralelismong “Ang kasamaan niya ay bumabalik ...; at ang karahasan niya ay bumababa ...”. Ang “tuktok ng ulo niya” ay malinaw at mas natural kaysa sa teknikal na “bumbunan” bilang pangunahing teksto.
