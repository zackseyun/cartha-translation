base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: tl
  text: 'Ang kasamaan niya ay bumabalik sa sarili niyang ulo[a];

    at ang karahasan niya ay bumababa sa tuktok ng ulo niya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kapinsalaan niya” o “ang masamang balak niya.” Maaaring tumukoy ang Hebreong עָמָל sa hirap, kapinsalaan, o masamang gawa ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “sa bumbunan niya.” Ang Hebreong קָדְקֹד ay tumutukoy sa tuktok o bumbunan ng ulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: bumabalik
  rationale: Ipinahihiwatig ng Qal imperfect ng שׁוב na ang ginawang masama ng taong ito ay bumabalik sa kaniya; pinananatili ng “bumabalik” ang larawan ng pagganti o pagbalik ng bunga ng gawa.
- source_word: עֲמָלוֹ
  choice: ang kasamaang ginawa niya
  rationale: Sa kontekstong ito, ang עָמָל ay hindi karaniwang pagpapagal kundi kapinsalaan o masamang gawa. Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapakitang sarili niyang gawa ang bumabalik sa kaniya.
- source_word: בְרֹאשׁוֹ
  choice: sa sarili niyang ulo
  rationale: Pinananatili nito ang kongkretong larawan at ang reflexive na diwa na sa mismong gumawa bumabalik ang bunga.
- source_word: וְעַל
  choice: sa
  rationale: Sa ikalawang taludtod, natural na naihahatid ng “sa” ang Hebreong pang-ukol habang nananatili ang paralelismo.
- source_word: קָדְקֳדוֹ
  choice: tuktok ng sarili niyang ulo
  rationale: Ang קָדְקֹד ay tumutukoy sa tuktok o bumbunan ng ulo. Ang “tuktok ng ulo” ay malinaw, dignipikado, at karaniwan kaysa sa mas teknikal o di-likas na katumbas.
- source_word: חֲמָסוֹ
  choice: ang karahasan niya
  rationale: Ang חָמָס ay tuwirang tumutukoy sa karahasan o marahas na kasamaan; pinananatili ng “karahasan” ang bigat ng salitang Hebreo.
- source_word: יֵרֵד
  choice: bumabagsak
  rationale: Bagaman literal na “bumababa,” mas natural sa Tagalog ang “bumabagsak” para sa karahasang dumarating sa ulo, at pinananatili nito ang patayong larawan.
theological_decisions:
- issue: Larawan ng makatang pagganti
  choice: Inilalarawan ang sariling masamang gawa at karahasan ng masama bilang bumabalik at bumabagsak sa kaniya.
  alternative: Maaaring unawain ang עָמָל nang mas pangkalahatan bilang hirap o kaguluhan na bumabalik sa isang tao.
  rationale: Magkatugma ang dalawang taludtod—ang kaniyang עָמָל at חָמָס ay kapuwa dumarating sa sarili niyang ulo—kaya malinaw ang diwa ng makatang katarungan, nang walang idinaragdag na sistematikong doktrina.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Pinanatili ang dalawang magkatulad na larawan ng ulo at ang pagbalik ng bunga ng karahasan, habang iniwasan ang salitang masyadong teknikal o lipas.
