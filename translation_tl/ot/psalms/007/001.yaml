  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: tl
  text: Yahweh, Diyos ko, sa iyo ako nagkanlong[a]; iligtas mo ako mula sa lahat ng humahabol sa akin, at sagipin mo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyo ako kumakanlong.” Sa konteksto ng panalangin, ang Hebreong perfect ay maaari ring ipahayag bilang kasalukuyang pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang itinumbas ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Ang pangngalan na may hulaping unang panauhang isahan ay likas na nangangahulugang “Diyos ko” at bahagi ng tuwirang pagtawag.
- source_word: בְּךָ
  choice: sa iyo
  rationale: Tapat at natural na katumbas ng pang-ukol na בְּ na may hulaping ikalawang panauhang panlalaki; hindi idinagdag ang “lamang” sapagkat wala ito sa Hebreo.
- source_word: חָסִיתִי
  choice: ako nagkanlong
  rationale: Ang Qal perfect ay nagpapahayag ng pagkakanlong na may bisa sa kasalukuyang panalangin. Pinananatili ng “nagkanlong” ang anyong ganap, habang inilalahad sa talababa ang posibleng kasalukuyang pagbasa.
- source_word: הוֹשִׁיעֵנִי
  choice: iligtas mo ako
  rationale: Ang Hiphil imperative ng ישׁע ay likas na “iligtas mo ako” sa konteksto ng panalangin.
- source_word: מִכָּל רֹדְפַי
  choice: mula sa lahat ng humahabol sa akin
  rationale: Ang participle ay nagpapahiwatig ng patuloy na paghabol; mas natural at hindi labis ang “humahabol sa akin” kaysa “umuusig sa akin.”
- source_word: וְהַצִּילֵנִי
  choice: at sagipin mo ako
  rationale: Ang Hiphil imperative ng נצל ay tumutukoy sa pag-agaw o pagsagip mula sa panganib. Ang “sagipin” ay nagpapanatili ng bahagyang pagkakaiba nito sa naunang “iligtas.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pangalan mismo ang ginamit sa tekstong Hebreo. Pinananatili ng “Yahweh” ang tahasang pangalang tipan nang hindi ito ginagawang titulo.
- issue: Panahunan o aspekto ng חָסִיתִי sa panalangin
  choice: sa iyo ako nagkanlong
  alternative: sa iyo ako nanganganlong
  rationale: Pinananatili sa pangunahing teksto ang perfect na anyo bilang naganap na pagkilos na may kasalukuyang kabuluhan, ngunit hindi isinasara ang posibleng pagbasa bilang kasalukuyang pagpapahayag ng pagtitiwala.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang pananalita ng panalangin. Ginamit ang magkaibang pandiwang “iligtas” at “sagipin” upang maipakita ang dalawang magkaibang pandiwa sa Hebreo nang hindi nagiging mabigat o di-likas.
