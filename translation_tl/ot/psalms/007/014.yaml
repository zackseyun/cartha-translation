  text: 'Masdan: naghihilab siya sa kasamaan, nagbubuntis ng kapahamakan, at nagsisilang ng kasinungalingan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pinagsasama-sama sa Hebreo ang mga larawan ng paghilab, pagbubuntis, at panganganak. Ang unang pandiwa ay maaari ring isaling “nagdurusa” o “namimilipit sa sakit,” at bahagyang nagsasanib ang mga diwa ng “kasamaan” at “kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Masdan
  rationale: Tuwirang pantawag-pansin na angkop sa marangal ngunit nauunawaang rehistro ng salmo.
- source_word: יְחַבֶּל
  choice: nagpapakasakit siya
  rationale: Pinananatili ang diwa ng matinding hirap o pagdaramdam na kaugnay ng paghilab, nang hindi ito ginagawang pandiwa ng paglilihi.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Ipinahahayag ang moral na kasamaan ng salita at naihihiwalay ito sa kasunod na עָמָל, bagaman may pagsasanib ang mga kahulugan.
- source_word: הָרָה
  choice: naglilihi
  rationale: Likas na salin ng paglilihi o pagdadalang-tao at pinananatili ang siksik, hindi kronolohikal na ayos ng larawang Hebreo.
- source_word: עָמָל
  choice: kapahamakan
  rationale: Tumutukoy sa mapaminsalang gulo o paghihirap na iniluluwal ng masamang gawain; mas malinaw dito kaysa sa karaniwang diwa ng 'pagod.'
- source_word: יָלַד שָׁקֶר
  choice: nagsisilang ng kasinungalingan
  rationale: Malinaw na kinukumpleto ang talinghaga ng panganganak at pinananatili ang abstraktong שָׁקֶר bilang kasinungalingan.
