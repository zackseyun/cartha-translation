base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: tl
  text: Si Yahweh ang humahatol sa mga bayan. Hatulan[a] mo ako, Yahweh, ayon sa aking katuwiran at ayon sa integridad[b] na taglay ko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Bigyan mo ako ng hatol na pabor sa akin” o “Ipahayag mong ako’y matuwid.” Sa kontekstong ito, ang “hatulan mo ako” ay maaaring mangahulugang humatol upang kilalaning matuwid ang nagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagiging walang kapintasan.”
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “na nasa ibabaw ko.” Maaari rin itong maunawaang “na nauukol sa akin.”'
    reason: source_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: יָדִין
  choice: humahatol
  rationale: Maaaring magpahayag ang anyong imperpektibo ng palagian o pangkalahatang gawain; malinaw rin nitong naiuugnay ang unang sugnay sa kasunod na pakiusap na humatol si Yahweh.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Pinananatili nito ang maramihang kolektibong diwa ng salitang Hebreo at hindi ito nililimitahan sa makabagong konsepto ng mga bansang pampolitika.
- source_word: שָׁפְטֵנִי
  choice: Hatulan mo ako
  rationale: Ito ang tuwirang kahulugan ng pautos na anyo ng שפט at pinananatili ang ugnayang leksikal nito sa naunang יָדִין. Sa konteksto, maaari rin itong humiling ng hatol na magpapatunay sa pagiging matuwid ng nagsasalita.
- source_word: כְּצִדְקִי
  choice: ayon sa aking katuwiran
  rationale: Tuwirang pinananatili ang unang-panauhang pag-angkin sa katuwiran at ang pamantayang ipinahihiwatig ng prefiks na כְּ.
- source_word: וּכְתֻמִּי
  choice: at ayon sa integridad
  rationale: Ang “integridad” ay likas sa modernong Filipino at nagpapahayag ng moral na kabuuan o pagiging walang kapintasan nang hindi kinakailangang magpahiwatig ng ganap na kawalang-kasalanan.
- source_word: עָלָי
  choice: na taglay ko
  rationale: Ang literal na “nasa ibabaw ko” ay hindi likas sa Filipino para sa isang katangiang moral. Ipinahahayag ng “taglay ko” na ang integridad ay nasa o nauukol sa nagsasalita, habang inilalagay sa talababa ang mas literal na larawan.
theological_decisions:
- issue: Kung ang pag-angkin ng salmista sa katuwiran at integridad ay dapat palambutin upang hindi magmukhang pag-angkin sa ganap na kawalang-kasalanan
  choice: Tuwirang pinanatili ang “aking katuwiran” at “integridad na taglay ko.”
  alternative: Ipaliwanag sa pangunahing teksto bilang “pagiging walang sala sa usaping ito” o “matuwid kong panig.”
  rationale: Tahasan ang unang-panauhang pag-angkin sa Hebreo. Pinananatili ng salin ang teolohikal na tensiyon at hindi ipinapasok sa teksto ang isang paliwanag na maaaring tama sa konteksto ngunit hindi hayagang binigkas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang “Yahweh,” ang hudisyal na pag-uulit ng “humahatol/Hatulan,” at ang tahasang pag-angkin ng salmista sa katuwiran at integridad. Ginawang likas sa Filipino ang idyomang עָלָי sa pamamagitan ng “na taglay ko,” na may mas literal na anyo sa talababa.
