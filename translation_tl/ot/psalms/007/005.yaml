translation:
  language: tl
  text: Nawa’y habulin ng isang kaaway ang buhay ko at maabutan ito[a]; yurakan niya sa lupa ang buhay ko at panatilihin sa alabok ang aking kaluwalhatian[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kaluluwa ko” sa halip na “ang buhay ko” (נַפְשִׁי); maaaring tumukoy ang salitang Hebreo sa sarili, kaluluwa, o buhay ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “ang aking karangalan” o “ang aking dangal” sa halip na “ang aking kaluwalhatian” (כְבוֹדִי).
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: Hayaang habulin
  rationale: Ipinapakita ang pahintulot o sumpang pansarili na ipinahihiwatig ng anyong jussive sa konteksto, habang pinananatili ang payak na larawan ng pagtugis.
- source_word: אוֹיֵב
  choice: isang kaaway
  rationale: Isahan ang pangngalan at walang tahasang pantukoy sa Hebreo; ipinananatili ng “isang kaaway” ang di-tiyak na diwa.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa konteksto ng paghabol at pag-abot, tumutukoy ang נֶפֶשׁ sa buhay o mismong tao, hindi kinakailangang sa hiwalay na di-materyal na kaluluwa.
- source_word: וְיַשֵּׂג
  choice: at abutan ito
  rationale: Likas na katumbas ng pandiwang nangangahulugang maabutan o mahuli matapos habulin; ang “ito” ay tumutukoy sa buhay.
- source_word: וְיִרְמֹס
  choice: hayaang yurakan niya
  rationale: Pinananatili ang marahas na larawan ng pagyurak at ang jussive na himig ng taludtod.
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Natural na Filipino sa pariralang “yurakan sa lupa” at tapat sa larawan ng Hebreo.
- source_word: חַיָּי
  choice: ang buhay ko
  rationale: Ang anyong maramihan sa Hebreo ay idyomatikong tumutukoy sa buhay; ang isahang “buhay” ang natural sa Filipino.
- source_word: וּכְבוֹדִי
  choice: ang aking kaluwalhatian
  rationale: Pinananatili ang matayog at malawak na ποιetikong diwa ng כָּבוֹד, na maaari ring tumukoy sa karangalan o dangal.
- source_word: לֶעָפָר
  choice: sa alabok
  rationale: Pinananatili ang larawan ng matinding pagpapababa at kamatayan.
- source_word: יַשְׁכֵּן
  choice: pamalagiin
  rationale: Ipinahahayag ang causative na diwang “pagpanatilihin o pagpatahanin,” at pinananatili ang makatang larawan ng kaluwalhatiang nananatili sa alabok.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa titik ang terminong ito sapagkat hindi tiyak ang eksaktong kahulugan o tungkulin nito.
theological_decisions:
- issue: Antropolohikal na diwa ng נַפְשִׁי
  choice: ang buhay ko
  alternative: ang kaluluwa ko; ang sarili ko
  rationale: Ang paghabol, pag-abot, at pagyurak ay tumutukoy sa buhay ng buong tao. Iniiwasan ng “buhay” ang pagpapasok ng mas makitid na paghahati sa katawan at kaluluwa na hindi hinihingi ng Hebreo.
- issue: Diwa ng כְבוֹדִי bilang makatang pagtukoy sa sarili
  choice: ang aking kaluwalhatian
  alternative: ang aking karangalan; ang aking dangal
  rationale: Pinananatili ng “kaluwalhatian” ang lawak at matayog na tayutay ng Hebreo, nang hindi ito nililimitahan sa reputasyon o dignidad lamang; inilalahad sa talababa ang mga posibleng diwa.
translation_notes:
  register: Makabago, marangal, at makatang Filipino. Ginamit ang “isang kaaway” upang mapanatili ang di-tiyak na anyo ng pangngalang Hebreo. Ang “pamalagiin sa alabok” ay bahagyang matayog ngunit malinaw na nagpapanatili sa causative na larawan ng orihinal.
