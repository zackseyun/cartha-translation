  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: tl
  text: Ang Diyos ay matuwid na hukom, at isang Diyos na nagagalit araw-araw.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang Diyos ay humahatol nang matuwid.”'
    reason: Ang שׁוֹפֵט ay maaaring unawaing pandiwa (“humahatol”), at ang צַדִּיק bilang paglalarawan sa paraan ng paghatol.
  - marker: b
    text: 'Maaari ring isalin: “at ang Diyos ay nagagalit araw-araw.”'
    reason: Ang ikalawang sugnay ay maaari ring isalin bilang hiwalay at parallel na pahayag sa halip na appositive na “isang Diyos na...”.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ang Diyos
  rationale: Sa konteksto ng awit, ang anyong maramihan ay tumutukoy sa iisang Diyos; natural itong isalin bilang “ang Diyos.”
- source_word: שׁוֹפֵט
  choice: ay isang ... hukom
  rationale: Ang participle ay maaaring mangahulugang “humahatol” o “hukom.” Pinili ang predikatibong “isang hukom” upang ilarawan ang katangian ng Diyos at mapanatili ang pagkakat parallel sa kasunod na sugnay.
- source_word: צַדִּיק
  choice: makatuwiran
  rationale: Ipinahahayag nito na ang Diyos ay umaayon sa tama at makatarungan. Ang “makatuwiran” ay dignified at madaling maunawaan sa modernong Filipino, bagaman maaari ring isalin na “matuwid.”
- source_word: וְאֵל
  choice: at isang Diyos
  rationale: Pinananatili ang pang-ugnay na וְ at ang parallel na muling pagtukoy sa Diyos, nang hindi nagdaragdag ng di-tiyak na diwang “makapangyarihan.”
- source_word: זֹעֵם
  choice: na nagagalit
  rationale: Ang participle ay nagpapahayag ng nagpapatuloy o paulit-ulit na galit. Ang “nagagalit” ay tuwiran at natural; hindi nito pinalalabnaw ang malinaw na wika tungkol sa galit ng Diyos.
- source_word: בְּכָל יוֹם
  choice: araw-araw
  rationale: Pinakanatural nitong ipinahahayag ang regularidad na “bawat araw,” hindi kinakailangang walang patid sa buong maghapon.
theological_decisions:
- issue: Wika tungkol sa galit ng Diyos
  choice: isang Diyos na nagagalit araw-araw
  alternative: isang Diyos na napopoot araw-araw
  rationale: Tahasang iniuugnay ng Hebreo sa Diyos ang patuloy o paulit-ulit na galit. Pinanatili ito sa halip na palambutin, habang iniiwasan ang “napopoot,” na maaaring magpahiwatig ng mas tiyak na layon o mas matinding kahulugan kaysa sa tahasang sinasabi ng talata.
- issue: Ugnayan ng dalawang paglalarawan sa Diyos
  choice: Ang Diyos ay isang makatuwirang hukom, at isang Diyos na nagagalit araw-araw
  alternative: Ang Diyos ay makatuwirang humahatol at nagagalit araw-araw
  rationale: Pinananatili ng napiling anyo ang dalawang parallel na predikasyon at ang pang-ugnay ng Hebreo. Gayunman, hindi tiyak sa anyong Hebreo kung ang צַדִּיק ay naglalarawan sa Diyos bilang makatuwiran o sa paghatol bilang makatarungan; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at madaling maunawaan. Ginamit ang “nagagalit” sa halip na mas pormal na “nagngangalit” o “napopoot,” at pinanatili ang parallel na paglalarawan sa Diyos. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
