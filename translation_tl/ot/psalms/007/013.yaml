  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: tl
  text: 'At para sa kanya ay naghanda siya ng mga sandata ng kamatayan;

    ang kanyang mga palaso ay ginagawa niyang nagliliyab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginagawa niya ang kanyang mga palaso para sa mga humahabol” o “laban sa mga humahabol.” Ang salitang Hebreo ay maaaring iugnay sa pandiwang nangangahulugang “humabol” sa halip na “magliyab,” ngunit sinusunod ng pangunahing teksto ang karaniwang larawang pandigma ng nagliliyab na mga palaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: At para sa kanya
  rationale: Pinananatili ang לְ bilang panandang tumutukoy sa taong pinaghandaan ng mga sandata—ang masama sa naunang konteksto—nang hindi ito ginagawang reflexive na “para sa kanyang sarili.”
- source_word: הֵכִין
  choice: naghanda siya
  rationale: Ang Hiphil ng כון ay karaniwang nangangahulugang “ihanda” o “gawing handa”; ang aspektong ganap ng Hebreo ay likas na naihahayag dito sa payak na naganap na anyo sa Filipino.
- source_word: כְּלֵי מָוֶת
  choice: mga sandata ng kamatayan
  rationale: Sa kontekstong pandigma at sa kasunod na pagbanggit sa mga palaso, ang כְּלִי ay tumutukoy sa mga sandata. Pinananatili ng “ng kamatayan” ang matinding genitibong parirala ng Hebreo sa halip na lubusang ipaliwanag bilang “nakamamatay.”
- source_word: חִצָּיו
  choice: ang kanyang mga palaso
  rationale: Tuwirang isinasalin ang pangngalang maramihan at ang hulaping panlalaking ikatlong panauhan.
- source_word: לְדֹלְקִים
  choice: nagliliyab
  rationale: Maaaring iugnay ang דלק sa pagliyab o sa paghabol. Ang “nagliliyab” ay angkop sa karaniwang larawang pandigma ng nag-aapoy na mga palaso, habang inilalahad sa talababa ang tunay na alternatibong pagbasa.
- source_word: יִפְעָל
  choice: ginagawa niyang
  rationale: Ang Qal ng פעל ay maaaring mangahulugang “gawin” o “likhain.” Ang ayos na “ginagawa niyang nagliliyab” ay malinaw at natural na nag-uugnay sa pandiwa at sa kalagayan ng mga palaso.
