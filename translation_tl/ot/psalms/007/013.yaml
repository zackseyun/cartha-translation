translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang dalawang hanay ng tulang Hebreo at ang matinding pariralang “mga sandata ng kamatayan.” Ang tahasang panghalip na “siya” ay kailangan sa Filipino, ngunit hindi pinangalanan ang simuno upang manatili ang ugnayan nito sa naunang talata.
