  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: tl
  text: 'Magwakas nawa ang kasamaan ng masasama,

    ngunit patatagin mo ang matuwid—

    ikaw na matuwid na Diyos,

    na sumusuri sa mga puso at kaloob-looban.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga puso at mga bato.” Sa sinaunang Hebreong pananalita, ang mga bato ay larawan ng pinakamalalim na damdamin at motibo ng tao.
    reason: Pinananatili ang natatanging larawang Hebreo na כְלָיוֹת habang gumagamit ng nauunawaang pangunahing salin sa modernong Tagalog.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Magwakas nawa
  rationale: Pinananatili ang pakiusap o hangarin na ipinahihiwatig ng jussive at ng particle na נָא, sa natural at marangal na Tagalog.
- source_word: רַע רְשָׁעִים
  choice: ang kasamaan ng masasama
  rationale: Tuwirang inililipat ang 'evil of the wicked,' kasama ang posibleng saklaw nito bilang masamang gawain o kasamaan ng mga taong balakyot.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: ngunit patatagin mo ang matuwid
  rationale: Ang כון sa polel ay nagpapahiwatig ng pagtatatag, pagpapatibay, o pagpapanatiling matatag; ang 'patatagin' ay natural at angkop sa konteksto.
- source_word: לִבּוֹת
  choice: mga puso
  rationale: Karaniwang biblikal na katawagan sa panloob na pagkatao, kabilang ang isip, hangarin, at kalooban.
- source_word: כְלָיוֹת
  choice: kaloob-looban
  rationale: Literal itong 'mga bato' o kidneys, ngunit sa Hebreong antropolohiya tumutukoy ito sa pinakamalalim na damdamin at motibo. Ang 'kaloob-looban' ay naghahatid ng metaporikal na diwa sa modernong Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: אֱלֹהִים צַדִּיק
  choice: ikaw na matuwid na Diyos
  rationale: Binabasa ang parirala bilang tuwirang pagtawag sa Diyos, gaya ng hinihingi ng daloy ng panalangin, nang hindi binabago ang diwa ng Hebreo.
theological_decisions:
- issue: Ang Diyos bilang sumusuri sa panloob na pagkatao
  choice: na sumusuri sa mga puso at kaloob-looban
  alternative: na sumusuri sa mga puso at mga bato
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong larawan ng Hebreo. Iniiwasang gawing iisang konsepto lamang ang mga ito, habang ipinapaliwanag sa talababa ang literal na anatomiya.
- issue: Singular na צַדִּיק pagkatapos ng plural na 'masasama'
  choice: ang matuwid
  alternative: ang mga matuwid
  rationale: Pinananatili ang singular ng tekstong Masoretiko, na maaaring tumukoy sa matuwid na tao bilang uri o sa indibidwal na nananalangin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panulaan. Ginamit ang 'nawa' upang mapanatili ang himig ng taimtim na pakiusap, at maikling mga taludtod upang luminaw ang paralelismo.
