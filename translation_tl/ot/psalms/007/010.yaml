lexical_decisions:
- source_word: מָגִנִּי
  choice: Ang aking kalasag
  rationale: Pinananatili ang kongkretong larawan ng kalasag sa halip na gawing abstraktong “proteksiyon” o “tagapagtanggol.”
- source_word: עַל
  choice: ay nasa
  rationale: Sa maikling pariralang מָגִנִּי עַל אֱלֹהִים, ipinahihiwatig ng pang-ukol na ang pagtatanggol ng mang-aawit ay matatagpuan sa Diyos. Ang “nasa Diyos” ay likas sa Filipino at hindi lubusang nilulutas ang siksik na sintaks ng Hebreo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan sa Hebreo, malinaw na tumutukoy rito sa iisang Diyos.
- source_word: מוֹשִׁיעַ
  choice: na nagliligtas
  rationale: Ang pandiwaring Hebreo ay naglalarawan sa palagian o katangiang pagkilos ng Diyos; natural itong naipahahayag sa Filipino bilang sugnay na “na nagliligtas.”
- source_word: יִשְׁרֵי
  choice: mga matuwid
  rationale: Tumutukoy sa mga taong tuwid ang asal o pagkatao; ang “matuwid” ang tuwirang katumbas nang hindi inililipat sa ibang larangang leksikal.
- source_word: לֵב
  choice: ang puso
  rationale: Ang “puso” ay tumutukoy sa panloob na pagkatao. Ang pariralang “mga matuwid ang puso” ay maikli, natural, at malapit sa idyomang Hebreo.
theological_decisions:
- issue: Ugnayang sintaktiko ng unang hati ng taludtod
  choice: “Ang aking kalasag ay nasa Diyos,” na nagpapahayag na sa Diyos matatagpuan ang pagtatanggol ng mang-aawit.
  alternative: “Ang Diyos ang aking kalasag,” isang mas interpretatibong pagsasaayos.
  rationale: Walang tahasang pandiwa ang Hebreo at maaaring unawain sa higit sa isang paraan. Pinananatili ng pangunahing salin ang siksik na ayos at tunay na kalabuan, samantalang inilalagay sa talababa ang karaniwang interpretatibong pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang talinghaga ng kalasag at ang siksik na sintaks ng Hebreo; iniwasan ang masyadong literal na “nakapatong sa Diyos,” na maaaring magbigay ng maling larawang pisikal.
