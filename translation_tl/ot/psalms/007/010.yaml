  text: Ang aking kalasag ay nasa Diyos[a], na nagliligtas sa mga taong matuwid ang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Ang Diyos ang aking kalasag.” Maikli at siksik ang pagkakasabi sa Hebreo, kaya posible ang ganitong interpretatibong pagsasaayos.
