id: PSA.7.17
reference: Psalms 7:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: tl
  text: Magpapasalamat ako kay Yahweh ayon sa kanyang katuwiran[a], at aawit ako ng papuri sa pangalan ni Yahweh, ang Kataas-taasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanyang katarungan” o “ayon sa kanyang katarungan.” Ang salitang Hebreo ay maaaring magpahiwatig kapwa ng katuwiran at katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Magpapasalamat ako
  rationale: Sa konteksto ng pagsamba sa mga Awit, ang Hiphil ng ידה ay karaniwang tumutukoy sa pagpapasalamat o pagpuri. Natural at tumpak dito ang “magpapasalamat ako.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כְּצִדְקוֹ
  choice: ayon sa kanyang katuwiran
  rationale: Pinananatili ng “ayon sa” ang diwa ng pang-ukol כְּ, samantalang ang “katuwiran” ay sumasaklaw sa matuwid na katangian at pagkilos ng Diyos; maaari ring idiin ng salita ang katarungan.
- source_word: וַאֲזַמְּרָה
  choice: at aawit ako ng papuri
  rationale: Ang pandiwang זמר ay tumutukoy sa pag-awit ng papuri, kadalasa’y may pahiwatig ng musika. Malinaw at natural sa Filipino ang napiling parirala.
- source_word: שֵׁם
  choice: pangalan
  rationale: Tuwirang pinananatili ang biblikal na salita para sa nahayag na pagkakakilanlan at karangalan ng Diyos.
- source_word: עֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Natural itong titulong pandiyos sa Filipino at hindi nagdaragdag ng salitang “Diyos,” na wala sa Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Direktang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng צֶדֶק kapag iniuugnay sa Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy kapwa sa katuwiran at katarungan. Ang “katuwiran” ang nasa pangunahing teksto, habang pinananatili sa talababa ang tunay na alternatibong diwa ng “katarungan.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at pinanatili ang bahagyang pormal na “ayon sa” upang maipakita ang tunay na ambiguwidad ng Hebreo.
