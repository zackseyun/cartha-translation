  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: tl
  text: Palibutan ka nawa ng kapulungan ng mga sambayanan[a]; at sa ibabaw nila[b] ay bumalik ka sa kaitaasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: 'Pambabaeng isahan ang anyo sa Hebreo: “sa ibabaw nito,” na tumutukoy sa kapulungan bilang isang kabuuan.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: kapulungan
  rationale: Tumutukoy ito sa isang pangkat na nagkatipon. Ang “kapulungan” ay likas at marangal na salin, nang walang di-kailangang kulay na pangdenominasyon.
- source_word: לְאֻמִּים
  choice: mga sambayanan
  rationale: Tumutukoy ang maramihan sa mga pangkat ng tao o mga bayan. Pinananatili ng “mga sambayanan” ang diwa ng maraming magkakaibang grupo; maaari rin ang “mga bansa.”
- source_word: תְּסוֹבְבֶךָּ
  choice: palibutan ka nawa
  rationale: Mula sa pandiwang nangangahulugang “palibutan” o “ligiran.” Ipinahahayag ng “nawa” ang diwang pakiusap o kahilingan sa konteksto, sa halip na karaniwang panghinaharap lamang.
- source_word: וְעָלֶיהָ
  choice: at sa ibabaw nila
  rationale: Bagaman pambabaeng isahan ang hulapi sa Hebreo at tumutukoy sa kapulungan bilang isang kabuuan, likas sa Filipino ang maramihang “nila” kapag ang tinutukoy ay ang nagkakatipong mga sambayanan. Pinananatili ng “sa ibabaw” ang larawang panlunan at ang pahiwatig ng paghahari.
- source_word: לַמָּרוֹם
  choice: sa kaitaasan
  rationale: Ang salita ay tumutukoy sa mataas o marangal na dako. Ang “sa kaitaasan” ay angkop sa tulang panawagan nang hindi tahasang dinaragdagan ng “langit” o “trono.”
- source_word: שׁוּבָה
  choice: bumalik ka
  rationale: Tuwirang pautos ito ng pandiwang “bumalik.” Iniiwasan ng salin ang mas mapagpasyang pagpapakahulugang “muling maupo sa trono,” na hindi tahasang sinasabi ng salita.
theological_decisions:
- issue: Kung inilalarawan ng talata ang paghatol ng Diyos mula sa mataas na luklukan o ang literal na pag-akyat niya
  choice: Isang patulang pakiusap na bumalik ang Diyos sa kanyang mataas na kalagayan sa ibabaw ng nagkakatipong mga sambayanan
  alternative: Maaaring unawain bilang pakiusap na umakyat ang Diyos sa langit sa literal na paraan, o bilang pahayag sa panghinaharap sa halip na panalangin.
  rationale: Pinapaboran ng anyong pautos ng שׁוּבָה at ng konteksto ng paghatol ang pagbasa rito bilang pakiusap. Pinananatili ng “sa kaitaasan” ang larawan ng kadakilaan at paghahari nang hindi tinutukoy nang higit sa sinasabi ng Hebreo ang kosmolohiya o pagluklok.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang malinaw na maipahayag ang panalanging diwa, at pinanatili ang patulang larawang “sa kaitaasan” nang hindi nagdaragdag ng tahasang wikang tungkol sa trono o langit.
