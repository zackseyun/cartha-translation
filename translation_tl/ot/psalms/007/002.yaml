translation:
  language: tl
  text: Baka niya ako lapain gaya ng leon, habang pinupunit-punit ako, at walang sinumang magliligtas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: Baka
  rationale: Natural na nagpapahayag ng kinatatakutang maaaring mangyari, habang pinananatili ang puwersa ng negatibong bunga sa konteksto.
- source_word: יִטְרֹף
  choice: lapain
  rationale: Ang pandiwang טרף ay tumutukoy sa marahas na paglapang ginagawa ng mabangis na hayop; malinaw at buhay ang salitang Tagalog.
- source_word: כְּאַרְיֵה
  choice: parang leon
  rationale: Tuwirang pinananatili ang paghahambing na ipinahihiwatig ng prefixed כ.
- source_word: נַפְשִׁי
  choice: ako
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay ang buong sarili o buhay ng salmista na nanganganib, hindi lamang isang hiwalay na di-materyal na kaluluwa. Likas sa Tagalog ang paggamit ng panghalip bilang tuwirang layon.
- source_word: פֹּרֵק
  choice: lalapa-lapain
  rationale: 'Inilalarawan at pinatitindi ng participle ang unang pandiwa: ang biktima ay marahas na pinupunit-punit. Ang pag-uulit ay natural na Tagalog para sa tuloy-tuloy at matinding paglapang.'
- source_word: וְאֵין מַצִּיל
  choice: nang walang magligtas
  rationale: Pinananatili ang kawalan ng sinumang tagapagligtas at natural na ikinakabit ito sa naunang paglalarawan.
theological_decisions:
- issue: Kahulugan ng נַפְשִׁי
  choice: ako
  alternative: ang buhay ko / ang kaluluwa ko
  rationale: Ang agarang larawan ay mortal na panganib mula sa isang leon. Ang “ako” ay sumasaklaw sa buong sarili nang hindi ipinapasok ang mas makitid na antropolohikal na kahulugan ng “kaluluwa.”
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matingkad na larawang mandaragit sa pamamagitan ng “lapain” at “lalapa-lapain,” at iniwasan ang teknikal o makalumang pananalita.
