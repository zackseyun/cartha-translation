  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: tl
  text: Yahweh, Diyos ko, kung ginawa ko ito, kung may kasamaan sa aking mga kamay[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung may maling gawa sa aking mga kamay”; ang pariralang Hebreo ay maaaring tumukoy sa kasamaan, pagkakasala, o pananagutang moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang natatanging pangalan ng Diyos upang mapanatili ang pagkakakilanlan nito bilang pangalan, hindi titulo.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Ang anyong may hulaping unang panauhang isahan ay nangangahulugang “Diyos ko” at bahagi ng tuwirang pagtawag kay Yahweh.
- source_word: אִם
  choice: kung
  rationale: Nagsisimula ito ng kondisyonal na panunumpa laban sa sarili; “kung” ang payak at likas na katumbas.
- source_word: עָשִׂיתִי זֹאת
  choice: ginawa ko ito
  rationale: Tapat na inilalarawan ang Qal perfect na unang panauhang isahan kasama ng demonstratibong “ito”; sa Filipino, hindi kailangang tahasang markahan ang English present perfect.
- source_word: יֶשׁ
  choice: may
  rationale: Likas na katumbas sa Filipino ng eksistensiyal na pahayag na “there is.”
- source_word: עָוֶל
  choice: kalikuan
  rationale: Saklaw nito ang mali, kawalang-katarungan, at moral na kasamaan, habang pinananatili ang marangal at hudisyal na himig.
- source_word: בְּכַפָּי
  choice: sa aking mga kamay
  rationale: Pinananatili ang konkretong larawang Hebreo ng mga palad o kamay bilang sagisag ng sariling gawa at pananagutan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Diwa ng עָוֶל בְּכַפָּי
  choice: kalikuan sa aking mga kamay
  alternative: kawalang-katarungan sa aking mga kamay; kasalanang nasa aking mga kamay
  rationale: Pinananatili ng salin ang larawang Hebreo at ang posibleng diwa ng maling gawa o moral na pananagutan nang hindi ito nililimitahan sa isang mas makitid na doktrinal na kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Yahweh na Diyos ko” bilang likas na tuwirang pagtawag. Pinanatili ang larawang “sa aking mga kamay” at ang bitin na gitling sa dulo dahil nagpapatuloy sa kasunod na talata ang kondisyonal na panunumpa.
