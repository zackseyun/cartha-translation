  source_fidelity: Ang pangunahing teksto ng Hebreo ay mas tuwirang sumusuporta sa pandiwang may diwang “iligtas/sagipin” para sa וָאֲחַלְּצָה. Bagaman may batayan ang pagbabasang “sinamsaman,” ito ay isang mahirap at pinagtatalunang pagbasa at dapat manatili sa talababa, alinsunod din sa pangunahing linya ng English POB audit trail. Ang “taong namumuhay nang payapa sa akin” ay hindi gaanong tumpak sapagkat inilalarawan nito ang pamumuhay ng tao, hindi ang mapayapang ugnayan niya sa nagsasalita.
  naturalness: Mas likas at mas tiyak ang “ang taong may mapayapang ugnayan sa akin.” Hindi kailangan ang ikalawang “kung” pagkatapos ng “o”; ang “Kung …, o iniligtas ko …” ay malinaw na iisang kondisyunal na panunumpa at mas malapit sa estruktura ng Hebreo.
  terminology: Pinananatili ang “ginantihan ko ng masama,” “mapayapang ugnayan,” at “kaaway,” na angkop sa marangal ngunit makabagong Filipino. Ang “iniligtas” ang pangunahing katumbas ng disputed na וָאֲחַלְּצָה; ang “sinamsaman” ay malinaw na minarkahan bilang alternatibo sa talababa.
