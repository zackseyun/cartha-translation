    rationale: Kailangang unahin ang mas direktang kahulugan ng pandiwang Hebreo at ang pangunahing pagbasa ng English POB. Maaaring panatilihin ang negatibong “sinamsaman” bilang isang lehitimong, ngunit pinagtatalunang, alternatibo sa talababa.
  - severity: medium
