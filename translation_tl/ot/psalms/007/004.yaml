translation:
  language: tl
  text: 'Kung ginantihan ko ng masama ang taong may mapayapang ugnayan sa akin,

    o iniligtas ko ang aking kaaway nang walang dahilan[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinamsaman ko ang aking kaaway nang walang dahilan.” Maaaring mangahulugang “sinamsaman” o “hinubaran ng ari-arian” ang pandiwang Hebreo, sa halip na “iniligtas.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyon sa panunumpang laban sa sarili; likas sa Filipino ang “kung” sa ganitong di-tapos na sugnay.
- source_word: גָּמַלְתִּי
  choice: ginantihan ko
  rationale: Ipinahahayag ng גמל ang pagganti o pagbabayad ayon sa ginawa ng iba; malinaw na naipapakita ng “ginantihan” ang ideya ng masamang ganti.
- source_word: שׁוֹלְמִי
  choice: ang taong namumuhay nang payapa sa akin
  rationale: Tumutukoy ito sa isang taong may mapayapang kaugnayan sa nagsasalita. Mas malapit ito sa Hebreo kaysa sa mas tiyak na “kaalyado” o “kaibigan.”
- source_word: רָע
  choice: ng masama
  rationale: Ito ang bagay na iginanti; pinananatili ng “masama” ang moral na bigat ng salita.
- source_word: וָאֲחַלְּצָה
  choice: o kung sinamsaman ko
  rationale: Bagaman karaniwang maaaring mangahulugang “iniligtas” ang ugat na חלץ, posible rito ang diwang paghubad o pandarambong. Ang negatibong pagbasa ay kaagapay ng unang ipinagkakait na kasalanan, ngunit inilalahad sa talababa ang tunay na alternatibo.
- source_word: צוֹרְרִי
  choice: ang aking kaaway
  rationale: Malinaw at karaniwang katumbas ito ng taong kumakalaban sa nagsasalita.
- source_word: רֵיקָם
  choice: nang walang dahilan
  rationale: Sa pangunahing pagbasa, inilalarawan nito ang isang di-makatarungan o walang-saning pagsamsam, hindi lamang ang pagiging walang dala.
theological_decisions:
- issue: Kahulugan ng וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: 'Negatibong kaagapay: “o kung sinamsaman ko nang walang dahilan ang aking kaaway”'
  alternative: 'Positibo o pasalungat: “samantalang iniligtas ko ang taong naging kaaway ko nang walang dahilan”'
  rationale: Maaaring tumukoy ang pandiwa sa pagliligtas, ngunit ang pagbasa nitong pagsamsam o paghubad ay nagpapanatili sa dalawang magkaagapay na maling gawa sa kondisyon ng panunumpa. Dahil lehitimo at karaniwan ang kahulugang “iligtas,” hindi ito ipinagwawalang-bahala kundi pinananatili sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ang taong namumuhay nang payapa sa akin” upang iwasan ang sobrang tiyak na “kaalyado” at mapanatili ang relasyonal na diwa ng Hebreo. Pinanatili ang gitling sa dulo dahil nagpapatuloy sa susunod na talata ang kondisyon.
