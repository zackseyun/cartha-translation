base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: tl
  text: Kung hindi siya bumalik[a], hahasain niya ang kanyang espada;[b] binanat na niya ang kanyang pana at inihanda ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magsisi.” Ang salitang Hebreo ay nangangahulugang “bumalik” o “magbalik,” at sa kontekstong ito ay maaari itong tumukoy sa pagsisisi.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “niya” sa Diyos, na naghahanda ng mga sandata ng paghatol laban sa taong hindi bumabalik, o—bagaman hindi gaanong malamang—sa masamang taong naghahanda ng sarili niyang mga sandata.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Kung hindi
  rationale: Pinananatili ang malinaw na anyong pasubali ng Hebreo sa natural na Filipino.
- source_word: יָשׁוּב
  choice: siya bumalik
  rationale: Ang שׁוּב ay pangunahing nangangahulugang “bumalik” o “tumalikod mula sa dating landas.” Maaaring magpahiwatig ito ng pagsisisi sa konteksto, ngunit hindi iyon tahasang nililinaw sa salitang Hebreo.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: hahasain niya ang kanyang espada
  rationale: Tuwirang ipinapahayag ang paghahasa ng sandata; ang “espada” ay karaniwan at madaling maunawaang katumbas ng חֶרֶב sa kontekstong ito.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: binanat na niya ang kanyang pana
  rationale: Ang דָרַךְ kapag pana ang layon ay tumutukoy sa pagbanat o paghahanda nito. Ang “binanat ang pana” ang natural na idyoma sa Filipino.
- source_word: וַיְכוֹנְנֶהָ
  choice: at inihanda iyon
  rationale: Ipinapahayag ng anyo ng כון ang paggawa sa pana na handa nang gamitin; nililinaw ng “iyon” na pana ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip na panlalaking isahan
  choice: Pinanatili ang “siya/niya/kanyang” nang hindi tahasang pinapangalanan ang Diyos.
  alternative: Maaaring ang masamang tao ang naghahanda ng sarili niyang mga sandata.
  rationale: Sa agarang konteksto, malamang na ang Diyos na hukom ang naghahanda ng mga sandata ng paghatol kapag hindi bumalik ang masama. Gayunman, hindi inuulit ng talata ang tahasang paksa, kaya pinananatili sa salin at talababa ang tunay na posibilidad ng ibang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bumalik” upang mapanatili ang lawak ng Hebreong שׁוּב, at “binanat ang kanyang pana” bilang natural na Filipino para sa paghahanda ng pana. Hindi tahasang pinangalanan ang paksa upang mapanatili ang kalabuan ng mga panghalip sa Hebreo.
