  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: tl
  text: 'Bumangon ka, Yahweh, sa iyong galit;

    itaas mo ang iyong sarili laban sa mga silakbo ng poot ng aking mga kaaway;

    gumising ka para sa akin[a];

    iniutos mo ang hatol.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumising ka tungo sa akin”—na ang diwa ay “gumising ka alang-alang sa akin.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain: “ang hatol na iniutos mo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Ang pautos ng קום ay nananawagan sa Diyos na kumilos. Likas sa makabagong Tagalog ang “bumangon” at napananatili nito ang matalinghagang larawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang banal sa halip na palitan ng isang titulo.
- source_word: בְּאַפֶּךָ
  choice: sa iyong galit
  rationale: Bagaman ang אַף ay literal na “ilong,” karaniwan itong idyoma para sa galit; malinaw at natural dito ang “sa iyong galit.”
- source_word: הִנָּשֵׂא
  choice: tumindig ka
  rationale: Ang Niphal na pautos ay kaagapay ng “bumangon ka” at humihiling ng maringal na pagkilos. Mas natural sa Tagalog ang “tumindig ka” kaysa sa literal ngunit alanganing “itaas mo ang iyong sarili.”
- source_word: בְּעַבְרוֹת
  choice: laban sa mga silakbo ng poot
  rationale: Ang maramihang anyo ay maaaring tumukoy sa mararahas na bugso ng poot. Ipinahahayag ng “mga silakbo ng poot” ang tindi at maramihang anyo, habang ang “laban sa” ay angkop sa konteksto ng pagharap sa mga kaaway.
- source_word: צוֹרְרָי
  choice: ng aking mga kaaway
  rationale: Ang substantibong participle ay tumutukoy sa mga lumalaban sa salmista; “mga kaaway” ang pinakatuwiran at likas na katumbas.
- source_word: וְעוּרָה
  choice: gumising ka
  rationale: Napananatili ang matingkad na antropomorpikong pananalita at ang sunod-sunod na mga pautos nang hindi ipinahihiwatig na literal na natutulog ang Diyos.
- source_word: אֵלַי
  choice: para sa akin
  rationale: Literal itong “tungo sa akin,” ngunit sa panalanging humihingi ng makatarungang pagkilos, likas na ipinahahayag ng “para sa akin” ang diwang kumilos alang-alang sa salmista.
- source_word: מִשְׁפָּט
  choice: paghatol
  rationale: Tumutukoy ito sa hudisyal na pagkilos o pasiya; pinananatili ng “paghatol” ang legal na larawan ng talata.
- source_word: צִוִּיתָ
  choice: iniutos mo
  rationale: Ang karaniwang kahulugan ng צוה ay “mag-utos.” Pinananatili ng “iniutos mo” ang tuwirang lakas ng Hebreo nang hindi ito ginagawang mas abstraktong “itinalaga.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Mga antropomorpikong pautos sa Diyos
  choice: Panatilihin ang “Bumangon… tumindig… gumising”
  alternative: Ipaliwanag bilang “kumilos” o “mamagitan”
  rationale: Ang matingkad na pananalita ng tula ay isang panawagan para sa pagkilos ng Diyos. Hindi ito dapat pahinain sa paraphrase o unawain bilang doktrinang literal na natutulog o walang ginagawa ang Diyos.
- issue: Ugnayan ng מִשְׁפָּט צִוִּיתָ sa naunang pakiusap
  choice: Ihiwalay bilang “iniutos mo ang paghatol”
  alternative: “gumising ka para sa akin sa paghatol na iniutos mo”
  rationale: Sinusuportahan ng paghinto sa Masoretikong pagbasa ang hiwalay na pangungusap, ngunit maaari ring iugnay ang “paghatol” sa naunang pakiusap. Inilalahad sa talababa ang tunay na sintaktikong posibilidad.
translation_notes:
  register: Makabago, marangal, at patulang Tagalog. Gumamit ng maiikling pautos at parallel na mga linya upang mapanatili ang tindi ng panalangin. Iniwasan ang lipas na bokabularyo at ang denominasyonal na pagpapalit sa banal na pangalan.
