lexical_decisions:
- source_word: בּוֹר
  choice: hukay
  rationale: Karaniwang tumutukoy sa isang hukay o balon. Sa konteksto ng bitag at sa pagkakatulad nito sa שַׁחַת, ang pangkalahatang “hukay” ang pinakaangkop.
- source_word: כָּרָה
  choice: humukay
  rationale: Tuwirang inilalarawan ng pandiwa ang paghuhukay at pinananatili nito ang kongkretong larawan.
- source_word: וַיַּחְפְּרֵהוּ
  choice: at pinalalim iyon
  rationale: Magkalapit ang kahulugan nito at ng כרה, ngunit ipinahihiwatig ng pagkakasunod na ipinagpatuloy o pinaigting ang paghuhukay. Natural sa Filipino ang “pinalalim iyon.”
- source_word: וַיִּפֹּל
  choice: ngunit siya rin ang nahulog
  rationale: Ang “nahulog” ay tuwirang katumbas ng נפל. Ginamit ang “ngunit siya rin” upang natural na maipakita sa Filipino ang balintunang bunga ng sunod-sunod na kilos, nang hindi binabago ang diwa.
- source_word: שַׁחַת
  choice: hukay
  rationale: Dito ay kongkretong tumutukoy sa lungaw o bitag na hinukay. Pinanatili ang “hukay” sapagkat natural at malinaw sa Filipino ang pag-uulit sa linyang patula.
- source_word: יִפְעָל
  choice: na ginawa niya
  rationale: Malawak ang kahulugan ng פעל na “gumawa.” Sa konteksto, tumutukoy ito sa hukay na nalikha niya.
