translation:
  language: tl
  text: 'Humukay siya ng hukay at pinalalim niya ito,[a]

    at nahulog siya sa hukay na ginawa niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Humukay siya ng hukay at hinukay pa niya ito.”
