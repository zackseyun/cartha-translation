translation:
  language: tl
  text: Pinapatay nila ang balo at ang dayuhang naninirahan[a]; pinapaslang nila ang mga ulila sa ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dayuhang nakikipamayan.” Ang Hebreong גֵר ay tumutukoy sa isang dayuhang naninirahan sa gitna ng bayan.
