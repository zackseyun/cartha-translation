    text: Maaari ring “mga ulila.” Mas tiyak na tumutukoy ang Hebreo sa mga walang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: ang babaeng balo
  rationale: Ang pangngalang isahan ay ginagamit bilang kinatawan ng isang mahina at inaaping uri. Nililinaw ng “babaeng balo” ang tiyak na kahulugan ng Hebreo, sapagkat maaaring tumukoy sa babae o lalaki ang “balo” sa Filipino.
- source_word: גֵר
  choice: ang dayuhang naninirahan sa kanilang lupain
  rationale: Tumutukoy ang גֵר sa isang hindi katutubong naninirahan sa gitna ng bayan, hindi lamang sa isang dayuhang dumaraan. Likas at malinaw sa modernong Filipino ang pariralang ito.
- source_word: יַהֲרֹגוּ
  choice: pinapatay nila
  rationale: Direkta at karaniwang katumbas ito ng pangkalahatang pandiwa para sa pagpatay, at ang anyong pangkasalukuyang naglalarawan ng paulit-ulit o kinagawiang gawain.
- source_word: יְתוֹמִים
  choice: ang mga ulila sa ama
  rationale: Pinananatili nito ang tiyak na diwa ng Hebreo na mga nawalan o naulila sa ama, sa halip na agad palawakin sa lahat ng uri ng ulila.
- source_word: יְרַצֵּחוּ
  choice: pinapaslang nila
  rationale: Ipinahahayag ng “pinapaslang” ang marahas at labag-sa-matuwid na pagkitil ng buhay, at pinananatili ang mas mabigat na puwersa ng רצח kaysa sa naunang pangkalahatang “pinapatay.”
