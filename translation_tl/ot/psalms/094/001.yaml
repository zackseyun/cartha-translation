  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: tl
  text: 'O Diyos ng paghihiganti, Yahweh,

    O Diyos ng paghihiganti, magpakita ka![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magningning ka” o “mahayag ka sa kaningningan.” Ang pandiwa ay maaaring tumukoy sa hayag at maningning na pagpapakita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Diyos
  rationale: Ginagamit dito ang אֵל bilang pantawag at titulong tumutukoy sa Diyos; ang “Diyos” ang pinakanatural na salin sa makabagong Filipino.
- source_word: נְקָמוֹת
  choice: paghihiganti
  rationale: Ang anyong maramihan sa Hebreo ay maaaring magpatindi o tumukoy sa mga gawa ng makatarungang pagganti. Mas natural sa Filipino ang abstraktong isahan na “paghihiganti” kaysa “mga paghihiganti,” habang nananatili ang matalim na diwa ng salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הוֹפִיעַ
  choice: magpakita ka
  rationale: Ang Hiphil imperative ng יפע ay panawagang hayagang magpakita o mahayag ang Diyos. Natural at malinaw sa Filipino ang “magpakita ka”; ipinapaliwanag sa talababa ang posibleng ningning o maningning na pagpapahayag.
theological_decisions:
- issue: Paglalarawan sa Diyos bilang Diyos ng paghihiganti
  choice: Pinanatili ang “Diyos ng paghihiganti” nang hindi pinapalambot
  alternative: Diyos ng katarungan / Diyos na gumaganti
  rationale: Tahasang inuugnay ng Hebreo ang Diyos sa נְקָמוֹת, kaya hindi ito pinalitan ng mas interpretatibong “katarungan.” Hinahayaan ng salin na manatili ang tensiyon ng banal na paghihiganti o makatarungang pagganti.
- issue: Saklaw ng הוֹפִיעַ
  choice: magpakita ka
  alternative: magningning ka / mahayag ka sa kaningningan
  rationale: Maaaring ipahiwatig ng pandiwa ang maningning na pagpapahayag ng Diyos, ngunit maaari rin itong unawain nang mas pangkalahatan bilang pagpapakita. Pinanatili sa teksto ang mas malawak na kahulugan at inilagay sa talababa ang epiphanic na alternatibo.
translation_notes:
  register: Makabago, marangal, at tuwirang panalangin. Pinanatili ang pag-uulit ng Hebreo para sa diin at ang pangalang “Yahweh.”
