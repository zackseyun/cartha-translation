base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: tl
  text: Mapalad[a] ang lalaking[b] iyong dinidisiplina[c], Yah[d], at tinuturuan mula sa iyong kautusan[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maligaya.” Ang Hebreong אַשְׁרֵי ay maaaring magpahiwatig ng pagiging mapalad, maligaya, o nasa mabuting kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang lalaki”; maaaring kinatawan dito ang isang lalaki bilang sinumang tumatanggap ng disiplina at turo ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “itinutuwid” o “sinasaway.” Tumutukoy ang salita sa disiplinang nagwawasto at humuhubog.
    reason: lexical_alternative
  - marker: d
    text: Ang “Yah” ang pinaikling makatang anyo ng banal na pangalan; naiiba ito sa buong anyong YHWH na karaniwang isinasaling “PANGINOON.”
    reason: lexical_alternative
  - marker: e
    text: Maaari ring “mula sa iyong turo.” Ang Hebreong torah ay maaaring mangahulugang “kautusan” o, sa mas malawak na diwa, “turo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Karaniwang pormula ito ng pagpapahayag ng mabuting kalagayan o pagpapala. Pinananatili ng “Mapalad” ang saklaw na higit sa pansamantalang damdaming masaya.
- source_word: הַגֶּבֶר
  choice: ang lalaki
  rationale: Ang pangngalan ay panlalaking isahan. Pinananatili ang anyong iyon, bagaman maaaring kumatawan ang tinutukoy na lalaki sa sinumang tumatanggap ng pagtutuwid at turo ng Diyos.
- source_word: תְּיַסְּרֶנּוּ
  choice: iyong dinidisiplina
  rationale: Ang Piel ng יסר ay tumutukoy sa disiplinang nagtutuwid o humuhubog, hindi lamang sa simpleng pagtuturo. Ang “dinidisiplina” ay malinaw at natural sa makabagong Filipino.
- source_word: יָּהּ
  choice: Yah
  rationale: Ito ang pinaikling makatang anyo ng banal na pangalan, hindi ang buong tetragrammaton. Pinananatili itong “Yah” upang huwag patagin ang pagkakaibang nasa Hebreo.
- source_word: וּמִתּוֹרָתְךָ
  choice: mula sa iyong kautusan
  rationale: Ipinahihiwatig ng מִן ang pinagmumulan ng pagtuturo. Ang תּוֹרָה ay maaaring mangahulugang kautusan o mas malawak na turo; ang “kautusan” ay angkop sa kontekstong pang-awit habang nililinaw sa talababa ang mas malawak na diwa.
- source_word: תְלַמְּדֶנּוּ
  choice: tinuturuan
  rationale: Tuwirang ipinapahayag ng Piel ng למד ang pagtuturo. Ang iisang tinutukoy ng dalawang pandiwa ay malinaw sa Filipino nang hindi inuulit ang panghalip.
theological_decisions:
- issue: Paglalarawan sa mabuting kalagayan sa אַשְׁרֵי
  choice: Mapalad
  alternative: Maligaya
  rationale: Hindi nililimitahan ng “Mapalad” ang pahayag sa emosyonal na saya lamang; naiiwan ang teolohikal at pangkabuuang diwa ng mabuting kalagayan sa harap ng Diyos.
- issue: Paglilipat ng banal na pangalang יָּהּ
  choice: Yah
  alternative: PANGINOON
  rationale: Pinaikling makatang anyo ang nasa teksto. Ang tuwirang “Yah” ay nagpapanatili sa anyong iyon at hindi ito ipinagkakamali sa buong pangalang YHWH.
- issue: Panlalaking kinatawang pangngalan na הַגֶּבֶר
  choice: ang lalaki
  alternative: ang tao
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebreo, habang kinikilala sa talababa na maaaring kinatawan ang gamit nito.
- issue: Saklaw ng תּוֹרָה
  choice: kautusan
  alternative: turo
  rationale: Ang “kautusan” ay matibay at pamilyar na salin sa kontekstong ito, ngunit hindi itinatangging maaari ring tumukoy ang salita sa mas malawak na banal na pagtuturo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na “dinidisiplina” para sa corrective at formative na diwa ng pandiwa, at pinanatili ang makatang banal na pangalang “Yah.”
