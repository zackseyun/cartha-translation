base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: tl
  text: Ang nagtanim ng tainga[a], hindi ba siya nakaririnig? Ang humubog ng mata[b], hindi ba siya nakakakita?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglagay ng tainga.” Literal na “nagtanim” ang pandiwang Hebreo, isang matingkad na larawan ng paglikha.
    reason: lexical_alternative
  - marker: b
    text: O “humubog ng mata … hindi ba siya tumitingin?” Ang huling pandiwang Hebreo ay maaari ring mangahulugang “tumingin” o “magmasid,” ngunit dito ay tumutukoy ito sa kakayahang makakita.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: nagtanim
  rationale: Pinananatili ang matingkad at literal na larawang pangkalikhaan ng pandiwang ‘magtanim,’ sa halip na pahinain ito bilang simpleng ‘gumawa.’
- source_word: אֹזֶן
  choice: tainga
  rationale: Tuwirang kahulugan ng pisikal na tainga; pinanatili ang isahan at ang pagtutulad nito sa ‘mata.’
- source_word: יִשְׁמָע
  choice: makaririnig
  rationale: Tumutukoy rito sa kakayahang makarinig, hindi pangunahin sa masunuring pakikinig. Ang anyong may ‘maka-’ ay likas sa retorikal na pangangatwiran mula sa kakayahang nilikha tungo sa Maylikha.
- source_word: יֹצֵר
  choice: humubog
  rationale: Ipinahahayag ang sinadya at masining na paghubog, na kaayon ng larawan ng isang manlilikha o manggagawa.
- source_word: עַיִן
  choice: mata
  rationale: Pangunahing leksikal na kahulugan; pinanatili ang isahan para sa balanseng patula sa ‘tainga.’
- source_word: יַבִּיט
  choice: makakakita
  rationale: Bagaman maaari itong mangahulugang ‘tumingin’ o ‘magmasid,’ ang konteksto ay nakatuon sa kakayahang makakita na kaugnay ng mata; natural dito ang ‘makakakita.’
- source_word: הֲ...הֲלֹא
  choice: hindi ba siya ...?
  rationale: Pinananatili ang retorikal na tanong na umaasa ng sagot na oo.
- source_word: אִם
  choice: Ang humubog
  rationale: Sa ikalawang magkatulad na sugnay, gumaganap ito bilang panandang nagpapatuloy sa retorikal na paralelismo, hindi bilang karaniwang kondisyunal na ‘kung.’
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pandama ng Diyos
  choice: Pinanatili ang kongkretong pangangatwiran mula sa Maylikha tungo sa nilalang sa pamamagitan ng ‘tainga,’ ‘mata,’ ‘makaririnig,’ at ‘makakakita.’
  alternative: Isabuod bilang ‘Ang nagbigay ng pandinig at paningin ay tiyak na nakaaalam.’
  rationale: Hindi inaalis ng Hebreo ang matingkad na larawan o ipinapaliwanag nang abstrakto kung paano nakakikita at nakaririnig ang Diyos. Pinananatili ng salin ang lakas at tensiyong teolohikal ng retorikal na tanong.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at balanseng paralelismo, ang isahang ‘tainga’ at ‘mata,’ at ang dalawang retorikal na tanong. Ginamit ang ‘nagtanim’ kahit hindi ito ang pinakakaraniwang kolokasyon sa Filipino upang mapanatili ang sinadyang metapora ng Hebreo; nilinaw ito sa talababa.
