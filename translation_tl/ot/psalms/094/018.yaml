  text: Kapag sinabi ko, “Nadudulas ang paa ko,” inaalalayan ako ng iyong tapat na pag-ibig, O PANGINOON.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Nang sabihin ko
  rationale: Bagaman karaniwang kondisyonal ang אִם, sa kontekstong ito maaari itong magpakilala ng isang naganap na pagkakataon; ang “Nang” ay natural sa Tagalog at kaayon ng diwa ng salaysay.
- source_word: מָטָה רַגְלִי
  choice: Nadudulas ang paa ko
  rationale: Ang מָטָה ay tumutukoy sa paglihis, pag-uga, o pagkadulas ng paa; pinananatili ng salin ang kongkretong larawan ng pagkawala ng matatag na tuntungan.
- source_word: חַסְדְּךָ
  choice: ang tapat mong pag-ibig
  rationale: Ipinahahayag ang חֶסֶד bilang matatag at tapat na pag-ibig sa loob ng ugnayan, nang hindi nililimitahan ito sa awa lamang.
- source_word: יְהוָה
  choice: O PANGINOON
  rationale: Ginagamit ang nakaugaliang marangal na salin ng banal na pangalan sa malaking titik.
- source_word: יִסְעָדֵנִי
  choice: ang umalalay sa akin
  rationale: Ang pandiwa ay nangangahulugang sumuporta o umalalay; ang aspektong Tagalog na “umalalay” ay natural na naglalarawan sa ginawang pagsagip.
theological_decisions:
- issue: Ugnayan ng panganib at banal na pag-ibig
  choice: Pinanatili ang larawan na ang tapat na pag-ibig ng PANGINOON ang umalalay sa nagsasalita habang nadudulas siya.
  alternative: Gawing mas tiyak na tumutukoy sa espirituwal na pagkahulog o ganap na pagliligtas.
  rationale: Hindi tinutukoy ng talata kung pisikal, emosyonal, o espirituwal ang panganib; pinananatili ang malawak na talinghaga at hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matalinghagang “paa” at ang tuwirang panawagang “O PANGINOON.”
