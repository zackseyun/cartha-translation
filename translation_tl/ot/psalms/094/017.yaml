  naturalness: Ang ‘kaunti na lamang sana at nanahan na’ ay nauunawaan, ngunit hindi gaanong likas ang ayos nito sa modernong Filipino. Ang ‘halos nanahan na’ ay mas tuwiran at idiomatiko, at malinaw pa ring naghahayag na muntik nang mangyari ang kinalabasan.
  terminology: Ang ‘Yahweh,’ ‘saklolo,’ ‘katahimikan,’ at ‘kaluluwa’ ay angkop sa marangal ngunit modernong rehistro. Ang ‘saklolo ko’ ay mas likas na pagpapahayag kaysa ‘saklolo sa akin’ sa pangungusap na ito. Ang alternatibong ‘buhay ko’ para sa נפשׁ ay nararapat panatilihin sa talababa.
