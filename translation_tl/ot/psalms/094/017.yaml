  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: tl
  text: Kung hindi naging saklolo ko si Yahweh, halos nanahan na sa katahimikan[b] ang kaluluwa ko[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buhay ko.” Ang salitang Hebreo para sa “kaluluwa” (nefesh) ay maaari ring tumukoy sa sarili o sa buhay ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “katahimikan” ay malamang na tumutukoy sa katahimikan ng kamatayan o ng Sheol.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Kung hindi
  rationale: Naghaharap ito ng kondisyong salungat sa nangyari; likas sa Filipino ang “Kung hindi” sa ganitong pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עֶזְרָתָה לִּי
  choice: naging saklolo sa akin
  rationale: Ipinapahayag ng parirala na si Yahweh mismo ang tulong ng salmista. Ang “saklolo” ay likas, marangal, at angkop sa kagyat na panganib na ipinahihiwatig ng talata.
- source_word: כמעט
  choice: kaunti na lamang sana
  rationale: Pinananatili nito ang diwa ng isang kinalabasang muntik na o napakalapit nang mangyari, habang iniuugnay ng “sana” ang parirala sa kondisyong salungat sa nangyari.
- source_word: שכנה
  choice: nanahan na
  rationale: Pinananatili ng “nanahan” ang larawan ng paninirahan o pagtira na nasa pandiwang Hebreo, sa halip na gawing tuwirang pahayag lamang tungkol sa pagkamatay.
- source_word: דומה
  choice: katahimikan
  rationale: Ito ang tuwirang kahulugan ng pangngalan. Hindi ginawang tahasan sa pangunahing teksto ang posibleng pagtukoy nito sa kamatayan o Sheol.
- source_word: נפשי
  choice: kaluluwa ko
  rationale: Pinananatili nito ang makatang antropolohikal na pananalita ng Hebreo, habang inilalahad sa talababa ang posible ring kahulugang “buhay ko.”
theological_decisions:
- issue: Kung gagawing tahasan ang pahiwatig ng דומה sa kamatayan o Sheol
  choice: Panatilihin ang “katahimikan” sa pangunahing teksto
  alternative: “katahimikan ng kamatayan,” “kamatayan,” o “Sheol”
  rationale: Malamang na kamatayan o Sheol ang ipinahihiwatig, ngunit “katahimikan” mismo ang sinasabi ng salitang Hebreo. Pinananatili nito ang tayutay at hindi nilulutas nang labis ang pahiwatig ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “saklolo” at “nanahan” upang mapanatili ang makatang himig at larawan ng Hebreo nang hindi nagiging lipas o labis na teknikal.
