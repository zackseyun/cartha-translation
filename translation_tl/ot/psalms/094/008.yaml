  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: tl
  text: Unawain ninyo ito, kayong mga walang isip sa bayan; at kayong mga hangal, kailan kayo magkakaroon ng unawa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Unawain ninyo ito
  rationale: Ang pautos na anyong maramihan ay tuwirang nananawagan sa mga tinutukoy na kilalanin o maunawaan ang katotohanang ipinahahayag sa konteksto.
- source_word: בֹּעֲרִים
  choice: mga asal-hayop
  rationale: Ang salita ay hindi lamang nangangahulugang walang isip; inilalarawan nito ang taong magaspang at walang unawa na gaya ng hayop. Pinananatili ng salin ang matalim na talinghaga nang hindi gumagamit ng malabong salitang bihira sa modernong Tagalog.
- source_word: בָּעָם
  choice: sa gitna ng bayan
  rationale: Likas na Tagalog para sa pariralang tumutukoy sa mga taong kabilang o nasa loob ng bayan.
- source_word: כְסִילִים
  choice: mga hangal
  rationale: Karaniwan at dignified na katumbas ng katawagang karunungang tumutukoy sa mga taong matigas at salat sa wastong paghatol.
- source_word: תַּשְׂכִּילוּ
  choice: magkakaroon ng unawa
  rationale: Ipinahahayag ang pagdating sa matinong pagkaunawa o karunungan; mas natural ito sa tanong na Tagalog kaysa sa literal na 'magiging marunong.'
theological_decisions:
- issue: Lakas ng pagsaway sa בֹּעֲרִים
  choice: mga asal-hayop
  alternative: mga walang isip
  rationale: Pinananatili ang mapanuyang paghahambing sa hayop na nasa Hebreo, sa halip na pahinain ito tungo sa pangkalahatang kakulangan ng isip.
- issue: Saklaw ng בָּעָם
  choice: sa gitna ng bayan
  alternative: sa mga bayan
  rationale: Ang tekstong Masoretiko ay may pang-isahang 'bayan'; hindi ito pinalawak sa mga bansa o mga bayan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, matalim, at angkop sa estilong patula ng Awit. Ginamit ang 'bayan' sa halip na 'mga tao' upang mapanatili ang kolektibong diwa ng עָם, at iningatan ang retorikal na diin ng dalawang panawagan.
