  text: וַ֭/יֹּ֣אמְרוּ לֹ֣א יִרְאֶה יָּ֑הּ וְ/לֹא יָ֝בִ֗ין אֱלֹהֵ֥י יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: tl
  text: At sinasabi nila, “Hindi nakikita ni Yah[a], at hindi nauunawaan ng Diyos ni Jacob.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Yah,” ang maikling anyong patula ng banal na pangalan; ihambing sa mas karaniwang anyo ng tipanang pangalan na madalas isaling “ang PANGINOON.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinasabi nila
  rationale: Bagaman maaaring pormal na isaling pangnagdaan ang wayyiqtol, inilalahad dito sa tulang diskurso ang palagiang sinasabi ng masasama; kaya natural at angkop ang pangkasalukuyang “sinasabi nila.”
- source_word: לֹא יִרְאֶה
  choice: Hindi nakikita
  rationale: Pinananatili nito ang konkretong larawan ng paningin at ang pahayag ng masasama na hindi namamasdan o napapansin ng Diyos ang kanilang ginagawa.
- source_word: יָּהּ
  choice: Yah
  rationale: Ito ang maikling anyong patula ng banal na pangalan, hindi ang buong anyong יהוה; pinananatili ang pagkakaibang nasa tekstong Hebreo.
- source_word: וְלֹא יָבִין
  choice: at hindi nauunawaan
  rationale: Ang בין ay tumutukoy sa pag-unawa o pagkilala. Ang “nauunawaan” ay tuwiran at natural, at hindi nililimitahan ang diwa sa simpleng pagbibigay-pansin.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: ang Diyos ni Jacob
  rationale: Malinaw at likas sa Filipino ang anyong ito at pinananatili ang tipanang titulong tumutukoy sa Diyos ng Israel.
theological_decisions:
- issue: Paglilipat sa maikling anyong patula ng banal na pangalan na יָּהּ
  choice: Yah
  alternative: ang PANGINOON
  rationale: Ginamit ng pinagmulang teksto ang יָּהּ, hindi ang buong יהוה. Ang “Yah” ay nagpapanatili sa natatanging maikling anyong patula nang hindi ito ipinapantay sa karaniwang salin ng buong tipanang pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak at mariing pagkakahanay ng dalawang pagtanggi sa Hebreo, gayundin ang ambiguwidad kung ang sinasabi ay kawalan ng pagmamasid o kawalan ng pagkaunawa ng Diyos.
