  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: tl
  text: Bumangon ka[a], Hukom ng daigdig; ibigay mo sa mga palalo ang kabayarang nararapat sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itaas mo ang iyong sarili” o “Maitaas ka.” Ang pandiwang Hebreo ay maaari ring unawain nang mas literal bilang panawagan sa Diyos na iangat ang kanyang sarili o maitaas.
    reason: lexical_alternative
  - marker: b
    text: 'O “gantihan mo ang mga palalo ayon sa nararapat sa kanila.” Mas literal: “ibalik mo ang kabayaran sa mga palalo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Bumangon ka
  rationale: Ang anyong pautos ay nananawagan sa Diyos na itaas ang sarili at kumilos. Likas sa makabagong Tagalog ang “Bumangon ka” bilang panawagan para sa agarang pagkilos, samantalang pinananatili sa talababa ang mas literal na diwa ng pagtataas sa sarili.
- source_word: שֹׁפֵט
  choice: Hukom
  rationale: Ginagamit ang participle bilang pantanging tawag o titulo sa Diyos. Maikli, marangal, at malinaw ang “Hukom.”
- source_word: הָאָרֶץ
  choice: ng daigdig
  rationale: Sa patulang pagtawag sa Diyos bilang pangkalahatang Hukom, mas angkop ang “daigdig” kaysa “lupain,” na maaaring magmukhang tumutukoy lamang sa isang teritoryo.
- source_word: הָשֵׁב
  choice: ibalik mo
  rationale: 'Pinananatili nito ang larawan ng Hiphil na pautos mula sa שוב: ipabalik o ibunton sa pinatutungkulan ang kabayaran. Sa pariralang ito, malinaw na ang pagbabalik ay hudisyal na pagganti.'
- source_word: גְּמוּל
  choice: ang nararapat na ganti
  rationale: Ang גְּמוּל ay kabayaran o ganti ayon sa ginawa. Nililinaw ng “nararapat” ang diwa ng karampatang kabayaran nang hindi dinaragdagan ang saklaw ng talata.
- source_word: עַל
  choice: sa
  rationale: Minamarkahan ng עַל ang pinatutungkulan ng ganti. Natural sa Tagalog ang “ibalik ... sa mga palalo.”
- source_word: גֵּאִים
  choice: mga palalo
  rationale: Tumutukoy ito sa mga taong mapagmataas o hambog sa moral na diwa. Ang “mga palalo” ay matindi ngunit dignidad na salitang angkop sa panulaan ng Awit.
theological_decisions:
- issue: Kalikasan ng panawagan para sa paghatol ng Diyos
  choice: Isang pakiusap sa Diyos, bilang Hukom ng daigdig, na kumilos at maglapat ng nararapat na ganti sa mga palalo.
  alternative: Isang panawagan pangunahin na magpakadakila ang Diyos o mahayag ang kanyang kadakilaan, sa halip na kumilos sa paghatol.
  rationale: Magkatuwang ang dalawang pautos at ang mga salitang may kinalaman sa paghatol—“Hukom” at “ganti”—kaya nangingibabaw ang panawagan para sa aktibong paghatol. Gayunman, kinikilala sa talababa ang posibleng mas literal na diwa ng “itaas mo ang iyong sarili.”
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal at patulang himig. Pinili ang “daigdig” para sa pangkalahatang saklaw at “mga palalo” para sa moral na pagmamataas. Ang bahagyang literal na ayos na “ibalik ... ang nararapat na ganti” ay nagpapanatili sa larawan ng tekstong Hebreo habang nananatiling natural sa Filipino.
