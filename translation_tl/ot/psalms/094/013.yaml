base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/013.yaml
  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: tl
  text: upang bigyan siya ng pahinga mula sa mga araw ng kaguluhan[a], hanggang sa mahukay ang hukay[b] para sa masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa masasamang araw.” Literal sa Hebreo ang “mula sa mga araw ng kasamaan,” na maaaring mangahulugang mga araw na tigib ng hirap o kapahamakan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “hukay ng kapahamakan.” Bukod sa payak na kahulugang “hukay,” ang salitang Hebreo ay maaaring magpahiwatig ng pagkawasak o libingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט
  choice: upang bigyan siya ng pahinga
  rationale: Ang Hiphil infinitive ng שׁקט ay nagpapahayag ng pagsasanhi na mapahinga o hindi magambala ang isang tao. Likas sa makabagong Filipino ang “bigyan siya ng pahinga,” at ipinakikita ng “upang” ang layuning kaugnay ng naunang talata.
- source_word: לוֹ
  choice: siya
  rationale: Ang hulaping panghalip ay tumutukoy sa tumatanggap o nakikinabang sa pagkilos; likas itong isinama sa pariralang “bigyan siya ng pahinga.”
- source_word: מִימֵי רָע
  choice: mula sa mga araw ng kaguluhan
  rationale: Literal itong “mula sa mga araw ng kasamaan/masama,” ngunit sa konteksto ay tumutukoy sa mga panahong may hirap o kapahamakan. Pinananatili ng “mga araw ng kaguluhan” ang larawang pangpanahon nang natural sa Filipino.
- source_word: עַד
  choice: hanggang sa
  rationale: Karaniwang panandang temporal ito para sa hangganan ng panahong tinutukoy.
- source_word: יִכָּרֶה
  choice: mahukay
  rationale: 'Ang Niphal imperfect ng כרה ay pinakamalamang na pasibo: ang hukay ay mahuhukay o maihahanda. Ang “mahukay” ay maikli at natural na pasibong anyo sa Filipino.'
- source_word: לָרָשָׁע
  choice: para sa masama
  rationale: Ang pang-isahang pang-uri ay ginamit bilang pangngalan para sa taong masama bilang kinatawang uri. Pinananatili ng “masama” ang pang-isahang anyo at hindi ito nililimitahan sa isang kasarian.
- source_word: שָׁחַת
  choice: ang hukay
  rationale: Karaniwang tumutukoy ang שׁחת sa isang hukay na maaaring may pahiwatig ng pagkawasak o libingan. Ang “hukay” ang pinakadirektang salin; inilalahad sa talababa ang mas mabigat na pahiwatig.
theological_decisions:
- issue: Kalikasan ng pahingang ibinibigay sa taong dumaranas ng hirap
  choice: pahinga mula sa mga araw ng kaguluhan hanggang dumating ang hatol sa masama
  alternative: panloob na kapanatagan habang nagpapatuloy ang kaguluhan, o pahingang tumutukoy lamang sa wakas ng panahon
  rationale: Iniuugnay ng balarila ang layunin ng pagtuturo o pagdidisiplina sa naunang talata sa pahingang ibinibigay “mula sa mga araw ng kaguluhan,” na may hangganang “hanggang sa” mahukay ang hukay para sa masama. Hindi dinaragdagan ng salin ang teksto upang tiyaking panlabas lamang o panloob lamang ang pahingang ito, at hindi rin ito nililimitahan sa isang eskatolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalinghagang “mga araw” at “hukay,” pati ang temporal na tensiyon ng “hanggang sa,” nang hindi ipinapasiya kung ang pahinga ay pangunahing panlabas, panloob, o pangwakas.
