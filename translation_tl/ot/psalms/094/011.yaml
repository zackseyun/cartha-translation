  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: tl
  text: Alam ni Yahweh ang mga iniisip ng tao—ang mga iyon ay singaw lamang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: מַחְשְׁבוֹת
  choice: mga iniisip
  rationale: Likas sa makabagong Tagalog at saklaw ang mga kaisipan o balak na nasa isip.
- source_word: אָדָם
  choice: tao
  rationale: Kolektibo at pangkalahatan ang gamit dito, hindi tumutukoy sa pangalang Adan.
- source_word: הָבֶל
  choice: singaw lamang
  rationale: Pinananatili ang kongkretong larawan ng isang bagay na panandalian, walang sustansiya, at madaling maglaho; ang 'lamang' ay likas na naghahatid ng predikatibong diin.
theological_decisions:
- issue: Saklaw ng kaalaman ng Diyos at kabuluhan ng isip ng tao
  choice: Alam ni Yahweh ang mga iniisip ng tao—ang mga iyon ay singaw lamang.
  alternative: Alam ni Yahweh na walang kabuluhan ang mga iniisip ng tao.
  rationale: Pinananatili ang ayos at larawang matalinghaga ng Hebreo sa halip na ipakahulugan lamang ang הבל bilang abstraktong 'walang kabuluhan.' Hindi rin pinipili nang tahasan kung ang כִּי ay nilalamang nalalaman o paliwanag, yamang maihahatid ng gitling ang ugnayan nang hindi labis na nilulutas ang sintaktikong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang em dash upang natural na maipahayag ang ikalawang sugnay habang pinananatili ang maikli at matalim na anyo ng taludtod.
