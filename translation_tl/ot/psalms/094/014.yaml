  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: tl
  text: Sapagkat hindi itatakwil ni Yahweh ang kanyang bayan; hindi niya pababayaan ang kanyang mana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “minanang pag-aari” para sa “mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayang ugnayan ng talata sa naunang pahayag.
- source_word: יִטֹּשׁ
  choice: hindi itatakwil
  rationale: Ipinahahayag ang diwa ng pagtataboy o pagtalikod sa isang tao, at angkop sa tipanang konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ang 'bayan' ay natural na salin ng עַם at pinananatili ang kolektibo at tipanang diwa.
- source_word: נַחֲלָתוֹ
  choice: ang kanyang mana
  rationale: Pinananatili ng 'mana' ang larawan ng isang minana o itinakdang pag-aari, dito ay tumutukoy sa bayan bilang kay Yahweh.
- source_word: יַעֲזֹב
  choice: hindi niya pababayaan
  rationale: Ipinahahayag ang diwa ng hindi pag-iwan o pag-abandona habang iniiwasang gawing magkapareho ang dalawang magkaugnay ngunit magkaibang pandiwa.
theological_decisions:
- issue: Paglalarawan sa tipanang bayan bilang נַחֲלָתוֹ
  choice: ang kanyang mana
  alternative: ang kanyang minanang pag-aari
  rationale: Ang 'mana' ay maikli at natural ngunit pinananatili ang teolohikal na larawan ng bayan bilang natatanging pag-aari ni Yahweh, nang hindi ito labis na ipinapaliwanag sa pangunahing teksto.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Pinananatili ang personal na pangalang tahasang nasa tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng dalawang sugnay at pinag-iba ang יִטֹּשׁ ('itatakwil') sa יַעֲזֹב ('pababayaan').
