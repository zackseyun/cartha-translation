translation:
  language: tl
  text: Hanggang kailan, Yahweh, ang masasama—hanggang kailan magbubunyi[a] ang masasama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magagalak nang buong galak”; ang pandiwang Hebreo ay nagpapahiwatig ng masidhing pagsasaya, na maaaring may himig ng pagtatagumpay.
