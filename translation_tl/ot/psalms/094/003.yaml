lexical_decisions:
- source_word: עַד מָתַי
  choice: Hanggang kailan pa
  rationale: Likas na pananalita sa Filipino para sa tanong tungkol sa tagal ng isang kalagayang nagpapatuloy; ipinahihiwatig ng “pa” ang apurahang hinaing ng salmista.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Tumutukoy ang pangmaramihang pang-uri na ginamit bilang pangngalan sa isang uri ng mga taong gumagawa ng masama. Maikli at natural itong katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: יַעֲלֹזוּ
  choice: magbubunyi
  rationale: Ipinapahayag ng pandiwa ang masidhi at halos matagumpay na kagalakan; mas angkop ang “magbubunyi” kaysa sa mas neutral na “magagalak.”
- source_word: pag-uulit ng עַד מָתַי רְשָׁעִים
  choice: Hanggang kailan pa ... ang masasama? Hanggang kailan pa ... ang masasama?
  rationale: Pinananatili ang mariing pag-uulit at ang bitin o eliptikong anyo ng unang sigaw sa Hebreo, sa halip na punan ito ng pandiwang wala sa teksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Elipsis sa unang kalahati ng talata
  choice: “Hanggang kailan pa, Yahweh, ang masasama?”
  alternative: “Hanggang kailan pa magpapatuloy ang masasama, Yahweh?”
  rationale: Walang tahasang pandiwa sa unang kalahati ng Hebreo. Pinananatili ng napiling anyo ang matinding, bitin na hinaing at hindi ipinapasok ang interpretasyong “magpapatuloy.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang “Hanggang kailan pa” ay likas sa panalangin o hinaing, samantalang ang pag-uulit at maikling unang tanong ay nagpapanatili sa diin at tensiyon ng tulang Hebreo.
