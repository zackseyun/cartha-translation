  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: tl
  text: Sino ang babangon para sa akin laban sa masasama? Sino ang maninindigan para sa akin laban sa mga gumagawa ng kasamaan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong עִם ay karaniwang nangangahulugang “kasama,” ngunit dito ay “laban sa” ang diwa dahil ang tinutukoy ay pagharap at pagsalungat sa masasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Ang panghalip na pananong ay inuulit sa dalawang magkatulad na tanong; likas itong isalin na “Sino.”
- source_word: יָקוּם
  choice: babangon
  rationale: Pinananatili ang malinaw na larawan ng pagtindig o pagbangon upang kumilos, gayundin ang diwa ng di-ganap na pandiwa sa retorikal na tanong.
- source_word: לִי
  choice: para sa akin
  rationale: Ang לִי ay nagpapahayag dito ng kapakinabangan o pagkilos alang-alang sa nagsasalita, hindi lamang ng direksiyon.
- source_word: עִם
  choice: laban sa
  rationale: Karaniwang nangangahulugang “kasama,” ngunit sa kontekstong pakikipagtunggali sa masasama, ang likas na diwa nito sa Filipino ay “laban sa.”
- source_word: מְרֵעִים
  choice: masasama
  rationale: Tumutukoy ang participle sa mga taong gumagawa ng masama; ang “masasama” ay maikli, natural, at malinaw sa modernong Filipino.
- source_word: יִתְיַצֵּב
  choice: maninindigan
  rationale: Ipinahihiwatig ng Hitpael ang matatag na pagpuwesto o paninindigan. Pinananatili ng “maninindigan” ang aktibo at matatag na diwa at ang paralelismo sa “babangon.”
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Likas na isinasalin sa Filipino ang Hebreong parirala bilang mga taong nagsasagawa o namumuhay sa kasamaan.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa pariralang ito, tumutukoy ang salita sa moral na kasamaan o masamang gawain; malinaw at hindi labis na teknikal ang “kasamaan.”
