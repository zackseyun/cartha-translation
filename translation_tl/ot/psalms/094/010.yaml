  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: tl
  text: Ang nagdidisiplina sa mga bansa, hindi ba siya sasaway—siya na nagtuturo ng kaalaman sa tao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sangkatauhan”; ang Hebreong salita ay “tao” (אָדָם), na nasa isahan ngunit kumakatawan sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: dumidisiplina
  rationale: Ipinahihiwatig ng pandiwang mula sa יסר ang pagdidisiplinang nagwawasto, hindi lamang pagpaparusa; natural din ito sa makabagong Filipino.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansa o mga bayan sa pangkalahatan, hindi partikular sa mga Hentil.
- source_word: יוֹכִיחַ
  choice: sasaway
  rationale: Ang Hiphil ng יכח ay nagpapahayag ng pagsaway o pagtutuwid. Pinananatili ng “sasaway” ang diin ng retorikal na tanong at ang pagkakatugma nito sa pagdidisiplina.
- source_word: הַמְלַמֵּד
  choice: siya na nagtuturo
  rationale: Ang participle ay ginagamit bilang paglalarawan sa Diyos; pinananatili ng salin ang paralelismong Hebreo.
- source_word: אָדָם
  choice: tao
  rationale: Ang pangngalan ay nasa isahan ngunit kumakatawan sa sangkatauhan. Sa Filipino, natural na naipahahayag ng “tao” ang kinatawang isahan nang hindi nililimitahan sa kasariang lalaki.
- source_word: דָּעַת
  choice: kaalaman
  rationale: Ito ang tuwiran at likas na katumbas ng דעת bilang layon ng “nagtuturo.”
- source_word: הֲ...הֲלֹא
  choice: hindi ba siya ...?
  rationale: Ang magkakaugnay na panandang patanong ay bumubuo ng retorikal na tanong na umaasa ng sagot na oo.
theological_decisions:
- issue: Pangkalahatang gamit ng אָדָם
  choice: tao
  alternative: sangkatauhan
  rationale: Ang tinutukoy ay ang tao sa pangkalahatan, ngunit isahan ang anyong Hebreo. Pinananatili ng “tao” ang kinatawang isahan at natural ito sa Filipino; itinatala sa talababa ang kolektibong diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang iisang retorikal na tanong at ang paralelismo ng dalawang paglalarawan sa Diyos.
