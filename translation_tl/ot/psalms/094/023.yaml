  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֤שֶׁב עֲלֵי/הֶ֨ם אֶת אוֹנָ֗/ם וּ/בְ/רָעָתָ֥/ם יַצְמִיתֵ֑/ם יַ֝צְמִיתֵ֗/ם יְהוָ֥ה אֱלֹהֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: tl
  text: Ibabalik niya sa kanila ang kanilang kasamaan[a], at sa kanilang kasamaan ay lilipulin niya sila[b]; lilipulin sila ni Yahweh[c], na ating Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ibinalik na niya sa kanila ang kanilang maling gawa.” Maaaring magkaroon ng naganap o hinaharap na diwa ang pandiwang Hebreo sa kontekstong patula; ang salitang isinaling “kasamaan” ay maaari ring mangahulugang “maling gawa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “dahil sa kanilang kasamaan ay lilipulin niya sila” o “sa pamamagitan ng kanilang kasamaan ay lilipulin niya sila.” Maaaring magpahiwatig ang pang-ukol na Hebreo ng kaugnayan, dahilan, o paraan.
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; isinalin dito bilang “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: Ibabalik niya sa kanila
  rationale: Pinananatili nito ang larawan ng pagpapabalik sa kanila ng bunga o pananagutan ng sarili nilang ginawa. Ang anyong pandiwa ay isinalin bilang tiyak na pahayag tungkol sa darating na paghatol, ayon sa kasunod na mga pandiwa.
- source_word: אֶת אוֹנָם
  choice: ang kanilang kasamaan
  rationale: Ang אוֹן ay maaaring tumukoy sa kasamaan, maling gawa, o kapahamakang dulot nito. Sa konteksto ng makatarungang pagganti, natural at malinaw ang “kanilang kasamaan,” habang binabanggit sa talababa ang iba pang maaaring diwa.
- source_word: וּבְרָעָתָם
  choice: at sa kanilang kasamaan
  rationale: Ang payak na “sa” ay nagpapanatili sa siksik at bahagyang bukás na diwa ng pang-ukol na ב, na maaaring magpahiwatig ng kaugnayan, dahilan, o paraan.
- source_word: יַצְמִיתֵם
  choice: lilipulin niya sila
  rationale: Ipinahahayag ng צמת sa causative form ang ganap at matinding pagpuksa. Ang “lilipulin” ay natural, marangal, at sapat ang tindi; pinanatili rin ang pag-uulit ng Hebreo.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, na ating Diyos
  rationale: Ang personal na pangalang יְהוָה ay tinumbasan ng “Yahweh,” at ang אֱלֹהֵינוּ ay tuwirang “ating Diyos.”
theological_decisions:
- issue: Panahunan o aspekto ng pambungad na וַיָּשֶׁב sa tulang Hebreo
  choice: Ibabalik niya
  alternative: Ibinalik na niya
  rationale: Bagaman maaaring unawain ang anyo bilang naganap na kilos, ang kasunod na dalawang imperfect na יַצְמִיתֵם at ang pahayag ng pagtitiwala sa paghatol ng Diyos ay umaayon sa hinaharap na salin. Hindi itinatago ang alternatibo at inilalagay ito sa talababa.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong pangalan sa halip na palitan ng isang titulo.
- issue: Kahulugan ng ב sa וּבְרָעָתָם
  choice: sa kanilang kasamaan
  alternative: dahil sa kanilang kasamaan; sa pamamagitan ng kanilang kasamaan
  rationale: Hindi tiyak kung ang kasamaan nila ang batayan, paraan, o kalagayang kaugnay ng paglipol. Pinananatiling maikli at bahagyang bukás ang pangunahing salin, at inilalahad sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang matinding pandiwang “lilipulin” at ang pag-uulit nito upang matumbasan ang diin ng tulang Hebreo. Ang ayos na “Yahweh, na ating Diyos” ay natural sa Filipino at malinaw na inuugnay ang banal na pangalan sa “ating Diyos.”
