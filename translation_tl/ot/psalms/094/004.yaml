translation:
  language: tl
  text: Bumubulwak ang kanilang mga salita[a]; nagsasalita sila nang may kayabangan; nagmamalaki ang lahat ng gumagawa ng kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ibinubulwak nila ang mga salita; nagsasalita sila ng mayayabang na salita.”
    reason: Pinananatili ng alternatibo ang di-tahasang layon ng unang pandiwa at isinasalamin ang posibleng pangngalang pagbasa sa עָתָק sa likas na Filipino.
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: Bumubulwak ang kanilang mga salita
  rationale: Ang Hiphil ng נבע ay naglalarawan ng saganang pagbulwak o pag-agos. Ipinahiwatig ng kasunod na pandiwang “nagsasalita” na mga salita ang bumubulwak, kaya tahasang idinagdag ang “kanilang mga salita” upang maging malinaw at natural sa Tagalog habang pinananatili ang matingkad na larawan.
- source_word: יְדַבְּרוּ
  choice: nagsasalita sila
  rationale: Tuwiran at likas na katumbas ng דבר, at pinananatili nito ang paralelismo sa naunang parirala.
- source_word: עָתָק
  choice: nang may kayabangan
  rationale: Sa kontekstong ito, tumutukoy ito sa mapagmataas o walang-galang na pananalita. Ang pariralang pang-abay ay malinaw na naglalarawan sa paraan ng kanilang pagsasalita nang hindi nililimitahan ang kahulugan sa pagyayabang lamang.
- source_word: יִתְאַמְּרוּ
  choice: nagmamalaki
  rationale: Ipinahahayag ng Hitpael ang pagmamataas o pagtataas sa sarili. Ang “nagmamalaki” ay maikli, natural, at angkop sa konteksto ng mapagmataas na pananalita.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili nito ang saklaw na walang itinatangi ng Hebreong salita.
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Malinaw at natural nitong naihahatid ang literal na diwang “mga gumagawa ng kasamaan/katiwalian,” habang iniiwasan ang mas luma o teknikal na pananalita.
