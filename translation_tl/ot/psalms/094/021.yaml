base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: tl
  text: Nagkakatipon sila[a] laban sa buhay ng taong matuwid, at hinahatulan nila ang dugong walang-sala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagbubuklod sila bilang isang pangkat laban sa buhay ng taong matuwid.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at ang dugong walang-sala ay ipinapahayag nilang may-sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: nagsasabwatan
  rationale: Ang Qal ng גדד ay maaaring tumukoy sa pagtitipon bilang isang pangkat para sa sama-samang pagkilos o paglusob. Sa kontekstong ito, ipinahihiwatig ng “nagsasabwatan” ang magkakasamang pagkilos na may masamang layunin nang hindi labis na nagdaragdag ng larawang militar.
- source_word: עַל
  choice: laban sa
  rationale: Kasunod ng pandiwang nagsasaad ng mapanlabang pagkilos, malinaw nitong ipinapahayag ang pagsalungat o pag-atake.
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa buhay ng taong matuwid na nanganganib, hindi sa isang hiwalay na espirituwal na “kaluluwa.” Kaayon din ito ng larawan ng dugong walang-sala sa ikalawang hati.
- source_word: צַדִּיק
  choice: taong matuwid
  rationale: Ang pang-isahang pang-uri ay ginamit bilang pangngalan. Natural sa modernong Filipino ang “taong matuwid,” at pinananatili nito ang kinatawang pang-isahan nang hindi ipinapalagay na lalaki ang tinutukoy.
- source_word: דָם
  choice: dugo
  rationale: Pinananatili nito ang tuwiran at matingkad na larawang Hebreo, pati ang ugnayan nito sa marahas na pagkitil ng buhay.
- source_word: נָקִי
  choice: walang-sala
  rationale: Tuwiran nitong ipinapahayag ang pagiging malaya sa pagkakasala at natural itong kaakibat ng “dugo” sa Filipino.
- source_word: יַרְשִׁיעוּ
  choice: hinahatulan
  rationale: Ang Hiphil ng רשע ay nangangahulugang magpahayag na may-sala o humatol. Ang “hinahatulan” ay natural at pinananatili ang tonong panghukuman, habang ipinakikita ng layong “dugong walang-sala” ang di-makatarungang paghatol.
theological_decisions:
- issue: Kinatawang pang-isahan sa צַדִּיק
  choice: taong matuwid
  alternative: ang matuwid; lalaking matuwid
  rationale: Maaaring tumukoy ang pang-isahang Hebreo sa isang huwaran o kinatawan ng uri. Ang “taong matuwid” ay nagpapanatili ng pang-isahan at hindi nagdaragdag ng tiyak na kasariang hindi kinakailangan ng konteksto.
- issue: Forensikong diwa ng יַרְשִׁיעוּ
  choice: hinahatulan nila
  alternative: ipinapahayag nilang may-sala
  rationale: Pinananatili ng “hinahatulan” ang legal o pampublikong diwa ng pandiwa ngunit hindi nilulutas kung pormal na hukuman o mas malawak na maling paghatol ang nasa isip.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagsasabwatan” upang natural na maipahayag ang sama-samang mapanlabang pagkilos, at “dugong walang-sala” upang mapanatili ang matingkad at forensikong larawan ng Hebreo.
