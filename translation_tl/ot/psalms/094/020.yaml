base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: tl
  text: Makikipag-alyansa ba sa iyo ang trono ng kapahamakan[a], na lumilikha ng pagdurusa sa pamamagitan ng batas?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “trono ng kapilyuhan” o “trono ng pagkawasak.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lumilikha ng pagdurusa sa ibabaw ng batas”; maaaring ang ibig sabihin ay ginagamit nito ang batas o kautusan bilang kasangkapan o dahilan upang magdulot ng pinsala.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: Makikipag-alyansa ba sa iyo
  rationale: Ipinahahayag ng anyong patanong ang pakikipag-ugnayan o pakikipagkampihan. Pinananatili ng “makikipag-alyansa” ang politikal at relasyonal na diwa ng tanong.
- source_word: כִּסֵּא
  choice: trono
  rationale: Karaniwang kahulugan nito ang “trono,” at dito'y kumakatawan sa kapangyarihan o pamahalaang naghahari.
- source_word: הַוּוֹת
  choice: kapahamakan
  rationale: Maaaring tumukoy sa mapanirang gawa, pinsala, o pagkawasak. Ang “kapahamakan” ay likas sa Filipino at pinananatili ang mapaminsalang lakas ng salita.
- source_word: יֹצֵר
  choice: lumilikha
  rationale: Mula sa pandiwang nangangahulugang humubog o lumikha. Pinananatili nito ang larawan ng sadyang pagbuo ng mapaminsalang patakaran.
- source_word: עָמָל
  choice: pagdurusa
  rationale: Saklaw ng salita ang hirap, gulo, pinsala, at mapang-aping paghihirap. Ang “pagdurusa” ay malinaw na bunga ng tiwaling pamamahala sa kontekstong ito.
- source_word: עֲלֵי חֹק
  choice: sa pamamagitan ng batas
  rationale: Literal na “sa/ibabaw ng batas o tuntunin.” Ipinakikita ng salin ang batas bilang kasangkapan sa paglikha ng pagdurusa nang hindi tahasang nagpapasiya kung ito'y instrumento o pagkukunwari lamang.
theological_decisions:
- issue: Ang kaugnayan ng Diyos sa mapanira at mapang-abusong pamamahala
  choice: Pinanatili bilang retorikal na tanong kung maaaring makipag-alyansa sa Diyos ang gayong kapangyarihan.
  alternative: Maunawaan bilang mas pangkalahatang tanong kung maaaring makisama sa Diyos sa paghatol ang isang di-makatarungang hukom.
  rationale: Ipinahihiwatig ng tanong ang hindi pagkakatugma ng Diyos at ng pamahalaang gumagamit ng batas upang magdulot ng pagdurusa, ngunit hindi ginawang tahasang pahayag ang ipinahihiwatig lamang ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang larawang politikal ng “trono,” ang retorikal na tanong, at ang bahagyang kalabuan ng pariralang legal. Inilagay ang mga pananda ng talababa sa mismong teksto.
