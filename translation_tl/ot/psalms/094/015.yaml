  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: tl
  text: Sapagkat ang paghatol ay babalik sa katuwiran[a], at susunod dito[b] ang lahat ng may matuwid na puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang katarungan ay babalik sa katuwiran.” Ang מִשְׁפָּט ay maaaring mangahulugang “paghatol” o “katarungan,” at ang צֶדֶק ay maaaring mangahulugang “katuwiran” o “katarungan.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at kasunod nito ang lahat ng matuwid ang puso.” Ang “nito” ay malamang na tumutukoy sa “paghatol,” ang pinakamalapit na pangngalan sa Hebreo; ipinahihiwatig ng Filipino ang pandiwang “susunod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan o katiyakang kaugnay ng naunang hinaing; natural itong panimula sa daloy ng salmo.
- source_word: עַד צֶדֶק
  choice: sa katuwiran
  rationale: Kasama ng pandiwang יָשׁוּב, ipinahihiwatig ng עַד ang tunguhin ng pagbabalik. Pinananatili ng “katuwiran” ang kaibahan nito sa מִשְׁפָּט.
- source_word: יָשׁוּב
  choice: ay muling babalik
  rationale: Tuwirang inilalarawan ng שוב ang pagbabalik. Ginagawang malinaw ng “muling” ang diwa ng pagpapanumbalik na likas sa konteksto.
- source_word: מִשְׁפָּט
  choice: paghatol
  rationale: Maaaring mangahulugan ang salita ng paghatol o katarungan. Ang “paghatol” ay nagpapanatili ng leksikal na kaibahan nito sa צֶדֶק habang tumutukoy sa pagsasagawa ng matuwid na pagpapasiya.
- source_word: וְאַחֲרָיו
  choice: at susunod dito
  rationale: Literal itong “at kasunod nito/kaniya.” Ang “susunod dito” ay likas na Filipino at ipinahahayag ang ipinahihiwatig na kilos nang hindi labis na tinutukoy kung ang sinusundan ay paghatol o katuwiran.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: ang lahat ng matuwid ang puso
  rationale: Ang יִשְׁרֵי לֵב ay tumutukoy sa mga taong matuwid sa kanilang panloob na disposisyon; malinaw at marangal sa modernong Filipino ang pariralang ito.
theological_decisions:
- issue: Ugnayan ng paghatol at katuwiran
  choice: Ang paghatol ay muling babalik sa katuwiran, kaya ipinahihiwatig na ang paghatol na nalihis ay muling aayon sa matuwid.
  alternative: Magpapatuloy ang paghatol hanggang manaig ang katuwiran; o ang katarungan ay babalik sa mga matuwid.
  rationale: Ang יָשׁוּב na may עַד צֶדֶק ay pinakanatural na nagpapahayag ng pagbabalik patungo sa katuwiran. Hindi pinalalawak ang pahayag tungo sa isang mas tiyak na sistematikong doktrina.
- issue: Tinutukoy ng hulaping panghalip sa וְאַחֲרָיו
  choice: Isinalin bilang “dito,” na natural na maituturing na tumutukoy sa paghatol ngunit hindi isinasara ang mas malawak na kaugnayan nito sa katuwiran.
  alternative: 'Tiyak na tumutukoy lamang sa katuwiran; o panatilihing walang pandiwa: “at kasunod nito ang lahat ng matuwid ang puso.”'
  rationale: Ang pinakamalapit na pangngalan ay מִשְׁפָּט, ngunit maaaring maunawaan ang buong ideya ng naibalik na matuwid na paghatol. Pinananatili ng “dito” ang angkop na antas ng kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikling paralelismong patula at iniwasan ang teknikal o denominasyonal na pananalita.
