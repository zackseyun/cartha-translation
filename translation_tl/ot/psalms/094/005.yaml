  yaml_path: translation/ot/psalms/094/005.yaml
  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: tl
  text: 'Ang iyong bayan, Yahweh[a], ay dinudurog nila,

    at ang iyong mana[b] ay pinahihirapan nila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng יהוה sa Hebreo.
    reason: divine_name
  - marker: b
    text: O “ang iyong minanang pag-aari.” Ang salitang Hebreo ay tumutukoy sa mana o bahaging inilaan bilang pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: ang iyong bayan
  rationale: Karaniwang tumutukoy ang עַם sa isang sambayanan, at dito ay sa bayang kinikilala bilang pag-aari ni Yahweh. Likas at marangal sa Filipino ang “iyong bayan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: יְדַכְּאוּ
  choice: dinurukmok nila
  rationale: Ang Piel ng דכא ay nagpapahiwatig ng matinding pagdurog o paniniil. Pinananatili ng “dinurukmok” ang matingkad na larawan at mas natural itong ilapat sa bayan kaysa sa literal na “dinudurog.”
- source_word: וְנַחֲלָתְךָ
  choice: at ang iyong mana
  rationale: Ang נַחֲלָה ay mana o bahaging inilaan bilang pag-aari. Pinananatili ng “mana” ang metapora ng Israel bilang minanang pag-aari ng Diyos.
- source_word: יְעַנּוּ
  choice: at pinahirapan
  rationale: Sa Piel, ang ענה ay maaaring mangahulugang pahirapan, apihin, o magdulot ng pagdurusa. Ang “pinahirapan” ay malinaw, matindi, at naiiba sa larawan ng unang pandiwa.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng transliterasyong “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Paglalarawan sa bayan bilang נַחֲלָה ng Diyos
  choice: iyong mana
  alternative: iyong pag-aari
  rationale: Hindi nilulutas o pinapawi ang teolohikal na metapora. Ang “mana” ay nagpapanatili sa ideya ng inilaan o minanang pag-aari, samantalang ang “pag-aari” ay mas tahasan ngunit hindi gaanong matalinghaga.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dinurukmok” upang mapanatili ang marahas na larawan ng pandiwang Hebreo, at “mana” upang hindi mawala ang metapora ng bayang kabilang sa Diyos.
