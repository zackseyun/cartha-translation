lexical_decisions:
- source_word: בְּרֹב
  choice: Kapag dumarami
  rationale: Ipinahahayag nito sa natural na Tagalog ang pangyayaring ipinakikita ng בְּ kasabay ng diwang ‘karamihan’ ng רֹב.
- source_word: שַׂרְעַפַּי
  choice: ang mga balisang kaisipan
  rationale: Sinasaklaw ng parirala ang mga isipang gumugulo, nagsasanga-sanga, o nahahati, nang hindi ito ginagawang karaniwang pag-iisip lamang.
- source_word: בְּקִרְבִּי
  choice: sa loob ko
  rationale: Natural at tuwirang ipinahahayag ang panloob na kalagayan ng nagsasalita.
- source_word: תַּנְחוּמֶיךָ
  choice: ang iyong mga kaaliwan
  rationale: Pinananatili ang maramihang anyo at ang diwa ng malalim at paulit-ulit na pag-aliw.
- source_word: יְשַׁעַשְׁעוּ
  choice: ang nagpapagalak
  rationale: Ipinahahayag ang matinding positibong diwa ng pagpapasaya at nakaaaliw na kasiyahan; ang pariralang may ‘ang’ ay natural na nagbibigay-diin sa kaaliwan ng Diyos.
- source_word: נַפְשִׁי
  choice: sa aking kaluluwa
  rationale: Pinananatili ang patula at debosyonal na rehistro ng נֶפֶשׁ bilang panloob na sarili.
