  source_fidelity: 'Tapat ang salin sa Hebreo. Naipahahayag ng “si Yahweh ay naging aking tanggulan” ang וַיְהִי יְהוָה לִי לְמִשְׂגָּב, at pinananatili ng ikalawang sugnay ang magkatambal na personal na pagpapahayag: “ang Diyos ko” at “kanlungan ko.” Ang “batong kanlungan ko” ay isang katanggap-tanggap na patulang paglilipat ng צוּר מַחְסִי at hindi nagdaragdag ng interpretasyong doktrinal.'
  naturalness: Makabago, malinaw, at marangal ang Filipino. Ang “tanggulan” at “kanlungan” ay angkop sa awit at malinaw na naiiba ang larawan ng kuta mula sa larawan ng bato. Bahagyang mas karaniwan ang “tanggulan ko” kaysa “aking tanggulan,” ngunit kapwa natural at walang kinakailangang pagbabago.
