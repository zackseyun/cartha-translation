base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/022.yaml
  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: tl
  text: Ngunit si Yahweh ay naging aking tanggulan[a], at ang Diyos ko ang batong kanlungan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Si Yahweh ay naging tanggulan ko.” Ang pandiwang Hebreo ay tumutukoy sa naganap na pangyayari, na maaaring unawaing may bungang nagpapatuloy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay naging
  rationale: Ipinahahayag ng anyong pandiwa ang isang naganap na realidad na nananatiling mahalaga sa kasalukuyang pagtitiwala ng salmista. Likas sa Filipino ang “ay naging,” samantalang ipinapaliwanag sa talababa ang maaaring diin sa patuloy na bunga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לִי לְמִשְׂגָּב
  choice: aking tanggulan
  rationale: Ang מִשְׂגָּב ay isang mataas at ligtas na dakong hindi madaling marating; malinaw at natural na naihahatid ng “tanggulan” ang larawan ng matibay na proteksiyon.
- source_word: וֵאלֹהַי
  choice: at ang Diyos ko
  rationale: Pinananatili nito ang tuwirang personal na ugnayan at ang paralelismo ng dalawang sugnay.
- source_word: לְצוּר מַחְסִי
  choice: ang batong kanlungan ko
  rationale: Pinananatili ang metapora ng צוּר bilang matatag at mapagtanggol na bato, at ang מַחְסִי bilang personal na kanlungan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit sa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Panahunan at patuloy na kabuluhan ng וַיְהִי
  choice: ay naging
  alternative: naging ... at nananatiling gayon / ay naging para sa akin
  rationale: Hindi nilulutas nang labis ang saklaw ng aspektong Hebreo. Ang pangunahing teksto ay natural at payak, habang ipinakikita ng talababa na maaaring idiin ang nagpapatuloy na bunga.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tanggulan” at “kanlungan” bilang malinaw at karaniwang mga salitang nagpapanatili sa magkatambal na larawang Hebreo ng matibay na kuta at mapagtanggol na bato.
