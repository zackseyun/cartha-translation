  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: tl
  text: Kahit lumakad ako sa libis ng matinding kadiliman[a], hindi ako matatakot sa anumang masama, sapagkat kasama kita; ang iyong pamalo at ang iyong tungkod—ang mga iyon ang umaaliw sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libis ng lilim ng kamatayan.” Ang salitang Hebreo ay maaaring tumukoy sa matinding kadiliman, na may posibleng pahiwatig ng kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: Kahit
  rationale: Likas na nagpapahayag ng pagpap concessive na diwa sa makabagong Tagalog nang hindi pinabibigat ang taludtod.
- source_word: אֵלֵךְ
  choice: lumakad ako
  rationale: Pinananatili ang larawan ng paglalakad at ang masiglang pangkalahatan o hinaharap na diwa ng Hebreong imperfect.
- source_word: בְּגֵיא
  choice: sa libis
  rationale: Ang “libis” ay natural at malawak na katumbas ng lambak o bangin; kasama ng “lumakad,” malinaw ang pagdaan sa lugar nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: צַלְמָוֶת
  choice: matinding kadiliman
  rationale: Ipinahahayag ang malamang na diwa ng napakalalim na dilim habang hindi nililimitahan ang salita sa kamatayan; inilalagay sa talababa ang tradisyonal na alternatibo.
- source_word: לֹא אִירָא רָע
  choice: hindi ako matatakot sa anumang masama
  rationale: Pinananatili ang lawak ng רָע, na maaaring tumukoy sa kasamaan, kapahamakan, o panganib.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: sapagkat kasama kita
  rationale: Natural sa Tagalog at malinaw na nagbibigay ng dahilan ng kawalan ng takot; ang ikalawang panauhan ay tuwirang pinananatili.
- source_word: שִׁבְטְךָ
  choice: iyong pamalo
  rationale: Ang “pamalo” ay angkop sa kasangkapan ng pastol at iniiwasang ipasok ang pangunahing larawan ng setro ng hari.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: iyong tungkod
  rationale: Likas na katumbas sa konteksto ng pastol at malinaw na naiiba sa pamalo.
- source_word: הֵמָּה
  choice: ang mga iyon
  rationale: Tahasan nitong pinananatili ang mariing hiwalay na panghalip sa Hebreo; tinutulungan din ng gitling ang diin.
- source_word: יְנַחֲמֻנִי
  choice: umaaliw sa akin
  rationale: Direkta at natural na saklaw ang pagbibigay-aliw at katiyakang ipinahihiwatig sa konteksto.
theological_decisions:
- issue: Kahulugan ng צַלְמָוֶת sa bantog na tradisyonal na parirala
  choice: matinding kadiliman
  alternative: lilim ng kamatayan
  rationale: Mas malamang na tumutukoy ang Hebreo sa napakalalim na dilim, bagaman maaari itong magtaglay ng pahiwatig ng kamatayan. Pinananatili sa talababa ang mahalagang tradisyonal na pagbasa upang hindi mawala ang tunay na saklaw at tensiyong leksikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino; pinananatili ang patulang ritmo, ang tuwirang pakikipag-usap sa Diyos, at ang mariing panghalip sa hulí ng taludtod.
