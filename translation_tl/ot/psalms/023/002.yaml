  text: בִּ/נְא֣וֹת דֶּ֭שֶׁא יַרְבִּיצֵ֑/נִי עַל מֵ֖י מְנֻח֣וֹת יְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: tl
  text: Sa luntiang pastulan ay pinahihiga niya ako; sa tabi ng tubig ng kapahingahan[a] ay inaakay niya ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tahimik na tubig” o “payapang tubig.” Ang pananalitang Hebreo ay tumutukoy sa tubig na kaugnay ng pahinga o kapanatagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: sa luntiang pastulan
  rationale: Ang נְאוֹת ay tumutukoy sa mga lugar na pastulan o pahingahan ng kawan, at ang דֶּשֶׁא ay sariwa o luntiang damo. Pinagsama ang mga ito sa likas at malinaw na pariralang Filipino na nagpapanatili sa larawang pastoral.
- source_word: יַרְבִּיצֵנִי
  choice: pinahihiga niya ako
  rationale: 'Ang anyong Hiphil ng רבץ ay may diwang sanhi: pinahihiga o pinapahimlay. Pinananatili ng salin ang kongkretong kilos sa halip na gawing abstraktong ‘binibigyan niya ako ng pahinga.’'
- source_word: עַל מֵי מְנֻחוֹת
  choice: sa tabi ng tubig ng kapahingahan
  rationale: Sa kontekstong ito, ang עַל ay nagsasaad ng pagiging malapit sa tubig, kaya ‘sa tabi’ ang likas na salin. Ang מְנֻחוֹת ay kaugnay ng pahinga o kapanatagan; pinananatili ng ‘tubig ng kapahingahan’ ang ugnayang iyon nang hindi nililimitahan ang kahulugan sa tubig na walang galaw.
- source_word: יְנַהֲלֵנִי
  choice: inaakay niya ako
  rationale: Ang Piel ng נהל ay pag-akay o paggabay, madalas na may maingat na pangangalaga. Ang ‘inaakay’ ay natural sa Filipino at angkop sa larawan ng isang pastol.
theological_decisions:
- issue: Tradisyonal na ‘tahimik/payapang tubig’ laban sa saling nakatuon sa diwa ng pahinga
  choice: tubig ng kapahingahan
  alternative: tahimik na tubig; payapang tubig
  rationale: Higit na tuwirang ipinahihiwatig ng pangngalang Hebreo ang pahinga o kapanatagan kaysa ang kawalan ng paggalaw ng tubig. Pinananatili sa talababa ang mga plausible at pamilyar na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang karaniwang ‘pastulan’ at ‘inaakay,’ habang pinanatili ang bahagyang makatang ‘tubig ng kapahingahan’ upang maipahayag ang tunay na lawak ng Hebreo.
