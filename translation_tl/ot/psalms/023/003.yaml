source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: tl
  text: Pinapanumbalik niya ang aking buhay[a]; inaakay niya ako sa mga landas ng katuwiran[b] alang-alang sa kanyang pangalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “binibigyan niya ako ng bagong sigla,” “pinapanariwa niya ang buo kong pagkatao,” o “ibinabalik niya ako.” Ang salitang Hebreo na isinaling “buhay” ay maaari ring tumukoy sa buong sarili o pagkatao, hindi lamang sa di-materyal na bahagi ng tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa mga tamang landas” o “sa mga landas ng katarungan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “alang-alang sa kanyang pangalan” ay nangangahulugang kumikilos siya para sa karangalan ng kanyang pagkatao at reputasyon.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: ang aking buhay
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa buhay o sa buong pagkatao, hindi lamang sa di-materyal na bahagi ng tao. Ang “aking buhay” ay likas sa modernong Filipino at nagpapanatili sa malawak na diwa ng Hebreo.
- source_word: יְשׁוֹבֵב
  choice: pinapanumbalik niya
  rationale: Ang anyo mula sa שׁוב ay maaaring mangahulugang ibalik, panumbalikin, o pasiglahing muli. Ipinahihiwatig ng “pinapanumbalik” kapwa ang pagpapanariwa at ang pagbabalik, kaya hindi nito isinasara ang tunay na ambiguwidad.
- source_word: יַנְחֵנִי
  choice: inaakay niya ako
  rationale: Ang Hiphil ng נחה ay nangangahulugang umakay o pumatnubay. Ang “inaakay” ay kongkreto at angkop sa larawang pastol sa salmo.
- source_word: בְמַעְגְּלֵי
  choice: sa mga landas ng
  rationale: Ang מַעְגָּל ay landas, bakas, o dinaraanan. Ang “mga landas” ay natural na patula at malinaw sa Filipino.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Saklaw ng צֶדֶק ang katuwiran, katarungan, at pagiging tama. Pinananatili ng “katuwiran” ang moral na bigat ng salita, habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: לְמַעַן
  choice: alang-alang sa
  rationale: Nagsasaad ang לְמַעַן ng layunin o dahilan. Likas at marangal sa Filipino ang “alang-alang sa” para sa ganitong gamit.
- source_word: שְׁמוֹ
  choice: kanyang pangalan
  rationale: Literal na “pangalan” ang שֵׁם ngunit maaari ring tumukoy sa reputasyon, karangalan, at ipinakikilalang pagkatao. Dapat panatilihin ang “pangalan” dahil mahalaga ang teolohikal na alingawngaw nito sa Kasulatan.
theological_decisions:
- issue: Kahulugan ng pagpapanumbalik sa נַפְשִׁי
  choice: Kabuuang pagpapanumbalik o muling pagpapasigla sa buhay at pagkatao ng mang-aawit sa pangangalaga ng pastol.
  alternative: “Binibigyan niya ako ng bagong sigla” o “ibinabalik niya ako.”
  rationale: Mas malawak ang נֶפֶשׁ kaysa sa makitid na konsepto ng isang di-materyal na kaluluwa. Iniiwasan ng “aking buhay” ang di-sadyang dualistikong pagbasa, at pinananatili ng talababa ang posibilidad ng pagpapanariwa o pagbabalik.
- issue: Diwa ng “mga landas ng katuwiran”
  choice: Mga daang kaayon ng katuwiran—mga matuwid na paraan ng pamumuhay sa ilalim ng paggabay ng Diyos.
  alternative: “Mga tamang landas” o “mga landas ng katarungan.”
  rationale: Maaaring ilarawan ng parirala ang mga landas na matuwid, tama, o makatarungan. Pinananatili ng “katuwiran” ang moral na dimensiyon nang hindi itinatanggi ang praktikal na diwa ng wastong paggabay.
- issue: “Alang-alang sa kanyang pangalan”
  choice: Kumikilos siya para sa karangalan ng kanyang sariling pangalan, na kumakatawan sa kanyang pagkatao at reputasyon.
  alternative: “Dahil sa kanyang reputasyon” o “upang parangalan ang kanyang pangalan.”
  rationale: Pinananatili ng salin ang mismong talinghaga ng Hebreo sa halip na palitan ito ng isang paliwanag lamang; nililinaw ng talababa ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na may marangal at patulang himig. Ginamit ang “inaakay” upang mapanatili ang kongkretong larawan ng pastol, at “katuwiran” upang dalhin ang moral at teolohikal na bigat ng Hebreo nang hindi nag-aangkat ng natatanging doktrinang denominasyonal.
