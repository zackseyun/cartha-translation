  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: tl
  text: 'Awit ni David[a].


    Si Yahweh[b] ang aking pastol;

    hindi ako magkukulang ng anuman.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “akda ni David,” “para kay David,” o “tungkol kay David.” Ang Hebreong לְדָוִד ay maaaring magpahiwatig ng pagkatha, pag-aalay, pagmamay-ari, o kaugnayan.
    reason: alternative_reading
  - marker: b
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; karaniwan itong isinasalin na “ang PANGINOON.”'
    reason: lexical_alternative
  - marker: c
    text: O, “Hindi ako mangangailangan.” Ipinahihiwatig ng pariralang Hebreo na hindi magkukulang ang nagsasalita ng anumang kailangan niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang katawagan sa Filipino para sa uring pampanitikan ng superskripsiyon; natural at malinaw sa konteksto ng Mga Awit.
- source_word: לְדָוִד
  choice: ni David
  rationale: Natural na salin sa Filipino na nagpapanatili ng kaugnayan kay David nang hindi tahasang nililimitahan sa pagkatha; ipinaliliwanag sa talababa ang lawak ng gamit ng Hebreong לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal na YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: רֹעִי
  choice: aking pastol
  rationale: Pinananatili ang tuwirang metapora ng isang tagapag-alaga ng kawan at ang personal na hulaping “aking.”
- source_word: לֹא אֶחְסָר
  choice: hindi ako magkukulang
  rationale: Malinaw na ipinahahayag ang kawalan ng kakulangan o pangangailangan, habang pinananatili ang unang panauhan at ang di-ganap na anyo ng pandiwa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Di-tiyak na ugnayan ng superskripsiyong לְדָוִד kay David
  choice: ni David, na may talababa
  alternative: akda ni David; para kay David; tungkol kay David
  rationale: Ang “ni David” ang pinakanatural na maikling superskripsiyon sa Filipino, ngunit maaaring magpahiwatig ang Hebreong parirala ng pagkatha, pag-aalay, pagmamay-ari, o kaugnayan; kaya hindi ito tahasang nilutas sa pangunahing teksto at nilinaw sa talababa.
- issue: Saklaw ng לֹא אֶחְסָר
  choice: hindi ako magkukulang
  alternative: wala akong kakailanganin; wala akong kulang
  rationale: Hindi dinaragdagan ng teksto ang layon ng pandiwa. Pinananatili ng salin ang pangkalahatang pahayag nang hindi tinutukoy kung anong bagay ang hindi kukulangin.
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “Awit ni David” bilang likas na superskripsiyon, at pinanatili ang maikli at matatag na parallel na pahayag ng Hebreo. Ang “hindi ako magkukulang” ay mas natural kaysa “hindi ako kukulangin” at hindi nagdaragdag ng tahasang layon.
