  to: Tunay na hahabulin ako ng kabutihan at tapat na pag-ibig[a] sa lahat ng araw ng buhay ko, at mananahan ako[b] sa bahay ni Yahweh sa mahabang panahon.[c]
  rationale: Pinalitan ang di-likas na literal na pariralang “sa haba ng mga araw” ng natural na “sa mahabang panahon.” Hindi nito isinasara ang saklaw ng Hebreong idyoma bilang walang hanggan; ang literal na anyo at ang alternatibong “magpakailanman” ay malinaw na napanatili sa talababa. Pinatumpak din ang paglalarawan sa Masoretikong pointing.
