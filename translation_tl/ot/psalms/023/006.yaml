base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: tl
  text: Tunay na hahabulin ako ng kabutihan at tapat na pag-ibig[a] sa lahat ng araw ng buhay ko, at mananahan ako[b] sa bahay ni Yahweh sa mahabang panahon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “susunod sa akin.” Mas matingkad ang pandiwang Hebreo: inilalarawan nito ang kabutihan at tapat na pag-ibig ng Diyos na aktibong humahabol sa mang-aawit.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “babalik ako sa bahay ni Yahweh.” Sinusuportahan ng Masoretikong paglalapat ng patinig ang “mananahan ako,” ngunit matagal nang kinikilalang alternatibo ang “babalik ako.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “magpakailanman.” Literal na “sa haba ng mga araw” ang Hebreo, isang idyomang nagpapahayag ng namamalaging tagal.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Tunay na
  rationale: Ipinahahayag ng kataga rito ang matibay na katiyakan, hindi ang pagtatakda ng kahulugang “lamang.”
- source_word: טוֹב
  choice: kabutihan
  rationale: Ginagamit itong parang pangngalang abstrakto at katambal ng חֶסֶד; tumutukoy ito sa mabuting pagkalinga ng Diyos.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Sinasaklaw nito ang matatag, mapagmahal, at tapat na pagkalinga nang hindi nililimitahan ang salita sa awa lamang.
- source_word: יִרְדְּפוּנִי
  choice: hahabulin ako
  rationale: Pinananatili nito ang masiglang larawan ng aktibong paghabol, sa halip na pahinain iyon bilang simpleng pagsunod.
- source_word: כָּל יְמֵי חַיָּי
  choice: sa lahat ng araw ng buhay ko
  rationale: Likas ngunit malapit na salin ito ng idyomang Hebreo, na nagpapahayag ng kabuuan ng buhay ng nagsasalita.
- source_word: וְשַׁבְתִּי
  choice: mananahan ako
  rationale: Ang Masoretikong pagbigkas at konteksto ay likas na sumusuporta sa diwang paninirahan; ang “babalik ako” ay itinatala bilang alternatibo.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili nito ang konkretong larawan ng tahanan o santuwaryo at natural ang kayarian sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְאֹרֶךְ יָמִים
  choice: sa haba ng mga araw
  rationale: Pinananatili ng matalinghagang pananalita ang literal at bukas na diwa ng mahabang tagal nang hindi agad pinipiling nangangahulugan itong walang hanggan.
theological_decisions:
- issue: Tagal na ipinahihiwatig ng לְאֹרֶךְ יָמִים
  choice: sa haba ng mga araw
  alternative: magpakailanman; sa mahabang panahon
  rationale: Maaaring magpahiwatig ang parirala ng panghabambuhay o namamalaging pakikisama kay Yahweh. Pinananatili sa pangunahing teksto ang bukas na matalinghagang diwa, at inilalagay sa talababa ang mas tiyak na interpretasyon.
- issue: Kahulugan ng וְשַׁבְתִּי
  choice: mananahan ako
  alternative: babalik ako
  rationale: Pinakamalinaw na sinusuportahan ng Masoretikong anyo mula sa ישׁב ang “mananahan ako,” ngunit mahalagang panatilihin sa talababa ang matagal nang alternatibong pagbasa na “babalik ako.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang masiglang larawan ng paghabol, ang personal na pangalang Yahweh, at ang bahagyang bukas na kahulugan ng pangwakas na idyoma.
