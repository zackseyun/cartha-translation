  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: tl
  text: Naghahanda ka ng hapag sa harap ko, sa harap ng aking mga kaaway; pinapahiran mo ng langis ang aking ulo[a]; ang aking kopa ay umaapaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ginagawa mong sagana o marangya ang aking ulo sa pamamagitan ng langis.” Ang pandiwa ay may diwa ng marangyang pagpapasagana o pagpaparangal; ang “pinapahiran mo ng langis” ay naghahayag ng konkretong larawan ng mabuting pagtanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: Naghahanda ka
  rationale: Ang ערך ay nangangahulugang ayusin o ihanda. Sa pariralang may hapag, likas sa Filipino ang “naghahanda ka ng hapag” at pinananatili nito ang larawan ng isang handaan.
- source_word: לְפָנַי שֻׁלְחָן
  choice: ng hapag sa harap ko
  rationale: Tuwirang pinananatili ang hapag at ang lokasyong “sa harap ko,” sa natural na ayos ng pangungusap sa Filipino.
- source_word: נֶגֶד צֹרְרָי
  choice: habang nakatingin ang aking mga kaaway
  rationale: Ang נֶגֶד ay nagpapahiwatig na kaharap o naroroon ang mga kaaway. Nililinaw ng “habang nakatingin” ang larawang nasasaksihan nila ang handaan nang hindi ipinahihiwatig na kasalo sila.
- source_word: דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: pinasasagana mo ng langis ang aking ulo
  rationale: Ang דשׁן ay literal na may diwa ng pagpapataba, pagpapayaman, o pagpapasagana. Pinananatili ng “pinasasagana” ang diwa ng marangyang paglingap at karangalan, sa halip na tahimik na gawing karaniwang pandiwa para sa ritwal na pagpapahid.
- source_word: כּוֹסִי רְוָיָה
  choice: umaapaw ang aking kopa
  rationale: Ang רְוָיָה ay nagsasaad ng lubos na kapuspusan o kasaganaan. Ang pandiwang “umaapaw” ay natural at malinaw na naghahatid ng larawang punô nang higit sa sapat.
theological_decisions:
- issue: Larawan ng langis sa דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: “pinasasagana mo ng langis ang aking ulo”
  alternative: “pinapahiran mo ng langis ang aking ulo”
  rationale: Hindi karaniwang pandiwa para sa ritwal na pagpapahid ang דִּשַּׁנְתָּ; may diwa ito ng pagpapasagana o marangyang pagtrato. Pinananatili ng salin ang larawan ng mabuting pagtanggap at saganang paglingap, nang hindi nagdaragdag ng tiyak na sakramental o maharlikang pakahulugan.
- issue: Panahunan at aspekto ng mga pandiwa
  choice: 'Kasalukuyang/patuloy na paglalarawan: “Naghahanda… pinasasagana… umaapaw”'
  alternative: 'Ganap o nakaraang paglalarawan: “Naghanda… pinasagana…”'
  rationale: Sa tulang Hebreo, ang mga anyo ay maaaring maglarawan nang matingkad sa pagkilos ng PANGINOON. Ang kasalukuyang anyo ay natural sa Filipino at hindi labis na nagtatakda ng aspekto.
- issue: Pagharap ng mga kaaway
  choice: “habang nakatingin ang aking mga kaaway”
  alternative: “sa harap ng aking mga kaaway”
  rationale: Ipinahahayag nito ang נֶגֶד bilang presensya at pagsaksi ng mga kaaway, hindi bilang pakikibahagi nila sa handaan. Hindi nito nilulutas kung ang larawan ay proteksiyon, pagpaparangal, o pagtatagumpay; nananatili ang ποιetikong tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hapag” at “kopa” upang mapanatili ang anyong patula at larawan ng magiliw na pagtanggap, habang nananatiling madaling maunawaan. Iniwasan ang salitang “pinahiran” sa pangunahing teksto upang hindi matakpan ang natatanging diwa ng pandiwang Hebreo; inilagay ang pamilyar na alternatibo sa talababa.
