  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: tl
  text: 'Awit ni David.[a]


    Si Yahweh[b] ang aking pastol; hindi ako magkukulang.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay David,” “tungkol kay David,” o “kaugnay ni David.” Ang Hebreong לְדָוִד ay maaaring tumukoy sa pag-akda, pag-aalay, o pagkakaugnay.
    reason: alternative_reading
  - marker: b
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; ayon sa tradisyon, madalas itong isinasaling “ANG PANGINOON.”'
    reason: lexical_alternative
  - marker: c
    text: O “Hindi ako kakapusin.” Hindi tinutukoy sa Hebreo ang isang partikular na bagay na hindi kukulangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Natural at karaniwang salin ng salmong inaawit o tulang panrelihiyon.
- source_word: לְדָוִד
  choice: ni David
  rationale: Pinakanatural na anyo sa Tagalog para sa tradisyonal na pagkaunawa, habang inilalahad sa talababa ang tunay na lawak ng gamit ng le sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalang YHWH sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: רֹעִי
  choice: ang aking pastol
  rationale: Pinananatili ang payak at mahalagang metapora ng Hebreo.
- source_word: לֹא אֶחְסָר
  choice: hindi ako magkukulang
  rationale: Natural na Filipino na pinananatili ang di-tiyak na saklaw ng bagay na hindi kukulangin; hindi nagdaragdag ng 'anuman' na wala namang tahasang katumbas.
theological_decisions:
- issue: Kaugnayan ni David sa awit sa pariralang לְדָוִד
  choice: ni David
  alternative: para kay David / tungkol kay David / kaugnay ni David
  rationale: Maaaring magpahiwatig ang pang-ukol na Hebreo ng pag-akda, pag-aalay, o pagkakaugnay. Ginamit sa teksto ang natural at tradisyonal na anyo ngunit hindi isinara ang ibang posibilidad.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Ang transliterasyon ay nagpapakitang personal na pangalan ang nasa pinagmulang teksto; binabanggit sa talababa ang tradisyonal na pamalit na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang matalinghagang “pastol,” ang personal na pangalang Yahweh, at ang maikli at matatag na himig ng Hebreo. Ang pamagat ay ibinukod sa pangunahing pahayag gaya ng tungkulin nito bilang superskripsiyon.
