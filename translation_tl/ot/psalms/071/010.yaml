  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: tl
  text: Sapagkat nagsasalita laban sa akin ang mga kaaway ko, at ang mga nag-aabang sa buhay ko[a] ay sama-samang nagsasanggunian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga nagbabantay sa buhay ko,” “ang mga nag-aabang upang kunin ang buhay ko,” o “ang mga naghahangad na kitlin ang buhay ko.”
    reason: lexical_alternative
  - marker: b
    text: O “ay sama-samang nagpapayo” o “ay sama-samang nagpaplano”; sa kontekstong ito, maaari ring unawain na “ay nagsasabwatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pakiusap at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: אָמְרוּ
  choice: nagsasalita
  rationale: Bagaman ganap na anyo ang pandiwang Hebreo, maaaring tumukoy ito sa kasalukuyan o nagpapatuloy na pananalitang mapanlaban sa tulang konteksto.
- source_word: אוֹיְבַי לִי
  choice: ang mga kaaway ko ... laban sa akin
  rationale: Likas sa Filipino ang 'laban sa akin' para sa לִי sa mapanlabang konteksto, sa halip na literal ngunit di-likas na 'sa akin.'
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: ang mga nag-aabang upang kitlin ang buhay ko
  rationale: Sa mapanganib na konteksto, ang שׁמר ay hindi mapag-ingat na pagbabantay kundi matiyagang pag-aabang na may masamang layon; ang נֶפֶשׁ ay tumutukoy sa buhay ng tao rito.
- source_word: נוֹעֲצוּ
  choice: nagsasanggunian
  rationale: Pinananatili nito ang pangunahing diwa ng sama-samang pagpapayo o pagbabalak nang hindi awtomatikong pinatitindi sa tahasang 'nakikipagsabwatan.'
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Tuwirang ipinapahayag ang pinag-isa o magkatuwang na pagkilos.
