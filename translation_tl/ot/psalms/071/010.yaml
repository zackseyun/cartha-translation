translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'kitlin ang buhay' upang maging malinaw ang mapanirang layon ng pag-aabang, habang inilagay sa talababa ang mas malapit at mas malabong mga alternatibo. Pinanatili ng 'nagsasanggunian' ang leksikal na lawak ng pandiwa; ang mas tahasang 'nagsasabwatan' ay nasa talababa.
