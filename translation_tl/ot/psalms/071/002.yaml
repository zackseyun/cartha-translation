  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: tl
  text: 'Sa iyong katuwiran[a], sagipin mo ako at hanguin mo ako;

    ikiling mo sa akin ang iyong tainga at iligtas mo ako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa pamamagitan ng iyong katuwiran”; ang “katuwiran” ay maaari ring unawain bilang “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: Sa iyong katuwiran
  rationale: Pinananatili ng “sa” ang pagiging maikli ng Hebreo at ang posibleng diwa ng batayan o saklaw ng pagkilos ng Diyos. Ang “katuwiran” ay tumutukoy sa matuwid at tapat na katangian ng Diyos nang hindi ito nililimitahan sa isang pasyang panghukuman.
- source_word: תַּצִּילֵנִי
  choice: sagipin mo ako
  rationale: Ang Hiphil ng נצל ay karaniwang nangangahulugang sagipin o iligtas mula sa panganib. Ang “sagipin” ay natural sa Filipino at naihihiwalay ang pandiwang ito sa kasunod at panghuling mga pandiwa.
- source_word: וּתְפַלְּטֵנִי
  choice: at palayain
  rationale: Ang Piel ng פלט ay may diwang papanatilihing makatakas o ilalabas mula sa panganib. Ipinahahayag ng “palayain” ang paglaya mula sa pagkakasakop o panganib at pinananatili ang pagkakaiba nito sa “sagipin” at “iligtas.”
- source_word: הַטֵּה
  choice: ikiling
  rationale: Ang pautos na anyo ng נטה kasama ng “tainga” ay isang matalinghagang pakiusap na makinig nang mabuti. Pinananatili ng “ikiling” ang kongkretong larawan ng Hebreo.
- source_word: אָזְנְךָ
  choice: ang iyong tainga
  rationale: Kongkretong “tainga” ang ginamit sa Hebreo bilang larawan ng matamang pakikinig; malinaw at angkop ito sa wikang patula.
- source_word: וְהוֹשִׁיעֵנִי
  choice: at iligtas mo ako
  rationale: Ang Hiphil ng ישׁע ay ang karaniwang pandiwa para sa pagliligtas. Pinananatili ng “iligtas” ang malawak na diwa nito, kabilang ang pagliligtas mula sa panganib.
theological_decisions:
- issue: Pagpapakahulugan sa צְדָקָה sa pakiusap sa Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ay mas malawak na tumutukoy sa pagiging matuwid at tapat ng Diyos, samantalang ang “katarungan” ay maaari ring maging kahulugan ngunit maaaring magpahiwatig ng mas makitid na kontekstong panghukuman. Inilalagay sa talababa ang alternatibo upang mapanatili ang tunay na saklaw ng salita.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Pinanatili ang larawan ng pagkiling ng tainga at pinag-iba ang tatlong magkakalapit na pandiwa sa pamamagitan ng “sagipin,” “palayain,” at “iligtas.”
