  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: tl
  text: Diyos, tinuruan mo ako mula pa noong kabataan ko, at hanggang ngayon ay ipinahahayag ko ang iyong mga kamangha-manghang gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kababalaghan mo” o “iyong mga kahanga-hangang gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ginamit bilang tuwirang pagtawag sa Diyos. Hindi kailangan ang pantawag na “O” sa natural na modernong Tagalog.
- source_word: לִמַּדְתַּנִי
  choice: tinuruan mo ako
  rationale: Tuwirang ipinapahayag ng Piel na pandiwa at hulaping unang panauhan ang pagtuturo ng Diyos sa nagsasalita; likas at malinaw ito sa Tagalog.
- source_word: מִנְּעוּרָי
  choice: mula pa noong kabataan ko
  rationale: Ipinahahayag ang panahong nagsimula sa kabataan at nagpapatuloy hanggang sa kasalukuyan; ang “mula pa noong” ay natural na katumbas sa Tagalog.
- source_word: וְעַד הֵנָּה
  choice: at hanggang ngayon
  rationale: Ang parirala ay tumutukoy sa pagpapatuloy hanggang sa kasalukuyang sandali.
- source_word: אַגִּיד
  choice: ipinahahayag ko
  rationale: Ang Hiphil ng נגד ay maaaring mangahulugang magsabi, magpahayag, o magpakilala. Pinananatili ng “ipinahahayag” ang hayag at patotoong diwa nang hindi pinalalakas nang labis.
- source_word: נִפְלְאוֹתֶיךָ
  choice: iyong mga kamangha-manghang gawa
  rationale: Karaniwang tumutukoy ang pangngalan sa pambihira at kahanga-hangang mga gawa ng Diyos. Nililinaw ng “mga gawa” ang konkretong diwa habang inilalagay sa talababa ang mas literal na “mga kababalaghan.”
theological_decisions:
- issue: Kung tuwirang pagtawag sa Diyos o pahayag tungkol sa Diyos
  choice: 'Tuwirang pagtawag: “Diyos, tinuruan mo ako...”'
  alternative: Pahayag tungkol sa Diyos
  rationale: Likas na tuwirang panalangin ang Hebreo dahil sumusunod ang pandiwa at panghalip na nasa ikalawang panauhang panlalaki. Pinananatili nito ang anyong debosyonal nang walang idinadagdag na doktrina.
- issue: Kung ang אַגִּיד ay kasalukuyan o hinaharap
  choice: 'Kasalukuyang nagpapatuloy: “ipinahahayag ko”'
  alternative: 'Hinaharap o kusang-loob: “ipahahayag ko”'
  rationale: Maaaring tumukoy ang anyong di-ganap sa nagpapatuloy o hinaharap na kilos. Sa ugnayan nito sa “hanggang ngayon,” mas natural ang nagpapatuloy na pagpapahayag, ngunit hindi nito itinatanggi ang pagpapatuloy sa hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalangin at awit. Ginamit ang “mula pa noong kabataan ko” at “hanggang ngayon” para sa likas na daloy, habang pinanatili ang tuwirang pagtawag at ang pampublikong diwa ng pagpapahayag.
