  text: תֶּ֤רֶב גְּֽדֻלָּתִ֗/י וְ/תִסֹּ֥ב תְּֽנַחֲמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/021.yaml
  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: tl
  text: Dagdagan mo nawa ang aking kadakilaan[a][b], at bumaling ka upang aliwin ako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Daragdagan mo ang aking kadakilaan at babaling ka upang aliwin ako.” Ang mga pandiwang Hebreo ay maaaring unawain bilang panalangin o bilang pahayag tungkol sa hinaharap.'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “aking kadakilaan”; maaari rin itong tumukoy sa aking karangalan o dignidad, hindi lamang sa laki o lawak.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “at bumaling.” Malamang na tumutukoy ito sa pagbaling o muling pagharap sa salmista upang aliwin siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Dagdagan mo nawa
  rationale: Ang Hifil ng רבה ay nangangahulugang “palakihin” o “dagdagan.” Ipinahihiwatig ng “nawa” ang panalangin o kahilingan, habang kinikilala sa talababa ang maaari ring pagbasa rito bilang pahayag tungkol sa hinaharap.
- source_word: גְּדֻלָּתִי
  choice: ang aking kadakilaan
  rationale: Tuwirang sinasalamin ng “kadakilaan” ang גְּדוּלָּה at pinananatili ang lawak ng kahulugang maaaring tumukoy sa kalagayan, karangalan, o dignidad.
- source_word: וְתִסֹּב
  choice: at bumaling ka
  rationale: Ang Qal ng סבב ay “bumaling” o “umikot.” Sa konteksto, ang larawan ay ang pagbaling ng Diyos sa salmista upang aliwin siya; pinananatili ng salin ang larawang ito sa halip na tahasang gawing “muli.”
- source_word: תְּנַחֲמֵנִי
  choice: upang aliwin ako
  rationale: Ang Piel ng נחם dito ay “aliwin” o “paginhawahin.” Natural at marangal sa makabagong Tagalog ang “aliwin ako,” at malinaw itong kaugnay ng naunang pagbaling.
theological_decisions:
- issue: Panagano ng dalawang pandiwang imperfect
  choice: 'Isinalin bilang panalangin o kahilingan: “Dagdagan mo nawa … at bumaling ka.”'
  alternative: 'Maaaring basahin bilang katiyakan tungkol sa hinaharap: “Daragdagan mo … at babaling ka upang aliwin ako.”'
  rationale: Sa panulaan ng Hebreo, ang mga imperfect na ito ay maaaring magpahayag ng kahilingan o ng kilos sa hinaharap. Mas naaayon sa mapanalanging konteksto ang napiling salin, ngunit hindi inaalis ang alternatibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang “kadakilaan” dahil ito ang pinakamalapit sa Hebreo, at ginamit ang “bumaling” upang mapanatili ang konkretong larawan ng orihinal. Ang “nawa” ay nagpapalinaw sa tono ng panalangin nang hindi ginagawang magaspang ang utos.
