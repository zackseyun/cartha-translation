  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: tl
  text: Mapahiya at maubos[b] ang mga kumakalaban sa akin[a]; mabalot ng paghamak at kahihiyan ang mga naghahangad ng kapahamakan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking buhay” o, mas literal, “aking kaluluwa”; ang salitang Hebreo rito ay madalas tumukoy sa buhay o sa buong sarili ng isang tao, hindi lamang sa di-materyal na kaluluwa.
    reason: lexical_alternative
  - marker: b
    text: O “malipol” o “magwakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Mapahiya
  rationale: Ipinahahayag ng anyong pandiwa ang hiling o panalangin ng salmista. Likas sa modernong Tagalog ang “mapahiya” at napananatili nito ang diwang danasin nila ang kahihiyan.
- source_word: יִכְלוּ
  choice: maubos
  rationale: 'Malawak ang saklaw ng כלה: maubos, magwakas, o malipol. Ang “maubos” ay maikli at likas, at hindi nito tahasang nililimitahan ang kahulugan sa pisikal na kamatayan.'
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: mga kumakalaban sa aking buhay
  rationale: Ang שטן ay tumutukoy sa mga kumikilos bilang kalaban, samantalang ang נֶפֶשׁ dito ay maaaring tumukoy sa buhay o mismong sarili ng salmista, hindi lamang sa di-materyal na kaluluwa.
- source_word: יַעֲטוּ
  choice: mabalot ng
  rationale: Napananatili ng “mabalot” ang metapora ng pagbabalot o pagdadamit nang hindi nagiging pilit sa Tagalog kapag abstraktong mga pangngalan ang kasunod.
- source_word: חֶרְפָּה
  choice: paghamak
  rationale: Ipinahahayag nito ang hayag na pagdusta o kasiraang dinaranas mula sa iba at malinaw itong mauunawaan ng karaniwang mambabasa.
- source_word: וּכְלִמָּה
  choice: at kahihiyan
  rationale: Ang “kahihiyan” ay natural na katumbas ng כְּלִמָּה at pinananatili ang pagpapaigting sa pamamagitan ng magkalapit ngunit magkaibang salita.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: mga naghahangad ng kapahamakan ko
  rationale: Ipinakikita ng parirala ang aktibong hangaring saktan o ipahamak ang salmista; likas at malinaw sa Tagalog ang napiling pananalita.
theological_decisions:
- issue: Puwersang panalangin o sumpang-hiling ng mga pandiwa
  choice: 'Isinalin ang mga pandiwa bilang hiling: “Mapahiya,” “maubos,” at “mabalot.”'
  alternative: 'Isalin bilang payak na prediksiyon: “Mapapahiya ... at mauubos.”'
  rationale: Sa konteksto ng patulang panalangin, ang mga imperfect ay may jussive o imprecatory na puwersa. Pinananatili ng pautos-hiling na anyo sa Tagalog ang tuwirang pagsusumamo sa Diyos at hindi ito ginagawang hiwalay na prediksiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang paralelismo at metapora ng tekstong Hebreo, gayundin ang tunay na lawak ng kahulugan ng נֶפֶשׁ at כלה.
