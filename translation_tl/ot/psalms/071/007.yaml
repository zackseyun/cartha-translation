  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: tl
  text: Ako'y naging tila isang pambihirang tanda sa marami[a], ngunit ikaw ang aking matibay na kanlungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang kababalaghan,” “isang palatandaan,” o “isang bagay na ikinamangha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: tila isang pambihirang tanda
  rationale: Ang מוֹפֵת ay maaaring tumukoy sa isang tanda, kababalaghan, o bagay na pumupukaw ng pagkamangha. Pinananatili ng “pambihirang tanda” ang pagiging kapansin-pansin nito nang hindi tiyak na positibo o negatibo ang dating; isinasalin ng “tila” ang prefiks na כְּ־.
- source_word: הָיִיתִי
  choice: Ako'y naging
  rationale: Ang qatal na unang panauhang isahan ng היה ay maaaring simpleng nakaraan, ngunit ang “naging” ay likas sa Filipino at nagpapahiwatig ng kalagayang bunga ng mga naranasan ng salmista.
- source_word: לְרַבִּים
  choice: sa marami
  rationale: Ang לְ dito ay nagpapakilala sa maraming taong tumitingin sa salmista bilang isang pambihirang tanda; ang “sa marami” ay maikli at tuwirang katumbas.
- source_word: מַחֲסִי
  choice: aking kanlungan
  rationale: Ang מַחֲסֶה ay lugar ng proteksiyon o kaligtasan. Ang “kanlungan” ay natural, marangal, at malinaw na salitang Filipino para sa metaporang ito.
- source_word: עֹז
  choice: matibay
  rationale: Ang עֹז ay nangangahulugang lakas o katatagan. Sa pariralang מַחֲסִי עֹז, likas na ipinapahayag sa Filipino ang diwang “kanlungang may lakas” bilang “matibay na kanlungan.”
theological_decisions:
- issue: Saklaw ng kahulugan ng מוֹפֵת kaugnay ng kalagayan ng salmista sa harap ng madla
  choice: Inilalarawan ang salmista bilang isang pambihira at kapansin-pansing tanda sa marami, nang hindi tinutukoy kung siya ay positibong kababalaghan, masamang babala, o bagay lamang na ikinamangha.
  alternative: Maaaring unawain siya bilang isang kababalaghan, isang tanda o palatandaan, o isang bagay na ikinamangha ng marami.
  rationale: Malawak ang saklaw ng salitang Hebreo. Pinananatili ng pangunahing salin at talababa ang tunay na kalabuan at hindi nilulutas ang reaksiyon ng mga tao bilang tiyak na positibo o negatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pinaikling “Ako'y” para sa maayos na daloy, at ang “kanlungan” bilang pamilyar na salitang biblikal na nananatiling malinaw sa karaniwang mambabasa.
