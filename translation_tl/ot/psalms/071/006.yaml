  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: tl
  text: 'Sa iyo ako sumandig mula pa sa sinapupunan;


    mula sa loob ng katawan ng aking ina,


    ikaw ang naglabas sa akin.[a]


    Ikaw ang lagi kong pinupuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas madulas: “mula sa sinapupunan ng aking ina, ikaw ang naglabas sa akin.” Ibang salitang Hebreo ang ginamit dito kaysa sa “sinapupunan” sa naunang linya; literal itong tumutukoy sa mga panloob na bahagi ng katawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: Sa iyo
  rationale: Ipinahahayag ng עַל na may hulaping tumutukoy sa Diyos ang pagsandig o pag-asa sa kaniya; pinananatili ng “Sa iyo” ang ugnayan nito sa pandiwang “sumandig.”
- source_word: נִסְמַכְתִּי
  choice: ako sumandig
  rationale: Ang Niphal ng סמך ay maaaring mangahulugang sumandig, umasa, o masuportahan. Pinananatili ng “sumandig” ang kongkretong larawan at likas itong pakinggan sa Filipino.
- source_word: מִבֶּטֶן
  choice: mula pa sa sinapupunan
  rationale: Ang בטן ay tumutukoy sa tiyan o sinapupunan. Ang “mula pa sa sinapupunan” ay malinaw na naghahayag ng pag-asa sa Diyos mula sa pinakamaagang yugto ng buhay.
- source_word: מִמְּעֵי אִמִּי
  choice: mula sa kaloob-looban ng aking ina
  rationale: Ang מֵעֶה ay literal na mga panloob na bahagi ng katawan. Pinananatili ng “kaloob-looban” ang pagkakaiba nito sa naunang בטן, bagaman ayon sa konteksto ay ang sinapupunan ng ina ang tinutukoy.
- source_word: אַתָּה
  choice: ikaw ang
  rationale: May diin ang hiwalay na panghalip na אַתָּה. Likas na naipakikita sa Filipino ang diing ito sa hulma na “ikaw ang.”
- source_word: גוֹזִי
  choice: naglabas sa akin
  rationale: Sa konteksto ng pagsilang, inilalarawan ng anyong ito ang Diyos bilang siyang naglabas sa makata mula sa katawan ng kanyang ina. Iniiwasan nito ang labis na literal na ideya ng paghiwa at hindi rin ito pinalalawak tungo sa pangkalahatang “tagapagligtas.”
- source_word: בְּךָ תְהִלָּתִי
  choice: Ikaw ang ... kong pinupuri
  rationale: Isinasalin nang likas sa Filipino ang maikling Hebreong pahayag tungkol sa papuring nakatuon sa Diyos, bagaman binabago mula pangngalan tungo sa pandiwa ang “papuri.”
- source_word: תָמִיד
  choice: lagi
  rationale: Ang תָמִיד ay nagsasaad ng patuloy o palagiang pagkilos. Ang “lagi” ay simple, natural, at tapat sa duratibong diwa.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa larawan ng pagsilang
  choice: Inilalarawan ang Diyos bilang siyang naglabas sa makata mula sa katawan ng kanyang ina.
  alternative: Unawain lamang ang Diyos bilang tagapag-alaga o tagasustento mula nang isilang ang makata.
  rationale: Pinakamadaling ipinahihiwatig ng Hebreong larawan ang pagkilos ng Diyos sa paglabas ng makata sa kanyang ina. Pinananatili ito nang hindi nagdaragdag ng doktrinang lampas sa sinasabi ng talata.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Ginamit ang “kaloob-looban” upang mapanatili ang pagkakaiba ng dalawang salitang Hebreo para sa sinapupunan at mga panloob na bahagi, habang inilagay sa talababa ang mas madulas na pagpapahayag. Ginawang pandiwa ang huling sugnay—“Ikaw ang lagi kong pinupuri”—upang maging natural sa karaniwang mambabasa.
