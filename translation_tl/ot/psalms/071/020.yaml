id: PSA.71.20
reference: Psalms 71:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: tl
  text: Ikaw na nagpadanas sa amin[a] ng maraming paghihirap at mga kasawian[b], muli mo kaming bubuhayin[c]; at mula sa kailaliman ng lupa[d], muli mo akong iaahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “nagpakita sa amin.” Causative ang pandiwang Hebreo: literal na “nagpangyaring makita namin.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at maraming kapahamakan” o, mas literal, “at masasamang bagay.” Dito, ang tinutukoy ay mga kasawian o kapighatian, hindi moral na kasamaan.
    reason: lexical_alternative
  - marker: c
    text: 'Nagbabago ang Hebreo mula sa maramihan tungo sa isahan: “bubuhayin kami … iaahon ako.”'
    reason: textual_feature
  - marker: d
    text: Ang “kailaliman ng lupa” ay maaaring matalinghagang tumukoy sa sukdulang pagkakababa o pagkalapit sa kamatayan, at maaari ring umalingawngaw sa pagbaba sa libingan.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na pang-ugnay sa Filipino para sa sugnay na naglalarawan sa Diyos na tuwirang kinakausap bilang “Ikaw.”
- source_word: הראיתנו
  choice: nagpadanas sa amin
  rationale: Ang Hiphil ng ראה ay causative, literal na “nagpangyaring makita namin.” Sa konteksto, malinaw at natural na ipinahahayag ng “nagpadanas sa amin” na ang mga paghihirap ay ipinakitang maranasan, nang hindi ginagawang tuwirang pahayag tungkol sa moral na kasamaan.
- source_word: צָרוֹת
  choice: mga paghihirap
  rationale: Karaniwang salitang Filipino na tumutukoy sa matitinding suliranin o pagdurusa nang hindi nililimitahan ang uri ng kapighatian.
- source_word: רַבּוֹת
  choice: maraming
  rationale: Pinakamalamang na binibilang nito ang mga paghihirap bilang marami, sa halip na ilarawan lamang ang tindi ng mga iyon.
- source_word: וְרָעוֹת
  choice: at kasawian
  rationale: Sa konteksto, tumutukoy ito sa mapaminsalang mga karanasan, hindi sa moral na kasamaan. Pinananatili ng “kasawian” ang bigat ng salita nang hindi nagpapahiwatig na gumagawa ang Diyos ng moral na masama.
- source_word: תָּשׁוּב
  choice: muli mo
  rationale: Ang שוב ay dalawang ulit ginamit. Ang pag-uulit ng “muli mo” sa dalawang sugnay ay natural sa Filipino at pinananatili ang pag-uulit at balangkas ng tulang Hebreo.
- source_word: תְּחַיֵּנוּ
  choice: kaming bubuhayin
  rationale: Ipinahahayag ng Piel ng חיה ang pagpapanumbalik ng buhay o sigla matapos ang matinding paghihirap. Ang “bubuhayin” ay tuwiran at hindi nangangailangang tukuyin kung literal o matalinghaga ang pagbabalik-buhay.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: at mula sa kailaliman ng lupa
  rationale: Pinananatili ang matingkad na larawan ng mga kalaliman o bangin ng lupa nang hindi ito tahasang ginagawang “libingan” o muling pagkabuhay.
- source_word: תַּעֲלֵנִי
  choice: iaahon mo ako
  rationale: Ang Hiphil ng עלה ay nangangahulugang pagpapaaakyat. Ang “iaahon” ay likas na Filipino at nababagay sa larawang pag-akyat mula sa kailaliman.
- source_word: נו ... ני
  choice: amin/kami ... ako
  rationale: Pinananatili ang pagbabago ng Masoretic Text mula sa unang panauhang maramihan tungo sa unang panauhang isahan, sa halip na pakinisin ito.
theological_decisions:
- issue: Kung ang רָעוֹת ay moral na “mga kasamaan” o mga kasawiang dinanas
  choice: mga kasawiang dinanas
  alternative: mga kasamaan; mga kapahamakan
  rationale: Ang konteksto ay tungkol sa pagdurusa at kapighatiang naranasan ng salmista, hindi sa moral na kasamaan. Iniiwasan ng “kasawian” ang di-kailangang pahiwatig na gumagawa ang Diyos ng moral na masama.
- issue: Kung tahasang tumutukoy sa muling pagkabuhay ang “mula sa kailaliman ng lupa”
  choice: panatilihin ang larawan nang hindi ito nililinaw bilang teknikal na muling pagkabuhay
  alternative: mula sa libingan ay bubuhayin mo ako; muli mo akong bubuhayin mula sa kamatayan
  rationale: Maaaring ilarawan ng Hebreo ang sukdulang pagkakababa, pagkalapit sa kamatayan, o pag-ahon mula sa kalagayang kahawig ng Sheol. Pinananatili ng salin ang saklaw at teolohikal na tensiyong iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagpadanas” upang natural na maipahayag ang causative na Hebreo, habang inilagay sa talababa ang mas literal na anyo. Pinanatili ang pag-uulit ng שוב sa “muli mo,” gayundin ang kapansin-pansing paglipat mula “kami” tungo sa “ako.”
