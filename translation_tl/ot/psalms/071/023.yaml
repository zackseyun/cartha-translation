  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: tl
  text: Aawit sa galak[a] ang aking mga labi kapag umaawit ako ng papuri sa iyo, at aawit din sa galak ang aking kaluluwa[b], na iyong tinubos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisigaw sa galak”; ang pandiwang Hebreo ay maaaring tumukoy sa masiglang pag-awit o sa masayang pagsigaw.
    reason: lexical_alternative
  - marker: b
    text: O “aking buhay” o “aking buong sarili”; malawak ang saklaw ng Hebreong nefesh at maaari itong tumukoy sa buhay, sarili, o panloob na pagkatao.
    reason: lexical_alternative
  - marker: c
    text: O “pinalaya” o “iniligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: Aawit sa galak
  rationale: Ang Piel ng רנן ay maaaring tumukoy sa masiglang pag-awit o masayang pagsigaw. Ang “aawit sa galak” ay likas sa Filipino at angkop sa mga labi bilang simuno, habang pinananatili ang masiglang tinig ng taludtod.
- source_word: שְׂפָתַי
  choice: ang aking mga labi
  rationale: 'Pinananatili nito ang tuwirang makatang larawan ng Hebreo: ang mga labi ang nagpapahayag ng papuri.'
- source_word: כִּי
  choice: habang
  rationale: Sa kontekstong ito, ipinakikilala ng כִּי ang pagkakataon o kasabay na kilos ng masayang pag-awit. Ang “habang” ay natural sa Filipino at hindi ipinipilit ang sanhi na “sapagkat.”
- source_word: אֲזַמְּרָה
  choice: umaawit ako ng papuri
  rationale: Ang Piel ng זמר ay karaniwang tumutukoy sa musikal na pagpupuri. Malinaw at natural itong ipinahahayag ng “umaawit ako ng papuri.”
- source_word: לָךְ
  choice: sa iyo
  rationale: Tinutukoy ng pang-ukol ang pinatutungkulan ng papuri.
- source_word: וְנַפְשִׁי
  choice: pati ang aking kaluluwa
  rationale: Ang “pati” ay nagpapakita na kasabay ng mga labi ang buong panloob na sarili sa pagpupuri. Pinananatili ng “kaluluwa” ang tradisyonal at makatang diwa ng נֶפֶשׁ, habang itinatala sa talababa ang lawak ng kahulugan nito.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Filipino para sa sugnay na naglalarawan sa kaluluwa.
- source_word: פָּדִיתָ
  choice: iyong tinubos
  rationale: Ang פדה ay nangangahulugang palayain sa pamamagitan ng pagtubos o pagsagip. Pinananatili ng “tinubos” ang bigat ng pagliligtas nang hindi nililimitahan sa isang mas makitid na doktrinal na paliwanag.
theological_decisions:
- issue: Pagpapakahulugan sa פדה sa konteksto ng pagsamba
  choice: tinubos
  alternative: iniligtas o pinalaya
  rationale: Ibinabatay ng taludtod ang papuri sa nagliligtas na ginawa ng Diyos. Ang “tinubos” ay nagpapanatili sa larawan ng pag-aalis mula sa panganib o pagkaalipin, ngunit ang mga alternatibo ay inilalahad upang hindi gawing mas makitid ang saklaw ng Hebreo.
- issue: Saklaw ng נֶפֶשׁ
  choice: kaluluwa
  alternative: buhay o buong sarili
  rationale: Sa paralelismo sa “mga labi,” ang salita ay maaaring tumukoy sa panloob o buong pagkatao, hindi lamang sa isang hiwalay na di-materyal na bahagi. Pinananatili sa talababa ang tunay na lawak ng termino.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang “mga labi” at “kaluluwa,” ngunit ipinaliwanag sa mga talababa ang mga posibleng kahulugan. Ang ayos ng pangungusap ay dinisenyo upang maging natural bigkasin sa pagsamba nang hindi binubura ang paralelismo ng Hebreo.
