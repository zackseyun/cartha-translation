  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: tl
  text: Mapupuno ang bibig ko ng papuri sa iyo[a] at ng iyong karilagan buong araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Puno ang bibig ko ng papuri sa iyo,” o “Mapuno nawa ang bibig ko ng papuri sa iyo.” Sa tulang Hebreo, ang anyo ng pandiwa ay maaaring magpahiwatig ng hinaharap, kasalukuyan, o isang pakiusap/pagnanais.'
    reason: alternative_reading
  - marker: b
    text: 'Ang “karilagan” ay maaari ring isaling “kaluwalhatian,” “kagandahan,” o “kadakilaan.” Mas literal ang ayos ng ikalawang bahagi: “ng iyong karilagan buong araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: Mapupuno
  rationale: Pinananatili ang Nifal imperfect ng מלא bilang pasibong pahayag na may hinaharap na diwa, habang kinikilala sa talababa na maaari rin itong unawain bilang pangkasalukuyan o pakiusap sa kontekstong patula.
- source_word: פִי
  choice: ang bibig ko
  rationale: Tuwirang pinananatili ang Hebreong larawan ng bibig bilang kasangkapan ng pagpupuri, sa halip na gawing simpleng 'ako' o 'pananalita ko.'
- source_word: תְּהִלָּתֶךָ
  choice: papuri sa iyo
  rationale: Likas sa modernong Tagalog at malinaw na ang papuri ay nauukol o iniuukol sa Diyos; iniiwasan nito ang posibleng di-likas na dating ng 'iyong papuri.'
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Natural at kasalukuyang Tagalog na nagpapanatili sa tuloy-tuloy na temporal na diwa ng parirala.
- source_word: תִּפְאַרְתֶּךָ
  choice: iyong karilagan
  rationale: Ang 'karilagan' ay angkop na patulang katumbas ng תפארת at naipahihiwatig ang ningning, kagandahan, at kadakilaan nang hindi ito basta pinapantay sa mas malawak na 'kaluwalhatian.'
- source_word: תִּפְאַרְתֶּךָ
  choice: ipahahayag ko ang iyong karilagan
  rationale: Idinagdag ang pandiwang 'ipahahayag ko' upang maging natural at malinaw sa Tagalog ang eliptikong ikalawang parirala, na sa Hebreo ay nakaugnay sa ideya ng bibig na puspos ng papuri at karilagan ng Diyos.
theological_decisions:
- issue: Diwa ng Hebreong imperfect sa יִמָּלֵא
  choice: 'Hinaharap na pahayag: ''Mapupuno'''
  alternative: 'Pangkasalukuyan: ''Puno''; o pakiusap/pagnanais: ''Mapuno nawa'''
  rationale: Sa konteksto, natural ang resultative o hinaharap na pagbasa, ngunit hindi tiyak na iyon lamang ang puwedeng diwa ng imperfect sa tulang Hebreo; kaya pinananatili sa talababa ang tunay na gramatikal na kalabuan.
- issue: Ugnayan ng תִּפְאַרְתֶּךָ sa unang sugnay
  choice: 'Ginawang tahasang kilos ng bibig: ''ipahahayag ko ang iyong karilagan'''
  alternative: 'Mas pormal na elipsis: ''ng iyong karilagan buong araw'''
  rationale: Ang Hebreo ay walang ikalawang tahasang pandiwa. Ang pagsasalin ay nagpapalinaw sa likas na ipinahihiwatig na pagpupuri/paghahayag nang hindi nagdaragdag ng naiibang teolohikong ideya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang larawan ng bibig na napupuno ng papuri. Ginamit ang 'karilagan' bilang dignified at tumpak na katumbas ng תפארת, at nilinaw ang elipsis sa ikalawang linya para sa likas na daloy sa Tagalog.
