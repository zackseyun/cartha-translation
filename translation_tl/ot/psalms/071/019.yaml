id: PSA.71.19
reference: Psalms 71:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: tl
  text: At ang iyong katuwiran[a], O Diyos, ay umaabot sa kaitaasan[b]—ikaw na gumawa ng mga dakilang bagay. O Diyos, sino ang katulad mo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring tumukoy ang salitang Hebreo sa katuwiran o katarungan ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa langit.” Literal na “hanggang sa kataasan” ang pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: At ang iyong katuwiran
  rationale: Ang צְדָקָה ay tumutukoy rito sa matuwid na katangian ng Diyos, bagaman maaari rin itong mangahulugang “katarungan.” Pinananatili ng “katuwiran” ang malawak na moral na diwa ng salita.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Dalawang ulit itong ginagamit bilang tuwirang pagtawag sa Diyos. Ang “O Diyos” ay malinaw, marangal, at angkop sa panulaan.
- source_word: עַד מָרוֹם
  choice: ay umaabot sa kaitaasan
  rationale: Pinananatili nito ang literal na larawang pangkalawakan ng pariralang “hanggang sa kataasan” nang hindi tiyak na ipinapakahulugan ang מָרוֹם bilang langit.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: ikaw na gumawa ng mga dakilang bagay
  rationale: Isinasalin ang אֲשֶׁר bilang sugnay na naglalarawan at pinananatili ang malawak na saklaw ng substantibong גְדֹלוֹת.
- source_word: מִי כָמוֹךָ
  choice: sino ang katulad mo?
  rationale: Natural na modernong Tagalog ito para sa Hebreong retorikal na tanong na nagpapahayag na walang maihahambing sa Diyos.
theological_decisions:
- issue: Kahulugan ng צְדָקָה bilang katangian ng Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Masaklaw rito ang papuri sa matuwid na katangian at mga gawa ng Diyos, hindi lamang ang kaniyang paghatol. Gayunman, tunay na posibilidad sa Hebreo ang “katarungan,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na pinananatili ang panulaang larawang “umaabot sa kaitaasan” at ang retorikal na diin ng huling tanong. Ang gitling-pahaba ay naghihiwalay sa sugnay na naglalarawan nang hindi ito ginagawang tahasang sanhi.
