  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: tl
  text: Sapagkat ikaw ang aking pag-asa, Panginoong Yahweh[a], ang aking tiwala mula pa sa aking kabataan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Adonai Yahweh,” na pinagsasama ang titulong “Panginoon” at ang banal na pangalang “Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: O “simula pa noong aking kabataan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng pakiusap sa konteksto; pinananatili ng “Sapagkat” ang malinaw na puwersang sanhi o paliwanag.
- source_word: אַתָּה
  choice: ikaw
  rationale: Tahasang panghalip na tumutukoy sa Diyos at nagbibigay-diin sa kaniya bilang bukal ng pag-asa.
- source_word: תִקְוָתִי
  choice: aking pag-asa
  rationale: Tuwirang ipinahahayag ang pag-asa o inaasahan ng nagsasalita at natural sa isang panalangin.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili ang titulong אֲדֹנָי at ang personal na pangalang יהוה nang magkasama, gaya ng nasa Hebreo.
- source_word: מִבְטַחִי
  choice: aking tiwala
  rationale: Saklaw ng pangngalan ang tiwala, kapanatagan, o siyang pinagtitiwalaan; maikli at natural ang “aking tiwala” at katapat ng “aking pag-asa.”
- source_word: מִנְּעוּרָי
  choice: mula pa sa aking kabataan
  rationale: Ipinahihiwatig ng מִן ang panimulang yugto ng matagal nang pagtitiwala; malinaw itong naipapahayag ng “mula pa sa.”
theological_decisions:
- issue: Paglalarawan sa pinagsamang אֲדֹנָי at יהוה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Ang teksto ay may parehong titulo at banal na pangalan. Ang “Panginoong Yahweh” ang higit na tuwirang nagpapakita sa dalawang magkaibang elementong ito nang hindi pinapalitan ang pangalan ng isang pangkalahatang titulo.
- issue: Kung ang מִבְטַחִי ay tumutukoy sa damdamin ng pagtitiwala o sa Diyos na pinagtitiwalaan
  choice: aking tiwala
  alternative: aking pinagtitiwalaan
  rationale: Pinananatili ng maikling parirala ang saklaw ng Hebreo at ang pagtutulad nito sa “aking pag-asa,” nang hindi labis na nililinaw ang likas na bahagyang pagkalabo ng pangngalan.
translation_notes:
  register: Makabago ngunit marangal na Filipino para sa panalangin. Ginamit ang “mula pa sa aking kabataan” upang maging natural at maipakita ang patuloy na pagtitiwala mula sa kabataan hanggang sa kasalukuyan.
