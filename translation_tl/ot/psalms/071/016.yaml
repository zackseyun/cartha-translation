    text: 'Maaari ring isalin: “sa makapangyarihang mga gawa ng Panginoong Yahweh” o “taglay ang makapangyarihang mga gawa ng Panginoong Yahweh.” Maaaring unawain ang pang-ukol sa Hebreo bilang tumutukoy sa kinaroroonan o sa paraang ginamit.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “babanggitin ko” o “isalaysay ko.” Saklaw ng pandiwang Hebreo ang pagbanggit, pagsasalaysay, at pagpapahayag.'
    reason: lexical_alternative
  - marker: c
    text: Ang “iyong katuwiran” ay maaari ding unawain bilang “iyong katarungan” o, ayon sa konteksto, “iyong mga matuwid na gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Darating ako
  rationale: Ang Qal imperfect na בוא ay maaaring mangahulugang “dumating,” “pumunta,” o “pumasok.” Pinananatili ng “darating ako” ang payak na diwa ng pandiwa nang hindi labis na nililinaw ang patutunguhan.
- source_word: בִּגְבֻרוֹת
  choice: taglay ang makapangyarihang mga gawa
  rationale: Ang pangmaramihang גְּבוּרוֹת ay maaaring tumukoy sa kapangyarihan o sa mga gawang nagpapakita ng kapangyarihan. Ang “makapangyarihang mga gawa” ay angkop sa konteksto ng mga gawa ng Diyos; ipinahihiwatig ng “taglay” ang posibleng instrumental na gamit ng pang-ukol בְּ.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Tuwirang kinakatawan nito ang tambalang titulong אֲדֹנָי at ang pangalang tipan na יְהוִה, habang nananatiling natural sa modernong Tagalog.
- source_word: אַזְכִּיר
  choice: ipahahayag ko
  rationale: Ang Hiphil ng זכר ay maaaring mangahulugang “banggitin,” “isalaysay,” o “ipahayag.” Sa kontekstong patula, malinaw na naihahatid ng “ipahahayag” ang hayagang pagsasabi tungkol sa katuwiran ng Diyos.
- source_word: צִדְקָתְךָ
  choice: ang iyong katuwiran
  rationale: Pinananatili ng “katuwiran” ang pangunahing saklaw ng צְדָקָה nang hindi ito nililimitahan sa “katarungan” o sa mga tiyak na matuwid na gawa.
- source_word: לְבַדֶּךָ
  choice: ang sa iyo lamang
  rationale: Inihahatid nito ang pagbibigay-diin ng לְבַדֶּךָ sa pagiging bukod-tangi ng Diyos kaugnay ng katuwirang ipinahahayag, habang pinananatili ang bahagyang siksik na anyong patula ng Hebreo.
theological_decisions:
- issue: Pag-render sa banal na pangalan sa אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Ginagamit ang “Yahweh” upang malinaw na kumatawan sa יְהוִה at hindi ito ipagkamali sa karaniwang titulong “Panginoon”; kinakatawan naman ng “Panginoon” ang אֲדֹנָי.
- issue: Saklaw ng צִדְקָה bilang katangian o mga gawa ng Diyos
  choice: katuwiran
  alternative: katarungan; mga matuwid na gawa
  rationale: Hindi ipinapasiya ng talata kung ang diin ay nasa katangian ng Diyos, sa makatarungan niyang pagkilos, o sa kongkretong mga gawang matuwid. Pinananatili ng “katuwiran” ang lawak na ito, at inilalahad sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Ang “taglay” at ang gitling bago ang huling parirala ay nagpapanatili sa siksik at mariing himig ng tulang Hebreo. Iniwasan ang mga katawagang nakatali sa isang denominasyon.
