  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: tl
  text: Buong araw ding magsasalita ang aking dila tungkol sa iyong katuwiran[a], sapagkat napahiya at nalugmok sa kahihiyan ang mga naghahangad ng kapahamakan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring saklawin ng salitang Hebreo ang katuwiran at katarungan, lalo na kapag tumutukoy sa mapagligtas na paghatol at pagkilos ng Diyos para sa kanyang lingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: din
  rationale: Ipinagpapatuloy nito ang papuri mula sa naunang talata at isinama ang dila sa pagpupuri.
- source_word: לְשׁוֹנִי
  choice: aking dila
  rationale: Pinananatili ang kongkretong makatang larawan sa Hebreo sa halip na gawing abstraktong 'pananalita.'
- source_word: כָּל הַיּוֹם
  choice: Buong araw
  rationale: Likas na makabagong Tagalog na nagpapanatili sa diin ng patuloy na pagpupuri.
- source_word: תֶּהְגֶּה
  choice: ipahahayag
  rationale: Maaaring tumukoy ang הגה sa pagbulong, pagbubulay, o pagbigkas. Dahil 'dila' ang simuno, ang naririnig na pagpapahayag ang pinakaangkop, habang hindi ito nililimitahan sa karaniwang pagsasalita lamang.
- source_word: צִדְקָתֶךָ
  choice: iyong katuwiran
  rationale: Pinananatili ang malawak na diwa ng צדקה—matuwid na pagkilos, katarungan, at mapagligtas na pagbibigay-katuwiran ng Diyos—nang hindi ito pinakikitid.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw at likas na ipinakikilala ang dahilan ng papuri.
- source_word: בֹשׁוּ
  choice: napahiya
  rationale: Ipinahahayag ang naganap na kalagayan ng kahihiyan na may bunga sa kasalukuyan.
- source_word: כִּי חָפְרוּ
  choice: at nalagay sa kahihiyan
  rationale: Ang ikalawang כִּי ay hindi inuulit nang mekanikal; ang pagkakaugnay ng dalawang magkalapit na pahayag ay natural na ipinapakita ng 'at.' Pinananatili rin ang magkapares ngunit bahagyang magkaibang larawan ng pagkapahiya at pagkadusta.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: ang mga naghahangad na mapahamak ako
  rationale: Ipinahahayag ang nagpapatuloy na masamang hangarin laban sa salmista sa natural na Tagalog.
theological_decisions:
- issue: Pagbibigay-kahulugan sa צִדְקָתֶךָ sa konteksto ng Awit
  choice: iyong katuwiran
  alternative: iyong katarungan
  rationale: Ang 'katuwiran' ang pangunahing salin upang mapanatili ang malawak na saklaw ng salita, kabilang ang matuwid, makatarungan, at mapagligtas na pagkilos ng Diyos. Inilalagay sa talababa ang 'katarungan' bilang tunay na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang makatang 'aking dila' at ang magkatugmang mga larawan ng kahihiyan, habang iniwasan ang sobrang literal ngunit di-likas na pag-uulit ng כִּי.
