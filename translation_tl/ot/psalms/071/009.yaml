  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: tl
  text: Huwag mo akong itakwil sa panahon ng katandaan[a]; kapag nauubos na ang lakas ko[b], huwag mo akong pabayaan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itapon” o “iwaksi.” Ang pandiwang Hebreo ay maaaring maglarawan ng pagtatapon o pagtanggi sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapag lubos nang naubos ang lakas ko.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “huwag mo akong iwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: itakwil
  rationale: Ang Hiphil ng שלך ay may larawan ng pagtatapon o pag-aalis. Ang “itakwil” ay likas at marangal sa makabagong Filipino at malinaw na naghahatid ng diwa ng pagtanggi, bagaman hindi nito lubos na inilalantad ang konkretong larawan ng pagtatapon; kaya binanggit iyon sa talababa.
- source_word: לְעֵת זִקְנָה
  choice: sa panahon ng katandaan
  rationale: Pinananatili nito kapwa ang temporal na diwa ng עֵת at ang tahasang pagtukoy ng זִקְנָה sa katandaan.
- source_word: כִּכְלוֹת
  choice: kapag nauubos na
  rationale: Ang infinitive construct ng כלה na may כִּ ay nagpapakilala ng kalagayang temporal habang ang isang bagay ay nauubos o sumasapit sa wakas. Ang “kapag nauubos na” ay natural at pinananatili ang progresibong paghina.
- source_word: כֹּחִי
  choice: ang lakas ko
  rationale: Sa konteksto ng pagtanda, ang “lakas” ang pinakanatural na katumbas ng כֹּחַ at hindi ito nagdaragdag ng ideyang wala sa teksto.
- source_word: תַּעַזְבֵנִי
  choice: pabayaan
  rationale: Ang עזב ay maaaring mangahulugang iwan, pabayaan, o abandunahin. Sa panalanging ito, ang “huwag mo akong pabayaan” ay natural, malinaw, at may angkop na marangal na himig.
- source_word: אַל
  choice: Huwag
  rationale: Ang אַל na may imperfect/jussive ay isang mariing negatibong pakiusap o pagbabawal; “Huwag” ang tuwiran at karaniwang katumbas nito sa Filipino.
theological_decisions:
- issue: Ang katangian ng pakiusap kaugnay ng pagtanda at presensiya ng Diyos
  choice: Isang tuwirang pakiusap na huwag itakwil o pabayaan ng Diyos ang mang-aawit habang nauubos ang kanyang lakas sa katandaan
  alternative: Isang pangkalahatang hinaing tungkol sa pagdurusa na walang natatanging diin sa pagtanda
  rationale: Tahasang inuugnay ng Hebreong teksto ang pakiusap sa panahon ng katandaan at sa pagkaubos ng lakas. Pinananatili ng salin ang kongkretong pagdepende sa Diyos nang walang idinaragdag na mas malawak na doktrinal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa panalangin sa Mga Awit. Ginamit ang karaniwang “mo/ako” na pagtukoy sa Diyos at nananalangin, nang walang artipisyal o labis na arkaikong pananalita. Ang ayos ng dalawang magkatugmang pakiusap ay pinanatili.
