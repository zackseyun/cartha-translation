translation:
  language: tl
  text: Sinasabi nila, “Pinabayaan[a] na siya ng Diyos. Tugisin ninyo siya at hulihin ninyo siya, sapagkat walang magliligtas sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Tinalikuran na siya ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: Sinasabi nila
  rationale: Ang infinitive construct ng אמר ay nagpapakilala sa tuwirang sinabi. Idinagdag ang “nila” bilang likas na pahiwatig ng paksa mula sa konteksto—ang mga kaaway ng mang-aawit—nang hindi binabago ang tungkulin nito sa diskurso.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, ang kasamang pandiwang pang-isahan ay malinaw na tumutukoy sa Diyos.
- source_word: עֲזָבוֹ
  choice: Pinabayaan na siya
  rationale: Ang Qal perfect na may hulaping tumutukoy sa lalaki ay nagsasaad ng pagkilos na itinuturing na naganap at may bunga sa kasalukuyan. Likas sa modernong Tagalog ang “pinabayaan na siya” at angkop sa matinding pananalita ng panaghoy.
- source_word: רִדְפוּ
  choice: Tugisin ninyo siya
  rationale: Pautos na maramihan ang anyo. Ipinahahayag ng “tugisin” ang aktibong paghabol sa isang taong mahina o tumatakas nang hindi nagdaragdag ng motibong wala sa teksto.
- source_word: וְתִפְשׂוּהוּ
  choice: at hulihin
  rationale: Pautos na maramihan mula sa pandiwang nangangahulugang sunggaban o dakpin. Ang “hulihin” ay tuwiran at likas sa Tagalog; nauunawaan mula sa naunang “siya” ang layon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos. Ang “sapagkat” ay malinaw, marangal, at angkop sa salin ng Awit.
- source_word: אֵין מַצִּיל
  choice: walang magliligtas sa kanya
  rationale: Ipinahahayag ng אֵין ang kawalan, at ang Hiphil participle na מַצִּיל ay tumutukoy sa sinumang magliligtas o sasagip. Likas sa Tagalog ang napiling parirala at pinananatili ang personal na diwa ng isang tagapagligtas na wala raw.
theological_decisions:
- issue: Ang pahayag ng mga kaaway tungkol sa pagpapabaya ng Diyos
  choice: Pinabayaan na siya ng Diyos
  alternative: Tinalikuran na siya ng Diyos
  rationale: Iniulat ng talata ang panunuya o palagay ng mga kaaway, hindi isang pagpapatibay ng tagapagsalaysay na tunay ngang pinabayaan ng Diyos ang mang-aawit. Pinananatili ng salin ang bigat at tensiyong teolohikal ng kanilang sinabi nang hindi ito nilulutas.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit marangal at angkop sa panulaan ng Mga Awit. Ginamit ang “tugisin” at “sapagkat” upang mapanatili ang tindi at pormalidad nang hindi nagiging lipas ang wika.
