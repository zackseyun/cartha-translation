  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: tl
  text: Diyos ko, iligtas mo ako sa kamay ng masama, sa hawak[a] ng taong di-makatarungan at marahas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa palad”; ang ibig sabihin ay mula sa hawak o kontrol.
    reason: lexical_alternative
  - marker: b
    text: Ang “marahas” ay maaari ring isaling “malupit” o “mapang-api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Likas at tuwirang panawag sa modernong Tagalog para sa pangngalang may hulaping unang panauhang isahan.
- source_word: פַּלְּטֵנִי
  choice: iligtas mo ako
  rationale: Ipinahahayag ng pandiwa ang paghango o pagliligtas mula sa panganib; malinaw at karaniwan ang pariralang ito sa Tagalog.
- source_word: מִיַּד רָשָׁע
  choice: sa kamay ng masama
  rationale: Pinananatili ang larawang Hebreo ng ‘kamay’ bilang kapangyarihan o kontrol, na nauunawaan din sa Tagalog.
- source_word: מִכַּף
  choice: sa mahigpit na hawak
  rationale: Bagaman literal na ‘mula sa palad,’ tumutukoy ang idyoma sa pagkakahawak o pagkontrol; ipinahihiwatig ng ‘mahigpit na hawak’ ang banta nang natural sa Tagalog.
- source_word: מְעַוֵּל
  choice: di-makatarungan
  rationale: Inilalarawan nito ang isang taong kumikilos nang mali o labag sa katarungan, kaya pinananatili ang moral at legal na diwa.
- source_word: וְחוֹמֵץ
  choice: at marahas
  rationale: Ang salita ay maaaring tumukoy sa marahas, malupit, o mapang-aping tao; ang ‘marahas’ ay malapit sa pangunahing diwa at malinaw sa modernong Tagalog.
