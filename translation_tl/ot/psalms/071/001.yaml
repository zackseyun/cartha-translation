  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: tl
  text: Sa iyo ako ay nagkanlong, Yahweh; huwag nawa akong mapahiya kailanman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/ךָ
  choice: Sa iyo
  rationale: Ipinahahayag ng ב na may hulaping ikalawang panauhan ang Diyos bilang pinanganganlungan. Likas sa Tagalog ang “Sa iyo” at hindi ito nagdaragdag ng diin na wala sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Personal na pangalan ng Diyos ang Tetragrammaton; pinanatili itong transliterasyon sa halip na palitan ng isang titulo.
- source_word: חָסִיתִי
  choice: ako nanganganlong
  rationale: Ang חסה ay nangangahulugang humanap o magkaroon ng kanlungan. Sa kontekstong ito, likas na naipahahayag ng kasalukuyang anyong Tagalog ang tiyak at nagpapatuloy na pagtitiwala, habang pinananatili ang larawan ng kanlungan.
- source_word: אַל אֵבוֹשָׁה
  choice: huwag mo akong hayaang mapahiya
  rationale: Ang אַל kasama ng unang-panauhang anyo ay isang negatibong pakiusap. Ipinahahayag ng “mapahiya” ang kahihiyan o pagkabigo sa harap ng iba, hindi lamang ang pansariling damdaming nahihiya.
- source_word: לְ/עוֹלָם
  choice: kailanman
  rationale: Kasama ng negatibong pakiusap, ang לְעוֹלָם ay likas na nangangahulugang “hindi kailanman”; pinananatili ng hulihang “kailanman” ang diin ng Hebreo.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang personal na pangalang יְהוָה. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanganganlong” upang mapanatili ang kongkretong larawang proteksiyon ng חסה; ang ayos ng pangungusap ay likas sa panalangin at hindi labis na makaluma.
