  - severity: medium
    issue: Ang “huwag mo akong hayaang mapahiya” ay nagdaragdag ng tahasang causative na pagbalangkas.
    rationale: Ang Hebreo ay negatibong hiling na unang panauhan at hindi tahasang nagsasabing “huwag mo akong hayaang.” Ang “huwag nawa akong mapahiya” ay mas malapit at pinananatili ang ambigwidad.
