  source_fidelity: Ang “Sa iyo” at “Yahweh” ay tapat sa בְּךָ at יְהוָה. Gayunman, ang “ako nanganganlong” ay aspektuwal na kasalukuyan, samantalang ang Hebreong חָסִיתִי ay perpekto at mas maayos na nasasalin dito bilang “ako ay nagkanlong.” Ang “huwag mo akong hayaang mapahiya” ay nagpapasok ng tahasang sanhi na “mo” at ng pandiwang “hayaang,” na wala sa Hebreo. Ang “huwag nawa akong mapahiya” ay mas malapit sa negatibong kahilingan ng אַל אֵבוֹשָׁה at pinananatili ang saklaw na hindi tiyak kung simpleng mapapahiya o mapapahiya ng iba.
  naturalness: Natural at marangal sa makabagong Filipino ang “Sa iyo ako ay nagkanlong, Yahweh; huwag nawa akong mapahiya kailanman.” Ang “nawa” ay angkop sa panalanging pakiusap at hindi labis na makaluma.
  terminology: Ang “Yahweh” ay wastong pagpapanatili ng Tetragrammaton ayon sa ibinigay na audit trail. Ang “nagkanlong” ay nagpapanatili ng imahen ng paghahanap ng kanlungan; ang “mapahiya” ay angkop para sa בושׁ sa kontekstong ito.
