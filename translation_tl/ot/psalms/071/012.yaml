  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: tl
  text: Diyos, huwag kang lumayo sa akin; Diyos ko, magmadali kang tulungan ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tahasang pagtawag sa Diyos ng Israel. Sa makabagong Tagalog, likas na ginagamit ang “Diyos” nang walang hiwalay na panandang pantawag.
- source_word: אַל תִּרְחַק
  choice: huwag kang lumayo
  rationale: Pinananatili nito ang pakiusap na negatibo at ang larawang pang-agwat o pang-ugnayan ng pandiwang רחק.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Sa pariralang Tagalog na “lumayo sa akin,” likas na ipinahahayag ng “sa akin” ang paghihiwalay mula sa nagsasalita.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tapat na ipinahahayag ang unang panauhang hulapi at ang personal na pagtawag sa Diyos.
- source_word: לְעֶזְרָתִי
  choice: tulungan ako
  rationale: Likas na katumbas sa Tagalog ng literal na “para/sa aking tulong” kapag kaugnay ng utos na magmadali.
- source_word: חִישָׁה
  choice: magmadali ka
  rationale: Tuwirang ipinapahayag ang pautos at agarang diwa nang hindi idinaragdag ang pandiwang “pumarito,” na hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Paulit-ulit na mga tawag sa Diyos sa isang agarang panalangin
  choice: Diyos ... Diyos ko
  alternative: O Diyos ... O Diyos ko
  rationale: Ang walang “O” ay marangal at mas natural sa kasalukuyang Tagalog, habang pinananatili ang tuwirang pagtawag at personal na pagdepende sa Diyos.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Pinanatili ang paralelismo at agarang tono ng panalangin, at iniwasang idagdag ang “pumarito” bago ang “magmadali.”
