translation:
  language: tl
  text: Ngunit ako, patuloy na aasa[a], at lalo pa akong magpupuri sa iyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patuloy na maghihintay nang may pag-asa.” Ang pandiwang Hebreo ay maaaring magpahiwatig kapwa ng pag-asa at ng sabik na paghihintay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magdaragdag ako sa lahat ng papuri sa iyo.” Inilalarawan ng idyomang Hebreo ang patuloy na pagdaragdag o pagpaparami ng pagpupuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ang pang-ugnay at tahasang panghalip ay nagpapakita ng paghahambing o pagsalungat at nagbibigay-diin sa nagsasalita.
- source_word: תָּמִיד
  choice: patuloy
  rationale: Ipinahahayag ng pang-abay ang walang tigil o nagpapatuloy na pagkilos; natural itong katambal ng “aasa” sa modernong Filipino.
- source_word: אֲיַחֵל
  choice: aasa
  rationale: Ang piel ng יחל ay tumutukoy sa pag-asa o paghihintay nang may pag-asam. Ang “aasa” ay tuwiran at likas, habang ang “patuloy” ang naghahayag ng nagpapatuloy na paninindigan.
- source_word: וְהוֹסַפְתִּי
  choice: at lalo pa akong magpupuri
  rationale: Ang יסף ay nangangahulugang magdagdag o magparami. Sa kontekstong ito, likas na ipinahahayag sa Filipino ang idyoma bilang pagdaragdag pa ng pagpupuri.
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: sa iyo
  rationale: Ang parirala ay literal na tumutukoy sa pagdaragdag sa lahat ng papuri sa Diyos. Isinama ang layon na “sa iyo” sa pandiwang “magpupuri,” habang ipinaliliwanag sa talababa ang mas literal at posibleng alternatibong diwa.
