  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: tl
  text: Maging batong kanlungan para sa akin[a], na lagi kong malalapitan; iniutos mong iligtas ako[b], sapagkat ikaw ang aking bato at aking kuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging bato, isang tahanan para sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “itinakda mong iligtas ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Maging ... para sa akin
  rationale: Pinananatili ang tuwirang pakiusap ng pautos na anyo at ang ugnayang ipinahahayag ng לִי, sa natural na pananalanging Tagalog.
- source_word: לְצוּר מָעוֹן
  choice: bato kang kanlungan
  rationale: Pinananatili ang talinghaga ng צוּר bilang bato, habang ipinahahayag ang proteksiyon sa מָעוֹן; ang mas literal na posibilidad na “batong tahanan” ay nasa talababa.
- source_word: לָבוֹא תָּמִיד
  choice: na lagi kong malalapitan
  rationale: Natural na Tagalog para sa isang ligtas na lugar na maaaring puntahan palagi; ang “malalapitan” ay angkop din sa personal na pananalangin sa Diyos.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: iniutos mong iligtas ako
  rationale: Direktang pinananatili ang kahulugan ng צוה na “mag-utos” at ang literal na infinitibong “iligtas ako,” nang hindi ginagawang abstraktong pangngalan ang pagliligtas.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang batayan ng pakiusap sa marangal ngunit kasalukuyang Tagalog.
- source_word: סַלְעִי
  choice: aking batong-tanggulan
  rationale: Inihihiwalay sa naunang צוּר at ipinakikita ang larawan ng isang mataas o matibay na mabatong tanggulan, nang hindi inuulit lamang ang “bato.”
- source_word: וּמְצוּדָתִי
  choice: at kuta
  rationale: Ang “kuta” ay maikli, malinaw, at likas na katumbas ng isang pinatibay na lugar ng proteksiyon.
theological_decisions:
- issue: Kung ang צִוִּיתָ לְהוֹשִׁיעֵנִי ay isasalin bilang utos o bilang pagtatalaga ng Diyos
  choice: iniutos mong iligtas ako
  alternative: itinakda mong iligtas ako
  rationale: Hayagang gumagamit ang Hebreo ng pandiwang “mag-utos.” Pinananatili ito upang huwag pahinain o paliitin ang larawan ng mabisang utos ng Diyos; ibinibigay sa talababa ang lehitimong kontekstuwal na alternatibong “itinakda.”
- issue: Kung ang מָעוֹן ay “kanlungan” o “tahanan”
  choice: kanlungan
  alternative: tahanan
  rationale: Sa konteksto ng bato at kuta, malinaw ang diin sa proteksiyon. Gayunman, tunay na leksikal na posibilidad ang “tahanan,” kaya pinananatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Maging” para sa lakas ng pakiusap, “malalapitan” para sa likas na pananalita, at magkaibang katawagan—“bato,” “batong-tanggulan,” at “kuta”—upang mapanatili ang magkakaugnay ngunit hindi lubusang magkaparehong larawang Hebreo.
