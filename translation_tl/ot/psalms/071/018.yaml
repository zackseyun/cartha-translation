  to: Kahit tumanda na ako at ubanin, O Diyos, huwag mo akong pabayaan hanggang maihayag ko sa susunod na salinlahi ang iyong bisig[b], at sa lahat ng darating pa ang iyong kapangyarihan.[c]
  rationale: Pinalitan ang di-gaanong natural na nominal na parirala ng isang malinaw na modernong idyoma para sa katandaan at pagkauban. Inayos din ang sintaks upang malinaw na ang “iyong bisig” ay ipinahahayag sa susunod na salinlahi at ang “iyong kapangyarihan” sa lahat ng darating pa. Inalis ang talababa a sapagkat ang binagong pangunahing teksto ay hindi nangangailangan ng alternatibong literal na anyo at hindi ito kailangan upang mapanatili ang kahulugan.
