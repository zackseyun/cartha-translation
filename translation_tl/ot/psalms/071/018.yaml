  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: tl
  text: Kahit tumanda na ako at ubanin, O Diyos, huwag mo akong pabayaan hanggang maihayag ko sa susunod na salinlahi ang iyong bisig[b], at sa lahat ng darating pa ang iyong kapangyarihan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “bisig” ay larawan ng aktibong lakas o kapangyarihan ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “sa lahat ng salinlahing darating.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Kahit
  rationale: Ipinahahayag ang mariing pagpapatuloy ng pakiusap at natural na iniuugnay sa pariralang tumutukoy sa katandaan.
- source_word: עַד זִקְנָה וְשֵׂיבָה
  choice: sa aking katandaan at pag-uban
  rationale: Pinananatili ang dalawang konkretong larawan ng Hebreo—katandaan at uban—sa natural na modernong Tagalog.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tahasang panawagan ito sa Diyos; ang “O Diyos” ay angkop sa marangal na wika ng panalangin.
- source_word: אַל תַּעַזְבֵנִי
  choice: huwag mo akong pabayaan
  rationale: Natural na katumbas ng pakiusap na huwag iwan o abandonahin ang nagsasalita.
- source_word: עַד אַגִּיד
  choice: hanggang maipahayag ko
  rationale: Ipinakikita ang layunin at tagal ng hinihiling na pag-alalay hanggang makapagpatotoo ang salmista.
- source_word: זְרוֹעֲךָ
  choice: ang iyong bisig
  rationale: Pinananatili ang Hebreong metapora ng bisig bilang larawan ng aktibong kapangyarihan ng Diyos.
- source_word: לְדוֹר
  choice: sa susunod na salinlahi
  rationale: Sa konteksto, tumutukoy sa salinlahing kasunod ng matandang salmista.
- source_word: לְכָל יָבוֹא
  choice: sa lahat ng darating
  rationale: Pinananatili ang kolektibo at malawak na saklaw ng parirala nang hindi nililimitahan sa iisang salinlahi.
- source_word: גְּבוּרָתֶךָ
  choice: ang iyong kapangyarihan
  rationale: Saklaw ng salita ang lakas o makapangyarihang gawa; ang “kapangyarihan” ay nagpapanatili ng bahagyang kalabuan sa pagitan ng katangian at pagkilos.
theological_decisions:
- issue: Kung pananatilihin ang metapora ng “bisig” o tuwirang ipaliliwanag bilang kapangyarihan ng Diyos
  choice: Pinanatili sa pangunahing teksto ang “iyong bisig.”
  alternative: “iyong lakas” o “iyong kapangyarihan”
  rationale: Mahalaga sa tula at teolohiya ng salmo ang larawang katawanin ng bisig ang mabisang pagkilos ng Diyos; nililinaw ito ng kasunod na “kapangyarihan.”
- issue: Saklaw ng לְדוֹר ... לְכָל יָבוֹא
  choice: Ibinukod ang “susunod na salinlahi” at pinalawak sa “lahat ng darating.”
  alternative: “sa lahat ng salinlahing darating”
  rationale: Pinananatili nito ang pag-usad mula sa isang kasunod na salinlahi tungo sa mas malawak na hinaharap, nang hindi pinag-iisa ang dalawang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at panalangin ang himig. Pinanatili ang Hebreong metapora at ang paglawak ng saklaw mula sa susunod na salinlahi tungo sa lahat ng darating.
