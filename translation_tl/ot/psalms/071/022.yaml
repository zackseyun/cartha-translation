  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: tl
  text: Pupurihin din kita sa saliw ng nebel[a] dahil sa iyong katapatan[b], Diyos ko; aawitan kita na may kinnor[a], Banal ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang nebel at kinnor ay dalawang magkaibang instrumentong de-kuwerdas noong sinaunang panahon, ngunit hindi tiyak ang eksaktong anyo at pagkakaiba ng mga ito. Madalas silang isalin bilang “alpa” at “lira.”
    reason: cultural_note
  - marker: b
    text: O “katotohanan.” Maaaring tumukoy ang salitang Hebreo kapuwa sa katotohanan at sa katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Pupurihin din kita
  rationale: Ang גַּם kasama ng malayang panghalip ay nagbibigay-diin at nagpapatuloy sa naunang diwa; likas sa modernong Tagalog ang “din” sa pandiwa.
- source_word: אוֹדְךָ
  choice: Pupurihin kita
  rationale: Sa kontekstong pagsamba at pagtugtog, ang Hiphil ng ידה ay angkop na isaling “pupurihin,” habang pinananatili ang tuwirang layon na “kita.”
- source_word: בִכְלִי נֶבֶל
  choice: sa saliw ng nebel
  rationale: Ang כְּלִי ay instrumentong tinutukoy bilang נֶבֶל. Pinanatili ang pangalang Hebreo dahil hindi tiyak ang eksaktong uri ng sinaunang instrumento; ipinapaliwanag ito sa talababa.
- source_word: אֲמִתֶּךָ
  choice: dahil sa iyong katapatan
  rationale: Maaaring mangahulugan ang אֱמֶת ng katotohanan, katapatan, o pagiging maaasahan. Dito, ang “katapatan” ay likas na paksa o dahilan ng pagpuri sa Diyos, ngunit pinananatili sa talababa ang tunay na alternatibong “katotohanan.”
- source_word: אֱלֹהָי
  choice: Diyos ko
  rationale: Tuwirang katumbas ng anyong paari at pinanatili bilang pantawag.
- source_word: אֲזַמְּרָה לְךָ
  choice: tutugtog ako para sa iyo
  rationale: Ang Piel ng זמר ay tumutukoy sa paggawa ng musika o pag-awit ng papuri. Dahil tahasang binanggit ang instrumento, malinaw at natural dito ang “tutugtog.”
- source_word: בְּכִנּוֹר
  choice: sa kinnor
  rationale: Pinanatili ang natatanging terminong Hebreo upang hindi ipagkamaling kapareho ng נֶבֶל at upang huwag magpanggap ng katiyakan tungkol sa eksaktong modernong instrumento.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Banal ng Israel
  rationale: Isang titulong pantawag sa Diyos. Ang payak na “Banal ng Israel” ay marangal at nauunawaan nang hindi nagdaragdag ng ekspresyong wala sa Hebreo.
theological_decisions:
- issue: Kahulugan ng אֱמֶת bilang katangian ng Diyos sa pagpuri
  choice: katapatan
  alternative: katotohanan
  rationale: Itinatampok ng “katapatan” ang pagiging maaasahan ng Diyos sa konteksto ng kaniyang pagliligtas, ngunit hindi ganap na nilulutas ang lawak ng salitang Hebreo; kaya isinama ang “katotohanan” bilang lehitimong alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa saliw” at “tutugtog” para sa natural na paralelismong musikal. Pinanatili ang nebel at kinnor bilang transliterasyon dahil hindi tiyak ang pagkakakilanlan ng mga instrumento; ipinaliwanag ang tradisyonal na mga katumbas sa talababa.
