  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: tl
  text: Ang bibig ko’y magsasalaysay ng iyong katuwiran[a] at ng iyong pagliligtas buong araw, sapagkat hindi ko alam ang bilang ng mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong katarungan” o “iyong matutuwid na gawa.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, napakarami ng matuwid at nagliligtas na mga gawa ng Diyos na hindi kayang bilangin ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Ang bibig ko
  rationale: Pinanatili ang literal na larawan ng “aking bibig” sapagkat itinatampok ng Hebreo ang bibig bilang kasangkapan ng pagpupuri, sa halip na pakinisin lamang bilang “ako.”
- source_word: יְסַפֵּר
  choice: magsasalaysay
  rationale: Ang piel ng ספר ay tumutukoy sa pagkukuwento o masusing paglalahad. Ang “magsasalaysay” ay likas at marangal sa Filipino at nagpapanatili ng ugnayan nito sa ideya ng pagbibilang sa hulihan ng talata.
- source_word: צִדְקָתֶךָ
  choice: iyong katuwiran
  rationale: Ang “katuwiran” ang tuwirang katumbas ng pangngalang Hebreo at pinananatili ang saklaw nito bilang katangian ng Diyos na nahahayag din sa kaniyang makatarungan at matuwid na pagkilos.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Natural na modernong Filipino para sa patuloy na pagsasalita o pagpupuri sa kabuuan ng araw.
- source_word: תְּשׁוּעָתֶךָ
  choice: iyong pagliligtas
  rationale: Ang “pagliligtas” ay malinaw na nagpapahayag ng gawa ng Diyos na nagliligtas, nang hindi nililimitahan ito sa isang partikular na uri ng pagkaligtas.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikita nito ang ugnayang sanhi: patuloy ang pagsasalaysay dahil hindi mabilang ang katuwiran at pagliligtas ng Diyos.'
- source_word: לֹא יָדַעְתִּי
  choice: hindi ko alam
  rationale: Bagaman perfect ang anyong Hebreo, ang diwa sa konteksto ay kasalukuyang kawalan ng kaalaman sa bilang; likas itong ipinahahayag sa Filipino bilang “hindi ko alam.”
- source_word: סְפֹרוֹת
  choice: ang bilang ng mga iyon
  rationale: Ang pangmaramihang anyo mula sa ugat ספר ay may diwang “mga bilang” o “pagbibilang.” Ipinahahayag ng salin na hindi matukoy ng salmista ang dami ng mga binanggit na pagpapahayag ng katuwiran at pagliligtas ng Diyos.
theological_decisions:
- issue: Kung ang צִדְקָתֶךָ ay isasalin bilang abstraktong katangian o bilang kongkretong mga gawa ng Diyos.
  choice: “iyong katuwiran” sa pangunahing teksto
  alternative: “iyong katarungan” o “iyong matutuwid na gawa”
  rationale: Ang Hebreo ay isang pang-isahang abstraktong pangngalan, kaya pinananatili ang “katuwiran.” Gayunman, sa Mga Awit maaari rin itong tumukoy sa makatarungan, tapat, at nagliligtas na pagkilos ng Diyos; hindi isinasara ng salin ang kongkretong pahiwatig na iyon.
- issue: Kung ang huling parirala ay nagsasaad lamang ng kawalan ng kaalaman o ng kawalan ng kakayahang bilangin.
  choice: “hindi ko alam ang bilang ng mga iyon”
  alternative: “hindi ko kayang bilangin ang mga iyon”
  rationale: Mas malapit ang pangunahing salin sa literal na “hindi ko alam ang mga bilang,” habang ipinahihiwatig ng konteksto na napakarami ng mga ito upang bilangin. Ipinaliliwanag ang pahiwatig na iyon sa talababa nang hindi ginagawang tahasan sa teksto ang maaaring manatiling idyomatiko sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal at bahagyang patula ang rehistro. Pinanatili ang “Ang bibig ko” bilang Hebreong larawan at ginamit ang “magsasalaysay” sa halip na mas kolokyal na “magkukuwento.” Ang elisyong “ko’y” ay karaniwan sa dignified na tekstong Filipino at nagbibigay ng maayos na daloy.
