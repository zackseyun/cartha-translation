  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: tl
  text: Pinaghahati-hatian nila ang aking mga kasuotan[a], at nagpapalabunutan sila para sa aking damit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang linyang ito ay iniuugnay sa mga salaysay ng mga Ebanghelyo tungkol sa pagpapako kay Jesus sa krus; tingnan ang Mateo 27:35; Marcos 15:24; Lucas 23:34; Juan 19:24.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: Pinaghahati-hatian nila
  rationale: Ang Piel imperfect ay naglalarawan ng masiglang eksena ng pamamahagi. Likas sa modernong Tagalog ang anyong ito para sa paghahati ng mga bagay sa loob ng isang pangkat.
- source_word: בְגָדַי
  choice: ang aking mga kasuotan
  rationale: Ang בגד ay tumutukoy sa mga damit o kasuotan. Pinananatili ng “mga kasuotan” ang marangal na himig ng salmo at naihihiwalay ito sa ikalawang katawagan sa kasunod na linya.
- source_word: לָהֶם
  choice: -hatian nila
  rationale: Bagaman literal na “para/sa kanila,” ipinahihiwatig nito rito ang pamamahagi nila ng mga kasuotan sa isa't isa; likas itong naipapahayag sa Tagalog sa pandiwang “pinaghahati-hatian.”
- source_word: לְבוּשִׁי
  choice: aking damit
  rationale: Ang לבוש ay pangkalahatang katawagan para sa kasuutan. Ang isahang “damit” ay natural sa Tagalog, pinananatili ang kaibhan sa “mga kasuotan,” at hindi nagpapalagay ng tiyak na uri gaya ng balabal.
- source_word: יַפִּילוּ
  choice: nagpapalabunutan sila
  rationale: Kasama ng גורל, bumubuo ito ng idyomang tumutukoy sa pagpapasiya sa pamamagitan ng palabunutan. Mas natural ito kaysa sa literal na “nagpapabagsak.”
- source_word: גוֹרָל
  choice: palabunutan
  rationale: Tumutukoy ang גורל sa lot na ginagamit sa pagpapasiya o pamamahagi. “Palabunutan” ang malinaw at karaniwang katumbas sa modernong Tagalog.
theological_decisions:
- issue: Mesiyanikong alingawngaw at paggamit sa Bagong Tipan
  choice: Tuwirang isinalin ang Hebreong paglalarawan sa salmo, nang hindi nagdaragdag ng tahasang pananalita tungkol sa pagpapako sa krus.
  alternative: Isang saling mas lantad na iniuugnay ang talata sa katuparan nito sa pagpapako kay Jesus sa krus.
  rationale: Iniuugnay ng mga salaysay ng Pasyon ang talatang ito sa pagpapako kay Jesus sa krus, ngunit dapat munang katawanin ng pangunahing teksto ang Hebreo. Ang kanonikal na kaugnayan ay inilalagay sa talababa sa halip na ipasok sa mismong salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kasuotan” at “damit” upang mapanatili ang dalawang magkaugnay ngunit magkaibang salitang Hebreo; ang “nagpapalabunutan” ay malinaw at natural na katumbas ng idyomang Hebreo.
