  source_fidelity: 'Ang unang sugnay ay malapit sa Hebreo: זֶרַע ay nananatiling literal na “binhi,” at ang יַעַבְדֶנּוּ ay wastong “maglilingkod sa kanya.” Sa ikalawang sugnay, ang pasibong יְסֻפַּר ay dapat manatiling hindi tinutukoy ang tagapagsalita. Gayunman, ang “ihahayag ang tungkol sa Panginoon sa…” ay kulang sa natural na ayos sa Tagalog; mas malinaw na mailalahad ang paksa sa salinlahi nang hindi nagdadagdag ng simuno. Ang alternatibong sintaktiko ng לַאדֹנָי at לַדּוֹר ay nananatiling disputed at dapat itala nang mas tumpak.'
  naturalness: Ang “Isang binhi” ay sadyang literal at medyo hindi pangkaraniwan kapag tumutukoy sa mga taong susunod na henerasyon, ngunit katanggap-tanggap dito upang mapanatili ang metapora at ang bilang ng Hebreo. Ang binagong ayos na “Ihahayag sa salinlahi ang tungkol sa Panginoon” ay mas natural na modernong Filipino kaysa sa draft.
  terminology: Ang “Panginoon” ay angkop para sa אֲדֹנָי sa tekstong ibinigay. Pinananatili ang “binhi” upang huwag gawing tahasang “mga inapo” ang kolektibong ngunit leksikal na singular na זֶרַע. Ang “salinlahi” ay angkop para sa דּוֹר; hindi kailangang dagdagan ng “darating,” na hindi tahasang nasa talata.
