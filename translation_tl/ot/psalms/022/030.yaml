    rationale: Ang “isasalaysay ito sa Panginoon tungkol sa isang salinlahi” ay hindi maayos na naghahayag ng posibleng ugnayang sintaktiko at naglalagay ng “ito” na walang malinaw na katumbas. Dapat ipaliwanag na ang לַאדֹנָי ay maaari ring unawain bilang tatanggap, hindi paksa, ng pagsasalaysay.
