  text: Isang binhi ang maglilingkod sa kanya; ihahayag sa salinlahi ang tungkol sa Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ibang pag-unawa sa ayos ng Hebreo: “isasalaysay ito sa Panginoon para sa salinlahi.”'
    reason: Ang mga pariralang לַאדֹנָי at לַדּוֹר ay may higit sa isang posibleng sintaktikong kaugnayan sa pasibong יְסֻפַּר. Itinatala ang alternatibo nang hindi ipinipilit ang isang interpretasyon.
lexical_decisions:
- source_word: זֶרַע
  choice: isang binhi
  rationale: Pinananatili ang konkretong metapora at posibleng kolektibong diwa ng Hebreo, sa halip na agad itong gawing “mga inapo.”
- source_word: יַעַבְדֶנּוּ
  choice: maglilingkod sa kanya
  rationale: Tuwirang ipinapahayag ang paglilingkod; ang panghalip na “kanya” ay pinananatili upang hindi lampasan ang anyo ng Hebreo.
- source_word: יְסֻפַּר
  choice: ihahayag
  rationale: Ang pasibong anyo ay maaaring tumukoy sa pagsasalaysay o pagpapahayag; ang “ihahayag” ay natural at hindi nagdaragdag ng tahasang simuno.
- source_word: לַאדֹנָי
  choice: tungkol sa Panginoon
  rationale: Ang preposisyong ל ay inuunawang tumutukoy sa paksa ng ihahayag, gaya ng sinusuportahan ng konteksto at ng konsultasyong salin.
- source_word: לַדּוֹר
  choice: sa darating na salinlahi
  rationale: Ang tiyak ngunit hindi pinangalanang “salinlahi” ay natural na tumutukoy sa susunod o darating na salinlahi sa konteksto.
theological_decisions:
- issue: Kung ang זֶרַע ay isasalin bilang kolektibong “mga inapo” o literal na “binhi”
  choice: isang binhi
  alternative: mga inapo / salinlahi
  rationale: Pinananatili ang tunay na leksikal at teolohikal na puwang ng “binhi,” na maaaring magkaroon ng kolektibo o mas tiyak na reperensiya, nang hindi ito paunang nilulutas.
- issue: Kaugnayan ng לַאדֹנָי sa pasibong pandiwa
  choice: ihahayag ang tungkol sa Panginoon
  alternative: isasalaysay ito sa Panginoon
  rationale: Mas angkop sa daloy ng talata ang pagpapahayag tungkol sa Panginoon sa isang salinlahi, ngunit itinatala sa talababa ang gramatikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Sadyang pinanatili ang “binhi” at ang pasibong “ihahayag” upang huwag burahin ang ambiguwidad ng Hebreo.
