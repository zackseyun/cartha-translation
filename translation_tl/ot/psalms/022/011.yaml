  source_fidelity: 'Tumpak ang salin sa Hebreo. Ang “Huwag kang lumayo sa akin” ay wastong panalanging negatibo para sa אַל תִּרְחַק מִמֶּנִּי at pinananatili ang metaporang panlugar. Wasto ring naipahayag ang dalawang sugnay na כִּי: ang lapit ng צָרָה at ang kawalan ng עוֹזֵר. Ang “walang tutulong” ay natural na nagpapahayag ng personal na participle na ‘isang tutulong.’'
