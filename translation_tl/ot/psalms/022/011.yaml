  text: אַל תִּרְחַ֣ק מִ֭מֶּ/נִּי כִּי צָרָ֣ה קְרוֹבָ֑ה כִּי אֵ֥ין עוֹזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: tl
  text: 'Huwag kang lumayo sa akin,

    sapagkat malapit na ang kagipitan[a],

    sapagkat walang tutulong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapighatian” o “paghihirap.” Maaaring tumukoy ang salitang Hebreo sa kagipitan, problema, o pagdurusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: Huwag kang lumayo sa akin
  rationale: Pinananatili nito ang pakiusap na nasa anyong pautos at ang metaporang panlugar ng רחק + מן, nang hindi ito pinalalakas tungo sa ideya ng tahasang pag-abandona.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ng pangatnig ang dahilan ng pakiusap. Ang “sapagkat” ay malinaw, marangal, at angkop sa panulaan.
- source_word: צָרָה קְרוֹבָה
  choice: malapit na ang kagipitan
  rationale: Ang “kagipitan” ay natural na salin ng kalagayang may matinding hirap o panganib. Ang “malapit na” ay nagpapahayag ng nalalapit na banta nang hindi dinaragdagan ang kahulugan.
- source_word: כִּי אֵין עוֹזֵר
  choice: sapagkat walang tutulong
  rationale: Ang participle na עוֹזֵר ay tumutukoy sa isang taong tumutulong. Mas natural sa makabagong Tagalog ang “walang tutulong” kaysa “walang tagatulong,” habang nananatili ang personal na diwa.
theological_decisions:
- issue: Ang pananalita tungkol sa pagiging malayo ng Diyos sa panaghoy
  choice: Huwag kang lumayo sa akin
  alternative: Huwag mo akong pabayaan
  rationale: Panlarawan sa distansiya ang Hebreo. Ang “pabayaan” ay maaaring magpahiwatig ng pag-abandona, na mas malakas kaysa sa tahasang sinasabi ng teksto; pinananatili ng napiling salin ang tensiyon ng panaghoy.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal at panulaang himig. Inulit ang “sapagkat” upang mapanatili ang magkasunod na כִּי at ang estruktura ng Hebreong taludtod.
