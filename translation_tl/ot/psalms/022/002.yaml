  text: אֱֽלֹהַ֗/י אֶקְרָ֣א י֭וֹמָם וְ/לֹ֣א תַעֲנֶ֑ה וְ֝/לַ֗יְלָה וְֽ/לֹא דֽוּמִיָּ֥ה לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: tl
  text: Diyos ko, sumisigaw ako sa iyo sa araw, ngunit hindi ka sumasagot; sumisigaw din ako sa gabi, at hindi ako matahimik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala akong pahinga.” Sa literal, “walang katahimikan para sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang ipinahahayag ng hulaping unang panauhan ang pag-aangkin at pagtawag sa Diyos; natural at marangal sa Tagalog ang “Diyos ko.”
- source_word: אֶקְרָא
  choice: sumisigaw ako sa iyo
  rationale: Sa konteksto ng panaghoy, ang קרא ay apurahang pagtawag sa Diyos. Ipinahihiwatig ng “sa iyo” ang pinatutungkulan ng sigaw, na malinaw na mula sa konteksto.
- source_word: יוֹמָם
  choice: sa araw
  rationale: Karaniwang pang-abay na tumutukoy sa panahon at natural na katapat ng “sa gabi.”
- source_word: וְלֹא תַעֲנֶה
  choice: ngunit hindi ka sumasagot
  rationale: Ang “ngunit” ay malinaw na naghahayag ng salungatan sa pagitan ng pagsigaw ng makata at ng kawalan ng sagot, gaya ng diwa ng Hebreo.
- source_word: וְלַיְלָה
  choice: sumisigaw din ako sa gabi
  rationale: Elliptical ang Hebreo at ipinauunawa na nagpapatuloy sa gabi ang naunang pagsigaw. Ang pag-uulit ng pandiwa ay kailangan para sa natural at malinaw na Tagalog.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: at hindi ako matahimik
  rationale: Ang דומיה ay maaaring tumukoy sa katahimikan, pananahimik, o pamamahinga. Pinananatili ng “hindi ako matahimik” ang larawang walang katahimikan habang natural sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng huling pariralang וְלֹא דֽוּמִיָּה לִי
  choice: Hindi matahimik ang makata sa patuloy niyang pagdaing.
  alternative: Wala siyang pahinga; o walang katahimikan para sa kanya.
  rationale: Hindi ginawang “walang sagot” ang דומיה, sapagkat hindi iyon ang karaniwang kahulugan ng salita. Pinananatili ng salin at talababa ang pag-igting sa pagitan ng hindi pagsagot ng Diyos at ng hindi pagtahimik o hindi pagkakaroon ng pahinga ng makata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inulit ang ipinahihiwatig na pandiwang “sumisigaw” sa ikalawang hati upang maging natural ang paralelismo, habang inilagay sa talababa ang mas literal at sadyang malabong larawan ng Hebreo.
