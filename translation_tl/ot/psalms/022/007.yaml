lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Lahat ng nakakakita sa akin
  rationale: Ang כָּל ay nagsasaad ng kabuuan, at ang participle na רֹאַי ay likas na maisasalin sa Filipino bilang sugnay na “ng nakakakita sa akin.”
- source_word: יַלְעִגוּ לִי
  choice: nililibak ako
  rationale: Ang pandiwang לעג ay tumutukoy sa mapanlait na pangungutya. Ang “nililibak ako” ay malinaw, dignified, at tuwirang nakatuon sa nagsasalita.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: ngumingiwi ang kanilang mga labi
  rationale: Inihahatid nito sa natural na Filipino ang mapanghamak na kilos ng labi habang pinananatili ang pisikal na larawan. Dahil maaaring unawain nang mas literal ang pandiwa bilang pagbubuka o pag-uunat ng labi, inilagay ang alternatibo sa talababa.
- source_word: יָנִיעוּ רֹאשׁ
  choice: iniiling nila ang kanilang ulo
  rationale: Karaniwang ipinahihiwatig ng parirala ang paggalaw o pag-iling ng ulo bilang kilos ng paghamak. Pinananatili ng salin ang larawan nang hindi dinaragdagan ang teksto ng tahasang interpretasyon.
theological_decisions:
- issue: Mesiyanikong paggamit sa kalaunang Kristiyanong pagbasa
  choice: Isinalin muna ang talata ayon sa konteksto ng salmo bilang pananalita ng nagdurusang mang-aawit.
  alternative: Maaaring makilala ng mambabasa ang alusyon dito sa mga salaysay ng pagpapakasakit ni Jesus sa mga Ebanghelyo.
  rationale: Hindi dapat ipasok sa mismong salin ang tahasang Kristolohikal na pananalita na wala sa Hebreong teksto, bagaman maaaring banggitin sa talababa ang kalaunang alusyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nililibak” upang mapanatili ang matinding diwa ng pangungutya, at “ngumingiwi ang kanilang mga labi” upang maging natural ang idyomang Hebreo habang nananatili ang pisikal na larawan.
