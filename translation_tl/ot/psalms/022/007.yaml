translation:
  language: tl
  text: Nililibak ako ng lahat ng nakakakita sa akin; ibinubuka nila ang kanilang mga labi[a] at iniiling nila ang kanilang ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang pandiwang Hebreo sa pagbubuka o pag-uunat ng labi bilang kilos ng paghamak; maaari rin itong unawain bilang pagngiwi.
