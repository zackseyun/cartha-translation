  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: tl
  text: 'Kayong may takot kay Yahweh, purihin ninyo siya!


    Lahat ng mga inapo ni Jacob, parangalan ninyo siya!


    Matakot kayo sa kanya[a], lahat ng mga inapo ni Israel!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mangimi kayo sa kanya” o “igalang ninyo siya nang may takot.” Ang pandiwang Hebreo ay nagpapahiwatig ng takot na may pagpipitagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: Kayong mga may takot kay Yahweh
  rationale: Tumutukoy ang pariralang konstrukt sa mga taong kinikilala sa kanilang may-pagpipitagang takot kay Yahweh. Pinanatili ang tuwirang pagtawag dahil sinusundan ito ng mga pautos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang pamagat na “Panginoon.”
- source_word: הַלְלוּהוּ
  choice: purihin ninyo siya
  rationale: Maramihang pautos ang pandiwa at may hulaping tumutukoy kay Yahweh; natural at tapat dito ang “purihin ninyo siya.”
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: Lahat ng lahi ni Jacob
  rationale: Kolektibo ang זֶרַע. Ang “lahi” ay maikli, patula, at nauunawaan bilang buong liping nagmula kay Jacob.
- source_word: כַּבְּדֻהוּ
  choice: parangalan ninyo siya
  rationale: Ang Piel na pautos ng כבד ay panawagang ibigay ang nararapat na dangal; tuwiran itong ipinahahayag ng “parangalan.”
- source_word: וְגוּרוּ
  choice: Mangilabot kayo
  rationale: Masidhi ang גור kaysa karaniwang paggalang at maaaring magpahiwatig ng pangingimi o takot na may pagpipitagan. Pinananatili ng “mangilabot” ang lakas at tensiyon nito.
- source_word: מִמֶּנּוּ
  choice: sa kanya
  rationale: Kasama ng גור, ipinakikilala ng מִן ang kinatatakutan o pinangingilabutan. Ang “sa kanya” ang natural na katambal sa Filipino.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: lahat ng lahi ni Israel
  rationale: Pinanatili ang kaparehong kolektibong salin ng זֶרַע upang maingatan ang paralelismo sa “lahi ni Jacob.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang kumakatawan rito kaysa palitan ito ng isang titulo.
- issue: Diwa ng וְגוּרוּ מִמֶּנּוּ
  choice: Mangilabot kayo sa kanya
  alternative: Matakot kayo sa kanya; igalang ninyo siya nang may takot
  rationale: Pinananatili nito ang masidhing pangingimi sa harap ng Diyos at hindi pinapahina tungo sa karaniwang paggalang lamang. Inilalagay sa talababa ang mas banayad na mga posibleng salin.
translation_notes:
  register: Makabago ngunit marangal at patula ang rehistro. Ginamit ang “lahi” bilang kolektibong tawag sa mga nagmula kina Jacob at Israel, at ang magkakatulad na anyo ng dalawang linya ay nagpapanatili sa paralelismo ng Hebreong tula.
