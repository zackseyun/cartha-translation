  source_fidelity: Tumpak ang tatlong panawagan at ang pagtukoy kay Yahweh. Gayunman, ang “mangilabot” ay karaniwang nagpapahiwatig sa modernong Filipino ng pangingilabot o pagkasindak, kadalasa’y dahil sa nakatatakot o karima-rimarim na bagay; mas matindi at mas tiyak ito kaysa sa וְגוּרוּ sa paralelismong ito. Ang “matakot kayo sa kanya” ay mas tuwirang pinananatili ang saklaw ng Hebreo nang hindi nagdaragdag ng ganitong konotasyon.
  naturalness: Ang “Kayong may takot kay Yahweh” ay mas likas kaysa “Kayong mga may takot kay Yahweh.” Mas malinaw at karaniwan rin ang “mga inapo” para sa kolektibong “binhi/lahi” sa dalawang magkatambal na linya.
  terminology: Ang “Yahweh,” “purihin,” at “parangalan” ay angkop at pare-pareho sa pinagmulan. Ginamit ang “matakot” sa huling utos upang huwag ipasok ang masidhing konotasyon ng “mangilabot”; ipinapaliwanag ng talababa ang reverential na saklaw nito.
