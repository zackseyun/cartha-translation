  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: tl
  text: Sapagkat hindi niya hinamak o kinasuklaman ang paghihirap ng taong nagdurusa[a]; hindi niya ikinubli ang kanyang mukha sa taong iyon, at nang dumaing ito sa kanya, narinig niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang paghihirap ng dukha” o “ang pagkapahiya ng taong nagdurusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָזָה
  choice: hinamak
  rationale: Ipinahahayag ng pandiwa ang pagtrato nang may paghamak; natural at malinaw ang “hinamak” sa makabagong Tagalog.
- source_word: שִׁקַּץ
  choice: kinasuklaman
  rationale: Mas matindi ito kaysa בָזָה at nagpapahiwatig ng pagturing na kasuklam-suklam; pinananatili ng “kinasuklaman” ang pag-igting ng magkatambal na pandiwa.
- source_word: עֱנוּת
  choice: paghihirap
  rationale: Tumutukoy ito sa kalagayan ng pagdurusa, kaabahan, o pagkapahiya. Malawak at natural ang “paghihirap” nang hindi nililimitahan ang diwa sa panloob, panlipunan, o pangkabuhayang pagdurusa lamang.
- source_word: עָנִי
  choice: taong nagdurusa
  rationale: Maaaring tumukoy sa dukha, nangangailangan, inaapi, o nagdurusa. Ang pagpiling ito ay umaangkop sa konteksto ng salmo at hindi nagpapakitid sa ekonomikong kahirapan lamang.
- source_word: הִסְתִּיר פָּנָיו
  choice: ikinubli ang kanyang mukha
  rationale: Pinananatili nito ang larawang Hebreo tungkol sa pagkakait ng mapagpalang pansin o presensya, habang nauunawaan pa rin sa marangal na Tagalog.
- source_word: מִמֶּנּוּ
  choice: sa taong iyon
  rationale: Ang panghalip na isahan ay bumabalik sa taong nagdurusa. Ginawang bahagyang hayag ang tinutukoy upang maiwasan ang kalituhan sa sunod-sunod na panlalaking panghalip sa Tagalog.
- source_word: בְשַׁוְּעוֹ
  choice: nang dumaing ito
  rationale: Ang anyo ay nagpapahayag ng apurahang paghingi ng tulong. Maikli at natural ang “nang dumaing,” at malinaw na ang taong nagdurusa ang sumisigaw.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy sa Diyos ayon sa konteksto; pinanatili ang panghalip sa halip na magdagdag ng titulong banal na wala sa talata.
- source_word: שָׁמֵעַ
  choice: narinig niya
  rationale: Ang pangunahing diwa ay “nakarinig.” Hindi ginamit ang “sinagot” sapagkat magdaragdag iyon ng hakbang na interpretatibo na hindi tahasang sinasabi ng salita.
theological_decisions:
- issue: Ang tinutukoy na taong nagdurusa
  choice: Pinananatiling isahan ang taong nagdurusa, na kapuwa umaangkop sa sariling karanasan ng mang-aawit at maaaring magpahayag ng mas malawak na katotohanan.
  alternative: Basahin ito bilang tahasang tumutukoy lamang sa Mesiyas, o bilang ganap na pangkalahatang pahayag tungkol sa sinumang dukha.
  rationale: Ang mga anyong isahan sa Hebreo ay maaaring tumukoy sa nagdurusa sa agarang konteksto at sabay na magkaroon ng mas malawak na bisa. Hindi nilulutas ng salin ang tensiyong ito sa isang direksiyon lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang imaheng “ikinubli ang kanyang mukha,” ngunit nilinaw ang ilang panghalip upang hindi malito kung Diyos o ang taong nagdurusa ang tinutukoy. Ang “Sa halip” ay natural na naghahayag ng pagsalungat ng huling sugnay.
