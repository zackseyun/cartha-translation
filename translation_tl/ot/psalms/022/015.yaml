source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: tl
  text: 'Natuyo na parang piraso ng palayok ang lakas ko,

    at nakadikit ang dila ko sa aking mga panga;[a]

    inilalagay mo ako sa alabok ng kamatayan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa aking ngalangala.” Hindi tiyak kung aling bahagi ng bibig ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: Natuyo
  rationale: Ipinahahayag ng pandiwa ang pagkatuyo o pagkatuyot. Likas sa makabagong Tagalog ang “natuyo” at malinaw nitong inilalarawan ang kalagayan ng nagsasalita.
- source_word: כַּחֶרֶשׂ
  choice: parang piraso ng palayok
  rationale: Ang חֶרֶשׂ ay tumutukoy sa palayok o bibinga. Mas madaling maunawaan ng karaniwang mambabasa ang “piraso ng palayok,” habang napapanatili ang larawan ng isang bagay na tuyo at marupok.
- source_word: כֹּחִי
  choice: ang lakas ko
  rationale: Tumutukoy dito ang כֹּחַ sa pisikal na lakas o sigla, kaya tuwiran at angkop ang “lakas ko.”
- source_word: וּלְשׁוֹנִי
  choice: at ... ang dila ko
  rationale: Tuwirang anatomikal na pagtukoy ito at hindi kailangang ipakahulugan nang malaya.
- source_word: מֻדְבָּק
  choice: nakadikit
  rationale: Ang anyong pasibo ay nagsasaad ng pagiging nakakapit o nakadikit. Pinananatili ng “nakadikit” ang pisikal na larawan at natural ito sa Tagalog.
- source_word: מַלְקוֹחָי
  choice: sa aking mga panga
  rationale: Hindi tiyak ang eksaktong bahagi ng bibig na tinutukoy ng bihirang salitang Hebreo. Ang “mga panga” ay isang posibleng kahulugan; inilalahad sa talababa ang “ngalangala” bilang mahalagang alternatibo.
- source_word: וְלַעֲפַר
  choice: sa alabok
  rationale: Maaaring ipahiwatig ng ל ang patutunguhan o pagkakalagay. Ang “sa alabok” ay natural kasunod ng “inilalagay” at hindi nilulutas nang labis ang saklaw ng pang-ukol.
- source_word: מָוֶת
  choice: ng kamatayan
  rationale: Pinananatili ng pariralang “alabok ng kamatayan” ang matindi at makatang ugnayang genitibo, sa halip na ipakahulugan agad bilang libingan.
- source_word: תִּשְׁפְּתֵנִי
  choice: inilalagay mo ako
  rationale: Ang pandiwa ay nangangahulugang maglagay o magtakda. Tuwiran nitong pinananatili ang ikalawang panauhang gumaganap at ang unang panauhang layon.
theological_decisions:
- issue: Ang gumaganap sa huling sugnay
  choice: 'Tuwirang pagtawag sa Diyos: “inilalagay mo ako sa alabok ng kamatayan.”'
  alternative: 'Di-tiyak o resultang pahayag: “inilagay ako sa alabok ng kamatayan.”'
  rationale: 'Nasa ikalawang panauhang panlalaki na isahan ang pandiwang Hebreo at may unang panauhang isahang layon. Kaya natural itong basahin bilang tuwirang pagtawag sa Diyos. Pinananatili nito ang teolohikal na tensiyon ng panaghoy: iniuugnay ng nagdurusa sa pagkilos ng Diyos ang sukdulan niyang kalagayan, nang hindi ipinapaliwanag ang kaugnayan nito sa pagkilos ng mga taong kaaway.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “piraso ng palayok” sa halip na ang mas bihirang “bibinga” upang madaling maunawaan, habang pinanatili ang paralelismo, pisikal na larawan ng matinding pagkatuyo, at tahasang banal na agency sa huling linya.
