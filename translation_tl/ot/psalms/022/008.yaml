base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: tl
  text: “Ipagkatiwala mo ang sarili mo kay Yahweh[a]! Nawa’y iligtas niya siya; nawa’y sagipin niya siya, sapagkat nalulugod siya sa kanya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Igulong mo patungo kay Yahweh.” Ang idyoma ay nangangahulugang ipagkatiwala sa kanya ang sarili o ang sariling kapakanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Ipagkatiwala mo
  rationale: Ang pautos na anyo ng גלל ay literal na ‘igulong,’ ngunit sa idyomang ito ay nangangahulugang ipaubaya o ipagkatiwala kay Yahweh ang sarili o kapakanan. Natural at malinaw sa makabagong Tagalog ang ‘ipagkatiwala mo.’
- source_word: אֶל
  choice: kay
  rationale: Ipinapakita ng pang-ukol ang direksiyon patungo kay Yahweh; ‘kay’ ang natural na katambal ng ‘ipagkatiwala’ kapag tao ang pinagkakatiwalaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יְפַלְּטֵהוּ
  choice: Iligtas niya siya
  rationale: Ang piel ng פלט ay tumutukoy sa pagpapalaya o pagliligtas mula sa panganib. Ang ‘iligtas’ ay malinaw at angkop sa mapanuyang hamon.
- source_word: יַצִּילֵהוּ
  choice: Sagipin niya siya
  rationale: Ang hiphil ng נצל ay maaaring mangahulugang iligtas o agawin mula sa panganib. Ginamit ang ‘sagipin’ upang mapanatili ang pagkakaiba ng dalawang magkatulad na pandiwa sa paralelismo.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan sa naunang hamon; pinananatili ng ‘sapagkat’ ang malinaw na ugnayang sanhi.
- source_word: חָפֵץ בּוֹ
  choice: nalulugod siya sa kanya
  rationale: Ang חפץ na may בְּ ay nagpapahayag ng pagkalugod o pagkakaroon ng kasiyahan sa isang tao. Natural na katumbas nito ang ‘nalulugod ... sa kanya.’
theological_decisions:
- issue: Mapanuyang sipi at pagbabago ng panauhan
  choice: Pinanatili ang ikalawang panauhan sa pautos na ‘Ipagkatiwala mo ang sarili mo,’ kasunod ang ikatlong panauhan sa ‘Iligtas niya siya; sagipin niya siya.’
  alternative: 'Gawing ikatlong panauhan ang simula: ‘Ipagkatiwala siya kay Yahweh,’ upang maging tuloy-tuloy ang pagtukoy sa nagdurusa.'
  rationale: Ang גֹּל ay pautos na panlalaking isahan sa ikalawang panauhan, samantalang ang kasunod na mga pandiwa ay may mga hulaping tumutukoy sa ikatlong panauhan. Pinananatili ng salin ang biglang pagbabago ng panauhan at ang retorikal na tensiyon ng pangungutya sa Hebreo sa halip na pakinisin ito.
- issue: Tinutukoy ng ‘siya’ at ‘kanya’
  choice: 'Pinanatili ang mga panghalip nang walang idinagdag na mga pangalan: si Yahweh ang gumagawa ng pagliligtas, at ang nagdurusa ang inililigtas at kinalulugdan.'
  alternative: Ulitin ang ‘Yahweh’ at ‘ang taong ito’ upang ganap na alisin ang anumang kalabuan.
  rationale: Nauunawaan sa balangkas ng pangungusap ang mga tinutukoy, ngunit ang hindi pagdaragdag ng mga pangngalan ay mas malapit sa maikli at matalim na pananalita ng Hebreo at hindi nagpapasok ng paliwanag sa mismong teksto.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang ‘ipagkatiwala’ sa halip na literal na ‘igulong’ upang maipahayag ang Hebreong idyoma, habang ipinaliliwanag sa talababa ang literal na larawan. Ang maiikling padamdam ay nagpapanatili sa mapanuyang tindi ng sipi.
