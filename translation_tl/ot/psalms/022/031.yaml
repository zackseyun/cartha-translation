  source_fidelity: Tapat ang salin sa Hebreo. Ang mga pandiwang nasa hinaharap na “Darating sila at ipahahayag nila” ay tumutugon sa יָבֹאוּ וְיַגִּידוּ. Wasto ang “ang kanyang katuwiran” para sa צִדְקָתוֹ, ang “sa isang bayang isisilang pa” para sa לְעַם נוֹלָד, at ang “ginawa niya ito” ay maingat na pinananatili ang hindi tinukoy na layon ng עָשָׂה. Ang tutuldok ay isang katanggap-tanggap na paraan upang ipakita ang pagbasa sa כִּי bilang nilalaman ng ipinahahayag, nang hindi isinasara ang alternatibong sanhi na nasa talababa.
