base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: tl
  text: 'Darating sila at ipahahayag nila ang kanyang katuwiran[a] sa isang bayang isisilang pa[b]: ginawa niya ito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan niya.” Malawak ang kahulugan ng salitang Hebreo at maaari nitong saklawin ang katuwiran, katarungan, at matuwid na pagkilos na nagliligtas.
    reason: lexical_alternative
  - marker: b
    text: O “na ipanganganak.”
    reason: lexical_alternative
  - marker: c
    text: O “sapagkat ginawa niya ito.” Maikli ang pangwakas na parirala sa Hebreo at maaaring unawain bilang nilalaman ng ipinahahayag o bilang dahilan ng pagpapahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Darating sila
  rationale: Ang Qal imperfect na ikatlong panauhang maramihan ng בוא ay tumutukoy sa kilos na darating. Likas sa modernong Tagalog ang “Darating sila” at pinananatili nito ang pananaw sa hinaharap.
- source_word: וְיַגִּידוּ
  choice: at ipahahayag nila
  rationale: Ang Hiphil imperfect ng נגד ay nangangahulugang ipaalam o ihayag. Ang “ipahahayag” ay angkop sa hayagan at nagpapatotoong himig ng salmo.
- source_word: צִדְקָתוֹ
  choice: ang kanyang katuwiran
  rationale: 'Malawak ang saklaw ng צדקה: maaaring tumukoy sa katuwiran, katarungan, at matuwid na pagkilos na nagliligtas. Pinananatili ng “katuwiran” ang lawak ng termino; inilalagay sa talababa ang “katarungan” bilang tunay na alternatibo.'
- source_word: לְעַם
  choice: sa isang bayan
  rationale: Ang לְ ay nagmamarka sa tatanggap ng pagpapahayag, at walang tiyak na pantukoy ang עַם. Kaya ang “sa isang bayan” ay mas malapit kaysa “sa bayan.”
- source_word: נוֹלָד
  choice: isisilang pa
  rationale: Ang passive participle ng ילד ay naglalarawan sa bayang nasa hinaharap pa ang pagsilang. Malinaw at likas sa Tagalog ang “isisilang pa” nang hindi ito tahasang pinapalitan ng “salinlahi.”
- source_word: כִּי
  choice: ':'
  rationale: Nauunawaan dito ang כִּי bilang pananda ng nilalaman ng ipahahayag. Ginamit ang tutuldok upang likas na ipakilala sa Tagalog ang maikli at mariing pahayag na sumusunod, habang itinatala sa talababa ang posibleng pagbasa na sanhi.
- source_word: עָשָׂה
  choice: ginawa niya ito
  rationale: Ang Qal perfect ng עשה ay “gumawa/gawin.” Walang tahasang layon sa Hebreo; ang “ito” ay likas na panumbas sa Tagalog at pinananatili ang maikli at pangwakas na diin ng orihinal.
theological_decisions:
- issue: Saklaw ng צִדְקָתוֹ
  choice: “kanyang katuwiran” sa pangunahing teksto
  alternative: “kanyang katarungan” o “kanyang nagliligtas na katuwiran”
  rationale: Maaaring saklawin ng salita kapuwa ang moral na katuwiran at ang makatarungan o nagliligtas na pagkilos ng Diyos. Hindi nililimitahan ng pangunahing salin ang kahulugan sa isa lamang sa mga ito.
- issue: Gamit ng pangwakas na כִּי עָשָׂה
  choice: 'Nilalaman ng pahayag: “ginawa niya ito”'
  alternative: 'Sanhi ng pagpapahayag: “sapagkat ginawa niya ito”'
  rationale: Maikli at maaaring basahin sa dalawang paraan ang Hebreo. Mas maayos sa daloy ang pagbasa rito bilang nilalaman ng ipahahayag, ngunit pinananatili sa talababa ang tunay na posibleng pagbasa bilang sanhi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kolektibong “bayan,” ang malawak na teolohikal na kahulugan ng “katuwiran,” at ang mariing kaiklian ng huling sugnay. Ginamit ang tutuldok upang maging natural ang sugnay na nilalaman sa Tagalog nang hindi dinaragdagan ang sinasabi ng Hebreo.
