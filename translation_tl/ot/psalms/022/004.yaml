lexical_decisions:
- source_word: בְּךָ
  choice: Sa iyo
  rationale: Ang בְּ na may hulaping ikalawang panauhang panlalaki ay tumutukoy sa Diyos bilang pinagtitiwalaan. Likas sa Filipino ang “sa iyo” at hindi ito nagdaragdag ng eksklusibidad na wala sa Hebreo.
- source_word: בָּטְחוּ
  choice: nagtiwala
  rationale: Ang בטח ay nangangahulugang magtiwala o umasa nang panatag. Pinananatili ang payak at tuwirang pandiwa.
- source_word: אֲבֹתֵינוּ
  choice: aming mga ninuno
  rationale: Bagaman literal na “aming mga ama,” maaari itong tumukoy sa mga naunang salinlahi. Mas natural at malinaw sa modernong Filipino ang “mga ninuno,” habang inilalagay sa talababa ang literal na anyo.
- source_word: בָּטְחוּ
  choice: nagtiwala sila
  rationale: Inuulit ang pandiwa gaya sa Hebreo upang mapanatili ang diin at balangkas ng taludtod.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: at iniligtas mo sila
  rationale: Ang פלט ay nangangahulugang magligtas, sumagip, o magpatakas. Ang “iniligtas” ay natural, marangal, at hindi labis na nagtatakda ng paraan ng pagliligtas.
theological_decisions:
- issue: Saklaw ng אֲבֹתֵינוּ bilang katawagang pangkasaysayan
  choice: aming mga ninuno
  alternative: aming mga ama
  rationale: Pinipili sa pangunahing teksto ang likas na kolektibong kahulugan sa Filipino, ngunit pinananatiling nakikita sa talababa ang tahasang panlalaking anyo ng Hebreo. Hindi nito nilulutas nang palihim ang saklaw ng katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang pag-uulit ng “nagtiwala” bilang mahalagang diin sa tulang Hebreo.
