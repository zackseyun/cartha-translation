  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: tl
  text: Sa iyo nagtiwala ang aming mga ama[a]; nagtiwala sila, at iniligtas mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, aming mga ninuno. Literal na “aming mga ama.”
