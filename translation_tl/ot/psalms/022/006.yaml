  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: tl
  text: Ngunit ako'y isang uod at hindi tao, hinahamak ng sangkatauhan at nilalait ng bayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Ngunit ako'y
  rationale: Ang mariing panghalip na אָנֹכִי ay “ako,” at ang וְ dito ay nagpapakita ng matinding pagsalungat sa naunang pahayag ng pagtitiwala; natural itong ipinahahayag ng “Ngunit.”
- source_word: תוֹלַעַת
  choice: isang uod
  rationale: Tumutukoy ito sa uod at nagsisilbing larawan ng sukdulang pagpapakababa at kahihiyan, nang hindi tinutukoy ang isang partikular na uri.
- source_word: וְ/לֹא אִישׁ
  choice: at hindi tao
  rationale: Pinananatili nito ang tuwirang paghahambing sa “uod” at ang diwang itinuring ang nagsasalita na waring walang dangal bilang tao.
- source_word: חֶרְפַּת אָדָם
  choice: hinahamak ng sangkatauhan
  rationale: Ang חֶרְפַּת ay maaaring mangahulugang kadustaan, kahihiyan, o tudya; sa konteksto, ang nagsasalita ang tampulan ng paghamak. Ang אָדָם ay kolektibong tumutukoy sa sangkatauhan.
- source_word: וּ/בְזוּי
  choice: at nilalait
  rationale: Ang pasibong anyo ay nagsasaad na ang nagsasalita ay hinahamak o itinuturing na walang halaga; ang “nilalait” ay natural at mabigat sa makabagong Tagalog.
- source_word: עָם
  choice: ng bayan
  rationale: Ang עָם ay kolektibong “bayan” o “mga tao”; pinananatili ng “bayan” ang pagkakaiba nito sa naunang kolektibong אָדָם.
theological_decisions:
- issue: Mesiyanikong/prototipikong pagbasa sa tradisyong Kristiyano
  choice: Isinalin ayon sa tuwirang Hebreong larawan ng matinding pagpapakababa at pampublikong paghamak.
  alternative: Dagdagan ng tahasang pananalitang nag-uugnay sa katuparang kristolohikal.
  rationale: Mahalaga ang Awit 22 sa Bagong Tipan at sa pagbasa ng mga Kristiyano, ngunit ang talatang ito mismo ay nagsasalita sa tinig ng salmista. Hindi dapat idagdag sa salin ang teolohikong paliwanag na wala sa mismong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matapang na larawang “uod” at ang paralelismong “hinahamak… nilalait,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
