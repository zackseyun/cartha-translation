id: PSA.22.27
reference: Psalms 22:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: tl
  text: Maaalaala at manunumbalik kay Yahweh[a] ang lahat ng dulo ng lupa; yuyukod sa harap mo[b] ang lahat ng angkan ng mga bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang banal na pangalang YHWH.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sasamba sa harap mo.” Literal na tumutukoy ang pandiwang Hebreo sa pagyukod o pagpapatirapa, na madalas gawin bilang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: Maaalaala
  rationale: Tuwirang inililipat ang Qal imperfect ng זכר na may hinaharap o mapanghulang diwa sa pangitain ng salmo.
- source_word: וְיָשֻׁבוּ
  choice: at manunumbalik
  rationale: Pinananatili ang pangunahing diwa ng שוב na ‘bumalik/manumbalik,’ lalo na dahil sinusundan ito ng direksiyong אֶל יְהוָה; hindi ito nilimitahan sa tahasang ‘magsisisi.’
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng אֶל ang paglapit o pagbaling tungo kay Yahweh, at pinananatili ang banal na pangalang יְהוָה bilang Yahweh.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: ang lahat ng dulo ng lupa
  rationale: Pinananatili ang Hebreong idyoma para sa pinakamalalayong bahagi ng daigdig at ang pandaigdig na saklaw nito.
- source_word: וְיִשְׁתַּחֲווּ
  choice: yuyukod
  rationale: Inilalarawan ng pandiwa ang aktuwal na pagyukod o pagpapatirapa bilang pagpaparangal o pagsamba; pinananatili ng ‘yuyukod’ ang kongkretong larawan.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Likas na katumbas sa Filipino ng literal na ‘sa harap ng iyong mukha,’ habang pinananatili ang tuwirang pakikipag-usap sa Diyos.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: ang lahat ng angkan ng mga bansa
  rationale: Mas tiyak ang ‘angkan’ para sa mga pangkat na magkakamag-anak na tinutukoy ng מִשְׁפְּחוֹת, samantalang malawak ang ‘mga bansa’ para sa גּוֹיִם.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehovah
  rationale: Tuwirang nasa talata ang Tetragrammaton; pinananatili ang tipanang pangalan sa anyong Yahweh sa halip na palitan ito ng titulo.
- issue: Kung tahasang isasalin bilang ‘sasamba’ ang וְיִשְׁתַּחֲווּ
  choice: yuyukod
  alternative: sasamba; magpapatirapa
  rationale: Pinananatili ang pisikal na larawan at hindi inaalis ang posibleng pagsambang ipinahihiwatig ng konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘manunumbalik’ upang mapanatili ang diwa ng pagbabalik tungo kay Yahweh nang hindi tahasang ipinakahulugang pagsisisi; ginamit ang ‘angkan’ para sa family/clan groups at ‘yuyukod’ para sa kongkretong kilos ng paggalang o pagsamba.
