  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: tl
  text: Iligtas mo ako mula sa bibig ng leon at mula sa mga sungay ng mga mailap na baka[a]—sinagot mo ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mailap na toro” o “aurochs”; ang salitang Hebreo ay tumutukoy sa isang makapangyarihang mailap na hayop na kauri ng baka.
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring unawain ang huling parirala bilang biglang pahayag na sinagot ang panalangin: “sinagot mo ako.” Dito lumilipat ang awit mula sa pagsusumamo tungo sa pagtitiwala.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Iligtas mo ako
  rationale: Ang Hiphil imperative na may hulaping unang panauhan ay isang tuwirang pagsusumamo para sa pagliligtas; natural at malawak ang saklaw ng “iligtas” sa modernong Tagalog.
- source_word: מִפִּי
  choice: sa bibig ng
  rationale: Pinananatili ang literal at malinaw na larawan ng Hebreong “mula sa bibig ng,” sa halip na gawing “mga panga.”
- source_word: אַרְיֵה
  choice: leon
  rationale: Ang payak na “leon” ay natural sa tulang Tagalog at nagpapanatili sa isahang mabangis na hayop ng Hebreo.
- source_word: וּמִקַּרְנֵי
  choice: at mula sa mga sungay ng
  rationale: Tuwirang ipinagpapatuloy ng parirala ang ikalawang panganib at pinananatili ang kongkretong larawang “mga sungay.”
- source_word: רֵמִים
  choice: mababangis na baka
  rationale: Tumutukoy ang termino sa makapangyarihang mailap na bovine. Mas madaling maunawaan ang “mababangis na baka” kaysa “aurochs,” nang hindi ginagamit ang maling tradisyonal na “unicorn.”
- source_word: עֲנִיתָנִי
  choice: sinagot mo ako
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki, isahan, na may hulaping unang panauhan ay karaniwang nangangahulugang “sinagot mo ako.” Pinananatili nito ang biglang paglipat mula sa pagsusumamo tungo sa katiyakan.
theological_decisions:
- issue: Kung ang עֲנִיתָנִי ay pagpapatuloy ng pagsusumamo o pahayag na sinagot na ang panalangin
  choice: 'Pahayag: “sinagot mo ako”'
  alternative: Ipaloob ito sa nagpapatuloy na pakiusap, gaya ng “sagipin mo ako mula sa mga sungay ng mababangis na baka”
  rationale: Perfect ang pandiwang Hebreo, hindi imperative. Ang biglang pahayag ng pagkakasagot ay angkop sa pampanitikang pagliko ng awit patungo sa pagpupuri, habang ang gitling at talababa ay nagpapanatili sa kapansin-pansing tensiyon ng pagkakabuo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kongkretong larawang patula at ang biglang pagbabago ng himig sa huling sugnay.
