  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: tl
  text: Ngunit ikaw, Yahweh, huwag kang lumayo; O lakas ko,[a] magmadali kang tulungan ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “lakas ko.” Nauunawaan din ito ng ilan bilang “tulong ko,” o, bagaman hindi gaanong malamang dito, ayon sa literal na kahulugang kaugnay ng isang babaeng usa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ngunit ikaw
  rationale: Ang pangatnig at tahasang panghalip ay nagpapakita ng matinding pagsalungat sa naunang paghihirap; natural itong naipahahayag sa Tagalog bilang “Ngunit ikaw.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אַל תִּרְחָק
  choice: huwag kang lumayo
  rationale: Tuwirang ipinahahayag nito ang pakiusap na huwag maging malayo; likas at malinaw ito sa modernong Tagalog.
- source_word: אֱיָלוּתִי
  choice: lakas ko
  rationale: Sa konteksto, pinakamalamang na tumutukoy ang di-pangkaraniwang salita sa lakas o kapangyarihan. Pinananatili ng “lakas ko” ang pagtawag sa Diyos bilang pinagmumulan ng lakas nang hindi itinatago ang leksikal na kawalang-katiyakan, na inilalahad sa talababa.
- source_word: לְעֶזְרָתִי
  choice: tulungan ako
  rationale: Natural na katumbas sa Tagalog ng literal na “para sa/tungo sa aking tulong,” habang pinananatili ang layon ng apurahang pakiusap.
- source_word: חוּשָׁה
  choice: magmadali kang
  rationale: Ipinahahayag ng pautos ang agarang pagkilos; malinaw at kasalukuyang gamit ang “magmadali” sa modernong Tagalog.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng אֱיָלוּתִי
  choice: lakas ko
  alternative: tulong ko; usa ko
  rationale: Ang “lakas ko” ang pinakaangkop sa agarang pakiusap para sa tulong, ngunit ang bihira at pinagtatalunang anyo ay hindi ganap na tiyak; kaya pinananatili sa talababa ang ibang pagkaunawa sa halip na dogmatikong lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa panalangin. Ginamit ang “O” bilang natural na panawag na patula ngunit nauunawaan pa rin ng karaniwang mambabasa. Inilagay ang kinakailangang marker na [a] kaagad pagkatapos ng pinagtatalunang parirala.
