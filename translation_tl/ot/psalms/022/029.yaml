base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: tl
  text: Kakain at yuyukod ang lahat ng mariwasa sa lupa[a]; luluhod sa harap niya ang lahat ng bumababa tungo sa alabok[b]—maging ang hindi kayang panatilihing buháy ang sarili.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “lahat ng matataba sa lupa,” isang idyomang malamang na tumutukoy sa mga busog o mariwasa.
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng lumulusong sa alabok.” Ang “alabok” ay larawang Hebreo para sa mortalidad at kamatayan.
    reason: lexical_alternative
  - marker: c
    text: 'Mahirap unawain ang huling sugnay sa Hebreo. Literal: “at ang kanyang buhay ay hindi niya pinanatiling buháy.” Madalas itong unawain bilang “maging ang hindi kayang panatilihing buháy ang sarili.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: Kakain
  rationale: Ang Qal perfect ay binigyang-kahulugang panghinaharap ayon sa patulang konteksto at sa kasunod na mga kilos ng pagpupugay.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: at yuyukod
  rationale: Pinananatili ang pisikal na larawan ng pagpapatirapa o pagyukod, habang ipinahihiwatig ng konteksto ang pagsamba.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: ang lahat ng sagana sa lupa
  rationale: Ang literal na 'mga matataba' ay isang idyoma para sa mga busog, mariwasa, o masagana; natural sa Filipino ang 'sagana' at hindi nito nililimitahan ang diwa sa kayamanan lamang.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Tuwirang katumbas na natural sa modernong Filipino.
- source_word: יִכְרְעוּ
  choice: luluhod
  rationale: Tiyak na ipinapahayag ng pandiwa ang pagluhod o pagbaluktot ng tuhod at pinananatili itong naiiba sa 'yuyukod.'
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: ang lahat ng bumababa sa alabok
  rationale: Pinananatili ang Hebreong larawan ng alabok bilang sagisag ng mortalidad at kamatayan sa halip na tahasang palitan ito ng 'libingan.'
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: maging ang hindi makapagpanatili ng sarili niyang buhay
  rationale: Ipinapahayag ang karaniwang pagkaunawa na ang tinutukoy ay isang taong hindi kayang ingatan ang sariling buhay, habang minamarkahan sa talababa ang kahirapan ng Hebreong sugnay.
theological_decisions:
- issue: Pagpapakahulugan sa huling sugnay na וְנַפְשׁוֹ לֹא חִיָּה
  choice: Tumutukoy ito sa taong hindi makapagpanatili ng sarili niyang buhay.
  alternative: Maaaring unawain nang mas literal bilang 'at ang kanyang buhay ay hindi niya pinanatiling buháy,' o bilang isang sugnay na hindi tiyak ang simuno.
  rationale: Ang pagbasa ay umaayon sa pagtutulad ng mga sagana at ng mga papalapit sa kamatayan, ngunit hindi itinatago ng talababa ang sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkaibang pisikal na larawan ng pagyukod at pagluhod, gayundin ang patulang larawan ng alabok. Inayos ang mga pananda ng talababa ayon sa mismong pariralang tinutukoy.
