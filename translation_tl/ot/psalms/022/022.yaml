  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: tl
  text: 'Ipahahayag ko ang pangalan mo sa mga kapatid kong lalaki[a];

    sa gitna ng kapulungan ay pupurihin kita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga kapatid ko,” kung inuunawang saklaw ng katawagang pampamilya ang mga kapatid na lalaki at babae sa kontekstong ito; literal na “sa mga kapatid kong lalaki” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Ipahahayag ko
  rationale: Ang piel ng ספר ay maaaring mangahulugang magsalaysay o magpahayag. Ang “ipahahayag” ay angkop sa hayagan at mapagpatotoong diwa ng taludtod at kaagapay ng pagpupuri sa kapulungan.
- source_word: שִׁמְךָ
  choice: ang pangalan mo
  rationale: Pinananatili ang idyomang Hebreo na “pangalan,” na tumutukoy hindi lamang sa katawagan kundi sa nahayag na pagkakakilanlan at reputasyon ng Diyos.
- source_word: לְאֶחָי
  choice: sa mga kapatid kong lalaki
  rationale: Ang Hebreo ay tahasang panlalaking pangmaramihan na may hulaping unang panauhan. Nililinaw ng “lalaki” ang kasariang nasa anyong Hebreo, sapagkat ang karaniwang Tagalog na “mga kapatid” ay hindi tiyak sa kasarian.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Tuwirang pinananatili ang larawang pampook at ang hayagang tagpuan ng pagpupuri.
- source_word: קָהָל
  choice: kapulungan
  rationale: Ang “kapulungan” ay likas at marangal na salin para sa isang nagkakatipong pangkat, nang hindi agad nagdaragdag ng mas makitid na kahulugang pang-institusyon.
- source_word: אֲהַלְלֶךָּ
  choice: pupurihin kita
  rationale: Tuwirang ipinapahayag nito ang piel ng הלל at pinananatili ang Diyos bilang tuwirang layon; walang idinagdag na diwa ng pag-awit na hindi tahasang nasa pandiwa.
theological_decisions:
- issue: Salitang panradyaan para sa kamag-anak sa konteksto ng sama-samang pagsamba
  choice: sa mga kapatid kong lalaki
  alternative: sa mga kapatid ko
  rationale: Tahasan ang panlalaking pangmaramihang anyo ng Hebreo, kaya pinananatili iyon sa pangunahing teksto. Gayunman, maaaring kumatawan ang katawagan sa mas malawak na pamayanang magkakapatid ayon sa konteksto; inilalagay ang posibilidad na iyon sa talababa sa halip na ipasok nang tahasan sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikling paralelismo ng tulang Hebreo, ang idyomang “pangalan,” at ang pampublikong tagpuan ng “kapulungan.”
