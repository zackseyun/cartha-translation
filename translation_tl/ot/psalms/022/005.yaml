base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: tl
  text: Sa iyo sila dumaing at iniligtas[a]; sa iyo sila nagtiwala at hindi napahiya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakaligtas” o “nakatanan.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtakas o sa pagkaligtas; sa kontekstong ito, tumutukoy ito sa pagsagip bilang tugon sa kanilang pagdaing sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi sila nahiya” o “hindi sila nabigo.” Sa ganitong konteksto, maaaring tumukoy ang salitang Hebreo sa hindi pagkapahiya o pagkadusta matapos magtiwala sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Sa iyo
  rationale: Ipinapakita ng אֶל na nakatuon sa Diyos ang pagdaing; natural sa makabagong Tagalog ang “sa iyo.”
- source_word: זָעֲקוּ
  choice: sila dumaing
  rationale: Ang זעק ay masidhing paghingi ng tulong. Ang “dumaing” ay likas at marangal na salita para sa paglapit sa Diyos mula sa matinding paghihirap.
- source_word: וְנִמְלָטוּ
  choice: at sila'y iniligtas
  rationale: Ang Niphal ng מלט ay maaaring tumukoy sa pagtakas o pagkaligtas. Sa konteksto ng pagdaing sa Diyos, ipinahihiwatig ng “iniligtas” ang pagliligtas na tinanggap nila nang hindi dinaragdagan ang detalye ng teksto.
- source_word: בְּךָ בָטְחוּ
  choice: sa iyo sila nagtiwala
  rationale: Sa pariralang ito, minamarkahan ng ב ang pinag-uukulan ng pagtitiwala. Ang “nagtiwala sa iyo,” na inayos dito bilang “sa iyo sila nagtiwala,” ay natural at pinananatili ang diin ng Hebreo.
- source_word: וְלֹא בֹשׁוּ
  choice: at hindi sila napahiya
  rationale: Maaaring saklawin ng בוש ang pagkapahiya, pagkadusta, o pagkabigo ng umasa. Pinananatili ng “hindi sila napahiya” ang dimensiyong dangal-kahihiyan at ang resultang kaugnay ng kanilang pagtitiwala.
theological_decisions:
- issue: Uri at pinagmulan ng pagliligtas sa וְנִמְלָטוּ
  choice: iniligtas bilang tugon sa pagdaing sa Diyos
  alternative: nakatanan o nakatakas, nang hindi hayagang ipinahihiwatig ang tagapagligtas
  rationale: Iniuugnay ng talata ang pagdaing sa Diyos at ang sumunod na pagkaligtas. Ang “iniligtas” ay nagpapanatili sa lohikang ito ngunit hindi tahasang nagdaragdag ng paksang wala sa pandiwang Hebreo.
- issue: Kahulugan ng בֹשׁוּ kaugnay ng pagtitiwala
  choice: hindi napahiya
  alternative: hindi nahiya; hindi nabigo
  rationale: Pinananatili ng “hindi napahiya” ang posibilidad ng pampubliko o resultang kahihiyan dahil sa nabigong pagtitiwala, sa halip na limitahan ito sa panloob na damdamin lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumaing” upang maipahayag ang masidhing paghingi ng tulong, at pinanatili ang paralelismong “Sa iyo… sa iyo…” ng Hebreo.
