  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: tl
  text: Sa iyo ako inihagis mula pa sa sinapupunan; mula sa tiyan[b] ng aking ina, ikaw ang aking Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “mula pa sa sinapupunan ng aking ina, ikaw na ang aking Diyos.” Literal na walang pandiwa ang huling sugnay sa Hebreo: “aking Diyos, ikaw.” Maaaring idiin nito ang kasalukuyang pahayag o ang ugnayang nagpapatuloy mula sa pagsilang.'
    reason: alternative_reading
  - marker: b
    text: Ang “tiyan” ay salin ng Hebreong beten, na maaari ding isaling “sinapupunan.” Ginamit dito ang “tiyan” upang mapanatili ang pagkakaiba sa salitang “sinapupunan” sa unang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: Sa iyo
  rationale: Ipinapanatili nito ang larawan ng pagkakalagay o pagkakahagis tungo sa pagkalinga ng Diyos, nang hindi tahasang dinaragdagan ang diwang “ipinaubaya.”
- source_word: הָשְׁלַכְתִּי
  choice: ako inihagis
  rationale: Tuwirang pinananatili ang matinding larawang dala ng Hoph'al ng שלך. Ang “ipinaubaya” ay maaaring magpahayag ng diwa sa konteksto ngunit higit na interpretatibo.
- source_word: מֵרָחֶם
  choice: mula pa sa sinapupunan
  rationale: Ang רֶחֶם ay literal na “sinapupunan.” Idinagdag ang “pa” upang natural na ipahayag sa Tagalog ang panahong nagsisimula sa sinapupunan.
- source_word: מִבֶּטֶן אִמִּי
  choice: mula sa tiyan ng aking ina
  rationale: Ang בֶּטֶן ay maaaring mangahulugang “tiyan” o “sinapupunan.” Pinili ang “tiyan” upang mapanatili ang pagkakaiba nito sa naunang רֶחֶם.
- source_word: אֵלִי
  choice: aking Diyos
  rationale: Tuwirang ipinapahayag ang unang-panauhang hulaping paari at ang personal na ugnayan sa Diyos.
- source_word: אָתָּה
  choice: ikaw ang
  rationale: Ang pangungusap na “ikaw ang aking Diyos” ay natural na sugnay na walang pandiwa sa Tagalog at mahusay na tumutugma sa walang-pandiwang Hebreong אֵלִי אָתָּה, kaya hindi kailangang piliting lagyan ng tahasang panahunan.
theological_decisions:
- issue: Panahunan ng huling sugnay na walang pandiwa
  choice: ikaw ang aking Diyos
  alternative: mula pa sa sinapupunan ng aking ina, ikaw na ang aking Diyos
  rationale: Walang tahasang pandiwa o panahunan ang Hebreong אֵלִי אָתָּה. Pinananatili ng natural na Tagalog na “ikaw ang aking Diyos” ang tunay na kalabuan, habang ipinahihiwatig ng konteksto ang ugnayang nagsimula sa kapanganakan at nagpapatuloy hanggang sa kasalukuyan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matingkad na talinghaga ng “inihagis,” ang magkaibang salitang Hebreo para sa “sinapupunan” at “tiyan,” at ang walang-pandiwang anyo ng huling sugnay.
