  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: tl
  text: Sapagkat ikaw ang naglabas sa akin mula sa sinapupunan; ikaw ang nagbigay sa akin ng kapanatagan sa mga suso ng aking ina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ikaw ang nagpangyaring magtiwala ako habang nasa mga suso ng aking ina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan na kaugnay ng naunang pahayag; likas at marangal ang “Sapagkat” sa daloy ng salmo.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinanatili ang hayag na panghalip upang idiin na ang Diyos mismo ang kumikilos.
- source_word: גֹחִי
  choice: ang naglabas sa akin
  rationale: Sa konteksto ng pagsilang, tumutukoy ito sa pagpapalabas mula sa sinapupunan; pinananatili ng salin ang konkretong larawan nang hindi dinaragdagan ang kahulugan.
- source_word: מִבָּטֶן
  choice: mula sa sinapupunan
  rationale: Tuwirang salin ng pariralang Hebreo sa konteksto ng kapanganakan.
- source_word: מַבְטִיחִי
  choice: ang nagbigay sa akin ng kapanatagan
  rationale: Maaaring ipahiwatig ng Hiphil ng בטח ang pagdudulot ng katiwasayan o pagtitiwala. Ang “kapanatagan” ay angkop sa sanggol at hindi ipinipilit ang ideya ng ganap na malay na pagtitiwala.
- source_word: עַל שְׁדֵי אִמִּי
  choice: sa dibdib ng aking ina
  rationale: Natural na Filipino para sa kalagayan ng sanggol na sumususo; ang isahang kolektibong “dibdib” ay dignified at karaniwang tumutukoy sa bahaging ipinahihiwatig ng Hebreo.
theological_decisions:
- issue: Kung ang מַבְטִיחִי ay tahasang tumutukoy sa pagtitiwala ng sanggol o sa mas malawak na kapanatagan
  choice: nagbigay sa akin ng kapanatagan
  alternative: nagpangyaring magtiwala ako
  rationale: Binibigyang-diin ng konteksto ang pangangalaga ng Diyos mula sa pagsilang. Hindi ipinapasok ng pangunahing salin ang isang tiyak na pahayag tungkol sa malay na pananampalataya ng sanggol, ngunit pinananatili sa talababa ang leksikal at tradisyonal na posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sinapupunan” para sa konkretong larawan ng kapanganakan at “kapanatagan” upang mapanatili ang saklaw at tensiyon ng Hebreo. Inilagay ang marker na [a] sa mismong teksto.
