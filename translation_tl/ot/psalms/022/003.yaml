  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: tl
  text: Ngunit ikaw ay banal, nakaluklok[a] sa mga papuri ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nananahan sa mga papuri ng Israel.” Ang anyong pandiwa sa Hebreo ay maaaring unawaing “nakaupo” o “nananahan,” bagaman ang “nakaluklok” ay angkop sa maharlikang larawang patula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ipinahihiwatig ng pangatnig at ng tahasang panghalip ang pagsalungat sa naunang panaghoy. Likas sa modernong Tagalog ang “Ngunit ikaw” at napapanatili nito ang tuwirang pakikipag-usap sa Diyos.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Ito ang karaniwan at buong salin ng katangiang tumutukoy sa kabanalan ng Diyos; magiging masyadong makitid ang “ibinukod.”
- source_word: יֹשֵׁב
  choice: nakaluklok
  rationale: Bagaman literal na maaaring mangahulugang “nakaupo” o “nananahan,” madalas itong maglarawan sa Diyos bilang hari na nakaluklok. Pinananatili ng “nakaluklok” ang maharlikang larawang patula.
- source_word: תְּהִלּוֹת
  choice: mga papuri
  rationale: Pinananatili nito ang maramihang anyo at ang diwa ng mga pagpapahayag o awit ng papuri.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginamit ang kinagawiang anyo ng pangalang pantangi sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng pariralang יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Inilalarawan ang Diyos bilang nakaluklok sa mga papuri ng Israel.
  alternative: Inilalarawan ang Diyos bilang nananahan sa mga papuri ng Israel.
  rationale: Pinakamalinaw na inuugnay ng Hebreo ang anyong pandiwang יֹשֵׁב sa “mga papuri ng Israel.” Pinananatili ng “nakaluklok” ang maharlika at patulang larawan, samantalang inilalagay sa talababa ang tunay na posibleng diwang “nananahan” upang hindi alisin ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang payak na ayos ng pangungusap at ang pamilyar na “mga papuri,” habang pinananatili ang siksik at maharlikang talinghaga ng Hebreong tula.
