source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: tl
  text: Sapagkat kay Yahweh[a] ang paghahari,[b] at namamahala siya sa mga bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: O “kay Yahweh ang kaharian.” Ang salitang Hebreo ay maaaring mangahulugang “paghahari,” “pagiging hari,” o “kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o batayan ng naunang panawagan sa pagpupuri, kaya pinananatili ang ugnayang sanhi.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol na לְ ay nagpapahayag dito ng pag-aari; natural sa Filipino ang kay Yahweh sa hulmaing kay Yahweh ang paghahari.
- source_word: הַמְּלוּכָה
  choice: ang paghahari
  rationale: Maaaring tumukoy ang מְלוּכָה sa paghahari, pagiging hari, o kaharian. Mas tuwirang ipinahahayag ng paghahari ang abstraktong kapangyarihan at pamumunong pag-aari ni Yahweh, habang inilalagay sa talababa ang tunay na alternatibong kaharian.
- source_word: וּמֹשֵׁל
  choice: at namamahala siya
  rationale: Ang Qal participle ay nagsasaad ng patuloy o pangkalahatang katotohanan. Natural sa Filipino ang namamahala siya at hindi nito nililimitahan ang kilos sa isang tiyak na panahon.
- source_word: בַּגּוֹיִם
  choice: sa mga bansa
  rationale: Kasama ng משל, ang בְּ ay tumutukoy sa saklaw o mga nasasakupan ng pamamahala. Sa Filipino, sapat at natural ang namamahala sa mga bansa; ang גּוֹיִם ay malawak na tumutukoy sa mga bansa, hindi lamang sa mga Hentil.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng Yahweh ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng kahulugan ng מְלוּכָה
  choice: paghahari
  alternative: kaharian; pagiging hari
  rationale: Pinapanatili ng paghahari ang diwa ng kapamahalaang maharlika nang hindi ipinapalagay na pangunahing tinutukoy ang isang teritoryo. Gayunman, tunay na posible sa salita ang kaharian, kaya tinukoy ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang hulmaing “kay Yahweh ang paghahari” upang natural na ipahayag ang pag-aari, at pinanatili ang poetikong ikli at ang magkatugmang ideya ng paghahari at pamamahala.
