translation:
  language: tl
  text: Ibinubuka nila ang kanilang mga bibig laban sa akin, gaya ng leong lumalapa at umuungal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ibinuka nila ang kanilang mga bibig laban sa akin—isang leong lumalapa at umuungal.” Siksik ang paglalarawan sa Hebreo at walang tahasang salitang “gaya ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: Ibinubuka
  rationale: Ang pandiwang פצה ay nangangahulugang ibuka nang maluwang. Ginamit ang aspektong nagaganap upang mapanatili ang matingkad na puwersa ng Hebreong perpektibo sa tulang ito.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Ipinahihiwatig ng עַל dito ang mapanlabang direksiyon, kaya likas at malinaw ang “laban sa akin.”
- source_word: פִּיהֶם
  choice: ang kanilang bibig
  rationale: Isahan ang pangngalan sa Hebreo kahit maramihan ang nagmamay-ari. Napananatili ng “kanilang bibig” ang kolektibong larawan at natural pa rin ito sa Tagalog.
- source_word: אַרְיֵה
  choice: gaya ng leon
  rationale: Walang tahasang katagang pantulad sa Hebreo, ngunit gumaganap na paghahambing ang siksik na larawang “leon.” Idinagdag ang “gaya ng” para maging malinaw at natural sa Tagalog, habang inilalahad sa talababa ang mas literal na kayarian.
- source_word: טֹרֵף
  choice: lumalapa
  rationale: Ang Qal participle ng טרף ay naglalarawan sa marahas na pagpunit o paglapang ginagawa ng mandaragit. Ang “lumalapa” ay matingkad at likas para sa leon.
- source_word: וְשֹׁאֵג
  choice: at umuungal
  rationale: Ang שׁאג ang karaniwang pandiwa para sa malakas na ungol o roar ng leon; tuwiran at natural ang “umuungal.”
