  source_fidelity: Tumpak ang pangunahing larawan at ang pandiwang “umuungal.” Gayunman, ang isahang “kanilang bibig” ay hindi likas kapag maraming taong tinutukoy sa Filipino at maaaring magpahiwatig ng iisang bibig na magkakasalo sila. Mas tapat sa kahulugan at mas idiomatiko ang “kanilang mga bibig.” Ang “lumalapa” ay katanggap-tanggap na matingkad na pagsasalin ng predatoryong pagpunit/panlalapa ng טֹרֵף.
  naturalness: Mas natural sa makabagong Filipino ang “kanilang mga bibig.” Ang kuwit bago ang paghahambing ay nakatutulong na linawin na ang “lumalapa at umuungal” ay paglalarawan sa leon.
  terminology: Ang “leon,” “laban sa akin,” “lumalapa,” at “umuungal” ay angkop sa marangal ngunit malinaw na rehistrong patula. Walang usaping teolohikal na nangangailangan ng pagbabago.
