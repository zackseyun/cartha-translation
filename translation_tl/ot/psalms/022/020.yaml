  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: tl
  text: Iligtas mo ang buhay ko[a] mula sa tabak, at ang nag-iisa kong buhay[c] mula sa kapangyarihan[b] ng aso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kaluluwa ko” o “ang sarili ko.” Saklaw ng Hebreong נֶפֶשׁ ang buhay, sarili, o kaluluwa ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa kamay ng aso.” Ang “kamay” dito ay idyoma para sa kapangyarihan o kontrol.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang kaisa-isa ko” o “ang mahalaga kong buhay.” Ang Hebreong יְחִידָתִי ay literal na “aking kaisa-isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: Iligtas mo
  rationale: Ang pautos na anyo ng נצל ay isang tuwirang pagsusumamo para sa agarang pagsagip; natural at marangal sa makabagong Tagalog ang “Iligtas mo.”
- source_word: מֵחֶרֶב
  choice: mula sa tabak
  rationale: Ipinahihiwatig ng מן ang paglayo o pagliligtas mula sa nakamamatay na banta. Pinananatili ng “tabak” ang kongkretong larawan ng Hebreo.
- source_word: נַפְשִׁי
  choice: ang buhay ko
  rationale: Sa konteksto ng panganib na mamatay, ang נפש ay tumutukoy sa buhay o buong sarili, hindi kinakailangang sa hiwalay na di-materyal na kaluluwa.
- source_word: מִיַּד
  choice: mula sa kapangyarihan
  rationale: Ang literal na “mula sa kamay” ay isang idyoma para sa pagiging nasa kapangyarihan o kontrol ng iba. Malinaw na naihahatid ng “kapangyarihan” ang diwang ito sa modernong Tagalog.
- source_word: כֶּלֶב
  choice: ng aso
  rationale: Isahan ang pangngalang Hebreo. Pinananatili ang matingkad na larawan nang hindi tahasang ipinapakahulugan kung sinong kaaway ang tinutukoy.
- source_word: יְחִידָתִי
  choice: ang kaisa-isa kong buhay
  rationale: Literal itong tumutukoy sa “aking kaisa-isa.” Dahil kapantay ito ng נַפְשִׁי, nililinaw ng “buhay” ang tinutukoy habang pinananatili ng “kaisa-isa” ang diwa ng pagiging nag-iisa at walang kapalit.
theological_decisions:
- issue: Antropolohikal na kahulugan ng נַפְשִׁי sa panaghoy
  choice: “ang buhay ko”
  alternative: “ang kaluluwa ko”
  rationale: Ang talata ay pagsusumamo laban sa nakamamatay na panganib, kaya ang “buhay” ang pinakanatural na kahulugan. Iniiwasan nitong magpasok ng teknikal na paghihiwalay ng katawan at kaluluwa na hindi hinihingi ng konteksto.
- issue: Kahulugan ng יְחִידָתִי
  choice: “ang kaisa-isa kong buhay”
  alternative: “ang kaisa-isa ko” o “ang mahalaga kong buhay”
  rationale: Pinananatili ng salin ang literal na diwa ng pagiging kaisa-isa at ipinakikitang kapantay ito ng “buhay ko.” Hindi idinaragdag bilang pangunahing salin ang pagpapahalagang ipinahihiwatig ng “mahalaga.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinananatili ang paralelismo at kongkretong mga larawan ng “tabak” at “aso,” habang ipinapaliwanag sa mga talababa ang mga tunay na alternatibong leksikal.
