  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: tl
  text: 'Para sa tagapanguna ng mga mang-aawit: ayon sa “Usang Babae ng Bukang-Liwayway.”[a] Awit ni David.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Babaeng Usa ng Bukang-Liwayway.” Malamang na pangalan ito ng isang himig o kaayusang pangmusika.
    reason: lexical_alternative
  - marker: b
    text: Ang “ni David” ay maaaring magpahiwatig ng pag-akda, kaugnayan, pagkalakip sa isang koleksiyon, o paghahandog; hindi ito higit na nililinaw ng Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Sa mga pamagat ng Awit, tumutukoy ito sa taong nangunguna sa pagtatanghal ng musika. Malinaw at likas sa modernong Tagalog ang pariralang ito nang hindi nililimitahan ang tungkulin sa makabagong konsepto ng direktor.
- source_word: עַל
  choice: ayon sa
  rationale: Sa ganitong pamagat na pangmusika, maaari itong magpakilala ng himig, estilo, o tagubilin sa pag-awit. Pinananatili ng “ayon sa” ang lawak ng kahulugan nang hindi tahasang ipinapalagay na “sa himig ng.”
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: Usang Babae sa Bukang-Liwayway
  rationale: Ang אַיֶּלֶת ay pambabaeng usa, at malamang na ang buong parirala ay pangalan ng isang himig o kaayusang pangmusika. Ang panipi at malalaking titik ay nagpapakitang pamagat ito.
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Tumutukoy ito sa isang awit o salmong karaniwang may saliw na musika. “Awit” ang malinaw, marangal, at nakaugaliang salin sa kontekstong ito.
- source_word: לְדָוִד
  choice: ni David
  rationale: Karaniwang paraan ito sa Tagalog upang ipahayag ang kaugnayan kay David. Bagaman maaari itong natural na maunawaang pag-akda, ipinapaliwanag ng talababa na mas malawak ang saklaw ng Hebreong parirala.
theological_decisions:
- issue: Kahulugan ng אַיֶּלֶת הַשַּׁחַר sa pamagat
  choice: Ituring na malamang na pamagat ng himig o kaayusang pangmusika
  alternative: Ituring na sagisag o tematikong pamagat na tuwirang kaugnay ng nilalaman ng awit
  rationale: Sa balangkas ng mga pamagat ng Awit, ang pariralang ipinakilala ng עַל ay pinakanatural na tagubiling pangmusika. Hindi isinasara ng salin at talababa ang ibang posibilidad.
- issue: Saklaw ng לְדָוִד
  choice: Isalin bilang “ni David,” na may talababa tungkol sa malawak na ugnayan
  alternative: “isinulat ni David,” “para kay David,” o “ukol kay David”
  rationale: Hindi tiyak na itinatakda ng Hebreong לְ ang uri ng kaugnayan. Iniiwasan ng salin at talababa ang tahasang paglilimita nito sa pag-akda lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “bukang-liwayway” bilang likas at masining na katumbas ng שׁחר, at ang mga panipi upang kilalaning malamang na pamagat ang pariralang pangmusika. Ang mga panandang [a] at [b] ay ikinabit mismo sa mga pariralang ipinaliliwanag.
