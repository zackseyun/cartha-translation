id: PSA.22.16
reference: Psalms 22:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: tl
  text: Sapagkat pinalibutan ako ng mga aso; kinubkob ako ng pangkat ng mga gumagawa ng masama; gaya ng leon ang aking mga kamay at mga paa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang sinaunang saksi, kabilang ang isang manuskrito mula sa Dead Sea Scrolls at ang Septuagint, ang pagbasa ay maaaring isalin na “tinusok nila ang aking mga kamay at mga paa” o “binutas nila ang aking mga kamay at mga paa,” sa halip na ang mahirap na pagbasa ng Masoretic Text na “gaya ng leon ang aking mga kamay at mga paa.”
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapahayag nito ang dahilan o batayan ng panaghoy at pinananatili ang paliwanag na ugnayan sa naunang taludtod.
- source_word: סְבָבוּנִי
  choice: pinalibutan ako
  rationale: Tuwirang ipinapahayag ang pagkubkob mula sa lahat ng panig at natural sa makabagong Tagalog.
- source_word: כְּלָבִים
  choice: mga aso
  rationale: Pinananatili ang literal at mapanlait na larawan para sa mga kaaway sa halip na ipaliwanag ito sa salin.
- source_word: עֲדַת מְרֵעִים
  choice: pangkat ng mga gumagawa ng masama
  rationale: Ang עֲדָה ay isang nagkakatipong pangkat, at ang מְרֵעִים ay mga taong gumagawa ng masama; malinaw ito sa karaniwang mambabasa nang hindi nagpapasok ng dagdag na pakahulugan.
- source_word: הִקִּיפוּנִי
  choice: kinubkob ako
  rationale: Ipinahihiwatig ang pagpalibot o pagsara sa isang tao at gumagamit ng ibang pandiwa upang mapanatili ang paralelismo nang hindi inuulit lamang ang naunang parirala.
- source_word: כָּאֲרִי
  choice: gaya ng leon
  rationale: Sinusunod ng pangunahing teksto ang mahirap ngunit umiiral na pagbasa ng Masoretic Text, כָּאֲרִי, sa halip na tahimik na palitan ito ng tekstuwal na variant.
- source_word: יָדַי וְרַגְלָי
  choice: ang aking mga kamay at mga paa
  rationale: Tuwirang salin ng mga bahagi ng katawan at pinananatili hangga't maaari ang di-karaniwang pariralang walang hayag na pandiwa.
theological_decisions:
- issue: Pinagtatalunang pagbasa ng כָּאֲרִי kumpara sa sinaunang variant na karaniwang isinasaling “tinusok”
  choice: 'Sa pangunahing teksto: “gaya ng leon ang aking mga kamay at mga paa”'
  alternative: “tinusok nila ang aking mga kamay at mga paa” o “binutas nila ang aking mga kamay at mga paa”
  rationale: Binibigyang-priyoridad ang nakasulat na Masoretic reading kahit mahirap ang sintaks nito. Gayunman, mahalaga at sinauna ang ibang pagbasa, kaya malinaw itong inilalahad sa talababa nang hindi ginagamit ang salin upang lutasin ang usaping tekstuwal o teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang matitinding larawang “mga aso” at “leon,” gayundin ang sadyang mahirap at malabong sintaks ng huling parirala. Gumamit lamang ng isang talababa upang iugnay nang malinaw ang tekstuwal na variant sa bahaging tinutukoy nito.
