  text: כַּ/מַּ֥יִם נִשְׁפַּכְתִּי֮ וְ/הִתְפָּֽרְד֗וּ כָּֽל עַצְמ֫וֹתָ֥/י הָיָ֣ה לִ֭בִּ/י כַּ/דּוֹנָ֑ג נָ֝מֵ֗ס בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: tl
  text: 'Gaya ng tubig, ako’y ibinuhos,

    at nagkahiwa-hiwalay ang lahat ng aking mga buto.

    Ang puso ko’y naging parang pagkit;

    natunaw ito sa kaibuturan ko.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sa gitna ng aking mga laman-loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: Gaya ng tubig
  rationale: Pinananatili ang tahasang paghahambing na ipinahihiwatig ng prefiks na כ, sa natural na makabagong Tagalog.
- source_word: נִשְׁפַּכְתִּי
  choice: ako’y ibinuhos
  rationale: Ang Niphal ng שׁפך ay naglalarawan sa nagsasalita bilang ibinuhos o lubusang naubos; pinananatili ng anyong ito ang matingkad na larawang patula.
- source_word: וְהִתְפָּרְדוּ
  choice: nagkahiwa-hiwalay
  rationale: Ipinahahayag ng Hitpael ng פרד ang pagkakahiwalay o pagkakawatak; ang pagpiling ito ay malapit sa Hebreo at hindi nililimitahan ang larawan sa teknikal na pagkalinsad ng mga kasukasuan.
- source_word: כָּל עַצְמוֹתַי
  choice: ang lahat ng aking mga buto
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng כָּל at ang kongkretong larawang pangkatawan ng עֲצָמוֹת.
- source_word: הָיָה לִבִּי
  choice: Ang puso ko’y naging
  rationale: Ipinakikita ng 'naging' ang pagpasok sa isang bagong kalagayan, sa halip na simpleng sabihing nasa gayong kalagayan lamang ang puso.
- source_word: כַּדּוֹנָג
  choice: parang pagkit
  rationale: Ang דּוֹנָג ay pagkit; tuwirang pinananatili ang simile at likas itong nauugnay sa kasunod na pagkatunaw.
- source_word: נָמֵס
  choice: natunaw ito
  rationale: Ang מסס ay nangangahulugang matunaw o malusaw; 'natunaw' ang pinakanatural sa larawan ng pagkit.
- source_word: בְּתוֹךְ מֵעָי
  choice: sa kaibuturan ko
  rationale: Natural at marangal na naihahatid ng 'kaibuturan' ang panloob at masidhing larawang tinutukoy ng מֵעִים, habang inilalagay sa talababa ang mas literal na katawagang pangkatawan.
theological_decisions:
- issue: Pangkatawang paglalarawan ng matinding paghihirap sa kalooban
  choice: sa kaibuturan ko
  alternative: sa gitna ng aking mga laman-loob
  rationale: Ang Hebreo ay gumagamit ng visceral na katawagan, hindi ng abstraktong kategoryang espirituwal. Natural ang pangunahing salin ngunit pinananatili sa talababa ang mas literal na larawang pangkatawan upang hindi ito labis na gawing espirituwal.
translation_notes:
  register: Makabagong Filipino Tagalog na patula, marangal, at madaling maunawaan. Pinanatili ang mga kongkretong larawan ng tubig, mga buto, puso, at pagkit, pati ang parallelismo ng taludtod. Ginamit ang “pagkit” sa halip na hiram na “wax,” at “kaibuturan” sa pangunahing teksto upang maging natural nang hindi binubura ang pisikal na puwersa ng Hebreo.
