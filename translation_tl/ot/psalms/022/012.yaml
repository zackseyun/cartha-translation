  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: tl
  text: 'Maraming toro ang pumalibot sa akin[a];

    kinubkob ako ng malalakas na toro ng Basan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Basan ay isang rehiyon sa silangan ng Jordan na kilala sa matitibay at matatabang baka; inilalarawan ng parirala ang makapangyarihan at nagbabantang mga kalaban.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: pumalibot sa akin
  rationale: Ang pandiwang סבב ay nangangahulugang pumalibot o sumaklaw sa paligid. Ipinahihiwatig ng anyong ganap na ang nagsasalita ay napalibutan na, kaya ang “pumalibot sa akin” ay tumpak at natural.
- source_word: פָּרִים רַבִּים
  choice: maraming toro
  rationale: Ang פָּרִים ay mga toro, at ang רַבִּים ay “marami.” Pinananatili ng tuwirang salin ang matingkad na larawang-hayop ng Hebreo.
- source_word: אַבִּירֵי בָשָׁן
  choice: malalakas na toro ng Basan
  rationale: Ang אַבִּירֵי ay tumutukoy sa malalakas o makapangyarihang nilalang. Dahil kahanay at kauri ito ng naunang “mga toro,” nilinaw ang ipinagpapatuloy na larawang bovino nang hindi ginagawang tahasang “mga kaaway.”
- source_word: כִּתְּרוּנִי
  choice: kinukuyog ako
  rationale: Ang כתר dito ay “pumalibot” o “kumubkob.” Ang “kinukuyog ako” ay natural na Filipino para sa sabay-sabay na paglapit at pagpaligid ng nagbabantang pangkat, habang iniiwasan ang matigas na pag-uulit ng “pumalibot.”
- source_word: בָשָׁן
  choice: Basan
  rationale: Pangalan ito ng lugar, kaya isinalin sa karaniwang anyong Filipino na “Basan.”
theological_decisions:
- issue: Ang mga torong larawan ng mapanganib na mga kalaban
  choice: Pinanatili ang metapora bilang “mga toro.”
  alternative: Tahasang isalin bilang “mga kaaway” o “mga makapangyarihang kaaway.”
  rationale: Mga toro mismo ang larawang ginamit ng Hebreo. Ang pagpapanatili nito ay nag-iingat sa lakas ng tula at hindi agad nilulutas para sa mambabasa kung sino ang inilalarawan.
- issue: Pagkakakilanlan ng “malalakas” sa ikalawang linya
  choice: “malalakas na toro ng Basan”
  alternative: “mga makapangyarihan ng Basan”
  rationale: Maaaring mangahulugan ang אַבִּירֵי ng “malalakas” o “makapangyarihan,” ngunit ang pagkakahanay nito sa פָּרִים ay malakas na nagpapatuloy sa larawan ng mga toro. Pinananatili rin ang “malalakas” sa halip na magdagdag ng interpretasyong panrelihiyon o pampolitika.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Pinili ang “pumalibot” para sa unang linya at “kinukuyog” para sa ikalawa upang mapanatili ang paralelismo nang hindi paulit-ulit ang salita. Nasa pangunahing teksto ang marker na [a].
