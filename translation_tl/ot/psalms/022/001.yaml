  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: tl
  text: Diyos ko, Diyos ko, bakit mo ako pinabayaan? Malayo sa aking pagsagip ang mga salita ng aking pag-ungal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Bakit napakalayo mo sa pagsagip sa akin, sa mga salita ng aking pag-ungal?” Siksik ang pagkakabuo ng Hebreo, kaya maaaring unawain ang huling bahagi bilang pagpapatuloy ng tanong sa Diyos. Ang “pagsagip” ay maaari ring isaling “kaligtasan” o “tulong.”'
    reason: syntactic_and_lexical_alternative
  - marker: b
    text: O “aking pagdaing” o “aking sigaw.” Literal na gumagamit ang Hebreo ng larawan ng “pag-ungal” upang ipahayag ang matinding paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: Diyos ko, Diyos ko
  rationale: Pinananatili ang tuwirang pagtawag, ang panandang paari, at ang pag-uulit na nagpapahayag ng matinding dalamhati.
- source_word: לָמָה
  choice: bakit
  rationale: Ito ang natural at tuwirang katumbas sa makabagong Tagalog ng tanong tungkol sa dahilan.
- source_word: עֲזַבְתָּנִי
  choice: pinabayaan mo ako
  rationale: Ang pandiwa ay maaaring mangahulugang iwan, pabayaan, o talikuran. Ang “pinabayaan” ay natural sa Tagalog at nagpapanatili sa bigat ng panaghoy nang hindi nagpapasok ng dagdag na paliwanag.
- source_word: רָחוֹק
  choice: Malayo sa
  rationale: Tuwirang pinananatili ang larawan ng pagkakalayo at ang maigsi, siksik na anyo ng Hebreo.
- source_word: מִישׁוּעָתִי
  choice: pagliligtas sa akin
  rationale: Sa konteksto ng panaghoy, tumutukoy ito sa aktuwal na pagsagip o pagliligtas. Iniiwasan nitong paliitin ang kahulugan tungo lamang sa isang doktrinal na gamit ng “kaligtasan.”
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa “mga salita,” kahit siksik at di-karaniwan ang buong parirala.
- source_word: שַׁאֲגָתִי
  choice: aking pag-ungal
  rationale: Ang salitang Hebreo ay pangunahing larawan ng malakas na pag-ungal, gaya ng sa hayop, at dito'y nagpapahiwatig ng matinding sigaw ng paghihirap. Pinananatili ng “pag-ungal” ang matingkad na talinghaga.
theological_decisions:
- issue: Kahulugan ng יְשׁוּעָה sa isang salmong may mahalagang gamit sa Bagong Tipan
  choice: pagliligtas sa akin
  alternative: aking kaligtasan; pagtulong sa akin
  rationale: Ang agarang konteksto ay isang panawagan para sa pagsagip. Pinananatili ng salin ang kongkretong diwa nang hindi ikinakaila ang mas malawak na kahulugang “kaligtasan,” na itinatala sa talababa.
- issue: Ugnayang sintaktiko ng ikalawang hati ng talata
  choice: Malayo sa pagliligtas sa akin ang mga salita ng aking pag-ungal
  alternative: Bakit napakalayo mo sa pagliligtas sa akin, sa mga salita ng aking pag-ungal?
  rationale: Siksik ang Hebreo at walang tahasang pandiwa o ikalawang “bakit” sa huling hati. Pinananatili ng pangunahing salin ang nakikitang ayos at teolohikal na tensiyon; inilalagay sa talababa ang lehitimong pagbasa na nagpapatuloy sa tanong sa Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pamilyar at mariing “Diyos ko, Diyos ko,” gayundin ang matingkad na “pag-ungal.” Bahagyang di-karaniwan ang ikalawang pangungusap dahil sinisikap nitong ingatan ang siksik at tunay na malabong sintaks ng Hebreo; nililinaw ng talababa ang pangunahing alternatibong pagbasa.
