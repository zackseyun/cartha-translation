  text: Mabibilang ko ang lahat ng aking mga buto[a]; nakatingin sila, nakatitig sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Binibilang ko ang lahat ng aking mga buto.” Ang pandiwang Hebreo ay maaaring mangahulugang “bilangin” o “isalaysay,” ngunit dahil “lahat ng aking mga buto” ang layon, mas malamang na ang diwa ay pagbibilang sa mga ito isa-isa.
    reason: lexical_alternative
  - marker: b
    text: 'Magkatambal para sa pagdiin ang dalawang pandiwang Hebreo tungkol sa pagtingin: “nakatingin sila, nakatitig sa akin,” o mas literal, “tumitingin sila, nakikita nila ako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: Mabibilang ko
  rationale: Ang piel ng ספר ay maaaring mangahulugang ‘bilangin’ o ‘isalaysay.’ Dahil ‘lahat ng aking mga buto’ ang layon, mas angkop dito ang kakayahang bilangin ang mga ito isa-isa; natural ding ipinahihiwatig ng ‘Mabibilang ko’ ang matinding pangangayayat o pagkakalantad ng katawan.
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng Hebreo.
- source_word: עַצְמוֹתָי
  choice: aking mga buto
  rationale: Pinananatili ang kongkreto at matingkad na larawang pisikal ng Hebreo nang walang dagdag na pagpapakahulugan.
- source_word: הֵמָּה
  choice: sila
  rationale: Ang tahasang panghalip ay tumutukoy nang may diin sa mga nanonood; natural sa Tagalog ang ‘sila’ bilang simuno ng dalawang pandiwa.
- source_word: יַבִּיטוּ
  choice: nakatingin
  rationale: Ipinahihiwatig ng pandiwa ang maingat o matamang pagtingin. Ang ‘nakatingin’ ay natural at hinahayaan ang kasunod na ‘nakatingitig’ na magbigay ng pagdiin.
- source_word: יִרְאוּ
  choice: nak titig
  rationale: Pinili ang diwang ‘nak titig’ upang maipakita ang masinsin at matagal na pagtinging nalilikha ng magkatambal na pandiwa, sa halip na ang mahinang ‘nakakakita.’
- source_word: בִי
  choice: sa akin
  rationale: Ito ang natural na Tagalog na layon ng ‘nakatingin’ at ‘nak titig,’ at pinananatili nitong ang nagsasalita ang sentro ng kanilang pagmasid.
theological_decisions:
- issue: Mesiyanikong paggamit sa tradisyong Kristiyano
  choice: Isinalin ayon sa Hebreong larawang patula ng paghihirap ng katawan at ng mga taong mapanuring nakamasid.
  alternative: Palalimin sa pangunahing teksto ang mga salitang tuwirang nagpapahiwatig ng pagpapako sa krus.
  rationale: Mahalaga ang Awit 22 sa Kristiyanong pagbasa, ngunit ang talatang ito mismo ay hindi dapat dagdagan ng bokabularyong wala sa Hebreo. Hinahayaan nitong lumitaw mula sa mas malawak na konteksto ang mga kanonikal at kristolohikal na kaugnayan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at matingkad na paralelismo ng tulang Hebreo. Ginamit ang ‘Mabibilang ko’ sa halip na ang mas mekanikal na ‘Binibilang ko’ sa pangunahing teksto upang maipahayag ang idiomatikong puwersa, habang inilagay sa talababa ang alternatibo.
