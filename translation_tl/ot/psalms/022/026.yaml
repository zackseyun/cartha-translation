  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: tl
  text: Ang mga api[a] ay kakain at mabubusog[c]; ang mga humahanap sa kanya ay pupuri kay Yahweh. Nawa’y mabuhay magpakailanman ang inyong puso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga mapagpakumbaba,” “mga dukha,” o “mga maamo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang “puso” ngunit maramihan ang mga taong kinakausap; malamang na kolektibong tumutukoy ito sa panloob na buhay ng buong sambayanan.
    reason: lexical_alternative
  - marker: c
    text: Sa konteksto ng awit, maaaring nagpapahiwatig ang pagkain ng isang piging kaugnay ng handog o panata, bagaman hindi ito tahasang sinabi sa talatang ito.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  choice: mga api
  rationale: Saklaw ng salita ang mga mapagpakumbaba, dukha, maamo, o pinahihirapan. Sa konteksto ng pagdurusa at pagliligtas sa awit, malinaw na ipinahahayag ng “mga api” ang mga ibinaba o pinahirapan nang hindi nililimitahan ang salita sa isang katangian lamang.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: kakain at mabubusog
  rationale: Pinananatili nito ang konkretong larawan ng pagkain at ganap na pagkabusog, at likas itong pakinggan sa modernong Tagalog.
- source_word: יְהַלְלוּ
  choice: pupuri
  rationale: Tuwirang salin ng kilos ng pagpupuri at angkop ang anyong panghinaharap sa daloy ng talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: דֹּרְשָׁיו
  choice: mga humahanap sa kanya
  rationale: Natural na Tagalog ito para sa patuloy na paghanap at paglapit sa Diyos; malinaw na si Yahweh ang tinutukoy ng panghalip.
- source_word: יְחִי
  choice: Mabuhay nawa
  rationale: Ipinapahayag nito ang jussive na diwa bilang basbas o hangarin, hindi bilang payak na pahayag tungkol sa hinaharap.
- source_word: לְבַבְכֶם
  choice: ang inyong puso
  rationale: Ang hulapi ay tumutukoy sa maramihang kausap, samantalang isahan ang “puso.” Pinananatili ng salin ang kolektibong isahan at ang malawak na diwa ng panloob na buhay.
- source_word: לָעַד
  choice: magpakailanman
  rationale: Karaniwan, marangal, at malinaw na salin para sa walang hanggang tagal.
theological_decisions:
- issue: Paglipat sa tuwirang pakikipag-usap sa huling sugnay
  choice: Mabuhay nawa magpakailanman ang inyong puso
  alternative: Mabuhay nawa magpakailanman ang inyong mga puso; Mabubuhay magpakailanman ang kanilang puso
  rationale: Ang Hebreo ay may panghalip na para sa maramihang kausap ngunit isahan ang “puso,” malamang bilang kolektibong isahan. Pinananatili rin ang anyong basbas at ang tuwirang pakikipag-usap sa sambayanang sumasamba.
- issue: Uri ng pagkain
  choice: kakain at mabubusog
  alternative: kakain sa handog na piging at mabubusog
  rationale: Maaaring tumukoy ang konteksto sa isang piging kaugnay ng handog o panata, ngunit hindi ito tahasang sinasabi ng mismong talata; kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga api” bilang madaling maunawaang salitang may panlipunan at karanasang bigat; pinanatili ang “Yahweh” bilang pangalan ng Diyos at ang kolektibong isahang “inyong puso” upang sundan ang anyo at tensiyon ng Hebreo.
