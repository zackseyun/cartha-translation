  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: tl
  text: 'Ang papuri ko sa malaking kapulungan ay nagmumula sa iyo;

    tutuparin ko ang aking mga panata sa harap ng mga may takot sa kanya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga may takot sa kanya.” Ginagawang “mga may takot sa iyo” ng ilang salin upang iayon sa naunang tuwirang pagtawag sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: Sa iyo nagmumula
  rationale: 'Ipinahahayag ng pariralang Hebreo ang pinagmulan: mula sa Diyos ang papuri ng salmista. Likas sa modernong Tagalog ang “nagmumula” at hindi nito ginagawang sanhi lamang ang Diyos.'
- source_word: תְהִלָּתִי
  choice: ang papuri ko
  rationale: Tuwirang ipinapahayag ang papuri o pagpupuri nang hindi nagdaragdag ng di-tiyak na ideya ng awit o handog.
- source_word: בְּקָהָל רָב
  choice: sa malaking kapulungan
  rationale: Ang קָהָל ay nagkakatipong pamayanan o kongregasyon, at ang רָב ay tumutukoy sa laki o lawak nito. Ang “kapulungan” ay marangal at malinaw sa konteksto ng sama-samang pagsamba.
- source_word: נְדָרַי
  choice: ang aking mga panata
  rationale: Pinananatili ang tahasang pangmaramihang anyo at ang diwa ng mga pangakong ginawa sa Diyos.
- source_word: אֲשַׁלֵּם
  choice: tutuparin ko
  rationale: Kapag panata ang layon, ang piel ng שׁלם ay nangangahulugang bayaran o ganapin ang ipinangako. Mas natural sa Tagalog ang “tuparin ang panata” kaysa “bayaran ang panata.”
- source_word: נֶגֶד
  choice: sa harap ng
  rationale: Ipinahahayag nito na gagawin ang pagtupad sa panata sa presensya at paningin ng mga naroon.
- source_word: יְרֵאָיו
  choice: mga may takot sa kanya
  rationale: Pinananatili ng “may takot” ang Hebreong wika ng mapitagang pagkatakot sa Diyos, sa halip na paliitin ito sa paggalang lamang. Pinananatili rin ang ikatlong panauhang hulapi na “kanya.”
theological_decisions:
- issue: Paglipat mula sa ikalawang panauhan sa מֵאִתְּךָ (“sa iyo”) tungo sa ikatlong panauhan sa יְרֵאָיו (“sa kanya”)
  choice: 'Pinanatili ang Masoretikong paglipat: “Sa iyo … mga may takot sa kanya.”'
  alternative: 'Ipantay sa ikalawang panauhan: “mga may takot sa iyo.”'
  rationale: Tahasan ang paglipat ng panauhan sa tekstong Hebreo. Hindi ito pinakinis upang mapanatili ang tunay na anyo at tensiyon ng pinagmulan; malinaw pa rin sa konteksto na Diyos ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” at “panata” bilang pamilyar na pananalitang panrelihiyon; iniwasan ang labis na arkaikong ayos. Inilagay ang [a] kaagad pagkatapos ng “kanya” upang malinaw ang tinutukoy ng talababa.
