  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: tl
  text: Ang mga salita ng kanyang bibig ay kasamaan at panlilinlang; tumigil na siyang kumilos nang may karunungan[a] at gumawa ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tumigil na siyang maging marunong sa paggawa ng mabuti.” Maaaring unawain ang dalawang pawatas sa Hebreo bilang dalawang magkahanay na kaganapan ng “tumigil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: Ang mga salita ng kanyang bibig
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang pangmaramihang דִּבְרֵי sa likas at marangal na Tagalog.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa pagkakaparis nito sa מִרְמָה at bilang paglalarawan sa pananalita, nangingibabaw ang moral na diwa ng masama o tiwali.
- source_word: וּמִרְמָה
  choice: at panlilinlang
  rationale: Malinaw na ipinahahayag ang pandaraya o mapanlinlang na katangian ng kanyang mga salita.
- source_word: חָדַל
  choice: tumigil na siya
  rationale: Ipinakikita ng Qal perfect ang pagtigil o pagtalikod sa isang inaasahang gawain.
- source_word: לְהַשְׂכִּיל
  choice: kumilos nang may karunungan
  rationale: Ang Hiphil ng שכל ay maaaring tumukoy sa pagkakaroon ng unawa o sa matalinong pagkilos; ang pariralang ito ay nagpapanatili sa praktikal na diwa.
- source_word: לְהֵיטִיב
  choice: gumawa ng mabuti
  rationale: Tuwirang inilalarawan ang paggawa ng mabuti o pagkilos nang maayos na ipinahihiwatig ng Hiphil infinitive ng יטב.
theological_decisions:
- issue: Ugnayan ng dalawang infinitive na לְהַשְׂכִּיל at לְהֵיטִיב
  choice: 'Dalawang magkahanay na kaganapan ng ‘tumigil’: ‘kumilos nang may karunungan … at gumawa ng mabuti’'
  alternative: ‘tumigil na siyang maging marunong sa paggawa ng mabuti’
  rationale: Maaaring unawain ang mga infinitive bilang dalawang magkahanay na kilos o bilang mas mahigpit na magkaugnay. Inilalahad sa teksto ang unang pagbasa at pinananatili sa talababa ang tunay na sintaktikong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang konkretong ‘bibig’ at iniwasan ang labis na pagpapakahulugan sa ugnayan ng dalawang huling pawatas.
