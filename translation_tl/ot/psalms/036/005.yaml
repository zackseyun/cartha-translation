  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: tl
  text: Yahweh, ang iyong tapat na pag-ibig ay nasa kalangitan[a]; ang iyong katapatan ay umaabot hanggang sa mga ulap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “umaabot hanggang sa kalangitan ang iyong tapat na pag-ibig”; maaaring lawak, sa halip na kinaroroonan lamang, ang ipinahahayag ng Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalan sa paraang malinaw at likas sa makabagong Filipino; ang kuwit ay naghahayag ng tuwirang pagtawag.
- source_word: בְּהַשָּׁמַיִם
  choice: ay nasa kalangitan
  rationale: Pinananatili ang pinakalikas na lokatibong diwa ng בְּ, habang ang “kalangitan” ay angkop sa marangal at makatang rehistro ng salmo. Idinagdag ang “ay” upang mabuo ang likas na sugnay sa Filipino.
- source_word: חַסְדֶּךָ
  choice: ang iyong tapat na pag-ibig
  rationale: Ipinahahayag nito ang matatag at maaasahang pag-ibig na tinutukoy ng חֶסֶד nang hindi nililimitahan ang salita sa isang makitid na teknikal o denominasyonal na kahulugan.
- source_word: אֱמוּנָתְךָ
  choice: ang iyong katapatan
  rationale: Sa pagkakaparis nito sa חֶסֶד, tumutukoy ang אֱמוּנָה sa pagiging maaasahan at tapat; “katapatan” ang malinaw at natural na katumbas sa Filipino.
- source_word: עַד
  choice: umaabot hanggang sa
  rationale: Ginagawang hayag ang diwa ng lawak o abot sa natural na Filipino, gaya ng hinihingi ng ikalawang hati ng taludtod.
- source_word: שְׁחָקִים
  choice: mga ulap
  rationale: Pinananatili ang kongkretong makatang larawan ng matataas na ulap at ang pagkakaparis nito sa “kalangitan.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Lokatibo o panukat ng lawak ang בְּהַשָּׁמַיִם
  choice: nasa kalangitan
  alternative: umaabot hanggang sa kalangitan
  rationale: Ang בְּ ay pinakalikas na basahing lokatibo rito, ngunit maaari ring maunawaan ang linya bilang pagpapahayag ng lawak. Hindi isinasara ang tunay na kalabuan; inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at makatang Filipino na madaling maunawaan. Pinanatili ang paralelismo ng “tapat na pag-ibig” at “katapatan,” gayundin ang matataas na larawang “kalangitan” at “mga ulap.”
