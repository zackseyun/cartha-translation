  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: tl
  text: Ang katuwiran mo ay gaya ng mga bundok ng Diyos[a]; ang mga hatol mo ay isang malawak na kailaliman. Yahweh, inililigtas mo ang tao at ang hayop.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga bundok ng Diyos”; maaari rin itong mangahulugang “makapangyarihang mga bundok” o “pinakamatataas na mga bundok.”
    reason: lexical_alternative
  - marker: b
    text: O “ang sangkatauhan at ang mga hayop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: ang katuwiran mo
  rationale: Pinananatili ng “katuwiran” ang malawak na diwang moral at pangtipan ng salitang Hebreo, nang hindi ito nililimitahan sa katarungang panghukuman.
- source_word: כְּהַרְרֵי אֵל
  choice: gaya ng mga bundok ng Diyos
  rationale: Tuwirang pinananatili ang Hebreong tambalan at ang matayog na larawang patula; ang posibleng superlatibong diwa ay inilagay sa talababa.
- source_word: מִשְׁפָּטֶךָ
  choice: ang mga hatol mo
  rationale: Ipinakikita ng “mga hatol” ang mga pasiya o gawa ng Diyos bilang hukom at pinananatili ang pagkakaiba nito sa “katuwiran.”
- source_word: תְּהוֹם רַבָּה
  choice: napakalalim na kalaliman
  rationale: Likas at patulang Filipino ito na nagpapahiwatig ng di-masukat na lalim nang hindi tinutukoy nang higit sa sinasabi ng Hebreo.
- source_word: אָדָם
  choice: ang tao
  rationale: Sa Filipino, ang “tao” ay likas na panlahatan at maaaring tumukoy sa sangkatauhan habang pinananatili ang tambalang paghahambing sa hayop.
- source_word: וּבְהֵמָה
  choice: at ang hayop
  rationale: Ang “hayop” ay malawak at natural na katumbas sa kontekstong patula; hindi ito nililimitahan sa alagang hayop o mga baka.
- source_word: תוֹשִׁיעַ
  choice: inililigtas mo
  rationale: Saklaw ng “inililigtas” ang pagliligtas, pagpapalaya, at pag-iingat, kaya pinananatili nito ang lawak ng pandiwang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa salin.
- issue: Panlahat na diwa ng אָדָם
  choice: ang tao
  alternative: ang sangkatauhan
  rationale: Likas na panlahat ang “tao” sa Filipino at pinananatili nito ang maikli at patulang pagtutumbas ng tao at hayop; nililinaw sa talababa ang kolektibong diwa.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Pinanatili ang parallelism ng Hebreo, ang konkretong larawan ng mga bundok at kalaliman, at ang personal na pangalang Yahweh. Inilipat ang “Yahweh” sa loob ng huling pangungusap para maging natural ang tuwirang pagtawag sa Filipino nang hindi binabago ang diwa.
