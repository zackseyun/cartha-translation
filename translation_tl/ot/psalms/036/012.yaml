lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: 'Pinananatili ang lokatibong kahulugan ng pang-abay: itinuturo nito ang pinangyarihan ng pagbagsak, hindi pangunahing isang sandali sa panahon.'
- source_word: נָפְלוּ
  choice: bumagsak
  rationale: Likas sa modernong Tagalog at malinaw na naghahayag ng ganap na pagbagsak; hindi kailangang tahasang markahan ang aspektong resulta gaya sa Ingles.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ang mga gumagawa ng kasamaan
  rationale: Pinananatili ang larawan ng Hebreong pariralang 'mga gumagawa ng kasamaan' sa halip na paikliin agad bilang 'masasamang tao.'
- source_word: אָוֶן
  choice: kasamaan
  rationale: Ang moral na diwa ang nangingibabaw sa konteksto, bagaman maaari ring saklawin ng salita ang kabuktutan o kapahamakan.
- source_word: דֹּחוּ
  choice: itinulak silang pabagsak
  rationale: Ipinahahayag ang marahas at sapilitang pagpapabagsak na taglay ng pandiwang Hebreo, sa natural na anyong Tagalog.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: at hindi na sila makabangon
  rationale: Malinaw na tumutukoy sa kawalan ng kakayahang bumangon matapos ibagsak; ipinahihiwatig ng 'na' ang di-mababaligtad na kalagayan sa konteksto.
