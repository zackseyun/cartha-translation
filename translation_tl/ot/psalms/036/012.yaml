  - severity: low
    issue: Ang “na” sa “hindi na sila makabangon” ay dagdag na pagpapalakas.
    rationale: Bagaman maaaring ipahiwatig ng konteksto ang kawalang-pagbangon, ang teksto ay nagsasabing “hindi sila makabangon”; hindi kailangang idagdag ang “na.”
