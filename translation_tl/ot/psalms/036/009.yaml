  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: tl
  text: Sapagkat nasa iyo ang bukal ng buhay;[a] sa iyong liwanag ay nakakakita kami ng liwanag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batis ng buhay” o “pinagmumulan ng buhay.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng iyong liwanag ay nakakakita kami ng liwanag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang pang-ugnay na nagbibigay ng batayan o dahilan sa naunang pahayag.
- source_word: עִמְּךָ
  choice: nasa iyo
  rationale: Likas itong Filipino para sa literal na “kasama/nasa piling mo” kapag ang tinutukoy ay ang kinaroroonan o pinagmumulan ng bukal, nang hindi tahasang ginagawang “ikaw ang pinagmumulan.”
- source_word: מְקוֹר
  choice: bukal
  rationale: Ang salita ay tumutukoy sa bukal o pinagmumulan ng tubig; pinananatili ng “bukal” ang kongkretong larawang patula.
- source_word: חַיִּים
  choice: buhay
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwan itong abstraktong pangngalang nangangahulugang “buhay.”
- source_word: בְּאוֹרְךָ
  choice: sa iyong liwanag
  rationale: Pinananatili ang malawak na gamit ng pang-ukol בְ at ang imaheng patula; maaari rin itong maunawaang instrumental, “sa pamamagitan ng iyong liwanag.”
- source_word: נִרְאֶה
  choice: nakakakita kami
  rationale: Ang imperfect na pandiwa ay nagpapahayag dito ng pangkalahatan o nagpapatuloy na katotohanan; natural itong ipinahahayag sa Filipino sa aspektong kontemplatibo.
- source_word: אוֹר
  choice: liwanag
  rationale: Tuwirang katumbas at inuulit upang mapanatili ang paglalaro at diin ng Hebreong “liwanag … liwanag.”
theological_decisions:
- issue: Metaporikong puwersa ng bukal, buhay, at banal na liwanag
  choice: Panatilihin ang “bukal ng buhay” at “sa iyong liwanag ay nakakakita kami ng liwanag.”
  alternative: “Ikaw ang pinagmumulan ng lahat ng buhay” o “sa pamamagitan ng iyong katotohanan ay nakauunawa kami.”
  rationale: Hindi nililimitahan ng salin ang masaganang larawang teolohikal sa iisang paliwanag gaya ng pisikal na buhay, katotohanan, o pagkaunawa.
- issue: Kahulugan ng pang-ukol בְ sa בְּאוֹרְךָ
  choice: sa iyong liwanag
  alternative: sa pamamagitan ng iyong liwanag
  rationale: Pinananatili ng “sa” ang posibleng diwang saklaw o kalagayan, habang hindi ganap na inaalis ang instrumental na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “nasa iyo” sa halip na mas literal ngunit di-likas na “kasama mo,” at pinanatili ang pag-uulit ng “liwanag” bilang mahalagang katangiang pampanitikan.
