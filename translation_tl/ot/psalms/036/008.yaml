  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: tl
  text: Lubos silang nabubusog sa kasaganaan ng iyong bahay[a], at pinaiinom mo sila mula sa ilog ng iyong mga kaluguran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Umiinom sila hanggang masapatan mula sa kasaganaan ng iyong bahay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kaluguran” ay maaari ding isaling “mga kasiyahan”; maaaring nagpapahiwatig din ang salitang Hebreo ng Eden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: Nagpapakasawa sila
  rationale: Ang Qal imperfect ng רוה ay nagpapahayag ng lubos na pagkabusog o pagkasapat. Ang “nagpapakasawa” ay natural sa makabagong Tagalog at, kasama ng larawan ng pag-inom sa kasunod na sugnay, naipahihiwatig ang pag-inom hanggang masapatan.
- source_word: מִדֶּשֶׁן
  choice: sa kasaganaan
  rationale: Ang דֶּשֶׁן ay literal na “katabaan” at matalinghagang tumutukoy sa kayamanan o saganang biyaya. Ang “kasaganaan” ay malinaw at marangal sa Tagalog nang hindi nawawala ang diwa ng labis na panustos.
- source_word: בֵּיתֶךָ
  choice: ng iyong bahay
  rationale: Pinananatili ang payak na larawang “bahay” sa Hebreo at hindi ito nililimitahan sa templo, sambahayan, o makalangit na tahanan.
- source_word: וְנַחַל
  choice: at ... mula sa ilog
  rationale: Maaaring tumukoy ang נחל sa batis, ilog, o agusang-tubig. Sa tulang larawan ng saganang panustos ng Diyos, malinaw na naihahatid ng “ilog” ang buo at nagbibigay-buhay na agos.
- source_word: עֲדָנֶיךָ
  choice: iyong mga kaluguran
  rationale: Ang עֲדָנִים ay tumutukoy sa mga kaluguran, kasiyahan, o karangyaan. Pinananatili ng “mga kaluguran” ang pangmaramihang anyo at ang kaugnayan nito sa ligaya; ang posibleng alingawngaw ng Eden ay inilagay sa talababa.
- source_word: תַשְׁקֵם
  choice: pinaiinom mo sila
  rationale: Ang Hiphil ng שקה ay nangangahulugang “pinaiinom” o “binibigyan ng maiinom.” Pinananatili ng salin ang tahasang pagkilos ng Diyos bilang siyang nagbibigay ng inumin.
theological_decisions:
- issue: Larawan ng “bahay” ng Diyos
  choice: iyong bahay
  alternative: iyong templo / iyong sambahayan / iyong tahanan
  rationale: Hindi tahasang nililinaw ng Hebreo kung templo, sambahayan, o makalangit na tahanan ang tinutukoy. Pinananatili ng salin ang maluwag na tulang larawan at ang teolohikal na tensiyon nito.
- issue: Posibleng alingawngaw ng Eden sa עֲדָנֶיךָ
  choice: iyong mga kaluguran, na may talababa tungkol sa Eden
  alternative: iyong mala-Eden na mga kaluguran
  rationale: Tunay ang leksikal na kaugnayan sa ugat na עדן, ngunit hindi sapat ang teksto upang gawing tahasang “Eden” ang pangunahing salin.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinananatili ang magkakaugnay na larawan ng saganang pagkain at pag-inom, gayundin ang hindi tiyak na saklaw ng “bahay” at ang posibleng pahiwatig sa Eden.
