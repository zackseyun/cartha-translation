base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: tl
  text: Para sa tagapangasiwa ng musika.[a] Nauukol kay David, na lingkod ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Para sa tagapangasiwa ng awitan” o “Para sa pinuno.” Ang salitang Hebreo ay tumutukoy sa namumuno o nangangasiwa sa musika sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: O “Ni David.” Maaari ring ayusin ayon sa pagkakasunod ng Hebreo bilang “Nauukol sa lingkod ni Yahweh, si David.” Maaaring magpahiwatig ang pang-ukol na Hebreo ng pagkakatha, pag-uukol, o mas malawak na kaugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Ang katawagan sa mga pamagat ng Awit ay tumutukoy sa pinuno o tagapangasiwa ng musikang panliturhiya. Likas sa Filipino ang pariralang ito at hindi nito nililimitahan ang tungkulin sa pagkumpas lamang sa isang koro.
- source_word: לְעֶבֶד
  choice: na lingkod ni
  rationale: Dito, ang עֶבֶד ay isang marangal na katawagan sa kaugnayan ni David kay Yahweh, hindi isang kontekstong nagbibigay-diin sa kalagayan ng isang alipin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “Panginoon.”
- source_word: לְדָוִד
  choice: Ukol kay David
  rationale: Maaaring magpahiwatig ang לְ ng pagkakaugnay, pag-uukol, o pag-aari. Ang “Ukol kay David” ay hindi basta nagpapasya na si David lamang ang may-akda.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ito bilang Yahweh upang hindi mapalitan ng isang titulo.
- issue: Kahulugan ng עֶבֶד sa pamagat
  choice: lingkod
  alternative: alipin
  rationale: Ginagamit ito rito bilang marangal na paglalarawan kay David bilang naglilingkod at nabibilang kay Yahweh; hindi binibigyang-diin ng pamagat ang sapilitang pagkaalipin.
- issue: Saklaw ng pag-uugnay ng לְדָוִד
  choice: Ukol kay David
  alternative: Ni David; Para kay David
  rationale: Hindi tiyak sa anyong Hebreo kung ang pamagat ay hayagang nagsasaad ng pagkakatha, pag-aalay, o mas malawak na kaugnayan. Pinananatili ng salin ang lawak na ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tagapangasiwa ng awitan” bilang malinaw na katawagang panliturhiya, at ang maikling ayos ng pangungusap ay angkop sa isang pamagat ng Awit. Hindi pinasobra ang interpretasyon sa kaugnayan ni David sa awit.
