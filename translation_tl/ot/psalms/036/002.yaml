  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: tl
  text: Sapagkat sa sarili niyang paningin, binobola niya ang sarili niya, kaya hindi niya makita ang kanyang kasamaan at kamuhian ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Sapagkat ginagawa niyang makinis para sa kanyang sarili, sa sarili niyang paningin, upang masumpungan ang kanyang kasamaan, upang kamuhian.” Mahirap unawain ang sintaks ng Hebreo. Isang malamang na diwa nito ay hinahadlangan siya ng pambobola sa sarili na makilala at kamuhian ang sarili niyang kasamaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag at natural na nag-uugnay sa daloy ng salmo.
- source_word: הֶחֱלִיק אֵלָיו
  choice: pinupuri ang kanyang sarili
  rationale: Ang literal na diwa ay “ginagawang makinis para sa sarili,” na sa idyoma ay tumutukoy sa pambobola o labis na magandang pagtingin sa sarili. Pinili ang dignidad at likas na daloy kaysa sa mas kolokyal na “binobola ang sarili.”
- source_word: בְּעֵינָיו
  choice: sa sarili niyang paningin
  rationale: Pinananatili ang Hebreong idyoma ng sariling pagtataya o pagtingin sa sarili.
- source_word: לִמְצֹא
  choice: natutuklasan
  rationale: Ipinahahayag ang pagkilala o pagkakita sa moral na kamalian, habang nananatiling malapit sa literal na “masumpungan.”
- source_word: עֲוֺנוֹ
  choice: ang kanyang kasamaan
  rationale: Dinadala nito ang moral na bigat ng עָוֹן sa natural at madaling maunawaang modernong Tagalog; maaari rin itong tumukoy sa kasalanan o pagkakasala.
- source_word: לִשְׂנֹא
  choice: kinamumuhian
  rationale: Ang di-tahasang layon ay ang naunang “kasamaan.” Ginawang malinaw sa pangungusap ang inaasahang tugon na kamuhian iyon.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: kaya hindi niya natutuklasan at kinamumuhian ang kanyang kasamaan
  rationale: Mahirap at siksik ang sintaks. Ipinapahayag ng salin ang malamang na diwang hinahadlangan ng labis na pagpuri sa sarili ang pagkilala at pagtatakwil sa sariling kasamaan, samantalang inilalahad sa talababa ang mas literal at hindi tiyak na anyo.
theological_decisions:
- issue: Ang ugnayan ng labis na pagpuri sa sarili at ng pagkilala sa kasamaan
  choice: Ang sariling pambobola ay humahadlang sa tao na makilala at kamuhian ang kanyang kasamaan.
  alternative: Pinupuri niya ang sarili upang masumpungan ang kanyang kasamaan na kasuklam-suklam, o hanggang sa mahayag na kasuklam-suklam ang kanyang kasamaan.
  rationale: Ang napiling diwa ay angkop sa konteksto ng panlilinlang sa sarili sa Awit 36, ngunit hindi ganap na tiyak ang sintaks ng Hebreo; kaya hindi ikinukubli sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang kolokyal na “binobola” sa pangunahing teksto, ngunit pinanatili ang diwa ng sariling pambobola sa paliwanag. Ang “kasamaan” ay mas likas sa karaniwang mambabasa kaysa “kalikuan,” nang hindi pinapahina ang moral na bigat ng salita.
