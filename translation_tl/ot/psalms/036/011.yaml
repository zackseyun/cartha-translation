translation:
  language: tl
  text: Huwag nawang lumapit sa akin ang paa ng kapalaluan[a], at huwag nawa akong itaboy ng kamay ng masasama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumating sa akin” o “sumalakay sa akin.” Literal sa Hebreo, “huwag dumating sa akin ang paa ng kapalaluan.”
    reason: lexical_alternative
  - marker: b
    text: O “pagala-galain ako” o “pilitin akong tumakas.” Maaaring tumukoy ang pandiwa sa sapilitang pagpapaalis sa isang tao mula sa kaniyang kinalalagyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: lumapit sa akin
  rationale: Ang pandiwang בוא ay karaniwang nangangahulugang “dumating” o “lumapit.” Sa larawang “paa ng kapalaluan,” ipinahihiwatig ng konteksto ang mapanganib na paglapit, ngunit hindi ginawang tahasang “sumalakay” upang mapanatili ang lawak ng orihinal.
- source_word: רֶגֶל גַּאֲוָה
  choice: ang paa ng kapalaluan
  rationale: Pinananatili nito ang literal at makatang larawan ng Hebreong pariralang konstruktong “paa ng kapalaluan,” sa halip na tahasang tukuyin ang “mga palalo.”
- source_word: יַד רְשָׁעִים
  choice: kamay ng masasama
  rationale: Ang “kamay” ay pinanatili bilang larawan ng kapangyarihan o pagkilos, at ang pangmaramihang רְשָׁעִים ay likas na isinaling “masasama” nang hindi nagdaragdag ng salitang “mga lalaki.”
- source_word: תְּנִדֵנִי
  choice: itaboy
  rationale: Ang anyong causative ng pandiwa ay maaaring tumukoy sa pagpapagala, pagpapatakas, o pagpapaalis sa isang tao mula sa kaniyang kinalalagyan. Ang “itaboy” ay malinaw at likas na nagpapahayag ng sapilitang pagpapaalis.
- source_word: אַל
  choice: Huwag nawa
  rationale: Ipinahahayag ng אַל kasama ng mga anyong jussive ang mapanalanging pakiusap na huwag mangyari ang isang bagay. Ang “huwag nawa” ay marangal, malinaw, at angkop sa panalangin ng salmo.
