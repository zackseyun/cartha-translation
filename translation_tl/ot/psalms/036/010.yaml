  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: tl
  text: Ipagpatuloy mo ang iyong tapat na pag-ibig[a] sa mga kumikilala sa iyo, at ang iyong katuwiran sa mga may matuwid na puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iunat mo ang iyong tapat na pag-ibig.” Literal na “Hilahin mo” o “Iunat mo.”
    reason: lexical_alternative
  - marker: b
    text: O “ang iyong katarungan” sa halip na “ang iyong katuwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Ipagpatuloy mo
  rationale: Ang pautos na anyo ay literal na ‘hilahin’ o ‘iunat.’ Kapag ang layon ay חֶסֶד, likas sa makabagong Tagalog ang ‘ipagpatuloy,’ na nagpapahayag ng hiling na manatili at umabot pa ang tapat na pag-ibig ng Diyos.
- source_word: חַסְדְּךָ
  choice: ang iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at mapagkakatiwalaang pag-ibig sa loob ng isang ugnayan. Mas malinaw ito kaysa ‘awa’ lamang at hindi nito labis na nililimitahan ang kahulugan.
- source_word: לְיֹדְעֶיךָ
  choice: sa mga kumikilala sa iyo
  rationale: Ang participle ay literal na ‘mga nakakakilala sa iyo.’ Ang ‘kumikilala sa iyo’ ay natural sa Tagalog at maaaring magpahiwatig ng patuloy at may-ugnayang pagkilala, hindi lamang kaalamang intelektuwal.
- source_word: וְצִדְקָתְךָ
  choice: at ang iyong katuwiran
  rationale: Maaaring tumukoy ang צְדָקָה sa katuwiran o katarungan. Pinananatili ng ‘katuwiran’ ang malawak na moral at pang-ugnayang diwa at ang paralelismo sa tapat na pag-ibig.
- source_word: לְיִשְׁרֵי לֵב
  choice: sa mga matuwid ang puso
  rationale: Ang pariralang Hebreo ay literal na ‘mga tuwid sa puso’ at tumutukoy sa panloob na integridad. Ang ‘mga matuwid ang puso’ ay maikli, natural, at marangal sa Tagalog.
theological_decisions:
- issue: 'Magkatambal na mga katangian ng Diyos: חֶסֶד at צְדָקָה'
  choice: ‘tapat na pag-ibig’ at ‘katuwiran’
  alternative: ‘awa’ at ‘katarungan’
  rationale: Pinananatili ng salin ang lawak ng dalawang terminong Hebreo at ang kanilang makatang paralelismo nang hindi ipinapasok ang isang makitid na sistematikong o hudisyal na pagbasa.
translation_notes:
  register: Makabago at dignified na Filipino, na may payak na estruktura at panalanging tono. Ginamit ang ‘kumikilala’ upang ipahayag ang relasyonal at patuloy na diwa ng ‘nakakakilala,’ at ‘matuwid ang puso’ upang mapanatili ang Hebreong idyoma sa natural na Tagalog.
