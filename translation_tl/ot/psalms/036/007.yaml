  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: tl
  text: Napakahalaga ng iyong tapat na pag-ibig[a], O Diyos! Ang mga tao ay nanganganlong sa lilim ng iyong mga pakpak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na maaari ring magpahiwatig ng awa, matibay na katapatan, at pag-ibig na tapat sa isang ugnayan o tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: Napakahalaga
  rationale: Ang מַה ay nagpapahayag ng paghanga, hindi nagtatanong, at ang יָקָר ay tumutukoy sa bagay na lubhang mahalaga o mahal. Likas sa modernong Tagalog ang “Napakahalaga” at napananatili nito ang puwersa ng bulalas.
- source_word: חַסְדְּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ang חֶסֶד ay sumasaklaw sa pag-ibig, katapatan, awa, at matibay na katapatan sa ugnayan. Ang “tapat na pag-ibig” ay maikli at malinaw, ngunit nilalagyan ng talababa upang hindi paliitin ang saklaw ng salita.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang kinakausap dito ang Diyos; ang “O” ay angkop sa marangal na panulaang Tagalog at nagpapakita ng bokatibong gamit.
- source_word: וּבְנֵי אָדָם
  choice: Ang mga tao
  rationale: Ang pariralang Hebreo, literal na “mga anak ng tao/Adam,” ay kolektibong tumutukoy sa mga tao sa pangkalahatan. Ang “mga tao” ang pinakanatural at tumpak sa kasalukuyang Tagalog nang hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: sa lilim ng iyong mga pakpak
  rationale: Pinananatili nito ang metapora ng mapag-ingat na pagkalinga at malapit na proteksiyon sa ilalim ng mga pakpak.
- source_word: יֶחֱסָיוּן
  choice: nanganganlong
  rationale: Ang pandiwang חסה ay nangangahulugang humanap o kumuha ng kanlungan. Ang “nanganganlong” ay natural, aktibo, at hindi nagdaragdag ng diwa na wala sa Hebreo.
theological_decisions:
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; pag-ibig na matatag; katapatan sa tipan
  rationale: Hindi nililimitahan ang חֶסֶד sa awa lamang o tahasang ginagawang teknikal na terminong pangtipan. Pinananatili ng salin ang magkaugnay na diwa ng pag-ibig at katapatan, habang kinikilala sa talababa ang mas malawak na saklaw nito.
- issue: Kolektibong kahulugan ng בְּנֵי אָדָם
  choice: ang mga tao
  alternative: ang mga anak ng tao; ang sangkatauhan
  rationale: Bagaman literal na “mga anak ng tao/Adam,” pangkalahatang sangkatauhan ang tinutukoy. Ang “mga tao” ay gender-accurate at natural sa Tagalog, nang hindi nag-aangkat ng natatanging doktrina mula sa literal na idyoma.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang panulaang bulalas at ang larawan ng lilim ng mga pakpak; iniwasan ang lipas na “mga anak ng tao” sa pangunahing teksto dahil kolektibo ang Hebreong parirala.
