  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: tl
  text: Nagbabalak siya ng kasamaan[a] sa kanyang higaan; naninindigan siya sa daang hindi mabuti; hindi niya itinatakwil ang masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kalikuan”; ang salitang Hebreo ay maaari ring tumukoy sa kaguluhan o kapahamakang bunga ng kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa kontekstong ito, tumutukoy ang salita sa moral na kasamaan na sadyang binabalak, hindi lamang sa kaguluhan o kapahamakan.
- source_word: יַחְשֹׁב
  choice: nagbabalak
  rationale: Ipinahihiwatig ng pandiwa ang sinadya at pinag-isipang pagpaplano, lalo na dahil kasamaan ang layon nito at ginagawa ito sa higaan.
- source_word: עַל מִשְׁכָּבוֹ
  choice: sa kanyang higaan
  rationale: Likas na salin ito ng pariralang lokatibo at pinananatili ang larawan ng pagbabalak habang nasa higaan.
- source_word: יִתְיַצֵּב
  choice: tinatahak niya
  rationale: Ang anyong Hebreo ay literal na nagpapahiwatig ng pagpuwesto o pagtindig ng sarili. Sa kaugnayan nito sa metaporang 'daan,' likas na ipinahahayag sa Filipino ng 'tinatahak niya' ang kusang pagtatalaga ng sarili sa gayong landas.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: ang daang hindi mabuti
  rationale: Pinananatili nito ang metapora ng daan bilang asal o pamumuhay at ang sadyang litotes ng Hebreong 'hindi mabuti,' sa halip na gawing tahasang 'masamang daan.'
- source_word: רָע
  choice: ang masama
  rationale: Tumutukoy ito sa moral na kasamaan bilang layon ng pandiwang 'itinatakwil.' Ang substantibong 'ang masama' ay natural sa Filipino.
- source_word: לֹא יִמְאָס
  choice: hindi niya itinatakwil
  rationale: Ipinapahayag ng מאס ang pagtanggi, pagtatakwil, o pagkamuhi. Ang 'itinatakwil' ay malinaw na naghahatid ng hindi niya pagtalikod sa masama nang hindi labis na pinatitindi ang emosyon.
