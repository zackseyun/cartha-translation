base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: tl
  text: 'Sa kaibuturan ng puso ko[a], nangungusap ang pagsuway sa taong masama: “Walang takot sa Diyos sa harap ng kanyang mga mata.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa kaibuturan ng puso ko.” Isinasalin ito ng ilang sinaunang salin at makabagong salin bilang “sa puso niya,” samantalang ipinapakahulugan naman ito ng iba bilang “May mensahe sa puso ko tungkol sa taong masama.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring ayusin nang mas malapit sa pagkakasunod ng Hebreo: “Nangungusap ang pagsuway sa taong masama sa kaibuturan ng puso ko.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: נְאֻם
  choice: nangungusap
  rationale: Karaniwang nagpapakilala ang pangngalan ng isang taimtim o may-bigat na pahayag. Ginawang pandiwa ang salin upang maging likas sa Tagalog habang pinananatili ang diwa ng isang panloob na kapahayagan.
- source_word: פֶּשַׁע
  choice: pagsuway
  rationale: Tumutukoy ito sa sinasadya at mapaghimagsik na paggawa ng mali. Ang “pagsuway” ay malinaw sa karaniwang mambabasa at hindi ito nililimitahan sa krimen o sa politikal na paghihimagsik.
- source_word: לָרָשָׁע
  choice: sa taong masama
  rationale: Itinuturing ang pariralang may לְ bilang tumutukoy sa kinakausap. Nililinaw ng “taong masama” ang pang-isahang kinatawang diwa ng Hebreo nang hindi nilalagyan ng kasarian ang salin.
- source_word: בְּקֶרֶב לִבִּי
  choice: Sa kaibuturan ng puso ko
  rationale: Pinananatili ang unang panauhang hulapi ng tekstong Masoretiko (“puso ko”). Inilagay sa unahan ang parirala upang malinaw na ito ang kinaroroonan ng pagkaunawa o pahayag ng salmista, hindi paglalarawan sa taong masama.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: Walang takot sa Diyos
  rationale: Ang “takot sa Diyos” ay maaaring magpahiwatig ng mapitagang takot at pagkilala sa Diyos, hindi lamang sindak. Pinananatili nito ang malawak na diwa ng Hebreo.
- source_word: לְנֶגֶד עֵינָיו
  choice: sa harap ng kanyang mga mata
  rationale: Pinananatili ang larawang Hebreo tungkol sa bagay na nasa paningin o pagsasaalang-alang ng isang tao. Nauunawaan din ang idyomang ito sa dignified na modernong Tagalog.
theological_decisions:
- issue: Panghalip at pananaw sa mahirap na pagbasa na לִבִּי (“puso ko”)
  choice: 'Pinanatili ang pagbasa ng tekstong Masoretiko: sa kaibuturan ng sariling puso ng salmista niya naririnig o nauunawaan ang sinasabi ng pagsuway sa taong masama.'
  alternative: Baguhin o pakinisin ito bilang “sa kaibuturan ng puso niya,” o isalin nang mas interpretatibo bilang “May mensahe sa puso ko tungkol sa taong masama.”
  rationale: Malinaw na unang panauhang pang-isahan ang anyong Masoretiko, bagaman mahirap ang pagkakabuo ng pangungusap. Ang pagpapanatili sa “puso ko” ay gumagalang sa pangunahing tekstuwal na ebidensiya at hindi tahimik na nag-aalis ng tensiyon.
- issue: Kahulugan ng “takot sa Diyos”
  choice: Pinanatili ang tradisyonal at malawak na pariralang “takot sa Diyos.”
  alternative: “Pangingilabot sa Diyos” o “paggalang sa Diyos.”
  rationale: Maaaring saklawin ng Hebreo ang pangamba, pagpipitagan, at pagkilalang humuhubog sa asal. Ang alinman sa mas makitid na alternatibo ay magpapasya sa isang kahulugang hindi ipinipilit ng talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kaibuturan ng puso” upang likas na maipahayag ang panloob na lokasyon, at inuna ito upang maiwasang mapagkamalang ang “taong masama” ang nasa puso ng salmista. Pinanatili ang personipikasyon ng pagsuway at ang metaporang “sa harap ng kanyang mga mata.”
