  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: tl
  text: Sapagkat alam niya kung paano tayo hinubog[a]; inaalaala niyang tayo ay alabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ating pagkakahubog” o “ang ating kayarian.” Ang salitang Hebreo ay tumutukoy sa bagay na inanyuan o hinubog.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang sanhi o paliwanag para sa naunang pahayag at likas pakinggan sa makabagong Tagalog.
- source_word: הוּא
  choice: niya
  rationale: Tumutukoy sa Diyos ayon sa konteksto; likas na isinama sa pandiwang parirala sa Tagalog.
- source_word: יָדַע
  choice: alam
  rationale: Ang ganap na anyo ay nagpapahayag dito ng matatag at patuloy na kaalaman; tuwiran itong naipapahayag ng “alam.”
- source_word: יִצְרֵנוּ
  choice: kung paano tayo hinubog
  rationale: Pinananatili ang diwa ng isang bagay na inanyuan o hinubog, habang mas malinaw at natural kaysa sa literal na “ating pagkakahubog.”
- source_word: זָכוּר
  choice: inaalaala
  rationale: Ipinahahayag ang patuloy na pagkabatid o paggunita ng Diyos at pinananatili ang pagkakatulad ng dalawang sugnay.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala ang nilalaman ng inaalaala ng Diyos; ang pang-angkop sa “inaalaala niyang” ang natural na katumbas sa Tagalog.
- source_word: עָפָר
  choice: alabok
  rationale: Tuwirang salin na nagpapanatili sa larawan ng pagkalalang, pagiging marupok, at pagiging mortal ng tao.
- source_word: אֲנָחְנוּ
  choice: tayo ay
  rationale: Pinananatili ang inklusibong unang panauhang maramihan at malinaw na bumubuo ng sugnay sa Tagalog.
theological_decisions:
- issue: Larawang antropolohikal ng kahinaan ng tao
  choice: tayo ay alabok
  alternative: alabok lamang tayo
  rationale: Pinananatili ang mariing larawan ng Hebreo tungkol sa pagiging nilalang, marupok, at mortal ng tao nang hindi idinaragdag ang “lamang,” na maaaring magpasok ng higit na interpretibong diin.
- issue: Saklaw ng יִצְרֵנוּ
  choice: kung paano tayo hinubog
  alternative: ating pagkakahubog
  rationale: Iniiwan nitong bukas kung ang diin ay nasa ating pagkakabuo, kayarian, o paraan ng paghubog, sa halip na paliitin ito sa pisikal na katawan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa naunang talata, at “inaalaala” upang ipahayag ang patuloy na pagkabatid ng Diyos nang hindi labis na nagpapakahulugan.
