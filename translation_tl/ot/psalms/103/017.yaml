    issue: May idinagdag na pandiwang “umaabot” sa ikalawang sugnay.
    rationale: Nominal ang Hebreong “at ang kanyang katuwiran para sa mga anak ng mga anak.” Bagaman posible ang diwang pag-abot sa mga salinlahi, mas tapat at hindi gaanong interpretatibo ang “ay para sa.”
  - severity: low
    issue: Maaaring pasiglahin ang idyomang pangpanahon.
    rationale: Ang “mula pa sa walang hanggan” ay mas likas na Filipino habang pinananatili ang saklaw na “hanggang sa walang hanggan.”
