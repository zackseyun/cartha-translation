  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: tl
  text: Ngunit ang tapat na pag-ibig ni Yahweh ay mula pa sa walang hanggan hanggang sa walang hanggan para sa mga may takot sa kanya, at ang kanyang katuwiran[a] ay para sa mga anak ng kanilang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring taglayin ng salitang Hebreo ang dalawang diwa sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Ngunit ang tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig, kadalasan sa konteksto ng tipan. Ginamit ang “Ngunit” upang ipakita ang pagsalungat sa kaiklian ng buhay ng tao sa naunang talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Pinananatili nito ang magkatambal na idyomang Hebreo at ang saklaw nitong walang takdang simula o wakas.
- source_word: עַל יְרֵאָיו
  choice: sa mga may takot sa kanya
  rationale: Pinananatili ng “may takot” ang diwa ng pagpipitagan at paggalang na may kalakip na banal na takot, nang hindi ito pinapahina tungo sa simpleng paggalang lamang.
- source_word: וְצִדְקָתוֹ
  choice: at ang kanyang katuwiran
  rationale: Ang צְדָקָה ay maaaring tumukoy sa katuwiran o katarungan. Ang “katuwiran” ang mas malawak na salita rito at angkop sa pagkakatapat nito sa tapat na pag-ibig ng Diyos.
- source_word: לִבְנֵי בָנִים
  choice: sa mga anak ng kanilang mga anak
  rationale: Malapit ito sa larawang salinlahi-sa-salinlahi ng Hebreong parirala at hindi ito nililimitahan sa teknikal na katawagang “mga apo.”
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng צִדְקָה sa kontekstong patula
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ay nagpapanatili sa mas malawak na diwa ng pagiging matuwid at tapat ng Diyos, samantalang ang “katarungan” ay tunay ding posibleng kahulugan at inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang pag-uulit na “mula sa walang hanggan hanggang sa walang hanggan” at ang imaheng salinlahi ng “mga anak ng kanilang mga anak.”
