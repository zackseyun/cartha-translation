revisions:
- from: Ngunit ang tapat na pag-ibig ni Yahweh ay mula sa walang hanggan hanggang sa walang hanggan sa mga may takot sa kanya, at ang kanyang katuwiran[a] ay umaabot sa mga anak ng kanilang mga anak.
  to: Ngunit ang tapat na pag-ibig ni Yahweh ay mula pa sa walang hanggan hanggang sa walang hanggan para sa mga may takot sa kanya, at ang kanyang katuwiran[a] ay para sa mga anak ng kanilang mga anak.
  rationale: Inalis ang pandiwang “umaabot,” na hindi hayagang nasa tekstong Hebreo, upang mapanatili ang maingat na parallelismo ng talata. Inayos din ang pariralang pangpanahon para sa mas natural na modernong Filipino nang hindi binabago ang diwa ng “mula sa walang hanggan hanggang sa walang hanggan.”
