  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: tl
  text: Ipinaalam niya kay Moises ang kanyang mga daan at sa mga anak ni Israel[a] ang kanyang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bayang Israel” o “sa mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: Ipinaalam niya
  rationale: 'Ang Hifil ng ידע ay causative: ‘ipinaalam’ o ‘ginawang malaman.’ Natural sa modernong Filipino ang ‘ipinaalam’ at malinaw na pinananatili ang diwang causative.'
- source_word: דְּרָכָיו
  choice: ang kanyang mga daan
  rationale: Pinananatili ng ‘mga daan’ ang metapora ng Hebreo para sa paraan o takbo ng pagkilos ng Diyos, at isa itong pamilyar na idyomang biblikal sa Filipino.
- source_word: לְמֹשֶׁה
  choice: kay Moises
  rationale: Ipinahahayag ng לְ ang tumatanggap ng ipinabatid; ‘kay Moises’ ang natural na katumbas sa Filipino.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Ang בְּנֵי יִשְׂרָאֵל ay literal na ‘mga anak na lalaki ni Israel,’ ngunit bilang nakaugaliang katawagang bayan ay natural at sapat na tumpak ang ‘mga anak ni Israel,’ na hindi nagtatakda na lalaki lamang ang tinutukoy. Inilalagay sa talababa ang higit na idyomatikong kolektibong katumbas.
- source_word: עֲלִילוֹתָיו
  choice: ang kanyang mga gawa
  rationale: Ang עֲלִילוֹת ay tumutukoy sa mga ginawa o pagkilos. Ang ‘mga gawa’ ay malinaw at hindi nagdaragdag ng di-tahasang katangiang ‘makapangyarihan.’
theological_decisions:
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: bayang Israel / mga Israelita
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, isa itong nakaugaliang etnikong katawagan sa buong bayan. Pinananatili ng ‘mga anak ni Israel’ ang ugnayan sa ninunong si Israel nang hindi maling nililimitahan ang saklaw sa mga lalaking inapo lamang; ibinibigay sa talababa ang mga natural na kolektibong alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang paralelismo ng Hebreo at ang metaporang ‘mga daan,’ habang ginamit ang likas na ayos at mga pang-ukol sa Filipino.
