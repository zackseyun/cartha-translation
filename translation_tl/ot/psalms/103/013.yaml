  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: tl
  text: Kung paanong nahahabag ang isang ama sa kanyang mga anak,[a] gayon nahahabag si Yahweh sa mga may takot sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung paanong kinahahabagan ng isang ama ang kanyang mga anak, gayon kinahahabagan ni Yahweh ang mga may takot sa kanya.”
    reason: Alternatibong likas na paglalapat ng pandiwang רחם sa Tagalog, na higit na nagtatampok sa mga tumatanggap ng habag.
lexical_decisions:
- source_word: כְּרַחֵם
  choice: Kung paanong nahahabag
  rationale: Ang prefiks na כְּ ay naghahayag ng paghahambing, at ang רחם ay tumutukoy sa taimtim at magiliw na habag. Likas sa modernong Tagalog ang hulma na “Kung paanong ... gayon ...” at napapanatili nito ang paghahambing at pag-uulit ng Hebreo.
- source_word: אָב
  choice: ang isang ama
  rationale: Pangkalahatan at di-tiyak ang isahang pangngalan; ang “isang ama” ay angkop sa paghahambing na parang kawikaan at hindi tumutukoy sa isang partikular na ama.
- source_word: עַל
  choice: sa
  rationale: Kasama ng רחם, itinuturo ng עַל ang taong pinag-uukulan ng habag. Ang “mahabag sa” ang likas na katumbas sa Tagalog.
- source_word: בָּנִים
  choice: kanyang mga anak
  rationale: Bagaman panlalaking maramihan ang anyo, karaniwan itong tumutukoy sa mga supling sa pangkalahatan sa kontekstong pampamilya. Nililinaw ng “kanyang” ang ugnayang likas sa ama at mga anak.
- source_word: רִחַם
  choice: nahahabag
  rationale: Inulit ang kaparehong salitang Tagalog upang mapanatili ang makatang pag-uulit ng רחם. Ang aspektong imperpektibo ng “nahahabag” ay natural na naghahayag ng pangkalahatan at nagpapatuloy na katotohanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: יְרֵאָיו
  choice: mga may takot sa kanya
  rationale: Ang participle ay tumutukoy sa mga taong kinikilala sa kanilang pagkatakot kay Yahweh. Pinananatili ng “may takot” ang tuwirang lakas at teolohikal na tensiyon ng Hebreo nang hindi ito pinapalambot tungo lamang sa “gumagalang.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kasariang saklaw ng בָּנִים
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Bagaman panlalaki ang anyong gramatikal, pangkalahatan ang tinutukoy nitong mga supling sa paghahambing ng ama at mga anak; hindi makatuwirang paliitin ang diwa sa mga lalaki lamang.
- issue: Diwa ng יְרֵאָיו
  choice: mga may takot sa kanya
  alternative: mga gumagalang sa kanya
  rationale: Maaaring kalakip ng takot ang pagpipitagan, ngunit mas tuwirang pinananatili ng “may takot” ang saklaw at tensiyon ng salitang Hebreo nang hindi ito tahimik na binibigyang-kahulugang paggalang lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang balanseng “Kung paanong ... gayon ...” upang mapanatili ang parallelism, at inulit ang “nahahabag” gaya ng pag-uulit ng ugat na רחם sa Hebreo.
