  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: tl
  text: Gumagawa si Yahweh ng mga matuwid na gawa at nagbibigay ng katarungan sa lahat ng inaapi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Gumagawa si Yahweh ng mga gawang matuwid at ng mga makatarungang hatol para sa lahat ng inaapi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: Gumagawa
  rationale: Ang Qal participle ay naglalarawan sa palagian o katangiang pagkilos ni Yahweh; natural itong ipinahahayag sa Filipino sa kasalukuyang anyong “Gumagawa.”
- source_word: צְדָקוֹת
  choice: ng mga matuwid na gawa
  rationale: Ang pangmaramihang anyo ay maaaring tumukoy sa mga gawaing matuwid o mga pagkilos na nagtataguyod ng tama. Pinananatili nito ang pagkakaiba sa kasunod na מִשְׁפָּטִים.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa anyong transliterasyon ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וּמִשְׁפָּטִים
  choice: at nagbibigay ng katarungan
  rationale: Sa konteksto, tumutukoy ito sa mga hatol o pagkilos na nagpapatupad ng katarungan. Ang “nagbibigay ng katarungan” ay malinaw at natural sa Filipino.
- source_word: לְכָל
  choice: sa lahat ng
  rationale: Ipinakikita ng לְ ang mga nakikinabang o tumatanggap ng matuwid na pagkilos at katarungan ni Yahweh.
- source_word: עֲשׁוּקִים
  choice: inaapi
  rationale: Ang passive participle ay tumutukoy sa mga taong dumaranas ng pang-aapi, pagsasamantala, o paglabag sa kanilang karapatan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Ugnayan ng צְדָקוֹת at מִשְׁפָּטִים
  choice: mga matuwid na gawa at nagbibigay ng katarungan
  alternative: katuwiran at mga hatol
  rationale: 'Pinananatiling magkaugnay ngunit hindi pinagsasanib ang dalawang konsepto: matuwid na pagkilos at makatarungang paghatol o pagtatanggol sa inaapi.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga matuwid na gawa” upang katawanin ang pangmaramihang צְדָקוֹת, at ang pandiwang pariralang “nagbibigay ng katarungan” para sa natural na pagpapahayag ng מִשְׁפָּטִים sa konteksto ng mga inaapi.
