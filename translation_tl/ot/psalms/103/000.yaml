  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: tl
  text: 'Ni David.[a]


    Purihin mo ang PANGINOON, kaluluwa ko;

    at purihin ng lahat ng nasa kalooban ko[b]

    ang kanyang banal na pangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Para kay David.”
    reason: Ang pang-ukol na Hebreo sa pamagat ay maaaring magpahiwatig ng pag-akda, pag-aalay, o kaugnayan kay David.
  - marker: b
    text: Sa Hebreo, “lahat ng aking mga panloob na bahagi,” na maaari ring mangahulugang “buong panloob kong pagkatao.”
    reason: Ipinapakita ang literal na larawan at ang mas malawak na idyomatikong kahulugan ng parirala.
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Purihin mo
  rationale: Sa kontekstong ito, ang utos na literal na ‘pagpalain’ ang Diyos ay natural na ipinahahayag sa Filipino bilang pagpupuri sa kanya; pinananatili ng ‘mo’ ang tuwirang pakikipag-usap ng mang-aawit sa sarili niyang kaluluwa.
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Pinananatili ang matalinghagang pagtawag ng nagsasalita sa kanyang buong sarili, nang hindi ito pinapaliit sa damdamin o isip lamang.
- source_word: כָל־קְרָבַי
  choice: kayong lahat na nasa kalooban ko
  rationale: Inilalarawan ng Hebreo ang lahat ng panloob na bahagi o buong panloob na pagkatao. Ang tahasang pangmaramihang pagtawag ay nagpapanatili sa personipikasyon at kaayusang patula ng pinagmulan.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakagawiang anyong malalaking titik para katawanin ang banal na pangalang YHWH.
- source_word: שֵׁם קָדְשׁוֹ
  choice: kanyang banal na pangalan
  rationale: Tuwirang pinananatili ang wika ng kabanalan at pangalan sa Hebreo.
theological_decisions:
- issue: Ang saklaw ng ‘kaluluwa’ at ‘lahat ng nasa kalooban ko’
  choice: Pinanatili ang dalawang magkaugnay ngunit hindi lubos na pinag-isang pahayag.
  alternative: Isalin ang dalawa bilang ‘buong pagkatao ko.’
  rationale: Ang pinagmulan ay gumagamit kapwa ng נֶפֶשׁ at ng ‘lahat ng aking panloob na bahagi’; ang pagsasanib sa iisang parirala ay mag-aalis sa patulang pag-uulit at posibleng diin.
- issue: Kahulugan ng לְדָוִד sa pamagat
  choice: Ni David
  alternative: Para kay David
  rationale: Ang ‘Ni David’ ay maikli at tradisyonal ngunit hindi lubos na nilulutas kung ito ay tumutukoy sa pag-akda, pag-aalay, o kaugnayan kay David; inilalahad sa talababa ang tunay na posibilidad ng ibang pagbasa.
translation_notes:
  register: Makabagong, marangal, at patulang Filipino. Pinanatili ang apostrope sa ‘kaluluwa ko’ at ang tuwirang pagtawag sa lahat ng nasa kalooban, habang gumagamit ng ‘PANGINOON’ bilang karaniwang representasyon ng YHWH.
