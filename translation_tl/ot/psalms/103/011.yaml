  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: tl
  text: Sapagkat kung gaano kataas ang langit sa ibabaw ng lupa, gayon kalaki ang kanyang tapat na pag-ibig[a] sa mga may takot sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang awa” o “kanyang katapatan sa tipan.” Ang Hebreong חֶסֶד ay tumutukoy sa matatag at tapat na pag-ibig, lalo na sa loob ng isang ugnayang may tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pagpupuri; natural at marangal ang “Sapagkat” sa kontekstong patula.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ
  choice: kung gaano kataas ang langit sa ibabaw ng lupa
  rationale: Pinananatili ng hulmaing “kung gaano… gayon…” ang paghahambing ng antas at malinaw itong nauunawaan sa modernong Tagalog.
- source_word: שָׁמַיִם
  choice: ang langit
  rationale: Bagaman anyong maramihan ang Hebreo, karaniwang tumutukoy ito sa kalangitan; “ang langit” ang natural na kolektibong katawagan sa Tagalog at angkop sa marangal na tula.
- source_word: גָּבַר
  choice: gayon kalaki
  rationale: Ang pandiwa ay nagpapahiwatig ng pagiging makapangyarihan, matindi, o nangingibabaw. Sa paghahambing ng sukat, natural na ipinahahayag ito bilang napakalaking antas nang hindi ipinapasok ang ideya ng pakikipaglaban.
- source_word: חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Naipapahayag nito kapwa ang pagmamahal at ang matatag na katapatan na saklaw ng חֶסֶד, nang hindi ito pinakikitid sa awa lamang.
- source_word: עַל־יְרֵאָיו
  choice: sa mga may takot sa kanya
  rationale: Direkta nitong pinananatili ang puwersa ng ירא at inilalarawan ang mga taong may mapitagang takot sa Diyos; hindi ito pinalalambot tungo sa paggalang lamang.
theological_decisions:
- issue: Pagpapahayag sa חֶסֶד sa konteksto ng habag at katapatan ng Panginoon
  choice: tapat na pag-ibig
  alternative: awa; katapatan sa tipan; wagas na pagmamahal
  rationale: Pinananatili ng “tapat na pag-ibig” ang magkasamang diwa ng pagmamahal at matatag na katapatan, habang iniiwasang gawing mas makitid ang kahulugan o magpasok ng natatanging doktrinal na pagbasa.
- issue: Kahulugan ng יְרֵאָיו
  choice: mga may takot sa kanya
  alternative: mga gumagalang sa kanya; mga may pagpipitagan sa kanya
  rationale: Pinananatili ang tunay na tensiyon ng salitang “takot,” na sa konteksto ay may kasamang pagpipitagan ngunit hindi dapat tahimik na palitan ng paggalang lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na nagpapanatili sa paralelismong patula. Ginamit ang “kanyang” sa karaniwang modernong baybay at ang “may takot sa kanya” upang mapanatili ang lakas at teolohikal na tensiyon ng orihinal.
