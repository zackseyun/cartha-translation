  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: tl
  text: 'Itinatag ni Yahweh sa kalangitan[a] ang kanyang trono,

    at ang kanyang paghahari[b] ay namamahala sa lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa langit.” Literal sa Hebreo, “sa mga langit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kaharian”; saklaw rin ng salitang Hebreo ang diwa ng pagkahari o pamumuno bilang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בַּשָּׁמַיִם
  choice: sa kalangitan
  rationale: Likas at marangal na salin sa Filipino na kumakatawan sa anyong maramihan ng Hebreo; inilalahad sa talababa ang maaaring saling “sa langit.”
- source_word: הֵכִין
  choice: itinatag
  rationale: Ipinahihiwatig ng Hiphil ng כון ang matibay na pagtatatag; ang aspektong ganap ay angkop na ipinapahayag ng pangnagdaan sa Filipino.
- source_word: כִּסְאוֹ
  choice: ang kanyang trono
  rationale: Tuwirang salin sa konteksto ng maharlikang pamamahala.
- source_word: וּמַלְכוּתוֹ
  choice: at ang kanyang paghahari
  rationale: Maaaring tumukoy ang מַלְכוּת sa kaharian, pagkahari, o paghahari. Ang “paghahari” ay natural dito at nakatuon sa aktibong saklaw ng pamamahala nang hindi itinatanggi ang alternatibong “kaharian.”
- source_word: בַּכֹּל
  choice: sa lahat
  rationale: Kasama ng pandiwang משל, ipinapahayag nito ang pangkalahatang saklaw ng kapangyarihan.
- source_word: מָשָׁלָה
  choice: ay namamahala
  rationale: Bagaman anyong ganap ang pandiwang Hebreo, nagsasaad ito rito ng namamalagi at pangkalahatang katotohanan; natural itong ipahayag sa Filipino bilang patuloy na pamamahala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang ipinahayag na personal na pangalan at hindi ito pinapalitan ng isang titulo.
- issue: Aspekto ng מָשָׁלָה sa patulang pahayag tungkol sa kapamahalaan ng Diyos
  choice: ay namamahala
  alternative: ay namahala; ay naghari
  rationale: Maaaring gumana rito ang anyong ganap bilang gnomic o stative na pahayag. Ipinapahayag ng kasalukuyang anyo sa Filipino ang patuloy na katotohanan ng kanyang pamamahala, hindi lamang isang nakalipas na kilos.
- issue: Saklaw ng kahulugan ng מַלְכוּת
  choice: paghahari
  alternative: kaharian; pagkahari
  rationale: Hindi tiyak na pisikal o teritoryal na kaharian lamang ang tinutukoy. Pinananatili ng “paghahari” ang diwa ng aktibong paghaharing sumasaklaw sa lahat, habang kinikilala sa talababa ang “kaharian.”
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang dalawang magkatimbang na linya at ang tahasang pahayag ng pandaigdig na kapamahalaan ni Yahweh; iniwasan ang labis na teknikal o makalumang pananalita.
