  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: tl
  text: Purihin ninyo si Yahweh, lahat ng kanyang hukbo[a]—mga lingkod niyang tumutupad sa kanyang kalooban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hukbo niya” o “hukbo niya sa langit.”
    reason: lexical_alternative
  - marker: b
    text: O “mga tagapaglingkod niya” o “mga naglilingkod sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Purihin ninyo
  rationale: Ang maramihang pautos ng ברך ay nakatuon sa mga nilalang sa langit. Sa makabagong Tagalog, mas likas ang “Purihin ninyo” kaysa sa literal na “Pagpalain ninyo” kapag Diyos ang tuwirang layon, habang malinaw pa ring ipinahahayag ang pagpupuri sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang panumbas sa panlahatang pantukoy na sumasaklaw sa buong hukbo.
- source_word: צְבָאָיו
  choice: hukbo niya
  rationale: Ang צבא ay maaaring tumukoy sa hukbo o kalipunan ng mga nilalang sa langit. Pinananatili ng “hukbo” ang larawang militar at ang lawak ng salitang Hebreo nang hindi tahasang nililimitahan ang tinutukoy.
- source_word: מְשָׁרְתָיו
  choice: mga lingkod niya
  rationale: Mula sa שׁרת, tumutukoy ito sa mga naglilingkod o tumutupad ng tungkulin sa harap ng isang nakatataas. Ang “mga lingkod” ay likas at marangal sa modernong Tagalog; inilalahad sa talababa ang posibleng diin sa pormal na paglilingkod.
- source_word: עֹשֵׂי
  choice: na gumagawa
  rationale: Ang participle ay natural na isinasalin bilang sugnay na naglalarawan sa mga lingkod.
- source_word: רְצוֹנוֹ
  choice: kanyang kalooban
  rationale: Saklaw ng רצון ang nais, ikinalulugod, o kalooban ng Diyos. Ang “kanyang kalooban” ay malinaw at natural, ngunit hindi inaalis ang kaugnay na diwa ng kanyang ninanais.
theological_decisions:
- issue: Tinutukoy ng “hukbo niya” at “mga lingkod niya”
  choice: Pinananatiling malawak ang pananalita, bagaman ipinahihiwatig ng konteksto na mga nilalang o tagapaglingkod sa langit ang pangunahing tinutukoy.
  alternative: Lahat ng lingkod ng Diyos, kabilang ang mga tao sa lupa.
  rationale: Binabanggit sa naunang talata ang mga anghel, kaya malamang na nagpapatuloy rito ang panawagan sa hukbo sa langit. Gayunman, hindi tahasang sinasabi ng talata ang “mga anghel,” kaya hindi iyon idinaragdag sa pangunahing teksto.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “Purihin ninyo” bilang natural na panawagan sa Diyos sa Tagalog, at pinanatili ang magkatulad na ayos ng dalawang tuwirang tawag: “kayong lahat na hukbo niya” at “kayong mga lingkod niya.”'
