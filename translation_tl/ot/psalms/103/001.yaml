  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: tl
  text: 'Kay David.


    Purihin mo si Yahweh, O kaluluwa ko; at purihin din ng buong pagkatao ko[a] ang banal niyang pangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “lahat ng aking mga panloob na bahagi,” o “buong panloob kong pagkatao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Kay David
  rationale: Pinananatili nito ang malawak na kaugnayang ipinahihiwatig ng לְ sa pamagat—maaaring ukol kay David, mula kay David, o kaugnay niya—nang hindi tahasang nilulutas ang usapin ng pagkakasulat.
- source_word: בָּרֲכִי
  choice: Purihin mo
  rationale: Bagaman pangunahing nangangahulugang ‘pagpalain,’ kapag Diyos ang layon, ang likas na modernong Tagalog na ‘purihin’ ay malinaw na nagpapahayag ng mapitagang pagpupuri at umiiwas sa di-likas na tunog ng pag-uutos sa sarili na ‘pagpalain’ ang Diyos.
- source_word: נַפְשִׁי
  choice: O kaluluwa ko
  rationale: Pinananatili ang ποιetikong tuwirang pakikipag-usap ng mang-aawit sa kaniyang sarili at ang tradisyonal ngunit nauunawaang saklaw ng נֶפֶשׁ bilang kaluluwa, sarili, o buhay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal na יהוה sa halip na palitan ito ng titulong ‘Panginoon.’
- source_word: וְכָל־קְרָבַי
  choice: buong kalooban ko
  rationale: Ang literal na ‘lahat ng mga panloob na bahagi ko’ ay tumutukoy sa buong panloob na pagkatao. Ang ‘buong kalooban ko’ ay likas at marangal sa Tagalog, habang ang talababa ay nagpapanatili sa konkretong anyo ng Hebreo.
- source_word: שֵׁם קָדְשׁוֹ
  choice: ang banal niyang pangalan
  rationale: Likas na Tagalog ito para sa Hebreong pariralang ‘pangalan ng kaniyang kabanalan,’ at pinananatili kapuwa ang ‘pangalan’ at ang katangiang banal.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng pagbabasbas sa Diyos
  choice: Purihin mo
  alternative: Pagpalain mo
  rationale: Pinananatili ng ‘purihin’ ang kilos ng mapitagang pagpupuri na ipinahihiwatig ng piel na ברך kapag Diyos ang layon, sa mas likas na modernong Tagalog. Hindi nito ipinahihiwatig na ang tao ang pinagmumulan ng pagpapala ng Diyos.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at patula. Ginamit ang ‘O kaluluwa ko’ upang mapanatili ang tuwirang pakikipag-usap sa sarili; ang ‘buong kalooban ko’ ay piniling likas na katumbas ng Hebreong maramihang ‘mga panloob na bahagi ko.’
