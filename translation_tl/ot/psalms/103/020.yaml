base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: tl
  text: Purihin ninyo si Yahweh, kayong mga anghel niya, kayong makapangyarihan sa lakas, na tumutupad sa kanyang salita at nakikinig[a] sa tinig ng kanyang salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sumusunod”; ang pandiwang Hebreo ay maaaring mangahulugang pakikinig na humahantong sa pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Purihin ninyo
  rationale: Ang literal na diwa ay ‘pagpalain ninyo,’ ngunit sa panawagang nakatuon sa Diyos, ang ‘Purihin ninyo’ ang natural at malinaw na katumbas sa modernong Tagalog at nagpapanatili sa paulit-ulit na panawagan ng salmo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahihiwatig ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מַלְאָכָיו
  choice: mga anghel niya
  rationale: Sa kontekstong makalangit, ang מַלְאָךְ ay tumutukoy sa mga anghel, hindi sa mga taong sugo.
- source_word: גִּבֹּרֵי כֹחַ
  choice: mga makapangyarihang puspos ng lakas
  rationale: Ipinahahayag nito ang mga nilalang na makapangyarihan sa lakas nang hindi sila tahasang inilalarawan bilang mga mandirigma.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: na tumutupad sa kanyang salita
  rationale: Ang ‘tumutupad’ ay likas na Tagalog para sa aktuwal na pagsasagawa ng sinabi ng Diyos, habang pinananatili ang ‘salita’ bilang katumbas ng דָּבָר.
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: at nakikinig sa tinig ng kanyang salita
  rationale: Pinananatili ng ‘nakikinig’ ang pandinig na larawan at ang posibleng diwa ng masunuring pakikinig; ang ‘tinig ng kanyang salita’ ay malapit sa anyo ng Hebreo at sadyang hindi inaalis ang makatang pag-uulit ng ‘salita.’
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang transliterasyon ay hindi nagpapalit dito ng titulo.
- issue: Diwa ng שׁמע sa paglalarawan sa mga anghel
  choice: nakikinig
  alternative: sumusunod
  rationale: Maaaring saklawin ng pandiwang Hebreo kapwa ang pakikinig at masunuring pagtugon. Pinananatili sa teksto ang kongkretong larawan ng pakikinig, habang nililinaw sa talababa ang posibleng diwa ng pagsunod.
translation_notes:
  register: Makabago at marangal na Tagalog, na gumagamit ng karaniwang bokabularyo. Pinanatili ang makatang pag-uulit ng ‘salita’ at ang bahagyang di-pangkaraniwang larawang ‘tinig ng kanyang salita’ upang hindi burahin ang anyo at teolohikal na diin ng Hebreo.
