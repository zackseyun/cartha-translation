  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: tl
  text: Kung gaano kalayo ang silangan mula sa kanluran, gayon din kalayo niyang inilayo mula sa atin ang ating mga pagsuway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pagsuway” ay maaari ring isaling “mga paghihimagsik” o “mga paglabag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: Kung gaano kalayo
  rationale: Ipinakikita ng parirala ang paghahambing ayon sa lawak ng distansiya; natural sa modernong Tagalog ang hulma na “kung gaano… gayon…”.
- source_word: מִזְרָח מִמַּעֲרָב
  choice: ang silangan sa kanluran
  rationale: Pinananatili nito ang magkatapat na direksiyon at ang larawan ng di-masukat na layo.
- source_word: הִרְחִיק
  choice: inilayo
  rationale: Ang causative na anyo ng רחק ay nangangahulugang gawing malayo o ilagay sa malayo; tuwiran at natural itong naipahahayag ng “inilayo.”
- source_word: מִמֶּנּוּ
  choice: sa atin
  rationale: 'Ang hulaping unang panauhang maramihan ay tumutukoy sa pamayanang nagsasalita: “mula sa atin”; sa pandiwang “inilayo,” idiomatikong Tagalog ang “sa atin.”'
- source_word: פְּשָׁעֵינוּ
  choice: ang ating mga pagsuway
  rationale: Ang פשע ay tumutukoy sa paglabag o paghihimagsik, hindi lamang sa kasalanan sa pangkalahatan. Malinaw sa karaniwang mambabasa ang “mga pagsuway,” habang inilalahad sa talababa ang mas matinding alternatibo.
theological_decisions:
- issue: Larawang pangkalawakan para sa kapatawaran
  choice: Panatilihin ang paghahambing ng layo ng silangan at kanluran at ilapat ito sa paglalayo ng Diyos sa mga pagsuway.
  alternative: Ipahayag lamang na lubos na nagpatawad ang Diyos nang walang larawan ng distansiya.
  rationale: Malinaw na ginagamit ng Hebreo ang distansiya ng silangan at kanluran bilang larawan ng ganap na pag-aalis ng mga pagsuway. Ang pagpapanatili nito ay hindi nagdaragdag ng paliwanag tungkol sa paraan ng kapatawaran.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang balanseng hulma na “kung gaano… gayon…” upang mapanatili ang paralelismo at paghahambing ng tekstong Hebreo.
