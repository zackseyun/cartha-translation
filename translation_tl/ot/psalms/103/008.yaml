  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: tl
  text: Si Yahweh ay mahabagin[a] at mapagbigay-loob, matagal bago magalit, at sagana sa tapat na pag-ibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maawain.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong חָסֶד ay madalas tumukoy sa tapat at matibay na pag-ibig, lalo na sa ugnayan ng tipan; maaari ring isaling “matatag na pag-ibig” o “katapatan sa tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: mahabagin
  rationale: Likas at marangal na salitang Filipino para sa malalim na habag; pinananatili nito ang personal at madamdaming diwa ng salitang Hebreo.
- source_word: חַנּוּן
  choice: mapagbigay-loob
  rationale: Ipinahihiwatig nito ang kusang pagbibigay ng pabor o kabutihan nang hindi inuulit lamang ang kahulugan ng “mahabagin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֶרֶךְ אַפַּיִם
  choice: matagal bago magalit
  rationale: Natural na katumbas sa Filipino ng idyomang Hebreo na literal na “mahaba ang mga butas ng ilong,” na nangangahulugang hindi agad nagagalit.
- source_word: רַב
  choice: sagana sa
  rationale: Malinaw nitong ipinapahayag ang kasaganaan ng katangiang kasunod at natural itong pakinggan sa modernong Filipino.
- source_word: חָסֶד
  choice: tapat na pag-ibig
  rationale: Pinagsasama ng parirala ang pagmamahal at matatag na katapatan na saklaw ng salitang Hebreo, nang hindi ito ikinukulong sa isang makitid na terminong teolohikal.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Pagtutumbas sa חָסֶד sa konteksto ng tipan
  choice: tapat na pag-ibig
  alternative: matatag na pag-ibig; katapatan sa tipan; wagas na pag-ibig
  rationale: Pinananatili ng “tapat na pag-ibig” ang pagsasanib ng pagmamahal at matibay na katapatan sa salita, nang hindi nagpapasok ng mas makitid na doktrinal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matagal bago magalit” bilang likas na idyomatikong salin, at pinag-iba ang “mahabagin” at “mapagbigay-loob” upang mapanatili ang dalawang magkaugnay ngunit hindi magkaparehong katangian sa Hebreo.
