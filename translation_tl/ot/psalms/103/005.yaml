  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iyong palamuti.” Mahirap unawain ang pariralang Hebreo. Marami ang nagpapakahulugan dito bilang “na nagbibigay-kasiyahan sa iyong buhay sa pamamagitan ng mabubuting bagay,” samantalang ayon sa isa pang tradisyon ng pagbasa, “na nagbibigay-kasiyahan sa iyong bibig ng mabuti.”
    reason: alternative_reading
  - marker: b
