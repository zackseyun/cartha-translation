lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: mga tumutupad
  rationale: Sa konteksto ng tipan, ang participle ng שׁמר ay tumutukoy sa patuloy na pag-iingat o matapat na pagsunod. Ang “tumutupad” ay natural sa makabagong Filipino at malinaw na ipinahihiwatig ang aktuwal na pagsunod.
- source_word: בְרִיתוֹ
  choice: kanyang tipan
  rationale: Ang בְּרִית ay karaniwang tumutukoy sa tipan, lalo na sa ugnayan ng Diyos at ng kanyang bayan. Pinananatili ng “tipan” ang bigat na biblikal at teolohikal ng salita.
- source_word: וּלְזֹכְרֵי
  choice: at sa mga umaalaala
  rationale: Ang זכר dito ay higit sa simpleng paggunita; tumutukoy ito sa maingat na pag-alala na humahantong sa pagkilos. Pinananatili ng “umaalaala” ang pangunahing larawan ng Hebreo, habang nililinaw ng kasunod na parirala ang praktikal na layunin nito.
- source_word: פִקֻּדָיו
  choice: kanyang mga tuntunin
  rationale: Ang פִּקּוּדִים sa Mga Awit ay tumutukoy sa mga itinakdang tagubilin o atas ng Panginoon. Ang “mga tuntunin” ay dignificado, malinaw, at naiiba sa mas espesipikong “mga utos.”
- source_word: לַעֲשׂוֹתָם
  choice: upang gawin ang mga iyon
  rationale: Ang infinitive construct na may לְ ay maaaring magpahayag ng layunin o bunga. Ang “upang gawin ang mga iyon” ay natural na Filipino at pinananatili ang ugnayan ng pag-alala at aktuwal na pagsasagawa.
theological_decisions:
- issue: Etikal at praktikal na puwersa ng “umaalaala” kaugnay ng mga tuntunin ng Diyos
  choice: “umaalaala sa kanyang mga tuntunin upang gawin ang mga iyon”
  alternative: “inaaalala ang kanyang mga tuntunin, para sundin ang mga iyon”
  rationale: Iniuugnay ng sintaks na Hebreo ang pag-alala sa pagsasagawa. Pinananatili ng salin ang pag-alaalang humahantong sa pagsunod nang hindi nagdaragdag ng balangkas na teolohikal na wala sa talata.
translation_notes:
  register: Makabagong Filipino na dignificado at madaling maunawaan. Ginamit ang “tumutupad ng kanyang tipan” bilang likas na pahayag ng matapat na pagsunod, habang inilagay sa talababa ang mas literal na “nag-iingat.”
