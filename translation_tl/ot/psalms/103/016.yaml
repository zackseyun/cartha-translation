  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: tl
  text: Sapagkat dinaanan ito ng hangin[a], at wala na ito[b], at hindi na ito kinikilala ng kinaroroonan nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hininga” o “espiritu”; pinapaboran ng larawang patula tungkol sa damo at bulaklak ang “hangin.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at wala ito.”
    reason: lexical_alternative
  - marker: c
    text: Inilalarawan ng Hebreo ang kinaroroonan na para bang kaya nitong kilalanin ang naglaho.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Sa konteksto ng pangkalahatang paghahambing sa buhay ng tao at bulaklak, natural na ipinahahayag nito ang pangyayaring nagdudulot sa paglaho; pinananatili rin nito ang posibleng temporal na himig ng כִּי.
- source_word: רוּחַ
  choice: hangin
  rationale: Sa larawang patula tungkol sa damo at bulaklak, ang 'hangin' ang pinakaangkop na kahulugan, bagaman maaari rin itong mangahulugang 'hininga' o 'espiritu.'
- source_word: עָבְרָה בּוֹ
  choice: dinaanan ito
  rationale: Likas sa modernong Filipino ang pariralang ito para sa pagdaan ng hangin sa ibabaw o sa kinaroroonan ng bulaklak, nang hindi dinaragdagan ang lakas ng payak na pandiwang עבר.
- source_word: וְאֵינֶנּוּ
  choice: naglalaho ito
  rationale: Ipinahahayag nito nang natural ang idyomatikong diwang 'wala na ito' sa konteksto ng bulaklak na napapawi, habang itinatala sa talababa ang mas literal na anyo.
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד
  choice: at hindi na ito nakikilala
  rationale: Pinananatili ang kahulugan ng נכר bilang pagkilala at ang personipikasyon sa Hebreo, sa halip na gawing payak na paliwanag na wala nang bakas.
- source_word: מְקוֹמוֹ
  choice: ng kinalalagyan nito
  rationale: Natural na tumutukoy sa lugar na dating kinaroroonan ng bulaklak at pinananatili ang personipikasyon na ang lugar ang hindi na kumikilala rito.
