  naturalness: Natural at marangal sa modernong Filipino ang “Sapagkat dinaanan ito ng hangin ... at wala na ito.” Ang “kinaroroonan nito” ay mas tuwiran at mas likas kaysa “kinalalagyan nito,” habang pinananatili ang tinutukoy na lugar.
