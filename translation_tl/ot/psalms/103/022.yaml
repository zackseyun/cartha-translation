base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: tl
  text: Purihin ninyo si Yahweh[a], kayong lahat na kanyang mga gawa[b], sa lahat ng dako ng kanyang pamamahala[c]. Purihin mo si Yahweh, kaluluwa ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Pagpalain ninyo si Yahweh.” Sa kontekstong ito, ang “pagpalain” ang Diyos ay ang pagpuri sa kanya.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “lahat ng kanyang ginawa” o, ayon sa konteksto, “lahat ng kanyang nilikha.”'
    reason: lexical_ambiguity
  - marker: c
    text: 'Sa literal: “sa lahat ng mga dako ng kanyang pamamahala”; ibig sabihin, saanman umaabot ang kanyang pamamahala.'
    reason: clarification
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: Purihin ninyo / Purihin mo
  rationale: Ang pandiwang ברך ay literal na “pagpalain,” ngunit kapag ang Diyos ang tuwirang layon, natural at malinaw sa modernong Tagalog ang “purihin.” Pinananatili rin ang pag-uulit ng iisang pandiwa, samantalang inilalagay sa talababa ang mas literal na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang tipan na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כָּל מַעֲשָׂיו
  choice: kayong lahat na kanyang mga gawa
  rationale: Malawak ang מַעֲשֶׂה at maaaring tumukoy sa mga ginawa o nilikha ng Diyos. Ang “kayong” ay hindi hiwalay na salitang Hebreo ngunit likas na nililinaw sa Tagalog na ang pariralang ito ang kinakausap ng pangmaramihang pautos.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: sa lahat ng dako ng kanyang paghahari
  rationale: Pinananatili nito kapwa ang lokatibong “sa lahat ng dako” at ang abstraktong diwa ng pamamahala o kapangyarihang naghahari.
- source_word: נַפְשִׁי
  choice: O kaluluwa ko
  rationale: Tuwirang kinakausap ng makata ang sarili niyang נֶפֶשׁ. Ang “O kaluluwa ko” ay maikli, marangal, at nagpapanatili sa poetikong pagtawag.
theological_decisions:
- issue: Pagpapahayag ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo; ang “Yahweh” ay nagpapanatili rito nang hindi ito ginagawang pangkalahatang titulo.
- issue: Kahulugan ng ברך kapag Diyos ang layon
  choice: Purihin
  alternative: Pagpalain
  rationale: Hindi ipinahihiwatig na nagkakaloob ang nilalang ng biyayang kailangan ng Diyos. Sa kontekstong ito, ang utos ay pagkilala at pagpahayag ng papuri sa Diyos, habang kinikilala sa talababa ang literal na anyo.
- issue: Saklaw ng “kanyang mga gawa”
  choice: Pinanatili ang malawak na parirala
  alternative: lahat ng kanyang nilikha
  rationale: Bagaman ang panawagan ay maaaring tumukoy sa buong sangnilikha, ang מַעֲשָׂיו ay maaari ring saklawin ang lahat ng gawa ng Diyos. Hindi nilimitahan ang teksto sa mga nilikhang bagay lamang.
translation_notes:
  register: Makabago ngunit marangal at poetiko ang rehistro. Ginamit ang “kayong” upang luminaw na ang “lahat na kanyang mga gawa” ang kinakausap ng pangmaramihang pautos. Pinanatili ang “O kaluluwa ko” bilang maikli at kinikilalang anyo ng taimtim na pakikipag-usap sa sarili.
