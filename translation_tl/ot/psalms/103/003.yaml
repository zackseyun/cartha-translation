  text: who forgives all your iniquity[a], who heals all your diseases[b],
translation:
  language: tl
  text: 'na nagpapatawad sa lahat ng iyong kasamaan[a],

    na nagpapagaling sa lahat ng iyong karamdaman[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkakasala” o “pananagutan sa kasalanan.” Ang salitang Hebrew na עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala, o sa pananagutang bunga ng maling gawa.
    reason: lexical_alternative
  - marker: b
    text: O “mga sakit.” Maaaring tuwirang tumukoy ang linya sa pisikal na karamdaman, bagaman maaari rin itong maunawaan nang mas malawak sa makatang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: na nagpapatawad
  rationale: Ang may pantukoy na participle ay naglalarawan sa patuloy at katangiang gawain ng PANGINOON. Likas sa Tagalog ang sugnay na “na nagpapatawad” at kaayon ito ng paralel na kasunod na linya.
- source_word: לְכָל
  choice: sa lahat ng
  rationale: Pinananatili nito ang malawak at sumasaklaw na diwa ng Hebrew sa parehong hati ng taludtod.
- source_word: עֲוֺנֵכִי
  choice: iyong kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa masamang gawa, pagkakasala, o pananagutang bunga nito. Ang “kasamaan” ay nagpapanatili ng bigat na moral nang hindi nililimitahan ang salita sa damdamin ng pagkakasala.
- source_word: הָרֹפֵא
  choice: na nagpapagaling
  rationale: Gaya ng unang participle, inilalarawan nito ang katangiang gawain ng PANGINOON. Ang “nagpapagaling” ang natural at tuwirang katumbas sa modernong Tagalog.
- source_word: תַּחֲלֻאָיִכִי
  choice: iyong karamdaman
  rationale: Ang “karamdaman” ay malinaw na tumutukoy sa sakit ngunit sapat ding malawak upang huwag paliitin ang makatang saklaw ng pahayag. Ginagamit ito bilang kolektibong pangngalan matapos ang “lahat ng.”
theological_decisions:
- issue: Kung dapat gawing tahasang espirituwal ang pagpapagaling
  choice: Pinanatili ang konkretong “nagpapagaling sa lahat ng iyong karamdaman” nang walang idinagdag na espirituwal na paliwanag.
  alternative: “nagpapagaling sa lahat ng iyong espirituwal na karamdaman” o isang sadyang metaporikal na salin
  rationale: Ang Hebrew ay likas na tumutukoy sa sakit o karamdaman. Maaaring magkaroon ng mas malawak na pag-unawa dahil sa makatang konteksto, ngunit hindi iyon dapat ipasya ng salin para sa mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkatulad na anyong “na nagpapatawad … na nagpapagaling” at ang ikalawang panauhang isahan na “iyong,” yamang kinakausap ng salmista ang sarili niyang kaluluwa sa konteksto.
