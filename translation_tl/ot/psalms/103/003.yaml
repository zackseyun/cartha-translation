  terminology: Ang “kasamaan” ay isang katanggap-tanggap na pangunahing katumbas ng עָוֹן na may sapat na bigat na moral; maayos na inilalahad ng talababa ang mga alternatibong “pagkakasala” at “pananagutan sa kasalanan.” Ang “karamdaman” ay malinaw at hindi nagdaragdag ng espirituwal na pagpapakahulugan. Wasto ang mga anchor ng talababa at tumutugma ang mga ito sa nauugnay na salita.
