  source_fidelity: 'Tapat ang salin sa dalawang articular participle ng Hebrew at sa magkatulad na estruktura ng mga ito: “na nagpapatawad” at “na nagpapagaling.” Ang “lahat ng iyong kasamaan” ay angkop na kolektibong pagsasalin ng isahang עֲוֺנֵכִי at hindi nito isinasara ang saklaw na maaaring kasalanan, pagkakasala, o pananagutan. Ang “lahat ng iyong karamdaman” ay natural na kolektibong Tagalog para sa maramihang תַּחֲלֻאָיִכִי at pinananatili ang kongkretong diwa ng sakit.'
