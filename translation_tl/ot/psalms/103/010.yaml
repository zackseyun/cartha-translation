  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: tl
  text: 'Hindi niya tayo pinakitunguhan ayon sa ating mga kasalanan,[a]

    ni ginantihan tayo ayon sa ating mga kasamaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi niya ginawa sa atin ang nararapat sa ating mga kasalanan, ni ginantihan tayo ayon sa nararapat sa ating mga kasamaan.”
    reason: Alternatibong paglalahad sa paghahambing o sukat na ipinahihiwatig ng כְּ.
lexical_decisions:
- source_word: כַּ/חֲטָאֵינוּ
  choice: ayon sa ating mga kasalanan
  rationale: Ang כְּ ay nagsasaad ng paghahambing o sukat—‘ayon sa’ o ‘katumbas ng’—at ang חֲטָאֵינוּ ay tumutukoy sa ating mga gawang kasalanan.
- source_word: עָשָׂה לָנוּ
  choice: pinakitunguhan niya tayo
  rationale: Sa kontekstong ito, ang malawak na pandiwang עשה kasama ng לָנוּ ay tumutukoy sa paraan ng pagkilos ng Diyos sa atin; natural itong ipinahahayag sa Filipino bilang ‘pinakitunguhan niya tayo.’
- source_word: וְלֹא
  choice: ni
  rationale: Pinagdurugtong nito ang ikalawang pagtanggi sa una habang pinananatili ang maikli at balanseng paralelismo.
- source_word: כַּ/עֲוֺנֹתֵינוּ
  choice: ayon sa ating mga kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutang dulot nito. Pinananatili ng ‘mga kasamaan’ ang kaunting leksikal na pagkakaiba nito sa חֲטָאֵינוּ nang hindi nililimitahan ang kahulugan sa damdamin ng pagkakasala.
- source_word: גָּמַל עָלֵינוּ
  choice: ginantihan tayo
  rationale: Ang גמל ay maaaring mangahulugang magbigay ng kaukulang ganti o kabayaran. Sa negatibong konteksto, malinaw na ipinahahayag ng ‘ginantihan’ na hindi ibinigay ng Diyos ang katumbas na nararapat sana dahil sa kasamaan.
- source_word: לֹא ... לֹא
  choice: Hindi ... ni
  rationale: Pinananatili nito ang dalawang magkatimbang na pagtanggi sa tulang Hebreo at ang diin sa maawaing pagpipigil ng Diyos.
theological_decisions:
- issue: Pagpapahayag ng awa ng Diyos nang hindi nagdaragdag ng partikular na teorya tungkol sa pagbabayad-sala o panahon ng paghatol
  choice: Pangkalahatang pahayag na hindi tayo pinakikitunguhan ng Diyos ayon sa sukat ng ating mga kasalanan at kasamaan
  alternative: Limitahan ito sa mga parusang nararanasan sa buhay na ito, o unawain bilang ganap na pagtanggi sa anumang paghatol ng Diyos
  rationale: Malawak ang pahayag ng Hebreo tungkol sa maawaing pakikitungo at hindi pagganti ng Diyos. Hindi ito nililimitahan ng salin sa pansamantalang bunga lamang, ni pinalalawak upang itanggi ang lahat ng paghatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pinakitunguhan’ bilang likas na katumbas ng idiomatikong diwa ng עשה לָנוּ, at pinanatili ang balanseng paralelismo ng dalawang taludtod.
