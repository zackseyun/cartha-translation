  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: tl
  text: 'Purihin mo si Yahweh, kaluluwa ko,

    at huwag mong kalimutan ang lahat ng kanyang mga kabutihan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng pakikitungo niya” o “lahat ng kanyang mga ginanti.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa natatanggap ng isang tao mula sa iba; sa kontekstong ito, mas nangingibabaw ang positibong diwa ng mga kabutihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Purihin mo
  rationale: Ang pandiwa ay isang pautos na nakatuon sa sariling kaluluwa ng makata. Kapag Diyos ang tuwirang layon ng ברך, likas na ipinahahayag nito ang pagpupuri at pagpaparangal; mas malinaw ito sa karaniwang modernong Tagalog kaysa sa literal ngunit madaling mapagkamalang pagbibigay ng pagpapala na “pagpalain mo.”
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Dito, kinakausap ng makata ang kanyang sariling pagkatao. Pinananatili ng “kaluluwa ko” ang tuwirang pagtawag at ang matulaing himig nang hindi nililimitahan ang salita sa isang teknikal na konsepto ng hiwalay na espirituwal na bahagi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang “Yahweh” upang mapanatili ang personal at tipanang pangalan ng Diyos na hayagang nasa tekstong Hebreo.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: at huwag mong kalimutan
  rationale: Tuwirang ipinapahayag ng pariralang ito ang kasunod na negatibong utos. Ang “at” ay nagpapanatili sa payak na pag-uugnay ng Hebreo nang hindi nagdaragdag ng di-tahasang pagsalungat.
- source_word: כָּל גְּמוּלָיו
  choice: ang lahat ng kabutihang ginawa niya sa iyo
  rationale: Maaaring tumukoy ang גמול sa pakikitungo, ganti, o benepisyong tinanggap. Ipinakikita ng kasunod na talaan ng mapagbiyayang gawa ni Yahweh na positibo ang diwa rito. Ginagawang likas at malinaw ng “kabutihang ginawa niya sa iyo” ang kahulugan sa Tagalog, habang inilalahad sa talababa ang mas malawak na saklaw ng salitang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa pinagmulang teksto, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng pag-uutos sa kaluluwa na ברך kay Yahweh
  choice: Purihin mo
  alternative: Pagpalain mo
  rationale: Pinananatili ng “Purihin mo” ang layunin ng pananalita kapag ang Diyos ang tumatanggap ng ברך, at iniiwasan ang pahiwatig sa modernong Tagalog na ang tao ang nagkakaloob ng biyaya sa Diyos. Hindi nito itinatanggi ang mas malawak na diwa ng pagpupuri, pagpaparangal, at pagpapahayag na pinagpala si Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang matulaing himig. Ang “kaluluwa ko” ay pinanatili bilang tuwirang pagtawag sa sarili. Ginamit ang “niya sa iyo” dahil kinakausap ng makata ang sarili; nililinaw nito sa Tagalog ang nakikinabang nang hindi binabago ang tinutukoy na persona.
