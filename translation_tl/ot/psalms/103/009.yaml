  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: tl
  text: 'Hindi siya palaging makikipagtalo[a],

    ni magkikimkim magpakailanman.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “makikipagtunggali” o “magpaparatang.” Ang pandiwa ay maaaring tumukoy sa pakikipagtalo o sa paghaharap ng isang usapin laban sa iba.
    reason: lexical_alternative
  - marker: b
    text: O, “magkikimkim ng galit” o “magtatanim ng sama ng loob.” Ang pandiwang Hebreo ay literal na may diwang “mag-ingat, magbantay, o magpanatili,” ngunit sa ganitong konteksto ay tumutukoy sa patuloy na pagkikimkim. Hindi tahasang binanggit sa Hebreo kung ano ang kinikimkim.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Ipinahahayag ng לְנֶצַח ang walang takdang tagal; likas itong katumbas sa makabagong Filipino at kaagapay ng לְעוֹלָם sa ikalawang taludtod.
- source_word: יָרִיב
  choice: makikipagtalo
  rationale: Ang ריב ay maaaring tumukoy sa pakikipagtalo, pakikipagtunggali, o paghaharap ng paratang. Pinananatili ng “makikipagtalo” ang malawak na ugnayang-hudisyal na diwa nang hindi ito nililimitahan sa isang pormal na paglilitis.
- source_word: לְעוֹלָם
  choice: habang panahon
  rationale: Ang עוֹלָם ay tumutukoy sa walang takda o nagpapatuloy na panahon. Iniiwasan ng “habang panahon” ang mekanikal na pag-uulit ng “magpakailanman” habang pinananatili ang paralelismo.
- source_word: יִטּוֹר
  choice: magkikimkim
  rationale: Ang נטר ay may diwang mag-ingat o magpanatili at, sa ganitong konteksto, ay idyomatikong tumutukoy sa pagkikimkim ng galit o sama ng loob. Likas sa Filipino ang “magkimkim,” at maaari nitong panatilihing di-binanggit ang layon gaya sa Hebreo.
theological_decisions:
- issue: Kung tahasang babanggitin ang galit bilang layon ng יִטּוֹר
  choice: 'Hindi tahasang binanggit ang layon: “magkikimkim.”'
  alternative: “magkikimkim ng galit” o “magtatanim ng sama ng loob”
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, bagaman ipinahihiwatig ng konteksto ang galit ng Diyos. Pinananatili ng salin ang maikli at bahagyang di-tiyak na anyo ng tula.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkatimbang na taludtod at ang di-binanggit na layon sa ikalawa; ipinaliwanag sa talababa ang idyomatikong diwa.
