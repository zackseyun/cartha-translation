  text: אֱ֭נוֹשׁ כֶּ/חָצִ֣יר יָמָ֑י/ו כְּ/צִ֥יץ הַ֝/שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: tl
  text: Ang tao—ang kanyang mga araw ay tulad ng damo; tulad ng bulaklak sa parang, gayon siya namumukadkad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gayon siya sumisibol.” Inilalarawan ng pandiwang Hebreo ang pagsibol o pamukadkad ng isang bulaklak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: ang tao
  rationale: Tumutukoy ang אֱנוֹשׁ sa tao bilang marupok at mortal. Likas sa modernong Tagalog ang “ang tao” bilang pangkalahatang pagtukoy habang pinananatili ang isahang larawang patula.
- source_word: כֶּחָצִיר
  choice: tulad ng damo
  rationale: Malinaw at natural na ipinahahayag ng “tulad ng” ang paghahambing na minamarkahan ng prefixed כ.
- source_word: יָמָיו
  choice: ang kanyang mga araw
  rationale: Tuwirang pinananatili ang plural na “mga araw” at ang ikatlong panauhang isahang panlalaking hulapi; sa konteksto, tumutukoy ito sa haba ng buhay ng tao.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: tulad ng bulaklak sa parang
  rationale: Ang צִיץ ay bulaklak o pamumulaklak, at ang הַשָּׂדֶה ay bukid o parang. Mas natural at malinaw sa larawang patula ang “bulaklak sa parang” nang hindi labis na tinutukoy ang uri nito.
- source_word: כֵּן
  choice: gayon
  rationale: Pinananatili ng “gayon” ang tahasang pang-abay na naghuhudyat kung paano tumutugma ang tao sa bulaklak sa paghahambing.
- source_word: יָצִיץ
  choice: siya namumukadkad
  rationale: Ang pandiwa ay naglalarawan ng pagsibol o pamukadkad. Ang “namumukadkad” ay natural na salitang Filipino para sa pagbubukas at pagyabong ng bulaklak at pinananatili ang metaporang inilalapat sa tao.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na himig patula. Pinanatili ang isahang pangkalahatang “tao,” ang pag-uulit ng paghahambing, at ang literal na imahen ng pamumukadkad sa halip na gawing abstraktong “umuunlad.”
