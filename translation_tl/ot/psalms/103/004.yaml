  text: הַ/גּוֹאֵ֣ל מִ/שַּׁ֣חַת חַיָּ֑יְ/כִי הַֽ֝/מְעַטְּרֵ֗/כִי חֶ֣סֶד וְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/004.yaml
  text: who redeems your life from the pit[a], who crowns you with steadfast love and compassion[b],
translation:
  language: tl
  text: 'na tumutubos sa buhay mo mula sa hukay[a],

    na pinuputungan ka ng tapat na pag-ibig at habag[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kapahamakan” o “mula sa libingan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “awa” o “masidhing pagkahabag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: na tumutubos
  rationale: Pinananatili ng “tumutubos” ang diwa ng גאל na pagbawi at pagliligtas, pati ang mas malalim nitong ugnayang tipan, nang hindi nililimitahan ang larawan sa isang legal na tungkulin.
- source_word: מִשַּׁחַת
  choice: mula sa hukay
  rationale: Ang “hukay” ang pinakakongkreto at tuwirang katumbas ng שַׁחַת, habang maaari pa rin itong tumukoy sa kamatayan o kapahamakan.
- source_word: חַיָּיִכִי
  choice: sa buhay mo
  rationale: Ang “buhay mo” ay likas sa modernong Tagalog at tumutukoy sa buong buhay ng tao; hindi nito ipinapasok ang mas makitid na diwa ng isang hiwalay at di-materyal na “kaluluwa.”
- source_word: הַמְעַטְּרֵכִי
  choice: na pinuputungan ka
  rationale: Pinananatili nito ang metapora ng עטר—paglalagay ng putong bilang pagpaparangal at pagkakaloob ng mabubuting bagay.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang pagmamahal na matatag, tapat, at may kaugnayan sa tipan, nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: וְרַחֲמִים
  choice: at habag
  rationale: Ang “habag” ay natural at marangal na abstraktong pangngalan sa Tagalog para sa masidhing awa at malasakit; bagaman maramihan ang anyong Hebreo, hindi natural sa kontekstong ito ang literal na “mga habag.”
theological_decisions:
- issue: Saklaw ng larawan ng pagtubos
  choice: Malawak na pagliligtas mula sa kapahamakan at kamatayan, na ipinahayag sa wikang patula
  alternative: Eksklusibong pagliligtas mula sa pisikal na kamatayan o, sa kabilang banda, eksklusibong espirituwal na kaligtasan
  rationale: Maaaring saklawin ng larawan ng “hukay” ang mortal na panganib, kamatayan, at kapahamakan. Hindi nililimitahan ng salin ang talata sa iisang kategoryang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na patula, marangal, at madaling maunawaan. Pinanatili ang magkakatugmang participial na hulma sa “na tumutubos” at “na pinuputungan,” gayundin ang kongkretong larawan ng hukay at putong.
