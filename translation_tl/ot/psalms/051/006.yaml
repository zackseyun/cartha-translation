  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: tl
  text: Tunay nga[a], sa kasamaan ako isinilang[b][c], at sa kasalanan ipinaglihi ako ng aking ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Masdan,” “Tiyak,” o “Oo nga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ako ay iniluwal.”
    reason: lexical_alternative
  - marker: c
    text: Madalas unawain ang talatang ito bilang pagpapahayag ng pagiging makasalanan mula pa sa paglilihi, o bilang matinding makatang pananalita sa pagsisisi. Hindi lubusang nilulutas ng Hebreo ang usaping ito.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Tunay nga
  rationale: Nagpapakilala ito ng mariin at taimtim na pahayag. Likas sa makabagong Tagalog ang “Tunay nga,” samantalang pinananatili nito ang diin ng Hebreo.
- source_word: בְּעָוֹן
  choice: sa kasamaan
  rationale: Pinananatili ng “sa” ang malawak na ugnayang ipinahihiwatig ng pang-ukol na בְּ, at inilalarawan ng “kasamaan” ang moral na bigat ng עָוֹן nang hindi tiyakang nagpapasya kung pagkakasala, sala, o makasalanang kalagayan ang pangunahing diin.
- source_word: חוֹלָלְתִּי
  choice: ako isinilang
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pagluwal o pagsilang. Natural sa Tagalog ang “isinilang” at malinaw nitong pinananatili ang larawang kaugnay ng kapanganakan.
- source_word: וּבְחֵטְא
  choice: at sa kasalanan
  rationale: Tuwirang tinutumbasan ng “kasalanan” ang חֵטְא, at pinananatili ng “sa” ang pang-ukol at ang paralelismo sa “sa kasamaan.”
- source_word: יֶחֱמַתְנִי
  choice: ako ipinaglihi
  rationale: Ang pandiwa ay pinakamainam unawain dito bilang paglilihi. Ang pasibong ayos ay natural sa Tagalog at kaayon ng unang sugnay.
- source_word: אִמִּי
  choice: ng aking ina
  rationale: Tuwiran at malinaw na salin ng pangngalang may panandang paari; ang ayos nito ay hinihingi ng pasibong pandiwang “ipinaglihi.”
theological_decisions:
- issue: Kung itinuturo ng talata ang personal na kasalanan ng ina, ang likas na pagkamakasalanan ng mang-aawit mula sa paglilihi, o isang matinding makatang pagpapahayag ng pagsisisi
  choice: Isinalin nang tuwiran ang ugnayan ng paglilihi at pagsilang sa kasamaan at kasalanan, nang hindi nililinaw nang higit sa sinasabi ng Hebreo ang teolohikal na implikasyon nito.
  alternative: Maaaring unawain ang talata bilang pagtukoy sa kasalanan ng ina, bilang pahayag ng pagkamakasalanan ng mang-aawit mula sa paglilihi, o bilang makatang pagmamalabis sa konteksto ng pagsisisi.
  rationale: Iniuugnay ng Hebreo ang pag-iral ng mang-aawit mula paglilihi at pagsilang sa עָוֹן at חֵטְא, ngunit hindi nito tahasang inilalahad ang mekanismo o isang ganap na sistemang doktrinal. Kaya pinananatili ng salin ang tensiyon at kalabuan ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Tunay nga” sa halip na mas arkaikong “Narito,” at pinanatili ang magkatulad na hulma ng “sa kasamaan” at “sa kasalanan” upang maipakita ang paralelismo ng Hebreong tula.
