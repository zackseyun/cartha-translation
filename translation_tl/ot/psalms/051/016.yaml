  text: אֲ֭דֹנָ/י שְׂפָתַ֣/י תִּפְתָּ֑ח וּ֝/פִ֗/י יַגִּ֥יד תְּהִלָּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: tl
  text: Panginoon, buksan mo ang aking mga labi, at ipahahayag ng aking bibig ang papuri sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ginamit bilang banal na titulo sa tuwirang pagtawag; natural at marangal sa makabagong Tagalog ang “Panginoon,” nang hindi ito ipinagkakamali sa pangalang YHWH.
- source_word: שְׂפָתַי
  choice: aking mga labi
  rationale: Pinananatili ang konkretong larawan ng mga labi bilang kasangkapan ng pagsasalita at ang anyong maramihan ng Hebreo.
- source_word: תִּפְתָּח
  choice: buksan mo
  rationale: Ang Qal imperfect sa konteksto ng panalangin ay may lakas ng pakiusap; natural itong ipinahahayag sa Tagalog sa anyong “buksan mo.”
- source_word: וּפִי
  choice: at ... ng aking bibig
  rationale: Pinananatili ang pang-ugnay na “at” at ang paralelismo ng “mga labi” at “bibig”; inayos lamang ang pagkakasunod upang maging natural sa Tagalog.
- source_word: יַגִּיד
  choice: ipahahayag
  rationale: Ang Hiphil ng נגד ay tumutukoy sa pagpapahayag o paghahayag. Ang aspektong di-ganap ay angkop na isalin bilang magiging bunga ng naunang pakiusap.
- source_word: תְּהִלָּתֶךָ
  choice: ang papuri sa iyo
  rationale: Mas natural sa Tagalog kaysa “ang iyong papuri,” na maaaring maunawaang papuring ibinibigay ng Diyos; malinaw na ito ang papuring ukol sa Diyos.
theological_decisions:
- issue: Paglalarawan sa banal na titulo sa tuwirang pagtawag
  choice: Panginoon
  alternative: aking Panginoon
  rationale: Ang אֲדֹנָי ay isang mapitagang banal na titulo. Sapat na ipinahahayag ng “Panginoon” ang tuwirang pagtawag at hindi kailangang idagdag ang “aking,” bagaman maaari itong ipahiwatig ng anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paralelismong “mga labi/bibig” at ang ugnayang pakiusap-bunga nang hindi nagdaragdag ng tahasang “kung gayon.”
