  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: tl
  text: Ituturo ko sa mga suwail ang iyong mga daan, at ang mga makasalanan ay babalik sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaling sa iyo” o “muling babaling sa iyo.” Maaaring ipahayag ng pandiwang Hebreo kapuwa ang pagbaling at pagbabalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: Ituturo ko
  rationale: Ang Hiphil imperfect/cohortative na unang panauhan ay nagpapahayag ng pasiya o layunin. Likas sa modernong Tagalog ang hinaharap na “Ituturo ko.”
- source_word: פֹשְׁעִים
  choice: mga suwail
  rationale: Tumutukoy ang salita sa mga sadyang naghihimagsik o lumalabag. Malinaw at natural ang “mga suwail,” at pinananatili nito ang diwa ng kusang pagsalungat.
- source_word: דְּרָכֶיךָ
  choice: iyong mga daan
  rationale: Pinananatili ng “mga daan” ang metapora ng Hebreo para sa mga paraan, kalooban, at pamumuhay na itinuturo ng Diyos nang hindi ito labis na ipinapaliwanag.
- source_word: חַטָּאִים
  choice: mga makasalanan
  rationale: Karaniwan, malinaw, at tuwirang katumbas ito ng katawagang Hebreo, habang pinananatili ang paralelismo sa “mga suwail.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Tuwirang ipinapahayag ng pariralang ito ang direksiyon patungo sa Diyos nang hindi dinaragdagan ang nilalaman.
- source_word: יָשׁוּבוּ
  choice: babalik
  rationale: Maaaring mangahulugan ang שׁוב ng paglingon, pagbaling, o pagbabalik. Sa konteksto ng pagsisisi at pagpapanumbalik, natural ang “babalik,” ngunit inilalahad sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Wika ng pagsisisi sa שׁוב
  choice: babalik sa iyo
  alternative: baling sa iyo / muling babaling sa iyo
  rationale: Pinananatili ng “babalik” ang relasyonal na diwa ng muling paglapit sa Diyos, ngunit hindi nito ginagawang isang tiyak na doktrinal na pormula ang pagsisisi. Nililinaw ng talababa na maaari ring unawain ang pandiwa bilang pagbaling.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “mga suwail” sa halip na mas teknikal na “mga lumalabag,” at pinanatili ang biblikal na metaporang “iyong mga daan.”
