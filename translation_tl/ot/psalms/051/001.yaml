translation_notes:
  register: 'Modernong Filipino Tagalog na angkop sa isang pamagat ng awit: maikli, dignificado, at malinaw. Ginamit ang “sumiping” upang ihatid ang seksuwal na kahulugan nang hindi ginagawang mas tahasan kaysa sa Hebreong eupemismo.'
