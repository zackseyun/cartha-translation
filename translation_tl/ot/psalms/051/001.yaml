lexical_decisions:
- source_word: בְּבוֹא
  choice: nang puntahan
  rationale: Ang ב na sinusundan ng infinitive construct ay nagpapakilala ng sugnay na pamanahon. Likas sa modernong Tagalog ang “nang puntahan” at naipapakita nito ang paglapit ni Natan sa tinutukoy na lalaki.
- source_word: אֵלָיו
  choice: siya
  rationale: Ang אֶל na may hulaping panlalaking isahan ay nangangahulugang “sa kaniya.” Sa pandiwang “puntahan,” likas na isinasama ang direksiyon sa layon na “siya.”
- source_word: נָתָן
  choice: Natan
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang Hebreo.
- source_word: הַנָּבִיא
  choice: ang propetang
  rationale: Pinananatili ang tiyak na titulong may artikulo, habang ginagamit ang natural na ayos na “ang propetang si Natan.”
- source_word: כַּאֲשֶׁר
  choice: matapos
  rationale: Sa konteksto, ipinahihiwatig nito na nauna ang ginawa kay Batseba bago ang pagpunta ni Natan; malinaw at natural ang “matapos.”
- source_word: בָּא אֶל בַּת שָׁבַע
  choice: sumiping kay Batseba
  rationale: Ang literal na “pumasok kay Batseba” ay isang Hebreong pahiwatig sa pakikipagtalik. Ang “sumiping” ay dignificado, nauunawaan sa modernong Tagalog, at pinananatili ang eupemistikong himig ng pinagmulan.
