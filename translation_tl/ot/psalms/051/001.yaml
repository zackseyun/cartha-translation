  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: tl
  text: nang dumating sa kaniya ang propetang si Natan, matapos siyang sumiping kay Batseba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pumasok kay Batseba,” isang idyomang tumutukoy sa pakikipagtalik.
