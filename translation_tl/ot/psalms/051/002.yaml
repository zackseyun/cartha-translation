  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: tl
  text: Pagpakitaan mo ako ng kagandahang-loob[a], O Diyos, ayon sa iyong tapat na pag-ibig[b]; ayon sa kasaganaan ng iyong habag[c], pawiin mo ang aking mga pagsalangsang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaawaan mo ako.” Ang pandiwang Hebreo ay maaari ring isalin sa pananalitang may “awa,” ngunit pinananatiling iba sa pangunahing teksto upang maiba ito sa mga kasunod na salita para sa tapat na pag-ibig at habag.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong hesed ay tumutukoy sa matatag at tapat na pag-ibig, na madalas may kaugnayan sa katapatan sa tipan.
    reason: lexical_alternative
  - marker: c
    text: O “ayon sa kadakilaan” o “ayon sa dami ng iyong habag.” Maramihan ang anyong Hebreo ng salitang isinaling “habag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Pagpalain mo ako
  rationale: Ang pautos na anyo ng חנן ay paghingi ng kagandahang-loob o pagpapala. Pinananatili nitong naiiba ang salita sa ‘habag’ na ginagamit sa hulihan ng talata.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; likas sa marangal na panalanging Tagalog ang pantawag na ‘O Diyos.’
- source_word: כְּחַסְדֶּךָ
  choice: ayon sa iyong tapat na pag-ibig
  rationale: Ang חסד ay tumutukoy sa matatag at tapat na pag-ibig at kagandahang-loob, na madalas may kaugnayan sa tipan. Ang ‘ayon sa’ ay sumasalamin sa כְּ.
- source_word: כְּרֹב
  choice: ayon sa kasaganaan ng
  rationale: Ang רֹב ay maaaring mangahulugang kasaganaan, dami, o kadakilaan. Natural na kaugnay ng ‘habag’ ang ‘kasaganaan.’
- source_word: רַחֲמֶיךָ
  choice: iyong habag
  rationale: Ang anyong Hebreo ay maramihan at nagpapahayag ng masaganang mahabaging pagkalinga. Sa modernong Tagalog, karaniwang pangngalang di-mabilang ang ‘habag,’ habang naipahahayag ng ‘kasaganaan’ ang dami nito.
- source_word: מְחֵה
  choice: pawiin mo
  rationale: Ang מחה ay nangangahulugang burahin, punasin, o lubusang alisin. Ang ‘pawiin’ ay natural sa Tagalog at pinananatili ang larawan ng pag-aalis.
- source_word: פְשָׁעַי
  choice: aking mga pagsalangsang
  rationale: Ang פשע ay paglabag o paghihimagsik laban sa awtoridad. Ang ‘mga pagsalangsang’ ay nagpapanatili sa maramihang anyo at sa moral na bigat ng salita.
theological_decisions:
- issue: Paglilipat sa magkakaugnay ngunit magkakaibang חנן / חסד / רחמים
  choice: 'Gumamit ng magkakaibang pahayag: ‘Pagpalain mo ako,’ ‘tapat na pag-ibig,’ at ‘habag.’'
  alternative: Gamitin ang ‘awa’ o ‘habag’ para sa lahat ng tatlong salita.
  rationale: Pinagsasama ng Hebreo ang magkakaugnay ngunit hindi magkaparehong mga salita tungkol sa kagandahang-loob, tapat na pag-ibig, at habag ng Diyos. Ang pagkakaiba ng salin ay nagpapanatili sa kayamanang patula at teolohikal ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang ‘O Diyos’ bilang natural na tuwirang pagtawag. Iniwasan ang pag-uulit ng ‘awa’ upang mapanatili ang pagkakaiba ng tatlong salitang Hebreo. Ang ‘pagsalangsang’ ay bahagyang mataas ang rehistro ngunit malinaw sa kontekstong biblikal at pinananatili ang bigat ng paghihimagsik na taglay ng פשע.
