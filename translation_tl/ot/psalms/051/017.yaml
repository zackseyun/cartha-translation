  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: tl
  text: Sapagkat hindi mo kinalulugdan ang hain[a]; kung kinalulugdan mo ito, maghahandog sana ako nito. Hindi ka nalulugod sa handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Dahil hindi mo ninanais ang hain; kung ninanais mo ito, maghahandog sana ako nito.” Pinahihintulutan ng pang-ugnay at ayos ng mga sugnay sa Hebreo ang bahagyang mas pormal na saling ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag at natural ang ganitong ugnayang pangangatwiran sa makatang Filipino.
- source_word: לֹא תַחְפֹּץ
  choice: hindi mo kinalulugdan
  rationale: Ipinapahayag ng חפץ hindi lamang ang pagnanais kundi ang pagkakaroon ng lugod; pinananatili ng salin ang madamdaming himig nito.
- source_word: זֶבַח
  choice: hain
  rationale: Karaniwan at marangal na terminong Filipino para sa sakripisyong inihahandog sa kontekstong panrelihiyon.
- source_word: וְאֶתֵּנָה
  choice: kung hindi, magbibigay sana ako
  rationale: 'Binabasa ang pang-ugnay ayon sa ipinahihiwatig na kundisyon: kung kinalulugdan ang hain, ibibigay iyon ng salmista. Likas sa Filipino ang hulmaing ito at hindi kailangang ulitin ang layon.'
- source_word: עוֹלָה
  choice: handog na sinusunog
  rationale: Tumpak at madaling maunawaang tawag sa teknikal na handog na עוֹלָה, na buong sinusunog sa altar.
- source_word: לֹא תִרְצֶה
  choice: hindi ka nasisiyahan sa
  rationale: Ipinahahayag ng רצה ang mabuting pagtanggap o pagkasiya. Pinananatili nito ang bahagyang pagkakaiba sa naunang חפץ nang hindi ginagawang teknikal ang wika.
theological_decisions:
- issue: Kahulugan ng talata tungkol sa paghahain
  choice: Tuwirang pinananatili ang pahayag na hindi kinalulugdan ng Diyos ang hain sa kalagayan ng nagsisising salmista.
  alternative: Unawain ito bilang ganap at pangkalahatang pagtatakwil sa lahat ng paghahaing panrelihiyon.
  rationale: Hindi dinaragdagan ng salin ang pahayag upang gawing tahasang pag-aalis sa buong sistema ng paghahain. Hinahayaan nitong manatili ang tensiyon sa pagitan ng ritwal na hain at ng pusong nagsisisi sa konteksto ng Awit 51.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “hain” at “handog na sinusunog” bilang likas ngunit sapat na tiyak na mga terminong panritwal; pinanatili rin ang paralelismong patula at ang hindi tahasang layon ng “magbibigay sana ako.”
