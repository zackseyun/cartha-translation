  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: tl
  text: Tunay nga[a], katotohanan ang ninanais mo sa kaloob-looban[b], at sa natatagong bahagi ay ipinaaalam mo sa akin ang karunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Narito” o “Tiyak na.”
    reason: lexical_alternative
  - marker: b
    text: O “sa panloob na pagkatao.” Makatang mga katawagan ang “kaloob-looban” at “natatagong bahagi” para sa panloob na sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tunay nga
  rationale: Nagpapakilala ito ng mariing pahayag. Mas likas sa makabagong Tagalog ang “Tunay nga” kaysa “Narito” kapag hindi literal na pagtuturo ng isang bagay ang gamit.
- source_word: אֱמֶת
  choice: katotohanan
  rationale: Pinananatili ang pangunahing diwa ng katotohanan, pagiging tapat, at tunay na integridad sa harap ng Diyos nang hindi ito nililimitahan sa isang tiyak na doktrinal na pakahulugan.
- source_word: חָפַצְתָּ
  choice: ninanais mo
  rationale: Saklaw ng pandiwa ang pagnanais at pagkakaroon ng lugod. Ang “ninanais mo” ay natural at angkop sa moral na diin ng konteksto.
- source_word: בַטֻּחוֹת
  choice: sa kaloob-looban
  rationale: Tumutukoy sa mga panloob o natatagong bahagi, na makatang larawan ng panloob na pagkatao. Ang “kaloob-looban” ay malinaw at likas sa Tagalog habang pinananatili ang larawan.
- source_word: וּבְסָתֻם
  choice: sa natatagong bahagi
  rationale: Pinananatili ang diwa ng isang bagay o bahaging nakatago at ang pagkakatulad nito sa naunang larawan ng kaloob-looban.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas na angkop sa moral at espirituwal na karunungang ipinababatid ng Diyos.
- source_word: תוֹדִיעֵנִי
  choice: ipinababatid mo sa akin
  rationale: Ipinahahayag ang causative na diwa ng Hiphil ng ידע—ginagawang malaman o ipinakikilala sa nagsasalita—nang hindi ito pinaiikli agad sa mas interpretatibong “tinuturuan mo ako.”
theological_decisions:
- issue: Ang uri ng panloob na katotohanang ninanais ng Diyos
  choice: Inilalarawan ang pagnanais ng Diyos ng katotohanan sa kaloob-looban at ang pagpapabatid niya ng karunungan sa natatagong bahagi ng tao.
  alternative: Unawain ang “katotohanan” nang mas tiyak bilang katapatan sa tipan o bilang sikolohikal na pagkilala sa sarili.
  rationale: Ang Hebreo ay gumagamit ng magkatulad na makatang larawan tungkol sa panloob at natatagong pagkatao. Pinananatili ng salin ang moral at espirituwal na diwa nang hindi nagdaragdag ng mas makitid na sistemang doktrinal.
translation_notes:
  register: Makabago, marangal, at makatang Tagalog. Ginamit ang “Tunay nga” bilang likas na mariing panimula, at pinanatili ang magkatulad na larawan ng kaloob-looban at natatagong bahagi. Ang “ipinababatid” ay bahagyang pormal ngunit malinaw at mas malapit sa causative na anyo ng Hebreo.
