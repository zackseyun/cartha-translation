  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: tl
  text: Ibalik mo sa akin ang galak ng iyong pagliligtas[c], at alalayan nawa ako ng kusang-loob na espiritu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapagbigay na espiritu” o “marangal na espiritu.”
    reason: lexical_alternative
  - marker: b
    text: O “suportahan nawa ako.”
    reason: lexical_alternative
  - marker: c
    text: O “kaligtasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Ibalik mo
  rationale: Ang causative imperative ng שוב ay humihiling sa Diyos na muling ibigay o isauli ang dating taglay; natural sa Filipino ang “ibalik mo.”
- source_word: לִּי
  choice: sa akin
  rationale: Tinutukoy ng parirala ang tumatanggap ng ibinabalik.
- source_word: שְׂשׂוֹן
  choice: galak
  rationale: Tumutukoy ito sa joy o gladness; ang “galak” ay maikli, marangal, at natural sa panalangin.
- source_word: יִשְׁעֶךָ
  choice: iyong pagliligtas
  rationale: Saklaw ng ישע ang pagliligtas at kaligtasan. Pinili ang pandiwang-pangngalang “pagliligtas” upang malinaw na tumukoy sa pagliligtas na mula sa Diyos habang hindi nililimitahan ang uri nito.
- source_word: וְרוּחַ
  choice: at ... espiritu
  rationale: Sa kontekstong ito, ang רוּחַ ay tumutukoy sa espiritu o panloob na disposisyon, hindi sa hangin; pinananatili ng salin ang hindi tiyak na pagtukoy kung ito ay Espiritu ng Diyos o espiritu ng nagsasalita.
- source_word: נְדִיבָה
  choice: handang sumunod
  rationale: Maaaring mangahulugan ang pang-uri ng willing, generous, o noble. Ipinahahayag ng “handang sumunod” ang kusang-loob at tumutugong disposisyon sa natural na Filipino, ngunit inilalagay sa talababa ang iba pang tunay na posibilidad.
- source_word: תִסְמְכֵנִי
  choice: alalayan mo ako
  rationale: Ang סמך ay nangangahulugang umalalay, sumuporta, o magpanatiling matatag. Bilang pakiusap na kahanay ng unang utos, natural ang “alalayan mo ako.”
theological_decisions:
- issue: Saklaw ng יִשְׁעֶךָ sa isang salmong nagsisisi
  choice: iyong pagliligtas
  alternative: iyong kaligtasan
  rationale: Parehong pinahihintulutan ng Hebreo ang konkretong pagliligtas at mas malawak na kaligtasan. Hindi tinutukoy ng salin ang isang makitid na uri ng pagliligtas o nagdaragdag ng doktrinang wala sa talata.
- issue: Pagkakakilanlan at katangian ng רוּחַ נְדִיבָה
  choice: espiritung handang sumunod
  alternative: mapagbigay na espiritu; marangal na espiritu
  rationale: Hindi nililinaw ng Hebreo kung ito ay Espiritu ng Diyos o panloob na espiritu ng salmista. Pinananatili ang maliit na titik at walang idinaragdag na panghalip upang manatili ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tuwirang panalangin at aktibong pakiusap. Ang mga marker na [a], [b], at [c] ay nasa pangunahing teksto; iniugnay ang [a] sa “espiritung handang sumunod,” [b] sa buong pakiusap na “alalayan mo ako,” at [c] sa “pagliligtas.”
