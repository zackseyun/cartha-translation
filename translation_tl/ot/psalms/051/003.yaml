  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: tl
  text: Hugasan mo akong lubusan mula sa aking kasamaan[a], at linisin mo ako mula sa aking kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “mula sa aking pagkakasala” o “mula sa pananagutan ko sa kasalanan”; maaaring saklawin ng salitang Hebreo ang maling gawa at ang pananagutang dulot nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: lubos
  rationale: Pinatitindi ng pang-abay ang kasunod na utos. Ang “lubos” ay likas sa modernong Tagalog at nagpapahayag ng ganap o masusing paghuhugas nang hindi tahasang ipinapalagay ang pag-uulit.
- source_word: כַּבְּסֵנִי
  choice: hugasan mo ako
  rationale: Ang כבס ay karaniwang ginagamit sa paglalaba o masinsing paghuhugas. Pinananatili ng “hugasan mo ako” ang konkretong larawan ng paglilinis at natural itong pakinggan sa Tagalog.
- source_word: מֵעֲוֺנִי
  choice: mula sa aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutang dulot nito. Pinananatili ng “kasamaan” ang bigat na moral at ang pagkakaiba nito sa kasunod na “kasalanan,” nang hindi nililimitahan ang diwa sa pagkadama o kalagayan ng pagkakasala lamang.
- source_word: וּמֵחַטָּאתִי
  choice: at mula sa aking kasalanan
  rationale: Sa kontekstong ito, ang חַטָּאת ay tuwirang tumutukoy sa kasalanan. Ang “kasalanan” ay malinaw, karaniwan, at angkop sa panalanging nagsisisi.
- source_word: טַהֲרֵנִי
  choice: linisin mo ako
  rationale: Ang טהר ay nangangahulugang gawing malinis o dalisay at maaaring magkaroon ng moral at ritwal na pahiwatig. Ang “linisin mo ako” ay natural at sapat na malawak upang mapanatili ang mga pahiwatig na iyon.
theological_decisions:
- issue: Paglalarawan sa magkatambal na mga salitang penitensiyal na עָוֹן at חַטָּאת
  choice: Gamitin ang magkaibang salitang “kasamaan” at “kasalanan.”
  alternative: Isalin ang עָוֹן bilang “pagkakasala” o “pananagutan sa kasalanan,” o gawing halos magkasingkahulugan ang dalawang termino.
  rationale: Magkaugnay ngunit hindi ganap na magkapareho ang dalawang salitang Hebreo. Pinananatili ng magkaibang salin ang tekstura ng paralelismong patula at ang lawak ng עָוֹן, nang hindi nagpapasya kung ang diin nito rito ay nasa maling gawa, pananagutan, o bunga ng kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang panalanging “Hugasan mo… linisin mo” at iniwasan ang mas teknikal o makalumang pananalita.
