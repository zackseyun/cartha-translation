  source_fidelity: Tapat ang salin sa Hebreo. Ang “Sa iyong kagandahang-loob” ay angkop na pagsasalin ng בִּרְצוֹנְךָ na pinananatili ang diwa ng banal na pabor/goodwill nang hindi isinasara ang posibleng diwang “kalooban.” Ang “gawan mo ng mabuti ang Sion” ay naghahatid ng tuwirang pakiusap ng הֵיטִיבָה, at ang “itayo mo ang mga pader ng Jerusalem” ay wastong naghahatid ng kasunod na petisyon sa תִּבְנֶה חוֹמוֹת יְרוּשָׁלִָם.
