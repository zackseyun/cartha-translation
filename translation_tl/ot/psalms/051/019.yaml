id: PSA.51.19
reference: Psalms 51:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: tl
  text: Sa iyong kagandahang-loob[a], gawan mo ng mabuti ang Sion; itayo mo[b] ang mga pader ng Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa iyong paglingap” o “Ayon sa iyong kalooban.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “muling itayo mo,” kung pagpapanumbalik ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: gawan mo ng mabuti
  rationale: Pinananatili ang tuwirang pakiusap ng Hiphil mula sa יטב at ang malawak na diwa ng paggawa ng kabutihan, sa halip na paliitin ito sa mas tiyak na “paunlarin” o “pagpalain.”
- source_word: בִּרְצוֹנְךָ
  choice: sa iyong kagandahang-loob
  rationale: Ipinahahayag ang pabor at kusang mabuting hangarin na saklaw ng רָצוֹן, habang kinikilala sa talababa ang maaari ring diin sa paglingap o kalooban.
- source_word: אֶת צִיּוֹן
  choice: ang Sion
  rationale: Ang אֶת ay pananda ng tuwirang layon; sa pariralang “gawan mo ng mabuti,” likas sa Filipino ang paggamit ng “ang” para sa Sion bilang layon at nakikinabang sa hinihiling na kabutihan.
- source_word: תִּבְנֶה
  choice: itayo mo
  rationale: Ang Qal imperfect ay gumaganap bilang kasunod na pakiusap. Ang “itayo” ay hindi nagpapasya kung unang pagtatayo o pagpapanumbalik ang tinutukoy; inilalahad sa talababa ang “muling itayo.”
- source_word: חוֹמוֹת
  choice: mga pader
  rationale: Tuwirang katumbas ng konkretong pangmaramihang katawagan sa mga pader ng lungsod; hindi pinalalawak sa mas pangkalahatang “mga tanggulan.”
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lungsod sa modernong Filipino.
theological_decisions:
- issue: Ugnayan ng pabor ng Diyos at pagpapanumbalik
  choice: Inilalarawan ang talata bilang panalangin na ang kagandahang-loob ng Diyos ay humantong sa kongkretong kabutihan para sa Sion at sa pagtatayo ng mga pader ng Jerusalem.
  alternative: 'Maaaring unawain nang higit na nakatuon sa pagpapasya ng Diyos: “Ayon sa iyong kalooban, gawan mo ng mabuti ang Sion.”'
  rationale: Maaaring tumukoy ang רָצוֹן kapwa sa pabor at sa kalooban. Pinananatili ng “kagandahang-loob” ang dalawang bahaging ito nang hindi lubusang nilulutas ang tensiyon, at inilalahad ang mas tahasang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong panalangin at ang paralelismo ng dalawang pakiusap. Ginamit ang “Sion,” ang nakaugaliang anyong Filipino sa kontekstong biblikal.
