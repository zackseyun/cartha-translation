  text: For I know my transgressions, and my sin is always before me.
translation:
  language: tl
  text: Sapagkat alam ko ang aking mga pagsuway, at ang kasalanan ko ay laging nasa harapan ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag para sa naunang pagsusumamo. Likas at marangal sa Filipino ang “sapagkat” at malinaw nitong pinananatili ang ugnayang nagpapaliwanag.
- source_word: פְשָׁעַי
  choice: ang aking mga pagsuway
  rationale: Ang פשע ay tumutukoy sa mga paglabag na may diwa ng pagrerebelde o pagsuway. Pinananatili ng “mga pagsuway” ang maramihang anyo at ang bigat ng kusang paglabag sa paraang madaling maunawaan ng makabagong mambabasa.
- source_word: אֲנִי אֵדָע
  choice: alam ko
  rationale: Ang ידע rito ay personal na pagkilala o malinaw na kamalayan sa sariling pagkakasala. Hindi na kailangang dagdagan ng “ako” ang karaniwang ayos sa Filipino; sapat na naipahahayag ng “alam ko” ang tahasang pag-ako nang hindi nagdaragdag ng kahulugang gaya ng pormal na pag-amin.
- source_word: וְחַטָּאתִי
  choice: at ang kasalanan ko
  rationale: Sa konteksto ng pagtatapat, ang חטאת ay “kasalanan,” hindi handog para sa kasalanan. Pinanatili ang isahan, na maaaring tumukoy sa kasalanan bilang kabuuang realidad o sa partikular na pagkakasalang bumabagabag sa nagsasalita.
- source_word: נֶגְדִּי
  choice: nasa harapan ko
  rationale: Pinananatili nito ang larawan ng isang bagay na nakalagay sa harap ng nagsasalita at hindi niya maiiwasang makita o alalahanin.
- source_word: תָמִיד
  choice: laging
  rationale: Natural itong katumbas sa modernong Filipino para sa patuloy at di-nawawalang presensiya ng kasalanan sa kamalayan ng nagsasalita.
theological_decisions:
- issue: Ugnayan ng “mga pagsuway” at “kasalanan”
  choice: Panatilihing magkaiba ang dalawang katawagan
  alternative: Gamitin ang iisang salita, gaya ng “mga kasalanan,” para sa dalawang terminong Hebreo
  rationale: Magkaibang salitang Hebreo ang פשע at חטאת. Ang pagpapanatili sa “mga pagsuway” at “kasalanan” ay hindi nagpapantay sa kanilang lahat ng posibleng pagkakaiba ngunit iniingatan ang pagkakaiba at bigat ng pananalita sa pagtatapat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang tradisyonal na “mga pagsalangsang” at ang mas matinding “mga paghihimagsik,” habang pinananatili ang diwa ng kusang paglabag. Walang kailangang talababa sa talatang ito.
