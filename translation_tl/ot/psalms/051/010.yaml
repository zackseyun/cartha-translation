translation:
  language: tl
  text: Itago mo ang iyong mukha mula sa aking mga kasalanan, at burahin mo ang lahat ng aking mga pagkakasala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga pagkakasala” ay maaari ring tumukoy sa pananagutan o pagkakasalang dulot ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Ikubli mo
  rationale: Pinananatili ang pautos na anyo at ang kongkretong larawan ng pagsusumamong huwag tingnan ng Diyos ang mga kasalanan ng nananalangin.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Tuwirang pinananatili ang antropomorpikong larawan ng Hebreong פָּנִים sa halip na ipakahulugang presensiya o pansin.
- source_word: מֵחֲטָאָי
  choice: sa aking mga kasalanan
  rationale: Ang חטא ay tuwirang tumutukoy sa mga kasalanan o pagsuway; natural sa Filipino ang pariralang 'ikubli ang mukha sa.'
- source_word: וְכָל
  choice: at ... ang lahat ng
  rationale: Pinananatili ang pag-uugnay ng ikalawang kahilingan at ang diin sa kabuuan.
- source_word: עֲוֹנֹתַי
  choice: aking kasamaan
  rationale: Ibinubukod ito sa naunang 'mga kasalanan' upang maipakita ang magkaibang bokabularyo ng Hebreo, habang gumagamit ng likas at marangal na Filipino. Maaari rin itong magdala ng diwang pagkakasala.
- source_word: מְחֵה
  choice: pawiin mo
  rationale: Ang מחה ay nangangahulugang pahirin, burahin, o lubusang alisin. Ang 'pawiin' ay natural sa Filipino at pinananatili ang larawang naglalaho o nabubura ang kasamaan.
theological_decisions:
- issue: Pagpapanatili sa magkaibang katawagan para sa kasalanan
  choice: Isalin ang חטא bilang 'mga kasalanan' at ang עון bilang 'kasamaan.'
  alternative: Gamitin ang 'mga kasalanan' sa dalawang parirala, o isalin ang עון bilang 'pagkakasala.'
  rationale: Gumamit ang Hebreo ng dalawang magkaibang salita sa magkatugmang mga linya. Pinananatili ng salin ang pagkakaibang iyon nang hindi ginagawang mga teknikal na kategoryang doktrinal ang mga salita.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Pinanatili ang kongkretong larawang 'iyong mukha' at ang dalawang pautos na kahilingan. Isang talababa ang ginamit upang ipakita ang saklaw ng kahulugan ng עון nang hindi pinabibigat ang pangunahing teksto.
