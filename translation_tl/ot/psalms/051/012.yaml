source:
  edition: WLC
  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: tl
  text: Huwag mo akong itaboy mula sa iyong presensya, at huwag mong kunin sa akin ang iyong Banal na Espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong banal na espiritu”; mas literal, “ang espiritu ng iyong kabanalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: itaboy
  rationale: Ang Hiphil ng שלך ay nagsasaad ng pagpapalayas o pagtataboy. Natural sa makabagong Tagalog ang “itaboy” at pinananatili nito ang matinding pakiusap na huwag siyang paalisin.
- source_word: מִלְּפָנֶיךָ
  choice: mula sa iyong presensya
  rationale: Bagaman literal na kaugnay ng “mukha” ang פָּנִים, ang pariralang ito ay idyomatikong tumutukoy sa pagiging nasa harap o presensya ng Diyos. Malinaw at marangal sa Tagalog ang “mula sa iyong presensya.”
- source_word: רוּחַ קָדְשְׁךָ
  choice: iyong Banal na Espiritu
  rationale: Ang konstruktong Hebreo ay maaaring unawaing “iyong banal na espiritu” o, mas literal, “espiritu ng iyong kabanalan.” Ang “iyong Banal na Espiritu” ay natural na tumutukoy sa sariling Espiritu ng Diyos, samantalang inilalahad sa talababa ang tunay na anyong alternatibo.
- source_word: תִּקַּח
  choice: kunin
  rationale: Ang לקח ay karaniwang nangangahulugang “kunin.” Pinananatili ng “kunin” ang tuwiran at kongkretong pananalita ng Hebreo nang hindi dinaragdagan ng interpretasyong gaya ng “bawiin” o “ilayo.”
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Sa konstruksiyong “kunin sa akin,” natural na ipinahahayag ng “sa akin” ang kahulugang “mula sa akin” ng Hebreo.
theological_decisions:
- issue: Paglalagay ng malaking titik sa רוּחַ קָדְשְׁךָ
  choice: iyong Banal na Espiritu
  alternative: iyong banal na espiritu; espiritu ng iyong kabanalan
  rationale: Sa konteksto, ang parirala ay tumutukoy sa sariling Espiritu ng Diyos. Gayunman, hindi ipinipilit ng anyong Hebreo ang kapitalisasyon, kaya pinananatili sa talababa ang mga posibleng saling nagpapakita ng leksikal at teolohikal na tensiyon.
translation_notes:
  register: Makabago, tuwiran, at marangal ang pananalita. Ginamit ang “itaboy” upang mapanatili ang lakas ng Hebreo, at “presensya” bilang natural na salin ng idyomang literal na tumutukoy sa pagiging nasa harap ng mukha ng Diyos.
