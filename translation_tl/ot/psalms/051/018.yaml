source:
  edition: WLC
  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: tl
  text: Ang mga hain sa Diyos ay espiritung bagbag[a]; pusong bagbag at durog[b], O Diyos, ay hindi mo hahamakin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘espiritung nagsisisi.’
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ‘pusong bagbag at nagsisisi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: mga hain sa Diyos
  rationale: Pinananatili nito ang metapora ng paghahain at ang ugnayan sa Diyos nang hindi tahasang idinaragdag na ang mga ito ay ‘kalugod-lugod’ o ‘katanggap-tanggap’ sa kanya.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: espiritung bagbag
  rationale: Ang רוּחַ ay ‘espiritu,’ at ang נִשְׁבָּרָה ay literal na ‘bagbag’ o ‘wasak.’ Likas sa Filipino ang ‘espiritung bagbag’ at hindi nito agad pinapalitan ang konkretong metapora ng interpretasyong ‘nagsisisi.’
- source_word: לֵב נִשְׁבָּר
  choice: pusong bagbag
  rationale: Tuwirang itinatapat ang לֵב na ‘puso’ at inuulit ang salitang ‘bagbag’ upang mapanatili ang pag-uulit ng ugat na שבר sa Hebreo.
- source_word: וְנִדְכֶּה
  choice: at durog
  rationale: Ang anyo mula sa דכה ay tumutukoy sa pagiging dinurog o pinisa. Pinananatili ng ‘durog’ ang matinding konkretong larawan at ang pagkakatulad nito sa ‘bagbag.’
- source_word: לֹא תִבְזֶה
  choice: hindi mo hahamakin
  rationale: Ang בזה ay nangangahulugang hamakin o ituring na walang halaga. Ang ‘hahamakin’ ay tuwiran, dignificado, at angkop sa panalanging nakatuon sa Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin ito rito kapwa sa pariralang nauugnay sa mga hain at sa tuwirang pagtawag sa Diyos.
theological_decisions:
- issue: Metaporikal na paghahain sa konteksto ng pagsisisi
  choice: Inilalarawan ng talata ang bagbag na espiritu at pusong bagbag at durog bilang mga hain sa Diyos.
  alternative: Maaaring ipakahulugan na ganap nitong pinawawalang-bisa ang lahat ng panlabas na paghahain, o na karaniwang dalamhati lamang ang tinutukoy nito.
  rationale: Itinatapat ng Hebreo ang ‘mga hain sa Diyos’ sa panloob na kalagayang binanggit. Pinananatili ng salin ang diin sa taos-pusong pagpapakumbaba at pagsisisi, ngunit hindi ito nagdaragdag ng pahayag tungkol sa ganap na pag-aalis ng sistemang paghahain.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maiikli at matitinding salitang ‘bagbag’ at ‘durog’ upang mapanatili ang parallelismo at konkretong larawan ng Hebreo. Ang ‘O Diyos’ ay pinanatili bilang tuwirang panawagan.
