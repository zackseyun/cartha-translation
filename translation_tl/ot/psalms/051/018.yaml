  source_fidelity: 'Tapat ang salin sa pangunahing Hebreong mga parirala: ang mga hain, espiritung bagbag, pusong bagbag at durog, at ang pahayag na hindi ito hahamakin ng Diyos. Ang “mga hain sa Diyos” ay likas na Filipino at sapat na inilalahad ang kontekstuwal na diwa ng konstruksyong Hebreo nang hindi nagdaragdag ng interpretasyong tulad ng “kinalulugdan.”'
  naturalness: 'Natural at marangal ang daloy: “espiritung bagbag” at “pusong bagbag at durog” ay malinaw, matalinghaga, at angkop sa makabagong Filipino Tagalog na may panitikang-biblikal na rehistro. Ang pag-uulit ng “bagbag” ay mabuting katapat ng pag-uulit sa Hebreo.'
