translation:
  language: tl
  text: 'Lumikha ka sa loob ko ng pusong malinis[a], O Diyos,


    at panibaguhin mo sa loob ko ang espiritung matatag[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pusong dalisay.”
    reason: lexical_alternative
  - marker: b
    text: O “espiritung wasto.” Ang salitang Hebreo ay maaari ring magpahiwatig ng isang espiritung matibay o matatag.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: pusong malinis
  rationale: Pinananatili ng “puso” ang malawak na diwa ng לֵב bilang sentro ng pag-iisip, pagpapasya, at damdamin. Ang “malinis” ay angkop sa konteksto ng paglilinis sa salmo at taglay ang moral at rituwal na pahiwatig ng טָהוֹר.
- source_word: בְּרָא לִי
  choice: Lumikha ka sa loob ko
  rationale: Ang ברא ay karaniwang tumutukoy sa malikhaing gawa ng Diyos. Bagaman ang לִי ay literal na “para sa akin,” ipinahahayag ng “sa loob ko” ang hinihinging panloob na pagbabago sa natural na Tagalog.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Malinaw na tuwirang pagtawag ito sa Diyos sa anyong panalangin.
- source_word: רוּחַ נָכוֹן
  choice: espiritung matatag
  rationale: Pinananatili ng “espiritu” ang lawak ng רוּחַ at ang pagkakatulad nito sa “puso.” Ang “matatag” ay nagpapahayag ng pagiging matibay, pirmi, o matatag na taglay ng נָכוֹן sa kontekstong ito.
- source_word: חַדֵּשׁ בְּקִרְבִּי
  choice: panibaguhin mo sa kalooban ko
  rationale: Ang “panibaguhin” ay natural na nagpapahayag ng pagpapanumbalik at muling pagpapasigla. Ang “sa kalooban ko” ay tumutukoy sa pinakaloob na pagkatao nang hindi gumagamit ng lipas o teknikal na pananalita.
theological_decisions:
- issue: Kahulugan ng נָכוֹן sa pariralang רוּחַ נָכוֹן
  choice: espiritung matatag
  alternative: espiritung wasto
  rationale: Higit na tuwirang ipinahihiwatig ng Hebreo ang katatagan o pagiging matibay kaysa moral na kawastuhan lamang. Gayunman, tunay na posibleng pagbasa ang “wasto,” kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang balanseng paralelismo ng “sa loob ko” at “sa kalooban ko,” habang iniwasan ang sobrang teknikal o denominasyonal na pagpapakahulugan.
