  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: tl
  text: Iparinig mo sa akin ang galak at tuwa[a]; magsaya ang mga butong dinurog mo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hayaan mong marinig ko ang galak at tuwa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga buto”; ipinahihiwatig ng konteksto na mga buto mismo ng salmista ang tinutukoy. Maaari ring isalin ang “dinurog” na “binali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Iparinig mo sa akin
  rationale: 'Ang Hiphil na may hulaping unang panauhan ay tahasang causative: “iparinig mo sa akin.” Natural ito bilang pakiusap sa Diyos at pinananatili ang puwersa ng Hebreo.'
- source_word: שָׂשׂוֹן
  choice: galak
  rationale: Tumutukoy sa matinding kagalakan o pagbubunyi. Ang “galak” ay natural, maikli, at marangal sa makabagong Tagalog.
- source_word: וְשִׂמְחָה
  choice: at tuwa
  rationale: Ang “tuwa” ay natural na katambal ng “galak” at pinananatili ang dalawang magkalapit ngunit hindi ganap na magkaparehong salitang patula.
- source_word: תָּגֵלְנָה
  choice: magsaya
  rationale: Ang Qal imperfect na pambabaeng maramihan ay maaaring magpahayag ng hiling sa konteksto ng panalangin; ang “magsaya” ay angkop na volitional na salin.
- source_word: עֲצָמוֹת
  choice: ang mga buto
  rationale: Walang tahasang hulaping “aking” sa Hebreo. Pinananatili ng salin ang literal na “mga buto,” bagaman malinaw sa konteksto na sa salmista ang mga ito.
- source_word: דִּכִּיתָ
  choice: dinurog mo
  rationale: Ang pandiwa ay nagpapahiwatig ng pagdurog o matinding pagpapabagsak. Pinananatili ng “dinurog mo” ang matalas na talinghaga at ang tuwirang pag-uukol ng kilos sa Diyos.
theological_decisions:
- issue: Ang pagdurusa ay tuwirang iniuukol sa Diyos
  choice: “ang mga butong dinurog mo”
  alternative: “ang mga butong nadurog” o “ang mga butong binali mo”
  rationale: Ang ikalawang panauhang panlalaking isahan sa Hebreo ay tuwirang nagsasabing ang Diyos ang gumawa ng pagdurog. Hindi ito pinalalabo upang mapanatili ang teolohikal na tensiyon ng panalangin.
translation_notes:
  register: Makabago at dignified na Filipino. Ginamit ang “iparinig mo sa akin” upang tapat na maipahayag ang causative na anyo, at “galak at tuwa” upang mapanatili ang patulang pagtatambal. Iniwasan ang pagdaragdag ng “aking” sa pangunahing teksto dahil wala itong tahasang katumbas sa Hebreo.
