base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: tl
  text: Sa gayon, malulugod ka sa mga matuwid na handog[a], sa handog na sinusunog at sa handog na lubos na sinusunog[b]; sa gayon, maghahandog sila ng mga toro sa iyong altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog ng katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang parirala bilang “sa handog na sinusunog, samakatuwid ay handog na lubos na sinusunog,” o “sa isang handog na lubos na sinusunog.” Pinag-iiba ngunit malapit na pinag-uugnay rito ng Hebreo ang “handog na sinusunog” at “lubos na handog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: malulugod ka
  rationale: Likas na ipinahahayag nito ang kasiyahan o pagkalugod sa isang bagay, ayon sa diwa ng חפץ.
- source_word: זִבְחֵי צֶדֶק
  choice: mga matuwid na handog
  rationale: Malinaw sa makabagong Tagalog at pinananatili ang moral at tipanang diwa ng צֶדֶק; ang literal na anyo ay nakatala sa talababa.
- source_word: עוֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang katawagan sa handog na sinusunog sa altar at nauunawaan ng pangkalahatang mambabasa.
- source_word: וְכָלִיל
  choice: handog na lubos na sinusunog
  rationale: Ipinakikita ng כָלִיל ang pagiging buo o lubos ng handog habang pinananatili ang pagkakaugnay at pagkakaiba nito sa עוֹלָה.
- source_word: יַעֲלוּ
  choice: maghahandog sila
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng עלה ay tumutukoy sa pagpapailanglang o paghahandog sa altar; natural sa Tagalog ang aktibong 'maghahandog sila.'
- source_word: מִזְבַּחֲךָ
  choice: iyong altar
  rationale: Tuwirang katumbas ng altar na pag-aari ng Diyos na kinakausap.
- source_word: פָרִים
  choice: mga toro
  rationale: Tuwiran at angkop na katumbas ng mga lalaking bakang inihahandog.
- source_word: אָז ... אָז
  choice: Kung magkagayon ... kung magkagayon
  rationale: Pinananatili ang dalawang ulit na panandang naghahayag ng bunga o kalagayang kasunod ng naunang panalangin.
theological_decisions:
- issue: Katanggap-tanggap na paghahandog matapos bigyang-diin ng salmo ang nagsisising puso kaysa ritwal na hain
  choice: Pinanatili ang kongkretong wika tungkol sa muling katanggap-tanggap na mga handog.
  alternative: Unawain ang talata bilang pag-aalis sa literal na paghahandog o bilang huling liturhikong dagdag lamang.
  rationale: Hindi tahasang itinatakwil ng salmo ang lahat ng handog; pinananatili ng salin ang tensiyon na ang mga ito ay kalugod-lugod sa konteksto ng pagpapanumbalik at tunay na pagsisisi, nang hindi ipinapasok sa teksto ang isang tiyak na paliwanag sa kasaysayan ng pagkakabuo nito.
- issue: Ugnayan ng עוֹלָה at כָלִיל
  choice: 'Isinalin bilang magkaugnay ngunit magkahiwalay na parirala: ''handog na sinusunog at ... handog na lubos na sinusunog.'''
  alternative: 'Pagsamahin bilang iisang parirala: ''handog na lubos na sinusunog.'''
  rationale: Maaaring ipakahulugan ang Hebreo bilang dalawang magkakaugnay na katawagan o bilang pagpapatindi/apposisyon. Pinananatili sa pangunahing teksto ang pormal na koordinasyon at binabanggit sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'handog' sa halip na mas teknikal o makalumang katawagan; pinanatili ang 'altar' dahil karaniwan at malinaw ito sa kontekstong biblikal. Ang inuulit na אָז ay isinalin nang dalawang beses upang mapanatili ang estruktura ng Hebreo.
