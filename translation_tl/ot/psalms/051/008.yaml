  text: תְּחַטְּאֵ֣/נִי בְ/אֵז֣וֹב וְ/אֶטְהָ֑ר תְּ֝כַבְּסֵ֗/נִי וּ/מִ/שֶּׁ֥לֶג אַלְבִּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: tl
  text: Dalisayin mo ako sa pamamagitan ng hisopo[a], at magiging malinis ako; hugasan mo ako, at magiging mas maputi ako kaysa sa niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Linisin mo ako sa pamamagitan ng hisopo.” Ang pandiwang Hebreo ay kaugnay ng pag-aalis ng kasalanan o karumihan at nagpapahiwatig ng ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Dalisayin mo ako
  rationale: Ang Piel ng חטא dito ay tumutukoy sa pag-aalis ng kasalanan o karumihan, hindi sa pagpapagawa ng kasalanan. Likas sa modernong Tagalog ang “dalisayin” at napananatili nito ang ritwal at moral na diwa.
- source_word: בְאֵזוֹב
  choice: gamit ang isopo
  rationale: Ang isopo ang kasangkapang halaman na kaugnay ng mga ritwal ng paglilinis. Malinaw at natural na ipinapahayag ng “gamit ang” ang instrumental na gamit ng בְּ.
- source_word: וְאֶטְהָר
  choice: at magiging malinis ako
  rationale: Ang טהר ay nangangahulugang maging malinis o dalisay, sa ritwal o moral na diwa. Ang “malinis” ay madaling maunawaan at kaagapay ng larawan ng paghuhugas.
- source_word: תְּכַבְּסֵנִי
  choice: hugasan mo ako
  rationale: Karaniwang tumutukoy ang כבס sa paglalaba o paghuhugas ng damit, ngunit patalinghaga itong inilalapat sa nagsasalita. Pinananatili ng “hugasan mo ako” ang konkretong larawan nang hindi nagiging asiwa.
- source_word: וּמִשֶּׁלֶג
  choice: kaysa sa niyebe
  rationale: 'May pahambing na diwa ang מִן sa konteksto: ang magiging kaputian ay hihigit sa kaputian ng niyebe.'
- source_word: אַלְבִּין
  choice: magiging mas maputi ako
  rationale: Ipinahihiwatig ng Hiphil ng לבן ang pagiging o pagkagawang maputi. Kasama ng pahambing na parirala, natural itong isinalin na “magiging mas maputi ako.”
theological_decisions:
- issue: Paglalapat ng larawang ritwal ng pagdadalisay sa kasalanang moral
  choice: Panatilihin nang tahasan ang “Dalisayin mo ako gamit ang isopo.”
  alternative: “Linisin mo ako gamit ang isopo.”
  rationale: Humahango ang talata sa mga ritwal ng paglilinis sa Israel upang ipahayag ang pagsusumamo na maalis ang kasalanan. Pinananatili ng “isopo” at “dalisayin” ang ugnayan ng ritwal na paglilinis at moral na pagpapanumbalik nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “isopo” bilang nakaugaliang transliterasyon ng halamang ritwal; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
