translation:
  language: tl
  text: Para sa tagapangasiwa ng awitan.[a] Isang salmo ni David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa tagapangasiwa ng awitan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, leDavid; maaaring tumukoy ito sa pagkatha ni David, sa kaugnayan sa kaniya, o sa pag-aalay para sa kaniya. Maaari ring isalin na “kay David” o “para kay David.”
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ang salita sa namumuno o nangangasiwa sa pagtatanghal ng musika. Likas sa modernong Filipino ang “tagapangasiwa ng awitan,” at ipinahihiwatig ng “Para sa” ang unlaping ל nang hindi nililimitahan ang tungkulin sa koro lamang.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ito ang kinikilalang katawagang pang-genre para sa isang awiting panrelihiyon na karaniwang may saliw na musika; malinaw at nakaugat na rin sa gamit-Filipino ang “salmo.”
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang “ni David” ang pinakanatural na maikling anyo sa pamagat sa Filipino. Tulad ng Hebreong לְדָוִד, maaari itong unawain bilang pag-akda o kaugnayan kay David, bagaman mas hindi nito lantad na naipapakita ang posibilidad ng pag-aalay para sa kaniya; nililinaw ito sa talababa.
theological_decisions:
- issue: Kahulugan ng Davidikong pamagat
  choice: ni David
  alternative: kay David / para kay David
  rationale: Hindi tiyak sa Hebreo kung ang kaugnayan ay pag-akda, pagmamay-ari, pag-uugnay, o pag-aalay. Ginamit ang natural na “ni David” sa pangunahing teksto ngunit pinanatili sa talababa ang tunay na lawak ng maaaring kahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tagapangasiwa ng awitan” sa halip na teknikal o makitid na “tagapangasiwa ng koro,” sapagkat hindi tahasang binabanggit ng Hebreo ang koro. Inilagay ang bawat pananda ng talababa kaagad pagkatapos ng pariralang ipinaliliwanag nito.
