base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: tl
  text: Laban sa iyo—sa iyo lamang—ako nagkasala[a], at ginawa ko ang masama sa iyong paningin, upang mapatunayang matuwid ka sa iyong sinabi at walang kapintasan kapag humahatol ka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Laban sa iyo lamang ako nagkasala.” Idiniriin ng pagkakasabi sa Hebreo na ang Diyos ang pinakasukdulang pinagkasalahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang huling bahagi, “upang mapatunayang matuwid ka sa iyong mga salita at malinis sa iyong paghatol.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Laban sa iyo—sa iyo lamang—
  rationale: Sa konteksto ng pagtatapat, ang לְ ay tumutukoy sa pinagkasalahan. Pinananatili ng pag-uulit at mga gitling ang mariing diin ng Hebreo.
- source_word: חָטָאתִי
  choice: ako nagkasala
  rationale: Likas na salin ng Hebreong perfect sa isang tuwirang pagtatapat; hindi kailangang gawing tahasang aspektong pangkasalukuyang-bunga sa Tagalog.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: at ginawa ko ang masama sa iyong paningin
  rationale: Pinananatili ang moral na bigat ng substantibong 'masama' at ang larawang Hebreo na 'sa iyong paningin.'
- source_word: לְמַעַן
  choice: upang
  rationale: Naipahahayag ang sadyang hindi lubusang tiyak na ugnayang layunin o kinalabasan nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: תִּצְדַּק בְדָבְרֶךָ
  choice: mapatunayang matuwid ka sa iyong sinabi
  rationale: Ipinapakita ang forensic na diwa ng pagiging nasa tama o napatunayang matuwid, habang natural na isinasalin ang singular na דָּבָר bilang 'iyong sinabi.'
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: walang kapintasan kapag humahatol ka
  rationale: Ang זכה ay nagpapahiwatig ng pagiging malinis o walang maipipintas; ang בְּשָׁפְטֶךָ ay natural na mababasa bilang temporal na 'kapag humahatol ka.'
theological_decisions:
- issue: Ang pahayag na sa Diyos lamang nagkasala kahit may mga taong nasaktan
  choice: Panatilihin ang ganap at mariing 'Laban sa iyo—sa iyo lamang—'
  alternative: '''Higit sa lahat, laban sa iyo'' o ''lalo na laban sa iyo'''
  rationale: Ganito katindi ang pahayag sa Hebreo. Hindi dapat palambutin o lutasin sa salin ang tensiyong teolohikal.
- issue: Ang forensic na diwa ng pagiging matuwid ng Diyos sa huling mga sugnay
  choice: '''mapatunayang matuwid'' at ''walang kapintasan'''
  alternative: '''mapawalang-sala'' at ''malinis'''
  rationale: Pinananatili nito ang legal at moral na parallelism nang hindi nagpapasok ng partikular na sistemang doktrinal.
- issue: Layunin o kinalabasan sa לְמַעַן
  choice: Gamitin ang 'upang' at panatilihin ang posibleng layunin/kinalabasan
  alternative: '''kaya'' o ''na anupa''t'''
  rationale: Maaaring magpahiwatig ang pang-ugnay ng layunin o resulta; hindi dapat tahasang isara ng salin ang ambigwidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang Hebreong diin at parallelism, habang ginawang natural ang mga pariralang panghukuman para sa karaniwang mambabasa.
