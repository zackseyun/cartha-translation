base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: tl
  text: Iligtas mo ako sa pagkakasala sa pagdanak ng dugo[a], O Diyos, Diyos ng aking kaligtasan; at ang aking dila ay aawit nang may galak tungkol sa iyong katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa mga dugo,” isang idyomang maaaring tumukoy sa pagdanak ng dugo o sa pananagutan at pagkakasala dahil dito.
    reason: lexical_alternative
  - marker: b
    text: O “iyong katarungan.” Maaaring saklawin ng salitang Hebreo kapuwa ang moral na katuwiran at ang hudisyal na katarungan.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Iligtas mo ako
  rationale: Ang pautos na anyo ng נצל na may hulaping unang panauhan ay isang tuwirang pagsusumamo para sa pagliligtas; natural at malinaw ito sa makabagong Tagalog.
- source_word: מִדָּמִים
  choice: sa pagkakasala dahil sa pagdanak ng dugo
  rationale: Ang maramihang דמים, literal na “mga dugo,” ay madalas tumukoy sa pagdanak ng dugo o sa pananagutang dulot nito. Sa konteksto ng pagsisisi, ipinahahayag ng salin ang pagkakasala nang hindi nililimitahan ang parirala sa gawa lamang.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: Diyos ng aking kaligtasan
  rationale: Pinananatili ang anyong construct at ang malawak na diwa ng תְּשׁוּעָה bilang kaligtasan o pagliligtas.
- source_word: תְּרַנֵּן
  choice: masayang aawit
  rationale: Ipinahihiwatig ng pandiwa ang masigla at may-galak na tinig ng papuri; ang hinaharap na anyo ay angkop bilang magiging tugon sa pagliligtas.
- source_word: לְשׁוֹנִי
  choice: ang aking dila
  rationale: Pinananatili ang tahasang makatang larawan ng dila bilang kasangkapan ng papuri.
- source_word: צִדְקָתֶךָ
  choice: iyong katuwiran
  rationale: Ang “katuwiran” ay nagpapanatili sa malawak na moral, tipanang, at hudisyal na saklaw ng צְדָקָה, samantalang inilalahad sa talababa ang posibleng diin sa katarungan.
theological_decisions:
- issue: Kahulugan ng maramihang דמים sa pagpapahayag ng pagsisisi
  choice: pagkakasala dahil sa pagdanak ng dugo
  alternative: pagdanak ng dugo; pananagutan sa dugong dumanak
  rationale: Sa konteksto ng salmo, malamang na hindi lamang panganib mula sa karahasan ang tinutukoy kundi ang kasalanan o pananagutan kaugnay ng dugong dumanak. Pinananatili ng talababa ang lawak ng idyomang Hebreo.
- issue: Saklaw ng צִדְקָתֶךָ
  choice: iyong katuwiran
  alternative: iyong katarungan
  rationale: Maaaring taglayin ng salitang Hebreo kapuwa ang moral na katuwiran at hudisyal na katarungan. Hindi ipinapasya ng pangunahing salin ang lahat ng teolohikal na pahiwatig; pinananatili sa talababa ang alternatibong diin.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang payak na pagsusumamo at pinanatili ang makatang larawang “aking dila.” Ang “pagkakasala dahil sa pagdanak ng dugo” ay mas madaling maunawaan kaysa sa teknikal na “pagkakasala sa dugo,” habang ang mga talababa ay nagpapanatili sa tunay na lawak at tensiyon ng Hebreo.
