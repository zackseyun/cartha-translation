  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: tl
  text: Marami ang nagsasabi, “Sino ang magpapakita sa amin ng mabuti? Itaas mo sa amin ang liwanag ng iyong mukha[a], O Yahweh[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “liwanag ng iyong mukha” ay isang patulang larawan ng pabor at mapagpalang presensiya ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Marami ang nagsasabi
  rationale: Ginagamit ang רַבִּים bilang pangngalan para sa di-tiyak na maraming tao, at pinananatili ng “nagsasabi” ang nagpapatuloy o karaniwang diwa ng participle.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: Sino ang magpapakita sa amin ng mabuti?
  rationale: Ang Hiphil ng ראה ay may causative na diwang “magpakita” o “magpangyaring makita.” Ang “mabuti” ay sadyang malawak at hindi nililimitahan sa materyal na kasaganaan.
- source_word: נְסָה עָלֵינוּ
  choice: Itaas mo sa amin
  rationale: Pinananatili ang pautos at ang patulang larawan ng pagtataas o paglalagay ng liwanag sa mga nananalangin, sa halip na tahasang ipakahulugan bilang pagbibigay ng pabor.
- source_word: אוֹר פָּנֶיךָ
  choice: ang liwanag ng iyong mukha
  rationale: Literal na pinananatili ang antropomorpikong larawan ng maningning na mukha ng Diyos; hindi ito pinapalitan sa pangunahing teksto ng interpretasyong “pabor” o “presensiya.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Ang antropomorpikong pariralang “liwanag ng iyong mukha”
  choice: Panatilihin ang mismong metapora
  alternative: ang iyong pabor; liwanag ng iyong presensiya
  rationale: Ipinahahayag ng larawan ang pabor at mapagpalang presensiya ng Diyos, ngunit ang pagsasalin nito bilang abstraktong konsepto sa pangunahing teksto ay magpapawalang-bisa sa tula at magpapasya sa interpretasyon.
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ito bilang pangalan at hindi pinapalitan ng isang titulo.
- issue: Saklaw ng tuwirang pananalita
  choice: Isinama sa sipi ang tanong at ang kasunod na panalangin
  alternative: Tapusin ang sipi pagkaraan ng tanong at ituring na hiwalay na panalangin ng salmista ang ikalawang pangungusap
  rationale: Walang mga panipi sa Hebreo, kaya maaaring pag-usapan ang saklaw ng sinasabi ng “marami.” Ang pagpapatuloy ng sipi ay natural sa konteksto ngunit hindi nilalayong itanggi ang sintaktikong posibilidad ng hiwalay na tinig.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na balangkas ngunit pinananatili ang matapang na larawang Hebreo. Ginamit ang “amin,” sapagkat ang mga nagsasalita ay tuwirang nakikiusap sa Diyos at kaya hindi kabilang ang kausap sa panghalip.
