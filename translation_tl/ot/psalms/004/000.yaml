  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינ֗וֹת מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/000.yaml
  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: sa saliw ng mga instrumentong de-kuwerdas. Isang salmo ni David[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinulat ni David” o “para kay David”; ang pananalitang Hebreo ay maaaring tumukoy sa pagkatha, kaugnayan, pag-aari, o pag-aalay.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa pagtatanghal ng musika. Likas at malinaw sa modernong Filipino ang pariralang ito nang hindi ipinapalagay na koro lamang ang pinamumunuan.
- source_word: בִּנְגִינוֹת
  choice: sa saliw ng mga instrumentong de-kuwerdas
  rationale: Tumutukoy ang salita sa musikang tinutugtog sa mga instrumentong may kuwerdas. Ipinahahayag ng 'sa saliw' ang direksiyong musikal nang hindi labis na tinutukoy ang paraan ng pagtugtog.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang 'salmo' ang kinikilalang katawagan sa uring ito ng awiting panrelihiyon at angkop sa dignidad ng teksto.
- source_word: לְדָוִד
  choice: ni David
  rationale: Pinakanatural itong anyo sa Filipino para sa kaugnayan kay David. Dahil maaari itong mangahulugan ng pagkatha, pag-uugnay, pag-aari, o pag-aalay, nililinaw sa talababa ang tunay na lawak ng Hebreo.
theological_decisions:
- issue: Pagkatha o kaugnayang ipinahihiwatig ng לְדָוִד sa pamagat
  choice: ni David
  alternative: isinulat ni David; para kay David
  rationale: Hindi tiyak sa konstruksiyong Hebreo kung tuwirang pagkatha, kaugnayan, o pag-aalay ang ibig sabihin. Pinananatili ng maikling salin at ng talababa ang kalabuan sa halip na magtakda ng isang historikal o doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa isang pamagat na liturhikal. Ginamit ang 'tagapangasiwa ng awitan' sa halip na mas makitid na 'tagapangasiwa ng koro,' at inilagay ang [a] kaagad pagkatapos ng 'David,' na siyang tinutukoy ng talababa.
