  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: tl
  text: Kayong mga anak ng tao, hanggang kailan ninyo gagawing kahihiyan ang aking dangal[a]? Iibigin ba ninyo ang walang kabuluhan at hahanapin ang kasinungalingan? Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking kaluwalhatian.” Ang salitang Hebreo ay maaaring tumukoy sa dangal, kaluwalhatian, o bigat ng katayuan; dito, malamang na tumutukoy ito sa dangal ng mang-aawit na inilalagay sa kahihiyan sa harap ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: Kayong mga anak ng tao
  rationale: Pinananatili ang Hebreong idyoma at ang tuwirang pagtawag sa mga lalaking kalaban, habang ginagawang natural ang panawagan sa Filipino sa pamamagitan ng “kayong.”
- source_word: עַד מֶה
  choice: hanggang kailan
  rationale: Ito ang natural na katumbas sa Filipino ng tanong na nagpapahayag ng matagal nang pagtutol o panaghoy.
- source_word: כְבוֹדִי
  choice: aking dangal
  rationale: Maaaring mangahulugan ang כָּבוֹד ng dangal o kaluwalhatian. Sa konteksto ng pampublikong kahihiyan, malinaw at natural ang “dangal,” ngunit pinananatili sa talababa ang tunay na alternatibong “kaluwalhatian.”
- source_word: לִכְלִמָּה
  choice: gagawing kahihiyan
  rationale: 'Ipinahahayag nito ang resultang diwa ng pariralang Hebreo: ang dangal ng nagsasalita ay ginagawang dahilan o kalagayan ng kahihiyan.'
- source_word: תֶּאֱהָבוּן
  choice: iibigin ba ninyo
  rationale: Ang imperpektibong anyo sa isang pasumbat na tanong ay maaaring magpahiwatig ng nagpapatuloy o kusang pinipiling gawain; ang ayos na ito ay likas sa modernong Filipino.
- source_word: רִיק
  choice: walang kabuluhan
  rationale: Sinasaklaw nito ang diwa ng kawalan, kahungkagan, at pagiging walang saysay nang hindi gumagamit ng lipas o di-natural na salita.
- source_word: תְּבַקְשׁוּ
  choice: hahanapin
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang humanap o maghangad at pinananatili ang paralelismo sa “iibigin.”
- source_word: כָזָב
  choice: kasinungalingan
  rationale: Pinananatili ang abstraktong pangngalang isahan at ang patulang pagtutugma nito sa “walang kabuluhan.”
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa baybay bilang tradisyonal na tandang panliturhiya sapagkat hindi tiyak ang eksaktong kahulugan at tungkulin nito.
theological_decisions:
- issue: Tinutukoy ng “aking dangal”
  choice: Hindi tinukoy kung ito ay personal o maharlikang dangal ng mang-aawit, o dangal na ipinagkaloob sa kaniya ng Diyos.
  alternative: aking kaluwalhatian; ang dangal na ibinigay sa akin ng Diyos
  rationale: Malawak ang saklaw ng Hebreong כְבוֹדִי at hindi nito tahasang nililimitahan ang tinutukoy. Pinananatili ng salin ang kalabuan at hindi nagdaragdag ng tiyak na paliwanag na teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang tuwirang panawagan at ang Hebreong idyomang “mga anak ng tao,” ngunit iniwasan ang lipas o labis na teknikal na pananalita. Inilagay ang talababa sa “aking dangal,” ang salitang talagang may leksikal na alternatibong “aking kaluwalhatian.”
