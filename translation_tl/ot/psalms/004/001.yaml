  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: tl
  text: Kapag tumatawag ako, sagutin mo ako, O Diyos ng aking katuwiran.[a] Sa gitna ng kagipitan, binigyan mo ako ng luwag.[b] Pagpakitaan mo ako ng kagandahang-loob at dinggin ang aking panalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “matuwid kong Diyos” o “Diyos na nagbibigay-katuwiran sa akin.” Literal sa Hebreo: “Diyos ng aking katuwiran.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring “binigyan mo ako ng ginhawa.” Larawang spatial ang nasa Hebreo: mula sa masikip na kalagayan ay binigyan ako ng Diyos ng luwag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Kapag tumatawag ako
  rationale: Ang ב na kasunod ng infinitive construct at hulaping unang panauhan ay temporal dito. Pinananatili ng “tumatawag” ang payak na diwa ng קרא nang hindi sapilitang dinaragdagan ng mas matinding damdaming nasa “sumisigaw.”
- source_word: עֲנֵנִי
  choice: sagutin mo ako
  rationale: Karaniwan at natural na katumbas sa panalangin ang “sagutin mo ako” para sa pandiwang ענה.
- source_word: אֱלֹהֵי צִדְקִי
  choice: O Diyos ng aking katuwiran
  rationale: Tuwirang pinananatili nito ang construct chain ng Hebreo at ang pagiging bukas nito kung ang tinutukoy ay Diyos bilang bukal ng katuwiran o bilang siyang nagbibigay-katuwiran at nagtatanggol sa nananalangin.
- source_word: בַּצָּר
  choice: Sa gitna ng kagipitan
  rationale: Ipinahahayag ng צַר ang gipit, hirap, o makitid na kalagayan. Natural sa modernong Tagalog ang “kagipitan” at angkop sa matalinghagang paghahambing sa luwag.
- source_word: הִרְחַבְתָּ לִּי
  choice: binigyan mo ako ng luwag
  rationale: Pinananatili ng “luwag” ang larawang mula sa pagiging makipot tungo sa pagiging maluwag, habang maaari rin itong maunawaan bilang ginhawa o pagliligtas.
- source_word: חָנֵּנִי
  choice: Pagpakitaan mo ako ng kagandahang-loob
  rationale: Ipinahahayag nito ang pangunahing diwa ng חנן na magpakita ng pabor o biyaya, nang hindi ito tuwirang pinapantay lamang sa awa.
- source_word: וּשְׁמַע
  choice: at dinggin
  rationale: Sa konteksto ng panalangin, ang “dinggin” ay natural at marangal na Tagalog para sa pakikinig na may pagtugon.
- source_word: תְּפִלָּתִי
  choice: ang aking panalangin
  rationale: Ito ang tuwiran at karaniwang katumbas ng תְּפִלָּה.
theological_decisions:
- issue: Kahulugan ng “Diyos ng aking katuwiran”
  choice: Panatilihin sa pangunahing teksto ang pormal na pariralang “Diyos ng aking katuwiran.”
  alternative: “Matuwid kong Diyos” o “Diyos na nagbibigay-katuwiran sa akin.”
  rationale: Hindi ipinipilit ng Hebreong construct ang iisang paliwanag. Pinananatili ng salin ang tensiyon sa pagitan ng Diyos bilang pinagmumulan o saligan ng katuwiran ng salmista at ng Diyos bilang siyang nagbibigay-katuwiran o nagtatanggol sa kaniya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal at sadyang bukas na “Diyos ng aking katuwiran,” samantalang ginawang natural ang spatial na larawan sa “binigyan mo ako ng luwag.”
