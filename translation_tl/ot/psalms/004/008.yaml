  text: Payapa akong hihiga at matutulog[a], sapagkat ikaw lamang, Yahweh[b], ang nagpapatahan sa akin nang ligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sa kapayapaan ay sabay akong hihiga at matutulog.” Ang Hebreong pang-abay ay maaaring mangahulugang “magkasama” o “ganap,” ngunit dito ay natural na tumutukoy sa magkaugnay na dalawang kilos.
    reason: lexical_alternative
