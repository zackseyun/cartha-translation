  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: tl
  text: Naglagay ka ng kagalakan sa puso ko, higit kaysa noong sumagana ang kanilang butil at bagong alak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal, “Mula nang dumami ang kanilang butil at bagong alak.” Karaniwang inuunawa ang pariralang Hebreo bilang paghahambing: ang kagalakang kaloob ng Diyos ay higit sa kagalakang dulot ng materyal na kasaganaan.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Naglagay ka
  rationale: Ang Qal perfect 2ms ng נתן ay tuwirang nakikipag-usap sa Diyos. Likas sa Filipino ang “Naglagay ka” at ipinahihiwatig nitong ang Diyos ang nagkaloob ng kagalakang nananatili sa kalooban.
- source_word: שִׂמְחָה
  choice: kagalakan
  rationale: Tumpak at marangal na katumbas ng joy/gladness, at angkop sa dignidad ng panalangin.
- source_word: בְלִבִּי
  choice: sa puso ko
  rationale: Pinananatili ang karaniwang talinghaga ng Hebreo para sa panloob na pagkatao nang hindi ito labis na binibigyang-kahulugan.
- source_word: מֵעֵת
  choice: higit kaysa noong
  rationale: 'Ipinahahayag ang malamang na pahambing na gamit ng מִן kasunod ng עֵת: ang kagalakang bigay ng Diyos ay higit sa kagalakan sa panahon ng kasaganaan.'
- source_word: דְּגָנָם
  choice: kanilang butil
  rationale: Ang דגן ay tumutukoy sa ani o produktong butil; malinaw at kontemporaryo ang “butil.”
- source_word: וְתִירוֹשָׁם
  choice: at bagong alak
  rationale: Ang תירוש ay karaniwang sariwa o bagong alak, kaya pinananatili ng salin ang larawang pang-agrikultura.
- source_word: רָבּוּ
  choice: sumagana
  rationale: Ang Qal perfect 3cp ng רבה ay nangangahulugang dumami o lumago. Natural na inilalarawan ng “sumagana” ang pagdami ng ani at alak.
theological_decisions:
- issue: Pahambing na sintaks ng talata
  choice: Ang kagalakang inilagay ng Diyos sa puso ng mang-aawit ay higit kaysa kagalakang kaugnay ng masaganang butil at bagong alak.
  alternative: 'Maaari ring unawain nang mas literal: “Mula nang dumami ang kanilang butil at bagong alak, naglagay ka ng kagalakan sa puso ko.”'
  rationale: Karaniwang nauunawaan ang מֵעֵת bilang pamantayan ng paghahambing sa kontekstong ito. Gayunman, pinananatili sa talababa ang mas literal na posibilidad upang hindi maitago ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “kagalakan” at “bagong alak” upang mapanatili ang panloob at pang-agrikulturang larawan ng Hebreo. Ang “higit kaysa noong” ay malinaw sa ordinaryong mambabasa, habang inilalahad sa talababa ang mas literal na alternatibo.
