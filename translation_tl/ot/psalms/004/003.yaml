  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: tl
  text: At alamin ninyo na ibinukod ni Yahweh para sa kanyang sarili ang taong tapat[a]; dinirinig ako ni Yahweh kapag tumatawag ako sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang maka-Diyos” o “ang taong matapat sa tipan.” Ang salitang Hebreo ay maaaring magdiin sa debosyon o sa tapat na paninindigan sa loob ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “diringgin ako ni Yahweh kapag tumawag ako sa kanya.” Ang pandiwang Hebreo ay maaaring tumukoy sa palagiang ginagawa o sa isang tiyak na mangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: At alamin ninyo
  rationale: Ang maramihang pautos ay tuwirang ipinahayag sa natural na Filipino; pinanatili ang pang-ugnay bilang “At” nang hindi ipinapalagay na pasalungat ito.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng dapat malaman, kaya likas sa Filipino ang “na” pagkatapos ng “alamin ninyo.”
- source_word: הִפְלָה
  choice: ibinukod
  rationale: Ang Hiphil ng פלא sa kontekstong may לוֹ ay tumutukoy sa pagtatangi o pagbubukod bilang natatangi para kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: חָסִיד
  choice: ang taong tapat
  rationale: Ipinahahayag nito ang isang taong may debosyon at katapatan, kabilang ang diwa ng katapatan sa tipan, nang hindi ito nililimitahan sa isang makitid na teolohikal na pakahulugan.
- source_word: לוֹ
  choice: para sa kanyang sarili
  rationale: 'Nililinaw nito ang reflexive na diwa: ibinukod ni Yahweh ang taong iyon para sa sarili niya.'
- source_word: יִשְׁמַע
  choice: dinirinig ako
  rationale: Ang imperpektibo ay maaaring magpahayag ng palagian o tiyak na pagtugon. Ang pangkasalukuyang anyo ay natural na naghahayag ng tiwala ng salmista; ipinahihiwatig ng konteksto na ang pagdinig ay pagtugon sa tumatawag.
- source_word: בְּקָרְאִי
  choice: kapag tumatawag ako
  rationale: Ang ב na kasunod ng infinitive construct ay temporal dito, at malinaw itong naipapahayag ng “kapag.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ipinapakita nito ang direksiyon ng pagtawag o panalangin kay Yahweh.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” at hindi pinalitan ng titulo.
- issue: Saklaw ng kahulugan ng חָסִיד
  choice: ang taong tapat
  alternative: ang maka-Diyos; ang taong matapat sa tipan
  rationale: Pinananatili ng “taong tapat” ang moral, debosyonal, at tipanang pahiwatig ng salita nang hindi ginagawang hayag ang isang kahulugang nananatiling likas na malawak sa Hebreo.
- issue: Panahunan o aspekto ng יִשְׁמַע
  choice: dinirinig ako
  alternative: diringgin ako
  rationale: Maaaring unawain ang imperpektibo bilang palagian sa kasalukuyan o bilang tiyak na mangyayari. Pinili ang pangkasalukuyan sa pangunahing teksto, habang pinananatili sa talababa ang lehitimong pagbasa sa hinaharap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyo” upang mapanatili ang maramihang kausap, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
