lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Maghandog kayo ng mga handog
  rationale: Pinananatili ang pag-uulit ng magkaugnay na pandiwa at pangngalan sa Hebreo hangga't natural sa Tagalog, at malinaw na ipinahihiwatig ang gawaing paghahandog.
- source_word: צֶדֶק
  choice: ng katuwiran
  rationale: Pinananatili ang malawak na moral at tipanang diwa ng salita nang hindi nililimitahan kung ang diin ay nasa matuwid na puso, wastong pagsamba, o pareho.
- source_word: וּבִטְחוּ אֶל
  choice: at magtiwala kayo kay
  rationale: Natural na Tagalog para sa maramihang pautos at sa pagtitiwalang nakatuon sa isang persona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng זִבְחֵי צֶדֶק
  choice: mga handog ng katuwiran
  alternative: mga matuwid na handog; mga handog ng katarungan
  rationale: Ang pariralang Hebreo ay maaaring tumukoy sa mga handog na may matuwid na katangian, sa wastong paghahandog, o sa pagsambang kalakip ang moral na katapatan. Pinananatili ng salin at talababa ang saklaw na ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kayo” upang ihayag ang maramihang pautos; pinanatili ang bahagyang di-pangkaraniwang pariralang “mga handog ng katuwiran” upang huwag agad lutasin ang tunay na kalabuan ng Hebreo.
