  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: tl
  text: Maghandog kayo ng mga haing matuwid[a], at magtiwala kayo kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Maghandog kayo ng mga hain ayon sa katuwiran” o “Maghandog kayo ng mga hain ng katarungan.”
