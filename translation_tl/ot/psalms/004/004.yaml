  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: tl
  text: 'Manginig kayo[a] at huwag magkasala;


    magnilay kayo sa inyong mga puso sa inyong mga higaan,


    at tumahimik.


    Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Magalit kayo at huwag magkasala.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkabagabag, panginginig, o galit.
    reason: alternative_reading
lexical_decisions:
- source_word: רִגְזוּ
  choice: Manginig kayo
  rationale: Maaaring tumukoy ang pandiwang רגז sa panginginig, matinding pagkabalisa, o galit. Pinananatili ng “manginig” ang malawak na diwa ng pagkabagabag nang hindi ito nililimitahan sa galit.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: at huwag magkasala
  rationale: Tuwiran at likas na salin ng pagbabawal na gumagamit ng karaniwang pandiwang חטא.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: magsalita kayo sa inyong puso
  rationale: Pinananatili ang kongkretong larawan ng panloob na pagsasalita sa Hebreo. Sa Tagalog, nauunawaan itong tahimik na pakikipag-usap o pagninilay sa sarili.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: habang nasa inyong mga higaan
  rationale: Likas na ipinahahayag sa Tagalog ang lokasyon at kalagayan ng tahimik na pagninilay, habang pinananatili ang pangmaramihang anyo ng hulaping Hebreo.
- source_word: וְדֹמּוּ
  choice: at tumahimik
  rationale: Maaaring mangahulugan ang דמם ng pagiging tahimik o hindi pagkilos. Ang “tumahimik” ay malinaw at angkop sa daloy mula sa pagkabagabag tungo sa tahimik na pagsusuri sa sarili.
- source_word: סֶלָה
  choice: Selah
  rationale: Hindi tiyak ang kahulugan ng liturhikal o musikal na terminong ito, kaya isinasatitik ito sa halip na bigyan ng tiyak na pakahulugan.
theological_decisions:
- issue: Kahulugan ng רגזו kaugnay ng utos na huwag magkasala
  choice: Utos na manginig o mabagabag ngunit huwag magkasala
  alternative: Magalit kayo, ngunit huwag magkasala
  rationale: Kapwa pinahihintulutan ng Hebreo ang panginginig o pagkabagabag at, sa ilang konteksto, ang galit. Mas hindi makitid ang “manginig” at umaangkop sa kasunod na panloob na pagninilay at pananahimik; pinananatili sa talababa ang tradisyonal at lehitimong alternatibo.
- issue: Diwa ng אִמְרוּ בִלְבַבְכֶם
  choice: Panatilihin ang larawan ng pagsasalita sa sariling puso
  alternative: Pagbulayan ninyo sa inyong kalooban
  rationale: Ang pandiwa ay literal na “magsabi/magsalita,” ngunit ang buong parirala ay tumutukoy sa panloob na pagninilay. Pinananatili ng pangunahing teksto ang larawan ng Hebreo, at nililinaw ng talababa ang idyomatikong diwa nang hindi pinapawi ang ambiguwidad.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang maikling anyong patula, ang konkretong larawan ng “puso” at “mga higaan,” at ang hindi isinaling liturhikal na salitang “Selah.”
