  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: tl
  text: Babalik[a] sa Sheol[b] ang masasama—ang lahat ng bansang lumilimot sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbabalik.” Ang pandiwang Hebreo ay maaaring mangahulugang “bumalik” o “pumihit pabalik.”
    reason: lexical_alternative
  - marker: b
    text: Ang Sheol ay katawagang Hebreo para sa daigdig ng mga patay; hindi ito ganap na katumbas ng mas huli at mas tiyak na konsepto ng impiyerno.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Babalik
  rationale: Ang Qal imperfect na יָשׁוּבוּ ay maaaring mangahulugang “babalik” o “uurong/pabalik.” Pinananatili ng “babalik” ang payak na diwa ng pagkilos patungo sa Sheol nang hindi ito ipinapakahulugan lamang bilang matalinghagang pagkapuksa.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Likas at maikli itong pantukoy sa mga taong masama sa asal, at angkop sa marangal ngunit madaling maunawaang modernong Tagalog.
- source_word: לִשְׁאוֹלָה
  choice: sa Sheol
  rationale: Pinananatili ang katawagang Hebreo sapagkat tumutukoy ito sa daigdig o kinaroroonan ng mga patay at hindi awtomatikong katumbas ng mas tiyak at mas huling konsepto ng impiyerno.
- source_word: כָּל גּוֹיִם
  choice: ang lahat ng bansang
  rationale: Isinasalin ang kabuuang saklaw ng כָּל at ang pangmaramihang גּוֹיִם bilang “lahat ng bansa,” nang hindi ipinapasok ang Israel/Hentil na pagtatambis na hindi tahasang sinasabi rito.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: lumilimot sa Diyos
  rationale: Ang pariralang participial ay naglalarawan sa mga bansang may patuloy o katangiang paglimot sa Diyos. Natural sa Tagalog ang sugnay na “lumilimot sa Diyos.”
theological_decisions:
- issue: Kahulugan ng שְׁאוֹל sa konteksto ng paghatol
  choice: Sheol
  alternative: libingan; daigdig ng mga patay; impiyerno
  rationale: Bagaman kapalaran ng masasama ang tinutukoy, hindi sapilitang taglay ng salitang Hebreo ang mas tiyak na doktrina ng walang-hanggang impiyerno. Pinananatili ng transliterasyon ang saklaw at tensiyong teolohikal ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang baligtad na ayos na “Babalik … ang masasama” upang mapanatili ang diin ng Hebreo sa pandiwang pambungad at manatiling natural sa Tagalog. Ang em dash ay nagpapakitang ang “lahat ng bansang lumilimot sa Diyos” ay nagpapalawak o nagpapaliwanag sa “ang masasama.”
