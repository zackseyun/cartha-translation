  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: tl
  text: Sapagkat inaalaala sila ng humihingi ng pananagutan sa pagdanak ng dugo; hindi niya nililimot ang daing ng mga nagdurusa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dukha.” Ang salitang Hebreo ay maaaring tumukoy sa mga dukha, nagdurusa, mapagpakumbaba, o api; sa kontekstong ito ng pagdanak ng dugo at paghingi ng katarungan, ang mas malawak na diwa ng mga taong nagdurusa ang angkop.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag at angkop sa daloy ng paliwanag sa salmo.
- source_word: דֹרֵשׁ דָּמִים
  choice: ang humihingi ng pananagutan sa pagdanak ng dugo
  rationale: Ang idyoma ay tumutukoy sa pagtutuos o paghingi ng katarungan dahil sa dugong dumanak, hindi sa literal na paghahanap ng dugo. Iniiwasan din nito ang mas makitid na impresyon ng isang teknikal na legal na tagapaghiganti.
- source_word: אוֹתָם
  choice: sila
  rationale: Pinananatili ang maramihang layon ayon sa tradisyong tekstuwal at iniuugnay ito sa pangkat ng mga nagdurusa.
- source_word: זָכָר
  choice: inaalaala
  rationale: Bagaman nasa anyong ganap ang pandiwa, ipinahahayag nito sa kontekstong patula ang palagian at katangiang pagkilos ng Diyos.
- source_word: לֹא שָׁכַח
  choice: hindi niya nililimot
  rationale: Ang pangkasalukuyang anyo ay likas sa Filipino at nagpapanatili sa diwa ng patuloy na katotohanan na kapantay ng ‘inaalaala.’
- source_word: צַעֲקַת
  choice: ang daing
  rationale: Likas at marangal na salin ito para sa sigaw ng pagdurusa at paghingi ng saklolo.
- source_word: עניים
  choice: mga nagdurusa
  rationale: Saklaw nito ang mga dukha, api, mapagpakumbaba, o pinahihirapan nang hindi nililimitahan ang kahulugan sa kahirapang pangkabuhayan lamang.
theological_decisions:
- issue: Ang banal na katarungang ipinahihiwatig ng דֹרֵשׁ דָּמִים
  choice: Inilalarawan ang Diyos bilang humihingi ng pananagutan dahil sa pagdanak ng dugo.
  alternative: Napapansin lamang ng Diyos ang pagdanak ng dugo, o literal siyang naghahanap ng dugo.
  rationale: Ang idyoma ay nagpapahayag ng makatarungang pagtutuos sa kasalanang nagbubo ng dugo. Hindi nito inilalarawan ang Diyos na uhaw sa dugo at hindi rin nito tahasang ikinukulong ang pahayag sa isang teknikal na tungkuling legal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matinding larawan ng pagdanak ng dugo at ang judicial na diwa ng paghingi ng pananagutan, habang iniwasan ang teknikal o denominasyonal na pananalita.
