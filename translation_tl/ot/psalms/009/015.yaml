  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: tl
  text: 'Lumubog ang mga bansa sa hukay na ginawa nila;

    sa lambat na itinago nila, nahuli ang sarili nilang paa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Singular sa Hebreo ang “paa nila,” malamang bilang kolektibong singular na tumutukoy sa mga bansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: Lumubog
  rationale: Ang Qal perfect ay nagpapahayag na ang mga bansa ay lumubog o nasadlak; pinananatili ng “lumubog” ang kongkretong larawan at ang aspektong ganap ng kilos.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Karaniwang tumutukoy ang גּוֹיִם sa mga bansa o mga bayan; ang “mga bansa” ay malinaw at likas sa konteksto ng salmo.
- source_word: בְּשַׁחַת
  choice: sa hukay
  rationale: Ang שַׁחַת ay hukay, madalas na hukay na nagsisilbing bitag. Sa Filipino, likas ang “lumubog ... sa hukay” at napapanatili nito ang larawan.
- source_word: עָשׂוּ
  choice: na ginawa nila
  rationale: Tuwirang kahulugan ng pandiwa ang “gumawa.” Binibigyang-diin nito ang kabalintunaan na sila rin ang gumawa ng hukay na kinalubugan nila.
- source_word: בְּרֶשֶׁת
  choice: sa lambat
  rationale: Ang רֶשֶׁת ay lambat; ang “sa lambat” ay umaangkop sa lokatibong gamit ng pang-ukol at sa kasunod na larawan ng pagkakahuli.
- source_word: זוּ טָמָנוּ
  choice: na itinago nila
  rationale: Ang זוּ ay panandang relatibo at ang טָמָנוּ ay nangangahulugang nagtago o nagkubli. Natural na binubuo ng parirala ang “lambat na itinago nila,” habang pinananatili ang lihim na paglalagay ng bitag.
- source_word: נִלְכְּדָה
  choice: nahuli
  rationale: Ang Niphal perfect ay pasibo at nangangahulugang nahuli o nabitag. Maikli at natural ang “nahuli” sa Filipino.
- source_word: רַגְלָם
  choice: ang sarili nilang paa
  rationale: Singular ang Hebreo, “ang paa nila,” bagaman maramihan ang tinutukoy. Pinananatili ng “paa” ang bilang, at inililitaw ng “sarili nilang” ang kabalintunaang sila ang nahuli sa sarili nilang bitag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng dalawang taludtod, ang mga kongkretong larawan ng hukay at lambat, at ang kolektibong singular na “paa.” Inilagay ang talababa sa “paa,” na siyang salitang ipinaliliwanag nito.
