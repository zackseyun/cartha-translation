  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: tl
  text: Sinaway mo ang mga bansa; nilipol mo ang masasama[a]; pinawi mo ang kanilang pangalan[b] magpakailanman at walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, isahan: “ang masama.” Maaari itong tumukoy sa isang masamang tao o gamitin bilang kolektibong katawagan sa masasama.'
    reason: alternative_reading
  - marker: b
    text: Sa kontekstong ito, ang “pangalan” ay maaari ring magpahiwatig ng alaala o katanyagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: sinaway mo
  rationale: Ang pandiwa ay tumutukoy sa isang mariin at makapangyarihang pagsaway. Likas sa modernong Tagalog ang “sinaway” at hindi nito dinaragdagan ang kahulugan ng teksto.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Sa konteksto ng paghatol sa Awit, tumutukoy ito sa mga bansa bilang mga pangkat ng mga tao. Iniiwasan ng “mga bansa” ang di-kinakailangang mas huling relihiyosong diwa ng “mga Hentil.”
- source_word: אִבַּדְתָּ
  choice: nilipol mo
  rationale: Ang anyong piel ay may sanhi o matinding diwang ‘pinapahamak’ o ‘winawasak.’ Ang “nilipol” ay malakas at natural sa konteksto ng banal na paghatol.
- source_word: רָשָׁע
  choice: ang masasama
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong gamitin bilang pangkalahatan o kolektibong katawagan. Ang maramihang hulapi sa kasunod na “kanilang pangalan” ay umaalalay sa kolektibong salin.
- source_word: שְׁמָם
  choice: ang kanilang pangalan
  rationale: Literal itong “kanilang pangalan.” Pinananatili ng salin ang larawan ng orihinal, habang ipinapaliwanag sa talababa na maaari itong tumukoy sa alaala o katanyagan.
- source_word: מָחִיתָ
  choice: pinawi mo
  rationale: Ang pandiwa ay nangangahulugang burahin o pawiin. Ang “pinawi” ay likas at marangal na Tagalog at pinananatili ang larawan ng lubos na pag-aalis ng pangalan.
- source_word: לְעוֹלָם וָעֶד
  choice: magpakailanman
  rationale: Ang tambalang Hebreo ay mariing nagpapahayag ng walang-hanggang tagal. Sa modernong Tagalog, sapat at idiomatiko ang “magpakailanman” upang ihatid ang buong diin nang hindi nagiging mabigat.
theological_decisions:
- issue: Kolektibo o indibidwal na diwa ng רָשָׁע
  choice: 'kolektibo/pangkalahatan: “ang masasama”'
  alternative: 'indibidwal o kinatawang isahan: “ang masama”'
  rationale: Maaaring tumukoy ang isahang pangngalan sa isang uri ng mga tao o sa isang indibidwal. Dahil kaagapay nito ang “mga bansa” at sinusundan ng maramihang “kanilang pangalan,” mas malinaw sa Tagalog ang kolektibong pagbasa. Gayunman, pinananatili sa talababa ang tunay na gramatikal na posibilidad ng isahang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang maiikli at tuwirang pandiwa upang mapanatili ang matinding paralelismo ng tulang Hebreo. Ang mga panandang talababa ay inilagay mismo sa mga salitang kanilang nililinaw.
