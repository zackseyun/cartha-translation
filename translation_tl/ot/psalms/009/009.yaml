id: PSA.9.9
reference: Psalms 9:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: tl
  text: At si Yahweh ay magiging matibay na kanlungan[a] para sa mga naaapi[b], matibay na kanlungan sa mga panahon ng kagipitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kuta” o “mataas na kanlungan”; ang salitang Hebreo ay tumutukoy sa isang ligtas at mataas na lugar ng proteksiyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga dinurog” o “mga niyurakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: At ... ay magiging
  rationale: 'Sa daloy ng awit, ang anyo ay pinakamalamang na nagpapahayag ng katiyakan: magiging kanlungan si Yahweh. Pinananatili ng “At” ang ugnayan sa naunang pahayag.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִשְׂגָּב
  choice: matibay na kanlungan
  rationale: Ang salita ay tumutukoy sa isang ligtas at mataas o di-malapítang lugar ng proteksiyon. Likas sa modernong Tagalog ang “matibay na kanlungan,” at pinanatili ang pag-uulit nito para sa diin ng tula.
- source_word: לַדָּךְ
  choice: para sa mga naaapi
  rationale: Ang דך ay tumutukoy sa taong dinurog, ibinaba, o inapi. Malinaw at natural na ipinahahayag ng “mga naaapi” ang kalagayang panlipunan at personal na pagdurusa.
- source_word: לְעִתּוֹת
  choice: sa mga panahon ng
  rationale: Ang pangmaramihang anyo ay tumutukoy sa paulit-ulit o iba't ibang pagkakataon; natural itong naipapahayag bilang “sa mga panahon ng.”
- source_word: בַּצָּרָה
  choice: kagipitan
  rationale: Saklaw nito ang matinding hirap, panganib, o pagkabalisa, at angkop ito sa dignidad at imahen ng taludtod.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung panalangin o pahayag ang וִיהִי
  choice: 'Pahayag: “ay magiging”'
  alternative: 'Pakiusap o hangarin: “nawa’y maging”'
  rationale: Bagaman maaaring magmukhang jussive ang anyo, sinusuportahan ng konteksto ng Awit 9 at ng deklaratibong daloy ang katiyakang si Yahweh ay magiging kanlungan. Hindi ginawang utos o kahilingan ang linya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng “matibay na kanlungan” bilang mahalagang paralelismo at diin ng tulang Hebreo.
