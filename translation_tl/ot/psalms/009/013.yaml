  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: tl
  text: Kaawaan mo ako[a], Yahweh; tingnan mo ang paghihirap ko na dulot ng mga napopoot sa akin, ikaw na nag-aahon sa akin mula sa mga pintuan ng kamatayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagpakitaan mo ako ng kagandahang-loob.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pintuan ng kamatayan” ay larawang Hebreo para sa pagiging nasa bingit o nasa kapangyarihan ng kamatayan.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Kaawaan mo ako
  rationale: Ang pautos na anyo ng חנן na may hulaping unang panauhan ay pakiusap para sa mapagbiyayang pabor. Ang “Kaawaan mo ako” ay likas at marangal sa makabagong Tagalog; inilalahad sa talababa ang mas literal na alternatibong tumutukoy sa kagandahang-loob.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: רְאֵה
  choice: tingnan mo
  rationale: Tuwirang pautos ito ng ראה at angkop sa panalanging humihiling ng pansin ng Diyos.
- source_word: עָנְיִי
  choice: ang paghihirap ko
  rationale: Saklaw ng עֳנִי ang pagdurusa, kaabahan, at paghihirap. Ang “paghihirap ko” ay natural at hindi nagsasaad nang higit sa pinagmulan.
- source_word: מִשֹּׂנְאַי
  choice: na dulot ng mga napopoot sa akin
  rationale: Ipinakikita ng מִן ang pinagmumulan o mga sanhi ng paghihirap. Nililinaw ng “na dulot ng” ang ugnayan nito sa “paghihirap” nang hindi nagdaragdag ng ikalawang pautos.
- source_word: מְרוֹמְמִי
  choice: ikaw na nag-aahon sa akin
  rationale: Ang Polel participle ng רום na may hulaping unang panauhan ay isang pantawag sa Diyos bilang siyang nagtataas o nagliligtas sa salmista. Ipinahahayag ng “nag-aahon” ang pag-angat mula sa bingit o kapangyarihan ng kamatayan.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: mula sa mga pintuan ng kamatayan
  rationale: Pinananatili ang matingkad na larawang Hebreo ng mga pintuan bilang hangganan o pasukan sa sakop ng kamatayan; hindi ipinapasok ang “Sheol,” na wala sa teksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na halinhan ito ng titulo.
- issue: Ugnayang sintaktiko ng מִשֹּׂנְאַי
  choice: 'Iniuugnay sa “paghihirap ko”: “na dulot ng mga napopoot sa akin”'
  alternative: 'Maluwag na iugnay bilang hiwalay na bagay na tinitingnan: “tingnan mo ang paghihirap ko; [tingnan mo] ang mga napopoot sa akin”'
  rationale: Pinakanatural sa pagkakasunod ng Hebreo na ang paghihirap ay nagmumula sa mga napopoot sa salmista. Hindi na kailangang magdagdag ng ikalawang pandiwang wala sa teksto.
- issue: Larawan ng “mga pintuan ng kamatayan”
  choice: Panatilihin ang metapora sa pangunahing teksto
  alternative: Ipaliwanag sa teksto bilang “bingit o kapangyarihan ng kamatayan”
  rationale: Mahalagang panatilihin ang kongkretong larawang patula ng Hebreo; sapat na ang talababa upang ipaliwanag ang pahiwatig nito nang hindi pinapalis ang metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panalangin at tula. Ginamit ang “napopoot” sa halip na mas kolokyal na “galit,” at pinanatili ang matalinghagang “mga pintuan ng kamatayan.” Inilipat ang marker [b] sa mismong pariralang ipinaliliwanag nito.
