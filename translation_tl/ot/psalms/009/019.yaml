  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: tl
  text: Bumangon ka, Yahweh! Huwag mong hayaang manaig ang tao[a]; hatulan nawa ang mga bansa sa iyong harapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang taong mortal” o “ang marupok na tao.” Madalas idiin ng salitang Hebreo na אֱנוֹשׁ ang kahinaan o mortalidad ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Tuwirang pautos ng קום na nakatuon sa Diyos. Likas ito sa makabagong Filipino at ipinahihiwatig ang panawagan na kumilos ang Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang banal, sa halip na palitan ng isang titulo.
- source_word: אַל יָעֹז
  choice: Huwag mong hayaang manaig
  rationale: Pinananatili ang pakiusap na huwag pahintulutang magtagumpay o mangibabaw ang tao; mas natural sa Filipino ang konstruksiyong may 'hayaang' kaysa literal na 'huwag lumakas.'
- source_word: אֱנוֹשׁ
  choice: ang tao
  rationale: Pinananatili ang kolektibo o kinatawang isahan. Ang maaaring diin sa kahinaan at pagiging mortal ng tao ay inilalahad sa talababa.
- source_word: יִשָּׁפְטוּ
  choice: hatulan nawa
  rationale: Ang Nifal na anyong may diwang pakiusap ay nagpapakitang ang mga bansa ang tatanggap ng paghatol. Ipinahahayag ng 'nawa' ang jussive o panalanging himig.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Karaniwang katumbas sa konteksto ng Mga Awit para sa mga bayan o bansang sama-samang tinutukoy.
- source_word: עַל־פָּנֶיךָ
  choice: sa iyong harapan
  rationale: Natural at marangal na Filipino para sa literal na 'sa harap ng iyong mukha,' na nagpapahiwatig ng pagharap sa Diyos para sa paghatol.
theological_decisions:
- issue: Ang antropolohikal na pahiwatig ng אֱנוֹשׁ
  choice: ang tao
  alternative: ang taong mortal / ang marupok na tao
  rationale: Pinananatili ng pangunahing teksto ang isahang kinatawang katawagan at ang paghahambing ng tao sa Diyos, habang pinananatili sa talababa ang tunay na pahiwatig ng kahinaan o mortalidad nang hindi ito ginagawang mas tahasan kaysa sa Hebreo.
- issue: Ang tagaganap ng paghatol sa יִשָּׁפְטוּ
  choice: hatulan nawa ang mga bansa sa iyong harapan
  alternative: dalhin nawa sa paghatol ang mga bansa sa iyong harapan
  rationale: Passive ang anyong Hebreo at hindi tahasang pinapangalanan ang tagahatol sa pandiwa. Pinananatili ng salin ang passive na diwa, samantalang ipinahihiwatig ng 'sa iyong harapan' ang banal na hukuman nang hindi nagdaragdag ng hindi tahasang nakasaad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang panawagang “Bumangon ka” at ang panalanging “nawa” upang mapanatili ang masidhing himig ng awit nang hindi nagiging lipas o labis na literal.
