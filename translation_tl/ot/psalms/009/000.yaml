lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapanguna ng mga mang-aawit
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong namamahala sa pagtatanghal ng awit. Ang parirala ay malinaw at likas sa modernong Filipino habang pinananatili ang kontekstong panliturhiya.
- source_word: עַלְמוּת לַבֵּן
  choice: ayon sa “Kamatayan ng Anak”
  rationale: Malamang na direksiyong pangmusika o pamagat ng himig ang mahirap unawaing parirala. Isinasalin ang posibleng leksikal na diwa ngunit minamarkahan sa talababa ang tunay na kawalang-katiyakan.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Karaniwang katawagan ito sa isang awit na panrelihiyon at nagsisilbing tanda ng anyo sa mga pamagat.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas itong pananalita sa Filipino at hindi tahasang nililimitahan ang kaugnayan kay David sa modernong teknikal na konsepto ng pagkakaakda lamang.
