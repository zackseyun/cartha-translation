    text: Hindi tiyak ang kahulugan ng Hebreong עַלְמוּת לַבֵּן (ʿalmut labben). Malamang na isa itong direksiyong pangmusika o pamagat ng himig; maaari rin itong panatilihing di-isinalin bilang “Almut-labben.”
