translation:
  language: tl
  text: Kapag umurong ang aking mga kaaway, sila'y matitisod at mapapahamak sa iyong harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong presensiya” (literal, “mula sa harap ng iyong mukha”).
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Kapag umurong
  rationale: Ang ב na sinusundan ng infinitive construct ng שׁוב ay bumubuo ng temporal na sugnay. Likas sa modernong Tagalog ang “kapag umurong” at naipahihiwatig din nito ang pag-atras.
- source_word: אוֹיְבַי
  choice: ang aking mga kaaway
  rationale: Tuwirang katumbas ito ng pangngalang אוֹיֵב na may hulaping unang panauhang isahan.
- source_word: אָחוֹר
  choice: umurong
  rationale: Ang kahulugang “paatras” ng אָחוֹר ay likas nang kasama sa pandiwang Tagalog na “umurong,” kaya naiiwasan ang alanganing pag-uulit gaya ng “bumalik paatras.”
- source_word: יִכָּשְׁלוּ
  choice: sila'y matitisod
  rationale: Pinananatili ng “matitisod” ang larawang pandiwa ng כשל nang hindi agad ipinapakahulugang ganap na pagbagsak.
- source_word: וְיֹאבְדוּ
  choice: at mapapahamak
  rationale: Ang אבד sa Qal ay maaaring mangahulugang mapuksa o mapahamak. Ang “mapapahamak” ay marangal at natural sa Tagalog at hindi labis na nililinaw ang tiyak na anyo ng kanilang pagkawasak.
- source_word: מִפָּנֶיךָ
  choice: sa iyong harapan
  rationale: Natural na salin ito ng relasyonal at pansipat-lugar na diwa ng “mula sa harap/mukha mo,” habang pinananatili ang kaugnayan ng kanilang pagbagsak sa presensiya ng Diyos.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagbagsak ng mga kaaway
  choice: Inilalarawan ang mga kaaway na natitisod at napapahamak sa harapan ng Diyos, nang hindi tinutukoy ang eksaktong paraan ng pagkilos niya.
  alternative: Tuwirang pinupuksa sila ng Diyos, o bumabagsak sila dahil lamang sa pagpapakita ng kaniyang presensiya.
  rationale: Sinasabi ng Hebreo na sila ay matitisod at mapapahamak “mula sa/sa harapan” ng Diyos. Pinananatili ng salin ang teolohikal na lakas at ang hindi ganap na tiyak na ugnayang sanhi nito.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at makatang himig. Ginamit ang “aking” at “iyong” para sa angkop na rehistro ng Awit, at pinanatili ang magkaugnay na larawang “matitisod at mapapahamak.”
