  text: 'Magdulot ka ng takot sa kanila, O PANGINOON;

    nawa’y malaman ng mga bansa na tao lamang sila. Selah'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: Maglagay ka
  rationale: Pinananatili ang tuwirang pautos na ‘ilagay/itakda’ sa halip na gawing simpleng ‘takutin,’ na maaaring magpaliit sa larawan ng tekstong Hebreo.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong malalaking titik upang katawanin ang banal na pangalang YHWH sa natural at dignified na Tagalog.
- source_word: מוֹרָה
  choice: takot
  rationale: Sa kontekstong ito, tumutukoy sa takot o pangamba na ilalagay sa mga bansa; iniiwasang gamitin ang di-angkop na ibang posibleng kahulugang ‘guro.’
- source_word: יֵדְעוּ
  choice: ipaunawa mo
  rationale: Natural na Tagalog para sa jussive na ‘hayaan mong malaman nila,’ habang ipinakikitang ang pagkaunawa ay bunga ng pagkilos ng PANGINOON.
- source_word: אֱנוֹשׁ
  choice: tao lamang
  rationale: Ipinahahayag ang pagiging marupok at limitado ng tao sa harap ng Diyos, kasabay ng diin ng ‘lamang.’
- source_word: סֶּלָה
  choice: Selah
  rationale: Pinananatili ang tradisyonal na transliterasyon dahil hindi tiyak ang eksaktong tungkulin ng terminong pangmusika o panliturgiya.
theological_decisions:
- issue: Pagpapakilala sa mga bansa bilang אֱנוֹשׁ
  choice: tao lamang sila
  alternative: mga mortal lamang sila
  rationale: Ang ‘tao lamang’ ay natural at pinananatili ang pagpapakumbaba at limitasyon ng sangkatauhan nang hindi labis na itinatakda na kamatayan lamang ang diin.
- issue: Ugnayan ng dalawang pakiusap
  choice: ‘Maglagay ka…; ipaunawa mo…’
  alternative: ‘Maglagay ka…; hayaang malaman…’
  rationale: Pinananatili ang paralelismo at ang pagkilos ng Diyos bilang konteksto ng pagkilala ng mga bansa, nang hindi nagdaragdag ng tiyak na mekanismo o doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘O PANGINOON’ bilang panalanging pagtawag at pinanatili ang ‘Selah’ nang walang paliwanag sa pangunahing teksto dahil hindi tiyak ang kahulugan nito.
