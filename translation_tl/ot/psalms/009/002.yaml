base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: tl
  text: Magagalak ako at magbubunyi dahil sa iyo[a]; aawit ako ng papuri sa iyong pangalan, Kataas-taasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magagalak ako at magbubunyi sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Kataas-taasan” ay isang titulo ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: Magagalak ako
  rationale: Ang pandiwang שׂמח ay nagpapahayag ng galak. Pinananatili ng anyong panghinaharap ang diwa ng kusang pasiya o matibay na hangaring nakapaloob sa anyong Hebreo.
- source_word: וְאֶעֶלְצָה
  choice: at magbubunyi
  rationale: Ang עלץ ay tumutukoy sa masigla at hayagang kagalakan. Ang “magbubunyi” ay likas sa makabagong Filipino at hindi nito pinapantay ang kahulugan sa naunang pandiwa.
- source_word: בָךְ
  choice: sa iyo
  rationale: Ang pang-ukol na בְּ na may hulaping tumutukoy sa ikalawang panauhan ay likas na nagpapahiwatig na ang Diyos ang sentro o pinagtutuunan ng kagalakan.
- source_word: אֲזַמְּרָה
  choice: aawit ako ng papuri
  rationale: Ang piel ng זמר ay karaniwang nangangahulugang umawit o tumugtog bilang pagpupuri. Tahasang ipinapakita ng salin ang diwang papuri habang nananatiling natural sa Filipino.
- source_word: שִׁמְךָ
  choice: sa iyong pangalan
  rationale: Pinananatili ang “pangalan,” na sa Hebreo ay maaaring tumukoy sa nahayag na pagkakakilanlan at karangalan ng Diyos, nang hindi ito pinalalawak sa salin.
- source_word: עֶלְיוֹן
  choice: Kataas-taasan
  rationale: Ito ay titulong pantukoy sa Diyos na nangangahulugang “Pinakamataas.” Ang “Kataas-taasan” ay kinikilalang marangal at maikli ring titulong Filipino; ipinahihiwatig ng kuwit na tuwirang kinakausap ang Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa banal na titulong עֶלְיוֹן
  choice: Kataas-taasan
  alternative: ang Kataas-taasan / O Kataas-taasan
  rationale: Ginagamit dito ang salita bilang banal na titulo at tuwirang pagtawag sa Diyos. Pinananatili ng salin ang titulo nang hindi nagdaragdag ng pantukoy o padamdam na wala sa Hebreo.
- issue: Diwa ng mga pandiwang nasa unang panauhan
  choice: 'Mga anyong panghinaharap na nagpapahayag ng pasiya: “Magagalak ako… magbubunyi… aawit ako”'
  alternative: 'Mga anyong paghiling: “Nawa’y magalak ako…”'
  rationale: Maaaring magtaglay ng kusang-loob o cohortative na diin ang mga anyong Hebreo. Sa konteksto, ang panghinaharap na Filipino ay natural na naghahayag ng matibay na pasiya nang hindi ginagawang simpleng hula o tahasang kahilingan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “magbubunyi” ay nagpapanatili sa masidhing diwa ng ikalawang pandiwa, samantalang ang “Kataas-taasan” ay nagpapanatili sa anyo ng banal na titulo. Lahat ng marker ng talababa ay nakalagay sa pangunahing teksto.
