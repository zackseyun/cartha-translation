lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o bunga sa makabagong Tagalog.
- source_word: אֲסַפְּרָה
  choice: maipahayag ko
  rationale: Ang piel ng ספר ay tumutukoy sa pagsasalaysay o hayagang pagpapahayag; ang “maipahayag” ay angkop sa pampublikong pagpupuri sa konteksto.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: ang lahat ng papuri sa iyo
  rationale: Pinananatili ang saklaw ng כָּל at inilalahad sa natural na Tagalog ang mga papuring nakatuon sa Diyos o ang kanyang kapuri-puring mga gawa.
- source_word: בְּשַׁעֲרֵי
  choice: sa mga pintuang-bayan ng
  rationale: Ipinahihiwatig ng “pintuang-bayan” ang pampublikong lugar sa pasukan ng lunsod, hindi lamang mga pisikal na pinto.
- source_word: בַת צִיּוֹן
  choice: Anak na Babaeng Sion
  rationale: Pinananatili ang personipikadong makatang titulo para sa Sion/Jerusalem sa paraang malinaw sa Tagalog.
- source_word: אָגִילָה
  choice: magagalak ako
  rationale: Natural at marangal na pagpapahayag ng masidhing kagalakan na taglay ng גיל.
- source_word: בִּישׁוּעָתֶךָ
  choice: sa iyong pagliligtas
  rationale: Sinasaklaw ng “pagliligtas” ang aktuwal na pagsagip mula sa panganib at ang mas malawak na diwa ng kaligtasan, nang hindi ipinipilit ang isa lamang.
theological_decisions:
- issue: Pagpapakahulugan sa ישועה
  choice: pagliligtas
  alternative: kaligtasan
  rationale: Sa agarang konteksto, maaaring tumukoy ang salita sa pagsagip mula sa mga kaaway, ngunit mayroon din itong mas malawak na diwa. Ang “pagliligtas” ay nagpapanatili sa kilos ng Diyos, habang inilalagay sa talababa ang alternatibong “kaligtasan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang makatang himig. Ginamit ang “pintuang-bayan” upang maipakita ang sinaunang pampublikong lugar, at pinanatili ang personipikasyong “Anak na Babaeng Sion.”
