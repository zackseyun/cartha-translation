base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: tl
  text: Ang kaaway ay ganap nang nagwakas; walang hanggan ang kaniyang pagkawasak.[a] Binunot mo ang mga lungsod; maging ang alaala nila ay naglaho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “O kaaway, magpakailanman nang nagwakas ang mga pagkawasak.” Maaaring unawain ang pambungad na Hebreo bilang tuwirang pagtawag sa kaaway sa halip na gawing simuno ang “ang kaaway.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: Ang kaaway
  rationale: Likas na mabasa ang may pantukoy na pangngalan bilang simuno, bagaman maaari rin itong unawain bilang tuwirang pagtawag; inilalahad sa talababa ang alternatibo.
- source_word: תַּמּוּ
  choice: ay nagwakas
  rationale: Ipinahahayag ng pandiwang mula sa תמם ang lubusang pagdating sa wakas. Natural sa modernong Tagalog ang “nagwakas” at pinananatili nito ang diwa ng pagiging ganap.
- source_word: חֳרָבוֹת לָנֶצַח
  choice: sa walang-hanggang pagkawasak
  rationale: Ang חֳרָבוֹת ay maaaring tumukoy sa mga guho, pagkawasak, o pagkatiwangwang. Sa pagbasa na “ang kaaway” ang simuno, malinaw at marangal sa Tagalog ang pariralang ito bilang kalagayang pangwakas at permanente.
- source_word: וְעָרִים
  choice: ang mga lungsod
  rationale: Karaniwang kahulugan ng עִיר ang lungsod o bayan; “mga lungsod” ang tuwirang katumbas dito.
- source_word: נָתַשְׁתָּ
  choice: binunot mo
  rationale: Pinananatili ng “binunot” ang matinding larawang metaporikal ng נתשׁ—pag-aalis na tila hanggang-ugat—sa halip na payak na “winasak.”
- source_word: אָבַד זִכְרָם הֵמָּה
  choice: pati ang alaala nila ay naglaho
  rationale: Ang אָבַד ay nagpapahiwatig ng pagkawala o pagkapuksa. Ipinahihiwatig ng “pati” ang diin ng hulihang malayang panghalip הֵמָּה nang hindi nagiging asiwa ang Tagalog.
theological_decisions:
- issue: Pagkakaugnay ng pambungad na sugnay
  choice: 'Binasa ang “ang kaaway” bilang simuno: “Ang kaaway ay nagwakas sa walang-hanggang pagkawasak.”'
  alternative: “O kaaway, ang mga pagkawasak ay nagwakas na magpakailanman.”
  rationale: Maaaring basahin ang Hebreo bilang pahayag tungkol sa ganap na wakas ng kaaway, ngunit ang maramihang pandiwang תַּמּוּ ay nagpapahintulot din sa pagbasa na ang חֳרָבוֹת (“mga pagkawasak”) ang simuno at ang kaaway ay tuwirang kinakausap. Pinananatili sa talababa ang tunay na sintaktikong kalabuan; hindi ito pagpapasya sa doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “binunot” upang mapanatili ang matinding metapora ng orihinal, at “pati” upang maipahayag nang natural ang diin sa pagkawala maging ng kanilang alaala.
