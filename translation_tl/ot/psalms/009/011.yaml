  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: tl
  text: Umawit kayo ng papuri kay Yahweh, na nananahan sa Sion[a]; ipahayag ninyo sa gitna ng mga bayan ang kanyang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na nakaluklok sa Sion.”
    reason: Pinahihintulutan ng יֹשֵׁב ang maharlikang diwa ng pag-upo sa trono, bukod sa diwa ng paninirahan.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Umawit kayo ng papuri
  rationale: Ang maramihang pautos ng זמר ay tumutukoy sa pag-awit o pagtugtog bilang papuri. Likas sa modernong Tagalog ang “umawit ng papuri” at malinaw nitong naipapahayag ang musikal at mapagpuring diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang pinananatili ang pangalang tipan na יהוה bilang “Yahweh”; ang pang-ukol na ל ay likas na naipapahayag dito sa “kay.”
- source_word: יֹשֵׁב צִיּוֹן
  choice: na nananahan sa Sion
  rationale: Maaaring mangahulugan ang participle na יֹשֵׁב ng paninirahan o pagkaluklok. Pinananatili ng “nananahan” ang pangunahing diwa ng presensiya sa Sion nang hindi ipinipilit ang maharlikang larawan; inilalagay sa talababa ang posibleng diwang pagkaluklok.
- source_word: הַגִּידוּ
  choice: ipahayag ninyo
  rationale: Ang maramihang pautos na Hiphil ay humihiling ng hayagang pagpapabatid. Ang “ipahayag” ay malinaw, marangal, at angkop sa patulang panawagan.
- source_word: בָעַמִּים
  choice: sa mga bayan
  rationale: Sa pariralang ito, ipinahihiwatig ng ב ang pagpapahayag sa gitna o saklaw ng sari-saring pangkat ng tao. Ang “sa mga bayan” ay natural sa Tagalog at pinananatili ang maramihang pangkat-etnikong diwa ng עַמִּים.
- source_word: עֲלִילוֹתָיו
  choice: ang kanyang mga gawa
  rationale: Tumutukoy ang עֲלִילוֹתָיו sa kanyang mga kilos o ginawa. Tapat at maikli ang “mga gawa,” at hindi ito nagdaragdag ng tahasang pang-uri gaya ng “makapangyarihan” na wala sa mismong salita.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipan sa halip na palitan ng titulo.
- issue: Diwa ng יֹשֵׁב צִיּוֹן
  choice: na nananahan sa Sion
  alternative: na nakaluklok sa Sion
  rationale: Maaaring tumukoy ang יֹשֵׁב kapuwa sa paninirahan at sa maharlikang pagkaluklok. Hindi nilulutas nang sapilitan ng pangunahing teksto ang ambiguwidad; pinananatili sa talababa ang makaharing pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sion,” ang karaniwang anyong biblikal sa Tagalog, at pinanatili ang magkatulad na maramihang pautos sa dalawang sugnay.
