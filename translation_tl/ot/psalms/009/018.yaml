  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: tl
  text: Sapagkat ang nangangailangan ay hindi malilimutan magpakailanman; ang pag-asa ng mga nagdurusa[a] ay hindi mawawala magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga mapagpakumbaba” o “mga maaamo” (Hebreo: ענוים).'
    reason: lexical_alternative
  - marker: b
    text: Gumagamit ang tulang Hebreo ng dalawang magkalapit na pahayag para sa walang-hanggang panahon, na kapwa isinaling “magpakailanman,” upang idiing hindi permanenteng pababayaan ang nangangailangan.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang pang-ugnay na nagbibigay ng batayan o katiyakan sa naunang pakiusap.
- source_word: לֹא לָנֶצַח
  choice: hindi ... magpakailanman
  rationale: Likas sa modernong Tagalog at pinananatili ang mariing temporal na pagtanggi.
- source_word: יִשָּׁכַח
  choice: malilimutan
  rationale: Pinananatili ang balintiyak na anyo ng Hebreo at hindi tahasang nagdaragdag ng hindi binanggit na simuno.
- source_word: אֶבְיוֹן
  choice: ang nangangailangan
  rationale: Saklaw nito ang taong salat o nasa matinding pangangailangan nang hindi nililimitahan sa kahirapang pangkabuhayan lamang.
- source_word: תִּקְוַת
  choice: ang pag-asa ng
  rationale: Natural na salin ng construct form at malinaw ang kaugnayan nito sa kasunod na pangkat.
- source_word: ענוים
  choice: mga api
  rationale: Sa paralelismo sa אֶבְיוֹן, itinatampok nito ang kalagayan ng mga nagdurusa o sinisiil, habang inilalagay sa talababa ang iba pang tunay na posibilidad.
- source_word: תֹּאבַד
  choice: hindi mawawala
  rationale: Ang pandiwang אבד ay maaaring mangahulugang mawala o mapuksa. Ipinagpapatuloy sa ikalawang taludtod ang pagtangging לֹא mula sa una, gaya ng hinihingi ng paralelismo at diwa.
- source_word: לָעַד
  choice: magpakailanman
  rationale: Ginamit ang kaparehong salin sa לָנֶצַח upang mapanatili ang mariing paralelismo ng dalawang halos magkasingkahulugang pahayag.
theological_decisions:
- issue: Ang ipinahihiwatig na gumagawa ng pag-alala
  choice: Pinanatiling balintiyak ang “hindi malilimutan.”
  alternative: “Hindi sila lilimutin ng Diyos.”
  rationale: Hindi tahasang pinangalanan ng Hebreo ang Diyos bilang simuno. Ipinahihiwatig siya ng konteksto, ngunit iniiwasan ng salin na gawing tahasan ang hindi tahas sa gramatika.
- issue: Saklaw ng pagtanggi sa ikalawang taludtod
  choice: Isinaling “hindi mawawala.”
  alternative: 'Literal na walang idinagdag na “hindi”: “mawawala.”'
  rationale: Bagaman walang ikalawang לֹא sa tekstong Hebreo, ang pagtanggi sa unang taludtod ay nauunawaang sumasaklaw sa kaparis na ikalawang pahayag; kung aalisin ito sa Tagalog, mababaligtad ang katiyakang ipinahahayag ng talata.
- issue: Kahulugan ng ענוים
  choice: mga api
  alternative: mga mapagpakumbaba / maaamo
  rationale: Maaaring tumukoy ang salita sa kababaang-loob o sa pagdurusa. Dahil katapat ito rito ng “nangangailangan,” mas nangingibabaw ang panlipunang kalagayan ng pagkaapi, ngunit pinananatili sa talababa ang ibang kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino; payak ang pangungusap at pinanatili ang balanseng paralelismo ng tulang Hebreo. Ginamit ang “mga api” sa karaniwang kahulugang mga taong nagdurusa o sinisiil, hindi bilang teknikal na katawagan.
