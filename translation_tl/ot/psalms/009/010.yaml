  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: tl
  text: At magtitiwala sa iyo ang mga nakaaalam ng iyong pangalan[a], sapagkat hindi mo pinabayaan[b] ang mga humahanap sa iyo, Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pangalan” ay tumutukoy hindi lamang sa katawagan kundi sa nahayag na pagkatao at reputasyon ng Diyos.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “hindi mo tinalikuran” o “hindi mo iniwan.”'
    reason: lexical_alternative
  - marker: c
    text: Hebreo YHWH, ang personal na pangalan ng Diyos; karaniwang isinasalin bilang “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: At magtitiwala sa iyo
  rationale: Ang Qal imperfect ng בטח na may ב ay nagpapahayag ng pananalig sa isang tao; natural sa makabagong Tagalog ang “magtitiwala sa iyo,” at pinananatili ng “At” ang ugnayan sa naunang talata.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: ang mga nakakaalam ng iyong pangalan
  rationale: Ang participle ay tumutukoy sa pangkat na nakikilala sa patuloy na pagkakilala sa pangalan ng Diyos. Pinananatili ang “pangalan” upang huwag mawala ang pahiwatig sa nahayag na pagkatao at reputasyon niya.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit nagtitiwala sa Diyos ang mga nakakakilala sa kanyang pangalan.
- source_word: לֹא עָזַבְתָּ
  choice: hindi mo pinababayaan
  rationale: Ang עזב ay maaaring mangahulugang iwan, pabayaan, o talikuran. Ang aspektong perpekto ay inilalarawan sa Tagalog bilang napatunayang patuloy na katangian, nang hindi nililimitahan sa isang nakaraang pangyayari.
- source_word: דֹּרְשֶׁיךָ
  choice: ang mga humahanap sa iyo
  rationale: Kapag Diyos ang layon, ang דרש ay karaniwang tumutukoy sa taimtim na paghahanap sa kanya, kabilang ang pananalangin at paglapit; malinaw at likas ang “humahanap sa iyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng “nakakaalam ng iyong pangalan”
  choice: Pinanatili sa pangunahing teksto ang “nakakaalam ng iyong pangalan,” na may paliwanag sa talababa.
  alternative: “nakakakilala sa iyong pagkatao”
  rationale: 'Ang literal na larawan ay may mahalagang biblikal na diwa: ang “pangalan” ay hindi lamang tunog o katawagan kundi ang nahayag na pagkatao at reputasyon ng Diyos. Ang talababa ang nagpapaliwanag nang hindi pinapaliit ang saklaw.'
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ng transliterasyon ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Pamanahon at aspekto ng לֹא עָזַבְתָּ
  choice: hindi mo pinababayaan
  alternative: hindi mo pinabayaan
  rationale: Maaaring unawain ang Hebrew perfect bilang napatunayang kilos na may bisa sa kasalukuyan. Ang anyong Tagalog na pinili ay angkop sa pangkalahatang patotoo ng salmista, habang itinatala sa talababa ang alternatibong mas tiyak sa nakaraan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakakaalam” upang mapanatili ang tuwirang larawan ng Hebreo, at “humahanap” bilang natural na pananalita para sa debosyonal na paghahanap sa Diyos. Inilagay ang “Yahweh” sa hulihan bilang tuwirang pagtawag, ayon sa ayos at diin ng tulang Hebreo.
