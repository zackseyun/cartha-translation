  naturalness: Marangal at likas sa makabagong Filipino ang “At magtitiwala sa iyo ang mga nakaaalam ng iyong pangalan.” Ang “nakaaalam” ay mas tuwirang anyo para sa “those who know” kaysa “nakakaalam” sa kontekstong ito. Ang hulihang “Yahweh” ay angkop bilang panawagan at pinananatili ang diin ng Hebreo.
