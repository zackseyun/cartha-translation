  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: tl
  text: Sapagkat itinaguyod mo ang aking karapatan at usapin[a]; lumuklok ka sa trono, humahatol nang matuwid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang aking hatol at kaso” o “ang aking makatarungang karapatan at usapin.” Gumagamit ang Hebreo ng magkaparis na terminong legal upang ipahayag ang pagbibigay-katarungan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa katuwiran” o “nang makatarungan.” Pangngalang “katuwiran” ang gamit sa Hebreo sa paraang pang-abay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang nagbibigay ng dahilan sa naunang pagpupuri; natural at malinaw ang ugnayang sanhi sa Tagalog.
- source_word: עָשִׂיתָ
  choice: itinaguyod mo
  rationale: Bagaman literal na nangangahulugang “ginawa mo,” kasama ng mga terminong legal ay tumutukoy ito sa pagtatanggol o pagpapatibay sa makatarungang karapatan ng nagsasalita.
- source_word: מִשְׁפָּטִי
  choice: aking karapatan
  rationale: Maaaring tumukoy ang salita sa hatol, katarungan, o legal na karapatan. Sa konteksto, ang karapatang pinagtibay ng Diyos ang nasa pokus.
- source_word: וְדִינִי
  choice: at usapin
  rationale: Tumutukoy ito sa isang usapin o kasong dinidinig. Pinananatili ng “usapin” ang legal na larawan at iniiwasang ulitin lamang ang “karapatan.”
- source_word: יָשַׁבְתָּ לְכִסֵּא
  choice: umupo ka sa trono
  rationale: Pinananatili nito ang larawan ng Diyos na nakaluklok bilang hari at hukom.
- source_word: שׁוֹפֵט
  choice: humatol
  rationale: Ipinahahayag ng participle ang pagkilos ng Diyos bilang hukom. Natural sa Tagalog ang pandiwang “humatol” kasunod ng pag-upo niya sa trono.
- source_word: צֶדֶק
  choice: nang matuwid
  rationale: Pangngalan itong “katuwiran” na ginagamit sa paraang pang-abay; ang “nang matuwid” ay natural at nananatiling malapit sa anyo at diwa ng Hebreo.
theological_decisions:
- issue: Larawan ng Diyos bilang hukom
  choice: Inilalarawan ang Diyos na nakaluklok sa trono, humahatol nang matuwid, at pinagtitibay ang karapatan at usapin ng mang-aawit.
  alternative: Isang pangkalahatang pahayag lamang na kumilos ang Diyos para sa mang-aawit.
  rationale: Ang magkaparis na terminong legal, kasama ng trono at paghatol, ay malinaw na bumubuo ng larawang panghukuman. Pinananatili ito nang hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkaparis na legal na termino at ang larawan ng trono at paghatol, habang iniwasan ang sobrang teknikal na pananalita.
