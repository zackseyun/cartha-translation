  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: tl
  text: Ipinakilala ni Yahweh ang kanyang sarili[a]; nagsagawa siya ng paghatol. Ang masama ay nasilo sa pamamagitan ng gawa ng sarili niyang mga kamay. Higgaion[b]. Selah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kilala si Yahweh; nagsagawa siya ng paghatol.” Maaaring unawain ang Hebreong נודע bilang kalagayang pawatas (“kilala”) o bilang resultative (“ipinakilala ang kanyang sarili”).
    reason: alternative_reading
  - marker: b
    text: Ang “Higgaion” ay malamang na terminong pangmusika o panliturhiya. Maaari rin itong mangahulugang “pagbubulay” o isang panandang pangmusika gaya ng “matunog na musika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  choice: ipinakilala ang kanyang sarili
  rationale: 'Ipinahahayag ang resultative/reflexive na diwa ng Niphal: nakilala si Yahweh sa pamamagitan ng ginawa niyang paghatol, habang inilalagay sa talababa ang posibleng stative passive na pagbasa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מִשְׁפָּט עָשָׂה
  choice: naglapat siya ng hatol
  rationale: Natural na makabagong Tagalog para sa pagsasagawa ng hudisyal na pasiya; pinananatili nito ang forensic na diwa ng parirala.
- source_word: בפעל כפיו
  choice: sa gawa ng sarili niyang mga kamay
  rationale: Ipinakikita ang sariling gawa ng masama bilang kalagayan o paraan ng pagkakasilo niya; nililinaw ng “sarili niyang” ang referent ng hulaping paari.
- source_word: נוקש
  choice: nasilo
  rationale: Pinananatili ang metapora ng pagkahuli sa silo at ang resultang kalagayan ng masama.
- source_word: רשע
  choice: ang masama
  rationale: Natural na substantibong gamit sa Tagalog na pinananatili ang kinatawang isahan.
- source_word: הגיון
  choice: Higayon
  rationale: Hindi tiyak ang kahulugan at malamang na terminong pangmusika o panliturhiya; mas ligtas ang transliterasyon, kalakip ang mga posibilidad sa talababa.
- source_word: סלה
  choice: Selah
  rationale: Pinananatiling transliterado sapagkat hindi tiyak ang eksaktong tungkuling pangmusika o panliturhiya nito.
theological_decisions:
- issue: Pagpapakilala ng Diyos sa pamamagitan ng paghatol
  choice: Ipinakilala ni Yahweh ang kanyang sarili; naglapat siya ng hatol.
  alternative: Nakilala si Yahweh; naglapat siya ng hatol.
  rationale: Pinananatili ng pangunahing salin ang resultative/reflexive na pagbasa at ang ugnayan ng pagkakilala kay Yahweh sa kanyang paghatol, ngunit hindi ito pinalalawak tungo sa doktrinang lampas sa talata. Nasa talababa ang tunay na posibleng passive/stative na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naglapat ng hatol” bilang natural ngunit hudisyal na pahayag, at pinanatili ang “nasilo” upang maingatan ang metapora. Ang mga di-tiyak na terminong pangmusika ay isinalin sa anyong transliterado.
