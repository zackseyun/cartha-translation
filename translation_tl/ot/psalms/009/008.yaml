  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: tl
  text: At hahatulan niya ang sanlibutan[a] nang matuwid; hahatulan niya ang mga bayan nang may katarungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang daigdig na tinatahanan.”
    reason: lexical_alternative
  - marker: b
    text: O “nang patas” o “nang may pagkamatuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: At … niya
  rationale: Ipinagpapatuloy ng pangatnig at panghalip ang naunang diwa at bahagyang itinatampok ang Diyos, nang hindi labis na dinidiinan ang panghalip.
- source_word: יִשְׁפֹּט
  choice: hahatulan
  rationale: Ang שׁפט ay karaniwang tumutukoy sa paghatol o pagsasagawa ng kapangyarihang panghukuman; ang aspektong panghinaharap ay angkop sa makatang pahayag na ito.
- source_word: תֵּבֵל
  choice: sanlibutan
  rationale: Tumutukoy ang תבל sa daigdig bilang tinatahanan o sa buong kaayusan ng mundo, hindi lamang sa pisikal na lupa. Likas at marangal sa Tagalog ang “sanlibutan” para sa pandaigdig na saklaw.
- source_word: בְּצֶדֶק
  choice: nang may katuwiran
  rationale: Ipinapahayag ng צדק ang pamantayan o paraan ng paghatol. Pinananatili ng “may katuwiran” ang nominal at moral na bigat nito.
- source_word: יָדִין
  choice: hahatulan
  rationale: Ang דין ay nangangahulugang humatol o magpasya bilang hukom. Pinananatili ng pag-uulit ang malinaw na paralelismo at mas tuwirang kumakatawan sa Hebreo kaysa sa mas malawak na “pamamahalaan.”
- source_word: לְאֻמִּים
  choice: ang mga bayan
  rationale: Ang לאמים ay tumutukoy sa mga pangkat ng tao o mga bansa. Hindi ito nililimitahan ng “mga bayan” sa makabagong estadong pambansa.
- source_word: בְּמֵישָׁרִים
  choice: nang may katarungan
  rationale: Ang מישרים ay nagpapahiwatig ng pagiging matuwid, patas, at walang kinikilingan. Malinaw at likas sa modernong Tagalog ang “may katarungan.”
theological_decisions:
- issue: Ang pangkalahatang paghahari at paghatol ng Diyos sa sangkatauhan
  choice: Inilalarawan ang paghatol ng Diyos sa buong sanlibutan bilang matuwid at makatarungan, na may oryentasyong panghinaharap.
  alternative: Maaaring unawain ang mga pandiwa bilang palagian o kasalukuyang gawain ng Diyos, o bilang tiyak na huling paghatol.
  rationale: Ang mga pandiwang yiqtol sa tulang Hebreo ay maaaring magpahayag ng hinaharap o katangiang paulit-ulit. Pinananatili ng salin ang karaniwang panghinaharap na pagbasa ngunit hindi nagtatakda ng isang partikular na iskedyul na eskatolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sanlibutan” upang katawanin ang תבל at ang “mga bayan” para sa kolektibong mga pangkat ng tao. Pinanatili ang paralelismong “hahatulan … hahatulan” ng dalawang malapit na pandiwang Hebreo.
