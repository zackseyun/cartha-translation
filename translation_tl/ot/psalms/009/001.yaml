  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: tl
  text: Buong puso akong magpapasalamat kay Yahweh; isasalaysay ko ang lahat ng iyong kagila-gilalas na gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng iyong mga kababalaghan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Magpapasalamat ako
  rationale: Ang Hiphil ng ידה ay nagpapahayag ng pasasalamat o papuri sa pagsamba. Ang “magpapasalamat” ay likas sa makabagong Tagalog at pinananatili ang diin sa pasasalamat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay na “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל לִבִּי
  choice: nang buong puso ko
  rationale: Likas na idyomang Tagalog ito para sa buong-loob at walang-hating debosyon, at pinananatili ang kabuuang diwa ng כָל.
- source_word: אֲסַפְּרָה
  choice: isasalaysay ko
  rationale: Ang ספר sa anyong ito ay tumutukoy sa pagkukuwento o masusing pagsasalaysay ng mga ginawa ng Diyos.
- source_word: כָּל
  choice: lahat
  rationale: Hayagang pinananatili ang malawak at sumasaklaw na diwa ng salitang Hebreo.
- source_word: נִפְלְאוֹתֶיךָ
  choice: iyong mga kamangha-manghang gawa
  rationale: Ipinahahayag nito kapwa ang mga pambihirang gawang pumupukaw ng paghanga at ang aktibong diwa ng mga ginawa ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nang buong puso ko” bilang likas na idyoma at “isasalaysay” upang mapanatili ang testimonial na diwa ng pandiwang Hebreo.
