  text: וַֽ֭/יהוָה לְ/עוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַ/מִּשְׁפָּ֣ט כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: tl
  text: Ngunit si Yahweh ay nakaluklok magpakailanman[a]; itinatag niya ang kanyang trono para sa paghatol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nakaupo”; ipinahahayag ng “nakaluklok” ang maharlikang diwa sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “inihanda niya ang kanyang trono para sa katarungan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Ngunit si Yahweh
  rationale: Ang וַ ay nauunawaang panalungat dahil inihahambing nito ang walang-hanggang paghahari ni Yahweh sa pagbagsak ng masasama sa naunang konteksto. Pinanatili ang personal na pangalang Yahweh.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Likas at marangal na salitang Filipino para sa walang-hanggang tagal.
- source_word: יֵשֵׁב
  choice: nakaluklok
  rationale: Literal itong tumutukoy sa pag-upo, ngunit ipinahihiwatig ng kasunod na pagbanggit sa trono ang maharlika at mapanghatol na pag-upo. Ang “nakaluklok” ay natural na naghahatid ng diwang iyon.
- source_word: כּוֹנֵן
  choice: itinatag
  rationale: Ipinahahayag ng anyo ng pandiwa ang pagpapatibay o matatag na pagtatatag; ang “itinatag” ay maikli at likas sa Filipino.
- source_word: לַמִּשְׁפָּט
  choice: para sa paghatol
  rationale: Pinananatili nito ang legal at hudisyal na diwa ng מִשְׁפָּט sa konteksto ng trono, nang hindi ikinakaila ang posibleng diwang “katarungan.”
- source_word: כִּסְאוֹ
  choice: ang kanyang trono
  rationale: Tuwirang salin ng pangngalang may hulaping paari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; ang “Yahweh” ay transliterasyong mas malapit sa malamang na sinaunang bigkas at hindi pinapalitan ng isang titulo.
- issue: Maharlikang diwa ng יֵשֵׁב
  choice: nakaluklok
  alternative: nakaupo
  rationale: Bagaman “nakaupo” ang literal na kahulugan, nililinaw ng “trono” at “paghatol” ang maharlika at hudisyal na tagpo. Ipinahahayag ng “nakaluklok” ang diwang ito habang pinananatili sa talababa ang literal na larawan.
- issue: Saklaw ng kahulugan ng מִשְׁפָּט
  choice: paghatol
  alternative: katarungan
  rationale: Mas tuwirang tumutugma ang “paghatol” sa gawain ng isang nakaluklok sa trono, ngunit tunay ding posibilidad ang “katarungan,” kaya hindi ito tuluyang inaalis at inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nakaluklok” upang natural na maipahayag ang larawang maharlika, at pinanatili sa mga talababa ang literal at leksikal na mga alternatibo.
