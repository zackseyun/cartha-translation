base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: tl
  text: 'Manatili nawa magpakailanman ang kanyang pangalan;

    habang may araw, magpatuloy nawa ang kanyang pangalan.[a][b]


    Pagpalain nawa sa pamamagitan niya ang lahat ng bansa;[c]

    tawagin nawa nila siyang pinagpala.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal sa Hebreo: “sa harap ng araw.” Maaari itong mangahulugang “hangga''t nananatili ang araw.”'
    reason: lexical_alternative
  - marker: b
    text: Bihira ang pandiwang isinaling “magpatuloy” at maaari ring magpahiwatig ng “yumabong,” “dumami,” o “mapalaganap.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “Nawa''y pagpalain ng lahat ng bansa ang kanilang sarili sa pamamagitan niya.” Maaaring unawaing reflexive ang anyo ng pandiwa sa Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Manatili nawa magpakailanman ang pangalan niya
  rationale: Ipinahahayag ng jussive na יְהִי ang isang hangarin o panalangin. Likas sa modernong Tagalog ang “manatili nawa,” at pinananatili ng “pangalan” ang saklaw na pangalan, dangal, at alaala ng hari.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: habang may araw
  rationale: 'Bagaman literal na “sa harap ng araw,” temporal ang malamang na diwa sa paralelismong patula: hangga''t umiiral ang araw. Inilagay sa talababa ang literal na larawan upang hindi mawala ang anyo ng Hebreo.'
- source_word: ינין
  choice: magpatuloy
  rationale: Bihira at di-tiyak ang pandiwa. Ang “magpatuloy” ay akma sa paksa nitong “pangalan” at sa paralelismo ng unang linya nang hindi sapilitang pinipili ang mga diwang “yumabong,” “dumami,” o “mapalaganap.”
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: Pagpalain nawa sa pamamagitan niya
  rationale: Napananatili nito ang posibilidad na passive o middle ang Hitpael at ang alingawngaw ng mga pangako ng pagpapala sa mga patriarka. Hindi nito tahasang nilulutas ang anyong maaari ring unawaing reflexive.
- source_word: כָּל גּוֹיִם
  choice: ang lahat ng bansa
  rationale: Sa pandaigdigang kontekstong makahari, tumutukoy ang גּוֹיִם sa mga bansa o bayan ng daigdig. Karaniwan at malinaw ang “lahat ng bansa.”
- source_word: יְאַשְּׁרוּהוּ
  choice: tawagin nawa nila siyang pinagpala
  rationale: Ipinahahayag ng Piel ng אשר ang pagkilala o pagdeklara na ang isang tao ay pinagpala o maligaya. Dignipikado at malinaw ang “tawagin ... na pinagpala” sa biblikal na Tagalog.
theological_decisions:
- issue: Saklaw na makahari at mesiyaniko ng talata
  choice: Pinanatili ang tuwirang pagtukoy sa hari at ang mas malawak na posibleng mesiyanikong alingawngaw nang walang tahasang pagkilalang kristolohikal sa mismong salin.
  alternative: Ituring lamang itong eksaheradong papuri sa makasaysayang hari, o ituring itong tuwiran at eksklusibong propesiya tungkol sa Mesiyas.
  rationale: Ang Awit 72 ay awit tungkol sa hari, ngunit lumalampas sa karaniwang paghahari ang pandaigdigan at pangmatagalang wika nito. Ang “pagpalain ... sa pamamagitan niya ang lahat ng bansa” ay nagpapanatili sa ugnay nito sa pangakong ibinigay sa mga patriarka nang hindi isinasara ang kahulugan sa iisang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “nawa” upang ihayag ang paulit-ulit na jussive o panalanging himig. Pinili ang “habang may araw” sa pangunahing teksto para sa likas na temporal na diwa, habang pinanatili sa talababa ang literal na larawang “sa harap ng araw.”
