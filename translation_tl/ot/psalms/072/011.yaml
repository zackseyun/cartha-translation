  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: tl
  text: Yumukod nawa sa harap niya ang lahat ng hari[a]; maglingkod nawa sa kanya ang lahat ng bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumamba sa kanya” sa halip na “yumukod sa harap niya” at/o “maglingkod sa kanya”; ang mga pandiwang Hebreo ay maaaring magpahiwatig ng panrelihiyong pagsamba gayundin ng pagpupugay sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: Yumukod nawa
  rationale: Ang pandiwa ay tumutukoy sa pagyukod o pagpapatirapa bilang pagpapakita ng pagpapasakop o pagpupugay. Pinananatili ng “yumukod” ang pisikal at maharlikang diwa nang hindi nililimitahan agad sa panrelihiyong pagsamba; ang diwang panghiling ng imperfect sa konteksto ay ipinahayag sa “nawa.”
- source_word: לוֹ
  choice: sa harap niya
  rationale: Bagaman literal na maaaring “sa kanya,” natural sa Filipino ang “yumukod sa harap niya” at malinaw nitong ipinahahayag na sa kanya nakatuon ang pagpupugay.
- source_word: כָל מְלָכִים
  choice: ang lahat ng hari
  rationale: Tuwirang salin na nagpapanatili sa pangkalahatang saklaw ng pagpapasakop ng mga hari.
- source_word: כָל גּוֹיִם
  choice: ang lahat ng bansa
  rationale: Tumutukoy ito sa mga bansa sa buong daigdig at kaagapay ng “lahat ng hari.” Ang “mga bansa” ay natural at hindi nagdaragdag ng di-kinakailangang etnikong pakahulugan.
- source_word: יַעַבְדוּהוּ
  choice: maglingkod nawa sa kanya
  rationale: Ang עבד ay pangunahing nangangahulugang “maglingkod,” ngunit maaari ring magkaroon ng panrelihiyong diwa. Pinananatili ng saling ito ang saklaw na pampolitika at panrelihiyon nang hindi ito pinakikitid sa tahasang pagsamba.
theological_decisions:
- issue: Kung tahasang gagamitin ang wikang “sumamba” kaugnay ng hari
  choice: 'Panatilihin ang mas malawak na wika ng pagpupugay at paglilingkod: “yumukod sa harap niya” at “maglingkod sa kanya.”'
  alternative: Gamitin ang “sumamba sa kanya” para sa isa o sa dalawang pandiwa.
  rationale: Ang Awit 72 ay isang maharlikang awit. Maaaring tumukoy ito kaagad sa haring Davidiko at magkaroon din ng mesiyanikong paglawak sa pagbasa ng mga Cristiano. Ang tahasang “sumamba” ay maaaring magtakda ng mas makitid na panrelihiyong kahulugan kaysa sa hinihingi ng Hebreo. Pinananatili ng salin ang tunay na tensiyong pampolitika at teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” upang ihayag ang panghiling na himig ng talata, at pinanatili ang magkatambal na “lahat ng hari” at “lahat ng bansa.”
