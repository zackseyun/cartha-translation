base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: tl
  text: Kay Solomon[a]. O Diyos, ibigay mo sa hari ang iyong mga hatol, at sa anak ng hari ang iyong katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa pamagat, maaari rin itong mangahulugang “Mula kay Solomon” o “Para kay Solomon.”
    reason: alternative_reading
  - marker: b
    text: Ang “iyong katuwiran” ay maaari ring isaling “iyong katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Kay Solomon
  rationale: Maaaring ipahiwatig ng ל sa pamagat ng awit ang may-akda, pinag-alayan, o kaugnayan. Likas sa Tagalog ang “Kay Solomon,” ngunit pinananatili sa talababa ang tunay na kalabuan nito.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang panawagan ito sa Diyos; malinaw at marangal na ipinahahayag ng “O Diyos” ang gamit na bokatibo.
- source_word: מִשְׁפָּטֶיךָ
  choice: iyong mga hatol
  rationale: Pinananatili nito ang konkretong anyong maramihan at ang diwa ng mga pasiyang makatarungan o kakayahang humatol na nagmumula sa Diyos.
- source_word: לְמֶלֶךְ
  choice: sa hari
  rationale: Tuwirang ipinakikita ng parirala ang tatanggap ng hinihinging kaloob.
- source_word: תֵּן
  choice: ibigay mo
  rationale: Payak at natural itong katumbas ng pautos na humihiling sa Diyos na magkaloob.
- source_word: וְצִדְקָתְךָ
  choice: at ... ang iyong katuwiran
  rationale: Sinasaklaw ng “katuwiran” ang moral at panghukom na lawak ng צְדָקָה, samantalang ang “katarungan” ay lehitimong alternatibo sa kontekstong ito.
- source_word: לְבֶן־מֶלֶךְ
  choice: sa anak ng hari
  rationale: Malapit ito sa anyong Hebreo at hindi ipinapasiyang ang tinutukoy ay tanging tagapagmana o ibang anak na maharlika.
theological_decisions:
- issue: Pagkakakilanlan ng “hari” at “anak ng hari”
  choice: Panatilihin ang literal na panalangin para sa hari nang walang tahasang pagkilalang mesiyaniko sa pangunahing teksto.
  alternative: Maaaring partikular itong panalangin para kay Solomon, o isang dinastiko at mesiyanikong panalangin na lumalampas sa kanya.
  rationale: Hindi nilulutas ng talata kung si Solomon lamang, ang haring mula sa angkan ni David sa pangkalahatan, o ang Mesiyas sa tipolohikal na pagbasa ang tinutukoy. Pinananatili ng literal na wikang maharlika ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kay Solomon” bilang maikling pamagat; ang kalabuan ng Hebreong pang-ukol ay inilagay sa talababa. Pinanatili ang parallelism ng “sa hari” at “sa anak ng hari.”
