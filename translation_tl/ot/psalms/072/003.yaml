  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: tl
  text: Maghatid nawa ang mga bundok ng kapayapaan sa bayan[a], at ang mga burol ay maghatid nito sa pamamagitan ng katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa bayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa katuwiran”; ang “katuwiran” ay maaari ring mangahulugang “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: Maghatid nawa
  rationale: Ang נָשָׂא ay literal na ‘magbuhat/magdala,’ ngunit sa personipikasyon ng mga bundok, natural na ipinahahayag ng ‘maghatid’ ang pagdadala ng kapayapaan. Ipinakikita ng ‘nawa’ ang diwang panalangin o paghiling ng imperfect sa konteksto.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tuwirang salin ng pangngalang maramihan na may pantukoy.
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Pinananatili ang pangunahing kahulugan, habang maaari ring saklawin sa konteksto ang kagalingan at ganap na kaayusan ng bayan.
- source_word: לָעָם
  choice: sa bayan
  rationale: Maaaring ipahiwatig ng ל ang direksiyon (‘sa’) o kapakinabangan (‘para sa’). Ang ‘bayan’ ay natural sa konteksto ng isang maharlikang salmo at maaaring tumukoy sa sambayanan.
- source_word: וּגְבָעוֹת
  choice: at ang mga burol
  rationale: Pinananatili ang tahasang pangatnig at ang makatang pagtutulad sa ‘mga bundok.’
- source_word: בִּצְדָקָה
  choice: sa pamamagitan ng katuwiran
  rationale: Ang בְּ ay maaaring magpahiwatig ng paraan o kasangkapan. Nililinaw ng ‘sa pamamagitan ng’ ang posibleng instrumental na diwa nang hindi ginagawang tuwirang layon ang ‘katuwiran.’ Ang צְדָקָה ay maaari ring tumukoy sa katarungan.
theological_decisions:
- issue: Lakas ng imperfect sa isang maharlikang salmong panalangin
  choice: 'Paghiling o panalangin: ‘Maghatid nawa’'
  alternative: 'Panghinaharap na pahayag: ‘Maghahatid’'
  rationale: Sa konteksto ng Awit 72 bilang panalangin o pagpapala para sa paghahari ng hari, mas malamang na paghiling ang anyo kaysa payak na prediksiyon.
- issue: Ugnayan ng בִּצְדָקָה sa ikalawang sugnay
  choice: 'Paraan o batayan ng paghahatid ng kapayapaan: ‘sa pamamagitan ng katuwiran’'
  alternative: 'Ikalawang layon na kapantay ng ‘kapayapaan’: ‘maghatid ng katuwiran’'
  rationale: May tahasang pang-ukol na בְּ sa tekstong Hebreo. Pinananatili ng salin ang sintaktikong tensiyon at hindi ito tahimik na ginagawang pananda ng tuwirang layon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘bayan’ para sa עָם at ‘katuwiran’ para sa צְדָקָה; pinanatili ang maikli at makatang paralelismo, kasama ang bahagyang elipsis sa ikalawang sugnay.
