source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: tl
  text: 'Purihin[a] si Yahweh na Diyos,

    ang Diyos ng Israel,

    na siya lamang ang gumagawa ng mga kababalaghan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagpalain si Yahweh na Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Ang pasibong participle ay ginagamit bilang pormula ng pagpupuri o pagpapala sa Diyos. Mas natural sa makabagong Tagalog ang “Purihin” sa ganitong doksolohikal na konteksto, habang inilalagay sa talababa ang mas pormal na “Pagpalain.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Nasa aposisyon ito sa Yahweh at tuwirang isinasalin bilang “Diyos.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Pinananatili ng tuwirang parirala ang ugnayang ipinapahayag ng Hebrew construct chain at ang tiyak na pagkakakilanlan ng Diyos.
- source_word: עֹשֵׂה
  choice: gumagawa
  rationale: Ang Qal participle ay naglalarawan sa patuloy o katangiang pagkilos ng Diyos; natural itong ipinahahayag sa Tagalog bilang “gumagawa.”
- source_word: נִפְלָאוֹת
  choice: mga kababalaghan
  rationale: Tumutukoy ito sa pambihira at kahanga-hangang mga gawa. Ang “mga kababalaghan” ay maikli, marangal, at pamilyar sa konteksto ng mga makapangyarihang gawa ng Diyos.
- source_word: לְבַדּוֹ
  choice: siya lamang
  rationale: Malinaw nitong pinananatili ang diin sa pagiging bukod-tangi ng Diyos bilang gumagawa ng mga kababalaghan, nang hindi nagdaragdag ng hindi tahasang polemikal na pahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebrew. Ang “Yahweh” ang mas malapit na transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Diin ng לְבַדּוֹ sa pagkilos ng Diyos
  choice: na siya lamang ang gumagawa
  alternative: na gumagawa nang mag-isa
  rationale: Ang napiling anyo ay nagpapanatili sa eksklusibong pahayag na ang Diyos lamang ang gumagawa ng mga kababalaghan. Ang alternatibo ay maaaring magpahiwatig lamang na wala siyang katulong at sa gayon ay paliitin ang saklaw ng Hebrew.
- issue: Doksolohikal na saysay ng בָּרוּךְ
  choice: Purihin
  alternative: Pagpalain
  rationale: Kapwa maaaring katawanin ng mga ito ang pormulang Hebrew. Pinipili ang mas natural na panawagan sa pagpupuri sa Diyos, ngunit pinananatili sa talababa ang pormal na alternatibo upang hindi mawala ang leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang tatlong linyang anyong patula, ang personal na pangalang Yahweh, at ang matinding diin ng “siya lamang.”
