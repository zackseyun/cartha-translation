base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: tl
  text: Sa harap niya ay yuyukod ang mga naninirahan sa disyerto[a], at didilaan ng kanyang mga kaaway ang alabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga lipi sa disyerto.” Ang salitang Hebreo ay maaaring tumukoy sa mga naninirahan sa mga tigang na lupain, bagaman sa ilang konteksto ay ginagamit ito para sa mga nilalang sa ilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Sa harap niya
  rationale: Likas na salin ng idyomang nangangahulugang nasa kanyang presensya o kaharap niya, habang pinananatili ang larawang pangkalawakan at pang-ugnayan.
- source_word: יִכְרְעוּ
  choice: yuyukod
  rationale: Ipinahahayag ng pandiwa ang pagluhod o pagyukod bilang pagpapasakop; ang “yuyukod” ay natural at angkop sa konteksto ng pagkilala sa hari.
- source_word: צִיִּים
  choice: ang mga naninirahan sa disyerto
  rationale: Maaaring tumukoy ang mahirap na katawagang Hebreo sa mga tao mula sa tigang na lupain o, sa ibang konteksto, sa mga nilalang sa ilang. Mas angkop dito ang taong tinutukoy dahil katambal sila ng “mga kaaway,” ngunit hindi tinutukoy ang isang partikular na pangkat-etniko.
- source_word: וְאֹיְבָיו
  choice: at ... ang kanyang mga kaaway
  rationale: Tuwiran at natural na salin ng katawagang may panlalaking isahang hulapi na tumutukoy sa mga kalaban niya.
- source_word: עָפָר
  choice: ang alabok
  rationale: Pinananatili nito ang kongkretong larawang patula ng lubos na kahihiyan at pagkatalo.
- source_word: יְלַחֵכוּ
  choice: didilaan
  rationale: Tuwirang pinananatili ang matingkad na metapora ng pagdila sa alabok sa halip na gawing abstraktong pahayag tungkol sa pagkatalo.
theological_decisions:
- issue: Kalikasan ng larawan ng pagpapasakop
  choice: Pinanatili ang konkretong larawang patula ng pagyukod at pagdila sa alabok bilang paglalarawan ng pagpapasakop at pagkatalo sa harap ng hari.
  alternative: Unawain ang bawat kilos bilang kinakailangang literal na pagyukod at pagdila sa alabok.
  rationale: Karaniwang larawan ito ng kahihiyan at lubos na pagkatalo sa sinaunang panulaan tungkol sa paghahari. Hindi ito pinalitan ng abstraktong paliwanag upang mapanatili ang lakas at posibleng saklaw ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “disyerto” para sa malinaw na pagtukoy sa tigang na rehiyon, at pinanatili ang matinding larawang “didilaan ... ang alabok.”
