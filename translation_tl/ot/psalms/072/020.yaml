  text: כָּלּ֥וּ תְפִלּ֑וֹת דָּ֝וִ֗ד בֶּן יִשָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: tl
  text: Natapos na ang mga panalangin ni David, anak ni Jesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Naganap na” o “Sumapit na sa wakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלּוּ
  choice: Dito nagtatapos
  rationale: Ang pual perfect na 3cp ng כלה, na ang paksa ay תְפִלּוֹת, ay nagpapahayag na ang mga panalangin ay natapos o umabot na sa wakas. Ang “Dito nagtatapos” ay likas na Filipino para sa pangwakas na pahayag at hindi nagpapasya kung ito ay orihinal na bahagi ng awit o editoryal na tala.
- source_word: תְפִלּוֹת
  choice: mga panalangin
  rationale: Karaniwang kahulugan ng pangmaramihang anyo ng תְּפִלָּה; malinaw at natural sa modernong Filipino.
- source_word: דָּוִד
  choice: David
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa Filipino.
- source_word: בֶּן יִשָׁי
  choice: anak ni Jesse
  rationale: Tuwirang salin ng construct chain na tumutukoy sa angkan ni David; natural sa Filipino nang walang pantukoy.
theological_decisions:
- issue: Kung ang talata ay kolopon/editoryal na tala o bahagi ng mismong panalangin
  choice: Isinalin bilang payak na pahayag na nagmamarka sa pagtatapos ng mga panalangin ni David
  alternative: Ituring nang tahasan bilang mas huling editoryal na pahabol
  rationale: Payak na paturol na pangungusap ang Hebreo at hindi nito tuwirang tinutukoy ang kasaysayan ng pagkakasulat o pag-edit. Pinananatili ng salin ang tungkulin nitong pangwakas nang hindi nagdaragdag ng kritikal o teolohikal na pasya.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Ang “Dito nagtatapos” ay angkop sa posibleng tungkuling pangwakas ng talata, samantalang inilalahad sa talababa ang mas literal na mga alternatibo.
