  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: tl
  text: 'Para kay Solomon.[a]


    O Diyos, ipagkaloob mo sa hari ang iyong katarungan,

    at ang iyong katuwiran[b] sa anak ng hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ni Solomon” o “Tungkol kay Solomon” sa pamagat.
    reason: alternative_reading
  - marker: b
    text: Ang “iyong katuwiran” ay maaari ring isaling “iyong katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Para kay Solomon
  rationale: Ang לְ sa pamagat ay maaaring magpahiwatig ng pag-uukol, pag-aari, o kaugnayan. Pinili ang natural na “Para kay Solomon” habang itinatala sa talababa ang tunay na kalabuan.
- source_word: מִשְׁפָּטֶיךָ
  choice: ang iyong katarungan
  rationale: Ang pangmaramihang anyo ay tumutukoy sa mga makatarungang pasiya o pamantayan ng Diyos; sa kontekstong Filipino, ang kolektibong “katarungan” ay natural at angkop sa tungkuling maharlika.
- source_word: צִדְקָתְךָ
  choice: ang iyong katuwiran
  rationale: Pinananatili ng “katuwiran” ang pagkakaiba nito sa מִשְׁפָּטֶיךָ at saklaw ang matuwid na pamamahala at pagkilos ng Diyos, bagaman maaari rin itong isaling “katarungan.”
- source_word: בֶן־מֶלֶךְ
  choice: anak ng hari
  rationale: Tuwirang salin na nagpapanatili sa parallelism at hindi nagpapalagay kung kapalit o tagapagmana ang tinutukoy.
theological_decisions:
- issue: Ugnayan ni Solomon sa awit ayon sa superskripsiyon
  choice: Para kay Solomon
  alternative: Ni Solomon / Tungkol kay Solomon
  rationale: Hindi tiyak sa leksikal na antas kung ipinahihiwatig ng לְ ang may-akda, pinag-ukulan, o paksa; hindi ito nilutas sa paraang sektaryan at inilagay ang mga alternatibo sa talababa.
- issue: Pagkakaiba ng banal na “katarungan” at “katuwiran”
  choice: Panatilihin bilang dalawang magkaugnay ngunit magkaibang salita
  alternative: Isalin kapwa bilang “katarungan”
  rationale: Iginagalang nito ang dalawang magkaibang salitang Hebreo at ang paralelismong patula nang hindi lumilikha ng di-kinakailangang doktrinal na paghihiwalay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipagkaloob” bilang likas na panalanging katumbas ng pautos na “ibigay,” at pinanatili ang maikli at balanseng paralelismo ng tulang Hebreo.
