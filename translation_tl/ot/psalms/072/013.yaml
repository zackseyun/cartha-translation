  text: יָ֭חֹס עַל דַּ֣ל וְ/אֶבְי֑וֹן וְ/נַפְשׁ֖וֹת אֶבְיוֹנִ֣ים יוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: tl
  text: Mahahabag siya sa dukha at nangangailangan, at ililigtas niya ang buhay[a] ng mga nangangailangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga kaluluwa.” Ang salitang Hebreo ay maaaring mangahulugang “buhay,” “sarili,” “tao,” o “kaluluwa,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: Mahahabag siya
  rationale: Ipinahahayag ng pandiwa ang mahabaging malasakit sa mga mahina at salat. Likas at marangal sa modernong Tagalog ang “mahahabag” at angkop ito sa kasunod na pagliligtas.
- source_word: עַל
  choice: sa
  rationale: Kasama ng “mahahabag,” minamarkahan nito ang mga taong pinagtutuunan ng habag.
- source_word: דַּל
  choice: dukha
  rationale: Maaaring tumukoy sa mahirap, mahina, o mababa ang kalagayan. Pinananatili ng “dukha” ang sosyo-ekonomiko at panlipunang diwa habang naiiba sa kasunod na אֶבְיוֹן.
- source_word: אֶבְיוֹן
  choice: nangangailangan
  rationale: Ipinakikita nito ang matinding pangangailangan o kasalatan. Ang “nangangailangan” ay malinaw sa pangkaraniwang Tagalog at pinananatili ang pagkakaiba nito sa דַּל.
- source_word: נַפְשׁוֹת
  choice: ang buhay
  rationale: Sa konteksto ng maharlikang pag-iingat at pagliligtas, tumutukoy ang נֶפֶשׁ sa buhay ng mga tao, hindi kinakailangang sa isang hiwalay at di-materyal na kaluluwa. Kolektibong natural sa Tagalog ang “ang buhay ng mga nangangailangan.”
- source_word: אֶבְיוֹנִים
  choice: ng mga nangangailangan
  rationale: Isinalin nang kaayon ng naunang אֶבְיוֹן, habang malinaw na ipinahahayag ang anyong maramihan.
- source_word: יוֹשִׁיעַ
  choice: ililigtas niya
  rationale: Ang Hiphil ng ישׁע ay nangangahulugang magligtas o maghatid mula sa panganib. Tuwiran at natural ang “ililigtas” at pinananatili nito ang malawak na biblikal na gamit ng salita.
theological_decisions:
- issue: Kahulugan ng נַפְשׁוֹת kaugnay ng pagkaunawa sa pagkatao
  choice: Isinalin bilang “buhay.”
  alternative: “mga kaluluwa” o “mga tao”
  rationale: Sa kontekstong ito, pinakanatural na tumutukoy ang salita sa buhay ng mga nangangailangan na inililigtas ng hari. Iniiwasan ng “buhay” ang di-kinakailangang pagpapasok ng isang tiyak na paghahati sa katawan at kaluluwa, habang kinikilala sa talababa ang tunay na lawak ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “dukha” at “nangangailangan” upang mapanatili ang magkaibang salitang Hebreo at ang patulang paralelismo. Inilagay ang talababa sa “buhay,” ang mismong salitang may leksikal na alternatibo.
