  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: tl
  text: Magkaroon nawa ng saganang butil sa lupain[a]; sa mga taluktok ng mga bundok, umindayog nawa ang bunga nito gaya ng Lebanon; at mamukadkad nawa ang mga tao mula sa lungsod gaya ng damo sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang dakot na butil sa lupain.” Bihira ang pariralang Hebreo at maaaring tumukoy alinman sa kaunting butil na ginawang pambihirang mabunga o sa saganang butil.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Magkaroon nawa
  rationale: Ipinahahayag ng anyong jussive ang isang hangarin o panalangin; likas na ipinapakita ng “nawa” ang puwersang ito sa Tagalog.
- source_word: פִסַּת בַּר
  choice: saganang butil
  rationale: Bihira at pinagtatalunan ang parirala. Ang “saganang butil” ay angkop sa larawan ng pambihirang kasaganaan, habang inilalahad sa talababa ang posibleng literal na “isang dakot na butil.”
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Sa konteksto ng pagpapalang pang-agrikultura sa kaharian, mas tiyak ang “lupain” kaysa “daigdig.”
- source_word: בְּרֹאשׁ הָרִים
  choice: sa mga taluktok ng mga bundok
  rationale: Tuwirang inilalarawan ang kasaganaan kahit sa matataas at karaniwang di-mainam na lugar para sa pagsasaka.
- source_word: יִרְעַשׁ
  choice: umindayog nawa
  rationale: Ang pandiwa ay tumutukoy sa pagyanig o paggalaw; sa tanawing agrikultural, natural na naghahatid ang “umindayog” ng larawan ng ani na gumagalaw sa hangin.
- source_word: כַּלְּבָנוֹן
  choice: gaya ng Lebanon
  rationale: Pinananatili ang tuwirang paghahambing sa Lebanon bilang larawan ng karangyaan at luntiang kasaganaan.
- source_word: פִּרְיוֹ
  choice: ang bunga nito
  rationale: Pinananatili ang isahang kolektibong anyo at iniuugnay sa butil o ani.
- source_word: וְיָצִיצוּ מֵעִיר
  choice: at mamukadkad nawa ang mga tao mula sa lungsod
  rationale: Ang pandiwa ay nangangahulugang mamukadkad o sumibol. Dahil “mula sa lungsod” ang kasunod, tahasang ipinahahayag ang ipinahihiwatig na mga naninirahan habang pinananatili ang tayutay ng pamumulaklak.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: gaya ng damo sa lupa
  rationale: Natural at malapit sa Hebreo ang paghahambing, na nagpapahiwatig ng mabilis at masaganang pagdami.
theological_decisions:
- issue: Kahulugan ng bihirang pariralang פִסַּת בַּר
  choice: saganang butil
  alternative: isang dakot na butil
  rationale: Ang pangunahing salin ay umaayon sa konteksto ng masaganang pagpapala at pamumunga. Gayunman, tunay ang leksikal na posibilidad ng “isang dakot,” kaya pinananatili ito sa talababa sa halip na lutasin nang tahimik ang kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nawa” upang panatilihin ang himig ng panalangin, at pinanatili ang matalinghagang pamumulaklak ng mga tao.
