base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: tl
  text: Hatulan nawa niya nang matuwid ang iyong bayan[a], at nang may katarungan ang iyong mga nagdurusa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hahatulan niya nang matuwid ang iyong bayan.” Maaaring unawain ang imperfect na pandiwang Hebreo bilang isang kahilingan (“Hatulan nawa niya”) o bilang pahayag tungkol sa hinaharap (“Hahatulan niya”).
    reason: alternative_reading
  - marker: b
    text: O, “mga dukha,” “mga nangangailangan,” o “mga inaapi.” Ang salitang Hebreo ay maaaring tumukoy sa mga dukha, nagdurusa, o inaapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: Hatulan nawa niya
  rationale: Ang Qal imperfect na ikatlong panauhang panlalaki ay maaaring magpahayag ng kahilingan o ng mangyayari sa hinaharap. Sa konteksto ng panalangin para sa hari, likas sa Filipino ang “Hatulan nawa niya,” at napapanatili nito ang diwang mapanalangin.
- source_word: עַמְּךָ
  choice: ang iyong bayan
  rationale: Ang עַם na may hulaping ikalawang panauhang panlalaki ay “iyong bayan.” Mas natural dito ang “bayan” kaysa “mga tao” at napapanatili ang kolektibong diwa.
- source_word: בְצֶדֶק
  choice: nang may katuwiran
  rationale: Ang צֶדֶק ay tumutukoy sa pagiging matuwid, tama, o makatarungan. Ang “katuwiran” ay nagpapanatili sa moral na katangian ng paghatol at naihihiwalay ito sa מִשְׁפָּט na isinaling “katarungan.”
- source_word: וַעֲנִיֶּיךָ
  choice: at ang iyong mga api
  rationale: Ang עָנִי ay maaaring tumukoy sa dukha, nangangailangan, pinahihirapan, o inaapi. Maikli at natural ang “mga api,” at malinaw nitong ipinapakita ang kanilang kahinaan sa harap ng kapangyarihan, habang inilalahad sa talababa ang iba pang posibleng kahulugan.
- source_word: בְמִשְׁפָּט
  choice: nang may katarungan
  rationale: Ang מִשְׁפָּט dito ay tumutukoy sa makatarungang paghatol o katarungan. Ang “nang may katarungan” ay malinaw at natural, at hindi nagmumungkahi na puro pagpaparusa lamang ang paghatol.
theological_decisions:
- issue: Ang pambungad na imperfect ay maaaring kahilingan o pahayag tungkol sa hinaharap.
  choice: 'Isinalin bilang mapanalanging kahilingan: “Hatulan nawa niya.”'
  alternative: “Hahatulan niya ang iyong bayan…”
  rationale: Ang Awit 72 ay nagsisimula bilang panalangin para sa hari, kaya ang volitional na pagbasa ay angkop. Gayunman, tunay na pinahihintulutan ng anyong Hebreo ang pagbasa bilang panghinaharap, kaya pinanatili iyon sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” upang malinaw na maipahayag ang mapanalanging himig, at pinanatiling magkatimbang ang dalawang sugnay sa anyong patula.
