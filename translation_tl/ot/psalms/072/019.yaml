id: PSA.72.19
reference: Psalms 72:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָר֤וּךְ שֵׁ֥ם כְּבוֹד֗/וֹ לְ/ע֫וֹלָ֥ם וְ/יִמָּלֵ֣א כְ֭בוֹד/וֹ אֶת כֹּ֥ל הָ/אָ֗רֶץ אָ֘מֵ֥ן וְ/אָמֵֽן׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: tl
  text: At purihin magpakailanman ang maluwalhati niyang pangalan[a]; at mapuspos nawa ng kanyang kaluwalhatian ang buong daigdig[b]. Amen at amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang pangalan ng kanyang kaluwalhatian.”'
    reason: lexical_alternative
  - marker: b
    text: O “ang buong lupa” o “ang buong lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: At purihin
  rationale: Ang pasibong participle sa pormulang papuri ay may pakiusap o hangaring diwa rito. Likas sa makabagong Tagalog ang “purihin” at napapanatili nito ang liturhikal na lakas ng pahayag.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: ang maluwalhati niyang pangalan
  rationale: Literal itong “ang pangalan ng kanyang kaluwalhatian,” ngunit natural at tumpak sa Tagalog ang pang-uring “maluwalhati” para sa pangalang kakikitaan o nagtataglay ng kaluwalhatian.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na katumbas ito ng walang-hanggang tagal sa isang doxolohiya.
- source_word: וְיִמָּלֵא
  choice: at mapuspos nawa
  rationale: Ang Nifal imperfect ay inuunawang jussive o hangarin. Ang “nawa” ay nagpapanatili sa diwang panalangin, at ang “mapuspos” ay natural na pasibong paglalarawan ng daigdig na napupuno ng kaluwalhatian.
- source_word: כְבוֹדוֹ
  choice: ng kanyang kaluwalhatian
  rationale: Ang “kaluwalhatian” ang karaniwang katumbas ng כבוד sa kontekstong doxolohikal at saklaw nito ang dangal, kadakilaan, at hayag na karingalan.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: ang buong daigdig
  rationale: Ipinahihiwatig ng כֹּל ang kabuuan. Pinili ang “daigdig” upang malinaw ang pandaigdigang saklaw at hindi ito mapagkamalang isang lokal na lupain lamang.
- source_word: אָמֵן וְאָמֵן
  choice: Amen at amen
  rationale: Pinananatili ng transliterasyon ang pamilyar na dobleng liturhikal na pagpapatibay at ang indayog ng doxolohiya.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ
  choice: buong daigdig
  alternative: buong lupain
  rationale: Sa pangwakas na doxolohiya ng salmo, ang larawan ng kaluwalhatian ng Diyos na pumupuspos ay may pangkalahatan at pandaigdigang saklaw. Gayunman, kinikilala sa talababa ang leksikal na posibilidad ng “lupain.”
- issue: Modalidad ng וּבָרוּךְ at וְיִמָּלֵא
  choice: 'hangarin o panalangin: “purihin” at “mapuspos nawa”'
  alternative: 'tahasang pahayag: “pinagpala” at “mapupuno”'
  rationale: Ang doxolohikal na konteksto at anyong pandiwa ay sumusuporta sa pagbasa bilang pagpapahayag ng hangarin, nang hindi ito ginagawang prediksiyon o simpleng paglalarawan.
translation_notes:
  register: Makabago ngunit marangal at angkop sa pagsamba. Ginamit ang “magpakailanman,” “mapuspos nawa,” at “kaluwalhatian” dahil madaling maunawaan ngunit nananatiling matayog. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
