base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: tl
  text: Humatol siya para sa mga dukha ng bayan[a], iligtas niya ang mga anak ng mga nangangailangan, at durugin niya ang mapang-api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Hahatol siya para sa mga dukha ng bayan, ililigtas niya ang mga anak ng mga nangangailangan, at dudurugin niya ang mapang-api.” Ang mga pandiwang Hebreo ay maaaring unawain bilang panghinaharap o bilang panalangin o hangarin sa kontekstong ito.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Ipagtanggol niya nang may katarungan
  rationale: Ang Qal imperfect ng שׁפט ay maaaring tumukoy sa paghatol o pamamahala nang makatarungan. Sa konteksto ng mga dukhang inaapi at ng pagliligtas sa nangangailangan, likas sa Filipino ang 'ipagtanggol ... nang may katarungan,' habang hindi nililimitahan ang diwa sa pagbigkas lamang ng hatol. Ginamit ang anyong panalangin o hangarin.
- source_word: עֲנִיֵּי עָם
  choice: ang mga dukha sa bayan
  rationale: Ang עֲנִיִּים ay tumutukoy sa mahihirap, naghihirap, o inaapi; nangingibabaw rito ang kalagayang panlipunan at pangkabuhayan. Ang 'sa bayan' ay natural na Filipino para sa ugnayang construct at hindi nagpapahiwatig na lahat ng mamamayan ay dukha.
- source_word: יוֹשִׁיעַ
  choice: iligtas
  rationale: Tuwirang ipinapahayag ng Hiphil ng ישׁע ang pagliligtas o pagsagip. Ang 'iligtas' ay malinaw, matindi, at karaniwan sa dignified na Filipino.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: ang mga anak ng mga nangangailangan
  rationale: Pinananatili ng 'mga anak' ang kolektibong בני nang hindi ito nililimitahan sa lalaki. Isinasalin ang אֶבְיוֹן bilang 'mga nangangailangan' upang mapanatili ang bahagyang pagkakaiba nito sa naunang 'mga dukha.'
- source_word: וִידַכֵּא
  choice: at durugin
  rationale: Ang דכא ay may malakas na diwa ng pagdurog o pagwasak. Pinananatili ng 'durugin' ang matingkad at mariing larawan ng pagpigil sa mapang-api.
- source_word: עוֹשֵׁק
  choice: ang mapang-api
  rationale: Ang participle mula sa עשׁק ay tumutukoy sa taong palagiang nang-aapi o nagsasamantala. Ang 'mapang-api' ay maikli, natural, at malinaw sa modernong Filipino.
theological_decisions:
- issue: Aspekto o moda ng mga pandiwa sa buong talata
  choice: 'Anyo ng panalangin o hangarin: ''Ipagtanggol niya ... iligtas ... at durugin'''
  alternative: 'Payak na hinaharap: ''Ipagtatanggol niya ... ililigtas ... at dudurugin'''
  rationale: Maaaring basahin ang mga imperfect na Hebreo bilang hinaharap o bilang pakiusap/hangarin. Dahil panalangin para sa hari ang konteksto ng Awit 72, ginamit sa pangunahing teksto ang diwang humihiling, ngunit pinanatili sa talababa ang tunay na posibilidad ng pagbasa bilang hinaharap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'bayan' para sa collective na עָם, 'mga dukha' at 'mga nangangailangan' upang mapanatili ang parallelismo at leksikal na pagkakaiba, at isang natural na anyong panalangin sa Filipino.
