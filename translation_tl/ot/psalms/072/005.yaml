source:
  edition: WLC
  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: tl
  text: Nawa’y matakot sila sa iyo[a] habang nananatili ang araw at ang buwan,[b] sa sali’t salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Matatakot sila sa iyo”; ang anyong Hebreo ay maaaring unawain bilang pahayag tungkol sa hinaharap sa halip na isang kahilingan o panalangin.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “kasama ng araw at sa harap ng buwan”; isang patulang pahayag na nangangahulugang habang nananatili ang araw at buwan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Nawa’y matakot sila sa iyo
  rationale: Ang ירא ay maaaring mangahulugang ‘matakot’ o ‘gumalang nang may pagpipitagan.’ Pinananatili ng ‘matakot’ ang pangunahing diwa at bigat ng salita, samantalang ipinahihiwatig ng ‘nawa’y’ ang malamang na panalangin o kahilingang puwersa ng anyo sa konteksto.
- source_word: עִם שָׁמֶשׁ
  choice: habang nananatili ang araw
  rationale: Bagaman karaniwang ‘kasama’ ang עִם, ang parirala kasama ng araw ay patulang pahayag ng tagal. Likas sa modernong Tagalog ang ‘habang nananatili ang araw.’
- source_word: וְלִפְנֵי יָרֵחַ
  choice: at ang buwan
  rationale: Literal na ‘at sa harap ng buwan,’ ngunit kapantay ito ng naunang parirala at nagpapahayag din ng patuloy na tagal. Isinama sa ‘habang nananatili’ upang maging malinaw at likas ang tula, habang inilalahad sa talababa ang literal na anyo.
- source_word: דּוֹר דּוֹרִים
  choice: sa sali’t salinlahi
  rationale: Likas at marangal na idyomang Tagalog ito para sa sunod-sunod na mga salinlahi at pinananatili nito ang mariing pag-uulit ng Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng ‘iyo’ at ang uri ng pagkatakot sa isang maharlikang salmo
  choice: Pinanatili ang tuwirang ‘iyo’ at ang pandiwang ‘matakot’ nang hindi tahasang tinutukoy kung ang kinakausap ay ang hari, ang huwarang Davidikong pinuno, o ang Diyos na kinakatawan sa paghahari.
  alternative: Tukuyin ito bilang pagpipitagan sa hari o bilang takot na nauukol lamang sa Diyos.
  rationale: Hindi nililinaw ng mismong talata ang tinutukoy ng panghalip. Pinananatili ng salin ang tunay na teolohikal na tensiyon at hindi nagdaragdag ng interpretasyong lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tradisyonal at likas na ‘sali’t salinlahi’ para sa patulang rehistro, at iniwasang gawing tahasan ang hindi tiyak na tinutukoy ng ‘iyo.’
