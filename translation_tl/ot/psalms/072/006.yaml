  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: tl
  text: Nawa’y bumaba siya[a] gaya ng ulan sa damong ginapas,[b] gaya ng mga buhos ng ulan na dumidilig sa lupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bababa siya gaya ng ulan sa damong ginapas.” Maaaring unawain ang Hebrew imperfect bilang kahilingan o panalangin, o bilang paglalarawan sa hinaharap.
    reason: alternative_reading
  - marker: b
    text: Ang “damong ginapas” ay maaari ring isaling “pinutol na damo.” Dahil ang salitang Hebreo ay kaugnay ng paggupit, inuunawa rin ito ng ilan bilang “balahibo ng tupa na ginupit,” ngunit mas angkop sa konteksto ang larawang agrikultural.
    reason: lexical_alternative
  - marker: c
    text: Ang “lupa” ay maaari ring isaling “lupain” o “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: Bumaba nawa siya
  rationale: Ang imperfect ng ירד ay maaaring pahiwatig ng kahilingan o paglalarawan sa hinaharap. Sa konteksto ng panalangin para sa hari, likas ang “nawa,” habang pinananatili ang larawan ng pagbaba.
- source_word: כְּמָטָר
  choice: na gaya ng ulan
  rationale: Tuwirang inilalarawan ng כְּ at מָטָר ang paghahambing sa ulan; natural sa makabagong Filipino ang “gaya ng ulan.”
- source_word: עַל
  choice: sa
  rationale: Ang “sa” ang natural na katumbas sa Filipino para sa pagpatak ng ulan sa ibabaw ng damo.
- source_word: גֵּז
  choice: damong ginapas
  rationale: Ang גֵּז ay tumutukoy sa bagay na ginupit o ginapas. Ang “damong ginapas” ay angkop sa larawang agrikultural ng ulan at lupa, bagaman maaari rin itong unawain bilang bagay na ginupit o balahibong ginupit.
- source_word: כִּרְבִיבִים
  choice: gaya ng mga ambon
  rationale: Ang רְבִיבִים ay mga buhos o patak ng ulan. Ang “mga ambon” ay natural at patula, at pinananatili ang paralelismo sa unang taludtod nang hindi ipinipilit ang tindi ng pag-ulan.
- source_word: זַרְזִיף
  choice: na dumidilig
  rationale: Ang bihirang anyong ito ay naglalarawan sa pagtulo o pagbuhos ng ulan. Ang pandiwang “dumidilig” ay malinaw na naghahayag ng epekto nito sa lupa.
- source_word: אָרֶץ
  choice: lupa
  rationale: Maaaring mangahulugan ang אָרֶץ ng daigdig, lupain, o lupa. Sa larawang ulan na dumidilig, ang “lupa” ang pinakanatural habang bukas pa rin sa malawak na saklaw.
theological_decisions:
- issue: Lakas o gamit ng imperfect sa konteksto ng panalangin para sa hari
  choice: 'Kahilingan o panalangin: “Bumaba nawa siya”'
  alternative: 'Paglalarawan sa hinaharap: “Bababa siya”'
  rationale: Ang Awit 72 ay may himig ng panalangin at pagpapala para sa hari, kaya ang imperfect ay natural na mabasa bilang kahilingan. Gayunman, hindi tiyak ang anyo, kaya itinatala sa talababa ang posibleng pagbasa bilang hinaharap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang paralelismo at ang pagiging bukas ng Hebreo tungkol sa kahilingan o hinaharap. Inihanay ang mga pananda ng talababa sa mismong salitang tinutukoy.
