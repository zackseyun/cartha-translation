  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: tl
  text: Maghari nawa siya mula sa dagat hanggang sa dagat, at mula sa Ilog[a] hanggang sa mga dulo ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ilog” ay malamang na tumutukoy sa Eufrates, isang karaniwang hangganang heograpiko sa Biblia.
    reason: cultural_note
  - marker: b
    text: O, “Maghahari siya mula sa dagat hanggang sa dagat, at mula sa Ilog hanggang sa mga dulo ng lupa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Maghari nawa siya
  rationale: Mula sa רדה, na nangangahulugang mamahala o maghari. Ang hulma ng pandiwa sa konteksto ng panalangin para sa hari ay likas na naihahayag sa Filipino sa pamamagitan ng “nawa,” habang hindi isinasara ang posibilidad ng pagbasa rito bilang pahayag tungkol sa hinaharap.
- source_word: מִיָּם ... עַד יָם
  choice: mula sa dagat hanggang sa dagat
  rationale: Pinananatili nito ang makatang paralelismo at ang malawak ngunit hindi espesipikong saklaw ng Hebreo, nang hindi tinutukoy kung aling mga dagat ang tinutukoy.
- source_word: וּמִנָּהָר
  choice: at mula sa Ilog
  rationale: Ang absolutong gamit ng נהר ay malamang na nakaugaliang pagtukoy sa Eufrates. Ang malaking titik sa “Ilog” ay nagpapahiwatig ng tiyak na heograpikong katawagan, ngunit hindi idinaragdag sa pangunahing teksto ang pangalang wala roon sa Hebreo.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: hanggang sa mga dulo ng lupa
  rationale: Ang אַפְסֵי ay tumutukoy sa mga sukdulan o dulong bahagi. Ang “mga dulo ng lupa” ay natural at malinaw na idyomang Filipino na nagpapanatili sa malawak na heograpikong saklaw.
theological_decisions:
- issue: Lakas ng imperfect/jussive na pandiwa sa isang awit tungkol sa hari
  choice: 'Panalangin o hangarin: “Maghari nawa siya”'
  alternative: 'Pahayag o hula: “Maghahari siya”'
  rationale: Maaaring magkaroon ng jussive na diwa ang anyo sa nakapaligid na panalangin para sa hari. Pinananatili ng “Maghari nawa siya” ang mapanalanging himig, habang inilalahad sa talababa ang lehitimong pagbasa bilang pahayag tungkol sa hinaharap upang hindi maalis ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maghari” sa halip na mas teknikal na “magkaroon ng kapangyarihan” upang mapanatili ang maikli at makatang anyo. Inilagay ang bawat panandang talababa sa pangunahing teksto at inayos ayon sa unang paglitaw.
