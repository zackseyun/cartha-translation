  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: tl
  text: Tutubusin niya ang kanilang buhay[a] mula sa pang-aapi at karahasan, at magiging mahalaga sa kanyang paningin ang kanilang dugo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ililigtas niya ang kanilang buhay,” “ang kanilang sarili,” o “ang kanilang mga buhay.” Malawak ang saklaw ng Hebreong nefesh: buhay, sarili, kaluluwa, o tao ayon sa konteksto.'
    reason: lexical_alternative
  - marker: b
    text: Ang pang-isahang “niya/kanyang” ay pinakamalamang na nagpapatuloy sa pagtukoy sa hari sa awit, bagaman umaalingawngaw rin ang pananalita sa sariling pagkalinga ng Diyos na nagliligtas sa mga api.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ וּמֵחָמָס
  choice: mula sa pang-aapi at karahasan
  rationale: Ang מִתּוֹךְ ay literal na “mula sa gitna ng,” ngunit sa konteksto ay likas na ipinahahayag ng “mula sa” ang pagliligtas palabas sa kalagayan ng pang-aapi. Ang חָמָס ay tuwirang isinaling “karahasan,” na maaari ring magpahiwatig ng marahas na kawalang-katarungan.
- source_word: יִגְאַל
  choice: Ililigtas
  rationale: Ang גאל ay may diwa ng pagtubos o pagbawi bilang tagapagtubos. Sa modernong Tagalog, malinaw at natural ang “ililigtas” sa kontekstong ito; pinananatili sa talababa ang mas tiyak na alternatibong “tutubusin.”
- source_word: נַפְשָׁם
  choice: ang kanilang buhay
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buhay o mismong pagkatao ng mga api, hindi kinakailangang sa hiwalay na di-materyal na kaluluwa. Ang anyong Hebreo ay kolektibong isahan na may pangmaramihang panlapi.
- source_word: וְיֵיקַר
  choice: magiging mahalaga
  rationale: Ipinahahayag ng יקר ang pagiging mahalaga o lubhang pinahahalagahan. Natural sa Tagalog ang “magiging mahalaga” at pinananatili nito ang pagpapahalagang ipinahihiwatig ng pandiwa.
- source_word: דָּמָם
  choice: ang kanilang dugo
  rationale: Pinananatili ng “dugo” ang kongkretong larawan ng Hebreo at ipinahihiwatig na ang kanilang buhay na ibinubo ay hindi bale-wala o murang halaga.
- source_word: בְּעֵינָיו
  choice: sa kanyang paningin
  rationale: Ito ang natural na katumbas sa Tagalog ng idyomang literal na “sa kanyang mga mata,” at malinaw na naghahayag ng pagpapahalaga o pagtingin.
theological_decisions:
- issue: Ang tinutukoy ng pang-isahang “niya/kanyang”
  choice: Pinanatili ang pang-isahang panghalip na pinakamalapit na tumutukoy sa hari sa konteksto ng Awit 72.
  alternative: Maaaring unawain bilang tuwirang pagtukoy sa Diyos na nagliligtas at nagpapahalaga sa mga api.
  rationale: Ang mga pandiwa at panghalip sa Hebreo ay pang-isahan at umaayon sa haring paksa ng awit, ngunit ang pagliligtas at pagpapahalaga sa mga api ay umaalingawngaw rin sa sariling pagkalinga ng Diyos. Hindi nilulutas ng salin ang teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pang-aapi,” “karahasan,” at “sa kanyang paningin” bilang natural at pamilyar na mga pahayag. Inilagay ang [a] pagkatapos ng “buhay” at ang [b] sa dulo ng pangungusap upang malinaw ang saklaw ng bawat talababa.
