base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: tl
  text: Sa kanyang mga araw, yayabong ang mga matuwid[a], at mananagana ang kapayapaan[b] hanggang sa wala nang buwan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang taong matuwid,” na posibleng tumukoy sa hari mismo sa halip na sa mga matuwid bilang isang pangkat.
    reason: alternative_reading
  - marker: b
    text: Ang “kapayapaan” (shalom) ay maaari ring tumukoy sa kagalingan, kabuuan, o kasaganaan.
    reason: lexical_alternative
  - marker: c
    text: Literal, “hanggang sa wala nang buwan”—isang makatang pahayag tungkol sa napakatagal na pag-iral.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: mamumukadkad
  rationale: Ang pandiwang פרח ay tumutukoy sa pagsibol o pamumukadkad at ginagamit dito bilang larawan ng pag-unlad. Pinananatili ng “mamumukadkad” ang masiglang talinghaga ng Hebreo.
- source_word: בְּיָמָיו
  choice: Sa kanyang mga araw
  rationale: Malapit ito sa idyomang Hebreo at natural na tumutukoy sa panahon ng paghahari ng hari ayon sa konteksto.
- source_word: צַדִּיק
  choice: ang mga matuwid
  rationale: Bagaman anyong isahan sa Hebreo, maaaring kolektibo ang substantibong pang-uri. Ang maramihang “mga matuwid” ay malinaw sa Filipino at hindi ipinipilit na ang tinutukoy ay ang hari mismo.
- source_word: וְרֹב שָׁלוֹם
  choice: at mananagana ang kapayapaan
  rationale: Ipinahahayag nito nang natural sa Filipino ang nominal na pariralang “kasaganaan ng kapayapaan,” habang pinananatili ang diwa ng malaking kasaganaan.
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ito ang pinakatuwirang salin, ngunit ang saklaw ng salita ay maaari ring magsama ng kagalingan, kabuuan, at kasaganaan; inilalahad ang lawak na ito sa talababa.
- source_word: עַד בְּלִי יָרֵחַ
  choice: hanggang sa mawala ang buwan
  rationale: Pinananatili nito ang makatang larawan ng Hebreo—literal na “hanggang sa wala nang buwan”—bilang pahayag ng napakahabang pananatili.
theological_decisions:
- issue: Saklaw ng צַדִּיק sa isang maharlika o mesiyanikong awit
  choice: Kolektibong “ang mga matuwid”
  alternative: Isahang “ang matuwid,” na maaaring tumukoy sa hari o huwarang pinuno
  rationale: Maaaring gamitin nang kolektibo ang pang-uring isahan, at kaayon nito ang malawak na kapayapaan sa ilalim ng paghahari. Hindi hinihingi ng talata na tukuyin ang matuwid bilang hari, kaya pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang larawang agrikultural sa “mamumukadkad” at ang kosmikong larawan ng buwan, habang iniwasan ang tahasang pagpapasya kung kolektibo o tumutukoy sa hari ang צַדִּיק.
