base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: tl
  text: Sapagkat inililigtas niya ang nangangailangan kapag siya’y humihingi ng tulong, at ang dukha[a] na walang tumutulong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang api” o “ang naghihirap”; maaaring idiin ng עָנִי ang pang-aapi o pagdurusa, hindi lamang ang kahirapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang pagpupuri sa hari at natural na naghahatid ng ugnayang sanhi sa Filipino.
- source_word: יַצִּיל
  choice: inililigtas niya
  rationale: Ang Hiphil ng נצל ay tumutukoy sa pagliligtas o pag-aalis sa panganib; malinaw ito nang hindi nililimitahan sa espirituwal na kaligtasan.
- source_word: אֶבְיוֹן
  choice: ang nangangailangan
  rationale: Tumutukoy sa taong kapos at umaasa sa tulong; pinananatili rin nitong naiiba ang salita sa kasunod na עָנִי.
- source_word: מְשַׁוֵּעַ
  choice: kapag humihingi ito ng tulong
  rationale: Ang participle mula sa שׁוע ay naglalarawan sa pagdaing o pagtawag para saklolohan; likas sa modernong Filipino ang temporal na pagkakasabi.
- source_word: וְעָנִי
  choice: at ang dukha
  rationale: Sa paralelismo sa אֶבְיוֹן, nangingibabaw ang kalagayang salat, ngunit maaari ring saklawin ng עָנִי ang pagdurusa o pang-aapi, kaya may talababa.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: na walang tumutulong sa kanya
  rationale: Likas at malinaw sa Filipino, at tapat na ipinahahayag na wala siyang sinumang nagbibigay ng tulong.
theological_decisions:
- issue: Tinutukoy ng ikatlong panauhang isahan
  choice: Pinanatili ang “niya” nang hindi tahasang pinapangalanan; sa konteksto, tumutukoy ito sa haring pinupuri sa awit.
  alternative: Isang pangkalahatang matuwid na pinuno, o isang mesianikong hari sa tipolohikal o propetikong diwa.
  rationale: Hindi tahasang tinutukoy ng anyong Hebreo ang persona bukod sa kontekstong maharlika ng awit; hindi dapat lutasin ng salin ang nananatiling posibilidad na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito” para sa nangangailangan upang maiwasan ang hindi kinakailangang pagtukoy sa kasarian, samantalang pinanatili ang “niya” para sa hari dahil panlalaki ang pandiwang Hebreo at maharlika ang konteksto.
