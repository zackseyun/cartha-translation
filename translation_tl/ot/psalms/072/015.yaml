  text: וִ/יחִ֗י וְ/יִתֶּן ל/וֹ֮ מִ/זְּהַ֪ב שְׁ֫בָ֥א וְ/יִתְפַּלֵּ֣ל בַּעֲד֣/וֹ תָמִ֑יד כָּל הַ֝/יּ֗וֹם יְבָרֲכֶֽ/נְהֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: tl
  text: Nawa’y mabuhay siya, at mabigyan ng ginto mula sa Sheba.[a] Patuloy nawa siyang ipanalangin;[b] buong araw nawa siyang pagpalain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na pagtutumbas: “at magbigay nawa siya sa kanya ng ginto ng Sheba.” Aktibo ang pandiwang Hebreo, ngunit hindi tahasang tinutukoy ang simuno.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at manalangin nawa ang isang tao para sa kanya” o “at manalangin nawa sila para sa kanya.” Hindi tahasang binabanggit sa Hebreo ang simuno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Nawa’y mabuhay siya
  rationale: Ang Qal jussive ng חיה ay nagpapahayag ng kahilingan o pagpapala, hindi lamang payak na pahayag tungkol sa hinaharap.
- source_word: וְיִתֶּן לוֹ
  choice: at mabigyan
  rationale: Aktibo ang pandiwang Hebreo, ngunit hindi tahasang binanggit ang simuno. Likas sa Tagalog ang anyong pokus sa layon upang hindi magdagdag ng tiyak na tagapagbigay.
- source_word: מִזְּהַב שְׁבָא
  choice: ng ginto mula sa Sheba
  rationale: Ipinahihiwatig ng מִן ang pinagmulan sa konteksto ng handog o tributo; malinaw at natural ang “mula sa Sheba.”
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: Patuloy nawa siyang ipanalangin
  rationale: Ang Hitpael ng פלל na may בַּעַד ay nangangahulugang manalangin para sa kapakanan ng isang tao. Hindi tinutukoy ng Hebreo kung sino ang nananalangin, kaya pinananatiling di-tiyak ng anyong Tagalog ang gumaganap.
- source_word: תָמִיד
  choice: Patuloy
  rationale: Ipinapahayag ng תָמִיד ang nagpapatuloy o palagiang gawain; ang “patuloy” ay natural at marangal sa makabagong Tagalog.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Ito ang malinaw at karaniwang katumbas ng temporal na parirala.
- source_word: יְבָרֲכֶנְהוּ
  choice: nawa siyang pagpalain
  rationale: Pinananatili nito ang diwa ng kahilingan at ang panghalip na tumutukoy sa hari, nang hindi sapilitang tinutukoy ang di-binanggit na simuno.
theological_decisions:
- issue: Ang tinutukoy ng mga kahilingan para sa hari sa Awit 72
  choice: Panatilihin ang talata bilang panalangin o pagpapala para sa hari mula sa angkan ni David, nang walang tahasang paglalagay ng mesiyanikong pagpapakahulugan sa salin.
  alternative: Basahin ito nang tuwiran bilang propesiya tungkol sa Mesiyas.
  rationale: Ang agarang diwa ng Hebreo ay mga kahilingan para sa hari. Hindi nito isinasara ang mas malawak na mesiyaniko o tipolohikal na pagbasa sa konteksto ng buong Kasulatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tulang panalangin. Ginamit ang “nawa” upang ihatid ang volitive na lakas ng mga pandiwa, at ang mga anyong “mabigyan,” “ipanalangin,” at “pagpalain” upang mapanatiling di-tiyak ang mga simunong hindi tahasang binanggit sa Hebreo.
