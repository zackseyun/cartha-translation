id: PSA.72.10
reference: Psalms 72:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: tl
  text: Magdala nawa ng buwis ang mga hari ng Tarsis at ng mga baybaying lupain; maghandog nawa ng mga kaloob ang mga hari ng Sheba at Seba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי תַרְשִׁישׁ
  choice: mga hari ng Tarsis
  rationale: Pinananatili ang pangalang heograpiko at ang payak na ugnayang ipinahahayag ng konstruktong Hebreo.
- source_word: אִיִּים
  choice: mga baybaying lupain
  rationale: Ang salita ay maaaring tumukoy sa mga pulo o mga lupaing nasa baybayin; ang saling ito ay likas sa Filipino at hindi labis na nagpapakitid sa saklaw.
- source_word: מִנְחָה
  choice: buwis
  rationale: Sa konteksto ng mga haring kumikilala sa paghahari, ang handog ay tributo o buwis, hindi lamang kusang regalo.
- source_word: יָשִׁיבוּ
  choice: magdala nawa
  rationale: Ipinapahayag ang jussive na hangarin sa pamamagitan ng “nawa”; natural na inililipat ng “magdala” ang kilos ng paghahatid ng tributo, bagaman literal na maaari itong mangahulugang “ibalik.”
- source_word: אֶשְׁכָּר
  choice: mga kaloob
  rationale: Tumutukoy sa handog o regalong inihaharap; ang “kaloob” ay dignificado at malinaw sa karaniwang mambabasa.
- source_word: יַקְרִיבוּ
  choice: maghandog nawa
  rationale: Pinananatili ang diwa ng paglapit at paghaharap ng isang kaloob, kasama ang jussive na himig.
theological_decisions:
- issue: Himig ng mga pandiwa
  choice: 'Isinalin bilang hangarin: “Magdala nawa … maghandog nawa.”'
  alternative: 'Maaaring basahin bilang mga pahayag sa hinaharap: “Magdadala … maghahandog.”'
  rationale: Sa konteksto ng panalangin sa Awit 72, ang mga imperfect na pandiwa ay angkop na unawain bilang mga kahilingan o hangarin, habang hindi dinaragdagan ng tiyak na eskatolohikal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Tarsis, Sheba, at Seba bilang mga pangalang pantangi; ginamit ang “buwis” para sa tributong pampolitika at “mga kaloob” para sa ikalawang, mas pangkalahatang katawagan.
