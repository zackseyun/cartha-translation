  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: tl
  text: Kaya naging marumi sila dahil sa kanilang mga gawa, at nagpatutot sila[a] dahil sa kanilang mga gawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagtaksil sila.” Gumagamit ang Hebreo ng larawan ng prostitusyon para sa moral at tipanang pagtataksil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: naging marumi
  rationale: 'Pinananatili nito ang resultative o intransitive na diwa ng pandiwa: sila ay napasa kalagayang marumi, nang hindi nagpapahiwatig ng isang panlabas na gumagawa.'
- source_word: בְּמַעֲשֵׂיהֶם
  choice: dahil sa kanilang mga gawa
  rationale: 'Likas sa modernong Filipino at malinaw na ipinapahayag ang instrumental o sanhi na gamit ng beth: ang sarili nilang mga gawa ang dahilan ng kanilang karumihan.'
- source_word: וַיִּזְנוּ
  choice: nagpakalapastangan sila
  rationale: Ipinahihiwatig nito ang matinding paglapastangan sa sarili sa konteksto ng moral at tipanang pagtataksil, ngunit hindi nito ganap na napapanatili ang tahasang seksuwalisadong larawan; kaya inilalagay sa talababa ang mas literal na larawan.
- source_word: בְּמַעַלְלֵיהֶם
  choice: sa kanilang mga kilos
  rationale: Ang 'mga kilos' ay natural at pinananatili ang poetikong pagkakaiba mula sa naunang 'mga gawa,' habang taglay ang moral na kulay ng מַעֲלָל.
theological_decisions:
- issue: Kung tuwirang ipapakahulugan ang זנה bilang pagtataksil sa tipan o pananatilihin ang seksuwalisadong talinghaga
  choice: Gumamit ng 'nagpakalapastangan sila' sa pangunahing teksto at ilahad sa talababa ang mas literal na 'nagpatutot sila.'
  alternative: Nagtaksil sila; nagpatutot sila
  rationale: Mahalagang huwag ikubli ang moral at tipanang pagtataksil, ngunit sa Filipino ang 'nagpatutot sila' ay maaaring unang maunawaan bilang literal na pagbebenta ng katawan. Pinananatili ng talababa ang matalim na imaheng Hebreo at ang alternatibong interpretasyon nang hindi tahimik na nilulutas ang talinghaga.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang 'naging marumi' ay mas natural kaysa 'nadungisan' para sa ritwal at moral na karumihan. Iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
