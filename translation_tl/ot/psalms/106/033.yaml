  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: tl
  text: Sapagkat pinukaw nila ang kanyang damdamin[a][b], at padalus-dalos siyang nagsalita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginalit nila ang kanyang kalooban”; ang pandiwang Hebreo ay maaari ring tumukoy sa pagpukaw o paghamon sa kanyang panloob na disposisyon.
    reason: lexical_alternative
  - marker: b
    text: Si Moises ang tinutukoy; nagsalita siya nang padalus-dalos sa Meriba. Ihambing ang Bilang 20:10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng dahilan o paliwanag sa naunang pahayag at angkop sa marangal ngunit likas na daloy ng Filipino.
- source_word: הִמְרוּ
  choice: pinait
  rationale: Sa Hiphil, maaaring ipahiwatig ng pandiwa ang pagpapait o pagpukaw sa galit. Pinananatili ng “pinait” ang tuwirang sanhi at ang konkretong larawan ng Hebreo, habang inilalahad sa talababa ang posibleng kahulugang “ginalit.”
- source_word: אֶת רוּחוֹ
  choice: ang kanyang kalooban
  rationale: Ang רוּחַ dito ay tumutukoy sa panloob na disposisyon ni Moises, hindi sa Banal na Espiritu. Mas natural sa modernong Filipino ang “kalooban” kaysa “espiritu” sa kontekstong ito, nang hindi labis na tinutukoy kung ito ay damdamin, isip, o ugali.
- source_word: וַיְבַטֵּא
  choice: padalos-dalos siyang nagsalita
  rationale: Ang pandiwa ay tumutukoy sa pagbigkas, at ipinahihiwatig ng konteksto ang pabigla-bigla o di-maingat na pananalita. Inilalahad ng “padalos-dalos” ang negatibong puwersa nito sa likas na Filipino.
- source_word: בִּשְׂפָתָיו
  choice: sa pamamagitan ng kanyang mga labi
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong “sa pamamagitan ng kanyang mga labi,” sa halip na gawing pangkalahatang “bibig” lamang.
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip sa “kanyang kalooban” at “kanyang mga labi”
  choice: Tumutukoy ang mga ito kay Moises.
  alternative: Maaaring ipalagay na tumutukoy ang mga panghalip sa bayan bilang isang kabuuan o sa ibang naunang tinukoy.
  rationale: Sa paglalahad ng Awit tungkol sa Meriba (mga talata 32–33), ang bayan ang pumait sa kalooban ni Moises, at si Moises ang nagsalita nang padalos-dalos. Kaayon ito ng Bilang 20:10 at hindi nag-aangkat ng pagtukoy sa Banal na Espiritu na hindi hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalooban” upang likas na tukuyin ang panloob na disposisyon ni Moises at maiwasan ang maling pahiwatig na ang tinutukoy ay ang Banal na Espiritu. Pinanatili ang larawang “mga labi,” bagaman bahagyang mas pormal ito kaysa karaniwang pananalita.
