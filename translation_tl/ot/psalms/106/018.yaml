  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: tl
  text: At nagliyab ang apoy sa gitna ng kanilang kapulungan; tinupok ng ningas ang masasama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: nagliyab
  rationale: Ang pandiwang בער ay tumutukoy sa pagningas o pagsiklab ng apoy. Likas sa makabagong Filipino ang “nagliyab” at naipapakita nito ang aktuwal na pag-apoy nang hindi dinaragdagan ang diwa.
- source_word: אֵשׁ
  choice: ang apoy
  rationale: Ito ang tuwiran at karaniwang kahulugan ng אֵשׁ.
- source_word: בַּעֲדָתָם
  choice: sa gitna ng kanilang kapulungan
  rationale: Ang עֵדָה ay isang nagkakatipong pangkat o kapulungan. Ipinahihiwatig ng בַּ na sumiklab ang apoy sa loob o gitna ng pangkat.
- source_word: לֶהָבָה
  choice: ningas
  rationale: Ang לֶהָבָה ay apoy na nagliliyab o ningas. Pinananatili ng “ningas” ang paralelismo sa “apoy” nang natural sa Filipino.
- source_word: תְּלַהֵט
  choice: tinupok
  rationale: Ang intensive na anyo ng להט ay nagpapahayag ng matindi at mapanirang pagliyab. Ang “tinupok” ay malinaw na nagpapakita ng mapaminsalang bunga nito.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwang salin ito ng pangmaramihang substantibong רְשָׁעִים at hindi ito nagdaragdag ng kasariang hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Tinutukoy ng pananalita tungkol sa paghatol
  choice: Inilalarawan ng talata ang konkretong apoy na tumupok sa masasama sa loob ng kapulungan.
  alternative: Ituring ang apoy bilang pangkalahatang metapora lamang ng paghatol.
  rationale: Ang konteksto ng Awit 106 ay nagbabalik-tanaw sa makasaysayang paghihimagsik at paghatol. Pinananatili ng salin ang konkretong larawan ng Hebreo nang hindi pinalalawak tungo sa isang mas malawak na doktrinal na pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kapulungan” upang mapanatili ang kolektibong diwa ng עֵדָה, at ang pares na “apoy/ningas” upang maipakita ang paralelismong patula.
