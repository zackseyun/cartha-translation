lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: Kaya nagbulung-bulungan sila
  rationale: Ang רגן ay tumutukoy sa pabulong na pagpapahayag ng pagkainis o pagrereklamo. Likas sa makabagong Filipino ang “nagbulung-bulungan” at pinananatili nito ang diwa ng hindi nasisiyahang pag-ungol; ipinahahayag ng “Kaya” ang kaugnayan nito sa naunang pangyayari.
- source_word: בְאָהֳלֵיהֶם
  choice: sa loob ng kanilang mga tolda
  rationale: Ang אֹהֶל ay literal na “tolda.” Ang “sa loob ng” ay likas na pagpapahayag sa Filipino at pinananatili ang kongkretong larawan ng kanilang tirahan.
- source_word: לֹא שָׁמְעוּ
  choice: hindi sila nakinig
  rationale: Ang שׁמע na may בְּקוֹל ay maaaring mangahulugang makinig, tumalima, o sumunod. Pinananatili ng “nakinig” ang larawang pandinig at hinahayaang manatili ang pahiwatig ng hindi pagsunod.
- source_word: בְּקוֹל
  choice: sa tinig ni
  rationale: Pinananatili ng “sa tinig ni” ang Hebreong idyoma at hindi ito pinaiikli agad tungo sa mas interpretatibong “utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa שׁמע בקול
  choice: nakinig sa tinig
  alternative: sumunod sa utos
  rationale: Ang Hebreong parirala ay may pahiwatig ng pagtalima at pagsunod, ngunit pinananatili ng salin ang literal na larawang pandinig at inilalagay sa talababa ang mas tahasang kahulugan.
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo o ibang tradisyonal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong “mga tolda,” ang larawang “tinig,” at ang banal na pangalang “Yahweh.”
