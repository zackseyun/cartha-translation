translation:
  language: tl
  text: At nagbulung-bulungan sila sa kanilang mga tolda[a]; hindi sila nakinig sa tinig ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagreklamo” o “bumulung-bulong.” Ang pandiwang Hebreo ay nagpapahiwatig ng pabulong na pagpapahayag ng pagkainis o kawalang-kasiyahan.
