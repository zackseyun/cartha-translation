  naturalness: Mas natural at marangal sa makabagong Filipino ang “Nakipagkaisa sila kay Baal ng Peor” kaysa “Nakipag-ugnayan sila” sa kontekstong ito. Ang “mga hain” ay malinaw na pangkultong handog at ang “kumain ng mga hain ng mga patay” ay maikli at nauunawaan.
