  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: tl
  text: Nakipagkaisa sila kay Baal ng Peor[a] at kumain ng mga hain ng mga patay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ikinabit nila ang kanilang sarili kay Baal-Peor.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga hain ng mga patay.” Maaaring tumukoy ang parirala sa mga haing kaugnay ng mga diyus-diyosang walang buhay o sa mga ritwal na kaugnay ng mga yumao.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: Nakipag-ugnayan sila
  rationale: Ipinahahayag nito ang kusang mahigpit na pagkalakip o pakikiisa sa kontekstong panrelihiyon. Mas natural ito sa modernong Tagalog kaysa sa literal na larawan ng pagpapasan ng pamatok, habang ang alternatibong larawan ay pinananatili sa talababa.
- source_word: לְבַעַל פְּעוֹר
  choice: kay Baal ng Peor
  rationale: Pinananatili ang mga pangalang Baal at Peor at malinaw na ipinakikitang si Baal ang diyos na kaugnay ng Peor.
- source_word: וַיֹּאכְלוּ
  choice: at kumain
  rationale: Payak at natural na katumbas ng pandiwa sa sunod-sunod na salaysay.
- source_word: זִבְחֵי
  choice: mga handog
  rationale: Tumutukoy sa mga hain o handog na pangkulto. Sa pariralang 'kumain ng mga handog,' likas nang nauunawaan ang pagkaing mula sa paghahain nang hindi dinaragdagan ang teksto.
- source_word: מֵתִים
  choice: mga patay
  rationale: Literal at sadyang malawak ang Hebreo. Hindi nito tinutukoy kung mga yumaong tao, mga patay na diyos, o mga diyus-diyosan na walang buhay ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng מֵתִים ('mga patay')
  choice: Pinanatili ang malawak na pananalitang 'mga patay.'
  alternative: mga diyus-diyosang walang buhay; mga yumaong tao; mga patay na diyos
  rationale: Hindi tahasang nililinaw ng Hebreo ang tinutukoy. Ang salin ay hindi nagpapasya kung ito ay polemika laban sa mga diyus-diyosang walang buhay o pagtukoy sa mga ritwal na kaugnay ng mga yumao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Nakipag-ugnayan' upang ihatid ang kusang pagkalakip nang hindi masyadong teknikal; pinanatili sa talababa ang mas literal na larawan. Ang 'mga patay' ay hindi pinaliit sa iisang teolohikal na pakahulugan.
