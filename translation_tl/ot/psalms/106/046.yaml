translation:
  language: tl
  text: At ginawa niyang mahabag sa kanila ang lahat ng bumihag sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן אוֹתָם לְרַחֲמִים
  choice: At ginawa niyang kahabagan sila
  rationale: Ang idyomang Hebreo ay literal na ‘ibinigay niya sila sa mga habag’; ipinahahayag nito na kumilos ang Diyos upang tumanggap sila ng habag, at natural itong naipapahayag sa Tagalog sa pamamagitan ng causative na ‘ginawa niyang kahabagan sila.’
- source_word: לִפְנֵי כָּל שׁוֹבֵיהֶם
  choice: ng lahat ng bumihag sa kanila
  rationale: Sa kontekstong ito, ang לִפְנֵי ay tumutukoy sa harap o panig ng mga bumihag, samantalang ang participle na שׁוֹבֵיהֶם ay malinaw na ‘mga bumihag sa kanila.’ Ang ‘ng’ ay natural na nagmamarka sa mga taong nahikayat na mahabag.
theological_decisions:
- issue: Pagkilos ng Diyos at habag ng mga bumihag
  choice: Pinanatili ang Diyos bilang sanhi ng pagkahabag ng mga bumihag.
  alternative: ‘Nakahanap sila ng habag sa harap ng lahat ng bumihag sa kanila.’
  rationale: Ang pandiwang וַיִּתֵּן ay tahasang naglalarawan sa Diyos bilang kumikilos; hindi dapat pahinain ang teolohikal na diin sa kanyang pamamahala sa tugon ng mga bumihag.
translation_notes:
  register: Makabagong, payak, at marangal na Filipino. Ginamit ang ‘bumihag’ sa halip na mas teknikal na ‘nagbihag’ o mas mahabang ‘nagdalang-bihag’ upang maging malinaw sa karaniwang mambabasa.
