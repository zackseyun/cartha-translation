  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: tl
  text: Ngunit matindi ang kanilang pagnanasa[a] sa ilang, at sinubok nila ang Diyos sa lupaing tiwangwang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagnasa sila ng pagnanasa”; gumagamit ang Hebreo ng magkauring pandiwa at pangngalan upang idiin ang tindi ng kanilang pagnanasa.
    reason: lexical_alternative
  - marker: b
    text: O “sa tigang na disyerto.” Ang salitang Hebreo ay naglalarawan ng isang tiwangwang at halos walang-buhay na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: matindi ang kanilang pagnanasa
  rationale: Ang pandiwa at kauri nitong pangngalan ay bumubuo ng idiomatikong pag-uulit na nagpapatingkad sa tindi ng pagnanasa. Likas sa modernong Tagalog ang ganitong salin at hindi nito nililimitahan ang diwa sa seksuwal na pagnanasa.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay ilang o disyertong pook. Maikli, marangal, at pamilyar sa wikang biblikal ang “ilang,” habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: וַיְנַסּוּ
  choice: sinubok nila
  rationale: Tuwirang ipinapahayag ng נסה ang pagsubok o paglalagay sa pagsubok. Hindi na dinagdagan ang salin ng paliwanag tungkol sa kanilang motibo.
- source_word: אֵל
  choice: Diyos
  rationale: Sa kontekstong ito, ang karaniwang katawagan na “Diyos” ang pinakanatural na katumbas ng אֵל.
- source_word: בִּישִׁימוֹן
  choice: sa lupaing tiwangwang
  rationale: Ang יְשִׁימוֹן ay tumutukoy sa tigang at mapanglaw na disyertong lupain. Pinanatili ng “lupaing tiwangwang” ang kaibhan nito sa naunang מִדְבָּר na isinaling “ilang.”
theological_decisions:
- issue: Kung literal o idiomatiko ang salin sa magkauring pandiwa at pangngalan
  choice: 'Idiomatiko: “matindi ang kanilang pagnanasa”'
  alternative: 'Literal: “nagnasa sila ng pagnanasa”'
  rationale: Ang pag-uulit sa Hebreo ay nagpapasidhi sa pandiwa. Inililipat ng salin ang diin sa natural na Tagalog nang hindi tinatakpan ang bigat ng kanilang pagnanasa o nagdaragdag ng tiyak na bagay na hindi binanggit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “ilang” dahil buhay pa ito sa pangkalahatan at biblikal na gamit; ang “lupaing tiwangwang” naman ay nagpapanatili sa pagkakaiba ng dalawang salitang Hebreo para sa disyertong pook.
