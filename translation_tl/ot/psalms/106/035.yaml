translation:
  language: tl
  text: Ngunit nakihalubilo sila sa mga bansa[a] at natutuhan nila ang mga gawi ng mga ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakihalo sila sa gitna ng mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “kanilang mga gawa” o “kanilang mga kilos”; dito, tumutukoy ito sa nakasanayang mga paraan at kilos ng mga bansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: nakihalo sila
  rationale: Ang hitpael ng ערב ay nagpapahiwatig ng pakikihalo o pakikisama sa ibang mga bayan. Likas at maikli sa modernong Tagalog ang “nakihalo,” at naipahihiwatig nito ang paglahok nang hindi nagdaragdag ng tahasang paghatol.
- source_word: בַגּוֹיִם
  choice: sa mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa mga nakapaligid na bayang hindi Israelita. Mas tuwiran ang “mga bansa” kaysa “mga Hentil,” na maaaring magpasok ng mga konotasyong hindi kailangan sa talata.
- source_word: וַיִּלְמְדוּ
  choice: natutuhan nila
  rationale: Pinananatili ng aktibong anyo ang tuwirang kahulugan na sila mismo ang natuto at umangkin sa mga ginagawa ng ibang mga bayan.
- source_word: מַעֲשֵׂיהֶם
  choice: ang mga gawi ng mga ito
  rationale: Literal itong “kanilang mga gawa,” ngunit sa konteksto ay tumutukoy sa nakasanayang mga kilos at gawain ng mga bansa. Malinaw sa kasalukuyang Tagalog ang “mga gawi,” habang hindi nito labis na tinutukoy kung panrelihiyon o panlipunan ang bawat gawain.
theological_decisions:
- issue: Ang moral at panrelihiyong bigat ng pakikihalo ng Israel sa mga bansa
  choice: Ilarawan ang may-pananagutang pakikihalo at pagkatuto sa mga gawi ng mga bansa nang hindi nagdaragdag ng tahasang paghatol.
  alternative: Gumamit ng mas neutral na “namuhay kasama ng mga bansa,” o mas mapanghusgang “dinungisan nila ang kanilang sarili sa mga bansa.”
  rationale: Ang Hebreo ay nagsasaad ng pakikihalo at pagkatuto; ang negatibong paghatol ay nagmumula sa mas malawak na konteksto ng salmo. Pinananatili ng salin ang tensiyong ito nang hindi pinatitindi o pinahihina ang sinabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakihalo” at “mga gawi” bilang likas na pananalita, habang inilagay sa mga talababa ang mas literal at alternatibong mga pagbasa.
