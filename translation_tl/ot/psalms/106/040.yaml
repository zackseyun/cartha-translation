  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: tl
  text: Nag-alab ang galit ni Yahweh laban sa kanyang bayan,[a] at kinasuklaman niya ang kanyang mana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagningas ang poot ni Yahweh laban sa kanyang bayan.”
    reason: lexical_alternative
  - marker: b
    text: O “kinamuhian niya ang kanyang pamana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Ang tambalang Hebreo ay naglalarawan ng galit bilang umiinit o nagliliyab. Likas sa modernong Tagalog ang “nag-alab ang galit” at napapanatili nito ang matingkad na talinghaga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּעַמּוֹ
  choice: laban sa kanyang bayan
  rationale: Sa konteksto ng galit, ang pang-ukol na בְּ ay tumutukoy sa pinatutungkulan ng galit; malinaw at natural itong ipinapahayag ng “laban sa.”
- source_word: וַיְתָעֵב
  choice: kinasuklaman niya
  rationale: Ipinahahayag ng pandiwa ang matinding pagkasuklam o pagkamuhi. Ang “kinasuklaman” ay malakas ngunit natural at angkop sa marangal na himig ng salmo.
- source_word: נַחֲלָתוֹ
  choice: kanyang mana
  rationale: Ang נַחֲלָה ay mana o bahaging pag-aari. Pinananatili ng “mana” ang ugnayang tipan kung saan ang bayan ay inilalarawan bilang mana ni Yahweh, sa halip na gawing payak na “pag-aari.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Talinghaga ng nag-aalab na galit ng Diyos
  choice: nag-alab ang galit ni Yahweh
  alternative: nagalit si Yahweh; nagningas ang poot ni Yahweh
  rationale: Pinananatili ng salin ang Hebreong larawan ng init o pagliyab at hindi nito pinapahina o ipinapaliwanag nang lampas sa teksto ang paglalarawan sa galit ng Diyos.
- issue: Ang bayan bilang mana ni Yahweh
  choice: kanyang mana
  alternative: kanyang minanang pag-aari; kanyang pamana
  rationale: Pinananatili ang matapang na paglalarawan ng Israel bilang mana ni Yahweh nang hindi nilulutas ang tensiyon na kinasuklaman niya ang mismong tinatawag na kanyang mana.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ang “nag-alab ang galit” ay isang buhay at karaniwang idyoma; ang “kinasuklaman” at “mana” ay nagpapanatili sa tindi at teolohikal na bigat ng Hebreo nang hindi nagiging lipas o labis na teknikal.
