  - marker: b
    text: O “hindi sila nagtiwala sa kanyang salita.” Ang “kanyang salita” ay maaari ring unawain dito bilang “kanyang pangako.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Kaya hinamak nila
  rationale: Ang מָאַס ay nangangahulugang tumanggi o humamak. Pinananatili ng “hinamak” ang matinding pagsaway sa salaysay; ipinahihiwatig ng “kaya” ang pagsulong ng pangyayari sa konteksto.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: ang kanais-nais na lupain
  rationale: Ang אֶרֶץ ay “lupain,” at ang חֶמְדָּה ay tumutukoy sa bagay na kanais-nais, kalugod-lugod, o mahalaga. Ang parirala ay malapit sa anyo at diwa ng Hebreo at likas pa rin sa marangal na modernong Filipino.
- source_word: לֹא הֶאֱמִינוּ
  choice: hindi sila naniwala
  rationale: Ang Hiphil ng אָמַן ay maaaring mangahulugang maniwala o magtiwala. Ang “naniwala” ay tuwirang kaugnay ng kasunod na “salita” at hindi nilulutas ang saklaw nang higit sa Hebreo.
- source_word: לִדְבָרוֹ
  choice: sa kanyang salita
  rationale: Ang דָּבָר ay maaaring salita, sinabi, o pangako. Pinananatili ng “kanyang salita” ang mas malawak na kahulugan ng pinagmulang teksto, habang inilalagay sa talababa ang kontekstuwal na posibilidad na “pangako.”
theological_decisions:
- issue: Kung tahasang tutukuyin ang salita bilang pangako ng Diyos tungkol sa lupain
  choice: Panatilihin sa pangunahing teksto ang “kanyang salita”
  alternative: kanyang pangako
  rationale: “Kanyang salita” ang tuwirang anyo ng Hebreo at hindi nito pinakikitid ang kahulugan. Malinaw sa konteksto ang diwa ng pangako, ngunit mas angkop itong itala bilang alternatibo.
- issue: Kung isasalin ang הֶאֱמִינוּ bilang pananampalataya o pagtitiwala
  choice: naniwala
  alternative: nagtiwala
  rationale: Parehong saklaw ng pandiwa ang paniniwala at pagtitiwala. Ang “naniwala” ay natural sa pariralang “sa kanyang salita,” samantalang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang sobrang arkaikong pananalita at pinanatili ang ambiguwidad ng Hebreo sa “naniwala/nagtiwala” at “salita/pangako.”
