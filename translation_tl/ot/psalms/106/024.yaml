  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: tl
  text: Pagkatapos, hinamak nila ang kanais-nais na lupain[a]; hindi sila naniwala sa kanyang salita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalugod-lugod na lupain” o “kaaya-ayang lupain.”
