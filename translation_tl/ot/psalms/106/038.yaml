base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: tl
  text: Ibinuhos[a] nila ang dugong walang sala—ang dugo ng mga anak nilang lalaki at babae, na inihain nila sa mga diyus-diyosan ng Canaan—at ang lupain ay nadungisan ng dugo.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpadanak sila ng dugong walang sala.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga dugo,” isang anyong maramihan na maaaring tumukoy sa pagdanak ng dugo o sa pananagutan dahil dito.
    reason: lexical_alternative
  - marker: c
    text: O “at nadungisan ang lupain dahil sa pananagutan sa pagdanak ng dugo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: Ibinuhos nila
  rationale: Pinananatili ng “ibinuhos” ang matingkad at konkretong larawan ng pandiwang שׁפך, na sa kontekstong ito ay tumutukoy sa marahas na pagdanak ng dugo.
- source_word: דָם נָקִי
  choice: dugong walang sala
  rationale: Likas sa makabagong Tagalog ang pariralang ito at malinaw nitong pinananatili ang tahasang paghatol ng Hebreo na walang kasalanan ang mga pinatay.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ang dugo ng mga anak nilang lalaki at babae
  rationale: Pinananatili nito ang pag-uulit ng “dugo” na nagpapaliwanag kung kaninong dugong walang sala ang tinutukoy.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: na inihain nila
  rationale: Ang “inihain” ay tuwirang naghahatid ng kultikong diwa ng זבח at malinaw na tumutukoy sa mga anak bilang mga handog.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: sa mga diyus-diyosan ng Canaan
  rationale: Ang “mga diyus-diyosan” ay natural at may angkop na mapanuring diwa para sa עֲצַבִּים, habang pinananatili ang kaugnayan sa Canaan.
- source_word: וַתֶּחֱנַף
  choice: ay nadungisan
  rationale: Ipinahahayag ng “nadungisan” ang moral at panrelihiyong karumihang idinulot sa lupain ng pagdanak ng dugo.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Ang konteksto ay tumutukoy sa partikular na lupain ng Canaan at Israel, hindi sa buong daigdig.
- source_word: בַּדָּמִים
  choice: ng dugo
  rationale: Pinananatili nito ang paulit-ulit na larawan ng dugo. Ipinaliliwanag sa talababa na maramihan ang anyong Hebreo at maaari rin itong magpahiwatig ng pagdanak ng dugo o pananagutan dahil dito.
theological_decisions:
- issue: Kalagayang moral ng mga batang inihain
  choice: Tahasan silang inilalarawan bilang dugong walang sala.
  alternative: dugo ng mga walang sala
  rationale: Pinananatili ng salin ang moral na hatol ng דָם נָקִי nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Uri ng pagkadungis ng lupain
  choice: Ang lupain ay nadungisan ng dugo.
  alternative: Ang lupain ay nadungisan dahil sa pananagutan sa pagdanak ng dugo.
  rationale: Pinananatili sa pangunahing teksto ang konkretong larawan at pag-uulit ng “dugo,” samantalang inilalagay sa talababa ang posibleng diwa ng bloodguilt upang hindi tahimik na lutasin ang leksikal at teolohikal na saklaw ng maramihang דָּמִים.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matingkad na pag-uulit ng “dugo,” ang partikular na “lupain,” at ang moral na bigat ng talata nang hindi gumagamit ng teknikal o sektaryang pananalita.
