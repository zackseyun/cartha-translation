  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: tl
  text: Sino ang makapagsasalaysay ng makapangyarihang mga gawa ni Yahweh, at makapagpapahayag ng lahat ng papuri sa kanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “makapagpaparinig ng lahat ng papuri sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino ang makapag-
  rationale: Ang panghalip na patanong ay bumubuo ng retorikal na tanong tungkol sa kakayahan. Likas sa Tagalog ang anyong “Sino ang makapag-” upang maipakita ang ipinahihiwatig na kakayahan.
- source_word: יְמַלֵּל
  choice: makapagsasalaysay
  rationale: Ang Piel ng מלל ay tumutukoy sa pagsasabi o paglalahad. Ipinahihiwatig ng “makapagsasalaysay” ang pagbabanggit ng mga gawa nang may angkop na marangal na tono.
- source_word: גְּבוּרוֹת
  choice: makapangyarihang mga gawa
  rationale: Ang pangmaramihang pangngalan ay tumutukoy sa mga pagpapakita ng lakas o kapangyarihan, kaya higit na kongkreto at malinaw ang “makapangyarihang mga gawa” kaysa sa abstraktong “mga kapangyarihan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יַשְׁמִיעַ
  choice: makapagpapahayag
  rationale: Ang Hiphil ng שמע ay literal na “magparinig” o “iparinig.” Sa konteksto ng hayagang pagpupuri, natural na ipinahahayag ito sa Tagalog bilang “makapagpapahayag,” habang inilalagay sa talababa ang mas literal na anyo.
- source_word: כָּל
  choice: lahat ng
  rationale: 'Pinananatili nito ang sumasaklaw na diin ng Hebreo: walang sinuman ang lubos na makapaghahayag ng buong papuri sa Diyos.'
- source_word: תְּהִלָּתוֹ
  choice: papuri sa kanya
  rationale: Ang pangngalang isahan na may hulaping panghalip ay maaaring gamitin nang kolektibo. Natural sa kasalukuyang Tagalog ang “papuri sa kanya,” at hindi nito ginagawang tahasang mga gawa ang bagay na pinupuri.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng tradisyonal na titulong “PANGINOON.”
- issue: Saklaw ng retorikal na tanong
  choice: Iisang “Sino ang” na sumasaklaw sa dalawang pandiwa
  alternative: Dalawang magkahiwalay na tanong
  rationale: Sa Hebreo, ang מִי (“sino”) ay tahasang lumilitaw minsan at natural na sumasaklaw kapwa sa pagsasalaysay at pagpapahayag. Pinananatili nito ang diin na hindi kayang lubusang banggitin ng tao ang mga gawa at papuri ni Yahweh.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “makapangyarihang mga gawa” at “makapagsasalaysay” ay malinaw sa karaniwang mambabasa habang naaangkop sa patulang himig ng Awit. Pinanatili ang koordinasyong “at” ng Hebreo at ang kabuuang puwersa ng retorikal na tanong.
