  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: tl
  text: At ibinilang iyon sa kanya bilang katuwiran[a] sa sali’t salinlahi, magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinuring na katuwiran.” Ginagamit sa Hebreo ang karaniwang idyoma para sa isang bagay na itinuturing o ibinibilang na katuwiran.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa salinlahi at salinlahi,” isang idyomang tumutukoy sa lahat ng magkakasunod na salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: At iyon ay ibinilang
  rationale: Ang Niphal ng חשׁב ay nagpapahayag na ang naunang ginawa ay itinuring o ibinilang sa isang tiyak na paraan. Pinananatili ng “ibinilang” ang diwang mapagpasya o mapagtutuos nang hindi nililinaw nang higit sa Hebreo kung ano mismo ang saklaw ng pagbilang.
- source_word: לוֹ
  choice: sa kanya
  rationale: Likas na ipinakikita ng ל na may hulaping panghalip kung kanino ibinilang ang bagay; ang “sa kanya” ang tuwirang katumbas sa makabagong Tagalog.
- source_word: לִצְדָקָה
  choice: bilang katuwiran
  rationale: Karaniwang kahulugan ng צְדָקָה ang “katuwiran.” Sa idyomang חשׁב + ל, malinaw na ipinahahayag ng “bilang katuwiran” ang pagtataya rito nang hindi ito pinakikitid sa “isang matuwid na gawa.”
- source_word: לְדֹר וָדֹר
  choice: sa sali’t salinlahi
  rationale: Ang literal na “sa salinlahi at salinlahi” ay isang idyoma para sa magkakasunod na mga salinlahi. Ang “sa sali’t salinlahi” ay natural, marangal, at matatag na katumbas sa Tagalog.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Tumpak at likas na ipinahahayag ng “magpakailanman” ang pagpapatuloy hanggang sa walang takdang panahon at ang patulang diin ng Hebreo.
theological_decisions:
- issue: Kaugnayan sa Genesis 15:6 at ang teolohikal na diwa ng ibinilang na katuwiran
  choice: Panatilihin ang “ibinilang sa kanya bilang katuwiran” nang walang idinagdag na paliwanag na doktrinal.
  alternative: Itinuring itong isang matuwid na gawa niya.
  rationale: Umaalingawngaw sa talata ang biblikal na idyoma ng pagbibilang bilang katuwiran. Pinananatili ng salin ang ugnayang iyon at ang posibleng teolohikal na lalim nito, ngunit hindi ipinapasok ang mga kategoryang doktrinal na hindi tahasang sinasabi ng salmo.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinili ang “ibinilang” upang mapanatili ang idyomang Hebreo at ang alingawngaw nito sa ibang bahagi ng Kasulatan; ginamit ang “sali’t salinlahi” bilang likas na idyomang Filipino.
