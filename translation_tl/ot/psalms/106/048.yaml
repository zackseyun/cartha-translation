id: PSA.106.48
reference: Psalms 106:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: tl
  text: 'Purihin si Yahweh,[a] ang Diyos ng Israel,

    mula sa walang hanggan hanggang sa walang hanggan.[b]

    Sabihin nawa ng buong bayan,[c] “Amen!”

    Purihin ninyo si Yah![d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay transliterasyon ng banal na pangalang יהוה (YHWH), na madalas isaling “Panginoon.”
    reason: divine_name
  - marker: b
    text: 'Maaari ring isalin: “mula sa kapanahunan hanggang sa kapanahunan” o “mula sa walang pasimula hanggang sa walang katapusan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin ayon sa anyo ng pandiwa: “At sinabi ng buong bayan” o “At sasabihin ng buong bayan.” Sa kontekstong liturhiko, malamang na panawagan ang diwa.'
    reason: grammatical_ambiguity
  - marker: d
    text: Ang “Yah” ay maikling anyo ng pangalang “Yahweh.” Ang parirala ay tradisyonal ding isinusulat na “Aleluya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Isang pasibong pandiwaring ginagamit bilang pormulang doksolohikal. Ang “Purihin” ang likas at marangal na pananalitang Filipino para sa pagbibigay-puri sa Diyos, bagaman mas literal itong maaaring unawaing “Pagpalain.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang katumbas ng construct chain at natural sa modernong Filipino.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Pinananatili ang dalawang dulo ng Hebreong pormula at ang di-nalilimitahang saklaw ng panahon nang hindi ito ginagawang payak na “magpakailanman.”
- source_word: וְאָמַר
  choice: Sabihin nawa
  rationale: Bagaman anyong qatal ang pandiwa, malamang na gumaganap itong panawagang liturhiko sa konteksto. Ipinahihiwatig ng “nawa” ang jussive o exhortative na lakas nito.
- source_word: כָּל הָעָם
  choice: ng buong bayan
  rationale: Tumutukoy sa sambayanang sama-samang tumutugon sa pagsamba; mas natural dito ang “buong bayan” kaysa “lahat ng mga tao.”
- source_word: אָמֵן
  choice: Amen
  rationale: Pinananatili ang kinikilalang tugong liturhiko sa halip na ipakahulugang “Tunay” o “Mangyari nawa.”
- source_word: הַלְלוּ יָהּ
  choice: Purihin ninyo si Yah
  rationale: Isinasalin ang maramihang pautos na הַלְלוּ at pinananatili ang maikling anyo ng banal na pangalan na יָהּ, na naiiba sa buong anyong יְהוָה sa unang linya.
theological_decisions:
- issue: Pagkakaiba ng יְהוָה at ng maikling anyong יָהּ sa iisang talata
  choice: Isalin bilang “Yahweh” at “Yah” ayon sa pagkakasunod
  alternative: Gamitin ang “Panginoon” sa dalawang lugar, o gawing “Aleluya” ang huling parirala
  rationale: Sadyang gumagamit ang Hebreo ng buong banal na pangalan at pagkatapos ay ng maikling anyo nito. Pinananatili ng salin ang pagkakaibang ito nang walang pagpapalit ng pangalan sa isang titulo.
- issue: Lakas ng וְאָמַר bilang tugong liturhiko
  choice: “Sabihin nawa ng buong bayan”
  alternative: “At sinabi ng buong bayan” o “At sasabihin ng buong bayan”
  rationale: Maaaring basahin sa anyo bilang naganap na kilos, ngunit sa konteksto ng doksolohiya ay malakas ang gamit nitong panawagan sa kapulungan. Inilalagay sa talababa ang tunay na gramatikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa sama-samang pagsamba. Ginamit ang maiikling linyang patula upang ipakita ang doksolohikal at responsoryal na daloy. Pinanatili ang “Amen” at ang mga pangalang “Yahweh/Yah,” habang ipinaliwanag sa talababa ang mga alternatibo at ang gramatikal na tensiyon.
