  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: tl
  text: 'upang pabagsakin ang kanilang mga inapo[a] sa gitna ng mga bansa,

    at upang ikalat sila sa iba’t ibang lupain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga salinlahi”; literal na “kanilang binhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: upang pabagsakin
  rationale: Ang Hiphil infinitive ng נפל ay may diwang sanhi, ‘pangyarihing bumagsak.’ Pinananatili ng ‘pabagsakin’ ang lawak nito nang hindi nililimitahan sa pagpatay o pagkatalo sa digmaan.
- source_word: זַרְעָם
  choice: ang kanilang mga salinlahi
  rationale: Ang זֶרַע ay literal na ‘binhi’ ngunit tumutukoy rito sa mga inapo o susunod na salinlahi. Ang ‘mga salinlahi’ ay natural at marangal sa makabagong Tagalog at nagpapanatili ng diwa ng pagpapatuloy ng angkan.
- source_word: בַּגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy sa mga banyagang bansa. Iniiwasan ng saling ito ang mga konotasyong maaaring dala ng ‘mga Hentil’ na hindi kinakailangan sa konteksto.
- source_word: וּלְזָרוֹתָם
  choice: at upang ikalat sila
  rationale: Ang זרה ay maaaring mangahulugang ‘ikalat’ o ‘tahipan.’ Sa paralelismo at konteksto ng pagkakalat sa ibang mga lupain, ‘ikalat’ ang pinakamalinaw na katumbas.
- source_word: בָּאֲרָצוֹת
  choice: sa iba't ibang lupain
  rationale: Ang maramihang anyo ng אֶרֶץ ay tumutukoy sa maraming lupain o bansa. Ipinahahayag ng ‘iba't ibang lupain’ ang malawak na heograpikong pagkakalat sa natural na Tagalog.
theological_decisions:
- issue: Ang uri ng hatol na inilalarawan
  choice: Inilalarawan ng talata ang hatol na humahantong sa pagbagsak ng kanilang mga salinlahi at pagkakalat sa mga banyagang bansa at lupain.
  alternative: Maaaring unawain ang unang sugnay bilang pagpapamatay o pagdaig sa kanilang mga salinlahi sa gitna ng mga bansa.
  rationale: Mas malawak ang causative na anyo ng נפל kaysa pisikal na kamatayan lamang. Dahil kaparis nito ang pagkakalat sa ikalawang sugnay, pinananatili ng ‘pabagsakin’ ang tunay na lawak at tensiyon ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng dalawang infinitive na layunin sa pamamagitan ng ‘upang ... at upang ...’. Ginamit ang ‘salinlahi’ sa halip na literal na ‘binhi,’ habang inilagay sa talababa ang literal at alternatibong pagbasa.
