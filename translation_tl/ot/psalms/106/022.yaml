  text: mga kahanga-hangang bagay sa lupain ni Ham[a], mga nakagigimbal na bagay sa tabi ng Dagat na Pula[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ham” ay patulang pangalan para sa Ehipto sa kontekstong ito.
