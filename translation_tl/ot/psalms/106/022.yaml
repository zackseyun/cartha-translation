lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: mga kamangha-manghang gawa
  rationale: Tumutukoy ang anyong maramihan mula sa פלא sa mga pambihirang ginawa. Nililinaw ng “gawa” na mga kilos ang tinutukoy, habang pinananatili ng “kamangha-mangha” ang patulang paglalarawan.
- source_word: בְּאֶרֶץ
  choice: sa lupain ni
  rationale: Lokatibo ang בְּ kasama ng אֶרֶץ. Likas sa Filipino ang “sa lupain ni” bago ang pangalang Ham.
- source_word: חָם
  choice: Ham
  rationale: Pinananatili ang pangalang nasa Hebreo sa halip na palitan ito ng interpretasyong “Ehipto”; ipinaliliwanag sa talababa ang patulang gamit nito.
- source_word: נ֝וֹרָאוֹת
  choice: mga kagila-gilalas na gawa
  rationale: Mula sa ugat na ירא, inilalarawan nito ang mga gawang pumupukaw ng matinding paghanga at sindak. Ang “kagila-gilalas” ay marangal at hindi nagpapahiwatig na masama ang mga gawa.
- source_word: עַל
  choice: sa
  rationale: Sa kaugnayan sa isang heograpikong lugar, maaaring tumukoy ang עַל sa kinaroroonan ng pangyayari. Ang “sa Dagat” ang pinakanatural sa Filipino at hindi sapilitang nagtatakda kung ito ay “sa tabi,” “sa ibabaw,” o “doon sa.”
- source_word: יַם סוּף
  choice: Dagat na Pula
  rationale: Ginagamit ang nakaugaliang tawag na tumutukoy sa pangyayaring binabanggit. Inilalahad sa talababa ang mas literal at leksikal na alternatibong “Dagat ng mga Tambo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na patula ngunit madaling maunawaan. Ginamit ang magkatugmang pariralang “mga kamangha-manghang gawa” at “mga kagila-gilalas na gawa” upang mapanatili ang paralelismo at ang pagkakaiba ng נִפְלָאוֹת at נוֹרָאוֹת. Inayos ang mga marker ayon sa pagkakasunod ng paglitaw sa teksto.
