  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: tl
  text: Kaya iniligtas niya sila[a] mula sa kamay ng napopoot sa kanila, at tinubos niya sila[b] mula sa kamay ng kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinagip niya sila”; ang pandiwang Hebreo ay maaaring tumukoy sa pagsagip mula sa panganib.
    reason: lexical_alternative
  - marker: b
    text: Ang “tinubos” ay maaari ring isaling “sinagip” o “pinalaya”; ipinahihiwatig ng Hebreo ang pagbawi o pagpapalaya sa pamamagitan ng pakikialam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: iniligtas niya sila
  rationale: Ang pandiwang mula sa ישׁע ay tumutukoy sa pagliligtas o pagsagip mula sa panganib. Ang “iniligtas” ay likas sa modernong Filipino at nagpapanatili sa bigat ng ginawang pagliligtas ng Diyos.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang Hebreong larawan ng kamay bilang kapangyarihan o kontrol; malinaw at pamilyar din ang idyoma sa Filipino.
- source_word: שׂוֹנֵא
  choice: napopoot sa kanila
  rationale: Pinananatili ang isahang anyo ng substantibong participle sa pariralang “kamay ng napopoot sa kanila,” sa halip na gawing maramihan. Maaari itong tumukoy sa isang kumakatawang kaaway o kapangyarihang mapanupil.
- source_word: וַיִּגְאָלֵם
  choice: tinubos niya sila
  rationale: Ang גאל ay nagpapahayag ng pagbawi o pagpapalaya sa pamamagitan ng pakikialam. Pinananatili ng “tinubos” ang natatanging diwa nito at hindi ito ipinapantay lamang sa naunang “iniligtas.”
- source_word: אוֹיֵב
  choice: kaaway
  rationale: Ang isahang “kaaway” ay tumutugma sa Hebreo at kaparis ng naunang isahang taong napopoot.
theological_decisions:
- issue: Kung pagsasamahin sa iisang pangkalahatang ideya ang magkatambal na pandiwang ישׁע at גאל
  choice: Pinanatiling magkaiba bilang “iniligtas” at “tinubos”
  alternative: Isalin ang dalawa bilang “iniligtas” o “pinalaya”
  rationale: Magkaugnay ngunit hindi ganap na magkapareho ang dalawang salita. Pinananatili ng salin ang poetikong paralelismo at ang pagkakaiba ng pagliligtas at pagtubos nang hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang Hebreong larawang “mula sa kamay” at ang isahang pagtukoy sa dalawang kaaway, gayundin ang dalawang magkaibang pandiwa para sa pagliligtas at pagtubos.
