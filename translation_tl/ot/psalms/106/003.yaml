  language: tl
  text: 'Pinagpala ang mga nag-iingat ng katarungan,[a]

    na gumagawa ng katuwiran sa lahat ng panahon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maligaya ang mga tumutupad ng katarungan, na gumagawa ng tama sa lahat ng panahon.”
    reason: Alternatibong salin para sa אַשְׁרֵי, שֹׁמְרֵי, צְדָקָה, at בְּכָל עֵת.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Pinagpala ang
  rationale: Ang anyong padamdam ay nagpapahayag ng kalagayang pinagpala. Pinananatili ng “pinagpala” ang marangal at teolohikal na himig ng isang pahayag ng pagpapala, sa halip na ituon lamang sa damdaming masaya.
- source_word: שֹׁמְרֵי
  choice: mga nag-iingat
  rationale: Ipinahihiwatig ng participle ang palagian o nakagawiang pagsunod. Ang “nag-iingat” ay likas na Filipino para sa maingat na pagtupad at pagpapanatili ng katarungan.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa kontekstong etikal, tumutukoy ito sa makatarungang pamumuhay o pagkilos, hindi lamang sa hatol ng hukuman.
- source_word: עֹשֵׂה
  choice: gumagawa
  rationale: Bagaman isahan ang anyong Hebreo kasunod ng pahayag na maramihan, pangkalahatan o kolektibo ang puwersa nito. Ang “gumagawa” ay natural na naglalahad ng patuloy na gawain.
- source_word: צְדָקָה
  choice: katuwiran
  rationale: Pinananatili ng “katuwiran” ang moral at teolohikal na bigat ng salita at hindi ito ipinaghahalo sa naunang “katarungan.”
- source_word: בְּכָל עֵת
  choice: laging
  rationale: Malinaw at natural nitong ipinapahayag ang patuloy o palagiang pagkilos na tinutukoy ng pariralang Hebreo.
theological_decisions:
- issue: Ugnayan ng מִשְׁפָּט at צְדָקָה
  choice: Isinalin nang magkaiba bilang “katarungan” at “katuwiran.”
  alternative: Gamitin ang magkasingkahulugan o iisang salitang tumutukoy sa katarungan para sa dalawang termino.
  rationale: Magkaugnay ngunit hindi lubos na magkapareho ang dalawang terminong etikal sa Hebreo. Pinananatili ng magkaibang salin ang kanilang pagkakaiba at ang paralelismong patula.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinagpala,” “katarungan,” at “katuwiran” upang mapanatili ang anyong pahayag ng pagpapala at ang pagkakaiba ng dalawang terminong etikal. Hinati sa dalawang linya upang maipakita ang paralelismong patula.
