base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/019.yaml
  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: tl
  text: Gumawa sila ng isang guya sa Horeb at yumukod sa isang imaheng hinulma sa metal[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “imaheng binubo” o “imaheng hinulma.” Ang salitang Hebreo ay tumutukoy sa imaheng ginawa sa pamamagitan ng paghuhulma ng tunaw na materyal, karaniwang metal.
    reason: lexical_alternative
  - marker: b
    text: Ipinapaalala nito ang guya na ginawa sa Horeb/Sinai sa Exodo 32.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: Gumawa sila
  rationale: Ang Qal ng עשה ay karaniwang nangangahulugang “gumawa.” Direkta at natural ito sa Filipino, nang hindi idinaragdag ang ideya ng masining na paghubog.
- source_word: עֵגֶל
  choice: isang guya
  rationale: Ang עֵגֶל ay batang baka o guya. Pinananatili ng “guya” ang malinaw na kaugnayan sa salaysay sa Exodo 32 nang hindi idinaragdag ang “ginto,” na wala sa talatang ito.
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Ang בְּ ay likas na isinasaling “sa” para sa lokasyon; pinananatili ang pangalang Horeb gaya ng nasa Hebreo.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: at yumukod
  rationale: Ang anyo ng שחה ay tumutukoy sa pisikal na pagyukod bilang pagpaparangal o pagsamba. Pinananatili ng “yumukod” ang kilos na tahasang sinasabi ng Hebreo at hindi agad pinapalitan ng interpretatibong “sumamba.”
- source_word: לְמַסֵּכָה
  choice: sa isang imaheng hinulma sa metal
  rationale: Ang מַסֵּכָה ay isang imaheng ginawa sa pamamagitan ng pagbubuhos o paghuhulma ng tunaw na materyal, karaniwang metal. Malinaw sa modernong Filipino ang pariralang ito at napapanatili nito ang tiyak na paraan ng paggawa na mawawala sa pangkalahatang “diyus-diyosan.”
theological_decisions:
- issue: Kung tatawagin bang “gintong guya” ang bagay
  choice: “isang guya,” nang walang “ginto”
  alternative: “isang gintong guya”
  rationale: Bagaman sinasabi ng Exodo 32 na ginto ang guya, “guya” at “imaheng hinulma” lamang ang tahasang nasa talatang ito. Ang pagdaragdag ng “ginto” ay kukuha ng detalye mula sa mas malawak na salaysay sa halip na isalin ang mismong teksto.
- issue: Kung isasaling “sumamba” o “yumukod” ang וַיִּשְׁתַּחֲווּ
  choice: “yumukod”
  alternative: “sumamba”
  rationale: Ang konteksto ay malinaw na idolatriya, ngunit ang Hebreo ay nagpapanatili rin ng kongkretong kilos ng pagyukod. Iniiwasan ng salin na lunukin ng interpretasyon ang pisikal na larawan.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “imaheng hinulma sa metal” upang maging malinaw sa karaniwang mambabasa ang tiyak na kahulugan ng מַסֵּכָה; iniwasan ang mas lumang “imaheng binubo” sa pangunahing teksto. Ang “yumukod” ay natural at nagpapanatili sa pisikal na kilos at sa pahiwatig ng pagsamba.
