  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: tl
  text: Pumukaw sila ng galit sa tubig ng Meriba[a], at napahamak si Moises dahil sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Meriba ay nangangahulugang “pagtatalo” o “alitan.”
    reason: cultural_note
  - marker: b
    text: O “Ginalit nila siya sa tubig ng Meriba.” Hindi tahasang binabanggit sa Hebreo kung sino ang pinukaw nilang magalit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: Pumukaw sila ng galit
  rationale: Pinananatili ang causative na diwa ng קצף nang hindi tinutukoy kung sino ang ginalit, sapagkat walang tahasang layon sa Hebreo.
- source_word: עַל מֵי מְרִיבָה
  choice: sa may tubig ng Meriba
  rationale: Likas sa modernong Tagalog ang “sa may” para sa lugar o pangyayaring pinangyarihan; pinanatili ang Meriba bilang pangalang pantangi.
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: napahamak si Moises
  rationale: Ipinahahayag nito ang masamang kinahinatnan para kay Moises nang hindi ipinahihiwatig na siya mismo ay masama.
- source_word: בַּעֲבוּרָם
  choice: dahil sa kanila
  rationale: Malinaw na ipinahahayag ang sanhi at pinananatili ang pagtukoy sa mga tao sa naunang sugnay.
theological_decisions:
- issue: Ang masamang kinahinatnan ni Moises
  choice: Sinasaad na napahamak si Moises dahil sa kanila, ngunit hindi nililinaw sa talatang ito ang buong dahilan o antas ng pananagutan.
  alternative: Tahasan itong ipaliwanag bilang kasalanan ni Moises sa Meriba, o bilang pananagutan lamang ng bayan.
  rationale: Pinananatili ng Hebreo ang tensiyon sa pagitan ng pang-uudyok ng bayan at ng kinahinatnan para kay Moises; hindi ito dapat lutasin nang lampas sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “pumukaw ng galit” upang mapanatili ang tunay na kalabuan ng Hebreo, at “napahamak” bilang natural na paglalarawan ng masamang kinahinatnan.
