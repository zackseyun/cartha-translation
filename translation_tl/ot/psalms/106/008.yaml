  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: tl
  text: Gayunman,[a] iniligtas niya sila alang-alang sa kanyang pangalan,[b] upang ipaalam ang kanyang kapangyarihan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At iniligtas niya sila” o “Ngunit iniligtas niya sila.” Maaaring isalin sa iba’t ibang paraan ang pangatnig sa Hebreo; sa kontekstong ito, ipinakikita nito ang pagsalungat sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Ang “alang-alang sa kanyang pangalan” ay maaari ring unawain bilang “alang-alang sa kanyang reputasyon,” bagaman ang “pangalan” sa Hebreo ay maaari ring tumukoy sa ipinakilalang pagkatao at karangalan ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: O “upang ipaalam ang kanyang lakas.” Maaari ring saklawin ng salitang Hebreo ang kanyang makapangyarihang mga gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Gayunman, iniligtas niya sila
  rationale: Ang pandiwang mula sa ישׁע ay nangangahulugang ‘iligtas’ o ‘hanguin.’ Ipinahihiwatig ng konteksto ang pagsalungat sa paghihimagsik na binanggit sa naunang talata, kaya natural ang ‘Gayunman’ habang pinananatili ng ‘iniligtas’ ang tuwirang diwa ng pandiwa.
- source_word: לְמַעַן
  choice: alang-alang sa
  rationale: Ipinapahayag ng לְמַעַן ang layunin o batayan ng pagkilos. Ang ‘alang-alang sa’ ay likas sa modernong Filipino at akma sa kasunod na ‘kanyang pangalan.’
- source_word: שְׁמוֹ
  choice: kanyang pangalan
  rationale: 'Pinananatili ang ‘pangalan’ sapagkat higit ito sa reputasyon lamang: maaari nitong saklawin ang ipinakilalang pagkatao, karangalan, at pagkakakilanlan ng Diyos.'
- source_word: לְהוֹדִיעַ
  choice: upang ipakilala
  rationale: Ang Hiphil infinitive ng ידע ay causative, ‘ipaalam’ o ‘gawing kilala.’ Ang ‘upang ipakilala’ ay malinaw at natural na nagpapahayag ng layunin.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang kailangang hiwalay na katumbas sa Filipino.
- source_word: גְּבוּרָתוֹ
  choice: kanyang kapangyarihan
  rationale: Ang גְּבוּרָה ay maaaring tumukoy sa lakas, kapangyarihan, o makapangyarihang gawa. Sa pangungusap na ito, natural ang abstraktong ‘kapangyarihan’ bilang bagay na ipinakikilala sa pamamagitan ng pagliligtas.
theological_decisions:
- issue: Kahulugan ng ‘alang-alang sa kanyang pangalan’
  choice: Ang pagliligtas ng Diyos ay ginawa alang-alang sa karangalan at pagpapakilala ng kanyang sariling pangalan at pagkatao.
  alternative: Alang-alang sa kanyang reputasyon.
  rationale: Kasama sa idyomang Hebreo ang reputasyon, ngunit mas malawak ang ‘pangalan’ kaysa pampublikong tingin lamang. Pinananatili nito ang kaugnayan sa pagkakakilanlan, karangalan, at ipinakilalang pagkatao ng Diyos nang hindi nilulutas nang labis ang saklaw ng idyoma.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘Gayunman’ upang ihayag ang kontekstuwal na pagsalungat nang hindi labis na binibigyang-kahulugan ang pangatnig. Pinanatili ang biblikal na idyomang ‘kanyang pangalan,’ at ipinaliwanag ang mas malawak na diwa nito sa talababa.
