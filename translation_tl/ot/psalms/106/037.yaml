  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: tl
  text: Isinakripisyo nila ang kanilang mga anak na lalaki at mga anak na babae sa mga demonyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: Inihain nila bilang handog
  rationale: Ang זבח ay tumutukoy sa pagkatay o paghahandog bilang sakripisyo. Nililinaw ng pariralang ito ang kontekstong pangritwal at iniiwasan ang mas pangkalahatang kahulugan ng simpleng “pinatay.”
- source_word: בְּנֵיהֶם
  choice: kanilang mga anak na lalaki
  rationale: Tiyak na “mga anak na lalaki” ang anyong maramihan ng בֵּן dito, kaya pinanatili ang kasariang tahasang binanggit sa Hebreo.
- source_word: וְאֶת בְּנוֹתֵיהֶם
  choice: at mga anak na babae
  rationale: Tiyak na “mga anak na babae” ang בְּנוֹתֵיהֶם. Kasama ng “mga anak na lalaki,” pinananatili nito ang buong saklaw at diin ng paratang.
- source_word: לַשֵּׁדִים
  choice: sa mga demonyo
  rationale: Ang שֵׁדִים ay tumutukoy sa mga espirituwal na nilalang na demonyo; ipinahihiwatig ng ל ang tumatanggap ng handog. Ipinahahayag din ng anyong Hebreo ang artikulong tiyak, kaya natural itong isinalin na “sa mga demonyo.”
theological_decisions:
- issue: Pagkakasalin ng שֵׁדִים
  choice: mga demonyo
  alternative: mga huwad na diyos; masasamang espiritu
  rationale: Pinananatili ng “mga demonyo” ang tuwirang pahayag ng tekstong Hebreo tungkol sa mga espirituwal na nilalang nang hindi ito ginagawang mga idolo lamang o dinaragdagan ng haka-hakang detalye.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inihain bilang handog” upang maging natural ngunit mapanatili ang kultikong diwa ng pandiwang Hebreo; tahasang pinanatili ang “mga anak na lalaki” at “mga anak na babae.”
