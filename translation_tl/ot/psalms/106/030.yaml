  text: וַ/יַּעֲמֹ֣ד פִּֽ֭ינְחָס וַ/יְפַלֵּ֑ל וַ֝/תֵּעָצַ֗ר הַ/מַּגֵּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: tl
  text: At tumindig si Finehas at namagitan[a], at napigil ang salot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpatupad ng hatol”; maaari rin, “nanalangin.” Maaaring magkaroon dito ang pandiwang Hebreo ng diwang hudisyal o ng pamamagitan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: tumindig
  rationale: Ang עמד ay nangangahulugang tumayo o tumindig. Ang “tumindig” ay natural sa marangal na salaysay at nagpapahiwatig ng pasiyang kumilos nang hindi dinaragdagan ang tiyak na kilos.
- source_word: פִּינְחָס
  choice: Finehas
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: וַיְפַלֵּל
  choice: namagitan
  rationale: Maaaring magkaroon ang piel ng פלל ng hudisyal o pamamagitan/pamamagitan-sa-panalangin na diwa. Pinananatili ng “namagitan” ang lawak ng kahulugan at ang kaugnayan sa mapagpasiyang pagkilos ni Finehas sa Bilang 25 nang hindi ito nililimitahan sa panalangin lamang.
- source_word: וַתֵּעָצַר
  choice: napigil
  rationale: Ang niphal ng עצר ay nagsasaad na ang isang bagay ay napahinto o napigil. Malinaw at natural sa Filipino ang “napigil.”
- source_word: הַמַּגֵּפָה
  choice: ang salot
  rationale: Ang מגפה ay isang nakamamatay na salot o paglaganap ng sakit/kamatayan. Ang “salot” ang maikli, dignified, at pamilyar na katawagang biblikal sa Filipino.
theological_decisions:
- issue: Kahulugan ng וַיְפַלֵּל kaugnay ng ginawa ni Finehas
  choice: namagitan
  alternative: nagpatupad ng hatol; nanalangin
  rationale: Tinutukoy ng salmo ang Bilang 25, kung saan ang mapagpasiyang pagkilos ni Finehas ang kaugnay ng pagpigil sa salot. Dahil maaaring maging hudisyal o pamamagitan ang puwersa ng pandiwa, malawak ang salin sa pangunahing teksto at inilalahad sa talababa ang mas tiyak na mga pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang “tumindig” sa halip na karaniwang “tumayo” upang maipakita ang mapagpasiyang pagkilos, at “namagitan” upang mapanatili ang tunay na kalabuan ng pandiwang Hebreo.
