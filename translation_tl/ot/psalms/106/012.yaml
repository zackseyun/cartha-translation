base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/012.yaml
  text: Then they believed his words[a]; they sang his praise.
translation:
  language: tl
  text: At naniwala sila sa kanyang mga salita[a]; umawit sila ng papuri sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Kaya naniwala sila sa kanyang mga salita.” Ang anyong pasalaysay sa Hebreo ay maaaring isalin sa “at” o sa mas tahasang pagkakasunod na “kaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Nang magkagayon, naniwala sila
  rationale: Ang Hiphil wayyiqtol ng אמן ay tumutukoy rito sa paniniwala o pagtitiwala. Isinasalaysay ng waw ang sumunod na pangyayari, kaya natural na ipinahahayag ito ng “Nang magkagayon,” nang hindi dinaragdagan ang diwa.
- source_word: בִדְבָרָיו
  choice: sa kanyang mga salita
  rationale: Ang דְבָרָיו ay pangmaramihan na may hulaping ikatlong panauhang panlalaki; pinananatili ng “mga salita” ang bilang ng Hebreo.
- source_word: יָשִׁירוּ
  choice: inawit nila
  rationale: Bagaman anyong imperfect ang pandiwa, ipinagpapatuloy nito rito ang nakaraang salaysay at natural na isinasalin sa naganap na aspekto sa Tagalog.
- source_word: תְּהִלָּתוֹ
  choice: ang papuri sa kanya
  rationale: Ang תְּהִלָּה na may hulaping ikatlong panauhang panlalaki ay papuring nauukol sa kanya. Mas natural sa modernong Tagalog ang “papuri sa kanya” kaysa “kanyang papuri,” na maaaring ipakahulugang papuring siya ang nagbibigay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Nang magkagayon” upang ihayag ang pagkakasunod ng salaysay, at “papuri sa kanya” upang maiwasan ang kalabuan ng “kanyang papuri.”
