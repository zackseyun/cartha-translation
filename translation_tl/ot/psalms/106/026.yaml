  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: tl
  text: Kaya itinaas niya ang kanyang kamay laban sa kanila[a], upang pabagsakin sila sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanumpa siya laban sa kanila”; ang idyomang Hebreo na “itinaas ang kanyang kamay” ay maaaring tumukoy sa panunumpa, lalo na sa konteksto ng paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: itinaas
  rationale: Pinananatili ang kongkretong kahulugan ng נשׂא at ang larawang nasa idyomang Hebreo, sa halip na agad itong ipakahulugang panunumpa.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tuwirang salin ng pangngalang may panghalip na hulapi; sa konteksto, tumutukoy ito sa kamay ng Diyos.
- source_word: לָהֶם
  choice: laban sa kanila
  rationale: Bagaman ang pang-ukol ay maaaring literal na 'sa kanila,' hinihingi ng mapanghatol na konteksto at ng idyoma ang likas na Tagalog na 'laban sa kanila.'
- source_word: לְהַפִּיל
  choice: upang pabagsakin
  rationale: 'Ipinahahayag ng anyong hiphil ng נפל ang sanhi: gawin o pangyarihing mabuwal ang isang tao. Ang ''pabagsakin'' ay maikli at likas sa modernong Tagalog.'
- source_word: אוֹתָם
  choice: sila
  rationale: Tuwirang kumakatawan sa panghalip na layon at likas na kasama ng pandiwang 'pabagsakin.'
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang 'ilang' ay dignido at nakaugat na salin ng מִדְבָּר sa konteksto ng paglalakbay ng Israel, nang hindi ipinapalagay na purong buhangin ang lugar.
theological_decisions:
- issue: Idyomatikong diwa ng 'itinaas ang kanyang kamay'
  choice: Panatilihin sa pangunahing teksto ang larawan ng pagtataas ng kamay, at ilagay sa talababa ang posibleng diwang panunumpa.
  alternative: Kaya nanumpa siya laban sa kanila
  rationale: Maaaring tumukoy ang kilos sa isang taimtim na panunumpa ng paghatol ng Diyos, ngunit hindi tahasang ginagamit sa Hebreo ang pandiwa para sa 'manumpa.' Pinananatili ng salin ang tunay na idyoma at ang interpretatibong puwang nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignido at madaling maunawaan. Pinanatili ang biblikal na larawang 'itinaas ang kanyang kamay' at ang salitang 'ilang,' habang ginawang natural ang layunin sa pariralang 'upang pabagsakin sila.'
