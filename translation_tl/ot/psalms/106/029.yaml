  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: tl
  text: Ginalit nila siya sa kanilang mga gawa[a], at sumiklab sa gitna nila ang isang salot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinukaw nila ang kanyang galit sa kanilang mga gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: Ginalit nila siya
  rationale: Ang Hiphil ng כעס ay nagpapahayag ng pag-udyok o pagsanhi ng galit. Likas sa modernong Tagalog ang “ginalit nila siya,” at malinaw nitong naipapakita ang diwang causative. Bagaman walang tahasang layon sa sugnay na Hebreo, ang “siya” ay likas na tumutukoy sa Diyos ayon sa konteksto.
- source_word: בְּמַעַלְלֵיהֶם
  choice: sa pamamagitan ng kanilang mga gawa
  rationale: Ang מַעֲלָלִים ay tumutukoy sa mga gawa o kilos, na may moral na kulay sa kontekstong ito. Ipinahihiwatig ng ב ang paraan o kasangkapan, kaya ginamit ang “sa pamamagitan ng.”
- source_word: וַתִּפְרָץ
  choice: sumiklab
  rationale: Ang פרץ ay may larawan ng biglaang pagputok o paglaganap. Ang “sumiklab” ay natural na katambal ng salot at pinananatili ang biglaang paglitaw nito.
- source_word: בָּם
  choice: sa gitna nila
  rationale: Ipinapakita nito na ang salot ay naganap sa loob ng kanilang pangkat. Ang “sa gitna nila” ay natural at hindi nagpapasya sa mas interpretatibong “laban sa kanila.”
- source_word: מַגֵּפָה
  choice: isang salot
  rationale: Karaniwang tumutukoy ang מַגֵּפָה sa salot o nakamamatay na hampas, lalo na bilang paghatol. Ang “salot” ang malinaw at dignified na modernong katumbas.
theological_decisions:
- issue: Hindi tahasang binanggit na layon ng “ginalit”
  choice: Ginamit ang “siya,” na tumutukoy sa Diyos ayon sa konteksto.
  alternative: Iwanang walang tahasang layon, o tukuyin nang tuwiran bilang “Diyos” o “ang PANGINOON.”
  rationale: Hindi binabanggit sa mismong sugnay na Hebreo ang layon, ngunit malinaw sa konteksto ng awit na ang Diyos ang kanilang ginalit. Pinananatili ng “siya” ang kontekstuwal na pagtukoy nang hindi nagdaragdag ng tahasang banal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang maikli at matinding paralelismo ng talata.
