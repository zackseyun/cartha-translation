  yaml_path: translation/ot/psalms/106/015.yaml
  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: tl
  text: Ibinigay niya sa kanila ang kanilang hiniling,[a] ngunit nagpadala siya ng pangangayayat sa kanilang buhay.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang kahilingan.”
    reason: lexical_alternative
  - marker: b
    text: O “pagkaubos” o “panghihina.”
    reason: lexical_alternative
  - marker: c
    text: Hebreo nefesh; maaari ring “sarili,” “buong pagkatao,” o “kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay niya
  rationale: Tuwirang katumbas ng נתן at pinananatili ang payak na kilos ng pagbibigay; hindi kailangang gawing mas interpretatibong “ipinagkaloob.”
- source_word: לָהֶם
  choice: sa kanila
  rationale: Likas na salin ng di-tuwirang layon sa Filipino.
- source_word: שֶׁאֱלָתָם
  choice: ang kanilang hiniling
  rationale: Malinaw at natural na ipinahahayag ang “request/thing asked for,” habang iniiwasang ipakahulugan ito bilang mas malawak na “pagnanasa.”
- source_word: וַיְשַׁלַּח
  choice: ngunit pinadalhan niya
  rationale: Literal na may pang-ugnay na “at,” ngunit ang “ngunit” ay likas na nagpapakita ng tunay na pagsalungat ng ipinagkaloob na hiling at kasunod na hatol. Ang “pinadalhan” ay nagpapanatili sa larawang may ipinadalang kapahamakan.
- source_word: רָזוֹן
  choice: kapayatan
  rationale: Pinananatili ang konkretong larawan ng pagiging payat o pagkaubos nang hindi agad nililimitahan sa isang tiyak na sakit; nililinaw sa talababa ang iba pang maaaring diwa.
- source_word: בְּנַפְשָׁם
  choice: ang kanilang kalooban
  rationale: Ang נֶפֶשׁ ay tumutukoy sa buhay, sarili, o buong pagkatao, hindi lamang sa modernong konsepto ng hiwalay na “kaluluwa.” Ang “kalooban” ay dignified at natural, habang pinananatili sa talababa ang lawak at tunay na kalabuan ng salita.
theological_decisions:
- issue: Saklaw ng נֶפֶשׁ sa konteksto ng hatol
  choice: kalooban, na may talababa para sa “buhay,” “sarili,” “buong pagkatao,” o “kaluluwa”
  alternative: kaluluwa
  rationale: Hindi malinaw na nililimitahan ng Hebreo ang hatol sa isang di-materyal na bahagi ng tao. Iniiwasan ng pangunahing salin ang pagpasok ng ganitong paghahati, ngunit hindi inaalis ang “kaluluwa” bilang lehitimong posibilidad.
- issue: Ugnayan ng dalawang sugnay
  choice: ngunit
  alternative: at
  rationale: 'Ang waw ay maaaring simpleng “at,” ngunit malinaw sa konteksto ang tensiyon: ibinigay ang hiniling, kasabay ng kapahamakang ipinadala. Ang “ngunit” ay nagpapahayag nito nang hindi tinutukoy nang higit pa ang uri ng hatol.'
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kapayatan” upang mapanatili ang matinding larawan ng Hebreo, at mga talababa upang ilahad ang leksikal na lawak nang hindi pinapabigat ang pangunahing teksto.
