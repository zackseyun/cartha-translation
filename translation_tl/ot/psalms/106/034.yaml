  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: tl
  text: Hindi nila nilipol ang mga bansang sinabi ni Yahweh na lipulin nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal: “Hindi nila nilipol ang mga bansa na sinabi ni Yahweh sa kanila.” Isinuplay ang “na lipulin nila” sapagkat ipinahihiwatig ito sa Hebreo at malinaw sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Hindi
  rationale: Karaniwang pananggi sa Tagalog; kasama ng aspektong perpektibo ng pandiwa, malinaw nitong ipinahahayag ang hindi nila ginawa.
- source_word: הִשְׁמִידוּ
  choice: nilipol
  rationale: Ang Hiphil ng שׁמד ay tumutukoy sa pagwasak o lubusang pag-aalis. Ang “nilipol” ay natural, matindi, at hindi lumalampas sa saklaw ng Hebreo.
- source_word: אֶת הָעַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ng “mga bayan” ang maramihang diwa ng magkakaibang pangkat ng tao; mas angkop dito kaysa sa modernong pampolitikang diwa ng “mga bansa.”
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Tagalog para sa kaugnay na sugnay na tumutukoy sa “mga bayan.”
- source_word: אָמַר
  choice: sinabi
  rationale: Tuwirang katumbas ng payak na pandiwang Hebreo na “nagsabi”; hindi ito pinalalakas tungo sa “nag-utos,” bagaman utos ang ipinahihiwatig ng konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לָהֶם
  choice: nila
  rationale: Sa pariralang “na ... lipulin nila,” natural na naipapakita sa Tagalog na sa kanila sinabi ang ipinahihiwatig na gagawin.
theological_decisions:
- issue: Hindi hayagang binanggit na pandiwang nilalaman pagkatapos ng “sinabi ni Yahweh”
  choice: Isinuplay ang “na lipulin nila”
  alternative: “Hindi nila nilipol ang mga bayan na binanggit sa kanila ni Yahweh.”
  rationale: 'Literal na bitin ang Hebreo: “ang mga bayan na sinabi ni Yahweh sa kanila.” Mula sa naunang pandiwa at sa konteksto, ang ipinahihiwatig na nilalaman ay ang paglipol sa mga bayan. Ginagawang malinaw ng suplay ang pangungusap sa Tagalog nang hindi pinapalitan ang אָמַר ng mas tiyak na “nag-utos.”'
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinili ang “nilipol” upang mapanatili ang tindi ng pandiwang Hebreo, at “mga bayan” upang ipakita ang maramihang pangkat ng mga tao nang hindi magbigay ng makabagong pampolitikang kahulugan.
