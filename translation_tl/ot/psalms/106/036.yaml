  text: They served their idols[a], and they became a snare to them.
translation:
  language: tl
  text: Pinaglingkuran nila ang kanilang mga diyus-diyosan[a], at ang mga iyon ay naging bitag sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sinamba nila ang kanilang mga diyus-diyosan, at ang mga iyon ay naging bitag sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Pinaglingkuran nila
  rationale: Ang qal ng עבד ay tumutukoy rito sa paglilingkod na iniuukol sa mga huwad na diyos. Pinananatili ng “pinaglingkuran” ang tuwirang diwa ng pandiwa at ang kaugnayan nito sa debosyong panrelihiyon; posible rin ang “sinamba,” ngunit mas interpretatibo iyon.
- source_word: עֲצַבֵּיהֶם
  choice: ang kanilang mga diyus-diyosan
  rationale: Karaniwang tumutukoy ang עֲצַבִּים sa mga idolo, na may mapanuring himig sa ganitong konteksto. Likas at malinaw sa modernong Filipino ang “mga diyus-diyosan.”
- source_word: וַיִּהְיוּ
  choice: ang mga iyon ay naging
  rationale: 'Bagaman maaaring mangahulugang “maging” o “manatili” ang היה, ipinahihiwatig ng kayariang may לְמוֹקֵשׁ ang kinalabasan: ang mga diyus-diyosan ay naging isang bagay na nakapipinsala.'
- source_word: לָהֶם
  choice: sa kanila
  rationale: Ipinakikita ng ל ang kaugnayan at epekto ng bitag sa mismong mga taong naglingkod sa mga diyus-diyosan.
- source_word: לְמוֹקֵשׁ
  choice: bitag
  rationale: Ang מוֹקֵשׁ ay isang patibong o bitag, at madalas gamitin bilang talinghaga para sa bagay na umuugit o nagpapahamak sa moral o espirituwal na paraan. Ang “bitag” ang pinakanatural at malinaw na katumbas dito.
theological_decisions:
- issue: Ang tinutukoy ng maramihang paksa sa “naging bitag sa kanila”
  choice: Ang mga diyus-diyosan ang naging bitag sa mga taong naglingkod sa mga iyon.
  alternative: Ang mismong paglilingkod ang naging bitag sa kanila.
  rationale: Ang “kanilang mga diyus-diyosan” ang pinakamalapit at likas na pinatutungkulan ng maramihang וַיִּהְיוּ. Ginagawang malinaw ng “ang mga iyon” ang ugnayang gramatikal nang hindi nagdaragdag ng bagong kahulugan.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “pinaglingkuran” upang mapanatili ang anyo at saklaw ng Hebreong pandiwa, habang inilagay sa talababa ang mas interpretatibong “sinamba.”
