base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: tl
  text: Kaya sinabi niyang lilipulin niya sana sila kung hindi tumayo si Moises[a], na kanyang hinirang, sa puwang sa harap niya upang iurong ang kanyang poot, upang hindi niya sila lipulin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa siwang.” Ang Hebreong larawan ay ng pagtayo sa nasirang bahagi ng pader; dito, inilalarawan nito ang pamamagitan ni Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi niya
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong at bunga sa salaysay; natural sa modernong Tagalog ang “Kaya sinabi niya.”
- source_word: לְהַשְׁמִידָם
  choice: lilipulin niya sila
  rationale: Ang infinitive na may ל pagkatapos ng “sinabi” ay nagsasaad ng nilalayong kilos. Ang “lipulin” ay matindi ngunit hindi kinakailangang magdagdag ng konsepto sa lampas sa Hebreo.
- source_word: לוּלֵי
  choice: kung hindi
  rationale: 'Naghahayag ito ng kondisyong salungat sa aktuwal na nangyari: matutuloy sana ang paglipol kung hindi namagitan si Moises.'
- source_word: בְחִירוֹ
  choice: ang kanyang hinirang
  rationale: Malinaw nitong ipinakikitang si Moises ay pinili ng Diyos nang hindi nag-aangkat ng natatanging sistemang teolohikal.
- source_word: עָמַד בַּפֶּרֶץ
  choice: tumayo ... sa puwang
  rationale: Pinananatili ang kongkretong larawan ng isang taong pumupuwesto sa nasirang bahagi ng pader upang hadlangan ang kapahamakan.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Ang panghalip ay likas na tumutukoy sa Diyos at pinananatili ang larawan ng pamamagitan sa kanyang presensya.
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: upang pawiin ang kanyang poot
  rationale: Sa kontekstong ito, ang Hiphil ng שוב ay pagpapabalik o pag-aalis ng poot. Natural sa Tagalog ang “pawiin” habang nananatili ang personal at mabigat na wika ng banal na poot.
- source_word: מֵהַשְׁחִית
  choice: at hindi niya sila lipulin
  rationale: Ang מִן na may infinitive ay nagpapahiwatig ng pagpigil sa pagkilos. Nililinaw ng Tagalog na ang napigilan ay ang Diyos na magsagawa ng paglipol.
theological_decisions:
- issue: Antropopatikong paglalarawan sa poot ng Diyos
  choice: Pinanatili ang “kanyang poot.”
  alternative: “kanyang galit” o abstraktong “kahatulan”
  rationale: Tahasang inilalarawan ng talata ang poot ng Diyos na napawi dahil sa pamamagitan ni Moises; hindi ito pinalalabo o ginagawang impersonal.
- issue: Larawan ng pamamagitan ni Moises sa puwang ng pader
  choice: Pinanatili ang metaporang “tumayo ... sa puwang.”
  alternative: “namagitan para sa kanila”
  rationale: Mahalaga sa Hebreong teksto ang kongkretong larawan ng tagapagtanggol sa sirang bahagi ng pader. Ipinapaliwanag ng talababa ang kahulugan nang hindi inaalis ang metapora.
- issue: Di-tiyak na saklaw ng panghuling infinitive
  choice: Isinalin bilang pagpigil sa Diyos na lipulin sila.
  alternative: “upang pigilan ang pagwasak” nang hindi tahasang binabanggit ang gumagawa
  rationale: Ang konteksto at hulaping panghalip sa “kanyang poot” ay sumusuporta na Diyos ang gumagawa ng paglipol, ngunit hindi dinaragdagan ng paliwanag kung paano nauugnay ang kanyang pasya, poot, at pamamagitan ni Moises.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lipulin” para sa bigat ng paghuhukom, “hinirang” para sa banal na pagpili, at isang maikling talababa upang maipaliwanag ang Hebreong metapora nang hindi ito pinapalitan.
