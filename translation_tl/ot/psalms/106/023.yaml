  - severity: low
    issue: Hindi tahasang namamarkahan ng kasalukuyang pangungusap ang kontra-singaw na kundisyon.
    rationale: Ang לוּלֵי ay “kung hindi/ kung wala sana,” isang kundisyong salungat sa nangyari. Ang “sana” sa pangunahing sugnay ay natural na paraan upang maging malinaw ito sa Tagalog.
