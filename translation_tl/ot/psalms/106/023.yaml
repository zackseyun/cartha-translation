  source_fidelity: Ang draft ay wastong naghahatid ng paghatol na binalak ng Diyos, ng kontra-singaw na kundisyon sa לוּלֵי, ng pagpili kay Moises, at ng larawang pagtayo sa puwang. Gayunman, ang “pawiin ang kanyang poot” ay higit na nagpapahiwatig ng pagpawi o pag-alis kaysa sa “pagpabalik/pag-urong” ng poot (לְהָשִׁיב). Ang “sana” ay makatutulong upang malinaw na maipakita ang kontra-singaw na di-nangyari.
  naturalness: Marangal at madaling unawain ang Tagalog. Mas malinaw at mas natural ang “si Moises, na kanyang hinirang” kaysa sa appositive na “si Moises, ang kanyang hinirang,” at ang “iurong ang kanyang poot” ay mas malapit sa pandiwang Hebreo kaysa “pawiin.”
  terminology: Ang “lipulin,” “hinirang,” at “poot” ay angkop sa konteksto. Pinanatili ang “puwang” bilang metaporang katumbas ng nasirang bahagi o siwang sa pader, at hindi pinalitan ng interpretibong “namagitan.”
