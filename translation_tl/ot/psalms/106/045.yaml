  text: וַ/יִּזְכֹּ֣ר לָ/הֶ֣ם בְּרִית֑/וֹ וַ֝/יִּנָּחֵ֗ם כְּ/רֹ֣ב חסד/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: tl
  text: 'Inalala niya ang kanyang tipan alang-alang sa kanila,

    at nagbago siya ng pasiya[a]

    ayon sa kasaganaan ng kanyang tapat na pag-ibig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nahabag siya,” o “hindi niya itinuloy ang kanyang gagawin.” Maaaring tumukoy ang pandiwang Hebreo sa pagbabago ng pasiya o pagkilos, o sa pagkilos dahil sa pagkahabag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Inalala niya
  rationale: Sa konteksto ng tipan, ang זכר ay hindi lamang paggunita sa isip kundi pag-alala na humahantong sa pagkilos ayon sa naunang pangako. Likas at malinaw sa modernong Tagalog ang “inalala niya.”
- source_word: לָהֶם
  choice: alang-alang sa kanila
  rationale: Ipinahihiwatig ng לָהֶם na ang pag-alala sa tipan ay may kaugnayan sa kanila at para sa kanilang kapakanan. Mas malinaw ito kaysa sa literal ngunit alanganing “para sa kanila.”
- source_word: בְּרִיתוֹ
  choice: kanyang tipan
  rationale: Ang “tipan” ang kinikilalang salitang biblikal para sa בְּרִית at pinananatili nito ang kahulugang may kinalaman sa matibay na ugnayan at pangako.
- source_word: וַיִּנָּחֵם
  choice: at nagbago siya ng pasiya
  rationale: Maaaring ipahayag ng Niphal na נחם ang pagbabago ng pasiya o pagkilos, pag-urong sa gagawin, o pagkahabag. Pinananatili ng saling ito ang lantad na antropopatikong pananalita ng Hebreo; inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: כְּרֹב
  choice: ayon sa kasaganaan ng
  rationale: Ang כְּ + רֹב ay nagsasaad ng sukat o kaangkupan. Tumpak at natural na ipinahahayag ito ng “ayon sa kasaganaan ng.”
- source_word: חסדו
  choice: kanyang tapat na pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa mahabagin, matatag, at tapat na pag-ibig, lalo na sa konteksto ng tipan. Hindi ito sinisikip sa “awa” lamang.
theological_decisions:
- issue: Antropopatikong paglalarawan sa Diyos sa וַיִּנָּחֵם
  choice: nagbago siya ng pasiya
  alternative: nahabag siya; hindi niya itinuloy ang kanyang gagawin
  rationale: Inilalarawan ng Hebreo ang tunay na pagbabago sa pakikitungo ng Diyos sa bayan nang hindi ipinaliliwanag kung paano ito kaugnay ng kanyang kaalaman o katapatan. Pinananatili ng salin ang teolohikal na tensiyong iyon sa halip na alisin ito, habang kinikilala sa talababa ang saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tipan” at “tapat na pag-ibig” upang mapanatili ang bokabularyong biblikal nang hindi nagiging lipas o labis na teknikal. Ang paghahati sa tatlong linya ay angkop sa anyong patula ng salmo.
