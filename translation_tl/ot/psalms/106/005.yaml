lexical_decisions:
- source_word: לִרְאוֹת
  choice: upang makita ko
  rationale: Ang infinitibong may לְ ay nagpapatuloy sa layunin ng kahilingan sa naunang talata. Pinananatili ng “makita” ang kongkretong pandiwa ng Hebreo.
- source_word: בְּטוֹבַת
  choice: ang kabutihan ng
  rationale: Pinananatili nito ang malawak na kahulugan ng טוֹבָה—kabutihan, kapakanan, o kasaganaang tinatamasa—nang hindi nililimitahan agad sa materyal na kasaganaan.
- source_word: בְּחִירֶיךָ
  choice: iyong mga pinili
  rationale: Malinaw nitong tinutukoy ang mga taong pinili ng Diyos at iniiwasan ang terminong maaaring magpasok ng mas huling sistematikong kahulugang teolohikal.
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: magalak sa kagalakan
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan sa Hebreo at ang diwa ng pakikibahagi sa kagalakan.
- source_word: גּוֹיֶךָ
  choice: iyong bansa
  rationale: Ang גּוֹי ay tuwirang “bansa.” Pinananatili ito upang hindi pag-isahin ang magkakaibang katawagan sa bayan ng Diyos sa talata.
- source_word: לְהִתְהַלֵּל
  choice: magbunyi
  rationale: Sa positibong kontekstong ito, ipinahahayag ng hitpael ng הלל ang masayang pagmamalaki o pagluwalhati. Likas at marangal sa Filipino ang “magbunyi,” samantalang inilalagay sa talababa ang mas literal ngunit posibleng negatibong “magmalaki.”
- source_word: עִם
  choice: kasama ng
  rationale: Ipinapakita nito ang pakikiisa ng nagsasalita sa mana ng Diyos.
- source_word: נַחֲלָתֶךָ
  choice: iyong mana
  rationale: Pinananatili ng “mana” ang tipanang larawan ng Israel bilang bahaging pag-aari ng Diyos.
theological_decisions:
- issue: Pagpapanatili sa magkakaibang katawagang tipanan para sa Israel
  choice: iyong mga pinili … iyong bansa … iyong mana
  alternative: iyong mga hinirang … iyong bayan … iyong pag-aari
  rationale: Tatlong magkakaibang katawagan ang pinagsasalansan ng Hebreo. Pinananatili ang pagkakaiba ng mga ito nang hindi nagpapasok ng natatanging doktrinang denominasyonal.
- issue: Positibong diwa ng לְהִתְהַלֵּל sa konteksto
  choice: magbunyi
  alternative: magmalaki
  rationale: Maaaring mangahulugan ang pandiwa ng pagmamapuri o pagmamalaki. Ang “magbunyi” ay nagpapanatili sa positibong pagdiriwang sa konteksto, habang ang mas literal na alternatibo ay nasa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang tatlong magkakaibang katawagang tipanan at ang magkakatulad na “magalak sa kagalakan,” habang gumamit ng “magbunyi” upang maging natural ang positibong diwa ng huling sugnay.
