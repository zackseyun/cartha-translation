  text: מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑י/ו לֹֽא חִ֝כּ֗וּ לַ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: tl
  text: 'Kay bilis nilang nalimutan ang kanyang mga gawa;

    hindi nila hinintay ang kanyang payo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “plano” o “layunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: Kay bilis nilang
  rationale: Ipinahahayag nito ang pagmamadali o bilis na nasa pandiwang Hebreo, hindi lamang ang pagkakasunod-sunod sa panahon. Likas din itong pakinggan bilang panimulang patula sa Tagalog.
- source_word: שָׁכְחוּ
  choice: nalimutan
  rationale: Tuwirang katumbas ng Qal perfect na nangangahulugang “nalimot” o “nakalimutan”; ang “nalimutan” ay natural at malinaw sa modernong Tagalog.
- source_word: מַעֲשָׂיו
  choice: ang kanyang mga gawa
  rationale: Pinananatili ng “mga gawa” ang maikli at marangal na pananalita tungkol sa mga ginawa ng Diyos, habang nananatiling madaling maunawaan.
- source_word: לֹא חִכּוּ
  choice: hindi nila hinintay
  rationale: Tuwirang inilalarawan ang hindi nila paghihintay; mas angkop dito kaysa sa pagbibigay-kahulugang “umasa,” sapagkat ang kasunod na layon ay payo o panukala.
- source_word: לַעֲצָתוֹ
  choice: ang kanyang payo
  rationale: Ang עֵצָה ay maaaring tumukoy sa payo, plano, o layunin. Ang “payo” ang pinakanatural sa Tagalog at pinananatili ang diwang hindi nila hinintay ang patnubay ng Diyos nang hindi ito pinaliliit sa isang tiyak na doktrinal na kahulugan.
theological_decisions:
- issue: Saklaw ng עֵצָה ng Diyos sa konteksto
  choice: ang kanyang payo
  alternative: ang kanyang plano; ang kanyang layunin
  rationale: Pinananatili ng “payo” ang ugnayang diwa ng paghihintay sa direksiyon ng Diyos at hindi ipinapalagay na ang salita ay tumutukoy lamang sa isang itinakdang plano o atas. Inilalagay sa talababa ang iba pang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at patula. Ginamit ang “Kay bilis” upang mapanatili ang diin sa pagmamadali, at ang dalawang magkatimbang na sugnay upang tularan ang paralelismo ng Hebreo.
