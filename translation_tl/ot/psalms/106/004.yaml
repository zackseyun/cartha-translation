  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: tl
  text: Alalahanin mo ako, Yahweh, kapag ipinakikita mo ang iyong lingap sa iyong bayan[a]; lingapin mo ako sa pamamagitan ng iyong pagliligtas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kalakip ng lingap mo sa iyong bayan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “dalawin mo ako taglay ang iyong pagliligtas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: Alalahanin mo ako
  rationale: Tuwirang pakiusap mula sa Qal imperative ng זכר na may hulaping unang panauhan. Likas ito sa makabagong Tagalog at hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: kapag kinalulugdan mo ang iyong bayan
  rationale: Ipinapahayag ang malamang na temporal o circumstantial na diwa ng בְּ at ang lingap, pagtanggap, o mabuting kalooban na saklaw ng רָצוֹן. Nililinaw rin nitong ang lingap ay mula sa Diyos patungo sa bayan.
- source_word: פָּקְדֵנִי
  choice: lingapin mo ako
  rationale: Sa konteksto ng panalangin, ang פקד ay maaaring tumukoy sa mapagkalingang pagpansin at pagkilos para sa isang tao. Ang “lingapin” ay natural sa Tagalog at hindi nagpapahiwatig ng isang pisikal na pagdalaw lamang.
- source_word: בִּישׁוּעָתֶךָ
  choice: sa pamamagitan ng iyong pagliligtas
  rationale: Pinananatili ang pangngalang יְשׁוּעָה bilang “pagliligtas” at binabasa ang בְּ bilang paraan ng mapagligtas na pagkilos ng Diyos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreong teksto ang pangalan ng Diyos; pinananatili ito bilang pangalan sa salin.
- issue: Diwa ng בִּרְצוֹן עַמֶּךָ
  choice: kapag kinalulugdan mo ang iyong bayan
  alternative: kalakip ng lingap mo sa iyong bayan
  rationale: Mas malinaw sa Tagalog ang temporal/circumstantial na pagbasa, ngunit tunay na posible rin ang mas pormal na associative na ugnayan kaya itinala iyon sa talababa.
- issue: Diwa ng פָּקְדֵנִי
  choice: lingapin mo ako
  alternative: dalawin mo ako
  rationale: Ipinahihiwatig ng konteksto ang mapagligtas na pagpansin at pagkilos ng Diyos. Hindi itinatanggi ang mas literal at tradisyonal na “dalawin,” na pinanatili sa talababa.
translation_notes:
  register: Makabago, marangal, at panalanging Tagalog. Ginamit ang “kinalulugdan” upang ipahayag ang mapagpalang pagtanggap o lingap, at ang “lingapin” upang maipakita ang aktibong pagkalinga ng Diyos nang hindi nililimitahan ang פקד sa pisikal na pagdalaw.
