  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: tl
  text: Gayunman, nakita niya ang kanilang paghihirap nang marinig niya ang kanilang daing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At nakita niya ang paghihirap na sumapit sa kanila nang marinig niya ang kanilang daing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Pinananatili nito ang tuwirang kahulugan ng ראה at ang Hebreong idyoma; sa konteksto, ipinahihiwatig din nito ang mapagmalasakit na pagpansin.
- source_word: בַּצַּר לָהֶם
  choice: ang kanilang paghihirap
  rationale: Ang צַר ay tumutukoy sa kalagayan ng kagipitan o paghihirap, at ang לָהֶם ay natural na naipahahayag sa Filipino bilang paari na “kanilang.”
- source_word: בְּשָׁמְעוֹ
  choice: nang marinig niya
  rationale: Ang ב na kasama ng infinitive construct ay temporal dito; natural at malinaw sa modernong Filipino ang “nang marinig niya.”
- source_word: רִנָּתָם
  choice: kanilang daing
  rationale: Bagaman maaaring tumukoy ang רִנָּה sa malakas na sigaw, sa konteksto ng paghihirap ay angkop ang “daing,” na nagpapahayag ng paghingi ng saklolo nang hindi nagpapahiwatig ng galak.
- source_word: וַ
  choice: Gayunman
  rationale: 'Bagaman karaniwang pang-ugnay ang waw, adversatibo ang puwersa nito sa daloy ng salmo: sa kabila ng paghihimagsik at paghatol, tumugon ang Diyos nang may awa.'
theological_decisions:
- issue: Puwersa ng pambungad na pang-ugnay sa konteksto ng awa matapos ang paghatol
  choice: Adversatibong “Gayunman”
  alternative: Payak na “At” o sunurang “Pagkatapos”
  rationale: Ipinakikita ng konteksto ang kaibahan ng naunang paghihimagsik at kaparusahan sa maawaing pagtugon ng Diyos. Inililitaw ng “Gayunman” ang tensiyong ito nang walang idinaragdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “paghihirap” at “daing” bilang natural na mga salitang mauunawaan ng karaniwang mambabasa, habang pinananatili ang maikli at patulang anyo ng talata.
