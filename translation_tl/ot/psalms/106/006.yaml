translation:
  language: tl
  text: Nagkasala kami kasama ng aming mga ninuno[a]; gumawa kami ng kasamaan[b]; nagpakasama kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “aming mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “gumawa kami ng mali” o “gumawi kami nang baluktot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: Nagkasala kami
  rationale: Ang Qal perfect 1cp ng חטא ay isang sama-samang pag-amin ng kasalanan. Likas at tuwiran sa modernong Tagalog ang pandiwang aspektong “nagkasala.”
- source_word: עִם
  choice: kasama ng
  rationale: Ipinahahayag ng עִם ang pakikiisa o pagkakaugnay sa mga naunang salinlahi, hindi lamang pagkakatulad sa kanila.
- source_word: אֲבוֹתֵינוּ
  choice: aming mga ninuno
  rationale: Bagaman literal na “aming mga ama,” karaniwang ginagamit ang אבות para sa mga ninuno o naunang salinlahi. Mas malinaw sa ordinaryong mambabasa ang “mga ninuno,” habang inilalagay sa talababa ang literal na anyo.
- source_word: הֶעֱוִינוּ
  choice: gumawa kami ng mali
  rationale: Ang Hiphil perfect 1cp ng עוה ay tumutukoy sa paggawa ng mali o baluktot na asal. Pinananatili ng parirala ang moral na bigat nang hindi gumagamit ng di-likas o labis na teknikal na salita.
- source_word: הִרְשָׁעְנוּ
  choice: kumilos kami nang masama
  rationale: Ang Hiphil perfect 1cp ng רשע ay nagpapahayag ng masamang pagkilos o pagiging nasa mali. Ipinananatili ng salin ang pandiwang puwersa at ang kasukdulan ng tatlong magkakasunod na pag-amin.
theological_decisions:
- issue: Sama-samang pakikiisa sa pag-amin ng kasalanan
  choice: “kasama ng aming mga ninuno”
  alternative: “gaya ng aming mga ninuno”
  rationale: Ang עִם ay pangunahing nangangahulugang “kasama,” kaya ipinahahayag ng talata ang pag-amin ng kasalukuyang pamayanan na kaugnay ng mga naunang salinlahi. Hindi ito pinahina tungo sa paghahambing lamang at hindi rin ginawang teknikal na doktrina tungkol sa minanang sala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatluhang pag-amin at ang bahagyang pag-igting mula sa pagkakasala, sa paggawa ng mali, hanggang sa masamang pagkilos.
