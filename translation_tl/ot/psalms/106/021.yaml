  source_fidelity: 'Tumpak ang salin sa Hebreo: ang שָׁכְחוּ ay wastong nakaraang pangmaramihang kilos (“Kinalimutan nila”); ang אֵל מוֹשִׁיעָם ay natural na “ang Diyos na kanilang Tagapagligtas”; at ang participial na עֹשֶׂה ay angkop na naipahayag sa relatibong sugnay na “na gumawa.” Ang “mga dakilang bagay sa Ehipto” ay sapat na tumutugon sa גְּדֹלוֹת בְּמִצְרָיִם. Hindi nito inaalis ang anumang makabuluhang kalabuan ng pinagmulan.'
