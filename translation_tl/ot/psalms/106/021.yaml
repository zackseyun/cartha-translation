  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: tl
  text: Kinalimutan nila ang Diyos na kanilang Tagapagligtas[a], na gumawa ng mga dakilang bagay sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nagliligtas sa kanila.” Maaaring idiin ng participle sa Hebreo ang Diyos bilang siyang nagliligtas sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: Kinalimutan nila
  rationale: Ang Qal perfect na pangmaramihan ay nagsasalaysay ng natapos na kilos sa nakaraan; natural ito sa makasaysayang pagsasalaysay ng salmo.
- source_word: אֵל
  choice: ang Diyos
  rationale: Bagaman maaaring magpahiwatig ng lakas ang אֵל, dito ay karaniwang katawagan ito sa Diyos ng Israel; hindi kailangang dagdagan ng diin na wala sa agarang konteksto.
- source_word: מוֹשִׁיעָם
  choice: na kanilang Tagapagligtas
  rationale: Ang Hiphil participle na may hulaping nangangahulugang 'kanila' ay tumutukoy sa Diyos bilang siyang nagliligtas sa kanila. Ang 'Tagapagligtas' ay maikli, marangal, at likas sa modernong Tagalog.
- source_word: עֹשֶׂה
  choice: na gumawa
  rationale: Ang participle ay naglalarawan sa Diyos sa pamamagitan ng kanyang ginawa. Ang payak na sugnay na 'na gumawa' ay natural sa Tagalog at sapat na nagpapakita na nauna ang mga gawa sa paglimot.
- source_word: גְדֹלוֹת
  choice: mga dakilang bagay
  rationale: Ang pangmaramihang substantibong anyo ay malawak na tumutukoy sa kahanga-hanga at makapangyarihang mga ginawa ng Diyos; pinananatili ng salin ang lawak ng Hebreo.
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Ang בְּ ay panandang panlunan dito; ang 'sa Ehipto' ang tuwiran at natural na katumbas.
theological_decisions:
- issue: Pagbibigay-kahulugan sa אֵל bilang katawagan sa Diyos ng Israel
  choice: Diyos
  alternative: Makapangyarihang Diyos; ang Makapangyarihan
  rationale: Kinilala ng talata ang Diyos na kinalimutan ng Israel, ngunit hindi nito malinaw na itinatampok ang lakas bilang hiwalay na titulo. Iniiwasan ng 'Diyos' ang pagdaragdag ng diin.
- issue: Paglalarawan sa Diyos sa participle na מוֹשִׁיעָם
  choice: kanilang Tagapagligtas
  alternative: ang nagligtas sa kanila; ang nagliligtas sa kanila
  rationale: Pinananatili ng katawagang 'Tagapagligtas' ang diwang maaaring tumukoy kapwa sa katangiang papel ng Diyos at sa kanyang aktuwal na pagliligtas, nang hindi nililimitahan ito sa iisang panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Tagapagligtas' bilang pamilyar ngunit hindi makalumang katawagan, at pinanatiling maikli ang paralel na daloy ng tula.
