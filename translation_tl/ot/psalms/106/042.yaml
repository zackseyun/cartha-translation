  yaml_path: translation/ot/psalms/106/042.yaml
  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: tl
  text: Inapi sila ng kanilang mga kaaway, at napasailalim sila sa kapangyarihan ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ilalim ng kanilang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: Inapi sila
  rationale: Ang Qal ng לחץ na may hulaping layon ay nagsasaad ng matinding pagdiin, pagpapahirap, o pang-aapi. Sa konteksto ng paghahari ng mga kaaway, natural at tuwiran ang “inapi sila.”
- source_word: אֹיְבֵיהֶם
  choice: kanilang mga kaaway
  rationale: Karaniwang kahulugan ng אויב na may hulaping pangmaramihan; malinaw na tumutukoy sa mga kalabang nang-api sa Israel.
- source_word: וַיִּכָּנְעוּ
  choice: napasailalim sila
  rationale: 'Ang Niphal ng כנע ay resultative/passive: napasuko, napababa, o napasailalim. Dito, ang “napasailalim” ay likas na kaugnay ng kasunod na idyomang תחת ידם at malinaw na naghahayag ng pagkasakop nang hindi nagdaragdag ng kusang pagpapasakop.'
- source_word: תַּחַת
  choice: sa ilalim
  rationale: Pangunahing kahulugan nito ang “sa ilalim,” na sa pariralang ito ay nagpapahiwatig ng pagkasakop.
- source_word: יָדָם
  choice: kapangyarihan ng mga ito
  rationale: Literal na “kanilang kamay,” ngunit ang Hebreong idyomang “sa ilalim ng kamay” ay nangangahulugang nasa kapangyarihan o kontrol ng isang tao. Ginawang malinaw sa pangunahing teksto para sa natural na modernong Tagalog, habang pinananatili sa talababa ang literal na larawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga ito” upang malinaw na ang kapangyarihan ay sa mga kaaway, hindi sa mga Israelita. Ang konkretong Hebreong idyoma ay inilagay sa talababa upang mapanatili ang anyo ng orihinal.
