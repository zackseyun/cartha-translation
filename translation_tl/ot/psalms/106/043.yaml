  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: tl
  text: Maraming ulit niya silang iniligtas, ngunit naghimagsik sila sa kanilang mga balak[a], at nalugmok sila[b] dahil sa kanilang kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanilang payo” o “sa kanilang layunin.” Maaaring mangahulugan ang Hebreo na ang kanilang paghihimagsik ay nahayag sa kanilang balak, payo, o layunin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bumagsak sila” o “nanghina sila.” Maaaring tumukoy ang pandiwang Hebreo sa pagkalugmok, pagbagsak ng kalagayan, o unti-unting panghihina.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Maraming ulit
  rationale: Tuwirang ipinahahayag ang paulit-ulit at maraming pagkakataon, sa natural na modernong Tagalog.
- source_word: יַצִּילֵם
  choice: niya silang iniligtas
  rationale: Ang Hiphil ng נצל ay tumutukoy sa pagsagip o pagliligtas mula sa panganib. Pinananatili ng “iniligtas” ang malawak na kahulugan nang hindi dinaragdagan ang ipinahihiwatig ng talata.
- source_word: וְהֵמָּה
  choice: ngunit … sila
  rationale: Idinidiin ng hiwalay na panghalip ang matinding pagsalungat ng tugon nila sa paulit-ulit na pagliligtas ng Diyos.
- source_word: יַמְרוּ
  choice: naghimagsik
  rationale: Ang מרה ay nangangahulugang sumalungat o maghimagsik. Ang pandiwang anyo ay pinakamalapit sa Hebreo at malinaw sa kasalukuyang Tagalog.
- source_word: בַעֲצָתָם
  choice: ayon sa sarili nilang balak
  rationale: Maaaring tumukoy ang עֵצָה sa payo, balak, o layunin. Natural sa Tagalog ang “ayon sa sarili nilang balak,” ngunit pinananatili sa talababa ang tunay na lawak at kalabuan ng parirala.
- source_word: וַיָּמֹכּוּ
  choice: nalugmok
  rationale: Ang מוך ay maaaring mangahulugang bumaba ang kalagayan, gumuho, o manghina. Naipahahayag ng “nalugmok” ang matinding pagbagsak nang hindi tiyakang nagdaragdag ng panlabas na tagapagpababa.
- source_word: בַּעֲוֺנָם
  choice: dahil sa kanilang kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutang dulot nito. Pinananatili ng “kasamaan” ang bigat na moral, at malinaw na ipinahahayag ng “dahil sa” ang malamang na sanhi.
theological_decisions:
- issue: Ang hindi tahasang pinangalanang tagapagligtas
  choice: Pinanatili ang panghalip na “niya,” na sa konteksto ay tumutukoy sa Diyos.
  alternative: Ulitin ang “Diyos” o “PANGINOON.”
  rationale: Ikatlong panauhang panlalaki ang simuno ng pandiwa sa Hebreo, ngunit hindi inuulit sa talata ang banal na pangalan. Ang panghalip ay tapat sa matipid na anyo ng pinagmulan habang malinaw ang tinutukoy mula sa konteksto.
- issue: Ang saklaw ng עָוֹן
  choice: “kanilang kasamaan”
  alternative: “kanilang pagkakasala” o “kanilang pananagutan”
  rationale: Pinananatili nito ang moral na bigat ng paghihimagsik nang hindi nilulutas kung ang salita ay pangunahing tumutukoy sa masamang gawa, guilt, o bunga ng kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Gumamit ng “Maraming ulit” sa halip na mas pormal na “makailang ulit,” at ng “nalugmok” upang mapanatili ang matulaing bigat at kalabuan ng pandiwang Hebreo.
