  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: tl
  text: 'Purihin ninyo si Yah![a]

    Magpasalamat kayo kay Yahweh, sapagkat siya ay mabuti;

    sapagkat ang kanyang tapat na pag-ibig[b] ay nananatili magpakailanman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yah” ay maikling anyo ng pangalang Yahweh. Ang Hebreong panawagan dito, Hallelu-Yah, ang pinagmulan ng salitang “Hallelujah.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring magpahiwatig ng “tapat na habag,” “matatag na pag-ibig,” o “katapatan.”
    reason: lexical_range
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Purihin ninyo
  rationale: Pautos na anyong maramihan ng הלל. Ipinahahayag ng “ninyo” na ang panawagan ay nakatuon sa isang pangkat, gaya ng anyong Hebreo.
- source_word: יָהּ
  choice: Yah
  rationale: Maikling patulang anyo ng banal na pangalan. Pinanatili itong “Yah” upang maipakita ang anyong nasa liturhikong panawagang הַלְלוּ־יָהּ at maiba sa buong anyong יהוה sa kasunod na linya.
- source_word: הוֹד֣וּ
  choice: Magpasalamat kayo
  rationale: Sa kontekstong pansamba ng mga Awit, ang Hiphil ng ידה ay panawagang maghandog ng pasasalamat o papuri. Ang “magpasalamat kayo” ay likas at malinaw sa modernong Tagalog.
- source_word: לַ/יהוָ֣ה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pinag-uukulan ng pasasalamat. Ang יהוה ay isinalin bilang pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: כִּי טוֹב
  choice: sapagkat siya ay mabuti
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang paksa ng pang-uring טוֹב ay nauunawaang si Yahweh. Kailangan sa Tagalog ang “siya ay” upang maging malinaw at marangal ang pahayag.
- source_word: לְ/עוֹלָ֣ם
  choice: nananatili magpakailanman
  rationale: Ang pariralang pang-abay ay literal na “magpakailanman.” Idinagdag ang “nananatili” bilang likas na pandiwang Tagalog para sa eliptikong sugnay, nang hindi binabago ang diwa ng patuloy na pag-iral.
- source_word: חַסְדּֽ/וֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang matibay na pag-ibig, katapatan, at habag. Pinananatili ng “tapat na pag-ibig” ang ugnayan ng pag-ibig at katapatan nang hindi ito nililimitahan sa iisang teolohikal na paliwanag.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang ginagamit sa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Paglalarawan sa maikling anyong יָהּ
  choice: Yah
  alternative: Yahweh o PANGINOON
  rationale: Pinananatili ang “Yah” dahil ito ang maikling patulang anyo sa panawagang הַלְלוּ־יָהּ at naiiba sa buong anyong יהוה na ginagamit din sa talata.
- issue: Kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: habag; katapatan; wagas na pag-ibig
  rationale: Hindi pinili ang isang salitang magpapaliit sa malawak na kahulugan nito. Ipinapakita ng “tapat na pag-ibig” kapwa ang pagmamahal at matatag na katapatan, habang iniiwasang magpasok ng mas tiyak na doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabagong Filipino Tagalog na may marangal at liturhikong himig. Ginamit ang tahasang maramihang pautos na “ninyo/kayo,” pinanatili ang magkaugnay ngunit magkaibang anyo ng banal na pangalan na “Yah” at “Yahweh,” at inulit ang “sapagkat” upang mapanatili ang paralelismo ng Hebreo.
