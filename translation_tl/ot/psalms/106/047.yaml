base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: tl
  text: Iligtas mo kami, Yahweh, aming Diyos, at tipunin mo kami mula sa mga bansa, upang magpasalamat kami sa iyong banal na pangalan at magbunyi sa pagpupuri sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: Iligtas mo kami
  rationale: Ang Hiphil imperative na may hulaping unang panauhang maramihan ay tuwirang pagsusumamo para sa pagliligtas; natural at marangal sa makabagong Tagalog ang “Iligtas mo kami.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa teksto sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Tuwirang ipinapahayag ng anyong may hulapi ang “aming Diyos” at pinananatili ang sama-samang panawagan ng bayan.
- source_word: וְקַבְּצֵנוּ
  choice: at tipunin mo kami
  rationale: Ang Piel imperative ng קבץ ay tumutukoy sa pagtitipon sa bayang nakakalat; ang “tipunin” ay malinaw at angkop sa konteksto.
- source_word: מִן הַגּוֹיִם
  choice: mula sa mga bansa
  rationale: Tumutukoy ang גּוֹיִם sa mga bansang kinaroroonan ng nakakalat na bayan. Sapat na likas sa Tagalog ang “mula sa mga bansa” nang hindi nagdaragdag ng paliwanag na wala sa anyong Hebreo.
- source_word: לְהוֹדוֹת
  choice: upang magpasalamat kami
  rationale: Ang ל na kasama ng infinitive ay nagpapahayag ng layunin; ang Hiphil ng ידה rito ay angkop isaling “magpasalamat.”
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: sa iyong banal na pangalan
  rationale: Likas na Tagalog ito para sa ugnayang ipinahihiwatig ng Hebreo at pinananatili ang diin sa banal na pangalan ng Diyos.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: at magbunyi
  rationale: Ang Hitpael ng שׁבח ay nagpapahayag ng pagmamapuri o masiglang pagbubunyi. Sa kontekstong nakatuon sa papuri sa Diyos, mas natural at hindi madaling mapagkamalang kapalaluan ang “magbunyi.”
- source_word: בִּתְהִלָּתֶךָ
  choice: sa pagpupuri sa iyo
  rationale: Pinananatili nito ang papuri bilang saklaw o dahilan ng pagbubunyi, habang iniiwasan ang di-likas na Tagalog na “sa iyong papuri,” na maaaring magpahiwatig na ang Diyos ang pumupuri sa kanila.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ang “Yahweh” upang hindi ito mapalitan ng titulong wala sa mismong anyo ng talata.
- issue: Diwa ng לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: magbunyi sa pagpupuri sa iyo
  alternative: magmapuri sa iyong papuri
  rationale: Pinananatili ng salin ang masigla at pansariling pakikibahagi sa papuri, ngunit hindi ipinapahiwatig na ipinagmamalaki ng bayan ang sarili nilang nagawa. Ang mas literal na “magmapuri” ay posible ngunit madaling magkaroon ng negatibong diwa sa kasalukuyang Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na wikang panalangin. Ginamit ang mga tuwirang pautos na “Iligtas” at “tipunin,” at ang pangmaramihang “kami” upang mapanatili ang tinig ng sama-samang pagsusumamo. Walang footnote marker dahil walang kinakailangang tala sa inilathalang teksto.
