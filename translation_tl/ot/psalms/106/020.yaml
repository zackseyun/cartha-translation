  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: tl
  text: Ipinagpalit nila ang kanilang kaluwalhatian[a] sa larawan ng isang bakang lalaki[b] na kumakain ng damo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ang kanilang maluwalhating Diyos.” Literal sa Hebreo: “ang kanilang kaluwalhatian,” isang magalang na paraan ng pagtukoy sa Diyos.'
    reason: lexical_alternative
  - marker: b
    text: O “toro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Ipinagpalit nila
  rationale: Ang pandiwang מוּר ay tumutukoy sa pagpapalit o paghahalili ng isang bagay sa iba; malinaw at natural na ipinahahayag ng “ipinagpalit” ang paratang ng talata.
- source_word: כְּבוֹדָם
  choice: ang kanilang kaluwalhatian
  rationale: Literal itong “kanilang kaluwalhatian.” Pinananatili ng salin ang masidhing pahiwatig ng Hebreo at hindi tahasang idinaragdag ang “Diyos” sa pangunahing teksto.
- source_word: בְּתַבְנִית
  choice: sa larawan ng
  rationale: Ang תַּבְנִית ay maaaring mangahulugang anyo, wangis, o larawan. Sa konteksto ng diyus-diyosan at ng pandiwang “ipinagpalit,” natural sa Filipino ang “sa larawan ng.”
- source_word: שׁוֹר
  choice: isang bakang lalaki
  rationale: Ang שׁוֹר ay maaaring tumukoy sa ox o bull. Mas tiyak at karaniwang nauunawaan sa modernong Filipino ang “bakang lalaki,” habang iniiwasang isalin itong “guya,” na ibang salita sa Hebreo.
- source_word: אֹכֵל עֵשֶׂב
  choice: na kumakain ng damo
  rationale: Natural na isinasalin ang participle at layon bilang sugnay na panuring; napapanatili rin nito ang ironiyang ang larawan ay yaong sa isang hamak na hayop na nanginginain.
theological_decisions:
- issue: Ang tinutukoy ng “kanilang kaluwalhatian”
  choice: Panatilihin sa pangunahing teksto ang literal na “kanilang kaluwalhatian.”
  alternative: “ang kanilang maluwalhating Diyos” o “ang Diyos”
  rationale: Bagaman malinaw sa konteksto na ang Diyos ang tinutukoy, abstraktong pangngalang “kaluwalhatian” ang ginamit ng Hebreo. Ang pagpapanatili nito ay hindi tahasang lumulutas sa pahiwatig at napapanatili ang teolohikal at pampanitikang puwersa ng paratang.
translation_notes:
  register: Makabago, dignidadong Filipino na madaling maunawaan. Ginamit ang “bakang lalaki” bilang malinaw na pangunahing katumbas at inilagay ang “toro” bilang leksikal na alternatibo. Ang lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
