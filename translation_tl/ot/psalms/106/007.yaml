  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: tl
  text: Hindi naunawaan ng aming mga ninuno sa Ehipto ang iyong mga kamangha-manghang gawa; hindi nila inalala ang kasaganaan ng iyong tapat na pag-ibig, kundi naghimagsik sila sa dagat—sa Dagat ng mga Tambo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin ang Hebreong Yam Suf bilang “Dagat na Pula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: aming mga ninuno
  rationale: Tumutukoy ito sa mga naunang salinlahi ng Israel. Mas likas sa makabagong Tagalog ang “mga ninuno” kaysa “mga ama” kapag kolektibong mga salinlahi ang tinutukoy.
- source_word: הִשְׂכִּילוּ
  choice: hindi naunawaan
  rationale: Ipinahahayag ng Hiphil ng שׂכל ang pagkakaroon o paggamit ng pagkaunawa. Pinananatili ng salin ang kanilang kabiguang maunawaan ang kabuluhan ng mga gawa ng Diyos nang hindi nagdaragdag ng paliwanag.
- source_word: נִפְלְאוֹתֶיךָ
  choice: iyong mga kamangha-manghang gawa
  rationale: Ang pangngalan ay tumutukoy sa pambihirang mga gawa na pumupukaw ng paghanga, hindi lamang sa mga abstraktong kababalaghan.
- source_word: רֹב חֲסָדֶיךָ
  choice: kasaganaan ng iyong tapat na pag-ibig
  rationale: Isinasalin ng “kasaganaan” ang רֹב, samantalang ipinahahayag ng “tapat na pag-ibig” ang matibay at mapagkakatiwalaang katapatan ng חֶסֶד nang hindi ito nililimitahan sa awa lamang.
- source_word: וַיַּמְרוּ
  choice: kundi naghimagsik sila
  rationale: Ang מרה ay nangangahulugang maghimagsik o sumuway. Ipinakikita ng “kundi” ang pagsalungat sa naunang pagbanggit sa mga gawa at pag-ibig ng Diyos.
- source_word: עַל־יָם בְּיַם־סוּף
  choice: sa may dagat—sa Dagat ng mga Tambo
  rationale: Ang dalawang pariralang panlunan ay nasa ugnayang paglilinaw o apposition. Ang “Dagat ng mga Tambo” ay mas tuwirang nagpapakita sa leksikal na diwa ng יַם־סוּף, habang inilalagay sa talababa ang tradisyonal na pangalan.
theological_decisions:
- issue: Kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; katapatan; pag-ibig na di-nagmamaliw
  rationale: Pinananatili nito ang masaklaw na diwa ng mapagmahal at matatag na katapatan ng Diyos, nang hindi pinipili ang isang makitid o denominasyonal na pagpapakahulugan.
- issue: Pangalan ng יַם־סוּף
  choice: Dagat ng mga Tambo
  alternative: Dagat na Pula
  rationale: Inuuna ng pangunahing teksto ang malamang na leksikal na kahulugan ng Hebreo. Pinananatili sa talababa ang kilala at tradisyonal na katawagang “Dagat na Pula.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga ninuno” para sa kolektibong mga naunang salinlahi at ang em dash upang maipakita na nililinaw ng ikalawang pariralang panlunan ang una.
