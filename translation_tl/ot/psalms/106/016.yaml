  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: tl
  text: Nainggit sila kay Moises sa kampo, at kay Aaron, na banal para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “si Aaron, ang banal ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: Nainggit sila
  rationale: Sa konteksto ng paghihimagsik sa Bilang 16, ang קנא ay tumutukoy sa inggit na nakatuon kina Moises at Aaron. Ipinahihiwatig ng “nainggit” ang pagsibol ng saloobing ito at natural ito sa makabagong Tagalog.
- source_word: לְמֹשֶׁה ... לְאַהֲרֹן
  choice: kay Moises ... at kay Aaron
  rationale: Ang לְ ay nagmamarka sa mga taong pinatutungkulan ng inggit; ang “kay” ang likas na katumbas nito sa Tagalog.
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Tumutukoy ito sa kampo ng Israel sa ilang; tuwiran at natural ang “sa kampo.”
- source_word: קְדוֹשׁ יְהוָה
  choice: ang banal na itinalaga ni Yahweh
  rationale: Ipinakikita ng parirala na si Aaron ay ibinukod o itinalaga bilang banal para kay Yahweh. Iniiwasan ng saling ito ang di-likas at posibleng malabong “ang banal ni Yahweh,” habang pinananatili ang ugnayan ng kabanalan at pagtatalaga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang kahulugan ng קְדוֹשׁ יְהוָה bilang paglalarawan kay Aaron
  choice: ang banal na itinalaga ni Yahweh
  alternative: ang banal para kay Yahweh
  rationale: Maaaring ipahiwatig ng maikling pariralang Hebreo ang isang taong banal na nauukol kay Yahweh o banal para sa kanya. Ipinapahayag ng pangunahing salin ang pagkakatalaga ni Aaron nang hindi nag-aangking likas sa sarili niya ang kabanalan; inilalagay sa talababa ang mas pormal na alternatibo upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nainggit” sa halip na mas mabigat na “nanibugho,” sapagkat inggit sa katayuan at tungkulin ang diwa sa konteksto. Ang panandang [a] ay inilagay pagkatapos ng buong paglalarawan kay Aaron, na siyang tinutukoy ng alternatibong salin.
