translation:
  language: tl
  text: Tinakpan ng tubig ang kanilang mga kaaway; wala ni isa man sa kanila ang natira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: Tinakpan
  rationale: Tuwirang ipinapahayag ng pandiwang כסה ang pagtakip; ang anyong ito ay malinaw at matingkad sa konteksto ng tubig sa dagat.
- source_word: מַיִם
  choice: ng tubig
  rationale: Karaniwang pang-isahan sa Filipino ang “tubig” bilang pangngalang di-mabilang, kahit maramihan ang anyong Hebreo.
- source_word: צָרֵיהֶם
  choice: ang kanilang mga kaaway
  rationale: Ang צָר ay tumutukoy sa mga kalabang mapanlaban o kaaway. Likas at madaling maunawaan sa modernong Filipino ang “mga kaaway.”
- source_word: אֶחָד מֵהֶם
  choice: walang isa man sa kanila
  rationale: Natural na katumbas sa Filipino ng Hebreong “isa mula sa kanila” sa ilalim ng pagtanggi, at pinananatili ang diin na walang natira kahit isa.
- source_word: לֹא נוֹתָר
  choice: ang natira
  rationale: Ang nifal ng יתר ay nangangahulugang maiwan o manatiling natitira; hindi ito pinalawak tungo sa mas mapagpahiwatig na “nakaligtas.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinili ang “mga kaaway” kaysa sa mas pormal na “mga kalaban” o “mga kaaway na umuusig,” at pinanatili ang kongkretong larawan ng tubig na tumatakip sa kanila.
