  text: תִּפְתַּח אֶ֭רֶץ וַ/תִּבְלַ֣ע דָּתָ֑ן וַ֝/תְּכַ֗ס עַל עֲדַ֥ת אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: tl
  text: Bumuka ang lupa at nilamon si Datan,[a][c] at tinabunan ang pangkat ni Abiram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nabiyak ang lupa.”
    reason: lexical_alternative
  - marker: b
    text: O “kapulungan ni Abiram” o “grupo ni Abiram.”
    reason: lexical_alternative
  - marker: c
    text: Tingnan ang Mga Bilang 16:31–33 para sa salaysay ng hatol na ito.
    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח
  choice: Bumuka
  rationale: Ang Qal imperfect na may אֶרֶץ bilang simuno ay ginagamit dito sa patulang pagsasalaysay ng nagdaang pangyayari. Ang “bumuka” ay natural sa Filipino at malinaw na nagsasaad ng pagbubukas ng lupa; ang mas matingkad na “nabiyak” ay inilagay bilang alternatibo sa talababa.
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Sa konteksto, tumutukoy ito sa lupa sa ilalim ng mga rebelde, hindi sa isang teritoryo o bansa.
- source_word: וַתִּבְלַע
  choice: at nilamon
  rationale: Direkta at likas na katumbas ng בלע, at pinananatili ang matinding larawang patula ng tekstong Hebreo.
- source_word: דָּתָן
  choice: Datan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na דָּתָן.
- source_word: וַתְּכַס עַל
  choice: at tinabunan
  rationale: Ipinahahayag ng כסה na may עַל ang pagtakip sa grupo nang likas at maikli sa Filipino; hindi nito idinaragdag kung paano naganap ang pagtakip.
- source_word: עֲדַת
  choice: ang pangkat ni
  rationale: Ang עֵדָה sa konstruktong anyo ay tumutukoy rito sa tiyak na grupo o kapisanan ni Abiram. Ang “pangkat” ay malinaw at hindi nagdadala ng di-kinakailangang eklesyastikong kahulugan.
- source_word: אֲבִירָם
  choice: Abiram
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo na אֲבִירָם.
theological_decisions:
- issue: Ugnayan ng talata sa mas buong salaysay sa Mga Bilang 16
  choice: 'Isinalin lamang ang patulang buod ng awit: pinangalanan sina Datan at Abiram at binanggit ang pangkat ni Abiram.'
  alternative: Idagdag ang mga sambahayan o iba pang rebelde mula sa Mga Bilang 16.
  rationale: Hindi dapat ipasok sa salin ang mga detalyeng nasa kaugnay na salaysay ngunit wala sa mismong talatang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at matinding paralelismo ng tulang Hebreo. Inilagay ang mga panandang talababa kaagad pagkatapos ng kaugnay na salita o parirala.
