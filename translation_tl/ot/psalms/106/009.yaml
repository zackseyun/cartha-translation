  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: tl
  text: Sinaway niya ang Dagat na Pula[a], at natuyo ito; inakay niya sila sa mga kalaliman na gaya ng sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dagat ng mga Tambo.” Sa Hebreo, yam suph.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: Sinaway
  rationale: Pinananatili ng “sinaway” ang karaniwang kahulugan ng pandiwa at ang matalinghagang paglalarawan sa dagat na para bang tumutugon sa awtoridad ng Diyos.
- source_word: בְּיַם סוּף
  choice: ang Dagat na Pula
  rationale: Ito ang nakasanayang tawag sa Tagalog sa dagat na tinutukoy sa salaysay ng paglabas sa Ehipto; inilalagay sa talababa ang mas literal na “Dagat ng mga Tambo.”
- source_word: וַיֶּחֱרָב
  choice: natuyo iyon
  rationale: Likas na ipinapahayag sa Tagalog ang diwang intransitibo ng ugat na חרב, “matuyo” o “maging tuyo.”
- source_word: וַיּוֹלִיכֵם
  choice: inakay niya sila
  rationale: Malinaw at likas na ipinahihiwatig ng “inakay” ang causative na diwa ng Hiphil ng הלך, nang hindi nagiging mekanikal ang pananalita.
- source_word: בַּתְּהֹמוֹת
  choice: sa mga kalaliman
  rationale: Pinananatili ang pangmaramihang anyo at ang makatang larawan ng malalalim na tubig, habang ang “sa” ay natural na nagpapahayag ng dinaanang lugar.
- source_word: כַּמִּדְבָּר
  choice: na para bang sa ilang
  rationale: 'Ipinakikita ng parirala ang paghahambing: inakay sila sa kailaliman na waring naglalakbay lamang sa tuyong ilang.'
theological_decisions:
- issue: Pagkakasalin ng יַם סוּף sa pagtukoy sa paglabas mula sa Ehipto
  choice: Dagat na Pula
  alternative: Dagat ng mga Tambo
  rationale: Ang “Dagat na Pula” ang malawak na kilalang pangalang heograpiko at agad na nag-uugnay sa salaysay ng Exodo, ngunit pinananatili sa talababa ang leksikal na posibleng mas literal na salin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ilang” bilang maikli at biblikal na katawagan sa ilang na lupain; pinanatili ang matalinghagang “sinaway” at ang pangmaramihang “mga kalaliman.”
