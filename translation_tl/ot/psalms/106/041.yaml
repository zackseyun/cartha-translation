  text: וַ/יִּתְּנֵ֥/ם בְּ/יַד גּוֹיִ֑ם וַֽ/יִּמְשְׁל֥וּ בָ֝/הֶ֗ם שֹׂנְאֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: tl
  text: Ibinigay niya sila sa kamay ng mga bansa,[a] at pinagharian sila ng mga napopoot sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ng mga bansa,” isang idyoma na nangangahulugang mapasailalim sa kapangyarihan ng mga bansa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Ibinigay niya sila
  rationale: Tuwirang sinasalamin ang payak ngunit aktibong anyo ng נתן, na ang Diyos ang ipinahihiwatig na simuno at ang Israel ang layon. Hindi ito pinalalambot bilang pagpapahintulot lamang.
- source_word: בְּיַד
  choice: sa kamay ng
  rationale: Pinananatili ang Hebreong idyoma at larawan ng pagkakalagay sa kapangyarihan o kontrol ng iba; nauunawaan din ito sa natural na Filipino sa kontekstong ito.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy sa mga banyagang bansang pinagbigyan ng kapangyarihan sa Israel. Mas angkop at hindi gaanong tradisyon-kargado kaysa “mga Hentil.”
- source_word: וַיִּמְשְׁלוּ
  choice: pinagharian
  rationale: Natural at dignified na katumbas ng משל sa hostile na konteksto, at malinaw na nagpapahayag ng pamamahala sa kanila.
- source_word: בָהֶם
  choice: sila
  rationale: Ang ב kasunod ng משל ay likas na naipapahayag sa Filipino sa konstruksiyong “pinagharian sila,” nang hindi na kailangan ang hiwalay na pang-ukol.
- source_word: שֹׂנְאֵיהֶם
  choice: mga napopoot sa kanila
  rationale: Pinananatili ang aktibong kahulugan ng participle na “mga taong napopoot sa kanila,” sa halip na palawakin lamang bilang “mga kaaway.”
theological_decisions:
- issue: Ang pagkilos ng Diyos sa paghatol sa Israel
  choice: Tuwirang sinasabi na ibinigay ng Diyos ang Israel sa kapangyarihan ng mga banyagang bansa.
  alternative: Ipinahintulot lamang ng Diyos na mapasailalim sila sa mga bansa.
  rationale: Aktibong iniuukol ng Hebreong נתן sa ipinahihiwatig na banal na simuno ang pagbibigay sa kanila. Pinananatili ang teolohikal na tensiyon nang hindi ito pinalalambot o dinaragdagan.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang idyomang “sa kamay” dahil malinaw ito sa konteksto, habang nilinaw sa talababa ang kahulugan nitong kapangyarihan o kontrol.
