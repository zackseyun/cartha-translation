base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: tl
  text: 'Hindi siya naninirang-puri gamit ang kanyang dila[a],

    hindi gumagawa ng masama sa kanyang kapwa[b],

    at hindi nagbabanggit ng upasala laban sa taong malapit sa kanya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi naglilibot upang manirang-puri gamit ang kanyang dila.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kapwa” ay maaari ring mangahulugang “kaibigan” o “kasama.”
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreo ay literal na “ang malapit sa kanya”; maaaring tumukoy ito sa isang kamag-anak, malapit na kasamahan, o taong nasa malapit sa kanyang pamayanan. Ang idyoma para sa “nagbabanggit ng upasala” ay literal na “nagbubuhat/nagdadala ng upasala laban sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשֹׁנוֹ
  choice: naninirang-puri sa pamamagitan ng kanyang dila
  rationale: Sa idyomang ito, ang רָגַל ay tumutukoy sa paglibot upang magkalat ng mapanirang salita o paninirang-puri. Pinananatili ng parirala ang kongkretong larawan ng dila bilang kasangkapan ng pagsasalita.
- source_word: עָשָׂה ... רָעָה
  choice: gumagawa ng masama
  rationale: Malawak ang saklaw ng Hebreong רָעָה; ang “masama” ay nagpapanatili sa moral na diin nang hindi ito nililimitahan sa pisikal na pinsala.
- source_word: לְרֵעֵהוּ
  choice: sa kanyang kapwa
  rationale: Ang רֵעַ ay maaaring kaibigan, kasama, o kapwa sa pamayanan. Ang “kapwa” ay likas sa Filipino at sapat na malawak para sa kontekstong etikal.
- source_word: חֶרְפָּה
  choice: panlalait
  rationale: Ang salita ay tumutukoy sa paghamak, upasala, o kahihiyang ipinapataw sa iba. Ang “panlalait” ay malinaw at karaniwan habang pinananatili ang aspektong pasalita at panlipunan.
- source_word: נָשָׂא ... עַל
  choice: nagbibitiw ... laban sa
  rationale: Literal itong “nagbubuhat/nagdadala laban sa,” ngunit sa konteksto ay tumutukoy sa pagkuha o pagbigkas ng upasala laban sa iba. Ang “nagbibitiw ... laban sa” ay natural na Filipino at ipinahihiwatig ang aktibong pakikibahagi sa panlalait.
- source_word: קְרֹבוֹ
  choice: taong malapit sa kanya
  rationale: Maaaring tumukoy ang קָרוֹב sa kamag-anak, malapit na kasamahan, o taong nasa malapit. Hindi nililimitahan ng salin ang kahulugan sa ugnayang kadugo.
