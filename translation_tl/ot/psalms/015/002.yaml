base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: tl
  text: Ang namumuhay nang may integridad[a], gumagawa ng tama[b], at nagsasalita ng katotohanan mula sa kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namumuhay nang walang kapintasan.” Ang salitang Hebreo ay tumutukoy sa buo at tapat na asal, hindi kinakailangang sa ganap na kawalan ng kasalanan.
    reason: lexical_alternative
  - marker: b
    text: O “gumagawa ng katuwiran” o “nagsasagawa ng katarungan.” Maaaring tumukoy ang salitang Hebreo sa katuwiran, katarungan, o anumang tama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: namumuhay
  rationale: Ang participle ng הלך ay idyomatikong tumutukoy sa paraan ng pamumuhay. Mas natural sa modernong Filipino ang “namumuhay” kaysa literal na “lumalakad,” habang pinananatili ang patuloy na kilos.
- source_word: תָּמִים
  choice: nang may integridad
  rationale: Ipinahihiwatig ng תמים ang kabuuan at katapatan ng asal, hindi kinakailangang ganap na kawalan ng kasalanan. Ang “may integridad” ay malinaw at hindi nagpapahiwatig ng absolutong kasakdalan.
- source_word: וּפֹעֵל
  choice: gumagawa
  rationale: Ang participle ng פעל ay nagsasaad ng paggawa o pagsasagawa; natural itong itambal sa “matuwid” sa Filipino.
- source_word: צֶדֶק
  choice: ng matuwid
  rationale: Maaaring tumukoy ang צדק sa katuwiran, katarungan, o bagay na tama. Ang “gumagawa ng matuwid” ay maikli, marangal, at pinananatili ang nominal na lakas ng Hebreo.
- source_word: וְדֹבֵר
  choice: at nagsasalita
  rationale: Tuwirang katumbas ito ng participle ng דבר at pinananatili ang parallel na serye ng mga patuloy na kilos.
- source_word: אֱמֶת
  choice: ng katotohanan
  rationale: Sa pagkakaugnay nito sa pagsasalita, pangunahing tumutukoy ang אמת sa katotohanan o tapat na pananalita, bagaman maaari rin itong maglaman ng diwa ng pagiging mapagkakatiwalaan.
- source_word: בִּלְבָבוֹ
  choice: sa kanyang puso
  rationale: Pinananatili nito ang literal na larawan ng Hebreo tungkol sa panloob na pagkatao at ang ideya ng katapatan na hindi lamang panlabas.
theological_decisions:
- issue: Panlalaking anyong isahan bilang pangkalahatang kinatawan
  choice: Ang ... sa kanyang puso
  alternative: Ang sinumang ... nang taos-puso
  rationale: Panlalaking isahan ang mga participle at hulapi sa Hebreo, ngunit ginagamit bilang pangkalahatang paglalarawan. Ang “kanyang” ay nagpapanatili ng isahan nang hindi pinipilit ang kasariang hindi kailangang ipahayag sa natural na Filipino.
- issue: Moral na integridad laban sa ganap na kawalan ng kasalanan
  choice: may integridad
  alternative: walang kapintasan; ganap
  rationale: Inilalarawan ng talata ang buo at matapat na asal, hindi tahasang ipinapahayag ang absolutong kawalan ng kasalanan. Iniiwasan ng “may integridad” ang labis na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “namumuhay” upang natural na ihatid ang idyomatikong Hebreong “lumalakad,” at pinanatili ang “sa kanyang puso” upang huwag mawala ang larawan ng panloob na katapatan.
