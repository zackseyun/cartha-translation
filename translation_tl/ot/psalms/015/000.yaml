  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: tl
  text: 'Awit ni David.[a]


    Yahweh, sino ang maaaring manuluyan sa iyong tolda?[b]

    Sino ang maaaring tumahan sa iyong banal na bundok?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para kay David” o “tungkol kay David.” Ang pamagat sa Hebreo ay maaaring tumukoy sa pagkatha, kaugnayan, o pag-aalay.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tabernakulo.” Literal na “tolda” ang nasa Hebreo, na malamang na tumutukoy sa santuwaryo bilang tahanan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Natural at dignified na salin para sa awiting may saliw o komposisyong patula.
- source_word: יָגוּר
  choice: manuluyan
  rationale: Ipinahihiwatig ng pandiwa ang pananatili bilang panauhin o naninirahang dayuhan; pinananatili ng 'manuluyan' ang pagkakaibang ito mula sa mas permanenteng 'tumahan' sa kasunod na linya.
- source_word: בְּאָהֳלֶךָ
  choice: sa iyong tolda
  rationale: Tuwirang isinasalin ang 'tolda' habang hinahayaang ipahiwatig ng konteksto ang santuwaryo bilang tahanan ng Diyos.
- source_word: יִשְׁכֹּן
  choice: tumahan
  rationale: Natural na salin para sa paninirahan o permanenteng pananatili at angkop sa paralelismo ng talata.
- source_word: הַר קָדְשֶׁךָ
  choice: iyong banal na bundok
  rationale: Pinananatili ang konkretong larawan at possessive na anyo ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Kinakatawan ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng לְדָוִד sa pamagat
  choice: ni David
  alternative: para kay David / tungkol kay David
  rationale: Ang 'ni David' ang pinakamaikli at tradisyonal na anyo sa Filipino, ngunit hindi nito tiyak na nilulutas kung ang parirala ay tumutukoy sa may-akda, kaugnayan, o pag-aalay; inilalahad ang kalabuan sa talababa.
- issue: Larawan ng tolda bilang santuwaryo
  choice: tolda
  alternative: tabernakulo / santuwaryo
  rationale: Pinananatili ang literal na larawan ng Hebreo at hindi tahasang nilulutas ang metaporikal o kultikong pagtukoy nito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at patula. Ginamit ang 'manuluyan' at 'tumahan' upang mapanatili ang banayad na pagkakaiba ng magkaparis na pandiwang Hebreo.
