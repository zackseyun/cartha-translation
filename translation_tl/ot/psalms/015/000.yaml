  source_fidelity: 'Tapat ang salin sa Hebreo: naipahayag ang pamagat na מִזְמוֹר לְדָוִד, ang direktang pagtawag kay Yahweh, ang dalawang tanong, ang pagmamay-ari sa “iyong tolda” at “iyong banal na bundok,” at ang paralelismong יָגוּר / יִשְׁכֹּן. Ang “manuluyan” at “tumahan” ay angkop na nagpapakita ng bahagyang pagkakaiba ng mga pandiwa nang hindi pinipilit ang kahulugan.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang “Awit ni David,” “Sino ang maaaring…,” at ang magkaparis na mga tanong ay maayos ang daloy at angkop sa patulang rehistro ng mga Awit.
