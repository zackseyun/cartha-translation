base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: tl
  text: Hindi niya ipinapautang nang may tubo ang kanyang salapi[a], at hindi siya tumatanggap ng suhol laban sa taong walang sala. Ang gumagawa ng mga ito ay hindi matitinag kailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang may patubo.” Ang Hebreong נֶשֶׁךְ ay maaaring tumukoy sa tubong sinisingil sa pautang.
    reason: lexical_alternative
  - marker: b
    text: O, “hindi matitinag magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: ang kanyang salapi
  rationale: Bagaman ang כֶּסֶף ay literal na “pilak,” karaniwan din itong tumutukoy sa salapi. Dahil pautang at tubo ang konteksto, “salapi” ang malinaw at marangal na katumbas.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: ipinauutang nang may tubo
  rationale: Ang נֶשֶׁךְ ay tumutukoy sa tubong sinisingil sa pautang. Inilalahad ng salin ang mas malawak na kahulugan nito nang hindi nililimitahan sa labis o labag-sa-batas na tubo lamang.
- source_word: שֹׁחַד
  choice: suhol
  rationale: Ang “suhol” ang tuwiran at karaniwang terminong Filipino para sa bayad na ibinibigay upang baluktutin ang pasiya o katarungan.
- source_word: עַל נָקִי
  choice: laban sa taong walang sala
  rationale: Ang נָקִי ay isang taong malaya sa pagkakasala o paratang. Pinananatili ng “laban sa” ang ugnayang ipinahihiwatig ng עַל at ang posibleng kontekstong panghukuman.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Ang gumagawa ng mga ito
  rationale: Ang participle ay tumutukoy sa taong kinikilala sa ganitong asal. Likas at inklusibo sa modernong Filipino ang pahayag.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: hindi matitinag kailanman
  rationale: Pinananatili ng “matitinag” ang metapora ng katatagan sa מוֹט, at natural na ipinapahayag ng “hindi…kailanman” ang negatibong diwa ng לְעוֹלָם.
theological_decisions:
- issue: Saklaw ng pagbabawal sa pagpapatubo
  choice: Isinalin ang נֶשֶׁךְ bilang “tubo” nang hindi ito nililimitahan sa labis na tubo.
  alternative: “Labag-sa-katarungang tubo” o “pagpapatubo” na nauunawaan lamang bilang mapagsamantalang interes.
  rationale: Hindi tinutukoy ng salitang Hebreo sa talatang ito na labis lamang ang tubo. Ang mas payak na “tubo” ay nagpapanatili sa malawak na etikal na pahayag ng teksto at umiiwas sa pagpasok ng mas huling teoryang pang-ekonomiya.
- issue: Kalikasan ng ipinangakong katatagan
  choice: Pinanatili ang matalinghagang “hindi matitinag kailanman.”
  alternative: Ipaliwanag ito bilang tiyak na espirituwal, panlipunan, o pisikal na seguridad.
  rationale: Hindi tahasang nililinaw ng talata ang eksaktong anyo ng katatagan. Ang pagpapanatili sa metapora ay hindi nagpapasya nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “salapi” sa halip na mas kolokyal na “pera” upang umangkop sa rehistro ng Awit; nanatiling payak ang pangungusap at hindi pinalawak ang mga teolohikal na implikasyon.
