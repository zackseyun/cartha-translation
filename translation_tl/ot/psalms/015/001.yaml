  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: tl
  text: 'Awit ni David.[a]


    Yahweh, sino ang maaaring manuluyan sa iyong tolda?[b]

    Sino ang maaaring manirahan sa iyong banal na bundok?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Awit na isinulat ni David” o “Awit para kay David.” Maaaring magpahiwatig ang superskripsiyon sa Hebreo ng pag-akda, pagkakaugnay, o pag-aalay.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tabernakulo.” Literal na “tolda” ang salitang Hebreo, na malamang na nagpapahiwatig sa santuwaryo bilang tahanan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwan at likas na katawagan sa Filipino para sa isang salmo o awiting panrelihiyon, at angkop sa pamagat ng aklat.
- source_word: לְדָוִד
  choice: ni David
  rationale: Likas na salin ng superskripsiyon sa Filipino; hindi nito ganap na nilulutas kung ang ugnayan ay pag-akda, pagkakaugnay, o pag-aalay, kaya nililinaw ang saklaw sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: יָגוּר
  choice: maaaring manuluyan
  rationale: Ipinahihiwatig ng pandiwa ang pananatili bilang panauhin o dayuhan; pinananatili ng “manuluyan” ang pagkakaiba nito sa mas matatag na “manirahan” sa kasunod na linya.
- source_word: בְּאָהֳלֶךָ
  choice: sa iyong tolda
  rationale: Ang payak at kongkretong kahulugan ng אֹהֶל ay “tolda”; sa konteksto, maaari rin nitong ipahiwatig ang santuwaryo bilang tahanan ng Diyos.
- source_word: יִשְׁכֹּן
  choice: maaaring manirahan
  rationale: Natural na katumbas ng pandiwang nangangahulugang tumahan o manatili, at maayos na kaagapay ng “manuluyan.”
- source_word: בְּהַר קָדְשֶׁךָ
  choice: sa iyong banal na bundok
  rationale: Tuwirang inilalarawan ang bundok na banal at pag-aari ng Diyos, malamang na tumutukoy sa Zion.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang personal na pangalan sa tekstong Hebreo; ang transliterasyong “Yahweh” ay nagpapanatili rito nang hindi pinapalitan ng titulo.
- issue: Ugnayang ipinahihiwatig ng לְדָוִד sa superskripsiyon
  choice: ni David, na may talababa tungkol sa posibleng mga ugnayan
  alternative: isinulat ni David; para kay David
  rationale: Maaaring magpahiwatig ang לְ ng pag-akda, pagkakaugnay, o pag-aalay. Hindi dapat sapilitang pumili ng iisang kahulugan ang pangunahing teksto.
- issue: Larawan ng tolda at banal na bundok
  choice: panatilihin ang kongkretong mga larawang “tolda” at “banal na bundok”
  alternative: tabernakulo at santuwaryo
  rationale: Pinananatili nito ang tula at ang pahiwatig ng presensiya ng Diyos nang hindi ginagawang mas espesipiko ang teksto kaysa sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “manuluyan” at “manirahan” upang mapanatili ang bahagyang pagkakaiba ng dalawang magkatulad na pandiwang Hebreo. Ang pagtawag na “Yahweh” ay direkta at walang idinagdag na “O,” na hindi kailangan sa natural na panawagan sa Filipino.
