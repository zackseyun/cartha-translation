source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: tl
  text: Sa kaniyang paningin, ang taong hinahamak ay itinatakwil[a], ngunit pinararangalan niya ang mga may takot kay Yahweh; nanunumpa siya kahit makapinsala ito sa kaniya at hindi niya ito binabago.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “Sa kaniyang paningin, ang taong kasuklam-suklam ay hinahamak.” Masiksik ang sugnay sa Hebreo at maaari itong isalin sa ilang magkakalapit na paraan.'
    reason: alternative_reading
  - marker: b
    text: 'Sa literal: “nanunumpa sa kapinsalaan at hindi nagbabago.” Karaniwang inuunawa itong pagtupad sa sinumpaan kahit mapinsala siya dahil dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: Sa kaniyang paningin, ang taong hinahamak ay itinatakwil
  rationale: Pinananatili nito ang masidhing pagkakasiksik at ang dalawang anyong pasibo ng Hebreo nang hindi ipinapalagay na ang נִבְזֶה ay tiyak na nangangahulugang likas na masama o hamak sa moral.
- source_word: יִרְאֵי יְהוָה
  choice: ang mga may takot kay Yahweh
  rationale: Likas na pariralang Filipino na nagpapanatili sa biblikal na diwa ng may pagpipitagan at masunuring takot, sa halip na pahinain ito bilang paggalang lamang.
- source_word: יְכַבֵּד
  choice: pinararangalan niya
  rationale: Tumpak at karaniwang katumbas ng piel na pandiwang nangangahulugang magbigay-halaga o dangal.
- source_word: נִשְׁבַּע לְהָרַע
  choice: nanunumpa siya kahit sa sarili niyang kapinsalaan
  rationale: 'Ipinahahayag ang karaniwang pagkaunawa sa eliptikong parirala: tinutupad niya ang sinumpaan kahit maging mapaminsala o magastos iyon sa kaniya.'
- source_word: וְלֹא יָמִר
  choice: at hindi niya ito binabago
  rationale: Ang 'ito' ay likas na tumutukoy sa ipinahiwatig na sumpa o pangako; pinananatili ang literal na diwa ng pagbabago sa halip na palitan agad ng mas malayang 'hindi tumatalikod sa salita.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalang Yahweh, hindi bilang pamagat.
theological_decisions:
- issue: Pagpapakahulugan sa masiksik na sugnay na נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: Sa kaniyang paningin, ang taong hinahamak ay itinatakwil
  alternative: Sa kaniyang paningin, ang taong kasuklam-suklam ay hinahamak
  rationale: Pinananatili ng pangunahing salin ang mga anyong pasibo at ang tunay na kalabuan kung ang unang salita ay tumutukoy sa isang taong hinahamak o sa isang taong kasuklam-suklam. Inilalagay sa talababa ang tradisyonal na moral na pagbasa.
- issue: Saklaw ng לְהָרַע sa panunumpa
  choice: kahit sa sarili niyang kapinsalaan
  alternative: nanunumpa upang manakit
  rationale: Sa konteksto ng katapatan, malamang na tumutukoy ito sa hindi pagbawi ng sumpa kahit mapahamak ang nanumpa; gayunman, literal na walang tahasang 'sarili,' kaya nililinaw sa talababa ang elipsis.
- issue: Paglalahad sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kaniyang” at “niya” nang malinaw at natural; iniwasan ang labis na arkaikong pananalita. Ang “may takot kay Yahweh” ay sadyang nagpapanatili sa tradisyonal at teolohikal na tensiyon ng 'takot' bilang pagpipitagan at pagkilala sa Diyos.
