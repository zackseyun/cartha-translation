base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: tl
  text: Ang masasama ay naglalakad sa lahat ng dako[a], kapag itinataas ang kabuktutan sa gitna ng sangkatauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang masasama ay nagpaparoo’t-parito sa lahat ng panig habang itinataas ang kabuktutan sa sangkatauhan.” Literal na “sa/mula sa mga anak ng tao” ang huling parirala sa Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִיב
  choice: sa palibot
  rationale: Pinananatili ang pang-abay na diwa ng pagkilos o pag-iral sa lahat ng dako, nang hindi idinaragdag ang mas mapanuring diwa ng “gumagala na parang mandaragit.”
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Likas na substantibong pangmaramihan sa Tagalog para sa masasamang tao; hindi na kailangang idagdag ang salitang “mga tao.”
- source_word: יִתְהַלָּכוּן
  choice: naglalakad
  rationale: Pinananatili ang pangunahing larawan ng paglakad o pagparoo't parito. Ang “gumagala” ay maaari rin ngunit bahagyang mas malaya.
- source_word: כְּרֻם
  choice: kapag itinataas
  rationale: 'Ipinapahayag ang temporal o pangyayaring kalagayan ng mahirap na parirala: malayang nakakakilos ang masasama kapag itinataas ang kasuklam-suklam. Posible rin ang “habang itinataas.”'
- source_word: זֻלּוּת
  choice: ang kasuklam-suklam
  rationale: Tumutukoy sa mababa, hamak, o walang halagang bagay na kinamumuhian sa moral na diwa. Ang substantibong parirala ay natural sa Filipino at hindi nililimitahan ang kahulugan sa isang abstraktong katangian lamang.
- source_word: לִבְנֵי אָדָם
  choice: sa gitna ng sangkatauhan
  rationale: Ipinahahayag nang natural ang pangkalahatang pagtukoy ng Hebreong literal na “mga anak ng tao,” na sumasaklaw sa sangkatauhan.
theological_decisions:
- issue: Pangkalahatang antropolohikal na pariralang לִבְנֵי אָדָם
  choice: sa gitna ng sangkatauhan
  alternative: sa gitna ng mga anak ng tao
  rationale: Bagaman panlalaki ang anyong Hebreo, pangkalahatan ang saklaw nito. Mas natural at malinaw sa modernong Filipino ang “sangkatauhan,” habang inilalagay sa talababa ang literal na idyoma.
- issue: Ugnayan ng כְּרֻם sa pangunahing sugnay
  choice: kapag itinataas
  alternative: habang itinataas
  rationale: Hindi ganap na tiyak kung temporal, pangyayari, o paghahambing ang כְּ. Pinili ang malinaw na temporal-pangyayaring pagbasa ngunit pinananatili sa talababa ang malapit na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Inuna ang natural na ayos nang hindi inaalis ang pambungad na diin ng סָבִיב. Iniwasan ang sobrang interpretibong “umaaligid” o “naninila.”
