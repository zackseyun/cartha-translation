  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: tl
  text: 'Ang mga salita ni Yahweh ay mga salitang dalisay,


    gaya ng pilak na dinalisay sa pugon[a] sa lupa[b],


    na pinadalisay nang pitong ulit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tunawan” o “sa sisidlang pantunaw.” Bihira ang salitang Hebreo at hindi tiyak ang eksaktong tinutukoy nito, bagaman malinaw na may kaugnayan ito sa pagdadalisay ng metal.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa lupa.” Maaaring tukuyin ng parirala ang lugar o kaligiran ng pagdadalisay, ngunit hindi tiyak ang eksaktong diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: mga salita / mga salitang
  rationale: Ang inuulit na pangngalan mula sa אמר ay tumutukoy sa mga binigkas na salita. Pinananatili ng “mga salita” ang pag-uulit at hindi nito nililimitahan ang kahulugan sa “mga pangako.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: טְהֹרוֹת
  choice: dalisay
  rationale: Ang “dalisay” ay likas at marangal na salin na angkop kapuwa sa katangian ng mga salita at sa kasunod na larawan ng paglilinis ng pilak.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Tuwirang tumutukoy ang pangngalan sa metal na pilak.
- source_word: צָרוּף
  choice: dinalisay
  rationale: Inilalarawan ng anyong ito ang metal na dumaan sa proseso ng pagdadalisay; malinaw sa modernong Filipino ang “dinalisay.”
- source_word: בַּעֲלִיל
  choice: sa pugon
  rationale: Bihira at hindi tiyak ang eksaktong tinutukoy ng salitang Hebreo, ngunit malinaw na kabilang ito sa larangan ng pagtunaw o pagdadalisay ng metal. Ang “pugon” ay natural ngunit nilalakipan ng talababa upang mapanatili ang kawalang-katiyakan.
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Pinananatili ng medyo literal na salin ang mahirap at hindi tiyak na pariralang Hebreo nang hindi nagpapasiya kung lokasyon, kaligiran, o iba pang ugnayan ang ibig sabihin nito.
- source_word: מְזֻקָּק
  choice: pinadalisay
  rationale: Ipinagpapatuloy at pinatitindi nito ang larawang metalurhikal. Ang pag-uulit ng ugat na “dalisay” ay malinaw at makatang pakinggan sa Filipino.
- source_word: שִׁבְעָתָיִם
  choice: nang pitong ulit
  rationale: Tuwirang ipinahahayag nito ang paulit-ulit at ganap na pagdadalisay na inilalarawan ng idyomang Hebreo.
theological_decisions:
- issue: Ang uri ng kadalisayan ng mga salita ni Yahweh
  choice: Ipinahahayag ng talata ang lubos na kadalisayan at pagiging mapagkakatiwalaan ng mga salita ni Yahweh sa pamamagitan ng larawan ng pilak na paulit-ulit na dinalisay.
  alternative: Limitahan ang diwa sa kadalisayang moral lamang, o palawakin ito upang tahasang magturo ng isang mas huling doktrina tungkol sa preserbasyon ng teksto.
  rationale: Inihahambing mismo ng tekstong Hebreo ang mga salita ni Yahweh sa pilak na lubusang dinalisay. Pinananatili ng salin ang pahayag at larawan ng teksto nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang pag-uulit ng “mga salita” at ang metaporang metalurhikal, pati ang kawalang-katiyakan ng dalawang mahirap na pariralang Hebreo.
