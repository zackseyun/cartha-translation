  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: tl
  text: 'Putulin nawa ni Yahweh ang lahat ng labing mapambola[a],

    ang dilang nagsasalita ng malalaking bagay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga labing madulas.” Ang larawan sa Hebreo ay makinis o madulas na pananalitang nambobola.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “malalaking bagay”; sa konteksto, mga hambog o palalong pag-aangkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: Putulin nawa
  rationale: Pinananatili ng “putulin” ang matinding larawan ng Hiphil ng כרת, habang ipinahahayag ng “nawa” ang likas na puwersa nito rito bilang hiling o panalangin ng salmista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: ang lahat ng labing mapambola
  rationale: Ang literal na larawan ay “mga labi ng kadulasán.” Natural na ipinahahayag ng “labing mapambola” sa modernong Filipino ang makinis, mapanuyo, at mapanlinlang na pananalita nang hindi ginagawang tahasang “sinungaling.”
- source_word: לָשׁוֹן
  choice: ang dila
  rationale: Pinananatili ang isahang kolektibo at matingkad na personipikasyon ng Hebreo, na nakahanay sa naunang pariralang tumutukoy sa mga labi.
- source_word: מְדַבֶּרֶת
  choice: nagsasalita
  rationale: Natural na isinasalin bilang sugnay na panuring sa “dila.”
- source_word: גְּדֹלוֹת
  choice: malalaking bagay
  rationale: Pinananatili ang literal at sadyang maluwag na pananalitang “great things”; ipinapaliwanag sa talababa na sa konteksto ay tumutukoy ito sa hambog o palalong mga pag-aangkin.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Puwersa ng יַכְרֵת
  choice: Putulin nawa
  alternative: Puputulin
  rationale: Maaaring basahin ang di-ganap na pandiwa bilang pahayag sa hinaharap, ngunit sa daloy ng salmo ay natural itong panalangin o sumpang-hiling. Hindi nito binabawasan ang marahas na larawan ng “pagputol.”
- issue: Kahulugan ng גְּדֹלוֹת
  choice: malalaking bagay
  alternative: mga palalong bagay
  rationale: Ang mas literal na anyo ay nagpapanatili sa lawak at tensiyon ng pananalita; ang hambog na diwa ay ibinibigay sa talababa sa halip na ipasok nang tahasan sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mapambola” bilang natural na katumbas ng idyomang Hebreo, habang nananatili sa talababa ang literal na larawan ng madudulas na labi. Ang paghahanay ng “mga labi” at “ang dila” ay pinanatili nang walang idinagdag na pangatnig upang maipakita ang matalim na paralelismo ng tula.
