  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: tl
  text: '“Dahil sa pananalanta sa mga dukha,

    dahil sa daing ng mga nangangailangan,

    babangon ako ngayon,” sabi ni Yahweh.

    “Ilalagay ko siya sa kaligtasang pinananabikan niya.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap unawain ang Hebreo sa huling sugnay. Mas literal: “Ilalagay ko sa kaligtasan; humihingal siya para rito.” Maaari rin itong unawain na ilalagay siya sa kaligtasan mula sa taong sumisinghal sa kaniya, o sa kahawig na diwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: Dahil sa pananalanta sa mga dukha
  rationale: Ang מִן ay inuunawang nagsasaad ng dahilan, at ang שֹׁד ay tumutukoy sa mapaminsalang karahasan, pandarambong, o pananalanta. Ang “pananalanta” ay malawak ngunit matindi, samantalang ang “mga dukha” ay likas at marangal na salin ng עֲנִיִּים sa kontekstong ito.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: dahil sa daing ng mga nangangailangan
  rationale: Kaagapay ng unang parirala, ang מִן ay muling nagpapahayag ng dahilan. Ang “daing” ay naghahatid ng naririnig na paghihirap, at pinananatili ng “mga nangangailangan” ang pagkakaiba ng אֶבְיוֹנִים sa naunang “mga dukha.”
- source_word: עַתָּה אָקוּם
  choice: babangon ako ngayon
  rationale: Pinananatili nito ang agarang pagkilos at ang larawang antropomorpiko ng Diyos na bumabangon upang mamagitan.
- source_word: יֹאמַר יְהוָה
  choice: sabi ni Yahweh
  rationale: Likas sa modernong Tagalog ang ganitong paningit sa tuwirang pahayag. Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: Ilalagay ko siya sa kaligtasan
  rationale: Ang שׂים ay “ilagay,” at ang יֵשַׁע ay dito inuunawang ligtas na kalagayang bunga ng pagliligtas. Isiningit ang “siya” ayon sa malamang na di-tahasang layon sa konteksto.
- source_word: יָפִיחַ לוֹ
  choice: pinananabikan niya
  rationale: Mahirap at pinagtatalunan ang parirala. Ang pagbasa rito bilang paghingal o pananabik ay nagbibigay ng malinaw na ugnayan sa kaligtasang inaasam ng api, ngunit inilalahad sa talababa ang mas literal at iba pang posibleng pagbasa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Paksa at diwa ng huling sugnay
  choice: Ang api ay ilalagay sa kaligtasang pinananabikan niya
  alternative: Ilalagay siya sa kaligtasan mula sa sumisinghal o humihinga nang may paghamak laban sa kaniya; o, “Ilalagay ko sa kaligtasan; hinihingal siya para rito”
  rationale: Hindi tiyak ang sintaks at kahulugan ng יָפִיחַ לוֹ. Pinili sa pangunahing teksto ang pagbasa na maayos sa konteksto ng daing at pagliligtas, ngunit hindi ipinagkaila ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang paghahanay at ang agarang tono ng pahayag ni Yahweh. Ginamit ang “dukha” at “mga nangangailangan” upang mapanatili ang magkatulad ngunit hindi lubusang magkaparehong mga katawagang Hebreo.
