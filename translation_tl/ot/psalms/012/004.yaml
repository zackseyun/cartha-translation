  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: tl
  text: na nagsasabi, “Sa pamamagitan ng aming dila ay mananaig kami; ang aming mga labi ay nasa panig namin[a]—sino ang panginoong mamamahala sa amin[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aming mga labi ay amin” o “ang aming mga labi ay kasama namin.”
    reason: lexical_alternative
