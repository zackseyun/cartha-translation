    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: na nagsasabi
  rationale: Ikinakabit ng panghalip na panaguri ang talata sa paglalarawan sa masasama sa naunang talata; ang perpektong pandiwa ay likas na maipahayag bilang kasalukuyang ugali sa kontekstong patula.
- source_word: לִלְשֹׁנֵנוּ
  choice: Sa pamamagitan ng aming dila
  rationale: 'Binabasa ang ל bilang instrumental: ginagamit nila ang pananalita upang manaig. Pinananatili rin ang kongkretong larawan ng ‘dila.’'
- source_word: נַגְבִּיר
  choice: mananaig kami
  rationale: Ang Hiphil ng גבר ay nagpapahiwatig ng pagpapakita ng lakas o pagkakaroon ng higit na kapangyarihan; sa konteksto, ang pagmamapuri ay tungkol sa pangingibabaw sa pamamagitan ng pananalita.
- source_word: שְׂפָתֵינוּ אִתָּנוּ
  choice: ang aming mga labi ay kakampi namin
  rationale: Pinananatili ang larawan ng ‘mga labi,’ habang ipinahahayag sa likas na Tagalog ang maikli at malabong idyomang ‘kasama namin,’ na maaaring tumukoy sa pagtataglay o kalamangan.
- source_word: מִי אָדוֹן לָנוּ
  choice: sino ang panginoon sa amin?
  rationale: Ang אָדוֹן ay pangkalahatang katawagan sa panginoon o amo, hindi ang banal na pangalan. Ang ‘panginoon sa amin’ ay nagpapanatili sa mapanghamong pagtanggi nila sa anumang awtoridad.
theological_decisions:
- issue: Pagpapahayag sa אָדוֹן bilang pangkalahatang awtoridad
  choice: panginoon
  alternative: amo
  rationale: Hindi tuwirang tinutukoy ng pangngalan ang YHWH, kaya maliit ang titik at ginagamit ito bilang pangkalahatang katawagan sa sinumang may kapangyarihan sa kanila. Pinananatili nito ang teolohikal na tensiyon nang hindi ipinapasok ang banal na pangalan.
- issue: Kahulugan ng שְׂפָתֵינוּ אִתָּנוּ
  choice: ang aming mga labi ay kakampi namin
  alternative: ang aming mga labi ay amin
  rationale: Posibleng ipahiwatig ng parirala ang sariling pag-aari o ang pagiging panig/kalamangan nila. Ang pangunahing salin ay natural at pinananatili ang posibilidad na ‘nasa panig namin,’ habang inilalagay sa talababa ang pagbasa tungkol sa pag-aari.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkapares na larawang ‘dila’ at ‘mga labi,’ gayundin ang mapagmataas at mapanghamong tono ng Hebreo. Ginawang tahasan ang instrumental na gamit ng ל upang malinaw sa karaniwang mambabasa.
