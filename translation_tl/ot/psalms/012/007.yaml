  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: tl
  text: Ikaw, Yahweh, ang mag-iingat sa kanila; iingatan mo kami[a] mula sa salinlahing ito magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa nakasulat na anyong Hebreo (ketiv), “iingatan mo siya”; ang tradisyunal na pagbasa (qere) ay “iingatan mo kami.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Ikaw
  rationale: Ang tahasang panghalip na nasa unahan ay nagbibigay-diin sa gumagawa; natural itong napapanatili sa hulma na “Ikaw ... ang.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: תִּשְׁמְרֵם
  choice: mag-iingat sa kanila
  rationale: Ang שׁמר ay nangangahulugang mag-ingat, magbantay, o magpanatili; malinaw at natural dito ang “mag-iingat sa kanila,” habang pinananatili ang maramihang layon.
- source_word: תִּצְּרֶנּוּ
  choice: iingatan mo kami
  rationale: Ang anyo mula sa נצר ay maaaring unawaing may hulaping unang panauhang maramihan, “kami,” gaya ng karaniwang pagbasa sa konteksto. Gayunman, maaari rin itong suriin bilang makatang hulaping ikatlong panauhang isahan, “siya,” kaya inilagay ang alternatibo sa talababa.
- source_word: מִן הַדּוֹר זוּ
  choice: mula sa salinlahing ito
  rationale: Pinananatili ng “mula sa” ang diwang paglalayo o pag-iingat laban sa kasalukuyang masamang salinlahi; “salinlahi” ang tuwirang katumbas ng דור.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na salin ng pahayag na tumutukoy sa walang takdang pagpapatuloy.
theological_decisions:
- issue: Kalabuan ng hulapi sa תִּצְּרֶנּוּ at ang pagbabago ng tinutukoy na panghalip
  choice: “iingatan mo kami” sa pangunahing teksto, na may talababa para sa “iingatan mo siya”
  alternative: “iingatan mo siya”
  rationale: Ang anyo ay maaaring basahin bilang unang panauhang maramihan (“kami”) o bilang makatang ikatlong panauhang isahan (“siya”). Ang konteksto at sinaunang saling Griyego ay umaalalay sa “kami,” ngunit hindi dapat itago ang tunay na morpolohikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ikaw ... ang” upang likas na maipahayag ang diin ng tahasang panghalip sa Hebreo, at pinanatili ang matulaing pagtutulad ng dalawang pandiwang nangangahulugang pag-iingat.
