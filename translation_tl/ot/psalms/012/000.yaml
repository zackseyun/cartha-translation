base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng awitan: ayon sa “Ang Ikawalo”[a]. Isang salmo ni David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Ang Ikawalo.” Malamang na katawagang musikal o liturhikal ito—marahil ay tumutukoy sa isang himig, instrumento, o ayos na may kaugnayan sa oktaba. Nakaugalian din itong baybayin bilang Sheminith.
    reason: cultural_note
  - marker: b
    text: Maaari ring “para kay David” o “gawa ni David.” Hindi tiyak sa Hebreo kung ano mismo ang ugnayan ng salmo kay David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng awitan
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa musikal na pagtatanghal. Likas sa makabagong Filipino ang pariralang ito at hindi nito nililimitahan ang tungkulin sa koro lamang.
- source_word: עַל
  choice: ayon sa
  rationale: Sa ganitong pamagat, ipinakikilala nito ang isang musikal o liturhikal na batayan o ayos. Pinananatili ng “ayon sa” ang maluwag na ugnayan nang hindi tiyak na ipinapalagay na himig, instrumento, o oktaba ang tinutukoy.
- source_word: הַשְּׁמִינִית
  choice: “Ang Ikawalo”
  rationale: Ito ang tuwirang kahulugan ng Hebreo. Ang panipi at malaking titik ay nagpapakitang isa itong katawagan, habang iniiwasang tiyakang tukuyin ang di-malinaw na gamit nito sa musika o pagsamba.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang “salmo” ang kinikilalang katawagan sa uring pampanitikan at pangmusika na tinutukoy rito.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang karaniwang Filipino na “ni David” ay maaaring magpahiwatig ng pagkakaugnay, pagmamay-ari, o pag-akda. Hindi nito sa mismong teksto lubusang nilulutas ang saklaw ng Hebreong pang-ukol.
theological_decisions:
- issue: Ang ugnayang ipinahihiwatig ng לְדָוִד kay David
  choice: ni David
  alternative: para kay David; gawa ni David
  rationale: Maaaring tumukoy ang Hebreo sa pag-akda, pagkakaugnay, pag-aalay, o pagmamay-ari. Pinananatili ng “ni David,” kasama ng talababa, ang pagiging bukas ng ugnayan sa halip na gawing tiyak ang isang pinagtatalunang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tagapangasiwa ng awitan” sa halip na mas teknikal o hiram na katawagan. Pinanatiling literal ang “Ang Ikawalo” at ipinaliwanag sa talababa upang hindi ipagpalagay nang walang katiyakan na isa itong himig, instrumento, o oktabang ayos.
