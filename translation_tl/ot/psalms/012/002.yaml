base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: tl
  text: Nagsasalita sila ng walang kabuluhan[a], bawat isa sa kaniyang kapwa; nagsasalita sila nang may matatamis na labi[b] at pusong dalawa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kasinungalingan” o “mga salitang hungkag.” Saklaw ng Hebreo ang hungkag, huwad, at walang saysay.
    reason: lexical_alternative
  - marker: b
    text: O “makikinis na labi.” Ang larawan sa Hebreo ay pananalitang kaakit-akit at mapamuri ngunit mapanlinlang.
    reason: lexical_alternative
  - marker: c
    text: Literal na, “may puso at puso.” Idyoma ito para sa pagkukunwari o magkasalungat na panloob na hangarin.
    reason: idiom_explanation
lexical_decisions:
- source_word: שָׁוְא
  choice: mga salitang hungkag
  rationale: Saklaw ng שָׁוְא ang hungkag, walang kabuluhan, huwad, o mapanlinlang. Pinananatili ng “hungkag” ang lawak ng salita at hindi ito nililimitahan sa tahasang pagsisinungaling lamang.
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: sinasabi / nagsasalita
  rationale: Kapwa tuwirang tumutukoy sa pagsasalita. Ang pag-uulit ng ideya sa dalawang sugnay ay nagpapanatili sa diin at balangkas ng Hebreong taludtod nang hindi nagiging pilit sa Tagalog.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: bawat isa sa kanyang kapwa
  rationale: Distributibo ang אִישׁ dito. Likas sa Tagalog ang “bawat isa,” at malinaw na ipinahahayag ng “kanyang kapwa” ang ugnayang panlipunan nang hindi ipinapalagay na matalik na kaibigan ang tinutukoy.
- source_word: שְׂפַת חֲלָקוֹת
  choice: sa matatamis na labi
  rationale: Literal na larawan nito ang makinis o madulas na labi, na tumutukoy sa nakaaakit, mapamuri, at mapanlinlang na pananalita. Ang “matatamis na labi” ay natural at patula sa makabagong Tagalog habang pinananatili ang metonimiya ng mga labi.
- source_word: בְּלֵב וָלֵב
  choice: pusong dalawa
  rationale: Malapit itong sumusunod sa literal na “may puso at puso.” Pinananatili nito ang matinding larawan ng pagkukunwari o magkasalungat na panloob na hangarin sa halip na pumili lamang ng isang pagpapakahulugan.
theological_decisions:
- issue: Kung ang “puso at puso” ay pangunahing pagkukunwari o pagkakahati ng kalooban
  choice: pusong dalawa
  alternative: pusong hati / may dobleng kalooban
  rationale: Hindi tahasang nilulutas ng salin ang saklaw ng idyoma. Maaaring tumukoy ito sa mapanlinlang na dalawang layunin o sa nahahating panloob na hangarin; pinananatili ng malapit na larawan ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Ginamit ang “kapwa” bilang malawak at likas na katumbas ng רֵעַ. Pinanatili ang mga larawang “labi” at “pusong dalawa,” at inilagay sa mga talababa ang mahahalagang alternatibong kahulugan.
