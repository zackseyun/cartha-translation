  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: tl
  text: Magligtas ka, Yahweh, sapagkat wala na ang taong maka-Diyos[a]; naglaho na ang mga mapagkakatiwalaan mula sa sangkatauhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “naglaho na ang taong maka-Diyos,” “wala na ang banal,” o, kung kolektibo ang isahan, “wala na ang mga maka-Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mula sa mga anak ng tao,” isang idyoma para sa sangkatauhan o pamayanan ng mga tao.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Magligtas ka
  rationale: Pautos na pakiusap mula sa ugat na ישׁע. Hindi tahasang binabanggit sa Hebreo kung sino ang ililigtas, kaya hindi dinagdagan ng layong “kami” o “ako.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang יְהוָה, sa halip na palitan ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng apurahang pakiusap.
- source_word: גָמַר
  choice: wala na
  rationale: Ipinahihiwatig ng pandiwa na ang tinutukoy ay umabot na sa wakas o hindi na masumpungan; natural itong naipapahayag sa Filipino bilang “wala na.”
- source_word: חָסִיד
  choice: ang taong tapat
  rationale: Ang pangngalang pang-uri ay anyong panlalaking isahan at tumutukoy sa taong may katapatan o matibay na debosyon. Pinananatili ng “taong tapat” ang isahan nang hindi nililimitahan ang reklamo sa isang tiyak na indibidwal.
- source_word: פַסּוּ
  choice: naglaho na
  rationale: Ang maramihang pandiwa ay nagsasaad ng pagkawala o paglaho at nagpapanatili ng matinding himig ng panaghoy.
- source_word: אֱמוּנִים
  choice: ang mga mapagkakatiwalaan
  rationale: Tumutukoy ito sa mga taong matatag, maaasahan, at tapat; malinaw na naihahayag ng “mapagkakatiwalaan” ang panlipunan at moral na diwa.
- source_word: מִבְּנֵי אָדָם
  choice: sa gitna ng sangkatauhan
  rationale: Natural na Filipino para sa Hebreong idyomang literal na “mula sa mga anak ng tao,” na tumutukoy sa pamayanan ng mga tao.
theological_decisions:
- issue: Paglalarawan sa חָסִיד
  choice: taong tapat
  alternative: taong maka-Diyos
  rationale: Pinili ang salitang nakatuon sa katapatan at debosyon upang hindi ipasok ang mas malawak at posibleng denominasyonal na pakahulugan ng “maka-Diyos.”
- issue: Bilang ng חָסִיד
  choice: isahang “ang taong tapat”
  alternative: maramihang “ang mga tapat”
  rationale: Anyong isahan ang Hebreo, ngunit maaari itong kumatawan sa isang uri ng tao. Pinanatili sa teksto ang isahan at inilagay sa talababa ang posibleng kolektibong pagkaunawa.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may maikli at apurahang himig ng panalangin. Pinanatili ang kawalan ng tahasang layon ng “magligtas,” ang isahang anyo ng חָסִיד, at ang paralelismo ng dalawang sugnay.
