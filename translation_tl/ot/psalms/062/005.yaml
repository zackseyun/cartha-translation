- issue: Kung ang דּוֹמִּי ay isang utos sa sariling kaluluwa o isang paglalarawan sa kalagayan nito
  choice: 'Utos: “manahimik ka, kaluluwa ko”'
  alternative: 'Pahayag: “Sa Diyos lamang tahimik na naghihintay ang kaluluwa ko”'
  rationale: Ang anyong may patinig sa WLC ay likas na mababasa bilang pautos na pambabaeng isahan, na umaayon sa tuwirang pakikipag-usap sa נַפְשִׁי. Gayunman, inilalahad sa talababa ang tradisyonal na alternatibong pagbasa upang hindi ikubli ang umiiral na pagsasalin.
