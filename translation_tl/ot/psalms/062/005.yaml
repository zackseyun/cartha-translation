lexical_decisions:
- source_word: אַךְ
  choice: lamang
  rationale: 'Ipinahahayag nito ang pagtatangi o eksklusibong pagtitiwala: ang Diyos ang tanging pinatutungkulan ng pananahimik at pag-asa.'
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Pinananatili ang pagtuon ng kaluluwa sa Diyos; natural sa Filipino ang pariralang “sa Diyos lamang” sa ganitong konteksto.
- source_word: דּוֹמִּי
  choice: manahimik ka
  rationale: Tuwirang isinasalin ang anyong pautos na nakatuon sa pambabaeng pangngalang נֶפֶשׁ. Hindi idinaragdag sa pangunahing teksto ang ideyang “maghintay,” bagaman maaari itong ipahiwatig ng konteksto.
- source_word: נַפְשִׁי
  choice: kaluluwa ko
  rationale: Pinananatili ang Hebreong paraan ng pakikipag-usap ng makata sa kanyang sarili, na malinaw at pamilyar din sa wikang Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikilala nito ang dahilan ng utos: dapat manahimik ang kaluluwa dahil sa Diyos nagmumula ang kanyang pag-asa.'
- source_word: מִמֶּנּוּ
  choice: sa kanya nagmumula
  rationale: Malinaw na tumutukoy pabalik sa Diyos at natural na ipinapahayag sa Filipino ang pinagmulan.
- source_word: תִּקְוָתִי
  choice: ang pag-asa ko
  rationale: Karaniwan at malinaw na katumbas ng תִּקְוָה sa kontekstong ito.
