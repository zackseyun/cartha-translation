  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: tl
  text: Hanggang kailan ninyo sasalakayin ang isang lalaki? Gigibain ba siya ninyong lahat[a], tulad ng isang nakahilig na pader at bakod na halos bumagsak?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Papaslangin ba siya ninyong lahat?” Karaniwang tumutukoy ang pandiwa sa pagpaslang, ngunit maaari itong maunawaan dito bilang metaporikal na paggiba dahil sa kasunod na larawan ng pader at bakod.
    reason: lexical_alternative
  - marker: b
    text: Maaaring inilalarawan ng paghahambing ang lalaking sinasalakay bilang marupok at malapit nang bumagsak. Gayunman, inuunawa ito ng ilan bilang paglalarawan sa mga sumasalakay na nagkakumpulan laban sa kanya, gaya ng nakausling pader o bakod na naitulak pabagsak.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: sasalakayin
  rationale: Ang bihirang pandiwa ay nagpapahiwatig ng marahas na paglusob o paulit-ulit na pag-atake. Likas at malinaw sa modernong Tagalog ang “sasalakayin” nang hindi nililimitahan ang paraan ng karahasan.
- source_word: עַל אִישׁ
  choice: ang isang lalaki
  rationale: Pinananatili nito ang isahan at panlalaking katawagan ng אִישׁ, na tumutukoy rito sa isang partikular na taong pinupuntirya.
- source_word: תְּרָצְּחוּ
  choice: gigibain siya
  rationale: Bagaman karaniwang tumutukoy ang רצח sa marahas na pagpatay, ang metaporikal na “gigibain” ay nag-uugnay nang tuwiran sa kasunod na larawan ng pader at bakod na malapit nang bumagsak. Inilalagay sa talababa ang mas tuwirang kahulugang “papatayin.”
- source_word: כֻלְּכֶם
  choice: ninyong lahat
  rationale: Malinaw nitong ipinahahayag ang mariing kolektibong diwa ng panghalip na maramihan.
- source_word: כְּקִיר נָטוּי
  choice: gaya ng nakahilig na pader
  rationale: Pinananatili ang kongkretong larawan ng isang pader na hindi na matatag at malapit nang bumagsak.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: ng bakod na halos matumba
  rationale: Ipinahahayag nito sa natural na Tagalog ang larawan ng bakod na naitulak o nawalan na ng katatagan, habang iniiwasan ang di-likas na sobrang literal na pananalita.
theological_decisions:
- issue: Kung sino ang inilalarawan ng pader at bakod
  choice: Ang lalaking sinasalakay ang pangunahing tinutukoy ng paghahambing.
  alternative: Maaaring ang mga sumasalakay ang inilalarawang nagsisiksikan o dumadagok na gaya ng nakaliyad na pader.
  rationale: Pinakamadaling iugnay ng balarila at ng pandiwang “gigibain” ang paghahambing sa taong pinupuntirya, ngunit hindi lubos na tiyak ang saklaw ng Hebreong paghahambing; kaya pinananatili sa talababa ang ibang pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang marahas na himig at ang magkakaugnay na larawang pang-istruktura, habang inilalahad sa mga talababa ang tunay na leksikal at sintaktikong kalabuan.
