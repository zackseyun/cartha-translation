  terminology: Ang “sasalakayin,” “isang lalaki,” at “gigibain” ay angkop sa modernong Filipino Tagalog at sa matayog ngunit malinaw na rehistro ng Awit. Sa talababa, “papaslangin” ang mas tiyak na katumbas ng leksikal na alternatibong ‘murder’ kaysa sa mas malawak na “papatayin.”
