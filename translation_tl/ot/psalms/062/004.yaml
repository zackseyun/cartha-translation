  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: tl
  text: Ang tanging balak nila ay ibagsak siya mula sa kanyang mataas na kalagayan[a]; nalulugod sila sa kasinungalingan. Sa kanilang bibig ay nagpapala sila, ngunit sa kanilang kalooban ay sumusumpa[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kanyang karangalan,” “mula sa kanyang kataasan,” o “mula sa kanyang mataas na katayuan.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal na Hebreo, “sa kanyang bibig ay nagpapala sila”; malamang na kolektibo ang diwa: sa panlabas ay nagpapala sila, ngunit sa kanilang kalooban ay sumusumpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ang tanging
  rationale: 'Ipinahahayag ang mahigpit na pagtatakda sa layunin ng mga kalaban: ito lamang ang kanilang balak.'
- source_word: מִשְּׂאֵתוֹ
  choice: mula sa kanyang mataas na kalagayan
  rationale: Saklaw ng שְׂאֵת ang kataasan, karangalan, o mataas na katayuan; pinananatili ng parirala ang larawang pagpapabagsak nang hindi nililimitahan sa isang tiyak na posisyong panlipunan.
- source_word: יָעֲצוּ
  choice: balak nila
  rationale: Ang pandiwa ay tumutukoy sa sinadyang pagpapayo o pagbabalak; ipinahihiwatig ng konteksto ang masamang pakana.
- source_word: לְהַדִּיחַ
  choice: ibagsak siya
  rationale: Ipinapakita ng Hiphil infinitive ang pagpapalayas o pagpapabagsak; ang 'ibagsak' ay angkop sa kasunod ng mataas na kalagayan.
- source_word: יִרְצוּ כָזָב
  choice: nalulugod sila sa kasinungalingan
  rationale: Ipinahahayag ng רצה kasama ng כזב ang pagkagusto o pagkakaroon ng lugod sa pandaraya at kasinungalingan.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: Sa bibig ay nagpapala sila
  rationale: Natural na kolektibong pagbasa ito ayon sa paralelismo, habang ang talababa ay nagpapanatili sa literal na anyong isahan ng Hebreo.
- source_word: וּבְקִרְבָּם
  choice: sa kalooban
  rationale: Tumutukoy ang parirala sa panloob na saloobin, na tahasang sumasalungat sa panlabas na sinasabi ng bibig.
- source_word: יְקַלְלוּ
  choice: sumusumpa
  rationale: Pinananatili ang tuwirang salungatan sa 'nagpapala' nang hindi pinahihina ang diwa ng pagbigkas o pagnanais ng sumpa.
- source_word: סֶלָה
  choice: Selah
  rationale: Isinalin sa pamamagitan ng transliterasyon sapagkat hindi tiyak ang eksaktong liturhikal o musikal na kahulugan nito.
theological_decisions:
- issue: Ang tinutukoy ng hulaping isahan sa מִשְּׂאֵתוֹ at ang layon ng לְהַדִּיחַ
  choice: Isang lalaking tinatangkang ibagsak ng mga kalaban mula sa kanyang mataas o marangal na kalagayan
  alternative: Maaaring gawing mas panlahat ang tinutukoy, o bigyang-diin ang kanyang karangalan sa halip na kalagayan
  rationale: Panlalaking isahan ang hulapi sa Hebreo. Pinananatili ng 'siya' ang personal at isahang tinutukoy nang hindi ito kinikilalang isang partikular na teolohikal na persona.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'mataas na kalagayan' upang mapanatili ang saklaw ng metaporikal at panlipunang kataasan; ang magkatapat na 'nagpapala' at 'sumusumpa' ay pinanatiling payak at matindi.
