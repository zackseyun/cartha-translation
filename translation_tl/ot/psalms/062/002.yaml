  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: tl
  text: 'Siya lamang ang aking bato at aking kaligtasan,

    ang aking matibay na tanggulan;

    hindi ako lubhang mayayanig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi ako gaanong mayayanig.” May salitang Hebreo rito na nagpapahiwatig ng antas (“lubha” o “marami”), kaya hindi ganap na absoluto ang pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: lamang
  rationale: Sa konteksto, ipinapahayag nito na ang Diyos ang tanging pinagmumulan ng katiwasayan; likas sa Tagalog ang hulíng puwesto ng “lamang” kasunod ng panghalip.
- source_word: הוּא
  choice: Siya
  rationale: Tumutukoy ang panghalip na panlalaking isahan sa Diyos at tahasang paksa ito ng sugnay.
- source_word: צוּרִי
  choice: aking malaking bato
  rationale: Pinananatili ang konkretong metapora ng צוּר bilang matatag at mapangalagang malaking bato o batuhan; mas malinaw ito kaysa sa payak na “bato.”
- source_word: וִישׁוּעָתִי
  choice: at aking kaligtasan
  rationale: Saklaw ng “kaligtasan” ang pagliligtas at katiwasayang ipinahihiwatig ng יְשׁוּעָה sa salmo.
- source_word: מִשְׂגַּבִּי
  choice: aking matibay na tanggulan
  rationale: Ipinahahayag ng מִשְׂגָּב ang isang ligtas at mataas na depensibong lugar; natural at malinaw sa modernong Tagalog ang “matibay na tanggulan.”
- source_word: לֹא אֶמּוֹט
  choice: hindi ako mayayanig
  rationale: Pinananatili nito ang metapora ng pagkawala ng katatagan habang natural ang pandiwang panghinaharap sa Tagalog.
- source_word: רַבָּה
  choice: lubhang
  rationale: Ginagamit dito ang salita bilang panuring sa antas ng pagyanig; ipinapakita ng “lubhang” na hindi ganap o absolutong pahayag ang sugnay.
theological_decisions:
- issue: Antas ng katiwasayang ipinahahayag sa huling sugnay
  choice: hindi ako lubhang mayayanig
  alternative: hindi ako mayayanig
  rationale: May panuring na רַבָּה (“lubha” o “gaanong malaki”) sa Hebreo. Dapat itong panatilihin upang hindi gawing absoluto ang pahayag o itugma nang sapilitan sa kaugnay na linyang walang panuring.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang mga konkretong metapora ng bato, tanggulan, at pagyanig, pati ang mahalagang panuring na nagpapalambot sa huling pahayag.
