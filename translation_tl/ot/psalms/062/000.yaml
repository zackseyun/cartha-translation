base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/000.yaml
  text: 'For the choir director: according to Jeduthun[a]. A psalm of David[b].'
translation:
  language: tl
  text: 'Para sa tagapangasiwa ng musika: ayon kay Jedutun[a]. Isang salmo ni David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinggil kay Jedutun” o “para kay Jedutun.” Maaaring tumukoy ang parirala sa isang estilo ng musika, himig, o tagubilin sa pagtatanghal na kaugnay ni Jedutun.
    reason: alternative_reading
  - marker: b
    text: Ang pamagat na “ni David” ay maaaring magpahiwatig na siya ang sumulat, na inialay ito sa kaniya, o na may kaugnayan ito sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para sa tagapangasiwa ng musika
  rationale: Sa mga pamagat ng salmo, tumutukoy ito sa taong nangangasiwa sa pagtatanghal ng musika. Malinaw at likas sa makabagong Filipino ang pariralang ito, at hindi nito nililimitahan ang tungkulin sa pamamahala lamang ng koro.
- source_word: עַל
  choice: ayon kay
  rationale: Maaaring tumukoy ang pang-ukol sa isang himig, estilo, o tagubilin sa pagtatanghal na kaugnay ni Jedutun. Pinananatili ng saling ito ang pagiging malawak ng kahulugan, at nililinaw sa talababa ang iba pang posibilidad.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Pangalan itong isinalin sa baybay na angkop sa Filipino. Maaaring tumukoy sa Levitang musikero o sa isang himig o paraang musikal na kaugnay niya.
- source_word: מִזְמוֹר
  choice: Isang salmo
  rationale: Ang “salmo” ang kinikilalang katawagan sa Filipino para sa uring pampanitikan at musikal na מִזְמוֹר, at angkop ito sa marangal na rehistro ng pamagat.
- source_word: לְדָוִד
  choice: ni David
  rationale: Ito ang pinakanatural na maikling anyo sa Filipino para sa ugnayang Davidiko. Dahil maaaring magpahiwatig ang Hebreong לְ ng pagkatha, pag-aalay, pag-aari, o mas malawak na kaugnayan, inilalahad sa talababa ang saklaw ng kahulugan.
theological_decisions:
- issue: Kahulugan ng לְדָוִד sa pamagat
  choice: ni David
  alternative: para kay David / kaugnay ni David
  rationale: Hindi sapilitang nilulutas ng Hebreo kung tuwirang pagkatha ni David, pag-aalay sa kaniya, o kaugnayan sa kaniya ang tinutukoy. Natural sa Filipino ang “ni David,” habang tahasang pinananatili ng talababa ang tunay na kalabuan ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa isang liturhikal na pamagat. Ginamit ang “tagapangasiwa ng musika” sa halip na mas makitid na “tagapamahala ng koro,” at pinanatili sa mga talababa ang kalabuan ng עַל יְדוּתוּן at לְדָוִד.
