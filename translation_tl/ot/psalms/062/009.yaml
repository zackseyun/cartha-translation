source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: tl
  text: 'Tunay na, ang mga anak ng sangkatauhan ay hininga;

    ang kasinungalingan ang mga anak ng tao[a].

    Sa timbangan ay umaangat sila;

    sama-sama, mas magaan sila kaysa sa isang hininga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa isang pagpapakahulugan, “ang mga taong mababa ang katayuan” at “ang mga taong mataas ang katayuan.” Mas literal sa Hebreo ang “mga anak ng adam/tao” at “mga anak ng ish/tao.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Tunay na
  rationale: Ipinahahayag nito ang mariing paninindigan ng אַךְ sa konteksto nang natural sa modernong Tagalog.
- source_word: הֶבֶל
  choice: hininga lamang
  rationale: Pinananatili nito ang kongkretong larawan ng isang bagay na panandalian at halos walang bigat; inuulit ang “hininga” sa hulihan upang mapanatili ang ugnayang patula.
- source_word: בְּנֵי אָדָם
  choice: mga anak ng sangkatauhan
  rationale: Inilalarawan ng אָדָם ang tao o sangkatauhan. Pinananatili ng parirala ang anyong “mga anak ng” at iniiwasang gawing tiyak na pangalan si Adan ang salitang maaaring pangkalahatan dito.
- source_word: כָּזָב
  choice: kasinungalingan
  rationale: Tuwirang tinutumbasan nito ang pangngalang nangangahulugang kabulaanan o pagiging hindi mapagkakatiwalaan, at pinananatili ang matinding paralelismo sa “hininga.”
- source_word: בְּנֵי אִישׁ
  choice: mga anak ng tao
  rationale: Pinananatili nito ang literal na anyo at ang bahagyang leksikal na pagkakaiba mula sa בְּנֵי אָדָם, nang hindi ipinapasok sa pangunahing teksto ang posibleng pagpapakahulugang panlipunan.
- source_word: בְּמֹאזְנַיִם
  choice: Sa timbangan
  rationale: Natural itong tawag sa kasangkapang panimbang at malinaw na pinananatili ang larawan ng dalawang panig ng timbangan.
- source_word: לַעֲלוֹת
  choice: pumapaitaas sila
  rationale: 'Pinananatili nito ang literal na pag-angat sa timbangan: umaangat ang panig nila sapagkat wala silang bigat.'
- source_word: מֵהֶבֶל
  choice: mas magaan pa sila kaysa hininga
  rationale: Ginagawang malinaw sa Tagalog ang paghahambing na ipinahihiwatig ng מִן sa konteksto at pinananatili ang metapora ng pagtimbang.
- source_word: יָחַד
  choice: kapag pinagsama-sama
  rationale: Ipinakikita nitong ang hatol ay sumasaklaw sa kanilang kabuuan, hindi lamang sa bawat isa nang hiwalay.
theological_decisions:
- issue: Ang magkatambal na בְּנֵי אָדָם at בְּנֵי אִישׁ
  choice: Panatilihin sa pangunahing teksto ang mga anyong “mga anak ng sangkatauhan” at “mga anak ng tao.”
  alternative: “mga taong mababa ang katayuan” at “mga taong mataas ang katayuan”
  rationale: Maaaring tumukoy ang pares sa magkaibang antas ng lipunan, ngunit hindi tahasang sinasabi iyon ng Hebreo. Pinananatili ng salin ang tunay na kalabuan at inilalagay sa talababa ang interpretasyong panlipunan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maigsi at matinding paralelismo ng tulang Hebreo, pati ang larawang umaangat ang walang-bigat na panig ng timbangan.
