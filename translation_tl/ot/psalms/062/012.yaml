id: PSA.62.12
reference: Psalms 62:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/ךָֽ אֲדֹנָ֥/י חָ֑סֶד כִּֽי אַתָּ֨ה תְשַׁלֵּ֖ם לְ/אִ֣ישׁ כְּֽ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: tl
  text: At sa iyo[a], Panginoon, ang tapat na pag-ibig, sapagkat ginagantihan mo ang bawat tao[b] ayon sa kanyang ginawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “At iyo, Panginoon, ang tapat na pag-ibig.” Walang tahasang pandiwa ang sugnay sa Hebreo, at idinidiin ng nauunang “sa iyo” na ang tapat na pag-ibig ay nauukol sa Panginoon.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay panlalaking isahan ngunit ginagamit dito bilang pangkalahatang katawagan sa bawat tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְךָ
  choice: At sa iyo ... ang
  rationale: Nasa unahan ang pariralang Hebreo upang idiin na sa Panginoon nauukol ang kasunod na katangian. Likas sa Tagalog ang sugnay na walang tahasang pandiwang panulad.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang banal na titulong Adonai at dito ay tuwirang pagtawag sa Diyos.
- source_word: חָסֶד
  choice: tapat na pag-ibig
  rationale: Sinasaklaw nito ang pag-ibig, katapatan, at matibay na kabutihang-loob na ipinahihiwatig ng חסד, nang hindi ito nililimitahan sa awa lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag sa marangal at natural na paraang patula.
- source_word: תְשַׁלֵּם
  choice: ginagantihan mo
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay sa isang tao ng nararapat sa kanya, mabuti man o masama; hindi ito nililimitahan sa gantimpalang positibo.
- source_word: לְאִישׁ
  choice: ang bawat tao
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, ginagamit ito rito sa pangkalahatan at pamahagi. Ang “bawat tao” ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: כְּמַעֲשֵׂהוּ
  choice: ayon sa kanyang ginawa
  rationale: Malinaw at likas nitong ipinahahayag na ang pagganti ay katumbas ng ginawa ng bawat isa, habang pinananatili ang pang-isahang anyo.
theological_decisions:
- issue: Ugnayan ng tapat na pag-ibig ng Diyos at ng kanyang makatarungang pagganti
  choice: Panatilihing magkasama ang “tapat na pag-ibig” at ang pagganti sa bawat tao ayon sa kanyang ginawa.
  alternative: Unawain ang חסד bilang awa lamang o ang תְשַׁלֵּם bilang positibong gantimpala lamang.
  rationale: Magkasamang ipinahahayag ng talata ang matatag na pag-ibig at makatarungang pagganti ng Diyos. Hindi dapat alisin ng salin ang tensiyong ito sa pamamagitan ng pagpapakitid sa alinmang salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikling paralelismong patula at ang tuwirang pagtawag sa Panginoon; iniwasan ang mga arkaikong anyo at ang pagpapaliit sa saklaw ng pagganti.
