  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: tl
  text: Sa Diyos lamang tahimik ang aking kaluluwa[a]; mula sa kanya ang aking kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sa Diyos lamang tahimik na naghihintay ang aking kaluluwa,” o “Sa Diyos lamang namamahinga ang aking kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: lamang
  rationale: 'Ipinahahayag nito ang pagbubukod: sa Diyos, at hindi sa iba, nakatuon ang kaluluwa. Ang “lamang” ay likas at maikli sa makabagong Tagalog.'
- source_word: אֶל
  choice: sa
  rationale: Ang pang-ukol ay nagsasaad ng direksiyon o pagkakatuon sa Diyos. Pinananatili ng “sa” ang sadyang maluwag na ugnayan nang hindi ipinipilit kung ito ay paghihintay, pananahimik sa harap, o pamamahinga sa Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa kontekstong ito, tumutukoy ang salita sa Diyos ng Israel.
- source_word: דּוּמִיָּה
  choice: tahimik
  rationale: Ang pangngalan ay tumutukoy sa katahimikan o kapanatagan. Ginawang panaguri ang “tahimik” upang maging natural sa Tagalog habang nananatili ang pangunahing larawan ng Hebreo.
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa sarili, buhay, o panloob na pagkatao. Ang “aking kaluluwa” ay angkop sa patulang rehistro at hindi nililimitahan ang kahulugan sa damdamin lamang.
- source_word: מִמֶּנּוּ
  choice: mula sa kanya
  rationale: Malinaw nitong ipinahahayag ang Diyos bilang pinagmumulan; hindi na kailangang ulitin ang diwa ng pagiging tanging pinagmumulan sapagkat naipahayag na iyon ng “lamang.”
- source_word: יְשׁוּעָתִי
  choice: aking kaligtasan
  rationale: Saklaw ng salita ang pagliligtas o kaligtasan. Ang “aking kaligtasan” ay natural sa salmo at nananatiling bukas sa kongkretong diwa ng pagliligtas mula sa panganib.
theological_decisions:
- issue: Kahulugan ng pariralang דּוּמִיָּה נַפְשִׁי
  choice: Tahimik ang kaluluwa sa Diyos
  alternative: Tahimik na naghihintay ang kaluluwa sa Diyos; o namamahinga ang kaluluwa sa Diyos
  rationale: Maaaring magpahiwatig ang Hebreo ng katahimikan, tahimik na paghihintay, o kapanatagan. Pinananatili sa pangunahing teksto ang larawan ng katahimikan at inilalagay sa talababa ang iba pang posibleng pagbasa upang hindi lutasin nang labis ang tunay na kalabuan.
translation_notes:
  register: Makabago, payak, at marangal na Tagalog na angkop sa panulaan. Pinanatili ang “kaluluwa” at “kaligtasan” dahil nauunawaan ang mga ito ng karaniwang mambabasa at akma sa teolohikal at patulang rehistro ng Salmo.
