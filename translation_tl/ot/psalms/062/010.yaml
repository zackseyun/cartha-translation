base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: tl
  text: 'Huwag kayong magtiwala sa pang-aapi,

    at huwag kayong maglagak ng walang-kabuluhang pag-asa sa pandarambong[a];

    kung dumarami ang kayamanan,

    huwag ninyong ituon dito ang inyong puso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwag kayong maging palalo dahil sa pandarambong” o “huwag kayong magmalaki sa pandarambong.” Mahirap tiyakin ang diwa ng pandiwang Hebreo; maaari itong tumukoy sa pagkilos nang walang kabuluhan o sa pag-asa sa isang bagay na hungkag.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: magtiwala
  rationale: Karaniwang ipinahihiwatig ng בטח ang pagtitiwala o paglalagak ng tiwala; natural at tuwiran ang “magtiwala” sa makabagong Tagalog.
- source_word: בְעֹשֶׁק
  choice: sa pang-aapi
  rationale: Saklaw ng עֹשֶׁק ang mapaniil na pagsasamantala at pangingikil. Pinananatili ng “pang-aapi” ang malawak na diwang etikal nito.
- source_word: בְגָזֵל
  choice: sa pandarambong
  rationale: Ang גָזֵל ay pag-agaw sa pamamagitan ng dahas o ang bagay na inagaw. Ang “pandarambong” ay malinaw na katumbas at kaagapay ng “pang-aapi.”
- source_word: תֶּהְבָּלוּ
  choice: umasa sa walang-kabuluhang
  rationale: Mahirap ang pandiwang mula sa הבל at maaaring tumukoy sa pagkilos nang walang kabuluhan, pagmamalaki, o pag-asa sa hungkag na bagay. Ang parirala ay nababasa nang natural ngunit hindi lubusang ikinukubli ang ideya ng kawalang-kabuluhan.
- source_word: חַיִל
  choice: kayamanan
  rationale: Bagaman maaari itong mangahulugang lakas o mga ari-arian, ang pagdami nito sa konteksto ay pinakamalinaw na tumutukoy sa materyal na kayamanan.
- source_word: כִּי יָנוּב
  choice: kung dumarami
  rationale: Ang נוב ay literal na umusbong o lumago. Kasama ng חַיִל, natural itong tumutukoy sa pagdami ng kayamanan, habang pinananatili ng “kung” ang kondisyunal na puwersa.
- source_word: תָּשִׁיתוּ לֵב
  choice: pag-ukulan ng puso
  rationale: Pinananatili nito ang Hebreong idyoma ng pagtutuon ng puso—pagnanais, pagtitiwala, o pagkakapit—nang hindi ito nililimitahan sa isip lamang.
theological_decisions:
- issue: Diwa ng babala sa gitnang taludtod
  choice: Isinalin bilang babala laban sa pag-asang walang kabuluhan na kaugnay ng pandarambong.
  alternative: 'Maaaring isalin: “huwag kayong maging palalo dahil sa pandarambong” o “huwag kayong magmalaki sa pandarambong.”'
  rationale: Hindi tiyak ang eksaktong puwersa ng תֶּהְבָּלוּ. Pinananatili ng pangunahing salin ang ugnayan nito sa הבל at ang paralelismo sa “magtiwala,” samantalang inilalahad sa talababa ang tunay na mga alternatibo.
- issue: Saklaw ng huling babala
  choice: Ang huling taludtod ay tumutukoy sa kayamanan sa pangkalahatan kapag ito ay dumarami.
  alternative: Maaaring iugnay lamang ito sa kayamanang nakuha sa pang-aapi at pandarambong.
  rationale: Walang tahasang pang-uri ang חַיִל sa huling sugnay. Kaya hindi nililimitahan ng salin ang kayamanan sa bagay na nakuha sa masamang paraan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang “kayo/ninyo” ayon sa mga pandiwang Hebreo. Ang paghahati sa apat na linya ay nagpapalinaw sa tatlong magkakaugnay na babala.
