base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: tl
  text: Siya lamang ang aking bato at aking kaligtasan, ang aking matibay na tanggulan; hindi ako mayayanig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ako matitinag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Siya lamang
  rationale: 'Pinagsasama nito ang panghalip at ang puwersa ng אַךְ bilang pagbibigay-diin at pagtatangi: ang Diyos, at wala nang iba.'
- source_word: צוּרִי
  choice: aking bato
  rationale: Pinananatili ang tuwirang talinghaga ng matatag at mapangalagang bato, na natural at pamilyar din sa wikang biblikal na Filipino.
- source_word: וִישׁוּעָתִי
  choice: aking kaligtasan
  rationale: Saklaw ng “kaligtasan” ang pagliligtas at katiwasayang ipinagkakaloob ng Diyos nang hindi nililimitahan sa isang partikular na panganib.
- source_word: מִשְׂגַּבִּי
  choice: aking matibay na tanggulan
  rationale: Ipinahahayag nito ang mataas at ligtas na lugar ng proteksiyon na tinutukoy ng מִשְׂגָּב. Ang “matibay” ay nagpapalinaw sa seguridad ng larawan.
- source_word: לֹא אֶמּוֹט
  choice: hindi ako mayayanig
  rationale: Natural na modernong Filipino ito para sa Niphal ng מוֹט at pinananatili ang larawan ng katatagang hindi napapauga.
theological_decisions:
- issue: Antas ng pagtitiwala sa huling sugnay
  choice: hindi ako mayayanig
  alternative: hindi ako matitinag
  rationale: Ipinahahayag ng Hebreo ang matatag na pagtitiwala ng salmista dahil ang Diyos ang kanyang kanlungan. Hindi ito pinalalawak tungo sa doktrina ng ganap na kawalan ng anumang paghihirap; nananatili ang talinghaga ng katatagan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkakasunod na talinghaga ng bato, kaligtasan, at tanggulan, gayundin ang maikli at mariing himig ng Hebreo.
