  source_fidelity: 'Tumpak ang pagsasalin sa lahat ng pangunahing elemento ng Hebreo: ang eksklusibong diin ng אַךְ (''Siya lamang''), ang mga metaporang ''aking bato'' at ''aking tanggulan,'' ang ''aking kaligtasan,'' at ang matatag na pagpapahayag na ''hindi ako mayayanig.'' Hindi nito pinalalawak o pinapaliit ang saklaw ng teksto.'
