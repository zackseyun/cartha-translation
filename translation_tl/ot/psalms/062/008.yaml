base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: tl
  text: Magtiwala kayo sa kanya sa lahat ng panahon,[a] kayong bayan; ibuhos ninyo sa harap niya ang inyong mga puso.[b] Ang Diyos ay kanlungan natin. Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bawat panahon” o “palagi”; literal na “sa bawat oras/panahon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ibuhos ang puso” ay larawang Hebreo para sa hayagang pagsasabi sa Diyos ng mga iniisip, nadarama, at ninanais ng isang tao.
    reason: lexical_alternative
  - marker: c
    text: Malamang na terminong panliturhiya o pangmusika ang “Selah,” ngunit hindi tiyak ang eksaktong kahulugan nito.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: Magtiwala kayo sa kanya
  rationale: Ang maramihang pautos ng בטח ay likas na isinasalin bilang “magtiwala kayo,” at ang panlalaking panghalip ay tumutukoy sa Diyos ayon sa konteksto.
- source_word: בְכָל־עֵת
  choice: sa lahat ng panahon
  rationale: Pinananatili nito ang diwang “sa bawat panahon” habang natural at malinaw sa makabagong Filipino.
- source_word: עָם
  choice: kayong bayan
  rationale: Ginagawang malinaw ang tuwirang pagtawag sa sambayanang kausap nang hindi nililimitahan ito sa makapolitikang kahulugan ng “bansa.”
- source_word: שִׁפְכוּ לְפָנָיו לְבַבְכֶם
  choice: ibuhos ninyo sa harap niya ang inyong mga puso
  rationale: Pinananatili ang metapora ng pagbubuhos, ang diwa ng pagiging nasa presensiya ng Diyos, at ang maramihang pagtukoy sa mga taong kinakausap.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: Ang Diyos ay kanlungan natin
  rationale: Ang “kanlungan” ay natural at marangal na katumbas ng isang lugar ng proteksiyon; ipinapahayag ng “natin” ang pakinabang at sama-samang saklaw ng לָנוּ.
- source_word: סֶלָה
  choice: Selah
  rationale: Pinanatili sa transliterasyon sapagkat hindi tiyak ang eksaktong kahulugan at gamit nito.
theological_decisions:
- issue: Sama-samang kausap sa עָם
  choice: Tahasan itong iniharap bilang pagtawag sa “kayong bayan.”
  alternative: Basahin lamang bilang pangkalahatang “mga tao” o bilang makapolitikang “bansa.”
  rationale: Ang puwesto nito kasunod ng pautos ay likas na bokatibo at nagpapanatili sa pangkomunidad na diwa nang walang idinaragdag na mas makitid na etniko o politikal na pakahulugan.
- issue: Kahulugan ng סֶלָה
  choice: Panatilihin itong “Selah.”
  alternative: Isalin bilang “paghinto,” “musikal na pagitan,” o ibang tiyak na panutong pangmusika.
  rationale: Hindi sapat ang ebidensiya upang matiyak ang eksaktong gamit nito; ang transliterasyon ang pinakamalinaw na paraan upang mapanatili ang tunay na kawalang-katiyakan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kayo/ninyo” upang mapanatili ang maramihang pautos at kolektibong kausap; iniwasan ang masyadong arkaikong “O bayan.” Pinanatili ang metaporang “ibuhos ... ang mga puso” at ipinaliwanag ito sa talababa sa halip na palitan ng isang interpretibong paraphrase.
