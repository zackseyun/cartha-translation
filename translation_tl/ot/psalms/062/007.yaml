  text: עַל אֱ֭לֹהִים יִשְׁעִ֣/י וּ/כְבוֹדִ֑/י צוּר עֻזִּ֥/י מַ֝חְסִ֗/י בֵּֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/007.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: tl
  text: Sa Diyos nakasalalay ang aking kaligtasan at karangalan[a]; ang bato ng aking kalakasan, ang aking kanlungan, ay nasa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluwalhatian ko.” Maaari itong tumukoy sa dangal o sa pagpapanumbalik ng karangalan ng salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: nakasalalay sa
  rationale: Ipinahahayag nito na ang kaligtasan at karangalan ng salmista ay nakabatay at umaasa sa Diyos, habang pinananatili ang larawan ng pagsandig na dala ng pang-ukol.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin kapag tumutukoy sa Diyos ng Israel.
- source_word: יִשְׁעִי
  choice: aking kaligtasan
  rationale: Saklaw ng salita ang pagliligtas o kaligtasan; likas at malawak ang “kaligtasan” sa konteksto ng Mga Awit.
- source_word: וּכְבוֹדִי
  choice: at karangalan ko
  rationale: Maaaring mangahulugan ang כָּבוֹד ng kaluwalhatian o karangalan. Sa pagtukoy sa dangal o vindikasyon ng salmista, mas natural sa modernong Tagalog ang “karangalan ko,” nang hindi isinasara ang mas malawak na diwa.
- source_word: צוּר
  choice: ang bato
  rationale: Pinananatili ang karaniwang metapora ng katatagan at proteksiyon.
- source_word: עֻזִּי
  choice: ng aking kalakasan
  rationale: Tuwirang inililipat ang diwa ng lakas o kapangyarihan at hindi nagdaragdag ng mas tiyak na larawang gaya ng “muog.”
- source_word: מַחְסִי
  choice: ang aking kanlungan
  rationale: Malinaw at likas na salin para sa lugar ng pagkupkop at kaligtasan.
- source_word: בֵּאלֹהִים
  choice: ay nasa Diyos
  rationale: Ipinapakita ng ב ang kinaroroonan o saligan ng kanlungan; idinagdag ang “ay” dahil walang tahasang copula sa Hebreo.
theological_decisions:
- issue: Ugnayan ng pambungad na pariralang עַל אֱלֹהִים sa sugnay na walang pandiwa
  choice: Isinalin bilang “Sa Diyos nakasalalay ang aking kaligtasan at karangalan,” na nagpapahayag ng pagdepende sa Diyos.
  alternative: 'Mas pormal: “Nasa Diyos ang aking kaligtasan at karangalan.”'
  rationale: Walang pandiwa ang Hebreo at nananatiling matalinghaga. Nililinaw ng “nakasalalay” ang diwa ng pagdepende nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Saklaw ng כְבוֹדִי
  choice: karangalan ko
  alternative: kaluwalhatian ko
  rationale: Kapuwa posible ang “karangalan” at “kaluwalhatian.” Sa kontekstong tumutukoy sa sariling dangal o vindikasyon ng salmista, mas madaling maunawaan ang “karangalan,” habang itinatala sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Pinanatili ang matulaing metapora ng “bato” at ang pag-uulit sa “Diyos,” habang iniwasan ang labis na pagpapakahulugan.
