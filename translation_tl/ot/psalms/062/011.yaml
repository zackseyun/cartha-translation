  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: tl
  text: 'Isang bagay ang sinabi ng Diyos[a]; dalawang bagay ang narinig ko: na sa Diyos ang lakas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Minsang nagsalita ang Diyos; makalawang ulit ko itong narinig.” Maaaring basahin ang idyomang Hebreo bilang mga pang-abay na “minsan/makalawang ulit” o bilang pormulang pamilang na “isang bagay/dalawang bagay.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: Isang bagay
  rationale: Ang pambabaeng pang-isahang bilang ay literal na “isa.” Kasama ng kasunod na “dalawa,” natural itong unawain bilang panimulang bahagi ng pormulang pamilang, bagaman posible rin ang kahulugang “minsan.”
- source_word: דִּבֶּר
  choice: ang sinabi
  rationale: Ipinahahayag ng ganap na anyo ng pandiwa ang natapos na pagsasalita ng Diyos. Mas natural sa Tagalog ang “sinabi” kaysa sa mas literal ngunit mabigat na “sinalita.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo, isahan ang kahulugan dito at tumutukoy sa Diyos ng Israel.
- source_word: שְׁתַּיִם
  choice: dalawang bagay
  rationale: Kaagapay ng “isa,” pinananatili nito ang pormulang pamilang. Idinagdag ang “bagay” upang maging malinaw at natural sa Tagalog; maaari rin itong basahing “makalawang ulit.”
- source_word: זוּ
  choice: bagay
  rationale: Ang pantukoy na ito ay nakaugnay sa binibilang o sa nilalamang sumusunod. Isinama ito sa natural na pariralang “dalawang bagay” sa halip na isalin nang hiwalay bilang “ito.”
- source_word: שָׁמָעְתִּי
  choice: ang narinig ko
  rationale: Tuwirang ipinahahayag nito ang natapos na pagkarinig ng salmista, na patuloy na mahalaga sa kaniyang pahayag.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala nito ang nilalaman ng narinig: na sa Diyos ang lakas. Posible rin ang panandang nagbibigay-diin o dahilan, ngunit ang “na” ang pinakamalinaw sa konteksto.'
- source_word: עֹז
  choice: lakas
  rationale: Ang salita ay tumutukoy sa lakas o kapangyarihan. Ang “lakas” ay payak, makabago, at tuwirang katumbas nang hindi ipinagpapalit sa ibang salitang Hebreo para sa kapangyarihan.
- source_word: לֵאלֹהִים
  choice: sa Diyos ang
  rationale: Ang pang-ukol ay nagpapahayag ng pag-aari o pagkakaugnay. Ang ayos na “sa Diyos ang lakas” ay natural at mariing Filipino para sa ideyang ang lakas ay nauukol sa Diyos.
theological_decisions:
- issue: Pormulang pamilang na “isa… dalawa”
  choice: “Isang bagay ang sinabi ng Diyos; dalawang bagay ang narinig ko”
  alternative: “Minsang nagsalita ang Diyos; makalawang ulit ko itong narinig”
  rationale: Maaaring unawain ang Hebreo bilang pagbilang ng mga bagay na sinabi at narinig o bilang mga pang-abay na “minsan” at “makalawang ulit.” Pinili sa pangunahing teksto ang pormulang pamilang dahil akma ito sa kayarian at sa nilalamang nagsisimula rito, ngunit pinanatili sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Filipino. Ang ayos na “sa Diyos ang lakas” ay mas natural at mas matalinghaga kaysa sa “ang lakas ay pag-aari ng Diyos,” habang malinaw pa rin ang diwa ng pag-aari o pagkaukol.
