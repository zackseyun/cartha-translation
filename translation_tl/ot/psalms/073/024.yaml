  text: בַּ/עֲצָתְ/ךָ֥ תַנְחֵ֑/נִי וְ֝/אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: tl
  text: Sa pamamagitan ng iyong payo ay ginagabayan mo ako, at pagkatapos ay kukunin mo ako tungo sa kaluwalhatian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at pagkatapos ay tatanggapin mo ako nang may karangalan.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: sa pamamagitan ng iyong payo
  rationale: Ang עֵצָה ay tumutukoy sa payo o panukala, at ang prefixed בַּ ay maaaring magpahayag ng paraan. Likas sa modernong Filipino ang pariralang ito at ipinakikitang ang payo ng Diyos ang paraan ng paggabay.
- source_word: תַנְחֵנִי
  choice: ginagabayan mo ako
  rationale: Ang Hiphil ng נחה ay nangangahulugang umakay o gumabay. Ang 'ginagabayan' ay angkop sa patuloy na patnubay sa pamamagitan ng payo.
- source_word: וְאַחַר
  choice: at pagkatapos
  rationale: Ginagamit dito ang אַחַר sa temporal na diwa at tinutukoy ang susunod sa kasalukuyang paggabay.
- source_word: כָּבוֹד
  choice: kaluwalhatian
  rationale: Maaaring mangahulugan ang כָּבוֹד ng kaluwalhatian o karangalan. Pinananatili ng 'kaluwalhatian' ang mataas at posibleng eskatolohikal na diwa nang hindi ito lubusang nililinaw.
- source_word: תִּקָּחֵנִי
  choice: kukunin mo ako
  rationale: Ang לקח ay nangangahulugang kunin o tanggapin. Ang 'kukunin mo ako' ang mas tuwirang katumbas at hindi ipinapalagay kung saan o sa anong tiyak na paraan nagaganap ang pagkuha.
theological_decisions:
- issue: Kahulugan ng אַחַר כָּבוֹד תִּקָּחֵנִי
  choice: at pagkatapos ay kukunin mo ako tungo sa kaluwalhatian
  alternative: at pagkatapos ay tatanggapin mo ako nang may karangalan
  rationale: 'Siksik at maaaring unawain sa iba’t ibang paraan ang Hebreo: pagkuha tungo sa kaluwalhatian o pagtanggap nang may karangalan. Pinananatili ng pangunahing salin ang posibleng eskatolohikal na pahiwatig, samantalang inilalahad sa talababa ang alternatibong sintaktiko at leksikal na pagbasa.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang 'payo' at 'ginagabayan'; pinanatili ang bahagyang di-karaniwang 'tungo sa kaluwalhatian' upang hindi tahimik na lutasin ang pagiging siksik at malabo ng pariralang Hebreo.
