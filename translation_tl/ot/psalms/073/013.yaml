  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: tl
  text: Tunay ngang walang saysay[a] na pinanatili kong dalisay ang aking puso, at hinugasan ko ang aking mga kamay sa kawalang-sala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang walang kabuluhan” o “para sa wala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “paghuhugas ng mga kamay sa kawalang-sala” ay larawan ng kalinisan at kawalang-sala, at karaniwang may pahiwatig na etikal, hindi lamang pisikal na paghuhugas.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Tunay nga
  rationale: Ginamit bilang mariing panandang diskurso na nagpapahayag ng mapait na kongklusyon ng salmista, hindi bilang makitid na ‘lamang.’
- source_word: רִיק
  choice: walang kabuluhan
  rationale: Ipinapahayag nito ang inaakalang kawalan ng pakinabang o bunga; natural ito sa Filipino at angkop sa konteksto ng panaghoy.
- source_word: זִכִּיתִי
  choice: pagpapanatili kong dalisay
  rationale: Ang pandiwa ay maaaring tumukoy sa paglilinis o pagpapanatiling malinis. Sa puso bilang layon, malinaw at natural ang pariralang ito habang nananatili ang moral na diwa.
- source_word: לְבָבִי
  choice: aking puso
  rationale: Pinananatili ang karaniwang patulang larawan ng puso bilang panloob, moral, at kusang-loob na pagkatao.
- source_word: וָאֶרְחַץ
  choice: at ang paghuhugas ko
  rationale: Pinananatili ang paralelismo ng dalawang kilos at ang kongkretong larawan ng paghuhugas.
- source_word: בְּנִקָּיוֹן
  choice: sa kawalang-sala
  rationale: Ipinahihiwatig ng salita ang kalinisan o kawalang-sala; dito, ang moral na kahulugan ang higit na angkop sa pagkakaugnay ng puso at mga kamay.
- source_word: כַּפָּי
  choice: aking mga kamay
  rationale: Bagaman literal na ‘mga palad,’ ‘mga kamay’ ang natural na katumbas sa idyomatikong larawan ng kawalang-sala.
theological_decisions:
- issue: Moral na kalinisan o ritwal na paglilinis
  choice: Pinanatili ang larawan ng paghuhugas bilang pahiwatig ng moral na kawalang-sala.
  alternative: Unawain ito pangunahin bilang pagtukoy sa ritwal na kalinisan.
  rationale: Ang pagtutumbas ng ‘puso’ at ‘mga kamay’ sa konteksto ng panaghoy ay tumutukoy sa panloob at panlabas na matuwid na pamumuhay. Hindi inalis ang larawang maaaring nagmula sa gawaing ritwal.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang patulang paralelismo ng puso at mga kamay at iniwasan ang labis na teknikal o denominasyonal na pananalita.
