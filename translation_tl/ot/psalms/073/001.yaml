  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: tl
  text: 'Awit ni Asaf.[a]


    Tunay na mabuti ang Diyos sa Israel—

    sa mga dalisay ang puso.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Awit para kay Asaf” o “Awit na kaugnay ni Asaf.”
    reason: Ang לְ sa pamagat ay maaaring magpahiwatig ng pag-akda, pag-uukol, pagmamay-ari, o kaugnayan.
  - marker: b
    text: Maaari ring “sa mga may dalisay na puso.”
    reason: Alternatibong likas na paraan ng pagsasalin sa pariralang לְבָרֵי לֵבָב.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Karaniwang pamagat ito ng isang awiting panrelihiyon sa Mga Awit; natural at malinaw ang “Awit” sa modernong Filipino.
- source_word: לְאָסָף
  choice: ni Asaf
  rationale: Ang לְ sa mga pamagat ng awit ay maaaring tumukoy sa may-akda, pinag-ukulan, o kaugnayan. Ang “ni Asaf” ang pinakamaikli at nakaugaliang salin, habang inilalahad sa talababa ang tunay na lawak ng posibilidad.
- source_word: אַךְ
  choice: Tunay na
  rationale: Dito, mariing pinagtitibay ng salita ang pangunahing pahayag ng awit. Ang “Tunay na” ay natural at marangal, nang hindi ipinapasok ang mas karaniwang kahulugang “lamang,” na hindi angkop sa konteksto.
- source_word: טוֹב
  choice: mabuti
  rationale: Pinananatili ng “mabuti” ang malawak na diwa ng kabutihan ng Diyos, kabilang ang kanyang kagandahang-loob at mabuting pagkilos, nang hindi ito pinakikitid.
- source_word: לְיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ipinahahayag ng לְ ang ugnayan o pakinabang. Ang “mabuti … sa Israel” ay likas na Filipino at nananatiling malapit sa Hebreo.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Isahan ang kahulugan dito at tumutukoy sa Diyos ng Israel.
- source_word: לְבָרֵי לֵבָב
  choice: sa mga dalisay ang puso
  rationale: Ang בָרֵי ay “dalisay/malinis,” at ang לֵבָב ay tumutukoy sa panloob na pagkatao, pag-iisip, at kalooban. Ang “dalisay ang puso” ay likas na pariralang Filipino at pinananatili ang etikal at panloob na diwa.
theological_decisions:
- issue: Ugnayan ng “Israel” at “mga dalisay ang puso”
  choice: Pinanatili ang ikalawang parirala bilang kasunod na paglilinaw o pagtukoy sa Israel, gamit ang gitling.
  alternative: 'Basahin ang mga ito bilang dalawang magkatabing pangkat: ang Israel at, bukod dito, ang mga dalisay ang puso.'
  rationale: Ang magkaparehong pariralang may לְ sa tulang Hebreo ay maaaring magpahiwatig ng muling pagpapahayag o pagtutukoy. Hindi tahasang nilulutas ng salin ang teolohikal na saklaw; pinananatili nito ang dalawang parirala at ang kanilang malapit na ugnayan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang maikling pamagat na “Awit ni Asaf,” ang mariing “Tunay na,” at ang patulang ayos ng mga linya. Iniiwasan ang labis na pormal na “busilak” at ang mas makitid na “mabait.”
