  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: tl
  text: Kaya, pagmamataas ang kanilang kuwintas[a]; binabalot sila ng kasuotan ng karahasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kaya, pinalalamutian sila ng pagmamataas na parang kuwintas; binabalot sila ng kasuotan ng karahasan.”'
