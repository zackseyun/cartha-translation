lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga o kaugnayan sa naunang paglalarawan; natural at malinaw ang “Kaya” sa modernong Tagalog.
- source_word: עֲנָקַתְמוֹ
  choice: kuwintas nila
  rationale: Nagpapakita ang anyo ng larawan ng isang palamuti sa leeg. Pinananatili ng “kuwintas nila” ang maikli at matingkad na metapora ng Hebreo.
- source_word: גַאֲוָה
  choice: pagmamataas
  rationale: Sa konteksto, negatibong kapalaluan ang tinutukoy. Karaniwan at malinaw sa Tagalog ang “pagmamataas.”
- source_word: יַעֲטָף
  choice: binabalot sila
  rationale: Ang pandiwa ay tumutukoy sa pagbalot o pagtakip. Pinananatili ng “binabalot” ang larawan ng kasuotang nakapalibot sa kanila.
- source_word: שִׁית
  choice: parang kasuotan
  rationale: Tumutukoy ito sa kasuotan o pantakip; ginagawang malinaw ng “parang kasuotan” ang metapora nang hindi inaalis ang imahen.
- source_word: חָמָס
  choice: karahasan
  rationale: Ito ang tuwirang katumbas sa konteksto at maaari ring magpahiwatig ng marahas na kawalang-katarungan.
- source_word: לָמוֹ
  choice: sila
  rationale: Tinutukoy ng panghalip ang masasamang taong inilalarawan; hinihingi ng natural na sintaks ng Tagalog ang “sila” bilang layon ng “binabalot.”
