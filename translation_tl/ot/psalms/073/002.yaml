  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: tl
  text: Ngunit ako[a], muntik nang matisod ang mga paa ko; halos nang dumulas ang mga hakbang ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit ako, muntik nang madulas ang mga paa ko; halos nang bumigay ang mga hakbang ko.” Magkapatong ngunit bahagyang magkaiba ang mga larawan ng pagkawala ng katatagan sa magkatugmang mga linya ng tulang Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako naman
  rationale: Ipinahahayag ng pangatnig at hiwalay na panghalip ang pagsalungat sa naunang konteksto at ang pagdiriin sa nagsasalita. Likas sa makabagong Tagalog ang “Ngunit ako naman” at napapanatili nito ang dalawang katangiang iyon.
- source_word: כִּמְעַט
  choice: muntik nang
  rationale: Nagsasaad ito ng pangyayaring napakalapit nang maganap. Ang “muntik nang” ang karaniwang katumbas nito sa Tagalog.
- source_word: נטוי
  choice: matisod
  rationale: Sa konteksto ng mga paa, inilalarawan ng anyong ito ang pag-uga, paglihis, o pagkawala ng katatagan. Ang “matisod” ay malinaw na larawang pisikal at kaagapay ng “madulas” nang hindi ginagawang tahasan ang espirituwal na kahulugan.
- source_word: רַגְלָי
  choice: mga paa ko
  rationale: Pinananatili ang kongkretong larawan ng mga paa, na sa tulang Hebreo ay maaari ring tumukoy sa direksiyon o katatagan ng buhay.
- source_word: כְּאַיִן
  choice: halos
  rationale: Sa idyomang ito, ang diwa ay “halos” o “napakalapit nang mangyari.” Natural itong nagpapahayag ng antas sa ikalawang hati ng taludtod.
- source_word: שָׁפְכָה
  choice: madulas
  rationale: Bagaman “ibuhos” o “matapon” ang pangunahing diwa ng pandiwa, kasama ng “mga hakbang” ay inilalarawan nito ang pagdausdos o pagkawala ng tuntungan. “Madulas” ang pinakalinaw na katumbas sa Tagalog.
- source_word: אֲשֻׁרָי
  choice: mga hakbang ko
  rationale: Tumutukoy ang pangngalan sa mga hakbang o paghakbang. Pinananatili ng salin ang metapora ng landas at takbo ng buhay.
theological_decisions:
- issue: Metaporang tumutukoy sa pagkawala ng katatagan
  choice: Pinanatili ang mga larawang pisikal na “mga paa,” “matisod,” “mga hakbang,” at “madulas,” nang hindi tahasang ipinapaliwanag ang espirituwal o moral na kahulugan.
  alternative: Isalin nang interpretibo bilang “muntik na akong mawalan ng pananampalataya” o “muntik na akong bumagsak sa kasalanan.”
  rationale: Maaaring magpahiwatig ang taludtod ng espirituwal o moral na panganib, ngunit hindi nito tahasang tinutukoy kung ano ang muntik nang pagbagsak. Pinananatili ng metapora ang lawak at tensiyong teolohikal ng Hebreo.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “mga paa ko” at “mga hakbang ko” sa halip na mas pormal na “aking mga paa” upang maging madulas basahin, habang pinananatili ang matalinghagang paralelismo ng tulang Hebreo.
