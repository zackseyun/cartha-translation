  text: וָ/אֱהִ֣י נָ֭גוּעַ כָּל הַ/יּ֑וֹם וְ֝/תוֹכַחְתִּ֗/י לַ/בְּקָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: tl
  text: Sapagkat buong araw akong pinahihirapan[a], at tuwing umaga ay itinutuwid ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinahampas” o “sinasalot.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “at ang aking pagtutuwid/pagsaway ay sa mga umaga”; ang diwa ay paulit-ulit na pagtutuwid o pagdidisiplina tuwing umaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Sapagkat ... akong
  rationale: Ang waw-prefixed na anyo ng היה ay nagpapatuloy sa paliwanag mula sa naunang talata. Likas sa Filipino ang “Sapagkat” upang ihayag ang paliwanag o dahilan, habang pinananatili ng “akong” ang unang panauhan.
- source_word: נָגוּעַ
  choice: pinahihirapan
  rationale: Ipinahihiwatig ng anyong pasibo mula sa נגע ang pagiging hinampas, sinalot, o dumanas ng paghihirap. Malinaw at malawak ang “pinahihirapan” at hindi nito nililimitahan ang karanasan sa pisikal na karamdaman.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Natural na idyomang Filipino ito para sa tagal na sumasaklaw sa buong maghapon at pinananatili ang diin ng Hebreo.
- source_word: וְתוֹכַחְתִּי
  choice: at ... itinutuwid ako
  rationale: Ang pangngalang תּוֹכַחַת na may hulaping unang panauhan ay literal na tumutukoy sa “aking pagtutuwid/pagsaway.” Isinalin itong pandiwa upang maging natural sa Filipino habang pinananatili ang diwa ng paulit-ulit na pagtutuwid o pagdidisiplina.
- source_word: לַבְּקָרִים
  choice: tuwing umaga
  rationale: Ang pangmaramihang “mga umaga” na may pang-ukol ay may distributibo at paulit-ulit na diwa; malinaw itong naipapahayag ng “tuwing umaga.”
theological_decisions:
- issue: Kalikasan ng paghihirap na inilalarawan
  choice: Pangkalahatang paghihirap at pagtutuwid, nang hindi tahasang tinutukoy ang karamdaman, galit na nagpaparusa, o ang gumagawa nito
  alternative: Pisikal na salot, parusang mula sa Diyos, o pasalitang pagsaway lamang
  rationale: Malawak ang saklaw ng mga salitang Hebreo para sa pagiging hinampas o pinahirapan at sa pagtutuwid. Hindi tahasang pinangalanan sa talata ang Diyos bilang gumagawa, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pinahihirapan” bilang malawak na salita at ang “itinatama” ay iniwasan pabor sa “itinutuwid,” na mas akma sa seryosong diwa ng pagdidisiplina nang hindi ipinapalagay kung pisikal o pasalita ito.
