translation:
  language: tl
  text: hanggang sa pumasok ako sa mga banal na dako ng Diyos[a]; saka ko naunawaan ang kahihinatnan nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na dako ng Diyos.” Pangmaramihan ang anyo sa Hebreo, “mga banal na dako,” na maaaring kolektibong tumukoy sa mga banal na nasasakupan ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “ang wakas nila” o “ang pangwakas na hantungan nila.” Tinutukoy ng Hebreo ang kanilang huling kalagayan o pangwakas na kahihinatnan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: hanggang sa
  rationale: Minamarkahan nito ang hangganan ng pagkalito ng salmista at ang sandaling nagbago ang kaniyang pagkaunawa.
- source_word: אָבוֹא
  choice: pumasok ako
  rationale: Bagaman anyong imperpektibo sa Hebreo, tumutukoy ito sa konteksto sa tiyak na sandali ng pagpasok; natural sa Tagalog ang aspektong perpektibo.
- source_word: אֶל
  choice: sa
  rationale: Kasama ng pandiwang “pumasok,” likas sa Tagalog ang “pumasok sa” upang ipahayag ang pagpasok sa banal na lugar.
- source_word: מִקְדְּשֵׁי אֵל
  choice: mga banal na dako ng Diyos
  rationale: Pinananatili ang pangmaramihang anyo ng Hebreo sa malinaw at marangal na Tagalog. Maaaring tumukoy ito nang kolektibo sa mga sagradong nasasakupan o sa kabuuan ng banal na tahanan ng Diyos.
- source_word: אֵל
  choice: Diyos
  rationale: Dito, ang אֵל ay katawagan sa Diyos at pinakanatural na isalin bilang “Diyos.”
- source_word: אָבִינָה
  choice: saka ko naunawaan
  rationale: Ipinahahayag ng ugat na בין ang pagkakaroon ng malinaw na pagkaunawa o pagkilatis; inilalantad ng “saka” ang pagkakasunod ng mga pangyayari na ipinahihiwatig ng Hebreo.
- source_word: לְאַחֲרִיתָם
  choice: ang kahihinatnan nila
  rationale: Ang אַחֲרִית ay tumutukoy sa wakas, huling kalagayan, o pangwakas na resulta. Ang “kahihinatnan” ay natural sa modernong Tagalog at nagpapanatili sa diin sa kanilang pangwakas na hantungan.
theological_decisions:
- issue: Kung isasalin ang מִקְדְּשֵׁי bilang tradisyonal na pang-isahan o ayon sa pangmaramihang anyo ng Hebreo
  choice: mga banal na dako ng Diyos
  alternative: banal na dako ng Diyos
  rationale: Pinananatili sa pangunahing teksto ang tunay na pangmaramihang anyo ng Hebreo sa halip na iayon sa nakaugaliang pang-isahan. Hindi nito ipinipilit ang isang partikular na doktrinal na paliwanag; maaaring kolektibong tumukoy ang parirala sa mga banal na nasasakupan ng Diyos.
- issue: Saklaw ng לְאַחֲרִיתָם
  choice: ang kahihinatnan nila
  alternative: ang wakas nila
  rationale: Ang “kahihinatnan” ay maaaring sumaklaw kapuwa sa kanilang pangwakas na resulta at huling hantungan nang hindi nilulutas nang labis ang sadyang malawak na kahulugan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga banal na dako” upang mapanatili ang Hebreong pangmaramihan, at “kahihinatnan” upang likas na maipahayag ang pangwakas na resulta o hantungan nang hindi nagpapasok ng sektaryong pagpapakahulugan.
