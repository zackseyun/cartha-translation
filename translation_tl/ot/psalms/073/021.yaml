lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag ng mang-aawit.
- source_word: יִתְחַמֵּץ
  choice: naging mapait
  rationale: Pinananatili ang talinghaga ng panloob na pag-asim o pagkapait, sa halip na gawing mas pangkalahatang “nalungkot.”
- source_word: לְבָבִי
  choice: puso ko
  rationale: Ang “puso” ang likas at karaniwang katumbas na nagpapanatili sa Hebreong paglalarawan sa panloob na pagkatao, isip, at damdamin.
- source_word: וְכִלְיוֹתַי
  choice: sa aking mga bato
  rationale: Pinananatili ang kongkretong katawagan sa mga kidney bilang Hebreong larawan ng pinakamalalim na damdamin; nililinaw ang idyoma sa talababa.
- source_word: אֶשְׁתּוֹנָן
  choice: ako’y tinusok
  rationale: Ang bihirang anyo ng pandiwa ay nagpapahayag na ang nagsasalita ay matalim na tinamaan o parang tinusok; malinaw na pinananatili ng salin ang unang panauhan at ang marahas na larawang pangkatawan.
