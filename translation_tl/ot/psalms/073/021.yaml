  text: Sapagkat naging mapait ang puso ko, at tinusok ang mga bato ko[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking kaloob-looban”; sa Hebreo, ang “mga bato” ay maaaring tumukoy sa pinakamalalim na damdamin ng isang tao.
