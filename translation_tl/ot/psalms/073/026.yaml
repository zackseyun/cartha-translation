  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: tl
  text: 'Maaaring manghina ang aking laman at ang aking puso,[a]

    ngunit ang Diyos ang bato[b] ng aking puso at ang aking bahagi magpakailanman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nanghihina ang aking laman at ang aking puso,” o “Nauubos ang aking laman at ang aking puso.” Maaaring tumukoy ang pandiwang Hebreo sa panghihina, pagkaubos, o pagdating sa wakas.
    reason: lexical_alternative
  - marker: b
    text: O, “lakas.” Mas literal sa Hebreo ang “bato”; ang buong parirala ay “bato ng aking puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: maaaring manghina
  rationale: Ang pandiwa ay maaaring tumukoy sa panghihina, pagkaubos, o pagdating sa wakas. Likas sa modernong Tagalog ang “manghina” kapag laman at puso ang paksa; pinananatili ng “maaaring” ang posibleng pangkalahatan o di-tiyak na diwa ng anyong Hebreo.
- source_word: שְׁאֵרִי
  choice: aking laman
  rationale: Sa pagkakatambal nito sa “aking puso,” tumutukoy ito sa pisikal na pagkatao. Pinananatili ng “laman” ang konkretong larawang Hebreo at ang kaibahan ng panlabas at panloob na pagkatao.
- source_word: לְבָבִי
  choice: aking puso
  rationale: Saklaw ng salitang Hebreo ang panloob na pagkatao, pag-iisip, at kalooban, ngunit “puso” ang malinaw at nakaugaliang katumbas. Pinanatili rin ang pag-uulit para sa diin ng tula.
- source_word: צוּר
  choice: bato
  rationale: Literal itong “bato” at talinghaga para sa katatagan at katiwasayan. Hindi ito pinalitan sa pangunahing teksto ng abstraktong “lakas,” upang mapanatili ang larawan ng pinagmulang teksto.
- source_word: חֶלְקִי
  choice: bahagi ko
  rationale: Ipinahahayag nito ang Diyos bilang bahaging inilaan o mana ng mananampalataya. Ang “bahagi ko” ay maikli, tapat sa talinghaga, at angkop sa pananalita ng salmo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Dito ay tuwirang tumutukoy ang salita sa Diyos ng Israel.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Malinaw nitong ipinahahayag ang walang-hanggang pananatili at angkop ito sa marangal na himig ng salmo.
theological_decisions:
- issue: Wika tungkol sa pagkatao sa unang sugnay
  choice: aking laman at ang aking puso
  alternative: aking katawan at aking kalooban
  rationale: Pinananatili ng “laman” at “puso” ang mga larawang Hebreo at hindi nililimitahan ang talata sa makabagong paghahati ng katawan at isip.
- issue: Talinghaga para sa Diyos sa צוּר
  choice: ang Diyos ang bato ng aking puso
  alternative: ang Diyos ang lakas ng aking puso
  rationale: Konkretong “bato” ang nasa Hebreo. Ipinahihiwatig nito ang katatagan, lakas, at katiwasayan nang hindi pinapako ang talinghaga sa isa lamang sa mga kahulugang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “aking puso,” ang konkretong talinghagang “bato,” at ang tradisyonal ngunit malinaw na “bahagi ko.”
