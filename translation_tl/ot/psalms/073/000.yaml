  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: tl
  text: 'Awit ni Asaf.[a]


    Tunay[b] na mabuti ang Diyos sa Israel,

    sa mga may dalisay na puso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Awit para kay Asaf” o “Awit na nauukol kay Asaf.”
    reason: lexical_alternative
  - marker: b
    text: O “Tanging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Awit ni Asaf
  rationale: Ang מִזְמוֹר ay isang awit na karaniwang sinasaliwan ng musika. Ang lamed sa לְאָסָף ay maaaring magpahiwatig ng akda, pag-aari, pag-uukol, o kaugnayan; natural sa Tagalog ang “ni Asaf,” habang inilalahad sa talababa ang isa pang posibilidad.
- source_word: אַךְ
  choice: Tunay
  rationale: Sa kontekstong ito, binibigyang-diin ng אַךְ ang katiyakan ng pahayag. Pinananatili sa talababa ang posibleng eksklusibong diwang “tanging.”
- source_word: טוֹב ... אֱלֹהִים
  choice: mabuti ang Diyos
  rationale: Tuwirang inililipat ang predikasyong Hebreo sa natural na ayos ng Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: לְיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang tahasang tinutukoy ng tekstong Masoretiko at ang gamit ng לְ bilang ukol o pakinabang sa Israel.
- source_word: לְבָרֵי לֵבָב
  choice: sa mga may dalisay na puso
  rationale: Ang בָּרֵי ay nangangahulugang malinis o dalisay, at ang לֵבָב ay puso bilang sentro ng panloob na pagkatao. Ang parirala ay ginawang natural sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng “Israel” at “mga may dalisay na puso”
  choice: Pinanatili ang dalawang magkatabing parirala nang walang idinagdag na pandiwang nagpapakahulugan sa eksaktong relasyon ng mga ito.
  alternative: Isalin bilang “mabuti ang Diyos sa Israel, samakatuwid ay sa mga may dalisay na puso,” o gawing hiwalay na pangkat ang ikalawang parirala.
  rationale: Maaaring appositional o mas espesipikong paglalarawan ang ikalawang parirala, ngunit hindi tahasang nilulutas ng Hebreo ang ugnayan. Iniiwasan ng salin ang pagpasok ng isang tiyak na teolohikal na interpretasyon.
translation_notes:
  register: Gumamit ng natural, marangal, at madaling maunawaang modernong Tagalog. Napanatili ang anyong patula sa paghahati ng mga linya at ang ambiguwidad ng superskripsiyon at ng salitang אַךְ.
