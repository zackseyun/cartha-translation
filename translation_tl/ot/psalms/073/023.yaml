translation:
  language: tl
  text: Ngunit ako ay laging kasama mo; hinawakan mo ang aking kanang kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinakma mo ang aking kanang kamay.” Maaaring bigyang-diin ng pandiwang Hebreo kapwa ang pagdakma at ang nagbubungang patuloy na paghawak o pag-alalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ipinahahayag ng pang-ugnay at panghalip ang pagsalungat sa naunang kalituhan ng salmista at sa paglalarawan sa masasama. Likas at malinaw sa Filipino ang “Ngunit ako.”
- source_word: תָמִיד
  choice: laging
  rationale: Ipinahahayag nito ang patuloy na kalagayan. Ang “laging” ay natural sa modernong Filipino at angkop sa payak ngunit marangal na himig ng salmo.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Tuwirang ipinahahayag ng parirala ang pagiging kapiling o kasama. Pinananatili ng “kasama mo” ang payak na kahulugan nang hindi dinaragdagan ng interpretasyon.
- source_word: אָחַזְתָּ
  choice: hinawakan mo
  rationale: Ang pandiwa ay maaaring tumukoy sa pagdakma o paghawak. Sa konteksto, ang “hinawakan mo” ay natural na naghahatid ng kilos na may patuloy na bisa at maaaring magpahiwatig ng pag-alalay nang hindi ito tahasang idinaragdag.
- source_word: בְּיַד יְמִינִי
  choice: ang aking kanang kamay
  rationale: Sa konstruksyong kasama ng אָחַז, ang kamay ang bagay na hinawakan. Ang “aking kanang kamay” ay idiomatiko at pinananatili ang kongkretong larawan ng Hebreo.
theological_decisions:
- issue: Aspekto at diwa ng pag-alalay ng Diyos sa pandiwang perpekto
  choice: hinawakan mo ang aking kanang kamay
  alternative: hinahawakan mo ang aking kanang kamay; dinakma mo ang aking kanang kamay
  rationale: Maaaring ilarawan ng Hebreong perpekto ang isang naganap na kilos na may nananatiling kabuluhan. Pinananatili ng “hinawakan mo” ang aspektong naganap nang hindi inaalis ang kontekstuwal na pahiwatig ng patuloy na presensya at pag-alalay; ipinapaliwanag sa talababa ang leksikal na saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “laging kasama mo” sa halip na mas pormal na “palaging nasa iyong piling,” at pinanatili ang konkretong larawang “kanang kamay.”
