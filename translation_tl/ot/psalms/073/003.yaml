lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag ng salmista at pinananatili ang ugnayang sanhi.
- source_word: קִנֵּאתִי
  choice: nainggit ako
  rationale: Likas na salin sa modernong Tagalog para sa panloob na pagnanasang magkaroon ng kalagayan ng iba; iniiwasan ang maaaring ibang diwa ng “nagselos.”
- source_word: בַּהוֹלְלִים
  choice: sa mga hambog
  rationale: Ipinahahayag ang mapagmalaki at palalong asal ng tinutukoy, hindi lamang kakulangan sa karunungan.
- source_word: שְׁלוֹם
  choice: kapanatagan
  rationale: Pinananatili ang pangunahing diwa ng kapayapaan at kaginhawahan, habang ang konteksto ay nagpapahiwatig ng mabuting kalagayan ng masasama.
- source_word: רְשָׁעִים
  choice: ng masasama
  rationale: Karaniwan at malinaw na katawagan sa moral na kategoryang ipinahahayag ng salitang Hebreo sa panitikang pangkarunungan at sa Mga Awit.
- source_word: אֶרְאֶה
  choice: nang makita ko
  rationale: Natural na ipinakikita sa Tagalog ang pangyayaring naging dahilan o pagkakataon ng pagkainggit, alinsunod sa ugnayan nito sa naunang pandiwa.
