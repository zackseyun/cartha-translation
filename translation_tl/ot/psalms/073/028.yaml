  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: tl
  text: Ngunit para sa akin, mabuti ang pagiging malapit sa Diyos[a]; ginawa kong kanlungan ang Panginoong Yahweh, upang maipahayag ko ang lahat ng iyong mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mabuti para sa akin ang paglapit sa Diyos.” Ang pangngalang Hebreo ay maaaring tumukoy sa panrelasyong pagiging malapit sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit para sa akin
  rationale: Ipinahahayag ng pangatnig at ng tahasang panghalip ang mariing paghahambing sa sinapit ng masasama sa naunang konteksto.
- source_word: קִרֲבַת אֱלֹהִים
  choice: ang pagiging malapit sa Diyos
  rationale: Pinananatili nito ang diwang panrelasyon ng pangngalang קִרְבָה at likas itong nauunawaan sa modernong Tagalog, nang hindi lubusang nilulutas kung ang diin ay nasa paglapit sa Diyos o sa pagiging malapit niya.
- source_word: לִי טוֹב
  choice: mabuti ... para sa akin
  rationale: Likas na ipinahahayag sa Tagalog ang personal na pakinabang o kabutihang tinutukoy ng parirala.
- source_word: שַׁתִּי
  choice: ginawa kong
  rationale: Sa idyomang may kasunod na 'kanlungan,' malinaw nitong ipinapakita ang sinadyang pagtitiwala ng salmista.
- source_word: בַּאדֹנָי יְהוִה
  choice: ang Panginoong Yahweh
  rationale: Isinasalin ang אֲדֹנָי bilang titulong 'Panginoon' at pinananatili ang personal na pangalang tipan na יהוה bilang 'Yahweh,' habang iniiwasan ang di-likas na pag-uulit ng 'Panginoon.'
- source_word: מַחְסִי
  choice: kanlungan
  rationale: Ang 'kanlungan' ay karaniwan, marangal, at tumpak na katumbas ng isang ligtas na dakong tinatakbuhan.
- source_word: לְסַפֵּר
  choice: upang maipahayag ko
  rationale: Ipinakikita ng 'upang' ang layunin ng infinitive na may ל, at ipinahahayag ng pandiwa ang pagsasalaysay o pagpapakilala sa mga ginawa ng Diyos.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: ang lahat ng iyong mga gawa
  rationale: Direktang pinananatili ang saklaw ng כָּל at ang malawak na kahulugan ng מְלָאכָה bilang mga gawa ng Diyos.
theological_decisions:
- issue: Ang pagtukoy sa banal na pangalan sa אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Pinananatili ng salin ang pagkakaiba ng titulong אֲדֹנָי at ng banal na pangalang יהוה, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- issue: Ang ugnayang ipinahahayag ng קִרֲבַת אֱלֹהִים
  choice: pagiging malapit sa Diyos
  alternative: paglapit sa Diyos; pagkalapit ng Diyos
  rationale: Ang piniling anyo ay likas sa Tagalog at pinananatili ang panrelasyong tensiyon ng Hebreo. Inilalagay sa talababa ang mas tahasang pagbasa na nakatuon sa paglapit ng tao sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kanlungan' bilang pamilyar na wikang pansalmo at ang 'maipahayag' upang ipakita ang pampublikong pagsasalaysay ng mga gawa ng Diyos.
