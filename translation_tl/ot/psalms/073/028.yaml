  source_fidelity: 'Tapat ang salin sa Hebreo: naipapakita ang mariing paghahambing sa “Ngunit para sa akin,” ang pakinabang ng pagiging malapit sa Diyos, ang sinadyang paglalagak ng kanlungan sa Panginoong Yahweh, at ang layuning ipahayag ang lahat ng gawa ng Diyos. Nananatili rin ang panghalip na “iyong” sa huling sugnay, alinsunod sa direktang pagtukoy sa Diyos sa Hebreo.'
