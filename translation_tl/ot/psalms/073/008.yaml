translation:
  language: tl
  text: Nangungutya sila at nagsasalita nang masama[a]; mula sa kaitaasan ay nagsasalita sila ng pang-aapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nanlalait sila at nagsasalita sila ng kasamaan; nang buong pagmamataas ay nagsasalita sila ng pang-aapi.” Mahirap tiyakin ang kahulugan ng unang pandiwa sa Hebreo, at ang “mula sa kaitaasan” ay maaari ring tumukoy sa palalong paraan ng pagsasalita (“nang buong pagmamataas”) sa halip na sa pinanggagalingang lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: Nangungutya sila
  rationale: Mahirap tiyakin ang kahulugan ng pandiwa rito. Sa konteksto ng palalong pananalita, ang “nangungutya” ay likas sa modernong Tagalog at nagpapahayag ng mapanlait na paghamak nang hindi pinipili ang mas haka-hakang kahulugang “bulok sila.”
- source_word: וִידַבְּרוּ
  choice: at nagsasalita
  rationale: Ipinagpapatuloy ng pang-ugnay at pandiwa ang paglalarawan sa asal ng masasama; natural sa Tagalog na hindi na ulitin agad ang simuno.
- source_word: בְרָע
  choice: nang may masamang hangarin
  rationale: Maaaring tumukoy ang parirala sa masamang paraan o nilalaman ng pagsasalita. Ipinapahayag ng saling ito ang moral na kasamaan at poot nang natural sa Tagalog.
- source_word: עֹשֶׁק
  choice: pang-aapi
  rationale: Karaniwang tumutukoy ang pangngalan sa mapaniil na pagsasamantala. Mas malawak ang “pang-aapi” kaysa “pangingikil” at angkop sa panlipunan at moral na diwa ng salita.
- source_word: מִמָּרוֹם
  choice: mula sa mataas na kalagayan
  rationale: Literal itong “mula sa kaitaasan.” Pinananatili ng salin ang larawang pangkalagayan o pangkatayuan, habang hindi ito ipinakahulugang mula sa langit; maaari rin itong magpahiwatig ng palalong paraan.
- source_word: יְדַבֵּרוּ
  choice: nagsasalita sila
  rationale: Pinanatili ang ikalawang paggamit ng pandiwa upang maipakita ang pag-uulit at paralelismo sa Hebreo.
