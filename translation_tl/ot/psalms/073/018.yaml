  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: tl
  text: Tunay ngang inilalagay mo sila sa madudulas na lugar[a]; ibinabagsak mo sila sa pagkawasak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa madulas na lupa”; literal, “sa makikinis na lugar.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga kagibaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tunay nga
  rationale: Ginagamit dito ang kataga bilang mariing pagpapatunay sa bagong pagkaunawa ng salmista, hindi bilang pan限制 na “lamang.”
- source_word: בַּחֲלָקוֹת
  choice: sa madudulas na lugar
  rationale: Ang literal na diwa ay “sa makikinis na lugar,” ngunit sa konteksto ay inilalarawan nito ang mapanganib at di-matatag na kalagayang hahantong sa pagbagsak.
- source_word: תָּשִׁית לָמוֹ
  choice: inilalagay mo sila
  rationale: Pinananatili nito ang tuwirang pagkilos ng Diyos na ipinahahayag ng pandiwang nasa ikalawang panauhang panlalaki at isahan.
- source_word: הִפַּלְתָּם
  choice: ibinabagsak mo sila
  rationale: Ang causative na anyo ng נפל ay nangangahulugang “pinababagsak” o “ginagawang bumagsak.” Ang “ibinabagsak” ay natural at mariing nagpapahayag ng tuwirang sanhi.
- source_word: לְמַשּׁוּאוֹת
  choice: sa kapahamakan
  rationale: Ipinahihiwatig ng pangngalan ang pagkawasak, pagkaguho, o ganap na kapahamakan. Natural sa Filipino ang “sa kapahamakan” bilang hantungan o bunga ng pagbagsak.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagbagsak ng masasama
  choice: Tuwirang iniuugnay sa Diyos ang paglalagay at pagpapabagsak sa kanila.
  alternative: Isang saling ipinahihiwatig na ang kanilang kalagayan lamang ang sanhi ng pagbagsak.
  rationale: Ang dalawang pandiwa sa Hebreo ay tuwirang nakatuon sa Diyos sa ikalawang panauhang isahan. Pinananatili ng salin ang tahasang banal na pagkilos at ang kaakibat nitong teolohikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Tunay nga” para sa mariing katiyakan, at ang mga pandiwang pangkasalukuyan upang buhay na maipahayag ang pagkaunawa ng salmista. Ang “madudulas na lugar” ay nagpapanatili sa kongkretong larawan ng Hebreo habang malinaw sa karaniwang mambabasa.
