  text: Hindi sila dumaranas ng hirap ng mga mortal[a], at hindi sila sinasalot gaya ng sangkatauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi sila dumaranas ng pagpapagal ng tao, at hindi sila pinahihirapan gaya ng sangkatauhan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲמַל
  choice: dumaranas ng hirap
  rationale: Ang עָמָל ay maaaring tumukoy sa hirap, pagpapagal, o kapighatian. Sa konteksto ng tila maginhawang buhay ng masasama, malinaw at malawak ang “hirap,” habang pinananatili sa talababa ang alternatibong “pagpapagal.”
- source_word: אֱנוֹשׁ
  choice: mga mortal
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa tao na may diin sa kahinaan at pagiging mortal; pinananatili ng “mga mortal” ang diwang ito.
- source_word: אֵינֵמוֹ
  choice: hindi sila dumaranas
  rationale: Ang negatibong eksistensiyal na may hulaping pangmaramihan ay nagsasaad na hindi nila nararanasan o bahagi ang nasabing hirap; natural itong ipinahayag sa Filipino bilang “hindi sila dumaranas.”
- source_word: וְעִם
  choice: na gaya ng
  rationale: Bagaman literal na “kasama ng,” ipinahihiwatig dito ang hindi nila pakikibahagi sa karaniwang dinaranas ng sangkatauhan. Ang “na gaya ng” ay likas sa Filipino at pinananatili ang paghahambing.
- source_word: אָדָם
  choice: ibang tao
  rationale: Dito, ang אָדָם ay kolektibong tumutukoy sa sangkatauhan. Ang “ibang tao” ay natural na nagpapakita na ang tinutukoy na masasama ay tila hindi dumaranas ng salot na karaniwan sa mga tao.
- source_word: יְנֻגָּעוּ
  choice: sinasalot
  rationale: Ang pasibong anyo ng נגע ay nangangahulugang sinasaktan, dinadapuan, o pinahihirapan. Ang “sinasalot” ay angkop sa matinding kapighatiang ipinahihiwatig ng taludtod.
theological_decisions:
- issue: Kung ang עָמָל ay pangunahing hirap o pagpapagal
  choice: hirap
  alternative: pagpapagal
  rationale: Hindi nilulutas nang dogmatiko ang saklaw ng salita; pinili ang mas malawak na “hirap” sa teksto at itinabi ang lehitimong alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mga mortal” upang mapanatili ang diin ng אֱנוֹשׁ sa kahinaan at kamatayan ng tao, at ang “ibang tao” upang natural na maipahayag ang kolektibong אָדָם nang hindi pinapantay ang dalawang salitang Hebreo.
