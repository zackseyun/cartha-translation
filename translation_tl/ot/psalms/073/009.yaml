translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang poetikong paralelismo ng ‘bibig’ at ‘dila,’ gayundin ang pagtutunggali ng ‘langit’ at ‘lupa.’ Ang ‘buong yabang’ ay kontekstuwal na paglilinaw sa kilos ng dila, hindi teolohikal na pagpapakahulugan.
