translation:
  language: tl
  text: 'Itinutuon nila ang kanilang bibig laban sa langit[a],

    at ang kanilang dila ay buong yabang na gumagala sa lupa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Inilalagay nila sa langit ang kanilang bibig.” Literal na “sa” ang pang-ukol sa Hebreo, ngunit ipinahihiwatig ng konteksto ang mapanghamong pananalitang nakatuon laban sa langit.
    reason: lexical_alternative
  - marker: b
    text: O “ang kanilang dila ay lumalakad sa lupa.” Literal na “lumalakad” o “umaalis” ang pandiwa sa Hebreo; ipinahahayag ng “buong yabang na gumagala” ang palalong tono sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: itinutuon
  rationale: Ang pandiwa ay nangangahulugang ‘ilagay’ o ‘itakda.’ Sa pariralang ito, malinaw at natural na ipinapahayag ng ‘itinutuon’ ang pagbaling ng bibig sa isang pinatutungkulan, habang ang salungat na diwa ay nagmumula sa ‘laban sa langit’ at sa konteksto.
- source_word: בַשָּׁמַיִם
  choice: laban sa langit
  rationale: Literal na ‘sa loob/sa langit’ ang pang-ukol, ngunit sa konteksto ay mapanghamong pananalitang nakatuon sa langit. Pinananatili ng ‘laban sa langit’ ang posibleng pakikipagtunggali nang hindi labis na nagpapaliwanag. Bagaman maramihan ang anyong Hebreo, karaniwang kolektibong katawagan sa Filipino ang ‘langit.’
- source_word: פִּיהֶם
  choice: ang kanilang bibig
  rationale: Isahan ang ‘bibig’ sa Hebreo kahit maramihan ang nagmamay-ari. Natural din sa Filipino ang kolektibong ‘kanilang bibig,’ at pinananatili nito ang matalinghagang larawan at paralelismo.
- source_word: וּלְשׁוֹנָם
  choice: at ang kanilang dila
  rationale: Pinananatili ang isahang kolektibong anyo at ang tuwirang paralelismo sa ‘kanilang bibig.’
- source_word: תִּהֲלַךְ
  choice: buong yabang na gumagala
  rationale: Literal na ‘lumalakad’ o ‘pumaparoo’t parito.’ Sa konteksto ng palalo at walang-pigil na pananalita, ipinahahayag ng ‘buong yabang na gumagala’ ang kilos at tono nang hindi ginagawang ibang metapora ang dila.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Ang ‘lupa’ ang natural na katapat ng ‘langit’ at nagpapahiwatig ng malawak na saklaw. Sa Filipino, sapat na ang ‘sa’ kasama ng ‘gumagala’ upang ipahayag ang pagkilos sa iba’t ibang dako.
