  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: tl
  text: Kung sinabi ko, “Magsasalita ako nang ganito,” narito, pinagtaksilan[a] ko sana ang salinlahi ng iyong mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging di-tapat sana ako sa salinlahi ng iyong mga anak.”
    reason: Ipinakikita ang alternatibong diwa ng בגד bilang kawalan ng katapatan sa halip na tahasang pagtataksil.
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Kung sinabi ko
  rationale: Ipinahahayag ang mapagnilay at di-naganap na kundisyon; likas sa Filipino ang payak na anyong “Kung sinabi ko,” habang ang “sana” sa kasunod na sugnay ang naglilinaw sa hipotetikal na diwa.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Magsasalita ako nang ganito
  rationale: Ang ספר ay maaaring mangahulugang magsalaysay o maglahad, ngunit kasama ng כְמוֹ tumutukoy rito sa hayagang pagsasalita ayon sa naunang pananaw. Pinananatili ng “nang ganito” ang pabalik na pagtukoy nang hindi labis na nililinaw ang nilalaman.
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili ang bigla at mariing pagkilala na ipinahihiwatig ng Hebreong pantawag-pansin, kahit mas mataas nang bahagya ang rehistro kaysa karaniwang usapan.
- source_word: דּוֹר
  choice: salinlahi
  rationale: Karaniwang dignipikadong katumbas na tumutukoy sa isang henerasyon o pangkat ng bayan.
- source_word: בָּנֶיךָ
  choice: iyong mga anak
  rationale: Bagaman panlalaking maramihan ang anyo, kinakatawan nito sa konteksto ang buong bayang nauukol sa Diyos; ang “mga anak” ay likas at hindi nililimitahan sa mga lalaki.
- source_word: בָגָדְתִּי
  choice: pinagtaksilan ko sana
  rationale: Ipinahahayag ang mapandaya o di-tapat na pagkilos laban sa isang ugnayang pamayanan. Ang “sana” ang naghahatid ng bunga ng di-naganap na kundisyon.
theological_decisions:
- issue: Tinutukoy ng “iyong mga anak”
  choice: Ang Diyos ang kinakausap, at ang “iyong mga anak” ay ang salinlahing kabilang sa kanyang bayan.
  alternative: Mas literal na “iyong mga anak na lalaki.”
  rationale: Ang hulaping ikalawang panauhang panlalaki ay natural na tumutukoy sa Diyos sa konteksto, samantalang ang maramihang “mga anak” ay kolektibong tawag sa kanyang bayan at hindi kailangang unawaing mga lalaki lamang.
- issue: Uri ng pagtataksil
  choice: Ang hayagang pagsasalita ayon sa mapagdudang pananaw ay ilalarawan bilang pagtataksil sa salinlahi ng bayan ng Diyos.
  alternative: “Naging di-tapat sana ako sa salinlahi ng iyong mga anak.”
  rationale: Pinananatili ng “pinagtaksilan” ang matinding relational at communal na puwersa ng בגד nang hindi tinutukoy ang isang partikular na sistemang teolohikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “narito” upang mapanatili ang mariing הִנֵּה; ang natitirang pangungusap ay inayos sa likas na sintaks ng Filipino. Ang “salinlahi” at “iyong” ay angkop sa dignipikadong rehistro ng Awit.
