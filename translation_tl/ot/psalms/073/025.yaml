translation:
  language: tl
  text: Sino pa ang mayroon ako sa langit kundi ikaw? At bukod sa iyo[a], wala akong ninanais sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas literal: “At kasama mo, hindi ako naghangad ng anuman sa lupa.” Eliptiko ang Hebreo; ipinahihiwatig nito na bukod sa Diyos ay wala nang ninanais ang mang-aawit sa lupa.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Sino pa ba ang mayroon ako
  rationale: 'Ipinapahayag ng tanong ang ugnayang pag-aari o pagkakaroon: “Sino ang mayroon ako?” Ang “pa ba” ay likas na paraan sa Filipino upang ihayag ang retorikal at eksklusibong diin nang hindi binabago ang kahulugan.'
- source_word: בַשָּׁמָיִם
  choice: sa langit
  rationale: Ang anyong maramihan sa Hebreo ay tumutukoy rito sa makalangit na dako; natural sa modernong Filipino ang “sa langit.”
- source_word: וְעִמְּךָ
  choice: At bukod sa iyo
  rationale: Literal itong “at kasama mo,” ngunit sa paralelismong patula ay nagpapahiwatig ng eksklusibong paghahangad. Inilalantad sa salin ang kahulugang iyon, habang itinatala sa talababa ang literal at malabong ayos.
- source_word: לֹא חָפַצְתִּי
  choice: wala akong ninanais
  rationale: Ang negasyon at pandiwa ay natural na naipapahayag sa Filipino bilang “wala akong ninanais.” Ang aspektong di-ganap ay angkop sa isang nagpapatuloy at matatag na saloobin.
- source_word: בָאָרֶץ
  choice: sa lupa
  rationale: Tumutukoy ito sa makalupang dako bilang katapat ng “sa langit”; malinaw at natural ang “sa lupa.”
theological_decisions:
- issue: Kahulugan ng ikalawang hati ng taludtod
  choice: Wala siyang ninanais sa lupa bukod sa Diyos
  alternative: Kasama ang Diyos, wala siyang ninanais sa lupa
  rationale: Maikli at eliptiko ang Hebreo. Ipinahahayag ng pangunahing salin ang eksklusibong pagpapahalaga sa Diyos na ipinahihiwatig ng paralelismo, ngunit pinananatili sa talababa ang mas literal na pagbasa upang hindi maitago ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong retorikal at ang pagtutulad ng langit at lupa; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
