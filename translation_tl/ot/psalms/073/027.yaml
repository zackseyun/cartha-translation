base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: tl
  text: 'Sapagkat narito, ang mga malayo sa iyo ay mapapahamak;

    nililipol mo ang lahat ng nagtataksil sa iyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang lahat ng nagpapatutot palayo sa iyo,” isang metaporang Hebreo para sa espirituwal o tipanang pagtataksil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang paliwanag o sanhi na inihaharap ng talata kaugnay ng naunang pahayag.
- source_word: הִנֵּה
  choice: narito
  rationale: Isang likas ngunit maringal na panawag-pansin sa modernong Filipino, na nagpapanatili sa diin ng Hebreo.
- source_word: רְחֵקֶיךָ
  choice: ang mga malayo sa iyo
  rationale: Ipinapahayag ang mga taong ang katangian ay pagiging malayo sa Diyos, kapuwa sa relasyonal at espirituwal na diwa.
- source_word: יֹאבֵדוּ
  choice: ay mapapahamak
  rationale: Ang אבד ay tumutukoy sa pagkapahamak o pagdating sa ganap na kapinsalaan; natural at mabigat ang salitang ito sa Filipino.
- source_word: הִצְמַתָּה
  choice: nililipol mo
  rationale: Ang Hiphil ng צמת ay nangangahulugang wakasan o lipulin. Ang pangkasalukuyang anyo ay angkop sa tiyak at pangkalahatang pahayag ng patulang paralelismo, bagaman ganap ang anyong Hebreo.
- source_word: כָּל
  choice: ang lahat ng
  rationale: Pinananatili ang komprehensibong saklaw ng Hebreo.
- source_word: זוֹנֶה
  choice: nagtataksil
  rationale: Sa konteksto, metaporikal ang salita para sa espirituwal o tipanang pagtataksil, hindi pangunahing tumutukoy sa literal na prostitusyon.
- source_word: מִמֶּךָּ
  choice: sa iyo
  rationale: Kasama ng זנה, tinutukoy nito ang Diyos bilang siyang pinagtataksilan; ito ang natural na pagpapahayag sa Filipino.
theological_decisions:
- issue: Metaporikal na diwa ng זנה kaugnay ng Diyos
  choice: nagtataksil sa iyo
  alternative: nagpapatutot palayo sa iyo
  rationale: Ang agarang konteksto ay tungkol sa paglayo at paglapit sa Diyos. Kaya ang pangunahing diwa ay espirituwal o tipanang kataksilan, habang pinananatili sa talababa ang tahasang metapora ng Hebreo.
- issue: Panahon/aspekto ng הִצְמַתָּה
  choice: nililipol mo
  alternative: nilipol mo
  rationale: Bagaman perfect ang anyong Hebreo, maaari itong magpahayag ng tiyak o tiyak-na-tiyak na pagkilos sa tulang Hebreo. Kaayon ng paralelismong may “mapapahamak,” ipinahahayag ng “nililipol mo” ang palagian at tiyak na paghatol nang hindi iginigiit na nakaraan lamang ito.
translation_notes:
  register: Modernong Filipino na maringal ngunit madaling maunawaan. Ginamit ang “narito” upang mapanatili ang solemneng panawag-pansin, at “nagtataksil” upang malinaw na maipahayag ang metaporikal na kataksilan nang hindi binubura ang mas tahasang larawan, na inilagay sa talababa.
