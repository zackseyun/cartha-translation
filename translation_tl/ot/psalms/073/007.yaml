translation:
  language: tl
  text: Nakaumbok ang kanilang mga mata dahil sa katabaan[a]; umaapaw ang mga iniisip ng kanilang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nakausli ang kanilang mga mata dahil sa taba; lumalampas sa hangganan ang mga iniisip o balak ng kanilang puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: namumugto
  rationale: Literal na ‘lumabas,’ ngunit kaugnay ng mga mata at katabaan ay naglalarawan ito ng mga matang nakaumbok o namimintog. Ang ‘namumugto’ ay natural na Filipino para sa kapansin-pansing pag-umbok ng mata.
- source_word: מֵחֵלֶב
  choice: sa katabaan
  rationale: Pinananatili ang kongkretong larawan ng taba o katabaan, na maaari ring magpahiwatig ng labis na kasaganaan nang hindi ito nililimitahan sa kayamanan lamang.
- source_word: עֵינֵמוֹ
  choice: ang kanilang mga mata
  rationale: Tuwirang paglilipat ng pangmaramihang pangngalan na may hulaping tumutukoy sa ikatlong panauhang maramihan.
- source_word: עָבְרוּ
  choice: umaapaw
  rationale: Ang batayang diwa ay ‘lumampas’ o ‘tumawid sa hangganan.’ Ipinahahayag ng ‘umaapaw’ ang labis na daming lumalampas sa takdang hangganan at pinananatili ang matalinghagang paralelismo.
- source_word: מַשְׂכִּיּוֹת
  choice: mga guniguni
  rationale: Maaaring tumukoy sa mga larawan, likhang-isip, iniisip, o balak. Ang ‘mga guniguni’ ay nagpapanatili sa malawak at bahagyang malabong diwa ng panloob na mga larawan o kaisipan.
- source_word: לֵבָב
  choice: kanilang puso
  rationale: Pinananatili ang ‘puso’ bilang sentro ng kaisipan at pagnanasa sa wikang Hebreo; ang ‘kanilang’ ay likas na ipinahihiwatig ng konteksto kahit walang hiwalay na hulapi sa salitang ito.
