translation_notes:
  register: Makabagong Filipino na patula ngunit madaling maunawaan. Pinanatili ang pisikal na larawan ng katabaan at ang malawak na kahulugan ng panloob na mga guniguni, nang hindi tahasang ginagawang kayamanan, masasamang balak, o idolatriya ang mga ito.
