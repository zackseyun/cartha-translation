translation:
  language: tl
  text: Masdan, ito ang masasama—lagi silang panatag[a]; lumalaki ang kanilang yaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “panatag magpakailanman” o “panatag sa lahat ng panahon.” Ang pariralang Hebreo ay literal na tumutukoy sa pagiging panatag na may kaugnayan sa isang matagal o walang-hanggang panahon; dito ay inilalarawan nito ang waring nagpapatuloy na kasaganaan o katiwasayan.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “nagtamo sila ng yaman” o “dumami ang kanilang kayamanan.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtatamo o sa pagdami ng ari-arian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Masdan
  rationale: Nagbibigay ito ng mariing pagturo at pag-anyaya sa mambabasa na pansinin ang kasunod na buod. Dignified ngunit nauunawaan pa rin sa makabagong Filipino.
- source_word: אֵלֶּה
  choice: ganito ang
  rationale: Sa konteksto, hindi lamang itinuturo ang mga tao kundi binubuod ang kanilang kalagayan. Ang “ganito ang masasama” ay natural na Filipino para sa deiktikong pahayag na “narito/ito ang masasama.”
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Pinananatili ang moral na kategorya ng Hebreo nang hindi nagdaragdag ng sektaryong pakahulugan.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: lagi silang panatag
  rationale: Ang שָׁלֵו ay tumutukoy sa pagiging panatag, tiwasay, o walang ligalig, samantalang ang עוֹלָם ay nagbibigay ng diwang nagpapatuloy. Hindi ipinahihiwatig na literal na walang hanggan ang kanilang kalagayan.
- source_word: הִשְׂגּוּ
  choice: lalo silang yumayaman
  rationale: Ang pandiwa ay maaaring mangahulugang umabot, nagtamo, o lumago. Kasama ng חַיִל at sa konteksto ng kasaganaan, natural na ipinahahayag nito ang patuloy na pagdami ng kayamanan.
- source_word: חָיִל
  choice: yumayaman
  rationale: Bagaman malawak ang saklaw ng salita—lakas, kakayahan, hukbo, o yaman—ang pang-ekonomiyang kahulugan ang pinakaangkop sa reklamo tungkol sa kasaganaan ng masasama.
theological_decisions:
- issue: Kung ang עוֹלָם ay dapat unawaing literal na walang hanggan
  choice: lagi silang panatag
  alternative: panatag magpakailanman
  rationale: Sa konteksto ng salmo, inilalarawan ang tila nagpapatuloy na katiwasayan ng masasama, hindi isang doktrinang nagsasabing walang hanggan ang kanilang kasaganaan.
- issue: Kung ang הִשְׂגּוּ חָיִל ay pagtamo o pagdami ng yaman
  choice: lalo silang yumayaman
  alternative: nagtamo sila ng yaman
  rationale: Parehong posible sa leksikon. Pinili ang diwa ng paglago dahil kaayon ito ng paglalarawan sa patuloy nilang kasaganaan, ngunit inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: 'Makabagong Filipino na may marangal na himig. Ginamit ang “Masdan” upang mapanatili ang mariing הִנֵּה, at ang payak na “panatag” at “yumayaman” upang maging malinaw sa karaniwang mambabasa. Ang taludtod ay nag-iingat sa tensiyon ng salmo: tila tuloy-tuloy ang katiwasayan at pagyaman ng masasama.'
