lexical_decisions:
- source_word: אֵיךְ
  choice: Kay bilis
  rationale: Ginagamit ang אֵיךְ bilang padamdam sa nakakagulat na pagbagsak; kasama ng כְרָגַע, likas na ipinahahayag sa Tagalog ang biglaan nitong katangian.
- source_word: הָיוּ לְשַׁמָּה
  choice: naging lubos na wasak
  rationale: Pinananatili ng “naging” ang resultative na diwa ng הָיוּ, samantalang ang “lubos na wasak” ay malinaw na naghahatid ng pagkawasak na tinutukoy ng שַׁמָּה.
- source_word: כְרָגַע
  choice: Kay bilis
  rationale: Ang idyomatikong parirala ay tumutukoy sa napakaikling panahon; isinama ito sa padamdam upang maging natural at mariin sa Tagalog.
- source_word: סָפוּ
  choice: Bigla silang nagwakas
  rationale: Ipinahahayag ang pagdating nila sa wakas nang hindi tinutukoy nang labis ang paraan; inuulit ng “bigla” ang biglaang pagbabaligtad na nasa unang linya.
- source_word: תַמּוּ
  choice: nilipol sila
  rationale: Ipinakikita ang lubos at pangwakas na pagkapuksa sa ikalawang pandiwang kahanay ng סָפוּ.
- source_word: מִן בַּלָּהוֹת
  choice: ng mga kakila-kilabot na pangyayari
  rationale: Binabasa ang מִן bilang sanhi o mabisang paraan. Ang בַּלָּהוֹת ay mga sindak o kakila-kilabot na bagay; hindi nililimitahan ng salin ang mga ito sa pansariling damdamin lamang.
