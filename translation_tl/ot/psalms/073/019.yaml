    rationale: Ang “Kay bilis” at ang “Bigla” ay kapwa nagdadala ng biglaang diwa na pangunahing nasa כְרָגַע. Mas malinaw na ilagay ang diin sa unang padamdam at panatilihing magkahanay ang dalawang pangwakas na pandiwa.
