    rationale: Hindi nito tuwirang naipahahayag ang leksikal na diwa ng “mga sindak” o “mga lagim,” at maaari nitong ilipat ang diin mula sa mga nakasisindak na kakilabutan tungo sa pangkalahatang masasamang pangyayari.
  - severity: low
    issue: “naging lubos na wasak”
    rationale: Nauunawaan ito, ngunit medyo mabigat at hindi gaanong likas sa Filipino. Ang “naging wasak” ay mas idiomatiko at sapat upang ipahayag ang resultang pagkawasak.
  - severity: low
