  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: tl
  text: At sinasabi nila[a], “Paano nalalaman ng Diyos? May kaalaman ba ang Kataas-taasan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sinabi nila,” kung ang Hebreong perfect ay uunawain bilang payak na nagdaang pangyayari sa halip na paglalarawan ng nakagawiang pananalita.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa Kataas-taasan”; itinatanong ng parirala kung ang Kataas-taasan ay may kaalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: At sinasabi nila
  rationale: Ang Hebreong perfect ay maaaring maglarawan sa tulang diskurso ng paulit-ulit o kasalukuyang pananalita. Ang aspektong “sinasabi” ay angkop sa patuloy na saloobin ng masasama sa konteksto.
- source_word: אֵיכָה
  choice: Paano
  rationale: Tuwirang pinananatili ang interrogatibong “paano” nang hindi nagdaragdag ng modal na diwa gaya ng “paano nga ba maaaring.”
- source_word: יָדַע אֵל
  choice: malalaman ng Diyos
  rationale: Natural na tanong ito sa modernong Tagalog at pinananatili ang ideya ng pag-alam. Maaaring ipahiwatig ng anyong Tagalog ang “paano nalalaman/paano malalaman”; ang huli ay matalas at idiomatiko sa retorikal na paghamon.
- source_word: וְיֵשׁ דֵּעָה
  choice: May kaalaman ba
  rationale: Isinasalin ang existential particle bilang natural na tanong sa Tagalog, at ang דֵּעָה bilang “kaalaman” upang mapanatili ang ugnayan nito sa naunang pandiwang “malalaman.”
- source_word: בְעֶלְיוֹן
  choice: ang Kataas-taasan
  rationale: Ang Hebreong parirala ay literal na may preposisyong ב, ngunit sa natural na Tagalog ang pag-aari ng kaalaman ay malinaw na naipahahayag sa “May kaalaman ba ang Kataas-taasan?” nang hindi binabago ang retorikal na tanong.
theological_decisions:
- issue: Pagbibigay-kahulugan sa titulong עֶלְיוֹן
  choice: ang Kataas-taasan
  alternative: ang Pinakamataas
  rationale: Ang “Kataas-taasan” ay dignified at karaniwang titulong pantukoy sa Diyos na nagpapahayag ng kaniyang sukdulang kataasan, nang hindi ito ginagawang pangalang pantangi o dinaragdagan ng doktrinal na paliwanag.
- issue: Retorikal na pagkuwestiyon sa kaalaman ng Diyos
  choice: Pinanatili bilang dalawang tanong
  alternative: Gawing isang paliwanag na nagsasabing hindi alam ng Diyos
  rationale: Hindi nilulutas ang tensiyong teolohikal; pinananatili ang mapanghamong mga tanong ng mga nagsasalita sa halip na gawing tahasang pahayag ang ipinahihiwatig nila.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Kataas-taasan” bilang malinaw na titulong banal. Iniwasan ang sobrang literal na “may kaalaman sa loob ng Kataas-taasan,” na alanganin sa Tagalog, habang pinananatili ang kahulugan ng Hebreong בְעֶלְיוֹן bilang pag-aari o pagkakaroon ng kaalaman.
