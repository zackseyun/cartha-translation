  text: 'Sapagkat wala silang kirot hanggang sa kanilang kamatayan,


    at malusog ang kanilang katawan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: dinaranas na hirap
  rationale: Ang bihira at pinagtatalunang pangngalan ay maaaring tumukoy sa mga kirot, paghihirap, o gapos; sa konteksto, inilalarawan ng salmista ang wari'y kawalan nila ng paghihirap hanggang kamatayan.
- source_word: לְמוֹתָם
  choice: hanggang sa kanilang kamatayan
  rationale: Pinananatili ang natural na pagbasa ng lamed bilang hangganan ng panahon, gaya ng konteksto at konsultasyong Ingles.
- source_word: בָרִיא
  choice: malusog
  rationale: Ang salita ay maaaring mangahulugang mataba o malusog; dito, ang 'malusog' ay natural sa modernong Tagalog at hindi nagdaragdag ng negatibong pahiwatig.
- source_word: אוּלָם
  choice: kanilang katawan
  rationale: Ang bihirang anyo rito ay karaniwang nauunawaan bilang katawan o pangangatawan; pinili ang malinaw at ordinaryong katumbas.
theological_decisions:
- issue: Ang tila maginhawang kalagayan ng masasama hanggang kamatayan
  choice: Inilahad bilang obserbasyon ng salmista, hindi bilang pangkalahatang doktrina o ganap na katotohanan tungkol sa bawat masama.
  alternative: Ipaliwanag o limitahan sa 'tila' silang walang hirap.
  rationale: Hindi idinagdag sa talata ang salitang 'tila'; pinananatili ang retorikal na tensiyon na lilinawin ng mas malawak na salmo.
translation_notes:
  register: Makabagong Filipino Tagalog na simple, marangal, at madaling bigkasin. Pinanatili ang dalawang magkatimbang na sugnay at iniwasan ang teknikal o makalumang bokabularyo.
