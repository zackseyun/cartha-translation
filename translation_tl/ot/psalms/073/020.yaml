  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: tl
  text: Gaya ng panaginip sa paggising, Panginoon, sa pagbangon mo[a], hahamakin mo ang kanilang anyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman hindi gaanong malamang, “sa lungsod ay hahamakin mo ang kanilang anyo.” Maaaring basahin sa ganitong paraan ang mga katinig sa Hebreo, ngunit higit na sinusuportahan ng konteksto ang “sa pagbangon mo” o “sa paggising mo.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Gaya ng panaginip
  rationale: Ipinapahayag ng prefiks na כ ang paghahambing, at ang חֲלוֹם ay nangangahulugang “panaginip.” Likas sa modernong Tagalog ang “gaya ng panaginip.”
- source_word: מֵהָקִיץ
  choice: na naglalaho pagkagising
  rationale: Ang anyo ay mula sa pandiwang “gumising.” Idinagdag ang “naglalaho” bilang likas na pagpapahayag sa Tagalog ng ipinahihiwatig na ugnayan ng panaginip at paggising, nang hindi ginagawang tahasang kilos sa Hebreo ang pagkawala.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang banal na titulo at tuwirang tawag sa Diyos sa konteksto.
- source_word: בָּעִיר
  choice: kapag bumangon ka
  rationale: Bagaman maaaring basahin ang mga katinig bilang “sa lungsod,” higit na angkop sa paghahambing at paralelismo ang pandiwang pagbasa mula sa עור, “gumising o bumangon.”
- source_word: צַלְמָם
  choice: ang kanilang anyo
  rationale: Ang צֶלֶם ay maaaring mangahulugang larawan, wangis, o anyo. Sa konteksto ng lumilipas at tila di-matatag na kalagayan ng masasama, malinaw at hindi labis na kongkreto ang “anyo.”
- source_word: תִּבְזֶה
  choice: hahamakin mo
  rationale: Tuwirang ipinapahayag nito ang בזה, “hamakin o ituring na walang halaga,” at pinananatili ang aspektong tumutukoy sa gagawin ng Panginoon.
theological_decisions:
- issue: Pagbasa sa בָּעִיר
  choice: 'Pandiwa: “kapag bumangon ka”'
  alternative: 'Pangngalang panlunan: “sa lungsod”'
  rationale: Malakas na sinusuportahan ng agarang larawan ng paggising mula sa panaginip ang pandiwang pagbasa. Pinananatili nito ang lohika ng tula nang hindi nagdaragdag ng tiyak na doktrinang wala sa talata.
- issue: Kahulugan ng צַלְמָם
  choice: “ang kanilang anyo”
  alternative: “ang kanilang larawan” o “ang kanilang anino”
  rationale: Hindi tiyak kung literal na larawan, panlabas na anyo, o tila multong pagpapakita ang tinutukoy. Ang “anyo” ay nagpapanatili ng lawak at tensiyon ng salita sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pagkagising” at “bumangon” upang mapanatili ang magkatuwang na larawan ng paggising, habang inilagay sa talababa ang tunay na alternatibong pagbasa na “sa lungsod.”
