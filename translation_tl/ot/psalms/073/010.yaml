  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: tl
  text: Kaya bumabalik dito ang kanyang bayan[a], at pinipiga para sa kanila ang saganang tubig[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaya ibinabalik niya rito ang kanyang bayan.” Maaaring unawain ang pandiwa bilang di-palipat na “bumabalik” o bilang palipat na “ibinabalik niya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tubig ng kapuspusan.” Malamang na tumutukoy ito sa sagana o napakaraming tubig, ngunit mahirap ang larawan.
    reason: lexical_alternative
  - marker: c
    text: O “at sinisimot nila ang saganang tubig.” Mahirap tukuyin ang tiyak na diwa ng pandiwa at ng pangwakas na panghalip; maaaring tumukoy ang linya sa saganang bahaging ibinibigay para sa kanila, sa halip na tubig na inuubos nila.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na makabagong Tagalog na panandang naghahayag ng bunga o kinahinatnan ng naunang paglalarawan.
- source_word: ישיב
  choice: bumabalik
  rationale: Maaaring maging palipat o di-palipat ang Hiphil ng שוב sa mahirap na sintaks na ito. Ang “bumabalik” ay nagbibigay ng malinaw na di-palipat na pagbasa nang hindi nagdaragdag ng di-binanggit na layon.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Pinananatili ang panghalip na panlalaking isahan at hindi tinutukoy kung kanino tumutukoy ang “kanyang.” Ang “bayan” ay angkop sa kolektibong kahulugan ng עַם.
- source_word: הֲלֹם
  choice: dito
  rationale: Direktang ipinahahayag ang pook na “dito/paparito” sa natural na Tagalog.
- source_word: וּמֵי מָלֵא
  choice: at ... ang saganang tubig
  rationale: Ang literal na larawang “tubig ng kapuspusan” ay hindi likas sa Tagalog; malinaw na inihahatid ng “saganang tubig” ang diwa ng tubig na lubos o napakarami habang pinananatili ang mahirap na larawan.
- source_word: יִמָּצוּ
  choice: sinisimot
  rationale: Inihahatid ng “sinisimot” ang masidhing larawan ng tubig na inuubos o pinatutulo hanggang wala nang matira. Bagaman pasibo ang anyong Hebreo, pinahihintulutan ng sintaks at ng לָמוֹ ang aktibong pagbasa na may “nila”; nakatala sa talababa ang alternatibo.
- source_word: לָמוֹ
  choice: nila
  rationale: 'Binabasa bilang tagaganap kaugnay ng pandiwang pasibo: “sinisimot nila.” Maaari rin itong mangahulugang “para sa kanila,” kaya pinananatili sa talababa ang alternatibong pagbasa.'
theological_decisions:
- issue: Tinutukoy ng “kanyang” sa “kanyang bayan”
  choice: Hindi tinukoy sa pangunahing teksto
  alternative: Maaaring bayan ng masama o bayan ng Diyos
  rationale: Hindi hayagang tinutukoy ng hulaping Hebreo ang antecedent nito, at hindi dapat lutasin ng salin ang teolohikal at sintaktikong kalabuan.
- issue: Kung ang saganang tubig ay inuubos nila o ibinibigay para sa kanila
  choice: Sinisimot nila ang tubig
  alternative: Ang tubig na punô ang sukat ay pinipiga para sa kanila
  rationale: Kapuwa mahirap ang pandiwa at ang pangwakas na panghalip. Pinili sa pangunahing teksto ang isang magkakaugnay at natural na pagbasa, ngunit malinaw na inilalahad ang ibang posibleng pagbasa sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bayan” bilang kolektibong tawag sa people at “sinisimot” upang mapanatili ang matinding makatang larawan. Inilagay ang mga pananda ng talababa sa mismong bahaging nililinaw ng bawat isa.
