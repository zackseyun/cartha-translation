  yaml_path: translation/ot/psalms/073/022.yaml
  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: tl
  text: Noon, ako'y hangal at hindi nakauunawa; para akong hayop[a] sa piling mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga hayop”; malamang na kolektibo o masidhing pananalita na nangangahulugang “parang hayop” o “asal-hayop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Noon, ako'y
  rationale: Iniuugnay ng waw ang pagtatapat sa naunang pagbabalik-tanaw. Ang “Noon” ay likas sa Filipino at ipinahihiwatig ang kalagayan ng salmista nang panahong iyon nang hindi ginagawang tahasang sanhi ang pang-ugnay.
- source_word: בַעַר
  choice: hangal
  rationale: Ipinahihiwatig ng salita ang kawalan ng wastong pag-iisip o pag-unawa, na may talim na higit sa simpleng pagiging walang alam. Ang “hangal” ay malinaw, kasalukuyan, at angkop sa mapagpakumbabang pagtatapat.
- source_word: וְלֹא אֵדָע
  choice: at hindi nakauunawa
  rationale: Karaniwang nangangahulugang “malaman” ang ידע, ngunit sa kontekstong ito ang tinutukoy ay kabiguang maunawaan ang mga gawa at pamamahala ng Diyos. Ang “hindi nakauunawa” ay natural sa Filipino at hindi inuulit lamang ang diwa ng “hangal.”
- source_word: בְּהֵמוֹת
  choice: para akong hayop[a]
  rationale: Bagaman maramihan ang anyong Hebreo, maaari itong maging kolektibo o masidhing paglalarawan sa asal na tulad ng hayop. Ang isahang “hayop” ang natural na simili sa Filipino; itinatala sa talababa ang anyong maramihan.
- source_word: הָיִיתִי
  choice: para ako
  rationale: Ang pandiwang היה ay nagsasaad ng dating kalagayan. Sa natural na similing Filipino, naipapahayag ito ng “para akong,” habang ang “Noon” sa unang sugnay ang nagtatakda ng panahong lumipas.
- source_word: עִמָּךְ
  choice: sa piling mo
  rationale: Ang עִם ay pangunahing nangangahulugang “kasama.” Pinananatili ng “sa piling mo” ang relasyonal at presensiyal na diwa nito at mas likas kaysa sa literal na “kasama mo” pagkatapos ng paghahambing.
theological_decisions:
- issue: Lakas at saklaw ng paglalarawang tulad ng hayop sa harap ng Diyos
  choice: Pag-amin ng salmista na para siyang hayop sa kawalan niya ng pag-unawa
  alternative: Isang pangkalahatang pahayag na likas na hayop o walang katuwiran ang tao
  rationale: Iniuugnay ng talata ang larawan sa dating kalagayan ng salmista at sa kabiguan niyang makaunawa. Hindi nito tuwirang binibigyang-kahulugan ang buong kalikasan ng sangkatauhan.
- issue: Kahulugan ng עִמָּךְ
  choice: “sa piling mo,” na nagpapanatili sa diwang “kasama mo”
  alternative: “sa harap mo,” na nagbibigay-diin sa pagharap sa presensiya o paghatol ng Diyos
  rationale: Ang karaniwang leksikal na diwa ng pang-ukol ay “kasama.” Ang “sa piling mo” ay natural sa Filipino at pinananatili ang tensiyon na nanatili ang salmista sa ugnayan at presensiya ng Diyos kahit wala siyang pagkaunawa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang matalim na pag-amin sa “hangal,” ngunit iniwasan ang masyadong kolokyal o mapanlait na “bobo.” Ang “sa piling mo” ay bahagyang makata ngunit karaniwan pa rin sa wikang panrelihiyon at tapat sa pangunahing diwa ng Hebreo.
