translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “ako’y” bilang katamtamang pormal na anyo; pinanatili ang paghahambing at metapora ng bibig. Inilagay ang talababa sa dulo ng pariralang may salitang may leksikal na kalabuan.
