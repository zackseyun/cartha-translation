  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: tl
  text: At ako’y naging gaya ng isang lalaking hindi nakaririnig, at walang sagot sa kanyang bibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang maisalungat,” “walang maipangatwiran,” o “walang maipagsaway.” Ang salitang Hebreo ay maaaring tumukoy sa mga pagsaway o sa mga tugong sumasalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: At ako'y naging
  rationale: Ang Qal wayyiqtol na unang panauhang isahan ng היה ay nagpapatuloy sa pahayag. Pinananatili ng “naging” ang pag-unlad tungo sa paghahambing, at ng “at” ang payak na pang-ugnay.
- source_word: כְּאִישׁ
  choice: gaya ng isang lalaki
  rationale: Tuwirang inilalarawan ng אִישׁ ang isang lalaking isahan; natural at tumpak dito ang “isang lalaki.”
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: na hindi nakaririnig
  rationale: Pinananatili nito ang payak na diwa ng שׁמע bilang “duminig/makarinig” nang hindi idinaragdag ang kawalan ng kakayahang makarinig.
- source_word: וְאֵין בְּפִיו
  choice: at walang ... ang kanyang bibig
  rationale: Pinananatili ang pang-ugnay, ang eksistensiyal na pagtanggi, at ang metapora ng bibig, sa natural na ayos ng Filipino.
- source_word: תּוֹכָחוֹת
  choice: maisagot
  rationale: Sa konteksto ng pananahimik sa harap ng mga kumakalaban, tumutukoy ang pangmaramihang salita sa mga tugon, pagsalungat, o pangangatwiran. Ang “maisagot” ay likas sa Filipino at hindi nililimitahan ang diwa sa moral na pagsaway.
