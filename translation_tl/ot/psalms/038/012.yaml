base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: tl
  text: Naglalatag ng mga bitag[a] ang mga naglalayong kumitil sa buhay ko[b]; ang mga naghahangad ng kapahamakan ko ay nagsasalita ng mga salitang mapanira[c], at buong araw silang bumubulong[d] ng panlilinlang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naglalagay ng mga silo.” Taglay ng pandiwang Hebreo ang larawan ng pagbibitag o pagsilo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “yaong mga naghahanap ng aking kaluluwa.” Sa kontekstong ito, isang idyoma ito na nangangahulugang hinahangad nilang kitilin ang aking buhay.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagsasalita ng kapahamakan” o “bumibigkas ng mga mapanirang bagay.”
    reason: lexical_alternative
  - marker: d
    text: Ang pandiwa ay maaari ring mangahulugang “bumubulung-bulong” o “nagmumuni.” Dito, tumutukoy ito sa patuloy na mapanlinlang na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: Naglalatag ng mga bitag
  rationale: Ang pandiwang נקשׁ ay naglalarawan ng paglalagay ng silo o bitag. Likas sa modernong Filipino ang pariralang ito at pinananatili nito ang larawan ng lihim na pananambang.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ang mga naghahangad sa buhay ko
  rationale: Sa mapanirang kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay ng tao, hindi lamang sa kaniyang panloob na pagkatao. Ipinahihiwatig ng parirala na nais nilang kitilin ang buhay ng nagsasalita.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: ang mga nagnanais ng kapahamakan ko
  rationale: Ipinapahayag ng דרשׁי רעה ang masidhing paghahangad ng pinsala o kapahamakan ng isang tao. Malinaw at dignificado sa Filipino ang napiling pananalita.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: nagsasalita ng mga bagay na nakapipinsala
  rationale: Ang הַוּוֹת ay maaaring tumukoy sa kapahamakan, pagkawasak, o mga bagay na nagdudulot nito. Hindi tahasang ginawang 'nagbabalak' ang pandiwa upang mapanatili ang mismong larawan ng mapanirang pananalita.
- source_word: וּמִרְמוֹת
  choice: panlilinlang
  rationale: Ang מִרְמוֹת ay tumutukoy sa mga panlilinlang o kataksilan. Ang kolektibong pangngalang 'panlilinlang' ay natural sa Filipino at angkop bilang nilalaman ng kanilang patuloy na pagbulong.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Karaniwan at tuwirang katumbas ito na nagpapahayag ng walang tigil na gawain.
- source_word: יֶהְגּוּ
  choice: bumubulong
  rationale: Ang הגה ay maaaring mangahulugang bumulong, bumulung-bulong, magnilay, o magmuni. Sa konteksto ng panlilinlang ng mga kaaway, inilalarawan ng 'bumubulong' ang mahina at patuloy na mapanlinlang na pananalita nang hindi ipinapasok ang mas interpretatibong 'nagbabalak.'
