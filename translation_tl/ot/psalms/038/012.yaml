translation_notes:
  register: Modernong Filipino na may dignidad at madaling maunawaan. Pinanatili ang paralelismo ng dalawang pangkat ng mga kaaway at ang pag-unlad mula sa pagbibitag tungo sa mapanirang pananalita at patuloy na panlilinlang. Ginamit ang “buhay” sa teksto para sa idyomatikong diwa ng נֶפֶשׁ, habang inilagay sa talababa ang literal na “kaluluwa.”
