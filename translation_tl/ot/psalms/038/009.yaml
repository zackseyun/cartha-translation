  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: tl
  text: Panginoon, nasa harapan mo ang lahat ng aking hangarin[a]; at ang aking pagdaing[b] ay hindi lingid sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pananabik.”
    reason: lexical_alternative
  - marker: b
    text: O “pagbuntong-hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Tuwirang pagtawag ito sa Diyos gamit ang titulong אֲדֹנָי, hindi ang pangalang YHWH. Ang “Panginoon” ang likas at marangal na katumbas sa modernong Tagalog.
- source_word: נֶגְדְּךָ
  choice: nasa harapan mo
  rationale: Ipinahahayag nito na ang hangarin ng salmista ay hayag sa presensiya at paningin ng Diyos; likas sa Tagalog ang “nasa harapan mo.”
- source_word: כָל
  choice: lahat ng
  rationale: 'Pinananatili ang diwa ng kabuuan: walang bahagi ng hangarin ng salmista ang lingid sa Diyos.'
- source_word: תַּאֲוָתִי
  choice: aking hangarin
  rationale: Sa konteksto ng panaghoy, tumutukoy ito sa matinding pagnanais o pananabik, hindi sa mahalay na pagnanasa. Malawak, likas, at marangal ang “hangarin.”
- source_word: וְאַנְחָתִי
  choice: at ang aking pagdaing
  rationale: Tumutukoy ang salita sa pagpapahayag ng matinding hirap, maaaring daing o buntong-hininga. Ang “pagdaing” ay angkop sa himig ng panaghoy.
- source_word: מִמְּךָ
  choice: sa iyo
  rationale: Kasama ng “hindi lingid,” tinutukoy nito ang Diyos bilang siyang hindi mapagtataguan ng daing; idiomatiko sa Tagalog ang “hindi lingid sa iyo.”
- source_word: לֹא נִסְתָּרָה
  choice: ay hindi lingid
  rationale: Pinananatili nito ang pasibong kalagayan na ang daing ay hindi nakatago sa Diyos, sa natural at kasalukuyang anyo sa Tagalog.
theological_decisions:
- issue: Ang banal na pantawag ay אֲדֹנָי, hindi ang pangalang YHWH
  choice: Panginoon
  alternative: ANG PANGINOON
  rationale: Titulong אֲדֹנָי ang nasa tekstong Hebreo. Kaya hindi ginamit ang anyong karaniwang inilalaan sa tetragrammaton o YHWH.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang paralelismo ng dalawang sugnay at ang himig ng personal na panaghoy. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinutukoy ng mga alternatibong salin.
