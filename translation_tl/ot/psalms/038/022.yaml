translation:
  language: tl
  text: Magmadali kang tumulong sa akin, Panginoon, aking kaligtasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּשָׁה
  choice: Magmadali ka
  rationale: Ang pautos na anyo ng חושׁ ay nagpapahayag ng apurahang pakiusap na kumilos agad. Likas at malinaw sa modernong Tagalog ang “Magmadali ka.”
- source_word: לְעֶזְרָתִי
  choice: tulungan ako
  rationale: Literal itong “para/sa aking tulong,” ngunit mas natural sa Tagalog ang pandiwang “tulungan ako,” habang napapanatili ang tuwirang diwa.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang karaniwang banal na titulong אֲדֹנָי. Ang “Panginoon” ang natural at nakaugaliang katumbas sa Tagalog nang hindi labis na itinatampok ang posibleng anyong paari.
- source_word: תְּשׁוּעָתִי
  choice: aking kaligtasan
  rationale: Pinananatili ng “aking kaligtasan” ang pangngalang abstrakto at ang malawak na diwa ng pagliligtas, sa halip na paliitin ito sa isang partikular na uri ng saklolo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na titulong אֲדֹנָי
  choice: Panginoon
  alternative: aking Panginoon
  rationale: Sa talatang ito, ang אֲדֹנָי ay ginagamit bilang karaniwang banal na titulo. Ang “Panginoon” ay sapat at natural; hindi kailangang gawing tahasang paari ang anyo.
- issue: Pagbibigay-kahulugan sa תְּשׁוּעָתִי
  choice: aking kaligtasan
  alternative: aking pagliligtas
  rationale: Ang “aking kaligtasan” ay nagpapanatili sa abstraktong pangngalan at sa teolohikal na lawak ng salitang Hebreo, habang nananatiling bukas ang pagtukoy nito sa Diyos bilang pinagmumulan o sagisag ng kaligtasan.
translation_notes:
  register: Maikli, apurahan, at marangal ang pananalita. Gumamit ng kasalukuyang Tagalog na madaling maunawaan, habang pinananatili ang tuwirang pagtawag sa Diyos at ang matinding pagsusumamo ng Hebreo.
