  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: tl
  text: Sapagkat umaasa ako sa iyo[a], Yahweh[b]; ikaw ang sasagot[c], Panginoon kong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naghihintay nang may pag-asa” o “nag-aantay nang may pag-asa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ang banal na pangalang YHWH; nakaugaliang isalin itong “PANGINOON.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “tutugon.” Walang tahasang layon sa Hebreo; maaaring unawain na “sasagot sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng pahayag. Ang “sapagkat” ay likas sa Filipino at hindi labis na nililinaw kung sanhi lamang o may bahid din ng pagtitiyak.
- source_word: לְךָ
  choice: sa iyo
  rationale: Sa יחל, tinutukoy ng לְ ang hinihintay o inaasahan. Pinananatili ng “sa iyo” ang tuon sa Diyos nang hindi ipinapasok ang mas interpretatibong “sa iyo ako nagtitiwala.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הוֹחָלְתִּי
  choice: ako naghihintay
  rationale: Ang pandiwa ay maaaring mangahulugang maghintay nang may pag-asa o umasa. Ang “naghihintay” ay malinaw at natural, habang inilalahad sa talababa ang saklaw na may kasamang pag-asa.
- source_word: אַתָּה
  choice: ikaw ang
  rationale: Ang hiwalay na panghalip ay may diin. Naipahahayag iyon nang natural sa Filipino sa hulma na “ikaw ang sasagot.”
- source_word: תַעֲנֶה
  choice: sasagot
  rationale: Tuwirang katumbas ito ng “sasagot/tutugon.” Walang tahasang layon sa Hebreo, kaya hindi idinagdag ang “sa akin” sa pangunahing teksto.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Bilang banal na titulo sa tuwirang pagtawag, natural at kinagawiang salin ang “Panginoon.”
- source_word: אֱלֹהָי
  choice: kong Diyos
  rationale: 'Pinananatili ng “kong” ang tahasang unang-panauhang hulapi: “Diyos ko,” sa natural na pariralang “Panginoon kong Diyos.”'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo, kaya pinananatili itong “Yahweh”; iniiwasan ding pag-isahin ito sa kasunod na titulong אֲדֹנָי, na isinaling “Panginoon.”
- issue: Kung tahasang idaragdag ang layon ng “sasagot”
  choice: Hindi idinagdag ang “sa akin”
  alternative: sasagot sa akin
  rationale: Mauunawaan sa konteksto na ang salmista ang sasagutin, ngunit walang tahasang layon ang pandiwang Hebreo. Ang hindi pagdaragdag nito ay nagpapanatili sa anyo at bahagyang pagiging bukas ng pinagmulan.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa panalangin at tula. Ginamit ang tuwirang ayos na “sa iyo ako naghihintay” at ang may-diin na “ikaw ang sasagot.” Hindi ginamit ang “O” sa mga pantawag sapagkat mas natural sa kasalukuyang Filipino ang tuwirang pangalan o titulo na hinihiwalay ng kuwit.
