translation_notes:
  register: Makabago at marangal na Filipino. Ang pag-uulit sa “lupaypay na lupaypay” ay natural na paraan ng pagpapahayag ng עַד מְאֹד at nagpapatindi sa larawan ng ganap na panghihina. Inilagay ang marker pagkatapos ng sugnay na saklaw ng leksikal na alternatibo.
