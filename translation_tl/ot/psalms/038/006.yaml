translation:
  language: tl
  text: Ako’y nakabaluktot at lubhang nakayuko; buong araw akong naglalakad na nagdadalamhati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “madilim ang anyo” o “mapanglaw”; ang salitang Hebreo ay may larawan kapwa ng kadiliman at pagdadalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Baluktot ako
  rationale: Mula sa עוה, na nagpapahiwatig ng pagiging baluktot, pilipit, o tabingi. Pinananatili nito ang pisikal at emosyonal na larawan nang hindi tinutukoy ang sanhi.
- source_word: שַׁחֹתִי עַד מְאֹד
  choice: lupaypay na lupaypay
  rationale: Ang שׁחת ay tumutukoy sa pagyuko o pagiging lubhang mababa, at ang עַד מְאֹד ay matinding pagpapalakas. Ang likas na pariralang Filipino ay naghahatid ng matinding pagkapayuko at panghihina, bagaman hindi nito inuulit nang literal ang larawan ng pagiging mababa.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Natural at kasalukuyang Filipino para sa tuloy-tuloy na tagal sa maghapon.
- source_word: קֹדֵר
  choice: nagdadalamhati
  rationale: Ang participle mula sa קדר ay maaaring magpahiwatig ng pagiging madilim, mapanglaw, o nagdadalamhati. Ang konteksto ng panaghoy ay sumusuporta sa 'nagdadalamhati,' habang inilalahad sa talababa ang tunay na leksikal na lawak.
- source_word: הִלָּכְתִּי
  choice: naglalakad ako
  rationale: Pinananatili ang kongkretong kilos ng הלך. Sa konteksto, inilalarawan nito ang paraan ng pagkilos ng nagsasalita sa buong araw.
