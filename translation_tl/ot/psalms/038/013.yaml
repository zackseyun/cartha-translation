  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: tl
  text: Ngunit ako, gaya ng isang bingi, ay hindi nakaririnig; at gaya ng isang pipi—hindi niya ibinubuka ang kanyang bibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at gaya ng isang pipi, hindi ko ibinubuka ang aking bibig.” Lumilipat ang Hebreo mula sa unang panauhan (“hindi ako nakaririnig”) tungo sa ikatlong panauhan (“hindi niya ibinubuka ang kanyang bibig”), na maaaring nagpapatuloy sa paglalarawan sa taong pipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ipinahihiwatig ng pangatnig at tahasang panghalip ang pagsalungat sa mga nagsasalita laban sa salmista sa konteksto.
- source_word: כְחֵרֵשׁ
  choice: gaya ng isang bingi
  rationale: Pinananatili ang paghahambing at ang larawan ng isang taong hindi nakaririnig.
- source_word: לֹא אֶשְׁמָע
  choice: ay hindi nakaririnig
  rationale: Pinananatili ang literal na pandamang larawan ng pandiwang שׁמע nang hindi ito nililimitahan sa kahulugang 'hindi nakikinig.'
- source_word: וּכְאִלֵּם
  choice: at gaya ng isang pipi
  rationale: Ang 'pipi' ay likas at maikling katumbas sa modernong Filipino para sa isang taong hindi makapagsalita, at kapantay ng larawang 'bingi.'
- source_word: לֹא יִפְתַּח פִּיו
  choice: hindi niya ibinubuka ang kanyang bibig
  rationale: Pinananatili ang ikatlong panauhan ng pandiwa at hulaping paari sa Hebreo, pati ang idyomang 'ibuka ang bibig.'
theological_decisions:
- issue: Paglipat mula unang panauhan tungo sa ikatlong panauhan sa ikalawang hati
  choice: Pinanatili ang 'hindi niya ibinubuka ang kanyang bibig' bilang pagpapatuloy ng pagtutulad sa taong pipi.
  alternative: Hindi ko ibinubuka ang aking bibig.
  rationale: Ang Hebreo ay may pandiwang ikatlong panauhang panlalaki at panghalip na paari na 'kanyang.' Ang pagpapalit nito sa unang panauhan ay nagpapakinis sa paralelismo ngunit inaalis ang tunay na pagbabagong panggramatika ng tekstong pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'nakaririnig' at 'ibinubuka' upang mapanatili ang pandamang larawan at konkretong idyoma ng Hebreo. Ang gitling ay tumutulong ipakita na ang ikatlong-panauhang sugnay ay nagpapaliwanag sa 'isang pipi,' nang hindi pinapawi ang biglang pagbabago ng panauhan.
