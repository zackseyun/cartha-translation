translation:
  language: tl
  text: At ang mga gumaganti ng masama kapalit ng mabuti ay kumakalaban sa akin[a], dahil hinahangad ko ang mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “kinakalaban nila ako kapalit ng paghahangad ko ng mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: At ang mga gumaganti
  rationale: Ang participle ng שלם ay tumutukoy sa mga taong nagbibigay ng kapalit; likas sa Tagalog ang “gumaganti” sa pariralang “gumaganti ng masama sa mabuti” at napapanatili nito ang diwa ng pagganti o pagsusukli.
- source_word: רָעָה
  choice: masama
  rationale: Pinananatili ng “masama” ang moral na bigat at ang tuwirang pagsalungat nito sa “mabuti.”
- source_word: תַּחַת
  choice: sa / dahil
  rationale: Sa unang gamit, natural na ipinahahayag ng “sa” ang pagpapalit sa pariralang “masama sa mabuti.” Sa ikalawa, “dahil” ang malinaw at natural na pagpapahayag ng ugnayang sanhi na ipinahihiwatig ng konteksto, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: טוֹבָה
  choice: mabuti
  rationale: Ang “mabuti” ay maikli at pinananatili ang matinding paghahambing sa “masama” nang hindi nililimitahan ito sa kabaitan o pakinabang lamang.
- source_word: יִשְׂטְנוּנִי
  choice: kumakalaban sa akin
  rationale: Mula sa שטן, ipinahahayag nito ang pagiging kalaban o pagsalungat. Ang “kumakalaban sa akin” ay natural at hindi nagpapasok ng mas makitid na legal na diwang “nag-aakusa” o emosyonal na diwang “napopoot.”
- source_word: רְדֹפִי
  choice: itinataguyod ko
  rationale: Literal na “paghahabol/pagtugis ko,” ngunit sa kontekstong etikal, natural na ipinahahayag ng “itinataguyod ko” ang aktibong pagsunod at pagsisikap para sa mabuti nang magmungkahi ng pisikal na paghabol.
- source_word: טוֹב
  choice: ang mabuti
  rationale: Ang pang-uri ay ginagamit bilang pangngalan; ang “ang mabuti” ay maikli, malinaw, at natural na layon ng “itinataguyod.”
theological_decisions:
- issue: Lakas ng ikalawang sugnay na may תַּחַת
  choice: dahil itinataguyod ko ang mabuti
  alternative: bilang ganti sa pagtataguyod ko sa mabuti
  rationale: 'Maaaring ilarawan ng ikalawang תַּחַת ang pagganti o kapalit, ngunit sa natural na Tagalog ang lohika nito ay malinaw na sanhi: kinakalaban siya dahil itinataguyod niya ang mabuti. Pinananatili sa talababa ang mas literal na ugnayang “bilang ganti.”'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kumakalaban” sa halip na mas pormal na “sumasalansang,” at “itinataguyod” upang natural na maipahayag ang etikal na diwa ng literal na “hinahabol.”
