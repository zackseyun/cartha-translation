base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: tl
  text: Yahweh[a], huwag mo akong sawayin sa iyong galit, ni disiplinahin mo ako sa iyong poot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH,” na karaniwang isinasatitik bilang “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: O Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo; ang “O” ay likas na panawag sa marangal na panalangin.
- source_word: אַל
  choice: huwag
  rationale: Likas na makabagong Tagalog para sa pakiusap na negatibo na sinusundan ng mga pandiwa.
- source_word: בְּקֶצְפְּךָ
  choice: sa iyong galit
  rationale: Inililipat ang pang-ukol at ang diwa ng קצף bilang galit o matinding pagkayamot nang hindi pinatitindi nang higit sa pinagmulan.
- source_word: תוֹכִיחֵנִי
  choice: mo akong sawayin
  rationale: Ang יכח sa Hiphil ay maaaring mangahulugang sawayin, pagsabihan, o ituwid; malinaw at natural dito ang “sawayin.”
- source_word: וּבַחֲמָתְךָ
  choice: ni ... sa iyong poot
  rationale: Ang ו ay idiomatikong isinaling “ni” upang ipagpatuloy ang negatibong pakiusap; ang חֵמָה ay mas matinding galit, kaya “poot.”
- source_word: תְיַסְּרֵנִי
  choice: disiplinahin
  rationale: Ang יסר sa Piel ay tumutukoy sa pagdidisiplina o pagtutuwid; ang “disiplinahin” ay kasalukuyan, malinaw, at nagpapanatili sa mapagtuwid na diwa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, habang itinatala sa talababa ang anyong Hebreo.
- issue: Ugnayan ng pagsaway at pagdidisiplina sa galit ng Diyos
  choice: Pinanatili ang dalawang magkatulad ngunit hindi lubos na magkaparehong pahayag
  alternative: Pagsamahin bilang iisang pangkalahatang pakiusap na huwag parusahan
  rationale: Ang paralelismong Hebreo ay gumagamit ng magkahiwalay na pandiwa at magkahiwalay na salita para sa galit. Hindi nilulutas ng salin kung hinihiling ng makata na huwag siyang ituwid kailanman o na huwag itong gawin sa galit.
translation_notes:
  register: Makabago ngunit marangal na wikang panalangin. Pinanatili ang tuwirang panawag na “O Yahweh,” ang balanseng paralelismo, at ang pagkakaiba ng “galit” at mas matinding “poot.”
