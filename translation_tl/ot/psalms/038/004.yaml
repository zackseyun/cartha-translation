  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: tl
  text: Sapagkat ang aking mga pagkakasala[a] ay umabot nang lampas sa aking ulo; gaya ng mabigat na pasanin, napakabigat nilang dalhin para sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking kasamaan”; ang salitang Hebreo ay maaari ring tumukoy sa pagkakasala o pananagutang bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng panaghoy at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: עֲוֺנֹתַי
  choice: ang aking mga kasamaan
  rationale: Naipahahayag nito ang mga moral na pagkakasala ng nagsasalita habang pinananatili sa talababa ang posibilidad na tumukoy rin ang salita sa pagkakasala o pananagutang bunga ng mga iyon.
- source_word: עָבְרוּ רֹאשִׁי
  choice: ay lumampas na sa aking ulo
  rationale: Pinananatili ang matingkad na larawang Hebreo ng tubig o panganib na umabot at lumampas sa ulo, sa halip na gawing abstraktong 'dumaig sa akin.'
- source_word: כְּמַשָּׂא כָבֵד
  choice: gaya ng mabigat na pasanin
  rationale: Likas sa Filipino ang 'pasanin' para sa isang mabigat na karga at nababagay ito sa matalinghagang bigat ng mga kasamaan.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: napakabigat ng mga ito para sa akin
  rationale: Ipinagpapatuloy nito ang larawan ng bigat at ipinahihiwatig na hindi na ito makaya ng nagsasalita nang hindi nagdaragdag ng pandiwang wala sa teksto.
theological_decisions:
- issue: Saklaw ng kahulugan ng עָוֹן sa konteksto ng pagsisisi
  choice: Mga kasamaan, na pangunahing tumutukoy sa masasamang gawa o moral na pagkakasala ng salmista
  alternative: Aking pagkakasala, na nagbibigay-diin sa kalagayan ng pagiging maysala o sa pananagutang bunga nito
  rationale: Maaaring saklawin ng עָוֹן kapwa ang kasamaan at ang pagkakasalang bunga nito. Pinili sa pangunahing teksto ang gawaing moral, ngunit pinanatili sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang dalawang konkretong larawan ng orihinal—ang pag-apaw sa ulo at ang mabigat na pasanin—nang hindi pinapawi ang ποιetikong tensiyon.
