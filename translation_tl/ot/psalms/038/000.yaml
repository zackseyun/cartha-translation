translation:
  language: tl
  text: Awit ni David[b], bilang pag-alaala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang paggunita” o “upang magpaalaala.” Maikli ang pariralang Hebreo at maaaring tumukoy sa isang paggunita o sa gamit nito sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Ang “ni David” ay maaari ring unawain bilang “akda ni David,” “para kay David,” o “kaugnay ni David.” Ang Hebreong pormula sa pamagat ay maaaring magpahiwatig ng pagkakatha, kaugnayan, o paghahandog.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Awit
  rationale: Ang “awit” ang natural at nakaugaliang katawagan sa Filipino para sa uri ng komposisyong tinutukoy ng מִזְמוֹר; mas malinaw ito sa karaniwang mambabasa kaysa sa transliterasyong “salmo.”
- source_word: לְדָוִד
  choice: ni David
  rationale: Ang karaniwang pormulang “Awit ni David” ay maikli at marangal bilang pamagat. Hindi lubos na tinutukoy ng Hebreong לְ kung ito ay akda ni David, kaugnay niya, o inihandog para sa kaniya, kaya nililinaw sa talababa ang saklaw ng maaaring kahulugan.
- source_word: לְהַזְכִּיר
  choice: upang ipaalaala
  rationale: Ang Hiphil infinitive ng זכר ay nagsasaad dito ng layunin—ang magdulot ng pag-alaala o magsilbing paggunita. Pinananatili ng “upang ipaalaala” ang maikli at di-tiyak na pahayag nang hindi nagdaragdag kung sino ang aalala o kung ano ang aalalahanin.
theological_decisions: []
translation_notes:
  register: Makabago, maikli, at marangal na Filipino para sa isang pamagat ng awit. Ginamit ang “ipaalaala” sa halip na mas teknikal na pananalita, habang ang mga tunay na kalabuan ng dalawang pariralang may לְ ay pinanatili sa mga talababa.
