    text: Sa Hebreo, ang parehong ugat na may diwang “bumaba” ang ginamit para sa mga palaso at sa kamay. Maaari ring isalin na “bumaba sa ibabaw ko” o “bumaba laban sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang panandang sanhi na nagbibigay ng dahilan sa panaghoy.
- source_word: חִצֶּיךָ
  choice: ang iyong mga palaso
  rationale: Tuwirang pinananatili ang maramihang metaporang pandigma.
- source_word: נִחֲתוּ בִי
  choice: bumaon sa akin
  rationale: Ang pandiwa ay literal na may diwang pagbaba, ngunit sa konteksto ng mga palaso, natural na ipinahahayag ng “bumaon” ang pagpasok at pananatili ng palaso nang hindi nawawala ang larawan.
- source_word: וַתִּנְחַת עָלַי
  choice: at bumigat sa akin
  rationale: Ang kaparehong ugat ay naglalarawan ng kamay na bumababa sa salmista. Ang “bumigat” ay natural sa Filipino at pinananatili ang larawan ng puwersa o bigat na nakapatong sa kaniya.
- source_word: יָדֶךָ
  choice: ang iyong kamay
  rationale: Pinananatili ang konkretong antropomorpikong larawan sa halip na palitan ito ng abstraktong interpretasyon gaya ng kapangyarihan o paghatol.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: Panatilihin ang “iyong kamay”
  alternative: iyong kapangyarihan / iyong paghatol
  rationale: Konkretong larawan ang gamit ng Hebreo. Hindi ito pinalitan ng paliwanag na teolohikal upang mapanatili ang talinghaga at tensiyon ng teksto.
- issue: Ugnayan ng dalawang paggamit ng ugat נחת
  choice: 'Isalin ayon sa magkaibang likas na paksa: “bumaon” para sa mga palaso at “bumigat” para sa kamay'
  alternative: Gamitin ang parehong pandiwang “bumaba” sa dalawang sugnay
  rationale: Magkapareho ang ugat at nananatili ang diwa ng pababang kilos, ngunit kailangan ng magkaibang natural na ekspresyon sa Filipino. Ipinapaliwanag sa talababa ang literal na pagkakaugnay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang “palaso” kaysa “pana” sapagkat ang חֵץ ay ang projectile o arrow, hindi ang bow. Ang “bumaon” at “bumigat” ay natural sa karaniwang mambabasa habang pinananatili ng mga talababa ang literal na pababang kilos at ang pag-uulit ng ugat sa Hebreo.
