  text: Sapagkat bumaon sa akin ang iyong mga palaso[a], at bumaba sa akin ang iyong kamay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumaba sa akin,” “tumagos sa akin,” o “tumama sa akin.” Ang pandiwang Hebreo ay literal na may diwang pagbaba; dito, inilalarawan nito ang mga palasong bumaon sa salmista.
    reason: lexical_alternative
