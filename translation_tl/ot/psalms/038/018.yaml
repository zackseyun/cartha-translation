  text: כִּֽי עֲוֺנִ֥/י אַגִּ֑יד אֶ֝דְאַ֗ג מֵֽ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: tl
  text: Sapagkat ipinahahayag ko ang aking kasamaan[a]; nababagabag ako dahil sa aking kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinagtatapat ko ang aking kasamaan.” Ang pandiwang Hebreo ay literal na nangangahulugang “ipinaaalam” o “ipinahahayag”; ipinahihiwatig ng konteksto ng pagsisisi ang pagtatapat.
    reason: lexical_alternative
  - marker: b
    text: O “nag-aalala ako dahil sa aking kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng dahilan o paliwanag kaugnay ng naunang pahayag.
- source_word: עֲוֺנִי
  choice: ang aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa maling gawa o sa pananagutang dulot nito. Pinananatili ng “kasamaan” ang bigat na moral nang hindi nililimitahan ang kahulugan sa damdamin lamang ng pagkakasala.
- source_word: אַגִּיד
  choice: ipinahahayag ko
  rationale: Ang Hiphil ng נגד ay literal na “ipaalam” o “ipahayag.” Pinananatili ng saling ito ang tahasang leksikal na kahulugan at ang posibilidad na sa konteksto ay isa itong pagtatapat.
- source_word: אֶדְאַג
  choice: nababagabag ako
  rationale: Ang דאג ay nagsasaad ng balisa at mabigat na pag-aalala. Natural sa modernong Tagalog ang “nababagabag” at angkop sa matinding paghihirap ng salmista.
- source_word: מֵחַטָּאתִי
  choice: dahil sa aking kasalanan
  rationale: 'Ang מִן ay nagpapahayag dito ng sanhi o dahilan: ang pagkabagabag ay dulot ng kasalanan.'
- source_word: חַטָּאתִי
  choice: aking kasalanan
  rationale: Direkta at malinaw na katumbas ito ng karaniwang salitang Hebreo para sa kasalanan.
theological_decisions:
- issue: Ugnayan ng pagpapahayag ng kasamaan at panloob na pagkabagabag sa isang salmong nagsisisi
  choice: Isinalin ang pandiwa bilang “ipinahahayag” at ipinaliwanag sa talababa na maaari itong unawain bilang “ipinagtatapat” sa konteksto.
  alternative: “Ipinagtatapat ko ang aking kasamaan.”
  rationale: Nananatiling malapit ang pangunahing teksto sa literal na kahulugan ng נגד habang hindi itinatanggi ang diwang nagsisisi ng konteksto. Hindi rin dinaragdagan ang talata ng mas malawak na doktrina tungkol sa pagsisisi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sapagkat” bilang likas na pang-ugnay at ang “nababagabag” upang maipahayag ang malalim na balisang pag-aalala nang hindi nagiging teknikal.
