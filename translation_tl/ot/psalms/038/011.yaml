base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: tl
  text: Ang mga nagmamahal sa akin at mga kaibigan ko ay nakatayo nang hiwalay sa aking karamdaman,[a] at ang malalapit kong kamag-anak ay nakatayo sa malayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking salot,” “aking dagok,” o “aking sugat.” Maaari ring isalin nang mas literal na “nakatayo sa tapat ng aking karamdaman.” Ang salitang Hebreo ay maaaring tumukoy sa pisikal na dagok, salot o karamdamang tulad ng sakit, sugat, o paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: mga nagmamahal sa akin
  rationale: Tuwirang ipinahahayag ng participle na may hulaping unang panauhan ang mga taong umiibig o nagmamahal sa salmista, nang walang di-kinakailangang romantikong pahiwatig.
- source_word: וְרֵעַי
  choice: at ang mga kaibigan ko
  rationale: Karaniwan at natural na katumbas ng רֵעַ sa konteksto ng personal na ugnayan.
- source_word: מִנֶּגֶד נִגְעִי יַעֲמֹדוּ
  choice: ay lumalayo dahil sa aking karamdaman
  rationale: Ipinahahayag nang natural sa Filipino ang larawang tumatayo sila nang hiwalay o sa tapat ng dinaranas ng salmista. Ang 'dahil sa' ay angkop sa konteksto ngunit bahagyang nagpapaliwanag sa ugnayan, kaya itinatala sa talababa ang mas literal na alternatibo.
- source_word: נִגְעִי
  choice: aking karamdaman
  rationale: Sa konteksto ng pisikal na paghihirap at pag-iwas ng iba, malinaw at likas ang 'karamdaman,' habang pinananatili sa talababa ang mas malawak na saklaw na paghihirap, salot, o sugat.
- source_word: וּקְרוֹבַי
  choice: at ang mga kamag-anak ko
  rationale: Maaaring tumukoy ang קָרוֹב sa mga malapit sa isang tao, lalo na sa malalapit na kaanak; ang 'kamag-anak' ay malinaw at angkop sa paralelismo.
- source_word: מֵרָחֹק עָמָדוּ
  choice: ay nakatayo sa malayo
  rationale: Pinananatili ang tahasang larawang pangkalawakan at ang patuloy na tagpo, bagaman perfect ang pandiwang Hebreo.
theological_decisions:
- issue: Ugnayan ng מִנֶּגֶד sa נִגְעִי
  choice: lumalayo dahil sa aking karamdaman
  alternative: nakatayo sa tapat o hiwalay sa aking karamdaman
  rationale: Hindi tiyak kung ang parirala ay simpleng naglalarawan ng posisyon o nagpapahiwatig na ang karamdaman ang dahilan ng paglayo. Ang pangunahing salin ay natural sa konteksto, habang pinananatili ng talababa ang mas literal na pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'mga nagmamahal sa akin' upang maiwasan ang romantikong pahiwatig ng 'mga iniibig ko,' at 'kamag-anak' upang maipakita ang malamang na pampamilyang diwa ng קְרוֹבַי.
