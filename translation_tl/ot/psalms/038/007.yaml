    text: Mahirap tiyakin ang salitang Hebreo; maaari rin itong unawain bilang “pamamaga” o “pag-aapoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paghihirap ng salmista at likas na nag-uugnay sa naunang konteksto.
- source_word: כְסָלַי
  choice: aking mga balakang
  rationale: Tumutukoy ang כֶּסֶל sa bahaging tagiliran, baywang, o balakang. Ang “mga balakang” ay malinaw sa makabagong Filipino nang hindi ito nililimitahan sa likod o sa mga sangkap na seksuwal.
- source_word: מָלְאוּ
  choice: ay punô
  rationale: 'Pinananatili ang statibong diwa ng qal: ang bahaging tinutukoy ay lubos na dinaranas ng kasunod na kondisyon.'
- source_word: נִקְלֶה
  choice: nag-aapoy na pamamaga
  rationale: Mahirap at hindi tiyak ang salita, ngunit sa konteksto ng pisikal na karamdaman malamang na tumutukoy ito sa nagbabaga o matinding pamamaga. Hindi idinagdag ang “mga sugat,” na hindi tahasang nasa Hebreo.
- source_word: וְאֵין
  choice: at walang
  rationale: Natural na Filipino para sa existential negation at pinananatili ang koordinasyon ng dalawang sugnay.
- source_word: מְתֹם
  choice: malusog na bahagi
  rationale: Sa kontekstong pisikal, nangangahulugan ito ng kalagayang buo o walang pinsala. Mas malinaw sa karaniwang Filipino ang “walang malusog na bahagi” kaysa sa literal ngunit di-likas na “walang kalusugan.”
- source_word: בִּבְשָׂרִי
  choice: sa aking laman
  rationale: Pinananatili ang kongkretong pagtukoy sa pisikal na laman, hindi ito ginagawang teolohikal na metapora.
theological_decisions:
- issue: Kahulugan ng בְּשָׂרִי sa paglalarawan ng pagdurusang pisikal
  choice: literal na “sa aking laman”
  alternative: “sa aking katawan”
  rationale: Ang parallelismo sa mga balakang at kawalan ng kalusugan ay malinaw na tumutukoy sa pisikal na karamdaman. Pinananatili ng “laman” ang kongkretong salita ng pinagmulan nang walang idinadagdag na antropolohikal o moral na kahulugan.
- issue: Hindi tiyak na kahulugan ng נִקְלֶה
  choice: “nag-aapoy na pamamaga” na may talababa
  alternative: “pag-aapoy,” “matinding init,” o isang di-pisikal na kahulugang gaya ng “karumihan”
  rationale: Mas angkop sa konteksto ng sakit sa katawan ang pisikal na pagbasa, ngunit tunay na mahirap ang salitang Hebreo kaya hindi dapat itago ang ibang posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismong pisikal ng talata at ang tunay na kawalang-katiyakan ng נִקְלֶה sa pamamagitan ng talababa.
