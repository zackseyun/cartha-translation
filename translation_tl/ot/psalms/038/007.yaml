  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: tl
  text: Sapagkat ang aking baywang[a] ay puno ng matinding init[b], at walang bahagi ng aking laman na malusog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagiliran” o “mga balakang”; tumutukoy ang salitang Hebreo sa bahagi ng katawan sa palibot ng baywang at balakang.
