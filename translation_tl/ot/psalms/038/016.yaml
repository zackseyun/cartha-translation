  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: tl
  text: Sapagkat sinabi ko, “Baka magalak sila dahil sa akin; kapag nadulas ang paa ko, nagmamataas sila laban sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: Baka
  rationale: Ipinahahayag nito ang kinatatakutang maaaring mangyari, kaayon ng gamit ng Hebreo sa kontekstong ito.
- source_word: יִשְׂמְחוּ לִי
  choice: magalak sila dahil sa akin
  rationale: Pinananatili ang diwa ng pagsasaya ng mga kaaway sa sinapit ng nagsasalita; natural ito sa makabagong Tagalog.
- source_word: בְּמוֹט רַגְלִי
  choice: kapag nadulas ang paa ko
  rationale: Inilalarawan ng parirala ang pagkawala ng katatagan o pagkadapa sa larawang ginagamit mismo ng teksto.
- source_word: עָלַי הִגְדִּילוּ
  choice: nagmamataas sila laban sa akin
  rationale: Ang literal na ideya ng ‘pagpapakalaki’ ay idyomatikong tumutukoy sa mapagmataas na pagyayabang laban sa nagsasalita.
theological_decisions:
- issue: Kung ang pagdulas ng paa ay literal o matalinghaga
  choice: Pinanatili ang konkretong larawan na “nadulas ang paa ko.”
  alternative: Ipaliwanag bilang “kapag ako ay nabuwal” o “kapag ako ay nagkamali.”
  rationale: Hindi nililinaw ng talata kung ito ay pisikal, moral, o pangkalahatang kasawian, kaya hindi dapat paliitin ang saklaw ng larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong patula at ang tensiyon ng kinatatakutang pagsasaya at pagmamataas ng mga kaaway.
