  source_fidelity: 'Tumpak na naihahatid ng draft ang dalawang sugnay: ang mga kaaway ay buhay at malalakas, at marami ang napopoot sa nagsasalita. Gayunman, ang “nang walang katotohanan” ay hindi likas na pang-abay na panuring sa “napopoot” sa Filipino at bahagyang inililihis ang שָׁקֶר tungo sa kawalan ng factual truth. Ang “nang may kabulaanan” ay mas malapit sa malawak na Hebreong diwa ng kasinungalingan/huwad na motibo, habang iniiwan sa talababa ang “nang walang dahilan” bilang posibleng pagbasa.'
  naturalness: Ang “Ngunit buhay at malalakas ang aking mga kaaway” ay malinaw at marangal. Mas natural at mas matatag ang “nang may kabulaanan” kaysa “nang walang katotohanan” sa paglalarawan ng paraan o katangian ng kanilang pagkapoot.
