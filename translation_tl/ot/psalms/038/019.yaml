  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: tl
  text: Ngunit buhay at malalakas ang aking mga kaaway, at marami ang napopoot sa akin nang may kabulaanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang walang dahilan.” Ang salitang Hebreo ay literal na “kasinungalingan” o “kabulaanan” at maaaring tumukoy sa pagiging huwad ng kanilang pagkapoot o sa kawalan nito ng makatarungang dahilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: aking mga kaaway
  rationale: Tuwirang tumutukoy sa mga personal na kaaway o kalaban ng salmista.
- source_word: חַיִּים
  choice: buhay
  rationale: Pinananatili ang tahasang diwa ng Hebreo at ang posibleng paghahambing sa nanghihinang kalagayan ng salmista.
- source_word: עָצֵמוּ
  choice: malalakas
  rationale: Likas na Filipino para sa kasalukuyang lakas ng mga kaaway; maaari ring magpahiwatig na sila ay lumakas.
- source_word: רַבּוּ
  choice: marami
  rationale: Malinaw at natural na ipinahahayag ang pagdami o malaking bilang nila.
- source_word: שֹׂנְאַי
  choice: mga napopoot sa akin
  rationale: Pinananatili ang pandiwang lakas ng participle sa halip na ulitin lamang ang pangngalang 'mga kaaway.'
- source_word: שָׁקֶר
  choice: nang walang katotohanan
  rationale: Malapit sa literal na 'kasinungalingan/kabulaanan' at sadyang hindi nagpapasiya kung huwad ang kanilang paratang o walang batayan ang kanilang poot.
