  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: tl
  text: Kumakabog ang puso ko; iniwan na ako ng aking lakas, at pati ang liwanag ng aking mga mata ay wala sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “liwanag ng aking mga mata” ay maaaring tumukoy sa mismong paningin o sa ningning at siglang nakikita sa mga mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Karaniwang tumutukoy ang לֵב sa puso bilang sentro ng damdamin at sigla; sa konteksto ng pisikal na paghihirap, natural at tuwiran ang “puso ko.”
- source_word: סְחַרְחַר
  choice: kumakabog
  rationale: Ipinahihiwatig ng salita ang pag-ikot o matinding pagkabalisa. Dito, kasabay ng pagkawala ng lakas at liwanag ng mga mata, malamang na inilalarawan nito ang magulo o malakas na pintig ng puso.
- source_word: עֲזָבַנִי כֹחִי
  choice: iniwan na ako ng aking lakas
  rationale: Pinananatili nito ang larawan ng Hebreo na ang lakas ang siyang umalis sa nagsasalita, nang hindi ipinapasok ang mas mabigat na pahiwatig ng “pinabayaan.”
- source_word: וְאוֹר עֵינַי
  choice: ang liwanag ng aking mga mata
  rationale: Pinananatili ang makatang larawan at ang posibleng pagtukoy kapwa sa paningin at sa ningning o siglang nakikita sa mga mata.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: Pati … ay wala na sa akin
  rationale: Naipapahayag ng “pati” ang diin ng גַּם, at ng “wala na sa akin” ang literal na diwa ng אֵין אִתִּי. Iniiwasan din nito ang alanganing pagtutugma ng panghalip sa Filipino habang pinananatili ang pagkawala.
