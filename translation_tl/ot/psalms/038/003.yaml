  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: tl
  text: Walang maayos na kalagayan sa aking laman dahil sa iyong matinding galit[a]; walang kapayapaan[b] sa aking mga buto dahil sa aking kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iyong poot.”
    reason: lexical_alternative
  - marker: b
    text: O, “kaginhawahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: malusog na bahagi
  rationale: Ang pangngalan ay tumutukoy sa pagiging buo o nasa maayos na kalagayan. Sa konteksto ng paghihirap ng katawan, likas sa modernong Tagalog ang pariralang “walang malusog na bahagi” at malinaw nitong ipinahihiwatig na walang bahaging hindi apektado.
- source_word: בִּבְשָׂרִי
  choice: sa aking laman
  rationale: Pinananatili ng “laman” ang kongkretong larawan ng Hebreo at ang kaibahan nito sa “mga buto” sa kasunod na sugnay.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Nagsasaad ito rito ng sanhi; ang “dahil sa” ang pinakatuwiran at likas na katumbas sa modernong Tagalog.
- source_word: זַעְמֶךָ
  choice: iyong matinding galit
  rationale: Ang זַעַם ay malakas na galit o poot. Malinaw at likas sa karaniwang mambabasa ang “matinding galit,” samantalang pinananatili sa talababa ang mas matinding alternatibong “poot.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Pinananatili ng “kapayapaan” ang karaniwang kahulugan ng שָׁלוֹם at ang matapang na patulang larawan ng kawalan nito maging sa mga buto. Inilalagay sa talababa ang kontekstuwal na alternatibong “kaginhawahan.”
- source_word: בַּעֲצָמַי
  choice: sa aking mga buto
  rationale: Tuwirang pinananatili nito ang Hebreong larawan ng mga buto bilang kinaroroonan ng malalim na pisikal at panloob na paghihirap.
- source_word: חַטָּאתִי
  choice: aking kasalanan
  rationale: Payak at wastong ipinahahayag nito ang sariling kasalanan ng salmista bilang sanhing binabanggit sa ikalawang sugnay.
theological_decisions:
- issue: Ugnayan ng galit ng Diyos, paghihirap ng salmista, at kanyang kasalanan
  choice: Tuwirang sinasabi ng talata na ang paghihirap ng katawan ng salmista ay dahil sa matinding galit ng Diyos at sa sarili niyang kasalanan, nang hindi ipinaliliwanag ang eksaktong paraan ng ugnayang ito.
  alternative: Maaaring unawain ang pananalita bilang patulang paglalarawan ng nadaramang pagkakalayo sa Diyos, hindi bilang isang ganap na aral tungkol sa sanhi ng lahat ng paghihirap.
  rationale: Pinananatili ng salin ang dalawang pahayag ng sanhi at hindi pinahihina ang alinman sa galit ng Diyos o personal na kasalanan. Hindi rin nito ginagawang pangkalahatang paliwanag ang talata para sa lahat ng pagdurusa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinananatili ang patulang magkatambal na “laman” at “mga buto,” habang gumagamit ng likas na pariralang “walang malusog na bahagi” upang maipahayag ang kawalan ng kabuuan o maayos na kalagayan.
