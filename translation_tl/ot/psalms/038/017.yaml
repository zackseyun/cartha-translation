  yaml_path: translation/ot/psalms/038/017.yaml
  text: For I am ready to fall, and my pain is always before me.
translation:
  language: tl
  text: 'Sapagkat malapit na akong mabuwal,

    at lagi kong kaharap ang aking kirot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע
  choice: malapit nang mabuwal
  rationale: Ang צלע ay maaaring tumukoy sa pagkapilay, pagkatisod, o pagbagsak. Sa pariralang נָכוֹן לְצֶלַע, ipinahihiwatig na ang nagsasalita ay nasa bingit ng pagbagsak; pinananatili ng “malapit nang mabuwal” ang matinding larawan nang natural sa Tagalog.
- source_word: מַכְאוֹבִי
  choice: ang aking kirot
  rationale: Ang מַכְאוֹב ay pisikal o matinding sakit. Ang “kirot” ay natural at tuwirang tumutukoy sa dinaranas na sakit nang hindi nililimitahan ang diwa sa isang tiyak na karamdaman.
- source_word: נֶגְדִּי תָמִיד
  choice: lagi kong kaharap
  rationale: Literal itong “palaging nasa harap ko.” Ang “lagi kong kaharap” ay nagpapanatili sa larawang hindi maiiwasan at patuloy na nararanasan ang sakit.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na simple, marangal, at patula. Pinanatili ang parallelism ng dalawang linya at ang larawan ng nalalapit na pagbagsak at patuloy na pagharap sa sakit.
