  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: tl
  text: Huwag mo akong pabayaan, Yahweh, Diyos ko; huwag kang lumayo sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: Huwag mo akong pabayaan
  rationale: Ang אַל kasama ng anyong pandiwa ay tuwirang pakiusap na negatibo. Ang “pabayaan” ay natural sa makabagong Tagalog at naipapahayag ang bigat ng עזב bilang pag-iwan o pagpapabaya nang hindi nagdaragdag ng di-tiyak na kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: 'Tuwirang inililipat ang pangngalang may hulaping unang panauhang isahan: “aking Diyos,” na likas na “Diyos ko” sa Tagalog.'
- source_word: אַל תִּרְחַק
  choice: huwag kang lumayo
  rationale: Pinananatili ang tuwirang pakiusap at ang di-tiyak na larawan ng pagiging malayo; hindi ito pinalalawak bilang sadyang pagtalikod.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Sa natural na Tagalog, ang רחק מן ay maayos na ipinahahayag bilang “lumayo sa akin.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Lakas ng pandiwang עזב sa panaghoy
  choice: pabayaan
  alternative: iwan; talikuran
  rationale: Ang “pabayaan” ay may angkop na bigat sa panalangin at panaghoy ngunit hindi awtomatikong nagpapahiwatig ng ganap na pagtatakwil gaya ng maaaring ipahiwatig ng “talikuran.”
translation_notes:
  register: Makabago, marangal, at tuwirang wikang panalangin. Ginamit ang karaniwang ayos na “Yahweh, Diyos ko” upang mapanatili ang dalawang magkasunod na panawag sa Hebreo. Walang talababa dahil walang alternatibong pagbasa o kinakailangang paliwanag na hindi kayang dalhin ng pangunahing teksto.
