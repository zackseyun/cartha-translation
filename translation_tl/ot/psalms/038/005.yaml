translation:
  language: tl
  text: Ang mga sugat ko ay bumaho at nabulok dahil sa aking kahangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga pasa ko ay naging mabaho at nabulok dahil sa aking kahangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: bumabaho
  rationale: Ipinahahayag ng Hiphil ng באש ang pagiging kasuklam-suklam sa pang-amoy. Ang “bumabaho” ay tuwiran, matingkad, at natural sa makabagong Filipino.
- source_word: נָמַקּוּ
  choice: nagnanaknak
  rationale: Ang pandiwa ay tumutukoy sa pagbulok, pagkabulok, o unti-unting pagkasira. Sa konteksto ng mga sugat, natural na inilalarawan ng “nagnanaknak” ang patuloy na paglala at pagkabulok ng mga ito.
- source_word: חַבּוּרֹתַי
  choice: mga sugat ko
  rationale: Maaaring mangahulugan ang חַבּוּרָה ng pasa, latay, o sugat. Dahil bumabaho at nabubulok ang mga ito, pinakamalinaw sa konteksto ang “mga sugat ko.”
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Nagsasaad dito ang parirala ng sanhi. Likas at malinaw na ipinapahayag ito ng “dahil sa.”
- source_word: אִוַּלְתִּי
  choice: aking kahangalan
  rationale: Ang pangngalan ay tumutukoy sa kahangalan na maaaring may moral na bigat. Pinananatili ng “aking kahangalan” ang pananagutan ng nagsasalita nang hindi ito nililimitahan sa simpleng kawalan ng kaalaman.
theological_decisions:
- issue: Ugnayang sanhi sa pagitan ng pagdurusa at kahangalan
  choice: dahil sa aking kahangalan
  alternative: bunga ng aking kahangalan
  rationale: Tuwirang iniuugnay ng talata ang kalagayan ng mang-aawit sa sarili niyang kahangalan. Pinananatili ang ugnayang ito nang hindi ginagawang pangkalahatang aral tungkol sa sanhi ng lahat ng pagdurusa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang matingkad ngunit karaniwang mga salitang “bumabaho” at “nagnanaknak” upang mapanatili ang pisikal na tindi ng Hebreo.
