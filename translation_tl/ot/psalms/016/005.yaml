  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: tl
  text: Si Yahweh ang bahagi ng aking mana at ang aking saro[a]; ikaw ang nagpapanatili sa aking bahaging inilaan sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Si Yahweh ang aking bahagi at aking saro.” Magkakasunod na ginagamit sa Hebreo ang mga larawang tumutukoy sa paglalaan: “bahagi,” “mana,” at “bahaging inilaan sa akin” (o “bahaging nakuha sa palabunutan”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מְנָת חֶלְקִי
  choice: ang bahaging mana ko
  rationale: Ipinahahayag ang ugnayang construct at pinananatili ang magkasabay na larawan ng bahagi at mana, bagaman bahagyang masinsin ang parirala sa Filipino.
- source_word: וְכוֹסִי
  choice: at ang aking saro
  rationale: Pinananatili ang konkretong metapora ng saro bilang larawan ng bahaging itinakda o karanasang nakalaan sa salmista.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinananatili ang tahasang panghalip at ang diin nito sa Diyos bilang gumagawa ng kilos.
- source_word: תּוֹמִיךְ
  choice: nag-iingat
  rationale: Ipinahahayag ang diwa ng paghawak at pagpapanatiling ligtas o matatag sa natural na makabagong Filipino.
- source_word: גּוֹרָלִי
  choice: aking kapalaran
  rationale: Ang 'kapalaran' ay likas na katumbas sa Filipino ng bagay na natakda sa pamamagitan ng palabunutan; kasabay nito, pinananatili ng talababa ang kongkretong larawan ng takdang bahagi.
theological_decisions:
- issue: Si Yahweh mismo bilang mana o takdang bahagi ng salmista
  choice: 'Pinanatili ang magkakaugnay ngunit hindi lubusang magkaparehong mga larawan: bahagi, mana, saro, at kapalaran.'
  alternative: “Si Yahweh ang aking bahagi at aking saro; iniingatan mo ang bahaging inilaan sa akin.”
  rationale: Hindi pinag-iisa sa iisang paliwanag ang mga metapora ng Hebreo. Sa gayon, nananatili ang tensiyong si Yahweh mismo ang bahagi ng salmista at siya rin ang nagtitiyak sa bahaging iyon.
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Ginamit ang “saro” upang mapanatili ang biblikal na larawan nang hindi ito agad ipinapaliwanag; ginamit ang “nag-iingat” bilang natural na pagpapahayag ng patuloy na pagtiyak at pagpapanatiling ligtas.
