base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: tl
  text: Ipinapaalam mo sa akin ang landas ng buhay; sa iyong presensya ay may ganap na kagalakan; sa iyong kanang kamay ay may mga kalugurang walang hanggan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Ipinakikilala mo sa akin
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng ידע. Ang imperfect ay isinalin sa kasalukuyan bilang pagpapahayag ng makatang pagtitiwala, bagaman maaari rin itong magkaroon ng himig na panghinaharap.
- source_word: אֹרַח חַיִּים
  choice: landas ng buhay
  rationale: Natural at malinaw na metapora ito sa Filipino para sa daang humahantong sa buhay; ang חַיִּים ay karaniwang abstraktong pangngalang 'buhay' kahit plural ang anyo.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: lubos na kagalakan
  rationale: Ang שֹׂבַע ay nagsasaad ng kapuspusan o kasaganaan, at ang plural na שְׂמָחוֹת ay maaaring likas na ipahayag sa Filipino sa kolektibong 'kagalakan.'
- source_word: אֶת־פָּנֶיךָ
  choice: sa iyong presensya
  rationale: Ang literal na 'sa harap ng iyong mukha' ay isang Hebreong idyoma para sa agarang presensya; ang idiomatikong salin ang mas malinaw at marangal sa modernong Filipino.
- source_word: נְעִמוֹת
  choice: mga kaluguran
  rationale: Ipinahahayag nito ang plural na mga bagay o karanasang nakalulugod, habang nananatiling angkop sa marangal na panulaan.
- source_word: בִּימִינְךָ
  choice: sa iyong kanan
  rationale: Pinananatili ang larawang lokatibo ng Hebreo nang hindi dinaragdagan ang posibleng teolohikal na pahiwatig.
- source_word: נֶצַח
  choice: walang hanggan
  rationale: Natural na Filipino para sa nagpapatuloy magpakailanman sa kontekstong ito.
theological_decisions:
- issue: Kung literal o idiomatiko ang pagsasalin sa פָּנֶיךָ
  choice: sa iyong presensya
  alternative: sa harap ng iyong mukha
  rationale: Ang literal na larawan ay tunay sa Hebreo, ngunit karaniwan itong idyoma para sa personal at agarang presensya. Pinili ang malinaw na kahulugan nang hindi nagdaragdag ng denominasyonal na interpretasyon.
- issue: Panahunan ng תּוֹדִיעֵנִי
  choice: 'kasalukuyan: “Ipinakikilala mo”'
  alternative: 'panghinaharap: “Ipapaalam mo”'
  rationale: Maaaring tumukoy sa kasalukuyan o hinaharap ang Hebreong imperfect sa makatang konteksto. Ang kasalukuyan ay angkop sa tono ng tiwala, ngunit hindi ipinagkakait ang posibleng panghinaharap na himig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Iniwasan ang sobrang literal na 'sa harap ng iyong mukha' dahil hindi ito likas sa Filipino; pinanatili naman ang parallelismo ng dalawang huling sugnay.
