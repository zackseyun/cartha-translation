  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: tl
  text: 'Miktam[a] ni David.


    Ingatan mo ako, O Diyos,

    sapagkat sa iyo ako nanganganlong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: miktam, isang pamagat ng awit na hindi tiyak ang kahulugan; maaaring tumukoy ito sa isang uri ng komposisyon. Isinasalin ito ng ilan na “awit” o “ginintuang awit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Hindi tiyak ang kahulugan ng teknikal na pamagat na Hebreo, kaya tinumbasan ito sa pamamagitan ng transliterasyon sa halip na pumili ng isang di-tiyak na interpretasyon.
- source_word: שָׁמְרֵנִי
  choice: Ingatan mo ako
  rationale: Tuwirang ipinahahayag ang pakiusap na bantayan, ingatan, o panatilihing ligtas ang nagsasalita.
- source_word: חָסִיתִי
  choice: ako nanganganlong
  rationale: Ipinahahayag ng pandiwa ang paghahanap ng kanlungan at pagtitiwala sa Diyos; natural sa modernong Tagalog ang kasalukuyang anyo sa kontekstong ito.
theological_decisions:
- issue: Tukoy na diwa ng מִכְתָּם
  choice: Pinanatili bilang “Miktam” na may paliwanag sa talababa.
  alternative: “Awit,” “ginintuang awit,” o pangalan ng isang tiyak na uri ng komposisyon.
  rationale: Hindi matiyak sa ebidensiyang leksikal ang eksaktong kahulugan, kaya hindi dapat gawing tiyak ng salin ang nananatiling malabo sa pinagmulan.
- issue: Batayan ng pakiusap sa Diyos
  choice: “sapagkat sa iyo ako nanganganlong”
  alternative: “sapagkat sa iyo ako nagtiwala”
  rationale: Pinananatili nito ang kongkretong larawan ng pagkakanlong sa Diyos nang hindi nililimitahan ang pahayag sa isang abstraktong konsepto ng pananampalataya.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “O Diyos” bilang natural na tuwirang pagtawag, at pinanatili ang teknikal na pamagat sa transliterasyon dahil hindi tiyak ang kahulugan nito.
