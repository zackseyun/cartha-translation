  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: tl
  text: Tungkol sa mga banal na nasa lupain[a], sila ang mga mararangal na lubos kong kinalulugdan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa daigdig.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos: “Nasa kanila ang buong kaluguran ko.”'
    reason: translation_clarity
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: Tungkol sa mga banal
  rationale: Ang לְ ay inuunawa rito bilang panandang paksa, kaya natural ang “Tungkol sa.” Ang קְדוֹשִׁים ay isinaling “mga banal,” na nagpapanatili sa payak na substantibong diwa nang hindi gumagamit ng mas teknikal na katawagan.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: na nasa lupain
  rationale: Maaaring tumukoy ang אֶרֶץ sa “lupain” o “daigdig.” Ang “lupain” ay natural sa konteksto at hindi ipinipilit ang mas kosmikong pakahulugan; inilalahad sa talababa ang alternatibo.
- source_word: הֵמָּה
  choice: sila ang
  rationale: Pinananatili ang diin ng nakahiwalay na panghalip at ginagawa itong natural na simula ng panaguring nominal sa Filipino.
- source_word: וְאַדִּירֵי
  choice: mga marangal
  rationale: Ang אַדִּיר ay maaaring mangahulugang marangal, dakila, o makapangyarihan. Sa konteksto, “marangal” ang nagpapahayag ng dignidad nang hindi nagpapahiwatig ng lakas-militar.
- source_word: כָּל חֶפְצִי
  choice: lubos kong kinalulugdan
  rationale: Ang כָּל kasama ng חֵפֶץ ay nagpapahayag na nasa kanila ang buong lugod ng salmista. Ang “lubos kong kinalulugdan” ay natural sa modernong Filipino at pinananatili ang tindi ng pahayag.
- source_word: בָם
  choice: kong kinalulugdan
  rationale: Ang relasyong ipinahahayag ng בְּ ay likas na naisasama sa pandiwang “kinalulugdan” sa Filipino; tahasang inilalahad sa talababa ang mas pormal na anyong “nasa kanila ang buo kong kaluguran.”
theological_decisions:
- issue: Pagkakakilanlan ng “mga banal”
  choice: Hindi tahasang tinukoy; ang pariralang “nasa lupain” ay natural na nagpapahiwatig ng mga taong itinalaga sa Diyos sa makalupang pamayanan.
  alternative: Mga banal na nilalang sa langit, o mga taong itinalaga sa pangkalahatan.
  rationale: Mas malamang na mga tao ang tinutukoy dahil sa “nasa lupain,” ngunit hindi dinagdagan ang teksto ng katawagang “mga mananampalataya” upang hindi tuluyang isara ang tunay na saklaw ng salita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga banal” sa payak at hindi teknikal na diwa, “mga marangal” para sa dignidad, at isang natural na pananalitang Filipino sa hulihan habang pinananatili sa talababa ang mas literal na kayarian.
