  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: tl
  text: Sinabi ko kay Yahweh[a], “Ikaw ang aking Panginoon; wala akong mabuti maliban sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Ang aking kabutihan ay hindi lumalampas sa iyo,” na nagpapahayag na ang kabutihan ng salmista ay hindi umiiral nang bukod kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: Sinabi ko
  rationale: Bagaman 2fs ang anyong Masoretiko, ipinahihiwatig ng konteksto at sinusuportahan ng mga sinaunang salin na ang salmista ang nagsasalita sa unang panauhan. Likas sa Tagalog na gawing tahasan ang paksa bilang “ko.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagmamarka ng pinatutungkulan ng pagsasalita; ang “kay” ang likas na panandang Tagalog para sa tuwirang pagharap sa personal na pangalang Yahweh.
- source_word: אֲדֹנָי אָתָּה
  choice: Ikaw ang aking Panginoon
  rationale: Pinananatili ng “Ikaw” ang tahasan at madiing panghalip, at ipinapahayag ng “aking Panginoon” ang unang-panauhang hulapi ng אֲדֹנָי sa marangal at likas na Tagalog.
- source_word: טוֹבָתִי
  choice: kabutihan
  rationale: Saklaw ng salita ang mabuti, kapakinabangan, at kagalingan. Ang “kabutihan” ay maikli at malawak ang diwa rito, nang hindi nililimitahan iyon sa materyal na pakinabang.
- source_word: בַּל עָלֶיךָ
  choice: wala akong kabutihang hiwalay sa iyo
  rationale: Ang masinsing makatang parirala ay nagsasaad na ang kabutihan ng nagsasalita ay hindi lumalampas o umiiral nang bukod sa Diyos. Ang “hiwalay sa iyo” ay malinaw sa modernong Tagalog, habang ang mas pormal na posibilidad ay iniingatan sa talababa.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang tipang pangalan at inihihiwalay ito sa titulong אֲדֹנָי, na isinaling “aking Panginoon.”
- issue: Diwa ng huling sugnay
  choice: wala akong kabutihang hiwalay sa iyo
  alternative: ang aking kabutihan ay hindi lampas sa iyo
  rationale: Matalinghaga at bahagyang malabo ang Hebreo. Inihahayag ng pangunahing salin ang lubos na pagdepende ng salmista sa Diyos, samantalang itinatala sa talababa ang mas pormal na pagbasa upang hindi ikubli ang tunay na saklaw ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Panginoon” bilang titulo at “Yahweh” bilang personal na banal na pangalan. Ang talababa ay tumutugma sa marker na [a] sa pangunahing teksto.
