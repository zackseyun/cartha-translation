id: PSA.16.1
reference: Psalms 16:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: tl
  text: 'Miktam[a] ni David.


    Ingatan mo ako, O Diyos,

    sapagkat sa iyo ako nanganganlong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: miktam, isang pamagat ng awit na hindi tiyak ang kahulugan; maaaring tumukoy ito sa isang uri ng komposisyon. Isinasalin ito ng ilan bilang “awit,” “ginintuang awit,” o “inskripsiyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Hindi tiyak ang kahulugan ng pamagat na Hebreo. Pinananatili ng transliterasyon ang anyo nito nang hindi nagpapasya sa isang pinagtatalunang kahulugan.
- source_word: לְדָוִד
  choice: ni David
  rationale: Maaaring tumukoy ang לְ sa pagkakatha, kaugnayan, o pag-aalay. Ang “ni David” ay likas na pamagat sa Filipino at hindi kasinlinaw ng “isinulat ni David” sa paggiit ng tiyak na pagkakatha.
- source_word: שָׁמְרֵנִי
  choice: Ingatan mo ako
  rationale: Saklaw ng pandiwa ang pag-iingat, pagbabantay, at pagprotekta. Ang “ingatan” ay natural at marangal na pakiusap sa Filipino at hindi nililimitahan sa pisikal na pagtatanggol.
- source_word: אֵל
  choice: O Diyos
  rationale: Tuwirang pagtawag ito sa Diyos; pinananatili ng “O Diyos” ang puwersang bokatibo at ang panalanging himig.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap at malinaw na pinananatili ang ugnayang sanhi.
- source_word: חָסִיתִי
  choice: ako nanganganlong
  rationale: Ang חָסָה ay may larawan ng paghahanap o pagkakaroon ng kanlungan. Ipinahahayag ng kasalukuyang anyo ang patuloy at matatag na pag-asa sa Diyos, habang pinananatili ang larawang-kanlungan.
- source_word: בָךְ
  choice: sa iyo
  rationale: Sa idyomang Hebreo, tinutukoy nito ang persona na siyang kanlungan. “Sa iyo” ang natural na katumbas sa Filipino.
theological_decisions:
- issue: Kahulugan ng pamagat na מִכְתָּם
  choice: Isatitik bilang “Miktam” sa halip na bigyan ng tiyak ngunit haka-hakang kahulugan.
  alternative: Isalin bilang “awit,” “ginintuang awit,” o “inskripsiyon.”
  rationale: Hindi tiyak ang eksaktong kahulugan ng מִכְתָּם. Pinananatili ng transliterasyon ang tunay na kawalang-katiyakan ng pinagmulang teksto.
- issue: Ugnayan ni David sa awit sa pariralang לְדָוִד
  choice: “ni David”
  alternative: “isinulat ni David,” “para kay David,” o “ukol kay David”
  rationale: Maaaring magpahiwatig ang pang-ukol ng pagkakatha, pag-aari, kaugnayan, o pag-aalay. Iniiwasan ng salin ang mas tiyak na pahayag kaysa sa kayang patunayan ng anyong Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nanganganlong” upang mapanatili ang kongkretong larawan ng kanlungan; ginamit ang “ni David” sa pamagat upang hindi sobrang tukuyin ang malawak na gamit ng Hebreong לְ.
