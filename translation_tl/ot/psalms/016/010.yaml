base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: tl
  text: Sapagkat hindi mo iiwan ang aking buhay sa Sheol;[a] hindi mo hahayaang makita ng iyong matapat[b] ang hukay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Sheol ay katawagang Hebreo para sa daigdig ng mga patay.
    reason: source_world_term
  - marker: b
    text: O “iyong banal.” Ang Hebreo ay maaaring tumukoy sa isang taong tapat, matapat, maka-Diyos, o banal.
    reason: lexical_alternative
  - marker: c
    text: O “pagkabulok.” Ang Septuagint at ang pagsipi sa talatang ito sa Bagong Tipan ay gumagamit ng pananalitang nagbibigay-diin sa pagkabulok o pagkasira.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pagtitiwala at natural ang daloy sa makatang pangangatwiran.
- source_word: לֹא תַעֲזֹב
  choice: hindi mo pababayaan
  rationale: Ang עזב ay maaaring mangahulugang iwan, talikuran, o pabayaan. Ang 'pababayaan' ay likas sa modernong Tagalog at nagpapahiwatig na hindi siya iiwan sa kapangyarihan ng kamatayan.
- source_word: נַפְשִׁי
  choice: ang aking buhay
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa buhay, sarili, o buong persona. Sa konteksto ng Sheol, mas malinaw sa karaniwang mambabasa ang 'aking buhay' kaysa 'aking kaluluwa,' nang hindi ipinapalagay ang isang tiyak na paghahati ng tao sa katawan at kaluluwa.
- source_word: לִשְׁאוֹל
  choice: sa Sheol
  rationale: Ang שְׁאוֹל ay katawagan sa daigdig o kalagayan ng mga patay, hindi lamang sa isang libingan. Pinanatili ang transliterasyon upang hindi paliitin ang saklaw nito.
- source_word: לֹא תִתֵּן
  choice: hindi mo hahayaang
  rationale: Bagaman literal na 'ibibigay,' ang נתן na may kasunod na infinitive ay idyomatikong nangangahulugang magpahintulot o humaya.
- source_word: חֲסִידְךָ
  choice: iyong tapat na lingkod
  rationale: Ang חָסִיד ay taong tapat at matapat sa Diyos sa loob ng ugnayang tipan. Idinagdag ang 'lingkod' bilang likas na Tagalog na pantukoy sa tao, habang ang alternatibong 'banal' ay inilagay sa talababa.
- source_word: לִרְאוֹת
  choice: makita
  rationale: Pinananatili nito ang tuwirang Hebreong idyoma; sa konteksto, maaari rin itong mangahulugang maranasan.
- source_word: שָׁחַת
  choice: ang hukay
  rationale: Sa paralelismo sa Sheol, ang 'hukay' ang tuwirang kahulugang angkop sa Hebreong konteksto. Mahalaga ngunit hindi tiyak ang alternatibong 'pagkabulok,' kaya inilagay iyon sa talababa.
theological_decisions:
- issue: Kahulugang mesiyaniko sa paggamit ng talata sa Bagong Tipan
  choice: Isinalin ang agarang leksikal na diwa ng tekstong Hebreo nang hindi tahasang ipinapasok ang mesiyanikong interpretasyon sa pangunahing teksto.
  alternative: Gamitin ang 'iyong Banal' at 'pagkabulok' upang higit na tumugma sa Septuagint at sa pagsipi sa Mga Gawa.
  rationale: Dapat unang katawanin ng salin ang Hebreong salmo, habang pinananatili sa mga talababa ang mga alternatibong mahalaga sa paggamit nito sa Bagong Tipan.
- issue: Saklaw ng נֶפֶשׁ
  choice: aking buhay
  alternative: aking kaluluwa
  rationale: Hindi kinakailangang tumukoy ang נֶפֶשׁ sa isang hiwalay na di-materyal na bahagi ng tao; maaaring tumukoy ito sa buhay o sarili. Iniiwasan ng 'buhay' ang pagpasok ng isang partikular na antropolohiyang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang 'Sheol' bilang mahalagang terminong mula sa mundong Hebreo at ipinaliwanag sa talababa. Iniwasan ang arkaikong 'kaluluwa' sa pangunahing linya dahil mas malawak ang saklaw ng נֶפֶשׁ rito.
