  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang larawan ng mga hangganang/linyang nagmamarka ng bahaging inilaan, ang personal na paglalaan sa nagsasalita, ang kaaya-ayang lugar, ang mariing אַף, at ang mana na maganda para sa nagsasalita. Ang “napunta” ay isang katanggap-tanggap na natural na pagsasalin sa konteksto ng paglalaan, habang iniingatan ng talababa ang literal na larawan ng “nahulog.”'
