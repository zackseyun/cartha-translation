  text: חֲבָלִ֣ים נָֽפְלוּ לִ֭/י בַּ/נְּעִמִ֑ים אַף נַ֝חֲלָ֗ת שָֽׁפְרָ֥ה עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: tl
  text: Ang mga guhit ng hangganan ay napunta sa akin sa kaaya-ayang mga lugar[a]; tunay nga, maganda sa akin ang aking mana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga panukat na lubid ay nahulog para sa akin sa kaaya-ayang mga lugar.” Ang larawang Hebreo ay tungkol sa mga lubid o guhit na nagtatakda sa hangganan ng bahaging inilaan bilang mana.
    reason: lexical_alternative
  - marker: b
    text: O “kaaya-aya sa akin ang aking mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: mga guhit ng hangganan
  rationale: Sa konteksto ng paghahati ng lupain, tumutukoy ito sa mga lubid na panukat o sa mga hangganang itinatakda ng mga iyon. Pinananatili ng salin ang larawan ng isang bahaging inilaan bilang mana habang malinaw sa makabagong mambabasa.
- source_word: נָפְלוּ
  choice: napunta
  rationale: Literal itong nangangahulugang “nahulog,” ngunit sa paghahati ng lupa inilalarawan nito kung saan napunta ang nakalaang bahagi. Ang “napunta” ay natural sa Filipino at hindi inaalis ang larawan ng mga hangganang itinakda sa pamamagitan ng palabunutan o paglalaan; inilalahad sa talababa ang mas literal na anyo.
- source_word: לִי
  choice: sa akin
  rationale: Ipinahahayag nito na ang inilaan o napunta ay para sa kapakinabangan at pag-aari ng nagsasalita.
- source_word: בַּנְּעִמִים
  choice: sa kaaya-ayang mga lugar
  rationale: Ang pangmaramihang anyo mula sa נעים ay may diwang kaaya-aya, kalugod-lugod, o kasiya-siya. Ang locative na parirala ay angkop sa larawan ng lupang minana.
- source_word: אַף
  choice: tunay nga
  rationale: Nagbibigay ito ng mariing pagpapatibay sa naunang pahayag, hindi lamang simpleng pagdaragdag.
- source_word: נַחֲלָת
  choice: ang aking mana
  rationale: Bagaman construct ang anyo, ipinahihiwatig ng konteksto ang pag-aari ng unang panauhan. Pinananatili ng “mana” ang konkretong wika ng nakalaang lupain at ang kaugnayan nito sa talatang 5.
- source_word: שָׁפְרָה
  choice: maganda
  rationale: Ang pandiwa ay nagpapahayag na ang isang bagay ay maganda, mainam, o kaaya-aya. Ang “maganda” ay tuwiran at likas na panaguri sa Filipino.
- source_word: עָלָי
  choice: sa akin
  rationale: 'Literal na “sa ibabaw ko,” ngunit sa idyomang ito ay nagpapahayag ng personal na pagpapahalaga o pagtingin: maganda ang mana para sa nagsasalita.'
theological_decisions:
- issue: Ang larawan ng paghahati ng lupain bilang talinghaga sa bahaging kaloob ng Diyos
  choice: Panatilihin ang konkretong larawan ng mga hangganan at mana.
  alternative: Isalin nang pangkalahatan bilang mga pagpapalang napunta sa nagsasalita.
  rationale: Kaagapay ito ng pahayag sa talatang 5 na ang PANGINOON ang bahagi at mana ng mang-aawit. Ang pagpapanatili sa larawan ng lupang inilaan ay nag-iingat sa tipanang himig ng teksto nang hindi nililimitahan ang kahulugan nito sa literal na pagmamay-ari ng lupa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga guhit ng hangganan” upang maunawaan agad ang larawan ng paghahati ng lupa; iniingatan naman sa talababa ang literal na mga lubid at ang pandiwang “nahulog.”
