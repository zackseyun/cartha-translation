  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: tl
  text: 'Kaya nagagalak ang puso ko,

    at nagsasaya ang kaluwalhatian ko[a];

    maging ang laman ko ay mananahan nang tiwasay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang karangalan ko” o “ang buo kong pagkatao.” Nauunawaan ng ilang sinaunang tagapagpaliwanag na tumutukoy ito sa “dila ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mamamahinga nang ligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na Filipino para sa kongklusyong lohikal na nagmumula sa pagtitiwala sa naunang mga talata.
- source_word: שָׂמַח לִבִּי
  choice: nagagalak ang puso ko
  rationale: Pinananatili ang larawan ng puso bilang panloob na pagkatao at ipinahahayag ang kasalukuyang kalagayan ng kagalakan.
- source_word: וַיָּגֶל
  choice: nagsasaya
  rationale: Malinaw at makabagong salitang nagpapahayag ng masiglang kagalakan at umaayon sa paralelismo ng taludtod.
- source_word: כְּבוֹדִי
  choice: ang kaluwalhatian ko
  rationale: Tuwirang pinananatili ang literal na ‘kaluwalhatian’ at ang tunay na kalabuan ng idyomang Hebreo; inilalagay sa talababa ang mahahalagang alternatibo.
- source_word: אַף
  choice: maging
  rationale: Ipinakikita ang mariing paglawak mula sa panloob na kagalakan tungo sa katiwasayan ng pisikal na sarili.
- source_word: בְּשָׂרִי
  choice: ang laman ko
  rationale: Pinananatili ang konkretong larawang Hebreo at ang ugnayang intertekstuwal nito, nang hindi ito binibigyan ng kahulugang ‘makasalanang kalikasan.’
- source_word: יִשְׁכֹּן
  choice: mananahan
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang tumahan o manatili, at pinananatili ang aspektong hinaharap sa konteksto.
- source_word: לָבֶטַח
  choice: nang tiwasay
  rationale: Natural na pang-abay sa Filipino na naghahayag ng paninirahan sa kaligtasan at kapanatagan.
theological_decisions:
- issue: Ang kahulugan ng כְּבוֹדִי sa talatang kalauna’y binanggit sa Bagong Tipan
  choice: ang kaluwalhatian ko
  alternative: ang karangalan ko; ang buo kong pagkatao; ang dila ko
  rationale: Ang literal na pangngalan ay ‘kaluwalhatian.’ Pinananatili ito upang hindi agad lutasin ang idyomatikong kalabuan at upang mapanatili ang ugnayan sa pagkakabanggit ng talata sa Gawa 2.
- issue: Ang pagkakasalin ng בְּשָׂרִי
  choice: ang laman ko
  alternative: ang katawan ko
  rationale: Ang ‘laman’ ay malapit sa pinagmulang salita at nagpapanatili sa poetiko at intertekstuwal na bisa nito, nang hindi nag-aangkat ng ibang teolohikal na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang poetikong paralelismo at ang literal na mga larawang “kaluwalhatian” at “laman,” habang ipinaliliwanag sa talababa ang mga pangunahing alternatibo.
