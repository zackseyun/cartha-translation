  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: tl
  text: 'Pupurihin ko si Yahweh, na nagpapayo sa akin;

    maging sa gabi ay tinuturuan ako ng aking kaloob-looban.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “tinuturuan ako ng aking mga bato (kidney).” Sa Hebreo, maaaring kumatawan ang mga bato sa pinakaloob na sarili, kasama ang budhi at malalalim na damdamin. Maaari ring mangahulugan ang pandiwang isinaling “tinuturuan” ng “dinidisiplina,” “sinasaway,” o “itinutuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Pupurihin ko
  rationale: Ang Piel ng ברך kapag ang Diyos ang layon ay nangangahulugang magsalita nang mabuti tungkol sa kanya o magpahayag ng papuri. Mas natural at malinaw sa modernong Tagalog ang “pupurihin” kaysa “pagpapalain,” na maaaring magpahiwatig na ang tao ang nagbibigay ng pagpapala sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “Panginoon.”
- source_word: יְעָצָנִי
  choice: nagpapayo sa akin
  rationale: Tuwirang ipinapahayag ang karaniwang diwa ng יעץ na “magpayo.” Ang aspektong imperpektibo ay angkop na unawain bilang patuloy o nakaugaliang pagkilos.
- source_word: אַף
  choice: kahit
  rationale: 'Ipinakikita ang mariing pagdaragdag: umaabot maging sa gabi ang panloob na pagtuturo.'
- source_word: לֵילוֹת
  choice: sa gabi
  rationale: Bagaman maramihan ang anyong Hebreo, natural na pananalita sa Tagalog ang “sa gabi” para sa paulit-ulit o karaniwang panahon ng gabi.
- source_word: יִסְּרוּנִי
  choice: tinuturuan ako
  rationale: Maaaring mangahulugan ang יסר ng magturo, magdisiplina, sumaway, o magtuwid. Sa konteksto ng panloob na paggabay, pinananatili ng “tinuturuan” ang mapagbuong diwa nang hindi ipinapalagay na kaparusahan ang tinutukoy.
- source_word: כִלְיוֹתָי
  choice: aking kaloob-looban
  rationale: Literal itong “aking mga bato,” ngunit sa Hebreong paglalarawan sa tao, tumutukoy ang mga bato sa pinakaloob na sarili, kabilang ang budhi at malalalim na damdamin. Nauunawaan ng karaniwang mambabasa ang “kaloob-looban” nang hindi ito pinapaliit sa isip lamang o damdamin lamang.
theological_decisions:
- issue: Ang antropolohikal na metapora ng כִלְיוֹתָי
  choice: aking kaloob-looban
  alternative: aking mga bato; aking puso; aking isip
  rationale: Pinananatili ng “kaloob-looban” ang malawak na diwa ng pinakaloob na sarili. Ang literal na “mga bato” ay malamang na makalito sa modernong mambabasa, samantalang ang “puso” at “isip” ay magpapalit sa natatanging larawang Hebreo at maaaring magtakda ng mas makitid na kahulugan.
- issue: Saklaw ng kahulugan ng יִסְּרוּנִי
  choice: tinuturuan ako
  alternative: dinidisiplina ako; sinasaway ako; itinutuwid ako
  rationale: Hinahayaan ng “tinuturuan” na manatili ang positibong diwa ng panloob na paggabay sa konteksto, habang kinikilala sa talababa na may mas matinding mga posibleng kahulugan ang pandiwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “si Yahweh” bilang natural na pantukoy sa personal na pangalan. Pinanatili ang anyong patula sa dalawang linya at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
