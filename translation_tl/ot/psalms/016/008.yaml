  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: tl
  text: Lagi kong inilalagay si Yahweh[a] sa harapan ko; dahil nasa kanan ko siya, hindi ako matitinag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH; maaari ding isatitik na “Jehova.”
    reason: alternative_reading
  - marker: b
    text: O “hindi ako mauusog.” Maaari itong mangahulugang hindi mauuga o maaalis mula sa isang matatag na kinalalagyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Lagi kong inilalagay
  rationale: Ang Piel ng שׁוה ay nangangahulugang “ilagay” o “itakda.” Kasama ng תָמִיד, ipinahahayag nito ang kusa at patuloy na pagtutuon ng makata kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְנֶגְדִּי
  choice: sa harapan ko
  rationale: Pinananatili nito ang larawang si Yahweh ay nasa harap o laging nasa paningin ng nagsasalita.
- source_word: תָמִיד
  choice: Lagi
  rationale: Natural na katumbas sa modernong Tagalog ng tuloy-tuloy o palagiang kalagayan.
- source_word: כִּי
  choice: dahil
  rationale: Malinaw na ipinakikita ang sanhi ng pagtitiwala sa kasunod na pahayag.
- source_word: מִימִינִי
  choice: nasa kanan ko
  rationale: Pinananatili ang larawang pangkalagayan at ang pahiwatig ng malapit na presensiya at pag-alalay nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: בַּל אֶמּוֹט
  choice: hindi ako matitinag
  rationale: Ang מוט ay tumutukoy sa pag-uga, pagkatumba, o pagkakilos mula sa matatag na kinalalagyan. Ang “matitinag” ay natural at nagpapanatili sa literal at matalinghagang larawan.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Kahulugan ng pagiging nasa kanan
  choice: nasa kanan ko
  alternative: nasa tabi ko upang umalalay
  rationale: Pinananatili ang larawang Hebreo at ang posibilidad nitong magpahiwatig ng presensiya, proteksiyon, at suporta, sa halip na pumili lamang ng isang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “si” sa personal na pangalang Yahweh at pinanatili ang mga larawang “sa harapan ko” at “nasa kanan ko” nang hindi labis na ipinapaliwanag ang mga ito.
