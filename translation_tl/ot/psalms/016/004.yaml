  terminology: Ang “ibang diyos,” “mga dalamhati,” at “mga handog na inumin” ay angkop na modernong Filipino at tapat sa kontekstong pangkulto. Hindi pinipilit ng salin ang pagtukoy kung ang “kanilang mga pangalan” ay mga pangalan ng mga diyos o ng kanilang mga tagasamba. Nananatiling maayos ang mga anchor ng talababa at ang mga alternatibong pagbasa.
