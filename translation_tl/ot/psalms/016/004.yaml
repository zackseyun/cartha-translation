  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: tl
  text: Darami ang mga dalamhati ng mga nagmamadaling sumunod sa ibang diyos.[a] Hindi ko ibubuhos ang kanilang mga handog na inumin mula sa dugo,[b] ni bibigkasin ng aking mga labi ang kanilang mga pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Darami ang kanilang mga diyus-diyosan.” Maaaring maiugnay sa mga diyus-diyosan ang salitang Hebreo sa ilang konteksto, ngunit mas angkop dito ang “mga dalamhati.”
    reason: alternative_reading
  - marker: b
    text: O “mga handog na inuming may dugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: Darami
  rationale: Ang Qal imperfect ng רבה ay nagpapahayag ng pagdami o paglala; ang “darami” ay likas sa Filipino at angkop sa patulang pahayag ng kahihinatnan.
- source_word: עַצְּבוֹתָם
  choice: ang mga dalamhati ng mga
  rationale: Pangunahing diwa rito ang mga dalamhati o pasakit na dumarami sa mga humahabol sa ibang diyos. Pinananatili sa talababa ang posibleng kaugnayan ng anyo sa mga diyus-diyosan.
- source_word: אַחֵר
  choice: ibang diyos
  rationale: Literal itong “iba,” ngunit ipinahihiwatig ng konteksto ng mga handog at mga pangalan na ibang diyos ang tinutukoy; kailangang ilantad ang ipinahiwatig na pangngalan upang maging malinaw sa Filipino.
- source_word: מָהָרוּ
  choice: nagmamadaling sumunod sa
  rationale: Ang מהר ay karaniwang nangangahulugang magmadali. Ang “sumunod sa” ay natural na paglalarawan sa masigasig na paghabol o paglapit sa ibang diyos.
- source_word: בַּל
  choice: Hindi … ni … man
  rationale: Ang patulang katagang pananggi ay malinaw na naipapahayag sa dalawang magkatugmang pagtanggi sa Filipino.
- source_word: אַסִּיךְ
  choice: ibubuhos
  rationale: Ang Hiphil ng נסך ay tumutukoy sa pagbubuhos ng isang handog na inumin; pinananatili ng “ibubuhos” ang konkretong larawang pangritwal.
- source_word: נִסְכֵּיהֶם
  choice: kanilang mga handog na inumin
  rationale: Ito ang malinaw at karaniwang salin sa Filipino para sa teknikal na katawagang tumutukoy sa libasyon.
- source_word: מִדָּם
  choice: na dugo
  rationale: Maaaring markahan ng מן ang materyal o nilalaman, kaya inilalarawan ang mga handog na inumin bilang dugo. Ang posibleng “may dugo” ay inilagay sa talababa.
- source_word: אֶשָּׂא
  choice: babanggitin
  rationale: Bagaman literal na “itataas/dadalhin,” kapag kasama ang “mga pangalan” at “mga labi,” idyomatiko itong tumutukoy sa pagbigkas o pagbanggit. Mas natural sa Filipino ang “babanggitin.”
- source_word: שְׁמוֹתָם
  choice: kanilang mga pangalan
  rationale: Pinananatili ang panghalip na maramihan at ang tunay na kalabuan kung ang tinutukoy ay mga diyos o ang mga kaugnay sa kanilang pagsamba.
- source_word: עַל שְׂפָתָי
  choice: babanggitin man
  rationale: Ang literal na “sa aking mga labi” ay isang idyoma para sa pagbigkas. Isinasalin ang kahulugan nito sa natural na Filipino nang hindi inuulit ang konseptong malinaw na sa pandiwang “babanggitin.”
theological_decisions:
- issue: Ipinahihiwatig na layon pagkatapos ng אַחֵר (“iba”)
  choice: ibang diyos
  alternative: ibang isa / iba
  rationale: Ang konteksto ng mga libasyon at pagtangging banggitin ang kanilang mga pangalan ay nagpapakitang ibang diyos ang tinutukoy. Nililinaw nito ang elipsis nang hindi nagdaragdag ng natatanging aral ng anumang denominasyon.
- issue: Kahulugan ng עַצְּבוֹתָם
  choice: mga dalamhati
  alternative: mga diyus-diyosan
  rationale: Pinakamalinaw sa sintaks at daloy na ang pahayag ay tungkol sa pagdami ng dalamhati ng mga humahabol sa ibang diyos. Gayunman, pinananatili sa talababa ang alternatibong kaugnay ng idolatriya.
- issue: Tinutukoy ng “kanilang mga pangalan”
  choice: panatilihing hindi tahasang tinutukoy
  alternative: mga pangalan ng ibang mga diyos
  rationale: Maaaring tumukoy ang panghalip sa ibang mga diyos o sa mga taong sumasamba sa kanila. Hindi nilulutas ng salin ang kalabuang hindi nilulutas ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dalamhati” upang mapanatili ang patulang bigat, at “handog na inumin” sa halip na mas teknikal na “libasyon.” Ang huling parirala ay isinaling idyomatiko bilang “babanggitin” upang maging natural, habang pinananatili ang pagtangging bigkasin ang mga pangalan.
