  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: tl
  text: Sina Moises at Aaron ay kabilang sa kanyang mga pari, at si Samuel ay kabilang sa mga tumatawag sa kanyang pangalan. Tumawag sila kay Yahweh, at sinagot niya sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: kabilang sa kanyang mga pari
  rationale: 'Pinananatili ang malamang na partitive na diwa ng בְּ: ibinibilang sina Moises at Aaron sa pangkat ng mga pari ng Diyos, nang hindi ipinapantay nang tahasan ang kanilang partikular na tungkulin.'
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: kabilang sa mga tumatawag sa kanyang pangalan
  rationale: Ipinapakita ang paralelismo sa naunang parirala at pinananatili ang tahasang 'kanyang pangalan,' na tumutukoy sa pananalangin o pagtawag sa Diyos.
- source_word: קֹרִאים אֶל
  choice: Tumawag sila kay
  rationale: Natural na salin sa Filipino ng pagtawag patungo sa Diyos; hindi ito nilimitahan sa pagdaing lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: יַעֲנֵם
  choice: sinagot niya sila
  rationale: Binabasa ang imperfect bilang buod ng nakaraang kilos sa konteksto; malinaw at natural ito sa Filipino.
- source_word: שְׁמוֹ
  choice: kanyang pangalan
  rationale: Pinananatili ang mismong idyomang Hebreo at ang kahalagahan nito sa pananalangin at pagsamba.
theological_decisions:
- issue: Kung paano ilalarawan sina Moises, Aaron, at Samuel bilang mga tagapamagitan nang hindi pinapawi ang pagkakaiba ng kanilang mga tungkulin
  choice: Sina Moises at Aaron ay kabilang sa kanyang mga pari, at si Samuel ay kabilang sa mga tumatawag sa kanyang pangalan
  alternative: Sina Moises at Aaron ay kanyang mga pari, at tumawag si Samuel sa kanyang pangalan
  rationale: Pinananatili ng napiling salin ang dalawang magkatulad na pariralang nag-uuri sa mga tauhan. Hindi nito labis na iginigiit na magkapareho ang tiyak na katungkulang pangpari nina Moises at Aaron, at hindi rin nito inaalis si Samuel sa mas malawak na pangkat ng mga tumatawag sa pangalan ng Diyos.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang 'sina' at 'si' para sa karaniwang daloy ng Tagalog, habang pinanatili ang estruktura at teolohikal na tensiyon ng Hebreo.
