  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: tl
  text: Yahweh, aming Diyos, ikaw ang sumagot sa kanila; ikaw ay Diyos na nagpapatawad sa kanila,[a] ngunit tagapaghiganti dahil sa kanilang mga ginawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Diyos na nag-aalis ng [kanilang kasalanan] para sa kanila.” Ang Hebreong participle ay maaaring mangahulugang nagpapatawad sa pamamagitan ng pagdadala o pag-aalis ng sala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ngunit gumaganti dahil sa kanilang mga ginawa.” Maaaring unawain ang anyong Hebreo bilang pangngalan (“tagapaghiganti”) o bilang pandiwa (“gumaganti”).
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Tuwirang isinasalin ang anyong may hulaping unang panauhang maramihan; natural ito sa panawagang “Yahweh, aming Diyos.”
- source_word: אַתָּה
  choice: ikaw ang
  rationale: 'Pinanatili ang tahasang panghalip at ang diin nito: ang Diyos mismo ang sumagot sa kanila.'
- source_word: עֲנִיתָם
  choice: sumagot sa kanila
  rationale: Ang pandiwa ay nangangahulugang sumagot o tumugon; sa konteksto ng panalangin sa mga naunang talata, malinaw at natural ang “sumagot sa kanila.”
- source_word: אֵל נֹשֵׂא
  choice: Diyos na nagpapatawad
  rationale: Bagaman literal na may diwang “nagbubuhat/nag-aalis,” karaniwang ipinahahayag ng נֹשֵׂא ang pagpapatawad sa kasalanan o pag-aalis ng sala. Inilagay sa talababa ang mas literal na larawan.
- source_word: הָיִיתָ לָהֶם
  choice: ikaw ay ... sa kanila
  rationale: Ipinapahayag ng konstruksiyon kung ano ang Diyos kaugnay nila; pinanatili ito sa natural na Filipino.
- source_word: וְנֹקֵם
  choice: ngunit gumaganti ka rin
  rationale: Ang participle ay tumutukoy sa paggawa ng makatarungang pagganti. Ginawang pandiwang parirala para sa natural na Filipino, habang ang “ngunit” ay nagpapakita ng tunay na tensiyon sa pagpapatawad at pagganti.
- source_word: עַל עֲלִילוֹתָם
  choice: sa kanilang mga ginawa
  rationale: Ang עֲלִילוֹת ay malawak na tumutukoy sa mga gawa o kilos. Hindi ito isinaling “masasamang gawa” upang hindi magdagdag ng tahasang negatibong panuring na wala mismo sa pangngalan.
theological_decisions:
- issue: Magkasabay na pagpapatawad at pagganti ng Diyos
  choice: Pinanatiling magkatabi ang Diyos na nagpapatawad at ang Diyos na gumaganti sa kanilang mga ginawa.
  alternative: Ipaliwanag na lubos silang pinatawad at ibang mga tao lamang ang pinarusahan, o ipalit ang pangkalahatang “pagdidisiplina” sa pagganti.
  rationale: Tahasang pinagsasama ng Hebreo ang pagsagot at pagpapatawad ng Diyos sa kaniyang pagganti kaugnay ng kanilang mga ginawa. Hindi nilulutas o pinapahina ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aming” sa panawagan, pinanatili ang diin ng “ikaw,” at iniwasan ang salitang “paghihiganti” sa pangunahing teksto dahil maaari itong magpahiwatig ng makitid o personal na paghihiganti; ang “gumaganti” ay mas maikli at angkop sa konteksto ng banal na katarungan.
