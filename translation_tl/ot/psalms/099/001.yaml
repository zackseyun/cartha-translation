base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: tl
  text: Naghahari si Yahweh[a]; manginig ang mga bayan. Nakaluklok siya sa ibabaw ng mga kerubin[b]; mayanig ang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Naghahari si Yahweh; nanginginig ang mga bayan … nayayanig ang lupa.” Maaaring unawain bilang pasalaysay, sa halip na pautos o pahintulot, ang mga pandiwang Hebreo.'
    reason: alternative_reading
  - marker: b
    text: Ang “nakaluklok sa ibabaw ng mga kerubin” ay maaari ring isaling “nakaluklok sa pagitan ng mga kerubin” o “nakaupo sa ibabaw ng mga kerubin.” Isa itong titulong kaugnay ng hari at templo para kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “Panginoon.”
- source_word: מָלָךְ
  choice: naghahari
  rationale: Ang ganap na anyo sa patulang pagpapahayag ay natural na tumutukoy sa kasalukuyan at patuloy na paghahari ni Yahweh, nang hindi ipinapalagay na ngayon lamang siya naging hari.
- source_word: יִרְגְּזוּ
  choice: manginig
  rationale: Ipinapahayag ang pagkayanig o panginginig ng mga bayan bilang tugon sa paghahari ni Yahweh. Ang anyong pautos/pahintulot ay angkop sa konteksto, ngunit nananatiling posible ang pasalaysay na pagbasa at inilagay ito sa talababa.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ang maramihang kolektibong diwa ng iba’t ibang pangkat ng tao; mas malapit ito sa Hebreo kaysa sa mas politikal na “mga bansa.”
- source_word: יֹשֵׁב כְּרוּבִים
  choice: nakaluklok siya sa ibabaw ng mga kerubin
  rationale: Ipinahahayag ng “nakaluklok” ang maharlika at templong pahiwatig ng parirala. Hindi nito labis na nililimitahan ang ugnayang pansanlugar, na maaari ring unawaing “sa pagitan” o “sa ibabaw.”
- source_word: כְּרוּבִים
  choice: mga kerubin
  rationale: Ginagamit ang nakaugaliang salin-titik sa Filipino para sa uring ito ng mga makalangit na nilalang.
- source_word: תָּנוּט
  choice: mayanig
  rationale: Tumutugma sa patulang paralelismo ng “manginig” at nagpapahiwatig ng pag-uga o pagkayanig. Ang posibleng pasalaysay na pagbasa ay pinananatili sa talababa.
- source_word: הָאָרֶץ
  choice: ang buong lupa
  rationale: Ang pandaigdig o kosmikong saklaw ang pinakamalamang sa awit ng paghahari; nililinaw ng “buong” ang diwang ito nang hindi tumutukoy sa isang partikular na lupain.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton, kaya pinananatili ang pangalang Yahweh sa halip na palitan ng isang titulo.
- issue: Diwa ng mga pandiwang imperfect na יִרְגְּזוּ at תָּנוּט
  choice: 'Pautos o pahintulot: “manginig … mayanig”'
  alternative: 'Pasalaysay: “nanginginig … nayayanig”'
  rationale: Ang pautos/pahintulot na pagbasa ay angkop bilang maringal na tugon sa pahayag ng paghahari ni Yahweh, ngunit tunay na pinahihintulutan din ng Hebreo ang pasalaysay na pagbasa, kaya isinasaad ito sa talababa.
- issue: Ugnayang pansanlugar sa יֹשֵׁב כְּרוּבִים
  choice: “nakaluklok … sa ibabaw ng mga kerubin”
  alternative: “nakaluklok sa pagitan ng mga kerubin”; “nakaupo sa ibabaw ng mga kerubin”
  rationale: Inihahatid ng pangunahing salin ang maharlika at templong titulo nang hindi ginagawang tiyak ang “sa pagitan,” samantalang kinikilala sa talababa ang iba pang lehitimong paraan ng pag-unawa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nakaluklok” upang ihatid ang maharlikang larawan, “mga bayan” para sa maramihang עַמִּים, at “buong lupa” upang ipakita ang pandaigdig na saklaw. Parehong nakalagay sa pangunahing teksto ang mga markang [a] at [b].
