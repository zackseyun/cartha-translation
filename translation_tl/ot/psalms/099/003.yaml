  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: tl
  text: Purihin nila ang iyong dakila at kasindak-sindak na pangalan[a][b]; banal siya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kakila-kilabot” o “kamangha-mangha”; inilalarawan ng Hebreo ang pangalang pumupukaw ng mapitagang paghanga at takot.
    reason: lexical_alternative
  - marker: b
