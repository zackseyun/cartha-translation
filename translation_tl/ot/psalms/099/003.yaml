lexical_decisions:
- source_word: יוֹדוּ
  choice: Purihin nila
  rationale: Ang Hifil imperfect na ito ng ידה ay maaaring mangahulugang “magpasalamat” o “magpuri.” Dahil ang layon ay ang pangalan ng Diyos at panawagan ang diwa ng talata, natural dito ang pautos/pakiusap na “Purihin nila.”
- source_word: שִׁמְךָ
  choice: iyong ... pangalan
  rationale: Pinananatili ang Hebreong idyoma at ang bigat nito bilang pagtukoy hindi lamang sa tawag sa Diyos kundi pati sa kanyang hayag na pagkakakilanlan at reputasyon.
- source_word: גָּדוֹל
  choice: dakila
  rationale: Ang “dakila” ay natural at marangal na katumbas ng “great” sa paglalarawan sa pangalan ng Diyos.
- source_word: וְנוֹרָא
  choice: at kasindak-sindak
  rationale: Ipinahihiwatig ng salitang mula sa ירא ang pagpukaw ng sindak, takot, at mapitagang paghanga. Pinananatili ng “kasindak-sindak” ang matinding puwersa nito.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Ang “banal” ang karaniwan at angkop na salin na nagpapanatili sa teolohikal at panliturhiyang bigat ng salita.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang hiwalay at mariing panghalip at ang maikling pangwakas na pahayag tungkol sa Diyos.
theological_decisions:
- issue: Tinutukoy ng panghalip sa huling sugnay
  choice: 'Ang “siya” ay tumutukoy sa PANGINOON: “siya ay banal.”'
  alternative: 'Maaaring iugnay nang mas tuwiran ang kabanalan sa pangalan: “banal ang kanyang pangalan.”'
  rationale: Sa Awit 99, ang pahayag tungkol sa kabanalan ay nagsisilbing paulit-ulit na pagbubunyi sa PANGINOON. Hindi pinalawak ang teksto o dinagdagan ng ugnayang gaya ng “sapagkat,” na wala sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dakila” at “banal” bilang pamilyar na bokabularyong panrelihiyon, samantalang pinanatili ng “kasindak-sindak” ang pinaghalong takot at mapitagang paghanga ng Hebreo. Hindi idinagdag ang “sapagkat” upang mapanatili ang maigsi at magkatabing mga sugnay ng pinagmulan.
