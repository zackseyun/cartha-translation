source:
  edition: WLC
  text: בְּ/עַמּ֣וּד עָ֭נָן יְדַבֵּ֣ר אֲלֵי/הֶ֑ם שָׁמְר֥וּ עֵ֝דֹתָ֗י/ו וְ/חֹ֣ק נָֽתַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: tl
  text: Sa haliging ulap ay nagsalita siya sa kanila[a]; sinunod nila ang kanyang mga patotoo at ang tuntuning ibinigay niya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula sa haliging ulap ay nagsalita siya sa kanila.” Maaaring unawain ang pang-ukol sa Hebreo bilang pagtukoy sa kinaroroonan o sa pinagmumulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: Sa haliging ulap
  rationale: Pinananatili nito ang larawan ng haliging ulap at ang likas na kalabuan ng pang-ukol na ב, na maaaring tumukoy sa kinaroroonan o pinagmumulan ng pagsasalita.
- source_word: יְדַבֵּר
  choice: nagsalita siya
  rationale: Bagaman maaaring magpahiwatig ng paulit-ulit na kilos ang anyong yiqtol, ang payak na nagdaan ay natural sa makatang pagbabalik-tanaw sa ginawa ng Diyos.
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Tuwirang tumutukoy sa mga tauhang binanggit sa naunang talata nang hindi ipinapasok sa teksto ang paliwanag sa kanilang pagkakakilanlan.
- source_word: שָׁמְרוּ
  choice: sinunod nila
  rationale: Sa kontekstong tipanan, ang שׁמר ay nangangahulugang sundin o tuparin; ang “sinunod” ay natural at malinaw sa modernong Filipino.
- source_word: עֵדֹתָיו
  choice: ang kanyang mga patotoo
  rationale: Pinananatili ng “mga patotoo” ang maramihang bilang at ang natatanging bokabularyong legal-tipanan, bukod sa kasunod na חֹק.
- source_word: וְחֹק
  choice: at ang tuntunin
  rationale: Ang “tuntunin” ay dignidad ngunit karaniwang salitang Filipino para sa itinakdang batas o alituntunin, at pinananatili ang isahang bilang.
- source_word: נָתַן לָמוֹ
  choice: ibinigay niya sa kanila
  rationale: Natural na inilalarawan ng parirala ang tuntunin bilang yaong ibinigay niya sa kanila; sapat ang payak na nagdaan.
theological_decisions:
- issue: Tinutukoy ng “siya” at “kanila”
  choice: Ang “siya” ay ang PANGINOON, at ang “kanila” ay sina Moises, Aaron, at Samuel na binanggit sa naunang talata.
  alternative: Maaaring palawakin ang “kanila” upang tumukoy sa Israel sa pamamagitan ng mga kinatawang ito.
  rationale: Ang pinakamalapit na mga tinutukoy sa Awit 99:6 ay sina Moises, Aaron, at Samuel. Pinananatili ang mga panghalip upang hindi palitan ng pagsasalin ang makatang daloy o alisin ang posibleng kolektibong pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “haliging ulap,” “mga patotoo,” at “tuntunin” upang mapanatili ang biblikal at legal-tipanang himig nang hindi nagiging lipas o labis na teknikal.
