  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: tl
  text: Ang makapangyarihang Hari ay umiibig sa katarungan[a]; ikaw ang nagtatag ng pagiging patas[b]; ikaw ang nagsagawa ng katarungan at katuwiran sa Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ang lakas ng Hari ay ang pag-ibig niya sa katarungan,” o “Ang Hari, sa kanyang lakas, ay umiibig sa katarungan.” Siksik at maaaring unawain sa mahigit isang paraan ang pambungad na Hebreo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang “pagiging patas” bilang “pagkamatuwid” o “pagiging matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֹז
  choice: ang lakas
  rationale: Karaniwang tumutukoy ang עֹז sa lakas o kapangyarihan. Pinanatili ang pangngalang “lakas” upang maipakita ang siksik at di-pangkaraniwang ayos ng Hebreo; hindi na isinalin nang hiwalay ang panimulang וְ dahil hindi ito kailangan sa likas na daloy ng talata sa Filipino.
- source_word: מֶלֶךְ
  choice: ng Hari
  rationale: Tumutukoy ito sa Diyos bilang hari sa konteksto. Ginamit ang malaking titik bilang magalang na pagtukoy, nang hindi binabago ang kahulugan ng salita.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Dito ay tumutukoy sa makatarungang pamamahala at wastong kaayusang panghukuman, hindi lamang sa isang hatol. Pareho itong isinalin sa dalawang paglitaw upang mapanatili ang pag-uulit sa Hebreo.
- source_word: אָהֵב
  choice: umiibig
  rationale: Ang anyo ng pandiwa ay nagpapahayag dito ng namamalaging katangian ng Hari. Ang pangkasalukuyang “umiibig” angkop sa ganitong pangkalahatang pahayag.
- source_word: אַתָּה
  choice: ikaw ang
  rationale: Hayagang pinanatili ang panghalip at ang diin nito sa tuwirang pakikipag-usap sa Diyos.
- source_word: כּוֹנַנְתָּ
  choice: nagtatag
  rationale: Ipinahihiwatig ng pandiwa ang pagtatatag o pagpapatibay ng isang bagay. Likas sa Filipino ang “nagtatag” at naipapakita nito ang ganap na kilos na may nagpapatuloy na bunga.
- source_word: מֵישָׁרִים
  choice: pagkamatuwid
  rationale: Tumutukoy ito sa pagiging tuwid o wasto sa moral at panlipunang diwa. Pinili ang “pagkamatuwid” upang maiba sa מִשְׁפָּט na “katarungan” at צְדָקָה na “katuwiran.”
- source_word: וּצְדָקָה
  choice: at katuwiran
  rationale: Pinananatili ng “katuwiran” ang natatanging moral na diwa ng צְדָקָה sa tambalang “katarungan at katuwiran,” sa halip na pag-isahin ang dalawang magkaugnay ngunit di-magkaparehong konsepto.
- source_word: בְּיַעֲקֹב
  choice: sa Jacob
  rationale: Pinanatili ang makatang pangalan na “Jacob” sa halip na ipaliwanag bilang “Israel.” Ang “sa” ay sapat na maluwag upang tumukoy sa loob o sa gitna ng bayang Jacob.
- source_word: עָשִׂיתָ
  choice: nagsagawa
  rationale: Malawak ang saklaw ng עשה. Ang “nagsagawa” ay mas likas kaysa “gumawa ng katarungan” sa Filipino at malinaw na nagpapahayag na isinakatuparan ng Diyos ang katarungan at katuwiran.
theological_decisions:
- issue: Pag-unawa sa siksik na pambungad na וְעֹז מֶלֶךְ
  choice: Ang lakas ng Hari ay umiibig sa katarungan
  alternative: Ang makapangyarihang Hari ay umiibig sa katarungan; o, Ang Hari, sa kanyang lakas, ay umiibig sa katarungan
  rationale: Hindi pangkaraniwan at maaaring unawain sa mahigit isang paraan ang sintaks ng Hebreo. Pinanatili sa pangunahing teksto ang pangngalang “lakas” upang hindi tahimik na gawing pang-uri ang עֹז o lutasin ang tunay na kalabuan. Inilagay sa talababa ang mas likas na mga posibleng pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may payak na bokabularyong mauunawaan ng karaniwang mambabasa. Sadyang pinanatili ang bahagyang di-pangkaraniwang pambungad dahil gayon din kasiksik at kalabo ang Hebreo; nililinaw ng talababa ang mas idyomatikong mga posibilidad.
