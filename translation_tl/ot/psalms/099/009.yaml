id: PSA.99.9
reference: Psalms 99:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: tl
  text: Dakilain ninyo si Yahweh, ang ating Diyos, at yumukod kayo na nakaharap sa kanyang banal na bundok,[a] sapagkat banal si Yahweh, ang ating Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumamba kayo sa kanyang banal na bundok.” Ang pandiwang Hebreo ay maaaring tumukoy kapwa sa pagyukod at sa pagsamba, at ang pang-ukol ay maaaring unawaing “sa” o bilang pagtukoy sa direksiyon, gaya ng “nakaharap sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Dakilain ninyo
  rationale: Ang maramihang pautos mula sa רום ay panawagang itanghal o kilalaning dakila ang Diyos. Likas at marangal sa makabagong Tagalog ang “dakilain.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang ipinahahayag ng hulaping unang panauhang maramihan ang “ating Diyos.”
- source_word: וְהִשְׁתַּחֲווּ
  choice: yumukod kayo
  rationale: Saklaw ng pandiwa ang pisikal na pagyukod o pagpapatirapa bilang kilos ng pagsamba. Pinananatili ng “yumukod” ang kongkretong larawan nang hindi nililimitahan ang kahulugan sa abstraktong “sumamba.”
- source_word: לְהַר קָדְשׁוֹ
  choice: tungo sa kanyang banal na bundok
  rationale: Maaaring magpahiwatig ang לְ ng direksiyon o kaugnayan. Pinananatili ng “tungo sa” ang posibleng oryentasyong spatial at hindi ipinahihiwatig na ang bundok mismo ang sinasamba.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng dalawang pautos; marangal at natural ang “sapagkat” sa tulang panrelihiyon.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Ito ang karaniwan at angkop na salin ng sentrong pahayag sa salmo tungkol sa kabanalan ng Diyos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasan ang Tetragrammaton sa Hebreo. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kung gagawing tahasang “sumamba” ang הִשְׁתַּחֲווּ
  choice: yumukod kayo
  alternative: sumamba kayo; magpatirapa kayo
  rationale: Maaaring tumukoy ang pandiwa kapwa sa pisikal na pagyukod at sa pagsambang ipinahahayag sa kilos na iyon. Pinananatili ng salin ang kongkretong kilos at ang likas nitong pahiwatig na pagsamba.
- issue: Kahulugan ng לְ sa pariralang לְהַר קָדְשׁוֹ
  choice: tungo sa kanyang banal na bundok
  alternative: sa kanyang banal na bundok; sa harap ng kanyang banal na bundok
  rationale: Hindi tiyak na lokatibo lamang ang pang-ukol; maaari rin itong magpahiwatig ng direksiyon. Pinananatili sa teksto ang direksiyonal na pagbasa at inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang pautos na “ninyo/kayo,” ang pangalang “Yahweh,” at ang konkretong “yumukod” upang mapanatili ang anyo at larawan ng Hebreo. Inilagay ang talababa matapos ang buong pariralang pinaglilinaw nito.
