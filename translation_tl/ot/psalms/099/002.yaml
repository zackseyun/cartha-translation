  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: tl
  text: Dakila si Yahweh sa Sion, at siya’y mataas kaysa sa lahat ng mga bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakahihigit sa lahat ng mga bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּצִיּוֹן
  choice: sa Sion
  rationale: Ang בְּ ay lokatibo rito at likas na isinasalin sa Filipino bilang “sa”; “Sion” ang karaniwang anyong Filipino ng pangalang Zion.
- source_word: גָּדוֹל
  choice: dakila
  rationale: Tuwirang ipinahahayag ng salita ang kadakilaan; ang “dakila” ay natural at angkop sa marangal na pananalita ng papuri.
- source_word: וְרָם הוּא
  choice: at siya ay mataas
  rationale: Pinananatili ng “mataas” ang larawang patula ng pagiging nasa mataas o marangal na kalagayan, habang ang tahasang “siya ay” ay sumasalamin sa diin ng hiwalay na panghalip na הוּא.
- source_word: עַל כָּל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Kasunod ng “mataas,” natural na ipinahihiwatig ng “sa” ang pagiging higit o nasa itaas. Ang עַמִּים ay “mga bayan/peoples,” hindi kinakailangang mga estadong politikal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang transliterasyon at hindi pinapalitan ng titulong “Panginoon.”
- issue: Kahulugan ng pagiging “mataas” sa mga bayan
  choice: mataas sa lahat ng mga bayan
  alternative: nakahihigit sa lahat ng mga bayan
  rationale: Pinananatili ng pangunahing salin ang konkretong larawang patula ng רָם at ang ugnayan nito sa עַל, nang hindi nililimitahan ang pahayag sa kapangyarihang politikal lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at magkatimbang na estrukturang patula ng dalawang sugnay.
