  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: tl
  text: 'Dakilain ninyo ang PANGINOON na ating Diyos,

    at yumukod kayo sa tuntungan ng kanyang mga paa[a][b];

    banal siya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa harap ng tuntungan ng kanyang mga paa.” Sa kontekstong ito ng pagsamba, higit sa isang paraan ang maaaring pagsalin sa pang-ukol na Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “tuntungan ng kanyang mga paa” sa lugar ng paghahari ng Diyos sa lupa, gaya ng kaban o santuwaryo, ngunit hindi ito tahasang tinutukoy ng teksto.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Dakilain ninyo
  rationale: Ang maramihang pautos mula sa רום ay panawagang itaas o kilalaning dakila ang Diyos. Natural at marangal sa makabagong Tagalog ang “dakilain,” at ang “ninyo” ay nagpapanatili sa maramihang kausap.
- source_word: יְהוָ֤ה
  choice: ang PANGINOON
  rationale: Ginagamit ang nakaugaliang magalang na salin ng banal na pangalan sa halip na tahasang transliterasyon; ipinakikita ng malalaking titik na tumutukoy ito sa יהוה.
- source_word: אֱלֹהֵ֗ינוּ
  choice: ating Diyos
  rationale: Tuwirang pinananatili ang unang panauhang maramihang hulapi at ang sama-samang pagkilala sa Diyos.
- source_word: וְֽהִשְׁתַּחֲווּ
  choice: at yumukod kayo
  rationale: Inilalarawan ng pandiwa ang aktuwal na pagyukod o pagpapatirapa bilang kilos ng pagsamba. Pinananatili ng “yumukod” ang pisikal na larawan nang mas natural kaysa “magpatirapa.”
- source_word: לַהֲדֹ֥ם רַגְלָ֗יו
  choice: sa tuntungan ng kanyang mga paa
  rationale: Tuwirang pinananatili ang larawang ‘tuntungan ng kanyang mga paa.’ Ang pang-ukol na ל ay isinaling “sa,” habang inilalagay sa talababa ang posibleng “sa harap ng.”
- source_word: קָד֥וֹשׁ הֽוּא
  choice: banal siya
  rationale: Natural na ayos ito sa kasalukuyang Tagalog at pinananatili ang tahasang panghalip na nagbibigay-diin sa Diyos bilang banal.
theological_decisions:
- issue: Tinutukoy ng “tuntungan ng kanyang mga paa”
  choice: Panatilihin ang talinghagang “tuntungan” nang hindi tinutukoy kung ito ang kaban, santuwaryo, o Zion.
  alternative: Tukuyin ito bilang kaban ng tipan, santuwaryo, o Zion.
  rationale: Hindi tahasang kinikilala ng talata ang bagay o lugar. Ang literal na larawan ay nagpapanatili sa sadyang pagiging di-tiyak ng teksto.
- issue: Kung saan o sa harap ng ano yumuyukod ang sumasamba
  choice: “sa tuntungan” sa pangunahing teksto, na may alternatibong “sa harap ng tuntungan” sa talababa.
  alternative: “sa harap ng tuntungan” lamang sa pangunahing teksto.
  rationale: Maaaring ipahayag ng ל ang kaugnayan o kinaroroonan sa kontekstong ito. Hindi dapat ipahiwatig na ang tuntungan mismo ang sinasamba, kaya nililinaw sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong patula sa tatlong maikling linya, ang maramihang mga pautos, ang pisikal na kilos ng pagyukod, at ang di-tiyak na larawan ng tuntungan.
