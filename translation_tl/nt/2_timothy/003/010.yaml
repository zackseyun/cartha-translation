source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: tl
  text: Ngunit sinundan mong mabuti ang aking turo, pamumuhay, layunin, pananampalataya[a], pasensya, pag-ibig, at matatag na pagtitiis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan.” Maaaring tumukoy ang salitang Griyego sa pananampalataya o sa katapatan sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ngunit ikaw naman
  rationale: Ipinakikita ng “ngunit” ang pagsalungat sa naunang paglalarawan, at pinananatili ng “ikaw naman” ang diin ng tahasang panghalip na Σὺ.
- source_word: παρηκολούθησάς
  choice: maingat na sumunod
  rationale: Saklaw nito ang masusing pagkilala at aktuwal na pagsunod sa turo at halimbawa ni Pablo, hindi lamang ang panonood o pagmamasid.
- source_word: μου
  choice: aking
  rationale: 'Likas na inuugnay ng panghalip ang lahat ng kasunod na katangian kay Pablo: “aking turo, pamumuhay,” at iba pa.'
- source_word: διδασκαλίᾳ
  choice: turo
  rationale: Karaniwan, malinaw, at makabagong katumbas ito na hindi labis na teknikal.
- source_word: ἀγωγῇ
  choice: pamumuhay
  rationale: Tumutukoy ang salita sa asal o paraan ng pamumuhay; mas natural dito ang “pamumuhay” kaysa sa mas makitid na “pag-uugali.”
- source_word: προθέσει
  choice: layunin
  rationale: Ipinahahayag nito ang itinakdang hangarin o mithiin ni Pablo.
- source_word: πίστει
  choice: pananampalataya
  rationale: Ito ang karaniwang katumbas ng πίστις; gayunman, posible rin sa talaang ito ang diwang “katapatan,” kaya inilagay ang alternatibo sa talababa.
- source_word: μακροθυμίᾳ
  choice: pagtitimpi
  rationale: Binibigyang-diin nito ang mahabang pasensiya at pagpipigil sa pakikitungo sa iba, at naihihiwalay ito sa ὑπομονή.
- source_word: ἀγάπῃ
  choice: pag-ibig
  rationale: Ito ang malinaw at karaniwang katumbas ng ἀγάπη sa makabagong Tagalog.
- source_word: ὑπομονῇ
  choice: matatag na pagtitiis
  rationale: Ipinahahayag nito ang matibay at nagpapatuloy na pagtitiis sa gitna ng pagsubok, habang nananatiling naiiba sa μακροθυμία.
theological_decisions:
- issue: Kahulugan ng πίστις sa talaan ng mga katangian ni Pablo
  choice: pananampalataya
  alternative: katapatan
  rationale: Maaaring tumukoy ang πίστις dito sa pagtitiwala o pananampalataya, ngunit maaari rin itong tumukoy sa pagiging tapat. Pinanatili sa pangunahing teksto ang karaniwang salin at inilagay sa talababa ang tunay na posibleng alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang anyong talaan at ang pangwakas na kuwit dahil nagpapatuloy ang pangungusap sa susunod na talata. Ang “pagtitimpi” at “matatag na pagtitiis” ay sadyang pinag-iba upang maipakita ang magkaibang diin ng μακροθυμία at ὑπομονή.
