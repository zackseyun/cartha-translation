base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: tl
  text: Kung paanong sinalungat nina Jannes at Jambres si Moises[a], gayundin sinasalungat ng mga taong ito ang katotohanan—mga taong tiwali ang pag-iisip at hindi karapat-dapat pagdating sa pananampalataya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilabanan nina Jannes at Jambres si Moises” ... “nilalabanan ng mga taong ito ang katotohanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pananampalataya” rito ay malamang na tumutukoy sa pananampalatayang Kristiyano o sa mensahe ng mga apostol, hindi lamang sa personal na paniniwala o pagtitiwala.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Kung paanong
  rationale: Likas na panimulang paghahambing sa Tagalog; hindi ginawang tahasang “ngunit” ang banayad na δέ upang maiwasan ang labis na pagdidiin sa pagsalungat.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Jannes at Jambres
  rationale: Pinanatili ang karaniwang anyo ng mga pangalang pantangi na makikilala ng mambabasang Tagalog.
- source_word: ἀντέστησαν Μωϋσεῖ
  choice: sinalungat ... si Moises
  rationale: Malinaw at natural na ipinapahayag ang aktibong pagtutol, at pinananatili ang ugnayan sa kasunod na ἀνθίστανται.
- source_word: οὕτως καὶ οὗτοι
  choice: gayundin ... ng mga taong ito
  rationale: Pinananatili ang katumbas na paghahambing at ang pagtukoy sa partikular na mga lalaking tinatalakay sa konteksto.
- source_word: ἀνθίστανται τῇ ἀληθείᾳ
  choice: sinasalungat ... ang katotohanan
  rationale: Ang aspektong nagpapatuloy ng kasalukuyang pandiwa ay ipinahihiwatig ng “sinasalungat”; hindi pinaliit ang saklaw ng “katotohanan” sa salin.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: mga taong tiwali ang pag-iisip
  rationale: Natural na Tagalog para sa kalagayang bunga ng pagkasira o katiwalian ng isip, nang hindi labis na nagpapaliwanag.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: hindi karapat-dapat kung tungkol sa pananampalataya
  rationale: Ipinapakita ng “hindi karapat-dapat” ang di-pagkapasa sa pagsubok o kawalan ng pagsang-ayon; ang pariralang “kung tungkol sa” ay nagpapanatili sa relasyong saklaw o pagtukoy ng περί.
theological_decisions:
- issue: Saklaw ng “katotohanan” at “pananampalataya”
  choice: Pinanatili ang malalawak na pariralang “ang katotohanan” at “ang pananampalataya.”
  alternative: Tahasang tukuyin ang ebanghelyo o aral ng mga apostol; o unawain ang pananampalataya bilang pansariling pagtitiwala.
  rationale: Malamang na tumutukoy ang mga ito sa mensaheng Kristiyano at sa kabuuan ng pananampalatayang Kristiyano, ngunit hindi iyon tahasang nilinaw ng Griyego; kaya pinanatili ang puwang ng kahulugan.
- issue: Paglalarawan sa ἄνθρωποι
  choice: “mga taong ito” at “mga taong”
  alternative: “mga lalaki” o isang ganap na pangkalahatang katawagan
  rationale: Sa Tagalog, ang “mga taong ito” ay natural na tumutukoy sa tiyak na grupong nasa konteksto nang hindi nagpapasok ng di-kailangang diin sa kasarian; hindi rin nito ginagawang sangkatauhan sa pangkalahatan ang tinutukoy.
- issue: Lakas ng ἀδόκιμοι
  choice: “hindi karapat-dapat”
  alternative: “bagsak sa pagsubok,” “itinakwil,” o “di-mapagkakatiwalaan”
  rationale: Pinananatili nito ang evaluative na diwa nang hindi tiyak na ipinapakahulugang walang kaligtasan o pormal nang itinakwil.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng dalawang pangungusap upang maging madaling basahin ang mga hulíng panuring, habang pinananatili ang kanilang pagtukoy sa parehong mga tao. Ang “kung paanong ... gayundin” ay likas na katumbas ng paghahambing sa Griyego.
