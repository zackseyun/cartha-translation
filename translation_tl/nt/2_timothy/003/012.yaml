id: 2TI.3.12
reference: 2 Timothy 3:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: tl
  text: At tunay nga, ang lahat ng nagnanais mamuhay nang maka-Diyos sa pakikipag-isa kay Mesiyas Jesus[a] ay pag-uusigin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pakikipag-isa kay Cristo Jesus.”
    reason: Alternatibong salin ng titulong Χριστός gamit ang tradisyonal at mala-pangalang anyong “Cristo.”
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: At tunay nga
  rationale: Pinagsasama nito ang ugnay sa naunang pahayag at ang banayad na pagpapatibay ng δέ, nang hindi ito ginagawang matinding pagsalungat.
- source_word: πάντες οἱ θέλοντες
  choice: ang lahat ng nagnanais
  rationale: Pinananatili ng “lahat” ang pangkalahatang saklaw, at malinaw na ipinahahayag ng “nagnanais” ang kusang hangarin ng θέλω.
- source_word: ζῆν εὐσεβῶς
  choice: mamuhay nang maka-Diyos
  rationale: Natural at maikli sa makabagong Tagalog; inilalarawan nito ang pamumuhay na may debosyon at paggalang sa Diyos, hindi lamang panlabas na moralidad.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa pakikipag-isa kay Mesiyas Jesus
  rationale: Ipinahahayag ang ἐν bilang larangan at kaugnayang kinaroroonan ng pamumuhay. Ginamit ang “Mesiyas” upang panatilihin ang titular na diwa ng Χριστός.
- source_word: διωχθήσονται
  choice: ay pag-uusigin
  rationale: Tuwirang isinasalin ang future passive at pinananatili ang tiyak na pahayag na daranas sila ng pag-uusig.
theological_decisions:
- issue: Titular o mala-pangalang salin ng Χριστῷ
  choice: Mesiyas Jesus
  alternative: Cristo Jesus
  rationale: May malinaw na puwersa bilang titulo ang Χριστός sa parirala; ang talababa ay nagpapanatili ng pamilyar na alternatibong anyo.
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: sa pakikipag-isa kay Mesiyas Jesus
  alternative: kay Mesiyas Jesus
  rationale: Iniiwasan nitong magmukhang si Jesus lamang ang tuwirang pinag-uukulan ng “maka-Diyos,” at mas malinaw na pinananatili ang ideya ng pamumuhay sa larangan ng kaugnayan o pakikipag-isa sa kanya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “maka-Diyos” ay madaling maunawaan ngunit nananatiling angkop sa banal na kasulatan; ang “pag-uusigin” ay tuwiran at matatag.
