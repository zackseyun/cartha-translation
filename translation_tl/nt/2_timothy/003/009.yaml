  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: tl
  text: Ngunit hindi na sila makasusulong nang higit[a], sapagkat magiging hayag sa lahat ang kanilang kahangalan, gaya rin ng naging hayag ang kahangalan ng mga taong iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi na sila magkakaroon ng karagdagang pagsulong.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga taong iyon” ay sina Janes at Jambres na binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: makasusulong
  rationale: Ang προκόπτω ay tumutukoy sa pagsulong o pag-unlad. Ang “makasusulong” ay natural sa Filipino at pinananatili ang larawan ng pagpapatuloy nang hindi nagpapahiwatig na mabuti ang kanilang ginagawa.
- source_word: ἐπὶ πλεῖον
  choice: pa
  rationale: Sa kasamang negasyong οὐ at “hindi na,” natural na ipinahahayag ng “pa” ang diwang hindi na sila makararating o makasusulong nang higit.
- source_word: ἄνοια
  choice: kahangalan
  rationale: Ipinahahayag ng ἄνοια ang kakulangan sa wastong pag-unawa o kamangmangan na may moral na bigat. Ang “kahangalan” ay malinaw, dignified, at karaniwan sa modernong Filipino.
- source_word: ἔκδηλος
  choice: mahahalata
  rationale: Ang ἔκδηλος ay nangangahulugang hayag o madaling makilala. Ang “mahahalata ng lahat” ay likas na Filipino at malinaw na nagsasaad na malalantad ang kanilang kahangalan.
- source_word: πᾶσιν
  choice: ng lahat
  rationale: Ang datibong πᾶσιν ay tumutukoy sa lahat ng makakakita o makauunawa; natural itong isinasama sa pariralang “mahahalata ng lahat.”
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: gaya rin ng nangyari sa kahangalan ng mga taong iyon
  rationale: 'Elliptical ang Griyego: ang ἡ ay bumabalik sa “kahangalan,” at ang ἐκείνων ay tumutukoy sa mga lalaking nabanggit sa naunang talata. Ginawang tahasan ang “kahangalan” upang maging malinaw at natural sa Filipino, habang pinananatili ng “mga taong iyon” ang anaporikong pagtukoy.'
theological_decisions:
- issue: Ang tinutukoy ng ἐκείνων
  choice: Ang “mga taong iyon” ay tumutukoy kina Janes at Jambres na binanggit sa 3:8.
  alternative: Maaaring unawain bilang mas pangkalahatang pagtukoy sa naunang mga huwad na guro o kalaban.
  rationale: Kina Janes at Jambres ang pinakamalapit na antecedent sa 3:8. Gayunman, pinanatili sa pangunahing teksto ang literal na “mga taong iyon” at inilagay sa talababa ang pagkakakilanlan upang hindi ipasok sa mismong salin ang paliwanag.
translation_notes:
  register: Modernong Filipino na natural at dignified. Ginamit ang “makasusulong” sa halip na mas teknikal na “progreso,” at “mahahalata ng lahat” para sa malinaw at madaling unawaing pagpapahayag ng pagiging hayag. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
