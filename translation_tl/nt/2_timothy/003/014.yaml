  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: tl
  text: Ngunit ikaw, manatili ka sa mga bagay na natutuhan mo at natiyak mo, at batid mo kung sinu-sino ang nagturo sa iyo ng mga ito.[a]
  philosophy: optimal-equivalence
