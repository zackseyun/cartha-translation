lexical_decisions:
- source_word: σὺ δὲ
  choice: Ngunit ikaw
  rationale: Hayag at mariin ang panghalip na σὺ, at ipinakikita ng δέ ang pagtutunggali sa mga taong inilarawan sa naunang talata. Likas at malinaw sa Tagalog ang “Ngunit ikaw.”
- source_word: μένε ἐν οἷς
  choice: manatili ka sa mga
  rationale: Ipinahihiwatig ng pangkasalukuyang pautos na μένε ang patuloy na pananatili o pagtitiyaga. Napananatili rin ng “sa mga” ang larawang ipinahahayag ng ἐν οἷς.
- source_word: ἔμαθες
  choice: natutuhan mo
  rationale: Tumutukoy ang aorist sa pagtuturong natanggap na ni Timoteo. Karaniwan at malinaw sa modernong Tagalog ang “natutuhan mo.”
- source_word: ἐπιστώθης
  choice: lubos mong pinaniwalaan
  rationale: Sa kontekstong ito, ipinahihiwatig ng anyong passive ang pagkakaroon ng matatag na katiyakan tungkol sa mga natutuhan. Natural sa Tagalog ang saling ito, samantalang inilalahad sa talababa ang alternatibong “lubos mong natiyak.”
- source_word: εἰδὼς
  choice: sapagkat alam mo
  rationale: Maaaring magpahiwatig ang participle ng dahilan o kasabay na kalagayan. Mas natural sa Tagalog ang sugnay na “sapagkat alam mo,” at ang konteksto ay angkop sa pansanhing diwa.
- source_word: παρὰ τίνων
  choice: kung kanino
  rationale: Ipinahihiwatig ng παρά na may genitive ang pinagmulan. Hindi tinutukoy sa pangunahing teksto kung sinu-sino ang mga guro, kaya pinananatiling bukas ang reperensiya.
- source_word: ἔμαθες
  choice: natutuhan ang mga ito
  rationale: Inuulit ng Griyego ang pandiwa. Idinagdag ang “ang mga ito” bilang likas na Tagalog na pagtukoy pabalik sa mga bagay na natutuhan, nang walang idinadagdag na bagong nilalaman.
theological_decisions:
- issue: Ang tinutukoy ng παρὰ τίνων
  choice: Isinalin bilang “kung kanino” nang hindi pinapangalanan ang guro o mga guro.
  alternative: Ang ilang manuskrito ay may anyong isahan, na madalas iugnay kay Pablo; ang anyong maramihan ay maaaring tumukoy nang mas malawak sa mga nagturo kay Timoteo.
  rationale: Maramihan ang pagbasa ng SBLGNT, ngunit hindi tahasang kinikilala ng talata ang mga tinutukoy. Iniiwasan ng salin ang paglilimita sa reperensiya batay sa isang tiyak na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “manatili” upang mapanatili ang larawan ng patuloy na pananatili sa natutuhang katotohanan. Inilagay ang mga talababa sa mismong pariralang kinauukulan.
