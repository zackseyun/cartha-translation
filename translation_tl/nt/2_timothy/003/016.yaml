  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: tl
  text: Ang bawat Kasulatan[a] ay kinasihan ng Diyos at kapaki-pakinabang[b] sa pagtuturo, sa pagsaway, sa pagtutuwid, at sa pagsasanay sa matuwid na pamumuhay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ang buong Kasulatan ay kinasihan ng Diyos at kapaki-pakinabang.” Ang pariralang Griyego na πᾶσα γραφή ay maaaring unawain nang distributibo (“bawat Kasulatan”) o kolektibo (“ang buong Kasulatan” o “lahat ng Kasulatan”).
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “Ang bawat Kasulatang kinasihan ng Diyos ay kapaki-pakinabang din sa pagtuturo, sa pagsaway, sa pagtutuwid, at sa pagsasanay sa matuwid na pamumuhay.”
    reason: alternative_reading
  - marker: c
    text: Ang salitang isinaling “matuwid na pamumuhay” ay maaari ring tumukoy sa “katuwiran” o, sa ilang konteksto ni Pablo, sa “katarungan.” Dito, ang diin ay sa paghubog sa pamumuhay nang matuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: ang bawat Kasulatan
  rationale: Pinananatili ng “bawat” ang distributibong anyo ng Griyego, samantalang ipinahihiwatig ng malaking titik sa “Kasulatan” ang mga sagradong kasulatan sa konteksto. Posible rin ang kolektibong “ang buong Kasulatan,” kaya inilagay iyon sa talababa.
- source_word: θεόπνευστος
  choice: mula sa hininga ng Diyos
  rationale: Malinaw nitong inilalarawan ang tambalang Griyego bilang nagmumula sa hininga ng Diyos, nang hindi isinasama ang mas huling teknikal na mga teorya tungkol sa pagkasi. Mas tuwiran ito kaysa sa tradisyonal ngunit mas interpretibong “kinasihan ng Diyos.”
- source_word: ὠφέλιμος
  choice: kapaki-pakinabang
  rationale: Karaniwan at malinaw na salitang Filipino para sa bagay na may pakinabang o mabuting gamit sa mga layuning kasunod.
- source_word: πρὸς διδασκαλίαν
  choice: sa pagtuturo
  rationale: Saklaw nito ang gawain at nilalaman ng pagtuturo at hindi ito nililimitahan sa teknikal na diwa ng doktrina.
- source_word: ἐλεγμόν
  choice: sa pagsaway
  rationale: Ipinahihiwatig nito ang paglalantad at pagtukoy sa mali. Likas itong basahin sa Filipino sa hanay ng mga gawaing nagtutuwid.
- source_word: ἐπανόρθωσιν
  choice: sa pagtutuwid
  rationale: Naipapahayag nito ang pagbabalik sa tama o pag-aayos ng mali sa isang maikli at likas na paraan.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: sa pagsasanay sa matuwid na pamumuhay
  rationale: Ang “pagsasanay” ay nagpapahayag ng patuloy na paghubog at disiplina. Sa kontekstong ito, ang δικαιοσύνη ay tumutukoy sa paghubog tungo sa matuwid na asal, kaya mas malinaw sa ordinaryong mambabasa ang “matuwid na pamumuhay” kaysa sa abstraktong “katuwiran.”
- source_word: δικαιοσύνῃ
  choice: matuwid na pamumuhay
  rationale: Sa talatang ito, ang diwa ay praktikal at moral na paghubog sa pamumuhay nang tama. Ang posibleng kahulugang “katarungan” ay pinanatili sa talababa.
theological_decisions:
- issue: Kaugnayang sintaktiko ng θεόπνευστος at ὠφέλιμος sa πᾶσα γραφή
  choice: 'Kapuwa ginamit bilang panaguri: “Ang bawat Kasulatan ay mula sa hininga ng Diyos at kapaki-pakinabang.”'
  alternative: “Ang bawat Kasulatang mula sa hininga ng Diyos ay kapaki-pakinabang din…”
  rationale: Pinakamadulas sa daloy ng pangungusap at sa kasunod na talata ang pagbasa sa dalawang pang-uri bilang magkatambal na panaguri. Gayunman, posible sa balarila ang pagbasa sa θεόπνευστος bilang panuring, kaya hayagang pinanatili ang alternatibo sa talababa.
- issue: Distributibo o kolektibong kahulugan ng πᾶσα γραφή
  choice: “ang bawat Kasulatan”
  alternative: “ang buong Kasulatan” o “lahat ng Kasulatan”
  rationale: Mas tuwirang pinananatili ng “bawat” ang anyong walang pantukoy sa Griyego, ngunit tunay na posible ang kolektibong pagkaunawa. Hindi nilutas nang tahimik ang kalabuan; inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Kasulatan” bilang karaniwang katawagan sa sagradong mga sulatin. Ang “mula sa hininga ng Diyos” ay sadyang kongkreto at tapat sa anyo ng θεόπνευστος; ang “matuwid na pamumuhay” naman ay pinili upang maging likas at praktikal ang diwa ng δικαιοσύνη sa kontekstong ito.
