id: 2TI.3.17
reference: 2 Timothy 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: tl
  text: upang ang tao ng Diyos[b] ay maging ganap, lubos na naihanda[a] para sa bawat mabuting gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubos na nasangkapan.” Ang ἐξηρτισμένος ay tumutukoy sa lubusang paghahanda o paglalaan ng lahat ng kailangan.
    reason: lexical_alternative
  - marker: b
    text: Ang “tao ng Diyos” ay panlalaking isahan sa Griyego at malamang na isang kinikilalang katawagang biblikal. Maaari itong tumukoy lalo na sa lingkod ng Diyos, ngunit maaari ring magkaroon ng mas malawak na pagkakapit sa mananampalatayang hinuhubog ng Kasulatan.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa sugnay na nagsasaad ng layunin at pinananatili ang ugnayan sa naunang talata.
- source_word: ἄρτιος
  choice: ganap
  rationale: Ipinahahayag ang pagiging buo, karapat-dapat, at may sapat na kakayahan nang hindi tahasang nangangahulugang walang kasalanan.
- source_word: ᾖ
  choice: ay maging
  rationale: Ang anyong ito ay natural na naghahayag sa Filipino ng nilalayong kalagayan sa sugnay na pinangungunahan ng “upang.”
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: ang tao ng Diyos
  rationale: Pinananatili ang kinikilalang katawagang biblikal. Ang “tao” sa Filipino ay natural at hindi kailangang tukuyin ang kasarian, samantalang ipinapaliwanag sa talababa ang anyong panlalaking isahan ng Griyego.
- source_word: πρὸς
  choice: para sa
  rationale: Malinaw na ipinakikita ang pagiging handa o angkop para sa layuning tinutukoy.
- source_word: πᾶν ἔργον ἀγαθόν
  choice: bawat mabuting gawa
  rationale: Pinananatili ang distributibong diwa ng πᾶν at ang moral na katangian ng gawa.
- source_word: ἐξηρτισμένος
  choice: lubos na naihanda
  rationale: 'Ipinahahayag ang kinalabasan ng perpektong balintiyak na pandiwari: ang tao ay lubusang inihanda o sinangkapan. Mas natural ito sa kasalukuyang Filipino kaysa sa literal na “nasangkapan.”'
theological_decisions:
- issue: Ang panlalaking isahang anyo ng ὁ τοῦ θεοῦ ἄνθρωπος
  choice: ang tao ng Diyos
  alternative: ang lingkod ng Diyos
  rationale: Ang “tao ng Diyos” ay nagpapanatili sa kinikilalang katawagang biblikal at hindi nililimitahan ang kahulugan sa isang tungkulin lamang. Bagaman panlalaking isahan ang Griyego at maaaring pangunahing tumukoy sa ministro ng Diyos sa konteksto, hindi likas na may kasariang panlalaki ang salitang Filipino na “tao”; nililinaw sa talababa ang anyo at saklaw ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang katawagang biblikal na “tao ng Diyos,” habang ginamit ang mas natural na “lubos na naihanda” sa pangunahing teksto at inilagay sa talababa ang mas literal na “lubos na nasangkapan.”
