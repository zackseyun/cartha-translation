  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: tl
  text: at mula pa sa pagkasanggol ay alam mo ang mga sagradong kasulatan[a], na makapagpaparunong sa iyo tungo sa kaligtasan sa pamamagitan ng pananampalataya kay Mesiyas Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga banal na Kasulatan.” Literal sa Griyego: “mga sagradong sulatin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: mula pa noong sanggol ka
  rationale: Ipinananatili nito ang tiyak na diwa ng βρέφος bilang sanggol o napakabatang bata, at mas natural ito sa makabagong Tagalog kaysa sa mas abstraktong “mula sa pagkasanggol.”
- source_word: ἱερὰ γράμματα
  choice: mga sagradong kasulatan
  rationale: Malapit ito sa literal na “sacred writings” at hindi agad ipinapalit ang mas teknikal na katawagang “Banal na Kasulatan,” bagaman malinaw na tumutukoy ito sa mga kasulatang kinikilalang banal.
- source_word: οἶδας
  choice: alam mo na
  rationale: Bagaman perpekto ang anyo ng pandiwa sa Griyego, pangkasalukuyan ang diwa nito. Kasama ng “mula pa noong sanggol ka,” ipinahihiwatig ng “alam mo na” ang kaalamang matagal nang taglay.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: na makapagpaparunong sa iyo
  rationale: Direkta nitong pinananatili na ang mga kasulatan ang may kakayahang magbigay o humubog ng karunungan sa tumatanggap.
- source_word: εἰς σωτηρίαν
  choice: tungo sa kaligtasan
  rationale: Ipinapahayag ng “tungo sa” ang layon o patutunguhang diwa ng εἰς nang hindi ipinapalagay na ang karunungan mismo ang awtomatikong sanhi ng kaligtasan.
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Karaniwan at malinaw na salin ito ng instrumental na parirala, at pinananatili ang pangunahing diwa ng πίστις bilang pananampalataya sa kontekstong ito.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kay Mesiyas Jesus
  rationale: Sa likas na Tagalog, “kay” ang karaniwang gamit para sa pananampalatayang nakatuon sa isang persona. Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatili ang pangalang Jesus.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o ituturing na bahagi lamang ng pangalan
  choice: Mesiyas Jesus
  alternative: Cristo Jesus
  rationale: May tunay na kahulugan bilang titulo ang Χριστός sa parirala, kaya “Mesiyas” ang ginamit sa halip na gawing nakasanayang anyong parang pangalan lamang.
- issue: Ang diwa ng πίστεως sa διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: pananampalataya kay Mesiyas Jesus
  alternative: katapatan ni Mesiyas Jesus
  rationale: Pinakanatural sa balarila at konteksto na tumukoy ito sa pananampalatayang nakatuon kay Mesiyas Jesus. Gayunman, dahil maaaring magdala ang πίστις ng diwang “katapatan,” pinanatili sa talababa ang hindi gaanong malamang na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sagradong kasulatan” upang manatiling malapit sa ἱερὰ γράμματα, at “mula pa noong sanggol ka” upang likas ngunit tiyak na maipahayag ang ἀπὸ βρέφους. Pinanatili ang anyong pandugtong ng talata sa pamamagitan ng panimulang “at,” sapagkat nagpapatuloy ito sa naunang pangungusap.
