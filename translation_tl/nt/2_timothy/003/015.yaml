  - severity: low
    issue: Ang “alam mo na” ay maaaring magtunog na may aspektong ‘already’ sa halip na simpleng patuloy na kaalamang taglay mula pagkasanggol.
    rationale: Ang οἶδας ay may pangkasalukuyang diwa; sapat na ang “alam mo” kapag malinaw na ang saklaw na “mula pa sa pagkasanggol.”
