  text: walang likas na pagmamahal sa pamilya, ayaw makipagkasundo[a], mapanirang-puri[b], walang pagpipigil sa sarili, mababangis, at walang pag-ibig sa mabuti[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi mapagkasundo,” “hindi mapagpalubag,” o “sumisira sa kasunduan.”
