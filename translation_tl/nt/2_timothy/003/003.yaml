    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: walang likas na pagmamahal sa pamilya
  rationale: Tinutukoy ng ἄστοργοι ang kawalan ng pagmamahal na likas na inaasahan lalo na sa pamilya o malalapit na kamag-anak. Nililinaw ng salin ang ugnayang tinutukoy nang hindi ito ginagawang pangkalahatang kawalan ng anumang pag-ibig.
- source_word: ἄσπονδοι
  choice: ayaw makipagkasundo
  rationale: Ipinahihiwatig ng salita ang pagtangging makipagkasundo o tumanggap ng mga tuntunin ng kapayapaan. Natural ito sa makabagong Tagalog at hindi ipinapalagay na may dati nang kasunduang sinira.
- source_word: διάβολοι
  choice: mapanirang-puri
  rationale: Sa maramihang talaan ng masasamang asal, tumutukoy ito sa mga taong naninirang-puri o nagpaparatang, hindi sa Diyablo bilang isang tiyak na persona.
- source_word: ἀκρατεῖς
  choice: walang pagpipigil sa sarili
  rationale: Malinaw nitong ipinahahayag ang kawalan ng pamamahala sa sariling pagnanasa o bugso ng damdamin.
- source_word: ἀνήμεροι
  choice: mababangis
  rationale: Ipinapahayag nito ang pagiging mailap, marahas, o brutal; ang 'mababangis' ay maikli, natural, at angkop sa anyo ng talaan.
- source_word: ἀφιλάγαθοι
  choice: walang pag-ibig sa mabuti
  rationale: Pinananatili nito ang literal na diwa ng kawalan ng pagmamahal sa kung ano ang mabuti, nang hindi pinatitindi ang kahulugan tungo sa aktibong pagkapoot.
theological_decisions:
- issue: Kahulugan ng διάβολοι sa talaan ng masasamang asal
  choice: Karaniwang pang-uri na nangangahulugang “mapanirang-puri,” hindi pagtukoy sa mga diyablo o sa Diyablo
  alternative: “mga diyablo” o “mala-diyablo”
  rationale: Ang maramihang anyo at ang konteksto ng magkakasunod na paglalarawan sa asal ay nagpapakitang moral na katangian ang tinutukoy. Ang pagsasaling “mga diyablo” ay maaaring maling magpahiwatig na pagkakakilanlan ng mga nilalang, sa halip na pag-uugali.
- issue: Lakas ng kahulugan ng ἀφιλάγαθοι
  choice: “walang pag-ibig sa mabuti”
  alternative: “napopoot sa mabuti”
  rationale: Ang anyong may privative na ἀ- ay tuwirang nagsasaad ng hindi pag-ibig sa mabuti. Hindi ipinapasok sa pangunahing teksto ang mas matinding aktibong pagkapoot, ngunit pinananatili itong posibleng alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at magkakatulad na anyo ng talaan ng masasamang asal, habang nilinaw ang natatanging diwa ng pagmamahal sa pamilya at iniwasan ang maling personal o demonikong pagbasa sa διάβολοι.
