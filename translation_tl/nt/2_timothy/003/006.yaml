base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: tl
  text: Sapagkat kabilang sa kanila ang mga palihim na sumusuot sa mga sambahayan at bumibihag sa mahihinang babae[a] na nabibigatan ng mga kasalanan[b] at inaakay ng sari-saring pagnanasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, isang diminutibo at mapanghamak na tawag na literal na “maliliit na babae”; sa konteksto, tumutukoy ito sa mga babaeng mahina o madaling mabiktima.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “natambakan ng mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: kabilang sa kanila
  rationale: Ipinahihiwatig ng parirala na ang tinutukoy na mga tao ay bahagi ng pangkat na inilarawan sa naunang konteksto; natural ito sa modernong Tagalog.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: mga palihim na sumusuot sa mga sambahayan
  rationale: Pinananatili ng “palihim na sumusuot” ang diwa ng mapanlinlang o patagong pagpasok, samantalang ipinakikita ng “mga sambahayan” na ang pinapasok ay hindi lamang mga gusali kundi ang larangang pantahanan.
- source_word: αἰχμαλωτίζοντες
  choice: bumibihag
  rationale: Direktang pinananatili nito ang larawan ng pagkuha ng mga bihag at ang diwa ng pagkontrol sa kanila.
- source_word: γυναικάρια
  choice: mahihinang babae
  rationale: Ang diminutibong pangngalan ay mapanghamak sa kontekstong ito at tumutukoy sa isang madaling mabiktimang pangkat ng kababaihan, hindi sa lahat ng babae. Iniiwasan ng salin ang nakalilitong literal na “maliliit na babae.”
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: nabibigatan sa mga kasalanan
  rationale: Ipinahahayag nito sa natural na Tagalog ang naiipong bigat ng mga kasalanan na taglay ng perfect passive participle.
- source_word: ἀγόμενα
  choice: inaakay
  rationale: Pinananatili nito ang pasibong larawan ng mga taong dinadala o kinokontrol ng isang impluwensiya nang hindi pinalalabis ang pandiwa bilang sapilitang pagtaboy.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: ng sari-saring pagnanasa
  rationale: Malinaw at malawak ang “pagnanasa” para sa mga pagnanais na may negatibong moral na diwa rito, at tapat na ipinakikita ng “sari-sari” ang ποικίλαις.
theological_decisions:
- issue: Ang mapanghamak na diminutibong γυναικάρια
  choice: mahihinang babae
  alternative: maliliit na babae; mga babaeng madaling mabiktima
  rationale: Pinananatili ang pagsaway sa kahinaan o pagiging madaling mabiktima ng partikular na mga babae sa konteksto, ngunit hindi ginagawang pangkalahatang pahayag tungkol sa kababaihan. Ipinaliliwanag sa talababa ang literal at mapanghamak na anyo.
- issue: Ang saklaw ng οἰκίας
  choice: mga sambahayan
  alternative: mga bahay; mga tahanan
  rationale: Ang “mga sambahayan” ay angkop sa panlipunan at pantahanang larangan na pinapasok ng mga huwad na guro, hindi lamang sa pisikal na gusali.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, ngunit pinananatili ang matalas na pagsaway at ang mga larawan ng palihim na pagpasok, pagbihag, at pag-akay. Ginamit ang “sambahayan” upang idiin ang pantahanang larangan ng impluwensiya.
