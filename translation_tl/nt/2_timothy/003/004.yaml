lexical_decisions:
- source_word: προδόται
  choice: mga taksil
  rationale: Tumutukoy ito sa mga taong nagtataksil o hindi tapat. Likas at mabigat sa makabagong Filipino ang “mga taksil” sa ganitong talaan ng masasamang ugali.
- source_word: προπετεῖς
  choice: padalos-dalos
  rationale: Inilalarawan nito ang pagkilos nang pabigla-bigla at walang maingat na pagsasaalang-alang; malinaw at natural sa Filipino ang “padalos-dalos.”
- source_word: τετυφωμένοι
  choice: mga nagmamalaki
  rationale: Ang ganap na balintiyak na pandiwaring ito ay may larawang tila napintog at tumutukoy sa kapalaluan o labis na pagtingin sa sarili. Pinili ang natural na kahulugang “mga nagmamalaki,” habang inilalagay sa talababa ang mas matalinghagang anyo.
- source_word: φιλήδονοι
  choice: mas maibigin sa kalayawan
  rationale: Ang tambalang salita ay nangangahulugang umiibig sa kasiyahan o kalayawan. Ang “maibigin sa kalayawan” ay marangal at malinaw, at kaagapay ng paghahambing na kasunod.
- source_word: μᾶλλον ἢ
  choice: mas … kaysa
  rationale: Pinananatili nito ang paghahambing o nangingibabaw na pagkiling na maaaring ipahiwatig ng Griyego, sa halip na lubusang gawing eksklusibong pagsalungat.
- source_word: φιλόθεοι
  choice: sa Diyos
  rationale: Sa buong pariralang “mas maibigin sa kalayawan kaysa sa Diyos,” malinaw na ang Diyos ang dapat ibigin. Natural ito sa Filipino at pinananatili ang pagtutulad ng dalawang layon ng pag-ibig.
theological_decisions:
- issue: Ang paghahambing sa pag-ibig sa kalayawan at pag-ibig sa Diyos
  choice: “mas maibigin sa kalayawan kaysa sa Diyos”
  alternative: “umiibig sa kalayawan sa halip na sa Diyos”
  rationale: Maaaring magpahiwatig ang μᾶλλον ἢ ng paghahambing o pagpili. Ang “mas … kaysa” ay nagpapanatili sa tunay na paghahambing at hindi nagpapasok ng mas ganap na eksklusibong kahulugan kaysa sa hayagang sinasabi ng teksto.
- issue: Paglalarawan ng τετυφωμένοι
  choice: “mga nagmamalaki” na may talababa sa metapora
  alternative: “mga mapagmataas” o “mga napintog sa kapalaluan”
  rationale: Moral na paglalarawan ito, hindi teknikal na doktrina. Ang pangunahing teksto ay natural sa Filipino, samantalang iniingatan ng talababa ang larawan at aspetong ganap ng Griyego.
translation_notes:
  register: Makabagong Filipino na natural, maikli, at marangal, na angkop sa sunod-sunod na talaan ng masasamang ugali. Ginamit ang “kalayawan” upang ipahayag ang hedonistic na diwa nang hindi nagiging kolokyal; pinanatili ang kuwit sa dulo dahil bahagi lamang ito ng nagpapatuloy na pangungusap.
