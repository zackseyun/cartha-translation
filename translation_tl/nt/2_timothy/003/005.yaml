  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: tl
  text: May anyo[a] sila ng maka-Diyos na pamumuhay, ngunit itinakwil nila ang kapangyarihan nito; layuan[b] mo ang mga taong ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panlabas na anyo ng maka-Diyos na pamumuhay.” Maaari ring idiin ng salitang Griego ang nakikitang anyo o pagkakahubog.
    reason: lexical_alternative
  - marker: b
    text: O “iwasan mo ang mga taong ito” o “lumayo ka sa kanila.” Ang pandiwa ay may diwang ilayo ang sarili sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: taglay
  rationale: Likas at tuwirang salin ng kasalukuyang participle na naglalarawan sa mga taong binanggit sa naunang konteksto.
- source_word: μόρφωσιν
  choice: anyo
  rationale: Pinananatili ang kaibahan ng panlabas na anyo at ng kapangyarihang wala sa kanilang buhay, nang hindi ipinapalagay na ganap na pagpapanggap lamang ito.
- source_word: εὐσεβείας
  choice: maka-Diyos na pamumuhay
  rationale: Ipinahahayag sa pangkaraniwang modernong Filipino ang paggalang at pamumuhay na nakatuon sa Diyos na karaniwang diwa ng εὐσέβεια sa mga Liham Pastoral.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: ngunit itinatanggi ang kapangyarihan nito
  rationale: Pinananatili ang malawak na diwa ng δύναμις bilang mabisang realidad ng maka-Diyos na pamumuhay, nang hindi nililimitahan sa himala, pagbabagong moral, o isang tiyak na mekanismong teolohikal.
- source_word: ἠρνημένοι
  choice: itinatanggi
  rationale: Natural sa Filipino at malinaw na nagpapahayag ng patuloy o matatag na pagtanggi; sa konteksto, ang perpektong participle ay tumutukoy sa paninindigang pinanghahawakan nila.
- source_word: καὶ τούτους ἀποτρέπου
  choice: layuan mo rin ang mga taong ito
  rationale: Ang προστακτική na middle na ἀποτρέπου ay humihiling na ilayo ng mambabasa ang sarili sa kanila; ang “layuan” ay malinaw, natural, at tuwirang pautos.
theological_decisions:
- issue: Kaibahan ng panlabas na relihiyosong anyo at ng mabisang realidad nito
  choice: “anyo ng maka-Diyos na pamumuhay” at “kapangyarihan nito”
  alternative: “anyong maka-Diyos” o “panlabas na anyo ng kabanalan”
  rationale: Pinananatili ang tensiyon sa pagitan ng nakikitang anyo at kapangyarihan nang hindi tinutukoy kung ang kapangyarihan ay eksklusibong mga himala, pagbabagong moral, o gawain ng Espiritu.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “maka-Diyos na pamumuhay” sa halip na mas lumang “kabanalan” upang malinaw na maipahayag ang εὐσέβεια bilang paggalang sa Diyos na nahahayag sa buhay. Inilagay ang mga pananda ng talababa pagkatapos ng buong pangungusap, kaugnay ayon sa pagkakasunod sa “anyo” at “layuan.”
