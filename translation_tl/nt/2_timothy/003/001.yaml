  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: tl
  text: 'Ngunit tandaan mo ito: sa mga huling araw ay darating ang mabibigat na panahon[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahirap na panahon” o “mapanganib na panahon.” Ang salitang Griyego ay maaaring tumukoy sa mga panahong mahirap harapin, mapanganib, o mabigat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ito
  rationale: Ang panghalip na ito ay tumuturo sa nilalaman ng kasunod na sugnay; natural at tuwiran ang “ito” sa Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa naunang konteksto. Pinananatili ng “Ngunit” ang ugnayang iyon nang hindi ito labis na pinaiigting.
- source_word: γίνωσκε
  choice: alamin mo
  rationale: Pautos ito sa ikalawang panauhang isahan. Malinaw at natural ang “alamin mo” bilang panawagang kilalanin at isaisip ang realidad na kasunod.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala nito ang nilalaman ng dapat malaman. Mas natural sa Tagalog ang tutuldok pagkatapos ng “alamin mo ito” kaysa sa tahasang “na.”
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: sa mga huling araw
  rationale: Pinananatili nito ang kinikilalang eskatolohikal na parirala nang hindi nililimitahan ang saklaw ng panahong tinutukoy.
- source_word: ἐνστήσονται
  choice: darating
  rationale: Ang pandiwa ay tumutukoy sa pagdating o pagsapit at pagiging presente. Likas na kaakibat ng “mga panahon” ang “darating” sa modernong Tagalog.
- source_word: καιροὶ
  choice: mga panahon
  rationale: Ang καιρός ay mga takdang yugto o panahon, hindi lamang oras ayon sa kronolohiya. Malinaw at malawak ang “mga panahon.”
- source_word: χαλεποί
  choice: mahihirap
  rationale: Maaaring tumukoy ang χαλεπός sa mahirap, mapanganib, mabigat, o malupit. Ang “mahihirap” ang pinakamalawak at natural na pangunahing salin, habang inilalahad sa talababa ang iba pang tunay na posibilidad.
theological_decisions:
- issue: Kahulugan ng “mga huling araw”
  choice: Panatilihin ang pariralang “sa mga huling araw” nang hindi ito nililimitahan sa panahon lamang na kaagad bago ang pagbabalik ni Cristo.
  alternative: Unawain ito bilang huling yugto bago ang wakas, o bilang mas malawak na panahong eskatolohikal na nagsimula na.
  rationale: May bigat na eskatolohikal ang parirala at pinahihintulutan ng teksto ang higit sa isang pag-unawa sa saklaw nito. Pinananatili ng salin ang tensiyong ito sa halip na magpasok ng isang tiyak na sistemang eskatolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “alamin mo” upang panatilihin ang ikalawang panauhang isahan at ang lakas ng pautos; iniwasan ang mas makaluma o labis na teknikal na pananalita.
