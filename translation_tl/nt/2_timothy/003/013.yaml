  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: tl
  text: Ngunit ang masasamang tao at mga impostor[a] ay lalo pang sasama[b], na nanlilinlang ngunit nalilinlang din.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bulaang mandaraya” o “mga manlilinlang.” Ang salitang Griyego ay maaaring tumukoy sa mga tusong mapanlinlang at, sa ilang konteksto, ay may pahiwatig ng pangkukulam o huwad na panggagamot.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “susulong tungo sa mas masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: masasamang
  rationale: Ipinahahayag ang moral na kasamaan, hindi lamang ang pagiging hindi kanais-nais o mababa ang kalidad.
- source_word: δὲ
  choice: Ngunit
  rationale: Likas na ipinakikita ang pagsalungat sa naunang pahayag tungkol kay Timoteo at sa mga tapat.
- source_word: ἄνθρωποι
  choice: tao
  rationale: Pangkalahatan ang tinutukoy ng Griyego at hindi lamang mga lalaki; natural at inklusibo ang “tao” sa Filipino.
- source_word: γόητες
  choice: mga impostor
  rationale: Tumutukoy sa mga mapanlinlang na huwad o mandaraya; hindi nito labis na itinatakda ang posibleng pahiwatig ng pangkukulam o huwad na panggagamot.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: ay lalo pang sasama
  rationale: Natural na Filipino para sa ironikong pag-usad tungo sa mas masamang kalagayan, habang pinananatili ang ideya ng patuloy na paglala.
- source_word: πλανῶντες
  choice: habang nanlilinlang
  rationale: Pinananatili ang nagpapatuloy na kilos ng aktibong panlilinlang.
- source_word: πλανώμενοι
  choice: sila mismo ay nalilinlang
  rationale: Pinananatili ang pasibong diwa at nililinaw ang tensiyon na ang mga nanlilinlang ay sila ring nalilinlang.
theological_decisions:
- issue: Kasarian ng ἄνθρωποι
  choice: tao
  alternative: mga lalaki
  rationale: Masculine plural ang anyong gramatikal ngunit pangkalahatan ang kahulugan; walang batayan sa konteksto upang limitahan ito sa mga lalaki.
- issue: Saklaw ng kahulugan ng γόητες
  choice: mga impostor
  alternative: mga salamangkero; mga bulaang mandaraya
  rationale: Ang konteksto ay nakatuon sa pandaraya at paglihis. Iniiwasan ng “impostor” ang pagpasok ng tiyak na paratang na okultismo, habang itinatala sa talababa ang mas malawak na saklaw ng salita.
- issue: Magkasabay na aktibo at pasibong πλανάω
  choice: nanlilinlang at sila mismo ay nalilinlang
  alternative: nagliligaw at naliligaw
  rationale: 'Pinananatili ang teolohikal at retorikal na tensiyon: gumagawa sila ng panlilinlang ngunit mga biktima rin sila nito, nang hindi tinutukoy kung sino ang nanlilinlang sa kanila.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalo pang sasama” bilang natural na katumbas ng ironikong pag-usad tungo sa mas masama; pinanatili sa talababa ang literal na larawan. Ang “sila mismo” ay nagbibigay-diin sa balanseng pagkakasunod ng aktibong panlilinlang at pasibong pagkalinlang.
