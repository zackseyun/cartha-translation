id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: tl
  text: Sapagkat ang mga tao ay magiging maibigin sa sarili, maibigin sa salapi, hambog, mapagmataas, mapanlait[a], suwail sa mga magulang, walang utang na loob, at hindi banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapamusong” o “mapang-abuso sa pananalita.” Maaaring tumukoy ang salitang Griyego sa pananalitang lumalapastangan sa tao o sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ay magiging
  rationale: Tuwirang ipinahahayag ang panghinaharap na anyo ng εἰμί sa natural na Filipino.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: οἱ ἄνθρωποι
  choice: ang mga tao
  rationale: Pangkalahatan ang tinutukoy ng panlalaking anyong Griyego, hindi lamang mga lalaki.
- source_word: φίλαυτοι
  choice: maibigin sa sarili
  rationale: Pinananatili ang diwa ng pag-ibig na nakatuon sa sarili at ang pagkakatulad ng anyo nito sa kasunod na φιλάργυροι.
- source_word: φιλάργυροι
  choice: maibigin sa salapi
  rationale: Malapit sa literal na diwang 'umiibig sa salapi' at mas tiyak kaysa sa pangkalahatang 'sakim.'
- source_word: ἀλαζόνες
  choice: hambog
  rationale: Ipinahahayag ang pagyayabang at mapagkunwaring pagpapasikat sa maikli at natural na salita.
- source_word: ὑπερήφανοι
  choice: mapagmataas
  rationale: Nililinaw ang negatibong moral na diwa ng palalong pagtingin sa sarili at itinatangi ito sa pagyayabang ng ἀλαζόνες.
- source_word: βλάσφημοι
  choice: mapanirang magsalita
  rationale: Sinasaklaw ang mapanira at mapang-abusong pananalita nang hindi nililimitahan ang maaaring pinatutungkulan nito sa tao o sa Diyos; inilalahad sa talababa ang ibang posibleng salin.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: suwail sa mga magulang
  rationale: Natural at matimbang na Filipino para sa pagtangging sumunod sa mga magulang.
- source_word: ἀχάριστοι
  choice: walang utang na loob
  rationale: Karaniwang idyomang Filipino para sa kawalan ng pasasalamat, nang hindi ipinahihiwatig na literal na may pagkakautang.
- source_word: ἀνόσιοι
  choice: hindi banal
  rationale: Pinananatili ang moral at panrelihiyong diwa ng kawalan ng kabanalan o paggalang sa sagrado.
theological_decisions:
- issue: Pangkalahatang saklaw ng οἱ ἄνθρωποι
  choice: ang mga tao
  alternative: ang mga lalaki; ang sangkatauhan
  rationale: Pangkalahatan ang reperensiya sa mga tao at walang batayan upang ilimita ito sa kalalakihan.
- issue: Saklaw ng kahulugan ng βλάσφημοι
  choice: mapanirang magsalita
  alternative: mapamusong; mapang-abuso sa pananalita
  rationale: Maaaring tumukoy ang salita sa pananalitang lumalapastangan sa Diyos o sumisira at umaabuso sa kapuwa. Hindi tahasang nilulutas ng konteksto ang saklaw, kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na ritmo ng talaan ng mga bisyo at ang pagkakaiba ng “hambog” at “mapagmataas.” Inilipat ang marker [a] sa “mapanirang magsalita,” ang katumbas ng βλάσφημοι na siyang tinatalakay ng talababa.
