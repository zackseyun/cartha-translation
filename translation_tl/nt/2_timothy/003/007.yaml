base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: tl
  text: na laging nag-aaral ngunit hindi kailanman kayang makarating sa pagkakilala sa katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ganap na pagkakilala sa katotohanan.” Maaaring taglayin ng salitang Griyego ang diwa ng mas buo o ganap na pagkakilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: laging
  rationale: Ipinahahayag ang tuloy-tuloy o paulit-ulit na kalagayan at malinaw na itinatambal sa μηδέποτε.
- source_word: μανθάνοντα
  choice: nag-aaral
  rationale: Pinananatili ang nagpapatuloy na kilos ng kasalukuyang pandiwaring Griyego nang hindi tinutukoy kung pormal o di-pormal ang pagtuturo.
- source_word: μηδέποτε
  choice: hindi kailanman
  rationale: 'Pinananatili ang mariing pagsalungat sa πάντοτε: laging nag-aaral, ngunit hindi kailanman nakararating.'
- source_word: εἰς ἐπίγνωσιν
  choice: sa pagkakilala
  rationale: Ang pariralang may εἰς ay nagpapahiwatig ng pagdating sa tunay na pagkilala o kaalaman. Likas sa Filipino ang “makarating sa pagkakilala,” at hindi nito ipinipilit sa pangunahing teksto ang mas malakas na diwang “ganap.”
- source_word: ἀληθείας
  choice: sa katotohanan
  rationale: Ang genitibo ay likas na naipahahayag sa Filipino sa pariralang “pagkakilala sa katotohanan,” na tumutukoy sa katotohanang pinag-uusapan sa konteksto.
- source_word: ἐλθεῖν
  choice: makarating
  rationale: Pinananatili ang talinghaga ng pagdating sa isang hantungan at natural itong kaugnay ng “pagkakilala.”
- source_word: δυνάμενα
  choice: nagagawang
  rationale: Malinaw na ipinahahayag ang kakayahan sa likas na pariralang Filipino na “hindi kailanman nagagawang makarating.”
theological_decisions:
- issue: Diwa ng ἐπίγνωσις
  choice: pagkakilala
  alternative: ganap na pagkakilala
  rationale: Maaaring magpahiwatig ang ἐπίγνωσις ng mas buo o ganap na pagkakilala, ngunit hindi kailangang gawing teknikal ang pagkakaibang iyon dito. Pinananatili sa talababa ang posibleng mas malakas na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Nagsisimula sa “na” dahil ang mga pandiwaring pambabae at maramihan sa Griyego ay nagpapatuloy sa tinutukoy na mga babae sa naunang talata.
