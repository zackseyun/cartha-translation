  terminology: Ang “mga pag-uusig,” “mga pagdurusa,” “iniligtas,” at “Panginoon” ay angkop. Pinananatili ang mga nakaugaliang anyong Filipino ng mga pangalan ng lugar at hindi tinutukoy nang tahasan ang Panginoon bilang Jesus sa pangunahing teksto.
