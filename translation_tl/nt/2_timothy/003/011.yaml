  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: tl
  text: ang mga pag-uusig at mga pagdurusa, tulad ng mga naranasan ko sa Antioquia, sa Iconio, at sa Listra—anong mga pag-uusig ang tiniis ko![a] At iniligtas ako ng Panginoon[b] mula sa lahat ng ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “anong uri ng mga pag-uusig ang tiniis ko!”'
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “Panginoon” ay tumutukoy sa Panginoong Jesus, bagaman “ang Panginoon” lamang ang nakasulat sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: mga pag-uusig
  rationale: Tumutukoy ito sa mapanlabang paghabol at pang-aaping dinanas ni Pablo dahil sa kaniyang gawain at katapatan. Ang “pag-uusig” ang likas at kinikilalang katumbas sa Filipino.
- source_word: παθήμασιν
  choice: mga pagdurusa
  rationale: Malawak ang saklaw ng πάθημα at hindi lamang panlabas na paghihirap ang tinutukoy. Pinananatili ng “mga pagdurusa” ang lawak na iyon.
- source_word: οἷά μοι ἐγένετο
  choice: sinapit ko
  rationale: Natural sa modernong Filipino ang “sinapit ko” para sa mga paghihirap na nangyari kay Pablo, habang naiuugnay pa rin ang mga ito sa mga halimbawang sumunod na lugar.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: sa Antioquia, sa Iconio, at sa Listra
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalan ng lugar. Inulit ang “sa” upang mapanatili ang sunod-sunod na diin ng Griyego.
- source_word: οἵους διωγμοὺς
  choice: kung anu-anong pag-uusig
  rationale: Ipinahahayag nito ang kwalitatibo at padamdam na lakas ng οἵους nang hindi tinutukoy nang higit sa teksto ang uri o tindi ng bawat pag-uusig.
- source_word: ὑπήνεγκα
  choice: tiniis ko
  rationale: Ang pandiwa ay nangangahulugang magdala o manatiling matatag sa ilalim ng matinding hirap. Maikli at natural ang “tiniis ko” sa konteksto.
- source_word: ἐκ πάντων
  choice: mula sa lahat ng iyon
  rationale: Malinaw nitong ibinabalik ang tinutukoy sa lahat ng pag-uusig at pagdurusang kababanggit lamang, at likas ang pagkakasabi sa Filipino.
- source_word: ἐρρύσατο
  choice: iniligtas ako
  rationale: Tumutukoy ang ῥύομαι sa pagliligtas mula sa panganib. Sa kontekstong ito, malinaw na pisikal at pangyayari ang diwa, kaya hindi kailangang dagdagan o paliitin pa ang kahulugan.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Isinalin ang titulo ayon sa mismong Griyego at hindi idinagdag ang pangalang “Jesus,” na wala sa talata.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon”
  choice: “ang Panginoon” lamang ang nasa pangunahing teksto
  alternative: “ang Panginoong Jesus”
  rationale: Madalas gamitin ni Pablo ang titulong ito para kay Jesus, ngunit ὁ κύριος lamang ang tahasang nakasulat. Pinananatili ng salin ang tunay na antas ng pagkatiyak ng pinagmulang teksto.
- issue: Paraan ng pagliligtas mula sa lahat ng pag-uusig
  choice: “iniligtas ... mula sa lahat ng iyon”
  alternative: “hindi hinayaang dumanas ng anuman sa mga iyon”
  rationale: Hindi sinasabi ng teksto na iniwasan ni Pablo ang pagdurusa; sa katunayan, tiniis niya ang mga ito. Kaya pinananatili ang tensiyon sa pagitan ng pagdurusa at pagliligtas nang hindi ipinapaliwanag kung paano naganap ang bawat pagliligtas.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong bahagi ng pangungusap dahil nagpapatuloy ang talata mula sa naunang bersikulo. Ginamit ang tandang padamdam upang ihatid ang padamdam at kwalitatibong lakas ng οἵους, at ang gitling na mahaba upang markahan ang pagbabalik-diin ni Pablo sa mga pag-uusig.
