  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: tl
  text: Ngunit tanggihan mo ang mga pagtatalong hangal at walang sapat na kaalaman[a], sapagkat alam mong nagbubunga[b] ang mga iyon ng mga alitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tanong” o “mga usapin”; maaaring tumukoy ang salitang Griyego sa mga pagsisiyasat, ngunit dito ay malamang na tumutukoy ito sa mga pagtatalong mapagtunggali sa halip na tapat na paghahanap ng sagot.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagsisilang” o “nag-aanak”; metapora ito para sa paglikha o pagdudulot ng mga alitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: hangal
  rationale: Likas at tuwirang katumbas ito ng μωρός at pinananatili ang diwang salat sa matinong pag-iisip.
- source_word: ἀπαιδεύτους
  choice: walang-aral
  rationale: Ipinahihiwatig ng salita ang kawalan ng pagtuturo o pagsasanay, hindi lamang kakulangan sa talino; sa pariralang ito, natural itong tumutukoy sa mga pagtatalong walang sapat na batayan.
- source_word: ζητήσεις
  choice: mga pagtatalo
  rationale: Bagaman maaari itong mangahulugang mga tanong o pagsisiyasat, sa konteksto ay tumutukoy ito sa mapagtunggaling usapan, hindi sa tapat na pagtatanong.
- source_word: παραιτοῦ
  choice: tanggihan mo
  rationale: Pinananatili nito ang lakas ng pautos at ang diwang huwag tanggapin o salihan ang mga naturang pagtatalo.
- source_word: εἰδὼς
  choice: sapagkat alam mong
  rationale: 'Ginagawang malinaw sa natural na Tagalog ang pananahilang gamit ng participle: ang nalalaman ni Timoteo ang batayan ng utos.'
- source_word: γεννῶσι
  choice: nagbubunga
  rationale: Natural na metaporang Filipino ito para sa literal na ideya ng pag-aanak o pagsisilang at malinaw na nagpapahayag ng paglikha ng resulta.
- source_word: μάχας
  choice: mga alitan
  rationale: Tumutukoy ito sa mga labanan o hidwaan; ang 'mga alitan' ay angkop sa konteksto ng pasalitang pagtatalo at hindi nagpapahiwatig na pisikal lamang ang labanan.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag nito ang banayad na pagsalungat sa naunang tagubilin.
