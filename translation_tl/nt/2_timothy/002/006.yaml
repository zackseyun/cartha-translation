  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: tl
  text: Ang magsasakang nagpapakahirap ay dapat unang tumanggap ng bahagi sa ani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang magsasakang nagpapagal ay dapat unang makibahagi sa mga bunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: nagpapakahirap
  rationale: Ipinahihiwatig ng participle ang patuloy at puspusang paggawa. Likas sa makabagong Tagalog ang “nagpapakahirap” at malinaw nitong pinananatili ang diin sa matinding pagsisikap.
- source_word: γεωργὸν
  choice: magsasaka
  rationale: Tumutukoy ito sa taong nagbubungkal o nagtatrabaho sa lupa; “magsasaka” ang malinaw at karaniwang katumbas sa modernong Tagalog.
- source_word: δεῖ
  choice: dapat
  rationale: Ipinahahayag ng δεῖ ang pangangailangan o nararapat na obligasyon. Ang “dapat” ay natural at sapat ang lakas sa Tagalog.
- source_word: πρῶτον
  choice: unang
  rationale: 'Ikinakabit ito sa pagtanggap ng bahagi at nagpapahayag ng prayoridad: ang magsasaka ang dapat mauna sa pakinabang sa ani.'
- source_word: τῶν καρπῶν
  choice: sa ani
  rationale: Sa kontekstong agrikultural, ang “ani” ay natural na kolektibong tawag sa mga bunga o produktong nakuha mula sa bukid.
- source_word: μεταλαμβάνειν
  choice: tumanggap ng bahagi
  rationale: Saklaw ng pandiwa ang pakikibahagi o pagtanggap ng bahagi. Malinaw na ipinahahayag ng pariralang ito ang partitive na diwa ng pandiwa kasama ng genitive na τῶν καρπῶν.
theological_decisions:
- issue: Diwa ng pahayag na tulad ng kawikaan
  choice: Ang nagsisikap sa paggawa ang dapat magkaroon ng unang bahagi sa bunga ng paggawa.
  alternative: Kailangang magtrabaho muna ang magsasaka bago siya makabahagi sa ani.
  rationale: Pinakanatural sa ayos at sintaks ng Griyego na iugnay ang πρῶτον sa μεταλαμβάνειν—ang pagiging una sa pakikibahagi—sa halip na sa χρονolohikal na pag-una ng paggawa. Hindi dinaragdagan ng salin ang talata ng isang tiyak na aplikasyon sa ministeryo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ani” sa halip na literal na “mga bunga” dahil mas natural ito sa konteksto ng pagsasaka; pinanatili sa talababa ang mas pormal na alternatibo.
