id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: tl
  text: Patuloy mong ipaalala sa kanila ang mga bagay na ito. Mahigpit mo silang tagubilinan sa harap ng Panginoon[a] na huwag makipagtalo tungkol sa mga salita—wala itong anumang pakinabang[b] at humahantong sa kapahamakan ng mga nakikinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang tinutukoy rito kung ang “Panginoon” ay partikular na ang Panginoong Jesus o mas malawak na tumutukoy sa Diyos.
    reason: alternative_reading
  - marker: b
    text: O, “hindi ito nakabubuti sa anuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo at ang pagtukoy pabalik sa mga naunang itinuro.
- source_word: ὑπομίμνῃσκε
  choice: Patuloy mong ipaalala
  rationale: Ipinahihiwatig ng present imperative ang nagpapatuloy o paulit-ulit na pagpapaalala; natural itong ipinapahayag sa modernong Tagalog sa pamamagitan ng “patuloy.”
- source_word: διαμαρτυρόμενος
  choice: Mahigpit mo silang tagubilinan
  rationale: Ipinahahayag ang taimtim at mabigat na pag-uutos sa kontekstong pastoral. Ang “sila” ay likas na ipinapasok mula sa konteksto bilang mga taong pinapaalalahanan at tinatagubilinan.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: sa harap ng Panginoon
  rationale: Karaniwang idyoma ito para sa pagkilos sa presensiya at bilang saksi ng Panginoon; pinananatili ang hindi tiyak na partikular na referent ng κύριος.
- source_word: μὴ λογομαχεῖν
  choice: na huwag makipagtalo tungkol sa mga salita
  rationale: Malinaw at natural na inilalarawan ang walang saysay na pakikipagtunggali hinggil sa mga salita nang hindi labis na nagpapakahulugan.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: wala itong anumang pakinabang
  rationale: Tuwirang ipinahahayag ang lubos na kawalan ng kapakinabangan; ang “ito” ay tumutukoy sa pakikipagtalo tungkol sa mga salita.
- source_word: ἐπὶ καταστροφῇ
  choice: humahantong sa kapahamakan
  rationale: Ipinakikita ang mapaminsalang bunga ng pagtatalo habang pinananatili ang bigat ng καταστροφή.
- source_word: τῶν ἀκουόντων
  choice: ng mga nakikinig
  rationale: Natural na salin ng substantival present participle at pinananatili ang diwang aktuwal na nakikinig ang mga apektado.
theological_decisions:
- issue: Referent ng κύριος
  choice: Panginoon
  alternative: Diyos; Panginoong Jesus
  rationale: Hindi tahasang tinutukoy ng Griyego kung ang “Panginoon” ay partikular na si Jesus o mas malawak na tumutukoy sa Diyos. Pinananatili ng salin ang tunay na kalabuan sa halip na paliitin ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tagubilinan” upang mapanatili ang taimtim na bigat ng utos, at ang gitling na pahaba upang malinaw na iugnay ang kawalan ng pakinabang at kapahamakan sa pakikipagtalo tungkol sa mga salita.
source_grounding:
  english_pob_role: consult_only
