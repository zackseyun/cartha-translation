id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: tl
  text: Kaya, kung lilinisin ng sinuman ang sarili niya mula sa mga ito, magiging sisidlan siya para sa marangal na gamit[a]—pinabanal[b], kapaki-pakinabang sa amo nito, at inihanda para sa bawat mabuting gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa karangalan.”
    reason: lexical_alternative
  - marker: b
    text: O “ibinukod bilang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kaya, kung
  rationale: Pinananatili ng “kaya” ang paghihinuha mula sa naunang konteksto at ng “kung” ang kondisyon.
- source_word: τις
  choice: sinuman
  rationale: Pangkalahatan at di-tiyak ang τις; likas na ipinahahayag ito ng “sinuman” nang hindi nililimitahan sa lalaki.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: lilinisin ... ang sarili niya
  rationale: Malinaw at likas sa modernong Filipino ang “lilinisin,” habang pinananatili ng “ang sarili niya” ang isahang panumbalik na diwa.
- source_word: ἀπὸ τούτων
  choice: mula sa mga ito
  rationale: Pinananatili nito ang pagtukoy pabalik sa naunang konteksto nang hindi ipinapasok sa teksto kung ang tinutukoy ay mga bagay, gawain, o mga taong kaugnay ng kawalang-dangal.
- source_word: σκεῦος εἰς τιμήν
  choice: sisidlan ... para sa marangal na gamit
  rationale: Pinananatili ng “sisidlan” ang talinghaga ng mga kagamitan sa sambahayan. Ang “para sa marangal na gamit” ay natural sa Filipino at ipinakikita ang kaibahan sa mga sisidlang para sa di-marangal na gamit sa naunang talata.
- source_word: ἡγιασμένον
  choice: pinabanal
  rationale: Ipinahahayag ng “pinabanal” ang kalagayang bunga ng pagkilos ng pagpapabanal, alinsunod sa perfect passive participle.
- source_word: εὔχρηστον
  choice: kapaki-pakinabang
  rationale: Karaniwan at malinaw itong katumbas ng pagiging magagamit at angkop sa paglilingkod.
- source_word: τῷ δεσπότῃ
  choice: sa Panginoon
  rationale: Ipinahahayag ng “Panginoon” ang may awtoridad sa sambahayan at ang malamang na banal na tinutukoy, nang hindi inaalis ang talinghaga.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: inihanda para sa bawat mabuting gawain
  rationale: Pinananatili nito ang saklaw ng πᾶν at ang diwa ng natapos na paghahanda para sa anumang mabuting gawain.
theological_decisions:
- issue: Pangkalahatang pagtukoy ng isahang τις at ἑαυτόν
  choice: sinuman ... ang sarili niya ... siya
  alternative: ang isang tao ... ang kanyang sarili ... siya
  rationale: Pinananatili ang isahang bilang at panumbalik na anyo ng Griyego, ngunit hindi ipinapalagay na lalaki lamang ang tinutukoy.
- issue: Kahulugan ng εἰς τιμήν sa talinghaga ng sisidlan
  choice: para sa marangal na gamit
  alternative: para sa karangalan
  rationale: Ang pangunahing salin ay mas natural sa konteksto ng gamit ng mga sisidlan, samantalang nasa talababa ang mas pormal at posibleng pagbasa upang hindi maitago ang lawak ng parirala.
- issue: Pagpapahayag sa δεσπότης
  choice: Panginoon
  alternative: amo o may-ari
  rationale: Ang salita ay tumutukoy sa may awtoridad sa sambahayan; pinananatili ng “Panginoon” ang awtoridad at ang malamang na pagtukoy sa Diyos, habang hindi tiyak na nilulutas kung aling banal na persona ang tinutukoy.
- issue: Diwa ng ἡγιασμένον
  choice: pinabanal
  alternative: ibinukod bilang banal
  rationale: Pinananatili ng “pinabanal” ang teolohikal na diwa at ang pasibong kalagayan; inilalagay sa talababa ang paliwanag na maaari rin itong mangahulugang ibinukod bilang banal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang talinghaga ng sisidlan at ang bahagyang kalabuan ng “mga ito.” Ginamit ang gitling-pahaba upang malinaw na ang kasunod na mga parirala ay naglalarawan sa sisidlan.
