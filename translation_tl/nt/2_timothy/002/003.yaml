  text: ⸀συγκακοπάθησον ὡς καλὸς στρατιώτης ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: tl
  text: Makibahagi ka sa paghihirap bilang mabuting kawal ng Mesiyas na si Jesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magtiis ka ng hirap na kasama ko bilang mabuting kawal ng Mesiyas na si Jesus.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “Cristo Jesus.” Isinalin dito ang Χριστός bilang “Mesiyas” sapagkat ginagamit ito bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Makibahagi ka sa paghihirap
  rationale: Ang aorist active imperative na pangalawang panauhang isahan ay isang tuwirang utos. Ipinahihiwatig ng σύν- ang pakikibahagi sa hirap na dinaranas din ng iba; hindi nito tahasang sinasabing “kasama ko,” kaya hindi iyon inilagay sa pangunahing teksto.
- source_word: ὡς
  choice: bilang
  rationale: Likas na ipinakikilala ng “bilang” ang papel o paghahambing na inilalarawan sa talata.
- source_word: καλὸς
  choice: mabuting
  rationale: Sa kaugnayan nito sa “kawal,” tumutukoy ito sa kapuri-puri at karapat-dapat na katangian. Ang “mabuti” ay natural at hindi labis ang pagpapakahulugan.
- source_word: στρατιώτης
  choice: kawal
  rationale: Karaniwang salitang Filipino para sa isang sundalo at angkop sa marangal na rehistro at metaporikal na gamit ng teksto.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinalin ang Χριστός bilang titulo, hindi bilang simpleng bahagi ng pangalan. Ang “Mesiyas” ang malinaw at kinikilalang katumbas sa modernong Filipino.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Karaniwang anyong Filipino ng personal na pangalang Ἰησοῦς. Ginawang “Mesiyas na si Jesus” ang parirala upang maging natural sa Filipino habang pinananatili ang titulo at pangalan.
theological_decisions:
- issue: Paglalarawan sa Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  alternative: ni Cristo Jesus
  rationale: Ang Griyego ay binubuo ng titulo at personal na pangalan. Pinananatili ng “Mesiyas na si Jesus” ang kahulugan ng Χριστός bilang titulo at mas natural sa Filipino kaysa sa literal na ayos na “Mesiyas Jesus.”
- issue: Kasamang tinutukoy sa συγκακοπάθησον
  choice: Hindi tahasang tinukoy sa pangunahing teksto
  alternative: magtiis ka ng hirap na kasama ko
  rationale: May diwang pakikibahagi ang σύν-, ngunit walang tahasang αντικείμενο na “ako” sa mismong anyo rito. Inilagay sa talababa ang posibleng pagpapalinaw mula sa konteksto upang hindi tahimik na lutasin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinili ang “makibahagi” upang maipahayag ang sama-samang diwa ng pandiwa, at “kawal” para sa maikli at dignified na larawang militar.
