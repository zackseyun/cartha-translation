  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: tl
  text: Dahil dito ay nagtitiis ako ng hirap[a], hanggang sa mga tanikala, tulad ng isang kriminal[b]. Ngunit ang salita ng Diyos ay hindi nakagapos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ebanghelyong ito” o “dahil sa ebanghelyong ito”; malamang na tumutukoy ang Griyego sa ebanghelyong binanggit sa naunang talata.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tulad ng isang gumagawa ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Dahil dito
  rationale: Tumutukoy ang pariralang panghalip pabalik sa ebanghelyong binanggit sa naunang talata at maaaring magpahayag ng dahilan o kaugnayan. Likas sa Tagalog ang “Dahil dito” bilang pagpapahayag na ang ebanghelyo ang dahilan ng pagdurusa, habang itinatala sa talababa ang tunay na kalabuan.
- source_word: κακοπαθῶ
  choice: nagtitiis ako ng hirap
  rationale: Ipinahihiwatig ng pandiwa ang patuloy na pagdanas ng paghihirap. Ang “nagtitiis ako ng hirap” ay malinaw at natural, at pinananatili ang aspektong nagpapatuloy.
- source_word: μέχρι δεσμῶν
  choice: hanggang sa pagkagapos
  rationale: Ipinakikita ng μέχρι ang sukdulan o lawak ng paghihirap, samantalang ang δεσμῶν ay literal na mga gapos at maaari ring tumukoy sa pagkabilanggo. Pinananatili ng “pagkagapos” ang konkretong larawan at ang ugnayan nito sa huling pangungusap.
- source_word: ὡς κακοῦργος
  choice: parang isang kriminal
  rationale: Sa konteksto ng mga gapos at pagkabilanggo, malinaw na ipinahihiwatig ng κακοῦργος ang taong itinuturing na lumalabag sa batas. Ang “kriminal” ay kasalukuyan at madaling maunawaan; nasa talababa ang mas literal na alternatibo.
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na minamarkahan nito ang matinding pagsalungat sa pagitan ng pagkagapos ni Pablo at ng hindi pagkagapos ng salita ng Diyos.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang lawak ng λόγος at hindi ito nililimitahan sa Kasulatan lamang o sa ebanghelyo lamang, bagaman ang agarang konteksto ay tumutukoy sa ipinahahayag na ebanghelyo.
- source_word: οὐ δέδεται
  choice: ay hindi nakagapos
  rationale: Ipinahahayag ng perpektong balintiyak ang kalagayang hindi nakatali o napipigilan. Pinananatili ng “hindi nakagapos” ang metapora at ang sadyang paghahambing sa pagkagapos ni Pablo.
theological_decisions:
- issue: Saklaw ng “salita ng Diyos”
  choice: Pinanatili bilang “ang salita ng Diyos” nang hindi tinutukoy kung ito ay ang Kasulatan, ang ebanghelyong ipinahahayag, o ang mensahe ng Diyos sa mas malawak na diwa.
  alternative: “ang mensahe ng ebanghelyo” o “ang Kasulatan”
  rationale: Bagaman lalo nang itinuturo ng agarang konteksto ang ipinahahayag na ebanghelyo, mas malawak ang mismong pariralang Griyego. Hindi nilulutas ng salin ang hindi tiyak na saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pagkagapos” upang mapanatili ang larawan ng mga tanikala at ang retorikal na kaibahan sa salitang hindi nakagapos. Lahat ng marker ng talababa ay nasa pangunahing teksto.
