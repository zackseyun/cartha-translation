  to: 'Pagsikapan mong iharap ang iyong sarili sa Diyos bilang isang taong subok at sinang-ayunan—isang manggagawang walang dapat ikahiya, na wastong pinangangasiwaan[a] ang salita ng katotohanan.


    [a] Maaari ring “wastong itinuturo”; sa literal, “tuwid na pinuputol ang salita ng katotohanan.”'
  rationale: Pinalitan ang “napatunayang karapat-dapat” ng “subok at sinang-ayunan” upang mas tumpak na maipahayag ang δόκιμον bilang pagiging pumasa sa pagsubok at katanggap-tanggap sa Diyos. Pinalitan din ang “wastong ginagamit” ng “wastong pinangangasiwaan” upang maipakita ang maingat at tumpak na pagtrato sa mensahe nang hindi nililimitahan ang pandiwa sa pagtuturo. Walang binagong kahulugan sa talababa; pinananatili nito ang pinagtatalunang literal at interpretatibong mga posibilidad.
