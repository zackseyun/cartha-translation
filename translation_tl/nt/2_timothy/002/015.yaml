base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: tl
  text: 'Pagsikapan mong iharap ang iyong sarili sa Diyos bilang isang taong subok at sinang-ayunan—isang manggagawang walang dapat ikahiya, na wastong pinangangasiwaan[a] ang salita ng katotohanan.


    [a] Maaari ring “wastong itinuturo”; sa literal, “tuwid na pinuputol ang salita ng katotohanan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wastong itinuturo”; sa literal, “tuwid na pinuputol ang salita ng katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Pagsikapan mo
  rationale: Ipinahahayag nito ang mariing utos na gumawa nang masikap at taimtim, nang hindi pinahihina sa mas kolokyal na “gawin mo ang iyong makakaya.”
- source_word: σεαυτὸν … παραστῆσαι
  choice: maiharap ang iyong sarili
  rationale: Pinananatili ang reflexive na panghalip at ang diwa ng pagharap o paghahandog ng sarili sa Diyos para sa kaniyang pagsusuri at paglilingkod.
- source_word: δόκιμον
  choice: isang taong napatunayang karapat-dapat
  rationale: Sinasaklaw ng “napatunayang” ang diwa ng pagdaan sa pagsubok, at ng “karapat-dapat” ang bunga nitong pagsang-ayon. Mas malinaw ito sa karaniwang mambabasa kaysa sa payak na “aprubado.”
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Likas na salin ng datibo kasunod ng παραστῆσαι at hindi nito labis na nililimitahan kung ito ay pagharap para sa pagsusuri o paglilingkod.
- source_word: ἐργάτην
  choice: isang manggagawa
  rationale: Malinaw at kasalukuyang salita na nagpapanatili sa metapora ng paggawa.
- source_word: ἀνεπαίσχυντον
  choice: walang dapat ikahiya
  rationale: Ipinakikita na walang makatuwirang dahilan upang mapahiya, sa halip na tumukoy lamang sa pansariling damdaming hindi nahihiya.
- source_word: ὀρθοτομοῦντα
  choice: na wastong ginagamit
  rationale: Malawak na salin ito para sa tumpak at matapat na pakikitungo sa mensahe. Hindi nito nililimitahan ang gawain sa pagtuturo lamang; ang mas interpretatibo at literal na mga posibilidad ay inilagay sa talababa.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: ang salita ng katotohanan
  rationale: Pinananatili ang anyo ng pariralang Griyego at ang pamilyar nitong teolohikal na tunog, habang nananatiling nauunawaan sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng ὀρθοτομοῦντα sa konteksto ng ministeryo
  choice: wastong ginagamit ang salita ng katotohanan
  alternative: wastong itinuturo; tuwid na pinuputol
  rationale: Ang pandiwa ay malamang na tumutukoy sa tama at tapat na pakikitungo sa mensahe, ngunit bihira ito at may literal na larawang “tuwid na pagputol.” Pinananatiling malawak ang pangunahing salin at inilalahad sa talababa ang interpretatibo at literal na mga posibilidad upang hindi agad lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Pagsikapan” para sa taimtim na utos, “manggagawa” bilang likas at hindi lipas na katawagan, at em dash upang malinaw na ipakilalang inilalarawan ng “manggagawa” ang taong inihaharap sa Diyos.
