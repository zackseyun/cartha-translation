  - severity: low
    issue: Ang “wastong ginagamit ang salita” ay maaaring maunawaan bilang simpleng paggamit ng mga salita.
    rationale: Ang ὀρθοτομοῦντα ay tumutukoy sa wasto at tapat na pagtrato sa ‘salita ng katotohanan.’ Ang “wastong pinangangasiwaan” ay nananatiling malawak gaya ng ‘rightly handling’ at mas natural sa kontekstong ito.
