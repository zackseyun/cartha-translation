id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: tl
  text: Sa isang malaking bahay naman ay may mga sisidlang yari hindi lamang sa ginto at pilak kundi pati sa kahoy at luwad[a]; ang ilan ay para sa karangalan, ngunit ang iba ay para sa kawalang-dangal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “luwad” dito ay tumutukoy sa mga sisidlang palayok, na yari sa pinatigas o nilutong luwad.
    reason: cultural_note
  - marker: b
    text: Maaari ring “ang ilan ay para sa marangal na gamit, ngunit ang iba ay para sa di-marangal na gamit.” Mas literal sa Griyego ang “para sa karangalan ... para sa kawalang-dangal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: isang malaking bahay
  rationale: Likas at malinaw sa makabagong Tagalog; pinananatili ang larawan ng isang bahay na malaki at maraming uri ng gamit.
- source_word: δὲ
  choice: naman
  rationale: Ipinahihiwatig ang pagpapatuloy at banayad na paglipat ng diwa nang hindi ito ginagawang tahasang pagsalungat.
- source_word: σκεύη
  choice: mga sisidlan
  rationale: Malawak na katawagang angkop sa mga bagay na yari sa ginto, pilak, kahoy, at luwad, at pinananatili ang talinghaga ng sambahayan.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: yari ... sa ginto at pilak
  rationale: Malinaw na ipinapahayag na ang mga materyal na ito ang sangkap ng mga sisidlan.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: sa kahoy at luwad
  rationale: Ang ξύλινα ay yari sa kahoy, at ang ὀστράκινα ay yari sa pinatigas o nilutong luwad; maikli at madaling maunawaan ang pares sa Tagalog.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: ang ilan ... ngunit ang iba ...
  rationale: Malinaw na naihahatid ang paghahambing at pagsasalungat ng dalawang pangkat.
- source_word: εἰς τιμήν
  choice: para sa karangalan
  rationale: Pinananatili ang abstraktong pangngalang τιμή at hindi agad nililimitahan ang diwa sa praktikal na gamit lamang.
- source_word: εἰς ἀτιμίαν
  choice: para sa kawalang-dangal
  rationale: Pinananatili ang tuwirang kasalungat ng karangalan at ang tensiyong retorikal ng Griyego.
theological_decisions:
- issue: Kung ang τιμή at ἀτιμία ay isasalin bilang uri ng gamit o bilang karangalan at kawalang-dangal
  choice: para sa karangalan ... para sa kawalang-dangal
  alternative: para sa marangal na gamit ... para sa di-marangal na gamit
  rationale: Bagaman ang larawan ay tungkol sa mga sisidlan sa bahay, abstraktong mga pangngalan ang ginamit ni Pablo. Pinananatili ng pangunahing salin ang sadyang lawak at tensiyon ng pahayag para sa kaugnayan nito sa kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naman” upang natural na katawanin ang panimulang δέ. Pinanatili ang abstraktong pares na “karangalan/kawalang-dangal” sa pangunahing teksto sa halip na lutasin ang talinghaga bilang pagkakaiba lamang ng praktikal na gamit.
