  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: tl
  text: 'Gayunman, nananatiling matatag ang pundasyon ng Diyos, na taglay ang tatak na ito[a]: “Kilala ng Panginoon ang mga kabilang sa kanya,” at, “Lumayo sa kasamaan ang bawat bumabanggit ng pangalan ng Panginoon[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may ganitong inskripsiyon.” Ang salitang isinaling “tatak” ay maaaring tumukoy sa tandang pagkakakilanlan o sa mga salitang nakaukit sa isang tatak.
    reason: lexical_alternative
  - marker: b
    text: O “ang bawat tumatawag sa pangalan ng Panginoon.” Literal na “ang bawat bumabanggit ng pangalan ng Panginoon,” isang idyoma na maaaring tumukoy sa pagtawag sa kanya o sa hayagang pagpapahayag ng katapatan sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Gayunman
  rationale: Malinaw na ipinapakita ang matinding pagsalungat sa naunang pagtalakay tungkol sa maling aral, habang nananatiling natural at marangal sa makabagong Tagalog.
- source_word: στερεὸς θεμέλιος
  choice: matatag na pundasyon
  rationale: Pinananatili ang talinghaga ng pundasyon at ang diin sa katatagan at pagiging di-natitinag.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang pinananatili ang genitibong ugnayan nang hindi nililimitahan kung ito ay tumutukoy sa pagmamay-ari, pinagmulan, o katangian.
- source_word: ἕστηκεν
  choice: nananatiling matatag
  rationale: Ipinahahayag ang namamalaging kalagayang dulot ng perpektong anyo ng pandiwa; natural ito sa Tagalog at hindi ipinahihiwatig na pansamantala lamang ang katatagan.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: taglay nito ang tatak na ito
  rationale: Pinananatili ang larawan ng tatak bilang tanda ng pagkakakilanlan o pagpapatunay. Nililinaw ng panghalip na ang pundasyon ang may taglay nito.
- source_word: Ἔγνω
  choice: Kilala
  rationale: Bagaman aorist ang anyo, ang sipi ay nagpapahayag ng namamalagi at tiyak na pagkilala ng Panginoon. Ang “kilala” ay likas sa Tagalog at pinananatili ang bigat ng ugnayan.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang katawagang may bigat mula sa Kasulatan nang hindi tinutukoy nang higit sa Griyego kung ang tinutukoy ay ang Ama o si Cristo.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: ang mga sa kanya
  rationale: Pinananatili ang payak ngunit malalim na pahayag ng pag-aari at pagkabilang, nang hindi ito dinaragdagan ng paliwanag.
- source_word: Ἀποστήτω
  choice: Lumayo
  rationale: Ipinahahayag ang mapagpasyang paghiwalay na hinihingi ng aorist imperative sa isang malinaw at likas na utos sa Tagalog.
- source_word: ἀπὸ ἀδικίας
  choice: sa kasamaan
  rationale: Saklaw ng “kasamaan” ang maling asal at moral na kalikuan nang hindi nililimitahan ang kahulugan sa kawalang-katarungang panlipunan lamang.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: ang bawat nagpapahayag ng pangalan ng Panginoon
  rationale: Ipinapakita ng “nagpapahayag” na hindi lamang basta pagbanggit ang tinutukoy kundi hayagang pagtawag o pagpapahayag ng pagkilala sa Panginoon. Nasa talababa ang isa pang likas na pagbasa ng idyoma.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa dalawang pahayag na nasa tatak
  choice: Parehong isinalin bilang “Panginoon” nang hindi tinutukoy kung ang tinutukoy ay ang Ama, si Cristo, o isang siping may magkapatong na bisa sa kontekstong Cristiano.
  alternative: Maaaring unawain ang dalawa bilang tumutukoy sa Diyos Ama, kapwa kay Cristo, o may magkaibang tinutukoy sa bawat pahayag.
  rationale: κύριος lamang ang ginamit ng tekstong Griyego. Pinananatili ng salin ang sadyang kaluwagan at teolohikal na bigat ng pananalita sa halip na lutasin ang hindi tahasang nilinaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog ang ginamit. Iniwasan ang sobrang teknikal o denominasyonal na pananalita, ngunit pinanatili ang mga larawang “pundasyon” at “tatak” at ang di-tiyak na tinutukoy ng “Panginoon.”
