id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: tl
  text: Dahil dito, tinitiis ko ang lahat alang-alang sa mga hinirang,[a] upang makamtan din nila ang kaligtasang nasa Mesiyas na si Jesus,[b] kalakip ang walang hanggang kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinili.” Ang salitang Griyego ay ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “Cristo Jesus.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na Filipino itong panandang sanhi at malinaw na tumutukoy sa naunang konteksto bilang dahilan ng pagtitiis ni Pablo.
- source_word: πάντα ὑπομένω
  choice: tinitiis ko ang lahat
  rationale: Pinananatili ng “ang lahat” ang malawak na saklaw ng πάντα, at ipinapahayag ng “tinitiis” ang matatag na pagharap sa hirap na nasa ὑπομένω.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: alang-alang sa mga hinirang
  rationale: Ipinahihiwatig ng διά na may accusative ang kapakanan o layunin. Pinananatili ng “mga hinirang” ang tahasang wika ng pagpili sa Griyego nang hindi ito ipinapaliwanag ayon sa isang sistemang teolohikal.
- source_word: ἵνα καὶ αὐτοὶ
  choice: upang ... din nila
  rationale: Ang “upang” ay nagpapanatili sa layuning ipinahahayag ng ἵνα, at ang “din nila” ay likas na naghahatid sa dagdag na diin ng καὶ αὐτοὶ.
- source_word: σωτηρίας τύχωσιν
  choice: makamtan ... ang kaligtasan
  rationale: Ang τυγχάνω na may genitive ay nangangahulugang makamit o makamtan. Ang “makamtan” ay malinaw, marangal, at hindi nagdaragdag ng paliwanag hinggil sa paraan ng pagliligtas.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: kaligtasang nasa Mesiyas na si Jesus
  rationale: Iniuugnay ng parirala ang kaligtasan kay Jesus bilang Mesiyas. Pinananatili ng “nasa” ang lokatibo at pakikiisang diwa ng ἐν nang hindi ito pinapalawak sa isang interpretatibong paraphrase.
- source_word: μετὰ δόξης αἰωνίου
  choice: kalakip ang walang hanggang kaluwalhatian
  rationale: Ipinapahayag ng μετά na may genitive ang pagsama o pagkakalakip. Nililinaw ng “kalakip” na ang walang hanggang kaluwalhatian ay kasama ng kaligtasan, habang nananatiling maikli at natural ang pangungusap.
theological_decisions:
- issue: Pagpapahayag sa ἐκλεκτούς
  choice: mga hinirang
  alternative: mga pinili
  rationale: Ang “mga hinirang” ay tuwirang katumbas na may angkop na bigat sa teolohikal na gamit ng salita. Hindi nito nilulutas ang mga pagtatalo tungkol sa pagpili na hindi naman nililinaw ng talata.
- issue: Pagpapahayag sa Χριστῷ bilang titulo
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Ang Χριστός ay may buhay na kahulugang “Mesiyas” o “Pinahiran,” kaya isinasalin ito bilang titulo. Inilalagay sa talababa ang tradisyonal at pangalang-anyong “Cristo Jesus.”
- issue: Ugnayan ng μετὰ δόξης αἰωνίου
  choice: Ang walang hanggang kaluwalhatian ay kalakip ng kaligtasang nasa Mesiyas na si Jesus
  alternative: Basahing mas maluwag bilang hiwalay na pangwakas na kalagayan ng mga maliligtas
  rationale: Pinakanatural na inuugnay ng sintaks ang parirala sa σωτηρίας, ngunit hindi dinaragdagan ng salin ang teksto ng paliwanag tungkol sa eksaktong anyo o panahon ng kaluwalhatiang ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “alang-alang,” “makamtan,” at “kalakip” dahil madaling maunawaan ang mga ito habang napapanatili ang bigat at siksik na estruktura ng Griyego. Iniwasan ang denominasyonal na pagpapaliwanag sa “mga hinirang” at sa kaligtasang “nasa” Mesiyas.
