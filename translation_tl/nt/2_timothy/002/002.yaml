  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: tl
  text: At ang mga narinig mo sa akin sa harap ng maraming saksi[a] ay ipagkatiwala mo sa mga taong tapat[b], na may kakayahan ding magturo sa iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng maraming saksi.” Maaaring tukuyin ng pariralang Griego ang maraming saksing naroon nang magturo si Pablo; maaari rin itong unawain na sa pamamagitan nila naiparating ang narinig ni Timoteo.
    reason: lexical_alternative
  - marker: b
    text: Maaaring isalin na “mga lalaking tapat.” Panlalaking pangmaramihan ang anyong Griego, ngunit maaari rin itong tumukoy sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ang mga narinig
  rationale: Ipinahahayag ang pangmaramihang nilalaman ng itinuro nang natural sa Tagalog; hindi na kailangang ulitin ang ‘mga bagay na.’
- source_word: ἤκουσας παρ’ ἐμοῦ
  choice: narinig mo sa akin
  rationale: 'Ang παρά na may genitive kasunod ng ἀκούω ay nagsasaad ng pinagmulan: kay Pablo nanggaling ang narinig ni Timoteo.'
- source_word: διὰ πολλῶν μαρτύρων
  choice: sa harap ng maraming saksi
  rationale: Pinananatili nito ang malamang na diwa ng pampublikong pagtuturo habang kinikilala sa talababa ang tunay na posibilidad na ang διά ay nangangahulugang ‘sa pamamagitan ng.’
- source_word: ταῦτα παράθου
  choice: ay ipagkatiwala mo
  rationale: Ang παρατίθημι rito ay paglalagak ng aral sa pangangalaga at pananagutan ng iba; natural at marangal ang ‘ipagkatiwala.’
- source_word: πιστοῖς ἀνθρώποις
  choice: sa mga taong tapat
  rationale: Maaaring generic ang ἄνθρωποι kahit nasa anyong panlalaking pangmaramihan. Ang ‘mga taong tapat’ ay likas sa modernong Tagalog at pinananatili ang diin sa pagiging maaasahan.
- source_word: οἵτινες ἱκανοὶ ἔσονται
  choice: na may kakayahan
  rationale: Ipinahahayag ang sapat na kakayahan para sa gawaing pagtuturo. Hindi kailangang tahasang isalin ang future copula sa Tagalog, sapagkat malinaw ang inaasahang kakayahan sa konteksto.
- source_word: καὶ ἑτέρους διδάξαι
  choice: ding magturo sa iba
  rationale: Ang ‘din’ ay tumutugma sa καί, at malinaw na ang ‘iba’ ang mga taong tuturuan.
theological_decisions:
- issue: Saklaw ng πιστοῖς ἀνθρώποις
  choice: mga taong tapat
  alternative: mga lalaking tapat
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griego, maaaring gamiting pangkalahatan ang ἄνθρωπος. Hindi tiyak sa talata lamang na eksklusibong mga lalaki ang tinutukoy, kaya hindi nilulutas nang tahimik ang usapin; itinatala sa talababa ang literal na anyo.
- issue: Kahulugan ng πιστοῖς
  choice: tapat
  alternative: mapagkakatiwalaan
  rationale: Binibigyang-diin ng konteksto ang pagiging maaasahan sa pagpapasa ng aral, ngunit pinananatili ng ‘tapat’ ang mas malawak na posibleng diwa ng πιστός nang hindi ito nililimitahan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang ‘sa harap’ sa halip na mas pormal na ‘sa presensya,’ at iniwasan ang sobrang teknikal o makalumang pananalita.
