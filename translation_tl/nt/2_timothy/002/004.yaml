base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: tl
  text: Walang sinumang naglilingkod bilang kawal ang nagpapasangkot sa sarili sa mga gawain ng pang-araw-araw na buhay[a], upang kalugdan niya ang nagpalista sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga gawaing sibilyan.” Ipinapakita ng Griyego ang kontrast ng paglilingkod bilang kawal at ng karaniwang mga gawain sa buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Walang sinuman
  rationale: Pinananatili ang pangkalahatan at walang-kasariang diwa ng negatibong panghalip.
- source_word: στρατευόμενος
  choice: naglilingkod bilang kawal
  rationale: Ipinahahayag ang patuloy na pakikibahagi sa paglilingkod-militar at pinananatili ang talinghaga.
- source_word: ἐμπλέκεται
  choice: nagpapasangkot
  rationale: Ipinahihiwatig ang pagkakasangkot na maaaring humadlang sa malayang pagtupad ng tungkulin; natural ito sa modernong Tagalog.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: sa mga gawain ng pang-araw-araw na buhay
  rationale: Sinasaklaw ang mga hanapbuhay, pinagkakaabalahan, at karaniwang gawain sa buhay, habang malinaw na ikinokontra ang mga ito sa paglilingkod bilang kawal.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinakikita ang layunin.
- source_word: τῷ στρατολογήσαντι
  choice: ang nagpalista sa kanya
  rationale: Tuwirang inilalarawan ang taong nagpasok o nagtalaga sa kanya sa hukbo nang hindi nagdaragdag ng ranggong wala sa Griyego.
- source_word: ἀρέσῃ
  choice: mabigyang-kasiyahan niya
  rationale: Pinananatili ang layuning kalugdan o mapasaya ang nagpalista sa kawal, sa dignified at natural na anyo.
theological_decisions:
- issue: Lawak ng talinghagang militar
  choice: Panatilihin ang larawan ng kawal na umiiwas sa pagkakasangkot sa karaniwang mga gawain upang mabigyang-kasiyahan ang nagpalista sa kanya.
  alternative: Tahasang ipaliwanag ito bilang pag-iwas ng isang lingkod ng Diyos sa mga makamundong abala o bilang pag-iwas sa mga gawaing sibilyan.
  rationale: Ang talata mismo ay gumagamit ng talinghagang militar ngunit hindi pa tahasang nililimitahan ang aplikasyon nito. Pinananatili ng salin ang larawan at hindi ipinapasok ang isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kawal” upang mapanatili ang malinaw at maikling talinghagang militar; iniwasan ang sobrang teknikal o denominasyonal na pagpapaliwanag.
