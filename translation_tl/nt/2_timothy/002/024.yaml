id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: tl
  text: Ngunit ang lingkod ng Panginoon[a] ay hindi dapat makipagtalo, kundi maging mahinahon sa pakikitungo sa lahat, mahusay magturo, at matiisin sa masamang pagtrato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alipin ng Panginoon.” Ang salitang Griyego na doulos ay maaaring mangahulugang “lingkod” o “alipin,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: lingkod
  rationale: Maaaring tumukoy ang δοῦλος sa alipin o lingkod. Sa kontekstong ito, ang diin ay nasa asal ng taong naglilingkod sa Panginoon, kaya natural at angkop ang “lingkod,” habang inilalahad sa talababa ang “alipin” bilang tunay na alternatibo.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Tuwirang ipinahahayag ng genitibong κυρίου ang kaugnayan ng lingkod sa Panginoon; likas sa Tagalog ang “lingkod ng Panginoon.”
- source_word: οὐ δεῖ
  choice: ay hindi dapat
  rationale: Ipinahahayag ng δεῖ ang kinakailangan o nararapat na asal; malinaw na naihahatid ng “hindi dapat” ang negatibong obligasyon.
- source_word: μάχεσθαι
  choice: makipagtalo
  rationale: Sa kontekstong pastoral at kasunod ng mga pagtatalo sa talata 23, pangunahing tumutukoy ito sa pakikipag-alitan o pakikipagtalo, hindi lamang sa pisikal na pakikipaglaban.
- source_word: ἤπιον
  choice: maging mahinahon
  rationale: Ang ἤπιος ay tumutukoy sa banayad at hindi palaban na pakikitungo. Ang “mahinahon” ay natural at malinaw na kabaligtaran ng pakikipagtalo.
- source_word: πρὸς πάντας
  choice: sa lahat
  rationale: Ipinakikita nito na ang mahinahong pakikitungo ay para sa lahat ng tao; maikli at likas sa Tagalog ang “sa lahat.”
- source_word: διδακτικόν
  choice: mahusay magturo
  rationale: Ang διδακτικός ay nangangahulugang may kakayahan o kasanayan sa pagtuturo, hindi “madaling turuan.” Naihahatid ng “mahusay magturo” ang positibong kakayahang ito sa natural na Tagalog.
- source_word: ἀνεξίκακον
  choice: matiisin kapag ginagawan ng masama
  rationale: Ang bihirang salitang ito ay tumutukoy sa matiyagang pagtitiis ng masamang pagtrato nang hindi gumaganti. Ginagawang malinaw ng parirala ang bagay na pinagtitiisan.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa tagubilin tungkol sa ministeryo
  choice: lingkod
  alternative: alipin
  rationale: Ang sentro ng talata ay ang asal na hinihingi sa naglilingkod sa Panginoon, hindi ang katayuang panlipunan ng pagkaalipin. Gayunman, pinananatili sa talababa ang “alipin” upang hindi mawala ang saklaw ng salitang Griyego.
- issue: Pagpapakahulugan sa κύριος
  choice: Panginoon
  alternative: amo
  rationale: Ang “Panginoon” ang karaniwan at angkop na salin ng κύριος sa pagtukoy kay Cristo sa kontekstong ito; ang “amo” ay maaaring labis na magpatingkad sa ugnayang panlipunan ng alipin at may-ari.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “makipagtalo” para sa kontekstong pasalita, “mahinahon” bilang likas na kabaligtaran nito, at isang malinaw na parirala para sa bihirang ἀνεξίκακος. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
