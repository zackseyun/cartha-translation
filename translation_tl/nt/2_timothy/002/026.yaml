  naturalness: Ang “matauhan,” “makawala sa bitag,” at “kalooban” ay likas at nasa marangal na modernong Filipino. Mas natural at mas angkop sa personal na kaaway ang “niya” kaysa “nito.” Ang inayos na ayos ng mga salita ay umiiwas din sa bahagyang mabigat na “binihag sila nito.”
  terminology: Panatilihin ang “diyablo,” “bitag,” at “binihag ... nang buhay.” Ginamit ang “niya” para sa diyablo bilang personal na nilalang. Pinananatili ng talababa ang pinagtatalunang posibleng pagtukoy ng ἐκείνου sa Diyos nang hindi ito ipinipilit sa pangunahing teksto.
