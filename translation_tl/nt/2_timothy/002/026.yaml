  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: tl
  text: at matauhan sila at makawala sa bitag ng diyablo, palibhasa’y binihag na sila niya nang buhay[a] upang sundin ang kalooban niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding isalin na “binihag.” Gayunman, mas tiyak na ipinahihiwatig ng pandiwang Griyego na hinuli o binihag sila nang buhay.
    reason: lexical_alternative
  - marker: b
    text: O “upang sundin ang kalooban niya.” Nauunawaan ng ilan na ang “niya” ay tumutukoy hindi sa diyablo kundi sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: matauhan
  rationale: Likas na ipinahahayag ng “matauhan” ang pagbabalik sa malinaw at wastong pag-iisip matapos malinlang; angkop ito sa metapora ng muling paghinahon o pagkakaroon ng matinong isip.
- source_word: παγίδος
  choice: bitag
  rationale: Karaniwang salitang Filipino ang “bitag” para sa kasangkapang panghuli at malinaw nitong napapanatili ang metapora ng pagkakasilo.
- source_word: διαβόλου
  choice: diyablo
  rationale: Dito, ang διάβολος ay personal na katawagan kay Satanas, kaya “diyablo” ang tuwiran at pamilyar na salin.
- source_word: ἐζωγρημένοι
  choice: binihag sila nito nang buhay
  rationale: Pinananatili ng “binihag … nang buhay” ang tiyak na diwa ng ζωγρέω na paghuli sa isang tao nang buhay, pati ang pasibong kalagayang bunga ng naunang pagkabihag.
- source_word: ὑπ’ αὐτοῦ
  choice: nito
  rationale: Ang pinakamalapit na tinutukoy ay ang diyablo. Ang “nito” ay malinaw na tumutukoy rito nang hindi inuulit ang pangngalan.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: upang sundin ang kalooban nito
  rationale: Natural na ipinahahayag nito sa Filipino ang layunin o tunguhin ng εἰς habang pinananatili sa pangunahing teksto ang malamang na pagtukoy ng ἐκείνου sa diyablo.
theological_decisions:
- issue: Ang tinutukoy ng ἐκείνου sa εἰς τὸ ἐκείνου θέλημα
  choice: 'Ang panghalip ay tumutukoy sa diyablo: “upang sundin ang kalooban nito.”'
  alternative: Maaaring tumukoy ang panghalip sa Diyos, kaya maaaring unawain ang parirala bilang “upang sundin ang kalooban ng Diyos.”
  rationale: Ang diyablo ang pinakamalapit at pinakanatural na antecedent sa balarila, ngunit tunay at matagal nang pinagtatalunan ang pagtukoy ng panghalip. Kaya pinili ang mas malamang na pagbasa sa teksto at inilagay sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matauhan” at “bitag” bilang mga likas na katumbas ng mga metapora sa Griyego. Ang “palibhasa’y” ay bahagyang pormal ngunit karaniwan pa ring nauunawaan at mahusay na nag-uugnay sa participial clause.
