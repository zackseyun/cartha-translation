translation:
  language: tl
  text: At ang sinasabi nila[a] ay kakalat[b] na parang gangrena. Kabilang sa kanila sina Himeneo at Fileto,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang salita,” “mensahe,” o “pananalita.”
