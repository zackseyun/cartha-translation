lexical_decisions:
- source_word: λόγος
  choice: ang sinasabi
  rationale: Sa konteksto ng maling turo at walang-kabuluhang usapan, tumutukoy ito sa nilalaman ng kanilang pananalita. Likas sa modernong Tagalog ang “ang sinasabi nila,” habang pinananatili sa talababa ang mas literal na mga posibilidad.
- source_word: αὐτῶν
  choice: nila
  rationale: Tuwirang ipinahahayag ang pag-aari o kaugnayan ng λόγος sa mga taong tinutukoy.
- source_word: ὡς γάγγραινα
  choice: na parang gangrena
  rationale: Pinananatili ang tiyak at matinding larawang medikal ng Griyego. Ang “gangrena” ay mas eksakto kaysa sa interpretatibong “kanser.”
- source_word: νομὴν ἕξει
  choice: ay kakalat
  rationale: Ang idyoma ay literal na may diwang pagkakaroon ng mapapanginainan o daraanan, ngunit kasama ng larawan ng gangrena ay malinaw na tumutukoy sa mapaminsalang paglaganap.
- source_word: ὧν ἐστιν
  choice: Kabilang sa kanila
  rationale: 'Likas na Tagalog na nagpapanatili sa partitive na diwa: ang dalawang pinangalanan ay mga halimbawa mula sa grupong tinutukoy.'
- source_word: Ὑμέναιος
  choice: Himeneo
  rationale: Transliterasyong angkop sa bigkas at nakasanayang anyo ng mga pangalang biblikal sa Filipino.
- source_word: Φίλητος
  choice: Fileto
  rationale: Transliterasyong angkop sa bigkas at nakasanayang anyo ng mga pangalang biblikal sa Filipino.
theological_decisions:
- issue: Lakas ng metapora ng sakit
  choice: Inilalarawan ang kanilang sinasabi bilang kumakalat na gangrena.
  alternative: Isalin nang mas literal ang νομὴν ἕξει bilang “magkakaroon ng daraanan/mapapanginainan.”
  rationale: Ang “kakalat” ay malinaw na naghahatid ng mapaminsalang paglaganap na ipinahihiwatig ng gangrena, nang hindi nagdaragdag ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “gangrena” upang mapanatili ang orihinal na larawang medikal. Pinanatili ang kuwit sa hulihan dahil bahagi ito ng nagpapatuloy na pangungusap sa kasunod na talata.
