base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: tl
  text: Ngunit iwasan mo ang mga walang kabuluhang usapang walang paggalang sa Diyos,[a] sapagkat lalo lamang silang magpapatuloy sa kawalang-galang sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang-Diyos na daldalan,” “hungkag na usapan,” o “walang kabuluhang pananalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: lumalapastangan sa Diyos
  rationale: Ipinahahayag nito ang relihiyoso at moral na bigat ng βέβηλος—hindi banal at walang paggalang sa Diyos—nang mas malinaw sa karaniwang modernong Tagalog kaysa sa teknikal na “propanong.”
- source_word: κενοφωνίας
  choice: mga walang-lamang salita
  rationale: Pinananatili nito ang larawan ng pananalitang hungkag o walang kabuluhang nilalaman, at likas itong mababasa sa Tagalog.
- source_word: περιΐστασο
  choice: iwasan mo
  rationale: Ang panggitnang pautos ay humihiling kay Timoteo na lumayo at huwag masangkot sa gayong pananalita; malinaw at tuwiran ang “iwasan mo.”
- source_word: ἐπὶ πλεῖον
  choice: lalo pang
  rationale: Natural na ipinahahayag sa Tagalog ang pag-unlad sa mas mataas na antas nang hindi artipisyal na inuulit ang “parami nang parami.”
- source_word: προκόψουσιν
  choice: susulong
  rationale: Pinananatili ng “susulong” ang di-karaniwang larawan ng pag-unlad na nakatuon dito sa masamang direksiyon.
- source_word: ἀσεβείας
  choice: kasamaan laban sa Diyos
  rationale: Ipinakikita nito na ang ἀσέβεια ay hindi lamang pangkalahatang kasamaan kundi kawalan ng paggalang at wastong pag-uukol sa Diyos.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw nitong minamarkahan ang pagsalungat sa naunang tagubilin.
theological_decisions:
- issue: Kung ang tinutukoy ay pananalitang basta walang pakinabang lamang o pananalitang hungkag at walang paggalang sa Diyos
  choice: “mga walang-lamang salitang lumalapastangan sa Diyos” upang mapanatili kapuwa ang kahungkagan at ang relihiyoso-moral na kasamaan nito
  alternative: “walang kabuluhang usapan” o “walang-Diyos na daldalan”
  rationale: Magkasamang inilalarawan ng βεβήλους at κενοφωνίας ang pananalitang walang laman at taliwas sa kabanalan; hindi dapat alisin ang alinman sa dalawang diin.
- issue: Kung ang pangmaramihang pandiwa προκόψουσιν ay tumutukoy sa mga salita o sa mga taong nagsasalita
  choice: “ang mga nagsasalita ng gayon”
  alternative: “ang mga salitang iyon”
  rationale: Ang panlalaking pangmaramihang προκόψουσιν ay hindi maaaring tuwirang tumukoy sa pambabaeng κενοφωνίας; malamang na ipinahihiwatig ang mga taong nakikibahagi sa gayong pananalita. Ginawang malinaw ito sa Tagalog nang hindi pinapangalanan ang isang tiyak na grupo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang teknikal o lipas na “propanong pananalita,” habang pinanatili ang kahungkagan at kawalang-galang sa Diyos na nasa mga salitang Griyego.
