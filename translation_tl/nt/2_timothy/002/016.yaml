  naturalness: Natural at malinaw sa modernong Tagalog ang “walang kabuluhang usapang walang paggalang sa Diyos” at “lalo lamang silang magpapatuloy sa kawalang-galang sa Diyos.” Iniiwasan nito ang hindi likas na “walang-lamang salita” at ang sobrang-tiyak na “lumalapastangan.”
  terminology: Pinananatili ng “walang paggalang sa Diyos” ang relihiyoso at moral na puwersa ng βεβήλους at ἀσεβείας nang walang pagdaragdag ng ideya ng tahasang pamumusong. Ang “walang kabuluhang usapan” ay angkop para sa κενοφωνίας.
