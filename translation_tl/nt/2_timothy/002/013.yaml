id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: tl
  text: Kung hindi tayo tapat[a], nananatili siyang tapat[b], sapagkat hindi niya kayang itatwa ang kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kung hindi tayo sumasampalataya” o “Kung hindi tayo nananatiling tapat.” Maaaring taglayin ng pandiwang Griyego ang alinman sa mga diwang ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapagkakatiwalaan.” Pinanatili ang “tapat” upang maipakita ang pagsalungat sa “hindi tayo tapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: hindi tayo tapat
  rationale: Pinananatili nito ang tuwirang pagsalungat sa πιστός at naiiwang bukas ang saklaw ng pandiwa sa kawalan ng pananampalataya o katapatan. Nililinaw sa talababa ang iba pang posibleng diwa.
- source_word: πιστὸς
  choice: tapat
  rationale: Likas at malinaw ito sa makabagong Tagalog at pinananatili ang sinadyang pagtutunggali sa “hindi tayo tapat.” Maaari rin itong magpahiwatig ng pagiging mapagkakatiwalaan.
- source_word: μένει
  choice: nananatili
  rationale: Tumpak nitong ipinahahayag ang nagpapatuloy na katapatan at natural itong pakinggan sa makabagong Tagalog.
- source_word: ἀρνήσασθαι
  choice: itatwa
  rationale: Ipinahahayag ng “itatwa” ang matibay na diwa ng pagkakaila o pagtatakwil nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: ἑαυτὸν
  choice: ang kanyang sarili
  rationale: Tuwirang katumbas ito ng panghalip na pabalik sa simuno at pinananatili ang diin na ang kanyang katapatan ay kaugnay ng sarili niyang pagkakakilanlan.
- source_word: οὐ δύναται
  choice: hindi niya kayang
  rationale: Malinaw nitong ipinahahayag ang kawalan ng kakayahan, hindi lamang ang kawalan ng pagnanais.
theological_decisions:
- issue: Kahulugan ng katapatan niya sa harap ng kawalan ng katapatan ng tao
  choice: Ipinahahayag lamang na nagpapatuloy ang kanyang katapatan sapagkat hindi niya kayang itatwa ang kanyang sarili.
  alternative: Tahasang ipakahulugan ang katapatan bilang katiyakang magliligtas, o bilang katapatan sa mga babala at paghatol.
  rationale: Hindi tinutukoy ng Griyegong pangungusap kung ang katapatan dito ay pangunahing tumutukoy sa pagliligtas, pagtupad sa mga pangako, o paghatol. Pinananatili ng salin ang teolohikal na tensiyong ito.
translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Pinanatili ang magkatugmang “hindi tayo tapat” at “siyang tapat” upang maipakita ang retorikal na pagsalungat sa Griyego. Ang “hindi niya kayang itatwa” ay natural ngunit malinaw na nagpapahayag ng οὐ δύναται.
