  verdict: approve
  source_fidelity: Tumpak na naisasalin ang dalawang magkatapat na kondisyon. Ang “nagtitiis tayo” ay maayos na katumbas ng present-tense na ὑπομένομεν at hindi nililimitahan ang pagtitiis sa isang partikular na uri ng pagsubok. Ang “maghahari rin tayong kasama niya” ay naghahatid ng kahulugang “maghaharing kasama,” at ang magkatugmang “ikakaila” sa dalawang sugnay ay pinananatili ang sinadyang pag-uulit ng ἀρνέομαι. Naipapahayag din ng “rin niya” ang katumbas na tugon na binibigyang-diin ng κἀκεῖνος.
  naturalness: Natural, malinaw, at marangal ang daloy sa makabagong Filipino Tagalog. Ang paralelismong “Kung …; kung …” at ang pag-uulit ng “rin” at “ikakaila” ay mabisa at hindi pilit.
  terminology: Ang “magtitiis,” “maghahari,” at “ikakaila” ay angkop sa rehistro at sa mga pangunahing salitang Griyego. Hindi ipinapasok ng salin ang anumang doktrinal na pagpapasya hinggil sa lawak o bunga ng pagkakaila.
