  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: tl
  text: Kung nagtitiis tayo[a], maghahari rin tayong kasama niya; kung ikakaila natin siya, ikakaila rin niya tayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nananatili tayong matatag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: nagtitiis tayo
  rationale: Ipinahahayag ng ὑπομένω ang matatag na pagtitiis sa gitna ng pagsubok o pagdurusa. Likas sa makabagong Tagalog ang “nagtitiis” at hindi ito nagdaragdag ng teknikal na teolohikong kahulugan.
- source_word: συμβασιλεύσομεν
  choice: maghahari rin tayong kasama niya
  rationale: Ang tambalang pandiwa ay nangangahulugang magharing kasama ng iba. Pinananatili ng “maghahari” ang maharlikang larawan, at nililinaw ng “kasama niya” ang kasamang paghahari kay Cristo na ipinahihiwatig ng konteksto.
- source_word: ἀρνησόμεθα
  choice: ikakaila natin siya
  rationale: Maaaring mangahulugan ang ἀρνέομαι na ikaila, itakwil, o hindi kilalanin. Ang “ikakaila” ay natural at marangal, at naipapanatili ang eksaktong pag-uulit ng pandiwa sa kasunod na sugnay.
- source_word: κἀκεῖνος
  choice: rin niya
  rationale: 'Ang κἀκεῖνος, mula sa καὶ ἐκεῖνος, ay nagpapakita ng katumbas na tugon: “siya rin.” Sa ayos ng pangungusap sa Tagalog, natural itong maipahayag bilang “ikakaila rin niya.”'
- source_word: ἀρνήσεται ἡμᾶς
  choice: ikakaila rin niya tayo
  rationale: Ang muling paggamit ng “ikakaila” ay nagpapanatili sa sinadyang pag-uulit ng ἀρνέομαι at sa matinding retorikal na pagtutumbas ng babala.
theological_decisions:
- issue: Likas ng babala sa ikalawang kondisyunal na sugnay
  choice: 'Isinalin nang tuwiran bilang tunay na babala: “kung ikakaila natin siya, ikakaila rin niya tayo.”'
  alternative: Maaari itong ipakahulugan bilang pagkawala lamang ng gantimpala o bilang isang kondisyong walang aktuwal na posibilidad.
  rationale: Nagbibigay ang Griyego ng tuwirang magkatapat na mga kondisyunal na pahayag at umaalingawngaw sa tradisyon ng mga babala ni Jesus tungkol sa pagkakaila. Pinananatili ng salin ang bigat at teolohikong tensiyon nang hindi nagpapasya sa mga pagtatalo tungkol sa pagtalikod, pananatili, o gantimpala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “tayo” at natural na ayos ng mga pandiwa, habang pinananatili ang balanseng paralelismo at matinding babala ng orihinal.
