  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: tl
  text: 'Mapagkakatiwalaan ang kasabihang ito:[a]


    Sapagkat kung namatay tayong kasama niya,[b]


    mabubuhay rin tayong kasama niya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tapat ang salita” o “Maaasahan ang pahayag.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Griyego ay literal na nangangahulugang “namatay tayong kasama [ng iba]”; ipinahihiwatig ng tambalang pandiwa ang pakikibahagi sa kamatayan kasama ni Cristo.
    reason: lexical_alternative
  - marker: c
    text: Ang “mabubuhay tayong kasama niya” ay maaaring tumukoy sa buhay na kasama ni Cristo sa muling pagkabuhay, sa pakikibahagi sa buhay niya, o sa dalawang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: mapagkakatiwalaan
  rationale: Bilang panaguring pang-uri para sa λόγος, ipinapahayag nito na ang kasabihan ay maaasahan at karapat-dapat paniwalaan. Mas natural ito sa modernong Tagalog kaysa sa literal na “tapat,” na maaaring magpahiwatig na ang salita ay kumikilos na parang isang taong matapat.
- source_word: ὁ λόγος
  choice: ang kasabihang ito
  rationale: Sa mga Liham Pastoral, bahagi ito ng pormulang nagpapakilala sa isang maikli at madaling tandaan na pahayag. Ang “kasabihang ito” ay natural na naghahatid ng gamit na iyon; idinagdag ang “ito” ayon sa likas na pagpapahayag sa Tagalog, hindi bilang bagong nilalaman.
- source_word: εἰ γὰρ
  choice: sapagkat kung
  rationale: Pinananatili ng “kung” ang kondisyon ng εἰ at ng “sapagkat” ang paliwanag na ugnayang ipinahihiwatig ng γάρ.
- source_word: συναπεθάνομεν
  choice: namatay tayong kasama niya
  rationale: Ang aorist na pandiwa at unlaping συν- ay nagpapahiwatig ng pakikibahagi sa kamatayan kasama ng iba. Ang tinutukoy na kasama ay si Cristo ayon sa konteksto, kaya likas na ipinahayag sa Tagalog ang implicit na “niya” nang hindi tinutukoy kung kailan o sa anong eksaktong paraan naganap ito.
- source_word: καὶ
  choice: rin
  rationale: Sa magkapares na sugnay, ang καί ay may diwang “also.” Ang “rin” ang natural na Tagalog na nagpapakita ng pagtutugma ng pagkamatay na kasama niya at pamumuhay na kasama niya.
- source_word: συζήσομεν
  choice: mabubuhay tayong kasama niya
  rationale: Ang anyong panghinaharap at unlaping συν- ay naghahayag ng pamumuhay na kasama ni Cristo. Ang “mabubuhay” ay sapat na malawak upang huwag paliitin ang pahayag sa iisang paliwanag tungkol sa buhay na ito.
theological_decisions:
- issue: Hindi tahasang binanggit na kasama sa mga pandiwang may συν-
  choice: Idagdag ang “kasama niya” sa dalawang sugnay, na tumutukoy kay Cristo.
  alternative: 'Iwang hindi hayag ang kasama: “kung namatay tayo, mabubuhay rin tayo.”'
  rationale: Bagaman walang hiwalay na layon sa Griyego, nasa mismong tambalang pandiwa ang diwa ng pakikibahagi “kasama” ng iba. Malinaw sa kontekstong nakasentro kay Cristo kung sino ang tinutukoy, at kailangan itong ihayag para maging malinaw at buo sa Tagalog.
- issue: Saklaw ng buhay na kasama ni Cristo
  choice: Panatilihin ang malawak na “mabubuhay rin tayong kasama niya.”
  alternative: Tukuyin lamang ito bilang buhay sa muling pagkabuhay sa hinaharap, o bilang kasalukuyang espirituwal na pakikibahagi sa buhay ni Cristo.
  rationale: Ang panghinaharap na συζήσομεν ay malakas na maaaring tumukoy sa buhay na kasama ni Cristo sa hinaharap, ngunit hindi nililinaw rito ang buong saklaw ng pahayag. Hindi dapat ipasok ng salin ang isang mas makitid na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang maikling, balanseng mga linya upang mapanatili ang anyong kasabihan ng teksto. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
