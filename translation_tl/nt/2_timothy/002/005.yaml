  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: tl
  text: At kung ang sinuman ay nakikipagpaligsahan bilang atleta, hindi siya puputungan ng korona malibang makipagpaligsahan siya ayon sa mga tuntunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ayon sa batas.” Ang pang-abay na Griyego ay maaari ring mangahulugang “sa paraang naaayon sa batas”; dito, malamang na tumutukoy ito sa pakikipagpaligsahan ayon sa mga tuntunin ng paligsahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: nakikipagpaligsahan / makipagpaligsahan bilang isang atleta
  rationale: Tahasang tumutukoy ang pandiwa sa paligsahang pang-atleta, hindi lamang sa pangkalahatang pagsisikap. Pinananatili rin ng pag-uulit ang ugnayang leksikal ng dalawang anyo ng ἀθλέω.
- source_word: τις
  choice: ang sinuman
  rationale: May pangkalahatan at di-tiyak na diwa ang panghalip; likas at inklusibo sa modernong Tagalog ang “ang sinuman.”
- source_word: στεφανοῦται
  choice: pinuputungan ng korona
  rationale: Pinananatili nito ang pasibong anyo at ang larawan ng koronang iginagawad sa nagwagi, nang hindi paunang tinutukoy kung anong espirituwal na gantimpala ang isinasagisag nito.
- source_word: νομίμως
  choice: ayon sa mga tuntunin
  rationale: Sa konteksto ng paligsahang pang-atleta, malinaw nitong ipinahahayag ang pagkilos alinsunod sa mga patakaran habang pinananatili sa talababa ang mas literal na diwang “ayon sa batas.”
- source_word: καὶ
  choice: din
  rationale: Ipinakikita ang pandagdag na halimbawa sa sunod-sunod na paghahalintulad sa konteksto.
- source_word: δὲ
  choice: At
  rationale: Ang δέ ay banayad na paglipat sa isa pang halimbawa; natural itong naipahahayag ng “At” sa Tagalog.
theological_decisions:
- issue: Kahulugan ng larawang korona
  choice: Panatilihin ang larawan ng atletang pinuputungan ng korona, nang hindi tinutukoy ang eksaktong espirituwal na gantimpala.
  alternative: Tahasang tukuyin ang korona bilang gantimpala sa huling panahon o bilang pagsang-ayon sa ministeryo.
  rationale: Hindi mismo nililinaw ng talata kung ano ang katumbas ng korona sa espirituwal na antas; ang pagsasalin ay hindi dapat magpasok ng isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinuputungan ng korona” upang mapanatili ang sinaunang larawang pang-atleta nang hindi nagiging lipas o labis na paliwanag.
