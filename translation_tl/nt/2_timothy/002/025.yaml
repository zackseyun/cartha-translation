base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: tl
  text: na mahinahong itinutuwid ang mga sumasalungat sa kanya,[a] sakaling pagkalooban sila ng Diyos ng pagsisisi na hahantong sa lubos na pagkakilala sa katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga sumasalungat”; walang tahasang layon ang participle sa Griyego, ngunit ipinahihiwatig ng konteksto na sumasalungat sila sa lingkod ng Panginoon at sa kanyang itinuturo.
    reason: lexical_alternative
  - marker: b
    text: O “marahil ay pagkalooban sila ng Diyos ng pagsisisi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: na mahinahong
  rationale: Ipinapahayag ng pariralang preposisyonal ang paraan ng pagtutuwid. Ang “mahinahong” ay likas sa modernong Tagalog at naghahatid ng kahinahunan nang hindi nagpapahiwatig ng kahinaan.
- source_word: παιδεύοντα
  choice: itinutuwid
  rationale: Sa konteksto, tumutukoy ito sa pagtuturong nagwawasto, hindi sa pagpaparusa. Pinananatili ng “itinutuwid” ang diwang korektibo at pedagogikal.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: ang mga sumasalungat sa kanya
  rationale: Ang participle ay tumutukoy sa mga taong pumapanig laban o sumasalungat. Ang “sa kanya” ay hango sa konteksto—ang lingkod ng Panginoon sa naunang talata—at hindi tahasang nasa Griyego, kaya nilagyan ng talababa.
- source_word: μήποτε
  choice: sakaling
  rationale: Kasama ng aorist subjunctive na δώῃ, ipinahahayag nito ang maingat at hindi tiyak na posibilidad. Ang “sakaling” ay malinaw na nag-uugnay sa pagtutuwid at sa maaaring ipagkaloob ng Diyos.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: pagkalooban sila ng Diyos
  rationale: Ang δίδωμι rito ay idiomatikong “magkaloob.” Kasama ng μήποτε, pinananatili ng “sakaling pagkalooban” ang pagiging contingent ng pahayag.
- source_word: μετάνοιαν
  choice: pagsisisi
  rationale: Ang “pagsisisi” ang kinikilalang salin sa kontekstong ito at sumasaklaw sa pagbabago ng isip at pagbaling ng buhay, sa halip na gawing intelektuwal lamang ang μετάνοια.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: na hahantong sa lubos na pagkakilala sa katotohanan
  rationale: Ang εἰς ay nagpapahiwatig ng layunin o resulta. Ipinahahayag ng “hahantong” ang pag-usad tungo sa resulta, at ng “lubos na pagkakilala” ang mas matinding diwa ng ἐπίγνωσις kaysa payak na kaalaman.
theological_decisions:
- issue: Pagkilos ng Diyos at pagsisisi ng tao
  choice: Pinanatiling Diyos ang maaaring magkaloob ng pagsisisi, habang hindi ipinapaliwanag ng salin kung paano ito kaugnay ng pananagutan at pagtugon ng tao.
  alternative: Palakasin ang deterministikong pagbasa, o pahinain ang tahasang pagkilos ng Diyos sa pagsisisi.
  rationale: Tahasang inilalahad ng Griyego ang Diyos bilang nagbibigay ng pagsisisi, ngunit hindi sistematikong nilulutas ng talata ang kaugnayan nito sa pagtugon ng tao. Pinananatili ng salin ang tensiyong ito.
- issue: Lakas ng μήποτε at subjunctive
  choice: “sakaling pagkalooban”
  alternative: “marahil ay pagkalooban”
  rationale: Parehong maaaring magpahayag ng posibilidad. Pinili ang “sakaling” dahil likas nitong iniuugnay ang mahinahong pagtutuwid sa inaasahang ngunit hindi ipinipilit na resulta.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas basahin. Pinanatili ang participial na kaugnayan sa naunang talata sa pamamagitan ng “na,” at iniwasan ang teknikal o denominasyonal na pananalita.
