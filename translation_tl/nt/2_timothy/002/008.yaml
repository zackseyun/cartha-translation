id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: tl
  text: Alalahanin mo si Jesus, ang Mesiyas[a], na ibinangon mula sa mga patay at nagmula sa angkan ni David[b], ayon sa aking ebanghelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “si Jesu-Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Cristo” o “Mesiyas”; ginamit dito ang “Mesiyas” upang luminaw ang kahulugan ng titulo, lalo na kaugnay ng pagkamula niya sa angkan ni David.'
    reason: alternative_reading
  - marker: b
    text: 'Sa literal: “mula sa binhi ni David.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Lagi mong alalahanin
  rationale: Ang pangkasalukuyang pautos ay naghihikayat ng patuloy na pag-alala. Likas sa modernong Tagalog ang pariralang ito at malinaw ang puwersa ng utos.
- source_word: Ἰησοῦν Χριστόν
  choice: si Jesus, ang Mesiyas
  rationale: Ginagamit ang Χριστός bilang titulong may kaugnayan sa pagiging mula sa lahi ni David. Ang appositional na anyo ay natural sa Tagalog at pinananatili ang kahulugan ng titulo.
- source_word: ἐγηγερμένον
  choice: na ibinangon
  rationale: Pinananatili ng pandiwang balintiyak ang diwang si Jesus ay ibinangon, habang ang konteksto ay nagpapahiwatig ng nananatiling bunga ng pagkabuhay na muli.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Ito ang malinaw at karaniwang salin sa Tagalog para sa pahayag tungkol sa pagkabuhay na muli.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: nagmula sa lahi ni David
  rationale: Sa kontekstong genealogical, ang σπέρμα ay tumutukoy sa salinlahi. Mas natural ang “lahi” kaysa literal na “binhi,” habang pinananatili sa talababa ang literal na larawan.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: ayon sa aking ebanghelyo
  rationale: Tuwirang pinananatili ang κατά bilang “ayon sa” at ang possessive na μου bilang “aking,” nang hindi ipinahihiwatig na ibang ebanghelyo ito.
theological_decisions:
- issue: Paglalarawan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Kapansin-pansin dito ang tungkulin ng Χριστός bilang titulo dahil kaagapay nito ang pagbanggit sa lahi ni David. Inilalagay sa talababa ang nakaugaliang alternatibong “Cristo.”
- issue: Puwersa ng perfect passive participle ἐγηγερμένον
  choice: na ibinangon
  alternative: na muling nabuhay
  rationale: Pinananatili ng “ibinangon” ang balintiyak na anyo ng Griyego at hindi tahimik na ginagawang intransitibo ang pahayag.
- issue: Kahulugan ng “aking ebanghelyo”
  choice: ayon sa aking ebanghelyo
  alternative: ayon sa ebanghelyong ipinangangaral ko
  rationale: Pinananatili ang payak na possessive ng teksto. Hindi ito pinalalawak sa pangunahing teksto ni binibigyang-kahulugang hiwalay na ebanghelyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Lagi mong alalahanin” upang maipahayag ang nagpapatuloy na puwersa ng pautos; “ebanghelyo” ang pinanatiling pamilyar na terminong biblikal.
