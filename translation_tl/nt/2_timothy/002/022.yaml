base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: tl
  text: Ngunit layuan mo ang mga pagnanasang nauugnay sa kabataan[a]. Sa halip, pagsikapan mo ang katuwiran[b], pananampalataya[c], pag-ibig, at kapayapaan, kasama ng mga tumatawag sa Panginoon mula sa pusong malinis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga silakbo ng pagnanasang nauugnay sa kabataan.” Malawak ang saklaw ng pariralang Griyego at hindi lamang tumutukoy sa pagnanasang seksuwal.
    reason: lexical_alternative
  - marker: b
    text: O “katarungan.” Maaaring tumukoy ang salitang Griyego kapuwa sa matuwid na asal at sa makatarungang pakikitungo.
    reason: alternative_reading
  - marker: c
    text: O “katapatan.” Maaaring mangahulugan ang salitang Griyego ng pananampalataya, pagtitiwala, o katapatan ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: mga pagnanasang karaniwan sa kabataan
  rationale: Ipinahahayag ang malawak na saklaw ng mga pagnanasang kaugnay ng kabataan at hindi ito nililimitahan sa pagnanasang seksuwal.
- source_word: φεῦγε
  choice: layuan mo
  rationale: Natural sa modernong Tagalog at malinaw na naghahayag ng mariing pag-iwas; ang aspektong nagpapatuloy ay nauunawaan bilang palagiang utos.
- source_word: δίωκε
  choice: pagsikapan mong mamuhay nang
  rationale: Ipinahahayag ang aktibo at patuloy na paghahangad sa mga sumusunod na katangian, sa mas natural na anyong Tagalog kaysa sa literal na “habulin.”
- source_word: δικαιοσύνην
  choice: mamuhay nang matuwid
  rationale: Natural na katumbas ng etikal na δικαιοσύνη sa listahan ng mga birtud; pinananatili sa talababa ang posibleng diwang katarungan.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Karaniwang katumbas ng πίστις at angkop sa konteksto, habang kinikilala sa talababa ang posibleng kahulugang katapatan.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Tuwiran, natural, at pinananatili ang ugnayang leksikal sa ibang gamit ng ἀγάπη.
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Tuwiran at angkop na katumbas sa listahan ng mga katangiang dapat pagsikapan.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: kasama ng mga tumatawag sa Panginoon
  rationale: Ipinakikita ng “kasama” ang pakikiugnay sa ibang mga mananampalataya; natural na salin ang “tumatawag sa Panginoon” para sa pananalangin o pagsamba.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: mula sa pusong malinis
  rationale: Pinananatili ang diwa ng ἐκ bilang pinagmumulan at natural itong pakinggan sa marangal na Tagalog.
theological_decisions:
- issue: Saklaw ng νεωτερικὰς ἐπιθυμίας
  choice: Malawak na mga pagnanasang karaniwan sa kabataan
  alternative: Pangunahing mga pagnanasang seksuwal
  rationale: Hindi nililimitahan ng pariralang Griyego ang kahulugan sa seksuwal na pagnanasa; pinananatili ng salin ang mas malawak na etikang saklaw.
- issue: Kahulugan ng δικαιοσύνη
  choice: Pamumuhay nang matuwid sa pangunahing teksto
  alternative: Katarungan
  rationale: Ang konteksto ay listahan ng mga birtud at ang “mamuhay nang matuwid” ay natural sa Tagalog, ngunit maaari ring taglayin ng salita ang relasyonal o legal na diwa ng katarungan.
- issue: Kahulugan ng πίστις
  choice: Pananampalataya sa pangunahing teksto
  alternative: Katapatan
  rationale: Kapuwa posible ang pananampalataya at katapatan sa listahang ito; pinananatili sa talababa ang tunay na leksikal na posibilidad nang hindi nilulutas nang sapilitan ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “layuan” sa halip na mas literal ngunit di-natural na “tumakas,” at pinalawak ang sintaks ng δίωκε bilang “pagsikapan mong mamuhay nang” upang maging malinaw at likas ang listahan ng mga birtud. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
