  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng mga utos na «layuan» at «pagsikapan,» gayundin ng pakikisamang ipinahihiwatig ng μετά at ng pinagmumulang diwa ng ἐκ. Gayunman, ang «pagsikapan mong mamuhay nang matuwid, may pananampalataya» ay nagpapalit sa tuwirang listahan ng apat na pangngalan sa isang paglalarawan ng paraan ng pamumuhay. Mas tapat na panatilihin ang δικαιοσύνην, πίστιν, ἀγάπην, at εἰρήνην bilang magkakatulad na bagay ng «pagsikapan.»
  naturalness: Natural at marangal ang rebisyon sa modernong Filipino Tagalog. Ang «mga pagnanasang nauugnay sa kabataan» ay mas tuwiran at hindi ipinahihiwatig na pangkaraniwan o pangkalahatan ang bawat kabataang tao. Ang magkakatulad na listahan pagkatapos ng «pagsikapan» ay malinaw at likas.
  terminology: Ginamit ang «katuwiran» para sa δικαιοσύνη bilang pangngalang birtud na kaayon ng Griyego at ng kasunod na «pananampalataya, pag-ibig, at kapayapaan.» Nananatili sa talababa ang «katarungan» bilang posibleng kaugnay na diwa. Pinananatili ang «Panginoon,» «pananampalataya,» «pag-ibig,» at «kapayapaan.»
