  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: tl
  text: na lumihis sa katotohanan[a], na sinasabing nangyari na ang muling pagkabuhay[b], at sinisira ang pananampalataya ng ilan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumala hinggil sa katotohanan” o “naligaw mula sa katotohanan.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, inaangkin nilang naganap na ang muling pagkabuhay na hinihintay pa sa hinaharap; hindi tinutukoy ng talata kung paano nila ito ipinaliliwanag.
    reason: theological_clarification
  - marker: c
    text: O “ibinabagsak” o “ginugulo.” Ang “pananampalataya” ay maaari ring unawain dito bilang “pagtitiwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: na
  rationale: Ipinagpapatuloy nito ang paglalarawan sa mga huwad na guro mula sa naunang talata; natural sa Tagalog ang pang-ugnay na “na” sa ganitong sugnay.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: lumihis sa katotohanan
  rationale: Ipinahahayag ng idyoma ang paglihis o pagkakamali hinggil sa katotohanan. Ang “lumihis sa katotohanan” ay malinaw at natural, habang pinananatili sa talababa ang larawang “sumala sa tudlaan.”
- source_word: λέγοντες
  choice: na sinasabing
  rationale: Pinananatili ang ugnayang participyal at ipinakikita ang nilalaman o paraan ng kanilang paglihis nang hindi higit na tinutukoy ang eksaktong relasyon.
- source_word: ἀνάστασιν
  choice: ang muling pagkabuhay
  rationale: 'Bagaman walang artikulo sa Griyego, tiyak ang tinutukoy sa kontekstong doktrinal: ang muling pagkabuhay.'
- source_word: ἤδη γεγονέναι
  choice: nangyari na
  rationale: Natural na Tagalog ito para sa perfect infinitive na nagsasaad ng pangyayaring inaangking natapos na at may kasalukuyang kabuluhan.
- source_word: ἀνατρέπουσιν
  choice: ginugulo nila
  rationale: Ipinahahayag ang patuloy na destabilizing effect sa pananampalataya nang hindi ipinapalagay na lubusan na itong nawasak; inilalahad sa talababa ang mas matinding alternatibo.
- source_word: τήν τινων πίστιν
  choice: ang pananampalataya ng ilan
  rationale: Ang “pananampalataya” ang karaniwan at hindi labis na mapagpasyang salin ng πίστις; malinaw na ipinapakita ng “ng ilan” ang di-tiyak na genitive.
theological_decisions:
- issue: Kahulugan ng pahayag na nangyari na ang muling pagkabuhay
  choice: Isinalin ang mismong maling pahayag nang hindi tinutukoy ang buong sistemang teolohikal sa likod nito.
  alternative: Ipaliwanag sa teksto na espirituwal lamang umano ang muling pagkabuhay o na itinatanggi nila ang isang darating na muling pagkabuhay ng katawan.
  rationale: Hindi inilalahad ng talata ang eksaktong mekanismo ng maling aral; dapat panatilihin ang saklaw at tensiyon ng pahayag.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang “pananampalataya” ang pinakanatural na katawagang teolohikal dito, ngunit maaaring tumukoy sa pagtitiwala ng mga mananampalataya; hindi kailangang pagpasyahan nang mas makitid sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “muling pagkabuhay” at “pananampalataya” bilang pamilyar na mga terminong biblikal. Ang pangungusap ay sadyang nagsisimula sa “na” dahil ang talata ay karugtong ng antecedent sa 2 Timoteo 2:17.
