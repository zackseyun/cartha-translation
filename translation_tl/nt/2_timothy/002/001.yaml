lexical_decisions:
- source_word: Σὺ οὖν
  choice: Kaya ikaw
  rationale: Pinananatili ng “ikaw” ang diin ng tahasang panghalip, at ipinahahayag ng “kaya” ang hinuha o paglipat mula sa naunang konteksto.
- source_word: τέκνον μου
  choice: anak ko
  rationale: Ang τέκνον ay “anak” at hindi tiyak na “anak na lalaki”; likas din itong nagpapahayag ng magiliw na ugnayang espirituwal.
- source_word: ἐνδυναμοῦ
  choice: patuloy kang humugot ng lakas
  rationale: Likas ito sa makabagong Tagalog at ipinakikitang tinatanggap ang lakas sa halip na likhain lamang sa sarili. Ang “patuloy” ay angkop sa aspektong pangkasalukuyan ng pautos.
- source_word: ἐν τῇ χάριτι
  choice: sa biyaya
  rationale: Pinananatili ng “sa” ang maaaring pagsasanib ng saklaw at kasangkapan sa ἐν, nang hindi nililimitahan ang diwa sa “sa pamamagitan ng.”
- source_word: χάριτι
  choice: biyaya
  rationale: Ang “biyaya” ang natural at kinikilalang salin ng χάρις sa kontekstong Paulino, kabilang ang mapagkaloob at nagpapalakas na pagkilos ng Diyos.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: nasa Mesiyas na si Jesus
  rationale: Ipinakikita nitong ang biyaya ay matatagpuan o nakaugnay sa Mesiyas na si Jesus, habang pinananatili ang pamagat na kahulugan ng Χριστός.
theological_decisions:
- issue: Tinig at ahensiya sa ἐνδυναμοῦ
  choice: “patuloy kang humugot ng lakas,” na nagpapahiwatig ng lakas na tinatanggap
  alternative: “magpakalakas ka” o “magpakatatag ka”
  rationale: Maaaring middle o passive ang anyo ng pandiwa. Iniiwasan ng piniling salin ang diwang nagsasarili sa pagpapalakas at umaayon sa kasunod na pariralang tumutukoy sa biyaya.
- issue: Pagpapahayag sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagawang hayag ng “Mesiyas” ang kahulugan ng Griyegong pamagat, sa halip na ituring lamang itong bahagi ng pangalan; inilalagay sa talababa ang tradisyonal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humugot ng lakas” upang maging natural ang pautos habang pinananatili ang receptive nuance; iniwasan ang mas teknikal o makalumang pananalita.
