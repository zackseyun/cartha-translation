  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: tl
  text: Ingatan mo ang mabuting ipinagkatiwala[a] sa pamamagitan ng Espiritu Santo na nananahan sa atin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang marangal na ipinagkatiwala”; literal, “ang mabuting deposito.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng Espiritu Santo na naninirahan sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: ang mabuting ipinagkatiwala sa iyo
  rationale: Ang παραθήκη ay isang bagay na ipinagkatiwala upang ingatan. Mas natural sa modernong Tagalog ang pariralang “ipinagkatiwala sa iyo” kaysa sa literal ngunit di-likas na “deposito,” samantalang pinananatili ng “mabuti” ang karaniwang diwa ng καλός. Ang “sa iyo” ay likas na ipinahihiwatig ng konsepto at ng utos kay Timoteo, ngunit hindi tinutukoy sa pangunahing teksto kung ano mismo ang ipinagkatiwala.
- source_word: φύλαξον
  choice: Ingatan mo
  rationale: Ipinahahayag nito ang tuwirang utos na bantayan at panatilihing ligtas ang isang bagay na ipinagkatiwala.
- source_word: διὰ πνεύματος ἁγίου
  choice: sa pamamagitan ng Espiritu Santo
  rationale: Pinananatili nito ang instrumental o ahensiyang gamit ng διά na may genitive nang hindi nagdaragdag ng ideyang “kapangyarihan” na hindi tahasang nasa Griyego.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: na nananahan sa atin
  rationale: Ang kasalukuyang participle ay tumutukoy sa patuloy na pananahan ng Espiritu. Ang “sa atin” ay tuwirang katumbas ng ἐν ἡμῖν at hindi nililimitahan ang tinutukoy ng panghalip.
theological_decisions:
- issue: Ang tinutukoy ng “mabuting ipinagkatiwala”
  choice: Hindi tinukoy sa pangunahing teksto kung ito ay ang ebanghelyo, aral, o tungkulin ni Timoteo.
  alternative: Tahasang isalin bilang “mabuting balita” o “ministeryong ipinagkatiwala sa iyo.”
  rationale: Bagaman malakas ang pahiwatig ng konteksto sa apostolikong mensahe, nananatiling pangkalahatan at metaporikal ang παραθήκη; kaya hindi nilulutas ng salin ang referent.
- issue: Saklaw ng “atin”
  choice: Pinanatili ang “atin” nang hindi nililimitahan kung ito ay sina Pablo at Timoteo lamang o ang mga mananampalataya sa pangkalahatan.
  alternative: Ipaliwanag bilang “sa ating lahat na sumasampalataya” o “sa aming dalawa.”
  rationale: Hindi nililinaw ng ἡμῖν ang eksaktong saklaw, kaya dapat panatilihin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagkatiwala” sa halip na “deposito” upang maging likas sa ordinaryong mambabasa habang pinananatili ang larawan ng isang mahalagang bagay na dapat bantayan. Ang ayos ng pangungusap ay malapit sa Griyego ngunit idiomatiko sa Tagalog.
