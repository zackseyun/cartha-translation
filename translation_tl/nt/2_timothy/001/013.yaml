  to: Panghawakan mo ang huwaran ng mga mabubuting salitang narinig mo mula sa akin,[a] nang may pananampalataya[b] at pag-ibig na nasa Mesiyas na si Jesus.[c]
  rationale: Pinalitan ang "wastong" ng "mabubuting" upang higit na maipakita ang metaporikal na ὑγιαινόντων na "sound/healthy," habang pinananatili ang λόγων bilang "mga salita." Pinalinaw ang pahiwatig ng pinagmulan sa "mula sa akin." Pinalitan ang "na matatagpuan sa" ng mas tuwirang "na nasa," na pinananatili ang preposisyong ἐν nang hindi idinaragdag ang isang partikular na teolohikal na pagpapaliwanag. Inayos din ang mga angkla ng talababa upang ang lexical note para sa πίστις ay kasunod mismo ng "pananampalataya."
