  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: tl
  text: Panghawakan mo ang huwaran ng mga mabubuting salitang narinig mo mula sa akin,[a] nang may pananampalataya[b] at pag-ibig na nasa Mesiyas na si Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Panghawakan mo ang huwaran ng mga mabubuting salitang narinig mo mula sa akin tungkol sa pananampalataya at pag-ibig na nasa Mesiyas na si Jesus.” Maaaring tumukoy ang pariralang Griyego sa paraan ng panghahawak ni Timoteo o sa nilalaman ng mga salita.'
    reason: alternative_reading
  - marker: b
    text: O “nang may katapatan at pag-ibig.” Maaari ring magtaglay ang salitang Griyego para sa “pananampalataya” ng diwang “katapatan” o “pagtitiwala.”
    reason: lexical_alternative
  - marker: c
    text: 'Tradisyonal na salin: “Cristo Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: huwaran
  rationale: Ipinahihiwatig ng salita ang isang padron, balangkas, o modelong dapat sundin. Natural at marangal sa modernong Filipino ang “huwaran” at hindi nito labis na nililimitahan ang kahulugan.
- source_word: ἔχε
  choice: Panghawakan mo
  rationale: Bagaman literal na “taglayin” o “magkaroon,” ang pautos sa konteksto ay tumutukoy sa patuloy na pag-iingat at pananatili sa ibinigay na huwaran.
- source_word: ὑγιαινόντων λόγων
  choice: wastong mga salita
  rationale: Metaporikal na nangangahulugang malusog o walang kapintasan ang ὑγιαινόντων. Pinananatili ng “mga salita” ang λόγων, samantalang malinaw at natural na ipinahahayag ng “wasto” ang metaporikal na diwa sa Filipino nang hindi ito tahasang ginagawang “aral.”
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: na narinig mo sa akin
  rationale: Ang παρά na may genitive ay nagsasaad ng pinagmulan; idiomatiko sa Filipino ang “narinig mo sa akin.”
- source_word: ἐν πίστει
  choice: nang may pananampalataya
  rationale: Ipinakikita ng “nang may” ang malamang na paraan o kalagayan ng panghahawak. Ang πίστις ay pangunahing isinaling “pananampalataya,” habang inilalahad sa talababa ang posibleng diwang “katapatan” o “pagtitiwala.”
- source_word: καὶ ἀγάπῃ
  choice: at pag-ibig
  rationale: Tuwirang katumbas at natural sa Filipino ang “pag-ibig” para sa ἀγάπη.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: na matatagpuan sa Mesiyas na si Jesus
  rationale: Iniuugnay ng parirala ang pananampalataya at pag-ibig kay Jesus bilang Mesiyas. Ginagawang malinaw ng “na matatagpuan sa” ang kaugnayan nang hindi ipinapakahulugang pisikal na lokasyon.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesiyas na si Jesus
  rationale: Gumaganap bilang titulo ang Χριστός; natural na ipinakikilala ito sa Filipino sa anyong “Mesiyas na si Jesus.”
theological_decisions:
- issue: Kaugnayan ng ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ
  choice: Iniuugnay ang parirala sa paraan o kalagayan ng panghahawak ni Timoteo sa huwaran.
  alternative: Maaaring inilalarawan nito ang nilalaman ng mga salita—mga salita tungkol sa pananampalataya at pag-ibig sa Mesiyas na si Jesus.
  rationale: Mas naaayon sa daloy ng utos na unawain itong paraan ng panghahawak, ngunit tunay na pinahihintulutan ng sintaks na Griyego ang alternatibong pagbasa, kaya pinanatili iyon sa talababa.
- issue: Paglilipat ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Nananatili rito ang puwersa nito bilang titulo, kaya “Mesiyas” ang mas tuwirang naghahatid ng kahulugan; ibinibigay sa talababa ang tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Panghawakan,” “huwaran,” at “wastong mga salita” upang manatiling malapit sa estruktura at mga larawang Griyego nang hindi nagiging artipisyal. Inayos ang “Mesiyas na si Jesus” bilang likas na anyo ng isang titulo at pangalan sa Filipino.
