  text: but when he was in Rome[a], he searched for me diligently and found me—
translation:
  language: tl
  text: Ngunit nang nasa Roma siya[a], masikap niya akong hinanap at natagpuan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang dumating siya sa Roma” o, mas pormal, “nang siya ay nasa Roma.” Maaaring ipahayag sa ilang paraan ang Griyegong pandiwaring γενόμενος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: kundi
  rationale: Nagpapahayag ito ng matinding pagsalungat sa asal ng iba sa naunang konteksto; natural sa Filipino ang “kundi” matapos ang negatibong pahayag sa talata 16.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: nang nasa Roma siya
  rationale: Pinananatili ang posibleng lokatibong diwa ng parirala nang hindi tiyak na ipinapasok ang ideya ng pagdating; inilalagay sa talababa ang lehitimong alternatibo.
- source_word: σπουδαίως
  choice: masikap
  rationale: Ipinahihiwatig ang taimtim at puspusang pagsisikap sa paghahanap, sa natural at dignidad na Filipino.
- source_word: ἐζήτησέν με
  choice: niya akong hinanap
  rationale: Tuwirang ipinapahayag ang aktibong paghahanap sa isang tao.
- source_word: καὶ εὗρεν
  choice: at natagpuan
  rationale: Likas na iniiwan sa Filipino ang inuulit na layon na “ako,” yamang malinaw ito mula sa naunang sugnay.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “masikap” sa halip na mas mabigat na “buong sikap” upang manatiling maigsi. Pinanatili ang gitling sa dulo dahil nagpapatuloy ang pangungusap sa kasunod na talata.
