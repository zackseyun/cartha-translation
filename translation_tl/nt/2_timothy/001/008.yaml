  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: tl
  text: Kaya huwag mong ikahiya ang patotoo tungkol sa ating Panginoon[a], ni ako, na bilanggo niya. Sa halip, makibahagi ka sa paghihirap alang-alang sa ebanghelyo[b], ayon sa kapangyarihan ng Diyos,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang patotoo ng ating Panginoon.” Maaaring ganito ang kahulugan ng anyong genitive sa Griyego, ngunit sa kontekstong ito ay malamang na tumutukoy ito sa patotoo tungkol sa Panginoon.
    reason: alternative_reading
  - marker: b
    text: O, “makibahagi ka sa pagdurusa para sa ebanghelyo.” Ipinahihiwatig ng pandiwang Griyego ang pakikisama sa iba sa pagtitiis ng hirap.
    reason: lexical_alternative
  - marker: c
    text: O, “sa pamamagitan ng kapangyarihan ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Kaya huwag mong
  rationale: Ipinakikita ng οὖν ang kongklusyon o bunga ng naunang payo; natural sa modernong Tagalog ang “Kaya,” at malinaw na utos ang “huwag mong.”
- source_word: ἐπαισχυνθῇς
  choice: ikahiya
  rationale: Tumutukoy ito sa pagkadama ng hiya o pag-urong dahil sa kahihiyan; maikli at likas sa Tagalog ang “ikahiya.”
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: ang patotoo tungkol sa ating Panginoon
  rationale: 'Binabasa ang genitive bilang objective: ang Panginoon ang paksa ng patotoo. Pinananatili sa talababa ang tunay na posibilidad na ito ay patotoong mula sa Panginoon.'
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: ni ako na bilanggo niya
  rationale: Iniuugnay ng μηδέ ang ikalawang bagay na hindi dapat ikahiya. Pinananatili ng “bilanggo niya” ang kaugnayang ipinahahayag ng αὐτοῦ nang hindi nililimitahan kung ito ay pag-aari, pagkakaugnay, o pagkabilanggo alang-alang sa Panginoon.
- source_word: συγκακοπάθησον
  choice: makibahagi ka sa paghihirap
  rationale: Ipinahahayag ng unlaping συν- ang pakikisama sa iba sa pagdurusa; malinaw at natural itong naihahatid ng “makibahagi.”
- source_word: τῷ εὐαγγελίῳ
  choice: para sa magandang balita
  rationale: Ang datibong kaugnayan ay siksik sa Griyego. Ang “para sa” ay natural sa Tagalog at nagpapahayag ng paghihirap dahil sa paglilingkod sa magandang balita, habang itinatala ang mas literal na alternatibo.
- source_word: κατὰ δύναμιν θεοῦ
  choice: ayon sa kapangyarihan ng Diyos
  rationale: Pinananatili ng “ayon sa” ang saklaw ng κατά—maaaring pamantayan, sukat, o kapangyarihang nagbibigay-kakayahan—sa halip na agad itong paliitin sa “sa pamamagitan ng.”
theological_decisions:
- issue: Kaugnayan ng “patotoo” sa “ating Panginoon”
  choice: “patotoo tungkol sa ating Panginoon” bilang objective genitive
  alternative: “patotoo ng ating Panginoon,” na maaaring mangahulugang patotoong ibinigay ng Panginoon
  rationale: Sa konteksto, hinihimok si Timoteo na huwag ikahiya ang Cristianong patotoong nakasentro sa Panginoon, kaagapay ng hindi niya pagkahiya kay Pablo. Gayunman, hindi inaalis ang gramatikal na alternatibo at inilalagay ito sa talababa.
- issue: Diwa ng “bilanggo niya”
  choice: panatilihin ang tuwirang possessive na kaugnayan sa Panginoon
  alternative: “bilanggo alang-alang sa kanya” o “bilanggo ng Panginoon”
  rationale: Hindi nilulutas ng αὐτοῦ nang mag-isa ang lahat ng aspekto ng kaugnayan. Ang “bilanggo niya” ay nagpapanatili sa siksik na pahayag na ang pagkabilanggo ni Pablo ay nakaugnay sa kanyang pagiging kay Cristo.
- issue: Kaugnayan ng paghihirap sa magandang balita
  choice: “makibahagi ... sa paghihirap para sa magandang balita”
  alternative: “makibahagi sa paghihirap kasama ng magandang balita”
  rationale: Mas natural at malinaw sa Tagalog ang napiling pahayag, ngunit ang datibo at ang tambalang pandiwa ay hindi ganap na tuwiran; kaya itinatala ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” para sa εὐαγγέλιον bilang malinaw na katutubong katumbas. Pinanatili ang siksik na teolohikal na ugnayan sa “bilanggo niya” at ang ambiguwidad ng κατά sa pamamagitan ng pangunahing salin at talababa.
