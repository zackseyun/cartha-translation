  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: tl
  text: Sabik akong makita ka[a], habang naaalaala ko ang iyong mga luha, upang mapuspos ako ng kagalakan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Labis kong ninanais na makita ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: Sabik
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang matindi at personal na pananabik. Ang “sabik” ay natural sa makabagong Filipino at angkop sa kasunod na pawatas na “makita.”
- source_word: σε ἰδεῖν
  choice: akong makita ka
  rationale: Tuwirang ipinakikita ng parirala na ang minimithing mangyari ay ang makita si Timoteo. Natural sa Filipino ang ayos na “sabik akong makita ka.”
- source_word: μεμνημένος
  choice: habang naaalaala ko
  rationale: Ang perpektong pandiwari ay nagpapahiwatig ng nananatiling pag-alaala. Nililinaw ng “habang” ang kasabay na ugnayan nito sa pananabik nang hindi ito ginagawang hiwalay na pangunahing kilos.
- source_word: σου τῶν δακρύων
  choice: ang iyong mga luha
  rationale: Pinananatili nito ang kongkretong larawan ng mga luha ni Timoteo at hindi ito pinalalawak sa mas interpretatibong “pag-iyak.”
- source_word: ἵνα
  choice: upang
  rationale: Maikli at marangal na panandang Filipino para sa layunin; hindi nito ganap na isinasara ang posibleng bahid ng inaasahang resulta.
- source_word: χαρᾶς
  choice: ng kagalakan
  rationale: Ang genitibo kasunod ng πληρόω ay likas na naihahayag sa Filipino bilang bagay na ipinupuspos sa isang tao.
- source_word: πληρωθῶ
  choice: mapuspos ako
  rationale: Pinananatili ng anyong ito ang pasibong diwa at ang subjunctive na nakaugnay sa ἵνα. Ang “mapuspos” ay dignificado ngunit malinaw sa karaniwang mambabasa.
theological_decisions:
- issue: Ugnayan ng ἵνα sa pagkakita kay Timoteo at sa pag-alaala sa kanyang mga luha
  choice: “upang mapuspos ako ng kagalakan”
  alternative: “para lubos akong magalak”
  rationale: Pinananatili ang gramatikal na layunin/resulta at ang pasibong larawang “mapuspos,” nang hindi ipinapaliwanag kung ang kagalakan ay bunga lamang ng muling pagkikita o ng buong kalagayang inilalarawan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang anyo nitong bahagi ng mas mahabang pangungusap sa pamamagitan ng pangwakas na kuwit. Ang “naaalaala” ay ginamit sa pamantayang anyo upang ipahayag ang nagpapatuloy na kalagayan ng pag-alaala.
