  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: tl
  text: Sapagkat hindi tayo binigyan ng Diyos ng espiritu ng kaduwagan,[a] kundi ng kapangyarihan, pag-ibig, at pagpipigil sa sarili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging duwag” o “pagkatakot.” Ang salitang Griyego ay tumutukoy sa kaduwagan o takot na nagpapaurong, hindi sa lahat ng uri ng takot.
    reason: lexical_alternative
  - marker: b
    text: O “matinong paghatol” o “disiplina sa sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Ipinakikita ng “sapagkat” ang paliwanag na kaugnay ng naunang panghihikayat, habang tuwirang ipinahahayag ng “hindi” ang negasyon.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: tayo binigyan ng Diyos
  rationale: Natural sa modernong Tagalog ang ayos na ito para sa payak na nagdaang kilos at sa di-tuwirang layon na ἡμῖν.
- source_word: πνεῦμα
  choice: espiritu
  rationale: 'Pinananatili nito ang lawak ng salitang Griyego: maaaring tumukoy sa espiritu o sa kaloob na disposisyon, nang hindi tahasang itinatalaga bilang pamagat na “Espiritu Santo.”'
- source_word: δειλίας
  choice: kaduwagan
  rationale: Mas tiyak ito kaysa karaniwang “takot” at taglay nito ang negatibong diwa ng kahiya-hiyang pag-uurong o pagiging duwag.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ay natural na katapat ng matinding pagsalungat pagkatapos ng negatibong sugnay.
- source_word: δυνάμεως
  choice: kapangyarihan
  rationale: Direkta at karaniwang katumbas ito ng δύναμις sa triad na ito, bagaman maaari rin itong magpahiwatig ng lakas o kakayahan.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Ito ang natural at malinaw na modernong salin ng ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: pagpipigil sa sarili
  rationale: Malinaw nitong ipinahahayag ang etikal na diwa ng pagpipigil at disiplina sa sarili, habang inilalagay sa talababa ang posibleng diin sa matinong paghatol.
theological_decisions:
- issue: Tinutukoy ng πνεῦμα
  choice: “espiritu,” na hindi tahasang ginawang “Espiritu Santo”
  alternative: “Espiritu” bilang tuwirang pagtukoy sa Espiritu Santo; o “disposisyon”
  rationale: Ang πνεῦμα ay walang pantukoy at inilalarawan ng magkakatapat na genitive. Hindi hinihingi ng sintaks na lutasin kung ito ay tuwirang tumutukoy sa Espiritu Santo o sa espiritu/disposisyong kaloob ng Diyos, kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang nagpapaliwanag sa naunang talata, at pinanatili ang balanseng triad na “kapangyarihan, pag-ibig, at pagpipigil sa sarili.”
