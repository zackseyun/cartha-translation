  rationale: Inayos ang unang parirala upang maipakita ang diwang “matapos akong mapaalalahanan” ng ὑπόμνησιν λαβών at ang ugnayan nito sa “nakatitiyak ako.” Pinahusay din ang ayos ng mga pariralang tumutukoy kina Loida at Eunice. Pinanatili ang metapora ng pananampalatayang nananahan at ang antas ng katiyakan ng orihinal.
