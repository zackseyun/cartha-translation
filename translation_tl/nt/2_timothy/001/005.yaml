  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: tl
  text: Matapos akong mapaalalahanan tungkol sa pananampalataya mong walang pagkukunwari, na unang nanahan sa lola mong si Loida at sa ina mong si Eunice, nakatitiyak ako na nananahan din ito sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Naaalala ko
  rationale: Likas na salin sa Filipino ng idyomang Griyego na literal na tumutukoy sa pagtanggap ng paalaala o paggunita.
- source_word: ἀνυποκρίτου πίστεως
  choice: pananampalataya mong walang pagkukunwari
  rationale: Pinananatili ang tahasang diwa ng ἀνυπόκριτος—tunay at hindi pakitang-tao—nang hindi nililimitahan ito sa mas malabong “tapat.”
- source_word: ἐνῴκησεν
  choice: nanahan
  rationale: Inilalarawan ng pandiwa ang pananampalatayang tumatahan sa isang tao; pinananatili ng “nanahan” ang larawang ito sa natural at marangal na Filipino.
- source_word: πέπεισμαι
  choice: Nakatitiyak ako
  rationale: Ipinahahayag ang matatag na paniniwala o katiyakan ni Pablo sa kasalukuyang kalagayan.
- source_word: μάμμῃ
  choice: lola
  rationale: Karaniwan at natural na katawagan sa modernong Filipino para sa grandmother.
theological_decisions:
- issue: Ang pananampalataya bilang nananahan sa mga tao
  choice: Pinanatili ang personipikasyong “nanahan” at “nananahan.”
  alternative: “taglay” o “nasa”
  rationale: May sadyang larawan ang ἐνοικέω ng paninirahan sa loob; hindi ito dapat gawing payak na pag-aari lamang.
- issue: Katiyakan ni Pablo tungkol sa pananampalataya ni Timoteo
  choice: “Nakatitiyak akong nananahan din ito sa iyo.”
  alternative: “Naniniwala akong nasa iyo rin ito.”
  rationale: Mas malakas ang πέπεισμαι kaysa karaniwang palagay, ngunit hindi nito ipinapaliwanag ang pinagmulan o teolohikal na katangian ng pananampalatayang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lola” at “ina” upang pagsamahin ang likas na pananalita at ang dignidad ng tekstong biblikal; inulit ang “nananahan” sa huling pangungusap upang maging malinaw ang tinutukoy ng “ito” at mapanatili ang larawan ng orihinal.
