id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: tl
  text: Kaawaan nawa ng Panginoon ang sambahayan ni Onesiforo, sapagkat madalas niya akong pinaginhawa at hindi niya ikinahiya ang aking tanikala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking pagkabilanggo”; sa literal, “ang aking tanikala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Kaawaan nawa
  rationale: Ang aorist optative ay nagpapahayag ng panalangin o hangarin. Sa Filipino, likas na naipapahayag ng “Kaawaan nawa ng Panginoon” ang diwang “nawa’y magkaloob ng awa” nang hindi nagiging mabigat ang pangungusap.
- source_word: ἔλεος
  choice: Kaawaan
  rationale: Pinananatili nito ang karaniwang biblikal na diwa ng banal na awa sa anyong pandiwang natural sa modernong Tagalog.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Ito ang karaniwang salin ng banal na titulong κύριος at hindi nito tinutukoy nang higit sa sinasabi ng talata kung sino ang referent.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: ang sambahayan ni Onesiforo
  rationale: Ang οἶκος dito ay tumutukoy sa sambahayan o yunit ng pamilya, hindi lamang sa gusali. Ang “sambahayan” ay dignified at malinaw sa Filipino.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng panalangin at angkop sa dignified na rehistro.
- source_word: πολλάκις
  choice: madalas
  rationale: Natural at tuwirang salin para sa paulit-ulit na pagkilos.
- source_word: ἀνέψυξεν
  choice: pinaginhawa
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay ng ginhawa, lakas, o kaginhawahan. Ang “pinaginhawa” ay natural at sapat na nagpapanatili sa larawan nang hindi nililimitahan ito sa emosyonal na pagpapalakas-loob.
- source_word: τὴν ἅλυσίν μου
  choice: ang aking tanikala
  rationale: Pinananatili ang kongkretong isahan ng Griyego. Maaaring kumatawan ang tanikala sa pagkabilanggo ni Pablo, kaya inilalahad ang metonimikong kahulugan sa talababa.
- source_word: οὐκ ἐπαισχύνθη
  choice: hindi niya ikinahiya
  rationale: Natural na Filipino para sa deponent na anyong nangangahulugang hindi nakadama o nagpakita ng hiya kaugnay ng tanikala ni Pablo.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa panalangin ni Pablo
  choice: Panatilihin lamang ang “Panginoon” nang walang karagdagang pagtukoy.
  alternative: Tukuyin bilang Diyos Ama o bilang Panginoong Jesus.
  rationale: ὁ κύριος lamang ang nasa Griyego. Hindi nilulutas ng salin ang referent na hindi tahasang nilinaw ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sambahayan” para sa panlipunang kahulugan ng οἶκος at pinanatili ang kongkretong larawang “tanikala,” kalakip ang paliwanag sa talababa.
