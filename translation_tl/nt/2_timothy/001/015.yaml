id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: tl
  text: 'Alam mo ito: tinalikuran ako ng lahat ng nasa Asia[a][b], kabilang na sina Figelo at Hermogenes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigang Romano sa kanlurang Asia Minor, hindi ang modernong kontinente ng Asia.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “iniwan ako” o “pinabayaan ako.” Mas literal na sinasabi ng Griyego na “tinalikuran nila ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: 'Alam mo ito:'
  rationale: Ang οἶδας ay nagpapahayag ng kasalukuyang kaalaman, at ang τοῦτο ay tumutukoy sa kasunod na sugnay na ipinakikilala ng ὅτι. Likas sa Tagalog ang tutuldok upang ihayag ang nilalaman ng nalalaman.
- source_word: ἀπεστράφησάν με
  choice: tinalikuran ako
  rationale: Pinananatili ng “tinalikuran” ang larawan ng pagtalikod at ang diwang nasirang katapatan o suporta, nang hindi agad nililimitahan ang kahulugan sa pisikal na pag-iwan.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: lahat ng nasa Asia
  rationale: Pinananatili nito ang malawak na puwersa ng πάντες at ang kontekstuwal na saklaw ng tinutukoy na pangkat, nang hindi idinaragdag na bawat naninirahan sa lalawigan ay kasama.
- source_word: Ἀσίᾳ
  choice: Asia
  rationale: Ginamit ang nakaugaliang pangalang “Asia”; nililinaw sa talababa na ang tinutukoy ay ang lalawigang Romano, hindi ang modernong kontinente.
- source_word: ὧν ἐστιν
  choice: kabilang na sina
  rationale: Natural itong paraan sa Tagalog upang ipakilala ang dalawang taong kabilang sa mas malaking pangkat.
- source_word: Φύγελος
  choice: Figelo
  rationale: Isinulat ang pangalang Griyego ayon sa bigkas at ortograpiyang madaling basahin sa modernong Filipino.
- source_word: Ἑρμογένης
  choice: Hermogenes
  rationale: Pinanatili ang karaniwang anyong madaling makilala at bigkasin sa Filipino.
theological_decisions:
- issue: Saklaw ng “lahat ng nasa Asia”
  choice: Pinanatili ang “lahat” na may saklaw na itinatakda ng konteksto—ang nauugnay na pangkat ng mga kasama o tagasuporta ni Pablo sa Asia.
  alternative: Maaari itong unawain bilang ganap na pagtukoy sa bawat Kristiyano sa lalawigan, o bilang retorikal na panaghoy na hindi nagtatakda ng eksaktong saklaw.
  rationale: Maaaring maging komprehensibo ang πάντες habang nililimitahan pa rin ng konteksto. Hindi dinagdagan o pinalambot ng salin ang pahayag ni Pablo.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinili ang “tinalikuran” upang mapanatili ang larawan sa Griyego; ginamit ang “kabilang na sina” para sa natural na daloy. Ang mga pananda ng talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
