id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: tl
  text: na siyang nagligtas sa atin at tumawag sa atin sa isang banal na pagtawag[a], hindi batay sa ating mga gawa kundi batay sa sarili niyang layunin at biyaya—ang biyayang ibinigay sa atin sa Mesiyas na si Jesus[b] bago pa ang walang-hanggang mga panahon[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumawag sa atin tungo sa banal na pagtawag” o “tumawag sa atin sa pamamagitan ng isang banal na pagtawag.” Maaaring maunawaan sa higit sa isang paraan ang anyong datibo sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “kay Cristo Jesus.” Ginamit sa pangunahing teksto ang “Mesiyas” sapagkat ang Χριστός ay nauunawaan dito bilang titulo.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “bago pa ang mga panahong walang hanggan,” “bago nagsimula ang mga kapanahunan,” o, sa mas idyomatikong pananalita, “bago nagsimula ang panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: nagligtas
  rationale: Karaniwan at teolohikal na angkop na salin ng σῴζω; pinananatili nito ang bigat ng pagliligtas ng Diyos nang hindi nagpapaliwanag nang labis.
- source_word: καλέσαντος
  choice: tumawag
  rationale: Pinananatili ang kaagapay na anyo ng ‘nagligtas’ at ang diwang teolohikal ng pagtawag ng Diyos.
- source_word: κλήσει ἁγίᾳ
  choice: sa isang banal na pagkatawag
  rationale: Malapit sa anyong Griyego at nauunawaan sa marangal na modernong Tagalog. Hindi nito lubusang nilulutas kung ang datibo ay tumutukoy sa layon, paraan, o uri ng pagtawag; inilalahad sa talababa ang mga posibilidad.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: hindi batay sa ating mga gawa
  rationale: Ang κατά ay nagsasaad dito ng batayan o pamantayan. Mas natural sa kasalukuyang Tagalog ang ‘batay sa’ kaysa literal na ‘ayon sa,’ habang pinananatili ang mahalagang terminong ‘mga gawa.’
- source_word: ἰδίαν πρόθεσιν
  choice: sarili niyang layunin
  rationale: Tumpak at natural na katumbas ng πρόθεσις; ang tinutukoy ng panghalip ay ang Diyos mula sa konteksto.
- source_word: χάριν
  choice: biyaya
  rationale: Ito ang nakagawiang saling teolohikal ng χάρις at mas ganap kaysa ‘pabor’ sa kontekstong Paulino.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: ang biyayang ibinigay sa atin
  rationale: Ang pambabaeng participle ay umaayon sa χάριν, kaya malinaw na biyaya ang ibinigay. Ang pag-uulit sa ‘biyaya’ ay nagpapalinaw nang hindi binabago ang ugnayang panggramatika.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong ‘Mesiyas’ at pinananatili ang malawak na saklaw ng ἐν sa pamamagitan ng ‘sa,’ sa halip na ipakahulugang tiyak na ‘sa pamamagitan ng.’
- source_word: πρὸ χρόνων αἰωνίων
  choice: bago pa ang mga panahong walang hanggan
  rationale: Pinananatili ang kakaibang larawan ng Griyegong ‘mga panahong walang hanggan’ nang mas natural sa Tagalog kaysa isang mahigpit na calque. Nasa talababa ang mas idyomatikong posibilidad.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o ituturing na bahagi ng pangalan
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Aktibo pa rin ang kahulugan ng Χριστός bilang titulo sa pormulang ito; kaya isinalin ang titulo sa halip na transliterahin lamang.
- issue: Lakas ng datibo sa κλήσει ἁγίᾳ
  choice: sa isang banal na pagkatawag
  alternative: sa pamamagitan ng isang banal na pagtawag; tungo sa banal na pagkatawag
  rationale: Maaaring unawain ang datibo bilang paraan, layon, o paglalarawan. Hindi dapat ipako ng salin ang konstruksyon sa iisang paliwanag lamang.
- issue: Kahulugan ng πρὸ χρόνων αἰωνίων
  choice: bago pa ang mga panahong walang hanggan
  alternative: bago nagsimula ang panahon
  rationale: Mas malapit ang pangunahing salin sa maramihang χρόνοι at sa αἰώνιος, habang kinikilala sa talababa ang natural at posibleng idyomatikong pagkaunawa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang ‘batay sa’ para sa malinaw at natural na pagpapahayag, samantalang pinanatili ang mga terminong ‘mga gawa,’ ‘layunin,’ ‘biyaya,’ at ‘Mesiyas.’ Ang pambungad na ‘na siyang’ at pangwakas na kuwit ay kumikilala na ang talata ay sintaktikong pagpapatuloy ng naunang sugnay.
