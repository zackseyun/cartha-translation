id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: tl
  text: Si Pablo[a], apostol ni Mesiyas na si Jesus, sa kalooban ng Diyos, alinsunod sa pangako ng buhay na nasa Mesiyas na si Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo Jesus” bilang salin ng “Mesiyas na si Jesus” sa dalawang paglitaw.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Ang “Pablo” ang pamantayan at likas na anyo ng pangalang Παῦλος sa modernong Tagalog.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Pinananatili nito ang kinikilalang teknikal na katawagan sa pagkakakilanlan at pagkatawag ni Pablo, sa halip na gawing pangkalahatang “sugo.”
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mesiyas Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatili ang ayos ng Griyego na nauuna ang titulo sa pangalang Jesus.
- source_word: διὰ θελήματος θεοῦ
  choice: ayon sa kalooban ng Diyos
  rationale: Sa pormulang ito ng pagtatalaga, natural na ipinahahayag ng parirala na ang pagiging apostol ni Pablo ay nakabatay sa kalooban at kapahintulutan ng Diyos.
- source_word: κατ’ ἐπαγγελίαν
  choice: alinsunod sa pangako
  rationale: Ipinapakita ng “alinsunod sa” ang ugnayan ng pagtutugma o pagsang-ayon na ipinahahayag ng κατά, nang hindi nagpapasya nang higit sa sinasabi ng teksto kung layunin ba o pamantayan ang pangako.
- source_word: ζωῆς
  choice: ng buhay
  rationale: 'Direktang pinananatili ang genitibong ugnayan sa “pangako”: ang pangako ay tungkol sa buhay.'
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: na nasa Mesiyas Jesus
  rationale: Ang “na nasa” ay maikli at natural na katumbas ng attributive prepositional phrase at pinananatili ang malawak na relasyonal na diwa ng ἐν nang hindi ito nililimitahan sa isang paliwanag gaya ng “pakikipag-isa.”
theological_decisions:
- issue: Pagkasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa dalawang paglitaw, nababanaag pa rin ang titular na kahulugan ng Χριστός; kaya “Mesiyas” ang pangunahing salin, habang inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Ugnayan ng κατ’ ἐπαγγελίαν sa pagiging apostol
  choice: alinsunod sa pangako
  alternative: para sa pangako
  rationale: Pinananatili ng “alinsunod sa” ang semantikong saklaw ng κατά bilang pagtutugma o kaugnayan at iniiwasang ipakahulugan ito nang tiyak bilang layunin.
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: nasa Mesiyas Jesus
  alternative: matatagpuan sa Mesiyas Jesus / sa pakikipag-isa sa Mesiyas Jesus
  rationale: Pinananatili ang siksik at teolohikal na malawak na pahayag na “nasa” sa halip na tahasang piliin ang lokasyon, pinagmulan, o mistikal na pakikipag-isa bilang nag-iisang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Si Pablo” bilang likas na pananda sa personal na pangalan; “apostol,” “Mesiyas,” at “alinsunod” ay pormal ngunit karaniwang nauunawaan sa kontekstong biblikal. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pambungad na pangungusap sa susunod na talata.
