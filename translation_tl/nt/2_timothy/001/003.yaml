  source_fidelity: 'Tapat ang salin sa pangunahing diwa at sintaksis ng Griyego: ang pasasalamat ay sa Diyos, ang λατρεύω ay naisasalin bilang patuloy na paglilingkod, ang ἀπὸ προγόνων ay nagpapahayag ng pagpapatuloy kaugnay ng mga ninuno, at ang pag-alaala kay Timoteo sa panalangin ay walang patid, gabi at araw. Ang “habang” para sa ὡς ay isang katanggap-tanggap na di-pangsanhing pag-uugnay at hindi nagpapataw ng isang pinagtatalunang pagbasa.'
