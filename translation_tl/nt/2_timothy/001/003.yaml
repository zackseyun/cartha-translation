id: 2TI.1.3
reference: 2 Timothy 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: tl
  text: Nagpapasalamat ako sa Diyos na pinaglilingkuran ko[a], gaya ng aking mga ninuno[b], nang may malinis na budhi, habang lagi kitang inaalaala sa aking mga panalangin[c], gabi at araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinasamba ko.” Ang pandiwang Griyego ay maaaring tumukoy sa panrelihiyong paglilingkod o pagsambang iniaalay sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “mula sa aking mga ninuno.” Maaari rin itong isaling “ayon sa minanang pananampalataya ng aking mga ninuno.” Ipinahihiwatig ng parirala ang pagpapatuloy sa kanilang pananampalataya at paglilingkod.
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “mayroon akong walang patid na pag-alaala tungkol sa iyo sa aking mga panalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Nagpapasalamat ako sa Diyos
  rationale: Ang idyomang χάριν ἔχω na may datibo ay nagpapahayag ng pasasalamat sa isang tao. Ito ang tuwiran at likas na katumbas sa modernong Tagalog.
- source_word: ᾧ λατρεύω
  choice: na pinaglilingkuran ko
  rationale: Ang λατρεύω ay tumutukoy sa paglilingkod na panrelihiyon o pagsamba sa Diyos. Napananatili ng “pinaglilingkuran” ang malawak na diwa nito nang hindi nililimitahan sa gawaing liturhikal.
- source_word: ἀπὸ προγόνων
  choice: gaya ng aking mga ninuno
  rationale: Ipinahihiwatig ng parirala ang pagpapatuloy ng paglilingkod sa Diyos na kaugnay ng minanang pananampalataya. Likas ito sa Tagalog at hindi ipinapahiwatig na literal na nagmula sa mga ninuno ang mismong kilos ni Pablo.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: nang may malinis na budhi
  rationale: Ipinapahayag ng parirala ang paraan ng paglilingkod. Karaniwan at malinaw sa Tagalog ang “malinis na budhi” para sa moral na kalinisan ng konsensiya.
- source_word: ὡς
  choice: habang
  rationale: Iniuugnay nito ang patuloy na pag-alaala sa pasasalamat bilang kasabay na kalagayan. Hindi nito sapilitang ginagawang tahasang sanhi ang pag-alaala.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: lagi kitang inaalaala
  rationale: Ang literal na estruktura ay “mayroon akong walang patid na pag-alaala tungkol sa iyo.” Ang salin ay natural sa Tagalog at pinananatili ang diwa ng patuloy na pagbanggit o pag-alaala.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: sa aking mga panalangin
  rationale: Bagaman ang δέησις ay maaaring tumukoy nang higit na tiyak sa pagsusumamo, “mga panalangin” ang malinaw at likas na salin sa kontekstong ito.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: gabi at araw
  rationale: Pinananatili nito ang ayos at idiomatikong diin ng Griyego sa regular at patuloy na pagdarasal.
theological_decisions:
- issue: Kaugnayan ng paglilingkod ni Pablo sa pananampalataya ng kanyang mga ninuno sa ἀπὸ προγόνων
  choice: Ipinakikita ang pagpapatuloy sa paglilingkod ng kanyang mga ninuno sa Diyos.
  alternative: “mula sa aking mga ninuno” o “ayon sa tradisyon ng aking mga ninuno”
  rationale: Ang “gaya ng aking mga ninuno” ay nagpapahayag ng pagpapatuloy nang hindi nagdaragdag ng tiyak na doktrina tungkol sa tradisyon o pinagmulan.
- issue: Saklaw ng kahulugan ng λατρεύω
  choice: pinaglilingkuran
  alternative: sinasamba
  rationale: Maaaring mangahulugan ang pandiwa ng pagsamba o sagradong paglilingkod. Mas napapanatili ng “pinaglilingkuran” ang lawak ng termino; inilalahad sa talababa ang lehitimong alternatibo.
- issue: Ugnayan ng ὡς sa pangunahing pahayag
  choice: habang
  alternative: yamang / sapagkat
  rationale: Pinananatili ng “habang” ang ugnayang pangkalagayan nang hindi tiyak na ipinapakahulugang ang pag-alaala ang sanhi ng pasasalamat.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “budhi” bilang karaniwan at maikli, at iniwasan ang mas teknikal na “konsensiya.” Pinanatili ang iisang pangungusap at ang “gabi at araw” upang sundan ang daloy at diin ng Griyego.
