base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: tl
  text: Ipagkaloob nawa sa kanya ng Panginoon na makasumpong siya ng awa mula sa Panginoon sa araw na iyon[a][b]—at mas mabuti mong nalalaman kung gaano kalaki ang paglilingkod niya sa Efeso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa piling ng Panginoon.” Maaaring unawain ang παρά κυρίου bilang nagsasaad ng pinagmulan (“mula sa Panginoon”) o ng pagharap o pagiging nasa piling ng Panginoon.
    reason: lexical_alternative
  - marker: b
    text: Ang “araw na iyon” ay karaniwang pahayag sa Bagong Tipan para sa darating na araw ng paghuhukom o pagbibigay-katarungan ng Diyos.
    reason: cross_reference
  - marker: c
    text: O “ang lahat ng paglilingkod na ginawa niya.” Ibinubuod ng pahayag sa Griyego ang lawak ng paglilingkod niya sa Efeso.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Ipagkaloob nawa sa kanya ng Panginoon
  rationale: Ang aorist optative ay nagpapahayag ng panalangin o hangarin. Likas at marangal sa Tagalog ang “Ipagkaloob nawa,” at pinananatili ang di-tuwirang layon na “sa kanya.”
- source_word: εὑρεῖν ἔλεος
  choice: na makasumpong siya ng awa
  rationale: Pinananatili nito ang larawang nasa idyomang Griyego na “makasumpong ng awa,” sa halip na ipakahulugang “tumanggap ng awa.”
- source_word: παρὰ κυρίου
  choice: mula sa Panginoon
  rationale: Sa kasamang genitive, ang παρά ay likas na nagpapahiwatig dito ng pinagmulan. Pinananatili rin ang pag-uulit ng “Panginoon” sa Griyego.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: sa araw na iyon
  rationale: Ito ang likas na temporal na pahayag sa Tagalog at hindi nito pinalalawak ang eskatolohikal na parirala nang higit sa sinasabi ng teksto.
- source_word: ὅσα ... διηκόνησεν
  choice: kung gaano kalaki ang paglilingkod niya
  rationale: Ibinubuod ng ὅσα ang lawak ng ginawa niyang paglilingkod. Ang pariralang ito ay natural sa Tagalog at hindi nililimitahan ang paglilingkod sa isang partikular na uri.
- source_word: ἐν Ἐφέσῳ
  choice: sa Efeso
  rationale: Karaniwang locative na salin ng parirala at natural na gamit para sa pangalan ng lungsod sa Tagalog.
- source_word: βέλτιον σὺ γινώσκεις
  choice: mas alam mo
  rationale: Pinananatili ang pahambing na diwa ng βέλτιον nang hindi nagdaragdag ng tahasang pamantayan ng paghahambing na wala sa Griyego.
theological_decisions:
- issue: Tinutukoy ng dalawang pagbanggit sa “Panginoon” (ὁ κύριος ... παρὰ κυρίου)
  choice: Parehong isinalin bilang “Panginoon” nang hindi tinutukoy kung magkaiba o iisa ang tinutukoy ng dalawang pagbanggit.
  alternative: Ang una ay si Cristo at ang ikalawa ay ang Ama; o kapwa tumutukoy kay Cristo.
  rationale: Hindi tahasang pinag-iiba ng Griyego ang dalawang pagbanggit. Pinananatili ng salin ang pag-uulit at ang teolohikal na kalabuan.
- issue: Eskatolohikal na kahulugan ng “araw na iyon”
  choice: Pinanatili ang “sa araw na iyon” nang walang paliwanag sa mismong talata.
  alternative: “sa araw ng paghuhukom” o “sa huling araw”
  rationale: Malamang na tumutukoy ito sa darating na araw ng banal na paghuhukom o pagbibigay-katarungan, ngunit ang teksto mismo ay gumagamit lamang ng nakaugaliang pariralang “araw na iyon.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “awa,” “Panginoon,” at “paglilingkod” bilang pamilyar na bokabularyong biblikal. Pinanatili ang pag-uulit ng “Panginoon,” ang di-tiyak na “araw na iyon,” at ang pahambing na “mas alam mo” upang huwag lutasin ang mga kalabuan ng orihinal.
