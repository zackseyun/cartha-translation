id: 2TI.1.11
reference: 2 Timothy 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: tl
  text: Para rito, itinalaga ako bilang tagapahayag[a], apostol, at guro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mangangaral.” Ang salitang Griyego ay tumutukoy sa isang opisyal na tagapagbalita o tagapahayag sa madla.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Para rito
  rationale: Tumutukoy ito pabalik sa naunang binanggit at nagpapahayag ng layunin o kaugnayan. Likas sa Filipino ang “Para rito” at hindi nito labis na nililinaw ang maaaring pagbatayan ng panghalip.
- source_word: ἐτέθην
  choice: itinalaga ako
  rationale: Sa konteksto ng mga tungkulin, ang pasibong anyo ng τίθημι ay nangangahulugang inatasan o hinirang, hindi basta inilagay sa isang lugar.
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang hayag na panghalip. Sapat na sa Filipino ang “ako” at hindi kailangang palakasin bilang “ako mismo,” na maaaring maging labis ang diin.
- source_word: κῆρυξ
  choice: tagapahayag
  rationale: Ipinahihiwatig ng κῆρυξ ang isang inatasang tagapagpahayag sa madla. Naipapakita ng “tagapahayag” ang gawain ng hayagang pagpapahayag nang hindi agad nag-aangkat ng makabagong katungkulan sa iglesya.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Sa pagtukoy ni Pablo sa sarili, ito ang kinikilalang katawagan sa kaniyang tungkulin at natural nang termino sa Filipino.
- source_word: διδάσκαλος
  choice: guro
  rationale: Ito ang tuwiran, malinaw, at karaniwang katumbas ng salitang Griyego.
theological_decisions:
- issue: Kung isasalin ang κῆρυξ sa tradisyonal na “mangangaral” o sa mas malawak na “tagapahayag”
  choice: tagapahayag
  alternative: mangangaral
  rationale: Mas pinananatili ng “tagapahayag” ang diwa ng isang inatasang pampublikong tagapagpahayag at iniiwasang paliitin ang salita sa isang kalaunang katawagan para sa tungkulin sa iglesya.
translation_notes:
  register: Makabago, maikli, at marangal na Filipino. Pinili ang natural na ayos na “itinalaga ako” at pinanatili ang tatlong magkakaugnay na tungkulin nang walang dagdag na paliwanag sa pangunahing teksto.
